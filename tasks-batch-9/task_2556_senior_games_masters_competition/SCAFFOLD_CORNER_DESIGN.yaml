      - name: corner_calculation_tiered_pricing_surcharge_threshold_boundary
        claim_type: tiered_pricing
        grounds:
          - calculations.athlete_fee_settlement
          - calculations.athlete_fee_settlement.constants.SURCHARGE_LOW_THRESHOLD_CENTS
        excluded_because:
          difficulty_instance: fee_surcharge_boundary_at_exactly_25000_discounted_cents
          rationale: "The 24998 / 24999 / 25000 walk across SURCHARGE_LOW_THRESHOLD_CENTS, including the fact that the tier is keyed on the post-discount amount rather than the subtotal, is exactly what that §1.8 instance asserts."

      - name: corner_calculation_waterfall_allocation_per_bucket_rounding
        claim_type: waterfall_allocation
        grounds:
          - calculations.sponsorship_recognition_allocation
          - entities.SponsorshipCommitment.fields.allocation_map
        excluded_because:
          difficulty_instance: sponsorship_per_bucket_rounding_beats_sum_then_round_by_one_cent
          rationale: "Bucket-by-bucket round_half_up before summation, and the one-cent divergence from the forbidden sum-then-round order, are asserted there with all four bucket literals pinned."

      - name: corner_calculation_weighted_scoring_risk_bands
        claim_type: weighted_scoring
        grounds:
          - calculations.medical_risk_score
          - entities.MedicalScreening.fields.risk_score
          - entities.MedicalScreening.fields.recommendation
        excluded_because:
          difficulty_instance: medical_risk_score_nested_min_max_with_tiered_bp_branch
          rationale: "The nested min/max caps, the tiered bp branch and the exact 25.0 and 60.0 band boundaries are all driven by that §1.8 instance."

      - name: corner_calculation_variant_divergence_economic_impact
        claim_type: Variant Divergence
        grounds:
