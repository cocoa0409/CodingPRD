      - name: posting_creation_fraud_keyword_beats_redirect_url_constraint
        grounds:
          - validations[priority=5]
          - validations[priority=6]
          - errors[ERR_FRAUD_KEYWORDS_DETECTED]
          - errors[ERR_INVALID_REDIRECT_URL]
        distinguishing_aspect: "Priority pair (business_safety 5) vs (business_constraint 6): a POST /api/job-postings that both carries a fraud keyword and sets apply_mode ATS_REDIRECT with no redirect URL returns ERR_FRAUD_KEYWORDS_DETECTED, not ERR_INVALID_REDIRECT_URL — the safety check precedes the coherence check."
