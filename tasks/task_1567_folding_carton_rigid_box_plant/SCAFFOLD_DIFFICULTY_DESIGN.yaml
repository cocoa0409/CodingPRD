            - { call: "POST /plant/jobs/${joba}/start-engineering", payload: {}, as: PlantAdmin, captures: { joba_v2: $.data.version } }
            - { call: "POST /plant/design-revisions", payload: { job_id: "${joba}", expected_job_version: "${joba_v2}", cad_ref: "CAD-A", blank_w_cin: 900, blank_h_cin: 600, grain_rotation_allowed: true }, as: StructuralDesigner, captures: { reva: $.data.id } }
            - { call: "POST /plant/design-revisions/${reva}/make-sample", payload: {}, as: StructuralDesigner }
            - { call: "POST /plant/design-revisions/${reva}/brand-accept", payload: {}, as: BrandQuality, as_user_id: "${cust}" }
            - { call: "GET /plant/jobs/${joba}", payload: {}, as: PlantAdmin, captures: { joba_v3: $.data.version } }
            - { call: "POST /plant/imposition-plans", payload: { job_id: "${joba}", design_revision_id: "${reva}", sheet_w_cin: 4800, sheet_h_cin: 3600, gutter_cin: 30, edge_margin_cin: 60, gripper_cin: 90 }, as: StructuralDesigner, captures: { plana: $.data.id } }
