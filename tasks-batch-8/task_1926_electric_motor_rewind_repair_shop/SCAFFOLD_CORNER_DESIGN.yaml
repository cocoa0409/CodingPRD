              captures: { cust_id: $.data.id }
          trigger:
            - call: "POST /shops/${shop_id}/work-orders"
              payload: { customer_id: "${cust_id}", motor_id: "00000000-0000-0000-0000-000000000000", priority: "STANDARD" }
