  - section: calculations
    instances:
      - name: tax_exempt_account_pays_no_tax_on_a_positive_invoice
        claim_type: constants_applied
        grounds:
          - calculations.invoice_totals
          - entities.Account.fields.tax_exempt
          - calculations.subscription_proration
        distinguishing_aspect: "With tax_exempt true the SERVICE_TAX_RATE_BP of 725 is not applied at all, so an invoice carrying an 18300 taxable PRORATION_CREDIT line reads tax_cents 0 and total_cents 18300 instead of 1327 and 19627."
        test_recipe:
          setup:
            - "A tax_exempt Account on BLADE_BASIC with an ACTIVE MONTHLY Subscription anchored 2026-06-01."
            - "The cadence upgraded to WEEKLY on 2026-05-01, which mints a DRAFT Invoice carrying a single +18300 PRORATION_CREDIT line."
          setup_api_calls:
            - call: "POST /sharpening/plan-tiers"
              payload: { code: "BLADE_BASIC", monthly_fee_cents: 12000, included_items_per_cycle: 2, overage_discount_pct: 0.15, allowed_cadences: ["WEEKLY", "BIWEEKLY", "MONTHLY"] }
              as: PlatformAdmin
              captures: { tier: $.data.id }
            - call: "POST /sharpening/accounts"
              payload: { name: "Civic Kitchens", account_type: "COMMERCIAL", zone_code: "ZONE_N", contact_email: "ops@civic.test", tax_exempt: true }
              as: PlatformAdmin
              captures: { acct: $.data.id }
            - call: "POST /sharpening/subscriptions"
              payload: { account_id: "${acct}", plan_tier_id: "${tier}", cadence: "MONTHLY", anchor_date: "2026-06-01" }
              as: AccountOwner
              as_user_id: "${acct}"
              captures: { sub: $.data.id, sub_v: $.data.version }
          trigger:
            - call: "POST /sharpening/subscriptions/${sub}/cadence"
              payload: { cadence: "WEEKLY", expected_subscription_version: "${sub_v}" }
              as: AccountOwner
              as_user_id: "${acct}"
              captures: { fee: $.data.effective_monthly_fee_cents }
            - call: "GET /sharpening/invoices"
              payload: { account_id: "${acct}", status: "DRAFT" }
              as: BillingClerk
              captures: { inv: "$.data[0].id" }
          assert:
            - "Subscription.${sub}.effective_monthly_fee_cents == 21000"
            - "Subscription.${sub}.included_items_this_cycle == 8"
            - "Subscription.${sub}.allowance_remaining == 8"
            - "Subscription.${sub}.next_service_date == 2026-05-08"
            - "Invoice.${inv}.taxable_subtotal_cents == 18300"
            - "Invoice.${inv}.tax_cents == 0"
            - "Invoice.${inv}.total_cents == 18300"

      - name: resume_reanchors_next_service_date_one_full_interval_out
        claim_type: variant_selection
        grounds:
          - calculations.next_service_date
          - state_machines.Subscription.ACTIVE_to_PAUSED
          - state_machines.Subscription.PAUSED_to_ACTIVE
        distinguishing_aspect: "The ANCHORED variant leaves next_service_date at 2026-05-01 on creation because n may be 0, while the RE_ANCHORED variant used by resume requires n >= 1 and therefore lands on 2026-05-08 even though the reset anchor is today."
        test_recipe:
          setup:
            - "One WEEKLY Subscription anchored 2026-05-01 with the clock at the 2026-05-01T00:00:00Z default, so next_service_date is 2026-05-01."
            - "The subscription then paused, which clears next_service_date."
          setup_api_calls:
            - call: "POST /sharpening/plan-tiers"
              payload: { code: "BLADE_BASIC", monthly_fee_cents: 12000, included_items_per_cycle: 2, overage_discount_pct: 0.15, allowed_cadences: ["WEEKLY", "BIWEEKLY", "MONTHLY"] }
              as: PlatformAdmin
              captures: { tier: $.data.id }
            - call: "POST /sharpening/accounts"
              payload: { name: "Blue Fork Kitchen", account_type: "RESTAURANT", zone_code: "ZONE_N", contact_email: "ops@bluefork.test" }
              as: PlatformAdmin
              captures: { acct: $.data.id }
            - call: "POST /sharpening/subscriptions"
              payload: { account_id: "${acct}", plan_tier_id: "${tier}", cadence: "WEEKLY", anchor_date: "2026-05-01" }
              as: AccountOwner
