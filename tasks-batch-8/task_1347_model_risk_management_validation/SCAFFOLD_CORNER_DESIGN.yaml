            - "Model.${m_id}.status == REGISTERED (unchanged)"

      - name: reading_out_of_order_rejected
        claim_type: violation_to_error
        grounds:
          - "validations[priority=8]"
          - "errors[ERR_READING_OUT_OF_ORDER]"
        distinguishing_aspect: "A reading whose observed_at precedes the metric's latest reading observed_at is rejected ERR_READING_OUT_OF_ORDER; equal timestamps are allowed."
        test_recipe:
