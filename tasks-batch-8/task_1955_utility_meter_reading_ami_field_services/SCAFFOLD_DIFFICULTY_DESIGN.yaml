  - rule_id: cross_entity_state_dependency
    instances:
      - name: stop_capture_gated_by_route_in_progress
        grounds:
          - state_machines.RouteStop.transitions
          - state_machines.Route.ASSIGNED_to_IN_PROGRESS
          - errors[ERR_ROUTE_NOT_IN_PROGRESS]
        distinguishing_aspect: |
          Entity pair RouteStop x Route: the same capture request is rejected while the route is
          ASSIGNED and succeeds with no other change once the route flips to IN_PROGRESS.
        test_recipe:
          setup:
            - "Handheld account with meter; period WINDOW_OPEN; route ASSIGNED to tech; stop PENDING"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: MeterOpsAdmin }
