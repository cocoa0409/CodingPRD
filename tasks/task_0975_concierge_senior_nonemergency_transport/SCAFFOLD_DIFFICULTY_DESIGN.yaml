  # ---------------------------------------------------------------------------
  # Rule 7 — cross_entity_state_dependency (different entity pairs)
  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: ride_create_blocked_when_client_suspended
        grounds:
          - validations[priority=7]
          - state_machines.Client.ACTIVE_to_SUSPENDED
          - errors[ERR_CLIENT_SUSPENDED]
        distinguishing_aspect: |
          Pair Ride -> Client: the ride creation transition is gated on the PARENT
          aggregate's state — a SUSPENDED client cannot enter new rides regardless
          of the ride's own (fresh) state.
        test_recipe:
          setup: ["Client exists and is PATCHed SUSPENDED (version captured at create)"]
          setup_api_calls:
            - { call: "POST /clients", payload: { full_name: "Ada L", mobility_aid: "NONE", assist_level_default: "DOOR_TO_DOOR", home_zone: "north", address: "1 Main St" }, as: Coordinator, captures: { cli: $.data.id, cv: $.data.version } }
            - { call: "PATCH /clients/${cli}", payload: { status: "SUSPENDED", expected_client_version: "${cv}" }, as: Coordinator }
          trigger:
            - { call: "POST /rides", payload: { client_id: "${cli}", kind: "GROCERY", scheduled_pickup_at: "2026-06-01T10:00:00Z", estimated_duration_minutes: 60, estimated_distance_miles: 10, origin_zone: "north" }, as: Coordinator, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_CLIENT_SUSPENDED; no Ride row is created"

      - name: accept_blocked_when_driver_suspended
        grounds:
          - state_machines.Assignment.OFFERED_to_ACCEPTED
          - state_machines.Driver.ACTIVE_to_SUSPENDED
          - errors[ERR_DRIVER_NOT_ELIGIBLE]
        distinguishing_aspect: |
          Pair Assignment -> Driver: the ACCEPT transition's validity depends on
          the Driver aggregate's state — an offer made while the driver was ACTIVE
          cannot be accepted after a SUSPEND, and the OFFERED offer is deliberately
          NOT auto-expired so the eligibility recheck is what fires.
        test_recipe:
          setup:
            - "ACTIVE STANDARD card; ACTIVE client; ACTIVE driver with a live OFFERED assignment for ride pickup 2026-06-05"
            - "Driver then SUSPENDed (no accepted rides, so only the offer is outstanding)"
          setup_api_calls:
            - { call: "POST /rate-cards", payload: { service_class: "STANDARD", effective_from: "2026-01-01", effective_to: "2027-01-01", hourly_rate_cents: 3000, per_mile_cents: 150, wait_per_minute_cents: 50, included_wait_minutes: 10, minimum_charge_cents: 2501, after_hours_multiplier_bp: 11000, after_hours_start_minute: 1080, wav_surcharge_cents: 0 }, as: PlatformAdmin, captures: { rc_std: $.data.id } }
            - { call: "POST /rate-cards/${rc_std}/activate", as: PlatformAdmin }
            - { call: "POST /clients", payload: { full_name: "Ada L", mobility_aid: "NONE", assist_level_default: "DOOR_TO_DOOR", home_zone: "north", address: "1 Main St" }, as: Coordinator, captures: { cli: $.data.id } }
            - { call: "POST /drivers", payload: { full_name: "Dan D", vehicle_class: "SEDAN", assist_certification: "DOOR_THROUGH_DOOR", home_zone: "north", max_daily_service_minutes: 480 }, as: Coordinator, captures: { drv: $.data.id } }
            - { call: "POST /compliance-docs", payload: { driver_id: "${drv}", doc_type: "BACKGROUND_CHECK", valid_from: "2026-01-01", valid_until: "2027-01-01" }, as: Coordinator, captures: { doc_bg: $.data.id } }
            - { call: "POST /compliance-docs/${doc_bg}/review", payload: { decision: "APPROVE" }, as: ComplianceOfficer }
            - { call: "POST /compliance-docs", payload: { driver_id: "${drv}", doc_type: "BONDING", valid_from: "2026-01-01", valid_until: "2027-01-01" }, as: Coordinator, captures: { doc_bd: $.data.id } }
            - { call: "POST /compliance-docs/${doc_bd}/review", payload: { decision: "APPROVE" }, as: ComplianceOfficer }
            - { call: "POST /compliance-docs", payload: { driver_id: "${drv}", doc_type: "INSURANCE", valid_from: "2026-01-01", valid_until: "2027-01-01" }, as: Coordinator, captures: { doc_in: $.data.id } }
            - { call: "POST /compliance-docs/${doc_in}/review", payload: { decision: "APPROVE" }, as: ComplianceOfficer }
            - { call: "POST /drivers/${drv}/status-events", payload: { event_type: "ACTIVATE" }, as: Coordinator }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T09:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /rides", payload: { client_id: "${cli}", kind: "GROCERY", scheduled_pickup_at: "2026-06-05T10:00:00Z", estimated_duration_minutes: 60, estimated_distance_miles: 10, origin_zone: "north" }, as: Client, as_user_id: "${cli}", captures: { ride: $.data.id } }
            - { call: "POST /rides/${ride}/dispatch", as: Coordinator, as_user_id: "coord-1", captures: { asg: $.data.id } }
            - { call: "POST /drivers/${drv}/status-events", payload: { event_type: "SUSPEND", reason: "complaint under review" }, as: Coordinator }
          trigger:
            - { call: "POST /assignments/${asg}/respond", payload: { decision: "ACCEPT" }, as: Driver, as_user_id: "${drv}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_DRIVER_NOT_ELIGIBLE (eligibility recheck at accept)"
            - "Assignment.${asg} remains OFFERED; Ride.${ride} remains DISPATCHING with assigned_driver_id == null"

      - name: standing_ride_blocked_without_active_rate_card
        grounds:
          - validations[priority=13]
          - errors[ERR_RATE_CARD_NOT_ACTIVE]
          - state_machines.RateCard
        distinguishing_aspect: |
          Pair StandingRide -> RateCard: series creation is gated on the EXISTENCE
          of an ACTIVE rate card covering the derived service_class at the first
          occurrence date — with no ACTIVE card the create fails even though every
          field on the StandingRide itself is well-formed.
        test_recipe:
          setup: ["ACTIVE client; NO rate cards exist at all"]
          setup_api_calls:
            - { call: "POST /clients", payload: { full_name: "Ada L", mobility_aid: "NONE", assist_level_default: "DOOR_TO_DOOR", home_zone: "north", address: "1 Main St" }, as: Coordinator, captures: { cli: $.data.id } }
          trigger:
            - { call: "POST /standing-rides", payload: { client_id: "${cli}", weekday: "MON", pickup_time_of_day_minutes: 540, kind: "GROCERY", estimated_duration_minutes: 60, estimated_distance_miles: 10, origin_zone: "north", starts_on: "2026-06-01", ends_on: "2026-07-31" }, as: Coordinator, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_RATE_CARD_NOT_ACTIVE; no StandingRide row is created"

  # ---------------------------------------------------------------------------
  # Rule 8 — resource_temporal_overlap (different interval semantics + resources)
  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: driver_buffered_window_touching_vs_overlap
        grounds:
          - calculations.buffered_window_overlap
          - errors[ERR_RIDE_OVERLAP_DRIVER]
        distinguishing_aspect: |
          Resource = Driver, semantics = buffered half-open windows
          [pickup-30, pickup+duration+30): a second ride whose buffered start
          lands one minute inside the first ride's buffered end is rejected at
          ACCEPT, while a ride starting exactly AT the boundary (touching) is
          accepted.
        test_recipe:
          setup:
            - "ACTIVE STANDARD card; ACTIVE client; one ACTIVE driver"
            - "R1 pickup 2026-06-15T10:00:00Z est 60 -> window [09:30, 11:30)"
            - "R2 pickup 2026-06-15T11:59:00Z est 30 -> window [11:29, 12:59) overlaps R1 by one minute"
            - "R3 pickup 2026-06-15T12:00:00Z est 30 -> window [11:30, 13:00) touches R1 exactly"
            - "R2 is offered BEFORE R1 is accepted, so the conflict is detected by the ACCEPT recheck"
          setup_api_calls:
            - { call: "POST /rate-cards", payload: { service_class: "STANDARD", effective_from: "2026-01-01", effective_to: "2027-01-01", hourly_rate_cents: 3000, per_mile_cents: 150, wait_per_minute_cents: 50, included_wait_minutes: 10, minimum_charge_cents: 2501, after_hours_multiplier_bp: 11000, after_hours_start_minute: 1080, wav_surcharge_cents: 0 }, as: PlatformAdmin, captures: { rc_std: $.data.id } }
            - { call: "POST /rate-cards/${rc_std}/activate", as: PlatformAdmin }
            - { call: "POST /clients", payload: { full_name: "Ada L", mobility_aid: "NONE", assist_level_default: "DOOR_TO_DOOR", home_zone: "north", address: "1 Main St" }, as: Coordinator, captures: { cli: $.data.id } }
            - { call: "POST /drivers", payload: { full_name: "Dan D", vehicle_class: "SEDAN", assist_certification: "DOOR_THROUGH_DOOR", home_zone: "north", max_daily_service_minutes: 480 }, as: Coordinator, captures: { drv: $.data.id } }
            - { call: "POST /compliance-docs", payload: { driver_id: "${drv}", doc_type: "BACKGROUND_CHECK", valid_from: "2026-01-01", valid_until: "2027-01-01" }, as: Coordinator, captures: { doc_bg: $.data.id } }
            - { call: "POST /compliance-docs/${doc_bg}/review", payload: { decision: "APPROVE" }, as: ComplianceOfficer }
            - { call: "POST /compliance-docs", payload: { driver_id: "${drv}", doc_type: "BONDING", valid_from: "2026-01-01", valid_until: "2027-01-01" }, as: Coordinator, captures: { doc_bd: $.data.id } }
            - { call: "POST /compliance-docs/${doc_bd}/review", payload: { decision: "APPROVE" }, as: ComplianceOfficer }
            - { call: "POST /compliance-docs", payload: { driver_id: "${drv}", doc_type: "INSURANCE", valid_from: "2026-01-01", valid_until: "2027-01-01" }, as: Coordinator, captures: { doc_in: $.data.id } }
            - { call: "POST /compliance-docs/${doc_in}/review", payload: { decision: "APPROVE" }, as: ComplianceOfficer }
            - { call: "POST /drivers/${drv}/status-events", payload: { event_type: "ACTIVATE" }, as: Coordinator }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-12T09:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /rides", payload: { client_id: "${cli}", kind: "GROCERY", scheduled_pickup_at: "2026-06-15T10:00:00Z", estimated_duration_minutes: 60, estimated_distance_miles: 10, origin_zone: "north" }, as: Client, as_user_id: "${cli}", captures: { r1: $.data.id } }
            - { call: "POST /rides", payload: { client_id: "${cli}", kind: "GROCERY", scheduled_pickup_at: "2026-06-15T11:59:00Z", estimated_duration_minutes: 30, estimated_distance_miles: 5, origin_zone: "north" }, as: Client, as_user_id: "${cli}", captures: { r2: $.data.id } }
            - { call: "POST /rides", payload: { client_id: "${cli}", kind: "GROCERY", scheduled_pickup_at: "2026-06-15T12:00:00Z", estimated_duration_minutes: 30, estimated_distance_miles: 5, origin_zone: "north" }, as: Client, as_user_id: "${cli}", captures: { r3: $.data.id } }
            - { call: "POST /rides/${r2}/dispatch", as: Coordinator, as_user_id: "coord-1", captures: { asg2: $.data.id } }
            - { call: "POST /rides/${r1}/dispatch", as: Coordinator, as_user_id: "coord-1", captures: { asg1: $.data.id } }
            - { call: "POST /assignments/${asg1}/respond", payload: { decision: "ACCEPT" }, as: Driver, as_user_id: "${drv}" }
          trigger:
            - { call: "POST /assignments/${asg2}/respond", payload: { decision: "ACCEPT" }, as: Driver, as_user_id: "${drv}", captures: { err: $.data.error_id } }
            - { call: "POST /rides/${r3}/dispatch", as: Coordinator, as_user_id: "coord-1", captures: { asg3: $.data.id } }
            - { call: "POST /assignments/${asg3}/respond", payload: { decision: "ACCEPT" }, as: Driver, as_user_id: "${drv}" }
            - { call: "GET /rides/${r3}", as: Coordinator, captures: { r3_status: $.data.status } }
          assert:
            - "R2 accept fails: error_id == ERR_RIDE_OVERLAP_DRIVER (11:29 < 11:30)"
            - "Assignment.${asg2} remains OFFERED; Ride.${r2} remains DISPATCHING"
            - "R3 (touching boundary 11:30 == 11:30) accepts fine: Ride.${r3}.status == ASSIGNED"

      - name: rate_card_window_touching_vs_overlap
        grounds:
          - state_machines.RateCard.DRAFT_to_ACTIVE
          - errors[ERR_RATE_WINDOW_OVERLAP]
        distinguishing_aspect: |
          Resource = RateCard (per service_class timeline), semantics = UNBUFFERED
          half-open windows: [01-01, 07-01) and [07-01, 2027-01-01) touch at the
          boundary and BOTH activate, while [06-30, 12-01) intersects the first by
          one day and is rejected — different interval semantics than the buffered
          driver windows.
        test_recipe:
          setup: ["No rate cards exist yet"]
          setup_api_calls:
            - { call: "POST /rate-cards", payload: { service_class: "STANDARD", effective_from: "2026-01-01", effective_to: "2026-07-01", hourly_rate_cents: 3000, per_mile_cents: 150, wait_per_minute_cents: 50, included_wait_minutes: 10, minimum_charge_cents: 2501, after_hours_multiplier_bp: 11000, after_hours_start_minute: 1080, wav_surcharge_cents: 0 }, as: PlatformAdmin, captures: { rc_a: $.data.id } }
            - { call: "POST /rate-cards", payload: { service_class: "STANDARD", effective_from: "2026-07-01", effective_to: "2027-01-01", hourly_rate_cents: 3200, per_mile_cents: 155, wait_per_minute_cents: 50, included_wait_minutes: 10, minimum_charge_cents: 2501, after_hours_multiplier_bp: 11000, after_hours_start_minute: 1080, wav_surcharge_cents: 0 }, as: PlatformAdmin, captures: { rc_b: $.data.id } }
            - { call: "POST /rate-cards", payload: { service_class: "STANDARD", effective_from: "2026-06-30", effective_to: "2026-12-01", hourly_rate_cents: 3100, per_mile_cents: 152, wait_per_minute_cents: 50, included_wait_minutes: 10, minimum_charge_cents: 2501, after_hours_multiplier_bp: 11000, after_hours_start_minute: 1080, wav_surcharge_cents: 0 }, as: PlatformAdmin, captures: { rc_c: $.data.id } }
          trigger:
            - { call: "POST /rate-cards/${rc_a}/activate", as: PlatformAdmin, captures: { a_status: $.data.status } }
            - { call: "POST /rate-cards/${rc_b}/activate", as: PlatformAdmin, captures: { b_status: $.data.status } }
            - { call: "POST /rate-cards/${rc_c}/activate", as: PlatformAdmin, captures: { err: $.data.error_id } }
          assert:
            - "RateCard A activates: status == ACTIVE"
            - "RateCard B activates: status == ACTIVE (touching at 2026-07-01 is NOT an intersection)"
            - "RateCard C fails: error_id == ERR_RATE_WINDOW_OVERLAP (overlaps A by the single day 2026-06-30)"
            - "RateCard C remains DRAFT"

  # ---------------------------------------------------------------------------
  # Rule 9 — compensating_invariant (different conserved quantities)
  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: credit_pool_conserved_across_issue_and_void
        grounds:
          - calculations.invoice_credit_application
          - state_machines.Invoice
          - entities.Client.fields.credit_balance_cents
        distinguishing_aspect: |
          Conserved quantity = client credit pool: for every logical instant,
          credit_balance_cents + sum(credit_applied_cents over non-VOIDED
          invoices) == 3000. Generation debits 2625 (375 + 2625), voiding the
          invoice credits exactly 2625 back (3000 + 0) — no drift.
        test_recipe:
          setup:
            - "ACTIVE STANDARD card; client with credit 3000 (seeded by a 3000 overpayment); ACTIVE driver"
            - "Completed ride fare 5250 (service 60, 10 mi, wait 25 -> billable 15)"
          setup_api_calls:
            - { call: "POST /rate-cards", payload: { service_class: "STANDARD", effective_from: "2026-01-01", effective_to: "2027-01-01", hourly_rate_cents: 3000, per_mile_cents: 150, wait_per_minute_cents: 50, included_wait_minutes: 10, minimum_charge_cents: 2501, after_hours_multiplier_bp: 11000, after_hours_start_minute: 1080, wav_surcharge_cents: 0 }, as: PlatformAdmin, captures: { rc_std: $.data.id } }
            - { call: "POST /rate-cards/${rc_std}/activate", as: PlatformAdmin }
            - { call: "POST /clients", payload: { full_name: "Ada L", mobility_aid: "NONE", assist_level_default: "DOOR_TO_DOOR", home_zone: "north", address: "1 Main St" }, as: Coordinator, captures: { cli: $.data.id } }
