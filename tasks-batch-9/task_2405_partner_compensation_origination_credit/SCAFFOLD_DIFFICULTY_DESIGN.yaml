          A third entity pair, (CreditTransition, Partner), and the dependency runs sideways
          rather than parent-to-child: the transition itself is PROPOSED and the departing
          partner is correctly NOTICE_GIVEN, yet the effectuation is refused because the
          *nominated successor* is also NOTICE_GIVEN. Naming an ACTIVE successor instead
