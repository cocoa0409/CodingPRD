              payload: { pilot_id: "${pid}", insurer_name: "Repeat Mutual", policy_number: "POL-RPT-01", coverage_limit_cents: 2000000, deductible_cents: 50000, effective_from: "2026-02-01T00:00:00Z", effective_until: "2027-02-01T00:00:00Z", indemnification_clause_accepted: true }
              as: Pilot
