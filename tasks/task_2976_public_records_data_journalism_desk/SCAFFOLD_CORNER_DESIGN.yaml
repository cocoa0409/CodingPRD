            - "trigger call 2: HTTP 412 with error_id ERR_STALE_DESK_VERSION - the payload is otherwise valid and no RecordsRequest row is created"
            - "trigger call 3: HTTP 201 on the byte-identical payload with the refreshed ${desk_v2}, proving the refusal was purely the version check"
            - "trigger call 5: HTTP 201 with run_sequence == 1"
            - "trigger call 6: HTTP 412 with error_id ERR_STALE_INVESTIGATION_VERSION - creating run 1 bumped Investigation.version, so the second create's captured ${inv_v1} is stale; a DIFFERENT error code from the desk rule"
