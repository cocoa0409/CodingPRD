scenario: |
  Generate task harder than expert level!

  2633. Beverage Program & Wine List Management (restaurant group beverage director): list
  construction by category, price band and by-the-glass rotation, allocation purchasing and
  distributor relationship management, cellar inventory with bin locations, par levels and
  depletion tracking, cost-of-goods target by category and pour-cost variance investigation,
  staff education, tasting notes and sales-contest incentives, corkage, BYO and wine-dinner
  event pricing, vintage change reprints and list versioning, by-the-glass preservation and
  spoilage write-off

domain_name: beverage-program-wine-list-management
api_prefix: "/beverage-program"

complexity_profile:
  primary_archetype: quota_allocation
  secondary_archetype: pricing_engine
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - version_pinning_on_approval

  entity_topology: graph
  # AllocationOffer/AllocationClaim form a distributor<->venue many-to-many junction;
  # ListEntry is a ListVersion<->Wine junction; Wine.predecessor_wine_id and
  # ListVersion.supersedes_version_id are self-referential chains; DepletionEntry is a
  # polymorphic-ish append-only log fanning out to six parents.

  state_machine_shape: cyclic
  # ListVersion cycles DRAFT->IN_REVIEW->DRAFT (revision rounds) and
  # PUBLISHED->REPRINT_PENDING->PUBLISHED (vintage-change reprints); AllocationOffer carries
  # two independent parallel state dimensions (fulfillment_state x compliance_state).

  relationship_patterns:
    - one_to_many
    - many_to_many
    - self_referential
    - cross_aggregate

  role_model: segregation_of_duties
  # The user who submits a ListVersion for review may not publish it; the user who submits a
  # SpoilageWriteOff may not approve it. Enforced on X-User-ID, not merely on role.

  consistency_model: immediate

  difficulty_level: expert_plus
  # 15 entities / 67 endpoints / 41 error codes / 10 calculations (4 with divergent variants) /
  # 8 state machines (2 non-linear on distinct entities) / 2 OCC races.

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

constants_global:
  DEFAULT_CLOCK_UTC: "2026-08-01T00:00:00Z"
  WINE_CATEGORIES: [SPARKLING, WHITE, ROSE, RED, DESSERT, FORTIFIED]
  BTG_SPOILAGE_ALLOWANCE_POURS: 1
  EVENT_POUR_SIZE_ML: 100
  EVENT_TURNOVER_BUFFER_MINUTES: 120
  MAX_REVISION_ROUNDS: 3
  REPRINT_THRESHOLD_ENTRIES: 2
  MAX_PRESERVATION_HOURS: 720
  LARGE_PARTY_THRESHOLD: 8
  LARGE_PARTY_CORKAGE_DISCOUNT_PCT: 25.0
  PAR_URGENT_FRACTION: 0.5
  VARIANCE_RESTRICTED_PCT: 3.00
  VARIANCE_FROZEN_PCT: 6.00

# ---------------------------------------------------------------------------
# §1.1 Entity-Relationship Table
# ---------------------------------------------------------------------------
entities:
  - name: Venue
    parent: null
    common_fields: true
    entity_kind: resource
    fields:
      - name: name
        type: string
        source: input
        description: Restaurant name inside the group.
        constraints: "1..120 chars"
      - name: venue_code
        type: string
        source: input
        description: Short operator code for the venue.
        constraints: "1..12 chars; globally unique (ERR_VENUE_CODE_TAKEN)"
      - name: costing_method
        type: enum
        source: input
        description: Selects which variant of `lot_depletion_cogs` this venue uses.
        default: FIFO
        constraints: "FIFO | WEIGHTED_AVERAGE"
      - name: cogs_target_pct_by_category
        type: object
        source: input
        description: >-
          Cost-of-goods target percentage per wine category. Drives `list_entry_bottle_price`
          and `list_entry_glass_price`.
        constraints: "keys MUST be exactly the six WINE_CATEGORIES; each value number in 5.0..60.0"
      - name: event_cogs_target_pct
        type: number
        source: input
        description: Cost-of-goods target used by `wine_dinner_ticket_price`.
        default: 30.0
        constraints: "5.0..60.0"
      - name: corkage_fee_cents
        type: integer
        source: input
        description: Per-bottle corkage fee before waiver and large-party discount.
        default: 3500
        constraints: ">= 0"
      - name: corkage_waiver_purchase_ratio
        type: integer
        source: input
        description: Bottles purchased from the list required to waive one corkage bottle.
        default: 2
        constraints: ">= 1"
      - name: byo_bottle_limit_per_party
        type: integer
        source: input
        description: Maximum BYO bottles a single party may bring.
        default: 2
        constraints: ">= 0"
      - name: byo_prohibited_categories
        type: array
        source: input
        description: Wine categories this venue refuses as BYO.
        default: []
        constraints: "subset of WINE_CATEGORIES"
      - name: priority_rank
        type: integer
        source: input
        description: >-
          Allocation priority used as the second sort key in `allocation_waterfall_grant`
          remainder distribution. Lower value = higher priority.
        default: 3
        constraints: "1..5"
      - name: last_variance_pct
        type: number
        source: computed
        description: >-
          `variance_pct` produced by the most recent pour-cost run. Drives `program_posture`.
        default: 0.00
        constraints: "2 decimal places, signed"
      - name: last_pour_cost_run_at
        type: datetime
        source: computed
        description: Logical-clock instant of the most recent pour-cost run; null before the first run.
      - name: program_posture
        type: enum
        source: computed
        description: >-
          Derived gate over publish and event-confirm operations. FROZEN when
          last_variance_pct > 6.00 OR at least one VarianceInvestigation for this venue is in
          state ESCALATED; RESTRICTED when 3.00 < last_variance_pct <= 6.00; OPEN otherwise.
        default: OPEN
        constraints: "OPEN | RESTRICTED | FROZEN"
      - name: cogs_ledger_cents
        type: integer
        source: computed
        description: >-
          Signed running sum of DepletionEntry.cogs_cents for this venue across all reasons.
          Conserved quantity for the monetary compensating-action invariant.
        default: 0
      - name: revenue_ledger_cents
        type: integer
        source: computed
        description: Signed running sum of DepletionEntry.revenue_cents for this venue.
        default: 0

  - name: Distributor
    parent: null
    common_fields: true
    entity_kind: resource
    fields:
      - name: name
        type: string
        source: input
        description: Distributor / importer legal name.
        constraints: "1..120 chars"
      - name: license_number
        type: string
        source: input
        description: Alcohol wholesale license identifier.
        constraints: "1..32 chars"
      - name: allocation_tier
        type: enum
        source: input
        description: Relationship tier used for reporting only; does not affect allocation math.
        default: B
        constraints: "A | B | C"
      - name: on_time_delivery_pct
        type: number
        source: input
        description: Relationship-management scorecard value.
        default: 95.0
        constraints: "0.0..100.0"
      - name: compliance_state
        type: enum
        source: computed
        description: >-
          License compliance standing set by POST /distributors/{id}/compliance-reviews.
          Cascades into every AllocationOffer.compliance_state owned by this distributor.
        default: PENDING_REVIEW
        constraints: "PENDING_REVIEW | CLEARED | HOLD"
      - name: last_review_note
        type: string
        source: computed
        description: Note captured by the most recent compliance review; null before the first review.

  - name: Wine
    parent: null
    common_fields: true
    entity_kind: resource
    fields:
      - name: producer
        type: string
        source: input
        description: Producer / domaine name.
        constraints: "1..120 chars"
      - name: cuvee
        type: string
        source: input
        description: Cuvee or bottling name.
        constraints: "1..120 chars"
      - name: vintage_year
        type: integer
        source: input
        description: Vintage year of this SKU. A vintage change is a new Wine row, not an edit.
        constraints: "1900..2100"
      - name: category
        type: enum
        source: input
        description: Wine category; selects the venue COGS target and the preservation base hours.
        constraints: "one of WINE_CATEGORIES"
      - name: bottle_size_ml
        type: integer
        source: input
        description: Bottle volume in millilitres; divisor for pours-per-bottle math.
        default: 750
        constraints: "187..6000"
      - name: reference_cost_cents
        type: integer
        source: input
        description: Catalogue replacement cost per bottle; the pricing input (NOT the lot cost).
        constraints: ">= 1"
      - name: case_pack
        type: integer
        source: input
        description: Bottles per case; reorder quantities are rounded up to whole cases.
        default: 6
        constraints: "1..24"
      - name: is_allocated
        type: boolean
        source: input
        description: >-
          True when the SKU is distributor-allocated. Adds the allocated premium in
          `list_entry_bottle_price` and is required for RESERVE-zone bin storage.
        default: false
      - name: predecessor_wine_id
        type: string
        source: input
        description: "FK -> Wine.id; nullable; set when this SKU is the next vintage of an existing SKU."
      - name: successor_count
        type: integer
        source: computed
        description: Number of Wine rows whose predecessor_wine_id equals this row's id.
        default: 0

  - name: AllocationOffer
    parent: null
    common_fields: true
    entity_kind: resource
    fields:
      - name: distributor_id
        type: string
        source: input
        description: "FK -> Distributor.id; the offering distributor."
      - name: wine_id
        type: string
        source: input
        description: "FK -> Wine.id; the allocated SKU on offer."
      - name: offered_bottles
        type: integer
        source: input
        description: Finite pool of bottles the distributor is releasing to the group.
        constraints: ">= 1"
      - name: unit_cost_cents
        type: integer
        source: input
        description: Landed cost per bottle written onto every InventoryLot created from this offer.
        constraints: ">= 1"
      - name: response_deadline
        type: datetime
        source: input
        description: Claims are refused once the logical clock reaches this instant.
        constraints: "ISO 8601 UTC"
      - name: fulfillment_state
        type: enum
        source: computed
        description: >-
          First parallel state dimension. OPEN while claims may be filed; ALLOCATED once the
          waterfall has run; CLOSED once every granted claim has been received or withdrawn.
        default: OPEN
        constraints: "OPEN | ALLOCATED | CLOSED"
      - name: compliance_state
        type: enum
        source: computed
        description: >-
          Second parallel state dimension, moved only by distributor compliance reviews and
          independent of fulfillment_state.
        default: PENDING_LICENSE_CHECK
        constraints: "PENDING_LICENSE_CHECK | CLEARED | BLOCKED"
      - name: unallocated_bottles
        type: integer
        source: computed
        description: >-
          offered_bottles minus the sum of granted_bottles over claims in state
          IN {GRANTED, PARTIALLY_GRANTED, RECEIVED}. Conserved-quantity term for the
          allocation invariant.
        default: 0
      - name: claim_count
        type: integer
        source: computed
        description: Number of AllocationClaim rows filed against this offer in any state.
        default: 0
      - name: allocated_at
        type: datetime
        source: computed
        description: Logical-clock instant the waterfall ran; null while fulfillment_state == OPEN.

  - name: AllocationClaim
    parent: AllocationOffer
    common_fields: true
    entity_kind: resource
    fields:
      - name: offer_id
        type: string
        source: input
        description: "FK -> AllocationOffer.id; the offer being competed for."
      - name: venue_id
        type: string
        source: input
        description: "FK -> Venue.id; the claiming venue. Unique per (offer_id, venue_id)."
      - name: requested_bottles
        type: integer
        source: input
        description: Bottles the venue asks for; also the per-claim cap in the waterfall.
        constraints: ">= 1 and <= offer.offered_bottles"
      - name: granted_bottles
        type: integer
        source: computed
        description: Bottles awarded by `allocation_waterfall_grant`.
        default: 0
      - name: raw_share
        type: number
        source: computed
        description: >-
          Unrounded proportional share pool * requested_bottles / total_requested, stored to
          4 decimal places for auditability; null until the waterfall runs.
      - name: remainder_awarded
        type: boolean
        source: computed
        description: True when this claim received a remainder bottle in the waterfall's step 4.
        default: false
      - name: state
        type: enum
        source: computed
        description: Claim lifecycle state.
        default: REQUESTED
        constraints: "REQUESTED | GRANTED | PARTIALLY_GRANTED | REJECTED | WITHDRAWN | RECEIVED"

  - name: CellarBin
    parent: Venue
    common_fields: true
    entity_kind: resource
    fields:
      - name: venue_id
        type: string
        source: input
        description: "FK -> Venue.id; owning venue."
      - name: bin_code
        type: string
        source: input
        description: Physical bin label.
        constraints: "1..12 chars; unique per venue_id (ERR_BIN_CODE_TAKEN)"
      - name: zone
        type: enum
        source: input
        description: >-
          Storage zone. RESERVE accepts only wines with is_allocated == true
          (ERR_BIN_ZONE_MISMATCH).
        constraints: "CELLAR | BACKBAR | RESERVE | OFFSITE"
      - name: capacity_bottles
        type: integer
        source: input
        description: Hard aggregate bottle capacity of the bin.
        constraints: ">= 1"
      - name: temperature_controlled
        type: boolean
        source: input
        description: Reporting flag for cellar conditions.
        default: true
      - name: bottles_stored
        type: integer
        source: computed
        description: >-
          Sum of InventoryLot.bottles_on_hand for lots whose bin_id is this bin and whose
          state == ON_HAND.
        default: 0
      - name: utilization_pct
        type: number
        source: computed
        description: round_half_up(bottles_stored * 100 / capacity_bottles, 2).
        default: 0.00
      - name: bin_state
        type: enum
        source: computed
        description: FULL when bottles_stored == capacity_bottles, otherwise ACTIVE.
        default: ACTIVE
        constraints: "ACTIVE | FULL"

  - name: InventoryLot
    parent: CellarBin
    common_fields: true
    entity_kind: resource
    fields:
      - name: venue_id
        type: string
        source: input
        description: "FK -> Venue.id; venue holding the lot."
      - name: wine_id
        type: string
        source: input
        description: "FK -> Wine.id; SKU in the lot."
      - name: bin_id
        type: string
        source: input
        description: "FK -> CellarBin.id; bin location. Must belong to venue_id."
      - name: source_claim_id
        type: string
        source: system
        description: "FK -> AllocationClaim.id; nullable; set only for lots created by claim receipt."
      - name: bottles_received
        type: integer
        source: input
        description: Immutable count of bottles that entered the cellar in this lot.
        constraints: ">= 1"
      - name: bottles_on_hand
        type: integer
        source: computed
        description: >-
          bottles_received minus the signed sum of DepletionEntry.bottles for this lot.
          Never negative.
        default: 0
      - name: bottles_committed
        type: integer
        source: computed
        description: >-
          Count of BtgSlot rows referencing this lot whose state IN {OPEN, EXPIRED}. Available
          bottles are bottles_on_hand - bottles_committed.
        default: 0
      - name: unit_cost_cents
        type: integer
        source: input
        description: Landed cost per bottle for this lot; the FIFO / weighted-average cost input.
        constraints: ">= 1"
      - name: received_at
        type: datetime
        source: input
        description: >-
          Receipt instant; primary sort key for FIFO consumption. MUST NOT be later than the
          logical clock (ERR_RECEIVED_AT_IN_FUTURE).
        constraints: "ISO 8601 UTC"
      - name: state
        type: enum
        source: computed
        description: ON_HAND while bottles remain; DEPLETED at zero; WRITTEN_OFF when fully spoiled.
        default: ON_HAND
        constraints: "ON_HAND | DEPLETED | WRITTEN_OFF"

  - name: DepletionEntry
    parent: InventoryLot
    common_fields: false
    entity_kind: event
    fields:
      - name: venue_id
        type: string
        source: system
        description: "FK -> Venue.id; venue whose ledgers this entry moves."
      - name: wine_id
        type: string
        source: system
        description: "FK -> Wine.id; SKU depleted."
      - name: lot_id
        type: string
        source: system
        description: "FK -> InventoryLot.id; lot the bottles came out of."
      - name: list_entry_id
        type: string
        source: system
        description: "FK -> ListEntry.id; nullable; set for by-the-glass and bottle sales."
      - name: btg_slot_id
        type: string
        source: system
        description: "FK -> BtgSlot.id; nullable; set for slot-close depletions."
      - name: event_id
        type: string
        source: system
        description: "FK -> WineDinnerEvent.id; nullable; set for event settlements and voids."
      - name: write_off_id
        type: string
        source: system
        description: "FK -> SpoilageWriteOff.id; nullable; set for approvals and reversals."
      - name: reason
        type: enum
        source: system
        description: >-
          Classification that decides the THEORETICAL input set: only SALE_BTG, SALE_BOTTLE and
          EVENT enter the theoretical pour cost.
        constraints: "SALE_BTG | SALE_BOTTLE | EVENT | SPOILAGE | STAFF_EDUCATION | REVERSAL"
      - name: bottles
        type: integer
        source: system
        description: Signed whole-bottle movement; negative on REVERSAL entries.
      - name: pours
        type: integer
        source: system
        description: Signed pour count attributable to this entry; 0 for whole-bottle movements.
        default: 0
      - name: cogs_cents
        type: integer
        source: system
        description: Signed cost of goods recognised by this entry.
      - name: revenue_cents
        type: integer
        source: system
        description: Signed revenue recognised by this entry.
      - name: occurred_at
        type: datetime
        source: system
        description: Logical-clock instant of the movement; the period filter uses this field.

  - name: WineList
    parent: Venue
    common_fields: true
    entity_kind: resource
    fields:
      - name: venue_id
        type: string
        source: input
        description: "FK -> Venue.id; the venue this list belongs to."
      - name: name
        type: string
        source: input
        description: List name, e.g. "Dinner List" or "Reserve Book".
        constraints: "1..80 chars"
      - name: next_version_no
        type: integer
        source: computed
        description: version_no the next ListVersion created under this list will receive.
        default: 1
      - name: published_version_no
        type: integer
        source: computed
        description: >-
          version_no of the ListVersion whose state IN {PUBLISHED, REPRINT_PENDING}; null when
          no version is live. At most one such version exists per list.

  - name: ListVersion
    parent: WineList
    common_fields: true
    entity_kind: resource
    fields:
      - name: wine_list_id
        type: string
        source: input
        description: "FK -> WineList.id; owning list."
      - name: version_no
        type: integer
        source: computed
        description: Monotonic per-list version number taken from WineList.next_version_no.
      - name: supersedes_version_id
        type: string
        source: input
        description: "FK -> ListVersion.id; nullable; the live version this draft is intended to replace."
      - name: state
        type: enum
        source: computed
        description: Version lifecycle state.
        default: DRAFT
        constraints: "DRAFT | IN_REVIEW | PUBLISHED | REPRINT_PENDING | SUPERSEDED | ARCHIVED"
      - name: entry_count
        type: integer
        source: computed
        description: Number of ListEntry rows under this version.
        default: 0
      - name: stale_entry_count
        type: integer
        source: computed
        description: Number of ListEntry rows under this version with vintage_stale == true.
        default: 0
      - name: out_of_stock_entry_count
        type: integer
        source: computed
        description: Number of ListEntry rows under this version with availability_state == OUT_OF_STOCK.
        default: 0
      - name: reprint_required
        type: boolean
        source: computed
        description: Set true the first time any entry under this version becomes vintage_stale.
        default: false
      - name: revision_round
        type: integer
        source: computed
        description: >-
          Count of completed IN_REVIEW -> DRAFT request-changes cycles. A fourth cycle is
          refused (MAX_REVISION_ROUNDS = 3).
        default: 0
      - name: submitted_by_user_id
        type: string
        source: computed
        description: X-User-ID of the actor who last submitted this version for review; null before.
      - name: published_by_user_id
        type: string
        source: computed
        description: X-User-ID of the actor who published this version; null before publication.
      - name: published_at
        type: datetime
        source: computed
        description: Logical-clock instant of publication; null before publication.
      - name: printed_at
        type: datetime
        source: computed
        description: Logical-clock instant of the last reprint acknowledgement; null before.

  - name: ListEntry
    parent: ListVersion
    common_fields: true
    entity_kind: resource
    fields:
      - name: list_version_id
        type: string
        source: input
        description: "FK -> ListVersion.id; the version this entry lives on."
      - name: wine_id
        type: string
        source: input
        description: "FK -> Wine.id; the listed SKU. Unique per list_version_id."
      - name: bottle_price_cents
        type: integer
        source: computed
        description: Output of `list_entry_bottle_price`, frozen at entry creation.
      - name: price_band
        type: enum
        source: computed
        description: >-
          Band derived from bottle_price_cents: VALUE <= 6000; CORE 6001..12000;
          PREMIUM 12001..25000; RESERVE > 25000.
        constraints: "VALUE | CORE | PREMIUM | RESERVE"
      - name: by_the_glass
        type: boolean
        source: input
        description: Whether the wine is in the by-the-glass rotation.
        default: false
      - name: pour_size_ml
        type: integer
        source: input
        description: >-
          By-the-glass pour size; required when by_the_glass is true
          (ERR_POUR_SIZE_REQUIRED), null otherwise.
        constraints: "25..500"
      - name: glass_price_cents
        type: integer
        source: computed
        description: Output of `list_entry_glass_price`; null when by_the_glass is false.
      - name: effective_pours
        type: integer
        source: computed
        description: >-
          floor(wine.bottle_size_ml / pour_size_ml) - BTG_SPOILAGE_ALLOWANCE_POURS; null when
          by_the_glass is false. MUST be >= 1 (ERR_POUR_SIZE_TOO_LARGE).
      - name: par_bottles
        type: integer
        source: input
        description: Target bottles on hand for this listing; drives `par_reorder_quantity`.
        default: 0
        constraints: ">= 0"
      - name: tasting_note
        type: string
        source: input
        description: Staff-education tasting note printed on the list.
        constraints: "0..500 chars"
      - name: education_verified
        type: boolean
        source: input
        description: Whether floor staff have been signed off on this wine; weighted in contest points.
        default: false
      - name: availability_state
        type: enum
        source: computed
        description: >-
          AVAILABLE when at least one InventoryLot for (list version's venue, wine_id) has
          state == ON_HAND and bottles_on_hand > 0; OUT_OF_STOCK otherwise.
        default: OUT_OF_STOCK
        constraints: "AVAILABLE | OUT_OF_STOCK"
      - name: vintage_stale
        type: boolean
        source: computed
        description: >-
          Set true when a successor vintage of wine_id is created while this entry's version is
          live; cleared by a reprint acknowledgement.
        default: false
      - name: contest_points
        type: number
        source: computed
        description: Output of `list_entry_contest_points`; the staff sales-contest incentive score.
        default: 0.00
      - name: sort_rank
        type: integer
        source: input
        description: Print order of the entry within its category block.
        constraints: ">= 1"

  - name: BtgSlot
    parent: Venue
    common_fields: true
    entity_kind: resource
    fields:
      - name: venue_id
        type: string
        source: input
        description: "FK -> Venue.id; the venue whose by-the-glass rail holds this slot."
      - name: list_entry_id
        type: string
        source: input
        description: "FK -> ListEntry.id; the by-the-glass listing being poured."
      - name: lot_id
        type: string
        source: input
        description: "FK -> InventoryLot.id; the lot the opened bottle is drawn from."
      - name: slot_index
        type: integer
        source: input
        description: Physical preservation-rail position; occupancy is checked per (venue_id, slot_index).
        constraints: "1..24"
      - name: preservation_method
        type: enum
        source: input
        description: Preservation technique; multiplies the category base hours.
        constraints: "ARGON | VACUUM | COOLER | NONE"
      - name: opened_at
        type: datetime
        source: computed
        description: Logical clock at creation; start of the closed-closed occupancy interval.
      - name: preservation_expires_at
        type: datetime
        source: computed
        description: Output of `btg_preservation_expiry`; end of the closed-closed occupancy interval.
      - name: effective_pours
        type: integer
        source: computed
        description: Copied from the ListEntry at open time so later PATCHes cannot move the target.
      - name: pours_sold
        type: integer
        source: computed
        description: Pours sold, recorded at close.
        default: 0
      - name: staff_education_pours
        type: integer
        source: computed
        description: Pours poured for staff education, recorded at close.
        default: 0
      - name: spoiled_pours
        type: integer
        source: computed
        description: effective_pours - pours_sold - staff_education_pours, recorded at close.
        default: 0
      - name: state
        type: enum
        source: computed
        description: Slot lifecycle state.
        default: OPEN
        constraints: "OPEN | CLOSED | EXPIRED | WRITTEN_OFF"

  - name: SpoilageWriteOff
    parent: InventoryLot
    common_fields: true
    entity_kind: resource
    fields:
      - name: venue_id
        type: string
        source: input
        description: "FK -> Venue.id; venue absorbing the loss. Must equal lot.venue_id."
      - name: lot_id
        type: string
        source: input
        description: "FK -> InventoryLot.id; the lot being written down."
      - name: btg_slot_id
        type: string
        source: input
        description: "FK -> BtgSlot.id; nullable; set when the loss is an expired preservation slot."
      - name: bottles
        type: integer
        source: input
        description: Bottles to write off; must not exceed lot.bottles_on_hand - lot.bottles_committed.
        constraints: ">= 1"
      - name: reason_code
        type: enum
        source: input
        description: Loss classification.
        constraints: "CORKED | OXIDIZED | BREAKAGE | PRESERVATION_EXPIRY | TEMPERATURE"
      - name: narrative
        type: string
        source: input
        description: Free-text justification retained for audit.
        constraints: "1..500 chars"
      - name: state
        type: enum
        source: computed
        description: Write-off lifecycle state.
        default: SUBMITTED
        constraints: "SUBMITTED | APPROVED | REJECTED | REVERSED"
      - name: submitted_by_user_id
        type: string
        source: system
        description: X-User-ID of the submitter; the approver MUST differ (ERR_SEGREGATION_OF_DUTIES).
      - name: approved_by_user_id
        type: string
        source: computed
        description: X-User-ID of the approving Controller; null until approval.
      - name: cogs_cents
        type: integer
        source: computed
        description: >-
          Cost recognised at approval, from `lot_depletion_cogs` restricted to this lot;
          null until approval.
      - name: resolution_note
        type: string
        source: computed
        description: Note supplied on reject or reverse; null while SUBMITTED or APPROVED.

  - name: WineDinnerEvent
    parent: Venue
    common_fields: true
    entity_kind: resource
    fields:
      - name: venue_id
        type: string
        source: input
        description: "FK -> Venue.id; host venue; the overlap resource for event windows."
      - name: list_version_id
        type: string
        source: input
        description: "FK -> ListVersion.id; the live version the pour plan is drawn from."
      - name: name
        type: string
        source: input
        description: Event name.
        constraints: "1..120 chars"
      - name: starts_at
        type: datetime
        source: input
        description: Half-open window start (inclusive).
        constraints: "ISO 8601 UTC; strictly before ends_at"
      - name: ends_at
        type: datetime
        source: input
        description: Half-open window end (exclusive).
        constraints: "ISO 8601 UTC"
      - name: seat_count
        type: integer
        source: input
        description: Seats sold; multiplies per-seat cost and gross revenue.
        constraints: "1..400"
      - name: pour_plan
        type: array
        source: input
        description: >-
          Array of objects { list_entry_id, pours_per_seat }. Every list_entry_id MUST belong to
          list_version_id (ERR_POUR_PLAN_ENTRY_MISMATCH). 1..12 lines, pours_per_seat 1..6.
      - name: state
        type: enum
        source: computed
        description: Event lifecycle state.
        default: PLANNED
        constraints: "PLANNED | PRICED | CONFIRMED | SETTLED | SETTLEMENT_VOIDED | CANCELLED"
      - name: beverage_cost_per_seat_cents
        type: integer
        source: computed
        description: Step 1 output of `wine_dinner_ticket_price`; null before pricing.
      - name: provisional_gross_cents
        type: integer
        source: computed
        description: Step 2 output; the per-seat price the volume tier is keyed on. Null before pricing.
      - name: tier_discount_pct
        type: number
        source: computed
        description: Step 3 output, derived from provisional_gross_cents * seat_count. Null before pricing.
      - name: final_ticket_price_cents
        type: integer
        source: computed
        description: Step 4 output; the ticket price charged per seat. Null before pricing.
      - name: projected_pour_cost_pct
        type: number
        source: computed
        description: Step 6 output; projected beverage pour cost for the event. Null before pricing.
      - name: pinned_version_no
        type: integer
        source: computed
        description: >-
          ListVersion.version_no captured at confirmation. Version-pinning on approval; settle
          is refused when the pinned version is no longer live.
      - name: pinned_version_stale
        type: boolean
        source: computed
        description: >-
          Set true when the pinned ListVersion leaves state PUBLISHED after confirmation
          (reprint pending, superseded or archived).
        default: false
      - name: settled_cogs_cents
        type: integer
        source: computed
        description: Cost of goods recognised at settlement by `lot_depletion_cogs`; null before.
      - name: settled_revenue_cents
        type: integer
        source: computed
        description: final_ticket_price_cents * seat_count, recognised at settlement; null before.

  - name: VarianceInvestigation
    parent: Venue
    common_fields: true
    entity_kind: resource
    fields:
      - name: venue_id
        type: string
        source: system
        description: "FK -> Venue.id; venue under investigation."
      - name: triggered_variance_pct
        type: number
        source: system
        description: variance_pct of the pour-cost run that opened the investigation.
      - name: period_start
        type: datetime
        source: system
        description: Inclusive start of the investigated period, copied from the run.
      - name: period_end
        type: datetime
        source: system
        description: Exclusive end of the investigated period, copied from the run.
      - name: state
        type: enum
        source: computed
        description: Investigation lifecycle state; ESCALATED forces the venue posture to FROZEN.
        default: OPEN
        constraints: "OPEN | ESCALATED | RESOLVED_EXPLAINED | RESOLVED_ADJUSTED"
      - name: escalation_note
        type: string
        source: computed
        description: Note supplied at escalation; null while OPEN.
      - name: resolution_note
        type: string
        source: computed
        description: Note supplied at resolution; null before resolution.
      - name: resolved_at
        type: datetime
        source: computed
        description: Logical-clock instant of resolution; null before resolution.

# ---------------------------------------------------------------------------
# §1.2 State Machine Table
# ---------------------------------------------------------------------------
state_machines:
  - entity: ListVersion
    shape: cyclic
    initial_state: DRAFT
    terminal_states: [SUPERSEDED, ARCHIVED]
    transitions:
      - id: DRAFT_to_IN_REVIEW
        from: DRAFT
        to: IN_REVIEW
        trigger: "POST /list-versions/{list_version_id}/submit"
        actor: VenueSommelier | BeverageDirector
        preconditions:
          - "list_version.state == DRAFT"
          - "list_version.entry_count >= 1 (ERR_EMPTY_LIST_VERSION)"
        side_effects:
          - "sets list_version.submitted_by_user_id = X-User-ID"
          - "increments list_version.version by 1"
      - id: IN_REVIEW_to_DRAFT
        from: IN_REVIEW
        to: DRAFT
        trigger: "POST /list-versions/{list_version_id}/request-changes"
        actor: BeverageDirector
        preconditions:
          - "list_version.state == IN_REVIEW"
          - "list_version.revision_round < 3 (MAX_REVISION_ROUNDS; else ERR_REVISION_LIMIT_REACHED)"
        side_effects:
          - "increments list_version.revision_round by 1"
          - "clears list_version.submitted_by_user_id to null"
        note: "The revision cycle that makes this machine non-linear; entries may be edited again while DRAFT."
      - id: IN_REVIEW_to_PUBLISHED
        from: IN_REVIEW
        to: PUBLISHED
        trigger: "POST /list-versions/{list_version_id}/publish"
        actor: BeverageDirector
        preconditions:
          - "list_version.state == IN_REVIEW (ERR_LIST_VERSION_NOT_IN_REVIEW)"
          - "X-User-ID != list_version.submitted_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
          - "venue.program_posture != FROZEN, where venue = WineList.venue_id of this version (ERR_VENUE_PROGRAM_FROZEN)"
        side_effects:
          - "sets list_version.published_at = logical clock and published_by_user_id = X-User-ID"
          - "sets WineList.published_version_no = list_version.version_no"
          - "when list_version.supersedes_version_id is not null: that ListVersion transitions PUBLISHED_to_SUPERSEDED (or REPRINT_PENDING_to_SUPERSEDED)"
          - "recomputes availability_state on every ListEntry of this version from current InventoryLot rows, then sets out_of_stock_entry_count"
      - id: PUBLISHED_to_REPRINT_PENDING
        from: PUBLISHED
        to: REPRINT_PENDING
        trigger: "system: stale_entry_count reaches REPRINT_THRESHOLD_ENTRIES (2) after a successor vintage is created"
        actor: system
        preconditions:
          - "list_version.state == PUBLISHED"
          - "list_version.stale_entry_count >= 2"
        side_effects:
          - "sets list_version.reprint_required = true"
          - "sets pinned_version_stale = true on every WineDinnerEvent whose list_version_id is this version and whose state == CONFIRMED"
      - id: REPRINT_PENDING_to_PUBLISHED
        from: REPRINT_PENDING
        to: PUBLISHED
        trigger: "POST /list-versions/{list_version_id}/mark-reprinted"
        actor: VenueSommelier | BeverageDirector
        preconditions:
          - "list_version.state == REPRINT_PENDING"
        side_effects:
          - "sets list_version.printed_at = logical clock"
          - "sets vintage_stale = false on every ListEntry of this version and sets stale_entry_count = 0"
          - "sets list_version.reprint_required = false"
        note: "Second cycle of this machine: PUBLISHED -> REPRINT_PENDING -> PUBLISHED."
      - id: PUBLISHED_to_SUPERSEDED
        from: PUBLISHED
        to: SUPERSEDED
        trigger: "system: a successor version citing this one via supersedes_version_id is published"
        actor: system
        preconditions:
          - "list_version.state == PUBLISHED"
        side_effects:
          - "sets pinned_version_stale = true on every CONFIRMED WineDinnerEvent pinned to this version"
      - id: REPRINT_PENDING_to_SUPERSEDED
        from: REPRINT_PENDING
        to: SUPERSEDED
        trigger: "system: a successor version citing this one via supersedes_version_id is published"
        actor: system
        preconditions:
          - "list_version.state == REPRINT_PENDING"
        side_effects:
          - "sets pinned_version_stale = true on every CONFIRMED WineDinnerEvent pinned to this version"
      - id: DRAFT_to_ARCHIVED
        from: DRAFT
        to: ARCHIVED
        trigger: "POST /list-versions/{list_version_id}/archive"
        actor: BeverageDirector
        preconditions:
          - "list_version.state == DRAFT"
        side_effects:
          - "increments list_version.version by 1"

  - entity: AllocationOffer
    shape: parallel
    parallel_dimensions: [fulfillment_state, compliance_state]
    initial_state: "fulfillment_state=OPEN; compliance_state=PENDING_LICENSE_CHECK"
    terminal_states: ["fulfillment_state=CLOSED"]
    transitions:
      - id: fulfillment_OPEN_to_ALLOCATED
        dimension: fulfillment_state
        from: OPEN
        to: ALLOCATED
        trigger: "POST /allocation-offers/{offer_id}/allocate"
        actor: BeverageDirector
        preconditions:
          - "offer.fulfillment_state == OPEN (ERR_OFFER_NOT_OPEN)"
          - "offer.compliance_state != BLOCKED (ERR_OFFER_COMPLIANCE_BLOCKED)"
          - "at least one AllocationClaim on this offer has state == REQUESTED (ERR_NO_ELIGIBLE_CLAIMS)"
        side_effects:
          - "runs `allocation_waterfall_grant`; writes granted_bottles, raw_share and remainder_awarded on every REQUESTED claim"
          - "moves each claim REQUESTED -> GRANTED, REQUESTED -> PARTIALLY_GRANTED or REQUESTED -> REJECTED"
          - "sets offer.unallocated_bottles = offered_bottles - sum(granted_bottles) and offer.allocated_at = logical clock"
      - id: fulfillment_ALLOCATED_to_CLOSED
        dimension: fulfillment_state
        from: ALLOCATED
        to: CLOSED
        trigger: "system: the last claim in state GRANTED or PARTIALLY_GRANTED becomes RECEIVED or WITHDRAWN"
        actor: system
        preconditions:
          - "offer.fulfillment_state == ALLOCATED"
          - "no AllocationClaim on this offer has state IN {GRANTED, PARTIALLY_GRANTED}"
        side_effects:
          - "increments offer.version by 1"
      - id: compliance_PENDING_LICENSE_CHECK_to_CLEARED
        dimension: compliance_state
        from: PENDING_LICENSE_CHECK
        to: CLEARED
        trigger: "system: POST /distributors/{distributor_id}/compliance-reviews with decision CLEARED"
        actor: system
        preconditions:
          - "offer.compliance_state == PENDING_LICENSE_CHECK"
        side_effects:
          - "increments offer.version by 1"
        note: "Independent of fulfillment_state, which is untouched by compliance reviews."
      - id: compliance_PENDING_LICENSE_CHECK_to_BLOCKED
        dimension: compliance_state
        from: PENDING_LICENSE_CHECK
        to: BLOCKED
        trigger: "system: POST /distributors/{distributor_id}/compliance-reviews with decision HOLD"
        actor: system
        preconditions:
          - "offer.compliance_state == PENDING_LICENSE_CHECK"
        side_effects:
          - "increments offer.version by 1"
      - id: compliance_CLEARED_to_BLOCKED
        dimension: compliance_state
        from: CLEARED
        to: BLOCKED
        trigger: "system: POST /distributors/{distributor_id}/compliance-reviews with decision HOLD"
        actor: system
        preconditions:
          - "offer.compliance_state == CLEARED"
        side_effects:
          - "increments offer.version by 1"
        note: "May fire while fulfillment_state is already ALLOCATED; fulfillment_state does not change."
      - id: compliance_BLOCKED_to_CLEARED
        dimension: compliance_state
        from: BLOCKED
        to: CLEARED
        trigger: "system: POST /distributors/{distributor_id}/compliance-reviews with decision CLEARED"
        actor: system
        preconditions:
          - "offer.compliance_state == BLOCKED"
        side_effects:
          - "increments offer.version by 1"

  - entity: AllocationClaim
    shape: branching
    initial_state: REQUESTED
    terminal_states: [REJECTED, WITHDRAWN, RECEIVED]
    transitions:
      - id: REQUESTED_to_GRANTED
        from: REQUESTED
        to: GRANTED
        trigger: "system: `allocation_waterfall_grant` awards granted_bottles == requested_bottles"
        actor: system
        preconditions:
          - "claim.state == REQUESTED"
        side_effects:
          - "sets claim.granted_bottles = requested_bottles and decrements offer.unallocated_bottles by the same amount"
      - id: REQUESTED_to_PARTIALLY_GRANTED
        from: REQUESTED
        to: PARTIALLY_GRANTED
        trigger: "system: `allocation_waterfall_grant` awards 0 < granted_bottles < requested_bottles"
        actor: system
        preconditions:
          - "claim.state == REQUESTED"
        side_effects:
          - "sets claim.granted_bottles and decrements offer.unallocated_bottles by the same amount"
      - id: REQUESTED_to_REJECTED
        from: REQUESTED
        to: REJECTED
        trigger: "system: `allocation_waterfall_grant` awards granted_bottles == 0"
        actor: system
        preconditions:
          - "claim.state == REQUESTED"
        side_effects:
          - "leaves claim.granted_bottles at 0"
      - id: REQUESTED_to_WITHDRAWN
        from: REQUESTED
        to: WITHDRAWN
        trigger: "POST /allocation-claims/{claim_id}/withdraw"
        actor: VenueSommelier
        preconditions:
          - "claim.state == REQUESTED (ERR_CLAIM_NOT_WITHDRAWABLE)"
          - "X-User-ID == claim.venue_id"
        side_effects:
          - "decrements offer.claim_count by 1"
      - id: GRANTED_to_WITHDRAWN
        from: GRANTED
        to: WITHDRAWN
        trigger: "POST /allocation-claims/{claim_id}/withdraw"
        actor: VenueSommelier
        preconditions:
          - "claim.state == GRANTED"
          - "X-User-ID == claim.venue_id"
        side_effects:
          - "returns claim.granted_bottles to offer.unallocated_bottles, then sets claim.granted_bottles = 0"
          - "when no claim on the offer remains in state GRANTED or PARTIALLY_GRANTED: offer fires fulfillment_ALLOCATED_to_CLOSED"
        note: "Compensating action for the allocation invariant: offered_bottles is conserved."
      - id: PARTIALLY_GRANTED_to_WITHDRAWN
        from: PARTIALLY_GRANTED
        to: WITHDRAWN
        trigger: "POST /allocation-claims/{claim_id}/withdraw"
        actor: VenueSommelier
        preconditions:
          - "claim.state == PARTIALLY_GRANTED"
          - "X-User-ID == claim.venue_id"
        side_effects:
          - "returns claim.granted_bottles to offer.unallocated_bottles, then sets claim.granted_bottles = 0"
          - "when no claim on the offer remains in state GRANTED or PARTIALLY_GRANTED: offer fires fulfillment_ALLOCATED_to_CLOSED"
      - id: GRANTED_to_RECEIVED
        from: GRANTED
        to: RECEIVED
        trigger: "POST /allocation-claims/{claim_id}/receive"
        actor: VenueSommelier
        preconditions:
          - "claim.state IN {GRANTED, PARTIALLY_GRANTED} (ERR_CLAIM_NOT_GRANTED)"
          - "offer.compliance_state != BLOCKED (ERR_OFFER_COMPLIANCE_BLOCKED)"
          - "distributor.compliance_state != HOLD (ERR_DISTRIBUTOR_COMPLIANCE_HOLD)"
          - "bin.venue_id == claim.venue_id (ERR_LOT_VENUE_MISMATCH)"
          - "bin.zone != RESERVE OR wine.is_allocated == true (ERR_BIN_ZONE_MISMATCH)"
          - "bin.bottles_stored + claim.granted_bottles <= bin.capacity_bottles (ERR_BIN_CAPACITY_EXCEEDED)"
        side_effects:
          - "creates InventoryLot with bottles_received = claim.granted_bottles, unit_cost_cents = offer.unit_cost_cents, source_claim_id = claim.id, state = ON_HAND"
          - "increments bin.bottles_stored, recomputes bin.utilization_pct and bin.bin_state"
          - "recomputes availability_state on every ListEntry for (claim.venue_id, offer.wine_id) and the owning versions' out_of_stock_entry_count"
          - "when no claim on the offer remains in state GRANTED or PARTIALLY_GRANTED: offer fires fulfillment_ALLOCATED_to_CLOSED"
      - id: PARTIALLY_GRANTED_to_RECEIVED
        from: PARTIALLY_GRANTED
        to: RECEIVED
        trigger: "POST /allocation-claims/{claim_id}/receive"
        actor: VenueSommelier
        preconditions:
          - "identical to GRANTED_to_RECEIVED"
        side_effects:
          - "identical to GRANTED_to_RECEIVED"

  - entity: InventoryLot
    shape: compound
    initial_state: ON_HAND
    terminal_states: [WRITTEN_OFF]
    transitions:
      - id: ON_HAND_to_DEPLETED
        from: ON_HAND
        to: DEPLETED
        trigger: "system: bottles_on_hand reaches 0 after any depletion (slot close, event settle, write-off approval)"
        actor: system
        preconditions:
          - "lot.state == ON_HAND"
          - "lot.bottles_on_hand == 0"
        side_effects:
          - "recomputes bin.bottles_stored, bin.utilization_pct and bin.bin_state"
          - "when no InventoryLot for (lot.venue_id, lot.wine_id) has state == ON_HAND with bottles_on_hand > 0: every ListEntry for that (venue, wine) whose version state IN {PUBLISHED, REPRINT_PENDING} moves availability_state AVAILABLE -> OUT_OF_STOCK, which in turn increments that ListVersion.out_of_stock_entry_count"
      - id: DEPLETED_to_ON_HAND
        from: DEPLETED
        to: ON_HAND
        trigger: "system: bottles_on_hand becomes > 0 again after a write-off reversal or settlement void"
        actor: system
        preconditions:
          - "lot.state == DEPLETED"
          - "lot.bottles_on_hand > 0"
        side_effects:
          - "recomputes bin.bottles_stored, bin.utilization_pct and bin.bin_state"
          - "recomputes availability_state on every ListEntry for (lot.venue_id, lot.wine_id) and the owning versions' out_of_stock_entry_count"
        note: "Compensating counterpart of ON_HAND_to_DEPLETED; leaves no drift in bottles_received."
      - id: DEPLETED_to_WRITTEN_OFF
        from: DEPLETED
        to: WRITTEN_OFF
        trigger: "system: a SpoilageWriteOff approval brings bottles_on_hand to 0 with reason_code PRESERVATION_EXPIRY or TEMPERATURE"
        actor: system
        preconditions:
          - "lot.state == DEPLETED"
          - "lot.bottles_on_hand == 0"
          - "the approving write-off has reason_code IN {PRESERVATION_EXPIRY, TEMPERATURE}"
        side_effects:
          - "freezes the lot: no further BtgSlot may reference it (ERR_LOT_NOT_ON_HAND)"

  - entity: BtgSlot
    shape: branching
    initial_state: OPEN
    terminal_states: [CLOSED, WRITTEN_OFF]
    transitions:
      - id: OPEN_to_CLOSED
        from: OPEN
        to: CLOSED
        trigger: "POST /btg-slots/{btg_slot_id}/close when the logical clock is <= preservation_expires_at"
        actor: VenueSommelier
        preconditions:
          - "slot.state == OPEN (ERR_SLOT_NOT_OPEN)"
          - "logical clock <= slot.preservation_expires_at"
          - "pours_sold + staff_education_pours <= slot.effective_pours (ERR_POURS_EXCEED_BOTTLE)"
        side_effects:
          - "sets pours_sold, staff_education_pours and spoiled_pours = effective_pours - pours_sold - staff_education_pours"
          - "creates DepletionEntry(reason=SALE_BTG, bottles=1, pours=pours_sold, cogs_cents=sale_cogs, revenue_cents=pours_sold * entry.glass_price_cents) per `btg_close_cost_split`"
          - "when staff_education_pours > 0: creates DepletionEntry(reason=STAFF_EDUCATION, bottles=0, pours=staff_education_pours, cogs_cents=edu_cogs, revenue_cents=0)"
          - "when spoiled_pours > 0: creates DepletionEntry(reason=SPOILAGE, bottles=0, pours=spoiled_pours, cogs_cents=spoil_cogs, revenue_cents=0)"
          - "decrements lot.bottles_on_hand by 1 and lot.bottles_committed by 1; when bottles_on_hand reaches 0 the lot fires ON_HAND_to_DEPLETED"
          - "adds every created entry's cogs_cents and revenue_cents to venue.cogs_ledger_cents and venue.revenue_ledger_cents"
          - "recomputes ListEntry.contest_points via `list_entry_contest_points`"
      - id: OPEN_to_EXPIRED_on_close
        from: OPEN
        to: EXPIRED
        trigger: "POST /btg-slots/{btg_slot_id}/close when the logical clock is > preservation_expires_at"
        actor: VenueSommelier
        preconditions:
          - "slot.state == OPEN"
          - "logical clock > slot.preservation_expires_at"
        side_effects:
          - "records pours_sold and staff_education_pours as submitted but recognises NO DepletionEntry and NO ledger movement"
          - "leaves lot.bottles_committed unchanged so the bottle stays reserved until a write-off resolves it"
        note: "Divergent side-effect set versus OPEN_to_CLOSED: the branch is chosen by the clock, not by the caller."
      - id: OPEN_to_EXPIRED_on_reopen
        from: OPEN
        to: EXPIRED
        trigger: "system: a new BtgSlot is opened on the same (venue_id, slot_index) at a clock instant strictly after this slot's preservation_expires_at"
        actor: system
        preconditions:
          - "slot.state == OPEN"
          - "logical clock > slot.preservation_expires_at"
        side_effects:
          - "recognises no DepletionEntry; the stale bottle remains committed to this slot"
      - id: EXPIRED_to_WRITTEN_OFF
        from: EXPIRED
        to: WRITTEN_OFF
        trigger: "system: a SpoilageWriteOff citing this btg_slot_id is approved"
        actor: system
        preconditions:
          - "slot.state == EXPIRED"
        side_effects:
          - "releases the committed bottle: decrements lot.bottles_committed by 1"

  - entity: SpoilageWriteOff
    shape: branching_with_revert
    initial_state: SUBMITTED
    terminal_states: [REJECTED, REVERSED]
    transitions:
      - id: SUBMITTED_to_APPROVED
        from: SUBMITTED
        to: APPROVED
        trigger: "POST /spoilage-write-offs/{write_off_id}/approve"
        actor: Controller
        preconditions:
          - "write_off.state == SUBMITTED (ERR_WRITE_OFF_NOT_SUBMITTED)"
          - "X-User-ID != write_off.submitted_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
          - "lot.state == ON_HAND (ERR_LOT_NOT_ON_HAND)"
          - "write_off.bottles <= lot.bottles_on_hand - lot.bottles_committed + (1 when write_off.btg_slot_id is not null else 0) (ERR_INSUFFICIENT_BOTTLES)"
        side_effects:
          - "sets write_off.approved_by_user_id = X-User-ID and write_off.cogs_cents from `lot_depletion_cogs` restricted to lot_id"
          - "creates DepletionEntry(reason=SPOILAGE, bottles=write_off.bottles, cogs_cents=write_off.cogs_cents, revenue_cents=0, write_off_id=write_off.id)"
          - "decrements lot.bottles_on_hand by write_off.bottles; when it reaches 0 the lot fires ON_HAND_to_DEPLETED, whose own cascade flips the matching ListEntry rows to OUT_OF_STOCK and increments each owning ListVersion.out_of_stock_entry_count"
          - "when write_off.btg_slot_id is not null: the slot fires EXPIRED_to_WRITTEN_OFF"
          - "adds write_off.cogs_cents to venue.cogs_ledger_cents"
      - id: SUBMITTED_to_REJECTED
        from: SUBMITTED
        to: REJECTED
        trigger: "POST /spoilage-write-offs/{write_off_id}/reject"
        actor: Controller
        preconditions:
          - "write_off.state == SUBMITTED"
          - "X-User-ID != write_off.submitted_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "sets write_off.resolution_note; leaves every bottle count and ledger untouched"
      - id: APPROVED_to_REVERSED
        from: APPROVED
        to: REVERSED
        trigger: "POST /spoilage-write-offs/{write_off_id}/reverse"
        actor: Controller
        preconditions:
          - "write_off.state == APPROVED (ERR_WRITE_OFF_NOT_APPROVED)"
          - "lot.state IN {ON_HAND, DEPLETED} (a WRITTEN_OFF lot is frozen; ERR_LOT_NOT_ON_HAND)"
        side_effects:
          - "creates DepletionEntry(reason=REVERSAL, bottles = -write_off.bottles, cogs_cents = -write_off.cogs_cents, revenue_cents=0, write_off_id=write_off.id)"
          - "increments lot.bottles_on_hand by write_off.bottles; when the lot was DEPLETED it fires DEPLETED_to_ON_HAND"
          - "subtracts write_off.cogs_cents from venue.cogs_ledger_cents"
          - "when write_off.btg_slot_id is not null: the slot returns WRITTEN_OFF -> EXPIRED and lot.bottles_committed is incremented by 1"
        note: "Compensating action for the bottle-conservation invariant."

  - entity: WineDinnerEvent
    shape: branching
    initial_state: PLANNED
    terminal_states: [CANCELLED]
    transitions:
      - id: PLANNED_to_PRICED
        from: PLANNED
        to: PRICED
        trigger: "POST /wine-dinner-events/{event_id}/price"
        actor: VenueSommelier
        preconditions:
          - "event.state == PLANNED (ERR_EVENT_INVALID_STATE)"
          - "every pour_plan line's list_entry_id belongs to event.list_version_id (ERR_POUR_PLAN_ENTRY_MISMATCH)"
        side_effects:
          - "writes beverage_cost_per_seat_cents, provisional_gross_cents, tier_discount_pct, final_ticket_price_cents and projected_pour_cost_pct from `wine_dinner_ticket_price`"
      - id: PRICED_to_PRICED
        from: PRICED
        to: PRICED
        trigger: "POST /wine-dinner-events/{event_id}/price"
        actor: VenueSommelier
        preconditions:
          - "event.state == PRICED"
        side_effects:
          - "recomputes every pricing field from `wine_dinner_ticket_price` against current entry data"
        note: "Idempotent re-price loop; permitted only before confirmation."
      - id: PRICED_to_CONFIRMED
        from: PRICED
        to: CONFIRMED
        trigger: "POST /wine-dinner-events/{event_id}/confirm"
        actor: BeverageDirector
        preconditions:
          - "event.state == PRICED (ERR_EVENT_INVALID_STATE)"
          - "event.final_ticket_price_cents is not null"
          - "the pinned ListVersion state IN {PUBLISHED, REPRINT_PENDING} (ERR_LIST_VERSION_NOT_PUBLISHED)"
          - "venue.program_posture != FROZEN (ERR_VENUE_PROGRAM_FROZEN)"
        side_effects:
          - "sets event.pinned_version_no = the ListVersion's version_no (version-pinning on approval)"
          - "sets event.pinned_version_stale = false"
      - id: CONFIRMED_to_SETTLED
        from: CONFIRMED
        to: SETTLED
        trigger: "POST /wine-dinner-events/{event_id}/settle"
        actor: Controller
        preconditions:
          - "event.state == CONFIRMED (ERR_EVENT_INVALID_STATE)"
          - "event.pinned_version_stale == false (ERR_PINNED_LIST_VERSION_STALE)"
          - "for every pour_plan line, the available bottles for (venue, wine) cover bottles_needed (ERR_INSUFFICIENT_BOTTLES)"
        side_effects:
          - "computes bottles_needed per pour_plan line via `event_settlement_draw` and consumes lots in received_at ASC order"
          - "writes event.settled_cogs_cents from `lot_depletion_cogs` and event.settled_revenue_cents = final_ticket_price_cents * seat_count"
          - "creates one DepletionEntry(reason=EVENT) per consumed lot, carrying that lot's bottles and cogs_cents, with revenue_cents = settled_revenue_cents booked on the FIRST entry only and 0 on the rest"
          - "every lot drained to 0 fires ON_HAND_to_DEPLETED with its own downstream availability cascade"
          - "adds the entries' cogs_cents and revenue_cents to venue.cogs_ledger_cents and venue.revenue_ledger_cents"
      - id: SETTLED_to_SETTLEMENT_VOIDED
        from: SETTLED
        to: SETTLEMENT_VOIDED
        trigger: "POST /wine-dinner-events/{event_id}/void-settlement"
        actor: Controller
        preconditions:
          - "event.state == SETTLED (ERR_EVENT_INVALID_STATE)"
        side_effects:
          - "creates one DepletionEntry(reason=REVERSAL, bottles/cogs_cents/revenue_cents = the exact negation of each settlement entry) per settlement entry"
          - "restores every consumed lot's bottles_on_hand; lots that had gone DEPLETED fire DEPLETED_to_ON_HAND"
          - "subtracts the settlement amounts from venue.cogs_ledger_cents and venue.revenue_ledger_cents, and clears settled_cogs_cents and settled_revenue_cents to null"
        note: "Compensating action for the monetary-ledger invariant."
      - id: PLANNED_to_CANCELLED
        from: PLANNED
        to: CANCELLED
        trigger: "POST /wine-dinner-events/{event_id}/cancel"
        actor: VenueSommelier | BeverageDirector
        preconditions:
          - "event.state == PLANNED"
        side_effects:
          - "the event stops occupying its venue window for `event_window_overlap`"
      - id: PRICED_to_CANCELLED
        from: PRICED
        to: CANCELLED
        trigger: "POST /wine-dinner-events/{event_id}/cancel"
        actor: VenueSommelier | BeverageDirector
        preconditions:
          - "event.state == PRICED"
        side_effects:
          - "the event stops occupying its venue window for `event_window_overlap`"
      - id: CONFIRMED_to_CANCELLED
        from: CONFIRMED
        to: CANCELLED
        trigger: "POST /wine-dinner-events/{event_id}/cancel"
        actor: VenueSommelier | BeverageDirector
        preconditions:
          - "event.state == CONFIRMED"
        side_effects:
          - "clears event.pinned_version_no to null"
          - "the event stops occupying its venue window for `event_window_overlap`"
      - id: SETTLEMENT_VOIDED_to_CANCELLED
        from: SETTLEMENT_VOIDED
        to: CANCELLED
        trigger: "POST /wine-dinner-events/{event_id}/cancel"
        actor: VenueSommelier | BeverageDirector
        preconditions:
          - "event.state == SETTLEMENT_VOIDED"
        side_effects:
          - "clears event.pinned_version_no to null"

  - entity: VarianceInvestigation
    shape: branching
    initial_state: OPEN
    terminal_states: [RESOLVED_EXPLAINED, RESOLVED_ADJUSTED]
    transitions:
      - id: OPEN_to_ESCALATED
        from: OPEN
        to: ESCALATED
        trigger: "POST /variance-investigations/{investigation_id}/escalate"
        actor: Controller
        preconditions:
          - "investigation.state == OPEN (ERR_INVESTIGATION_NOT_ACTIONABLE)"
        side_effects:
          - "sets investigation.escalation_note"
          - "recomputes venue.program_posture, which becomes FROZEN because an ESCALATED investigation exists"
      - id: OPEN_to_RESOLVED_EXPLAINED
        from: OPEN
        to: RESOLVED_EXPLAINED
        trigger: "POST /variance-investigations/{investigation_id}/resolve with resolution EXPLAINED"
        actor: Controller
        preconditions:
          - "investigation.state IN {OPEN, ESCALATED}"
        side_effects:
          - "sets resolution_note and resolved_at; recomputes venue.program_posture from venue.last_variance_pct alone"
      - id: ESCALATED_to_RESOLVED_EXPLAINED
        from: ESCALATED
        to: RESOLVED_EXPLAINED
        trigger: "POST /variance-investigations/{investigation_id}/resolve with resolution EXPLAINED"
        actor: Controller
        preconditions:
          - "investigation.state == ESCALATED"
        side_effects:
          - "sets resolution_note and resolved_at; recomputes venue.program_posture, which leaves FROZEN when no other ESCALATED investigation remains and last_variance_pct <= 6.00"
      - id: OPEN_to_RESOLVED_ADJUSTED
        from: OPEN
        to: RESOLVED_ADJUSTED
        trigger: "POST /variance-investigations/{investigation_id}/resolve with resolution ADJUSTED"
        actor: Controller
        preconditions:
          - "investigation.state IN {OPEN, ESCALATED}"
        side_effects:
          - "sets venue.last_variance_pct = 0.00 and recomputes venue.program_posture, which becomes OPEN when no ESCALATED investigation remains"
      - id: ESCALATED_to_RESOLVED_ADJUSTED
        from: ESCALATED
        to: RESOLVED_ADJUSTED
        trigger: "POST /variance-investigations/{investigation_id}/resolve with resolution ADJUSTED"
        actor: Controller
        preconditions:
          - "investigation.state == ESCALATED"
        side_effects:
          - "sets venue.last_variance_pct = 0.00 and recomputes venue.program_posture"

  - entity: Distributor
    shape: cyclic
    initial_state: PENDING_REVIEW
    terminal_states: []
    transitions:
      - id: PENDING_REVIEW_to_CLEARED
        from: PENDING_REVIEW
        to: CLEARED
        trigger: "POST /distributors/{distributor_id}/compliance-reviews with decision CLEARED"
        actor: ComplianceOfficer
        preconditions:
          - "distributor.compliance_state == PENDING_REVIEW"
        side_effects:
          - "every AllocationOffer with this distributor_id whose compliance_state == PENDING_LICENSE_CHECK fires compliance_PENDING_LICENSE_CHECK_to_CLEARED"
      - id: PENDING_REVIEW_to_HOLD
        from: PENDING_REVIEW
        to: HOLD
        trigger: "POST /distributors/{distributor_id}/compliance-reviews with decision HOLD"
        actor: ComplianceOfficer
        preconditions:
          - "distributor.compliance_state == PENDING_REVIEW"
        side_effects:
          - "every AllocationOffer with this distributor_id whose compliance_state == PENDING_LICENSE_CHECK fires compliance_PENDING_LICENSE_CHECK_to_BLOCKED"
      - id: CLEARED_to_HOLD
        from: CLEARED
        to: HOLD
        trigger: "POST /distributors/{distributor_id}/compliance-reviews with decision HOLD"
        actor: ComplianceOfficer
        preconditions:
          - "distributor.compliance_state == CLEARED"
        side_effects:
          - "every AllocationOffer with this distributor_id whose compliance_state == CLEARED fires compliance_CLEARED_to_BLOCKED, regardless of that offer's fulfillment_state"
      - id: HOLD_to_CLEARED
        from: HOLD
        to: CLEARED
        trigger: "POST /distributors/{distributor_id}/compliance-reviews with decision CLEARED"
        actor: ComplianceOfficer
        preconditions:
          - "distributor.compliance_state == HOLD"
        side_effects:
          - "every AllocationOffer with this distributor_id whose compliance_state == BLOCKED fires compliance_BLOCKED_to_CLEARED"

# ---------------------------------------------------------------------------
# §1.2.1 Concurrency Rules (OCC on the parent's `version` only)
# ---------------------------------------------------------------------------
concurrency_rules:
  - rule_id: claim-create-stale-offer
    parent_entity: AllocationOffer
    write_endpoint: "POST /allocation-offers/{offer_id}/claims"
    occ_field: "expected_offer_version"
    description: |
      Filing an AllocationClaim against an AllocationOffer whose version has advanced since the
      client last read it is rejected. A second venue filing a claim is legitimate product
      behaviour on its own - the offer stays OPEN and the new claim would succeed - so the
      conflict cannot be reduced to a state precondition; it is resolved by the stale-version
      check on the offer the claimant based its request size on.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: entry-add-stale-list-version
    parent_entity: ListVersion
    write_endpoint: "POST /list-versions/{list_version_id}/entries"
    occ_field: "expected_list_version_version"
    description: |
      Adding a ListEntry to a ListVersion whose version has advanced since the client last read
      it is rejected. Adding a second entry to the same DRAFT version is legitimate on its own -
      the version stays DRAFT and the entry would be accepted - so the stale-version check is the
      only deterministic guard against a writer building entries on an outdated view of the
      version's contents.
    error_id: ERR_STALE_VERSION
    http_status: 412

# ---------------------------------------------------------------------------
# §1.3 Calculation Rules Table
# ---------------------------------------------------------------------------
calculations:
  - name: list_entry_bottle_price
    trigger: "POST /list-versions/{list_version_id}/entries (writes ListEntry.bottle_price_cents and ListEntry.price_band)"
    algorithm: tiered_pricing
    formula: |
      cost = wine.reference_cost_cents                      # catalogue cost, NOT lot unit cost
      tier_multiplier = 3.50 if cost <= 2000
                        3.00 if 2000 <  cost <= 6000
                        2.60 if 6000 <  cost <= 15000
                        2.20 if cost > 15000
      markup_price  = round_half_up(cost * tier_multiplier)                 # integer cents
      target_pct    = venue.cogs_target_pct_by_category[wine.category]
      target_price  = round_half_up(cost * 100 / target_pct)                # integer cents
      allocated_premium = 1.15 if wine.is_allocated else 1.00
      raw           = round_half_up(max(markup_price, target_price) * allocated_premium)
      bottle_price_cents = ceil_to_multiple(raw, 100)                       # round UP to whole dollar
      price_band = VALUE   if bottle_price_cents <= 6000
                   CORE    if 6000  < bottle_price_cents <= 12000
                   PREMIUM if 12000 < bottle_price_cents <= 25000
                   RESERVE if bottle_price_cents > 25000
    input_set: >-
      Single Wine row plus the Venue reached through ListVersion -> WineList -> Venue. No
      InventoryLot data participates: the pricing input is the catalogue reference cost.
    constants:
      TIER_BREAKS_CENTS: [2000, 6000, 15000]
      TIER_MULTIPLIERS: [3.50, 3.00, 2.60, 2.20]
      ALLOCATED_PREMIUM: 1.15
      BAND_BREAKS_CENTS: [6000, 12000, 25000]
    precision: >-
      round_half_up to whole cents at markup_price, target_price and raw (in that order), then a
      final ceil to the next multiple of 100 cents. The tier and band comparisons are all
      "<=" on the upper bound, so 2000, 6000, 15000, 12000 and 25000 belong to the LOWER band.
    ordering: "tier selection -> markup_price -> target_price -> max() -> allocated premium -> ceil"

  - name: list_entry_glass_price
    trigger: "POST /list-versions/{list_version_id}/entries and PATCH /list-entries/{list_entry_id} whenever by_the_glass is true (writes glass_price_cents and effective_pours)"
    algorithm: threshold
    formula: |
      gross_pours     = floor(wine.bottle_size_ml / pour_size_ml)
      effective_pours = gross_pours - BTG_SPOILAGE_ALLOWANCE_POURS       # allowance = 1 pour
      if effective_pours <= 0: reject with ERR_POUR_SIZE_TOO_LARGE       # zero-count boundary
      target_pct      = venue.cogs_target_pct_by_category[wine.category]
      raw             = wine.reference_cost_cents * 100 / target_pct / effective_pours
      glass_price_cents = ceil_to_multiple(round_half_up(raw), 25)
    input_set: "Single Wine row, the entry's pour_size_ml, and the owning Venue's category target."
    constants:
      BTG_SPOILAGE_ALLOWANCE_POURS: 1
      GLASS_PRICE_ROUNDING_CENTS: 25
    precision: "round_half_up to whole cents on raw, THEN ceil to the next multiple of 25 cents (order pinned)."

  - name: lot_depletion_cogs
    trigger: >-
      Every depletion: BtgSlot OPEN_to_CLOSED, WineDinnerEvent CONFIRMED_to_SETTLED and
      SpoilageWriteOff SUBMITTED_to_APPROVED (writes SpoilageWriteOff.cogs_cents,
      WineDinnerEvent.settled_cogs_cents and DepletionEntry.cogs_cents)
    algorithm: chronological
    formula: |
      # candidate lots for (venue_id, wine_id)
      candidates = InventoryLot rows with venue_id, wine_id, state == ON_HAND,
                   (bottles_on_hand - bottles_committed) > 0
      order       = received_at ASC, tie-break created_at ASC        # never id
      # A write-off and a slot close are pinned to one explicit lot_id; the candidate ordering
      # only matters for event settlement, which draws across lots.
      variant FIFO:
        walk `order`, take take_i = min(available_i, remaining) from each lot,
        cogs_cents = sum(take_i * lot_i.unit_cost_cents)
      variant WEIGHTED_AVERAGE:
        wac_unit_cents = round_half_up( sum(available_i * lot_i.unit_cost_cents)
                                        / sum(available_i) )        # over `candidates` BEFORE any draw
        cogs_cents     = wac_unit_cents * bottles_consumed
        physical draw still follows `order` (received_at ASC), only the costing differs
    input_set: >-
      InventoryLot rows for the (venue_id, wine_id) pair with state == ON_HAND and
      bottles_on_hand - bottles_committed > 0. Lots in state DEPLETED or WRITTEN_OFF are excluded
      from both variants.
    constants: {}
    precision: "round_half_up to whole cents on wac_unit_cents; FIFO needs no rounding."
    variants:
      - name: FIFO
        when: "venue.costing_method == FIFO"
        difference: "Costs each bottle at the unit_cost_cents of the lot it physically came from."
      - name: WEIGHTED_AVERAGE
        when: "venue.costing_method == WEIGHTED_AVERAGE"
        difference: >-
          Costs every bottle at one blended unit computed over the whole candidate set before the
          draw, so identical lots and identical draws produce a different cogs_cents than FIFO
          whenever the candidate lots differ in unit_cost_cents.

  - name: btg_close_cost_split
    trigger: "POST /btg-slots/{btg_slot_id}/close on the OPEN_to_CLOSED branch"
    algorithm: waterfall_allocation
    formula: |
      bottle_cogs_cents = lot_depletion_cogs for exactly 1 bottle of slot.lot_id
      cost_per_pour     = round_half_up(bottle_cogs_cents / slot.effective_pours)
      sale_cogs         = cost_per_pour * pours_sold
      edu_cogs          = cost_per_pour * staff_education_pours
      spoil_cogs        = bottle_cogs_cents - sale_cogs - edu_cogs     # remainder absorbs the drift
      revenue_cents     = pours_sold * list_entry.glass_price_cents
    input_set: "One BtgSlot, its ListEntry (glass_price_cents) and its InventoryLot (unit_cost_cents)."
    constants: {}
    precision: >-
      round_half_up per pour FIRST, then multiply by the pour counts; the SPOILAGE bucket takes
      the remainder so the three DepletionEntry cogs_cents values always sum to exactly
      bottle_cogs_cents. Buckets whose pour count is 0 produce no DepletionEntry.
    ordering: "sale bucket -> education bucket -> spoilage remainder (pinned)"

  - name: venue_pour_cost_variance
    trigger: >-
      POST /venues/{venue_id}/pour-cost-runs (writes Venue.last_variance_pct,
      Venue.last_pour_cost_run_at and Venue.program_posture) and
      GET /venues/{venue_id}/pour-cost-report (read-only projection of the same numbers)
    algorithm: aggregation
    formula: |
      window = [period_start, period_end)                        # half-open on occurred_at
      all_entries  = DepletionEntry rows with venue_id == venue and
                     period_start <= occurred_at < period_end    # every reason, signed values
      sale_entries = all_entries filtered to reason IN {SALE_BTG, SALE_BOTTLE, EVENT}
      if sum(all_entries.revenue_cents) == 0: reject with ERR_NO_REVENUE_IN_PERIOD
      if sum(sale_entries.revenue_cents) == 0: reject with ERR_NO_REVENUE_IN_PERIOD
      variant ACTUAL:
        actual_pour_cost_pct = round_half_up(sum(all_entries.cogs_cents) * 100
                                             / sum(all_entries.revenue_cents), 2)
      variant THEORETICAL:
        theoretical_pour_cost_pct = round_half_up(sum(sale_entries.cogs_cents) * 100
                                                   / sum(sale_entries.revenue_cents), 2)
      variance_pct = round_half_up(actual_pour_cost_pct - theoretical_pour_cost_pct, 2)
                     # computed from the two ALREADY-ROUNDED percentages, not from raw ratios
      posture:
        FROZEN     if variance_pct > 6.00 or any VarianceInvestigation(venue).state == ESCALATED
        RESTRICTED if 3.00 < variance_pct <= 6.00
        OPEN       otherwise
      if variance_pct > 3.00: open a VarianceInvestigation(state=OPEN,
                              triggered_variance_pct=variance_pct, period_start, period_end)
    input_set: >-
      DepletionEntry rows for the venue whose occurred_at falls in the half-open window. REVERSAL
      entries are included in ACTUAL (they carry negative values) and excluded from THEORETICAL,
      as are SPOILAGE and STAFF_EDUCATION.
    constants:
      VARIANCE_RESTRICTED_PCT: 3.00
      VARIANCE_FROZEN_PCT: 6.00
    precision: "round_half_up to 2 decimals on each percentage; the difference is then rounded again to 2 decimals."
    variants:
      - name: ACTUAL
        when: "Always computed; it is what the cellar actually gave up."
        difference: "Includes SPOILAGE, STAFF_EDUCATION and REVERSAL entries in both numerator and denominator."
      - name: THEORETICAL
        when: "Always computed alongside ACTUAL; it is what the recorded sales should have cost."
        difference: >-
          Restricts the input set to reason IN {SALE_BTG, SALE_BOTTLE, EVENT}, so the same
          DepletionEntry population yields a strictly different percentage whenever any spoilage,
          staff-education or reversal entry exists in the window.

  - name: allocation_waterfall_grant
    trigger: "POST /allocation-offers/{offer_id}/allocate (writes granted_bottles, raw_share, remainder_awarded, claim states and offer.unallocated_bottles)"
    algorithm: waterfall_allocation
    formula: |
      claims = AllocationClaim rows with offer_id == offer AND state == REQUESTED
               (WITHDRAWN, REJECTED, GRANTED, PARTIALLY_GRANTED and RECEIVED claims are excluded)
      if claims is empty: reject with ERR_NO_ELIGIBLE_CLAIMS
      pool            = offer.offered_bottles
      total_requested = sum(claim.requested_bottles)
      if total_requested <= pool:
          granted_i = requested_i for every claim; unallocated = pool - total_requested
      else:
          raw_i   = pool * requested_i / total_requested          # exact rational, stored 4 dp
          base_i  = floor(raw_i)                                  # STEP: floor FIRST
          frac_i  = raw_i - base_i
          remainder = pool - sum(base_i)
          award the `remainder` bottles ONE AT A TIME to claims ordered by
              frac_i DESC, then venue.priority_rank ASC, then claim.created_at ASC
          granted_i = base_i + (1 if the claim received a remainder bottle else 0)
          cap: granted_i = min(granted_i, requested_i); bottles freed by the cap are
               re-awarded by repeating the same ordered pass over claims with granted_i < requested_i
          unallocated = pool - sum(granted_i)
      state_i = GRANTED            if granted_i == requested_i
                PARTIALLY_GRANTED  if 0 < granted_i < requested_i
                REJECTED           if granted_i == 0
    input_set: >-
      AllocationClaim rows on this offer with state == REQUESTED, joined to their Venue for
      priority_rank. Claims already GRANTED/PARTIALLY_GRANTED/RECEIVED/WITHDRAWN/REJECTED never
      re-enter a waterfall.
    constants: {}
    precision: >-
      MODE (b) - nested rounding whose ORDER IS PINNED: floor every raw share first, then
      distribute the remainder bottle-by-bottle. "round_half_up each raw share then sum" is
      explicitly NOT the rule and produces a different vector whenever any frac_i == 0.5.
      raw_share is persisted with round_half_up to 4 decimals for audit only; the arithmetic uses
      the exact rational.
    ordering: "frac_i DESC -> venue.priority_rank ASC -> claim.created_at ASC (never id)"

  - name: wine_dinner_ticket_price
    trigger: "POST /wine-dinner-events/{event_id}/price (writes all five pricing fields)"
    algorithm: constraint_propagation
    formula: |
      # STEP 1 - per-seat beverage cost, rounded PER POUR-PLAN LINE then summed
      for each pour_plan line p:
          entry            = ListEntry(p.list_entry_id)
          wine             = Wine(entry.wine_id)
          event_pours      = floor(wine.bottle_size_ml / EVENT_POUR_SIZE_ML) - 1
          cost_per_pour    = round_half_up(wine.reference_cost_cents / event_pours)
          line_cost        = round_half_up(cost_per_pour * p.pours_per_seat)
      beverage_cost_per_seat_cents = sum(line_cost)               # round-then-sum, pinned
      # STEP 2 - provisional per-seat gross from the venue's event COGS target
      provisional_gross_cents = ceil_to_multiple(
          round_half_up(beverage_cost_per_seat_cents * 100 / venue.event_cogs_target_pct), 500)
      # STEP 3 - volume tier keyed on the PROVISIONAL gross revenue
      provisional_revenue = provisional_gross_cents * event.seat_count
      tier_discount_pct = 0.0 if provisional_revenue < 250000
                          4.0 if 250000 <= provisional_revenue < 500000
                          7.0 if provisional_revenue >= 500000
      # STEP 4 - final ticket price
      final_ticket_price_cents = ceil_to_multiple(
          round_half_up(provisional_gross_cents * (100 - tier_discount_pct) / 100), 100)
      # STEP 5/6 - projected pour cost
      event_beverage_cost_total = beverage_cost_per_seat_cents * event.seat_count
      projected_pour_cost_pct = round_half_up(
          event_beverage_cost_total * 100 / (final_ticket_price_cents * event.seat_count), 2)
    input_set: >-
      The event's pour_plan lines, each resolved to a ListEntry on event.list_version_id and its
      Wine; plus Venue.event_cogs_target_pct and event.seat_count. Entry bottle_price_cents and
      glass_price_cents are NOT inputs.
    constants:
      EVENT_POUR_SIZE_ML: 100
      EVENT_TIER_BREAKS_CENTS: [250000, 500000]
      EVENT_TIER_DISCOUNTS_PCT: [0.0, 4.0, 7.0]
      PROVISIONAL_ROUNDING_CENTS: 500
      FINAL_ROUNDING_CENTS: 100
    precision: >-
      MODE (c) - circular-looking dependency with a PINNED evaluation order. The discount tier
      depends on gross revenue and gross revenue depends on the ticket price, so the rule fixes
      that the tier is read from provisional_revenue (STEP 3) exactly once and is NEVER
      re-derived from final_ticket_price_cents * seat_count. No second pass, no fixed-point
      iteration. Rounding: round_half_up then ceil to 500 in STEP 2, round_half_up then ceil to
      100 in STEP 4. Tier breaks use ">=" on the lower bound.
    ordering: "STEP 1 -> 2 -> 3 -> 4 -> 6, single pass"

  - name: event_settlement_draw
    trigger: "POST /wine-dinner-events/{event_id}/settle"
    algorithm: aggregation
    formula: |
      for each pour_plan line p:
          entry       = ListEntry(p.list_entry_id); wine = Wine(entry.wine_id)
          event_pours = floor(wine.bottle_size_ml / EVENT_POUR_SIZE_ML) - 1
          bottles_needed = ceil(event.seat_count * p.pours_per_seat / event_pours)
          available      = sum over InventoryLot(venue, wine, state == ON_HAND)
                           of (bottles_on_hand - bottles_committed)
          if available < bottles_needed: reject with ERR_INSUFFICIENT_BOTTLES
          line_cogs_cents = lot_depletion_cogs(venue, wine, bottles_needed)
      settled_revenue_cents = final_ticket_price_cents * seat_count   # booked on the FIRST line only
    input_set: "Pour-plan lines in array order; InventoryLot rows per line's wine in received_at ASC order."
    constants:
      EVENT_POUR_SIZE_ML: 100
    precision: "bottles_needed uses ceil (a partial bottle still opens a whole bottle); no monetary rounding beyond lot_depletion_cogs."
    ordering: "pour_plan array order; within a line, lots in received_at ASC then created_at ASC"

  - name: corkage_charge
    trigger: "POST /venues/{venue_id}/corkage-charges"
    algorithm: threshold
    formula: |
      waived_bottles     = min(byo_bottle_count,
                               floor(bottles_purchased_from_list / venue.corkage_waiver_purchase_ratio))
      chargeable_bottles = byo_bottle_count - waived_bottles
      corkage_total_cents = chargeable_bottles * venue.corkage_fee_cents
      if party_size >= LARGE_PARTY_THRESHOLD:
          corkage_total_cents = round_half_up(
              corkage_total_cents * (100 - LARGE_PARTY_CORKAGE_DISCOUNT_PCT) / 100)
    input_set: "Request body only, joined to the Venue's corkage configuration. No persisted rows are created."
    constants:
      LARGE_PARTY_THRESHOLD: 8
      LARGE_PARTY_CORKAGE_DISCOUNT_PCT: 25.0
    precision: >-
      Integer floor division for the waiver, so the waiver is earned at exactly
      bottles_purchased_from_list >= corkage_waiver_purchase_ratio (">=", not ">"). The
      large-party discount uses ">=" on LARGE_PARTY_THRESHOLD and round_half_up to whole cents.

  - name: btg_preservation_expiry
    trigger: "POST /btg-slots (writes opened_at and preservation_expires_at)"
    algorithm: decay_function
    formula: |
      base_hours   = PRESERVATION_BASE_HOURS[wine.category]
      factor       = PRESERVATION_METHOD_FACTOR[slot.preservation_method]
      hours        = min(MAX_PRESERVATION_HOURS, floor(base_hours * factor))
      opened_at    = logical clock at creation
      preservation_expires_at = opened_at + hours
    input_set: "The slot's preservation_method and the Wine.category reached through the ListEntry."
    constants:
      PRESERVATION_BASE_HOURS: { SPARKLING: 24, WHITE: 72, ROSE: 72, RED: 96, DESSERT: 168, FORTIFIED: 336 }
      PRESERVATION_METHOD_FACTOR: { ARGON: 2.0, VACUUM: 1.0, COOLER: 1.5, NONE: 0.5 }
      MAX_PRESERVATION_HOURS: 720
    precision: "floor on the hour product, then a hard cap at 720 hours; timestamps carry three fractional digits."

  - name: btg_slot_occupancy_check
    trigger: "POST /btg-slots (before creation)"
    algorithm: interval_merge
    formula: |
      T = logical clock at the moment of the request
      occupants = BtgSlot rows with venue_id == body.venue_id AND slot_index == body.slot_index
                  AND state IN {OPEN, EXPIRED}
      # CLOSED-CLOSED interval, zero buffer: both endpoints belong to the occupied interval.
      if any occupant has occupant.opened_at <= T <= occupant.preservation_expires_at:
          reject with ERR_SLOT_OCCUPIED
      else:
          every occupant with state == OPEN and T > preservation_expires_at fires
          OPEN_to_EXPIRED_on_reopen, and the new slot is created
    input_set: "BtgSlot rows on the same (venue_id, slot_index) in state OPEN or EXPIRED."
    constants:
      SLOT_INTERVAL_SEMANTICS: closed_closed
      SLOT_BUFFER_MINUTES: 0
    precision: >-
      Adjacency COLLIDES: a request at T exactly equal to an occupant's preservation_expires_at is
      rejected, and T = preservation_expires_at + 1 second is accepted. Comparison granularity is
      whole milliseconds.

  - name: event_window_overlap
    trigger: "POST /wine-dinner-events (before creation)"
    algorithm: interval_merge
    formula: |
      buffer = EVENT_TURNOVER_BUFFER_MINUTES minutes
      occupants = WineDinnerEvent rows with venue_id == body.venue_id AND
                  state IN {PLANNED, PRICED, CONFIRMED, SETTLED, SETTLEMENT_VOIDED}
      # HALF-OPEN intervals widened by a symmetric turnover buffer.
      conflict = new.starts_at < occupant.ends_at + buffer
                 AND occupant.starts_at < new.ends_at + buffer
      if conflict for any occupant: reject with ERR_EVENT_WINDOW_CONFLICT
    input_set: "WineDinnerEvent rows for the same venue in a non-CANCELLED state."
    constants:
      EVENT_TURNOVER_BUFFER_MINUTES: 120
      EVENT_INTERVAL_SEMANTICS: half_open_with_symmetric_buffer
    precision: >-
      Adjacency is ALLOWED: strict "<" on both sides means a new event starting exactly at
      occupant.ends_at + 120 minutes is accepted, while one minute earlier is refused. This is
      deliberately the opposite geometry to btg_slot_occupancy_check.

  - name: par_reorder_quantity
    trigger: "GET /venues/{venue_id}/par-report"
    algorithm: threshold
    formula: |
      for each ListEntry on the venue's ListVersion whose state IN {PUBLISHED, REPRINT_PENDING}:
          on_hand  = sum(InventoryLot.bottles_on_hand) over lots with
                     (venue_id, entry.wine_id) and state == ON_HAND
          on_order = sum(AllocationClaim.granted_bottles) over claims with venue_id and
                     offer.wine_id == entry.wine_id and state IN {GRANTED, PARTIALLY_GRANTED}
          deficit  = entry.par_bottles - on_hand - on_order
          reorder_bottles = 0 if deficit <= 0
                            else ceil(deficit / wine.case_pack) * wine.case_pack
          urgent = on_hand < ceil(entry.par_bottles * PAR_URGENT_FRACTION)
      rows are returned sorted by urgent DESC, then reorder_bottles DESC, then entry.sort_rank ASC
    input_set: >-
      ListEntry rows of the single live ListVersion for the venue; InventoryLot rows with
      state == ON_HAND; AllocationClaim rows in state GRANTED or PARTIALLY_GRANTED (RECEIVED
      claims already became lots and are excluded to avoid double counting).
    constants:
      PAR_URGENT_FRACTION: 0.5
    precision: >-
      reorder_bottles is rounded UP to whole cases. `urgent` uses strict "<" against
      ceil(par_bottles * 0.5), so on_hand exactly equal to the half-par ceiling is NOT urgent.
    ordering: "urgent DESC -> reorder_bottles DESC -> sort_rank ASC"

  - name: list_entry_contest_points
    trigger: "Every DepletionEntry creation whose list_entry_id equals the entry (writes ListEntry.contest_points)"
    algorithm: weighted_scoring
    formula: |
      entries       = DepletionEntry rows with list_entry_id == entry.id (signed values)
      pours_sold    = sum(entries.pours where reason == SALE_BTG)
      bottles_sold  = sum(entries.bottles where reason == SALE_BOTTLE)
      cogs          = sum(entries.cogs_cents); revenue = sum(entries.revenue_cents)
      if revenue > 0:
          realized_cogs_pct = round_half_up(cogs * 100 / revenue, 2)
          margin_factor = round_half_up(
              min(1.0, max(0.0, (target_pct - realized_cogs_pct) / target_pct)), 4)
      else:
          margin_factor = 0.0
      contest_points = round_half_up(W_BTG * pours_sold + W_BOTTLE * bottles_sold
                                     + W_EDUCATION * (1 if entry.education_verified else 0)
                                     + W_MARGIN * margin_factor, 2)
    input_set: >-
      DepletionEntry rows linked to this ListEntry, all reasons included (REVERSAL entries subtract
      because their values are negative). target_pct is the venue's category target for the wine.
    constants:
      W_BTG: 1.0
      W_BOTTLE: 3.0
      W_EDUCATION: 5.0
      W_MARGIN: 10.0
    precision: "margin_factor is clamped to [0.0, 1.0] and rounded to 4 decimals BEFORE being weighted; the score is rounded to 2 decimals."

# ---------------------------------------------------------------------------
# §1.4 Validation Rules Table (evaluated strictly in ascending priority order)
# ---------------------------------------------------------------------------
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are both present and non-empty"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all
  - priority: 2
    category: auth
    check: "X-User-Role is one of the five roles declared in §1.7"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all
  - priority: 3
    category: auth
    check: "the role is listed in the endpoint's roles"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: all
  - priority: 4
    category: auth
    check: >-
      when X-User-Role == VenueSommelier, X-User-ID equals the venue_id the request targets
      (path venue_id, body venue_id, or the venue reached through list_version -> wine_list,
      list_entry -> list_version -> wine_list, lot, slot, write-off, event or claim)
    error_id: ERR_VENUE_SCOPE_VIOLATION
    http_status: 403
    applies_to: "all VenueSommelier operations"
  - priority: 5
    category: auth
    check: "when X-User-Role == DistributorRep, X-User-ID equals the distributor_id in the request body or path"
    error_id: ERR_DISTRIBUTOR_SCOPE_VIOLATION
    http_status: 403
    applies_to: "POST /allocation-offers, GET /allocation-offers"
  - priority: 10
    category: existence
    check: "every path id resolves, validated left-to-right"
    error_id: "ERR_VENUE_NOT_FOUND | ERR_DISTRIBUTOR_NOT_FOUND | ERR_WINE_NOT_FOUND | ERR_BIN_NOT_FOUND | ERR_OFFER_NOT_FOUND | ERR_CLAIM_NOT_FOUND | ERR_LOT_NOT_FOUND | ERR_DEPLETION_ENTRY_NOT_FOUND | ERR_WINE_LIST_NOT_FOUND | ERR_LIST_VERSION_NOT_FOUND | ERR_LIST_ENTRY_NOT_FOUND | ERR_SLOT_NOT_FOUND | ERR_WRITE_OFF_NOT_FOUND | ERR_EVENT_NOT_FOUND | ERR_INVESTIGATION_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with path ids"
  - priority: 11
    category: existence
    check: "every foreign key in the request body resolves, validated in the body-field order declared in §1.5 input"
    error_id: "ERR_VENUE_NOT_FOUND | ERR_WINE_NOT_FOUND | ERR_BIN_NOT_FOUND | ERR_DISTRIBUTOR_NOT_FOUND | ERR_LIST_VERSION_NOT_FOUND | ERR_LIST_ENTRY_NOT_FOUND | ERR_LOT_NOT_FOUND | ERR_SLOT_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with FK body fields"
  - priority: 12
    category: business_constraint
    check: "all required body fields are present with the declared JSON type"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all POST / PATCH endpoints"
  - priority: 13
    category: business_constraint
    check: "every enum-typed field carries a declared member value"
    error_id: ERR_INVALID_ENUM_VALUE
    http_status: 422
    applies_to: "all POST / PATCH endpoints with enum fields"
  - priority: 14
    category: business_constraint
    check: >-
      numeric fields respect their §1.1 constraints (offered_bottles >= 1, seat_count 1..400,
      priority_rank 1..5, slot_index 1..24, pour_size_ml 25..500, cogs targets 5.0..60.0,
      cogs_target_pct_by_category has exactly the six WINE_CATEGORIES keys)
    error_id: ERR_VALUE_OUT_OF_RANGE
    http_status: 422
    applies_to: "all POST / PATCH endpoints with numeric fields"
  - priority: 15
    category: business_constraint
    check: "limit is an integer in 1..100 and offset is an integer >= 0"
    error_id: ERR_INVALID_PAGINATION
    http_status: 400
    applies_to: "all list endpoints"
  - priority: 16
    category: business_constraint
    check: "by_the_glass == true requires a non-null pour_size_ml"
    error_id: ERR_POUR_SIZE_REQUIRED
    http_status: 400
    applies_to: "POST /list-versions/{list_version_id}/entries, PATCH /list-entries/{list_entry_id}"
  - priority: 17
    category: business_temporal
    check: "starts_at is strictly before ends_at"
    error_id: ERR_INVALID_EVENT_WINDOW
    http_status: 422
    applies_to: "POST /wine-dinner-events"
  - priority: 18
    category: business_temporal
    check: "period_start is strictly before period_end"
    error_id: ERR_INVALID_PERIOD
    http_status: 422
    applies_to: "POST /venues/{venue_id}/pour-cost-runs, GET /venues/{venue_id}/pour-cost-report"
  - priority: 19
    category: business_referential
    check: "venue_code is unique across all venues"
    error_id: ERR_VENUE_CODE_TAKEN
    http_status: 409
    applies_to: "POST /venues"
  - priority: 20
    category: business_referential
    check: "bin_code is unique within the venue"
    error_id: ERR_BIN_CODE_TAKEN
    http_status: 409
    applies_to: "POST /venues/{venue_id}/cellar-bins"
  - priority: 21
    category: business_referential
    check: "no AllocationClaim already exists for this (offer_id, venue_id) pair in any state"
    error_id: ERR_DUPLICATE_CLAIM
    http_status: 409
    applies_to: "POST /allocation-offers/{offer_id}/claims"
  - priority: 22
    category: business_referential
    check: "no ListEntry for this wine_id already exists on this list_version_id"
    error_id: ERR_DUPLICATE_LIST_ENTRY_WINE
    http_status: 409
    applies_to: "POST /list-versions/{list_version_id}/entries"
  - priority: 23
    category: state
    check: "the OCC field matches the parent's current version (expected_offer_version, expected_list_version_version)"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /allocation-offers/{offer_id}/claims, POST /list-versions/{list_version_id}/entries"
  - priority: 24
    category: state
    check: "ListVersion is in state DRAFT"
    error_id: ERR_LIST_VERSION_NOT_DRAFT
    http_status: 409
    applies_to: "POST /list-versions/{list_version_id}/entries, PATCH /list-entries/{list_entry_id}, POST /list-versions/{list_version_id}/submit, POST /list-versions/{list_version_id}/archive"
  - priority: 25
    category: state
    check: "ListVersion is in state IN_REVIEW"
    error_id: ERR_LIST_VERSION_NOT_IN_REVIEW
    http_status: 409
    applies_to: "POST /list-versions/{list_version_id}/publish, POST /list-versions/{list_version_id}/request-changes"
  - priority: 26
    category: state
    check: "ListVersion is in state REPRINT_PENDING"
    error_id: ERR_LIST_VERSION_NOT_REPRINT_PENDING
    http_status: 409
    applies_to: "POST /list-versions/{list_version_id}/mark-reprinted"
  - priority: 27
    category: state
    check: "the referenced ListVersion is in state PUBLISHED or REPRINT_PENDING"
    error_id: ERR_LIST_VERSION_NOT_PUBLISHED
    http_status: 409
    applies_to: "POST /btg-slots, POST /wine-dinner-events, POST /wine-dinner-events/{event_id}/confirm"
  - priority: 28
    category: state
    check: "AllocationOffer.fulfillment_state is OPEN"
    error_id: ERR_OFFER_NOT_OPEN
    http_status: 409
    applies_to: "POST /allocation-offers/{offer_id}/claims, POST /allocation-offers/{offer_id}/allocate"
  - priority: 29
    category: state
    check: "AllocationClaim.state is GRANTED or PARTIALLY_GRANTED"
    error_id: ERR_CLAIM_NOT_GRANTED
    http_status: 409
    applies_to: "POST /allocation-claims/{claim_id}/receive"
  - priority: 30
    category: state
    check: "AllocationClaim.state is REQUESTED, GRANTED or PARTIALLY_GRANTED"
    error_id: ERR_CLAIM_NOT_WITHDRAWABLE
    http_status: 409
    applies_to: "POST /allocation-claims/{claim_id}/withdraw"
  - priority: 31
    category: state
    check: "InventoryLot.state is ON_HAND (or ON_HAND/DEPLETED for a write-off reversal)"
    error_id: ERR_LOT_NOT_ON_HAND
    http_status: 409
    applies_to: "POST /btg-slots, POST /spoilage-write-offs, POST /spoilage-write-offs/{write_off_id}/approve, POST /spoilage-write-offs/{write_off_id}/reverse"
  - priority: 32
    category: state
    check: "BtgSlot.state is OPEN"
    error_id: ERR_SLOT_NOT_OPEN
    http_status: 409
    applies_to: "POST /btg-slots/{btg_slot_id}/close"
  - priority: 33
    category: state
    check: "SpoilageWriteOff.state is SUBMITTED"
    error_id: ERR_WRITE_OFF_NOT_SUBMITTED
    http_status: 409
    applies_to: "POST /spoilage-write-offs/{write_off_id}/approve, POST /spoilage-write-offs/{write_off_id}/reject"
  - priority: 34
    category: state
    check: "SpoilageWriteOff.state is APPROVED"
    error_id: ERR_WRITE_OFF_NOT_APPROVED
    http_status: 409
    applies_to: "POST /spoilage-write-offs/{write_off_id}/reverse"
  - priority: 35
    category: state
    check: "WineDinnerEvent.state matches the transition's from-state"
    error_id: ERR_EVENT_INVALID_STATE
    http_status: 409
    applies_to: "POST /wine-dinner-events/{event_id}/price, /confirm, /settle, /void-settlement, /cancel"
  - priority: 36
    category: state
    check: "VarianceInvestigation.state is OPEN (escalate) or OPEN/ESCALATED (resolve)"
    error_id: ERR_INVESTIGATION_NOT_ACTIONABLE
    http_status: 409
    applies_to: "POST /variance-investigations/{investigation_id}/escalate, /resolve"
  - priority: 37
    category: state
    check: "ListVersion.revision_round is strictly less than MAX_REVISION_ROUNDS (3)"
    error_id: ERR_REVISION_LIMIT_REACHED
    http_status: 409
    applies_to: "POST /list-versions/{list_version_id}/request-changes"
  - priority: 38
    category: state
    check: "ListVersion.entry_count >= 1"
    error_id: ERR_EMPTY_LIST_VERSION
    http_status: 422
    applies_to: "POST /list-versions/{list_version_id}/submit"
  - priority: 39
    category: business_safety
    check: "X-User-ID differs from the submitter recorded on the object being approved or published"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /list-versions/{list_version_id}/publish, POST /spoilage-write-offs/{write_off_id}/approve, POST /spoilage-write-offs/{write_off_id}/reject"
  - priority: 40
    category: business_safety
    check: "the distributor behind the offer is not in compliance_state HOLD"
    error_id: ERR_DISTRIBUTOR_COMPLIANCE_HOLD
    http_status: 422
    applies_to: "POST /allocation-offers, POST /allocation-offers/{offer_id}/claims, POST /allocation-claims/{claim_id}/receive"
  - priority: 41
    category: business_safety
    check: "AllocationOffer.compliance_state is not BLOCKED"
    error_id: ERR_OFFER_COMPLIANCE_BLOCKED
    http_status: 422
    applies_to: "POST /allocation-offers/{offer_id}/allocate, POST /allocation-claims/{claim_id}/receive"
  - priority: 42
    category: business_safety
    check: "no requested BYO category appears in venue.byo_prohibited_categories"
    error_id: ERR_BYO_CATEGORY_PROHIBITED
    http_status: 422
    applies_to: "POST /venues/{venue_id}/corkage-charges"
  - priority: 43
    category: business_temporal
    check: "the logical clock is strictly before offer.response_deadline"
    error_id: ERR_OFFER_DEADLINE_PASSED
    http_status: 422
    applies_to: "POST /allocation-offers/{offer_id}/claims"
  - priority: 44
    category: business_temporal
    check: "received_at is not later than the logical clock"
    error_id: ERR_RECEIVED_AT_IN_FUTURE
    http_status: 422
    applies_to: "POST /inventory-lots, POST /allocation-claims/{claim_id}/receive"
  - priority: 45
    category: business_temporal
    check: "`btg_slot_occupancy_check` finds no occupant of (venue_id, slot_index) covering the current clock instant"
    error_id: ERR_SLOT_OCCUPIED
    http_status: 409
    applies_to: "POST /btg-slots"
  - priority: 46
    category: business_temporal
    check: "`event_window_overlap` finds no buffered conflict on the venue"
    error_id: ERR_EVENT_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /wine-dinner-events"
  - priority: 47
    category: business_referential
    check: "the bin belongs to the same venue as the lot being created"
    error_id: ERR_LOT_VENUE_MISMATCH
    http_status: 422
    applies_to: "POST /inventory-lots, POST /allocation-claims/{claim_id}/receive, POST /spoilage-write-offs"
  - priority: 48
    category: business_referential
    check: "the slot's lot_id references a lot whose wine_id equals the list entry's wine_id and whose venue_id equals the slot's venue_id"
    error_id: ERR_SLOT_WINE_MISMATCH
    http_status: 422
    applies_to: "POST /btg-slots"
  - priority: 49
    category: business_referential
    check: "the list entry referenced by the slot has by_the_glass == true"
    error_id: ERR_ENTRY_NOT_BY_THE_GLASS
    http_status: 422
    applies_to: "POST /btg-slots"
  - priority: 50
    category: business_referential
    check: "every pour_plan line's list_entry_id belongs to the event's list_version_id"
    error_id: ERR_POUR_PLAN_ENTRY_MISMATCH
    http_status: 422
    applies_to: "POST /wine-dinner-events, POST /wine-dinner-events/{event_id}/price"
  - priority: 51
    category: business_referential
    check: "when btg_slot_id is supplied, that slot's state is EXPIRED, its lot_id equals the body lot_id, and bottles == 1"
    error_id: ERR_SLOT_WRITE_OFF_INVALID
    http_status: 422
    applies_to: "POST /spoilage-write-offs"
  - priority: 52
    category: business_referential
    check: "the pinned ListVersion has not left state PUBLISHED since confirmation (pinned_version_stale == false)"
    error_id: ERR_PINNED_LIST_VERSION_STALE
    http_status: 409
    applies_to: "POST /wine-dinner-events/{event_id}/settle"
  - priority: 53
    category: business_constraint
    check: "the bin's zone is not RESERVE unless the wine has is_allocated == true"
    error_id: ERR_BIN_ZONE_MISMATCH
    http_status: 422
    applies_to: "POST /inventory-lots, POST /allocation-claims/{claim_id}/receive"
  - priority: 54
    category: business_constraint
    check: "bin.bottles_stored plus the incoming bottles does not exceed bin.capacity_bottles"
    error_id: ERR_BIN_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /inventory-lots, POST /allocation-claims/{claim_id}/receive"
  - priority: 55
    category: business_constraint
    check: "requested_bottles does not exceed offer.offered_bottles"
    error_id: ERR_REQUEST_EXCEEDS_OFFER
    http_status: 422
    applies_to: "POST /allocation-offers/{offer_id}/claims"
  - priority: 56
    category: business_constraint
    check: "at least one AllocationClaim on the offer is in state REQUESTED"
    error_id: ERR_NO_ELIGIBLE_CLAIMS
    http_status: 422
    applies_to: "POST /allocation-offers/{offer_id}/allocate"
  - priority: 57
    category: business_constraint
    check: "effective_pours = floor(bottle_size_ml / pour_size_ml) - 1 is >= 1"
    error_id: ERR_POUR_SIZE_TOO_LARGE
    http_status: 422
    applies_to: "POST /list-versions/{list_version_id}/entries, PATCH /list-entries/{list_entry_id}"
  - priority: 58
    category: business_constraint
    check: "pours_sold + staff_education_pours does not exceed slot.effective_pours"
    error_id: ERR_POURS_EXCEED_BOTTLE
    http_status: 422
    applies_to: "POST /btg-slots/{btg_slot_id}/close"
  - priority: 59
    category: business_constraint
    check: "byo_bottle_count does not exceed venue.byo_bottle_limit_per_party"
    error_id: ERR_BYO_LIMIT_EXCEEDED
    http_status: 422
    applies_to: "POST /venues/{venue_id}/corkage-charges"
  - priority: 60
    category: business_fiscal
    check: "venue.program_posture is not FROZEN"
    error_id: ERR_VENUE_PROGRAM_FROZEN
    http_status: 409
    applies_to: "POST /list-versions/{list_version_id}/publish, POST /wine-dinner-events/{event_id}/confirm"
  - priority: 61
    category: business_fiscal
    check: >-
      when venue.program_posture IN {RESTRICTED, FROZEN}, the computed price_band of the new entry
      is not PREMIUM and not RESERVE (evaluated AFTER `list_entry_bottle_price` has run)
    error_id: ERR_VENUE_PROGRAM_RESTRICTED
    http_status: 409
    applies_to: "POST /list-versions/{list_version_id}/entries"
  - priority: 62
    category: business_fiscal
    check: >-
      the requested bottles are available: for a slot open, lot.bottles_on_hand -
      lot.bottles_committed >= 1; for a write-off approval, the §1.2 availability formula; for a
      settlement, every pour-plan line's bottles_needed
    error_id: ERR_INSUFFICIENT_BOTTLES
    http_status: 409
    applies_to: "POST /btg-slots, POST /spoilage-write-offs, POST /spoilage-write-offs/{write_off_id}/approve, POST /wine-dinner-events/{event_id}/settle"
  - priority: 63
    category: business_fiscal
    check: "the period contains at least one DepletionEntry with non-zero revenue in both the ACTUAL and THEORETICAL input sets"
    error_id: ERR_NO_REVENUE_IN_PERIOD
    http_status: 422
    applies_to: "POST /venues/{venue_id}/pour-cost-runs, GET /venues/{venue_id}/pour-cost-report"

# ---------------------------------------------------------------------------
# §1.5 Endpoints (67; all business paths under /beverage-program)
# ---------------------------------------------------------------------------
endpoints:
  # --- Venue -----------------------------------------------------------------
  - method: POST
    path: /beverage-program/venues
    roles: [BeverageDirector]
    input: [name, venue_code, cogs_target_pct_by_category, "costing_method?", "event_cogs_target_pct?", "corkage_fee_cents?", "corkage_waiver_purchase_ratio?", "byo_bottle_limit_per_party?", "byo_prohibited_categories?", "priority_rank?"]
    output: Venue
    status: 201
    side_effects:
      - "program_posture initialised to OPEN; last_variance_pct, cogs_ledger_cents and revenue_ledger_cents initialised to 0"
    description: "Register a restaurant-group venue with its per-category COGS targets and corkage policy."
  - method: GET
    path: /beverage-program/venues/{venue_id}
    roles: [BeverageDirector, VenueSommelier, DistributorRep, Controller, ComplianceOfficer]
    input: []
    output: Venue
    status: 200
    side_effects: []
    description: "Read one venue, including its computed program_posture and ledgers."
  - method: GET
    path: /beverage-program/venues
    roles: [BeverageDirector, VenueSommelier, DistributorRep, Controller, ComplianceOfficer]
    input: ["program_posture?", "costing_method?", "limit?", "offset?"]
    output: Venue[]
    status: 200
    side_effects: []
    description: "List venues, filterable by posture and costing method."
  # --- CellarBin -------------------------------------------------------------
  - method: POST
    path: /beverage-program/venues/{venue_id}/cellar-bins
    roles: [VenueSommelier, BeverageDirector]
    input: [bin_code, zone, capacity_bottles, "temperature_controlled?"]
    output: CellarBin
    status: 201
    side_effects:
      - "bottles_stored set to 0, utilization_pct set to 0.00, bin_state set to ACTIVE"
    description: "Create a cellar bin location within a venue."
  - method: GET
    path: /beverage-program/cellar-bins/{bin_id}
    roles: [BeverageDirector, VenueSommelier, Controller, ComplianceOfficer]
    input: []
    output: CellarBin
    status: 200
    side_effects: []
    description: "Read one cellar bin with its occupancy figures."
  - method: GET
    path: /beverage-program/cellar-bins
    roles: [BeverageDirector, VenueSommelier, Controller, ComplianceOfficer]
    input: ["venue_id?", "zone?", "bin_state?", "limit?", "offset?"]
    output: CellarBin[]
    status: 200
    side_effects: []
    description: "List cellar bins, filterable by venue, zone and bin_state."
  # --- Distributor -----------------------------------------------------------
  - method: POST
    path: /beverage-program/distributors
    roles: [BeverageDirector]
    input: [name, license_number, "allocation_tier?", "on_time_delivery_pct?"]
    output: Distributor
    status: 201
    side_effects:
      - "compliance_state initialised to PENDING_REVIEW"
    description: "Register a wine distributor. Compliance clearance is a separate ComplianceOfficer step."
  - method: GET
    path: /beverage-program/distributors/{distributor_id}
    roles: [BeverageDirector, VenueSommelier, DistributorRep, Controller, ComplianceOfficer]
    input: []
    output: Distributor
    status: 200
    side_effects: []
    description: "Read one distributor with its compliance_state."
  - method: GET
    path: /beverage-program/distributors
    roles: [BeverageDirector, VenueSommelier, DistributorRep, Controller, ComplianceOfficer]
    input: ["allocation_tier?", "compliance_state?", "limit?", "offset?"]
    output: Distributor[]
    status: 200
    side_effects: []
    description: "List distributors, filterable by tier and compliance_state."
  - method: POST
    path: /beverage-program/distributors/{distributor_id}/compliance-reviews
    roles: [ComplianceOfficer]
    input: [decision, "note?"]
    output: Distributor
    status: 200
    side_effects:
      - "drives Distributor transitions PENDING_REVIEW_to_CLEARED, PENDING_REVIEW_to_HOLD, CLEARED_to_HOLD or HOLD_to_CLEARED depending on `decision`"
      - "when the resulting compliance_state is HOLD, every AllocationOffer of this distributor whose compliance_state is PENDING_LICENSE_CHECK or CLEARED moves to BLOCKED (compliance_CLEARED_to_BLOCKED / compliance_PENDING_LICENSE_CHECK_to_BLOCKED); fulfillment_state is untouched"
      - "when the resulting compliance_state is CLEARED, every AllocationOffer of this distributor whose compliance_state is BLOCKED moves to CLEARED (compliance_BLOCKED_to_CLEARED)"
      - "last_review_note set from `note`"
    description: "Record a licence/compliance decision on a distributor; cascades to the compliance dimension of its offers only."
  # --- Wine ------------------------------------------------------------------
  - method: POST
    path: /beverage-program/wines
    roles: [BeverageDirector]
    input: [producer, cuvee, vintage_year, category, reference_cost_cents, "bottle_size_ml?", "case_pack?", "is_allocated?", "predecessor_wine_id?"]
    output: Wine
    status: 201
    side_effects:
      - "successor_count initialised to 0"
      - "when predecessor_wine_id is supplied, the predecessor Wine's successor_count increments by 1"
      - "when predecessor_wine_id is supplied, every ListEntry referencing the predecessor wine whose ListVersion.state is DRAFT, IN_REVIEW, PUBLISHED or REPRINT_PENDING gets vintage_stale = true"
      - "each affected ListVersion recomputes stale_entry_count and reprint_required (reprint_required = stale_entry_count >= REPRINT_THRESHOLD_ENTRIES)"
      - "a PUBLISHED ListVersion whose reprint_required becomes true moves to REPRINT_PENDING (PUBLISHED_to_REPRINT_PENDING), which sets pinned_version_stale = true on every WineDinnerEvent in state PLANNED, PRICED or CONFIRMED that pins it"
    description: "Register a wine. Declaring a predecessor is the vintage-change event that propagates staleness into published lists."
  - method: GET
    path: /beverage-program/wines/{wine_id}
    roles: [BeverageDirector, VenueSommelier, DistributorRep, Controller, ComplianceOfficer]
    input: []
    output: Wine
    status: 200
    side_effects: []
    description: "Read one wine."
  - method: GET
    path: /beverage-program/wines
    roles: [BeverageDirector, VenueSommelier, DistributorRep, Controller, ComplianceOfficer]
    input: ["category?", "is_allocated?", "predecessor_wine_id?", "limit?", "offset?"]
    output: Wine[]
    status: 200
    side_effects: []
    description: "List wines; predecessor_wine_id exposes the vintage lineage."
  # --- AllocationOffer -------------------------------------------------------
  - method: POST
    path: /beverage-program/allocation-offers
    roles: [DistributorRep]
    input: [distributor_id, wine_id, offered_bottles, unit_cost_cents, response_deadline]
    output: AllocationOffer
    status: 201
    side_effects:
      - "fulfillment_state initialised to OPEN, compliance_state initialised to PENDING_LICENSE_CHECK"
      - "when the distributor's compliance_state is already CLEARED the offer's compliance_state is set to CLEARED at creation"
      - "unallocated_bottles set to offered_bottles, claim_count set to 0"
    description: "A distributor rep posts an allocation offer for one wine to the whole restaurant group."
  - method: GET
    path: /beverage-program/allocation-offers/{offer_id}
    roles: [BeverageDirector, VenueSommelier, DistributorRep, Controller, ComplianceOfficer]
    input: []
    output: AllocationOffer
    status: 200
    side_effects: []
    description: "Read one allocation offer, including both of its parallel state dimensions and its version (for OCC)."
  - method: GET
    path: /beverage-program/allocation-offers
    roles: [BeverageDirector, VenueSommelier, DistributorRep, Controller, ComplianceOfficer]
    input: ["distributor_id?", "wine_id?", "fulfillment_state?", "compliance_state?", "limit?", "offset?"]
    output: AllocationOffer[]
    status: 200
    side_effects: []
    description: "List allocation offers, filterable on either state dimension independently."
  - method: POST
    path: /beverage-program/allocation-offers/{offer_id}/claims
    roles: [VenueSommelier]
    input: [venue_id, requested_bottles, expected_offer_version]
    output: AllocationClaim
    status: 201
    side_effects:
      - "the parent AllocationOffer.version increments by 1 and its claim_count increments by 1"
      - "claim state initialised to REQUESTED with granted_bottles 0, raw_share 0.0000, remainder_awarded false"
    description: "A venue sommelier claims bottles from an open offer. Guarded by OCC on the offer's version."
  - method: POST
    path: /beverage-program/allocation-offers/{offer_id}/allocate
    roles: [BeverageDirector]
    input: []
    output: AllocationOffer
    status: 200
    side_effects:
      - "runs `allocation_waterfall_grant` over all REQUESTED claims on the offer"
      - "each claim gets raw_share, granted_bottles, remainder_awarded and state GRANTED (granted == requested) or PARTIALLY_GRANTED (0 < granted < requested) or REJECTED (granted == 0)"
      - "offer.unallocated_bottles set to offered_bottles minus the sum of granted_bottles; allocated_at set to the logical clock"
      - "offer fulfillment_state moves OPEN -> ALLOCATED (fulfillment_OPEN_to_ALLOCATED); compliance_state is untouched"
      - "offer.version increments by 1"
    description: "Close claiming and run the pro-rata allocation waterfall across all requesting venues."
  # --- AllocationClaim -------------------------------------------------------
  - method: GET
    path: /beverage-program/allocation-claims/{claim_id}
    roles: [BeverageDirector, VenueSommelier, DistributorRep, Controller, ComplianceOfficer]
    input: []
    output: AllocationClaim
    status: 200
    side_effects: []
    description: "Read one allocation claim with its granted bottles and raw_share."
  - method: GET
    path: /beverage-program/allocation-claims
    roles: [BeverageDirector, VenueSommelier, DistributorRep, Controller, ComplianceOfficer]
    input: ["offer_id?", "venue_id?", "state?", "limit?", "offset?"]
    output: AllocationClaim[]
    status: 200
    side_effects: []
    description: "List allocation claims by offer, venue or state."
  - method: POST
    path: /beverage-program/allocation-claims/{claim_id}/withdraw
    roles: [VenueSommelier]
    input: []
    output: AllocationClaim
    status: 200
    side_effects:
      - "claim state moves to WITHDRAWN (REQUESTED_to_WITHDRAWN, GRANTED_to_WITHDRAWN or PARTIALLY_GRANTED_to_WITHDRAWN)"
      - "when the claim had granted_bottles > 0, offer.unallocated_bottles increases by granted_bottles"
      - "offer.claim_count decrements by 1 and offer.version increments by 1"
    description: "A venue drops its claim; any bottles already granted return to the offer's unallocated pool."
  - method: POST
    path: /beverage-program/allocation-claims/{claim_id}/receive
    roles: [VenueSommelier]
    input: [bin_id, received_at]
    output: InventoryLot
    status: 201
    side_effects:
      - "claim state moves to RECEIVED (GRANTED_to_RECEIVED or PARTIALLY_GRANTED_to_RECEIVED)"
      - "creates an InventoryLot with venue_id = claim.venue_id, wine_id = offer.wine_id, source_claim_id = claim.id, bottles_received = bottles_on_hand = claim.granted_bottles, bottles_committed = 0, unit_cost_cents = offer.unit_cost_cents, state ON_HAND"
      - "bin.bottles_stored increases by granted_bottles; bin.utilization_pct recomputed; bin_state becomes FULL when bottles_stored == capacity_bottles"
    description: "Take physical delivery of a granted allocation into a cellar bin."
  # --- InventoryLot ----------------------------------------------------------
  - method: POST
    path: /beverage-program/inventory-lots
    roles: [VenueSommelier]
    input: [venue_id, wine_id, bin_id, bottles_received, unit_cost_cents, received_at]
    output: InventoryLot
    status: 201
    side_effects:
      - "bottles_on_hand set to bottles_received, bottles_committed set to 0, state set to ON_HAND, source_claim_id left null"
      - "bin.bottles_stored increases by bottles_received; bin.utilization_pct recomputed; bin_state becomes FULL at capacity"
      - "every ListEntry for this (venue, wine) whose availability_state is OUT_OF_STOCK returns to AVAILABLE, decrementing its ListVersion.out_of_stock_entry_count"
    description: "Direct (non-allocated) purchase receipt into a bin."
  - method: GET
    path: /beverage-program/inventory-lots/{lot_id}
    roles: [BeverageDirector, VenueSommelier, Controller, ComplianceOfficer]
    input: []
    output: InventoryLot
    status: 200
    side_effects: []
    description: "Read one inventory lot with on-hand and committed bottle counts."
  - method: GET
    path: /beverage-program/inventory-lots
    roles: [BeverageDirector, VenueSommelier, Controller, ComplianceOfficer]
    input: ["venue_id?", "wine_id?", "bin_id?", "source_claim_id?", "state?", "limit?", "offset?"]
    output: InventoryLot[]
    status: 200
    side_effects: []
    description: "List inventory lots; ordering is received_at ASC then created_at ASC (the FIFO consumption order)."
  # --- DepletionEntry (append-only ledger) -----------------------------------
  - method: GET
    path: /beverage-program/depletion-entries/{depletion_entry_id}
    roles: [BeverageDirector, VenueSommelier, Controller, ComplianceOfficer]
    input: []
    output: DepletionEntry
    status: 200
    side_effects: []
    description: "Read one immutable depletion ledger entry."
  - method: GET
    path: /beverage-program/depletion-entries
    roles: [BeverageDirector, VenueSommelier, Controller, ComplianceOfficer]
    input: ["venue_id?", "wine_id?", "lot_id?", "list_entry_id?", "btg_slot_id?", "event_id?", "write_off_id?", "reason?", "limit?", "offset?"]
    output: DepletionEntry[]
    status: 200
    side_effects: []
    description: "List depletion ledger entries, ordered occurred_at ASC then created_at ASC. Reversals appear as additional negative-value entries, never as edits."
  # --- WineList --------------------------------------------------------------
  - method: POST
    path: /beverage-program/venues/{venue_id}/wine-lists
    roles: [BeverageDirector, VenueSommelier]
    input: [name]
    output: WineList
    status: 201
    side_effects:
      - "next_version_no initialised to 1, published_version_no initialised to null"
    description: "Create a named wine list (the container that owns an ordered chain of versions)."
  - method: GET
    path: /beverage-program/wine-lists/{wine_list_id}
    roles: [BeverageDirector, VenueSommelier, Controller, ComplianceOfficer]
    input: []
    output: WineList
    status: 200
    side_effects: []
    description: "Read one wine list with its currently published version number."
  - method: GET
    path: /beverage-program/wine-lists
    roles: [BeverageDirector, VenueSommelier, Controller, ComplianceOfficer]
    input: ["venue_id?", "limit?", "offset?"]
    output: WineList[]
    status: 200
    side_effects: []
    description: "List wine lists, filterable by venue."
  # --- ListVersion -----------------------------------------------------------
  - method: POST
    path: /beverage-program/wine-lists/{wine_list_id}/versions
    roles: [VenueSommelier, BeverageDirector]
    input: ["supersedes_version_id?"]
    output: ListVersion
    status: 201
    side_effects:
      - "version_no set to wine_list.next_version_no; wine_list.next_version_no increments by 1"
      - "state initialised to DRAFT; entry_count, stale_entry_count, out_of_stock_entry_count and revision_round initialised to 0; reprint_required initialised to false"
      - "when supersedes_version_id is supplied it must belong to the same wine_list; the reference is recorded but the predecessor is not superseded until this version is published"
    description: "Open a new draft version of a wine list, optionally chained to the version it will replace."
  - method: GET
    path: /beverage-program/list-versions/{list_version_id}
    roles: [BeverageDirector, VenueSommelier, Controller, ComplianceOfficer]
    input: []
    output: ListVersion
    status: 200
    side_effects: []
    description: "Read one list version, including its `version` field for OCC on entry writes."
  - method: GET
    path: /beverage-program/list-versions
    roles: [BeverageDirector, VenueSommelier, Controller, ComplianceOfficer]
    input: ["wine_list_id?", "supersedes_version_id?", "state?", "limit?", "offset?"]
    output: ListVersion[]
    status: 200
    side_effects: []
    description: "List list-versions; supersedes_version_id exposes the supersession chain."
  - method: POST
    path: /beverage-program/list-versions/{list_version_id}/submit
    roles: [VenueSommelier, BeverageDirector]
    input: []
    output: ListVersion
    status: 200
    side_effects:
      - "state moves DRAFT -> IN_REVIEW (DRAFT_to_IN_REVIEW)"
      - "submitted_by_user_id set to the caller's X-User-ID (overwriting any previous submitter)"
    description: "Send a draft list to the beverage director for review."
  - method: POST
    path: /beverage-program/list-versions/{list_version_id}/request-changes
    roles: [BeverageDirector]
    input: [note]
    output: ListVersion
    status: 200
    side_effects:
      - "state moves IN_REVIEW -> DRAFT (IN_REVIEW_to_DRAFT)"
      - "revision_round increments by 1"
    description: "Bounce a list version back to draft. At most MAX_REVISION_ROUNDS (3) rounds are allowed."
  - method: POST
    path: /beverage-program/list-versions/{list_version_id}/publish
    roles: [BeverageDirector]
    input: []
    output: ListVersion
    status: 200
    side_effects:
      - "state moves IN_REVIEW -> PUBLISHED (IN_REVIEW_to_PUBLISHED)"
      - "published_by_user_id set to X-User-ID, published_at and printed_at set to the logical clock"
      - "wine_list.published_version_no set to this version_no"
      - "when supersedes_version_id is set and that version is in state PUBLISHED or REPRINT_PENDING it moves to SUPERSEDED (PUBLISHED_to_SUPERSEDED / REPRINT_PENDING_to_SUPERSEDED), which sets pinned_version_stale = true on every WineDinnerEvent in state PLANNED, PRICED or CONFIRMED pinning it"
    description: "Publish a reviewed list version. Requires a publisher different from the submitter and a venue posture other than FROZEN."
  - method: POST
    path: /beverage-program/list-versions/{list_version_id}/mark-reprinted
    roles: [VenueSommelier, BeverageDirector]
    input: []
    output: ListVersion
    status: 200
    side_effects:
      - "state moves REPRINT_PENDING -> PUBLISHED (REPRINT_PENDING_to_PUBLISHED)"
      - "every ListEntry on this version gets vintage_stale = false; stale_entry_count set to 0 and reprint_required set to false"
      - "printed_at set to the logical clock"
      - "pinned_version_stale is NOT cleared on events that were already marked stale"
    description: "Record that the physical list has been reprinted after a vintage change, returning the version to PUBLISHED."
  - method: POST
    path: /beverage-program/list-versions/{list_version_id}/archive
    roles: [BeverageDirector]
    input: []
    output: ListVersion
    status: 200
    side_effects:
      - "state moves DRAFT -> ARCHIVED (DRAFT_to_ARCHIVED); the version becomes terminal and no further entry writes are accepted"
    description: "Abandon a draft list version."
  # --- ListEntry -------------------------------------------------------------
  - method: POST
    path: /beverage-program/list-versions/{list_version_id}/entries
    roles: [VenueSommelier]
    input: [wine_id, sort_rank, expected_list_version_version, "by_the_glass?", "pour_size_ml?", "par_bottles?", "tasting_note?", "education_verified?"]
    output: ListEntry
    status: 201
    side_effects:
      - "bottle_price_cents and price_band computed by `list_entry_bottle_price`"
      - "effective_pours and glass_price_cents computed by `list_entry_glass_price` when by_the_glass is true, otherwise both null"
      - "availability_state set to AVAILABLE when some ON_HAND lot of this (venue, wine) has bottles_on_hand > bottles_committed, otherwise OUT_OF_STOCK (incrementing out_of_stock_entry_count)"
      - "vintage_stale set to true when the wine's successor_count > 0, incrementing stale_entry_count"
      - "contest_points computed by `list_entry_contest_points`"
      - "the parent ListVersion.version increments by 1 and entry_count increments by 1"
    description: "Add a wine to a draft list version. Guarded by OCC on the list version's version."
  - method: GET
    path: /beverage-program/list-entries/{list_entry_id}
    roles: [BeverageDirector, VenueSommelier, Controller, ComplianceOfficer]
    input: []
    output: ListEntry
    status: 200
    side_effects: []
    description: "Read one list entry with its computed price band, glass price and contest points."
  - method: GET
    path: /beverage-program/list-entries
    roles: [BeverageDirector, VenueSommelier, Controller, ComplianceOfficer]
    input: ["list_version_id?", "wine_id?", "price_band?", "by_the_glass?", "availability_state?", "limit?", "offset?"]
    output: ListEntry[]
    status: 200
    side_effects: []
    description: "List entries, ordered sort_rank ASC then created_at ASC."
  - method: PATCH
    path: /beverage-program/list-entries/{list_entry_id}
    roles: [VenueSommelier]
    input: ["by_the_glass?", "pour_size_ml?", "tasting_note?", "education_verified?", "par_bottles?", "sort_rank?"]
    output: ListEntry
    status: 200
    side_effects:
      - "changing by_the_glass or pour_size_ml re-runs `list_entry_glass_price` (clearing effective_pours and glass_price_cents when by_the_glass becomes false)"
      - "changing education_verified re-runs `list_entry_contest_points`"
    description: "Edit a list entry while its version is still DRAFT."
  # --- BtgSlot ---------------------------------------------------------------
  - method: POST
    path: /beverage-program/btg-slots
    roles: [VenueSommelier]
    input: [venue_id, list_entry_id, lot_id, slot_index, preservation_method]
    output: BtgSlot
    status: 201
    side_effects:
      - "state initialised to OPEN; opened_at set to the logical clock"
      - "preservation_expires_at computed by `btg_preservation_expiry`"
      - "effective_pours copied from the list entry's effective_pours (frozen at open time, so later entry edits do not move it)"
      - "pours_sold, staff_education_pours and spoiled_pours initialised to 0"
      - "lot.bottles_committed increments by 1; lot.bottles_on_hand is NOT changed until the slot closes"
    description: "Open a by-the-glass bottle in a numbered backbar slot under a preservation method."
  - method: GET
    path: /beverage-program/btg-slots/{btg_slot_id}
    roles: [BeverageDirector, VenueSommelier, Controller, ComplianceOfficer]
    input: []
    output: BtgSlot
    status: 200
    side_effects: []
    description: "Read one by-the-glass slot, including its preservation expiry instant."
  - method: GET
    path: /beverage-program/btg-slots
    roles: [BeverageDirector, VenueSommelier, Controller, ComplianceOfficer]
    input: ["venue_id?", "list_entry_id?", "lot_id?", "state?", "limit?", "offset?"]
    output: BtgSlot[]
    status: 200
    side_effects: []
    description: "List by-the-glass slots, ordered slot_index ASC then created_at ASC."
  - method: POST
    path: /beverage-program/btg-slots/{btg_slot_id}/close
    roles: [VenueSommelier]
    input: [pours_sold, "staff_education_pours?"]
    output: BtgSlot
    status: 200
    side_effects:
      - "when the logical clock is at or after preservation_expires_at the slot moves OPEN -> EXPIRED (OPEN_to_EXPIRED_on_close), the submitted pours are discarded, spoiled_pours is set to effective_pours and no revenue is recognised"
      - "otherwise the slot moves OPEN -> CLOSED (OPEN_to_CLOSED) with the submitted pours_sold and staff_education_pours recorded and spoiled_pours = effective_pours - pours_sold - staff_education_pours"
      - "`lot_depletion_cogs` prices exactly 1 bottle out of the lot chain and `btg_close_cost_split` divides that cost across the SALE_BTG, STAFF_EDUCATION and SPOILAGE reasons"
      - "lot.bottles_committed decrements by 1 and lot.bottles_on_hand decrements by 1; a lot reaching bottles_on_hand 0 moves ON_HAND -> DEPLETED"
      - "appends one DepletionEntry per non-zero reason bucket and increments venue.cogs_ledger_cents / venue.revenue_ledger_cents accordingly"
      - "a lot that becomes DEPLETED with no other available lot flips every matching ListEntry to OUT_OF_STOCK, incrementing that ListVersion.out_of_stock_entry_count"
    description: "Close a by-the-glass bottle, splitting its cost across sold, education and spoiled pours."
  # --- SpoilageWriteOff ------------------------------------------------------
  - method: POST
    path: /beverage-program/spoilage-write-offs
    roles: [VenueSommelier, Controller]
    input: [venue_id, lot_id, bottles, reason_code, narrative, "btg_slot_id?"]
    output: SpoilageWriteOff
    status: 201
    side_effects:
      - "state initialised to SUBMITTED; submitted_by_user_id set to X-User-ID; cogs_cents initialised to 0"
      - "no inventory or ledger movement happens until the Controller approves"
    description: "Propose a spoilage / breakage write-off against a lot. Both VenueSommelier and Controller may submit, which is what makes the segregation-of-duties check reachable."
  - method: GET
    path: /beverage-program/spoilage-write-offs/{write_off_id}
    roles: [BeverageDirector, VenueSommelier, Controller, ComplianceOfficer]
    input: []
    output: SpoilageWriteOff
    status: 200
    side_effects: []
    description: "Read one spoilage write-off with its approval trail."
  - method: GET
    path: /beverage-program/spoilage-write-offs
    roles: [BeverageDirector, VenueSommelier, Controller, ComplianceOfficer]
    input: ["venue_id?", "lot_id?", "btg_slot_id?", "state?", "limit?", "offset?"]
    output: SpoilageWriteOff[]
    status: 200
    side_effects: []
    description: "List spoilage write-offs by venue, lot, slot or state."
  - method: POST
    path: /beverage-program/spoilage-write-offs/{write_off_id}/approve
    roles: [Controller]
    input: []
    output: SpoilageWriteOff
    status: 200
    side_effects:
      - "state moves SUBMITTED -> APPROVED (SUBMITTED_to_APPROVED); approved_by_user_id set to X-User-ID"
      - "cogs_cents computed by `lot_depletion_cogs` over the written-off bottles"
      - "lot.bottles_on_hand decreases by bottles; a lot reaching 0 moves ON_HAND -> DEPLETED"
      - "bin.bottles_stored decreases by bottles; utilization_pct recomputed; a FULL bin returns to ACTIVE"
      - "appends one DepletionEntry with reason SPOILAGE (positive bottles, positive cogs_cents, zero revenue) and increases venue.cogs_ledger_cents"
      - "when the lot becomes DEPLETED with no other available lot, matching ListEntry rows flip to OUT_OF_STOCK and their ListVersion.out_of_stock_entry_count increments"
      - "when btg_slot_id is set, that slot moves EXPIRED -> WRITTEN_OFF (EXPIRED_to_WRITTEN_OFF) and its bottles_committed reservation is released"
    description: "Approve a write-off. This is the transitive cascade entry point: money, inventory, bins, list availability and slots all move."
  - method: POST
    path: /beverage-program/spoilage-write-offs/{write_off_id}/reject
    roles: [Controller]
    input: [note]
    output: SpoilageWriteOff
    status: 200
    side_effects:
      - "state moves SUBMITTED -> REJECTED (SUBMITTED_to_REJECTED); resolution_note set from `note`; no inventory or ledger movement"
    description: "Reject a proposed write-off."
  - method: POST
    path: /beverage-program/spoilage-write-offs/{write_off_id}/reverse
    roles: [Controller]
    input: [note]
    output: SpoilageWriteOff
    status: 200
    side_effects:
      - "state moves APPROVED -> REVERSED (APPROVED_to_REVERSED); resolution_note set from `note`"
      - "lot.bottles_on_hand increases by bottles; a DEPLETED lot returns to ON_HAND (DEPLETED_to_ON_HAND)"
      - "bin.bottles_stored increases by bottles and utilization_pct is recomputed"
      - "appends one compensating DepletionEntry with reason REVERSAL carrying negative bottles and negative cogs_cents equal to the approved figures, so the two entries sum to zero; venue.cogs_ledger_cents returns to its pre-approval value"
      - "matching ListEntry rows that were flipped to OUT_OF_STOCK return to AVAILABLE and out_of_stock_entry_count decrements"
      - "the original APPROVED DepletionEntry is never mutated or deleted"
    description: "Reverse an approved write-off by compensation, never by editing the append-only ledger."
  # --- WineDinnerEvent -------------------------------------------------------
  - method: POST
    path: /beverage-program/wine-dinner-events
    roles: [VenueSommelier]
    input: [venue_id, list_version_id, name, starts_at, ends_at, seat_count, pour_plan]
    output: WineDinnerEvent
    status: 201
    side_effects:
      - "state initialised to PLANNED; pinned_version_no set to the referenced ListVersion.version_no; pinned_version_stale set to false"
      - "`event_window_overlap` is evaluated against the venue's PLANNED, PRICED, CONFIRMED and SETTLED events"
      - "all pricing fields (beverage_cost_per_seat_cents, provisional_gross_cents, tier_discount_pct, final_ticket_price_cents, projected_pour_cost_pct) initialised to null"
    description: "Schedule a wine dinner against a published list version, pinning the version number at creation."
  - method: GET
    path: /beverage-program/wine-dinner-events/{event_id}
    roles: [BeverageDirector, VenueSommelier, Controller, ComplianceOfficer]
    input: []
    output: WineDinnerEvent
    status: 200
    side_effects: []
    description: "Read one wine dinner event with its pinned version and pricing figures."
  - method: GET
    path: /beverage-program/wine-dinner-events
    roles: [BeverageDirector, VenueSommelier, Controller, ComplianceOfficer]
    input: ["venue_id?", "list_version_id?", "state?", "limit?", "offset?"]
    output: WineDinnerEvent[]
    status: 200
    side_effects: []
    description: "List wine dinner events, ordered starts_at ASC then created_at ASC."
  - method: POST
    path: /beverage-program/wine-dinner-events/{event_id}/price
    roles: [VenueSommelier]
    input: []
    output: WineDinnerEvent
    status: 200
    side_effects:
      - "runs `wine_dinner_ticket_price` in a single pass, setting beverage_cost_per_seat_cents, provisional_gross_cents, tier_discount_pct, final_ticket_price_cents and projected_pour_cost_pct"
      - "state moves PLANNED -> PRICED (PLANNED_to_PRICED) or is re-priced in place (PRICED_to_PRICED)"
      - "the tier is keyed on provisional_gross_cents and is never re-derived from final_ticket_price_cents, so repricing an already PRICED event is idempotent"
    description: "Compute the wine dinner ticket price from the pour plan, the venue's event COGS target and the volume tier."
  - method: POST
    path: /beverage-program/wine-dinner-events/{event_id}/confirm
    roles: [BeverageDirector]
    input: []
    output: WineDinnerEvent
    status: 200
    side_effects:
      - "state moves PRICED -> CONFIRMED (PRICED_to_CONFIRMED); the pinned list version and the priced ticket are frozen"
    description: "Confirm a priced wine dinner. Blocked when the venue posture is FROZEN."
  - method: POST
    path: /beverage-program/wine-dinner-events/{event_id}/settle
    roles: [Controller]
    input: []
    output: WineDinnerEvent
    status: 200
    side_effects:
      - "state moves CONFIRMED -> SETTLED (CONFIRMED_to_SETTLED)"
      - "`event_settlement_draw` converts each pour_plan line into whole bottles and `lot_depletion_cogs` prices them under venue.costing_method"
      - "settled_cogs_cents set to the sum of the priced draws; settled_revenue_cents set to final_ticket_price_cents * seat_count"
      - "lot.bottles_on_hand decreases along the consumption chain; exhausted lots move ON_HAND -> DEPLETED and their bins release stored bottles"
      - "appends one DepletionEntry per consumed lot with reason EVENT and increases venue.cogs_ledger_cents and venue.revenue_ledger_cents"
      - "refused with ERR_PINNED_LIST_VERSION_STALE when pinned_version_stale is true"
    description: "Settle a confirmed wine dinner: draw the bottles, price them under the venue's costing method and post the ledger."
  - method: POST
    path: /beverage-program/wine-dinner-events/{event_id}/void-settlement
    roles: [Controller]
    input: [note]
    output: WineDinnerEvent
    status: 200
    side_effects:
      - "state moves SETTLED -> SETTLEMENT_VOIDED (SETTLED_to_SETTLEMENT_VOIDED)"
      - "every bottle drawn at settlement is returned to the exact lot it came from; DEPLETED lots return to ON_HAND (DEPLETED_to_ON_HAND) and bins re-absorb the bottles"
      - "appends one compensating DepletionEntry with reason REVERSAL per original EVENT entry, carrying negated bottles, cogs_cents and revenue_cents"
      - "venue.cogs_ledger_cents and venue.revenue_ledger_cents return to their pre-settlement values; settled_cogs_cents and settled_revenue_cents reset to null"
    description: "Void a settlement by compensation, restoring inventory and both ledgers exactly."
  - method: POST
    path: /beverage-program/wine-dinner-events/{event_id}/cancel
    roles: [VenueSommelier, BeverageDirector]
    input: ["note?"]
    output: WineDinnerEvent
    status: 200
    side_effects:
      - "state moves to CANCELLED from PLANNED, PRICED, CONFIRMED or SETTLEMENT_VOIDED; the event's time window stops blocking `event_window_overlap`"
    description: "Cancel a wine dinner. A SETTLED event must be voided before it can be cancelled."
  # --- Pour cost, par levels and variance ------------------------------------
  - method: POST
    path: /beverage-program/venues/{venue_id}/pour-cost-runs
    roles: [BeverageDirector]
    input: [period_start, period_end]
    output: Venue
    status: 200
    side_effects:
      - "runs `venue_pour_cost_variance` for both variants over the period"
      - "venue.last_variance_pct set to the ACTUAL-minus-THEORETICAL spread; last_pour_cost_run_at set to the logical clock"
      - "venue.program_posture recomputed with strict boundaries: OPEN at or below VARIANCE_RESTRICTED_PCT, RESTRICTED strictly above VARIANCE_RESTRICTED_PCT and at or below VARIANCE_FROZEN_PCT, FROZEN strictly above VARIANCE_FROZEN_PCT (or whenever an ESCALATED VarianceInvestigation exists)"
      - "when the posture becomes RESTRICTED or FROZEN and no OPEN or ESCALATED VarianceInvestigation exists for the venue, one is created in state OPEN with triggered_variance_pct, period_start and period_end"
    description: "Run the pour-cost variance job for a venue and period; this is what drives the venue's fiscal posture."
  - method: GET
    path: /beverage-program/venues/{venue_id}/pour-cost-report
    roles: [BeverageDirector, Controller]
    input: [period_start, period_end]
    output: { period_start: string, period_end: string, actual_pour_cost_pct: decimal, theoretical_pour_cost_pct: decimal, variance_pct: decimal, actual_cogs_cents: integer, actual_revenue_cents: integer, theoretical_cogs_cents: integer, theoretical_revenue_cents: integer, entry_count: integer }
    status: 200
    side_effects: []
    description: "Read-only both-variant pour-cost report. Recomputes on demand and never mutates posture."
  - method: GET
    path: /beverage-program/venues/{venue_id}/par-report
    roles: [BeverageDirector, VenueSommelier]
    input: ["urgent_only?", "limit?", "offset?"]
    output: "{ venue_id: string, generated_at: string, line_count: integer, urgent_line_count: integer, lines: object[] }"
    status: 200
    side_effects: []
    description: "Par-level depletion report. Each line carries list_entry_id, wine_id, par_bottles, bottles_on_hand, bottles_on_order, deficit_bottles, reorder_bottles and is_urgent from `par_reorder_quantity`."
  - method: GET
    path: /beverage-program/variance-investigations/{investigation_id}
    roles: [BeverageDirector, Controller]
    input: []
    output: VarianceInvestigation
    status: 200
    side_effects: []
    description: "Read one pour-cost variance investigation."
  - method: GET
    path: /beverage-program/variance-investigations
    roles: [BeverageDirector, Controller]
    input: ["venue_id?", "state?", "limit?", "offset?"]
    output: VarianceInvestigation[]
    status: 200
    side_effects: []
    description: "List variance investigations by venue or state."
  - method: POST
    path: /beverage-program/variance-investigations/{investigation_id}/escalate
    roles: [Controller]
    input: [note]
    output: VarianceInvestigation
    status: 200
    side_effects:
      - "state moves OPEN -> ESCALATED (OPEN_to_ESCALATED); escalation_note set from `note`"
    description: "Escalate an open variance investigation to group level."
  - method: POST
    path: /beverage-program/variance-investigations/{investigation_id}/resolve
    roles: [Controller]
    input: [resolution, resolution_note]
    output: VarianceInvestigation
    status: 200
    side_effects:
      - "state moves to RESOLVED_EXPLAINED or RESOLVED_ADJUSTED from OPEN or ESCALATED, according to `resolution`"
      - "resolution_note set from `resolution_note`; resolved_at set to the logical clock"
      - "on RESOLVED_EXPLAINED the venue posture is left untouched; on RESOLVED_ADJUSTED venue.program_posture returns to OPEN and last_variance_pct is reset to 0.00"
    description: "Close a variance investigation. Only an adjusted resolution thaws the venue's program posture."
  # --- Corkage / BYO ---------------------------------------------------------
  - method: POST
    path: /beverage-program/venues/{venue_id}/corkage-charges
    roles: [VenueSommelier]
    input: [byo_bottle_count, bottles_purchased_from_list, party_size, byo_categories]
    output: { waived_bottles: integer, chargeable_bottles: integer, corkage_total_cents: integer, large_party_discount_applied: boolean }
    status: 200
    side_effects: []
    description: "Quote the corkage due for a BYO party using `corkage_charge`. Stateless quote; nothing is persisted."
  # --- Test-driving endpoint -------------------------------------------------
  - method: POST
    path: /_clock/set_current_utc
    roles: [BeverageDirector, VenueSommelier, DistributorRep, Controller, ComplianceOfficer]
    input: [to_iso8601]
    output: null
    status: 204
    side_effects:
      - "sets the server's logical UTC clock, which every temporal rule reads"
    description: "Test-driving endpoint. The logical clock defaults to 2026-08-01T00:00:00Z at process start and only this endpoint changes it; no business logic reads the wall clock."

# ---------------------------------------------------------------------------
# §1.6 Error Code Catalog (70 codes; every code is triggerable from §1.5)
# ---------------------------------------------------------------------------
errors:
  # --- auth ------------------------------------------------------------------
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, empty, or carrying a role outside the five declared in §1.7"
  - id: ERR_FORBIDDEN_ROLE
    http: 403
    condition: "the authenticated role is not listed in the target endpoint's roles"
  - id: ERR_VENUE_SCOPE_VIOLATION
    http: 403
    condition: "a VenueSommelier acts on a resource that resolves to a venue other than its own X-User-ID"
  - id: ERR_DISTRIBUTOR_SCOPE_VIOLATION
    http: 403
    condition: "a DistributorRep posts or filters offers for a distributor_id other than its own X-User-ID"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "the approving or publishing X-User-ID equals the submitter recorded on the object (ListVersion.submitted_by_user_id, SpoilageWriteOff.submitted_by_user_id)"
  # --- not found -------------------------------------------------------------
  - id: ERR_VENUE_NOT_FOUND
    http: 404
    condition: "no Venue exists for the supplied path or body venue_id"
  - id: ERR_DISTRIBUTOR_NOT_FOUND
    http: 404
    condition: "no Distributor exists for the supplied path or body distributor_id"
  - id: ERR_WINE_NOT_FOUND
    http: 404
    condition: "no Wine exists for the supplied wine_id or predecessor_wine_id"
  - id: ERR_BIN_NOT_FOUND
    http: 404
    condition: "no CellarBin exists for the supplied bin_id"
  - id: ERR_OFFER_NOT_FOUND
    http: 404
    condition: "no AllocationOffer exists for the supplied offer_id"
  - id: ERR_CLAIM_NOT_FOUND
    http: 404
    condition: "no AllocationClaim exists for the supplied claim_id or source_claim_id filter"
  - id: ERR_LOT_NOT_FOUND
    http: 404
    condition: "no InventoryLot exists for the supplied lot_id"
  - id: ERR_DEPLETION_ENTRY_NOT_FOUND
    http: 404
    condition: "no DepletionEntry exists for the supplied depletion_entry_id"
  - id: ERR_WINE_LIST_NOT_FOUND
    http: 404
    condition: "no WineList exists for the supplied wine_list_id"
  - id: ERR_LIST_VERSION_NOT_FOUND
    http: 404
    condition: "no ListVersion exists for the supplied list_version_id or supersedes_version_id"
  - id: ERR_LIST_ENTRY_NOT_FOUND
    http: 404
    condition: "no ListEntry exists for the supplied list_entry_id, including pour_plan lines"
  - id: ERR_SLOT_NOT_FOUND
    http: 404
    condition: "no BtgSlot exists for the supplied btg_slot_id"
  - id: ERR_WRITE_OFF_NOT_FOUND
    http: 404
    condition: "no SpoilageWriteOff exists for the supplied write_off_id"
  - id: ERR_EVENT_NOT_FOUND
    http: 404
    condition: "no WineDinnerEvent exists for the supplied event_id"
  - id: ERR_INVESTIGATION_NOT_FOUND
    http: 404
    condition: "no VarianceInvestigation exists for the supplied investigation_id"
  # --- request shape ---------------------------------------------------------
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "a required body field is absent or carries the wrong JSON type"
  - id: ERR_INVALID_ENUM_VALUE
    http: 422
    condition: "an enum-typed field carries a value outside its declared member set"
  - id: ERR_VALUE_OUT_OF_RANGE
    http: 422
    condition: "a numeric field falls outside its §1.1 range, or cogs_target_pct_by_category does not carry exactly the six WINE_CATEGORIES keys"
  - id: ERR_INVALID_PAGINATION
    http: 400
    condition: "limit is outside 1..100 or offset is negative or non-integer"
  - id: ERR_POUR_SIZE_REQUIRED
    http: 400
    condition: "by_the_glass is true but pour_size_ml is null"
  - id: ERR_INVALID_EVENT_WINDOW
    http: 422
    condition: "starts_at is not strictly before ends_at"
  - id: ERR_INVALID_PERIOD
    http: 422
    condition: "period_start is not strictly before period_end"
  # --- uniqueness ------------------------------------------------------------
  - id: ERR_VENUE_CODE_TAKEN
    http: 409
    condition: "another Venue already uses this venue_code"
  - id: ERR_BIN_CODE_TAKEN
    http: 409
    condition: "another CellarBin in this venue already uses this bin_code"
  - id: ERR_DUPLICATE_CLAIM
    http: 409
    condition: "this venue already has an AllocationClaim on this offer in any state"
  - id: ERR_DUPLICATE_LIST_ENTRY_WINE
    http: 409
    condition: "this wine already appears as a ListEntry on this list version"
  # --- concurrency -----------------------------------------------------------
  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_offer_version or expected_list_version_version does not equal the parent's current version"
  # --- state -----------------------------------------------------------------
  - id: ERR_LIST_VERSION_NOT_DRAFT
    http: 409
    condition: "the ListVersion is not in state DRAFT (entry add, entry patch, submit, archive)"
  - id: ERR_LIST_VERSION_NOT_IN_REVIEW
    http: 409
    condition: "the ListVersion is not in state IN_REVIEW (publish, request-changes)"
  - id: ERR_LIST_VERSION_NOT_REPRINT_PENDING
    http: 409
    condition: "the ListVersion is not in state REPRINT_PENDING (mark-reprinted)"
  - id: ERR_LIST_VERSION_NOT_PUBLISHED
    http: 409
    condition: "the referenced ListVersion is in neither PUBLISHED nor REPRINT_PENDING when a slot, event or confirmation depends on it"
  - id: ERR_OFFER_NOT_OPEN
    http: 409
    condition: "AllocationOffer.fulfillment_state is not OPEN"
  - id: ERR_CLAIM_NOT_GRANTED
    http: 409
    condition: "AllocationClaim.state is neither GRANTED nor PARTIALLY_GRANTED when receiving"
  - id: ERR_CLAIM_NOT_WITHDRAWABLE
    http: 409
    condition: "AllocationClaim.state is not one of REQUESTED, GRANTED, PARTIALLY_GRANTED when withdrawing"
  - id: ERR_LOT_NOT_ON_HAND
    http: 409
    condition: "InventoryLot.state is WRITTEN_OFF, or DEPLETED where the operation requires ON_HAND"
  - id: ERR_SLOT_NOT_OPEN
    http: 409
    condition: "BtgSlot.state is not OPEN when closing"
  - id: ERR_WRITE_OFF_NOT_SUBMITTED
    http: 409
    condition: "SpoilageWriteOff.state is not SUBMITTED when approving or rejecting"
  - id: ERR_WRITE_OFF_NOT_APPROVED
    http: 409
    condition: "SpoilageWriteOff.state is not APPROVED when reversing"
  - id: ERR_EVENT_INVALID_STATE
    http: 409
    condition: "WineDinnerEvent.state does not match the requested transition's from-state"
  - id: ERR_INVESTIGATION_NOT_ACTIONABLE
    http: 409
    condition: "VarianceInvestigation is already resolved, or is ESCALATED when escalate is called again"
  - id: ERR_REVISION_LIMIT_REACHED
    http: 409
    condition: "ListVersion.revision_round has already reached MAX_REVISION_ROUNDS (3) when request-changes is called"
  - id: ERR_EMPTY_LIST_VERSION
    http: 422
    condition: "a ListVersion with entry_count 0 is submitted for review"
  # --- business safety -------------------------------------------------------
  - id: ERR_DISTRIBUTOR_COMPLIANCE_HOLD
    http: 422
    condition: "the distributor behind the offer is in compliance_state HOLD"
  - id: ERR_OFFER_COMPLIANCE_BLOCKED
    http: 422
    condition: "AllocationOffer.compliance_state is BLOCKED when allocating or receiving"
  - id: ERR_BYO_CATEGORY_PROHIBITED
    http: 422
    condition: "a requested BYO category appears in venue.byo_prohibited_categories"
  # --- business temporal -----------------------------------------------------
  - id: ERR_OFFER_DEADLINE_PASSED
    http: 422
    condition: "the logical clock is at or after offer.response_deadline when claiming"
  - id: ERR_RECEIVED_AT_IN_FUTURE
    http: 422
    condition: "received_at is later than the logical clock"
  - id: ERR_SLOT_OCCUPIED
    http: 409
    condition: "`btg_slot_occupancy_check` finds an OPEN or EXPIRED slot on the same (venue_id, slot_index) whose closed-closed occupancy interval covers the current clock instant"
  - id: ERR_EVENT_WINDOW_CONFLICT
    http: 409
    condition: "`event_window_overlap` finds a venue event whose half-open window, expanded symmetrically by EVENT_TURNOVER_BUFFER_MINUTES (120), overlaps the requested window"
  # --- business referential --------------------------------------------------
  - id: ERR_LOT_VENUE_MISMATCH
    http: 422
    condition: "the bin or lot referenced by the request belongs to a different venue than the request's venue_id"
  - id: ERR_SLOT_WINE_MISMATCH
    http: 422
    condition: "the slot's lot references a different wine than the slot's list entry, or a lot in a different venue"
  - id: ERR_ENTRY_NOT_BY_THE_GLASS
    http: 422
    condition: "the list entry referenced by a slot has by_the_glass false"
  - id: ERR_POUR_PLAN_ENTRY_MISMATCH
    http: 422
    condition: "a pour_plan line references a ListEntry that does not belong to the event's list_version_id, or a line has pours_per_seat < 1"
  - id: ERR_SLOT_WRITE_OFF_INVALID
    http: 422
    condition: "btg_slot_id is supplied on a write-off but the slot is not EXPIRED, references a different lot, or bottles is not exactly 1"
  - id: ERR_PINNED_LIST_VERSION_STALE
    http: 409
    condition: "WineDinnerEvent.pinned_version_stale is true when settling, because the pinned ListVersion left PUBLISHED after confirmation"
  # --- business constraint ---------------------------------------------------
  - id: ERR_BIN_ZONE_MISMATCH
    http: 422
    condition: "bottles of a non-allocated wine are routed into a RESERVE-zone bin"
  - id: ERR_BIN_CAPACITY_EXCEEDED
    http: 409
    condition: "bin.bottles_stored plus the incoming bottles would exceed bin.capacity_bottles"
  - id: ERR_REQUEST_EXCEEDS_OFFER
    http: 422
    condition: "requested_bottles exceeds offer.offered_bottles"
  - id: ERR_NO_ELIGIBLE_CLAIMS
    http: 422
    condition: "no AllocationClaim on the offer is in state REQUESTED when allocate is called"
  - id: ERR_POUR_SIZE_TOO_LARGE
    http: 422
    condition: "floor(bottle_size_ml / pour_size_ml) - BTG_SPOILAGE_ALLOWANCE_POURS is less than 1, so the bottle yields no saleable glass"
  - id: ERR_POURS_EXCEED_BOTTLE
    http: 422
    condition: "pours_sold plus staff_education_pours exceeds slot.effective_pours"
  - id: ERR_BYO_LIMIT_EXCEEDED
    http: 422
    condition: "byo_bottle_count exceeds venue.byo_bottle_limit_per_party"
  # --- business fiscal -------------------------------------------------------
  - id: ERR_VENUE_PROGRAM_FROZEN
    http: 409
    condition: "venue.program_posture is FROZEN when publishing a list version or confirming a wine dinner"
  - id: ERR_VENUE_PROGRAM_RESTRICTED
    http: 409
    condition: "venue.program_posture is RESTRICTED or FROZEN and the entry's computed price_band is PREMIUM or RESERVE"
  - id: ERR_INSUFFICIENT_BOTTLES
    http: 409
    condition: "the available bottles (bottles_on_hand minus bottles_committed, aggregated across ON_HAND lots) are fewer than the operation needs"
  - id: ERR_NO_REVENUE_IN_PERIOD
    http: 422
    condition: "the requested period contains no DepletionEntry with non-zero revenue, so no pour-cost percentage is defined"

# ---------------------------------------------------------------------------
# §1.7 RBAC Matrix (segregation_of_duties; 5 roles)
# ---------------------------------------------------------------------------
roles:
  - name: BeverageDirector
    description: "Restaurant-group beverage director. Owns the master data (venues, distributors, wines), reviews and publishes list versions, runs the pour-cost job and confirms wine dinners. Group-wide scope: not bound to any single venue."
    identity: opaque
    exclusive_operations:
      - "POST /beverage-program/venues"
      - "POST /beverage-program/distributors"
      - "POST /beverage-program/wines"
      - "POST /beverage-program/allocation-offers/{offer_id}/allocate"
      - "POST /beverage-program/list-versions/{list_version_id}/request-changes"
      - "POST /beverage-program/list-versions/{list_version_id}/publish"
      - "POST /beverage-program/list-versions/{list_version_id}/archive"
      - "POST /beverage-program/wine-dinner-events/{event_id}/confirm"
      - "POST /beverage-program/venues/{venue_id}/pour-cost-runs"
    shared_operations:
      - "POST /beverage-program/venues/{venue_id}/cellar-bins (with VenueSommelier)"
      - "POST /beverage-program/venues/{venue_id}/wine-lists (with VenueSommelier)"
      - "POST /beverage-program/wine-lists/{wine_list_id}/versions (with VenueSommelier)"
      - "POST /beverage-program/list-versions/{list_version_id}/submit (with VenueSommelier)"
      - "POST /beverage-program/list-versions/{list_version_id}/mark-reprinted (with VenueSommelier)"
      - "POST /beverage-program/wine-dinner-events/{event_id}/cancel (with VenueSommelier)"
      - "GET /beverage-program/venues/{venue_id}/pour-cost-report (with Controller)"
      - "GET /beverage-program/venues/{venue_id}/par-report (with VenueSommelier)"
      - "GET /beverage-program/variance-investigations and /{investigation_id} (with Controller)"
      - "POST /_clock/set_current_utc (with all roles)"
      - "all other GET reads on venues, cellar-bins, distributors, wines, allocation offers and claims, inventory lots, depletion entries, wine lists, list versions, list entries, btg slots, spoilage write-offs and wine dinner events"
    notes:
      - "Because publish is director-exclusive while submit is shared, a director who submits a version cannot publish it: ERR_SEGREGATION_OF_DUTIES compares X-User-ID with ListVersion.submitted_by_user_id, not the role."
  - name: VenueSommelier
    description: "Sommelier of one venue. Builds draft list versions, claims allocations for the venue, receives and moves inventory, runs by-the-glass slots, proposes spoilage write-offs and plans/prices wine dinners. Every operation is scoped to its own venue."
    identity: "entity_backed:Venue"
    exclusive_operations:
      - "POST /beverage-program/allocation-offers/{offer_id}/claims"
      - "POST /beverage-program/allocation-claims/{claim_id}/withdraw"
      - "POST /beverage-program/allocation-claims/{claim_id}/receive"
      - "POST /beverage-program/inventory-lots"
      - "POST /beverage-program/list-versions/{list_version_id}/entries"
      - "PATCH /beverage-program/list-entries/{list_entry_id}"
      - "POST /beverage-program/btg-slots"
      - "POST /beverage-program/btg-slots/{btg_slot_id}/close"
      - "POST /beverage-program/wine-dinner-events"
      - "POST /beverage-program/wine-dinner-events/{event_id}/price"
      - "POST /beverage-program/venues/{venue_id}/corkage-charges"
    shared_operations:
      - "POST /beverage-program/venues/{venue_id}/cellar-bins (with BeverageDirector)"
      - "POST /beverage-program/venues/{venue_id}/wine-lists (with BeverageDirector)"
      - "POST /beverage-program/wine-lists/{wine_list_id}/versions (with BeverageDirector)"
      - "POST /beverage-program/list-versions/{list_version_id}/submit (with BeverageDirector)"
      - "POST /beverage-program/list-versions/{list_version_id}/mark-reprinted (with BeverageDirector)"
      - "POST /beverage-program/wine-dinner-events/{event_id}/cancel (with BeverageDirector)"
      - "POST /beverage-program/spoilage-write-offs (with Controller)"
      - "GET /beverage-program/venues/{venue_id}/par-report (with BeverageDirector)"
      - "POST /_clock/set_current_utc (with all roles)"
      - "all GET reads except the pour-cost report and the variance investigations"
    notes:
      - "X-User-ID MUST equal the venue id the request resolves to, otherwise ERR_VENUE_SCOPE_VIOLATION (priority 4) fires before any existence check on body FKs."
  - name: DistributorRep
    description: "Sales representative of one distributor. Posts allocation offers for that distributor and reads the offers and claims placed against them. Cannot touch venue-side inventory, lists or money."
    identity: "entity_backed:Distributor"
    exclusive_operations:
      - "POST /beverage-program/allocation-offers"
    shared_operations:
      - "GET /beverage-program/allocation-offers and /{offer_id}"
      - "GET /beverage-program/allocation-claims and /{claim_id}"
      - "GET /beverage-program/venues, /beverage-program/distributors, /beverage-program/wines and their single-resource reads"
      - "POST /_clock/set_current_utc (with all roles)"
    notes:
      - "X-User-ID MUST equal the distributor_id in the body or query, otherwise ERR_DISTRIBUTOR_SCOPE_VIOLATION (priority 5)."
      - "A DistributorRep is not on any write endpoint under cellar-bins, inventory-lots, list-versions, btg-slots, spoilage-write-offs or wine-dinner-events, so those return ERR_FORBIDDEN_ROLE."
  - name: Controller
    description: "Group financial controller. Sole approver of spoilage write-offs, sole settler and voider of wine dinners, and sole handler of pour-cost variance investigations. Never builds or publishes lists."
    identity: opaque
    exclusive_operations:
      - "POST /beverage-program/spoilage-write-offs/{write_off_id}/approve"
      - "POST /beverage-program/spoilage-write-offs/{write_off_id}/reject"
      - "POST /beverage-program/spoilage-write-offs/{write_off_id}/reverse"
      - "POST /beverage-program/wine-dinner-events/{event_id}/settle"
      - "POST /beverage-program/wine-dinner-events/{event_id}/void-settlement"
      - "POST /beverage-program/variance-investigations/{investigation_id}/escalate"
      - "POST /beverage-program/variance-investigations/{investigation_id}/resolve"
    shared_operations:
      - "POST /beverage-program/spoilage-write-offs (with VenueSommelier)"
      - "GET /beverage-program/venues/{venue_id}/pour-cost-report (with BeverageDirector)"
      - "GET /beverage-program/variance-investigations and /{investigation_id} (with BeverageDirector)"
      - "POST /_clock/set_current_utc (with all roles)"
      - "all GET reads except the par report and the corkage quote"
    notes:
      - "The write-off submit endpoint is deliberately shared so a Controller can both submit and attempt to approve — the only way to reach ERR_SEGREGATION_OF_DUTIES on the write-off path with a single role."
  - name: ComplianceOfficer
    description: "Alcohol-licensing compliance officer. Sole authority over distributor licence clearance and holds, which cascade into the compliance dimension of allocation offers. Read-only everywhere else."
    identity: opaque
    exclusive_operations:
      - "POST /beverage-program/distributors/{distributor_id}/compliance-reviews"
    shared_operations:
      - "POST /_clock/set_current_utc (with all roles)"
      - "all GET reads except the pour-cost report, the par report and the variance investigations"
    notes:
      - "A ComplianceOfficer moves only the compliance_state dimension; fulfillment_state on an offer is untouched by a review, which is what makes AllocationOffer's parallel dimensions observable."
