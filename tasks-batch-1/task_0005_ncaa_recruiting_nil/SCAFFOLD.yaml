# =============================================================================
# NCAA Recruiting & NIL Compliance — SCAFFOLD.yaml
# §1.0 through §1.7. §1.8/§1.9 live in sibling files.
# =============================================================================

scenario: |
  NCAA Recruiting & NIL Compliance: student-athlete eligibility (Eligibility
  Center), scholarship slot limits, recruiting calendar (Quiet/Contact/Dead
  periods), NIL endorsement approval, Transfer Portal, Booster violations

domain_name: "ncaa-recruiting-nil"
api_prefix: "/ncaa"

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: quota_allocation
  complexity_layers:
    - temporal_windowing
    - cascading_side_effects
    - rate_threshold_triggers
    - optimistic_concurrency

  entity_topology: flat
  state_machine_shape: branching
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:

  - name: Program
    parent: null
    common_fields: true
    fields:
      - name: sport_code
        type: enum
        source: input
        description: "Sport code (one program per sport per school in scope)."
        constraints: "Enum: FOOTBALL, MBB (men's basketball), WBB, BASEBALL, SOFTBALL"
      - name: school_name
        type: string
        source: input
        description: "Display name of the school."
      - name: scholarship_slot_cap
        type: integer
        source: input
        description: "NCAA-imposed hard cap on simultaneous accepted scholarships."
        constraints: ">= 1, <= 130"
      - name: slots_committed
        type: integer
        source: computed
        description: "Count of ScholarshipOffer rows where status IN {SENT, ACCEPTED}. Recomputed on every offer transition (see §1.3 scholarship_slot_utilization, base variant)."
        default: 0
      - name: slots_projected
        type: integer
        source: computed
        description: "Forward-looking slot count under §1.3 scholarship_slot_utilization (projected variant); counts SENT + ACCEPTED + offers under review with no DENIED EligibilityCertification."
        default: 0
      - name: penalty_tier
        type: enum
        source: computed
        description: "Derived from sustained BoosterIncident weight per §1.3 program_penalty_tier. Affects allowed actions (see §1.4)."
        default: NONE
        constraints: "Enum: NONE, LEVEL_I, LEVEL_II, POSTSEASON_BAN"

  - name: Period
    parent: null
    common_fields: true
    fields:
      - name: program_id
        type: string
        source: input
        description: "FK -> Program.id; the program whose recruiting calendar this window belongs to."
      - name: period_type
        type: enum
        source: input
        description: "Recruiting calendar window type."
        constraints: "Enum: CONTACT, QUIET, DEAD"
      - name: starts_at
        type: datetime
        source: input
        description: "ISO 8601 UTC, inclusive start of the period."
      - name: ends_at
        type: datetime
        source: input
        description: "ISO 8601 UTC, exclusive end of the period."

  - name: StudentAthlete
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: "Athlete's full name."
      - name: sport_code
        type: enum
        source: input
        description: "Sport the athlete is recruited for (must equal the recruiting Program.sport_code on any contact/offer)."
        constraints: "Enum: FOOTBALL, MBB, WBB, BASEBALL, SOFTBALL"
      - name: gpa
        type: number
        source: input
        description: "Core-course GPA, 0.000–4.000 with three decimal places."
        constraints: ">= 0.000 and <= 4.000"
      - name: amateurism_flag
        type: boolean
        source: input
        description: "True if the athlete certifies amateur status at intake."
        default: true
      - name: enrolled_program_id
        type: string
        source: computed
        description: "FK -> Program.id; nullable. Set when ScholarshipOffer transitions to ACCEPTED. Null otherwise."
        default: null
      - name: eligibility_status
        type: enum
        source: computed
        description: "Mirror of latest EligibilityCertification.decision for this athlete; UNCERTIFIED at intake. UNCERTIFIED→CERTIFIED on APPROVED, →INELIGIBLE on DENIED."
        default: UNCERTIFIED
        constraints: "Enum: UNCERTIFIED, CERTIFIED, INELIGIBLE"
      - name: in_transfer_portal
        type: boolean
        source: computed
        description: "True iff a TransferPortalEntry for this athlete has status == ENTERED. Flipped by entry/match/withdraw/expire."
        default: false

  - name: EligibilityCertification
    parent: null
    common_fields: true
    fields:
      - name: student_athlete_id
        type: string
        source: input
        description: "FK -> StudentAthlete.id; the subject of certification."
      - name: status
        type: enum
        source: computed
        description: "State machine state (see §1.2). PENDING at create."
        default: PENDING
        constraints: "Enum: PENDING, APPROVED, DENIED"
      - name: gpa_at_review
        type: number
        source: system
        description: "Snapshot of StudentAthlete.gpa at the moment of submission; frozen thereafter."
      - name: amateurism_at_review
        type: boolean
        source: system
        description: "Snapshot of StudentAthlete.amateurism_flag at submission."
      - name: denial_reason
        type: enum
        source: input
        description: "Required when transitioning to DENIED. Null for PENDING/APPROVED."
        default: null
        constraints: "Enum: GPA_BELOW_MIN, AMATEURISM_LOST, INCOMPLETE_RECORDS"

  - name: RecruitingContact
    parent: null
    common_fields: true
    fields:
      - name: program_id
        type: string
        source: input
        description: "FK -> Program.id; recruiting program (must equal the contacting coach's program)."
      - name: student_athlete_id
        type: string
        source: input
        description: "FK -> StudentAthlete.id; the recruited athlete."
      - name: coach_user_id
        type: string
        source: input
        description: "X-User-ID of the Coach role at the time of contact; pinned for audit."
      - name: contact_at
        type: datetime
        source: input
        description: "ISO 8601 UTC of contact. Must fall in a CONTACT Period for program_id (see §1.4)."
      - name: channel
        type: enum
        source: input
        description: "Contact channel."
        constraints: "Enum: IN_PERSON, PHONE, DM, EMAIL"
      - name: period_type_at_contact
        type: enum
        source: computed
        description: "Snapshot of the Period.period_type whose [starts_at, ends_at) contains contact_at. Set on successful create."

  - name: ScholarshipOffer
    parent: null
    common_fields: true
    fields:
      - name: program_id
        type: string
        source: input
        description: "FK -> Program.id; offering program."
      - name: student_athlete_id
        type: string
        source: input
        description: "FK -> StudentAthlete.id; recipient."
      - name: status
        type: enum
        source: computed
        description: "State machine state (see §1.2). DRAFT at create."
        default: DRAFT
        constraints: "Enum: DRAFT, SENT, ACCEPTED, DECLINED, WITHDRAWN"
      - name: annual_value_cents
        type: integer
        source: input
        description: "Annual scholarship value in cents. Used as compensating quantity in §1.3."
        constraints: ">= 0"
      - name: sent_at
        type: datetime
        source: system
        description: "ISO 8601 UTC when status moves DRAFT->SENT; null prior."
        default: null

  - name: NILDeal
    parent: null
    common_fields: true
    fields:
      - name: student_athlete_id
        type: string
        source: input
        description: "FK -> StudentAthlete.id; the endorsing athlete."
      - name: brand_name
        type: string
        source: input
        description: "Sponsor/brand display name."
      - name: gross_value_cents
        type: integer
        source: input
        description: "Pre-fee endorsement value in cents."
        constraints: ">= 0"
      - name: agent_fee_pct
        type: number
        source: input
        description: "Agent fee as decimal in [0, 0.30]."
        default: 0.0
        constraints: ">= 0.0 and <= 0.30"
      - name: net_value_cents
        type: integer
        source: computed
        description: "Computed at create per §1.3 nil_value_classification (gross variant input) — used for tier check."
      - name: tier
        type: enum
        source: computed
        description: "Tier classification per §1.3 nil_value_classification."
        constraints: "Enum: DE_MINIMIS, STANDARD, HIGH_VALUE"
      - name: review_round
        type: integer
        source: computed
        description: "Revision counter incremented each time the deal cycles back to UNDER_REVIEW."
        default: 0
      - name: status
        type: enum
        source: computed
        description: "State machine state (see §1.2). PROPOSED at create."
        default: PROPOSED
        constraints: "Enum: PROPOSED, UNDER_REVIEW, APPROVED, REJECTED"
      - name: rejection_reason
        type: enum
        source: input
        description: "Required when moving to REJECTED."
        default: null
        constraints: "Enum: BRAND_PROHIBITED, ATHLETE_INELIGIBLE, EXCEEDS_PROGRAM_LIMIT"

  - name: TransferPortalEntry
    parent: null
    common_fields: true
    fields:
      - name: student_athlete_id
        type: string
        source: input
        description: "FK -> StudentAthlete.id; entrant."
      - name: source_program_id
        type: string
        source: input
        description: "FK -> Program.id; the program the athlete is leaving."
      - name: matched_program_id
        type: string
        source: computed
        description: "FK -> Program.id; nullable. Set on transition to MATCHED."
        default: null
      - name: entered_at
        type: datetime
        source: system
        description: "ISO 8601 UTC of entry; pinned at create from system clock."
      - name: window_closes_at
        type: datetime
        source: system
        description: "ISO 8601 UTC = entered_at + 45 days exact (no clamping). EXPIRED auto-transition fires when system clock crosses this boundary via /_clock/set_current_utc."
      - name: status
        type: enum
        source: computed
        description: "State machine state (see §1.2). ENTERED at create."
        default: ENTERED
        constraints: "Enum: ENTERED, MATCHED, WITHDRAWN, EXPIRED"

  - name: BoosterIncident
    parent: null
    common_fields: true
    fields:
      - name: program_id
        type: string
        source: input
        description: "FK -> Program.id; the implicated program."
      - name: booster_name
        type: string
        source: input
        description: "Booster identifier (free text)."
      - name: student_athlete_id
        type: string
        source: input
        description: "FK -> StudentAthlete.id; the involved athlete."
      - name: alleged_value_cents
        type: integer
        source: input
        description: "Alleged improper benefit amount in cents."
        constraints: ">= 0"
      - name: severity_weight
        type: integer
        source: computed
        description: "Penalty weight assigned at SUSTAINED transition per §1.3 program_penalty_tier (tiered_pricing). 0 prior."
        default: 0
      - name: status
        type: enum
        source: computed
        description: "State machine state (see §1.2). REPORTED at create."
        default: REPORTED
        constraints: "Enum: REPORTED, INVESTIGATING, SUSTAINED, DISMISSED"

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:

  - entity: EligibilityCertification
    initial_state: PENDING
    terminal_states: [APPROVED, DENIED]
    transitions:
      - from: PENDING
        to: APPROVED
        trigger: "POST /ncaa/eligibility-certifications/{id}/approve"
        actor: EligibilityCenter
        preconditions:
          - "gpa_at_review >= 2.300 (NCAA floor)"
          - "amateurism_at_review == true"
        side_effects:
          - "StudentAthlete.eligibility_status := CERTIFIED"
          - "StudentAthlete.updated_at and version bump"
          - "Increment EligibilityCertification.version by 1"
      - from: PENDING
        to: DENIED
        trigger: "POST /ncaa/eligibility-certifications/{id}/deny"
        actor: EligibilityCenter
        preconditions:
          - "denial_reason in {GPA_BELOW_MIN, AMATEURISM_LOST, INCOMPLETE_RECORDS}"
        side_effects:
          - "StudentAthlete.eligibility_status := INELIGIBLE"
          - "Cascade: every ScholarshipOffer where student_athlete_id == this athlete AND status IN {DRAFT, SENT} auto-transitions to WITHDRAWN (cascade depth ≥ 2 — see Rule 4)"
          - "On each cascaded WITHDRAWN, the Program.slots_committed compensating invariant rebalances (Rule 9)"
          - "Increment EligibilityCertification.version by 1"

  - entity: ScholarshipOffer
    initial_state: DRAFT
    terminal_states: [ACCEPTED, DECLINED, WITHDRAWN]
    transitions:
      - from: DRAFT
        to: SENT
        trigger: "POST /ncaa/scholarship-offers/{id}/send"
        actor: Coach
        preconditions:
          - "StudentAthlete.eligibility_status == CERTIFIED (cross-entity, Rule 7)"
          - "Program.slots_committed + 1 <= Program.scholarship_slot_cap (boundary, Rule 6)"
          - "Program.penalty_tier != POSTSEASON_BAN"
        side_effects:
          - "ScholarshipOffer.sent_at := current_utc"
          - "Program.slots_committed += 1 (per §1.3 base variant)"
          - "Program.updated_at and version bump"
          - "Increment ScholarshipOffer.version by 1"
      - from: SENT
        to: ACCEPTED
        trigger: "POST /ncaa/scholarship-offers/{id}/accept"
        actor: StudentAthlete
        preconditions:
          - "Acting StudentAthlete is the offer's student_athlete_id"
        side_effects:
          - "StudentAthlete.enrolled_program_id := this.program_id"
          - "StudentAthlete.updated_at and version bump"
          - "Increment ScholarshipOffer.version by 1"
      - from: SENT
        to: DECLINED
        trigger: "POST /ncaa/scholarship-offers/{id}/decline"
        actor: StudentAthlete
        preconditions:
          - "Acting StudentAthlete is the offer's student_athlete_id"
        side_effects:
          - "Program.slots_committed -= 1 (compensating invariant, Rule 9)"
          - "Program.updated_at and version bump"
          - "Increment ScholarshipOffer.version by 1"
      - from: SENT
        to: WITHDRAWN
        trigger: "POST /ncaa/scholarship-offers/{id}/withdraw"
        actor: Coach
        preconditions:
          - "Coach belongs to offer.program_id"
        side_effects:
          - "Program.slots_committed -= 1 (compensating invariant, Rule 9)"
          - "Program.updated_at and version bump"
          - "Increment ScholarshipOffer.version by 1"
      - from: DRAFT
        to: WITHDRAWN
        trigger: "POST /ncaa/scholarship-offers/{id}/withdraw"
        actor: Coach
        preconditions:
          - "Coach belongs to offer.program_id"
        side_effects:
          - "(no slot change — DRAFT was never committed)"
          - "Increment ScholarshipOffer.version by 1"
      - from: DRAFT
        to: WITHDRAWN
        trigger: "system cascade: EligibilityCertification PENDING->DENIED for this athlete"
        actor: system
        preconditions:
          - "StudentAthlete.eligibility_status flips to INELIGIBLE"
        side_effects:
          - "(no slot change)"
          - "Increment ScholarshipOffer.version by 1"
      - from: SENT
        to: WITHDRAWN
        trigger: "system cascade: EligibilityCertification PENDING->DENIED for this athlete"
        actor: system
        preconditions:
          - "StudentAthlete.eligibility_status flips to INELIGIBLE"
        side_effects:
          - "Program.slots_committed -= 1 (compensating invariant, Rule 9)"
          - "Program.updated_at and version bump"
          - "Increment ScholarshipOffer.version by 1"
      - from: SENT
        to: WITHDRAWN
        trigger: "system cascade: BoosterIncident INVESTIGATING->SUSTAINED on offer.program_id (Rule 4 link 2)"
        actor: system
        preconditions:
          - "Program.penalty_tier (post-sustain recompute) == POSTSEASON_BAN"
        side_effects:
          - "Program.slots_committed -= 1"
          - "Program.updated_at and version bump"
          - "Increment ScholarshipOffer.version by 1"

  - entity: NILDeal
    initial_state: PROPOSED
    terminal_states: [APPROVED, REJECTED]
    transitions:
      - from: PROPOSED
        to: UNDER_REVIEW
        trigger: "POST /ncaa/nil-deals/{id}/submit-for-review"
        actor: NILReviewer
        preconditions:
          - "StudentAthlete.eligibility_status == CERTIFIED (Rule 7)"
        side_effects:
          - "Increment NILDeal.version by 1"
      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /ncaa/nil-deals/{id}/approve"
        actor: NILReviewer
        preconditions:
          - "NILDeal.tier != HIGH_VALUE OR Program.penalty_tier == NONE"
          - "(Approver MUST differ from any prior submitter of this deal — segregation of duties, Rule 5)"
        side_effects:
          - "Increment NILDeal.version by 1"
      - from: UNDER_REVIEW
        to: PROPOSED
        trigger: "POST /ncaa/nil-deals/{id}/request-revision"
        actor: NILReviewer
        preconditions:
          - "review_round + 1 <= 3 (revision cap)"
        side_effects:
          - "NILDeal.review_round += 1 (cycle back — non-linear shape, Rule 3)"
          - "Increment NILDeal.version by 1"
      - from: UNDER_REVIEW
        to: REJECTED
        trigger: "POST /ncaa/nil-deals/{id}/reject"
        actor: NILReviewer
        preconditions:
          - "rejection_reason provided"
        side_effects:
          - "Increment NILDeal.version by 1"

  - entity: TransferPortalEntry
    initial_state: ENTERED
    terminal_states: [MATCHED, WITHDRAWN, EXPIRED]
    transitions:
      - from: ENTERED
        to: MATCHED
        trigger: "POST /ncaa/transfer-portal-entries/{id}/match"
        actor: ComplianceOfficer
        preconditions:
          - "matched_program_id provided AND current_utc < window_closes_at"
          - "StudentAthlete.eligibility_status == CERTIFIED"
          - "matched Program.slots_committed + 1 <= scholarship_slot_cap"
          - "expected_transferportalentry_version matches"
        side_effects:
          - "TransferPortalEntry.matched_program_id := input.matched_program_id"
          - "StudentAthlete.enrolled_program_id := input.matched_program_id"
          - "StudentAthlete.in_transfer_portal := false"
          - "Increment TransferPortalEntry.version by 1"
      - from: ENTERED
        to: WITHDRAWN
        trigger: "POST /ncaa/transfer-portal-entries/{id}/withdraw"
        actor: StudentAthlete
        preconditions:
          - "Acting athlete is the entry's student_athlete_id"
          - "current_utc < window_closes_at"
        side_effects:
          - "StudentAthlete.in_transfer_portal := false"
          - "Increment TransferPortalEntry.version by 1"
      - from: ENTERED
        to: EXPIRED
        trigger: "POST /ncaa/_jobs/sweep-portal-expirations (clock-driven)"
        actor: system
        preconditions:
          - "current_utc >= window_closes_at"
        side_effects:
          - "StudentAthlete.in_transfer_portal := false"
          - "Increment TransferPortalEntry.version by 1"

  - entity: BoosterIncident
    initial_state: REPORTED
    terminal_states: [SUSTAINED, DISMISSED]
    transitions:
      - from: REPORTED
        to: INVESTIGATING
        trigger: "POST /ncaa/booster-incidents/{id}/open-investigation"
        actor: ComplianceOfficer
        preconditions: []
        side_effects:
          - "Increment BoosterIncident.version by 1"
      - from: INVESTIGATING
        to: SUSTAINED
        trigger: "POST /ncaa/booster-incidents/{id}/sustain"
        actor: ComplianceOfficer
        preconditions:
          - "expected_boosterincident_version matches"
        side_effects:
          - "BoosterIncident.severity_weight := compute per §1.3 program_penalty_tier (tiered, Rule 2 mode a)"
          - "Recompute Program.penalty_tier (cascade link 1)"
          - "If new Program.penalty_tier == POSTSEASON_BAN: cascade auto-WITHDRAW every ScholarshipOffer where program_id == this.program_id AND status == SENT (cascade link 2 — Rule 4 depth-3 chain originating from sustain)"
          - "Each cascaded WITHDRAWN rebalances Program.slots_committed (link 3 in cascade)"
          - "Increment BoosterIncident.version by 1"
      - from: INVESTIGATING
        to: DISMISSED
        trigger: "POST /ncaa/booster-incidents/{id}/dismiss"
        actor: ComplianceOfficer
        preconditions: []
        side_effects:
          - "Increment BoosterIncident.version by 1"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: scholarship-send-stale-program
    parent_entity: Program
    write_endpoint: "POST /ncaa/scholarship-offers/{id}/send"
    occ_field: "expected_program_version"
    description: |
      Sending a ScholarshipOffer against a Program whose `version` has advanced
      since the client last observed it is rejected. This captures the case
      where another writer has just sent an offer that consumed the last open
      slot (legitimately advancing Program.version), so the current writer's
      view of Program.slots_committed is stale.
    error_id: ERR_STALE_PROGRAM_VERSION
    http_status: 412

  - rule_id: portal-match-stale-entry
    parent_entity: TransferPortalEntry
    write_endpoint: "POST /ncaa/transfer-portal-entries/{id}/match"
    occ_field: "expected_transferportalentry_version"
    description: |
      Matching a TransferPortalEntry whose `version` has advanced (e.g., the
      athlete withdrew, or a clock sweep expired the entry) since the client
      last observed it is rejected. The race here is CREATE-with-supersede on
      the matched_program_id field — a stale matcher would otherwise install a
      destination on an entry whose ENTERED state no longer holds.
    error_id: ERR_STALE_ENTRY_VERSION
    http_status: 412

  - rule_id: incident-sustain-stale-incident
    parent_entity: BoosterIncident
    write_endpoint: "POST /ncaa/booster-incidents/{id}/sustain"
    occ_field: "expected_boosterincident_version"
    description: |
      Sustaining a BoosterIncident whose `version` has advanced since the
      client opened it is rejected. The race is CREATE-with-supersede on
      severity_weight: a second sustainer would silently overwrite the weight
      stamped by the first and double-trigger the Rule-4 cascade.
    error_id: ERR_STALE_INCIDENT_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:

  - name: scholarship_slot_utilization
    trigger: "Recomputed on every ScholarshipOffer state transition AND on EligibilityCertification PENDING->DENIED cascade. Reads Program.slots_committed and Program.slots_projected."
    algorithm: aggregation
    formula: |
      # base (chronological) variant — counts what is committed RIGHT NOW
      slots_committed = count(ScholarshipOffer
                              where program_id == P.id
                              AND status IN {SENT, ACCEPTED})

      # projected (forward_looking) variant — anticipates pending eligibility
      slots_projected = count(ScholarshipOffer
                              where program_id == P.id
                              AND status IN {DRAFT, SENT, ACCEPTED}
                              AND NOT EXISTS (EligibilityCertification e
                                              where e.student_athlete_id == offer.student_athlete_id
                                              AND e.status == DENIED))

      # NOTE: status IN ordering uses the offer's own created_at ASC for any
      # tie-break needed in observable side-effect ordering. id never participates.
    input_set: "ScholarshipOffer rows scoped to a single Program; cross-referenced with EligibilityCertification.status."
    constants: {}
    precision: "integer counts; no rounding"
    variants:
      - name: base_committed
        when: "Used by §1.2 ScholarshipOffer.DRAFT->SENT precondition (capacity gate); written to Program.slots_committed."
        difference: "Counts only SENT + ACCEPTED. A DRAFT offer for an athlete with PENDING certification is NOT counted — only effective commitments occupy a slot."
      - name: projected
        when: "Reported via GET /ncaa/programs/{id}/utilization?variant=projected for coach pre-planning; written to Program.slots_projected."
        difference: "Counts DRAFT + SENT + ACCEPTED, excluding any whose athlete has a DENIED EligibilityCertification. Same inputs as base, different inclusion set → different integer for identical data when DRAFT offers exist with PENDING certifications."

  - name: nil_value_classification
    trigger: "On NILDeal create AND on every status transition (the tier gate matters for UNDER_REVIEW->APPROVED)."
    algorithm: tiered_pricing
    formula: |
      # Rule 2 mode (b) — nested rounding where order matters.
      # Pinned order: compute net via banker rounding step 1, THEN compare to tier
      # cutoffs. Reversing the order (compare gross to a tier, then take net)
      # produces a different tier for boundary cases.
      net_value_cents = round_half_even(gross_value_cents * (1 - agent_fee_pct))
      # round_half_even: banker's rounding to nearest integer cent.

      if net_value_cents < 60000:        # < $600.00
          tier = DE_MINIMIS              # boundary exactly at 60000 (Rule 6, mode A)
      elif net_value_cents < 500000:     # < $5,000.00
          tier = STANDARD
      else:
          tier = HIGH_VALUE

      # APPROVE precondition uses tier (HIGH_VALUE blocked if Program.penalty_tier > NONE)
    input_set: "Single NILDeal row; reads gross_value_cents, agent_fee_pct."
    constants:
      DE_MINIMIS_CUTOFF_CENTS: 60000
      STANDARD_CUTOFF_CENTS: 500000
    precision: "Integer cents. Rounding: banker (round_half_even) on the net computation step, applied BEFORE the tier comparison."
    variants:
      - name: gross_basis
        when: "Used when agent_fee_pct == 0.0 (vacuously the same)."
        difference: "Equivalent to net for zero-fee deals."
      - name: net_basis
        when: "Default when agent_fee_pct > 0.0; the only variant tested by §1.2 NILDeal approve precondition."
        difference: "Produces a different tier than naively classifying by gross for boundary deals — e.g. gross 60000 cents with agent_fee_pct 0.10 yields net 54000 cents (DE_MINIMIS, not STANDARD)."

  - name: program_penalty_tier
    trigger: "Recomputed on every BoosterIncident INVESTIGATING->SUSTAINED or SUSTAINED->(none). Written to Program.penalty_tier and severity_weight."
    algorithm: weighted_scoring
    formula: |
      # Per-incident severity weight (tiered by alleged_value_cents)
      def weight_of(incident):
          v = incident.alleged_value_cents
          if v < 50000:          return 1     # < $500
          elif v < 500000:       return 3     # < $5,000
          elif v < 2500000:      return 7     # < $25,000
          else:                  return 15

      # Program-level total (only SUSTAINED count)
      total = sum(weight_of(i)
                  for i in BoosterIncident
                  where i.program_id == P.id AND i.status == SUSTAINED)

      if total == 0:        tier = NONE
      elif total < 5:       tier = LEVEL_I
      elif total < 15:      tier = LEVEL_II
      else:                 tier = POSTSEASON_BAN
    input_set: "All BoosterIncident rows for Program P with status == SUSTAINED. Tie-break for cascade processing order: BoosterIncident.created_at ASC, never id."
    constants:
      TIER_I_FLOOR: 1
      TIER_II_FLOOR: 5
      BAN_FLOOR: 15
    precision: "Integer score; no rounding"
    variants:
      - name: cumulative
        when: "Default — sums weights of all SUSTAINED incidents."
        difference: "Counter-variant `instantaneous` (highest single severity) is NOT used by this scaffold; we pin cumulative."

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "Role permitted to call this endpoint per §1.7 RBAC"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "All path-segment ids resolve to existing rows (left-to-right)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all

  - priority: 4
    category: existence
    check: "All FK fields in request body resolve to existing rows"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all

  - priority: 5
    category: state
    check: "Target row in correct state for this transition (per §1.2)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-machine action endpoints"

  - priority: 6
    category: state
    check: "OCC: expected_<parent>_version matches current value (§1.2.1)"
    error_id: ERR_STALE_PROGRAM_VERSION
    http_status: 412
    applies_to: "endpoints declared in §1.2.1"

  - priority: 7
    category: business_safety
    check: "RecruitingContact.contact_at falls in a DEAD-type Period — contact prohibited"
    error_id: ERR_DEAD_PERIOD_CONTACT
    http_status: 422
    applies_to: "POST /ncaa/recruiting-contacts"

  - priority: 8
    category: business_safety
    check: "RecruitingContact.contact_at falls in a QUIET-type Period (only IN_PERSON contact allowed in QUIET; other channels are prohibited)"
    error_id: ERR_QUIET_PERIOD_VIOLATION
    http_status: 422
    applies_to: "POST /ncaa/recruiting-contacts"

  - priority: 9
    category: business_safety
    check: "RecruitingContact.contact_at falls in no Period (gap) — implicitly prohibited"
    error_id: ERR_OUTSIDE_RECRUITING_WINDOW
    http_status: 422
    applies_to: "POST /ncaa/recruiting-contacts"

  - priority: 10
    category: business_safety
    check: "Period overlap: a new Period whose [starts_at, ends_at) intersects any existing Period for the same program_id is rejected. Adjacency (B.starts_at == A.ends_at) is permitted; one-cent overlap is rejected."
    error_id: ERR_PERIOD_OVERLAP
    http_status: 422
    applies_to: "POST /ncaa/programs/{id}/periods"

  - priority: 11
    category: business_safety
    check: "Transfer Portal window: TransferPortalEntry.match REJECT when current_utc >= entered_at + 45 days (exact, half-open boundary)"
    error_id: ERR_PORTAL_WINDOW_CLOSED
    http_status: 422
    applies_to: "POST /ncaa/transfer-portal-entries/{id}/match, /withdraw"

  - priority: 12
    category: business_referential
    check: "Coach acting on a ScholarshipOffer must belong to offer.program_id (X-User-ID equals a Coach affiliated to that Program — opaque-id binding via Program.id stamp)"
    error_id: ERR_COACH_PROGRAM_MISMATCH
    http_status: 403
    applies_to: "POST /ncaa/scholarship-offers/{id}/send, /withdraw"

  - priority: 13
    category: business_referential
    check: "NILDeal segregation-of-duties: the approver MUST NOT be the same X-User-ID that ever submitted or requested revision on this deal"
    error_id: ERR_SOD_VIOLATION
    http_status: 403
    applies_to: "POST /ncaa/nil-deals/{id}/approve"

  - priority: 14
    category: business_constraint
    check: "ScholarshipOffer.send requires StudentAthlete.eligibility_status == CERTIFIED (cross-entity dependency, Rule 7)"
    error_id: ERR_ATHLETE_NOT_CERTIFIED
    http_status: 422
    applies_to: "POST /ncaa/scholarship-offers/{id}/send"

  - priority: 15
    category: business_constraint
    check: "NILDeal.submit-for-review requires StudentAthlete.eligibility_status == CERTIFIED"
    error_id: ERR_ATHLETE_NOT_CERTIFIED
    http_status: 422
    applies_to: "POST /ncaa/nil-deals/{id}/submit-for-review"

  - priority: 16
    category: business_constraint
    check: "HIGH_VALUE NILDeal approval blocked when Program.penalty_tier != NONE (athlete's enrolled_program_id)"
    error_id: ERR_PROGRAM_UNDER_SANCTION
    http_status: 422
    applies_to: "POST /ncaa/nil-deals/{id}/approve"

  - priority: 17
    category: business_fiscal
    check: "Slot cap: ScholarshipOffer.DRAFT->SENT rejected when Program.slots_committed + 1 > Program.scholarship_slot_cap (boundary >=, Rule 6)"
    error_id: ERR_SLOT_CAP_EXCEEDED
    http_status: 422
    applies_to: "POST /ncaa/scholarship-offers/{id}/send"

  - priority: 18
    category: business_fiscal
    check: "BoosterIncident.alleged_value_cents == 0 is rejected (zero-quantity boundary, Rule 6 mode 2)"
    error_id: ERR_ZERO_VALUE_INCIDENT
    http_status: 422
    applies_to: "POST /ncaa/booster-incidents"

  - priority: 19
    category: business_temporal
    check: "Period.starts_at < ends_at"
    error_id: ERR_INVALID_INTERVAL
    http_status: 422
    applies_to: "POST /ncaa/programs/{id}/periods"

  - priority: 20
    category: business_constraint
    check: "Required body fields present with correct types per §1.5 input schema"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:

  # ---- Programs --------------------------------------------------------------
  - method: POST
    path: "/ncaa/programs"
    description: "Create a Program."
    roles: [ComplianceOfficer]
    code: 201
    input: [sport_code, school_name, scholarship_slot_cap]
    output: Program
    side_effects: ["Program created with slots_committed=0, slots_projected=0, penalty_tier=NONE, version=1"]

  - method: GET
    path: "/ncaa/programs/{id}"
    description: "Read a single Program."
    roles: [ComplianceOfficer, Coach, NILReviewer, EligibilityCenter, StudentAthlete]
    code: 200
    input: []
    output: Program
    side_effects: []

  - method: GET
    path: "/ncaa/programs"
    description: "List Programs."
    roles: [ComplianceOfficer, Coach, NILReviewer, EligibilityCenter, StudentAthlete]
    code: 200
    input: ["limit?", "offset?", "sport_code?"]
    output: Program[]
    side_effects: []

  - method: GET
    path: "/ncaa/programs/{id}/utilization"
    description: "Read Program slot utilization. variant=base returns committed; variant=projected returns projected (default base)."
    roles: [ComplianceOfficer, Coach]
    code: 200
    input: ["variant?"]
    output: "{ program_id: string, variant: string, slot_count: integer, scholarship_slot_cap: integer }"
    side_effects: []

  # ---- Periods (recruiting calendar) -----------------------------------------
  - method: POST
    path: "/ncaa/programs/{id}/periods"
    description: "Create a recruiting-calendar Period for the program."
    roles: [ComplianceOfficer]
    code: 201
    input: [period_type, starts_at, ends_at]
    output: Period
    side_effects: ["Period created with version=1; rejected if overlaps an existing period (priority 10)"]

  - method: GET
    path: "/ncaa/programs/{id}/periods"
    description: "List Periods for a program."
    roles: [ComplianceOfficer, Coach]
    code: 200
    input: ["limit?", "offset?", "period_type?"]
    output: Period[]
    side_effects: []

  - method: GET
    path: "/ncaa/periods/{id}"
    description: "Read a single Period."
    roles: [ComplianceOfficer, Coach]
    code: 200
    input: []
    output: Period
    side_effects: []

  # ---- Student-Athletes ------------------------------------------------------
  - method: POST
    path: "/ncaa/student-athletes"
    description: "Create a StudentAthlete (intake)."
    roles: [ComplianceOfficer]
    code: 201
    input: ["full_name", "sport_code", "gpa", "amateurism_flag?"]
    output: StudentAthlete
    side_effects: ["StudentAthlete created with eligibility_status=UNCERTIFIED, in_transfer_portal=false, enrolled_program_id=null, version=1"]

  - method: GET
    path: "/ncaa/student-athletes/{id}"
    description: "Read a single StudentAthlete."
    roles: [ComplianceOfficer, Coach, NILReviewer, EligibilityCenter, StudentAthlete]
    code: 200
    input: []
    output: StudentAthlete
    side_effects: []

  - method: GET
    path: "/ncaa/student-athletes"
    description: "List StudentAthletes."
    roles: [ComplianceOfficer, Coach, NILReviewer, EligibilityCenter]
    code: 200
    input: ["limit?", "offset?", "sport_code?", "eligibility_status?", "in_transfer_portal?", "enrolled_program_id?"]
    output: StudentAthlete[]
    side_effects: []

  # ---- EligibilityCertification ---------------------------------------------
  - method: POST
    path: "/ncaa/eligibility-certifications"
    description: "Submit an Eligibility Center review for an athlete; snapshots current gpa and amateurism."
    roles: [EligibilityCenter]
    code: 201
    input: [student_athlete_id]
    output: EligibilityCertification
    side_effects: ["EligibilityCertification created PENDING; gpa_at_review and amateurism_at_review snapshotted; version=1"]

  - method: GET
    path: "/ncaa/eligibility-certifications/{id}"
    description: "Read a single EligibilityCertification."
    roles: [EligibilityCenter, ComplianceOfficer]
    code: 200
    input: []
    output: EligibilityCertification
    side_effects: []

  - method: GET
    path: "/ncaa/eligibility-certifications"
    description: "List EligibilityCertifications, filterable by athlete."
    roles: [EligibilityCenter, ComplianceOfficer]
    code: 200
    input: ["limit?", "offset?", "student_athlete_id?", "status?"]
    output: EligibilityCertification[]
    side_effects: []

  - method: POST
    path: "/ncaa/eligibility-certifications/{id}/approve"
    description: "Eligibility Center approves; transitions PENDING->APPROVED."
    roles: [EligibilityCenter]
    code: 200
    input: []
    output: EligibilityCertification
    side_effects:
      - "StudentAthlete.eligibility_status := CERTIFIED"
      - "Increment EligibilityCertification.version by 1"
      - "Increment StudentAthlete.version by 1"

  - method: POST
    path: "/ncaa/eligibility-certifications/{id}/deny"
    description: "Eligibility Center denies; transitions PENDING->DENIED. Cascades scholarship withdrawals."
    roles: [EligibilityCenter]
    code: 200
    input: [denial_reason]
    output: EligibilityCertification
    side_effects:
      - "StudentAthlete.eligibility_status := INELIGIBLE"
      - "Cascade-WITHDRAW every ScholarshipOffer (status IN {DRAFT, SENT}) for this athlete; SENT-withdraw decrements Program.slots_committed (compensating invariant)"
      - "Increment EligibilityCertification.version by 1"

  # ---- RecruitingContact -----------------------------------------------------
  - method: POST
    path: "/ncaa/recruiting-contacts"
    description: "Log a recruiting contact. Period_type_at_contact is computed from existing Periods for program_id."
    roles: [Coach]
    code: 201
    input: [program_id, student_athlete_id, coach_user_id, contact_at, channel]
    output: RecruitingContact
    side_effects: ["RecruitingContact created with period_type_at_contact stamped; version=1"]

  - method: GET
    path: "/ncaa/recruiting-contacts/{id}"
    description: "Read a single RecruitingContact."
    roles: [ComplianceOfficer, Coach]
    code: 200
    input: []
    output: RecruitingContact
    side_effects: []

  - method: GET
    path: "/ncaa/recruiting-contacts"
    description: "List RecruitingContacts, filterable by program / athlete / coach."
    roles: [ComplianceOfficer, Coach]
    code: 200
    input: ["limit?", "offset?", "program_id?", "student_athlete_id?", "coach_user_id?"]
    output: RecruitingContact[]
    side_effects: []

  # ---- ScholarshipOffer ------------------------------------------------------
  - method: POST
    path: "/ncaa/scholarship-offers"
    description: "Create a ScholarshipOffer in DRAFT."
    roles: [Coach]
    code: 201
    input: [program_id, student_athlete_id, annual_value_cents]
    output: ScholarshipOffer
    side_effects: ["ScholarshipOffer created DRAFT; version=1; slots NOT yet committed"]

  - method: GET
    path: "/ncaa/scholarship-offers/{id}"
    description: "Read a single ScholarshipOffer."
    roles: [ComplianceOfficer, Coach, StudentAthlete]
    code: 200
    input: []
    output: ScholarshipOffer
    side_effects: []

  - method: GET
    path: "/ncaa/scholarship-offers"
    description: "List ScholarshipOffers, filterable by program/athlete/status."
    roles: [ComplianceOfficer, Coach, StudentAthlete]
    code: 200
    input: ["limit?", "offset?", "program_id?", "student_athlete_id?", "status?"]
    output: ScholarshipOffer[]
    side_effects: []

  - method: POST
    path: "/ncaa/scholarship-offers/{id}/send"
    description: "Coach sends a DRAFT offer; transitions DRAFT->SENT. Slot capacity enforced. OCC on Program."
    roles: [Coach]
    code: 200
    input: [expected_program_version]
    output: ScholarshipOffer
    side_effects:
      - "ScholarshipOffer.sent_at := current_utc"
      - "Program.slots_committed += 1"
      - "Increment Program.version by 1"
      - "Increment ScholarshipOffer.version by 1"

  - method: POST
    path: "/ncaa/scholarship-offers/{id}/accept"
    description: "Athlete accepts; transitions SENT->ACCEPTED."
    roles: [StudentAthlete]
    code: 200
    input: []
    output: ScholarshipOffer
    side_effects:
      - "StudentAthlete.enrolled_program_id := offer.program_id"
      - "Increment StudentAthlete.version by 1"
      - "Increment ScholarshipOffer.version by 1"

  - method: POST
    path: "/ncaa/scholarship-offers/{id}/decline"
    description: "Athlete declines; transitions SENT->DECLINED; releases the slot (compensating invariant)."
    roles: [StudentAthlete]
    code: 200
    input: []
    output: ScholarshipOffer
    side_effects:
      - "Program.slots_committed -= 1"
      - "Increment Program.version by 1"
      - "Increment ScholarshipOffer.version by 1"

  - method: POST
    path: "/ncaa/scholarship-offers/{id}/withdraw"
    description: "Coach withdraws; DRAFT or SENT -> WITHDRAWN. SENT case releases the slot."
    roles: [Coach]
    code: 200
    input: []
    output: ScholarshipOffer
    side_effects:
      - "If prior status was SENT: Program.slots_committed -= 1 and Program.version++ "
      - "Increment ScholarshipOffer.version by 1"

  # ---- NILDeal ---------------------------------------------------------------
  - method: POST
    path: "/ncaa/nil-deals"
    description: "Create a NILDeal in PROPOSED; net_value_cents and tier computed."
    roles: [StudentAthlete]
    code: 201
    input: ["student_athlete_id", "brand_name", "gross_value_cents", "agent_fee_pct?"]
    output: NILDeal
    side_effects: ["NILDeal created PROPOSED with tier classified per §1.3 nil_value_classification; review_round=0; version=1"]

  - method: GET
    path: "/ncaa/nil-deals/{id}"
    description: "Read a single NILDeal."
    roles: [NILReviewer, ComplianceOfficer, StudentAthlete]
    code: 200
    input: []
    output: NILDeal
    side_effects: []

  - method: GET
    path: "/ncaa/nil-deals"
    description: "List NILDeals, filterable by athlete / status / tier."
    roles: [NILReviewer, ComplianceOfficer, StudentAthlete]
    code: 200
    input: ["limit?", "offset?", "student_athlete_id?", "status?", "tier?"]
    output: NILDeal[]
    side_effects: []

  - method: POST
    path: "/ncaa/nil-deals/{id}/submit-for-review"
    description: "NILReviewer moves PROPOSED->UNDER_REVIEW."
    roles: [NILReviewer]
    code: 200
    input: []
    output: NILDeal
    side_effects: ["Increment NILDeal.version by 1"]

  - method: POST
    path: "/ncaa/nil-deals/{id}/request-revision"
    description: "NILReviewer cycles UNDER_REVIEW->PROPOSED for revision."
    roles: [NILReviewer]
    code: 200
    input: []
    output: NILDeal
    side_effects: ["NILDeal.review_round += 1; Increment NILDeal.version by 1"]

  - method: POST
    path: "/ncaa/nil-deals/{id}/approve"
    description: "NILReviewer approves UNDER_REVIEW->APPROVED. Segregation of duties enforced (priority 13)."
    roles: [NILReviewer]
    code: 200
    input: []
    output: NILDeal
    side_effects: ["Increment NILDeal.version by 1"]

  - method: POST
    path: "/ncaa/nil-deals/{id}/reject"
    description: "NILReviewer rejects UNDER_REVIEW->REJECTED."
    roles: [NILReviewer]
    code: 200
    input: [rejection_reason]
    output: NILDeal
    side_effects: ["Increment NILDeal.version by 1"]

  # ---- TransferPortalEntry ---------------------------------------------------
  - method: POST
    path: "/ncaa/transfer-portal-entries"
    description: "Athlete enters the Transfer Portal."
    roles: [StudentAthlete]
    code: 201
    input: [student_athlete_id, source_program_id]
    output: TransferPortalEntry
    side_effects:
      - "entered_at := current_utc"
      - "window_closes_at := entered_at + 45 days"
      - "StudentAthlete.in_transfer_portal := true"
      - "Increment StudentAthlete.version by 1"

  - method: GET
    path: "/ncaa/transfer-portal-entries/{id}"
    description: "Read a single TransferPortalEntry."
    roles: [ComplianceOfficer, StudentAthlete]
    code: 200
    input: []
    output: TransferPortalEntry
    side_effects: []

  - method: GET
    path: "/ncaa/transfer-portal-entries"
    description: "List TransferPortalEntries; filterable by athlete / status / source_program / matched_program."
    roles: [ComplianceOfficer, StudentAthlete]
    code: 200
    input: ["limit?", "offset?", "student_athlete_id?", "status?", "source_program_id?", "matched_program_id?"]
    output: TransferPortalEntry[]
    side_effects: []

  - method: POST
    path: "/ncaa/transfer-portal-entries/{id}/match"
    description: "ComplianceOfficer matches the entry to a destination program. OCC on TransferPortalEntry."
    roles: [ComplianceOfficer]
    code: 200
    input: [matched_program_id, expected_transferportalentry_version]
    output: TransferPortalEntry
    side_effects:
      - "TransferPortalEntry.matched_program_id := input.matched_program_id"
      - "StudentAthlete.enrolled_program_id := matched_program_id"
      - "StudentAthlete.in_transfer_portal := false"
      - "Increment TransferPortalEntry.version by 1"
      - "Increment StudentAthlete.version by 1"

  - method: POST
    path: "/ncaa/transfer-portal-entries/{id}/withdraw"
    description: "Athlete withdraws from the portal (only inside the window)."
    roles: [StudentAthlete]
    code: 200
    input: []
    output: TransferPortalEntry
    side_effects:
      - "StudentAthlete.in_transfer_portal := false"
      - "Increment TransferPortalEntry.version by 1"
      - "Increment StudentAthlete.version by 1"

  # ---- BoosterIncident -------------------------------------------------------
  - method: POST
    path: "/ncaa/booster-incidents"
    description: "Report a Booster violation."
    roles: [ComplianceOfficer]
    code: 201
    input: [program_id, booster_name, student_athlete_id, alleged_value_cents]
    output: BoosterIncident
    side_effects: ["BoosterIncident created REPORTED; severity_weight=0; version=1"]

  - method: GET
    path: "/ncaa/booster-incidents/{id}"
    description: "Read a single BoosterIncident."
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: BoosterIncident
    side_effects: []

  - method: GET
    path: "/ncaa/booster-incidents"
    description: "List BoosterIncidents; filterable by program / athlete / status."
    roles: [ComplianceOfficer]
    code: 200
    input: ["limit?", "offset?", "program_id?", "student_athlete_id?", "status?"]
    output: BoosterIncident[]
    side_effects: []

  - method: POST
    path: "/ncaa/booster-incidents/{id}/open-investigation"
    description: "ComplianceOfficer opens investigation; REPORTED->INVESTIGATING."
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: BoosterIncident
    side_effects: ["Increment BoosterIncident.version by 1"]

  - method: POST
    path: "/ncaa/booster-incidents/{id}/sustain"
    description: "ComplianceOfficer sustains the incident; INVESTIGATING->SUSTAINED. OCC on BoosterIncident. Cascades: Program.penalty_tier recompute; if POSTSEASON_BAN reached, auto-WITHDRAW every SENT ScholarshipOffer for that Program."
    roles: [ComplianceOfficer]
    code: 200
    input: [expected_boosterincident_version]
    output: BoosterIncident
    side_effects:
      - "BoosterIncident.severity_weight := weight_of(alleged_value_cents)"
      - "Program.penalty_tier recomputed (link 1)"
      - "If new penalty_tier == POSTSEASON_BAN: cascade-auto-WITHDRAW every SENT ScholarshipOffer on program_id (link 2)"
      - "Each cascaded WITHDRAWN: Program.slots_committed -= 1 (link 3)"
      - "Increment BoosterIncident.version by 1; Program.version bumped per recompute"

  - method: POST
    path: "/ncaa/booster-incidents/{id}/dismiss"
    description: "ComplianceOfficer dismisses; INVESTIGATING->DISMISSED."
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: BoosterIncident
    side_effects: ["Increment BoosterIncident.version by 1"]

  # ---- Test-driving (underscore namespace) -----------------------------------
  - method: POST
    path: "/ncaa/_clock/set_current_utc"
    description: "Set the system clock for deterministic time-gated tests (Period selection, Transfer Portal window expiry)."
    roles: [ComplianceOfficer]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["System clock pinned to to_iso8601"]

  - method: POST
    path: "/ncaa/_jobs/sweep-portal-expirations"
    description: "Idempotent sweep: transitions every TransferPortalEntry where status==ENTERED AND current_utc >= window_closes_at to EXPIRED."
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: "{ expired_count: integer, expired_entry_ids: string }"
    side_effects: ["Each matching entry -> EXPIRED; StudentAthlete.in_transfer_portal := false; version bumps"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing/empty"

  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "Role not permitted for this endpoint per §1.7"

  - id: ERR_NOT_FOUND
    http: 404
    condition: "Path or body FK does not resolve to an existing row"

  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Required body field missing OR type mismatch OR enum out of range"

  - id: ERR_INVALID_STATE
    http: 409
    condition: "Target row not in a state from which this transition is permitted (§1.2)"

  - id: ERR_STALE_PROGRAM_VERSION
    http: 412
    condition: "expected_program_version does not match Program.version (§1.2.1)"

  - id: ERR_STALE_ENTRY_VERSION
    http: 412
    condition: "expected_transferportalentry_version does not match (§1.2.1)"

  - id: ERR_STALE_INCIDENT_VERSION
    http: 412
    condition: "expected_boosterincident_version does not match (§1.2.1)"

  - id: ERR_DEAD_PERIOD_CONTACT
    http: 422
    condition: "RecruitingContact.contact_at falls in a DEAD-type Period for program_id"

  - id: ERR_QUIET_PERIOD_VIOLATION
    http: 422
    condition: "RecruitingContact.contact_at falls in a QUIET Period and channel != IN_PERSON"

  - id: ERR_OUTSIDE_RECRUITING_WINDOW
    http: 422
    condition: "RecruitingContact.contact_at falls in no Period for program_id"

  - id: ERR_PERIOD_OVERLAP
    http: 422
    condition: "A new Period overlaps an existing one for the same program_id (half-open semantics; adjacency permitted)"

  - id: ERR_PORTAL_WINDOW_CLOSED
    http: 422
    condition: "Transfer-Portal action attempted at or after entered_at + 45 days"

  - id: ERR_COACH_PROGRAM_MISMATCH
    http: 403
    condition: "Coach acts on an offer whose program does not match their affiliation"

  - id: ERR_SOD_VIOLATION
    http: 403
    condition: "NIL approver is the same user_id as a prior submitter or revision-requester"

  - id: ERR_ATHLETE_NOT_CERTIFIED
    http: 422
    condition: "Athlete is not in CERTIFIED state for an action requiring it (send offer, submit NIL)"

  - id: ERR_PROGRAM_UNDER_SANCTION
    http: 422
    condition: "HIGH_VALUE NIL deal approval attempted while Program.penalty_tier != NONE"

  - id: ERR_SLOT_CAP_EXCEEDED
    http: 422
    condition: "Program.slots_committed + 1 > scholarship_slot_cap on send"

  - id: ERR_ZERO_VALUE_INCIDENT
    http: 422
    condition: "BoosterIncident.alleged_value_cents == 0"

  - id: ERR_INVALID_INTERVAL
    http: 422
    condition: "Period.starts_at >= ends_at, or other inverted-interval input"

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: ComplianceOfficer
    description: "NCAA compliance officer; investigates, sets calendar, runs portal/clock administration."
    identity: opaque
    exclusive_operations:
      - "POST /ncaa/programs"
      - "POST /ncaa/programs/{id}/periods"
      - "POST /ncaa/student-athletes"
      - "POST /ncaa/booster-incidents"
      - "POST /ncaa/booster-incidents/{id}/open-investigation"
      - "POST /ncaa/booster-incidents/{id}/sustain"
      - "POST /ncaa/booster-incidents/{id}/dismiss"
      - "POST /ncaa/transfer-portal-entries/{id}/match"
      - "POST /ncaa/_clock/set_current_utc"
      - "POST /ncaa/_jobs/sweep-portal-expirations"
    shared_operations:
      - "GET reads across all entities"

  - name: Coach
    description: "Recruiting coach affiliated with one Program. X-User-ID is an opaque coach id stamped on RecruitingContact.coach_user_id; Coach affiliation to a Program is established by the request body (program_id) and pinned ScholarshipOffer.program_id."
    identity: opaque
    exclusive_operations:
      - "POST /ncaa/recruiting-contacts"
      - "POST /ncaa/scholarship-offers"
      - "POST /ncaa/scholarship-offers/{id}/send"
      - "POST /ncaa/scholarship-offers/{id}/withdraw"
    shared_operations:
      - "GET reads on programs, periods, scholarship-offers, recruiting-contacts, student-athletes"

  - name: StudentAthlete
    description: "Recruited or enrolled athlete. X-User-Role=StudentAthlete; X-User-ID equals an existing StudentAthlete.id (entity-backed)."
    identity: "entity_backed:StudentAthlete"
    exclusive_operations:
      - "POST /ncaa/nil-deals"
      - "POST /ncaa/scholarship-offers/{id}/accept"
      - "POST /ncaa/scholarship-offers/{id}/decline"
      - "POST /ncaa/transfer-portal-entries"
      - "POST /ncaa/transfer-portal-entries/{id}/withdraw"
    shared_operations:
      - "GET reads on own scholarship-offers, own nil-deals, own transfer-portal-entries, programs"

  - name: NILReviewer
    description: "NIL deal reviewer; SOD-bound (cannot approve a deal they submitted or sent back for revision)."
    identity: opaque
    exclusive_operations:
      - "POST /ncaa/nil-deals/{id}/submit-for-review"
      - "POST /ncaa/nil-deals/{id}/request-revision"
      - "POST /ncaa/nil-deals/{id}/approve"
      - "POST /ncaa/nil-deals/{id}/reject"
    shared_operations:
      - "GET reads on nil-deals, student-athletes, programs"

  - name: EligibilityCenter
    description: "NCAA Eligibility Center; the only role allowed to certify athletes."
    identity: opaque
    exclusive_operations:
      - "POST /ncaa/eligibility-certifications"
      - "POST /ncaa/eligibility-certifications/{id}/approve"
      - "POST /ncaa/eligibility-certifications/{id}/deny"
    shared_operations:
      - "GET reads on eligibility-certifications, student-athletes, programs"
