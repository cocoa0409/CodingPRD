              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: Registrar
            - call: "GET /actuarial/exam-windows/${win_id}"
              as: Registrar
              captures: { v2: $.data.version, s2: $.data.status }
            - call: "POST /actuarial/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-02T00:00:00Z" }
              as: Registrar
            - call: "GET /actuarial/exam-windows/${win_id}"
              as: Registrar
              captures: { v3: $.data.version, s3: $.data.status }
            - call: "POST /actuarial/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-10T09:00:00Z" }
              as: Registrar
            - call: "GET /actuarial/exam-windows/${win_id}"
              as: Registrar
              captures: { v4: $.data.version, s4: $.data.status }
            - call: "POST /actuarial/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-13T00:00:00Z" }
              as: Registrar
            - call: "GET /actuarial/exam-windows/${win_id}"
              as: Registrar
              captures: { v5: $.data.version, s5: $.data.status }
          assert:
            - "${v1} == 1, ${v2} == 2 (${s2} == REGISTRATION_OPEN), ${v3} == 3 (${s3} == REGISTRATION_CLOSED)"
            - "${v4} == 4 (${s4} == TESTING) and ${v5} == 5 (${s5} == SCORING)"
      - name: ops_run_sweep_idempotent_same_timestamp
        claim_type: ops_run_checkpoint
        grounds: ["endpoints[POST /actuarial/_clock/set_current_utc]", "complexity_profile.complexity_layers"]
        distinguishing_aspect: "Re-setting the clock to the same timestamp is a no-op sweep: zero windows advanced, zero registrations marked, and the window's version does not move."
        test_recipe:
          setup: ["window SCORING with one SAT registration after the 2026-10-13 sweep"]
          setup_api_calls:
            - call: "POST /actuarial/syllabus-versions"
              payload: { version_code: "2026-A" }
              as: Registrar
              captures: { syl_id: $.data.id }
            - call: "POST /actuarial/exams"
              payload: { exam_code: "P", title: "Probability", credit_hours: 10, syllabus_version_id: "${syl_id}" }
              as: Registrar
              captures: { exam_p_id: $.data.id }
            - call: "POST /actuarial/syllabus-versions/${syl_id}/activate"
              payload: {}
              as: Registrar
            - call: "POST /actuarial/exam-windows"
              payload: { exam_id: "${exam_p_id}", window_code: "P-2026-10", registration_opens_at: "2026-09-01T00:00:00Z", registration_deadline: "2026-10-01T00:00:00Z", testing_starts_at: "2026-10-10T09:00:00Z", testing_ends_at: "2026-10-12T17:00:00Z", capacity: 30, base_fee_cents: 30000, late_surcharge_cents: 7500 }
              as: Registrar
              captures: { win_id: $.data.id }
            - call: "POST /actuarial/candidates"
              payload: { email: "cand1@example.com", full_name: "Cand One" }
              as: Anonymous
              captures: { cand_id: $.data.id }
            - call: "POST /actuarial/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: Registrar
            - call: "POST /actuarial/exam-registrations"
              payload: { exam_window_id: "${win_id}" }
              as: Candidate
              as_user_id: "${cand_id}"
            - call: "POST /actuarial/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-13T00:00:00Z" }
              as: Registrar
            - call: "GET /actuarial/exam-windows/${win_id}"
              as: Registrar
              captures: { ver_before: $.data.version }
          trigger:
            - call: "POST /actuarial/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-13T00:00:00Z" }
              as: Registrar
              captures: { adv: $.data.windows_advanced, sat: $.data.registrations_marked_sat, cur: $.data.current_utc }
            - call: "GET /actuarial/exam-windows/${win_id}"
              as: Registrar
              captures: { ver_after: $.data.version }
          assert:
            - "${cur} == 2026-10-13T00:00:00Z and ${adv} == 0 and ${sat} == 0"
            - "${ver_after} == ${ver_before} (idempotent sweep mutates nothing)"
      - name: derived_field_seats_and_fee_reconciled
        claim_type: derived_field_reconciliation
        grounds: ["entities.ExamWindow.fields.seats_held", "entities.ExamRegistration.fields.fee_charged_cents"]
        excluded_because:
          difficulty_instance: "compensating_invariant / seats_held_invariant_under_register_cancel_promote"
          rationale: "seats_held reconciliation across create/waitlist/cancel/promote is asserted step by step there."
      - name: suspension_cascade_side_effects
        claim_type: cascading_side_effects
        grounds: ["state_machines.Candidate.status_ACTIVE_to_SUSPENDED"]
        excluded_because:
          difficulty_instance: "transitive_cascade / suspension_cascade_promotes_waitlisted_candidate"
          rationale: "The four-link cascade (suspend -> cancel -> refund -> promote) is asserted end to end there."
      - name: syllabus_retirement_cascade_side_effects
        claim_type: cascading_side_effects
        grounds: ["state_machines.SyllabusVersion.DRAFT_to_ACTIVE"]
        excluded_because:
          difficulty_instance: "transitive_cascade / syllabus_activation_retires_windows_and_refunds"
          rationale: "The retirement cascade (version -> exam -> window -> registration refund) is asserted end to end there."

