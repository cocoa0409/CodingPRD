          assert:
            - "adjacent assignment [15:20-15:40) after [15:00-15:20) succeeds: r2 status ASSIGNED (end == start is not an overlap)"
            - "identical-interval assignment [15:00-15:20) rejected with error_id == ERR_INTERPRETER_OVERLAP"
            - "r3 remains REQUESTED"

      - name: family_channel_switch_travel_gap_boundary
        grounds:
          - calculations.family_gap_requirement
          - errors[ERR_FAMILY_SCHEDULE_CONFLICT]
          - endpoints[POST /conf/bookings]
        distinguishing_aspect: |
          Different interval semantics from the interpreter rule: a channel-dependent
          required GAP (not pure half-open intersection) on the Family schedule resource.
          IN_PERSON [15:00-15:20] then VIRTUAL at exactly 15:50 (gap 30 == travel_minutes)
          is allowed (>= boundary); a third IN_PERSON booking at 15:25 leaves a 5-minute gap
