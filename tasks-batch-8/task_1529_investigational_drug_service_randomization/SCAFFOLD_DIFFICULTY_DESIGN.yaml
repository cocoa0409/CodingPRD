            - { call: "POST /api/kits/${k1}/release", as: Pharmacist, as_user_id: "${p1}" }
            - { call: "POST /api/studies/${study}/randomization-slots/replace", payload: { slots: [ { sequence_number: 1, stratum: "STANDARD", kit_number: "K-I1", arm_code: "TRT-A" } ], expected_study_version: "${study_v3}" }, as: SponsorAdmin }
            - { call: "POST /api/subjects", payload: { site_id: "${site}", subject_number: "SUB-I", stratum: "STANDARD" }, as: Pharmacist, as_user_id: "${p1}", captures: { sub: $.data.id } }
            - { call: "POST /api/subjects/${sub}/randomize", as: Pharmacist, as_user_id: "${p1}" }
