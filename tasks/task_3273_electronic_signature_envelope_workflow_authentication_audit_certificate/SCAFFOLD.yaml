scenario: |
  Electronic Signature Envelope Workflow, Authentication & Audit Certificate (DocuSign):
  envelope creation with document assembly, field placement and recipient roles including
  signers, approvers and copy recipients, routing order and conditional recipients with
  parallel and sequential paths, recipient authentication levels across email access,
  access code, knowledge-based questions and identity document verification, signing
  session mechanics with consent to electronic records, field validation and decline
  options, envelope status lifecycle with reminders, expiration and voiding, tamper-evident
  sealing and audit certificate generation recording every event with timestamps, template
  management, bulk send and application programming interface integration with business
  systems, retention, purge and legal hold policies

domain_name: "esign-envelope-workflow"
api_prefix: "/esign"

complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: compliance_audit
  complexity_layers:
    - cascading_side_effects
    - optimistic_concurrency
    - scheduled_deferred_actions
    - pagination_with_filtering
  entity_topology: flat
  state_machine_shape: parallel
  relationship_patterns:
    - one_to_many
    - many_to_many
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

# §1.0 Response Envelope (FIXED — verbatim)
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# §1.1 Entity-Relationship Table
entities:
  - name: Envelope
    parent: null
    common_fields: true
    fields:
      - name: sender_account_id
        type: string
        source: input
        description: "FK -> Account.id; the sender that owns this envelope"
      - name: subject
        type: string
        source: input
        description: envelope subject line
      - name: status
        type: enum
        source: computed
        description: envelope lifecycle status
        default: CREATED
        constraints: "one of CREATED|SENT|DELIVERED|COMPLETED|DECLINED|VOIDED|EXPIRED"
      - name: routing_mode
        type: enum
        source: input
        description: "routing shape: SEQUENTIAL enforces strict routing_order gating; PARALLEL releases every recipient at once"
        default: SEQUENTIAL
        constraints: "one of SEQUENTIAL|PARALLEL"
      - name: sender_visible_window_days
        type: integer
        source: input
        description: business-day window used by the sender-visible expiry variant
        default: 30
        constraints: ">= 1 and <= 365"
      - name: sent_at
        type: datetime
        source: system
        description: server-stamped moment the envelope left CREATED
        default: null
      - name: expires_at
        type: datetime
        source: computed
        description: "calendar-deadline expiry instant = sent_at + expires_after_days calendar days at 23:59:59Z"
        default: null
      - name: expires_after_days
        type: integer
        source: input
        description: calendar days after sent_at that the envelope expires
        default: 120
        constraints: ">= 1 and <= 365"
      - name: sender_visible_expires_at
        type: datetime
        source: computed
        description: "sender-visible expiry instant = sent_at + sender_visible_window_days BUSINESS days at 23:59:59Z (skips Sat/Sun)"
        default: null
      - name: is_sealed
        type: boolean
        source: computed
        description: tamper-evident seal flag, set true only on completion
        default: false
      - name: seal_hash
        type: string
        source: computed
        description: sha256 over the ordered document_hash list joined by '|'
        default: null
      - name: certificate_hash
        type: string
        source: computed
        description: sha256 over the ordered event hash chain; null until completed
        default: null
      - name: audit_certificate_id
        type: string
        source: computed
        description: id of the synthetic audit certificate document created at completion
        default: null
      - name: retention_policy_id
        type: string
        source: input
        description: "FK -> RetentionPolicy.id; retention policy governing this envelope"
      - name: legal_hold
        type: boolean
        source: input
        description: when true the envelope is frozen against void/expire/complete/purge
        default: false
      - name: legal_hold_started_at
        type: datetime
        source: system
        description: instant the active legal hold was applied; null while no hold is active
        default: null
      - name: legal_hold_until
        type: datetime
        source: input
        description: instant the active legal hold lapses; a hold with no supplied instant is treated as open-ended (infinite upper bound)
        default: null
      - name: purged_at
        type: datetime
        source: system
        description: moment the envelope content was purged after retention expiry
        default: null
      - name: decline_reason
        type: string
        source: input
        description: reason captured when a signer declines
        default: null
      - name: void_reason
        type: string
        source: input
        description: reason captured when the sender voids
        default: null

  - name: Recipient
    parent: Envelope
    common_fields: true
    fields:
      - name: envelope_id
        type: string
        source: input
        description: "FK -> Envelope.id; owning envelope"
      - name: role
        type: enum
        source: input
        description: recipient role in the envelope
        constraints: "one of SIGNER|APPROVER|COPY"
      - name: email
        type: string
        source: input
        description: recipient email address
      - name: routing_order
        type: integer
        source: input
        description: sequence position; lower numbers act first in SEQUENTIAL mode
        default: 1
        constraints: ">= 1"
      - name: status
        type: enum
        source: computed
        description: recipient workflow status; parallel dimension independent of auth_status
        default: WAITING
        constraints: "one of WAITING|SENT|DELIVERED|SIGNING|SIGNED|APPROVED|DECLINED|VOIDED|EXPIRED"
      - name: auth_status
        type: enum
        source: computed
        description: parallel authentication dimension layered on top of status
        default: PENDING
        constraints: "one of PENDING|AUTHENTICATED|FAILED"
      - name: auth_level
        type: enum
        source: input
        description: authentication strength required before this recipient may act
        constraints: "one of EMAIL_ACCESS|ACCESS_CODE|KBA|ID_DOCUMENT"
        default: EMAIL_ACCESS
      - name: access_code
        type: string
        source: input
        description: shared secret required when auth_level is ACCESS_CODE; never returned in responses
        default: null
      - name: kba_fail_count
        type: integer
        source: computed
        description: cumulative knowledge-based-question failures for this recipient
        default: 0
      - name: identity_verified
        type: boolean
        source: computed
        description: true once identity document verification succeeded
        default: false
      - name: consent_accepted
        type: boolean
        source: input
        description: whether the recipient pre-consented to electronic records
        default: false
      - name: consent_accepted_at
        type: datetime
        source: system
        description: server-stamped consent moment
        default: null
      - name: auth_risk_score
        type: computed
        description: provisional identity risk score; see calculations.authentication_risk_score
        default: 0
      - name: auth_risk_score_final
        type: computed
        description: final sealed identity risk score; see calculations.authentication_risk_score
        default: 0
      - name: signed_at
        type: datetime
        source: system
        description: moment the recipient completed signing
        default: null
      - name: reminder_count
        type: integer
        source: system
        description: number of reminder notifications sent to this recipient
        default: 0
      - name: last_reminder_at
        type: datetime
        source: system
        description: instant of the most recent reminder sent to this recipient; null if none
        default: null

  - name: SigningSession
    parent: Recipient
    common_fields: true
    fields:
      - name: recipient_id
        type: string
        source: input
        description: "FK -> Recipient.id; recipient this session belongs to"
      - name: envelope_id
        type: string
        source: input
        description: "FK -> Envelope.id; envelope being signed"
      - name: status
        type: enum
        source: computed
        description: signing session status
        default: OPEN
        constraints: "one of OPEN|COMPLETED|DECLINED|EXPIRED"
      - name: consent_to_electronic_records
        type: boolean
        source: input
        description: explicit consent flag captured at session open
        default: false
      - name: consent_captured_at
        type: datetime
        source: system
        description: server-stamped consent instant
        default: null
      - name: opened_at
        type: datetime
        source: system
        description: session open instant
        default: null

  - name: FieldPlacement
    parent: Envelope
    common_fields: true
    fields:
      - name: envelope_id
        type: string
        source: input
        description: "FK -> Envelope.id; owning envelope"
      - name: envelope_document_id
        type: string
        source: input
        description: "FK -> EnvelopeDocument.id; document the field sits on"
      - name: recipient_id
        type: string
        source: input
        description: "FK -> Recipient.id; recipient responsible for the field"
      - name: field_type
        type: enum
        source: input
        description: field kind; SIGNATURE fields are required and count toward completion
        constraints: "one of SIGNATURE|INITIAL|DATE|TEXT|CHECKBOX"
      - name: required
        type: boolean
        source: input
        description: required fields block recipient signing until they hold a value
        default: true
      - name: value
        type: string
        source: input
        description: the captured value; null until supplied
        default: null
      - name: page_number
        type: integer
        source: input
        description: page position on the document
        constraints: ">= 1"
      - name: tab_order
        type: integer
        source: input
        description: ordering of the field within the recipient's signing flow
        default: 1

  - name: EnvelopeDocument
    parent: Envelope
    common_fields: true
    fields:
      - name: envelope_id
        type: string
        source: input
        description: "FK -> Envelope.id; owning envelope"
      - name: name
        type: string
        source: input
        description: document file name
      - name: page_count
        type: integer
        source: input
        description: number of pages in the document
        constraints: ">= 1"
      - name: document_hash
        type: string
        source: computed
        description: server-stamped sha256 of the document bytes
        default: null
      - name: is_certificate
        type: boolean
        source: system
        description: true for the synthetic audit certificate document
        default: false

  - name: Template
    parent: null
    common_fields: true
    fields:
      - name: owning_account_id
        type: string
        source: input
        description: "FK -> Account.id; account that owns the template"
      - name: name
        type: string
        source: input
        description: template name
      - name: default_routing_mode
        type: enum
        source: input
        description: routing mode inherited by envelopes created from this template
        default: SEQUENTIAL
        constraints: "one of SEQUENTIAL|PARALLEL"
      - name: default_auth_level
        type: enum
        source: input
        description: default authentication level inherited by recipients
        default: EMAIL_ACCESS
        constraints: "one of EMAIL_ACCESS|ACCESS_CODE|KBA|ID_DOCUMENT"
      - name: page_count
        type: integer
        source: input
        description: number of pages in the template's document
        constraints: ">= 1"
      - name: status
        type: enum
        source: computed
        description: template lifecycle status
        default: DRAFT
        constraints: "one of DRAFT|PUBLISHED|ARCHIVED"
      - name: role_slot_count
        type: integer
        source: input
        description: number of role slots a recipient must supply at instantiation
        constraints: ">= 1"
      - name: times_used
        type: integer
        source: computed
        description: count of envelopes instantiated from this template
        default: 0

  - name: Account
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: account display name
      - name: state_code
        type: string
        source: input
        description: US state of the account; selects the retention schedule
      - name: status
        type: enum
        source: computed
        description: account status
        default: ACTIVE
        constraints: "one of ACTIVE|SUSPENDED|CLOSED"
      - name: credit_balance
        type: integer
        source: computed
        description: spendable credit units; debited by envelope sends and refunded by compensation
        default: 1000
      - name: tier
        type: enum
        source: input
        description: subscription tier driving the spend multiplier
        default: STANDARD
        constraints: "one of STANDARD|PRO|ENTERPRISE"
      - name: page_allowance
        type: integer
        source: input
        description: pages included per envelope before per-document overage fees apply
        default: 25

  - name: RetentionPolicy
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: policy display name
      - name: scope
        type: enum
        source: input
        description: policy scope; ACCOUNT scopes retention by the account's state_code, GLOBAL applies uniformly
        constraints: "one of ACCOUNT|GLOBAL"
      - name: retention_years
        type: integer
        source: input
        description: years of retention from completion
        constraints: ">= 1 and <= 50"
      - name: purge_mode
        type: enum
        source: input
        description: purge mode; ANONYMIZE_METADATA keeps the audit chain, DELETE_ALL removes document content
        constraints: "one of ANONYMIZE_METADATA|DELETE_ALL"
      - name: purge_grace_days
        type: integer
        source: input
        description: grace window after retention expiry before purge executes
        default: 0
        constraints: ">= 0"

  - name: AuditEvent
    parent: Envelope
    common_fields: false
    fields:
      - name: envelope_id
        type: string
        source: input
        description: "FK -> Envelope.id; envelope this event belongs to"
      - name: sequence_number
        type: integer
        source: system
        description: strictly increasing per-envelope event sequence
      - name: event_type
        type: enum
        source: system
        description: the recorded action
        constraints: "one of ENVELOPE_CREATED|SENT|DELIVERED|SESSION_OPENED|AUTH_SUCCEEDED|AUTH_FAILED|CONSENT_ACCEPTED|FIELD_COMPLETED|RECIPIENT_SIGNED|RECIPIENT_APPROVED|RECIPIENT_DECLINED|DOCUMENT_HASHED|SEALED|CERTIFICATE_GENERATED|VOIDED|EXPIRED|REMINDER_SENT|PURGED"
      - name: recipient_id
        type: string
        source: system
        description: "FK -> Recipient.id; acting recipient when recipient-scoped, else null"
        default: null
      - name: event_at
        type: datetime
        source: system
        description: server-stamped timestamp of the event
      - name: prev_hash
        type: string
        source: computed
        description: hash of the previous event in the chain; null for sequence_number 1
        default: null
      - name: event_hash
        type: string
        source: computed
        description: sha256 of (sequence_number|event_type|event_at|prev_hash)
      - name: detail
        type: string
        source: system
        description: human-readable event detail
        default: null

  - name: BulkSendBatch
    parent: null
    common_fields: true
    fields:
      - name: account_id
        type: string
        source: input
        description: "FK -> Account.id; account issuing the bulk send"
      - name: template_id
        type: string
        source: input
        description: "FK -> Template.id; template instantiated per row"
      - name: total_rows
        type: integer
        source: input
        description: number of recipient rows requested
        constraints: ">= 1"
      - name: status
        type: enum
        source: computed
        description: batch status
        default: CREATED
        constraints: "one of CREATED|COMPLETED|PARTIAL|FAILED"
      - name: succeeded_count
        type: integer
        source: computed
        description: rows that produced a valid envelope
        default: 0
      - name: failed_count
        type: integer
        source: computed
        description: rows rejected during processing
        default: 0

# §1.2 State Machine Table
state_machines:
  - entity: Envelope
    initial_state: CREATED
    terminal_states: [COMPLETED, DECLINED, VOIDED, EXPIRED]
    shape: branching_fork_join
    transitions:
      - from: CREATED
        to: SENT
        trigger: "POST /esign/envelopes/{id}/send"
        actor: Account
        preconditions:
          - "Envelope.status == CREATED"
          - "Envelope.legal_hold == false"
          - "at least 1 EnvelopeDocument belongs to this Envelope with page_count >= 1"
          - "at least 1 Recipient belongs to this Envelope with role IN {SIGNER, APPROVER}"
          - "every FieldPlacement.envelope_document_id resolves to an EnvelopeDocument whose envelope_id == Envelope.id"
          - "Account.credit_balance >= credit_spend_consumption(Envelope) as computed by calculations.credit_spend_consumption"
        side_effects:
          - "Envelope.sent_at = clock now"
          - "Envelope.expires_at = sent_at + expires_after_days calendar days, at 23:59:59Z"
          - "Envelope.sender_visible_expires_at = sent_at + sender_visible_window_days business days (skipping Saturday and Sunday), at 23:59:59Z"
          - "Account.credit_balance -= calculations.credit_spend_consumption(Envelope); Account.version += 1"
          - "every Recipient with routing_order == 1 -> status SENT, auth_status PENDING"
          - "recompute calculations.authentication_risk_score for this envelope; write Recipient.auth_risk_score on every Recipient"
          - "append AuditEvent {event_type: SENT, sequence_number: 1}"
          - "Envelope.version += 1"
      - from: SENT
        to: DELIVERED
        trigger: "POST /esign/envelopes/{id}/feed with feed_event: DELIVERED"
        actor: system
        preconditions:
          - "Envelope.status == SENT"
          - "Envelope.legal_hold == false"
        side_effects:
          - "Envelope.status -> DELIVERED"
          - "every Recipient with status == SENT and routing_order == 1 -> status DELIVERED"
          - "append AuditEvent {event_type: DELIVERED, sequence_number: next}"
          - "Envelope.version += 1"
      - from: SENT
        to: VOIDED
        trigger: "POST /esign/envelopes/{id}/void"
        actor: Account
        preconditions:
          - "Envelope.status IN {SENT, DELIVERED}"
          - "Envelope.legal_hold == false"
          - "expected_envelope_version == Envelope.version"
        side_effects:
          - "Envelope.status -> VOIDED; Envelope.void_reason = request void_reason"
          - "every Recipient whose status IN {WAITING, SENT, DELIVERED, SIGNING} -> status VOIDED"
          - "every SigningSession belonging to a Recipient of this Envelope whose session status == OPEN -> status EXPIRED"
          - "if refund_credit == true: Account.credit_balance += calculations.credit_spend_consumption(Envelope); Account.version += 1"
          - "append AuditEvent {event_type: VOIDED, sequence_number: next}"
          - "Envelope.version += 1"
      - from: DELIVERED
        to: VOIDED
        trigger: "POST /esign/envelopes/{id}/void"
        actor: Account
        preconditions:
          - "Envelope.status IN {SENT, DELIVERED}"
          - "Envelope.legal_hold == false"
          - "expected_envelope_version == Envelope.version"
        side_effects:
          - "Envelope.status -> VOIDED; Envelope.void_reason = request void_reason"
          - "every Recipient whose status IN {WAITING, SENT, DELIVERED, SIGNING} -> status VOIDED"
          - "every SigningSession belonging to a Recipient of this Envelope whose session status == OPEN -> status EXPIRED"
          - "if refund_credit == true: Account.credit_balance += calculations.credit_spend_consumption(Envelope); Account.version += 1"
          - "append AuditEvent {event_type: VOIDED, sequence_number: next}"
          - "Envelope.version += 1"
      - from: SENT
        to: EXPIRED
        trigger: "POST /esign/envelopes/{id}/expire"
        actor: system
        preconditions:
          - "Envelope.status IN {SENT, DELIVERED}"
          - "Envelope.legal_hold == false"
          - "logical clock now >= Envelope.expires_at"
          - "expected_envelope_version == Envelope.version"
        side_effects:
          - "Envelope.status -> EXPIRED"
          - "every Recipient whose status IN {WAITING, SENT, DELIVERED, SIGNING} -> status EXPIRED"
          - "every SigningSession belonging to a Recipient of this Envelope whose session status == OPEN -> status EXPIRED"
          - "append AuditEvent {event_type: EXPIRED, sequence_number: next}"
          - "Envelope.version += 1"
      - from: DELIVERED
        to: EXPIRED
        trigger: "POST /esign/envelopes/{id}/expire"
        actor: system
        preconditions:
          - "Envelope.status IN {SENT, DELIVERED}"
          - "Envelope.legal_hold == false"
          - "logical clock now >= Envelope.expires_at"
          - "expected_envelope_version == Envelope.version"
        side_effects:
          - "Envelope.status -> EXPIRED"
          - "every Recipient whose status IN {WAITING, SENT, DELIVERED, SIGNING} -> status EXPIRED"
          - "every SigningSession belonging to a Recipient of this Envelope whose session status == OPEN -> status EXPIRED"
          - "append AuditEvent {event_type: EXPIRED, sequence_number: next}"
          - "Envelope.version += 1"
      - from: DELIVERED
        to: DECLINED
        trigger: "POST /esign/recipients/{id}/decline  (bubbles up to the owning Envelope)"
        actor: Recipient
        preconditions:
          - "Envelope.status IN {SENT, DELIVERED}"
          - "Envelope.legal_hold == false"
          - "acting Recipient.role == SIGNER"
          - "acting Recipient.status IN {DELIVERED, AUTHENTICATED, SIGNING}"
        side_effects:
          - "Envelope.status -> DECLINED; Envelope.decline_reason = request decline_reason"
          - "every other Recipient of this Envelope whose status IN {WAITING, SENT, DELIVERED, SIGNING} -> status VOIDED"
          - "every SigningSession belonging to a Recipient of this Envelope whose session status == OPEN -> status DECLINED"
          - "append AuditEvent {event_type: RECIPIENT_DECLINED, sequence_number: next}"
          - "Envelope.version += 1"
      - from: DELIVERED
        to: COMPLETED
        trigger: "POST /esign/envelopes/{id}/complete"
        actor: Account
        preconditions:
          - "validations[priority=13] holds: Envelope.status == DELIVERED and every Recipient with role IN {SIGNER, APPROVER} has status IN {SIGNED, APPROVED}"
          - "Envelope.legal_hold == false"
          - "expected_envelope_version == Envelope.version"
          - "every FieldPlacement with required == true has value != null"
        side_effects:
          - "Envelope.status -> COMPLETED"
          - "Envelope.is_sealed = true"
          - "Envelope.seal_hash = sha256 of the ordered EnvelopeDocument.document_hash list for this envelope joined by '|'"
          - "a synthetic EnvelopeDocument is created with is_certificate: true, name 'AuditCertificate.pdf'; Envelope.audit_certificate_id = its id"
          - "Envelope.certificate_hash = sha256 of the ordered AuditEvent.event_hash chain joined by '|'"
          - "append AuditEvent {event_type: SEALED, sequence_number: next}"
          - "append AuditEvent {event_type: CERTIFICATE_GENERATED, sequence_number: next}"
          - "Template.times_used += 1 when Envelope.template_id != null"
          - "Envelope.version += 1"
      - from: COMPLETED
        to: COMPLETED
        trigger: "any further lifecycle trigger"
        actor: system
        preconditions: ["Envelope.status == COMPLETED is terminal"]
        side_effects: ["no mutation; request rejected with ERR_ENVELOPE_TERMINAL"]

  - entity: Recipient
    initial_state: WAITING
    terminal_states: [SIGNED, APPROVED, DECLINED, VOIDED, EXPIRED]
    shape: parallel_dimensions
    note: "status and auth_status are independent dimensions on the same Recipient row; auth_status gates the transitions of status, it does not replace them"
    transitions:
      - from: WAITING
        to: SIGNING
        trigger: "POST /esign/recipients/{id}/sessions"
        actor: Recipient
        preconditions:
          - "Envelope.status IN {SENT, DELIVERED}"
          - "the recipient's routing_order is released per validations[priority=21]"
          - "Recipient.auth_status != FAILED"
          - "the recipient holds no OPEN SigningSession"
        side_effects:
          - "Recipient.status -> SIGNING"
          - "Recipient.consent_accepted -> true and consent_accepted_at stamped when consent_to_electronic_records == true"
          - "append AuditEvent {event_type: SESSION_OPENED, sequence_number: next}"
          - "append AuditEvent {event_type: CONSENT_ACCEPTED, sequence_number: next} when consent is given"
      - from: SENT
        to: SIGNING
        trigger: "POST /esign/recipients/{id}/sessions"
        actor: Recipient
        preconditions:
          - "Envelope.status IN {SENT, DELIVERED}"
          - "the recipient's routing_order is released per validations[priority=21]"
          - "Recipient.auth_status != FAILED"
          - "the recipient holds no OPEN SigningSession"
        side_effects:
          - "Recipient.status -> SIGNING"
          - "Recipient.consent_accepted -> true and consent_accepted_at stamped when consent_to_electronic_records == true"
          - "append AuditEvent {event_type: SESSION_OPENED, sequence_number: next}"
          - "append AuditEvent {event_type: CONSENT_ACCEPTED, sequence_number: next} when consent is given"
      - from: DELIVERED
        to: SIGNING
        trigger: "POST /esign/recipients/{id}/sessions"
        actor: Recipient
        preconditions:
          - "Envelope.status IN {SENT, DELIVERED}"
          - "the recipient's routing_order is released per validations[priority=21]"
          - "Recipient.auth_status != FAILED"
          - "the recipient holds no OPEN SigningSession"
        side_effects:
          - "Recipient.status -> SIGNING"
          - "Recipient.consent_accepted -> true and consent_accepted_at stamped when consent_to_electronic_records == true"
          - "append AuditEvent {event_type: SESSION_OPENED, sequence_number: next}"
          - "append AuditEvent {event_type: CONSENT_ACCEPTED, sequence_number: next} when consent is given"
      - from: SIGNING
        to: SIGNED
        trigger: "POST /esign/recipients/{id}/sign"
        actor: Recipient
        preconditions:
          - "Envelope.status IN {SENT, DELIVERED}"
          - "Recipient.status == SIGNING"
          - "validations[priority=17] holds for this recipient"
          - "Recipient.consent_accepted == true"
          - "every FieldPlacement with recipient_id == Recipient.id and required == true has value != null"
        side_effects:
          - "Recipient.status -> SIGNED; Recipient.signed_at = clock now"
          - "Recipient.auth_risk_score_final = calculations.authentication_risk_score final variant for this Recipient"
          - "release the next routing_order group: every Recipient of this Envelope with the next-higher routing_order whose status == WAITING -> status SENT, auth_status PENDING"
          - "append AuditEvent {event_type: RECIPIENT_SIGNED, sequence_number: next}"
      - from: SIGNING
        to: APPROVED
        trigger: "POST /esign/recipients/{id}/sign with Recipient.role == APPROVER"
        actor: Recipient
        preconditions:
          - "Recipient.role == APPROVER"
          - "Recipient.status == SIGNING"
          - "validations[priority=17] holds for this recipient"
          - "Recipient.consent_accepted == true"
        side_effects:
          - "Recipient.status -> APPROVED; Recipient.signed_at = clock now"
          - "release the next routing_order group: every Recipient of this Envelope with the next-higher routing_order whose status == WAITING -> status SENT, auth_status PENDING"
          - "append AuditEvent {event_type: RECIPIENT_APPROVED, sequence_number: next}"
      - from: SIGNING
        to: DECLINED
        trigger: "POST /esign/recipients/{id}/decline"
        actor: Recipient
        preconditions:
          - "Recipient.role == SIGNER"
          - "Recipient.status == SIGNING"
        side_effects:
          - "Recipient.status -> DECLINED"
          - "bubble up: owning Envelope.status -> DECLINED; Envelope.decline_reason = request decline_reason"
          - "append AuditEvent {event_type: RECIPIENT_DECLINED, sequence_number: next}"
      - from: WAITING
        to: VOIDED
        trigger: "Envelope void/expire cascade"
        actor: system
        preconditions: ["Envelope.status IN {VOIDED, EXPIRED}"]
        side_effects:
          - "Recipient.status -> VOIDED"
          - "append AuditEvent {event_type: VOIDED, sequence_number: next}"

  - entity: SigningSession
    initial_state: OPEN
    terminal_states: [COMPLETED, DECLINED, EXPIRED]
    shape: linear_guarded
    transitions:
      - from: OPEN
        to: COMPLETED
        trigger: "POST /esign/recipients/{id}/sign (the session the recipient signed from)"
        actor: Recipient
        preconditions:
          - "SigningSession.status == OPEN"
          - "owning Recipient.status IN {SIGNING, SIGNED, APPROVED}"
        side_effects:
          - "SigningSession.status -> COMPLETED"
          - "append AuditEvent {event_type: FIELD_COMPLETED, sequence_number: next}"
      - from: OPEN
        to: DECLINED
        trigger: "POST /esign/recipients/{id}/decline"
        actor: Recipient
        preconditions: ["SigningSession.status == OPEN"]
        side_effects:
          - "SigningSession.status -> DECLINED"
          - "append AuditEvent flying for the decline"
      - from: OPEN
        to: EXPIRED
        trigger: "Envelope void/expire cascade"
        actor: system
        preconditions: ["owning Envelope.status IN {VOIDED, EXPIRED, DECLINED}"]
        side_effects:
          - "SigningSession.status -> EXPIRED"
          - "append AuditEvent {event_type: EXPIRED, sequence_number: next}"

  - entity: Template
    initial_state: DRAFT
    terminal_states: [ARCHIVED]
    shape: linear
    transitions:
      - from: DRAFT
        to: PUBLISHED
        trigger: "POST /esign/templates/{id}/publish"
        actor: Account
        preconditions:
          - "Template.status == DRAFT"
          - "Template.page_count >= 1"
          - "Template.role_slot_count >= 1"
        side_effects:
          - "Template.status -> PUBLISHED"
          - "Template.version += 1"
      - from: PUBLISHED
        to: ARCHIVED
        trigger: "POST /esign/templates/{id}/archive"
        actor: Account
        preconditions: ["Template.status == PUBLISHED"]
        side_effects:
          - "Template.status -> ARCHIVED"
          - "Template.version += 1"

  - entity: BulkSendBatch
    initial_state: CREATED
    terminal_states: [COMPLETED, PARTIAL, FAILED]
    shape: branching
    transitions:
      - from: CREATED
        to: COMPLETED
        trigger: "POST /esign/bulk-sends/{id}/process"
        actor: Account
        preconditions:
          - "BulkSendBatch.status == CREATED"
          - "every row produced an Envelope without error"
        side_effects:
          - "BulkSendBatch.status -> COMPLETED"
          - "BulkSendBatch.succeeded_count = total_rows; failed_count = 0"
      - from: CREATED
        to: PARTIAL
        trigger: "POST /esign/bulk-sends/{id}/process"
        actor: Account
        preconditions:
          - "BulkSendBatch.status == CREATED"
          - "at least 1 row produced an Envelope and at least 1 row was rejected"
        side_effects:
          - "BulkSendBatch.status -> PARTIAL"
          - "BulkSendBatch.succeeded_count = produced rows; failed_count = rejected rows"
      - from: CREATED
        to: FAILED
        trigger: "POST /esign/bulk-sends/{id}/process"
        actor: Account
        preconditions:
          - "BulkSendBatch.status == CREATED"
          - "every row was rejected"
        side_effects:
          - "BulkSendBatch.status -> FAILED"
          - "BulkSendBatch.succeeded_count = 0; failed_count = total_rows"

# §1.2.1 Concurrency Rules
concurrency_rules:
  - rule_id: envelope-void-compensation-stale
    parent_entity: Envelope
    write_endpoint: "POST /esign/envelopes/{id}/void"
    occ_field: "expected_envelope_version"
    description: |
      Voiding an Envelope whose version has advanced since the client last
      observed it is rejected. A concurrent administrative path can legitimately
      supersede the void (for example a sender-initiated completion that seals
      the envelope and advances its version), leaving the voiding client's view
      of the envelope stale; the void must not apply against that stale view.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: envelope-expire-stale
    parent_entity: Envelope
    write_endpoint: "POST /esign/envelopes/{id}/expire"
    occ_field: "expected_envelope_version"
    description: |
      Declaring an Envelope expired against a version the client last observed
      before another terminal write advanced it is rejected: the expiry sweep
      must not overwrite a lifecycle decision made after the client's snapshot.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: envelope-complete-stale
    parent_entity: Envelope
    write_endpoint: "POST /esign/envelopes/{id}/complete"
    occ_field: "expected_envelope_version"
    description: |
      Sealing an Envelope against a stale version is rejected: between the
      client's read and the seal request, a cascade (for example a recipient
      decline bubbling up) may have advanced the envelope's version, and the
      seal must not proceed on a snapshot that no longer describes the envelope.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: envelope-purge-stale
    parent_entity: Envelope
    write_endpoint: "POST /esign/envelopes/{id}/purge"
    occ_field: "expected_envelope_version"
    description: |
      Purging an Envelope against a stale version is rejected: a legal-hold
      toggle or a retention-policy change applied after the client's read
      advances the envelope's version, and the purge must not run against the
      superseded snapshot.
    error_id: ERR_STALE_VERSION
    http_status: 412

# §1.3 Calculation Rules Table
calculations:
  - name: credit_spend_consumption
    trigger: "POST /esign/envelopes/{id}/send"
    algorithm: tiered_pricing
    formula: |
      page_overage_units = ceil( max(0, total_pages - Account.page_allowance) / 10 )
      recipient_overage_units = max(0, signer_count - 5)
      base_units = 1 + page_overage_units + recipient_overage_units
      tier_multiplier = {STANDARD: 1.0, PRO: 0.8, ENTERPRISE: 0.5}[Account.tier]
      credit_units = ceil( base_units * tier_multiplier )
      if Account.status == SUSPENDED:
          credit_units = credit_units * 2
    input_set: "total_pages = sum of EnvelopeDocument.page_count for documents of this envelope with is_certificate == false; signer_count = count of Recipient rows of this envelope with role IN {SIGNER, APPROVER}"
    constants:
      PAGE_BLOCK: 10
      FREE_SIGNERS: 5
      SUSPENDED_DOUBLE: 2
    precision: "integer (credit units), ceiling on the tier multiplication"
    variants:
      - name: sender_visible_estimate
        when: "the sender reads the spend estimate before sending"
        difference: "must NOT include the SUSPENDED doubling (the estimate is computed assuming the account returns to ACTIVE), so a SUSPENDED account's estimate is half its actual debit"
  - name: envelope_page_fee
    trigger: "GET /esign/envelopes/{id}/fee-breakdown (recompute on every read)"
    algorithm: tiered_pricing
    formula: |
      PER_DOC_RATE = 12.335
      free_blocks = floor( Account.page_allowance / 10 )
      fee = 0
      for each EnvelopeDocument d of this envelope in ascending d.created_at (tie-break: ascending d.id is forbidden; use ascending created_at then ascending name):
          chargeable_blocks = max(0, ceil(d.page_count / 10) - free_blocks)
          fee += round_half_up( chargeable_blocks * PER_DOC_RATE, 2 )
    input_set: "all EnvelopeDocument rows of this envelope with is_certificate == false, ordered by created_at ascending; free_blocks is derived once from Account.page_allowance and applied to every document independently"
    constants:
      PER_DOC_RATE: 12.335
    precision: "2 decimal places, round_half_up applied PER DOCUMENT before summing"
    variants:
      - name: sum_then_round
        when: "an alternative reading rounds the aggregated sum once at the end"
        difference: "with 3 documents of 70 pages each and page_allowance 25 the pinned per-document variant yields 185.04 while the sum-then-round variant yields 185.03; the scaffold pins the per-document order"
  - name: authentication_risk_score
    trigger: "recipient authentication events (AUTH_SUCCEEDED / AUTH_FAILED) and recipient signing"
    algorithm: weighted_scoring
    formula: |
      BASE = {EMAIL_ACCESS: 10, ACCESS_CODE: 30, KBA: 55, ID_DOCUMENT: 80}[Recipient.auth_level]
      raw = BASE + 5 * Recipient.kba_fail_count
      if Recipient.identity_verified: raw += 15
      peer_term = 10 * ( count of other Recipients of the same Envelope whose auth_status == AUTHENTICATED
                         and whose auth_level IN {ACCESS_CODE, KBA, ID_DOCUMENT} )
      auth_risk_score = max(0, min(100, raw))                              # provisional, no peer_term
      auth_risk_score_final = min(100, raw + peer_term)                    # final, clamps low only
    input_set: "the Recipient row and its auth_level, kba_fail_count, identity_verified; provisional is recomputed for every Recipient of the envelope on each authentication event and is reject-transparent to peers"
    constants:
      FAIL_STEP: 5
      ID_BONUS: 15
      CEILING: 100
    precision: "integer"
    variants:
      - name: provisional
        when: "computed after each authentication event and before signing; written to Recipient.auth_risk_score"
        difference: "clamps the result into [0, 100]"
      - name: final
        when: "computed at the moment the recipient signs; written to Recipient.auth_risk_score_final and never recomputed"
        difference: "clamps only at the ceiling of 100 and never below 0; the final variant also adds a 10-point peer-consensus term for each recipient of the same envelope whose auth_status is AUTHENTICATED and whose auth_level is ACCESS_CODE or stronger, which the provisional variant never includes — so with a single EMAIL_ACCESS signer holding identity_verified the provisional reads 25 while the final reads 35"
  - name: envelope_fee_quote
    trigger: "GET /esign/envelopes/{id}/quote (recompute on every read)"
    algorithm: aggregation
    formula: |
      # evaluation order is pinned explicitly:
      # 1. page_component  = calculations.envelope_page_fee
      # 2. subtotal        = PAGE_BASE + page_component
      # 3. discount        = round_half_up( subtotal * discount_rate, 2 )
      # 4. total_fee       = subtotal - discount
      PAGE_BASE = 1500.00
      discount_rate = 0 if total_pages < 100 else (0.02 if total_pages <= 500 else (0.03 if total_pages <= 2000 else 0.04))
    input_set: "total_pages = sum of EnvelopeDocument.page_count for this envelope with is_certificate == false; page_component from envelope_page_fee"
    constants:
      PAGE_BASE: 1500.00
      DISCOUNT_TIER_1_MAX: 500
      DISCOUNT_TIER_2_MAX: 2000
      RATE_TIER_1: 0.02
      RATE_TIER_2: 0.03
      RATE_TIER_3: 0.04
    precision: "2 decimal places, round_half_up; the discount is rounded once, after the subtotal is formed"
    variants:
      - name: marginal_discount
        when: "an alternative reading applies each tier rate marginally to the pages crossing each boundary"
        difference: "at total_pages == 120 the flat variant charges 1500.00 + page_fee with a single 2% discount on the whole subtotal, while the marginal variant applies 2% only to the portion of spend attributable to pages above 100"

  - name: audit_chain_hash
    trigger: "GET /esign/envelopes/{id}/audit-certificate"
    algorithm: projection
    formula: |
      prev = null
      for each AuditEvent e of this envelope in ascending sequence_number:
          e.prev_hash = prev
          e.event_hash = sha256( str(e.sequence_number) + "|" + e.event_type + "|" + iso8601(e.event_at) + "|" + (prev or "") )
          prev = e.event_hash
      certificate_hash = sha256( "|".join(e.event_hash for e in ordered events) )
    input_set: "all AuditEvent rows of this envelope ordered by sequence_number ascending; sequence_number is contiguous starting at 1"
    constants: {}
    precision: "hex digest string, 64 characters"
    variants:
      - name: replay
        when: "read-time verification of an existing chain"
        difference: "recomputes every event_hash from the stored fields and rejects if any stored event_hash disagrees"

  - name: retention_expiry
    trigger: "POST /esign/envelopes/{id}/purge and GET /esign/retention-policies/{id}/due-envelopes"
    algorithm: interval_merge
    formula: |
      schedule = {CA: 7, IL: 5, TX: 10, GLOBAL: 3}
      retention_years = RetentionPolicy.retention_years if RetentionPolicy.scope == GLOBAL
                         else schedule[Account.state_code] if Account.state_code in schedule
                         else schedule[GLOBAL]
      anchor = Envelope.sent_at if Envelope.sent_at != null else Envelope.created_at
      retention_window = CLOSED_OPEN  [anchor, purge_eligible_at)
      purge_eligible_at = (anchor + retention_years in calendar years) + RetentionPolicy.purge_grace_days calendar days
      hold_window = EMPTY when Envelope.legal_hold == false
                    else CLOSED_OPEN [Envelope.legal_hold_started_at, Envelope.legal_hold_until or +infinity)
      purge_is_blocked = intervals_overlap(retention_window, hold_window)
      # adjacency semantics: a hold that starts exactly at purge_eligible_at does NOT block,
      # and a hold that lapses exactly at purge_eligible_at does NOT block. A hold starting
      # at purge_eligible_at - 1 second DOES block.
    input_set: "the Envelope, its owning Account.state_code, and the Envelope.retention_policy_id policy; the ACCOUNT scope resolves the year count from the state schedule, the GLOBAL scope uses the policy's own retention_years"
    constants:
      SCHEDULE_CA: 7
      SCHEDULE_IL: 5
      SCHEDULE_TX: 10
      SCHEDULE_DEFAULT: 3
    precision: "calendar-year arithmetic; purge_eligible_at is a datetime at 00:00:00Z of the computed day"
    variants:
      - name: pinned_vs_float
        when: "a policy is edited after the envelope completed"
        difference: "if pin at send is requested the envelope seals its resolved retention_years into the record and keeps it forever; otherwise the purge check re-resolves the live policy each run, so editing RetentionPolicy.retention_years changes the already-computed purge_eligible_at"

# §1.4 Validation Rules Table (ordered by priority)
validations:
  - priority: 1
    category: auth
    check: "X-User-Role header present and one of the declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "X-User-ID header present and non-empty when X-User-Role is entity_backed"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 3
    category: auth
    check: "acting role is listed in the endpoint's roles"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all"
  - priority: 4
    category: business_safety
    check: "the Account sealing an envelope must not be the identity that authenticated and signed any Recipient of that same envelope (segregation of duties)"
    error_id: ERR_SOD_VIOLATION
    http_status: 403
    applies_to: "[POST /esign/envelopes/{id}/complete]"
  - priority: 5
    category: existence
    check: "envelope id in path resolves to an existing Envelope"
    error_id: ERR_ENVELOPE_NOT_FOUND
    http_status: 404
    applies_to: "[POST /esign/envelopes/{id}/documents, POST /esign/envelopes/{id}/recipients, POST /esign/envelopes/{id}/send, POST /esign/envelopes/{id}/feed, POST /esign/envelopes/{id}/void, POST /esign/envelopes/{id}/complete, POST /esign/envelopes/{id}/expire, POST /esign/envelopes/{id}/purge, POST /esign/envelopes/{id}/legal-hold, POST /esign/envelopes/{id}/reminders, GET /esign/envelopes/{id}, GET /esign/envelopes/{id}/quote, GET /esign/envelopes/{id}/audit-certificate]"
  - priority: 6
    category: existence
    check: "recipient id in path resolves to an existing Recipient"
    error_id: ERR_RECIPIENT_NOT_FOUND
    http_status: 404
    applies_to: "[POST /esign/recipients/{id}/authenticate, POST /esign/recipients/{id}/sessions, POST /esign/recipients/{id}/sign, POST /esign/recipients/{id}/decline]"
  - priority: 7
    category: existence
    check: "referenced envelope_document_id resolves to an EnvelopeDocument of the same envelope"
    error_id: ERR_DOCUMENT_NOT_FOUND
    http_status: 404
    applies_to: "[POST /esign/envelopes/{id}/fields, GET /esign/fields]"
  - priority: 8
    category: existence
    check: "sender_account_id resolves to an existing Account"
    error_id: ERR_ACCOUNT_NOT_FOUND
    http_status: 404
    applies_to: "[POST /esign/envelopes, POST /esign/templates, POST /esign/bulk-sends]"
  - priority: 9
    category: existence
    check: "template_id resolves to an existing Template"
    error_id: ERR_TEMPLATE_NOT_FOUND
    http_status: 404
    applies_to: "[POST /esign/bulk-sends, POST /esign/templates/{id}/publish, POST /esign/templates/{id}/archive, POST /esign/templates/{id}/instantiate]"
  - priority: 10
    category: existence
    check: "retention_policy_id resolves to an existing RetentionPolicy"
    error_id: ERR_RETENTION_POLICY_NOT_FOUND
    http_status: 404
    applies_to: "[POST /esign/envelopes, POST /esign/templates/{id}/instantiate]"
  - priority: 11
    category: state
    check: "envelope is not in a terminal state (COMPLETED, DECLINED, VOIDED, EXPIRED) when the operation requires mutability"
    error_id: ERR_ENVELOPE_TERMINAL
    http_status: 409
    applies_to: "[POST /esign/envelopes/{id}/send, POST /esign/envelopes/{id}/void, POST /esign/envelopes/{id}/complete, POST /esign/envelopes/{id}/expire, POST /esign/envelopes/{id}/reminders]"
  - priority: 12
    category: business_safety
    check: "Envelope.legal_hold is false, or the active hold window [legal_hold_started_at, legal_hold_until) does not cover the logical clock, for any transition that mutates or removes envelope content"
    error_id: ERR_LEGAL_HOLD_FROZEN
    http_status: 409
    applies_to: "[POST /esign/envelopes/{id}/send, POST /esign/envelopes/{id}/void, POST /esign/envelopes/{id}/complete, POST /esign/envelopes/{id}/expire, POST /esign/envelopes/{id}/purge]"
  - priority: 13
    category: state
    check: "envelope.status is within the transition's allowed from-set for this operation, and for POST /esign/envelopes/{id}/complete every Recipient of the envelope with role IN {SIGNER, APPROVER} is already in status IN {SIGNED, APPROVED}"
    error_id: ERR_INVALID_ENVELOPE_STATE
    http_status: 409
    applies_to: "[POST /esign/envelopes/{id}/send, POST /esign/envelopes/{id}/feed, POST /esign/envelopes/{id}/void, POST /esign/envelopes/{id}/complete, POST /esign/envelopes/{id}/expire]"
  - priority: 14
    category: state
    check: "recipient is in an actionable state (not terminal SIGNED, APPROVED, DECLINED, VOIDED, EXPIRED) for sign/decline"
    error_id: ERR_RECIPIENT_TERMINAL
    http_status: 409
    applies_to: "[POST /esign/recipients/{id}/sign, POST /esign/recipients/{id}/decline]"
  - priority: 15
    category: state
    check: "the recipient's open SigningSession exists and is OPEN"
    error_id: ERR_SESSION_CLOSED
    http_status: 409
    applies_to: "[POST /esign/recipients/{id}/sign]"
  - priority: 16
    category: business_safety
    check: "the acting recipient's auth_level is at least KBA when the maximum provisional auth_risk_score over the OTHER Recipients of the same envelope whose auth_status == AUTHENTICATED is >= 60, and at least ID_DOCUMENT when that maximum is >= 80"
    error_id: ERR_AUTH_LEVEL_TOO_LOW
    http_status: 422
    applies_to: "[POST /esign/recipients/{id}/sign]"
  - priority: 17
    category: business_safety
    check: "the acting recipient's authentication requirement is satisfied: auth_status == AUTHENTICATED for an ACCESS_CODE, KBA or ID_DOCUMENT recipient, and auth_status == AUTHENTICATED or PENDING for an EMAIL_ACCESS recipient whose only credential is the delivered email link"
    error_id: ERR_AUTH_REQUIRED
    http_status: 422
    applies_to: "[POST /esign/recipients/{id}/sign]"
  - priority: 18
    category: business_safety
    check: "recipient.kba_fail_count < 3 when the authentication method is KBA"
    error_id: ERR_AUTH_MAX_ATTEMPTS
    http_status: 422
    applies_to: "[POST /esign/recipients/{id}/authenticate]"
  - priority: 19
    category: business_safety
    check: "consent to electronic records accepted either on the Recipient or on the SigningSession before signing"
    error_id: ERR_CONSENT_REQUIRED
    http_status: 422
    applies_to: "[POST /esign/recipients/{id}/sign]"
  - priority: 20
    category: business_safety
    check: "access_code supplied at authentication matches recipient.access_code when auth_level is ACCESS_CODE"
    error_id: ERR_INVALID_ACCESS_CODE
    http_status: 401
    applies_to: "[POST /esign/recipients/{id}/authenticate]"
  - priority: 21
    category: business_temporal
    check: "the recipient's routing_order has been released: in SEQUENTIAL mode every Recipient of the envelope with a lower routing_order whose role IN {SIGNER, APPROVER} is already terminal-attempted (SIGNED, APPROVED, DECLINED, VOIDED); in PARALLEL mode all recipients are released at once"
    error_id: ERR_ROUTING_NOT_RELEASED
    http_status: 422
    applies_to: "[POST /esign/recipients/{id}/sign, POST /esign/recipients/{id}/sessions]"
  - priority: 22
    category: business_temporal
    check: "logical clock now is before envelope.expires_at at the moment of signing"
    error_id: ERR_ENVELOPE_EXPIRED
    http_status: 409
    applies_to: "[POST /esign/recipients/{id}/sign, POST /esign/recipients/{id}/authenticate]"
  - priority: 23
    category: business_temporal
    check: "logical clock now is at or after calculations.retention_expiry purge_eligible_at for the envelope"
    error_id: ERR_RETENTION_NOT_EXPIRED
    http_status: 409
    applies_to: "[POST /esign/envelopes/{id}/purge]"
  - priority: 24
    category: business_constraint
    check: "every FieldPlacement with recipient_id == acting recipient and required == true has value != null, and every SIGNATURE field has value != null"
    error_id: ERR_FIELD_REQUIRED
    http_status: 422
    applies_to: "[POST /esign/recipients/{id}/sign, POST /esign/envelopes/{id}/complete]"
  - priority: 25
    category: business_constraint
    check: "no two Recipients of the same envelope share an email at the same routing_order"
    error_id: ERR_DUPLICATE_RECIPIENT
    http_status: 409
    applies_to: "[POST /esign/envelopes/{id}/recipients]"
  - priority: 26
    category: business_constraint
    check: "the set of routing_order values among a SEQUENTIAL envelope's Recipient rows with role IN {SIGNER, APPROVER} has no gap: it must equal {1..max} exactly"
    error_id: ERR_ROUTING_ORDER_GAP
    http_status: 422
    applies_to: "[POST /esign/envelopes/{id}/send, POST /esign/templates/{id}/instantiate]"
  - priority: 27
    category: business_constraint
    check: "template.status == PUBLISHED when instantiating or bulk-sending"
    error_id: ERR_TEMPLATE_NOT_PUBLISHED
    http_status: 422
    applies_to: "[POST /esign/templates/{id}/instantiate, POST /esign/bulk-sends/{id}/process]"
  - priority: 28
    category: business_constraint
    check: "template.name is unique within owning_account_id"
    error_id: ERR_DUPLICATE_TEMPLATE_NAME
    http_status: 409
    applies_to: "[POST /esign/templates]"
  - priority: 29
    category: business_referential
    check: "recipient_id supplied to a field placement belongs to the envelope in the path"
    error_id: ERR_RECIPIENT_ENVELOPE_MISMATCH
    http_status: 422
    applies_to: "[POST /esign/envelopes/{id}/fields]"
  - priority: 30
    category: business_referential
    check: "envelope_document_id supplied to a field placement belongs to the envelope in the path"
    error_id: ERR_DOCUMENT_ENVELOPE_MISMATCH
    http_status: 422
    applies_to: "[POST /esign/envelopes/{id}/fields]"
  - priority: 31
    category: business_fiscal
    check: "Account.credit_balance >= calculations.credit_spend_consumption(Envelope) at send time"
    error_id: ERR_INSUFFICIENT_CREDIT
    http_status: 402
    applies_to: "[POST /esign/envelopes/{id}/send, POST /esign/bulk-sends/{id}/process]"
  - priority: 32
    category: business_constraint
    check: "every recipient row in a bulk send carries a resolvable email and the role slots the template declares"
    error_id: ERR_BULK_ROW_INVALID
    http_status: 422
    applies_to: "[POST /esign/bulk-sends/{id}/process]"
  - priority: 33
    category: business_constraint
    check: "expected_envelope_version supplied equals Envelope.version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "[POST /esign/envelopes/{id}/void, POST /esign/envelopes/{id}/expire, POST /esign/envelopes/{id}/complete, POST /esign/envelopes/{id}/purge]"
  - priority: 35
    category: business_temporal
    check: "no reminder is sent to a Recipient whose closed-open cooldown window [last_reminder_at, last_reminder_at + 24 hours) covers the logical clock; a Reminder with last_reminder_at null is always eligible"
    error_id: ERR_REMINDER_COOLDOWN
    http_status: 409
    applies_to: "[POST /esign/envelopes/{id}/reminders]"
  - priority: 34
    category: business_constraint
    check: "all required body fields present and every enum-valued field carries a declared enum member"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all"

# §1.5 API Endpoint Table
endpoints:
  - method: POST
    path: "/esign/accounts"
    description: "create an account"
    roles: [PlatformAdmin]
    code: 201
    input: [name, state_code, "tier?", "page_allowance?"]
    output: Account
    side_effects: ["Account.credit_balance initialized to 1000", "Account.status initialized to ACTIVE"]
  - method: GET
    path: "/esign/accounts/{id}"
    description: "read one account"
    roles: [PlatformAdmin, Account]
    code: 200
    input: []
    output: Account
    side_effects: []
  - method: POST
    path: "/esign/accounts/{id}/credit-adjustments"
    description: "apply an operator credit adjustment to an account"
    roles: [PlatformAdmin]
    code: 200
    input: [delta_units, reason]
    output: Account
    side_effects: ["Account.credit_balance += delta_units (may be negative)", "Account.version += 1"]
  - method: POST
    path: "/esign/accounts/{id}/status"
    description: "set the account status (suspend, close or reactivate)"
    roles: [PlatformAdmin]
    code: 200
    input: [status]
    output: Account
    side_effects: ["Account.status = request status", "Account.version += 1"]
  - method: POST
    path: "/esign/retention-policies"
    description: "create a retention policy"
    roles: [PlatformAdmin]
    code: 201
    input: [name, scope, retention_years, purge_mode, "purge_grace_days?"]
    output: RetentionPolicy
    side_effects: []
  - method: GET
    path: "/esign/retention-policies"
    description: "list retention policies"
    roles: [PlatformAdmin, Account]
    code: 200
    input: ["scope?", "limit?", "offset?"]
    output: RetentionPolicy[]
    side_effects: []
  - method: PATCH
    path: "/esign/retention-policies/{id}"
    description: "edit a retention policy"
    roles: [PlatformAdmin]
    code: 200
    input: ["retention_years?", "purge_mode?", "purge_grace_days?"]
    output: RetentionPolicy
    side_effects: ["recompute calculations.retention_expiry for every envelope pinned to this policy", "RetentionPolicy.version += 1"]
  - method: POST
    path: "/esign/templates"
    description: "create a template"
    roles: [Account]
    code: 201
    input: [owning_account_id, name, "default_routing_mode?", "default_auth_level?", page_count, role_slot_count]
    output: Template
    side_effects: ["Template.status initialized to DRAFT", "Template.times_used initialized to 0"]
  - method: GET
    path: "/esign/templates"
    description: "list templates filtered by owner or status"
    roles: [Account, PlatformAdmin]
    code: 200
    input: ["owning_account_id?", "status?", "limit?", "offset?"]
    output: Template[]
    side_effects: []
  - method: POST
    path: "/esign/templates/{id}/publish"
    description: "publish a draft template"
    roles: [Account]
    code: 200
    input: []
    output: Template
    side_effects: ["Template.status -> PUBLISHED", "Template.version += 1"]
  - method: POST
    path: "/esign/templates/{id}/archive"
    description: "archive a published template"
    roles: [Account]
    code: 200
    input: []
    output: Template
    side_effects: ["Template.status -> ARCHIVED", "Template.version += 1"]
  - method: POST
    path: "/esign/templates/{id}/instantiate"
    description: "create an envelope from a published template and its role slots"
    roles: [Account]
    code: 201
    input: [sender_account_id, retention_policy_id, subject, recipients]
    output: Envelope
    side_effects: ["Envelope created in CREATED with routing_mode inherited from Template.default_routing_mode", "one Recipient per supplied role slot", "Template.times_used += 1"]
  - method: POST
    path: "/esign/envelopes"
    description: "create a draft envelope"
    roles: [Account]
    code: 201
    input: [sender_account_id, subject, "routing_mode?", "expires_after_days?", "sender_visible_window_days?", retention_policy_id, "template_id?"]
    output: Envelope
    side_effects: ["Envelope.status initialized to CREATED", "Envelope.legal_hold initialized to false", "append AuditEvent {event_type: ENVELOPE_CREATED, sequence_number: 1}"]
  - method: GET
    path: "/esign/envelopes/{id}"
    description: "read one envelope"
    roles: [Account, PlatformAdmin]
    code: 200
    input: []
    output: Envelope
    side_effects: []
  - method: GET
    path: "/esign/envelopes"
    description: "list envelopes filtered by sender, retention policy or status"
    roles: [Account, PlatformAdmin]
    code: 200
    input: ["sender_account_id?", "retention_policy_id?", "status?", "limit?", "offset?"]
    output: Envelope[]
    side_effects: []
  - method: POST
    path: "/esign/envelopes/{id}/documents"
    description: "assemble a document into the envelope"
    roles: [Account]
    code: 201
    input: [name, page_count]
    output: EnvelopeDocument
    side_effects: ["EnvelopeDocument.document_hash = sha256 of the assembled bytes", "append AuditEvent {event_type: DOCUMENT_HASHED, sequence_number: next}", "Envelope.version += 1"]
  - method: GET
    path: "/esign/envelopes/{id}/documents"
    description: "list the documents of an envelope"
    roles: [Account, PlatformAdmin]
    code: 200
    input: []
    output: EnvelopeDocument[]
    side_effects: []
  - method: POST
    path: "/esign/envelopes/{id}/recipients"
    description: "add a signer, approver or copy recipient"
    roles: [Account]
    code: 201
    input: [role, email, "routing_order?", "auth_level?", "access_code?", "consent_accepted?"]
    output: Recipient
    side_effects: ["Recipient.status initialized to WAITING", "Recipient.auth_status initialized to PENDING", "Envelope.version += 1"]
  - method: POST
    path: "/esign/envelopes/{id}/fields"
    description: "place a signing field for a recipient on a document"
    roles: [Account]
    code: 201
    input: [envelope_document_id, recipient_id, field_type, "required?", page_number, "tab_order?", "value?"]
    output: FieldPlacement
    side_effects: ["Envelope.version += 1"]
  - method: POST
    path: "/esign/envelopes/{id}/send"
    description: "send the envelope, releasing the first routing order"
    roles: [Account]
    code: 200
    input: []
    output: Envelope
    side_effects: ["Envelope.status -> SENT", "Envelope.sent_at and expiry fields stamped", "Account.credit_balance -= calculations.credit_spend_consumption(Envelope)", "Account.version += 1", "Recipients at routing_order 1 -> status SENT", "recompute calculations.authentication_risk_score", "append AuditEvent {event_type: SENT}", "increments Envelope.version by 1"]
  - method: POST
    path: "/esign/envelopes/{id}/feed"
    description: "advance the delivery feed for the envelope (simulates the email delivery webhook)"
    roles: [Account, PlatformAdmin]
    code: 200
    input: [feed_event]
    output: Envelope
    side_effects: ["when feed_event == DELIVERED: Envelope.status -> DELIVERED and routing_order-1 recipients -> DELIVERED", "append AuditEvent {event_type: DELIVERED}", "increments Envelope.version by 1"]
  - method: POST
    path: "/esign/envelopes/{id}/void"
    description: "void an in-flight envelope with an optimistic-concurrency guard"
    roles: [Account]
    code: 200
    input: [expected_envelope_version, void_reason, "refund_credit?"]
    output: Envelope
    side_effects: ["Envelope.status -> VOIDED", "in-flight Recipients -> VOIDED", "open SigningSessions -> EXPIRED", "when refund_credit == true: Account.credit_balance += calculations.credit_spend_consumption(Envelope)", "append AuditEvent {event_type: VOIDED}", "increments Envelope.version by 1"]
  - method: POST
    path: "/esign/envelopes/{id}/complete"
    description: "seal a fully-signed envelope and generate its audit certificate"
    roles: [Account]
    code: 200
    input: [expected_envelope_version]
    output: Envelope
    side_effects: ["Envelope.status -> COMPLETED", "Envelope.is_sealed -> true", "Envelope.seal_hash and certificate_hash computed", "synthetic certificate EnvelopeDocument created", "Template.times_used += 1", "append AuditEvent {event_type: SEALED} and {event_type: CERTIFICATE_GENERATED}", "increments Envelope.version by 1"]
  - method: POST
    path: "/esign/envelopes/{id}/expire"
    description: "expire an in-flight envelope with an optimistic-concurrency guard"
    roles: [Account, PlatformAdmin]
    code: 200
    input: [expected_envelope_version]
    output: Envelope
    side_effects: ["Envelope.status -> EXPIRED", "in-flight Recipients -> EXPIRED", "open SigningSessions -> EXPIRED", "append AuditEvent {event_type: EXPIRED}", "increments Envelope.version by 1"]
  - method: POST
    path: "/esign/envelopes/{id}/purge"
    description: "purge envelope content once retention has expired, unless frozen"
    roles: [PlatformAdmin]
    code: 200
    input: [expected_envelope_version]
    output: Envelope
    side_effects: ["Envelope.purged_at = clock now", "when RetentionPolicy.purge_mode == DELETE_ALL the certificate EnvelopeDocument is removed; when ANONYMIZE_METADATA it is retained", "append AuditEvent {event_type: PURGED}", "increments Envelope.version by 1"]
  - method: POST
    path: "/esign/envelopes/{id}/legal-hold"
    description: "apply or release the legal hold flag on an envelope"
    roles: [PlatformAdmin]
    code: 200
    input: [legal_hold, "hold_until?"]
    output: Envelope
    side_effects: ["Envelope.legal_hold = request legal_hold", "when legal_hold == true: Envelope.legal_hold_started_at = clock now and Envelope.legal_hold_until = request hold_until (null means open-ended)", "when legal_hold == false: Envelope.legal_hold_until = null", "increments Envelope.version by 1"]
  - method: POST
    path: "/esign/envelopes/{id}/reminders"
    description: "send a reminder to every pending recipient"
    roles: [Account]
    code: 200
    input: []
    output: Envelope
    side_effects: ["every Recipient with status IN {SENT, DELIVERED, SIGNING} -> reminder_count += 1 and last_reminder_at = clock now", "append AuditEvent {event_type: REMINDER_SENT} per recipient", "increments Envelope.version by 1"]
  - method: GET
    path: "/esign/envelopes/{id}/quote"
    description: "read the fee quote for the envelope; recomputed on every read"
    roles: [Account]
    code: 200
    input: []
    output: { total_pages: integer, page_component: number, subtotal: number, discount: number, total_fee: number }
    side_effects: ["recompute calculations.envelope_fee_quote"]
  - method: GET
    path: "/esign/envelopes/{id}/fee-breakdown"
    description: "read the per-document page fee breakdown; recomputed on every read"
    roles: [Account]
    code: 200
    input: []
    output: { per_document_fee: number, total_page_fee: number }
    side_effects: ["recompute calculations.envelope_page_fee"]
  - method: GET
    path: "/esign/envelopes/{id}/audit-certificate"
    description: "read the audit certificate: tamper-evident event chain and seal"
    roles: [Account, PlatformAdmin]
    code: 200
    input: []
    output: { certificate_hash: string, seal_hash: string, event_count: integer }
    side_effects: ["recompute calculations.audit_chain_hash"]
  - method: GET
    path: "/esign/recipients"
    description: "list recipients filtered by envelope or status"
    roles: [Account, PlatformAdmin]
    code: 200
    input: ["envelope_id?", "status?", "limit?", "offset?"]
    output: Recipient[]
    side_effects: []
  - method: GET
    path: "/esign/recipients/{id}"
    description: "read one recipient"
    roles: [Account, PlatformAdmin, Recipient]
    code: 200
    input: []
    output: Recipient
    side_effects: []
  - method: POST
    path: "/esign/recipients/{id}/authenticate"
    description: "complete the recipient authentication challenge"
    roles: [Recipient]
    code: 200
    input: [method, "access_code?", "kba_answers_correct?", "identity_document_verified?"]
    output: Recipient
    side_effects: ["on success Recipient.auth_status -> AUTHENTICATED", "on failure Recipient.auth_status -> FAILED and, only when method == KBA, Recipient.kba_fail_count += 1", "Recipient.identity_verified -> true when identity_document_verified == true", "recompute calculations.authentication_risk_score; provisional scores are written for every Recipient of the envelope", "append AuditEvent {event_type: AUTH_SUCCEEDED | AUTH_FAILED}"]
  - method: POST
    path: "/esign/recipients/{id}/sessions"
    description: "open a signing session, capturing consent to electronic records"
    roles: [Recipient]
    code: 201
    input: [consent_to_electronic_records]
    output: SigningSession
    side_effects: ["SigningSession.status -> OPEN", "Recipient.consent_accepted -> true and consent_accepted_at stamped when consent is given", "append AuditEvent {event_type: SESSION_OPENED} and {event_type: CONSENT_ACCEPTED}"]
  - method: POST
    path: "/esign/recipients/{id}/sign"
    description: "sign or approve as the recipient"
    roles: [Recipient]
    code: 200
    input: []
    output: Recipient
    side_effects: ["Recipient.status -> SIGNED (SIGNER) or APPROVED (APPROVER)", "Recipient.auth_risk_score_final sealed", "next routing_order group released", "open SigningSession -> COMPLETED", "the envelope status is left unchanged by this endpoint; sealing is a separate POST /esign/envelopes/{id}/complete call that the sender must issue", "append AuditEvent {event_type: RECIPIENT_SIGNED | RECIPIENT_APPROVED}"]
  - method: POST
    path: "/esign/recipients/{id}/decline"
    description: "decline to sign, bubbling the decline up to the envelope"
    roles: [Recipient]
    code: 200
    input: [decline_reason]
    output: Recipient
    side_effects: ["Recipient.status -> DECLINED", "Envelope.status -> DECLINED and Envelope.decline_reason captured", "open SigningSessions -> DECLINED", "append AuditEvent {event_type: RECIPIENT_DECLINED}", "increments Envelope.version by 1"]
  - method: PATCH
    path: "/esign/fields/{id}"
    description: "supply or update the value of a field placement"
    roles: [Recipient, Account]
    code: 200
    input: [value]
    output: FieldPlacement
    side_effects: ["append AuditEvent {event_type: FIELD_COMPLETED} when the field becomes non-null"]
  - method: GET
    path: "/esign/audit-events"
    description: "list audit events filtered by envelope, recipient or type"
    roles: [Account, PlatformAdmin]
    code: 200
    input: ["envelope_id?", "recipient_id?", "event_type?", "limit?", "offset?"]
    output: AuditEvent[]
    side_effects: []
  - method: GET
    path: "/esign/sessions"
    description: "list signing sessions filtered by recipient, envelope or status"
    roles: [Account, PlatformAdmin]
    code: 200
    input: ["recipient_id?", "envelope_id?", "status?", "limit?", "offset?"]
    output: SigningSession[]
    side_effects: []
  - method: GET
    path: "/esign/fields"
    description: "list field placements filtered by envelope, document or recipient"
    roles: [Account, PlatformAdmin]
    code: 200
    input: ["envelope_id?", "envelope_document_id?", "recipient_id?", "limit?", "offset?"]
    output: FieldPlacement[]
    side_effects: []
  - method: GET
    path: "/esign/bulk-sends"
    description: "list bulk send batches filtered by account, template or status"
    roles: [Account, PlatformAdmin]
    code: 200
    input: ["account_id?", "template_id?", "status?", "limit?", "offset?"]
    output: BulkSendBatch[]
    side_effects: []
  - method: POST
    path: "/esign/bulk-sends"
    description: "create a bulk send batch over a template"
    roles: [Account]
    code: 201
    input: [account_id, template_id, total_rows]
    output: BulkSendBatch
    side_effects: ["BulkSendBatch.status initialized to CREATED"]
  - method: POST
    path: "/esign/bulk-sends/{id}/process"
    description: "process the bulk send rows with partial-success semantics"
    roles: [Account]
    code: 200
    input: [rows]
    output: BulkSendBatch
    side_effects: ["BulkSendBatch.status -> COMPLETED | PARTIAL | FAILED", "succeeded_count and failed_count set from the row outcomes", "one Envelope created per valid row"]
  - method: GET
    path: "/esign/templates/{id}"
    description: "read one template"
    roles: [Account, PlatformAdmin]
    code: 200
    input: []
    output: Template
    side_effects: []
  - method: GET
    path: "/esign/sessions/{id}"
    description: "read one signing session"
    roles: [Account, PlatformAdmin, Recipient]
    code: 200
    input: []
    output: SigningSession
    side_effects: []
  - method: GET
    path: "/esign/fields/{id}"
    description: "read one field placement"
    roles: [Account, PlatformAdmin, Recipient]
    code: 200
    input: []
    output: FieldPlacement
    side_effects: []
  - method: GET
    path: "/esign/audit-events/{id}"
    description: "read one audit event"
    roles: [Account, PlatformAdmin]
    code: 200
    input: []
    output: AuditEvent
    side_effects: []
  - method: GET
    path: "/esign/bulk-sends/{id}"
    description: "read one bulk send batch"
    roles: [Account, PlatformAdmin]
    code: 200
    input: []
    output: BulkSendBatch
    side_effects: []
  - method: POST
    path: "/esign/_clock/set_current_utc"
    description: "set the server logical clock; the server startup default is exactly 2026-09-01T00:00:00Z and the logical clock never falls back to real wall-clock time"
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: datetime }
    side_effects: ["logical clock reads to_iso8601 for every subsequent time-sensitive rule"]

# §1.6 Error Code Catalog
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing or empty"
  - id: ERR_FORBIDDEN
    http: 403
    condition: "the acting role is not permitted on the endpoint"
  - id: ERR_SOD_VIOLATION
    http: 403
    condition: "the sealing identity also authenticated and signed a recipient of the same envelope"
  - id: ERR_ENVELOPE_NOT_FOUND
    http: 404
    condition: "no Envelope matches the path id"
  - id: ERR_RECIPIENT_NOT_FOUND
    http: 404
    condition: "no Recipient matches the path id"
  - id: ERR_DOCUMENT_NOT_FOUND
    http: 404
    condition: "no EnvelopeDocument matches the supplied envelope_document_id for this envelope"
  - id: ERR_ACCOUNT_NOT_FOUND
    http: 404
    condition: "no Account matches the supplied sender_account_id or account_id"
  - id: ERR_TEMPLATE_NOT_FOUND
    http: 404
    condition: "no Template matches the path id"
  - id: ERR_RETENTION_POLICY_NOT_FOUND
    http: 404
    condition: "no RetentionPolicy matches the supplied retention_policy_id"
  - id: ERR_ENVELOPE_TERMINAL
    http: 409
    condition: "the envelope is already in COMPLETED, DECLINED, VOIDED or EXPIRED"
  - id: ERR_INVALID_ENVELOPE_STATE
    http: 409
    condition: "the envelope is not in a status the transition accepts"
  - id: ERR_RECIPIENT_TERMINAL
    http: 409
    condition: "the recipient is already SIGNED, APPROVED, DECLINED, VOIDED or EXPIRED"
  - id: ERR_SESSION_CLOSED
    http: 409
    condition: "the recipient has no OPEN signing session when signing"
  - id: ERR_LEGAL_HOLD_FROZEN
    http: 409
    condition: "the envelope is under legal hold and the operation would mutate or remove content"
  - id: ERR_ENVELOPE_EXPIRED
    http: 409
    condition: "the logical clock is at or after envelope.expires_at when signing or authenticating"
  - id: ERR_RETENTION_NOT_EXPIRED
    http: 409
    condition: "the logical clock is before the computed purge_eligible_at"
  - id: ERR_DUPLICATE_RECIPIENT
    http: 409
    condition: "two recipients of one envelope share an email at the same routing_order"
  - id: ERR_DUPLICATE_TEMPLATE_NAME
    http: 409
    condition: "a template of the same name already exists for the owning account"
  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_envelope_version does not equal Envelope.version"
  - id: ERR_AUTH_REQUIRED
    http: 422
    condition: "the recipient has not reached auth_status AUTHENTICATED before signing"
  - id: ERR_AUTH_LEVEL_TOO_LOW
    http: 422
    condition: "the recipient's authentication level is below the level the envelope's risk requires"
  - id: ERR_AUTH_MAX_ATTEMPTS
    http: 422
    condition: "a knowledge-based-question authentication is attempted after 3 failures"
  - id: ERR_INVALID_ACCESS_CODE
    http: 401
    condition: "the supplied access_code does not match the recipient's access_code"
  - id: ERR_CONSENT_REQUIRED
    http: 422
    condition: "no consent to electronic records was recorded before signing"
  - id: ERR_ROUTING_NOT_RELEASED
    http: 422
    condition: "the recipient's routing_order has not been released in sequential mode"
  - id: ERR_ROUTING_ORDER_GAP
    http: 422
    condition: "sequential routing orders among signer/approver recipients are not the contiguous set {1..max}"
  - id: ERR_FIELD_REQUIRED
    http: 422
    condition: "a required or signature field placement of the recipient is still null"
  - id: ERR_RECIPIENT_ENVELOPE_MISMATCH
    http: 422
    condition: "the supplied recipient_id does not belong to the envelope in the path"
  - id: ERR_DOCUMENT_ENVELOPE_MISMATCH
    http: 422
    condition: "the supplied envelope_document_id does not belong to the envelope in the path"
  - id: ERR_TEMPLATE_NOT_PUBLISHED
    http: 422
    condition: "instantiation or bulk send used a template that is not PUBLISHED"
  - id: ERR_BULK_ROW_INVALID
    http: 422
    condition: "a bulk send row lacks a resolvable email or the template's role slots"
  - id: ERR_INSUFFICIENT_CREDIT
    http: 402
    condition: "the account's credit_balance is below the computed credit_spend_consumption"
  - id: ERR_REMINDER_COOLDOWN
    http: 409
    condition: "a reminder is requested inside a recipient's 24-hour reminder cooldown window"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "a required body field is missing or an enum field carries an undeclared member"

# §1.7 RBAC Matrix
roles:
  - name: PlatformAdmin
    description: "operator with retention, legal-hold and credential authority"
    identity: opaque
    exclusive_operations:
      - "POST /esign/accounts"
      - "POST /esign/accounts/{id}/credit-adjustments"
      - "POST /esign/retention-policies"
      - "PATCH /esign/retention-policies/{id}"
      - "POST /esign/envelopes/{id}/legal-hold"
      - "POST /esign/envelopes/{id}/purge"
