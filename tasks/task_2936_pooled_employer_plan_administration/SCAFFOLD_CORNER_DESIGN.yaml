      - excluded_because:
          difficulty_instance: remittance_deposit_parallel_status_dimensions_diverge
          rationale: "The `parallel` shape claim — independent state dimensions change independently and the combined state is correct — is asserted in depth there: deposit_status and timeliness_status are walked through (PENDING,UNDETERMINED) -> (POSTED,LATE) -> (POSTED,CORRECTION_COMPUTED) -> (POSTED,CORRECTED) and the reversal path rewinds only one axis. A shallower parallel-dimension probe here would restate the same combined-state table."

      - excluded_because:
          difficulty_instance: election_submitted_returned_resubmitted_then_replaced_cycle
          rationale: "The `cyclic` claim — the entity loops back and the loop is bounded by a termination condition — is asserted there across SUBMITTED -> RETURNED -> SUBMITTED plus the replacement path that supersedes the loop and resets the employer to APPLIED, including election_sequence advancing on every lap."

      - excluded_because:
          difficulty_instance: plan_filing_fork_join_conditional_single_branch
          rationale: "The fork-join claim — each branch works and the join requires all live branches — is asserted there on PlanFiling, including the case where audit_required is false so the audit branch does not exist and PREPARED -> READY_TO_FILE happens on one certify call."

      - excluded_because:
          difficulty_instance: plan_activation_gated_by_provider_registration_and_two_acknowledged_roles
          rationale: "The guarded-transition claim — DRAFT -> ACTIVE only if other entities are in the required states — is asserted there against priorities 25, 26 and 27 in order, including the unregistered-provider case that outranks both allocation gates."

      - excluded_because:
          difficulty_instance: late_deposit_suspends_employer_freezes_plan_and_reverts_filing
          rationale: "The cascade-down and conditional-cascade claims are asserted there: one posting drives the employer ACTIVE -> SUSPENDED, re-derives the plan's compliance_posture through RESTRICTED to FROZEN, and reverts the filing only when it sits in READY_TO_FILE — the condition that makes the cascade conditional."

      - excluded_because:
          difficulty_instance: exit_settlement_supersedes_election_closes_tests_and_retotals_plan
          rationale: "The ledger-sync claim — a state change updates the ancestor's derived fields and the before/after figures reconcile — is asserted there across the settlement waterfall, the plan's transferred_out_cents, expense_recovered_cents and both control deltas."

      - excluded_because:
          difficulty_instance: deposit_reversal_restores_contribution_control_delta_to_zero
          rationale: "The compensation claim — undoing a transition reverses every original side effect with no drift — is asserted there field by field on the employer, the batch and the plan, which is strictly stronger than a state-only reversal probe."

