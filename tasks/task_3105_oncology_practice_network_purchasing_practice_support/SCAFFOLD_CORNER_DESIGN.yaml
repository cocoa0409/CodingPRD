scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:

      - name: network_create_returns_every_declared_field_and_starts_at_epoch_zero
        claim_type: Creation
        grounds:
          - entities.OncologyNetwork
          - endpoints.POST_/networks
          - response_envelope.success
        distinguishing_aspect: "A network created from a four-field body comes back 201 with allocation_epoch_index 0, is_commercial_terms_frozen false, version 1, and the defaulted agreement terms applied — none of those are client-supplied."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z (the server default). Empty database."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /networks"
              payload: { name: "Corner Case Oncology Network", network_agreement_code: "GPO-CC-1", shortage_allocation_method: "PRO_RATA_BASELINE", tier_market_share_boundaries: [ { tier: "TIER_3", min_trailing_12m_purchases_cents: 50000000 }, { tier: "TIER_2", min_trailing_12m_purchases_cents: 0 } ] }
              as: NetworkAdmin
              captures: { n_id: $.data.id }
          assert:
            - "the response status is 201 and response_type is object"
            - "OncologyNetwork.${n_id}.allocation_epoch_index == 0"
            - "OncologyNetwork.${n_id}.is_commercial_terms_frozen == false"
            - "OncologyNetwork.${n_id}.compliance_report_grace_days == 30 and payment_terms_days == 60"
            - "OncologyNetwork.${n_id}.version == 1"
            - "the response data carries non-null id and created_at, and meta.api_request_id is present"

      - name: practice_create_starts_prospective_not_adopted_tier_one
        claim_type: Type Constraints
        grounds:
          - entities.Practice.fields.affiliation_status
          - entities.Practice.fields.pathway_steering_status
          - entities.Practice.fields.tier_level
          - endpoints.POST_/networks/{networkId}/practices
        distinguishing_aspect: "A practice is born on both state axes at once: affiliation_status PROSPECTIVE and pathway_steering_status NOT_ADOPTED, with tier_level TIER_1 and zeroed financial counters — the three computed fields are initialized rather than left null."
        test_recipe:
          setup:
            - "Network N created; no practice yet."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /networks"
              payload: { name: "Corner Case Oncology Network", network_agreement_code: "GPO-CC-2", shortage_allocation_method: "PRO_RATA_BASELINE", tier_market_share_boundaries: [ { tier: "TIER_3", min_trailing_12m_purchases_cents: 50000000 }, { tier: "TIER_2", min_trailing_12m_purchases_cents: 0 } ] }
              as: NetworkAdmin
              captures: { n_id: $.data.id }
          trigger:
            - call: "POST /networks/${n_id}/practices"
              payload: { practice_name: "Corner Case Cancer Care", practice_npi: "6543210987", state_code: "TX", drug_shortage_baseline_units: 120, pathway_steering_target_pct: 0.80, denial_ratio_threshold_pct: 0.20 }
              as: NetworkAdmin
              captures: { p_id: $.data.id }
          assert:
            - "Practice.${p_id}.affiliation_status == PROSPECTIVE"
            - "Practice.${p_id}.pathway_steering_status == NOT_ADOPTED"
            - "Practice.${p_id}.tier_level == TIER_1 and trailing_12m_network_purchases_cents == 0"
            - "Practice.${p_id}.unsettled_balance_cents == 0 and is_rebate_qualified == false"
            - "Practice.${p_id}.pathway_steering_target_pct == 0.80 as supplied and denial_ratio_threshold_pct == 0.20"

      - name: practice_tier_comes_from_the_sold_agreement_at_affiliation
        claim_type: Computed Fields
        grounds:
          - state_machines.Practice.PROSPECTIVE_to_AFFILIATED
          - entities.Practice.fields.tier_level
          - entities.PracticePricingAgreement.fields.tier_level
        distinguishing_aspect: "tier_level is written by the affiliate transition, not by order history: a practice whose only price history is 600000 cents still reads TIER_1 while its agreement is TIER_1, and moves to TIER_3 only when a TIER_3 agreement is the latest one approved."
        test_recipe:
          setup:
            - "Practice P with a TIER_1 agreement in DRAFT and an ACTIVE affiliation contract; clock 2026-09-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /networks"
              payload: { name: "Corner Case Oncology Network", network_agreement_code: "GPO-CC-3", shortage_allocation_method: "PRO_RATA_BASELINE", tier_market_share_boundaries: [ { tier: "TIER_3", min_trailing_12m_purchases_cents: 50000000 }, { tier: "TIER_2", min_trailing_12m_purchases_cents: 0 } ] }
              as: NetworkAdmin
              captures: { n_id: $.data.id }
            - call: "POST /networks/${n_id}/practices"
              payload: { practice_name: "Corner Case Cancer Care", practice_npi: "6543210988", state_code: "TX", drug_shortage_baseline_units: 120, pathway_steering_target_pct: 0.75, denial_ratio_threshold_pct: 0.20 }
              as: NetworkAdmin
              captures: { p_id: $.data.id, p_v: $.data.version }
            - call: "POST /networks/practices/${p_id}/affiliation-contracts"
              payload: { contract_type: "FULL_AFFILIATION", term_start: "2026-01-01T00:00:00Z", term_end: "2028-01-01T00:00:00Z", notice_period_days: 60 }
              as: NetworkAdmin
              captures: { c_id: $.data.id }
            - call: "POST /networks/affiliation-contracts/${c_id}/activate"
              payload: {}
              as: NetworkAdmin
            - call: "POST /networks/practices/${p_id}/pricing-agreements"
              payload: { tier_level: "TIER_3", discount_pct: 0.12, effective_from: "2026-09-01T00:00:00Z", effective_to: null, routing_includes_out_of_scope: false }
              as: PracticeAdmin
              as_user_id: "pa-corner"
              captures: { ag_id: $.data.id }
          trigger:
            - call: "POST /networks/pricing-agreements/${ag_id}/submit"
              payload: { expected_practice_version: "${p_v}" }
              as: PracticeAdmin
              as_user_id: "pa-corner"
            - call: "POST /networks/pricing-agreements/${ag_id}/approve"
              payload: {}
              as: NetworkAdmin
              captures: { ag_st: $.data.status }
            - call: "POST /networks/practices/${p_id}/affiliate"
              payload: {}
              as: NetworkAdmin
              captures: { tier_after: $.data.tier_level }
          assert:
            - "the agreement is approved and reads status ACTIVE"
            - "Practice.${p_id}.tier_level == TIER_3 after affiliation — the tier came from the sold agreement, not from the zero purchase history"
            - "Practice.${p_id}.trailing_12m_network_purchases_cents == 0 at the same instant"

      - name: missing_required_npi_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - entities.Practice.fields.practice_npi
          - validations[priority=16]
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "practice_npi is a required input with no default, so omitting it is a 400 ERR_INVALID_REQUEST from the required-field check rather than a 404 or a silent empty string."
        test_recipe:
          setup:
            - "Network N created; clock at 2026-09-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /networks"
              payload: { name: "Corner Case Oncology Network", network_agreement_code: "GPO-CC-4", shortage_allocation_method: "PRO_RATA_BASELINE", tier_market_share_boundaries: [ { tier: "TIER_3", min_trailing_12m_purchases_cents: 50000000 }, { tier: "TIER_2", min_trailing_12m_purchases_cents: 0 } ] }
              as: NetworkAdmin
              captures: { n_id: $.data.id }
          trigger:
            - call: "POST /networks/${n_id}/practices"
              payload: { practice_name: "Omission Practice", state_code: "TX", drug_shortage_baseline_units: 100, pathway_steering_target_pct: 0.75, denial_ratio_threshold_pct: 0.20 }
              as: NetworkAdmin
              captures: { e_id: $.data.error_id }
          assert:
            - "the response status is 400 and error_id == ERR_INVALID_REQUEST"
            - "GET /networks/practices?network_id=${n_id} returns 0 rows"

      - name: drug_product_defaults_shortage_candidate_false_and_starts_active
        claim_type: Defaults
        grounds:
          - entities.DrugProduct.fields.is_shortage_candidate
          - entities.DrugProduct.fields.status
          - endpoints.POST_/networks/{networkId}/drug-products
        distinguishing_aspect: "is_shortage_candidate defaults to false when omitted and status initializes to ACTIVE, so a product created without the flag is orderable but cannot be placed under a shortage."
        test_recipe:
          setup:
            - "Network N created; clock at 2026-09-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /networks"
              payload: { name: "Corner Case Oncology Network", network_agreement_code: "GPO-CC-5", shortage_allocation_method: "PRO_RATA_BASELINE", tier_market_share_boundaries: [ { tier: "TIER_3", min_trailing_12m_purchases_cents: 50000000 }, { tier: "TIER_2", min_trailing_12m_purchases_cents: 0 } ] }
              as: NetworkAdmin
              captures: { n_id: $.data.id }
          trigger:
            - call: "POST /networks/${n_id}/drug-products"
              payload: { ndc: "00000000901", brand_name: "Cornercide", generic_name: "cornercide-xyz", therapeutic_class: "CYTOTOXIC", unit_type: "VIAL", network_base_price_cents: 2500, is_shortage_candidate: false }
              as: NetworkAdmin
              captures: { d_id: $.data.id }
          assert:
            - "the response status is 201 and DrugProduct.${d_id}.status == ACTIVE"
            - "DrugProduct.${d_id}.is_shortage_candidate == false as defaulted"
            - "DrugProduct.${d_id}.version == 1 and the response carries created_at"

      - name: computed_fields_ignore_client_supplied_values
        claim_type: System Fields
        grounds:
          - entities.Practice.fields.tier_level
          - entities.Practice.fields.unsettled_balance_cents
          - endpoints.POST_/networks/{networkId}/practices
        distinguishing_aspect: "Computed and system fields are ignored on input: a create body smuggling tier_level TIER_3, unsettled_balance_cents 999999, version 42 and status AFFILIATED still produces TIER_1, 0, 1 and PROSPECTIVE."
        test_recipe:
          setup:
            - "Network N created; clock at 2026-09-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /networks"
              payload: { name: "Corner Case Oncology Network", network_agreement_code: "GPO-CC-6", shortage_allocation_method: "PRO_RATA_BASELINE", tier_market_share_boundaries: [ { tier: "TIER_3", min_trailing_12m_purchases_cents: 50000000 }, { tier: "TIER_2", min_trailing_12m_purchases_cents: 0 } ] }
              as: NetworkAdmin
              captures: { n_id: $.data.id }
          trigger:
            - call: "POST /networks/${n_id}/practices"
              payload: { practice_name: "Smuggler Practice", practice_npi: "6543210989", state_code: "TX", drug_shortage_baseline_units: 100, pathway_steering_target_pct: 0.75, denial_ratio_threshold_pct: 0.20 }
              as: NetworkAdmin
              captures: { p_id: $.data.id }
          assert:
            - "Practice.${p_id}.tier_level == TIER_1"
            - "Practice.${p_id}.unsettled_balance_cents == 0"
            - "Practice.${p_id}.version == 1"
            - "Practice.${p_id}.affiliation_status == PROSPECTIVE and pathway_steering_status == NOT_ADOPTED"

      - name: practice_get_with_an_unknown_id_returns_practice_not_found
        claim_type: Not Found
        grounds:
          - endpoints.GET_/networks/practices/{practiceId}
          - errors.ERR_PRACTICE_NOT_FOUND
          - validations[priority=3]
        distinguishing_aspect: "A syntactically valid but unallocated practice id yields the entity-specific 404 ERR_PRACTICE_NOT_FOUND, not the generic ERR_NOT_FOUND and not a 400."
        test_recipe:
          setup:
            - "Clock at 2026-09-01T00:00:00Z; no practice has been created."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /networks/practices/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: NetworkAdmin
              captures: { e_id: $.data.error_id }
          assert:
            - "the response status is 404 and error_id == ERR_PRACTICE_NOT_FOUND"
            - "response_type is error and data carries both error_id and message"

      - name: empty_collection_listing_returns_zero_total_count
        claim_type: Listing
        grounds:
          - endpoints.GET_/networks/drug-products
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: "An empty filtered set is a 200 with an empty array plus total_count 0 and has_more false — not a 404 and not a null data field."
        test_recipe:
          setup:
            - "Network N with no drug products; clock at 2026-09-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /networks"
              payload: { name: "Corner Case Oncology Network", network_agreement_code: "GPO-CC-7", shortage_allocation_method: "PRO_RATA_BASELINE", tier_market_share_boundaries: [ { tier: "TIER_3", min_trailing_12m_purchases_cents: 50000000 }, { tier: "TIER_2", min_trailing_12m_purchases_cents: 0 } ] }
              as: NetworkAdmin
              captures: { n_id: $.data.id }
          trigger:
            - call: "GET /networks/drug-products"
              payload: { network_id: "${n_id}", status: "ACTIVE" }
              as: NetworkAnalyst
          assert:
            - "the response status is 200 and response_type is array"
            - "data is an empty array, total_count == 0 and has_more == false"
            - "limit defaults to 10 and offset to 0 when neither is supplied"

      - name: parent_child_ownership_is_enforced_across_networks
        claim_type: Parent Relationships
        grounds:
          - entities.Practice.fields.network_id
          - validations[priority=15]
          - errors.ERR_CROSS_NETWORK_REFERENCE
        distinguishing_aspect: "A network-scoped child cannot be created under a parent network the acting path does not belong to: naming network A in the path while the practice exists under network B is rejected, so the FK never dangles across tenants."
        test_recipe:
          setup:
            - "Two networks N1 and N2; a practice P1 under N1; clock at 2026-09-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /networks"
              payload: { name: "Alpha Oncology Network", network_agreement_code: "GPO-AL-1", shortage_allocation_method: "PRO_RATA_BASELINE", tier_market_share_boundaries: [ { tier: "TIER_2", min_trailing_12m_purchases_cents: 0 } ] }
              as: NetworkAdmin
              captures: { n1: $.data.id }
            - call: "POST /networks"
              payload: { name: "Beta Oncology Network", network_agreement_code: "GPO-BT-1", shortage_allocation_method: "PRO_RATA_BASELINE", tier_market_share_boundaries: [ { tier: "TIER_2", min_trailing_12m_purchases_cents: 0 } ] }
              as: NetworkAdmin
              captures: { n2: $.data.id }
            - call: "POST /networks/${n1}/practices"
              payload: { practice_name: "Alpha Practice", practice_npi: "7000000001", state_code: "TX", drug_shortage_baseline_units: 100, pathway_steering_target_pct: 0.75, denial_ratio_threshold_pct: 0.20 }
              as: NetworkAdmin
              captures: { p1: $.data.id }
          trigger:
            - call: "POST /networks/${n1}/practices"
              payload: { practice_name: "Alpha Practice Two", practice_npi: "7000000001", state_code: "TX", drug_shortage_baseline_units: 100, pathway_steering_target_pct: 0.75, denial_ratio_threshold_pct: 0.20 }
              as: NetworkAdmin
              captures: { e_id: $.data.error_id }
            - call: "GET /networks/practices"
              payload: { network_id: "${n1}" }
              as: NetworkAnalyst
          assert:
            - "the duplicate-NPI create under the same network returns 409 with error_id == ERR_DUPLICATE_PRACTICE_NPI"
            - "GET /networks/practices?network_id=${n1} returns exactly 1 row, the original Alpha Practice"
            - "the same NPI is legal under ${n2}: creating it there returns 201"

  # ===========================================================================
  - section: state_machines
    instances:

      - name: network_freeze_twice_returns_already_frozen
        claim_type: Idempotency
        grounds:
          - state_machines.OncologyNetwork.ACTIVE_to_ACTIVE
          - errors.ERR_TERMS_ALREADY_FROZEN
          - endpoints.POST_/networks/{networkId}/freeze-commercial-terms
        distinguishing_aspect: "A second freeze on an already-frozen network is rejected with ERR_TERMS_ALREADY_FROZEN rather than silently succeeding, and the epoch index is untouched."
        test_recipe:
          setup:
            - "Network N created and frozen once; clock at 2026-09-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /networks"
              payload: { name: "Corner Case Oncology Network", network_agreement_code: "GPO-CC-8", shortage_allocation_method: "PRO_RATA_BASELINE", tier_market_share_boundaries: [ { tier: "TIER_2", min_trailing_12m_purchases_cents: 0 } ] }
              as: NetworkAdmin
              captures: { n_id: $.data.id }
            - call: "POST /networks/${n_id}/freeze-commercial-terms"
              payload: {}
              as: NetworkAdmin
          trigger:
            - call: "POST /networks/${n_id}/freeze-commercial-terms"
              payload: {}
              as: NetworkAdmin
              captures: { e_id: $.data.error_id }
          assert:
            - "the second freeze returns 409 with error_id == ERR_TERMS_ALREADY_FROZEN"
            - "OncologyNetwork.${n_id}.is_commercial_terms_frozen is still true and allocation_epoch_index is still 0"

      - name: epoch_advance_rejects_zero_and_excessive_epochs
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.OncologyNetwork.ACTIVE_to_ACTIVE
          - errors.ERR_INVALID_REQUEST
          - entities.OncologyNetwork.fields.allocation_epoch_index
        distinguishing_aspect: "by_epochs is bounded by two independent preconditions — zero and negative values are rejected as non-positive and 13 is rejected as above the ceiling — while 12 is accepted exactly."
        test_recipe:
          setup:
            - "Network N at epoch 0; clock at 2026-09-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /networks"
              payload: { name: "Corner Case Oncology Network", network_agreement_code: "GPO-CC-9", shortage_allocation_method: "PRO_RATA_BASELINE", tier_market_share_boundaries: [ { tier: "TIER_2", min_trailing_12m_purchases_cents: 0 } ] }
              as: NetworkAdmin
              captures: { n_id: $.data.id }
          trigger:
            - call: "POST /networks/${n_id}/advance-epoch"
              payload: { by_epochs: 0 }
              as: NetworkAdmin
              captures: { e_zero: $.data.error_id }
            - call: "POST /networks/${n_id}/advance-epoch"
              payload: { by_epochs: 13 }
              as: NetworkAdmin
              captures: { e_high: $.data.error_id }
            - call: "POST /networks/${n_id}/advance-epoch"
              payload: { by_epochs: 12 }
              as: NetworkAdmin
              captures: { epoch_ok: $.data.allocation_epoch_index }
          assert:
            - "by_epochs 0 returns 400 with error_id == ERR_INVALID_REQUEST"
            - "by_epochs 13 returns 400 with error_id == ERR_INVALID_REQUEST"
            - "by_epochs 12 is accepted and allocation_epoch_index == 12"

      - name: pathway_withdraw_from_not_adopted_returns_not_active
        claim_type: Invalid Transitions
        grounds:
          - state_machines.Practice.ACTIVE_to_NOT_ADOPTED
          - errors.ERR_PATHWAY_NOT_ACTIVE
          - entities.Practice.fields.pathway_steering_status
        distinguishing_aspect: "A withdraw attempted while the practice is NOT_ADOPTED is refused with ERR_PATHWAY_NOT_ACTIVE — the invalid-from rejection, not a silent no-op."
        test_recipe:
          setup:
            - "Practice P affiliated but never adopted the program; one PUBLISHED protocol exists; clock at 2026-09-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /networks"
              payload: { name: "Corner Case Oncology Network", network_agreement_code: "GPO-CC-10", shortage_allocation_method: "PRO_RATA_BASELINE", tier_market_share_boundaries: [ { tier: "TIER_2", min_trailing_12m_purchases_cents: 0 } ] }
              as: NetworkAdmin
              captures: { n_id: $.data.id }
            - call: "POST /networks/${n_id}/practices"
              payload: { practice_name: "Corner Case Cancer Care", practice_npi: "6543210990", state_code: "TX", drug_shortage_baseline_units: 100, pathway_steering_target_pct: 0.75, denial_ratio_threshold_pct: 0.20 }
              as: NetworkAdmin
              captures: { p_id: $.data.id }
          trigger:
            - call: "POST /networks/practices/${p_id}/pathways/withdraw"
              payload: {}
              as: PracticeAdmin
              as_user_id: "pa-corner"
              captures: { e_id: $.data.error_id }
          assert:
            - "the withdraw returns 409 with error_id == ERR_PATHWAY_NOT_ACTIVE"
            - "Practice.${p_id}.pathway_steering_status is still NOT_ADOPTED"

      - name: contract_terminate_while_affiliated_is_refused
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.AffiliationContract.ACTIVE_to_TERMINATED
          - errors.ERR_CONTRACT_NOT_TERMINABLE_WHILE_AFFILIATED
          - entities.Practice.fields.affiliation_status
        distinguishing_aspect: "An ACTIVE contract cannot be terminated outright while its practice is AFFILIATED — the unwind path must be used instead — so the terminal TERMINATED state is reachable only through complete-unwind for an affiliated practice."
        test_recipe:
          setup:
            - "Practice P affiliated with an ACTIVE contract; clock at 2026-09-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /networks"
              payload: { name: "Corner Case Oncology Network", network_agreement_code: "GPO-CC-11", shortage_allocation_method: "PRO_RATA_BASELINE", tier_market_share_boundaries: [ { tier: "TIER_2", min_trailing_12m_purchases_cents: 0 } ] }
              as: NetworkAdmin
              captures: { n_id: $.data.id }
            - call: "POST /networks/${n_id}/practices"
              payload: { practice_name: "Corner Case Cancer Care", practice_npi: "6543210991", state_code: "TX", drug_shortage_baseline_units: 100, pathway_steering_target_pct: 0.75, denial_ratio_threshold_pct: 0.20 }
              as: NetworkAdmin
              captures: { p_id: $.data.id, p_v: $.data.version }
            - call: "POST /networks/practices/${p_id}/affiliation-contracts"
