            - "after abandonment Insurer.${ins_id}.committed_capacity_cents == 0 and available_capacity_cents == 20000000 — the identity capacity == committed + available holds at both observations with no drift"
            - "BuyoutTranche.${t1_id}.tranche_status == ABANDONED with locked_premium_cents == null, lock_start_at == null, lock_expires_at == null, selected_quote_id == null, selected_insurer_id == null and selection_score_bp == null"
            - "AnnuityQuote.${q1_id}.quote_status == EXPIRED, not LOCKED — a lock released by abandonment must not leave a live quote behind"
