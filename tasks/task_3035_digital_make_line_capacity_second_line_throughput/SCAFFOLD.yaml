  # --- ProductionWindow ---
  - method: POST
    path: "/api/v1/stores/{storeId}/production-windows"
    description: "Open a pacing window for the store"
    roles: [StoreManager, PlatformAdmin]
    code: 201
    input: [interval_start, interval_end]
    output: ProductionWindow
    side_effects: ["digital_capacity snapshot; committed/completed = 0; status OPEN"]

  - method: GET
    path: "/api/v1/stores/{storeId}/production-windows"
    description: "List production windows"
    roles: [PlatformAdmin, StoreManager, GeneralManager, LineWorker]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: "ProductionWindow[]"
