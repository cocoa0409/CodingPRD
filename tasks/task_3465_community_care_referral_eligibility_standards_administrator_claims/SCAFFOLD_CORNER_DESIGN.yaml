  - section: validations
    instances:
      - name: call_missing_auth_header_returns_400
        claim_type: violation_to_error
        grounds:
          - "validations[priority=1]"
          - "errors[ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER]"
        distinguishing_aspect: "A request with no X-User-Role/X-User-ID headers fails priority-1 authentication with 400 before any role or existence check runs."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "GET /community-care/tpas/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              as: ""
              captures: { err: $.data.error_id }
          assert:
            - "400 with error_id == ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER (not 404 — auth precedes existence)"

      - name: tpa_admin_cannot_onboard_provider_to_other_tpa
        claim_type: violation_to_error
        grounds:
          - "validations[priority=4]"
          - "errors[ERR_OWNERSHIP_MISMATCH]"
        distinguishing_aspect: "An entity-backed TPAAdministrator (X-User-ID == tpa A) creating a provider under tpa B's path is rejected with ERR_OWNERSHIP_MISMATCH."
        test_recipe:
          setup: ["two TPAs exist"]
          setup_api_calls:
            - call: "POST /community-care/tpas"
              payload: { name: "TPA A", region_code: "RA" }
              as: PlatformAdmin
              captures: { tpa_a: $.data.id }
            - call: "POST /community-care/tpas"
              payload: { name: "TPA B", region_code: "RB" }
              as: PlatformAdmin
              captures: { tpa_b: $.data.id }
          trigger:
            - call: "POST /community-care/tpas/${tpa_b}/providers"
              payload: { name: "Intruder", service_codes: ["PT_EVAL"], contract_scheduling: "TPA", latitude: 40.1, longitude: -75.1 }
              as: TPAAdministrator
              as_user_id: "${tpa_a}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_OWNERSHIP_MISMATCH (403); GET /community-care/tpas/${tpa_b}/providers -> total_count == 0"

