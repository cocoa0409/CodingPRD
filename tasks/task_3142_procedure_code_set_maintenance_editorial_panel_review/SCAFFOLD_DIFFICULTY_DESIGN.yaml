  - rule_id: resource_temporal_overlap
    instances:
      - name: duplicate_delivery_reservation_overlaps_license_slot
        grounds:
          - validations[priority=30]
          - errors[ERR_DUPLICATE_DELIVERY_RESERVATION]
          - state_machines.ContentDeliveryOrder.PENDING_to_RESERVED
          - entities.LicensingAgreement.fields.agreement_status
        distinguishing_aspect: |
          Half-open semaphore semantics on a non-time axis: a licence holds at
          most one delivery order in RESERVED or READY, so a second reservation
          collides with the first despite the two requests carrying identical
          non-overlapping content, and the slot frees only on release.
        test_recipe:
          setup:
            - "One DistributionTerritory on the SITE method bound to an active licence"
            - "One LicensingAgreement of class PROVIDER with a bound territory"
            - "One ContentDeliveryOrder already RESERVED on that licence and not yet released"
            - "Logical clock at 2026-09-01T00:00:00Z"
          setup_api_calls:
            - call: "POST /cpt/distribution-territories"
              payload: { territory_code: "US-PACIFIC", method: "SITE", edi_payer_network: false, metadata_schema_version: "2026.1" }
              as: LicensingOfficer
              captures: { ter_m: $.data.id }
            - call: "POST /cpt/licensing-agreements"
              payload: { licensee_type: "PROVIDER", licensee_name: "Pacific Clinic", vendor_worldwide: false, expected_users: 18, sales_unit_count: 8, base_fee_cents: 0, territory_id: "${ter_m}" }
              as: LicensingOfficer
              captures: { lic_m: $.data.id }
            - call: "POST /cpt/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: EditorialStaff
            - call: "POST /cpt/licensing-agreements/${lic_m}/activations"
              payload: {}
              as: LicensingOfficer
              captures: { lic_m_v1: $.data.version }
            - call: "POST /cpt/content-delivery-orders"
              payload: { license_id: "${lic_m}", distribution_channel: "SITE", format_params: { electronic_format: "NONE", media: "NONE", version_qualifier: "2026.1", payer_identifier_qualifier: "NONE" }, payer_identifier: "PLACEHOLDER", expected_license_version: "${lic_m_v1}" }
              as: Licensee
              as_user_id: "${lic_m}"
              captures: { del_m: $.data.id, lic_m_v2: $.data.version }
          trigger:
            - call: "POST /cpt/content-delivery-orders"
              payload: { license_id: "${lic_m}", distribution_channel: "SITE", format_params: { electronic_format: "NONE", media: "NONE", version_qualifier: "2026.1", payer_identifier_qualifier: "NONE" }, payer_identifier: "PLACEHOLDER", expected_license_version: "${lic_m_v2}" }
              as: Licensee
              as_user_id: "${lic_m}"
              captures: { err6: $.data.error_id }
          assert:
            - "${err6} == ERR_DUPLICATE_DELIVERY_RESERVATION"
            - "the returned http status is 409"
            - "the count of ContentDeliveryOrder rows for licence ${lic_m} is 1"

      - name: territory_double_binding_overlaps_agreement_interval
        grounds:
          - validations[priority=31]
          - errors[ERR_TERRITORY_OCCUPIED]
          - state_machines.DistributionTerritory.OPEN_to_RESERVED
          - state_machines.DistributionTerritory.RESERVED_to_OPEN
        distinguishing_aspect: |
          Closed-interval occupancy with a method-dependent release rule: a
          territory may be bound by at most one non-terminated licence, and the
          occupancy interval closes only when that licence terminates, so a
          second binding collides while the first is live and succeeds after
          the first is terminated.
        test_recipe:
          setup:
            - "One DistributionTerritory on the SITE method already bound to an active licence"
            - "Logical clock at 2026-09-01T00:00:00Z"
          setup_api_calls:
            - call: "POST /cpt/distribution-territories"
              payload: { territory_code: "US-SOUTHWEST", method: "SITE", edi_payer_network: false, metadata_schema_version: "2026.1" }
