    output: ProductionJob
    side_effects: ["computes reserved_melt_tons and both refractory projections", "adds reserved_melt_tons to Furnace.reserved_pull_tons", "increments Furnace.version by 1"]
  - method: GET
    path: "/glass-plant/production-jobs"
    description: "List production jobs, filterable by every reference the job carries"
    roles: [PlantManager, PlantScheduler, BatchHouseTech, MoldEngineer, QualityEngineer]
    code: 200
    input: ["campaign_id?", "furnace_id?", "forming_machine_id?", "batch_recipe_id?", "bottle_design_id?", "mold_set_id?", "status?", "limit?", "offset?"]
    output: ProductionJob[]
    side_effects: []
  - method: GET
    path: "/glass-plant/production-jobs/{production_job_id}"
    description: "Read one production job"
    roles: [PlantManager, PlantScheduler, BatchHouseTech, MoldEngineer, QualityEngineer]
    code: 200
    input: []
