              as: AlumniRelationsStaff
              captures: { err9_id: $.data.error_id }
          assert:
            - "error_id == ERR_REFERENTIAL_INTEGRITY (P6 window-shape violation beats P7 ERR_WINDOW_OVERLAP even though [2026-05-15, 2026-05-10) would be tested against T1)"
            - "HTTP status 422"

  # ===========================================================================
  # Rule 6 — boundary_precision_check (different metrics / endpoints)
  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: engagement_tier_boundary_70_is_high
        grounds:
          - calculations.engagement_tier_thresholds
          - entities.AlumniRecord.fields.engagement_tier
        distinguishing_aspect: |
          Boundary on the engagement_score metric via a numeric threshold:
          HIGH requires score >= 70.00 (inclusive). An alumnus at exactly 70.00
          is HIGH; one at 69.99 is MEDIUM. Reached via the pledge-fulfill
          endpoint which recomputes the score.
        test_recipe:
          setup:
            - "Donor with lifetime giving arranged so fulfillment of a 70000000-cent pledge drives giving_points to exactly 100*0.30 contribution... simpler: pin giving so score lands exactly on 70.00 — give 70000/0.30*100000 => use single fulfilled pledge of X cents such that 0.30*min(100, X/100000*100) = 70.00 -> not reachable via giving alone (cap 30). Instead combine: 2 confirmed registrations (2*25=50 event points -> 25.00) + giving_points 100 (>= $1000 -> 30.00) + service 1 membership (20 -> ... capped contributions: 0.5*50 + 0.3*100 + 0.2*20 = 25+30+4 = 59.00). To land on exactly 70.00: 2 confirmed registrations (25.00) + giving 100 (30.00) + service_points 75? Service is per-membership 20. Use 2 registrations (25.00) + giving 100 (30.00) + 3 memberships... 0.2*60=12 -> 67.00. 2 reg + giving 100 + 3 memberships + 1 more registration (75 event pts -> 37.50): 37.5+30+12 = 79.50. To hit exactly 70.00: 1 registration (12.50) + giving 100 (30.00) + service 100 -> capped at 20 contribution... service cap is min(100, 20*count); 5 memberships -> 100 -> 20.00. 12.5+30+20 = 62.50. Exact 70.00: 2 reg (25.00) + giving 100 (30.00) + 3.75 memberships — not integral. Choose instead: 0 reg + giving 100 (30.00) + service... max 20.00 -> 50.00. Exact hit via 2 reg + giving 100 + 2 memberships (8.00) + ... 25+30+8 = 63.00. Simplest exact boundary: score 70.00 = 0.5*100 + 0.3*0 + 0.2*100 -> 4 confirmed registrations (event_points capped 100 -> 50.00) and 5 memberships (service 100 -> 20.00): 50+20 = 70.00 exactly."
            - "Use 4 confirmed registrations on an unlimited-tier event + 5 ENDED memberships (ended_reason != ALUMNUS_DECEASED) for the target alumnus; then a final recompute trigger (one more confirm) must show tier HIGH at exactly 70.00"
          setup_api_calls:
            - call: "POST /alumni/records"
              payload: { full_name: "Boundary Alum", primary_email: "boundary@x.com", class_year: 2001, degree_code: "BA" }
              as: AlumniRelationsStaff
