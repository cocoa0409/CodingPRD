  # §1.4 declares exactly four complexity_layers: optimistic_concurrency,
  # rate_threshold_triggers, cascading_side_effects and dual_variant_calculation.
  # The other twelve rows of the guide's layer table (soft_delete, idempotency,
  # bulk_operations, multi_tenancy, scheduled_actions, feature flags, ...) are not
  # active in this scaffold and are deliberately not emitted. Each of the three
  # §1.2.1 concurrency_rules gets its own instance, as the layer table requires.
  - section: cross_cutting_layers
    instances:
      - name: stale_competency_version_blocks_blueprint_publication
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.blueprint-create-stale-competency
          - errors[ERR_STALE_VERSION]
          - validations.priority_16_ERR_STALE_VERSION
        distinguishing_aspect: "The guarded parent is the Competency, not the blueprint being created: a prerequisite edge added between the client's read and its write moves the competency to version 2, so the create carrying version 1 is 412 ERR_STALE_VERSION and no blueprint row appears — replaying the identical body with version 2 then succeeds as BP-1, proving the rejection was purely the OCC token."
        test_recipe:
          setup:
            - "a PUBLISHED program with IT-101 and IT-201; the client read IT-201 at version 1"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /programs"
              payload: { code: "CBE-BSIT", title: "BS Information Technology" }
              as: Registrar
              captures: { prog_id: $.data.id }
            - call: "POST /competencies"
              payload: { program_id: "${prog_id}", code: "IT-101", title: "Relational Data Modeling", unit_value: 4, level: "FOUNDATION" }
              as: Registrar
              captures: { c1_id: $.data.id }
            - call: "POST /competencies"
              payload: { program_id: "${prog_id}", code: "IT-201", title: "Distributed Transactions", unit_value: 4, level: "CORE" }
              as: Registrar
              captures: { c2_id: $.data.id, c2_v1: $.data.version }
            - call: "POST /programs/${prog_id}/publish"
              payload: {}
              as: Registrar
          trigger:
