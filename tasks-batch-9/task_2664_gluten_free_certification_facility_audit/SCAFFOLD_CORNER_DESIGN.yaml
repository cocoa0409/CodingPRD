      - name: label_review_granting_a_richer_tier_than_requested_is_rejected
        claim_type: violation_to_error
        grounds:
          - validations.priority_29
          - errors.ERR_MARK_TIER_NOT_GRANTED
          - state_machines.Product.label_dimension.transitions.NOT_SUBMITTED_to_APPROVED.preconditions
        distinguishing_aspect: |
          The mark tier is not the reviewer's to choose: an APPROVE must grant exactly the tier
          the applicant requested, so granting PREMIUM on a STANDARD application is refused even
          though PREMIUM is a legal enum value and a stricter standard. The label dimension must
          stay NOT_SUBMITTED and mark_tier_granted must stay NONE.
        test_recipe:
          setup:
            - "One applicant, one facility and one product whose requested_mark_tier is STANDARD, label_status NOT_SUBMITTED and mark_tier_granted NONE."
          setup_api_calls:
            - call: "POST /gfco/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdministrator
