        grounds:
          - validations[priority=36]
          - errors[ERR_REQUESTER_SUSPENDED]
          - state_machines.Requester.ACTIVE_to_SUSPENDED
        distinguishing_aspect: "The request itself is a perfectly legal SUBMITTED row on an ACTIVE series; screening is refused with ERR_REQUESTER_SUSPENDED (409) purely because the owning Requester moved to SUSPENDED after the request was filed."
        test_recipe:
