  # ---------- lots and manifests ---------------------------------------------
  - method: POST
    path: "/liquidation/lots"
    description: "Seller creates a lot in DRAFT. The lot mirrors the linked BrandPolicy.de_branding_required into Lot.de_branding_required at creation."
    roles: [SellerOps]
    code: 201
    input: ["seller_id", "warehouse_id", "brand_policy_id?", "title", "category_code", "condition_grade"]
    output: Lot
    side_effects:
      - "sets lot_status DRAFT, all manifest aggregates 0, manifest_accuracy_score null"
      - "copies BrandPolicy.de_branding_required into Lot.de_branding_required (false when brand_policy_id is null)"

  - method: GET
    path: "/liquidation/lots/{id}"
    description: "Read one lot with its manifest aggregates, accuracy score and lifecycle state."
    roles: [PlatformAdmin, MarketplaceOps, SellerOps, TrustSafety, Buyer]
    code: 200
    input: []
    output: Lot
    side_effects: []

  - method: GET
    path: "/liquidation/lots"
    description: "List lots, optionally filtered by owning seller, origin warehouse, brand policy, lifecycle state or merchandise category."
    roles: [PlatformAdmin, MarketplaceOps, SellerOps, TrustSafety, Buyer]
    code: 200
    input: ["seller_id?", "warehouse_id?", "brand_policy_id?", "lot_status?", "category_code?", "limit?", "offset?"]
    output: Lot[]
    side_effects: []

  - method: POST
    path: "/liquidation/lots/{id}/manifest-lines"
    description: "Append a manifest line to a lot that is in DRAFT or MANIFEST_REJECTED. A line added to a rejected manifest returns the lot to DRAFT."
    roles: [SellerOps]
    code: 201
    input: [sku, unit_count, unit_retail_cents, declared_condition]
    output: ManifestLine
    side_effects:
      - "recomputes Lot.manifest_line_count, Lot.declared_unit_count and Lot.declared_retail_value_cents over ACTIVE lines"
      - "returns Lot.lot_status to DRAFT when it was MANIFEST_REJECTED"
      - "increments Lot.version by 1"

  - method: GET
    path: "/liquidation/lots/{id}/manifest-lines"
    description: "List the manifest lines of one lot (sub-resource read channel for ManifestLine.lot_id)."
    roles: [PlatformAdmin, MarketplaceOps, SellerOps, TrustSafety, Buyer]
    code: 200
    input: ["line_status?", "limit?", "offset?"]
    output: ManifestLine[]
    side_effects: []

  - method: GET
    path: "/liquidation/manifest-lines/{id}"
    description: "Read one manifest line."
    roles: [PlatformAdmin, MarketplaceOps, SellerOps, TrustSafety, Buyer]
    code: 200
    input: []
    output: ManifestLine
    side_effects: []

  - method: GET
    path: "/liquidation/manifest-lines"
    description: "List manifest lines, optionally filtered by owning lot or line status."
    roles: [PlatformAdmin, MarketplaceOps, SellerOps, TrustSafety, Buyer]
    code: 200
    input: ["lot_id?", "line_status?", "limit?", "offset?"]
    output: ManifestLine[]
    side_effects: []

  - method: POST
    path: "/liquidation/manifest-lines/{id}/voids"
    description: "Void a manifest line. The row is retained for audit but leaves every lot aggregate; the owning lot must be in DRAFT or MANIFEST_REJECTED."
    roles: [SellerOps]
    code: 200
    input: []
    output: ManifestLine
    side_effects:
      - "sets line_status VOIDED"
      - "recomputes Lot.manifest_line_count, Lot.declared_unit_count and Lot.declared_retail_value_cents; the conserved quantity DECLARED_UNIT_TOTAL is restored"
      - "returns Lot.lot_status to DRAFT when it was MANIFEST_REJECTED"

  - method: POST
    path: "/liquidation/lots/{id}/manifest-submissions"
    description: "Submit a DRAFT lot's manifest for review. Rejected when the lot has zero ACTIVE lines."
    roles: [SellerOps]
    code: 200
    input: []
    output: Lot
    side_effects:
      - "Lot.lot_status DRAFT -> MANIFEST_IN_REVIEW"
      - "increments Lot.version by 1"

  - method: POST
    path: "/liquidation/lots/{id}/manifest-reviews"
    description: "MarketplaceOps approves or rejects a submitted manifest. The reviewing X-User-ID is recorded and later blocks that same operator from deciding claims against this lot."
    roles: [MarketplaceOps]
    code: 200
    input: ["decision", "review_note?"]
    output: Lot
    side_effects:
      - "Lot.lot_status MANIFEST_IN_REVIEW -> MANIFEST_APPROVED on APPROVE, -> MANIFEST_REJECTED on REJECT"
      - "sets Lot.manifest_reviewed_by_user_id to the acting X-User-ID"
      - "increments Lot.version by 1"

  # ---------- listings -------------------------------------------------------
  - method: POST
    path: "/liquidation/lots/{id}/listings"
    description: "Create a DRAFT listing on a lot in one of the three sale formats. Format-specific price fields are required per format."
    roles: [SellerOps]
    code: 201
    input: ["listing_format", "resale_channel", "window_start_at", "window_end_at", "opening_bid_cents?", "reserve_price_cents?", "ask_price_cents?", "min_offer_cents?", "bid_increment_cents?", "de_branding_attested?"]
    output: Listing
    side_effects:
      - "sets listing_status DRAFT, effective_close_at = window_end_at, extension_count 0, bid_count 0, current_high_bid_cents null, reserve_met per calculations.reserve_met"

  - method: GET
    path: "/liquidation/listings/{id}"
    description: "Read one listing including current_high_bid_cents, current_high_bidder_id, reserve_met, effective_close_at, extension_count and version (the value an OCC proxy bid must echo)."
    roles: [PlatformAdmin, MarketplaceOps, SellerOps, TrustSafety, Buyer]
    code: 200
    input: []
    output: Listing
    side_effects: []

  - method: GET
    path: "/liquidation/listings"
    description: "List listings, optionally filtered by lot, status, format or resale channel."
    roles: [PlatformAdmin, MarketplaceOps, SellerOps, TrustSafety, Buyer]
    code: 200
    input: ["lot_id?", "listing_status?", "listing_format?", "resale_channel?", "limit?", "offset?"]
    output: Listing[]
    side_effects: []

  - method: GET
    path: "/liquidation/lots/{id}/listings"
    description: "List the listings of one lot (sub-resource read channel for Listing.lot_id)."
    roles: [PlatformAdmin, MarketplaceOps, SellerOps, TrustSafety, Buyer]
    code: 200
    input: ["listing_status?", "limit?", "offset?"]
    output: Listing[]
    side_effects: []

  - method: POST
    path: "/liquidation/listings/{id}/publications"
    description: "Publish a DRAFT listing. Runs the full brand-protection, embargo and seller-standing gate, then opens the listing and moves the lot to LISTED."
    roles: [SellerOps]
    code: 200
    input: []
    output: Listing
    side_effects:
      - "listing_status DRAFT -> OPEN and effective_close_at = window_end_at"
      - "Lot.lot_status MANIFEST_APPROVED | RELIST_PENDING -> LISTED"
      - "cascade: SellerAccount.listed_retail_value_cents -> gross_recovery_rate -> commission_tier and commission_rate_bps"
      - "increments Listing.version by 1"

  # ---------- bidding --------------------------------------------------------
  - method: POST
    path: "/liquidation/listings/{id}/bids"
    description: "Place a LIVE bid. On an AUCTION listing the amount must be at least the published minimum next bid; on a FIXED_PRICE listing the amount must equal ask_price_cents and the purchase closes the listing immediately."
    roles: [Buyer]
    code: 201
    input: [buyer_id, amount_cents]
    output: Bid
    side_effects:
      - "sets bid_type LIVE and ceiling_cents = amount_cents; the buyer's previous STANDING or WINNING bid on this listing becomes SUPERSEDED"
      - "AUCTION: re-runs calculations.proxy_bid_resolution, updating current_high_bid_cents, current_high_bidder_id, reserve_met, bid_count and the WINNING/STANDING statuses"
      - "AUCTION: applies calculations.anti_sniping_extension, possibly advancing effective_close_at and extension_count"
      - "FIXED_PRICE: bid_status becomes WON, listing_status becomes CLOSED_SOLD, Lot.lot_status becomes SOLD and one SaleOrder is created with sale_source FIXED_PRICE_PURCHASE (discover it through GET /liquidation/sale-orders?listing_id=...)"
      - "recomputes BuyerAccount.outstanding_exposure_cents per calculations.buyer_exposure"
      - "increments Listing.version by 1"

  - method: POST
    path: "/liquidation/listings/{id}/proxy-bids"
    description: "Place a PROXY bid with a hidden ceiling. Optimistically concurrent: the caller must echo the Listing.version it last read, because the resolved public price depends on every other bid already recorded."
    roles: [Buyer]
    code: 201
    input: [buyer_id, max_amount_cents, expected_listing_version]
    output: Bid
    side_effects:
      - "rejects a stale expected_listing_version with ERR_STALE_LISTING_VERSION (412) and creates nothing"
      - "sets bid_type PROXY, max_amount_cents and ceiling_cents = max_amount_cents; amount_cents is set to the resolved public price at placement"
      - "the buyer's previous STANDING or WINNING bid on this listing becomes SUPERSEDED"
      - "re-runs calculations.proxy_bid_resolution and calculations.anti_sniping_extension"
      - "recomputes BuyerAccount.outstanding_exposure_cents on the hidden ceiling, not on the public price"
      - "increments Listing.version by 1"

  - method: GET
    path: "/liquidation/bids/{id}"
    description: "Read one bid including ceiling_cents, bid_status and meets_reserve."
    roles: [PlatformAdmin, MarketplaceOps, SellerOps, TrustSafety, Buyer]
    code: 200
    input: []
    output: Bid
    side_effects: []

  - method: GET
    path: "/liquidation/bids"
    description: "List bids, optionally filtered by listing, buyer or status. Read channel for Bid.listing_id and Bid.buyer_id."
    roles: [PlatformAdmin, MarketplaceOps, SellerOps, TrustSafety, Buyer]
    code: 200
    input: ["listing_id?", "buyer_id?", "bid_status?", "bid_type?", "limit?", "offset?"]
    output: Bid[]
    side_effects: []

  - method: POST
    path: "/liquidation/listings/{id}/closures"
    description: "Close an AUCTION listing at or after its effective close. Sold when a qualifying bid exists and the reserve is met, otherwise no-sale."
    roles: [MarketplaceOps]
    code: 200
    input: []
    output: Listing
    side_effects:
      - "runs calculations.auction_close_outcome"
      - "CLOSED_SOLD: the WINNING bid becomes WON, all STANDING bids become LOST, Lot.lot_status becomes SOLD and one SaleOrder is created with sale_source AUCTION_CLOSE (discover it through GET /liquidation/sale-orders?listing_id=...)"
      - "CLOSED_NO_SALE: every qualifying bid becomes LOST, no order is created and Lot.lot_status becomes RELIST_PENDING"
      - "cascade: SellerAccount.gross_hammer_cents and sold_retail_value_cents -> gross_recovery_rate -> commission_tier and commission_rate_bps"
      - "recomputes BuyerAccount.outstanding_exposure_cents for every bidder"
      - "increments Listing.version by 1"

  # ---------- negotiations ---------------------------------------------------
  - method: POST
    path: "/liquidation/listings/{id}/negotiations"
    description: "Open a negotiation on a NEGOTIATED listing with the buyer's opening offer. Creates Offer round 1 and leaves the turn with the seller."
    roles: [Buyer]
    code: 201
    input: [buyer_id, opening_offer_cents]
    output: Negotiation
    side_effects:
      - "sets negotiation_status AWAITING_SELLER, round_number 1, current_offer_cents, current_offer_side BUYER, current_offer_expires_at = clock + OFFER_TTL_HOURS"
      - "creates the round-1 Offer (discover it through GET /liquidation/negotiations/{id}/offers)"
      - "recomputes BuyerAccount.outstanding_exposure_cents"

  - method: GET
    path: "/liquidation/negotiations/{id}"
    description: "Read one negotiation including round_number, current_offer_cents, current_offer_side, current_offer_expires_at and version (the value an OCC counter-offer must echo)."
    roles: [PlatformAdmin, MarketplaceOps, SellerOps, TrustSafety, Buyer]
    code: 200
    input: []
    output: Negotiation
    side_effects: []

  - method: GET
    path: "/liquidation/negotiations"
    description: "List negotiations, optionally filtered by listing, buyer or status. Read channel for Negotiation.listing_id and Negotiation.buyer_id."
    roles: [PlatformAdmin, MarketplaceOps, SellerOps, TrustSafety, Buyer]
    code: 200
    input: ["listing_id?", "buyer_id?", "negotiation_status?", "limit?", "offset?"]
    output: Negotiation[]
    side_effects: []

  - method: POST
    path: "/liquidation/negotiations/{id}/counter-offers"
    description: "Counter the standing offer. Only the awaited side may act, the standing offer must not have lapsed, the round cap must not be reached, and the caller must echo Negotiation.version."
    roles: [Buyer, SellerOps]
    code: 200
    input: [amount_cents, expected_negotiation_version]
    output: Negotiation
    side_effects:
      - "rejects a stale expected_negotiation_version with ERR_STALE_NEGOTIATION_VERSION (412) and creates no Offer"
      - "creates the next Offer with offer_side derived from the acting role and round_number = previous + 1"
      - "flips negotiation_status between AWAITING_SELLER and AWAITING_BUYER and refreshes current_offer_cents, current_offer_side and current_offer_expires_at"
      - "increments Negotiation.version by 1"

  - method: POST
    path: "/liquidation/negotiations/{id}/acceptances"
    description: "Accept the standing offer. Closes the listing sold, declines every sibling negotiation and creates the sale order."
    roles: [Buyer, SellerOps]
    code: 200
    input: []
    output: Negotiation
    side_effects:
      - "negotiation_status -> ACCEPTED and accepted_price_cents = current_offer_cents"
      - "every sibling Negotiation on the same listing still AWAITING_SELLER or AWAITING_BUYER -> DECLINED"
      - "Listing.listing_status -> CLOSED_SOLD, Lot.lot_status -> SOLD and one SaleOrder is created with sale_source NEGOTIATED_ACCEPTANCE (discover it through GET /liquidation/sale-orders?listing_id=...)"
      - "cascade: SellerAccount recovery aggregates -> gross_recovery_rate -> commission_tier"
      - "increments Negotiation.version by 1"

  - method: GET
    path: "/liquidation/negotiations/{id}/offers"
    description: "List the offer rounds of one negotiation in round order (sub-resource read channel for Offer.negotiation_id)."
    roles: [PlatformAdmin, MarketplaceOps, SellerOps, TrustSafety, Buyer]
    code: 200
    input: ["limit?", "offset?"]
    output: Offer[]
    side_effects: []

  - method: GET
    path: "/liquidation/offers/{id}"
    description: "Read one immutable offer round."
    roles: [PlatformAdmin, MarketplaceOps, SellerOps, TrustSafety, Buyer]
    code: 200
    input: []
    output: Offer
    side_effects: []

  - method: GET
    path: "/liquidation/offers"
    description: "List offers, optionally filtered by negotiation. Filtered read channel for Offer.negotiation_id."
    roles: [PlatformAdmin, MarketplaceOps, SellerOps, TrustSafety, Buyer]
    code: 200
    input: ["negotiation_id?", "offer_side?", "limit?", "offset?"]
    output: Offer[]
    side_effects: []

  # ---------- orders, payment and freight ------------------------------------
  - method: GET
    path: "/liquidation/sale-orders/{id}"
    description: "Read one sale order: both status dimensions, the whole money waterfall and the frozen seller settlement fields."
    roles: [PlatformAdmin, MarketplaceOps, SellerOps, TrustSafety, Buyer]
    code: 200
    input: []
    output: SaleOrder
    side_effects: []

  - method: GET
    path: "/liquidation/sale-orders"
    description: "List sale orders, optionally filtered by listing, buyer, payment status, logistics status or settlement basis. The only discovery channel for cascade-created orders, and the read channel for SaleOrder.listing_id and SaleOrder.buyer_id."
    roles: [PlatformAdmin, MarketplaceOps, SellerOps, TrustSafety, Buyer]
    code: 200
    input: ["listing_id?", "buyer_id?", "payment_status?", "logistics_status?", "settlement_basis?", "limit?", "offset?"]
    output: SaleOrder[]
    side_effects: []

  - method: POST
    path: "/liquidation/sale-orders/{id}/payments"
    description: "Buyer pays against the order balance. A partial payment is accepted; overpayment is refused."
    roles: [Buyer]
    code: 200
    input: [amount_cents]
    output: SaleOrder
    side_effects:
      - "increases amount_paid_cents, recomputes balance_due_cents and moves payment_status UNPAID -> PARTIALLY_PAID -> PAID"
      - "sets paid_at when balance_due_cents reaches 0"
      - "recomputes BuyerAccount.outstanding_exposure_cents"
      - "increments SaleOrder.version by 1"

  - method: POST
    path: "/liquidation/sale-orders/{id}/pickup-appointments"
    description: "Buyer books a dock window. Requires a fully paid order and a window ending at or before the pickup deadline; the door is chosen by the dock selector and the carrier's daily cap is enforced."
    roles: [Buyer]
    code: 201
    input: [warehouse_id, carrier_id, window_start_at, window_end_at, bol_number]
    output: PickupAppointment
    side_effects:
      - "runs calculations.dock_door_assignment and stores the chosen dock_door_number"
      - "sets appointment_status SCHEDULED and moves SaleOrder.logistics_status AWAITING_APPOINTMENT -> APPOINTMENT_SCHEDULED"
      - "increments SaleOrder.version by 1"

  - method: GET
    path: "/liquidation/pickup-appointments/{id}"
    description: "Read one pickup appointment including its assigned dock door."
    roles: [PlatformAdmin, MarketplaceOps, SellerOps, Buyer]
    code: 200
    input: []
    output: PickupAppointment
    side_effects: []

  - method: GET
    path: "/liquidation/pickup-appointments"
    description: "List pickup appointments, optionally filtered by order, warehouse, carrier or status. Read channel for PickupAppointment.sale_order_id, warehouse_id and carrier_id."
    roles: [PlatformAdmin, MarketplaceOps, SellerOps, Buyer]
    code: 200
    input: ["sale_order_id?", "warehouse_id?", "carrier_id?", "appointment_status?", "limit?", "offset?"]
    output: PickupAppointment[]
    side_effects: []

  - method: POST
    path: "/liquidation/pickup-appointments/{id}/completions"
    description: "MarketplaceOps completes the pickup with the carrier's actual freight invoice. This is the moment the order flips from the PROVISIONAL to the FINAL settlement variant and the seller payout is computed and frozen."
    roles: [MarketplaceOps]
    code: 200
    input: [actual_freight_cents, picked_up_unit_count]
    output: PickupAppointment
    side_effects:
      - "appointment_status SCHEDULED -> COMPLETED and completed_at is set"
      - "writes SaleOrder.actual_freight_cents, flips settlement_basis PROVISIONAL -> FINAL and recomputes pre_fee_total_cents, total_due_cents and balance_due_cents"
      - "SaleOrder.logistics_status -> PICKED_UP, picked_up_at set, claim_window_closes_at = completion instant + CLAIM_WINDOW_DAYS"
      - "runs calculations.seller_net_proceeds, freezing seller_commission_rate_bps, seller_commission_cents, seller_debranding_fee_cents and seller_net_proceeds_cents"
      - "cascade: SellerAccount.net_proceeds_cents -> net_recovery_rate"
      - "increments SaleOrder.version by 1"

  - method: POST
    path: "/liquidation/pickup-appointments/{id}/cancellations"
    description: "Cancel a scheduled appointment before its window opens, releasing the dock door and returning the order to AWAITING_APPOINTMENT."
    roles: [Buyer, MarketplaceOps]
    code: 200
    input: ["cancellation_reason?"]
    output: PickupAppointment
    side_effects:
      - "appointment_status SCHEDULED -> CANCELLED, freeing the dock-door interval for reuse"
      - "SaleOrder.logistics_status APPOINTMENT_SCHEDULED -> AWAITING_APPOINTMENT"
      - "increments SaleOrder.version by 1"

  # ---------- claims ---------------------------------------------------------
  - method: POST
    path: "/liquidation/sale-orders/{id}/claims"
    description: "Buyer files a manifest discrepancy claim against one manifest line of a picked-up order, inside the claim window. Two or more evidence items move the claim straight to UNDER_REVIEW."
    roles: [Buyer]
    code: 201
    input: ["manifest_line_id", "claim_type", "claimed_units", "evidence_urls?"]
    output: Claim
    side_effects:
      - "sets claim_status SUBMITTED, evidence_item_count = len(evidence_urls), refund_cents 0"
      - "advances claim_status to UNDER_REVIEW when evidence_item_count >= MIN_EVIDENCE_ITEMS"

  - method: GET
    path: "/liquidation/claims/{id}"
    description: "Read one claim including verified_units, evidence counters and refund_cents."
    roles: [PlatformAdmin, MarketplaceOps, SellerOps, TrustSafety, Buyer]
    code: 200
    input: []
    output: Claim
    side_effects: []

  - method: GET
    path: "/liquidation/claims"
    description: "List claims, optionally filtered by order, manifest line or status. Read channel for Claim.sale_order_id and Claim.manifest_line_id."
    roles: [PlatformAdmin, MarketplaceOps, SellerOps, TrustSafety, Buyer]
    code: 200
    input: ["sale_order_id?", "manifest_line_id?", "claim_status?", "limit?", "offset?"]
    output: Claim[]
    side_effects: []

  - method: POST
    path: "/liquidation/claims/{id}/evidence-items"
    description: "Buyer adds one evidence item. Closes the evidence-request loop by returning an EVIDENCE_REQUESTED claim to UNDER_REVIEW."
    roles: [Buyer]
    code: 200
    input: [evidence_url]
    output: Claim
    side_effects:
      - "increments evidence_item_count by 1"
      - "claim_status SUBMITTED -> UNDER_REVIEW once evidence_item_count >= MIN_EVIDENCE_ITEMS; EVIDENCE_REQUESTED -> UNDER_REVIEW"
      - "increments Claim.version by 1"

  - method: POST
    path: "/liquidation/claims/{id}/decisions"
    description: "MarketplaceOps decides the claim: APPROVE, PARTIALLY_APPROVE, DENY or REQUEST_EVIDENCE. The deciding operator must not be the operator who approved the lot's manifest."
    roles: [MarketplaceOps]
    code: 200
    input: ["decision", "verified_units?", "decision_note?"]
    output: Claim
    side_effects:
      - "REQUEST_EVIDENCE: claim_status -> EVIDENCE_REQUESTED and evidence_request_count += 1; no money moves"
      - "APPROVE | PARTIALLY_APPROVE: runs calculations.claim_refund, sets refund_cents, verified_units and decided_by_user_id"
      - "cascade: SaleOrder.claim_credit_cents and total_due_cents move, payment_status PAID -> REFUND_ISSUED, BuyerAccount.wallet_credit_cents rises by the same amount"
      - "cascade: ManifestLine.verified_unit_count, then Lot.manifest_accuracy_score, then SellerAccount.manifest_accuracy_avg and scored_lot_count, then possibly SellerAccount.account_status -> MANIFEST_PROBATION and commission_tier -> TIER_PROBATION"
      - "DENY: refund_cents stays 0 and no aggregate moves"
      - "increments Claim.version by 1"

  - method: POST
    path: "/liquidation/claims/{id}/reversals"
    description: "TrustSafety reverses an approved or partially approved claim, undoing every side effect of the decision. The reversing operator must not be the operator who decided the claim."
    roles: [TrustSafety]
    code: 200
    input: [reversal_reason]
    output: Claim
    side_effects:
      - "claim_status APPROVED | PARTIALLY_APPROVED -> REVERSED and reversed_by_user_id is set"
      - "compensation: SaleOrder.claim_credit_cents and BuyerAccount.wallet_credit_cents both fall by refund_cents; payment_status returns to PAID when claim_credit_cents reaches 0; BUYER_NET_OUTLAY returns to its pre-claim value"
      - "compensation: Lot.manifest_accuracy_score, SellerAccount.manifest_accuracy_avg, scored_lot_count, account_status and commission_tier are all restored"
      - "increments Claim.version by 1"

  # ---------- sweeps and analytics -------------------------------------------
  - method: POST
    path: "/liquidation/pickup-deadline-sweeps"
    description: "Abandon every order whose pickup deadline has strictly passed while it was still awaiting or holding an appointment. Returns the orders the sweep changed."
    roles: [MarketplaceOps]
    code: 200
    input: []
    output: SaleOrder[]
    side_effects:
      - "for each order with logistics_status IN {AWAITING_APPOINTMENT, APPOINTMENT_SCHEDULED} and current clock > pickup_deadline_at: logistics_status -> ABANDONED and abandoned_at is set"
      - "any SCHEDULED PickupAppointment on such an order becomes CANCELLED, freeing its dock interval"
      - "cascade: Lot.lot_status SOLD -> RELIST_PENDING, then SellerAccount.gross_hammer_cents and sold_retail_value_cents, then gross_recovery_rate, then commission_tier"
      - "recomputes BuyerAccount.outstanding_exposure_cents for each affected buyer"
      - "orders already PICKED_UP or ABANDONED are skipped"

  - method: POST
    path: "/liquidation/payment-late-fee-sweeps"
    description: "Assess the one-time late fee on every order whose payment term has strictly passed with a balance outstanding. Returns the orders the sweep changed."
    roles: [MarketplaceOps]
    code: 200
    input: []
    output: SaleOrder[]
    side_effects:
      - "for each order with balance_due_cents > 0, late_fee_cents == 0 and current clock > payment_due_at: late_fee_cents = round_half_up(pre_fee_total_cents * LATE_FEE_BPS / 10000), then total_due_cents and balance_due_cents are recomputed"
      - "the fee is assessed at most once per order and is not re-derived when the order later settles FINAL"
      - "recomputes BuyerAccount.outstanding_exposure_cents"

  - method: GET
    path: "/liquidation/recovery-analytics"
    description: "Computed read of the dual-variant recovery rates for one seller, optionally sliced by merchandise category or resale channel. group_by is one of {NONE, CATEGORY, CHANNEL} and defaults to NONE, in which case groups is an empty list. Nothing is persisted."
    roles: [PlatformAdmin, MarketplaceOps, SellerOps]
    code: 200
    input: ["seller_id", "group_by?", "category_code?", "resale_channel?"]
    output: "{ seller_id: uuid, group_by: string, gross_hammer_cents: integer, listed_retail_value_cents: integer, gross_recovery_rate: decimal, net_proceeds_cents: integer, sold_retail_value_cents: integer, net_recovery_rate: decimal, groups: [ { key: string, gross_hammer_cents: integer, listed_retail_value_cents: integer, gross_recovery_rate: decimal, net_proceeds_cents: integer, sold_retail_value_cents: integer, net_recovery_rate: decimal } ] }"
    side_effects: []

  # ---------- test-driving endpoint ------------------------------------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical clock to an arbitrary UTC instant so window, deadline, expiry and sweep rules are deterministic. Before any call the logical clock reads exactly 2026-08-01T00:00:00Z and MUST NOT fall back to wall-clock time."
    roles: [PlatformAdmin, MarketplaceOps, SellerOps, TrustSafety, Buyer]
    code: 200
    input: [current_utc]
    output: "{ current_utc }"
    side_effects:
      - "every subsequent request evaluates windows, deadlines, expiries and sweeps against this instant"
      - "no business row is mutated by the call itself"

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:

  # --- authentication and authorization ---------------------------------------
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-ID or X-User-Role header missing or empty"
  - id: ERR_ROLE_NOT_PERMITTED
    http: 403
    condition: "X-User-Role is not listed in the endpoint's roles[]"
  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "a SellerOps caller acts on another seller's lot/listing, or a Buyer caller acts on another buyer's bid, negotiation, order, appointment or claim"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "the MarketplaceOps operator deciding a claim is the same X-User-ID that reviewed the lot's manifest, or the TrustSafety operator reversing a claim is the same X-User-ID that decided it"

  # --- not found --------------------------------------------------------------
  - id: ERR_SELLER_NOT_FOUND
    http: 404
    condition: "seller_id in a path or body does not resolve to a SellerAccount"
  - id: ERR_BUYER_NOT_FOUND
    http: 404
    condition: "buyer_id in a path or body does not resolve to a BuyerAccount"
  - id: ERR_WAREHOUSE_NOT_FOUND
    http: 404
    condition: "warehouse_id in a path or body does not resolve to a Warehouse"
  - id: ERR_CARRIER_NOT_FOUND
    http: 404
    condition: "carrier_id in a body does not resolve to a Carrier"
  - id: ERR_BRAND_POLICY_NOT_FOUND
    http: 404
    condition: "brand_policy_id in a body does not resolve to a BrandPolicy"
  - id: ERR_LOT_NOT_FOUND
    http: 404
    condition: "the lot id in a path or body does not resolve to a Lot"
  - id: ERR_MANIFEST_LINE_NOT_FOUND
    http: 404
    condition: "the manifest line id in a path or body does not resolve to a ManifestLine"
  - id: ERR_LISTING_NOT_FOUND
    http: 404
    condition: "the listing id in a path or body does not resolve to a Listing"
  - id: ERR_NEGOTIATION_NOT_FOUND
    http: 404
    condition: "the negotiation id in a path does not resolve to a Negotiation"
  - id: ERR_SALE_ORDER_NOT_FOUND
    http: 404
    condition: "the sale order id in a path does not resolve to a SaleOrder"
  - id: ERR_APPOINTMENT_NOT_FOUND
    http: 404
    condition: "the pickup appointment id in a path does not resolve to a PickupAppointment"
  - id: ERR_CLAIM_NOT_FOUND
    http: 404
    condition: "the claim id in a path does not resolve to a Claim"

  # --- request shape ----------------------------------------------------------
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "a required input field is missing, an enum value is outside its declared set, an integer is outside its declared range, window_end_at <= window_start_at, a format-conditional price field is absent, or a pagination parameter is out of bounds"

  # --- optimistic concurrency -------------------------------------------------
  - id: ERR_STALE_LISTING_VERSION
    http: 412
    condition: "expected_listing_version does not equal Listing.version on POST /liquidation/listings/{id}/proxy-bids"
  - id: ERR_STALE_NEGOTIATION_VERSION
    http: 412
    condition: "expected_negotiation_version does not equal Negotiation.version on POST /liquidation/negotiations/{id}/counter-offers"

  # --- state of the target resource -------------------------------------------
  - id: ERR_LOT_STATE_INVALID
    http: 409
    condition: "Lot.lot_status is not a legal from-state for the requested manifest operation"
  - id: ERR_LISTING_STATE_INVALID
    http: 409
    condition: "Listing.listing_status is not a legal from-state for publication, bidding, offering or closing"
  - id: ERR_NEGOTIATION_STATE_INVALID
    http: 409
    condition: "Negotiation.negotiation_status is ACCEPTED or DECLINED and can no longer be countered or accepted"
  - id: ERR_NOT_YOUR_TURN
    http: 409
    condition: "the acting side is not the side the negotiation is awaiting"
  - id: ERR_ORDER_PAYMENT_STATE_INVALID
    http: 409
    condition: "SaleOrder.payment_status is PAID or REFUND_ISSUED and cannot accept another payment"
  - id: ERR_ORDER_LOGISTICS_STATE_INVALID
    http: 409
    condition: "SaleOrder.logistics_status forbids the operation - scheduling on an order that is not AWAITING_APPOINTMENT, or filing a claim on an order that is not PICKED_UP"
  - id: ERR_APPOINTMENT_STATE_INVALID
    http: 409
    condition: "PickupAppointment.appointment_status is COMPLETED or CANCELLED"
  - id: ERR_CLAIM_STATE_INVALID
    http: 409
    condition: "Claim.claim_status is not a legal from-state for the requested decision, evidence submission or reversal"
  - id: ERR_BUYER_QUALIFICATION_STATE_INVALID
    http: 409
    condition: "BuyerAccount.qualification_status is not a legal from-state for the requested qualification decision; REJECTED is terminal"

  # --- state of a different entity (cross-entity guards) ----------------------
  - id: ERR_LOT_MANIFEST_NOT_APPROVED
    http: 409
    condition: "the listing's lot is not in MANIFEST_APPROVED or RELIST_PENDING at publication time"
  - id: ERR_SELLER_NOT_ACTIVE
    http: 409
    condition: "the lot's SellerAccount.account_status is MANIFEST_PROBATION at publication time"
  - id: ERR_BUYER_NOT_QUALIFIED
    http: 409
    condition: "BuyerAccount.qualification_status is not QUALIFIED when the buyer tries to bid, offer, counter or purchase"
  - id: ERR_ORDER_NOT_PAID
    http: 409
    condition: "SaleOrder.payment_status is not PAID when a pickup appointment is requested"
  - id: ERR_PAYMENT_WINDOW_CLOSED
    http: 409
    condition: "a payment is attempted on an order whose logistics_status is ABANDONED"
  - id: ERR_LINE_VOIDED
    http: 409
    condition: "the claimed ManifestLine.line_status is VOIDED"

  # --- brand protection and geographic safety ---------------------------------
  - id: ERR_CHANNEL_NOT_PERMITTED
    http: 422
    condition: "Listing.resale_channel is absent from the lot's BrandPolicy.permitted_channels"
  - id: ERR_DEBRANDING_ATTESTATION_REQUIRED
    http: 422
    condition: "Lot.de_branding_required is true but the listing's de_branding_attested is false"
  - id: ERR_BUYER_STATE_PROHIBITED
    http: 422
    condition: "BuyerAccount.state_code appears in the lot's BrandPolicy.prohibited_buyer_state_codes"
  - id: ERR_SHILL_BIDDING_PROHIBITED
    http: 422
    condition: "the bidding BuyerAccount.tax_id equals the lot's SellerAccount.tax_id"
  - id: ERR_BRAND_EMBARGO_ACTIVE
    http: 422
    condition: "the publication window intersects the lot's BrandPolicy embargo interval, both ends inclusive"

  # --- temporal ---------------------------------------------------------------
  - id: ERR_LISTING_WINDOW_NOT_OPEN
    http: 422
    condition: "the current logical clock is before Listing.window_start_at"
  - id: ERR_LISTING_WINDOW_CLOSED
    http: 422
    condition: "the current logical clock is at or after Listing.effective_close_at"
  - id: ERR_AUCTION_NOT_CLOSABLE
    http: 422
    condition: "a closure is requested before Listing.effective_close_at"
  - id: ERR_OFFER_EXPIRED
    http: 422
    condition: "a counter-offer or acceptance arrives at or after Negotiation.current_offer_expires_at"
  - id: ERR_PICKUP_DEADLINE_PASSED
    http: 422
    condition: "the requested dock window ends after SaleOrder.pickup_deadline_at"
  - id: ERR_APPOINTMENT_NOT_STARTED
    http: 422
    condition: "a completion is requested before PickupAppointment.window_start_at"
  - id: ERR_CLAIM_WINDOW_CLOSED
    http: 422
    condition: "a claim is filed after SaleOrder.claim_window_closes_at"
  - id: ERR_RESALE_CERTIFICATE_EXPIRED
    http: 422
    condition: "a QUALIFY decision is attempted while resale_certificate_expires_on is on or before the current logical clock's UTC date"

  # --- capacity and interval occupation ---------------------------------------
  - id: ERR_DOCK_CAPACITY_EXHAUSTED
    http: 422
    condition: "no dock door at the warehouse is free for the requested window under the turnaround buffer"
  - id: ERR_CARRIER_DAY_CAPACITY_FULL
    http: 422
    condition: "the carrier already holds Carrier.daily_pickup_capacity SCHEDULED appointments on the requested UTC calendar date"

  # --- remaining structural constraints ---------------------------------------
  - id: ERR_MANIFEST_EMPTY
    http: 422
    condition: "a manifest submission is attempted while the lot has zero ACTIVE manifest lines"
  - id: ERR_LISTING_ALREADY_OPEN
    http: 422
    condition: "another Listing on the same lot is already OPEN"
  - id: ERR_DUPLICATE_NEGOTIATION
    http: 422
    condition: "the buyer already has a live negotiation on this listing"
  - id: ERR_NEGOTIATION_ROUND_LIMIT
    http: 422
    condition: "a counter-offer would exceed MAX_NEGOTIATION_ROUNDS (4)"
  - id: ERR_EVIDENCE_REQUEST_LIMIT
    http: 422
    condition: "a REQUEST_EVIDENCE decision is attempted when evidence_request_count already equals MAX_EVIDENCE_REQUESTS (2)"
  - id: ERR_EVIDENCE_INSUFFICIENT
    http: 422
    condition: "a decision other than REQUEST_EVIDENCE is attempted while evidence_item_count is below MIN_EVIDENCE_ITEMS (2)"
  - id: ERR_VERIFIED_UNITS_MISMATCH
    http: 422
    condition: "verified_units is inconsistent with the decision - not equal to claimed_units on APPROVE, not strictly inside (0, claimed_units) on PARTIALLY_APPROVE, or not 0 on DENY"
  - id: ERR_CLAIMED_UNITS_EXCEED_LINE
    http: 422
    condition: "claimed_units exceeds ManifestLine.unit_count"
  - id: ERR_LINE_NOT_ON_ORDER_LOT
    http: 422
    condition: "the claimed manifest line belongs to a different lot than the order's listing"
  - id: ERR_WAREHOUSE_MISMATCH
    http: 422
    condition: "the appointment's warehouse_id differs from the lot's warehouse_id"
  - id: ERR_BUSINESS_NOT_VERIFIED
    http: 422
    condition: "a QUALIFY decision is attempted without business_verified == true"
  - id: ERR_DUPLICATE_TAX_ID
    http: 422
    condition: "the tax_id is already held by another account of the same kind"
  - id: ERR_DUPLICATE_SCAC
    http: 422
    condition: "the scac_code is already held by another Carrier"

  # --- money ------------------------------------------------------------------
  - id: ERR_RESERVE_BELOW_OPENING
    http: 422
    condition: "reserve_price_cents is below opening_bid_cents on an AUCTION listing"
  - id: ERR_BID_BELOW_MINIMUM
    http: 422
    condition: "a LIVE auction bid is below the published minimum next bid"
  - id: ERR_PROXY_MAX_BELOW_MINIMUM
    http: 422
    condition: "max_amount_cents is below the published minimum next bid"
  - id: ERR_FIXED_PRICE_MISMATCH
    http: 422
    condition: "a bid on a FIXED_PRICE listing does not equal ask_price_cents exactly"
  - id: ERR_OFFER_BELOW_MINIMUM
    http: 422
    condition: "an opening offer or counter-offer is below Listing.min_offer_cents"
  - id: ERR_CREDIT_LIMIT_EXCEEDED
    http: 422
    condition: "the exposure the request would create exceeds approved_credit_limit_cents + wallet_credit_cents"
  - id: ERR_PAYMENT_EXCEEDS_BALANCE
    http: 422
    condition: "amount_cents is below 1 or above SaleOrder.balance_due_cents"

# =============================================================================
# §1.7 RBAC Matrix
# role_model: segregation_of_duties
# =============================================================================
roles:

  - name: PlatformAdmin
    description: "Marketplace operator who provisions reference data: seller accounts, buyer accounts, warehouses, carriers, brand policies and buyer credit limits. Never touches a lot, a bid or a claim."
    identity: "opaque"
    exclusive_operations:
      - "POST /liquidation/seller-accounts"
      - "POST /liquidation/buyer-accounts"
      - "POST /liquidation/buyer-accounts/{id}/credit-limits"
      - "POST /liquidation/warehouses"
      - "POST /liquidation/carriers"
      - "POST /liquidation/brand-policies"
    shared_operations:
      - "every GET read endpoint"
      - "GET /liquidation/recovery-analytics"
      - "POST /_clock/set_current_utc"

  - name: SellerOps
    description: "Acts as one liquidating seller: builds lots and manifests, creates and publishes listings, and negotiates on its own NEGOTIATED listings."
    identity: "entity_backed:SellerAccount"
    exclusive_operations:
      - "POST /liquidation/lots"
      - "POST /liquidation/lots/{id}/manifest-lines"
      - "POST /liquidation/manifest-lines/{id}/voids"
      - "POST /liquidation/lots/{id}/manifest-submissions"
      - "POST /liquidation/lots/{id}/listings"
      - "POST /liquidation/listings/{id}/publications"
    shared_operations:
      - "POST /liquidation/negotiations/{id}/counter-offers (as the SELLER side)"
      - "POST /liquidation/negotiations/{id}/acceptances (when the negotiation awaits the seller)"
      - "GET /liquidation/recovery-analytics (restricted to its own seller_id)"
      - "read endpoints for lots, manifest lines, listings, bids, negotiations, offers, orders and appointments"
      - "POST /_clock/set_current_utc"
    ownership_rule: "X-User-ID must equal Lot.seller_id for every lot-scoped write, and the lot behind the listing or negotiation for listing- and negotiation-scoped writes; otherwise ERR_NOT_RESOURCE_OWNER."

  - name: Buyer
    description: "Acts as one qualified resale buyer: bids, places proxy bids, negotiates, pays, books freight and files manifest discrepancy claims."
    identity: "entity_backed:BuyerAccount"
    exclusive_operations:
      - "POST /liquidation/listings/{id}/bids"
      - "POST /liquidation/listings/{id}/proxy-bids"
      - "POST /liquidation/listings/{id}/negotiations"
      - "POST /liquidation/sale-orders/{id}/payments"
      - "POST /liquidation/sale-orders/{id}/pickup-appointments"
      - "POST /liquidation/sale-orders/{id}/claims"
      - "POST /liquidation/claims/{id}/evidence-items"
    shared_operations:
      - "POST /liquidation/negotiations/{id}/counter-offers (as the BUYER side)"
      - "POST /liquidation/negotiations/{id}/acceptances (when the negotiation awaits the buyer)"
      - "POST /liquidation/pickup-appointments/{id}/cancellations"
      - "read endpoints for lots, manifest lines, listings, bids, negotiations, offers, orders, appointments and claims"
      - "POST /_clock/set_current_utc"
    ownership_rule: "X-User-ID must equal the buyer_id of the bid, negotiation, order, appointment or claim being written; otherwise ERR_NOT_RESOURCE_OWNER."

  - name: MarketplaceOps
    description: "Operations desk: reviews manifests, closes auctions, completes pickups, decides manifest discrepancy claims and runs the two sweeps. Cannot reverse its own claim decisions."
    identity: "opaque"
    exclusive_operations:
      - "POST /liquidation/lots/{id}/manifest-reviews"
      - "POST /liquidation/listings/{id}/closures"
      - "POST /liquidation/pickup-appointments/{id}/completions"
      - "POST /liquidation/claims/{id}/decisions"
      - "POST /liquidation/pickup-deadline-sweeps"
      - "POST /liquidation/payment-late-fee-sweeps"
    shared_operations:
      - "POST /liquidation/pickup-appointments/{id}/cancellations"
      - "every GET read endpoint"
      - "GET /liquidation/recovery-analytics (any seller_id)"
      - "POST /_clock/set_current_utc"
    segregation_rule: "The X-User-ID that performed POST /liquidation/lots/{id}/manifest-reviews on a lot MUST NOT be the X-User-ID that performs POST /liquidation/claims/{id}/decisions on a claim against that lot; violation is ERR_SEGREGATION_OF_DUTIES (403) at validation priority 5, ahead of every claim state and evidence check."

  - name: TrustSafety
    description: "Compliance desk: qualifies, suspends and reinstates buyers, and reverses claim decisions. Holds no operational power over lots, listings or orders."
    identity: "opaque"
    exclusive_operations:
      - "POST /liquidation/buyer-accounts/{id}/qualification-decisions"
      - "POST /liquidation/claims/{id}/reversals"
    shared_operations:
      - "read endpoints for seller accounts, buyer accounts, brand policies, lots, manifest lines, listings, bids, negotiations, offers, orders and claims"
      - "POST /_clock/set_current_utc"
    segregation_rule: "The X-User-ID recorded in Claim.decided_by_user_id MUST NOT be the X-User-ID that performs POST /liquidation/claims/{id}/reversals on that claim; violation is ERR_SEGREGATION_OF_DUTIES (403)."
