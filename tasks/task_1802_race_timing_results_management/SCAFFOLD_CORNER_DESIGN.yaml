          assert:
            - "Stale publish (expected race_v - 1): err1 == ERR_STALE_RACE_VERSION, HTTP 412"
            - "Fresh publish succeeds: Race.version == race_v + 1 and status PROVISIONAL_PUBLISHED"
            - "Stale adjudicate (expected pre-publish race_v after publish bumped it): err2 == ERR_STALE_RACE_VERSION, HTTP 412"
            - "Fresh adjudicate with post-publish version succeeds: Correction APPROVED, Race AMENDMENT_OPEN, version == race_v + 2"
      - name: cascading_side_effects_end_to_end
        claim_type: cascading_side_effects
        grounds: [complexity_profile.complexity_layers]
        excluded_because:
          difficulty_instance: correction_cascade_to_certification_revocation
          rationale: "5-hop correction->read->result->award->certification chain asserted hop-by-hop with literals."
      - name: dual_variant_layer_coverage
        claim_type: dual_variant_calculation
        grounds: [complexity_profile.complexity_layers]
        excluded_because:
          difficulty_instance: gun_vs_chip_award_divergence
          rationale: "Gun vs chip divergence and live projection vs actual standing both asserted in §1.8."
      - name: rate_threshold_layer_coverage
        claim_type: rate_threshold_triggers
        grounds: [complexity_profile.complexity_layers]
        excluded_because:
          difficulty_instance: course_cut_floor_exact_equality
          rationale: "Pace floor and protest-window thresholds asserted at exact boundaries in §1.8 (and qualifying-standard boundary in calculations section)."

  - section: consistency_model
    instances:
      - name: mutation_visible_in_same_response
        claim_type: immediate
        grounds: [complexity_profile.consistency_model]
        distinguishing_aspect: "Immediate consistency: create and transition responses carry the post-mutation state (DRAFT then REGISTRATION_OPEN with version bumps) without any re-read."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /race-timing/races"
              payload: { name: "Immediate 5K", race_date: "2026-08-01T00:00:00Z", distance_km: 5.0, course_type: UNCERTIFIED_COURSE, course_time_limit_minutes: 90 }
              as: RaceDirector
              captures: { race_id: $.data.id }
            - { call: "POST /race-timing/races/${race_id}/open-registration", as: RaceDirector, captures: { st: $.data.status, v: $.data.version } }
          assert:
            - "Create response: status == DRAFT, version == 1 (no re-GET needed)"
            - "open-registration response: status == REGISTRATION_OPEN, version == 2 in the same response"
