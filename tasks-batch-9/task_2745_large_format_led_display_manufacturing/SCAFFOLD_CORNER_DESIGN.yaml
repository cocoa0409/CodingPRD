  - section: errors
    instances:

      - name: every_collection_reports_its_own_not_found_code
        claim_type: error_triggerability
        grounds:
          - errors.ERR_REVISION_NOT_FOUND
          - errors.ERR_CABINET_NOT_FOUND
          - errors.ERR_RUN_NOT_FOUND
          - errors.ERR_VISIT_NOT_FOUND
          - errors.ERR_CASE_NOT_FOUND
          - errors.ERR_REFERENCE_NOT_FOUND
          - validations[priority=4]
          - validations[priority=6]
          - validations[priority=9]
          - validations[priority=10]
          - validations[priority=12]
        distinguishing_aspect: |
          Ten single-id reads against an empty store must produce SEVEN different
          error_ids: six entity-specific codes plus one shared
          ERR_REFERENCE_NOT_FOUND that covers the three catalogue collections
          (display models, burn-in chambers, commissioning crews) precisely because
          they are the "non-entity-specific parents" of §1.4 priority 4. A single
          generic 404 handler — the natural framework default — passes the status
          code assertion on all ten and the error_id assertion on none, and an
          implementation that gives the catalogues their own codes fails exactly
          three.
        test_recipe:
          setup:
            - "The store is empty apart from the logical clock; 00000000-0000-0000-0000-0000000000ff resolves to nothing in any collection."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00.000Z" }
              as: PlantAdmin
              as_user_id: "adm-1"
          trigger:
            - call: "GET /projects/00000000-0000-0000-0000-0000000000ff"
              as: DesignEngineer
              as_user_id: "eng-1"
              captures: { e_pj: $.data.error_id }
            - call: "GET /drawing-revisions/00000000-0000-0000-0000-0000000000ff"
              as: DesignEngineer
              as_user_id: "eng-1"
              captures: { e_rev: $.data.error_id }
            - call: "GET /cabinets/00000000-0000-0000-0000-0000000000ff"
              as: ProductionOperator
              as_user_id: "op-1"
              captures: { e_cab: $.data.error_id }
            - call: "GET /modules/00000000-0000-0000-0000-0000000000ff"
              as: ProductionOperator
              as_user_id: "op-1"
              captures: { e_mod: $.data.error_id }
            - call: "GET /burn-in-runs/00000000-0000-0000-0000-0000000000ff"
              as: QAEngineer
              as_user_id: "qa-1"
              captures: { e_run: $.data.error_id }
            - call: "GET /commissioning-visits/00000000-0000-0000-0000-0000000000ff"
              as: FieldEngineer
              as_user_id: "crew-unknown"
              captures: { e_visit: $.data.error_id }
            - call: "GET /service-contracts/00000000-0000-0000-0000-0000000000ff"
              as: ServiceManager
              as_user_id: "svc-1"
              captures: { e_sc: $.data.error_id }
            - call: "GET /service-cases/00000000-0000-0000-0000-0000000000ff"
              as: ServiceManager
              as_user_id: "svc-1"
              captures: { e_case: $.data.error_id }
            - call: "GET /display-models/00000000-0000-0000-0000-0000000000ff"
              as: PlantAdmin
              as_user_id: "adm-1"
              captures: { e_dm: $.data.error_id }
            - call: "GET /burn-in-chambers/00000000-0000-0000-0000-0000000000ff"
              as: PlantAdmin
              as_user_id: "adm-1"
              captures: { e_ch: $.data.error_id }
            - call: "GET /commissioning-crews/00000000-0000-0000-0000-0000000000ff"
              as: PlantAdmin
              as_user_id: "adm-1"
              captures: { e_crew: $.data.error_id }
          assert:
            - "all eleven triggers -> 404"
            - "${e_pj} == 'ERR_PROJECT_NOT_FOUND'"
            - "${e_rev} == 'ERR_REVISION_NOT_FOUND'"
            - "${e_cab} == 'ERR_CABINET_NOT_FOUND'"
            - "${e_mod} == 'ERR_MODULE_NOT_FOUND'"
            - "${e_run} == 'ERR_RUN_NOT_FOUND'"
            - "${e_visit} == 'ERR_VISIT_NOT_FOUND': the visit read is open to every role, so the unknown crew id in X-User-ID does not turn this into ERR_CREW_NOT_ASSIGNED (priority 13 guards only arrive/calibrate/sign-off)"
            - "${e_sc} == 'ERR_CONTRACT_NOT_FOUND'"
            - "${e_case} == 'ERR_CASE_NOT_FOUND'"
            - "${e_dm} == ${e_ch} == ${e_crew} == 'ERR_REFERENCE_NOT_FOUND': the three catalogue collections share the generic code by §1.4 priority 4"
            - "every response body carries both error_id and message, and no response leaks a stack trace or a database identifier"

      - name: missing_or_unknown_auth_headers_are_unauthenticated
        claim_type: error_triggerability
        grounds:
          - errors.ERR_UNAUTHENTICATED
          - validations[priority=1]
          - validations[priority=2]
        distinguishing_aspect: |
          Priority 1 fires before everything, including the role check at 2 and the
          shape check at 3, and it has three distinct causes that must all land on
          401 rather than 403: no X-User-Role header at all, an X-User-Role that is
          not one of the seven declared roles, and a recognised role with no
          X-User-ID. The last is the one implementations miss — they authenticate on
          the role header alone and only notice the missing user id later, when a
          segregation-of-duties or crew-identity rule needs it. The recipe also
          pairs an absent header with a malformed body to show 401 outranks 400.
        test_recipe:
          setup:
            - "No entities are needed: the header gate is evaluated before any id or field is read."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00.000Z" }
              as: PlantAdmin
              as_user_id: "adm-1"
          trigger:
            - call: "GET /display-models"
              as: "<omit the X-User-Role header entirely>"
              as_user_id: "adm-1"
              captures: { e_norole: $.data.error_id }
            - call: "GET /display-models"
              as: PlantAdmin
              as_user_id: "<omit the X-User-ID header entirely>"
              captures: { e_nouser: $.data.error_id }
            - call: "GET /display-models"
              as: "PlantOperator"
              as_user_id: "adm-1"
              captures: { e_badrole: $.data.error_id }
            - call: "POST /display-models"
              payload: { name: "Nope", pixel_pitch_mm: "not-a-number" }
              as: "<omit the X-User-Role header entirely>"
              as_user_id: "adm-1"
              captures: { e_first: $.data.error_id }
          assert:
            - "trigger call 1 -> 401 with ${e_norole} == 'ERR_UNAUTHENTICATED'"
            - "trigger call 2 -> 401 with ${e_nouser} == 'ERR_UNAUTHENTICATED': both headers are required, not just the role"
            - "trigger call 3 -> 401 with ${e_badrole} == 'ERR_UNAUTHENTICATED' and NOT 403 ERR_UNAUTHORIZED: 'PlantOperator' is not one of the seven declared roles, so it is an authentication failure rather than a permission failure"
            - "trigger call 4 -> 401 with ${e_first} == 'ERR_UNAUTHENTICATED': priority 1 outranks both the role check (2) and the malformed body (3), which would otherwise be 403 and 400"
            - "no trigger creates a DisplayModel: GET /display-models with valid headers returns total_count == 0"

  - section: rbac
    instances:

      - name: no_role_may_perform_another_roles_exclusive_write
        claim_type: deny
        grounds:
          - rbac.PlantAdmin
          - rbac.DesignEngineer
          - rbac.StructuralReviewer
          - rbac.ProductionOperator
          - rbac.QAEngineer
          - rbac.FieldEngineer
          - rbac.ServiceManager
          - validations[priority=2]
          - errors.ERR_UNAUTHORIZED
        distinguishing_aspect: |
          The role model is peer-to-peer with segregation of duties: there is no
          superuser, so PlantAdmin — the role that seeds the catalogues and drives
          the clock — is just as locked out of POST /projects as a ProductionOperator
          is of the clock. Seven cross-role attempts walk the ring, and two of them
          are traps: the DesignEngineer reviewing its own submitted revision would
          ALSO trip segregation of duties at priority 26, and the QAEngineer
          mounting a cabinet would also trip the cabinet-state gate at 20, but
          priority 2 must answer first with 403 in both cases. An implementation
          that gives PlantAdmin a blanket override fails one assertion and an
          implementation that checks business rules before permissions fails two.
        test_recipe:
          setup:
            - "Project ${pjA} has an APPROVED revision and cabinet ${cab}; project ${pjB} has revision ${revB} still SUBMITTED (submitted by eng-1)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00.000Z" }
              as: PlantAdmin
              as_user_id: "adm-1"
            - call: "POST /display-models"
              payload: { name: "FP10-IN", pixel_pitch_mm: 10.0, rated_brightness_nits: 5000, environmental_rating: "IP43_INDOOR", module_width_mm: 320, module_height_mm: 320, module_pixel_cols: 32, module_pixel_rows: 32, cabinet_width_mm: 320, cabinet_height_mm: 320, modules_per_cabinet: 1, cabinet_weight_kg: 10.24, price_per_sqm_cents: 1000000, dead_pixel_ppm_limit: 976.56, module_dead_pixel_max: 3, module_cluster_max: 1, reference_color_x: 0.3128, reference_color_y: 0.3290, burn_in_hours_required: 24, max_drive_pct: 90 }
