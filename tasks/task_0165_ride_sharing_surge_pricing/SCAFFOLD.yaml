scenario: |
  165. Ride-Sharing Dynamic Surge Pricing: geo-grid, supply-demand ratio,
  multiplier cap, driver Quest bonus, rush hour, airport queue, Heat Map,
  dispute refund.

domain_name: ride-sharing-surge-pricing
api_prefix: /rides

complexity_profile:
  primary_archetype: pricing_engine
  secondary_archetype: quota_allocation
  complexity_layers:
    - rate_threshold_triggers
    - dual_variant_calculation
    - cascading_side_effects
    - scheduled_deferred_actions
    - derived_field_reconciliation
    - selector_policy
  entity_topology: hybrid
  state_machine_shape: branching
  relationship_patterns:
    - one_to_many
    - cross_aggregate
    - self_referential
  role_model: peer_roles
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: GeoGrid
    parent: null
    common_fields: true
    fields:
      - name: code
        type: string
        source: input
        description: "Unique grid code (e.g., 'G-001'). Immutable after creation."
        constraints: "Regex ^G-[0-9]{3}$; unique across all grids."
      - name: name
        type: string
        source: input
        description: "Human-readable label (e.g., 'Downtown')."
      - name: is_airport
        type: boolean
        source: input
        description: "True iff this grid contains the airport pickup queue."
        default: false
      - name: rush_hour_eligible
        type: boolean
        source: input
        description: "True iff this grid participates in rush-hour fare adjustment."
        default: true
      - name: active_driver_count
        type: integer
        source: computed
        description: "Number of Drivers with status=AVAILABLE whose current_grid_code equals this grid's code."
        default: 0
      - name: open_demand_count
        type: integer
        source: computed
        description: "Number of Rides in REQUESTED state whose pickup_grid_code equals this grid's code."
        default: 0
      - name: current_multiplier
        type: number
        source: computed
        description: "Current surge multiplier (>= 1.00, <= MULTIPLIER_CAP). Refreshed on every demand/supply event and on /_sweep/recompute_surge."
        default: 1.00
      - name: last_surge_recomputed_at
        type: datetime
        source: computed
        description: "ISO 8601 UTC timestamp of the most recent surge recomputation."

  - name: Driver
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Driver full name."
      - name: status
        type: enum
        source: computed
        description: "Driver lifecycle status."
        default: OFFLINE
        constraints: "One of {OFFLINE, AVAILABLE, EN_ROUTE_PICKUP, ON_TRIP, IN_AIRPORT_QUEUE}."
      - name: current_grid_code
        type: string
        source: computed
        description: "GeoGrid.code where the driver is currently located. NULL when OFFLINE."
        default: null
      - name: quest_id
        type: string
        source: input
        description: "Foreign key to QuestBonus.id the driver has enrolled in. NULL if not enrolled."
        default: null
      - name: quest_completed_rides
        type: integer
        source: computed
        description: "Count of Rides reaching COMPLETED state during the quest's window with this Driver as driver_id."
        default: 0
      - name: total_earnings_cents
        type: integer
        source: computed
        description: "Lifetime sum of Ride.driver_earnings_cents over Rides in COMPLETED state."
        default: 0

  - name: Rider
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Rider full name."
      - name: wallet_balance_cents
        type: integer
        source: computed
        description: "Refund credit balance in cents. Increments only on dispute APPROVED transitions."
        default: 0

  - name: RushHourWindow
    parent: null
    common_fields: true
    fields:
      - name: label
        type: string
        source: input
        description: "Human label (e.g., 'Morning Commute')."
      - name: day_of_week
        type: enum
        source: input
        description: "Day of week the window applies on."
        constraints: "One of {MON, TUE, WED, THU, FRI, SAT, SUN}."
      - name: start_minute
        type: integer
        source: input
        description: "Inclusive start, minutes since 00:00 UTC."
        constraints: "0 <= start_minute < 1440"
      - name: end_minute
        type: integer
        source: input
        description: "Exclusive end, minutes since 00:00 UTC."
        constraints: "start_minute < end_minute <= 1440"
      - name: additive_bonus
        type: number
        source: input
        description: "Number added to the supply/demand-derived multiplier when the window applies (before MULTIPLIER_CAP)."
        constraints: "0.00 <= additive_bonus <= 1.00"
      - name: is_active
        type: boolean
        source: computed
        description: "True iff the window has not been deactivated."
        default: true

  - name: QuestBonus
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Quest label (e.g., 'Weekend Warrior')."
      - name: target_ride_count
        type: integer
        source: input
        description: "Number of completed rides required to earn the bonus."
        constraints: "target_ride_count >= 1"
      - name: bonus_amount_cents
        type: integer
        source: input
        description: "Bonus paid out (in cents) when target_ride_count is reached during the window."
        constraints: "bonus_amount_cents >= 0"
      - name: window_start
        type: datetime
        source: input
        description: "Inclusive ISO 8601 UTC start of quest window."
      - name: window_end
        type: datetime
        source: input
        description: "Exclusive ISO 8601 UTC end of quest window."
        constraints: "window_end > window_start"
      - name: status
        type: enum
        source: computed
        description: "Quest lifecycle status."
        default: SCHEDULED
        constraints: "One of {SCHEDULED, ACTIVE, CLOSED}."

  - name: AirportQueue
    parent: null
    common_fields: false
    fields:
      - name: grid_code
        type: string
        source: input
        description: "GeoGrid.code where is_airport=true."
      - name: driver_id
        type: string
        source: input
        description: "Driver.id queued for an airport pickup."
      - name: position
        type: integer
        source: computed
        description: "1-indexed FIFO position within the queue. Position 1 is the head and is selected next."
        constraints: "position >= 1; unique per grid_code"
      - name: joined_at
        type: datetime
        source: system
        description: "ISO 8601 UTC timestamp when the driver entered the queue (used for FIFO ordering, tie-broken by Driver.id ascending)."

  - name: Ride
    parent: null
    common_fields: true
    fields:
      - name: rider_id
        type: string
        source: input
        description: "Rider.id who requested the ride."
      - name: driver_id
        type: string
        source: computed
        description: "Driver.id assigned. NULL while REQUESTED."
        default: null
      - name: pickup_grid_code
        type: string
        source: input
        description: "GeoGrid.code for pickup location."
      - name: dropoff_grid_code
        type: string
        source: input
        description: "GeoGrid.code for dropoff location."
      - name: distance_km
        type: number
        source: input
        description: "Trip distance in kilometers (rider-supplied, > 0)."
        constraints: "distance_km > 0"
      - name: status
        type: enum
        source: computed
        description: "Ride lifecycle status."
        default: REQUESTED
        constraints: "One of {REQUESTED, ASSIGNED, ON_TRIP, COMPLETED, CANCELED, DISPUTED, REFUNDED}."
      - name: base_fare_cents
        type: integer
        source: computed
        description: "BASE_FARE_CENTS + round_half_up(distance_km * PER_KM_CENTS). Pinned at REQUESTED."
      - name: pickup_multiplier_snapshot
        type: number
        source: computed
        description: "GeoGrid.current_multiplier of pickup_grid_code at the instant the ride was REQUESTED. Immutable thereafter."
      - name: rush_hour_bonus_snapshot
        type: number
        source: computed
        description: "RushHourWindow.additive_bonus applied (0.00 if no window matched). Pinned at REQUESTED."
      - name: quoted_fare_cents
        type: integer
        source: computed
        description: "Provisional fare quoted to the Rider at REQUESTED time. Forward-looking variant of fare calculation."
      - name: final_fare_cents
        type: integer
        source: computed
        description: "Final fare written at COMPLETED time. Chronological variant — recomputed using the multiplier in effect at the COMPLETED transition's timestamp."
        default: null
      - name: driver_earnings_cents
        type: integer
        source: computed
        description: "Driver share of final_fare_cents (after PLATFORM_FEE_RATE)."
        default: null
      - name: requested_at
        type: datetime
        source: system
        description: "ISO 8601 UTC timestamp of the REQUESTED transition."
      - name: completed_at
        type: datetime
        source: system
        description: "ISO 8601 UTC timestamp of the COMPLETED transition. NULL otherwise."
        default: null

  - name: Dispute
    parent: null
    common_fields: true
    fields:
      - name: ride_id
        type: string
        source: input
        description: "Ride.id this dispute is filed against."
      - name: rider_id
        type: string
        source: computed
        description: "Copy of Ride.rider_id for ownership checks."
      - name: reason_code
        type: enum
        source: input
        description: "Why the dispute was filed."
        constraints: "One of {OVERCHARGE, DRIVER_NO_SHOW, ROUTE_DEVIATION, OTHER}."
      - name: requested_refund_cents
        type: integer
        source: input
        description: "Refund amount requested in cents. Must be > 0 and <= Ride.final_fare_cents."
      - name: approved_refund_cents
        type: integer
        source: computed
        description: "Refund amount actually approved. <= requested_refund_cents."
        default: null
      - name: status
        type: enum
        source: computed
        description: "Dispute workflow status."
        default: OPEN
        constraints: "One of {OPEN, APPROVED, REJECTED}."
      - name: resolved_at
        type: datetime
        source: computed
        description: "ISO 8601 UTC timestamp of the APPROVED/REJECTED transition."
        default: null

  - name: HeatMapSnapshot
    parent: null
    common_fields: false
    fields:
      - name: grid_code
        type: string
        source: input
        description: "GeoGrid.code captured in this snapshot row."
      - name: multiplier
        type: number
        source: input
        description: "GeoGrid.current_multiplier at snapshot time."
      - name: active_driver_count
        type: integer
        source: input
        description: "GeoGrid.active_driver_count at snapshot time."
      - name: open_demand_count
        type: integer
        source: input
        description: "GeoGrid.open_demand_count at snapshot time."
      - name: snapshot_at
        type: datetime
        source: system
        description: "ISO 8601 UTC timestamp the snapshot batch was produced."

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Ride
    initial_state: REQUESTED
    terminal_states: [COMPLETED, CANCELED, REFUNDED]
    transitions:
      - from: REQUESTED
        to: ASSIGNED
        trigger: "POST /rides/{id}/assign"
        actor: PlatformAdmin
        preconditions:
          - "Ride.status == REQUESTED"
          - "Selector picks a Driver per AirportQueue/nearest-grid policy (see §1.3 driver_selection); selector MUST be deterministic (eligibility, ranking, tie-break, fallback all pinned)."
          - "Selected Driver.status == AVAILABLE (or IN_AIRPORT_QUEUE at queue head when pickup_grid_code.is_airport=true)."
        side_effects:
          - "Ride.driver_id := selected Driver.id"
          - "Driver.status := EN_ROUTE_PICKUP"
          - "Driver.current_grid_code := Ride.pickup_grid_code"
          - "GeoGrid(pickup).open_demand_count -= 1"
          - "GeoGrid(pickup).active_driver_count -= 1"
          - "Recompute GeoGrid(pickup).current_multiplier (see §1.3 surge_multiplier)."
          - "If pickup_grid_code.is_airport: remove the selected Driver from AirportQueue and re-number remaining positions (each later position decrements by 1)."

      - from: ASSIGNED
        to: ON_TRIP
        trigger: "POST /rides/{id}/start"
        actor: Driver
        preconditions:
          - "Ride.status == ASSIGNED"
          - "Acting Driver.id == Ride.driver_id"
        side_effects:
          - "Driver.status := ON_TRIP"

      - from: ON_TRIP
        to: COMPLETED
        trigger: "POST /rides/{id}/complete"
        actor: Driver
        preconditions:
          - "Ride.status == ON_TRIP"
          - "Acting Driver.id == Ride.driver_id"
        side_effects:
          - "Ride.completed_at := now()"
          - "Compute Ride.final_fare_cents using final_fare_calculation (chronological variant)."
          - "Ride.driver_earnings_cents := round_half_up(Ride.final_fare_cents * (1 - PLATFORM_FEE_RATE))"
          - "Driver.status := AVAILABLE"
          - "Driver.current_grid_code := Ride.dropoff_grid_code"
          - "GeoGrid(dropoff).active_driver_count += 1"
          - "Recompute GeoGrid(dropoff).current_multiplier (see §1.3 surge_multiplier)."
          - "Driver.total_earnings_cents += Ride.driver_earnings_cents"
          - "If Driver.quest_id != NULL and quest is ACTIVE: Driver.quest_completed_rides += 1; if it reaches QuestBonus.target_ride_count, the quest's bonus is paid out on the NEXT recomputation of total_earnings_cents (see §1.3 quest_bonus_payout)."

      - from: REQUESTED
        to: CANCELED
        trigger: "POST /rides/{id}/cancel"
        actor: Rider
        preconditions:
          - "Ride.status == REQUESTED"
          - "Acting Rider.id == Ride.rider_id"
        side_effects:
          - "GeoGrid(pickup).open_demand_count -= 1"
          - "Recompute GeoGrid(pickup).current_multiplier."

      - from: ASSIGNED
        to: CANCELED
        trigger: "POST /rides/{id}/cancel"
        actor: Rider
        preconditions:
          - "Ride.status == ASSIGNED"
          - "Acting Rider.id == Ride.rider_id"
        side_effects:
          - "Driver.status := AVAILABLE"
          - "Driver.current_grid_code := unchanged (driver was en-route; remains at last grid)"
          - "GeoGrid(driver.current_grid_code).active_driver_count += 1"
          - "Recompute GeoGrid(driver.current_grid_code).current_multiplier."
          - "If GeoGrid(pickup).is_airport AND driver was previously at airport head: driver MAY re-join AirportQueue via POST /airport-queue/join (not automatic)."

      - from: COMPLETED
        to: DISPUTED
        trigger: "POST /disputes (the Ride leaves COMPLETED when an OPEN Dispute is created)"
        actor: Rider
        preconditions:
          - "Ride.status == COMPLETED"
          - "Acting Rider.id == Ride.rider_id"
          - "No existing OPEN/APPROVED Dispute for this Ride (each Ride may dispute at most once)."
        side_effects:
          - "Create Dispute in OPEN state."

      - from: DISPUTED
        to: REFUNDED
        trigger: "POST /disputes/{id}/approve"
        actor: DisputeOps
        preconditions:
          - "Dispute.status == OPEN"
          - "Ride.status == DISPUTED"
        side_effects:
          - "Dispute.status := APPROVED"
          - "Dispute.approved_refund_cents := input (defaults to Dispute.requested_refund_cents if omitted; capped at Ride.final_fare_cents)"
          - "Rider.wallet_balance_cents += Dispute.approved_refund_cents"
          - "Compensating: Driver.total_earnings_cents -= round_half_up(Dispute.approved_refund_cents * (1 - PLATFORM_FEE_RATE)) (clamped to >= 0)"
          - "Ride.status := REFUNDED"
          - "Dispute.resolved_at := now()"

      - from: DISPUTED
        to: COMPLETED
        trigger: "POST /disputes/{id}/reject"
        actor: DisputeOps
        preconditions:
          - "Dispute.status == OPEN"
          - "Ride.status == DISPUTED"
        side_effects:
          - "Dispute.status := REJECTED"
          - "Ride.status := COMPLETED (reverts; no compensating drift on earnings)"
          - "Dispute.resolved_at := now()"

  - entity: Driver
    initial_state: OFFLINE
    terminal_states: []
    transitions:
      - from: OFFLINE
        to: AVAILABLE
        trigger: "POST /drivers/{id}/go-online"
        actor: Driver
        preconditions:
          - "Acting Driver.id == path Driver.id"
          - "Request body provides grid_code referencing an existing GeoGrid."
        side_effects:
          - "Driver.current_grid_code := grid_code"
          - "GeoGrid(grid_code).active_driver_count += 1"
          - "Recompute GeoGrid(grid_code).current_multiplier."

      - from: AVAILABLE
        to: OFFLINE
        trigger: "POST /drivers/{id}/go-offline"
        actor: Driver
        preconditions:
          - "Driver.status == AVAILABLE"
          - "Acting Driver.id == path Driver.id"
        side_effects:
          - "GeoGrid(current_grid_code).active_driver_count -= 1"
          - "Recompute GeoGrid(current_grid_code).current_multiplier."
          - "Driver.current_grid_code := NULL"

      - from: AVAILABLE
        to: IN_AIRPORT_QUEUE
        trigger: "POST /airport-queue/join"
        actor: Driver
        preconditions:
          - "Driver.status == AVAILABLE"
          - "Driver.current_grid_code == request.grid_code AND GeoGrid(grid_code).is_airport == true"
          - "Driver not already in any AirportQueue."
        side_effects:
          - "Create AirportQueue row with position = max(position in this grid) + 1, joined_at := now()"
          - "GeoGrid(current_grid_code).active_driver_count -= 1 (queued drivers do NOT count toward grid supply, branching dimension)."
          - "Recompute GeoGrid(current_grid_code).current_multiplier."

      - from: IN_AIRPORT_QUEUE
        to: AVAILABLE
        trigger: "POST /airport-queue/leave"
        actor: Driver
        preconditions:
          - "Driver.status == IN_AIRPORT_QUEUE"
          - "AirportQueue row exists for this Driver."
        side_effects:
          - "Delete the Driver's AirportQueue row; re-number remaining positions (each later position decrements by 1)."
          - "GeoGrid(current_grid_code).active_driver_count += 1"
          - "Recompute GeoGrid(current_grid_code).current_multiplier."

      # Branching: AVAILABLE → EN_ROUTE_PICKUP via Ride.ASSIGNED side effect
      - from: AVAILABLE
        to: EN_ROUTE_PICKUP
        trigger: "Side effect of Ride REQUESTED → ASSIGNED (see Ride state machine)."
        actor: system
        preconditions:
          - "Driver selected by selector policy (see §1.3 driver_selection)."
        side_effects:
          - "(handled by Ride.ASSIGNED side_effects above)"

      - from: IN_AIRPORT_QUEUE
        to: EN_ROUTE_PICKUP
        trigger: "Side effect of Ride REQUESTED → ASSIGNED when pickup_grid_code.is_airport=true and selector picks the head of AirportQueue."
        actor: system
        preconditions:
          - "Driver is at position 1 of AirportQueue for pickup_grid_code."
        side_effects:
          - "(handled by Ride.ASSIGNED side_effects above; AirportQueue head removed, remaining positions re-numbered)"

      - from: EN_ROUTE_PICKUP
        to: ON_TRIP
        trigger: "Side effect of Ride ASSIGNED → ON_TRIP."
        actor: system
        preconditions:
          - "(see Ride.ON_TRIP)"
        side_effects:
          - "(handled by Ride.ON_TRIP side_effects)"

      - from: EN_ROUTE_PICKUP
        to: AVAILABLE
        trigger: "Side effect of Ride ASSIGNED → CANCELED."
        actor: system
        preconditions:
          - "(see Ride.CANCELED from ASSIGNED)"
        side_effects:
          - "(handled by Ride.CANCELED side_effects)"

      - from: ON_TRIP
        to: AVAILABLE
        trigger: "Side effect of Ride ON_TRIP → COMPLETED."
        actor: system
        preconditions:
          - "(see Ride.COMPLETED)"
        side_effects:
          - "(handled by Ride.COMPLETED side_effects)"

  - entity: QuestBonus
    initial_state: SCHEDULED
    terminal_states: [CLOSED]
    transitions:
      - from: SCHEDULED
        to: ACTIVE
        trigger: "System: when now() crosses QuestBonus.window_start (driven by POST /_clock/advance)."
        actor: system
        preconditions:
          - "now() >= QuestBonus.window_start"
          - "QuestBonus.status == SCHEDULED"
        side_effects:
          - "QuestBonus.status := ACTIVE"

      - from: ACTIVE
        to: CLOSED
        trigger: "System: when now() crosses QuestBonus.window_end (driven by POST /_clock/advance)."
        actor: system
        preconditions:
          - "now() >= QuestBonus.window_end"
          - "QuestBonus.status == ACTIVE"
        side_effects:
          - "QuestBonus.status := CLOSED"
          - "For each Driver with quest_id == this QuestBonus.id whose quest_completed_rides >= target_ride_count and whose payout flag is unset: Driver.total_earnings_cents += bonus_amount_cents (one-time payout, idempotent on re-close attempts)."

  - entity: Dispute
    initial_state: OPEN
    terminal_states: [APPROVED, REJECTED]
    transitions:
      - from: OPEN
        to: APPROVED
        trigger: "POST /disputes/{id}/approve"
        actor: DisputeOps
        preconditions:
          - "Dispute.status == OPEN"
          - "Associated Ride.status == DISPUTED"
        side_effects:
          - "(See Ride.DISPUTED → REFUNDED for full chain; cross-entity coupling)"

      - from: OPEN
        to: REJECTED
        trigger: "POST /disputes/{id}/reject"
        actor: DisputeOps
        preconditions:
          - "Dispute.status == OPEN"
          - "Associated Ride.status == DISPUTED"
        side_effects:
          - "(See Ride.DISPUTED → COMPLETED for full chain)"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - scenario: "Two riders simultaneously request rides in a grid with exactly one AVAILABLE driver."
    guarantee: "First request wins assignment; second request leaves the second Ride in REQUESTED state pending a new driver."
    error_id: null  # No error; second ride remains REQUESTED. (No race-loser error — both requests succeed at creation, only one gets ASSIGNED.)
    http_status: null
    serialization: "First-writer-wins on driver_selection per pickup_grid_code at REQUESTED → ASSIGNED."

  - scenario: "Two POST /rides/{id}/assign calls race on the same REQUESTED Ride."
    guarantee: "Exactly one assigns; the loser sees ERR_INVALID_STATE because Ride.status moved to ASSIGNED."
    error_id: ERR_INVALID_STATE
    http_status: 409
    serialization: "First-writer-wins on Ride.status."

  - scenario: "Two drivers both call POST /airport-queue/join for the same airport grid; one of them was the most recently freed by COMPLETED."
    guarantee: "Both succeed but each receives a distinct sequential position (no duplicate positions)."
    error_id: null
    http_status: null
    serialization: "FIFO on joined_at; tie-break by Driver.id ascending. Position assigned atomically as max(position)+1."

  - scenario: "POST /disputes/{id}/approve and POST /disputes/{id}/reject race on the same OPEN Dispute."
    guarantee: "Exactly one wins; loser gets ERR_INVALID_STATE."
    error_id: ERR_INVALID_STATE
    http_status: 409
    serialization: "First-writer-wins on Dispute.status."

  - scenario: "A Rider files a second Dispute on the same Ride concurrent with the first."
    guarantee: "At most one Dispute per Ride; the loser gets ERR_DISPUTE_ALREADY_EXISTS."
    error_id: ERR_DISPUTE_ALREADY_EXISTS
    http_status: 409
    serialization: "First-writer-wins on (Dispute.ride_id) uniqueness."

  - scenario: "Two PATCH /grids/{id} requests modify the same GeoGrid with stale version."
    guarantee: "Second writer with stale version is rejected."
    error_id: ERR_VERSION_CONFLICT
    http_status: 409
    serialization: "Optimistic concurrency on GeoGrid.version."

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: surge_multiplier
    trigger: "Recomputed on every change to GeoGrid.active_driver_count OR GeoGrid.open_demand_count, and on POST /_sweep/recompute_surge."
    algorithm: threshold
    formula: |
      # Step 1: supply/demand ratio
      if active_driver_count == 0 and open_demand_count == 0:
          raw = 1.00
      elif active_driver_count == 0:
          raw = MULTIPLIER_CAP                  # infinite-demand boundary
      else:
          ratio = open_demand_count / active_driver_count
          if ratio <= 1.0:
              raw = 1.00
          elif ratio <= 2.0:
              raw = 1.50
          elif ratio <= 3.0:
              raw = 2.00
          elif ratio <= 4.0:
              raw = 2.50
          else:
              raw = MULTIPLIER_CAP              # 3.00 by default

      # Step 2: airport surcharge (additive, applied BEFORE rush-hour bonus and BEFORE cap)
      if grid.is_airport:
          raw += AIRPORT_SURCHARGE              # +0.50

      # Step 3: apply MULTIPLIER_CAP (capped here, BEFORE rush-hour bonus is added to the ride snapshot)
      grid.current_multiplier = min(raw, MULTIPLIER_CAP)
      # round to 2 decimals using round_half_up
      grid.current_multiplier = round_half_up(grid.current_multiplier, 2)
    input_set: "Per GeoGrid: active_driver_count (Drivers with status=AVAILABLE in this grid), open_demand_count (Rides in REQUESTED in this grid). Drivers in IN_AIRPORT_QUEUE do NOT contribute to active_driver_count."
    constants:
      MULTIPLIER_CAP: 3.00
      AIRPORT_SURCHARGE: 0.50
    precision: "current_multiplier stored to 2 decimal places, round_half_up."
    variants: []

  - name: quoted_fare_calculation
    trigger: "Computed at REQUESTED time (Ride creation). Forward-looking variant — uses the GeoGrid.current_multiplier observed at REQUESTED instant."
    algorithm: forward_looking
    formula: |
      # Step 1: base fare
      base_fare = BASE_FARE_CENTS + round_half_up(distance_km * PER_KM_CENTS)

      # Step 2: pin pickup-grid surge at REQUESTED
      Ride.pickup_multiplier_snapshot = GeoGrid(pickup_grid_code).current_multiplier

      # Step 3: pin rush-hour bonus at REQUESTED
      rush_window = first active RushHourWindow matching now()'s day_of_week with start_minute <= minute_of_day(now()) < end_minute
                    AND (GeoGrid(pickup_grid_code).rush_hour_eligible == true)
      Ride.rush_hour_bonus_snapshot = rush_window.additive_bonus if matched else 0.00

      # Step 4: effective multiplier = (pickup_multiplier_snapshot + rush_hour_bonus_snapshot), capped at MULTIPLIER_CAP
      eff_mult = min(Ride.pickup_multiplier_snapshot + Ride.rush_hour_bonus_snapshot, MULTIPLIER_CAP)

      # Step 5: quoted_fare_cents = round_half_up(base_fare_cents * eff_mult)
      Ride.base_fare_cents  = base_fare
      Ride.quoted_fare_cents = round_half_up(base_fare * eff_mult)
    input_set: "Single Ride at REQUESTED time. Inputs: pickup_grid_code, distance_km, now()."
    constants:
      BASE_FARE_CENTS: 250
      PER_KM_CENTS: 120
      MULTIPLIER_CAP: 3.00
    precision: "All cents rounded with round_half_up to integer cents. Multiplier arithmetic in 2 decimal places."
    variants:
      - name: quoted_variant
        when: "At REQUESTED time, before driver assignment."
        difference: "Uses the GeoGrid.current_multiplier observed at REQUESTED time — i.e. the pre-this-ride supply/demand state. Forward-looking; pinned in pickup_multiplier_snapshot. This number is what the Rider sees."

  - name: final_fare_calculation
    trigger: "Computed at COMPLETED time (Ride ON_TRIP → COMPLETED). Chronological variant — recomputes effective multiplier from current grid state at COMPLETED instant."
    algorithm: chronological
    formula: |
      # Step 1: base_fare_cents already pinned at REQUESTED — reuse.
      # Step 2: re-read GeoGrid.current_multiplier for pickup_grid_code AT now() (COMPLETED instant).
      live_pickup_mult = GeoGrid(Ride.pickup_grid_code).current_multiplier

      # Step 3: re-evaluate rush-hour bonus AT now() (rush window may have ended mid-trip)
      rush_window_now = matching RushHourWindow at minute_of_day(now()) for now()'s day_of_week
                        AND (GeoGrid(pickup_grid_code).rush_hour_eligible == true)
      live_bonus = rush_window_now.additive_bonus if matched else 0.00

      # Step 4: effective multiplier for FINAL fare = max(quoted_multiplier, live_multiplier) is NOT used.
      # The chronological rule pins: final uses the multiplier in effect at COMPLETED instant only.
      eff_mult_final = min(live_pickup_mult + live_bonus, MULTIPLIER_CAP)

      # Step 5: final_fare_cents = round_half_up(base_fare_cents * eff_mult_final)
      Ride.final_fare_cents = round_half_up(Ride.base_fare_cents * eff_mult_final)

      # Step 6: driver_earnings_cents
      Ride.driver_earnings_cents = round_half_up(Ride.final_fare_cents * (1 - PLATFORM_FEE_RATE))
      # The two roundings — fare then earnings — are applied IN ORDER. Reversing the order
      # (computing earnings first as base*eff*(1-fee), then rounding) can produce a 1-cent
      # difference; the scaffold pins this order.
    input_set: "Single Ride at COMPLETED time. Inputs: Ride.base_fare_cents, GeoGrid(pickup_grid_code).current_multiplier at now(), live RushHourWindow at now()."
    constants:
      PLATFORM_FEE_RATE: 0.20
      MULTIPLIER_CAP: 3.00
    precision: "Integer cents via round_half_up. Two rounding steps in fixed order: (1) fare, (2) earnings."
    variants:
      - name: chronological_variant
        when: "At COMPLETED time."
        difference: "Re-reads GeoGrid.current_multiplier at the COMPLETED instant, not the value snapshotted at REQUESTED. So if surge has changed during the trip, final_fare_cents will differ from quoted_fare_cents — same Ride, same base, two valid algorithms, different results. Dispute path may invoke this divergence."

  - name: quest_bonus_payout
    trigger: "QuestBonus ACTIVE → CLOSED transition (system-driven on POST /_clock/advance)."
    algorithm: aggregation
    formula: |
      # For each Driver with quest_id == quest.id:
      #   if Driver.quest_completed_rides >= quest.target_ride_count:
      #     Driver.total_earnings_cents += quest.bonus_amount_cents
      # The aggregate counts only Rides with status=COMPLETED whose completed_at is
      # in [quest.window_start, quest.window_end) AND whose driver_id == Driver.id.
      # Tie-break: a Ride whose completed_at == window_end is EXCLUDED (right-half-open).
      payout = quest.bonus_amount_cents if Driver.quest_completed_rides >= quest.target_ride_count else 0
    input_set: "All Drivers with quest_id == this QuestBonus.id. Only COMPLETED rides whose completed_at ∈ [window_start, window_end)."
    constants: {}
    precision: "Integer cents (no rounding required since bonus_amount_cents already integer)."
    variants: []

  - name: driver_selection
    trigger: "Ride REQUESTED → ASSIGNED via POST /rides/{id}/assign."
    algorithm: waterfall_allocation
    formula: |
      # Eligibility filter (which drivers can be picked):
      # IF pickup_grid_code.is_airport == true:
      #   Candidates = AirportQueue rows where grid_code == pickup_grid_code (drivers in IN_AIRPORT_QUEUE)
      #   Ranking: ORDER BY position ASC      # head first
      #   Tie-break: position is unique per grid, so no tie possible.
      #   Fallback (empty queue): fall through to non-airport branch below.
      # ELSE (or airport fallback):
      #   Candidates = Drivers where status == AVAILABLE AND current_grid_code == pickup_grid_code
      #   Ranking: ORDER BY updated_at ASC    # longest-idle first
      #   Tie-break: Driver.id ASC
      #   Fallback (empty): ERR_NO_DRIVERS_AVAILABLE (request body MAY include allow_neighbor_grid=true,
      #     in which case Candidates expands to Drivers in GeoGrids with code lexicographically
      #     adjacent (|grid_a.numeric - grid_b.numeric| == 1) AND status==AVAILABLE; same ranking).
      selected = Candidates[0]
    input_set: "Drivers in pickup grid (or airport queue, or adjacent grids if allow_neighbor_grid)."
    constants: {}
    precision: "n/a"
    variants: []

# =============================================================================
# §1.4 Validation Rules Table (Ordered by Priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers are present and well-formed."
    error_id: ERR_AUTH_MISSING
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "X-User-Role is permitted to call this endpoint per RBAC matrix (§1.7)."
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "Every path id parameter (driver_id, ride_id, dispute_id, grid_id, quest_id, window_id) references an existing resource — validated LEFT to RIGHT in URL order."
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with path ids"

  - priority: 4
    category: existence
    check: "Foreign-key fields in request body (rider_id, driver_id, pickup_grid_code, dropoff_grid_code, quest_id) reference existing resources."
    error_id: ERR_REFERENCE_NOT_FOUND
    http_status: 404
    applies_to: "POST /rides, POST /disputes, PATCH /drivers/{id}"

  - priority: 5
    category: business_referential
    check: "On POST /rides/{id}/start, POST /rides/{id}/complete, and POST /drivers/{id}/* — the acting Driver.id (X-User-ID with Role=Driver) must equal the resource's driver_id or path id."
    error_id: ERR_NOT_OWNER
    http_status: 403
    applies_to: "POST /rides/{id}/start, POST /rides/{id}/complete, POST /drivers/{id}/go-online, POST /drivers/{id}/go-offline, POST /airport-queue/join, POST /airport-queue/leave"

  - priority: 6
    category: business_referential
    check: "On POST /rides/{id}/cancel and POST /disputes (create) — the acting Rider.id (X-User-ID with Role=Rider) must equal Ride.rider_id."
    error_id: ERR_NOT_OWNER
    http_status: 403
    applies_to: "POST /rides/{id}/cancel, POST /disputes"

  - priority: 7
    category: state
    check: "Target resource is in a state from which the requested transition is allowed (see §1.2)."
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 8
    category: business_constraint
    check: "On POST /disputes — Ride.status == COMPLETED AND no existing (OPEN/APPROVED) Dispute for the Ride."
    error_id: ERR_DISPUTE_ALREADY_EXISTS
    http_status: 409
    applies_to: "POST /disputes"

  - priority: 9
    category: business_constraint
    check: "On POST /airport-queue/join — GeoGrid(grid_code).is_airport == true."
    error_id: ERR_NOT_AIRPORT_GRID
    http_status: 422
    applies_to: "POST /airport-queue/join"

  - priority: 10
    category: business_constraint
    check: "On POST /airport-queue/join — Driver.current_grid_code == request.grid_code."
    error_id: ERR_DRIVER_NOT_IN_GRID
    http_status: 422
    applies_to: "POST /airport-queue/join"

  - priority: 11
    category: business_temporal
    check: "On POST /rush-hour-windows — start_minute < end_minute AND no existing ACTIVE window on the same day_of_week whose [start_minute, end_minute) intersects this one. Adjacency (e.g., existing ends at 540, new starts at 540) is ALLOWED — half-open intervals."
    error_id: ERR_RUSH_HOUR_OVERLAP
    http_status: 422
    applies_to: "POST /rush-hour-windows, PATCH /rush-hour-windows/{id}"

  - priority: 12
    category: business_temporal
    check: "On POST /quest-bonuses — window_end > window_start AND if a Driver enrolls in this quest, the Driver MUST NOT be enrolled in another QuestBonus whose [window_start, window_end) interval OVERLAPS this one. Overlap uses CLOSED-closed semantics — adjacency at boundary instants IS considered overlap (whereas RushHourWindow uses half-open)."
    error_id: ERR_QUEST_WINDOW_OVERLAP
    http_status: 422
    applies_to: "POST /quest-bonuses, PATCH /drivers/{id}/quest"

  - priority: 13
    category: business_fiscal
    check: "On POST /disputes — requested_refund_cents > 0 AND requested_refund_cents <= Ride.final_fare_cents."
    error_id: ERR_REFUND_EXCEEDS_FARE
    http_status: 422
    applies_to: "POST /disputes"

  - priority: 14
    category: business_fiscal
    check: "On POST /disputes/{id}/approve — body.approved_refund_cents (if provided) <= Dispute.requested_refund_cents."
    error_id: ERR_REFUND_EXCEEDS_REQUEST
    http_status: 422
    applies_to: "POST /disputes/{id}/approve"

  - priority: 15
    category: business_constraint
    check: "On PATCH endpoints carrying `version` — supplied version must equal the resource's current version."
    error_id: ERR_VERSION_CONFLICT
    http_status: 409
    applies_to: "PATCH /grids/{id}, PATCH /drivers/{id}, PATCH /drivers/{id}/quest, PATCH /rush-hour-windows/{id}"

  - priority: 16
    category: business_constraint
    check: "Request body field types/ranges match entity schema (e.g., distance_km > 0; multiplier <= MULTIPLIER_CAP)."
    error_id: ERR_INVALID_INPUT
    http_status: 422
    applies_to: "all"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- GeoGrid ----
  - method: POST
    path: /grids
    description: "Create a new GeoGrid."
    roles: [PlatformAdmin]
    code: 201
    input: [code, name, "is_airport?", "rush_hour_eligible?"]
    output: GeoGrid

  - method: GET
    path: /grids
    description: "List all GeoGrids with pagination."
    roles: [PlatformAdmin, Driver, Rider, DisputeOps]
    code: 200
    input: ["limit?", "offset?"]
    output: GeoGrid[]

  - method: GET
    path: /grids/{id}
    description: "Read a single GeoGrid (includes current_multiplier and counts)."
    roles: [PlatformAdmin, Driver, Rider, DisputeOps]
    code: 200
    input: []
    output: GeoGrid

  - method: PATCH
    path: /grids/{id}
    description: "Patch metadata (name, rush_hour_eligible)."
    roles: [PlatformAdmin]
    code: 200
    input: ["name?", "rush_hour_eligible?", version]
    output: GeoGrid
    side_effects: [recompute_surge_for_this_grid]

  - method: GET
    path: /grids/heatmap
    description: "Heat Map: returns latest HeatMapSnapshot row per grid_code (descending snapshot_at)."
    roles: [PlatformAdmin, Driver, Rider, DisputeOps]
    code: 200
    input: []
    output: HeatMapSnapshot[]

  # ---- Driver ----
  - method: POST
    path: /drivers
    description: "Create a Driver record."
    roles: [PlatformAdmin]
    code: 201
    input: [name]
    output: Driver

  - method: GET
    path: /drivers/{id}
    description: "Read a Driver."
    roles: [PlatformAdmin, Driver]
    code: 200
    input: []
    output: Driver

  - method: PATCH
    path: /drivers/{id}/quest
    description: "Enroll/unenroll a Driver from a QuestBonus."
    roles: [Driver, PlatformAdmin]
    code: 200
    input: [quest_id_or_null, version]
    output: Driver

  - method: POST
    path: /drivers/{id}/go-online
    description: "Driver transitions OFFLINE → AVAILABLE in a specific grid."
    roles: [Driver]
    code: 200
    input: [grid_code]
    output: Driver
    side_effects: [active_driver_count_incr, surge_multiplier_recompute]

  - method: POST
    path: /drivers/{id}/go-offline
    description: "Driver transitions AVAILABLE → OFFLINE."
    roles: [Driver]
    code: 200
    input: []
    output: Driver
    side_effects: [active_driver_count_decr, surge_multiplier_recompute]

  # ---- Rider ----
  - method: POST
    path: /riders
    description: "Create a Rider record."
    roles: [PlatformAdmin]
    code: 201
    input: [name]
    output: Rider

  - method: GET
    path: /riders/{id}
    description: "Read a Rider."
    roles: [PlatformAdmin, Rider]
    code: 200
    input: []
    output: Rider

  # ---- RushHourWindow ----
  - method: POST
    path: /rush-hour-windows
    description: "Create a RushHourWindow."
    roles: [PlatformAdmin]
    code: 201
    input: [label, day_of_week, start_minute, end_minute, additive_bonus]
    output: RushHourWindow

  - method: GET
    path: /rush-hour-windows
    description: "List all RushHourWindows."
    roles: [PlatformAdmin, Driver, Rider, DisputeOps]
    code: 200
    input: ["limit?", "offset?"]
    output: RushHourWindow[]

  - method: PATCH
    path: /rush-hour-windows/{id}
    description: "Patch a RushHourWindow (label, is_active, additive_bonus)."
    roles: [PlatformAdmin]
    code: 200
    input: ["label?", "additive_bonus?", "is_active?", version]
    output: RushHourWindow

  # ---- QuestBonus ----
  - method: POST
    path: /quest-bonuses
    description: "Create a QuestBonus (initial status=SCHEDULED)."
    roles: [PlatformAdmin]
    code: 201
    input: [name, target_ride_count, bonus_amount_cents, window_start, window_end]
    output: QuestBonus

  - method: GET
    path: /quest-bonuses
    description: "List QuestBonuses."
    roles: [PlatformAdmin, Driver]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: QuestBonus[]

  - method: GET
    path: /quest-bonuses/{id}
    description: "Read a single QuestBonus."
    roles: [PlatformAdmin, Driver]
    code: 200
    input: []
    output: QuestBonus

  # ---- AirportQueue ----
  - method: POST
    path: /airport-queue/join
    description: "Driver joins the airport pickup FIFO queue for grid_code (must be at airport, status=AVAILABLE)."
    roles: [Driver]
    code: 201
    input: [grid_code]
    output: AirportQueue
    side_effects: [driver_status_to_in_airport_queue, active_driver_count_decr, surge_multiplier_recompute]

  - method: POST
    path: /airport-queue/leave
    description: "Driver leaves the queue voluntarily (status → AVAILABLE)."
    roles: [Driver]
    code: 200
    input: []
    output: Driver
    side_effects: [airport_queue_renumber, active_driver_count_incr, surge_multiplier_recompute]

  - method: GET
    path: /airport-queue
    description: "List current AirportQueue rows for a grid_code, ordered by position ASC."
    roles: [PlatformAdmin, Driver, DisputeOps]
    code: 200
    input: [grid_code, "limit?", "offset?"]
    output: AirportQueue[]

  # ---- Ride ----
  - method: POST
    path: /rides
    description: "Rider requests a ride. Computes quoted_fare_cents at REQUESTED instant."
    roles: [Rider]
    code: 201
    input: [pickup_grid_code, dropoff_grid_code, distance_km]
    output: Ride
    side_effects: [open_demand_count_incr, surge_multiplier_recompute, quoted_fare_calculation]

  - method: GET
    path: /rides/{id}
    description: "Read a single Ride."
    roles: [Rider, Driver, PlatformAdmin, DisputeOps]
    code: 200
    input: []
    output: Ride

  - method: GET
    path: /rides
    description: "List rides with filters (rider_id, driver_id, status)."
    roles: [PlatformAdmin, DisputeOps]
    code: 200
    input: ["limit?", "offset?", "status?", "rider_id?", "driver_id?"]
    output: Ride[]

  - method: POST
    path: /rides/{id}/assign
    description: "Assign a Driver to a REQUESTED Ride per driver_selection (§1.3). Accepts optional allow_neighbor_grid."
    roles: [PlatformAdmin]
    code: 200
    input: ["allow_neighbor_grid?"]
    output: Ride
    side_effects: [driver_selection, ride_status_to_assigned, airport_queue_pop, surge_multiplier_recompute]

  - method: POST
    path: /rides/{id}/start
    description: "Driver starts an ASSIGNED Ride → ON_TRIP."
    roles: [Driver]
    code: 200
    input: []
    output: Ride

  - method: POST
    path: /rides/{id}/complete
    description: "Driver completes ON_TRIP → COMPLETED. Triggers final_fare_calculation and driver_earnings update."
    roles: [Driver]
    code: 200
    input: []
    output: Ride
    side_effects: [final_fare_calculation, driver_earnings_update, surge_multiplier_recompute, quest_progress_incr]

  - method: POST
    path: /rides/{id}/cancel
    description: "Rider cancels Ride in REQUESTED or ASSIGNED state."
    roles: [Rider]
    code: 200
    input: []
    output: Ride
    side_effects: [demand_or_supply_recount, surge_multiplier_recompute]

  # ---- Dispute ----
  - method: POST
    path: /disputes
    description: "Rider files a dispute on a COMPLETED Ride (Ride.status moves to DISPUTED)."
    roles: [Rider]
    code: 201
    input: [ride_id, reason_code, requested_refund_cents]
    output: Dispute
    side_effects: [ride_status_to_disputed]

  - method: GET
    path: /disputes/{id}
    description: "Read a Dispute."
    roles: [Rider, DisputeOps, PlatformAdmin]
    code: 200
    input: []
    output: Dispute

  - method: GET
    path: /disputes
    description: "List disputes (filter by status, rider_id)."
    roles: [DisputeOps, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?", "status?", "rider_id?"]
    output: Dispute[]

  - method: POST
    path: /disputes/{id}/approve
    description: "DisputeOps approves a Dispute. Ride → REFUNDED, wallet credit applied."
    roles: [DisputeOps]
    code: 200
    input: ["approved_refund_cents?"]
    output: Dispute
    side_effects: [refund_credit_apply, driver_earnings_clawback, ride_status_to_refunded]

  - method: POST
    path: /disputes/{id}/reject
    description: "DisputeOps rejects a Dispute. Ride reverts to COMPLETED."
    roles: [DisputeOps]
    code: 200
    input: []
    output: Dispute
    side_effects: [ride_status_revert_completed]

  # ---- Test-driving endpoints (clock + sweeps) ----
  - method: POST
    path: /_clock/advance
    description: "Test-only: advance the server clock to a target ISO 8601 UTC instant. Triggers any time-gated transitions (RushHourWindow activation, QuestBonus open/close, etc.)."
    roles: [PlatformAdmin]
    code: 200
    input: [target_timestamp]
    output: null
    side_effects: [quest_bonus_transitions, rush_hour_recalc_for_new_rides]

  - method: POST
    path: /_sweep/recompute_surge
    description: "Test-only: force a fresh surge recomputation for all grids and write a HeatMapSnapshot batch row per grid."
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: HeatMapSnapshot[]
    side_effects: [surge_multiplier_recompute_all, heatmap_snapshot_write]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_AUTH_MISSING
    http: 401
    condition: "X-User-ID or X-User-Role header missing/malformed."
  - id: ERR_FORBIDDEN
    http: 403
    condition: "Role not authorized for this endpoint."
  - id: ERR_NOT_OWNER
    http: 403
    condition: "Acting Driver.id != Ride.driver_id (or Rider.id != Ride.rider_id) on ownership-checked endpoint."
  - id: ERR_NOT_FOUND
    http: 404
    condition: "Path id parameter doesn't reference a resource."
  - id: ERR_REFERENCE_NOT_FOUND
    http: 404
    condition: "FK field in request body doesn't reference an existing resource."
  - id: ERR_INVALID_STATE
    http: 409
    condition: "Target resource not in a valid state for the requested transition."
  - id: ERR_DISPUTE_ALREADY_EXISTS
    http: 409
    condition: "A Dispute (OPEN or APPROVED) already exists for this Ride."
  - id: ERR_VERSION_CONFLICT
    http: 409
    condition: "PATCH version doesn't equal current version."
  - id: ERR_NOT_AIRPORT_GRID
    http: 422
    condition: "Attempted to join airport queue on a non-airport grid."
  - id: ERR_DRIVER_NOT_IN_GRID
    http: 422
    condition: "Driver.current_grid_code doesn't match the airport queue's grid_code."
  - id: ERR_RUSH_HOUR_OVERLAP
    http: 422
    condition: "RushHourWindow overlaps with another active window on the same day_of_week (half-open semantics)."
  - id: ERR_QUEST_WINDOW_OVERLAP
    http: 422
    condition: "Driver attempts to enroll in a QuestBonus whose [window_start, window_end] (closed) overlaps with an existing enrollment."
  - id: ERR_REFUND_EXCEEDS_FARE
    http: 422
    condition: "Dispute.requested_refund_cents > Ride.final_fare_cents."
  - id: ERR_REFUND_EXCEEDS_REQUEST
    http: 422
    condition: "Approve body's approved_refund_cents > Dispute.requested_refund_cents."
  - id: ERR_NO_DRIVERS_AVAILABLE
    http: 409
    condition: "Driver selection fallback exhausted (no AVAILABLE drivers in pickup grid or neighbors)."
  - id: ERR_INVALID_INPUT
    http: 422
    condition: "Body field type/range invalid (e.g., distance_km <= 0)."

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Rider
    description: "End-user who requests rides and files disputes."
    identity: "entity_backed:Rider"
    exclusive_operations:
      - "POST /rides"
      - "POST /rides/{id}/cancel"
      - "POST /disputes"
    shared_operations:
      - "GET /rides/{id}"
      - "GET /riders/{id}"
      - "GET /grids"
      - "GET /grids/{id}"
      - "GET /grids/heatmap"
      - "GET /rush-hour-windows"
      - "GET /disputes/{id} (only own disputes)"

  - name: Driver
    description: "Driver who accepts ride assignments, joins airport queues, enrolls in quests."
    identity: "entity_backed:Driver"
    exclusive_operations:
      - "POST /drivers/{id}/go-online"
      - "POST /drivers/{id}/go-offline"
      - "POST /airport-queue/join"
      - "POST /airport-queue/leave"
      - "POST /rides/{id}/start"
      - "POST /rides/{id}/complete"
      - "PATCH /drivers/{id}/quest (own driver only)"
    shared_operations:
      - "GET /drivers/{id} (own)"
      - "GET /grids"
      - "GET /grids/{id}"
      - "GET /grids/heatmap"
      - "GET /quest-bonuses"
      - "GET /quest-bonuses/{id}"
      - "GET /airport-queue"

  - name: PlatformAdmin
    description: "Operator who manages grids, rush-hour windows, quests, advances clock, runs sweeps, and dispatches drivers."
    identity: "opaque"
    exclusive_operations:
      - "POST /grids"
      - "PATCH /grids/{id}"
      - "POST /rush-hour-windows"
      - "PATCH /rush-hour-windows/{id}"
      - "POST /quest-bonuses"
      - "POST /drivers"
      - "POST /riders"
      - "POST /rides/{id}/assign"
      - "POST /_clock/advance"
      - "POST /_sweep/recompute_surge"
      - "PATCH /drivers/{id}/quest (admin override)"
    shared_operations:
      - "GET /rides"
      - "GET /grids"
      - "GET /grids/{id}"
      - "GET /grids/heatmap"
      - "GET /rush-hour-windows"
      - "GET /quest-bonuses"
      - "GET /quest-bonuses/{id}"
      - "GET /airport-queue"
      - "GET /disputes"
      - "GET /disputes/{id}"

  - name: DisputeOps
    description: "Customer-service operator who approves or rejects disputes."
    identity: "opaque"
    exclusive_operations:
      - "POST /disputes/{id}/approve"
      - "POST /disputes/{id}/reject"
    shared_operations:
      - "GET /disputes"
      - "GET /disputes/{id}"
      - "GET /rides"
      - "GET /rides/{id}"
      - "GET /grids/heatmap"
