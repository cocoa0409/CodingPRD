      - name: corner_scheduling_refused_on_closed_allotment
        claim_type: violation_to_error
        grounds:
          - validations.priority_9
          - errors.ERR_ALLOTMENT_CLOSED
        excluded_because:
          difficulty_instance: aoi_creation_gated_by_allotment_posture
          rationale: "The §1.8 instance aoi_creation_gated_by_allotment_posture already sends the identical POST /annual-operating-instructions/{aoiId}/use-records body twice — once while the grandparent allotment is merely RESTRICTED (HTTP 201) and once after a WILDFIRE_CLOSURE drives it to CLOSED (HTTP 409 ERR_ALLOTMENT_CLOSED) — and its asserts explicitly rule out the capacity and AOI-state alternatives, so a corner test would only restate it."

      - name: corner_fourth_consecutive_nonuse_year_refused_on_renewal
        claim_type: violation_to_error
        grounds:
          - validations.priority_21
          - errors.ERR_NONUSE_LIMIT_EXCEEDED
        excluded_because:
          difficulty_instance: nonuse_run_ceiling_boundary_on_renewal
          rationale: "The §1.8 instance nonuse_run_ceiling_boundary_on_renewal already builds two otherwise identical permits whose non-use runs differ by one year: at consecutive_nonuse_years 2 (ceiling - 1) the renewal returns 201, at exactly MAX_CONSECUTIVE_NONUSE_YEARS = 3 it returns HTTP 409 ERR_NONUSE_LIMIT_EXCEEDED and leaves the predecessor ISSUED with no successor. The off-by-one boundary is exactly what that instance exists to pin."

      - name: corner_overlapping_closure_orders_refused
        claim_type: violation_to_error
        grounds:
          - validations.priority_26
          - errors.ERR_CLOSURE_ORDER_OVERLAP
        excluded_because:
          difficulty_instance: closure_order_closed_interval_with_forward_buffer
          rationale: "The §1.8 instance closure_order_closed_interval_with_forward_buffer already tests the abutting day (a start date equal to the ACTIVE order's end date is rejected because both ends are closed), a start date inside the interval, a start date exactly CLOSURE_BUFFER_DAYS = 7 days past the end (still HTTP 409 ERR_CLOSURE_ORDER_OVERLAP) and one day beyond the buffer (HTTP 201), plus the LIFTED-order case that stops blocking; every edge of the rule is already covered."

      - name: corner_renewal_refused_while_permittee_owes_money
        claim_type: violation_to_error
        grounds:
          - validations.priority_28
          - errors.ERR_OUTSTANDING_BALANCE
        excluded_because:
          difficulty_instance: permit_renewal_gated_by_permittee_debt
          rationale: "The §1.8 instance permit_renewal_gated_by_permittee_debt already drives Permittee.outstanding_balance_cents to 54100 via an unpaid use bill, receives HTTP 402 ERR_OUTSTANDING_BALANCE on a renewal that is otherwise fully valid, asserts the predecessor was not expired by the failure, then pays the bill and replays the identical renewal for a 201 with the balance back at 0."

      - name: corner_pasture_capacity_aggregate_refused
        claim_type: violation_to_error
        grounds:
          - validations.priority_29
          - errors.ERR_PASTURE_CAPACITY_EXCEEDED
        excluded_because:
          difficulty_instance: pasture_half_open_interval_capacity_aggregate
          rationale: "The §1.8 instance pasture_half_open_interval_capacity_aggregate already tests the half-open boundary (a record starting exactly on another's exit date does NOT intersect, so 206.67 + 200.00 AUMs on a 300-AUM pasture is accepted) alongside the intersecting case that pushes the aggregate to 310.00 and returns HTTP 422 ERR_PASTURE_CAPACITY_EXCEEDED, plus the one-day-earlier variant that intersects again."

      - name: corner_stayed_decision_effectiveness_refused
        claim_type: violation_to_error
        grounds:
          - validations.priority_12
          - errors.ERR_DECISION_STAYED
        excluded_because:
          difficulty_instance: decision_effectiveness_gated_by_appeal_stay
          rationale: "The §1.8 instance decision_effectiveness_gated_by_appeal_stay already files an appeal with stay_requested true, shows the make-effective call returning HTTP 409 ERR_DECISION_STAYED while the stay holds, and shows the identical call succeeding once the appeal is decided AFFIRM and the stay dissolves."

      - name: corner_state_check_outranks_capacity_on_aoi_creation
        claim_type: priority_ordering
        grounds:
          - validations.priority_8
          - validations.priority_30
        excluded_because:
          difficulty_instance: state_beats_fiscal_on_aoi_creation
          rationale: "The §1.8 instance state_beats_fiscal_on_aoi_creation already constructs a request that violates BOTH the parent-permit state rule (priority 8) and the allotment capacity rule (priority 30) and pins the response to the priority-8 code, then repairs the state violation alone to expose the priority-30 code underneath — the ordering claim in full."

      - name: corner_closure_outranks_base_property_ownership_on_transfer
        claim_type: priority_ordering
        grounds:
          - validations.priority_9
          - validations.priority_13
        excluded_because:
          difficulty_instance: safety_beats_referential_on_permit_transfer
          rationale: "The §1.8 instance safety_beats_referential_on_permit_transfer already sends one transfer that violates both priority 9 (the allotment is CLOSED under a FULL_CLOSURE order) and priority 13 (the body reuses the TRANSFEROR's base property, which the transferee does not own), pins the answer to ERR_ALLOTMENT_CLOSED, then lifts the closure to reveal ERR_BASE_PROPERTY_NOT_OWNED underneath and finally succeeds with a properly owned base property."

  - section: endpoints
    instances:
      - name: corner_allotment_closure_order_listing_filters_and_paginates
        claim_type: cross_reference_link
        grounds:
          - endpoints.GET_/allotments/{allotmentId}/closure-orders
          - entities.ClosureOrder.allotment_id
        distinguishing_aspect: "The nested listing is the only reverse path from an Allotment to its ClosureOrders, and it exposes LIFTED orders as well as ACTIVE ones: with one lifted and one active order the unfiltered list returns both, order_status narrows to exactly one each, an order_type that was never issued returns an empty page, and limit/offset page the collection while total_count stays 2."
        test_recipe:
          setup:
            - "One 1000-AUM allotment with one LIFTED DROUGHT_REDUCTION order and one later ACTIVE DROUGHT_REDUCTION order"
          setup_api_calls:
            - call: "POST /allotments"
              payload: { name: "Closure Listing Allotment", admin_unit_code: "NV-160", acres: 30000, total_permitted_aums: 1000, season_start: "01-01", season_end: "12-31", required_pasture_rotation_count: 1 }
              as: AuthorizedOfficer
              as_user_id: "u_officer_1"
              captures: { c_a57_id: "$.data.id" }
            - call: "POST /closure-orders"
              payload: { allotment_id: "${c_a57_id}", order_type: "DROUGHT_REDUCTION", effective_start_date: "2026-08-05", effective_end_date: "2026-08-31", justification: "August precipitation 42 percent of normal on the upper pastures.", reduction_pct: 0.30 }
              as: AuthorizedOfficer
              as_user_id: "u_officer_1"
              captures: { c_co4_id: "$.data.id" }
            - call: "POST /closure-orders/${c_co4_id}/lift"
              payload: { justification: "Monsoon rainfall restored forage on the upper pastures." }
              as: AuthorizedOfficer
              as_user_id: "u_officer_1"
            - call: "POST /closure-orders"
              payload: { allotment_id: "${c_a57_id}", order_type: "DROUGHT_REDUCTION", effective_start_date: "2026-09-08", effective_end_date: "2026-10-31", justification: "Renewed drying trend recorded at the Sec 12 monitoring plot.", reduction_pct: 0.20 }
              as: AuthorizedOfficer
              as_user_id: "u_officer_1"
              captures: { c_co5_id: "$.data.id" }
          trigger:
            - call: "GET /allotments/${c_a57_id}/closure-orders"
              payload: {}
              as: RangeSpecialist
              as_user_id: "u_spec_1"
            - call: "GET /allotments/${c_a57_id}/closure-orders"
              payload: { order_status: "ACTIVE" }
              as: RangeSpecialist
              as_user_id: "u_spec_1"
            - call: "GET /allotments/${c_a57_id}/closure-orders"
              payload: { order_status: "LIFTED" }
              as: RangeSpecialist
              as_user_id: "u_spec_1"
            - call: "GET /allotments/${c_a57_id}/closure-orders"
              payload: { order_type: "FULL_CLOSURE" }
              as: RangeSpecialist
              as_user_id: "u_spec_1"
            - call: "GET /allotments/${c_a57_id}/closure-orders"
              payload: { limit: 1, offset: 1 }
              as: RangeSpecialist
              as_user_id: "u_spec_1"
          assert:
            - "first call: HTTP 200 with total_count 2 and both ${c_co4_id} and ${c_co5_id} present"
            - "second call: total_count 1 and the only item is ${c_co5_id} with order_status \"ACTIVE\" and reduction_pct 0.20"
            - "third call: total_count 1 and the only item is ${c_co4_id} with order_status \"LIFTED\""
            - "fourth call: HTTP 200 with total_count 0 and an empty items array (not a 404)"
            - "fifth call: HTTP 200 with exactly 1 item and total_count 2 (total_count counts the filtered collection, not the page)"
            - "GET /allotments/${c_a57_id} returns stocking_adjustment_pct 0.2000 and effective_capacity_aums 800 — only the ACTIVE order contributes"

      - name: corner_permit_transfer_creates_a_linked_successor
        claim_type: action_endpoint
        grounds:
          - endpoints.POST_/grazing-permits/{permitId}/transfer
          - validations.priority_8
          - validations.priority_15
          - errors.ERR_PERMIT_STATE_INVALID
        distinguishing_aspect: "The transfer endpoint returns 201 with the SUCCESSOR permit (not the source), and the successor starts in PENDING_REVIEW carrying predecessor_permit_id while the source becomes TRANSFERRED. Replaying the transfer violates BOTH priority 8 (the source is no longer ISSUED) and priority 15 (it already has a successor), and priority 8 wins: the answer is HTTP 409 ERR_PERMIT_STATE_INVALID, never ERR_PREDECESSOR_PERMIT_INVALID."
