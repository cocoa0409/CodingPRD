      - name: capped_total_stack_edges_require_a_cap_amount_that_allowed_edges_must_omit
        claim_type: conditional_validation
        grounds:
          - validations[priority=6]
          - validations[priority=26]
          - entities.StackabilityConstraint
        distinguishing_aspect: "cap_amount_cents is required exactly when mode == CAPPED_TOTAL, so BOTH a missing cap on a capped edge and a present cap on an ALLOWED edge are ERR_INVALID_REQUEST — the conditional is an iff, not a one-way requirement. The same instance then trips the unordered-pair and self-edge halves of priority 26, which is the only place ERR_INVALID_STACK_EDGE is reachable."
        test_recipe:
          setup:
            - "Two DRAFT programs P and Q (never submitted, so the overlap rule at priority 12 is never consulted)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00.000Z" }
              as: IncentiveController
              as_user_id: "u-controller-1"
            - call: "POST /incentives/programs"
              payload: { program_code: "CRN-V-EDGP", name: "Edge Program P", incentive_type: "CUSTOMER_CASH", effective_from: "2026-08-01T00:00:00.000Z", effective_to: "2026-09-01T00:00:00.000Z", per_unit_amount_cents: 100000, budget_cents: 1000000, stack_group: "CRNEDG", priority_rank: 415, accrual_method: "UNIT_BASED" }
              as: ProgramDesigner
              as_user_id: "u-designer-1"
              captures: { p_id: $.data.id }
            - call: "POST /incentives/programs"
              payload: { program_code: "CRN-V-EDGQ", name: "Edge Program Q", incentive_type: "LEASE_SUPPORT", effective_from: "2026-08-01T00:00:00.000Z", effective_to: "2026-09-01T00:00:00.000Z", per_unit_amount_cents: 50000, budget_cents: 1000000, stack_group: "CRNEDG", priority_rank: 416, accrual_method: "UNIT_BASED" }
              as: ProgramDesigner
              as_user_id: "u-designer-1"
              captures: { q_id: $.data.id }
          trigger:
            - call: "POST /incentives/programs/${p_id}/stackability-constraints"
              payload: { program_b_id: "${q_id}", mode: "CAPPED_TOTAL" }
              as: ProgramDesigner
              as_user_id: "u-designer-1"
              captures: { err_missing_cap: $.data.error_id }
            - call: "POST /incentives/programs/${p_id}/stackability-constraints"
              payload: { program_b_id: "${q_id}", mode: "ALLOWED", cap_amount_cents: 500000 }
              as: ProgramDesigner
              as_user_id: "u-designer-1"
              captures: { err_extra_cap: $.data.error_id }
            - call: "POST /incentives/programs/${p_id}/stackability-constraints"
              payload: { program_b_id: "${p_id}", mode: "FORBIDDEN" }
              as: ProgramDesigner
              as_user_id: "u-designer-1"
              captures: { err_self: $.data.error_id }
            - call: "POST /incentives/programs/${p_id}/stackability-constraints"
              payload: { program_b_id: "${q_id}", mode: "CAPPED_TOTAL", cap_amount_cents: 500000 }
              as: ProgramDesigner
              as_user_id: "u-designer-1"
              captures: { edge_id: $.data.id, edge_mode: $.data.mode, edge_cap: $.data.cap_amount_cents, edge_a: $.data.program_a_id, edge_b: $.data.program_b_id }
            - call: "POST /incentives/programs/${q_id}/stackability-constraints"
              payload: { program_b_id: "${p_id}", mode: "FORBIDDEN" }
              as: ProgramDesigner
              as_user_id: "u-designer-1"
              captures: { err_reverse: $.data.error_id }
            - call: "GET /incentives/programs/${q_id}/stackability-constraints"
              payload: {}
              as: ProgramDesigner
              as_user_id: "u-designer-1"
              captures: { q_edge_mode: "$.data[0].mode", q_edge_cap: "$.data[0].cap_amount_cents" }
          assert:
            - "${err_missing_cap} == ERR_INVALID_REQUEST (400): CAPPED_TOTAL without cap_amount_cents fails the shape check at priority 6"
            - "${err_extra_cap} == ERR_INVALID_REQUEST (400): a cap supplied on an ALLOWED edge is equally invalid — the scaffold says non-null EXACTLY when mode == CAPPED_TOTAL"
            - "${err_self} == ERR_INVALID_STACK_EDGE (409): program_b_id equal to the path program is a sanity failure, not a 400"
            - "${edge_mode} == CAPPED_TOTAL, ${edge_cap} == 500000, ${edge_a} == ${p_id} and ${edge_b} == ${q_id}"
            - "${err_reverse} == ERR_INVALID_STACK_EDGE (409): the pair is UNORDERED, so Q -> P collides with the stored P -> Q even though the mode differs and no (program_a_id, program_b_id) tuple repeats"
            - "${q_edge_mode} == CAPPED_TOTAL and ${q_edge_cap} == 500000 — the single row is visible from BOTH endpoints of the pair, which is what makes the unordered-pair uniqueness check meaningful"
            - "the three failures created no constraint row at all: Q lists exactly one edge"

