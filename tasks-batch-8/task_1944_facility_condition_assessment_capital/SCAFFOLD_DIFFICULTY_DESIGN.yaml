  - rule_id: compensating_invariant
    instances:
      - name: defer_reopen_leaves_backlog_and_fci_unchanged
        grounds:
          - state_machines.Deficiency
          - calculations.facility_condition_index
        distinguishing_aspect: |
          Conserved quantity: Facility.backlog_cost_cents (and therefore facility_condition_index).
          The forward action defer (OPEN -> DEFERRED) paired with its compensating reopen
          (DEFERRED -> OPEN) must leave backlog and FCI bit-identical, since both states remain in
          the backlog inclusion set.
        test_recipe:
          setup:
            - "Facility F, one ACTIVE system replacement 200000000; deficiency D cost 10000000 sev 3 urg 3 rec 2028 OPEN (FCI 0.0500)"
          setup_api_calls:
            - call: "POST /fca/clients"
              payload: { name: "Rho BV", contact_email: "r@rho.example" }
              as: Consultant
              captures: { client_id: "$.data.id" }
            - call: "POST /fca/facilities"
              payload: { client_id: "${client_id}", name: "Theater", address: "3 Stage Door", gross_square_feet: 18000 }
              as: Consultant
              captures: { fac_id: "$.data.id" }
            - call: "POST /fca/asset-systems"
              payload: { facility_id: "${fac_id}", system_category: "INTERIOR", name: "Seating", install_year: 2010, design_life_years: 20, replacement_cost_cents: 200000000, condition_rating: 3 }
              as: Consultant
              captures: { sys_id: "$.data.id" }
            - call: "POST /fca/deficiencies"
              payload: { asset_system_id: "${sys_id}", description: "Seat mechanism wear", cost_estimate_cents: 10000000, severity: 3, urgency: 3, recommended_year: 2028 }
              as: Consultant
              captures: { def_id: "$.data.id" }
            - call: "GET /fca/facilities/${fac_id}"
              payload: {}
              as: Consultant
              captures: { fci_before: "$.data.facility_condition_index", backlog_before: "$.data.backlog_cost_cents" }
          trigger:
            - call: "POST /fca/deficiencies/${def_id}/defer"
              payload: {}
              as: FacilityManager
            - call: "POST /fca/deficiencies/${def_id}/reopen"
              payload: {}
              as: FacilityManager
            - call: "GET /fca/facilities/${fac_id}"
              payload: {}
              as: Consultant
              captures: { fci_after: "$.data.facility_condition_index", backlog_after: "$.data.backlog_cost_cents" }
          assert:
            - "Facility.${fac_id}.backlog_cost_cents == 10000000 before and after the defer/reopen round trip"
            - "Facility.${fac_id}.facility_condition_index == 0.0500 before and after (invariant: backlog and FCI conserved)"
            - "Deficiency.${def_id}.remediation_status == OPEN after the round trip; version incremented by 2"
      - name: reject_assessment_restores_prior_snapshot_values
        grounds:
          - state_machines.AssetSystem.REASSESSED_to_ACTIVE
          - entities.ConditionSnapshot
        distinguishing_aspect: |
          Conserved quantity: AssetSystem.condition_rating / remaining_useful_life_years as recorded
          in the ConditionSnapshot audit log. The forward assess action paired with the compensating
          reject-assessment must restore the exact pre-assess snapshot values — a different conserved
          quantity (per-system rating/RUL pair) than facility backlog dollars.
        test_recipe:
          setup:
            - "Facility F, one ACTIVE system (install 2010, design 25, rating 4 -> RUL 9), RefreshCycle open epoch 1"
          setup_api_calls:
            - call: "POST /fca/clients"
              payload: { name: "Sigma KK", contact_email: "s@sigma.example" }
              as: Consultant
              captures: { client_id: "$.data.id" }
            - call: "POST /fca/facilities"
              payload: { client_id: "${client_id}", name: "Brewery", address: "7 Malt St", gross_square_feet: 22000 }
              as: Consultant
              captures: { fac_id: "$.data.id" }
            - call: "POST /fca/asset-systems"
              payload: { facility_id: "${fac_id}", system_category: "PLUMBING", name: "Process Water", install_year: 2010, design_life_years: 25, replacement_cost_cents: 60000000, condition_rating: 4 }
              as: Consultant
              captures: { sys_id: "$.data.id" }
            - call: "POST /fca/facilities/${fac_id}/refresh-cycles"
              payload: {}
              as: Consultant
              captures: { cyc_id: "$.data.id" }
          trigger:
            - call: "POST /fca/asset-systems/${sys_id}/assess"
              payload: { condition_rating: 1, note: "catastrophic corrosion observed" }
              as: Consultant
            - call: "GET /fca/asset-systems/${sys_id}"
              payload: {}
              as: Consultant
              captures: { rul_mid: "$.data.remaining_useful_life_years", rating_mid: "$.data.condition_rating" }
            - call: "POST /fca/asset-systems/${sys_id}/reject-assessment"
              payload: {}
              as: FacilityManager
            - call: "GET /fca/asset-systems/${sys_id}"
              payload: {}
              as: Consultant
              captures: { rul_end: "$.data.remaining_useful_life_years", rating_end: "$.data.condition_rating" }
          assert:
            - "mid-flight: condition_rating == 1 and remaining_useful_life_years == 0 (rating-1 rule forces RUL 0)"
            - "after reject-assessment: condition_rating == 4 and remaining_useful_life_years == 9 (restored to the pre-assess snapshot pair — compensating invariant holds)"
            - "AssetSystem.${sys_id}.status == ACTIVE after reject"
            - "the assess-time ConditionSnapshot remains in the audit log (append-only), so history is conserved even though live values reverted"
