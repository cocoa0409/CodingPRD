            - { call: "POST /itad/recycle-batches", payload: { recycler_id: "${rec}", scheduled_delivery_date: "2026-06-10T00:00:00Z", is_export: false }, as: LogisticsCoordinator, captures: { b2: $.data.id } }
          assert:
            - "is_export true -> ERR_EXPORT_NOT_ALLOWED; is_export false -> batch created (${b2} exists)"

      - name: policy_method_restriction_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=15]", "errors[ERR_SANITIZATION_METHOD_NOT_ALLOWED]"]
        distinguishing_aspect: "The ACTIVE policy allows only NIST_PURGE and PHYSICAL_DESTROY; logging a NIST_CLEAR attempt is rejected."
