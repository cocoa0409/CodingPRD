    code: 200
    input: ["site_id?", "status?", "limit?", "offset?"]
    output: Complaint[]
    side_effects: []

  - method: POST
    path: "/complaints/{complaintId}/acknowledge"
    description: "Acknowledge an open complaint"
    roles: [FieldSupervisor]
    code: 200
    input: []
    output: Complaint
    side_effects: ["status -> ACKNOWLEDGED; recompute Account.open_complaint_count"]

  - method: POST
    path: "/complaints/{complaintId}/schedule-callback"
    description: "Schedule a callback visit for an acknowledged complaint"
    roles: [FieldSupervisor]
    code: 200
    input: [crew_id, service_date, planned_start_min, planned_end_min]
    output: Complaint
    side_effects: ["creates CALLBACK Visit; callback_visit_id set; status -> CALLBACK_SCHEDULED"]

  - method: POST
    path: "/complaints/{complaintId}/resolve"
    description: "Resolve a complaint once its callback visit is complete"
    roles: [FieldSupervisor]
    code: 200
    input: []
    output: Complaint
    side_effects: ["credit_applied_cents computed; credit posted to OPEN BillingPeriod; status -> RESOLVED; recompute Account.open_complaint_count"]

  - method: POST
    path: "/complaints/{complaintId}/reopen"
    description: "Reopen a resolved MAJOR complaint"
    roles: [ClientContact]
    code: 200
    input: []
    output: Complaint
    side_effects: ["status -> OPEN; callback_visit_id cleared; recompute Account.open_complaint_count"]

  # --- BillingPeriod ---
  - method: POST
    path: "/billing-periods"
    description: "Open a billing period for an ACTIVE contract/month"
    roles: [AccountManager]
    code: 201
    input: [contract_id, period_month]
    output: BillingPeriod
    side_effects: ["status=OPEN; base_cents snapshot from contract; total_cents=base_cents; uniqueness (contract,month) enforced"]

  - method: GET
    path: "/billing-periods/{billingPeriodId}"
    description: "Get a billing period (provisional or final totals)"
    roles: [AccountManager]
    code: 200
    input: []
    output: BillingPeriod
    side_effects: []

  - method: GET
    path: "/billing-periods"
    description: "List billing periods, filtered by contract"
    roles: [AccountManager]
    code: 200
    input: ["contract_id?", "status?", "limit?", "offset?"]
    output: BillingPeriod[]
    side_effects: []

  - method: POST
    path: "/billing-periods/{billingPeriodId}/close"
    description: "Close a billing period; finalize totals and emit invoice lines"
    roles: [AccountManager]
    code: 200
    input: [expected_account_version]
    output: BillingPeriod
    side_effects: ["final compute_period_total; emits InvoiceLines; status -> CLOSED; increments Account.version by 1"]

  - method: POST
    path: "/billing-periods/{billingPeriodId}/reopen"
    description: "Reopen a closed billing period; delete its invoice lines"
    roles: [AccountManager]
    code: 200
    input: [expected_account_version]
    output: BillingPeriod
    side_effects: ["deletes InvoiceLines; status -> REOPENED; increments Account.version by 1"]

  - method: POST
    path: "/billing-periods/{billingPeriodId}/invoice"
    description: "Mark a closed billing period as invoiced (freeze)"
    roles: [AccountManager]
    code: 200
    input: []
    output: BillingPeriod
    side_effects: ["status -> INVOICED"]

  - method: GET
    path: "/billing-periods/{billingPeriodId}/invoice-lines"
    description: "List the invoice lines emitted for a billing period"
    roles: [AccountManager]
    code: 200
    input: ["limit?", "offset?"]
    output: InvoiceLine[]
    side_effects: []

  # --- SupplyOrder ---
  - method: POST
    path: "/supply-orders"
    description: "Order consumables/supplies for a site"
    roles: [FieldSupervisor, AccountManager]
    code: 201
    input: [site_id, sku, quantity]
    output: SupplyOrder
    side_effects: ["status=REQUESTED"]

  - method: GET
    path: "/supply-orders/{supplyOrderId}"
    description: "Get a supply order"
    roles: [AccountManager, FieldSupervisor]
    code: 200
    input: []
    output: SupplyOrder
    side_effects: []

  - method: GET
    path: "/supply-orders"
    description: "List supply orders, filtered by site"
    roles: [AccountManager, FieldSupervisor]
    code: 200
    input: ["site_id?", "limit?", "offset?"]
    output: SupplyOrder[]
    side_effects: []

  - method: POST
    path: "/supply-orders/{supplyOrderId}/fulfill"
    description: "Mark a supply order fulfilled"
    roles: [FieldSupervisor]
    code: 200
    input: []
    output: SupplyOrder
    side_effects: ["status -> FULFILLED"]

  - method: POST
    path: "/supply-orders/{supplyOrderId}/cancel"
    description: "Cancel a requested supply order"
    roles: [AccountManager, FieldSupervisor]
    code: 200
    input: []
    output: SupplyOrder
    side_effects: ["status -> CANCELLED"]

  # --- Test-driving clock (outside business surface) ---
  - method: POST
    path: "/_clock/set"
    description: "Set the server's current local date/time (test-driving endpoint)"
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["server clock advanced for service_date/period-month derivations"]

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/unknown X-User-Role or X-User-ID header" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted for this operation per RBAC" }
  - { id: ERR_NOT_SITE_CONTACT, http: 403, condition: "ClientContact X-User-ID does not match the target Site.contact_user_id" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path-referenced resource does not exist" }
  - { id: ERR_FK_NOT_FOUND, http: 404, condition: "Body foreign key references a non-existent resource" }
  - { id: ERR_INVALID_REQUEST, http: 422, condition: "Malformed body: missing required field, bad enum, out-of-range number, or window/clock end <= start" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Resource not in a state from which the requested transition is defined" }
  - { id: ERR_ACCOUNT_NOT_ACTIVE, http: 409, condition: "Operation requires the owning Account to be ACTIVE" }
  - { id: ERR_SITE_ARCHIVED, http: 409, condition: "Operation requires the Site to be ACTIVE but it is ARCHIVED" }
  - { id: ERR_CONTRACT_NOT_ACTIVE, http: 409, condition: "Operation requires an ACTIVE ServiceContract for the site" }
  - { id: ERR_CREW_INACTIVE, http: 409, condition: "Referenced crew member is INACTIVE and cannot be assigned/clocked" }
  - { id: ERR_FLOOR_INELIGIBLE, http: 409, condition: "STRIP_WAX periodic job dispatched on a non-VCT/TERRAZZO floor" }
  - { id: ERR_NO_TIME_ENTRY, http: 409, condition: "Completing a visit with no COMPLETED time entry" }
  - { id: ERR_OPEN_TIME_ENTRY, http: 409, condition: "Completing a visit while a time entry is still OPEN" }
  - { id: ERR_INVALID_CLOCK_RANGE, http: 422, condition: "clock_out_min <= clock_in_min on clock-out" }
  - { id: ERR_SHIFT_CAPACITY_EXCEEDED, http: 409, condition: "Crew's daily clocked minutes would exceed shift_capacity_min" }
  - { id: ERR_CREW_DOUBLE_BOOKED, http: 409, condition: "New visit interval overlaps an existing non-terminal visit for the same crew on the same service_date" }
  - { id: ERR_SCHEDULE_WINDOW_CONFLICT, http: 409, condition: "Schedule window overlaps/touches another ACTIVE schedule for the same crew on the same weekday" }
  - { id: ERR_CALLBACK_NOT_COMPLETE, http: 409, condition: "Resolving a complaint whose callback visit is not COMPLETED" }
  - { id: ERR_REOPEN_NOT_ALLOWED, http: 409, condition: "Reopening a non-MAJOR resolved complaint" }
  - { id: ERR_DUPLICATE_PERIOD, http: 409, condition: "A BillingPeriod for (contract, period_month) already exists" }
  - { id: ERR_PERIOD_OPEN, http: 409, condition: "Terminating a contract that still has an OPEN/REOPENED billing period" }
  - { id: ERR_VISIT_IN_PROGRESS, http: 409, condition: "Closing a billing period while a captured visit is IN_PROGRESS" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_account_version does not match current Account.version on billing-period close/reopen" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: AccountManager
    description: "Owns accounts, sites, contracts, periodic-job requests, complaints intake, and the whole billing lifecycle."
    identity: opaque
    exclusive_operations:
      - "POST /accounts — create account"
      - "POST /accounts/{id}/suspend — suspend account"
      - "POST /sites — create site"
      - "POST /sites/{id}/archive — archive site"
      - "POST /contracts — create contract"
      - "POST /contracts/{id}/activate — activate contract"
      - "POST /contracts/{id}/terminate — terminate contract"
      - "POST /periodic-jobs — request periodic job"
      - "POST /periodic-jobs/{id}/cancel — cancel periodic job"
      - "POST /billing-periods — open period"
      - "POST /billing-periods/{id}/close — close period"
      - "POST /billing-periods/{id}/reopen — reopen period"
      - "POST /billing-periods/{id}/invoice — invoice period"
      - "GET /billing-periods, GET /billing-periods/{id}, GET /billing-periods/{id}/invoice-lines"
    shared_operations:
      - "GET /accounts/{id}, GET /sites/{id}, GET /sites, GET /contracts*, GET /crew*, GET /schedules*, GET /visits*, GET /time-entries*, GET /inspections*, GET /periodic-jobs*, GET /complaints*, GET /supply-orders*"
      - "POST /crew — create crew (shared with FieldSupervisor)"
      - "POST /complaints — raise complaint (shared with ClientContact)"
      - "POST /supply-orders, POST /supply-orders/{id}/cancel (shared with FieldSupervisor)"

  - name: FieldSupervisor
    description: "Runs field operations: schedules/routes, visits, time clock, inspections, periodic dispatch, complaint workflow, supply fulfillment."
    identity: opaque
    exclusive_operations:
      - "POST /crew/{id}/deactivate — deactivate crew"
      - "POST /schedules, POST /schedules/{id}/pause, POST /schedules/{id}/resume — manage schedules"
      - "POST /visits, POST /visits/{id}/start|complete|miss|cancel — manage visits"
      - "POST /time-entries, POST /time-entries/{id}/clock-out|void — time clock"
      - "POST /inspections — record inspection"
      - "POST /periodic-jobs/{id}/dispatch — dispatch periodic job"
      - "POST /complaints/{id}/acknowledge|schedule-callback|resolve — complaint workflow"
      - "POST /supply-orders/{id}/fulfill — fulfill supply order"
    shared_operations:
      - "POST /crew — create crew (shared with AccountManager)"
      - "POST /supply-orders, POST /supply-orders/{id}/cancel (shared with AccountManager)"
      - "GET reads across sites, schedules, visits, time-entries, inspections, periodic-jobs, complaints, supply-orders, crew, accounts/{id}"

  - name: ClientContact
    description: "A site's designated client contact. Raises and reopens complaints for their own site and views their own site's records. X-User-ID must equal Site.contact_user_id."
    identity: opaque
    exclusive_operations:
      - "POST /complaints/{id}/reopen — reopen a resolved MAJOR complaint for own site"
    shared_operations:
      - "POST /complaints — raise complaint for own site (shared with AccountManager)"
      - "GET /sites/{id}, GET /visits/{id}, GET /inspections/{id}, GET /complaints/{id} — read own-site records"

  - name: PlatformAdmin
    description: "Operational role for the test-driving clock surface only."
    identity: opaque
    exclusive_operations:
      - "POST /_clock/set — set server clock"
    shared_operations: []
