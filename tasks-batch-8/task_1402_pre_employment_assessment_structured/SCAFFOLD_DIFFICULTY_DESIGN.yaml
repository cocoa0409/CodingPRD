            - { call: "POST /talent/cycles/${cy_raw}/sessions", payload: { candidate_id: "${cr1}", interviewer_id: "${iv2}", guide_id: "${g_raw}", scheduled_start: "2026-08-12T09:00:00Z", scheduled_end: "2026-08-12T10:00:00Z" }, as: HiringManager, as_user_id: hm-1, captures: { s_r1b: $.data.id } }
            - { call: "POST /talent/cycles/${cy_raw}/sessions", payload: { candidate_id: "${cr2}", interviewer_id: "${iv1}", guide_id: "${g_raw}", scheduled_start: "2026-08-13T09:00:00Z", scheduled_end: "2026-08-13T10:00:00Z" }, as: HiringManager, as_user_id: hm-1, captures: { s_r2a: $.data.id } }
