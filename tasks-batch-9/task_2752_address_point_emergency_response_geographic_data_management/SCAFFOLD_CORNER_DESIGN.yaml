            - "${nest_err} == \"ERR_SUBADDRESS_PARENT_INVALID\"   # units may not nest under units"
            - "AddressPoint.${base_id}.unit_child_count == 1   # only U1 was ever attached"
            - "AddressPoint.${u1_id}.unit_child_count == 0"
            - "RoadCenterline.${road_id}.assignable_slot_count_left == 49"

      - name: zero_length_and_inverted_boundary_windows_rejected
        claim_type: temporal_validation
        grounds:
          - validations[priority=30]
          - errors.ERR_BOUNDARY_WINDOW_INVALID
        distinguishing_aspect: "The window test is effective_end <= effective_start, so the zero-length window (end == start) is refused just like the inverted one, while end one second after start is accepted — this is what makes the half-open [start, end) convention coherent."
        test_recipe:
          setup:
            - "One jurisdiction LARCO and one ACTIVE LAW agency in it."
          setup_api_calls:
            - call: "POST /gis/jurisdictions"
              payload: { name: "Larimer County", code: "LARCO", jurisdiction_type: "COUNTY", postal_city: "FORT COLLINS" }
              as: SystemAdmin
              as_user_id: "sysadmin-1"
              captures: { j_id: $.data.id }
            - call: "POST /gis/agencies"
              payload: { name: "Larimer County Sheriff", agency_type: "LAW", jurisdiction_id: "${j_id}" }
              as: SystemAdmin
              as_user_id: "sysadmin-1"
              captures: { ag_id: $.data.id }
          trigger:
            - call: "POST /gis/emergency-service-boundaries"
              payload: { agency_id: "${ag_id}", effective_start: "2026-09-01T00:00:00Z", effective_end: "2026-09-01T00:00:00Z" }
              as: AgencyLiaison
              as_user_id: "${ag_id}"
              captures: { zero_err: $.data.error_id }
            - call: "POST /gis/emergency-service-boundaries"
              payload: { agency_id: "${ag_id}", effective_start: "2026-09-01T00:00:00Z", effective_end: "2026-08-01T00:00:00Z" }
              as: AgencyLiaison
              as_user_id: "${ag_id}"
              captures: { inv_err: $.data.error_id }
            - call: "POST /gis/emergency-service-boundaries"
              payload: { agency_id: "${ag_id}", effective_start: "2026-09-01T00:00:00Z", effective_end: "2026-09-01T00:00:01Z" }
              as: AgencyLiaison
              as_user_id: "${ag_id}"
              captures: { ok_id: $.data.id }
          assert:
            - "the zero-length call returns status_code 422 with ${zero_err} == \"ERR_BOUNDARY_WINDOW_INVALID\""
            - "the inverted call returns status_code 422 with ${inv_err} == \"ERR_BOUNDARY_WINDOW_INVALID\""
            - "the one-second window returns status_code 201"
            - "EmergencyServiceBoundary.${ok_id}.status == \"DRAFT\" and service_type == \"LAW\""
            - "EmergencyServiceBoundary.${ok_id}.jurisdiction_id == \"${j_id}\" and version == 1"
            - "GET /gis/emergency-service-boundaries with agency_id ${ag_id} returns meta.total_count == 1"

      - name: cell_assignment_window_must_be_contained_in_the_boundary_window
        claim_type: temporal_validation
        grounds:
          - validations[priority=30]
          - entities.BoundaryCellAssignment
        distinguishing_aspect: "Containment is checked against the boundary's own half-open window: an assignment running to 2026-09-15 under a boundary that ends 2026-09-01 is refused 422 ERR_BOUNDARY_WINDOW_INVALID, while the identical assignment truncated to the boundary's end is accepted — and the refusal leaves the boundary version at 1 so the same expected_boundary_version can be replayed."
        test_recipe:
          setup:
            - "One jurisdiction LARCO with cell C001 and one ACTIVE LAW agency."
            - "One DRAFT boundary with window [2026-08-01, 2026-09-01)."
          setup_api_calls:
            - call: "POST /gis/jurisdictions"
              payload: { name: "Larimer County", code: "LARCO", jurisdiction_type: "COUNTY", postal_city: "FORT COLLINS" }
              as: SystemAdmin
              as_user_id: "sysadmin-1"
              captures: { j_id: $.data.id }
            - call: "POST /gis/coverage-cells"
              payload: { cell_code: "C001", jurisdiction_id: "${j_id}" }
              as: GisAnalyst
              as_user_id: "analyst-1"
              captures: { cell_id: $.data.id }
            - call: "POST /gis/agencies"
              payload: { name: "Larimer County Sheriff", agency_type: "LAW", jurisdiction_id: "${j_id}" }
              as: SystemAdmin
              as_user_id: "sysadmin-1"
              captures: { ag_id: $.data.id }
            - call: "POST /gis/emergency-service-boundaries"
              payload: { agency_id: "${ag_id}", effective_start: "2026-08-01T00:00:00Z", effective_end: "2026-09-01T00:00:00Z" }
              as: AgencyLiaison
              as_user_id: "${ag_id}"
              captures: { b_id: $.data.id, b_ver: $.data.version }
          trigger:
            - call: "POST /gis/emergency-service-boundaries/${b_id}/cell-assignments"
              payload: { cell_id: "${cell_id}", effective_start: "2026-08-15T00:00:00Z", effective_end: "2026-09-15T00:00:00Z", expected_boundary_version: "${b_ver}" }
              as: AgencyLiaison
              as_user_id: "${ag_id}"
              captures: { err_id: $.data.error_id }
            - call: "POST /gis/emergency-service-boundaries/${b_id}/cell-assignments"
              payload: { cell_id: "${cell_id}", effective_start: "2026-08-15T00:00:00Z", effective_end: "2026-09-01T00:00:00Z", expected_boundary_version: "${b_ver}" }
              as: AgencyLiaison
              as_user_id: "${ag_id}"
              captures: { asg_id: $.data.id }
          assert:
            - "the over-running assignment returns status_code 422 with ${err_id} == \"ERR_BOUNDARY_WINDOW_INVALID\""
            - "after the refusal EmergencyServiceBoundary.${b_id}.version == 1 and assigned_cell_count == 0"
            - "the contained assignment returns status_code 201"
            - "BoundaryCellAssignment.${asg_id}.status == \"PENDING\" and service_type == \"LAW\""
            - "BoundaryCellAssignment.${asg_id}.effective_end == \"2026-09-01T00:00:00.000Z\"   # sharing the boundary's end is containment, not a violation"
            - "EmergencyServiceBoundary.${b_id}.version == 2 after the accepted assignment"

      - name: cell_assignment_cell_must_share_the_agency_jurisdiction
        claim_type: cross_entity_validation
        grounds:
          - validations[priority=30]
          - entities.CoverageCell
          - entities.Agency
        distinguishing_aspect: "A cell that exists but belongs to a different jurisdiction is a 422 ERR_BOUNDARY_WINDOW_INVALID, not a 404 ERR_CELL_NOT_FOUND — the reference resolves, the cross-jurisdiction relation is what fails."
        test_recipe:
          setup:
            - "Two jurisdictions: LARCO (with cell C001) and WELDCO (with cell C900)."
            - "One ACTIVE LAW agency in LARCO with a DRAFT boundary [2026-08-01, null)."
          setup_api_calls:
            - call: "POST /gis/jurisdictions"
