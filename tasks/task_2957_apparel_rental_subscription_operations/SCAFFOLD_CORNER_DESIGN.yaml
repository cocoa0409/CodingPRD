      - name: validation_sale_below_the_discount_floor_is_refused_then_the_floor_price_sells
        claim_type: violation_error
        grounds:
          - "validations.priority 55"
          - "errors[ERR_SALE_PRICE_BELOW_FLOOR]"
          - "calculations.constants MAX_SALE_DISCOUNT_PCT"
          - "calculations.resale_pricing"
          - "endpoints.POST /resale-listings/{listing_id}/sale"
          - "state_machines.RentalUnit.transitions.RETIRED_to_SOLD"
        distinguishing_aspect: >-
          The floor is round_half_up(21600 * (1 - 0.10)) == 19440, so 19439 is one cent under and must be refused
          with 422 while 19440 lands exactly on the boundary and sells. The sale then recomputes the channel fee
          from the SALE price rather than the list price: 2333 rather than 2592, with net_recovery_cents 19440 -
          2333 - 400 == 16707, and the unit reaches its terminal SOLD.
        test_recipe:
          setup:
            - "logical clock parked at 2026-08-03T09:00:00Z"
            - "style AUR-GOWN-01 with retail_price_cents 48000"
            - "one grade-A size-M unit AUR-GOWN-001, retired with retirement_reason PLANNED_REFRESH"
            - "an OUTLET listing on that unit in state LISTED at markdown_step 0 with list_price_cents 21600, channel_fee_cents 2592 and net_recovery_cents 18608"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /styles"
              payload: { style_code: "AUR-GOWN-01", brand: "Aurelia", category: "GOWN", retail_price_cents: 48000, acquisition_cost_cents: 21000, size_run: ["S", "M", "L"], expected_rental_turns_per_unit: 12, planned_eol_value_cents: 9000, forecast_monthly_requests: 8, avg_rental_days: 6, planned_depth_units: 3 }
              as: InventoryPlanner
              captures: { style_gown_id: "$.data.id" }
            - call: "POST /styles/${style_gown_id}/rental-units"
              payload: { unit_code: "AUR-GOWN-001", size: "M", acquisition_cost_cents: 21000, condition_grade: "A" }
              as: InventoryPlanner
              captures: { unit1_id: "$.data.id" }
            - call: "POST /rental-units/${unit1_id}/retirement"
              payload: { retirement_reason: "PLANNED_REFRESH" }
              as: InventoryPlanner
            - call: "GET /rental-units/${unit1_id}"
              payload: {}
              as: InventoryPlanner
              captures: { unit1_v: "$.data.version" }
            - call: "POST /resale-listings"
              payload: { rental_unit_id: "${unit1_id}", expected_rental_unit_version: "${unit1_v}", channel: "OUTLET" }
              as: InventoryPlanner
              captures: { listing1_id: "$.data.id" }
          trigger:
            - call: "POST /resale-listings/${listing1_id}/sale"
              payload: { sale_price_cents: 19439 }
              as: InventoryPlanner
            - call: "POST /resale-listings/${listing1_id}/sale"
              payload: { sale_price_cents: 19440 }
              as: InventoryPlanner
          assert:
            - "19439: HTTP 422 with error_id == ERR_SALE_PRICE_BELOW_FLOOR"
            - "19439: GET /resale-listings/${listing1_id} still reports state == LISTED and sold_at == null"
            - "19440: HTTP 200 with ResaleListing.state == SOLD and sale_price_cents == 19440"
            - "19440: ResaleListing.channel_fee_cents == 2333 and net_recovery_cents == 16707 and sold_at == 2026-08-03T09:00:00Z"
            - "19440: ResaleListing.list_price_cents is still 21600 and markdown_step is still 0"
            - "GET /rental-units/${unit1_id} reports availability_state == SOLD"
