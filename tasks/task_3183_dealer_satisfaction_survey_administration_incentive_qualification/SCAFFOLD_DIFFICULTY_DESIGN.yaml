  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_business_temporal_conflict_on_close
        grounds:
          - validations[priority=6]
          - validations[priority=9]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_WAVE_STILL_OPEN]
        distinguishing_aspect: |
          Priority conflict between category=state (priority 6) and
          category=business_temporal (priority 9): a wave in DRAFT being closed
          violates BOTH "must be OPEN to close" (state, ERR_INVALID_STATE) and
          "clock must be >= period_end" (business_temporal, ERR_WAVE_STILL_OPEN).
          The higher-priority state error must win.
        test_recipe:
          setup:
            - "Region SW; QS-I ACTIVE; Wave W9 [2026-09-01, 2026-10-01) QS-I in DRAFT."
            - "Logical clock 2026-09-15 (before period_end)."
          setup_api_calls:
            - call: "POST /survey/_clock/set_current_utc"
              payload: { current_utc: "2026-09-15T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /survey/regions"
              payload: { code: "SW", name: "Southwest" }
              as: PlatformAdmin
            - call: "POST /survey/question-sets"
              payload: { code: "QS-I", questions: [{question_code: "q1", prompt: "A", weight: 1}], comparability_factor: 1.0 }
              as: PlatformAdmin
              captures: { qs_id: $.data.id }
            - call: "POST /survey/question-sets/${qs_id}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /survey/waves"
              payload: { period_start: "2026-09-01T00:00:00Z", period_end: "2026-10-01T00:00:00Z", question_set_id: "${qs_id}" }
              as: PlatformAdmin
              captures: { wave_id: $.data.id }
          trigger:
            - call: "POST /survey/waves/${wave_id}/close"
              payload: {}
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE  # priority 6 state check fires before priority 9 temporal check"
            - "HTTP status == 409"

      - name: existence_vs_cross_reference_mismatch_conflict_on_transaction
        grounds:
          - validations[priority=4]
          - validations[priority=5]
          - errors[ERR_NOT_FOUND]
          - errors[ERR_CROSS_REFERENCE_MISMATCH]
        distinguishing_aspect: |
          Priority conflict between existence (priority 4) and
          business_referential/cross-reference (priority 5): posting a
          transaction with a non-existent dealer_id AND a mismatched
          (dealer, department) pair — if the dealer does not exist,
          ERR_NOT_FOUND must win even though the cross-reference would also
          be invalid. Different category pair from state_vs_temporal above.
        test_recipe:
          setup:
            - "Region SW; Dealer D10; Dept D10-SALES; Customer C10."
          setup_api_calls:
            - call: "POST /survey/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /survey/regions"
              payload: { code: "SW", name: "Southwest" }
              as: PlatformAdmin
              captures: { region_id: $.data.id }
            - call: "POST /survey/dealers"
              payload: { region_id: "${region_id}", name: "D10", dealer_code: "D10" }
              as: PlatformAdmin
              captures: { dealer_id: $.data.id }
            - call: "POST /survey/departments"
              payload: { dealer_id: "${dealer_id}", kind: "SALES", name: "Sales" }
              as: PlatformAdmin
              captures: { dept_id: $.data.id }
            - call: "POST /survey/customers"
              payload: { full_name: "C10", email: "c10@x.com", phone: "5551010101" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
          trigger:
            - call: "POST /survey/transactions"
              payload: { dealer_id: "00000000-0000-0000-0000-000000000000", department_id: "${dept_id}", customer_id: "${cust_id}", kind: "SALE", completed_at: "2026-09-05T00:00:00Z", margin_cents: 1000 }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_NOT_FOUND  # existence (priority 4) beats cross-reference (priority 5)"
            - "HTTP status == 404"

