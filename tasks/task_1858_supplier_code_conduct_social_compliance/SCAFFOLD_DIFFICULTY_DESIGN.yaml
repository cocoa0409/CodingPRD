  - rule_id: compensating_invariant
    instances:
      - name: audit_finding_tally_conservation_on_void
        grounds:
          - calculations.audit_finding_tallies
          - state_machines.Finding.OPEN_to_VOIDED
        distinguishing_aspect: |
          Conserved quantity: the audit's finding tally — zt_count + major_count +
          minor_count MUST equal the number of non-VOIDED findings at every step;
          recording (forward) and voiding (compensating) leave the tally consistent.
          Different conserved quantity than the reimbursement-balance instance
          (a count here, cents there).
        test_recipe:
          setup:
            - "Supplier ACTIVE; facility BD / 1200 workers; audit IN_PROGRESS; MINOR, MAJOR, then ZERO_TOLERANCE findings recorded in that order (the ZT record auto-fails the audit); tallies 1/1/1"
