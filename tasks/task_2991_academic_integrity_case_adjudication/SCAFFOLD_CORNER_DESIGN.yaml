        excluded_because:
          difficulty_instance: non_linear_state_machine / appeal_remand_reopens_the_hearing_loop_once_then_hits_the_round_limit
          rationale: "The bounded cycle (one remand allowed, the second returning ERR_REMAND_LIMIT_REACHED) is the named §1.8 instance's core assertion."

