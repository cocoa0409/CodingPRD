              captures: { r: $.data.id }
          assert:
            - "err == ERR_FUTURE_PERIOD (period_end 2026-08-02 > clock 2026-08-01)"
            - "boundary reading ${r} with period_end == clock exactly is created (SUBMITTED)"

      - name: attestation_window_boundary
        claim_type: violation_to_error
        grounds: ["validations[priority=22]", "errors[ERR_ATTESTATION_WINDOW_EXPIRED]"]
        distinguishing_aspect: "The 30-day attestation window is inclusive at the boundary: reading ending 2026-07-02 attests fine at exactly 2026-08-01T00:00:00Z (period_end + 30d), while the reading ending 2026-07-01 (window closed 2026-07-31) fails at the same instant."
        test_recipe:
          setup: ["Generator ACTIVE; two adjacent readings ending 2026-07-01 and 2026-07-02; clock at 2026-08-01T00:00:00Z"]
          setup_api_calls:
            - call: "POST /greenpower/generators"
              payload: { legal_name: "Sierra Solar", facility_code: "SS1", technology: "SOLAR", nameplate_capacity_kw: 5000, region_code: "CAISO", commissioning_date: "2020-01-01" }
              as: RegistryAdmin
