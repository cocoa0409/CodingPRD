      - name: interval_wellformedness_differs_by_entity_half_open_versus_closed
        claim_type: violation_to_error
        grounds:
          - validations.priority_19
          - errors.ERR_INVALID_EFFECTIVE_PERIOD
        distinguishing_aspect: |
          One error code, three different comparison rules: a RightsRegistration interval is
          HALF-OPEN so equal endpoints are an empty set and must be rejected, a RateSchedule
          interval is CLOSED so equal endpoints are a legal one-day window and must be ACCEPTED, and
          an AccountingPeriod merely requires usage_end >= usage_start. An implementation that
          shares one comparator across all three gets exactly one of these wrong.
        test_recipe:
          setup:
            - "One LABEL holder with direct_deal_rate_bps 800, one RECORDING work carrying no usage anywhere (so the claim-window rule at priority 17 cannot fire)."
          setup_api_calls:
            - call: "POST /royalties/rights-holders"
              payload: { legal_name: "Northbeam Records", holder_type: "LABEL", home_territory_code: "GB", direct_deal_rate_bps: 800 }
              as: RoyaltyAdmin
              captures: { lbl: "$.data.id" }
            - call: "POST /royalties/works"
              payload: { work_type: "RECORDING", identifier: "GBABC2600001", title: "Midnight Ledger", artist_credit: "The Reconcilers" }
              as: RightsOpsAnalyst
              captures: { w1: "$.data.id" }
            - call: "GET /royalties/works/${w1}"
              payload: {}
              as: RightsOpsAnalyst
              captures: { w1v: "$.data.version" }
          trigger:
            - name: registration_with_equal_endpoints_rejected
              call: "POST /royalties/rights-registrations"
              payload: { work_id: "${w1}", claimant_id: "${lbl}", right_type: "MASTER", routing: "DIRECT", share_bps: 10000, territory_set: ["GB"], effective_from: "2026-06-01", effective_to: "2026-06-01", expected_work_version: "${w1v}" }
              as: RightsHolderUser
              as_user_id: "${lbl}"
              captures: { err1: "$.data.error_id" }
            - call: "POST /royalties/rights-registrations"
              payload: { work_id: "${w1}", claimant_id: "${lbl}", right_type: "MASTER", routing: "DIRECT", share_bps: 10000, territory_set: ["GB"], effective_from: "2026-06-01", effective_to: "2026-06-02", expected_work_version: "${w1v}" }
              as: RightsHolderUser
              as_user_id: "${lbl}"
              captures: { rg: "$.data.id" }
            - call: "POST /royalties/rate-schedules"
              payload: { proceeding_ref: "CRB-2026-ONEDAY", territory_code: "GB", subscription_tier: "STUDENT", revenue_share_bps: 7000, per_subscriber_minimum_cents: 500, mechanical_share_bps: 4000, performance_share_bps: 6000, statutory_floor_per_play_millicents: 100, effective_from: "2026-06-01", effective_to: "2026-06-01" }
              as: RegulatoryOfficer
              captures: { rsok: "$.data.id" }
            - name: rate_schedule_with_reversed_endpoints_rejected
              call: "POST /royalties/rate-schedules"
              payload: { proceeding_ref: "CRB-2026-BACKWARD", territory_code: "GB", subscription_tier: "STUDENT", revenue_share_bps: 7000, per_subscriber_minimum_cents: 500, mechanical_share_bps: 4000, performance_share_bps: 6000, statutory_floor_per_play_millicents: 100, effective_from: "2026-06-02", effective_to: "2026-06-01" }
              as: RegulatoryOfficer
              captures: { err2: "$.data.error_id" }
            - name: period_with_reversed_usage_window_rejected
              call: "POST /royalties/periods"
              payload: { label: "2026-06", usage_start: "2026-06-30", usage_end: "2026-06-01" }
              as: RoyaltyAdmin
              captures: { err3: "$.data.error_id" }
            - call: "POST /royalties/periods"
              payload: { label: "2026-06-DAY", usage_start: "2026-06-01", usage_end: "2026-06-01" }
              as: RoyaltyAdmin
              captures: { perok: "$.data.id", cw: "$.data.claim_window_closes_at" }
          assert:
            - "Registration with effective_to == effective_from: HTTP 422 with error_id ERR_INVALID_EFFECTIVE_PERIOD — the half-open interval would cover no day at all."
            - "The same registration with effective_to one day later: HTTP 201, status SUBMITTED."
            - "RateSchedule with effective_to == effective_from: HTTP 201 — the closed interval is a legal single-day window (this is the branch a shared comparator breaks)."
            - "RateSchedule with effective_to before effective_from: HTTP 422 with error_id ERR_INVALID_EFFECTIVE_PERIOD."
            - "Period with usage_end before usage_start: HTTP 422 with error_id ERR_INVALID_EFFECTIVE_PERIOD; a single-day period is accepted and gets claim_window_closes_at 2026-07-31T00:00:00Z (usage_end 2026-06-01 plus CLAIM_WINDOW_DAYS 60)."

      - name: right_type_must_agree_with_both_work_type_and_holder_type
