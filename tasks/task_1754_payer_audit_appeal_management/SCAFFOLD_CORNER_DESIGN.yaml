            - { call: "POST /audit-cases/${c1}/begin-payer-review", payload: {}, as: PayerAgent, as_user_id: "${p1}" }
          trigger:
            - { call: "POST /audit-cases/${c1}/determination", payload: { outcomes: [ { claim_line_id: "${l1}", outcome: "PARTIALLY_DENIED", denied_amount_cents: 60000, denial_category: "CLINICAL", issue_code_id: "${ic}" } ] }, as: PayerAgent, as_user_id: "${p1}", captures: { err: $.data.error_id } }
          assert:
            - "err == \"ERR_DETERMINATION_AMOUNT_INVALID\""

      - name: determination_line_invalid_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=9]", "errors[ERR_DETERMINATION_LINE_INVALID]"]
        distinguishing_aspect: "An outcome naming another case's claim line -> 422 ERR_DETERMINATION_LINE_INVALID (cross-case reference rejected)."
        test_recipe:
          setup: ["cases A and B of the same payer, both in UNDER_PAYER_REVIEW with one line each"]
          setup_api_calls:
