          readiness at priority 65 - on a single publish call that violates both: the acting controller is the run's
          own creator and the attached pool is still OPEN. ERR_SEGREGATION_OF_DUTIES (403) must be returned, and the
          paired control - the same publish by a second controller - shows ERR_POOL_NOT_SEALED (422) surfacing only
          once the higher-priority rule is satisfied.
        test_recipe:
          setup:
