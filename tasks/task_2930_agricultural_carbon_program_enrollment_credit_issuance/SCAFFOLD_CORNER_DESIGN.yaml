      - name: invalid_from_state_rejection_across_the_baseline_lifecycle
        claim_type: invalid_transitions
        grounds:
          - state_machines.Baseline.transitions.PROPOSED_to_SUPERSEDED
          - validations[priority=9]
          - validations[priority=11]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / invalid_state_beats_segregation_of_duties_on_superseded_baseline
          rationale: "The named §1.8 instance already approves a SUPERSEDED baseline with the screening admin's own X-User-ID and asserts ERR_INVALID_STATE_TRANSITION over ERR_SEGREGATION_OF_DUTIES, which is exactly this invalid-from claim."

      - name: quantification_run_cycles_through_rejected_and_qualified
        claim_type: valid_transition
        grounds:
          - state_machines.QuantificationRun.transitions.REJECTED_to_DRAFT
          - state_machines.Verification.transitions.QUALIFIED_to_PENDING
          - state_machines.QuantificationRun.transitions.SUBMITTED_to_SUBMITTED
        excluded_because:
          difficulty_instance: non_linear_state_machine / run_rejected_revise_qualified_resample_cycle
          rationale: "The named §1.8 instance walks ADVERSE->revise->DRAFT and QUALIFIED->resample->PENDING end to end, including the SUBMITTED self-loop on a QUALIFIED opinion."

      - name: credit_batch_cancellation_reverses_every_side_effect
        claim_type: side_effect_execution
        grounds:
          - state_machines.CreditBatch.transitions.ISSUED_to_CANCELLED
          - state_machines.GrowerPayment.transitions.ACCRUED_to_VOID
        excluded_because:
          difficulty_instance: compensating_invariant / batch_cancellation_compensates_everything_except_serial_counter
          rationale: "The named §1.8 instance asserts the full compensation set (buffer release, ledger decrement, payment VOID) and the one counter that deliberately does not rewind."

      - name: baseline_approval_multi_hop_cascade
        claim_type: side_effect_execution
        grounds:
          - state_machines.Baseline.transitions.PROPOSED_to_APPROVED
          - state_machines.Enrollment.transitions.ACCEPTED_to_ACTIVE
          - state_machines.Field.transitions.MAPPED_to_ENROLLED
        excluded_because:
          difficulty_instance: transitive_cascade / baseline_approval_three_hop_cascade
          rationale: "The named §1.8 instance asserts all three hops of the approval cascade plus the grower's total_enrolled_acres ledger update in one pass."

      - name: reversal_assessment_multi_hop_cascade
        claim_type: side_effect_execution
        grounds:
          - state_machines.CreditBatch.transitions.LISTED_to_SUSPENDED
          - state_machines.GrowerPayment.transitions.ACCRUED_to_CLAWED_BACK
          - state_machines.ReversalEvent.transitions.REPORTED_to_ASSESSED
        excluded_because:
          difficulty_instance: transitive_cascade / reversal_assessment_seven_hop_cascade
          rationale: "The named §1.8 instance asserts all seven hops of the assessment cascade in declared order, including the buffer draw and the clawback booking."

      - name: data_packet_axes_move_independently
        claim_type: valid_transition
        grounds:
          - state_machines.DataPacket.transitions.PARTIAL_to_COMPLETE
          - state_machines.DataPacket.transitions.COMPLETE_to_PARTIAL
        excluded_because:
          difficulty_instance: non_linear_state_machine / data_packet_parallel_qc_and_completeness_axes
          rationale: "The named §1.8 instance drives qc_status and completeness_status through four combined states and asserts each axis moves without disturbing the other."

  # =====================================================================
  # 3. CALCULATIONS
  # =====================================================================
  - section: calculations
    instances:

      - name: baseline_uncertainty_clamps_at_both_variant_floors
        claim_type: constants_applied
        grounds:
          - calculations.baseline_establishment.constants
          - calculations.baseline_establishment.variants
          - state_machines.Baseline.transitions.PROPOSED_to_SUPERSEDED
        distinguishing_aspect: "With uncertainty_base_pct 8.00 and five qualifying years both variants land BELOW their floors and get clamped to different values — HISTORICAL_DATA to 5.00 (8.00 - 2.0*5 = -2.00) and MODELED to 12.00 (8.00 + 10.0 - 1.5*5 = 10.50) — so a single floor constant cannot satisfy both."
        test_recipe:
          setup:
            - "logical clock at 2026-06-01; one ACTIVE REDUCED_TILL standard v1 with uncertainty_base_pct 8.00, modeled_baseline_rate_per_acre 0.2000, telemetry_required false, min_documented_years 4, min_adoption_years 3, max_prior_adoption_pct 20.00"
            - "one CLAY field mapped to 1000.00 acres with five baseline-admissible history rows (four FARM_RECORD, one EQUIPMENT_TELEMETRY) whose observed rates sum to 0.7000"
            - "an ACCEPTED enrollment for 1000.00 acres starting 2026 (prior_adoption_pct 14.00, additionality_score 89.00, documented_years 5)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-06-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /practice-standards"
              payload: { practice_code: "REDUCED_TILL", standard_version: 1, additionality_lookback_years: 5, max_prior_adoption_pct: 20.00, min_documented_years: 4, min_adoption_years: 3, uncertainty_base_pct: 8.00, sequestration_rate_per_acre: 0.3500, modeled_baseline_rate_per_acre: 0.2000, buffer_base_pct: 10.00, telemetry_required: false, effective_from: "2020-01-01" }
              as: ProgramAdmin
              captures: { std_id: $.data.id }
            - call: "POST /growers"
              payload: { legal_name: "Clay Hollow Farms", operator_type: "LLC", tax_id: "TX-2001-A", mailing_state: "IA" }
              as: ProgramAdmin
              captures: { g1_id: $.data.id }
            - call: "POST /growers/${g1_id}/fields"
              payload: { field_name: "Clay 1", boundary_min_x: 0, boundary_min_y: 0, boundary_max_x: 2000, boundary_max_y: 2000, gross_acres: 1000.00, soil_group: "CLAY" }
              as: ProgramAdmin
              captures: { f1_id: $.data.id }
            - call: "POST /fields/${f1_id}/map-confirm"
              payload: { surveyor_reference: "SUR-C1" }
              as: ProgramAdmin
            - call: "POST /fields/${f1_id}/practice-history"
              payload: { crop_year: 2021, practice_code: "REDUCED_TILL", adopted: true, evidence_source: "FARM_RECORD", acres: 200.00, observed_emissions_per_acre: 0.1000 }
              as: ProgramAdmin
            - call: "POST /fields/${f1_id}/practice-history"
              payload: { crop_year: 2022, practice_code: "REDUCED_TILL", adopted: true, evidence_source: "FARM_RECORD", acres: 500.00, observed_emissions_per_acre: 0.1200 }
              as: ProgramAdmin
            - call: "POST /fields/${f1_id}/practice-history"
              payload: { crop_year: 2023, practice_code: "REDUCED_TILL", adopted: false, evidence_source: "FARM_RECORD", acres: 0.00, observed_emissions_per_acre: 0.1500 }
              as: ProgramAdmin
            - call: "POST /fields/${f1_id}/practice-history"
              payload: { crop_year: 2024, practice_code: "REDUCED_TILL", adopted: false, evidence_source: "EQUIPMENT_TELEMETRY", acres: 0.00, observed_emissions_per_acre: 0.1600 }
              as: ProgramAdmin
            - call: "POST /fields/${f1_id}/practice-history"
              payload: { crop_year: 2025, practice_code: "REDUCED_TILL", adopted: false, evidence_source: "FARM_RECORD", acres: 0.00, observed_emissions_per_acre: 0.1700 }
              as: ProgramAdmin
            - call: "POST /enrollments"
              payload: { field_id: "${f1_id}", practice_standard_id: "${std_id}", commitment_years: 5, start_crop_year: 2026, enrolled_acres: 1000.00, payment_model: "PER_ACRE", per_acre_rate_cents: 1000.00 }
              as: ProgramAdmin
              captures: { e1_id: $.data.id }
            - call: "POST /enrollments/${e1_id}/submit"
              payload: {}
              as: Grower
              as_user_id: "${g1_id}"
            - call: "POST /enrollments/${e1_id}/screen"
              payload: { decision: "ACCEPT" }
              as: ProgramAdmin
              as_user_id: "admin-screener-01"
              captures: { e1_v1: $.data.version }
          trigger:
            - call: "POST /enrollments/${e1_id}/baselines"
              payload: { method: "HISTORICAL_DATA", expected_enrollment_version: "${e1_v1}" }
              as: ProgramAdmin
              as_user_id: "admin-baseline-01"
              captures: { b_hist_id: $.data.id }
            - call: "GET /enrollments/${e1_id}"
              payload: {}
              as: ProgramAdmin
              captures: { e1_v2: $.data.version }
            - call: "POST /enrollments/${e1_id}/baselines"
              payload: { method: "MODELED", expected_enrollment_version: "${e1_v2}" }
              as: ProgramAdmin
              as_user_id: "admin-baseline-01"
              captures: { b_mod_id: $.data.id }
            - call: "GET /baselines/${b_hist_id}"
              payload: {}
              as: ProgramAdmin
          assert:
            - "HISTORICAL_DATA baseline: HTTP 201, data.historical_mean_rate == 0.1400, data.baseline_emissions_t == 140.000, data.uncertainty_deduction_pct == 5.00 (clamped up from -2.00)"
            - "MODELED baseline: HTTP 201, data.historical_mean_rate == null, data.baseline_emissions_t == 180.000 (1000.00 * 0.2000 * SOIL_FACTOR[CLAY] 0.9), data.uncertainty_deduction_pct == 12.00 (clamped up from 10.50)"
            - "the two clamped percentages differ (5.00 vs 12.00), proving the floors are variant-specific constants and not one shared minimum"
            - "the re-read of the HISTORICAL_DATA baseline now reports status == \"SUPERSEDED\" while the MODELED row reports \"PROPOSED\" — a different method supersedes rather than duplicating"
            - "the superseded row keeps baseline_emissions_t == 140.000 — superseding does not recompute or blank the older proposal"

