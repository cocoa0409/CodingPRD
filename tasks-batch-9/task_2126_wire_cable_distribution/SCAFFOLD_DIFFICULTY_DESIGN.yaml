      - name: index_shock_publication_cascade_depth3_to_released_reservations
        grounds:
          - state_machines.Quote.ISSUED_to_VOIDED
          - state_machines.SalesOrder.PARTIALLY_ALLOCATED_to_CANCELLED
          - state_machines.Allocation.RESERVED_to_RELEASED
          - state_machines.Reel.ALLOCATED_PARTIAL_to_IN_STOCK
          - entities.CopperIndexEntry.fields.voided_quote_count
        distinguishing_aspect: |
          A three-link chain rooted at a DIFFERENT trigger, publishing a copper
          index: the 11.1% move voids the CONVERTED quote whose order is still
          physically uncommitted -> because that quote was voided its
          PARTIALLY_ALLOCATED order is CANCELLED -> because that order was
          cancelled its RESERVED allocation is RELEASED and the reel drops back to
          IN_STOCK with allocated_length_ft 0 and current_length_ft still 200.
        test_recipe:
          setup:
            - "One branch, one customer with a 5,000,000-cent limit, product P1, index CI1 at 450 c/lb, and a single short 200 ft P1 reel."
            - "A single CUT line of 300 ft is quoted, issued, converted and allocated; only 200 ft is available so the line ends SHORT and the order is PARTIALLY_ALLOCATED with the reel ALLOCATED_PARTIAL."
