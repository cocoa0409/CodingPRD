            - call: "POST /drinkware/artwork-proofs/${proof_m}/approve"
              payload: {}
              as: PrepressTech
              as_user_id: "pp-1"
            - call: "POST /drinkware/artwork-proofs/${proof_q}/approve"
              payload: {}
              as: PrepressTech
              as_user_id: "pp-1"
            - *c_lock
            - call: "POST /drinkware/customization-orders/${order_m}/start-production"
              payload: {}
              as: ProductionLead
              as_user_id: "pl-1"
            - call: "POST /drinkware/customization-orders/${order_m}/complete-production"
              payload: { qc_outcome: "PASS" }
              as: ProductionLead
              as_user_id: "pl-1"
            - call: "POST /drinkware/customization-orders/${order_q}/start-production"
              payload: {}
              as: ProductionLead
              as_user_id: "pl-1"
            - call: "POST /drinkware/customization-orders/${order_q}/complete-production"
              payload: { qc_outcome: "PASS" }
              as: ProductionLead
              as_user_id: "pl-1"
            - call: "POST /drinkware/customization-orders/${order_m}/request-return"
              payload: { reason: "ARTWORK_MISMATCH", affected_unit_count: 5 }
              as: Buyer
              as_user_id: "buyer-m1"
            - call: "POST /drinkware/customization-orders/${order_q}/request-return"
              payload: { reason: "DEFECT", affected_unit_count: 10 }
              as: Buyer
              as_user_id: "buyer-q1"
          trigger:
            - call: "POST /drinkware/customization-orders/${order_m}/decide-return"
              payload: { decision: "APPROVE", resolution: "PARTIAL_CREDIT", decision_notes: "half-hearted" }
              as: CustomerCare
