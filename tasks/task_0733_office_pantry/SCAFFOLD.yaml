scenario: |
  733. Office-Pantry & Snack Subscription Service (SnackNation style): client office & headcount/plan,
  curated assortment & rotation, recurring delivery & restock par, dietary/preference & swap,
  micro-market/fridge option, billing (per-employee/flat), feedback & customization, pause/cancel

domain_name: office-pantry-subscription
api_prefix: ""

complexity_profile:
  primary_archetype: ledger_reconciliation
  secondary_archetype: pricing_engine
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - rate_threshold_triggers
    - optimistic_concurrency
    - selector_policy
  entity_topology: hybrid
  state_machine_shape: parallel
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: peer_roles
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# ---------------------------------------------------------------------------
# §1.1 Entities
# ---------------------------------------------------------------------------

entities:
  - name: Client
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: office client display name
      - name: headcount
        type: integer
        source: input
        description: current employee count on the client site; drives per-employee billing tier
        constraints: ">= 1"
      - name: credit_balance_cents
        type: integer
        source: computed
        description: running credit balance in cents; incremented by dispute credits, decremented when applied to invoices
        default: 0
      - name: active_subscription_id
        type: string
        source: computed
        description: id of the single non-terminal Subscription for this client, or null; a client may only have one non-terminal subscription at a time
        default: null

  - name: Plan
    parent: null
    common_fields: true
    fields:
      - name: tier
        type: string
        source: input
        description: plan display tier, e.g. STARTER / GROWTH / ENTERPRISE
        constraints: "unique across active plans"
      - name: billing_type
        type: enum
        source: input
        description: PER_EMPLOYEE bills base_fee_cents + per_employee_fee_cents*headcount; FLAT bills flat_fee_cents regardless of headcount
        constraints: "one of {PER_EMPLOYEE, FLAT}"
      - name: base_fee_cents
        type: integer
        source: input
        description: monthly base fee in cents applied under PER_EMPLOYEE billing_type
        default: 0
        constraints: ">= 0"
      - name: per_employee_fee_cents
        type: integer
        source: input
        description: monthly per-employee fee in cents applied under PER_EMPLOYEE billing_type
        default: 0
        constraints: ">= 0"
      - name: flat_fee_cents
        type: integer
        source: input
        description: monthly flat fee applied under FLAT billing_type; ignored under PER_EMPLOYEE
        default: 0
        constraints: ">= 0"
      - name: volume_discount_threshold_headcount
        type: integer
        source: input
        description: headcount at which the per-employee tier discount activates; boundary is inclusive (>=)
        constraints: ">= 1"
      - name: volume_discount_pct
        type: number
        source: input
        description: fractional discount applied to per_employee_fee_cents*headcount portion when headcount >= volume_discount_threshold_headcount; e.g. 0.10 = 10 percent
        default: 0
        constraints: "0.0 <= x <= 1.0"

  - name: Subscription
    parent: Client
    common_fields: true
    fields:
      - name: client_id
        type: string
        source: input
        description: "FK -> Client.id"
      - name: plan_id
        type: string
        source: input
        description: "FK -> Plan.id; snapshot at creation, versioned by version_snapshot_id below"
      - name: plan_version_snapshot
        type: integer
        source: system
        description: Plan.version at subscription creation; billing calculations use this snapshot even if Plan is later updated
      - name: status
        type: enum
        source: computed
        description: DRAFT (created, awaiting first rotation), ACTIVE (rotations running), PAUSED (rotations frozen but subscription retained), CANCELLED (terminal)
        default: DRAFT
        constraints: "one of {DRAFT, ACTIVE, PAUSED, CANCELLED}"
      - name: paused_at
        type: datetime
        source: system
        description: server-stamped ISO 8601 UTC when subscription entered PAUSED, else null
        default: null
      - name: cancelled_at
        type: datetime
        source: system
        description: server-stamped ISO 8601 UTC when subscription entered CANCELLED, else null
        default: null
      - name: cumulative_active_days
        type: integer
        source: computed
        description: number of full logical days the subscription has spent in ACTIVE across all pause/resume loops; incremented only on transitions out of ACTIVE
        default: 0

  - name: Location
    parent: Client
    common_fields: true
    fields:
      - name: client_id
        type: string
        source: input
        description: "FK -> Client.id"
      - name: name
        type: string
        source: input
        description: display name of the pantry/fridge/micro-market
      - name: kind
        type: enum
        source: input
        description: PANTRY (standard snack station), FRIDGE (refrigerated only), MICRO_MARKET (checkout kiosk with payment)
        constraints: "one of {PANTRY, FRIDGE, MICRO_MARKET}"
      - name: capacity_units
        type: integer
        source: input
        description: total storage capacity in unit-slots; sum of ParLevel.par_units for this location must not exceed capacity_units
        constraints: ">= 1"
      - name: service_fee_bps
        type: integer
        source: input
        description: service fee in basis points applied on top of every DeliveryLine at this Location (0..10000); micro-markets typically higher than pantries; snapshotted onto each DeliveryLine
        default: 0
        constraints: "0 <= service_fee_bps <= 10000"

  - name: Product
    parent: null
    common_fields: true
    fields:
      - name: sku
        type: string
        source: input
        description: unique SKU code
        constraints: "unique across active products"
      - name: name
        type: string
        source: input
        description: product display name
      - name: category
        type: enum
        source: input
        description: SNACK / BEVERAGE / MEAL / CANDY; used for rotation category quotas
        constraints: "one of {SNACK, BEVERAGE, MEAL, CANDY}"
      - name: dietary_flags
        type: array
        source: input
        description: array of dietary attribute strings, e.g. ["GLUTEN_FREE","VEGAN","NUT_FREE"]; matched against client Preference blocks
        default: []
      - name: unit_cost_cents
        type: integer
        source: input
        description: cost per unit in cents; snapshotted onto DeliveryLine.unit_price_cents_snapshot at line creation
        constraints: ">= 0"
      - name: requires_refrigeration
        type: boolean
        source: input
        description: if true, product may only be placed in Locations of kind FRIDGE or MICRO_MARKET
        default: false

  - name: Preference
    parent: Client
    common_fields: false
    fields:
      - name: client_id
        type: string
        source: input
        description: "FK -> Client.id"
      - name: dietary_flag
        type: string
        source: input
        description: dietary attribute the client blocks (e.g. "NUT_FREE"); any Product carrying this flag is blocked from all of the client's assortments
        constraints: "(client_id, dietary_flag) unique"

  - name: ParLevel
    parent: Location
    common_fields: true
    fields:
      - name: location_id
        type: string
        source: input
        description: "FK -> Location.id"
      - name: product_id
        type: string
        source: input
        description: "FK -> Product.id"
      - name: par_units
        type: integer
        source: input
        description: target restock quantity per rotation for this (location, product); the delivery generator ships up to par_units on each rotation
        constraints: ">= 0; (location_id, product_id) unique"

  - name: RotationCycle
    parent: Subscription
    common_fields: true
    fields:
      - name: subscription_id
        type: string
        source: input
        description: "FK -> Subscription.id"
      - name: cycle_index
        type: integer
        source: system
        description: 1-based monotonically increasing index within a subscription
      - name: effective_from
        type: datetime
        source: system
        description: ISO 8601 UTC inclusive start of cycle window (server clock at creation)
      - name: effective_to
        type: datetime
        source: system
        description: ISO 8601 UTC exclusive end of cycle window; effective_to == next cycle's effective_from (contiguous, no gap)
      - name: status
        type: enum
        source: computed
        description: OPEN (accepting deliveries), CLOSED (invoiced, terminal), INVALIDATED (subscription paused mid-cycle, cycle terminated without invoice)
        default: OPEN
        constraints: "one of {OPEN, CLOSED, INVALIDATED}"

  - name: Delivery
    parent: Location
    common_fields: true
    fields:
      - name: location_id
        type: string
        source: input
        description: "FK -> Location.id"
      - name: rotation_cycle_id
        type: string
        source: input
        description: "FK -> RotationCycle.id"
      - name: scheduled_at
        type: datetime
        source: input
        description: ISO 8601 UTC scheduled arrival time; two Deliveries at the same Location must be >= 24h apart on scheduled_at
      - name: dispatched_at
        type: datetime
        source: system
        description: ISO 8601 UTC when dispatched (SCHEDULED -> EN_ROUTE), else null
        default: null
      - name: delivered_at
        type: datetime
        source: system
        description: ISO 8601 UTC when delivered (EN_ROUTE -> DELIVERED), else null
        default: null
      - name: status
        type: enum
        source: computed
        description: SCHEDULED / EN_ROUTE / DELIVERED / DISPUTED / FINALIZED / CANCELLED
        default: SCHEDULED
        constraints: "one of {SCHEDULED, EN_ROUTE, DELIVERED, DISPUTED, FINALIZED, CANCELLED}"
      - name: dispute_reason
        type: string
        source: input
        description: free-text reason recorded when transitioning DELIVERED -> DISPUTED, else null
        default: null
      - name: provisional_cents
        type: integer
        source: computed
        description: sum over lines of planned_units * unit_price_cents_snapshot computed at dispatch time (see calculations.delivery_provisional_charge)
        default: 0
      - name: final_cents
        type: integer
        source: computed
        description: sum over lines of actual_units * unit_price_cents_snapshot computed at FINALIZED time (see calculations.delivery_final_charge); may differ from provisional_cents when actuals diverge or dispute credits apply
        default: 0
      - name: dispute_credit_cents
        type: integer
        source: computed
        description: credit applied to Client.credit_balance_cents on dispute resolution when actuals fall short of planned; equals sum over lines of (planned_units - actual_units) * unit_price_cents_snapshot for lines with actual_units < planned_units
        default: 0

  - name: DeliveryLine
    parent: Delivery
    common_fields: true
    fields:
      - name: delivery_id
        type: string
        source: input
        description: "FK -> Delivery.id"
      - name: product_id
        type: string
        source: input
        description: "FK -> Product.id"
      - name: planned_units
        type: integer
        source: system
        description: units the delivery generator planned to ship (typically the ParLevel.par_units minus any known preference blocks); snapshotted at line creation
        constraints: ">= 0"
      - name: actual_units
        type: integer
        source: input
        description: units actually delivered as reported at confirmation; defaults to planned_units until LocationManager submits actuals
        default: null
        constraints: "0 <= actual_units <= planned_units"
      - name: unit_price_cents_snapshot
        type: integer
        source: system
        description: snapshot of Product.unit_cost_cents at line creation; billing uses the snapshot, not the current product price
      - name: service_fee_bps_snapshot
        type: integer
        source: system
        description: snapshot of Location.service_fee_bps at line creation; billing uses this snapshot, not the current location value

  - name: Invoice
    parent: Client
    common_fields: true
    fields:
      - name: client_id
        type: string
        source: input
        description: "FK -> Client.id"
      - name: rotation_cycle_id
        type: string
        source: input
        description: "FK -> RotationCycle.id"
      - name: period_start
        type: datetime
        source: system
        description: ISO 8601 UTC inclusive start (= rotation.effective_from)
      - name: period_end
        type: datetime
        source: system
        description: ISO 8601 UTC exclusive end (= rotation.effective_to)
      - name: subscription_fee_cents
        type: integer
        source: computed
        description: monthly fee portion computed per plan.billing_type and headcount (see calculations.subscription_fee)
        default: 0
      - name: consumption_cents
        type: integer
        source: computed
        description: sum of Delivery.final_cents across all FINALIZED deliveries in this rotation (see calculations.invoice_consumption)
        default: 0
      - name: credit_applied_cents
        type: integer
        source: computed
        description: amount drawn from Client.credit_balance_cents applied against this invoice, capped by (subscription_fee_cents + consumption_cents)
        default: 0
      - name: total_cents
        type: integer
        source: computed
        description: subscription_fee_cents + consumption_cents - credit_applied_cents
        default: 0
      - name: payment_status
        type: enum
        source: computed
        description: parallel dimension - UNPAID / PAID / DEFAULT; independent of dispute_status
        default: UNPAID
        constraints: "one of {UNPAID, PAID, DEFAULT}"
      - name: dispute_status
        type: enum
        source: computed
        description: parallel dimension - CLEAN / UNDER_DISPUTE / RESOLVED; independent of payment_status
        default: CLEAN
        constraints: "one of {CLEAN, UNDER_DISPUTE, RESOLVED}"

  - name: Feedback
    parent: Client
    common_fields: false
    fields:
      - name: client_id
        type: string
        source: input
        description: "FK -> Client.id"
      - name: product_id
        type: string
        source: input
        description: "FK -> Product.id"
      - name: rating
        type: integer
        source: input
        description: rating on 1-5 scale
        constraints: "1 <= rating <= 5"
      - name: comment
        type: string
        source: input
        description: optional free-text comment
        default: null
      - name: swap_suggestion_product_id
        type: string
        source: input
        description: "FK -> Product.id; optional; when supplied and rating <= 2, this becomes a swap candidate on the next rotation"
        default: null

# ---------------------------------------------------------------------------
# §1.2 State Machines
# ---------------------------------------------------------------------------

state_machines:
  - entity: Subscription
    initial_state: DRAFT
    terminal_states: [CANCELLED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /subscriptions/{id}/activate"
        actor: PlatformAdmin
        preconditions:
          - "subscription.status == DRAFT"
          - "client has at least one Location declared"
          - "at least one ParLevel exists across the client's Locations"
        side_effects:
          - "set subscription.status = ACTIVE"
          - "server-stamp subscription.updated_at"
          - "opens the first RotationCycle: create RotationCycle{cycle_index=1, effective_from=clock.now, effective_to=clock.now + 30 days, status=OPEN}"
          - "increments subscription.version by 1"
      - from: ACTIVE
        to: PAUSED
        trigger: "POST /subscriptions/{id}/pause"
        actor: ClientAdmin
        preconditions:
          - "subscription.status == ACTIVE"
          - "acting ClientAdmin's X-User-ID equals subscription.client_id"
        side_effects:
          - "set subscription.status = PAUSED"
          - "server-stamp subscription.paused_at = clock.now"
          - "increment subscription.cumulative_active_days by floor((clock.now - subscription's most recent ACTIVE-entry timestamp) / 1 day)"
          - "cascade origin: transition currently-OPEN RotationCycle via RotationCycle.OPEN_to_INVALIDATED (that transition's side_effects then propagate down to Delivery, and Delivery.EN_ROUTE_to_CANCELLED further propagates to Client.credit_balance_cents — depth-3 chain)"
          - "increments subscription.version by 1"
        note: "Depth-3+ cascade origin. Hop 1 (this transition) → Hop 2 (RC.OPEN_to_INVALIDATED, caused by this hop) → Hop 3 (Delivery.SCHEDULED_to_CANCELLED / EN_ROUTE_to_CANCELLED, caused by hop 2) → Hop 4 for EN_ROUTE only (Client.credit_balance_cents credit, caused by hop 3). Every link is caused by the previous link's mutation, not by the origin action."
      - from: PAUSED
        to: ACTIVE
        trigger: "POST /subscriptions/{id}/resume"
        actor: ClientAdmin
        preconditions:
          - "subscription.status == PAUSED"
          - "acting ClientAdmin's X-User-ID equals subscription.client_id"
        side_effects:
          - "set subscription.status = ACTIVE"
          - "clear subscription.paused_at (null)"
          - "opens a new RotationCycle: create RotationCycle{cycle_index=prev+1, effective_from=clock.now, effective_to=clock.now + 30 days, status=OPEN}"
          - "increments subscription.version by 1"
      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /subscriptions/{id}/cancel"
        actor: ClientAdmin
        preconditions:
          - "subscription.status == ACTIVE"
          - "acting ClientAdmin's X-User-ID equals subscription.client_id"
        side_effects:
          - "set subscription.status = CANCELLED"
          - "server-stamp subscription.cancelled_at = clock.now"
          - "cascade: same fan-out as pause on the currently-OPEN RotationCycle"
          - "clear client.active_subscription_id"
          - "increments subscription.version by 1"
      - from: PAUSED
        to: CANCELLED
        trigger: "POST /subscriptions/{id}/cancel"
        actor: ClientAdmin
        preconditions:
          - "subscription.status == PAUSED"
          - "acting ClientAdmin's X-User-ID equals subscription.client_id"
        side_effects:
          - "set subscription.status = CANCELLED"
          - "server-stamp subscription.cancelled_at = clock.now"
          - "clear client.active_subscription_id"
          - "increments subscription.version by 1"

  - entity: RotationCycle
    initial_state: OPEN
    terminal_states: [CLOSED, INVALIDATED]
    transitions:
      - from: OPEN
        to: CLOSED
        trigger: "POST /rotation-cycles/{id}/close"
        actor: PlatformAdmin
        preconditions:
          - "rotation_cycle.status == OPEN"
          - "every Delivery under this cycle is FINALIZED or CANCELLED"
          - "clock.now >= rotation_cycle.effective_to"
          - "subscription.status IN {ACTIVE, PAUSED} (must not be CANCELLED)"
        side_effects:
          - "set rotation_cycle.status = CLOSED"
          - "create Invoice{client_id=subscription.client_id, rotation_cycle_id=this, period_start=effective_from, period_end=effective_to}"
          - "compute Invoice.subscription_fee_cents via calculations.subscription_fee"
          - "compute Invoice.consumption_cents via calculations.invoice_consumption"
          - "compute Invoice.credit_applied_cents = min(client.credit_balance_cents, subscription_fee_cents + consumption_cents)"
          - "decrement client.credit_balance_cents by Invoice.credit_applied_cents"
          - "compute Invoice.total_cents = subscription_fee_cents + consumption_cents - credit_applied_cents"
          - "increments rotation_cycle.version by 1"
      - from: OPEN
        to: INVALIDATED
        trigger: "system: cascade from Subscription pause/cancel (hop 2, caused by Subscription transition)"
        actor: system
        preconditions:
          - "rotation_cycle.status == OPEN"
          - "the parent Subscription is transitioning to PAUSED or CANCELLED"
        side_effects:
          - "set rotation_cycle.status = INVALIDATED"
          - "cascade hop 3 (caused by THIS RotationCycle mutation, not by the original pause action): for every Delivery under this RotationCycle with status IN {SCHEDULED, EN_ROUTE}, transition Delivery to CANCELLED via state_machines.Delivery.SCHEDULED_to_CANCELLED or Delivery.EN_ROUTE_to_CANCELLED"
          - "increments rotation_cycle.version by 1"
        note: "Second hop in the depth-3 pause/cancel cascade. Hop 1: Sub → RotationCycle (this transition). Hop 2 (this side_effect): RotationCycle → Delivery. Every hop is caused by the previous hop's mutation, not by the origin action."

  - entity: Delivery
    initial_state: SCHEDULED
    terminal_states: [FINALIZED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: EN_ROUTE
        trigger: "POST /deliveries/{id}/dispatch"
        actor: PlatformAdmin
        preconditions:
          - "delivery.status == SCHEDULED"
          - "subscription.status == ACTIVE"
          - "rotation_cycle.status == OPEN"
          - "clock.now < delivery.scheduled_at + 24h"
        side_effects:
          - "set delivery.status = EN_ROUTE"
          - "server-stamp delivery.dispatched_at = clock.now"
          - "compute delivery.provisional_cents via calculations.delivery_provisional_charge"
          - "increments delivery.version by 1"
      - from: EN_ROUTE
        to: DELIVERED
        trigger: "POST /deliveries/{id}/confirm"
        actor: LocationManager
        preconditions:
          - "delivery.status == EN_ROUTE"
          - "acting LocationManager's X-User-ID equals delivery.location_id"
          - "subscription.status == ACTIVE"
        side_effects:
          - "set delivery.status = DELIVERED"
          - "server-stamp delivery.delivered_at = clock.now"
          - "increments delivery.version by 1"
      - from: DELIVERED
        to: DISPUTED
        trigger: "POST /deliveries/{id}/dispute"
        actor: LocationManager
        preconditions:
          - "delivery.status == DELIVERED"
          - "acting LocationManager's X-User-ID equals delivery.location_id"
          - "clock.now < delivery.delivered_at + 48h"
        side_effects:
          - "set delivery.status = DISPUTED"
          - "record delivery.dispute_reason from request payload"
          - "increments delivery.version by 1"
      - from: DISPUTED
        to: FINALIZED
        trigger: "POST /deliveries/{id}/resolve-dispute"
        actor: PlatformAdmin
        preconditions:
          - "delivery.status == DISPUTED"
          - "every DeliveryLine under this delivery has actual_units set (not null)"
        side_effects:
          - "compute delivery.final_cents via calculations.delivery_final_charge"
          - "compute delivery.dispute_credit_cents = sum over lines of (planned_units - actual_units) * unit_price_cents_snapshot where actual_units < planned_units"
          - "credit client.credit_balance_cents by delivery.dispute_credit_cents (cascade level 2: Delivery -> Client)"
          - "set delivery.status = FINALIZED"
          - "increments delivery.version by 1"
        note: "Second-depth cascade origin. resolve-dispute mutates delivery.dispute_credit_cents; that mutation itself causes Client.credit_balance_cents to be incremented (the client-credit mutation would not happen without the just-computed dispute_credit_cents)."
      - from: DELIVERED
        to: FINALIZED
        trigger: "POST /deliveries/{id}/finalize"
        actor: PlatformAdmin
        preconditions:
          - "delivery.status == DELIVERED"
          - "clock.now >= delivery.delivered_at + 48h (auto-finalize window closed)"
        side_effects:
          - "compute delivery.final_cents = delivery.provisional_cents (no dispute, actuals default to planned)"
          - "set delivery.status = FINALIZED"
          - "increments delivery.version by 1"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "system: cascade from RotationCycle.OPEN_to_INVALIDATED (hop 3, caused by RotationCycle mutation)"
        actor: system
        preconditions:
          - "delivery.status == SCHEDULED"
        side_effects:
          - "set delivery.status = CANCELLED"
          - "increments delivery.version by 1"
        note: "No client credit: a SCHEDULED delivery incurred no cost, so cancellation is free of ledger side effects."
      - from: EN_ROUTE
        to: CANCELLED
        trigger: "system: cascade from RotationCycle.OPEN_to_INVALIDATED (hop 3, caused by RotationCycle mutation)"
        actor: system
        preconditions:
          - "delivery.status == EN_ROUTE"
        side_effects:
          - "set delivery.status = CANCELLED"
          - "compute delivery.dispute_credit_cents = delivery.provisional_cents (missed-delivery courtesy credit: the client already saw provisional in transit)"
          - "cascade hop 4 (caused by THIS Delivery mutation, not by the origin pause action): credit client.credit_balance_cents by delivery.dispute_credit_cents"
          - "increments delivery.version by 1"
        note: "Fourth and final hop in the depth-3+ pause/cancel cascade: Delivery.EN_ROUTE_to_CANCELLED credits the client. The invariant compensating-action rule for Subscription.pause holds: cumulative_active_days + client.credit_balance_cents delta = provisional_cents_of_interrupted_deliveries (see compensating_invariants below)."

  - entity: Invoice
    initial_state: UNPAID
    terminal_states: [PAID, DEFAULT]
    transitions:
      - from: UNPAID
        to: PAID
        trigger: "POST /invoices/{id}/pay"
        actor: ClientAdmin
        preconditions:
          - "invoice.payment_status == UNPAID"
          - "invoice.dispute_status IN {CLEAN, RESOLVED} (cannot pay while under dispute)"
          - "acting ClientAdmin's X-User-ID equals invoice.client_id"
        side_effects:
          - "set invoice.payment_status = PAID"
          - "increments invoice.version by 1"
        note: "Parallel dimension. payment_status changes here; dispute_status is untouched."
      - from: UNPAID
        to: DEFAULT
        trigger: "system: overdue past invoice.period_end + 30 days without payment"
        actor: system
        preconditions:
          - "invoice.payment_status == UNPAID"
          - "clock.now >= invoice.period_end + 30 days"
        side_effects:
          - "set invoice.payment_status = DEFAULT"
          - "increments invoice.version by 1"
      - from: CLEAN
        to: UNDER_DISPUTE
        trigger: "system: cascade from RotationCycle.OPEN_to_INVALIDATED (see state_machines.RotationCycle)"
        actor: system
        preconditions:
          - "invoice.dispute_status == CLEAN"
          - "invoice.payment_status == UNPAID"
        side_effects:
          - "set invoice.dispute_status = UNDER_DISPUTE"
          - "increments invoice.version by 1"
        note: "Third link in the depth-3 pause cascade. dispute_status flips independently of payment_status (parallel dimension)."
      - from: UNDER_DISPUTE
        to: RESOLVED
        trigger: "POST /invoices/{id}/resolve-dispute"
        actor: PlatformAdmin
        preconditions:
          - "invoice.dispute_status == UNDER_DISPUTE"
        side_effects:
          - "set invoice.dispute_status = RESOLVED"
          - "increments invoice.version by 1"

# ---------------------------------------------------------------------------
# §1.2.1 Concurrency Rules
# ---------------------------------------------------------------------------

concurrency_rules:
  - rule_id: subscription-create-stale-client
    parent_entity: Client
    write_endpoint: "POST /clients/{id}/subscriptions"
    occ_field: "expected_client_version"
    description: |
      Creating a Subscription against a Client whose version has advanced since the
      client last observed it is rejected. This captures the case where another
      writer has just mutated the client (e.g. headcount adjustment, which changes
      billing tier and therefore what the subscription snapshot should encode) and
      the current writer's view of the client is therefore stale. The new
      subscription would legitimately succeed under the natural product semantics
      (a client is allowed to have exactly one non-terminal subscription at a
      time), so the reject is a true version-based race rather than a state
      precondition.
    error_id: ERR_STALE_CLIENT_VERSION
    http_status: 412

# ---------------------------------------------------------------------------
# §1.3 Calculations
# ---------------------------------------------------------------------------

calculations:
  - name: delivery_provisional_charge
    trigger: "state_machines.Delivery.SCHEDULED_to_EN_ROUTE (POST /deliveries/{id}/dispatch)"
    algorithm: forward_looking
    formula: |
      # Rule 2 mode (a): formula with 4+ inputs and non-linear interaction (branch on
      # Location.kind × tiered thresholds × service fee). Per-line evaluation.
      # ----------------------------------------------------------------
      # Inputs per line: planned_units, unit_price_cents_snapshot, service_fee_bps_snapshot,
      #                  parent Location.kind (via the delivery's location).
      # Constants: BULK_UNITS_THRESHOLD = 100, BULK_LINE_DISCOUNT_PCT = 0.05.
      # ----------------------------------------------------------------
      # For each DeliveryLine i in this Delivery:
      #   raw_line_cents[i] = planned_units[i] * unit_price_cents_snapshot[i]
      #   if Location.kind == MICRO_MARKET:
      #       fee_line_cents[i] = round_half_up(raw_line_cents[i] * (service_fee_bps_snapshot[i] / 10000))
      #   else:  # PANTRY or FRIDGE
      #       fee_line_cents[i] = 0     # service fee only applies at micro-markets
      #   if planned_units[i] >= BULK_UNITS_THRESHOLD:  # inclusive boundary (>=)
      #       discount_line_cents[i] = round_half_up(raw_line_cents[i] * BULK_LINE_DISCOUNT_PCT)
      #   else:
      #       discount_line_cents[i] = 0
      #   line_cents[i] = raw_line_cents[i] + fee_line_cents[i] - discount_line_cents[i]
      # provisional_cents = sum(line_cents[i] for i in delivery.lines)
      # ----------------------------------------------------------------
      # Non-linearity: MICRO_MARKET × bulk-tier interaction can produce four regimes
      # per line (fee off/on × discount off/on); a scaffold that folds this into "one
      # rate * total" loses the boundary.
    input_set: |
      All DeliveryLine rows for this Delivery. Product prices are read from
      unit_price_cents_snapshot; service fees from service_fee_bps_snapshot;
      Location.kind read from the delivery's location.
    constants:
      BULK_UNITS_THRESHOLD: 100
      BULK_LINE_DISCOUNT_PCT: 0.05
      ROUND_MODE: "round_half_up"
    precision: "integer cents; per-line fee and per-line discount each rounded independently"
    variants:
      - name: chronological_variant_via_final_charge
        when: "at FINALIZED time"
        difference: "final charge uses actual_units instead of planned_units, so same lines yield different totals when any actual < planned. Cost accounting on Delivery."

  - name: delivery_final_charge
    trigger: "state_machines.Delivery.DISPUTED_to_FINALIZED or Delivery.DELIVERED_to_FINALIZED"
    algorithm: chronological
    formula: |
      # Same shape as delivery_provisional_charge but with actual_units in place of
      # planned_units. Same branches on Location.kind and BULK threshold.
      # ----------------------------------------------------------------
      # For each DeliveryLine i:
      #   raw_line_cents[i] = actual_units[i] * unit_price_cents_snapshot[i]
      #   if Location.kind == MICRO_MARKET:
      #       fee_line_cents[i] = round_half_up(raw_line_cents[i] * (service_fee_bps_snapshot[i] / 10000))
      #   else:
      #       fee_line_cents[i] = 0
      #   if actual_units[i] >= 100:
      #       discount_line_cents[i] = round_half_up(raw_line_cents[i] * 0.05)
      #   else:
      #       discount_line_cents[i] = 0
      #   line_cents[i] = raw_line_cents[i] + fee_line_cents[i] - discount_line_cents[i]
      # final_cents = sum(line_cents[i] for i in delivery.lines)
      # ----------------------------------------------------------------
      # For DELIVERED_to_FINALIZED (auto-finalize, no dispute), actual_units == planned_units,
      # and final_cents == provisional_cents. For DISPUTED_to_FINALIZED, actual_units may be
      # < planned_units, producing final_cents < provisional_cents (and possibly crossing the
      # 100-unit bulk boundary, changing the discount decision).
    input_set: |
      All DeliveryLine rows for this Delivery, using the actual_units value
      (defaults to planned_units if never updated), unit_price_cents_snapshot, and
      service_fee_bps_snapshot.
    constants:
      BULK_UNITS_THRESHOLD: 100
      BULK_LINE_DISCOUNT_PCT: 0.05
      ROUND_MODE: "round_half_up"
    precision: "integer cents"
    variants:
      - name: provisional_variant
        when: "at dispatch time"
        difference: "provisional variant uses planned_units; final variant uses actual_units. Same delivery, same product prices, potentially different totals. Cost accounting on Delivery."

  - name: subscription_fee
    trigger: "state_machines.RotationCycle.OPEN_to_CLOSED"
    algorithm: tiered_pricing
    formula: |
      # Nested formula with 4 inputs and a branch on plan.billing_type;
      # boundary is inclusive (>=).
      # ----------------------------------------------------------------
      # Inputs: plan.billing_type, plan.base_fee_cents, plan.per_employee_fee_cents,
      #         plan.flat_fee_cents, plan.volume_discount_threshold_headcount,
      #         plan.volume_discount_pct, client.headcount
      # ----------------------------------------------------------------
      # if plan.billing_type == FLAT:
      #     subscription_fee_cents = plan.flat_fee_cents
      # else:  # PER_EMPLOYEE
      #     raw_per_employee = plan.per_employee_fee_cents * client.headcount
      #     if client.headcount >= plan.volume_discount_threshold_headcount:
      #         discounted = raw_per_employee * (1 - plan.volume_discount_pct)
      #         discounted_rounded = round_half_up(discounted)  # int cents
      #     else:
      #         discounted_rounded = raw_per_employee
      #     subscription_fee_cents = plan.base_fee_cents + discounted_rounded
      # ----------------------------------------------------------------
      # Rounding order (SCAFFOLD PINS): apply discount THEN round to integer cents
      # THEN add base_fee_cents. The scaffold rejects "sum then round" ordering.
    input_set: |
      The plan snapshot referenced by subscription.plan_id at
      subscription.plan_version_snapshot; client.headcount at the moment
      the rotation cycle closes.
    constants:
      ROUND_MODE: "round_half_up"
    precision: "integer cents; single rounding step after discount, before base_fee addition"

  - name: invoice_consumption
    trigger: "state_machines.RotationCycle.OPEN_to_CLOSED"
    algorithm: aggregation
    formula: |
      # Sum of final_cents over deliveries under this rotation, filtered by state.
      # consumption_cents = sum(delivery.final_cents for delivery in rotation.deliveries
      #                          if delivery.status == FINALIZED)
      # Deliveries in CANCELLED are excluded even though they existed in the cycle;
      # their provisional_cents was computed at dispatch but never realized.
    input_set: |
      Deliveries WHERE rotation_cycle_id == this AND status == FINALIZED.
      Excludes CANCELLED, SCHEDULED, EN_ROUTE, DELIVERED, DISPUTED (the last four
      cannot exist at close-time because they block the OPEN_to_CLOSED
      precondition).
    constants: {}
    precision: "integer cents"

  - name: par_projection
    trigger: "POST /rotation-cycles/{id}/deliveries (delivery generator on rotation)"
    algorithm: forward_looking
    formula: |
      # For each (location, product) with a ParLevel:
      #   projected_planned_units = par.par_units
      # then filter and rank:
      #   candidate_products = { p in ParLevel[location=L]
      #                          | not any preference.dietary_flag in p.dietary_flags
      #                            for preference in client.preferences }
      #   drop candidates where p.requires_refrigeration and Location.kind == PANTRY
      # ranking: sort by ParLevel.par_units DESC, tie-break by ParLevel.created_at ASC
      # if candidate set is empty after filters, endpoint returns ERR_EMPTY_ASSORTMENT.
    input_set: |
      All ParLevel rows for the target Location, joined against Product and the
      client's Preference blocks.
    constants: {}
    precision: "integer units; no rounding"
    variants:
      - name: chronological_actualization
        when: "at Delivery.confirm, actual_units may differ from planned_units"
        difference: "projected planned_units is a forward estimate; chronological realization at confirm may reduce (short-ship) or match; never exceed."

  - name: client_satisfaction_score
    trigger: "GET /clients/{id}/satisfaction (computed on read) and re-computed on POST /clients/{id}/feedback"
    algorithm: weighted_scoring
    formula: |
      # Rule 1 twin (different entity domain: subject scoring on Client, not cost
      # accounting on Delivery). Two variants produce different results for identical
      # data — differ in the input_set filter.
      # ----------------------------------------------------------------
      # Common formula:
      #   let F = filtered set of Feedback for this client per variant
      #   if len(F) == 0: score = 3.00 (neutral)
      #   else:
      #     numerator = sum(f.rating * (2 if f.swap_suggestion_product_id is not null else 1) for f in F)
      #     denominator = sum((2 if f.swap_suggestion_product_id is not null else 1) for f in F)
      #     score = round_half_up_2dp(numerator / denominator)
      # ----------------------------------------------------------------
      # Rounding: single round_half_up to 2 decimal places at the final step.
    input_set: |
      Feedback rows for this client's client_id. Variant "provisional" (see below)
      counts ALL feedback ever recorded (including for products no longer in any
      ParLevel). Variant "authoritative" counts only feedback whose product_id
      currently appears in a ParLevel under any of the client's Locations. Same
      client, same feedback rows, potentially different denominator → different
      score.
    constants:
      NEUTRAL_SCORE: 3.00
      SWAP_WEIGHT: 2
      NON_SWAP_WEIGHT: 1
      ROUND_MODE: "round_half_up"
    precision: "2 decimal places (float score returned as fixed-point number)"
    variants:
      - name: provisional_all_feedback
        when: "invoked for internal audit / churn analysis"
        difference: "counts every Feedback row for the client, including products no longer stocked at any of the client's Locations."
      - name: authoritative_stocked_feedback
        when: "invoked as a public GET /clients/{id}/satisfaction"
        difference: "excludes Feedback whose product_id is not present in any ParLevel under the client's Locations. Same rows as provisional_all_feedback minus the unstocked-product noise."

# ---------------------------------------------------------------------------
# §1.4 Validations (ordered)
# ---------------------------------------------------------------------------

validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present"
    error_id: ERR_MISSING_AUTH_HEADERS
    http_status: 401
    applies_to: "all except public catalog GETs"

  - priority: 2
    category: auth
    check: "X-User-Role is permitted for this endpoint (see RBAC matrix)"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "path-templated parent resource exists (left-to-right)"
    error_id: ERR_CLIENT_NOT_FOUND
    http_status: 404
    applies_to: "endpoints with /clients/{id}"

  - priority: 4
    category: existence
    check: "referenced foreign-key resource exists"
    error_id: ERR_LOCATION_NOT_FOUND
    http_status: 404
    applies_to: "endpoints with /locations/{id} or that reference location_id"

  - priority: 5
    category: existence
    check: "referenced foreign-key resource exists"
    error_id: ERR_SUBSCRIPTION_NOT_FOUND
    http_status: 404
    applies_to: "endpoints with /subscriptions/{id}"

  - priority: 6
    category: existence
    check: "referenced foreign-key resource exists"
    error_id: ERR_DELIVERY_NOT_FOUND
    http_status: 404
    applies_to: "endpoints with /deliveries/{id}"

  - priority: 7
    category: existence
    check: "referenced foreign-key resource exists"
    error_id: ERR_ROTATION_CYCLE_NOT_FOUND
    http_status: 404
    applies_to: "endpoints with /rotation-cycles/{id}"

  - priority: 8
    category: existence
    check: "referenced foreign-key resource exists"
    error_id: ERR_INVOICE_NOT_FOUND
    http_status: 404
    applies_to: "endpoints with /invoices/{id}"

  - priority: 9
    category: existence
    check: "referenced foreign-key resource exists"
    error_id: ERR_PRODUCT_NOT_FOUND
    http_status: 404
    applies_to: "endpoints that reference product_id or /products/{id}"

  - priority: 10
    category: existence
    check: "referenced foreign-key resource exists"
    error_id: ERR_PLAN_NOT_FOUND
    http_status: 404
    applies_to: "endpoints that reference plan_id"

  - priority: 11
    category: existence
    check: "acting user has ownership over the target resource (entity-backed roles only)"
    error_id: ERR_FORBIDDEN_OWNERSHIP
    http_status: 403
    applies_to: "endpoints with entity_backed acting roles (ClientAdmin, LocationManager) on scoped resources"

  - priority: 12
    category: state
    check: "target entity is in a state from which this transition is valid (see §1.2). Also applies to POST /rotation-cycles/{id}/deliveries: the RotationCycle must be OPEN (not CLOSED, not INVALIDATED)."
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints; POST /rotation-cycles/{id}/deliveries (must be OPEN)"

  - priority: 13
    category: state
    check: "cross-entity precondition: acting Delivery's subscription.status == ACTIVE for dispatch/confirm"
    error_id: ERR_SUBSCRIPTION_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /deliveries/{id}/dispatch, POST /deliveries/{id}/confirm"

  - priority: 14
    category: state
    check: "cross-entity precondition: Invoice.dispute_status must be CLEAN or RESOLVED to accept payment"
    error_id: ERR_INVOICE_UNDER_DISPUTE
    http_status: 409
    applies_to: "POST /invoices/{id}/pay"

  - priority: 15
    category: business_safety
    check: "product's dietary_flags must not overlap any of the client's Preference dietary_flags"
    error_id: ERR_DIETARY_PREFERENCE_VIOLATION
    http_status: 422
    applies_to: "POST /locations/{id}/par-levels, POST /clients/{id}/feedback (swap_suggestion_product_id)"

  - priority: 16
    category: business_safety
    check: "product.requires_refrigeration=true may only be placed at Location.kind IN {FRIDGE, MICRO_MARKET}"
    error_id: ERR_REFRIGERATION_MISMATCH
    http_status: 422
    applies_to: "POST /locations/{id}/par-levels"

  - priority: 17
    category: business_constraint
    check: "sum of ParLevel.par_units at a Location must not exceed Location.capacity_units"
    error_id: ERR_LOCATION_CAPACITY_EXCEEDED
    http_status: 422
    applies_to: "POST /locations/{id}/par-levels"

  - priority: 18
    category: business_temporal
    check: "Delivery.scheduled_at must be >= 24 hours after any existing non-cancelled Delivery.scheduled_at at the same Location (buffer semantics; exact-24h is allowed, <24h is rejected)"
    error_id: ERR_DELIVERY_SCHEDULE_CONFLICT
    http_status: 409
    applies_to: "POST /rotation-cycles/{id}/deliveries"

  - priority: 19
    category: business_temporal
    check: "RotationCycle interval adjacency: for the same subscription, cycles form a strictly disjoint half-open interval sequence [effective_from, effective_to). A new cycle's [start, end) must not overlap ANY existing cycle's interval (overlap semantics: two half-open intervals [a,b) and [c,d) overlap iff a < d AND c < b). Zero-overlap is required; distinct-but-non-adjacent gaps are also invalid — see distinct check below."
    error_id: ERR_ROTATION_CYCLE_OVERLAP
    http_status: 422
    applies_to: "system: create RotationCycle via subscription activate/resume; POST /rotation-cycles/{id}/deliveries when generating an out-of-window Delivery"

  - priority: 20
    category: business_referential
    check: "at most one non-terminal Subscription per Client at any time"
    error_id: ERR_SUBSCRIPTION_ALREADY_ACTIVE
    http_status: 409
    applies_to: "POST /clients/{id}/subscriptions"

  - priority: 21
    category: business_referential
    check: "candidate assortment set for delivery generation must be non-empty after preference filter"
    error_id: ERR_EMPTY_ASSORTMENT
    http_status: 422
    applies_to: "POST /rotation-cycles/{id}/deliveries"

  - priority: 22
    category: business_fiscal
    check: "client.headcount must be >= 1 on any subscription create"
    error_id: ERR_INVALID_HEADCOUNT
    http_status: 422
    applies_to: "POST /clients/{id}/subscriptions, PATCH /clients/{id}/headcount"

  - priority: 23
    category: business_referential
    check: "OCC on Client.version for subscription creation"
    error_id: ERR_STALE_CLIENT_VERSION
    http_status: 412
    applies_to: "POST /clients/{id}/subscriptions"

# ---------------------------------------------------------------------------
# §1.5 Endpoints
# ---------------------------------------------------------------------------

endpoints:
  - method: POST
    path: "/plans"
    description: "PlatformAdmin creates a Plan (billing configuration)."
    roles: [PlatformAdmin]
    code: 201
    input:
      - tier
      - billing_type
      - base_fee_cents?
      - per_employee_fee_cents?
      - flat_fee_cents?
      - volume_discount_threshold_headcount
      - volume_discount_pct?
    output: Plan
    side_effects: []

  - method: GET
    path: "/plans/{id}"
    description: "Retrieve a Plan."
    roles: [PlatformAdmin, ClientAdmin]
    code: 200
    input: []
    output: Plan
    side_effects: []

  - method: GET
    path: "/plans"
    description: "List Plans."
    roles: [PlatformAdmin, ClientAdmin]
    code: 200
    input:
      - limit?
      - offset?
    output: Plan[]
    side_effects: []

  - method: POST
    path: "/products"
    description: "PlatformAdmin creates a Product."
    roles: [PlatformAdmin]
    code: 201
    input:
      - sku
      - name
      - category
      - dietary_flags?
      - unit_cost_cents
      - requires_refrigeration?
    output: Product
    side_effects: []

  - method: GET
    path: "/products/{id}"
    description: "Retrieve a Product."
    roles: [PlatformAdmin, ClientAdmin, LocationManager]
    code: 200
    input: []
    output: Product
    side_effects: []

  - method: GET
    path: "/products"
    description: "List Products."
    roles: [PlatformAdmin, ClientAdmin, LocationManager]
    code: 200
    input:
      - category?
      - limit?
      - offset?
    output: Product[]
    side_effects: []

  - method: POST
    path: "/clients"
    description: "PlatformAdmin creates a Client (office)."
    roles: [PlatformAdmin]
    code: 201
    input:
      - name
      - headcount
    output: Client
    side_effects: []

  - method: GET
    path: "/clients/{id}"
    description: "Retrieve a Client."
    roles: [PlatformAdmin, ClientAdmin]
    code: 200
    input: []
    output: Client
    side_effects: []

  - method: PATCH
    path: "/clients/{id}/headcount"
    description: "PlatformAdmin adjusts the client's headcount."
    roles: [PlatformAdmin]
    code: 200
    input:
      - headcount
    output: Client
    side_effects:
      - "increments client.version by 1"
      - "server-stamp client.updated_at"

  - method: POST
    path: "/clients/{id}/locations"
    description: "ClientAdmin declares a Location at the office."
    roles: [ClientAdmin]
    code: 201
    input:
      - name
      - kind
      - capacity_units
      - service_fee_bps?
    output: Location
    side_effects: []

  - method: GET
    path: "/clients/{id}/locations"
    description: "List Locations for a client."
    roles: [PlatformAdmin, ClientAdmin]
    code: 200
    input:
      - limit?
      - offset?
    output: Location[]
    side_effects: []

  - method: GET
    path: "/locations/{id}"
    description: "Retrieve a Location."
    roles: [PlatformAdmin, ClientAdmin, LocationManager]
    code: 200
    input: []
    output: Location
    side_effects: []

  - method: GET
    path: "/locations"
    description: "List Locations across the platform (filter by client_id)."
    roles: [PlatformAdmin]
    code: 200
    input:
      - client_id?
      - limit?
      - offset?
    output: Location[]
    side_effects: []

  - method: POST
    path: "/clients/{id}/preferences"
    description: "ClientAdmin declares a dietary preference block for the client."
    roles: [ClientAdmin]
    code: 201
    input:
      - dietary_flag
    output: Preference
    side_effects: []

  - method: GET
    path: "/clients/{id}/preferences"
    description: "List Preferences for a client."
    roles: [PlatformAdmin, ClientAdmin]
    code: 200
    input:
      - limit?
      - offset?
    output: Preference[]
    side_effects: []

  - method: POST
    path: "/locations/{id}/par-levels"
    description: "LocationManager sets a ParLevel for a (location, product)."
    roles: [LocationManager]
    code: 201
    input:
      - product_id
      - par_units
    output: ParLevel
    side_effects: []

  - method: GET
    path: "/locations/{id}/par-levels"
    description: "List ParLevels for a Location."
    roles: [PlatformAdmin, ClientAdmin, LocationManager]
    code: 200
    input:
      - limit?
      - offset?
    output: ParLevel[]
    side_effects: []

  - method: GET
    path: "/par-levels/{id}"
    description: "Retrieve a ParLevel."
    roles: [PlatformAdmin, ClientAdmin, LocationManager]
    code: 200
    input: []
    output: ParLevel
    side_effects: []

  - method: GET
    path: "/par-levels"
    description: "List all ParLevels (platform view; filter by location_id or product_id)."
    roles: [PlatformAdmin]
    code: 200
    input:
      - location_id?
      - product_id?
      - limit?
      - offset?
    output: ParLevel[]
    side_effects: []

  - method: POST
    path: "/clients/{id}/subscriptions"
    description: "ClientAdmin creates a Subscription for this client with OCC on client.version."
    roles: [ClientAdmin]
    code: 201
    input:
      - plan_id
      - expected_client_version
    output: Subscription
    side_effects:
      - "creates Subscription with status=DRAFT"
      - "snapshots plan.version onto subscription.plan_version_snapshot"
      - "sets client.active_subscription_id = new subscription.id"
      - "increments client.version by 1"

  - method: GET
    path: "/subscriptions/{id}"
    description: "Retrieve a Subscription."
    roles: [PlatformAdmin, ClientAdmin]
    code: 200
    input: []
    output: Subscription
    side_effects: []

  - method: GET
    path: "/subscriptions"
    description: "List Subscriptions (filter by client_id or plan_id)."
    roles: [PlatformAdmin, ClientAdmin]
    code: 200
    input:
      - client_id?
      - plan_id?
      - limit?
      - offset?
    output: Subscription[]
    side_effects: []

  - method: POST
    path: "/subscriptions/{id}/activate"
    description: "PlatformAdmin activates a DRAFT subscription (DRAFT -> ACTIVE)."
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Subscription
    side_effects:
      - "opens the first RotationCycle for this subscription"
      - "increments subscription.version by 1"

  - method: POST
    path: "/subscriptions/{id}/pause"
    description: "ClientAdmin pauses ACTIVE subscription (ACTIVE -> PAUSED); triggers a depth-3+ cascade."
    roles: [ClientAdmin]
    code: 200
    input: []
    output: Subscription
    side_effects:
      - "cascade hop 1 (this transition): Subscription.ACTIVE_to_PAUSED"
      - "cascade hop 2 (caused by hop 1): OPEN RotationCycle -> INVALIDATED"
      - "cascade hop 3 (caused by hop 2): each Delivery under the RC with status IN {SCHEDULED, EN_ROUTE} -> CANCELLED"
      - "cascade hop 4 (caused by hop 3, only for EN_ROUTE deliveries): client.credit_balance_cents credited by delivery.provisional_cents"
      - "increments subscription.version by 1"

  - method: POST
    path: "/subscriptions/{id}/resume"
    description: "ClientAdmin resumes PAUSED subscription (PAUSED -> ACTIVE); opens a new rotation."
    roles: [ClientAdmin]
    code: 200
    input: []
    output: Subscription
    side_effects:
      - "opens a new RotationCycle"
      - "increments subscription.version by 1"

  - method: POST
    path: "/subscriptions/{id}/cancel"
    description: "ClientAdmin cancels subscription (ACTIVE|PAUSED -> CANCELLED)."
    roles: [ClientAdmin]
    code: 200
    input: []
    output: Subscription
    side_effects:
      - "clears client.active_subscription_id"
      - "cascades same as pause when transitioning from ACTIVE"
      - "increments subscription.version by 1"

  - method: GET
    path: "/subscriptions/{id}/rotation-cycles"
    description: "List RotationCycles for a subscription."
    roles: [PlatformAdmin, ClientAdmin]
    code: 200
    input:
      - limit?
      - offset?
    output: RotationCycle[]
    side_effects: []

  - method: GET
    path: "/rotation-cycles/{id}"
    description: "Retrieve a RotationCycle."
    roles: [PlatformAdmin, ClientAdmin]
    code: 200
    input: []
    output: RotationCycle
    side_effects: []

  - method: POST
    path: "/rotation-cycles/{id}/close"
    description: "PlatformAdmin closes an OPEN rotation once all deliveries are terminal and the window is past. Creates the Invoice."
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Invoice
    side_effects:
      - "creates Invoice with subscription_fee_cents, consumption_cents, credit_applied_cents, total_cents"
      - "decrements client.credit_balance_cents by credit_applied_cents"
      - "increments rotation_cycle.version by 1"
      - "increments client.version by 1"

  - method: POST
    path: "/rotation-cycles/{id}/deliveries"
    description: "PlatformAdmin generates a Delivery under a rotation. The delivery generator picks products per calculations.par_projection."
    roles: [PlatformAdmin]
    code: 201
    input:
      - location_id
      - scheduled_at
    output: Delivery
    side_effects:
      - "creates DeliveryLine rows using ParLevel-derived planned_units after preference filter"
      - "increments rotation_cycle.version by 1"

  - method: GET
    path: "/rotation-cycles/{id}/deliveries"
    description: "List Deliveries under a RotationCycle."
    roles: [PlatformAdmin, ClientAdmin, LocationManager]
    code: 200
    input:
      - limit?
      - offset?
    output: Delivery[]
    side_effects: []

  - method: GET
    path: "/deliveries/{id}"
    description: "Retrieve a Delivery."
    roles: [PlatformAdmin, ClientAdmin, LocationManager]
    code: 200
    input: []
    output: Delivery
    side_effects: []

  - method: GET
    path: "/deliveries"
    description: "List Deliveries (filter by location_id or rotation_cycle_id)."
    roles: [PlatformAdmin]
    code: 200
    input:
      - location_id?
      - rotation_cycle_id?
      - limit?
      - offset?
    output: Delivery[]
    side_effects: []

  - method: POST
    path: "/deliveries/{id}/dispatch"
    description: "PlatformAdmin dispatches a SCHEDULED delivery (SCHEDULED -> EN_ROUTE)."
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Delivery
    side_effects:
      - "computes delivery.provisional_cents"
      - "increments delivery.version by 1"

  - method: POST
    path: "/deliveries/{id}/confirm"
    description: "LocationManager confirms delivery arrived (EN_ROUTE -> DELIVERED)."
    roles: [LocationManager]
    code: 200
    input: []
    output: Delivery
    side_effects:
      - "server-stamps delivery.delivered_at"
      - "increments delivery.version by 1"

  - method: POST
    path: "/deliveries/{id}/dispute"
    description: "LocationManager files a dispute on a DELIVERED delivery (DELIVERED -> DISPUTED)."
    roles: [LocationManager]
    code: 200
    input:
      - dispute_reason
    output: Delivery
    side_effects:
      - "records delivery.dispute_reason"
      - "increments delivery.version by 1"

  - method: POST
    path: "/deliveries/{id}/resolve-dispute"
    description: "PlatformAdmin resolves a dispute (DISPUTED -> FINALIZED) after actuals are set. Credits client for shortfall."
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Delivery
    side_effects:
      - "computes delivery.final_cents and delivery.dispute_credit_cents"
      - "credits client.credit_balance_cents by delivery.dispute_credit_cents"
      - "increments delivery.version by 1"
      - "increments client.version by 1"

  - method: POST
    path: "/deliveries/{id}/finalize"
    description: "PlatformAdmin auto-finalizes a DELIVERED delivery after 48h (DELIVERED -> FINALIZED)."
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Delivery
    side_effects:
      - "computes delivery.final_cents = delivery.provisional_cents"
      - "increments delivery.version by 1"

  - method: GET
    path: "/deliveries/{id}/lines"
    description: "List DeliveryLines for a Delivery."
    roles: [PlatformAdmin, ClientAdmin, LocationManager]
    code: 200
    input:
      - limit?
      - offset?
    output: DeliveryLine[]
    side_effects: []

  - method: PATCH
    path: "/delivery-lines/{id}/actual"
    description: "LocationManager reports actual units for a DeliveryLine (used before dispute resolution)."
    roles: [LocationManager]
    code: 200
    input:
      - actual_units
    output: DeliveryLine
    side_effects:
      - "increments delivery_line.version by 1"

  - method: GET
    path: "/delivery-lines/{id}"
    description: "Retrieve a DeliveryLine."
    roles: [PlatformAdmin, LocationManager]
    code: 200
    input: []
    output: DeliveryLine
    side_effects: []

  - method: GET
    path: "/delivery-lines"
    description: "List DeliveryLines (filter by delivery_id or product_id)."
    roles: [PlatformAdmin, LocationManager]
    code: 200
    input:
      - delivery_id?
      - product_id?
      - limit?
      - offset?
    output: DeliveryLine[]
    side_effects: []

  - method: GET
    path: "/invoices/{id}"
    description: "Retrieve an Invoice."
    roles: [PlatformAdmin, ClientAdmin]
    code: 200
    input: []
    output: Invoice
    side_effects: []

  - method: GET
    path: "/clients/{id}/invoices"
    description: "List Invoices for a client."
    roles: [PlatformAdmin, ClientAdmin]
    code: 200
    input:
      - limit?
      - offset?
    output: Invoice[]
    side_effects: []

  - method: GET
    path: "/invoices"
    description: "List Invoices (filter by rotation_cycle_id)."
    roles: [PlatformAdmin]
    code: 200
    input:
      - rotation_cycle_id?
      - limit?
      - offset?
    output: Invoice[]
    side_effects: []

  - method: POST
    path: "/invoices/{id}/pay"
    description: "ClientAdmin marks an invoice paid (payment_status UNPAID -> PAID)."
    roles: [ClientAdmin]
    code: 200
    input: []
    output: Invoice
    side_effects:
      - "increments invoice.version by 1"

  - method: POST
    path: "/invoices/{id}/resolve-dispute"
    description: "PlatformAdmin resolves an Invoice dispute (dispute_status UNDER_DISPUTE -> RESOLVED). Independent of payment_status."
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Invoice
    side_effects:
      - "increments invoice.version by 1"

  - method: POST
    path: "/clients/{id}/feedback"
    description: "ClientAdmin submits Feedback about a Product; may include a swap_suggestion for the next rotation."
    roles: [ClientAdmin]
    code: 201
    input:
      - product_id
      - rating
      - comment?
      - swap_suggestion_product_id?
    output: Feedback
    side_effects: []

  - method: GET
    path: "/clients/{id}/feedback"
    description: "List Feedback for a client."
    roles: [PlatformAdmin, ClientAdmin]
    code: 200
    input:
      - product_id?
      - limit?
      - offset?
    output: Feedback[]
    side_effects: []

  - method: GET
    path: "/clients/{id}/satisfaction"
    description: "Compute a client satisfaction score (0.00-5.00). Uses calculations.client_satisfaction_score authoritative variant. Body inline schema below."
    roles: [PlatformAdmin, ClientAdmin]
    code: 200
    input:
      - variant?
    output: "{ client_id: string, variant: string, score: number, feedback_considered: integer }"
    side_effects: []

  - method: GET
    path: "/feedback/{id}"
    description: "Retrieve a Feedback record."
    roles: [PlatformAdmin, ClientAdmin]
    code: 200
    input: []
    output: Feedback
    side_effects: []

  - method: GET
    path: "/feedback"
    description: "Platform-wide feedback listing (filter by client_id, product_id, or swap_suggestion_product_id)."
    roles: [PlatformAdmin]
    code: 200
    input:
      - client_id?
      - product_id?
      - swap_suggestion_product_id?
      - limit?
      - offset?
    output: Feedback[]
    side_effects: []

  - method: POST
    path: "/_clock/set_current_utc"
    description: "Test-driving endpoint. Sets the server's logical clock to the given UTC instant. Default server clock at startup (before any set_current_utc call) is 2026-03-01T00:00:00Z."
    roles: [PlatformAdmin]
    code: 200
    input:
      - to_iso8601
    output: null
    side_effects:
      - "server logical clock now returns to_iso8601 for all subsequent operations"

  - method: POST
    path: "/_system/advance-invoice-default"
    description: "Test-driving endpoint. Runs the overdue-invoice sweep: for every Invoice where payment_status == UNPAID and clock.now >= period_end + 30 days, transition payment_status to DEFAULT."
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: null
    side_effects:
      - "sets payment_status = DEFAULT on every eligible invoice"
      - "increments each affected invoice.version by 1"

# ---------------------------------------------------------------------------
# §1.6 Errors
# ---------------------------------------------------------------------------

errors:
  - id: ERR_MISSING_AUTH_HEADERS
    http: 401
    condition: "X-User-Role or X-User-ID header absent or empty"

  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "X-User-Role not permitted for endpoint per RBAC"

  - id: ERR_FORBIDDEN_OWNERSHIP
    http: 403
    condition: "acting entity-backed user's X-User-ID does not equal the target resource's owning entity id"

  - id: ERR_CLIENT_NOT_FOUND
    http: 404
    condition: "referenced Client id does not exist"

  - id: ERR_LOCATION_NOT_FOUND
    http: 404
    condition: "referenced Location id does not exist"

  - id: ERR_PRODUCT_NOT_FOUND
    http: 404
    condition: "referenced Product id does not exist"

  - id: ERR_PLAN_NOT_FOUND
    http: 404
    condition: "referenced Plan id does not exist"

  - id: ERR_SUBSCRIPTION_NOT_FOUND
    http: 404
    condition: "referenced Subscription id does not exist"

  - id: ERR_DELIVERY_NOT_FOUND
    http: 404
    condition: "referenced Delivery id does not exist"

  - id: ERR_ROTATION_CYCLE_NOT_FOUND
    http: 404
    condition: "referenced RotationCycle id does not exist"

  - id: ERR_INVOICE_NOT_FOUND
    http: 404
    condition: "referenced Invoice id does not exist"

  - id: ERR_DELIVERY_LINE_NOT_FOUND
    http: 404
    condition: "referenced DeliveryLine id does not exist"

  - id: ERR_INVALID_STATE
    http: 409
    condition: "state-transition endpoint invoked from a state that does not permit the transition per §1.2"

  - id: ERR_SUBSCRIPTION_NOT_ACTIVE
    http: 409
    condition: "operation requires subscription.status == ACTIVE but it is not"

  - id: ERR_INVOICE_UNDER_DISPUTE
    http: 409
    condition: "invoice.dispute_status == UNDER_DISPUTE at the time of payment attempt"

  - id: ERR_DIETARY_PREFERENCE_VIOLATION
    http: 422
    condition: "product's dietary_flags intersect the client's Preference dietary_flags"

  - id: ERR_REFRIGERATION_MISMATCH
    http: 422
    condition: "product.requires_refrigeration true but Location.kind == PANTRY"

  - id: ERR_LOCATION_CAPACITY_EXCEEDED
    http: 422
    condition: "adding the requested par_units would push sum(ParLevel.par_units) at Location over Location.capacity_units"

  - id: ERR_DELIVERY_SCHEDULE_CONFLICT
    http: 409
    condition: "requested delivery.scheduled_at is strictly less than 24 hours after an existing non-cancelled delivery.scheduled_at at the same location"

  - id: ERR_ROTATION_CYCLE_OVERLAP
    http: 422
    condition: "attempting to open a new RotationCycle whose [effective_from, effective_to) half-open interval overlaps an existing cycle for the same subscription (a < d AND c < b), OR generating a Delivery whose scheduled_at falls outside the [effective_from, effective_to) window of the referenced RotationCycle"

  - id: ERR_SUBSCRIPTION_ALREADY_ACTIVE
    http: 409
    condition: "client already has a non-terminal Subscription"

  - id: ERR_EMPTY_ASSORTMENT
    http: 422
    condition: "candidate product set for delivery generation is empty after applying preferences and refrigeration filters"

  - id: ERR_INVALID_HEADCOUNT
    http: 422
    condition: "client.headcount would fall below 1"

  - id: ERR_STALE_CLIENT_VERSION
    http: 412
    condition: "expected_client_version does not equal current client.version"

  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "malformed or missing required fields in request body"

# ---------------------------------------------------------------------------
# §1.7 RBAC
# ---------------------------------------------------------------------------

roles:
  - name: PlatformAdmin
    description: "Operations staff running the SnackNation platform: create Plans, Products, Clients; run rotations; dispatch/finalize deliveries; close rotations; run the overdue-invoice sweep."
    identity: "opaque"
    exclusive_operations:
      - "POST /plans"
      - "POST /products"
      - "POST /clients"
      - "PATCH /clients/{id}/headcount"
      - "POST /subscriptions/{id}/activate"
      - "POST /rotation-cycles/{id}/close"
      - "POST /rotation-cycles/{id}/deliveries"
      - "POST /deliveries/{id}/dispatch"
      - "POST /deliveries/{id}/resolve-dispute"
      - "POST /deliveries/{id}/finalize"
      - "POST /invoices/{id}/resolve-dispute"
      - "POST /_clock/set_current_utc"
      - "POST /_system/advance-invoice-default"
    shared_operations:
      - "GET /* (read-only listings and retrievals)"

  - name: ClientAdmin
    description: "Client-side administrator for a specific Client (office); manages the subscription lifecycle, preferences, invoices, and feedback."
    identity: "entity_backed:Client"
    exclusive_operations:
      - "POST /clients/{id}/subscriptions"
      - "POST /subscriptions/{id}/pause"
      - "POST /subscriptions/{id}/resume"
      - "POST /subscriptions/{id}/cancel"
      - "POST /clients/{id}/preferences"
      - "POST /clients/{id}/locations"
      - "POST /clients/{id}/feedback"
      - "POST /invoices/{id}/pay"
    shared_operations:
      - "GET /clients/{id}, /clients/{id}/locations, /clients/{id}/preferences, /clients/{id}/feedback, /clients/{id}/invoices, /subscriptions/{id}, /subscriptions/{id}/rotation-cycles, /rotation-cycles/{id}, /rotation-cycles/{id}/deliveries, /deliveries/{id}, /deliveries/{id}/lines, /invoices/{id} scoped to acting client's owned resources"
      - "GET /plans, /plans/{id}, /products, /products/{id}"

  - name: LocationManager
    description: "On-site manager at a specific Location; confirms deliveries, files disputes, sets par levels, and reports actual units received."
    identity: "entity_backed:Location"
    exclusive_operations:
      - "POST /locations/{id}/par-levels"
      - "POST /deliveries/{id}/confirm"
      - "POST /deliveries/{id}/dispute"
      - "PATCH /delivery-lines/{id}/actual"
    shared_operations:
      - "GET /locations/{id}, /locations/{id}/par-levels, /deliveries/{id}, /deliveries/{id}/lines, /rotation-cycles/{id}/deliveries, /delivery-lines, /products, /products/{id} scoped to acting location's resources"
