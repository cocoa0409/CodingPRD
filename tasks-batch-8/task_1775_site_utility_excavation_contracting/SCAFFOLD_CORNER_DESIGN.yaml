              as: Foreman
              captures: { s2_id: $.data.id, s2_lifts: $.data.lifts_required }
          assert:
            - "PipeSegment.${s1_id}.lifts_required == 10 (ceil(9.5 / 1.0))"
            - "PipeSegment.${s2_id}.lifts_required == 2 (ceil(1.75 / 1.0))"

      - name: daily_volume_crossing_flips_classification
        claim_type: input_set_filtering
        grounds:
          - calculations.discharge_classification
          - entities.DischargeReading.fields.volume_gal
        distinguishing_aspect: "Chronological cumulative volume: readings of 40000 + 40000 + 20000 gal reach exactly the 100000 limit and stay NORMAL (> is exclusive); the next 1000-gal reading crosses to 101000 and flips to EXCEEDS_VOLUME. Only same-UTC-date readings of the same permit enter the sum."
        test_recipe:
          setup: ["Project P; permit DP ACTIVE (effective 2026-08-01 -> 2026-09-01; max_flow 500; turbidity 50; daily volume 100000) at default clock 2026-08-01"]
          setup_api_calls:
            - call: "POST /site-utility/projects"
              payload: { name: "P-VOL", contract_ref: "C-301", soil_class_default: SOIL_A, contingency_cents: 100000000, single_co_cap_cents: 5000000 }
              as: ProjectManager
              captures: { p_id: $.data.id }
            - call: "POST /site-utility/discharge-permits"
              payload: { project_id: "${p_id}", permit_number: "DP-1", max_flow_gpm: 500, turbidity_limit_ntu: 50, daily_volume_limit_gal: 100000, effective_from: "2026-08-01T00:00:00Z", effective_to: "2026-09-01T00:00:00Z" }
              as: ProjectManager
              captures: { dp_id: $.data.id }
          trigger:
            - call: "POST /site-utility/discharge-readings"
              payload: { discharge_permit_id: "${dp_id}", recorded_at: "2026-08-02T01:00:00Z", flow_gpm: 100, turbidity_ntu: 10, duration_min: 400 }
              as: Foreman
              captures: { r1_id: $.data.id, r1_class: $.data.classification }
            - call: "POST /site-utility/discharge-readings"
              payload: { discharge_permit_id: "${dp_id}", recorded_at: "2026-08-02T02:00:00Z", flow_gpm: 100, turbidity_ntu: 10, duration_min: 400 }
              as: Foreman
              captures: { r2_id: $.data.id }
            - call: "POST /site-utility/discharge-readings"
              payload: { discharge_permit_id: "${dp_id}", recorded_at: "2026-08-02T03:00:00Z", flow_gpm: 100, turbidity_ntu: 10, duration_min: 200 }
              as: Foreman
              captures: { r3_id: $.data.id, r3_class: $.data.classification }
            - call: "POST /site-utility/discharge-readings"
              payload: { discharge_permit_id: "${dp_id}", recorded_at: "2026-08-02T04:00:00Z", flow_gpm: 100, turbidity_ntu: 10, duration_min: 10 }
              as: Foreman
              captures: { r4_id: $.data.id, r4_class: $.data.classification }
          assert:
            - "Reading ${r1_id}: volume_gal == 40000, classification NORMAL"
            - "Reading ${r3_id}: cumulative 100000 == limit -> still NORMAL (exclusive > boundary)"
            - "Reading ${r4_id}: cumulative 101000 > 100000 -> EXCEEDS_VOLUME"
            - "DischargePermit.${dp_id}.exceedance_count == 1 and status stays ACTIVE (volume exceedance does not suspend)"

      - name: inspection_slope_tolerance_boundary
        claim_type: precision
        grounds:
          - calculations.installation_inspection_result
          - entities.InstallationInspection.fields.result
        distinguishing_aspect: "Inclusive slope-tolerance boundary: measured 1.2 against design 1.0 deviates exactly 0.2 -> PASS; 1.21 deviates 0.21 -> FAIL, all other checks held equal."
        test_recipe:
          setup:
            - "Project P; owner O; ticket ACTIVE (clock 2026-08-03); pothole VERIFIED; segment S (design_slope_pct 1.0) INSTALLED via READY -> INSTALLING -> complete-install"
          setup_api_calls:
