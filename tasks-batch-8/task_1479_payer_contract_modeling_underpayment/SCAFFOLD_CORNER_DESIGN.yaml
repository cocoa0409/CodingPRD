      - name: sm_escalator_creation_on_suspended_contract_rejected
        claim_type: precondition_enforcement
        grounds: ["validations[priority=6]", "state_machines.PayerContract.ACTIVE_to_SUSPENDED", "errors[ERR_INVALID_STATE_TRANSITION]"]
        distinguishing_aspect: "Escalator creation requires contract DRAFT or ACTIVE; on a SUSPENDED contract it is rejected ERR_INVALID_STATE_TRANSITION."
        test_recipe:
          setup: ["payer P; contract C ACTIVE with term, then SUSPENDED"]
          setup_api_calls:
            - call: "POST /api/payers"
              payload: { name: "Payer ES", payer_type: "COMMERCIAL", appeal_deadline_days: 45 }
              as: ContractManager
              captures: { payer_id: "$.data.id" }
            - call: "POST /api/payer-contracts"
              payload: { payer_id: "${payer_id}", contract_code: "ES-2026", effective_date: "2026-01-01", expiration_date: "2026-12-31" }
