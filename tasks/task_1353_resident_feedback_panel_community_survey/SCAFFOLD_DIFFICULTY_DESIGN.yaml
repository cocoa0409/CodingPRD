            - { call: "POST /feedback-panel/invitations", payload: { wave_id: "${w0_id}", panelist_id: "${p1_id}" }, as: PanelManager, captures: { inv0: $.data.id } }
            - { call: "POST /feedback-panel/responses", payload: { invitation_id: "${inv0}", answers_payload: { q1: 4 }, completeness_pct: 100, completion_seconds: 300 }, as: PanelManager, captures: { r0: $.data.id } }
            - { call: "POST /feedback-panel/responses/${r0}/accept", payload: {}, as: DataAnalyst }
            - { call: "GET /feedback-panel/incentive-awards?response_id=${r0}", payload: {}, as: IncentiveClerk, captures: { award0: "$.data[0].id" } }
            - { call: "POST /feedback-panel/incentive-awards/${award0}/authorize", payload: {}, as: IncentiveClerk }
