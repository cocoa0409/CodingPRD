              payload: { vendor_id: "${vend}", style_id: "${st}", quantity_ordered: 12500, unit_cost_cents_per_thousand: 8450, press_window_start: "2026-08-10T08:00:00Z", press_window_end: "2026-08-12T08:00:00Z", expected_ballot_style_version: "${st_v}" }
              as: BallotCoordinator
              captures: { ok_status: $.data.status }
          assert:
            - "${e400} == \"ERR_INVALID_REQUEST\" with HTTP 400 (quantity_ordered must be >= 1)."
            - "${e401} == \"ERR_UNAUTHENTICATED\" with HTTP 401 (the X-Role header is omitted on that call)."
            - "${e403} == \"ERR_UNAUTHORIZED\" with HTTP 403 (lock-styles is ElectionsDirector-only)."
            - "${e404} == \"ERR_PRINT_JOB_NOT_FOUND\" with HTTP 404."
            - "${e409} == \"ERR_ELECTION_PHASE_INVALID\" with HTTP 409 (the election is already STYLES_LOCKED, and lock-styles is permitted only from CONTESTS_CERTIFIED)."
            - "${e412} == \"ERR_STALE_BALLOT_STYLE_VERSION\" with HTTP 412 - ${st_stale} was read before lock-styles bumped the style, so it is exactly one revision behind ${st_v}."
            - "Every one of the six responses has response_type \"error\" and a data object whose keys are exactly error_id and message, with a non-empty message and no partial entity payload; the meta block still carries api_request_id and api_request_timestamp."
            - "Call 7, identical to call 6 except for the current version, returns HTTP 201 with ${ok_status} == \"PROOF_PENDING\" and response_type \"object\" - the success envelope differs from the error envelope only in response_type and data."
            - "Exactly one PrintJob row exists at the end, and PrintVendor.${vend}.active_job_count == 1."

