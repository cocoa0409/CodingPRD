            - "${ct_end} == 2026-08-27T00:00:00Z (contact_date + 21 days)"

      - name: osha_recordable_recompute_on_pep_start
        claim_type: correct_result
        grounds: ["calculations.osha_recordable_determination"]
        distinguishing_aspect: "Derived-field reconciliation: a manual SPLASH injury linked to a MEDIUM case is NOT recordable at filing; it recomputes to recordable == true when the case's PEP transitions to STARTED."
