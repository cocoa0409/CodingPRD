      - name: reserve_ledger_rows_are_immutable_and_carry_no_version_field
        claim_type: immutability
        grounds:
          - entities.LifecycleReserveTransaction
          - entities.LifecycleReserveTransaction.fields.resulting_balance_cents
          - calculations.lifecycle_reserve_balance
          - calculations.reserve_ledger_conservation
        distinguishing_aspect: |
          LifecycleReserveTransaction declares `common_fields: false`, so its rows carry
          no `version` and no `updated_at`, there is no PATCH or DELETE for them in §1.5,
          and a later append must not rewrite an earlier row's resulting_balance_cents:
          row 1 keeps 5000000 forever even though the concession's live balance is
          7000000 after row 2.
        test_recipe:
          setup:
            - "A DRAFTED concession with one CONTRIBUTION of 5000000 already appended (sequence_no 1)."
          setup_api_calls:
