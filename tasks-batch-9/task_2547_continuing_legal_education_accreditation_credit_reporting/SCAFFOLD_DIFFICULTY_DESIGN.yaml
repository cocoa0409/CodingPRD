      - name: sweep_deadline_and_suspension_day_boundaries_are_both_inclusive
        grounds:
          - state_machines.ComplianceCycle.GOOD_STANDING_to_DELINQUENT
          - state_machines.ComplianceCycle.DELINQUENT_to_ADMIN_SUSPENDED
          - domain_constants.DELINQUENCY_TO_SUSPENSION_DAYS
          - domain_constants.DEADLINE_OFFSET_DAYS
          - endpoints[POST /cle/reporting-sweeps]
        distinguishing_aspect: |
          A different metric (ELAPSED LOGICAL-CLOCK DAYS and the filing-deadline instant itself) at a
          different endpoint (POST /cle/reporting-sweeps). Both comparisons are declared inclusive
          (sweep.as_of >= filing_deadline, and >= delinquent_since + 60 days), so four sweeps at
          deadline-1s, deadline, +59 days and +60 days must produce nothing, a delinquency, nothing,
          and a suspension. Falsifiable: a strict `>` implementation needs a fifth sweep to act, and
          an implementation counting from period_end instead of filing_deadline fires 91 days early.
        test_recipe:
          setup:
            - "One ACTIVE attorney admitted 2010-02-01, compliance GROUP_3 (DEADLINE_OFFSET_DAYS 91), with cycle 2024-01-01 -> 2026-01-01 and no credit records, so filing_deadline == 2026-04-02T00:00:00Z."
            - "The clock is wound back from its 2026-08-01 default to one second before that deadline; every sweep below runs against the logical clock only."
          setup_api_calls:
            - call: "POST /cle/attorneys"
              payload: { bar_number: "BAR-1111", full_name: "Constance Mbeki", admission_date: "2010-02-01T00:00:00Z", compliance_group: "GROUP_3", principal_office_jurisdiction: "ST" }
              as: BoardAdmin
              captures: { att_id: $.data.id }
            - call: "POST /cle/attorneys/${att_id}/compliance-cycles"
              payload: { period_start: "2024-01-01T00:00:00Z", period_end: "2026-01-01T00:00:00Z" }
              as: BoardAdmin
              captures: { cyc_id: $.data.id, deadline: $.data.filing_deadline }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T23:59:59Z" }
              as: BoardAdmin
            - call: "POST /cle/reporting-sweeps"
              payload: {}
              as: BoardAdmin
              captures: { sweep_a: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-02T00:00:00Z" }
              as: BoardAdmin
            - call: "POST /cle/reporting-sweeps"
              payload: {}
              as: BoardAdmin
              captures: { sweep_b: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-31T00:00:00Z" }
              as: BoardAdmin
            - call: "POST /cle/reporting-sweeps"
              payload: {}
              as: BoardAdmin
              captures: { sweep_c: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: BoardAdmin
            - call: "POST /cle/reporting-sweeps"
              payload: {}
              as: BoardAdmin
              captures: { sweep_d: $.data.id }
          assert:
            - "ComplianceCycle.${cyc_id}.filing_deadline == 2026-04-02T00:00:00Z (period_end + 91 days)"
            - "Sweep A (deadline minus one second): ReportingSweep.${sweep_a}.cycles_examined == 1, delinquencies_issued == 0, late_fees_assessed_cents == 0; the cycle is still GOOD_STANDING"
            - "Sweep B (exactly the deadline instant): delinquencies_issued == 1, late_fees_assessed_cents == 100000; administrative_status == DELINQUENT with delinquent_since == 2026-04-02T00:00:00Z"
            - "Sweep C (delinquent_since + 59 days): suspensions_issued == 0, delinquencies_issued == 0; administrative_status is still DELINQUENT and Attorney.${att_id}.status is still ACTIVE"
            - "Sweep D (delinquent_since + 60 days exactly): suspensions_issued == 1; administrative_status == ADMIN_SUSPENDED and Attorney.${att_id}.status == ADMIN_SUSPENDED"
            - "Sweep numbering is monotonic: ReportingSweep.${sweep_a}.sweep_number == 1 through ReportingSweep.${sweep_d}.sweep_number == 4"
            - "No sweep ever assesses a second LATE_COMPLIANCE fee: exactly one such FeeAssessment exists for ${cyc_id} after sweep D, plus one REINSTATEMENT fee, so Attorney.${att_id}.outstanding_fee_cents == 150000"
            - "Sweep A and Sweep C each leave ComplianceCycle.${cyc_id}.version unchanged from the sweep before them"

  - rule_id: cross_entity_state_dependency
    instances:

      - name: provider_cannot_leave_probation_until_one_of_its_audits_reaches_cleared
        grounds:
          - state_machines.Provider.PROBATIONARY_to_ACCREDITED
          - state_machines.ProviderAudit.FINDINGS_ISSUED_to_CLEARED
          - validations[priority 58 -> ERR_NO_CLEARED_AUDIT]
          - domain_constants.AUDIT_CLEAR_MAX_FINDINGS
          - errors[ERR_NO_CLEARED_AUDIT]
        distinguishing_aspect: |
          Entity pair Provider <- ProviderAudit: the Provider transition PROBATIONARY -> ACCREDITED is
          legal on the Provider's own state machine and carries a correct expected_provider_version,
          yet it must be refused with ERR_NO_CLEARED_AUDIT until a DIFFERENT entity — some
          ProviderAudit of that provider — reaches CLEARED. The identical request then succeeds with
          no change to the provider row in between. Falsifiable: an implementation that gates on the
          existence of any audit (rather than a CLEARED one) grants full accreditation while the audit
          is still SAMPLED.
        test_recipe:
          setup:
            - "Logical clock left at its 2026-08-01T00:00:00Z default."
            - "One COMMERCIAL provider granted PROBATIONARY accreditation (self_certification_enabled false), so its courses need board review."
            - "One SELF_STUDY course of that provider is taken through the application pathway to APPROVED by reviewer 'reviewer-beta', giving the audit a non-empty sample pool inside 2026-06-01 .. 2026-06-30."
          setup_api_calls:
            - call: "POST /cle/providers"
              payload: { name: "Ironwood Continuing Education LLC", provider_type: "COMMERCIAL" }
              as: BoardAdmin
              captures: { prov_id: $.data.id, prov_v1: $.data.version }
            - call: "POST /cle/providers/${prov_id}/accreditation-actions"
              payload: { action: "GRANT_PROBATIONARY", expected_provider_version: "${prov_v1}" }
              as: BoardAdmin
              captures: { prov_v2: $.data.version }
            - call: "POST /cle/courses"
              payload: { title: "Probationary Sponsor Self-Study", delivery_format: "SELF_STUDY", total_minutes: 180, presented_at: "2026-06-10T09:00:00Z", attendance_verification_method: "AFFIRMATION_ONLY", credit_allocations: [ { category: "GENERAL", minutes: 180 } ], provider_id: "${prov_id}" }
              as: ProviderAdmin
              as_user_id: "${prov_id}"
              captures: { crs_id: $.data.id }
            - call: "POST /cle/courses/${crs_id}/applications"
              payload: {}
              as: ProviderAdmin
              as_user_id: "${prov_id}"
              captures: { app_id: $.data.id }
            - call: "POST /cle/course-applications/${app_id}/review-actions"
              payload: { action: "APPROVE" }
              as: AccreditationReviewer
              as_user_id: "reviewer-beta"
          trigger:
            - call: "POST /cle/providers/${prov_id}/accreditation-actions"
              payload: { action: "GRANT_FULL", expected_provider_version: "${prov_v2}" }
              as: BoardAdmin
              expect_error: ERR_NO_CLEARED_AUDIT
            - call: "POST /cle/provider-audits"
              payload: { provider_id: "${prov_id}", audit_period_start: "2026-06-01T00:00:00Z", audit_period_end: "2026-06-30T00:00:00Z", trigger_type: "RISK_BASED" }
              as: BoardAdmin
              captures: { aud_id: $.data.id, aud_v1: $.data.version }
            - call: "POST /cle/provider-audits/${aud_id}/audit-actions"
              payload: { action: "DRAW_SAMPLE", expected_audit_version: "${aud_v1}" }
              as: BoardAdmin
              captures: { aud_v2: $.data.version }
            - call: "POST /cle/providers/${prov_id}/accreditation-actions"
              payload: { action: "GRANT_FULL", expected_provider_version: "${prov_v2}" }
              as: BoardAdmin
              expect_error: ERR_NO_CLEARED_AUDIT
            - call: "POST /cle/provider-audits/${aud_id}/audit-actions"
              payload: { action: "ISSUE_FINDINGS", findings_count: 1, expected_audit_version: "${aud_v2}" }
              as: BoardAdmin
              captures: { aud_v3: $.data.version }
            - call: "POST /cle/provider-audits/${aud_id}/audit-actions"
              payload: { action: "CLOSE_CLEARED", expected_audit_version: "${aud_v3}" }
              as: BoardAdmin
            - call: "POST /cle/providers/${prov_id}/accreditation-actions"
              payload: { action: "GRANT_FULL", expected_provider_version: "${prov_v2}" }
              as: BoardAdmin
          assert:
            - "First trigger -> HTTP 409 ERR_NO_CLEARED_AUDIT; Provider.${prov_id}.accreditation_status is still PROBATIONARY and version is still ${prov_v2} (a rejected write never bumps the version)"
            - "Second trigger (audit exists but is only SAMPLED) -> HTTP 409 ERR_NO_CLEARED_AUDIT as well"
            - "ProviderAudit.${aud_id}.risk_score_at_open == 0.0, sample_size == 1 and sampled_course_ids == [\"${crs_id}\"] (pool of one, LOW tier target 2, min wins)"
            - "After CLOSE_CLEARED: ProviderAudit.${aud_id}.status == CLEARED, sanction_type == NONE, closed_at == 2026-08-01T00:00:00Z, and Provider.${prov_id}.last_audit_closed_at == 2026-08-01T00:00:00Z"
            - "CLOSE_CLEARED is accepted at exactly findings_count == AUDIT_CLEAR_MAX_FINDINGS (1) and creates NO FeeAssessment with fee_type == AUDIT_SANCTION"
            - "Final trigger (byte-identical to the first, same expected_provider_version) -> HTTP 200: accreditation_status == ACCREDITED, self_certification_enabled == true, risk_score_variant == SELF_CERTIFIED_WEIGHTING"
            - "Provider.${prov_id}.risk_score == 0.25 both before and after the grant (finding_rate is 1/1 under either variant, and every other term is 0)"

      - name: credit_record_verification_depends_on_its_course_being_approved_or_merely_expired
        grounds:
          - state_machines.CreditRecord.PENDING_VERIFICATION_to_VERIFIED
          - state_machines.Course.APPROVED_to_EXPIRED
          - state_machines.Course.APPROVED_to_REVOKED
          - endpoints[POST /cle/credit-records/{id}/adjudication]
          - errors[ERR_INVALID_STATE_TRANSITION]
        distinguishing_aspect: |
          Entity pair CreditRecord <- Course: the board VERIFY action is declared only when the
          record's course is APPROVED or EXPIRED, so two records that are byte-identical in their own
          state (both PENDING_VERIFICATION) diverge purely on their course's state — the one whose
          course merely EXPIRED after a sweep verifies successfully, while the one whose course was
          REVOKED by a substantiated complaint is refused with ERR_INVALID_STATE_TRANSITION.
          Falsifiable: an implementation that only checks the record's own status verifies both.
        test_recipe:
          setup:
            - "Logical clock left at its 2026-08-01T00:00:00Z default."
            - "One ACCREDITED self-certifying provider with two APPROVED courses: CX SELF_STUDY 180 min (AFFIRMATION_ONLY, expires 2029-06-01) and CY LIVE_IN_PERSON 180 min (CERTIFICATE, presented 2026-06-05T09:00:00Z so expires_at == 2026-06-05T12:00:00Z)."
            - "One ACTIVE attorney with cycle 2026-01-01 -> 2028-01-01 (filing_deadline 2028-03-02, so the sweep below issues no delinquency) holding one PENDING_VERIFICATION record on each course."
            - "A sweep then expires CY, and a complaint substantiated by 'board-review-12' against CX revokes CX."
          setup_api_calls:
            - call: "POST /cle/providers"
              payload: { name: "Copper Canyon Bar Institute", provider_type: "BAR_ASSOCIATION" }
              as: BoardAdmin
              captures: { prov_id: $.data.id, prov_v1: $.data.version }
            - call: "POST /cle/providers/${prov_id}/accreditation-actions"
              payload: { action: "GRANT_FULL", expected_provider_version: "${prov_v1}" }
              as: BoardAdmin
            - call: "POST /cle/courses"
              payload: { title: "Self-Study: Fee Splitting", delivery_format: "SELF_STUDY", total_minutes: 180, presented_at: "2026-06-01T09:00:00Z", attendance_verification_method: "AFFIRMATION_ONLY", credit_allocations: [ { category: "ETHICS", minutes: 180 } ], provider_id: "${prov_id}" }
              as: ProviderAdmin
              as_user_id: "${prov_id}"
              captures: { cx: $.data.id }
            - call: "POST /cle/courses"
              payload: { title: "Live Seminar: Discovery Sanctions", delivery_format: "LIVE_IN_PERSON", total_minutes: 180, presented_at: "2026-06-05T09:00:00Z", attendance_verification_method: "CERTIFICATE", credit_allocations: [ { category: "GENERAL", minutes: 180 } ], provider_id: "${prov_id}" }
              as: ProviderAdmin
              as_user_id: "${prov_id}"
              captures: { cy: $.data.id }
            - call: "POST /cle/attorneys"
              payload: { bar_number: "BAR-1212", full_name: "Imelda Rojas", admission_date: "2017-05-01T00:00:00Z", compliance_group: "GROUP_2", principal_office_jurisdiction: "ST" }
              as: BoardAdmin
              captures: { att_id: $.data.id }
            - call: "POST /cle/attorneys/${att_id}/compliance-cycles"
              payload: { period_start: "2026-01-01T00:00:00Z", period_end: "2028-01-01T00:00:00Z" }
              as: BoardAdmin
              captures: { cyc_id: $.data.id }
            - call: "POST /cle/credit-records"
              payload: { attorney_id: "${att_id}", course_id: "${cx}", verification_method: "AFFIRMATION", attended_minutes: 180, completion_date: "2026-06-02T00:00:00Z" }
              as: Attorney
              as_user_id: "${att_id}"
              captures: { r_cx: $.data.id }
            - call: "POST /cle/credit-records"
              payload: { attorney_id: "${att_id}", course_id: "${cy}", verification_method: "CERTIFICATE", attended_minutes: 180, completion_date: "2026-06-05T12:00:00Z", certificate_reference: "CERT-7781" }
              as: Attorney
              as_user_id: "${att_id}"
              captures: { r_cy: $.data.id }
            - call: "POST /cle/reporting-sweeps"
              payload: {}
              as: BoardAdmin
              captures: { sweep_id: $.data.id }
            - call: "POST /cle/complaints"
              payload: { subject_type: "COURSE", subject_id: "${cx}", allegation: "The self-study materials were never delivered to registrants.", allegation_category: "NO_SHOW_FACULTY" }
              as: BoardAdmin
              as_user_id: "board-intake-11"
              captures: { cmp_id: $.data.id }
            - call: "POST /cle/complaints/${cmp_id}/disposition"
              payload: { action: "OPEN_REVIEW" }
              as: BoardAdmin
              as_user_id: "board-review-12"
            - call: "POST /cle/complaints/${cmp_id}/disposition"
              payload: { action: "SUBSTANTIATE", disposition_reason: "Materials confirmed undelivered." }
              as: BoardAdmin
              as_user_id: "board-review-12"
          trigger:
            - call: "POST /cle/credit-records/${r_cy}/adjudication"
              payload: { action: "VERIFY" }
              as: BoardAdmin
            - call: "POST /cle/credit-records/${r_cx}/adjudication"
              payload: { action: "VERIFY" }
              as: BoardAdmin
              expect_error: ERR_INVALID_STATE_TRANSITION
          assert:
            - "After the sweep: Course.${cy}.status == EXPIRED and ReportingSweep.${sweep_id}.courses_expired == 1, delinquencies_issued == 0"
            - "After the substantiation: Course.${cx}.status == REVOKED while CreditRecord.${r_cx}.status is STILL PENDING_VERIFICATION (the revocation cascade only touches VERIFIED records)"
            - "First trigger -> HTTP 200: CreditRecord.${r_cy}.status == VERIFIED with countable_minutes == 180 — an EXPIRED course may still be adjudicated for attendance completed before expiry"
            - "First trigger -> Course.${cy}.verified_credit_record_count == 1 and ComplianceCycle.${cyc_id}.earned_countable_minutes == 360 (PROVISIONAL: the 180 pending ethics minutes on the revoked course still count), earned_live_minutes == 180"
            - "Second trigger -> HTTP 409 ERR_INVALID_STATE_TRANSITION; CreditRecord.${r_cx}.status is unchanged at PENDING_VERIFICATION and void_reason is null"
            - "Second trigger -> ComplianceCycle.${cyc_id}.earned_ethics_minutes is still 180 and the cycle version is unchanged: the refusal to verify changes nothing, and only the FINAL variant (or a REJECT adjudication) removes those minutes"
            - "The two records differ in no field of their own except course_id and verification_method; the divergence is entirely their course's state"

  - rule_id: resource_temporal_overlap
    instances:

      - name: attorney_compliance_periods_are_half_open_so_exact_adjacency_is_legal
        grounds:
          - validations[priority 68 -> ERR_CYCLE_PERIOD_OVERLAP]
          - entities.ComplianceCycle.fields.period_start
          - entities.ComplianceCycle.fields.period_end
          - errors[ERR_CYCLE_PERIOD_OVERLAP]
          - endpoints[POST /cle/attorneys/{id}/compliance-cycles]
        distinguishing_aspect: |
          Resource under contention: ONE ATTORNEY's compliance timeline, with HALF-OPEN
          [period_start, period_end) semantics — a new cycle that starts exactly when an existing one
          ends is legal, one that ends exactly when an existing one starts is legal, and a one-second
          intrusion is rejected. Falsifiable: closed-interval comparison rejects both adjacent cycles;
          a comparison that only checks containment of the endpoints accepts the straddling cycle.
        test_recipe:
          setup:
            - "Logical clock left at its 2026-08-01T00:00:00Z default."
            - "One ACTIVE attorney with a single existing cycle 2024-01-01 -> 2026-01-01."
          setup_api_calls:
            - call: "POST /cle/attorneys"
              payload: { bar_number: "BAR-1313", full_name: "Beatrix Nyongo", admission_date: "2008-01-01T00:00:00Z", compliance_group: "GROUP_1", principal_office_jurisdiction: "ST" }
              as: BoardAdmin
              captures: { att_id: $.data.id }
            - call: "POST /cle/attorneys/${att_id}/compliance-cycles"
              payload: { period_start: "2024-01-01T00:00:00Z", period_end: "2026-01-01T00:00:00Z" }
              as: BoardAdmin
              captures: { cyc_mid: $.data.id }
          trigger:
            - call: "POST /cle/attorneys/${att_id}/compliance-cycles"
              payload: { period_start: "2026-01-01T00:00:00Z", period_end: "2028-01-01T00:00:00Z", previous_cycle_id: "${cyc_mid}" }
              as: BoardAdmin
              captures: { cyc_next: $.data.id }
            - call: "POST /cle/attorneys/${att_id}/compliance-cycles"
              payload: { period_start: "2022-01-01T00:00:00Z", period_end: "2024-01-01T00:00:00Z" }
              as: BoardAdmin
              captures: { cyc_prev: $.data.id }
            - call: "POST /cle/attorneys/${att_id}/compliance-cycles"
              payload: { period_start: "2025-06-01T00:00:00Z", period_end: "2027-06-01T00:00:00Z" }
              as: BoardAdmin
              expect_error: ERR_CYCLE_PERIOD_OVERLAP
            - call: "POST /cle/attorneys/${att_id}/compliance-cycles"
              payload: { period_start: "2027-12-31T23:59:59Z", period_end: "2029-12-31T23:59:59Z" }
              as: BoardAdmin
              expect_error: ERR_CYCLE_PERIOD_OVERLAP
          assert:
            - "Trigger 1 -> HTTP 201: period_start == the predecessor's period_end is accepted under half-open semantics, and ComplianceCycle.${cyc_next}.carryover_in_general_minutes == 0 (the predecessor never certified)"
            - "Trigger 2 -> HTTP 201: period_end == an existing cycle's period_start is equally accepted"
            - "Trigger 3 -> HTTP 409 ERR_CYCLE_PERIOD_OVERLAP (a cycle straddling ${cyc_mid} and ${cyc_next} intersects both)"
            - "Trigger 4 -> HTTP 409 ERR_CYCLE_PERIOD_OVERLAP (one second of intrusion into ${cyc_next} is still an overlap)"
            - "Exactly three ComplianceCycle rows exist for ${att_id} after all four triggers: GET /cle/compliance-cycles?attorney_id=${att_id} returns total_count == 3"
            - "ComplianceCycle.${cyc_prev}.filing_deadline == 2024-02-01T00:00:00Z and ComplianceCycle.${cyc_next}.filing_deadline == 2028-02-01T00:00:00Z (GROUP_1 offset of 31 days)"

      - name: provider_audit_windows_are_closed_so_abutting_periods_collide_and_one_engagement_is_the_limit
        grounds:
          - validations[priority 68 -> ERR_AUDIT_PERIOD_OVERLAP]
          - validations[priority 68 -> ERR_AUDIT_ENGAGEMENT_ACTIVE]
          - entities.ProviderAudit.fields.audit_period_start
          - errors[ERR_AUDIT_PERIOD_OVERLAP]
          - errors[ERR_AUDIT_ENGAGEMENT_ACTIVE]
          - endpoints[POST /cle/provider-audits]
        distinguishing_aspect: |
          A different resource (ONE PROVIDER's audit calendar) under the OPPOSITE interval convention:
          audit windows are CLOSED [start, end], so a new window that merely abuts a prior audit's end
          instant collides — the exact adjacency that is legal for compliance cycles is illegal here.
          A second, independent guard then limits the provider to one non-terminal engagement at a
          time, which fires even for a perfectly disjoint window. Falsifiable: reusing the cycles'
          half-open comparison accepts the abutting audit; omitting the engagement guard accepts the
          disjoint third audit.
        test_recipe:
          setup:
            - "Logical clock left at its 2026-08-01T00:00:00Z default."
            - "One ACCREDITED self-certifying provider with one APPROVED SELF_STUDY course presented 2026-02-01 so the first audit has a non-empty sample pool."
            - "Audit 1 covers the closed window 2026-01-01 .. 2026-03-31 and is taken all the way to CLEARED, so it is terminal and no longer occupies the engagement slot."
          setup_api_calls:
            - call: "POST /cle/providers"
              payload: { name: "Granite Ridge CLE Foundation", provider_type: "BAR_ASSOCIATION" }
              as: BoardAdmin
              captures: { prov_id: $.data.id, prov_v1: $.data.version }
            - call: "POST /cle/providers/${prov_id}/accreditation-actions"
              payload: { action: "GRANT_FULL", expected_provider_version: "${prov_v1}" }
              as: BoardAdmin
            - call: "POST /cle/courses"
              payload: { title: "Winter Self-Study Module", delivery_format: "SELF_STUDY", total_minutes: 120, presented_at: "2026-02-01T09:00:00Z", attendance_verification_method: "AFFIRMATION_ONLY", credit_allocations: [ { category: "GENERAL", minutes: 120 } ], provider_id: "${prov_id}" }
              as: ProviderAdmin
              as_user_id: "${prov_id}"
              captures: { crs_id: $.data.id }
            - call: "POST /cle/provider-audits"
              payload: { provider_id: "${prov_id}", audit_period_start: "2026-01-01T00:00:00Z", audit_period_end: "2026-03-31T00:00:00Z", trigger_type: "RANDOM" }
              as: BoardAdmin
              captures: { aud1: $.data.id, aud1_v1: $.data.version }
            - call: "POST /cle/provider-audits/${aud1}/audit-actions"
              payload: { action: "DRAW_SAMPLE", expected_audit_version: "${aud1_v1}" }
              as: BoardAdmin
              captures: { aud1_v2: $.data.version }
            - call: "POST /cle/provider-audits/${aud1}/audit-actions"
              payload: { action: "ISSUE_FINDINGS", findings_count: 0, expected_audit_version: "${aud1_v2}" }
              as: BoardAdmin
              captures: { aud1_v3: $.data.version }
            - call: "POST /cle/provider-audits/${aud1}/audit-actions"
              payload: { action: "CLOSE_CLEARED", expected_audit_version: "${aud1_v3}" }
              as: BoardAdmin
          trigger:
            - call: "POST /cle/provider-audits"
              payload: { provider_id: "${prov_id}", audit_period_start: "2026-03-31T00:00:00Z", audit_period_end: "2026-06-30T00:00:00Z", trigger_type: "RISK_BASED" }
              as: BoardAdmin
              expect_error: ERR_AUDIT_PERIOD_OVERLAP
            - call: "POST /cle/provider-audits"
              payload: { provider_id: "${prov_id}", audit_period_start: "2026-04-01T00:00:00Z", audit_period_end: "2026-06-30T00:00:00Z", trigger_type: "RISK_BASED" }
              as: BoardAdmin
              captures: { aud2: $.data.id }
            - call: "POST /cle/provider-audits"
              payload: { provider_id: "${prov_id}", audit_period_start: "2026-07-01T00:00:00Z", audit_period_end: "2026-07-31T00:00:00Z", trigger_type: "RANDOM" }
              as: BoardAdmin
              expect_error: ERR_AUDIT_ENGAGEMENT_ACTIVE
          assert:
            - "ProviderAudit.${aud1}.status == CLEARED before any trigger runs, so the engagement slot is free"
            - "Trigger 1 -> HTTP 409 ERR_AUDIT_PERIOD_OVERLAP: audit_period_start == the prior audit's audit_period_end is a collision under closed-interval semantics"
            - "Trigger 2 -> HTTP 201: shifting the start one day past the prior end is accepted, and ProviderAudit.${aud2}.status == OPENED with risk_score_at_open == 0.0"
            - "Trigger 3 -> HTTP 409 ERR_AUDIT_ENGAGEMENT_ACTIVE even though 2026-07-01 .. 2026-07-31 overlaps nothing: the OPENED ${aud2} occupies the only engagement slot"
            - "Trigger 3 -> the error is NOT ERR_AUDIT_PERIOD_OVERLAP, and GET /cle/provider-audits?provider_id=${prov_id} returns total_count == 2"
            - "ProviderAudit.${aud2}.sample_size == 0 and sampled_course_ids == [] (creation never draws a sample)"

      - name: concurrent_live_session_capacity_is_an_aggregate_closed_interval_count_not_a_pairwise_check
        grounds:
          - validations[priority 68 -> ERR_SESSION_WINDOW_CONFLICT]
          - domain_constants.PROVIDER_CONCURRENT_LIVE_CAPACITY
          - entities.Course.fields.expires_at
          - errors[ERR_SESSION_WINDOW_CONFLICT]
          - endpoints[POST /cle/courses]
        distinguishing_aspect: |
          A third interval semantics on a third resource: the provider's LIVE_IN_PERSON teaching
          capacity is an AGGREGATE count of mutually overlapping closed [presented_at, expires_at]
          session windows, not a pairwise conflict — two overlapping sessions are fine and only the
          third is refused. Because the interval is closed, a session that begins at the exact instant
          another ends still counts as concurrent. Falsifiable: a pairwise implementation rejects the
          second course; a half-open implementation accepts the touching fourth course.
        test_recipe:
          setup:
            - "Logical clock left at its 2026-08-01T00:00:00Z default."
            - "One ACCREDITED self-certifying provider, so every accepted LIVE_IN_PERSON course is APPROVED immediately and its window is [presented_at, presented_at + total_minutes]."
            - "LA occupies 2026-05-01 09:00 .. 13:00 and LB occupies 2026-05-01 12:00 .. 16:00 — two concurrent sessions, exactly at PROVIDER_CONCURRENT_LIVE_CAPACITY."
          setup_api_calls:
            - call: "POST /cle/providers"
              payload: { name: "Bayfront Trial College", provider_type: "LAW_SCHOOL" }
              as: BoardAdmin
              captures: { prov_id: $.data.id, prov_v1: $.data.version }
            - call: "POST /cle/providers/${prov_id}/accreditation-actions"
              payload: { action: "GRANT_FULL", expected_provider_version: "${prov_v1}" }
              as: BoardAdmin
            - call: "POST /cle/courses"
              payload: { title: "Morning Trial Lab A", delivery_format: "LIVE_IN_PERSON", total_minutes: 240, presented_at: "2026-05-01T09:00:00Z", attendance_verification_method: "ROSTER", credit_allocations: [ { category: "GENERAL", minutes: 240 } ], provider_id: "${prov_id}" }
              as: ProviderAdmin
              as_user_id: "${prov_id}"
              captures: { la: $.data.id }
            - call: "POST /cle/courses"
              payload: { title: "Midday Trial Lab B", delivery_format: "LIVE_IN_PERSON", total_minutes: 240, presented_at: "2026-05-01T12:00:00Z", attendance_verification_method: "ROSTER", credit_allocations: [ { category: "GENERAL", minutes: 240 } ], provider_id: "${prov_id}" }
              as: ProviderAdmin
              as_user_id: "${prov_id}"
              captures: { lb: $.data.id }
          trigger:
            - call: "POST /cle/courses"
              payload: { title: "Overlapping Trial Lab C", delivery_format: "LIVE_IN_PERSON", total_minutes: 60, presented_at: "2026-05-01T12:30:00Z", attendance_verification_method: "ROSTER", credit_allocations: [ { category: "GENERAL", minutes: 60 } ], provider_id: "${prov_id}" }
              as: ProviderAdmin
              as_user_id: "${prov_id}"
              expect_error: ERR_SESSION_WINDOW_CONFLICT
            - call: "POST /cle/courses"
              payload: { title: "Touching Trial Lab E", delivery_format: "LIVE_IN_PERSON", total_minutes: 60, presented_at: "2026-05-01T13:00:00Z", attendance_verification_method: "ROSTER", credit_allocations: [ { category: "GENERAL", minutes: 60 } ], provider_id: "${prov_id}" }
              as: ProviderAdmin
              as_user_id: "${prov_id}"
              expect_error: ERR_SESSION_WINDOW_CONFLICT
            - call: "POST /cle/courses"
              payload: { title: "Next-Day Trial Lab F", delivery_format: "LIVE_IN_PERSON", total_minutes: 60, presented_at: "2026-05-02T09:00:00Z", attendance_verification_method: "ROSTER", credit_allocations: [ { category: "GENERAL", minutes: 60 } ], provider_id: "${prov_id}" }
              as: ProviderAdmin
              as_user_id: "${prov_id}"
              captures: { lf: $.data.id }
            - call: "POST /cle/courses"
              payload: { title: "Overlapping On-Demand Module", delivery_format: "ON_DEMAND", total_minutes: 60, presented_at: "2026-05-01T12:30:00Z", attendance_verification_method: "AFFIRMATION_ONLY", credit_allocations: [ { category: "GENERAL", minutes: 60 } ], provider_id: "${prov_id}" }
              as: ProviderAdmin
              as_user_id: "${prov_id}"
              captures: { od: $.data.id }
          assert:
            - "Setup: Course.${la}.expires_at == 2026-05-01T13:00:00Z and Course.${lb}.expires_at == 2026-05-01T16:00:00Z, both APPROVED — two concurrent sessions are accepted"
            - "Trigger 1 -> HTTP 409 ERR_SESSION_WINDOW_CONFLICT: [12:30, 13:30] overlaps both LA and LB, which would make three concurrent sessions"
            - "Trigger 2 -> HTTP 409 ERR_SESSION_WINDOW_CONFLICT: [13:00, 14:00] merely TOUCHES LA's end instant but still counts as concurrent under closed-interval semantics, so the aggregate is again three"
            - "Trigger 3 -> HTTP 201: a next-day session overlaps nothing and Course.${lf}.status == APPROVED"
            - "Trigger 4 -> HTTP 201: the capacity rule counts only LIVE_IN_PERSON courses, so an ON_DEMAND course inside the very same window is accepted and Course.${od}.status == APPROVED"
            - "Provider.${prov_id}.courses_total_count == 4 and courses_self_certified_count == 4 (the two rejected creates left no row)"

  - rule_id: compensating_invariant
    instances:

      - name: outstanding_fee_cents_always_equals_the_sum_of_assessed_assessments
        grounds:
          - entities.Attorney.fields.outstanding_fee_cents
          - entities.FeeAssessment.fields.amount_cents
          - entities.FeeAssessment.fields.status
          - endpoints[POST /cle/fee-assessments/{id}/settlement]
          - errors[ERR_FEE_ALREADY_SETTLED]
          - calculations.late_fee_assessment
        distinguishing_aspect: |
          Conserved quantity: MONEY IN CENTS. The invariant
          attorney.outstanding_fee_cents == SUM(amount_cents of that attorney's FeeAssessment rows in
          status ASSESSED) must hold after every mutation, and both settle paths (PAY and WAIVE)
          decrement it by exactly the assessment's amount — never partially, never twice. A rejected
          second settlement must leave the balance untouched, so no compensating drift accumulates.
          Falsifiable: an implementation that decrements only on PAY leaves 100000 stranded after the
          waiver; one that omits the already-settled guard drives the balance negative.
        test_recipe:
          setup:
            - "One ACTIVE attorney admitted 2009-09-01, compliance GROUP_1, with cycle 2024-01-01 -> 2026-01-01 and no credit records, so the FINAL deficiency is 1800 minutes."
            - "The first sweep runs at the 2026-08-01 default clock (past the 2026-02-01 filing deadline); the clock is then advanced to 2026-09-30 for the second sweep."
          setup_api_calls:
            - call: "POST /cle/attorneys"
              payload: { bar_number: "BAR-1414", full_name: "Simone Delacroix", admission_date: "2009-09-01T00:00:00Z", compliance_group: "GROUP_1", principal_office_jurisdiction: "ST" }
              as: BoardAdmin
              captures: { att_id: $.data.id }
            - call: "POST /cle/attorneys/${att_id}/compliance-cycles"
              payload: { period_start: "2024-01-01T00:00:00Z", period_end: "2026-01-01T00:00:00Z" }
              as: BoardAdmin
              captures: { cyc_id: $.data.id }
          trigger:
            - call: "POST /cle/reporting-sweeps"
              payload: {}
              as: BoardAdmin
            - call: "GET /cle/fee-assessments?attorney_id=${att_id}&status=ASSESSED"
              as: BoardAdmin
              captures: { fee_late: "$.data.items[0].id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-30T00:00:00Z" }
              as: BoardAdmin
            - call: "POST /cle/reporting-sweeps"
              payload: {}
              as: BoardAdmin
            - call: "GET /cle/fee-assessments?attorney_id=${att_id}&fee_type=REINSTATEMENT"
              as: BoardAdmin
              captures: { fee_reinstate: "$.data.items[0].id" }
            - call: "POST /cle/fee-assessments/${fee_late}/settlement"
              payload: { action: "WAIVE", waiver_reason: "Board waived the late fee on hardship grounds." }
              as: BoardAdmin
            - call: "POST /cle/fee-assessments/${fee_reinstate}/settlement"
              payload: { action: "PAY" }
              as: Attorney
              as_user_id: "${att_id}"
            - call: "POST /cle/fee-assessments/${fee_late}/settlement"
              payload: { action: "PAY" }
              as: Attorney
              as_user_id: "${att_id}"
              expect_error: ERR_FEE_ALREADY_SETTLED
          assert:
            - "Checkpoint 1 (after sweep 1): FeeAssessment.${fee_late}.amount_cents == 100000 with status ASSESSED, and Attorney.${att_id}.outstanding_fee_cents == 100000 == the ASSESSED sum"
            - "Checkpoint 2 (after sweep 2): FeeAssessment.${fee_reinstate}.amount_cents == 50000, and outstanding_fee_cents == 150000 == 100000 + 50000"
            - "Checkpoint 3 (after the WAIVE): FeeAssessment.${fee_late}.status == WAIVED with settled_at == 2026-09-30T00:00:00Z and waiver_reason recorded; outstanding_fee_cents == 50000 — a waiver relieves the balance exactly like a payment"
            - "Checkpoint 4 (after the PAY): FeeAssessment.${fee_reinstate}.status == PAID and outstanding_fee_cents == 0 == the now-empty ASSESSED sum"
            - "Checkpoint 5 (rejected re-settlement): HTTP 409 ERR_FEE_ALREADY_SETTLED, FeeAssessment.${fee_late}.status is still WAIVED, and outstanding_fee_cents is still 0 — never -100000"
            - "No assessment amount is ever mutated by a settlement: both amount_cents values are unchanged at every checkpoint"
            - "GET /cle/fee-assessments?attorney_id=${att_id} returns total_count == 2 throughout (settlement never creates or deletes rows)"

      - name: carryover_out_and_successor_carryover_in_stay_equal_through_two_compensating_voids
        grounds:
          - calculations.carryover_determination
          - entities.ComplianceCycle.fields.carryover_out_general_minutes
          - entities.ComplianceCycle.fields.carryover_in_general_minutes
          - state_machines.CreditRecord.VERIFIED_to_VOIDED
          - state_machines.ComplianceCycle.SATISFIED_to_OPEN
          - domain_constants.CARRYOVER_CAP_GENERAL_MINUTES
          - domain_constants.CARRYOVER_CAP_ETHICS_MINUTES
        distinguishing_aspect: |
          A different conserved quantity: TRANSFERRED MINUTES across a cycle boundary. The invariant
          successor.carryover_in_general_minutes == predecessor.carryover_out_general_minutes (and the
          same for ethics) must hold after EVERY mutation, including a void that shrinks the excess
          without breaking satisfaction — a compensating adjustment 600 -> 300, not a reset — and only
          collapses to 0 when the second void actually reverts the predecessor to OPEN.
          Falsifiable: an implementation that only zeroes the transfer on reversion leaves the
          successor holding 600 minutes after the first void, over-crediting the next period by 300.
        test_recipe:
          setup:
            - "Logical clock left at its 2026-08-01T00:00:00Z default."
            - "One ACCREDITED self-certifying provider with three APPROVED LIVE_IN_PERSON courses on separate days (so the concurrent-session capacity is never tested), all verified by ATTENDANCE_CODE: K1 1200 min (ETHICS 300 / TECHNOLOGY 60 / BIAS_ELIMINATION 120 / GENERAL 720), K2 900 min GENERAL, K3 300 min GENERAL."
            - "One ACTIVE attorney admitted 2008-05-01, compliance GROUP_1, with cycle 1 = 2024-01-01 -> 2026-01-01 (1800 / 180 / 60 / 120) holding all three records, certified SATISFIED with carryover_election CARRY_FORWARD."
            - "Cycle 2 = 2026-01-01 -> 2028-01-01 is created afterwards with previous_cycle_id = cycle 1."
          setup_api_calls:
            - call: "POST /cle/providers"
              payload: { name: "Kestrel Advocacy Academy", provider_type: "LAW_SCHOOL" }
              as: BoardAdmin
              captures: { prov_id: $.data.id, prov_v1: $.data.version }
            - call: "POST /cle/providers/${prov_id}/accreditation-actions"
              payload: { action: "GRANT_FULL", expected_provider_version: "${prov_v1}" }
              as: BoardAdmin
            - call: "POST /cle/courses"
              payload: { title: "Ethics and Bias Intensive", delivery_format: "LIVE_IN_PERSON", total_minutes: 1200, presented_at: "2024-02-01T09:00:00Z", attendance_verification_method: "ATTENDANCE_CODE", credit_allocations: [ { category: "ETHICS", minutes: 300 }, { category: "TECHNOLOGY", minutes: 60 }, { category: "BIAS_ELIMINATION", minutes: 120 }, { category: "GENERAL", minutes: 720 } ], provider_id: "${prov_id}" }
              as: ProviderAdmin
              as_user_id: "${prov_id}"
              captures: { k1: $.data.id, k1_code: $.data.attendance_code }
            - call: "POST /cle/courses"
              payload: { title: "Advanced Motion Practice", delivery_format: "LIVE_IN_PERSON", total_minutes: 900, presented_at: "2024-04-01T09:00:00Z", attendance_verification_method: "ATTENDANCE_CODE", credit_allocations: [ { category: "GENERAL", minutes: 900 } ], provider_id: "${prov_id}" }
              as: ProviderAdmin
              as_user_id: "${prov_id}"
              captures: { k2: $.data.id, k2_code: $.data.attendance_code }
            - call: "POST /cle/courses"
              payload: { title: "Closing Argument Clinic", delivery_format: "LIVE_IN_PERSON", total_minutes: 300, presented_at: "2024-06-01T09:00:00Z", attendance_verification_method: "ATTENDANCE_CODE", credit_allocations: [ { category: "GENERAL", minutes: 300 } ], provider_id: "${prov_id}" }
              as: ProviderAdmin
              as_user_id: "${prov_id}"
              captures: { k3: $.data.id, k3_code: $.data.attendance_code }
            - call: "POST /cle/attorneys"
              payload: { bar_number: "BAR-1515", full_name: "Osei Mensah", admission_date: "2008-05-01T00:00:00Z", compliance_group: "GROUP_1", principal_office_jurisdiction: "ST" }
              as: BoardAdmin
              captures: { att_id: $.data.id }
            - call: "POST /cle/attorneys/${att_id}/compliance-cycles"
              payload: { period_start: "2024-01-01T00:00:00Z", period_end: "2026-01-01T00:00:00Z", carryover_election: "CARRY_FORWARD" }
              as: BoardAdmin
              captures: { cyc1: $.data.id }
            - call: "POST /cle/credit-records"
              payload: { attorney_id: "${att_id}", course_id: "${k1}", verification_method: "ATTENDANCE_CODE", attended_minutes: 1200, completion_date: "2024-02-02T05:00:00Z", attendance_code: "${k1_code}" }
              as: Attorney
              as_user_id: "${att_id}"
              captures: { rk1: $.data.id }
            - call: "POST /cle/credit-records"
              payload: { attorney_id: "${att_id}", course_id: "${k2}", verification_method: "ATTENDANCE_CODE", attended_minutes: 900, completion_date: "2024-04-02T00:00:00Z", attendance_code: "${k2_code}" }
              as: Attorney
              as_user_id: "${att_id}"
              captures: { rk2: $.data.id }
            - call: "POST /cle/credit-records"
              payload: { attorney_id: "${att_id}", course_id: "${k3}", verification_method: "ATTENDANCE_CODE", attended_minutes: 300, completion_date: "2024-06-01T14:00:00Z", attendance_code: "${k3_code}" }
              as: Attorney
              as_user_id: "${att_id}"
              captures: { rk3: $.data.id }
            - call: "POST /cle/compliance-cycles/${cyc1}/affirmations"
              payload: { affirmation_type: "FINAL_COMPLIANCE_AFFIRMATION", statement: "I affirm the credits reported for the 2024-2025 compliance period." }
              as: Attorney
              as_user_id: "${att_id}"
            - call: "POST /cle/compliance-cycles/${cyc1}/certification"
              payload: { carryover_election: "CARRY_FORWARD" }
              as: Attorney
              as_user_id: "${att_id}"
            - call: "POST /cle/attorneys/${att_id}/compliance-cycles"
              payload: { period_start: "2026-01-01T00:00:00Z", period_end: "2028-01-01T00:00:00Z", previous_cycle_id: "${cyc1}", carryover_election: "CARRY_FORWARD" }
              as: BoardAdmin
              captures: { cyc2: $.data.id }
          trigger:
            - call: "POST /cle/credit-records/${rk3}/adjudication"
              payload: { action: "VOID", void_reason: "Duplicate certificate discovered in the clinic roster." }
              as: BoardAdmin
            - call: "GET /cle/compliance-cycles/${cyc2}/summary"
              as: BoardAdmin
            - call: "POST /cle/credit-records/${rk2}/adjudication"
              payload: { action: "VOID", void_reason: "Faculty never appeared; credit withdrawn." }
              as: BoardAdmin
            - call: "GET /cle/compliance-cycles/${cyc2}/summary"
              as: BoardAdmin
          assert:
            - "Checkpoint 0 (after certification): ComplianceCycle.${cyc1}.credit_status == SATISFIED, earned_countable_minutes == 2400, earned_ethics_minutes == 300, earned_live_minutes == 2400, carryover_out_general_minutes == 600 (exactly CARRYOVER_CAP_GENERAL_MINUTES) and carryover_out_ethics_minutes == 120 (exactly CARRYOVER_CAP_ETHICS_MINUTES)"
            - "Checkpoint 0: ComplianceCycle.${cyc2}.carryover_in_general_minutes == 600 and carryover_in_ethics_minutes == 120 — the invariant holds at creation"
            - "Checkpoint 0: cycle 2's summary reports projected_final_deficiency_total_minutes == 1080 (1800 - 600 - 120)"
            - "Checkpoint 1 (after voiding the 300-minute record): ComplianceCycle.${cyc1}.credit_status is STILL SATISFIED, earned_countable_minutes == 2100, carryover_out_general_minutes == 300 (a compensating adjustment, not a reset), carryover_out_ethics_minutes == 120"
            - "Checkpoint 1: ComplianceCycle.${cyc2}.carryover_in_general_minutes == 300 and carryover_in_ethics_minutes == 120 — the invariant still holds, and the summary now reports projected_final_deficiency_total_minutes == 1380"
            - "Checkpoint 1: CreditRecord.${rk3}.status == VOIDED with countable_minutes == 0, and Attorney.${att_id}.pending_recertification_count is still 0"
            - "Checkpoint 2 (after voiding the 900-minute record): ComplianceCycle.${cyc1}.credit_status == OPEN, certified_at == null, earned_countable_minutes == 1200, carryover_out_general_minutes == 0 and carryover_out_ethics_minutes == 0"
            - "Checkpoint 2: ComplianceCycle.${cyc2}.carryover_in_general_minutes == 0 and carryover_in_ethics_minutes == 0, and the summary reports projected_final_deficiency_total_minutes == 1800"
            - "Checkpoint 2: Attorney.${att_id}.pending_recertification_count == 1"
            - "At every checkpoint: ComplianceCycle.${cyc2}.carryover_in_general_minutes == ComplianceCycle.${cyc1}.carryover_out_general_minutes and the ethics pair is equal too"
            - "At every checkpoint: ComplianceCycle.${cyc1}.earned_countable_minutes equals the sum of countable_minutes over its non-terminal records (2400, then 2100, then 1200)"
