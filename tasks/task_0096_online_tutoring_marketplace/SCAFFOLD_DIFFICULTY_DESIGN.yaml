              payload: {}
              as: TrustOfficer
            - call: "POST /subject-tags"
              payload: { tutor_id: "${tutor_id}", subject_id: "${subj_id}" }
              as: Tutor
              as_user_id: "${tutor_id}"
              captures: { tag_id: $.data.id }
          trigger:
            - call: "POST /subject-tags/${tag_id}/approve"
              payload: {}
              as: TrustOfficer
              captures: { err_before: $.data.error_id }
            - call: "POST /credentials/${cred_id}/verify"
              payload: {}
              as: TrustOfficer
            - call: "POST /subject-tags/${tag_id}/approve"
              payload: {}
              as: TrustOfficer
              captures: { status_after: $.data.status }
          assert:
            - "first approve returns error_id == ERR_SUBJECT_REQUIRES_CREDENTIAL (credential UNDER_REVIEW, not VERIFIED)"
            - "after verify, second approve succeeds and TutorSubjectTag ${tag_id}.status == APPROVED"

