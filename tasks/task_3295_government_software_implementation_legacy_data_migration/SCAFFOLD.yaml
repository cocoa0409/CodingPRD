  input:
  - starts_on
  - ends_on
  - reason
  output: UnavailabilityWindow
  side_effects: []
- method: GET
  path: /programs/staff/{id}/unavailability-windows
  description: List unavailability windows
  roles:
  - AgencyProjectManager
  - ImplementationManager
  code: 200
  input:
  - limit?
  - offset?
