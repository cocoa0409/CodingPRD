          difficulty_instance: resource_temporal_overlap / room_change_windows_are_half_open_with_a_thirty_minute_buffer
          rationale: "The half-open geometry, the 30-minute buffer on both ends and the capacity-2 aggregate are asserted by the named §1.8 instance."

      - name: rack_unit_intervals_may_not_share_a_single_unit
        claim_type: aggregate_validation
        grounds: ["validations[priority=165]", "errors[ERR_RACK_RU_CONFLICT]"]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / rack_unit_intervals_are_closed_with_unit_capacity_one
          rationale: "Closed integer intervals, capacity 1 and the touching-endpoint case are asserted by the named §1.8 instance."

      - name: permanent_link_length_limit_is_enforced_at_the_pull
