            - "Claim.${clm_short}.underreporting_factor_bp == 8999"
            - "Claim.${clm_full}.repair_basis_settlement_cents == 3900000"
            - "Claim.${clm_short}.repair_basis_settlement_cents == 3499600"
            - "GET /inland-marine/claims/${clm_full}/settlement-worksheet returns claim_limit_cents == 20000000 and underreporting_factor_bp == 10000"
            - "after trigger[0]: Claim.${clm_full}.settlement_amount_cents == 3900000"
            - "after trigger[1]: Claim.${clm_short}.settlement_amount_cents == 3499600"
            - "the settlements differ by 400400 although the two reported values differ by 1000"
            - "CoveragePart.${cp1}.earned_reported_premium_cents == 19110 and CoveragePart.${cp2}.earned_reported_premium_cents == 19107"

      - name: catastrophe_tier_boundary_at_pre_surcharge_base_65000
        grounds:
          - calculations.transit_coverage_premium
          - calculations.policy_written_premium
          - entities.CoveragePart.fields.catastrophe_limit_cents
        distinguishing_aspect: |
          The catastrophe tier cutoff is INCLUSIVE on the lower side at a
          pre-surcharge base of exactly 65000: an owned limit of 9999000 rounds to
          a base of 64994 and stays in CAT_TIER_1 for 264994, while 10000000
          bases at exactly 65000 and enters CAT_TIER_2 for 515000 - 1000 cents of
          limit moving the premium by 250006 because the tier reads the rounded
          base, not the raw product.
        test_recipe:
          setup:
            - "One DRAFT Policy, T2_URBAN, 2026-08-01 to 2027-08-01, minimum_premium_cents 100000, no equipment."
            - "TRANSIT CoveragePart BELOW: ACV, transit_owned_limit_cents 9999000, transit_hired_limit_cents 0, catastrophe_limit_cents 5000000, aggregate_limit_cents 200000000."
            - "TRANSIT CoveragePart AT: ACV, transit_owned_limit_cents 10000000, transit_hired_limit_cents 0, catastrophe_limit_cents 5000000, aggregate_limit_cents 200000000."
            - "Logical clock untouched at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /inland-marine/policies"
              payload: { policyholder_name: "Tier Edge Haulage", territory_code: "T2_URBAN", effective_date: "2026-08-01", expiration_date: "2027-08-01", minimum_premium_cents: 100000 }
              as: Underwriter
              captures: { pol: $.data.id }
            - call: "POST /inland-marine/policies/${pol}/coverage-parts"
              payload: { part_type: "TRANSIT", valuation_basis: "ACV", aggregate_limit_cents: 200000000, transit_owned_limit_cents: 9999000, transit_hired_limit_cents: 0, catastrophe_limit_cents: 5000000 }
              as: Underwriter
              captures: { cp_below: $.data.id }
            - call: "POST /inland-marine/policies/${pol}/coverage-parts"
              payload: { part_type: "TRANSIT", valuation_basis: "ACV", aggregate_limit_cents: 200000000, transit_owned_limit_cents: 10000000, transit_hired_limit_cents: 0, catastrophe_limit_cents: 5000000 }
              as: Underwriter
              captures: { cp_at: $.data.id }
          trigger:
            - call: "POST /inland-marine/policies/${pol}/quote"
              payload: {}
              as: Underwriter
            - call: "GET /inland-marine/policies/${pol}/premium-summary"
              payload: {}
              as: Underwriter
          assert:
            - "CoveragePart.${cp_below}.rated_premium_cents == 264994"
            - "CoveragePart.${cp_at}.rated_premium_cents == 515000"
            - "CoveragePart.${cp_at}.rated_premium_cents - CoveragePart.${cp_below}.rated_premium_cents == 250006"
            - "Policy.${pol}.sum_of_part_premiums_cents == 779994"
            - "Policy.${pol}.written_premium_cents == 811194"
            - "trigger[1] response: written_premium_cents == 811194"
            - "trigger[1] response: minimum_premium_applied == false"

      - name: minimum_premium_floor_at_zero_and_no_ratable_coverage_boundary
        grounds:
          - calculations.policy_written_premium
          - calculations.coverage_part_equipment_premium
          - validations[priority=66]
          - errors[ERR_NO_RATABLE_COVERAGE]
          - entities.Policy.fields.minimum_premium_cents
        distinguishing_aspect: |
          The zero-cardinality edge splits in two: a policy with one ACTIVE part
          and ZERO equipment items quotes successfully with
          sum_of_part_premiums_cents 0 and written_premium_cents pinned to the
          250000 minimum floor, while a policy with ZERO ACTIVE parts is not
          ratable at all and returns ERR_NO_RATABLE_COVERAGE 422 - an empty
          aggregation and an empty candidate set are different edges.
        test_recipe:
          setup:
            - "Policy EMPTY_SCHEDULE: DRAFT, T2_URBAN, 2026-08-01 to 2027-08-01, minimum_premium_cents 250000, with exactly one ACTIVE SCHEDULED_EQUIPMENT CoveragePart (ACV, SCHEDULED, deductible 100000, per_item_limit 20000000, aggregate_limit 200000000) and no equipment items at all."
            - "Policy NO_PARTS: DRAFT, T2_URBAN, 2026-08-01 to 2027-08-01, minimum_premium_cents 100000, with no coverage parts at all."
            - "Logical clock untouched at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /inland-marine/policies"
              payload: { policyholder_name: "Empty Schedule Co", territory_code: "T2_URBAN", effective_date: "2026-08-01", expiration_date: "2027-08-01", minimum_premium_cents: 250000 }
              as: Underwriter
              captures: { pol_empty: $.data.id }
            - call: "POST /inland-marine/policies/${pol_empty}/coverage-parts"
              payload: { part_type: "SCHEDULED_EQUIPMENT", valuation_basis: "ACV", rating_basis: "SCHEDULED", deductible_cents: 100000, per_item_limit_cents: 20000000, aggregate_limit_cents: 200000000 }
              as: Underwriter
              captures: { cp_empty: $.data.id }
            - call: "POST /inland-marine/policies"
              payload: { policyholder_name: "No Parts Co", territory_code: "T2_URBAN", effective_date: "2026-08-01", expiration_date: "2027-08-01", minimum_premium_cents: 100000 }
              as: Underwriter
              captures: { pol_bare: $.data.id }
          trigger:
            - call: "POST /inland-marine/policies/${pol_empty}/quote"
              payload: {}
              as: Underwriter
            - call: "GET /inland-marine/policies/${pol_empty}/premium-summary"
              payload: {}
              as: Underwriter
            - call: "POST /inland-marine/policies/${pol_bare}/quote"
              payload: {}
              as: Underwriter
              captures: { err: $.data.error_id }
          assert:
            - "trigger[0] HTTP status == 200"
            - "after trigger[0]: CoveragePart.${cp_empty}.rated_premium_cents == 0"
            - "after trigger[0]: Policy.${pol_empty}.sum_of_part_premiums_cents == 0"
            - "after trigger[0]: Policy.${pol_empty}.written_premium_cents == 250000"
            - "after trigger[0]: Policy.${pol_empty}.total_insured_value_cents == 0"
            - "after trigger[0]: Policy.${pol_empty}.status == QUOTED"
            - "after trigger[0]: Policy.${pol_empty}.referral_required == false"
            - "trigger[1] response: sum_of_part_premiums_cents == 0"
            - "trigger[1] response: minimum_premium_applied == true"
            - "trigger[1] response: written_premium_cents == 250000"
            - "trigger[1] response: scheduled_basis_premium_cents == 250000 and blanket_basis_premium_cents == 250000"
            - "trigger[2] HTTP status == 422"
            - "trigger[2] response error_id == ERR_NO_RATABLE_COVERAGE"
            - "after trigger[2]: Policy.${pol_bare}.status == DRAFT and written_premium_cents == 0 and quoted_at is null"

  # =========================================================================
  - rule_id: cross_entity_state_dependency
    instances:

      - name: item_activation_gated_on_policy_in_force
        grounds:
          - state_machines.EquipmentItem.RATED_to_ACTIVE
          - state_machines.Policy.BOUND_to_IN_FORCE
          - validations[priority=41]
          - errors[ERR_POLICY_NOT_IN_FORCE]
          - endpoints[POST /inland-marine/equipment-items/{id}/activate]
        distinguishing_aspect: |
          A RATED EquipmentItem cannot be activated while its grandparent Policy
          is only BOUND: the same activate call returns ERR_POLICY_NOT_IN_FORCE
          409 before the policy is activated and 200 with status ACTIVE
          immediately after, so the item's own state is identical in both
          attempts and only the two-hop ancestor state decides the outcome.
        test_recipe:
          setup:
            - "One PUBLISHED T2_URBAN EXCAVATOR rate cell, age band 0-5, base_rate_bp 180, theft_hazard_grade A."
            - "One Policy, T2_URBAN, 2026-08-01 to 2027-08-01, minimum_premium_cents 100000, driven only as far as BOUND (quote then bind, no activate)."
            - "One ACTIVE SCHEDULED_EQUIPMENT CoveragePart with one RATED EquipmentItem (insured_value_cents 8160000, rated_premium_cents 173318)."
            - "Logical clock untouched at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /inland-marine/rate-rules"
              payload: { equipment_type: "EXCAVATOR", territory_code: "T2_URBAN", age_band_min_years: 0, age_band_max_years: 5, base_rate_bp: 180, theft_hazard_grade: "A" }
              as: Actuary
              captures: { rr_exc: $.data.id }
            - call: "POST /inland-marine/rate-rules/${rr_exc}/publish"
              payload: {}
              as: Actuary
            - call: "POST /inland-marine/policies"
              payload: { policyholder_name: "Ridgeline Contractors", territory_code: "T2_URBAN", effective_date: "2026-08-01", expiration_date: "2027-08-01", minimum_premium_cents: 100000 }
              as: Underwriter
              captures: { pol: $.data.id }
            - call: "POST /inland-marine/policies/${pol}/coverage-parts"
              payload: { part_type: "SCHEDULED_EQUIPMENT", valuation_basis: "ACV", rating_basis: "SCHEDULED", deductible_cents: 100000, per_item_limit_cents: 20000000, aggregate_limit_cents: 200000000 }
              as: Underwriter
              captures: { cp: $.data.id }
            - call: "GET /inland-marine/policies/${pol}"
              payload: {}
              as: Underwriter
              captures: { pol_v1: $.data.version }
            - call: "POST /inland-marine/coverage-parts/${cp}/equipment-items"
              payload: { description: "E1 excavator", equipment_type: "EXCAVATOR", model_year: 2022, original_cost_cents: 12000000, ownership: "OWNED", geo_tracker_installed: false, expected_policy_version: "${pol_v1}" }
              as: Underwriter
              captures: { item_e1: $.data.id }
            - call: "POST /inland-marine/policies/${pol}/quote"
              payload: {}
              as: Underwriter
            - call: "POST /inland-marine/policies/${pol}/bind"
              payload: {}
              as: Underwriter
          trigger:
            - call: "POST /inland-marine/equipment-items/${item_e1}/activate"
              payload: {}
              as: Underwriter
              captures: { err: $.data.error_id }
            - call: "POST /inland-marine/policies/${pol}/activate"
              payload: {}
              as: Underwriter
            - call: "POST /inland-marine/equipment-items/${item_e1}/activate"
              payload: {}
              as: Underwriter
          assert:
            - "before trigger[0]: Policy.${pol}.status == BOUND and EquipmentItem.${item_e1}.status == RATED"
            - "trigger[0] HTTP status == 409"
            - "trigger[0] response error_id == ERR_POLICY_NOT_IN_FORCE"
            - "after trigger[0]: EquipmentItem.${item_e1}.status == RATED (unchanged)"
            - "after trigger[1]: Policy.${pol}.status == IN_FORCE and in_force_at is not null"
            - "trigger[2] HTTP status == 200"
            - "after trigger[2]: EquipmentItem.${item_e1}.status == ACTIVE"
            - "after trigger[2]: EquipmentItem.${item_e1}.rated_premium_cents == 173318 (activation does not re-rate)"
            - "Policy.${pol}.written_premium_cents == 180251 throughout all three triggers"

      - name: shipment_departure_gated_on_current_carrier_approval
        grounds:
          - state_machines.TransitShipment.PLANNED_to_IN_TRANSIT
          - state_machines.Vehicle.APPROVED_to_SUSPENDED
          - validations[priority=52]
          - errors[ERR_VEHICLE_APPROVAL_EXPIRED]
          - calculations.transit_applicable_limit
          - endpoints[POST /inland-marine/transit-shipments/{id}/depart]
        distinguishing_aspect: |
          Departure is gated on the hired Vehicle's approval being current as of
          the logical clock, not on its stored status: advancing the clock to the
          approval_expires_on date of 2026-08-10 makes the very same depart call
          fail with ERR_VEHICLE_APPROVAL_EXPIRED and SUSPENDS the vehicle as a
          side effect while the shipment stays PLANNED, and only re-approving with
          a later expiry lets the identical call succeed.
        test_recipe:
          setup:
            - "One IN_FORCE Policy, T2_URBAN, 2026-08-01 to 2027-08-01, minimum_premium_cents 100000."
            - "One ACTIVE TRANSIT CoveragePart: ACV, transit_owned_limit_cents 10000000, transit_hired_limit_cents 4000000, catastrophe_limit_cents 5000000, aggregate_limit_cents 200000000, rated_premium_cents 553000."
            - "One APPROVED HIRED Vehicle, carrier_name Blue Ridge Cartage, per_conveyance_limit_cents 5000000, approval_expires_on 2026-08-10."
            - "One PLANNED TransitShipment on that vehicle: origin T2_URBAN, destination T3_INLAND (so catastrophe_zone is false and applicable_limit_cents is the 4000000 hired limit), departure_at 2026-08-05T08:00:00Z, arrival_at 2026-08-05T14:00:00Z, declared_value_cents 1000000."
            - "Logical clock at 2026-08-04T00:00:00Z, still inside the approval window."
          setup_api_calls:
            - call: "POST /inland-marine/policies"
              payload: { policyholder_name: "Ridgeline Contractors", territory_code: "T2_URBAN", effective_date: "2026-08-01", expiration_date: "2027-08-01", minimum_premium_cents: 100000 }
              as: Underwriter
              captures: { pol: $.data.id }
            - call: "POST /inland-marine/policies/${pol}/coverage-parts"
              payload: { part_type: "TRANSIT", valuation_basis: "ACV", aggregate_limit_cents: 200000000, transit_owned_limit_cents: 10000000, transit_hired_limit_cents: 4000000, catastrophe_limit_cents: 5000000 }
              as: Underwriter
              captures: { cp: $.data.id }
            - call: "POST /inland-marine/policies/${pol}/quote"
              payload: {}
              as: Underwriter
            - call: "POST /inland-marine/policies/${pol}/bind"
              payload: {}
              as: Underwriter
            - call: "POST /inland-marine/policies/${pol}/activate"
              payload: {}
              as: Underwriter
            - call: "POST /inland-marine/vehicles"
              payload: { unit_label: "HIRED-77", ownership: "HIRED", per_conveyance_limit_cents: 5000000, carrier_name: "Blue Ridge Cartage", approval_expires_on: "2026-08-10" }
              as: Underwriter
              captures: { veh: $.data.id }
            - call: "POST /inland-marine/vehicles/${veh}/approve"
              payload: {}
              as: Underwriter
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-04T00:00:00Z" }
              as: UnderwritingManager
            - call: "POST /inland-marine/coverage-parts/${cp}/transit-shipments"
              payload: { vehicle_id: "${veh}", origin_territory_code: "T2_URBAN", destination_territory_code: "T3_INLAND", departure_at: "2026-08-05T08:00:00Z", arrival_at: "2026-08-05T14:00:00Z", declared_value_cents: 1000000 }
              as: Underwriter
              captures: { shp: $.data.id }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T00:00:00Z" }
              as: UnderwritingManager
            - call: "POST /inland-marine/transit-shipments/${shp}/depart"
              payload: {}
              as: Underwriter
              captures: { err: $.data.error_id }
            - call: "POST /inland-marine/vehicles/${veh}/approve"
              payload: { approval_expires_on: "2026-12-31" }
              as: Underwriter
            - call: "POST /inland-marine/transit-shipments/${shp}/depart"
              payload: {}
              as: Underwriter
          assert:
            - "after setup: TransitShipment.${shp}.catastrophe_zone == false"
            - "after setup: TransitShipment.${shp}.applicable_limit_cents == 4000000 (hired limit, no catastrophe cap)"
            - "after setup: Vehicle.${veh}.status == APPROVED and in_transit_value_cents == 0"
            - "trigger[1] HTTP status == 422"
            - "trigger[1] response error_id == ERR_VEHICLE_APPROVAL_EXPIRED"
            - "after trigger[1]: Vehicle.${veh}.status == SUSPENDED (the failed departure lapses the carrier approval)"
            - "after trigger[1]: TransitShipment.${shp}.status == PLANNED and departed_at is null"
            - "after trigger[2]: Vehicle.${veh}.status == APPROVED and approval_expires_on == 2026-12-31"
            - "trigger[3] HTTP status == 200"
            - "after trigger[3]: TransitShipment.${shp}.status == IN_TRANSIT and departed_at == 2026-08-10T00:00:00Z"
            - "after trigger[3]: Vehicle.${veh}.in_transit_value_cents == 1000000"
            - "CoveragePart.${cp}.rated_premium_cents == 553000 is unaffected by the shipment lifecycle"

      - name: settlement_gated_on_reporting_form_delinquency
        grounds:
          - validations[priority=68]
          - errors[ERR_REPORTING_DELINQUENT]
          - state_machines.Policy.IN_FORCE_to_SUSPENDED
          - state_machines.Policy.SUSPENDED_to_IN_FORCE
          - state_machines.ValueReport.DELINQUENT_to_SUPERSEDED
          - calculations.reporting_period_earned_premium
          - endpoints[POST /inland-marine/coverage-parts/{id}/reporting-sweep]
        distinguishing_aspect: |
          A fully adjusted REPAIR claim worth 2900000 cannot be settled while ANY
          ValueReport on its coverage part sits in DELINQUENT: the settle call
          returns ERR_REPORTING_DELINQUENT 409, and the cure is filing the missing
          report on a DIFFERENT entity - which supersedes the delinquent stub,
          returns the Policy from SUSPENDED to IN_FORCE, and only then does the
          byte-identical settle call succeed.
        test_recipe:
          setup:
            - "One PUBLISHED T2_URBAN EXCAVATOR rate cell, age band 0-5, base_rate_bp 180, theft_hazard_grade A."
            - "One IN_FORCE Policy, T2_URBAN, 2026-08-01 to 2027-08-01, minimum_premium_cents 100000."
            - "One ACTIVE REPORTING_FORM CoveragePart: ACV, deductible 100000, per_item_limit 20000000, aggregate_limit 200000000, MONTHLY, reporting_annual_rate_bp 250, reporting_limit_cents 20000000."
            - "One ACTIVE EquipmentItem, insured_value_cents 8160000."
            - "Logical clock advanced to 2026-09-16T00:00:00Z, one day past the 2026-09-15 due date for the August period."
            - "A reporting-sweep has created one DELINQUENT ValueReport for 2026-08-01..2026-08-31 and driven the Policy to SUSPENDED."
            - "One Claim on the item, loss_date 2026-08-20, INSPECTED with repair_estimate_cents 3000000 and actual_value_at_loss_cents 8160000, then adjusted REPAIR (no governing accepted report exists so underreporting_factor_bp is 10000 and settlement_amount_cents is 2900000)."
          setup_api_calls:
            - call: "POST /inland-marine/rate-rules"
              payload: { equipment_type: "EXCAVATOR", territory_code: "T2_URBAN", age_band_min_years: 0, age_band_max_years: 5, base_rate_bp: 180, theft_hazard_grade: "A" }
              as: Actuary
              captures: { rr_exc: $.data.id }
            - call: "POST /inland-marine/rate-rules/${rr_exc}/publish"
              payload: {}
              as: Actuary
            - call: "POST /inland-marine/policies"
              payload: { policyholder_name: "Delinquent Yard Co", territory_code: "T2_URBAN", effective_date: "2026-08-01", expiration_date: "2027-08-01", minimum_premium_cents: 100000 }
              as: Underwriter
              captures: { pol: $.data.id }
            - call: "POST /inland-marine/policies/${pol}/coverage-parts"
              payload: { part_type: "REPORTING_FORM", valuation_basis: "ACV", deductible_cents: 100000, per_item_limit_cents: 20000000, aggregate_limit_cents: 200000000, reporting_frequency: "MONTHLY", reporting_annual_rate_bp: 250, reporting_limit_cents: 20000000 }
              as: Underwriter
              captures: { cp: $.data.id }
            - call: "GET /inland-marine/policies/${pol}"
              payload: {}
              as: Underwriter
              captures: { pol_v1: $.data.version }
            - call: "POST /inland-marine/coverage-parts/${cp}/equipment-items"
              payload: { description: "Yard excavator", equipment_type: "EXCAVATOR", model_year: 2022, original_cost_cents: 12000000, ownership: "OWNED", geo_tracker_installed: false, expected_policy_version: "${pol_v1}" }
              as: Underwriter
              captures: { item_e1: $.data.id }
            - call: "POST /inland-marine/policies/${pol}/quote"
              payload: {}
              as: Underwriter
            - call: "POST /inland-marine/policies/${pol}/bind"
              payload: {}
              as: Underwriter
            - call: "POST /inland-marine/policies/${pol}/activate"
              payload: {}
              as: Underwriter
            - call: "POST /inland-marine/equipment-items/${item_e1}/activate"
              payload: {}
              as: Underwriter
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-16T00:00:00Z" }
              as: UnderwritingManager
            - call: "POST /inland-marine/coverage-parts/${cp}/reporting-sweep"
              payload: {}
              as: Underwriter
              captures: { swept: $.data.swept_period_count }
            - call: "GET /inland-marine/coverage-parts/${cp}/value-reports"
              payload: { status: "DELINQUENT" }
              as: Underwriter
              captures: { dq_rpt: "$.data[0].id" }
            - call: "POST /inland-marine/policies/${pol}/claims"
              payload: { coverage_part_id: "${cp}", loss_date: "2026-08-20", loss_type: "THEFT", equipment_item_id: "${item_e1}" }
              as: Underwriter
              captures: { clm: $.data.id }
            - call: "POST /inland-marine/claims/${clm}/inspect"
              payload: { repair_estimate_cents: 3000000, actual_value_at_loss_cents: 8160000 }
              as: ClaimsAdjuster
              as_user_id: "adj-1"
            - call: "POST /inland-marine/claims/${clm}/adjust"
              payload: { adjustment_basis: "REPAIR" }
              as: ClaimsAdjuster
              as_user_id: "adj-1"
