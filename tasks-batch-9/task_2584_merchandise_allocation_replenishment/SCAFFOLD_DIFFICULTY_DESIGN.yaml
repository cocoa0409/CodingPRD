          setup:
            - "Program FA26 ACTIVE with stores 0101(A,URBAN,freight 41.00,sell-through 6500), 0102(B,URBAN,freight 38.00,5800), 0103(C,SUBURBAN,freight 42.00,4200)"
            - "Shelf plans effective 2026-07-01 open-ended: 0101 capacity 48 / pmin 12, 0102 capacity 24 / pmin 8, 0103 capacity 15 / pmin 8"
            - "SizeProfile TOP-4SZ = S 2000 / M 3500 / L 3000 / XL 1500 with core_size_min_share_bp 1500, so all four sizes are CORE; SKU-1001 retail 36.50"
            - "Positions: 0101 holds 4 units (S 0, M 3, L 1, XL 0) with min 12 / max 48 -> LOW + BROKEN; 0102 holds 30 units (S 8, M 10, L 8, XL 4) with min 8 / max 24 -> OVERSTOCK + COMPLETE; 0103 holds 5 units (S 1, M 2, L 1, XL 1) with min 4 / max 20 -> IN_STOCK + COMPLETE"
            - "NET(SKU-1001) = (4 + 0) + (30 + 0) + (5 + 0) = 39 units and there is no receipt in this dataset, so nothing may change NET"
            - "The program's transfer_min_ratio_bp is 0 so no approve can be refused on freight worthiness"
            - "A 6-unit REBALANCE 0102 -> 0101 is PROPOSED and about to be approved and then cancelled"
          setup_api_calls:
            - call: "POST /allocation/programs"
              payload: { name: "FA26 Core Tops", season_code: "FA26", banner_code: "NORTH", transfer_min_ratio_bp: 0 }
