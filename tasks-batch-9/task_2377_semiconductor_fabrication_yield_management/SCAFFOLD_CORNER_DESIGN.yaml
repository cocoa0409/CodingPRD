        grounds:
          - validations[priority=46]
          - errors[ERR_PLAN_STARTS_EXCEEDED]
          - calculations.plan_start_ledger
        distinguishing_aspect: "The start ledger is checked with a strict overflow test on the sum, not on the individual lot: 8 released wafers plus a 3-wafer lot would be 11 against a 10-start plan, so the second release returns ERR_PLAN_STARTS_EXCEEDED 409 with released_wafer_starts frozen at 8 and the lot left PLANNED."
