          rationale: "That instance drives an empty database to a kindergarten exit using each role only on its own operations - DistrictAdmin for provider registration, ChildFindCoordinator for intake and notices, Parent for both consent decisions, EvaluationChair for the report, Evaluator for completions and PlacementAdministrator for determination, staffing and transition - so every role's exclusive and shared operations are exercised positively there."

  - section: cross_cutting_complexity_layers
    instances:

      - name: stale_screening_event_version_blocks_the_second_booking_until_reread
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[slot-book-stale-screening-event]
          - endpoints[POST /child-find/screening-events/{id}/slots]
        distinguishing_aspect: |
          Booking bumps the parent event's version, so a coordinator replaying the
          version they read before the first booking is rejected with 412
          ERR_STALE_SCREENING_EVENT_VERSION even though capacity remains (2 of 4
          slots). The rejection writes nothing - booked_slot_count stays 1 - and
          the identical request succeeds once the event is re-read.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "An OPEN event at host-approved S1: 09:00-12:00, slot_capacity 4, 30-minute slots, so effective_slot_capacity is 4."
            - "Two children are on the roster."
          setup_api_calls:
            - call: "POST /child-find/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: DistrictAdmin
            - call: "POST /child-find/community-sites"
              payload: { name: "Sunrise Coop", region_code: "R-1", licensed_capacity: 40, iep_seat_capacity: 2, languages_supported: ["en"], screening_host_approved: true, status: "ACTIVE" }
              as: PlacementAdministrator
              captures: { site1_id: "$.data.id" }
            - call: "POST /child-find/children"
              payload: { first_name: "Ann", last_name: "A", date_of_birth: "2023-08-01", guardian_full_name: "G A", district_of_residence: "D-01", primary_language_code: "en" }
              as: ChildFindCoordinator
              captures: { childA_id: "$.data.id" }
            - call: "POST /child-find/children"
              payload: { first_name: "Bo", last_name: "B", date_of_birth: "2023-08-01", guardian_full_name: "G B", district_of_residence: "D-01", primary_language_code: "en" }
              as: ChildFindCoordinator
              captures: { childB_id: "$.data.id" }
            - call: "POST /child-find/screening-events"
              payload: { site_id: "${site1_id}", event_label: "Fall child find", window_start_utc: "2026-08-20T09:00:00Z", window_end_utc: "2026-08-20T12:00:00Z", slot_capacity: 4, slot_length_minutes: 30 }
              as: ChildFindCoordinator
              captures: { event_id: "$.data.id" }
            - call: "POST /child-find/screening-events/${event_id}/status"
              payload: { target_status: "OPEN" }
              as: ChildFindCoordinator
              captures: { event_v1: "$.data.version" }
          trigger:
            - call: "POST /child-find/screening-events/${event_id}/slots"
              payload: { child_id: "${childA_id}", slot_start_utc: "2026-08-20T09:00:00Z", expected_screening_event_version: "${event_v1}" }
              as: ChildFindCoordinator
              captures: { slotA_id: "$.data.id" }
            - call: "POST /child-find/screening-events/${event_id}/slots"
              payload: { child_id: "${childB_id}", slot_start_utc: "2026-08-20T09:30:00Z", expected_screening_event_version: "${event_v1}" }
              as: ChildFindCoordinator
            - call: "GET /child-find/screening-events/${event_id}"
              payload: {}
              as: ChildFindCoordinator
              captures: { event_v2: "$.data.version" }
            - call: "POST /child-find/screening-events/${event_id}/slots"
              payload: { child_id: "${childB_id}", slot_start_utc: "2026-08-20T09:30:00Z", expected_screening_event_version: "${event_v2}" }
              as: ChildFindCoordinator
              captures: { slotB_id: "$.data.id" }
          assert:
            - "first response.status_code == 201"
            - "second response.status_code == 412"
            - "second response.data.error_id == \"ERR_STALE_SCREENING_EVENT_VERSION\""
            - "third response.data.booked_slot_count == 1"
            - "third response.data.effective_slot_capacity == 4"
            - "fourth response.status_code == 201"
            - "ScreeningSlot.${slotB_id}.status == \"BOOKED\""
            - "ScreeningSlot.${slotB_id}.slot_end_utc == \"2026-08-20T10:00:00Z\""
            - "ScreeningEvent.${event_id}.booked_slot_count == 2"
            - "GET /child-find/screening-slots?screening_event_id= returns total_count == 2"

      - name: stale_evaluation_case_version_blocks_a_second_determination
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[plan-create-stale-evaluation-case]
          - endpoints[POST /child-find/evaluation-cases/{id}/service-plans]
        distinguishing_aspect: |
          A second determination on the same case is legitimate - it supersedes
          the earlier DRAFT plan - so nothing in the state machine rejects it and
          only the version check can. Replaying the pre-determination version
          returns 412 ERR_STALE_EVALUATION_CASE_VERSION and leaves the first plan
          DRAFT; re-reading the case and resubmitting creates the second plan and
          moves the first to SUPERSEDED.
