          trigger:
            - call: "POST /distribution/room-types/${king_id}/allocations"
              payload: { channel_id: "${brand_id}", allocated_units: 3, start_date: "2026-09-11", end_date: "2026-09-11", expected_room_type_version: "${king_v2}" }
              as: RevenueManager
