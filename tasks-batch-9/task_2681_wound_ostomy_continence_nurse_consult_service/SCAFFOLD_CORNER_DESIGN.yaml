            - "O2: billable_days == 5, projected_cost_cents == 50000 exactly, fee_pct FEE_PCT_TIER_2 0.05 because the comparison is FEE_TIER_2_FLOOR <= projected_cost_cents, vendor_service_fee_cents == 2500, authorized_cost_cents == 52500"
