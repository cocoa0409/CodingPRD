        grounds:
          - validations.priority_38
          - entities.WelfareProtocol.fields.carrier_certificate_number
          - state_machines.WelfareProtocol.PLANNED_to_ACTIVE
        distinguishing_aspect: |
          Conditional claim keyed on kind. The certificate is mandatory only for
          INSURANCE_RIDER, so a DUTY_OF_CARE_OFFICER protocol without one is accepted
          while the rider without one is refused with
          ERR_INSURANCE_CERTIFICATE_MISSING at 422; supplying it lets the rider be
          created and activated. Because priority 38 also guards activate, the rule
          cannot be satisfied once at creation and then bypassed.
        test_recipe:
          setup:
            - "One production with a 2,000,000 welfare budget and no protocols yet."
          setup_api_calls:
            - call: "POST /casting/productions"
              payload: { title: "Harbour Nights S1", format_type: "DOCUSOAP", jurisdiction_code: "GA", season_number: 1, episode_order: 9, photography_start_utc: "2026-09-15T00:00:00Z", photography_end_utc: "2026-12-15T00:00:00Z", stipend_pool_cents: 5000000, welfare_budget_cents: 2000000, minor_participant_cap: 2 }
              as: ProductionAdmin
