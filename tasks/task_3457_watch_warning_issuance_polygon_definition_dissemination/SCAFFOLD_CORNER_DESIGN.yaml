      - name: forecaster_outside_office_scope_forbidden
        claim_type: role_denial
        grounds: ["validations[priority=3]", errors.ERR_OFFICE_SCOPE_VIOLATION, roles.Forecaster]
        distinguishing_aspect: "Office scope is enforced from the entity-backed identity: a forecaster of office B issuing office A's product is 403 ERR_OFFICE_SCOPE_VIOLATION even though Forecaster is a permitted role for the endpoint."
