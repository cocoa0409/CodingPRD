      - name: surge_multiplier_floor_excluded_stub
        claim_type: correct_result
        grounds: [calculations.surge_multiplier]
        excluded_because:
          difficulty_instance: "combinatorial_formula / surge_multiplier_nested_minmax_clamp"
          rationale: "1.30 surge case and 1.00 floor-clamp case asserted there."

  # ===========================================================================
  - section: validations
