            - "first renew fails with ERR_ACCREDITATION_INSUFFICIENT (0 < 4 renewal hours)"
            - "second renew succeeds: accreditation_level == GENERAL, accredited_at == 2028-08-02T00:00:00Z, lapsed_from_level == null"

  # ===================================================================
  # Rule 4 — transitive_cascade (two different triggers)
  # ===================================================================
  - rule_id: transitive_cascade
    instances:
      - name: attendance_midterm_revoke_seat_promotion_cascade
        grounds:
          - calculations.attendance_pct
          - calculations.midterm_revoke_check
          - state_machines.Enrollment.ENROLLED_to_REVOKED
          - state_machines.Enrollment.WAITLISTED_to_PENDING_PROMOTION
        distinguishing_aspect: |
          Depth-4 chain triggered by AttendanceRecord creation: record insert ->
          attendance_bp recompute (mutation) -> midterm floor breach flips Enrollment
          to REVOKED (mutation caused by the recompute) -> ClassSection.enrolled_count
          decrements (mutation caused by the revoke) -> waitlist head promoted to
          PENDING_PROMOTION with a 72h offer (mutation caused by the seat freeing).
        test_recipe:
          setup:
            - "Section capacity 2, total_sessions 10 (midterm point 5); applicants A and B ENROLLED, C WAITLISTED"
            - "A accumulates 4 attendance records with 2 attended (bp 5000 at 4 records — midterm not yet reached)"
          setup_api_calls:
            - { call: "POST /naturalization/programs", payload: { name: "Main" }, as: ProgramAdmin }
            - call: "POST /naturalization/volunteers"
              payload: { full_name: "Inst", email: "i@x.com", background_check_cleared: true }
