            - "order B (2 x WORKSTATION_6X6 A, SYSTEMS family) acknowledged; then SYSTEMS family driven SUNSETTING -> DISCONTINUED with parts_support_until 2033-09-01 (= clock 2026-09-01 + 2557 days)"
          setup_api_calls:
