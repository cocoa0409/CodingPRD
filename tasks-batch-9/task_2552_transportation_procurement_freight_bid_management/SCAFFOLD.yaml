        source: system
        description: Logical-clock instant of revert.
        default: null

  - name: Scorecard
    parent: Carrier
    common_fields: true
    entity_kind: resource
    fields:
      - name: carrier_id
        type: string
        source: input
        description: "FK -> Carrier.id; the scored carrier."
      - name: period_start
        type: datetime
        source: input
        description: Inclusive start of the measurement period.
      - name: period_end
        type: datetime
        source: input
        description: Exclusive end of the measurement period; MUST be strictly after period_start.
      - name: on_time_pct
        type: number
        source: input
        description: Percentage of loads delivered on time in the period, on a 0..100 scale.
        constraints: "0.00..100.00, 2 decimal places"
      - name: claims_ratio
        type: number
        source: input
        description: Fraction of loads with a freight claim in the period.
        constraints: "0.0000..1.0000, 4 decimal places"
      - name: tender_acceptance_pct
        type: number
        source: computed
        description: Percentage of tenders accepted in the period per calculations.scorecard_tender_acceptance, on a 0..100 scale.
        default: null
        constraints: "0.00..100.00, 2 decimal places"
      - name: period_tender_count
        type: integer
        source: computed
        description: TenderEvent rows counted into tender_acceptance_pct for this period.
        default: 0
      - name: composite_score
        type: number
        source: computed
        description: Period composite score produced by calculations.carrier_composite_score applied to this single period.
        default: null
      - name: status
        type: enum
        source: computed
        description: Scorecard lifecycle.
        default: DRAFT
        constraints: "DRAFT | PUBLISHED | DISPUTED"
      - name: published_at
        type: datetime
        source: system
        description: Logical-clock instant of publication.
        default: null
      - name: disputed_reason
        type: string
        source: computed
        description: Reason recorded when the carrier disputed the published scorecard.
        default: null

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Carrier
    initial_state: REGISTERED
    terminal_states: [DISQUALIFIED]
    shape: branching_with_revert
    transitions:
      - from: REGISTERED
        to: SCREENING
        trigger: "POST /freight-procurement/carriers/{id}/qualification-reviews"
        actor: ProcurementAnalyst
        preconditions:
          - "Carrier.status == REGISTERED"
          - "no QualificationReview on this carrier with status IN {SUBMITTED, SCREENED, REMEDIATION}"
        side_effects:
          - "creates QualificationReview with status SUBMITTED, insurance_result PENDING, capability_result PENDING, remediation_count 0"
      - from: SCREENING
        to: QUALIFIED
        trigger: "POST /freight-procurement/qualification-reviews/{id}/decision with outcome APPROVE"
        actor: ComplianceOfficer
        preconditions:
          - "QualificationReview.status == SCREENED"
          - "QualificationReview.insurance_result == PASS"
          - "QualificationReview.capability_result == PASS"
        side_effects:
          - "QualificationReview.status SCREENED -> APPROVED"
          - "Carrier.capability_score := QualificationReview.capability_score"
          - "Carrier.qualified_at := logical clock"
          - "recompute Carrier.composite_score and composite_score_variant per calculations.carrier_composite_score"
      - from: SCREENING
        to: CONDITIONALLY_QUALIFIED
        trigger: "POST /freight-procurement/qualification-reviews/{id}/decision with outcome APPROVE_CONDITIONAL"
        actor: ComplianceOfficer
        preconditions:
          - "QualificationReview.status == SCREENED"
          - "QualificationReview.insurance_result == PASS"
          - "QualificationReview.capability_result == FAIL"
        side_effects:
          - "QualificationReview.status SCREENED -> CONDITIONALLY_APPROVED"
          - "Carrier.capability_score := QualificationReview.capability_score"
          - "Carrier.qualified_at := logical clock"
          - "recompute Carrier.composite_score and composite_score_variant per calculations.carrier_composite_score"
        note: "A CONDITIONALLY_QUALIFIED carrier is eligible for award only at composite_score >= CONDITIONAL_ELIGIBILITY_FLOOR."
      - from: SCREENING
        to: SCREENING
        trigger: "POST /freight-procurement/qualification-reviews/{id}/decision with outcome REMEDIATE"
        actor: ComplianceOfficer
        preconditions:
          - "QualificationReview.status == SCREENED"
          - "QualificationReview.remediation_count < MAX_REMEDIATIONS"
        side_effects:
          - "QualificationReview.status SCREENED -> REMEDIATION, remediation_count += 1, insurance_result := PENDING, capability_result := PENDING"
        note: "Carrier stays in SCREENING; the review re-enters the screening loop."
      - from: SCREENING
        to: DISQUALIFIED
        trigger: "POST /freight-procurement/qualification-reviews/{id}/decision with outcome REJECT"
        actor: ComplianceOfficer
        preconditions:
          - "QualificationReview.status == SCREENED"
        side_effects:
          - "QualificationReview.status SCREENED -> REJECTED"
          - "Carrier.status_reason := decision_note"
      - from: QUALIFIED
        to: WATCHLIST
        trigger: "system — Scorecard publication drops composite_score below WATCHLIST_FLOOR"
        actor: system
        preconditions:
          - "recomputed Carrier.composite_score < WATCHLIST_FLOOR"
        side_effects:
          - "Carrier.status_reason := 'SCORECARD_BELOW_FLOOR'"
        note: "Cascade link 3 of the scorecard publication chain."
      - from: WATCHLIST
        to: QUALIFIED
        trigger: "system — Scorecard publication lifts composite_score to WATCHLIST_FLOOR or above"
        actor: system
        preconditions:
          - "recomputed Carrier.composite_score >= WATCHLIST_FLOOR"
        side_effects:
          - "Carrier.status_reason := null"
      - from: QUALIFIED
        to: SUSPENDED
        trigger: "POST /freight-procurement/carriers/{id}/status-change with payload to_status SUSPENDED"
        actor: ComplianceOfficer
        preconditions:
          - "Carrier.status IN {REGISTERED, SCREENING, QUALIFIED, WATCHLIST} — this row stands for the suspend edge out of each of those states; the CONDITIONALLY_QUALIFIED edge is declared separately below"
        side_effects:
          - "Carrier.status_reason := payload reason"
        note: "Same transition is declared from CONDITIONALLY_QUALIFIED, WATCHLIST, REGISTERED and SCREENING."
      - from: CONDITIONALLY_QUALIFIED
        to: SUSPENDED
        trigger: "POST /freight-procurement/carriers/{id}/status-change with payload to_status SUSPENDED"
        actor: ComplianceOfficer
        preconditions:
          - "Carrier.status == CONDITIONALLY_QUALIFIED"
        side_effects:
          - "Carrier.status_reason := payload reason"
      - from: SUSPENDED
        to: QUALIFIED
        trigger: "POST /freight-procurement/carriers/{id}/status-change with payload to_status QUALIFIED"
        actor: ComplianceOfficer
        preconditions:
          - "Carrier.status == SUSPENDED"
          - "Carrier.insurance_expiry_date > logical clock"
        side_effects:
          - "Carrier.status_reason := payload reason"
          - "Carrier.qualified_at := logical clock"
      - from: SUSPENDED
        to: DISQUALIFIED
        trigger: "POST /freight-procurement/carriers/{id}/status-change with payload to_status DISQUALIFIED"
        actor: ComplianceOfficer
        preconditions:
          - "Carrier.status != DISQUALIFIED"
        side_effects:
          - "Carrier.status_reason := payload reason"
          - "every Invitation for this carrier with status IN {SENT, ACCEPTED} -> REVOKED"
          - "because those invitations were revoked, every LaneBid of this carrier with status SUBMITTED on an OPEN round -> WITHDRAWN"

  - entity: QualificationReview
    initial_state: SUBMITTED
    terminal_states: [APPROVED, CONDITIONALLY_APPROVED, REJECTED]
    shape: fork_join_with_cycle
    transitions:
      - from: SUBMITTED
        to: SUBMITTED
        trigger: "POST /freight-procurement/qualification-reviews/{id}/insurance-verification (join incomplete)"
        actor: ComplianceOfficer
        preconditions:
          - "QualificationReview.status == SUBMITTED"
          - "QualificationReview.insurance_result == PENDING"
          - "QualificationReview.capability_result == PENDING"
        side_effects:
          - "insurance_result := PASS when verified_auto_liability_usd >= min_auto_liability_usd AND verified_cargo_usd >= min_cargo_usd AND verified_expiry_date > logical clock, else FAIL"
          - "insurance_verified_at := logical clock"
          - "on PASS only: Carrier.auto_liability_limit_usd, Carrier.cargo_limit_usd, Carrier.insurance_expiry_date := the verified values"
        note: "Insurance branch of the fork; its side-effect set differs from the capability branch."
      - from: SUBMITTED
        to: SUBMITTED
        trigger: "POST /freight-procurement/qualification-reviews/{id}/capability-screening (join incomplete)"
        actor: ComplianceOfficer
        preconditions:
          - "QualificationReview.status == SUBMITTED"
          - "QualificationReview.capability_result == PENDING"
          - "QualificationReview.insurance_result == PENDING"
        side_effects:
          - "capability_score := calculations.capability_screening_score"
          - "capability_result := PASS when required_modes is a subset of screened_service_modes AND capability_score >= CAPABILITY_PASS_FLOOR, else FAIL"
          - "capability_screened_at := logical clock"
          - "Carrier.capability_score := capability_score regardless of PASS or FAIL"
        note: "Capability branch of the fork; writes a score onto the Carrier that the insurance branch never touches."
      - from: SUBMITTED
        to: SCREENED
        trigger: "POST /freight-procurement/qualification-reviews/{id}/insurance-verification (completes the join)"
        actor: ComplianceOfficer
        preconditions:
          - "QualificationReview.status == SUBMITTED"
          - "QualificationReview.insurance_result == PENDING"
          - "QualificationReview.capability_result != PENDING"
        side_effects:
          - "same insurance-branch side effects as the join-incomplete transition"
          - "status := SCREENED because both branches now hold a non-PENDING result"
      - from: SUBMITTED
        to: SCREENED
        trigger: "POST /freight-procurement/qualification-reviews/{id}/capability-screening (completes the join)"
        actor: ComplianceOfficer
        preconditions:
          - "QualificationReview.status == SUBMITTED"
          - "QualificationReview.capability_result == PENDING"
          - "QualificationReview.insurance_result != PENDING"
        side_effects:
          - "same capability-branch side effects as the join-incomplete transition"
          - "status := SCREENED because both branches now hold a non-PENDING result"
      - from: SCREENED
        to: REMEDIATION
        trigger: "POST /freight-procurement/qualification-reviews/{id}/decision with outcome REMEDIATE"
        actor: ComplianceOfficer
        preconditions:
          - "QualificationReview.status == SCREENED"
          - "QualificationReview.remediation_count < MAX_REMEDIATIONS"
        side_effects:
          - "remediation_count += 1; insurance_result := PENDING; capability_result := PENDING; decision_outcome := REMEDIATE; decision_by_user_id := X-User-ID"
      - from: REMEDIATION
        to: SUBMITTED
        trigger: "POST /freight-procurement/qualification-reviews/{id}/insurance-verification or .../capability-screening"
        actor: ComplianceOfficer
        preconditions:
          - "QualificationReview.status == REMEDIATION"
        side_effects:
          - "status := SUBMITTED and the corresponding branch result is written; the fork re-opens"
        note: "Closes the review cycle SCREENED -> REMEDIATION -> SUBMITTED -> SCREENED; bounded by MAX_REMEDIATIONS."
      - from: SCREENED
        to: APPROVED
        trigger: "POST /freight-procurement/qualification-reviews/{id}/decision with outcome APPROVE"
        actor: ComplianceOfficer
        preconditions:
          - "insurance_result == PASS AND capability_result == PASS"
        side_effects:
          - "Carrier.status SCREENING -> QUALIFIED with its own side-effect set"
      - from: SCREENED
        to: CONDITIONALLY_APPROVED
        trigger: "POST /freight-procurement/qualification-reviews/{id}/decision with outcome APPROVE_CONDITIONAL"
        actor: ComplianceOfficer
        preconditions:
          - "insurance_result == PASS AND capability_result == FAIL"
        side_effects:
          - "Carrier.status SCREENING -> CONDITIONALLY_QUALIFIED"
      - from: SCREENED
        to: REJECTED
        trigger: "POST /freight-procurement/qualification-reviews/{id}/decision with outcome REJECT"
        actor: ComplianceOfficer
        preconditions:
          - "QualificationReview.status == SCREENED"
        side_effects:
          - "Carrier.status SCREENING -> DISQUALIFIED"

  - entity: Lane
    initial_state: DRAFT
    terminal_states: []
    shape: cyclic
    transitions:
      - from: DRAFT
        to: VALIDATED
        trigger: "POST /freight-procurement/lanes/{id}/validate"
        actor: ProcurementAnalyst
        preconditions:
          - "Lane.status == DRAFT"
          - "BidEvent.status == DRAFT"
        side_effects:
          - "data_quality_flags := computed per calculations.lane_data_quality_flags"
          - "unallocated_volume_loads := annual_volume_loads"
          - "baseline_cost_usd := calculations.lane_baseline_cost under BidEvent.cost_basis"
          - "validated_at := logical clock"
      - from: VALIDATED
        to: LOCKED
        trigger: "system — POST /freight-procurement/bid-events/{id}/lock-lanes"
        actor: system
        preconditions:
          - "Lane.status == VALIDATED"
        side_effects:
          - "BidEvent.total_scope_volume_loads and BidEvent.baseline_cost_usd recomputed over the newly locked set"
      - from: LOCKED
        to: AWARDED
        trigger: "system — award cascade link 3 (an AwardAllocation on this lane became EXECUTED)"
        actor: system
        preconditions:
          - "at least one AwardAllocation on this lane has status EXECUTED"
        side_effects:
          - "awarded_coverage_pct := round(100 * (annual_volume_loads - unallocated_volume_loads) / annual_volume_loads, 2)"
          - "because the lane became AWARDED, cascade link 4 creates the Contract rows for the carriers holding EXECUTED allocations on it"
      - from: AWARDED
        to: UNDER_REBID
        trigger: "system — tender-risk cascade link 2 (a RateRecord on this lane became AT_RISK)"
        actor: system
        preconditions:
          - "the AT_RISK RateRecord's award_allocation_id points at an allocation with routing_position PRIMARY and status ACTIVE"
        side_effects:
          - "that AwardAllocation.status ACTIVE -> SUSPENDED_ROUTING"
          - "because the primary allocation is suspended, cascade link 3 auto-creates a MiniBid with origin SYSTEM and status REQUESTED on this lane"
      - from: UNDER_REBID
        to: AWARDED
        trigger: "system — POST /freight-procurement/mini-bids/{id}/apply on this lane"
        actor: system
        preconditions:
          - "the applied MiniBid.lane_id == Lane.id"
        side_effects:
          - "the suspended AwardAllocation.status SUSPENDED_ROUTING -> ACTIVE"
          - "awarded_coverage_pct recomputed"

  - entity: BidEvent
    initial_state: DRAFT
    terminal_states: [LIVE]
    shape: cyclic
    transitions:
      - from: DRAFT
        to: LANES_LOCKED
        trigger: "POST /freight-procurement/bid-events/{id}/lock-lanes"
        actor: ProcurementAnalyst
        preconditions:
          - "BidEvent.status == DRAFT"
          - "lane_count >= 1"
          - "every Lane of this event has status VALIDATED"
        side_effects:
          - "every Lane VALIDATED -> LOCKED"
          - "total_scope_volume_loads := sum of Lane.annual_volume_loads over locked lanes"
          - "baseline_cost_usd := sum of Lane.baseline_cost_usd over locked lanes"
      - from: LANES_LOCKED
        to: INVITING
        trigger: "POST /freight-procurement/bid-events/{id}/invitations (first invitation)"
        actor: ProcurementAnalyst
        preconditions:
          - "BidEvent.status == LANES_LOCKED"
        side_effects:
          - "invited_carrier_count += 1"
      - from: INVITING
        to: ROUND_OPEN
        trigger: "POST /freight-procurement/bid-events/{id}/bid-rounds"
        actor: ProcurementAnalyst
        preconditions:
          - "BidEvent.status == INVITING"
          - "accepted_invitation_count >= 1"
          - "current_round_no < rounds_allowed"
        side_effects:
          - "current_round_no += 1"
          - "creates BidRound with round_no = current_round_no and status OPEN"
      - from: ROUND_OPEN
        to: ROUND_CLOSED
        trigger: "POST /freight-procurement/bid-rounds/{id}/close"
        actor: CategoryManager
        preconditions:
          - "BidEvent.status == ROUND_OPEN"
          - "BidRound.status == OPEN"
        side_effects:
          - "BidRound.status OPEN -> CLOSED, closed_at := logical clock"
          - "for every locked lane, calculations.bid_cost_rank_score and rank_in_lane are written on the round's SUBMITTED LaneBid rows"
      - from: ROUND_CLOSED
        to: ROUND_OPEN
        trigger: "POST /freight-procurement/bid-events/{id}/bid-rounds (next negotiation round)"
        actor: ProcurementAnalyst
        preconditions:
          - "BidEvent.status == ROUND_CLOSED"
          - "current_round_no < rounds_allowed"
        side_effects:
          - "current_round_no += 1"
          - "creates the next BidRound with status OPEN; prior-round LaneBid rows keep their status and remain visible to ranking"
        note: "The negotiation cycle ROUND_OPEN -> ROUND_CLOSED -> ROUND_OPEN; bounded by rounds_allowed."
      - from: ROUND_CLOSED
        to: OPTIMIZING
        trigger: "POST /freight-procurement/optimization-runs"
        actor: ProcurementAnalyst
        preconditions:
          - "BidEvent.status == ROUND_CLOSED"
          - "expected_bid_event_version == BidEvent.version"
        side_effects:
          - "creates OptimizationRun; version += 1"
      - from: OPTIMIZING
        to: OPTIMIZING
        trigger: "POST /freight-procurement/optimization-runs (additional scenario)"
        actor: ProcurementAnalyst
        preconditions:
          - "BidEvent.status == OPTIMIZING"
          - "expected_bid_event_version == BidEvent.version"
        side_effects:
          - "every prior OptimizationRun of this event with status IN {COMPLETED, PUBLISHED} -> SUPERSEDED"
          - "because those runs were superseded, their AwardAllocation rows with status IN {PROPOSED, APPROVED} -> SUPERSEDED and each such row credits allocated_volume_loads back to Lane.unallocated_volume_loads when it had been APPROVED"
      - from: OPTIMIZING
        to: AWARDING
        trigger: "POST /freight-procurement/optimization-runs/{id}/routing-guide"
        actor: ProcurementAnalyst
        preconditions:
          - "BidEvent.status == OPTIMIZING"
          - "OptimizationRun.status == COMPLETED"
          - "OptimizationRun.coverage_pct >= OptimizationRun.min_capacity_coverage_pct"
        side_effects:
          - "creates AwardAllocation rows with status PROPOSED per calculations.award_allocation_waterfall"
          - "selected LaneBid rows SUBMITTED -> SHORTLISTED; unselected SUBMITTED rows on lanes that produced a guide -> NOT_AWARDED"
          - "OptimizationRun.status COMPLETED -> PUBLISHED, published_at := logical clock"
      - from: AWARDING
        to: OPTIMIZING
        trigger: "POST /freight-procurement/optimization-runs (re-optimize after rejections)"
        actor: ProcurementAnalyst
        preconditions:
          - "BidEvent.status == AWARDING"
          - "expected_bid_event_version == BidEvent.version"
        side_effects:
          - "same supersede cascade as the OPTIMIZING -> OPTIMIZING transition"
      - from: AWARDING
        to: AWARDED
        trigger: "POST /freight-procurement/bid-events/{id}/award"
        actor: CategoryManager
        preconditions:
          - "BidEvent.status == AWARDING"
          - "no AwardAllocation of the PUBLISHED run remains in status PROPOSED"
          - "coverage_pct >= the PUBLISHED run's min_capacity_coverage_pct"
          - "diversity_pct >= BidEvent.diversity_min_pct"
        side_effects:
          - "cascade link 1: BidEvent.status := AWARDED, awarded_at := logical clock, award_cost_usd and savings_pct recomputed"
          - "cascade link 2 (caused by link 1): every AwardAllocation of the PUBLISHED run with status APPROVED -> EXECUTED and its LaneBid SHORTLISTED -> AWARDED_PRIMARY or AWARDED_BACKUP by routing_position"
          - "cascade link 3 (caused by link 2): every Lane holding an EXECUTED allocation LOCKED -> AWARDED with awarded_coverage_pct recomputed"
          - "cascade link 4 (caused by link 3): for each (bid_event_id, carrier_id) pair present in those lanes' EXECUTED allocations a Contract row is created with status DRAFT, signature_status PENDING_BOTH, rate_load_status NOT_STAGED, effective_from/effective_to copied from the event, and calculations.contract_committed_value evaluated"
          - "cascade link 5 (caused by link 4): each contracted Carrier has committed_volume_loads and active_primary_lane_count recomputed from its EXECUTED allocations"
      - from: AWARDED
        to: LIVE
        trigger: "system — the first RateRecord of this event reaches LIVE"
        actor: system
        preconditions:
          - "BidEvent.status == AWARDED"
        side_effects:
          - "coverage_pct recomputed over allocations with status ACTIVE"

  - entity: BidRound
    initial_state: OPEN
    terminal_states: [CLOSED]
    shape: linear
    transitions:
      - from: OPEN
        to: CLOSED
        trigger: "POST /freight-procurement/bid-rounds/{id}/close"
        actor: CategoryManager
        preconditions:
          - "BidRound.status == OPEN"
          - "BidEvent.status == ROUND_OPEN"
        side_effects:
          - "closed_at := logical clock"
          - "cost_rank_score and rank_in_lane written on every SUBMITTED LaneBid of this round, ranked per calculations.bid_cost_rank_score"
          - "BidEvent.status ROUND_OPEN -> ROUND_CLOSED"

  - entity: Invitation
    initial_state: SENT
    terminal_states: [DECLINED, REVOKED]
    shape: branching
    transitions:
      - from: SENT
        to: ACCEPTED
        trigger: "POST /freight-procurement/invitations/{id}/response with response ACCEPT"
        actor: CarrierRep
        preconditions:
          - "Invitation.status == SENT"
          - "X-User-ID == Invitation.carrier_id"
          - "Carrier.status IN {QUALIFIED, CONDITIONALLY_QUALIFIED}"
          - "Carrier.insurance_expiry_date > logical clock"
          - "nda_signed == true when nda_required == true"
        side_effects:
          - "responded_at := logical clock; nda_signed := payload value"
          - "BidEvent.accepted_invitation_count += 1"
          - "snapshot_stale := (Carrier.version != qualification_snapshot_carrier_version)"
      - from: SENT
        to: DECLINED
        trigger: "POST /freight-procurement/invitations/{id}/response with response DECLINE"
        actor: CarrierRep
        preconditions:
          - "Invitation.status == SENT"
          - "X-User-ID == Invitation.carrier_id"
        side_effects:
          - "decline_reason := payload value; responded_at := logical clock"
      - from: SENT
        to: REVOKED
        trigger: "POST /freight-procurement/invitations/{id}/revoke"
        actor: ProcurementAnalyst
        preconditions:
          - "Invitation.status IN {SENT, ACCEPTED}"
        side_effects:
          - "revoked_reason := payload value"
          - "every LaneBid of this carrier with status SUBMITTED on an OPEN round of this event -> WITHDRAWN, and each such round's submitted_bid_count and lowest_rate_per_mile are recomputed"
      - from: ACCEPTED
        to: REVOKED
        trigger: "POST /freight-procurement/invitations/{id}/revoke"
        actor: ProcurementAnalyst
        preconditions:
          - "Invitation.status == ACCEPTED"
        side_effects:
          - "BidEvent.accepted_invitation_count -= 1"
          - "every LaneBid of this carrier with status SUBMITTED on an OPEN round of this event -> WITHDRAWN"

  - entity: LaneBid
    initial_state: SUBMITTED
    terminal_states: [WITHDRAWN, NOT_AWARDED, AWARDED_PRIMARY, AWARDED_BACKUP]
    shape: branching
    transitions:
      - from: SUBMITTED
        to: WITHDRAWN
        trigger: "POST /freight-procurement/lane-bids/{id}/withdraw"
        actor: CarrierRep
        preconditions:
          - "LaneBid.status == SUBMITTED"
          - "X-User-ID == LaneBid.carrier_id"
          - "BidRound.status == OPEN"
        side_effects:
          - "withdrawn_at := logical clock"
          - "BidRound.submitted_bid_count -= 1 and lowest_rate_per_mile recomputed over remaining SUBMITTED bids"
      - from: SUBMITTED
        to: SHORTLISTED
        trigger: "system — POST /freight-procurement/optimization-runs/{id}/routing-guide selected this bid"
        actor: system
        preconditions:
          - "this LaneBid holds a routing position in calculations.award_allocation_waterfall output for its lane"
        side_effects:
          - "an AwardAllocation row referencing this lane_bid_id is created with status PROPOSED"
      - from: SUBMITTED
        to: NOT_AWARDED
        trigger: "system — POST /freight-procurement/optimization-runs/{id}/routing-guide did not select this bid"
        actor: system
        preconditions:
          - "the bid's lane produced at least one routing position and this bid is not among them"
        side_effects: []
      - from: SHORTLISTED
        to: AWARDED_PRIMARY
        trigger: "system — award cascade link 2 with routing_position PRIMARY"
        actor: system
        preconditions:
          - "the referencing AwardAllocation reached EXECUTED with routing_position PRIMARY"
        side_effects: []
      - from: SHORTLISTED
        to: AWARDED_BACKUP
        trigger: "system — award cascade link 2 with routing_position BACKUP_1 or BACKUP_2"
        actor: system
        preconditions:
          - "the referencing AwardAllocation reached EXECUTED with routing_position IN {BACKUP_1, BACKUP_2}"
        side_effects: []
      - from: SHORTLISTED
        to: NOT_AWARDED
        trigger: "system — POST /freight-procurement/award-allocations/{id}/reject"
        actor: system
        preconditions:
          - "the referencing AwardAllocation moved to REJECTED"
        side_effects: []

  - entity: OptimizationRun
    initial_state: COMPLETED
    terminal_states: [SUPERSEDED, FAILED]
    shape: branching
    transitions:
      - from: COMPLETED
        to: PUBLISHED
        trigger: "POST /freight-procurement/optimization-runs/{id}/routing-guide"
        actor: ProcurementAnalyst
        preconditions:
          - "OptimizationRun.status == COMPLETED"
          - "BidEvent.status == OPTIMIZING"
          - "coverage_pct >= min_capacity_coverage_pct"
        side_effects:
          - "AwardAllocation rows created with status PROPOSED; published_at := logical clock; BidEvent OPTIMIZING -> AWARDING"
      - from: COMPLETED
        to: SUPERSEDED
        trigger: "system — a later OptimizationRun is created on the same BidEvent"
        actor: system
        preconditions:
          - "OptimizationRun.status IN {COMPLETED, PUBLISHED}"
        side_effects:
          - "this run's AwardAllocation rows with status IN {PROPOSED, APPROVED} -> SUPERSEDED"
      - from: PUBLISHED
        to: SUPERSEDED
        trigger: "system — a later OptimizationRun is created on the same BidEvent"
        actor: system
        preconditions:
          - "BidEvent.status IN {OPTIMIZING, AWARDING}"
        side_effects:
          - "this run's AwardAllocation rows with status IN {PROPOSED, APPROVED} -> SUPERSEDED; APPROVED rows credit their allocated_volume_loads back to Lane.unallocated_volume_loads"
      - from: COMPLETED
        to: FAILED
        trigger: "system — evaluated at creation when no in-scope lane had an eligible bid"
        actor: system
        preconditions:
          - "infeasible_lane_ids covers every in-scope lane of the event"
        side_effects:
          - "coverage_pct := 0.00; total_cost_usd := 0.00; objective_score := 0.0000"
        note: "A FAILED run is minted directly in FAILED at creation time; publishing it raises ERR_NO_FEASIBLE_ALLOCATION."

  - entity: AwardAllocation
    initial_state: PROPOSED
    terminal_states: [REJECTED, SUPERSEDED]
    shape: branching_with_revert
    transitions:
      - from: PROPOSED
        to: APPROVED
        trigger: "POST /freight-procurement/award-allocations/{id}/approve"
        actor: CategoryManager
        preconditions:
          - "AwardAllocation.status == PROPOSED"
          - "BidEvent.status == AWARDING"
          - "Carrier.status IN {QUALIFIED, CONDITIONALLY_QUALIFIED}"
          - "Carrier.insurance_expiry_date > logical clock"
        side_effects:
          - "approved_by_user_id := X-User-ID; approved_at := logical clock"
          - "Lane.unallocated_volume_loads -= allocated_volume_loads and Lane.awarded_coverage_pct recomputed"
          - "BidEvent.coverage_pct and diversity_pct recomputed over allocations with status IN {APPROVED, EXECUTED, ACTIVE}"
      - from: PROPOSED
        to: REJECTED
        trigger: "POST /freight-procurement/award-allocations/{id}/reject"
        actor: CategoryManager
        preconditions:
          - "AwardAllocation.status == PROPOSED"
          - "BidEvent.status == AWARDING"
        side_effects:
          - "rejection_reason := payload value"
          - "referencing LaneBid SHORTLISTED -> NOT_AWARDED"
          - "when routing_position == PRIMARY, the lane's BACKUP_1 allocation with status IN {PROPOSED, APPROVED} is promoted to PRIMARY with promoted_from_position := BACKUP_1, and BACKUP_2 (when present) is promoted to BACKUP_1 with promoted_from_position := BACKUP_2; volumes are re-derived by calculations.award_allocation_waterfall over the surviving positions"
      - from: APPROVED
        to: REJECTED
        trigger: "POST /freight-procurement/award-allocations/{id}/reject"
        actor: CategoryManager
        preconditions:
          - "AwardAllocation.status == APPROVED"
          - "BidEvent.status == AWARDING"
        side_effects:
          - "Lane.unallocated_volume_loads += allocated_volume_loads (exact credit of the debit taken at approval)"
          - "referencing LaneBid SHORTLISTED -> NOT_AWARDED"
          - "backup promotion identical to the PROPOSED -> REJECTED transition"
          - "BidEvent.coverage_pct and diversity_pct recomputed"
        note: "Compensating action of the approval; the lane volume invariant must hold exactly afterwards."
      - from: APPROVED
        to: EXECUTED
        trigger: "system — award cascade link 2"
        actor: system
        preconditions:
          - "BidEvent.status became AWARDED in this request"
        side_effects:
          - "referencing LaneBid SHORTLISTED -> AWARDED_PRIMARY or AWARDED_BACKUP"
      - from: EXECUTED
        to: ACTIVE
        trigger: "system — the RateRecord implementing this allocation reached LIVE"
        actor: system
        preconditions:
          - "a RateRecord with award_allocation_id == this id reached LIVE"
        side_effects:
          - "Carrier.active_primary_lane_count recomputed"
      - from: ACTIVE
        to: SUSPENDED_ROUTING
        trigger: "system — tender-risk cascade link 2"
        actor: system
        preconditions:
          - "the RateRecord implementing this allocation moved LIVE -> AT_RISK"
        side_effects:
          - "Lane.status AWARDED -> UNDER_REBID"
      - from: SUSPENDED_ROUTING
        to: ACTIVE
        trigger: "system — POST /freight-procurement/mini-bids/{id}/apply on the same lane"
        actor: system
        preconditions:
          - "the applied MiniBid.lane_id == AwardAllocation.lane_id"
        side_effects:
          - "Lane.status UNDER_REBID -> AWARDED"
      - from: PROPOSED
        to: SUPERSEDED
        trigger: "system — a later OptimizationRun supersedes this run"
        actor: system
        preconditions:
          - "the owning OptimizationRun moved to SUPERSEDED"
        side_effects: []
      - from: APPROVED
        to: SUPERSEDED
        trigger: "system — a later OptimizationRun supersedes this run"
        actor: system
        preconditions:
          - "the owning OptimizationRun moved to SUPERSEDED"
        side_effects:
          - "Lane.unallocated_volume_loads += allocated_volume_loads"

  - entity: Contract
    initial_state: DRAFT
    terminal_states: []
    shape: independent_dimensions
    dimensions:
      - field: signature_status
        states: [PENDING_BOTH, PENDING_SHIPPER, PENDING_CARRIER, FULLY_SIGNED]
      - field: rate_load_status
        states: [NOT_STAGED, STAGED, LOADED, LIVE]
      - field: status
        states: [DRAFT, EXECUTED, AMENDED]
    note: |
      signature_status and rate_load_status are two independent state dimensions on the
      same Contract row. Either may advance while the other stands still: rates may be
      staged and loaded before any signature exists, and both signatures may be applied
      before any rate record exists. They couple at exactly one point — the
      LOADED -> LIVE step of rate_load_status requires signature_status == FULLY_SIGNED.
    transitions:
      - from: "signature_status: PENDING_BOTH"
        to: "signature_status: PENDING_SHIPPER"
        trigger: "POST /freight-procurement/contracts/{id}/carrier-signature"
        actor: CarrierRep
        preconditions:
          - "signature_status == PENDING_BOTH"
          - "X-User-ID == Contract.carrier_id"
        side_effects:
          - "carrier_signed_by_user_id := X-User-ID; carrier_signed_at := logical clock"
      - from: "signature_status: PENDING_BOTH"
        to: "signature_status: PENDING_CARRIER"
        trigger: "POST /freight-procurement/contracts/{id}/shipper-signature"
        actor: ContractAdmin
        preconditions:
          - "signature_status == PENDING_BOTH"
          - "X-User-ID != approved_by_user_id of every AwardAllocation with this contract's bid_event_id and carrier_id"
        side_effects:
          - "shipper_signed_by_user_id := X-User-ID; shipper_signed_at := logical clock"
      - from: "signature_status: PENDING_SHIPPER"
        to: "signature_status: FULLY_SIGNED"
        trigger: "POST /freight-procurement/contracts/{id}/shipper-signature"
        actor: ContractAdmin
        preconditions:
          - "signature_status == PENDING_SHIPPER"
          - "X-User-ID != approved_by_user_id of every AwardAllocation with this contract's bid_event_id and carrier_id"
        side_effects:
          - "shipper_signed_by_user_id := X-User-ID; shipper_signed_at := logical clock"
          - "status DRAFT -> EXECUTED"
      - from: "signature_status: PENDING_CARRIER"
        to: "signature_status: FULLY_SIGNED"
        trigger: "POST /freight-procurement/contracts/{id}/carrier-signature"
        actor: CarrierRep
        preconditions:
          - "signature_status == PENDING_CARRIER"
          - "X-User-ID == Contract.carrier_id"
        side_effects:
          - "carrier_signed_by_user_id := X-User-ID; carrier_signed_at := logical clock"
          - "status DRAFT -> EXECUTED"
      - from: "rate_load_status: NOT_STAGED"
        to: "rate_load_status: STAGED"
        trigger: "POST /freight-procurement/contracts/{id}/rate-records"
        actor: ContractAdmin
        preconditions:
          - "rate_load_status == NOT_STAGED"
        side_effects:
          - "rate_record_count += 1; committed_value_usd of the new record computed; calculations.contract_committed_value re-evaluated"
      - from: "rate_load_status: STAGED"
        to: "rate_load_status: LOADED"
        trigger: "system — the first RateRecord of this contract reached LOADED"
        actor: system
        preconditions:
          - "rate_load_status == STAGED"
        side_effects: []
      - from: "rate_load_status: LOADED"
        to: "rate_load_status: LIVE"
        trigger: "system — the first RateRecord of this contract reached LIVE"
        actor: system
        preconditions:
          - "rate_load_status == LOADED"
          - "signature_status == FULLY_SIGNED"
        side_effects:
          - "BidEvent.status AWARDED -> LIVE when this is the event's first live rate"
        note: "The single coupling point between the two dimensions."
      - from: "status: EXECUTED"
        to: "status: AMENDED"
        trigger: "system — POST /freight-procurement/mini-bids/{id}/apply"
        actor: system
        preconditions:
          - "status IN {EXECUTED, AMENDED}"
        side_effects:
          - "amendment_count += 1; calculations.contract_committed_value re-evaluated; version += 1"

  - entity: RateRecord
    initial_state: STAGED
    terminal_states: [ROLLED_BACK]
    shape: cyclic
    transitions:
      - from: STAGED
        to: LOADED
        trigger: "POST /freight-procurement/rate-records/{id}/load"
        actor: ContractAdmin
        preconditions:
          - "RateRecord.status == STAGED"
          - "Carrier.status NOT IN {SUSPENDED, DISQUALIFIED}"
          - "no other RateRecord with the same (lane_id, carrier_id, routing_position) and status IN {LOADED, LIVE, AT_RISK} has an effective interval overlapping [effective_from, effective_to) under half-open semantics"
        side_effects:
          - "loaded_at := logical clock"
          - "Contract.rate_load_status STAGED -> LOADED when this is the contract's first loaded record"
      - from: LOADED
        to: LIVE
        trigger: "POST /freight-procurement/rate-records/{id}/go-live"
        actor: ContractAdmin
        preconditions:
          - "RateRecord.status == LOADED"
          - "Contract.signature_status == FULLY_SIGNED"
          - "effective_from <= logical clock < effective_to"
        side_effects:
          - "live_at := logical clock"
          - "AwardAllocation EXECUTED -> ACTIVE"
          - "Contract.rate_load_status LOADED -> LIVE; BidEvent AWARDED -> LIVE on the event's first live rate"
      - from: LIVE
        to: AT_RISK
        trigger: "system — POST /freight-procurement/rate-records/{id}/tender-events crossed the rejection threshold"
        actor: system
        preconditions:
          - "tender_count >= MIN_TENDER_SAMPLE"
          - "rejection_pct >= AT_RISK_REJECTION_PCT"
        side_effects:
          - "tender-risk cascade link 2: AwardAllocation ACTIVE -> SUSPENDED_ROUTING and Lane AWARDED -> UNDER_REBID"
          - "tender-risk cascade link 3 (caused by link 2): a MiniBid is created with origin SYSTEM, status REQUESTED, trigger_reason TENDER_REJECTION_RATE, window_open_at := logical clock, window_close_at := logical clock + SYSTEM_MINIBID_WINDOW_DAYS"
      - from: AT_RISK
        to: LIVE
        trigger: "system — a later tender append pushed rejection_pct back below the threshold"
        actor: system
        preconditions:
          - "tender_count >= MIN_TENDER_SAMPLE"
          - "rejection_pct < AT_RISK_REJECTION_PCT"
        side_effects:
          - "AwardAllocation SUSPENDED_ROUTING -> ACTIVE and Lane UNDER_REBID -> AWARDED when no other AT_RISK record remains on the lane"
      - from: LIVE
        to: SUPERSEDED
        trigger: "system — POST /freight-procurement/mini-bids/{id}/apply targeted this record"
        actor: system
        preconditions:
          - "the applied MiniBid.rate_record_id == this id"
        side_effects:
          - "superseded_by_rate_record_id := id of the replacement record minted directly in LIVE by the apply transition"
      - from: AT_RISK
        to: SUPERSEDED
        trigger: "system — POST /freight-procurement/mini-bids/{id}/apply targeted this record"
        actor: system
        preconditions:
          - "the applied MiniBid.rate_record_id == this id"
        side_effects:
          - "superseded_by_rate_record_id := id of the replacement record"
      - from: SUPERSEDED
        to: LIVE
        trigger: "system — POST /freight-procurement/mini-bids/{id}/revert"
        actor: system
        preconditions:
          - "this record's superseded_by_rate_record_id points at the reverting mini-bid's applied_rate_record_id"
        side_effects:
          - "superseded_by_rate_record_id := null"
        note: "Closes the cycle LIVE -> SUPERSEDED -> LIVE for a reverted market adjustment."
      - from: LIVE
        to: ROLLED_BACK
        trigger: "system — POST /freight-procurement/mini-bids/{id}/revert on the replacement record"
        actor: system
        preconditions:
          - "this record is the mini-bid's applied_rate_record_id"
        side_effects:
          - "Contract.total_committed_value_usd re-evaluated; the reverted record no longer counts toward it"
        note: "Replacement records created by an applied mini-bid are minted directly in LIVE; STAGED is the initial state only for records created through POST /contracts/{id}/rate-records."

  - entity: MiniBid
    initial_state: REQUESTED
    terminal_states: [DENIED, REVERTED]
    shape: branching
    transitions:
      - from: REQUESTED
        to: OPEN
        trigger: "POST /freight-procurement/mini-bids/{id}/proposal"
        actor: CarrierRep
        preconditions:
          - "MiniBid.status == REQUESTED"
          - "X-User-ID == payload carrier_id"
          - "window_open_at <= logical clock <= window_close_at (closed interval)"
          - "the carrier holds an AwardAllocation on MiniBid.lane_id with status IN {EXECUTED, ACTIVE, SUSPENDED_ROUTING}"
          - "abs(adjustment_pct) <= MINIBID_MAX_ADJUSTMENT_PCT"
        side_effects:
          - "proposed_rate_per_mile, proposed_by_carrier_id and adjustment_pct written per calculations.minibid_market_delta"
      - from: OPEN
        to: APPLIED
        trigger: "POST /freight-procurement/mini-bids/{id}/apply"
        actor: ContractAdmin
        preconditions:
          - "MiniBid.status == OPEN"
          - "target RateRecord.status IN {LIVE, AT_RISK}"
          - "expected_contract_version == Contract.version"
          - "the replacement interval does not overlap any other LOADED, LIVE or AT_RISK record on (lane_id, carrier_id, routing_position) under half-open semantics"
        side_effects:
          - "money cascade link 1: a replacement RateRecord is minted with status LIVE, rate_per_mile := proposed_rate_per_mile, the payload interval, and committed_volume_loads copied from the target; the target record LIVE|AT_RISK -> SUPERSEDED with superseded_by_rate_record_id set; applied_rate_record_id := new record id"
          - "money cascade link 2 (caused by link 1): because the contract's set of live records changed, Contract.status EXECUTED -> AMENDED, amendment_count += 1, calculations.contract_committed_value re-evaluated, Contract.version += 1"
          - "money cascade link 3 (caused by link 2): because the contract value changed, BidEvent.award_cost_usd and savings_pct are recomputed"
          - "contract_value_before_usd and contract_value_after_usd snapshotted around links 2 and 3"
          - "when the lane was UNDER_REBID, its suspended AwardAllocation SUSPENDED_ROUTING -> ACTIVE and Lane UNDER_REBID -> AWARDED"
      - from: REQUESTED
        to: DENIED
        trigger: "POST /freight-procurement/mini-bids/{id}/deny"
        actor: CategoryManager
        preconditions:
          - "MiniBid.status IN {REQUESTED, OPEN}"
        side_effects:
          - "denial_reason := payload value"
      - from: OPEN
        to: DENIED
        trigger: "POST /freight-procurement/mini-bids/{id}/deny"
        actor: CategoryManager
        preconditions:
          - "MiniBid.status == OPEN"
        side_effects:
          - "denial_reason := payload value"
      - from: APPLIED
        to: REVERTED
        trigger: "POST /freight-procurement/mini-bids/{id}/revert"
        actor: ContractAdmin
        preconditions:
          - "MiniBid.status == APPLIED"
          - "the replacement RateRecord (applied_rate_record_id) has status LIVE"
        side_effects:
          - "compensating link 1: replacement RateRecord LIVE -> ROLLED_BACK; the superseded target record SUPERSEDED -> LIVE with superseded_by_rate_record_id := null"
          - "compensating link 2 (caused by link 1): Contract.amendment_count -= 1, calculations.contract_committed_value re-evaluated over the restored record set, Contract.version += 1, Contract.status AMENDED -> EXECUTED when amendment_count returns to 0"
          - "compensating link 3 (caused by link 2): BidEvent.award_cost_usd and savings_pct recomputed"
          - "revert_reason := payload value; reverted_at := logical clock"
        note: "Contract.total_committed_value_usd after revert must equal contract_value_before_usd exactly."

  - entity: Scorecard
    initial_state: DRAFT
    terminal_states: [DISPUTED]
    shape: linear
    transitions:
      - from: DRAFT
        to: PUBLISHED
        trigger: "POST /freight-procurement/scorecards/{id}/publish"
        actor: CategoryManager
        preconditions:
          - "Scorecard.status == DRAFT"
          - "period_end <= logical clock"
        side_effects:
          - "published_at := logical clock"
          - "cascade link 1: Carrier.published_scorecard_count += 1"
          - "cascade link 2 (caused by link 1): because the published count changed, Carrier.composite_score and composite_score_variant are recomputed by calculations.carrier_composite_score, switching to FINAL_PERFORMANCE at published_scorecard_count >= FINAL_VARIANT_MIN_SCORECARDS"
          - "cascade link 3 (caused by link 2): because the composite score changed, Carrier.status QUALIFIED -> WATCHLIST when it fell below WATCHLIST_FLOOR, or WATCHLIST -> QUALIFIED when it reached the floor"
      - from: PUBLISHED
        to: DISPUTED
        trigger: "POST /freight-procurement/scorecards/{id}/dispute"
        actor: CarrierRep
        preconditions:
          - "Scorecard.status == PUBLISHED"
          - "X-User-ID == Scorecard.carrier_id"
        side_effects:
          - "disputed_reason := payload value"
        note: "A DISPUTED scorecard stays inside the FINAL_PERFORMANCE input set; disputing does not re-score the carrier."

# =============================================================================
# §1.2.1 Concurrency Rules — OCC on the parent entity's version only
# =============================================================================
concurrency_rules:
  - rule_id: optimization-run-create-stale-bid-event
    parent_entity: BidEvent
    write_endpoint: "POST /freight-procurement/optimization-runs"
    occ_field: "expected_bid_event_version"
    description: |
      Creating an OptimizationRun against a BidEvent whose version has advanced since
      the client last observed it is rejected with a stale-version error. A new run
      legitimately supersedes every earlier COMPLETED or PUBLISHED run of the event and
      releases the volume its APPROVED allocations held, so a second creation carrying
      an out-of-date view of the event would silently discard scenario state the client
      never saw.
    error_id: ERR_STALE_BID_EVENT_VERSION
    http_status: 412
  - rule_id: mini-bid-apply-stale-contract
    parent_entity: Contract
    write_endpoint: "POST /freight-procurement/mini-bids/{id}/apply"
    occ_field: "expected_contract_version"
    description: |
      Applying a mini-bid amends the Contract's committed value, so the request must
      carry the Contract version the client last observed. When another mini-bid on a
      different lane of the same contract has already been applied, the contract's
      version has advanced and this apply is rejected as stale rather than layering an
      amendment on a committed value the client never read.
    error_id: ERR_STALE_CONTRACT_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules
# =============================================================================
calculations:
  - name: lane_data_quality_flags
    trigger: "on POST /freight-procurement/bid-events/{id}/lanes and on every POST /freight-procurement/lanes/{id}/validate"
    algorithm: projection
    formula: |
      flags := []                                  # emitted in exactly this declared order
      linehaul_reference :=
          null  if incumbent_rate_per_mile is null
          else  round(mileage * incumbent_rate_per_mile, 2)

      # 1. MILEAGE_IMPLAUSIBLE  (blocking)
      if mileage < MIN_LANE_MILES or mileage > MAX_LANE_MILES:
          flags.append("MILEAGE_IMPLAUSIBLE")
      # 2. MISSING_TRAILING_VOLUME  (blocking)
      if trailing_12m_actual_loads is null or trailing_12m_actual_loads == 0:
          flags.append("MISSING_TRAILING_VOLUME")
      # 3. VOLUME_VARIANCE_HIGH  (advisory)
      if trailing_12m_actual_loads is not null and trailing_12m_actual_loads > 0:
          variance_pct := round(abs(annual_volume_loads - trailing_12m_actual_loads)
                                * 100.00 / annual_volume_loads, 2)
          if variance_pct > VOLUME_VARIANCE_TOLERANCE_PCT:
              flags.append("VOLUME_VARIANCE_HIGH")
      # 4. SEASONALITY_EXTREME  (advisory)
      if seasonality_peak_index >= SEASONALITY_EXTREME_INDEX:
          flags.append("SEASONALITY_EXTREME")
      # 5. NO_INCUMBENT_BASELINE  (advisory, excludes the lane from event savings)
      if incumbent_carrier_id is null or incumbent_rate_per_mile is null:
          flags.append("NO_INCUMBENT_BASELINE")
      # 6. ACCESSORIAL_OUTLIER  (advisory)
      if linehaul_reference is not null
         and accessorial_history_usd_per_load
             > round(linehaul_reference * ACCESSORIAL_OUTLIER_RATIO, 2):
          flags.append("ACCESSORIAL_OUTLIER")

      Lane.data_quality_flags := flags
      blocking := flags ∩ {"MILEAGE_IMPLAUSIBLE", "MISSING_TRAILING_VOLUME"}
      # a non-empty blocking set is what POST /lanes/{id}/validate rejects with
      # ERR_LANE_DATA_QUALITY_BLOCKED; advisory flags never block validation
    input_set: |
      Only the Lane row itself. The flag array is recomputed from scratch on every
      validate attempt (never appended to), so a lane whose data was corrected and
      re-validated carries no stale flags. Flag order is the declared order above and
      is part of the observable contract — implementations must not sort or dedupe.
    constants:
      MIN_LANE_MILES: 25
      MAX_LANE_MILES: 3200
      VOLUME_VARIANCE_TOLERANCE_PCT: 25.00
      SEASONALITY_EXTREME_INDEX: 1.50
      ACCESSORIAL_OUTLIER_RATIO: 0.10
    precision: "variance_pct at 2 decimal places, round_half_up; comparisons use the rounded value"

  - name: lane_baseline_cost
    trigger: "on POST /freight-procurement/lanes/{id}/validate, and again on POST /freight-procurement/bid-events/{id}/lock-lanes"
    algorithm: aggregation
    formula: |
      if incumbent_rate_per_mile is null:
          Lane.baseline_cost_usd := 0.00        # lane excluded from event savings
      else:
          baseline_linehaul_per_load := round(mileage * incumbent_rate_per_mile, 2)
          baseline_cost_per_load    := round(baseline_linehaul_per_load
                                             + accessorial_history_usd_per_load, 2)
          Lane.baseline_cost_usd    := round(baseline_cost_per_load
                                             * annual_volume_loads, 2)
    input_set: |
      The lane's own incumbent rate, mileage, accessorial history and annual volume.
      The incumbent rate is used exactly as recorded and is never inflated — the
      baseline is a historical figure, so BidEvent.accessorial_inflation_factor and
      LANE_FORECAST_GROWTH_FACTOR never touch it.
    constants: {}
    precision: "2 decimal places, round_half_up, applied at each of the three steps in the order written"

  - name: lane_evaluated_cost
    trigger: "on POST /freight-procurement/bid-rounds/{id}/lane-bids and re-evaluated on POST /freight-procurement/bid-rounds/{id}/close"
    algorithm: forward_looking
    formula: |
      event  := BidEvent of the bid round
      lane   := Lane of the bid
      basis  := event.cost_basis            # FORECAST | HISTORICAL -> selects the variant

      # --- step 1: effective per-mile rate -------------------------------------
      effective_rate_per_mile :=
          rate_per_mile                                if fuel_surcharge_included is true
          else round(rate_per_mile + event.fuel_index_per_mile, 4)

      # --- step 2: linehaul, ROUNDED BEFORE anything is added to it ------------
      LaneBid.linehaul_per_load_usd := round(lane.mileage * effective_rate_per_mile, 2)

      # --- step 3: accessorial, ROUNDED INDEPENDENTLY -------------------------
      LaneBid.accessorial_per_load_usd :=
          round(lane.accessorial_history_usd_per_load
                * event.accessorial_inflation_factor, 2)     # FORECAST variant
          |  lane.accessorial_history_usd_per_load           # HISTORICAL variant, no factor

      # --- step 4: cost per load = sum of two ALREADY-ROUNDED terms -----------
      LaneBid.cost_per_load_usd := LaneBid.linehaul_per_load_usd
                                 + LaneBid.accessorial_per_load_usd
      # The two roundings above are pinned: rounding the sum of the two unrounded
      # products instead ("round-once-at-the-end") is a DIFFERENT and WRONG result.

      # --- step 5: volume basis (variant-dependent) ---------------------------
      volume_basis :=
          round(lane.annual_volume_loads * LANE_FORECAST_GROWTH_FACTOR)   # FORECAST
          |  lane.trailing_12m_actual_loads                               # HISTORICAL
      LaneBid.awardable_volume_loads := min(committed_volume_loads, volume_basis)

      # --- step 6: evaluated total -------------------------------------------
      LaneBid.evaluated_total_cost_usd := round(LaneBid.cost_per_load_usd
                                                * LaneBid.awardable_volume_loads, 2)
      LaneBid.evaluated_basis := basis
    input_set: |
      One LaneBid plus its Lane and BidEvent. awardable_volume_loads may legitimately
      exceed lane.annual_volume_loads under FORECAST when the carrier over-commits;
      that is intentional — evaluation prices the capacity the carrier is willing to
      commit, capped by the forecast basis, while allocation is separately capped by
      the lane's real annual volume in award_allocation_waterfall.
    constants:
      LANE_FORECAST_GROWTH_FACTOR: 1.20
    precision: |
      effective_rate_per_mile at 4 decimal places, money at 2 decimal places, both
      round_half_up; volume_basis rounded to the nearest whole load, round_half_up.
      The rounding *order* in steps 2-4 is normative, not incidental.
    variants:
      - name: FORECAST
        when: "BidEvent.cost_basis == FORECAST (the default cost basis)"
        difference: |
          Volume basis is round(annual_volume_loads * 1.20) and the accessorial term is
          inflated by BidEvent.accessorial_inflation_factor.
      - name: HISTORICAL
        when: "BidEvent.cost_basis == HISTORICAL"
        difference: |
          Volume basis is trailing_12m_actual_loads as recorded and the accessorial term
          is used uninflated. On identical bid data the two variants produce different
          cost_per_load_usd, different awardable_volume_loads and therefore a different
          evaluated_total_cost_usd, a different cost_rank_score and potentially a
          different rank_in_lane.

  - name: capability_screening_score
    trigger: "on POST /freight-procurement/qualification-reviews/{id}/capability-screening"
    algorithm: weighted_scoring
    formula: |
      required := QualificationReview.required_modes
      matched  := count of modes in required that also appear in Carrier.service_modes
      mode_coverage_pct := round(matched * 100.00 / count(required), 2)

      fleet_score := min(100.00,
                         round(Carrier.fleet_power_units * 100.00
                               / FLEET_TARGET_UNITS, 2))

      auto_ratio  := min(1.0000, round(Carrier.auto_liability_limit_usd
                                       / QualificationReview.min_auto_liability_usd, 4))
      cargo_ratio := min(1.0000, round(Carrier.cargo_limit_usd
                                       / QualificationReview.min_cargo_usd, 4))
      insurance_component := round(50.00 * auto_ratio + 50.00 * cargo_ratio, 2)

      score := round(MODE_WEIGHT      * mode_coverage_pct
                   + FLEET_WEIGHT     * fleet_score
                   + INSURANCE_WEIGHT * insurance_component, 2)

      QualificationReview.capability_score := score
      Carrier.capability_score             := score
      QualificationReview.capability_result :=
          PASS if score >= CAPABILITY_PASS_FLOOR else FAIL
    input_set: |
      The Carrier row and the review's own declared minimums. Insurance *limits* feed
      this score, but insurance *expiry* does not — expiry is handled by the separate
      insurance-verification branch of the review fork.
    constants:
      FLEET_TARGET_UNITS: 200
      MODE_WEIGHT: 0.40
      FLEET_WEIGHT: 0.30
      INSURANCE_WEIGHT: 0.30
      CAPABILITY_PASS_FLOOR: 70.00
      MAX_REMEDIATIONS: 2
    precision: "ratios at 4 decimal places, scores at 2 decimal places, round_half_up"

  - name: scorecard_period_score
    trigger: "on POST /freight-procurement/carriers/{id}/scorecards and again on POST /freight-procurement/scorecards/{id}/publish"
    algorithm: weighted_scoring
    formula: |
      period_tenders := TenderEvent rows whose RateRecord.carrier_id == Scorecard.carrier_id
                        and period_start <= tendered_at < period_end   # half-open
      Scorecard.period_tender_count := count(period_tenders)
      Scorecard.tender_acceptance_pct :=
          NO_TENDER_ACCEPTANCE_DEFAULT_PCT                       if period_tender_count == 0
          else round(count(period_tenders where outcome == ACCEPTED) * 100.00
                     / period_tender_count, 2)

      claims_subscore := max(0.00, round(100.00
                             - claims_ratio * CLAIMS_PENALTY_MULTIPLIER, 2))

      Scorecard.composite_score := round(
            SCORECARD_ON_TIME_WEIGHT    * on_time_pct
          + SCORECARD_ACCEPTANCE_WEIGHT * tender_acceptance_pct
          + SCORECARD_CLAIMS_WEIGHT     * claims_subscore, 2)
    input_set: |
      TenderEvents in the half-open window [period_start, period_end) across every
      RateRecord of the carrier, regardless of the record's current status — a
      SUPERSEDED or ROLLED_BACK record's historical tenders still count, because they
      really happened. A carrier with no tenders in the period scores the neutral
      default rather than 0.00.
    constants:
      NO_TENDER_ACCEPTANCE_DEFAULT_PCT: 100.00
      CLAIMS_PENALTY_MULTIPLIER: 1000
      SCORECARD_ON_TIME_WEIGHT: 0.45
      SCORECARD_ACCEPTANCE_WEIGHT: 0.35
      SCORECARD_CLAIMS_WEIGHT: 0.20
    precision: "2 decimal places, round_half_up"

  - name: carrier_composite_score
    trigger: |
      on POST /freight-procurement/qualification-reviews/{id}/decision, on
      POST /freight-procurement/scorecards/{id}/publish, and on every
      POST /freight-procurement/carriers/{id}/status-change
    algorithm: weighted_scoring
    formula: |
      scorecards := Scorecard rows of the carrier with status IN {PUBLISHED, DISPUTED},
                    ordered by period_end DESC, then created_at ASC,
                    truncated to the first SCORECARD_LOOKBACK_COUNT rows
      Carrier.published_scorecard_count := count(scorecards)

      variant := FINAL_PERFORMANCE   if published_scorecard_count >= FINAL_VARIANT_MIN_SCORECARDS
                 else PROVISIONAL_SCREENING

      if variant == PROVISIONAL_SCREENING:
          performance_component := PROVISIONAL_PERFORMANCE_BASELINE
      else:
          weights := RECENCY_WEIGHTS truncated to count(scorecards)
          weight_sum := sum(weights)
          performance_component := round(
              Σ_i (scorecards[i].composite_score * weights[i]) / weight_sum, 2)

      insurance_component :=
          INSURANCE_FULL_SCORE   if Carrier.insurance_expiry_date
                                    >= logical clock + INSURANCE_HEADROOM_DAYS days
          else INSURANCE_THIN_SCORE

      Carrier.composite_score := round(
            PERFORMANCE_WEIGHT * performance_component
          + CAPABILITY_WEIGHT  * Carrier.capability_score
          + INSURANCE_WEIGHT   * insurance_component, 2)
      Carrier.composite_score_variant := variant
    input_set: |
      Only PUBLISHED and DISPUTED scorecards enter the input set — a DRAFT scorecard is
      invisible here, and disputing a published scorecard does NOT remove it (a dispute
      is an assertion, not a correction). At most SCORECARD_LOOKBACK_COUNT scorecards
      participate; when fewer exist the recency weights are truncated and renormalised
      by their own sum, so a single scorecard carries weight 1.0000.
    constants:
      FINAL_VARIANT_MIN_SCORECARDS: 1
      SCORECARD_LOOKBACK_COUNT: 3
      RECENCY_WEIGHTS: [0.50, 0.30, 0.20]
      PROVISIONAL_PERFORMANCE_BASELINE: 90.00
      PERFORMANCE_WEIGHT: 0.70
      CAPABILITY_WEIGHT: 0.20
      INSURANCE_WEIGHT: 0.10
      INSURANCE_HEADROOM_DAYS: 90
      INSURANCE_FULL_SCORE: 100.00
      INSURANCE_THIN_SCORE: 60.00
      WATCHLIST_FLOOR: 75.00
    precision: |
      performance_component rounded to 2 decimal places BEFORE it is weighted into the
      composite (pinned intermediate rounding), composite at 2 decimal places, both
      round_half_up.
    variants:
      - name: PROVISIONAL_SCREENING
        when: "the carrier has no PUBLISHED or DISPUTED scorecard yet (published_scorecard_count == 0)"
        difference: |
          performance_component is the flat PROVISIONAL_PERFORMANCE_BASELINE instead of
          the recency-weighted scorecard blend, so the score reflects only screening
          evidence. This is the value Invitation.qualification_snapshot_score captures.
      - name: FINAL_PERFORMANCE
        when: "published_scorecard_count >= FINAL_VARIANT_MIN_SCORECARDS"
        difference: |
          performance_component is the recency-weighted blend of up to three scorecards.
          On identical capability and insurance data the two variants produce different
          composite scores, and the switch can drop the carrier below WATCHLIST_FLOOR,
          moving Carrier.status QUALIFIED -> WATCHLIST as a cascade of publication.

  - name: bid_cost_rank_score
    trigger: "on POST /freight-procurement/bid-rounds/{id}/lane-bids and re-evaluated on POST /freight-procurement/bid-rounds/{id}/close"
    algorithm: weighted_scoring
    formula: |
      service_credit_pct := min(SERVICE_CREDIT_CAP,
                                max(0.0000,
                                    round((Carrier.composite_score - SERVICE_CREDIT_BASE)
                                          / SERVICE_CREDIT_DIVISOR, 4)))
      LaneBid.cost_rank_score := round(LaneBid.evaluated_total_cost_usd
                                       * (1 - service_credit_pct), 2)

      # rank_in_lane: 1 = best. Ordering over the lane's bids with status
      # IN {SUBMITTED, SHORTLISTED} in the round being evaluated:
      #   1. cost_rank_score ASC          (lower evaluated cost wins)
      #   2. transit_days_offered ASC     (faster wins)
      #   3. is_incumbent DESC            (incumbent wins ties against a challenger)
      #   4. created_at ASC               (earliest submission wins — final tie-break)
      # LaneBid.id is NEVER a ranking input.
    input_set: |
      The bid's own evaluated total plus the bidding carrier's current composite score.
      The credit is clamped on both sides: a carrier at or below SERVICE_CREDIT_BASE
      earns nothing, and a carrier far above it earns exactly SERVICE_CREDIT_CAP.
      Withdrawn bids are removed from the ranking and the surviving bids are renumbered.
    constants:
      SERVICE_CREDIT_BASE: 80.00
      SERVICE_CREDIT_DIVISOR: 200
      SERVICE_CREDIT_CAP: 0.0500
    precision: "service_credit_pct at 4 decimal places, money at 2 decimal places, round_half_up"

  - name: optimization_objective_score
    trigger: "on POST /freight-procurement/optimization-runs"
    algorithm: constraint_propagation
    formula: |
      event   := BidEvent
      lanes   := Lane rows of the event with status IN {LOCKED, AWARDED, UNDER_REBID}
      picks   := award_allocation_waterfall output for every lane in lanes

      OptimizationRun.total_cost_usd := round(Σ picks.allocated_cost_usd, 2)
      OptimizationRun.coverage_pct   := round(Σ picks.allocated_volume_loads * 100.00
                                              / Σ lanes.annual_volume_loads, 2)
      OptimizationRun.diversity_pct  :=
          0.00 if Σ picks.allocated_volume_loads == 0
          else round(Σ picks.allocated_volume_loads
                       where Carrier.diversity_classification != NONE
                     * 100.00 / Σ picks.allocated_volume_loads, 2)

      # RATIO OF SUMS, never the mean of per-lane ratios — the two disagree whenever
      # lane volumes differ, and the ratio of sums is normative.
      baseline_lanes := lanes where baseline_cost_usd > 0.00
      cost_ratio := 1.000000 if Σ baseline_lanes.baseline_cost_usd == 0.00
                    else round(Σ (picks.allocated_cost_usd of picks on baseline_lanes)
                               / Σ baseline_lanes.baseline_cost_usd, 6)

      service_ratio := 0.000000 if Σ picks.allocated_volume_loads == 0
                       else round(Σ (picks.allocated_volume_loads
                                     * Carrier.composite_score / 100.00)
                                  / Σ picks.allocated_volume_loads, 6)

      OptimizationRun.objective_score := round(100.00 * (
            event.cost_weight     * (1.000000 - cost_ratio)
          + event.service_weight  * service_ratio
          + event.capacity_weight * round(OptimizationRun.coverage_pct / 100.00, 6)
          + event.diversity_weight * round(OptimizationRun.diversity_pct / 100.00, 6)
      ), 2)

      OptimizationRun.infeasible_lane_ids :=
          ids of lanes that produced no PRIMARY pick, ordered by Lane.created_at ASC
      OptimizationRun.proposed_primary_count := count(picks where routing_position == PRIMARY)
      OptimizationRun.proposed_backup_count  := count(picks where routing_position != PRIMARY)
      if infeasible_lane_ids covers every lane in lanes:
          status := FAILED, coverage_pct := 0.00, total_cost_usd := 0.00,
          objective_score := 0.00
    input_set: |
      Every in-scope lane of the event, including lanes with no eligible bid — those
      contribute their annual volume to the coverage denominator and their id to
      infeasible_lane_ids, which is exactly why an event with one unbiddable lane
      cannot reach 100.00 coverage. Lanes excluded from the savings baseline
      (NO_INCUMBENT_BASELINE) still count for coverage and diversity.
    constants: {}
    precision: |
      ratios at 6 decimal places, percentages and the objective score at 2 decimal
      places, money at 2 decimal places, all round_half_up.

  - name: award_allocation_waterfall
    trigger: |
      on POST /freight-procurement/optimization-runs (selection + metrics), materialised
      on POST /freight-procurement/optimization-runs/{id}/routing-guide, and re-derived
      on POST /freight-procurement/award-allocations/{id}/reject
    algorithm: waterfall_allocation
    formula: |
      for each in-scope lane, in Lane.created_at ASC order:
        eligible := LaneBid rows on this lane from the event's most recent CLOSED round
                    with status IN {SUBMITTED, SHORTLISTED} where ALL hold:
                      - the carrier's Invitation for this event is ACCEPTED
                      - Carrier.status IN {QUALIFIED, CONDITIONALLY_QUALIFIED, WATCHLIST}
                      - Carrier.insurance_expiry_date > logical clock
                      - transit_days_offered <= lane.service_days_required
                      - rate_per_mile >= event.rate_floor_per_mile
        order eligible by the bid_cost_rank_score ordering (cost_rank_score ASC,
              transit_days_offered ASC, is_incumbent DESC, created_at ASC)

        remaining := lane.annual_volume_loads
        share_cap := floor(lane.annual_volume_loads * event.max_award_share_pct / 100.00)
        positions := [PRIMARY, BACKUP_1, BACKUP_2]
        seat      := 0
        for bid in order:
            if seat >= min(run.max_carriers_per_lane, MAX_ROUTING_POSITIONS): break
            if remaining == 0: break
            grant := min(remaining, bid.committed_volume_loads, share_cap)
            if grant == 0: continue        # a zero grant consumes no seat
            emit pick(lane, bid, routing_position := positions[seat],
                      allocated_volume_loads := grant,
                      allocated_pct  := round(grant * 100.00
                                              / lane.annual_volume_loads, 2),
                      allocated_cost_usd := round(bid.cost_per_load_usd * grant, 2))
            remaining := remaining - grant
            seat := seat + 1
        # `remaining` is loop-local only. The waterfall NEVER writes
        # lane.unallocated_volume_loads or lane.awarded_coverage_pct: a PROPOSED
        # allocation reserves nothing. Both lane fields move only when an
        # allocation is approved (debit), rejected/superseded (credit) or
        # promoted (delta), per the conservation invariant below.

      # Volume conservation invariant (must hold after EVERY allocation write):
      #   Lane.unallocated_volume_loads
      # + Σ allocated_volume_loads over allocations of this lane with status
      #   IN {APPROVED, EXECUTED, ACTIVE, SUSPENDED_ROUTING}
      # = Lane.annual_volume_loads
      # PROPOSED allocations reserve nothing; the debit is taken at approval and
      # credited back exactly at rejection or supersession. When a promotion changes
      # the allocated volume of an allocation that already holds a debit, the delta is
      # applied to Lane.unallocated_volume_loads in the same request.
    input_set: |
      Bids of the event's most recent CLOSED round only — bids from earlier rounds are
      historical and never re-enter the waterfall, which is what makes a second
      negotiation round able to change the whole routing guide. Eligibility is evaluated
      against carrier state at run time, so a carrier suspended after bidding silently
      drops out of a re-run.
    constants:
      MAX_ROUTING_POSITIONS: 3
    precision: |
      grants are whole loads; share_cap uses floor (never round) so the cap can never be
      exceeded by rounding; percentages at 2 decimal places, round_half_up.

  - name: contract_committed_value
    trigger: |
      on the award cascade that creates the Contract, on
      POST /freight-procurement/contracts/{id}/rate-records, and on
      POST /freight-procurement/mini-bids/{id}/apply and /revert
    algorithm: tiered_pricing
    formula: |
      # --- step 1: base, summed over the contract's live rate basis --------------
      records := RateRecord rows of this contract with status IN {STAGED, LOADED, LIVE, AT_RISK}
      for each record: record.committed_value_usd :=
            round(round(Lane.mileage * effective_rate_per_mile(record), 2)
                  * record.committed_volume_loads, 2)
      base := round(Σ records.committed_value_usd, 2)
      Contract.base_committed_value_usd := base

      # --- step 2: volume discount, TIER KEYED ON base --------------------------
      Contract.volume_discount_pct := VOLUME_DISCOUNT_TIERS applied to base
      Contract.volume_discount_usd := round(base * volume_discount_pct, 2)
      subtotal := round(base - volume_discount_usd, 2)

      # --- step 3: accessorial allowance, TIER KEYED ON subtotal ----------------
      # NOT on base. The allowance tier and the allowance amount both read the
      # POST-DISCOUNT subtotal; keying either of them on base is a different and
      # wrong result even when both tiers happen to land in the same bracket.
      Contract.accessorial_allowance_pct := ALLOWANCE_TIERS applied to subtotal
      Contract.accessorial_allowance_usd := round(subtotal
                                                  * accessorial_allowance_pct, 2)

      # --- step 4: total --------------------------------------------------------
      Contract.total_committed_value_usd := round(subtotal
                                                  + accessorial_allowance_usd, 2)
    input_set: |
      Only rate records that are still part of the contract's rate basis. A SUPERSEDED
      record (replaced by an applied mini-bid) and a ROLLED_BACK record (a reverted
      replacement) are both excluded, which is what makes apply-then-revert return the
      total to its exact pre-amendment value.
    constants:
      VOLUME_DISCOUNT_TIERS: "base < 500000 -> 0.000; 500000 <= base < 1500000 -> 0.015; base >= 1500000 -> 0.025"
      ALLOWANCE_TIERS: "subtotal < 400000 -> 0.000; 400000 <= subtotal < 1200000 -> 0.010; subtotal >= 1200000 -> 0.020"
    precision: |
      2 decimal places, round_half_up, applied at every step in the order written; tier
      boundaries are inclusive on the lower edge (>=) and exclusive on the upper (<).

  - name: tender_acceptance_metrics
    trigger: "on POST /freight-procurement/rate-records/{id}/tender-events"
    algorithm: threshold
    formula: |
      RateRecord.tender_count    := count of TenderEvent rows of this record
      RateRecord.rejection_count := count where outcome == REJECTED
      RateRecord.rejection_pct   := 0.00 if tender_count == 0
                                    else round(rejection_count * 100.00
                                               / tender_count, 2)
      RateRecord.acceptance_pct  := round(100.00 - rejection_pct, 2)

      at_risk := tender_count >= MIN_TENDER_SAMPLE
                 and rejection_pct >= AT_RISK_REJECTION_PCT
      if at_risk and status == LIVE:      status -> AT_RISK   (tender-risk cascade)
      if not at_risk and status == AT_RISK
         and tender_count >= MIN_TENDER_SAMPLE:  status -> LIVE
    input_set: |
      Every TenderEvent of the record, including events recorded while the record was
      AT_RISK. The sample gate and the percentage gate are independent: a record with 4
      tenders and 4 rejections (100.00%) is NOT at risk because the sample is too small,
      while 5 tenders with exactly 1 rejection (20.00%) IS at risk.
    constants:
      MIN_TENDER_SAMPLE: 5
      AT_RISK_REJECTION_PCT: 20.00
      SYSTEM_MINIBID_WINDOW_DAYS: 10
    precision: "2 decimal places, round_half_up; the rounded rejection_pct is what the threshold compares"

  - name: bid_event_savings
    trigger: |
      on POST /freight-procurement/bid-events/{id}/lock-lanes, on
      POST /freight-procurement/bid-events/{id}/award, and on
      POST /freight-procurement/mini-bids/{id}/apply and /revert
    algorithm: aggregation
    formula: |
      lanes := Lane rows of the event with status IN {VALIDATED, LOCKED, AWARDED, UNDER_REBID}
      BidEvent.total_scope_volume_loads := Σ lanes.annual_volume_loads
      BidEvent.baseline_cost_usd := round(Σ lanes.baseline_cost_usd
                                          where "NO_INCUMBENT_BASELINE" not in
                                                lane.data_quality_flags, 2)

      contracts := Contract rows of the event with status IN {DRAFT, EXECUTED, AMENDED}
      BidEvent.award_cost_usd :=
          0.00 if contracts is empty
          else round(Σ contracts.total_committed_value_usd, 2)

      BidEvent.savings_pct :=
          0.00 if baseline_cost_usd == 0.00 or award_cost_usd == 0.00
          else round((baseline_cost_usd - award_cost_usd) * 100.00
                     / baseline_cost_usd, 2)

      allocations := AwardAllocation rows of the event with status
                     IN {APPROVED, EXECUTED, ACTIVE, SUSPENDED_ROUTING}
      BidEvent.coverage_pct := 0.00 if total_scope_volume_loads == 0
                               else round(Σ allocations.allocated_volume_loads * 100.00
                                          / total_scope_volume_loads, 2)
      BidEvent.diversity_pct := 0.00 if Σ allocations.allocated_volume_loads == 0
                                else round(Σ allocations.allocated_volume_loads
                                             where Carrier.diversity_classification != NONE
                                           * 100.00
                                           / Σ allocations.allocated_volume_loads, 2)
    input_set: |
      savings_pct is deliberately asymmetric: lanes without an incumbent baseline are
      excluded from the denominator but their awarded contract value still lands in
      award_cost_usd, so a bid event made entirely of new lanes reports 0.00 savings
      rather than a meaningless negative number. savings_pct may be negative when the
      awarded value exceeds the baseline — that is a real (and reportable) outcome, not
      an error.
    constants: {}
    precision: "2 decimal places, round_half_up"

  - name: minibid_market_delta
    trigger: "on POST /freight-procurement/mini-bids/{id}/proposal and re-checked on POST /freight-procurement/mini-bids/{id}/apply"
    algorithm: threshold
    formula: |
      current := RateRecord.rate_per_mile of MiniBid.rate_record_id
      MiniBid.adjustment_pct := round((proposed_rate_per_mile - current) * 100.00
                                      / current, 2)
      if abs(MiniBid.adjustment_pct) > MINIBID_MAX_ADJUSTMENT_PCT:
          reject with ERR_ADJUSTMENT_EXCEEDS_CAP
      if proposed_rate_per_mile < BidEvent.rate_floor_per_mile:
          reject with ERR_RATE_BELOW_FLOOR
    input_set: |
      The targeted rate record's current per-mile rate as stored, never the original
      awarded bid rate — a second mini-bid on a lane measures its adjustment against
      the rate the first mini-bid installed, so two 10.00% increases are both legal
      while one 20.00% increase is not.
    constants:
      MINIBID_MAX_ADJUSTMENT_PCT: 12.00
      MINIBID_COOLDOWN_DAYS: 7
      MINIBID_QUOTA_PER_LANE: 2
      MINIBID_QUOTA_WINDOW_DAYS: 90
    precision: "adjustment_pct at 2 decimal places, round_half_up; the rounded value is what the cap compares"

# =============================================================================
# §1.4 Validation Rules — evaluated strictly in ascending priority order.
# The FIRST violated rule decides the response; no later rule is evaluated.
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are both present and X-User-Role is one of the five declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all endpoints except POST /_clock/set_current_utc"

  - priority: 2
    category: auth
    check: "the acting role appears in the endpoint's roles list"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all endpoints"

  - priority: 3
    category: existence
    check: |
      every id in the request path exists, validated left-to-right — the parent segment
      before the child segment. Each entity has its own error:
      Carrier -> ERR_CARRIER_NOT_FOUND, QualificationReview -> ERR_QUALIFICATION_REVIEW_NOT_FOUND,
      BidEvent -> ERR_BID_EVENT_NOT_FOUND, Lane -> ERR_LANE_NOT_FOUND,
      BidRound -> ERR_BID_ROUND_NOT_FOUND, Invitation -> ERR_INVITATION_NOT_FOUND,
      LaneBid -> ERR_LANE_BID_NOT_FOUND, OptimizationRun -> ERR_OPTIMIZATION_RUN_NOT_FOUND,
      AwardAllocation -> ERR_AWARD_ALLOCATION_NOT_FOUND, Contract -> ERR_CONTRACT_NOT_FOUND,
      RateRecord -> ERR_RATE_RECORD_NOT_FOUND, MiniBid -> ERR_MINI_BID_NOT_FOUND,
      Scorecard -> ERR_SCORECARD_NOT_FOUND
    error_id: ERR_BID_EVENT_NOT_FOUND
    http_status: 404
    applies_to: "every endpoint with a path parameter"

  - priority: 4
    category: existence
    check: |
      request body shape: every field with source input and no default is present, every
      value matches its declared type, every enum value is a declared member, integers
      are non-negative where volumes/counts are meant, money and rate values are
      non-negative, and effective_from < effective_to / period_start < period_end /
      window_open_at < window_close_at wherever an interval is supplied
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all POST endpoints"

  - priority: 5
    category: existence
    check: "every foreign key supplied in the request BODY resolves to an existing row, in declared field order; each raises that entity's NOT_FOUND error"
    error_id: ERR_CARRIER_NOT_FOUND
    http_status: 404
    applies_to: "POST /bid-events/{id}/lanes, POST /bid-events/{id}/invitations, POST /bid-rounds/{id}/lane-bids, POST /optimization-runs, POST /contracts/{id}/rate-records, POST /mini-bids, POST /carriers/{id}/scorecards"

  - priority: 6
    category: auth
    check: |
      when the acting role is CarrierRep, X-User-ID must equal the Carrier id that owns
      the targeted resource: LaneBid.carrier_id on withdraw, Invitation.carrier_id on
      response, Contract.carrier_id on carrier-signature, Scorecard.carrier_id on
      dispute, and the payload carrier_id on a mini-bid proposal
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "POST /lane-bids/{id}/withdraw, POST /invitations/{id}/response, POST /contracts/{id}/carrier-signature, POST /scorecards/{id}/dispute, POST /mini-bids/{id}/proposal, POST /bid-rounds/{id}/lane-bids"

  - priority: 7
    category: auth
    check: |
      segregation of duties — the acting X-User-ID must not appear as
      approved_by_user_id on ANY AwardAllocation whose (bid_event_id, carrier_id) matches
      this Contract. The operator who approved the award may never countersign it for
      the shipper.
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /contracts/{id}/shipper-signature"

  - priority: 8
    category: state
    check: "the supplied expected_<parent>_version equals the parent's current version (§1.2.1); ERR_STALE_BID_EVENT_VERSION on optimization-run creation, ERR_STALE_CONTRACT_VERSION on mini-bid apply"
    error_id: ERR_STALE_BID_EVENT_VERSION
    http_status: 412
    applies_to: "POST /optimization-runs, POST /mini-bids/{id}/apply"

  - priority: 9
    category: state
    check: |
      the target resource and its governing parents are in a state that permits the
      operation, per §1.2. Mapping:
      lane not VALIDATED when locking -> ERR_LANE_NOT_VALIDATED;
      lanes not LOCKED when inviting or opening round 1 -> ERR_LANES_NOT_LOCKED;
      bid round not OPEN on bid submit/withdraw -> ERR_ROUND_NOT_OPEN;
      an OPEN round still exists when closing the event's bidding or creating a run -> ERR_ROUND_STILL_OPEN;
      event not OPTIMIZING when publishing a routing guide -> ERR_EVENT_NOT_OPTIMIZING;
      allocation not PROPOSED on approve -> ERR_ALLOCATION_NOT_PROPOSED;
      contract not FULLY_SIGNED on go-live -> ERR_CONTRACT_NOT_FULLY_SIGNED;
      rate record not STAGED on load -> ERR_RATE_RECORD_NOT_LOADED;
      rate record not LOADED on go-live, or not LIVE/AT_RISK on tender append or apply -> ERR_RATE_RECORD_NOT_LIVE;
      mini-bid not REQUESTED/OPEN on proposal or apply -> ERR_MINI_BID_NOT_OPEN;
      mini-bid not APPLIED on revert -> ERR_MINI_BID_NOT_APPLIED;
      review not SCREENED on decision -> ERR_REVIEW_NOT_SCREENED;
      scorecard already PUBLISHED on publish -> ERR_SCORECARD_ALREADY_PUBLISHED;
      scorecard not PUBLISHED on dispute -> ERR_SCORECARD_NOT_PUBLISHED;
      a carrier status-change whose (current status -> to_status) pair is not a
      declared §1.2 Carrier transition, including every attempt to leave the
      terminal DISQUALIFIED state -> ERR_CARRIER_NOT_QUALIFIED
    error_id: ERR_ROUND_NOT_OPEN
    http_status: 409
    applies_to: "every state-transition endpoint"

  - priority: 10
    category: business_safety
    check: |
      the carrier is fit to be bound: Carrier.status is not SUSPENDED or DISQUALIFIED
      (ERR_CARRIER_SUSPENDED), Carrier.insurance_expiry_date > logical clock
      (ERR_CARRIER_INSURANCE_EXPIRED), and Carrier.status is QUALIFIED,
      CONDITIONALLY_QUALIFIED or WATCHLIST where the operation requires standing
      (ERR_CARRIER_NOT_QUALIFIED)
    error_id: ERR_CARRIER_SUSPENDED
    http_status: 409
    applies_to: "POST /bid-events/{id}/invitations, POST /bid-rounds/{id}/lane-bids, POST /award-allocations/{id}/approve, POST /rate-records/{id}/load, POST /rate-records/{id}/go-live, POST /mini-bids/{id}/proposal"

  - priority: 11
    category: business_safety
    check: "the lane carries no blocking data-quality flag (MILEAGE_IMPLAUSIBLE or MISSING_TRAILING_VOLUME) when it is validated or locked"
    error_id: ERR_LANE_DATA_QUALITY_BLOCKED
    http_status: 409
    applies_to: "POST /lanes/{id}/validate, POST /bid-events/{id}/lock-lanes"

  - priority: 12
    category: business_referential
    check: |
      the acting carrier stands in the required relationship to the event: an Invitation
      for (bid_event_id, carrier_id) exists (ERR_CARRIER_NOT_INVITED) and its status is
      ACCEPTED (ERR_INVITATION_NOT_ACCEPTED)
    error_id: ERR_CARRIER_NOT_INVITED
    http_status: 409
    applies_to: "POST /bid-rounds/{id}/lane-bids"

  - priority: 13
    category: business_constraint
    check: |
      uniqueness: Carrier.scac_code is unique system-wide (ERR_DUPLICATE_SCAC);
      Lane.lane_code is unique within its bid event (ERR_DUPLICATE_LANE_CODE);
      at most one non-REVOKED Invitation per (bid_event_id, carrier_id) (ERR_DUPLICATE_INVITATION);
      at most one non-WITHDRAWN LaneBid per (bid_round_id, lane_id, carrier_id) (ERR_DUPLICATE_LANE_BID);
      TenderEvent.load_reference is unique within its rate record (ERR_DUPLICATE_LOAD_REFERENCE)
    error_id: ERR_DUPLICATE_LANE_BID
    http_status: 409
    applies_to: "POST /carriers, POST /bid-events/{id}/lanes, POST /bid-events/{id}/invitations, POST /bid-rounds/{id}/lane-bids, POST /rate-records/{id}/tender-events"

  - priority: 14
    category: business_temporal
    check: |
      time-window integrity:
      no two RateRecords with status IN {LOADED, LIVE, AT_RISK} on the same
      (lane_id, carrier_id, routing_position) may have overlapping half-open intervals
      [effective_from, effective_to) — touching endpoints are adjacent, not overlapping
      (ERR_RATE_INTERVAL_OVERLAP);
      go-live requires effective_from <= logical clock < effective_to
      (ERR_RATE_NOT_IN_EFFECTIVE_WINDOW);
      a new MiniBid's closed window [window_open_at, window_close_at] may not intersect
      the window of another MiniBid on the same lane with status IN {REQUESTED, OPEN,
      APPLIED} (ERR_MINI_BID_WINDOW_CONFLICT);
      and window_open_at must be at least MINIBID_COOLDOWN_DAYS after the applied_at of
      the lane's most recently APPLIED mini-bid (ERR_MINI_BID_COOLDOWN_ACTIVE)
    error_id: ERR_RATE_INTERVAL_OVERLAP
    http_status: 409
    applies_to: "POST /rate-records/{id}/load, POST /rate-records/{id}/go-live, POST /mini-bids, POST /mini-bids/{id}/apply"

  - priority: 15
    category: business_constraint
    check: |
      structural constraints:
      the bid's lane belongs to the round's bid event (ERR_LANE_NOT_IN_EVENT_SCOPE);
      transit_days_offered <= Lane.service_days_required (ERR_TRANSIT_DAYS_EXCEEDED);
      an invitation with nda_required true cannot be accepted with nda_signed false
      (ERR_NDA_NOT_SIGNED);
      a new bid round would not exceed BidEvent.rounds_allowed (ERR_ROUND_LIMIT_EXCEEDED);
      a qualification review cannot enter remediation more than MAX_REMEDIATIONS times
      (ERR_REMEDIATION_LIMIT_EXCEEDED)
    error_id: ERR_LANE_NOT_IN_EVENT_SCOPE
    http_status: 409
    applies_to: "POST /bid-rounds/{id}/lane-bids, POST /invitations/{id}/response, POST /bid-events/{id}/bid-rounds, POST /qualification-reviews/{id}/decision"

  - priority: 16
    category: business_constraint
    check: "aggregate quota — a lane may not have more than MINIBID_QUOTA_PER_LANE mini-bids with status IN {OPEN, APPLIED} whose window_open_at falls inside the trailing MINIBID_QUOTA_WINDOW_DAYS of the logical clock"
    error_id: ERR_MINI_BID_QUOTA_EXCEEDED
    http_status: 409
    applies_to: "POST /mini-bids"

  - priority: 17
    category: business_fiscal
    check: |
      per-rate money limits:
      rate_per_mile >= BidEvent.rate_floor_per_mile (ERR_RATE_BELOW_FLOOR);
      in a round with target_reduction_pct set, a bid from a carrier that bid in the
      previous round must not exceed its own previous rate reduced by
      target_reduction_pct (ERR_RATE_ABOVE_ROUND_TARGET);
      abs(MiniBid.adjustment_pct) <= MINIBID_MAX_ADJUSTMENT_PCT (ERR_ADJUSTMENT_EXCEEDS_CAP)
    error_id: ERR_RATE_BELOW_FLOOR
    http_status: 422
    applies_to: "POST /bid-rounds/{id}/lane-bids, POST /mini-bids/{id}/proposal, POST /mini-bids/{id}/apply"

  - priority: 18
    category: business_fiscal
    check: |
      portfolio-level limits, evaluated over the whole award:
      no approved allocation's allocated_pct may exceed BidEvent.max_award_share_pct
      (ERR_AWARD_SHARE_EXCEEDED);
      BidEvent.diversity_pct >= BidEvent.diversity_min_pct (ERR_DIVERSITY_MINIMUM_NOT_MET);
      OptimizationRun.coverage_pct >= min_capacity_coverage_pct on publish
      (ERR_COVERAGE_BELOW_MINIMUM);
      a run whose status is FAILED cannot be published (ERR_NO_FEASIBLE_ALLOCATION)
    error_id: ERR_DIVERSITY_MINIMUM_NOT_MET
    http_status: 422
    applies_to: "POST /optimization-runs/{id}/routing-guide, POST /bid-events/{id}/award"

# =============================================================================
# §1.5 API Endpoint Table — every path is under api_prefix except the
# test-driving clock endpoint. Every single-resource id segment is literally {id}.
# =============================================================================
endpoints:
  # --- test-driving surface ---------------------------------------------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: |
      Sets the server's logical clock to an absolute UTC instant. Every timestamp the
      system writes (created_at, updated_at, *_at, window comparisons, insurance-expiry
      comparisons, mini-bid cooldowns, rate effective-window checks) reads this clock and
      never the host wall clock. Before the first call the logical clock reads exactly
      2026-08-01T00:00:00Z — that fixed default sits at or before every fixture date, so
      an unset clock is a well-defined earliest instant rather than a drifting real time.
    roles: [ProcurementAnalyst, ComplianceOfficer, CategoryManager, ContractAdmin, CarrierRep]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["logical clock set; no business row is modified"]

  # --- Carrier ---------------------------------------------------------------
  - method: POST
    path: "/freight-procurement/carriers"
    description: "Register a carrier in REGISTERED status with a provisional composite score."
    roles: [ProcurementAnalyst]
    code: 201
    input: [legal_name, scac_code, "diversity_classification?", service_modes, fleet_power_units, auto_liability_limit_usd, cargo_limit_usd, insurance_expiry_date]
    output: Carrier
    side_effects: ["capability_score := 0.00; calculations.carrier_composite_score evaluated in the PROVISIONAL_SCREENING variant"]
  - method: GET
    path: "/freight-procurement/carriers/{id}"
    description: "Read one carrier including its composite score and score variant."
    roles: [ProcurementAnalyst, ComplianceOfficer, CategoryManager, ContractAdmin, CarrierRep]
    code: 200
    input: []
    output: Carrier
    side_effects: []
  - method: GET
    path: "/freight-procurement/carriers"
    description: "List carriers, filterable by qualification status and diversity classification, ordered by created_at ASC."
    roles: [ProcurementAnalyst, ComplianceOfficer, CategoryManager, ContractAdmin]
    code: 200
    input: ["status?", "diversity_classification?", "limit?", "offset?"]
    output: Carrier[]
    side_effects: []
  - method: POST
    path: "/freight-procurement/carriers/{id}/status-change"
    description: "Compliance-driven carrier status change (suspend, reinstate, disqualify)."
    roles: [ComplianceOfficer]
    code: 200
    input: [to_status, reason]
    output: Carrier
    side_effects: ["status and status_reason updated per §1.2; calculations.carrier_composite_score re-evaluated; version += 1"]

  # --- QualificationReview ---------------------------------------------------
  - method: POST
    path: "/freight-procurement/carriers/{id}/qualification-reviews"
    description: "Open a qualification review, moving the carrier REGISTERED -> SCREENING and forking the insurance and capability branches."
    roles: [ComplianceOfficer]
    code: 201
    input: [required_modes, "min_auto_liability_usd?", "min_cargo_usd?"]
    output: QualificationReview
    side_effects: ["Carrier.status REGISTERED -> SCREENING; insurance_result and capability_result := PENDING; remediation_count := 0"]
  - method: GET
    path: "/freight-procurement/carriers/{id}/qualification-reviews"
    description: "Every qualification review of one carrier, ordered by created_at ASC — the reverse-reachability channel for QualificationReview.carrier_id."
    roles: [ComplianceOfficer, ProcurementAnalyst]
    code: 200
    input: []
    output: QualificationReview[]
    side_effects: []
  - method: POST
    path: "/freight-procurement/qualification-reviews/{id}/insurance-verification"
    description: "Record verified insurance limits and expiry — the first prong of the review fork."
    roles: [ComplianceOfficer]
    code: 200
    input: [verified_auto_liability_usd, verified_cargo_usd, verified_expiry_date]
    output: QualificationReview
    side_effects: ["insurance_result := PASS or FAIL against the review minimums and the logical clock; insurance_verified_at set; review -> SCREENED when the capability prong already completed"]
  - method: POST
    path: "/freight-procurement/qualification-reviews/{id}/capability-screening"
    description: "Run the service-capability screen — the second prong of the review fork."
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: QualificationReview
    side_effects: ["calculations.capability_screening_score evaluated; capability_result set; Carrier.capability_score updated; capability_screened_at set; review -> SCREENED when the insurance prong already completed"]
  - method: POST
    path: "/freight-procurement/qualification-reviews/{id}/decision"
    description: "Close a SCREENED review with an approval, a conditional approval, a remediation request or a rejection."
    roles: [ComplianceOfficer]
    code: 200
    input: [outcome, "decision_note?"]
    output: QualificationReview
    side_effects: ["Carrier.status moves to QUALIFIED, CONDITIONALLY_QUALIFIED or DISQUALIFIED, or the review cycles back to SUBMITTED with remediation_count += 1; calculations.carrier_composite_score re-evaluated; Carrier.qualified_at set on approval"]

  # --- Scorecard -------------------------------------------------------------
  - method: POST
    path: "/freight-procurement/carriers/{id}/scorecards"
    description: "Draft a performance scorecard for a closed measurement period."
    roles: [CategoryManager]
    code: 201
    input: [period_start, period_end, on_time_pct, claims_ratio]
    output: Scorecard
    side_effects: ["calculations.scorecard_period_score evaluated; the carrier's composite score is NOT touched while the scorecard is DRAFT"]
  - method: GET
    path: "/freight-procurement/carriers/{id}/scorecards"
    description: "Every scorecard of one carrier, ordered by period_end DESC then created_at ASC — the reverse-reachability channel for Scorecard.carrier_id."
    roles: [CategoryManager, ProcurementAnalyst, CarrierRep]
    code: 200
    input: []
    output: Scorecard[]
    side_effects: []
  - method: POST
    path: "/freight-procurement/scorecards/{id}/publish"
    description: "Publish a scorecard, admitting it to the carrier's FINAL_PERFORMANCE input set."
    roles: [CategoryManager]
    code: 200
    input: []
    output: Scorecard
    side_effects: ["published_at set; Carrier.published_scorecard_count += 1; calculations.carrier_composite_score re-evaluated (may switch variant); Carrier.status may move QUALIFIED <-> WATCHLIST"]
  - method: POST
    path: "/freight-procurement/scorecards/{id}/dispute"
    description: "Carrier disputes a published scorecard; the score stays in the input set."
    roles: [CarrierRep]
    code: 200
    input: [disputed_reason]
    output: Scorecard
    side_effects: ["status PUBLISHED -> DISPUTED; the carrier's composite score is deliberately unchanged"]

  # --- BidEvent --------------------------------------------------------------
  - method: POST
    path: "/freight-procurement/bid-events"
    description: "Create a transportation procurement event with its cost basis, weights and award constraints."
    roles: [ProcurementAnalyst]
    code: 201
    input: [name, cost_basis, "fuel_index_per_mile?", "accessorial_inflation_factor?", rate_floor_per_mile, "rounds_allowed?", cost_weight, service_weight, capacity_weight, diversity_weight, "diversity_min_pct?", "max_award_share_pct?", "max_carriers_per_lane?", contract_effective_from, contract_effective_to]
    output: BidEvent
    side_effects: ["status := DRAFT; current_round_no := 0; every rollup initialised to 0 or 0.00"]
  - method: GET
    path: "/freight-procurement/bid-events/{id}"
    description: "Read one bid event including its baseline, award cost, savings, coverage and diversity rollups."
    roles: [ProcurementAnalyst, ComplianceOfficer, CategoryManager, ContractAdmin]
    code: 200
    input: []
    output: BidEvent
    side_effects: []
  - method: POST
    path: "/freight-procurement/bid-events/{id}/lanes"
    description: "Add a lane to a DRAFT event with its historical volumes, seasonality and accessorial history."
    roles: [ProcurementAnalyst]
    code: 201
    input: [lane_code, origin_zip3, dest_zip3, equipment_type, mileage, annual_volume_loads, service_days_required, accessorial_history_usd_per_load, "trailing_12m_actual_loads?", "seasonality_peak_index?", "incumbent_carrier_id?", "incumbent_rate_per_mile?"]
    output: Lane
    side_effects: ["status := DRAFT; unallocated_volume_loads := annual_volume_loads; calculations.lane_data_quality_flags evaluated; BidEvent.lane_count += 1"]
  - method: POST
    path: "/freight-procurement/bid-events/{id}/lock-lanes"
    description: "Lock the event's lane scope, freezing the baseline that savings will be measured against."
    roles: [ProcurementAnalyst]
    code: 200
    input: []
    output: BidEvent
    side_effects: ["every VALIDATED lane -> LOCKED; calculations.lane_baseline_cost and calculations.bid_event_savings evaluated; status DRAFT -> LANES_LOCKED; version += 1"]
  - method: POST
    path: "/freight-procurement/bid-events/{id}/invitations"
    description: "Invite a qualified carrier to the event, snapshotting its composite score at invitation time."
    roles: [ProcurementAnalyst]
    code: 201
    input: [carrier_id, "nda_required?"]
    output: Invitation
    side_effects: ["status := SENT; qualification_snapshot_score and qualification_snapshot_carrier_version captured from the Carrier; BidEvent.invited_carrier_count += 1; status LANES_LOCKED -> INVITING on the first invitation"]
  - method: POST
    path: "/freight-procurement/bid-events/{id}/bid-rounds"
    description: "Open a bidding round with an incumbent-visibility policy and an optional target reduction."
    roles: [ProcurementAnalyst]
    code: 201
    input: [incumbent_visibility, closes_at, "target_reduction_pct?"]
    output: BidRound
    side_effects: ["round_no := BidEvent.current_round_no + 1; status := OPEN; opens_at := logical clock; BidEvent.current_round_no += 1 and status -> ROUND_OPEN; version += 1"]
  - method: GET
    path: "/freight-procurement/bid-events/{id}/bid-rounds"
    description: "Every round of one event, ordered by round_no ASC — the reverse-reachability channel for BidRound.bid_event_id."
    roles: [ProcurementAnalyst, CategoryManager, CarrierRep]
    code: 200
    input: []
    output: BidRound[]
    side_effects: []
  - method: GET
    path: "/freight-procurement/bid-events/{id}/optimization-runs"
    description: "Every optimization run of one event, ordered by created_at ASC — the reverse-reachability channel for OptimizationRun.bid_event_id."
    roles: [ProcurementAnalyst, CategoryManager]
    code: 200
    input: []
    output: OptimizationRun[]
    side_effects: []
  - method: POST
    path: "/freight-procurement/bid-events/{id}/award"
    description: "Commit the approved routing guide: the five-link award cascade that executes allocations, awards lanes, mints contracts and re-scores carriers."
    roles: [CategoryManager]
    code: 200
    input: []
    output: BidEvent
    side_effects: ["award cascade links 1-5 per §1.2 BidEvent AWARDING -> AWARDED; calculations.contract_committed_value and calculations.bid_event_savings evaluated; version += 1"]

  # --- Lane ------------------------------------------------------------------
  - method: GET
    path: "/freight-procurement/lanes/{id}"
    description: "Read one lane including its data-quality flags, baseline cost and unallocated volume."
    roles: [ProcurementAnalyst, CategoryManager, ContractAdmin, CarrierRep]
    code: 200
    input: []
    output: Lane
    side_effects: []
  - method: GET
    path: "/freight-procurement/lanes"
    description: "List lanes filtered by event, incumbent carrier, status or equipment, ordered by created_at ASC — the reverse-reachability channel for Lane.bid_event_id and Lane.incumbent_carrier_id."
    roles: [ProcurementAnalyst, CategoryManager, ContractAdmin, CarrierRep]
    code: 200
    input: ["bid_event_id?", "incumbent_carrier_id?", "status?", "equipment_type?", "limit?", "offset?"]
    output: Lane[]
    side_effects: []
  - method: POST
    path: "/freight-procurement/lanes/{id}/validate"
    description: "Re-run data-quality screening and admit the lane to the biddable scope."
    roles: [ProcurementAnalyst]
    code: 200
    input: []
    output: Lane
    side_effects: ["calculations.lane_data_quality_flags re-evaluated from scratch; calculations.lane_baseline_cost evaluated; status DRAFT -> VALIDATED; validated_at set"]

  # --- Invitation ------------------------------------------------------------
  - method: GET
    path: "/freight-procurement/invitations/{id}"
    description: "Read one invitation including its qualification snapshot and staleness flag."
    roles: [ProcurementAnalyst, CategoryManager, CarrierRep]
    code: 200
    input: []
    output: Invitation
    side_effects: []
  - method: GET
    path: "/freight-procurement/invitations"
    description: "List invitations filtered by event, carrier or status — the reverse-reachability channel for Invitation.bid_event_id and Invitation.carrier_id."
    roles: [ProcurementAnalyst, CategoryManager, CarrierRep]
    code: 200
    input: ["bid_event_id?", "carrier_id?", "status?", "limit?", "offset?"]
    output: Invitation[]
    side_effects: []
  - method: POST
    path: "/freight-procurement/invitations/{id}/response"
    description: "Carrier accepts or declines an invitation, signing the NDA when the event requires one."
    roles: [CarrierRep]
    code: 200
    input: [accept, "nda_signed?", "decline_reason?"]
    output: Invitation
    side_effects: ["status SENT -> ACCEPTED or DECLINED; nda_signed recorded; responded_at set; BidEvent.accepted_invitation_count recomputed; snapshot_stale set when Carrier.version moved past qualification_snapshot_carrier_version"]
  - method: POST
    path: "/freight-procurement/invitations/{id}/revoke"
    description: "Withdraw an invitation; the carrier's SUBMITTED bids in open rounds are withdrawn with it."
    roles: [ProcurementAnalyst]
    code: 200
    input: [revoked_reason]
    output: Invitation
    side_effects: ["status -> REVOKED; every SUBMITTED LaneBid of this carrier in an OPEN round of the event -> WITHDRAWN; BidRound.submitted_bid_count and lowest_rate_per_mile recomputed"]

  # --- BidRound / LaneBid ----------------------------------------------------
  - method: GET
    path: "/freight-procurement/bid-rounds/{id}"
    description: "Read one bidding round including its submitted-bid count and lowest submitted rate."
    roles: [ProcurementAnalyst, CategoryManager, CarrierRep]
    code: 200
    input: []
    output: BidRound
    side_effects: []
  - method: POST
    path: "/freight-procurement/bid-rounds/{id}/lane-bids"
    description: "Submit a rate for one lane in an open round; evaluated cost and rank are computed at submission."
    roles: [CarrierRep]
    code: 201
    input: [lane_id, carrier_id, rate_per_mile, fuel_surcharge_included, committed_volume_loads, transit_days_offered]
    output: LaneBid
    side_effects: ["status := SUBMITTED; is_incumbent derived from Lane.incumbent_carrier_id; calculations.lane_evaluated_cost and calculations.bid_cost_rank_score evaluated; rank_in_lane recomputed for every bid on the lane; BidRound.submitted_bid_count += 1 and lowest_rate_per_mile recomputed"]
  - method: GET
    path: "/freight-procurement/lane-bids/{id}"
    description: "Read one lane bid including its evaluated cost breakdown, rank score and rank."
    roles: [ProcurementAnalyst, CategoryManager, CarrierRep]
    code: 200
    input: []
    output: LaneBid
    side_effects: []
  - method: GET
    path: "/freight-procurement/lane-bids"
    description: "List lane bids filtered by round, lane, carrier or status, ordered by rank_in_lane ASC then created_at ASC — the reverse-reachability channel for LaneBid.bid_round_id, LaneBid.lane_id and LaneBid.carrier_id."
    roles: [ProcurementAnalyst, CategoryManager, CarrierRep]
    code: 200
    input: ["bid_round_id?", "lane_id?", "carrier_id?", "status?", "limit?", "offset?"]
    output: LaneBid[]
    side_effects: []
  - method: POST
    path: "/freight-procurement/lane-bids/{id}/withdraw"
    description: "Carrier withdraws its own bid while the round is still open."
    roles: [CarrierRep]
    code: 200
    input: []
    output: LaneBid
    side_effects: ["status SUBMITTED -> WITHDRAWN; withdrawn_at set; BidRound.submitted_bid_count -= 1; surviving bids on the lane are renumbered by calculations.bid_cost_rank_score"]
  - method: POST
    path: "/freight-procurement/bid-rounds/{id}/close"
    description: "Close a bidding round; the event returns to ROUND_CLOSED where a further round may be opened or optimization may begin."
    roles: [ProcurementAnalyst]
    code: 200
    input: []
    output: BidRound
    side_effects: ["status OPEN -> CLOSED; closed_at set; every SUBMITTED bid re-evaluated by calculations.lane_evaluated_cost and calculations.bid_cost_rank_score; BidEvent.status ROUND_OPEN -> ROUND_CLOSED; version += 1"]

  # --- OptimizationRun -------------------------------------------------------
  - method: POST
    path: "/freight-procurement/optimization-runs"
    description: "Score a scenario across cost, service, capacity coverage and carrier diversity. Carries the OCC guard on the BidEvent; supersedes every earlier run of the event."
    roles: [ProcurementAnalyst]
    code: 201
    input: [bid_event_id, expected_bid_event_version, scenario_label, "max_carriers_per_lane?", "diversity_min_pct?", "min_capacity_coverage_pct?"]
    output: OptimizationRun
    side_effects: ["calculations.award_allocation_waterfall and calculations.optimization_objective_score evaluated; earlier runs -> SUPERSEDED and their PROPOSED/APPROVED allocations -> SUPERSEDED with volume credited back; BidEvent.status -> OPTIMIZING; BidEvent.version += 1"]
  - method: GET
    path: "/freight-procurement/optimization-runs/{id}"
    description: "Read one run including total cost, coverage, diversity, objective score and infeasible lanes."
    roles: [ProcurementAnalyst, CategoryManager]
    code: 200
    input: []
    output: OptimizationRun
    side_effects: []
  - method: POST
    path: "/freight-procurement/optimization-runs/{id}/routing-guide"
    description: "Publish the run as the working routing guide, materialising PROPOSED award allocations with primary and backup positions."
    roles: [ProcurementAnalyst]
    code: 200
    input: []
    output: OptimizationRun
    side_effects: ["AwardAllocation rows created PROPOSED with routing_position PRIMARY/BACKUP_1/BACKUP_2; selected LaneBids -> SHORTLISTED and unselected -> NOT_AWARDED; status -> PUBLISHED; BidEvent OPTIMIZING -> AWARDING; version += 1"]

  # --- AwardAllocation -------------------------------------------------------
  - method: GET
    path: "/freight-procurement/award-allocations/{id}"
    description: "Read one allocation including its routing position, allocated volume, share and cost."
    roles: [ProcurementAnalyst, CategoryManager, ContractAdmin, CarrierRep]
    code: 200
    input: []
    output: AwardAllocation
    side_effects: []
  - method: GET
    path: "/freight-procurement/award-allocations"
    description: "List allocations filtered by event, run, lane, carrier, source bid, routing position or status — the reverse-reachability channel for all five AwardAllocation foreign keys."
    roles: [ProcurementAnalyst, CategoryManager, ContractAdmin, CarrierRep]
    code: 200
    input: ["bid_event_id?", "optimization_run_id?", "lane_id?", "carrier_id?", "lane_bid_id?", "routing_position?", "status?", "limit?", "offset?"]
    output: AwardAllocation[]
    side_effects: []
  - method: POST
    path: "/freight-procurement/award-allocations/{id}/approve"
    description: "Approve one allocation of the published routing guide; the lane's volume is debited here."
    roles: [CategoryManager]
    code: 200
    input: []
    output: AwardAllocation
    side_effects: ["approved_by_user_id and approved_at recorded; Lane.unallocated_volume_loads debited; Lane.awarded_coverage_pct, BidEvent.coverage_pct and diversity_pct recomputed"]
  - method: POST
    path: "/freight-procurement/award-allocations/{id}/reject"
    description: "Reject an allocation; an APPROVED rejection credits the lane volume back exactly and promotes the lane's backups."
    roles: [CategoryManager]
    code: 200
    input: [rejection_reason]
    output: AwardAllocation
    side_effects: ["status -> REJECTED; referencing LaneBid -> NOT_AWARDED; volume credited back when it had been debited; backups promoted and volumes re-derived by calculations.award_allocation_waterfall; BidEvent.coverage_pct and diversity_pct recomputed"]

  # --- Contract --------------------------------------------------------------
  - method: GET
    path: "/freight-procurement/contracts/{id}"
    description: "Read one contract including both independent state dimensions and the full committed-value breakdown."
    roles: [ProcurementAnalyst, CategoryManager, ContractAdmin, CarrierRep]
    code: 200
    input: []
    output: Contract
    side_effects: []
  - method: GET
    path: "/freight-procurement/contracts"
    description: "List contracts filtered by event, carrier, status or signature status — the reverse-reachability channel for Contract.bid_event_id and Contract.carrier_id."
    roles: [ProcurementAnalyst, CategoryManager, ContractAdmin, CarrierRep]
    code: 200
    input: ["bid_event_id?", "carrier_id?", "status?", "signature_status?", "limit?", "offset?"]
    output: Contract[]
    side_effects: []
  - method: POST
    path: "/freight-procurement/contracts/{id}/carrier-signature"
    description: "Carrier applies its signature; advances only the signature_status dimension."
    roles: [CarrierRep]
    code: 200
    input: []
    output: Contract
    side_effects: ["carrier_signed_by_user_id and carrier_signed_at recorded; signature_status advances per §1.2; status DRAFT -> EXECUTED when this completes both signatures; version += 1"]
  - method: POST
    path: "/freight-procurement/contracts/{id}/shipper-signature"
    description: "Shipper countersigns; blocked for any operator who approved an award allocation on this contract."
    roles: [ContractAdmin]
    code: 200
    input: []
    output: Contract
    side_effects: ["shipper_signed_by_user_id and shipper_signed_at recorded; signature_status advances per §1.2; status DRAFT -> EXECUTED when this completes both signatures; version += 1"]
  - method: POST
    path: "/freight-procurement/contracts/{id}/rate-records"
    description: "Stage a rate record for rate loading; advances only the rate_load_status dimension and may be done before any signature exists."
    roles: [ContractAdmin]
    code: 201
    input: [lane_id, carrier_id, award_allocation_id, routing_position, rate_per_mile, fuel_surcharge_included, effective_from, effective_to, committed_volume_loads]
    output: RateRecord
    side_effects: ["RateRecord created STAGED; Contract.rate_record_count += 1; rate_load_status NOT_STAGED -> STAGED; calculations.contract_committed_value re-evaluated; version += 1"]

  # --- RateRecord / TenderEvent ---------------------------------------------
  - method: GET
    path: "/freight-procurement/rate-records/{id}"
    description: "Read one rate record including tender counts, rejection percentage and supersession pointer."
    roles: [ProcurementAnalyst, CategoryManager, ContractAdmin, CarrierRep]
    code: 200
    input: []
    output: RateRecord
    side_effects: []
  - method: GET
    path: "/freight-procurement/rate-records"
    description: "List rate records filtered by contract, lane, carrier, source allocation, supersession pointer or status — the reverse-reachability channel for all five RateRecord foreign keys."
    roles: [ProcurementAnalyst, CategoryManager, ContractAdmin, CarrierRep]
    code: 200
    input: ["contract_id?", "lane_id?", "carrier_id?", "award_allocation_id?", "superseded_by_rate_record_id?", "status?", "limit?", "offset?"]
    output: RateRecord[]
    side_effects: []
  - method: POST
    path: "/freight-procurement/rate-records/{id}/load"
    description: "Load the staged rate into the routing guide after the interval-overlap check."
    roles: [ContractAdmin]
    code: 200
    input: []
    output: RateRecord
    side_effects: ["status STAGED -> LOADED; loaded_at set; Contract.rate_load_status STAGED -> LOADED on the contract's first loaded record"]
  - method: POST
    path: "/freight-procurement/rate-records/{id}/go-live"
    description: "Cut the loaded rate over to live tendering; the single point where the signature and rate-load dimensions couple."
    roles: [ContractAdmin]
    code: 200
    input: []
    output: RateRecord
    side_effects: ["status LOADED -> LIVE; live_at set; AwardAllocation EXECUTED -> ACTIVE; Contract.rate_load_status -> LIVE; BidEvent AWARDED -> LIVE on the event's first live rate; Carrier.active_primary_lane_count recomputed"]
  - method: POST
    path: "/freight-procurement/rate-records/{id}/tender-events"
    description: "Append one immutable tender outcome to a live rate record; may trip the at-risk cascade."
    roles: [ProcurementAnalyst, ContractAdmin]
    code: 201
    input: [outcome, load_reference, "reject_reason?"]
    output: TenderEvent
    side_effects: ["calculations.tender_acceptance_metrics evaluated; the tender-risk cascade may fire (record -> AT_RISK, allocation -> SUSPENDED_ROUTING, lane -> UNDER_REBID, a SYSTEM MiniBid created) or unwind (record -> LIVE)"]
  - method: GET
    path: "/freight-procurement/rate-records/{id}/tender-events"
    description: "The tender log of one rate record, ordered by tendered_at ASC then created_at ASC — the reverse-reachability channel for TenderEvent.rate_record_id."
    roles: [ProcurementAnalyst, CategoryManager, ContractAdmin, CarrierRep]
    code: 200
    input: []
    output: TenderEvent[]
    side_effects: []

  # --- MiniBid ---------------------------------------------------------------
  - method: POST
    path: "/freight-procurement/mini-bids"
    description: "Open a mid-contract mini-bid window on one lane, subject to the window-conflict, cooldown and rolling-quota checks."
    roles: [CategoryManager]
    code: 201
    input: [bid_event_id, lane_id, rate_record_id, trigger_reason, window_open_at, window_close_at]
    output: MiniBid
    side_effects: ["status := REQUESTED; origin := MANUAL (only the tender-risk cascade mints origin SYSTEM)"]
  - method: GET
    path: "/freight-procurement/mini-bids/{id}"
    description: "Read one mini-bid including its proposed rate, adjustment percentage and before/after contract values."
    roles: [ProcurementAnalyst, CategoryManager, ContractAdmin, CarrierRep]
    code: 200
    input: []
    output: MiniBid
    side_effects: []
  - method: GET
    path: "/freight-procurement/mini-bids"
    description: "List mini-bids filtered by event, lane, target record, replacement record, proposing carrier or status — the reverse-reachability channel for all five MiniBid foreign keys."
    roles: [ProcurementAnalyst, CategoryManager, ContractAdmin, CarrierRep]
    code: 200
    input: ["bid_event_id?", "lane_id?", "rate_record_id?", "applied_rate_record_id?", "proposed_by_carrier_id?", "status?", "limit?", "offset?"]
    output: MiniBid[]
    side_effects: []
  - method: POST
    path: "/freight-procurement/mini-bids/{id}/proposal"
    description: "Incumbent carrier proposes an adjusted per-mile rate inside the open window."
    roles: [CarrierRep]
    code: 200
    input: [carrier_id, proposed_rate_per_mile]
    output: MiniBid
    side_effects: ["calculations.minibid_market_delta evaluated; proposed_by_carrier_id and adjustment_pct recorded; status REQUESTED -> OPEN"]
  - method: POST
    path: "/freight-procurement/mini-bids/{id}/apply"
    description: "Apply the accepted adjustment: mint a replacement live rate record, supersede the old one and amend the contract. Carries the OCC guard on the Contract."
    roles: [ContractAdmin]
    code: 200
    input: [expected_contract_version, effective_from, effective_to]
    output: MiniBid
    side_effects: ["money cascade links 1-3 per §1.2; contract_value_before_usd and contract_value_after_usd snapshotted; Contract.status -> AMENDED and version += 1; BidEvent.award_cost_usd and savings_pct recomputed; a suspended lane returns to AWARDED"]
  - method: POST
    path: "/freight-procurement/mini-bids/{id}/deny"
    description: "Deny a requested or open mini-bid; the existing rate stands."
    roles: [CategoryManager]
    code: 200
    input: [denial_reason]
    output: MiniBid
    side_effects: ["status -> DENIED; denial_reason recorded; no rate record and no contract value changes"]
  - method: POST
    path: "/freight-procurement/mini-bids/{id}/revert"
    description: "Compensating action for an applied mini-bid: roll the replacement back and restore the superseded rate and the exact prior contract value."
    roles: [ContractAdmin]
    code: 200
    input: [revert_reason]
    output: MiniBid
    side_effects: ["compensating links 1-3 per §1.2; replacement record -> ROLLED_BACK; superseded record -> LIVE; Contract.total_committed_value_usd restored to contract_value_before_usd exactly; BidEvent rollups recomputed; version += 1"]

# =============================================================================
# §1.6 Error Code Catalog — every code is triggerable by at least one endpoint
# =============================================================================
errors:
  # --- authentication / authorization ---------------------------------------
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, or the role is not one of the five declared roles"
  - id: ERR_FORBIDDEN_ROLE
    http: 403
    condition: "the acting role is not listed in the endpoint's roles"
  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "a CarrierRep acts on a bid, invitation, contract, scorecard or mini-bid belonging to a different carrier"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "the operator applying the shipper signature already approved an award allocation on the same contract"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "missing required field, wrong type, undeclared enum value, negative money or volume, or an interval whose start is not before its end"

  # --- existence -------------------------------------------------------------
  - id: ERR_CARRIER_NOT_FOUND
    http: 404
    condition: "no Carrier with the referenced id"
  - id: ERR_QUALIFICATION_REVIEW_NOT_FOUND
    http: 404
    condition: "no QualificationReview with the referenced id"
  - id: ERR_BID_EVENT_NOT_FOUND
    http: 404
    condition: "no BidEvent with the referenced id"
  - id: ERR_LANE_NOT_FOUND
    http: 404
    condition: "no Lane with the referenced id"
  - id: ERR_BID_ROUND_NOT_FOUND
    http: 404
    condition: "no BidRound with the referenced id"
  - id: ERR_INVITATION_NOT_FOUND
    http: 404
    condition: "no Invitation with the referenced id"
  - id: ERR_LANE_BID_NOT_FOUND
    http: 404
    condition: "no LaneBid with the referenced id"
  - id: ERR_OPTIMIZATION_RUN_NOT_FOUND
    http: 404
    condition: "no OptimizationRun with the referenced id"
  - id: ERR_AWARD_ALLOCATION_NOT_FOUND
    http: 404
    condition: "no AwardAllocation with the referenced id"
  - id: ERR_CONTRACT_NOT_FOUND
    http: 404
    condition: "no Contract with the referenced id"
  - id: ERR_RATE_RECORD_NOT_FOUND
    http: 404
    condition: "no RateRecord with the referenced id"
  - id: ERR_MINI_BID_NOT_FOUND
    http: 404
    condition: "no MiniBid with the referenced id"
  - id: ERR_SCORECARD_NOT_FOUND
    http: 404
    condition: "no Scorecard with the referenced id"

  # --- optimistic concurrency ----------------------------------------------
  - id: ERR_STALE_BID_EVENT_VERSION
    http: 412
    condition: "expected_bid_event_version does not equal BidEvent.version on optimization-run creation"
  - id: ERR_STALE_CONTRACT_VERSION
    http: 412
    condition: "expected_contract_version does not equal Contract.version on mini-bid apply"

  # --- state preconditions --------------------------------------------------
  - id: ERR_LANE_NOT_VALIDATED
    http: 409
    condition: "locking an event whose lanes include a lane still in DRAFT"
  - id: ERR_LANES_NOT_LOCKED
    http: 409
    condition: "inviting carriers or opening the first round before the lane scope was locked"
  - id: ERR_ROUND_NOT_OPEN
    http: 409
    condition: "submitting or withdrawing a bid in a round whose status is CLOSED"
  - id: ERR_ROUND_STILL_OPEN
    http: 409
    condition: "creating an optimization run while a bidding round of the event is still OPEN"
  - id: ERR_EVENT_NOT_OPTIMIZING
    http: 409
    condition: "publishing a routing guide while the event is not in OPTIMIZING"
  - id: ERR_ALLOCATION_NOT_PROPOSED
    http: 409
    condition: "approving an allocation that is not in PROPOSED"
  - id: ERR_CONTRACT_NOT_FULLY_SIGNED
    http: 409
    condition: "taking a rate record live while the contract's signature_status is not FULLY_SIGNED"
  - id: ERR_RATE_RECORD_NOT_LOADED
    http: 409
    condition: "loading a rate record that is not STAGED, or taking one live that is not LOADED"
  - id: ERR_RATE_RECORD_NOT_LIVE
    http: 409
    condition: "appending a tender event to, or applying a mini-bid against, a record whose status is not LIVE or AT_RISK"
  - id: ERR_MINI_BID_NOT_OPEN
    http: 409
    condition: "proposing on a mini-bid that is not REQUESTED, or applying/denying one that is not OPEN"
  - id: ERR_MINI_BID_NOT_APPLIED
    http: 409
    condition: "reverting a mini-bid whose status is not APPLIED"
  - id: ERR_REVIEW_NOT_SCREENED
    http: 409
    condition: "deciding a qualification review before both fork prongs completed"
  - id: ERR_SCORECARD_ALREADY_PUBLISHED
    http: 409
    condition: "publishing a scorecard that is already PUBLISHED or DISPUTED"
  - id: ERR_SCORECARD_NOT_PUBLISHED
    http: 409
    condition: "disputing a scorecard that is still DRAFT"

  # --- business safety ------------------------------------------------------
  - id: ERR_CARRIER_SUSPENDED
    http: 409
    condition: "the carrier's status is SUSPENDED or DISQUALIFIED at the moment of the write"
  - id: ERR_CARRIER_INSURANCE_EXPIRED
    http: 409
    condition: "Carrier.insurance_expiry_date is at or before the logical clock"
  - id: ERR_CARRIER_NOT_QUALIFIED
    http: 409
    condition: "the carrier has not reached QUALIFIED, CONDITIONALLY_QUALIFIED or WATCHLIST standing"
  - id: ERR_LANE_DATA_QUALITY_BLOCKED
    http: 409
    condition: "the lane carries a blocking data-quality flag (MILEAGE_IMPLAUSIBLE or MISSING_TRAILING_VOLUME)"

  # --- business referential -------------------------------------------------
  - id: ERR_CARRIER_NOT_INVITED
    http: 409
    condition: "no Invitation exists for the (bid_event_id, carrier_id) pair the bid is submitted under"
  - id: ERR_INVITATION_NOT_ACCEPTED
    http: 409
    condition: "the carrier's invitation exists but is SENT, DECLINED or REVOKED rather than ACCEPTED"

  # --- uniqueness -----------------------------------------------------------
  - id: ERR_DUPLICATE_SCAC
    http: 409
    condition: "another Carrier already holds this scac_code"
  - id: ERR_DUPLICATE_LANE_CODE
    http: 409
    condition: "another Lane of the same bid event already holds this lane_code"
  - id: ERR_DUPLICATE_INVITATION
    http: 409
    condition: "a non-REVOKED Invitation already exists for this (bid_event_id, carrier_id)"
  - id: ERR_DUPLICATE_LANE_BID
    http: 409
    condition: "a non-WITHDRAWN LaneBid already exists for this (bid_round_id, lane_id, carrier_id)"
  - id: ERR_DUPLICATE_LOAD_REFERENCE
    http: 409
    condition: "this rate record already logged a tender event with the same load_reference"

  # --- business temporal ----------------------------------------------------
  - id: ERR_RATE_INTERVAL_OVERLAP
    http: 409
    condition: "the record's [effective_from, effective_to) interval overlaps another LOADED, LIVE or AT_RISK record on the same lane, carrier and routing position"
  - id: ERR_RATE_NOT_IN_EFFECTIVE_WINDOW
    http: 409
    condition: "go-live attempted outside [effective_from, effective_to) as measured by the logical clock"
  - id: ERR_MINI_BID_WINDOW_CONFLICT
    http: 409
    condition: "the requested [window_open_at, window_close_at] window intersects another REQUESTED, OPEN or APPLIED mini-bid window on the same lane"
  - id: ERR_MINI_BID_COOLDOWN_ACTIVE
    http: 409
    condition: "window_open_at falls within MINIBID_COOLDOWN_DAYS of the lane's most recently applied mini-bid"

  # --- business constraint --------------------------------------------------
  - id: ERR_LANE_NOT_IN_EVENT_SCOPE
    http: 409
    condition: "the lane being bid does not belong to the bid round's bid event"
  - id: ERR_TRANSIT_DAYS_EXCEEDED
    http: 409
    condition: "transit_days_offered exceeds the lane's service_days_required"
  - id: ERR_NDA_NOT_SIGNED
    http: 409
    condition: "accepting an invitation with nda_required true while nda_signed is false or absent"
  - id: ERR_ROUND_LIMIT_EXCEEDED
    http: 409
    condition: "opening a round would push current_round_no past BidEvent.rounds_allowed"
  - id: ERR_REMEDIATION_LIMIT_EXCEEDED
    http: 409
    condition: "a remediation decision would push remediation_count past MAX_REMEDIATIONS"
  - id: ERR_MINI_BID_QUOTA_EXCEEDED
    http: 409
    condition: "the lane already holds MINIBID_QUOTA_PER_LANE mini-bids inside the trailing MINIBID_QUOTA_WINDOW_DAYS"

  # --- business fiscal ------------------------------------------------------
  - id: ERR_RATE_BELOW_FLOOR
    http: 422
    condition: "the submitted or proposed per-mile rate is below BidEvent.rate_floor_per_mile"
  - id: ERR_RATE_ABOVE_ROUND_TARGET
    http: 422
    condition: "in a round with a target_reduction_pct, a returning carrier's rate is not at or below its previous-round rate reduced by that percentage"
  - id: ERR_ADJUSTMENT_EXCEEDS_CAP
    http: 422
    condition: "the absolute mini-bid adjustment_pct exceeds MINIBID_MAX_ADJUSTMENT_PCT"
  - id: ERR_AWARD_SHARE_EXCEEDED
    http: 422
    condition: "an approved allocation's allocated_pct exceeds BidEvent.max_award_share_pct at award time"
  - id: ERR_DIVERSITY_MINIMUM_NOT_MET
    http: 422
    condition: "BidEvent.diversity_pct is below BidEvent.diversity_min_pct at award time"
  - id: ERR_COVERAGE_BELOW_MINIMUM
    http: 422
    condition: "OptimizationRun.coverage_pct is below the run's min_capacity_coverage_pct at publish time"
  - id: ERR_NO_FEASIBLE_ALLOCATION
    http: 422
    condition: "publishing a run whose status is FAILED — no in-scope lane produced an eligible bid"

# =============================================================================
# §1.7 RBAC Matrix — segregation of duties between award approval and signature
# =============================================================================
roles:
  - name: ProcurementAnalyst
    description: "Builds the event: lane data preparation, invitations, round design, optimization scenarios and routing-guide publication."
    identity: "opaque"
    exclusive_operations:
      - "POST /freight-procurement/carriers"
      - "POST /freight-procurement/bid-events"
      - "POST /freight-procurement/bid-events/{id}/lanes"
      - "POST /freight-procurement/bid-events/{id}/lock-lanes"
      - "POST /freight-procurement/bid-events/{id}/invitations"
      - "POST /freight-procurement/bid-events/{id}/bid-rounds"
      - "POST /freight-procurement/lanes/{id}/validate"
      - "POST /freight-procurement/invitations/{id}/revoke"
      - "POST /freight-procurement/bid-rounds/{id}/close"
      - "POST /freight-procurement/optimization-runs"
      - "POST /freight-procurement/optimization-runs/{id}/routing-guide"
    shared_operations:
      - "POST /freight-procurement/rate-records/{id}/tender-events"
      - "every GET in §1.5 except GET /freight-procurement/carriers/{id}/scorecards, which excludes no analyst, and the carrier-scoped reads it shares with CarrierRep"
      - "POST /_clock/set_current_utc"
  - name: ComplianceOfficer
    description: "Owns carrier qualification: insurance verification, capability screening, decisions and status changes."
    identity: "opaque"
    exclusive_operations:
      - "POST /freight-procurement/carriers/{id}/status-change"
      - "POST /freight-procurement/carriers/{id}/qualification-reviews"
      - "POST /freight-procurement/qualification-reviews/{id}/insurance-verification"
      - "POST /freight-procurement/qualification-reviews/{id}/capability-screening"
      - "POST /freight-procurement/qualification-reviews/{id}/decision"
    shared_operations:
      - "GET /freight-procurement/carriers/{id}"
      - "GET /freight-procurement/carriers"
      - "GET /freight-procurement/carriers/{id}/qualification-reviews"
      - "GET /freight-procurement/bid-events/{id}"
      - "POST /_clock/set_current_utc"
  - name: CategoryManager
    description: "Owns the award decision and the mid-contract commercial surface: allocation approvals, the award commit, scorecards and mini-bid governance."
    identity: "opaque"
    exclusive_operations:
      - "POST /freight-procurement/bid-events/{id}/award"
      - "POST /freight-procurement/award-allocations/{id}/approve"
      - "POST /freight-procurement/award-allocations/{id}/reject"
      - "POST /freight-procurement/carriers/{id}/scorecards"
      - "POST /freight-procurement/scorecards/{id}/publish"
      - "POST /freight-procurement/mini-bids"
      - "POST /freight-procurement/mini-bids/{id}/deny"
    shared_operations:
      - "GET /freight-procurement/carriers, /lanes, /invitations, /lane-bids, /contracts, /rate-records, /mini-bids and /award-allocations list and single reads"
      - "GET /freight-procurement/bid-events/{id}/bid-rounds"
      - "GET /freight-procurement/bid-events/{id}/optimization-runs"
      - "POST /_clock/set_current_utc"
  - name: ContractAdmin
    description: "Executes what was awarded: shipper signature, rate staging, rate loading, go-live cutover and mini-bid apply/revert."
    identity: "opaque"
    exclusive_operations:
      - "POST /freight-procurement/contracts/{id}/shipper-signature"
      - "POST /freight-procurement/contracts/{id}/rate-records"
      - "POST /freight-procurement/rate-records/{id}/load"
      - "POST /freight-procurement/rate-records/{id}/go-live"
      - "POST /freight-procurement/mini-bids/{id}/apply"
      - "POST /freight-procurement/mini-bids/{id}/revert"
    shared_operations:
      - "POST /freight-procurement/rate-records/{id}/tender-events"
      - "GET /freight-procurement/contracts, /rate-records, /mini-bids, /award-allocations, /lanes and /carriers reads"
      - "POST /_clock/set_current_utc"
    note: |
      Segregation of duties: a ContractAdmin whose X-User-ID appears as
      approved_by_user_id on any AwardAllocation of a contract's (bid_event_id,
      carrier_id) pair is permanently barred from that contract's shipper signature
      (ERR_SEGREGATION_OF_DUTIES). Because CategoryManager and ContractAdmin are both
      opaque operator roles, the same human operator id can hold both roles — which is
      exactly the compliance hole this rule closes.
  - name: CarrierRep
    description: "Acts for one carrier: invitation response, bid submission and withdrawal, mini-bid proposals, carrier signature and scorecard disputes."
    identity: "entity_backed:Carrier"
    exclusive_operations:
      - "POST /freight-procurement/invitations/{id}/response"
      - "POST /freight-procurement/bid-rounds/{id}/lane-bids"
      - "POST /freight-procurement/lane-bids/{id}/withdraw"
      - "POST /freight-procurement/mini-bids/{id}/proposal"
      - "POST /freight-procurement/contracts/{id}/carrier-signature"
      - "POST /freight-procurement/scorecards/{id}/dispute"
    shared_operations:
      - "GET reads of its own carrier, lanes, invitations, lane bids, rounds, allocations, contracts, rate records, tender events, mini-bids and scorecards"
      - "POST /_clock/set_current_utc"
    note: |
      X-User-ID equals Carrier.id. Every write above compares X-User-ID with the
      carrier foreign key on the targeted resource and raises ERR_NOT_RESOURCE_OWNER on
      a mismatch, at priority 6 — after the role check but before any state check.
