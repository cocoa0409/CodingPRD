          - validations.priority_30
          - errors.ERR_RESOURCE_NOT_FOUND
        distinguishing_aspect: "A syntactically valid but unknown fund id returns 404 ERR_RESOURCE_NOT_FOUND from priority 30, not 200 with a null body and not 422 — and the same holds before any plan exists at all."
        test_recipe:
          setup:
            - "Clock set; database otherwise empty."
          setup_api_calls:
            - *b_clock
          trigger:
            - call: "GET /governance/funds/f-00000000-0000-0000-0000-000000000000"
              payload: {}
              as: PlanAuditor
              as_user_id: "aud-1"
          assert:
            - "the response status is 404 and response_type is error"
            - "data.error_id == ERR_RESOURCE_NOT_FOUND"
            - "no entity rows were created or mutated"

