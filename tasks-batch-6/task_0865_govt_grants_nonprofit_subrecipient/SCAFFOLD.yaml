    side_effects: ["set awarded_amount_cents", "debit NOFO.remaining_pool_cents", "create Subaward{DRAFT}"]
  - method: POST
    path: "/applications/{id}/reject"
    description: "Reject a scored application (SCORED->REJECTED)."
    roles: [ProgramOfficer]
    code: 200
    input: ["reason?"]
    output: Application
    side_effects: []

  - method: POST
    path: "/applications/{id}/reviews"
    description: "Submit a panel review score. Third review auto-transitions the application to SCORED."
    roles: [Panelist]
    code: 201
    input: [score, "comments?"]
    output: PanelReview
    side_effects: ["increment review_count", "recompute average_score", "if review_count reaches 3: Application UNDER_REVIEW->SCORED"]
  - method: GET
    path: "/applications/{id}/reviews"
    description: "List an application's panel reviews (reverse reachability for PanelReview.application_id)."
    roles: [ProgramOfficer, Panelist]
    code: 200
    input: ["limit?", "offset?"]
    output: PanelReview[]
    side_effects: []

  - method: GET
    path: "/subawards/{id}"
    description: "Fetch a subaward."
    roles: [ProgramOfficer, GrantsManager, Subrecipient, Panelist]
    code: 200
    input: []
    output: Subaward
    side_effects: []
  - method: GET
    path: "/subawards"
    description: "List subawards; filter by application_id, nonprofit_id, and/or nofo_id (reverse reachability for all three FKs)."
    roles: [ProgramOfficer, GrantsManager, Subrecipient, Panelist]
    code: 200
    input: ["application_id?", "nonprofit_id?", "nofo_id?", "status?", "limit?", "offset?"]
    output: Subaward[]
    side_effects: []
  - method: POST
    path: "/subawards/{id}/budget-lines"
    description: "Add a budget line to a DRAFT subaward."
    roles: [ProgramOfficer]
    code: 201
    input: [category, amount_cents, federal_share_pct, "description?"]
    output: BudgetLine
    side_effects: []
  - method: GET
    path: "/subawards/{id}/budget-lines"
    description: "List a subaward's budget lines (reverse reachability for BudgetLine.subaward_id)."
    roles: [ProgramOfficer, GrantsManager, Subrecipient]
    code: 200
    input: ["limit?", "offset?"]
    output: BudgetLine[]
    side_effects: []
  - method: POST
    path: "/subawards/{id}/activate"
    description: "Activate a subaward (DRAFT->ACTIVE); computes indirect and federal share, enforces budget balance."
    roles: [ProgramOfficer]
    code: 200
    input: []
    output: Subaward
    side_effects: ["compute indirect_cost_cents", "compute federal_share_cents"]
  - method: POST
    path: "/subawards/{id}/suspend"
    description: "Suspend an active subaward (ACTIVE->SUSPENDED); returns pending drawdowns."
    roles: [GrantsManager]
    code: 200
    input: ["reason?"]
    output: Subaward
    side_effects: ["cascade: SUBMITTED drawdowns -> RETURNED"]
  - method: POST
    path: "/subawards/{id}/reinstate"
    description: "Reinstate a suspended subaward (SUSPENDED->ACTIVE)."
    roles: [GrantsManager]
    code: 200
    input: []
    output: Subaward
    side_effects: []
  - method: POST
    path: "/subawards/{id}/terminate"
    description: "Terminate a subaward. From DRAFT it credits the NOFO pool back; from ACTIVE/SUSPENDED it denies pending drawdowns."
    roles: [ProgramOfficer]
    code: 200
    input: ["reason?"]
    output: Subaward
    side_effects: ["from DRAFT: credit NOFO.remaining_pool_cents", "from ACTIVE/SUSPENDED: cascade SUBMITTED/RETURNED drawdowns -> DENIED"]
  - method: POST
    path: "/subawards/{id}/initiate-closeout"
    description: "Begin closeout (ACTIVE->CLOSEOUT_PENDING)."
    roles: [ProgramOfficer]
    code: 200
    input: []
    output: Subaward
    side_effects: []
  - method: POST
    path: "/subawards/{id}/close"
    description: "Close a subaward (CLOSEOUT_PENDING->CLOSED); requires all findings resolved, denies leftover drawdowns."
    roles: [ProgramOfficer]
    code: 200
    input: []
    output: Subaward
    side_effects: ["cascade: SUBMITTED/RETURNED drawdowns -> DENIED"]

  - method: POST
    path: "/subawards/{id}/drawdowns"
    description: "Submit a reimbursement drawdown against an ACTIVE subaward. OCC-guarded on subaward.version."
    roles: [Subrecipient]
    code: 201
    input: [requested_amount_cents, period_covered_start, period_covered_end, expected_subaward_version]
    output: Drawdown
    side_effects: ["compute provisional_reimbursable_cents", "debit subaward.obligated_cents", "increments Subaward.version by 1"]
  - method: GET
    path: "/subawards/{id}/drawdowns"
    description: "List a subaward's drawdowns (reverse reachability for Drawdown.subaward_id)."
    roles: [ProgramOfficer, GrantsManager, Subrecipient]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Drawdown[]
    side_effects: []
  - method: GET
    path: "/drawdowns/{id}"
    description: "Fetch a drawdown."
    roles: [ProgramOfficer, GrantsManager, Subrecipient]
    code: 200
    input: []
    output: Drawdown
    side_effects: []
  - method: POST
    path: "/drawdowns/{id}/approve"
    description: "Approve a drawdown (SUBMITTED->APPROVED); SoD four-eyes enforced; computes final reimbursable."
    roles: [GrantsManager]
    code: 200
    input: ["disallowed_amount_cents?"]
    output: Drawdown
    side_effects: ["compute final_reimbursable_cents", "adjust subaward.obligated_cents by delta", "set reviewed_by_user_id"]
  - method: POST
    path: "/drawdowns/{id}/return"
    description: "Return a drawdown for more documentation (SUBMITTED->RETURNED); credits obligation back."
    roles: [GrantsManager]
    code: 200
    input: ["reason?"]
