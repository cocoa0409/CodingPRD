        grounds:
          - entities.PriceScheduleStep.schedule_id
          - validations[priority 5]
          - errors[ERR_SCHEDULE_NOT_FOUND]
        distinguishing_aspect: "PriceScheduleStep declares parent PriceSchedule; a schedule_id that resolves to no row answers ERR_SCHEDULE_NOT_FOUND with HTTP 404, and the real schedule's step_count is untouched at 1."
        test_recipe:
          setup:
            - "one STD-2026 schedule carrying exactly one step, so step_count == 1"
          setup_api_calls:
            - call: "POST /price-schedules"
              payload: { name: "STD-2026", unsold_trigger_day: 120, election_window_days: 14 }
              as: GalleryManager
