          - entities.Device.fields.rolling_health_score
          - endpoints.POST_/kiosk-ops/_clock/set_current_utc
        distinguishing_aspect: "A printer-down kiosk scores base 80 (0 + 30 + 25 + 25) and bands to ONLINE exactly at HEALTH_ONLINE_MIN; advancing the clock 20 minutes charges 4 misses but MISS_PENALTY_CAP clamps both variants to a 60-point deduction, so rolling and worst-case both read 20."
        test_recipe:
          setup:
            - "Clock 2026-08-05T17:00:00Z; ZONE_A, cluster CL_WEST, store S001; kiosk K001 registered."
            - "K001 heartbeats with printer_ok false and the other three flags true."
          setup_api_calls:
            - call: "POST /kiosk-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T17:00:00Z" }
              as: PlatformAdmin
            - call: "POST /kiosk-ops/price-zones"
              payload: { zone_code: "ZONE_A", currency_code: "USD", price_multiplier_bp: 11000, psychological_rounding: "NINE_ENDING", tax_rate_bp: 875, max_uplift_bp: 1500 }
              as: PlatformAdmin
              captures: { zone_a_id: $.data.id }
            - call: "POST /kiosk-ops/store-clusters"
              payload: { cluster_code: "CL_WEST", tier: "REGION" }
              as: ContentManager
              captures: { cl_id: $.data.id }
            - call: "POST /kiosk-ops/stores"
              payload: { store_code: "S001", cluster_id: "${cl_id}", price_zone_id: "${zone_a_id}", timezone_offset_minutes: -300, accessibility_certified_until_utc: "2027-01-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { store_id: $.data.id }
            - call: "POST /kiosk-ops/devices"
              payload: { store_id: "${store_id}", device_kind: "KIOSK", device_code: "K001", offline_cache_capacity: 2, pin_pad_firmware_version: "1.4.2" }
              as: PlatformAdmin
              captures: { dev_id: $.data.id }
            - call: "POST /kiosk-ops/devices/${dev_id}/heartbeat"
              payload: { printer_ok: false, touch_ok: true, screen_reader_ok: true, network_ok: true }
              as: DeviceAgent
              as_user_id: "${dev_id}"
              captures: { roll0: $.data.rolling_health_score, worst0: $.data.worst_case_health_score, state0: $.data.health_state }
          trigger:
            - call: "POST /kiosk-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T17:20:00Z" }
              as: PlatformAdmin
              captures: { rescored: $.data.devices_rescored }
            - call: "GET /kiosk-ops/devices/${dev_id}"
              payload: {}
              as: PlatformAdmin
              captures: { roll1: $.data.rolling_health_score, worst1: $.data.worst_case_health_score, state1: $.data.health_state, missed1: $.data.consecutive_missed_heartbeats }
          assert:
            - "${roll0} == 80 (WEIGHT_TOUCH 30 + WEIGHT_SCREEN_READER 25 + WEIGHT_NETWORK 25; WEIGHT_PRINTER 20 forfeited), ${worst0} == 50 (80 - 2 x 15 projected) and ${state0} == ONLINE — 80 satisfies HEALTH_ONLINE_MIN inclusively"
            - "${rescored} == 1 and ${missed1} == 4 (20 minutes / HEARTBEAT_INTERVAL_MINUTES 5)"
            - "${roll1} == 20 — the raw deduction 4 x 15 = 60 equals MISS_PENALTY_CAP, so it is applied unclamped"
            - "${worst1} == 20 as well: (4 + PROJECTED_MISSES 2) x 15 = 90 is clamped down to the same 60, collapsing the two variants"
            - "${state1} == QUARANTINED because missed 4 >= QUARANTINE_MISS_FLOOR 3 and worst_case 20 < 50, evaluated before the OFFLINE band"

