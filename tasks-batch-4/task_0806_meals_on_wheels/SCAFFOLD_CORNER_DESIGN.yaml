  # Excluded stubs — corners already covered by §1.8 difficulty instances
  # ========================================================================
  - section: validations
    instances:
      - name: error_client_not_active_on_delivery_create_stub
        claim_type: violation_to_error
        grounds: ["errors[ERR_CLIENT_NOT_ACTIVE]"]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / delivery_scheduling_requires_active_client
