  - name: a_bond_claim_after_a_layoff_separation_is_not_eligible
    claim_type: error_triggerable
    grounds:
    - errors[ERR_BONDING_CLAIM_NOT_ELIGIBLE]
    - state_machines.Placement_bonding.transitions.BONDED_to_CLAIMED
    distinguishing_aspect: CLAIMED is reachable only after a for-cause separation. Here the bond is genuinely BONDED
      and the placement is genuinely SEPARATED, so both obvious guards pass — only the separation_reason makes the
      claim ineligible, and the bond must stay BONDED rather than falling to EXPIRED.
    test_recipe:
