              payload: { decision: "DERATE", decision_note: "worst specimen is short" }
              as: CertificationOfficer
              as_user_id: "co-1"
          assert:
            - "PL-C attempt: HTTP 422 with error_id ERR_DERATE_NOT_PERMITTED — RCERT-LM has derate_allowed false, even though the arithmetic would have produced a legal 12.50"
            - "ProductLine.${pl_c}.certification_status is still PENDING_CERTIFICATION and effective_declared_r_value is still null"
            - "PL-A attempt: HTTP 200, ProductLine.${pl_a}.certification_status == DERATED and effective_declared_r_value == 12.00"
            - "the two calls carry the same decision and the same specimen data, so only the program flag separates them"
            - "on RCERT-LM the specimens are CONFORMING (mean 12.73 >= 12.70) while on RCERT-PS they are NONCONFORMING (min 12.40 < 12.70) — the flag is checked regardless of the verdict"

      - name: an_uncertified_binder_is_reported_ahead_of_a_malformed_oven_profile
        claim_type: cascading_validation
        grounds:
          - validations[priority=52]
          - validations[priority=66]
        excluded_because:
          difficulty_instance: uncertified_binder_outranks_oven_zone_mismatch_on_run_scheduling
          rationale: "The §1.8 instance is exactly this ordering claim at depth: one POST /production-runs violating both the binder-certification gate and the oven-zone shape, walked across each binder state so that the reported code flips only when the binder reaches CERTIFIED."

      - name: lab_capacity_is_an_aggregate_over_overlapping_windows
        claim_type: aggregate_validation
        grounds:
          - validations[priority=64]
          - entities.CertificationProgram.fields.max_concurrent_lab_tests
        excluded_because:
          difficulty_instance: lab_capacity_is_aggregate_over_closed_windows_within_one_program
          rationale: "The §1.8 instance already builds the aggregate case — several individually legal start-lab calls whose closed windows intersect within one program — and checks that the count is scoped per program and that a non-overlapping or differently-programmed test does not consume capacity."

      - name: a_new_run_may_not_overlap_an_occupied_forming_line
        claim_type: temporal_validation
        grounds:
          - validations[priority=62]
          - entities.ProductionRun.fields.line_index
        excluded_because:
          difficulty_instance: forming_line_occupancy_is_half_open_and_scoped_per_line
          rationale: "The §1.8 instance covers the temporal case in full: back-to-back runs sharing an endpoint are accepted because the interval is half-open, a one-second overlap is refused, and the same window on a different line_index is always free."

  # ===========================================================================
  # 5. ENDPOINTS
  # ===========================================================================
  - section: endpoints
    instances:
      - name: plant_and_sku_reference_data_supports_create_read_list_and_update
        claim_type: standard_crud
        grounds:
          - endpoints[POST /plants]
          - endpoints[GET /plants/{plantId}]
          - endpoints[GET /plants]
          - endpoints[PATCH /product-lines/{productLineId}/packaging]
        distinguishing_aspect: "The reference-data corner of the API is a full CRU (no D anywhere in §1.5): create returns 201, the single read echoes it, the list paginates it, and the only update route is the packaging PATCH — which is a partial update that leaves unnamed fields alone."
        test_recipe:
          setup:
            - "Empty database; program RCERT-PS and CERTIFIED binder BF-FREE-1 are created so a SKU can exist."
          setup_api_calls:
            - call: "POST /certification-programs"
              payload: { code: "RCERT-PS", conformance_basis: "PER_SPECIMEN", r_value_tolerance: 0.30, min_specimen_count: 3, max_concurrent_lab_tests: 2, retest_limit: 2, derate_allowed: true }
              as: CorporateOps
              captures: { prog_ps: "$.data.id" }
            - call: "POST /binder-formulations"
              payload: { code: "BF-FREE-1", formaldehyde_free: true, formaldehyde_ppm: 0, voc_g_per_kg: 3.2, min_cure_temp_f: 420, min_dwell_s: 150, loi_target_pct: 4.5 }
              as: QualityEngineer
              as_user_id: "qe-1"
              captures: { binder_free: "$.data.id" }
            - call: "POST /binder-formulations/${binder_free}/submit"
              payload: {}
              as: QualityEngineer
              as_user_id: "qe-1"
            - call: "POST /binder-formulations/${binder_free}/emissions-test"
              payload: { formaldehyde_ppm: 0, voc_g_per_kg: 3.2, lab_reference: "LAB-9001" }
              as: CertificationOfficer
              as_user_id: "co-1"
            - call: "POST /binder-formulations/${binder_free}/certification-decision"
              payload: { decision: "CERTIFY", emissions_cert_id: "EC-4411" }
              as: CertificationOfficer
              as_user_id: "co-1"
          trigger:
            - call: "POST /plants"
              payload: { name: "Newark Forming Line", site_code: "NWK", oven_zone_count: 4, oven_length_ft: 120, production_line_count: 2, permit_number: "NJ-AIR-114", formaldehyde_allowance_kg: 0.200, voc_allowance_kg: 12.0, max_cullet_fraction: 0.30, cullet_restrict_fraction: 0.28, max_width_change_in: 8.0 }
              as: CorporateOps
              captures: { plant_id: "$.data.id" }
            - call: "GET /plants/${plant_id}"
              payload: {}
              as: CorporateOps
            - call: "GET /plants"
              payload: { limit: 10, offset: 0 }
              as: CorporateOps
            - call: "POST /product-lines"
              payload: { sku: "R13-15-UF", plant_id: "${plant_id}", binder_formulation_id: "${binder_free}", certification_program_id: "${prog_ps}", form: "BATT", density_pcf: 0.80, facing_type: "UNFACED", width_in: 15, thickness_in: 3.5, declared_r_value: 13.0, bag_sqft: 88.0, bale_volume_ft3: 21.0, bale_mass_kg: 12.5, mass_rate_kg_per_min: 34.5, compression_ratio: 6.0 }
              as: CorporateOps
              captures: { pl_a: "$.data.id" }
            - call: "PATCH /product-lines/${pl_a}/packaging"
              payload: { bale_mass_kg: 13.0 }
              as: CorporateOps
            - call: "GET /product-lines/${pl_a}"
              payload: {}
              as: CorporateOps
          assert:
            - "create: HTTP 201 with a server-generated Plant.${plant_id}.id"
            - "read: HTTP 200 and every field equals what was posted, including the optional limits that were supplied explicitly"
            - "list: total_count == 1, has_more == false, and the single row is ${plant_id}"
            - "the PATCH is partial: ProductLine.${pl_a}.bale_mass_kg == 13.0 while compression_ratio is still 6.0, bale_volume_ft3 still 21.0 and bag_sqft still 88.0"
            - "the PATCH recomputed the derived block from the NEW mass: by_payload = floor(19500 / 13.0) = 1500 still exceeds by_volume 1085, so bales_per_truck is still 1085 and freight_cost_per_sqft is still 0.025660"
            - "recovered_thickness_pct is still 90.00 — bale mass does not enter the recovery formula, only the truck payload limit"
            - "§1.5 declares no DELETE route for any entity, so reference data can never be removed once SKUs and runs point at it"

