        grounds:
          - validations[priority=34]
          - errors[ERR_SAMPLE_WINDOW_CONFLICT]
          - entities.SampleSet.fields.window_start_date
          - entities.SampleSet.fields.window_end_date
        distinguishing_aspect: |
          A different resource entity (Subdivision, capacity 1 over statuses FORMING/SELECTED/TESTED)
          and the opposite interval semantics from the inspector case: CLOSED date intervals where a
          shared endpoint date DOES count as an intersection, so 2026-08-15..2026-08-31 collides with
