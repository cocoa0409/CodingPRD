# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Breadth walk of references/claim-extraction-guide.md against SCAFFOLD.yaml
# §1.1-§1.7. Corners already asserted by a §1.8 instance are emitted as
# `excluded_because:` stubs naming that instance.
scaffold_corner_design:

  - section: entities
    instances:
      - name: university_create_returns_full_declared_shape
        claim_type: Creation
        grounds:
          - entities.University
          - endpoints[POST /universities]
        distinguishing_aspect: "POST /universities with every declared field returns 201, id as a bare UUID with no type prefix, version 1, partner_discount_bps 500 and verified_student_count 0."
        test_recipe:
          setup:
            - "Empty database, logical clock at its 2026-05-01T00:00:00Z default."
          setup_api_calls:
            - call: "POST /universities"
              payload: { name: "Seed U", code: "SEED", partner_tier: "STANDARD", verification_required: false, academic_year_start_date: "2026-08-20", academic_year_end_date: "2027-05-20", partner_admin_user_id: "uni-admin-seed" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { uni_seed: $.data.id }
          trigger:
            - call: "POST /universities"
              payload: { name: "State University", code: "SU", partner_tier: "PREFERRED", verification_required: true, academic_year_start_date: "2026-08-15", academic_year_end_date: "2027-05-15", partner_admin_user_id: "uni-admin-su" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { uni_su: $.data.id, uni_su_v: $.data.version }
          assert:
            - "HTTP 201 with response_type == object and meta.api_request_id present"
            - "University.${uni_su}.code == SU and University.${uni_su}.partner_tier == PREFERRED"
            - "University.${uni_su}.partner_discount_bps == 500"
            - "University.${uni_su}.verified_student_count == 0"
            - "University.${uni_su}.version == 1 and created_at and updated_at are ISO 8601 UTC with three fractional digits"
            - "University.${uni_su}.id is a bare UUID (36 chars, four hyphens, no prefix)"

      - name: university_partner_discount_bps_is_computed_from_tier
        claim_type: Computed Fields
        grounds:
          - entities.University.fields.partner_discount_bps
          - calculations.lease_term_total_cents
        distinguishing_aspect: "partner_discount_bps is source: computed - a STANDARD university receives 0 and a PREFERRED one receives 500, derived solely from partner_tier."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls:
            - call: "POST /universities"
              payload: { name: "State University", code: "SU", partner_tier: "PREFERRED", verification_required: true, academic_year_start_date: "2026-08-15", academic_year_end_date: "2027-05-15", partner_admin_user_id: "uni-admin-su" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { uni_pref: $.data.id }
          trigger:
            - call: "POST /universities"
              payload: { name: "City College", code: "CC", partner_tier: "STANDARD", verification_required: false, academic_year_start_date: "2026-08-20", academic_year_end_date: "2027-05-20", partner_admin_user_id: "uni-admin-cc" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { uni_std: $.data.id }
          assert:
            - "University.${uni_pref}.partner_discount_bps == 500"
            - "University.${uni_std}.partner_discount_bps == 0"
            - "University.${uni_std}.verification_required == false"

      - name: university_tier_and_verification_defaults_applied
        claim_type: Defaults
        grounds:
          - entities.University.fields.partner_tier
          - entities.University.fields.verification_required
        distinguishing_aspect: "Omitting partner_tier and verification_required yields STANDARD and true respectively, so partner_discount_bps lands on 0."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls:
            - call: "POST /universities"
              payload: { name: "Anchor U", code: "ANC", academic_year_start_date: "2026-08-15", academic_year_end_date: "2027-05-15", partner_admin_user_id: "uni-admin-anc" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { uni_def: $.data.id }
          trigger:
            - call: "GET /universities/${uni_def}"
              payload: {}
              as: PlatformAdmin
              as_user_id: "admin-1"
          assert:
            - "University.${uni_def}.partner_tier == STANDARD"
            - "University.${uni_def}.verification_required == true"
            - "University.${uni_def}.partner_discount_bps == 0"

      - name: university_duplicate_code_rejected
        claim_type: Type Constraints
        grounds:
          - validations[priority=30]
          - errors[ERR_UNIVERSITY_CODE_TAKEN]
        distinguishing_aspect: "A second university reusing code SU is refused with HTTP 409 ERR_UNIVERSITY_CODE_TAKEN and no row is created."
        test_recipe:
          setup:
            - "One university already registered with code SU."
          setup_api_calls:
            - call: "POST /universities"
              payload: { name: "State University", code: "SU", partner_tier: "PREFERRED", verification_required: true, academic_year_start_date: "2026-08-15", academic_year_end_date: "2027-05-15", partner_admin_user_id: "uni-admin-su" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { uni_su: $.data.id }
          trigger:
            - call: "POST /universities"
              payload: { name: "Second State", code: "SU", partner_tier: "STANDARD", verification_required: true, academic_year_start_date: "2026-09-01", academic_year_end_date: "2027-06-01", partner_admin_user_id: "uni-admin-2" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { dup_err: $.data.error_id }
          assert:
            - "HTTP 409 with error_id == ERR_UNIVERSITY_CODE_TAKEN"
            - "no second University row exists with code SU"

      - name: property_create_starts_in_draft_with_zero_rollups
        claim_type: Defaults
        grounds:
          - entities.Property.fields.status
          - entities.Property.fields.escrow_balance_cents
          - state_machines.Property.initial_state
        distinguishing_aspect: "A freshly created Property has status DRAFT, unit_count 0, total_bed_count 0, available_bed_count 0, escrow_balance_cents 0, maintenance_reserve_cents 0 and payout_eligible false."
        test_recipe:
          setup:
            - "One university registered."
          setup_api_calls:
            - call: "POST /universities"
              payload: { name: "State University", code: "SU", partner_tier: "PREFERRED", verification_required: true, academic_year_start_date: "2026-08-15", academic_year_end_date: "2027-05-15", partner_admin_user_id: "uni-admin-su" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { uni_su: $.data.id }
          trigger:
            - call: "POST /properties"
              payload: { university_id: "${uni_su}", name: "Maple Commons", address_line: "12 Maple St", distance_to_campus_m: 800 }
              as: PropertyManager
              as_user_id: "mgr-1"
              captures: { prop1: $.data.id }
          assert:
            - "HTTP 201 with Property.${prop1}.status == DRAFT"
            - "Property.${prop1}.manager_user_id == mgr-1"
            - "Property.${prop1}.unit_count == 0 and total_bed_count == 0 and available_bed_count == 0"
            - "Property.${prop1}.escrow_balance_cents == 0 and maintenance_reserve_cents == 0 and payout_eligible == false"
            - "Property.${prop1}.version == 1"

      - name: property_list_pagination_reports_total_count_and_has_more
        claim_type: Listing
        grounds:
          - endpoints[GET /properties]
          - response_envelope.pagination_fields
        distinguishing_aspect: "GET /properties with limit 2 and offset 0 over three properties returns 2 rows, total_count 3 and has_more true; offset 2 returns 1 row and has_more false."
        test_recipe:
          setup:
            - "One university and three properties created in a known created_at order."
          setup_api_calls:
            - call: "POST /universities"
              payload: { name: "State University", code: "SU", partner_tier: "PREFERRED", verification_required: true, academic_year_start_date: "2026-08-15", academic_year_end_date: "2027-05-15", partner_admin_user_id: "uni-admin-su" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { uni_su: $.data.id }
            - call: "POST /properties"
              payload: { university_id: "${uni_su}", name: "Maple Commons", address_line: "12 Maple St", distance_to_campus_m: 800 }
              as: PropertyManager
              as_user_id: "mgr-1"
              captures: { p1: $.data.id }
            - call: "POST /properties"
              payload: { university_id: "${uni_su}", name: "Oak Lofts", address_line: "9 Oak Ave", distance_to_campus_m: 400 }
              as: PropertyManager
              as_user_id: "mgr-1"
              captures: { p2: $.data.id }
            - call: "POST /properties"
              payload: { university_id: "${uni_su}", name: "Birch House", address_line: "44 Birch Rd", distance_to_campus_m: 1500 }
              as: PropertyManager
              as_user_id: "mgr-1"
              captures: { p3: $.data.id }
          trigger:
            - call: "GET /properties"
              payload: { university_id: "${uni_su}", limit: 2, offset: 0 }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { first_page_head: "$.data[0].id" }
            - call: "GET /properties"
              payload: { university_id: "${uni_su}", limit: 2, offset: 2 }
              as: PlatformAdmin
              as_user_id: "admin-1"
          assert:
            - "first page: response_type == array, 2 rows, total_count == 3, has_more == true, limit == 2, offset == 0"
            - "first page data[0].id == ${p1} and data[1].id == ${p2} (created_at ASC ordering)"
            - "second page: 1 row with id == ${p3}, total_count == 3, has_more == false"

      - name: unit_missing_required_bed_labels_rejected
        claim_type: Required Fields
        grounds:
          - entities.Unit.fields.bed_labels
          - validations[priority=6]
          - errors[ERR_VALIDATION]
        distinguishing_aspect: "POST /units without bed_labels returns HTTP 400 ERR_VALIDATION and creates no Unit, leaving Property.unit_count at 0."
        test_recipe:
          setup:
            - "One university and one DRAFT property."
          setup_api_calls:
            - call: "POST /universities"
              payload: { name: "State University", code: "SU", partner_tier: "PREFERRED", verification_required: true, academic_year_start_date: "2026-08-15", academic_year_end_date: "2027-05-15", partner_admin_user_id: "uni-admin-su" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { uni_su: $.data.id }
            - call: "POST /properties"
              payload: { university_id: "${uni_su}", name: "Maple Commons", address_line: "12 Maple St", distance_to_campus_m: 800 }
              as: PropertyManager
              as_user_id: "mgr-1"
              captures: { prop1: $.data.id }
          trigger:
            - call: "POST /units"
              payload: { property_id: "${prop1}", unit_number: "101", floorplan_code: "4x2", bedroom_count: 4, bathroom_count: 2, base_rent_cents_per_bed_monthly: 90000 }
              as: PropertyManager
              as_user_id: "mgr-1"
              captures: { req_err: $.data.error_id }
          assert:
            - "HTTP 400 with error_id == ERR_VALIDATION"
            - "GET /units?property_id=${prop1} returns 0 rows with total_count == 0"
            - "Property.${prop1}.unit_count == 0"

      - name: unit_bed_labels_length_must_match_bedroom_count
        claim_type: Type Constraints
        grounds:
          - validations[priority=33]
          - errors[ERR_BED_LABELS_MISMATCH]
          - entities.Unit.fields.bedroom_count
        distinguishing_aspect: "bedroom_count 4 with only three bed labels is refused with HTTP 422 ERR_BED_LABELS_MISMATCH, distinct from the generic ERR_VALIDATION path."
        test_recipe:
          setup:
            - "One university and one DRAFT property."
          setup_api_calls:
            - call: "POST /universities"
              payload: { name: "State University", code: "SU", partner_tier: "PREFERRED", verification_required: true, academic_year_start_date: "2026-08-15", academic_year_end_date: "2027-05-15", partner_admin_user_id: "uni-admin-su" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { uni_su: $.data.id }
            - call: "POST /properties"
              payload: { university_id: "${uni_su}", name: "Maple Commons", address_line: "12 Maple St", distance_to_campus_m: 800 }
              as: PropertyManager
              as_user_id: "mgr-1"
              captures: { prop1: $.data.id }
          trigger:
            - call: "POST /units"
              payload: { property_id: "${prop1}", unit_number: "101", floorplan_code: "4x2", bedroom_count: 4, bathroom_count: 2, bed_labels: ["A", "B", "C"], base_rent_cents_per_bed_monthly: 90000 }
              as: PropertyManager
              as_user_id: "mgr-1"
              captures: { mismatch_err: $.data.error_id }
          assert:
            - "HTTP 422 with error_id == ERR_BED_LABELS_MISMATCH"
            - "Property.${prop1}.unit_count == 0"

      - name: unit_number_unique_within_property_but_free_across_properties
        claim_type: Type Constraints
        grounds:
          - validations[priority=32]
          - errors[ERR_DUPLICATE_UNIT_NUMBER]
        distinguishing_aspect: "Unit number 101 may exist once per property: the second 101 on the same property is refused with HTTP 409 ERR_DUPLICATE_UNIT_NUMBER while 101 on a different property succeeds."
        test_recipe:
          setup:
            - "One university and two DRAFT properties, the first already holding unit 101."
          setup_api_calls:
            - call: "POST /universities"
              payload: { name: "State University", code: "SU", partner_tier: "PREFERRED", verification_required: true, academic_year_start_date: "2026-08-15", academic_year_end_date: "2027-05-15", partner_admin_user_id: "uni-admin-su" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { uni_su: $.data.id }
            - call: "POST /properties"
              payload: { university_id: "${uni_su}", name: "Maple Commons", address_line: "12 Maple St", distance_to_campus_m: 800 }
              as: PropertyManager
              as_user_id: "mgr-1"
              captures: { prop1: $.data.id }
            - call: "POST /properties"
              payload: { university_id: "${uni_su}", name: "Birch House", address_line: "44 Birch Rd", distance_to_campus_m: 1500 }
              as: PropertyManager
              as_user_id: "mgr-1"
              captures: { prop2: $.data.id }
            - call: "POST /units"
              payload: { property_id: "${prop1}", unit_number: "101", floorplan_code: "4x2", bedroom_count: 4, bathroom_count: 2, bed_labels: ["A", "B", "C", "D"], base_rent_cents_per_bed_monthly: 90000 }
              as: PropertyManager
              as_user_id: "mgr-1"
              captures: { unit1: $.data.id }
          trigger:
            - call: "POST /units"
              payload: { property_id: "${prop1}", unit_number: "101", floorplan_code: "2x1", bedroom_count: 2, bathroom_count: 1, bed_labels: ["A", "B"], base_rent_cents_per_bed_monthly: 70000 }
              as: PropertyManager
              as_user_id: "mgr-1"
              captures: { dup_err: $.data.error_id }
            - call: "POST /units"
              payload: { property_id: "${prop2}", unit_number: "101", floorplan_code: "2x1", bedroom_count: 2, bathroom_count: 1, bed_labels: ["A", "B"], base_rent_cents_per_bed_monthly: 70000 }
              as: PropertyManager
              as_user_id: "mgr-1"
              captures: { unit_p2: $.data.id }
          assert:
            - "the same-property duplicate returns HTTP 409 with error_id == ERR_DUPLICATE_UNIT_NUMBER"
            - "the other-property call returns HTTP 201 with Unit.${unit_p2}.unit_number == 101"
            - "Property.${prop1}.unit_count == 1 and Property.${prop1}.total_bed_count == 4"
            - "Property.${prop2}.unit_count == 1 and Property.${prop2}.total_bed_count == 2"

      - name: student_defaults_credit_band_and_smoker_flag
        claim_type: Defaults
        grounds:
          - entities.Student.fields.credit_score_band
          - entities.Student.fields.smoker
          - entities.Student.fields.verification_status
        distinguishing_aspect: "Omitting credit_score_band and smoker yields FAIR and false, and verification_status starts at UNVERIFIED with all three verification timestamps null."
        test_recipe:
          setup:
            - "One university registered."
          setup_api_calls:
            - call: "POST /universities"
              payload: { name: "State University", code: "SU", partner_tier: "PREFERRED", verification_required: true, academic_year_start_date: "2026-08-15", academic_year_end_date: "2027-05-15", partner_admin_user_id: "uni-admin-su" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { uni_su: $.data.id }
          trigger:
            - call: "POST /students"
              payload: { university_id: "${uni_su}", full_name: "Plain Jane", email: "jane@su.edu", cleanliness_level: 3, noise_tolerance: 3, sleep_schedule: "EARLY" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { sj: $.data.id }
          assert:
            - "HTTP 201 with Student.${sj}.credit_score_band == FAIR and Student.${sj}.smoker == false"
            - "Student.${sj}.verification_status == UNVERIFIED"
            - "Student.${sj}.verification_submitted_at, verification_expires_at and verification_decided_at are all null"

      - name: student_invalid_enum_and_out_of_range_rejected
        claim_type: Type Constraints
        grounds:
          - entities.Student.fields.sleep_schedule
          - entities.Student.fields.cleanliness_level
          - validations[priority=6]
          - errors[ERR_VALIDATION]
        distinguishing_aspect: "sleep_schedule MIDDAY is not a declared enum member and cleanliness_level 9 is outside 1-5; both are refused with HTTP 400 ERR_VALIDATION."
        test_recipe:
          setup:
            - "One university registered."
          setup_api_calls:
            - call: "POST /universities"
              payload: { name: "State University", code: "SU", partner_tier: "PREFERRED", verification_required: true, academic_year_start_date: "2026-08-15", academic_year_end_date: "2027-05-15", partner_admin_user_id: "uni-admin-su" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { uni_su: $.data.id }
          trigger:
            - call: "POST /students"
              payload: { university_id: "${uni_su}", full_name: "Bad Enum", email: "bad@su.edu", cleanliness_level: 3, noise_tolerance: 3, sleep_schedule: "MIDDAY" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { enum_err: $.data.error_id }
            - call: "POST /students"
              payload: { university_id: "${uni_su}", full_name: "Bad Range", email: "range@su.edu", cleanliness_level: 9, noise_tolerance: 3, sleep_schedule: "EARLY" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { range_err: $.data.error_id }
          assert:
            - "both calls return HTTP 400 with error_id == ERR_VALIDATION"
            - "GET /students?university_id=${uni_su} returns 0 rows with total_count == 0"

      - name: student_email_uniqueness_enforced
        claim_type: Type Constraints
        grounds:
          - entities.Student.fields.email
          - validations[priority=31]
          - errors[ERR_EMAIL_TAKEN]
        distinguishing_aspect: "A second student reusing ava@su.edu is refused with HTTP 409 ERR_EMAIL_TAKEN even when every other field differs."
        test_recipe:
          setup:
            - "One university and one student already using ava@su.edu."
          setup_api_calls:
            - call: "POST /universities"
              payload: { name: "State University", code: "SU", partner_tier: "PREFERRED", verification_required: true, academic_year_start_date: "2026-08-15", academic_year_end_date: "2027-05-15", partner_admin_user_id: "uni-admin-su" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { uni_su: $.data.id }
            - call: "POST /students"
              payload: { university_id: "${uni_su}", full_name: "Ava Lead", email: "ava@su.edu", credit_score_band: "GOOD", cleanliness_level: 4, noise_tolerance: 3, sleep_schedule: "EARLY", smoker: false }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { s1: $.data.id }
          trigger:
            - call: "POST /students"
              payload: { university_id: "${uni_su}", full_name: "Ava Clone", email: "ava@su.edu", credit_score_band: "THIN", cleanliness_level: 1, noise_tolerance: 5, sleep_schedule: "LATE", smoker: true }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { email_err: $.data.error_id }
          assert:
            - "HTTP 409 with error_id == ERR_EMAIL_TAKEN"
            - "GET /students?university_id=${uni_su} returns exactly 1 row"

      - name: student_create_with_unknown_university_returns_not_found
        claim_type: Parent Relationships
        grounds:
          - entities.Student.fields.university_id
          - validations[priority=4]
          - errors[ERR_UNIVERSITY_NOT_FOUND]
        distinguishing_aspect: "A body-level foreign key to a non-existent University is caught by the priority-4 existence rule with HTTP 404 ERR_UNIVERSITY_NOT_FOUND, not by ERR_VALIDATION."
        test_recipe:
          setup:
            - "One unrelated university exists so the collection is non-empty."
          setup_api_calls:
            - call: "POST /universities"
              payload: { name: "State University", code: "SU", partner_tier: "PREFERRED", verification_required: true, academic_year_start_date: "2026-08-15", academic_year_end_date: "2027-05-15", partner_admin_user_id: "uni-admin-su" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { uni_su: $.data.id }
          trigger:
            - call: "POST /students"
              payload: { university_id: "00000000-0000-4000-8000-000000000000", full_name: "Ghost Student", email: "ghost@nowhere.edu", cleanliness_level: 3, noise_tolerance: 3, sleep_schedule: "EARLY" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { fk_err: $.data.error_id }
          assert:
            - "HTTP 404 with error_id == ERR_UNIVERSITY_NOT_FOUND"
            - "no Student row is created"

      - name: lease_rent_snapshot_and_system_fields_are_server_minted
        claim_type: System Fields
        grounds:
          - entities.Lease.fields.monthly_rent_cents
          - entities.Lease.fields.guarantor_required
          - calculations.lease_guarantor_requirement
        distinguishing_aspect: "Lease.monthly_rent_cents is computed as a snapshot of Unit.base_rent_cents_per_bed_monthly (90000) and drives guarantor_required false for a GOOD-credit student; id, created_at, updated_at, version, property_id and both status axes are server-assigned."
        test_recipe:
          setup:
            - "PREFERRED university SU, LISTED property with a 4-bed unit at 90000 cents per bed."
            - "One VERIFIED student."
          setup_api_calls:
            - call: "POST /universities"
              payload: { name: "State University", code: "SU", partner_tier: "PREFERRED", verification_required: true, academic_year_start_date: "2026-08-15", academic_year_end_date: "2027-05-15", partner_admin_user_id: "uni-admin-su" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { uni_su: $.data.id }
            - call: "POST /properties"
              payload: { university_id: "${uni_su}", name: "Maple Commons", address_line: "12 Maple St", distance_to_campus_m: 800 }
              as: PropertyManager
              as_user_id: "mgr-1"
              captures: { prop1: $.data.id }
            - call: "POST /units"
              payload: { property_id: "${prop1}", unit_number: "101", floorplan_code: "4x2", bedroom_count: 4, bathroom_count: 2, bed_labels: ["A", "B", "C", "D"], base_rent_cents_per_bed_monthly: 90000 }
              as: PropertyManager
              as_user_id: "mgr-1"
              captures: { unit1: $.data.id }
            - call: "POST /properties/${prop1}/list"
              payload: {}
              as: PropertyManager
              as_user_id: "mgr-1"
            - call: "POST /students"
