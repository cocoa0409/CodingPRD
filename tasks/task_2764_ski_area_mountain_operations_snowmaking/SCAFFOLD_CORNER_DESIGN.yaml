      - name: the_waitlist_promotion_sweep_does_not_stop_at_the_first_candidate_that_still_does_not_fit
        claim_type: correct_result
        grounds:
          - calculations.waitlist_promotion
          - state_machines.AccessReservation.WAITLISTED_to_CONFIRMED
          - entities.DayPlan.fields.parking_stalls_used
        distinguishing_aspect: |
          The sweep walks the whole WAITLISTED set in created_at ASC order and skips - never stops on -
          a candidate that still does not fit. The day is built so the earliest waitlisted party needs 5
          stalls out of a 4 stall lot and can therefore never be promoted, while the party behind it
          needs 1. A short-circuiting implementation promotes nobody; a party_size-packing
          implementation promotes the wrong one. Only a created_at ordered skip-and-continue sweep
          promotes W2 alone.
        test_recipe:
          setup:
            - "An open mountain with guest_capacity 12 and 4 parking stalls."
            - "C1 (SEASON, 6 guests, 4 vehicles) is CONFIRMED and holds every stall."
            - "W1 (3 guests, 5 vehicles) and W2 (2 guests, 1 vehicle) are WAITLISTED for PARKING, in that created_at order."
