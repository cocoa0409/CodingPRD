# =============================================================================
# §1.8 Scaffold Difficulty Design — Test Targeting Index
# Each rule_id maps to §0.5; ≥2 instances each → ≥18 total.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: claim_billed_provisional_vs_final_diverges_on_short_delivery
        grounds:
          - calculations.claim_billed
          - entities.Claim.fields.billed_cents
          - state_machines.Claim.DRAFT_to_SUBMITTED
        distinguishing_aspect: |
          On the Claim/TherapySession domain, billed_cents at create uses
          scheduled_units (25600) but at SUBMITTED uses delivered_units (22400);
          the two variants diverge by exactly 3200 cents because delivered (7) < scheduled (8).
        test_recipe:
          setup:
            - "A DIRECT_THERAPY session scheduled for 8 units, delivered with 7 actual units, on an ACTIVE authorization."
            - "Supervision already COMPLIANT is not required for create/submit (only for pay)."
          setup_api_calls:
            - call: "POST /payers"
              payload: { name: "Aetna ABA", allowed_rate_cents: 2800, coinsurance_pct: 0.20, supervision_ratio_pct: 0.10 }
              as: BillingSpecialist
              captures: { payer_id: $.data.id }
            - call: "POST /providers"
              payload: { full_name: "Dr BCBA", credential: "BCBA", npi: "1000000001" }
              as: IntakeCoordinator
              captures: { bcba_id: $.data.id }
            - call: "POST /providers"
              payload: { full_name: "RBT One", credential: "RBT", npi: "1000000002", supervising_bcba_id: "${bcba_id}" }
              as: IntakeCoordinator
              captures: { rbt_id: $.data.id }
            - call: "POST /clients"
              payload: { full_name: "Child A", date_of_birth: "2019-03-01", caregiver_user_id: "cg-1", insurance_payer_id: "${payer_id}" }
              as: IntakeCoordinator
              captures: { client_id: $.data.id }
            - call: "POST /diagnostic-evaluations"
              payload: { client_id: "${client_id}", evaluator_bcba_id: "${bcba_id}", assessment_score: 130 }
              as: BCBA
              as_user_id: "${bcba_id}"
              captures: { eval_id: $.data.id }
            - call: "POST /diagnostic-evaluations/${eval_id}/submit"
              payload: {}
              as: BCBA
              as_user_id: "${bcba_id}"
            - call: "POST /diagnostic-evaluations/${eval_id}/review"
              payload: { decision: "FINALIZE" }
              as: IntakeCoordinator
            - call: "POST /treatment-plans"
              payload: { client_id: "${client_id}", evaluation_id: "${eval_id}", author_bcba_id: "${bcba_id}", requested_direct_units: 320, requested_supervision_units: 64, requested_parent_training_units: 32 }
              as: BCBA
              as_user_id: "${bcba_id}"
              captures: { plan_id: $.data.id }
            - call: "POST /treatment-plans/${plan_id}/submit"
              payload: {}
              as: BCBA
              as_user_id: "${bcba_id}"
            - call: "POST /treatment-plans/${plan_id}/review"
              payload: { decision: "APPROVE" }
              as: IntakeCoordinator
            - call: "POST /authorizations"
              payload: { treatment_plan_id: "${plan_id}", payer_id: "${payer_id}", authorized_direct_units: 320, authorized_supervision_units: 64, authorized_parent_training_units: 32, period_start: "2026-01-01", period_end: "2026-12-31" }
              as: BillingSpecialist
              captures: { auth_id: $.data.id }
            - call: "POST /therapy-sessions"
              payload: { authorization_id: "${auth_id}", provider_id: "${rbt_id}", service_line: "DIRECT_THERAPY", scheduled_start: "2026-02-02T09:00:00Z", scheduled_end: "2026-02-02T11:00:00Z", scheduled_units: 8 }
              as: RBT
              as_user_id: "${rbt_id}"
              captures: { sess_id: $.data.id }
            - call: "POST /therapy-sessions/${sess_id}/deliver"
              payload: { delivered_units: 7 }
              as: RBT
              as_user_id: "${rbt_id}"
            - call: "POST /claims"
              payload: { session_id: "${sess_id}" }
              as: BillingSpecialist
              captures: { claim_id: $.data.id, billed_provisional: $.data.billed_cents }
          trigger:
            - call: "POST /claims/${claim_id}/submit"
              payload: {}
              as: BillingSpecialist
              captures: { billed_final: $.data.billed_cents }
          assert:
            - "Claim.${claim_id}.billed_cents == 25600 immediately after create (provisional, scheduled-unit basis)"
            - "Claim.${claim_id}.billed_cents == 22400 after submit (final, delivered-unit basis)"
            - "provisional - final == 3200"

      - name: authorization_pool_reservation_vs_delivered_basis_returns_units
        grounds:
          - calculations.authorization_pool_ledger
          - entities.Authorization.fields.remaining_direct_units
          - state_machines.TherapySession.SCHEDULED_to_DELIVERED
        distinguishing_aspect: |
          On the Authorization domain (different entity from claim_billed),
          remaining_direct_units under reservation_basis is 312 (scheduled 8 held)
          but under delivered_basis is 313 (only 7 committed); the two bases diverge
          by the 1 unit returned to the pool on short delivery.
        test_recipe:
          setup:
            - "Authorization with authorized_direct_units=320; one DIRECT session scheduled 8 then delivered 7."
          setup_api_calls:
            - call: "POST /payers"
              payload: { name: "Cigna ABA", allowed_rate_cents: 2800, coinsurance_pct: 0.20, supervision_ratio_pct: 0.10 }
              as: BillingSpecialist
              captures: { payer_id: $.data.id }
            - call: "POST /providers"
              payload: { full_name: "Dr BCBA2", credential: "BCBA", npi: "1000000010" }
              as: IntakeCoordinator
              captures: { bcba_id: $.data.id }
            - call: "POST /providers"
              payload: { full_name: "RBT Two", credential: "RBT", npi: "1000000011", supervising_bcba_id: "${bcba_id}" }
              as: IntakeCoordinator
              captures: { rbt_id: $.data.id }
            - call: "POST /clients"
              payload: { full_name: "Child B", date_of_birth: "2018-06-15", caregiver_user_id: "cg-2", insurance_payer_id: "${payer_id}" }
              as: IntakeCoordinator
              captures: { client_id: $.data.id }
            - call: "POST /diagnostic-evaluations"
              payload: { client_id: "${client_id}", evaluator_bcba_id: "${bcba_id}", assessment_score: 130 }
              as: BCBA
              as_user_id: "${bcba_id}"
              captures: { eval_id: $.data.id }
            - call: "POST /diagnostic-evaluations/${eval_id}/submit"
              payload: {}
              as: BCBA
              as_user_id: "${bcba_id}"
            - call: "POST /diagnostic-evaluations/${eval_id}/review"
              payload: { decision: "FINALIZE" }
              as: IntakeCoordinator
            - call: "POST /treatment-plans"
              payload: { client_id: "${client_id}", evaluation_id: "${eval_id}", author_bcba_id: "${bcba_id}", requested_direct_units: 320, requested_supervision_units: 64, requested_parent_training_units: 32 }
              as: BCBA
              as_user_id: "${bcba_id}"
              captures: { plan_id: $.data.id }
            - call: "POST /treatment-plans/${plan_id}/submit"
              payload: {}
              as: BCBA
              as_user_id: "${bcba_id}"
            - call: "POST /treatment-plans/${plan_id}/review"
              payload: { decision: "APPROVE" }
              as: IntakeCoordinator
            - call: "POST /authorizations"
              payload: { treatment_plan_id: "${plan_id}", payer_id: "${payer_id}", authorized_direct_units: 320, authorized_supervision_units: 64, authorized_parent_training_units: 32, period_start: "2026-01-01", period_end: "2026-12-31" }
              as: BillingSpecialist
              captures: { auth_id: $.data.id }
            - call: "POST /therapy-sessions"
              payload: { authorization_id: "${auth_id}", provider_id: "${rbt_id}", service_line: "DIRECT_THERAPY", scheduled_start: "2026-02-02T09:00:00Z", scheduled_end: "2026-02-02T11:00:00Z", scheduled_units: 8 }
              as: RBT
              as_user_id: "${rbt_id}"
              captures: { sess_id: $.data.id }
          trigger:
            - call: "POST /therapy-sessions/${sess_id}/deliver"
              payload: { delivered_units: 7 }
              as: RBT
              as_user_id: "${rbt_id}"
          assert:
            - "GET /authorizations/${auth_id} shows remaining_direct_units == 312 after schedule (reservation_basis: 320-8)"
            - "GET /authorizations/${auth_id} shows reserved_direct_units == 0 and delivered_direct_units == 7 and remaining_direct_units == 313 after deliver (delivered_basis: 320-7)"
            - "reservation_basis remaining (312) != delivered_basis remaining (313); difference == 1 returned unit"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: claim_remittance_rounds_patient_share_first_then_subtracts
        grounds:
          - calculations.claim_remittance
          - entities.Claim.fields.patient_responsibility_cents
          - entities.Claim.fields.payer_paid_cents
          - state_machines.Claim.SUBMITTED_to_PAID
        distinguishing_aspect: |
          Mode (b) nested-rounding-order: patient_responsibility_cents is
          round_half_up(allowed * coinsurance) computed FIRST, then payer_paid is
          the remainder; with allowed=13750 and coins=0.15 the product 2062.5 rounds
          UP to 2063 and payer_paid=11687 — summing-then-rounding would give 11688.
        test_recipe:
          setup:
            - "Payer allowed_rate_cents=2750, coinsurance_pct=0.15; a DIRECT session delivered 5 units; supervision COMPLIANT; claim submitted then paid."
          setup_api_calls:
            - call: "POST /payers"
              payload: { name: "United ABA", allowed_rate_cents: 2750, coinsurance_pct: 0.15, supervision_ratio_pct: 0.10 }
              as: BillingSpecialist
              captures: { payer_id: $.data.id }
            - call: "POST /providers"
              payload: { full_name: "Dr BCBA3", credential: "BCBA", npi: "1000000020" }
              as: IntakeCoordinator
              captures: { bcba_id: $.data.id }
            - call: "POST /providers"
              payload: { full_name: "RBT Three", credential: "RBT", npi: "1000000021", supervising_bcba_id: "${bcba_id}" }
              as: IntakeCoordinator
              captures: { rbt_id: $.data.id }
            - call: "POST /clients"
              payload: { full_name: "Child C", date_of_birth: "2017-09-09", caregiver_user_id: "cg-3", insurance_payer_id: "${payer_id}" }
              as: IntakeCoordinator
              captures: { client_id: $.data.id }
            - call: "POST /diagnostic-evaluations"
              payload: { client_id: "${client_id}", evaluator_bcba_id: "${bcba_id}", assessment_score: 70 }
              as: BCBA
              as_user_id: "${bcba_id}"
              captures: { eval_id: $.data.id }
            - call: "POST /diagnostic-evaluations/${eval_id}/submit"
              payload: {}
              as: BCBA
              as_user_id: "${bcba_id}"
            - call: "POST /diagnostic-evaluations/${eval_id}/review"
              payload: { decision: "FINALIZE" }
              as: IntakeCoordinator
            - call: "POST /treatment-plans"
              payload: { client_id: "${client_id}", evaluation_id: "${eval_id}", author_bcba_id: "${bcba_id}", requested_direct_units: 100, requested_supervision_units: 20, requested_parent_training_units: 8 }
              as: BCBA
              as_user_id: "${bcba_id}"
              captures: { plan_id: $.data.id }
            - call: "POST /treatment-plans/${plan_id}/submit"
              payload: {}
              as: BCBA
              as_user_id: "${bcba_id}"
            - call: "POST /treatment-plans/${plan_id}/review"
              payload: { decision: "APPROVE" }
              as: IntakeCoordinator
            - call: "POST /authorizations"
              payload: { treatment_plan_id: "${plan_id}", payer_id: "${payer_id}", authorized_direct_units: 100, authorized_supervision_units: 20, authorized_parent_training_units: 8, period_start: "2026-01-01", period_end: "2026-12-31" }
              as: BillingSpecialist
              captures: { auth_id: $.data.id }
            - call: "POST /therapy-sessions"
              payload: { authorization_id: "${auth_id}", provider_id: "${rbt_id}", service_line: "DIRECT_THERAPY", scheduled_start: "2026-03-02T09:00:00Z", scheduled_end: "2026-03-02T10:15:00Z", scheduled_units: 5 }
              as: RBT
              as_user_id: "${rbt_id}"
              captures: { direct_sess_id: $.data.id }
            - call: "POST /therapy-sessions/${direct_sess_id}/deliver"
              payload: { delivered_units: 5 }
              as: RBT
              as_user_id: "${rbt_id}"
            - call: "POST /therapy-sessions"
              payload: { authorization_id: "${auth_id}", provider_id: "${bcba_id}", service_line: "SUPERVISION", scheduled_start: "2026-03-02T11:00:00Z", scheduled_end: "2026-03-02T11:30:00Z", scheduled_units: 2 }
              as: BCBA
              as_user_id: "${bcba_id}"
              captures: { sup_sess_id: $.data.id }
            - call: "POST /therapy-sessions/${sup_sess_id}/deliver"
              payload: { delivered_units: 1 }
              as: BCBA
              as_user_id: "${bcba_id}"
            - call: "POST /claims"
              payload: { session_id: "${direct_sess_id}" }
              as: BillingSpecialist
              captures: { claim_id: $.data.id }
            - call: "POST /claims/${claim_id}/submit"
              payload: {}
              as: BillingSpecialist
          trigger:
            - call: "POST /claims/${claim_id}/adjudicate"
              payload: { decision: "PAY" }
              as: BillingSpecialist
          assert:
            - "Claim.${claim_id}.allowed_cents == 13750 (5 * 2750)"
            - "Claim.${claim_id}.patient_responsibility_cents == 2063 (round_half_up(13750*0.15))"
            - "Claim.${claim_id}.payer_paid_cents == 11687 (13750 - 2063)"

      - name: supervision_ratio_nonlinear_ceiling_over_three_inputs
        grounds:
          - calculations.supervision_ratio
          - entities.Authorization.fields.supervision_status
          - state_machines.TherapySession.SCHEDULED_to_DELIVERED
        distinguishing_aspect: |
          Mode (a) ≥3-input non-linear: required_supervision_units =
          ceil(delivered_direct_units * supervision_ratio_pct) combines two
          Authorization counters and one Payer rate through a ceiling; with
          delivered_direct=81 and ratio=0.10 the ceiling jumps the requirement
          from 8 to 9, a discontinuity no linear formula reproduces.
        test_recipe:
          setup:
            - "Authorization with 81 delivered direct units and 8 delivered supervision units; payer ratio 0.10."
          setup_api_calls:
            - call: "POST /payers"
              payload: { name: "BCBS ABA", allowed_rate_cents: 2800, coinsurance_pct: 0.20, supervision_ratio_pct: 0.10 }
              as: BillingSpecialist
              captures: { payer_id: $.data.id }
            - call: "POST /providers"
              payload: { full_name: "Dr BCBA4", credential: "BCBA", npi: "1000000030" }
              as: IntakeCoordinator
              captures: { bcba_id: $.data.id }
            - call: "POST /providers"
              payload: { full_name: "RBT Four", credential: "RBT", npi: "1000000031", supervising_bcba_id: "${bcba_id}" }
              as: IntakeCoordinator
              captures: { rbt_id: $.data.id }
            - call: "POST /clients"
              payload: { full_name: "Child D", date_of_birth: "2016-12-12", caregiver_user_id: "cg-4", insurance_payer_id: "${payer_id}" }
              as: IntakeCoordinator
              captures: { client_id: $.data.id }
            - call: "POST /diagnostic-evaluations"
              payload: { client_id: "${client_id}", evaluator_bcba_id: "${bcba_id}", assessment_score: 130 }
              as: BCBA
              as_user_id: "${bcba_id}"
              captures: { eval_id: $.data.id }
            - call: "POST /diagnostic-evaluations/${eval_id}/submit"
              payload: {}
              as: BCBA
              as_user_id: "${bcba_id}"
            - call: "POST /diagnostic-evaluations/${eval_id}/review"
              payload: { decision: "FINALIZE" }
              as: IntakeCoordinator
            - call: "POST /treatment-plans"
              payload: { client_id: "${client_id}", evaluation_id: "${eval_id}", author_bcba_id: "${bcba_id}", requested_direct_units: 200, requested_supervision_units: 40, requested_parent_training_units: 16 }
              as: BCBA
              as_user_id: "${bcba_id}"
              captures: { plan_id: $.data.id }
            - call: "POST /treatment-plans/${plan_id}/submit"
              payload: {}
              as: BCBA
              as_user_id: "${bcba_id}"
            - call: "POST /treatment-plans/${plan_id}/review"
              payload: { decision: "APPROVE" }
              as: IntakeCoordinator
            - call: "POST /authorizations"
              payload: { treatment_plan_id: "${plan_id}", payer_id: "${payer_id}", authorized_direct_units: 200, authorized_supervision_units: 40, authorized_parent_training_units: 16, period_start: "2026-01-01", period_end: "2026-12-31" }
              as: BillingSpecialist
              captures: { auth_id: $.data.id }
            - call: "POST /therapy-sessions"
              payload: { authorization_id: "${auth_id}", provider_id: "${rbt_id}", service_line: "DIRECT_THERAPY", scheduled_start: "2026-04-01T09:00:00Z", scheduled_end: "2026-04-02T05:15:00Z", scheduled_units: 81 }
              as: RBT
              as_user_id: "${rbt_id}"
              captures: { direct_sess_id: $.data.id }
            - call: "POST /therapy-sessions/${direct_sess_id}/deliver"
              payload: { delivered_units: 81 }
              as: RBT
              as_user_id: "${rbt_id}"
            - call: "POST /therapy-sessions"
              payload: { authorization_id: "${auth_id}", provider_id: "${bcba_id}", service_line: "SUPERVISION", scheduled_start: "2026-04-02T09:00:00Z", scheduled_end: "2026-04-02T11:00:00Z", scheduled_units: 8 }
              as: BCBA
              as_user_id: "${bcba_id}"
              captures: { sup_sess_id: $.data.id }
          trigger:
            - call: "POST /therapy-sessions/${sup_sess_id}/deliver"
              payload: { delivered_units: 8 }
              as: BCBA
              as_user_id: "${bcba_id}"
          assert:
            - "GET /authorizations/${auth_id} shows delivered_direct_units == 81 and delivered_supervision_units == 8"
            - "required_supervision_units == ceil(81 * 0.10) == 9"
            - "GET /authorizations/${auth_id} shows supervision_status == DEFICIENT (8 < 9)"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: treatment_plan_revision_cycle_submitted_revision_submitted
        grounds:
          - state_machines.TreatmentPlan.SUBMITTED_to_REVISION_REQUESTED
          - state_machines.TreatmentPlan.REVISION_REQUESTED_to_SUBMITTED
          - entities.TreatmentPlan.fields.status
        distinguishing_aspect: |
          On TreatmentPlan, the machine cycles SUBMITTED -> REVISION_REQUESTED ->
          SUBMITTED (a revision loop), so the same plan re-enters SUBMITTED after a
          revision request — not a linear A->B->C pipeline.
        test_recipe:
          setup:
            - "A submitted plan that is sent back for revision then re-submitted, returning to SUBMITTED."
          setup_api_calls:
            - call: "POST /payers"
              payload: { name: "Humana ABA", allowed_rate_cents: 2800, coinsurance_pct: 0.20, supervision_ratio_pct: 0.10 }
              as: BillingSpecialist
              captures: { payer_id: $.data.id }
            - call: "POST /providers"
              payload: { full_name: "Dr BCBA5", credential: "BCBA", npi: "1000000040" }
              as: IntakeCoordinator
              captures: { bcba_id: $.data.id }
            - call: "POST /clients"
              payload: { full_name: "Child E", date_of_birth: "2019-01-01", caregiver_user_id: "cg-5", insurance_payer_id: "${payer_id}" }
              as: IntakeCoordinator
              captures: { client_id: $.data.id }
            - call: "POST /diagnostic-evaluations"
              payload: { client_id: "${client_id}", evaluator_bcba_id: "${bcba_id}", assessment_score: 70 }
              as: BCBA
              as_user_id: "${bcba_id}"
              captures: { eval_id: $.data.id }
            - call: "POST /diagnostic-evaluations/${eval_id}/submit"
              payload: {}
              as: BCBA
              as_user_id: "${bcba_id}"
            - call: "POST /diagnostic-evaluations/${eval_id}/review"
              payload: { decision: "FINALIZE" }
              as: IntakeCoordinator
            - call: "POST /treatment-plans"
              payload: { client_id: "${client_id}", evaluation_id: "${eval_id}", author_bcba_id: "${bcba_id}", requested_direct_units: 100, requested_supervision_units: 20, requested_parent_training_units: 8 }
              as: BCBA
              as_user_id: "${bcba_id}"
              captures: { plan_id: $.data.id }
            - call: "POST /treatment-plans/${plan_id}/submit"
              payload: {}
              as: BCBA
              as_user_id: "${bcba_id}"
            - call: "POST /treatment-plans/${plan_id}/review"
              payload: { decision: "REQUEST_REVISION" }
              as: IntakeCoordinator
          trigger:
            - call: "POST /treatment-plans/${plan_id}/submit"
              payload: {}
              as: BCBA
              as_user_id: "${bcba_id}"
              captures: { status_after: $.data.status }
          assert:
            - "TreatmentPlan.${plan_id}.status == REVISION_REQUESTED after the review step"
            - "TreatmentPlan.${plan_id}.status == SUBMITTED after the re-submit (loop back into SUBMITTED)"

      - name: authorization_exhausted_active_cycle_on_free_units
        grounds:
          - state_machines.Authorization.ACTIVE_to_EXHAUSTED
          - state_machines.Authorization.EXHAUSTED_to_ACTIVE
          - entities.Authorization.fields.status
        distinguishing_aspect: |
          On Authorization (a different entity from TreatmentPlan), the machine
          cycles ACTIVE -> EXHAUSTED -> ACTIVE when a freed reservation restores the
          pool — a back-edge, so the shape is non-linear on a second entity.
        test_recipe:
          setup:
            - "Authorization with authorized_direct_units=12; session A=8 scheduled (remaining 4), session B=4 scheduled (remaining 0 -> EXHAUSTED); cancelling B frees 4 units -> back to ACTIVE."
          setup_api_calls:
            - call: "POST /payers"
              payload: { name: "Kaiser ABA", allowed_rate_cents: 2800, coinsurance_pct: 0.20, supervision_ratio_pct: 0.10 }
              as: BillingSpecialist
              captures: { payer_id: $.data.id }
            - call: "POST /providers"
              payload: { full_name: "Dr BCBA6", credential: "BCBA", npi: "1000000050" }
              as: IntakeCoordinator
              captures: { bcba_id: $.data.id }
            - call: "POST /providers"
              payload: { full_name: "RBT Six", credential: "RBT", npi: "1000000051", supervising_bcba_id: "${bcba_id}" }
              as: IntakeCoordinator
              captures: { rbt_id: $.data.id }
            - call: "POST /clients"
              payload: { full_name: "Child F", date_of_birth: "2018-02-02", caregiver_user_id: "cg-6", insurance_payer_id: "${payer_id}" }
              as: IntakeCoordinator
              captures: { client_id: $.data.id }
            - call: "POST /diagnostic-evaluations"
              payload: { client_id: "${client_id}", evaluator_bcba_id: "${bcba_id}", assessment_score: 30 }
              as: BCBA
              as_user_id: "${bcba_id}"
              captures: { eval_id: $.data.id }
            - call: "POST /diagnostic-evaluations/${eval_id}/submit"
              payload: {}
              as: BCBA
              as_user_id: "${bcba_id}"
            - call: "POST /diagnostic-evaluations/${eval_id}/review"
              payload: { decision: "FINALIZE" }
              as: IntakeCoordinator
            - call: "POST /treatment-plans"
              payload: { client_id: "${client_id}", evaluation_id: "${eval_id}", author_bcba_id: "${bcba_id}", requested_direct_units: 12, requested_supervision_units: 0, requested_parent_training_units: 0 }
              as: BCBA
              as_user_id: "${bcba_id}"
              captures: { plan_id: $.data.id }
            - call: "POST /treatment-plans/${plan_id}/submit"
              payload: {}
              as: BCBA
              as_user_id: "${bcba_id}"
            - call: "POST /treatment-plans/${plan_id}/review"
              payload: { decision: "APPROVE" }
              as: IntakeCoordinator
            - call: "POST /authorizations"
