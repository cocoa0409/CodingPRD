          service_date_seq: 4
          billed_cents: 3000000
          expected_episode_version: ${occ_v143}
        captures:
          cl: $.data.id
        as: ClaimsAdmin
      trigger:
      - call: POST /coe/claims/${cl}/adjudicate
        payload: {}
        captures:
          err: $.data.error_id
        as: CareCoordinator
      assert:
      - response 403 ERR_UNAUTHORIZED_ROLE
      - Claim.${cl}.status remains PENDING
  - name: employer_rep_cannot_read_other_employers_report
    claim_type: RBAC denial
    grounds:
    - roles.EmployerRep
    - validations[priority=3]
    - errors[ERR_FORBIDDEN_SCOPE]
    distinguishing_aspect: An EmployerRep whose X-User-ID is employer A's id is rejected 403 ERR_FORBIDDEN_SCOPE when generating or reading employer B's report, even though EmployerRep is an allowed role
      for the endpoint.
    test_recipe:
      setup:
      - Clock 2026-09-01. Employers A and B. B has a generated 2026-09 report.
      setup_api_calls:
      - call: POST /coe/_clock/set_current_utc
        payload:
          to_iso8601: '2026-09-01T00:00:00Z'
        as: ProgramAdmin
      - call: POST /coe/rate-books
        payload:
          book_code: RB-RB2
          rates:
            ORTHO_JOINT: 2500000
        as: ProgramAdmin
        captures:
          rb: $.data.id
      - call: POST /coe/employers
        payload:
          legal_name: Resh A
          ein: E-RB2-A
          baseline_rate_book: ${rb}
        as: ProgramAdmin
        captures:
          empA: $.data.id
      - call: POST /coe/employers
        payload:
          legal_name: Resh B
          ein: E-RB2-B
          baseline_rate_book: ${rb}
        as: ProgramAdmin
        captures:
          empB: $.data.id
      - call: POST /coe/employers/${empB}/reports/generate
        payload:
          period_month: 2026-09
        as: ProgramAdmin
        captures:
          repB: $.data.id
      trigger:
      - call: POST /coe/employers/${empB}/reports/generate
        payload:
          period_month: 2026-09
        as: EmployerRep
        as_user_id: ${empA}
        captures:
          err: $.data.error_id
      - call: GET /coe/reports/${repB}
        payload: {}
        as: EmployerRep
        as_user_id: ${empA}
        captures:
          err2: $.data.error_id
      assert:
      - both calls rejected 403 ERR_FORBIDDEN_SCOPE (${err} and ${err2})
      - EmployerRep with as_user_id ${empB} would succeed — scope is the discriminator, not the role
- section: cross_cutting_complexity_layers
  instances:
  - name: occ_reprice_stale_contract_version
    claim_type: OCC stale-version conflict
    grounds:
    - concurrency_rules[contract-reprice-stale-version]
    - errors[ERR_STALE_VERSION]
    distinguishing_aspect: A reprice carrying the pre-first-reprice contract version is rejected 412 after the first reprice advanced the version; the second reprice with the fresh version succeeds.
    test_recipe:
      setup:
      - Clock 2026-09-01. ACTIVE contract at version 2 (created=1, activated=2).
      setup_api_calls:
      - call: POST /coe/_clock/set_current_utc
        payload:
          to_iso8601: '2026-09-01T00:00:00Z'
        as: ProgramAdmin
      - call: POST /coe/rate-books
        payload:
          book_code: RB-CC1
          rates:
            ORTHO_JOINT: 2500000
        as: ProgramAdmin
        captures:
          rb: $.data.id
      - call: POST /coe/employers
        payload:
          legal_name: Shin
          ein: E-CC1
          baseline_rate_book: ${rb}
        as: ProgramAdmin
        captures:
          emp: $.data.id
      - call: POST /coe/bundle-templates
        payload:
          procedure_family: ORTHO_JOINT
          label: Knee
          warranty_days: 90
          implant_component_cap_cents: 500000
          readmit_policy: ALL_CAUSE
        as: ProgramAdmin
        captures:
          tpl: $.data.id
      - call: POST /coe/contracts
        payload:
          employer_id: ${emp}
          template_id: ${tpl}
          effective_from: '2026-09-01T00:00:00Z'
          effective_to: '2027-09-01T00:00:00Z'
          bundle_price_cents: 3000000
          rate_components:
            facility: 3000000
          outlier_threshold_cents: 5000000
          outlier_share_pct: 0
          episode_cap_per_month: 50
          concurrent_capacity: 50
          travel_benefit_cents: 0
          lodging_benefit_cents: 0
          companion_allowed: false
        as: ProgramAdmin
        captures:
          ctr: $.data.id
          ctr_v: $.data.version
      - call: POST /coe/contracts/${ctr}/activate
        payload: {}
        as: ProgramAdmin
        captures:
          ctr_v2: $.data.version
      trigger:
      - call: POST /coe/contracts/${ctr}/reprice
        payload:
          expected_contract_version: ${ctr_v2}
          new_bundle_price_cents: 3200000
          new_rate_components:
            facility: 3200000
        captures:
          ctr_v3: $.data.version
        as: ProgramAdmin
      - call: POST /coe/contracts/${ctr}/reprice
        payload:
          expected_contract_version: ${ctr_v3}
          new_bundle_price_cents: 3400000
          new_rate_components:
            facility: 3400000
        captures:
          err: $.data.error_id
        as: ProgramAdmin
      - call: POST /coe/contracts/${ctr}/reprice
        payload:
          expected_contract_version: ${ctr_v3}
          new_bundle_price_cents: 3400000
          new_rate_components:
            facility: 3400000
        captures:
          occ_v148: $.data.version
        as: ProgramAdmin
      assert:
      - first reprice succeeds (version ${ctr_v2} matched), version advances to ${ctr_v3}
      - second reprice with stale ${ctr_v2} rejected 412 ERR_STALE_VERSION
      - 'third reprice with fresh ${ctr_v3} succeeds: bundle_price_cents == 3400000 and reprice_count == 2'
