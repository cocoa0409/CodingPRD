            - "E1: ACTIVE agreement (ratio threshold raised to 0.30, cap 50000, est shrink 0); restock 100; SALE 25 units -> gross 5000; audit chargeable 25 -> retailer charge 1250; margin 1250 -> net payable exactly 5000"
