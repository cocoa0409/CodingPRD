    triggered_by: "validations priority 75"
  - error_id: ERR_UNIT_NOT_ALLOCATABLE
    http_status: 409
    message_template: "Trailer unit {unit_id} is not available for allocation: {detail}"
    triggered_by: "validations priority 76"
  - error_id: ERR_NO_ALLOCATABLE_UNIT
    http_status: 409
    message_template: "No stocked unit of model {model_id} is available for allocation"
    triggered_by: "validations priority 77"
  - error_id: ERR_UNIT_NOT_DELIVERED
    http_status: 409
    message_template: "Trailer unit {unit_id} has not been delivered and carries no warranty start date"
    triggered_by: "validations priority 78"
  - error_id: ERR_DEALER_CREDIT_HOLD
    http_status: 409
    message_template: "Dealer {dealer_id} is on credit hold"
    triggered_by: "validations priority 79"
  - error_id: ERR_JIG_WINDOW_CONFLICT
    http_status: 409
    message_template: "Requested window conflicts with reservation {reservation_id} whose occupancy runs to {occupancy_end_at}"
    triggered_by: "validations priority 80"
  - error_id: ERR_LANE_CAPACITY_EXCEEDED
    http_status: 409
    message_template: "Lane {lane_id} already has {overlapping} tests overlapping the requested window; capacity is {capacity}"
    triggered_by: "validations priority 81"
  - error_id: ERR_WARRANTY_WINDOW_EXPIRED
    http_status: 422
    message_template: "failure_date {failure_date} is {days_past} days past the warranty expiry {expiry_at}; the goodwill window closes at 90 days"
    triggered_by: "validations priority 82"
  - error_id: ERR_ALLOCATION_QUOTA_EXCEEDED
    http_status: 409
    message_template: "Dealer {dealer_id} has used {used} of {quota} allocations this month"
    triggered_by: "validations priority 85"
  - error_id: ERR_FLOOR_PLAN_LIMIT_EXCEEDED
    http_status: 402
    message_template: "Draw {draw_cents} would take outstanding to {new_outstanding_cents}, above the limit {limit_cents}"
    triggered_by: "validations priority 90"

# ---------------------------------------------------------------------------
# §1.7 RBAC Matrix
# ---------------------------------------------------------------------------
# role_model: segregation_of_duties. The critical pair is CertificationOfficer's
# own two operations — certifying a model's GVWR and issuing a certification
# label for a unit of that model — which the SAME X-User-ID may never both do
# (validations priority 60). Every other separation is by role, not by identity.
roles:
  - name: PlantEngineer
    description: "Plant engineering administrator: owns model configurations and the jig and lane asset registry"
    identity: "opaque"
    exclusive_operations: ["POST /trailer-models", "POST /trailer-models/{id}/certification-submission", "POST /weld-jigs", "POST /test-lanes"]
    shared_operations: ["POST /_clock/set_current_utc", "every GET endpoint (read-only plant-wide oversight)"]
    notes: "Cannot certify a model it submitted — CERTIFY is CertificationOfficer's exclusive decision"
  - name: CertificationOfficer
    description: "Regulatory certification officer: decides GVWR certification and mints VINs, labels and MCOs"
    identity: "opaque"
    exclusive_operations: ["POST /trailer-models/{id}/certification-decision", "POST /trailer-units/{id}/certification-label"]
    shared_operations: ["POST /_clock/set_current_utc", "GET /trailer-models/{id}", "GET /trailer-units/{id}", "GET /trailer-units", "GET /option-installs/{id}", "GET /road-tests/{id}", "GET /trailer-units/{id}/frame-inspections", "GET /trailer-units/{id}/option-installs", "GET /trailer-units/{id}/certification-label", "GET /trailer-units/{id}/road-tests"]
    notes: "Held to segregation of duties by validations priority 60: the officer whose user id sits in TrailerModel.certified_by_user_id may not issue labels for that model's units, so a second officer identity is always required to complete a build"
  - name: WeldSupervisor
    description: "Weld floor supervisor: opens build records, books jig windows and records dimensional inspections"
    identity: "opaque"
    exclusive_operations: ["POST /trailer-units", "POST /weld-jigs/{id}/jig-reservations", "POST /trailer-units/{id}/frame-inspections"]
    shared_operations: ["POST /_clock/set_current_utc", "GET /trailer-models/{id}", "GET /weld-jigs/{id}", "GET /trailer-units/{id}", "GET /trailer-units", "GET /trailer-units/{id}/frame-inspections", "GET /trailer-units/{id}/jig-reservations", "GET /weld-jigs/{id}/jig-reservations"]
  - name: AssemblyTech
    description: "Assembly line technician: installs lighting, brake and axle systems and custom options"
    identity: "opaque"
    exclusive_operations: ["POST /trailer-units/{id}/systems-install", "POST /trailer-units/{id}/option-installs", "POST /option-installs/{id}/completion", "DELETE /option-installs/{id}"]
    shared_operations: ["POST /_clock/set_current_utc", "GET /trailer-models/{id}", "GET /trailer-units/{id}", "GET /trailer-units", "GET /option-installs/{id}", "GET /road-tests/{id}", "GET /trailer-units/{id}/option-installs", "GET /trailer-units/{id}/road-tests"]
    notes: "May not book or result a road test — quality sign-off is QualityInspector's exclusive lane"
  - name: QualityInspector
    description: "Quality inspector: books road tests and records their brake and lighting results"
    identity: "opaque"
    exclusive_operations: ["POST /trailer-units/{id}/road-tests", "POST /road-tests/{id}/result"]
    shared_operations: ["POST /_clock/set_current_utc", "GET /trailer-models/{id}", "GET /test-lanes/{id}", "GET /trailer-units/{id}", "GET /trailer-units", "GET /road-tests/{id}", "GET /trailer-units/{id}/frame-inspections", "GET /trailer-units/{id}/road-tests", "GET /test-lanes/{id}/road-tests"]
  - name: SalesAdmin
    description: "Dealer sales and warranty administrator: enrolls dealers, allocates stock, invoices, administers floor plan and adjudicates claims"
    identity: "opaque"
    exclusive_operations: ["POST /dealers", "POST /dealers/{id}/floor-plan-adjustments", "POST /dealer-orders/{id}/allocation", "POST /dealer-orders/{id}/delivery", "POST /warranty-claims/{id}/review", "POST /warranty-claims/{id}/part-shipment"]
    shared_operations: ["POST /dealer-orders", "POST /dealer-orders/{id}/cancellation", "POST /warranty-claims", "POST /_clock/set_current_utc", "GET /trailer-models/{id}", "GET /dealers/{id}", "GET /trailer-units/{id}", "GET /trailer-units", "GET /dealer-orders/{id}", "GET /dealer-orders", "GET /warranty-claims/{id}", "GET /warranty-claims", "GET /option-installs/{id}", "GET /trailer-units/{id}/option-installs", "GET /trailer-units/{id}/certification-label"]
    notes: "Unscoped across dealers: unlike the Dealer role it is never subject to validations priority 25"
  - name: Dealer
    description: "Franchised dealer; X-User-ID is the Dealer entity's id and validations priority 25 confines every call to that dealer's own orders and claims"
    identity: "entity_backed:Dealer"
    exclusive_operations: ["POST /warranty-claims/{id}/resubmission"]
    shared_operations: ["POST /dealer-orders", "POST /dealer-orders/{id}/cancellation", "POST /warranty-claims", "POST /_clock/set_current_utc", "GET /trailer-models/{id}", "GET /dealers/{id}", "GET /trailer-units/{id}", "GET /dealer-orders/{id}", "GET /dealer-orders", "GET /warranty-claims/{id}", "GET /warranty-claims", "GET /trailer-units/{id}/certification-label"]
    notes: "Never writes a production record: no unit, reservation, inspection, systems stage, option install, road test or label"
