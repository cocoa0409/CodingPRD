  # =======================================================================
  # RBAC
  # =======================================================================
  - section: rbac
    instances:

      - name: create_client_with_missing_auth_header_returns_unauthenticated
        claim_type: role_denied
        grounds:
          - validations[priority=1]
          - errors[ERR_MISSING_AUTH_HEADER]
        distinguishing_aspect: "A request carrying no X-User-Role header at all returns 401 ERR_MISSING_AUTH_HEADER before any existence or business rung runs."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - call: "POST /clients"
              payload: { display_name: "No Auth", email: "noauth@example.com", phone: "555-0370", home_zone_code: "ZONE_A" }
              as: ShopManager
              captures: { err: "$.data.error_id" }
          assert:
            - "the request is sent with NO X-User-Role header despite the declared role, and returns HTTP 401 with error_id ERR_MISSING_AUTH_HEADER"
            - "GET /clients afterwards returns 0 rows"

      - name: create_client_with_invalid_role_returns_unauthenticated
        claim_type: role_denied
        grounds:
          - validations[priority=2]
          - errors[ERR_INVALID_ROLE]
        distinguishing_aspect: "X-User-Role PianoOwner is not one of the six declared roles, so the ladder stops at priority 2 with 401 ERR_INVALID_ROLE rather than 403."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - call: "POST /clients"
              payload: { display_name: "Bad Role", email: "badrole@example.com", phone: "555-0371", home_zone_code: "ZONE_A" }
              as: PianoOwner
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP 401 with error_id ERR_INVALID_ROLE"

