# =============================================================================
# §1.9 Scaffold Corner Design (Breadth Walk)
# Task 2916 — Esports Organization Player Contracts & Team Operations
#
# Walked row-by-row against references/claim-extraction-guide.md:
#   entities / state_machines / calculations / validations / endpoints /
#   errors / rbac / cross-cutting complexity layers / consistency model.
#
# Every corner the §1.8 depth probe already asserts is emitted here as an
# `excluded_because:` stub naming that instance; every other row carries a
# fully executable recipe. Every error id in SCAFFOLD.yaml §1.6 is triggered
# by at least one instance across the union of §1.8 and §1.9.
#
# Shared fixture constants (identical to §1.8 so the two files compose):
#   logical clock default            2026-08-01T00:00:00Z
#   league season                    2026-08-01T00:00:00Z .. 2027-07-31T00:00:00Z
#   roster_lock_at                   2026-09-15T00:00:00Z
#   transfer window                  2026-08-05T00:00:00Z .. 2026-08-31T00:00:00Z
#   organization budget              50000000 cents, org_prize_share_bp 3500
#   12500000-cent offer, effective_at 2026-08-05  -> provisional 12328767
#    4000000-cent offer, effective_at 2026-08-05  -> provisional  3945205
#   non-existent id literal          00000000-0000-0000-0000-0000000000ff
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:

      - name: league_creation_returns_every_declared_field_with_the_lock_flag_false
        claim_type: Creation
        grounds:
          - entities.League
          - entities.League.fields.roster_lock_active
          - calculations.league_window_state
          - endpoints[POST /leagues]
        distinguishing_aspect: |
          POST /leagues with all six required instants plus every optional tuning field returns
          201 and echoes each one, and the computed roster_lock_active is false because the
          default clock 2026-08-01T00:00:00Z is before roster_lock_at 2026-09-15T00:00:00Z.
        test_recipe:
          setup:
            - "Empty database; logical clock at its default 2026-08-01T00:00:00Z"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: LeagueAdmin
              as_user_id: "admin-1"
          trigger:
            - call: "POST /leagues"
              payload: { name: "Apex Masters League", season_start_at: "2026-08-01T00:00:00Z", season_end_at: "2027-07-31T00:00:00Z", roster_lock_at: "2026-09-15T00:00:00Z", transfer_window_open_at: "2026-08-05T00:00:00Z", transfer_window_close_at: "2026-08-31T00:00:00Z", minimum_salary_cents: 3600000, min_roster_size: 1, max_roster_size: 7, offer_response_window_hours: 72, max_negotiation_rounds: 3, player_association_levy_bp: 250, association_min_prize_split_bp: 4000, association_max_streaming_hours_per_week: 20, minor_max_weekly_minutes: 1200, adult_max_weekly_minutes: 2700, education_reserved_minutes: 600, minor_age_threshold_years: 18, free_agency_cooldown_days: 14, tryout_required_before_offer: false }
              as: LeagueAdmin
              as_user_id: "admin-1"
              captures: { league_id: $.data.id, league_v0: $.data.version }
          assert:
            - "The call returned 201 and League.${league_id}.name == Apex Masters League"
            - "League.${league_id}.season_start_at == 2026-08-01T00:00:00Z and season_end_at == 2027-07-31T00:00:00Z"
            - "League.${league_id}.roster_lock_at == 2026-09-15T00:00:00Z, transfer_window_open_at == 2026-08-05T00:00:00Z, transfer_window_close_at == 2026-08-31T00:00:00Z"
            - "League.${league_id}.minimum_salary_cents == 3600000 and max_negotiation_rounds == 3 and player_association_levy_bp == 250"
            - "League.${league_id}.roster_lock_active == false (current_utc 2026-08-01T00:00:00Z < roster_lock_at)"
            - "League.${league_id}.id is a server-minted string, created_at is set and version == 1"

      - name: league_optional_inputs_fall_back_to_their_declared_defaults
        claim_type: Defaults
        grounds:
          - entities.League.fields.minimum_salary_cents
          - entities.League.fields.min_roster_size
          - entities.League.fields.max_roster_size
          - entities.League.fields.offer_response_window_hours
          - entities.League.fields.max_negotiation_rounds
          - entities.League.fields.player_association_levy_bp
          - entities.League.fields.association_min_prize_split_bp
          - entities.League.fields.association_max_streaming_hours_per_week
          - entities.League.fields.minor_max_weekly_minutes
          - entities.League.fields.adult_max_weekly_minutes
          - entities.League.fields.education_reserved_minutes
          - entities.League.fields.minor_age_threshold_years
          - entities.League.fields.free_agency_cooldown_days
          - entities.League.fields.tryout_required_before_offer
          - endpoints[POST /leagues]
        distinguishing_aspect: |
          A POST /leagues body carrying only the six required instants applies all fourteen
          declared defaults verbatim — 3600000 / 1 / 7 / 72 / 3 / 250 / 4000 / 20 / 1200 / 2700
          / 600 / 18 / 14 / false — so no downstream rule has to invent a value.
        test_recipe:
          setup:
            - "Empty database; logical clock at its default 2026-08-01T00:00:00Z"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: LeagueAdmin
              as_user_id: "admin-1"
          trigger:
            - call: "POST /leagues"
              payload: { name: "Bare Minimum League", season_start_at: "2026-08-01T00:00:00Z", season_end_at: "2027-07-31T00:00:00Z", roster_lock_at: "2026-09-15T00:00:00Z", transfer_window_open_at: "2026-08-05T00:00:00Z", transfer_window_close_at: "2026-08-31T00:00:00Z" }
              as: LeagueAdmin
              as_user_id: "admin-1"
              captures: { league2_id: $.data.id }
          assert:
            - "League.${league2_id}.minimum_salary_cents == 3600000"
            - "League.${league2_id}.min_roster_size == 1 and max_roster_size == 7"
            - "League.${league2_id}.offer_response_window_hours == 72 and max_negotiation_rounds == 3"
            - "League.${league2_id}.player_association_levy_bp == 250 and association_min_prize_split_bp == 4000"
            - "League.${league2_id}.association_max_streaming_hours_per_week == 20"
            - "League.${league2_id}.minor_max_weekly_minutes == 1200 and adult_max_weekly_minutes == 2700 and education_reserved_minutes == 600"
            - "League.${league2_id}.minor_age_threshold_years == 18 and free_agency_cooldown_days == 14"
            - "League.${league2_id}.tryout_required_before_offer == false"

      - name: organization_creation_starts_with_an_empty_salary_and_prize_ledger
        claim_type: Computed Fields
        grounds:
          - entities.Organization.fields.committed_salary_cents
          - entities.Organization.fields.uncommitted_salary_cents
          - entities.Organization.fields.active_roster_count
          - entities.Organization.fields.prize_payable_cents
          - entities.Organization.fields.wellness_flag_count
          - calculations.org_salary_commitment
          - endpoints[POST /organizations]
        distinguishing_aspect: |
          A brand-new Organization with annual_salary_budget_cents 50000000 reports
          committed_salary_cents 0 and uncommitted_salary_cents 50000000, so the
          INVARIANT_SALARY conservation identity already holds before any contract exists.
        test_recipe:
          setup:
            - "One league; no organizations yet"
          setup_api_calls:
            - call: "POST /leagues"
              payload: { name: "Apex Masters League", season_start_at: "2026-08-01T00:00:00Z", season_end_at: "2027-07-31T00:00:00Z", roster_lock_at: "2026-09-15T00:00:00Z", transfer_window_open_at: "2026-08-05T00:00:00Z", transfer_window_close_at: "2026-08-31T00:00:00Z", minimum_salary_cents: 3600000, min_roster_size: 1, max_roster_size: 7 }
              as: LeagueAdmin
              as_user_id: "admin-1"
              captures: { league_id: $.data.id }
          trigger:
            - call: "POST /organizations"
              payload: { league_id: "${league_id}", name: "Vertex Vanguard", tax_jurisdiction_code: "US-CA", annual_salary_budget_cents: 50000000 }
              as: LeagueAdmin
              as_user_id: "admin-1"
              captures: { org_id: $.data.id }
            - call: "GET /organizations/${org_id}/cap-summary"
              as: LeagueAdmin
              as_user_id: "admin-1"
          assert:
            - "Organization.${org_id}.league_id == ${league_id} and org_prize_share_bp == 3500 (default applied)"
            - "Organization.${org_id}.committed_salary_cents == 0 and uncommitted_salary_cents == 50000000"
            - "Organization.${org_id}.active_roster_count == 0, prize_payable_cents == 0, wellness_flag_count == 0"
            - "cap-summary.annual_salary_budget_cents == 50000000, committed_salary_cents == 0, uncommitted_salary_cents == 50000000, provisional_committed_cents == 0, final_committed_cents == 0"
            - "Organization.${org_id}.version == 1"

      - name: player_minor_status_fields_are_derived_from_birth_date_and_the_clock
        claim_type: Computed Fields
        grounds:
          - calculations.player_minor_status
          - entities.Player.fields.age_years
          - entities.Player.fields.is_minor
          - entities.Player.fields.guardian_consent_status
          - entities.Player.fields.player_status
          - entities.Player.fields.scouted_by_user_id
          - endpoints[POST /players]
        distinguishing_aspect: |
          At clock 2026-08-01T00:00:00Z a 2010-02-20 birth date yields age_years 16, is_minor
          true and guardian_consent_status REQUIRED, while a 2001-05-14 birth date yields 25,
          false and NOT_REQUIRED — the client sends neither field.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; no players yet"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: LeagueAdmin
              as_user_id: "admin-1"
          trigger:
            - call: "POST /players"
              payload: { full_name: "Mika Toivonen", birth_date: "2010-02-20", region_code: "FI", association_member: false, education_enrollment_status: "ENROLLED_FULL_TIME" }
              as: Scout
              as_user_id: "scout-7"
              captures: { minor_id: $.data.id }
            - call: "POST /players"
              payload: { full_name: "Rin Adachi", birth_date: "2001-05-14", region_code: "US", association_member: false, education_enrollment_status: "NOT_ENROLLED" }
              as: Scout
              as_user_id: "scout-7"
              captures: { adult_id: $.data.id }
          assert:
            - "Player.${minor_id}.age_years == 16, is_minor == true, guardian_consent_status == REQUIRED"
            - "Player.${adult_id}.age_years == 25, is_minor == false, guardian_consent_status == NOT_REQUIRED"
            - "Both players have player_status == PROSPECT, current_organization_id == null, free_agency_window_ends_at == null, last_release_organization_id == null"
            - "Player.${minor_id}.guardian_name == null, guardian_email == null, guardian_weekly_cap_minutes == null"
            - "Player.${minor_id}.scouted_by_user_id == scout-7 (taken from X-User-Id, not from the body)"

      - name: player_listing_reports_total_count_has_more_and_honours_region_filter
        claim_type: Listing
        grounds:
          - endpoints[GET /players]
          - response_envelope.pagination_fields
          - entities.Player.fields.region_code
        distinguishing_aspect: |
          With exactly three players registered, limit=2/offset=0 returns 2 rows with
          total_count 3 and has_more true, limit=2/offset=2 returns 1 row with has_more false,
          and region_code=KR returns exactly the one Korean player.
        test_recipe:
          setup:
            - "Three players registered: two US, one KR"
          setup_api_calls:
            - call: "POST /players"
              payload: { full_name: "Rin Adachi", birth_date: "2001-05-14", region_code: "US" }
              as: Scout
              as_user_id: "scout-7"
              captures: { pa_id: $.data.id }
            - call: "POST /players"
              payload: { full_name: "Dana Reyes", birth_date: "2002-03-09", region_code: "US" }
              as: Scout
              as_user_id: "scout-7"
              captures: { pb_id: $.data.id }
            - call: "POST /players"
              payload: { full_name: "Ha-eun Seo", birth_date: "2003-11-30", region_code: "KR" }
              as: Scout
              as_user_id: "scout-7"
              captures: { pc_id: $.data.id }
          trigger:
            - call: "GET /players"
              payload: { limit: 2, offset: 0 }
              as: Scout
              as_user_id: "scout-7"
            - call: "GET /players"
              payload: { limit: 2, offset: 2 }
              as: Scout
              as_user_id: "scout-7"
            - call: "GET /players"
              payload: { region_code: "KR", limit: 10, offset: 0 }
              as: Scout
              as_user_id: "scout-7"
            - call: "GET /players"
              payload: { player_status: "PROSPECT", limit: 10, offset: 0 }
              as: Scout
              as_user_id: "scout-7"
          assert:
            - "First call: response_type == array with 2 rows, total_count == 3, has_more == true, limit == 2, offset == 0"
            - "Second call: 1 row, total_count == 3, has_more == false"
            - "Third call: exactly 1 row whose id == ${pc_id}, total_count == 1, has_more == false"
            - "Fourth call: 3 rows, total_count == 3 — every player is still PROSPECT"

      - name: every_path_id_segment_has_its_own_not_found_error
        claim_type: Not Found
        grounds:
          - validations[priority=3]
          - errors[ERR_LEAGUE_NOT_FOUND]
          - errors[ERR_ORGANIZATION_NOT_FOUND]
          - errors[ERR_PLAYER_NOT_FOUND]
          - errors[ERR_OFFER_NOT_FOUND]
          - errors[ERR_CONTRACT_NOT_FOUND]
          - errors[ERR_TEAM_HOUSE_NOT_FOUND]
          - errors[ERR_PRACTICE_BLOCK_NOT_FOUND]
          - errors[ERR_DEAL_NOT_FOUND]
          - errors[ERR_DELIVERABLE_NOT_FOUND]
          - errors[ERR_DISTRIBUTION_NOT_FOUND]
          - errors[ERR_ROSTER_MOVE_NOT_FOUND]
        distinguishing_aspect: |
          Eleven GETs against the id 00000000-0000-0000-0000-0000000000ff each return 404 with
          the entity-specific error id — no generic ERR_NOT_FOUND and no 500 — on an otherwise
          empty database.
        test_recipe:
          setup:
            - "Empty database — no entity of any type exists"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: LeagueAdmin
              as_user_id: "admin-1"
          trigger:
            - call: "GET /leagues/00000000-0000-0000-0000-0000000000ff"
              as: LeagueAdmin
              as_user_id: "admin-1"
            - call: "GET /organizations/00000000-0000-0000-0000-0000000000ff"
              as: LeagueAdmin
              as_user_id: "admin-1"
            - call: "GET /players/00000000-0000-0000-0000-0000000000ff"
              as: Scout
              as_user_id: "scout-7"
            - call: "GET /contract-offers/00000000-0000-0000-0000-0000000000ff"
              as: LeagueAdmin
              as_user_id: "admin-1"
            - call: "GET /contracts/00000000-0000-0000-0000-0000000000ff"
              as: LeagueAdmin
              as_user_id: "admin-1"
            - call: "GET /team-houses/00000000-0000-0000-0000-0000000000ff"
              as: OpsManager
              as_user_id: "ops-1"
            - call: "GET /practice-blocks/00000000-0000-0000-0000-0000000000ff"
              as: CoachingStaff
              as_user_id: "coach-1"
            - call: "GET /sponsorship-deals/00000000-0000-0000-0000-0000000000ff"
              as: LeagueAdmin
              as_user_id: "admin-1"
            - call: "GET /deliverable-assignments/00000000-0000-0000-0000-0000000000ff"
              as: SponsorshipManager
              as_user_id: "sponsor-1"
            - call: "GET /prize-distributions/00000000-0000-0000-0000-0000000000ff"
              as: FinanceOfficer
              as_user_id: "finance-1"
            - call: "GET /roster-moves/00000000-0000-0000-0000-0000000000ff"
              as: LeagueAdmin
              as_user_id: "admin-1"
          assert:
            - "GET /leagues/{missing} returned 404 ERR_LEAGUE_NOT_FOUND"
            - "GET /organizations/{missing} returned 404 ERR_ORGANIZATION_NOT_FOUND"
            - "GET /players/{missing} returned 404 ERR_PLAYER_NOT_FOUND"
            - "GET /contract-offers/{missing} returned 404 ERR_OFFER_NOT_FOUND"
            - "GET /contracts/{missing} returned 404 ERR_CONTRACT_NOT_FOUND"
            - "GET /team-houses/{missing} returned 404 ERR_TEAM_HOUSE_NOT_FOUND"
            - "GET /practice-blocks/{missing} returned 404 ERR_PRACTICE_BLOCK_NOT_FOUND"
            - "GET /sponsorship-deals/{missing} returned 404 ERR_DEAL_NOT_FOUND"
            - "GET /deliverable-assignments/{missing} returned 404 ERR_DELIVERABLE_NOT_FOUND"
            - "GET /prize-distributions/{missing} returned 404 ERR_DISTRIBUTION_NOT_FOUND"
            - "GET /roster-moves/{missing} returned 404 ERR_ROSTER_MOVE_NOT_FOUND"
            - "Every response body carries response_type == error with data.error_id and data.message"

      - name: body_foreign_keys_are_resolved_before_any_business_rule_returns_404
        claim_type: Parent Relationships
        grounds:
          - validations[priority=6]
          - errors[ERR_LEAGUE_NOT_FOUND]
          - errors[ERR_ORGANIZATION_NOT_FOUND]
          - errors[ERR_PLAYER_NOT_FOUND]
          - errors[ERR_TEAM_HOUSE_NOT_FOUND]
          - errors[ERR_CONTRACT_NOT_FOUND]
          - endpoints[POST /organizations]
          - endpoints[POST /contract-offers]
          - endpoints[POST /practice-blocks]
        distinguishing_aspect: |
          A dangling league_id, player_id, team_house_id or contract_id in the request BODY
          (not the path) is refused at priority 6 with the same entity-specific 404 — before
          the priority 9/11/13 rules that the very same bodies also violate.
        test_recipe:
          setup:
            - "One league, one organization, one adult player, one team house — every body below names exactly one dangling id"
          setup_api_calls:
            - call: "POST /leagues"
              payload: { name: "Apex Masters League", season_start_at: "2026-08-01T00:00:00Z", season_end_at: "2027-07-31T00:00:00Z", roster_lock_at: "2026-09-15T00:00:00Z", transfer_window_open_at: "2026-08-05T00:00:00Z", transfer_window_close_at: "2026-08-31T00:00:00Z", minimum_salary_cents: 3600000 }
              as: LeagueAdmin
              as_user_id: "admin-1"
              captures: { league_id: $.data.id }
            - call: "POST /organizations"
              payload: { league_id: "${league_id}", name: "Vertex Vanguard", tax_jurisdiction_code: "US-CA", annual_salary_budget_cents: 50000000 }
              as: LeagueAdmin
              as_user_id: "admin-1"
              captures: { org_id: $.data.id, org_v0: $.data.version }
            - call: "POST /players"
              payload: { full_name: "Rin Adachi", birth_date: "2001-05-14", region_code: "US" }
              as: Scout
              as_user_id: "scout-7"
              captures: { p1_id: $.data.id }
            - call: "POST /organizations/${org_id}/team-houses"
              payload: { name: "Vanguard House", timezone: "America/Los_Angeles", turnaround_buffer_minutes: 60, concurrent_seat_capacity: 10 }
              as: OpsManager
              as_user_id: "${org_id}"
              captures: { house_id: $.data.id }
          trigger:
            - call: "POST /organizations"
              payload: { league_id: "00000000-0000-0000-0000-0000000000ff", name: "Ghost Org", tax_jurisdiction_code: "US-CA", annual_salary_budget_cents: 50000000 }
              as: LeagueAdmin
              as_user_id: "admin-1"
            - call: "POST /contract-offers"
              payload: { organization_id: "${org_id}", player_id: "00000000-0000-0000-0000-0000000000ff", base_salary_cents: 1000, term_months: 12, prize_split_player_pct_bp: 4000, streaming_hours_per_week: 10, tax_residency_code: "US-CA" }
              as: GeneralManager
              as_user_id: "${org_id}"
            - call: "POST /practice-blocks"
              payload: { organization_id: "${org_id}", team_house_id: "00000000-0000-0000-0000-0000000000ff", block_type: "TRYOUT", starts_at: "2026-08-02T10:00:00Z", ends_at: "2026-08-02T14:00:00Z", participant_player_ids: ["${p1_id}"] }
              as: CoachingStaff
              as_user_id: "coach-1"
            - call: "POST /practice-blocks"
              payload: { organization_id: "${org_id}", team_house_id: "${house_id}", block_type: "TRYOUT", starts_at: "2026-08-02T10:00:00Z", ends_at: "2026-08-02T14:00:00Z", participant_player_ids: ["00000000-0000-0000-0000-0000000000ff"] }
              as: CoachingStaff
              as_user_id: "coach-1"
            - call: "POST /sponsorship-deals/00000000-0000-0000-0000-0000000000ff/deliverables"
              payload: { contract_id: "00000000-0000-0000-0000-0000000000ff", deliverable_type: "SOCIAL_POST", due_at: "2026-08-20T00:00:00Z", expected_deal_version: "${org_v0}" }
              as: SponsorshipManager
              as_user_id: "${org_id}"
          assert:
            - "Dangling league_id returned 404 ERR_LEAGUE_NOT_FOUND and no Organization was created"
            - "Dangling player_id returned 404 ERR_PLAYER_NOT_FOUND, not 422 ERR_BELOW_MINIMUM_SALARY, even though base_salary_cents 1000 is below the 3600000 minimum"
            - "Dangling team_house_id returned 404 ERR_TEAM_HOUSE_NOT_FOUND"
            - "Dangling participant id returned 404 ERR_PLAYER_NOT_FOUND"
            - "The deliverable call returned 404 ERR_DEAL_NOT_FOUND — the leftmost unresolved segment (the path deal id) wins over the dangling body contract_id"
            - "GET /players returns total_count == 1 and GET /practice-blocks returns total_count == 0"

      - name: team_house_creation_needs_a_live_parent_organization_and_applies_defaults
        claim_type: Parent Relationships
        grounds:
          - entities.TeamHouse.fields.organization_id
          - entities.TeamHouse.fields.turnaround_buffer_minutes
          - entities.TeamHouse.fields.concurrent_seat_capacity
          - endpoints[POST /organizations/{id}/team-houses]
          - endpoints[GET /organizations/{id}/team-houses]
          - errors[ERR_ORGANIZATION_NOT_FOUND]
        distinguishing_aspect: |
          The nested create refuses a dangling parent with 404 ERR_ORGANIZATION_NOT_FOUND, and
          the successful create takes organization_id from the PATH (never from a body field)
          while defaulting turnaround_buffer_minutes to 60 and concurrent_seat_capacity to 10.
        test_recipe:
          setup:
            - "One league and one organization; no team houses yet"
          setup_api_calls:
            - call: "POST /leagues"
              payload: { name: "Apex Masters League", season_start_at: "2026-08-01T00:00:00Z", season_end_at: "2027-07-31T00:00:00Z", roster_lock_at: "2026-09-15T00:00:00Z", transfer_window_open_at: "2026-08-05T00:00:00Z", transfer_window_close_at: "2026-08-31T00:00:00Z" }
              as: LeagueAdmin
              as_user_id: "admin-1"
              captures: { league_id: $.data.id }
            - call: "POST /organizations"
              payload: { league_id: "${league_id}", name: "Vertex Vanguard", tax_jurisdiction_code: "US-CA", annual_salary_budget_cents: 50000000 }
              as: LeagueAdmin
              as_user_id: "admin-1"
              captures: { org_id: $.data.id }
          trigger:
            - call: "POST /organizations/00000000-0000-0000-0000-0000000000ff/team-houses"
              payload: { name: "Orphan House", timezone: "America/Los_Angeles" }
              as: OpsManager
              as_user_id: "00000000-0000-0000-0000-0000000000ff"
            - call: "POST /organizations/${org_id}/team-houses"
              payload: { name: "Vanguard House", timezone: "America/Los_Angeles" }
              as: OpsManager
              as_user_id: "${org_id}"
