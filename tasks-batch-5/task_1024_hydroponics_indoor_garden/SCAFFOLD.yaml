# =============================================================================
# Task 1024 — Hydroponics & Indoor-Garden Store
# SCAFFOLD.yaml  (§1.0–§1.7)
# =============================================================================
scenario: |
  1024. Hydroponics & Indoor-Garden Store: system & lighting/nutrient, SKU &
  consumable subscription, build/design consult, water/pH testing, class/workshop,
  warranty/RMA, commercial account, inventory

domain_name: hydroponics-indoor-garden
# Flat, multi-resource topology: every top-level resource is mounted at the root
# (no single owning parent path). api_prefix is therefore empty; all endpoint
# paths are absolute ("/products", "/orders", ...).
api_prefix: ""

complexity_profile:
  difficulty: Expert
  primary_archetype: quota_allocation          # finite inventory reserved/committed/released across lots
  secondary_archetype: pricing_engine          # tiered commercial pricing + hazmat surcharge, provisional vs final
  complexity_layers:
    - optimistic_concurrency                   # OCC on CommercialAccount.version for commercial order placement
    - cascading_side_effects                   # order confirm → lot deplete → product reorder flag
    - dual_variant_calculation                 # order provisional/final; consult estimate/actual
    - derived_field_reconciliation             # credit_used, total_available, seats_taken kept in sync
  entity_topology: flat
  state_machine_shape: parallel                # Order carries independent payment_status × fulfillment_status; RMA is cyclic
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: peer_roles                       # StoreAdmin / Customer / CommercialBuyer / Consultant own different surfaces
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Product
    parent: null
    common_fields: true          # id, created_at, updated_at, version
    fields:
      - { name: sku_code, type: string, source: input, description: "Human SKU, unique across catalog" }
      - { name: name, type: string, source: input, description: "Display name" }
      - { name: category, type: enum, source: input, description: "SYSTEM | LIGHTING | NUTRIENT | CONSUMABLE | ACCESSORY" }
      - { name: unit_price_cents, type: integer, source: input, description: "Catalog list price in cents; > 0" }
      - { name: is_hazmat, type: boolean, source: input, default: false, description: "True for regulated nutrients; hazmat products are non-returnable and add a shipping surcharge" }
      - { name: warranty_months, type: integer, source: input, default: 0, description: "Warranty length in months from ship date; >= 0" }
      - { name: is_subscribable, type: boolean, source: input, default: false, description: "Whether a consumable Subscription may target this product" }
      - { name: reorder_threshold, type: integer, source: input, default: 0, description: "total_available_units below this flips reorder_flag; >= 0" }
      - { name: unit_weight_g, type: integer, source: input, default: 0, description: "Per-unit shipping weight in grams; feeds hazmat surcharge; >= 0" }
      - { name: total_available_units, type: integer, source: computed, description: "sum of quantity_available over this product's InventoryLots with status == ACTIVE" }
      - { name: reorder_flag, type: boolean, source: computed, description: "True iff total_available_units < reorder_threshold" }

  - name: InventoryLot
    parent: Product
    common_fields: true
    fields:
      - { name: product_id, type: string, source: input, description: "FK -> Product.id" }
      - { name: lot_code, type: string, source: input, description: "Lot label; unique per product" }
      - { name: quantity_on_hand, type: integer, source: input, description: "Physical units received into the lot; >= 0" }
      - { name: quantity_reserved, type: integer, source: computed, description: "Units reserved by CONFIRMED (unshipped) orders; starts 0" }
      - { name: quantity_available, type: integer, source: computed, description: "quantity_on_hand - quantity_reserved" }
      - { name: unit_cost_cents, type: integer, source: input, default: 0, description: "Landed cost per unit; >= 0" }
      - { name: status, type: enum, source: system, description: "ACTIVE | DEPLETED (available == 0) | QUARANTINED; starts ACTIVE" }

  - name: Customer
    parent: null
    common_fields: true
    fields:
      - { name: email, type: string, source: input, description: "Unique login email" }
      - { name: full_name, type: string, source: input, description: "Display name" }
      - { name: wallet_credit_cents, type: integer, source: computed, description: "Store credit balance in cents; starts 0; grows on refunds" }
      - { name: loyalty_points, type: integer, source: computed, description: "Lifetime accrued points; starts 0; grows on order payment" }
      - { name: loyalty_tier, type: enum, source: computed, description: "BRONZE (points<1000) | SILVER (1000<=points<5000) | GOLD (points>=5000)" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED; starts ACTIVE" }

  - name: CommercialAccount
    parent: null
    common_fields: true
    fields:
      - { name: business_name, type: string, source: input, description: "Legal business name" }
      - { name: credit_limit_cents, type: integer, source: input, description: "Maximum outstanding commercial credit in cents; > 0" }
      - { name: credit_used_cents, type: integer, source: computed, description: "sum of total_cents over this account's Orders whose fulfillment_status IN {CONFIRMED, SHIPPED}; starts 0" }
      - { name: payment_terms_net_days, type: integer, source: input, default: 30, description: "Net payment terms in days; >= 0" }
      - { name: discount_tier, type: enum, source: input, default: "STANDARD", description: "STANDARD | SILVER | GOLD; drives commercial discount base rate" }
      - { name: status, type: enum, source: system, description: "PENDING | ACTIVE | ON_HOLD | SUSPENDED; starts PENDING" }

  - name: Order
    parent: null
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; null for commercial orders" }
      - { name: commercial_account_id, type: string, source: input, description: "FK -> CommercialAccount.id; null for retail orders" }
      - { name: order_type, type: enum, source: system, description: "RETAIL | COMMERCIAL; RETAIL when created via POST /orders, COMMERCIAL via POST /commercial-accounts/{id}/orders" }
      - { name: lines, type: array, source: input, description: "Array of line objects {product_id, quantity, unit_price_cents (snapshot at placement), line_total_cents}; >= 1 line" }
      - { name: subtotal_cents, type: integer, source: computed, description: "sum of line_total_cents over lines" }
      - { name: discount_cents, type: integer, source: computed, description: "commercial tiered discount on subtotal; 0 for RETAIL" }
      - { name: hazmat_surcharge_cents, type: integer, source: computed, description: "shipping surcharge when any line product is_hazmat" }
      - { name: provisional_total_cents, type: integer, source: computed, description: "net total computed at placement using discount_tier at placement time" }
      - { name: final_total_cents, type: integer, source: computed, description: "net total recomputed at ship using discount_tier at ship time; null until shipped" }
      - { name: total_cents, type: integer, source: computed, description: "provisional_total_cents until shipped, then final_total_cents" }
      - { name: fulfillment_status, type: enum, source: system, description: "DRAFT | CONFIRMED | SHIPPED | CANCELLED; independent axis" }
      - { name: payment_status, type: enum, source: system, description: "UNPAID | PAID | REFUNDED; independent axis" }
      - { name: shipped_at, type: datetime, source: system, description: "Logical clock time at ship; null until shipped; warranty clock origin" }

  - name: Subscription
    parent: null
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id" }
      - { name: product_id, type: string, source: input, description: "FK -> Product.id; product must be is_subscribable" }
      - { name: interval_days, type: integer, source: input, description: "Days between cycles; > 0" }
      - { name: quantity_per_cycle, type: integer, source: input, description: "Units shipped each cycle; > 0" }
      - { name: price_locked_cents, type: integer, source: computed, description: "Product.unit_price_cents snapshot at subscription creation" }
      - { name: next_ship_at, type: datetime, source: computed, description: "clock_now + interval_days at creation; frozen while PAUSED" }
      - { name: status, type: enum, source: system, description: "ACTIVE | PAUSED | CANCELLED; starts ACTIVE; ACTIVE<->PAUSED cycle allowed" }

  - name: Consultant
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Consultant display name" }
      - { name: specialty, type: string, source: input, description: "e.g. VERTICAL_FARM, AQUAPONICS" }
      - { name: hourly_rate_cents, type: integer, source: input, description: "Billed rate per hour in cents; > 0" }
      - { name: buffer_minutes, type: integer, source: input, default: 30, description: "Required idle gap in minutes between consecutive bookings; >= 0" }
      - { name: status, type: enum, source: system, description: "ACTIVE | INACTIVE; starts ACTIVE" }

  - name: ConsultBooking
    parent: null
    common_fields: true
    fields:
      - { name: consultant_id, type: string, source: input, description: "FK -> Consultant.id" }
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id" }
      - { name: start_at, type: datetime, source: input, description: "ISO8601 UTC booking start" }
      - { name: end_at, type: datetime, source: input, description: "ISO8601 UTC booking end; must be > start_at" }
      - { name: design_scope, type: string, source: input, default: "", description: "Free-text build/design brief" }
      - { name: estimated_fee_cents, type: integer, source: computed, description: "hourly_rate_cents * ceil(scheduled_minutes/60); set at booking" }
      - { name: actual_fee_cents, type: integer, source: computed, description: "round_half_up(hourly_rate_cents * actual_minutes / 60); set at completion; null before" }
      - { name: status, type: enum, source: system, description: "REQUESTED | CONFIRMED | COMPLETED | CANCELLED; starts REQUESTED" }

  - name: Room
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Room label" }
      - { name: seat_capacity, type: integer, source: input, default: 20, description: "Physical seats in the room; > 0" }

  - name: WorkshopSession
    parent: null
    common_fields: true
    fields:
      - { name: room_id, type: string, source: input, description: "FK -> Room.id" }
      - { name: title, type: string, source: input, description: "Class/workshop title" }
      - { name: start_at, type: datetime, source: input, description: "ISO8601 UTC session start" }
      - { name: end_at, type: datetime, source: input, description: "ISO8601 UTC session end; must be > start_at" }
      - { name: capacity, type: integer, source: input, description: "Max REGISTERED seats; > 0 and <= room.seat_capacity" }
      - { name: seats_taken, type: integer, source: computed, description: "count of this session's WorkshopRegistrations with status == REGISTERED" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | OPEN | COMPLETED | CANCELLED; starts SCHEDULED; registration allowed only in OPEN" }

  - name: WorkshopRegistration
    parent: WorkshopSession
    common_fields: true
    fields:
      - { name: session_id, type: string, source: input, description: "FK -> WorkshopSession.id" }
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id" }
      - { name: price_paid_cents, type: integer, source: system, description: "Snapshot seat fee; 0 in this scope" }
      - { name: status, type: enum, source: system, description: "REGISTERED | WAITLISTED | CANCELLED; REGISTERED when seats_taken < capacity at creation, else WAITLISTED" }

  - name: RMA
    parent: null
    common_fields: true
    fields:
      - { name: order_id, type: string, source: input, description: "FK -> Order.id; order must be SHIPPED" }
      - { name: product_id, type: string, source: input, description: "FK -> Product.id; must be a line on the referenced order" }
      - { name: return_quantity, type: integer, source: input, description: "Units returned; > 0 and <= ordered quantity of that product" }
      - { name: reason, type: string, source: input, description: "Return reason text" }
      - { name: within_warranty, type: boolean, source: computed, description: "clock_now <= order.shipped_at + product.warranty_months*30 days; set at approval" }
      - { name: refund_cents, type: integer, source: computed, description: "full line value if within_warranty else value net of restocking fee; set at approval" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | UNDER_REVIEW | INFO_REQUESTED | APPROVED | REJECTED; UNDER_REVIEW<->INFO_REQUESTED cycle allowed" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: CommercialAccount
    field: status
    initial_state: PENDING
    terminal_states: [SUSPENDED]
    transitions:
      - from: PENDING
        to: ACTIVE
        trigger: "POST /commercial-accounts/{id}/activate"
        actor: StoreAdmin
        preconditions: ["account is PENDING or ON_HOLD"]
        side_effects: ["increments CommercialAccount.version by 1"]
      - from: ACTIVE
        to: ON_HOLD
        trigger: "POST /commercial-accounts/{id}/hold"
        actor: StoreAdmin
        preconditions: ["account is ACTIVE"]
        side_effects: ["increments CommercialAccount.version by 1", "blocks new commercial order placement"]
      - from: ON_HOLD
        to: ACTIVE
        trigger: "POST /commercial-accounts/{id}/activate"
        actor: StoreAdmin
        preconditions: ["account is ON_HOLD"]
        side_effects: ["increments CommercialAccount.version by 1"]

  - entity: Order
    field: fulfillment_status
    initial_state: DRAFT
    terminal_states: [SHIPPED, CANCELLED]
    note: "Parallel dimension A of Order; evolves independently of payment_status."
    transitions:
      - from: DRAFT
        to: CONFIRMED
        trigger: "POST /orders/{id}/confirm  (retail) or POST /commercial-accounts/{id}/orders (commercial, created directly CONFIRMED)"
        actor: Customer
        preconditions:
          - "every line has sufficient Product.total_available_units (else ERR_INSUFFICIENT_STOCK)"
          - "for commercial: account.status == ACTIVE (else ERR_ACCOUNT_NOT_ACTIVE)"
          - "for commercial: credit_used_cents + order.total_cents <= credit_limit_cents (else ERR_CREDIT_LIMIT_EXCEEDED)"
        side_effects:
          - "reserve order quantities across the product's InventoryLots ordered by created_at ASC then lot_code ASC: each selected lot.quantity_reserved += allocated, quantity_available recomputed"
          - "any lot whose quantity_available reaches 0 transitions InventoryLot ACTIVE->DEPLETED"
          - "each affected Product recomputes total_available_units; if it drops below reorder_threshold, Product.reorder_flag flips to true"
          - "for commercial orders: increments CommercialAccount.version by 1 and recomputes credit_used_cents"
      - from: CONFIRMED
        to: SHIPPED
        trigger: "POST /orders/{id}/ship"
        actor: StoreAdmin
        preconditions: ["order is CONFIRMED"]
        side_effects:
          - "compute final_total_cents via order_net_total using discount_tier at ship time; set total_cents = final_total_cents"
          - "for each reserved lot: quantity_on_hand -= shipped, quantity_reserved -= shipped, quantity_available recomputed"
          - "set shipped_at = clock_now"
          - "for commercial orders: recompute credit_used_cents against final total"
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /orders/{id}/cancel"
        actor: Customer
        preconditions: ["order is DRAFT"]
        side_effects: ["no reservations to release"]
      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /orders/{id}/cancel"
        actor: Customer
        preconditions: ["order is CONFIRMED"]
        side_effects:
          - "release each reserved lot: quantity_reserved -= allocated, quantity_available recomputed; DEPLETED lot with available>0 reverts to ACTIVE"
          - "each affected Product recomputes total_available_units; reorder_flag recomputed"
          - "for commercial orders: increments CommercialAccount.version by 1 and recomputes credit_used_cents (releases drawn credit)"

  - entity: Order
    field: payment_status
    initial_state: UNPAID
    terminal_states: [REFUNDED]
    note: "Parallel dimension B of Order; a DRAFT order may be PAID and a CONFIRMED order may be UNPAID."
    transitions:
      - from: UNPAID
        to: PAID
        trigger: "POST /orders/{id}/pay"
        actor: Customer
        preconditions: ["payment_status == UNPAID", "fulfillment_status != CANCELLED"]
        side_effects:
          - "accrue loyalty via loyalty_points_accrual: Customer.loyalty_points += earned; recompute loyalty_tier"
      - from: PAID
        to: REFUNDED
        trigger: "POST /orders/{id}/refund"
        actor: StoreAdmin
        preconditions: ["payment_status == PAID"]
        side_effects:
          - "Customer.wallet_credit_cents += order.total_cents"
          - "reverse the loyalty points accrued for this order: Customer.loyalty_points -= earned (floor at 0); recompute loyalty_tier"

  - entity: Subscription
    field: status
    initial_state: ACTIVE
    terminal_states: [CANCELLED]
    transitions:
      - from: ACTIVE
        to: PAUSED
        trigger: "POST /subscriptions/{id}/pause"
        actor: Customer
        preconditions: ["subscription is ACTIVE"]
        side_effects: ["freeze next_ship_at"]
      - from: PAUSED
        to: ACTIVE
        trigger: "POST /subscriptions/{id}/resume"
        actor: Customer
        preconditions: ["subscription is PAUSED"]
        side_effects: ["next_ship_at = clock_now + interval_days"]
      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /subscriptions/{id}/cancel"
        actor: Customer
        preconditions: ["subscription is ACTIVE or PAUSED"]
        side_effects: []
      - from: PAUSED
        to: CANCELLED
        trigger: "POST /subscriptions/{id}/cancel"
        actor: Customer
        preconditions: ["subscription is ACTIVE or PAUSED"]
        side_effects: []

  - entity: ConsultBooking
    field: status
    initial_state: REQUESTED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: REQUESTED
        to: CONFIRMED
        trigger: "POST /consult-bookings/{id}/confirm"
        actor: Consultant
        preconditions: ["booking is REQUESTED"]
        side_effects: []
      - from: CONFIRMED
        to: COMPLETED
        trigger: "POST /consult-bookings/{id}/complete"
        actor: Consultant
        preconditions: ["booking is CONFIRMED", "actual_minutes > 0"]
        side_effects: ["compute actual_fee_cents via consult_fee actual variant"]
      - from: REQUESTED
        to: CANCELLED
        trigger: "POST /consult-bookings/{id}/cancel"
        actor: Customer
        preconditions: ["booking is REQUESTED or CONFIRMED"]
        side_effects: ["frees the consultant time window"]
      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /consult-bookings/{id}/cancel"
        actor: Customer
        preconditions: ["booking is REQUESTED or CONFIRMED"]
        side_effects: ["frees the consultant time window"]

  - entity: WorkshopSession
    field: status
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: OPEN
        trigger: "POST /workshop-sessions/{id}/open"
        actor: StoreAdmin
        preconditions: ["session is SCHEDULED"]
        side_effects: ["enables registration"]
      - from: OPEN
        to: CANCELLED
        trigger: "POST /workshop-sessions/{id}/cancel"
        actor: StoreAdmin
        preconditions: ["session is SCHEDULED or OPEN"]
        side_effects: ["cascade: every REGISTERED or WAITLISTED WorkshopRegistration under this session -> CANCELLED; each cancel recomputes seats_taken"]
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /workshop-sessions/{id}/cancel"
        actor: StoreAdmin
        preconditions: ["session is SCHEDULED or OPEN"]
        side_effects: ["cascade: every non-terminal WorkshopRegistration under this session -> CANCELLED"]

  - entity: WorkshopRegistration
    field: status
    initial_state: REGISTERED
    terminal_states: [CANCELLED]
    note: "Initial state is REGISTERED when seats_taken < capacity at creation, otherwise WAITLISTED."
    transitions:
      - from: REGISTERED
        to: CANCELLED
        trigger: "POST /workshop-registrations/{id}/cancel"
        actor: Customer
        preconditions: ["registration is REGISTERED or WAITLISTED"]
        side_effects:
          - "session recomputes seats_taken"
          - "if this was REGISTERED and a WAITLISTED registration exists, promote the earliest-created (created_at ASC) WAITLISTED registration to REGISTERED"
      - from: WAITLISTED
        to: CANCELLED
        trigger: "POST /workshop-registrations/{id}/cancel"
        actor: Customer
        preconditions: ["registration is REGISTERED or WAITLISTED"]
        side_effects: ["session recomputes seats_taken"]

  - entity: RMA
    field: status
    initial_state: SUBMITTED
    terminal_states: [APPROVED, REJECTED]
    note: "Cyclic: UNDER_REVIEW -> INFO_REQUESTED -> UNDER_REVIEW may repeat any number of times."
    transitions:
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /rmas/{id}/review"
        actor: StoreAdmin
        preconditions: ["rma is SUBMITTED"]
        side_effects: []
      - from: UNDER_REVIEW
        to: INFO_REQUESTED
        trigger: "POST /rmas/{id}/request-info"
        actor: StoreAdmin
        preconditions: ["rma is UNDER_REVIEW"]
        side_effects: []
      - from: INFO_REQUESTED
        to: UNDER_REVIEW
        trigger: "POST /rmas/{id}/provide-info"
        actor: Customer
        preconditions: ["rma is INFO_REQUESTED"]
        side_effects: []
      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /rmas/{id}/approve"
        actor: StoreAdmin
        preconditions: ["rma is UNDER_REVIEW"]
        side_effects:
          - "compute within_warranty and refund_cents via rma_refund"
          - "restock: create a new InventoryLot on product_id with quantity_on_hand = return_quantity, status ACTIVE"
          - "the product recomputes total_available_units; if it rises to >= reorder_threshold, Product.reorder_flag flips to false"
          - "Customer.wallet_credit_cents += refund_cents"
      - from: UNDER_REVIEW
        to: REJECTED
        trigger: "POST /rmas/{id}/reject"
        actor: StoreAdmin
        preconditions: ["rma is UNDER_REVIEW"]
        side_effects: []

  - entity: InventoryLot
    field: status
    initial_state: ACTIVE
    terminal_states: []
    note: "Driven by side effects of Order confirm/ship/cancel and RMA approve; no direct client trigger."
    transitions:
      - from: ACTIVE
        to: DEPLETED
        trigger: "system: quantity_available reaches 0 after a reservation"
        actor: system
        preconditions: ["quantity_available == 0"]
        side_effects: ["excluded from total_available_units aggregation"]
      - from: DEPLETED
        to: ACTIVE
        trigger: "system: quantity_available rises above 0 after a release or restock"
        actor: system
        preconditions: ["quantity_available > 0"]
        side_effects: ["re-included in total_available_units aggregation"]

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: commercial-order-stale-account
    parent_entity: CommercialAccount
    write_endpoint: "POST /commercial-accounts/{id}/orders"
    occ_field: "expected_commercial_account_version"
    description: |
      Placing a commercial order draws down the account's available credit,
      which can only be computed correctly against the account version the
      client last observed. If the account's version has advanced since that
      read (a prior commercial order already drew credit, or an admin changed
      the tier / hold status), the placement is rejected as stale. This is the
      CREATE-with-supersede case: the new order is individually valid and would
      succeed against fresh state, so a state precondition alone cannot reject
      it; the stale-version check is what serializes the draw.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: order_net_total
    trigger: "Order placement (provisional) and Order ship (final)"
    algorithm: tiered_pricing
    input_set: "all lines on the order; discount uses account.discount_tier at the evaluation moment; RETAIL orders take discount 0"
    formula: |
      # per-line snapshot (exact integer cents; no rounding needed here)
      line_total_i = unit_price_cents_i * quantity_i
      subtotal     = sum(line_total_i)
      # ---- discount (commercial only) ----
      if order_type == RETAIL:
          discount_rate = 0.00
      else:
          base_rate   = {STANDARD:0.00, SILVER:0.05, GOLD:0.10}[discount_tier]
          volume_bonus = VOLUME_BONUS_RATE if subtotal >= VOLUME_THRESHOLD_CENTS else 0.00
          discount_rate = min(base_rate + volume_bonus, MAX_DISCOUNT_RATE)
      discount_cents = round_half_up(subtotal * discount_rate)      # round the aggregate once
      # ---- hazmat surcharge (conditional; nested min/max) ----
      if any(line.product.is_hazmat):
          total_weight_g = sum(unit_weight_g_i * quantity_i)
          hazmat = HAZMAT_BASE_CENTS + HAZMAT_PER_KG_CENTS * ceil(total_weight_g / 1000)
          hazmat_surcharge = min(hazmat, HAZMAT_CAP_CENTS)
      else:
          hazmat_surcharge = 0
      net_total = subtotal - discount_cents + hazmat_surcharge
    constants:
      VOLUME_THRESHOLD_CENTS: 500000
      VOLUME_BONUS_RATE: 0.05
      MAX_DISCOUNT_RATE: 0.12
      HAZMAT_BASE_CENTS: 1500
      HAZMAT_PER_KG_CENTS: 200
      HAZMAT_CAP_CENTS: 5000
    precision: "integer cents; round_half_up on the discount aggregate"
    variants:
      - name: provisional
        when: "at placement; writes provisional_total_cents"
        difference: "uses discount_tier as of placement time"
      - name: final
        when: "at ship; writes final_total_cents and total_cents"
        difference: "re-selects discount_tier as of ship time, so a tier change between placement and ship changes the total"

  - name: loyalty_points_accrual
    trigger: "POST /orders/{id}/pay (UNPAID->PAID)"
    algorithm: aggregation
    input_set: "all lines on the paid order; multiplier from the customer's loyalty_tier at pay time"
    formula: |
      mult = {BRONZE:1.0, SILVER:1.25, GOLD:1.5}[customer.loyalty_tier]
      # PINNED ORDER: floor per line, THEN sum (NOT floor of the summed total)
      line_points_i = floor( (line_total_cents_i / POINTS_DIVISOR_CENTS) * mult )
      earned        = sum(line_points_i)
      customer.loyalty_points += earned
    constants:
      POINTS_DIVISOR_CENTS: 100
    precision: "integer points; floor applied per line before summation"

  - name: consult_fee
    trigger: "ConsultBooking creation (estimate) and completion (actual)"
    algorithm: threshold
    input_set: "one booking; consultant.hourly_rate_cents"
    formula: |
      scheduled_minutes = (end_at - start_at) in whole minutes
      estimated_fee_cents = hourly_rate_cents * ceil(scheduled_minutes / 60)   # round UP to whole hour
      actual_fee_cents    = round_half_up(hourly_rate_cents * actual_minutes / 60)  # prorate to the minute
    constants: {}
    precision: "integer cents; estimate ceils to the hour, actual round_half_up to the minute"
    variants:
      - name: estimate
        when: "at booking creation; writes estimated_fee_cents"
        difference: "ceils scheduled duration up to whole hours"
      - name: actual
        when: "at completion; writes actual_fee_cents"
        difference: "prorates the real elapsed minutes, so the two values diverge whenever actual_minutes is not a whole multiple of 60 that ceils to the same hour"

  - name: rma_refund
    trigger: "POST /rmas/{id}/approve"
    algorithm: threshold
    input_set: "the matched order line for product_id; return_quantity; product.warranty_months; order.shipped_at; clock_now"
    formula: |
      base_cents = matched_line.unit_price_cents * return_quantity
      within_warranty = clock_now <= (order.shipped_at + product.warranty_months * WARRANTY_DAYS_PER_MONTH days)
      if within_warranty:
          refund_cents = base_cents
      else:
          refund_cents = round_half_up(base_cents * (1 - RESTOCK_FEE_RATE))
    constants:
      RESTOCK_FEE_RATE: 0.15
      WARRANTY_DAYS_PER_MONTH: 30
    precision: "integer cents; round_half_up on the restock-fee branch"

  - name: inventory_reservation
    trigger: "Order confirm (reserve), ship (consume), cancel (release); RMA approve (restock)"
    algorithm: waterfall_allocation
    input_set: "the product's InventoryLots with status IN {ACTIVE, DEPLETED}, ordered by created_at ASC then lot_code ASC"
    formula: |
      remaining = line.quantity
      for lot in lots ordered by (created_at ASC, lot_code ASC):
          take = min(remaining, lot.quantity_available)
          lot.quantity_reserved += take
          remaining -= take
          if remaining == 0: break
      # per lot: quantity_available = quantity_on_hand - quantity_reserved
      # per product: total_available_units = sum(quantity_available for ACTIVE lots)
      # reorder_flag = total_available_units < reorder_threshold
    constants: {}
    precision: "integer units; deterministic lot order is created_at ASC then lot_code ASC (never id)"

  - name: commercial_credit_used
    trigger: "recomputed on commercial Order confirm, ship, cancel"
    algorithm: aggregation
    input_set: "Orders where commercial_account_id == account.id AND fulfillment_status IN {CONFIRMED, SHIPPED}"
    formula: |
      credit_used_cents = sum(order.total_cents for those orders)
    constants: {}
    precision: "integer cents"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority; lower number wins)
# =============================================================================
validations:
  - { priority: 1,  category: auth,                 check: "X-User-Role and X-User-ID headers present and recognized", error_id: ERR_UNAUTHENTICATED, http_status: 401, applies_to: "all" }
  - { priority: 2,  category: auth,                 check: "role permitted for this operation per RBAC", error_id: ERR_UNAUTHORIZED, http_status: 403, applies_to: "all" }
  - { priority: 10, category: existence,            check: "path/body referenced resources exist, validated left-to-right", error_id: ERR_NOT_FOUND, http_status: 404, applies_to: "all" }
  - { priority: 20, category: business_constraint,  check: "required body fields present and enum/type/range valid (unit_price_cents>0, quantity>0, end_at>start_at, capacity<=room.seat_capacity, etc.)", error_id: ERR_VALIDATION, http_status: 422, applies_to: "all writes" }
  - { priority: 22, category: business_referential, check: "acting entity_backed user owns the target resource (X-User-ID matches the resource's owning FK)", error_id: ERR_OWNERSHIP_REQUIRED, http_status: 403, applies_to: "Customer/CommercialBuyer/Consultant owned writes" }
  - { priority: 30, category: state,                check: "target resource in a legal state for this transition", error_id: ERR_INVALID_STATE, http_status: 409, applies_to: "all transitions" }
  - { priority: 31, category: state,                check: "commercial order placement requires account.status == ACTIVE", error_id: ERR_ACCOUNT_NOT_ACTIVE, http_status: 409, applies_to: "POST /commercial-accounts/{id}/orders" }
  - { priority: 32, category: state,                check: "workshop registration requires session.status == OPEN", error_id: ERR_SESSION_NOT_OPEN, http_status: 409, applies_to: "POST /workshop-sessions/{id}/registrations" }
  - { priority: 33, category: state,                check: "subscription pause/resume requires the matching ACTIVE/PAUSED state; subscribed product must be is_subscribable at creation", error_id: ERR_SUBSCRIPTION_INVALID, http_status: 409, applies_to: "subscription writes" }
  - { priority: 40, category: business_safety,      check: "RMA target product must not be is_hazmat (hazmat goods are non-returnable)", error_id: ERR_HAZMAT_NOT_RETURNABLE, http_status: 422, applies_to: "POST /rmas" }
  - { priority: 45, category: business_temporal,    check: "consultant booking window must not fall within buffer_minutes of an existing REQUESTED/CONFIRMED booking on that consultant", error_id: ERR_CONSULTANT_UNAVAILABLE, http_status: 409, applies_to: "POST /consultants/{id}/bookings" }
  - { priority: 46, category: business_temporal,    check: "workshop session [start,end) must not overlap an existing non-CANCELLED session in the same room (half-open; adjacency allowed)", error_id: ERR_ROOM_DOUBLE_BOOKED, http_status: 409, applies_to: "POST /workshop-sessions" }
  - { priority: 50, category: business_referential, check: "RMA product_id must be a line on the referenced order; return_quantity <= ordered quantity", error_id: ERR_PRODUCT_NOT_IN_ORDER, http_status: 409, applies_to: "POST /rmas" }
  - { priority: 55, category: business_constraint,  check: "order confirm/placement requires sufficient Product.total_available_units for every line", error_id: ERR_INSUFFICIENT_STOCK, http_status: 409, applies_to: "order confirm and commercial order placement" }
  - { priority: 60, category: business_fiscal,      check: "commercial order placement requires credit_used_cents + order.total_cents <= credit_limit_cents (strict: equality allowed)", error_id: ERR_CREDIT_LIMIT_EXCEEDED, http_status: 402, applies_to: "POST /commercial-accounts/{id}/orders" }
  - { priority: 70, category: business_constraint,  check: "OCC: expected_commercial_account_version must equal the account's current version", error_id: ERR_STALE_VERSION, http_status: 412, applies_to: "POST /commercial-accounts/{id}/orders" }

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- Products & Inventory ----
  - { method: POST, path: "/products", description: "Create a catalog product", roles: [StoreAdmin], code: 201, input: [sku_code, name, category, unit_price_cents, "is_hazmat?", "warranty_months?", "is_subscribable?", "reorder_threshold?", "unit_weight_g?"], output: Product, side_effects: ["total_available_units=0", "reorder_flag = (0 < reorder_threshold)"] }
  - { method: GET,  path: "/products/{id}", description: "Fetch a product", roles: [StoreAdmin, Customer, CommercialBuyer, Consultant], code: 200, input: [], output: Product, side_effects: [] }
  - { method: POST, path: "/products/{id}/inventory-lots", description: "Receive an inventory lot for a product", roles: [StoreAdmin], code: 201, input: [lot_code, quantity_on_hand, "unit_cost_cents?"], output: InventoryLot, side_effects: ["lot.quantity_reserved=0", "product recomputes total_available_units and reorder_flag"] }
  - { method: GET,  path: "/products/{id}/inventory-lots", description: "List a product's inventory lots (reverse-reach InventoryLot.product_id)", roles: [StoreAdmin], code: 200, input: ["limit?", "offset?"], output: "InventoryLot[]", side_effects: [] }

  # ---- Customers ----
  - { method: POST, path: "/customers", description: "Register a retail customer", roles: [StoreAdmin], code: 201, input: [email, full_name], output: Customer, side_effects: ["wallet_credit_cents=0", "loyalty_points=0", "loyalty_tier=BRONZE", "status=ACTIVE"] }
  - { method: GET,  path: "/customers/{id}", description: "Fetch a customer", roles: [StoreAdmin, Customer], code: 200, input: [], output: Customer, side_effects: [] }

  # ---- Commercial accounts ----
  - { method: POST, path: "/commercial-accounts", description: "Create a commercial account (PENDING)", roles: [StoreAdmin], code: 201, input: [business_name, credit_limit_cents, "payment_terms_net_days?", "discount_tier?"], output: CommercialAccount, side_effects: ["status=PENDING", "credit_used_cents=0"] }
  - { method: GET,  path: "/commercial-accounts/{id}", description: "Fetch a commercial account", roles: [StoreAdmin, CommercialBuyer], code: 200, input: [], output: CommercialAccount, side_effects: [] }
  - { method: POST, path: "/commercial-accounts/{id}/activate", description: "Activate a PENDING/ON_HOLD account", roles: [StoreAdmin], code: 200, input: [], output: CommercialAccount, side_effects: ["status->ACTIVE", "increments CommercialAccount.version by 1"] }
  - { method: POST, path: "/commercial-accounts/{id}/hold", description: "Place an ACTIVE account ON_HOLD", roles: [StoreAdmin], code: 200, input: [], output: CommercialAccount, side_effects: ["status->ON_HOLD", "increments CommercialAccount.version by 1"] }
  - { method: POST, path: "/commercial-accounts/{id}/set-tier", description: "Change the account discount tier", roles: [StoreAdmin], code: 200, input: [discount_tier], output: CommercialAccount, side_effects: ["discount_tier updated", "increments CommercialAccount.version by 1"] }
  - { method: POST, path: "/commercial-accounts/{id}/orders", description: "Place a commercial order (created directly CONFIRMED, draws credit, OCC-guarded)", roles: [CommercialBuyer], code: 201, input: [lines, expected_commercial_account_version], output: Order, side_effects: ["order_type=COMMERCIAL, fulfillment_status=CONFIRMED", "reserve inventory (inventory_reservation) with lot depletion cascade", "compute provisional_total_cents (order_net_total)", "recompute credit_used_cents", "increments CommercialAccount.version by 1"] }

  # ---- Orders (retail create + lifecycle for both types) ----
  - { method: POST, path: "/orders", description: "Place a retail order (DRAFT)", roles: [Customer], code: 201, input: [customer_id, lines], output: Order, side_effects: ["order_type=RETAIL, fulfillment_status=DRAFT, payment_status=UNPAID", "compute provisional_total_cents (order_net_total)"] }
  - { method: GET,  path: "/orders/{id}", description: "Fetch an order", roles: [StoreAdmin, Customer, CommercialBuyer], code: 200, input: [], output: Order, side_effects: [] }
  - { method: GET,  path: "/orders", description: "List/filter orders (reverse-reach Order.customer_id and Order.commercial_account_id)", roles: [StoreAdmin, Customer, CommercialBuyer], code: 200, input: ["customer_id?", "commercial_account_id?", "status?", "limit?", "offset?"], output: "Order[]", side_effects: [] }
  - { method: POST, path: "/orders/{id}/confirm", description: "Confirm a retail DRAFT order: reserve inventory", roles: [Customer, StoreAdmin], code: 200, input: [], output: Order, side_effects: ["fulfillment_status->CONFIRMED", "reserve inventory (inventory_reservation) with lot depletion + product reorder cascade"] }
  - { method: POST, path: "/orders/{id}/pay", description: "Pay an order: accrue loyalty", roles: [Customer], code: 200, input: [], output: Order, side_effects: ["payment_status->PAID", "loyalty_points_accrual on the customer"] }
  - { method: POST, path: "/orders/{id}/ship", description: "Ship a CONFIRMED order: consume reserved stock, finalize total", roles: [StoreAdmin], code: 200, input: [], output: Order, side_effects: ["fulfillment_status->SHIPPED", "compute final_total_cents", "consume lots (on_hand and reserved decremented)", "set shipped_at"] }
  - { method: POST, path: "/orders/{id}/cancel", description: "Cancel a DRAFT/CONFIRMED order: release reservations and credit", roles: [Customer, StoreAdmin], code: 200, input: [], output: Order, side_effects: ["fulfillment_status->CANCELLED", "release reserved lots (un-deplete), recompute product totals", "for commercial: release credit, bump account version"] }
  - { method: POST, path: "/orders/{id}/refund", description: "Refund a PAID order to store credit", roles: [StoreAdmin], code: 200, input: [], output: Order, side_effects: ["payment_status->REFUNDED", "Customer.wallet_credit_cents += total_cents", "reverse loyalty points"] }

  # ---- Subscriptions ----
  - { method: POST, path: "/subscriptions", description: "Create a consumable subscription", roles: [Customer], code: 201, input: [customer_id, product_id, interval_days, quantity_per_cycle], output: Subscription, side_effects: ["status=ACTIVE", "price_locked_cents = product.unit_price_cents", "next_ship_at = clock_now + interval_days"] }
  - { method: GET,  path: "/subscriptions/{id}", description: "Fetch a subscription", roles: [StoreAdmin, Customer], code: 200, input: [], output: Subscription, side_effects: [] }
  - { method: GET,  path: "/subscriptions", description: "List/filter subscriptions (reverse-reach Subscription.customer_id and Subscription.product_id)", roles: [StoreAdmin, Customer], code: 200, input: ["customer_id?", "product_id?", "limit?", "offset?"], output: "Subscription[]", side_effects: [] }
  - { method: POST, path: "/subscriptions/{id}/pause", description: "Pause an ACTIVE subscription", roles: [Customer], code: 200, input: [], output: Subscription, side_effects: ["status->PAUSED", "freeze next_ship_at"] }
  - { method: POST, path: "/subscriptions/{id}/resume", description: "Resume a PAUSED subscription", roles: [Customer], code: 200, input: [], output: Subscription, side_effects: ["status->ACTIVE", "next_ship_at = clock_now + interval_days"] }
  - { method: POST, path: "/subscriptions/{id}/cancel", description: "Cancel a subscription", roles: [Customer], code: 200, input: [], output: Subscription, side_effects: ["status->CANCELLED"] }

  # ---- Consultants & bookings ----
  - { method: POST, path: "/consultants", description: "Create a design consultant", roles: [StoreAdmin], code: 201, input: [name, specialty, hourly_rate_cents, "buffer_minutes?"], output: Consultant, side_effects: ["status=ACTIVE"] }
  - { method: GET,  path: "/consultants/{id}", description: "Fetch a consultant", roles: [StoreAdmin, Customer, Consultant], code: 200, input: [], output: Consultant, side_effects: [] }
  - { method: POST, path: "/consultants/{id}/bookings", description: "Book a build/design consult (temporal-overlap checked with buffer)", roles: [Customer], code: 201, input: [customer_id, start_at, end_at, "design_scope?"], output: ConsultBooking, side_effects: ["status=REQUESTED", "compute estimated_fee_cents (consult_fee estimate)"] }
  - { method: GET,  path: "/consultants/{id}/bookings", description: "List a consultant's bookings (reverse-reach ConsultBooking.consultant_id)", roles: [StoreAdmin, Consultant], code: 200, input: ["limit?", "offset?"], output: "ConsultBooking[]", side_effects: [] }
  - { method: GET,  path: "/consult-bookings/{id}", description: "Fetch a consult booking", roles: [StoreAdmin, Customer, Consultant], code: 200, input: [], output: ConsultBooking, side_effects: [] }
  - { method: GET,  path: "/consult-bookings", description: "List/filter consult bookings (reverse-reach ConsultBooking.customer_id)", roles: [StoreAdmin], code: 200, input: ["consultant_id?", "customer_id?", "limit?", "offset?"], output: "ConsultBooking[]", side_effects: [] }
  - { method: POST, path: "/consult-bookings/{id}/confirm", description: "Confirm a requested booking", roles: [Consultant, StoreAdmin], code: 200, input: [], output: ConsultBooking, side_effects: ["status->CONFIRMED"] }
  - { method: POST, path: "/consult-bookings/{id}/complete", description: "Complete a booking with actual minutes", roles: [Consultant], code: 200, input: [actual_minutes], output: ConsultBooking, side_effects: ["status->COMPLETED", "compute actual_fee_cents (consult_fee actual)"] }
  - { method: POST, path: "/consult-bookings/{id}/cancel", description: "Cancel a booking", roles: [Customer, Consultant, StoreAdmin], code: 200, input: [], output: ConsultBooking, side_effects: ["status->CANCELLED"] }

  # ---- Rooms & workshops ----
  - { method: POST, path: "/rooms", description: "Create a workshop room", roles: [StoreAdmin], code: 201, input: [name, "seat_capacity?"], output: Room, side_effects: [] }
  - { method: GET,  path: "/rooms/{id}", description: "Fetch a room", roles: [StoreAdmin, Customer], code: 200, input: [], output: Room, side_effects: [] }
  - { method: POST, path: "/workshop-sessions", description: "Schedule a workshop session in a room (temporal-overlap checked, half-open)", roles: [StoreAdmin], code: 201, input: [room_id, title, start_at, end_at, capacity], output: WorkshopSession, side_effects: ["status=SCHEDULED", "seats_taken=0"] }
  - { method: GET,  path: "/workshop-sessions/{id}", description: "Fetch a workshop session", roles: [StoreAdmin, Customer], code: 200, input: [], output: WorkshopSession, side_effects: [] }
  - { method: GET,  path: "/workshop-sessions", description: "List/filter sessions (reverse-reach WorkshopSession.room_id)", roles: [StoreAdmin, Customer], code: 200, input: ["room_id?", "limit?", "offset?"], output: "WorkshopSession[]", side_effects: [] }
  - { method: POST, path: "/workshop-sessions/{id}/open", description: "Open a scheduled session for registration", roles: [StoreAdmin], code: 200, input: [], output: WorkshopSession, side_effects: ["status->OPEN"] }
  - { method: POST, path: "/workshop-sessions/{id}/cancel", description: "Cancel a session (cascade-cancel registrations)", roles: [StoreAdmin], code: 200, input: [], output: WorkshopSession, side_effects: ["status->CANCELLED", "cascade cancel all non-terminal registrations"] }
  - { method: POST, path: "/workshop-sessions/{id}/registrations", description: "Register a customer for an OPEN session (REGISTERED or WAITLISTED at capacity)", roles: [Customer], code: 201, input: [customer_id], output: WorkshopRegistration, side_effects: ["status=REGISTERED if seats_taken<capacity else WAITLISTED", "recompute seats_taken"] }
  - { method: GET,  path: "/workshop-sessions/{id}/registrations", description: "List a session's registrations (reverse-reach WorkshopRegistration.session_id)", roles: [StoreAdmin, Customer], code: 200, input: ["limit?", "offset?"], output: "WorkshopRegistration[]", side_effects: [] }
  - { method: GET,  path: "/workshop-registrations/{id}", description: "Fetch a registration", roles: [StoreAdmin, Customer], code: 200, input: [], output: WorkshopRegistration, side_effects: [] }
  - { method: GET,  path: "/workshop-registrations", description: "List/filter registrations (reverse-reach WorkshopRegistration.customer_id)", roles: [StoreAdmin], code: 200, input: ["session_id?", "customer_id?", "limit?", "offset?"], output: "WorkshopRegistration[]", side_effects: [] }
  - { method: POST, path: "/workshop-registrations/{id}/cancel", description: "Cancel a registration (promote earliest waitlist on freed seat)", roles: [Customer, StoreAdmin], code: 200, input: [], output: WorkshopRegistration, side_effects: ["status->CANCELLED", "recompute seats_taken", "promote earliest WAITLISTED if a REGISTERED seat freed"] }

  # ---- Warranty / RMA ----
  - { method: POST, path: "/rmas", description: "Submit an RMA against a shipped order line", roles: [Customer], code: 201, input: [order_id, product_id, return_quantity, reason], output: RMA, side_effects: ["status=SUBMITTED"] }
  - { method: GET,  path: "/rmas/{id}", description: "Fetch an RMA", roles: [StoreAdmin, Customer], code: 200, input: [], output: RMA, side_effects: [] }
  - { method: GET,  path: "/rmas", description: "List/filter RMAs (reverse-reach RMA.order_id and RMA.product_id)", roles: [StoreAdmin], code: 200, input: ["order_id?", "product_id?", "limit?", "offset?"], output: "RMA[]", side_effects: [] }
  - { method: POST, path: "/rmas/{id}/review", description: "Begin review (SUBMITTED->UNDER_REVIEW)", roles: [StoreAdmin], code: 200, input: [], output: RMA, side_effects: ["status->UNDER_REVIEW"] }
  - { method: POST, path: "/rmas/{id}/request-info", description: "Request more info (UNDER_REVIEW->INFO_REQUESTED)", roles: [StoreAdmin], code: 200, input: ["note?"], output: RMA, side_effects: ["status->INFO_REQUESTED"] }
  - { method: POST, path: "/rmas/{id}/provide-info", description: "Provide requested info (INFO_REQUESTED->UNDER_REVIEW)", roles: [Customer], code: 200, input: ["note?"], output: RMA, side_effects: ["status->UNDER_REVIEW"] }
  - { method: POST, path: "/rmas/{id}/approve", description: "Approve an RMA: restock, refund to wallet", roles: [StoreAdmin], code: 200, input: [], output: RMA, side_effects: ["status->APPROVED", "compute within_warranty and refund_cents (rma_refund)", "restock InventoryLot, recompute product totals", "Customer.wallet_credit_cents += refund_cents"] }
  - { method: POST, path: "/rmas/{id}/reject", description: "Reject an RMA", roles: [StoreAdmin], code: 200, input: ["note?"], output: RMA, side_effects: ["status->REJECTED"] }

  # ---- Test-driving logical clock ----
  - { method: POST, path: "/_clock/set_current_utc", description: "Set the server logical clock. Startup default is 2026-07-01T00:00:00Z; before any set call the clock reads exactly this default and never falls back to wall-clock time.", roles: [StoreAdmin], code: 200, input: [to_iso8601], output: null, side_effects: ["logical clock advanced; drives next_ship_at, shipped_at, warranty and booking windows"] }

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED,      http: 401, condition: "missing/unrecognized X-User-Role or X-User-ID" }
  - { id: ERR_UNAUTHORIZED,         http: 403, condition: "authenticated role not permitted for this operation" }
  - { id: ERR_OWNERSHIP_REQUIRED,   http: 403, condition: "entity_backed actor is not the owner of the target resource" }
  - { id: ERR_NOT_FOUND,            http: 404, condition: "referenced resource does not exist" }
  - { id: ERR_VALIDATION,           http: 422, condition: "missing required field, bad enum/type, or out-of-range value (e.g. quantity<=0, end_at<=start_at, capacity>room.seat_capacity)" }
  - { id: ERR_INVALID_STATE,        http: 409, condition: "transition not allowed from the resource's current state" }
  - { id: ERR_ACCOUNT_NOT_ACTIVE,   http: 409, condition: "commercial order placement while account.status != ACTIVE" }
  - { id: ERR_SESSION_NOT_OPEN,     http: 409, condition: "workshop registration while session.status != OPEN" }
  - { id: ERR_SUBSCRIPTION_INVALID, http: 409, condition: "subscription state precondition failed, or product not is_subscribable" }
  - { id: ERR_HAZMAT_NOT_RETURNABLE,http: 422, condition: "RMA target product is_hazmat" }
  - { id: ERR_CONSULTANT_UNAVAILABLE,http: 409, condition: "requested consult window falls within buffer_minutes of an existing booking" }
  - { id: ERR_ROOM_DOUBLE_BOOKED,   http: 409, condition: "workshop session interval overlaps an existing non-CANCELLED session in the same room" }
  - { id: ERR_PRODUCT_NOT_IN_ORDER, http: 409, condition: "RMA product_id is not a line on the referenced order, or return_quantity exceeds ordered quantity" }
  - { id: ERR_INSUFFICIENT_STOCK,   http: 409, condition: "not enough total_available_units to reserve an order line" }
  - { id: ERR_CREDIT_LIMIT_EXCEEDED,http: 402, condition: "credit_used_cents + order.total_cents > credit_limit_cents" }
  - { id: ERR_STALE_VERSION,        http: 412, condition: "expected_commercial_account_version != account.version" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: StoreAdmin
    description: "Operator: manages catalog, inventory, commercial accounts, consultants, rooms, workshops, order fulfillment, and RMA decisions"
    identity: "opaque"
    exclusive_operations:
      - "POST /products"
      - "POST /products/{id}/inventory-lots"
      - "POST /customers"
      - "POST /commercial-accounts"
      - "POST /commercial-accounts/{id}/activate|hold|set-tier"
      - "POST /orders/{id}/ship"
      - "POST /orders/{id}/refund"
      - "POST /consultants"
      - "POST /rooms"
      - "POST /workshop-sessions and /workshop-sessions/{id}/open|cancel"
      - "POST /rmas/{id}/review|request-info|approve|reject"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "GET reads across resources"
      - "POST /orders/{id}/confirm|cancel (with Customer)"
      - "POST /consult-bookings/{id}/confirm|cancel (with Consultant/Customer)"
      - "POST /workshop-registrations/{id}/cancel (with Customer)"

  - name: Customer
    description: "Retail buyer: places retail orders, pays, subscribes, books consults, registers for workshops, submits RMAs"
    identity: "entity_backed:Customer"
    exclusive_operations:
      - "POST /orders"
      - "POST /orders/{id}/pay"
      - "POST /subscriptions and pause|resume|cancel"
      - "POST /consultants/{id}/bookings"
      - "POST /workshop-sessions/{id}/registrations"
      - "POST /rmas and /rmas/{id}/provide-info"
    shared_operations:
      - "POST /orders/{id}/confirm|cancel (with StoreAdmin)"
      - "POST /consult-bookings/{id}/cancel (with Consultant/StoreAdmin)"
      - "POST /workshop-registrations/{id}/cancel (with StoreAdmin)"
      - "GET reads of own resources"

  - name: CommercialBuyer
    description: "B2B buyer acting on a commercial account: places commercial orders on their own account"
    identity: "entity_backed:CommercialAccount"
    exclusive_operations:
      - "POST /commercial-accounts/{id}/orders (id must equal X-User-ID)"
    shared_operations:
      - "GET /commercial-accounts/{id}, GET /orders of own account"

  - name: Consultant
    description: "Design consultant acting on own bookings"
    identity: "entity_backed:Consultant"
    exclusive_operations:
      - "POST /consult-bookings/{id}/complete (own booking)"
    shared_operations:
      - "POST /consult-bookings/{id}/confirm (with StoreAdmin)"
      - "POST /consult-bookings/{id}/cancel (with Customer/StoreAdmin)"
      - "GET /consultants/{id}/bookings for self"
