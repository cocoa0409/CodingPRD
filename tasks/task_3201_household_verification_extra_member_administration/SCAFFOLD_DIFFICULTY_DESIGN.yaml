  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: playback_requires_device_trusted
        grounds:
          - validations[priority=13]
          - entities.Device.fields.trust_status
          - errors[ERR_DEVICE_NOT_TRUSTED]
        distinguishing_aspect: |
          Entity pair PlaybackSession -> Device: session admission depends on
          the device's trust_status (or an ACTIVE travel pass); an UNTRUSTED
          device with no pass rejects playback with ERR_DEVICE_NOT_TRUSTED.
        test_recipe:
          setup:
            - "NA STANDARD account, household, and one device left UNTRUSTED (never trusted, no travel pass)"
          setup_api_calls:
            - call: "POST /hv/accounts"
              payload: { email: "ce1@x.com", region_code: "NA", plan_tier: "STANDARD" }
              as: PlatformAdmin
              captures: { acc_id: $.data.id, owner_id: $.data.owner_member_id }
            - call: "POST /hv/accounts/${acc_id}/households"
              payload: { label: "Home", primary_location: "1 Main St", network_fingerprint: "fp-home-1", geo_cell: "geo-home-1" }
              as: AccountOwner
              as_user_id: "${owner_id}"
              captures: { hh_id: $.data.id }
            - call: "POST /hv/households/${hh_id}/devices"
              payload: { device_label: "TV", device_type: "TV", network_fingerprint: "fp-home-1", geo_cell: "geo-home-1" }
              as: AccountOwner
              as_user_id: "${owner_id}"
              captures: { dev_id: $.data.id }
          trigger:
            - call: "POST /hv/members/${owner_id}/playback-sessions"
              payload: { device_id: "${dev_id}", requested_resolution: "HD" }
              as: AccountOwner
              as_user_id: "${owner_id}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_DEVICE_NOT_TRUSTED"
            - "Device.${dev_id}.trust_status == UNTRUSTED"
            - "Member.${owner_id}.current_streams == 0"

      - name: slot_assign_requires_verified_posture
        grounds:
          - validations[priority=8]
          - entities.Account.fields.verification_posture
          - errors[ERR_ACCOUNT_NOT_VERIFIED]
        distinguishing_aspect: |
          Entity pair ExtraMemberSlot -> Account (a different pair than
          PlaybackSession -> Device): assigning an OFFERED slot requires the
          account's verification_posture == VERIFIED; with a challenge open
          (CHALLENGE_PENDING) the assign is rejected with
          ERR_ACCOUNT_NOT_VERIFIED.
        test_recipe:
          setup:
            - "NA STANDARD account with one purchased OFFERED slot"
            - "an open verification challenge has flipped the account posture to CHALLENGE_PENDING"
          setup_api_calls:
            - call: "POST /hv/accounts"
              payload: { email: "ce2@x.com", region_code: "NA", plan_tier: "STANDARD" }
              as: PlatformAdmin
              captures: { acc_id: $.data.id, owner_id: $.data.owner_member_id }
            - call: "GET /hv/accounts/${acc_id}"
              as: PlatformAdmin
              captures: { acc_v1: $.data.version }
            - call: "POST /hv/accounts/${acc_id}/extra-member-slots"
              payload: { payer_member_id: "${owner_id}", transfer_rights: "TRANSFERABLE", expected_account_version: "${acc_v1}" }
              as: AccountOwner
              as_user_id: "${owner_id}"
              captures: { slot_id: $.data.id }
            - call: "POST /hv/accounts/${acc_id}/verification-challenges"
              payload: { channel: "EMAIL", challenge_reason: "NEW_DEVICE" }
              as: PlatformAdmin
              captures: { ch_id: $.data.id }
          trigger:
            - call: "POST /hv/extra-member-slots/${slot_id}/assign"
              payload: { email: "extra-ce2@x.com", display_name: "Extra CE2", member_region: "NA" }
              as: AccountOwner
              as_user_id: "${owner_id}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_ACCOUNT_NOT_VERIFIED"
            - "ExtraMemberSlot.${slot_id}.status == OFFERED"
            - "Account.${acc_id}.verification_posture == CHALLENGE_PENDING"

  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: travel_pass_half_open_adjacency
        grounds:
          - validations[priority=12]
          - calculations.stream_admission_decision
          - errors[ERR_TRAVEL_PASS_OVERLAP]
        distinguishing_aspect: |
          Interval semantics: half-open [starts_at, ends_at) windows on a
          Device — a pass starting exactly when the previous one ends is
          allowed (adjacency), while a pass starting one minute before the
          previous end is rejected with ERR_TRAVEL_PASS_OVERLAP.
        test_recipe:
          setup:
            - "NA STANDARD account, household, one device (travel passes do not require trust)"
          setup_api_calls:
            - call: "POST /hv/accounts"
              payload: { email: "to1@x.com", region_code: "NA", plan_tier: "STANDARD" }
              as: PlatformAdmin
              captures: { acc_id: $.data.id, owner_id: $.data.owner_member_id }
            - call: "POST /hv/accounts/${acc_id}/households"
              payload: { label: "Home", primary_location: "1 Main St", network_fingerprint: "fp-home-1", geo_cell: "geo-home-1" }
              as: AccountOwner
              as_user_id: "${owner_id}"
              captures: { hh_id: $.data.id }
            - call: "POST /hv/households/${hh_id}/devices"
              payload: { device_label: "Phone", device_type: "MOBILE", network_fingerprint: "fp-away-1", geo_cell: "geo-away-1" }
              as: AccountOwner
              as_user_id: "${owner_id}"
              captures: { dev_id: $.data.id }
            - call: "POST /hv/devices/${dev_id}/travel-passes"
              payload: { grant_type: "TEMPORARY_14D", starts_at: "2026-09-01T00:00:00Z" }
              as: AccountOwner
              as_user_id: "${owner_id}"
              captures: { pass1: $.data.id }
          trigger:
            - call: "POST /hv/devices/${dev_id}/travel-passes"
              payload: { grant_type: "TEMPORARY_14D", starts_at: "2026-09-14T23:59:00Z" }
              as: AccountOwner
              as_user_id: "${owner_id}"
              captures: { err: $.data.error_id }
            - call: "POST /hv/devices/${dev_id}/travel-passes"
              payload: { grant_type: "TEMPORARY_14D", starts_at: "2026-09-15T00:00:00Z" }
              as: AccountOwner
              as_user_id: "${owner_id}"
              captures: { pass2: $.data.id }
          assert:
            - "err == ERR_TRAVEL_PASS_OVERLAP"
            - "TravelPass.${pass1}.ends_at == 2026-09-15T00:00:00Z"
            - "TravelPass.${pass2}.status == ACTIVE and starts_at == 2026-09-15T00:00:00Z"

      - name: challenge_reissue_cooldown_buffer
        grounds:
          - validations[priority=10]
          - state_machines.VerificationChallenge.EXPIRED_to_PENDING
          - errors[ERR_CHALLENGE_COOLDOWN]
        distinguishing_aspect: |
          Interval semantics: a closed cooldown buffer on the Account's
          challenge — reissue is rejected while now < expires_at + 300s
          (adjacency to the expiry instant is NOT allowed inside the buffer),
          different semantics from the travel pass's half-open adjacency, and
          on a different resource (challenge vs device pass).
        test_recipe:
          setup:
            - "NA STANDARD account with an EMAIL challenge issued at 2026-09-01T00:00:00Z (expires 00:15:00)"
            - "clock advanced to 00:16:00 — past expiry but inside the 300s cooldown buffer"
          setup_api_calls:
            - call: "POST /hv/accounts"
              payload: { email: "to2@x.com", region_code: "NA", plan_tier: "STANDARD" }
              as: PlatformAdmin
              captures: { acc_id: $.data.id, owner_id: $.data.owner_member_id }
            - call: "POST /hv/accounts/${acc_id}/verification-challenges"
              payload: { channel: "EMAIL", challenge_reason: "NEW_DEVICE" }
              as: PlatformAdmin
              captures: { ch_id: $.data.id }
            - call: "POST /hv/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:16:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /hv/verification-challenges/${ch_id}/reissue"
              as: AccountOwner
              as_user_id: "${owner_id}"
              captures: { err: $.data.error_id }
            - call: "POST /hv/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:20:00Z" }
              as: PlatformAdmin
            - call: "POST /hv/verification-challenges/${ch_id}/reissue"
              as: AccountOwner
              as_user_id: "${owner_id}"
              captures: { st2: $.data.status }
          assert:
            - "err == ERR_CHALLENGE_COOLDOWN"
            - "st2 == PENDING"
            - "VerificationChallenge.${ch_id}.attempts_used == 0"

  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: slot_purchase_grace_revoke_revenue_conservation
        grounds:
          - calculations.proration_credit_cents
          - entities.Account.fields.extra_member_net_revenue_cents
        distinguishing_aspect: |
          Conserved quantity: money. The forward action (slot purchase, +799
          billed) paired with its compensating action (revoke inside the 7-day
          full-credit window, +799 credit) leaves the account's
          extra_member_net_revenue_cents == billed - credit unchanged at 0.
        test_recipe:
          setup:
            - "NA STANDARD account created 2026-09-01 (anchor day 1); clock advanced to 2026-09-05 before the revoke (within the full-credit window)"
          setup_api_calls:
            - call: "POST /hv/accounts"
              payload: { email: "ci1@x.com", region_code: "NA", plan_tier: "STANDARD" }
              as: PlatformAdmin
              captures: { acc_id: $.data.id, owner_id: $.data.owner_member_id }
            - call: "GET /hv/accounts/${acc_id}"
              as: PlatformAdmin
              captures: { acc_v1: $.data.version, net_before: $.data.extra_member_net_revenue_cents }
            - call: "POST /hv/accounts/${acc_id}/extra-member-slots"
              payload: { payer_member_id: "${owner_id}", transfer_rights: "TRANSFERABLE", expected_account_version: "${acc_v1}" }
              as: AccountOwner
              as_user_id: "${owner_id}"
              captures: { slot_id: $.data.id }
            - call: "POST /hv/extra-member-slots/${slot_id}/assign"
              payload: { email: "extra-ci1@x.com", display_name: "Extra CI1", member_region: "NA" }
              as: AccountOwner
              as_user_id: "${owner_id}"
            - call: "POST /hv/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-05T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /hv/extra-member-slots/${slot_id}/revoke"
              as: AccountOwner
              as_user_id: "${owner_id}"
              captures: { credit: $.data.credit_cents }
            - call: "GET /hv/accounts/${acc_id}"
              as: PlatformAdmin
              captures: { billed_after: $.data.extra_member_billed_cents, credit_after: $.data.extra_member_credit_cents, net_after: $.data.extra_member_net_revenue_cents }
          assert:
            - "credit == 799"
            - "billed_after == 799"
            - "credit_after == 799"
            - "net_after == net_before == 0"

      - name: download_create_delete_counter_conservation
        grounds:
          - calculations.download_allowance_check
          - entities.Member.fields.downloads_used_this_month
        distinguishing_aspect: |
          Conserved quantity: a usage counter (different type than money).
          The forward action (download create, +1) paired with its
          compensating action (delete, -1) leaves
          member.downloads_used_this_month and the account's ACTIVE download
          count unchanged.
        test_recipe:
          setup:
            - "NA BASIC account, household, one TRUSTED device; counter starts at 0"
          setup_api_calls:
            - call: "POST /hv/accounts"
              payload: { email: "ci2@x.com", region_code: "NA", plan_tier: "BASIC" }
              as: PlatformAdmin
              captures: { acc_id: $.data.id, owner_id: $.data.owner_member_id }
            - call: "POST /hv/accounts/${acc_id}/households"
              payload: { label: "Home", primary_location: "1 Main St", network_fingerprint: "fp-home-1", geo_cell: "geo-home-1" }
              as: AccountOwner
              as_user_id: "${owner_id}"
              captures: { hh_id: $.data.id }
            - call: "POST /hv/households/${hh_id}/devices"
              payload: { device_label: "Tablet", device_type: "MOBILE", network_fingerprint: "fp-home-1", geo_cell: "geo-home-1" }
              as: AccountOwner
              as_user_id: "${owner_id}"
              captures: { dev_id: $.data.id }
            - call: "POST /hv/devices/${dev_id}/trust"
              as: AccountOwner
              as_user_id: "${owner_id}"
            - call: "GET /hv/members/${owner_id}"
              as: AccountOwner
              as_user_id: "${owner_id}"
              captures: { used_before: $.data.downloads_used_this_month }
          trigger:
            - call: "POST /hv/members/${owner_id}/downloads"
              payload: { device_id: "${dev_id}", title_id: "t-inv" }
              as: AccountOwner
              as_user_id: "${owner_id}"
              captures: { dl_id: $.data.id }
            - call: "DELETE /hv/downloads/${dl_id}"
              as: AccountOwner
              as_user_id: "${owner_id}"
              captures: { dl_status: $.data.status }
            - call: "GET /hv/members/${owner_id}"
              as: AccountOwner
              as_user_id: "${owner_id}"
              captures: { used_after: $.data.downloads_used_this_month }
          assert:
            - "dl_status == DELETED"
            - "used_before == 0"
            - "used_after == 0"
            - "used_after == used_before"
