# =============================================================================
# §1.8 Scaffold Difficulty Design — Test Targeting Index
# Cross-references SCAFFOLD.yaml §1.1–§1.7 against the nine §0.5 Difficulty Rules.
# 9 rule_ids × 2 instances = 18 instances.
# Constants (from SCAFFOLD.yaml): UPCHARGE {MONOGRAM:1500, CONTRAST_LINING:4000,
#   WORKING_CUFFS:6000, PICK_STITCH:3500, EXTRA_TROUSER:9000};
#   yardage tiers (1.00 / 0.90 / 0.80 at 3m / 3m / rest), round-per-tier-then-sum;
#   RUSH_RATE 0.30; DEPOSIT_RATE 0.50; RUSH_DEPOSIT_FLOOR 20000;
#   group disc tier1 n>=4 -> 0.05, tier2 n>=8 -> 0.10; GROUP_MIN_MEMBERS 3;
#   REMAKE_BASE 5000 step 3000; MAX_REMAKES 2;
#   risk WATCH>=0.34 HIGH>=0.50.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: dual_variant_quote_vs_locked_invoice_diverge_on_fabric_reprice
        grounds:
          - calculations.order_quote_total
          - calculations.order_final_invoice
          - calculations.yardage_cost
          - entities.GarmentOptionLine.fields.fabric_price_per_meter_cents
          - state_machines.GarmentOrder.DRAFT_to_CONFIRMED
        distinguishing_aspect: |
          On the GarmentOrder entity domain: the DRAFT provisional quote uses the LIVE Fabric
          catalog price while the CONFIRMED final invoice uses the per-line snapshot frozen at
          line creation; after a catalog reprice the two produce different cents.
        test_recipe:
          setup:
            - "Customer C1 with a DRAFT measurement profile."
            - "Fabric F1 created at 6000 cents/meter, bolt 50 meters."
            - "Order O1: base_labor 30000, fabric_meters_required 5.0, one MONOGRAM option line referencing F1 (snapshot price 6000)."
            - "After the line is created, F1 catalog price is raised to 9000 via PATCH (line snapshot stays 6000)."
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "C One", email: "c1.dv@x.com" }
              as: SalesAssociate
              captures: { c1_id: $.data.id }
            - call: "POST /measurement-profiles"
              payload: { customer_id: "${c1_id}", chest_cm: 100, waist_cm: 84, hip_cm: 100, inseam_cm: 80, source: "MANUAL" }
              as: SalesAssociate
              captures: { mp1_id: $.data.id }
            - call: "POST /fabrics"
              payload: { name: "Wool 6000", price_per_meter_cents: 6000, bolt_meters_initial: 50 }
              as: ShopManager
              captures: { f1_id: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${c1_id}", measurement_profile_id: "${mp1_id}", garment_type: "JACKET", base_labor_cents: 30000, fabric_meters_required: 5.0, promised_date: "2026-08-01T00:00:00.000Z" }
              as: SalesAssociate
              captures: { o1_id: $.data.id }
            - call: "POST /orders/${o1_id}/option-lines"
              payload: { fabric_id: "${f1_id}", option_code: "MONOGRAM" }
              as: SalesAssociate
            - call: "PATCH /fabrics/${f1_id}"
              payload: { price_per_meter_cents: 9000 }
              as: ShopManager
          trigger:
            - call: "POST /orders/${o1_id}/confirm"
              payload: {}
              as: SalesAssociate
              captures: { o1_locked: $.data.locked_total_cents, o1_quoted: $.data.quoted_total_cents }
          assert:
            # quote (provisional) was computed while live==snapshot==6000: 30000 + yc(5,6000)=28800 + 1500 = 60300
            - "GarmentOrder.${o1_id}.quoted_total_cents == 60300"
            # final invoice uses the snapshot 6000 (NOT the live 9000): 30000 + 28800 + 1500 = 60300
            - "GarmentOrder.${o1_id}.locked_total_cents == 60300"
            # a naive live-reprice at 9000 would have been 30000 + yc(5,9000)=43200 + 1500 = 74700; final must NOT equal that
            - "GarmentOrder.${o1_id}.locked_total_cents != 74700"

      - name: dual_variant_customer_remake_risk_band_vs_order_cost
        grounds:
          - calculations.customer_remake_risk
          - calculations.remake_compensation
          - entities.Customer.fields.remake_risk_band
          - state_machines.GarmentOrder.IN_FITTING_to_REMAKE
        distinguishing_aspect: |
          On the Customer entity domain (distinct from order cost accounting): the remake-risk band
          is computed from the customer's lifetime remake_rate, a fundamentally different algorithm
          and subject than the order's tiered cost invoice.
        test_recipe:
          setup:
            - "Customer C2 with one CONFIRMED order driven to a FAILED FINAL fitting (remake round 1)."
            - "Customer C2 has 0 completed orders, so remake_rate = 1/1 = 1.0 -> HIGH_RISK."
            - "Fabric F2 50 meters @ 8000; MASTER tailor T_M; room R_open buffer 0; deposit paid."
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "C Two", email: "c2.dv@x.com" }
              as: SalesAssociate
              captures: { c2_id: $.data.id }
            - call: "POST /measurement-profiles"
              payload: { customer_id: "${c2_id}", chest_cm: 100, waist_cm: 84, hip_cm: 100, inseam_cm: 80, source: "MANUAL" }
              as: SalesAssociate
              captures: { mp2_id: $.data.id }
            - call: "POST /fabrics"
              payload: { name: "Wool 8000", price_per_meter_cents: 8000, bolt_meters_initial: 50 }
              as: ShopManager
              captures: { f2_id: $.data.id }
            - call: "POST /tailors"
              payload: { display_name: "Master M", skill_tier: "MASTER" }
              as: ShopManager
              captures: { tm_id: $.data.id }
            - call: "POST /fitting-rooms"
              payload: { room_name: "R Open", cleanup_buffer_minutes: 0 }
              as: ShopManager
              captures: { ro_id: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${c2_id}", measurement_profile_id: "${mp2_id}", garment_type: "SUIT", base_labor_cents: 40000, fabric_meters_required: 7.0, promised_date: "2026-08-01T00:00:00.000Z" }
              as: SalesAssociate
              captures: { o2_id: $.data.id }
            - call: "POST /orders/${o2_id}/option-lines"
              payload: { fabric_id: "${f2_id}", option_code: "MONOGRAM" }
              as: SalesAssociate
            - call: "POST /orders/${o2_id}/option-lines"
              payload: { fabric_id: "${f2_id}", option_code: "CONTRAST_LINING" }
              as: SalesAssociate
            - call: "POST /orders/${o2_id}/confirm"
              payload: {}
              as: SalesAssociate
              captures: { o2_v_conf: $.data.version }
            - call: "POST /orders/${o2_id}/payments"
              payload: { kind: "DEPOSIT", amount_cents: 48750 }
              as: SalesAssociate
            - call: "POST /orders/${o2_id}/fittings"
              payload: { tailor_id: "${tm_id}", room_id: "${ro_id}", milestone: "BASTED", start_at: "2026-07-01T09:00:00.000Z", end_at: "2026-07-01T10:00:00.000Z", expected_order_version: "${o2_v_conf}" }
              as: FittingSpecialist
              captures: { fit_b_id: $.data.id, o2_v_b: $.data.version }
            - call: "POST /orders/${o2_id}/fittings/${fit_b_id}/record-outcome"
              payload: { result: "PASS" }
              as: FittingSpecialist
            - call: "POST /orders/${o2_id}/fittings"
              payload: { tailor_id: "${tm_id}", room_id: "${ro_id}", milestone: "FORWARD", start_at: "2026-07-02T09:00:00.000Z", end_at: "2026-07-02T10:00:00.000Z", expected_order_version: "${o2_v_b}" }
              as: FittingSpecialist
              captures: { fit_fw_id: $.data.id, o2_v_fw: $.data.version }
            - call: "POST /orders/${o2_id}/fittings/${fit_fw_id}/record-outcome"
              payload: { result: "PASS" }
              as: FittingSpecialist
            - call: "POST /orders/${o2_id}/fittings"
              payload: { tailor_id: "${tm_id}", room_id: "${ro_id}", milestone: "FINAL", start_at: "2026-07-03T09:00:00.000Z", end_at: "2026-07-03T10:00:00.000Z", expected_order_version: "${o2_v_fw}" }
              as: FittingSpecialist
              captures: { fit_fn_id: $.data.id }
          trigger:
            - call: "POST /orders/${o2_id}/fittings/${fit_fn_id}/record-outcome"
              payload: { result: "FAIL" }
              as: FittingSpecialist
              captures: { fit_outcome: $.data.outcome }
          assert:
            # FINAL fail cascades order -> REMAKE; customer remake_count becomes 1, completed 0
            - "GarmentOrder.${o2_id}.status == REMAKE"
            - "Customer.${c2_id}.remake_count == 1"
            - "Customer.${c2_id}.completed_order_count == 0"
            # remake_rate = 1 / max(1, 0+1) = 1.0 >= 0.50 -> HIGH_RISK
            - "Customer.${c2_id}.remake_risk_band == HIGH_RISK"
            # goodwill store credit round 1 = min(5000, locked 97500) = 5000
            - "Customer.${c2_id}.store_credit_cents == 5000"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: combinatorial_yardage_round_per_tier_then_sum
        grounds:
          - calculations.yardage_cost
          - calculations.order_final_invoice
          - entities.GarmentOrder.fields.locked_total_cents
          - state_machines.GarmentOrder.DRAFT_to_CONFIRMED
        distinguishing_aspect: |
          Mode (b) nested rounding where order matters: the scaffold pins round-EACH-TIER-then-sum;
          at meters=7.0, ppm=833 that yields 5414, whereas sum-then-round would yield 5415 — the
          pinned order is observable in the locked invoice.
        test_recipe:
          setup:
            - "Fabric F3 @ 833 cents/meter, bolt 50 meters."
            - "Order O3: base_labor 20000, fabric_meters_required 7.0, one MONOGRAM line on F3, no rush."
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "C Three", email: "c3.cf@x.com" }
              as: SalesAssociate
              captures: { c3_id: $.data.id }
            - call: "POST /measurement-profiles"
              payload: { customer_id: "${c3_id}", chest_cm: 100, waist_cm: 84, hip_cm: 100, inseam_cm: 80, source: "MANUAL" }
              as: SalesAssociate
              captures: { mp3_id: $.data.id }
            - call: "POST /fabrics"
              payload: { name: "Linen 833", price_per_meter_cents: 833, bolt_meters_initial: 50 }
              as: ShopManager
              captures: { f3_id: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${c3_id}", measurement_profile_id: "${mp3_id}", garment_type: "SHIRT", base_labor_cents: 20000, fabric_meters_required: 7.0, promised_date: "2026-08-01T00:00:00.000Z" }
              as: SalesAssociate
              captures: { o3_id: $.data.id }
            - call: "POST /orders/${o3_id}/option-lines"
              payload: { fabric_id: "${f3_id}", option_code: "MONOGRAM" }
              as: SalesAssociate
          trigger:
            - call: "POST /orders/${o3_id}/confirm"
              payload: {}
              as: SalesAssociate
              captures: { o3_locked: $.data.locked_total_cents }
          assert:
            # yc(7,833): c1=round(3*833)=2499, c2=round(3*833*0.9)=2249, c3=round(1*833*0.8)=666 -> 5414
            # locked = 20000 + 5414 + 1500 = 26914
            - "GarmentOrder.${o3_id}.locked_total_cents == 26914"
            # sum-then-round would have given 5415 -> 26915; must NOT equal
            - "GarmentOrder.${o3_id}.locked_total_cents != 26915"

      - name: combinatorial_group_total_sum_then_discount_tier
        grounds:
          - calculations.group_order_total
          - entities.GroupOrder.fields.group_total_cents
          - state_machines.GroupOrder.FORMING_to_LOCKED
        distinguishing_aspect: |
          Mode (a) formula with >=3 inputs and non-linear interaction: member count selects a discount
          tier applied to the summed member subtotals (SUM first, then discount), a different
          combinatorial axis than per-tier yardage rounding.
        test_recipe:
          setup:
            - "GroupOrder G1 (FORMING) with 4 member orders, each confirmed with locked_total 39500."
            - "n=4 -> tier1 discount 0.05; raw_sum 158000 -> group_total 150100."
            - "Each member: base_labor 20000, meters 3.0 @ 6000 fabric (yardage 18000), one MONOGRAM line (1500) -> locked 39500."
          setup_api_calls:
            - call: "POST /fabrics"
              payload: { name: "Group Wool", price_per_meter_cents: 6000, bolt_meters_initial: 200 }
              as: ShopManager
              captures: { fg_id: $.data.id }
            - call: "POST /group-orders"
              payload: { event_name: "Wedding A", event_date: "2026-09-01T00:00:00.000Z" }
              as: SalesAssociate
              captures: { g1_id: $.data.id }
            - call: "POST /customers"
              payload: { full_name: "M1", email: "m1.g@x.com" }
              as: SalesAssociate
              captures: { gm1_c: $.data.id }
            - call: "POST /measurement-profiles"
              payload: { customer_id: "${gm1_c}", chest_cm: 100, waist_cm: 84, hip_cm: 100, inseam_cm: 80, source: "MANUAL" }
              as: SalesAssociate
              captures: { gm1_mp: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${gm1_c}", measurement_profile_id: "${gm1_mp}", garment_type: "SUIT", base_labor_cents: 20000, fabric_meters_required: 3.0, promised_date: "2026-08-15T00:00:00.000Z", group_order_id: "${g1_id}" }
              as: SalesAssociate
              captures: { gm1_o: $.data.id }
            - call: "POST /orders/${gm1_o}/option-lines"
              payload: { fabric_id: "${fg_id}", option_code: "MONOGRAM" }
              as: SalesAssociate
            - call: "POST /orders/${gm1_o}/confirm"
              payload: {}
              as: SalesAssociate
            - call: "POST /customers"
              payload: { full_name: "M2", email: "m2.g@x.com" }
              as: SalesAssociate
              captures: { gm2_c: $.data.id }
            - call: "POST /measurement-profiles"
              payload: { customer_id: "${gm2_c}", chest_cm: 100, waist_cm: 84, hip_cm: 100, inseam_cm: 80, source: "MANUAL" }
              as: SalesAssociate
              captures: { gm2_mp: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${gm2_c}", measurement_profile_id: "${gm2_mp}", garment_type: "SUIT", base_labor_cents: 20000, fabric_meters_required: 3.0, promised_date: "2026-08-15T00:00:00.000Z", group_order_id: "${g1_id}" }
              as: SalesAssociate
              captures: { gm2_o: $.data.id }
            - call: "POST /orders/${gm2_o}/option-lines"
              payload: { fabric_id: "${fg_id}", option_code: "MONOGRAM" }
              as: SalesAssociate
            - call: "POST /orders/${gm2_o}/confirm"
              payload: {}
              as: SalesAssociate
            - call: "POST /customers"
              payload: { full_name: "M3", email: "m3.g@x.com" }
              as: SalesAssociate
              captures: { gm3_c: $.data.id }
            - call: "POST /measurement-profiles"
              payload: { customer_id: "${gm3_c}", chest_cm: 100, waist_cm: 84, hip_cm: 100, inseam_cm: 80, source: "MANUAL" }
              as: SalesAssociate
              captures: { gm3_mp: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${gm3_c}", measurement_profile_id: "${gm3_mp}", garment_type: "SUIT", base_labor_cents: 20000, fabric_meters_required: 3.0, promised_date: "2026-08-15T00:00:00.000Z", group_order_id: "${g1_id}" }
              as: SalesAssociate
              captures: { gm3_o: $.data.id }
            - call: "POST /orders/${gm3_o}/option-lines"
              payload: { fabric_id: "${fg_id}", option_code: "MONOGRAM" }
              as: SalesAssociate
            - call: "POST /orders/${gm3_o}/confirm"
              payload: {}
              as: SalesAssociate
            - call: "POST /customers"
              payload: { full_name: "M4", email: "m4.g@x.com" }
              as: SalesAssociate
              captures: { gm4_c: $.data.id }
            - call: "POST /measurement-profiles"
              payload: { customer_id: "${gm4_c}", chest_cm: 100, waist_cm: 84, hip_cm: 100, inseam_cm: 80, source: "MANUAL" }
              as: SalesAssociate
              captures: { gm4_mp: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${gm4_c}", measurement_profile_id: "${gm4_mp}", garment_type: "SUIT", base_labor_cents: 20000, fabric_meters_required: 3.0, promised_date: "2026-08-15T00:00:00.000Z", group_order_id: "${g1_id}" }
              as: SalesAssociate
              captures: { gm4_o: $.data.id }
            - call: "POST /orders/${gm4_o}/option-lines"
              payload: { fabric_id: "${fg_id}", option_code: "MONOGRAM" }
              as: SalesAssociate
            - call: "POST /orders/${gm4_o}/confirm"
              payload: {}
              as: SalesAssociate
            - call: "GET /group-orders/${g1_id}"
              payload: {}
              as: SalesAssociate
              captures: { g1_v: $.data.version }
          trigger:
            - call: "POST /group-orders/${g1_id}/lock"
              payload: { expected_group_order_version: "${g1_v}" }
              as: ShopManager
              captures: { g1_total: $.data.group_total_cents }
          assert:
            # each member locked: 20000 + yc(3,6000)=18000 + 1500 = 39500 ... recompute below
            # yc(3,6000): only tier1 = 3*6000*1.0 = 18000 -> locked = 20000+18000+1500 = 39500
            # raw_sum = 4 * 39500 = 158000; n=4 -> disc 0.05 -> ceil(158000*0.05)=7900 -> 150100
            - "GroupOrder.${g1_id}.group_total_cents == 150100"
            - "GroupOrder.${g1_id}.member_order_count == 4"
            - "GroupOrder.${g1_id}.status == LOCKED"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: nonlinear_order_remake_cycle_in_fitting_to_remake_to_in_fitting
        grounds:
          - state_machines.GarmentOrder.IN_FITTING_to_REMAKE
          - state_machines.GarmentOrder.REMAKE_to_IN_FITTING
          - entities.GarmentOrder.fields.remake_round
        distinguishing_aspect: |
          The GarmentOrder machine forms a cycle IN_FITTING -> REMAKE -> IN_FITTING (revision loop),
          not a linear pipeline; remake_round advances on each loop.
        test_recipe:
          setup:
            - "Order O4 driven to a FAILED FINAL fitting (now REMAKE, remake_round 1)."
            - "MASTER tailor, open room, deposit paid, fabric ample."
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "C Four", email: "c4.nl@x.com" }
              as: SalesAssociate
              captures: { c4_id: $.data.id }
            - call: "POST /measurement-profiles"
              payload: { customer_id: "${c4_id}", chest_cm: 100, waist_cm: 84, hip_cm: 100, inseam_cm: 80, source: "MANUAL" }
              as: SalesAssociate
              captures: { mp4_id: $.data.id }
            - call: "POST /fabrics"
              payload: { name: "Wool NL", price_per_meter_cents: 8000, bolt_meters_initial: 100 }
              as: ShopManager
              captures: { f4_id: $.data.id }
            - call: "POST /tailors"
              payload: { display_name: "Master NL", skill_tier: "MASTER" }
              as: ShopManager
              captures: { tm4_id: $.data.id }
            - call: "POST /fitting-rooms"
              payload: { room_name: "R NL", cleanup_buffer_minutes: 0 }
              as: ShopManager
              captures: { ro4_id: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${c4_id}", measurement_profile_id: "${mp4_id}", garment_type: "SUIT", base_labor_cents: 40000, fabric_meters_required: 7.0, promised_date: "2026-08-01T00:00:00.000Z" }
              as: SalesAssociate
              captures: { o4_id: $.data.id }
            - call: "POST /orders/${o4_id}/option-lines"
              payload: { fabric_id: "${f4_id}", option_code: "MONOGRAM" }
              as: SalesAssociate
            - call: "POST /orders/${o4_id}/option-lines"
              payload: { fabric_id: "${f4_id}", option_code: "CONTRAST_LINING" }
              as: SalesAssociate
            - call: "POST /orders/${o4_id}/confirm"
              payload: {}
              as: SalesAssociate
              captures: { o4_v_conf: $.data.version }
            - call: "POST /orders/${o4_id}/payments"
              payload: { kind: "DEPOSIT", amount_cents: 48750 }
              as: SalesAssociate
            - call: "POST /orders/${o4_id}/fittings"
              payload: { tailor_id: "${tm4_id}", room_id: "${ro4_id}", milestone: "BASTED", start_at: "2026-07-01T09:00:00.000Z", end_at: "2026-07-01T10:00:00.000Z", expected_order_version: "${o4_v_conf}" }
              as: FittingSpecialist
              captures: { o4_fb: $.data.id, o4_v_b: $.data.version }
            - call: "POST /orders/${o4_id}/fittings/${o4_fb}/record-outcome"
              payload: { result: "PASS" }
              as: FittingSpecialist
            - call: "POST /orders/${o4_id}/fittings"
              payload: { tailor_id: "${tm4_id}", room_id: "${ro4_id}", milestone: "FORWARD", start_at: "2026-07-02T09:00:00.000Z", end_at: "2026-07-02T10:00:00.000Z", expected_order_version: "${o4_v_b}" }
              as: FittingSpecialist
              captures: { o4_ff: $.data.id, o4_v_f: $.data.version }
            - call: "POST /orders/${o4_id}/fittings/${o4_ff}/record-outcome"
              payload: { result: "PASS" }
              as: FittingSpecialist
            - call: "POST /orders/${o4_id}/fittings"
              payload: { tailor_id: "${tm4_id}", room_id: "${ro4_id}", milestone: "FINAL", start_at: "2026-07-03T09:00:00.000Z", end_at: "2026-07-03T10:00:00.000Z", expected_order_version: "${o4_v_f}" }
              as: FittingSpecialist
              captures: { o4_fn: $.data.id }
            - call: "POST /orders/${o4_id}/fittings/${o4_fn}/record-outcome"
              payload: { result: "FAIL" }
              as: FittingSpecialist
            - call: "GET /orders/${o4_id}"
              payload: {}
              as: SalesAssociate
              captures: { o4_v_remake: $.data.version }
          trigger:
            - call: "POST /orders/${o4_id}/fittings"
              payload: { tailor_id: "${tm4_id}", room_id: "${ro4_id}", milestone: "BASTED", start_at: "2026-07-10T09:00:00.000Z", end_at: "2026-07-10T10:00:00.000Z", expected_order_version: "${o4_v_remake}" }
              as: FittingSpecialist
              captures: { o4_fb2: $.data.id }
          assert:
            # scheduling a new BASTED fitting from REMAKE loops the order back to IN_FITTING
            - "GarmentOrder.${o4_id}.status == IN_FITTING"
            - "GarmentOrder.${o4_id}.remake_round == 1"
            - "Fitting.${o4_fb2}.milestone == BASTED"

      - name: nonlinear_group_branch_lock_vs_cancel_divergent_effects
        grounds:
          - state_machines.GroupOrder.FORMING_to_LOCKED
          - state_machines.GroupOrder.FORMING_to_CANCELLED
          - state_machines.GarmentOrder.DRAFT_to_CANCELLED
        distinguishing_aspect: |
          The GroupOrder machine branches from FORMING into two terminal-leaning paths with divergent
          side-effects: LOCK freezes group_total, CANCEL cascade-cancels member orders — a branching
          (fork) shape on a different entity than the GarmentOrder remake cycle.
        test_recipe:
          setup:
            - "GroupOrder G2 (FORMING) with 3 CONFIRMED member orders."
            - "Each member: base_labor 20000, meters 3.0 @ 6000, MONOGRAM line -> locked 39500."
          setup_api_calls:
