      - name: spectrum_license_rejects_an_undeclared_band_enum_member
        claim_type: type_constraints
        grounds:
          - entities.SpectrumLicense.fields.band
          - validations[priority=3]
          - errors[ERR_VALIDATION]
        distinguishing_aspect: |
          band accepts only CBRS_3_5GHZ, EBS_2_5GHZ or LTE_700MHZ; the plausible-looking member
          CBRS_3_7GHZ is refused with 400 ERR_VALIDATION and no SpectrumLicense row is created.
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /spectrum-licenses"
              payload: { license_ref: "CBRS-PAL-9999", band: "CBRS_3_7GHZ", channel_center_mhz: 3700.0, channel_width_mhz: 100.0, max_eirp_dbm: 47.0, license_area_code: "WY-021", effective_from: "2025-01-01T00:00:00Z", effective_to: "2030-01-01T00:00:00Z" }
              as: NetworkEngineer
              captures: { err_band: $.data.error_id }
          assert:
            - "HTTP status is 400 and ${err_band} == \"ERR_VALIDATION\""
            - "A subsequent POST /spectrum-licenses with license_ref \"CBRS-PAL-9999\" and band \"CBRS_3_5GHZ\" succeeds, so the rejected request reserved nothing"

      - name: spectrum_license_rejects_effective_to_not_after_effective_from
        claim_type: type_constraints
        grounds:
          - entities.SpectrumLicense.fields.effective_to
          - validations[priority=3]
          - errors[ERR_VALIDATION]
        distinguishing_aspect: |
          effective_to carries the constraint "must be strictly after effective_from", so an equal
          pair (both 2026-01-01T00:00:00Z) is a shape violation refused at priority 3 with 400
          ERR_VALIDATION - not a 409 interval error, which this scaffold reserves for outage windows.
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /spectrum-licenses"
              payload: { license_ref: "CBRS-PAL-8888", band: "CBRS_3_5GHZ", channel_center_mhz: 3600.0, channel_width_mhz: 100.0, max_eirp_dbm: 47.0, license_area_code: "WY-021", effective_from: "2026-01-01T00:00:00Z", effective_to: "2026-01-01T00:00:00Z" }
              as: NetworkEngineer
              captures: { err_interval: $.data.error_id }
          assert:
            - "HTTP status is 400 and ${err_interval} == \"ERR_VALIDATION\""
            - "The response error_id is NOT \"ERR_INTERVAL_INVALID\" - that error belongs to POST /outage-events/{id}/closure only"

      - name: backhaul_circuit_create_with_unknown_tower_id_returns_tower_not_found
        claim_type: parent_relationships
        grounds:
          - entities.BackhaulCircuit.fields.tower_id
