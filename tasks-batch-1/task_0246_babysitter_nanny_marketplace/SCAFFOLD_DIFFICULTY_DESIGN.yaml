  - rule_id: resource_temporal_overlap
    instances:
      - name: caregiver_double_book_halfopen_with_travel_buffer
        grounds:
          - validations[priority=11]
          - state_machines.BookingSession.SCHEDULED_to_IN_PROGRESS
          - calculations.select_backup_caregiver
        distinguishing_aspect: |
          Caregiver overlap uses half-open [start,end) PLUS a 30-min TRAVEL_BUFFER: a second session starting
          15 min after the first ends still collides because of the buffer; clock-in is rejected.
        test_recipe:
          setup:
