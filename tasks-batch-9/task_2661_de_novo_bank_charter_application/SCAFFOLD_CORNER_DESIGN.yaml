      - name: occ_stale_vendor_contract_version_rejects_window_reserve
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[conversion-window-reserve-stale-vendor-contract]
          - errors[ERR_STALE_VENDOR_CONTRACT_VERSION]
          - validations[priority=8]
          - endpoints[POST /de-novo/conversion-windows]
          - calculations.conversion_capacity_occupation
        distinguishing_aspect: >
          The reservation itself is what invalidates the token: reserving the first window bumps
          VendorContract.version, so a client replaying the pre-reserve token for a second window is
          refused 412 even though capacity remains (1 overlapping window is below the ceiling of 2),
          and the re-read token then succeeds.
        test_recipe:
          setup:
            - "The clock has been moved to 2026-06-01T12:00:00Z."
            - "One OrganizingGroup at stage ORGANIZING with a SIGNED CRITICAL CORE_PROCESSING"
            - "VendorContract; its version before any reservation is captured as ${vc_v1}."
            - "One RESERVED ConversionWindow 2026-06-02T00:00:00Z to 2026-06-03T00:00:00Z, after which"
            - "active_window_count is 1 and the bumped version is captured as ${vc_v2}."
          setup_api_calls:
            - call: "POST /de-novo/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T12:00:00Z" }
              as: PlatformAdmin
            - call: "POST /de-novo/organizing-groups"
              payload: { proposed_bank_name: "Cascade Charter Bank", home_state_code: "WA", charter_type: "NATIONAL", target_opening_date: "2027-03-01T00:00:00Z" }
              as: CharterCounsel
              captures: { g_id: $.data.id }
            - call: "POST /de-novo/vendor-contracts"
              payload: { group_id: "${g_id}", service_domain: "CORE_PROCESSING", vendor_name: "Meridian Core Systems", annual_cost_cents: 90000000, contract_term_months: 60, due_diligence_score: 88, criticality: "CRITICAL" }
              as: CharterCounsel
              captures: { vc_id: $.data.id }
            - call: "POST /de-novo/vendor-contracts/${vc_id}/advance"
              payload: { target_status: "SELECTED" }
              as: CharterCounsel
            - call: "POST /de-novo/vendor-contracts/${vc_id}/advance"
              payload: { target_status: "SIGNED" }
              as: CharterCounsel
            - call: "GET /de-novo/vendor-contracts/${vc_id}"
              payload: {}
              as: CharterCounsel
              captures: { vc_v1: $.data.version }
            - call: "POST /de-novo/conversion-windows"
              payload: { vendor_contract_id: "${vc_id}", expected_vendor_contract_version: "${vc_v1}", window_start_utc: "2026-06-02T00:00:00Z", window_end_utc: "2026-06-03T00:00:00Z" }
              as: CharterCounsel
              captures: { w1_id: $.data.id }
            - call: "GET /de-novo/vendor-contracts/${vc_id}"
              payload: {}
              as: CharterCounsel
              captures: { vc_v2: $.data.version }
          trigger:
            - call: "POST /de-novo/conversion-windows"
              payload: { vendor_contract_id: "${vc_id}", expected_vendor_contract_version: "${vc_v1}", window_start_utc: "2026-06-02T12:00:00Z", window_end_utc: "2026-06-03T12:00:00Z" }
              as: CharterCounsel
              captures: { err_id: $.data.error_id }
            - call: "POST /de-novo/conversion-windows"
              payload: { vendor_contract_id: "${vc_id}", expected_vendor_contract_version: "${vc_v2}", window_start_utc: "2026-06-02T12:00:00Z", window_end_utc: "2026-06-03T12:00:00Z" }
              as: CharterCounsel
              captures: { w2_id: $.data.id }
          assert:
            - "the first call returns 412 with $.data.error_id == ERR_STALE_VENDOR_CONTRACT_VERSION"
            - "the first call does NOT return ERR_CONVERSION_CAPACITY_EXCEEDED - only one window overlaps, and the ceiling is 2"
            - "after the first call VendorContract.${vc_id}.active_window_count == 1"
            - "after the first call VendorContract.${vc_id}.version == ${vc_v2}"
            - "the second call returns 201 and ConversionWindow.${w2_id}.status == RESERVED"
            - "ConversionWindow.${w2_id}.duration_hours == 24.00"
            - "VendorContract.${vc_id}.active_window_count == 2"
            - "ConversionWindow.${w1_id}.status == RESERVED - untouched"
      - name: escrow_lock_trips_only_at_the_exact_minimum_gross
        claim_type: rate_threshold_triggers
        grounds:
          - validations[priority=77]
          - errors[ERR_ESCROW_BELOW_MINIMUM]
          - state_machines.CapitalRaise.OPEN_to_ESCROW_LOCKED
          - calculations.escrow_position
          - entities.CapitalRaise.fields.minimum_gross_cents
        distinguishing_aspect: >
          A threshold that fires on a running aggregate rather than on a field of the request: at
          2,000,000,000 cleared cents the lock is refused, and after one more cleared subscription
          brings the total to exactly minimum_gross_cents 4,100,000,000 the identical bodyless call
          locks the escrow.
        test_recipe:
          setup:
            - "One OrganizingGroup at stage ORGANIZING with one OPEN CapitalRaise:"
            - "minimum_gross_cents 4,100,000,000, target_gross_cents 4,300,000,000, price 1000 cents per"
            - "share, max_shares 5,000,000, organizational_expense_claim_cents 150,000,000."
            - "One Subscription of 2,000,000 shares that is FUNDED and CLEARED, so cleared_escrow_cents is"
            - "2,000,000,000 - well short of the minimum."
          setup_api_calls:
            - call: "POST /de-novo/organizing-groups"
              payload: { proposed_bank_name: "Cascade Charter Bank", home_state_code: "WA", charter_type: "NATIONAL", target_opening_date: "2027-03-01T00:00:00Z" }
              as: CharterCounsel
              captures: { g_id: $.data.id }
            - call: "POST /de-novo/capital-raises"
              payload: { group_id: "${g_id}", target_gross_cents: 4300000000, minimum_gross_cents: 4100000000, offering_price_cents_per_share: 1000, max_shares: 5000000, organizational_expense_claim_cents: 150000000 }
              as: CharterCounsel
              captures: { r_id: $.data.id }
            - call: "POST /de-novo/capital-raises/${r_id}/open"
              payload: {}
              as: CharterCounsel
            - call: "POST /de-novo/subscriptions"
              payload: { capital_raise_id: "${r_id}", subscriber_name: "Harbor Trust LP", shares: 2000000 }
              as: EscrowAgent
              captures: { s1_id: $.data.id }
            - call: "POST /de-novo/subscriptions/${s1_id}/funding"
              payload: { funding_event: "FUND" }
              as: EscrowAgent
            - call: "POST /de-novo/subscriptions/${s1_id}/screening-result"
              payload: { outcome: "CLEARED" }
              as: EscrowAgent
          trigger:
            - call: "POST /de-novo/capital-raises/${r_id}/lock-escrow"
              payload: {}
              as: EscrowAgent
              captures: { err_id: $.data.error_id }
            - call: "POST /de-novo/subscriptions"
              payload: { capital_raise_id: "${r_id}", subscriber_name: "Puget Founders Fund", shares: 2100000 }
              as: EscrowAgent
              captures: { s2_id: $.data.id }
            - call: "POST /de-novo/subscriptions/${s2_id}/funding"
              payload: { funding_event: "FUND" }
              as: EscrowAgent
            - call: "POST /de-novo/subscriptions/${s2_id}/screening-result"
              payload: { outcome: "CLEARED" }
              as: EscrowAgent
            - call: "POST /de-novo/capital-raises/${r_id}/lock-escrow"
              payload: {}
              as: EscrowAgent
          assert:
            - "the first call returns 409 with $.data.error_id == ERR_ESCROW_BELOW_MINIMUM"
            - "after the first call CapitalRaise.${r_id}.status == OPEN and cleared_escrow_cents == 2000000000"
            - "after the screening of the second subscription CapitalRaise.${r_id}.cleared_escrow_cents == 4100000000 - exactly minimum_gross_cents"
            - "the final call returns 200 and CapitalRaise.${r_id}.status == ESCROW_LOCKED"
            - "CapitalRaise.${r_id}.projected_reimbursement_cents == 150000000 - the claim is below the 205,000,000 cap"
            - "CapitalRaise.${r_id}.projected_net_release_cents == 3950000000"
            - "CapitalRaise.${r_id}.released_net_cents == 0 - locking is not releasing"
            - "OrganizingGroup.${g_id}.opening_blocked_reason == NONE"
      - name: filing_counts_reconcile_across_waiver_then_satisfaction
        claim_type: derived_field_reconciliation
        grounds:
          - calculations.filing_condition_posture
          - entities.RegulatoryFiling.fields.open_blocking_condition_count
          - entities.RegulatoryFiling.fields.settled_condition_count
          - entities.RegulatoryFiling.fields.pre_opening_clearance
          - state_machines.ApprovalCondition.OPEN_to_WAIVED
          - state_machines.ApprovalCondition.EVIDENCE_SUBMITTED_to_SATISFIED
