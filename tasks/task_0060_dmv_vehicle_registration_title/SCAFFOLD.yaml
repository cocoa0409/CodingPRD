# =============================================================================
# Task 0060 — DMV Vehicle Registration & Title Transfer (Expert)
# =============================================================================
scenario: |
  DMV Vehicle Registration & Title Transfer: VIN verification, transfer/initial
  registration, Lien Holder, emissions inspection, REAL ID upgrade, taxes/Reg Fee,
  electronic license plate, Salvage Title

domain_name: dmv-registration-title
api_prefix: /

complexity_profile:
  primary_archetype: Workflow orchestration
  secondary_archetype: Compliance / audit
  complexity_layers:
    - Dual-variant calculation
    - Cascading side effects
    - Rate / threshold triggers
    - Optimistic concurrency
    - Derived field reconciliation

  entity_topology: flat
  # Peer entities linked by foreign keys (Vehicle, Owner, TitleApplication,
  # Registration, Lien, ...). No deep URL nesting; FK references in bodies and
  # filtered-list GETs for reverse reachability.

  state_machine_shape: branching
  # TitleApplication forks (clear-title path vs salvage-rebuild path) and rejoins;
  # RealIdApplication has an approve/reject revert cycle; Registration auto-suspends.

  relationship_patterns:
    - one_to_many        # Owner -> Vehicle, Vehicle -> Lien, Vehicle -> Registration
    - cross_aggregate    # Registration references Owner, Vehicle, FeeAssessment

  role_model: peer_roles
  # ClerkAgent (counter operations), InspectionStation (emissions/salvage inspections),
  # Owner (entity-backed self-service), DmvAdmin (operator overrides).

  consistency_model: immediate

# =============================================================================
# Table 1: Entity-Relationship Table  (§1.1)
# =============================================================================
entities:
  - name: Owner
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Legal name of the owner" }
      - { name: residence_county_code, type: string, source: input, description: "County code that sets the county tax rate (e.g. 'KING', 'PIERCE')" }
      - { name: credential_type, type: enum, source: input, description: "STANDARD | REAL_ID — current driver-credential class", default: STANDARD, constraints: "one of STANDARD, REAL_ID" }
      - { name: identity_documents_verified, type: boolean, source: input, description: "Whether breeder identity documents were presented and verified at the counter", default: false }
      - { name: real_id_status, type: enum, source: computed, description: "NONE | PENDING | UPGRADED — mirrors the owner's REAL ID upgrade lifecycle", default: NONE, constraints: "one of NONE, PENDING, UPGRADED" }

  - name: Vehicle
    parent: null
    common_fields: true
    fields:
      - { name: owner_id, type: string, source: input, description: "FK -> Owner.id; current registered owner of record" }
      - { name: vin, type: string, source: input, description: "17-character Vehicle Identification Number, unique across all vehicles" }
      - { name: model_year, type: integer, source: input, description: "Model year, used by emissions-exemption and depreciation rules" }
      - { name: purchase_price_cents, type: integer, source: input, description: "Declared purchase price in cents, basis for use tax" }
      - { name: msrp_cents, type: integer, source: input, description: "Manufacturer suggested retail price in cents, basis for the depreciation-schedule registration fee" }
      - { name: vehicle_class, type: enum, source: input, description: "PASSENGER | TRUCK | MOTORCYCLE — drives emissions applicability and weight fee", constraints: "one of PASSENGER, TRUCK, MOTORCYCLE" }
      - { name: vin_status, type: enum, source: computed, description: "UNVERIFIED | VERIFIED | FLAGGED — set by VIN verification outcome", default: UNVERIFIED, constraints: "one of UNVERIFIED, VERIFIED, FLAGGED" }
      - { name: title_status, type: enum, source: computed, description: "NONE | CLEAR | REBUILT — current title brand, set by title issuance (a salvage-branded vehicle stays NONE until issued as REBUILT)", default: NONE, constraints: "one of NONE, CLEAR, REBUILT" }
      - { name: is_salvage_branded, type: boolean, source: input, description: "True when the vehicle arrives with a salvage brand requiring rebuild inspection", default: false }
      - { name: active_lien_count, type: integer, source: computed, description: "Number of Lien rows on this vehicle in PERFECTED state", default: 0 }

  - name: VinVerification
    parent: null
    common_fields: false
    fields:
      - { name: vehicle_id, type: string, source: input, description: "FK -> Vehicle.id; the vehicle whose VIN is being verified" }
      - { name: submitted_vin, type: string, source: input, description: "VIN transcribed from the physical plate at the counter" }
      - { name: outcome, type: enum, source: input, description: "MATCH | MISMATCH | NHTSA_FLAG — verification result the clerk records", constraints: "one of MATCH, MISMATCH, NHTSA_FLAG" }

  - name: TitleApplication
    parent: null
    common_fields: true
    fields:
      - { name: vehicle_id, type: string, source: input, description: "FK -> Vehicle.id; subject vehicle of the title" }
      - { name: applicant_owner_id, type: string, source: input, description: "FK -> Owner.id; owner who will hold the new title" }
      - { name: application_type, type: enum, source: input, description: "INITIAL | TRANSFER — first title vs ownership transfer", constraints: "one of INITIAL, TRANSFER" }
      - { name: status, type: enum, source: computed, description: "DRAFT | SUBMITTED | SALVAGE_HOLD | APPROVED | ISSUED | REJECTED", default: DRAFT }
      - { name: requires_salvage_path, type: boolean, source: computed, description: "True when the subject vehicle is salvage-branded and must pass rebuild inspection", default: false }
      - { name: issued_title_brand, type: enum, source: computed, description: "Title brand stamped at ISSUED: CLEAR | REBUILT — null until issuance", default: null, constraints: "one of CLEAR, REBUILT when set" }

  - name: SalvageInspection
    parent: null
    common_fields: true
    fields:
      - { name: title_application_id, type: string, source: input, description: "FK -> TitleApplication.id; the salvage-hold application being rebuilt" }
      - { name: station_id, type: string, source: system, description: "Opaque InspectionStation operator id that recorded the inspection" }
      - { name: result, type: enum, source: input, description: "PASS | FAIL — rebuild roadworthiness outcome", constraints: "one of PASS, FAIL" }
      - { name: status, type: enum, source: computed, description: "RECORDED — terminal once filed", default: RECORDED }

  - name: Lien
    parent: null
    common_fields: true
    fields:
      - { name: vehicle_id, type: string, source: input, description: "FK -> Vehicle.id; vehicle encumbered by the lien" }
      - { name: lien_holder_name, type: string, source: input, description: "Name of the lien holder (lender)" }
      - { name: principal_cents, type: integer, source: input, description: "Outstanding secured principal in cents" }
      - { name: status, type: enum, source: computed, description: "FILED | PERFECTED | RELEASED — lien lifecycle", default: FILED }

  - name: EmissionsInspection
    parent: null
    common_fields: true
    fields:
      - { name: vehicle_id, type: string, source: input, description: "FK -> Vehicle.id; vehicle inspected" }
      - { name: station_id, type: string, source: system, description: "Opaque InspectionStation operator id" }
      - { name: result, type: enum, source: input, description: "PASS | FAIL — tailpipe outcome", constraints: "one of PASS, FAIL" }
      - { name: inspected_at, type: datetime, source: system, description: "Server clock timestamp when the inspection was recorded; start of the validity window" }
      - { name: valid_until, type: datetime, source: computed, description: "= inspected_at + EMISSIONS_VALID_DAYS; the window is the half-open interval [inspected_at, valid_until)" }
      - { name: status, type: enum, source: computed, description: "RECORDED — terminal once filed", default: RECORDED }

  - name: FeeAssessment
    parent: null
    common_fields: true
    fields:
      - { name: registration_id, type: string, source: input, description: "FK -> Registration.id; the registration this assessment prices" }
      - { name: use_tax_cents, type: integer, source: computed, description: "Computed use/sales tax in cents (see use_tax calculation)", default: 0 }
      - { name: registration_fee_cents, type: integer, source: computed, description: "Computed depreciation-schedule registration fee in cents", default: 0 }
      - { name: real_id_surcharge_cents, type: integer, source: computed, description: "REAL ID upgrade surcharge added when bundled, else 0", default: 0 }
      - { name: total_cents, type: integer, source: computed, description: "= use_tax_cents + registration_fee_cents + real_id_surcharge_cents", default: 0 }
      - { name: status, type: enum, source: computed, description: "ASSESSED | PAID | VOIDED — payment lifecycle", default: ASSESSED }

  - name: Registration
    parent: null
    common_fields: true
    fields:
      - { name: vehicle_id, type: string, source: input, description: "FK -> Vehicle.id; vehicle being registered" }
      - { name: owner_id, type: string, source: input, description: "FK -> Owner.id; owner of record on the registration" }
      - { name: registration_type, type: enum, source: input, description: "INITIAL | TRANSFER — first registration vs ownership-transfer registration", constraints: "one of INITIAL, TRANSFER" }
      - { name: bundle_real_id, type: boolean, source: input, description: "Whether the counter bundled a REAL ID upgrade surcharge into this registration", default: false }
      - { name: status, type: enum, source: computed, description: "PENDING_FEES | ACTIVE | SUSPENDED | EXPIRED", default: PENDING_FEES }
      - { name: term_start, type: datetime, source: computed, description: "Server clock at activation; start of the registration term", default: null }
      - { name: term_end, type: datetime, source: computed, description: "= term_start + REGISTRATION_TERM_DAYS; term is the half-open interval [term_start, term_end)", default: null }
      - { name: plate_assigned, type: boolean, source: computed, description: "Whether a LicensePlate has been assigned to this registration", default: false }

  - name: LicensePlate
    parent: null
    common_fields: true
    fields:
      - { name: registration_id, type: string, source: input, description: "FK -> Registration.id; registration this plate serves" }
      - { name: plate_number, type: string, source: input, description: "Plate string, unique across all NON-SURRENDERED plates" }
      - { name: plate_type, type: enum, source: input, description: "PHYSICAL | ELECTRONIC — electronic plates are remotely activatable/deactivatable", constraints: "one of PHYSICAL, ELECTRONIC" }
      - { name: issued_at, type: datetime, source: system, description: "Server clock when the plate was assigned; start of this plate_number's tenancy interval" }
      - { name: surrendered_at, type: datetime, source: computed, description: "Server clock when the plate was surrendered; end of the tenancy interval, null while held", default: null }
      - { name: status, type: enum, source: computed, description: "ISSUED | ACTIVE | DEACTIVATED | SURRENDERED — DEACTIVATED only valid for ELECTRONIC", default: ISSUED }

  - name: RealIdApplication
    parent: null
    common_fields: true
    fields:
      - { name: owner_id, type: string, source: input, description: "FK -> Owner.id; owner requesting REAL ID upgrade" }
      - { name: status, type: enum, source: computed, description: "SUBMITTED | UNDER_REVIEW | APPROVED | DENIED", default: SUBMITTED }
      - { name: documents_complete, type: boolean, source: input, description: "Whether the full REAL ID document set was presented", default: false }

# =============================================================================
# Table 2: State Machine Table  (§1.2)
# =============================================================================
state_machines:
  - entity: TitleApplication
    initial_state: DRAFT
    terminal_states: [ISSUED, REJECTED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /title-applications/{id}/submit"
        actor: ClerkAgent
        preconditions:
          - "Subject Vehicle.vin_status == VERIFIED (ERR_VIN_NOT_VERIFIED)"
          - "If application_type == TRANSFER, the subject Vehicle.title_status must be one of {CLEAR, REBUILT} (ERR_TRANSFER_REQUIRES_TITLE)"
        side_effects:
          - "requires_salvage_path = Vehicle.is_salvage_branded"
          - "If Vehicle.is_salvage_branded == true: status becomes SALVAGE_HOLD instead of SUBMITTED (branch fork)"
        note: "Branch fork — salvage-branded vehicles divert to SALVAGE_HOLD; others reach SUBMITTED."

      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /title-applications/{id}/approve"
        actor: ClerkAgent
        preconditions:
          - "status == SUBMITTED (ERR_INVALID_STATE)"
        side_effects: []

      - from: SALVAGE_HOLD
        to: APPROVED
        trigger: "POST /title-applications/{id}/approve"
        actor: ClerkAgent
        preconditions:
          - "A SalvageInspection exists for this application with result == PASS (ERR_SALVAGE_INSPECTION_REQUIRED)"
        side_effects: []
        note: "Branch rejoin — salvage path rejoins the main flow at APPROVED only after a passing rebuild inspection."

      - from: SALVAGE_HOLD
        to: REJECTED
        trigger: "POST /title-applications/{id}/reject"
        actor: ClerkAgent
        preconditions:
          - "A SalvageInspection exists for this application with result == FAIL (ERR_SALVAGE_INSPECTION_REQUIRED)"
        side_effects: []

      - from: APPROVED
        to: ISSUED
        trigger: "POST /title-applications/{id}/issue"
        actor: ClerkAgent
        preconditions:
          - "status == APPROVED (ERR_INVALID_STATE)"
        side_effects:
          - "HOP 1: issued_title_brand = REBUILT if requires_salvage_path else CLEAR"
          - "HOP 2 (caused by HOP 1 issuance): Vehicle.title_status = REBUILT if requires_salvage_path else CLEAR; Vehicle.owner_id = applicant_owner_id; increments Vehicle.version by 1"
          - "HOP 3 (caused by HOP 2 owner reassignment, only when application_type == TRANSFER): every Lien on the vehicle in status PERFECTED transitions to RELEASED (prior owner's perfected lien does not carry to the new owner); each such release decrements Vehicle.active_lien_count by 1 (HOP 4 ledger sync)"
        note: "Transitive cascade — issue mutates the TitleApplication, which mutates the Vehicle, whose owner change in turn releases the prior owner's perfected liens, whose release decrements the lien counter."

      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /title-applications/{id}/reject"
        actor: ClerkAgent
        preconditions:
          - "status == SUBMITTED (ERR_INVALID_STATE)"
        side_effects: []

  - entity: Lien
    initial_state: FILED
    terminal_states: [RELEASED]
    transitions:
      - from: FILED
        to: PERFECTED
        trigger: "POST /liens/{id}/perfect"
        actor: ClerkAgent
        preconditions:
          - "Subject Vehicle.title_status != NONE (ERR_LIEN_REQUIRES_TITLE)"
        side_effects:
          - "increments Vehicle.active_lien_count by 1"
          - "increments Vehicle.version by 1"

      - from: PERFECTED
        to: RELEASED
        trigger: "POST /liens/{id}/release"
        actor: ClerkAgent
        preconditions: []
        side_effects:
          - "decrements Vehicle.active_lien_count by 1"
          - "increments Vehicle.version by 1"

      - from: FILED
        to: RELEASED
        trigger: "POST /liens/{id}/release"
        actor: ClerkAgent
        preconditions: []
        side_effects: []
        note: "Releasing a never-perfected lien does not touch active_lien_count."

  - entity: Registration
    initial_state: PENDING_FEES
    terminal_states: [EXPIRED]
    transitions:
      - from: PENDING_FEES
        to: ACTIVE
        trigger: "POST /registrations/{id}/activate"
        actor: ClerkAgent
        preconditions:
          - "The FeeAssessment for this registration has status == PAID (ERR_FEES_UNPAID)"
          - "Subject Vehicle has a TitleApplication in status ISSUED whose applicant_owner_id == Registration.owner_id (ERR_TITLE_NOT_ISSUED)"
          - "If Vehicle.vehicle_class != MOTORCYCLE and Vehicle.model_year >= 2010: a PASS EmissionsInspection exists for the vehicle whose half-open validity window [inspected_at, valid_until) contains the current clock (ERR_EMISSIONS_REQUIRED); an inspection whose valid_until exactly equals the current clock is expired (boundary excluded)"
          - "The new term [current_clock, current_clock + REGISTRATION_TERM_DAYS) must NOT overlap any existing ACTIVE Registration's [term_start, term_end) on the same vehicle; adjacency (new term_start == existing term_end) is allowed (ERR_REGISTRATION_TERM_OVERLAP)"
        side_effects:
          - "term_start = current clock; term_end = term_start + REGISTRATION_TERM_DAYS"
          - "plate_assigned reconciled from existence of a LicensePlate for this registration"

      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /registrations/{id}/suspend"
        actor: DmvAdmin
        preconditions:
          - "status == ACTIVE (ERR_INVALID_STATE)"
        side_effects:
          - "Every ELECTRONIC LicensePlate for this registration in status ACTIVE transitions to DEACTIVATED"
          - "increments Registration.version by 1"

      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /registrations/{id}/reinstate"
        actor: DmvAdmin
        preconditions:
          - "expected_registration_version supplied and matches current Registration.version (ERR_STALE_VERSION)"
        side_effects:
          - "Every ELECTRONIC LicensePlate for this registration in status DEACTIVATED transitions back to ACTIVE"
          - "increments Registration.version by 1"

      - from: ACTIVE
        to: EXPIRED
        trigger: "POST /registrations/{id}/expire"
        actor: DmvAdmin
        preconditions:
          - "status == ACTIVE (ERR_INVALID_STATE)"
        side_effects:
          - "Every LicensePlate for this registration in status {ISSUED, ACTIVE, DEACTIVATED} transitions to SURRENDERED, stamping surrendered_at = current clock (closes the plate_number tenancy interval)"
          - "increments Registration.version by 1"

  - entity: LicensePlate
    initial_state: ISSUED
    terminal_states: [SURRENDERED]
    transitions:
      - from: ISSUED
        to: ACTIVE
        trigger: "POST /license-plates/{id}/activate"
        actor: ClerkAgent
        preconditions:
          - "Parent Registration.status == ACTIVE (ERR_REGISTRATION_NOT_ACTIVE)"
        side_effects: []

      - from: ACTIVE
        to: DEACTIVATED
        trigger: "POST /license-plates/{id}/deactivate"
        actor: ClerkAgent
        preconditions:
          - "plate_type == ELECTRONIC (ERR_PLATE_NOT_ELECTRONIC)"
        side_effects: []
        note: "Only electronic plates can be remotely deactivated."

      - from: DEACTIVATED
        to: ACTIVE
        trigger: "POST /license-plates/{id}/activate"
        actor: ClerkAgent
        preconditions:
          - "Parent Registration.status == ACTIVE (ERR_REGISTRATION_NOT_ACTIVE)"
        side_effects: []

  - entity: RealIdApplication
    initial_state: SUBMITTED
    terminal_states: [DENIED]
    transitions:
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /real-id-applications/{id}/begin-review"
        actor: ClerkAgent
        preconditions:
          - "status == SUBMITTED (ERR_INVALID_STATE)"
        side_effects:
          - "Owner.real_id_status = PENDING"
          - "increments Owner.version by 1"

      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /real-id-applications/{id}/approve"
        actor: ClerkAgent
        preconditions:
          - "documents_complete == true AND Owner.identity_documents_verified == true (ERR_DOCUMENTS_INCOMPLETE)"
        side_effects:
          - "Owner.credential_type = REAL_ID"
          - "Owner.real_id_status = UPGRADED"
          - "increments Owner.version by 1"

      - from: UNDER_REVIEW
        to: DENIED
        trigger: "POST /real-id-applications/{id}/deny"
        actor: ClerkAgent
        preconditions:
          - "status == UNDER_REVIEW (ERR_INVALID_STATE)"
        side_effects:
          - "Owner.real_id_status = NONE"
          - "increments Owner.version by 1"

      - from: UNDER_REVIEW
        to: SUBMITTED
        trigger: "POST /real-id-applications/{id}/return-for-documents"
        actor: ClerkAgent
        preconditions:
          - "status == UNDER_REVIEW (ERR_INVALID_STATE)"
        side_effects:
          - "Owner.real_id_status = NONE"
          - "increments Owner.version by 1"
        note: "Revert cycle — review can bounce back to SUBMITTED for more documents."

  - entity: FeeAssessment
    initial_state: ASSESSED
    terminal_states: [VOIDED]
    transitions:
      - from: ASSESSED
        to: PAID
        trigger: "POST /fee-assessments/{id}/pay"
        actor: ClerkAgent
        preconditions:
          - "status == ASSESSED (ERR_INVALID_STATE)"
        side_effects:
          - "If real_id_surcharge_cents > 0, the Owner's REAL ID upgrade is funded (no automatic credential change; clerk still drives the RealIdApplication)"

      - from: ASSESSED
        to: VOIDED
        trigger: "POST /fee-assessments/{id}/void"
        actor: DmvAdmin
        preconditions:
          - "status == ASSESSED (ERR_INVALID_STATE)"
          - "Parent Registration.status == PENDING_FEES (ERR_REGISTRATION_NOT_ACTIVE)"
        side_effects: []

# -----------------------------------------------------------------------------
# §1.2.1 Concurrency Rules
# -----------------------------------------------------------------------------
concurrency_rules:
  - rule_id: plate-assign-stale-registration
    parent_entity: Registration
    write_endpoint: "POST /license-plates"
    occ_field: "expected_registration_version"
    description: |
      Assigning a LicensePlate to a Registration whose version has advanced
      since the client last observed it is rejected. This captures the case
      where another writer has already assigned the registration's single
      plate (a perfected assignment that legitimately supersedes any second
      attempt under the one-plate-per-registration rule), so the current
      writer's view of the registration is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: reinstate-stale-registration
    parent_entity: Registration
    write_endpoint: "POST /registrations/{id}/reinstate"
    occ_field: "expected_registration_version"
    description: |
      Reinstating a SUSPENDED Registration carrying an expected_registration_version
      older than the current version is rejected. A prior reinstate already
      advanced the version and reactivated the electronic plates, so the stale
      caller's reinstatement is refused.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table  (§1.3)
# =============================================================================
calculations:
  - name: use_tax
    trigger: "POST /fee-assessments (assessment creation for a Registration)"
    algorithm: threshold
    formula: |
      # Use tax on a vehicle purchase. State base rate plus county add-on rate,
      # applied to the taxable basis. TRANSFER registrations get a private-party
      # cap; INITIAL registrations are taxed on full declared price.
      basis_cents = Vehicle.purchase_price_cents
      combined_rate = STATE_USE_TAX_RATE + county_rate(Owner.residence_county_code)
      raw_cents = basis_cents * combined_rate
      # Round the single product to the nearest cent, half-up.
      use_tax_cents = round_half_up(raw_cents)            # cents are integers; round the rate product
      # Private-party transfer cap: a TRANSFER registration's use tax is capped.
      if Registration.registration_type == TRANSFER:
        use_tax_cents = min(use_tax_cents, TRANSFER_USE_TAX_CAP_CENTS)
    input_set: "Single Vehicle linked via Registration.vehicle_id; rate driven by Owner.residence_county_code."
    constants:
      STATE_USE_TAX_RATE: 0.065
      COUNTY_RATE_KING: 0.025
      COUNTY_RATE_PIERCE: 0.014
      COUNTY_RATE_DEFAULT: 0.010
      TRANSFER_USE_TAX_CAP_CENTS: 150000
    precision: "Round the rate-times-basis product to the nearest integer cent, half-up; cap applied AFTER rounding."
    variants:
      - name: initial_use_tax
        when: "Registration.registration_type == INITIAL"
        difference: "No cap; full purchase_price_cents * combined_rate."
      - name: transfer_use_tax
        when: "Registration.registration_type == TRANSFER"
        difference: "Same product, then capped at TRANSFER_USE_TAX_CAP_CENTS — identical inputs diverge from INITIAL above the cap."

  - name: registration_fee
    trigger: "POST /fee-assessments (assessment creation for a Registration)"
    algorithm: tiered_pricing
    formula: |
      # Depreciation-schedule registration fee. The fee is a percentage of MSRP
      # that steps DOWN by vehicle age band, PLUS a flat weight fee by class.
      # Evaluation order is pinned: compute age, select the depreciation tier by
      # age band, multiply MSRP by the tier rate, round, THEN add the weight fee.
      age_years = CURRENT_REG_YEAR - Vehicle.model_year
      if age_years <= 0:          dep_rate = DEP_RATE_NEW        # 0 or negative age -> newest band
      elif age_years <= 3:        dep_rate = DEP_RATE_BAND_1
      elif age_years <= 7:        dep_rate = DEP_RATE_BAND_2
      else:                       dep_rate = DEP_RATE_BAND_3
      dep_component_cents = round_half_up(Vehicle.msrp_cents * dep_rate)
      weight_fee_cents = WEIGHT_FEE[Vehicle.vehicle_class]
      registration_fee_cents = dep_component_cents + weight_fee_cents
    input_set: "Single Vehicle via Registration.vehicle_id."
    constants:
      CURRENT_REG_YEAR: 2026
      DEP_RATE_NEW: 0.0110
      DEP_RATE_BAND_1: 0.0090
      DEP_RATE_BAND_2: 0.0060
      DEP_RATE_BAND_3: 0.0030
      WEIGHT_FEE_PASSENGER: 4300
      WEIGHT_FEE_TRUCK: 9000
      WEIGHT_FEE_MOTORCYCLE: 2500
    precision: "Round the MSRP*dep_rate product to nearest integer cent half-up FIRST, then add the integer weight fee — order pinned (round-then-add)."

  - name: assessment_total
    trigger: "POST /fee-assessments (assessment creation)"
    algorithm: aggregation
    formula: |
      # Evaluation order is pinned because real_id_surcharge depends on whether
      # the registration bundled an upgrade, and total depends on all three.
      real_id_surcharge_cents = REAL_ID_SURCHARGE_CENTS if Registration.bundle_real_id else 0
      total_cents = use_tax_cents + registration_fee_cents + real_id_surcharge_cents
    input_set: "The use_tax and registration_fee outputs for this same FeeAssessment, plus Registration.bundle_real_id."
    constants:
      REAL_ID_SURCHARGE_CENTS: 3000
    precision: "Integer cents; pure sum, no rounding."

  - name: vehicle_active_lien_count
    trigger: "Lien PERFECTED and Lien RELEASED transitions"
    algorithm: aggregation
    formula: |
      # Conserved-quantity invariant: perfecting increments, releasing a
      # perfected lien decrements. Count must always equal the number of Lien
      # rows on the vehicle whose status == PERFECTED.
      Vehicle.active_lien_count = count(Lien WHERE Lien.vehicle_id == Vehicle.id AND Lien.status == PERFECTED)
    input_set: "All Lien rows for the vehicle with status == PERFECTED."
    precision: "Integer count; tie-break not applicable."

  - name: emissions_validity_window
    trigger: "POST /emissions-inspections; consulted again at POST /registrations/{id}/activate"
    algorithm: interval_merge
    formula: |
      # The inspection's validity is the half-open interval [inspected_at, valid_until).
      valid_until = inspected_at + EMISSIONS_VALID_DAYS days
      # At activation: the cited PASS inspection is usable iff
      #   inspected_at <= current_clock < valid_until
      # current_clock == valid_until is OUTSIDE the window (boundary excluded, '<' not '<=').
    input_set: "The latest PASS EmissionsInspection for the vehicle by inspected_at DESC, created_at DESC tie-break."
    constants:
      EMISSIONS_VALID_DAYS: 365
    precision: "Datetime arithmetic in whole days; window is half-open [start, end)."

  - name: registration_term_window
    trigger: "POST /registrations/{id}/activate"
    algorithm: interval_merge
    formula: |
      # On activation, the term is the half-open interval [term_start, term_end).
      term_start = current_clock
      term_end = term_start + REGISTRATION_TERM_DAYS days
      # Overlap rejection vs an existing ACTIVE registration's [e_start, e_end) on the
      # same vehicle: REJECT iff term_start < e_end AND e_start < term_end.
      # Adjacency (term_start == e_end OR term_end == e_start) does NOT overlap.
    input_set: "All ACTIVE Registration rows on the same vehicle_id."
    constants:
      REGISTRATION_TERM_DAYS: 365
    precision: "Datetime arithmetic in whole days; intervals half-open; adjacency allowed."

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority)  (§1.4)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "Acting role is permitted for this operation per §1.7 RBAC"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "All path/body referenced resources exist (validated left-to-right)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all

  - priority: 4
    category: state
    check: "Target resource is in a valid state for the requested transition"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 5
    category: business_referential
    check: "VIN must be VERIFIED before a TitleApplication referencing the vehicle may be submitted"
    error_id: ERR_VIN_NOT_VERIFIED
    http_status: 409
    applies_to: "POST /title-applications/{id}/submit"

  - priority: 6
    category: business_safety
    check: "A salvage-branded vehicle's title cannot be approved without a PASS SalvageInspection on the application"
    error_id: ERR_SALVAGE_INSPECTION_REQUIRED
    http_status: 409
    applies_to: "POST /title-applications/{id}/approve, POST /title-applications/{id}/reject"

  - priority: 7
    category: business_safety
    check: "A registration for a >=2010 non-motorcycle vehicle requires a PASS EmissionsInspection before activation"
    error_id: ERR_EMISSIONS_REQUIRED
    http_status: 409
    applies_to: "POST /registrations/{id}/activate"

  - priority: 8
    category: business_referential
    check: "A registration cannot activate until its vehicle has a matching ISSUED TitleApplication for the owner"
    error_id: ERR_TITLE_NOT_ISSUED
    http_status: 409
    applies_to: "POST /registrations/{id}/activate"

  - priority: 9
    category: business_constraint
    check: "A lien may only be perfected once the vehicle has a title (title_status != NONE)"
    error_id: ERR_LIEN_REQUIRES_TITLE
    http_status: 409
    applies_to: "POST /liens/{id}/perfect"

  - priority: 10
    category: business_temporal
    check: "A plate_number's tenancy interval [issued_at, surrendered_at) on a new assignment must not overlap any existing plate row sharing that plate_number whose interval is still open (surrendered_at == null) or whose interval has not yet closed before the new issued_at; reissuing a plate_number whose prior tenancy was surrendered at or before the new issued_at is allowed (adjacency permitted at the surrender instant)"
    error_id: ERR_PLATE_NUMBER_TAKEN
    http_status: 409
    applies_to: "POST /license-plates"

  - priority: 11
    category: business_constraint
    check: "A Registration may have at most one LicensePlate in status {ISSUED, ACTIVE, DEACTIVATED} at a time"
    error_id: ERR_PLATE_ALREADY_ASSIGNED
    http_status: 409
    applies_to: "POST /license-plates"

  - priority: 12
    category: business_constraint
    check: "Only ELECTRONIC plates may be deactivated"
    error_id: ERR_PLATE_NOT_ELECTRONIC
    http_status: 409
    applies_to: "POST /license-plates/{id}/deactivate"

  - priority: 13
    category: business_fiscal
    check: "A registration's FeeAssessment must be PAID before activation"
    error_id: ERR_FEES_UNPAID
    http_status: 402
    applies_to: "POST /registrations/{id}/activate"

  - priority: 14
    category: business_constraint
    check: "vin must be 17 characters and unique across all Vehicle rows"
    error_id: ERR_INVALID_VIN
    http_status: 422
    applies_to: "POST /vehicles"

  - priority: 15
    category: business_constraint
    check: "OCC: expected_registration_version must equal current Registration.version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /license-plates, POST /registrations/{id}/reinstate"

  - priority: 16
    category: business_temporal
    check: "A registration's activation term [current_clock, current_clock + REGISTRATION_TERM_DAYS) must not overlap the [term_start, term_end) of any existing ACTIVE registration on the same vehicle; adjacency at the boundary is allowed"
    error_id: ERR_REGISTRATION_TERM_OVERLAP
    http_status: 409
    applies_to: "POST /registrations/{id}/activate"

  - priority: 17
    category: business_temporal
    check: "The emissions inspection cited for activation must have current_clock within [inspected_at, valid_until); an inspection whose valid_until == current_clock is expired"
    error_id: ERR_EMISSIONS_REQUIRED
    http_status: 409
    applies_to: "POST /registrations/{id}/activate"

# =============================================================================
# Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 5: API Endpoint Table  (§1.5)
# =============================================================================
endpoints:
  # --- Owner ---
  - method: POST
    path: "/owners"
    description: "Create an Owner"
    roles: [ClerkAgent, DmvAdmin, Owner]
    code: 201
    input: ["full_name", "residence_county_code", "credential_type?", "identity_documents_verified?"]
    output: Owner
    side_effects: ["real_id_status = NONE"]

  - method: GET
    path: "/owners/{id}"
    description: "Get an Owner"
    roles: [ClerkAgent, DmvAdmin, Owner]
    code: 200
    input: []
    output: Owner
    side_effects: []

  # --- Vehicle ---
  - method: POST
    path: "/vehicles"
    description: "Create a Vehicle"
    roles: [ClerkAgent, DmvAdmin, Owner]
    code: 201
    input: ["owner_id", "vin", "model_year", "purchase_price_cents", "msrp_cents", "vehicle_class", "is_salvage_branded?"]
    output: Vehicle
    side_effects: ["vin_status = UNVERIFIED", "title_status = NONE", "active_lien_count = 0"]

  - method: GET
    path: "/vehicles/{id}"
    description: "Get a Vehicle"
    roles: [ClerkAgent, DmvAdmin, Owner]
    code: 200
    input: []
    output: Vehicle
    side_effects: []

  - method: GET
    path: "/vehicles"
    description: "List/filter vehicles (reverse lookup by owner)"
    roles: [ClerkAgent, DmvAdmin, Owner]
    code: 200
    input: ["owner_id?", "vin?", "limit?", "offset?"]
    output: Vehicle[]
    side_effects: []

  # --- VIN verification ---
  - method: POST
    path: "/vin-verifications"
    description: "Record a VIN verification outcome against a vehicle"
    roles: [ClerkAgent, DmvAdmin]
    code: 201
    input: [vehicle_id, submitted_vin, outcome]
    output: VinVerification
    side_effects:
      - "Vehicle.vin_status = VERIFIED if outcome == MATCH"
      - "Vehicle.vin_status = FLAGGED if outcome in {MISMATCH, NHTSA_FLAG}"
      - "increments Vehicle.version by 1"

  - method: GET
    path: "/vin-verifications/{id}"
    description: "Get a VinVerification"
    roles: [ClerkAgent, DmvAdmin]
    code: 200
    input: []
    output: VinVerification
    side_effects: []

  - method: GET
    path: "/vin-verifications"
    description: "List VIN verifications, filterable by vehicle"
    roles: [ClerkAgent, DmvAdmin]
    code: 200
    input: ["vehicle_id?", "limit?", "offset?"]
    output: VinVerification[]
    side_effects: []

  # --- Title applications ---
  - method: POST
    path: "/title-applications"
    description: "Create a TitleApplication"
    roles: [ClerkAgent, DmvAdmin]
    code: 201
    input: [vehicle_id, applicant_owner_id, application_type]
    output: TitleApplication
    side_effects: ["status = DRAFT", "requires_salvage_path = false"]

  - method: GET
    path: "/title-applications/{id}"
    description: "Get a TitleApplication"
    roles: [ClerkAgent, DmvAdmin, Owner]
    code: 200
    input: []
    output: TitleApplication
    side_effects: []

  - method: GET
    path: "/title-applications"
    description: "List title applications, filterable by vehicle or applicant owner"
    roles: [ClerkAgent, DmvAdmin, Owner]
    code: 200
    input: ["vehicle_id?", "applicant_owner_id?", "limit?", "offset?"]
    output: TitleApplication[]
    side_effects: []

  - method: POST
    path: "/title-applications/{id}/submit"
    description: "Submit a draft title application (forks to SALVAGE_HOLD when salvage-branded)"
    roles: [ClerkAgent]
    code: 200
    input: []
    output: TitleApplication
    side_effects: ["status -> SUBMITTED or SALVAGE_HOLD per branch fork", "requires_salvage_path set"]

  - method: POST
    path: "/title-applications/{id}/approve"
    description: "Approve a submitted/salvage-hold title application"
    roles: [ClerkAgent]
    code: 200
    input: []
    output: TitleApplication
    side_effects: ["status -> APPROVED"]

  - method: POST
    path: "/title-applications/{id}/reject"
    description: "Reject a title application"
    roles: [ClerkAgent]
    code: 200
    input: []
    output: TitleApplication
    side_effects: ["status -> REJECTED"]

  - method: POST
    path: "/title-applications/{id}/issue"
    description: "Issue the title (stamps brand, transfers ownership)"
    roles: [ClerkAgent]
    code: 200
    input: []
    output: TitleApplication
    side_effects:
      - "issued_title_brand set; Vehicle.title_status updated; Vehicle.owner_id = applicant_owner_id; increments Vehicle.version by 1"
      - "On TRANSFER: PERFECTED liens on the vehicle -> RELEASED; Vehicle.active_lien_count decremented accordingly"

  # --- Salvage inspections ---
  - method: POST
    path: "/salvage-inspections"
    description: "Record a rebuild (salvage) inspection for a salvage-hold title application"
    roles: [InspectionStation, DmvAdmin]
    code: 201
    input: [title_application_id, result]
    output: SalvageInspection
    side_effects: ["station_id = X-User-ID", "status = RECORDED"]

  - method: GET
    path: "/salvage-inspections/{id}"
    description: "Get a SalvageInspection"
    roles: [ClerkAgent, InspectionStation, DmvAdmin]
    code: 200
    input: []
    output: SalvageInspection
    side_effects: []

  - method: GET
    path: "/salvage-inspections"
    description: "List salvage inspections, filterable by title application"
    roles: [ClerkAgent, InspectionStation, DmvAdmin]
    code: 200
    input: ["title_application_id?", "limit?", "offset?"]
    output: SalvageInspection[]
    side_effects: []

  # --- Emissions inspections ---
  - method: POST
    path: "/emissions-inspections"
    description: "Record an emissions inspection for a vehicle"
    roles: [InspectionStation, DmvAdmin]
    code: 201
    input: [vehicle_id, result]
    output: EmissionsInspection
    side_effects: ["station_id = X-User-ID", "inspected_at = current clock; valid_until = inspected_at + EMISSIONS_VALID_DAYS", "status = RECORDED"]

  - method: GET
    path: "/emissions-inspections/{id}"
    description: "Get an EmissionsInspection"
    roles: [ClerkAgent, InspectionStation, DmvAdmin]
    code: 200
    input: []
    output: EmissionsInspection
    side_effects: []

  - method: GET
    path: "/emissions-inspections"
    description: "List emissions inspections, filterable by vehicle"
    roles: [ClerkAgent, InspectionStation, DmvAdmin]
    code: 200
    input: ["vehicle_id?", "limit?", "offset?"]
    output: EmissionsInspection[]
    side_effects: []

  # --- Liens ---
  - method: POST
    path: "/liens"
    description: "File a lien on a vehicle"
    roles: [ClerkAgent, DmvAdmin]
    code: 201
    input: [vehicle_id, lien_holder_name, principal_cents]
    output: Lien
    side_effects: ["status = FILED"]

  - method: GET
    path: "/liens/{id}"
    description: "Get a Lien"
    roles: [ClerkAgent, DmvAdmin, Owner]
    code: 200
    input: []
    output: Lien
    side_effects: []

  - method: GET
    path: "/liens"
    description: "List liens, filterable by vehicle"
    roles: [ClerkAgent, DmvAdmin, Owner]
    code: 200
    input: ["vehicle_id?", "limit?", "offset?"]
    output: Lien[]
    side_effects: []

  - method: POST
    path: "/liens/{id}/perfect"
    description: "Perfect a filed lien"
    roles: [ClerkAgent]
    code: 200
    input: []
    output: Lien
    side_effects: ["status -> PERFECTED", "increments Vehicle.active_lien_count by 1", "increments Vehicle.version by 1"]

  - method: POST
    path: "/liens/{id}/release"
    description: "Release a lien"
    roles: [ClerkAgent, DmvAdmin]
    code: 200
    input: []
    output: Lien
    side_effects: ["status -> RELEASED", "decrements Vehicle.active_lien_count by 1 only if was PERFECTED", "increments Vehicle.version by 1 only if was PERFECTED"]

  # --- Registrations ---
  - method: POST
    path: "/registrations"
    description: "Create a Registration (initial or transfer)"
    roles: [ClerkAgent, DmvAdmin]
    code: 201
    input: ["vehicle_id", "owner_id", "registration_type", "bundle_real_id?"]
    output: Registration
    side_effects: ["status = PENDING_FEES", "plate_assigned = false"]

  - method: GET
    path: "/registrations/{id}"
    description: "Get a Registration"
    roles: [ClerkAgent, DmvAdmin, Owner]
    code: 200
    input: []
    output: Registration
    side_effects: []

  - method: GET
    path: "/registrations"
    description: "List registrations, filterable by vehicle or owner"
    roles: [ClerkAgent, DmvAdmin, Owner]
    code: 200
    input: ["vehicle_id?", "owner_id?", "limit?", "offset?"]
    output: Registration[]
    side_effects: []

  - method: POST
    path: "/registrations/{id}/activate"
    description: "Activate a registration once fees paid, title issued, emissions met"
    roles: [ClerkAgent]
    code: 200
    input: []
    output: Registration
    side_effects: ["status -> ACTIVE", "plate_assigned reconciled"]

  - method: POST
    path: "/registrations/{id}/suspend"
    description: "Suspend an active registration (deactivates electronic plates)"
    roles: [DmvAdmin]
    code: 200
    input: []
    output: Registration
    side_effects: ["status -> SUSPENDED", "ELECTRONIC ACTIVE plates -> DEACTIVATED", "increments Registration.version by 1"]

  - method: POST
    path: "/registrations/{id}/reinstate"
    description: "Reinstate a suspended registration (reactivates electronic plates) — OCC guarded"
    roles: [DmvAdmin]
    code: 200
    input: [expected_registration_version]
    output: Registration
    side_effects: ["status -> ACTIVE", "ELECTRONIC DEACTIVATED plates -> ACTIVE", "increments Registration.version by 1"]

  - method: POST
    path: "/registrations/{id}/expire"
    description: "Expire an active registration (surrenders all plates)"
    roles: [DmvAdmin]
    code: 200
    input: []
    output: Registration
    side_effects: ["status -> EXPIRED", "all non-surrendered plates -> SURRENDERED", "increments Registration.version by 1"]

  # --- Fee assessments ---
  - method: POST
    path: "/fee-assessments"
    description: "Assess fees (use tax + registration fee + optional REAL ID surcharge) for a registration"
    roles: [ClerkAgent, DmvAdmin]
    code: 201
    input: [registration_id]
    output: FeeAssessment
    side_effects:
      - "use_tax_cents, registration_fee_cents, real_id_surcharge_cents, total_cents computed"
      - "status = ASSESSED"

  - method: GET
    path: "/fee-assessments/{id}"
    description: "Get a FeeAssessment"
    roles: [ClerkAgent, DmvAdmin, Owner]
    code: 200
    input: []
    output: FeeAssessment
    side_effects: []

  - method: GET
    path: "/fee-assessments"
    description: "List fee assessments, filterable by registration"
    roles: [ClerkAgent, DmvAdmin, Owner]
    code: 200
    input: ["registration_id?", "limit?", "offset?"]
    output: FeeAssessment[]
    side_effects: []

  - method: POST
    path: "/fee-assessments/{id}/pay"
    description: "Mark a fee assessment paid"
    roles: [ClerkAgent, DmvAdmin, Owner]
    code: 200
    input: []
    output: FeeAssessment
    side_effects: ["status -> PAID"]

  - method: POST
    path: "/fee-assessments/{id}/void"
    description: "Void an assessed fee (admin, only while registration PENDING_FEES)"
    roles: [DmvAdmin]
    code: 200
    input: []
    output: FeeAssessment
    side_effects: ["status -> VOIDED"]

  # --- License plates ---
  - method: POST
    path: "/license-plates"
    description: "Assign a license plate to a registration (OCC guarded)"
    roles: [ClerkAgent]
    code: 201
    input: [registration_id, plate_number, plate_type, expected_registration_version]
    output: LicensePlate
    side_effects: ["status = ISSUED", "issued_at = current clock; surrendered_at = null", "Registration.plate_assigned = true", "increments Registration.version by 1"]

  - method: GET
    path: "/license-plates/{id}"
    description: "Get a LicensePlate"
    roles: [ClerkAgent, DmvAdmin, Owner]
    code: 200
    input: []
    output: LicensePlate
    side_effects: []

  - method: GET
    path: "/license-plates"
    description: "List license plates, filterable by registration"
    roles: [ClerkAgent, DmvAdmin, Owner]
    code: 200
    input: ["registration_id?", "limit?", "offset?"]
    output: LicensePlate[]
    side_effects: []

  - method: POST
    path: "/license-plates/{id}/activate"
    description: "Activate (or reactivate) a plate"
    roles: [ClerkAgent]
    code: 200
    input: []
    output: LicensePlate
    side_effects: ["status -> ACTIVE"]

  - method: POST
    path: "/license-plates/{id}/deactivate"
    description: "Deactivate an electronic plate"
    roles: [ClerkAgent]
    code: 200
    input: []
    output: LicensePlate
    side_effects: ["status -> DEACTIVATED"]

  # --- REAL ID applications ---
  - method: POST
    path: "/real-id-applications"
    description: "Submit a REAL ID upgrade application for an owner"
    roles: [ClerkAgent, DmvAdmin, Owner]
    code: 201
    input: ["owner_id", "documents_complete?"]
    output: RealIdApplication
    side_effects: ["status = SUBMITTED"]

  - method: GET
    path: "/real-id-applications/{id}"
    description: "Get a RealIdApplication"
    roles: [ClerkAgent, DmvAdmin, Owner]
    code: 200
    input: []
    output: RealIdApplication
    side_effects: []

  - method: GET
    path: "/real-id-applications"
    description: "List REAL ID applications, filterable by owner"
    roles: [ClerkAgent, DmvAdmin, Owner]
    code: 200
    input: ["owner_id?", "limit?", "offset?"]
    output: RealIdApplication[]
    side_effects: []

  - method: POST
    path: "/real-id-applications/{id}/begin-review"
    description: "Begin reviewing a submitted REAL ID application"
    roles: [ClerkAgent]
    code: 200
    input: []
    output: RealIdApplication
    side_effects: ["status -> UNDER_REVIEW", "Owner.real_id_status = PENDING", "increments Owner.version by 1"]

  - method: POST
    path: "/real-id-applications/{id}/approve"
    description: "Approve a REAL ID upgrade"
    roles: [ClerkAgent]
    code: 200
    input: []
    output: RealIdApplication
    side_effects: ["status -> APPROVED", "Owner.credential_type = REAL_ID", "Owner.real_id_status = UPGRADED", "increments Owner.version by 1"]

  - method: POST
    path: "/real-id-applications/{id}/deny"
    description: "Deny a REAL ID upgrade"
    roles: [ClerkAgent]
    code: 200
    input: []
    output: RealIdApplication
    side_effects: ["status -> DENIED", "Owner.real_id_status = NONE", "increments Owner.version by 1"]

  - method: POST
    path: "/real-id-applications/{id}/return-for-documents"
    description: "Return a REAL ID application to SUBMITTED for more documents"
    roles: [ClerkAgent]
    code: 200
    input: []
    output: RealIdApplication
    side_effects: ["status -> SUBMITTED", "Owner.real_id_status = NONE", "increments Owner.version by 1"]

  # --- Test-driving clock (outside the public business surface) ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical current UTC clock (test-driving endpoint for time-window scenarios)"
    roles: [ClerkAgent, DmvAdmin]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["Server logical clock set to to_iso8601; used by inspected_at/valid_until and term_start/term_end stamping"]

# =============================================================================
# Table 6: Error Code Catalog  (§1.6)
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing X-User-Role or X-User-ID header" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Acting role not permitted for this operation" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Referenced resource does not exist" }
  - { id: ERR_VALIDATION, http: 400, condition: "Malformed body / missing required field" }
  - { id: ERR_INVALID_VIN, http: 422, condition: "VIN not 17 chars or not unique" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Resource not in a valid state for the requested transition" }
  - { id: ERR_VIN_NOT_VERIFIED, http: 409, condition: "TitleApplication submit requires Vehicle.vin_status == VERIFIED" }
  - { id: ERR_TRANSFER_REQUIRES_TITLE, http: 409, condition: "TRANSFER title application requires existing CLEAR/REBUILT title" }
  - { id: ERR_SALVAGE_INSPECTION_REQUIRED, http: 409, condition: "Salvage-hold approval/reject requires a matching PASS/FAIL SalvageInspection" }
  - { id: ERR_EMISSIONS_REQUIRED, http: 409, condition: "Registration activation requires a PASS EmissionsInspection for applicable vehicles" }
  - { id: ERR_TITLE_NOT_ISSUED, http: 409, condition: "Registration activation requires a matching ISSUED title for the owner" }
  - { id: ERR_FEES_UNPAID, http: 402, condition: "Registration activation requires the FeeAssessment to be PAID" }
  - { id: ERR_LIEN_REQUIRES_TITLE, http: 409, condition: "Lien perfection requires the vehicle to have a title" }
  - { id: ERR_PLATE_NUMBER_TAKEN, http: 409, condition: "plate_number tenancy interval overlaps an existing open tenancy of the same plate_number" }
  - { id: ERR_REGISTRATION_TERM_OVERLAP, http: 409, condition: "Registration activation term overlaps an existing ACTIVE registration's term on the same vehicle" }
  - { id: ERR_PLATE_ALREADY_ASSIGNED, http: 409, condition: "Registration already has a non-surrendered plate" }
  - { id: ERR_PLATE_NOT_ELECTRONIC, http: 409, condition: "Deactivation attempted on a non-electronic plate" }
  - { id: ERR_REGISTRATION_NOT_ACTIVE, http: 409, condition: "Plate activation / fee void requires the registration in the required state" }
  - { id: ERR_DOCUMENTS_INCOMPLETE, http: 409, condition: "REAL ID approval requires complete documents and verified identity" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_registration_version does not match current Registration.version" }

