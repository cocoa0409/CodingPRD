# =============================================================================
# Smart Parking Lot — Scaffold Difficulty Design (Test Targeting Index)
# Cross-references §1.1–§1.7 of SCAFFOLD.yaml against the nine §0.5 Difficulty
# Rules. Every grounds[] ref MUST resolve to a declared element in SCAFFOLD.yaml.
# Every test_recipe MUST be reachable from empty-DB through the API surface in
# SCAFFOLD.yaml §1.5 (including /_clock/advance and /_sweep/run).
# =============================================================================

scaffold_difficulty_design:

  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: session_billing_provisional_vs_final
        grounds:
          - calculations.session_billing
          - calculations.session_billing.variants.provisional_estimate
          - calculations.session_billing.variants.final_settlement
          - state_machines.Session.field=occupancy_status.ACTIVE_to_EXITED
          - endpoints.GET_/sessions/{session_id}
          - endpoints.POST_/sessions/{session_id}/exit
        distinguishing_aspect: |
          Variant operates on the Session entity domain (parking-stay cost). Provisional uses
          exit_clock=now() at GET-time; final uses pinned exit_at. With identical entry_at and
          identical PRD prose, GET at 10:30 returns estimated_fee_cents=400 (45 billable min,
          ceil to 1 hour) while exit pinned at 10:15:00.000 returns final_fee_cents=0
          (0 billable seconds). The two numbers come from the same formula on the same row.
        test_recipe:
          setup:
            - "POST /_clock/advance to 2026-01-01T10:00:00Z"
            - "POST /lots with timezone=UTC, hourly_rate_cents=400, daily_cap_cents=2000, free_minutes=15"
            - "POST /lots/{lot_id}/zones zone_type=STANDARD"
            - "POST /lots/{lot_id}/zones/{zone_id}/spaces label='A-1'"
            - "POST /vehicles plate='AAA111' kind=REGULAR"
            - "POST /lots/{lot_id}/sessions vehicle_id=V plate=AAA111 space_id=S → Session entry_at=10:00:00Z"
          trigger:
            - "POST /_clock/advance to 2026-01-01T10:30:00Z"
            - "GET /sessions/{session_id} → record provisional fee"
            - "POST /_clock/advance to 2026-01-01T10:15:00Z is impossible (clock monotonic) — instead, restart with separate session and exit at exactly entry_at+15min"
            - "Run a second isolated scenario: POST /_clock/advance to 10:15:00Z; POST /sessions/{S2}/exit"
          assert:
            - "First scenario: Session.estimated_fee_cents == 400 (15 billable min → ceil(900/3600)=1 hour × 400 cents)"
            - "Second scenario: Session.final_fee_cents == 0 (0 billable seconds because exit at exactly entry_at+15min)"
            - "Same formula, same entry_at, two different numbers solely because exit_clock differs"

      - name: stored_value_balance_provisional_vs_finalized
        grounds:
          - calculations.stored_value_balance
          - calculations.stored_value_balance.variants.provisional_balance
          - calculations.stored_value_balance.variants.finalized_balance
          - entities.Card.fields.balance_cents
          - endpoints.GET_/cards/{card_id}
        distinguishing_aspect: |
          Variant operates on the Card entity domain (stored-value wallet), which is a
          DIFFERENT entity domain from the Session-cost dual variant above. Provisional
          balance includes a SESSION_FEE Payment whose Session is still ACTIVE; finalized
          balance excludes it. With identical Payment rows, GET /cards/{id} returns
          balance_cents=4300 (provisional, after debit) and finalized_balance_cents=5000
          (excludes mid-lifecycle).
        test_recipe:
          setup:
            - "POST /_clock/advance to 2026-01-01T09:00:00Z"
            - "POST /lots, zone STANDARD, space A-1 (config as above)"
            - "POST /vehicles plate=BBB222"
            - "POST /cards card_type=STORED_VALUE holder_ref=h1 valid_from=2026-01-01 valid_until=2027-01-01 auto_pay_enabled=true"
            - "POST /cards/{card_id}/bind vehicle_id=V"
            - "POST /cards/{card_id}/recharge amount_cents=5000 → Payment CARD_RECHARGE"
            - "POST /lots/{lot_id}/sessions vehicle_id=V card_id=C → Session ACTIVE at 09:00"
            - "POST /_clock/advance to 09:00 + duration that yields exactly final_fee_cents=700 if exited"
            - "POST /sessions/{S}/pay card_id=C → Payment SESSION_FEE 700, Session.payment_status=PAID but Session.occupancy_status still ACTIVE"
          trigger:
            - "GET /cards/{card_id}"
          assert:
            - "Card.balance_cents (provisional) == 4300"
            - "Card.finalized_balance_cents == 5000  # excludes 700 because Session.occupancy_status==ACTIVE"
            - "Two variant outputs, one Card entity, identical Payment ledger"

  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: fine_amount_three_input_nonlinear
        grounds:
          - calculations.fine_amount
          - calculations.fine_amount.constants.TYPE_BASE
          - calculations.fine_amount.constants.TYPE_MULTIPLIER
          - calculations.fine_amount.constants.PHOTO_SURCHARGE_CENTS
          - calculations.fine_amount.constants.REPEAT_TIER1_CENTS
          - endpoints.POST_/violations
          - entities.Fine.fields.amount_cents
        distinguishing_aspect: |
          Mode (a) — a formula with ≥3 inputs and non-linear interaction. Inputs are
          (violation_type, prior_violations_count, photo_required_flag); the per-input
          contributions interact non-linearly because TYPE_MULTIPLIER is multiplicative
          while PHOTO_SURCHARGE and REPEAT_TIER are additive integer cents, and the
          repeat-tier function itself is a non-linear step function over prior count.
          Tested with BLOCKING + 0 prior + photo: amount==11500.
        test_recipe:
          setup:
            - "POST /_clock/advance to 2026-02-01T10:00:00Z"
            - "POST /lots (defaults), zone STANDARD, space A-1"
            - "POST /vehicles plate=CCC333"
          trigger:
            - "POST /violations lot_id=L vehicle_id=V violation_type=BLOCKING photo_uri='s3://e1' space_id=S detected_at=2026-02-01T10:00:00Z officer_id=O1"
          assert:
            - "Fine.amount_cents == 11500  # 5000*2.0 + 1500 + 0"
            - "Fine.components.base_cents == 5000"
            - "Fine.components.type_multiplier == 2.0"
            - "Fine.components.photo_required_surcharge_cents == 1500"
            - "Fine.components.repeat_offender_surcharge_cents == 0"

      - name: revenue_split_per_entry_vs_sum_then_round
        grounds:
          - calculations.revenue_split
          - calculations.revenue_split.constants.BPS_DENOMINATOR
          - entities.RevenueEntry.fields.partner_share_cents
          - entities.RevenueEntry.fields.house_share_cents
          - endpoints.GET_/lots/{lot_id}/revenue
          - endpoints.POST_/lots/{lot_id}/settlement/run
        distinguishing_aspect: |
          Mode (b) — nested rounding where the order matters. Round-per-entry-then-sum
          produces 83+83+83=249 cents partner share for three RevenueEntry rows of 333
          gross at 2500 bps. Sum-then-round produces round(999*0.25)=250. Scaffold pins
          per-entry-then-sum; reporting endpoint MUST return 249, not 250. This is a
          DIFFERENT mode from the fine_amount instance above (which is mode (a)).
        test_recipe:
          setup:
            - "POST /_clock/advance to 2026-03-01T10:00:00Z"
            - "POST /lots partner_share_bps=2500 hourly_rate_cents=333 daily_cap_cents=10000 free_minutes=0"
            - "Zone STANDARD, three Spaces A-1, A-2, A-3"
            - "POST /vehicles for each of three plates"
            - "Three Sessions opened concurrently at 10:00, each exited at 11:00 → final_fee_cents = ceil(3600/3600)=1*333 = 333 each"
            - "Three /sessions/{S}/pay with external rail → three RevenueEntry billing_type=HOURLY gross_amount_cents=333 each"
          trigger:
            - "GET /lots/{lot_id}/revenue group_by=billing_type from=2026-03-01 to=2026-03-02"
          assert:
            - "Aggregated partner_share_cents == 249  # 83+83+83 (per-entry-then-sum)"
            - "Aggregated partner_share_cents != 250  # would be the sum-then-round answer"
            - "Each individual RevenueEntry.partner_share_cents == 83"

      - name: reservation_charge_circular_evaluation_order
        grounds:
          - calculations.reservation_charge
          - calculations.reservation_charge.constants.MATCH_DISCOUNT_BPS
          - state_machines.Reservation.HELD_to_MATCHED
          - state_machines.Reservation.HELD_to_EXPIRED_NO_SHOW
          - state_machines.Reservation.HELD_to_CANCELLED
          - endpoints.POST_/lots/{lot_id}/reservations
        distinguishing_aspect: |
          Mode (c) — a circular-looking dependency where evaluation order must be explicit.
          effective_charge depends on billing_type, but billing_type itself depends on
          Reservation.status which is determined by the active transition. Scaffold pins
          step 1 (resolve billing_type from status) BEFORE step 2 (evaluate the formula
          using the now-pinned billing_type). MATCHED reservation over a 2-hour window with
          hourly_rate_cents=300, daily_cap_cents=2000, MATCH_DISCOUNT_BPS=1000 yields
          effective_charge == -60 cents (discount). This is a DIFFERENT mode from both
          fine_amount (mode a) and revenue_split (mode b).
        test_recipe:
          setup:
            - "POST /_clock/advance to 2026-04-01T13:50:00Z"
            - "POST /lots hourly_rate_cents=300 daily_cap_cents=2000 free_minutes=0 reservation_hold_minutes=15 no_show_penalty_cents=500 partner_share_bps=0"
            - "Zone STANDARD, Space A-1"
            - "POST /vehicles plate=DDD444"
            - "POST /lots/{lot_id}/reservations zone_id=Z vehicle_id=V scheduled_start_at=2026-04-01T14:00:00Z scheduled_end_at=2026-04-01T16:00:00Z"
          trigger:
            - "POST /_clock/advance to 2026-04-01T14:00:00Z"
            - "POST /lots/{lot_id}/sessions vehicle_id=V plate=DDD444 → matches reservation"
          assert:
            - "Reservation.status == 'MATCHED'"
            - "RevenueEntry created with billing_type=='RESERVATION' and gross_amount_cents == -60  # discount"
            - "Step ordering pinned: billing_type resolved first, formula evaluated second"

  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: card_cyclic_active_suspended
        grounds:
          - state_machines.Card.ACTIVE_to_SUSPENDED
          - state_machines.Card.SUSPENDED_to_ACTIVE
          - state_machines.Card.ACTIVE_to_EXPIRED
          - endpoints.POST_/cards/{card_id}/suspend
          - endpoints.POST_/cards/{card_id}/reactivate
        distinguishing_aspect: |
          Card has a CYCLE: ACTIVE → SUSPENDED → ACTIVE before terminal EXPIRED.
          Cycle resides on the Card entity. The same row can pass through ACTIVE more
          than once, distinguishable from a linear pipeline.
        test_recipe:
          setup:
            - "POST /_clock/advance to 2026-01-01T10:00:00Z"
            - "POST /cards card_type=STORED_VALUE holder_ref=h1 valid_from=2026-01-01 valid_until=2027-01-01"
          trigger:
            - "POST /cards/{card_id}/suspend"
            - "POST /cards/{card_id}/reactivate"
            - "GET /cards/{card_id}"
          assert:
            - "Card.status sequence observed: ACTIVE → SUSPENDED → ACTIVE"
            - "Card.version incremented twice (suspend, reactivate)"

      - name: session_parallel_payment_x_occupancy
        grounds:
          - state_machines.Session.field=occupancy_status
          - state_machines.Session.field=payment_status
          - entities.Session.fields.occupancy_status
          - entities.Session.fields.payment_status
          - endpoints.POST_/sessions/{session_id}/exit
          - endpoints.POST_/sessions/{session_id}/pay
        distinguishing_aspect: |
          Session has TWO PARALLEL state dimensions on a single row that evolve
          independently: occupancy_status (ACTIVE → EXITED) and payment_status
          (UNPAID → {PAID, WAIVED, DISPUTED} with DISPUTED↔UNPAID cycle and PAID→UNPAID
          revert). Resides on the Session entity, DIFFERENT from the Card cyclic instance.
          A Session can be EXITED+UNPAID, EXITED+PAID, EXITED+DISPUTED — the cross-product
          is reachable via independent transitions.
        test_recipe:
          setup:
            - "Same setup as session_billing_provisional_vs_final, with stored-value Card"
          trigger:
            - "POST /sessions/{S}/exit (occupancy ACTIVE→EXITED, payment still UNPAID)"
            - "POST /sessions/{S}/pay (occupancy EXITED unchanged, payment UNPAID→PAID)"
          assert:
            - "After exit: Session.occupancy_status=='EXITED' AND Session.payment_status=='UNPAID'"
            - "After pay: Session.occupancy_status=='EXITED' AND Session.payment_status=='PAID'"
            - "Two independent state axes both observable"

      - name: violation_cyclic_pending_disputed
        grounds:
          - state_machines.Violation.PENDING_to_DISPUTED
          - state_machines.Violation.DISPUTED_to_PENDING
          - state_machines.Violation.PENDING_to_PAID
          - endpoints.PATCH_/violations/{violation_id}
        distinguishing_aspect: |
          Violation has a cycle PENDING → DISPUTED → PENDING (Driver disputes, Operator
          reverts). Resides on the Violation entity, DIFFERENT from Card's cycle and
          DIFFERENT from Session's parallel dimensions.
        test_recipe:
          setup:
            - "POST /_clock/advance to 2026-05-01T10:00:00Z"
            - "POST /violations violation_type=OVERSTAY (no photo) → PENDING"
          trigger:
            - "PATCH /violations/{V} body={status: DISPUTED, reason: 'I left at 9:55'} as Driver"
            - "PATCH /violations/{V} body={status: PENDING, reason: 'evidence reviewed'} as Operator"
          assert:
            - "Violation.status sequence: PENDING → DISPUTED → PENDING"
            - "AuditLog has two BILLING_ADJUSTMENT entries for this Violation"

  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: violation_to_session_to_vehicle_chain
        grounds:
          - state_machines.Session.UNPAID_to_DISPUTED
          - state_machines.Violation.PENDING_to_PAID
          - entities.Vehicle.fields.binding_eligible
          - entities.Vehicle.fields.open_violation_count
          - endpoints.POST_/violations
          - endpoints.POST_/violations/{violation_id}/pay
        distinguishing_aspect: |
          Depth-3 transitive cascade triggered by POST /violations:
          (1) Violation created → (2) the Violation creation MUTATES the linked Session's
          payment_status from UNPAID to DISPUTED → (3) the Session.payment_status mutation
          MUTATES the Vehicle.binding_eligible to false (because open_violation_count > 0).
          Each link is caused by the previous, not by the original action — Vehicle
          updates because of the Session change, not directly because POST /violations ran.
        test_recipe:
          setup:
            - "POST /_clock/advance to 2026-06-01T08:00:00Z"
            - "POST /lots, zone STANDARD, space A-1"
            - "POST /vehicles plate=EEE555"
            - "Session opened then exited (payment_status=UNPAID, final_fee_cents pinned)"
          trigger:
            - "POST /violations violation_type=OVERSTAY session_id=S vehicle_id=V detected_at=2026-06-01T09:00:00Z (no photo)"
          assert:
            - "Violation.status == 'PENDING'"
            - "Session.payment_status == 'DISPUTED'  # hop 2"
            - "Vehicle.binding_eligible == false  # hop 3"
            - "Vehicle.open_violation_count == 1"

      - name: card_recharge_to_session_to_revenue_chain
        grounds:
          - calculations.stored_value_balance
          - state_machines.Session.UNPAID_to_PAID
          - entities.RevenueEntry
          - endpoints.POST_/cards/{card_id}/recharge
        distinguishing_aspect: |
          Depth-≥2 transitive cascade triggered by POST /cards/{id}/recharge with
          auto_pay_enabled=true: (1) Card.balance_cents increases → (2) the balance
          increase TRIGGERS settlement of the bound vehicle's UNPAID EXITED Sessions
          (Session.payment_status UNPAID→PAID) → (3) each Session settlement TRIGGERS
          a RevenueEntry creation. Originates from a DIFFERENT trigger than the
          violation chain (recharge vs violation issuance) and chains through different
          intermediate entities (Card→Session→RevenueEntry vs Violation→Session→Vehicle).
        test_recipe:
          setup:
            - "POST /_clock/advance to 2026-07-01T08:00:00Z"
            - "Lot, Zone, Space, Vehicle, Card (STORED_VALUE, auto_pay_enabled=true, balance=0)"
            - "Bind vehicle to card"
            - "Open Session, advance clock 1h, exit Session → final_fee_cents=300, payment_status=UNPAID (insufficient balance, no Payment)"
          trigger:
            - "POST /cards/{card_id}/recharge amount_cents=5000"
          assert:
            - "Card.balance_cents == 4700  # hop 1: +5000, then hop 2 debits 300"
            - "Session.payment_status == 'PAID'  # hop 2"
            - "RevenueEntry exists with billing_type='HOURLY' gross_amount_cents=300  # hop 3"

  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_business_fiscal_pay_session
        grounds:
          - validations[priority=6]
          - validations[priority=16]
          - errors.ERR_INVALID_STATE
          - errors.ERR_INSUFFICIENT_BALANCE
          - endpoints.POST_/sessions/{session_id}/pay
        distinguishing_aspect: |
          Pair: state (priority 6, ERR_INVALID_STATE category=state) vs
          business_fiscal (priority 16, ERR_INSUFFICIENT_BALANCE category=business_fiscal).
          A request to POST /sessions/{id}/pay against a session whose
          occupancy_status==ACTIVE (state failure) AND whose card balance is insufficient
          (fiscal failure) MUST return ERR_INVALID_STATE per priority ordering.
        test_recipe:
          setup:
            - "Session ACTIVE (not exited yet); STORED_VALUE Card with balance_cents=0; vehicle bound"
          trigger:
            - "POST /sessions/{session_id}/pay card_id=C as Driver"
          assert:
            - "HTTP status == 409"
            - "error_id == 'ERR_INVALID_STATE'  # priority 6 wins over priority 16"
            - "NOT 'ERR_INSUFFICIENT_BALANCE'"

      - name: business_safety_vs_business_referential_violation_creation
        grounds:
          - validations[priority=7]
          - validations[priority=14]
          - errors.ERR_EXEMPT_VEHICLE
          - errors.ERR_PHOTO_REQUIRED
          - endpoints.POST_/violations
        distinguishing_aspect: |
          Pair: business_safety (priority 7, ERR_EXEMPT_VEHICLE category=business_safety
          on EMERGENCY/DISABLED vehicles) vs business_safety/referential
          (priority 14, ERR_PHOTO_REQUIRED for BLOCKING/WRONG_ZONE without photo).
          DIFFERENT error-category pair from the previous (state vs fiscal). A request
          to POST /violations on an EMERGENCY vehicle for OVERSTAY without photo MUST
          return ERR_EXEMPT_VEHICLE first; for WRONG_ZONE without photo on EMERGENCY,
          ERR_EXEMPT_VEHICLE still wins (priority 7 < priority 14).
        test_recipe:
          setup:
            - "POST /vehicles plate=FFF666 kind=EMERGENCY"
            - "Lot, Zone, Space prepared"
          trigger:
            - "POST /violations violation_type=OVERSTAY vehicle_id=V detected_at=now (no photo) as EnforcementOfficer"
          assert:
            - "HTTP status == 422"
            - "error_id == 'ERR_EXEMPT_VEHICLE'  # priority 7"
            - "NOT 'ERR_PHOTO_REQUIRED'  # would be priority 14 if it applied"

  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: free_minutes_exact_boundary_at_exit
        grounds:
          - calculations.session_billing
          - entities.ParkingLot.fields.free_minutes
          - endpoints.POST_/sessions/{session_id}/exit
        distinguishing_aspect: |
          Numeric boundary: at duration_seconds == free_minutes*60 exactly, fee == 0
          (formula: 'if duration_seconds <= ParkingLot.free_minutes * 60: fee_cents = 0').
          One additional second crosses the boundary. Reachable through POST .../exit.
        test_recipe:
          setup:
            - "POST /_clock/advance to 2026-08-01T10:00:00Z"
            - "POST /lots free_minutes=15 hourly_rate_cents=400"
            - "Open Session at 10:00:00Z"
          trigger:
            - "POST /_clock/advance to 2026-08-01T10:15:00Z"
            - "POST /sessions/{S}/exit"
          assert:
            - "Session.final_fee_cents == 0  # exactly free_minutes*60 seconds, '<=' boundary"
            - "If clock had been at 10:15:01Z, expected final_fee_cents == 400 (1 billable second → ceil → 1 hour)"

      - name: empty_candidate_pool_on_reservation
        grounds:
          - endpoints.POST_/lots/{lot_id}/reservations
          - errors.ERR_NO_SPACE_AVAILABLE
          - validations[priority=10]
        distinguishing_aspect: |
          Empty-collection boundary: when the reservation selector's candidate set is
          empty (zero eligible Spaces), the response MUST be ERR_NO_SPACE_AVAILABLE.
          Different metric (set size) and different endpoint (POST /reservations) than
          the free_minutes numeric boundary above.
        test_recipe:
          setup:
            - "POST /lots, zone STANDARD with exactly ONE space A-1"
            - "POST a HELD Reservation R1 covering [14:00, 16:00) on the only space"
          trigger:
            - "POST /lots/{lot_id}/reservations vehicle_id=V2 zone_id=Z scheduled_start_at=14:30:00Z scheduled_end_at=15:30:00Z"
          assert:
            - "HTTP status == 409"
            - "error_id == 'ERR_NO_SPACE_AVAILABLE'  # candidate set empty (only space conflicts)"

  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: session_creation_depends_on_space_state
        grounds:
          - state_machines.Space.field=occupancy_status.FREE_to_OCCUPIED
          - validations[priority=10]
          - errors.ERR_SPACE_OCCUPIED
          - errors.ERR_SPACE_NOT_BOOKABLE
          - endpoints.POST_/lots/{lot_id}/sessions
        distinguishing_aspect: |
          Pair: Session ↔ Space. Session.occupancy_status ACTIVE transition is admitted
          only when Space.occupancy_status==FREE (and Space.last_exited_at + tow_grace
          buffer satisfied). Depends on a DIFFERENT entity (Space) and is gated by
          Space's state field.
        test_recipe:
          setup:
            - "Lot, Zone, Space; open Session S1 on space (Space.occupancy_status=OCCUPIED)"
          trigger:
            - "POST /lots/{lot_id}/sessions vehicle_id=V2 space_id=S as GateSystem"
          assert:
            - "HTTP status == 409"
            - "error_id == 'ERR_SPACE_OCCUPIED'  # Session creation gated by Space state"

      - name: reservation_creation_depends_on_card_state
        grounds:
          - state_machines.Card.ACTIVE_to_EXPIRED
          - validations[priority=12]
          - errors.ERR_CARD_EXPIRED
          - endpoints.POST_/lots/{lot_id}/reservations
        distinguishing_aspect: |
          Pair: Reservation ↔ Card — DIFFERENT entity pair from Session↔Space above.
          POST /lots/{lot_id}/reservations with card_id pinned requires Card.status ==
          ACTIVE; if Card.status==EXPIRED, ERR_CARD_EXPIRED is returned. Reservation's
          valid creation depends on a different entity's state.
        test_recipe:
          setup:
            - "POST /_clock/advance to 2026-12-31T23:59:59Z"
            - "POST /cards card_type=STORED_VALUE valid_from=2026-01-01 valid_until=2026-12-31"
            - "POST /_clock/advance to 2027-01-02T00:00:00Z (Card expires via sweep)"
            - "POST /_sweep/run"
          trigger:
            - "POST /lots/{lot_id}/reservations vehicle_id=V card_id=C scheduled_start_at=2027-01-03T14:00:00Z scheduled_end_at=2027-01-03T16:00:00Z"
          assert:
            - "Card.status == 'EXPIRED'"
            - "HTTP status == 409"
            - "error_id == 'ERR_CARD_EXPIRED'  # Reservation creation gated by Card state"

  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: reservation_half_open_interval_back_to_back_allowed
        grounds:
          - validations[priority=9]
          - errors.ERR_RESERVATION_OVERLAP
          - concurrency_rules[reservation_overlap]
          - endpoints.POST_/lots/{lot_id}/reservations
        distinguishing_aspect: |
          Half-open interval semantics [scheduled_start_at, scheduled_end_at):
          back-to-back reservations whose boundaries touch are ALLOWED (no buffer).
          Resource: Space. Geometric treatment: half-open, no buffer.
        test_recipe:
          setup:
            - "Lot (tow_grace_minutes=0), Zone, Space A-1, two Vehicles V1/V2"
            - "POST reservation R1 [14:00, 16:00) on space"
          trigger:
            - "POST reservation R2 [16:00, 18:00) on same space (touches R1.end exactly)"
            - "POST reservation R3 [15:59, 17:00) on same space (overlaps R1 by 1 min)"
          assert:
            - "R2 succeeds (HTTP 201) — back-to-back allowed under half-open semantics"
            - "R3 fails with ERR_RESERVATION_OVERLAP (HTTP 409)"

      - name: session_space_buffer_with_tow_grace
        grounds:
          - validations[priority=10]
          - entities.ParkingLot.fields.tow_grace_minutes
          - entities.Space.fields.last_exited_at
          - errors.ERR_SPACE_NOT_BOOKABLE
          - endpoints.POST_/lots/{lot_id}/reservations
        distinguishing_aspect: |
          Closed interval with BUFFER semantics — DIFFERENT geometric treatment from the
          half-open reservation overlap above. After a Session exits a Space at time T,
          the Space cannot be reserved again until T + tow_grace_minutes. The interval
          treats the buffer as additive non-bookable time after exit on a different
          resource state field (Space.last_exited_at) than the reservation interval.
        test_recipe:
          setup:
            - "Lot tow_grace_minutes=5, Zone, Space A-1"
            - "POST Session, exit at 2026-09-01T10:00:00Z"
          trigger:
            - "POST reservation [2026-09-01T10:03:00Z, 10:30:00Z) within buffer"
            - "POST reservation [2026-09-01T10:05:00Z, 10:30:00Z) at exact buffer end"
          assert:
            - "First reservation fails with ERR_SPACE_NOT_BOOKABLE (inside 5-min buffer)"
            - "Second reservation succeeds (start_at exactly equals last_exited_at + 5min, '>=' boundary)"

  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: card_balance_recharge_then_refund_invariant
        grounds:
          - calculations.stored_value_balance
          - entities.Card.fields.balance_cents
          - state_machines.Session.PAID_to_UNPAID
          - endpoints.POST_/cards/{card_id}/recharge
          - endpoints.POST_/payments/{payment_id}/refund
        distinguishing_aspect: |
          Conserved quantity: Card.balance_cents + sum(Payment.amount_cents for all
          Payments tied to this Card with kind in {SESSION_FEE, FINE_PAYMENT,
          NO_SHOW_PENALTY}) - sum(Payment.amount_cents for kind in {CARD_RECHARGE,
          REFUND}). For a recharge-then-debit-then-refund cycle on a stored-value card,
          this sum MUST remain unchanged at 0 across the cycle.
        test_recipe:
          setup:
            - "Card STORED_VALUE balance=0; Vehicle bound"
            - "POST /cards/{C}/recharge 5000 (P1)"
            - "Open + exit Session, final_fee=300, /sessions/{S}/pay card=C (P2)"
          trigger:
            - "POST /payments/{P2}/refund reason='dispute resolved'"
          assert:
            - "Card.balance_cents == 5000  # 5000 - 300 + 300 refund"
            - "Invariant: balance_cents - recharges + debits + refunds == 0  # 5000 - 5000 + 300 - 300 == 0"
            - "Session.payment_status reverted PAID → UNPAID"

      - name: revenue_total_refund_invariant
        grounds:
          - calculations.revenue_split
          - entities.RevenueEntry.fields.gross_amount_cents
          - entities.RevenueEntry.fields.partner_share_cents
          - entities.RevenueEntry.fields.house_share_cents
          - endpoints.POST_/payments/{payment_id}/refund
          - endpoints.GET_/lots/{lot_id}/revenue
        distinguishing_aspect: |
          DIFFERENT conserved quantity from balance: revenue distribution. After a
          refund of a previously settled session, the invariant
          sum(RevenueEntry.gross_amount_cents for lot, period) MUST equal the residual
          (i.e., original gross + refund-as-negative-gross == 0 net for that source). The
          quantity is house_share + partner_share at the lot level, not the card balance.
        test_recipe:
          setup:
            - "Lot partner_share_bps=2500"
            - "Run a Session that produces RevenueEntry RE1 with gross_amount_cents=400"
          trigger:
            - "POST /payments/{P}/refund reason='customer goodwill'"
          assert:
            - "A new RevenueEntry RE2 exists with billing_type='REFUND' and gross_amount_cents == -400"
            - "Aggregate sum(gross_amount_cents) for the lot in this period == 0"
            - "Aggregate sum(partner_share_cents) for this source: RE1.partner=100 + RE2.partner=0 == 100  # NOT zero, because partner share is clamped to 0 floor on refunds (per revenue_split formula)"
            - "Invariant clarification: house_share + partner_share == gross for each entry (RE1: 300+100==400; RE2: -400+0==-400); sum-of-pair == 0"
