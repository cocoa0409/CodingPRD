  - method: POST
    path: "/homeownership/mortgage-applications/{id}/lien-actions"
    description: "Act on an active silent second: FORBEARANCE and CURE for foreclosure-prevention counseling, TRANSFER_NOTICE for a resale inside the restriction period, RECAPTURE to settle the transfer, PAYOFF to satisfy the lien"
    roles: [MortgageOfficer, ProgramAdmin]
    code: 200
    input: [action, effective_date, "sale_price_cents?", "counseling_session_reference?"]
    output: MortgageApplication
    side_effects: ["FORBEARANCE: ACTIVE -> FORBEARANCE and forbearance_counseling_sessions raised by 1", "CURE: FORBEARANCE -> ACTIVE", "TRANSFER_NOTICE: -> TRANSFER_PENDING and right_of_first_refusal_expires_on := effective_date + 30 days", "RECAPTURE: -> RECAPTURED, writing forgiven_amount_cents and lien_outstanding_cents from calculations.lien_forgiveness_and_recapture; the recaptured cents return to AffiliateProgram.subsidy_available_cents and leave subsidy_disbursed_cents", "PAYOFF: -> SATISFIED with lien_outstanding_cents := 0", "increments MortgageApplication.version and (on RECAPTURE) AffiliateProgram.version by 1"]

