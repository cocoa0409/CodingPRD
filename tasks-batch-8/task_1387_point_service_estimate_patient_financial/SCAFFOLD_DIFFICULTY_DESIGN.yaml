  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: contract_rate_half_open_window_overlap
        grounds:
          - validations[priority=16]
          - errors[ERR_RATE_WINDOW_OVERLAP]
          - entities.ContractRate.fields.effective_to
        distinguishing_aspect: |
          Interval semantics: HALF-OPEN [effective_from, effective_to) on
          ContractRate — a new window starting exactly at the existing window's
          effective_to is allowed (adjacency), while a window starting one day
          before it collides. Resource differs from the sibling (ContractRate
          vs Authorization), and the half-open intersection semantics differ
          from the sibling's closed-interval point containment.
        test_recipe:
          setup:
            - "Charge item 27447; contract ACME (bundling NONE); existing rate R1 for 27447 with window [2026-01-01, 2026-07-01)"
          setup_api_calls:
            - call: "POST /clearance/charge-items"
              payload: { cpt_code: "27447", description: "Total knee arthroplasty", list_price_cents: 5000000, requires_auth_prior: false }
              as: SystemAdmin
            - call: "POST /clearance/payer-contracts"
              payload: { payer_code: "ACME", payer_name: "Acme Health", bundling_rule: "NONE" }
              as: SystemAdmin
              captures: { pc_id: $.data.id }
            - call: "POST /clearance/payer-contracts/${pc_id}/rates"
              payload: { cpt_code: "27447", rate_cents: 3000000, effective_from: "2026-01-01", effective_to: "2026-07-01" }
              as: SystemAdmin
              captures: { rate1_id: $.data.id }
          trigger:
            - call: "POST /clearance/payer-contracts/${pc_id}/rates"
              payload: { cpt_code: "27447", rate_cents: 3200000, effective_from: "2026-07-01" }
              as: SystemAdmin
              captures: { rate2_id: $.data.id }
            - call: "POST /clearance/payer-contracts/${pc_id}/rates"
              payload: { cpt_code: "27447", rate_cents: 3100000, effective_from: "2026-06-15", effective_to: "2026-08-01" }
              as: SystemAdmin
              captures: { err: $.data.error_id }
            - call: "GET /clearance/payer-contracts/${pc_id}/rates"
              as: SystemAdmin
          assert:
            - "adjacent create succeeds: R2 [2026-07-01, open) created with 201 (touching endpoint is NOT an overlap under half-open semantics)"
            - "overlapping create rejected: error_id == ERR_RATE_WINDOW_OVERLAP, http 409 ([2026-06-15, 2026-08-01) intersects [2026-01-01, 2026-07-01))"
            - "contract has exactly 2 rates after the sequence (R1, R2); no third row persisted"

      - name: authorization_closed_window_containment
        grounds:
          - validations[priority=17]
          - errors[ERR_AUTH_ALREADY_COVERED]
          - entities.Authorization.fields.valid_to
        distinguishing_aspect: |
          Interval semantics: CLOSED [valid_from, valid_to] containment of a
          point (case.service_date) on Authorization — service_date equal to
          valid_to counts as covered (inclusive end), unlike the sibling's
          half-open rate windows where the endpoint is excluded. Resource
          differs (Authorization vs ContractRate).
        test_recipe:
          setup:
            - "Patient with case A (service 2026-08-20); authorization AA for [27447] APPROVED with closed window 2026-08-10..2026-08-31"
            - "Case B (service 2026-08-31 — exactly the valid_to boundary) with authorization BA for [27447] APPROVED with the same window"
          setup_api_calls:
            - call: "POST /clearance/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: SystemAdmin
            - call: "POST /clearance/patients"
              payload: { mrn: "MRN-O-1", full_name: "Pat Overlap", date_of_birth: "1984-05-17" }
              as: Registrar
              captures: { pat_id: $.data.id }
            - call: "POST /clearance/patients/${pat_id}/cases"
              payload: { service_date: "2026-08-20", service_description: "Knee replacement" }
              as: Registrar
              captures: { case_a: $.data.id }
            - call: "POST /clearance/cases/${case_a}/authorizations"
              payload: { cpt_codes: ["27447"], payer_code: "ACME" }
              as: UtilizationReviewer
              as_user_id: "ur-1"
              captures: { auth_a: $.data.id }
            - call: "POST /clearance/authorizations/${auth_a}/decide"
              payload: { decision: "APPROVED", medical_necessity_met: true, valid_from: "2026-08-10", valid_to: "2026-08-31" }
              as: UtilizationReviewer
              as_user_id: "ur-2"
            - call: "POST /clearance/patients/${pat_id}/cases"
              payload: { service_date: "2026-08-31", service_description: "Follow-up procedure" }
              as: Registrar
              captures: { case_b: $.data.id }
            - call: "POST /clearance/cases/${case_b}/authorizations"
              payload: { cpt_codes: ["27447"], payer_code: "ACME" }
              as: UtilizationReviewer
              as_user_id: "ur-1"
              captures: { auth_b: $.data.id }
            - call: "POST /clearance/authorizations/${auth_b}/decide"
              payload: { decision: "APPROVED", medical_necessity_met: true, valid_from: "2026-08-10", valid_to: "2026-08-31" }
              as: UtilizationReviewer
              as_user_id: "ur-2"
          trigger:
            - call: "POST /clearance/cases/${case_a}/authorizations"
              payload: { cpt_codes: ["27447"], payer_code: "ACME" }
              as: UtilizationReviewer
              as_user_id: "ur-1"
              captures: { err_a: $.data.error_id }
            - call: "POST /clearance/cases/${case_a}/authorizations"
              payload: { cpt_codes: ["29881"], payer_code: "ACME" }
              as: UtilizationReviewer
              as_user_id: "ur-1"
              captures: { auth_new: $.data.id }
            - call: "POST /clearance/cases/${case_b}/authorizations"
              payload: { cpt_codes: ["27447"], payer_code: "ACME" }
              as: UtilizationReviewer
              as_user_id: "ur-1"
              captures: { err_b: $.data.error_id }
          assert:
            - "duplicate request for covered cpt rejected: error_id == ERR_AUTH_ALREADY_COVERED, http 409 (service 2026-08-20 inside closed [2026-08-10, 2026-08-31])"
            - "disjoint cpt request succeeds: Authorization.${auth_new} created with status REQUESTED"
            - "boundary: case B service_date == valid_to (2026-08-31) is still covered under closed-interval semantics -> duplicate rejected with ERR_AUTH_ALREADY_COVERED"

  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: deposit_post_refund_ledger_conservation
        grounds:
          - state_machines.Deposit.PLEDGED_to_POSTED
          - state_machines.Deposit.POSTED_to_REFUNDED
          - entities.FinancialClearanceCase.fields.deposit_posted_cents
        distinguishing_aspect: |
          Conserved quantity: the case deposit ledger in cents —
          case.deposit_posted_cents == sum(amount_cents over POSTED deposits)
          before, during, and after a post/refund pair; the forward action
          (post +100000) paired with its compensating action (refund at 100%)
          returns the ledger to exactly its prior value. Sibling conserves a
          different quantity (active-estimate cardinality, a count not money).
        test_recipe:
