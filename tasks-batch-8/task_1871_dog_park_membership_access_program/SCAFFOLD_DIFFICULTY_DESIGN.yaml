            - "Member.${m_id}.strike_points == 30 exactly"
            - "Member.${m_id}.status == SUSPENDED (>= 30 fires at exactly 30)"

  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: checkin_requires_dog_verified
        grounds:
          - state_machines.ParkVisit
          - entities.Dog.fields.verification_status
          - errors[ERR_DOG_NOT_VERIFIED]
        distinguishing_aspect: |
          Entity pair ParkVisit -> Dog: check-in of a SUBMITTED (never verified)
          dog is rejected even though the member holds an ACTIVE membership via a
          second verified dog — distinct pair from the Membership -> Member instance.
        test_recipe:
          setup:
            - "Clock 2026-08-01; SMALL area capacity 4; member A with dog1 VERIFIED (enabled the membership) and dog2 still SUBMITTED"
          setup_api_calls:
            - call: "POST /dog-park/_clock/set_current_utc"
