        distinguishing_aspect: "The same endpoint sends the use case to APPROVED on outcome CONFIRMED and to SUSPENDED on outcome SUSPEND; the SUSPEND branch additionally stales the PINNED binding with superseded_reason APPROVAL_SUSPENDED while leaving portfolio_approved_reach at 5000 because SUSPENDED is inside INVENTORY_STATUSES."
        test_recipe:
          setup: ["Full LITE approval chain, then move the clock to exactly approval_expires_at (2027-08-01T00:00:00Z) and run one governance sweep: step 1 opens the reassessment because now >= reassessment_due_at, and step 2 leaves it alone because its expiry comparison is strictly greater."]
