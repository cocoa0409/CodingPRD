              as: ComplianceOfficer
              as_user_id: "co_1"
              captures: { an3_status: $.data.status }
          assert:
            - "${an1_status} == COMPUTED and ${an1_total} == 2016000 (AETNA only: (115200 - 96000) x 105 units)"
            - "PriceChangeImpactAnalysis.${an1}.status == STALE after the BCBS contract is created"
