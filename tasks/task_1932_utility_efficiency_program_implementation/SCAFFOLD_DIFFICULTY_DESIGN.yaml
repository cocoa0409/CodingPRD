  # ===========================================================================
  # Rule 6: Boundary-precision checks on different metrics/endpoints
  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: budget_exact_boundary
        grounds:
          - validations[priority=17]
          - errors[ERR_BUDGET_EXCEEDED]
          - entities.Program.fields.committed_cents
        distinguishing_aspect: |
          Numeric threshold boundary: approval succeeds when committed + provisional ==
          budget_cents (<=) but fails when committed + provisional == budget_cents + 1.
          Tested at exact integer cents boundary on POST /efficiency/projects/{id}/approve.
        test_recipe:
          setup:
            - "Program with budget exactly equal to provisional incentive (e.g. budget_cents=2500, project savings=100 kWh → tier1*25 = 2500)"
          setup_api_calls:
            - call: "POST /efficiency/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramManager
            - call: "POST /efficiency/programs"
              payload: { code: "P-B", name: "B", sector: "RESIDENTIAL", budget_cents: 2500, avoided_kwh_target: 100, trc_threshold: 1.0 }
              as: ProgramManager
              captures: { prog_id: $.data.id, prog_v0: $.data.version }
            - call: "POST /efficiency/programs/${prog_id}/activate"
