              captures: { pat_id: $.data.id }
            - call: "POST /patients/${pat_id}/panels"
              payload: { panel_name: "Rbac", control_wheal_mm: 3 }
              as: Allergist
              captures: { panel_id: $.data.id }
            - call: "POST /patients/${pat_id}/panels/${panel_id}/tests"
              payload: { allergen_code: "OAK", method: "SKIN", wheal_mm: 7, clinically_relevant: true }
              as: Allergist
          trigger:
            - call: "POST /patients/${pat_id}/panels/${panel_id}/finalize"
              payload: {}
              as: Nurse
              captures: { err: $.data.error_id }
          assert:
            - "Response status 403 with data.error_id == ERR_FORBIDDEN"

      - name: biller_cannot_mix_vial_forbidden
        claim_type: role_denied
        grounds:
          - roles
          - "validations[priority=2]"
          - "errors[ERR_FORBIDDEN]"
        distinguishing_aspect: "A Biller calling POST /immunotherapy-plans/{id}/vials (Pharmacist-exclusive) returns 403 ERR_FORBIDDEN."
        test_recipe:
          setup: ["A DRAFT plan and an AVAILABLE RED lot."]
          setup_api_calls:
            - call: "POST /patients"
              payload: { full_name: "Yul Wren", date_of_birth: "1990-01-01" }
              as: FrontDesk
              captures: { pat_id: $.data.id }
            - call: "POST /patients/${pat_id}/panels"
              payload: { panel_name: "VialRbac", control_wheal_mm: 3 }
              as: Allergist
              captures: { panel_id: $.data.id }
            - call: "POST /patients/${pat_id}/panels/${panel_id}/tests"
              payload: { allergen_code: "DUST", method: "SKIN", wheal_mm: 6, clinically_relevant: true }
              as: Allergist
            - call: "POST /patients/${pat_id}/panels/${panel_id}/finalize"
              payload: {}
              as: Allergist
            - call: "POST /immunotherapy-plans"
              payload: { patient_id: "${pat_id}", panel_id: "${panel_id}" }
              as: Allergist
              captures: { plan_id: $.data.id, plan_v0: $.data.version }
            - call: "POST /serum-lots"
              payload: { vial_color: "RED", lot_number: "RED-RB", concentrate_potency_pnu_per_ml: 10000, received_at_iso: "2026-01-01T00:00:00Z" }
              as: Pharmacist
              captures: { lot_id: $.data.id }
          trigger:
            - call: "POST /immunotherapy-plans/${plan_id}/vials"
              payload: { lot_id: "${lot_id}", prepared_volume_ml: 5.0, expected_plan_version: "${plan_v0}" }
              as: Biller
              captures: { err: $.data.error_id }
          assert:
            - "Response status 403 with data.error_id == ERR_FORBIDDEN"

      - name: missing_auth_headers_returns_401
        claim_type: role_denied
        grounds:
          - "validations[priority=1]"
          - "errors[ERR_UNAUTHENTICATED]"
        distinguishing_aspect: "A request with no/invalid X-User-Role header returns 401 ERR_UNAUTHENTICATED before any authorization check."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /patients"
              payload: {}
              as: Anonymous
              captures: { err: $.data.error_id }
          trigger_note: "as: Anonymous denotes the absence of valid auth headers; the negative-name suffix _returns_401 marks this a negative test (lint (b)/(c) skipped)."
          assert:
            - "Response status 401 with data.error_id == ERR_UNAUTHENTICATED"

  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_stale_plan_version_on_vial_mix
        claim_type: optimistic_concurrency
        grounds:
          - "concurrency_rules[vial-mix-stale-plan]"
          - "errors[ERR_STALE_PLAN_VERSION]"
        distinguishing_aspect: "After one vial mix advances ImmunotherapyPlan.version, a second mix carrying the pre-mix expected_plan_version (${plan_v0}) is rejected 412 ERR_STALE_PLAN_VERSION."
        test_recipe:
          setup: ["A DRAFT plan with version observed as plan_v0, and one AVAILABLE RED lot; first mix succeeds and bumps the version."]
          setup_api_calls:
            - call: "POST /patients"
              payload: { full_name: "Zoe Yang", date_of_birth: "1990-01-01" }
              as: FrontDesk
              captures: { pat_id: $.data.id }
            - call: "POST /patients/${pat_id}/panels"
              payload: { panel_name: "Occ", control_wheal_mm: 3 }
              as: Allergist
              captures: { panel_id: $.data.id }
            - call: "POST /patients/${pat_id}/panels/${panel_id}/tests"
              payload: { allergen_code: "DUST", method: "SKIN", wheal_mm: 6, clinically_relevant: true }
              as: Allergist
            - call: "POST /patients/${pat_id}/panels/${panel_id}/finalize"
              payload: {}
              as: Allergist
            - call: "POST /immunotherapy-plans"
              payload: { patient_id: "${pat_id}", panel_id: "${panel_id}" }
              as: Allergist
              captures: { plan_id: $.data.id, plan_v0: $.data.version }
            - call: "POST /serum-lots"
              payload: { vial_color: "RED", lot_number: "RED-OCC1", concentrate_potency_pnu_per_ml: 10000, received_at_iso: "2026-01-01T00:00:00Z" }
              as: Pharmacist
              captures: { lot_id: $.data.id }
            - call: "POST /immunotherapy-plans/${plan_id}/vials"
              payload: { lot_id: "${lot_id}", prepared_volume_ml: 5.0, expected_plan_version: "${plan_v0}" }
              as: Pharmacist
              captures: { vial1_id: $.data.id, plan_v1: $.data.version }
          trigger:
            - call: "POST /immunotherapy-plans/${plan_id}/vials"
              payload: { lot_id: "${lot_id}", prepared_volume_ml: 5.0, expected_plan_version: "${plan_v0}" }
              as: Pharmacist
              captures: { err: $.data.error_id }
          assert:
            - "Response status 412 with data.error_id == ERR_STALE_PLAN_VERSION (second mix carries stale ${plan_v0}; the plan is now at ${plan_v1})"

      - name: occ_stale_plan_version_on_shot_visit
        claim_type: optimistic_concurrency
        grounds:
          - "concurrency_rules[shot-visit-stale-plan]"
          - "errors[ERR_STALE_PLAN_VERSION]"
        distinguishing_aspect: "After a shot-visit administration advances ImmunotherapyPlan.version, a second shot-visit carrying the pre-administration version is rejected 412 ERR_STALE_PLAN_VERSION."
        test_recipe:
          setup: ["An ACTIVE RED-start plan; one shot administered (advances version to plan_v3). The client still holds plan_v2."]
          setup_api_calls:
            - call: "POST /patients"
              payload: { full_name: "Abe Zoll", date_of_birth: "1990-01-01", epinephrine_on_file: true }
              as: FrontDesk
              captures: { pat_id: $.data.id }
            - call: "POST /patients/${pat_id}/panels"
              payload: { panel_name: "Occ2", control_wheal_mm: 3 }
              as: Allergist
              captures: { panel_id: $.data.id }
            - call: "POST /patients/${pat_id}/panels/${panel_id}/tests"
              payload: { allergen_code: "DUST", method: "SKIN", wheal_mm: 6, clinically_relevant: true }
              as: Allergist
            - call: "POST /patients/${pat_id}/panels/${panel_id}/finalize"
              payload: {}
              as: Allergist
            - call: "POST /immunotherapy-plans"
              payload: { patient_id: "${pat_id}", panel_id: "${panel_id}" }
              as: Allergist
              captures: { plan_id: $.data.id, plan_v0: $.data.version }
            - call: "POST /serum-lots"
              payload: { vial_color: "RED", lot_number: "RED-OCC2", concentrate_potency_pnu_per_ml: 10000, received_at_iso: "2026-01-01T00:00:00Z" }
              as: Pharmacist
              captures: { lot_id: $.data.id }
            - call: "POST /immunotherapy-plans/${plan_id}/vials"
              payload: { lot_id: "${lot_id}", prepared_volume_ml: 5.0, expected_plan_version: "${plan_v0}" }
              as: Pharmacist
              captures: { vial_id: $.data.id, plan_v1: $.data.version }
            - call: "POST /immunotherapy-plans/${plan_id}/activate"
              payload: {}
              as: Allergist
              captures: { plan_v2: $.data.version }
            - call: "POST /immunotherapy-plans/${plan_id}/shot-visits"
              payload: { vial_id: "${vial_id}", expected_plan_version: "${plan_v2}" }
              as: Nurse
              captures: { v1_id: $.data.id, plan_v3: $.data.version }
          trigger:
            - call: "POST /immunotherapy-plans/${plan_id}/shot-visits"
              payload: { vial_id: "${vial_id}", expected_plan_version: "${plan_v2}" }
              as: Nurse
              captures: { err: $.data.error_id }
          assert:
            - "Response status 412 with data.error_id == ERR_STALE_PLAN_VERSION (second shot carries stale ${plan_v2}; the plan is now at ${plan_v3})"

      - name: shot_visit_version_increments_on_each_write
        claim_type: optimistic_concurrency
        grounds:
          - "concurrency_rules[shot-visit-stale-plan]"
          - entities.ImmunotherapyPlan.fields.status
        distinguishing_aspect: "Each OCC-guarded write (mix, activate, shot) increments ImmunotherapyPlan.version by exactly 1; plan_v1 == plan_v0 + 1 and plan_v2 == plan_v1 + 1."
        excluded_because:
          difficulty_instance: dual_variant_calc / billing_95165_provisional_vs_final_diverge
          rationale: "Version-increment-per-write is implicitly exercised by every §1.8 chain that threads ${plan_v0}->${plan_v1}->${plan_v2}->${plan_v3} OCC captures; the named instance does so explicitly."

      - name: lot_recall_cascade_excluded
        claim_type: cascading_side_effects
        grounds:
          - state_machines.SerumLot.AVAILABLE_to_RECALLED
        distinguishing_aspect: "Lot recall cascades to vials, billing, and plan hold."
        excluded_because:
          difficulty_instance: transitive_cascade / lot_recall_cascade_depth_three
          rationale: "The full recall cascade is the named §1.8 depth-3 instance."

      - name: clock_advance_auto_expires_vial
        claim_type: scheduled_actions
        grounds:
          - state_machines.SerumVial.IN_USE_to_EXPIRED
          - endpoints
        distinguishing_aspect: "Advancing the clock past a GREEN vial's BUD (mixed 2026-01-01, shelf 30 -> BUD 2026-01-31) returns the vial id in expired_vial_ids and flips it to EXPIRED."
        test_recipe:
          setup: ["A GREEN vial mixed at 2026-01-01 onto an ACTIVE plan (GREEN-start, HIGH tier)."]
          setup_api_calls:
            - call: "POST /patients"
              payload: { full_name: "Bo Crick", date_of_birth: "1990-01-01", epinephrine_on_file: true }
              as: FrontDesk
              captures: { pat_id: $.data.id }
            - call: "POST /patients/${pat_id}/panels"
              payload: { panel_name: "GreenExp", control_wheal_mm: 3 }
              as: Allergist
              captures: { panel_id: $.data.id }
            - call: "POST /patients/${pat_id}/panels/${panel_id}/tests"
              payload: { allergen_code: "OAK", method: "SKIN", wheal_mm: 10, clinically_relevant: true }
              as: Allergist
            - call: "POST /patients/${pat_id}/panels/${panel_id}/finalize"
              payload: {}
              as: Allergist
              captures: { tier: $.data.recommended_tier }
            - call: "POST /immunotherapy-plans"
              payload: { patient_id: "${pat_id}", panel_id: "${panel_id}" }
              as: Allergist
              captures: { plan_id: $.data.id, plan_v0: $.data.version, start_color: $.data.starting_vial_color }
            - call: "POST /serum-lots"
              payload: { vial_color: "GREEN", lot_number: "GRN-EXP", concentrate_potency_pnu_per_ml: 10000, received_at_iso: "2026-01-01T00:00:00Z" }
              as: Pharmacist
              captures: { lot_id: $.data.id }
            - call: "POST /immunotherapy-plans/${plan_id}/vials"
              payload: { lot_id: "${lot_id}", prepared_volume_ml: 5.0, expected_plan_version: "${plan_v0}" }
              as: Pharmacist
              captures: { vial_id: $.data.id, plan_v1: $.data.version }
            - call: "POST /immunotherapy-plans/${plan_id}/activate"
              payload: {}
              as: Allergist
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-31T00:00:00Z" }
              as: Pharmacist
              captures: { expired: $.data.expired_vial_ids }
            - call: "GET /serum-vials/${vial_id}"
              payload: {}
              as: Pharmacist
              captures: { st: $.data.status }
          assert:
            - "ImmunotherapyPlan.${plan_id}.starting_vial_color == GREEN"
            - "SerumVial.${vial_id}.status == EXPIRED (clock 2026-01-31 >= BUD 2026-01-31, GREEN shelf 30 days)"

      - name: derived_field_remaining_volume_reconciled_on_draw
        claim_type: derived_field_reconciliation
        grounds:
          - entities.SerumVial.fields.remaining_volume_ml
        distinguishing_aspect: "remaining_volume_ml is reconciled at administration (debited by administered_volume_ml) and is correct on subsequent read."
        excluded_because:
          difficulty_instance: compensating_invariant / vial_volume_conserved_under_draw_and_discard
          rationale: "remaining_volume_ml reconciliation is asserted as the conserved quantity of the named §1.8 invariant."

  # ===========================================================================
  - section: consistency_model
    instances:
      - name: immediate_consistency_composites_visible_on_create
        claim_type: immediate
        grounds:
          - calculations.panel_sensitization_score
          - entities.DiagnosticPanel.fields.clinical_composite
        distinguishing_aspect: "Panel composites are recomputed and visible in the SAME response that adds a test (immediate consistency): adding a SKIN wheal 6 (index 3) shows clinical_composite 3.0 on the panel read issued immediately after."
        test_recipe:
          setup: ["An OPEN panel with no tests."]
          setup_api_calls:
            - call: "POST /patients"
              payload: { full_name: "Cy Dunn", date_of_birth: "1990-01-01" }
              as: FrontDesk
              captures: { pat_id: $.data.id }
            - call: "POST /patients/${pat_id}/panels"
              payload: { panel_name: "Imm", control_wheal_mm: 3 }
              as: Allergist
              captures: { panel_id: $.data.id }
            - call: "POST /patients/${pat_id}/panels/${panel_id}/tests"
              payload: { allergen_code: "DUST", method: "SKIN", wheal_mm: 6, clinically_relevant: true }
              as: Allergist
          trigger:
            - call: "GET /panels/${panel_id}"
              payload: {}
              as: Allergist
              captures: { clin: $.data.clinical_composite, scr: $.data.screening_composite }
          assert:
            - "DiagnosticPanel.${panel_id}.clinical_composite == 3.0"
            - "DiagnosticPanel.${panel_id}.screening_composite == 3.0"
