# =============================================================================
# SCAFFOLD — Automatic Portability & Small-Balance Force-Out (safe harbor IRA provider)
# §1.0–§1.7 only. Difficulty design and corner design live in sibling files.
# =============================================================================

scenario: |
  1997. Automatic Portability & Small-Balance Force-Out (safe harbor IRA provider): balance
  thresholds & force-out eligibility determination, safe harbor IRA establishment for
  non-responders, participant notice & election window, match & transfer to new employer plan
  when found, fee disclosure & default investment, unclaimed/uncashed check remediation,
  recordkeeper network participation, fiduciary review of process

domain_name: automatic-portability-force-out
api_prefix: ""

# =============================================================================
# Complexity Profile (§0.1–§0.4)
# =============================================================================
complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: workflow_orchestration
  complexity_layers:
    - optimistic_concurrency        # OCC on Plan config PATCH and on Election supersede
    - cascading_side_effects        # recordkeeper-exit cascade; check-escheat cascade
    - dual_variant_calculation      # valuation basis; fee day-count conventions
    - rate_threshold_triggers       # force-out balance bands; match-score bands; windows
  entity_topology: flat             # peer collections joined by FK references only
  state_machine_shape: cyclic       # NOTIFIED<->IDENTIFIED, OPEN<->MATCHED, EXECUTED<->RECON_EXCEPTION, ACTIVE<->SUSPENDED
  relationship_patterns:
    - one_to_many
    - self_referential              # Check.supersedes_check_id (reissue chain)
    - cross_aggregate               # cases/matches/transfers reference across aggregates
  role_model: segregation_of_duties # batch executor may not fiduciarily review that batch
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table (13 entities; flat topology)
# All datetimes are ISO 8601 UTC with three fractional digits.
# All money is integer cents; all rates are decimal fractions.
# =============================================================================
entities:
  - name: Recordkeeper
    parent: null
    common_fields: true
    fields:
      - { name: recordkeeper_code, type: string, source: input, description: "Unique recordkeeper code", constraints: "unique across Recordkeeper" }
      - { name: legal_name, type: string, source: input, description: "Legal entity name of the recordkeeper" }
      - { name: network_status, type: enum, source: system, description: "PENDING_ONBOARD | ACTIVE | SUSPENDED | EXITED", default: PENDING_ONBOARD }
      - { name: exited_at, type: datetime, source: system, description: "Set when network_status becomes EXITED; null otherwise", default: null }

  - name: Plan
    parent: null
    common_fields: true
    fields:
      - { name: plan_name, type: string, source: input, description: "Employer plan display name" }
      - { name: sponsor_ein, type: string, source: input, description: "Plan sponsor EIN" }
      - { name: recordkeeper_id, type: string, source: input, description: "FK -> Recordkeeper.id; the plan's recordkeeper" }
      - { name: cash_out_threshold_cents, type: integer, source: input, description: "Balances <= this may be cashed out without consent", default: 100000, constraints: "1..rollover_threshold_cents" }
      - { name: rollover_threshold_cents, type: integer, source: input, description: "Balances > this may not be forced out", default: 700000, constraints: ">= cash_out_threshold_cents" }
      - { name: state_withholding_rate, type: number, source: input, description: "State income-tax withholding rate applied to cash distributions", default: 0, constraints: "0 <= r <= 0.15" }
      - { name: valuation_basis, type: enum, source: input, description: "SEPARATION_DATE | PROCESSING_DATE — selects vested_balance variant at batch lock", default: PROCESSING_DATE }
      - { name: auto_portability_enabled, type: boolean, source: input, description: "Whether this plan's forced-out IRAs enter the match network", default: true }
      - { name: accepts_incoming_transfers, type: boolean, source: input, description: "Whether this plan accepts auto-portability roll-ins", default: true }
      - { name: network_reachable, type: boolean, source: computed, description: "computed: recordkeeper.network_status == ACTIVE AND accepts_incoming_transfers; recomputed on recordkeeper status change and on PATCH" }
      - { name: plan_status, type: enum, source: system, description: "ACTIVE | TERMINATED", default: ACTIVE }

  - name: Participant
    parent: null
    common_fields: true
    fields:
      - { name: ssn_hash, type: string, source: input, description: "Salted hash of SSN; unique across Participant registry", constraints: "unique" }
      - { name: full_name, type: string, source: input, description: "Participant full legal name" }
      - { name: date_of_birth, type: string, source: input, description: "YYYY-MM-DD" }
      - { name: mailing_address_line1, type: string, source: input, description: "Mailing address line 1" }
      - { name: mailing_city, type: string, source: input, description: "Mailing city" }
      - { name: mailing_state, type: string, source: input, description: "Mailing state, 2-letter code" }
      - { name: mailing_zip, type: string, source: input, description: "Mailing ZIP" }
      - { name: email, type: string, source: input, description: "Optional email", default: null }
      - { name: address_quality, type: enum, source: system, description: "UNVERIFIED | VALID | BAD_ADDRESS; VALID after any successful PATCH of address fields; BAD_ADDRESS after a notice BOUNCED or RETURNED_MAIL", default: UNVERIFIED }

  - name: DistributionBatch
    parent: null
    common_fields: true
    fields:
      - { name: plan_id, type: string, source: input, description: "FK -> Plan.id; the source plan being forced out" }
      - { name: batch_status, type: enum, source: system, description: "OPEN | LOCKED | EXECUTED | RECON_EXCEPTION | RECONCILED | REVIEWED", default: OPEN }
      - { name: executed_by_user_id, type: string, source: system, description: "Opaque X-User-ID recorded from the execute call; used for segregation of duties", default: null }
      - { name: locked_at, type: datetime, source: system, default: null, description: "Set at lock" }
      - { name: executed_at, type: datetime, source: system, default: null, description: "Set at execute" }
      - { name: reconciled_at, type: datetime, source: system, default: null, description: "Set at reconcile" }
      - { name: case_count, type: integer, source: computed, description: "Count of DistributionCase rows with distribution_batch_id == this batch" }
      - { name: settled_case_count, type: integer, source: computed, description: "Count of cases in this batch with case_status IN {SETTLED, ESCHEATED, CANCELLED}" }
      - { name: total_forced_out_cents, type: integer, source: computed, description: "Sum of vested_balance_cents over cases in this batch whose executed_path IN {CHECK_CASH_OUT, SAFE_HARBOR_IRA, DIRECT_NEW_PLAN}" }

  - name: DistributionCase
    parent: null
    common_fields: true
    fields:
      - { name: distribution_batch_id, type: string, source: input, description: "FK -> DistributionBatch.id; batch must be OPEN at attach time" }
      - { name: plan_id, type: string, source: input, description: "FK -> Plan.id; must equal the batch's plan_id" }
      - { name: participant_id, type: string, source: input, description: "FK -> Participant.id; separated participant" }
      - { name: separation_date, type: datetime, source: input, description: "Employment separation date" }
      - { name: separation_date_balance_cents, type: integer, source: input, description: "Account balance as of separation_date (feed value)", constraints: ">= 0" }
      - { name: processing_date_balance_cents, type: integer, source: input, description: "Account balance as of batch lock (feed value)", constraints: ">= 0" }
      - { name: vesting_percent, type: integer, source: input, description: "Vested percent applied to the selected balance", default: 100, constraints: "0..100" }
      - { name: quoted_balance_cents, type: integer, source: computed, description: "Provisional balance at creation: round_half_up(separation_date_balance_cents * vesting_percent / 100)" }
      - { name: vested_balance_cents, type: integer, source: computed, description: "Final balance at batch lock per plan.valuation_basis variant; null until lock", default: null }
      - { name: force_out_path, type: enum, source: computed, description: "CASH_OUT | SAFE_HARBOR_IRA | INELIGIBLE_REMAINS; null until lock", default: null }
      - { name: case_status, type: enum, source: system, description: "IDENTIFIED | NOTIFIED | ELECTED | WINDOW_EXPIRED | EXECUTED | SETTLED | ESCHEATED | CANCELLED", default: IDENTIFIED }
      - { name: executed_path, type: enum, source: system, description: "CHECK_CASH_OUT | SAFE_HARBOR_IRA | DIRECT_NEW_PLAN | REMAIN_IN_PLAN; null until executed/settled", default: null }
      - { name: current_notice_id, type: string, source: system, description: "Latest FORCE_OUT_ELECTION notice whose window governs this case; null when none delivered", default: null }

  - name: Notice
    parent: null
    common_fields: true
    fields:
      - { name: distribution_case_id, type: string, source: input, description: "FK -> DistributionCase.id" }
      - { name: notice_type, type: enum, source: input, description: "FORCE_OUT_ELECTION | FEE_DISCLOSURE | AUTO_PORTABILITY_PRENOTICE | ESCHEAT_WARNING" }
      - { name: delivery_status, type: enum, source: system, description: "SENT | DELIVERED | BOUNCED | RETURNED_MAIL", default: SENT }
      - { name: sent_at, type: datetime, source: system, description: "Set at creation from logical clock" }
      - { name: delivered_at, type: datetime, source: system, description: "Set on record-delivery DELIVERED; null otherwise", default: null }
      - { name: response_deadline, type: datetime, source: computed, description: "delivered_at + 30 days (inclusive); null until delivered", default: null }

  - name: Election
    parent: null
    common_fields: true
    fields:
      - { name: distribution_case_id, type: string, source: input, description: "FK -> DistributionCase.id" }
      - { name: participant_id, type: string, source: system, description: "FK -> Participant.id; copied from the case" }
      - { name: election_type, type: enum, source: input, description: "LUMP_SUM_CASH | SAFE_HARBOR_IRA | DIRECT_ROLLOVER_NEW_PLAN" }
      - { name: destination_plan_id, type: string, source: input, description: "FK -> Plan.id; required iff election_type == DIRECT_ROLLOVER_NEW_PLAN, else must be null", default: null }
      - { name: election_status, type: enum, source: system, description: "SUBMITTED | SUPERSEDED | EXECUTED | VOIDED", default: SUBMITTED }
      - { name: submitted_at, type: datetime, source: system, description: "Set at creation from logical clock" }

  - name: SafeHarborIRA
    parent: null
    common_fields: true
    fields:
      - { name: distribution_case_id, type: string, source: input, description: "FK -> DistributionCase.id; the case this IRA satisfies" }
      - { name: participant_id, type: string, source: system, description: "FK -> Participant.id; copied from the case" }
      - { name: ira_origin, type: enum, source: system, description: "AUTO_FORCE_OUT | ELECTED" }
      - { name: ira_status, type: enum, source: system, description: "OPEN | MATCHED | TRANSFER_PENDING | TRANSFERRED_OUT | CLOSED_BY_PARTICIPANT | ESCHEATED", default: OPEN }
      - { name: funded_amount_cents, type: integer, source: system, description: "Initial rollover amount = case.vested_balance_cents at establishment" }
      - { name: balance_cents, type: integer, source: computed, description: "funded - total_fees - total_transferred_out - in_flight; maintained on every money event" }
      - { name: in_flight_cents, type: integer, source: computed, description: "Amounts in non-terminal (SENT) transfers", default: 0 }
      - { name: total_fees_cents, type: integer, source: computed, description: "Sum of posted IRAFeeAssessment.amount_cents", default: 0 }
      - { name: total_transferred_out_cents, type: integer, source: computed, description: "Sum of RECONCILED transfer amounts", default: 0 }
      - { name: fee_day_count_convention, type: enum, source: input, description: "ACTUAL_365 | THIRTY_360", default: ACTUAL_365 }
      - { name: default_investment, type: enum, source: system, description: "MONEY_MARKET_FDIC_INSURED — principal-preservation default, never changes", default: MONEY_MARKET_FDIC_INSURED }
      - { name: last_fee_assessed_at, type: datetime, source: system, description: "Period anchor for next fee accrual; null until first assessment", default: null }
      - { name: last_activity_at, type: datetime, source: system, description: "Updated on every balance-changing event; drives escheat dormancy" }
      - { name: opened_at, type: datetime, source: system, description: "Set at establishment" }

  - name: IRAFeeAssessment
    parent: null
    common_fields: false
    fields:
      - { name: safe_harbor_ira_id, type: string, source: system, description: "FK -> SafeHarborIRA.id" }
      - { name: period_start, type: datetime, source: system, description: "Accrual period start (exclusive anchor: opened_at or last_fee_assessed_at)" }
      - { name: period_end, type: datetime, source: system, description: "Accrual period end = logical clock at assessment" }
      - { name: days_in_period, type: integer, source: system, description: "Day count per the IRA's day-count convention" }
      - { name: day_count_convention, type: enum, source: system, description: "ACTUAL_365 | THIRTY_360; copied from the IRA" }
      - { name: amount_cents, type: integer, source: computed, description: "min(computed fee, balance_cents at assessment); never drives balance negative" }

  - name: Check
    parent: null
    common_fields: true
    fields:
      - { name: distribution_case_id, type: string, source: system, description: "FK -> DistributionCase.id" }
      - { name: supersedes_check_id, type: string, source: input, description: "FK -> Check.id; set on reissue, links to the VOIDED predecessor; null on first issue", default: null }
      - { name: origin, type: enum, source: system, description: "CASE_CASH_OUT | IRA_CLOSE" }
      - { name: gross_amount_cents, type: integer, source: system, description: "Pre-withholding amount (vested balance, or IRA balance at close)" }
      - { name: fed_withholding_cents, type: integer, source: system, description: "round_half_up(gross * 0.20) for CASE_CASH_OUT; 0 for IRA_CLOSE" }
      - { name: state_withholding_cents, type: integer, source: system, description: "round_half_up(gross * plan.state_withholding_rate) for CASE_CASH_OUT; 0 for IRA_CLOSE" }
      - { name: amount_cents, type: integer, source: computed, description: "net payable = gross - fed_withholding - state_withholding (per-component rounding pinned by calc net_check_withholding)" }
      - { name: check_status, type: enum, source: system, description: "ISSUED | CASHED | STALE_DATED | VOIDED", default: ISSUED }
      - { name: issued_at, type: datetime, source: system, description: "Set at issuance" }
      - { name: stale_after, type: datetime, source: computed, description: "issued_at + 180 days (exclusive: stale when now > stale_after)" }
      - { name: cashed_at, type: datetime, source: system, default: null, description: "Set on record-cashed" }
      - { name: voided_at, type: datetime, source: system, default: null, description: "Set on void" }
      - { name: void_reason, type: enum, source: input, description: "DAMAGED | STALE | ESCHEATMENT; null until voided", default: null }

  - name: MatchCandidate
    parent: null
    common_fields: true
    fields:
      - { name: safe_harbor_ira_id, type: string, source: system, description: "FK -> SafeHarborIRA.id" }
      - { name: participant_id, type: string, source: system, description: "FK -> Participant.id; copied from the IRA" }
      - { name: new_plan_id, type: string, source: input, description: "FK -> Plan.id; candidate new-employer plan" }
      - { name: new_recordkeeper_id, type: string, source: input, description: "FK -> Recordkeeper.id; must equal new_plan.recordkeeper_id" }
      - { name: employment_start_date, type: string, source: input, description: "YYYY-MM-DD new-employer start date from the network feed" }
      - { name: ssn_exact, type: boolean, source: input, description: "Feed flag: SSN matched exactly" }
      - { name: name_similarity, type: number, source: input, description: "Feed score 0..1, two-decimal granularity", constraints: "0 <= x <= 1" }
      - { name: dob_match, type: boolean, source: input, description: "Feed flag: date of birth matched" }
      - { name: match_score, type: number, source: computed, description: "round_half_up(0.55*ssn_exact + 0.30*name_similarity + 0.15*dob_match, 3 decimals)" }
      - { name: match_status, type: enum, source: system, description: "CANDIDATE | CONFIRMED | REJECTED | EXPIRED | EXECUTED" }

  - name: Transfer
    parent: null
    common_fields: true
    fields:
      - { name: safe_harbor_ira_id, type: string, source: system, description: "FK -> SafeHarborIRA.id" }
      - { name: match_candidate_id, type: string, source: input, description: "FK -> MatchCandidate.id; must be the IRA's unique CONFIRMED match" }
      - { name: amount_cents, type: integer, source: computed, description: "balance_cents - accrued unbilled fee at initiation (calc transfer_available_amount)" }
      - { name: accrued_fee_offset_cents, type: integer, source: system, description: "The accrued unbilled fee withheld from the transfer at initiation" }
      - { name: transfer_status, type: enum, source: system, description: "SENT | RECONCILED | RETURNED", default: SENT }
      - { name: sent_at, type: datetime, source: system, description: "Set at initiation" }
      - { name: settled_at, type: datetime, source: system, default: null, description: "Set on record-response" }
      - { name: rejection_reason, type: string, source: input, description: "Required when record-response outcome is REJECTED; null otherwise", default: null }

  - name: FiduciaryReview
    parent: null
    common_fields: true
    fields:
      - { name: distribution_batch_id, type: string, source: input, description: "FK -> DistributionBatch.id; batch must be RECONCILED" }
      - { name: plan_id, type: string, source: system, description: "FK -> Plan.id; copied from the batch" }
      - { name: period_start, type: datetime, source: input, description: "Review coverage start (inclusive)" }
      - { name: period_end, type: datetime, source: input, description: "Review coverage end (exclusive); must be > period_start" }
      - { name: reviewer_user_id, type: string, source: system, description: "Opaque X-User-ID of the FiduciaryReviewer; must differ from batch.executed_by_user_id" }
      - { name: review_status, type: enum, source: system, description: "OPEN | REMEDIATION_OPEN | CLOSED", default: OPEN }
      - { name: findings_count, type: integer, source: system, description: "Number of findings recorded", default: 0 }
      - { name: attested_at, type: datetime, source: system, default: null, description: "Set at attestation (transition to CLOSED)" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Recordkeeper
    field: network_status
    initial_state: PENDING_ONBOARD
    terminal_states: [EXITED]
    transitions:
      - from: PENDING_ONBOARD
        to: ACTIVE
        trigger: "POST /recordkeepers/{id}/activate"
        actor: ProviderOps
        preconditions: ["recordkeeper PENDING_ONBOARD"]
        side_effects:
          - "Recomputes network_reachable = true for every Plan with recordkeeper_id == this id and accepts_incoming_transfers == true; increments those Plan.version values"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /recordkeepers/{id}/suspend"
        actor: ProviderOps
        preconditions: ["recordkeeper ACTIVE"]
        side_effects:
          - "Recomputes network_reachable = false for every Plan with recordkeeper_id == this id"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /recordkeepers/{id}/activate"
        actor: ProviderOps
        preconditions: ["recordkeeper SUSPENDED"]
        side_effects:
          - "Recomputes network_reachable = true for every Plan with recordkeeper_id == this id and accepts_incoming_transfers == true"
      - from: [ACTIVE, SUSPENDED]
        to: EXITED
        trigger: "POST /recordkeepers/{id}/exit"
        actor: ProviderOps
        preconditions: ["recordkeeper ACTIVE or SUSPENDED"]
        side_effects:
          - "Link 1: every Plan with recordkeeper_id == this id gets network_reachable recomputed to false"
          - "Link 2 (caused by link 1): every MatchCandidate with match_status IN {CANDIDATE, CONFIRMED} whose new_plan.network_reachable flipped to false transitions to EXPIRED"
          - "Link 3 (caused by link 2): every SafeHarborIRA in MATCHED whose CONFIRMED match just expired returns to OPEN; last_activity_at unchanged"
          - "Sets exited_at on the recordkeeper"

  - entity: Plan
    field: plan_status
    initial_state: ACTIVE
    terminal_states: [TERMINATED]
    transitions:
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /plans/{id}/terminate"
        actor: PlanSponsor
        preconditions:
          - "No DistributionBatch with plan_id == this id and batch_status IN {OPEN, LOCKED, EXECUTED, RECON_EXCEPTION}"
        side_effects:
          - "network_reachable recomputed to false (plan no longer accepts or sources activity)"

  - entity: DistributionBatch
    field: batch_status
    initial_state: OPEN
    terminal_states: [REVIEWED]
    transitions:
      - from: OPEN
        to: LOCKED
        trigger: "POST /distribution-batches/{id}/lock"
        actor: PlanSponsor
        preconditions: ["batch OPEN", "case_count >= 1"]
        side_effects:
          - "For each attached case: computes vested_balance_cents via vested_balance_determination (variant per plan.valuation_basis) and force_out_path via force_out_path_selection"
          - "Cases whose force_out_path == INELIGIBLE_REMAINS move IDENTIFIED -> SETTLED with executed_path REMAIN_IN_PLAN (no notice, no money movement)"
          - "Sets locked_at; recomputes case_count, settled_case_count, total_forced_out_cents"
      - from: LOCKED
        to: EXECUTED
        trigger: "POST /distribution-batches/{id}/execute"
        actor: ProviderOps
        preconditions:
          - "No attached case in IDENTIFIED (ERR_CASE_NOTICE_OUTSTANDING)"
          - "No attached case in NOTIFIED whose current notice response_deadline >= now (ERR_CASE_WINDOW_STILL_OPEN)"
        side_effects:
          - "executed_by_user_id := X-User-ID of the caller; executed_at := now"
      - from: EXECUTED
        to: RECONCILED
        trigger: "POST /distribution-batches/{id}/reconcile"
        actor: ProviderOps
        preconditions:
          - "Every attached case has case_status IN {SETTLED, ESCHEATED, CANCELLED}"
        side_effects: ["Sets reconciled_at"]
      - from: EXECUTED
        to: RECON_EXCEPTION
        trigger: "POST /distribution-batches/{id}/reconcile"
        actor: ProviderOps
        preconditions:
          - "At least one attached case still in EXECUTED (uncashed check outstanding)"
        side_effects: ["No case changes; exception state records that money movement is unsettled"]
      - from: RECON_EXCEPTION
        to: EXECUTED
        trigger: "POST /distribution-batches/{id}/resume"
        actor: ProviderOps
        preconditions: ["batch RECON_EXCEPTION"]
        side_effects: ["Recomputes case_count, settled_case_count, total_forced_out_cents"]
      - from: RECONCILED
        to: REVIEWED
        trigger: "system (a FiduciaryReview for this batch attests)"
        actor: system
        preconditions: ["An attested FiduciaryReview with distribution_batch_id == this batch exists"]
        side_effects: []

  - entity: DistributionCase
    field: case_status
    initial_state: IDENTIFIED
    terminal_states: [SETTLED, ESCHEATED, CANCELLED]
    transitions:
      - from: IDENTIFIED
        to: NOTIFIED
        trigger: "POST /notices/{id}/record-delivery outcome=DELIVERED on a FORCE_OUT_ELECTION notice of this case"
        actor: ProviderOps
        preconditions: ["case IDENTIFIED", "notice is FORCE_OUT_ELECTION for this case", "batch LOCKED"]
        side_effects:
          - "case.current_notice_id := that notice; notice.response_deadline computed (delivered_at + 30 days, inclusive)"
      - from: NOTIFIED
        to: IDENTIFIED
        trigger: "POST /notices/{id}/record-delivery outcome=RETURNED_MAIL on the case's current_notice_id"
        actor: ProviderOps
        preconditions: ["case NOTIFIED", "notice id == case.current_notice_id"]
        side_effects:
          - "case.current_notice_id := null"
          - "participant.address_quality := BAD_ADDRESS (cycle: re-notice requires an address PATCH then a fresh notice)"
      - from: NOTIFIED
        to: ELECTED
        trigger: "POST /distribution-cases/{id}/elections"
        actor: Participant
        preconditions:
          - "case NOTIFIED"
          - "now <= response_deadline of case.current_notice_id (ERR_ELECTION_WINDOW_CLOSED)"
          - "X-User-ID == case.participant_id (ownership)"
          - "expected_case_version == case.version (OCC)"
        side_effects:
          - "Any prior Election of this case in SUBMITTED transitions to SUPERSEDED"
          - "increments DistributionCase.version by 1"
      - from: ELECTED
        to: ELECTED
        trigger: "POST /distribution-cases/{id}/elections (re-election supersedes)"
        actor: Participant
        preconditions: ["same as NOTIFIED -> ELECTED; window still open on current notice"]
        side_effects:
          - "Prior SUBMITTED election -> SUPERSEDED; new election SUBMITTED; increments case.version"
      - from: ELECTED
        to: NOTIFIED
        trigger: "POST /elections/{id}/void on the case's only SUBMITTED election"
        actor: Participant
        preconditions: ["election SUBMITTED", "now <= response_deadline of case.current_notice_id", "X-User-ID == election.participant_id"]
        side_effects: ["election -> VOIDED; case returns to NOTIFIED with window intact"]
      - from: NOTIFIED
        to: WINDOW_EXPIRED
        trigger: "system (POST /sweeps/run finds now > response_deadline of current notice, no SUBMITTED election)"
        actor: system
        preconditions: ["case NOTIFIED", "now > response_deadline"]
        side_effects: []
      - from: ELECTED
        to: EXECUTED
        trigger: "POST /checks with distribution_case_id == this case (election LUMP_SUM_CASH)"
        actor: ProviderOps
        preconditions:
          - "case ELECTED and its SUBMITTED election.election_type == LUMP_SUM_CASH"
          - "batch EXECUTED or RECON_EXCEPTION"
        side_effects:
          - "Check created (origin CASE_CASH_OUT) via net_check_withholding; election -> EXECUTED"
          - "case.executed_path := CHECK_CASH_OUT; batch.total_forced_out_cents recomputed (+vested_balance_cents); increments case.version"
      - from: WINDOW_EXPIRED
        to: EXECUTED
        trigger: "POST /checks with distribution_case_id == this case (auto cash-out)"
        actor: ProviderOps
        preconditions:
          - "case WINDOW_EXPIRED and force_out_path == CASH_OUT"
          - "batch EXECUTED or RECON_EXCEPTION"
        side_effects: ["same as ELECTED -> EXECUTED check path"]
      - from: [ELECTED, WINDOW_EXPIRED]
        to: SETTLED
        trigger: "POST /safe-harbor-iras with distribution_case_id == this case"
        actor: ProviderOps
        preconditions:
          - "ELECTED with SUBMITTED election.election_type == SAFE_HARBOR_IRA, OR WINDOW_EXPIRED with force_out_path == SAFE_HARBOR_IRA"
          - "batch EXECUTED or RECON_EXCEPTION"
        side_effects:
          - "SafeHarborIRA created funded with vested_balance_cents (ira_origin ELECTED or AUTO_FORCE_OUT)"
          - "case.executed_path := SAFE_HARBOR_IRA; election (if any) -> EXECUTED; batch totals recomputed; increments case.version"
      - from: ELECTED
        to: SETTLED
        trigger: "POST /distribution-cases/{id}/settle-direct-rollover (election DIRECT_ROLLOVER_NEW_PLAN)"
        actor: ProviderOps
        preconditions:
          - "case ELECTED and SUBMITTED election.election_type == DIRECT_ROLLOVER_NEW_PLAN"
          - "batch EXECUTED or RECON_EXCEPTION"
          - "election.destination_plan.network_reachable == true (ERR_DESTINATION_PLAN_NOT_ACCEPTING)"
        side_effects:
          - "case.executed_path := DIRECT_NEW_PLAN; election -> EXECUTED; batch totals recomputed"
      - from: IDENTIFIED
        to: SETTLED
        trigger: "system (batch lock determines force_out_path == INELIGIBLE_REMAINS)"
        actor: system
        preconditions: ["force_out_path == INELIGIBLE_REMAINS at lock"]
        side_effects: ["case.executed_path := REMAIN_IN_PLAN"]
      - from: EXECUTED
        to: SETTLED
        trigger: "POST /checks/{id}/record-cashed on the case's outstanding check"
        actor: ProviderOps
        preconditions: ["check ISSUED", "now <= check.stale_after (ERR_CHECK_STALE)"]
        side_effects: ["check.cashed_at set; batch settled_case_count recomputed"]
      - from: EXECUTED
        to: ESCHEATED
        trigger: "POST /checks/{id}/void with void_reason=ESCHEATMENT on the case's outstanding check"
        actor: ProviderOps
        preconditions:
          - "check STALE_DATED"
          - "an ESCHEAT_WARNING notice for this case with delivery_status == DELIVERED and delivered_at <= now - 90 days exists (ERR_ESCHEAT_WARNING_REQUIRED)"
        side_effects:
          - "Link 1: check -> VOIDED (voided_at set)"
          - "Link 2 (caused by link 1): case EXECUTED -> ESCHEATED"
          - "Link 3 (caused by link 2): batch settled_case_count and total_forced_out_cents recomputed; batch reconcile eligibility flips"
      - from: [IDENTIFIED, NOTIFIED]
        to: CANCELLED
        trigger: "POST /distribution-cases/{id}/cancel"
        actor: PlanSponsor
        preconditions: ["case IDENTIFIED or NOTIFIED (rehire / census error)"]
        side_effects: ["batch case counters recomputed"]

  - entity: Notice
    field: delivery_status
    initial_state: SENT
    terminal_states: [BOUNCED, RETURNED_MAIL]
    transitions:
      - from: SENT
        to: DELIVERED
        trigger: "POST /notices/{id}/record-delivery outcome=DELIVERED"
        actor: ProviderOps
        preconditions: ["notice SENT"]
        side_effects:
          - "delivered_at := now; response_deadline := delivered_at + 30 days"
          - "if notice_type == FORCE_OUT_ELECTION and case IDENTIFIED: case -> NOTIFIED with current_notice_id set"
      - from: SENT
        to: BOUNCED
        trigger: "POST /notices/{id}/record-delivery outcome=BOUNCED"
        actor: ProviderOps
        preconditions: ["notice SENT"]
        side_effects: ["participant.address_quality := BAD_ADDRESS; case remains IDENTIFIED"]
      - from: [SENT, DELIVERED]
        to: RETURNED_MAIL
        trigger: "POST /notices/{id}/record-delivery outcome=RETURNED_MAIL"
        actor: ProviderOps
        preconditions: ["notice SENT or DELIVERED"]
        side_effects:
          - "participant.address_quality := BAD_ADDRESS"
          - "if notice was the case.current_notice_id (case NOTIFIED): case -> IDENTIFIED and current_notice_id cleared"

  - entity: Election
    field: election_status
    initial_state: SUBMITTED
    terminal_states: [SUPERSEDED, EXECUTED, VOIDED]
    transitions:
      - from: SUBMITTED
        to: SUPERSEDED
        trigger: "system (a newer election is submitted for the same case)"
        actor: system
        preconditions: ["another election for same case reaches SUBMITTED"]
        side_effects: []
      - from: SUBMITTED
        to: EXECUTED
        trigger: "system (case executes per this election)"
        actor: system
        preconditions: []
        side_effects: []
      - from: SUBMITTED
        to: VOIDED
        trigger: "POST /elections/{id}/void"
        actor: Participant
        preconditions: ["election SUBMITTED", "now <= case window deadline", "X-User-ID == election.participant_id"]
        side_effects: ["if this was the case's only SUBMITTED election: case ELECTED -> NOTIFIED"]

  - entity: SafeHarborIRA
    field: ira_status
    initial_state: OPEN
    terminal_states: [TRANSFERRED_OUT, CLOSED_BY_PARTICIPANT, ESCHEATED]
    transitions:
      - from: OPEN
        to: MATCHED
        trigger: "system (a MatchCandidate of this IRA reaches CONFIRMED)"
        actor: system
        preconditions: ["IRA OPEN"]
        side_effects: []
      - from: MATCHED
        to: OPEN
        trigger: "system (the CONFIRMED match EXPIRED via recordkeeper-exit cascade)"
        actor: system
        preconditions: []
        side_effects: ["IRA eligible for a fresh match search"]
      - from: MATCHED
        to: TRANSFER_PENDING
        trigger: "POST /safe-harbor-iras/{id}/transfers"
        actor: ProviderOps
        preconditions:
          - "IRA MATCHED with unique CONFIRMED match"
          - "expected_ira_version == ira.version (stale view rejected ERR_STALE_VERSION)"
          - "AUTO_PORTABILITY_PRENOTICE notice for the case DELIVERED (ERR_PRENOTICE_NOT_DELIVERED) and its response_deadline < now (ERR_PRENOTICE_WINDOW_OPEN)"
          - "match.new_recordkeeper.network_status == ACTIVE (ERR_RECORDKEEPER_NOT_ACTIVE)"
          - "transfer_available_amount > 0 (ERR_INSUFFICIENT_IRA_BALANCE)"
        side_effects:
          - "Transfer created SENT with amount_cents per transfer_available_amount; match CONFIRMED -> EXECUTED"
          - "ira.balance_cents -= amount; ira.in_flight_cents += amount; last_activity_at := now; increments ira.version"
      - from: TRANSFER_PENDING
        to: TRANSFERRED_OUT
        trigger: "POST /transfers/{id}/record-response outcome=ACCEPTED"
        actor: ProviderOps
        preconditions: ["transfer SENT"]
        side_effects:
          - "transfer -> RECONCILED; ira.in_flight_cents -= amount; ira.total_transferred_out_cents += amount; last_activity_at := now"
      - from: TRANSFER_PENDING
        to: OPEN
        trigger: "POST /transfers/{id}/record-response outcome=REJECTED"
        actor: ProviderOps
        preconditions: ["transfer SENT", "rejection_reason provided"]
        side_effects:
          - "Link 1: transfer -> RETURNED"
          - "Link 2 (caused by link 1): ira.in_flight_cents -= amount; ira.balance_cents += amount; ira TRANSFER_PENDING -> OPEN; last_activity_at := now"
          - "Link 3 (caused by link 2): the match EXECUTED -> REJECTED, reopening match search for the reopened IRA"
      - from: [OPEN, MATCHED]
        to: CLOSED_BY_PARTICIPANT
        trigger: "POST /safe-harbor-iras/{id}/close"
        actor: [Participant, ProviderOps]
        preconditions: ["IRA OPEN or MATCHED", "if actor Participant: X-User-ID == ira.participant_id"]
        side_effects:
          - "A Check (origin IRA_CLOSE, no withholding) is created for the full balance_cents; balance_cents -> 0 via in-flight check linkage"
          - "if MATCHED: the CONFIRMED match -> EXPIRED"
      - from: OPEN
        to: ESCHEATED
        trigger: "system (POST /sweeps/run: dormancy and warning conditions met)"
        actor: system
        preconditions:
          - "now - last_activity_at > 1095 days"
          - "an ESCHEAT_WARNING notice for the case DELIVERED with delivered_at <= now - 90 days"
        side_effects: ["Remaining balance_cents escheats to the state; balance_cents -> 0"]

  - entity: Check
    field: check_status
    initial_state: ISSUED
    terminal_states: [CASHED, VOIDED]
    transitions:
      - from: ISSUED
        to: CASHED
        trigger: "POST /checks/{id}/record-cashed"
        actor: ProviderOps
        preconditions: ["check ISSUED", "now <= stale_after (ERR_CHECK_STALE)"]
        side_effects:
          - "cashed_at := now"
          - "if origin == CASE_CASH_OUT: case EXECUTED -> SETTLED; batch settled_case_count recomputed"
      - from: ISSUED
        to: STALE_DATED
        trigger: "system (POST /sweeps/run finds now > stale_after)"
        actor: system
        preconditions: ["check ISSUED", "now > stale_after"]
        side_effects: []
      - from: [ISSUED, STALE_DATED]
        to: VOIDED
        trigger: "POST /checks/{id}/void"
        actor: ProviderOps
        preconditions:
          - "void_reason IN {DAMAGED, STALE, ESCHEATMENT}"
          - "ESCHEATMENT additionally requires: check STALE_DATED; ESCHEAT_WARNING delivered_at <= now - 90 days (ERR_ESCHEAT_WARNING_REQUIRED)"
        side_effects:
          - "voided_at := now"
          - "if void_reason == ESCHEATMENT and origin == CASE_CASH_OUT: case EXECUTED -> ESCHEATED; batch counters recomputed"
      - from: VOIDED
        to: VOIDED
        trigger: "POST /checks/{id}/reissue (spawns a successor Check; this row stays VOIDED)"
        actor: ProviderOps
        preconditions:
          - "check VOIDED with void_reason != ESCHEATMENT"
          - "case still EXECUTED (not ESCHEATED/CANCELLED)"
          - "participant.address_quality != BAD_ADDRESS (ERR_UNDELIVERABLE_ADDRESS); UNVERIFIED is acceptable"
        side_effects:
          - "New Check created ISSUED with supersedes_check_id == this id, identical amount fields, fresh issued_at/stale_after"

  - entity: MatchCandidate
    field: match_status
    initial_state: CANDIDATE
    terminal_states: [REJECTED, EXPIRED]
    transitions:
      - from: CANDIDATE
        to: CONFIRMED
        trigger: "POST /match-candidates/{id}/confirm (manual band) or system auto-confirm at creation (score >= 0.850 with ssn_exact)"
        actor: [ProviderOps, system]
        preconditions:
          - "ssn_exact == true (ERR_SSN_GATE_FAILED, checked first)"
          - "match_score >= CONFIRM_FLOOR 0.650 (ERR_MATCH_SCORE_BELOW_THRESHOLD)"
        side_effects:
          - "IRA OPEN -> MATCHED"
          - "all other CANDIDATE matches of the same IRA -> EXPIRED (keeps CONFIRMED unique per IRA)"
      - from: CANDIDATE
        to: REJECTED
        trigger: "POST /match-candidates/{id}/reject"
        actor: ProviderOps
        preconditions: ["match CANDIDATE"]
        side_effects: []
      - from: CANDIDATE
        to: EXPIRED
        trigger: "system (POST /sweeps/run: age > 90 days; or sibling confirmed; or recordkeeper-exit cascade)"
        actor: system
        preconditions: []
        side_effects: []
      - from: CONFIRMED
        to: EXECUTED
        trigger: "system (transfer initiated against this match)"
        actor: system
        preconditions: []
        side_effects: []
      - from: CONFIRMED
        to: EXPIRED
        trigger: "system (recordkeeper-exit cascade; or IRA closed by participant)"
        actor: system
        preconditions: []
        side_effects: ["if IRA was MATCHED on this match: IRA MATCHED -> OPEN (recordkeeper cascade only)"]
      - from: EXECUTED
        to: REJECTED
        trigger: "system (transfer REJECTED cascade)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: Transfer
    field: transfer_status
    initial_state: SENT
    terminal_states: [RECONCILED, RETURNED]
    transitions:
      - from: SENT
        to: RECONCILED
        trigger: "POST /transfers/{id}/record-response outcome=ACCEPTED"
        actor: ProviderOps
        preconditions: ["transfer SENT"]
        side_effects:
          - "settled_at := now; ira.in_flight_cents -= amount_cents; ira.total_transferred_out_cents += amount_cents; IRA TRANSFER_PENDING -> TRANSFERRED_OUT"
      - from: SENT
        to: RETURNED
        trigger: "POST /transfers/{id}/record-response outcome=REJECTED"
        actor: ProviderOps
        preconditions: ["transfer SENT", "rejection_reason non-empty"]
        side_effects:
          - "settled_at := now; ira balance re-credited (balance += amount, in_flight -= amount); IRA TRANSFER_PENDING -> OPEN; match EXECUTED -> REJECTED"

  - entity: FiduciaryReview
    field: review_status
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: REMEDIATION_OPEN
        trigger: "POST /fiduciary-reviews/{id}/record-finding"
        actor: FiduciaryReviewer
        preconditions: ["review OPEN", "X-User-ID == review.reviewer_user_id"]
        side_effects: ["findings_count += 1"]
      - from: REMEDIATION_OPEN
        to: REMEDIATION_OPEN
        trigger: "POST /fiduciary-reviews/{id}/record-finding (additional finding)"
        actor: FiduciaryReviewer
        preconditions: ["review REMEDIATION_OPEN", "X-User-ID == review.reviewer_user_id"]
        side_effects: ["findings_count += 1"]
      - from: REMEDIATION_OPEN
        to: OPEN
        trigger: "POST /fiduciary-reviews/{id}/verify-remediation"
        actor: FiduciaryReviewer
        preconditions: ["review REMEDIATION_OPEN", "X-User-ID == review.reviewer_user_id"]
        side_effects: ["remediation accepted; findings remain counted for the record"]
      - from: OPEN
        to: CLOSED
        trigger: "POST /fiduciary-reviews/{id}/attest"
        actor: FiduciaryReviewer
        preconditions: ["review OPEN (no unremediated findings)", "X-User-ID == review.reviewer_user_id"]
        side_effects:
          - "attested_at := now"
          - "the reviewed batch RECONCILED -> REVIEWED"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on parent version only)
# =============================================================================
concurrency_rules:
  - rule_id: election-submit-stale-case
    parent_entity: DistributionCase
    write_endpoint: "POST /distribution-cases/{id}/elections"
    occ_field: expected_case_version
    description: |
      Submitting an Election against a DistributionCase whose version has
      advanced since the client last observed it is rejected. A prior election
      submission legitimately supersedes under the re-election transition, so
      a client holding a stale case version must re-read before its election
      is accepted.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: plan-config-stale-update
    parent_entity: Plan
    write_endpoint: "PATCH /plans/{id}"
    occ_field: expected_plan_version
    description: |
      Updating Plan force-out configuration (thresholds, valuation basis,
      withholding rate, portability flags) against a Plan version the client
      has not observed is rejected; the client must re-read the plan and
      re-apply its edits to the current version.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: vested_balance_determination
    trigger: "case creation (provisional quote) and batch lock (final vested balance)"
    algorithm: aggregation
    formula: |
      quoted_balance_cents  = round_half_up(separation_date_balance_cents * vesting_percent / 100)   # at case creation, always
      vested_balance_cents  = round_half_up(selected_balance * vesting_percent / 100)                # at batch lock
      where selected_balance = separation_date_balance_cents if plan.valuation_basis == SEPARATION_DATE
                               else processing_date_balance_cents   # PROCESSING_DATE
    input_set: "the single DistributionCase being locked; both feed balances and vesting_percent are inputs on the case"
    precision: "integer cents, round_half_up"
    variants:
      - name: separation_date_valuation
        when: "plan.valuation_basis == SEPARATION_DATE"
        difference: "uses the balance frozen at separation; ignores market movement between separation and lock"
      - name: processing_date_valuation
        when: "plan.valuation_basis == PROCESSING_DATE"
        difference: "uses the balance at lock; for identical inputs with drifted balances produces a different vested_balance_cents, possibly flipping the force-out band"

  - name: force_out_path_selection
    trigger: "batch lock, immediately after vested_balance_determination for each case"
    algorithm: threshold
    formula: |
      if vested_balance_cents <= plan.cash_out_threshold_cents:      force_out_path = CASH_OUT
      elif vested_balance_cents <= plan.rollover_threshold_cents:    force_out_path = SAFE_HARBOR_IRA
      else:                                                          force_out_path = INELIGIBLE_REMAINS
      Boundary pins: vested == cash_out_threshold  -> CASH_OUT
                     vested == cash_out_threshold + 1 -> SAFE_HARBOR_IRA
                     vested == rollover_threshold    -> SAFE_HARBOR_IRA
                     vested == rollover_threshold + 1 -> INELIGIBLE_REMAINS
    input_set: "each case being locked; thresholds come from the case's plan"
    constants:
      DEFAULT_CASH_OUT_THRESHOLD_CENTS: 100000
      DEFAULT_ROLLOVER_THRESHOLD_CENTS: 700000
    precision: "integer cents; comparisons are inclusive-<="

  - name: net_check_withholding
    trigger: "POST /checks for a CASE_CASH_OUT origin (elected LUMP_SUM_CASH or auto cash-out)"
    algorithm: tiered_pricing
    formula: |
      fed_withholding_cents   = round_half_up(gross_amount_cents * FED_RATE)
      state_withholding_cents = round_half_up(gross_amount_cents * plan.state_withholding_rate)
      amount_cents            = gross_amount_cents - fed_withholding_cents - state_withholding_cents
      ROUNDING ORDER (pinned): round EACH withholding component to integer cents first,
      THEN subtract from gross. Computing round_half_up(gross * (1 - FED_RATE - state_rate))
      is a different, forbidden order and can differ by one cent.
      IRA_CLOSE origin checks: both withholding components are 0; amount == gross.
    input_set: "the case's vested_balance_cents (gross) and the plan's state_withholding_rate"
    constants:
      FED_RATE: 0.20
    precision: "integer cents, round_half_up per component"

  - name: ira_fee_assessment
    trigger: "POST /safe-harbor-iras/{id}/assess-fee"
    algorithm: chronological
    formula: |
      anchor = last_fee_assessed_at or opened_at (whichever is later-set; opened_at when never assessed)
      period = (anchor, now]
      ACTUAL_365: days = calendar days in period;            fee = round_half_up(ANNUAL_FEE_CENTS * days / 365)
      THIRTY_360: days = 30*(M2-M1) + min(D2,30) - min(D1,30) + 360*(Y2-Y1);
                  fee = round_half_up(ANNUAL_FEE_CENTS * days / 360)
      amount_cents = min(fee, balance_cents)   # fee never drives balance below zero
      Reject with ERR_DUPLICATE_FEE_PERIOD if an assessment with period_end in the same
      UTC calendar month as now already exists for this IRA.
    input_set: "the single IRA; prior IRAFeeAssessment rows for the duplicate-period check"
    constants:
      ANNUAL_FEE_CENTS: 6000
    precision: "integer cents, round_half_up"
    variants:
      - name: actual_365
        when: "ira.fee_day_count_convention == ACTUAL_365"
        difference: "real calendar days over 365; a 31-day month yields 510 cents on the standard fee"
      - name: thirty_360
        when: "ira.fee_day_count_convention == THIRTY_360"
        difference: "banker's months: every month counts 30 days; the same 08-01->09-01 period yields 500 cents instead of 510"

  - name: transfer_available_amount
    trigger: "POST /safe-harbor-iras/{id}/transfers"
    algorithm: constraint_propagation
    formula: |
      EVALUATION ORDER (pinned — the fee depends on balance, and the transferable
      amount depends on the fee; compute in exactly this order):
        1. snapshot = ira.balance_cents                       # already net of POSTED fees
        2. accrued  = unbilled fee from last_fee_assessed_at (or opened_at) to now,
                      computed by ira_fee_assessment on the snapshot, WITHOUT the min-cap
        3. amount_cents = snapshot - accrued
        4. require amount_cents > 0 else ERR_INSUFFICIENT_IRA_BALANCE
      accrued_fee_offset_cents := accrued (retained by the provider; not transferred)
    input_set: "the single IRA at MATCHED; its day-count convention"
    precision: "integer cents, round_half_up for the accrual"

  - name: match_score
    trigger: "POST /safe-harbor-iras/{id}/match-searches (one MatchCandidate per call)"
    algorithm: weighted_scoring
    formula: |
      score = round_half_up(0.55 * ssn_exact + 0.30 * name_similarity + 0.15 * dob_match, 3)
      Banding (non-linear interaction — the SSN gate caps non-SSN feeds at 0.45):
        score < REVIEW_FLOOR                                          -> REJECTED
        REVIEW_FLOOR <= score < AUTO_CONFIRM                          -> CANDIDATE (manual-review queue)
        score >= AUTO_CONFIRM and ssn_exact == true                   -> CONFIRMED (immediate)
        score >= AUTO_CONFIRM and ssn_exact == false                  -> CANDIDATE (gate blocks auto-confirm)
      Manual confirm of a CANDIDATE requires ssn_exact == true (ERR_SSN_GATE_FAILED, checked first)
      AND score >= CONFIRM_FLOOR (ERR_MATCH_SCORE_BELOW_THRESHOLD) — a CANDIDATE in
      [REVIEW_FLOOR, CONFIRM_FLOOR) can be reviewed but never confirmed.
      Boundary pins: score == 0.850 exactly with ssn_exact -> CONFIRMED; score == 0.400 exactly -> CANDIDATE.
    input_set: "one candidate feed tuple per call: ssn_exact, name_similarity (0..1, 2dp), dob_match"
    constants:
      W_SSN: 0.55
      W_NAME: 0.30
      W_DOB: 0.15
      AUTO_CONFIRM: 0.850
      CONFIRM_FLOOR: 0.650
      REVIEW_FLOOR: 0.400
    precision: "3 decimal places, round_half_up"

  - name: notice_window_deadline
    trigger: "record-delivery DELIVERED on any notice type"
    algorithm: chronological
    formula: |
      response_deadline = delivered_at + NOTICE_WINDOW_DAYS days
      Elections and opt-outs are accepted while now <= response_deadline (INCLUSIVE boundary:
      a submission at exactly the deadline instant succeeds; deadline + 1 second fails).
    input_set: "the single notice"
    constants:
      NOTICE_WINDOW_DAYS: 30
    precision: "datetime, inclusive upper bound"

  - name: check_staleness_and_escheat
    trigger: "POST /sweeps/run (staleness); POST /checks/{id}/void reason=ESCHEATMENT (escheat)"
    algorithm: threshold
    formula: |
      staleness: check ISSUED and now > stale_after (= issued_at + 180 days, EXCLUSIVE:
                 cashing at exactly stale_after succeeds; at stale_after + 1s it is stale)
      escheat gate: check STALE_DATED AND exists ESCHEAT_WARNING notice for the case with
                 delivery_status == DELIVERED and delivered_at <= now - ESCHEAT_WARNING_LEAD_DAYS
      IRA escheat dormancy: now - ira.last_activity_at > ESCHEAT_DORMANCY_DAYS (EXCLUSIVE)
    input_set: "all ISSUED checks (sweep); the single check/case (escheat void); all OPEN IRAs (sweep)"
    constants:
      CHECK_STALE_DAYS: 180
      ESCHEAT_WARNING_LEAD_DAYS: 90
      ESCHEAT_DORMANCY_DAYS: 1095
    precision: "datetime comparisons; boundaries exclusive as pinned"

  - name: batch_reconciliation_totals
    trigger: "every case transition into/out of {SETTLED, ESCHEATED, CANCELLED, EXECUTED}; every check cash/void; reconcile"
    algorithm: aggregation
    formula: |
      case_count              = count(cases where distribution_batch_id == batch.id)
      settled_case_count      = count(those with case_status IN {SETTLED, ESCHEATED, CANCELLED})
      total_forced_out_cents  = sum(vested_balance_cents over those with executed_path
                                    IN {CHECK_CASH_OUT, SAFE_HARBOR_IRA, DIRECT_NEW_PLAN})
      reconcile_eligible      = (case_count == settled_case_count) and case_count >= 1
      Source filter pinned: cases of THIS batch only; terminal set exactly {SETTLED, ESCHEATED, CANCELLED}.
    input_set: "all DistributionCase rows of the batch, all statuses"
    precision: "integer cents / integer counts"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present; X-User-Role is a declared role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "Caller role is in the endpoint's roles list"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: auth
    check: "For Participant-role calls, X-User-ID equals the target resource's participant_id (case elections/voids, IRA close, own-participant PATCH)"
    error_id: ERR_PARTICIPANT_OWNERSHIP_MISMATCH
    http_status: 403
    applies_to: "Participant-scoped endpoints"
  - priority: 4
    category: existence
    check: "Request body shape: required fields present, types valid, enum values in range (e.g., election_type, notice_type, void_reason, outcome)"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all"
  - priority: 5
    category: existence
    check: "Path and body FK references exist (plan, batch, case, notice, election, ira, check, match, transfer, review, recordkeeper, participant), evaluated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all resource endpoints"
  - priority: 6
    category: state
    check: "Target entity's state permits the transition (machine preconditions; includes OCC-adjacent state guards like IRA not MATCHED, case not NOTIFIED)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all mutating endpoints"
  - priority: 7
    category: business_safety
    check: "Compliance gates: segregation of duties (reviewer != batch.executed_by_user_id); FEE_DISCLOSURE delivered before first fee assessment; AUTO_PORTABILITY_PRENOTICE delivered before any transfer; ESCHEAT_WARNING delivered >= 90 days before escheatment void; no case left IDENTIFIED at batch execute"
    error_id: "ERR_SEGREGATION_OF_DUTIES | ERR_FEE_DISCLOSURE_NOT_DELIVERED | ERR_PRENOTICE_NOT_DELIVERED | ERR_ESCHEAT_WARNING_REQUIRED | ERR_CASE_NOTICE_OUTSTANDING"
    http_status: 422
    applies_to: "POST /fiduciary-reviews, POST /safe-harbor-iras/{id}/assess-fee, POST /safe-harbor-iras/{id}/transfers, POST /checks/{id}/void, POST /distribution-batches/{id}/execute"
  - priority: 8
    category: business_temporal
    check: "Window/deadline rules: election window open (now <= response_deadline); prenotice opt-out window elapsed; check not stale on cash; batch execute with open windows blocked; review period_start < period_end"
    error_id: "ERR_ELECTION_WINDOW_CLOSED | ERR_PRENOTICE_WINDOW_OPEN | ERR_CHECK_STALE | ERR_CASE_WINDOW_STILL_OPEN | ERR_REVIEW_PERIOD_INVALID"
    http_status: 422
    applies_to: "elections, transfers, check record-cashed, batch execute, review create"
  - priority: 9
    category: business_referential
    check: "Referenced-entity state: plan ACTIVE for case creation; recordkeeper ACTIVE for match/transfer; new_plan.recordkeeper_id == new_recordkeeper_id; destination plan network_reachable"
    error_id: "ERR_PLAN_NOT_ACTIVE | ERR_RECORDKEEPER_NOT_ACTIVE | ERR_RECORDKEEPER_PLAN_MISMATCH | ERR_DESTINATION_PLAN_NOT_ACCEPTING"
    http_status: 422
    applies_to: "case create, match search, transfer create, settle-direct-rollover"
  - priority: 10
    category: business_constraint
    check: "Uniqueness/occupancy: one open batch per plan; one fee assessment per IRA per UTC month; review period overlap (half-open, adjacency allowed); OCC stale version"
    error_id: "ERR_DUPLICATE_OPEN_BATCH | ERR_DUPLICATE_FEE_PERIOD | ERR_REVIEW_PERIOD_OVERLAP | ERR_STALE_VERSION"
    http_status: 409
    applies_to: "batch create, transfer create, match confirm, assess-fee, review create, PATCH plan, POST elections"
    note: "ERR_STALE_VERSION returns http 412 (OCC); the rest return 409 (occupancy/uniqueness)"
  - priority: 11
    category: business_fiscal
    check: "Money/threshold rules: threshold config sanity on PATCH (cash_out <= rollover, rate bounds); auto IRA only when force_out_path == SAFE_HARBOR_IRA or elected; transfer amount > 0; match score floor for manual confirm; SSN gate"
    error_id: "ERR_THRESHOLD_CONFIG_INVALID | ERR_CASE_BALANCE_INELIGIBLE | ERR_INSUFFICIENT_IRA_BALANCE | ERR_MATCH_SCORE_BELOW_THRESHOLD | ERR_SSN_GATE_FAILED"
    http_status: 422
    applies_to: "PATCH plan, POST /safe-harbor-iras, POST /checks, transfers, match confirm"

# =============================================================================
# §1.5 API Endpoint Table
# GET list endpoints accept limit?/offset? pagination inputs plus the filters
# noted; all list outputs use the array envelope with pagination_fields.
# =============================================================================
endpoints:
  # --- Recordkeepers ---
  - { method: POST, path: "/recordkeepers", description: "Register a recordkeeper in the network", roles: [ProviderOps], code: 201, input: [recordkeeper_code, legal_name], output: Recordkeeper, side_effects: ["network_status=PENDING_ONBOARD"] }
  - { method: GET, path: "/recordkeepers", description: "List recordkeepers", roles: [Participant, PlanSponsor, ProviderOps, FiduciaryReviewer], code: 200, input: ["network_status?", "limit?", "offset?"], output: "Recordkeeper[]", side_effects: [] }
  - { method: GET, path: "/recordkeepers/{id}", description: "Get one recordkeeper", roles: [Participant, PlanSponsor, ProviderOps, FiduciaryReviewer], code: 200, input: [], output: Recordkeeper, side_effects: [] }
  - { method: POST, path: "/recordkeepers/{id}/activate", description: "Activate from PENDING_ONBOARD or reinstate from SUSPENDED", roles: [ProviderOps], code: 200, input: [], output: Recordkeeper, side_effects: ["network_status -> ACTIVE", "recompute network_reachable for plans of this recordkeeper", "increments Recordkeeper.version by 1"] }
  - { method: POST, path: "/recordkeepers/{id}/suspend", description: "Suspend network participation", roles: [ProviderOps], code: 200, input: [], output: Recordkeeper, side_effects: ["network_status -> SUSPENDED", "recompute network_reachable=false for its plans", "increments Recordkeeper.version by 1"] }
  - { method: POST, path: "/recordkeepers/{id}/exit", description: "Exit the network (terminal; cascades to plans, matches, IRAs)", roles: [ProviderOps], code: 200, input: [], output: Recordkeeper, side_effects: ["network_status -> EXITED, exited_at set", "cascade: plans network_reachable=false -> affected matches EXPIRED -> affected IRAs MATCHED->OPEN", "increments Recordkeeper.version by 1"] }

  # --- Plans ---
  - { method: POST, path: "/plans", description: "Register an employer plan", roles: [PlanSponsor], code: 201, input: [plan_name, sponsor_ein, recordkeeper_id, "cash_out_threshold_cents?", "rollover_threshold_cents?", "state_withholding_rate?", "valuation_basis?", "auto_portability_enabled?", "accepts_incoming_transfers?"], output: Plan, side_effects: ["plan_status=ACTIVE", "network_reachable computed from recordkeeper + accepts_incoming_transfers"] }
  - { method: GET, path: "/plans", description: "List plans", roles: [Participant, PlanSponsor, ProviderOps, FiduciaryReviewer], code: 200, input: ["recordkeeper_id?", "plan_status?", "limit?", "offset?"], output: "Plan[]", side_effects: [] }
  - { method: GET, path: "/plans/{id}", description: "Get one plan", roles: [Participant, PlanSponsor, ProviderOps, FiduciaryReviewer], code: 200, input: [], output: Plan, side_effects: [] }
  - { method: PATCH, path: "/plans/{id}", description: "Update force-out configuration (OCC-guarded)", roles: [PlanSponsor], code: 200, input: [expected_plan_version, "cash_out_threshold_cents?", "rollover_threshold_cents?", "state_withholding_rate?", "valuation_basis?", "auto_portability_enabled?", "accepts_incoming_transfers?"], output: Plan, side_effects: ["ERR_STALE_VERSION (412) when expected_plan_version != plan.version", "ERR_THRESHOLD_CONFIG_INVALID when cash_out > rollover or rate out of bounds", "recompute network_reachable", "increments Plan.version by 1"] }
  - { method: POST, path: "/plans/{id}/terminate", description: "Terminate the plan (blocked while a batch is in flight)", roles: [PlanSponsor], code: 200, input: [], output: Plan, side_effects: ["plan_status -> TERMINATED", "network_reachable=false", "increments Plan.version by 1"] }

  # --- Participants ---
  - { method: POST, path: "/participants", description: "Register a separated participant (census feed)", roles: [PlanSponsor, ProviderOps], code: 201, input: [ssn_hash, full_name, date_of_birth, mailing_address_line1, mailing_city, mailing_state, mailing_zip, "email?"], output: Participant, side_effects: ["address_quality=UNVERIFIED"] }
  - { method: GET, path: "/participants", description: "List participants", roles: [Participant, PlanSponsor, ProviderOps, FiduciaryReviewer], code: 200, input: ["ssn_hash?", "address_quality?", "limit?", "offset?"], output: "Participant[]", side_effects: [] }
  - { method: GET, path: "/participants/{id}", description: "Get one participant", roles: [Participant, PlanSponsor, ProviderOps, FiduciaryReviewer], code: 200, input: [], output: Participant, side_effects: [] }
  - { method: PATCH, path: "/participants/{id}", description: "Update mailing address (marks address VALID); Participant may only PATCH self", roles: [PlanSponsor, ProviderOps, Participant], code: 200, input: ["mailing_address_line1?", "mailing_city?", "mailing_state?", "mailing_zip?", "email?"], output: Participant, side_effects: ["address_quality := VALID", "increments Participant.version by 1"] }

  # --- Distribution batches ---
  - { method: POST, path: "/distribution-batches", description: "Open a force-out batch for a plan (one open batch per plan)", roles: [PlanSponsor], code: 201, input: [plan_id], output: DistributionBatch, side_effects: ["ERR_DUPLICATE_OPEN_BATCH (409) if plan has a batch in {OPEN, LOCKED, EXECUTED, RECON_EXCEPTION}", "ERR_PLAN_NOT_ACTIVE if plan TERMINATED"] }
  - { method: GET, path: "/distribution-batches", description: "List batches", roles: [Participant, PlanSponsor, ProviderOps, FiduciaryReviewer], code: 200, input: ["plan_id?", "batch_status?", "limit?", "offset?"], output: "DistributionBatch[]", side_effects: [] }
  - { method: GET, path: "/distribution-batches/{id}", description: "Get one batch (with computed counters)", roles: [Participant, PlanSponsor, ProviderOps, FiduciaryReviewer], code: 200, input: [], output: DistributionBatch, side_effects: [] }
  - { method: POST, path: "/distribution-batches/{id}/lock", description: "Lock batch; run valuation + force-out path determination per case", roles: [PlanSponsor], code: 200, input: [], output: DistributionBatch, side_effects: ["runs vested_balance_determination and force_out_path_selection per case", "INELIGIBLE_REMAINS cases -> SETTLED (REMAIN_IN_PLAN)", "sets locked_at", "increments DistributionBatch.version by 1"] }
  - { method: POST, path: "/distribution-batches/{id}/execute", description: "Execute the locked batch (records executing operator for segregation of duties)", roles: [ProviderOps], code: 200, input: [], output: DistributionBatch, side_effects: ["ERR_CASE_NOTICE_OUTSTANDING if any case IDENTIFIED", "ERR_CASE_WINDOW_STILL_OPEN if any case NOTIFIED with unexpired deadline", "executed_by_user_id := X-User-ID; executed_at := now", "increments DistributionBatch.version by 1"] }
  - { method: POST, path: "/distribution-batches/{id}/reconcile", description: "Reconcile: all cases terminal -> RECONCILED; else -> RECON_EXCEPTION", roles: [ProviderOps], code: 200, input: [], output: DistributionBatch, side_effects: ["runs batch_reconciliation_totals", "increments DistributionBatch.version by 1"] }
  - { method: POST, path: "/distribution-batches/{id}/resume", description: "Resume from RECON_EXCEPTION after remediation", roles: [ProviderOps], code: 200, input: [], output: DistributionBatch, side_effects: ["batch_status -> EXECUTED", "recomputes counters", "increments DistributionBatch.version by 1"] }

  # --- Distribution cases ---
  - { method: POST, path: "/distribution-cases", description: "Attach a separated participant's case to an OPEN batch", roles: [PlanSponsor], code: 201, input: [distribution_batch_id, plan_id, participant_id, separation_date, separation_date_balance_cents, processing_date_balance_cents, "vesting_percent?"], output: DistributionCase, side_effects: ["ERR_PLAN_NOT_ACTIVE if plan TERMINATED", "ERR_INVALID_STATE if batch not OPEN", "ERR_INVALID_REQUEST if plan_id != batch.plan_id", "quoted_balance_cents computed (separation-date variant)", "batch case_count recomputed"] }
  - { method: GET, path: "/distribution-cases", description: "List cases", roles: [Participant, PlanSponsor, ProviderOps, FiduciaryReviewer], code: 200, input: ["distribution_batch_id?", "plan_id?", "participant_id?", "case_status?", "limit?", "offset?"], output: "DistributionCase[]", side_effects: [] }
  - { method: GET, path: "/distribution-cases/{id}", description: "Get one case", roles: [Participant, PlanSponsor, ProviderOps, FiduciaryReviewer], code: 200, input: [], output: DistributionCase, side_effects: [] }
  - { method: POST, path: "/distribution-cases/{id}/cancel", description: "Cancel a case (rehire / census error) while IDENTIFIED or NOTIFIED", roles: [PlanSponsor], code: 200, input: [], output: DistributionCase, side_effects: ["case_status -> CANCELLED", "batch counters recomputed", "increments DistributionCase.version by 1"] }
  - { method: POST, path: "/distribution-cases/{id}/settle-direct-rollover", description: "Execute an ELECTED DIRECT_ROLLOVER_NEW_PLAN case (plan-to-plan, no IRA)", roles: [ProviderOps], code: 200, input: [], output: DistributionCase, side_effects: ["requires SUBMITTED election DIRECT_ROLLOVER_NEW_PLAN", "ERR_DESTINATION_PLAN_NOT_ACCEPTING unless election.destination_plan.network_reachable", "case -> SETTLED, executed_path=DIRECT_NEW_PLAN, election -> EXECUTED", "batch totals recomputed", "increments DistributionCase.version by 1"] }

  # --- Notices ---
  - { method: POST, path: "/distribution-cases/{id}/notices", description: "Send a notice to the case's participant", roles: [ProviderOps], code: 201, input: [notice_type], output: Notice, side_effects: ["FORCE_OUT_ELECTION requires case IDENTIFIED and batch LOCKED", "FEE_DISCLOSURE requires case in {NOTIFIED, ELECTED, WINDOW_EXPIRED, EXECUTED, SETTLED}", "AUTO_PORTABILITY_PRENOTICE requires case SETTLED via SAFE_HARBOR_IRA", "ESCHEAT_WARNING requires case EXECUTED (uncashed check) or an OPEN dormant IRA", "sent_at := now"] }
  - { method: GET, path: "/notices", description: "List notices", roles: [Participant, PlanSponsor, ProviderOps, FiduciaryReviewer], code: 200, input: ["distribution_case_id?", "notice_type?", "delivery_status?", "limit?", "offset?"], output: "Notice[]", side_effects: [] }
  - { method: GET, path: "/notices/{id}", description: "Get one notice", roles: [Participant, PlanSponsor, ProviderOps, FiduciaryReviewer], code: 200, input: [], output: Notice, side_effects: [] }
  - { method: POST, path: "/notices/{id}/record-delivery", description: "Record mail-tracking outcome", roles: [ProviderOps], code: 200, input: [outcome], output: Notice, side_effects: ["outcome IN {DELIVERED, BOUNCED, RETURNED_MAIL} (ERR_INVALID_REQUEST otherwise)", "DELIVERED: delivered_at/response_deadline set; FORCE_OUT_ELECTION on IDENTIFIED case -> case NOTIFIED", "BOUNCED/RETURNED_MAIL: participant.address_quality := BAD_ADDRESS; RETURNED_MAIL on current notice -> case NOTIFIED->IDENTIFIED", "increments Notice.version by 1"] }

  # --- Elections ---
  - { method: POST, path: "/distribution-cases/{id}/elections", description: "Participant submits (or supersedes) an election within the notice window (OCC-guarded)", roles: [Participant], code: 201, input: [election_type, expected_case_version, "destination_plan_id?"], output: Election, side_effects: ["ERR_STALE_VERSION (412) on version mismatch", "ERR_ELECTION_WINDOW_CLOSED when now > deadline", "prior SUBMITTED election -> SUPERSEDED; case NOTIFIED<->ELECTED per result", "increments DistributionCase.version by 1"] }
  - { method: GET, path: "/elections", description: "List elections", roles: [Participant, PlanSponsor, ProviderOps, FiduciaryReviewer], code: 200, input: ["distribution_case_id?", "participant_id?", "destination_plan_id?", "election_status?", "limit?", "offset?"], output: "Election[]", side_effects: [] }
  - { method: GET, path: "/elections/{id}", description: "Get one election", roles: [Participant, PlanSponsor, ProviderOps, FiduciaryReviewer], code: 200, input: [], output: Election, side_effects: [] }
  - { method: POST, path: "/elections/{id}/void", description: "Participant revokes a SUBMITTED election while the window is open", roles: [Participant], code: 200, input: [], output: Election, side_effects: ["election -> VOIDED", "if no other SUBMITTED election: case ELECTED -> NOTIFIED", "increments Election.version by 1"] }

  # --- Safe harbor IRAs ---
  - { method: POST, path: "/safe-harbor-iras", description: "Establish a safe harbor IRA for an ELECTED(SAFE_HARBOR_IRA) or WINDOW_EXPIRED(IRA path) case", roles: [ProviderOps], code: 201, input: [distribution_case_id, "fee_day_count_convention?"], output: SafeHarborIRA, side_effects: ["ERR_INVALID_STATE if case not ELECTED/WINDOW_EXPIRED or batch not EXECUTED/RECON_EXCEPTION", "ERR_CASE_BALANCE_INELIGIBLE if WINDOW_EXPIRED and force_out_path != SAFE_HARBOR_IRA", "funded_amount_cents := vested_balance_cents; balance_cents := funded", "case -> SETTLED (executed_path SAFE_HARBOR_IRA); election -> EXECUTED", "batch totals recomputed"] }
  - { method: GET, path: "/safe-harbor-iras", description: "List IRAs", roles: [Participant, PlanSponsor, ProviderOps, FiduciaryReviewer], code: 200, input: ["distribution_case_id?", "participant_id?", "ira_status?", "limit?", "offset?"], output: "SafeHarborIRA[]", side_effects: [] }
  - { method: GET, path: "/safe-harbor-iras/{id}", description: "Get one IRA", roles: [Participant, PlanSponsor, ProviderOps, FiduciaryReviewer], code: 200, input: [], output: SafeHarborIRA, side_effects: [] }
  - { method: POST, path: "/safe-harbor-iras/{id}/close", description: "Participant opt-out / provider close: pays remaining balance by check", roles: [Participant, ProviderOps], code: 200, input: [], output: SafeHarborIRA, side_effects: ["Participant caller must own the IRA (ERR_PARTICIPANT_OWNERSHIP_MISMATCH)", "creates Check origin=IRA_CLOSE for full balance_cents (no withholding)", "if MATCHED: confirmed match -> EXPIRED", "ira -> CLOSED_BY_PARTICIPANT; balance_cents -> 0", "increments SafeHarborIRA.version by 1"] }
  - { method: POST, path: "/safe-harbor-iras/{id}/assess-fee", description: "Assess the periodic maintenance fee for the elapsed accrual period", roles: [ProviderOps], code: 201, input: [], output: IRAFeeAssessment, side_effects: ["requires ira_status IN {OPEN, MATCHED}", "ERR_FEE_DISCLOSURE_NOT_DELIVERED unless a FEE_DISCLOSURE notice for the case is DELIVERED", "ERR_DUPLICATE_FEE_PERIOD if an assessment exists with period_end in the current UTC month", "runs ira_fee_assessment; posts IRAFeeAssessment; balance_cents -= amount; total_fees_cents += amount; last_fee_assessed_at := now; last_activity_at := now", "increments SafeHarborIRA.version by 1"] }

  # --- Fee assessments (append-only ledger) ---
  - { method: GET, path: "/fee-assessments", description: "List fee ledger entries", roles: [Participant, PlanSponsor, ProviderOps, FiduciaryReviewer], code: 200, input: ["safe_harbor_ira_id?", "limit?", "offset?"], output: "IRAFeeAssessment[]", side_effects: [] }
  - { method: GET, path: "/fee-assessments/{id}", description: "Get one fee ledger entry", roles: [Participant, PlanSponsor, ProviderOps, FiduciaryReviewer], code: 200, input: [], output: IRAFeeAssessment, side_effects: [] }

  # --- Checks ---
  - { method: POST, path: "/checks", description: "Issue the cash-out check for an ELECTED(LUMP_SUM_CASH) or WINDOW_EXPIRED(CASH_OUT) case", roles: [ProviderOps], code: 201, input: [distribution_case_id], output: Check, side_effects: ["ERR_INVALID_STATE unless case ELECTED with LUMP_SUM_CASH election or WINDOW_EXPIRED with path CASH_OUT, and batch EXECUTED/RECON_EXCEPTION", "ERR_CASE_BALANCE_INELIGIBLE if WINDOW_EXPIRED and force_out_path != CASH_OUT", "runs net_check_withholding; check ISSUED with stale_after = issued_at + 180d", "case -> EXECUTED (executed_path CHECK_CASH_OUT); election -> EXECUTED", "batch totals recomputed"] }
  - { method: GET, path: "/checks", description: "List checks", roles: [Participant, PlanSponsor, ProviderOps, FiduciaryReviewer], code: 200, input: ["distribution_case_id?", "check_status?", "supersedes_check_id?", "origin?", "limit?", "offset?"], output: "Check[]", side_effects: [] }
  - { method: GET, path: "/checks/{id}", description: "Get one check", roles: [Participant, PlanSponsor, ProviderOps, FiduciaryReviewer], code: 200, input: [], output: Check, side_effects: [] }
  - { method: POST, path: "/checks/{id}/record-cashed", description: "Record bank confirmation that the check cleared", roles: [ProviderOps], code: 200, input: [], output: Check, side_effects: ["ERR_CHECK_STALE when now > stale_after", "check -> CASHED; CASE_CASH_OUT: case EXECUTED -> SETTLED; batch counters recomputed", "increments Check.version by 1"] }
  - { method: POST, path: "/checks/{id}/void", description: "Void an ISSUED or STALE_DATED check; ESCHEATMENT reason settles the case to the state", roles: [ProviderOps], code: 200, input: [void_reason], output: Check, side_effects: ["ESCHEATMENT requires STALE_DATED + ESCHEAT_WARNING delivered >= 90 days ago (ERR_ESCHEAT_WARNING_REQUIRED)", "escheatment void: case EXECUTED -> ESCHEATED; batch counters recomputed", "increments Check.version by 1"] }
  - { method: POST, path: "/checks/{id}/reissue", description: "Reissue a VOIDED (non-escheatment) check as a linked successor", roles: [ProviderOps], code: 201, input: [], output: Check, side_effects: ["ERR_UNDELIVERABLE_ADDRESS when participant.address_quality == BAD_ADDRESS", "ERR_INVALID_STATE when case not EXECUTED", "new Check ISSUED with supersedes_check_id = this id, identical amounts, fresh issued_at/stale_after"] }

  # --- Match candidates (auto-portability network) ---
  - { method: POST, path: "/safe-harbor-iras/{id}/match-searches", description: "Run one network match probe for an OPEN IRA; creates a scored MatchCandidate", roles: [ProviderOps], code: 201, input: [new_plan_id, new_recordkeeper_id, employment_start_date, ssn_exact, name_similarity, dob_match], output: MatchCandidate, side_effects: ["requires IRA OPEN and plan.auto_portability_enabled on the SOURCE plan", "ERR_RECORDKEEPER_PLAN_MISMATCH if new_plan.recordkeeper_id != new_recordkeeper_id", "ERR_RECORDKEEPER_NOT_ACTIVE if that recordkeeper not ACTIVE", "ERR_DESTINATION_PLAN_NOT_ACCEPTING unless new_plan.network_reachable", "runs match_score; band REJECTED -> record created REJECTED; CONFIRMED band -> IRA OPEN->MATCHED and sibling CANDIDATEs -> EXPIRED"] }
  - { method: GET, path: "/match-candidates", description: "List match candidates", roles: [Participant, PlanSponsor, ProviderOps, FiduciaryReviewer], code: 200, input: ["safe_harbor_ira_id?", "participant_id?", "new_plan_id?", "new_recordkeeper_id?", "match_status?", "limit?", "offset?"], output: "MatchCandidate[]", side_effects: [] }
  - { method: GET, path: "/match-candidates/{id}", description: "Get one match candidate", roles: [Participant, PlanSponsor, ProviderOps, FiduciaryReviewer], code: 200, input: [], output: MatchCandidate, side_effects: [] }
  - { method: POST, path: "/match-candidates/{id}/confirm", description: "Manually confirm a CANDIDATE-band match", roles: [ProviderOps], code: 200, input: [], output: MatchCandidate, side_effects: ["ERR_SSN_GATE_FAILED unless ssn_exact", "ERR_MATCH_SCORE_BELOW_THRESHOLD when score < 0.650", "IRA OPEN -> MATCHED; sibling CANDIDATEs -> EXPIRED", "increments MatchCandidate.version by 1"] }
  - { method: POST, path: "/match-candidates/{id}/reject", description: "Reject a CANDIDATE-band match", roles: [ProviderOps], code: 200, input: [], output: MatchCandidate, side_effects: ["match -> REJECTED", "increments MatchCandidate.version by 1"] }

  # --- Transfers ---
  - { method: POST, path: "/safe-harbor-iras/{id}/transfers", description: "Initiate the auto-portability transfer of a MATCHED IRA to the new employer plan", roles: [ProviderOps], code: 201, input: [expected_ira_version, "match_candidate_id?"], output: Transfer, side_effects: ["ERR_STALE_VERSION (412) on stale expected_ira_version", "ERR_INVALID_STATE unless IRA MATCHED", "ERR_PRENOTICE_NOT_DELIVERED / ERR_PRENOTICE_WINDOW_OPEN for the AUTO_PORTABILITY_PRENOTICE gate", "ERR_RECORDKEEPER_NOT_ACTIVE unless match recordkeeper ACTIVE", "runs transfer_available_amount; ERR_INSUFFICIENT_IRA_BALANCE when <= 0", "match defaults to the unique CONFIRMED match; match -> EXECUTED; IRA MATCHED -> TRANSFER_PENDING; balance -> in_flight", "increments SafeHarborIRA.version by 1"] }
  - { method: GET, path: "/transfers", description: "List transfers", roles: [Participant, PlanSponsor, ProviderOps, FiduciaryReviewer], code: 200, input: ["safe_harbor_ira_id?", "match_candidate_id?", "transfer_status?", "limit?", "offset?"], output: "Transfer[]", side_effects: [] }
  - { method: GET, path: "/transfers/{id}", description: "Get one transfer", roles: [Participant, PlanSponsor, ProviderOps, FiduciaryReviewer], code: 200, input: [], output: Transfer, side_effects: [] }
  - { method: POST, path: "/transfers/{id}/record-response", description: "Record the receiving recordkeeper's acceptance or rejection", roles: [ProviderOps], code: 200, input: [outcome, "rejection_reason?"], output: Transfer, side_effects: ["outcome IN {ACCEPTED, REJECTED} (ERR_INVALID_REQUEST otherwise); REJECTED requires rejection_reason", "ACCEPTED: transfer RECONCILED; IRA -> TRANSFERRED_OUT; in_flight -> total_transferred_out", "REJECTED: transfer RETURNED; IRA re-credited and -> OPEN; match EXECUTED -> REJECTED", "increments Transfer.version by 1"] }

  # --- Fiduciary reviews ---
  - { method: POST, path: "/fiduciary-reviews", description: "Open a fiduciary review of a RECONCILED batch (segregation of duties enforced)", roles: [FiduciaryReviewer], code: 201, input: [distribution_batch_id, period_start, period_end], output: FiduciaryReview, side_effects: ["ERR_INVALID_STATE (409) unless batch.batch_status == RECONCILED", "ERR_SEGREGATION_OF_DUTIES when X-User-ID == batch.executed_by_user_id", "ERR_REVIEW_PERIOD_INVALID when period_start >= period_end", "ERR_REVIEW_PERIOD_OVERLAP on half-open [start,end) intersection with an existing non-CLOSED review of the same plan (adjacency allowed)", "reviewer_user_id := X-User-ID; plan_id copied from batch"] }
  - { method: GET, path: "/fiduciary-reviews", description: "List reviews", roles: [Participant, PlanSponsor, ProviderOps, FiduciaryReviewer], code: 200, input: ["distribution_batch_id?", "plan_id?", "review_status?", "limit?", "offset?"], output: "FiduciaryReview[]", side_effects: [] }
  - { method: GET, path: "/fiduciary-reviews/{id}", description: "Get one review", roles: [Participant, PlanSponsor, ProviderOps, FiduciaryReviewer], code: 200, input: [], output: FiduciaryReview, side_effects: [] }
  - { method: POST, path: "/fiduciary-reviews/{id}/record-finding", description: "Record a finding (moves review to REMEDIATION_OPEN)", roles: [FiduciaryReviewer], code: 200, input: [], output: FiduciaryReview, side_effects: ["findings_count += 1", "review OPEN -> REMEDIATION_OPEN", "increments FiduciaryReview.version by 1"] }
  - { method: POST, path: "/fiduciary-reviews/{id}/verify-remediation", description: "Accept remediation of all findings (back to OPEN)", roles: [FiduciaryReviewer], code: 200, input: [], output: FiduciaryReview, side_effects: ["review REMEDIATION_OPEN -> OPEN", "increments FiduciaryReview.version by 1"] }
  - { method: POST, path: "/fiduciary-reviews/{id}/attest", description: "Attest the process (only from OPEN); closes the review and marks the batch REVIEWED", roles: [FiduciaryReviewer], code: 200, input: [], output: FiduciaryReview, side_effects: ["ERR_INVALID_STATE unless review OPEN", "attested_at := now; review -> CLOSED", "batch RECONCILED -> REVIEWED", "increments FiduciaryReview.version by 1"] }

  # --- System / operations ---
  - { method: POST, path: "/sweeps/run", description: "Run the deterministic clock-driven sweep: expire open election windows past deadline (NOTIFIED -> WINDOW_EXPIRED), stale ISSUED checks past stale_after, expire CANDIDATE matches older than 90 days, escheat dormant OPEN IRAs whose ESCHEAT_WARNING matured", roles: [ProviderOps], code: 200, input: [], output: { cases_window_expired: integer, checks_staled: integer, matches_expired: integer, iras_escheated: integer }, side_effects: ["applies check_staleness_and_escheat and notice_window_deadline rules across all entities"] }
  - { method: POST, path: "/_clock/set_current_utc", description: "Test-driving endpoint: set the logical clock. Startup default is exactly 2026-08-01T00:00:00Z; the clock never falls back to wall-clock time, and all deadline/staleness/dormancy logic reads only this clock", roles: [ProviderOps], code: 200, input: [to_iso8601], output: { current_utc: string }, side_effects: ["sets the logical clock; no entity mutations (use POST /sweeps/run to apply time-driven transitions)"] }

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "X-User-ID or X-User-Role header missing or role not a declared role" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Caller role not in the endpoint's roles list" }
  - { id: ERR_PARTICIPANT_OWNERSHIP_MISMATCH, http: 403, condition: "Participant-role caller's X-User-ID does not equal the target resource's participant_id" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, wrong type, or out-of-range enum (outcome, election_type, notice_type, void_reason, day-count convention)" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "A path id or referenced FK does not exist" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Entity's current state does not permit the requested transition (includes batch not RECONCILED for review creation, case not ready, IRA not MATCHED/OPEN as applicable)" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_*_version does not match the parent entity's current version (OCC)" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 422, condition: "Fiduciary review creator's X-User-ID equals the batch's executed_by_user_id" }
  - { id: ERR_FEE_DISCLOSURE_NOT_DELIVERED, http: 422, condition: "First fee assessment attempted without a DELIVERED FEE_DISCLOSURE notice for the case" }
  - { id: ERR_PRENOTICE_NOT_DELIVERED, http: 422, condition: "Transfer attempted with no DELIVERED AUTO_PORTABILITY_PRENOTICE for the case" }
  - { id: ERR_ESCHEAT_WARNING_REQUIRED, http: 422, condition: "Escheatment void (or dormancy escheat) without an ESCHEAT_WARNING notice delivered at least 90 days earlier" }
  - { id: ERR_CASE_NOTICE_OUTSTANDING, http: 422, condition: "Batch execute attempted while a case is still IDENTIFIED (force-out notice never delivered)" }
  - { id: ERR_ELECTION_WINDOW_CLOSED, http: 422, condition: "Election or election void submitted after the current notice's response_deadline (now > deadline)" }
  - { id: ERR_PRENOTICE_WINDOW_OPEN, http: 422, condition: "Transfer attempted while the AUTO_PORTABILITY_PRENOTICE opt-out window is still open (now <= deadline)" }
  - { id: ERR_CHECK_STALE, http: 422, condition: "record-cashed attempted after stale_after (now > stale_after)" }
  - { id: ERR_CASE_WINDOW_STILL_OPEN, http: 422, condition: "Batch execute attempted while a NOTIFIED case's election window has not expired" }
  - { id: ERR_REVIEW_PERIOD_INVALID, http: 422, condition: "Fiduciary review period_start >= period_end" }
  - { id: ERR_PLAN_NOT_ACTIVE, http: 422, condition: "Plan is TERMINATED; case/batch creation blocked" }
  - { id: ERR_RECORDKEEPER_NOT_ACTIVE, http: 422, condition: "Referenced recordkeeper is not ACTIVE (PENDING_ONBOARD, SUSPENDED, or EXITED)" }
  - { id: ERR_RECORDKEEPER_PLAN_MISMATCH, http: 422, condition: "new_plan.recordkeeper_id != new_recordkeeper_id supplied to the match search" }
  - { id: ERR_DESTINATION_PLAN_NOT_ACCEPTING, http: 422, condition: "Destination plan's network_reachable is false (recordkeeper down or accepts_incoming_transfers false)" }
  - { id: ERR_DUPLICATE_OPEN_BATCH, http: 409, condition: "Plan already has a batch in {OPEN, LOCKED, EXECUTED, RECON_EXCEPTION}" }
  - { id: ERR_DUPLICATE_FEE_PERIOD, http: 409, condition: "An IRAFeeAssessment with period_end in the current UTC month already exists for this IRA" }
  - { id: ERR_REVIEW_PERIOD_OVERLAP, http: 409, condition: "Half-open [period_start, period_end) intersects an existing non-CLOSED review for the same plan" }
  - { id: ERR_THRESHOLD_CONFIG_INVALID, http: 422, condition: "PATCH would set cash_out_threshold_cents > rollover_threshold_cents, or state_withholding_rate outside [0, 0.15]" }
  - { id: ERR_CASE_BALANCE_INELIGIBLE, http: 422, condition: "Auto execution path mismatch: WINDOW_EXPIRED case's force_out_path does not match the attempted executor (IRA vs check)" }
  - { id: ERR_INSUFFICIENT_IRA_BALANCE, http: 422, condition: "transfer_available_amount <= 0 after accrued-fee offset" }
  - { id: ERR_MATCH_SCORE_BELOW_THRESHOLD, http: 422, condition: "Manual confirm attempted with match_score < 0.650" }
  - { id: ERR_SSN_GATE_FAILED, http: 422, condition: "Manual confirm attempted with ssn_exact == false" }
  - { id: ERR_UNDELIVERABLE_ADDRESS, http: 422, condition: "Check reissue attempted while participant.address_quality == BAD_ADDRESS" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Participant
    description: "Separated plan participant; elects distribution options, opts out of portability, maintains own address"
    identity: "entity_backed:Participant"
    exclusive_operations:
      - "POST /distribution-cases/{id}/elections — submit/supersede election (own case only)"
      - "POST /elections/{id}/void — revoke own election"
    shared_operations:
      - "PATCH /participants/{id} — own address only"
      - "POST /safe-harbor-iras/{id}/close — own IRA only"
      - "All GET endpoints"
  - name: PlanSponsor
    description: "Employer plan administrator; registers plans/participants, manages batches and cases"
    identity: "opaque"
    exclusive_operations:
      - "POST /plans, PATCH /plans/{id}, POST /plans/{id}/terminate"
      - "POST /distribution-batches, POST /distribution-batches/{id}/lock"
      - "POST /distribution-cases, POST /distribution-cases/{id}/cancel"
    shared_operations:
      - "POST /participants, PATCH /participants/{id}"
      - "All GET endpoints"
  - name: ProviderOps
    description: "Safe-harbor IRA provider operations; runs notices, execution, checks, fees, matching, transfers, sweeps"
    identity: "opaque"
    exclusive_operations:
      - "POST /recordkeepers and all recordkeeper status actions"
      - "POST /distribution-batches/{id}/execute|reconcile|resume"
      - "POST /distribution-cases/{id}/settle-direct-rollover"
      - "POST /distribution-cases/{id}/notices, POST /notices/{id}/record-delivery"
      - "POST /safe-harbor-iras, POST /safe-harbor-iras/{id}/assess-fee, POST /safe-harbor-iras/{id}/match-searches, POST /safe-harbor-iras/{id}/transfers"
      - "POST /checks, POST /checks/{id}/record-cashed|void|reissue"
      - "POST /match-candidates/{id}/confirm|reject"
      - "POST /transfers/{id}/record-response"
      - "POST /sweeps/run, POST /_clock/set_current_utc"
    shared_operations:
      - "POST /participants, PATCH /participants/{id}"
      - "POST /safe-harbor-iras/{id}/close"
      - "All GET endpoints"
  - name: FiduciaryReviewer
    description: "Independent fiduciary; reviews reconciled batches; may never review a batch it executed (segregation of duties vs ProviderOps)"
    identity: "opaque"
    exclusive_operations:
      - "POST /fiduciary-reviews and all review lifecycle actions"
    shared_operations:
      - "All GET endpoints"
