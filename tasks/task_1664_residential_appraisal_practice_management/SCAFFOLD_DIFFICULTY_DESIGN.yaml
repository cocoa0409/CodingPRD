              captures: { r2_id: $.data.id }
            - { call: "POST /appraisal/reports/${r2_id}/submit-for-qc", payload: {}, as: Appraiser, as_user_id: "${a_id}" }
            - { call: "POST /appraisal/reports/${r2_id}/qc-pass", payload: {}, as: QCReviewer, as_user_id: "${q_id}" }
            - { call: "POST /appraisal/reports/${r2_id}/deliver", payload: {}, as: Appraiser, as_user_id: "${a_id}" }
            # --- complaint on order 2, closed SANCTIONED 2030-06-01 ---
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2030-05-10T00:00:00Z" }, as: FirmAdmin }
            - call: "POST /appraisal/complaints"
              payload: { order_id: "${o2_id}", respondent_appraiser_id: "${a_id}", description: "Board inquiry into order 2" }
              as: ComplianceOfficer
              captures: { cp_id: $.data.id }
            - { call: "POST /appraisal/complaints/${cp_id}/draft-response", payload: { response_text: "Full response package" }, as: ComplianceOfficer }
            - { call: "POST /appraisal/complaints/${cp_id}/submit-response", payload: {}, as: ComplianceOfficer }
