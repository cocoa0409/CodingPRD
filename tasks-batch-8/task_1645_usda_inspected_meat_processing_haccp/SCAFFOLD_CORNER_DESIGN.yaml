        test_recipe:
          setup: ["plant; shift 06:00-18:00 for insp-01; clock initially 2026-08-01T04:00:00Z"]
          setup_api_calls:
            - { call: "POST /plants", payload: { establishment_number: "EST-1645-31", name: "Prairie Packing", district_code: "D25", cooler_capacity_lbs: 10000 }, as: PlantAdmin, captures: { plant_id: $.data.id } }
