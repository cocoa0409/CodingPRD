          15.0 / 7.0 = 2.1428571... must land on 2.143 (three decimals, ROUND_HALF_UP) and the
          percentile must then be derived from the ROUNDED 2.143 (51.1, not 51.07 from the raw
          quotient); the HOURS_OF_SERVICE denominator is floored by min(exposure, inspections x 2) =
