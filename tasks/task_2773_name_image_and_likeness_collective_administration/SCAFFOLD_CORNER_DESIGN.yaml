            - call: "POST /nil/deal-contracts/${dc_id}/compliance-decisions"
              payload: { decision: "ACCEPT" }
              as: InstitutionReviewer
            - call: "POST /nil/deal-contracts/${dc_id}/activation"
              payload: {}
              as: CollectiveDirector
              captures: { dc_ver1: $.data.version }
          trigger:
            - call: "POST /nil/payment-releases"
              payload: { deal_contract_id: "${dc_id}", release_kind: "CONTRACT_ADVANCE", requested_amount_cents: 59999, expected_deal_contract_version: "${dc_ver1}" }
              as: TreasuryOfficer
              as_user_id: "treasury-thresh"
              captures: { rel1: $.data.id }
            - call: "GET /nil/athletes/${ath_id}"
              payload: {}
              as: TreasuryOfficer
              captures: { gross_at_59999: $.data.tax_year_gross_paid_cents, form_at_59999: $.data.tax_form_required }
            - call: "GET /nil/deal-contracts/${dc_id}"
              payload: {}
              as: TreasuryOfficer
              captures: { dc_ver2: $.data.version }
            - call: "POST /nil/payment-releases"
              payload: { deal_contract_id: "${dc_id}", release_kind: "CONTRACT_ADVANCE", requested_amount_cents: 1, expected_deal_contract_version: "${dc_ver2}" }
              as: TreasuryOfficer
              as_user_id: "treasury-thresh"
              captures: { rel2: $.data.id }
            - call: "GET /nil/athletes/${ath_id}"
              payload: {}
              as: TreasuryOfficer
              captures: { gross_at_60000: $.data.tax_year_gross_paid_cents, form_at_60000: $.data.tax_form_required }
          assert:
            - "${form_before} == NONE"
            - "${doc_on_file} == W9, so calc_release_withholding takes the no-withholding branch and net_payable_cents equals requested_amount_cents."
            - "${gross_at_59999} == 59999"
            - "${form_at_59999} == NONE"
            - "${gross_at_60000} == 60000"
            - "${form_at_60000} == FORM_1099_NEC"
            - "PaymentRelease.${rel1}.withholding_basis == NONE"
            - "PaymentRelease.${rel2}.net_payable_cents == 1"
            - "DealContract.${dc_id}.released_total_cents == 60000"
            - "DealContract.${dc_id}.payment_status == FULLY_PAID"
            - "Collective.${col_id}.committed_unreleased_cents == 0"

