        claim_type: conditional_action
        grounds: [state_machines.GrindingBatch.QUEUED_to_GRINDING, "errors[ERR_CORE_NOT_GRINDABLE]"]
        distinguishing_aspect: "Starting a grinding batch whose input list includes an A-grade core fails with ERR_CORE_NOT_GRINDABLE (422); the batch stays QUEUED."
        test_recipe:
          setup: ["batch SORTING with one A core and one SCRAP core; grinding batch containing both"]
          setup_api_calls:
            - call: "POST /pallet-ops/core-batches"
              payload: { supplier_name: "MixCo", agreed_unit_price_cents: 100, manifest_count: 2, estimated_grade_mix: { A: 0.5, B: 0.0, SCRAP: 0.5 } }
              as: ProcurementManager
