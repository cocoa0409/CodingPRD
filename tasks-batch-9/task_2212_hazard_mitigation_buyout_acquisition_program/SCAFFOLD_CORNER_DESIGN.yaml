            - "trigger call 4 returns 201 and DemolitionWorkOrder.${wo1}.status == UTILITY_HOLD"
            - "after trigger call 11 DemolitionWorkOrder.${wo1}.status == READY and confirmed_utility_types == [WATER, ELECTRIC, GAS, SEWER]"
            - "trigger call 12 returns 200 and DemolitionWorkOrder.${wo1}.status == IN_PROGRESS"
            - "trigger call 13 returns 409 with data.error_id == ERR_INVALID_WORK_ORDER_STATE"
            - "trigger call 14 returns 409 with data.error_id == ERR_INVALID_DISCONNECTION_STATE"
            - "UtilityDisconnection.${ud_water}.status == CONFIRMED and failed_attempt_count == 0 after trigger call 14"
            - "GET /utility-disconnections?work_order_id=${wo1} returns total_count == 4"

      - name: contractor_status_change_to_the_current_status_is_refused
        claim_type: guarded_transitions
        grounds:
          - validations.priority_34
          - state_machines.DemolitionContractor
          - endpoints.POST_demolition-contractors_contractor_id_status
        distinguishing_aspect: |
          The two-state contractor machine has no self-loop: requesting ACTIVE while ACTIVE returns
          409 ERR_INVALID_CONTRACTOR_STATE, the ACTIVE -> SUSPENDED edge succeeds, and requesting
          SUSPENDED while SUSPENDED returns the same 409 - so the guard is "different from current",
          not a fixed source state, and neither refusal bumps version.
        test_recipe:
          setup:
            - "One DemolitionContractor in ACTIVE."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProgramAdministrator
              as_user_id: "pa-1"
            - call: "POST /demolition-contractors"
              payload: { name: "Riverbend Wrecking", license_no: "DEM-1", asbestos_certified: true, max_concurrent_work_orders: 2 }
              as: ProgramAdministrator
              as_user_id: "pa-1"
              captures: { ct1: "$.data.id" }
          trigger:
            - call: "POST /demolition-contractors/${ct1}/status"
              payload: { contractor_id: "${ct1}", status: "ACTIVE", status_reason: "no change" }
              as: ProgramAdministrator
              as_user_id: "pa-1"
            - call: "POST /demolition-contractors/${ct1}/status"
              payload: { contractor_id: "${ct1}", status: "SUSPENDED", status_reason: "license lapse" }
              as: ProgramAdministrator
              as_user_id: "pa-1"
            - call: "POST /demolition-contractors/${ct1}/status"
              payload: { contractor_id: "${ct1}", status: "SUSPENDED", status_reason: "still lapsed" }
              as: ProgramAdministrator
              as_user_id: "pa-1"
          assert:
            - "trigger call 1 returns 409 with data.error_id == ERR_INVALID_CONTRACTOR_STATE"
            - "DemolitionContractor.${ct1}.status == ACTIVE and version == 1 after trigger call 1"
