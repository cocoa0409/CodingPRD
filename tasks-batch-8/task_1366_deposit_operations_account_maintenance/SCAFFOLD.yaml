# =============================================================================
# SCAFFOLD.yaml — Deposit Operations & Account Maintenance (bank deposit ops)
# §1.0–§1.7 seed tables. §1.8 and §1.9 live in sibling files.
# =============================================================================

scenario: |
  Deposit Operations & Account Maintenance (bank deposit operations): signature
  card & authorized signer maintenance, title changes (POD/trust/business) &
  documentation requirements, deceased-account handling & estate release,
  garnishment/levy processing with exempt-funds analysis, dormant-account
  tracking & inactivity fee, statement production & suppression, rate/product
  change conversion, account closure & residual balance handling

domain_name: deposit-operations-account-maintenance
api_prefix: /bank

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: posture_driven_gating
  complexity_layers:
    - rate_threshold_triggers
    - cascading_side_effects
    - derived_field_reconciliation
    - scheduled_actions
    - optimistic_concurrency
  entity_topology: flat
  state_machine_shape: parallel   # DepositAccount lifecycle_status x restriction_status; plus cyclic TitleChangeRequest and branching GarnishmentOrder
  relationship_patterns:
    - one_to_many          # DepositAccount -> each child collection
    - cross_aggregate      # TitleChangeRequest gated on AccountDocument; DeceasedCase gated on AccountDocument
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table (flat topology; all children FK to account)
# =============================================================================
entities:
  - name: DepositAccount
    parent: null
    common_fields: true
    fields:
      - { name: account_number, type: string, source: system, description: "Server-minted 10-digit account number, unique" }
      - { name: primary_owner_name, type: string, source: input, description: "Legal name of the primary owner" }
      - { name: owner_tax_id, type: string, source: input, description: "Tax identification number of the primary owner" }
      - { name: ownership_type, type: enum, source: input, description: "INDIVIDUAL | JOINT | POD | TRUST | BUSINESS" }
      - { name: pod_beneficiary_name, type: string, source: input, description: "Payable-on-death beneficiary; required iff ownership_type == POD", default: null }
      - { name: product_code, type: enum, source: input, description: "BASIC_CHECKING | PREMIUM_CHECKING | SAVINGS | MONEY_MARKET" }
      - { name: rate_bps, type: integer, source: input, description: "Annual interest rate in basis points; 0 for non-interest products", constraints: "0 <= rate_bps <= 2000" }
      - { name: lifecycle_status, type: enum, source: system, description: "OPEN | DORMANT | ESCHEAT_PENDING | CLOSED (parallel dimension 1)" }
      - { name: restriction_status, type: enum, source: system, description: "NONE | LEGAL_HOLD | DECEASED_HOLD (parallel dimension 2; posture gates withdrawals/closure/title changes)" }
      - { name: balance_cents, type: integer, source: system, description: "Ledger balance: signed sum of all posted AccountTransaction amounts", default: 0 }
      - { name: total_held_cents, type: integer, source: computed, description: "Sum of held_amount_cents over GarnishmentOrder with status == FUNDS_HELD for this account", default: 0 }
      - { name: available_balance_cents, type: integer, source: computed, description: "balance_cents - total_held_cents", default: 0 }
      - { name: accrual_start_date, type: string, source: system, description: "Date from which unsettled interest accrues: set to opening date at creation and to effective_date at each conversion execute" }
      - { name: accrued_interest_cents, type: integer, source: computed, description: "Interest accrued over half-open window [accrual_start_date, settlement date) per accrued_interest_settlement; recomputed at settlement events", default: 0 }
      - { name: last_customer_activity_date, type: string, source: system, description: "Latest posted_date of a customer_initiated transaction; drives dormancy" }
      - { name: dormant_since_date, type: string, source: system, description: "Date lifecycle_status entered DORMANT; null when not dormant", default: null }
      - { name: fees_assessed_count, type: integer, source: system, description: "Number of inactivity fees assessed in the current dormancy episode", default: 0 }
      - { name: statement_suppression, type: enum, source: computed, description: "NONE | DORMANT | DECEASED | CLOSED — derived: CLOSED if lifecycle CLOSED, else DECEASED if restriction DECEASED_HOLD, else DORMANT if lifecycle DORMANT or ESCHEAT_PENDING, else NONE" }
      - { name: closure_payout_cents, type: integer, source: system, description: "Residual balance disbursed at closure; null until CLOSED", default: null }
      - { name: closure_payout_destination, type: enum, source: system, description: "OWNER | ESTATE | STATE_ESCHEAT; null until CLOSED", default: null }

  - name: AccountTransaction
    parent: DepositAccount
    common_fields: false
    fields:
      - { name: account_id, type: string, source: system, description: "FK -> DepositAccount.id" }
      - { name: txn_type, type: enum, source: input, description: "Client-postable: DEPOSIT | WITHDRAWAL | FEDERAL_BENEFIT_DEPOSIT. System-only: INACTIVITY_FEE | INTEREST_CREDIT | LEGAL_REMITTANCE | CLOSURE_PAYOUT | ESTATE_RELEASE" }
      - { name: amount_cents, type: integer, source: input, description: "Always positive; direction derived from txn_type (credit: DEPOSIT, FEDERAL_BENEFIT_DEPOSIT, INTEREST_CREDIT; debit: WITHDRAWAL, INACTIVITY_FEE, LEGAL_REMITTANCE, CLOSURE_PAYOUT, ESTATE_RELEASE)" }
      - { name: customer_initiated, type: boolean, source: input, description: "True when the account owner initiated it; drives last_customer_activity_date and dormancy reactivation", default: false }
      - { name: posted_date, type: string, source: input, description: "Value date (YYYY-MM-DD); defaults to the logical clock date", default: null }
      - { name: balance_after_cents, type: integer, source: system, description: "Account balance immediately after this transaction posts" }

  - name: AuthorizedSigner
    parent: DepositAccount
    common_fields: true
    fields:
      - { name: account_id, type: string, source: system, description: "FK -> DepositAccount.id" }
      - { name: full_name, type: string, source: input, description: "Signer legal name" }
      - { name: tax_id, type: string, source: input, description: "Signer tax id" }
      - { name: signer_role, type: enum, source: input, description: "OWNER | AUTHORIZED_SIGNER | POWER_OF_ATTORNEY | TRUSTEE | BUSINESS_OFFICER" }
      - { name: signature_card_reference, type: string, source: input, description: "Must equal reference_number of a VERIFIED AccountDocument with doc_type SIGNATURE_CARD on the same account" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED | REMOVED" }
      - { name: removed_reason, type: enum, source: system, description: "STAFF_REQUEST | DECEASED_CASCADE | ACCOUNT_CLOSED; null until REMOVED", default: null }

  - name: AccountDocument
    parent: DepositAccount
    common_fields: true
    fields:
      - { name: account_id, type: string, source: system, description: "FK -> DepositAccount.id" }
      - { name: doc_type, type: enum, source: input, description: "SIGNATURE_CARD | DEATH_CERTIFICATE | LETTERS_TESTAMENTARY | TRUST_AGREEMENT | POD_DESIGNATION | BUSINESS_RESOLUTION | COURT_ORDER" }
      - { name: reference_number, type: string, source: input, description: "Submitter reference; unique per account across all statuses" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | VERIFIED | REJECTED" }
      - { name: reviewed_by_user_id, type: string, source: system, description: "X-User-ID of the reviewing OpsManager; null until reviewed", default: null }
      - { name: review_note, type: string, source: system, description: "Optional note captured at review", default: null }

  - name: TitleChangeRequest
    parent: DepositAccount
    common_fields: true
    fields:
      - { name: account_id, type: string, source: system, description: "FK -> DepositAccount.id" }
      - { name: current_ownership_type, type: enum, source: system, description: "Snapshot of DepositAccount.ownership_type at request creation" }
      - { name: requested_ownership_type, type: enum, source: input, description: "INDIVIDUAL | JOINT | POD | TRUST | BUSINESS; must differ from current_ownership_type" }
      - { name: pod_beneficiary_name, type: string, source: input, description: "Required iff requested_ownership_type == POD", default: null }
      - { name: required_doc_types, type: array, source: computed, description: "Derived from requested_ownership_type: POD->[POD_DESIGNATION], TRUST->[TRUST_AGREEMENT], BUSINESS->[BUSINESS_RESOLUTION, SIGNATURE_CARD], INDIVIDUAL->[SIGNATURE_CARD], JOINT->[SIGNATURE_CARD]" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | APPROVED | REJECTED" }
      - { name: created_by_user_id, type: string, source: system, description: "X-User-ID of the creating OpsOfficer" }
      - { name: decided_by_user_id, type: string, source: system, description: "X-User-ID of the deciding OpsManager; null until decided", default: null }
      - { name: decision_reason, type: string, source: system, description: "Rejection reason or auto-reject code (DECEASED_ACCOUNT | ACCOUNT_CLOSED)", default: null }

  - name: DeceasedCase
    parent: DepositAccount
    common_fields: true
    fields:
      - { name: account_id, type: string, source: system, description: "FK -> DepositAccount.id" }
      - { name: decedent_name, type: string, source: input, description: "Name of deceased owner" }
      - { name: date_of_death, type: string, source: input, description: "YYYY-MM-DD; must be <= current clock date" }
      - { name: reported_by, type: string, source: input, description: "Name/capacity of the reporting party" }
      - { name: status, type: enum, source: system, description: "REPORTED | VERIFIED | RELEASE_PENDING | RELEASED" }
      - { name: balance_at_death_cents, type: integer, source: system, description: "Snapshot of account balance_cents taken at verification; null until VERIFIED", default: null }
      - { name: accrued_interest_at_death_cents, type: integer, source: system, description: "Interest accrued over [accrual_start_date, date_of_death) per STANDARD rounding, snapshotted at verification; null until VERIFIED", default: null }
      - { name: release_variant, type: enum, source: input, description: "DATE_OF_DEATH | DATE_OF_RELEASE; captured at initiate-release", default: null }
      - { name: release_amount_cents, type: integer, source: computed, description: "Computed by estate_release_amount at initiate-release; null until RELEASE_PENDING", default: null }
      - { name: estate_representative_name, type: string, source: input, description: "Estate representative receiving funds; captured at initiate-release", default: null }
      - { name: initiated_by_user_id, type: string, source: system, description: "X-User-ID of initiate-release caller; null until RELEASE_PENDING", default: null }
      - { name: approved_by_user_id, type: string, source: system, description: "X-User-ID of approve-release caller; null until RELEASED", default: null }

  - name: GarnishmentOrder
    parent: DepositAccount
    common_fields: true
    fields:
      - { name: account_id, type: string, source: system, description: "FK -> DepositAccount.id" }
      - { name: order_type, type: enum, source: input, description: "GARNISHMENT | TAX_LEVY | CHILD_SUPPORT" }
      - { name: creditor_name, type: string, source: input, description: "Creditor or levying authority" }
      - { name: amount_cents, type: integer, source: input, description: "Claimed amount (> 0)" }
      - { name: served_date, type: string, source: input, description: "YYYY-MM-DD the order was served; must be <= current clock date" }
      - { name: answer_deadline_date, type: string, source: computed, description: "served_date + ANSWER_PERIOD_DAYS (20 days)" }
      - { name: exemption_method, type: enum, source: input, description: "FEDERAL_LOOKBACK | STATE_MINIMUM — selects exempt_funds_analysis variant" }
      - { name: held_amount_cents, type: integer, source: system, description: "min(amount_cents, account available_balance_cents at receipt); hold placed atomically at creation" }
      - { name: exempt_amount_cents, type: integer, source: computed, description: "Protected funds per exempt_funds_analysis (variant per exemption_method)" }
      - { name: collectible_cents, type: integer, source: computed, description: "max(0, held_amount_cents - exempt_amount_cents)" }
      - { name: remitted_amount_cents, type: integer, source: system, description: "Amount sent to creditor at resolve; 0 until REMITTED", default: 0 }
      - { name: released_amount_cents, type: integer, source: system, description: "Hold returned to available balance at resolve; 0 until resolved", default: 0 }
      - { name: received_by_user_id, type: string, source: system, description: "X-User-ID of the creating OpsOfficer" }
      - { name: resolved_by_user_id, type: string, source: system, description: "X-User-ID of the resolving OpsManager; null until resolved", default: null }
      - { name: status, type: enum, source: system, description: "FUNDS_HELD | REMITTED | RELEASED" }

  - name: StatementCycle
    parent: DepositAccount
    common_fields: true
    fields:
      - { name: account_id, type: string, source: system, description: "FK -> DepositAccount.id" }
      - { name: cycle_start, type: string, source: input, description: "YYYY-MM-DD; period start (inclusive)" }
      - { name: cycle_end, type: string, source: input, description: "YYYY-MM-DD; period end (exclusive); must be > cycle_start" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | PRODUCED | SUPPRESSED" }
      - { name: suppression_reason, type: enum, source: system, description: "DORMANT | DECEASED | CLOSED; null unless SUPPRESSED", default: null }
      - { name: produced_date, type: string, source: system, description: "Sweep date that produced or suppressed the statement; null while SCHEDULED", default: null }

  - name: ProductConversion
    parent: DepositAccount
    common_fields: true
    fields:
      - { name: account_id, type: string, source: system, description: "FK -> DepositAccount.id" }
      - { name: from_product_code, type: enum, source: system, description: "Snapshot of DepositAccount.product_code at creation" }
      - { name: to_product_code, type: enum, source: input, description: "BASIC_CHECKING | PREMIUM_CHECKING | SAVINGS | MONEY_MARKET; must differ from from_product_code" }
      - { name: new_rate_bps, type: integer, source: input, description: "Rate applied from effective_date; 0 <= new_rate_bps <= 2000" }
      - { name: effective_date, type: string, source: input, description: "YYYY-MM-DD; must be strictly after the current clock date at creation" }
      - { name: accrued_interest_settled_cents, type: integer, source: computed, description: "Interest settled at execute over [accrual_start_date, effective_date) using the OLD product's rounding variant; null until COMPLETED", default: null }
      - { name: status, type: enum, source: system, description: "SCHEDULED | COMPLETED | CANCELLED" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: DepositAccount
    initial_state: "lifecycle_status=OPEN, restriction_status=NONE"
    terminal_states: ["lifecycle_status=CLOSED"]
    note: "Two parallel state dimensions on one entity. lifecycle_status governs activity/dormancy/closure; restriction_status governs legal posture. Both gate operations independently."
    transitions:
      - from: "lifecycle OPEN"
        to: "lifecycle DORMANT"
        trigger: "POST /bank/ops/daily-sweep (system: dormancy_evaluation — days inactive >= 365)"
        actor: system
        preconditions:
          - "current_date - last_customer_activity_date >= DORMANT_DAYS (365)"
        side_effects:
          - "dormant_since_date = current_date; fees_assessed_count unchanged (episode continues)"
          - "statement_suppression recomputed"
          - "inactivity_fee_assessment runs immediately for the entry fee (fee #1 of the episode)"
          - "increments DepositAccount.version by 1"

      - from: "lifecycle DORMANT"
        to: "lifecycle OPEN"
        trigger: "POST /bank/accounts/{id}/transactions with customer_initiated=true (reactivation)"
        actor: OpsOfficer
        preconditions:
          - "restriction_status == NONE (ERR_ACCOUNT_RESTRICTED)"
        side_effects:
          - "dormant_since_date = null; fees_assessed_count = 0 (episode resets)"
          - "last_customer_activity_date = posted_date"
          - "statement_suppression recomputed"
          - "increments DepositAccount.version by 1"

      - from: "lifecycle DORMANT"
        to: "lifecycle ESCHEAT_PENDING"
        trigger: "POST /bank/ops/daily-sweep (system: dormancy_evaluation — days inactive >= 1095)"
        actor: system
        preconditions:
          - "current_date - last_customer_activity_date >= ESCHEAT_DAYS (1095)"
        side_effects:
          - "statement_suppression recomputed (still DORMANT class)"
          - "increments DepositAccount.version by 1"

      - from: "lifecycle ESCHEAT_PENDING"
        to: "lifecycle OPEN"
        trigger: "POST /bank/accounts/{id}/transactions with customer_initiated=true (owner reclaim)"
        actor: OpsOfficer
        preconditions:
          - "restriction_status == NONE (ERR_ACCOUNT_RESTRICTED)"
        side_effects:
          - "dormant_since_date = null; fees_assessed_count = 0"
          - "last_customer_activity_date = posted_date"
          - "statement_suppression recomputed"
          - "increments DepositAccount.version by 1"

      - from: "lifecycle ESCHEAT_PENDING"
        to: "lifecycle CLOSED"
        trigger: "POST /bank/ops/daily-sweep (system: escheat — days inactive >= 1125)"
        actor: system
        preconditions:
          - "current_date - last_customer_activity_date >= ESCHEAT_CLOSE_DAYS (1125)"
        side_effects:
          - "Interest settled per accrued_interest_settlement (INTEREST_CREDIT txn), then CLOSURE_PAYOUT txn drains balance to 0"
          - "closure_payout_cents = balance + settled interest; closure_payout_destination = STATE_ESCHEAT"
          - "Closure cascade: AuthorizedSigner ACTIVE|SUSPENDED -> REMOVED (ACCOUNT_CLOSED); TitleChangeRequest SUBMITTED -> REJECTED (ACCOUNT_CLOSED); ProductConversion SCHEDULED -> CANCELLED; StatementCycle SCHEDULED -> SUPPRESSED (CLOSED)"
          - "increments DepositAccount.version by 1"

      - from: "lifecycle DORMANT"
        to: "lifecycle CLOSED"
        trigger: "POST /bank/ops/daily-sweep (system: zero-balance auto-close after inactivity_fee_assessment drains balance to exactly 0)"
        actor: system
        preconditions:
          - "balance_cents == 0 immediately after a fee posting in the same sweep"
        side_effects:
          - "closure_payout_cents = 0; closure_payout_destination = OWNER"
          - "Closure cascade (same child set as escheat closure)"
          - "increments DepositAccount.version by 1"
        note: "This is the terminal link of the dormancy cascade: sweep -> DORMANT -> fee -> balance 0 -> CLOSED -> child cancellations."

      - from: "lifecycle OPEN or DORMANT or ESCHEAT_PENDING"
        to: "lifecycle CLOSED"
        trigger: "POST /bank/accounts/{id}/close"
        actor: OpsOfficer | OpsManager
        preconditions:
          - "lifecycle_status != CLOSED (ERR_INVALID_STATE)"
          - "OCC: expected_account_version == current version (ERR_STALE_VERSION)"
          - "restriction_status == NONE AND no GarnishmentOrder in FUNDS_HELD AND no DeceasedCase in REPORTED|VERIFIED|RELEASE_PENDING AND no TitleChangeRequest in SUBMITTED (ERR_CLOSURE_BLOCKED)"
        side_effects:
          - "Interest settled per accrued_interest_settlement over [accrual_start_date, close date) (INTEREST_CREDIT txn), then CLOSURE_PAYOUT txn drains balance to 0"
          - "closure_payout_cents = pre-close balance + settled interest; closure_payout_destination = OWNER"
          - "Closure cascade (same child set as escheat closure)"
          - "increments DepositAccount.version by 1"

      - from: "restriction NONE"
        to: "restriction LEGAL_HOLD"
        trigger: "POST /bank/accounts/{id}/garnishments (hold placed atomically at receipt)"
        actor: OpsOfficer
        preconditions: []
        side_effects:
          - "total_held_cents and available_balance_cents recomputed"
          - "increments DepositAccount.version by 1"

      - from: "restriction LEGAL_HOLD"
        to: "restriction NONE"
        trigger: "POST /bank/garnishments/{orderId}/resolve (system: when no GarnishmentOrder remains in FUNDS_HELD)"
        actor: system
        preconditions:
          - "count of GarnishmentOrder in FUNDS_HELD for account == 0 after this resolve"
        side_effects:
          - "total_held_cents and available_balance_cents recomputed"
          - "increments DepositAccount.version by 1"

      - from: "restriction NONE"
        to: "restriction DECEASED_HOLD"
        trigger: "POST /bank/deceased-cases/{caseId}/verify"
        actor: OpsManager
        preconditions: []
        side_effects:
          - "Signer suspension cascade: every AuthorizedSigner in ACTIVE on this account -> SUSPENDED (removed_reason unchanged)"
          - "Title auto-reject: every TitleChangeRequest in SUBMITTED on this account -> REJECTED with decision_reason DECEASED_ACCOUNT"
          - "statement_suppression recomputed (DECEASED)"
          - "increments DepositAccount.version by 1"
        note: "Deceased chain: case VERIFIED -> account DECEASED_HOLD -> signers SUSPENDED / title requests REJECTED."

      - from: "restriction DECEASED_HOLD"
        to: "restriction NONE"
        trigger: "POST /bank/deceased-cases/{caseId}/approve-release (estate release closes the account in the same action)"
        actor: OpsManager
        preconditions: []
        side_effects:
          - "Cleared only as part of the estate-release closure; account proceeds to lifecycle CLOSED atomically"

  - entity: AccountTransaction
    initial_state: POSTED
    terminal_states: [POSTED]
    note: "Append-only event log (common_fields: false). No update or delete endpoint exists; a posted transaction never changes state."
    transitions: []

  - entity: AuthorizedSigner
    initial_state: ACTIVE
    terminal_states: [REMOVED]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "system (cascade from DepositAccount entering restriction DECEASED_HOLD)"
        actor: system
        preconditions: []
        side_effects: []

      - from: ACTIVE
        to: REMOVED
        trigger: "POST /bank/signers/{signerId}/remove"
        actor: OpsOfficer | OpsManager
        preconditions:
          - "signer status == ACTIVE (ERR_INVALID_STATE)"
          - "account lifecycle_status != CLOSED (ERR_INVALID_STATE)"
        side_effects:
          - "removed_reason = STAFF_REQUEST"

      - from: SUSPENDED
        to: REMOVED
        trigger: "POST /bank/signers/{signerId}/remove OR system closure cascade"
        actor: OpsOfficer | OpsManager | system
        preconditions: []
        side_effects:
          - "removed_reason = STAFF_REQUEST (manual) or DECEASED_CASCADE/ACCOUNT_CLOSED (cascade)"

  - entity: AccountDocument
    initial_state: SUBMITTED
    terminal_states: [VERIFIED, REJECTED]
    transitions:
      - from: SUBMITTED
        to: VERIFIED
        trigger: "POST /bank/documents/{documentId}/review with decision=VERIFIED"
        actor: OpsManager
        preconditions:
          - "document status == SUBMITTED (ERR_INVALID_STATE)"
        side_effects:
          - "reviewed_by_user_id = caller X-User-ID; review_note stored"

      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /bank/documents/{documentId}/review with decision=REJECTED"
        actor: OpsManager
        preconditions:
          - "document status == SUBMITTED (ERR_INVALID_STATE)"
        side_effects:
          - "reviewed_by_user_id = caller X-User-ID; review_note stored"

  - entity: TitleChangeRequest
    initial_state: SUBMITTED
    terminal_states: [APPROVED]
    note: "Cyclic resubmission loop: REJECTED -> SUBMITTED allowed any number of times; APPROVED is terminal."
    transitions:
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /bank/title-changes/{requestId}/approve"
        actor: OpsManager
        preconditions:
          - "request status == SUBMITTED (ERR_INVALID_STATE)"
          - "account lifecycle_status == OPEN AND restriction_status == NONE (ERR_ACCOUNT_RESTRICTED)"
          - "Every doc_type in required_doc_types has a VERIFIED AccountDocument on the account (ERR_DOCUMENTS_INCOMPLETE)"
          - "caller X-User-ID != created_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "account.ownership_type = requested_ownership_type; pod_beneficiary_name updated when requested == POD"
          - "decided_by_user_id = caller; increments DepositAccount.version by 1"

      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /bank/title-changes/{requestId}/reject OR system cascade (DECEASED_ACCOUNT / ACCOUNT_CLOSED)"
        actor: OpsManager | system
        preconditions:
          - "request status == SUBMITTED (ERR_INVALID_STATE)"
        side_effects:
          - "decision_reason stored; decided_by_user_id = caller when manual"

      - from: REJECTED
        to: SUBMITTED
        trigger: "POST /bank/title-changes/{requestId}/resubmit"
        actor: OpsOfficer
        preconditions:
          - "request status == REJECTED (ERR_INVALID_STATE)"
          - "account lifecycle_status == OPEN AND restriction_status == NONE (ERR_ACCOUNT_RESTRICTED)"
          - "No other TitleChangeRequest in SUBMITTED on the account (ERR_ACTIVE_REQUEST_EXISTS)"
        side_effects:
          - "required_doc_types recomputed; decision_reason cleared; decided_by_user_id = null"

  - entity: DeceasedCase
    initial_state: REPORTED
    terminal_states: [RELEASED]
    transitions:
      - from: REPORTED
        to: VERIFIED
        trigger: "POST /bank/deceased-cases/{caseId}/verify"
        actor: OpsManager
        preconditions:
          - "case status == REPORTED (ERR_INVALID_STATE)"
          - "Account has a VERIFIED AccountDocument with doc_type == DEATH_CERTIFICATE (ERR_DOCUMENTS_INCOMPLETE)"
        side_effects:
          - "balance_at_death_cents = account balance_cents; accrued_interest_at_death_cents per accrued_interest_settlement over [accrual_start_date, date_of_death) STANDARD rounding"
          - "account restriction_status -> DECEASED_HOLD (cascades: signers SUSPENDED, SUBMITTED title requests REJECTED, statement_suppression = DECEASED)"
          - "increments DepositAccount.version by 1"

      - from: VERIFIED
        to: RELEASE_PENDING
        trigger: "POST /bank/deceased-cases/{caseId}/initiate-release"
        actor: OpsOfficer
        preconditions:
          - "case status == VERIFIED (ERR_INVALID_STATE)"
          - "Account has a VERIFIED AccountDocument with doc_type == LETTERS_TESTAMENTARY (ERR_DOCUMENTS_INCOMPLETE)"
        side_effects:
          - "release_amount_cents computed per estate_release_amount using release_variant"
          - "initiated_by_user_id = caller X-User-ID"

      - from: RELEASE_PENDING
        to: RELEASED
        trigger: "POST /bank/deceased-cases/{caseId}/approve-release"
        actor: OpsManager
        preconditions:
          - "case status == RELEASE_PENDING (ERR_INVALID_STATE)"
          - "caller X-User-ID != initiated_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "ESTATE_RELEASE transaction debits release_amount_cents (balance -> balance - release_amount)"
          - "Residual sweep: if balance remains > 0 (e.g., post-death credits under DATE_OF_DEATH variant), a CLOSURE_PAYOUT transaction of the remaining balance posts, destination ESTATE"
          - "account lifecycle -> CLOSED: closure_payout_cents = release_amount_cents + residual swept, closure_payout_destination = ESTATE; conservation invariant: balance before approve == release_amount_cents + residual_cents AND final balance == 0"
          - "Closure cascade: signers -> REMOVED (DECEASED_CASCADE), SUBMITTED title requests -> REJECTED (ACCOUNT_CLOSED), SCHEDULED conversions -> CANCELLED, SCHEDULED statement cycles -> SUPPRESSED (CLOSED)"
          - "approved_by_user_id = caller; increments DepositAccount.version by 1"

  - entity: GarnishmentOrder
    initial_state: FUNDS_HELD
    terminal_states: [REMITTED, RELEASED]
    note: "Branching fork: REMIT debits collectible funds and releases the remainder of the hold; RELEASE returns the entire hold. Divergent side-effect sets per branch."
    transitions:
      - from: FUNDS_HELD
        to: REMITTED
        trigger: "POST /bank/garnishments/{orderId}/resolve with resolution=REMITTED"
        actor: OpsManager
        preconditions:
          - "order status == FUNDS_HELD (ERR_INVALID_STATE)"
          - "caller X-User-ID != received_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
          - "current clock date > answer_deadline_date (ERR_ANSWER_PERIOD_NOT_ELAPSED)"
          - "remit_amount_cents (default collectible_cents) <= collectible_cents (ERR_AMOUNT_EXCEEDS_COLLECTIBLE)"
        side_effects:
          - "LEGAL_REMITTANCE txn debits remitted amount from account balance"
          - "remitted_amount_cents = remit amount; released_amount_cents = held_amount_cents - remitted_amount_cents"
          - "account total_held_cents -= held_amount_cents; available recomputed; restriction -> NONE if no other FUNDS_HELD orders"
          - "increments DepositAccount.version by 1"

      - from: FUNDS_HELD
        to: RELEASED
        trigger: "POST /bank/garnishments/{orderId}/resolve with resolution=RELEASED"
        actor: OpsManager
        preconditions:
          - "order status == FUNDS_HELD (ERR_INVALID_STATE)"
          - "caller X-User-ID != received_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "No ledger txn; released_amount_cents = held_amount_cents; remitted stays 0"
          - "account total_held_cents -= held_amount_cents; available recomputed; restriction -> NONE if no other FUNDS_HELD orders"
          - "increments DepositAccount.version by 1"

  - entity: StatementCycle
    initial_state: SCHEDULED
    terminal_states: [PRODUCED, SUPPRESSED]
    transitions:
      - from: SCHEDULED
        to: PRODUCED
        trigger: "POST /bank/ops/daily-sweep (system: statement production for cycles with cycle_end <= sweep date)"
        actor: system
        preconditions:
          - "cycle_end <= sweep date"
          - "account statement_suppression == NONE"
        side_effects:
          - "produced_date = sweep date"

      - from: SCHEDULED
        to: SUPPRESSED
        trigger: "POST /bank/ops/daily-sweep (system: posture suppression) OR account closure cascade"
        actor: system
        preconditions:
          - "sweep path: cycle_end <= sweep date AND account statement_suppression != NONE"
          - "closure path: account transitioned to CLOSED"
        side_effects:
          - "suppression_reason = DORMANT | DECEASED | CLOSED per account posture; produced_date = sweep/closure date"

  - entity: ProductConversion
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /bank/conversions/{conversionId}/execute"
        actor: OpsOfficer | System
        preconditions:
          - "conversion status == SCHEDULED (ERR_INVALID_STATE)"
          - "current clock date >= effective_date (ERR_CONVERSION_NOT_DUE)"
          - "account lifecycle_status in {OPEN, DORMANT, ESCHEAT_PENDING} AND restriction_status != DECEASED_HOLD (ERR_INVALID_STATE / ERR_ACCOUNT_RESTRICTED)"
        side_effects:
          - "accrued_interest_settled_cents per accrued_interest_settlement over [accrual_start_date, effective_date) using OLD product's rounding variant; INTEREST_CREDIT txn posts it"
          - "account.product_code = to_product_code; account.rate_bps = new_rate_bps; account.accrual_start_date = effective_date"
          - "increments DepositAccount.version by 1"

      - from: SCHEDULED
        to: CANCELLED
        trigger: "system (account closure cascade only — no manual cancel endpoint)"
        actor: system
        preconditions:
          - "account lifecycle transitioned to CLOSED"
        side_effects: []

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on parent version only)
# =============================================================================
concurrency_rules:
  - rule_id: title-change-stale-account
    parent_entity: DepositAccount
    write_endpoint: "POST /bank/accounts/{id}/title-changes"
    occ_field: expected_account_version
    description: |
      Creating a TitleChangeRequest against a DepositAccount whose version has
      advanced since the client last observed it is rejected. The request is
      registered against the account (bumping its version), so a creator working
      from a stale account view must re-read before filing.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: close-stale-account
    parent_entity: DepositAccount
    write_endpoint: "POST /bank/accounts/{id}/close"
    occ_field: expected_account_version
    description: |
      Closing a DepositAccount whose version has advanced since the officer last
      reviewed it is rejected. Intervening mutations (holds, fees, transactions)
      change the residual payout basis, so closure requires the version the
      officer actually reviewed.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: exempt_funds_analysis
    trigger: "GarnishmentOrder creation (analysis runs atomically at receipt)"
    algorithm: threshold
    formula: |
      Inputs: account.balance_cents (B), account.available_balance_cents (AV),
              order.amount_cents (CLAIM), federal benefit deposits in lookback.
      lookback_start = served_date - LOOKBACK_DAYS
      benefit_total = sum of AccountTransaction.amount_cents where
        account_id == order.account_id AND txn_type == FEDERAL_BENEFIT_DEPOSIT
        AND lookback_start <= posted_date <= served_date   (closed window)
      held_amount_cents   = min(CLAIM, AV)
      variant FEDERAL_LOOKBACK: exempt_amount_cents = min(B, benefit_total)
      variant STATE_MINIMUM:    exempt_amount_cents = min(B, max(STATE_EXEMPT_FLOOR_CENTS, benefit_total))
      collectible_cents = max(0, held_amount_cents - exempt_amount_cents)
    input_set: "AccountTransactions of the account with txn_type == FEDERAL_BENEFIT_DEPOSIT and posted_date inside the closed lookback window; all other txn types excluded"
    constants:
      LOOKBACK_DAYS: 60
      ANSWER_PERIOD_DAYS: 20
      STATE_EXEMPT_FLOOR_CENTS: 100000
    precision: "integer cents; no rounding"
    variants:
      - name: FEDERAL_LOOKBACK
        when: "order.exemption_method == FEDERAL_LOOKBACK (31 CFR 212-style)"
        difference: "exempt = min(balance, benefit_total) — no floor"
      - name: STATE_MINIMUM
        when: "order.exemption_method == STATE_MINIMUM"
        difference: "exempt = min(balance, max(STATE_EXEMPT_FLOOR_CENTS, benefit_total)) — floor of $1000 even when benefit_total is lower"

  - name: accrued_interest_settlement
    trigger: "ProductConversion execute; DepositAccount close/escheat; DeceasedCase verify (snapshot at death)"
    algorithm: chronological
    formula: |
      Window: half-open [accrual_start_date, settlement_date); one accrual step per
      calendar day d with accrual_start_date <= d < settlement_date.
      balance(d) = end-of-day balance on day d = balance_after_cents of the last
        AccountTransaction with posted_date <= d (carry forward; opening balance
        before any txn is 0); all txn types move balance.
      raw_daily(d) = balance(d) * rate_bps / 10000 / 365   (exact rational)
      STANDARD variant (products BASIC_CHECKING, PREMIUM_CHECKING, SAVINGS):
        total = sum over d of round_half_up(raw_daily(d))   — round PER DAY, then sum
      SIMPLE variant (product MONEY_MARKET):
        total = round_half_up(sum over d of raw_daily(d))   — sum raw, then round ONCE
      Rounding order is pinned per variant above; the two variants differ in cents
      for the same balance series.
    input_set: "All posted AccountTransactions of the account regardless of txn_type; rate is the account's rate_bps in force during the window"
    constants:
      DAYS_IN_YEAR: 365
    precision: "integer cents, round_half_up at the pinned step"
    variants:
      - name: STANDARD
        when: "product in {BASIC_CHECKING, PREMIUM_CHECKING, SAVINGS}"
        difference: "round each day's interest to cents, then sum"
      - name: SIMPLE
        when: "product == MONEY_MARKET"
        difference: "sum exact daily amounts, round once at the end"

  - name: inactivity_fee_assessment
    trigger: "POST /bank/ops/daily-sweep, for each account in lifecycle DORMANT"
    algorithm: threshold
    formula: |
      The OPEN -> DORMANT transition itself assesses fee #1 immediately (entry fee).
      For every later sweep, the number of fees that SHOULD have been assessed in
      the current dormancy episode by sweep_date is pinned as:
        should_have = 1 + floor((sweep_date - dormant_since_date) / FEE_PERIOD_DAYS)
      fees_due_now = max(0, should_have - fees_assessed_count)
      Each due fee is applied sequentially:
        fee_i = min(INACTIVITY_FEE_CENTS, balance_cents)   — fee never overdrives balance
        if fee_i == 0: stop (a zero-amount fee is never posted)
        post INACTIVITY_FEE txn of fee_i; fees_assessed_count += 1
      If balance_cents == 0 after the fee postings and lifecycle == DORMANT:
        lifecycle -> CLOSED (zero-balance auto-close, closure_payout 0, OWNER)
    input_set: "Accounts with lifecycle_status == DORMANT at sweep time"
    constants:
      INACTIVITY_FEE_CENTS: 500
      FEE_PERIOD_DAYS: 30
    precision: "integer cents"

  - name: dormancy_evaluation
    trigger: "POST /bank/ops/daily-sweep"
    algorithm: threshold
    formula: |
      days_inactive = sweep_date - last_customer_activity_date   (calendar days)
      lifecycle OPEN  and days_inactive >= DORMANT_DAYS (365)  -> DORMANT
      lifecycle DORMANT and days_inactive >= ESCHEAT_DAYS (1095) -> ESCHEAT_PENDING
      lifecycle ESCHEAT_PENDING and days_inactive >= ESCHEAT_CLOSE_DAYS (1125) -> CLOSED (escheat)
      Boundary is inclusive: days_inactive == 365 transitions to DORMANT.
    input_set: "Accounts with lifecycle_status in {OPEN, DORMANT, ESCHEAT_PENDING}; CLOSED excluded"
    constants:
      DORMANT_DAYS: 365
      ESCHEAT_DAYS: 1095
      ESCHEAT_CLOSE_DAYS: 1125
    precision: "whole calendar days"

  - name: estate_release_amount
    trigger: "DeceasedCase initiate-release"
    algorithm: aggregation
    formula: |
      Variant DATE_OF_DEATH (funds quarantined at death):
        release_amount_cents = balance_at_death_cents + accrued_interest_at_death_cents
      Variant DATE_OF_RELEASE (estate receives everything through release):
        release_amount_cents = account.balance_cents (current)
          + accrued_interest_settlement STANDARD over [accrual_start_date, current clock date)
      Preconditions pinned: at initiate time no GarnishmentOrder may be FUNDS_HELD on
      the account (ERR_CLOSURE_BLOCKED otherwise), so current balance is unencumbered.
    input_set: "Snapshot fields captured at verification (DATE_OF_DEATH) or live account fields (DATE_OF_RELEASE)"
    constants: {}
    precision: "integer cents"
    variants:
      - name: DATE_OF_DEATH
        when: "initiate-release with release_variant == DATE_OF_DEATH"
        difference: "uses frozen snapshots; post-death deposits and later interest excluded"
      - name: DATE_OF_RELEASE
        when: "initiate-release with release_variant == DATE_OF_RELEASE"
        difference: "uses live balance plus interest accrued through the release date"

  - name: available_balance_reconciliation
    trigger: "GarnishmentOrder create/resolve; any transaction posting"
    algorithm: aggregation
    formula: |
      total_held_cents = sum of held_amount_cents over GarnishmentOrder
        where account_id == account AND status == FUNDS_HELD   (status filter pinned)
      available_balance_cents = balance_cents - total_held_cents
    input_set: "GarnishmentOrders of the account in status FUNDS_HELD only; REMITTED/RELEASED excluded"
    constants: {}
    precision: "integer cents"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and role is a declared role"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: "all"

  - priority: 2
    category: auth
    check: "Caller role is listed in the endpoint's roles"
    error_id: ERR_FORBIDDEN_FOR_ROLE
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "Every path id resolves to an existing resource (left-to-right)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all resource endpoints"

  - priority: 4
    category: existence
    check: "Request shape: required fields present, enum members valid, amounts positive, POD beneficiary present iff ownership_type/requested == POD, requested type differs from current, cycle_start < cycle_end"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all mutating endpoints"

  - priority: 5
    category: state
    check: "Target resource state permits the transition (lifecycle, case/order/request/cycle/conversion status); OCC expected_account_version matches current version"
    error_id: "ERR_INVALID_STATE (409) | ERR_STALE_VERSION (412)"
    http_status: 409
    applies_to: "all action endpoints"

  - priority: 6
    category: business_safety
    check: "Compliance gates: restriction_status blocks withdrawals/title changes/conversions (ERR_ACCOUNT_RESTRICTED); segregation of duties (approver != creator/initiator/receiver); closure blocked by garnishment in FUNDS_HELD, deceased case in REPORTED|VERIFIED|RELEASE_PENDING, or title change in SUBMITTED (ERR_CLOSURE_BLOCKED); required compliance documents VERIFIED (ERR_DOCUMENTS_INCOMPLETE)"
    error_id: "ERR_ACCOUNT_RESTRICTED | ERR_SEGREGATION_OF_DUTIES | ERR_CLOSURE_BLOCKED | ERR_DOCUMENTS_INCOMPLETE"
    http_status: 409
    applies_to: "transactions, title-changes, deceased flows, garnishment resolve, conversions, close, signers"

  - priority: 7
    category: business_constraint
    check: "Uniqueness and interval constraints: at most one SUBMITTED TitleChangeRequest, one REPORTED|VERIFIED|RELEASE_PENDING DeceasedCase, and one SCHEDULED ProductConversion per account (ERR_ACTIVE_REQUEST_EXISTS); document reference_number unique per account (ERR_DUPLICATE_REFERENCE); statement cycle half-open overlap (ERR_STATEMENT_PERIOD_OVERLAP); garnishment closed service-window conflict (ERR_LEGAL_ORDER_WINDOW_CONFLICT)"
    error_id: "ERR_ACTIVE_REQUEST_EXISTS | ERR_DUPLICATE_REFERENCE | ERR_STATEMENT_PERIOD_OVERLAP | ERR_LEGAL_ORDER_WINDOW_CONFLICT"
    http_status: 409
    applies_to: "create endpoints for child collections"

  - priority: 8
    category: business_temporal
    check: "Clock-relative rules: served_date <= today and date_of_death <= today (ERR_DATE_RANGE_INVALID); conversion effective_date > today at create (ERR_EFFECTIVE_DATE_NOT_FUTURE); execute requires today >= effective_date (ERR_CONVERSION_NOT_DUE); remit requires today > answer_deadline_date (ERR_ANSWER_PERIOD_NOT_ELAPSED)"
    error_id: "ERR_DATE_RANGE_INVALID | ERR_EFFECTIVE_DATE_NOT_FUTURE | ERR_CONVERSION_NOT_DUE | ERR_ANSWER_PERIOD_NOT_ELAPSED"
    http_status: 409
    applies_to: "garnishments, deceased-cases, conversions, resolve"

  - priority: 9
    category: business_fiscal
    check: "Funds sufficiency: WITHDRAWAL amount <= available_balance_cents (ERR_INSUFFICIENT_AVAILABLE_FUNDS); remit override <= collectible_cents (ERR_AMOUNT_EXCEEDS_COLLECTIBLE)"
    error_id: "ERR_INSUFFICIENT_AVAILABLE_FUNDS | ERR_AMOUNT_EXCEEDS_COLLECTIBLE"
    http_status: 409
    applies_to: "transactions, garnishment resolve"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- DepositAccount ---
  - method: POST
    path: "/bank/accounts"
    description: "Open a deposit account. Posts the opening deposit as a customer_initiated DEPOSIT transaction (sets last_customer_activity_date to the clock date)."
    roles: [OpsOfficer, OpsManager]
    code: 201
    input: [primary_owner_name, owner_tax_id, ownership_type, product_code, rate_bps, opening_deposit_cents, "pod_beneficiary_name?"]
    output: DepositAccount
    side_effects: ["lifecycle_status=OPEN, restriction_status=NONE", "DEPOSIT AccountTransaction posted for opening_deposit_cents (customer_initiated=true)", "balance_cents = opening_deposit_cents", "accrual_start_date = clock date", "version = 1"]

  - method: GET
    path: "/bank/accounts/{id}"
    description: "Get one account"
    roles: [OpsOfficer, OpsManager, Auditor, System]
    code: 200
    input: []
    output: DepositAccount
    side_effects: []

  - method: GET
    path: "/bank/accounts"
    description: "List accounts with pagination and filters"
    roles: [OpsOfficer, OpsManager, Auditor, System]
    code: 200
    input: ["status?", "ownership_type?", "limit?", "offset?"]
    output: DepositAccount[]
    side_effects: []

  - method: POST
    path: "/bank/accounts/{id}/close"
    description: "Close an account: settles accrued interest, drains residual as closure payout, runs closure cascade. OCC-guarded."
    roles: [OpsOfficer, OpsManager]
    code: 200
    input: [expected_account_version]
    output: DepositAccount
    side_effects: ["lifecycle_status -> CLOSED", "INTEREST_CREDIT then CLOSURE_PAYOUT transactions", "closure_payout_cents and closure_payout_destination set", "closure cascade over signers/title requests/conversions/statement cycles", "increments DepositAccount.version by 1"]

  # --- AccountTransaction ---
  - method: POST
    path: "/bank/accounts/{id}/transactions"
    description: "Post a customer-facing transaction (DEPOSIT | WITHDRAWAL | FEDERAL_BENEFIT_DEPOSIT). Credits are accepted under any restriction; WITHDRAWAL is blocked whenever restriction_status != NONE (ERR_ACCOUNT_RESTRICTED). Customer-initiated txns on DORMANT/ESCHEAT_PENDING accounts reactivate them to OPEN (requires restriction NONE)."
    roles: [OpsOfficer, System]
    code: 201
    input: [txn_type, amount_cents, "customer_initiated?", "posted_date?"]
    output: AccountTransaction
    side_effects: ["balance_cents updated", "available_balance_cents recomputed", "if customer_initiated: last_customer_activity_date = posted_date and lifecycle DORMANT|ESCHEAT_PENDING -> OPEN", "increments DepositAccount.version by 1"]

  - method: GET
    path: "/bank/accounts/{id}/transactions"
    description: "List transactions of an account"
    roles: [OpsOfficer, OpsManager, Auditor, System]
    code: 200
    input: ["txn_type?", "limit?", "offset?"]
    output: AccountTransaction[]
    side_effects: []

  # --- AuthorizedSigner ---
  - method: POST
    path: "/bank/accounts/{id}/signers"
    description: "Add an authorized signer; requires a VERIFIED SIGNATURE_CARD document whose reference_number equals signature_card_reference."
    roles: [OpsOfficer]
    code: 201
    input: [full_name, tax_id, signer_role, signature_card_reference]
    output: AuthorizedSigner
    side_effects: ["status = ACTIVE"]

  - method: POST
    path: "/bank/signers/{signerId}/remove"
    description: "Remove a signer (ACTIVE or SUSPENDED -> REMOVED, reason STAFF_REQUEST)"
    roles: [OpsOfficer, OpsManager]
    code: 200
    input: []
    output: AuthorizedSigner
    side_effects: ["status -> REMOVED", "removed_reason = STAFF_REQUEST"]

  - method: GET
    path: "/bank/accounts/{id}/signers"
    description: "List signers of an account"
    roles: [OpsOfficer, OpsManager, Auditor, System]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: AuthorizedSigner[]
    side_effects: []

  # --- AccountDocument ---
  - method: POST
    path: "/bank/accounts/{id}/documents"
    description: "Submit a document onto an account"
    roles: [OpsOfficer]
    code: 201
    input: [doc_type, reference_number]
    output: AccountDocument
    side_effects: ["status = SUBMITTED"]

  - method: POST
    path: "/bank/documents/{documentId}/review"
    description: "Review a submitted document (decision VERIFIED or REJECTED)"
    roles: [OpsManager]
    code: 200
    input: [decision, "review_note?"]
    output: AccountDocument
    side_effects: ["status -> decision", "reviewed_by_user_id recorded"]

  - method: GET
    path: "/bank/accounts/{id}/documents"
    description: "List documents on an account"
    roles: [OpsOfficer, OpsManager, Auditor, System]
    code: 200
    input: ["doc_type?", "status?", "limit?", "offset?"]
    output: AccountDocument[]
    side_effects: []

  # --- TitleChangeRequest ---
  - method: POST
    path: "/bank/accounts/{id}/title-changes"
    description: "File a title (ownership) change request. OCC-guarded; computes required_doc_types from requested_ownership_type."
    roles: [OpsOfficer]
    code: 201
    input: [requested_ownership_type, expected_account_version, "pod_beneficiary_name?"]
    output: TitleChangeRequest
    side_effects: ["status = SUBMITTED", "required_doc_types computed", "increments DepositAccount.version by 1"]

  - method: POST
    path: "/bank/title-changes/{requestId}/approve"
    description: "Approve a title change (manager; cannot be the creator). Applies the new ownership_type to the account."
    roles: [OpsManager]
    code: 200
    input: []
    output: TitleChangeRequest
    side_effects: ["status -> APPROVED", "account ownership_type updated", "increments DepositAccount.version by 1"]

  - method: POST
    path: "/bank/title-changes/{requestId}/reject"
    description: "Reject a title change with a reason"
    roles: [OpsManager]
    code: 200
    input: [reason]
    output: TitleChangeRequest
    side_effects: ["status -> REJECTED", "decision_reason = reason"]

  - method: POST
    path: "/bank/title-changes/{requestId}/resubmit"
    description: "Resubmit a REJECTED title change back to SUBMITTED"
    roles: [OpsOfficer]
    code: 200
    input: []
    output: TitleChangeRequest
    side_effects: ["status -> SUBMITTED", "required_doc_types recomputed", "decision_reason cleared"]

  - method: GET
    path: "/bank/accounts/{id}/title-changes"
    description: "List title change requests of an account"
    roles: [OpsOfficer, OpsManager, Auditor, System]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: TitleChangeRequest[]
    side_effects: []

  # --- DeceasedCase ---
  - method: POST
    path: "/bank/accounts/{id}/deceased-cases"
    description: "Report a deceased account owner (opens a DeceasedCase in REPORTED)"
    roles: [OpsOfficer]
    code: 201
    input: [decedent_name, date_of_death, reported_by]
    output: DeceasedCase
    side_effects: ["status = REPORTED"]

  - method: POST
    path: "/bank/deceased-cases/{caseId}/verify"
    description: "Verify a death report (requires VERIFIED DEATH_CERTIFICATE on the account); snapshots balances and cascades the deceased restriction."
    roles: [OpsManager]
    code: 200
    input: []
    output: DeceasedCase
    side_effects: ["status -> VERIFIED", "balance_at_death_cents and accrued_interest_at_death_cents snapshots", "account restriction -> DECEASED_HOLD with signer/title/statement cascade", "increments DepositAccount.version by 1"]

  - method: POST
    path: "/bank/deceased-cases/{caseId}/initiate-release"
    description: "Initiate estate release (requires VERIFIED LETTERS_TESTAMENTARY); computes release_amount_cents per release_variant."
    roles: [OpsOfficer]
    code: 200
    input: [release_variant, estate_representative_name]
    output: DeceasedCase
    side_effects: ["status -> RELEASE_PENDING", "release_amount_cents computed", "initiated_by_user_id recorded"]

  - method: POST
    path: "/bank/deceased-cases/{caseId}/approve-release"
    description: "Approve estate release (manager; cannot be the initiator). Debits the release, closes the account to the estate."
    roles: [OpsManager]
    code: 200
    input: []
    output: DeceasedCase
    side_effects: ["status -> RELEASED", "ESTATE_RELEASE transaction", "account -> CLOSED with closure_payout_destination ESTATE", "closure cascade", "increments DepositAccount.version by 1"]

  - method: GET
    path: "/bank/accounts/{id}/deceased-cases"
    description: "List deceased cases of an account"
    roles: [OpsOfficer, OpsManager, Auditor, System]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: DeceasedCase[]
    side_effects: []

  # --- GarnishmentOrder ---
  - method: POST
    path: "/bank/accounts/{id}/garnishments"
    description: "Register a garnishment/levy. Places the hold atomically and runs exempt_funds_analysis per exemption_method. Rejects on closed service-window conflict with an existing FUNDS_HELD order."
    roles: [OpsOfficer]
    code: 201
    input: [order_type, creditor_name, amount_cents, served_date, exemption_method]
    output: GarnishmentOrder
    side_effects: ["status = FUNDS_HELD", "held/exempt/collectible computed", "account restriction -> LEGAL_HOLD", "increments DepositAccount.version by 1"]

  - method: POST
    path: "/bank/garnishments/{orderId}/resolve"
    description: "Resolve a held order: resolution REMITTED (after answer deadline; optional remit_amount_cents override <= collectible) or RELEASED (full hold released). Resolver cannot be the receiver."
    roles: [OpsManager]
    code: 200
    input: [resolution, "remit_amount_cents?"]
    output: GarnishmentOrder
    side_effects: ["status -> REMITTED|RELEASED", "REMITTED posts LEGAL_REMITTANCE txn and releases hold remainder", "account totals recomputed; restriction -> NONE when last hold clears", "increments DepositAccount.version by 1"]

  - method: GET
    path: "/bank/accounts/{id}/garnishments"
    description: "List garnishment orders of an account"
    roles: [OpsOfficer, OpsManager, Auditor, System]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: GarnishmentOrder[]
    side_effects: []

  # --- StatementCycle ---
  - method: POST
    path: "/bank/accounts/{id}/statement-cycles"
    description: "Schedule a statement cycle. Half-open period [cycle_start, cycle_end); overlap with any existing cycle rejected, adjacency allowed."
    roles: [OpsOfficer, System]
    code: 201
    input: [cycle_start, cycle_end]
    output: StatementCycle
    side_effects: ["status = SCHEDULED"]

  - method: GET
    path: "/bank/accounts/{id}/statement-cycles"
    description: "List statement cycles of an account"
    roles: [OpsOfficer, OpsManager, Auditor, System]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: StatementCycle[]
    side_effects: []

  # --- ProductConversion ---
  - method: POST
    path: "/bank/accounts/{id}/conversions"
    description: "Schedule a rate/product conversion with a future effective_date"
    roles: [OpsOfficer]
    code: 201
    input: [to_product_code, new_rate_bps, effective_date]
    output: ProductConversion
    side_effects: ["status = SCHEDULED", "from_product_code snapshot"]

  - method: POST
    path: "/bank/conversions/{conversionId}/execute"
    description: "Execute a due conversion: settles old-product accrued interest, applies new product and rate."
    roles: [OpsOfficer, System]
    code: 200
    input: []
    output: ProductConversion
    side_effects: ["status -> COMPLETED", "INTEREST_CREDIT txn for accrued_interest_settled_cents", "account product_code/rate_bps updated; accrual_start_date = effective_date", "increments DepositAccount.version by 1"]

  - method: GET
    path: "/bank/accounts/{id}/conversions"
    description: "List conversions of an account"
    roles: [OpsOfficer, OpsManager, Auditor, System]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: ProductConversion[]
    side_effects: []

  # --- Ops run & clock ---
  - method: POST
    path: "/bank/ops/daily-sweep"
    description: "Nightly ops run at the current clock date: dormancy evaluation, inactivity fee assessment, zero-balance auto-close, escheat transition and escheat-close, and statement production/suppression for cycles with cycle_end <= sweep date."
    roles: [OpsManager, System]
    code: 200
    input: []
    output: "{ evaluated_accounts: integer, newly_dormant: integer, fees_assessed_count: integer, fees_assessed_cents: integer, auto_closed_count: integer, escheated_count: integer, statements_produced: integer, statements_suppressed: integer }"
    side_effects: ["dormancy_evaluation transitions", "inactivity_fee_assessment postings", "zero-balance and escheat closures with closure cascade", "statement production/suppression"]

  - method: POST
    path: "/bank/_clock/set_current_utc"
    description: "Test-driving logical clock. Sets the server's current UTC instant. Default before any set call is exactly 2026-08-01T00:00:00Z (never wall-clock). All date stamps (posted_date defaults, deadlines, sweep date, dormancy windows) read this clock."
    roles: [OpsManager, System]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["logical clock advanced"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing or role not declared" }
  - { id: ERR_FORBIDDEN_FOR_ROLE, http: 403, condition: "Caller role not permitted for this endpoint" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path id does not resolve to an existing resource" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, invalid enum member, non-positive amount, POD beneficiary missing, requested type equals current, or cycle_start >= cycle_end" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Target resource state does not permit the transition" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_account_version does not match the account's current version (OCC)" }
  - { id: ERR_ACCOUNT_RESTRICTED, http: 409, condition: "restriction_status LEGAL_HOLD or DECEASED_HOLD blocks the operation" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 409, condition: "Caller is the same X-User-ID that performed the upstream step (create/initiate/receive) and cannot perform the approval/resolve step" }
  - { id: ERR_CLOSURE_BLOCKED, http: 409, condition: "Closure or estate initiate-release blocked by garnishment in FUNDS_HELD, deceased case in REPORTED|VERIFIED|RELEASE_PENDING, or title change in SUBMITTED" }
  - { id: ERR_DOCUMENTS_INCOMPLETE, http: 409, condition: "A required document type lacks a VERIFIED AccountDocument on the account (signature card, death certificate, letters testamentary, title docs)" }
  - { id: ERR_ACTIVE_REQUEST_EXISTS, http: 409, condition: "A SUBMITTED TitleChangeRequest, a REPORTED|VERIFIED|RELEASE_PENDING DeceasedCase, or a SCHEDULED ProductConversion already exists on the account" }
  - { id: ERR_DUPLICATE_REFERENCE, http: 409, condition: "AccountDocument reference_number already used on this account" }
  - { id: ERR_STATEMENT_PERIOD_OVERLAP, http: 409, condition: "Half-open [cycle_start, cycle_end) overlaps an existing cycle on the account" }
  - { id: ERR_LEGAL_ORDER_WINDOW_CONFLICT, http: 409, condition: "Closed service window [served_date, answer_deadline_date] overlaps the window of another order in FUNDS_HELD on the account" }
  - { id: ERR_DATE_RANGE_INVALID, http: 409, condition: "served_date or date_of_death is in the future relative to the logical clock" }
  - { id: ERR_EFFECTIVE_DATE_NOT_FUTURE, http: 409, condition: "Conversion effective_date is not strictly after the current clock date" }
  - { id: ERR_CONVERSION_NOT_DUE, http: 409, condition: "Execute attempted before effective_date (current date < effective_date)" }
  - { id: ERR_ANSWER_PERIOD_NOT_ELAPSED, http: 409, condition: "Remit attempted on or before answer_deadline_date (requires current date > answer_deadline_date)" }
  - { id: ERR_INSUFFICIENT_AVAILABLE_FUNDS, http: 409, condition: "WITHDRAWAL amount exceeds available_balance_cents" }
  - { id: ERR_AMOUNT_EXCEEDS_COLLECTIBLE, http: 409, condition: "remit_amount_cents override exceeds collectible_cents" }

# =============================================================================
# §1.7 RBAC Matrix (segregation_of_duties model)
# =============================================================================
roles:
  - name: OpsOfficer
    description: "Deposit operations specialist: opens accounts, posts transactions, maintains signers and documents intake, files title changes and deceased reports, registers garnishments, schedules statements and conversions, initiates estate release"
    identity: opaque
    exclusive_operations:
      - "POST /bank/accounts/{id}/transactions"
      - "POST /bank/accounts/{id}/signers"
      - "POST /bank/accounts/{id}/documents"
      - "POST /bank/accounts/{id}/title-changes"
      - "POST /bank/title-changes/{requestId}/resubmit"
      - "POST /bank/accounts/{id}/deceased-cases"
      - "POST /bank/deceased-cases/{caseId}/initiate-release"
      - "POST /bank/accounts/{id}/garnishments"
    shared_operations:
      - "POST /bank/accounts (with OpsManager)"
      - "POST /bank/accounts/{id}/close (with OpsManager)"
      - "POST /bank/signers/{signerId}/remove (with OpsManager)"
      - "POST /bank/accounts/{id}/statement-cycles (with System)"
      - "POST /bank/accounts/{id}/conversions"
      - "POST /bank/conversions/{conversionId}/execute (with System)"
      - "All GET endpoints (with OpsManager, Auditor, System)"

  - name: OpsManager
    description: "Deposit operations manager: reviews documents, verifies deaths, approves title changes and estate releases, resolves garnishments, runs the daily sweep. Segregation of duties: cannot approve/resolve/verify what the same user initiated."
    identity: opaque
    exclusive_operations:
      - "POST /bank/documents/{documentId}/review"
      - "POST /bank/title-changes/{requestId}/approve"
      - "POST /bank/title-changes/{requestId}/reject"
      - "POST /bank/deceased-cases/{caseId}/verify"
      - "POST /bank/deceased-cases/{caseId}/approve-release"
      - "POST /bank/garnishments/{orderId}/resolve"
    shared_operations:
      - "POST /bank/accounts (with OpsOfficer)"
      - "POST /bank/accounts/{id}/close (with OpsOfficer)"
      - "POST /bank/signers/{signerId}/remove (with OpsOfficer)"
      - "POST /bank/ops/daily-sweep (with System)"
      - "POST /bank/_clock/set_current_utc (with System)"
      - "All GET endpoints (with OpsOfficer, Auditor, System)"

  - name: System
    description: "Automation principal for the nightly sweep, scheduled conversion execution, and statement scheduling"
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "POST /bank/ops/daily-sweep (with OpsManager)"
      - "POST /bank/_clock/set_current_utc (with OpsManager)"
      - "POST /bank/accounts/{id}/statement-cycles (with OpsOfficer)"
      - "POST /bank/conversions/{conversionId}/execute (with OpsOfficer)"
      - "POST /bank/accounts/{id}/transactions (system postings, with OpsOfficer)"
      - "All GET endpoints"

  - name: Auditor
    description: "Read-only oversight role"
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "All GET endpoints (read-only)"
