          difficulty_instance: resource_temporal_overlap / studio_resource_turnaround_exclusion_zone_blocks_adjacent_booking
          rationale: "The adjacent booking inside and outside the turnaround window is exactly that instance's subject."

  # ===========================================================================
  - section: endpoints
    instances:

      - name: corner_studio_resource_crud_and_filtered_listing
        claim_type: standard_crud
        grounds:
          - endpoints[POST /studio-resources]
          - endpoints[GET /studio-resources/{resourceId}]
          - endpoints[GET /studio-resources]
          - entities.StudioResource.fields.status
        distinguishing_aspect: "Creation, single read and filtered listing agree on one row: the list endpoint's resource_class and status filters compose, so a MAINTENANCE studio disappears from a status=AVAILABLE query while still being readable by id."
        test_recipe:
          setup:
            - "Three studio resources exist: STUDIO-A (STUDIO), STUDIO-B (STUDIO) and CAM-KIT (CAMERA_KIT), all AVAILABLE."
          setup_api_calls:
            - call: "POST /studio-resources"
              payload: {resource_code: "STUDIO-A", resource_class: "STUDIO", required_competency_code: "STUDIO_FLOOR", capacity_slots: 1, turnaround_minutes: 30, base_deposit_cents: 12345, replacement_value_cents: 900000}
              as: FacilitiesManager
              as_user_id: "fac-1"
              captures: {a_id: $.data.id, a_status: $.data.status, a_open: $.data.open_reservation_count}
            - call: "POST /studio-resources"
              payload: {resource_code: "STUDIO-B", resource_class: "STUDIO", required_competency_code: "STUDIO_FLOOR", capacity_slots: 2, turnaround_minutes: 15, base_deposit_cents: 20000, replacement_value_cents: 800000}
              as: FacilitiesManager
              as_user_id: "fac-1"
              captures: {b_id: $.data.id}
            - call: "POST /studio-resources"
              payload: {resource_code: "CAM-KIT", resource_class: "CAMERA_KIT", required_competency_code: "EDIT_SUITE", capacity_slots: 1, turnaround_minutes: 0, base_deposit_cents: 5000, replacement_value_cents: 60000}
              as: FacilitiesManager
              as_user_id: "fac-1"
              captures: {k_id: $.data.id}
          trigger:
            - call: "GET /studio-resources/${a_id}"
              payload: {}
              as: FacilitiesManager
              as_user_id: "fac-1"
              captures: {read_code: $.data.resource_code, read_cap: $.data.capacity_slots, read_turn: $.data.turnaround_minutes}
            - call: "GET /studio-resources"
              payload: {resource_class: "STUDIO", limit: 10, offset: 0}
              as: SchedulingCoordinator
              as_user_id: "sch-1"
              captures: {studio_list: $.data, first_class: "$.data[0].resource_class"}
            - call: "POST /studio-resources/${b_id}/status"
              payload: {status: "MAINTENANCE", status_reason: "Floor resurfacing"}
              as: FacilitiesManager
              as_user_id: "fac-1"
              captures: {b_status: $.data.status, b_reason: $.data.status_reason}
            - call: "GET /studio-resources"
              payload: {resource_class: "STUDIO", status: "AVAILABLE", limit: 10, offset: 0}
              as: SchedulingCoordinator
              as_user_id: "sch-1"
              captures: {available_list: $.data, only_id: "$.data[0].id"}
          assert:
            - "${a_status} == AVAILABLE and ${a_open} == 0 at creation; ${read_code} == STUDIO-A, ${read_cap} == 1 and ${read_turn} == 30 on the single read"
            - "${studio_list} holds 2 rows with total_count 2 and ${first_class} == STUDIO — CAM-KIT is filtered out by resource_class"
            - "${b_status} == MAINTENANCE with ${b_reason} == Floor resurfacing"
            - "${available_list} holds exactly 1 row with total_count 1 and ${only_id} == ${a_id} — the two filters compose"
            - "GET /studio-resources/${b_id} still returns the MAINTENANCE row by id, so filtering is a list concern only"

      - name: corner_crew_release_action_frees_commitment_and_restates_staffing
        claim_type: action_endpoint
        grounds:
          - endpoints[POST /crew-assignments/{assignmentId}/release]
          - state_machines.CrewAssignment.CONFIRMED_to_RELEASED
          - entities.CrewAssignment.fields.release_reason
          - entities.Producer.fields.confirmed_crew_commitments
        distinguishing_aspect: "Release is a one-way action that records its reason, drops the volunteer's confirmed_crew_commitments back to zero, credits no hours because the slot never aired, and flips the slot's derived staffing_status from READY back to UNDERSTAFFED."
        test_recipe:
          setup:
            - "Producer P owns APPROVED, CLEARED Program PR with required_crew_roles [AUDIO]; volunteer V is ACTIVE."
