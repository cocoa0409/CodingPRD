        grounds: [calculations.buffered_window_overlap, "errors[ERR_TRUCK_SCHEDULE_CONFLICT]"]
        distinguishing_aspect: |
          Truck resource with half-open windows plus a symmetric 60-minute deadhead buffer:
          a window starting exactly at the buffered boundary (12:00 after a [08:00,10:00)
          load) is allowed, while [13:30,15:30) intersects the second load's buffered
          occupancy and is rejected — buffer-inclusive exclusion semantics.
        test_recipe:
          setup:
            - "Base fixture; truck U-01; FIXED contract; three 9000-gal orders ALLOCATED"
