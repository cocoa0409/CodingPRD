scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:

      - name: closure_reopen_window_fixed_table_vs_ct_computed
        grounds:
          - calculations.reopen_remediation_window
          - state_machines.ClosureOrder.OPEN_to_REOPEN_REQUESTED
          - state_machines.ClosureOrder.REOPEN_REQUESTED_to_CLEARED
          - entities.ClosureOrder.fields.remediation_variant
          - entities.ClosureOrder.fields.earliest_reopen_at
        distinguishing_aspect: |
          This dual variant lives on the ClosureOrder remediation-timing domain: the identical
          FECAL_DIARRHEAL closure yields required_remediation_minutes 765 under FIXED_TABLE and
          383 under CT_COMPUTED, so the same reopen decision at clock 2026-05-01T07:00:00Z is
          rejected under one algorithm and granted under the other.
        test_recipe:
          setup:
            - "One operator and one CLASS_B_PUBLIC pool facility exist."
            - "A FECAL_DIARRHEAL closure order was opened at the default clock 2026-05-01T00:00:00Z, so it carries the FIXED_TABLE window of 765 minutes (earliest_reopen_at 2026-05-01T12:45:00.000Z)."
            - "The clock has been advanced to 2026-05-01T07:00:00Z and an IN_RANGE verification reading sampled 30 minutes earlier is on file."
          setup_api_calls:
            - call: "POST /operators"
              payload: { legal_name: "Blue Lagoon Aquatics", contact_email: "ops@bluelagoon.example" }
              as: Anonymous
              captures: { op_id: $.data.id }
            - call: "POST /facilities"
              payload: { operator_id: "${op_id}", name: "Main Pool", facility_class: "CLASS_B_PUBLIC", surface_area_sqft: 1200, water_volume_gallons: 60000, max_depth_feet: 10, drain_count: 2 }
              as: Operator
              as_user_id: "${op_id}"
              captures: { fac_id: $.data.id, fac_v: $.data.version }
            - call: "POST /closure-orders"
              payload: { facility_id: "${fac_id}", closure_reason: "FECAL_DIARRHEAL", expected_facility_version: "${fac_v}", note: "Diarrheal accident reported by lifeguard" }
              as: Inspector
              as_user_id: "insp-1"
              captures: { co_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T07:00:00Z" }
              as: HealthAuthorityAdmin
              as_user_id: "admin-1"
            - call: "POST /facilities/${fac_id}/water-readings"
              payload: { sampled_at: "2026-05-01T06:30:00Z", source: "REOPEN_VERIFICATION", free_chlorine_ppm: 3.0, combined_chloramine_ppm: 0.2, ph: 7.4, water_temp_f: 82.0 }
              as: Operator
              as_user_id: "${op_id}"
              captures: { rd_id: $.data.id }
          trigger:
            - call: "POST /closure-orders/${co_id}/reopen-request"
              payload: { verification_reading_id: "${rd_id}", treatment_free_chlorine_ppm: 40, treatment_ph: 7.2 }
              as: Operator
              as_user_id: "${op_id}"
            - call: "POST /closure-orders/${co_id}/reopen-decision"
              payload: { decision: "APPROVE" }
              as: Inspector
              as_user_id: "insp-2"
          assert:
            - "Immediately after creation ClosureOrder.${co_id}.remediation_variant == FIXED_TABLE, required_remediation_minutes == 765 and earliest_reopen_at == 2026-05-01T12:45:00.000Z"
            - "After the reopen request ClosureOrder.${co_id}.remediation_variant == CT_COMPUTED"
            - "After the reopen request ClosureOrder.${co_id}.required_remediation_minutes == 383"
            - "After the reopen request ClosureOrder.${co_id}.earliest_reopen_at == 2026-05-01T06:23:00.000Z"
            - "ClosureOrder.${co_id}.status == CLEARED after the APPROVE (the clock 2026-05-01T07:00:00Z is past the CT window but 5h45m short of the FIXED_TABLE window)"
            - "Facility.${fac_id}.operating_posture == CLOSED and Facility.${fac_id}.posture_reason == PERMIT_MISSING after the closure clears"

      - name: complaint_rwi_single_report_vs_cluster_aggregate
        grounds:
          - calculations.rwi_risk_score
          - entities.Complaint.fields.risk_variant
          - entities.Complaint.fields.cluster_case_count
          - entities.Complaint.fields.escalated
          - state_machines.Complaint.null_to_RECEIVED
        distinguishing_aspect: |
          This dual variant lives on the Complaint recreational-water-illness risk domain — a
          different entity domain from the ClosureOrder timing variant: a complaint body worth 44
          points under SINGLE_REPORT scores 83 under CLUSTER_AGGREGATE because case counts are
          summed and the pathogen weight is maximised across the 14-day cluster.
        test_recipe:
          setup:
            - "One operator and one CLASS_B_PUBLIC pool facility exist."
            - "A first RWI_ILLNESS complaint (2 cases, LEGIONELLA, onset 2026-04-21) is on file in status RECEIVED and scored 59 as a SINGLE_REPORT, so it did not escalate."
          setup_api_calls:
            - call: "POST /operators"
              payload: { legal_name: "Blue Lagoon Aquatics", contact_email: "ops@bluelagoon.example" }
              as: Anonymous
              captures: { op_id: $.data.id }
            - call: "POST /facilities"
              payload: { operator_id: "${op_id}", name: "Main Pool", facility_class: "CLASS_B_PUBLIC", surface_area_sqft: 1200, water_volume_gallons: 60000, max_depth_feet: 10, drain_count: 2 }
              as: Operator
              as_user_id: "${op_id}"
              captures: { fac_id: $.data.id }
            - call: "POST /complaints"
              payload: { facility_id: "${fac_id}", complaint_type: "RWI_ILLNESS", narrative: "Two swimmers hospitalised with pneumonia after the weekend", symptom_onset_date: "2026-04-21", illness_case_count: 2, pathogen_suspected: "LEGIONELLA" }
              as: Anonymous
              captures: { c1_id: $.data.id }
          trigger:
            - call: "POST /complaints"
              payload: { facility_id: "${fac_id}", complaint_type: "RWI_ILLNESS", narrative: "Two more swimmers ill after the same weekend", symptom_onset_date: "2026-04-21", illness_case_count: 2, pathogen_suspected: "GIARDIA" }
              as: Anonymous
              captures: { c2_id: $.data.id }
          assert:
            - "Complaint.${c1_id}.risk_variant == SINGLE_REPORT, cluster_case_count == 2, risk_score == 59, escalated == false"
            - "Complaint.${c2_id}.risk_variant == CLUSTER_AGGREGATE"
            - "Complaint.${c2_id}.cluster_case_count == 4"
            - "Complaint.${c2_id}.risk_score == 83 (48 case points + 35 max cluster pathogen weight + 0 recency), not the 44 a SINGLE_REPORT reading of the same body would produce"
            - "Complaint.${c2_id}.escalated == true"
            - "GET /closure-orders?facility_id=${fac_id} returns exactly one ClosureOrder with closure_reason == RWI_OUTBREAK and status == OPEN"
            - "Facility.${fac_id}.operating_posture == CLOSED and posture_reason == CLOSURE_ORDER_OPEN"

  - rule_id: combinatorial_formula
    instances:

      - name: seasonal_permit_fee_round_per_component_then_sum
        grounds:
          - calculations.permit_fee_assessment
          - entities.Permit.fields.assessed_fee_cents
          - entities.Permit.fields.fee_variant
          - entities.Permit.fields.term_days
          - state_machines.Permit.UNDER_REVIEW_to_ISSUED
        distinguishing_aspect: |
          Mode (b) — nested rounding where the order matters: proration is applied and rounded per
          component (round_half_up(30000*92/365)=7562 plus round_half_up(10000*92/365)=2521 gives
          10083) whereas summing first and rounding once gives 10082; the scaffold pins the
          per-component order and the one-cent difference is observable.
        test_recipe:
          setup:
            - "One operator owns a seasonal CLASS_B_PUBLIC pool of 60000 gallons whose season runs 2026-06-01 to 2026-08-31 (92 inclusive days)."
            - "A SEASONAL permit application for that season is sitting in UNDER_REVIEW at the default clock 2026-05-01T00:00:00Z, so it is not a late application."
          setup_api_calls:
            - call: "POST /operators"
              payload: { legal_name: "Lakeside Recreation District", contact_email: "permits@lakeside.example" }
              as: Anonymous
              captures: { op_id: $.data.id }
            - call: "POST /facilities"
              payload: { operator_id: "${op_id}", name: "Lakeside Seasonal Pool", facility_class: "CLASS_B_PUBLIC", surface_area_sqft: 1200, water_volume_gallons: 60000, max_depth_feet: 10, drain_count: 2, is_seasonal: true, season_start_date: "2026-06-01", season_end_date: "2026-08-31" }
              as: Operator
              as_user_id: "${op_id}"
              captures: { fac_id: $.data.id }
            - call: "POST /permits"
              payload: { facility_id: "${fac_id}", permit_type: "SEASONAL", term_start_date: "2026-06-01" }
              as: Operator
              as_user_id: "${op_id}"
              captures: { permit_id: $.data.id }
            - call: "POST /permits/${permit_id}/transition"
              payload: { action: "SUBMIT" }
              as: Operator
              as_user_id: "${op_id}"
            - call: "POST /permits/${permit_id}/transition"
              payload: { action: "START_REVIEW" }
              as: HealthAuthorityAdmin
              as_user_id: "admin-1"
          trigger:
            - call: "POST /permits/${permit_id}/transition"
              payload: { action: "ISSUE" }
              as: HealthAuthorityAdmin
              as_user_id: "admin-1"
          assert:
            - "Permit.${permit_id}.term_end_date == 2026-08-31 and Permit.${permit_id}.term_days == 92"
            - "Permit.${permit_id}.is_late_application == false"
            - "Permit.${permit_id}.fee_variant == SEASONAL_PRORATED"
            - "Permit.${permit_id}.assessed_fee_cents == 10083 (7562 + 2521 + 0), NOT 10082 which sum-then-round would give"
            - "Operator.${op_id}.fee_balance_cents == 10083"
            - "GET /fee-ledger-entries?operator_id=${op_id} returns exactly one entry with entry_type == PERMIT_FEE and amount_cents == 10083"

      - name: inspection_score_nested_caps_and_conditional_result
        grounds:
          - calculations.inspection_score_and_result
          - calculations.facility_open_demerit_points
          - entities.Inspection.fields.critical_demerits
          - entities.Inspection.fields.score
          - entities.Inspection.fields.result
          - state_machines.Inspection.SUBMITTED_to_FINALIZED
        distinguishing_aspect: |
          Mode (a) — a formula with more than three inputs and non-linear interaction: two
          independent min() caps, a round_half_up corrected-on-site credit, a max(0, ...) floor and
          three conditional result branches interact so that raw critical demerits of 50 are capped
          to 40 while the uncapped 54 points still flow into Facility.open_demerit_points.
        test_recipe:
          setup:
            - "One operator and one CLASS_B_PUBLIC pool facility exist."
            - "A ROUTINE inspection has been started and carries five uncorrected CRITICAL findings (10 points each) and two corrected-on-site NONCRITICAL findings (2 points each), and has been submitted."
          setup_api_calls:
            - call: "POST /operators"
              payload: { legal_name: "Blue Lagoon Aquatics", contact_email: "ops@bluelagoon.example" }
              as: Anonymous
              captures: { op_id: $.data.id }
            - call: "POST /facilities"
              payload: { operator_id: "${op_id}", name: "Main Pool", facility_class: "CLASS_B_PUBLIC", surface_area_sqft: 1200, water_volume_gallons: 60000, max_depth_feet: 10, drain_count: 2 }
              as: Operator
              as_user_id: "${op_id}"
              captures: { fac_id: $.data.id }
            - call: "POST /inspections"
              payload: { facility_id: "${fac_id}", inspection_type: "ROUTINE", scheduled_start_at: "2026-05-01T09:00:00Z", scheduled_end_at: "2026-05-01T11:00:00Z" }
              as: Inspector
              as_user_id: "insp-1"
              captures: { insp_id: $.data.id }
            - call: "POST /inspections/${insp_id}/transition"
              payload: { action: "START" }
              as: Inspector
              as_user_id: "insp-1"
            - call: "POST /inspections/${insp_id}/violations"
              payload: { code: "WQ-101", severity: "CRITICAL", description: "Free chlorine below minimum", corrected_on_site: false }
              as: Inspector
              as_user_id: "insp-1"
            - call: "POST /inspections/${insp_id}/violations"
              payload: { code: "WQ-102", severity: "CRITICAL", description: "pH out of range", corrected_on_site: false }
              as: Inspector
              as_user_id: "insp-1"
            - call: "POST /inspections/${insp_id}/violations"
              payload: { code: "WQ-103", severity: "CRITICAL", description: "Combined chloramine above limit", corrected_on_site: false }
              as: Inspector
              as_user_id: "insp-1"
            - call: "POST /inspections/${insp_id}/violations"
              payload: { code: "SF-104", severity: "CRITICAL", description: "Rescue equipment missing", corrected_on_site: false }
              as: Inspector
              as_user_id: "insp-1"
            - call: "POST /inspections/${insp_id}/violations"
              payload: { code: "SF-105", severity: "CRITICAL", description: "Emergency phone inoperative", corrected_on_site: false }
              as: Inspector
              as_user_id: "insp-1"
            - call: "POST /inspections/${insp_id}/violations"
              payload: { code: "SN-201", severity: "NONCRITICAL", description: "Deck hose left uncoiled", corrected_on_site: true }
              as: Inspector
              as_user_id: "insp-1"
            - call: "POST /inspections/${insp_id}/violations"
              payload: { code: "SN-202", severity: "NONCRITICAL", description: "Log book entry missing", corrected_on_site: true }
              as: Inspector
              as_user_id: "insp-1"
            - call: "POST /inspections/${insp_id}/transition"
              payload: { action: "SUBMIT" }
              as: Inspector
              as_user_id: "insp-1"
          trigger:
            - call: "POST /inspections/${insp_id}/transition"
              payload: { action: "FINALIZE" }
              as: HealthAuthorityAdmin
              as_user_id: "admin-1"
          assert:
            - "Inspection.${insp_id}.critical_demerits == 40 (raw 50 capped by CRITICAL_DEMERIT_CAP)"
            - "Inspection.${insp_id}.noncritical_demerits == 4 (two corrected-on-site NONCRITICAL findings at round_half_up(3*0.5) == 2 each)"
            - "Inspection.${insp_id}.score == 56"
            - "Inspection.${insp_id}.result == FAIL"
            - "Inspection.${insp_id}.enforcement_status == NOTICE_ISSUED (auto-issued because result == FAIL)"
            - "Inspection.${insp_id}.reinspection_due_on == 2026-05-11"
            - "Facility.${fac_id}.open_demerit_points == 54 — the uncapped sum of points_assessed, which deliberately differs from the capped 44 used for the score"
            - "Operator.${op_id}.fee_balance_cents == 15000 (the auto-posted REINSPECTION_FEE)"

  - rule_id: non_linear_state_machine
    instances:

      - name: permit_issued_suspended_reinstated_cycle
        grounds:
          - state_machines.Permit.ISSUED_to_SUSPENDED
          - state_machines.Permit.SUSPENDED_to_ISSUED
          - entities.Permit.fields.suspension_reason
          - entities.Facility.fields.posture_reason
        distinguishing_aspect: |
          Non-linear shape on the Permit entity: ISSUED -> SUSPENDED -> ISSUED is a true cycle, the
          row re-enters a state it already occupied, issued_at and assessed_fee_cents survive the
          round trip, and no new ledger entry is posted by either edge.
        test_recipe:
          setup:
            - "One operator owns a CLASS_B_PUBLIC pool with an ISSUED annual permit assessed at 40000 cents; the facility posture is RESTRICTED because no signage has been posted yet."
          setup_api_calls:
            - call: "POST /operators"
              payload: { legal_name: "Blue Lagoon Aquatics", contact_email: "ops@bluelagoon.example" }
              as: Anonymous
              captures: { op_id: $.data.id }
            - call: "POST /facilities"
              payload: { operator_id: "${op_id}", name: "Main Pool", facility_class: "CLASS_B_PUBLIC", surface_area_sqft: 1200, water_volume_gallons: 60000, max_depth_feet: 10, drain_count: 2 }
              as: Operator
              as_user_id: "${op_id}"
              captures: { fac_id: $.data.id }
            - call: "POST /permits"
              payload: { facility_id: "${fac_id}", permit_type: "ANNUAL", term_start_date: "2026-05-01" }
              as: Operator
              as_user_id: "${op_id}"
              captures: { permit_id: $.data.id }
            - call: "POST /permits/${permit_id}/transition"
              payload: { action: "SUBMIT" }
              as: Operator
              as_user_id: "${op_id}"
            - call: "POST /permits/${permit_id}/transition"
              payload: { action: "START_REVIEW" }
              as: HealthAuthorityAdmin
              as_user_id: "admin-1"
            - call: "POST /permits/${permit_id}/transition"
              payload: { action: "ISSUE" }
              as: HealthAuthorityAdmin
              as_user_id: "admin-1"
          trigger:
            - call: "POST /permits/${permit_id}/transition"
              payload: { action: "SUSPEND", reason: "Operator failed to file monthly chemistry logs" }
              as: HealthAuthorityAdmin
              as_user_id: "admin-1"
            - call: "POST /permits/${permit_id}/transition"
              payload: { action: "REINSTATE" }
              as: HealthAuthorityAdmin
              as_user_id: "admin-1"
          assert:
            - "After SUSPEND: Permit.${permit_id}.status == SUSPENDED and suspension_reason == ADMINISTRATIVE"
            - "After SUSPEND: Facility.${fac_id}.operating_posture == CLOSED and posture_reason == PERMIT_NOT_ACTIVE"
            - "After REINSTATE: Permit.${permit_id}.status == ISSUED and suspension_reason == null"
            - "After REINSTATE: Facility.${fac_id}.operating_posture == RESTRICTED and posture_reason == SIGNAGE_INCOMPLETE"
            - "Permit.${permit_id}.issued_at == 2026-05-01T00:00:00.000Z both before and after the cycle"
            - "Permit.${permit_id}.assessed_fee_cents == 40000 and Operator.${op_id}.fee_balance_cents == 40000 after the full cycle (no ledger entry is posted by SUSPEND or REINSTATE)"

      - name: inspection_workflow_and_enforcement_axes_advance_independently
        grounds:
          - state_machines.Inspection.NONE_to_NOTICE_ISSUED
          - state_machines.Inspection.NOTICE_ISSUED_to_ESCALATED
          - entities.Inspection.fields.workflow_status
          - entities.Inspection.fields.enforcement_status
        distinguishing_aspect: |
          Non-linear shape on the Inspection entity — a different entity from the Permit cycle:
          workflow_status and enforcement_status are parallel dimensions on one row, so two
          enforcement transitions move NONE -> NOTICE_ISSUED -> ESCALATED while workflow_status
          stays pinned at FINALIZED and the frozen score/result are untouched.
        test_recipe:
          setup:
            - "One operator and one CLASS_B_PUBLIC pool facility exist."
            - "A ROUTINE inspection carrying one uncorrected CRITICAL finding has been finalized, scoring 90 with result CONDITIONAL and enforcement_status NONE."
          setup_api_calls:
            - call: "POST /operators"
              payload: { legal_name: "Blue Lagoon Aquatics", contact_email: "ops@bluelagoon.example" }
              as: Anonymous
              captures: { op_id: $.data.id }
            - call: "POST /facilities"
              payload: { operator_id: "${op_id}", name: "Main Pool", facility_class: "CLASS_B_PUBLIC", surface_area_sqft: 1200, water_volume_gallons: 60000, max_depth_feet: 10, drain_count: 2 }
              as: Operator
              as_user_id: "${op_id}"
              captures: { fac_id: $.data.id }
            - call: "POST /inspections"
              payload: { facility_id: "${fac_id}", inspection_type: "ROUTINE", scheduled_start_at: "2026-05-01T09:00:00Z", scheduled_end_at: "2026-05-01T11:00:00Z" }
              as: Inspector
              as_user_id: "insp-1"
              captures: { insp_id: $.data.id }
            - call: "POST /inspections/${insp_id}/transition"
              payload: { action: "START" }
              as: Inspector
              as_user_id: "insp-1"
            - call: "POST /inspections/${insp_id}/violations"
              payload: { code: "WQ-110", severity: "CRITICAL", description: "Chlorinator offline at time of visit", corrected_on_site: false }
              as: Inspector
              as_user_id: "insp-1"
              captures: { v_id: $.data.id }
            - call: "POST /inspections/${insp_id}/transition"
              payload: { action: "SUBMIT" }
              as: Inspector
              as_user_id: "insp-1"
            - call: "POST /inspections/${insp_id}/transition"
              payload: { action: "FINALIZE" }
              as: HealthAuthorityAdmin
              as_user_id: "admin-1"
          trigger:
            - call: "POST /inspections/${insp_id}/enforcement"
              payload: { action: "ISSUE_NOTICE", note: "Written notice served on site" }
              as: HealthAuthorityAdmin
              as_user_id: "admin-1"
            - call: "POST /inspections/${insp_id}/enforcement"
              payload: { action: "ESCALATE" }
              as: HealthAuthorityAdmin
              as_user_id: "admin-1"
          assert:
            - "Inspection.${insp_id}.score == 90 and result == CONDITIONAL (score 90 is above the pass threshold but the uncorrected CRITICAL forces CONDITIONAL)"
            - "After ISSUE_NOTICE: Inspection.${insp_id}.enforcement_status == NOTICE_ISSUED and workflow_status == FINALIZED"
            - "After ESCALATE: Inspection.${insp_id}.enforcement_status == ESCALATED and workflow_status is still FINALIZED"
            - "Inspection.${insp_id}.score is still 90 and result is still CONDITIONAL after both enforcement moves"
            - "GET /closure-orders?facility_id=${fac_id} returns exactly one ClosureOrder with closure_reason == PERMIT_ACTION and status == OPEN"
            - "Facility.${fac_id}.operating_posture == CLOSED and posture_reason == CLOSURE_ORDER_OPEN"
            - "Facility.${fac_id}.open_demerit_points == 10"

  - rule_id: transitive_cascade
    instances:

      - name: imminent_reading_opens_closure_closes_facility_cancels_shift
        grounds:
          - calculations.water_reading_classification
          - calculations.facility_operating_posture
          - state_machines.ClosureOrder.null_to_OPEN
          - state_machines.StaffAssignment.SCHEDULED_to_CANCELLED
          - entities.WaterChemistryReading.fields.triggered_closure_order_id
        distinguishing_aspect: |
          Depth-4 cascade triggered by POST /facilities/{id}/water-readings: the reading is
          classified IMMINENT_HAZARD (hop 1), that classification creates a WATER_CHEMISTRY
          ClosureOrder (hop 2), the new OPEN order flips Facility.operating_posture to CLOSED
          (hop 3), and the CLOSED posture cancels the overlapping SCHEDULED lifeguard shift with
          cancel_reason FACILITY_CLOSED (hop 4) — each hop is caused by the previous one.
        test_recipe:
          setup:
            - "One operator owns a CLASS_B_PUBLIC pool with an ISSUED annual permit, so the facility posture is RESTRICTED rather than CLOSED."
            - "A SCHEDULED LIFEGUARD shift runs 2026-05-01T00:00:00Z to 2026-05-01T08:00:00Z."
            - "The clock is at its 2026-05-01T00:00:00Z default."
          setup_api_calls:
            - call: "POST /operators"
              payload: { legal_name: "Blue Lagoon Aquatics", contact_email: "ops@bluelagoon.example" }
              as: Anonymous
              captures: { op_id: $.data.id }
            - call: "POST /facilities"
              payload: { operator_id: "${op_id}", name: "Main Pool", facility_class: "CLASS_B_PUBLIC", surface_area_sqft: 1200, water_volume_gallons: 60000, max_depth_feet: 10, drain_count: 2 }
              as: Operator
              as_user_id: "${op_id}"
              captures: { fac_id: $.data.id }
            - call: "POST /permits"
              payload: { facility_id: "${fac_id}", permit_type: "ANNUAL", term_start_date: "2026-05-01" }
              as: Operator
              as_user_id: "${op_id}"
              captures: { permit_id: $.data.id }
            - call: "POST /permits/${permit_id}/transition"
              payload: { action: "SUBMIT" }
              as: Operator
              as_user_id: "${op_id}"
            - call: "POST /permits/${permit_id}/transition"
              payload: { action: "START_REVIEW" }
              as: HealthAuthorityAdmin
              as_user_id: "admin-1"
            - call: "POST /permits/${permit_id}/transition"
              payload: { action: "ISSUE" }
              as: HealthAuthorityAdmin
              as_user_id: "admin-1"
            - call: "POST /staff-assignments"
              payload: { facility_id: "${fac_id}", staff_ref: "LG-001", staff_name: "Ana Ruiz", role_type: "LIFEGUARD", certification_expires_on: "2026-12-31", shift_start_at: "2026-05-01T00:00:00Z", shift_end_at: "2026-05-01T08:00:00Z" }
              as: Operator
              as_user_id: "${op_id}"
              captures: { sa_id: $.data.id }
          trigger:
            - call: "POST /facilities/${fac_id}/water-readings"
              payload: { sampled_at: "2026-05-01T00:00:00Z", source: "OPERATOR_LOG", free_chlorine_ppm: 0.2, combined_chloramine_ppm: 0.1, ph: 7.4, water_temp_f: 82.0 }
              as: Operator
              as_user_id: "${op_id}"
              captures: { rd_id: $.data.id }
          assert:
            - "WaterChemistryReading.${rd_id}.compliance_status == IMMINENT_HAZARD"
            - "WaterChemistryReading.${rd_id}.out_of_range_parameters == [FREE_CHLORINE_LOW]"
            - "GET /closure-orders?triggering_reading_id=${rd_id} returns exactly one order with closure_reason == WATER_CHEMISTRY, status == OPEN, required_remediation_minutes == 30 and earliest_reopen_at == 2026-05-01T00:30:00.000Z"
            - "Facility.${fac_id}.operating_posture == CLOSED and posture_reason == CLOSURE_ORDER_OPEN"
            - "StaffAssignment.${sa_id}.status == CANCELLED and cancel_reason == FACILITY_CLOSED"
            - "Permit.${permit_id}.status == ISSUED — the cascade never reaches the permit"

      - name: finalize_fail_notice_suspends_permit_and_closes_facility
        grounds:
          - state_machines.Inspection.SUBMITTED_to_FINALIZED
          - state_machines.Inspection.NONE_to_NOTICE_ISSUED
          - state_machines.Permit.ISSUED_to_SUSPENDED
          - calculations.facility_operating_posture
          - calculations.operator_fee_balance
        distinguishing_aspect: |
          Depth-4 cascade from a different trigger — POST /inspections/{id}/transition
          action=FINALIZE: scoring yields FAIL (hop 1), the FAIL auto-issues the enforcement notice
          and posts the reinspection fee (hop 2), the notice suspends the facility's ISSUED permit
          because an OPEN IMMINENT_HEALTH_HAZARD finding exists (hop 3), and the suspension drives
          the posture to CLOSED with reason PERMIT_NOT_ACTIVE (hop 4).
        test_recipe:
          setup:
            - "One operator owns a CLASS_B_PUBLIC pool with an ISSUED annual permit assessed at 40000 cents."
            - "A ROUTINE inspection has been started, carries one IMMINENT_HEALTH_HAZARD finding, and has been submitted."
          setup_api_calls:
            - call: "POST /operators"
              payload: { legal_name: "Blue Lagoon Aquatics", contact_email: "ops@bluelagoon.example" }
              as: Anonymous
              captures: { op_id: $.data.id }
            - call: "POST /facilities"
              payload: { operator_id: "${op_id}", name: "Main Pool", facility_class: "CLASS_B_PUBLIC", surface_area_sqft: 1200, water_volume_gallons: 60000, max_depth_feet: 10, drain_count: 2 }
              as: Operator
              as_user_id: "${op_id}"
              captures: { fac_id: $.data.id }
            - call: "POST /permits"
              payload: { facility_id: "${fac_id}", permit_type: "ANNUAL", term_start_date: "2026-05-01" }
              as: Operator
              as_user_id: "${op_id}"
              captures: { permit_id: $.data.id }
            - call: "POST /permits/${permit_id}/transition"
              payload: { action: "SUBMIT" }
              as: Operator
              as_user_id: "${op_id}"
            - call: "POST /permits/${permit_id}/transition"
              payload: { action: "START_REVIEW" }
              as: HealthAuthorityAdmin
              as_user_id: "admin-1"
            - call: "POST /permits/${permit_id}/transition"
              payload: { action: "ISSUE" }
              as: HealthAuthorityAdmin
              as_user_id: "admin-1"
            - call: "POST /inspections"
              payload: { facility_id: "${fac_id}", inspection_type: "ROUTINE", scheduled_start_at: "2026-05-01T09:00:00Z", scheduled_end_at: "2026-05-01T11:00:00Z" }
              as: Inspector
              as_user_id: "insp-1"
              captures: { insp_id: $.data.id }
            - call: "POST /inspections/${insp_id}/transition"
              payload: { action: "START" }
              as: Inspector
              as_user_id: "insp-1"
            - call: "POST /inspections/${insp_id}/violations"
              payload: { code: "SF-900", severity: "IMMINENT_HEALTH_HAZARD", description: "Main drain cover missing from the deep end", corrected_on_site: false }
              as: Inspector
              as_user_id: "insp-1"
              captures: { v_id: $.data.id }
            - call: "POST /inspections/${insp_id}/transition"
              payload: { action: "SUBMIT" }
              as: Inspector
              as_user_id: "insp-1"
          trigger:
            - call: "POST /inspections/${insp_id}/transition"
              payload: { action: "FINALIZE" }
              as: HealthAuthorityAdmin
              as_user_id: "admin-1"
          assert:
            - "Inspection.${insp_id}.score == 75 and result == FAIL"
            - "Inspection.${insp_id}.enforcement_status == NOTICE_ISSUED"
            - "Permit.${permit_id}.status == SUSPENDED and suspension_reason == IMMINENT_HEALTH_HAZARD"
            - "Facility.${fac_id}.operating_posture == CLOSED and posture_reason == PERMIT_NOT_ACTIVE"
            - "Facility.${fac_id}.open_demerit_points == 25"
            - "Operator.${op_id}.fee_balance_cents == 55000"
            - "GET /fee-ledger-entries?operator_id=${op_id} returns exactly two entries: PERMIT_FEE +40000 and REINSPECTION_FEE +15000"

  - rule_id: priority_pair_validation_conflict
    instances:

      - name: permit_issue_state_error_outranks_vgb_safety_error
        grounds:
          - validations[priority=13]
          - validations[priority=22]
          - errors[ERR_INVALID_PERMIT_STATE]
          - errors[ERR_VGB_NONCOMPLIANT]
          - calculations.vgb_compliance_evaluation
        distinguishing_aspect: |
          Error-category pair state x business_safety: a single request violates both the
          priority-13 state precondition (the permit is already ISSUED) and the priority-22 VGB
          safety gate (single drain, no certification, clock past the 2026-06-01 enforcement date),
          and the response must be ERR_INVALID_PERMIT_STATE, not ERR_VGB_NONCOMPLIANT.
        test_recipe:
          setup:
            - "A CLASS_B_PUBLIC pool with drain_count 1 and no drain certification on file, so vgb_compliance_status is NONCOMPLIANT."
            - "Its annual permit was issued on 2026-05-01, before the VGB enforcement date, and is in status ISSUED."
            - "The clock has since been moved to 2026-06-15T00:00:00Z, past VGB_ENFORCEMENT_START_DATE."
          setup_api_calls:
            - call: "POST /operators"
              payload: { legal_name: "Harbour Club", contact_email: "club@harbour.example" }
              as: Anonymous
              captures: { op_id: $.data.id }
            - call: "POST /facilities"
              payload: { operator_id: "${op_id}", name: "Harbour Club Pool", facility_class: "CLASS_B_PUBLIC", surface_area_sqft: 1200, water_volume_gallons: 20000, max_depth_feet: 9, drain_count: 1 }
              as: Operator
              as_user_id: "${op_id}"
              captures: { fac_id: $.data.id }
            - call: "POST /permits"
              payload: { facility_id: "${fac_id}", permit_type: "ANNUAL", term_start_date: "2026-05-01" }
              as: Operator
              as_user_id: "${op_id}"
              captures: { permit_id: $.data.id }
            - call: "POST /permits/${permit_id}/transition"
              payload: { action: "SUBMIT" }
              as: Operator
              as_user_id: "${op_id}"
            - call: "POST /permits/${permit_id}/transition"
              payload: { action: "START_REVIEW" }
              as: HealthAuthorityAdmin
              as_user_id: "admin-1"
            - call: "POST /permits/${permit_id}/transition"
              payload: { action: "ISSUE" }
              as: HealthAuthorityAdmin
              as_user_id: "admin-1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T00:00:00Z" }
              as: HealthAuthorityAdmin
              as_user_id: "admin-1"
          trigger:
            - call: "POST /permits/${permit_id}/transition"
