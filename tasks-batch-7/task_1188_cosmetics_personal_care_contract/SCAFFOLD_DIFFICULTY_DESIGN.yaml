  # ===================================================================
  # Rule 4 — transitive_cascade (3 instances, different triggers)
  # ===================================================================
  - rule_id: transitive_cascade
    instances:
      - name: review_changes_cascade_depth3
        grounds:
          - state_machines.RegulatoryReview.UNDER_REVIEW_to_CHANGES_REQUESTED
          - state_machines.Formula.ACTIVE_to_CHANGES_REQUESTED
          - state_machines.ProductionOrder.CONFIRMED_to_ON_HOLD
          - state_machines.FillingRun.SCHEDULED_to_ABORTED
        distinguishing_aspect: |
          Depth-3 chain from a regulatory trigger: request-changes mutates the
          Formula (hop 1); the formula mutation forces the CONFIRMED order ON_HOLD
          (hop 2); the order hold aborts its SCHEDULED filling run (hop 3) — each
          hop is caused by the previous hop, not by the review directly.
        test_recipe:
          setup:
            - "ACTIVE formula F with a CONFIRMED order (2000 units), a PLANNED 100kg batch, and a SCHEDULED run on line L (2026-05-10T08:00Z-10:00Z)"
            - "A second INCI_LIST review of F has been claimed (post-market re-audit)"
          setup_api_calls:
            - call: "POST /cosmfg/customers"
              payload: { name: "Acme Beauty", tier: "STANDARD", minimum_run_units: 1000, credit_limit_cents: 100000000 }
              as: PlantDirector
              captures: { cust: $.data.id }
            - call: "POST /cosmfg/components"
              payload: { name: "Water", kind: "RAW_MATERIAL", supply_mode: "MANUFACTURER_SUPPLIED", standard_cost_per_kg_cents: 1000 }
              as: ProductionPlanner
              captures: { ca: $.data.id }
            - call: "POST /cosmfg/formulas"
              payload: { customer_id: "${cust}", name: "F", ownership: "CUSTOMER_OWNED", confidentiality: "STANDARD", product_class: "SKIN", allergen_flag: false, bulk_mass_per_unit_kg: 0.05, viscosity_target_cps: 4000, viscosity_tolerance_pct: 10, ph_target: 5.5, ph_tolerance: 0.5, ingredients: [{ inci_name: "AQUA", component_id: "${ca}", percentage: 100 }], required_components: [] }
              as: FormulationChemist
              captures: { fm: $.data.id }
            - call: "POST /cosmfg/formulas/${fm}/submit"
              as: FormulationChemist
            - call: "POST /cosmfg/formulas/${fm}/reviews"
              payload: { review_scope: "INCI_LIST" }
              as: FormulationChemist
              captures: { rv: $.data.id }
            - call: "POST /cosmfg/reviews/${rv}/claim"
              as: RegulatoryAffairs
            - call: "POST /cosmfg/reviews/${rv}/approve"
              as: RegulatoryAffairs
            - call: "POST /cosmfg/formulas/${fm}/activate"
              as: FormulationChemist
            - call: "POST /cosmfg/production-orders"
              payload: { formula_id: "${fm}", requested_units: 2000 }
              as: CustomerRep
              as_user_id: "${cust}"
              captures: { ord: $.data.id }
            - call: "POST /cosmfg/production-orders/${ord}/confirm"
              as: CustomerRep
              as_user_id: "${cust}"
            - call: "POST /cosmfg/production-orders/${ord}/batches"
              payload: { batch_size_kg: 100 }
              as: ProductionPlanner
              captures: { bt: $.data.id }
            - call: "POST /cosmfg/filling-lines"
              payload: { line_code: "L1" }
              as: ProductionPlanner
              captures: { ln: $.data.id }
            - call: "POST /cosmfg/production-orders/${ord}/filling-runs"
              payload: { line_id: "${ln}", batch_id: "${bt}", scheduled_start: "2026-05-10T08:00:00Z", scheduled_end: "2026-05-10T10:00:00Z", planned_units: 2000 }
              as: ProductionPlanner
              captures: { rn: $.data.id }
            - call: "POST /cosmfg/formulas/${fm}/reviews"
              payload: { review_scope: "INCI_LIST" }
              as: FormulationChemist
              captures: { rv2: $.data.id }
            - call: "POST /cosmfg/reviews/${rv2}/claim"
              as: RegulatoryAffairs
          trigger:
            - call: "POST /cosmfg/reviews/${rv2}/request-changes"
              payload: { comment: "re-audit finding" }
              as: RegulatoryAffairs
            - call: "GET /cosmfg/formulas/${fm}"
              as: FormulationChemist
              captures: { fm_st: $.data.status }
            - call: "GET /cosmfg/production-orders/${ord}"
              as: ProductionPlanner
              captures: { ord_st: $.data.status, ord_ret: $.data.hold_return_status }
            - call: "GET /cosmfg/filling-runs/${rn}"
              as: ProductionPlanner
              captures: { rn_st: $.data.status }
          assert:
            - "Formula.${fm}.status == CHANGES_REQUESTED"
            - "ProductionOrder.${ord}.status == ON_HOLD and hold_return_status == CONFIRMED"
            - "FillingRun.${rn}.status == ABORTED"

      - name: shortfall_escalation_cascade_depth3
        grounds:
          - state_machines.ShortfallCase.OPEN_to_ESCALATED
          - calculations.fulfillable_units
          - state_machines.ComponentAllocation.RESERVED_to_RELEASED
        distinguishing_aspect: |
          Depth-3 chain from a shortfall trigger (distinct from the regulatory
          trigger): escalate(REDUCE_ORDER) mutates the order (requested 2000 -> 500,
