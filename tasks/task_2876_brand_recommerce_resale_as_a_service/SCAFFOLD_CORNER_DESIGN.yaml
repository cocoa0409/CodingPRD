              payload: { customer_id: "${cust_id}", store_location_id: "${store_id}", channel: "MAIL_IN", product_category: "FOOTWEAR", declared_grade: "A", msrp_minor: 120000, item_mass_grams: 900 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { ti_id: "$.data.id", ti_status: "$.data.status", ti_auth: "$.data.authenticity_result", ti_appeals: "$.data.appeal_count", ti_ver: "$.data.version" }
