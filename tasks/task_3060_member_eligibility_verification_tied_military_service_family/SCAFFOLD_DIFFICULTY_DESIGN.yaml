# =============================================================================
# SCAFFOLD_DIFFICULTY_DESIGN.yaml — §1.8 Test Targeting Index
# Member Eligibility Verification Tied to Military Service & Family Lineage
#
# 9 rule_ids x 2 instances = 18 instances. Every instance grounds in
# SCAFFOLD.yaml §1.1–§1.7 and drives empty-DB -> setup via declared §1.5
# endpoints only.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  # Rule 1 — dual_variant_calc (different entity domains)
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: survivor_continuance_spouse_vs_child_share
        grounds:
          - calculations.survivor_continuance
          - state_machines.SurvivorSupportCase.OPEN_to_GRANTED
          - entities.ProductEntitlement.fields.exposure_cents
        distinguishing_aspect: |
          SurvivorSupportCase-domain dual variant: identical deceased-member
          exposure inputs (420000 cents over one OPEN entitlement) yield
          continuance_amount_cents 222000 with 3 months for a SPOUSE
          beneficiary versus 222000 with 2 months for a CHILD beneficiary —
          same amount, different window — and the variant is selected purely
          by the beneficiary's claimed_relationship.
        test_recipe:
          setup:
            - "Logical clock 2026-09-01. Sponsor S (direct service, ACTIVE) with an OPEN entitlement exposure_cents 420000."
            - "Spouse W (FAMILY_SPOUSE, ACTIVE) sponsored by S. Child C (FAMILY_CHILD, ACTIVE) sponsored by S."
            - "S marked DECEASED twice is impossible; instead run the full flow twice in isolation: scenario A grants W's survivor case; scenario B (fresh DB) grants C's."
          setup_api_calls:
            - call: "POST /membership/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /membership/eligibility-cases"
              payload: { applicant_legal_name: "Sam Service", applicant_dob: "1980-01-01", basis_type: "DIRECT_SERVICE" }
              as: EligibilityApplicant
              captures: { case_s: $.data.id }
            - call: "POST /membership/eligibility-cases/${case_s}/service-records"
              payload: { branch: "ARMY", component: "ACTIVE_DUTY", rank_grade: "E-6", service_start_date: "2000-01-01", service_end_date: "2010-01-01", discharge_characterization: "HONORABLE" }
              as: EligibilityApplicant
              captures: { sr_s: $.data.id }
            - call: "POST /membership/eligibility-cases/${case_s}/evidence"
              payload: { doc_type: "DD214", issuing_authority: "NPRC", issued_on: "2010-02-01", covers_service_record_id: "${sr_s}", content_hash: "a1" }
              as: EligibilityApplicant
            - call: "POST /membership/eligibility-cases/${case_s}/submit"
              payload: {}
              as: EligibilityApplicant
            - call: "POST /membership/eligibility-cases/${case_s}/record-reconstruction"
              payload: { decision: "APPROVE", decision_note: "archives matched" }
              as: VerificationOfficer
              as_user_id: "officer-A"
            - call: "POST /membership/eligibility-cases/${case_s}/decide"
              payload: { decision: "APPROVE" }
              as: VerificationOfficer
              as_user_id: "officer-B"
              captures: { m_s: $.data.member_id }
            - call: "POST /membership/eligibility-cases"
              payload: { applicant_legal_name: "Wendy Spouse", applicant_dob: "1982-05-05", basis_type: "FAMILY_DERIVATION", sponsor_member_id: "${m_s}", claimed_relationship: "SPOUSE" }
              as: EligibilityApplicant
              captures: { case_w: $.data.id }
            - call: "POST /membership/eligibility-cases/${case_w}/evidence"
              payload: { doc_type: "MARRIAGE_CERTIFICATE", issuing_authority: "TX VR", issued_on: "2005-06-01", content_hash: "b2" }
              as: EligibilityApplicant
            - call: "POST /membership/eligibility-cases/${case_w}/submit"
              payload: {}
              as: EligibilityApplicant
            - call: "POST /membership/eligibility-cases/${case_w}/decide"
              payload: { decision: "APPROVE" }
              as: VerificationOfficer
              as_user_id: "officer-B"
              captures: { m_w: $.data.member_id }
            - call: "POST /membership/product-offerings"
              payload: { product_code: "LIFE_TERM", product_line: "INSURANCE", product_name: "Term Life", allowed_categories: ["OFFICER_CADET", "ENLISTED_ACTIVE", "VETERAN_HONORABLE", "FAMILY_SPOUSE", "FAMILY_WIDOW", "FAMILY_CHILD"] }
              as: ProductAdministrator
              captures: { off_life: $.data.id }
            - call: "POST /membership/members/${m_s}/entitlements"
              payload: { product_offering_id: "${off_life}", exposure_cents: 420000 }
              as: Member
              as_user_id: "${m_s}"
            - call: "POST /membership/members/${m_s}/deceased"
              payload: { beneficiary_member_id: "${m_w}" }
              as: BenefitsOfficer
            - call: "GET /membership/members/${m_s}/survivor-cases"
              payload: {}
              as: BenefitsOfficer
              captures: { sc_w: "$.data[0].id" }
          trigger:
            - call: "POST /membership/survivor-cases/${sc_w}/grant"
              payload: {}
              as: BenefitsOfficer
          assert:
            - "SurvivorSupportCase.${sc_w}.continuance_amount_cents == 222000"
            - "SurvivorSupportCase.${sc_w}.continuance_months == 3"
            - "Repeating the identical flow with a FAMILY_CHILD beneficiary yields continuance_amount_cents == 222000 but continuance_months == 2 (variant divergence is in the window, driven by claimed_relationship alone)"

      - name: scra_relief_standard_vs_open_ended_proration
        grounds:
          - calculations.scra_rate_relief
          - state_machines.ProtectionClaim.REQUESTED_to_APPROVED
          - entities.DeploymentOrder.fields.end_date
        distinguishing_aspect: |
          ProtectionClaim-domain dual variant (different entity domain than the
          survivor_continuance instance): identical rate inputs
          (base_rate_bps 1100, monthly_interest_cents 110000) yield
          total_relief_cents 300000 over 6 measured periods when the deployment
          order has an end_date, versus 600000 over the fixed
          OPEN_ENDED_PERIODS (12) proration when end_date is null at approval.
        test_recipe:
          setup:
            - "Logical clock 2026-09-01. Member M1 (direct service, ACTIVE) with an ACTIVE scra_eligible deployment (start 2026-09-01, end 2027-03-01 -> 6 periods) and a RATE_REDUCTION claim base 1100 bps / 110000 cents."
            - "Member M2 (direct service, ACTIVE) with an ACTIVE scra_eligible open-ended deployment (end_date null) and an identical claim."
          setup_api_calls:
            - call: "POST /membership/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /membership/eligibility-cases"
              payload: { applicant_legal_name: "Ann Army", applicant_dob: "1990-03-03", basis_type: "DIRECT_SERVICE" }
              as: EligibilityApplicant
              captures: { case_a: $.data.id }
            - call: "POST /membership/eligibility-cases/${case_a}/service-records"
              payload: { branch: "ARMY", component: "ACTIVE_DUTY", rank_grade: "O-3", service_start_date: "2015-01-01", discharge_characterization: "STILL_SERVING" }
              as: EligibilityApplicant
              captures: { sr_a: $.data.id }
            - call: "POST /membership/eligibility-cases/${case_a}/evidence"
              payload: { doc_type: "LEAVE_EARNINGS_STATEMENT", issuing_authority: "DFAS", issued_on: "2026-08-01", covers_service_record_id: "${sr_a}", content_hash: "c3" }
              as: EligibilityApplicant
            - call: "POST /membership/eligibility-cases/${case_a}/submit"
              payload: {}
              as: EligibilityApplicant
            - call: "POST /membership/eligibility-cases/${case_a}/record-reconstruction"
              payload: { decision: "APPROVE", decision_note: "LES verified" }
              as: VerificationOfficer
              as_user_id: "officer-A"
            - call: "POST /membership/eligibility-cases/${case_a}/decide"
              payload: { decision: "APPROVE" }
              as: VerificationOfficer
              as_user_id: "officer-B"
              captures: { m1: $.data.member_id }
            - call: "GET /membership/members/${m1}"
              payload: {}
              as: VerificationOfficer
              as_user_id: "officer-B"
              captures: { m1_v: $.data.version }
            - call: "POST /membership/eligibility-cases"
              payload: { applicant_legal_name: "Bob Navy", applicant_dob: "1988-07-07", basis_type: "DIRECT_SERVICE" }
              as: EligibilityApplicant
              captures: { case_b: $.data.id }
            - call: "POST /membership/eligibility-cases/${case_b}/service-records"
              payload: { branch: "NAVY", component: "ACTIVE_DUTY", rank_grade: "E-5", service_start_date: "2014-01-01", discharge_characterization: "STILL_SERVING" }
              as: EligibilityApplicant
              captures: { sr_b: $.data.id }
            - call: "POST /membership/eligibility-cases/${case_b}/evidence"
              payload: { doc_type: "LEAVE_EARNINGS_STATEMENT", issuing_authority: "DFAS", issued_on: "2026-08-01", covers_service_record_id: "${sr_b}", content_hash: "d4" }
              as: EligibilityApplicant
            - call: "POST /membership/eligibility-cases/${case_b}/submit"
              payload: {}
              as: EligibilityApplicant
            - call: "POST /membership/eligibility-cases/${case_b}/record-reconstruction"
              payload: { decision: "APPROVE", decision_note: "LES verified" }
              as: VerificationOfficer
              as_user_id: "officer-A"
            - call: "POST /membership/eligibility-cases/${case_b}/decide"
              payload: { decision: "APPROVE" }
              as: VerificationOfficer
              as_user_id: "officer-B"
              captures: { m2: $.data.member_id }
            - call: "GET /membership/members/${m2}"
              payload: {}
              as: VerificationOfficer
              as_user_id: "officer-B"
              captures: { m2_v: $.data.version }
            - call: "POST /membership/members/${m1}/deployment-orders"
              payload: { orders_number: "ORD-001", theater: "CENTCOM", start_date: "2026-09-01", end_date: "2027-03-01", scra_eligible: true, expected_member_version: "${m1_v}" }
              as: VerificationOfficer
              captures: { dep1: $.data.id }
            - call: "POST /membership/members/${m2}/deployment-orders"
              payload: { orders_number: "ORD-002", theater: "INDOPACOM", start_date: "2026-09-01", scra_eligible: true, expected_member_version: "${m2_v}" }
              as: VerificationOfficer
              captures: { dep2: $.data.id }
            - call: "POST /membership/members/${m1}/protection-claims"
              payload: { claim_type: "RATE_REDUCTION", obligation_label: "AUTO_LOAN", deployment_order_id: "${dep1}", base_rate_bps: 1100, monthly_interest_cents: 110000 }
              as: Member
              as_user_id: "${m1}"
              captures: { pc1: $.data.id }
            - call: "POST /membership/members/${m2}/protection-claims"
              payload: { claim_type: "RATE_REDUCTION", obligation_label: "AUTO_LOAN", deployment_order_id: "${dep2}", base_rate_bps: 1100, monthly_interest_cents: 110000 }
              as: Member
              as_user_id: "${m2}"
              captures: { pc2: $.data.id }
          trigger:
            - call: "POST /membership/protection-claims/${pc1}/decide"
              payload: { decision: "APPROVE" }
              as: VerificationOfficer
              as_user_id: "officer-A"
            - call: "POST /membership/protection-claims/${pc2}/decide"
              payload: { decision: "APPROVE" }
              as: VerificationOfficer
              as_user_id: "officer-A"
          assert:
            - "ProtectionClaim.${pc1}.periods_granted == 6 and ProtectionClaim.${pc1}.total_relief_cents == 300000"
            - "ProtectionClaim.${pc2}.periods_granted == 12 and ProtectionClaim.${pc2}.total_relief_cents == 600000"
            - "Same rate inputs, divergent totals driven solely by end_date nullability (variant selection)"

  # ===========================================================================
  # Rule 2 — combinatorial_formula (different modes)
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: scra_relief_floor_per_period_then_sum_rounding_order
        grounds:
          - calculations.scra_rate_relief
          - entities.ProtectionClaim.fields.total_relief_cents
        distinguishing_aspect: |
          Mode (b) nested rounding: with base_rate_bps 700 and
          monthly_interest_cents 105, per-period relief floors to 15 cents
          (105 * 100/700 = 15.0 exactly) while the sum-then-round alternative
          6 * 105 * 100/700 = 90.0 agrees — the pinned discriminator is
          monthly_interest_cents 106: floor-per-period yields 15 * 6 = 90,
          whereas sum-then-round yields round(636 * 100/700) = 91. The scaffold
          pins floor-per-period-then-sum, so 90 is the only correct answer.
        test_recipe:
          setup:
            - "Logical clock 2026-09-01. Member M (ENLISTED_ACTIVE, ACTIVE) with ACTIVE scra_eligible deployment 2026-09-01 -> 2027-03-01 (6 periods) and a RATE_REDUCTION claim base_rate_bps 700, monthly_interest_cents 106."
          setup_api_calls:
            - call: "POST /membership/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /membership/eligibility-cases"
              payload: { applicant_legal_name: "Cara Corps", applicant_dob: "1992-02-02", basis_type: "DIRECT_SERVICE" }
              as: EligibilityApplicant
              captures: { case_c: $.data.id }
            - call: "POST /membership/eligibility-cases/${case_c}/service-records"
              payload: { branch: "MARINES", component: "ACTIVE_DUTY", rank_grade: "E-4", service_start_date: "2016-06-01", discharge_characterization: "STILL_SERVING" }
              as: EligibilityApplicant
              captures: { sr_c: $.data.id }
            - call: "POST /membership/eligibility-cases/${case_c}/evidence"
              payload: { doc_type: "ORDERS", issuing_authority: "HQMC", issued_on: "2026-08-15", covers_service_record_id: "${sr_c}", content_hash: "e5" }
              as: EligibilityApplicant
            - call: "POST /membership/eligibility-cases/${case_c}/submit"
              payload: {}
              as: EligibilityApplicant
            - call: "POST /membership/eligibility-cases/${case_c}/record-reconstruction"
              payload: { decision: "APPROVE", decision_note: "verified" }
              as: VerificationOfficer
              as_user_id: "officer-A"
            - call: "POST /membership/eligibility-cases/${case_c}/decide"
              payload: { decision: "APPROVE" }
              as: VerificationOfficer
              as_user_id: "officer-B"
              captures: { mm: $.data.member_id }
            - call: "GET /membership/members/${mm}"
              payload: {}
              as: VerificationOfficer
              as_user_id: "officer-B"
              captures: { mm_v: $.data.version }
            - call: "POST /membership/members/${mm}/deployment-orders"
              payload: { orders_number: "ORD-100", theater: "EUCOM", start_date: "2026-09-01", end_date: "2027-03-01", scra_eligible: true, expected_member_version: "${mm_v}" }
              as: VerificationOfficer
              captures: { dep_c: $.data.id }
            - call: "POST /membership/members/${mm}/protection-claims"
              payload: { claim_type: "RATE_REDUCTION", obligation_label: "CARD_1", deployment_order_id: "${dep_c}", base_rate_bps: 700, monthly_interest_cents: 106 }
              as: Member
              as_user_id: "${mm}"
              captures: { pc_c: $.data.id }
          trigger:
            - call: "POST /membership/protection-claims/${pc_c}/decide"
              payload: { decision: "APPROVE" }
              as: VerificationOfficer
              as_user_id: "officer-A"
          assert:
            - "ProtectionClaim.${pc_c}.periods_granted == 6"
            - "ProtectionClaim.${pc_c}.total_relief_cents == 90 (floor per period then sum; the sum-then-round reading would produce 91 and is non-conformant)"

      - name: protection_relief_cap_pinned_evaluation_order
        grounds:
          - calculations.protection_relief_cap
          - validations[priority=18]
        distinguishing_aspect: |
          Mode (c) circular-looking dependency with pinned evaluation order:
          net_relief depends on bank_offset (other APPROVED claims), while the
          cap compares net_relief PLUS that same bank_offset against the
          exposure cap. With outstanding approved relief 7488, an exposure cap
          of 10000, and a proposed claim with gross 8172: step order (1) gross
          8172, (2) offset 7488, (3) netting min(7488, 8171) = 7488 -> net 684,
          (4) 684 + 7488 = 8172 <= 10000 passes — whereas evaluating the cap
          against gross (8172 + 7488 = 15660 > 10000) would wrongly reject.
          The pinned order is the only one that accepts.
        test_recipe:
          setup:
            - "Logical clock 2026-09-01. Member M (ENLISTED_ACTIVE) with one OPEN entitlement exposure_cents 10000 (cap = 10000)."
            - "Deployment D (scra_eligible, 2026-09-01 -> 2029-09-01, 36 periods)."
            - "Claim P1 (OBL_A, base 1100, monthly 120): per-period floor(120*500/1100)=54, total 54*36=1944, APPROVED."
            - "Claim P2 (OBL_B, base 1100, monthly 340): per-period floor(340*500/1100)=154, total 154*36=5544, APPROVED. Outstanding offset = 7488."
            - "Claim P3 (OBL_C, base 1100, monthly 500): proposed gross = 227*36 = 8172; 8172 + 7488 = 15660 > 10000 would breach on gross; netting reduces net_relief to 1 so 1 + 7488 = 7489 <= 10000 passes only under the pinned evaluation order."
          setup_api_calls:
            - call: "POST /membership/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /membership/eligibility-cases"
              payload: { applicant_legal_name: "Dana Wing", applicant_dob: "1991-01-01", basis_type: "DIRECT_SERVICE" }
              as: EligibilityApplicant
              captures: { case_d: $.data.id }
            - call: "POST /membership/eligibility-cases/${case_d}/service-records"
              payload: { branch: "AIR_FORCE", component: "ACTIVE_DUTY", rank_grade: "O-2", service_start_date: "2014-05-01", discharge_characterization: "STILL_SERVING" }
              as: EligibilityApplicant
              captures: { sr_d: $.data.id }
            - call: "POST /membership/eligibility-cases/${case_d}/evidence"
              payload: { doc_type: "LEAVE_EARNINGS_STATEMENT", issuing_authority: "DFAS", issued_on: "2026-08-01", covers_service_record_id: "${sr_d}", content_hash: "f6" }
              as: EligibilityApplicant
            - call: "POST /membership/eligibility-cases/${case_d}/submit"
              payload: {}
              as: EligibilityApplicant
            - call: "POST /membership/eligibility-cases/${case_d}/record-reconstruction"
              payload: { decision: "APPROVE", decision_note: "verified" }
              as: VerificationOfficer
              as_user_id: "officer-A"
            - call: "POST /membership/eligibility-cases/${case_d}/decide"
              payload: { decision: "APPROVE" }
              as: VerificationOfficer
              as_user_id: "officer-B"
              captures: { md: $.data.member_id }
            - call: "GET /membership/members/${md}"
              payload: {}
              as: VerificationOfficer
              as_user_id: "officer-B"
              captures: { md_v: $.data.version }
            - call: "POST /membership/product-offerings"
              payload: { product_code: "CK_BASIC", product_line: "BANKING", product_name: "Basic Checking", allowed_categories: ["OFFICER_CADET", "ENLISTED_ACTIVE", "VETERAN_HONORABLE", "FAMILY_SPOUSE", "FAMILY_WIDOW", "FAMILY_CHILD"] }
              as: ProductAdministrator
              captures: { off_ck: $.data.id }
            - call: "POST /membership/members/${md}/entitlements"
              payload: { product_offering_id: "${off_ck}", exposure_cents: 10000 }
              as: Member
              as_user_id: "${md}"
            - call: "POST /membership/members/${md}/deployment-orders"
              payload: { orders_number: "ORD-200", theater: "CENTCOM", start_date: "2026-09-01", end_date: "2029-09-01", scra_eligible: true, expected_member_version: "${md_v}" }
              as: VerificationOfficer
              captures: { dep_d: $.data.id }
            - call: "POST /membership/members/${md}/protection-claims"
              payload: { claim_type: "RATE_REDUCTION", obligation_label: "OBL_A", deployment_order_id: "${dep_d}", base_rate_bps: 1100, monthly_interest_cents: 120 }
              as: Member
              as_user_id: "${md}"
              captures: { pc_a: $.data.id }
            - call: "POST /membership/protection-claims/${pc_a}/decide"
              payload: { decision: "APPROVE" }
              as: VerificationOfficer
              as_user_id: "officer-A"
            - call: "POST /membership/members/${md}/protection-claims"
              payload: { claim_type: "RATE_REDUCTION", obligation_label: "OBL_B", deployment_order_id: "${dep_d}", base_rate_bps: 1100, monthly_interest_cents: 340 }
              as: Member
              as_user_id: "${md}"
              captures: { pc_b: $.data.id }
            - call: "POST /membership/protection-claims/${pc_b}/decide"
              payload: { decision: "APPROVE" }
              as: VerificationOfficer
              as_user_id: "officer-A"
            - call: "POST /membership/members/${md}/protection-claims"
              payload: { claim_type: "RATE_REDUCTION", obligation_label: "OBL_C", deployment_order_id: "${dep_d}", base_rate_bps: 1100, monthly_interest_cents: 500 }
              as: Member
              as_user_id: "${md}"
              captures: { pc_c2: $.data.id }
          trigger:
            - call: "POST /membership/protection-claims/${pc_c2}/decide"
              payload: { decision: "APPROVE" }
              as: VerificationOfficer
              as_user_id: "officer-A"
          assert:
            - "ProtectionClaim.${pc_a}.total_relief_cents == 1944 (54 x 36) and ProtectionClaim.${pc_b}.total_relief_cents == 5544 (154 x 36) — bank_offset == 7488"
            - "P3 gross == 8172 (227 x 36); a cap check against gross would reject (8172 + 7488 = 15660 > 10000), but the pinned step (3) computes net_relief = max(0, 8172 - min(7488, 8171)) = 684 and step (4) compares 684 + 7488 = 8172 <= 10000 — pass"
            - "The decide succeeds (200, status APPROVED) exactly because evaluation order runs netting (step 3) before the cap comparison (step 4); ProtectionClaim.${pc_c2}.total_relief_cents == 8172"

  # ===========================================================================
  # Rule 3 — non_linear_state_machine (different entities)
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: eligibility_case_more_info_revision_loop
        grounds:
          - state_machines.EligibilityCase.UNDER_REVIEW_to_MORE_INFO_REQUIRED
          - state_machines.EligibilityCase.MORE_INFO_REQUIRED_to_UNDER_REVIEW
        distinguishing_aspect: |
          EligibilityCase exhibits a cyclic revision loop
          UNDER_REVIEW -> MORE_INFO_REQUIRED -> UNDER_REVIEW (unbounded), and
          resubmission is gated on evidence uploaded AFTER the loop-back: a
          resubmit with no new document fails ERR_NO_NEW_EVIDENCE even though
          the original evidence still exists.
        test_recipe:
          setup:
            - "Case in MORE_INFO_REQUIRED after one decide REQUEST_MORE_INFO; original evidence doc hash h1 uploaded before the loop."
          setup_api_calls:
            - call: "POST /membership/eligibility-cases"
              payload: { applicant_legal_name: "Eli Guard", applicant_dob: "1995-09-09", basis_type: "DIRECT_SERVICE" }
              as: EligibilityApplicant
              captures: { case_e: $.data.id }
            - call: "POST /membership/eligibility-cases/${case_e}/service-records"
              payload: { branch: "ARMY", component: "NATIONAL_GUARD", rank_grade: "E-5", service_start_date: "2018-01-01", service_end_date: "2024-01-01", discharge_characterization: "HONORABLE" }
              as: EligibilityApplicant
              captures: { sr_e: $.data.id }
            - call: "POST /membership/eligibility-cases/${case_e}/evidence"
              payload: { doc_type: "NGB22", issuing_authority: "NGB", issued_on: "2024-02-01", covers_service_record_id: "${sr_e}", content_hash: "h1" }
              as: EligibilityApplicant
            - call: "POST /membership/eligibility-cases/${case_e}/submit"
              payload: {}
              as: EligibilityApplicant
            - call: "POST /membership/eligibility-cases/${case_e}/decide"
              payload: { decision: "REQUEST_MORE_INFO", decision_note: "need clearer NGB-22" }
              as: VerificationOfficer
              as_user_id: "officer-A"
          trigger:
            - call: "POST /membership/eligibility-cases/${case_e}/submit"
              payload: {}
              as: EligibilityApplicant
