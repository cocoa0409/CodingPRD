            - call: "POST /api/v1/equipment-models"
              payload: { model_number: "IU-O501", equipment_type: "COIL", refrigerant_type: "NONE", capacity_btuh: 36000, family_code: "FAM-X7", list_price_cents: 100000 }
              as: DistributorAdmin
              captures: { iuo_id: $.data.id }
            - call: "POST /api/v1/ahri-ratings"
              payload: { ahri_reference_number: "AHRI-O501", outdoor_unit_id: "${ouo_id}", indoor_unit_id: "${iuo_id}", seer2: 17.0, eer2: 12.5 }
              as: DistributorAdmin
              captures: { ro_id: $.data.id }
            - call: "POST /api/v1/orders"
              payload: { contractor_id: "${cor_id}" }
              as: ContractorUser
              as_user_id: "${cor_id}"
              captures: { oor_id: $.data.id }
            - call: "POST /api/v1/orders/${oor_id}/lines"
              payload: { ahri_rating_id: "${ro_id}", quantity: 1 }
              as: ContractorUser
              as_user_id: "${cor_id}"
            - call: "POST /api/v1/orders/${oor_id}/submit"
              payload: {}
              as: ContractorUser
              as_user_id: "${cor_id}"
            - call: "POST /api/v1/orders/${oor_id}/ship"
              payload: {}
              as: DistributorAdmin
            - call: "POST /api/v1/orders/${oor_id}/deliver"
              payload: {}
              as: DistributorAdmin
            - call: "POST /api/v1/rebate-submissions"
              payload: { contractor_id: "${cor_id}", order_id: "${oor_id}", ahri_rating_id: "${ro_id}", program_type: "FEDERAL_TAX_CREDIT", homeowner_name: "O", install_address: "5 Ash", install_date: "2026-08-01T00:00:00Z", docs: ["AHRI_CERTIFICATE"] }
              as: ContractorUser
              as_user_id: "${cor_id}"
              captures: { rbo_id: $.data.id, rbo_v1: $.data.version }
            - call: "PATCH /api/v1/rebate-submissions/${rbo_id}"
              payload: { expected_rebate_version: "${rbo_v1}", docs: ["AHRI_CERTIFICATE", "INVOICE"] }
              as: ContractorUser
              as_user_id: "${cor_id}"
          trigger:
            - call: "PATCH /api/v1/rebate-submissions/${rbo_id}"
              payload: { expected_rebate_version: "${rbo_v1}", docs: ["AHRI_CERTIFICATE", "INVOICE", "LOAD_CALC"] }
              as: ContractorUser
              as_user_id: "${cor_id}"
              captures: { e: $.data.error_id }
          assert:
            - "trigger PATCH error_id == ERR_STALE_VERSION (version advanced to 2 after the first successful PATCH)"

      - name: billing_event_premature_final_invoice_rejected
        claim_type: violation_to_error
        grounds: ["endpoints.POST_orders_billing_events", "state_machines.OrderBilling.UNBILLED_to_FINAL_INVOICED", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "INVOICE_FINAL on a non-prebuy order that is merely SUBMITTED (not yet SHIPPED) is rejected with ERR_INVALID_STATE — the billing dimension's join gate on fulfillment."
        test_recipe:
          setup: ["submitted order"]
          setup_api_calls:
            - call: "POST /api/v1/contractors"
              payload: { company_name: "Bill Co", license_number: "LIC-C502" }
              as: DistributorAdmin
              captures: { cb_id: $.data.id }
            - call: "POST /api/v1/equipment-models"
              payload: { model_number: "CU-B502", equipment_type: "CONDENSER", refrigerant_type: "R410A", capacity_btuh: 36000, family_code: "FAM-W6", list_price_cents: 500000 }
              as: DistributorAdmin
              captures: { mb_id: $.data.id }
            - call: "POST /api/v1/orders"
              payload: { contractor_id: "${cb_id}" }
              as: ContractorUser
              as_user_id: "${cb_id}"
              captures: { ob_id: $.data.id }
            - call: "POST /api/v1/orders/${ob_id}/lines"
              payload: { equipment_model_id: "${mb_id}", quantity: 1 }
              as: ContractorUser
              as_user_id: "${cb_id}"
            - call: "POST /api/v1/orders/${ob_id}/submit"
              payload: {}
              as: ContractorUser
              as_user_id: "${cb_id}"
          trigger:
            - call: "POST /api/v1/orders/${ob_id}/billing-events"
              payload: { event_type: "INVOICE_FINAL" }
              as: DistributorAdmin
              captures: { e: $.data.error_id }
          assert:
            - "trigger error_id == ERR_INVALID_STATE (non-prebuy UNBILLED order can only FINAL_INVOICE once SHIPPED; order is merely SUBMITTED)"

      - name: training_complete_grants_credits_and_capacity
        claim_type: side_effect_execution
        grounds: ["endpoints.POST_training_courses_complete", "errors[ERR_SEAT_CAPACITY]"]
        distinguishing_aspect: "Completion creates one TrainingCredit per attendee with expires_at = earned_at + 24 months; more attendees than max_seats fails ERR_SEAT_CAPACITY."
        test_recipe:
          setup: ["clock 2026-08-03; course TC-CAP max_seats 1 ended 2026-08-02; contractors C-T1 and C-T2"]
          setup_api_calls:
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T00:00:00Z" }
              as: DistributorAdmin
            - call: "POST /api/v1/contractors"
              payload: { company_name: "T1 Co", license_number: "LIC-C503" }
              as: DistributorAdmin
              captures: { ct1_id: $.data.id }
            - call: "POST /api/v1/contractors"
              payload: { company_name: "T2 Co", license_number: "LIC-C504" }
              as: DistributorAdmin
              captures: { ct2_id: $.data.id }
            - call: "POST /api/v1/training-courses"
              payload: { course_code: "TC-CAP", title: "Cap", credit_hours: 4, session_start: "2026-08-02T00:00:00Z", session_end: "2026-08-02T12:00:00Z", instructor_name: "Instr C", max_seats: 1 }
              as: TrainingCoordinator
              captures: { tcap_id: $.data.id }
          trigger:
            - call: "POST /api/v1/training-courses/${tcap_id}/complete"
              payload: { attendee_contractor_ids: ["${ct1_id}", "${ct2_id}"] }
              as: TrainingCoordinator
              captures: { e: $.data.error_id }
            - call: "POST /api/v1/training-courses/${tcap_id}/complete"
              payload: { attendee_contractor_ids: ["${ct1_id}"] }
              as: TrainingCoordinator
          assert:
            - "first trigger error_id == ERR_SEAT_CAPACITY and course remains SCHEDULED"
            - "second trigger succeeds; TrainingCourse.${tcap_id}.status == COMPLETED"
            - "GET /training-credits?course_id=${tcap_id} returns exactly 1 credit with credit_hours == 4 for contractor ${ct1_id}"

