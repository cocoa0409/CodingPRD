# =============================================================================
# Task 1868 — Silo, Bin & Bulk-Solids Handling Service
# Scaffold seed tables (§1.0–§1.7)
# =============================================================================

scenario: |
  1868. Silo, Bin & Bulk-Solids Handling Service (bulk-solids service contractor): inventory level monitoring & replenishment trigger, material flow problem diagnosis (bridging/ratholing), cleanout & inspection scheduling, bin entry safety & engulfment control, aeration/vibrator retrofit, moisture/caking quality issue, load-out scale calibration, contract service vs capital project

domain_name: silo-bin-bulk-solids-service
api_prefix: "/"

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: posture_driven_gating
  complexity_layers:
    - rate_threshold_triggers
    - cascading_side_effects
    - optimistic_concurrency
    - temporal_windowing
  entity_topology: flat
  state_machine_shape: branching
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: CustomerSite
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Site display name" }
      - { name: state_code, type: string, source: input, description: "Two-letter US state code" }
      - { name: contract_discount_pct, type: number, source: input, default: 0, description: "Contract-service discount percent applied to estimates and invoices; 0–100" }
      - { name: capital_threshold_cents, type: integer, source: input, default: 500000, description: "Quoted estimates >= this amount route the ticket to CAPITAL_PROJECT track" }
      - { name: credit_hold, type: boolean, source: input, default: false, description: "When true, scheduling new service is blocked (fiscal gate)" }
      - { name: site_posture, type: enum, source: computed, description: "NORMAL | ATTENTION | CRITICAL — worst-case rollup of child Vessel.flow_posture (see flow_posture_derivation)" }

  - name: Technician
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Technician full name" }
      - { name: weekly_capacity_hours, type: number, source: input, description: "Total schedulable hours per week; > 0" }
      - { name: certifications, type: array, source: input, default: [], description: "Free-form certification labels (e.g. CONFINED_SPACE)" }
      - { name: active, type: boolean, source: input, default: true, description: "Inactive technicians cannot be scheduled" }
      - { name: remaining_capacity_hours, type: number, source: computed, description: "= weekly_capacity_hours - sum(est_hours of ServiceTickets with technician_id = this.id and status IN {SCHEDULED, IN_PROGRESS})" }

  - name: Vessel
    parent: null
    common_fields: true
    fields:
      - { name: site_id, type: string, source: input, description: "FK -> CustomerSite.id; owning site" }
      - { name: name, type: string, source: input, description: "Vessel tag (e.g. SILO-3)" }
      - { name: vessel_kind, type: enum, source: input, description: "SILO | BIN | HOPPER" }
      - { name: capacity_tons, type: number, source: input, description: "Nominal capacity in short tons; > 0" }
      - { name: material_name, type: string, source: input, description: "Stored bulk solid (e.g. cement, flour, pellets)" }
      - { name: opening_inventory_tons, type: number, source: input, default: 0, description: "Implicit inventory anchor at vessel creation before any LevelReading; >= 0" }
      - { name: reorder_point_pct, type: number, source: input, description: "Reading at or below this pct of capacity auto-triggers replenishment; 0–100" }
      - { name: target_fill_pct, type: number, source: input, default: 90, description: "Fill target used by TARGET_FILL reorder policy; 0 < target <= 100" }
      - { name: replenishment_policy, type: enum, source: input, default: "TARGET_FILL", description: "TARGET_FILL | DAYS_OF_COVER — selects reorder_quantity variant" }
      - { name: cover_days, type: number, source: input, default: 7, description: "Days-of-cover target used by DAYS_OF_COVER policy; > 0" }
      - { name: default_usage_tons, type: number, source: input, default: 1.0, description: "Fallback avg daily usage when fewer than 2 readings exist in the trailing window; >= 0" }
      - { name: moisture_limit_pct, type: number, source: input, default: 12.0, description: "Moisture content above this marks the vessel FLOW_IMPAIRED; 0–100" }
      - { name: error_basis, type: enum, source: input, default: "OF_READING", description: "OF_READING | OF_FULL_SCALE — selects calibration_error_pct variant" }
      - { name: full_scale_tons, type: number, source: input, default: null, description: "Load-out scale full-scale capacity; required when error_basis = OF_FULL_SCALE, otherwise ignored" }
      - { name: current_inventory_tons, type: number, source: computed, description: "Anchor inventory + receipts after anchor - voids (see current_inventory_tons calc)" }
      - { name: flow_posture, type: enum, source: computed, description: "NORMAL | PENDING_REPLENISHMENT | FLOW_IMPAIRED — derived gate (see flow_posture_derivation)" }
      - { name: scale_status, type: enum, source: computed, default: "IN_TOLERANCE", description: "IN_TOLERANCE | OUT_OF_TOLERANCE — result of latest ScaleCalibration" }

  - name: LevelReading
    parent: null
    common_fields: false
    fields:
      - { name: vessel_id, type: string, source: input, description: "FK -> Vessel.id; vessel measured" }
      - { name: measured_at, type: datetime, source: input, description: "When the level was measured (ISO 8601 UTC)" }
      - { name: level_pct, type: number, source: input, description: "Measured level as pct of capacity; 0–100 inclusive" }
      - { name: source, type: enum, source: input, default: "MANUAL", description: "MANUAL | SENSOR" }

  - name: MaterialQualityReport
    parent: null
    common_fields: false
    fields:
      - { name: vessel_id, type: string, source: input, description: "FK -> Vessel.id; vessel sampled" }
      - { name: sampled_at, type: datetime, source: input, description: "Sample timestamp (ISO 8601 UTC)" }
      - { name: moisture_pct, type: number, source: input, description: "Measured moisture content pct; 0–100" }
      - { name: caking_index, type: integer, source: input, description: "Lab caking index 1 (free flowing) – 5 (fully caked)" }
      - { name: flowability_grade, type: enum, source: computed, description: "GOOD | MARGINAL | POOR — POOR if moisture_pct > vessel.moisture_limit_pct or caking_index >= 4; MARGINAL if moisture_pct > moisture_limit_pct - 2 or caking_index == 3; else GOOD" }

  - name: ScaleCalibration
    parent: null
    common_fields: false
    fields:
      - { name: vessel_id, type: string, source: input, description: "FK -> Vessel.id; vessel whose load-out scale is tested" }
      - { name: tested_at, type: datetime, source: input, description: "Calibration timestamp (ISO 8601 UTC)" }
      - { name: test_weight_tons, type: number, source: input, description: "Certified test weight applied; > 0" }
      - { name: indicated_tons, type: number, source: input, description: "Scale reading under the test weight; >= 0" }
      - { name: tolerance_pct, type: number, source: input, default: 0.25, description: "Pass tolerance: |error_pct| <= tolerance_pct passes; > 0" }
      - { name: error_basis_used, type: enum, source: system, description: "OF_READING | OF_FULL_SCALE — snapshot of vessel.error_basis at test time" }
      - { name: error_pct, type: number, source: computed, description: "See calibration_error_pct; 3 decimal places round_half_up" }
      - { name: result, type: enum, source: computed, description: "PASS | FAIL — PASS when |error_pct| <= tolerance_pct" }

  - name: ReplenishmentOrder
    parent: null
    common_fields: true
    fields:
      - { name: vessel_id, type: string, source: system, description: "FK -> Vessel.id; vessel being replenished" }
      - { name: trigger_reading_id, type: string, source: system, description: "FK -> LevelReading.id; reading that triggered this order" }
      - { name: policy_used, type: enum, source: system, description: "TARGET_FILL | DAYS_OF_COVER — snapshot of vessel.replenishment_policy at trigger time" }
      - { name: order_quantity_tons, type: number, source: computed, description: "Computed by reorder_quantity; 1 decimal place round_half_up" }
      - { name: status, type: enum, source: system, description: "TRIGGERED -> DISPATCHED -> RECEIVED; TRIGGERED -> CANCELLED; RECEIVED -> VOIDED" }
      - { name: delivered_tons, type: number, source: input, description: "Actual delivered quantity recorded at receive; > 0" }
      - { name: received_at, type: datetime, source: input, description: "Delivery timestamp recorded at receive" }

  - name: ServiceTicket
    parent: null
    common_fields: true
    fields:
      - { name: site_id, type: string, source: input, description: "FK -> CustomerSite.id; site served" }
      - { name: vessel_id, type: string, source: input, description: "FK -> Vessel.id; vessel serviced" }
      - { name: technician_id, type: string, source: system, description: "FK -> Technician.id; assigned at schedule; null before" }
      - { name: source_permit_id, type: string, source: system, description: "FK -> EntryPermit.id; set when auto-created from permit-close findings; null otherwise" }
      - { name: job_type, type: enum, source: input, description: "DIAGNOSIS | CLEANOUT | INSPECTION | RETROFIT_AERATION | RETROFIT_VIBRATOR" }
      - { name: requires_entry, type: boolean, source: input, description: "True when the job requires personnel bin entry (permit-gated)" }
      - { name: est_hours, type: number, source: input, description: "Estimated crew-hours; > 0" }
      - { name: crew_size, type: integer, source: input, description: "Crew headcount; >= 1" }
      - { name: description, type: string, source: input, default: "", description: "Free-text problem description" }
      - { name: status, type: enum, source: system, description: "DRAFT -> QUOTED -> APPROVED -> SCHEDULED -> IN_PROGRESS -> COMPLETED; QUOTED -> DECLINED; IN_PROGRESS -> ON_HOLD -> IN_PROGRESS" }
      - { name: estimate_cents, type: integer, source: computed, description: "Provisional estimate computed at creation by service_estimate_cents" }
      - { name: commercial_track, type: enum, source: computed, description: "CONTRACT_SERVICE | CAPITAL_PROJECT — set at quote: CAPITAL_PROJECT when estimate_cents >= site.capital_threshold_cents" }
      - { name: window_start, type: datetime, source: input, description: "Scheduled window start (ISO 8601 UTC); set at schedule" }
      - { name: window_end, type: datetime, source: input, description: "Scheduled window end; strictly after window_start" }
      - { name: actual_hours, type: number, source: input, description: "Actual crew-hours recorded at complete; > 0" }
      - { name: mileage_miles, type: number, source: input, description: "Billable mileage recorded at complete; >= 0" }
      - { name: disposal_tons, type: number, source: input, description: "Material disposed recorded at complete; >= 0" }
      - { name: invoice_labor_cents, type: integer, source: computed, description: "Per-line rounded labor line (see invoice_total_cents)" }
      - { name: invoice_mobilization_cents, type: integer, source: computed, description: "Per-line rounded mileage line" }
      - { name: invoice_disposal_cents, type: integer, source: computed, description: "Per-line rounded disposal line" }
      - { name: invoice_subtotal_cents, type: integer, source: computed, description: "Sum of per-line rounded lines" }
      - { name: invoice_discount_cents, type: integer, source: computed, description: "round_half_up(subtotal x contract_discount_pct/100, 0)" }
      - { name: invoice_tax_cents, type: integer, source: computed, description: "round_half_up((subtotal - discount) x 6.0/100, 0)" }
      - { name: invoice_total_cents, type: integer, source: computed, description: "subtotal - discount + tax" }

  - name: EntryPermit
    parent: null
    common_fields: true
    fields:
      - { name: vessel_id, type: string, source: input, description: "FK -> Vessel.id; vessel to be entered" }
      - { name: ticket_id, type: string, source: input, description: "FK -> ServiceTicket.id; ticket this entry serves" }
      - { name: entrant_technician_id, type: string, source: input, description: "FK -> Technician.id; technician who will enter" }
      - { name: issuer_user_id, type: string, source: system, description: "X-User-ID of the SafetyOfficer who issued the permit; set at issue" }
      - { name: window_start, type: datetime, source: input, description: "Planned entry window start (ISO 8601 UTC)" }
      - { name: window_end, type: datetime, source: input, description: "Planned entry window end; strictly after window_start" }
      - { name: lockout_checklist_confirmed, type: boolean, source: input, description: "Zero-energy lockout checklist confirmed at issue; must be true to issue" }
      - { name: atmosphere_ok, type: boolean, source: computed, description: "Result of most recent atmosphere evaluation (see atmosphere evaluation constants)" }
      - { name: last_oxygen_pct, type: number, source: system, description: "Most recent O2 reading recorded on this permit" }
      - { name: last_combustible_pct, type: number, source: system, description: "Most recent combustible-gas pct-of-LEL reading recorded on this permit" }
      - { name: status, type: enum, source: system, description: "DRAFT -> ISSUED -> ACTIVE -> CLOSED; ACTIVE <-> SUSPENDED; DRAFT|ISSUED -> VOIDED (auto)" }
      - { name: void_reason, type: enum, source: system, default: "NONE", description: "NONE | AUTO_QUALITY_HAZARD — set when auto-voided by a moisture/caking breach" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: ReplenishmentOrder
    initial_state: TRIGGERED
    terminal_states: [RECEIVED, CANCELLED, VOIDED]
    transitions:
      - from: TRIGGERED
        to: DISPATCHED
        trigger: "POST /replenishment-orders/{id}/dispatch"
        actor: ServiceManager
        preconditions:
          - "order.status == TRIGGERED (else ERR_INVALID_ORDER_STATE)"
        side_effects:
          - "order remains in the open-order set used by flow_posture_derivation"
      - from: DISPATCHED
        to: RECEIVED
        trigger: "POST /replenishment-orders/{id}/receive"
        actor: PlantOperator | Technician
        preconditions:
          - "order.status == DISPATCHED (else ERR_INVALID_ORDER_STATE)"
          - "vessel.scale_status != OUT_OF_TOLERANCE (else ERR_SCALE_OUT_OF_TOLERANCE)"
          - "delivered_tons > 0 (else ERR_VALIDATION)"
        side_effects:
          - "vessel.current_inventory_tons recomputed: anchor inventory + delivered_tons of this order (received_at must be after the anchor reading's measured_at to add; if received_at <= anchor measured_at the receipt is already inside the anchor and inventory does not change)"
          - "vessel.flow_posture recomputed (order leaves open-order set; PENDING_REPLENISHMENT may clear)"
          - "site.site_posture recomputed from child vessels"
          - "increments vessel.version by 1"
      - from: TRIGGERED
        to: CANCELLED
        trigger: "POST /replenishment-orders/{id}/cancel"
        actor: PlantOperator | ServiceManager
        preconditions:
          - "order.status == TRIGGERED (else ERR_INVALID_ORDER_STATE)"
        side_effects:
          - "vessel.flow_posture recomputed (order leaves open-order set)"
          - "site.site_posture recomputed"
          - "increments vessel.version by 1"
      - from: RECEIVED
        to: VOIDED
        trigger: "POST /replenishment-orders/{id}/void"
        actor: ServiceManager
        preconditions:
          - "order.status == RECEIVED (else ERR_INVALID_ORDER_STATE)"
          - "vessel.current_inventory_tons - order.delivered_tons >= 0 (else ERR_INVENTORY_WOULD_GO_NEGATIVE)"
        side_effects:
          - "vessel.current_inventory_tons recomputed without this receipt (mass-balance compensation)"
          - "vessel.flow_posture and site.site_posture recomputed"
          - "increments vessel.version by 1"

  - entity: ServiceTicket
    initial_state: DRAFT
    terminal_states: [COMPLETED, DECLINED]
    transitions:
      - from: DRAFT
        to: QUOTED
        trigger: "POST /service-tickets/{id}/quote"
        actor: ServiceManager
        preconditions:
          - "ticket.status == DRAFT (else ERR_INVALID_TICKET_STATE)"
        side_effects:
          - "commercial_track = CAPITAL_PROJECT when estimate_cents >= site.capital_threshold_cents, else CONTRACT_SERVICE"
      - from: QUOTED
        to: APPROVED
        trigger: "POST /service-tickets/{id}/approve"
        actor: PlantOperator | ServiceManager
        preconditions:
          - "ticket.status == QUOTED (else ERR_INVALID_TICKET_STATE)"
          - "commercial_track == CONTRACT_SERVICE requires actor PlantOperator owning ticket.site_id; commercial_track == CAPITAL_PROJECT requires actor ServiceManager (else ERR_FORBIDDEN)"
        side_effects: []
      - from: QUOTED
        to: DECLINED
        trigger: "POST /service-tickets/{id}/decline"
        actor: PlantOperator
        preconditions:
          - "ticket.status == QUOTED (else ERR_INVALID_TICKET_STATE)"
        side_effects: []
      - from: APPROVED
        to: SCHEDULED
        trigger: "POST /service-tickets/{id}/schedule"
        actor: ServiceManager
        preconditions:
          - "ticket.status == APPROVED (else ERR_INVALID_TICKET_STATE)"
          - "technician exists (else ERR_TECHNICIAN_NOT_FOUND) and technician.active == true (else ERR_VALIDATION)"
          - "window_end > window_start and window_start > current logical clock (else ERR_WINDOW_IN_PAST)"
          - "no half-open overlap with another SCHEDULED/IN_PROGRESS/ON_HOLD ticket window for the same technician; adjacency allowed (else ERR_TECHNICIAN_DOUBLE_BOOKED)"
          - "vessel downtime buffer: gap to every other occupied downtime interval on the same vessel (other tickets' windows with status IN {SCHEDULED, IN_PROGRESS, ON_HOLD} and EntryPermit windows with status IN {DRAFT, ISSUED, ACTIVE, SUSPENDED}, excluding intervals that share this ticket's id) must be >= 2 hours on both sides (else ERR_VESSEL_DOWNTIME_CONFLICT)"
          - "site.credit_hold == false (else ERR_CREDIT_HOLD)"
        side_effects:
          - "ticket.technician_id = technician_id; window_start/window_end stored"
          - "technician.remaining_capacity_hours recomputed (decreases by est_hours)"
      - from: SCHEDULED
        to: IN_PROGRESS
        trigger: "POST /service-tickets/{id}/start"
        actor: Technician
        preconditions:
          - "ticket.status == SCHEDULED (else ERR_INVALID_TICKET_STATE)"
          - "acting technician's X-User-ID == ticket.technician_id (else ERR_FORBIDDEN)"
          - "if requires_entry == true: an EntryPermit with ticket_id == ticket.id and status == ACTIVE exists (else ERR_ENTRY_PERMIT_REQUIRED)"
        side_effects: []
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /service-tickets/{id}/complete"
        actor: Technician
        preconditions:
          - "ticket.status == IN_PROGRESS (else ERR_INVALID_TICKET_STATE)"
          - "acting technician's X-User-ID == ticket.technician_id (else ERR_FORBIDDEN)"
        side_effects:
          - "invoice lines computed per invoice_total_cents (per-line rounding, then sum, then discount, then tax)"
          - "technician.remaining_capacity_hours recomputed (est_hours released)"
      - from: IN_PROGRESS
        to: ON_HOLD
        trigger: "system (automatic when the ACTIVE EntryPermit bound to this ticket is SUSPENDED)"
        actor: system
        preconditions:
          - "ticket.status == IN_PROGRESS"
        side_effects:
          - "technician.remaining_capacity_hours recomputed (est_hours released while ON_HOLD; see technician_remaining_hours)"
      - from: ON_HOLD
        to: IN_PROGRESS
        trigger: "system (automatic when the SUSPENDED EntryPermit bound to this ticket returns to ACTIVE)"
        actor: system
        preconditions:
          - "ticket.status == ON_HOLD"
        side_effects:
          - "technician.remaining_capacity_hours recomputed (est_hours re-allocated on resume)"

  - entity: EntryPermit
    initial_state: DRAFT
    terminal_states: [CLOSED, VOIDED]
    transitions:
      - from: DRAFT
        to: ISSUED
        trigger: "POST /entry-permits/{id}/issue"
        actor: SafetyOfficer
        preconditions:
          - "permit.status == DRAFT (else ERR_INVALID_PERMIT_STATE)"
          - "lockout_checklist_confirmed == true (else ERR_LOCKOUT_NOT_VERIFIED)"
          - "issuer X-User-ID != permit.entrant_technician_id (segregation of duties; else ERR_SOD_ISSUER_EQUALS_ENTRANT)"
          - "no ReplenishmentOrder with vessel_id == permit.vessel_id and status == DISPATCHED (engulfment control; else ERR_INBOUND_DELIVERY_PENDING)"
        side_effects:
          - "permit.issuer_user_id = acting SafetyOfficer X-User-ID"
      - from: ISSUED
        to: ACTIVE
        trigger: "POST /entry-permits/{id}/activate"
        actor: SafetyOfficer
        preconditions:
          - "permit.status == ISSUED (else ERR_INVALID_PERMIT_STATE)"
          - "atmosphere pass: O2_MIN_PCT <= oxygen_pct <= O2_MAX_PCT and combustible_pct <= COMBUSTIBLE_MAX_PCT_LEL (else ERR_ATMOSPHERE_UNSAFE)"
        side_effects:
          - "permit.last_oxygen_pct / last_combustible_pct recorded; atmosphere_ok = true"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /entry-permits/{id}/atmosphere-check with failing values"
        actor: SafetyOfficer | Technician
        preconditions:
          - "permit.status == ACTIVE (else ERR_INVALID_PERMIT_STATE)"
          - "atmosphere fail: oxygen_pct < O2_MIN_PCT or oxygen_pct > O2_MAX_PCT or combustible_pct > COMBUSTIBLE_MAX_PCT_LEL (a passing check leaves status ACTIVE and only updates readings)"
        side_effects:
          - "permit.atmosphere_ok = false; last readings recorded"
          - "cascade: the ServiceTicket with id == permit.ticket_id and status == IN_PROGRESS auto-transitions to ON_HOLD"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /entry-permits/{id}/resume with passing atmosphere values"
        actor: SafetyOfficer
        preconditions:
          - "permit.status == SUSPENDED (else ERR_INVALID_PERMIT_STATE)"
          - "atmosphere pass per activate limits (else ERR_ATMOSPHERE_UNSAFE)"
        side_effects:
          - "permit.atmosphere_ok = true; last readings recorded"
          - "cascade: the ServiceTicket with id == permit.ticket_id and status == ON_HOLD auto-transitions to IN_PROGRESS"
      - from: ACTIVE
        to: CLOSED
        trigger: "POST /entry-permits/{id}/close"
        actor: SafetyOfficer
        preconditions:
          - "permit.status == ACTIVE (else ERR_INVALID_PERMIT_STATE)"
        side_effects:
          - "if findings != NONE: auto-create a ServiceTicket { site_id = vessel.site_id, vessel_id = permit.vessel_id, job_type = DIAGNOSIS, requires_entry = false, est_hours = 4, crew_size = 1, source_permit_id = permit.id, status = DRAFT } with estimate_cents computed"
      - from: DRAFT
        to: VOIDED
        trigger: "system (automatic when the vessel's latest MaterialQualityReport breaches moisture/caking limits and flow_posture becomes FLOW_IMPAIRED)"
        actor: system
        preconditions:
          - "permit.status == DRAFT"
        side_effects:
          - "permit.void_reason = AUTO_QUALITY_HAZARD"
      - from: ISSUED
        to: VOIDED
        trigger: "system (same automatic quality-hazard cascade as DRAFT -> VOIDED)"
        actor: system
        preconditions:
          - "permit.status == ISSUED"
        side_effects:
          - "permit.void_reason = AUTO_QUALITY_HAZARD"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC only)
# =============================================================================
concurrency_rules:
  - rule_id: vessel-config-stale-version
    parent_entity: Vessel
    write_endpoint: "PATCH /vessels/{id}"
    occ_field: "expected_vessel_version"
    description: |
      Updating a Vessel's monitoring configuration with an
      expected_vessel_version that no longer matches the vessel's current
      version is rejected. This captures the case where another writer has
      just modified the vessel configuration and the current writer's view
      of the vessel is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: current_inventory_tons
    trigger: "LevelReading creation, ReplenishmentOrder receive, ReplenishmentOrder void"
    algorithm: chronological
    formula: |
      anchor = the LevelReading of the vessel with max(measured_at);
               ties broken by max(created_at). If no readings exist, the
               implicit anchor is (measured_at = vessel.created_at,
               anchor_inventory = vessel.opening_inventory_tons).
      anchor_inventory = round_half_up(anchor.level_pct * vessel.capacity_tons / 100, 1)
      current_inventory_tons = round_half_up(
          anchor_inventory
          + sum(delivered_tons of orders with vessel_id = vessel.id,
                status == RECEIVED, received_at > anchor.measured_at), 1)
      A RECEIVED order later VOIDED simply leaves the RECEIVED set, so
      receive followed by void restores the pre-receipt value exactly.
    input_set: "All LevelReadings of the vessel; ReplenishmentOrders of the vessel with status RECEIVED"
    precision: "1 decimal place, round_half_up"

  - name: reorder_quantity
    trigger: "LevelReading creation when level_pct <= vessel.reorder_point_pct (inclusive) AND no order with status IN {TRIGGERED, DISPATCHED} exists for the vessel"
    algorithm: forward_looking
    formula: |
      policy = vessel.replenishment_policy (snapshot onto order.policy_used)
      if policy == TARGET_FILL:
          qty = vessel.target_fill_pct/100 * vessel.capacity_tons - current_inventory_tons
      else:  # DAYS_OF_COVER
          qty = vessel.cover_days * avg_daily_usage_tons - current_inventory_tons
      qty = max(0, qty); order_quantity_tons = round_half_up(qty, 1)
      When triggered, the system auto-creates a ReplenishmentOrder
      {status = TRIGGERED, trigger_reading_id = this reading's id}.
    input_set: "The triggering LevelReading; vessel config; avg_daily_usage_tons for DAYS_OF_COVER"
    precision: "1 decimal place, round_half_up"
    variants:
      - name: TARGET_FILL
        when: "vessel.replenishment_policy == TARGET_FILL"
        difference: "Fills to a fixed capacity percentage regardless of consumption rate"
      - name: DAYS_OF_COVER
        when: "vessel.replenishment_policy == DAYS_OF_COVER"
        difference: "Sizes the order from cover_days x usage rate; identical inventory data yields a different quantity than TARGET_FILL"

  - name: avg_daily_usage_tons
    trigger: "evaluated inside reorder_quantity when policy == DAYS_OF_COVER"
    algorithm: chronological
    formula: |
      window = LevelReadings of the vessel with measured_at in
               (current_clock - 14 days, current_clock], ordered by measured_at ASC,
               ties by created_at ASC.
      if fewer than 2 readings in window: return vessel.default_usage_tons
      earliest = first in window order; latest = last in window order
      receipts = sum(delivered_tons of orders status == RECEIVED with
                     received_at in (earliest.measured_at, latest.measured_at])
      days = (latest.measured_at - earliest.measured_at) in fractional days
      usage = (inventory_at(earliest) - inventory_at(latest) + receipts) / days
      return max(0, round_half_up(usage, 2))
      inventory_at(r) = round_half_up(r.level_pct * capacity_tons / 100, 1)
    input_set: "LevelReadings in the trailing 14-day window; RECEIVED orders between the boundary readings"
    precision: "2 decimal places, round_half_up"

  - name: calibration_error_pct
    trigger: "ScaleCalibration creation"
    algorithm: threshold
    formula: |
      basis = vessel.error_basis (snapshot onto calibration.error_basis_used)
      if basis == OF_READING:
          error_pct = (indicated_tons - test_weight_tons) / test_weight_tons * 100
      else:  # OF_FULL_SCALE
          error_pct = (indicated_tons - test_weight_tons) / vessel.full_scale_tons * 100
      error_pct = round_half_up(error_pct, 3)
      result = PASS if abs(error_pct) <= tolerance_pct else FAIL   (inclusive boundary)
      vessel.scale_status = IN_TOLERANCE on PASS, OUT_OF_TOLERANCE on FAIL
    input_set: "The calibration record's test/indicated weights; vessel.error_basis and full_scale_tons"
    precision: "3 decimal places, round_half_up"
    variants:
      - name: OF_READING
        when: "vessel.error_basis == OF_READING"
        difference: "Error expressed relative to the applied test weight"
      - name: OF_FULL_SCALE
        when: "vessel.error_basis == OF_FULL_SCALE"
        difference: "Error expressed relative to full-scale capacity; identical weights yield a smaller |error_pct| and can flip PASS/FAIL"

  - name: service_estimate_cents
    trigger: "ServiceTicket creation (provisional estimate_cents)"
    algorithm: tiered_pricing
    formula: |
      base = BASE_RATE_CENTS_PER_CREW_HOUR[job_type] * est_hours * crew_size
      mult = EMERGENCY_MULT if vessel.flow_posture == FLOW_IMPAIRED at creation else 1.0
      subtotal = round_half_up(base * mult, 0)
      discount = round_half_up(subtotal * site.contract_discount_pct / 100, 0)
      estimate_cents = subtotal - discount
    input_set: "ticket job_type/est_hours/crew_size; vessel.flow_posture; site.contract_discount_pct"
    constants:
      BASE_RATE_CENTS_PER_CREW_HOUR: { DIAGNOSIS: 9500, CLEANOUT: 14500, INSPECTION: 11000, RETROFIT_AERATION: 22000, RETROFIT_VIBRATOR: 18000 }
      EMERGENCY_MULT: 1.5
    precision: "0 decimal places (integer cents), round_half_up"

  - name: invoice_total_cents
    trigger: "ServiceTicket completion"
    algorithm: aggregation
    formula: |
      ROUNDING ORDER IS PINNED — per-line first, then sum, then discount, then tax.
      labor         = round_half_up(actual_hours * BASE_RATE_CENTS_PER_CREW_HOUR[job_type] * crew_size, 0)
      mobilization  = round_half_up(mileage_miles * MILEAGE_RATE_CENTS_PER_MILE, 0)
      disposal      = round_half_up(disposal_tons * DISPOSAL_RATE_CENTS_PER_TON, 0)
      subtotal      = labor + mobilization + disposal
      discount      = round_half_up(subtotal * site.contract_discount_pct / 100, 0)
      taxable       = subtotal - discount
      tax           = round_half_up(taxable * TAX_RATE_PCT / 100, 0)
      total         = taxable + tax
      Summing raw fractional lines and rounding once at the end is
      NON-CONFORMANT and produces different cents.
    input_set: "completion inputs actual_hours/mileage_miles/disposal_tons; ticket job_type/crew_size; site.contract_discount_pct"
    constants:
      BASE_RATE_CENTS_PER_CREW_HOUR: { DIAGNOSIS: 9500, CLEANOUT: 14500, INSPECTION: 11000, RETROFIT_AERATION: 22000, RETROFIT_VIBRATOR: 18000 }
      MILEAGE_RATE_CENTS_PER_MILE: 331.7
      DISPOSAL_RATE_CENTS_PER_TON: 3653.92
      TAX_RATE_PCT: 6.0
    precision: "0 decimal places (integer cents), round_half_up, per-line before sum"

  - name: flow_posture_derivation
    trigger: "LevelReading-triggered order set change, order receive/cancel, MaterialQualityReport creation"
    algorithm: threshold
    formula: |
      latest_qr = MaterialQualityReport of the vessel with max(sampled_at),
                  ties by max(created_at); none if no reports.
      impaired = latest_qr exists and
                 (latest_qr.moisture_pct > vessel.moisture_limit_pct or
                  latest_qr.caking_index >= 4)
      open_order = exists ReplenishmentOrder vessel_id = vessel.id with
                   status IN {TRIGGERED, DISPATCHED}
      vessel.flow_posture = FLOW_IMPAIRED if impaired
                            else PENDING_REPLENISHMENT if open_order
                            else NORMAL
      site.site_posture = CRITICAL if any vessel of the site is FLOW_IMPAIRED
                          else ATTENTION if any vessel is PENDING_REPLENISHMENT
                          else NORMAL
      When flow_posture becomes FLOW_IMPAIRED, every EntryPermit of the vessel
      with status IN {DRAFT, ISSUED} auto-transitions to VOIDED with
      void_reason = AUTO_QUALITY_HAZARD.
    input_set: "Latest MaterialQualityReport per vessel; open ReplenishmentOrders; child vessels per site"

  - name: technician_remaining_hours
    trigger: "ServiceTicket schedule, completion, decline of a scheduled ticket is impossible; recompute on any ticket status change touching {SCHEDULED, IN_PROGRESS}"
    algorithm: aggregation
    formula: |
      remaining_capacity_hours = weekly_capacity_hours
          - sum(est_hours of ServiceTickets with technician_id = technician.id
                and status IN {SCHEDULED, IN_PROGRESS})
      ON_HOLD tickets no longer count (the crew is released to standby by the
      safety hold); COMPLETED/DECLINED tickets never count.
      Schedule-then-complete therefore restores the pre-schedule value exactly.
    input_set: "ServiceTickets of the technician with status IN {SCHEDULED, IN_PROGRESS}"
    precision: "2 decimal places, round_half_up"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and role is a declared role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: existence
    check: "Request body is well-formed: all required input fields present, types valid, enum values in range, numeric ranges respected (e.g. level_pct 0-100, window_end > window_start); unknown fields rejected"
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: "all endpoints with a request body"
  - priority: 3
    category: auth
    check: "Role is permitted for this endpoint; entity-backed ownership: PlantOperator's X-User-ID must equal the site's id for site-scoped resources; Technician's X-User-ID must equal ticket.technician_id for start/complete; approve role must match commercial_track"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all"
  - priority: 4
    category: existence
    check: "Path and body-referenced resources exist (site, vessel, technician, ticket, permit, order, reading)"
    error_id: ERR_SITE_NOT_FOUND | ERR_VESSEL_NOT_FOUND | ERR_TECHNICIAN_NOT_FOUND | ERR_TICKET_NOT_FOUND | ERR_PERMIT_NOT_FOUND | ERR_ORDER_NOT_FOUND
    http_status: 404
    applies_to: "all resource endpoints"
  - priority: 5
    category: state
    check: "OCC: expected_vessel_version equals the vessel's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "PATCH /vessels/{id}"
  - priority: 6
    category: state
    check: "Target resource is in a valid from-state for the requested transition"
    error_id: ERR_INVALID_TICKET_STATE | ERR_INVALID_ORDER_STATE | ERR_INVALID_PERMIT_STATE
    http_status: 409
    applies_to: "all action endpoints"
  - priority: 7
    category: business_safety
    check: "Bin-entry safety: lockout checklist confirmed; issuer != entrant (segregation of duties); no DISPATCHED inbound order for the vessel (engulfment control); atmosphere within limits; requires_entry ticket has an ACTIVE permit at start"
    error_id: ERR_LOCKOUT_NOT_VERIFIED | ERR_SOD_ISSUER_EQUALS_ENTRANT | ERR_INBOUND_DELIVERY_PENDING | ERR_ATMOSPHERE_UNSAFE | ERR_ENTRY_PERMIT_REQUIRED
    http_status: 409
    applies_to: "entry-permit issue/activate/atmosphere-check/resume; service-ticket start"
  - priority: 8
    category: business_temporal
    check: "Scheduling: window strictly in the future; technician half-open window overlap; vessel downtime 2-hour buffer; scale in tolerance at receive; void keeps inventory non-negative"
    error_id: ERR_WINDOW_IN_PAST | ERR_TECHNICIAN_DOUBLE_BOOKED | ERR_VESSEL_DOWNTIME_CONFLICT | ERR_SCALE_OUT_OF_TOLERANCE | ERR_INVENTORY_WOULD_GO_NEGATIVE
    http_status: 409
    applies_to: "service-ticket schedule; entry-permit create; order receive/void"
  - priority: 9
    category: business_fiscal
    check: "Site not on credit hold when scheduling new service"
    error_id: ERR_CREDIT_HOLD
    http_status: 409
    applies_to: "POST /service-tickets/{id}/schedule"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  - method: POST
    path: "/sites"
    description: "Create a customer site"
    roles: [ServiceManager]
    code: 201
    input: [name, state_code, "contract_discount_pct?", "capital_threshold_cents?", "credit_hold?"]
    output: CustomerSite
    side_effects: ["site_posture = NORMAL (no vessels)"]

  - method: GET
    path: "/sites/{id}"
    description: "Get a site (includes computed site_posture)"
    roles: [ServiceManager, PlantOperator, Technician, SafetyOfficer]
    code: 200
    input: []
    output: CustomerSite
    side_effects: []

  - method: POST
    path: "/technicians"
    description: "Register a field technician"
    roles: [ServiceManager]
    code: 201
    input: [name, weekly_capacity_hours, "certifications?", "active?"]
    output: Technician
    side_effects: ["remaining_capacity_hours = weekly_capacity_hours"]

  - method: GET
    path: "/technicians/{id}"
    description: "Get a technician (includes computed remaining_capacity_hours)"
    roles: [ServiceManager, PlantOperator, Technician, SafetyOfficer]
    code: 200
    input: []
    output: Technician
    side_effects: []

  - method: POST
    path: "/vessels"
    description: "Register a silo/bin/hopper at a site"
    roles: [ServiceManager]
    code: 201
    input: [site_id, name, vessel_kind, capacity_tons, material_name, "opening_inventory_tons?", reorder_point_pct, "target_fill_pct?", "replenishment_policy?", "cover_days?", "default_usage_tons?", "moisture_limit_pct?", "error_basis?", "full_scale_tons?"]
    output: Vessel
    side_effects: ["current_inventory_tons = opening_inventory_tons", "flow_posture = NORMAL", "scale_status = IN_TOLERANCE"]

  - method: GET
    path: "/vessels/{id}"
    description: "Get a vessel (computed fields resolved at read)"
    roles: [ServiceManager, PlantOperator, Technician, SafetyOfficer]
    code: 200
    input: []
    output: Vessel
    side_effects: []

  - method: GET
    path: "/vessels"
    description: "List vessels, optionally filtered by site"
    roles: [ServiceManager, PlantOperator, Technician, SafetyOfficer]
    code: 200
    input: ["site_id?"]
    output: Vessel[]
    side_effects: []

  - method: PATCH
    path: "/vessels/{id}"
    description: "Update vessel monitoring configuration. OCC-guarded: expected_vessel_version must match the vessel's current version. Does NOT retro-trigger replenishment evaluation; reorder evaluation happens only on new readings."
    roles: [ServiceManager]
    code: 200
    input: [expected_vessel_version, "reorder_point_pct?", "target_fill_pct?", "moisture_limit_pct?"]
    output: Vessel
    side_effects: ["increments vessel.version by 1"]

  - method: POST
    path: "/level-readings"
    description: "Record an inventory level reading for a vessel. PlantOperator may only post for vessels of its own site."
    roles: [PlantOperator, Technician]
    code: 201
    input: [vessel_id, measured_at, level_pct, "source?"]
    output: LevelReading
    side_effects:
      - "recompute vessel.current_inventory_tons (new anchor)"
      - "reorder evaluation: if level_pct <= reorder_point_pct and no open order exists, auto-create ReplenishmentOrder (TRIGGERED) per reorder_quantity"
      - "recompute vessel.flow_posture and site.site_posture"
      - "increments vessel.version by 1"

  - method: GET
    path: "/vessels/{id}/level-readings"
    description: "List level readings of a vessel (newest measured_at first)"
    roles: [ServiceManager, PlantOperator, Technician, SafetyOfficer]
    code: 200
    input: []
    output: LevelReading[]
    side_effects: []

  - method: POST
    path: "/quality-reports"
    description: "Submit a moisture/caking lab report for a vessel"
    roles: [Technician]
    code: 201
    input: [vessel_id, sampled_at, moisture_pct, caking_index]
    output: MaterialQualityReport
    side_effects:
      - "flowability_grade computed"
      - "recompute vessel.flow_posture; on becoming FLOW_IMPAIRED, auto-void the vessel's DRAFT/ISSUED EntryPermits (void_reason = AUTO_QUALITY_HAZARD) and recompute site.site_posture"
      - "increments vessel.version by 1"

  - method: GET
    path: "/vessels/{id}/quality-reports"
    description: "List quality reports of a vessel"
    roles: [ServiceManager, PlantOperator, Technician, SafetyOfficer]
    code: 200
    input: []
    output: MaterialQualityReport[]
    side_effects: []

  - method: POST
    path: "/scale-calibrations"
    description: "Record a load-out scale calibration test for a vessel"
    roles: [Technician]
    code: 201
    input: [vessel_id, tested_at, test_weight_tons, indicated_tons, "tolerance_pct?"]
    output: ScaleCalibration
    side_effects:
      - "error_pct and result computed per calibration_error_pct (basis snapshot)"
      - "vessel.scale_status = IN_TOLERANCE on PASS, OUT_OF_TOLERANCE on FAIL"
      - "increments vessel.version by 1"

  - method: GET
    path: "/vessels/{id}/scale-calibrations"
    description: "List calibration records of a vessel"
    roles: [ServiceManager, PlantOperator, Technician, SafetyOfficer]
    code: 200
    input: []
    output: ScaleCalibration[]
    side_effects: []

  - method: GET
    path: "/replenishment-orders/{id}"
    description: "Get a replenishment order"
    roles: [ServiceManager, PlantOperator, Technician, SafetyOfficer]
    code: 200
    input: []
    output: ReplenishmentOrder
    side_effects: []

  - method: GET
    path: "/replenishment-orders"
    description: "List replenishment orders with optional filters"
    roles: [ServiceManager, PlantOperator, Technician, SafetyOfficer]
    code: 200
    input: ["vessel_id?", "trigger_reading_id?", "status?"]
    output: ReplenishmentOrder[]
    side_effects: []

  - method: POST
    path: "/replenishment-orders/{id}/dispatch"
    description: "Dispatch a TRIGGERED order (TRIGGERED -> DISPATCHED)"
    roles: [ServiceManager]
    code: 200
    input: []
    output: ReplenishmentOrder
    side_effects: []

  - method: POST
    path: "/replenishment-orders/{id}/receive"
    description: "Record delivery of a DISPATCHED order. PlantOperator may only receive for its own site. Blocked while the vessel's scale is OUT_OF_TOLERANCE."
    roles: [PlantOperator, Technician]
    code: 200
    input: [delivered_tons, received_at]
    output: ReplenishmentOrder
    side_effects: ["status -> RECEIVED; inventory/posture cascades per state machine"]

  - method: POST
    path: "/replenishment-orders/{id}/cancel"
    description: "Cancel a TRIGGERED order. PlantOperator may only cancel for its own site."
    roles: [PlantOperator, ServiceManager]
    code: 200
    input: []
    output: ReplenishmentOrder
    side_effects: ["status -> CANCELLED; posture recompute"]

  - method: POST
    path: "/replenishment-orders/{id}/void"
    description: "Void a RECEIVED order (compensating inventory reversal)"
    roles: [ServiceManager]
    code: 200
    input: []
    output: ReplenishmentOrder
    side_effects: ["status -> VOIDED; inventory/posture cascades per state machine"]

  - method: POST
    path: "/service-tickets"
    description: "Open a service ticket (diagnosis, cleanout, inspection, aeration/vibrator retrofit). PlantOperator may only open tickets for its own site. estimate_cents computed at creation."
    roles: [PlantOperator, ServiceManager]
    code: 201
    input: [site_id, vessel_id, job_type, requires_entry, est_hours, crew_size, "description?"]
    output: ServiceTicket
    side_effects: ["estimate_cents computed per service_estimate_cents", "status = DRAFT"]

  - method: GET
    path: "/service-tickets/{id}"
    description: "Get a service ticket"
    roles: [ServiceManager, PlantOperator, Technician, SafetyOfficer]
    code: 200
    input: []
    output: ServiceTicket
    side_effects: []

  - method: GET
    path: "/service-tickets"
    description: "List service tickets with optional filters"
    roles: [ServiceManager, PlantOperator, Technician, SafetyOfficer]
    code: 200
    input: ["site_id?", "vessel_id?", "technician_id?", "source_permit_id?", "status?"]
    output: ServiceTicket[]
    side_effects: []

  - method: POST
    path: "/service-tickets/{id}/quote"
    description: "Finalize the quote and resolve commercial_track (contract service vs capital project)"
    roles: [ServiceManager]
    code: 200
    input: []
    output: ServiceTicket
    side_effects: ["status -> QUOTED; commercial_track = CAPITAL_PROJECT when estimate_cents >= site.capital_threshold_cents else CONTRACT_SERVICE"]

  - method: POST
    path: "/service-tickets/{id}/approve"
    description: "Approve a QUOTED ticket. CONTRACT_SERVICE track: the owning PlantOperator approves. CAPITAL_PROJECT track: a ServiceManager approves (internal capital review)."
    roles: [PlantOperator, ServiceManager]
    code: 200
    input: []
    output: ServiceTicket
    side_effects: ["status -> APPROVED"]

  - method: POST
    path: "/service-tickets/{id}/decline"
    description: "Customer declines a QUOTED ticket"
    roles: [PlantOperator]
    code: 200
    input: []
    output: ServiceTicket
    side_effects: ["status -> DECLINED"]

  - method: POST
    path: "/service-tickets/{id}/schedule"
    description: "Assign a technician and time window to an APPROVED ticket. Enforces future window, technician half-open overlap, vessel 2-hour downtime buffer, and credit hold."
    roles: [ServiceManager]
    code: 200
    input: [technician_id, window_start, window_end]
    output: ServiceTicket
    side_effects: ["status -> SCHEDULED; technician_id and window stored; technician.remaining_capacity_hours recomputed"]

  - method: POST
    path: "/service-tickets/{id}/start"
    description: "Assigned technician begins work. Entry-requiring tickets need an ACTIVE EntryPermit."
    roles: [Technician]
    code: 200
    input: []
    output: ServiceTicket
    side_effects: ["status -> IN_PROGRESS"]

  - method: POST
    path: "/service-tickets/{id}/complete"
    description: "Assigned technician completes work; invoice computed with pinned per-line rounding"
    roles: [Technician]
    code: 200
    input: [actual_hours, mileage_miles, disposal_tons]
    output: ServiceTicket
    side_effects: ["status -> COMPLETED; invoice_* fields computed; technician.remaining_capacity_hours recomputed"]

  - method: POST
    path: "/entry-permits"
    description: "Draft a bin-entry permit. The window joins the vessel downtime calendar (2-hour buffer against other tickets/permits, exempting intervals of the same ticket_id)."
    roles: [SafetyOfficer]
    code: 201
    input: [vessel_id, ticket_id, entrant_technician_id, window_start, window_end]
    output: EntryPermit
    side_effects: ["status = DRAFT; vessel downtime buffer enforced"]

  - method: GET
    path: "/entry-permits/{id}"
    description: "Get an entry permit"
    roles: [ServiceManager, PlantOperator, Technician, SafetyOfficer]
    code: 200
    input: []
    output: EntryPermit
    side_effects: []

  - method: GET
    path: "/entry-permits"
    description: "List entry permits with optional filters"
    roles: [ServiceManager, PlantOperator, Technician, SafetyOfficer]
    code: 200
    input: ["vessel_id?", "ticket_id?", "entrant_technician_id?", "status?"]
    output: EntryPermit[]
    side_effects: []

  - method: POST
    path: "/entry-permits/{id}/issue"
    description: "Issue a DRAFT permit after lockout confirmation. Segregation of duties: issuer must differ from entrant. Engulfment control: no DISPATCHED inbound order for the vessel."
    roles: [SafetyOfficer]
    code: 200
    input: [lockout_checklist_confirmed]
    output: EntryPermit
    side_effects: ["status -> ISSUED; issuer_user_id recorded"]

  - method: POST
    path: "/entry-permits/{id}/activate"
    description: "Activate an ISSUED permit after a passing pre-entry atmosphere test"
    roles: [SafetyOfficer]
    code: 200
    input: [oxygen_pct, combustible_pct]
    output: EntryPermit
    side_effects: ["status -> ACTIVE; atmosphere readings recorded; atmosphere_ok = true"]

  - method: POST
    path: "/entry-permits/{id}/atmosphere-check"
    description: "Record a continuous-monitoring atmosphere reading on an ACTIVE permit. Passing values keep ACTIVE; failing values suspend the permit and cascade the bound ticket to ON_HOLD."
    roles: [SafetyOfficer, Technician]
    code: 200
    input: [oxygen_pct, combustible_pct]
    output: EntryPermit
    side_effects: ["readings recorded; on failure: status -> SUSPENDED, atmosphere_ok = false, bound IN_PROGRESS ticket -> ON_HOLD"]

  - method: POST
    path: "/entry-permits/{id}/resume"
    description: "Resume a SUSPENDED permit after a passing atmosphere re-test; cascades the bound ON_HOLD ticket back to IN_PROGRESS"
    roles: [SafetyOfficer]
    code: 200
    input: [oxygen_pct, combustible_pct]
    output: EntryPermit
    side_effects: ["status -> ACTIVE; atmosphere_ok = true; bound ON_HOLD ticket -> IN_PROGRESS"]

  - method: POST
    path: "/entry-permits/{id}/close"
    description: "Close an ACTIVE permit at end of entry. Non-NONE findings auto-create a DRAFT DIAGNOSIS ServiceTicket linked via source_permit_id."
    roles: [SafetyOfficer]
    code: 200
    input: [findings]
    output: EntryPermit
    side_effects: ["status -> CLOSED; findings in {BRIDGING_OBSERVED, RATHOLING_OBSERVED} auto-create a DRAFT DIAGNOSIS ticket (est_hours = 4, crew_size = 1, requires_entry = false)"]

  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical clock (test-driving endpoint). Startup default before any call is exactly 2026-08-01T00:00:00Z; the logical clock never falls back to wall-clock time."
    roles: [ServiceManager]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: ["logical clock advanced; used by window validation and usage windows"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/invalid X-User-Role or X-User-ID header" }
  - { id: ERR_VALIDATION, http: 400, condition: "Malformed body: missing required field, bad type, enum out of range, numeric range violated (e.g. level_pct outside 0-100), window_end <= window_start, unknown field" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted for the endpoint, entity-backed ownership violated, or approve role mismatched to commercial_track" }
  - { id: ERR_SITE_NOT_FOUND, http: 404, condition: "Referenced site does not exist" }
  - { id: ERR_VESSEL_NOT_FOUND, http: 404, condition: "Referenced vessel does not exist" }
  - { id: ERR_TECHNICIAN_NOT_FOUND, http: 404, condition: "Referenced technician does not exist" }
  - { id: ERR_TICKET_NOT_FOUND, http: 404, condition: "Referenced service ticket does not exist" }
  - { id: ERR_PERMIT_NOT_FOUND, http: 404, condition: "Referenced entry permit does not exist" }
  - { id: ERR_ORDER_NOT_FOUND, http: 404, condition: "Referenced replenishment order does not exist" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_vessel_version does not match the vessel's current version (OCC)" }
  - { id: ERR_INVALID_TICKET_STATE, http: 409, condition: "Ticket not in a valid from-state for the requested transition" }
  - { id: ERR_INVALID_ORDER_STATE, http: 409, condition: "Order not in a valid from-state for the requested transition" }
  - { id: ERR_INVALID_PERMIT_STATE, http: 409, condition: "Permit not in a valid from-state for the requested transition" }
  - { id: ERR_LOCKOUT_NOT_VERIFIED, http: 409, condition: "Permit issue attempted with lockout_checklist_confirmed != true" }
  - { id: ERR_SOD_ISSUER_EQUALS_ENTRANT, http: 409, condition: "Issuing SafetyOfficer's X-User-ID equals the entrant technician's id (segregation of duties)" }
  - { id: ERR_INBOUND_DELIVERY_PENDING, http: 409, condition: "Permit issue while a DISPATCHED replenishment order exists for the vessel (engulfment control)" }
  - { id: ERR_ATMOSPHERE_UNSAFE, http: 409, condition: "Oxygen outside [19.5, 23.5] pct or combustible gas above 10.0 pct of LEL on activate/resume" }
  - { id: ERR_ENTRY_PERMIT_REQUIRED, http: 409, condition: "Starting a requires_entry ticket without an ACTIVE EntryPermit bound to the ticket" }
  - { id: ERR_WINDOW_IN_PAST, http: 409, condition: "Scheduled window_start is not strictly after the current logical clock" }
  - { id: ERR_TECHNICIAN_DOUBLE_BOOKED, http: 409, condition: "Technician already occupies a half-open-overlapping ticket window; adjacency is allowed" }
  - { id: ERR_VESSEL_DOWNTIME_CONFLICT, http: 409, condition: "Vessel downtime intervals (other tickets' windows and permit windows, excluding same-ticket intervals) separated by less than 2 hours" }
  - { id: ERR_SCALE_OUT_OF_TOLERANCE, http: 409, condition: "Receiving against a vessel whose load-out scale is OUT_OF_TOLERANCE" }
  - { id: ERR_INVENTORY_WOULD_GO_NEGATIVE, http: 409, condition: "Voiding a receipt would drive current_inventory_tons below zero" }
  - { id: ERR_CREDIT_HOLD, http: 409, condition: "Scheduling blocked because the site is on credit hold" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: ServiceManager
    description: "Contractor operations manager: onboards sites/vessels/technicians, quotes, dispatches, schedules, voids receipts, approves capital projects"
    identity: opaque
    exclusive_operations:
      - "POST /sites"
      - "POST /technicians"
      - "POST /vessels"
      - "PATCH /vessels/{id}"
      - "POST /replenishment-orders/{id}/dispatch"
      - "POST /replenishment-orders/{id}/void"
      - "POST /service-tickets/{id}/quote"
      - "POST /service-tickets/{id}/schedule"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "POST /service-tickets (with PlantOperator)"
      - "POST /service-tickets/{id}/approve (CAPITAL_PROJECT track only)"
      - "POST /replenishment-orders/{id}/cancel (with PlantOperator)"
      - "All GET / list endpoints"
  - name: PlantOperator
    description: "Customer plant personnel acting for their own site: report levels, request service, approve contract-service quotes, receive deliveries"
    identity: "entity_backed:CustomerSite"
    exclusive_operations:
      - "POST /service-tickets/{id}/decline"
    shared_operations:
      - "POST /level-readings (own site only; with Technician)"
      - "POST /service-tickets (own site only; with ServiceManager)"
      - "POST /service-tickets/{id}/approve (CONTRACT_SERVICE track, own site only)"
      - "POST /replenishment-orders/{id}/receive (own site only; with Technician)"
      - "POST /replenishment-orders/{id}/cancel (own site only; with ServiceManager)"
      - "All GET / list endpoints"
  - name: Technician
    description: "Contractor field technician: records readings, quality reports and calibrations; starts and completes own assigned tickets"
    identity: "entity_backed:Technician"
    exclusive_operations:
      - "POST /quality-reports"
      - "POST /scale-calibrations"
      - "POST /service-tickets/{id}/start (self-assigned tickets only)"
      - "POST /service-tickets/{id}/complete (self-assigned tickets only)"
    shared_operations:
      - "POST /level-readings (with PlantOperator)"
      - "POST /replenishment-orders/{id}/receive (with PlantOperator)"
      - "POST /entry-permits/{id}/atmosphere-check (with SafetyOfficer)"
      - "All GET / list endpoints"
  - name: SafetyOfficer
    description: "Permit issuer controlling bin entry; must never be the entrant (segregation of duties enforced at issue)"
    identity: opaque
    exclusive_operations:
      - "POST /entry-permits"
      - "POST /entry-permits/{id}/issue"
      - "POST /entry-permits/{id}/activate"
      - "POST /entry-permits/{id}/resume"
      - "POST /entry-permits/{id}/close"
    shared_operations:
      - "POST /entry-permits/{id}/atmosphere-check (with Technician)"
      - "All GET / list endpoints"
