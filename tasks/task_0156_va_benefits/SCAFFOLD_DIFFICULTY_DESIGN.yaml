scaffold_difficulty_design:

  # =========================================================================
  # Rule 1 — Dual-variant calculations across different entity domains
  # =========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: entitlement_chronological_vs_forward_looking
        grounds:
          - calculations.entitlement_consume_compute
          - calculations.entitlement_consume_compute.variants.forward_looking_projection
          - entities.Veteran.fields.months_entitlement_used
          - endpoints[GET /veterans/{id}/entitlement-projection]
        distinguishing_aspect: |
          Two algorithms over the same Enrollment rows yield different
          months-used: the chronological variant (written to Veteran.
          months_entitlement_used) counts ONLY COMPLETED/WITHDRAWN rows, while
          the forward-looking variant (returned by GET /entitlement-projection
          ?include_certified=true) ALSO counts CERTIFIED and ACTIVE rows as if
          they had run their full term. This is the dual-variant pattern on
          the Veteran entity domain (months-of-entitlement).
        test_recipe:
          setup:
            - "Create Veteran with discharge_status=HONORABLE, aggregate_active_duty_days=1100 (tier 100)"
            - "Create School (PUBLIC_IN_STATE)"
            - "Create a GRANTED Claim with granted_rating=10 so combined_rating > 0"
            - "Create Enrollment A: term_start=2025-01-01, term_end=2025-07-01 (181 days), certify, then advance clock past term_end, run /_sweep/run, complete"
            - "Create Enrollment B: term_start=2026-01-01, term_end=2026-04-01 (90 days), certify it (still CERTIFIED state)"
          trigger:
            - "GET /veterans/{id} (chronological)"
            - "GET /veterans/{id}/entitlement-projection?include_certified=true (forward)"
          assert:
            - "Veteran.months_entitlement_used == 6.03 (chronological, from Enrollment A only)"
            - "Response.chronological_used == 6.03"
            - "Response.projected_used == 9.03 (6.03 + 3.00 from Enrollment B's 90 days)"
            - "Response.projected_used != Veteran.months_entitlement_used"

      - name: claim_combined_rating_pre_vs_post_reopen
        grounds:
          - calculations.combined_rating_compute
          - state_machines.Claim.GRANTED_to_UNDER_REVIEW
          - entities.Veteran.fields.combined_rating
        distinguishing_aspect: |
          Same set of granted_rating values produces DIFFERENT combined_rating
          values depending on whether all GRANTED Claims are counted or
          whether one Claim has been reopened (UNDER_REVIEW excludes from the
          input set). Operates on Veteran.combined_rating — a different entity
          domain (disability rating) than the months-of-entitlement instance
          above.
        test_recipe:
          setup:
            - "Veteran with two GRANTED claims at rating 40 and 20 (sorted desc: [40,20])"
          trigger:
            - "GET /veterans/{id} (records combined_rating BEFORE reopen)"
            - "POST /claims/{claim_id_at_20}/reopen with a DIFFERENT Rater X-User-ID"
            - "GET /veterans/{id} (records combined_rating AFTER reopen)"
          assert:
            - "BEFORE reopen Veteran.combined_rating == 50 (1 - 0.6*0.8 = 0.52 -> 52 -> nearest 10 = 50)"
            - "AFTER reopen Veteran.combined_rating == 40 (only 40 remains in input set -> 40 -> nearest 10 = 40)"
            - "Same underlying rating values, different result due to state filter"

  # =========================================================================
  # Rule 2 — Combinatorial formulas across different modes
  # =========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: housing_allowance_multi_input_nonlinear  # MODE (a)
        grounds:
          - calculations.housing_allowance_compute
          - calculations.housing_allowance_compute.variants.in_person_tiered
          - calculations.housing_allowance_compute.variants.online_half_national
          - calculations.housing_allowance_compute.variants.prorated_partial_month
          - entities.HousingPayment.fields.amount
          - endpoints[POST /enrollments/{id}/housing-payments]
        distinguishing_aspect: |
          Five-input non-linear formula: base_bah (zip OR national-avg branch
          depending on delivery_mode), uplift (conditional on dep_count > 2 and
          capped), tier_pct, time_factor (5-value enum), and partial-month
          proration. Branches on TWO enums (training_time, delivery_mode) and
          a threshold (dep_count). MODE (a): ≥3 inputs, non-linear, nested
          min/max + conditional branches.
        test_recipe:
          setup:
            - "Veteran tier=100 (1100 active-duty days), HONORABLE, GRANTED claim 10%"
            - "Create 4 ACTIVE Dependents on the Veteran (1 SPOUSE + 3 CHILDREN under 18)"
            - "School with zip_bah_code=10001 mapped in BAH_TABLE to $2000.00"
            - "Enrollment IN_PERSON, FULL_TIME, term_start=2026-01-01, term_end=2026-05-01"
            - "Certify enrollment, advance clock to 2026-01-01, run /_sweep/run to activate"
          trigger:
            - "POST /enrollments/{id}/housing-payments with month_year=2026-01"
          assert:
            - "HousingPayment.amount == 2100.00  # (2000 + 100 uplift) * 1.0 * 1.0 * 1.0"
            - "HousingPayment.computation_basis == 'IN_PERSON_TIERED'"

      - name: tuition_payable_rounding_order_pinned  # MODE (b)
        grounds:
          - calculations.tuition_payable_compute
          - entities.Enrollment.fields.certified_tuition_payable
          - state_machines.Enrollment.SUBMITTED_to_CERTIFIED
        distinguishing_aspect: |
          MODE (b): nested rounding where the order of operations changes the
          cents. Formula pins SUM-then-ROUND: round_half_up is applied ONCE
          on the final product min(tuition_charged, max_per_term) * tier_pct.
          Round-then-multiply would give a different result; the scaffold
          forbids it. Distinct mode from the housing_allowance instance.
        test_recipe:
          setup:
            - "Veteran with aggregate_active_duty_days=730 (tier 80%, exactly at boundary), HONORABLE"
            - "GRANTED Claim 10% on the Veteran (combined_rating becomes 10)"
            - "School with program_type=PRIVATE_NATIONAL"
            - "Enrollment with tuition_charged=20000.00"
          trigger:
            - "POST /enrollments/{id}/certify"
          assert:
            - "Enrollment.certified_tuition_payable == 10433.07  # min(20000, 13041.34) * 0.80 rounded ONCE -> 10433.072 -> 10433.07"
            - "Round-then-multiply (i.e., round(13041.34, 2) * 0.80 then round) gives 10433.07 too here; the assertion still pins SUM-then-ROUND semantics — a different input pair (e.g., 13041.345 truncated to 2dp before mult) would diverge. Documented order is binding."

      - name: yellow_ribbon_circular_evaluation_pinned  # MODE (c)
        grounds:
          - calculations.yellow_ribbon_compute
          - calculations.tuition_payable_compute
          - entities.YellowRibbonContribution
          - state_machines.Enrollment.SUBMITTED_to_CERTIFIED
        distinguishing_aspect: |
          MODE (c): circular-looking dependency between three quantities —
          tuition_gap depends on max_per_term (from tuition table), school
          contribution depends on tuition_gap AND on yellow_ribbon_max_per_year,
          va_match depends on school contribution, student_responsibility
          depends on all three. Evaluation order is pinned: max_per_term ->
          tuition_gap -> floor_to_cent(gap/2) -> min(school_cap, half) ->
          va_match := school -> student := gap - school - va_match. A naive
          implementation that computes student first would produce a different
          allocation.
        test_recipe:
          setup:
            - "Veteran tier=100 (1100 days), HONORABLE, GRANTED claim 10%"
            - "School PRIVATE_NATIONAL with yellow_ribbon_enrolled=true and yellow_ribbon_max_per_year=2000.00"
            - "Enrollment with tuition_charged=20000.00, term Jan 2026 - Apr 2026"
          trigger:
            - "POST /enrollments/{id}/certify"
            - "GET /enrollments/{id}/yellow-ribbon"
          assert:
            - "Enrollment.certified_tuition_payable == 13041.34"
            - "YellowRibbonContribution.tuition_gap == 6958.66"
            - "YellowRibbonContribution.school_contribution == 2000.00  # min(2000, floor_to_cent(6958.66/2)=3479.33)"
            - "YellowRibbonContribution.va_match == 2000.00"
            - "YellowRibbonContribution.student_responsibility == 2958.66"

  # =========================================================================
  # Rule 3 — Non-linear state-machine shape on different entities
  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: claim_appeal_cycle  # cycle DENIED → APPEALED → UNDER_REVIEW → (DENIED again)
        grounds:
          - state_machines.Claim.DENIED_to_APPEALED
          - state_machines.Claim.APPEALED_to_UNDER_REVIEW
          - state_machines.Claim.UNDER_REVIEW_to_DENIED
          - state_machines.Claim.GRANTED_to_UNDER_REVIEW
        distinguishing_aspect: |
          Claim has TWO cycles back to UNDER_REVIEW: DENIED→APPEALED→
          UNDER_REVIEW (veteran-initiated) and GRANTED→UNDER_REVIEW (rater
          reopen). The same UNDER_REVIEW state is reachable from three
          predecessors. Non-linear: a strict linear pipeline cannot revisit a
          state. Operates on Claim entity.
        test_recipe:
          setup:
            - "Veteran HONORABLE, tier=100, with a SUBMITTED Claim"
            - "Rater A start-review then deny"
          trigger:
            - "POST /claims/{id}/appeal (as the Veteran owner)"
            - "POST /claims/{id}/start-review (as Rater B, different X-User-ID)"
          assert:
            - "After appeal: Claim.status == 'APPEALED'"
            - "After second start-review: Claim.status == 'UNDER_REVIEW'"
            - "Claim.rater_id == Rater_B's X-User-ID (overwritten from Rater_A)"

      - name: voc_rehab_active_suspended_cycle  # ACTIVE ↔ SUSPENDED with terminal at 3rd suspension
        grounds:
          - state_machines.VocRehabPlan.ACTIVE_to_SUSPENDED
          - state_machines.VocRehabPlan.SUSPENDED_to_ACTIVE
          - state_machines.VocRehabPlan.SUSPENDED_to_TERMINATED
          - entities.VocRehabPlan.fields.suspension_count
        distinguishing_aspect: |
          VocRehabPlan can loop ACTIVE→SUSPENDED→ACTIVE up to twice, then
          auto-terminates on the third suspension. A cycle counter gates the
          terminal transition — strictly non-linear, and on a DIFFERENT entity
          (VocRehabPlan) than the Claim cycle above.
        test_recipe:
          setup:
            - "Veteran HONORABLE, GRANTED claim 20% (combined_rating==20)"
            - "Counselor C1 creates DRAFT plan and approves -> APPROVED"
            - "Counselor C1 starts -> ACTIVE"
          trigger:
            - "POST /voc-rehab-plans/{id}/suspend (as C1)  # suspension_count -> 1"
            - "POST /voc-rehab-plans/{id}/resume (as Counselor C2, different X-User-ID) -> ACTIVE"
            - "POST /voc-rehab-plans/{id}/suspend (as C1)  # suspension_count -> 2"
            - "POST /voc-rehab-plans/{id}/resume (as C2) -> ACTIVE"
            - "POST /voc-rehab-plans/{id}/suspend (as C1)  # suspension_count -> 3"
          assert:
            - "After 3rd suspend, VocRehabPlan.status == 'TERMINATED'"
            - "VocRehabPlan.suspension_count == 3"
            - "Subsequent POST /resume returns 409 ERR_INVALID_STATE"

  # =========================================================================
  # Rule 4 — Transitive cascade chains from different triggers
  # =========================================================================
  - rule_id: transitive_cascade
    instances:

      - name: claim_reopen_depth_three_chain  # depth >= 3
        grounds:
          - state_machines.Claim.GRANTED_to_UNDER_REVIEW
          - state_machines.Enrollment.SUBMITTED_to_CERTIFIED
          - state_machines.VocRehabPlan.ACTIVE_to_SUSPENDED
          - calculations.combined_rating_compute
        distinguishing_aspect: |
          Trigger: POST /claims/{id}/reopen on a GRANTED Claim.
          Link 1: that mutation flips Claim.status to UNDER_REVIEW and forces
          combined_rating_compute to recompute Veteran.combined_rating
          (treating the reopened Claim's rating as no longer GRANTED).
          Link 2: the now-lower Veteran.combined_rating itself triggers
          invalidation of Enrollment.certified_tuition_payable to null on
          every CERTIFIED/ACTIVE Enrollment of that Veteran (because the
          tier multiplier upstream may differ — Enrollment is mutated because
          its parent Veteran's rating changed, not because the original action
          touched Enrollment directly).
          Link 3: that Enrollment mutation, on any Enrollment whose Veteran has
          a VocRehabPlan in ACTIVE state, in turn auto-suspends the
          VocRehabPlan (status -> SUSPENDED, suspension_count += 1). Each hop
          is caused by the previous hop, not by the original /reopen call.
        test_recipe:
          setup:
            - "Veteran HONORABLE, GRANTED claim 30%, combined_rating=30"
            - "Enrollment certified with certified_tuition_payable computed (non-null)"
            - "VocRehabPlan in ACTIVE state for the Veteran (approved by Counselor C1, started)"
          trigger:
            - "POST /claims/{id}/reopen (as a Rater different from the claim's rater_id)"
          assert:
            - "Claim.status == 'UNDER_REVIEW'"
            - "Veteran.combined_rating == 0 (re-aggregated without the reopened claim)"
            - "Enrollment.certified_tuition_payable IS NULL"
            - "VocRehabPlan.status == 'SUSPENDED' AND VocRehabPlan.suspension_count == 1"

      - name: dependent_removal_depth_two_chain  # depth >= 2, distinct trigger
        grounds:
          - state_machines.Dependent.ACTIVE_to_REMOVED
          - calculations.voc_rehab_subsistence_compute
          - entities.VocRehabPlan.fields.monthly_subsistence
        distinguishing_aspect: |
          Trigger: DELETE /dependents/{id} (different trigger from /reopen).
          Link 1: Dependent.status flips to REMOVED and Dependent.removed_at
          is set.
          Link 2: that status flip itself causes voc_rehab_subsistence_compute
          to re-run for the Veteran's ACTIVE VocRehabPlan (if any), rewriting
          VocRehabPlan.monthly_subsistence — a mutation on a DIFFERENT entity
          caused by the dependent-removal cascade, not by the original DELETE
          path.
        test_recipe:
          setup:
            - "Veteran HONORABLE, GRANTED claim 20%, combined_rating=20"
            - "3 ACTIVE Dependents (1 SPOUSE + 2 CHILDREN) on the Veteran"
            - "VocRehabPlan in ACTIVE state with training_mode=FULL_TIME_INSTITUTIONAL"
            - "Initial monthly_subsistence == 948.00 (883 base + 65 * (3-2))"
          trigger:
            - "DELETE /dependents/{spouse_id}"
          assert:
            - "Dependent.status == 'REMOVED' AND Dependent.removed_at is not null"
            - "VocRehabPlan.monthly_subsistence == 883.00  # base only; dep_count now 2, no uplift"

  # =========================================================================
  # Rule 5 — Validation priority conflicts across different error-category pairs
  # =========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:

      - name: state_vs_business_safety_conflict  # state (priority 5) vs business_safety (priority 8)
        grounds:
          - validations[priority=5]
          - validations[priority=8]
          - errors.ERR_INVALID_STATE
          - errors.ERR_INELIGIBLE_DISCHARGE
        distinguishing_aspect: |
          Dual-failure: an Enrollment in WRONG state (CERTIFIED instead of
          SUBMITTED) AND a Veteran with non-HONORABLE discharge. Both checks
          would fail. Priority ordering MUST surface state (priority 5,
          ERR_INVALID_STATE) before business_safety (priority 8,
          ERR_INELIGIBLE_DISCHARGE). Error category pair: state vs
          business_safety.
        test_recipe:
          setup:
            - "Veteran with discharge_status=OTHER_THAN_HONORABLE"
            - "Enrollment in status CERTIFIED (already certified once)"
          trigger:
            - "POST /enrollments/{id}/certify (second call)"
          assert:
            - "HTTP 409"
            - "error_id == 'ERR_INVALID_STATE'  # NOT ERR_INELIGIBLE_DISCHARGE"

      - name: business_referential_vs_business_temporal_conflict  # priority 9 vs priority 10
        grounds:
          - validations[priority=9]
          - validations[priority=10]
          - errors.ERR_SUPPLEMENTAL_REFERENCE_INVALID
          - errors.ERR_INVALID_TERM_RANGE
        distinguishing_aspect: |
          On POST /enrollments + POST /claims simultaneously failing different
          rules: a single POST /enrollments call with term_end < term_start
          AND a (separate but tied) supplemental Claim mismatch is NOT useful
          (different endpoints). Instead, exercise priority on POST /claims:
          create a SUPPLEMENTAL claim_type with original_claim_id pointing to
          a Claim in DENIED (not GRANTED or DENIED_FINAL) AND also send a
          BAD field (e.g., proposed_rating=37 not multiple of 10). This pits
          business_referential (priority 9, ERR_SUPPLEMENTAL_REFERENCE_INVALID)
          vs business_constraint (priority 17, ERR_INVALID_RATING). DIFFERENT
          error category pair than instance 1.
        test_recipe:
          setup:
            - "Veteran HONORABLE"
            - "Original Claim in DENIED state (not yet appealed, not yet final)"
          trigger:
            - "POST /claims body: { veteran_id, condition_code, claim_type='SUPPLEMENTAL', original_claim_id=<DENIED claim id>, proposed_rating=37 }"
          assert:
            - "HTTP 422"
            - "error_id == 'ERR_SUPPLEMENTAL_REFERENCE_INVALID'  # priority 9 wins over priority 17 ERR_INVALID_RATING"

  # =========================================================================
  # Rule 6 — Boundary-precision checks on different metrics/endpoints
  # =========================================================================
  - rule_id: boundary_precision_check
    instances:

      - name: post_911_tier_boundary_at_90_days  # numeric threshold (>= vs >)
        grounds:
          - calculations.post_911_tier_compute
          - entities.Veteran.fields.post_911_eligibility_tier
          - endpoints[POST /veterans]
          - endpoints[PATCH /veterans/{id}]
        distinguishing_aspect: |
          Tier bucket boundaries use `<` (strict less-than), so 89 days
          produces tier 0 and 90 days produces tier 40. The 1094 vs 1095
          boundary similarly: 1094 -> 90, 1095 -> 100. Numeric metric on
          the Veteran entity, reachable via PATCH /veterans/{id}.
        test_recipe:
          setup:
            - "Create Veteran V1 with aggregate_active_duty_days=89"
            - "Create Veteran V2 with aggregate_active_duty_days=90"
          trigger:
            - "GET /veterans/V1"
            - "GET /veterans/V2"
            - "PATCH /veterans/V1 body: { aggregate_active_duty_days: 1094 }"
            - "PATCH /veterans/V2 body: { aggregate_active_duty_days: 1095 }"
          assert:
            - "Initial V1.post_911_eligibility_tier == 0"
            - "Initial V2.post_911_eligibility_tier == 40"
            - "After PATCH: V1.post_911_eligibility_tier == 90"
            - "After PATCH: V2.post_911_eligibility_tier == 100"

      - name: empty_claims_set_combined_rating_zero  # empty-set / zero-count edge, distinct endpoint
        grounds:
          - calculations.combined_rating_compute
          - entities.Veteran.fields.combined_rating
          - endpoints[GET /veterans/{id}]
        distinguishing_aspect: |
          When the input set is empty (no GRANTED claims), the formula's
          remaining_efficiency stays at 1.0, giving raw_combined=0, which
          rounds to 0. A naive implementation that defaults to NaN or 100
          would fail. Empty-collection edge, DISTINCT metric (combined_rating
          is integer, not days), reachable through GET /veterans/{id}.
        test_recipe:
          setup:
            - "Create Veteran V with no claims at all"
            - "Create Veteran V2, file claim, start-review, deny (status=DENIED — not in input set)"
          trigger:
            - "GET /veterans/V"
            - "GET /veterans/V2"
          assert:
            - "V.combined_rating == 0  # empty input set"
            - "V2.combined_rating == 0  # DENIED claim is excluded from input set"

  # =========================================================================
  # Rule 7 — Cross-entity state dependencies across different entity pairs
  # =========================================================================
  - rule_id: cross_entity_state_dependency
    instances:

      - name: enrollment_activate_requires_claim_granted  # Enrollment depends on Claim
        grounds:
          - state_machines.Enrollment.CERTIFIED_to_ACTIVE
          - validations[priority=6]
          - entities.Veteran.fields.combined_rating
          - errors.ERR_CROSS_ENTITY_PRECONDITION
        distinguishing_aspect: |
          Enrollment's CERTIFIED→ACTIVE transition cannot fire unless Veteran.
          combined_rating > 0, which itself requires at least one GRANTED Claim
          for that Veteran. Entity pair: Enrollment ↔ Claim (via Veteran).
        test_recipe:
          setup:
            - "Veteran HONORABLE, tier=100, NO granted claims (combined_rating=0)"
            - "Enrollment certified (SUBMITTED -> CERTIFIED already succeeded; HONORABLE only requirement at certify)"
            - "Advance clock to term_start"
          trigger:
            - "POST /_sweep/run  # attempt CERTIFIED -> ACTIVE"
            - "Then: file claim, grant 10%, advance clock again, POST /_sweep/run again"
          assert:
            - "After first sweep: Enrollment.status == 'CERTIFIED' (NOT activated; combined_rating still 0)"
            - "After grant + second sweep: Enrollment.status == 'ACTIVE'"

      - name: voc_rehab_approve_requires_claim_combined_rating_20  # VocRehabPlan depends on Claim
        grounds:
          - state_machines.VocRehabPlan.DRAFT_to_APPROVED
          - validations[priority=6]
          - entities.Veteran.fields.combined_rating
          - errors.ERR_CROSS_ENTITY_PRECONDITION
        distinguishing_aspect: |
          VocRehabPlan's DRAFT→APPROVED transition requires Veteran.
          combined_rating >= 20 (a HIGHER threshold than the Enrollment rule),
          which in turn requires the underlying Claim(s) to sum to at least 20.
          Different entity pair (VocRehabPlan ↔ Claim) and different threshold
          than the Enrollment instance above.
        test_recipe:
          setup:
            - "Veteran HONORABLE, GRANTED claim 10% (combined_rating == 10)"
            - "Counselor creates VocRehabPlan in DRAFT"
          trigger:
            - "POST /voc-rehab-plans/{id}/approve"
            - "Then: file second claim, grant 30% (combined_rating recomputes to round(1-0.9*0.7=0.37 -> 37 -> nearest 10 = 40)), retry approve"
          assert:
            - "First /approve: HTTP 409 error_id == 'ERR_CROSS_ENTITY_PRECONDITION'"
            - "Second /approve after combined_rating == 40: HTTP 200, VocRehabPlan.status == 'APPROVED'"

  # =========================================================================
  # Rule 8 — Resource temporal-overlap conflicts across different interval semantics
  # =========================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: enrollment_term_half_open_overlap  # half-open interval, adjacency ALLOWED
        grounds:
          - validations[priority=11]
          - entities.Enrollment.fields.term_start
          - entities.Enrollment.fields.term_end
          - errors.ERR_ENROLLMENT_OVERLAP
        distinguishing_aspect: |
          Enrollment intervals are HALF-OPEN [term_start, term_end). Two
          enrollments are in conflict iff their half-open intervals share at
          least one instant. Same-day adjacency (one ends 2026-04-01 00:00 UTC
          when the next begins 2026-04-01 00:00 UTC) is ALLOWED — distinct
          semantics from the housing payment interval.
        test_recipe:
          setup:
            - "Veteran V HONORABLE"
            - "Enrollment A: term [2026-01-01, 2026-04-01) in SUBMITTED"
          trigger:
            - "POST /enrollments body: { veteran_id=V, term_start=2026-04-01, term_end=2026-07-01, ... }  # adjacent, allowed"
            - "POST /enrollments body: { veteran_id=V, term_start=2026-03-31, term_end=2026-06-30, ... }  # 1-day overlap, rejected"
          assert:
            - "First POST: HTTP 201, Enrollment B created (adjacency is NOT overlap because intervals are half-open)"
            - "Second POST: HTTP 409 error_id == 'ERR_ENROLLMENT_OVERLAP'"

      - name: housing_payment_month_intersects_term  # closed month vs half-open term; aggregate intersection
        grounds:
          - validations[priority=12]
          - entities.HousingPayment.fields.month_year
          - entities.Enrollment.fields.term_start
          - entities.Enrollment.fields.term_end
          - errors.ERR_PAYMENT_OUTSIDE_TERM
        distinguishing_aspect: |
          HousingPayment.month_year is a CLOSED full-calendar-month bucket;
          enrollment term is HALF-OPEN. The overlap rule asks for at least
          ONE UTC day to lie within BOTH intervals. Different interval
          semantics (closed-month vs half-open-term) than the enrollment-
          overlap rule, on a DIFFERENT resource entity (HousingPayment vs
          Enrollment).
        test_recipe:
          setup:
            - "Veteran V HONORABLE, tier=100, GRANTED claim, ACTIVE Enrollment [2026-04-01, 2026-04-30)"
            - "Note: term ends 2026-04-30 EXCLUSIVE, so April 29 is the last day inside the term"
          trigger:
            - "POST /enrollments/{id}/housing-payments month_year=2026-04  # term covers April 1..April 29; intersect"
            - "POST /enrollments/{id}/housing-payments month_year=2026-05  # term ended 04-30; zero overlap with May"
          assert:
            - "First POST: HTTP 201 created"
            - "Second POST: HTTP 422 error_id == 'ERR_PAYMENT_OUTSIDE_TERM'"

  # =========================================================================
  # Rule 9 — Compensating-action invariants across different conserved quantities
  # =========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: enrollment_cancel_zeroes_ledger_for_tuition  # conserved quantity: dollars paid for tuition on this enrollment
        grounds:
          - state_machines.Enrollment.CERTIFIED_to_ACTIVE
          - state_machines.Enrollment.CERTIFIED_to_CANCELED
          - entities.PaymentLedgerEntry.fields.source_entity
          - entities.PaymentLedgerEntry.fields.amount_dollars
        distinguishing_aspect: |
          Conserved quantity: sum(PaymentLedgerEntry.amount_dollars where
          source_entity=TUITION_PAYMENT and source_id=enrollment.id). After
          /certify -> /activate posts a positive TUITION_PAYMENT and a
          subsequent /cancel posts the matching negative TUITION_PAYMENT,
          this sum MUST equal 0.00. If /cancel is invoked while still in
          CERTIFIED (no prior TUITION_PAYMENT was posted because /activate
          had not run yet), the sum remains 0.00 because no compensation
          entry is emitted. Quantity = dollars.
        test_recipe:
          setup:
            - "Veteran HONORABLE, tier=100, GRANTED 10% claim"
            - "Enrollment, /certify (writes certified_tuition_payable)"
            - "Advance clock to term_start, /_sweep/run -> Enrollment becomes ACTIVE (emits +TUITION_PAYMENT)"
          trigger:
            - "POST /enrollments/{id}/cancel  # rejected because status is ACTIVE not CERTIFIED -> recover via /withdraw, then retry: scenario needs another path"
            - "Alternative path: a fresh Enrollment B is certified but never activated, then /cancel"
          assert:
            - "For the ACTIVE-then-completed Enrollment A: total tuition ledger entries reach completion without /cancel; invariant case is Enrollment B."
            - "Enrollment B (cancel while CERTIFIED): sum(amount_dollars where source_entity=TUITION_PAYMENT and source_id=B.id) == 0.00"

      - name: voc_rehab_dependent_uplift_invariant  # conserved quantity: monthly_subsistence base rate (excluding dep uplift)
        grounds:
          - calculations.voc_rehab_subsistence_compute
          - state_machines.Dependent.ACTIVE_to_REMOVED
          - entities.VocRehabPlan.fields.monthly_subsistence
        distinguishing_aspect: |
          Conserved quantity (DIFFERENT type from dollars-paid above):
          monthly_subsistence - uplift, i.e., the BASE rate for the
          training_mode (independent of dependent count). Adding a Dependent
          then removing them must leave this base unchanged. Quantity is the
          stable base portion of the monthly allowance.
        test_recipe:
          setup:
            - "Veteran HONORABLE, GRANTED 20% claim"
            - "1 SPOUSE Dependent already ACTIVE"
            - "VocRehabPlan training_mode=FULL_TIME_INSTITUTIONAL approved -> monthly_subsistence == 883.00"
          trigger:
            - "POST /dependents (CHILD age 5) -> 2 ACTIVE deps; voc_rehab_subsistence_compute does NOT re-run (it only re-runs on REMOVAL per scaffold). Implementation may keep 883.00."
            - "POST /dependents (CHILD age 6) -> 3 ACTIVE deps; monthly_subsistence still 883.00 because compute only re-runs on removal."
            - "DELETE the most recent CHILD -> 2 ACTIVE deps; re-runs voc_rehab_subsistence_compute -> 883.00"
            - "DELETE the earlier CHILD -> 1 ACTIVE dep; re-runs -> 883.00"
          assert:
            - "After all adds and removals: VocRehabPlan.monthly_subsistence == 883.00"
            - "Base = monthly_subsistence - uplift = 883.00 - 0.00 == 883.00 throughout; the BASE portion is conserved across the add-then-remove sequence."
