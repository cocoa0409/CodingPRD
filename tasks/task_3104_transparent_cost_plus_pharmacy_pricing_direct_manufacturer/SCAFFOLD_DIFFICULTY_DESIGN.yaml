      - name: licence_coverage_strict_after_expiry_half_open_membership
        grounds:
          - validations[priority=10]
          - state_machines.PharmacyLicense.transitions.ACTIVE_to_SUPERSEDED
          - state_machines.PharmacyLicense.transitions.PENDING_to_ACTIVE
          - errors[ERR_LICENSE_CONFLICT]
