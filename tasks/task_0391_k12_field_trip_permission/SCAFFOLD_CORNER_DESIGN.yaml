        distinguishing_aspect: "A request with an unknown X-User-Role → ERR_MISSING_OR_INVALID_USER_CONTEXT (401)."
        test_recipe:
          setup: ["No precondition; bad role header."]
          setup_api_calls: []
          trigger:
            - call: "GET /field-trips"
              payload: {}
              as: Intruder
              captures: { err: $.data.error_id }
          assert:
            - "Response error_id == ERR_MISSING_OR_INVALID_USER_CONTEXT"
            - "HTTP status == 401"

