  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: allotment_quarter_slot_occupancy_survives_release_and_frees_on_recall
        grounds:
          - validations[priority=25]
          - state_machines.Allotment.APPROVED_to_RELEASED
          - state_machines.Allotment.RELEASED_to_RECALLED
          - entities.Allotment.fields.quarter
        distinguishing_aspect: |
          The contended resource is the (appropriation_id, quarter) release slot and the
          occupancy set is status-scoped: a RELEASED sibling still occupies quarter 1
          (ERR_ALLOTMENT_QUARTER_OCCUPIED), the adjacent quarter 2 is never in contention,
          and recalling the RELEASED row moves it to RECALLED which is outside the blocking
          set and lets quarter 1 be claimed again.
        test_recipe:
          setup:
            - "Agency DOH; BudgetCycle 2027 driven to phase EXECUTION with one ADOPTED GENERAL forecast of 10000000000 cents"
            - "GENERAL Appropriation P100 enacted 2000000000, quarter-1 cap 440000000"
            - "One Allotment A1 on P100 quarter 1 for 400000000 cents driven all the way to RELEASED (prepared by analyst-1, approved by director-1)"
            - "Logical clock at the default 2026-08-01T00:00:00Z, which is quarter 1 of a cycle starting 2026-07-01"
          setup_api_calls:
            - call: "POST /fiscal/agencies"
              payload: { agency_code: "DOH", name: "Department of Health", agency_type: "EXECUTIVE" }
              as: SystemAdmin
              captures: { ag_id: $.data.id }
            - call: "POST /fiscal/budget-cycles"
              payload: { fiscal_year: 2027, fiscal_year_start_date: "2026-07-01", reserve_balance_cents: 500000000, constitutional_reserve_pct: 0.05 }
              as: SystemAdmin
              captures: { cyc_id: $.data.id, cyc_v: $.data.version }
            - call: "POST /fiscal/revenue-forecasts"
              payload: { budget_cycle_id: "${cyc_id}", source_code: "SALES_TAX", fund_type: "GENERAL", forecast_round: "CONSENSUS_SPRING", amount_cents: 10000000000, effective_from: "2026-07-01T00:00:00Z", effective_to: "2027-07-01T00:00:00Z", expected_budget_cycle_version: "${cyc_v}" }
              as: BudgetAnalyst
              captures: { fc_id: $.data.id }
            - call: "POST /fiscal/revenue-forecasts/${fc_id}/adopt"
              payload: {}
              as: BudgetDirector
            - call: "POST /fiscal/budget-cycles/${cyc_id}/advance-phase"
              payload: { to_phase: "EXECUTIVE_PREP" }
              as: BudgetDirector
            - call: "POST /fiscal/budget-cycles/${cyc_id}/certify-balance"
              payload: {}
              as: BudgetDirector
            - call: "POST /fiscal/budget-cycles/${cyc_id}/advance-phase"
              payload: { to_phase: "LEGISLATIVE" }
              as: BudgetDirector
            - call: "POST /fiscal/appropriations"
              payload: { budget_cycle_id: "${cyc_id}", agency_id: "${ag_id}", fund_type: "GENERAL", program_code: "P100", introduced_amount_cents: 2000000000 }
              as: LegislativeFiscalOfficer
              captures: { appr_id: $.data.id }
            - call: "POST /fiscal/appropriations/${appr_id}/enact"
              payload: {}
              as: LegislativeFiscalOfficer
            - call: "POST /fiscal/budget-cycles/${cyc_id}/advance-phase"
              payload: { to_phase: "ENACTED" }
              as: BudgetDirector
            - call: "POST /fiscal/budget-cycles/${cyc_id}/advance-phase"
              payload: { to_phase: "EXECUTION" }
              as: BudgetDirector
            - call: "POST /fiscal/allotments"
              payload: { appropriation_id: "${appr_id}", quarter: 1, requested_cents: 400000000, allow_partial: false }
              as: BudgetAnalyst
              captures: { a1_id: $.data.id }
            - call: "POST /fiscal/allotments/${a1_id}/prepare"
              payload: {}
              as: BudgetAnalyst
              as_user_id: "analyst-1"
            - call: "POST /fiscal/allotments/${a1_id}/approve"
              payload: {}
              as: BudgetDirector
              as_user_id: "director-1"
            - call: "POST /fiscal/allotments/${a1_id}/release"
              payload: {}
              as: StateController
          trigger:
            - call: "POST /fiscal/allotments"
              payload: { appropriation_id: "${appr_id}", quarter: 1, requested_cents: 10000000, allow_partial: false }
              as: BudgetAnalyst
            - call: "POST /fiscal/allotments"
              payload: { appropriation_id: "${appr_id}", quarter: 2, requested_cents: 10000000, allow_partial: false }
              as: BudgetAnalyst
              captures: { a2_id: $.data.id }
            - call: "POST /fiscal/allotments/${a1_id}/recall"
              payload: { reason: "cash plan revised" }
              as: StateController
            - call: "POST /fiscal/allotments"
              payload: { appropriation_id: "${appr_id}", quarter: 1, requested_cents: 10000000, allow_partial: false }
              as: BudgetAnalyst
              captures: { a3_id: $.data.id }
          assert:
            - "Allotment.${a1_id}.status == RELEASED and released_cents == 400000000 before the recall"
            - "the first quarter-1 POST /fiscal/allotments returns HTTP 409 with error_id == ERR_ALLOTMENT_QUARTER_OCCUPIED"
            - "the quarter-2 POST /fiscal/allotments returns HTTP 201 with Allotment.${a2_id}.quarter == 2 and status == DRAFT"
            - "after the recall: Allotment.${a1_id}.status == RECALLED and released_cents == 0"
            - "the second quarter-1 POST /fiscal/allotments returns HTTP 201 with Allotment.${a3_id}.quarter == 1"
            - "Appropriation.${appr_id}.released_cents == 0 and BudgetCycle.${cyc_id}.total_released_cents == 0 after the recall"

      - name: forecast_adoption_thirty_day_quiet_buffer_is_scoped_per_source_code
        grounds:
          - validations[priority=24]
          - state_machines.RevenueForecast.DRAFT_to_ADOPTED
          - entities.RevenueForecast.fields.effective_from
          - entities.RevenueForecast.fields.effective_to
          - calculations.cycle_balance_certification
        distinguishing_aspect: |
          The contended resource is an effective-date window rather than a discrete quarter
          slot, and the exclusion zone is widened by a 30-day quiet buffer that is scoped
          per source_code: a SALES_TAX window starting 14 days after the incumbent SALES_TAX
          window ends is rejected, a SALES_TAX window starting 31 days after it is accepted,
          and an INCOME_TAX window at the rejected 14-day offset is accepted because the
          buffer never crosses source_code boundaries.
        test_recipe:
          setup:
            - "BudgetCycle 2027 starting 2026-07-01 in phase DEVELOPMENT with constitutional_reserve_pct 0.05"
            - "F1 SALES_TAX GENERAL 5000000000 cents over [2026-07-01, 2026-10-01) already ADOPTED"
            - "F2 SALES_TAX GENERAL 3000000000 cents over [2026-10-15, 2027-01-01) still DRAFT — its window starts only 14 days after F1 ends"
