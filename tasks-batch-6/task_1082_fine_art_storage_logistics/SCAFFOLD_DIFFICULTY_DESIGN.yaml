              captures: { crew_id: $.data.id }
            - call: "POST /transport-jobs"
              payload: { artwork_id: "${a1_id}", crate_id: "${c1_id}", crew_id: "${crew_id}", origin_location: "Dock", destination_location: "Plaza", scheduled_start: "2026-06-01T09:00:00Z", scheduled_end: "2026-06-01T11:00:00Z", requires_rigging: true, estimated_hours: 2 }
              as: Coordinator
