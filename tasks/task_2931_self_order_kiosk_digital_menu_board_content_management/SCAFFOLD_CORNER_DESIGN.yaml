            - "Device.${dev_id}.cache_state == STALE and cached_bundle_id is still ${b1_id}; Store.${store_id}.content_posture == DEGRADED"
            - "StoreCluster.${cl_id}.published_bundle_version == 2"

      - name: price_request_revision_cycle_corner
        claim_type: cyclic
        grounds:
          - state_machines.PriceChangeRequest.PENDING_APPROVAL_to_CHANGES_REQUESTED
        excluded_because:
          difficulty_instance: non_linear_state_machine / price_request_revision_cycle_reprices_the_approval_tier
          rationale: "The CHANGES_REQUESTED -> PENDING_APPROVAL loop, the revision_round increment and the approval-list reset are all asserted by that §1.8 instance."

      - name: content_bundle_fork_join_corner
        claim_type: branching
        grounds:
          - state_machines.ContentBundle.VALIDATED_to_PUBLISHED
        excluded_because:
          difficulty_instance: non_linear_state_machine / bundle_fork_join_requires_both_branches_complete
          rationale: "PUBLISH requiring both the technical VALIDATE branch and the accessibility audit branch is the whole subject of that §1.8 instance."

      - name: store_posture_compound_derivation_corner
        claim_type: compound
        grounds:
          - state_machines.Store.DEGRADED_to_FROZEN
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / order_creation_gated_by_store_posture_frozen_by_quarantine
          rationale: "That §1.8 instance asserts content_posture being re-derived from the store's devices after a clock-driven quarantine, including the FROZEN-before-DEGRADED evaluation order."

      - name: cache_sync_guarded_by_bundle_state_corner
        claim_type: guarded_transitions
        grounds:
          - state_machines.Device.cache_state=MISSING_to_cache_state=FRESH
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / device_cache_sync_gated_by_content_bundle_state
          rationale: "The cross-entity guard (bundle must be PUBLISHED before a device may cache it) is asserted there, including the DRAFT and VALIDATED refusals."

      - name: price_apply_cascade_down_corner
        claim_type: cascade_down
        grounds:
          - state_machines.PriceChangeRequest.APPROVED_to_APPLIED
        excluded_because:
          difficulty_instance: transitive_cascade / price_apply_cascade_depth_four_to_store_posture
          rationale: "The four-link parent-to-children cascade from APPLY down to Store.content_posture is asserted link by link there."

      - name: eighty_six_cross_entity_cascade_corner
        claim_type: cross_entity
        grounds:
          - state_machines.StoreItemAvailability.listing_state=LISTED_to_listing_state=EIGHTY_SIXED
        excluded_because:
          difficulty_instance: transitive_cascade / manual_eighty_six_cascade_depth_five_to_device_cache
          rationale: "The 86 -> UpsellRule -> ContentBundle -> Device cross-entity chain is asserted there."

      - name: zone_override_total_ledger_sync_corner
        claim_type: ledger_sync
        grounds:
          - entities.MenuItem.fields.zone_override_total_cents
        excluded_because:
          difficulty_instance: compensating_invariant / price_rollback_restores_zone_override_total_and_cache_freshness
          rationale: "The derived ledger field is asserted before, during and after the APPLY/ROLLBACK pair there (0 -> 599 -> 0)."

      - name: order_void_compensation_corner
        claim_type: compensation
        grounds:
          - state_machines.OrderHandoff.handoff_state=QUEUED_TO_KITCHEN_to_handoff_state=VOIDED
        excluded_because:
          difficulty_instance: compensating_invariant / order_void_conserves_reserved_units_but_retires_the_order_number
          rationale: "Every reversed side effect of VOID — plus the deliberately non-reversed order-number counter — is asserted there."

