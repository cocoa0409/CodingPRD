scaffold_difficulty_design:
  # =====================================================================
  # Rule 1: dual_variant_calc (>= 2 instances, different entity domains)
  # =====================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: wing_prep_forecast_overlay_vs_base
        grounds:
          - calculations.wing_prep_forecast
          - entities.Event.fields.kind
          - entities.Event.fields.lift_pct
        distinguishing_aspect: |
          The same 48-hour window produces two different wing-prep numbers
          depending on whether an OVERLAY event overlaps a BASE event:
          base-only gross is 24000, overlay-inclusive gross is 27000,
          yielding required_pieces of 108000 vs 113400. Entity domain is
          Event/Venue forecasting.
        test_recipe:
          setup:
            - "Venue exists with wing_cost_cents_per_lb=180 (volatility=0)"
            - "Three BASE events in the 2026-09-13 14:00Z window: B1 exp 9000 at 19:00, B2 exp 12000 at 2026-09-14 01:00, B3 exp 3000 at 18:00"
            - "One OVERLAY event exp 0 lift 0.25 overlapping B2"
          setup_api_calls:
            - call: "POST /api/venues"
              payload: { name: "Downtown", market_zip: "14201", capacity_seats: 200, wing_cost_cents_per_lb: 180 }
              as: PlatformAdmin
              captures: { venue_id: $.data.id }
            - call: "POST /api/events"
              payload: { kind: "BASE", league: "FF_NFL", title: "Bills vs Jets", home_market_zip: "14201", expected_attendance: 9000, scheduled_start: "2026-09-13T19:00:00Z", scheduled_end: "2026-09-13T22:00:00Z" }
              as: Scheduler
              captures: { event_b1: $.data.id }
            - call: "POST /api/events"
              payload: { kind: "BASE", league: "FF_NFL", title: "Sunday Night", home_market_zip: "14201", expected_attendance: 12000, scheduled_start: "2026-09-14T01:00:00Z", scheduled_end: "2026-09-14T04:00:00Z" }
              as: Scheduler
              captures: { event_b2: $.data.id }
            - call: "POST /api/events"
              payload: { kind: "BASE", league: "MLB", title: "Yankees", home_market_zip: "10001", expected_attendance: 3000, scheduled_start: "2026-09-14T18:00:00Z", scheduled_end: "2026-09-14T21:00:00Z" }
              as: Scheduler
              captures: { event_b3: $.data.id }
            - call: "POST /api/events"
              payload: { kind: "OVERLAY", league: "ENTERTAINMENT", title: "Halftime Show", home_market_zip: "14201", expected_attendance: 0, scheduled_start: "2026-09-13T22:30:00Z", scheduled_end: "2026-09-14T02:30:00Z", lift_pct: 0.25 }
              as: Scheduler
              captures: { event_o1: $.data.id }
          trigger:
            - call: "GET /api/venues/${venue_id}/forecasts/wing-prep"
              payload: { date: "2026-09-13" }
              as: VenueManager
              captures: { forecast: $.data }
          assert:
            - "forecast.base_attendance == 24000"
            - "forecast.overlay_attendance == 3000"
            - "forecast.required_pieces == 113400"
            - "forecast.shortage_risk == false"

      - name: trivia_points_speed_streak_vs_flat
        grounds:
          - calculations.trivia_points
          - entities.TriviaEntry.fields.points
          - entities.TriviaEntry.fields.consecutive_correct
        distinguishing_aspect: |
          The same answer sequence produces two different point totals
          depending on whether the speed and streak bonuses are applied:
          a flat 100-per-correct yields 300, while the full formula with
          10s/10s/10s responses yields 150 on the third answer alone
          (100 base + 25 speed + 25 streak), for a total of 400.
          Entity domain is TriviaEntry scoring.
        test_recipe:
          setup:
            - "Venue exists"
            - "TriviaSession exists and is OPEN"
            - "TriviaEntry exists for a guest"
          setup_api_calls:
            - call: "POST /api/venues"
              payload: { name: "Downtown", market_zip: "14201", capacity_seats: 200, wing_cost_cents_per_lb: 180 }
              as: PlatformAdmin
              captures: { venue_id: $.data.id }
            - call: "POST /api/venues/${venue_id}/trivia-sessions"
              payload: { title: "Trivia Night" }
              as: Host
              captures: { session_id: $.data.id }
            - call: "POST /api/guests"
              payload: { venue_id: "${venue_id}", name: "Alex", phone: "555-0100" }
              as: Host
              captures: { guest_id: $.data.id }
            - call: "POST /api/trivia-sessions/${session_id}/entries"
              payload: { guest_id: "${guest_id}" }
              as: Host
              captures: { entry_id: $.data.id }
          trigger:
            - call: "POST /api/trivia-entries/${entry_id}/answers"
              payload: { is_correct: true, response_time_ms: 10000 }
              as: Host
            - call: "POST /api/trivia-entries/${entry_id}/answers"
              payload: { is_correct: true, response_time_ms: 10000 }
              as: Host
            - call: "POST /api/trivia-entries/${entry_id}/answers"
              payload: { is_correct: true, response_time_ms: 10000 }
              as: Host
              captures: { entry: $.data }
          assert:
            - "entry.points == 400"
            - "entry.correct_count == 3"
            - "entry.consecutive_correct == 3"

  # =====================================================================
  # Rule 2: combinatorial_formula (>= 2 instances, different modes)
  # =====================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: wing_quote_promo_tier_surcharge_mode_a
        grounds:
          - calculations.wing_price_quote
          - entities.PromoRule.fields.day_of_week
          - entities.Venue.fields.wing_cost_cents_per_lb
        distinguishing_aspect: |
          Mode (a): a formula with >= 3 inputs and non-linear interaction.
          The quote combines promo selection (day-of-week + date range),
          quantity tier (>= 50 pieces), and a 30-day consumption surcharge
          (> 5000 pieces) in a single multiplication chain. 60 pieces on
          promo day with no surcharge yields 513 cents; the same quantity
          without promo yields 855 cents.
        test_recipe:
          setup:
            - "Venue exists with wing_cost_cents_per_lb=180"
            - "Guest exists"
            - "PromoRule for TRADITIONAL on day_of_week=6 (Sunday), price 900 per 10, valid 2026-09-01 to 2026-09-30"
            - "No prior settled checks for this guest (surcharge inactive)"
          setup_api_calls:
            - call: "POST /api/venues"
              payload: { name: "Downtown", market_zip: "14201", capacity_seats: 200, wing_cost_cents_per_lb: 180 }
              as: PlatformAdmin
              captures: { venue_id: $.data.id }
            - call: "POST /api/guests"
              payload: { venue_id: "${venue_id}", name: "Alex", phone: "555-0100" }
              as: Host
              captures: { guest_id: $.data.id }
            - call: "POST /api/promo-rules"
              payload: { day_of_week: 6, wing_kind: "TRADITIONAL", promo_price_cents_per_10: 900, start_date: "2026-09-01T00:00:00Z", end_date: "2026-09-30T23:59:59Z" }
              as: VenueManager
              captures: { promo_id: $.data.id }
          trigger:
            - call: "POST /api/venues/${venue_id}/wing-pricing/quote"
              payload: { guest_id: "${guest_id}", wing_kind: "TRADITIONAL", pieces: 60, event_date: "2026-09-13" }
              as: Server
              captures: { quote: $.data }
          assert:
            - "quote.quote_cents == 513"
            - "quote.promo_applied == true"
            - "quote.quantity_tier_applied == true"
            - "quote.surcharge_applied == false"

      - name: event_check_total_rounding_order_mode_b
        grounds:
          - calculations.event_check_total
          - entities.Check.fields.subtotal_cents
          - entities.Check.fields.tax_cents
        distinguishing_aspect: |
          Mode (b): nested rounding where the order matters. The scaffold
          pins per-unit, then per-line, then per-check tax. Five lines of
          10 promo wings at $11.00/10 with 10% surcharge and 5% tier
          discount: per-unit 121c, per-line 1150c, subtotal 5750c,
          tax 288c, total 6038c. Rounding only at the end would yield
          6037.5c -> 6038c only by coincidence; a different surcharge
          (e.g. 11%) would diverge.
        test_recipe:
          setup:
            - "Venue exists with wing_cost_cents_per_lb=230 (volatility > 0.25, surcharge active)"
            - "Guest exists with 6000 pieces ordered in last 30 days (surcharge active)"
            - "PromoRule for TRADITIONAL on day_of_week=6, price 1100 per 10"
            - "Check is OPEN with kind=REGULAR"
          setup_api_calls:
            - call: "POST /api/venues"
              payload: { name: "Downtown", market_zip: "14201", capacity_seats: 200, wing_cost_cents_per_lb: 230 }
              as: PlatformAdmin
              captures: { venue_id: $.data.id }
            - call: "POST /api/guests"
              payload: { venue_id: "${venue_id}", name: "Alex", phone: "555-0100" }
              as: Host
              captures: { guest_id: $.data.id }
            - call: "POST /api/promo-rules"
              payload: { day_of_week: 6, wing_kind: "TRADITIONAL", promo_price_cents_per_10: 1100, start_date: "2026-09-01T00:00:00Z", end_date: "2026-09-30T23:59:59Z" }
              as: VenueManager
              captures: { promo_id: $.data.id }
            - call: "POST /api/checks"
              payload: { venue_id: "${venue_id}", guest_id: "${guest_id}", party_size: 2, kind: "REGULAR" }
              as: Server
              captures: { check_id: $.data.id }
            - call: "POST /api/checks/${check_id}/order-lines"
              payload: { kind: "TRADITIONAL", portion_count: 1 }
              as: Server
            - call: "POST /api/checks/${check_id}/order-lines"
              payload: { kind: "TRADITIONAL", portion_count: 1 }
              as: Server
            - call: "POST /api/checks/${check_id}/order-lines"
              payload: { kind: "TRADITIONAL", portion_count: 1 }
              as: Server
            - call: "POST /api/checks/${check_id}/order-lines"
              payload: { kind: "TRADITIONAL", portion_count: 1 }
              as: Server
            - call: "POST /api/checks/${check_id}/order-lines"
              payload: { kind: "TRADITIONAL", portion_count: 1 }
              as: Server
          trigger:
            - call: "POST /api/checks/${check_id}/settle"
              payload: {}
              as: Server
              captures: { check: $.data }
          assert:
            - "check.subtotal_cents == 5750"
            - "check.tax_cents == 288"
            - "check.total_cents == 6038"
            - "check.status == SETTLED"

  # =====================================================================
  # Rule 3: non_linear_state_machine (>= 2 instances, different entities)
  # =====================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: staffing_plan_publish_revert_cycle
        grounds:
          - state_machines.StaffingPlan.DRAFT_to_PUBLISHED
          - state_machines.StaffingPlan.PUBLISHED_to_DRAFT
          - state_machines.StaffingPlan.PUBLISHED_to_LOCKED
        distinguishing_aspect: |
          StaffingPlan exhibits a cycle: DRAFT -> PUBLISHED -> DRAFT.
          The revert transition is guarded by "no shift has started yet",
          making the cycle conditional on the logical clock. Entity is
          StaffingPlan.
        test_recipe:
          setup:
            - "Venue exists"
            - "StaffingPlan exists in DRAFT with one future shift"
          setup_api_calls:
            - call: "POST /api/venues"
              payload: { name: "Downtown", market_zip: "14201", capacity_seats: 200, wing_cost_cents_per_lb: 180 }
              as: PlatformAdmin
              captures: { venue_id: $.data.id }
            - call: "POST /api/venues/${venue_id}/staffing-plans"
              payload: { name: "Sunday Shift" }
              as: VenueManager
              captures: { plan_id: $.data.id }
            - call: "POST /api/staffing-plans/${plan_id}/shifts"
              payload: { role: "FOH", start_time: "2026-09-14T16:00:00Z", end_time: "2026-09-15T00:00:00Z", headcount: 10, expected_covers: 3600 }
              as: VenueManager
              captures: { shift_id: $.data.id }
          trigger:
            - call: "POST /api/staffing-plans/${plan_id}/publish"
              payload: {}
              as: VenueManager
              captures: { plan_pub: $.data }
            - call: "POST /api/staffing-plans/${plan_id}/revert"
              payload: {}
              as: VenueManager
              captures: { plan_rev: $.data }
          assert:
            - "plan_pub.status == PUBLISHED"
            - "plan_rev.status == DRAFT"

      - name: zone_posture_compound_full_blackout
        grounds:
          - state_machines.Zone.OPEN_to_FULL
          - state_machines.Zone.FULL_to_BLACKOUT_LOCKED
          - state_machines.Zone.BLACKOUT_LOCKED_to_OPEN
          - calculations.zone_primary_allocation
        distinguishing_aspect: |
          Zone.posture is a compound/derived machine whose transitions
          depend on aggregate state of ScreenAssignments and the primary
          event's expected_attendance relative to Venue.capacity_seats.
          The same zone can transition OPEN -> FULL -> BLACKOUT_LOCKED ->
          OPEN without any direct zone endpoint call. Entity is Zone.
        test_recipe:
          setup:
            - "Venue exists with capacity_seats=200"
            - "Event E1 (BASE, FF_NFL) exp 9000 at 2026-09-13T19:00:00Z"
            - "Zone exists with screen_ids ['S1']"
            - "ScreenAssignment links zone to E1"
            - "Clock is before blackout window"
          setup_api_calls:
            - call: "POST /api/venues"
              payload: { name: "Downtown", market_zip: "14201", capacity_seats: 200, wing_cost_cents_per_lb: 180 }
              as: PlatformAdmin
              captures: { venue_id: $.data.id }
            - call: "POST /api/events"
              payload: { kind: "BASE", league: "FF_NFL", title: "Bills vs Jets", home_market_zip: "14201", expected_attendance: 9000, scheduled_start: "2026-09-13T19:00:00Z", scheduled_end: "2026-09-13T22:00:00Z" }
              as: Scheduler
              captures: { event_id: $.data.id }
            - call: "POST /api/venues/${venue_id}/zones"
              payload: { name: "Main Bar", screen_ids: ["S1"] }
              as: VenueManager
              captures: { zone_id: $.data.id }
            - call: "POST /api/zones/${zone_id}/screen-assignments"
              payload: { event_id: "${event_id}", screen_id: "S1", audio_enabled: true }
              as: VenueManager
              captures: { assignment_id: $.data.id }
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-13T18:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /api/zones/${zone_id}"
              payload: {}
              as: VenueManager
              captures: { zone_before: $.data }
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-13T18:45:00Z" }
              as: PlatformAdmin
            - call: "GET /api/zones/${zone_id}"
              payload: {}
              as: VenueManager
              captures: { zone_during: $.data }
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-13T23:30:00Z" }
              as: PlatformAdmin
            - call: "GET /api/zones/${zone_id}"
              payload: {}
              as: VenueManager
              captures: { zone_after: $.data }
          assert:
            - "zone_before.posture == FULL"
            - "zone_during.posture == BLACKOUT_LOCKED"
            - "zone_after.posture == OPEN"
            - "zone_after.primary_event_id == null"

  # =====================================================================
  # Rule 4: transitive_cascade (>= 2 instances, different triggers)
  # =====================================================================
  - rule_id: transitive_cascade
    instances:
      - name: event_cancel_cascade_zone_waitlist
        grounds:
          - state_machines.Event.INGESTED_to_CANCELLED
          - state_machines.Zone.FULL_to_OPEN
          - state_machines.Zone.OPEN_to_FULL
        distinguishing_aspect: |
          Cascade depth 3: cancel Event -> ScreenAssignment removed ->
          Zone primary_event_id recomputed -> posture may drop from FULL
          to OPEN -> waitlist join unblocked. Trigger is Event cancellation.
        test_recipe:
          setup:
            - "Venue with capacity_seats=200"
            - "Zone with assignment to E1 (exp 9000) -> posture FULL"
            - "Waitlist join blocked while zone FULL"
          setup_api_calls:
            - call: "POST /api/venues"
              payload: { name: "Downtown", market_zip: "14201", capacity_seats: 200, wing_cost_cents_per_lb: 180 }
              as: PlatformAdmin
              captures: { venue_id: $.data.id }
            - call: "POST /api/events"
              payload: { kind: "BASE", league: "FF_NFL", title: "Bills vs Jets", home_market_zip: "14201", expected_attendance: 9000, scheduled_start: "2026-09-13T19:00:00Z", scheduled_end: "2026-09-13T22:00:00Z" }
              as: Scheduler
              captures: { event_id: $.data.id }
            - call: "POST /api/venues/${venue_id}/zones"
              payload: { name: "Main Bar", screen_ids: ["S1"] }
              as: VenueManager
              captures: { zone_id: $.data.id }
            - call: "POST /api/zones/${zone_id}/screen-assignments"
              payload: { event_id: "${event_id}", screen_id: "S1", audio_enabled: true }
              as: VenueManager
              captures: { assignment_id: $.data.id }
            - call: "POST /api/guests"
              payload: { venue_id: "${venue_id}", name: "Alex", phone: "555-0100" }
              as: Host
              captures: { guest_id: $.data.id }
          trigger:
            - call: "POST /api/events/${event_id}/cancel"
              payload: {}
              as: Scheduler
            - call: "GET /api/zones/${zone_id}"
              payload: {}
              as: VenueManager
              captures: { zone_after: $.data }
            - call: "POST /api/waitlist"
              payload: { venue_id: "${venue_id}", guest_id: "${guest_id}", party_size: 4 }
              as: Host
              captures: { waitlist_entry: $.data }
          assert:
            - "zone_after.posture == OPEN"
            - "zone_after.primary_event_id == null"
            - "waitlist_entry.status == WAITING"

      - name: order_line_void_cascade_check_total
        grounds:
          - state_machines.OrderLine.OPEN_to_VOID
          - entities.Check.fields.subtotal_cents
          - entities.Check.fields.tax_cents
        distinguishing_aspect: |
          Cascade depth 2: void OrderLine -> Check.subtotal_cents recomputed
          -> Check.tax_cents and total_cents recomputed on next settle.
          Trigger is OrderLine void.
        test_recipe:
          setup:
            - "Venue exists"
            - "Check OPEN with two TRADITIONAL order lines (2 portions each)"
          setup_api_calls:
            - call: "POST /api/venues"
              payload: { name: "Downtown", market_zip: "14201", capacity_seats: 200, wing_cost_cents_per_lb: 180 }
              as: PlatformAdmin
              captures: { venue_id: $.data.id }
            - call: "POST /api/guests"
              payload: { venue_id: "${venue_id}", name: "Alex", phone: "555-0100" }
              as: Host
              captures: { guest_id: $.data.id }
            - call: "POST /api/checks"
              payload: { venue_id: "${venue_id}", guest_id: "${guest_id}", party_size: 2, kind: "REGULAR" }
              as: Server
              captures: { check_id: $.data.id }
            - call: "POST /api/checks/${check_id}/order-lines"
              payload: { kind: "TRADITIONAL", portion_count: 2 }
              as: Server
              captures: { line1_id: $.data.id }
            - call: "POST /api/checks/${check_id}/order-lines"
              payload: { kind: "TRADITIONAL", portion_count: 2 }
              as: Server
              captures: { line2_id: $.data.id }
          trigger:
            - call: "POST /api/order-lines/${line1_id}/void"
              payload: {}
              as: Server
            - call: "GET /api/checks/${check_id}"
              payload: {}
              as: Server
              captures: { check_after_void: $.data }
            - call: "POST /api/checks/${check_id}/settle"
              payload: {}
              as: Server
              captures: { check_settled: $.data }
          assert:
            - "check_after_void.subtotal_cents == 3000"
            - "check_settled.tax_cents == 150"
            - "check_settled.total_cents == 3150"
            - "check_settled.status == SETTLED"

  # =====================================================================
  # Rule 5: priority_pair_validation_conflict (>= 2 instances, different pairs)
  # =====================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_business_safety_blackout
        grounds:
          - validations[priority=4]
          - validations[priority=5]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_BLACKOUT_WINDOW_ACTIVE]
        distinguishing_aspect: |
          A screen assignment request that violates both state (zone already
          has an assignment on that screen) and business_safety (blackout
          window active for the event) must return ERR_INVALID_STATE
          (priority 4) before ERR_BLACKOUT_WINDOW_ACTIVE (priority 5).
          Error-category pair: state vs business_safety.
        test_recipe:
          setup:
            - "Venue with market_zip=14201, capacity 200"
            - "Zone with screen S1 already assigned to a non-blacked-out event"
            - "Event E2 (BASE, NCAA) scheduled 2026-09-13T19:00:00Z, home_market_zip=14201"
            - "License for NCAA is ACTIVE"
            - "Clock at 2026-09-13T18:45:00Z (blackout active)"
          setup_api_calls:
            - call: "POST /api/venues"
              payload: { name: "Downtown", market_zip: "14201", capacity_seats: 200, wing_cost_cents_per_lb: 180 }
              as: PlatformAdmin
              captures: { venue_id: $.data.id }
            - call: "POST /api/events"
              payload: { kind: "BASE", league: "FF_NFL", title: "Early Game", home_market_zip: "10001", expected_attendance: 100, scheduled_start: "2026-09-13T16:00:00Z", scheduled_end: "2026-09-13T18:00:00Z" }
              as: Scheduler
              captures: { event_e1: $.data.id }
            - call: "POST /api/events"
              payload: { kind: "BASE", league: "NCAA", title: "College Game", home_market_zip: "14201", expected_attendance: 5000, scheduled_start: "2026-09-13T19:00:00Z", scheduled_end: "2026-09-13T22:00:00Z" }
              as: Scheduler
              captures: { event_e2: $.data.id }
            - call: "POST /api/venues/${venue_id}/zones"
              payload: { name: "Main Bar", screen_ids: ["S1"] }
              as: VenueManager
              captures: { zone_id: $.data.id }
            - call: "POST /api/zones/${zone_id}/screen-assignments"
              payload: { event_id: "${event_e1}", screen_id: "S1", audio_enabled: true }
              as: VenueManager
              captures: { assignment_id: $.data.id }
            - call: "POST /api/venues/${venue_id}/licenses"
              payload: { league: "NCAA", blackout_radius_miles: 75, fee_per_head_cents: 100 }
              as: VenueManager
              captures: { license_id: $.data.id }
            - call: "POST /api/licenses/${license_id}/activate"
              payload: {}
              as: VenueManager
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-13T18:45:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /api/zones/${zone_id}/screen-assignments"
              payload: { event_id: "${event_e2}", screen_id: "S1", audio_enabled: false }
              as: VenueManager
              captures: { err: $.data }
          assert:
            - "err.error_id == ERR_INVALID_STATE"

      - name: business_referential_vs_business_fiscal_contest
        grounds:
          - validations[priority=8]
          - validations[priority=10]
          - errors[ERR_CONTEST_NOT_OPEN]
          - errors[ERR_PRIZE_STRUCTURE_INVALID]
        distinguishing_aspect: |
          A fantasy entry registration that violates both business_referential
          (contest is DRAFT, not OPEN) and business_fiscal (prize_structure
          sums to 0.9, invalid) must return ERR_CONTEST_NOT_OPEN
          (priority 8) before ERR_PRIZE_STRUCTURE_INVALID (priority 10).
          Error-category pair: business_referential vs business_fiscal.
        test_recipe:
          setup:
            - "Venue exists"
            - "Guest exists"
            - "FantasyContest in DRAFT with invalid prize_structure"
          setup_api_calls:
            - call: "POST /api/venues"
              payload: { name: "Downtown", market_zip: "14201", capacity_seats: 200, wing_cost_cents_per_lb: 180 }
              as: PlatformAdmin
              captures: { venue_id: $.data.id }
            - call: "POST /api/guests"
              payload: { venue_id: "${venue_id}", name: "Alex", phone: "555-0100" }
              as: Host
              captures: { guest_id: $.data.id }
            - call: "POST /api/venues/${venue_id}/fantasy-contests"
              payload: { entry_fee_cents: 2500, rake_pct: 0.10, prize_structure: [0.5, 0.3, 0.1] }
              as: VenueManager
              captures: { contest_id: $.data.id }
          trigger:
            - call: "POST /api/fantasy-contests/${contest_id}/entries"
              payload: { guest_id: "${guest_id}", lineup: { qb: "Allen" } }
              as: Host
              captures: { err: $.data }
          assert:
            - "err.error_id == ERR_CONTEST_NOT_OPEN"

  # =====================================================================
  # Rule 6: boundary_precision_check (>= 2 instances, different metrics/endpoints)
  # =====================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: zone_full_capacity_boundary
        grounds:
          - calculations.zone_primary_allocation
          - entities.Zone.fields.posture
        distinguishing_aspect: |
          Boundary: expected_attendance >= capacity_seats. At exactly 200
          the zone becomes FULL; at 199 it remains OPEN. Metric is
          expected_attendance; endpoint is zone assignment.
        test_recipe:
          setup:
            - "Venue with capacity_seats=200"
            - "Zone with screen S1"
            - "Event with expected_attendance=200"
          setup_api_calls:
            - call: "POST /api/venues"
              payload: { name: "Downtown", market_zip: "14201", capacity_seats: 200, wing_cost_cents_per_lb: 180 }
              as: PlatformAdmin
              captures: { venue_id: $.data.id }
            - call: "POST /api/venues/${venue_id}/zones"
              payload: { name: "Main Bar", screen_ids: ["S1"] }
              as: VenueManager
              captures: { zone_id: $.data.id }
            - call: "POST /api/events"
              payload: { kind: "BASE", league: "FF_NFL", title: "Boundary Game", home_market_zip: "14201", expected_attendance: 200, scheduled_start: "2026-09-13T19:00:00Z", scheduled_end: "2026-09-13T22:00:00Z" }
              as: Scheduler
              captures: { event_id: $.data.id }
          trigger:
            - call: "POST /api/zones/${zone_id}/screen-assignments"
              payload: { event_id: "${event_id}", screen_id: "S1", audio_enabled: true }
              as: VenueManager
              captures: { assignment: $.data }
            - call: "GET /api/zones/${zone_id}"
              payload: {}
              as: VenueManager
              captures: { zone: $.data }
          assert:
            - "zone.posture == FULL"
            - "zone.primary_event_id == ${event_id}"

      - name: wing_quote_quantity_tier_boundary
        grounds:
          - calculations.wing_price_quote
          - entities.PromoRule.fields.promo_price_cents_per_10
        distinguishing_aspect: |
          Boundary: pieces >= 50 triggers the 5% quantity tier. At 49
          pieces the multiplier is 1.0; at 50 it is 0.95. Metric is
          pieces; endpoint is the wing-pricing quote.
        test_recipe:
          setup:
            - "Venue exists with wing_cost_cents_per_lb=180"
            - "Guest exists"
            - "No promo rule for the date"
          setup_api_calls:
            - call: "POST /api/venues"
              payload: { name: "Downtown", market_zip: "14201", capacity_seats: 200, wing_cost_cents_per_lb: 180 }
              as: PlatformAdmin
              captures: { venue_id: $.data.id }
            - call: "POST /api/guests"
              payload: { venue_id: "${venue_id}", name: "Alex", phone: "555-0100" }
              as: Host
              captures: { guest_id: $.data.id }
          trigger:
            - call: "POST /api/venues/${venue_id}/wing-pricing/quote"
              payload: { guest_id: "${guest_id}", wing_kind: "TRADITIONAL", pieces: 49, event_date: "2026-09-13" }
              as: Server
              captures: { quote_49: $.data }
            - call: "POST /api/venues/${venue_id}/wing-pricing/quote"
              payload: { guest_id: "${guest_id}", wing_kind: "TRADITIONAL", pieces: 50, event_date: "2026-09-13" }
              as: Server
              captures: { quote_50: $.data }
          assert:
            - "quote_49.quote_cents == 7350"
            - "quote_49.quantity_tier_applied == false"
            - "quote_50.quote_cents == 7125"
            - "quote_50.quantity_tier_applied == true"

  # =====================================================================
  # Rule 7: cross_entity_state_dependency (>= 2 instances, different pairs)
  # =====================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: zone_assignment_requires_active_license
        grounds:
          - validations[priority=6]
          - state_machines.BroadcastLicense.PENDING_to_ACTIVE
          - entities.Zone.fields.posture
        distinguishing_aspect: |
          Zone screen assignment depends on BroadcastLicense.status being
          ACTIVE for the event's league. Pair: Zone -> BroadcastLicense.
        test_recipe:
          setup:
            - "Venue exists"
            - "Zone exists"
            - "Event E1 (BASE, NCAA) exists"
            - "License for NCAA is PENDING (not activated)"
          setup_api_calls:
            - call: "POST /api/venues"
              payload: { name: "Downtown", market_zip: "14201", capacity_seats: 200, wing_cost_cents_per_lb: 180 }
              as: PlatformAdmin
              captures: { venue_id: $.data.id }
            - call: "POST /api/venues/${venue_id}/zones"
              payload: { name: "Main Bar", screen_ids: ["S1"] }
              as: VenueManager
              captures: { zone_id: $.data.id }
            - call: "POST /api/events"
              payload: { kind: "BASE", league: "NCAA", title: "College Game", home_market_zip: "14201", expected_attendance: 5000, scheduled_start: "2026-09-13T19:00:00Z", scheduled_end: "2026-09-13T22:00:00Z" }
              as: Scheduler
              captures: { event_id: $.data.id }
            - call: "POST /api/venues/${venue_id}/licenses"
              payload: { league: "NCAA", blackout_radius_miles: 75, fee_per_head_cents: 100 }
              as: VenueManager
              captures: { license_id: $.data.id }
          trigger:
            - call: "POST /api/zones/${zone_id}/screen-assignments"
              payload: { event_id: "${event_id}", screen_id: "S1", audio_enabled: true }
              as: VenueManager
              captures: { err: $.data }
          assert:
            - "err.error_id == ERR_LICENSE_NOT_ACTIVE"

      - name: waitlist_seat_requires_guest_state
        grounds:
          - state_machines.WaitlistEntry.CALLED_to_SEATED
          - entities.Guest.fields.no_show_count
        distinguishing_aspect: |
          WaitlistEntry seating depends on Guest.no_show_count being < 3.
          A guest with 3 prior no-shows cannot be seated even when CALLED.
          Pair: WaitlistEntry -> Guest.
        test_recipe:
          setup:
            - "Venue exists"
            - "Guest with no_show_count=3"
            - "WaitlistEntry in CALLED state"
          setup_api_calls:
            - call: "POST /api/venues"
              payload: { name: "Downtown", market_zip: "14201", capacity_seats: 200, wing_cost_cents_per_lb: 180 }
              as: PlatformAdmin
              captures: { venue_id: $.data.id }
            - call: "POST /api/guests"
              payload: { venue_id: "${venue_id}", name: "Alex", phone: "555-0100" }
              as: Host
              captures: { guest_id: $.data.id }
            - call: "POST /api/waitlist"
              payload: { venue_id: "${venue_id}", guest_id: "${guest_id}", party_size: 4 }
              as: Host
              captures: { entry_id: $.data.id }
            - call: "POST /api/waitlist/${entry_id}/call"
              payload: {}
              as: Host
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:16:00Z" }
              as: PlatformAdmin
            - call: "POST /api/waitlist/${entry_id}/cancel"
              payload: {}
              as: Host
            - call: "POST /api/waitlist"
              payload: { venue_id: "${venue_id}", guest_id: "${guest_id}", party_size: 4 }
              as: Host
              captures: { entry_id2: $.data.id }
            - call: "POST /api/waitlist/${entry_id2}/call"
              payload: {}
              as: Host
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:32:00Z" }
              as: PlatformAdmin
            - call: "POST /api/waitlist/${entry_id2}/cancel"
              payload: {}
              as: Host
            - call: "POST /api/waitlist"
              payload: { venue_id: "${venue_id}", guest_id: "${guest_id}", party_size: 4 }
              as: Host
              captures: { entry_id3: $.data.id }
            - call: "POST /api/waitlist/${entry_id3}/call"
              payload: {}
              as: Host
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:48:00Z" }
              as: PlatformAdmin
            - call: "POST /api/waitlist/${entry_id3}/cancel"
              payload: {}
              as: Host
            - call: "POST /api/waitlist"
              payload: { venue_id: "${venue_id}", guest_id: "${guest_id}", party_size: 4 }
              as: Host
              captures: { entry_id4: $.data.id }
            - call: "POST /api/waitlist/${entry_id4}/call"
              payload: {}
              as: Host
              captures: { entry_v4: $.data.version }
          trigger:
            - call: "POST /api/waitlist/${entry_id4}/seat"
              payload: { expected_waitlist_entry_version: "${entry_v4}" }
              as: Host
              captures: { err: $.data }
          assert:
            - "err.error_id == ERR_TOO_MANY_NO_SHOWS"

  # =====================================================================
  # Rule 8: resource_temporal_overlap (>= 2 instances, different interval semantics)
  # =====================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: screen_assignment_exclusive_interval
        grounds:
          - validations[priority=9]
          - errors[ERR_SCREEN_ALREADY_ASSIGNED]
        distinguishing_aspect: |
          Interval semantics: exclusive screen occupation. A screen can
          show only one event at a time; assigning a second event to the
          same screen while the first is active is rejected with
          ERR_SCREEN_ALREADY_ASSIGNED. Resource is ScreenAssignment.
        test_recipe:
          setup:
            - "Venue exists"
            - "Zone with screen S1"
            - "Two events E1 and E2"
          setup_api_calls:
            - call: "POST /api/venues"
              payload: { name: "Downtown", market_zip: "14201", capacity_seats: 200, wing_cost_cents_per_lb: 180 }
              as: PlatformAdmin
              captures: { venue_id: $.data.id }
            - call: "POST /api/venues/${venue_id}/zones"
              payload: { name: "Main Bar", screen_ids: ["S1"] }
              as: VenueManager
              captures: { zone_id: $.data.id }
            - call: "POST /api/events"
              payload: { kind: "BASE", league: "FF_NFL", title: "Game A", home_market_zip: "14201", expected_attendance: 5000, scheduled_start: "2026-09-13T19:00:00Z", scheduled_end: "2026-09-13T22:00:00Z" }
              as: Scheduler
              captures: { event_e1: $.data.id }
            - call: "POST /api/events"
              payload: { kind: "BASE", league: "MLB", title: "Game B", home_market_zip: "10001", expected_attendance: 3000, scheduled_start: "2026-09-13T20:00:00Z", scheduled_end: "2026-09-13T23:00:00Z" }
              as: Scheduler
              captures: { event_e2: $.data.id }
            - call: "POST /api/zones/${zone_id}/screen-assignments"
              payload: { event_id: "${event_e1}", screen_id: "S1", audio_enabled: true }
              as: VenueManager
              captures: { assignment_id: $.data.id }
          trigger:
            - call: "POST /api/zones/${zone_id}/screen-assignments"
              payload: { event_id: "${event_e2}", screen_id: "S1", audio_enabled: false }
              as: VenueManager
              captures: { err: $.data }
          assert:
            - "err.error_id == ERR_SCREEN_ALREADY_ASSIGNED"

      - name: blackout_window_aggregate_capacity
        grounds:
          - calculations.blackout_window
          - state_machines.Zone.OPEN_to_BLACKOUT_LOCKED
        distinguishing_aspect: |
          Interval semantics: aggregate capacity buffer. The blackout
          window extends 30 minutes before and 60 minutes after the event,
          creating a buffer interval that blocks assignments even when
          the event itself has not started. Resource is Zone (aggregate
          of screens). Different from screen-level exclusivity because
          it applies to the entire zone and uses a wider interval.
        test_recipe:
          setup:
            - "Venue with market_zip=14201"
            - "Zone with screen S1"
            - "Event E1 (BASE, NCAA) at 2026-09-13T19:00:00Z, home_market_zip=14201"
            - "License for NCAA ACTIVE"
            - "Clock at 2026-09-13T18:45:00Z (inside blackout buffer)"
          setup_api_calls:
            - call: "POST /api/venues"
              payload: { name: "Downtown", market_zip: "14201", capacity_seats: 200, wing_cost_cents_per_lb: 180 }
              as: PlatformAdmin
              captures: { venue_id: $.data.id }
            - call: "POST /api/venues/${venue_id}/zones"
              payload: { name: "Main Bar", screen_ids: ["S1"] }
              as: VenueManager
              captures: { zone_id: $.data.id }
            - call: "POST /api/events"
              payload: { kind: "BASE", league: "NCAA", title: "College Game", home_market_zip: "14201", expected_attendance: 5000, scheduled_start: "2026-09-13T19:00:00Z", scheduled_end: "2026-09-13T22:00:00Z" }
              as: Scheduler
              captures: { event_id: $.data.id }
            - call: "POST /api/venues/${venue_id}/licenses"
              payload: { league: "NCAA", blackout_radius_miles: 75, fee_per_head_cents: 100 }
              as: VenueManager
              captures: { license_id: $.data.id }
            - call: "POST /api/licenses/${license_id}/activate"
              payload: {}
              as: VenueManager
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-13T18:45:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /api/zones/${zone_id}/screen-assignments"
              payload: { event_id: "${event_id}", screen_id: "S1", audio_enabled: true }
              as: VenueManager
              captures: { err: $.data }
          assert:
            - "err.error_id == ERR_BLACKOUT_WINDOW_ACTIVE"

  # =====================================================================
  # Rule 9: compensating_invariant (>= 2 instances, different conserved quantities)
  # =====================================================================
  - rule_id: compensating_invariant
    instances:
      - name: waitlist_seat_cancel_no_show_invariant
        grounds:
          - state_machines.WaitlistEntry.CALLED_to_SEATED
          - state_machines.WaitlistEntry.CALLED_to_CANCELLED
          - entities.Guest.fields.no_show_count
        distinguishing_aspect: |
          Conserved quantity: Guest.no_show_count. A CALLED entry that is
          SEATED decrements no_show_count (redemption); a CALLED entry
          that is CANCELLED leaves no_show_count unchanged (no penalty).
          The invariant is that the guest's net no-show position is
          conserved across the two compensating actions.
        test_recipe:
          setup:
            - "Venue exists"
            - "Guest with no_show_count=1 (one prior expiry)"
            - "Two waitlist entries for the same guest, both CALLED"
          setup_api_calls:
            - call: "POST /api/venues"
              payload: { name: "Downtown", market_zip: "14201", capacity_seats: 200, wing_cost_cents_per_lb: 180 }
              as: PlatformAdmin
              captures: { venue_id: $.data.id }
            - call: "POST /api/guests"
              payload: { venue_id: "${venue_id}", name: "Alex", phone: "555-0100" }
              as: Host
              captures: { guest_id: $.data.id }
            - call: "POST /api/waitlist"
              payload: { venue_id: "${venue_id}", guest_id: "${guest_id}", party_size: 4 }
              as: Host
              captures: { entry_id: $.data.id }
            - call: "POST /api/waitlist/${entry_id}/call"
              payload: {}
              as: Host
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:16:00Z" }
              as: PlatformAdmin
            - call: "POST /api/waitlist/${entry_id}/cancel"
              payload: {}
              as: Host
            - call: "POST /api/waitlist"
              payload: { venue_id: "${venue_id}", guest_id: "${guest_id}", party_size: 4 }
              as: Host
              captures: { entry_id2: $.data.id }
            - call: "POST /api/waitlist/${entry_id2}/call"
              payload: {}
              as: Host
              captures: { entry_v2: $.data.version }
            - call: "POST /api/waitlist"
              payload: { venue_id: "${venue_id}", guest_id: "${guest_id}", party_size: 4 }
              as: Host
              captures: { entry_id3: $.data.id }
            - call: "POST /api/waitlist/${entry_id3}/call"
              payload: {}
              as: Host
          trigger:
            - call: "POST /api/waitlist/${entry_id2}/seat"
              payload: { expected_waitlist_entry_version: "${entry_v2}" }
              as: Host
              captures: { seat_result: $.data }
            - call: "POST /api/waitlist/${entry_id3}/cancel"
              payload: {}
              as: Host
            - call: "GET /api/guests/${guest_id}"
              payload: {}
              as: Host
              captures: { guest_after: $.data }
          assert:
            - "seat_result.status == SEATED"
            - "guest_after.no_show_count == 0"

      - name: fantasy_settle_prize_conservation
        grounds:
          - calculations.fantasy_payout
          - state_machines.FantasyContest.LOCKED_to_SETTLED
        distinguishing_aspect: |
          Conserved quantity: total prize pool. After settlement,
          sum(FantasyEntry.prize_cents) must equal gross - rake exactly;
          no cents are lost or created. The invariant is pinned as
          sum(prize_cents) == distributable.
        test_recipe:
          setup:
            - "Venue exists"
            - "FantasyContest OPEN with entry_fee_cents=2500, rake_pct=0.10, prize_structure=[0.5, 0.3, 0.2]"
            - "Three guests each with one entry"
          setup_api_calls:
            - call: "POST /api/venues"
              payload: { name: "Downtown", market_zip: "14201", capacity_seats: 200, wing_cost_cents_per_lb: 180 }
              as: PlatformAdmin
              captures: { venue_id: $.data.id }
            - call: "POST /api/guests"
              payload: { venue_id: "${venue_id}", name: "Alex", phone: "555-0100" }
              as: Host
              captures: { guest_a: $.data.id }
            - call: "POST /api/guests"
              payload: { venue_id: "${venue_id}", name: "Blair", phone: "555-0101" }
              as: Host
              captures: { guest_b: $.data.id }
            - call: "POST /api/guests"
              payload: { venue_id: "${venue_id}", name: "Casey", phone: "555-0102" }
              as: Host
              captures: { guest_c: $.data.id }
            - call: "POST /api/venues/${venue_id}/fantasy-contests"
              payload: { entry_fee_cents: 2500, rake_pct: 0.10, prize_structure: [0.5, 0.3, 0.2] }
              as: VenueManager
              captures: { contest_id: $.data.id }
            - call: "POST /api/fantasy-contests/${contest_id}/open"
              payload: {}
              as: VenueManager
            - call: "POST /api/fantasy-contests/${contest_id}/entries"
              payload: { guest_id: "${guest_a}", lineup: { qb: "Allen" } }
              as: Host
            - call: "POST /api/fantasy-contests/${contest_id}/entries"
              payload: { guest_id: "${guest_b}", lineup: { qb: "Mahomes" } }
              as: Host
            - call: "POST /api/fantasy-contests/${contest_id}/entries"
              payload: { guest_id: "${guest_c}", lineup: { qb: "Jackson" } }
              as: Host
            - call: "POST /api/fantasy-contests/${contest_id}/lock"
              payload: {}
              as: VenueManager
              captures: { contest_locked: $.data, contest_v: $.data.version }
          trigger:
            - call: "POST /api/fantasy-contests/${contest_id}/settle"
              payload: { expected_fantasy_contest_version: "${contest_v}" }
              as: VenueManager
              captures: { contest_settled: $.data }
            - call: "GET /api/fantasy-contests/${contest_id}/fantasy-entries"
              payload: {}
              as: VenueManager
              captures: { entries: $.data }
          assert:
            - "contest_settled.status == SETTLED"
            - "entries[0].prize_cents + entries[1].prize_cents + entries[2].prize_cents == 6750"
