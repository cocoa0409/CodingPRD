# =============================================================================
# §1.8 Scaffold Difficulty Design — Test Targeting Index
# Propane / Heating Oil Delivery (Expert)
# 9 rules x 2 instances = 18 instances
# =============================================================================
scaffold_difficulty_design:

  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: tank_projection_monitor_vs_degreeday_divergence
        grounds:
          - calculations.tank_reorder_projection
          - entities.Tank.fields.monitor_installed
          - entities.Tank.fields.reorder_status
          - entities.TankMonitorReading.fields.reading_gallons
          - entities.DegreeDayReading.fields.heating_degree_days
        distinguishing_aspect: |
          On the Tank domain, MONITOR_BASED anchors at the latest reading (380 gal at
          2026-01-03) and projects proj=200 (pct 40, OK), while DEGREE_DAY_ESTIMATE anchors
          at last_delivery (450 gal at 2026-01-01) and projects proj=90 (pct 18, DUE) for the
          SAME clock 2026-01-05 — same data, two variants, opposite reorder_status.
        test_recipe:
          setup:
            - "Account in region NE_01, PROPANE."
            - "Tank capacity 500, k_factor 1800 (milli-gal/HDD), reorder_threshold_pct 30, monitor_installed true, current_gallons 450, delivery_mode AUTOMATIC."
            - "last_delivery_at = 2026-01-01 (set via a prior DELIVERED order is unnecessary; tank created at clock 2026-01-01 with current 450 acts as the degree-day baseline anchor)."
            - "DegreeDayReadings NE_01: 2026-01-01..2026-01-04 each 50 HDD."
            - "Monitor reading 380 gal at 2026-01-03."
            - "Clock advanced to 2026-01-05; evaluate-reorder runs MONITOR_BASED because a monitor reading exists after the baseline."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: Dispatcher
            - call: "POST /accounts"
              payload: { customer_name: "Frost House", region_code: "NE_01", fuel_type: "PROPANE" }
              as: AccountManager
              captures: { acct_id: $.data.id }
            - call: "POST /accounts/${acct_id}/tanks"
              payload: { capacity_gallons: 500, k_factor: 1800, reorder_threshold_pct: 30, delivery_mode: "AUTOMATIC", monitor_installed: true, current_gallons: 450 }
              as: AccountManager
              captures: { tank_id: $.data.id }
            - call: "POST /degree-day-readings"
              payload: { region_code: "NE_01", reading_date: "2026-01-01T00:00:00Z", heating_degree_days: 50 }
              as: Dispatcher
            - call: "POST /degree-day-readings"
              payload: { region_code: "NE_01", reading_date: "2026-01-02T00:00:00Z", heating_degree_days: 50 }
              as: Dispatcher
            - call: "POST /degree-day-readings"
              payload: { region_code: "NE_01", reading_date: "2026-01-03T00:00:00Z", heating_degree_days: 50 }
              as: Dispatcher
            - call: "POST /degree-day-readings"
              payload: { region_code: "NE_01", reading_date: "2026-01-04T00:00:00Z", heating_degree_days: 50 }
              as: Dispatcher
            - call: "POST /tanks/${tank_id}/readings"
              payload: { reading_gallons: 380, read_at: "2026-01-03T00:00:00Z" }
              as: Driver
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-05T00:00:00Z" }
              as: Dispatcher
          trigger:
            - call: "POST /tanks/${tank_id}/evaluate-reorder"
              payload: {}
              as: Dispatcher
              captures: { reorder_status_monitor: $.data.reorder_status, current_after: $.data.current_gallons }
          assert:
            - "Tank.${tank_id}.reorder_status == OK   # MONITOR_BASED proj 200 (pct 40) wins because monitor reading 380@2026-01-03 is after baseline"
            - "DEGREE_DAY_ESTIMATE on the identical clock would have yielded proj 90 (pct 18, DUE); the two variants diverge"

      - name: budget_reconcile_provisional_vs_final_ledger
        grounds:
          - calculations.budget_reconciliation
          - state_machines.BudgetPlan.ACTIVE_to_RECONCILED
          - entities.BudgetPlan.fields.settlement_balance_cents
          - entities.Account.fields.credit_balance_cents
        distinguishing_aspect: |
          On the BudgetPlan domain (distinct from the Tank domain of the other instance),
          identical history (4 installments of 30000 + one delivery total 61500) leaves
          PROVISIONAL credit_balance_cents=58500 (running ledger keeps the settlement) but
          FINAL (reconcile refunds settlement out) leaves credit_balance_cents=0.
        test_recipe:
          setup:
            - "Account NE_01 PROPANE with ACTIVE FIXED plan locked_price 300."
            - "Tank capacity 500, current 100, PASSED inspection, IN_SERVICE."
            - "BudgetPlan estimated_annual_gallons 1200, estimated_price 300 => monthly_installment 30000."
            - "4 installments posted (funded 120000); one DELIVERED order: 200 gal STANDARD WILL_CALL on FIXED price 295 => total 61500; actual_cost_to_date 61500; settlement 58500."
          setup_api_calls:
            - call: "POST /accounts"
              payload: { customer_name: "Budget Bob", region_code: "NE_01", fuel_type: "PROPANE" }
              as: AccountManager
              captures: { acct_id: $.data.id }
            - call: "POST /accounts/${acct_id}/price-plans"
              payload: { plan_type: "FIXED", locked_price_cents_per_gallon: 300 }
              as: AccountManager
              captures: { plan_id: $.data.id }
            - call: "POST /accounts/${acct_id}/price-plans/${plan_id}/activate"
              payload: {}
              as: AccountManager
            - call: "POST /accounts/${acct_id}/tanks"
              payload: { capacity_gallons: 500, k_factor: 1500, current_gallons: 100 }
              as: AccountManager
              captures: { tank_id: $.data.id }
            - call: "POST /tanks/${tank_id}/inspections"
              payload: { result: "PASSED", inspected_at: "2026-01-01T00:00:00Z" }
              as: Inspector
            - call: "POST /accounts/${acct_id}/budget-plans"
              payload: { plan_year_start: "2026-01-01T00:00:00Z", estimated_annual_gallons: 1200, estimated_price_cents_per_gallon: 300 }
              as: AccountManager
              captures: { bp_id: $.data.id }
            - call: "POST /accounts/${acct_id}/budget-plans/${bp_id}/post-installment"
              payload: {}
              as: AccountManager
            - call: "POST /accounts/${acct_id}/budget-plans/${bp_id}/post-installment"
              payload: {}
              as: AccountManager
            - call: "POST /accounts/${acct_id}/budget-plans/${bp_id}/post-installment"
              payload: {}
              as: AccountManager
            - call: "POST /accounts/${acct_id}/budget-plans/${bp_id}/post-installment"
              payload: {}
              as: AccountManager
            - call: "POST /trucks"
              payload: { region_code: "NE_01", daily_capacity_gallons: 1000 }
              as: Dispatcher
              captures: { truck_id: $.data.id }
            - call: "POST /trucks/${truck_id}/routes"
              payload: { route_date: "2026-02-01T00:00:00Z", window_start: "2026-02-01T09:00:00Z", window_end: "2026-02-01T12:00:00Z" }
              as: Dispatcher
              captures: { route_id: $.data.id }
            - call: "POST /accounts/${acct_id}/delivery-orders"
              payload: { tank_id: "${tank_id}", requested_gallons: 200 }
              as: Dispatcher
              captures: { order_id: $.data.id }
            - call: "POST /accounts/${acct_id}/delivery-orders/${order_id}/assign"
              payload: { route_id: "${route_id}" }
              as: Dispatcher
            - call: "POST /trucks/${truck_id}/routes/${route_id}/dispatch"
              payload: {}
              as: Dispatcher
            - call: "GET /accounts/${acct_id}"
              payload: {}
              as: AccountManager
              captures: { acct_v: $.data.version }
            - call: "POST /accounts/${acct_id}/delivery-orders/${order_id}/deliver"
              payload: { delivered_gallons: 200, expected_account_version: "${acct_v}" }
              as: Driver
            - call: "GET /accounts/${acct_id}"
              payload: {}
              as: AccountManager
              captures: { credit_before_reconcile: $.data.credit_balance_cents }
          trigger:
            - call: "POST /accounts/${acct_id}/budget-plans/${bp_id}/reconcile"
              payload: {}
              as: AccountManager
              captures: { settlement: $.data.settlement_balance_cents }
          assert:
            - "credit_before_reconcile == 58500   # PROVISIONAL running ledger: +120000 -61500"
            - "BudgetPlan.${bp_id}.settlement_balance_cents == 58500"
            - "Account.${acct_id}.credit_balance_cents == 0   # FINAL refunds settlement out: 58500 - 58500"
            - "BudgetPlan.${bp_id}.status == RECONCILED"

  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: delivery_price_cap_min_plus_volume_tier
        grounds:
          - calculations.delivery_price
          - entities.PricePlan.fields.plan_type
          - entities.PricePlan.fields.cap_price_cents_per_gallon
          - entities.MarketPrice.fields.market_price_cents_per_gallon
          - state_machines.DeliveryOrder.SCHEDULED_to_DELIVERED
        distinguishing_aspect: |
          Mode (a): >=3 inputs (plan_type, cap vs market, delivered_gallons) with nested
          min/max and conditional branch — CAP base = min(cap 300, market 350)=300, then
          volume tier1 (200>=150) subtracts 5 => 295, floored at 50.
        test_recipe:
          setup:
            - "Account NE_01 PROPANE with ACTIVE CAP plan cap_price 300; ACTIVE MarketPrice NE_01/PROPANE 350."
            - "Tank capacity 600 current 100, PASSED inspection, IN_SERVICE; order 200 gal STANDARD on a DISPATCHED route."
          setup_api_calls:
            - call: "POST /market-prices"
              payload: { region_code: "NE_01", fuel_type: "PROPANE", market_price_cents_per_gallon: 350 }
              as: AccountManager
            - call: "POST /accounts"
              payload: { customer_name: "Cap Carla", region_code: "NE_01", fuel_type: "PROPANE" }
              as: AccountManager
              captures: { acct_id: $.data.id }
            - call: "POST /accounts/${acct_id}/price-plans"
              payload: { plan_type: "CAP", cap_price_cents_per_gallon: 300 }
              as: AccountManager
              captures: { plan_id: $.data.id }
            - call: "POST /accounts/${acct_id}/price-plans/${plan_id}/activate"
              payload: {}
              as: AccountManager
            - call: "POST /accounts/${acct_id}/tanks"
              payload: { capacity_gallons: 600, k_factor: 1500, current_gallons: 100 }
              as: AccountManager
              captures: { tank_id: $.data.id }
            - call: "POST /tanks/${tank_id}/inspections"
              payload: { result: "PASSED", inspected_at: "2026-01-01T00:00:00Z" }
              as: Inspector
            - call: "POST /trucks"
              payload: { region_code: "NE_01", daily_capacity_gallons: 1000 }
              as: Dispatcher
              captures: { truck_id: $.data.id }
            - call: "POST /trucks/${truck_id}/routes"
              payload: { route_date: "2026-02-01T00:00:00Z", window_start: "2026-02-01T09:00:00Z", window_end: "2026-02-01T12:00:00Z" }
              as: Dispatcher
              captures: { route_id: $.data.id }
            - call: "POST /accounts/${acct_id}/delivery-orders"
              payload: { tank_id: "${tank_id}", requested_gallons: 200 }
              as: Dispatcher
              captures: { order_id: $.data.id }
            - call: "POST /accounts/${acct_id}/delivery-orders/${order_id}/assign"
              payload: { route_id: "${route_id}" }
              as: Dispatcher
            - call: "POST /trucks/${truck_id}/routes/${route_id}/dispatch"
              payload: {}
              as: Dispatcher
            - call: "GET /accounts/${acct_id}"
              payload: {}
              as: AccountManager
              captures: { acct_v: $.data.version }
          trigger:
            - call: "POST /accounts/${acct_id}/delivery-orders/${order_id}/deliver"
              payload: { delivered_gallons: 200, expected_account_version: "${acct_v}" }
              as: Driver
              captures: { ppg: $.data.price_cents_per_gallon, total: $.data.invoice_total_cents }
          assert:
            - "DeliveryOrder.${order_id}.price_cents_per_gallon == 295   # min(300,350)=300 minus tier1 5"
            - "DeliveryOrder.${order_id}.invoice_total_cents == 61500   # 200*295=59000 + off_route 2500"

      - name: invoice_total_emergency_surcharge_perline_rounding
        grounds:
          - calculations.invoice_total
          - entities.DeliveryOrder.fields.priority
          - entities.DeliveryOrder.fields.invoice_total_cents
          - state_machines.DeliveryOrder.SCHEDULED_to_DELIVERED
        distinguishing_aspect: |
          Mode (b): rounding ORDER is pinned — the EMERGENCY surcharge is round_half_up on its
          OWN line (fuel 98560 * 10% = 9856) and only then summed with fuel + off_route fee:
          98560 + 9856 + 2500 = 110916, distinct from rounding the grand total.
        test_recipe:
          setup:
            - "Account NE_01 PROPANE with ACTIVE FIXED plan locked_price 320."
            - "Tank capacity 700 current 100, PASSED inspection; EMERGENCY will-call order 320 gal on a DISPATCHED route."
          setup_api_calls:
            - call: "POST /accounts"
              payload: { customer_name: "Emergency Em", region_code: "NE_01", fuel_type: "PROPANE" }
              as: AccountManager
              captures: { acct_id: $.data.id }
            - call: "POST /accounts/${acct_id}/price-plans"
              payload: { plan_type: "FIXED", locked_price_cents_per_gallon: 320 }
              as: AccountManager
              captures: { plan_id: $.data.id }
            - call: "POST /accounts/${acct_id}/price-plans/${plan_id}/activate"
              payload: {}
              as: AccountManager
            - call: "POST /accounts/${acct_id}/tanks"
              payload: { capacity_gallons: 700, k_factor: 1500, current_gallons: 100 }
              as: AccountManager
              captures: { tank_id: $.data.id }
            - call: "POST /tanks/${tank_id}/inspections"
              payload: { result: "PASSED", inspected_at: "2026-01-01T00:00:00Z" }
              as: Inspector
            - call: "POST /trucks"
              payload: { region_code: "NE_01", daily_capacity_gallons: 1000 }
              as: Dispatcher
              captures: { truck_id: $.data.id }
            - call: "POST /trucks/${truck_id}/routes"
              payload: { route_date: "2026-02-02T00:00:00Z", window_start: "2026-02-02T09:00:00Z", window_end: "2026-02-02T12:00:00Z" }
              as: Dispatcher
              captures: { route_id: $.data.id }
            - call: "POST /accounts/${acct_id}/delivery-orders"
              payload: { tank_id: "${tank_id}", requested_gallons: 320, priority: "EMERGENCY" }
              as: Dispatcher
              captures: { order_id: $.data.id }
            - call: "POST /accounts/${acct_id}/delivery-orders/${order_id}/assign"
              payload: { route_id: "${route_id}" }
              as: Dispatcher
            - call: "POST /trucks/${truck_id}/routes/${route_id}/dispatch"
              payload: {}
              as: Dispatcher
            - call: "GET /accounts/${acct_id}"
              payload: {}
              as: AccountManager
              captures: { acct_v: $.data.version }
          trigger:
            - call: "POST /accounts/${acct_id}/delivery-orders/${order_id}/deliver"
              payload: { delivered_gallons: 320, expected_account_version: "${acct_v}" }
              as: Driver
              captures: { total: $.data.invoice_total_cents, ppg: $.data.price_cents_per_gallon }
          assert:
            - "DeliveryOrder.${order_id}.price_cents_per_gallon == 308   # 320 minus tier2 12 (320>=300)"
            - "DeliveryOrder.${order_id}.invoice_total_cents == 110916   # 98560 fuel + 9856 surcharge(per-line) + 2500 off_route"

  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: delivery_order_hold_resume_cycle
        grounds:
          - state_machines.DeliveryOrder.SCHEDULED_to_HOLD
          - state_machines.DeliveryOrder.HOLD_to_SCHEDULED
          - entities.DeliveryOrder.fields.status
          - entities.DeliveryRoute.fields.reserved_gallons
        distinguishing_aspect: |
          DeliveryOrder is cyclic: SCHEDULED->HOLD->SCHEDULED returns to a previously visited
          state, with reserved_gallons released on HOLD (200->0) and re-reserved on resume
          (0->200) — a true cycle, not a linear pipeline.
        test_recipe:
          setup:
            - "Account NE_01 with PASSED IN_SERVICE tank; will-call order 200 gal SCHEDULED on a PLANNING route; route.reserved_gallons 200."
          setup_api_calls:
            - call: "POST /accounts"
              payload: { customer_name: "Cycle Cyn", region_code: "NE_01", fuel_type: "PROPANE" }
              as: AccountManager
              captures: { acct_id: $.data.id }
            - call: "POST /accounts/${acct_id}/tanks"
              payload: { capacity_gallons: 500, k_factor: 1500, current_gallons: 100 }
              as: AccountManager
              captures: { tank_id: $.data.id }
            - call: "POST /tanks/${tank_id}/inspections"
              payload: { result: "PASSED", inspected_at: "2026-01-01T00:00:00Z" }
              as: Inspector
            - call: "POST /trucks"
              payload: { region_code: "NE_01", daily_capacity_gallons: 1000 }
              as: Dispatcher
              captures: { truck_id: $.data.id }
            - call: "POST /trucks/${truck_id}/routes"
              payload: { route_date: "2026-02-03T00:00:00Z", window_start: "2026-02-03T09:00:00Z", window_end: "2026-02-03T12:00:00Z" }
              as: Dispatcher
              captures: { route_id: $.data.id }
            - call: "POST /accounts/${acct_id}/delivery-orders"
              payload: { tank_id: "${tank_id}", requested_gallons: 200 }
              as: Dispatcher
              captures: { order_id: $.data.id }
            - call: "POST /accounts/${acct_id}/delivery-orders/${order_id}/assign"
              payload: { route_id: "${route_id}" }
              as: Dispatcher
            - call: "POST /accounts/${acct_id}/delivery-orders/${order_id}/hold"
              payload: {}
              as: Dispatcher
              captures: { status_hold: $.data.status }
          trigger:
            - call: "POST /accounts/${acct_id}/delivery-orders/${order_id}/resume"
              payload: {}
              as: Dispatcher
              captures: { status_resume: $.data.status }
            - call: "GET /routes/${route_id}"
              payload: {}
              as: Dispatcher
              captures: { reserved_after: $.data.reserved_gallons }
          assert:
            - "status_hold == HOLD"
            - "DeliveryOrder.${order_id}.status == SCHEDULED   # cycled back"
            - "DeliveryRoute.${route_id}.reserved_gallons == 200   # released to 0 on HOLD then re-reserved on resume"

      - name: tank_parallel_service_and_reorder_dimensions
        grounds:
          - state_machines.Tank.IN_SERVICE_to_LOCKED_OUT
          - entities.Tank.fields.service_status
          - entities.Tank.fields.reorder_status
          - calculations.tank_reorder_projection
        distinguishing_aspect: |
          Tank carries two INDEPENDENT state dimensions: a FAILED inspection moves
          service_status IN_SERVICE->LOCKED_OUT while reorder_status (computed) stays DUE —
          the two axes evolve independently on the same row (parallel, not linear).
        test_recipe:
          setup:
            - "Tank NE_01 capacity 500 k_factor 1800 reorder_threshold 30 monitor false current 100 (so reorder projection is DUE), IN_SERVICE."
            - "A degree-day reading drives reorder DUE; clock at 2026-01-02."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: Dispatcher
            - call: "POST /accounts"
              payload: { customer_name: "Parallel Pat", region_code: "NE_01", fuel_type: "PROPANE" }
              as: AccountManager
              captures: { acct_id: $.data.id }
            - call: "POST /accounts/${acct_id}/tanks"
              payload: { capacity_gallons: 500, k_factor: 1800, reorder_threshold_pct: 30, monitor_installed: false, current_gallons: 100 }
              as: AccountManager
              captures: { tank_id: $.data.id }
            - call: "POST /degree-day-readings"
              payload: { region_code: "NE_01", reading_date: "2026-01-01T00:00:00Z", heating_degree_days: 10 }
              as: Dispatcher
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-02T00:00:00Z" }
              as: Dispatcher
            - call: "POST /tanks/${tank_id}/evaluate-reorder"
              payload: {}
              as: Dispatcher
              captures: { reorder_before: $.data.reorder_status }
          trigger:
            - call: "POST /tanks/${tank_id}/inspections"
              payload: { result: "FAILED", inspected_at: "2026-01-02T00:00:00Z" }
              as: Inspector
              captures: { svc_after: $.data.result }
            - call: "GET /tanks/${tank_id}"
              payload: {}
              as: Dispatcher
              captures: { svc_status: $.data.service_status, reorder_status: $.data.reorder_status }
          assert:
            - "reorder_before == DUE   # current 100 of 500 = pct 20 already below threshold"
            - "Tank.${tank_id}.service_status == LOCKED_OUT   # FAILED inspection moved the service dimension"
            - "Tank.${tank_id}.reorder_status == DUE   # reorder dimension unchanged by the service-dimension move"

  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: deliver_cascade_tank_reorder_then_budget_ledger
        grounds:
          - state_machines.DeliveryOrder.SCHEDULED_to_DELIVERED
          - entities.Tank.fields.current_gallons
          - entities.Tank.fields.reorder_status
          - entities.BudgetPlan.fields.actual_cost_to_date_cents
          - entities.Account.fields.credit_balance_cents
        distinguishing_aspect: |
          Depth-3 chain from deliver: (A) order DELIVERED -> (B) Tank.current_gallons += 200
          -> (C) that level change recomputes Tank.reorder_status DUE->OK -> (D) the same
          delivery debits Account.credit and advances the linked BudgetPlan.actual_cost_to_date
          and settlement. Each link is caused by the prior link.
        test_recipe:
          setup:
            - "Account NE_01 PROPANE ACTIVE FIXED plan 300; tank capacity 500 current 100 (reorder DUE), PASSED, on budget plan monthly 30000 with 2 installments funded."
            - "Order 200 gal STANDARD will-call on a DISPATCHED route."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-10T00:00:00Z" }
              as: Dispatcher
            - call: "POST /accounts"
              payload: { customer_name: "Cascade Cara", region_code: "NE_01", fuel_type: "PROPANE" }
              as: AccountManager
              captures: { acct_id: $.data.id }
            - call: "POST /accounts/${acct_id}/price-plans"
              payload: { plan_type: "FIXED", locked_price_cents_per_gallon: 300 }
              as: AccountManager
              captures: { plan_id: $.data.id }
            - call: "POST /accounts/${acct_id}/price-plans/${plan_id}/activate"
              payload: {}
              as: AccountManager
            - call: "POST /accounts/${acct_id}/tanks"
              payload: { capacity_gallons: 500, k_factor: 1500, reorder_threshold_pct: 30, current_gallons: 100 }
              as: AccountManager
              captures: { tank_id: $.data.id }
            - call: "POST /tanks/${tank_id}/inspections"
              payload: { result: "PASSED", inspected_at: "2026-01-10T00:00:00Z" }
              as: Inspector
            - call: "POST /tanks/${tank_id}/evaluate-reorder"
              payload: {}
              as: Dispatcher
              captures: { reorder_before: $.data.reorder_status }
            - call: "POST /accounts/${acct_id}/budget-plans"
              payload: { plan_year_start: "2026-01-01T00:00:00Z", estimated_annual_gallons: 1200, estimated_price_cents_per_gallon: 300 }
              as: AccountManager
              captures: { bp_id: $.data.id }
            - call: "POST /accounts/${acct_id}/budget-plans/${bp_id}/post-installment"
              payload: {}
              as: AccountManager
            - call: "POST /accounts/${acct_id}/budget-plans/${bp_id}/post-installment"
              payload: {}
              as: AccountManager
            - call: "POST /trucks"
              payload: { region_code: "NE_01", daily_capacity_gallons: 1000 }
              as: Dispatcher
