          assert:
            - "${pv_status} == IN_PROGRESS"
            - "${attempts} == 0"
            - "first trigger HTTP status == 422"
            - "${err_runs} == ERR_MIN_TEST_RUNS_NOT_MET"
            - "after the first trigger PerformanceValidation.${pv_id}.attempt_count == 0"
            - "third trigger HTTP status == 200"
            - "${st} == PASSED"
            - "${certified} == 66.06"
            - "${attempts_after} == 1"
            - "fourth trigger HTTP status == 409"
            - "${err_replay} == ERR_VALIDATION_STATE_INVALID"
            - "PerformanceValidation.${pv_id}.attempt_count == 1"

      - name: retest_loop_is_capped_at_three_attempts
        claim_type: cyclic
        grounds:
          - validations[priority=41]
          - errors[ERR_RETEST_LIMIT_EXCEEDED]
