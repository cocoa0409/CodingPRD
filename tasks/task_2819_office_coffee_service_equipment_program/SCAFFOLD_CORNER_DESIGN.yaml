            - "InvoiceLine.${product_line_id}.credits_applied_cents == 1000 and its own target_line_id is null"
            - "ConsolidatedInvoice.${inv_id}.invoice_status == PARTIALLY_CREDITED, total_cents == 10500 and line_count == 3"
