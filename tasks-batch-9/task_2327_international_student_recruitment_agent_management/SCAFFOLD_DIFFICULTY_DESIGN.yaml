            - "StudentApplication.${a1_id}.tier_snapshot_at_submission == \"PLATINUM\""
            - "StudentApplication.${a1_id}.projected_commission_cents == 484971"
            - "PerformanceScorecard.${sc_watch_id}.submitted_count == 1 and PerformanceScorecard.${sc_watch_id}.yield_rate == 0.0000 and PerformanceScorecard.${sc_watch_id}.composite_score == 0.2000 and PerformanceScorecard.${sc_watch_id}.tier == \"WATCH\""
            - "Agency.${ag1_id}.compliance_posture == \"WATCH\" (posture_action_applied == \"ESCALATED_TO_WATCH\" on the second scorecard)"
            - "CommissionEntry(application_id=${a1_id}, kind=ACCRUAL, milestone=DEPOSIT_PAID).tier_snapshot == \"WATCH\""
            - "CommissionEntry(application_id=${a1_id}, kind=ACCRUAL, milestone=DEPOSIT_PAID).effective_bps == 300"
            - "CommissionEntry(application_id=${a1_id}, kind=ACCRUAL, milestone=DEPOSIT_PAID).amount_cents == 85371"
            - "StudentApplication.${a1_id}.net_commission_cents == 85371"
            - "GET /recruitment/applications/${a1_id}/commission-projection returns provisional_projection_cents == 484971, final_net_cents == 85371, variant_delta_cents == 399600, tier_snapshot_at_submission == \"PLATINUM\", accrued_entry_count == 1, clawback_entry_count == 0"
            - "StudentApplication.${a1_id}.projected_commission_cents is still 484971 after the accrual (the provisional variant is frozen, never recomputed)"

      - name: agency_risk_rolling_versus_lifetime_band_divergence
        grounds:
          - calculations.agency_integrity_risk_score
          - entities.Agency.fields.rolling_risk_score
          - entities.Agency.fields.lifetime_risk_score
          - state_machines.Agency.GOOD_STANDING_to_WATCH
          - endpoints["GET /recruitment/agencies/{id}/risk-profile"]
        distinguishing_aspect: |
          Non-monetary variant pair on a different entity: over three CONFIRMED incidents the
          rolling_365d variant scores 55.00 (the 440-day-old MEDIUM incident is outside the
          window and the 280-day-old CRITICAL incident decays to 0.50) while the
          lifetime_cumulative variant scores 95.00, and because only the rolling variant
          drives the posture bands the agency lands on WATCH instead of the SUSPENDED band
          that the lifetime value alone would imply.
        test_recipe:
          setup:
            - "Agency ag1 exists; no applications and no documents, so the fraud-rate term of the score is exactly 0."
            - "Logical clock is at 2027-01-15T00:00:00Z."
            - "Three REPORTED incidents exist: HIGH occurred_on 2026-12-20 (26 days old), CRITICAL occurred_on 2026-04-10 (280 days old), MEDIUM occurred_on 2025-11-01 (440 days old)."
          setup_api_calls:
            - call: "POST /recruitment/agencies"
              payload: { legal_name: "Meridian Study Abroad", home_country_code: "VN", ownership_disclosed: true, beneficial_owner_count: 1, sanctions_screen_passed: true, reference_check_count: 2 }
              as: RecruitmentOfficer
              as_user_id: "officer-1"
              captures: { ag1_id: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-01-15T00:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "compliance-1"
            - call: "POST /recruitment/integrity-incidents"
              payload: { agency_id: "${ag1_id}", category: "MISREPRESENTATION", severity: "HIGH", occurred_on: "2026-12-20", source: "AUDIT" }
              as: ComplianceOfficer
              as_user_id: "compliance-1"
              captures: { inc_high_id: "$.data.id" }
            - call: "POST /recruitment/integrity-incidents"
              payload: { agency_id: "${ag1_id}", category: "DISCLOSURE_FAILURE", severity: "CRITICAL", occurred_on: "2026-04-10", source: "STUDENT_COMPLAINT" }
              as: ComplianceOfficer
              as_user_id: "compliance-1"
              captures: { inc_crit_id: "$.data.id" }
            - call: "POST /recruitment/integrity-incidents"
              payload: { agency_id: "${ag1_id}", category: "MISREPRESENTATION", severity: "MEDIUM", occurred_on: "2025-11-01", source: "PARTNER_REPORT" }
              as: ComplianceOfficer
              as_user_id: "compliance-1"
              captures: { inc_med_id: "$.data.id" }
          trigger:
            - call: "POST /recruitment/integrity-incidents/${inc_high_id}/resolution"
              payload: { outcome: "CONFIRM" }
              as: ComplianceOfficer
              as_user_id: "compliance-1"
            - call: "POST /recruitment/integrity-incidents/${inc_crit_id}/resolution"
              payload: { outcome: "CONFIRM" }
              as: ComplianceOfficer
              as_user_id: "compliance-1"
            - call: "POST /recruitment/integrity-incidents/${inc_med_id}/resolution"
              payload: { outcome: "CONFIRM" }
              as: ComplianceOfficer
              as_user_id: "compliance-1"
            - call: "GET /recruitment/agencies/${ag1_id}/risk-profile"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "compliance-1"
          assert:
            - "Agency.${ag1_id}.rolling_risk_score == 55.00"
            - "Agency.${ag1_id}.lifetime_risk_score == 95.00"
            - "Agency.${ag1_id}.confirmed_incident_count == 3"
            - "GET /recruitment/agencies/${ag1_id}/risk-profile returns rolling_risk_score == 55.00, lifetime_risk_score == 95.00, lifetime_minus_rolling_delta == 40.00, confirmed_incident_count == 3, reviewed_document_count == 0, confirmed_fraud_document_count == 0, posture_band == \"WATCH\""
            - "Agency.${ag1_id}.compliance_posture == \"WATCH\" (the 85.00 SUSPENDED band is NOT applied even though lifetime_risk_score is 95.00)"
            - "Agency.${ag1_id}.vetting_state == \"DRAFT\" (the posture dimension moved without touching the due-diligence dimension)"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: platinum_accrual_rate_cap_and_cent_cap_interaction
        grounds:
          - calculations.milestone_commission_amount
          - calculations.tier_multiplier_resolution
          - entities.CommissionSchedule.fields.rate_cap_bps
          - entities.CommissionSchedule.fields.per_milestone_cap_cents
          - entities.Program.fields.max_commission_bps
          - entities.CommissionEntry.fields.effective_bps
        distinguishing_aspect: |
          Mode (a) - three interacting clamps in one formula: the PLATINUM +150 bps bonus is
          absorbed for the DEPOSIT_PAID milestone (550 bps survives, then the 150000-cent cap
          bites on 156514) but truncated for ENROLLED (650 bps clipped to rate_cap 600, whose
          170742 is then clipped again by the cent cap), while CENSUS_CONFIRMED (350 bps)
          exercises neither clamp and only the half-up rounding of 99599.5, producing
          150000/150000/99600/85371 = 484971.
        test_recipe:
          setup:
            - "Same agency/contract/rate-card/territory/certification fixture as the PLATINUM history cohort: rate card 400/500/200/150 bps, rate_cap_bps 600, per_milestone_cap_cents 150000, program max_commission_bps 1000."
