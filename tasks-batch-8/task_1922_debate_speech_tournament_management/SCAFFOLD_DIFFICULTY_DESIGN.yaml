            - { call: "POST /divisions", payload: { tournament_id: "${t}", event_type: "DEBATE", event_code: "CX", division: "VARSITY" }, as: TournamentDirector, captures: { d_cx: $.data.id } }
            - { call: "POST /divisions", payload: { tournament_id: "${t}", event_type: "DEBATE", event_code: "LD", division: "VARSITY" }, as: TournamentDirector, captures: { d_ld: $.data.id } }
            - { call: "POST /schools", payload: { tournament_id: "${t}", name: "Alpha" }, as: TournamentDirector, captures: { s_a: $.data.id } }
            - { call: "POST /schools", payload: { tournament_id: "${t}", name: "Beta" }, as: TournamentDirector, captures: { s_b: $.data.id } }
            - { call: "POST /schools", payload: { tournament_id: "${t}", name: "Gamma" }, as: TournamentDirector, captures: { s_c: $.data.id } }
            - { call: "POST /tournaments/${t}/open-registration", as: TournamentDirector }
            - { call: "POST /entries", payload: { school_id: "${s_a}", division_id: "${d_cx}", competitor_name: "A-One" }, as: SchoolCoach, as_user_id: "${s_a}", captures: { e_a1: $.data.id } }
            - { call: "POST /entries/${e_a1}/confirm", as: SchoolCoach, as_user_id: "${s_a}" }
            - { call: "POST /entries", payload: { school_id: "${s_b}", division_id: "${d_cx}", competitor_name: "B-One" }, as: SchoolCoach, as_user_id: "${s_b}", captures: { e_b1: $.data.id } }
            - { call: "POST /entries/${e_b1}/confirm", as: SchoolCoach, as_user_id: "${s_b}" }
            - { call: "POST /entries", payload: { school_id: "${s_b}", division_id: "${d_ld}", competitor_name: "B-Two" }, as: SchoolCoach, as_user_id: "${s_b}", captures: { e_b2: $.data.id } }
