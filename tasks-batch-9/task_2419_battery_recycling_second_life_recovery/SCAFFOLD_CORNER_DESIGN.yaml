            - "${st_variant} == FINAL, ${st_var0} == 18.00 and ${st_round0} == 0 before the cycle starts"
            - "Round 1: ${r1_state} == DISPUTED with ${r1_round} == 1, and after apply-umpire ${a1_state} == DRAFT, ${a1_posted} == 0 and ${a1_var} == 17.00 (umpire 29.000 kg over 100.0 kg against a declared 12.0)"
            - "${a1_round} == 1 - returning to DRAFT does NOT reset the dispute counter"
            - "Round 2 reaches ${r2_round} == 2 and its apply-umpire yields ${a2_var} == 16.00; round 3 reaches ${r3_round} == 3 and its apply-umpire yields ${a3_var} == 15.00 with ${a3_state} == DRAFT"
            - "${p4_state} == POSTED - the fourth post is legal because the state is DRAFT again"
            - "The fourth dispute returns HTTP 409 with data.error_id == ERR_DISPUTE_ROUNDS_EXHAUSTED, not ERR_VARIANCE_WITHIN_TOLERANCE, because 15.00 is still above tolerance and only the round limit is violated"
            - "SupplierSettlement.${st_id}.state is still POSTED with dispute_round == 3, and Supplier.${sup_id}.payable_balance_cents equals the last posted_amount_cents exactly once, satisfying supplier_obligation_invariant"

