# =============================================================================
# §1.8 Scaffold Difficulty Design — Test Targeting Index
# Sugar Crop Receiving Station & Cooperative Payment
# 9 rules x 2 instances = 18 instances. Every instance grounds in SCAFFOLD.yaml
# §1.1–§1.7 and drives empty-DB state purely through §1.5 endpoints.
# =============================================================================

scaffold_difficulty_design:
  # ---------------------------------------------------------------------------
  # Rule 1 — dual_variant_calc (different entity domains: LoadTicket vs StoragePile)
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: ticket_payment_factor_provisional_vs_final
        grounds:
          - calculations.payment_factor
          - calculations.net_weight_and_trash_deduction
          - calculations.provisional_value
          - entities.LoadTicket.fields.provisional_factor
          - entities.LoadTicket.fields.final_factor
        distinguishing_aspect: |
          Same load, two valid algorithms on the LoadTicket domain: PROVISIONAL uses the
          STATION_QUICK sample (sugar 16.50) with clamp -> factor 1.0200 and adjusted 23.6400 t;
          FINAL uses the VERIFIED LAB_VERIFY sample (sugar 16.10) unclamped -> factor 1.0040 and
          adjusted 23.6640 t. Same gross/tare, different observable payment basis.
        test_recipe:
          setup:
            - "Campaign (window 2026-09-15..2026-11-20, base 5500) with auto-created pool"
            - "Member M1 (haul 22.5), station (cap 1000), pile P1 (cap 200), booking B1 CONFIRMED for slot 2026-10-01T08:00:00Z-10:00:00Z"
            - "Ticket T1 weighed 80000/32000 at clock 2026-10-01T08:30:00Z; STATION_QUICK sample recorded 16.50/4.50 (ticket SAMPLED, provisional computed)"
            - "LAB_VERIFY sample recorded 16.10/4.40 by qt-alice and verified by qt-bob"
          setup_api_calls:
            - { call: "POST /api/campaigns", payload: { name: "C-1", window_start: "2026-09-15T00:00:00Z", window_end: "2026-11-20T00:00:00Z", base_price_cents_per_ton: 5500 }, as: COOP_ADMIN, captures: { camp_id: $.data.id } }
            - { call: "POST /api/members", payload: { name: "M1", member_code: "M-1001", haul_distance_miles: 22.5 }, as: COOP_ADMIN, captures: { m1_id: $.data.id } }
            - { call: "POST /api/stations", payload: { name: "ST", booking_capacity_tons: 1000 }, as: COOP_ADMIN, captures: { st_id: $.data.id } }
            - { call: "POST /api/piles", payload: { station_id: "${st_id}", capacity_tons: 200 }, as: STATION_OPERATOR, captures: { pile_id: $.data.id } }
            - { call: "POST /api/bookings", payload: { campaign_id: "${camp_id}", station_id: "${st_id}", slot_start: "2026-10-01T08:00:00Z", slot_end: "2026-10-01T10:00:00Z", estimated_tons: 30 }, as: MEMBER, as_user_id: "${m1_id}", captures: { b1_id: $.data.id } }
            - { call: "POST /api/bookings/${b1_id}/confirm", as: SCHEDULER }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-10-01T08:30:00Z" }, as: COOP_ADMIN }
            - { call: "POST /api/tickets", payload: { booking_id: "${b1_id}" }, as: STATION_OPERATOR, captures: { t1_id: $.data.id } }
            - { call: "POST /api/tickets/${t1_id}/weigh", payload: { gross_weight_lbs: 80000, tare_weight_lbs: 32000 }, as: STATION_OPERATOR }
            - { call: "POST /api/samples", payload: { ticket_id: "${t1_id}", sample_type: "STATION_QUICK" }, as: QUALITY_TECH, captures: { qs_id: $.data.id } }
            - { call: "POST /api/samples/${qs_id}/record-result", payload: { sugar_pct: 16.50, trash_pct: 4.50 }, as: QUALITY_TECH, as_user_id: "qt-alice" }
            - { call: "GET /api/tickets/${t1_id}", as: POOL_ACCOUNTANT, captures: { prov_factor: $.data.provisional_factor, prov_adj: $.data.provisional_adjusted_net_tons, prov_value: $.data.provisional_value_cents, t_status: $.data.status } }
            - { call: "POST /api/samples", payload: { ticket_id: "${t1_id}", sample_type: "LAB_VERIFY" }, as: QUALITY_TECH, captures: { ls_id: $.data.id } }
            - { call: "POST /api/samples/${ls_id}/record-result", payload: { sugar_pct: 16.10, trash_pct: 4.40 }, as: QUALITY_TECH, as_user_id: "qt-alice" }
            - { call: "POST /api/samples/${ls_id}/verify", as: QUALITY_TECH, as_user_id: "qt-bob" }
          trigger:
            - { call: "POST /api/tickets/${t1_id}/accept", payload: { pile_id: "${pile_id}" }, as: STATION_OPERATOR, captures: { fin_factor: $.data.final_factor, fin_adj: $.data.adjusted_net_tons_final, fin_sugar: $.data.final_sugar_pct, fin_status: $.data.status } }
          assert:
            - "setup capture: t_status == SAMPLED, prov_factor == 1.0200, prov_adj == 23.6400, prov_value == 132620"
            - "trigger capture: fin_status == ACCEPTED, fin_factor == 1.0040, fin_adj == 23.6640, fin_sugar == 16.10"
            - "prov_factor (1.0200) != fin_factor (1.0040) and prov_adj (23.6400) != fin_adj (23.6640) for the identical load — the two variants diverge"

      - name: pile_loss_table_rate_vs_resurvey
        grounds:
          - calculations.deterioration_loss
          - state_machines.StorageLossEvent.DRAFT_to_CONFIRMED
          - entities.StorageLossEvent.fields.loss_lbs
        distinguishing_aspect: |
          Different entity domain (StoragePile deterioration, not LoadTicket payment): two piles
          sealed with identical 40000 lbs for identical 10 days; TABLE_RATE projects 320.00 lbs of
          loss while RESURVEY of the same mass measuring 39600 lbs yields 400.00 lbs — an 80.00-lb
          divergence between the two valid algorithms.
        test_recipe:
          setup:
            - "Campaign, member M3 (haul 85.0), station, piles PT and PR (cap 500 each)"
            - "Bookings BT (08:00-10:00) and BR (10:00-12:00) CONFIRMED; tickets TT/TR weighed 72000/32000 at their slot clocks"
            - "Each ticket: LAB_VERIFY sample sugar 17.00 trash 2.00 recorded by qt-alice, verified by qt-bob; TT accepted into PT, TR into PR (40000 lbs each, no trash deduction)"
            - "Both piles sealed at clock 2026-10-05T09:00:00Z (sealed_stored_lbs == 40000)"
            - "Loss events created: LT on PT method TABLE_RATE survey 2026-10-15T09:00:00Z; LR on PR method RESURVEY measured_remaining_lbs 39600"
          setup_api_calls:
            - { call: "POST /api/campaigns", payload: { name: "C-2", window_start: "2026-09-15T00:00:00Z", window_end: "2026-11-20T00:00:00Z", base_price_cents_per_ton: 5500 }, as: COOP_ADMIN, captures: { camp_id: $.data.id } }
            - { call: "POST /api/members", payload: { name: "M3", member_code: "M-1003", haul_distance_miles: 85.0 }, as: COOP_ADMIN, captures: { m3_id: $.data.id } }
            - { call: "POST /api/stations", payload: { name: "ST", booking_capacity_tons: 1000 }, as: COOP_ADMIN, captures: { st_id: $.data.id } }
            - { call: "POST /api/piles", payload: { station_id: "${st_id}", capacity_tons: 500 }, as: STATION_OPERATOR, captures: { pt_id: $.data.id } }
            - { call: "POST /api/piles", payload: { station_id: "${st_id}", capacity_tons: 500 }, as: STATION_OPERATOR, captures: { pr_id: $.data.id } }
            - { call: "POST /api/bookings", payload: { campaign_id: "${camp_id}", station_id: "${st_id}", slot_start: "2026-10-01T08:00:00Z", slot_end: "2026-10-01T10:00:00Z", estimated_tons: 25 }, as: MEMBER, as_user_id: "${m3_id}", captures: { bt_id: $.data.id } }
            - { call: "POST /api/bookings/${bt_id}/confirm", as: SCHEDULER }
            - { call: "POST /api/bookings", payload: { campaign_id: "${camp_id}", station_id: "${st_id}", slot_start: "2026-10-01T10:00:00Z", slot_end: "2026-10-01T12:00:00Z", estimated_tons: 25 }, as: MEMBER, as_user_id: "${m3_id}", captures: { br_id: $.data.id } }
            - { call: "POST /api/bookings/${br_id}/confirm", as: SCHEDULER }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-10-01T08:30:00Z" }, as: COOP_ADMIN }
            - { call: "POST /api/tickets", payload: { booking_id: "${bt_id}" }, as: STATION_OPERATOR, captures: { tt_id: $.data.id } }
            - { call: "POST /api/tickets/${tt_id}/weigh", payload: { gross_weight_lbs: 72000, tare_weight_lbs: 32000 }, as: STATION_OPERATOR }
            - { call: "POST /api/samples", payload: { ticket_id: "${tt_id}", sample_type: "LAB_VERIFY" }, as: QUALITY_TECH, captures: { st1_id: $.data.id } }
            - { call: "POST /api/samples/${st1_id}/record-result", payload: { sugar_pct: 17.00, trash_pct: 2.00 }, as: QUALITY_TECH, as_user_id: "qt-alice" }
            - { call: "POST /api/samples/${st1_id}/verify", as: QUALITY_TECH, as_user_id: "qt-bob" }
            - { call: "POST /api/tickets/${tt_id}/accept", payload: { pile_id: "${pt_id}" }, as: STATION_OPERATOR }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-10-01T10:30:00Z" }, as: COOP_ADMIN }
            - { call: "POST /api/tickets", payload: { booking_id: "${br_id}" }, as: STATION_OPERATOR, captures: { tr_id: $.data.id } }
            - { call: "POST /api/tickets/${tr_id}/weigh", payload: { gross_weight_lbs: 72000, tare_weight_lbs: 32000 }, as: STATION_OPERATOR }
            - { call: "POST /api/samples", payload: { ticket_id: "${tr_id}", sample_type: "LAB_VERIFY" }, as: QUALITY_TECH, captures: { st2_id: $.data.id } }
            - { call: "POST /api/samples/${st2_id}/record-result", payload: { sugar_pct: 17.00, trash_pct: 2.00 }, as: QUALITY_TECH, as_user_id: "qt-alice" }
            - { call: "POST /api/samples/${st2_id}/verify", as: QUALITY_TECH, as_user_id: "qt-bob" }
            - { call: "POST /api/tickets/${tr_id}/accept", payload: { pile_id: "${pr_id}" }, as: STATION_OPERATOR }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-10-05T09:00:00Z" }, as: COOP_ADMIN }
            - { call: "POST /api/piles/${pt_id}/seal", as: STATION_OPERATOR }
            - { call: "POST /api/piles/${pr_id}/seal", as: STATION_OPERATOR }
            - { call: "POST /api/loss-events", payload: { pile_id: "${pt_id}", method: "TABLE_RATE", survey_at: "2026-10-15T09:00:00Z", window_start: "2026-10-15T08:00:00Z", window_end: "2026-10-15T10:00:00Z" }, as: STATION_OPERATOR, captures: { lt_id: $.data.id } }
            - { call: "POST /api/loss-events", payload: { pile_id: "${pr_id}", method: "RESURVEY", survey_at: "2026-10-15T09:00:00Z", window_start: "2026-10-15T08:00:00Z", window_end: "2026-10-15T10:00:00Z", measured_remaining_lbs: 39600 }, as: STATION_OPERATOR, captures: { lr_id: $.data.id } }
          trigger:
            - { call: "POST /api/loss-events/${lt_id}/confirm", as: STATION_OPERATOR, captures: { lt_loss: $.data.loss_lbs } }
            - { call: "POST /api/loss-events/${lr_id}/confirm", as: STATION_OPERATOR, captures: { lr_loss: $.data.loss_lbs } }
            - { call: "GET /api/piles/${pt_id}", as: POOL_ACCOUNTANT, captures: { pt_cond: $.data.condition_status } }
            - { call: "GET /api/piles/${pr_id}", as: POOL_ACCOUNTANT, captures: { pr_cond: $.data.condition_status } }
          assert:
            - "lt_loss == 320.00 (40000 x 0.0008 x 10 days, round_half_up 2dp)"
            - "lr_loss == 400.00 (40000 - 0 - 39600)"
            - "lr_loss - lt_loss == 80.00 — identical sealed mass and elapsed days, different variants, different loss"
            - "pt_cond == DETERIORATING and pr_cond == DETERIORATING (0.80% and 1.00% of sealed mass, both <= 5.00% threshold)"

  # ---------------------------------------------------------------------------
  # Rule 2 — combinatorial_formula (mode (a) nested min/max tiers vs mode (b) rounding order)
  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: trash_deduction_heavy_tier_nested_min_max
        grounds:
          - calculations.net_weight_and_trash_deduction
          - entities.LoadTicket.fields.provisional_adjusted_net_tons
        distinguishing_aspect: |
          Mode (a) — 3+ inputs with non-linear interaction: identical 40000-lb loads; trash 9.99%
          takes the 1.0 multiplier (deducted 6.99% -> 18.6020 t) while trash 10.00% engages the
          HEAVY_MULTIPLIER 1.5 with the min() cap (deducted min(7.00x1.5, 10.00) = 10.00% -> 18.0000 t).
          A 0.01-pct trash step removes 0.6020 t of creditable weight.
        test_recipe:
          setup:
            - "Campaign (base 5500), member M1, station, pile; bookings BA (08:00-10:00) and BB (10:00-12:00) CONFIRMED"
            - "Ticket TA weighed 72000/32000 at 08:30; STATION_QUICK sample recorded sugar 16.00 trash 9.99"
            - "Ticket TB weighed 72000/32000 at 10:30; STATION_QUICK sample recorded sugar 16.00 trash 10.00"
          setup_api_calls:
            - { call: "POST /api/campaigns", payload: { name: "C-3", window_start: "2026-09-15T00:00:00Z", window_end: "2026-11-20T00:00:00Z", base_price_cents_per_ton: 5500 }, as: COOP_ADMIN, captures: { camp_id: $.data.id } }
            - { call: "POST /api/members", payload: { name: "M1", member_code: "M-1001", haul_distance_miles: 22.5 }, as: COOP_ADMIN, captures: { m1_id: $.data.id } }
            - { call: "POST /api/stations", payload: { name: "ST", booking_capacity_tons: 1000 }, as: COOP_ADMIN, captures: { st_id: $.data.id } }
            - { call: "POST /api/piles", payload: { station_id: "${st_id}", capacity_tons: 200 }, as: STATION_OPERATOR, captures: { pile_id: $.data.id } }
            - { call: "POST /api/bookings", payload: { campaign_id: "${camp_id}", station_id: "${st_id}", slot_start: "2026-10-01T08:00:00Z", slot_end: "2026-10-01T10:00:00Z", estimated_tons: 25 }, as: MEMBER, as_user_id: "${m1_id}", captures: { ba_id: $.data.id } }
            - { call: "POST /api/bookings/${ba_id}/confirm", as: SCHEDULER }
            - { call: "POST /api/bookings", payload: { campaign_id: "${camp_id}", station_id: "${st_id}", slot_start: "2026-10-01T10:00:00Z", slot_end: "2026-10-01T12:00:00Z", estimated_tons: 25 }, as: MEMBER, as_user_id: "${m1_id}", captures: { bb_id: $.data.id } }
            - { call: "POST /api/bookings/${bb_id}/confirm", as: SCHEDULER }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-10-01T08:30:00Z" }, as: COOP_ADMIN }
            - { call: "POST /api/tickets", payload: { booking_id: "${ba_id}" }, as: STATION_OPERATOR, captures: { ta_id: $.data.id } }
            - { call: "POST /api/tickets/${ta_id}/weigh", payload: { gross_weight_lbs: 72000, tare_weight_lbs: 32000 }, as: STATION_OPERATOR }
            - { call: "POST /api/samples", payload: { ticket_id: "${ta_id}", sample_type: "STATION_QUICK" }, as: QUALITY_TECH, captures: { sa_id: $.data.id } }
            - { call: "POST /api/samples/${sa_id}/record-result", payload: { sugar_pct: 16.00, trash_pct: 9.99 }, as: QUALITY_TECH, as_user_id: "qt-alice" }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-10-01T10:30:00Z" }, as: COOP_ADMIN }
            - { call: "POST /api/tickets", payload: { booking_id: "${bb_id}" }, as: STATION_OPERATOR, captures: { tb_id: $.data.id } }
            - { call: "POST /api/tickets/${tb_id}/weigh", payload: { gross_weight_lbs: 72000, tare_weight_lbs: 32000 }, as: STATION_OPERATOR }
            - { call: "POST /api/samples", payload: { ticket_id: "${tb_id}", sample_type: "STATION_QUICK" }, as: QUALITY_TECH, captures: { sb_id: $.data.id } }
            - { call: "POST /api/samples/${sb_id}/record-result", payload: { sugar_pct: 16.00, trash_pct: 10.00 }, as: QUALITY_TECH, as_user_id: "qt-alice" }
          trigger:
            - { call: "GET /api/tickets/${ta_id}", as: POOL_ACCOUNTANT, captures: { ta_adj: $.data.provisional_adjusted_net_tons, ta_factor: $.data.provisional_factor } }
            - { call: "GET /api/tickets/${tb_id}", as: POOL_ACCOUNTANT, captures: { tb_adj: $.data.provisional_adjusted_net_tons, tb_factor: $.data.provisional_factor } }
          assert:
            - "ta_adj == 18.6020 (deducted 6.99% = (9.99-3.00) x 1.0)"
            - "tb_adj == 18.0000 (deducted min(7.00 x 1.5, 10.00) = 10.00%)"
            - "ta_factor == 1.0000 and tb_factor == 1.0000 (sugar 16.00 == REF_SUGAR_PCT)"
            - "ta_adj - tb_adj == 0.6020 — a 0.01-pct trash increase crossing the 10.00 tier boundary is amplified by the nested min/max"

      - name: transport_allowance_round_per_ticket_then_sum
        grounds:
          - calculations.transport_allowance
          - calculations.final_pool_settlement
          - entities.SettlementStatement.fields.transport_credit_cents
        distinguishing_aspect: |
          Mode (b) — nested rounding where order matters: two tickets at 20.0250 adjusted tons x
          180 cents/ton = 3604.50 cents each. Pinned order rounds per ticket (3605 + 3605 = 7210);
          the non-conformant sum-then-round order yields round(40.0500 x 180) = round(7209.00) = 7209.
          The settlement statement must show exactly 7210.
        test_recipe:
          setup:
            - "Campaign (base 5500), member M4 haul 22.5 mi (180 c/ton band), station, pile (cap 500)"
            - "Two bookings (08:00-10:00, 10:00-12:00) CONFIRMED; two tickets weighed 72050/32000 (net 40050 lbs each)"
            - "Each ticket: LAB_VERIFY sample sugar 16.00 trash 2.00 recorded+verified -> adjusted 20.0250 t; accepted into the pile"
            - "Pool open-accrual 700000; both tickets CREDITED; pile sealed and reclaimed (shipped 80100); campaign closed; pool closed gross 1000000"
          setup_api_calls:
            - { call: "POST /api/campaigns", payload: { name: "C-4", window_start: "2026-09-15T00:00:00Z", window_end: "2026-11-20T00:00:00Z", base_price_cents_per_ton: 5500 }, as: COOP_ADMIN, captures: { camp_id: $.data.id } }
            - { call: "POST /api/members", payload: { name: "M4", member_code: "M-1004", haul_distance_miles: 22.5 }, as: COOP_ADMIN, captures: { m4_id: $.data.id } }
            - { call: "POST /api/stations", payload: { name: "ST", booking_capacity_tons: 1000 }, as: COOP_ADMIN, captures: { st_id: $.data.id } }
            - { call: "POST /api/piles", payload: { station_id: "${st_id}", capacity_tons: 500 }, as: STATION_OPERATOR, captures: { pile_id: $.data.id } }
            - { call: "POST /api/bookings", payload: { campaign_id: "${camp_id}", station_id: "${st_id}", slot_start: "2026-10-01T08:00:00Z", slot_end: "2026-10-01T10:00:00Z", estimated_tons: 25 }, as: MEMBER, as_user_id: "${m4_id}", captures: { ba_id: $.data.id } }
            - { call: "POST /api/bookings/${ba_id}/confirm", as: SCHEDULER }
            - { call: "POST /api/bookings", payload: { campaign_id: "${camp_id}", station_id: "${st_id}", slot_start: "2026-10-01T10:00:00Z", slot_end: "2026-10-01T12:00:00Z", estimated_tons: 25 }, as: MEMBER, as_user_id: "${m4_id}", captures: { bb_id: $.data.id } }
            - { call: "POST /api/bookings/${bb_id}/confirm", as: SCHEDULER }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-10-01T08:30:00Z" }, as: COOP_ADMIN }
            - { call: "POST /api/tickets", payload: { booking_id: "${ba_id}" }, as: STATION_OPERATOR, captures: { ta_id: $.data.id } }
            - { call: "POST /api/tickets/${ta_id}/weigh", payload: { gross_weight_lbs: 72050, tare_weight_lbs: 32000 }, as: STATION_OPERATOR }
            - { call: "POST /api/samples", payload: { ticket_id: "${ta_id}", sample_type: "LAB_VERIFY" }, as: QUALITY_TECH, captures: { sa_id: $.data.id } }
            - { call: "POST /api/samples/${sa_id}/record-result", payload: { sugar_pct: 16.00, trash_pct: 2.00 }, as: QUALITY_TECH, as_user_id: "qt-alice" }
            - { call: "POST /api/samples/${sa_id}/verify", as: QUALITY_TECH, as_user_id: "qt-bob" }
            - { call: "POST /api/tickets/${ta_id}/accept", payload: { pile_id: "${pile_id}" }, as: STATION_OPERATOR }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-10-01T10:30:00Z" }, as: COOP_ADMIN }
            - { call: "POST /api/tickets", payload: { booking_id: "${bb_id}" }, as: STATION_OPERATOR, captures: { tb_id: $.data.id } }
            - { call: "POST /api/tickets/${tb_id}/weigh", payload: { gross_weight_lbs: 72050, tare_weight_lbs: 32000 }, as: STATION_OPERATOR }
            - { call: "POST /api/samples", payload: { ticket_id: "${tb_id}", sample_type: "LAB_VERIFY" }, as: QUALITY_TECH, captures: { sb_id: $.data.id } }
            - { call: "POST /api/samples/${sb_id}/record-result", payload: { sugar_pct: 16.00, trash_pct: 2.00 }, as: QUALITY_TECH, as_user_id: "qt-alice" }
            - { call: "POST /api/samples/${sb_id}/verify", as: QUALITY_TECH, as_user_id: "qt-bob" }
            - { call: "POST /api/tickets/${tb_id}/accept", payload: { pile_id: "${pile_id}" }, as: STATION_OPERATOR }
            - { call: "GET /api/campaigns/${camp_id}/pools", as: POOL_ACCOUNTANT, captures: { pool_id: "$.data[0].id" } }
            - { call: "POST /api/pools/${pool_id}/open-accrual", payload: { estimated_pool_value_cents: 700000 }, as: POOL_ACCOUNTANT }
            - { call: "POST /api/tickets/${ta_id}/credit", as: POOL_ACCOUNTANT }
            - { call: "POST /api/tickets/${tb_id}/credit", as: POOL_ACCOUNTANT }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-10-02T09:00:00Z" }, as: COOP_ADMIN }
            - { call: "POST /api/piles/${pile_id}/seal", as: STATION_OPERATOR }
            - { call: "POST /api/piles/${pile_id}/begin-reclaim", as: STATION_OPERATOR }
            - { call: "POST /api/piles/${pile_id}/complete-reclaim", payload: { shipped_lbs: 80100 }, as: STATION_OPERATOR }
            - { call: "POST /api/campaigns/${camp_id}/close", as: COOP_ADMIN }
            - { call: "POST /api/pools/${pool_id}/close", payload: { gross_pool_value_cents: 1000000 }, as: POOL_ACCOUNTANT }
          trigger:
            - { call: "POST /api/settlements/generate", payload: { campaign_id: "${camp_id}" }, as: POOL_ACCOUNTANT, captures: { st1_transport: "$.data[0].transport_credit_cents", st1_gross: "$.data[0].gross_entitlement_cents", st1_sugar: "$.data[0].sugar_lbs" } }
          assert:
            - "st1_transport == 7210 (per-ticket round: 3605 + 3605), NOT 7209 (sum-then-round of 7209.00)"
            - "st1_sugar == 12816.00 (two tickets x 6408.00 lbs at sugar 16.00)"
            - "st1_gross == 1000000 (single member absorbs the +1 rounding delta: round(12816.00 x 78.0275) = 999999 + 1)"

  # ---------------------------------------------------------------------------
  # Rule 3 — non_linear_state_machine (LoadTicket cycle vs SettlementStatement cycle)
  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: ticket_reweigh_cycle_recomputes_net
        grounds:
          - state_machines.LoadTicket.WEIGHED_to_REWEIGHING
          - state_machines.LoadTicket.REWEIGHING_to_WEIGHED
          - entities.LoadTicket.fields.net_weight_lbs
        distinguishing_aspect: |
          Cycle on LoadTicket: WEIGHED -> REWEIGHING -> WEIGHED. The first weigh computes net
          48000 lbs; reweigh clears all weights to null; the second weigh (79800/31700) recomputes
          net 48100 lbs — the entity loops back to a prior state with recomputed data.
        test_recipe:
          setup:
            - "Campaign, member M1, station, booking B1 CONFIRMED (slot 08:00-10:00); ticket T1 created and weighed 80000/32000 at clock 2026-10-01T08:30:00Z"
          setup_api_calls:
            - { call: "POST /api/campaigns", payload: { name: "C-5", window_start: "2026-09-15T00:00:00Z", window_end: "2026-11-20T00:00:00Z", base_price_cents_per_ton: 5500 }, as: COOP_ADMIN, captures: { camp_id: $.data.id } }
            - { call: "POST /api/members", payload: { name: "M1", member_code: "M-1001", haul_distance_miles: 22.5 }, as: COOP_ADMIN, captures: { m1_id: $.data.id } }
            - { call: "POST /api/stations", payload: { name: "ST", booking_capacity_tons: 1000 }, as: COOP_ADMIN, captures: { st_id: $.data.id } }
            - { call: "POST /api/bookings", payload: { campaign_id: "${camp_id}", station_id: "${st_id}", slot_start: "2026-10-01T08:00:00Z", slot_end: "2026-10-01T10:00:00Z", estimated_tons: 30 }, as: MEMBER, as_user_id: "${m1_id}", captures: { b1_id: $.data.id } }
            - { call: "POST /api/bookings/${b1_id}/confirm", as: SCHEDULER }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-10-01T08:30:00Z" }, as: COOP_ADMIN }
            - { call: "POST /api/tickets", payload: { booking_id: "${b1_id}" }, as: STATION_OPERATOR, captures: { t1_id: $.data.id } }
            - { call: "POST /api/tickets/${t1_id}/weigh", payload: { gross_weight_lbs: 80000, tare_weight_lbs: 32000 }, as: STATION_OPERATOR, captures: { net_first: $.data.net_weight_lbs, st_first: $.data.status } }
          trigger:
            - { call: "POST /api/tickets/${t1_id}/reweigh", as: STATION_OPERATOR, captures: { st_mid: $.data.status, net_mid: $.data.net_weight_lbs } }
            - { call: "POST /api/tickets/${t1_id}/weigh", payload: { gross_weight_lbs: 79800, tare_weight_lbs: 31700 }, as: STATION_OPERATOR, captures: { st_second: $.data.status, net_second: $.data.net_weight_lbs } }
          assert:
            - "net_first == 48000 and st_first == WEIGHED"
            - "st_mid == REWEIGHING and net_mid is null (weights cleared by the loop-back transition)"
            - "st_second == WEIGHED and net_second == 48100 (79800 - 31700) — cycle returns to WEIGHED with recomputed values"

      - name: settlement_dispute_revise_reissue_cycle
        grounds:
          - state_machines.SettlementStatement.ISSUED_to_DISPUTED
          - state_machines.SettlementStatement.DISPUTED_to_DRAFT
          - state_machines.SettlementStatement.DRAFT_to_ISSUED
          - concurrency_rules[settlement-revise-stale-version]
        distinguishing_aspect: |
          Cycle on SettlementStatement (different entity than LoadTicket): DRAFT -> ISSUED ->
          DISPUTED -> DRAFT -> ISSUED again; the revise hop is OCC-guarded, and the second issue
          recomputes advances_posted/final_payment from the ledger at that time.
        test_recipe:
          setup:
            - "Single-member world: campaign (base 5500), M1 (haul 22.5), station, pile, booking, ticket weighed 80000/32000, LAB sample 16.10/4.40 verified, accepted (47328 lbs), credited, pool open-accrual 700000"
            - "Pile sealed and reclaimed (shipped 47328), campaign closed, pool closed gross 1000000 (price 131.2369), settlement generated DRAFT (gross 1000000, transport 4260)"
          setup_api_calls:
            - { call: "POST /api/campaigns", payload: { name: "C-6", window_start: "2026-09-15T00:00:00Z", window_end: "2026-11-20T00:00:00Z", base_price_cents_per_ton: 5500 }, as: COOP_ADMIN, captures: { camp_id: $.data.id } }
            - { call: "POST /api/members", payload: { name: "M1", member_code: "M-1001", haul_distance_miles: 22.5 }, as: COOP_ADMIN, captures: { m1_id: $.data.id } }
            - { call: "POST /api/stations", payload: { name: "ST", booking_capacity_tons: 1000 }, as: COOP_ADMIN, captures: { st_id: $.data.id } }
            - { call: "POST /api/piles", payload: { station_id: "${st_id}", capacity_tons: 200 }, as: STATION_OPERATOR, captures: { pile_id: $.data.id } }
            - { call: "POST /api/bookings", payload: { campaign_id: "${camp_id}", station_id: "${st_id}", slot_start: "2026-10-01T08:00:00Z", slot_end: "2026-10-01T10:00:00Z", estimated_tons: 30 }, as: MEMBER, as_user_id: "${m1_id}", captures: { b1_id: $.data.id } }
            - { call: "POST /api/bookings/${b1_id}/confirm", as: SCHEDULER }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-10-01T08:30:00Z" }, as: COOP_ADMIN }
            - { call: "POST /api/tickets", payload: { booking_id: "${b1_id}" }, as: STATION_OPERATOR, captures: { t1_id: $.data.id } }
            - { call: "POST /api/tickets/${t1_id}/weigh", payload: { gross_weight_lbs: 80000, tare_weight_lbs: 32000 }, as: STATION_OPERATOR }
            - { call: "POST /api/samples", payload: { ticket_id: "${t1_id}", sample_type: "LAB_VERIFY" }, as: QUALITY_TECH, captures: { ls_id: $.data.id } }
            - { call: "POST /api/samples/${ls_id}/record-result", payload: { sugar_pct: 16.10, trash_pct: 4.40 }, as: QUALITY_TECH, as_user_id: "qt-alice" }
            - { call: "POST /api/samples/${ls_id}/verify", as: QUALITY_TECH, as_user_id: "qt-bob" }
            - { call: "POST /api/tickets/${t1_id}/accept", payload: { pile_id: "${pile_id}" }, as: STATION_OPERATOR }
            - { call: "GET /api/campaigns/${camp_id}/pools", as: POOL_ACCOUNTANT, captures: { pool_id: "$.data[0].id" } }
            - { call: "POST /api/pools/${pool_id}/open-accrual", payload: { estimated_pool_value_cents: 700000 }, as: POOL_ACCOUNTANT }
            - { call: "POST /api/tickets/${t1_id}/credit", as: POOL_ACCOUNTANT }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-10-02T09:00:00Z" }, as: COOP_ADMIN }
            - { call: "POST /api/piles/${pile_id}/seal", as: STATION_OPERATOR }
            - { call: "POST /api/piles/${pile_id}/begin-reclaim", as: STATION_OPERATOR }
            - { call: "POST /api/piles/${pile_id}/complete-reclaim", payload: { shipped_lbs: 47328 }, as: STATION_OPERATOR }
            - { call: "POST /api/campaigns/${camp_id}/close", as: COOP_ADMIN }
            - { call: "POST /api/pools/${pool_id}/close", payload: { gross_pool_value_cents: 1000000 }, as: POOL_ACCOUNTANT }
            - { call: "POST /api/settlements/generate", payload: { campaign_id: "${camp_id}" }, as: POOL_ACCOUNTANT, captures: { st_id: "$.data[0].id", st_gross: "$.data[0].gross_entitlement_cents", st_transport: "$.data[0].transport_credit_cents" } }
            - { call: "POST /api/settlements/${st_id}/issue", as: POOL_ACCOUNTANT, captures: { st_status1: $.data.status, st_final1: $.data.final_payment_cents, st_v_issued: $.data.version } }
            - { call: "POST /api/settlements/${st_id}/dispute", as: MEMBER, as_user_id: "${m1_id}", captures: { st_v_disputed: $.data.version } }
          trigger:
            - { call: "POST /api/settlements/${st_id}/revise", payload: { expected_settlement_version: "${st_v_disputed}" }, as: POOL_ACCOUNTANT, captures: { st_status_rev: $.data.status } }
            - { call: "POST /api/settlements/${st_id}/issue", as: POOL_ACCOUNTANT, captures: { st_status2: $.data.status, st_final2: $.data.final_payment_cents, st_total2: $.data.total_payment_cents } }
          assert:
            - "st_gross == 1000000 and st_transport == 4260 (price 131.2369 over 7619.81 sugar lbs, single member absorbs delta 0)"
            - "st_status1 == ISSUED and st_final1 == 1000000 (no advances posted)"
            - "st_status_rev == DRAFT — the DISPUTED -> DRAFT loop-back succeeded under the correct OCC version"
            - "st_status2 == ISSUED and st_final2 == 1000000 and st_total2 == 1004260 — the cycle completes with identical recomputed amounts"

  # ---------------------------------------------------------------------------
  # Rule 4 — transitive_cascade (different triggers: loss allocate vs booking cancel)
  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: loss_allocate_cascades_allocations_pile_station
        grounds:
          - state_machines.StorageLossEvent.CONFIRMED_to_ALLOCATED
          - calculations.loss_allocation
          - entities.StoragePile.fields.stored_lbs
          - entities.ReceivingStation.fields.stored_tons
          - entities.Member.fields.deterioration_loss_lbs
        distinguishing_aspect: |
          Depth-3 chain from POST /api/loss-events/{id}/allocate: each PileAllocation.remaining_lbs
          is reduced (link 1); each reduction recomputes its pile's stored_lbs (link 2); the pile
          recompute recomputes the station's stored_tons aggregate (link 3) — every link caused by
          the previous one, not a parallel fan-out.
        test_recipe:
          setup:
            - "Main world: campaign (base 5500), M1 (22.5 mi) and M2 (12.0 mi), station (cap 1000), pile P1 (cap 200 t)"
            - "B1 (M1, 08:00-10:00) and B2 (M2, 10:00-12:00) CONFIRMED; T1 weighed 80000/32000 with quick sample 16.50/4.50 then LAB 16.10/4.40 verified, accepted into P1 (47328 lbs)"
            - "T2 weighed 64000/32000 with LAB 17.20/2.00 verified, accepted into P1 (32000 lbs)"
            - "P1 sealed at 2026-10-05T09:00:00Z (sealed_stored_lbs 79328); loss event TABLE_RATE survey 2026-10-15T09:00:00Z confirmed (loss_lbs 634.62)"
