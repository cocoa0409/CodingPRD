        grounds:
          - concurrency_rules[analysis-create-stale-lead]
          - errors[ERR_STALE_LEAD_VERSION]
          - validations[priority=11]
        distinguishing_aspect: "The second declared concurrency rule guards POST /deal-analyses on expected_seller_lead_version: a re-screen between read and write invalidates the captured lead version and the analysis is rejected 412 ERR_STALE_LEAD_VERSION."
        test_recipe:
          setup:
