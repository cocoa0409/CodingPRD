scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: invoice_take_or_pay_provisional_excludes_last_day
        grounds:
          - calculations.take_or_pay_credit
          - entities.FuelInvoice.fields.credit_cents
          - state_machines.FuelInvoice.DRAFT_to_ISSUED
        distinguishing_aspect: |
          Invoice-domain dual variant: for identical line items, the DRAFT
          (provisional) credit excludes fueling events on the last in-period day
          while the ISSUED (final) credit includes them, so provisional
          credit_cents (3000) is strictly larger than final credit_cents (1000)
          and total_cents shifts from 14280 to 16280 at issuance.
        test_recipe:
          setup:
            - "Site with an ACTIVE DELIVERED_LIQUID contract: base 2.00/kg, committed 100 kg, period Oct 2026"
            - "Commissioned OUTDOOR station; two fueling events under the contract: 40 kg on 2026-10-15 (mid-period) and 40 kg on 2026-10-31 (last in-period day)"
            - "DRAFT invoice for period 2026-10-01..2026-11-01 with both events as line items"
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/sites"
              payload: { code: "S-DV1", name: "Dual Variant Site", address: "1 Fuel Way", baseline_labor_rate_per_hour: 30.0 }
              as: SiteManager
              captures: { site_id: $.data.id }
            - call: "POST /api/sites/${site_id}/supply-contracts"
              payload: { supply_mode: "DELIVERED_LIQUID", start_date: "2026-10-01", end_date: "2026-12-31", base_price_per_kg: 2.0, reliability_sla_pct: 99.5, committed_monthly_kg: 100 }
              as: SiteManager
              captures: { contract_id: $.data.id }
            - call: "POST /api/sites/${site_id}/supply-contracts/${contract_id}/activate"
              payload: {}
              as: SiteManager
            - call: "POST /api/sites/${site_id}/stations"
              payload: { station_code: "ST-1", location_type: "OUTDOOR", capacity_kg_per_day: 500, storage_capacity_kg: 1000, construction_start: "2026-10-01", construction_end: "2026-10-05" }
              as: SiteManager
              captures: { station_id: $.data.id }
            - call: "POST /api/stations/${station_id}/permits"
              payload: { permit_type: "CONSTRUCTION", issued_date: "2026-10-01", expiry_date: "2027-10-01" }
              as: SiteManager
              captures: { permit_c: $.data.id }
            - call: "POST /api/stations/${station_id}/permits"
              payload: { permit_type: "FIRE", issued_date: "2026-10-01", expiry_date: "2027-10-01" }
              as: SiteManager
              captures: { permit_f: $.data.id }
            - call: "POST /api/stations/${station_id}/permits/${permit_c}/issue"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /api/stations/${station_id}/permits/${permit_f}/issue"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /api/stations/${station_id}/start-construction"
              payload: {}
              as: SiteManager
            - call: "POST /api/stations/${station_id}/commission"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /api/stations/${station_id}/fueling-events"
              payload: { forklift_id: "FL-1", occurred_at: "2026-10-15T10:00:00Z", kg_dispensed: 40, supply_contract_id: "${contract_id}" }
              as: SiteManager
              captures: { fe_mid: $.data.id }
            - call: "POST /api/stations/${station_id}/fueling-events"
              payload: { forklift_id: "FL-2", occurred_at: "2026-10-31T10:00:00Z", kg_dispensed: 40, supply_contract_id: "${contract_id}" }
              as: SiteManager
              captures: { fe_last: $.data.id }
            - call: "POST /api/invoices"
              payload: { site_id: "${site_id}", supply_contract_id: "${contract_id}", period_start: "2026-10-01", period_end: "2026-11-01" }
              as: BillingOperator
              captures: { invoice_id: $.data.id, invoice_v0: $.data.version }
            - call: "POST /api/invoices/${invoice_id}/line-items"
              payload: { fueling_event_id: "${fe_mid}", expected_invoice_version: "${invoice_v0}" }
              as: BillingOperator
              captures: { invoice_v1: $.data.version }
            - call: "POST /api/invoices/${invoice_id}/line-items"
              payload: { fueling_event_id: "${fe_last}", expected_invoice_version: "${invoice_v1}" }
              as: BillingOperator
          trigger:
            - call: "GET /api/invoices/${invoice_id}"
              payload: {}
              as: BillingOperator
              captures: { prov_credit: $.data.credit_cents, prov_total: $.data.total_cents, prov_kg: $.data.total_kg }
            - call: "POST /api/invoices/${invoice_id}/issue"
              payload: {}
              as: BillingOperator
          assert:
            - "provisional read: credit_cents == 3000 and total_cents == 14280 (provisional total_kg basis 40 kg: shortfall 60 kg x 2.00 x 0.25 = 30.00 USD credit; provisional total = subtotal 17280 - 3000)"
            - "provisional read: subtotal_cents == 17280 and total_kg == 80 regardless of variant; only credit_cents and total_cents vary"
            - "after issue: FuelInvoice.${invoice_id}.credit_cents == 1000 (final total_kg 80: shortfall 20 kg x 2.00 x 0.25 = 5.00 USD; no ServiceAgreement so availability component 0)"
            - "FuelInvoice.${invoice_id}.total_cents == 16280 after issue (17280 - 1000)"
            - "provisional credit_cents (3000) != final credit_cents (1000) for identical line items"
      - name: productivity_telematics_vs_self_reported_gate
        grounds:
          - calculations.telematics_productivity_credit
          - entities.Site.fields.actual_productivity_units_per_hour
          - validations[priority=15]
        distinguishing_aspect: |
          Site-domain dual variant (different entity domain than the invoice
          take-or-pay variant): identical reported throughput of 66.0 units/hour is
          recorded verbatim under TELEMATICS (66.00, gate passes) but hair-cut to
          59.40 under SELF_REPORTED (gate fails), so the FEDERAL_ITC productivity
          gate at baseline 60 x 1.10 = 66.00 passes only for the TELEMATICS site.
        test_recipe:
          setup:
            - "Site A and Site B each with an APPROVED assessment, a COMPLETED conversion plan (baseline 60 units/hour, expected gain 10%), one COMPLETED conversion event, and a SUBMITTED FEDERAL_ITC claim"
            - "Clock at 2026-10-01T00:00:00Z"
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/sites"
              payload: { code: "S-TEL", name: "Telematics Site", address: "2 H2 Blvd", baseline_labor_rate_per_hour: 30.0 }
              as: SiteManager
              captures: { site_a: $.data.id }
            - call: "POST /api/sites"
              payload: { code: "S-SELF", name: "Self Reported Site", address: "3 H2 Blvd", baseline_labor_rate_per_hour: 30.0 }
              as: SiteManager
              captures: { site_b: $.data.id }
            - call: "POST /api/technicians"
              payload: { name: "Tech One", certification_level: "MASTER", certified_until: "2027-01-01" }
              as: PlatformAdmin
              captures: { tech_id: $.data.id }
            - call: "POST /api/sites/${site_a}/assessments"
              payload: { forklift_count: 5, duty_cycle_hours_per_day: 8.0, peak_shift_hours: 8, safety_findings_json: "{\"ok\": true}" }
              as: SiteManager
              captures: { ass_a: $.data.id }
            - call: "POST /api/sites/${site_b}/assessments"
              payload: { forklift_count: 5, duty_cycle_hours_per_day: 8.0, peak_shift_hours: 8, safety_findings_json: "{\"ok\": true}" }
              as: SiteManager
              captures: { ass_b: $.data.id }
            - call: "POST /api/sites/${site_a}/assessments/${ass_a}/submit"
              payload: {}
              as: SiteManager
            - call: "POST /api/sites/${site_b}/assessments/${ass_b}/submit"
              payload: {}
              as: SiteManager
            - call: "POST /api/sites/${site_a}/assessments/${ass_a}/approve"
              payload: {}
              as: SafetyOfficer
            - call: "POST /api/sites/${site_b}/assessments/${ass_b}/approve"
              payload: {}
              as: SafetyOfficer
            - call: "POST /api/sites/${site_a}/conversion-plans"
              payload: { name: "Wave A", target_forklift_count: 1, transition_mode: "CUTOVER", start_date: "2026-10-01", end_date: "2026-10-10", baseline_productivity_units_per_hour: 60.0, expected_productivity_gain_pct: 10 }
              as: SiteManager
              captures: { plan_a: $.data.id, plan_a_v: $.data.version }
            - call: "POST /api/sites/${site_b}/conversion-plans"
              payload: { name: "Wave B", target_forklift_count: 1, transition_mode: "CUTOVER", start_date: "2026-10-01", end_date: "2026-10-10", baseline_productivity_units_per_hour: 60.0, expected_productivity_gain_pct: 10 }
              as: SiteManager
              captures: { plan_b: $.data.id, plan_b_v: $.data.version }
            - call: "POST /api/sites/${site_a}/conversion-plans/${plan_a}/schedule"
              payload: { expected_plan_version: "${plan_a_v}" }
              as: SiteManager
            - call: "POST /api/sites/${site_b}/conversion-plans/${plan_b}/schedule"
              payload: { expected_plan_version: "${plan_b_v}" }
              as: SiteManager
            - call: "POST /api/conversion-plans/${plan_a}/conversion-events"
              payload: { forklift_id: "FL-A1", scheduled_start: "2026-10-02T08:00:00Z", scheduled_end: "2026-10-02T12:00:00Z", technician_id: "${tech_id}" }
              as: SiteManager
              captures: { ev_a: $.data.id }
            - call: "POST /api/conversion-plans/${plan_b}/conversion-events"
              payload: { forklift_id: "FL-B1", scheduled_start: "2026-10-03T08:00:00Z", scheduled_end: "2026-10-03T12:00:00Z", technician_id: "${tech_id}" }
              as: SiteManager
              captures: { ev_b: $.data.id }
            - call: "POST /api/conversion-plans/${plan_a}/conversion-events/${ev_a}/start"
              payload: {}
              as: ConversionTechnician
              as_user_id: "${tech_id}"
            - call: "POST /api/conversion-plans/${plan_b}/conversion-events/${ev_b}/start"
              payload: {}
              as: ConversionTechnician
              as_user_id: "${tech_id}"
            - call: "POST /api/conversion-plans/${plan_a}/conversion-events/${ev_a}/complete"
              payload: {}
              as: ConversionTechnician
              as_user_id: "${tech_id}"
            - call: "POST /api/conversion-plans/${plan_b}/conversion-events/${ev_b}/complete"
              payload: {}
              as: ConversionTechnician
              as_user_id: "${tech_id}"
            - call: "POST /api/sites/${site_a}/record-productivity"
              payload: { measurement_mode: "TELEMATICS", reported_units_per_hour: 66.0 }
              as: SiteManager
            - call: "POST /api/sites/${site_b}/record-productivity"
              payload: { measurement_mode: "SELF_REPORTED", reported_units_per_hour: 66.0 }
              as: SiteManager
            - call: "POST /api/sites/${site_a}/incentive-claims"
              payload: { incentive_type: "FEDERAL_ITC", claimed_amount_cents: 99999999, qualification_date: "2026-10-05" }
              as: SiteManager
              captures: { claim_a: $.data.id }
            - call: "POST /api/sites/${site_b}/incentive-claims"
              payload: { incentive_type: "FEDERAL_ITC", claimed_amount_cents: 99999999, qualification_date: "2026-10-05" }
              as: SiteManager
              captures: { claim_b: $.data.id }
            - call: "POST /api/sites/${site_a}/incentive-claims/${claim_a}/submit"
              payload: {}
              as: SiteManager
            - call: "POST /api/sites/${site_b}/incentive-claims/${claim_b}/submit"
              payload: {}
              as: SiteManager
          trigger:
            - call: "POST /api/sites/${site_a}/incentive-claims/${claim_a}/approve"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /api/sites/${site_b}/incentive-claims/${claim_b}/approve"
              payload: {}
              as: ComplianceOfficer
              captures: { err_b: $.data.error_id }
          assert:
            - "Site.${site_a}.actual_productivity_units_per_hour == 66.0 (TELEMATICS recorded verbatim)"
            - "Site.${site_b}.actual_productivity_units_per_hour == 59.4 (SELF_REPORTED 66.0 x 0.90)"
            - "IncentiveClaim.${claim_a}.status == APPROVED and approved_amount_cents == 495000 (1 unit x 1500000 x 1.10 x 0.30)"
            - "site B approve rejected: error_id == ERR_PRODUCTIVITY_GATE_NOT_MET, claim B remains SUBMITTED"
  - rule_id: combinatorial_formula
    instances:
      - name: tier_straddle_blended_price_and_rounding
        grounds:
          - calculations.supply_pricing_tier
          - entities.FuelLineItem.fields.line_amount_cents
        distinguishing_aspect: |
          Mode (a) combinatorial: a 30 kg line added after 90 prior kg straddles
          the 100 kg committed boundary, producing a blended unit price
          (10*2.5 + 20*2.3)/30 = 2.3667 over 4-decimal rounding and a line amount
          of 7100 cents — distinct from both pure-tier prices; the PIPELINE mode
          applies no markup, isolating the tier-straddle branch.
        test_recipe:
          setup:
            - "Site with ACTIVE PIPELINE contract: base 2.50/kg, committed 100 kg, period 2026-10"
            - "Commissioned OUTDOOR station; fueling events of 90 kg and 30 kg; DRAFT invoice with the 90 kg line already added"
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/sites"
              payload: { code: "S-TIER", name: "Tier Site", address: "9 Pipe Rd", baseline_labor_rate_per_hour: 28.0 }
              as: SiteManager
              captures: { site_id: $.data.id }
            - call: "POST /api/sites/${site_id}/supply-contracts"
              payload: { supply_mode: "PIPELINE", start_date: "2026-10-01", end_date: "2026-12-31", base_price_per_kg: 2.5, reliability_sla_pct: 99.0, committed_monthly_kg: 100 }
              as: SiteManager
              captures: { contract_id: $.data.id }
            - call: "POST /api/sites/${site_id}/supply-contracts/${contract_id}/activate"
              payload: {}
              as: SiteManager
            - call: "POST /api/sites/${site_id}/stations"
              payload: { station_code: "ST-T", location_type: "OUTDOOR", capacity_kg_per_day: 500, storage_capacity_kg: 1000, construction_start: "2026-10-01", construction_end: "2026-10-05" }
              as: SiteManager
              captures: { station_id: $.data.id }
            - call: "POST /api/stations/${station_id}/permits"
              payload: { permit_type: "CONSTRUCTION", issued_date: "2026-10-01", expiry_date: "2027-10-01" }
              as: SiteManager
              captures: { pc: $.data.id }
            - call: "POST /api/stations/${station_id}/permits"
              payload: { permit_type: "FIRE", issued_date: "2026-10-01", expiry_date: "2027-10-01" }
              as: SiteManager
              captures: { pf: $.data.id }
            - call: "POST /api/stations/${station_id}/permits/${pc}/issue"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /api/stations/${station_id}/permits/${pf}/issue"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /api/stations/${station_id}/start-construction"
              payload: {}
              as: SiteManager
            - call: "POST /api/stations/${station_id}/commission"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /api/stations/${station_id}/fueling-events"
              payload: { forklift_id: "FL-T1", occurred_at: "2026-10-10T08:00:00Z", kg_dispensed: 90, supply_contract_id: "${contract_id}" }
              as: SiteManager
              captures: { fe90: $.data.id }
            - call: "POST /api/stations/${station_id}/fueling-events"
              payload: { forklift_id: "FL-T2", occurred_at: "2026-10-20T08:00:00Z", kg_dispensed: 30, supply_contract_id: "${contract_id}" }
              as: SiteManager
              captures: { fe30: $.data.id }
            - call: "POST /api/invoices"
              payload: { site_id: "${site_id}", supply_contract_id: "${contract_id}", period_start: "2026-10-01", period_end: "2026-11-01" }
              as: BillingOperator
              captures: { inv: $.data.id, inv_v0: $.data.version }
            - call: "POST /api/invoices/${inv}/line-items"
              payload: { fueling_event_id: "${fe90}", expected_invoice_version: "${inv_v0}" }
              as: BillingOperator
              captures: { inv_v1: $.data.version, line1_amount: $.data.line_amount_cents }
          trigger:
            - call: "POST /api/invoices/${inv}/line-items"
              payload: { fueling_event_id: "${fe30}", expected_invoice_version: "${inv_v1}" }
              as: BillingOperator
              captures: { line2_price: $.data.unit_price_per_kg, line2_amount: $.data.line_amount_cents }
          assert:
            - "first line: line_amount_cents == 22500 (90 kg x 2.50 x 100)"
            - "second line: unit_price_per_kg == 2.3667 (blended (10*2.5 + 20*2.3)/30, 4-decimal)"
            - "second line: line_amount_cents == 7100 (ROUND_HALF_UP(30 x 2.3667 x 100) = 7100.1 -> 7100)"
            - "invoice subtotal_cents == 29600 and total_kg == 120"
      - name: incentive_evaluation_order_with_cap
        grounds:
          - calculations.incentive_qualification_amount
          - entities.IncentiveClaim.fields.approved_amount_cents
        distinguishing_aspect: |
          Mode (c) combinatorial (different mode than the tier-straddle instance):
          the pinned evaluation order plan -> converted units -> capex -> uplift ->
          ITC rate -> cap yields 1,029,600 cents for 2 units at 20% expected gain,
          and the final min() with claimed_amount_cents caps a 900,000-cent claim
          at 900,000 while an uncapped claim receives the full 1,029,600.
        test_recipe:
          setup:
            - "Site with APPROVED assessment (forklift_count 5) and a COMPLETED plan (baseline 50, expected gain 20%) with exactly 2 COMPLETED conversion events"
            - "TELEMATICS productivity recorded at 61.0 (>= 50 x 1.20 = 60.0 gate)"
            - "Two SUBMITTED FEDERAL_ITC claims: one claiming 900000 cents (below ITC), one claiming 2000000 cents (above ITC)"
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/sites"
              payload: { code: "S-ITC", name: "ITC Site", address: "7 Credit Ln", baseline_labor_rate_per_hour: 32.0 }
              as: SiteManager
              captures: { site_id: $.data.id }
            - call: "POST /api/technicians"
              payload: { name: "Tech Two", certification_level: "ADVANCED", certified_until: "2027-01-01" }
              as: PlatformAdmin
              captures: { tech_id: $.data.id }
            - call: "POST /api/sites/${site_id}/assessments"
              payload: { forklift_count: 5, duty_cycle_hours_per_day: 6.0, peak_shift_hours: 8, safety_findings_json: "{\"ok\": true}" }
              as: SiteManager
              captures: { ass: $.data.id }
            - call: "POST /api/sites/${site_id}/assessments/${ass}/submit"
              payload: {}
              as: SiteManager
            - call: "POST /api/sites/${site_id}/assessments/${ass}/approve"
              payload: {}
              as: SafetyOfficer
            - call: "POST /api/sites/${site_id}/conversion-plans"
              payload: { name: "Wave ITC", target_forklift_count: 2, transition_mode: "PARALLEL", start_date: "2026-10-01", end_date: "2026-10-20", baseline_productivity_units_per_hour: 50.0, expected_productivity_gain_pct: 20 }
              as: SiteManager
              captures: { plan: $.data.id, plan_v: $.data.version }
            - call: "POST /api/sites/${site_id}/conversion-plans/${plan}/schedule"
              payload: { expected_plan_version: "${plan_v}" }
              as: SiteManager
            - call: "POST /api/conversion-plans/${plan}/conversion-events"
              payload: { forklift_id: "FL-I1", scheduled_start: "2026-10-02T08:00:00Z", scheduled_end: "2026-10-02T12:00:00Z", technician_id: "${tech_id}" }
              as: SiteManager
              captures: { ev1: $.data.id }
            - call: "POST /api/conversion-plans/${plan}/conversion-events"
              payload: { forklift_id: "FL-I2", scheduled_start: "2026-10-03T08:00:00Z", scheduled_end: "2026-10-03T12:00:00Z", technician_id: "${tech_id}" }
              as: SiteManager
              captures: { ev2: $.data.id }
            - call: "POST /api/conversion-plans/${plan}/conversion-events/${ev1}/start"
              payload: {}
              as: ConversionTechnician
              as_user_id: "${tech_id}"
            - call: "POST /api/conversion-plans/${plan}/conversion-events/${ev1}/complete"
              payload: {}
              as: ConversionTechnician
              as_user_id: "${tech_id}"
            - call: "POST /api/conversion-plans/${plan}/conversion-events/${ev2}/start"
              payload: {}
              as: ConversionTechnician
              as_user_id: "${tech_id}"
            - call: "POST /api/conversion-plans/${plan}/conversion-events/${ev2}/complete"
              payload: {}
              as: ConversionTechnician
              as_user_id: "${tech_id}"
            - call: "POST /api/sites/${site_id}/record-productivity"
              payload: { measurement_mode: "TELEMATICS", reported_units_per_hour: 61.0 }
              as: SiteManager
            - call: "POST /api/sites/${site_id}/incentive-claims"
              payload: { incentive_type: "FEDERAL_ITC", claimed_amount_cents: 900000, qualification_date: "2026-10-05" }
              as: SiteManager
              captures: { claim_low: $.data.id }
            - call: "POST /api/sites/${site_id}/incentive-claims"
              payload: { incentive_type: "FEDERAL_ITC", claimed_amount_cents: 2000000, qualification_date: "2026-10-05" }
              as: SiteManager
              captures: { claim_high: $.data.id }
            - call: "POST /api/sites/${site_id}/incentive-claims/${claim_low}/submit"
              payload: {}
              as: SiteManager
            - call: "POST /api/sites/${site_id}/incentive-claims/${claim_high}/submit"
              payload: {}
              as: SiteManager
          trigger:
            - call: "POST /api/sites/${site_id}/incentive-claims/${claim_low}/approve"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /api/sites/${site_id}/incentive-claims/${claim_high}/approve"
              payload: {}
              as: ComplianceOfficer
          assert:
            - "IncentiveClaim.${claim_low}.status == APPROVED and approved_amount_cents == 900000 (ITC 1029600 capped by claim)"
            - "IncentiveClaim.${claim_high}.status == APPROVED and approved_amount_cents == 1029600 (2 x 1500000 x 1.20 x 0.30)"
  - rule_id: non_linear_state_machine
    instances:
      - name: invoice_issue_dispute_resolve_cycle
        grounds:
          - state_machines.FuelInvoice.ISSUED_to_DISPUTED
          - state_machines.FuelInvoice.DISPUTED_to_ISSUED
        distinguishing_aspect: |
          FuelInvoice has a true cycle ISSUED -> DISPUTED -> ISSUED: after the
          round trip the invoice is again payable (ISSUED -> PAID succeeds),
          proving the loop re-enters a live state rather than a terminal one.
        test_recipe:
          setup:
            - "Site with ACTIVE ON_SITE_GENERATION contract (base 3.00, committed 10) and a commissioned OUTDOOR station"
            - "Invoice with one 20 kg line, issued"
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/sites"
              payload: { code: "S-CYC", name: "Cycle Site", address: "4 Loop Rd", baseline_labor_rate_per_hour: 25.0 }
              as: SiteManager
