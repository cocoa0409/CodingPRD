              payload: {}
              as: PlatformAdmin
          trigger:
            - call: "POST /api/flocks/${flock_id}/induce-molt"
              payload: {}
              as: FarmManager
              captures: { err: $.data.error_id }
            - call: "POST /_clock/set_current_utc"
