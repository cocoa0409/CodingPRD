              as_user_id: "${league_id}"
            - call: "POST /injury-reports"
              payload: { enrollment_id: "${enr1_id}", sanctioned_activity_id: "${act_id}", injury_datetime: "2026-07-11T20:00:00Z", body_part: "SHOULDER_ARM", injury_description: "shoulder injured on the last throw of the game", severity_tier: "MODERATE" }
