scenario: "FOIA Information Request: request intake, 9 exemptions, fee tiers (commercial/educational/public), response deadline, appeal, Glomar response, Reverse FOIA third-party denial"
domain_name: "foia-information-request"
api_prefix: "/foia"

complexity_profile:
  primary_archetype: "Compliance / audit"
  secondary_archetype: "Multi-party negotiation"
  complexity_layers:
    - "Scheduled / deferred actions"
    - "Cascading side effects"
    - "Dual-variant calculation"
    - "Rate / threshold triggers"

  entity_topology: "flat"
  # Requester, Request, ResponsiveRecord, ExemptionClaim, ThirdPartyNotice, Appeal, FeeAssessment, AuditEntry
  # all peer entities linked by foreign keys; no deep nesting in URL paths.

  state_machine_shape: "branching"
  # Request: linear-with-branches (DETERMINATION → RELEASED | PARTIAL | DENIED | GLOMAR)
  # Appeal: branching (REVIEW → UPHELD | REVERSED | REMANDED-to-Request cycle)
  # ThirdPartyNotice: branching with veto-style OBJECT path
  # FeeAssessment: linear pipeline

  relationship_patterns:
    - "one_to_many"            # Request -> ResponsiveRecord, Request -> ExemptionClaim, Request -> ThirdPartyNotice
    - "cross_aggregate"        # Appeal references Request; ThirdPartyNotice references ResponsiveRecord
    - "polymorphic"            # AuditEntry.subject_type points to any of Request/Appeal/ThirdPartyNotice

  role_model: "segregation_of_duties"
  # Same officer who issued a determination cannot adjudicate its appeal.
  # Requester cannot act as Officer/AppealAuthority/ThirdParty.

  consistency_model: "immediate"

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =====================================================================
# §1.1 Entity-Relationship Table
# =====================================================================
entities:
  - name: Requester
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: "Legal name on file"
        constraints: "non-empty, max 200 chars"
      - name: contact_email
        type: string
        source: input
        description: "Email for service of notices"
        constraints: "non-empty, RFC-5322 syntactic check"
      - name: requester_tier
        type: enum
        source: input
        description: "Fee tier classification per FOIA"
        constraints: "one of {COMMERCIAL, EDUCATIONAL_NONCOMMERCIAL, PUBLIC_INTEREST}"
      - name: tier_justification
        type: string
        source: input
        description: "Free-text justification supporting the claimed tier; required when tier != COMMERCIAL"
        default: null
        constraints: "max 1000 chars; nullable only when requester_tier == COMMERCIAL"
      - name: status
        type: enum
        source: system
        description: "Account status"
        default: "ACTIVE"
        constraints: "one of {ACTIVE, SUSPENDED}"

  - name: Request
    parent: null
    common_fields: true
    fields:
      - name: requester_id
        type: string
        source: input
        description: "Foreign key to Requester.id"
        constraints: "must reference an ACTIVE Requester"
      - name: subject_summary
        type: string
        source: input
        description: "Free-text description of the records being requested"
        constraints: "non-empty, max 2000 chars"
      - name: status
        type: enum
        source: system
        description: "Lifecycle state — see §1.2"
        default: "INTAKE"
        constraints: "one of {INTAKE, ACKNOWLEDGED, SEARCH, DETERMINATION_PENDING, RELEASED, PARTIAL_RELEASE, DENIED, GLOMAR_ISSUED, WITHDRAWN, REOPENED_BY_APPEAL}"
      - name: fee_estimate_accepted
        type: boolean
        source: input
        description: "Set true when requester accepts the FeeAssessment before search proceeds"
        default: false
      - name: fee_waiver_requested
        type: boolean
        source: input
        description: "Whether requester asked for a fee waiver (only meaningful for non-commercial tiers)"
        default: false
      - name: fee_waiver_granted
        type: boolean
        source: system
        description: "Resolution of waiver request; nullable until adjudicated"
        default: null
      - name: glomar_invoked
        type: boolean
        source: system
        description: "True when the agency issued a Glomar response (neither confirm nor deny existence)"
        default: false
      - name: glomar_exemption_basis
        type: array
        source: system
        description: "Array of exemption codes justifying the Glomar; must be non-empty when glomar_invoked is true"
        default: []
        constraints: "elements drawn from {B1, B6, B7C}; max 3"
      - name: filed_at
        type: datetime
        source: system
        description: "Timestamp when the request transitioned INTAKE→ACKNOWLEDGED; anchor for the response clock"
        default: null
      - name: response_due_at
        type: datetime
        source: system
        description: "Computed deadline (20 working days from filed_at, plus tolling). See calc_response_deadline"
        default: null
      - name: tolling_days_consumed
        type: integer
        source: system
        description: "Cumulative business days the deadline has been tolled (fee-question or clarification)"
        default: 0
        constraints: ">= 0; max 30"
      - name: determination_at
        type: datetime
        source: system
        description: "When the final determination was made"
        default: null

  - name: ResponsiveRecord
    parent: null
    common_fields: true
    fields:
      - name: request_id
        type: string
        source: input
        description: "FK to Request.id; ResponsiveRecord is created only while Request.status == SEARCH"
        constraints: "must reference a Request in SEARCH"
      - name: title
        type: string
        source: input
        description: "Short title of the record"
        constraints: "non-empty, max 200 chars"
      - name: page_count
        type: integer
        source: input
        description: "Number of pages for fee calculation"
        constraints: ">= 1"
      - name: contains_third_party_info
        type: boolean
        source: input
        description: "Whether the record discloses third-party submitter business info (triggers Reverse FOIA)"
        default: false
      - name: third_party_id
        type: string
        source: input
        description: "Identifier of the third party whose info appears; required when contains_third_party_info is true"
        default: null
      - name: disposition
        type: enum
        source: system
        description: "Per-record outcome after exemption review"
        default: "PENDING_REVIEW"
        constraints: "one of {PENDING_REVIEW, RELEASED_FULL, RELEASED_REDACTED, WITHHELD_FULL}"

  - name: ExemptionClaim
    parent: null
    common_fields: false   # immutable audit-style claim; only id + created_at
    fields:
      - name: record_id
        type: string
        source: input
        description: "FK to ResponsiveRecord.id"
        constraints: "must reference a record in PENDING_REVIEW"
      - name: exemption_code
        type: enum
        source: input
        description: "One of the nine statutory FOIA exemptions"
        constraints: "one of {B1, B2, B3, B4, B5, B6, B7, B8, B9}"
      - name: redaction_scope
        type: enum
        source: input
        description: "FULL = entire record withheld; PARTIAL = redacted portions only"
        constraints: "one of {FULL, PARTIAL}"
      - name: rationale
        type: string
        source: input
        description: "Officer's stated rationale supporting the claim"
        constraints: "non-empty, max 1000 chars"

  - name: ThirdPartyNotice
    parent: null
    common_fields: true
    fields:
      - name: request_id
        type: string
        source: input
        description: "FK to Request.id"
      - name: record_id
        type: string
        source: input
        description: "FK to ResponsiveRecord.id; the record that triggered the notice"
      - name: third_party_id
        type: string
        source: input
        description: "Identifier of the notified third party (opaque)"
        constraints: "must equal the linked ResponsiveRecord.third_party_id"
      - name: status
        type: enum
        source: system
        description: "Lifecycle of the notice — see §1.2"
        default: "PENDING_RESPONSE"
        constraints: "one of {PENDING_RESPONSE, CONSENTED, OBJECTED, EXPIRED, OVERRIDDEN}"
      - name: response_deadline
        type: datetime
        source: system
        description: "Computed 10-business-day window for third party to object"
        default: null
      - name: objection_grounds
        type: string
        source: input
        description: "Third party's written objection; required when transitioning to OBJECTED"
        default: null

  - name: Appeal
    parent: null
    common_fields: true
    fields:
      - name: request_id
        type: string
        source: input
        description: "FK to a Request in {DENIED, PARTIAL_RELEASE, GLOMAR_ISSUED}"
        constraints: "request.status must be in {DENIED, PARTIAL_RELEASE, GLOMAR_ISSUED}"
      - name: appellant_role
        type: enum
        source: input
        description: "Who filed the appeal — Requester or ThirdParty (reverse FOIA appeal)"
        constraints: "one of {REQUESTER, THIRD_PARTY}"
      - name: grounds
        type: string
        source: input
        description: "Written grounds for appeal"
        constraints: "non-empty, max 4000 chars"
      - name: status
        type: enum
        source: system
        description: "Appeal lifecycle — see §1.2"
        default: "SUBMITTED"
        constraints: "one of {SUBMITTED, UNDER_REVIEW, UPHELD, REVERSED, REMANDED, DISMISSED}"
      - name: filed_at
        type: datetime
        source: system
        description: "When SUBMITTED; anchor for 20-business-day appeal deadline"
        default: null
      - name: decision_at
        type: datetime
        source: system
        description: "When the AppealAuthority issued a decision"
        default: null
      - name: deciding_officer_id
        type: string
        source: system
        description: "X-User-ID of the AppealAuthority who decided; must differ from the original Officer who issued the determination on the underlying Request"
        default: null

  - name: FeeAssessment
    parent: null
    common_fields: true
    fields:
      - name: request_id
        type: string
        source: input
        description: "FK to Request.id; one assessment per Request"
        constraints: "UNIQUE(request_id)"
      - name: tier_at_assessment
        type: enum
        source: system
        description: "Snapshot of Requester.requester_tier when the assessment was computed"
        constraints: "one of {COMMERCIAL, EDUCATIONAL_NONCOMMERCIAL, PUBLIC_INTEREST}"
      - name: estimated_pages
        type: integer
        source: input
        description: "Estimated total page count used for the up-front estimate"
        constraints: ">= 0"
      - name: estimated_search_hours
        type: number
        source: input
        description: "Estimated officer search hours"
        constraints: ">= 0"
      - name: estimated_review_hours
        type: number
        source: input
        description: "Estimated officer review hours (chargeable only for COMMERCIAL tier)"
        constraints: ">= 0"
      - name: estimate_total_cents
        type: integer
        source: computed
        description: "Up-front fee estimate in cents — see calc_fee_estimate"
        default: 0
      - name: final_total_cents
        type: integer
        source: computed
        description: "Final billable fee in cents based on actual ResponsiveRecord totals at determination — see calc_fee_final"
        default: 0
      - name: status
        type: enum
        source: system
        description: "Fee assessment lifecycle"
        default: "DRAFT"
        constraints: "one of {DRAFT, ESTIMATED, ACCEPTED, FINALIZED, WAIVED}"

  - name: AuditEntry
    parent: null
    common_fields: false   # immutable event log: id + created_at only
    fields:
      - name: subject_type
        type: enum
        source: system
        description: "Which entity the entry describes"
        constraints: "one of {REQUEST, APPEAL, THIRD_PARTY_NOTICE, FEE_ASSESSMENT}"
      - name: subject_id
        type: string
        source: system
        description: "id of the referenced entity"
      - name: event_code
        type: enum
        source: system
        description: "What happened"
        constraints: "one of {INTAKE_RECEIVED, ACKNOWLEDGED, SEARCH_STARTED, TOLLING_STARTED, TOLLING_ENDED, FEE_ESTIMATED, FEE_ACCEPTED, EXEMPTION_CLAIMED, THIRD_PARTY_NOTIFIED, THIRD_PARTY_RESPONDED, GLOMAR_ISSUED, DETERMINATION_ISSUED, APPEAL_FILED, APPEAL_DECIDED, REMANDED}"
      - name: actor_role
        type: string
        source: system
        description: "Snapshot of X-User-Role at the time"
      - name: actor_id
        type: string
        source: system
        description: "Snapshot of X-User-ID at the time"
      - name: payload
        type: object
        source: system
        description: "Free-form snapshot of relevant fields immediately after the event"

# =====================================================================
# §1.2 State Machine Table
# =====================================================================
state_machines:

  # ---- Request ----
  - entity: Request
    initial_state: INTAKE
    terminal_states: [RELEASED, PARTIAL_RELEASE, DENIED, GLOMAR_ISSUED, WITHDRAWN]
    # REOPENED_BY_APPEAL is non-terminal — it cycles back through SEARCH for remanded appeals.
    transitions:
      - from: INTAKE
        to: ACKNOWLEDGED
        trigger: "POST /foia/requests/{id}/acknowledge"
        actor: Officer
        preconditions:
          - "Request.status == INTAKE"
          - "Requester.status == ACTIVE"
          - "If Requester.requester_tier != COMMERCIAL then Requester.tier_justification is non-empty"
        side_effects:
          - "Request.filed_at = now()"
          - "Request.response_due_at = calc_response_deadline(filed_at, tolling_days_consumed=0)"
          - "Append AuditEntry(event_code=ACKNOWLEDGED)"

      - from: ACKNOWLEDGED
        to: SEARCH
        trigger: "POST /foia/requests/{id}/start-search"
        actor: Officer
        preconditions:
          - "Request.status == ACKNOWLEDGED"
          - "(FeeAssessment.status IN {ACCEPTED, WAIVED}) OR estimate_total_cents <= FREE_THRESHOLD_CENTS"
          - "If fee_waiver_requested then fee_waiver_granted is not null"
        side_effects:
          - "Append AuditEntry(event_code=SEARCH_STARTED)"

      - from: SEARCH
        to: DETERMINATION_PENDING
        trigger: "POST /foia/requests/{id}/close-search"
        actor: Officer
        preconditions:
          - "Request.status == SEARCH"
          - "Every ResponsiveRecord.contains_third_party_info==true has a ThirdPartyNotice in {CONSENTED, OBJECTED, EXPIRED, OVERRIDDEN}"
        side_effects:
          - "FeeAssessment.final_total_cents = calc_fee_final(Request)"
          - "FeeAssessment.status = FINALIZED (unless WAIVED)"

      - from: DETERMINATION_PENDING
        to: RELEASED
        trigger: "POST /foia/requests/{id}/determine"
        actor: Officer
        preconditions:
          - "Request.glomar_invoked == false"
          - "All ResponsiveRecord.disposition == RELEASED_FULL"
        side_effects:
          - "Request.determination_at = now()"
          - "Append AuditEntry(event_code=DETERMINATION_ISSUED, payload.outcome=RELEASED)"

      - from: DETERMINATION_PENDING
        to: PARTIAL_RELEASE
        trigger: "POST /foia/requests/{id}/determine"
        actor: Officer
        preconditions:
          - "Request.glomar_invoked == false"
          - "At least one ResponsiveRecord.disposition IN {RELEASED_REDACTED, WITHHELD_FULL}"
          - "At least one ResponsiveRecord.disposition IN {RELEASED_FULL, RELEASED_REDACTED}"
        side_effects:
          - "Request.determination_at = now()"
          - "Append AuditEntry(event_code=DETERMINATION_ISSUED, payload.outcome=PARTIAL_RELEASE)"

      - from: DETERMINATION_PENDING
        to: DENIED
        trigger: "POST /foia/requests/{id}/determine"
        actor: Officer
        preconditions:
          - "Request.glomar_invoked == false"
          - "Every ResponsiveRecord.disposition == WITHHELD_FULL"
          - "At least one ExemptionClaim exists per WITHHELD_FULL record"
        side_effects:
          - "Request.determination_at = now()"
          - "Append AuditEntry(event_code=DETERMINATION_ISSUED, payload.outcome=DENIED)"

      - from: DETERMINATION_PENDING
        to: GLOMAR_ISSUED
        trigger: "POST /foia/requests/{id}/issue-glomar"
        actor: Officer
        preconditions:
          - "Request.status == DETERMINATION_PENDING"
          - "Request.glomar_invoked == true"
          - "len(Request.glomar_exemption_basis) >= 1"
          - "No ResponsiveRecord exists for this Request (Glomar = neither confirm nor deny existence)"
        side_effects:
          - "Request.determination_at = now()"
          - "Append AuditEntry(event_code=GLOMAR_ISSUED)"
        note: "Glomar bypasses per-record disposition entirely."

      - from: INTAKE
        to: WITHDRAWN
        trigger: "POST /foia/requests/{id}/withdraw"
        actor: Requester
        preconditions:
          - "X-User-ID == Request.requester_id"
        side_effects:
          - "FeeAssessment.status = WAIVED if exists"
          - "Append AuditEntry"
      - from: ACKNOWLEDGED
        to: WITHDRAWN
        trigger: "POST /foia/requests/{id}/withdraw"
        actor: Requester
        preconditions: ["X-User-ID == Request.requester_id"]
        side_effects: ["Append AuditEntry"]
      - from: SEARCH
        to: WITHDRAWN
        trigger: "POST /foia/requests/{id}/withdraw"
        actor: Requester
        preconditions: ["X-User-ID == Request.requester_id"]
        side_effects: ["Append AuditEntry"]

      - from: ACKNOWLEDGED
        to: ACKNOWLEDGED
        trigger: "POST /foia/requests/{id}/start-tolling (fee_question or clarification)"
        actor: Officer
        preconditions:
          - "Request.status == ACKNOWLEDGED"
          - "Request.tolling_days_consumed < MAX_TOLL_DAYS (30)"
        side_effects:
          - "Append AuditEntry(event_code=TOLLING_STARTED)"
        note: "Self-loop; tolling pause is closed by /resume-clock which advances tolling_days_consumed and recomputes response_due_at."

      - from: ACKNOWLEDGED
        to: ACKNOWLEDGED
        trigger: "POST /foia/requests/{id}/resume-clock"
        actor: Officer
        preconditions:
          - "An open TOLLING_STARTED AuditEntry exists with no matching TOLLING_ENDED"
        side_effects:
          - "tolling_days_consumed += (business days since TOLLING_STARTED at the current clock)"
          - "Request.response_due_at = calc_response_deadline(filed_at, tolling_days_consumed)"
          - "Append AuditEntry(event_code=TOLLING_ENDED)"

      - from: DENIED
        to: REOPENED_BY_APPEAL
        trigger: "Internal — REMANDED appeal decision (Appeal cascade)"
        actor: system
        preconditions:
          - "An Appeal on this Request just transitioned to REMANDED"
        side_effects:
          - "Append AuditEntry(event_code=REMANDED, subject_type=REQUEST)"
      - from: PARTIAL_RELEASE
        to: REOPENED_BY_APPEAL
        trigger: "Internal — REMANDED appeal decision"
        actor: system
        preconditions: ["An Appeal on this Request just transitioned to REMANDED"]
        side_effects: ["Append AuditEntry(event_code=REMANDED)"]
      - from: GLOMAR_ISSUED
        to: REOPENED_BY_APPEAL
        trigger: "Internal — REMANDED appeal decision"
        actor: system
        preconditions: ["An Appeal on this Request just transitioned to REMANDED"]
        side_effects:
          - "Request.glomar_invoked = false"
          - "Request.glomar_exemption_basis = []"
          - "Append AuditEntry(event_code=REMANDED)"

      - from: REOPENED_BY_APPEAL
        to: SEARCH
        trigger: "POST /foia/requests/{id}/resume-search"
        actor: Officer
        preconditions:
          - "Request.status == REOPENED_BY_APPEAL"
        side_effects:
          - "Append AuditEntry(event_code=SEARCH_STARTED, payload.cycle='post-remand')"

  # ---- ThirdPartyNotice ----
  - entity: ThirdPartyNotice
    initial_state: PENDING_RESPONSE
    terminal_states: [CONSENTED, OBJECTED, EXPIRED, OVERRIDDEN]
    transitions:
      - from: PENDING_RESPONSE
        to: CONSENTED
        trigger: "POST /foia/third-party-notices/{id}/consent"
        actor: ThirdParty
        preconditions:
          - "X-User-ID == ThirdPartyNotice.third_party_id"
          - "now() < ThirdPartyNotice.response_deadline"
        side_effects:
          - "Append AuditEntry(event_code=THIRD_PARTY_RESPONDED, payload.outcome=CONSENT)"

      - from: PENDING_RESPONSE
        to: OBJECTED
        trigger: "POST /foia/third-party-notices/{id}/object"
        actor: ThirdParty
        preconditions:
          - "X-User-ID == ThirdPartyNotice.third_party_id"
          - "now() < ThirdPartyNotice.response_deadline"
          - "objection_grounds is non-empty"
        side_effects:
          - "Linked ResponsiveRecord.disposition forced to RELEASED_REDACTED or WITHHELD_FULL once an ExemptionClaim B4 is created (cross-entity dependency)"
          - "Append AuditEntry"

      - from: PENDING_RESPONSE
        to: EXPIRED
        trigger: "Clock advance — now() >= response_deadline"
        actor: system
        preconditions:
          - "ThirdPartyNotice.status == PENDING_RESPONSE"
          - "now() >= response_deadline"
        side_effects:
          - "Linked ResponsiveRecord becomes eligible for RELEASED_FULL"
          - "Append AuditEntry"

      - from: PENDING_RESPONSE
        to: OVERRIDDEN
        trigger: "POST /foia/third-party-notices/{id}/override"
        actor: AppealAuthority
        preconditions:
          - "ThirdPartyNotice.status == PENDING_RESPONSE OR OBJECTED"
          - "A Reverse-FOIA Appeal on this notice's record_id has been DISMISSED or UPHELD against the third party"
        side_effects:
          - "Linked ResponsiveRecord eligible for any disposition based on independent ExemptionClaims"
      - from: OBJECTED
        to: OVERRIDDEN
        trigger: "POST /foia/third-party-notices/{id}/override"
        actor: AppealAuthority
        preconditions:
          - "A Reverse-FOIA Appeal on this notice's record_id is UPHELD against the third party (appellant_role=THIRD_PARTY, status=UPHELD with grounds rejected)"
        side_effects:
          - "Append AuditEntry"

  # ---- Appeal ----
  - entity: Appeal
    initial_state: SUBMITTED
    terminal_states: [UPHELD, REVERSED, DISMISSED]
    # REMANDED is non-terminal — it triggers the Request to enter REOPENED_BY_APPEAL.
    transitions:
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /foia/appeals/{id}/accept-for-review"
        actor: AppealAuthority
        preconditions:
          - "Appeal.status == SUBMITTED"
          - "X-User-ID != the deciding_officer_id of the original determination on Appeal.request_id (segregation-of-duties)"
        side_effects:
          - "Appeal.deciding_officer_id = X-User-ID"
          - "Append AuditEntry"

      - from: UNDER_REVIEW
        to: UPHELD
        trigger: "POST /foia/appeals/{id}/decide  (decision=UPHELD)"
        actor: AppealAuthority
        preconditions:
          - "Appeal.status == UNDER_REVIEW"
          - "X-User-ID == Appeal.deciding_officer_id"
        side_effects:
          - "Appeal.decision_at = now()"
          - "Append AuditEntry(event_code=APPEAL_DECIDED, payload.outcome=UPHELD)"

      - from: UNDER_REVIEW
        to: REVERSED
        trigger: "POST /foia/appeals/{id}/decide  (decision=REVERSED)"
        actor: AppealAuthority
        preconditions:
          - "Appeal.status == UNDER_REVIEW"
          - "Appeal.appellant_role == REQUESTER"
        side_effects:
          - "If underlying Request.status == DENIED then Request.status remains DENIED until officer reopens; agency MUST issue a new determination via the appeal-implementation endpoint (modeled as REMANDED)"
          - "Append AuditEntry(event_code=APPEAL_DECIDED, payload.outcome=REVERSED)"

      - from: UNDER_REVIEW
        to: REMANDED
        trigger: "POST /foia/appeals/{id}/decide  (decision=REMANDED)"
        actor: AppealAuthority
        preconditions:
          - "Appeal.status == UNDER_REVIEW"
        side_effects:
          - "Cascade: triggers Request transition DENIED|PARTIAL_RELEASE|GLOMAR_ISSUED → REOPENED_BY_APPEAL"
          - "Append AuditEntry(event_code=APPEAL_DECIDED, payload.outcome=REMANDED)"

      - from: REMANDED
        to: DISMISSED
        trigger: "Internal — issued automatically once the agency lodges a new determination on the reopened Request"
        actor: system
        preconditions:
          - "Underlying Request.status transitioned out of REOPENED_BY_APPEAL into a determination state"
        side_effects:
          - "Append AuditEntry"

      - from: SUBMITTED
        to: DISMISSED
        trigger: "POST /foia/appeals/{id}/dismiss"
        actor: AppealAuthority
        preconditions:
          - "Appeal.filed_at + 20 business days < now()  (i.e. appeal filed past the 20-business-day appeal window from the underlying determination)"
          - "Appeal.appellant_role == REQUESTER"
        side_effects: ["Append AuditEntry"]

  # ---- FeeAssessment ----
  - entity: FeeAssessment
    initial_state: DRAFT
    terminal_states: [FINALIZED, WAIVED]
    transitions:
      - from: DRAFT
        to: ESTIMATED
        trigger: "POST /foia/fee-assessments/{id}/estimate"
        actor: Officer
        preconditions:
          - "Linked Request.status == ACKNOWLEDGED"
        side_effects:
          - "FeeAssessment.tier_at_assessment = Requester.requester_tier"
          - "FeeAssessment.estimate_total_cents = calc_fee_estimate(...)"

      - from: ESTIMATED
        to: ACCEPTED
        trigger: "POST /foia/fee-assessments/{id}/accept"
        actor: Requester
        preconditions:
          - "X-User-ID == linked Request.requester_id"
        side_effects:
          - "Request.fee_estimate_accepted = true"

      - from: ESTIMATED
        to: WAIVED
        trigger: "POST /foia/fee-assessments/{id}/waive"
        actor: Officer
        preconditions:
          - "linked Request.fee_waiver_requested == true"
          - "linked Requester.requester_tier IN {EDUCATIONAL_NONCOMMERCIAL, PUBLIC_INTEREST}"
        side_effects:
          - "linked Request.fee_waiver_granted = true"
          - "FeeAssessment.estimate_total_cents = 0"

      - from: ACCEPTED
        to: FINALIZED
        trigger: "Internal — when Request.status transitions SEARCH→DETERMINATION_PENDING"
        actor: system
        preconditions:
          - "Linked Request.status == DETERMINATION_PENDING"
        side_effects:
          - "FeeAssessment.final_total_cents = calc_fee_final(linked Request)"

      - from: WAIVED
        to: FINALIZED
        trigger: "Internal — when Request.status transitions SEARCH→DETERMINATION_PENDING"
        actor: system
        preconditions: ["Linked Request.status == DETERMINATION_PENDING"]
        side_effects:
          - "FeeAssessment.final_total_cents = 0  (waiver carries through)"

# =====================================================================
# §1.2.1 Concurrency Rules
# =====================================================================
concurrency_rules:
  - scenario: "Two Officers attempt /determine on the same Request simultaneously"
    guarantee: "At most one determination outcome is recorded; the loser is rejected"
    error_id: ERR_INVALID_STATE
    http_status: 409
    serialization: "First-writer-wins on Request.status leaving DETERMINATION_PENDING"

  - scenario: "Third party submits /consent while clock-advance triggers EXPIRED on the same notice"
    guarantee: "Exactly one terminal state on the notice; second writer is rejected"
    error_id: ERR_NOTICE_ALREADY_CLOSED
    http_status: 409
    serialization: "First-writer-wins on ThirdPartyNotice.status"

  - scenario: "Two appeals filed on the same Request by the same appellant_role concurrently"
    guarantee: "At most one open appeal per (request_id, appellant_role); second creation is rejected"
    error_id: ERR_DUPLICATE_APPEAL
    http_status: 409
    serialization: "Unique (request_id, appellant_role) where Appeal.status NOT IN {DISMISSED}"

  - scenario: "Two Officers create a second FeeAssessment for the same Request"
    guarantee: "At most one FeeAssessment per Request; second creation is rejected"
    error_id: ERR_FEE_ASSESSMENT_EXISTS
    http_status: 409
    serialization: "UNIQUE(request_id)"

  - scenario: "Officer issues /determine while Requester issues /withdraw"
    guarantee: "Exactly one transition out of DETERMINATION_PENDING|SEARCH succeeds; the other is rejected"
    error_id: ERR_INVALID_STATE
    http_status: 409
    serialization: "First-writer-wins on Request.status"

  - scenario: "Reverse-FOIA Appeal /accept-for-review by the same officer who issued the original determination"
    guarantee: "Segregation of duties enforced server-side"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    serialization: "Server compares X-User-ID against the audit trail of the original determination before allowing UNDER_REVIEW"

# =====================================================================
# §1.3 Calculation Rules Table
# =====================================================================
calculations:
  - name: calc_fee_estimate
    trigger: "FeeAssessment.DRAFT → ESTIMATED (POST /foia/fee-assessments/{id}/estimate)"
    algorithm: tiered_pricing
    formula: |
      # Per-tier rules — three different formulas:
      #
      # COMMERCIAL:
      #   chargeable_search_hours = estimated_search_hours
      #   chargeable_review_hours = estimated_review_hours
      #   chargeable_pages        = max(0, estimated_pages - 0)        # no free pages
      #   subtotal_cents = ( chargeable_search_hours * SEARCH_RATE_CENTS_PER_HOUR )
      #                  + ( chargeable_review_hours * REVIEW_RATE_CENTS_PER_HOUR )
      #                  + ( chargeable_pages * COPY_RATE_CENTS_PER_PAGE )
      #
      # EDUCATIONAL_NONCOMMERCIAL:
      #   chargeable_search_hours = 0                                  # search is free
      #   chargeable_review_hours = 0                                  # review never chargeable
      #   chargeable_pages        = max(0, estimated_pages - FREE_PAGES)
      #   subtotal_cents = chargeable_pages * COPY_RATE_CENTS_PER_PAGE
      #
      # PUBLIC_INTEREST:
      #   chargeable_search_hours = max(0, estimated_search_hours - FREE_SEARCH_HOURS)
      #   chargeable_review_hours = 0
      #   chargeable_pages        = max(0, estimated_pages - FREE_PAGES)
      #   subtotal_cents = ( chargeable_search_hours * SEARCH_RATE_CENTS_PER_HOUR )
      #                  + ( chargeable_pages * COPY_RATE_CENTS_PER_PAGE )
      #
      # Free-threshold rule applied AFTER subtotal:
      #   if subtotal_cents < FREE_THRESHOLD_CENTS:
      #       estimate_total_cents = 0
      #   else:
      #       estimate_total_cents = subtotal_cents
      #
      # Evaluation order is fixed:
      #   (1) compute tier-specific chargeable quantities
      #   (2) multiply by rates  (integer-cent arithmetic; no per-line rounding)
      #   (3) sum to subtotal_cents
      #   (4) apply free-threshold collapse to zero
      # Order matters: applying the threshold BEFORE step (3) would change which fee components dominate.
    input_set: "Snapshot of Requester.requester_tier + estimated_search_hours + estimated_review_hours + estimated_pages provided at /estimate time"
    constants:
      SEARCH_RATE_CENTS_PER_HOUR: 4500          # $45.00/hr
      REVIEW_RATE_CENTS_PER_HOUR: 6000          # $60.00/hr (commercial-only)
      COPY_RATE_CENTS_PER_PAGE: 10              # $0.10/page
      FREE_PAGES: 100
      FREE_SEARCH_HOURS: 2
      FREE_THRESHOLD_CENTS: 1400                # $14.00
    precision: "integer cents; multiplications use exact integers; ceil only on hours converted to whole increments (hours are stored as decimals to one place)"
    variants:
      - name: commercial_full_bill
        when: "Requester.requester_tier == COMMERCIAL"
        difference: "all three components (search + review + pages) accrue from the first unit; review never chargeable for the other tiers"
      - name: educational_pages_only
        when: "Requester.requester_tier == EDUCATIONAL_NONCOMMERCIAL"
        difference: "ignores search and review entirely; charges only pages above FREE_PAGES"
      - name: public_interest_partial
        when: "Requester.requester_tier == PUBLIC_INTEREST"
        difference: "search hours have a FREE_SEARCH_HOURS allowance; review is free; pages have FREE_PAGES allowance"

  - name: calc_fee_final
    trigger: "Request.SEARCH → DETERMINATION_PENDING (POST /foia/requests/{id}/close-search)"
    algorithm: tiered_pricing
    formula: |
      # Same tier formulas as calc_fee_estimate, BUT:
      # - actual_pages = sum(ResponsiveRecord.page_count) for records with disposition in {RELEASED_FULL, RELEASED_REDACTED}
      # - actual_search_hours = FeeAssessment.estimated_search_hours    # frozen at estimate time
      # - actual_review_hours = FeeAssessment.estimated_review_hours    # frozen at estimate time
      #
      # IMPORTANT — Withheld-pages rule (differs from estimate):
      #   Pages of WITHHELD_FULL records DO NOT count toward chargeable_pages,
      #   but pages of RELEASED_REDACTED records count in full.
      #
      # Cap rule (NOT in estimate): final_total_cents is capped at
      #   max(estimate_total_cents, FINAL_CAP_MULTIPLIER * estimate_total_cents)
      # where FINAL_CAP_MULTIPLIER = 1.25 ; if estimate_total_cents == 0 then cap = FREE_THRESHOLD_CENTS - 1
      # so a waived/free-threshold request can never be billed at finalization.
      #
      # Evaluation order:
      #   (1) recompute tier-specific chargeable quantities using actuals
      #   (2) multiply, sum  (integer cents)
      #   (3) apply free-threshold collapse
      #   (4) apply cap rule
      # If step (3) zeroes out the subtotal, step (4) is skipped.
    input_set: "ResponsiveRecord.page_count where disposition IN {RELEASED_FULL, RELEASED_REDACTED}, ordered by ResponsiveRecord.created_at ASC (immaterial here because pages aggregate, but pinned for determinism)"
    constants:
      SEARCH_RATE_CENTS_PER_HOUR: 4500
      REVIEW_RATE_CENTS_PER_HOUR: 6000
      COPY_RATE_CENTS_PER_PAGE: 10
      FREE_PAGES: 100
      FREE_SEARCH_HOURS: 2
      FREE_THRESHOLD_CENTS: 1400
      FINAL_CAP_MULTIPLIER_TIMES_100: 125       # represents 1.25, kept integer for exactness
    precision: "integer cents; cap multiplication uses (estimate_total_cents * 125) // 100 to keep arithmetic deterministic"
    variants:
      - name: estimate_variant
        when: "Called via calc_fee_estimate"
        difference: "Uses estimated_pages straight from input; no withheld-pages distinction; no cap rule."
      - name: final_variant
        when: "Called via calc_fee_final"
        difference: "Excludes WITHHELD_FULL pages from chargeable_pages; applies cap rule on top of the free-threshold rule."

  - name: calc_response_deadline
    trigger: "Set on Request.INTAKE → ACKNOWLEDGED; recomputed on every tolling resume"
    algorithm: interval_merge
    formula: |
      # Inputs: filed_at (datetime), tolling_days_consumed (integer), holidays set (constant)
      #
      # response_due_at = add_business_days(filed_at, RESPONSE_DAYS + tolling_days_consumed)
      #
      # add_business_days(start, n):
      #   d = start
      #   count = 0
      #   while count < n:
      #       d = d + 1 day
      #       if d is Mon-Fri AND d not in HOLIDAYS:
      #           count += 1
      #   return d at filed_at's time-of-day
      #
      # Boundary rules pinned:
      #   - filed_at itself does NOT count toward the n days (start the next business day).
      #   - "now() >= response_due_at" triggers a soft overdue flag (an audit entry; no auto-state-change).
      #   - tolling_days_consumed cannot exceed MAX_TOLL_DAYS = 30; any /start-tolling that would
      #     push beyond MAX_TOLL_DAYS is rejected (ERR_TOLLING_LIMIT_EXCEEDED).
    input_set: "Single Request"
    constants:
      RESPONSE_DAYS: 20
      MAX_TOLL_DAYS: 30
      HOLIDAYS: ["2026-01-01", "2026-07-04", "2026-12-25"]   # narrow seed set; implementation may extend
    precision: "datetime at minute precision; time-of-day preserved from filed_at"

  - name: calc_third_party_deadline
    trigger: "ThirdPartyNotice creation (POST /foia/third-party-notices)"
    algorithm: interval_merge
    formula: |
      # response_deadline = add_business_days(notice.created_at, THIRD_PARTY_DAYS)
      # Same add_business_days primitive as calc_response_deadline.
      # Boundary: now() >= response_deadline triggers automatic transition PENDING_RESPONSE → EXPIRED
      # when the clock-advance endpoint runs and the notice is still PENDING_RESPONSE.
    input_set: "Single ThirdPartyNotice"
    constants:
      THIRD_PARTY_DAYS: 10
      HOLIDAYS: ["2026-01-01", "2026-07-04", "2026-12-25"]
    precision: "datetime at minute precision"

# =====================================================================
# §1.4 Validation Rules Table (priority-ordered)
# =====================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present, non-empty"
    error_id: ERR_MISSING_AUTH
    http_status: 401
    applies_to: "all (except GET /healthz)"

  - priority: 2
    category: auth
    check: "X-User-Role is one of {Requester, Officer, AppealAuthority, ThirdParty, ClockOperator}"
    error_id: ERR_INVALID_ROLE
    http_status: 401
    applies_to: "all"

  - priority: 3
    category: auth
    check: "Role permitted to invoke this endpoint per §1.7"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all"

  - priority: 4
    category: existence
    check: "Path-parameter resources exist (Request, Appeal, ResponsiveRecord, ThirdPartyNotice, FeeAssessment, Requester) — validated left-to-right in URL path"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all path-parameterized endpoints"

  - priority: 5
    category: existence
    check: "Referenced FK in body resolves (e.g., POST ResponsiveRecord body.request_id exists)"
    error_id: ERR_FK_NOT_FOUND
    http_status: 404
    applies_to: "POST endpoints accepting foreign keys in body"

  - priority: 6
    category: state
    check: "Target resource is in a state from which the requested transition is allowed (per §1.2)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action endpoints"

  - priority: 7
    category: business_safety
    check: "Segregation of duties — AppealAuthority accepting an appeal MUST NOT be the actor recorded as deciding_officer on the underlying Request's DETERMINATION_ISSUED audit entry"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /foia/appeals/{id}/accept-for-review, POST /foia/appeals/{id}/decide"

  - priority: 8
    category: business_safety
    check: "Glomar exemption basis must be drawn from {B1, B6, B7C} only; other exemption codes cannot justify Glomar"
    error_id: ERR_INVALID_GLOMAR_BASIS
    http_status: 422
    applies_to: "POST /foia/requests/{id}/issue-glomar"

  - priority: 9
    category: business_referential
    check: "ResponsiveRecord.contains_third_party_info == true implies third_party_id is non-null AND a ThirdPartyNotice MUST be created before close-search succeeds"
    error_id: ERR_MISSING_THIRD_PARTY_NOTICE
    http_status: 422
    applies_to: "POST /foia/requests/{id}/close-search; POST /foia/responsive-records"

  - priority: 10
    category: business_constraint
    check: "Tolling — /start-tolling rejected when tolling_days_consumed would exceed MAX_TOLL_DAYS (30) after the implied increment; checked BEFORE state precondition because cumulative tolling is a hard regulatory cap"
    error_id: ERR_TOLLING_LIMIT_EXCEEDED
    http_status: 422
    applies_to: "POST /foia/requests/{id}/start-tolling"

  - priority: 11
    category: business_temporal
    check: "Third-party /consent or /object rejected when now() >= ThirdPartyNotice.response_deadline (notice has run out the clock)"
    error_id: ERR_THIRD_PARTY_DEADLINE_PASSED
    http_status: 422
    applies_to: "POST /foia/third-party-notices/{id}/consent, /object"

  - priority: 12
    category: business_temporal
    check: "Appeal /decide rejected when Appeal.filed_at + 20 business days < now() AND appellant_role == REQUESTER — late requester appeals must be /dismiss-ed, not /decide-d"
    error_id: ERR_APPEAL_WINDOW_EXPIRED
    http_status: 422
    applies_to: "POST /foia/appeals/{id}/decide"

  - priority: 13
    category: business_constraint
    check: "Exactly one ExemptionClaim per (record_id, exemption_code) — duplicates rejected"
    error_id: ERR_DUPLICATE_EXEMPTION
    http_status: 409
    applies_to: "POST /foia/exemption-claims"

  - priority: 14
    category: business_constraint
    check: "ResponsiveRecord cannot be created on a Request not in SEARCH; Glomar requests reject record creation entirely"
    error_id: ERR_RECORDS_FORBIDDEN_ON_GLOMAR
    http_status: 422
    applies_to: "POST /foia/responsive-records"

  - priority: 15
    category: business_fiscal
    check: "Fee waiver only available for non-commercial tiers (EDUCATIONAL_NONCOMMERCIAL or PUBLIC_INTEREST)"
    error_id: ERR_WAIVER_NOT_ELIGIBLE
    http_status: 422
    applies_to: "POST /foia/fee-assessments/{id}/waive"

  - priority: 16
    category: business_fiscal
    check: "/start-search blocked when FeeAssessment exists and is not in {ACCEPTED, WAIVED} AND estimate_total_cents > FREE_THRESHOLD_CENTS"
    error_id: ERR_FEE_NOT_RESOLVED
    http_status: 422
    applies_to: "POST /foia/requests/{id}/start-search"

  - priority: 17
    category: business_constraint
    check: "Glomar requires zero ResponsiveRecords for this Request (Glomar = neither confirm nor deny existence)"
    error_id: ERR_GLOMAR_WITH_RECORDS
    http_status: 422
    applies_to: "POST /foia/requests/{id}/issue-glomar"

  - priority: 18
    category: business_constraint
    check: "Determine: at least one ResponsiveRecord must exist on a non-Glomar Request before /determine"
    error_id: ERR_NO_RESPONSIVE_RECORDS
    http_status: 422
    applies_to: "POST /foia/requests/{id}/determine"

  - priority: 19
    category: business_constraint
    check: "OCC version mismatch on PATCH endpoints (body.version != resource.version)"
    error_id: ERR_VERSION_CONFLICT
    http_status: 409
    applies_to: "PATCH endpoints"

  - priority: 20
    category: business_constraint
    check: "Input shape — request body conforms to declared schema (required fields present, enums valid, numeric ranges respected)"
    error_id: ERR_INVALID_INPUT
    http_status: 400
    applies_to: "all body-accepting endpoints (catch-all when more specific business rule does not apply)"

# =====================================================================
# §1.5 API Endpoint Table
# =====================================================================
endpoints:
  # ---- Requester ----
  - method: POST
    path: "/foia/requesters"
    description: "Register a Requester profile."
    roles: [Requester, Officer]
    code: 201
    input: [full_name, contact_email, requester_tier, "tier_justification?"]
    output: Requester
    side_effects: []

  - method: GET
    path: "/foia/requesters/{id}"
    description: "Fetch a Requester."
    roles: [Requester, Officer, AppealAuthority]
    code: 200
    input: []
    output: Requester
    side_effects: []

  - method: PATCH
    path: "/foia/requesters/{id}"
    description: "Update tier or contact info (requires version)."
    roles: [Requester, Officer]
    code: 200
    input: ["requester_tier?", "tier_justification?", "contact_email?", version]
    output: Requester
    side_effects: []

  # ---- Request ----
  - method: POST
    path: "/foia/requests"
    description: "File a FOIA request (initial intake)."
    roles: [Requester]
    code: 201
    input: [requester_id, subject_summary, "fee_waiver_requested?"]
    output: Request
    side_effects: ["Append AuditEntry(INTAKE_RECEIVED)"]

  - method: GET
    path: "/foia/requests/{id}"
    description: "Fetch a Request with computed fields."
    roles: [Requester, Officer, AppealAuthority]
    code: 200
    input: []
    output: Request
    side_effects: []

  - method: GET
    path: "/foia/requests"
    description: "List requests with filter on status, requester_id."
    roles: [Officer, AppealAuthority]
    code: 200
    input: ["status?", "requester_id?", "limit?", "offset?"]
    output: "Request[]"
    side_effects: []

  - method: POST
    path: "/foia/requests/{id}/acknowledge"
    description: "Officer acknowledges; sets filed_at and computes response_due_at."
    roles: [Officer]
    code: 200
    input: []
    output: Request
    side_effects: ["calc_response_deadline; append audit"]

  - method: POST
    path: "/foia/requests/{id}/start-tolling"
    description: "Officer pauses the 20-day clock for fee-question/clarification."
    roles: [Officer]
    code: 200
    input: [reason]
    output: Request
    side_effects: ["Audit TOLLING_STARTED"]

  - method: POST
    path: "/foia/requests/{id}/resume-clock"
    description: "Officer ends a tolling pause and recomputes response_due_at."
    roles: [Officer]
    code: 200
    input: []
    output: Request
    side_effects: ["calc_response_deadline; audit TOLLING_ENDED"]

  - method: POST
    path: "/foia/requests/{id}/start-search"
    description: "Move ACKNOWLEDGED → SEARCH."
    roles: [Officer]
    code: 200
    input: []
    output: Request
    side_effects: []

  - method: POST
    path: "/foia/requests/{id}/close-search"
    description: "Move SEARCH → DETERMINATION_PENDING. Triggers calc_fee_final."
    roles: [Officer]
    code: 200
    input: []
    output: Request
    side_effects: ["calc_fee_final on FeeAssessment; FeeAssessment.status→FINALIZED"]

  - method: POST
    path: "/foia/requests/{id}/determine"
    description: "Issue final determination — RELEASED, PARTIAL_RELEASE, or DENIED depending on record dispositions."
    roles: [Officer]
    code: 200
    input: []
    output: Request
    side_effects: ["Set Request.determination_at; audit DETERMINATION_ISSUED"]

  - method: POST
    path: "/foia/requests/{id}/issue-glomar"
    description: "Issue a Glomar response (neither confirm nor deny)."
    roles: [Officer]
    code: 200
    input: [glomar_exemption_basis]
    output: Request
    side_effects: ["audit GLOMAR_ISSUED"]

  - method: POST
    path: "/foia/requests/{id}/withdraw"
    description: "Requester withdraws an open request."
    roles: [Requester]
    code: 200
    input: []
    output: Request
    side_effects: ["FeeAssessment→WAIVED if exists; audit"]

  - method: POST
    path: "/foia/requests/{id}/resume-search"
    description: "Officer reopens SEARCH after a REMANDED appeal."
    roles: [Officer]
    code: 200
    input: []
    output: Request
    side_effects: []

  # ---- ResponsiveRecord ----
  - method: POST
    path: "/foia/responsive-records"
    description: "Officer records a responsive record found during search."
    roles: [Officer]
    code: 201
    input: [request_id, title, page_count, "contains_third_party_info?", "third_party_id?"]
    output: ResponsiveRecord
    side_effects: ["No automatic third-party notice creation; must be created explicitly via POST /foia/third-party-notices"]

  - method: GET
    path: "/foia/responsive-records/{id}"
    description: "Fetch a responsive record."
    roles: [Officer, AppealAuthority]
    code: 200
    input: []
    output: ResponsiveRecord
    side_effects: []

  - method: PATCH
    path: "/foia/responsive-records/{id}/disposition"
    description: "Officer sets per-record disposition based on ExemptionClaims and ThirdPartyNotice status."
    roles: [Officer]
    code: 200
    input: [disposition, version]
    output: ResponsiveRecord
    side_effects: []

  # ---- ExemptionClaim ----
  - method: POST
    path: "/foia/exemption-claims"
    description: "Officer claims one of the 9 FOIA exemptions on a record."
    roles: [Officer]
    code: 201
    input: [record_id, exemption_code, redaction_scope, rationale]
    output: ExemptionClaim
    side_effects: ["audit EXEMPTION_CLAIMED"]

  - method: GET
    path: "/foia/exemption-claims"
    description: "List exemption claims filtered by record_id or exemption_code."
    roles: [Officer, AppealAuthority, Requester]
    code: 200
    input: ["record_id?", "exemption_code?", "limit?", "offset?"]
    output: "ExemptionClaim[]"
    side_effects: []

  # ---- ThirdPartyNotice ----
  - method: POST
    path: "/foia/third-party-notices"
    description: "Officer sends a Reverse-FOIA notice to a third party."
    roles: [Officer]
    code: 201
    input: [request_id, record_id]
    output: ThirdPartyNotice
    side_effects: ["calc_third_party_deadline; audit THIRD_PARTY_NOTIFIED"]

  - method: POST
    path: "/foia/third-party-notices/{id}/consent"
    description: "Third party consents to release."
    roles: [ThirdParty]
    code: 200
    input: []
    output: ThirdPartyNotice
    side_effects: []

  - method: POST
    path: "/foia/third-party-notices/{id}/object"
    description: "Third party objects to release."
    roles: [ThirdParty]
    code: 200
    input: [objection_grounds]
    output: ThirdPartyNotice
    side_effects: []

  - method: POST
    path: "/foia/third-party-notices/{id}/override"
    description: "AppealAuthority overrides an objection after the Reverse-FOIA appeal resolves against the third party."
    roles: [AppealAuthority]
    code: 200
    input: []
    output: ThirdPartyNotice
    side_effects: []

  - method: GET
    path: "/foia/third-party-notices/{id}"
    description: "Fetch a notice."
    roles: [Officer, AppealAuthority, ThirdParty]
    code: 200
    input: []
    output: ThirdPartyNotice
    side_effects: []

  # ---- Appeal ----
  - method: POST
    path: "/foia/appeals"
    description: "Requester or ThirdParty files an appeal."
    roles: [Requester, ThirdParty]
    code: 201
    input: [request_id, appellant_role, grounds]
    output: Appeal
    side_effects: ["audit APPEAL_FILED"]

  - method: POST
    path: "/foia/appeals/{id}/accept-for-review"
    description: "AppealAuthority accepts the appeal (segregation-of-duties check)."
    roles: [AppealAuthority]
    code: 200
    input: []
    output: Appeal
    side_effects: []

  - method: POST
    path: "/foia/appeals/{id}/decide"
    description: "AppealAuthority decides: UPHELD, REVERSED, or REMANDED."
    roles: [AppealAuthority]
    code: 200
    input: [decision]
    output: Appeal
    side_effects: ["If decision=REMANDED, cascade to Request → REOPENED_BY_APPEAL"]

  - method: POST
    path: "/foia/appeals/{id}/dismiss"
    description: "AppealAuthority dismisses an out-of-window requester appeal."
    roles: [AppealAuthority]
    code: 200
    input: []
    output: Appeal
    side_effects: []

  - method: GET
    path: "/foia/appeals/{id}"
    description: "Fetch an appeal."
    roles: [Requester, Officer, AppealAuthority, ThirdParty]
    code: 200
    input: []
    output: Appeal
    side_effects: []

  - method: GET
    path: "/foia/appeals"
    description: "List appeals filtered by status, request_id, appellant_role."
    roles: [Officer, AppealAuthority]
    code: 200
    input: ["status?", "request_id?", "appellant_role?", "limit?", "offset?"]
    output: "Appeal[]"
    side_effects: []

  # ---- FeeAssessment ----
  - method: POST
    path: "/foia/fee-assessments"
    description: "Officer creates a fee assessment for a Request."
    roles: [Officer]
    code: 201
    input: [request_id, estimated_pages, estimated_search_hours, estimated_review_hours]
    output: FeeAssessment
    side_effects: []

  - method: POST
    path: "/foia/fee-assessments/{id}/estimate"
    description: "Compute estimate_total_cents using calc_fee_estimate."
    roles: [Officer]
    code: 200
    input: []
    output: FeeAssessment
    side_effects: ["calc_fee_estimate"]

  - method: POST
    path: "/foia/fee-assessments/{id}/accept"
    description: "Requester accepts the estimate."
    roles: [Requester]
    code: 200
    input: []
    output: FeeAssessment
    side_effects: ["Request.fee_estimate_accepted = true"]

  - method: POST
    path: "/foia/fee-assessments/{id}/waive"
    description: "Officer grants a fee waiver."
    roles: [Officer]
    code: 200
    input: []
    output: FeeAssessment
    side_effects: ["Request.fee_waiver_granted = true; estimate_total_cents = 0"]

  - method: GET
    path: "/foia/fee-assessments/{id}"
    description: "Fetch a fee assessment."
    roles: [Officer, Requester]
    code: 200
    input: []
    output: FeeAssessment
    side_effects: []

  # ---- AuditEntry ----
  - method: GET
    path: "/foia/audit-entries"
    description: "List audit entries filtered by subject_type, subject_id, event_code."
    roles: [Officer, AppealAuthority]
    code: 200
    input: ["subject_type?", "subject_id?", "event_code?", "limit?", "offset?"]
    output: "AuditEntry[]"
    side_effects: []

  # ---- Test-driving (clock + sweep) ----
  - method: POST
    path: "/foia/_clock/advance"
    description: "Test-driving: advance the server's notion of current time. Required to reach time-gated states (response_due_at, third-party EXPIRED, appeal-window expiration). Runs the sweep automatically after advancing."
    roles: [ClockOperator]
    code: 200
    input: [to_iso_datetime]
    output: "object"   # returns the new server time
    side_effects: ["Triggers sweep: every PENDING_RESPONSE ThirdPartyNotice with response_deadline <= new clock transitions to EXPIRED; audit entries emitted"]

  - method: POST
    path: "/foia/_sweep/run"
    description: "Test-driving: idempotently run the sweep without advancing the clock."
    roles: [ClockOperator]
    code: 200
    input: []
    output: "object"
    side_effects: ["Same as above sweep — promotes EXPIRED on overdue notices"]

  - method: GET
    path: "/foia/_clock"
    description: "Test-driving: read current server clock."
    roles: [ClockOperator, Officer]
    code: 200
    input: []
    output: "object"
    side_effects: []

  - method: GET
    path: "/healthz"
    description: "Liveness probe (no auth)."
    roles: []
    code: 200
    input: []
    output: "object"
    side_effects: []

# =====================================================================
# §1.6 Error Code Catalog
# =====================================================================
errors:
  - id: ERR_MISSING_AUTH
    http: 401
    condition: "Missing or empty X-User-ID / X-User-Role header"
  - id: ERR_INVALID_ROLE
    http: 401
    condition: "X-User-Role not one of the declared roles"
  - id: ERR_FORBIDDEN
    http: 403
    condition: "Role lacks permission for this endpoint"
  - id: ERR_NOT_FOUND
    http: 404
    condition: "Path-parameterized resource id does not exist"
  - id: ERR_FK_NOT_FOUND
    http: 404
    condition: "Body foreign-key references a non-existent resource"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "Target resource not in a state that admits this transition"
  - id: ERR_VERSION_CONFLICT
    http: 409
    condition: "PATCH body.version != current resource.version"
  - id: ERR_DUPLICATE_APPEAL
    http: 409
    condition: "Open appeal already exists for (request_id, appellant_role)"
  - id: ERR_FEE_ASSESSMENT_EXISTS
    http: 409
    condition: "Second FeeAssessment for the same Request"
  - id: ERR_NOTICE_ALREADY_CLOSED
    http: 409
    condition: "ThirdPartyNotice already in a terminal state when consent/object/override attempted"
  - id: ERR_DUPLICATE_EXEMPTION
    http: 409
    condition: "Duplicate ExemptionClaim on (record_id, exemption_code)"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "AppealAuthority X-User-ID matches the officer who issued the original determination"
  - id: ERR_INVALID_GLOMAR_BASIS
    http: 422
    condition: "Glomar exemption basis array contains codes outside {B1, B6, B7C} or is empty"
  - id: ERR_MISSING_THIRD_PARTY_NOTICE
    http: 422
    condition: "ResponsiveRecord contains_third_party_info=true with no corresponding ThirdPartyNotice when close-search is attempted, or third_party_id missing on the record"
  - id: ERR_TOLLING_LIMIT_EXCEEDED
    http: 422
    condition: "Tolling start would push cumulative tolling beyond MAX_TOLL_DAYS (30 business days)"
  - id: ERR_THIRD_PARTY_DEADLINE_PASSED
    http: 422
    condition: "Third party consent/object after now() >= response_deadline"
  - id: ERR_APPEAL_WINDOW_EXPIRED
    http: 422
    condition: "Requester appeal /decide attempted after 20 business days from Appeal.filed_at"
  - id: ERR_RECORDS_FORBIDDEN_ON_GLOMAR
    http: 422
    condition: "Attempt to create ResponsiveRecord on a Request that has glomar_invoked=true or is not in SEARCH"
  - id: ERR_WAIVER_NOT_ELIGIBLE
    http: 422
    condition: "Fee waiver requested for COMMERCIAL tier or waiver action invoked on the wrong tier"
  - id: ERR_FEE_NOT_RESOLVED
    http: 422
    condition: "Start-search blocked: estimate exceeds free threshold and FeeAssessment status is not ACCEPTED/WAIVED"
  - id: ERR_GLOMAR_WITH_RECORDS
    http: 422
    condition: "Glomar attempted while at least one ResponsiveRecord exists for the Request"
  - id: ERR_NO_RESPONSIVE_RECORDS
    http: 422
    condition: "Determine attempted on a non-Glomar Request with zero ResponsiveRecords"
  - id: ERR_INVALID_INPUT
    http: 400
    condition: "Schema violation: missing required field, unknown enum value, wrong type, or numeric out of range"

# =====================================================================
# §1.7 RBAC Matrix
# =====================================================================
roles:
  - name: Requester
    description: "End user filing a FOIA request and (optionally) appealing its determination."
    identity: "entity_backed:Requester"
    exclusive_operations:
      - "POST /foia/requests"
      - "POST /foia/requests/{id}/withdraw"
      - "POST /foia/fee-assessments/{id}/accept"
    shared_operations:
      - "POST /foia/appeals  (only when appellant_role=REQUESTER)"
      - "GET /foia/requests/{id} (own requests only — server enforces X-User-ID == Request.requester_id)"
      - "GET /foia/requesters/{id} (own profile only)"
      - "GET /foia/exemption-claims (read-only for own request's records)"

  - name: Officer
    description: "Agency FOIA Officer responsible for intake, search, exemption claims, fee assessment, and determinations."
    identity: "opaque"
    exclusive_operations:
      - "POST /foia/requests/{id}/acknowledge"
      - "POST /foia/requests/{id}/start-tolling"
      - "POST /foia/requests/{id}/resume-clock"
      - "POST /foia/requests/{id}/start-search"
      - "POST /foia/requests/{id}/close-search"
      - "POST /foia/requests/{id}/determine"
      - "POST /foia/requests/{id}/issue-glomar"
      - "POST /foia/requests/{id}/resume-search"
      - "POST /foia/responsive-records"
      - "PATCH /foia/responsive-records/{id}/disposition"
      - "POST /foia/exemption-claims"
      - "POST /foia/third-party-notices"
      - "POST /foia/fee-assessments"
      - "POST /foia/fee-assessments/{id}/estimate"
      - "POST /foia/fee-assessments/{id}/waive"
    shared_operations:
      - "GET /foia/requests, GET /foia/requests/{id}"
      - "GET /foia/responsive-records/{id}"
      - "GET /foia/exemption-claims"
      - "GET /foia/appeals, GET /foia/appeals/{id}"
      - "GET /foia/audit-entries"

  - name: AppealAuthority
    description: "Senior reviewer who adjudicates appeals; subject to segregation-of-duties against the Officer who issued the underlying determination."
    identity: "opaque"
    exclusive_operations:
      - "POST /foia/appeals/{id}/accept-for-review"
      - "POST /foia/appeals/{id}/decide"
      - "POST /foia/appeals/{id}/dismiss"
      - "POST /foia/third-party-notices/{id}/override"
    shared_operations:
      - "GET /foia/appeals, GET /foia/appeals/{id}"
      - "GET /foia/requests, GET /foia/requests/{id}"
      - "GET /foia/responsive-records/{id}"
      - "GET /foia/audit-entries"

  - name: ThirdParty
    description: "External submitter whose business information appears in responsive records; receives Reverse-FOIA notice and may consent, object, or file a Reverse-FOIA appeal."
    identity: "opaque"
    exclusive_operations:
      - "POST /foia/third-party-notices/{id}/consent"
      - "POST /foia/third-party-notices/{id}/object"
    shared_operations:
      - "POST /foia/appeals (only when appellant_role=THIRD_PARTY)"
      - "GET /foia/third-party-notices/{id}"

  - name: ClockOperator
    description: "Test-driving operator capable of advancing the server clock and running sweeps. Not a real-world FOIA actor; exists to make time-gated transitions reachable from tests per §1.5 testability-completeness."
    identity: "opaque"
    exclusive_operations:
      - "POST /foia/_clock/advance"
      - "POST /foia/_sweep/run"
    shared_operations:
      - "GET /foia/_clock"
