            - { call: "POST /admissions/evaluations", payload: { application_id: "${appB}", kind: "TEST", scheduled_start: "2026-10-10T10:00:00Z", scheduled_end: "2026-10-10T11:00:00Z", test_session_id: "${tss}" }, as: AdmissionOfficer, captures: { evB: $.data.id } }
