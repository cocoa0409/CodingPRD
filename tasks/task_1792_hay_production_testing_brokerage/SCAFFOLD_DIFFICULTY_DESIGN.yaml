  # ---------------------------------------------------------------------------
  # Rule 8 — resource_temporal_overlap (different interval semantics)
  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: cutting_window_half_open_overlap
        grounds:
          - validations[priority=8]
          - entities.Cutting.fields.planned_window_start
        distinguishing_aspect: |
          Resource = Field, semantics = half-open intervals: window [2026-06-20, 2026-07-01) touching an
          existing [2026-06-10, 2026-06-20) at the boundary date is ALLOWED (no shared day), while
          [2026-06-19, 2026-06-28) overlapping by one day is rejected.
        test_recipe:
          setup:
            - "Grower/Field; Cutting #1 [2026-06-10, 2026-06-20) exists"
          setup_api_calls:
            - { call: "POST /api/growers", payload: { name: "Grower Fourteen", region_code: "OR-WILLAMETTE" }, as: PlatformAdmin, captures: { g14_id: "$.data.id" } }
            - { call: "POST /api/fields", payload: { grower_id: "${g14_id}", name: "Delta 2", acres: 100.0, forage_type: "GRASS" }, as: Grower, as_user_id: "${g14_id}", captures: { f14_id: "$.data.id" } }
            - { call: "POST /api/cuttings", payload: { field_id: "${f14_id}", cutting_number: 1, season_year: 2026, planned_window_start: "2026-06-10", planned_window_end: "2026-06-20" }, as: Grower, as_user_id: "${g14_id}" }
          trigger:
            - { call: "POST /api/cuttings", payload: { field_id: "${f14_id}", cutting_number: 2, season_year: 2026, planned_window_start: "2026-06-20", planned_window_end: "2026-07-01" }, as: Grower, as_user_id: "${g14_id}", captures: { c14b_id: "$.data.id" } }
            - { call: "POST /api/cuttings", payload: { field_id: "${f14_id}", cutting_number: 3, season_year: 2026, planned_window_start: "2026-06-19", planned_window_end: "2026-06-28" }, as: Grower, as_user_id: "${g14_id}", captures: { c14_err: "$.data.error_id" } }
          assert:
            - "adjacent window starting on the prior window's end date succeeds (half-open adjacency)"
            - "one-day-overlapping window fails with error_id == ERR_FIELD_WINDOW_OVERLAP"
      - name: equipment_buffer_day_gap
        grounds:
          - validations[priority=8]
          - entities.BalingServiceOrder.fields.equipment_unit
        distinguishing_aspect: |
          Resource = equipment_unit, semantics = mandatory idle-day buffer (different from the half-open
          cutting windows AND a different resource): jobs 1 day apart conflict, jobs exactly 2 days apart
          are allowed.
        test_recipe:
          setup:
            - "Grower with two fields; both cuttings' windows 2026-07-25..2026-08-10 driven WINDOW_OPEN by dry reports"
            - "BalingServiceOrder A on cutting 1, order B on cutting 2, both REQUESTED"
          setup_api_calls:
            - { call: "POST /api/growers", payload: { name: "Grower Fifteen", region_code: "OR-WILLAMETTE" }, as: PlatformAdmin, captures: { g15_id: "$.data.id" } }
            - { call: "POST /api/fields", payload: { grower_id: "${g15_id}", name: "East 1", acres: 50.0, forage_type: "ALFALFA" }, as: Grower, as_user_id: "${g15_id}", captures: { f15a_id: "$.data.id" } }
            - { call: "POST /api/fields", payload: { grower_id: "${g15_id}", name: "East 2", acres: 52.0, forage_type: "ALFALFA" }, as: Grower, as_user_id: "${g15_id}", captures: { f15b_id: "$.data.id" } }
            - { call: "POST /api/cuttings", payload: { field_id: "${f15a_id}", cutting_number: 1, season_year: 2026, planned_window_start: "2026-07-25", planned_window_end: "2026-08-10" }, as: Grower, as_user_id: "${g15_id}", captures: { c15a_id: "$.data.id" } }
            - { call: "POST /api/cuttings", payload: { field_id: "${f15b_id}", cutting_number: 1, season_year: 2026, planned_window_start: "2026-07-25", planned_window_end: "2026-08-10" }, as: Grower, as_user_id: "${g15_id}", captures: { c15b_id: "$.data.id" } }
            - { call: "POST /api/weather-reports", payload: { region_code: "OR-WILLAMETTE", report_date: "2026-07-29", precipitation_mm: 0.0, drying_index: 70 }, as: PlatformAdmin }
            - { call: "POST /api/weather-reports", payload: { region_code: "OR-WILLAMETTE", report_date: "2026-07-30", precipitation_mm: 0.0, drying_index: 70 }, as: PlatformAdmin }
            - { call: "POST /api/weather-reports", payload: { region_code: "OR-WILLAMETTE", report_date: "2026-07-31", precipitation_mm: 0.0, drying_index: 70 }, as: PlatformAdmin }
            - { call: "POST /api/baling-service-orders", payload: { grower_id: "${g15_id}", cutting_id: "${c15a_id}" }, as: Grower, as_user_id: "${g15_id}", captures: { bsoA_id: "$.data.id" } }
            - { call: "POST /api/baling-service-orders", payload: { grower_id: "${g15_id}", cutting_id: "${c15b_id}" }, as: Grower, as_user_id: "${g15_id}", captures: { bsoB_id: "$.data.id" } }
          trigger:
            - { call: "POST /api/baling-service-orders/${bsoA_id}/schedule", payload: { scheduled_date: "2026-08-03", equipment_unit: "BALER-7" }, as: BrokerOps, captures: { bsoA_st: "$.data.status" } }
            - { call: "POST /api/baling-service-orders/${bsoB_id}/schedule", payload: { scheduled_date: "2026-08-04", equipment_unit: "BALER-7" }, as: BrokerOps, captures: { bsoB_err: "$.data.error_id" } }
            - { call: "POST /api/baling-service-orders/${bsoB_id}/schedule", payload: { scheduled_date: "2026-08-05", equipment_unit: "BALER-7" }, as: BrokerOps, captures: { bsoB_st: "$.data.status" } }
          assert:
            - "BalingServiceOrder A scheduled on 2026-08-03 -> SCHEDULED"
            - "BalingServiceOrder B on 2026-08-04 (1 day later) -> error_id == ERR_EQUIPMENT_BUFFER_CONFLICT"
            - "BalingServiceOrder B on 2026-08-05 (2 days later, one idle day) -> SCHEDULED"

  # ---------------------------------------------------------------------------
  # Rule 9 — compensating_invariant (different conserved quantities)
  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: allocation_release_tonnage_invariant
        grounds:
          - calculations.shrink_tonnage
          - state_machines.LoadAllocation.OPEN_to_RELEASED
          - entities.BaleLot.fields.allocatable_tonnage
        distinguishing_aspect: |
          Conserved quantity = lot tonnage: allocatable_tonnage + open_allocated_tonnage stays constant at
          20.0 across an allocate(7.0)/release pair, and the lot returns exactly to its pre-allocation
          value — no drift from the compensating action.
        test_recipe:
          setup:
            - "Index @ 20000; lane 420mi; buyer 1000000; quote GOOD 10.0t accepted -> Contract committed 10.0"
            - "Grower chain; lot 20.0t GOOD-certified (rfv 152.0) harvested 2026-08-01 (0 months shrink at default clock)"
            - "Load cap 25.0 PLANNED"
