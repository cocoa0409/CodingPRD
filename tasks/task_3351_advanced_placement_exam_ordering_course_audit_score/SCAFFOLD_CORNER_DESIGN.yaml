  - section: consistency_model
    instances:
      - name: submit_response_carries_immediately_consistent_computed_fields
        claim_type: immediate_visibility
        grounds:
          - complexity_profile.consistency_model
          - calculations.order_fee_dual_variant.variants.provisional
          - state_machines.ExamOrder.OPEN_to_SUBMITTED.side_effects
        distinguishing_aspect: "Under the immediate consistency model the OPEN -> SUBMITTED response itself must already carry the recomputed fee and window — no follow-up read is needed to observe them, and the same-session read agrees to the cent."
        test_recipe:
          setup:
            - "Approved school at 2026-12-01T00:00:00Z with one OPEN order holding exactly one REGULAR registration"
          setup_api_calls:
            - call: "POST /ap-program/schools"
              payload: { name: "Corner Thirtytwo High", school_code: "CN0032", country_code: "US", center_code: "7032", seat_capacity: 10 }
              as: PlatformAdmin
              captures: { school_id: "$.data.id" }
            - call: "POST /ap-program/course-audits"
              payload: { school_id: "${school_id}", course_title: "AP Seminar", syllabus_hash: "h-cn-32", submitted_by_user_id: "u-cn-32" }
              as: SchoolCoordinator
              as_user_id: "${school_id}"
              captures: { audit_id: "$.data.id", audit_v1: "$.data.version" }
            - call: "POST /ap-program/course-audits/${audit_id}/status-transitions"
              payload: { to_status: "IN_REVIEW", expected_course_audit_version: "${audit_v1}" }
              as: CourseAuditReviewer
              as_user_id: "reviewer-cn-32"
              captures: { audit_v2: "$.data.version" }
            - call: "POST /ap-program/course-audits/${audit_id}/status-transitions"
              payload: { to_status: "APPROVED", expected_course_audit_version: "${audit_v2}", decision_notes: "syllabus meets the curricular requirements" }
              as: CourseAuditReviewer
              as_user_id: "reviewer-cn-32"
            - call: "POST /ap-program/students"
              payload: { full_name: "Zane Okoro", school_id: "${school_id}", student_code: "S0001", grade_level: 12 }
              as: SchoolCoordinator
              as_user_id: "${school_id}"
              captures: { student_id: "$.data.id" }
            - call: "POST /ap-program/_clock/set_current_utc"
              payload: { to_iso8601: "2026-12-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /ap-program/exam-orders"
              payload: { school_id: "${school_id}", course_audit_id: "${audit_id}", administration_year: 2027 }
              as: SchoolCoordinator
              as_user_id: "${school_id}"
              captures: { order_id: "$.data.id", order_v1: "$.data.version" }
            - call: "POST /ap-program/exam-orders/${order_id}/status-transitions"
              payload: { to_status: "OPEN", expected_exam_order_version: "${order_v1}" }
              as: SchoolCoordinator
              as_user_id: "${school_id}"
              captures: { order_v2: "$.data.version" }
            - call: "POST /ap-program/exam-registrations"
              payload: { exam_order_id: "${order_id}", student_id: "${student_id}", exam_subject: "AP-SEMINAR", registration_tier: "REGULAR" }
              as: SchoolCoordinator
              as_user_id: "${school_id}"
              captures: { reg_id: "$.data.id" }
          trigger:
            - call: "POST /ap-program/exam-orders/${order_id}/status-transitions"
              payload: { to_status: "SUBMITTED", expected_exam_order_version: "${order_v2}" }
              as: SchoolCoordinator
              as_user_id: "${school_id}"
              captures: { submitted_fee: "$.data.order_fee_cents" }
            - call: "GET /ap-program/exam-orders/${order_id}"
              payload: {}
              as: SchoolCoordinator
              as_user_id: "${school_id}"
          assert:
            - "the SUBMITTED response already carries data.status == \"SUBMITTED\", data.ordering_window == \"REGULAR\" and data.registration_count == 1"
            - "the SUBMITTED response carries order_fee_cents == 18000 and provisional_order_fee_cents == 18000"
            - "the immediate follow-up GET returns the identical order_fee_cents 18000 and unused_exam_charge_cents 0 with no lag"
