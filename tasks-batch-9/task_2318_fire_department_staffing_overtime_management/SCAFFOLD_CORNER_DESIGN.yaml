            - "Vacancy.${vac120}.status == \"FILLED\" and filled_by_assignment_id == ${asg120} — the forward link matches the reverse link"
            - "DutyShift.${sh120}.status == \"STAFFED\", open_vacancy_count == 0, assigned_headcount == 1"
            - "Firefighter.${ff120}.voluntary_ot_hours_charged == 24, ot_pass_count == 0, pending_offer_count == 0"

