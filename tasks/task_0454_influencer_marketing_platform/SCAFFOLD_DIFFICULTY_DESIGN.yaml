          (< 60) -> discovery_status DISCOVERABLE, whereas 0.85 yields 60 (>= 60) -> SUPPRESSED.
        test_recipe:
          setup:
            - "Two creators; one gets a fraud_score-59 snapshot, one gets a fraud_score-60 snapshot"
          setup_api_calls:
            - call: "POST /creators"
              payload: { handle: "@fraud59", primary_platform: "INSTAGRAM", tax_id_on_file: true }
              as: PlatformAdmin
              captures: { c59: $.data.id }
            - call: "POST /creators"
              payload: { handle: "@fraud60", primary_platform: "INSTAGRAM", tax_id_on_file: true }
              as: PlatformAdmin
              captures: { c60: $.data.id }
            - call: "POST /creators/${c59}/audience-snapshots"
              payload: { follower_count: 100000, avg_engagement_rate: 0.05, estimated_reach: 40000, fake_follower_pct: 0.84 }
              as: PlatformAdmin
              captures: { snap59_fraud: $.data.fraud_score }
          trigger:
            - call: "POST /creators/${c60}/audience-snapshots"
              payload: { follower_count: 100000, avg_engagement_rate: 0.05, estimated_reach: 40000, fake_follower_pct: 0.85 }
              as: PlatformAdmin
              captures: { snap60_fraud: $.data.fraud_score }
          assert:
            - "AudienceSnapshot for c59 has fraud_score == 59"
            - "Creator.${c59}.discovery_status == DISCOVERABLE"
            - "AudienceSnapshot for c60 has fraud_score == 60"
            - "Creator.${c60}.discovery_status == SUPPRESSED"

  # =================================================================
  # Rule 7 — Cross-entity state dependencies across different entity pairs
  # =================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: contract_sign_blocked_by_creator_brand_safety
        grounds:
          - state_machines.Contract.NEW_to_ACTIVE
          - entities.Creator.fields.brand_safety_status
          - validations[priority=11]
        distinguishing_aspect: |
          Entity pair Contract->Creator: signing a contract is rejected
          (ERR_BRAND_SAFETY_BLOCKED) because the referenced Creator's brand_safety_status is
          BLOCKED — Contract's NEW->ACTIVE transition depends on a sibling entity's state.
        test_recipe:
          setup:
            - "ACCEPTED offer for a creator who has an OPEN HIGH brand-safety flag (BLOCKED)"
          setup_api_calls:
            - call: "POST /brands"
              payload: { legal_name: "Mu", contact_email: "m@m.com", budget_cents: 1000000 }
              as: PlatformAdmin
              captures: { brand_id: $.data.id }
            - call: "POST /creators"
              payload: { handle: "@bsblock", primary_platform: "TIKTOK", tax_id_on_file: true }
              as: PlatformAdmin
              captures: { creator_id: $.data.id }
            - call: "POST /creators/${creator_id}/audience-snapshots"
              payload: { follower_count: 50000, avg_engagement_rate: 0.05, estimated_reach: 25000, fake_follower_pct: 0.05 }
              as: PlatformAdmin
            - call: "POST /campaigns"
              payload: { brand_id: "${brand_id}", title: "Mu", campaign_budget_cents: 200000, requires_ftc_disclosure: false, starts_at: "2026-02-01T00:00:00Z", ends_at: "2026-03-01T00:00:00Z" }
              as: Brand
              as_user_id: "${brand_id}"
              captures: { campaign_id: $.data.id, cv0: $.data.version }
            - call: "POST /campaigns/${campaign_id}/deliverables"
              payload: { content_type: "FEED_POST", quantity: 1, due_at: "2026-02-20T00:00:00Z", base_rate_cents: 60000 }
              as: Brand
              as_user_id: "${brand_id}"
            - call: "POST /campaigns/${campaign_id}/open"
              payload: { expected_campaign_version: "${cv0}" }
              as: Brand
              as_user_id: "${brand_id}"
            - call: "POST /offers"
              payload: { campaign_id: "${campaign_id}", creator_id: "${creator_id}", current_amount_cents: 60000, exclusivity_days: 0 }
              as: Brand
              as_user_id: "${brand_id}"
              captures: { offer_id: $.data.id, ov0: $.data.version }
            - call: "POST /offers/${offer_id}/accept"
              payload: { expected_offer_version: "${ov0}" }
              as: Creator
              as_user_id: "${creator_id}"
              captures: { ov_acc: $.data.version }
            - call: "POST /creators/${creator_id}/brand-safety-flags"
              payload: { severity: "HIGH", reason_code: "HATE_SPEECH", note: "blocked" }
              as: ComplianceOfficer
          trigger:
            - call: "POST /contracts"
              payload: { offer_id: "${offer_id}", expected_offer_version: "${ov_acc}" }
              as: Brand
              as_user_id: "${brand_id}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "data.error_id == 'ERR_BRAND_SAFETY_BLOCKED'"

      - name: start_review_requires_contract_active
        grounds:
          - state_machines.ContentSubmission.SUBMITTED_to_IN_REVIEW
          - entities.Contract.fields.status
          - state_machines.Contract.ACTIVE_to_CANCELLED
        distinguishing_aspect: |
          Entity pair ContentSubmission->Contract (a different pair than Contract->Creator):
          a submission is created while contract ACTIVE, then the contract is CANCELLED (which
          itself rejects the submission); start-review then fails because the submission was
          forced to REJECTED, proving the dependency on the parent Contract's state.
        test_recipe:
          setup:
            - "ACTIVE contract with a SUBMITTED content piece; then the contract is cancelled"
          setup_api_calls:
            - call: "POST /brands"
              payload: { legal_name: "Nu", contact_email: "n@n.com", budget_cents: 1000000 }
              as: PlatformAdmin
              captures: { brand_id: $.data.id }
            - call: "POST /creators"
              payload: { handle: "@cxstate", primary_platform: "INSTAGRAM", tax_id_on_file: true }
              as: PlatformAdmin
              captures: { creator_id: $.data.id }
            - call: "POST /creators/${creator_id}/audience-snapshots"
              payload: { follower_count: 50000, avg_engagement_rate: 0.05, estimated_reach: 25000, fake_follower_pct: 0.05 }
              as: PlatformAdmin
            - call: "POST /campaigns"
              payload: { brand_id: "${brand_id}", title: "Nu", campaign_budget_cents: 200000, requires_ftc_disclosure: false, starts_at: "2026-02-01T00:00:00Z", ends_at: "2026-03-01T00:00:00Z" }
              as: Brand
              as_user_id: "${brand_id}"
              captures: { campaign_id: $.data.id, cv0: $.data.version }
            - call: "POST /campaigns/${campaign_id}/deliverables"
              payload: { content_type: "FEED_POST", quantity: 1, due_at: "2026-02-20T00:00:00Z", base_rate_cents: 60000 }
              as: Brand
              as_user_id: "${brand_id}"
              captures: { deliverable_id: $.data.id }
            - call: "POST /campaigns/${campaign_id}/open"
              payload: { expected_campaign_version: "${cv0}" }
              as: Brand
              as_user_id: "${brand_id}"
            - call: "POST /offers"
              payload: { campaign_id: "${campaign_id}", creator_id: "${creator_id}", current_amount_cents: 60000, exclusivity_days: 0 }
              as: Brand
              as_user_id: "${brand_id}"
              captures: { offer_id: $.data.id, ov0: $.data.version }
            - call: "POST /offers/${offer_id}/accept"
              payload: { expected_offer_version: "${ov0}" }
              as: Creator
              as_user_id: "${creator_id}"
              captures: { ov_acc: $.data.version }
            - call: "POST /contracts"
              payload: { offer_id: "${offer_id}", expected_offer_version: "${ov_acc}" }
              as: Brand
              as_user_id: "${brand_id}"
              captures: { contract_id: $.data.id, kv0: $.data.version }
            - call: "POST /content-submissions"
              payload: { deliverable_id: "${deliverable_id}", contract_id: "${contract_id}", media_url: "https://x/n0", caption: "x" }
              as: Creator
              as_user_id: "${creator_id}"
              captures: { sub_id: $.data.id }
            - call: "POST /contracts/${contract_id}/cancel"
              payload: { expected_contract_version: "${kv0}" }
              as: Brand
              as_user_id: "${brand_id}"
          trigger:
            - call: "POST /content-submissions/${sub_id}/start-review"
              payload: {}
              as: ComplianceOfficer
              captures: { err: $.data.error_id }
          assert:
            - "ContentSubmission.${sub_id}.status == REJECTED (forced by contract cancel cascade)"
            - "HTTP status == 409"
            - "data.error_id == 'ERR_INVALID_STATE'"

  # =================================================================
  # Rule 8 — Resource temporal-overlap conflicts across different interval semantics
  # =================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: creator_exclusivity_halfopen_overlap_adjacency_ok
        grounds:
          - validations[priority=13]
          - state_machines.Contract.NEW_to_ACTIVE
          - entities.Contract.fields.exclusivity_end
        distinguishing_aspect: |
          Resource Creator, half-open [start,end) semantics with adjacency ALLOWED: a first
          contract holds exclusivity [2026-02-01, 2026-02-11) (10 days). A second contract
          signed at clock 2026-02-05 with 10-day exclusivity overlaps -> ERR_EXCLUSIVITY_CONFLICT.
        test_recipe:
          setup:
            - "Creator with a first ACTIVE contract, exclusivity [2026-02-01, 2026-02-11)"
            - "A second ACCEPTED offer (10-day exclusivity); clock advanced to 2026-02-05 so the new window [2026-02-05, 2026-02-15) overlaps"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /brands"
              payload: { legal_name: "Xi", contact_email: "x@x.com", budget_cents: 1000000 }
              as: PlatformAdmin
              captures: { brand_id: $.data.id }
            - call: "POST /creators"
              payload: { handle: "@xcl", primary_platform: "INSTAGRAM", tax_id_on_file: true }
              as: PlatformAdmin
              captures: { creator_id: $.data.id }
            - call: "POST /creators/${creator_id}/audience-snapshots"
              payload: { follower_count: 50000, avg_engagement_rate: 0.05, estimated_reach: 25000, fake_follower_pct: 0.05 }
              as: PlatformAdmin
            - call: "POST /campaigns"
              payload: { brand_id: "${brand_id}", title: "X1", campaign_budget_cents: 100000, requires_ftc_disclosure: false, starts_at: "2026-02-01T00:00:00Z", ends_at: "2026-02-28T00:00:00Z" }
              as: Brand
              as_user_id: "${brand_id}"
              captures: { camp1: $.data.id, cv1: $.data.version }
            - call: "POST /campaigns/${camp1}/deliverables"
              payload: { content_type: "STORY", quantity: 1, due_at: "2026-02-20T00:00:00Z", base_rate_cents: 40000 }
              as: Brand
              as_user_id: "${brand_id}"
            - call: "POST /campaigns/${camp1}/open"
              payload: { expected_campaign_version: "${cv1}" }
              as: Brand
              as_user_id: "${brand_id}"
            - call: "POST /offers"
              payload: { campaign_id: "${camp1}", creator_id: "${creator_id}", current_amount_cents: 40000, exclusivity_days: 10 }
              as: Brand
              as_user_id: "${brand_id}"
              captures: { off1: $.data.id, off1v: $.data.version }
            - call: "POST /offers/${off1}/accept"
              payload: { expected_offer_version: "${off1v}" }
              as: Creator
              as_user_id: "${creator_id}"
              captures: { off1acc: $.data.version }
            - call: "POST /contracts"
              payload: { offer_id: "${off1}", expected_offer_version: "${off1acc}" }
              as: Brand
              as_user_id: "${brand_id}"
              captures: { con1: $.data.id }
            - call: "POST /campaigns"
              payload: { brand_id: "${brand_id}", title: "X2", campaign_budget_cents: 100000, requires_ftc_disclosure: false, starts_at: "2026-05-01T00:00:00Z", ends_at: "2026-05-28T00:00:00Z" }
              as: Brand
              as_user_id: "${brand_id}"
              captures: { camp2: $.data.id, cv2: $.data.version }
            - call: "POST /campaigns/${camp2}/deliverables"
              payload: { content_type: "STORY", quantity: 1, due_at: "2026-05-20T00:00:00Z", base_rate_cents: 40000 }
              as: Brand
              as_user_id: "${brand_id}"
            - call: "POST /campaigns/${camp2}/open"
              payload: { expected_campaign_version: "${cv2}" }
              as: Brand
              as_user_id: "${brand_id}"
            - call: "POST /offers"
              payload: { campaign_id: "${camp2}", creator_id: "${creator_id}", current_amount_cents: 40000, exclusivity_days: 10 }
              as: Brand
              as_user_id: "${brand_id}"
              captures: { off2: $.data.id, off2v: $.data.version }
            - call: "POST /offers/${off2}/accept"
              payload: { expected_offer_version: "${off2v}" }
              as: Creator
              as_user_id: "${creator_id}"
              captures: { off2acc: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-05T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /contracts"
              payload: { offer_id: "${off2}", expected_offer_version: "${off2acc}" }
              as: Brand
              as_user_id: "${brand_id}"
              captures: { err: $.data.error_id }
          assert:
            - "Contract.${con1}.exclusivity_start == '2026-02-01T00:00:00.000Z'"
            - "Contract.${con1}.exclusivity_end == '2026-02-11T00:00:00.000Z'"
            - "HTTP status == 409"
            - "data.error_id == 'ERR_EXCLUSIVITY_CONFLICT'"

      - name: campaign_window_buffer_overlap_adjacency_rejected
        grounds:
          - validations[priority=14]
          - state_machines.Campaign.DRAFT_to_OPEN
          - entities.Campaign.fields.starts_at
        distinguishing_aspect: |
          Resource Brand, buffer-expanded semantics with adjacency REJECTED (different
          interval arithmetic than exclusivity): a brand's first OPEN campaign window
          [2026-02-01, 2026-02-15). A second campaign [2026-02-18, 2026-03-01) is only 3 days
          after (< CAMPAIGN_BUFFER_DAYS=7), so opening it fails ERR_CAMPAIGN_WINDOW_CONFLICT.
        test_recipe:
          setup:
            - "Brand with one OPEN campaign window [2026-02-01, 2026-02-15)"
            - "A second DRAFT campaign window [2026-02-18, 2026-03-01) (3-day gap, inside 7-day buffer)"
          setup_api_calls:
            - call: "POST /brands"
              payload: { legal_name: "Omi", contact_email: "o@o.com", budget_cents: 1000000 }
              as: PlatformAdmin
              captures: { brand_id: $.data.id }
            - call: "POST /campaigns"
              payload: { brand_id: "${brand_id}", title: "W1", campaign_budget_cents: 100000, requires_ftc_disclosure: false, starts_at: "2026-02-01T00:00:00Z", ends_at: "2026-02-15T00:00:00Z" }
              as: Brand
              as_user_id: "${brand_id}"
              captures: { camp1: $.data.id, cv1: $.data.version }
            - call: "POST /campaigns/${camp1}/deliverables"
              payload: { content_type: "STORY", quantity: 1, due_at: "2026-02-10T00:00:00Z", base_rate_cents: 40000 }
              as: Brand
              as_user_id: "${brand_id}"
            - call: "POST /campaigns/${camp1}/open"
              payload: { expected_campaign_version: "${cv1}" }
              as: Brand
              as_user_id: "${brand_id}"
            - call: "POST /campaigns"
              payload: { brand_id: "${brand_id}", title: "W2", campaign_budget_cents: 100000, requires_ftc_disclosure: false, starts_at: "2026-02-18T00:00:00Z", ends_at: "2026-03-01T00:00:00Z" }
              as: Brand
              as_user_id: "${brand_id}"
              captures: { camp2: $.data.id, cv2: $.data.version }
            - call: "POST /campaigns/${camp2}/deliverables"
              payload: { content_type: "STORY", quantity: 1, due_at: "2026-02-25T00:00:00Z", base_rate_cents: 40000 }
              as: Brand
              as_user_id: "${brand_id}"
          trigger:
            - call: "POST /campaigns/${camp2}/open"
              payload: { expected_campaign_version: "${cv2}" }
              as: Brand
              as_user_id: "${brand_id}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "data.error_id == 'ERR_CAMPAIGN_WINDOW_CONFLICT'"

  # =================================================================
  # Rule 9 — Compensating-action invariants across different conserved quantities
  # =================================================================
  - rule_id: compensating_invariant
    instances:
      - name: contract_sign_then_cancel_conserves_brand_committed
        grounds:
          - state_machines.Contract.NEW_to_ACTIVE
          - state_machines.Contract.ACTIVE_to_CANCELLED
          - calculations.brand_available_budget
        distinguishing_aspect: |
          Conserved quantity = brand.committed_cents (money). Sign debits committed_cents by
          70000 (available 30000); cancel credits it back. Invariant:
          brand.committed_cents == 0 and available_budget_cents == 100000 after the
          sign+cancel pair, exactly its pre-sign value (no drift).
        test_recipe:
          setup:
            - "Brand budget 100000c; an ACCEPTED offer 70000c for a clean creator"
          setup_api_calls:
            - call: "POST /brands"
              payload: { legal_name: "Pi", contact_email: "p@p.com", budget_cents: 100000 }
              as: PlatformAdmin
              captures: { brand_id: $.data.id }
            - call: "POST /creators"
              payload: { handle: "@inv1", primary_platform: "INSTAGRAM", tax_id_on_file: true }
              as: PlatformAdmin
              captures: { creator_id: $.data.id }
            - call: "POST /creators/${creator_id}/audience-snapshots"
              payload: { follower_count: 50000, avg_engagement_rate: 0.05, estimated_reach: 25000, fake_follower_pct: 0.05 }
              as: PlatformAdmin
            - call: "POST /campaigns"
              payload: { brand_id: "${brand_id}", title: "Pi", campaign_budget_cents: 100000, requires_ftc_disclosure: false, starts_at: "2026-02-01T00:00:00Z", ends_at: "2026-03-01T00:00:00Z" }
              as: Brand
              as_user_id: "${brand_id}"
              captures: { campaign_id: $.data.id, cv0: $.data.version }
            - call: "POST /campaigns/${campaign_id}/deliverables"
              payload: { content_type: "FEED_POST", quantity: 1, due_at: "2026-02-20T00:00:00Z", base_rate_cents: 70000 }
              as: Brand
              as_user_id: "${brand_id}"
            - call: "POST /campaigns/${campaign_id}/open"
              payload: { expected_campaign_version: "${cv0}" }
              as: Brand
              as_user_id: "${brand_id}"
            - call: "POST /offers"
              payload: { campaign_id: "${campaign_id}", creator_id: "${creator_id}", current_amount_cents: 70000, exclusivity_days: 0 }
              as: Brand
              as_user_id: "${brand_id}"
              captures: { offer_id: $.data.id, ov0: $.data.version }
            - call: "POST /offers/${offer_id}/accept"
              payload: { expected_offer_version: "${ov0}" }
              as: Creator
              as_user_id: "${creator_id}"
              captures: { ov_acc: $.data.version }
            - call: "POST /contracts"
              payload: { offer_id: "${offer_id}", expected_offer_version: "${ov_acc}" }
              as: Brand
              as_user_id: "${brand_id}"
              captures: { contract_id: $.data.id, kv0: $.data.version }
          trigger:
            - call: "POST /contracts/${contract_id}/cancel"
              payload: { expected_contract_version: "${kv0}" }
              as: Brand
              as_user_id: "${brand_id}"
          assert:
            - "Contract.${contract_id}.status == CANCELLED"
            - "Brand.${brand_id}.committed_cents == 0"
            - "Brand.${brand_id}.available_budget_cents == 100000"
            - "Campaign.${campaign_id}.committed_cents == 0"

      - name: brand_safety_flag_open_then_resolve_conserves_posture
        grounds:
          - state_machines.BrandSafetyFlag.NEW_to_OPEN
          - state_machines.BrandSafetyFlag.OPEN_to_RESOLVED
          - entities.Creator.fields.brand_safety_status
        distinguishing_aspect: |
          Conserved quantity = creator.brand_safety_status (posture enum, not money — a
          different conserved type than committed_cents). Open a HIGH flag (status BLOCKED),
          then resolve it; the posture returns to CLEAR, its exact pre-flag value (no drift).
        test_recipe:
          setup:
            - "A creator with no flags (brand_safety_status CLEAR)"
          setup_api_calls:
            - call: "POST /creators"
              payload: { handle: "@inv2", primary_platform: "TIKTOK", tax_id_on_file: true }
              as: PlatformAdmin
              captures: { creator_id: $.data.id }
            - call: "POST /creators/${creator_id}/brand-safety-flags"
              payload: { severity: "HIGH", reason_code: "NSFW", note: "temp" }
              as: ComplianceOfficer
              captures: { flag_id: $.data.id }
          trigger:
            - call: "POST /brand-safety-flags/${flag_id}/resolve"
              payload: {}
              as: ComplianceOfficer
          assert:
            - "BrandSafetyFlag.${flag_id}.status == RESOLVED"
            - "Creator.${creator_id}.brand_safety_status == CLEAR"
