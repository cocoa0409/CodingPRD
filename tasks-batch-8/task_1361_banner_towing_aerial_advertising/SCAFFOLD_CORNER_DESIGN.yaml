            - call: "POST /btaa/clients/${cid}/campaigns"
              payload: { name: "C2" }
              as: Client
              as_user_id: "${cid}"
          trigger:
            - call: "GET /btaa/clients/${cid}/campaigns"
              payload: {}
              as: PlatformAdmin
          assert:
