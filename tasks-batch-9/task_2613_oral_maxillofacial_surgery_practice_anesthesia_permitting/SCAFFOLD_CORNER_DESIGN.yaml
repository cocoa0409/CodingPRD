              payload: { practice_id: "${prac_id}", surgeon_id: "${surg_id}", room_code: "OR-1", block_start: "2026-09-14T13:00:00Z", block_end: "2026-09-14T17:00:00Z", release_deadline_hours: 48 }
              as: SchedulingCoordinator
              captures: { blk_id: $.data.id, blk_v0: $.data.version }
            - call: "POST /surgical-cases"
              payload: { practice_id: "${prac_id}", patient_id: "${pat_id}", primary_surgeon_id: "${surg_id}", planned_anesthesia_level: "LOCAL_ONLY", procedure_category: "IMPLANT", planned_start: "2026-09-14T13:00:00Z", planned_end: "2026-09-14T14:00:00Z", total_charge_cents: 90000 }
