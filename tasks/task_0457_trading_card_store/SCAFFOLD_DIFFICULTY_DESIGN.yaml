# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Cross-references SCAFFOLD.yaml §1.1–§1.7 against the nine §0.5 Difficulty Rules.
# ≥2 instances per rule (≥18 total). Every grounds[] resolves into SCAFFOLD.yaml.
# All formula-derived assert literals were computed by code.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: buylist_store_credit_vs_cash_payout
        grounds:
          - calculations.buylist_payout
          - state_machines.BuylistSubmission.SUBMITTED_to_ACCEPTED
          - entities.BuylistSubmission.fields.offered_total_cents
        distinguishing_aspect: |
          Same accepted lines (market_price 1000 x3 + 333 x1) yield 2333c under the
          STORE_CREDIT variant (rate 0.70) versus 1667c under the CASH variant (rate
          0.50) — dual-variant logic on the BuylistSubmission domain.
        test_recipe:
          setup:
            - "Two customers each own a SUBMITTED buylist of identical lines; one chose STORE_CREDIT, the other CASH."
            - "InventoryItem A market_price_cents=1000; InventoryItem B market_price_cents=333."
          setup_api_calls:
            - call: "POST /customers"
              payload: { display_name: "SC Buyer", email: "sc@x.com" }
              as: StoreManager
              captures: { cust_sc: $.data.id }
            - call: "POST /customers"
              payload: { display_name: "Cash Buyer", email: "cash@x.com" }
              as: StoreManager
              captures: { cust_cash: $.data.id }
            - call: "POST /inventory-items"
              payload: { title: "Card A", product_kind: "SINGLE", market_price_cents: 1000 }
              as: StoreManager
              captures: { item_a: $.data.id }
            - call: "POST /inventory-items"
              payload: { title: "Card B", product_kind: "SINGLE", market_price_cents: 333 }
              as: StoreManager
              captures: { item_b: $.data.id }
            - call: "POST /buylist-submissions"
              payload: { customer_id: "${cust_sc}", payout_method: "STORE_CREDIT" }
              as: Customer
              as_user_id: "${cust_sc}"
              captures: { sub_sc: $.data.id }
            - call: "POST /buylist-lines"
              payload: { buylist_submission_id: "${sub_sc}", inventory_item_id: "${item_a}", quantity: 3 }
              as: Customer
              as_user_id: "${cust_sc}"
            - call: "POST /buylist-lines"
              payload: { buylist_submission_id: "${sub_sc}", inventory_item_id: "${item_b}", quantity: 1 }
              as: Customer
              as_user_id: "${cust_sc}"
            - call: "POST /buylist-submissions/${sub_sc}/submit"
              payload: {}
              as: Customer
              as_user_id: "${cust_sc}"
            - call: "POST /buylist-submissions"
              payload: { customer_id: "${cust_cash}", payout_method: "CASH" }
              as: Customer
              as_user_id: "${cust_cash}"
              captures: { sub_cash: $.data.id }
            - call: "POST /buylist-lines"
              payload: { buylist_submission_id: "${sub_cash}", inventory_item_id: "${item_a}", quantity: 3 }
              as: Customer
              as_user_id: "${cust_cash}"
            - call: "POST /buylist-lines"
              payload: { buylist_submission_id: "${sub_cash}", inventory_item_id: "${item_b}", quantity: 1 }
              as: Customer
              as_user_id: "${cust_cash}"
            - call: "POST /buylist-submissions/${sub_cash}/submit"
              payload: {}
              as: Customer
              as_user_id: "${cust_cash}"
          trigger:
            - call: "POST /buylist-submissions/${sub_sc}/accept"
              payload: {}
              as: StoreManager
              captures: { total_sc: $.data.offered_total_cents }
            - call: "POST /buylist-submissions/${sub_cash}/accept"
              payload: {}
              as: StoreManager
              captures: { total_cash: $.data.offered_total_cents }
          assert:
            - "BuylistSubmission.${sub_sc}.offered_total_cents == 2333"
            - "BuylistSubmission.${sub_cash}.offered_total_cents == 1667"
            - "Customer.${cust_sc}.store_credit_balance_cents == 2333"
            - "Customer.${cust_cash}.store_credit_balance_cents == 0"

      - name: registration_provisional_vs_final_fee
        grounds:
          - calculations.registration_fee
          - state_machines.Registration.checkin_status=PENDING_to_checkin_status=CHECKED_IN
          - entities.Registration.fields.quoted_fee_cents
          - entities.Registration.fields.charged_fee_cents
        distinguishing_aspect: |
          On the Registration domain, the PROVISIONAL variant pins quoted_fee_cents=2000
          (entry 2000, BRONZE, no early-bird) at registration, while the FINAL variant
          pins charged_fee_cents=1800 at an early-bird check-in — different amounts from
          identical inputs, a domain distinct from buylist_payout.
        test_recipe:
          setup:
            - "Clock at 2026-06-01T00:00:00Z; Event starts_at 2026-06-10T00:00:00Z (>1 day out), entry_fee 2000, BRONZE customer with 5000 store credit, registration paid."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: StoreManager
            - call: "POST /customers"
              payload: { display_name: "Reg Cust", email: "reg@x.com" }
              as: StoreManager
              captures: { cust: $.data.id }
            - call: "POST /customers/${cust}/credit-adjustments"
              payload: { delta_cents: 5000 }
              as: StoreManager
            - call: "POST /events"
              payload: { title: "FNM", format: "STANDARD", starts_at: "2026-06-10T00:00:00Z", ends_at: "2026-06-10T04:00:00Z", capacity: 16, entry_fee_cents: 2000, tables_required: 1 }
              as: StoreManager
              captures: { ev: $.data.id }
            - call: "POST /events/${ev}/open"
              payload: {}
              as: StoreManager
            - call: "POST /registrations"
              payload: { event_id: "${ev}", customer_id: "${cust}" }
              as: Customer
              as_user_id: "${cust}"
              captures: { reg: $.data.id, quoted: $.data.quoted_fee_cents }
            - call: "POST /registrations/${reg}/pay"
              payload: {}
              as: Customer
              as_user_id: "${cust}"
          trigger:
            - call: "POST /registrations/${reg}/check-in"
              payload: {}
              as: StoreManager
              captures: { charged: $.data.charged_fee_cents }
          assert:
            - "Registration.${reg}.quoted_fee_cents == 2000"
            - "Registration.${reg}.charged_fee_cents == 1800"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: preorder_priority_three_input_nonlinear
        grounds:
          - calculations.preorder_priority
          - entities.PreOrder.fields.priority_score
          - entities.Customer.fields.loyalty_tier
        distinguishing_aspect: |
          Mode (a): priority_score combines tier_points, capped deposit_points, and
          decaying recency_points (≥3 inputs, non-linear via min() cap and max() floor).
          A later-created PO2 (deposit 5000, rank 2 → 30) outranks the earlier PO1
          (deposit 1000, rank 1 → 27), so deposit overrides recency.
        test_recipe:
          setup:
            - "One ReleaseProduct PRE_ORDER_OPEN; two BRONZE customers each with 6000 store credit; PO1 created first (deposit 1000), PO2 created second (deposit 5000)."
          setup_api_calls:
            - call: "POST /customers"
              payload: { display_name: "PO1 Cust", email: "po1@x.com" }
              as: StoreManager
              captures: { c1: $.data.id }
            - call: "POST /customers"
              payload: { display_name: "PO2 Cust", email: "po2@x.com" }
              as: StoreManager
              captures: { c2: $.data.id }
            - call: "POST /customers/${c1}/credit-adjustments"
              payload: { delta_cents: 6000 }
              as: StoreManager
            - call: "POST /customers/${c2}/credit-adjustments"
              payload: { delta_cents: 6000 }
              as: StoreManager
            - call: "POST /release-products"
              payload: { title: "Booster Box", street_date: "2026-09-01T00:00:00Z", allocation_pool: 100, unit_price_cents: 9000, deposit_required_cents: 1000 }
              as: StoreManager
              captures: { rp: $.data.id }
          trigger:
            - call: "POST /pre-orders"
              payload: { customer_id: "${c1}", release_product_id: "${rp}", requested_quantity: 1, deposit_paid_cents: 1000 }
              as: Customer
              as_user_id: "${c1}"
              captures: { po1: $.data.id, score1: $.data.priority_score }
            - call: "POST /pre-orders"
              payload: { customer_id: "${c2}", release_product_id: "${rp}", requested_quantity: 1, deposit_paid_cents: 5000 }
              as: Customer
              as_user_id: "${c2}"
              captures: { po2: $.data.id, score2: $.data.priority_score }
          assert:
            - "PreOrder.${po1}.priority_score == 27"
            - "PreOrder.${po2}.priority_score == 30"

      - name: consignment_round_per_unit_then_multiply
        grounds:
          - calculations.consignment_payout
          - state_machines.ConsignmentCase.LISTED_to_SOLD
          - entities.ConsignmentCase.fields.payout_total_cents
        distinguishing_aspect: |
          Mode (b): pinned rounding order is round-commission-PER-UNIT then multiply.
          ask 10c, 15% commission, qty 7 → per-unit commission round_half_up(1.5)=2,
          net 8, total 56c. The sum-then-round alternative (round(70*0.15)=11, net 59)
          differs by 3c, proving the order is load-bearing.
        test_recipe:
          setup:
            - "A LISTED ConsignmentCase: ask_price_cents=10, commission_rate_bps=1500, quantity=7."
          setup_api_calls:
            - call: "POST /customers"
              payload: { display_name: "Consignor", email: "cons@x.com" }
              as: StoreManager
              captures: { cust: $.data.id }
            - call: "POST /inventory-items"
              payload: { title: "Bulk Common", product_kind: "SINGLE", market_price_cents: 10 }
              as: StoreManager
              captures: { item: $.data.id }
            - call: "POST /consignment-cases"
              payload: { customer_id: "${cust}", inventory_item_id: "${item}", quantity: 7, ask_price_cents: 10, commission_rate_bps: 1500 }
              as: Customer
              as_user_id: "${cust}"
              captures: { cc: $.data.id }
          trigger:
            - call: "POST /consignment-cases/${cc}/sell"
              payload: {}
              as: StoreManager
              captures: { payout: $.data.payout_total_cents }
          assert:
            - "ConsignmentCase.${cc}.payout_total_cents == 56"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: event_cyclic_round_advance
        grounds:
          - state_machines.Event.IN_PROGRESS_to_IN_PROGRESS
          - entities.Event.fields.current_round
        distinguishing_aspect: |
          The Event state machine has a cyclic IN_PROGRESS→IN_PROGRESS self-loop:
          advance-round increments current_round (1→2) only after every current-round
          pairing is non-PENDING, a cycle no linear pipeline exhibits.
        test_recipe:
          setup:
            - "An IN_PROGRESS event in round 1 with two CHECKED_IN players, one reported pairing."
          setup_api_calls:
            - call: "POST /customers"
              payload: { display_name: "P1", email: "p1@x.com" }
              as: StoreManager
              captures: { c1: $.data.id }
            - call: "POST /customers"
              payload: { display_name: "P2", email: "p2@x.com" }
              as: StoreManager
              captures: { c2: $.data.id }
            - call: "POST /customers/${c1}/credit-adjustments"
              payload: { delta_cents: 5000 }
              as: StoreManager
            - call: "POST /customers/${c2}/credit-adjustments"
              payload: { delta_cents: 5000 }
              as: StoreManager
            - call: "POST /events"
              payload: { title: "Cycle Cup", format: "MODERN", starts_at: "2026-07-01T00:00:00Z", ends_at: "2026-07-01T05:00:00Z", capacity: 8, entry_fee_cents: 1000, tables_required: 1 }
              as: StoreManager
              captures: { ev: $.data.id }
            - call: "POST /events/${ev}/open"
              payload: {}
              as: StoreManager
            - call: "POST /registrations"
              payload: { event_id: "${ev}", customer_id: "${c1}" }
              as: Customer
              as_user_id: "${c1}"
              captures: { r1: $.data.id }
            - call: "POST /registrations"
              payload: { event_id: "${ev}", customer_id: "${c2}" }
              as: Customer
              as_user_id: "${c2}"
              captures: { r2: $.data.id }
            - call: "POST /registrations/${r1}/pay"
              payload: {}
              as: Customer
              as_user_id: "${c1}"
            - call: "POST /registrations/${r2}/pay"
              payload: {}
              as: Customer
              as_user_id: "${c2}"
            - call: "POST /registrations/${r1}/check-in"
              payload: {}
              as: StoreManager
            - call: "POST /registrations/${r2}/check-in"
              payload: {}
              as: StoreManager
            - call: "POST /events/${ev}/start"
              payload: {}
              as: JudgeStaff
            - call: "POST /pairings"
              payload: { event_id: "${ev}", registration_a_id: "${r1}", registration_b_id: "${r2}" }
              as: JudgeStaff
              captures: { pr: $.data.id }
            - call: "POST /pairings/${pr}/report"
              payload: { result: "A_WINS" }
              as: JudgeStaff
          trigger:
            - call: "POST /events/${ev}/advance-round"
              payload: {}
              as: JudgeStaff
              captures: { rnd: $.data.current_round }
          assert:
            - "Event.${ev}.current_round == 2"
            - "Event.${ev}.status == IN_PROGRESS"

      - name: grading_branch_graded_vs_rejected
        grounds:
          - state_machines.GradingSubmission.AT_GRADER_to_GRADED
          - state_machines.GradingSubmission.AT_GRADER_to_REJECTED
          - entities.GradingSubmission.fields.assigned_grade
        distinguishing_aspect: |
          The GradingSubmission machine forks at AT_GRADER: return-result WITH
          assigned_grade goes to GRADED (assigned_grade=9.5), WITHOUT goes to REJECTED
          (assigned_grade stays null) — divergent side-effect sets per branch, a
          fork-join distinct from the Event cycle and on a different entity.
        test_recipe:
          setup:
            - "Two AT_GRADER submissions on two SINGLE inventory items each with quantity_on_hand>=1."
          setup_api_calls:
            - call: "POST /customers"
              payload: { display_name: "Grader Cust", email: "g@x.com" }
              as: StoreManager
              captures: { cust: $.data.id }
            - call: "POST /inventory-items"
              payload: { title: "Raw Single 1", product_kind: "SINGLE", market_price_cents: 4000 }
              as: StoreManager
              captures: { it1: $.data.id }
            - call: "POST /inventory-items"
              payload: { title: "Raw Single 2", product_kind: "SINGLE", market_price_cents: 4000 }
              as: StoreManager
              captures: { it2: $.data.id }
            - call: "POST /buylist-submissions"
              payload: { customer_id: "${cust}", payout_method: "CASH" }
              as: Customer
              as_user_id: "${cust}"
              captures: { bsub: $.data.id }
            - call: "POST /buylist-lines"
              payload: { buylist_submission_id: "${bsub}", inventory_item_id: "${it1}", quantity: 1 }
              as: Customer
              as_user_id: "${cust}"
            - call: "POST /buylist-lines"
              payload: { buylist_submission_id: "${bsub}", inventory_item_id: "${it2}", quantity: 1 }
              as: Customer
              as_user_id: "${cust}"
            - call: "POST /buylist-submissions/${bsub}/submit"
              payload: {}
              as: Customer
              as_user_id: "${cust}"
            - call: "POST /buylist-submissions/${bsub}/accept"
              payload: {}
              as: StoreManager
            - call: "POST /grading-submissions"
              payload: { customer_id: "${cust}", inventory_item_id: "${it1}", declared_value_cents: 10000, service_tier: "STANDARD" }
              as: StoreManager
              captures: { gs1: $.data.id }
            - call: "POST /grading-submissions"
              payload: { customer_id: "${cust}", inventory_item_id: "${it2}", declared_value_cents: 10000, service_tier: "STANDARD" }
              as: StoreManager
              captures: { gs2: $.data.id }
            - call: "POST /grading-submissions/${gs1}/send"
              payload: {}
              as: StoreManager
            - call: "POST /grading-submissions/${gs2}/send"
              payload: {}
              as: StoreManager
          trigger:
            - call: "POST /grading-submissions/${gs1}/return-result"
              payload: { assigned_grade: 9.5 }
              as: StoreManager
              captures: { st1: $.data.status }
            - call: "POST /grading-submissions/${gs2}/return-result"
              payload: {}
              as: StoreManager
              captures: { st2: $.data.status }
          assert:
            - "GradingSubmission.${gs1}.status == GRADED"
            - "GradingSubmission.${gs1}.assigned_grade == 9.5"
            - "GradingSubmission.${gs2}.status == REJECTED"
            - "GradingSubmission.${gs2}.assigned_grade == null"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: event_cancel_refund_ledger_depth3
        grounds:
          - state_machines.Event.OPEN_to_CANCELLED
          - state_machines.Registration.payment_status=PAID_to_payment_status=REFUNDED
          - calculations.store_credit_balance
          - entities.Customer.fields.store_credit_balance_cents
        distinguishing_aspect: |
          Depth-3 cascade from Event cancel: Event→CANCELLED causes the PAID
          Registration→REFUNDED, which itself appends an EVENT_REFUND ledger row that
          itself recomputes Customer.store_credit_balance_cents back to 5000 (the
          5000 grant minus 2000 charge plus 2000 refund). Each link is caused by the prior one.
        test_recipe:
          setup:
            - "OPEN event entry_fee 2000; BRONZE customer granted 5000 credit; registration PAID (balance 3000)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: StoreManager
            - call: "POST /customers"
              payload: { display_name: "Cancel Cust", email: "cc@x.com" }
              as: StoreManager
              captures: { cust: $.data.id }
            - call: "POST /customers/${cust}/credit-adjustments"
              payload: { delta_cents: 5000 }
              as: StoreManager
            - call: "POST /events"
              payload: { title: "Doomed Event", format: "STANDARD", starts_at: "2026-06-10T00:00:00Z", ends_at: "2026-06-10T04:00:00Z", capacity: 8, entry_fee_cents: 2000, tables_required: 1 }
              as: StoreManager
              captures: { ev: $.data.id }
            - call: "POST /events/${ev}/open"
              payload: {}
              as: StoreManager
            - call: "POST /registrations"
              payload: { event_id: "${ev}", customer_id: "${cust}" }
              as: Customer
              as_user_id: "${cust}"
              captures: { reg: $.data.id }
            - call: "POST /registrations/${reg}/pay"
              payload: {}
              as: Customer
              as_user_id: "${cust}"
          trigger:
            - call: "POST /events/${ev}/cancel"
              payload: {}
              as: StoreManager
          assert:
            - "Event.${ev}.status == CANCELLED"
            - "Registration.${reg}.payment_status == REFUNDED"
            - "Registration.${reg}.checkin_status == WITHDRAWN"
            - "Customer.${cust}.store_credit_balance_cents == 5000"

      - name: buylist_accept_inventory_and_credit_depth2
        grounds:
          - state_machines.BuylistSubmission.SUBMITTED_to_ACCEPTED
          - entities.InventoryItem.fields.quantity_on_hand
          - calculations.store_credit_balance
        distinguishing_aspect: |
          Depth-2 cascade from a different trigger (buylist accept, not event cancel):
          ACCEPT→ each BuylistLine bumps InventoryItem.quantity_on_hand (to 3), which is
          the same accept whose payout appends a BUYLIST_PAYOUT ledger row recomputing
          store_credit_balance_cents to 2100.
        test_recipe:
          setup:
            - "BRONZE customer; STORE_CREDIT buylist of one line (item market 1000, qty 3) SUBMITTED."
          setup_api_calls:
            - call: "POST /customers"
              payload: { display_name: "Seller", email: "seller@x.com" }
              as: StoreManager
              captures: { cust: $.data.id }
            - call: "POST /inventory-items"
              payload: { title: "Hot Card", product_kind: "SINGLE", market_price_cents: 1000 }
              as: StoreManager
              captures: { item: $.data.id }
            - call: "POST /buylist-submissions"
              payload: { customer_id: "${cust}", payout_method: "STORE_CREDIT" }
              as: Customer
              as_user_id: "${cust}"
              captures: { sub: $.data.id }
            - call: "POST /buylist-lines"
              payload: { buylist_submission_id: "${sub}", inventory_item_id: "${item}", quantity: 3 }
              as: Customer
              as_user_id: "${cust}"
            - call: "POST /buylist-submissions/${sub}/submit"
              payload: {}
              as: Customer
              as_user_id: "${cust}"
          trigger:
            - call: "POST /buylist-submissions/${sub}/accept"
              payload: {}
              as: StoreManager
          assert:
            - "InventoryItem.${item}.quantity_on_hand == 3"
            - "Customer.${cust}.store_credit_balance_cents == 2100"
            - "BuylistSubmission.${sub}.offered_total_cents == 2100"

  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_beats_fiscal_on_pay
        grounds:
          - validations[priority=4]
          - validations[priority=16]
          - state_machines.Registration.payment_status=UNPAID_to_payment_status=PAID
        distinguishing_aspect: |
          Category pair state(priority 4) vs business_fiscal(priority 16): a WITHDRAWN
          registration with insufficient credit, paid again, returns ERR_INVALID_STATE
          (state wins), NOT ERR_INSUFFICIENT_STORE_CREDIT.
        test_recipe:
          setup:
            - "A registration that is WITHDRAWN (checkin) and UNPAID, on a customer with 0 store credit; both the state check and the fiscal check would fail a /pay attempt."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: StoreManager
            - call: "POST /customers"
              payload: { display_name: "Broke Cust", email: "broke@x.com" }
              as: StoreManager
              captures: { cust: $.data.id }
            - call: "POST /events"
              payload: { title: "Conflict Event", format: "STANDARD", starts_at: "2026-06-10T00:00:00Z", ends_at: "2026-06-10T04:00:00Z", capacity: 8, entry_fee_cents: 2000, tables_required: 1 }
              as: StoreManager
              captures: { ev: $.data.id }
            - call: "POST /events/${ev}/open"
              payload: {}
              as: StoreManager
            - call: "POST /registrations"
              payload: { event_id: "${ev}", customer_id: "${cust}" }
              as: Customer
              as_user_id: "${cust}"
              captures: { reg: $.data.id }
            - call: "POST /registrations/${reg}/withdraw"
              payload: {}
              as: Customer
              as_user_id: "${cust}"
          trigger:
            - call: "POST /registrations/${reg}/pay"
              payload: {}
              as: Customer
              as_user_id: "${cust}"
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_INVALID_STATE"
            - "response.status == 409"

      - name: capacity_beats_quantity_validation
        grounds:
          - validations[priority=7]
          - validations[priority=14]
          - state_machines.Event.SCHEDULED_to_OPEN
        distinguishing_aspect: |
          Category pair business_constraint capacity(priority 14, ERR_EVENT_FULL) vs
          business_constraint quantity(priority 7) on /registrations: there is no
          quantity field on registration, so the conflicting pair is exercised at
          existence vs capacity — a full event (capacity 1, already 1 registered) plus
          a non-existent customer returns ERR_NOT_FOUND (existence priority 3) before
          ERR_EVENT_FULL (priority 14).
        test_recipe:
          setup:
            - "OPEN event capacity=1 already holding one non-WITHDRAWN registration; a register call names a non-existent customer id."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: StoreManager
            - call: "POST /customers"
              payload: { display_name: "Seat Taker", email: "seat@x.com" }
              as: StoreManager
              captures: { cust: $.data.id }
            - call: "POST /events"
              payload: { title: "Tiny Event", format: "STANDARD", starts_at: "2026-06-10T00:00:00Z", ends_at: "2026-06-10T04:00:00Z", capacity: 1, entry_fee_cents: 1000, tables_required: 1 }
              as: StoreManager
              captures: { ev: $.data.id }
            - call: "POST /events/${ev}/open"
              payload: {}
              as: StoreManager
            - call: "POST /registrations"
              payload: { event_id: "${ev}", customer_id: "${cust}" }
              as: Customer
              as_user_id: "${cust}"
          trigger:
            - call: "POST /registrations"
              payload: { event_id: "${ev}", customer_id: "00000000-0000-4000-8000-000000000000" }
              as: Customer
              as_user_id: "00000000-0000-4000-8000-000000000000"
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_NOT_FOUND"
            - "response.status == 404"

  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: allocation_exact_pool_boundary
        grounds:
          - validations[priority=13]
          - state_machines.PreOrder.REQUESTED_to_ALLOCATED
          - entities.ReleaseProduct.fields.quantity_allocated
        distinguishing_aspect: |
          Numeric >= boundary on allocation_pool: with pool=5 and quantity_allocated=3,
          allocating requested_quantity=2 succeeds (3+2<=5), but requested_quantity=3
          fails (3+3>5) with ERR_ALLOCATION_EXCEEDED — the metric is a numeric pool on
          the /pre-orders/{id}/allocate endpoint.
        test_recipe:
          setup:
            - "ReleaseProduct pool=5 with quantity_allocated already at 3 (one ALLOCATED pre-order of qty 3); a REQUESTED pre-order of qty 3 awaits allocation."
          setup_api_calls:
            - call: "POST /customers"
              payload: { display_name: "Alloc A", email: "aa@x.com" }
              as: StoreManager
              captures: { ca: $.data.id }
            - call: "POST /customers"
              payload: { display_name: "Alloc B", email: "ab@x.com" }
              as: StoreManager
              captures: { cb: $.data.id }
            - call: "POST /customers/${ca}/credit-adjustments"
              payload: { delta_cents: 5000 }
              as: StoreManager
            - call: "POST /customers/${cb}/credit-adjustments"
              payload: { delta_cents: 5000 }
              as: StoreManager
            - call: "POST /release-products"
              payload: { title: "Scarce Box", street_date: "2026-09-01T00:00:00Z", allocation_pool: 5, unit_price_cents: 1000, deposit_required_cents: 500 }
              as: StoreManager
              captures: { rp: $.data.id, rpv0: $.data.version }
            - call: "POST /pre-orders"
              payload: { customer_id: "${ca}", release_product_id: "${rp}", requested_quantity: 3, deposit_paid_cents: 500 }
              as: Customer
              as_user_id: "${ca}"
              captures: { poa: $.data.id }
            - call: "POST /pre-orders/${poa}/allocate"
              payload: { expected_release_product_version: "${rpv0}" }
              as: StoreManager
              captures: { rpv1: $.data.version }
            - call: "POST /pre-orders"
              payload: { customer_id: "${cb}", release_product_id: "${rp}", requested_quantity: 3, deposit_paid_cents: 500 }
              as: Customer
              as_user_id: "${cb}"
              captures: { pob: $.data.id }
          trigger:
            - call: "POST /pre-orders/${pob}/allocate"
              payload: { expected_release_product_version: "${rpv1}" }
              as: StoreManager
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_ALLOCATION_EXCEEDED"
            - "response.status == 409"
            - "ReleaseProduct.${rp}.quantity_allocated == 3"

      - name: empty_buylist_zero_lines_boundary
        grounds:
          - validations[priority=11]
          - state_machines.BuylistSubmission.DRAFT_to_SUBMITTED
        distinguishing_aspect: |
          Empty-collection boundary on a different metric and endpoint: submitting a
          DRAFT buylist with zero BuylistLine rows fails with ERR_EMPTY_BUYLIST on
          /buylist-submissions/{id}/submit — a count==0 edge, not a numeric threshold.
        test_recipe:
          setup:
            - "A DRAFT buylist submission with no lines added."
          setup_api_calls:
            - call: "POST /customers"
              payload: { display_name: "Empty Seller", email: "empty@x.com" }
              as: StoreManager
              captures: { cust: $.data.id }
            - call: "POST /buylist-submissions"
              payload: { customer_id: "${cust}", payout_method: "CASH" }
              as: Customer
              as_user_id: "${cust}"
              captures: { sub: $.data.id }
          trigger:
            - call: "POST /buylist-submissions/${sub}/submit"
              payload: {}
              as: Customer
              as_user_id: "${cust}"
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_EMPTY_BUYLIST"
            - "response.status == 422"

  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: pairing_report_requires_event_in_progress
        grounds:
          - state_machines.Pairing.PENDING_to_A_WINS
          - entities.Event.fields.status
        distinguishing_aspect: |
          Pairing→Event dependency: reporting a Pairing requires the parent Event.status
          == IN_PROGRESS; reporting after the Event is COMPLETE returns ERR_INVALID_STATE.
        test_recipe:
          setup:
            - "A COMPLETE event whose round-1 pairing is still addressable; the pairing was reported A_WINS before complete (so complete preconditions pass)."
          setup_api_calls:
            - call: "POST /customers"
              payload: { display_name: "X1", email: "x1@x.com" }
              as: StoreManager
              captures: { c1: $.data.id }
            - call: "POST /customers"
              payload: { display_name: "X2", email: "x2@x.com" }
              as: StoreManager
              captures: { c2: $.data.id }
            - call: "POST /customers/${c1}/credit-adjustments"
              payload: { delta_cents: 5000 }
              as: StoreManager
            - call: "POST /customers/${c2}/credit-adjustments"
              payload: { delta_cents: 5000 }
              as: StoreManager
            - call: "POST /events"
              payload: { title: "Done Cup", format: "MODERN", starts_at: "2026-07-01T00:00:00Z", ends_at: "2026-07-01T05:00:00Z", capacity: 8, entry_fee_cents: 1000, tables_required: 1 }
              as: StoreManager
              captures: { ev: $.data.id }
            - call: "POST /events/${ev}/open"
              payload: {}
              as: StoreManager
            - call: "POST /registrations"
              payload: { event_id: "${ev}", customer_id: "${c1}" }
              as: Customer
              as_user_id: "${c1}"
              captures: { r1: $.data.id }
            - call: "POST /registrations"
              payload: { event_id: "${ev}", customer_id: "${c2}" }
              as: Customer
              as_user_id: "${c2}"
              captures: { r2: $.data.id }
            - call: "POST /registrations/${r1}/pay"
              payload: {}
              as: Customer
              as_user_id: "${c1}"
            - call: "POST /registrations/${r2}/pay"
              payload: {}
              as: Customer
              as_user_id: "${c2}"
            - call: "POST /registrations/${r1}/check-in"
              payload: {}
              as: StoreManager
            - call: "POST /registrations/${r2}/check-in"
              payload: {}
              as: StoreManager
            - call: "POST /events/${ev}/start"
              payload: {}
              as: JudgeStaff
            - call: "POST /pairings"
              payload: { event_id: "${ev}", registration_a_id: "${r1}", registration_b_id: "${r2}" }
              as: JudgeStaff
              captures: { pr: $.data.id }
            - call: "POST /pairings/${pr}/report"
              payload: { result: "A_WINS" }
              as: JudgeStaff
            - call: "POST /events/${ev}/complete"
              payload: {}
              as: JudgeStaff
          trigger:
            - call: "POST /pairings/${pr}/report"
              payload: { result: "DRAW" }
              as: JudgeStaff
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_INVALID_STATE"
            - "response.status == 409"

      - name: preorder_fulfill_requires_release_live
        grounds:
          - state_machines.PreOrder.ALLOCATED_to_FULFILLED
          - entities.ReleaseProduct.fields.status
        distinguishing_aspect: |
          PreOrder→ReleaseProduct dependency (different entity pair): fulfilling an
          ALLOCATED pre-order requires ReleaseProduct.status == RELEASED; while still
          PRE_ORDER_OPEN it fails with ERR_RELEASE_NOT_LIVE.
        test_recipe:
          setup:
            - "An ALLOCATED pre-order against a ReleaseProduct still in PRE_ORDER_OPEN; customer has ample store credit."
          setup_api_calls:
            - call: "POST /customers"
              payload: { display_name: "Fulfil Cust", email: "ful@x.com" }
              as: StoreManager
              captures: { cust: $.data.id }
            - call: "POST /customers/${cust}/credit-adjustments"
              payload: { delta_cents: 100000 }
              as: StoreManager
            - call: "POST /release-products"
              payload: { title: "Not Live Box", street_date: "2026-09-01T00:00:00Z", allocation_pool: 10, unit_price_cents: 2000, deposit_required_cents: 1000 }
              as: StoreManager
              captures: { rp: $.data.id, rpv0: $.data.version }
            - call: "POST /pre-orders"
              payload: { customer_id: "${cust}", release_product_id: "${rp}", requested_quantity: 2, deposit_paid_cents: 1000 }
              as: Customer
              as_user_id: "${cust}"
              captures: { po: $.data.id }
            - call: "POST /pre-orders/${po}/allocate"
              payload: { expected_release_product_version: "${rpv0}" }
              as: StoreManager
          trigger:
            - call: "POST /pre-orders/${po}/fulfill"
              payload: {}
              as: StoreManager
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_RELEASE_NOT_LIVE"
            - "response.status == 409"

  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: customer_double_booking_halfopen_overlap
        grounds:
          - validations[priority=9]
          - entities.Event.fields.starts_at
          - entities.Event.fields.ends_at
        distinguishing_aspect: |
          Half-open [starts_at, ends_at) interval semantics on the Customer-as-resource:
          a customer registered for Event A (08:00–12:00) is rejected from Event B
          (10:00–14:00) which overlaps, with ERR_SCHEDULE_CONFLICT; adjacency at a
          shared endpoint would be allowed (not tested as conflict).
        test_recipe:
          setup:
            - "Two OPEN events with overlapping windows, each tables_required=1; one customer registered for the first."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: StoreManager
            - call: "POST /customers"
              payload: { display_name: "Busy Cust", email: "busy@x.com" }
              as: StoreManager
              captures: { cust: $.data.id }
            - call: "POST /events"
              payload: { title: "Event A", format: "STANDARD", starts_at: "2026-06-10T08:00:00Z", ends_at: "2026-06-10T12:00:00Z", capacity: 8, entry_fee_cents: 1000, tables_required: 1 }
              as: StoreManager
              captures: { eva: $.data.id }
            - call: "POST /events"
              payload: { title: "Event B", format: "MODERN", starts_at: "2026-06-10T10:00:00Z", ends_at: "2026-06-10T14:00:00Z", capacity: 8, entry_fee_cents: 1000, tables_required: 1 }
              as: StoreManager
              captures: { evb: $.data.id }
            - call: "POST /events/${eva}/open"
              payload: {}
              as: StoreManager
            - call: "POST /events/${evb}/open"
              payload: {}
              as: StoreManager
            - call: "POST /registrations"
              payload: { event_id: "${eva}", customer_id: "${cust}" }
              as: Customer
              as_user_id: "${cust}"
          trigger:
            - call: "POST /registrations"
              payload: { event_id: "${evb}", customer_id: "${cust}" }
              as: Customer
              as_user_id: "${cust}"
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_SCHEDULE_CONFLICT"
            - "response.status == 409"

      - name: venue_table_buffer_overlap_on_open
        grounds:
          - validations[priority=10]
          - state_machines.Event.SCHEDULED_to_OPEN
          - entities.Event.fields.tables_required
        distinguishing_aspect: |
          Buffer-padded interval semantics on store-table capacity (different resource
          and different geometry): with STORE_TABLE_COUNT=8 and BUFFER_MINUTES=30, an
          already-OPEN event using 8 tables (12:00–16:00) blocks opening a second event
          needing 1 table at 16:15 because the 30-minute buffer makes the windows
          overlap — ERR_VENUE_OVERLAP. Pure adjacency (no buffer) would be allowed.
        test_recipe:
          setup:
            - "One OPEN event using 8 tables 12:00–16:00; a SCHEDULED event needing 1 table starting 16:15 (within the 30-min buffer)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: StoreManager
            - call: "POST /events"
              payload: { title: "Big GP", format: "STANDARD", starts_at: "2026-06-10T12:00:00Z", ends_at: "2026-06-10T16:00:00Z", capacity: 64, entry_fee_cents: 5000, tables_required: 8 }
              as: StoreManager
              captures: { big: $.data.id }
            - call: "POST /events/${big}/open"
              payload: {}
              as: StoreManager
            - call: "POST /events"
              payload: { title: "Late Side Event", format: "COMMANDER", starts_at: "2026-06-10T16:15:00Z", ends_at: "2026-06-10T18:00:00Z", capacity: 8, entry_fee_cents: 1000, tables_required: 1 }
              as: StoreManager
              captures: { side: $.data.id }
          trigger:
            - call: "POST /events/${side}/open"
              payload: {}
              as: StoreManager
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_VENUE_OVERLAP"
            - "response.status == 409"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: buylist_void_restores_inventory_units
        grounds:
          - state_machines.BuylistSubmission.ACCEPTED_to_VOIDED
          - state_machines.BuylistSubmission.SUBMITTED_to_ACCEPTED
          - entities.InventoryItem.fields.quantity_on_hand
        distinguishing_aspect: |
          Conserved quantity = physical inventory units. Accept then void leaves
          InventoryItem.quantity_on_hand back at 0 (forward +3 on accept, compensating
          -3 on void). Invariant: post-void quantity_on_hand == pre-accept quantity_on_hand.
        test_recipe:
          setup:
            - "An ACCEPTED STORE_CREDIT buylist (line item market 1000, qty 3) that drove quantity_on_hand to 3 and credit to 2100."
          setup_api_calls:
            - call: "POST /customers"
              payload: { display_name: "Void Seller", email: "void@x.com" }
              as: StoreManager
              captures: { cust: $.data.id }
            - call: "POST /inventory-items"
              payload: { title: "Reversible Card", product_kind: "SINGLE", market_price_cents: 1000 }
              as: StoreManager
              captures: { item: $.data.id }
            - call: "POST /buylist-submissions"
              payload: { customer_id: "${cust}", payout_method: "STORE_CREDIT" }
              as: Customer
              as_user_id: "${cust}"
              captures: { sub: $.data.id }
            - call: "POST /buylist-lines"
              payload: { buylist_submission_id: "${sub}", inventory_item_id: "${item}", quantity: 3 }
              as: Customer
              as_user_id: "${cust}"
            - call: "POST /buylist-submissions/${sub}/submit"
              payload: {}
              as: Customer
              as_user_id: "${cust}"
            - call: "POST /buylist-submissions/${sub}/accept"
              payload: {}
              as: StoreManager
          trigger:
            - call: "POST /buylist-submissions/${sub}/void"
              payload: {}
              as: StoreManager
          assert:
            - "InventoryItem.${item}.quantity_on_hand == 0"
            - "Customer.${cust}.store_credit_balance_cents == 0"
            - "BuylistSubmission.${sub}.status == VOIDED"

      - name: registration_pay_refund_conserves_store_credit
        grounds:
          - state_machines.Registration.payment_status=UNPAID_to_payment_status=PAID
          - state_machines.Registration.payment_status=PAID_to_payment_status=REFUNDED
          - calculations.store_credit_balance
        distinguishing_aspect: |
          Conserved quantity = store credit cents (a different conserved quantity than
          inventory units). Pay debits 2000, withdraw refunds 2000; net store-credit
          delta of the pay+refund pair is 0, so balance returns to the 5000 grant.
        test_recipe:
          setup:
            - "OPEN event entry_fee 2000; BRONZE customer granted 5000; registration PAID (balance 3000)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: StoreManager
            - call: "POST /customers"
              payload: { display_name: "RefundCust", email: "refund@x.com" }
              as: StoreManager
              captures: { cust: $.data.id }
            - call: "POST /customers/${cust}/credit-adjustments"
              payload: { delta_cents: 5000 }
              as: StoreManager
            - call: "POST /events"
              payload: { title: "Refundable Event", format: "STANDARD", starts_at: "2026-06-10T00:00:00Z", ends_at: "2026-06-10T04:00:00Z", capacity: 8, entry_fee_cents: 2000, tables_required: 1 }
              as: StoreManager
              captures: { ev: $.data.id }
            - call: "POST /events/${ev}/open"
              payload: {}
              as: StoreManager
            - call: "POST /registrations"
              payload: { event_id: "${ev}", customer_id: "${cust}" }
              as: Customer
              as_user_id: "${cust}"
              captures: { reg: $.data.id }
            - call: "POST /registrations/${reg}/pay"
              payload: {}
              as: Customer
              as_user_id: "${cust}"
          trigger:
            - call: "POST /registrations/${reg}/withdraw"
              payload: {}
              as: Customer
              as_user_id: "${cust}"
          assert:
            - "Registration.${reg}.payment_status == REFUNDED"
            - "Customer.${cust}.store_credit_balance_cents == 5000"
