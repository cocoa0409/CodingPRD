            - "the BoardAdmin finalize returns HTTP 200 with status FINALIZED and final_adjusted_score == 2.00"
            - "Establishment.${est_id}.license_status == ACTIVE and demerit_balance == 2.00"

      - name: rbac_inspector_cannot_issue_a_citation_and_the_hearing_officer_cannot_schedule_one
        claim_type: exclusive_operation
        grounds:
          - rbac.BoardAdmin.exclusive_operations
          - rbac.HearingOfficer.shared_operations
          - validations.priority_3.ERR_UNAUTHORIZED
        distinguishing_aspect: "Citation issuance and hearing scheduling are both BoardAdmin-exclusive, and the role gate at priority 3 runs before every state gate: the HearingOfficer scheduling a hearing on a citation that is merely ISSUED gets 403 ERR_UNAUTHORIZED, not the 409 ERR_CITATION_NOT_CONTESTED a BoardAdmin would have received."
        test_recipe:
          setup:
            - "One MINOR violation code REC-965 (base_points 2.0, fine_cents_base 3000)."
            - "Establishment 'Duty Split Salon' has a FINALIZED ROUTINE inspection scoring 2.00 conducted by insp-075."
          setup_api_calls:
            - call: "POST /cosmetology/violation-codes"
              payload: { code: "REC-965", category: "RECORDKEEPING", severity: "MINOR", base_points: 2.0, fine_cents_base: 3000 }
              as: BoardAdmin
              as_user_id: "admin-001"
              captures: { vc_id: $.data.id }
            - call: "POST /cosmetology/establishments"
              payload: { legal_name: "Duty Split Salon", establishment_type: "SALON", county_code: "ADN", station_capacity: 4 }
              as: BoardAdmin
              as_user_id: "admin-001"
              captures: { est_id: $.data.id }
            - call: "POST /cosmetology/inspections"
              payload: { establishment_id: "${est_id}", inspection_type: "ROUTINE", window_start_at: "2026-08-03T09:00:00Z", window_end_at: "2026-08-03T17:00:00Z", inspector_user_id: "insp-075" }
              as: Inspector
              as_user_id: "insp-075"
              captures: { insp_id: $.data.id }
            - call: "POST /cosmetology/inspections/${insp_id}/start"
              payload: {}
              as: Inspector
              as_user_id: "insp-075"
            - call: "POST /cosmetology/inspections/${insp_id}/findings"
              payload: { violation_code_id: "${vc_id}", observed_count: 1, corrected_on_site: false }
              as: Inspector
              as_user_id: "insp-075"
            - call: "POST /cosmetology/inspections/${insp_id}/submit"
              payload: {}
              as: Inspector
              as_user_id: "insp-075"
            - call: "POST /cosmetology/inspections/${insp_id}/finalize"
              payload: {}
              as: BoardAdmin
              as_user_id: "admin-001"
              captures: { insp_v: $.data.version }
          trigger:
            - call: "POST /cosmetology/citations"
              payload: { inspection_id: "${insp_id}", subject_type: "ESTABLISHMENT", expected_inspection_version: "${insp_v}" }
              as: Inspector
              as_user_id: "insp-075"
            - call: "POST /cosmetology/citations"
              payload: { inspection_id: "${insp_id}", subject_type: "ESTABLISHMENT", expected_inspection_version: "${insp_v}" }
              as: BoardAdmin
              as_user_id: "admin-001"
              captures: { cit_id: $.data.id }
            - call: "POST /cosmetology/citations/${cit_id}/hearings"
              payload: { presiding_officer_user_id: "hear-015", scheduled_at: "2026-08-14T10:00:00Z" }
              as: HearingOfficer
              as_user_id: "hear-015"
          assert:
            - "the Inspector citation call returns HTTP 403 with data.error_id == ERR_UNAUTHORIZED"
            - "the BoardAdmin citation call returns HTTP 201 with status ISSUED and total_due_cents == 5250"
            - "the HearingOfficer hearing call returns HTTP 403 with data.error_id == ERR_UNAUTHORIZED and NOT ERR_CITATION_NOT_CONTESTED"
            - "Citation.${cit_id}.hearing_round_count == 0 and status is still ISSUED"
            - "Inspection.${insp_id}.citation_count == 1"

      - name: rbac_establishment_owner_cannot_set_the_logical_clock
        claim_type: exclusive_operation
        grounds:
          - rbac.BoardAdmin.exclusive_operations
          - endpoints.POST_/_clock/set_current_utc
        distinguishing_aspect: "The clock is the most privileged write in the API and belongs to BoardAdmin alone: an EstablishmentOwner backed by a real establishment row is refused with 403 and the clock does not move, which the following BoardAdmin call proves by still being accepted at the original target instant."
        test_recipe:
          setup:
            - "Establishment 'Clock Salon' exists so the owner's X-User-ID resolves; the clock sits at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /cosmetology/establishments"
              payload: { legal_name: "Clock Salon", establishment_type: "SALON", county_code: "ADP", station_capacity: 4 }
              as: BoardAdmin
              as_user_id: "admin-001"
              captures: { est_id: $.data.id }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: EstablishmentOwner
              as_user_id: "${est_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: BoardAdmin
              as_user_id: "admin-001"
          assert:
            - "the EstablishmentOwner call returns HTTP 403 with data.error_id == ERR_UNAUTHORIZED"
            - "the BoardAdmin call returns HTTP 200 with data null, proving the refused call left the clock at 2026-08-01T00:00:00Z (had it moved, this identical value would have been refused with ERR_CLOCK_MUST_ADVANCE)"
            - "Establishment.${est_id}.license_status is still PENDING_INSPECTION"

      - name: rbac_school_registrar_cannot_register_an_establishment_or_publish_a_violation_code
        claim_type: peer_role_isolation
        grounds:
          - rbac.SchoolRegistrar.shared_operations
          - rbac.BoardAdmin.exclusive_operations
          - validations.priority_3.ERR_UNAUTHORIZED
        distinguishing_aspect: "SchoolRegistrar is confined to the school-to-licence pipeline: it is refused on both an EstablishmentOwner-side write and a BoardAdmin-exclusive registry write, yet the same registrar id succeeds at POST /cosmetology/practitioners — so the refusals are per-endpoint, not a blanket read-only role."
        test_recipe:
          setup:
            - "School 'Registrar Academy' (required_clock_hours 16.0) exists so the registrar's X-User-ID resolves."
          setup_api_calls:
            - call: "POST /cosmetology/schools"
              payload: { name: "Registrar Academy", county_code: "ADQ", required_clock_hours: 16.0, accreditation_status: "ACCREDITED" }
              as: BoardAdmin
              as_user_id: "admin-001"
              captures: { school_id: $.data.id }
          trigger:
            - call: "POST /cosmetology/establishments"
              payload: { legal_name: "Registrar Side Salon", establishment_type: "SALON", county_code: "ADR", station_capacity: 4 }
              as: SchoolRegistrar
              as_user_id: "${school_id}"
            - call: "POST /cosmetology/violation-codes"
              payload: { code: "REC-966", category: "RECORDKEEPING", severity: "MINOR", base_points: 2.0, fine_cents_base: 3000 }
              as: SchoolRegistrar
              as_user_id: "${school_id}"
            - call: "POST /cosmetology/practitioners"
              payload: { full_name: "Fenn Oduya", license_type: "COSMETOLOGIST", school_id: "${school_id}" }
