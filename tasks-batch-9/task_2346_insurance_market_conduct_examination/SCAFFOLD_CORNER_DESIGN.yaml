      - name: publication_from_order_pending_requires_an_executed_order
        claim_type: conditional_action
        grounds:
          - state_machines.Examination
          - errors.ERR_ORDER_NOT_EXECUTED
          - endpoints[POST /market-conduct/examinations/{id}/publish-report]
        distinguishing_aspect: |
          Reaching ORDER_PENDING is not enough to publish: the transition guard reads the consent order's
          state, so a DRAFT order that is merely on file is refused with the same code that guards
          multistate allocation. The refusal is distinct from the not-ready refusal because the
          examination status is already correct, and it must leave report_published_at null so the
          identical request succeeds unchanged once the carrier signs.
