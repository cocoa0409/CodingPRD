            - "call 6 is ERR_FORBIDDEN_ROLE and NOT ERR_UNAUTHENTICATED: MemberOperator is a real role with a real member id, it simply may not drive the clock"
            - "call 7 is ERR_FORBIDDEN_ROLE and NOT ERR_STALE_PARENT_VERSION even though expected_deal_version is supplied: priority 3 runs before priority 10"
