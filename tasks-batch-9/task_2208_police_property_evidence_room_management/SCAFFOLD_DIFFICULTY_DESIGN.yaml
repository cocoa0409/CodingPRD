              payload: { storage_location_id: "${loc_r_id}", auditor_id: "${aud_id}", scheduled_start_at: "2026-08-12T17:00:00Z", scheduled_end_at: "2026-08-12T21:00:00Z", expected_storage_location_version: "${loc_r_v2}" }
              as: InternalAuditor
              as_user_id: "${aud_id}"
              captures: { err_id: $.data.error_id }
            - call: "POST /audit-sessions"
              payload: { storage_location_id: "${loc_r_id}", auditor_id: "${aud_id}", scheduled_start_at: "2026-08-12T17:00:00.001Z", scheduled_end_at: "2026-08-12T21:00:00Z", expected_storage_location_version: "${loc_r_v2}" }
              as: InternalAuditor
              as_user_id: "${aud_id}"
              captures: { sess_c_id: $.data.id, sess_c_status: $.data.status }
          assert:
            - "The session starting at exactly 2026-08-12T17:00:00Z returns HTTP 409 with ${err_id} == 'ERR_AUDIT_WINDOW_BUFFER' (prior end 2026-08-10T17:00:00Z + 48h, inclusive)"
            - "The session starting at 2026-08-12T17:00:00.001Z is accepted with HTTP 201: ${sess_c_status} == 'SCHEDULED'"
            - "GET /audit-sessions?storage_location_id=${loc_r_id} returns total_count == 2, containing only ${sess_a_id} and ${sess_c_id}"
            - "StorageLocation.${loc_r_id}.version == ${loc_r_v2} + 1 after the accepted creation and was NOT bumped by the rejected one"
            - "AuditSession.${sess_c_id}.risk_index == 0.00 and expected_item_count == 0 before it starts"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: missing_then_found_restores_location_occupied_slots
        grounds:
          - "calculations.location_occupied_slots"
          - "state_machines.EvidenceItem.STORED_to_MISSING"
          - "state_machines.EvidenceItem.MISSING_to_STORED"
          - "state_machines.Discrepancy.OPEN_to_RESOLVED_FOUND"
          - "entities.StorageLocation.fields.occupied_slots"
        distinguishing_aspect: |
          The conserved quantity is a SLOT-OCCUPANCY COUNT: StorageLocation.occupied_slots must satisfy
          `occupied_slots == count(items in {STORED, CHECKED_OUT} at this location)` at every observable
          point, so the reconcile that loses the item (1 -> 0) and the FOUND resolution that recovers it
          (0 -> 1) leave the count exactly where it started with no drift.
        test_recipe:
          setup:
            - "One BIOLOGICAL item stored in R-01, so StorageLocation.occupied_slots == 1."
            - "An audit session on R-01 is started and reconciled with no scans, raising a MISSING discrepancy."
          setup_api_calls:
