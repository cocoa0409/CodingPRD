      - STU-005 (residing in A-01, origin Cedar, requesting Birch, HARDSHIP) is APPROVED, which raises Cedar's outbound_approved to 1 and restores Cedar's pool to 454 - (452 + 2 - 1) == 1 - exactly one seat.
