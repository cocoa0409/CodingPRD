            - { call: "POST /talent/sessions/${sB}/complete", as: HiringManager, as_user_id: hm-1 }
            - { call: "POST /talent/sessions/${sC}/complete", as: HiringManager, as_user_id: hm-1 }
            - { call: "POST /talent/sessions/${sA}/scorecards", payload: { ratings: [{ competency_code: "COMM", rating: 4 }, { competency_code: "ANAL", rating: 5 }], overall_recommendation: "YES" }, as: Interviewer, as_user_id: "${iv1}", captures: { scA: $.data.id } }
            - { call: "POST /talent/sessions/${sB}/scorecards", payload: { ratings: [{ competency_code: "COMM", rating: 4 }], overall_recommendation: "YES" }, as: Interviewer, as_user_id: "${iv1}", captures: { scB: $.data.id } }
            - { call: "POST /talent/sessions/${sC}/scorecards", payload: { ratings: [{ competency_code: "COMM", rating: 5 }, { competency_code: "ANAL", rating: 5 }], overall_recommendation: "STRONG_YES" }, as: Interviewer, as_user_id: "${iv1}", captures: { scC: $.data.id } }
