  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: booking_confirm_blocked_by_facility_closed_posture
        grounds:
          - state_machines.Booking.REQUESTED_to_CONFIRMED
          - state_machines.Facility.RESTRICTED_to_CLOSED
          - validations[priority=7]
          - errors[ERR_FACILITY_POSTURE_BLOCK]
        distinguishing_aspect: |
          Booking's REQUESTED->CONFIRMED depends on Facility.posture (pair Booking->Facility):
          with two lanes CLOSED by CRITICAL maintenance the facility is CLOSED, so confirming
          an OPEN_SLOT booking on a third (still-AVAILABLE) lane is rejected with
          ERR_FACILITY_POSTURE_BLOCK.
        test_recipe:
          setup:
            - "Facility default; lanes L1,L2,L3; member waiver SIGNED wallet 100 tokens."
            - "L1 and L2 each get a CRITICAL maintenance window (open_incident_count=2 -> facility CLOSED)."
            - "A REQUESTED OPEN_SLOT booking exists on L3 (AVAILABLE) before the closures."
          setup_api_calls:
            - call: "POST /v1/facilities"
              payload: { name: "F13", hourly_rate_cents: 4000, token_price_cents: 500 }
              as: FacilityManager
              captures: { fac_id: $.data.id }
            - call: "POST /v1/lanes"
