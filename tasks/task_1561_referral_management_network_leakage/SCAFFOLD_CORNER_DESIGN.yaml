      - name: target_mismatch_on_booking
        claim_type: violation_to_error
        grounds: ["validations[priority=9]", "errors[ERR_TARGET_MISMATCH]"]
        distinguishing_aspect: "Once target_specialist_id is set, a booking payload naming a DIFFERENT specialist fails with ERR_TARGET_MISMATCH (422); omitting specialist_id uses the target."
        test_recipe:
          setup: ["full bootstrap; S1 and S2 both CARDIOLOGY with participations; referral accepted + assigned S1"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: NetworkAdmin }
            - { call: "POST /insurance-plans", payload: { plan_code: "PPO-1", payer_name: "PayerOne", payer_mix_factor: 1.0 }, as: NetworkAdmin, captures: { plan1: $.data.id } }
