            - { call: "POST /safety/workers", payload: { project_id: "${p}", full_name: "F Grant", employer_type: "DIRECT" }, as: SiteSuperintendent, captures: { w: "$.data.id" } }
            - { call: "POST /safety/training-certificates", payload: { worker_id: "${w}", cert_type: "OSHA_10", issued_date: "2026-07-01", expires_date: "2027-07-01" }, as: SiteSuperintendent, captures: { c1: "$.data.id" } }
            - { call: "POST /safety/training-certificates/${c1}/verify", payload: {}, as: SafetyInspector, as_user_id: "insp-1" }
            - { call: "POST /safety/workers/${w}/complete-orientation", payload: {}, as: SiteSuperintendent }
            - { call: "POST /safety/workers/${w}/clear", payload: {}, as: SiteSuperintendent }
            - { call: "POST /safety/huddles", payload: { project_id: "${p}", huddle_date: "2026-08-01", topics: "leading edge work" }, as: SiteSuperintendent, captures: { h: "$.data.id" } }
            - { call: "POST /safety/huddles/${h}/conduct", payload: { attendee_worker_ids: ["${w}"] }, as: SiteSuperintendent }
            - { call: "POST /safety/jhas", payload: { project_id: "${p}", huddle_id: "${h}", task_description: "deck edge pour", hazards: "fall", controls: "guardrails + harness" }, as: SiteSuperintendent, captures: { j: "$.data.id" } }
            - { call: "POST /safety/jhas/${j}/approve", payload: {}, as: SafetyManager }
            - { call: "POST /safety/permits", payload: { project_id: "${p}", jha_id: "${j}", permit_type: "FALL_PROTECTION", work_start: "2026-08-02T08:00:00Z", work_end: "2026-08-02T16:00:00Z", authorized_worker_ids: ["${w}"] }, as: SiteSuperintendent, captures: { pm: "$.data.id" } }
            - { call: "POST /safety/permits/${pm}/issue", payload: {}, as: SafetyManager }
          trigger:
            - { call: "POST /safety/drug-tests", payload: { worker_id: "${w}", test_type: "RANDOM", collected_at: "2026-08-02T11:00:00Z" }, as: SafetyManager, captures: { dt: "$.data.id" } }
            - { call: "POST /safety/drug-tests/${dt}/record-result", payload: { result: "POSITIVE" }, as: SafetyManager }
            - { call: "GET /safety/workers/${w}", payload: {}, as: SafetyManager, captures: { w_s: "$.data.status", w_r: "$.data.suspension_reason" } }
            - { call: "GET /safety/permits/${pm}", payload: {}, as: SafetyManager, captures: { pm_s: "$.data.status", pm_r: "$.data.suspension_reason" } }
            - { call: "GET /safety/jhas/${j}", payload: {}, as: SafetyManager, captures: { j_s: "$.data.status" } }
            - { call: "GET /safety/projects/${p}", payload: {}, as: SafetyManager, captures: { posture: "$.data.safety_posture", cnt: "$.data.issued_permit_count" } }
          assert:
            - "Worker.${w}.status == SUSPENDED with suspension_reason == 'POSITIVE_DRUG_TEST'   # link 1"
            - "Permit.${pm}.status == SUSPENDED with suspension_reason == 'CREW_MEMBER_SUSPENDED'   # link 2, caused by the worker suspension"
            - "JobHazardAnalysis.${j}.status == RE_REVIEW_REQUIRED   # link 3, caused by the permit suspension"
            - "Project.${p}.safety_posture == NORMAL (cascade does not route through posture)"
            - "Project.${p}.issued_permit_count == 0"

  # =====================================================================
  # Rule 5 — priority_pair_validation_conflict (DIFFERENT category pairs)
  # =====================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: permit_issue_state_vs_posture_priority
        grounds:
          - validations[priority=5]
          - validations[priority=6]
          - errors[ERR_PERMIT_INVALID_STATE]
          - errors[ERR_PROJECT_POSTURE_BLOCKED]
        distinguishing_aspect: |
          Category pair (state vs business_safety): the permit is SUSPENDED (state violation,
          ERR_PERMIT_INVALID_STATE, priority 5) AND the project posture is FROZEN (safety violation,
          ERR_PROJECT_POSTURE_BLOCKED, priority 6) — the state error must win.
        test_recipe:
          setup:
            - "Project with ACTIVE plan; worker CLEARED; JHA APPROVED; permit ISSUED then cascade-SUSPENDED by a CRITICAL incident (posture FROZEN)"
          setup_api_calls:
            - { call: "POST /safety/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T08:00:00Z" }, as: SafetyManager }
            - { call: "POST /safety/projects", payload: { name: "Tower 12", location: "Renton", annual_hours_worked: 200000 }, as: SafetyManager, captures: { p: "$.data.id", p_v: "$.data.version" } }
            - { call: "POST /safety/safety-plans", payload: { project_id: "${p}", effective_date: "2026-08-01" }, as: SafetyManager, captures: { pl: "$.data.id" } }
            - { call: "POST /safety/safety-plans/${pl}/activate", payload: { expected_project_version: "${p_v}" }, as: SafetyManager }
            - { call: "POST /safety/workers", payload: { project_id: "${p}", full_name: "E Frost", employer_type: "DIRECT" }, as: SiteSuperintendent, captures: { w: "$.data.id" } }
            - { call: "POST /safety/training-certificates", payload: { worker_id: "${w}", cert_type: "OSHA_10", issued_date: "2026-07-01", expires_date: "2027-07-01" }, as: SiteSuperintendent, captures: { c1: "$.data.id" } }
            - { call: "POST /safety/training-certificates/${c1}/verify", payload: {}, as: SafetyInspector, as_user_id: "insp-1" }
            - { call: "POST /safety/workers/${w}/complete-orientation", payload: {}, as: SiteSuperintendent }
            - { call: "POST /safety/workers/${w}/clear", payload: {}, as: SiteSuperintendent }
            - { call: "POST /safety/huddles", payload: { project_id: "${p}", huddle_date: "2026-08-01", topics: "trenching" }, as: SiteSuperintendent, captures: { h: "$.data.id" } }
            - { call: "POST /safety/huddles/${h}/conduct", payload: { attendee_worker_ids: ["${w}"] }, as: SiteSuperintendent }
            - { call: "POST /safety/jhas", payload: { project_id: "${p}", huddle_id: "${h}", task_description: "utility trench", hazards: "cave-in", controls: "shoring" }, as: SiteSuperintendent, captures: { j: "$.data.id" } }
            - { call: "POST /safety/jhas/${j}/approve", payload: {}, as: SafetyManager }
            - { call: "POST /safety/permits", payload: { project_id: "${p}", jha_id: "${j}", permit_type: "EXCAVATION", work_start: "2026-08-02T08:00:00Z", work_end: "2026-08-02T16:00:00Z", authorized_worker_ids: ["${w}"] }, as: SiteSuperintendent, captures: { pm: "$.data.id" } }
            - { call: "POST /safety/permits/${pm}/issue", payload: {}, as: SafetyManager }
            - { call: "POST /safety/incidents", payload: { project_id: "${p}", worker_id: "${w}", incident_type: "INJURY", severity: "CRITICAL", occurred_at: "2026-08-02T10:00:00Z", work_related: true, description: "trench collapse" }, as: SiteSuperintendent }
          trigger:
            - { call: "POST /safety/permits/${pm}/issue", payload: {}, as: SafetyManager, captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_PERMIT_INVALID_STATE   # priority 5 (state) beats priority 6 (business_safety ERR_PROJECT_POSTURE_BLOCKED)"
            - "Permit.${pm}.status remains SUSPENDED"

      - name: permit_create_jha_vs_overlap_priority
        grounds:
          - validations[priority=7]
          - validations[priority=8]
          - errors[ERR_JHA_NOT_APPROVED]
          - errors[ERR_PERMIT_TIME_CONFLICT]
        distinguishing_aspect: |
          Category pair (business_referential vs business_temporal): the linked JHA is DRAFT (referential
          violation, ERR_JHA_NOT_APPROVED, priority 7) AND the requested excavation window overlaps an
          existing excavation permit (temporal violation, ERR_PERMIT_TIME_CONFLICT, priority 8) — the
          referential error must win. Different category pair than (state vs business_safety).
        test_recipe:
          setup:
            - "Project with ACTIVE plan; worker CLEARED; huddle CONDUCTED; JHA j1 APPROVED backing existing EXCAVATION permit [2026-08-02T08:00Z, 2026-08-02T16:00Z]; JHA j2 still DRAFT"
          setup_api_calls:
            - { call: "POST /safety/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T08:00:00Z" }, as: SafetyManager }
            - { call: "POST /safety/projects", payload: { name: "Mercer Yard", location: "Seattle", annual_hours_worked: 110000 }, as: SafetyManager, captures: { p: "$.data.id", p_v: "$.data.version" } }
            - { call: "POST /safety/safety-plans", payload: { project_id: "${p}", effective_date: "2026-08-01" }, as: SafetyManager, captures: { pl: "$.data.id" } }
            - { call: "POST /safety/safety-plans/${pl}/activate", payload: { expected_project_version: "${p_v}" }, as: SafetyManager }
            - { call: "POST /safety/workers", payload: { project_id: "${p}", full_name: "G Hale", employer_type: "DIRECT" }, as: SiteSuperintendent, captures: { w: "$.data.id" } }
            - { call: "POST /safety/training-certificates", payload: { worker_id: "${w}", cert_type: "OSHA_10", issued_date: "2026-07-01", expires_date: "2027-07-01" }, as: SiteSuperintendent, captures: { c1: "$.data.id" } }
            - { call: "POST /safety/training-certificates/${c1}/verify", payload: {}, as: SafetyInspector, as_user_id: "insp-1" }
            - { call: "POST /safety/workers/${w}/complete-orientation", payload: {}, as: SiteSuperintendent }
            - { call: "POST /safety/workers/${w}/clear", payload: {}, as: SiteSuperintendent }
            - { call: "POST /safety/huddles", payload: { project_id: "${p}", huddle_date: "2026-08-01", topics: "excavation + backfill" }, as: SiteSuperintendent, captures: { h: "$.data.id" } }
            - { call: "POST /safety/huddles/${h}/conduct", payload: { attendee_worker_ids: ["${w}"] }, as: SiteSuperintendent }
            - { call: "POST /safety/jhas", payload: { project_id: "${p}", huddle_id: "${h}", task_description: "north trench", hazards: "cave-in", controls: "shoring" }, as: SiteSuperintendent, captures: { j1: "$.data.id" } }
            - { call: "POST /safety/jhas/${j1}/approve", payload: {}, as: SafetyManager }
            - { call: "POST /safety/permits", payload: { project_id: "${p}", jha_id: "${j1}", permit_type: "EXCAVATION", work_start: "2026-08-02T08:00:00Z", work_end: "2026-08-02T16:00:00Z", authorized_worker_ids: ["${w}"] }, as: SiteSuperintendent, captures: { pmA: "$.data.id" } }
            - { call: "POST /safety/jhas", payload: { project_id: "${p}", huddle_id: "${h}", task_description: "south trench", hazards: "cave-in", controls: "sloping" }, as: SiteSuperintendent, captures: { j2: "$.data.id" } }
          trigger:
            - { call: "POST /safety/permits", payload: { project_id: "${p}", jha_id: "${j2}", permit_type: "EXCAVATION", work_start: "2026-08-02T12:00:00Z", work_end: "2026-08-02T20:00:00Z", authorized_worker_ids: ["${w}"] }, as: SiteSuperintendent, captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_JHA_NOT_APPROVED   # priority 7 (business_referential) beats priority 8 (business_temporal ERR_PERMIT_TIME_CONFLICT)"

  # =====================================================================
  # Rule 6 — boundary_precision_check (DIFFERENT metrics + endpoints)
  # =====================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: drug_test_window_exactly_32h_compliant
        grounds:
          - calculations.drug_test_window_compliance
          - errors[ERR_DRUG_TEST_WINDOW_VIOLATION]
        distinguishing_aspect: |
          Boundary on an ELAPSED-HOURS metric reached through POST /safety/drug-tests: collected_at exactly
          equal to occurred_at + 32h is COMPLIANT (inclusive close), while +32h+1s violates — pinned here at
          the exact-boundary accepted side; the rejected side is exercised in §1.9.
        test_recipe:
          setup:
            - "Project; worker w; incident occurred_at 2026-08-02T08:00:00Z (SERIOUS INJURY, work_related)"
          setup_api_calls:
            - { call: "POST /safety/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T08:00:00Z" }, as: SafetyManager }
            - { call: "POST /safety/projects", payload: { name: "Fremont Cut", location: "Seattle", annual_hours_worked: 70000 }, as: SafetyManager, captures: { p: "$.data.id" } }
            - { call: "POST /safety/workers", payload: { project_id: "${p}", full_name: "H Ibarra", employer_type: "DIRECT" }, as: SiteSuperintendent, captures: { w: "$.data.id" } }
            - { call: "POST /safety/incidents", payload: { project_id: "${p}", worker_id: "${w}", incident_type: "INJURY", severity: "SERIOUS", occurred_at: "2026-08-02T08:00:00Z", work_related: true, description: "ladder fall" }, as: SiteSuperintendent, captures: { inc: "$.data.id" } }
          trigger:
            - { call: "POST /safety/drug-tests", payload: { worker_id: "${w}", test_type: "POST_INCIDENT", incident_id: "${inc}", collected_at: "2026-08-03T16:00:00Z" }, as: SafetyManager, captures: { dt: "$.data.id", wc: "$.data.window_compliant" } }
          assert:
            - "HTTP 201 — collection at exactly occurred_at + 32h is compliant (window close is inclusive)"
            - "DrugTestRecord.${dt}.window_compliant == true"

      - name: score_threshold_exactly_80_demote_rejected
        grounds:
          - calculations.subcontractor_compliance_score
          - errors[ERR_SCORE_THRESHOLD_NOT_MET]
        distinguishing_aspect: |
          Boundary on a SCORE-POINTS metric reached through POST /safety/subcontractors/{id}/probation-review:
          DEMOTE requires realtime < 80 (strict), so a score of exactly 80 (MAJOR 15 + MINOR 5 deductions)
          is rejected — different metric and different endpoint than the 32-hour window instance.
        test_recipe:
          setup:
            - "Project; Subcontractor; WEEKLY inspection COMPLETED; MAJOR deficiency + MINOR deficiency both OPEN and assigned to the sub -> realtime score exactly 80"
          setup_api_calls:
            - { call: "POST /safety/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T08:00:00Z" }, as: SafetyManager }
            - { call: "POST /safety/projects", payload: { name: "Rainer Vista", location: "Kent", annual_hours_worked: 95000 }, as: SafetyManager, captures: { p: "$.data.id" } }
            - { call: "POST /safety/subcontractors", payload: { project_id: "${p}", company_name: "Peak Framing", trade: "carpentry" }, as: SafetyManager, captures: { s: "$.data.id" } }
            - { call: "POST /safety/inspections", payload: { project_id: "${p}", inspection_type: "WEEKLY", due_date: "2026-08-10T17:00:00Z" }, as: SafetyInspector, captures: { insp: "$.data.id" } }
            - { call: "POST /safety/inspections/${insp}/complete", payload: { findings_summary: "guardrails + signage" }, as: SafetyInspector, as_user_id: "insp-1" }
            - { call: "POST /safety/deficiencies", payload: { inspection_id: "${insp}", description: "guardrail missing", severity: "MAJOR", assigned_subcontractor_id: "${s}" }, as: SafetyInspector, as_user_id: "insp-1" }
            - { call: "POST /safety/deficiencies", payload: { inspection_id: "${insp}", description: "signage faded", severity: "MINOR", assigned_subcontractor_id: "${s}" }, as: SafetyInspector, as_user_id: "insp-1" }
          trigger:
            - { call: "POST /safety/subcontractors/${s}/probation-review", payload: { action: "DEMOTE" }, as: SafetyManager, captures: { err: "$.data.error_id" } }
            - { call: "GET /safety/subcontractors/${s}", payload: {}, as: SafetyManager, captures: { rt: "$.data.compliance_score_realtime", st: "$.data.standing" } }
          assert:
            - "error_id == ERR_SCORE_THRESHOLD_NOT_MET   # exactly 80 does NOT satisfy the strict < 80 demote rule"
            - "Subcontractor.${s}.compliance_score_realtime == 80"
            - "Subcontractor.${s}.standing == GOOD_STANDING   # unchanged"

