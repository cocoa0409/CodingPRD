  # ===================================================================
  # Rule 4 — transitive_cascade (depth >= 3 and >= 2, different triggers)
  # ===================================================================
  - rule_id: transitive_cascade
    instances:
      - name: adaptation_check_cascade_plan_sessions_claim
        grounds:
          - state_machines.TreatmentCourse.ON_TREATMENT_to_ADAPTATION_REQUIRED
          - state_machines.TreatmentPlan.ACTIVE_to_SUPERSEDED
          - state_machines.FractionSession.SCHEDULED_to_CANCELLED
          - state_machines.BillingClaim.FINALIZED_to_DRAFT
        distinguishing_aspect: |
          Depth-3 chain triggered by POST adaptation-checks: course -> ADAPTATION_REQUIRED MUTATES the
          ACTIVE plan to SUPERSEDED; that supersession CANCELS the plan's still-SCHEDULED sessions
          (reason ADAPTATION); the loss of billable scheduled/delivered state AUTO-REOPENS the
          FINALIZED claim to DRAFT. Each hop is caused by the previous hop's mutation, not by the
          original request.
        test_recipe:
          setup:
            - "IMRT course 2000/10, plan approved, ON_TREATMENT with 1 delivered fraction and 2 still SCHEDULED"
            - "BillingClaim FINALIZED (lines: SIMULATION 65000, PLANNING 210000, 2xPHYSICS_CHECK 50000, FIRST_FRACTION_SETUP 12000, 1xFRACTION_DELIVERY 32000 = gross 369000, discount 0, final 369000)"
            - "baseline_weight_kg 80.0"
          setup_api_calls:
            - { call: "POST /oncology/patients", payload: { mrn: "MRN-CAS-1", full_name: "Cascade One", date_of_birth: "1971-01-01" }, as: Scheduler, captures: { pat: $.data.id } }
            - { call: "POST /oncology/patients/${pat}/treatment-courses", payload: { diagnosis_code: "C61", intent: "CURATIVE", technique: "IMRT", prescribed_total_dose_cGy: 2000, planned_fractions: 10 }, as: RadiationOncologist, as_user_id: "onc_a", captures: { crs: $.data.id } }
