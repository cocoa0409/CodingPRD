        distinguishing_aspect: "Strict '>' boundary at LEGAL_LIMIT_LBS=80000 on WeighTicket: 80000 -> not overweight; 80001 -> overweight; a different metric (pounds) and endpoint (POST /weigh-tickets) from the demurrage-day boundary."
