              as: LiaisonOfficer
              as_user_id: "${off}"
              captures: { ts: $.data.id }
            - call: "POST /watch/training-sessions/${ts}/complete"
              payload: { attending_member_ids: ["${m1}"] }
              as: LiaisonOfficer
              as_user_id: "${off}"
            - call: "POST /watch/blocks/${b1}/captain-assignments"
              payload: { member_id: "${m1}", expected_block_version: "${b1_v}" }
              as: ProgramCoordinator
            - call: "GET /watch/watch-groups/${wg}"
              payload: {}
              as: ProgramCoordinator
              captures: { wg_v2: $.data.version }
            - call: "POST /watch/alerts"
              payload: { watch_group_id: "${wg}", alert_kind: "SAFETY_TIP", audience_scope: "GROUP", scheduled_send_at: "2026-08-09T12:00:00Z", expected_watch_group_version: "${wg_v2}" }
              as: ProgramCoordinator
              captures: { al: $.data.id }
            - call: "POST /watch/alerts/${al}/queue"
              payload: {}
              as: ProgramCoordinator
            - call: "POST /watch/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-09T12:00:00Z" }
