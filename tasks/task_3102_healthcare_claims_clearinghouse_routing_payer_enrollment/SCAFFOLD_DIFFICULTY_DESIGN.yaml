scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: enrollment_due_date_business_vs_calendar_diverges_across_weekend
        grounds:
          - calculations.payer_decision_due_at
          - entities.PayerEnrollment.fields.payer_decision_due_at
        distinguishing_aspect: |
          The business_day variant skips Saturdays and Sundays while the
          calendar_day variant does not; for a CLAIMS_837 enrollment submitted
          on a Friday with claims_lead_time_days=3 the two variants land on
          different dates (Wednesday vs Monday) — a falsifiable divergence on
          the PayerEnrollment entity.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-04T00:00:00Z (a Friday)."
            - "Provider prov_a is ACTIVE with one ACTIVE SubmitterCredential."
            - "Payer pay_a has claims_lead_time_days=3, remittance_lead_time_days=5, eligibility_lead_time_seconds=60."
            - "A DRAFT PayerEnrollment exists for (prov_a, pay_a, CLAIMS_837)."
          setup_api_calls:
            - call: "POST /clearinghouse/_clock/set_current_utc"
              payload: { current_utc: "2026-09-04T00:00:00Z" }
              as: ClearinghouseOps
            - call: "POST /clearinghouse/providers"
              payload: { legal_name: "Acme Health Partners", tax_identification_number: "123456789", national_provider_identifier: "1234567893", billing_model: "PROVIDER_FUNDED" }
              as: ClearinghouseOps
              captures: { prov_a: $.data.id }
            - call: "POST /clearinghouse/providers/${prov_a}/credentials"
              payload: { submitter_id: "SUB-001", trading_partner_agreement_ref: "TPA-2026-001", effective_at: "2026-09-01T00:00:00Z", expires_at: "2027-09-01T00:00:00Z" }
              as: ProviderAdmin
              as_user_id: "${prov_a}"
              captures: { cred_a: $.data.id }
            - call: "POST /clearinghouse/providers/${prov_a}/credentials/${cred_a}/submit"
              payload: {}
              as: ProviderAdmin
              as_user_id: "${prov_a}"
            - call: "POST /clearinghouse/providers/${prov_a}/activate"
              payload: {}
              as: ClearinghouseOps
            - call: "POST /clearinghouse/payers"
              payload: { payer_id_code: "PAYAA", display_name: "Payer A", claims_lead_time_days: 3, remittance_lead_time_days: 5, eligibility_lead_time_seconds: 60, pricing_model: "PROVIDER_FUNDED", monthly_minimum_cents: 0 }
              as: ClearinghouseOps
              captures: { pay_a: $.data.id }
            - call: "POST /clearinghouse/providers/${prov_a}/enrollments"
              payload: { payer_id: "${pay_a}", transaction_type: "CLAIMS_837" }
              as: ProviderAdmin
              as_user_id: "${prov_a}"
              captures: { enr_a: $.data.id }
          trigger:
            - call: "POST /clearinghouse/providers/${prov_a}/enrollments/${enr_a}/submit"
              payload: {}
              as: ProviderAdmin
              as_user_id: "${prov_a}"
              captures: { enr_v: $.data.version, due_business: $.data.payer_decision_due_at }
          assert:
            - "PayerEnrollment.${enr_a}.payer_decision_due_at == \"2026-09-09T00:00:00Z\" (Friday 9/4 + 3 business days skips Sat 9/5 and Sun 9/6 → Mon 9/7, Tue 9/8, Wed 9/9)"
            - "the calendar-day variant (returned alongside as payer_decision_due_at_calendar) == \"2026-09-07T00:00:00Z\" (Friday 9/4 + 3 calendar days)"
            - "payer_decision_due_at != payer_decision_due_at_calendar — the two variants produce different timestamps for identical inputs"

      - name: claim_response_due_business_vs_calendar_on_remitted_claim
        grounds:
          - calculations.payer_response_due_at
          - entities.Claim.fields.payer_response_due_at
        distinguishing_aspect: |
          Same dual-variant pattern as the enrollment due date but on the Claim
          entity (different entity domain from PayerEnrollment), exercising the
          forward path business_day vs calendar_day split across a weekend on
          claim forward.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-04T10:00:00Z (Friday)."
            - "Provider prov_a ACTIVE with ACTIVE credential; Payer pay_a claims_lead_time_days=3."
            - "APPROVED CLAIMS_837 enrollment for (prov_a, pay_a)."
            - "Claim clm_a is in ACCEPTED state."
          setup_api_calls:
            - call: "POST /clearinghouse/_clock/set_current_utc"
              payload: { current_utc: "2026-09-04T10:00:00Z" }
              as: ClearinghouseOps
            - call: "POST /clearinghouse/providers"
              payload: { legal_name: "Acme Health Partners", tax_identification_number: "123456789", national_provider_identifier: "1234567893", billing_model: "PROVIDER_FUNDED" }
              as: ClearinghouseOps
              captures: { prov_a: $.data.id }
            - call: "POST /clearinghouse/providers/${prov_a}/credentials"
              payload: { submitter_id: "SUB-001", trading_partner_agreement_ref: "TPA-2026-001", effective_at: "2026-09-01T00:00:00Z", expires_at: "2027-09-01T00:00:00Z" }
              as: ProviderAdmin
              as_user_id: "${prov_a}"
              captures: { cred_a: $.data.id }
            - call: "POST /clearinghouse/providers/${prov_a}/credentials/${cred_a}/submit"
              payload: {}
              as: ProviderAdmin
              as_user_id: "${prov_a}"
            - call: "POST /clearinghouse/providers/${prov_a}/activate"
              payload: {}
              as: ClearinghouseOps
            - call: "POST /clearinghouse/payers"
              payload: { payer_id_code: "PAYAA", display_name: "Payer A", claims_lead_time_days: 3, remittance_lead_time_days: 5, eligibility_lead_time_seconds: 60, pricing_model: "PROVIDER_FUNDED", monthly_minimum_cents: 0 }
              as: ClearinghouseOps
              captures: { pay_a: $.data.id }
            - call: "POST /clearinghouse/providers/${prov_a}/enrollments"
              payload: { payer_id: "${pay_a}", transaction_type: "CLAIMS_837" }
              as: ProviderAdmin
              as_user_id: "${prov_a}"
              captures: { enr_a: $.data.id }
            - call: "POST /clearinghouse/providers/${prov_a}/enrollments/${enr_a}/submit"
              payload: {}
              as: ProviderAdmin
              as_user_id: "${prov_a}"
            - call: "POST /clearinghouse/_enrollments/${enr_a}/advance-to-review"
              payload: {}
              as: ClearinghouseOps
            - call: "GET /clearinghouse/providers/${prov_a}/enrollments/${enr_a}"
              payload: {}
              as: ProviderAdmin
              as_user_id: "${prov_a}"
              captures: { enr_v: $.data.version }
            - call: "POST /clearinghouse/enrollments/${enr_a}/payer-decision"
              payload: { decision: "APPROVE", expected_enrollment_version: "${enr_v}" }
              as: PayerOperator
              as_user_id: "${pay_a}"
            - call: "POST /clearinghouse/providers/${prov_a}/claims"
              payload: { payer_id: "${pay_a}", submitter_credential_id: "${cred_a}", patient_control_number: "PCN-001", idempotency_key: "IDEM-CLM-001", service_date: "2026-09-01T00:00:00Z", total_charge_cents: 10000, diagnosis_codes: ["E11.9"], rendering_npi: "1234567893", subscriber_id: "MBR-001", lines: [{ cpt_code: "99213", units: 1, unit_charge_cents: 10000 }] }
              as: ProviderAdmin
              as_user_id: "${prov_a}"
              captures: { clm_a: $.data.id, clm_v_accepted: $.data.version }
          trigger:
            - call: "POST /clearinghouse/claims/${clm_a}/forward"
              payload: { expected_claim_version: "${clm_v_accepted}" }
              as: ClearinghouseOps
              captures: { due_business: $.data.payer_response_due_at }
          assert:
            - "Claim.${clm_a}.payer_response_due_at == \"2026-09-09T10:00:00Z\" (Friday 9/4 10:00 + 3 business days)"
            - "Claim.${clm_a}.payer_response_due_at_calendar == \"2026-09-07T10:00:00Z\" (calendar-day variant)"
            - "the two variant fields differ by exactly 48 hours (the weekend)"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: monthly_usage_fee_per_kind_payer_rounding_then_sum
        grounds:
          - calculations.monthly_usage_fee
        distinguishing_aspect: |
          Mode (b) nested-rounding: the formula rounds per (transaction_kind,
          payer) with round_half_up BEFORE summing across kinds; the
          alternative "sum-then-round" produces a different cents total for
          the same inputs. With shared_provider_pct=0.5 and odd-cent per-tier
          subtotals the rounding order is observable.
        test_recipe:
          setup:
            - "Logical clock at 2026-10-01T00:00:00Z (October; September period closed)."
            - "Provider prov_shared is ACTIVE with billing_model=HYBRID."
            - "Payer pay_shared has pricing_model=SHARED, shared_provider_pct=0.5, monthly_minimum_cents=0."
            - "PayerPricingTier: applies_to=CLAIM, floor=1, ceiling=null, rate_cents=3 (odd rate forces half-cent subtotals)."
            - "PayerPricingTier: applies_to=ELIGIBILITY, floor=1, ceiling=null, rate_cents=3."
            - "Provider forwarded exactly 1 CLAIM and 1 ELIGIBILITY in September against pay_shared."
            - "UsageInvoice inv for 2026-09 in OPEN state."
          setup_api_calls:
            - call: "POST /clearinghouse/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: ClearinghouseOps
            - call: "POST /clearinghouse/providers"
              payload: { legal_name: "Hybrid Provider LLC", tax_identification_number: "987654321", national_provider_identifier: "1987654321", billing_model: "HYBRID" }
              as: ClearinghouseOps
              captures: { prov_a: $.data.id }
            - call: "POST /clearinghouse/providers/${prov_a}/credentials"
              payload: { submitter_id: "SUB-H1", trading_partner_agreement_ref: "TPA-H1", effective_at: "2026-09-01T00:00:00Z", expires_at: "2027-09-01T00:00:00Z" }
              as: ProviderAdmin
              as_user_id: "${prov_a}"
              captures: { cred_a: $.data.id }
            - call: "POST /clearinghouse/providers/${prov_a}/credentials/${cred_a}/submit"
              payload: {}
              as: ProviderAdmin
              as_user_id: "${prov_a}"
            - call: "POST /clearinghouse/providers/${prov_a}/activate"
              payload: {}
              as: ClearinghouseOps
            - call: "POST /clearinghouse/payers"
              payload: { payer_id_code: "PAYSH", display_name: "Shared Payer", claims_lead_time_days: 1, remittance_lead_time_days: 1, eligibility_lead_time_seconds: 60, pricing_model: "SHARED", shared_provider_pct: 0.5, monthly_minimum_cents: 0 }
              as: ClearinghouseOps
              captures: { pay_a: $.data.id }
            - call: "POST /clearinghouse/payers/${pay_a}/pricing-tiers"
              payload: { applies_to: "CLAIM", volume_floor: 1, rate_cents: 3 }
              as: ClearinghouseOps
            - call: "POST /clearinghouse/payers/${pay_a}/pricing-tiers"
              payload: { applies_to: "ELIGIBILITY", volume_floor: 1, rate_cents: 3 }
              as: ClearinghouseOps
            - call: "POST /clearinghouse/providers/${prov_a}/enrollments"
              payload: { payer_id: "${pay_a}", transaction_type: "CLAIMS_837" }
              as: ProviderAdmin
              as_user_id: "${prov_a}"
              captures: { enr_c: $.data.id }
            - call: "POST /clearinghouse/providers/${prov_a}/enrollments/${enr_c}/submit"
              payload: {}
              as: ProviderAdmin
              as_user_id: "${prov_a}"
            - call: "POST /clearinghouse/_enrollments/${enr_c}/advance-to-review"
              payload: {}
              as: ClearinghouseOps
            - call: "GET /clearinghouse/providers/${prov_a}/enrollments/${enr_c}"
              payload: {}
              as: ProviderAdmin
              as_user_id: "${prov_a}"
              captures: { enr_c_v: $.data.version }
            - call: "POST /clearinghouse/enrollments/${enr_c}/payer-decision"
              payload: { decision: "APPROVE", expected_enrollment_version: "${enr_c_v}" }
              as: PayerOperator
              as_user_id: "${pay_a}"
            - call: "POST /clearinghouse/providers/${prov_a}/enrollments"
              payload: { payer_id: "${pay_a}", transaction_type: "ELIGIBILITY_270" }
              as: ProviderAdmin
              as_user_id: "${prov_a}"
              captures: { enr_e: $.data.id }
            - call: "POST /clearinghouse/providers/${prov_a}/enrollments/${enr_e}/submit"
              payload: {}
              as: ProviderAdmin
              as_user_id: "${prov_a}"
            - call: "POST /clearinghouse/_enrollments/${enr_e}/advance-to-review"
              payload: {}
              as: ClearinghouseOps
            - call: "GET /clearinghouse/providers/${prov_a}/enrollments/${enr_e}"
              payload: {}
              as: ProviderAdmin
              as_user_id: "${prov_a}"
              captures: { enr_e_v: $.data.version }
            - call: "POST /clearinghouse/enrollments/${enr_e}/payer-decision"
              payload: { decision: "APPROVE", expected_enrollment_version: "${enr_e_v}" }
              as: PayerOperator
              as_user_id: "${pay_a}"
            - call: "POST /clearinghouse/providers/${prov_a}/claims"
              payload: { payer_id: "${pay_a}", submitter_credential_id: "${cred_a}", patient_control_number: "PCN-H1", idempotency_key: "IDEM-H1", service_date: "2026-09-05T00:00:00Z", total_charge_cents: 5000, diagnosis_codes: ["E11.9"], rendering_npi: "1987654321", subscriber_id: "MBR-H1", lines: [{ cpt_code: "99213", units: 1, unit_charge_cents: 5000 }] }
              as: ProviderAdmin
              as_user_id: "${prov_a}"
              captures: { clm_a: $.data.id, clm_a_v: $.data.version }
            - call: "POST /clearinghouse/claims/${clm_a}/forward"
              payload: { expected_claim_version: "${clm_a_v}" }
              as: ClearinghouseOps
            - call: "POST /clearinghouse/providers/${prov_a}/eligibility"
              payload: { payer_id: "${pay_a}", subscriber_id: "MBR-H1", service_type_code: "30", idempotency_key: "IDEM-E1" }
              as: ProviderAdmin
              as_user_id: "${prov_a}"
              captures: { inq_a: $.data.id }
            - call: "POST /clearinghouse/eligibility/${inq_a}/respond"
              payload: { benefit_summary: { coverage: "ACTIVE", copay_cents: 2500 } }
              as: PayerOperator
              as_user_id: "${pay_a}"
            - call: "POST /clearinghouse/providers/${prov_a}/usage-invoices"
              payload: { period_yyyy_mm: "2026-09" }
              as: ClearinghouseOps
              captures: { inv_a: $.data.id, inv_a_v: $.data.version }
            - call: "POST /clearinghouse/_clock/set_current_utc"
              payload: { current_utc: "2026-10-01T00:00:00Z" }
              as: ClearinghouseOps
          trigger:
            - call: "POST /clearinghouse/usage-invoices/${inv_a}/finalize"
              payload: { expected_invoice_version: "${inv_a_v}" }
              as: ClearinghouseOps
          assert:
            - "claim_fee for September: 1 unit × 3 cents × 0.5 = 1.5 → round_half_up to 2 cents (per (kind, payer) rounding)"
            - "eligibility_fee for September: 1 unit × 3 cents × 0.5 = 1.5 → round_half_up to 2 cents"
            - "UsageInvoice.${inv_a}.gross_fee_cents == 4 (2+2 after per-line rounding)"
            - "UsageInvoice.${inv_a}.gross_fee_cents != 3 — the alternative 'sum raw fractional cents then round' would yield round_half_up(1.5+1.5)=3, so the rounding order is observable"
            - "UsageInvoice.${inv_a}.amount_due_cents == 4"

      - name: tiered_pricing_straddles_volume_floor_with_marginal_rate
        grounds:
          - calculations.monthly_usage_fee
          - entities.PayerPricingTier
        distinguishing_aspect: |
          Mode (a) tiered-rate selection with ≥3 inputs (units, floor, ceiling)
          and conditional branch on which tier each unit belongs to — units
          straddling the boundary pay marginal rates per tier, NOT average
          rate. Distinct mode from the nested-rounding instance.
        test_recipe:
          setup:
            - "Logical clock at 2026-10-01T00:00:00Z."
            - "Provider prov_a ACTIVE with billing_model=PROVIDER_FUNDED."
            - "Payer pay_a pricing_model=PROVIDER_FUNDED, monthly_minimum_cents=0."
            - "Pricing tiers for CLAIM: tier1 floor=1 ceiling=10 rate=100; tier2 floor=11 ceiling=null rate=50."
            - "Provider forwarded exactly 12 claims in September against pay_a (all to the same payer)."
            - "UsageInvoice inv for 2026-09 OPEN."
          setup_api_calls:
            - call: "POST /clearinghouse/_clock/set_current_utc"
