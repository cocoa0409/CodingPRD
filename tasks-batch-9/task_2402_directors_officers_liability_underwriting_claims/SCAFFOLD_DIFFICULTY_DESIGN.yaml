              payload: { claim_type: "SECURITIES_CLASS_ACTION", claimant_name: "Probe A", claimant_capacity: "THIRD_PARTY", wrongful_act_date: "2026-06-10T00:00:00Z", alleged_damages_usd: 1000000 }
              as: RiskManager
