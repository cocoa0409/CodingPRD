            - { call: "POST /turnarounds/${t_id}/advance", payload: {}, as: TurnaroundManager }
            - { call: "POST /contractors/${c_id}/mobilize", payload: {}, as: ContractorSupervisor, as_user_id: "${c_id}" }
            - { call: "POST /contractors/${c_id}/workers", payload: { full_name: "Rae Wolder", trade: "WELDER" }, as: ContractorSupervisor, as_user_id: "${c_id}", captures: { wk_id: "$.data.id" } }
            - { call: "POST /workers/${wk_id}/vet", payload: {}, as: PermitCoordinator }
            - { call: "POST /workers/${wk_id}/badge", payload: {}, as: PermitCoordinator }
            - { call: "POST /contractors/${c_id}/mobilize", payload: {}, as: ContractorSupervisor, as_user_id: "${c_id}" }
