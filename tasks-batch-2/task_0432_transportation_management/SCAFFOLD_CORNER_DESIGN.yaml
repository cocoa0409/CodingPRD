# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Breadth probe. Walks references/claim-extraction-guide.md row-by-row against
# SCAFFOLD.yaml §1.1–§1.7. section:/claim_type: values come from that guide.
# Corners already covered by a §1.8 instance are emitted as excluded_because stubs.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_carrier_returns_201_with_defaults
        claim_type: Creation
        grounds: [entities.Carrier, endpoints]
        distinguishing_aspect: "POST /tms/carriers with name/scac/mode -> 201; status=ACTIVE, delivered_count=0, on_time_count=0, claim_count=0, on_time_pct=null, scorecard_grade=PROBATION."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /tms/carriers"
              payload: { name: "Acme TL", scac: "ACME", mode: "TL" }
              as: CarrierOps
              captures: { carrier_id: $.data.id }
          assert:
            - "response.http_status == 201"
            - "Carrier.${carrier_id}.status == ACTIVE"
            - "Carrier.${carrier_id}.delivered_count == 0"
            - "Carrier.${carrier_id}.on_time_pct == null"
            - "Carrier.${carrier_id}.scorecard_grade == PROBATION"

      - name: get_order_returns_stored_entity
        claim_type: Retrieval
        grounds: [entities.Order, endpoints]
        distinguishing_aspect: "GET /tms/orders/{id} returns the stored order with status OPEN and all input fields echoed."
        test_recipe:
          setup: ["One order created Z1->Z2 weight 10000 declared 200000."]
          setup_api_calls:
            - call: "POST /tms/orders"
              payload: { customer_ref: "C1", origin_zone: "Z1", dest_zone: "Z2", weight_lbs: 10000, declared_value_cents: 200000 }
              as: ShipperOps
              captures: { order_id: $.data.id }
          trigger:
            - call: "GET /tms/orders/${order_id}"
              payload: {}
              as: ShipperOps
          assert:
            - "Order.${order_id}.status == OPEN"
            - "Order.${order_id}.weight_lbs == 10000"
            - "Order.${order_id}.declared_value_cents == 200000"

      - name: list_carriers_paginated_envelope
        claim_type: Listing
        grounds: [entities.Carrier, endpoints]
        distinguishing_aspect: "GET /tms/carriers returns an array envelope with pagination fields total_count and has_more."
        test_recipe:
          setup: ["Two carriers created."]
          setup_api_calls:
            - call: "POST /tms/carriers"
              payload: { name: "Acme TL", scac: "ACME", mode: "TL" }
              as: CarrierOps
            - call: "POST /tms/carriers"
              payload: { name: "Best LTL", scac: "BEST", mode: "LTL" }
              as: CarrierOps
          trigger:
            - call: "GET /tms/carriers"
              payload: { limit: 1, offset: 0 }
              as: ShipperOps
          assert:
            - "response.data is an array of length 1"
            - "response.meta pagination total_count == 2"
            - "response.meta pagination has_more == true"

      - name: get_shipment_nonexistent_returns_not_found
        claim_type: Not Found
        grounds:
          - "errors[ERR_SHIPMENT_NOT_FOUND]"
          - "endpoints"
        distinguishing_aspect: "GET /tms/shipments/{random-uuid} -> ERR_SHIPMENT_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /tms/shipments/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: ShipperOps
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_SHIPMENT_NOT_FOUND"
            - "response.http_status == 404"

      - name: create_shipment_missing_required_field_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - "validations[priority=5]"
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "POST /tms/shipments omitting distance_miles -> ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["One order exists."]
          setup_api_calls:
            - call: "POST /tms/orders"
              payload: { customer_ref: "C1", origin_zone: "Z1", dest_zone: "Z2", weight_lbs: 10000, declared_value_cents: 200000 }
              as: ShipperOps
              captures: { order_id: $.data.id }
          trigger:
            - call: "POST /tms/shipments"
              payload: { order_id: "${order_id}", mode: "TL", weight_lbs: 6000, promised_eta_minute: 500 }
              as: ShipperOps
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_INVALID_REQUEST"
            - "response.http_status == 422"

      - name: create_shipment_nonpositive_weight_returns_invalid_request
        claim_type: Type Constraints
        grounds:
          - "validations[priority=5]"
          - "errors[ERR_INVALID_REQUEST]"
          - "entities.Shipment.fields.weight_lbs"
        distinguishing_aspect: "POST /tms/shipments with weight_lbs=0 -> ERR_INVALID_REQUEST (422); weight must be > 0."
        test_recipe:
          setup: ["One order exists (weight 10000)."]
          setup_api_calls:
            - call: "POST /tms/orders"
              payload: { customer_ref: "C1", origin_zone: "Z1", dest_zone: "Z2", weight_lbs: 10000, declared_value_cents: 200000 }
              as: ShipperOps
              captures: { order_id: $.data.id }
          trigger:
            - call: "POST /tms/shipments"
              payload: { order_id: "${order_id}", mode: "TL", distance_miles: 300, weight_lbs: 0, promised_eta_minute: 500 }
              as: ShipperOps
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_INVALID_REQUEST"
            - "response.http_status == 422"

      - name: create_contract_rate_default_fuel_surcharge_zero
        claim_type: Defaults
        grounds: [entities.ContractRate.fields.fuel_surcharge_pct, endpoints]
        distinguishing_aspect: "POST /tms/contract-rates omitting fuel_surcharge_pct -> fuel_surcharge_pct defaults to 0."
        test_recipe:
          setup: ["One ACTIVE TL carrier."]
          setup_api_calls:
            - call: "POST /tms/carriers"
              payload: { name: "Acme TL", scac: "ACME", mode: "TL" }
              as: CarrierOps
              captures: { carrier_id: $.data.id }
          trigger:
            - call: "POST /tms/contract-rates"
              payload: { carrier_id: "${carrier_id}", mode: "TL", origin_zone: "Z1", dest_zone: "Z2", base_rate_per_mile_cents: 200, min_charge_cents: 50000, effective_start_minute: 0, effective_end_minute: 1000 }
              as: CarrierOps
              captures: { rate_id: $.data.id }
          assert:
            - "ContractRate.${rate_id}.fuel_surcharge_pct == 0"
            - "ContractRate.${rate_id}.status == ACTIVE"

      - name: shipment_system_fields_input_ignored
        claim_type: System Fields
        grounds: [entities.Shipment.fields.tender_status, entities.Shipment.fields.execution_status]
        distinguishing_aspect: "POST /tms/shipments attempting to set tender_status/execution_status is ignored; server forces UNTENDERED/PENDING. (Payload-extra-field is rejected per §1.5 input closure or silently ignored; the system fields are server-set regardless.)"
        test_recipe:
          setup: ["One order exists."]
          setup_api_calls:
            - call: "POST /tms/orders"
              payload: { customer_ref: "C1", origin_zone: "Z1", dest_zone: "Z2", weight_lbs: 10000, declared_value_cents: 200000 }
              as: ShipperOps
              captures: { order_id: $.data.id }
          trigger:
            - call: "POST /tms/shipments"
              payload: { order_id: "${order_id}", mode: "TL", distance_miles: 300, weight_lbs: 6000, promised_eta_minute: 500 }
              as: ShipperOps
              captures: { ship_id: $.data.id }
          assert:
            - "Shipment.${ship_id}.tender_status == UNTENDERED"
            - "Shipment.${ship_id}.execution_status == PENDING"
            - "Shipment.${ship_id}.quoted_cost_cents == null"

      - name: create_shipment_bubbles_order_to_planned
        claim_type: Parent Relationships
        grounds: [entities.Shipment.fields.order_id, state_machines.Order.OPEN_to_PLANNED]
        distinguishing_aspect: "Creating the first shipment for an OPEN order drives Order.status OPEN -> PLANNED (flat-FK cross-reference + bubble-up)."
        test_recipe:
          setup: ["One OPEN order."]
          setup_api_calls:
            - call: "POST /tms/orders"
              payload: { customer_ref: "C1", origin_zone: "Z1", dest_zone: "Z2", weight_lbs: 10000, declared_value_cents: 200000 }
              as: ShipperOps
              captures: { order_id: $.data.id }
          trigger:
            - call: "POST /tms/shipments"
              payload: { order_id: "${order_id}", mode: "TL", distance_miles: 300, weight_lbs: 6000, promised_eta_minute: 500 }
              as: ShipperOps
              captures: { ship_id: $.data.id }
          assert:
            - "Order.${order_id}.status == PLANNED"

      - name: create_shipment_unknown_order_id_returns_not_found
        claim_type: Not Found
        grounds:
          - "validations[priority=4]"
          - "errors[ERR_ORDER_NOT_FOUND]"
        distinguishing_aspect: "POST /tms/shipments with a non-existent order_id body FK -> ERR_ORDER_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /tms/shipments"
              payload: { order_id: "00000000-0000-4000-8000-000000000000", mode: "TL", distance_miles: 300, weight_lbs: 6000, promised_eta_minute: 500 }
              as: ShipperOps
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_ORDER_NOT_FOUND"
            - "response.http_status == 404"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: suspend_already_suspended_carrier_returns_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - "state_machines.Carrier.ACTIVE_to_SUSPENDED"
          - "errors[ERR_CARRIER_NOT_ACTIVE]"
        distinguishing_aspect: "Suspending a SUSPENDED carrier -> ERR_CARRIER_NOT_ACTIVE (409); no double-suspend."
        test_recipe:
          setup: ["One carrier, suspended once."]
          setup_api_calls:
            - call: "POST /tms/carriers"
              payload: { name: "Acme TL", scac: "ACME", mode: "TL" }
              as: CarrierOps
              captures: { carrier_id: $.data.id }
            - call: "POST /tms/carriers/${carrier_id}/suspend"
              payload: {}
              as: CarrierOps
          trigger:
            - call: "POST /tms/carriers/${carrier_id}/suspend"
              payload: {}
              as: CarrierOps
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_CARRIER_NOT_ACTIVE"
            - "response.http_status == 409"

      - name: accept_already_accepted_tender_returns_not_offered
        claim_type: Idempotency
        grounds:
          - "state_machines.Tender.OFFERED_to_ACCEPTED"
          - "errors[ERR_TENDER_NOT_OFFERED]"
        distinguishing_aspect: "Accepting a tender twice -> second accept returns ERR_TENDER_NOT_OFFERED (409); tender already ACCEPTED."
        test_recipe:
          setup: ["A shipment with an ACCEPTED tender."]
          setup_api_calls:
            - call: "POST /tms/carriers"
              payload: { name: "Acme TL", scac: "ACME", mode: "TL" }
              as: CarrierOps
              captures: { carrier_a_id: $.data.id }
            - call: "POST /tms/contract-rates"
              payload: { carrier_id: "${carrier_a_id}", mode: "TL", origin_zone: "Z1", dest_zone: "Z2", base_rate_per_mile_cents: 250, min_charge_cents: 50000, fuel_surcharge_pct: 0.15, effective_start_minute: 0, effective_end_minute: 1000 }
              as: CarrierOps
            - call: "POST /tms/orders"
              payload: { customer_ref: "C1", origin_zone: "Z1", dest_zone: "Z2", weight_lbs: 10000, declared_value_cents: 200000 }
              as: ShipperOps
              captures: { order_id: $.data.id }
            - call: "POST /tms/shipments"
              payload: { order_id: "${order_id}", mode: "TL", distance_miles: 300, weight_lbs: 6000, promised_eta_minute: 500 }
              as: ShipperOps
              captures: { ship_id: $.data.id }
            - call: "POST /tms/shipments/${ship_id}/tenders"
              payload: { tender_minute: 100 }
              as: ShipperOps
              captures: { tender_id: $.data.id }
            - call: "POST /tms/tenders/${tender_id}/accept"
              payload: {}
              as: CarrierOps
          trigger:
            - call: "POST /tms/tenders/${tender_id}/accept"
              payload: {}
              as: CarrierOps
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_TENDER_NOT_OFFERED"
            - "response.http_status == 409"

      - name: deliver_shipment_not_in_transit_returns_invalid_state
        claim_type: Precondition Enforcement
        grounds:
          - "state_machines.Shipment.execution_status=IN_TRANSIT_to_execution_status=DELIVERED"
          - "errors[ERR_SHIPMENT_NOT_IN_TRANSIT]"
        distinguishing_aspect: "Delivering a PENDING shipment (never departed) -> ERR_SHIPMENT_NOT_IN_TRANSIT (409)."
        test_recipe:
          setup: ["A booked shipment still PENDING (never departed)."]
          setup_api_calls:
            - call: "POST /tms/carriers"
              payload: { name: "Acme TL", scac: "ACME", mode: "TL" }
              as: CarrierOps
              captures: { carrier_a_id: $.data.id }
            - call: "POST /tms/contract-rates"
              payload: { carrier_id: "${carrier_a_id}", mode: "TL", origin_zone: "Z1", dest_zone: "Z2", base_rate_per_mile_cents: 250, min_charge_cents: 50000, fuel_surcharge_pct: 0.15, effective_start_minute: 0, effective_end_minute: 1000 }
              as: CarrierOps
            - call: "POST /tms/orders"
              payload: { customer_ref: "C1", origin_zone: "Z1", dest_zone: "Z2", weight_lbs: 10000, declared_value_cents: 200000 }
              as: ShipperOps
              captures: { order_id: $.data.id }
            - call: "POST /tms/shipments"
              payload: { order_id: "${order_id}", mode: "TL", distance_miles: 300, weight_lbs: 6000, promised_eta_minute: 500 }
              as: ShipperOps
              captures: { ship_id: $.data.id }
            - call: "POST /tms/shipments/${ship_id}/tenders"
              payload: { tender_minute: 100 }
              as: ShipperOps
              captures: { tender_id: $.data.id }
            - call: "POST /tms/tenders/${tender_id}/accept"
              payload: {}
              as: CarrierOps
          trigger:
            - call: "POST /tms/shipments/${ship_id}/deliver"
              payload: { delivered_minute: 400 }
              as: CarrierOps
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_SHIPMENT_NOT_IN_TRANSIT"
            - "response.http_status == 409"

      - name: cancel_order_not_open_returns_not_cancellable
        claim_type: Invalid Transitions
        grounds:
          - "state_machines.Order.OPEN_to_CANCELLED"
          - "errors[ERR_ORDER_NOT_CANCELLABLE]"
        distinguishing_aspect: "Cancelling a PLANNED order (already has a shipment) -> ERR_ORDER_NOT_CANCELLABLE (409); cancel only from OPEN."
        test_recipe:
          setup: ["An order moved to PLANNED by creating a shipment."]
          setup_api_calls:
            - call: "POST /tms/orders"
              payload: { customer_ref: "C1", origin_zone: "Z1", dest_zone: "Z2", weight_lbs: 10000, declared_value_cents: 200000 }
              as: ShipperOps
              captures: { order_id: $.data.id }
            - call: "POST /tms/shipments"
              payload: { order_id: "${order_id}", mode: "TL", distance_miles: 300, weight_lbs: 6000, promised_eta_minute: 500 }
              as: ShipperOps
          trigger:
            - call: "POST /tms/orders/${order_id}/cancel"
              payload: {}
              as: ShipperOps
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_ORDER_NOT_CANCELLABLE"
            - "response.http_status == 409"

      - name: load_close_with_undelivered_shipment_rejected
        claim_type: Precondition Enforcement
        grounds:
          - "state_machines.Load.DISPATCHED_to_CLOSED"
          - "errors[ERR_LOAD_HAS_UNDELIVERED_SHIPMENTS]"
        distinguishing_aspect: "Closing a DISPATCHED load whose shipment is still IN_TRANSIT -> ERR_LOAD_HAS_UNDELIVERED_SHIPMENTS (409)."
        test_recipe:
          setup: ["Load DISPATCHED, its one shipment departed (IN_TRANSIT) but not delivered."]
          setup_api_calls:
            - call: "POST /tms/carriers"
              payload: { name: "Acme TL", scac: "ACME", mode: "TL" }
              as: CarrierOps
              captures: { carrier_a_id: $.data.id }
            - call: "POST /tms/contract-rates"
              payload: { carrier_id: "${carrier_a_id}", mode: "TL", origin_zone: "Z1", dest_zone: "Z2", base_rate_per_mile_cents: 250, min_charge_cents: 50000, fuel_surcharge_pct: 0.15, effective_start_minute: 0, effective_end_minute: 1000 }
              as: CarrierOps
            - call: "POST /tms/orders"
              payload: { customer_ref: "C1", origin_zone: "Z1", dest_zone: "Z2", weight_lbs: 10000, declared_value_cents: 200000 }
              as: ShipperOps
              captures: { order_id: $.data.id }
            - call: "POST /tms/shipments"
              payload: { order_id: "${order_id}", mode: "TL", distance_miles: 300, weight_lbs: 6000, promised_eta_minute: 500 }
              as: ShipperOps
              captures: { ship_id: $.data.id }
            - call: "POST /tms/shipments/${ship_id}/tenders"
              payload: { tender_minute: 100 }
              as: ShipperOps
              captures: { tender_id: $.data.id }
            - call: "POST /tms/tenders/${tender_id}/accept"
              payload: {}
              as: CarrierOps
            - call: "POST /tms/loads"
              payload: { carrier_id: "${carrier_a_id}", planned_capacity_lbs: 10000 }
              as: DockOps
              captures: { load_id: $.data.id, load_v: $.data.version }
            - call: "POST /tms/loads/${load_id}/shipments"
              payload: { shipment_id: "${ship_id}", expected_load_version: "${load_v}" }
              as: DockOps
            - call: "POST /tms/dock-appointments"
              payload: { load_id: "${load_id}", dock_door: "D1", start_minute: 200, end_minute: 260 }
              as: DockOps
            - call: "POST /tms/loads/${load_id}/dispatch"
              payload: {}
              as: DockOps
            - call: "POST /tms/shipments/${ship_id}/depart"
              payload: {}
              as: CarrierOps
          trigger:
            - call: "POST /tms/loads/${load_id}/close"
              payload: {}
              as: DockOps
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_LOAD_HAS_UNDELIVERED_SHIPMENTS"
            - "response.http_status == 409"

      - name: dispatch_empty_load_rejected
        claim_type: Precondition Enforcement
        grounds:
          - "state_machines.Load.BUILDING_to_DISPATCHED"
          - "errors[ERR_EMPTY_LOAD]"
        distinguishing_aspect: "Dispatching a BUILDING load with no shipments (consolidated_weight_lbs=0) -> ERR_EMPTY_LOAD (409). (Dock appointment exists so it is the emptiness, not the appointment, that fails.)"
        test_recipe:
          setup: ["A BUILDING load with a SCHEDULED dock appointment but zero shipments."]
          setup_api_calls:
            - call: "POST /tms/carriers"
              payload: { name: "Acme TL", scac: "ACME", mode: "TL" }
              as: CarrierOps
              captures: { carrier_a_id: $.data.id }
            - call: "POST /tms/loads"
              payload: { carrier_id: "${carrier_a_id}", planned_capacity_lbs: 10000 }
              as: DockOps
              captures: { load_id: $.data.id }
            - call: "POST /tms/dock-appointments"
              payload: { load_id: "${load_id}", dock_door: "D1", start_minute: 200, end_minute: 260 }
              as: DockOps
          trigger:
            - call: "POST /tms/loads/${load_id}/dispatch"
              payload: {}
              as: DockOps
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_EMPTY_LOAD"
            - "response.http_status == 409"

      - name: dispatch_load_without_dock_appointment_rejected
        claim_type: Precondition Enforcement
        grounds:
          - "state_machines.Load.BUILDING_to_DISPATCHED"
          - "errors[ERR_NO_DOCK_APPOINTMENT]"
        distinguishing_aspect: "Dispatching a non-empty BUILDING load that has no SCHEDULED/CHECKED_IN dock appointment -> ERR_NO_DOCK_APPOINTMENT (409)."
        test_recipe:
          setup: ["BUILDING load with one consolidated shipment but NO dock appointment."]
          setup_api_calls:
            - call: "POST /tms/carriers"
              payload: { name: "Acme TL", scac: "ACME", mode: "TL" }
              as: CarrierOps
              captures: { carrier_a_id: $.data.id }
            - call: "POST /tms/contract-rates"
              payload: { carrier_id: "${carrier_a_id}", mode: "TL", origin_zone: "Z1", dest_zone: "Z2", base_rate_per_mile_cents: 250, min_charge_cents: 50000, fuel_surcharge_pct: 0.15, effective_start_minute: 0, effective_end_minute: 1000 }
              as: CarrierOps
            - call: "POST /tms/orders"
              payload: { customer_ref: "C1", origin_zone: "Z1", dest_zone: "Z2", weight_lbs: 10000, declared_value_cents: 200000 }
              as: ShipperOps
              captures: { order_id: $.data.id }
            - call: "POST /tms/shipments"
              payload: { order_id: "${order_id}", mode: "TL", distance_miles: 300, weight_lbs: 6000, promised_eta_minute: 500 }
              as: ShipperOps
              captures: { ship_id: $.data.id }
            - call: "POST /tms/shipments/${ship_id}/tenders"
              payload: { tender_minute: 100 }
              as: ShipperOps
              captures: { tender_id: $.data.id }
            - call: "POST /tms/tenders/${tender_id}/accept"
              payload: {}
              as: CarrierOps
            - call: "POST /tms/loads"
              payload: { carrier_id: "${carrier_a_id}", planned_capacity_lbs: 10000 }
              as: DockOps
              captures: { load_id: $.data.id, load_v: $.data.version }
            - call: "POST /tms/loads/${load_id}/shipments"
              payload: { shipment_id: "${ship_id}", expected_load_version: "${load_v}" }
              as: DockOps
          trigger:
            - call: "POST /tms/loads/${load_id}/dispatch"
              payload: {}
              as: DockOps
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_NO_DOCK_APPOINTMENT"
            - "response.http_status == 409"

      - name: release_appointment_not_checked_in_rejected
        claim_type: Invalid Transitions
        grounds:
          - "state_machines.DockAppointment.CHECKED_IN_to_RELEASED"
          - "errors[ERR_APPT_NOT_CHECKED_IN]"
        distinguishing_aspect: "Releasing a SCHEDULED (not yet CHECKED_IN) appointment -> ERR_APPT_NOT_CHECKED_IN (409)."
        test_recipe:
          setup: ["A SCHEDULED dock appointment."]
          setup_api_calls:
            - call: "POST /tms/carriers"
              payload: { name: "Acme TL", scac: "ACME", mode: "TL" }
              as: CarrierOps
              captures: { carrier_a_id: $.data.id }
            - call: "POST /tms/loads"
              payload: { carrier_id: "${carrier_a_id}", planned_capacity_lbs: 10000 }
              as: DockOps
              captures: { load_id: $.data.id }
            - call: "POST /tms/dock-appointments"
              payload: { load_id: "${load_id}", dock_door: "D1", start_minute: 0, end_minute: 60 }
              as: DockOps
              captures: { appt_id: $.data.id }
          trigger:
            - call: "POST /tms/dock-appointments/${appt_id}/release"
              payload: {}
              as: DockOps
