          - roles.Volunteer
        distinguishing_aspect: |
          Reviewing an adoption agreement is exclusive to StewardshipCoordinator; a Volunteer
          attempting it is refused with HTTP 403 ERR_FORBIDDEN_ROLE before any state check runs, so
          the agreement stays SUBMITTED.
        test_recipe:
          setup:
