          - state_machines.PhytoCertificate.VALID_to_EXPIRED
          - state_machines.Shipment.DRAFT_to_DISPATCHED
          - entities.PhytoCertificate.fields.valid_until
        distinguishing_aspect: |
          Interval semantics = HALF-OPEN TIME WINDOW on a PhytoCertificate
          (different resource and geometry from the zone aggregate-capacity rule):
          the dispatch instant must satisfy clock_now <= valid_until; an instant
          strictly past valid_until falls outside the window and is rejected with
          ERR_PHYTO_EXPIRED. Time-point vs window, not footprint vs capacity.
        test_recipe:
          setup:
            - "requires_phyto variety, SALEABLE batch live=20 published @300c (broker NY). Cert valid_until=2026-02-10T00:00:00Z. Order confirmed, shipment DRAFT with cert. Clock advanced to 2026-02-11 (past valid_until)."
