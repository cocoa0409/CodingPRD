              captures: { veh_q1_id: $.data.id, veh_q1_ver: $.data.version }
            - call: "POST /car-share/reservations"
              payload: { member_id: "${m_ada_id}", pod_id: "${pod_adj_id}", vehicle_id: "${veh_q1_id}", start_at: "2026-09-05T09:00:00Z", end_at: "2026-09-05T13:00:00Z", reserved_hours: 4, expected_vehicle_version: "${veh_q1_ver}" }
              as: Member
              as_user_id: "${m_ada_id}"
              captures: { res_q1_id: $.data.id }
          trigger:
            - call: "POST /car-share/reservations"
              payload: { member_id: "${m_ada_id}", pod_id: "${pod_adj_id}", vehicle_id: "${veh_q1_id}", start_at: "2026-09-05T13:00:00Z", end_at: "2026-09-05T17:00:00Z", reserved_hours: 4, expected_vehicle_version: "${veh_q1_ver}" }
              as: Member
              as_user_id: "${m_ada_id}"
              captures: { res_q2_id: $.data.id }
            - call: "POST /car-share/reservations"
              payload: { member_id: "${m_ada_id}", pod_id: "${pod_adj_id}", vehicle_id: "${veh_q1_id}", start_at: "2026-09-05T12:59:00Z", end_at: "2026-09-05T16:00:00Z", reserved_hours: 3, expected_vehicle_version: "${veh_q1_ver}" }
              as: Member
              as_user_id: "${m_ada_id}"
              captures: { err_q1: $.data.error_id }
          assert:
            - "Reservation.${res_q2_id}.status == CONFIRMED"
            - "${err_q1} == \"ERR_VEHICLE_DOUBLE_BOOKED\""

      - name: maintenance_window_contains_semantics_against_live_reservation
        grounds:
          - validations[priority=24]
          - state_machines.MaintenanceOrder.SCHEDULED_to_BLOCKED
          - entities.MaintenanceOrder.fields.scheduled_start
          - entities.MaintenanceOrder.fields.scheduled_end
        distinguishing_aspect: "Maintenance intervals use containment semantics rather than naive disjointness: a maintenance window that fully CONTAINS a live reservation window must be rejected, so a three-hour maintenance block scheduled 2026-09-13T10:00:00Z to 2026-09-13T13:00:00Z cannot be booked around a live reservation occupying 2026-09-13T11:00:00Z to 2026-09-13T12:00:00Z."
        test_recipe:
          setup:
            - "One approved member with an ACTIVE membership, one AVAILABLE campus-pod vehicle"
            - "One CONFIRMED reservation on that vehicle occupying 2026-09-13T11:00:00Z to 2026-09-13T12:00:00Z"
          setup_api_calls:
            - call: "POST /car-share/member-registrations"
              payload: { full_name: "Mona Maint", email: "mona.maint@x.com", kind: "INDIVIDUAL" }
              as: Anonymous
              captures: { m_mona_id: $.data.id }
            - call: "POST /car-share/driving-record-reports/{id}/decision"
              payload: { report_decision: "CLEAR" }
              as: PodOperator
            - call: "POST /car-share/members/{id}/application-decision"
              payload: { decision: "APPROVE" }
              as: PodOperator
            - call: "POST /car-share/pods"
              payload: { name: "Campus Maint", site_type: "CAMPUS", capacity: 4, fuel_floor_pct: 20 }
              as: FleetAdmin
              captures: { pod_mnt_id: $.data.id }
            - call: "POST /car-share/vehicles"
              payload: { pod_id: "${pod_mnt_id}", vin: "VIN3158R1", model: "Sonic", capacity_seats: 5, next_service_miles: 24000 }
              as: FleetAdmin
              captures: { veh_r1_id: $.data.id, veh_r1_ver: $.data.version }
            - call: "POST /car-share/reservations"
              payload: { member_id: "${m_mona_id}", pod_id: "${pod_mnt_id}", vehicle_id: "${veh_r1_id}", start_at: "2026-09-13T11:00:00Z", end_at: "2026-09-13T12:00:00Z", reserved_hours: 1, expected_vehicle_version: "${veh_r1_ver}" }
              as: Member
              as_user_id: "${m_mona_id}"
              captures: { res_r1_id: $.data.id }
          trigger:
            - call: "POST /car-share/maintenance-orders"
              payload: { vehicle_id: "${veh_r1_id}", pod_id: "${pod_mnt_id}", reason: "CONTAINMENT_PROBE", blocking: true, scheduled_start: "2026-09-13T10:00:00Z", scheduled_end: "2026-09-13T13:00:00Z" }
              as: PodOperator
              captures: { err_r1: $.data.error_id }
          assert:
            - "${err_r1} == \"ERR_MAINTENANCE_WINDOW_CONFLICT\""
            - "Reservation.${res_r1_id}.status == CONFIRMED"

  # ===========================================================================
  # Rule 9 — compensating_invariant (>= 2 instances, different conserved
  #          quantities)
  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: wallet_credit_and_hold_conservation
        grounds:
          - calculations.membership_thaw_and_residual_release
          - state_machines.Reservation.RETURNED_to_CLOSED
          - state_machines.Incident.ASSESSED_to_CLOSED
          - entities.Member.fields.wallet_credit_cents
          - entities.Member.fields.wallet_hold_cents
        distinguishing_aspect: "Two named quantities are conserved across the forward and compensating gesture: the released hold re-credits wallet_credit_cents by exactly the 2000 that the confirmation debited into wallet_hold_cents, and the low-severity incident close credits 0 in this configuration so the total returns exactly to its pre-booking value."
        test_recipe:
          setup:
            - "One approved individual member with an ACTIVE membership and an AVAILABLE campus-pod vehicle"
            - "One CONFIRMED reservation, one posted fuel-card transaction, one OPEN DAMAGE incident on it"
            - "Logical clock at 2026-09-05T10:00:00Z"
          setup_api_calls:
            - call: "POST /car-share/member-registrations"
              payload: { full_name: "Ivan Invariant", email: "ivan.invariant@x.com", kind: "INDIVIDUAL" }
              as: Anonymous
              captures: { m_ivan_id: $.data.id }
            - call: "POST /car-share/driving-record-reports/{id}/decision"
              payload: { report_decision: "CLEAR" }
              as: PodOperator
            - call: "POST /car-share/members/{id}/application-decision"
              payload: { decision: "APPROVE" }
              as: PodOperator
            - call: "POST /car-share/pods"
              payload: { name: "Campus Conservation", site_type: "CAMPUS", capacity: 4, fuel_floor_pct: 20 }
              as: FleetAdmin
              captures: { pod_con_id: $.data.id }
            - call: "POST /car-share/vehicles"
              payload: { pod_id: "${pod_con_id}", vin: "VIN3158S1", model: "Cobalt", capacity_seats: 5, next_service_miles: 21000 }
              as: FleetAdmin
              captures: { veh_s1_id: $.data.id, veh_s1_ver: $.data.version }
            - call: "POST /car-share/reservations"
              payload: { member_id: "${m_ivan_id}", pod_id: "${pod_con_id}", vehicle_id: "${veh_s1_id}", start_at: "2026-09-05T09:00:00Z", end_at: "2026-09-05T13:00:00Z", reserved_hours: 4, expected_vehicle_version: "${veh_s1_ver}" }
              as: Member
              as_user_id: "${m_ivan_id}"
              captures: { res_s1_id: $.data.id }
            - call: "POST /car-share/fuel-card-transactions"
              payload: { reservation_id: "${res_s1_id}", vehicle_id: "${veh_s1_id}", amount_cents: 3600, gallons_hundredths: 900 }
              as: Member
              as_user_id: "${m_ivan_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-05T10:00:00Z" }
              as: PlatformAdmin
            - call: "POST /car-share/incidents"
              payload: { reservation_id: "${res_s1_id}", vehicle_id: "${veh_s1_id}", member_id: "${m_ivan_id}", incident_type: "DAMAGE", repair_cost_cents: 6000 }
              as: PodOperator
              captures: { inc_s1_id: $.data.id, inc_s1_ver: $.data.version }
          trigger:
            - call: "POST /car-share/reservations/{id}/close"
              payload: {}
              as: Member
              as_user_id: "${m_ivan_id}"
            - call: "POST /car-share/incidents/{id}/party-split"
              payload: { expected_incident_version: "${inc_s1_ver}" }
              as: PodOperator
          assert:
            - "Reservation.${res_s1_id}.status == CLOSED"
            - "Member.${m_ivan_id}.wallet_hold_cents == 0"
            - "Member.${m_ivan_id}.wallet_credit_cents == 2000"
            - "Incident.${inc_s1_id}.status == CLOSED"

      - name: service_bay_conservation_across_relocation
        grounds:
          - calculations.pod_utilization
          - state_machines.Vehicle.AVAILABLE_to_AVAILABLE
          - entities.Pod.fields.available_bays
          - entities.Vehicle.fields.home_pod_id
        distinguishing_aspect: "A different conserved quantity: the sum of occupied service bays across the source and destination pods is unchanged by a relocation bundle, because one vehicle leaves the source bay pool and exactly one enters the destination bay pool."
        test_recipe:
          setup:
            - "A source campus pod with three AVAILABLE vehicles and a destination campus pod with zero vehicles"
          setup_api_calls:
            - call: "POST /car-share/pods"
              payload: { name: "Bay Source", site_type: "CAMPUS", capacity: 6, fuel_floor_pct: 20 }
              as: FleetAdmin
              captures: { pod_src_id: $.data.id }
            - call: "POST /car-share/pods"
              payload: { name: "Bay Dest", site_type: "CAMPUS", capacity: 6, fuel_floor_pct: 20 }
              as: FleetAdmin
              captures: { pod_dst_id: $.data.id, pod_dst_ver: $.data.version }
            - call: "POST /car-share/vehicles"
              payload: { pod_id: "${pod_src_id}", vin: "VIN3158T1", model: "Fit", capacity_seats: 5, next_service_miles: 30000 }
              as: FleetAdmin
              captures: { veh_t1_id: $.data.id, veh_t1_ver: $.data.version }
            - call: "POST /car-share/vehicles"
              payload: { pod_id: "${pod_src_id}", vin: "VIN3158T2", model: "Fit", capacity_seats: 5, next_service_miles: 30000 }
              as: FleetAdmin
              captures: { veh_t2_id: $.data.id }
            - call: "POST /car-share/vehicles"
              payload: { pod_id: "${pod_src_id}", vin: "VIN3158T3", model: "Fit", capacity_seats: 5, next_service_miles: 30000 }
              as: FleetAdmin
              captures: { veh_t3_id: $.data.id }
          trigger:
            - call: "POST /car-share/shift-bundles"
              payload: { source_pod_id: "${pod_src_id}", dest_pod_id: "${pod_dst_id}", scheduled_start: "2026-09-14T02:00:00Z", scheduled_end: "2026-09-14T06:00:00Z", monthly_pods: ["${veh_t1_id}"], expected_pod_version_profile: "${pod_dst_ver}" }
              as: PodOperator
              captures: { bundle_t_id: $.data.id }
          assert:
            - "Pod.${pod_src_id}.available_bays == 4"
            - "Pod.${pod_dst_id}.available_bays == 5"
            - "Pod.${pod_src_id}.available_bays + Pod.${pod_dst_id}.available_bays == 9"
            - "Vehicle.${veh_t1_id}.home_pod_id == \"${pod_dst_id}\""