              payload: { option_index: 0 }
              as: Viewer
              as_user_id: "${v1}"
          trigger:
            - call: "POST /interactions/${pollD}/votes"
              payload: { option_index: 1 }
              as: Viewer
              as_user_id: "${v1}"
