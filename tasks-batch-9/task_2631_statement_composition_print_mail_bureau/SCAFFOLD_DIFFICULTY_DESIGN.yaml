            - call: "POST /bureau/mail-pieces/${sl_p1_id}/scans"
              payload: { stage: "INDUCT", scanned_barcode: "${sl_p1_bar}", device_code: "SC-03" }
              as: IntegrityAuditor
            - call: "POST /bureau/mail-pieces/${sl_p2_id}/scans"
              payload: { stage: "PRINT", scanned_barcode: "${sl_p2_bar}", device_code: "SC-01" }
              as: IntegrityAuditor
            - call: "POST /bureau/mail-pieces/${sl_p2_id}/scans"
              payload: { stage: "INSERT", scanned_barcode: "${sl_p2_bar}", device_code: "SC-02" }
              as: IntegrityAuditor
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-06T10:00:00Z" }
              as: BureauAdmin
            - call: "POST /bureau/print-runs/${sl_run_id}/complete"
              payload: {}
              as: ProductionScheduler
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-06T11:00:00Z" }
              as: BureauAdmin
            - call: "POST /bureau/composition-jobs/${sl_job_id}/reconcile-integrity"
              payload: {}
              as: IntegrityAuditor
              captures: { sl_job_v: "$.data.version" }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-06T12:00:00Z" }
              as: BureauAdmin
