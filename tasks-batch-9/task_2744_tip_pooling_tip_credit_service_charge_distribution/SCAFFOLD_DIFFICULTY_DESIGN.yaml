  - rule_id: cross_entity_state_dependency
    instances:
      - name: create_shift_into_computed_pay_period_returns_period_not_open
        grounds:
          - validations.priority_12
          - errors.ERR_PAY_PERIOD_NOT_OPEN
          - entities.Shift.fields.pay_period_id
          - state_machines.PayPeriod.OPEN_to_COMPUTED
          - endpoints.POST_/shifts
        distinguishing_aspect: >-
          The legality of creating a Shift is decided by the state of a different entity that the
          payload only names in passing: the shift itself is perfectly well formed, its employee is
          assigned, its interval is free and its date is inside the period, yet the PayPeriod has
          moved to COMPUTED and a computed week may not grow new time. The dependency runs
          Shift to PayPeriod, and nothing on the Shift itself is wrong.
