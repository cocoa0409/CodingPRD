      - name: brief_effort_points_and_reserved_hours_match_the_declared_formula
        claim_type: Correct Result
        grounds:
          - calculations.brief_effort_points
          - calculations.sme_reserved_hours
        distinguishing_aspect: "A COMMERCIAL / DECISION brief of 1500 words scores 6 + 2*ceil(1500/500) + 4 + 0 = 16 effort points and ceil(16*0.5) = 8 reserved hours; the word-count term uses ceil on the step count, so 1500 words buys exactly three steps and not 3.0 rounded from a fractional term."
        test_recipe:
          setup:
            - "Clock parked at 2026-08-03T08:00:00.000Z; one ACTIVE campaign, no expert assignment needed."
          setup_api_calls:
            - call: "POST /editorial/_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T08:00:00.000Z" }
              as: ManagingEditor
            - call: "POST /editorial/campaigns"
              payload: { code: "CMP-EFFORT", persona: "IT_BUYER", primary_funnel_stage: "DECISION", quarter_code: "2026Q3" }
              as: ManagingEditor
              captures: { cmp_id: $.data.id }
            - call: "POST /editorial/campaigns/${cmp_id}/activate"
              payload: {}
              as: ManagingEditor
          trigger:
            - call: "POST /editorial/briefs"
              payload: { campaign_id: "${cmp_id}", funnel_stage: "DECISION", search_intent: "COMMERCIAL", primary_keyword: "zero trust platform pricing", target_word_count: 1500, required_expertise_tag: "security", review_window_start: "2026-08-03T09:00:00.000Z", review_window_end: "2026-08-03T17:00:00.000Z" }
              as: ManagingEditor
              captures: { brief_id: $.data.id, effort: $.data.effort_points, reserved: $.data.sme_reserved_hours }
          assert:
            - "the trigger call returns HTTP 201"
            - "${effort} == 16"
            - "${reserved} == 8"
            - "ContentBrief.${brief_id}.state == DRAFT"
            - "ContentBrief.${brief_id}.requires_regulated_review == false"
            - "ContentBrief.${brief_id}.secondary_keywords == []"

      - name: brief_effort_points_clamp_to_the_declared_min_and_max_constants
        claim_type: Constants Applied
        grounds:
          - calculations.brief_effort_points
          - calculations.sme_reserved_hours
        distinguishing_aspect: "Three briefs pin the clamp: a raw 5 rises to MIN_EFFORT_POINTS 6, a raw 53 falls to MAX_EFFORT_POINTS 40, and a raw 14 passes through untouched — so a server that omits either clamp or clamps unconditionally is caught by the same instance. Reserved hours follow the clamped value (3, 20 and 7), never the raw one."
        test_recipe:
          setup:
            - "Clock parked at 2026-08-03T08:00:00.000Z; one ACTIVE campaign."
            - "Brief LOW: NAVIGATIONAL / AWARENESS / 100 words / not regulated -> raw 3 + 2 + 0 + 0 = 5."
            - "Brief HIGH: TRANSACTIONAL / DECISION / 9000 words / regulated -> raw 8 + 36 + 4 + 5 = 53."
            - "Brief MID: INFORMATIONAL / CONSIDERATION / 2000 words / not regulated -> raw 4 + 8 + 2 + 0 = 14."
          setup_api_calls:
            - call: "POST /editorial/_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T08:00:00.000Z" }
              as: ManagingEditor
            - call: "POST /editorial/campaigns"
              payload: { code: "CMP-CLAMP", persona: "IT_BUYER", primary_funnel_stage: "DECISION", quarter_code: "2026Q3" }
              as: ManagingEditor
              captures: { cmp_id: $.data.id }
            - call: "POST /editorial/campaigns/${cmp_id}/activate"
              payload: {}
              as: ManagingEditor
          trigger:
            - call: "POST /editorial/briefs"
              payload: { campaign_id: "${cmp_id}", funnel_stage: "AWARENESS", search_intent: "NAVIGATIONAL", primary_keyword: "zero trust login", target_word_count: 100, required_expertise_tag: "security", review_window_start: "2026-08-03T09:00:00.000Z", review_window_end: "2026-08-03T12:00:00.000Z" }
              as: ManagingEditor
              captures: { low_effort: $.data.effort_points, low_reserved: $.data.sme_reserved_hours }
            - call: "POST /editorial/briefs"
              payload: { campaign_id: "${cmp_id}", funnel_stage: "DECISION", search_intent: "TRANSACTIONAL", primary_keyword: "buy zero trust licences", target_word_count: 9000, required_expertise_tag: "security", requires_regulated_review: true, review_window_start: "2026-08-04T02:00:00.000Z", review_window_end: "2026-08-04T22:00:00.000Z" }
              as: ManagingEditor
              captures: { high_effort: $.data.effort_points, high_reserved: $.data.sme_reserved_hours }
            - call: "POST /editorial/briefs"
              payload: { campaign_id: "${cmp_id}", funnel_stage: "CONSIDERATION", search_intent: "INFORMATIONAL", primary_keyword: "zero trust rollout stages", target_word_count: 2000, required_expertise_tag: "security", review_window_start: "2026-08-05T09:00:00.000Z", review_window_end: "2026-08-05T16:00:00.000Z" }
              as: ManagingEditor
              captures: { mid_effort: $.data.effort_points, mid_reserved: $.data.sme_reserved_hours }
          assert:
            - "all three trigger calls return HTTP 201"
            - "${low_effort} == 6"
            - "${low_reserved} == 3"
            - "${high_effort} == 40"
            - "${high_reserved} == 20"
            - "${mid_effort} == 14"
            - "${mid_reserved} == 7"

