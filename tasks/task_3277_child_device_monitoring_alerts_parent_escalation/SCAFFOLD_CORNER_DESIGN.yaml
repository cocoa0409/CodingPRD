  - section: endpoints
    instances:
      - name: success_envelope_shape
        claim_type: response_envelope
        grounds: [response_envelope]
        distinguishing_aspect: "A successful read wraps data with meta.api_request_id, meta.api_request_timestamp, and response_type == 'object'."
        test_recipe:
          setup: ["One family exists"]
          setup_api_calls:
