      - name: state_transition_error_outranks_capital_capacity_breach
        grounds:
          - validations[priority=8]
          - validations[priority=16]
          - errors[ERR_INVALID_STATE_TRANSITION]
          - errors[ERR_CAPITAL_CAPACITY_EXCEEDED]
          - calculations.purchase_capacity_headroom
        distinguishing_aspect: |
          Error-category pair state (priority 8) versus business_fiscal (priority 16): a
          reserve-capacity call on a request still in SUBMITTED whose premium would also drive
          headroom_usd to -100000000.00 returns ERR_INVALID_STATE_TRANSITION (409), and the very
          same call after clear-diligence returns ERR_CAPITAL_CAPACITY_EXCEEDED (422).
