# §1.9 Scaffold Corner Design (Breadth Claim Walk)
# Domain: executive-compensation-say-on-pay  (api_prefix /exec-comp)
# Walked row-by-row against references/claim-extraction-guide.md over SCAFFOLD.yaml §1.1-§1.7.
# Every literal below was computed against the §1.3 formulas and their declared constants.
#
# Canonical fixture (shared with §1.8, all literals pinned):
#   ACME issuer  revenue 10,000,000,000  mcap 20,000,000,000  price 50.00  ceo_tdc 15,000,000
#   BRVO         revenue  8,000,000,000  mcap 16,000,000,000  price 40.00  ceo_tdc 12,000,000
#   CHRL         revenue 12,000,000,000  mcap 30,000,000,000  price 60.00  ceo_tdc 18,000,000
#   DLTA         revenue 20,000,000,000  mcap 40,000,000,000  price 80.00  ceo_tdc 24,000,000
#   FOXT         revenue  4,000,000,000  mcap  8,000,000,000  price  20.00 ceo_tdc  5,000,000  (outside the revenue band)
#   GOLF         revenue 25,000,000,000  mcap 50,000,000,000  price 100.00 ceo_tdc 30,000,000  (outside the revenue band)
#   CEO Dana Reyes base 1,200,000 sti_target 150.00 -> fixed_leg 3,000,000.00 / STI target 1,800,000.00
#   CFO Sam Ortiz  base   800,000 sti_target 100.00 -> STI target 800,000.00
#
# Non-applicable guide rows, skipped without ceremony:
#   entities / Immutability       — every §1.1 entity declares common_fields: true, so no immutable entity exists.
#   calculations / Reconciliation — PeerGroup.benchmark_basis is fixed at creation and both variants are always
#                                   stored, so there is no provisional->final switch whose delta could be posted.
#   state_machines / linear|branching|cyclic|compound — state_machine_shape is parallel.
#   cross_cutting_layers          — soft_delete, idempotency-key, bulk_operations, scheduled_actions,
#                                   multi_tenancy, conditional_feature_flags and pagination_with_filtering are
#                                   not listed in complexity_profile.complexity_layers.
#   consistency_model / eventual|saga — consistency_model is immediate.
scaffold_corner_design:

  # =========================================================================
  - section: entities
    instances:

      - name: company_creation_returns_201_with_every_declared_field
        claim_type: creation
        grounds:
          - entities.Company
          - endpoints[POST /exec-comp/companies]
          - entities.Company.fields.is_issuer
          - entities.Company.fields.ceo_tdc_usd
        distinguishing_aspect: |
          The Company create contract is the root of every other chain: one POST with the eight declared input
          fields must return 201 and echo all of them, with is_issuer honoured as sent (true) rather than defaulted,
          so no later peer or benchmark chain has to restate the issuer flag.
        test_recipe:
          setup:
            - "Empty database with the logical clock at its 2026-08-01T00:00:00Z default."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: CompConsultant
          trigger:
            - call: "POST /exec-comp/companies"
              payload: { legal_name: "Acme Industries Inc", ticker: "ACME", is_issuer: true, gics_sector: "TECH", revenue_usd: 10000000000, market_cap_usd: 20000000000, share_price_usd: 50.00, ceo_tdc_usd: 15000000 }
              as: CompConsultant
              captures: { acme_id: $.data.id }
          assert:
            - "HTTP status == 201"
            - "Company.${acme_id}.legal_name == 'Acme Industries Inc' and Company.${acme_id}.ticker == 'ACME'"
            - "Company.${acme_id}.is_issuer == true"
            - "Company.${acme_id}.gics_sector == TECH"
            - "Company.${acme_id}.revenue_usd == 10000000000 and Company.${acme_id}.market_cap_usd == 20000000000"
            - "Company.${acme_id}.share_price_usd == 50.00 and Company.${acme_id}.ceo_tdc_usd == 15000000"
            - "response_type == 'object' and meta.api_request_id is present"

      - name: company_retrieval_returns_the_stored_row_unchanged
        claim_type: retrieval
        grounds:
          - entities.Company
          - endpoints[GET /exec-comp/companies/{id}]
        distinguishing_aspect: |
          A read-back of the issuer returns exactly the persisted values including the system fields, proving the
          read surface neither recomputes nor re-defaults anything: version is still 1 after a pure read.
        test_recipe:
          setup:
            - "ACME registered as the issuer."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: CompConsultant
            - call: "POST /exec-comp/companies"
              payload: { legal_name: "Acme Industries Inc", ticker: "ACME", is_issuer: true, gics_sector: "TECH", revenue_usd: 10000000000, market_cap_usd: 20000000000, share_price_usd: 50.00, ceo_tdc_usd: 15000000 }
              as: CompConsultant
              captures: { acme_id: $.data.id }
          trigger:
            - call: "GET /exec-comp/companies/${acme_id}"
              as: CompCommitteeChair
          assert:
            - "HTTP status == 200"
            - "Company.${acme_id}.ticker == 'ACME' and Company.${acme_id}.revenue_usd == 10000000000"
            - "Company.${acme_id}.listing_status == ACTIVE"
            - "Company.${acme_id}.version == 1 — a GET never increments version"

      - name: peer_group_member_listing_paginates_with_limit_and_offset
        claim_type: listing
        grounds:
          - entities.PeerGroupMember
          - endpoints[GET /exec-comp/peer-groups/{id}/members]
          - response_envelope.pagination_fields
        distinguishing_aspect: |
          Pagination is exercised on the junction entity rather than on a root entity: with two ACCEPTED members
          the window limit=1/offset=1 returns exactly the second row in created_at ASC order (CHRL), while
          total_count still reports 2 and has_more is false because the window reaches the end of the set.
        test_recipe:
          setup:
            - "DRAFT peer group over ACME with two ACCEPTED members added in order: BRVO first, then CHRL."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: CompConsultant
            - call: "POST /exec-comp/companies"
              payload: { legal_name: "Acme Industries Inc", ticker: "ACME", is_issuer: true, gics_sector: "TECH", revenue_usd: 10000000000, market_cap_usd: 20000000000, share_price_usd: 50.00, ceo_tdc_usd: 15000000 }
              as: CompConsultant
              captures: { acme_id: $.data.id }
            - call: "POST /exec-comp/companies"
              payload: { legal_name: "Bravo Corp", ticker: "BRVO", is_issuer: false, gics_sector: "TECH", revenue_usd: 8000000000, market_cap_usd: 16000000000, share_price_usd: 40.00, ceo_tdc_usd: 12000000 }
              as: CompConsultant
              captures: { bravo_id: $.data.id }
            - call: "POST /exec-comp/companies"
              payload: { legal_name: "Charlie Holdings", ticker: "CHRL", is_issuer: false, gics_sector: "TECH", revenue_usd: 12000000000, market_cap_usd: 30000000000, share_price_usd: 60.00, ceo_tdc_usd: 18000000 }
              as: CompConsultant
              captures: { charl_id: $.data.id }
            - call: "POST /exec-comp/peer-groups"
              payload: { issuer_company_id: "${acme_id}", fiscal_year: 2026, benchmark_basis: "RAW_MEDIAN" }
              as: CompConsultant
              captures: { pg_id: $.data.id, pg_v0: $.data.version }
            - call: "POST /exec-comp/peer-groups/${pg_id}/members"
              payload: { peer_company_id: "${bravo_id}", inclusion_reason: "SIZE_MATCH", expected_peer_group_version: "${pg_v0}" }
              as: CompConsultant
            - call: "GET /exec-comp/peer-groups/${pg_id}"
              as: CompConsultant
              captures: { pg_v1: $.data.version }
            - call: "POST /exec-comp/peer-groups/${pg_id}/members"
              payload: { peer_company_id: "${charl_id}", inclusion_reason: "SIZE_MATCH", expected_peer_group_version: "${pg_v1}" }
              as: CompConsultant
          trigger:
            - call: "GET /exec-comp/peer-groups/${pg_id}/members"
              payload: { limit: 1, offset: 1 }
              as: CompConsultant
          assert:
            - "HTTP status == 200 and response_type == 'array'"
            - "total_count == 2 and has_more == false"
            - "len(data) == 1 and data[0].peer_company_id == ${charl_id}"
            - "data[0].revenue_ratio == 1.2000 and data[0].market_cap_ratio == 1.5000"

      - name: company_get_with_an_unknown_id_returns_company_not_found
        claim_type: not_found
        grounds:
          - errors[ERR_COMPANY_NOT_FOUND]
          - validations.priority_3_ERR_COMPANY_NOT_FOUND
        distinguishing_aspect: |
          A syntactically valid id that was never minted resolves to ERR_COMPANY_NOT_FOUND (404) on the read
          surface — not a 200 with an empty body and not ERR_INVALID_REQUEST.
        test_recipe:
          setup:
            - "Empty database apart from the clock."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: CompConsultant
          trigger:
            - call: "GET /exec-comp/companies/00000000-0000-0000-0000-0000000000ff"
              as: CompConsultant
              captures: { err_company: $.data.error_id }
          assert:
            - "HTTP status == 404"
            - "${err_company} == 'ERR_COMPANY_NOT_FOUND'"
            - "response_type == 'error'"

      - name: company_creation_without_ticker_returns_invalid_request
        claim_type: required_fields
        grounds:
          - errors[ERR_INVALID_REQUEST]
          - validations.priority_6_ERR_INVALID_REQUEST
          - entities.Company.fields.ticker
        distinguishing_aspect: |
          ticker is source: input with no default, so omitting it is a 400 ERR_INVALID_REQUEST and no Company row
          is created — the ticker-uniqueness rule at priority 29 is never reached because priority 6 fires first.
        test_recipe:
          setup:
            - "Empty database apart from the clock."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: CompConsultant
          trigger:
            - call: "POST /exec-comp/companies"
              payload: { legal_name: "Acme Industries Inc", is_issuer: true, gics_sector: "TECH", revenue_usd: 10000000000, market_cap_usd: 20000000000, share_price_usd: 50.00, ceo_tdc_usd: 15000000 }
              as: CompConsultant
              captures: { err_missing: $.data.error_id }
          assert:
            - "HTTP status == 400"
            - "${err_missing} == 'ERR_INVALID_REQUEST'"
            - "no Company row exists after the call"

      - name: company_creation_omitting_listing_status_defaults_to_active
        claim_type: defaults
        grounds:
          - entities.Company.fields.listing_status
          - endpoints[POST /exec-comp/companies]
        distinguishing_aspect: |
          listing_status is the only Company input carrying a default: omitting it yields ACTIVE, which is exactly
          what makes a candidate peer eligible at priority 23, where a DELISTED peer is rejected.
        test_recipe:
          setup:
            - "Empty database apart from the clock."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: CompConsultant
          trigger:
            - call: "POST /exec-comp/companies"
              payload: { legal_name: "Bravo Corp", ticker: "BRVO", is_issuer: false, gics_sector: "TECH", revenue_usd: 8000000000, market_cap_usd: 16000000000, share_price_usd: 40.00, ceo_tdc_usd: 12000000 }
              as: CompConsultant
              captures: { bravo2_id: $.data.id }
          assert:
            - "HTTP status == 201"
            - "Company.${bravo2_id}.listing_status == ACTIVE"
            - "Company.${bravo2_id}.is_issuer == false"
            - "Company.${bravo2_id}.market_data_updated_at is null — no market-data refresh has run yet"

      - name: peer_group_member_ratios_are_derived_from_both_companies
        claim_type: computed_fields
        grounds:
          - calculations.peer_size_band_fit
          - entities.PeerGroupMember.fields.revenue_ratio
          - entities.PeerGroupMember.fields.market_cap_ratio
          - entities.PeerGroupMember.fields.in_size_band
        distinguishing_aspect: |
          revenue_ratio, market_cap_ratio and in_size_band are source: computed and cannot be supplied by the
          client (the endpoint's input declares only peer_company_id, inclusion_reason and the OCC version): BRVO
          against ACME yields exactly 0.8000 / 0.8000 with in_size_band true.
        test_recipe:
          setup:
            - "ACME issuer and BRVO peer registered; DRAFT peer group over ACME."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: CompConsultant
            - call: "POST /exec-comp/companies"
              payload: { legal_name: "Acme Industries Inc", ticker: "ACME", is_issuer: true, gics_sector: "TECH", revenue_usd: 10000000000, market_cap_usd: 20000000000, share_price_usd: 50.00, ceo_tdc_usd: 15000000 }
              as: CompConsultant
              captures: { acme_id: $.data.id }
            - call: "POST /exec-comp/companies"
              payload: { legal_name: "Bravo Corp", ticker: "BRVO", is_issuer: false, gics_sector: "TECH", revenue_usd: 8000000000, market_cap_usd: 16000000000, share_price_usd: 40.00, ceo_tdc_usd: 12000000 }
              as: CompConsultant
              captures: { bravo_id: $.data.id }
            - call: "POST /exec-comp/peer-groups"
              payload: { issuer_company_id: "${acme_id}", fiscal_year: 2026, benchmark_basis: "RAW_MEDIAN" }
              as: CompConsultant
              captures: { pg_id: $.data.id, pg_v0: $.data.version }
          trigger:
            - call: "POST /exec-comp/peer-groups/${pg_id}/members"
              payload: { peer_company_id: "${bravo_id}", inclusion_reason: "SIZE_MATCH", expected_peer_group_version: "${pg_v0}" }
              as: CompConsultant
              captures: { mem_id: $.data.id }
          assert:
            - "HTTP status == 201"
            - "PeerGroupMember.${mem_id}.revenue_ratio == 0.8000"
            - "PeerGroupMember.${mem_id}.market_cap_ratio == 0.8000"
            - "PeerGroupMember.${mem_id}.in_size_band == true"
            - "PeerGroupMember.${mem_id}.status == ACCEPTED and PeerGroupMember.${mem_id}.exclusion_reason is null"

      - name: system_fields_are_server_generated_and_version_starts_at_one
        claim_type: system_fields
        grounds:
          - entities.PeerGroup
          - endpoints[POST /exec-comp/peer-groups]
          - entities.PeerGroup.fields.accepted_member_count
        distinguishing_aspect: |
          id, created_at, updated_at and version are server-minted for every common_fields entity: the created
          PeerGroup returns version 1 with created_at == updated_at, and accepted_member_count is the declared 0
          default rather than null while every median and benchmark field is still null.
        test_recipe:
          setup:
            - "ACME registered as the issuer."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: CompConsultant
            - call: "POST /exec-comp/companies"
              payload: { legal_name: "Acme Industries Inc", ticker: "ACME", is_issuer: true, gics_sector: "TECH", revenue_usd: 10000000000, market_cap_usd: 20000000000, share_price_usd: 50.00, ceo_tdc_usd: 15000000 }
              as: CompConsultant
              captures: { acme_id: $.data.id }
          trigger:
            - call: "POST /exec-comp/peer-groups"
              payload: { issuer_company_id: "${acme_id}", fiscal_year: 2026, benchmark_basis: "RAW_MEDIAN" }
              as: CompConsultant
              captures: { pg_id: $.data.id, pg_v0: $.data.version }
          assert:
            - "HTTP status == 201"
            - "PeerGroup.${pg_id}.id is server-minted and was not supplied by the client"
            - "PeerGroup.${pg_id}.version == 1 and ${pg_v0} == 1"
            - "PeerGroup.${pg_id}.created_at == PeerGroup.${pg_id}.updated_at"
            - "PeerGroup.${pg_id}.accepted_member_count == 0 and PeerGroup.${pg_id}.status == DRAFT"
            - "PeerGroup.${pg_id}.median_revenue_usd is null and PeerGroup.${pg_id}.approved_by_user_id is null"

      - name: company_creation_with_an_undeclared_gics_sector_returns_invalid_request
        claim_type: type_constraints
        grounds:
          - errors[ERR_INVALID_REQUEST]
          - validations.priority_6_ERR_INVALID_REQUEST
          - entities.Company.fields.gics_sector
        distinguishing_aspect: |
          Enum membership is enforced on input: MATERIALS is not in the declared set
          {TECH, INDUSTRIALS, HEALTHCARE, FINANCIALS, CONSUMER, ENERGY}, so the row is rejected with 400 instead of
          being stored with an out-of-set sector.
        test_recipe:
          setup:
            - "Empty database apart from the clock."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: CompConsultant
          trigger:
            - call: "POST /exec-comp/companies"
              payload: { legal_name: "Hotel Materials Co", ticker: "HOTL", is_issuer: false, gics_sector: "MATERIALS", revenue_usd: 8000000000, market_cap_usd: 16000000000, share_price_usd: 40.00, ceo_tdc_usd: 12000000 }
              as: CompConsultant
              captures: { err_enum: $.data.error_id }
          assert:
            - "HTTP status == 400"
            - "${err_enum} == 'ERR_INVALID_REQUEST'"
            - "no Company row with ticker 'HOTL' exists after the call"

      - name: restatement_event_with_lookback_end_before_start_returns_invalid_request
        claim_type: type_constraints
        grounds:
          - errors[ERR_INVALID_REQUEST]
          - validations.priority_6_ERR_INVALID_REQUEST
          - entities.RestatementEvent.fields.lookback_start
          - entities.RestatementEvent.fields.lookback_end
        distinguishing_aspect: |
          The interval-ordering half of priority 6 (lookback_end > lookback_start) is a numeric-range constraint
          distinct from the enum case: an inverted lookback window is a 400, and it is rejected before the
          interval-collision check at priority 36 can run.
        test_recipe:
          setup:
            - "ACME registered as the issuer."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: CompConsultant
            - call: "POST /exec-comp/companies"
              payload: { legal_name: "Acme Industries Inc", ticker: "ACME", is_issuer: true, gics_sector: "TECH", revenue_usd: 10000000000, market_cap_usd: 20000000000, share_price_usd: 50.00, ceo_tdc_usd: 15000000 }
              as: CompConsultant
              captures: { acme_id: $.data.id }
          trigger:
            - call: "POST /exec-comp/companies/${acme_id}/restatement-events"
              payload: { restatement_date: "2027-03-01T00:00:00Z", lookback_start: "2026-12-31T23:59:59Z", lookback_end: "2026-01-01T00:00:00Z", accounting_reason: "Inverted window supplied on purpose." }
              as: SecuritiesCounsel
              captures: { err_window: $.data.error_id }
          assert:
            - "HTTP status == 400"
            - "${err_window} == 'ERR_INVALID_REQUEST'"
            - "no RestatementEvent row exists for Company.${acme_id} after the call"

      - name: executive_creation_under_an_unknown_company_returns_company_not_found
        claim_type: parent_relationships
        grounds:
          - entities.Executive
          - endpoints[POST /exec-comp/companies/{id}/executives]
          - errors[ERR_COMPANY_NOT_FOUND]
          - validations.priority_3_ERR_COMPANY_NOT_FOUND
        distinguishing_aspect: |
          Executive declares parent: Company, so the nested create resolves the path id first: an unknown company
          id is a 404 ERR_COMPANY_NOT_FOUND and the otherwise well-formed body is never persisted.
        test_recipe:
          setup:
            - "ACME registered so the endpoint shape is reachable, but the path id points at a row that never existed."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: CompConsultant
            - call: "POST /exec-comp/companies"
              payload: { legal_name: "Acme Industries Inc", ticker: "ACME", is_issuer: true, gics_sector: "TECH", revenue_usd: 10000000000, market_cap_usd: 20000000000, share_price_usd: 50.00, ceo_tdc_usd: 15000000 }
              as: CompConsultant
              captures: { acme_id: $.data.id }
          trigger:
            - call: "POST /exec-comp/companies/00000000-0000-0000-0000-0000000000aa/executives"
              payload: { full_name: "Dana Reyes", role_title: "CEO", is_neo: true, base_salary_usd: 1200000, sti_target_pct: 150.00 }
              as: CompConsultant
              captures: { err_parent: $.data.error_id }
          assert:
            - "HTTP status == 404"
            - "${err_parent} == 'ERR_COMPANY_NOT_FOUND'"
            - "no Executive row exists for Company.${acme_id} after the call"

      - name: one_peer_company_joins_two_peer_groups_through_the_junction_entity
        claim_type: graph_topology_many_to_many_junction
        grounds:
          - complexity_profile.entity_topology
          - entities.PeerGroupMember
          - endpoints[GET /exec-comp/companies/{id}/peer-memberships]
        distinguishing_aspect: |
          entity_topology is graph: PeerGroupMember is the many-to-many junction between PeerGroup and Company, so
          BRVO belongs to the fiscal-2026 and the fiscal-2027 group at the same time and is reachable from BOTH
          sides — two rows from the company side, one row from each group side, with distinct member ids.
        test_recipe:
          setup:
            - "ACME issuer with two DRAFT peer groups (fiscal 2026 RAW_MEDIAN and fiscal 2027 SIZE_ADJUSTED); BRVO is a member of both."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: CompConsultant
            - call: "POST /exec-comp/companies"
              payload: { legal_name: "Acme Industries Inc", ticker: "ACME", is_issuer: true, gics_sector: "TECH", revenue_usd: 10000000000, market_cap_usd: 20000000000, share_price_usd: 50.00, ceo_tdc_usd: 15000000 }
              as: CompConsultant
              captures: { acme_id: $.data.id }
            - call: "POST /exec-comp/companies"
              payload: { legal_name: "Bravo Corp", ticker: "BRVO", is_issuer: false, gics_sector: "TECH", revenue_usd: 8000000000, market_cap_usd: 16000000000, share_price_usd: 40.00, ceo_tdc_usd: 12000000 }
              as: CompConsultant
              captures: { bravo_id: $.data.id }
            - call: "POST /exec-comp/peer-groups"
              payload: { issuer_company_id: "${acme_id}", fiscal_year: 2026, benchmark_basis: "RAW_MEDIAN" }
              as: CompConsultant
              captures: { pga_id: $.data.id, pga_v0: $.data.version }
            - call: "POST /exec-comp/peer-groups/${pga_id}/members"
              payload: { peer_company_id: "${bravo_id}", inclusion_reason: "SIZE_MATCH", expected_peer_group_version: "${pga_v0}" }
              as: CompConsultant
              captures: { mem_a: $.data.id }
            - call: "POST /exec-comp/peer-groups"
              payload: { issuer_company_id: "${acme_id}", fiscal_year: 2027, benchmark_basis: "SIZE_ADJUSTED" }
              as: CompConsultant
              captures: { pgb_id: $.data.id, pgb_v0: $.data.version }
            - call: "POST /exec-comp/peer-groups/${pgb_id}/members"
              payload: { peer_company_id: "${bravo_id}", inclusion_reason: "SIZE_MATCH", expected_peer_group_version: "${pgb_v0}" }
              as: CompConsultant
              captures: { mem_b: $.data.id }
          trigger:
            - call: "GET /exec-comp/companies/${bravo_id}/peer-memberships"
              payload: { limit: 10, offset: 0 }
              as: CompConsultant
          assert:
            - "HTTP status == 200 and total_count == 2"
            - "the returned peer_group_id set == { ${pga_id}, ${pgb_id} }"
