          Cyclic machine on CleaningJob: a full traversal INSPECTION_ACCEPTED ->
          REWORK_CLEANING -> SLUDGE_REMOVED -> GAS_FREE_PENDING ->
          GAS_FREE_CERTIFIED -> ENTRY_IN_PROGRESS -> ENTRY_COMPLETE ->
          INSPECTION_IN_PROGRESS -> INSPECTION_ACCEPTED loops the job back to a
          state it already held, superseding the first certificate en route.
        test_recipe:
          setup:
            - "job executed to first INSPECTION_ACCEPTED with one MINOR finding left OPEN (reworkable); certificate cert1 VALID; permit closed; first inspection accepted"
          setup_api_calls:
