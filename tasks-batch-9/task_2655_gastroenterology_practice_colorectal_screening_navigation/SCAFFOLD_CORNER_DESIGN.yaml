      - name: triage_action_rejected_outside_under_triage
        claim_type: error_triggerable
        grounds:
          - validations.priority_7
          - errors.ERR_INVALID_REFERRAL_STATE
          - state_machines.Referral
        distinguishing_aspect: "Only UNDER_TRIAGE admits an accept or decline: the same ACCEPT_OPEN_ACCESS payload returns 409 from SUBMITTED, succeeds after BEGIN_TRIAGE, and a DECLINE from the resulting terminal status returns 409 again - one action, three different outcomes driven only by status."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z, one patient, one SUBMITTED referral with reason FAMILY_HISTORY and asa_class_reported 2"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
