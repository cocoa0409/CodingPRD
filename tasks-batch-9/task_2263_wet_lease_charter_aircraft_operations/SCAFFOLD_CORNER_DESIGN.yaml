          One endpoint, two destinations chosen purely by the `resolution` discriminator, and they are
          NOT symmetric. UPHOLD_SETTLEMENT is a no-money outcome: it clears disputed_amount_cents to 0
          but deliberately RETAINS dispute_reason for audit, leaves the ISSUED invoice alone and leaves
          the balance at 2,400,000 - and it returns the period to SETTLED, so it can be disputed again.
