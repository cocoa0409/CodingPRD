scaffold_difficulty_design:

  # ============================================================================
  # Rule 1 — Dual-variant calculations across different entity domains
  # Two calculations, each with two variants producing different numeric results
  # for identical inputs, on entities from different domains.
  # ============================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: settlement_final_amount_provisional_vs_committed
        grounds:
          - calculations.final_settlement_amount
          - state_machines.Settlement.VENDOR_CONFIRMED_to_FINALIZED
          - entities.Settlement.fields.final_amount_cents
          - entities.Settlement.fields.provisional_total_cents
        distinguishing_aspect: |
          Operates on the Settlement entity (financial settlement domain). The provisional_estimate
          variant applies APPROVED ChangeOrder deltas in DESCENDING approval-time order with NO
          per-step clamp at zero, while the final_committed variant applies deltas in ASCENDING
          order WITH per-step max(0, ...) clamp; the same inputs produce a different
          Settlement.final_amount_cents persisted at FINALIZED than the GET preview returned in
          DRAFT/VENDOR_CONFIRMED.
        test_recipe:
          setup:
            - "Create WeddingProject P with total_budget_cents=2_000_000, planner=U_PLAN, auditor=U_AUD"
            - "Create one Milestone with percent_of_budget=100; activate project P → PLANNING"
            - "Register Vendor V (CATERING); approve V (Auditor)"
            - "Create Quote Q on V with amount_cents=100_000, valid_until=clock+1_000_000; offer Q"
            - "Create Contract C on P binding V+Q; send-for-negotiation; sign C (Quote.status BOUND, pinned_amount_cents=100_000)"
            - "Emit ESIGN_COMPLETED event for C; accept-signature on C (contract_status=ACCEPTED)"
            - "Create ChangeOrder CO1 on C (delta=-150_000) by U_PLAN; approve by U_PLAN2 (different planner, segregation OK)"
            - "Create ChangeOrder CO2 on C (delta=+200_000) by U_PLAN; approve by U_PLAN2 (CO2 approved AFTER CO1)"
            - "Add additional milestones+contracts to satisfy enter-settlement preconditions; advance clock past ceremony_date; enter SETTLEMENT"
            - "Create Settlement S on C as DRAFT (breach_deduction_cents=0, refund_cents=0)"
          trigger:
            - "GET /settlement (returns provisional_estimate variant)"
            - "POST /settlement/confirm (VendorRep)"
            - "POST /settlement/finalize (Auditor U_AUD; segregation from confirmer U_PLAN OK)"
            - "GET /settlement (returns final_committed variant)"
          assert:
            - "GET-while-DRAFT response: final_amount_cents == 150_000 (descending: 100_000 + 200_000 = 300_000; 300_000 + -150_000 = 150_000; max(0, 150_000) = 150_000)"
            - "GET-after-FINALIZED response: final_amount_cents == 200_000 (ascending: max(0, 100_000 + -150_000) = 0; max(0, 0 + 200_000) = 200_000)"
            - "Settlement.final_amount_cents persisted == 200_000"
            - "WeddingProject.finalized_settled_cents == 200_000"

      - name: vendor_avg_performance_include_terminated
        grounds:
          - calculations.vendor_avg_performance
          - entities.Vendor.fields.avg_performance_rating
          - entities.Vendor.fields.rating_count
          - state_machines.Settlement.VENDOR_CONFIRMED_to_FINALIZED
        distinguishing_aspect: |
          Operates on the Vendor entity (vendor-reputation domain, not financial settlement).
          The default include_terminated_finalized variant counts a PerformanceRating whose
          Contract was later TERMINATED (settlement still FINALIZED) in the average; this
          differs from a strict "active-contract-only" interpretation that would exclude it
          and yield a different mean.
        test_recipe:
          setup:
            - "Create Vendor V (PHOTOGRAPHY); approve V"
            - "Run two completed projects each with their own Settlement S1 and S2 on V; finalize both; record PerformanceRating(score=4) on S1 and PerformanceRating(score=5) on S2"
            - "On a third project, sign a third contract C3 on V; record PerformanceRating(score=5) on its FINALIZED Settlement S3, then terminate C3 AFTER S3 was FINALIZED"
          trigger:
            - "GET /vendors/{V}"
          assert:
            - "Vendor.rating_count == 3 (S1, S2, S3 — S3 included even though C3 is now TERMINATED)"
            - "Vendor.avg_performance_rating == 4.67 (round_half_up of (4+5+5)/3 = 14/3 = 4.6666... → 4.67)"
            - "If S3's rating were excluded, average would be 4.50 — the persisted value MUST be 4.67"

  # ============================================================================
  # Rule 2 — Combinatorial formulas across different modes
  # Mode (a): formula with ≥3 inputs and non-linear interaction
  # Mode (c): circular-looking dependency where evaluation order must be explicit
  # ============================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: timeline_overlap_three_factor_predicate
        grounds:
          - calculations.timeline_overlap_check
          - validations[priority=9]
          - validations[priority=10]
          - entities.TimelineSlot.fields.start_at
          - entities.TimelineSlot.fields.end_at
          - entities.TimelineSlot.fields.setup_buffer_seconds
          - entities.TimelineSlot.fields.kind
        distinguishing_aspect: |
          Mode (a): the overlap predicate combines four inputs (start_at, end_at,
          setup_buffer_seconds, kind) with non-linear interaction — the two rules layer
          non-linearly: per-vendor rule uses max/min interval intersection extended by
          setup_buffer on the start side; the project-cap rule applies a different filter
          (kind==CEREMONY, vendor-agnostic) and a count-at-instant predicate; the same slot
          can satisfy one rule and violate the other depending on which dimension is varied.
        test_recipe:
          setup:
            - "Create WeddingProject P; activate to PLANNING; sign and accept Contracts for vendors V1, V2, V3, V4 (each has ACCEPTED Contract) so they may appear on the timeline"
            - "Create TimelineSlot A: vendor=V1, kind=CEREMONY, start_at=1000, end_at=2000, setup_buffer_seconds=0"
            - "Create TimelineSlot B: vendor=V2, kind=CEREMONY, start_at=1500, end_at=2500, setup_buffer_seconds=0 (different vendor; no per-vendor overlap; cap so far = 2 at t=1500-2000 — OK)"
          trigger:
            - "POST /timeline-slots (vendor=V3, kind=CEREMONY, start_at=1700, end_at=1900, setup_buffer_seconds=0) — would push parallel CEREMONY count to 3 at t=1700"
            - "POST /timeline-slots (vendor=V1, kind=CEREMONY, start_at=2000, end_at=3000, setup_buffer_seconds=200) — adjacent to A on the surface, but setup_buffer extends start backward to 1800, overlapping A on V1"
            - "POST /timeline-slots (vendor=V4, kind=PREPARATION, start_at=1700, end_at=1900) — kind!=CEREMONY, so excluded from cap; no per-vendor conflict — MUST succeed"
          assert:
            - "Third slot rejected with error_id == ERR_TIMELINE_PARALLEL_CAP_EXCEEDED, http_status == 409"
            - "Fourth slot rejected with error_id == ERR_TIMELINE_VENDOR_OVERLAP, http_status == 409 (setup_buffer=200 makes effective interval [1800, 3000); A is [1000, 2000); 1800 < 2000 → overlap)"
            - "Fifth slot succeeds with code 201 — proves kind filter excludes it from cap and per-vendor predicate passes"

      - name: final_settlement_evaluation_order_dependency
        grounds:
          - calculations.final_settlement_amount
          - entities.Settlement.fields.final_amount_cents
          - state_machines.ChangeOrder.PENDING_to_APPROVED
          - state_machines.Settlement.VENDOR_CONFIRMED_to_FINALIZED
        distinguishing_aspect: |
          Mode (c): final_amount_cents = max(0, provisional_total_cents - breach - refund),
          where provisional_total_cents itself = max(0, base + delta_i) folded over
          ChangeOrders in approval-time order; the formula has a circular look (final depends
          on a sequence of intermediate clamps that depend on order), and the scaffold pins
          ascending order of AuditEntry(event_kind=CHANGE_ORDER_APPROVED).created_at as the
          unique evaluation order, so the value is well-defined.
        test_recipe:
          setup:
            - "Same setup as settlement_final_amount_provisional_vs_committed up to creating Contract C with pinned_amount_cents=100_000 ACCEPTED, with two ChangeOrders CO1(-150_000) approved at t1 and CO2(+200_000) approved at t2 > t1"
            - "Create Settlement S with breach_deduction_cents=0, refund_cents=0"
          trigger:
            - "POST /settlement/confirm; POST /settlement/finalize"
          assert:
            - "Settlement.final_amount_cents == 200_000 (proves ascending+clamp: 100_000 → 0 → 200_000; without the clamp the answer would be 150_000 — different by 50_000)"

  # ============================================================================
  # Rule 3 — Non-linear state-machine shape on different entities
  # Two entities with non-linear state machines (cycle on Contract,
  # parallel dimensions on Contract). Plus Project's branching cancel cascade.
  # ============================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: contract_negotiation_cycle
        grounds:
          - state_machines.Contract.NEGOTIATING_to_DRAFT
          - state_machines.Contract.DRAFT_to_NEGOTIATING
          - state_machines.Contract.NEGOTIATING_to_SIGNED
          - entities.Contract.fields.negotiation_round
        distinguishing_aspect: |
          Cycle on Contract: DRAFT → NEGOTIATING → DRAFT → NEGOTIATING → SIGNED. Each
          NEGOTIATING→DRAFT increments negotiation_round. This is a true cyclic shape on
          the Contract entity (distinct from the Settlement entity, which carries a
          cascade-driven VENDOR_CONFIRMED→DRAFT revert but is not the cyclic instance).
        test_recipe:
          setup:
            - "Create approved Vendor V with Quote Q (OFFERED); create WeddingProject P (PLANNING) with planner=U_PLAN; create Contract C binding V+Q (DRAFT, negotiation_round=0)"
          trigger:
            - "POST /contracts/{C}/send-for-negotiation (DRAFT → NEGOTIATING; round still 0)"
            - "POST /contracts/{C}/revise as VendorRep V (NEGOTIATING → DRAFT; round 1; Quote → DRAFT)"
            - "POST /vendors/{V}/quotes/{Q}/offer (Q → OFFERED)"
            - "POST /contracts/{C}/send-for-negotiation (DRAFT → NEGOTIATING)"
            - "POST /contracts/{C}/revise as VendorRep V (NEGOTIATING → DRAFT; round 2)"
            - "POST /vendors/{V}/quotes/{Q}/offer; POST /contracts/{C}/send-for-negotiation; POST /contracts/{C}/sign"
          assert:
            - "Contract.negotiation_round == 2 after the cycle"
            - "Contract.contract_status == SIGNED after final sign"
            - "Quote.status == BOUND"

      - name: contract_parallel_dimensions
        grounds:
          - entities.Contract.fields.contract_status
          - entities.Contract.fields.payment_status
          - state_machines.Contract.SIGNED_to_ACCEPTED
          - state_machines.Settlement.VENDOR_CONFIRMED_to_FINALIZED
        distinguishing_aspect: |
          Parallel state dimensions on the Contract entity: contract_status
          (DRAFT|NEGOTIATING|SIGNED|ACCEPTED|TERMINATED) and payment_status
          (UNPAID|PARTIAL|FINALIZED|REFUNDED) evolve independently on the same row. After
          ACCEPTED + Settlement FINALIZED, contract_status remains ACCEPTED while
          payment_status moves to FINALIZED — two axes on one entity. This entity is
          different from the Contract cycle instance because the distinguishing structural
          property is parallelism, not cyclicity.
        test_recipe:
          setup:
            - "Drive Contract C through DRAFT → NEGOTIATING → SIGNED → ACCEPTED (e-sign callback included)"
            - "Initially: contract_status=ACCEPTED, payment_status=UNPAID"
            - "Create Settlement S; vendor confirms; auditor finalizes (Settlement.final_amount_cents > 0)"
          trigger:
            - "GET /contracts/{C} after finalize"
          assert:
            - "Contract.contract_status == ACCEPTED (unchanged by payment-axis transition)"
            - "Contract.payment_status == FINALIZED"
            - "These two fields evolved independently — proven by ACCEPTED stable while payment_status moved UNPAID → FINALIZED"

  # ============================================================================
  # Rule 4 — Transitive cascade chains from different triggers
  # Cascade A (depth ≥ 3): Project cancel → Contracts TERMINATED → Quotes WITHDRAWN
  # AND TimelineSlots deleted AND Settlements reset to DRAFT
  # Cascade B (depth ≥ 2): ChangeOrder approve → Settlement.provisional_total_cents
  # recomputed → final_amount_cents derived
  # ============================================================================
  - rule_id: transitive_cascade
    instances:
      - name: project_cancel_three_hop_cascade
        grounds:
          - state_machines.WeddingProject.PLANNING_to_CANCELLED
          - state_machines.WeddingProject.EXECUTION_to_CANCELLED
          - state_machines.Contract.SIGNED_to_TERMINATED
          - state_machines.Contract.ACCEPTED_to_TERMINATED
          - state_machines.Quote.OFFERED_to_WITHDRAWN
          - state_machines.Quote.BOUND_to_WITHDRAWN
          - state_machines.Settlement.VENDOR_CONFIRMED_to_DRAFT
        distinguishing_aspect: |
          Triggered by POST /wedding-projects/{id}/cancel. Hop 1: cancel mutates Project
          status. Hop 2: that mutation on Project itself triggers Contract.* → TERMINATED
          for each non-terminal contract. Hop 3: the TERMINATED transition on Contract
          itself triggers Quote → WITHDRAWN AND deletes TimelineSlots AND resets
          Settlement back to DRAFT. Each link is caused by the previous link, not by the
          original cancel call directly fanning out.
        test_recipe:
          setup:
            - "Create Project P (DRAFT) → activate (PLANNING) → start-execution (EXECUTION) with full setup: Contract C ACCEPTED on Vendor V Quote Q (BOUND); Settlement S created and confirmed (VENDOR_CONFIRMED); two TimelineSlots TS1, TS2 on V"
          trigger:
            - "POST /wedding-projects/{P}/cancel as Planner"
          assert:
            - "Project.status == CANCELLED (hop 1)"
            - "Contract.contract_status == TERMINATED (hop 2, caused by hop 1)"
            - "Quote.status == WITHDRAWN (hop 3, caused by hop 2)"
            - "TimelineSlot TS1 and TS2 have been deleted (hop 3, caused by hop 2)"
            - "Settlement.status == DRAFT and Settlement.confirmed_by_vendor_at == null (hop 3, caused by hop 2)"
            - "WeddingProject.provisional_committed_cents == 0 (Contract.pinned_amount_cents subtracted via the recomputation chain)"

      - name: change_order_approve_two_hop_cascade
        grounds:
          - state_machines.ChangeOrder.PENDING_to_APPROVED
          - calculations.final_settlement_amount
          - entities.Settlement.fields.provisional_total_cents
          - entities.Settlement.fields.final_amount_cents
        distinguishing_aspect: |
          Triggered by POST /change-orders/{id}/approve. Hop 1: ChangeOrder.status →
          APPROVED. Hop 2: that status flip itself causes Settlement.provisional_total_cents
          (and the derived final_amount_cents preview) to recompute on the linked DRAFT
          Settlement. Trigger is the change-order approval, distinct from project cancel,
          and the propagation runs through a different second-hop entity (Settlement).
        test_recipe:
          setup:
            - "Create Project P with Contract C (ACCEPTED, pinned_amount_cents=500_000)"
            - "Create Settlement S in DRAFT with breach=0, refund=0 (provisional_total_cents=500_000, final_amount_cents preview=500_000)"
            - "Create ChangeOrder CO with delta=-100_000 by U_PLAN; CO.status=PENDING"
          trigger:
            - "POST /change-orders/{CO}/approve as U_PLAN2 (different planner)"
          assert:
            - "ChangeOrder.status == APPROVED (hop 1)"
            - "Settlement.provisional_total_cents == 400_000 (hop 2, caused by hop 1; ascending fold over [{-100_000}] from base 500_000)"
            - "GET /settlement returns final_amount_cents == 400_000 (derived from hop 2)"

  # ============================================================================
  # Rule 5 — Validation priority conflicts across different error-category pairs
  # Pair A: state vs business_fiscal
  # Pair B: state vs business_temporal
  # ============================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: contract_signed_state_beats_budget_overcommit
        grounds:
          - validations[priority=6]
          - validations[priority=13]
          - errors.ERR_CONTRACT_NOT_NEGOTIATING
          - errors.ERR_BUDGET_OVERCOMMITTED
        distinguishing_aspect: |
          Pair: state (priority 6, ERR_CONTRACT_NOT_NEGOTIATING) vs business_fiscal
          (priority 13, ERR_BUDGET_OVERCOMMITTED). When attempting to sign a contract that
          is BOTH already SIGNED (wrong state) AND would overcommit the budget, the state
          error MUST win because state checks are evaluated before fiscal checks.
        test_recipe:
          setup:
            - "Create Project P with total_budget_cents=500_000 and one fully-allocated milestone; activate to PLANNING"
            - "Sign Contract C1 with pinned_amount_cents=400_000 (now SIGNED; budget_balance=100_000)"
            - "Create Contract C2 with pinned_amount_cents=600_000 (would overcommit by 500_000); send-for-negotiation"
            - "Sign C2 first time (NEGOTIATING → would fail with ERR_BUDGET_OVERCOMMITTED). Skip; instead set up dual-failure on C1: it is already SIGNED AND a re-sign would also overcommit if it could be applied twice"
          trigger:
            - "POST /contracts/{C1}/sign a second time (C1 is already SIGNED so state precondition fails; AND if state-check were skipped, post-commit fiscal check would also fail because the second commit would re-add pinned_amount_cents)"
          assert:
            - "Response error_id == ERR_CONTRACT_NOT_NEGOTIATING (state, priority 6)"
            - "Response error_id != ERR_BUDGET_OVERCOMMITTED (fiscal, priority 13) — state wins"
            - "http_status == 409"

      - name: timeline_state_beats_overlap
        grounds:
          - validations[priority=5]
          - validations[priority=9]
          - errors.ERR_PROJECT_TERMINAL
          - errors.ERR_TIMELINE_VENDOR_OVERLAP
        distinguishing_aspect: |
          Pair: state (priority 5, ERR_PROJECT_TERMINAL) vs business_temporal (priority 9,
          ERR_TIMELINE_VENDOR_OVERLAP). When the project is CLOSED AND the proposed
          TimelineSlot would also overlap with an existing one, the project-terminal state
          error MUST win because state is evaluated before temporal business checks. This
          pair is structurally different from instance 1 (state vs fiscal).
        test_recipe:
          setup:
            - "Create Project P; drive through activate → start-execution → enter-settlement → close (now CLOSED)"
            - "Existing TimelineSlot A on Vendor V at [1000, 2000) was created before close"
          trigger:
            - "POST /timeline-slots (vendor=V, start_at=1500, end_at=2500) — both project is CLOSED AND interval overlaps A"
          assert:
            - "Response error_id == ERR_PROJECT_TERMINAL (state, priority 5)"
            - "Response error_id != ERR_TIMELINE_VENDOR_OVERLAP (business_temporal, priority 9) — state wins"
            - "http_status == 409"

  # ============================================================================
  # Rule 6 — Boundary-precision checks on different metrics/endpoints
  # Boundary 1: numeric guest-capacity threshold (POST /guests/{id}/rsvp)
  # Boundary 2: empty-set milestone presence (POST /wedding-projects/{id}/activate)
  # ============================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: guest_capacity_intimate_50_seat_boundary
        grounds:
          - validations[priority=11]
          - errors.ERR_GUEST_CAPACITY_EXCEEDED
          - entities.WeddingProject.fields.scale
          - entities.Guest.fields.party_size
          - entities.Guest.fields.rsvp_status
        distinguishing_aspect: |
          Numeric boundary at exactly the per-scale cap (INTIMATE=50). Confirmed sum AT 50
          MUST succeed; confirmed sum at 51 (inclusive >) MUST fail. Reachable through
          POST /wedding-projects/{id}/guests/{id}/rsvp.
        test_recipe:
          setup:
            - "Create Project P with scale=INTIMATE; activate to PLANNING"
            - "Create five Guests G1..G5 each with party_size=10 (total invited 50)"
            - "RSVP G1..G4 to CONFIRMED (sum=40)"
          trigger:
            - "POST /guests/{G5}/rsvp with rsvp_status=CONFIRMED — sum becomes exactly 50"
            - "Create Guest G6 with party_size=1; POST /guests/{G6}/rsvp with rsvp_status=CONFIRMED — sum would become 51"
          assert:
            - "First RSVP returns 200 with G5.rsvp_status == CONFIRMED (boundary: 50 <= 50 OK)"
            - "Second RSVP returns 409 with error_id == ERR_GUEST_CAPACITY_EXCEEDED (boundary: 51 > 50)"

      - name: project_activate_empty_milestones_set_boundary
        grounds:
          - validations[priority=14]
          - errors.ERR_NO_MILESTONES
          - errors.ERR_MILESTONE_PERCENTAGES_INVALID
          - state_machines.WeddingProject.DRAFT_to_PLANNING
        distinguishing_aspect: |
          Empty-set boundary on a different metric (milestone count, not a numeric
          threshold) and different endpoint (POST /wedding-projects/{id}/activate, not RSVP).
          Zero milestones MUST trigger ERR_NO_MILESTONES; one milestone with
          percent_of_budget=99.99 MUST trigger ERR_MILESTONE_PERCENTAGES_INVALID; one
          milestone with percent_of_budget=100.0 MUST succeed.
        test_recipe:
          setup:
            - "Create Project P (DRAFT) with no milestones"
          trigger:
            - "POST /wedding-projects/{P}/activate (no milestones → empty set)"
            - "Add one Milestone with percent_of_budget=99.99; retry activate"
            - "PATCH that Milestone to percent_of_budget=100.0; retry activate"
          assert:
            - "First activate returns 422 with error_id == ERR_NO_MILESTONES (empty-set boundary)"
            - "Second activate returns 422 with error_id == ERR_MILESTONE_PERCENTAGES_INVALID (99.99 != 100.0; boundary requires exact equality)"
            - "Third activate returns 200 and Project.status == PLANNING (boundary 100.0 satisfied exactly)"

  # ============================================================================
  # Rule 7 — Cross-entity state dependencies across different entity pairs
  # Pair 1: Contract.SIGNED requires Project.status == PLANNING
  # Pair 2: TimelineSlot create requires Vendor's Contract on this project to be ACCEPTED
  # ============================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: contract_sign_requires_project_planning
        grounds:
          - state_machines.Contract.NEGOTIATING_to_SIGNED
          - state_machines.WeddingProject.PLANNING_to_EXECUTION
          - errors.ERR_PROJECT_NOT_IN_PLANNING
        distinguishing_aspect: |
          Entity pair: Contract ↔ WeddingProject. Contract's NEGOTIATING → SIGNED
          transition's preconditions reference Project.status (must be PLANNING). After
          the project advances to EXECUTION, no new contract can be signed even if
          contract-side preconditions all pass. This pair is distinct from the second
          instance's pair (TimelineSlot ↔ Contract).
        test_recipe:
          setup:
            - "Create Project P with full setup; advance to PLANNING"
            - "Create Contract C1 with bound Quote, send-for-negotiation (C1.contract_status=NEGOTIATING)"
            - "Sign another contract C0 first to satisfy required-category coverage; start-execution (Project → EXECUTION)"
          trigger:
            - "POST /contracts/{C1}/sign while Project is EXECUTION"
          assert:
            - "Response error_id == ERR_PROJECT_NOT_IN_PLANNING, http_status == 409"
            - "Contract.contract_status remains NEGOTIATING"

      - name: timeline_slot_requires_vendor_accepted_contract
        grounds:
          - validations[priority=7]
          - errors.ERR_TIMELINE_VENDOR_NOT_CONTRACTED
          - state_machines.Contract.SIGNED_to_ACCEPTED
        distinguishing_aspect: |
          Entity pair: TimelineSlot ↔ Contract (a different pair than instance 1).
          TimelineSlot creation's preconditions reference Contract.contract_status —
          the vendor MUST have a Contract in ACCEPTED status (SIGNED is not enough)
          on this project. A SIGNED-but-not-yet-ACCEPTED contract MUST cause
          ERR_TIMELINE_VENDOR_NOT_CONTRACTED.
        test_recipe:
          setup:
            - "Create Project P (PLANNING); Vendor V; Contract C bound and signed (SIGNED, e-sign not yet completed → still SIGNED, NOT ACCEPTED)"
          trigger:
            - "POST /timeline-slots with vendor=V, kind=PREPARATION, start_at=1000, end_at=2000"
            - "Emit ESIGN_COMPLETED for C; POST /contracts/{C}/accept-signature (now ACCEPTED)"
            - "Retry POST /timeline-slots with same body"
          assert:
            - "First response: error_id == ERR_TIMELINE_VENDOR_NOT_CONTRACTED, http_status == 422"
            - "Second response: 201 created (Contract is now ACCEPTED — TimelineSlot allowed)"

  # ============================================================================
  # Rule 8 — Resource temporal-overlap conflicts across different interval semantics
  # Semantics 1: per-vendor pairwise interval intersection extended by setup_buffer
  # Semantics 2: project-wide aggregate count-at-instant cap on CEREMONY-kind slots
  # Different resource entities: Vendor (per-vendor binding) vs Project (aggregate)
  # ============================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: per_vendor_buffer_extended_intersection
        grounds:
          - calculations.timeline_overlap_check
          - validations[priority=9]
          - errors.ERR_TIMELINE_VENDOR_OVERLAP
          - entities.TimelineSlot.fields.setup_buffer_seconds
        distinguishing_aspect: |
          Interval semantics: half-open [start - setup_buffer, end) intersection per vendor.
          Adjacency at exactly start==prev_end with buffer=0 is allowed (no overlap);
          buffer>0 extends the start side and can re-introduce overlap. Resource is the
          Vendor.
        test_recipe:
          setup:
            - "Project P (PLANNING); Vendor V with ACCEPTED Contract"
            - "TimelineSlot A on V: start_at=1000, end_at=2000, setup_buffer_seconds=0"
          trigger:
            - "POST /timeline-slots V: start_at=2000, end_at=3000, setup_buffer_seconds=0 — adjacency, no overlap"
            - "POST /timeline-slots V: start_at=2000, end_at=3000, setup_buffer_seconds=300 — buffer extends to start=1700, overlapping A"
          assert:
            - "First request: 201 created (half-open intervals → 2000 is exclusive on A, inclusive on B; no overlap)"
            - "Second request: 409 with error_id == ERR_TIMELINE_VENDOR_OVERLAP (effective interval [1700, 3000) overlaps [1000, 2000))"

      - name: project_aggregate_count_at_instant_cap
        grounds:
          - calculations.timeline_overlap_check
          - validations[priority=10]
          - errors.ERR_TIMELINE_PARALLEL_CAP_EXCEEDED
          - entities.TimelineSlot.fields.kind
        distinguishing_aspect: |
          Interval semantics: count-at-instant aggregate across ALL CEREMONY-kind slots
          (vendor-agnostic) must never exceed MAX_PARALLEL_CEREMONY_SLOTS=2 at any t.
          This is geometrically different from per-vendor pairwise intersection —
          three slots may pairwise-overlap-OK across vendors but their aggregate count
          at one instant exceeds 2. Resource is the Project, not a single Vendor.
        test_recipe:
          setup:
            - "Project P; vendors V1, V2, V3 each with ACCEPTED Contracts"
            - "TimelineSlot A: V1, kind=CEREMONY, [1000, 3000), buffer=0"
            - "TimelineSlot B: V2, kind=CEREMONY, [2000, 4000), buffer=0"
          trigger:
            - "POST /timeline-slots V3, kind=CEREMONY, start_at=2500, end_at=2800, buffer=0 — at t=2500 all three CEREMONY slots overlap"
          assert:
            - "Response: 409 with error_id == ERR_TIMELINE_PARALLEL_CAP_EXCEEDED (count-at-instant=3 > MAX_PARALLEL_CEREMONY_SLOTS=2)"
            - "Per-vendor predicate would have allowed this (V1, V2, V3 all distinct) — proves the aggregate-cap semantics is independent"

  # ============================================================================
  # Rule 9 — Compensating-action invariants across different conserved quantities
  # Conserved quantity 1: WeddingProject.budget_balance_cents (after cancel cascade)
  # Conserved quantity 2: Sum across (provisional_committed + finalized_settled)
  # invariant after a Settlement finalize moves money between the two ledgers
  # ============================================================================
  - rule_id: compensating_invariant
    instances:
      - name: cancel_cascade_restores_budget_balance
        grounds:
          - state_machines.WeddingProject.PLANNING_to_CANCELLED
          - state_machines.Contract.SIGNED_to_TERMINATED
          - state_machines.Contract.ACCEPTED_to_TERMINATED
          - calculations.provisional_committed_cents
          - calculations.budget_balance_cents
          - entities.WeddingProject.fields.budget_balance_cents
        distinguishing_aspect: |
          Conserved quantity: WeddingProject.budget_balance_cents. Forward action: sign
          Contract C (debits provisional_committed_cents by pinned_amount_cents). Compensating
          action: cancel project (cascades Contract → TERMINATED, which reduces
          provisional_committed_cents by the same pinned_amount_cents). Invariant:
          budget_balance_cents BEFORE sign == budget_balance_cents AFTER cancel cascade,
          formula:
              total_budget_cents - provisional_committed_cents - finalized_settled_cents
          MUST equal total_budget_cents (because both committed and settled are 0 again).
        test_recipe:
          setup:
            - "Create Project P with total_budget_cents=1_000_000; activate"
            - "Vendor V (APPROVED), Quote Q (amount_cents=300_000, OFFERED); Contract C bind+negotiate+sign+e-sign+accept"
            - "Snapshot budget_balance_AFTER_SIGN = 700_000"
          trigger:
            - "POST /wedding-projects/{P}/cancel"
          assert:
            - "BEFORE sign (initial state): budget_balance_cents == 1_000_000"
            - "After sign: budget_balance_cents == 700_000"
            - "After cancel cascade: budget_balance_cents == 1_000_000 (invariant: total_budget - 0 - 0)"
            - "provisional_committed_cents == 0 AND finalized_settled_cents == 0"

      - name: settlement_finalize_preserves_total_committed_plus_settled
        grounds:
          - state_machines.Settlement.VENDOR_CONFIRMED_to_FINALIZED
          - calculations.provisional_committed_cents
          - calculations.finalized_settled_cents
          - calculations.final_settlement_amount
        distinguishing_aspect: |
          Conserved quantity: SUM(provisional_committed_cents + finalized_settled_cents)
          equals SUM(pinned_amount_cents + sum(approved_change_orders.delta) of all
          contracts NOT TERMINATED) — but ONLY when no breach_deduction or refund applies
          (these are out-of-system flows). When breach=0 and refund=0, finalize moves the
          contract's value from the provisional ledger to the finalized ledger; the SUM
          MUST be invariant. Different conserved quantity than instance 1 (which is
          balance_cents); this is a transfer invariant between two derived ledgers.
        test_recipe:
          setup:
            - "Project P with total_budget_cents=1_000_000; one Contract C with pinned_amount_cents=300_000 ACCEPTED; no ChangeOrders"
            - "Settlement S DRAFT with breach_deduction_cents=0, refund_cents=0"
            - "Snapshot BEFORE: provisional_committed_cents=300_000, finalized_settled_cents=0, SUM=300_000"
          trigger:
            - "POST /settlement/confirm; POST /settlement/finalize"
          assert:
            - "AFTER finalize: provisional_committed_cents == 0 (Contract no longer counted in provisional pool because Settlement is FINALIZED)"
            - "AFTER finalize: finalized_settled_cents == 300_000 (final_amount_cents=300_000-0-0=300_000)"
            - "Invariant: provisional_committed_cents + finalized_settled_cents == 300_000 == BEFORE-snapshot SUM (no drift)"
            - "Settlement.final_amount_cents == 300_000"
