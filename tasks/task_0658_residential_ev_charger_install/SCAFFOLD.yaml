scenario: "658. Residential EV-Charger Installation (Qmerit/Treehouse style): site assessment & panel/load calc, charger product & circuit scope, permit & utility interconnection, electrician dispatch & install, rebate/incentive (utility/45W) processing, activation & app pairing, warranty/service, panel-upgrade referral"
domain_name: residential-ev-charger-install
api_prefix: ""

# ---------------------------------------------------------------------------
# Complexity profile (Step 0)
# ---------------------------------------------------------------------------
complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: compliance/audit
  complexity_layers:
    - dual_variant_calculation        # NEC 220.83 vs 220.87 panel-load methods
    - cascading_side_effects          # assessment outcome -> referral -> job gate; install -> incentive eligibility
    - optimistic_concurrency          # OCC on InstallJob.version for quote acceptance + scope change
    - rate_threshold_triggers         # spare-capacity threshold, stacking cap, lead-time window

  entity_topology: flat
  # Peer entities linked by foreign keys. InstallJob is the hub; PermitApplication,
  # InterconnectionRequest, Quote, DispatchAssignment, IncentiveClaim,
  # PanelUpgradeReferral, WarrantyTicket all reference it by FK. SiteAssessment
  # references Property. No nested ownership URL chains.

  state_machine_shape: parallel
  # InstallJob carries two independent dimensions (workflow_status × compliance_status).
  # WarrantyTicket and PermitApplication are cyclic; Quote is branching-with-revert.

  relationship_patterns:
    - one_to_many        # Property -> SiteAssessment; InstallJob -> WarrantyTicket
    - cross_aggregate    # DispatchAssignment references both InstallJob and Electrician
    - polymorphic        # IncentiveClaim.program_kind switches federal-45W vs utility math

  role_model: peer_roles
  # Homeowner owns Property/InstallJob; Electrician owns DispatchAssignment work;
  # Coordinator (opaque ops) drives permits/interconnection/incentives;
  # UtilityReviewer (opaque) acts on interconnection.

  consistency_model: immediate

# ---------------------------------------------------------------------------
# §1.0 Response Envelope (FIXED — verbatim)
# ---------------------------------------------------------------------------
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# ---------------------------------------------------------------------------
# §1.1 Entity-Relationship Table
# ---------------------------------------------------------------------------
entities:
  - name: Homeowner
    parent: null
    common_fields: true
    fields:
      - name: email
        type: string
        source: input
        description: login/contact email; unique
        constraints: unique across Homeowner
      - name: full_name
        type: string
        source: input
        description: homeowner display name
      - name: state_code
        type: string
        source: input
        description: two-letter US state of the homeowner's billing address
        constraints: 2-letter uppercase

  - name: Property
    parent: null
    common_fields: true
    fields:
      - name: homeowner_id
        type: string
        source: input
        description: "FK -> Homeowner.id; the owner of this property"
      - name: address_line
        type: string
        source: input
        description: street address of the install site
      - name: state_code
        type: string
        source: input
        description: two-letter US state where the property sits
        constraints: 2-letter uppercase
      - name: utility_territory_code
        type: string
        source: input
        description: utility service territory code governing interconnection rules
      - name: service_voltage
        type: integer
        source: input
        description: nominal split-phase service voltage at the panel
        default: 240
        constraints: must be 240
      - name: main_breaker_amps
        type: integer
        source: input
        description: rated amperage of the existing main service breaker
        constraints: one of {100, 150, 200}
      - name: floor_area_sqft
        type: integer
        source: input
        description: conditioned floor area, used by the NEC 220.83 standard method
        constraints: positive integer

  - name: Electrician
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: licensed electrician display name
      - name: license_state_code
        type: string
        source: input
        description: state in which this electrician is licensed; only properties in this state are serviceable
        constraints: 2-letter uppercase
      - name: max_daily_jobs
        type: integer
        source: input
        description: maximum number of DispatchAssignments this electrician may hold on a single calendar day
        default: 2
        constraints: positive integer
      - name: status
        type: enum
        source: system
        description: availability lifecycle for dispatch eligibility
        default: ACTIVE
        constraints: one of {ACTIVE, SUSPENDED}

  - name: ChargerProduct
    parent: null
    common_fields: false
    fields:
      - name: sku
        type: string
        source: input
        description: catalog SKU; unique
        constraints: unique across ChargerProduct
      - name: name
        type: string
        source: input
        description: product display name
      - name: rated_amps
        type: integer
        source: input
        description: continuous output current rating of the EVSE
        constraints: one of {32, 40, 48}
      - name: required_circuit_amps
        type: integer
        source: input
        description: branch-circuit breaker size the unit requires (NEC 125% continuous sizing)
        constraints: one of {40, 50, 60}
      - name: msrp_cents
        type: integer
        source: input
        description: hardware list price in integer cents
        constraints: non-negative

  - name: InstallJob
    parent: null
    common_fields: true
    fields:
      - name: property_id
        type: string
        source: input
        description: "FK -> Property.id; the site being electrified"
      - name: charger_product_sku
        type: string
        source: input
        description: "FK -> ChargerProduct.sku; the scoped charger; mutable until quote acceptance"
      - name: workflow_status
        type: enum
        source: system
        description: primary lifecycle dimension of the job
        default: CREATED
        constraints: one of {CREATED, ASSESSED, QUOTED, SCHEDULED, INSTALLED, ACTIVATED, CLOSED, CANCELLED}
      - name: compliance_status
        type: enum
        source: system
        description: independent regulatory-clearance dimension; gates the SCHEDULED->INSTALLED workflow transition
        default: PENDING_REVIEW
        constraints: one of {PENDING_REVIEW, PERMIT_PENDING, CLEARED, BLOCKED}
      - name: requires_panel_upgrade
        type: boolean
        source: computed
        description: set true when the accepted SiteAssessment's chosen method reports insufficient spare capacity for the scoped charger
        default: false
      - name: activation_pairing_code
        type: string
        source: system
        description: one-time code minted at INSTALLED used to pair the charger app at ACTIVATED
        default: null

  - name: SiteAssessment
    parent: null
    common_fields: true
    fields:
      - name: property_id
        type: string
        source: input
        description: "FK -> Property.id; the property being assessed"
      - name: install_job_id
        type: string
        source: input
        description: "FK -> InstallJob.id; the job this assessment feeds"
      - name: assessment_method
        type: enum
        source: input
        description: which NEC dwelling-load method to apply
        constraints: one of {STANDARD_220_83, LOAD_STUDY_220_87}
      - name: declared_fixed_appliance_va
        type: integer
        source: input
        description: summed nameplate VA of fixed appliances (range, dryer, water heater, HVAC); used by STANDARD_220_83
        constraints: non-negative
      - name: max_measured_demand_va
        type: integer
        source: input
        description: peak measured demand in VA over the metering window; used by LOAD_STUDY_220_87
        default: 0
        constraints: non-negative
      - name: existing_demand_va
        type: integer
        source: computed
        description: computed existing demand under the chosen method (see calc panel_load_existing_demand)
        default: 0
      - name: spare_capacity_va
        type: integer
        source: computed
        description: panel_capacity_va minus existing_demand_va (see calc panel_spare_capacity)
        default: 0
      - name: charger_fits
        type: boolean
        source: computed
        description: true when spare_capacity_va >= required charger continuous VA at decision time
        default: false
      - name: status
        type: enum
        source: system
        description: assessment lifecycle
        default: DRAFT
        constraints: one of {DRAFT, ACCEPTED, SUPERSEDED}

  - name: Quote
    parent: null
    common_fields: true
    fields:
      - name: install_job_id
        type: string
        source: input
        description: "FK -> InstallJob.id; the job this quote prices"
      - name: labor_cents
        type: integer
        source: input
        description: labor line in integer cents
        constraints: non-negative
      - name: parts_line_cents
        type: array
        source: input
        description: ordered list of taxable parts line amounts in integer cents (per-line tax rounding applies)
        constraints: each non-negative
      - name: base_subtotal_cents
        type: integer
        source: computed
        description: labor_cents plus sum of parts_line_cents (see calc quote_total)
        default: 0
      - name: discount_cents
        type: integer
        source: computed
        description: volume discount selected by base_subtotal tier (see calc quote_total)
        default: 0
      - name: tax_cents
        type: integer
        source: computed
        description: sales tax on parts lines, rounded per-line then summed (see calc quote_tax)
        default: 0
      - name: permit_fee_cents
        type: integer
        source: computed
        description: permit fee selected by post-discount net tier (see calc quote_total)
        default: 0
      - name: quote_total_cents
        type: integer
        source: computed
        description: net_after_discount + tax + permit_fee (see calc quote_total)
        default: 0
      - name: status
        type: enum
        source: system
        description: quote lifecycle
        default: DRAFT
        constraints: one of {DRAFT, SENT, ACCEPTED, REJECTED}

  - name: PermitApplication
    parent: null
    common_fields: true
    fields:
      - name: install_job_id
        type: string
        source: input
        description: "FK -> InstallJob.id; the job needing a permit"
      - name: jurisdiction_code
        type: string
        source: input
        description: AHJ jurisdiction code
      - name: status
        type: enum
        source: system
        description: permit lifecycle (cyclic via corrections)
        default: SUBMITTED
        constraints: one of {SUBMITTED, CORRECTIONS_REQUESTED, APPROVED, REJECTED}
      - name: correction_rounds
        type: integer
        source: system
        description: number of times CORRECTIONS_REQUESTED has fired; >=3 forces REJECTED
        default: 0

  - name: InterconnectionRequest
    parent: null
    common_fields: true
    fields:
      - name: install_job_id
        type: string
        source: input
        description: "FK -> InstallJob.id; the job requesting utility interconnection"
      - name: utility_territory_code
        type: string
        source: input
        description: utility territory the request is filed with; must match the property's territory
      - name: requested_load_amps
        type: integer
        source: input
        description: the charger continuous-rated amps being added to the service
        constraints: positive
      - name: status
        type: enum
        source: system
        description: interconnection lifecycle
        default: FILED
        constraints: one of {FILED, UNDER_REVIEW, APPROVED, DENIED}

  - name: DispatchAssignment
    parent: null
    common_fields: true
    fields:
      - name: install_job_id
        type: string
        source: input
        description: "FK -> InstallJob.id; the job the electrician will perform"
      - name: electrician_id
        type: string
        source: input
        description: "FK -> Electrician.id; the assigned electrician"
      - name: window_date
        type: datetime
        source: input
        description: calendar date of the install window (ISO 8601 date-time, UTC; date portion is the booking day)
      - name: window_start_minute
        type: integer
        source: input
        description: start offset in minutes from midnight UTC of window_date
        constraints: 0..1439
      - name: window_end_minute
        type: integer
        source: input
        description: end offset in minutes from midnight UTC of window_date; half-open interval [start, end)
        constraints: 1..1440, > window_start_minute
      - name: status
        type: enum
        source: system
        description: dispatch lifecycle
        default: BOOKED
        constraints: one of {BOOKED, EN_ROUTE, COMPLETED, CANCELLED}

  - name: IncentiveClaim
    parent: null
    common_fields: true
    fields:
      - name: install_job_id
        type: string
        source: input
        description: "FK -> InstallJob.id; the completed install being claimed against"
      - name: program_kind
        type: enum
        source: input
        description: which incentive program math applies
        constraints: one of {FEDERAL_45W, UTILITY_REBATE}
      - name: eligible_cost_cents
        type: integer
        source: input
        description: the cost basis used by the incentive formula in integer cents
        constraints: non-negative
      - name: utility_program_tier
        type: enum
        source: input
        description: utility rebate tier (ignored when program_kind=FEDERAL_45W)
        default: BASIC
        constraints: one of {BASIC, PREMIUM}
      - name: includes_panel_upgrade
        type: boolean
        source: input
        description: whether the install included a panel upgrade (utility adder)
        default: false
      - name: award_cents
        type: integer
        source: computed
        description: computed incentive award (see calc incentive_award)
        default: 0
      - name: status
        type: enum
        source: system
        description: claim lifecycle
        default: DRAFT
        constraints: one of {DRAFT, SUBMITTED, PAID, REVERSED}

  - name: PanelUpgradeReferral
    parent: null
    common_fields: true
    fields:
      - name: install_job_id
        type: string
        source: input
        description: "FK -> InstallJob.id; the job whose assessment flagged a panel-capacity shortfall"
      - name: recommended_main_amps
        type: integer
        source: input
        description: recommended upgraded main service amperage
        constraints: one of {150, 200}
      - name: status
        type: enum
        source: system
        description: referral lifecycle
        default: OPEN
        constraints: one of {OPEN, ACCEPTED, DECLINED, COMPLETED}

  - name: WarrantyTicket
    parent: null
    common_fields: true
    fields:
      - name: install_job_id
        type: string
        source: input
        description: "FK -> InstallJob.id; the activated install under warranty"
      - name: summary
        type: string
        source: input
        description: defect summary
      - name: reopen_count
        type: integer
        source: system
        description: number of times the ticket has been reopened from RESOLVED
        default: 0
      - name: status
        type: enum
        source: system
        description: "warranty service lifecycle (cyclic - diagnosing<->awaiting_parts, resolved->open reopen)"
        default: OPEN
        constraints: one of {OPEN, DIAGNOSING, AWAITING_PARTS, RESOLVED, CLOSED}

# ---------------------------------------------------------------------------
# §1.2 State Machine Table
# ---------------------------------------------------------------------------
state_machines:

  # --- InstallJob: PARALLEL dimensions (workflow_status × compliance_status) ---
  - entity: InstallJob
    initial_state: CREATED          # workflow_status; compliance_status starts PENDING_REVIEW
    terminal_states: [CLOSED, CANCELLED]
    note: |
      Two independent dimensions evolve on the same row. workflow_status drives the
      install pipeline; compliance_status drives regulatory clearance. The two are
      coupled only at the SCHEDULED->INSTALLED transition, which requires
      compliance_status == CLEARED. Transitions below are tagged [WF] or [COMP].
    transitions:
      - from: CREATED
        to: ASSESSED
        trigger: "POST /site-assessments/{id}/accept  [WF]"
        actor: Coordinator
        preconditions:
          - "InstallJob.workflow_status == CREATED"
          - "the SiteAssessment.install_job_id == this job AND SiteAssessment.status == DRAFT"
        side_effects:
          - "SiteAssessment.status := ACCEPTED; any other ACCEPTED assessment on this job := SUPERSEDED"
          - "InstallJob.requires_panel_upgrade := (NOT accepted_assessment.charger_fits)"
          - "if requires_panel_upgrade: CASCADE create PanelUpgradeReferral{install_job_id, status=OPEN}; that creation itself sets InstallJob.compliance_status := BLOCKED"
          - "InstallJob.workflow_status := ASSESSED; updated_at refreshed; version +1"
      - from: ASSESSED
        to: QUOTED
        trigger: "POST /quotes/{id}/accept  [WF]"
        actor: Homeowner
        preconditions:
          - "InstallJob.workflow_status == ASSESSED"
          - "the Quote.install_job_id == this job AND Quote.status == SENT"
          - "expected_install_job_version matches InstallJob.version (OCC)"
        side_effects:
          - "Quote.status := ACCEPTED; any other ACCEPTED/SENT quote on this job := REJECTED"
          - "InstallJob.workflow_status := QUOTED; updated_at refreshed; version +1"
      - from: QUOTED
        to: SCHEDULED
        trigger: "POST /dispatch-assignments  [WF] (booking the job)"
        actor: Coordinator
        preconditions:
          - "InstallJob.workflow_status == QUOTED"
          - "Electrician.status == ACTIVE AND Electrician.license_state_code == Property.state_code"
          - "no booking-day overlap on the electrician (see overlap rule electrician_day_overlap)"
          - "electrician's BOOKED+EN_ROUTE assignment count on window_date < Electrician.max_daily_jobs"
        side_effects:
          - "DispatchAssignment created status=BOOKED"
          - "InstallJob.workflow_status := SCHEDULED; updated_at refreshed; version +1"
      - from: SCHEDULED
        to: INSTALLED
        trigger: "POST /dispatch-assignments/{id}/complete  [WF]"
        actor: Electrician
        preconditions:
          - "InstallJob.workflow_status == SCHEDULED"
          - "InstallJob.compliance_status == CLEARED  (cross-dimension gate)"
          - "DispatchAssignment.status == EN_ROUTE"
        side_effects:
          - "DispatchAssignment.status := COMPLETED"
          - "InstallJob.activation_pairing_code := minted one-time code"
          - "InstallJob.workflow_status := INSTALLED; updated_at refreshed; version +1"
      - from: INSTALLED
        to: ACTIVATED
        trigger: "POST /install-jobs/{id}/activate  [WF]"
        actor: Homeowner
        preconditions:
          - "InstallJob.workflow_status == INSTALLED"
          - "submitted pairing_code == InstallJob.activation_pairing_code"
        side_effects:
          - "InstallJob.workflow_status := ACTIVATED; updated_at refreshed; version +1"
      - from: ACTIVATED
        to: CLOSED
        trigger: "POST /install-jobs/{id}/close  [WF]"
        actor: Coordinator
        preconditions:
          - "InstallJob.workflow_status == ACTIVATED"
          - "no WarrantyTicket on this job in {OPEN, DIAGNOSING, AWAITING_PARTS}"
        side_effects:
          - "InstallJob.workflow_status := CLOSED; updated_at refreshed; version +1"
      - from: CREATED
        to: CANCELLED
        trigger: "POST /install-jobs/{id}/cancel  [WF] (also valid from ASSESSED, QUOTED, SCHEDULED)"
        actor: Homeowner
        preconditions:
          - "InstallJob.workflow_status IN {CREATED, ASSESSED, QUOTED, SCHEDULED}"
        side_effects:
          - "CASCADE: any DispatchAssignment in {BOOKED, EN_ROUTE} on this job := CANCELLED"
          - "CASCADE: any Quote in {DRAFT, SENT} on this job := REJECTED"
          - "InstallJob.workflow_status := CANCELLED; updated_at refreshed; version +1"
      # --- compliance_status dimension (independent of workflow_status) ---
      - from: PENDING_REVIEW
        to: PERMIT_PENDING
        trigger: "POST /permit-applications  [COMP] (filing the permit)"
        actor: Coordinator
        preconditions:
          - "InstallJob.compliance_status == PENDING_REVIEW"
          - "InstallJob.requires_panel_upgrade == false  (a blocked job cannot start permitting)"
        side_effects:
          - "PermitApplication created status=SUBMITTED"
          - "InstallJob.compliance_status := PERMIT_PENDING; updated_at refreshed; version +1"
      - from: PERMIT_PENDING
        to: CLEARED
        trigger: "system: PermitApplication.status->APPROVED AND InterconnectionRequest.status->APPROVED both hold  [COMP]"
        actor: system
        preconditions:
          - "InstallJob.compliance_status == PERMIT_PENDING"
          - "exists PermitApplication on this job with status==APPROVED"
          - "exists InterconnectionRequest on this job with status==APPROVED"
        side_effects:
          - "BUBBLE-UP: InstallJob.compliance_status := CLEARED; updated_at refreshed; version +1"
        note: "re-evaluated whenever a child permit or interconnection reaches APPROVED"
      - from: PENDING_REVIEW
        to: BLOCKED
        trigger: "system: PanelUpgradeReferral created on this job  [COMP]"
        actor: system
        preconditions:
          - "InstallJob.compliance_status == PENDING_REVIEW"
        side_effects:
          - "InstallJob.compliance_status := BLOCKED; updated_at refreshed; version +1"
      - from: BLOCKED
        to: PENDING_REVIEW
        trigger: "POST /panel-upgrade-referrals/{id}/complete  [COMP] (upgrade done)"
        actor: Coordinator
        preconditions:
          - "InstallJob.compliance_status == BLOCKED"
          - "PanelUpgradeReferral.status == ACCEPTED"
        side_effects:
          - "PanelUpgradeReferral.status := COMPLETED"
          - "Property.main_breaker_amps := PanelUpgradeReferral.recommended_main_amps"
          - "InstallJob.requires_panel_upgrade := false"
          - "InstallJob.compliance_status := PENDING_REVIEW; updated_at refreshed; version +1"

  # --- Quote: BRANCHING WITH REVERT (revision loop) ---
  - entity: Quote
    initial_state: DRAFT
    terminal_states: [ACCEPTED]
    transitions:
      - from: DRAFT
        to: SENT
        trigger: "POST /quotes/{id}/send"
        actor: Coordinator
        preconditions:
          - "Quote.status == DRAFT"
          - "InstallJob.workflow_status == ASSESSED"
        side_effects: ["Quote.status := SENT; version +1"]
      - from: SENT
        to: ACCEPTED
        trigger: "POST /quotes/{id}/accept"
        actor: Homeowner
        preconditions:
          - "Quote.status == SENT"
          - "expected_install_job_version matches InstallJob.version (OCC)"
        side_effects:
          - "Quote.status := ACCEPTED"
          - "drives InstallJob ASSESSED->QUOTED (see InstallJob machine)"
      - from: SENT
        to: REJECTED
        trigger: "POST /quotes/{id}/reject"
        actor: Homeowner
        preconditions: ["Quote.status == SENT"]
        side_effects: ["Quote.status := REJECTED; version +1"]
      - from: REJECTED
        to: DRAFT
        trigger: "POST /quotes/{id}/revise"
        actor: Coordinator
        preconditions: ["Quote.status == REJECTED"]
        side_effects:
          - "Quote.status := DRAFT (revision loop; recompute totals from new labor/parts)"
          - "version +1"
        note: "cyclic: REJECTED->DRAFT->SENT->REJECTED may repeat"

  # --- PermitApplication: CYCLIC (corrections loop) ---
  - entity: PermitApplication
    initial_state: SUBMITTED
    terminal_states: [APPROVED, REJECTED]
    transitions:
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /permit-applications/{id}/approve"
        actor: Coordinator
        preconditions: ["PermitApplication.status == SUBMITTED"]
        side_effects:
          - "PermitApplication.status := APPROVED; version +1"
          - "BUBBLE-UP: re-evaluate parent InstallJob PERMIT_PENDING->CLEARED gate"
      - from: SUBMITTED
        to: CORRECTIONS_REQUESTED
        trigger: "POST /permit-applications/{id}/request-corrections"
        actor: Coordinator
        preconditions: ["PermitApplication.status == SUBMITTED"]
        side_effects:
          - "PermitApplication.correction_rounds += 1"
          - "PermitApplication.status := CORRECTIONS_REQUESTED; version +1"
      - from: CORRECTIONS_REQUESTED
        to: SUBMITTED
        trigger: "POST /permit-applications/{id}/resubmit"
        actor: Coordinator
        preconditions:
          - "PermitApplication.status == CORRECTIONS_REQUESTED"
          - "PermitApplication.correction_rounds < 3"
        side_effects: ["PermitApplication.status := SUBMITTED; version +1"]
        note: "cyclic: SUBMITTED<->CORRECTIONS_REQUESTED"
      - from: CORRECTIONS_REQUESTED
        to: REJECTED
        trigger: "POST /permit-applications/{id}/resubmit (auto-reject when correction_rounds >= 3)"
        actor: system
        preconditions:
          - "PermitApplication.status == CORRECTIONS_REQUESTED"
          - "PermitApplication.correction_rounds >= 3"
        side_effects: ["PermitApplication.status := REJECTED; version +1"]

  # --- InterconnectionRequest: BRANCHING (approve/deny) ---
  - entity: InterconnectionRequest
    initial_state: FILED
    terminal_states: [APPROVED, DENIED]
    transitions:
      - from: FILED
        to: UNDER_REVIEW
        trigger: "POST /interconnection-requests/{id}/start-review"
        actor: UtilityReviewer
        preconditions: ["InterconnectionRequest.status == FILED"]
        side_effects: ["InterconnectionRequest.status := UNDER_REVIEW; version +1"]
      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /interconnection-requests/{id}/approve"
        actor: UtilityReviewer
        preconditions:
          - "InterconnectionRequest.status == UNDER_REVIEW"
          - "InterconnectionRequest.utility_territory_code == Property.utility_territory_code"
        side_effects:
          - "InterconnectionRequest.status := APPROVED; version +1"
          - "BUBBLE-UP: re-evaluate parent InstallJob PERMIT_PENDING->CLEARED gate"
      - from: UNDER_REVIEW
        to: DENIED
        trigger: "POST /interconnection-requests/{id}/deny"
        actor: UtilityReviewer
        preconditions: ["InterconnectionRequest.status == UNDER_REVIEW"]
        side_effects: ["InterconnectionRequest.status := DENIED; version +1"]

  # --- DispatchAssignment: temporal lifecycle ---
  - entity: DispatchAssignment
    initial_state: BOOKED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: BOOKED
        to: EN_ROUTE
        trigger: "POST /dispatch-assignments/{id}/depart"
        actor: Electrician
        preconditions:
          - "DispatchAssignment.status == BOOKED"
          - "the acting Electrician.id == DispatchAssignment.electrician_id"
        side_effects: ["DispatchAssignment.status := EN_ROUTE; version +1"]
      - from: EN_ROUTE
        to: COMPLETED
        trigger: "POST /dispatch-assignments/{id}/complete"
        actor: Electrician
        preconditions:
          - "DispatchAssignment.status == EN_ROUTE"
          - "InstallJob.compliance_status == CLEARED"
        side_effects:
          - "DispatchAssignment.status := COMPLETED"
          - "drives InstallJob SCHEDULED->INSTALLED (see InstallJob machine)"
      - from: BOOKED
        to: CANCELLED
        trigger: "POST /dispatch-assignments/{id}/cancel"
        actor: Coordinator
        preconditions: ["DispatchAssignment.status == BOOKED"]
        side_effects:
          - "DispatchAssignment.status := CANCELLED; version +1"
          - "if InstallJob.workflow_status == SCHEDULED: InstallJob.workflow_status := QUOTED (revert)"

  # --- IncentiveClaim: linear with compensation ---
  - entity: IncentiveClaim
    initial_state: DRAFT
    terminal_states: [REVERSED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /incentive-claims/{id}/submit"
        actor: Coordinator
        preconditions:
          - "IncentiveClaim.status == DRAFT"
          - "InstallJob.workflow_status IN {ACTIVATED, CLOSED}"
        side_effects: ["IncentiveClaim.status := SUBMITTED; version +1"]
      - from: SUBMITTED
        to: PAID
        trigger: "POST /incentive-claims/{id}/pay"
        actor: Coordinator
        preconditions: ["IncentiveClaim.status == SUBMITTED"]
        side_effects: ["IncentiveClaim.status := PAID; version +1"]
      - from: PAID
        to: REVERSED
        trigger: "POST /incentive-claims/{id}/reverse"
        actor: Coordinator
        preconditions: ["IncentiveClaim.status == PAID"]
        side_effects:
          - "IncentiveClaim.status := REVERSED"
          - "compensation: award_cents conceptually clawed back (see compensating invariant incentive_award_conservation)"
          - "version +1"

  # --- PanelUpgradeReferral: branching lifecycle ---
  - entity: PanelUpgradeReferral
    initial_state: OPEN
    terminal_states: [DECLINED, COMPLETED]
    transitions:
      - from: OPEN
        to: ACCEPTED
        trigger: "POST /panel-upgrade-referrals/{id}/accept"
        actor: Homeowner
        preconditions: ["PanelUpgradeReferral.status == OPEN"]
        side_effects: ["PanelUpgradeReferral.status := ACCEPTED; version +1"]
      - from: OPEN
        to: DECLINED
        trigger: "POST /panel-upgrade-referrals/{id}/decline"
        actor: Homeowner
        preconditions: ["PanelUpgradeReferral.status == OPEN"]
        side_effects: ["PanelUpgradeReferral.status := DECLINED; version +1"]
      - from: ACCEPTED
        to: COMPLETED
        trigger: "POST /panel-upgrade-referrals/{id}/complete"
        actor: Coordinator
        preconditions: ["PanelUpgradeReferral.status == ACCEPTED"]
        side_effects:
          - "PanelUpgradeReferral.status := COMPLETED"
          - "drives InstallJob compliance_status BLOCKED->PENDING_REVIEW (see InstallJob machine)"

  # --- WarrantyTicket: CYCLIC (diagnosis loop + reopen) ---
  - entity: WarrantyTicket
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: DIAGNOSING
        trigger: "POST /warranty-tickets/{id}/diagnose"
        actor: Electrician
        preconditions:
          - "WarrantyTicket.status == OPEN"
          - "InstallJob.workflow_status IN {ACTIVATED, CLOSED}"
        side_effects: ["WarrantyTicket.status := DIAGNOSING; version +1"]
      - from: DIAGNOSING
        to: AWAITING_PARTS
        trigger: "POST /warranty-tickets/{id}/order-parts"
        actor: Electrician
        preconditions: ["WarrantyTicket.status == DIAGNOSING"]
        side_effects: ["WarrantyTicket.status := AWAITING_PARTS; version +1"]
      - from: AWAITING_PARTS
        to: DIAGNOSING
        trigger: "POST /warranty-tickets/{id}/parts-received"
        actor: Electrician
        preconditions: ["WarrantyTicket.status == AWAITING_PARTS"]
        side_effects: ["WarrantyTicket.status := DIAGNOSING; version +1"]
        note: "cyclic: DIAGNOSING<->AWAITING_PARTS"
      - from: DIAGNOSING
        to: RESOLVED
        trigger: "POST /warranty-tickets/{id}/resolve"
        actor: Electrician
        preconditions: ["WarrantyTicket.status == DIAGNOSING"]
        side_effects: ["WarrantyTicket.status := RESOLVED; version +1"]
      - from: RESOLVED
        to: OPEN
        trigger: "POST /warranty-tickets/{id}/reopen"
        actor: Homeowner
        preconditions:
          - "WarrantyTicket.status == RESOLVED"
          - "WarrantyTicket.reopen_count < 2"
        side_effects:
          - "WarrantyTicket.reopen_count += 1"
          - "WarrantyTicket.status := OPEN; version +1"
        note: "cyclic reopen: RESOLVED->OPEN, capped at 2 reopens"
      - from: RESOLVED
        to: CLOSED
        trigger: "POST /warranty-tickets/{id}/close"
        actor: Coordinator
        preconditions: ["WarrantyTicket.status == RESOLVED"]
        side_effects: ["WarrantyTicket.status := CLOSED; version +1"]

# ---------------------------------------------------------------------------
# §1.2.1 Concurrency Rules (OCC on InstallJob.version)
# ---------------------------------------------------------------------------
concurrency_rules:
  - rule_id: quote-accept-stale-job
    parent_entity: InstallJob
    write_endpoint: "POST /quotes/{id}/accept"
    occ_field: "expected_install_job_version"
    description: |
      Accepting a Quote against an InstallJob whose version has advanced since the
      client last observed it is rejected on a stale-version check. A second SENT
      quote on the same job that legitimately supersedes the prior accepted quote
      (rejecting it) is the canonical case: the first acceptance advances
      InstallJob.version, so a later acceptance still carrying the older expected
      version is rejected.
    error_id: ERR_STALE_JOB_VERSION
    http_status: 412
  - rule_id: scope-change-stale-job
    parent_entity: InstallJob
    write_endpoint: "PATCH /install-jobs/{id}/scope"
    occ_field: "expected_install_job_version"
    description: |
      Changing the scoped ChargerProduct on an InstallJob whose version has advanced
      since the client last observed it is rejected on a stale-version check. The new
      scope legitimately supersedes the prior product, but a stale expected version
      indicates the client's view predates an intervening mutation.
    error_id: ERR_STALE_JOB_VERSION
    http_status: 412

# ---------------------------------------------------------------------------
# §1.3 Calculation Rules Table
# ---------------------------------------------------------------------------
calculations:

  # ===== DUAL-VARIANT calc #1 (panel-load methods on SiteAssessment) =====
  - name: panel_load_existing_demand
    trigger: "computed on SiteAssessment create AND re-read; finalized at the CREATED->ASSESSED accept transition"
    algorithm: threshold
    formula: |
      panel_capacity_va = Property.service_voltage * Property.main_breaker_amps   # e.g. 240*100=24000
      if assessment_method == STANDARD_220_83:
        general_va        = Property.floor_area_sqft * 3
        small_appliance_va = 2 * 1500            # two 1500 VA small-appliance circuits
        laundry_va        = 1500
        other_total_va    = general_va + small_appliance_va + laundry_va + declared_fixed_appliance_va
        # NEC 220.83(A): first 8000 VA at 100%, remainder at 40%
        existing_demand_va = 8000 + round_half_up(0.40 * (other_total_va - 8000))
      else:  # LOAD_STUDY_220_87
        # NEC 220.87: 125% of the metered peak
        existing_demand_va = round_half_up(1.25 * max_measured_demand_va)
    input_set: "single SiteAssessment row plus its Property; no aggregation over siblings"
    constants:
      GENERAL_VA_PER_SQFT: 3
      SMALL_APPLIANCE_CIRCUITS_VA: 1500
      SMALL_APPLIANCE_CIRCUIT_COUNT: 2
      LAUNDRY_VA: 1500
      STD_FIRST_TIER_VA: 8000
      STD_REMAINDER_FACTOR: 0.40
      LOAD_STUDY_FACTOR: 1.25
    precision: "integer VA, round_half_up on the fractional term"
    variants:
      - name: standard_220_83
        when: "assessment_method == STANDARD_220_83"
        difference: "sums declared loads with 8kVA-at-100%/remainder-at-40% demand factors; tends to overstate demand"
      - name: load_study_220_87
        when: "assessment_method == LOAD_STUDY_220_87"
        difference: "uses 125% of a single measured peak; tends to understate demand vs the standard method, so the same property can FIT under load-study but NOT under standard"

  - name: panel_spare_capacity
    trigger: "computed immediately after panel_load_existing_demand on the same SiteAssessment"
    algorithm: threshold
    formula: |
      panel_capacity_va    = Property.service_voltage * Property.main_breaker_amps
      spare_capacity_va    = panel_capacity_va - existing_demand_va
      charger_required_va  = round_half_up(1.25 * ChargerProduct.rated_amps * Property.service_voltage)  # continuous 125%
      charger_fits         = (spare_capacity_va >= charger_required_va)   # boundary: >= (exactly equal FITS)
    input_set: "SiteAssessment + its Property + the InstallJob's scoped ChargerProduct"
    constants:
      CONTINUOUS_FACTOR: 1.25
    precision: "integer VA"
    variants:
      - name: fits_boundary
        when: "spare_capacity_va == charger_required_va exactly"
        difference: "exact-equality boundary FITS (>=, not >)"

  # ===== DUAL-VARIANT calc #2 (incentive math on IncentiveClaim — different domain) =====
  - name: incentive_award
    trigger: "computed on IncentiveClaim create AND re-read"
    algorithm: tiered_pricing
    formula: |
      # Evaluation order is pinned: federal first, then utility, then stacking cap.
      if program_kind == FEDERAL_45W:
        award_cents = min( round_half_up(FED_RATE * eligible_cost_cents), FED_CAP_CENTS )
      else:  # UTILITY_REBATE
        base_cents  = (PREMIUM_BASE_CENTS if utility_program_tier == PREMIUM else BASIC_BASE_CENTS)
        adder_cents = (PANEL_UPGRADE_ADDER_CENTS if includes_panel_upgrade else 0)
        util_raw    = base_cents + adder_cents
        # Stacking cap is evaluated against the SUM of this job's federal award (if any
        # FEDERAL_45W claim exists in {SUBMITTED, PAID}) PLUS util_raw. Federal is protected;
        # the utility award absorbs the reduction.
        fed_existing = award_cents of this job's FEDERAL_45W claim whose status IN {SUBMITTED, PAID}, else 0
        stack_cap    = round_half_up(STACK_CAP_PCT * eligible_cost_cents)
        if fed_existing + util_raw > stack_cap:
          award_cents = max(0, stack_cap - fed_existing)
        else:
          award_cents = util_raw
    input_set: "the IncentiveClaim row; the UTILITY_REBATE branch also reads sibling FEDERAL_45W claims on the same install_job_id filtered to status IN {SUBMITTED, PAID}, tie-break created_at ASC if multiple"
    constants:
      FED_RATE: 0.30
      FED_CAP_CENTS: 100000
      BASIC_BASE_CENTS: 25000
      PREMIUM_BASE_CENTS: 50000
      PANEL_UPGRADE_ADDER_CENTS: 30000
      STACK_CAP_PCT: 0.80
    precision: "integer cents, round_half_up"
    variants:
      - name: federal_45w
        when: "program_kind == FEDERAL_45W"
        difference: "30% of eligible cost capped at $1000; ignores tier/adder/stacking"
      - name: utility_capped
        when: "program_kind == UTILITY_REBATE AND fed_existing + util_raw > stack_cap"
        difference: "utility award reduced so federal+utility == 80% of eligible cost; same inputs WITHOUT a federal sibling yield the full util_raw"

  # ===== COMBINATORIAL calc — mode (c): circular-looking dependency, pinned order =====
  - name: quote_total
    trigger: "computed on Quote create, on POST /quotes/{id}/revise, and re-read"
    algorithm: tiered_pricing
    formula: |
      # Circular-looking: total depends on permit_fee, permit_fee depends on net,
      # net depends on discount, discount depends on base_subtotal. Pinned order below.
      base_subtotal_cents = labor_cents + sum(parts_line_cents)
      # 1. discount tier keyed on base_subtotal
      if base_subtotal_cents >= 200000:      disc_pct = 0.10
      elif base_subtotal_cents >= 100000:    disc_pct = 0.05
      else:                                  disc_pct = 0.00
      discount_cents      = round_half_up(disc_pct * base_subtotal_cents)
      net_after_discount  = base_subtotal_cents - discount_cents
      # 2. permit fee keyed on the POST-discount net (the circular leg)
      if net_after_discount >= 150000:       permit_fee_cents = 20000
      elif net_after_discount >= 90000:      permit_fee_cents = 15000
      else:                                  permit_fee_cents = 12000
      # 3. total = net + tax (see quote_tax) + permit
      quote_total_cents   = net_after_discount + tax_cents + permit_fee_cents
    input_set: "single Quote row"
    constants:
      DISC_TIER_HI_CENTS: 200000
      DISC_TIER_MID_CENTS: 100000
      DISC_PCT_HI: 0.10
      DISC_PCT_MID: 0.05
      PERMIT_HI_NET_CENTS: 150000
      PERMIT_MID_NET_CENTS: 90000
      PERMIT_HI_CENTS: 20000
      PERMIT_MID_CENTS: 15000
      PERMIT_LO_CENTS: 12000
    precision: "integer cents, round_half_up"
    variants:
      - name: discount_tier_boundary
        when: "base_subtotal_cents == 200000 exactly"
        difference: ">= boundary selects the 10% tier, not 5%"

  # ===== COMBINATORIAL calc — mode (b): nested rounding order pinned =====
  - name: quote_tax
    trigger: "computed as part of quote_total on Quote create / revise"
    algorithm: aggregation
    formula: |
      # PINNED ORDER: round per-line then sum (NOT sum then round).
      tax_cents = sum over each line L in parts_line_cents of round_half_up(TAX_RATE * L)
    input_set: "the Quote.parts_line_cents array; labor is NOT taxed"
    constants:
      TAX_RATE: 0.0825
    precision: "integer cents, round_half_up PER LINE then sum"
    variants:
      - name: per_line_vs_sum_then_round
        when: "parts_line_cents has >= 2 lines whose fractional cents accumulate"
        difference: "round-per-line-then-sum can differ from sum-then-round by 1 cent; scaffold pins per-line"

  # ===== electrician day capacity (aggregation + threshold, boundary) =====
  - name: electrician_day_load
    trigger: "checked when booking a DispatchAssignment (POST /dispatch-assignments)"
    algorithm: aggregation
    formula: |
      day_count = count of DispatchAssignment rows where
                    electrician_id == target electrician
                    AND date(window_date) == target window_date
                    AND status IN {BOOKED, EN_ROUTE}
      # booking allowed iff day_count < Electrician.max_daily_jobs (strict <)
    input_set: "DispatchAssignment rows filtered to electrician_id, same window_date (UTC date), status IN {BOOKED, EN_ROUTE}"
    constants: {}
    precision: "integer count"
    variants:
      - name: capacity_boundary
        when: "day_count == max_daily_jobs"
        difference: "strict < means at-capacity (count==max) is rejected; count==max-1 is allowed"

# ---------------------------------------------------------------------------
# §1.4 Validation Rules Table (ordered by priority)
# ---------------------------------------------------------------------------
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all except anonymous registration/create endpoints noted in §1.5"
  - priority: 2
    category: auth
    check: "the role is permitted for this operation per §1.7"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "every path/body referenced resource exists, validated left-to-right"
    error_id: ERR_RESOURCE_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with path ids or FK body fields"
  - priority: 4
    category: business_referential
    check: "FK body fields reference resources that exist (charger_product_sku, property_id, install_job_id, electrician_id)"
    error_id: ERR_FK_NOT_FOUND
    http_status: 404
    applies_to: "create endpoints carrying FK fields"
  - priority: 5
    category: auth
    check: "entity_backed actor owns the resource (Homeowner is owner of Property/InstallJob; Electrician is the assignee of the DispatchAssignment)"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "ownership-scoped actions (job activate/cancel/close, dispatch depart/complete)"
  - priority: 6
    category: state
    check: "target resource is in a state from which the requested transition is defined"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"
  - priority: 7
    category: state
    check: "OCC: expected_install_job_version equals InstallJob.version"
    error_id: ERR_STALE_JOB_VERSION
    http_status: 412
    applies_to: "POST /quotes/{id}/accept, PATCH /install-jobs/{id}/scope"
  - priority: 8
    category: business_safety
    check: "SCHEDULED->INSTALLED requires InstallJob.compliance_status == CLEARED (permit + interconnection both approved, no open panel-upgrade block)"
    error_id: ERR_COMPLIANCE_NOT_CLEARED
    http_status: 409
    applies_to: "POST /dispatch-assignments/{id}/complete"
  - priority: 9
    category: business_safety
    check: "a job with requires_panel_upgrade == true (BLOCKED) cannot start permitting"
    error_id: ERR_PANEL_UPGRADE_REQUIRED
    http_status: 409
    applies_to: "POST /permit-applications"
  - priority: 9.5
    category: state
    check: "the electrician being booked must have status == ACTIVE (not SUSPENDED)"
    error_id: ERR_ELECTRICIAN_SUSPENDED
    http_status: 409
    applies_to: "POST /dispatch-assignments"
  - priority: 10
    category: business_constraint
    check: "Electrician.license_state_code must equal Property.state_code for a booking"
    error_id: ERR_ELECTRICIAN_OUT_OF_TERRITORY
    http_status: 422
    applies_to: "POST /dispatch-assignments"
  - priority: 11
    category: business_constraint
    check: "InterconnectionRequest.utility_territory_code must equal Property.utility_territory_code to approve"
    error_id: ERR_TERRITORY_MISMATCH
    http_status: 422
    applies_to: "POST /interconnection-requests/{id}/approve"
  - priority: 12
    category: business_temporal
    check: "new DispatchAssignment window must not overlap (half-open [start,end)) any non-cancelled assignment for the same electrician on the same window_date"
    error_id: ERR_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /dispatch-assignments"
  - priority: 13
    category: business_constraint
    check: "electrician day capacity: BOOKED+EN_ROUTE count on window_date must be strictly < max_daily_jobs"
    error_id: ERR_DAILY_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /dispatch-assignments"
  - priority: 14
    category: business_constraint
    check: "scoped ChargerProduct.required_circuit_amps must not exceed the property service capacity headroom band for the panel (200A panel supports 60A circuit; 150A supports up to 50A; 100A supports up to 40A)"
    error_id: ERR_CIRCUIT_EXCEEDS_PANEL
    http_status: 422
    applies_to: "POST /install-jobs, PATCH /install-jobs/{id}/scope"
  - priority: 15
    category: business_fiscal
    check: "IncentiveClaim award would push job-cumulative incentives over the 80% stacking cap is allowed (it clamps) but a UTILITY_REBATE claim whose clamped award computes to 0 is rejected as non-fundable"
    error_id: ERR_INCENTIVE_FULLY_ABSORBED
    http_status: 422
    applies_to: "POST /incentive-claims"
  - priority: 16
    category: business_constraint
    check: "request body field types/enums valid; required fields present; window_end_minute > window_start_minute"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all create/update endpoints"

# ---------------------------------------------------------------------------
# §1.5 API Endpoint Table
# ---------------------------------------------------------------------------
endpoints:
  # --- test-driving clock ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server logical clock. Default at startup is 2026-04-01T00:00:00Z; before any set call the clock reads exactly this default and never falls back to wall-clock time."
    roles: [Coordinator]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["logical clock advanced to to_iso8601"]

  # --- Homeowner ---
  - method: POST
    path: "/homeowners"
    description: "Register a homeowner."
    roles: [Anonymous]
    code: 201
    input: [email, full_name, state_code]
    output: Homeowner
    side_effects: ["Homeowner created"]

  # --- Property ---
  - method: POST
    path: "/properties"
    description: "Create a property owned by a homeowner."
    roles: [Homeowner, Coordinator]
    code: 201
    input: [homeowner_id, address_line, state_code, utility_territory_code, main_breaker_amps, floor_area_sqft, "service_voltage?"]
    output: Property
    side_effects: ["Property created"]
  - method: GET
    path: "/properties/{id}"
    description: "Fetch a property."
    roles: [Homeowner, Coordinator]
    code: 200
    input: []
    output: Property
  - method: GET
    path: "/properties"
    description: "List properties; filter by homeowner_id."
    roles: [Homeowner, Coordinator]
    code: 200
    input: ["homeowner_id?", "limit?", "offset?"]
    output: Property[]

  # --- ChargerProduct (catalog) ---
  - method: POST
    path: "/charger-products"
    description: "Create a charger catalog entry."
    roles: [Coordinator]
    code: 201
    input: [sku, name, rated_amps, required_circuit_amps, msrp_cents]
    output: ChargerProduct
    side_effects: ["ChargerProduct created"]
  - method: GET
    path: "/charger-products/{id}"
    description: "Fetch a charger product by sku."
    roles: [Homeowner, Coordinator]
    code: 200
    input: []
    output: ChargerProduct

  # --- Electrician ---
  - method: POST
    path: "/electricians"
    description: "Register an electrician."
    roles: [Coordinator]
    code: 201
    input: [full_name, license_state_code, "max_daily_jobs?"]
    output: Electrician
    side_effects: ["Electrician created status=ACTIVE"]
  - method: GET
    path: "/electricians/{id}"
    description: "Fetch an electrician."
    roles: [Coordinator, Electrician]
    code: 200
    input: []
    output: Electrician
  - method: POST
    path: "/_electricians/{id}/set-status"
    description: "Test-driving endpoint to set an electrician's status (ACTIVE/SUSPENDED) so suspension-gated paths are reachable from empty-DB."
    roles: [Coordinator]
    code: 200
    input: [status]
    output: Electrician
    side_effects: ["Electrician.status set to the given value"]

  # --- InstallJob ---
  - method: POST
    path: "/install-jobs"
    description: "Create an install job for a property scoping a charger product. workflow_status=CREATED, compliance_status=PENDING_REVIEW."
    roles: [Homeowner, Coordinator]
    code: 201
    input: [property_id, charger_product_sku]
    output: InstallJob
    side_effects: ["InstallJob created", "validates ERR_CIRCUIT_EXCEEDS_PANEL against property panel"]
  - method: GET
    path: "/install-jobs/{id}"
    description: "Fetch an install job."
    roles: [Homeowner, Coordinator, Electrician]
    code: 200
    input: []
    output: InstallJob
  - method: GET
    path: "/install-jobs"
    description: "List install jobs; filter by property_id."
    roles: [Homeowner, Coordinator]
    code: 200
    input: ["property_id?", "limit?", "offset?"]
    output: InstallJob[]
  - method: PATCH
    path: "/install-jobs/{id}/scope"
    description: "Re-scope the charger product before quote acceptance. OCC on InstallJob.version."
    roles: [Coordinator]
    code: 200
    input: [charger_product_sku, expected_install_job_version]
    output: InstallJob
    side_effects: ["InstallJob.charger_product_sku updated", "increments InstallJob.version by 1", "re-validates ERR_CIRCUIT_EXCEEDS_PANEL"]
  - method: POST
    path: "/install-jobs/{id}/activate"
    description: "Pair the app and activate (INSTALLED->ACTIVATED)."
    roles: [Homeowner]
    code: 200
    input: [pairing_code]
    output: InstallJob
    side_effects: ["workflow_status INSTALLED->ACTIVATED", "increments InstallJob.version by 1"]
  - method: POST
    path: "/install-jobs/{id}/cancel"
    description: "Cancel a job (CREATED/ASSESSED/QUOTED/SCHEDULED -> CANCELLED)."
    roles: [Homeowner]
    code: 200
    input: []
    output: InstallJob
    side_effects: ["cascade-cancel dispatch + reject quotes", "workflow_status->CANCELLED", "increments InstallJob.version by 1"]
  - method: POST
    path: "/install-jobs/{id}/close"
    description: "Close an activated job (ACTIVATED->CLOSED)."
    roles: [Coordinator]
    code: 200
    input: []
    output: InstallJob
    side_effects: ["workflow_status->CLOSED", "increments InstallJob.version by 1"]

  # --- SiteAssessment ---
  - method: POST
    path: "/site-assessments"
    description: "Create a draft site assessment; computes existing_demand_va, spare_capacity_va, charger_fits."
    roles: [Coordinator]
    code: 201
    input: [property_id, install_job_id, assessment_method, declared_fixed_appliance_va, "max_measured_demand_va?"]
    output: SiteAssessment
    side_effects: ["SiteAssessment created status=DRAFT", "panel_load_existing_demand + panel_spare_capacity computed"]
  - method: GET
    path: "/site-assessments/{id}"
    description: "Fetch a site assessment."
    roles: [Coordinator, Homeowner]
    code: 200
    input: []
    output: SiteAssessment
  - method: GET
    path: "/site-assessments"
    description: "List site assessments; filter by install_job_id or property_id."
    roles: [Coordinator, Homeowner]
    code: 200
    input: ["install_job_id?", "property_id?", "limit?", "offset?"]
    output: SiteAssessment[]
  - method: POST
    path: "/site-assessments/{id}/accept"
    description: "Accept the assessment, driving InstallJob CREATED->ASSESSED; may cascade a PanelUpgradeReferral and BLOCK compliance."
    roles: [Coordinator]
    code: 200
    input: []
    output: SiteAssessment
    side_effects: ["status->ACCEPTED, supersede peers", "set InstallJob.requires_panel_upgrade", "cascade PanelUpgradeReferral + compliance BLOCKED if needed", "InstallJob workflow CREATED->ASSESSED"]

  # --- Quote ---
  - method: POST
    path: "/quotes"
    description: "Create a draft quote for a job; computes base_subtotal, discount, tax, permit_fee, quote_total."
    roles: [Coordinator]
    code: 201
    input: [install_job_id, labor_cents, parts_line_cents]
    output: Quote
    side_effects: ["Quote created status=DRAFT", "quote_total + quote_tax computed"]
  - method: GET
    path: "/quotes/{id}"
    description: "Fetch a quote."
    roles: [Coordinator, Homeowner]
    code: 200
    input: []
    output: Quote
  - method: GET
    path: "/quotes"
    description: "List quotes; filter by install_job_id."
    roles: [Coordinator, Homeowner]
    code: 200
    input: ["install_job_id?", "limit?", "offset?"]
    output: Quote[]
  - method: POST
    path: "/quotes/{id}/send"
    description: "Send a draft quote to the homeowner (DRAFT->SENT)."
    roles: [Coordinator]
    code: 200
    input: []
    output: Quote
    side_effects: ["status DRAFT->SENT"]
  - method: POST
    path: "/quotes/{id}/accept"
    description: "Homeowner accepts a sent quote (SENT->ACCEPTED), driving InstallJob ASSESSED->QUOTED. OCC on InstallJob.version."
    roles: [Homeowner]
    code: 200
    input: [expected_install_job_version]
    output: Quote
    side_effects: ["status SENT->ACCEPTED, reject peer quotes", "InstallJob workflow ASSESSED->QUOTED", "increments InstallJob.version by 1"]
  - method: POST
    path: "/quotes/{id}/reject"
    description: "Homeowner rejects a sent quote (SENT->REJECTED)."
    roles: [Homeowner]
    code: 200
    input: []
    output: Quote
    side_effects: ["status SENT->REJECTED"]
  - method: POST
    path: "/quotes/{id}/revise"
    description: "Coordinator revises a rejected quote back to DRAFT (REJECTED->DRAFT), recomputing totals from new labor/parts."
    roles: [Coordinator]
    code: 200
    input: ["labor_cents?", "parts_line_cents?"]
    output: Quote
    side_effects: ["status REJECTED->DRAFT", "recompute quote_total + quote_tax"]

  # --- PermitApplication ---
  - method: POST
    path: "/permit-applications"
    description: "File a permit for a job, driving compliance PENDING_REVIEW->PERMIT_PENDING. Rejected if requires_panel_upgrade."
    roles: [Coordinator]
    code: 201
    input: [install_job_id, jurisdiction_code]
    output: PermitApplication
    side_effects: ["PermitApplication created status=SUBMITTED", "InstallJob compliance PENDING_REVIEW->PERMIT_PENDING"]
  - method: GET
    path: "/permit-applications/{id}"
    description: "Fetch a permit application."
    roles: [Coordinator]
    code: 200
    input: []
    output: PermitApplication
  - method: GET
    path: "/permit-applications"
    description: "List permit applications; filter by install_job_id."
    roles: [Coordinator]
    code: 200
    input: ["install_job_id?", "limit?", "offset?"]
    output: PermitApplication[]
  - method: POST
    path: "/permit-applications/{id}/approve"
    description: "Approve a permit (SUBMITTED->APPROVED); bubbles up the InstallJob CLEARED gate."
    roles: [Coordinator]
    code: 200
    input: []
    output: PermitApplication
    side_effects: ["status->APPROVED", "re-evaluate InstallJob compliance CLEARED gate"]
  - method: POST
    path: "/permit-applications/{id}/request-corrections"
    description: "Request corrections (SUBMITTED->CORRECTIONS_REQUESTED); increments correction_rounds."
    roles: [Coordinator]
    code: 200
    input: []
    output: PermitApplication
    side_effects: ["correction_rounds += 1", "status->CORRECTIONS_REQUESTED"]
  - method: POST
    path: "/permit-applications/{id}/resubmit"
    description: "Resubmit after corrections (CORRECTIONS_REQUESTED->SUBMITTED); auto-rejects when correction_rounds >= 3."
    roles: [Coordinator]
    code: 200
    input: []
    output: PermitApplication
    side_effects: ["status->SUBMITTED, or ->REJECTED when correction_rounds >= 3"]

  # --- InterconnectionRequest ---
  - method: POST
    path: "/interconnection-requests"
    description: "File a utility interconnection request for a job."
    roles: [Coordinator]
    code: 201
    input: [install_job_id, utility_territory_code, requested_load_amps]
    output: InterconnectionRequest
    side_effects: ["InterconnectionRequest created status=FILED"]
  - method: GET
    path: "/interconnection-requests/{id}"
    description: "Fetch an interconnection request."
    roles: [Coordinator, UtilityReviewer]
    code: 200
    input: []
    output: InterconnectionRequest
  - method: GET
    path: "/interconnection-requests"
    description: "List interconnection requests; filter by install_job_id."
    roles: [Coordinator, UtilityReviewer]
    code: 200
    input: ["install_job_id?", "limit?", "offset?"]
    output: InterconnectionRequest[]
  - method: POST
    path: "/interconnection-requests/{id}/start-review"
    description: "Utility begins review (FILED->UNDER_REVIEW)."
    roles: [UtilityReviewer]
    code: 200
    input: []
    output: InterconnectionRequest
    side_effects: ["status FILED->UNDER_REVIEW"]
  - method: POST
    path: "/interconnection-requests/{id}/approve"
    description: "Utility approves (UNDER_REVIEW->APPROVED); territory must match property; bubbles up the InstallJob CLEARED gate."
    roles: [UtilityReviewer]
    code: 200
    input: []
    output: InterconnectionRequest
    side_effects: ["status->APPROVED", "re-evaluate InstallJob compliance CLEARED gate"]
  - method: POST
    path: "/interconnection-requests/{id}/deny"
    description: "Utility denies (UNDER_REVIEW->DENIED)."
    roles: [UtilityReviewer]
    code: 200
    input: []
    output: InterconnectionRequest
    side_effects: ["status->DENIED"]

  # --- DispatchAssignment ---
  - method: POST
    path: "/dispatch-assignments"
    description: "Book an electrician for a quoted job (QUOTED->SCHEDULED). Checks territory, overlap, daily capacity."
    roles: [Coordinator]
    code: 201
    input: [install_job_id, electrician_id, window_date, window_start_minute, window_end_minute]
    output: DispatchAssignment
    side_effects: ["DispatchAssignment created status=BOOKED", "InstallJob workflow QUOTED->SCHEDULED"]
  - method: GET
    path: "/dispatch-assignments/{id}"
    description: "Fetch a dispatch assignment."
    roles: [Coordinator, Electrician]
    code: 200
    input: []
    output: DispatchAssignment
  - method: GET
    path: "/dispatch-assignments"
    description: "List dispatch assignments; filter by install_job_id or electrician_id."
    roles: [Coordinator, Electrician]
    code: 200
    input: ["install_job_id?", "electrician_id?", "limit?", "offset?"]
    output: DispatchAssignment[]
  - method: POST
    path: "/dispatch-assignments/{id}/depart"
    description: "Electrician departs (BOOKED->EN_ROUTE)."
    roles: [Electrician]
    code: 200
    input: []
    output: DispatchAssignment
    side_effects: ["status BOOKED->EN_ROUTE"]
  - method: POST
    path: "/dispatch-assignments/{id}/complete"
    description: "Electrician completes install (EN_ROUTE->COMPLETED), driving InstallJob SCHEDULED->INSTALLED. Requires compliance CLEARED."
    roles: [Electrician]
    code: 200
    input: []
    output: DispatchAssignment
    side_effects: ["status->COMPLETED", "mint InstallJob.activation_pairing_code", "InstallJob workflow SCHEDULED->INSTALLED", "increments InstallJob.version by 1"]
  - method: POST
    path: "/dispatch-assignments/{id}/cancel"
    description: "Cancel a booked assignment (BOOKED->CANCELLED); reverts job SCHEDULED->QUOTED."
    roles: [Coordinator]
    code: 200
    input: []
    output: DispatchAssignment
    side_effects: ["status->CANCELLED", "revert InstallJob SCHEDULED->QUOTED if scheduled", "increments InstallJob.version by 1"]

  # --- IncentiveClaim ---
  - method: POST
    path: "/incentive-claims"
    description: "Create an incentive claim for an activated/closed job; computes award_cents (federal-45W or utility, with stacking cap)."
    roles: [Coordinator]
    code: 201
    input: [install_job_id, program_kind, eligible_cost_cents, "utility_program_tier?", "includes_panel_upgrade?"]
    output: IncentiveClaim
    side_effects: ["IncentiveClaim created status=DRAFT", "incentive_award computed"]
  - method: GET
    path: "/incentive-claims/{id}"
    description: "Fetch an incentive claim."
    roles: [Coordinator]
    code: 200
    input: []
    output: IncentiveClaim
  - method: GET
    path: "/incentive-claims"
    description: "List incentive claims; filter by install_job_id."
    roles: [Coordinator]
    code: 200
    input: ["install_job_id?", "limit?", "offset?"]
    output: IncentiveClaim[]
  - method: POST
    path: "/incentive-claims/{id}/submit"
    description: "Submit a draft claim (DRAFT->SUBMITTED)."
    roles: [Coordinator]
    code: 200
    input: []
    output: IncentiveClaim
    side_effects: ["status DRAFT->SUBMITTED"]
  - method: POST
    path: "/incentive-claims/{id}/pay"
    description: "Mark a submitted claim paid (SUBMITTED->PAID)."
    roles: [Coordinator]
    code: 200
    input: []
    output: IncentiveClaim
    side_effects: ["status SUBMITTED->PAID"]
  - method: POST
    path: "/incentive-claims/{id}/reverse"
    description: "Reverse a paid claim (PAID->REVERSED); clawback compensation."
    roles: [Coordinator]
    code: 200
    input: []
    output: IncentiveClaim
    side_effects: ["status PAID->REVERSED", "award conceptually clawed back"]

  # --- PanelUpgradeReferral ---
  - method: GET
    path: "/panel-upgrade-referrals/{id}"
    description: "Fetch a panel-upgrade referral."
    roles: [Coordinator, Homeowner]
    code: 200
    input: []
    output: PanelUpgradeReferral
  - method: GET
    path: "/panel-upgrade-referrals"
    description: "List panel-upgrade referrals; filter by install_job_id."
    roles: [Coordinator, Homeowner]
    code: 200
    input: ["install_job_id?", "limit?", "offset?"]
    output: PanelUpgradeReferral[]
  - method: POST
    path: "/panel-upgrade-referrals/{id}/accept"
    description: "Homeowner accepts the referral (OPEN->ACCEPTED)."
    roles: [Homeowner]
    code: 200
    input: []
    output: PanelUpgradeReferral
    side_effects: ["status OPEN->ACCEPTED"]
  - method: POST
    path: "/panel-upgrade-referrals/{id}/decline"
    description: "Homeowner declines the referral (OPEN->DECLINED)."
    roles: [Homeowner]
    code: 200
    input: []
    output: PanelUpgradeReferral
    side_effects: ["status OPEN->DECLINED"]
  - method: POST
    path: "/panel-upgrade-referrals/{id}/complete"
    description: "Coordinator marks the upgrade complete (ACCEPTED->COMPLETED), upgrading the panel and unblocking compliance."
    roles: [Coordinator]
    code: 200
    input: []
    output: PanelUpgradeReferral
    side_effects: ["status->COMPLETED", "Property.main_breaker_amps := recommended_main_amps", "InstallJob.requires_panel_upgrade=false", "compliance BLOCKED->PENDING_REVIEW", "increments InstallJob.version by 1"]

  # --- WarrantyTicket ---
  - method: POST
    path: "/warranty-tickets"
    description: "Open a warranty ticket against an activated/closed job."
    roles: [Homeowner]
    code: 201
    input: [install_job_id, summary]
    output: WarrantyTicket
    side_effects: ["WarrantyTicket created status=OPEN"]
  - method: GET
    path: "/warranty-tickets/{id}"
    description: "Fetch a warranty ticket."
    roles: [Homeowner, Coordinator, Electrician]
    code: 200
    input: []
    output: WarrantyTicket
  - method: GET
    path: "/warranty-tickets"
    description: "List warranty tickets; filter by install_job_id."
    roles: [Homeowner, Coordinator, Electrician]
    code: 200
    input: ["install_job_id?", "limit?", "offset?"]
    output: WarrantyTicket[]
  - method: POST
    path: "/warranty-tickets/{id}/diagnose"
    description: "Begin diagnosis (OPEN->DIAGNOSING)."
    roles: [Electrician]
    code: 200
    input: []
    output: WarrantyTicket
    side_effects: ["status OPEN->DIAGNOSING"]
  - method: POST
    path: "/warranty-tickets/{id}/order-parts"
    description: "Order parts (DIAGNOSING->AWAITING_PARTS)."
    roles: [Electrician]
    code: 200
    input: []
    output: WarrantyTicket
    side_effects: ["status DIAGNOSING->AWAITING_PARTS"]
  - method: POST
    path: "/warranty-tickets/{id}/parts-received"
    description: "Parts received (AWAITING_PARTS->DIAGNOSING)."
    roles: [Electrician]
    code: 200
    input: []
    output: WarrantyTicket
    side_effects: ["status AWAITING_PARTS->DIAGNOSING"]
  - method: POST
    path: "/warranty-tickets/{id}/resolve"
    description: "Resolve (DIAGNOSING->RESOLVED)."
    roles: [Electrician]
    code: 200
    input: []
    output: WarrantyTicket
    side_effects: ["status DIAGNOSING->RESOLVED"]
  - method: POST
    path: "/warranty-tickets/{id}/reopen"
    description: "Homeowner reopens (RESOLVED->OPEN); capped at 2 reopens."
    roles: [Homeowner]
    code: 200
    input: []
    output: WarrantyTicket
    side_effects: ["reopen_count += 1", "status RESOLVED->OPEN"]
  - method: POST
    path: "/warranty-tickets/{id}/close"
    description: "Coordinator closes (RESOLVED->CLOSED)."
    roles: [Coordinator]
    code: 200
    input: []
    output: WarrantyTicket
    side_effects: ["status RESOLVED->CLOSED"]

# ---------------------------------------------------------------------------
# §1.6 Error Code Catalog
# ---------------------------------------------------------------------------
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "missing or invalid X-User-Role / X-User-ID headers"
  - id: ERR_FORBIDDEN_ROLE
    http: 403
    condition: "the role is not permitted for this operation"
  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "entity_backed actor is not the owner/assignee of the resource"
  - id: ERR_RESOURCE_NOT_FOUND
    http: 404
    condition: "a path-referenced resource does not exist"
  - id: ERR_FK_NOT_FOUND
    http: 404
    condition: "an FK body field references a non-existent resource"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "missing required field, bad type/enum, or window_end_minute <= window_start_minute"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "resource is not in a state from which the requested transition is defined"
  - id: ERR_STALE_JOB_VERSION
    http: 412
    condition: "expected_install_job_version does not match InstallJob.version (OCC)"
  - id: ERR_COMPLIANCE_NOT_CLEARED
    http: 409
    condition: "completing install while InstallJob.compliance_status != CLEARED"
  - id: ERR_PANEL_UPGRADE_REQUIRED
    http: 409
    condition: "filing a permit while the job requires a panel upgrade (compliance BLOCKED)"
  - id: ERR_ELECTRICIAN_OUT_OF_TERRITORY
    http: 422
    condition: "electrician's license_state_code != property's state_code at booking"
  - id: ERR_TERRITORY_MISMATCH
    http: 422
    condition: "interconnection utility_territory_code != property's utility_territory_code at approval"
  - id: ERR_WINDOW_OVERLAP
    http: 409
    condition: "booking window overlaps another non-cancelled assignment for the same electrician on the same day"
  - id: ERR_DAILY_CAPACITY_EXCEEDED
    http: 409
    condition: "electrician already at max_daily_jobs BOOKED+EN_ROUTE on window_date"
  - id: ERR_CIRCUIT_EXCEEDS_PANEL
    http: 422
    condition: "scoped charger's required_circuit_amps exceeds the property's panel capacity band"
  - id: ERR_INCENTIVE_FULLY_ABSORBED
    http: 422
    condition: "a UTILITY_REBATE claim's clamped award computes to 0 under the stacking cap"
  - id: ERR_ELECTRICIAN_SUSPENDED
    http: 409
    condition: "booking an electrician whose status == SUSPENDED"
  - id: ERR_PERMIT_REJECTED_FINAL
    http: 409
    condition: "resubmitting/acting on a permit already in terminal REJECTED state"
  - id: ERR_REOPEN_LIMIT_REACHED
    http: 409
    condition: "reopening a warranty ticket already reopened 2 times"
  - id: ERR_JOB_NOT_ACTIVATED
    http: 409
    condition: "opening a warranty ticket or submitting an incentive claim before the job reached ACTIVATED/CLOSED"
  - id: ERR_OPEN_WARRANTY_BLOCKS_CLOSE
    http: 409
    condition: "closing a job while a warranty ticket is in OPEN/DIAGNOSING/AWAITING_PARTS"
  - id: ERR_VALIDATION_LIMIT
    http: 422
    condition: "numeric input out of declared bounds (e.g., main_breaker_amps not in {100,150,200}, window minute out of range)"

# ---------------------------------------------------------------------------
# §1.7 RBAC Matrix
# ---------------------------------------------------------------------------
roles:
  - name: Homeowner
    description: "The property owner who requests installs, accepts/rejects quotes, activates the charger, manages panel-upgrade referrals and warranty tickets."
    identity: "entity_backed:Homeowner"
    exclusive_operations:
      - "POST /quotes/{id}/accept"
      - "POST /quotes/{id}/reject"
      - "POST /install-jobs/{id}/activate"
      - "POST /install-jobs/{id}/cancel"
      - "POST /panel-upgrade-referrals/{id}/accept"
      - "POST /panel-upgrade-referrals/{id}/decline"
      - "POST /warranty-tickets"
      - "POST /warranty-tickets/{id}/reopen"
    shared_operations:
      - "POST /homeowners (anonymous register)"
      - "POST /properties"
      - "POST /install-jobs"
      - "GET reads on owned properties/jobs/quotes/assessments/referrals/warranty-tickets"
  - name: Coordinator
    description: "Operations role driving assessments, quotes, permits, interconnection filing, dispatch, incentives, panel-upgrade completion, and job close."
    identity: "opaque"
    exclusive_operations:
      - "POST /site-assessments and /site-assessments/{id}/accept"
      - "POST /quotes, /quotes/{id}/send, /quotes/{id}/revise"
      - "POST /permit-applications and its approve/request-corrections/resubmit"
      - "POST /interconnection-requests (filing)"
      - "POST /dispatch-assignments and /dispatch-assignments/{id}/cancel"
      - "POST /incentive-claims and submit/pay/reverse"
      - "POST /panel-upgrade-referrals/{id}/complete"
      - "POST /install-jobs/{id}/close"
      - "PATCH /install-jobs/{id}/scope"
      - "POST /charger-products, /electricians"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "POST /properties, /install-jobs"
      - "GET reads across all entities"
  - name: Electrician
    description: "The dispatched field technician who departs, completes installs, and performs warranty diagnosis/repair."
    identity: "entity_backed:Electrician"
    exclusive_operations:
      - "POST /dispatch-assignments/{id}/depart"
      - "POST /dispatch-assignments/{id}/complete"
      - "POST /warranty-tickets/{id}/diagnose"
      - "POST /warranty-tickets/{id}/order-parts"
      - "POST /warranty-tickets/{id}/parts-received"
      - "POST /warranty-tickets/{id}/resolve"
    shared_operations:
      - "GET reads on own dispatch assignments, jobs, warranty tickets, electrician record"
  - name: UtilityReviewer
    description: "Utility-side reviewer who advances and decides interconnection requests."
    identity: "opaque"
    exclusive_operations:
      - "POST /interconnection-requests/{id}/start-review"
      - "POST /interconnection-requests/{id}/approve"
      - "POST /interconnection-requests/{id}/deny"
    shared_operations:
      - "GET reads on interconnection requests"
  - name: Anonymous
    description: "Unauthenticated caller permitted only to self-register as a homeowner."
    identity: "opaque"
    exclusive_operations:
      - "POST /homeowners"
    shared_operations: []
