          assert:
            - "CameraPosition.${pos1_id}.signal_loss_db == 2.03 (150 * 1.35 / 100 = 2.025 rounded half-up)"
            - "CameraPosition.${pos2_id}.signal_loss_db == 8.10"
            - "VenueSurvey.${survey_id}.total_signal_loss_db == 10.13 and total_cable_run_feet == 750"
            - "HTTP 200 and VenueSurvey.${survey_id}.status == SUBMITTED (equality with the 10.13 budget is accepted)"
            - "VenueSurvey.${survey_id}.total_power_draw_amps == 40 and power_headroom_amps == 360"

      - name: feed_latency_above_the_ceiling_fails_the_prep_with_http_200
        claim_type: constants_applied
        grounds:
          - entities.DataFeed.fields.latency_ms
          - state_machines.SystemPrep[PENDING -> FAILED]
          - endpoints[POST /broadcast-ops/system-preps/{id}/validate-feed]
        distinguishing_aspect: |
          MAX_FEED_LATENCY_MS is 250 and the comparison is inclusive: a 250 ms feed validates while a
          300 ms feed drives the prep to FAILED. The failure is a legitimate outcome of the transition,
          not a rejection - it must return HTTP 200 with status FAILED, leave feed_validated_at null,
          leave the feed's active_consumer_count at the number of VALIDATED preps only, and leave the
          production unpromoted.
        test_recipe:
          setup:
            - "One TIER_3 production, a 300 ms OFFICIAL_SCORING feed and a 250 ms LIVE_STATS feed, with one PENDING prep bound to each."
          setup_api_calls:
            - call: "POST /broadcast-ops/productions"
              payload: { event_tier: "TIER_3", league_code: "NBL", venue_name: "Riverside Arena", venue_power_capacity_amps: 400, venue_roof_type: "OPEN", venue_curfew_utc: "2026-08-16T06:00:00Z", scheduled_start_utc: "2026-08-15T18:00:00Z", scheduled_end_utc: "2026-08-15T22:00:00Z", labor_budget_total_cents: 2000000 }
              as: ProductionManager
              as_user_id: "pm-001"
              captures: { prod_id: $.data.id }
            - call: "POST /broadcast-ops/data-feeds"
              payload: { provider_code: "GFXNET", feed_kind: "OFFICIAL_SCORING", latency_ms: 300, contract_expiry_utc: "2026-09-01T00:00:00Z" }
              as: TechnicalDirector
              as_user_id: "td-001"
              captures: { slow_feed_id: $.data.id }
            - call: "POST /broadcast-ops/data-feeds"
              payload: { provider_code: "STATSCO", feed_kind: "LIVE_STATS", latency_ms: 250, contract_expiry_utc: "2026-09-01T00:00:00Z" }
              as: TechnicalDirector
              as_user_id: "td-001"
              captures: { fast_feed_id: $.data.id }
            - call: "POST /broadcast-ops/system-preps"
              payload: { production_id: "${prod_id}", data_feed_id: "${slow_feed_id}", system_kind: "GRAPHICS" }
              as: TechnicalDirector
              as_user_id: "td-001"
              captures: { slow_prep_id: $.data.id }
            - call: "POST /broadcast-ops/system-preps"
              payload: { production_id: "${prod_id}", data_feed_id: "${fast_feed_id}", system_kind: "STATS" }
              as: TechnicalDirector
              as_user_id: "td-001"
              captures: { fast_prep_id: $.data.id }
          trigger:
            - call: "POST /broadcast-ops/system-preps/${slow_prep_id}/validate-feed"
              as: TechnicalDirector
              as_user_id: "td-001"
              captures: { slow_status: $.data.status }
            - call: "POST /broadcast-ops/system-preps/${fast_prep_id}/validate-feed"
              as: TechnicalDirector
              as_user_id: "td-001"
              captures: { fast_status: $.data.status }
          assert:
            - "First call: HTTP 200 with SystemPrep.${slow_prep_id}.status == FAILED and feed_validated_at == null"
            - "DataFeed.${slow_feed_id}.active_consumer_count == 0 (a FAILED prep is not a consumer)"
            - "Second call: HTTP 200 with SystemPrep.${fast_prep_id}.status == VALIDATED (250 <= 250 is accepted) and feed_validated_at == 2026-08-01T00:00:00.000Z"
            - "DataFeed.${fast_feed_id}.active_consumer_count == 1"
            - "Production.${prod_id}.status is still PLANNED and readiness_score_certified == 20.00 (the one VALIDATED prep meets required_validated_preps == 1 but there is no approved survey, no primary booking and no crew)"
            - "GET /broadcast-ops/system-preps?production_id=${prod_id}&status=FAILED returns total_count == 1"

      - name: declined_crew_call_is_excluded_from_labor_and_readiness_input_sets
        claim_type: input_set_filtering
        grounds:
          - calculations.production_labor_commitment
          - calculations.production_readiness_score
          - state_machines.CrewCall[OFFERED -> DECLINED]
        distinguishing_aspect: |
          Both aggregates read the same CrewCall table through different status filters. After one of
          two members declines, labor_committed_cents must count the surviving OFFERED call only
          (104000, not 208000) and the crew numerator must fall to 1 of 2, giving a preflight crew
          component of 7.50 - not 15.00 and not 0.00. The declined row is still returned by the
          listing, so "excluded from the aggregate" is not "deleted".
        test_recipe:
          setup:
            - "One TIER_3 production and two STAFF members certified TIER_3 at 9000 cents/hour, each holding an OFFERED 10-hour call."
          setup_api_calls:
            - call: "POST /broadcast-ops/productions"
              payload: { event_tier: "TIER_3", league_code: "NBL", venue_name: "Riverside Arena", venue_power_capacity_amps: 400, venue_roof_type: "OPEN", venue_curfew_utc: "2026-08-16T06:00:00Z", scheduled_start_utc: "2026-08-15T18:00:00Z", scheduled_end_utc: "2026-08-15T22:00:00Z", labor_budget_total_cents: 2000000 }
              as: ProductionManager
              as_user_id: "pm-001"
              captures: { prod_id: $.data.id, pv1: $.data.version }
            - call: "POST /broadcast-ops/crew-members"
              payload: { full_name: "Dana Reyes", position: "TD", employment_type: "STAFF", union_local: "L600", certified_tiers: ["TIER_3"], hourly_rate_cents: 9000, home_base_code: "SEA" }
              as: ProductionManager
              as_user_id: "pm-001"
              captures: { cm1_id: $.data.id }
            - call: "POST /broadcast-ops/crew-members"
              payload: { full_name: "Milo Fisk", position: "CAM_OP", employment_type: "STAFF", union_local: "L600", certified_tiers: ["TIER_3"], hourly_rate_cents: 9000, home_base_code: "SEA" }
              as: ProductionManager
              as_user_id: "pm-001"
              captures: { cm2_id: $.data.id }
            - call: "POST /broadcast-ops/crew-calls"
              payload: { production_id: "${prod_id}", crew_member_id: "${cm1_id}", call_time_utc: "2026-08-15T14:00:00Z", scheduled_release_utc: "2026-08-16T00:00:00Z", expected_production_version: "${pv1}" }
              as: ProductionManager
              as_user_id: "pm-001"
              captures: { call1_id: $.data.id }
            - call: "GET /broadcast-ops/productions/${prod_id}"
              as: ProductionManager
              as_user_id: "pm-001"
              captures: { pv2: $.data.version }
            - call: "POST /broadcast-ops/crew-calls"
              payload: { production_id: "${prod_id}", crew_member_id: "${cm2_id}", call_time_utc: "2026-08-15T14:00:00Z", scheduled_release_utc: "2026-08-16T00:00:00Z", expected_production_version: "${pv2}" }
              as: ProductionManager
              as_user_id: "pm-001"
              captures: { call2_id: $.data.id }
          trigger:
            - call: "POST /broadcast-ops/crew-calls/${call2_id}/respond"
              payload: { decision: "DECLINE" }
              as: CrewMember
              as_user_id: "${cm2_id}"
              captures: { cstat: $.data.status }
          assert:
            - "Before the trigger: Production.${prod_id}.labor_committed_cents == 208000, labor_available_cents == 1792000, readiness_score_preflight == 15.00"
            - "CrewCall.${call2_id}.status == DECLINED with provisional_total_cents still recorded as 104000 on the row"
            - "After the trigger: Production.${prod_id}.labor_committed_cents == 104000 and labor_available_cents == 1896000"
            - "Production.${prod_id}.readiness_score_preflight == 7.50 (15 * 1/2) and readiness_score_certified == 0.00 (no call is ACCEPTED)"
            - "GET /broadcast-ops/crew-calls?production_id=${prod_id} still returns total_count == 2; with status=DECLINED, total_count == 1"

      - name: crew_call_overtime_and_double_time_bands
        claim_type: tiered_pricing
        grounds:
          - calculations.crew_call_labor_cost
        excluded_because:
          difficulty_instance: combinatorial_formula / crew_call_double_time_band_crossing_nonlinear_rate_selection
          rationale: "That instance prices a 780-minute call across all three bands (600 straight + 120 at 1.5x + 60 at 2.0x) and asserts the exact 149000-cent provisional total, covering both the tier boundaries and the marginal-versus-average rate distinction."

      - name: readiness_weight_composition_and_rounding
        claim_type: weighted_scoring
        grounds:
          - calculations.production_readiness_score
        excluded_because:
          difficulty_instance: dual_variant_calc / production_readiness_preflight_versus_certified_diverge
          rationale: "That instance asserts both variants on identical data (47.50 preflight versus 0.00 certified, then 100.00 versus 92.50), which exercises the 40/25/20/15 weights, the min(1, n/required) crew fraction and its 2dp rounding."

      - name: settlement_bucket_order_and_remainder
        claim_type: waterfall_allocation
        grounds:
          - calculations.production_settlement
        excluded_because:
          difficulty_instance: combinatorial_formula / settlement_overrun_bracket_keyed_on_labor_subtotal_not_total
          rationale: "That instance asserts the pinned four-step order - labor subtotal 480000, bracket keyed on that subtotal (1200/minute, not the 1800 the 504000 total would imply), overrun fee 24000, total 504000 and variance -28000."

      - name: path_bandwidth_running_total
        claim_type: aggregation
        grounds:
          - calculations.path_committed_mbps_total
        excluded_because:
          difficulty_instance: compensating_invariant / path_booking_release_restores_committed_bandwidth_exactly
          rationale: "That instance asserts committed_mbps_total after each add (120, then 200) and after the reversal (80, then 0), which is the running-total-then-reversal claim for this aggregation."

      - name: turnaround_reference_selection_is_order_independent
        claim_type: chronological
        grounds:
          - calculations.crew_turnaround_reference
        excluded_because:
          difficulty_instance: resource_temporal_overlap / crew_member_turnaround_directional_gap_from_latest_reference_release
          rationale: "That instance creates candidate calls out of chronological order and asserts the selector still picks the latest reference_release (using actual_release_utc for the RELEASED call and scheduled_release_utc otherwise), including the 599 / 600 minute boundary."

      - name: meal_window_threshold_split
        claim_type: threshold_boundary
        grounds:
          - calculations.crew_call_labor_cost.constants.MEAL_WINDOW_MINUTES
        excluded_because:
          difficulty_instance: boundary_precision_check / worked_minutes_at_exactly_360_versus_361_meal_window
          rationale: "That instance asserts 360 worked minutes yields 0 penalty units (54000 cents) while 361 yields 1 unit (57650 cents), covering threshold, threshold+1 and the ceil() increment."

      - name: satellite_guard_band_interval_geometry
        claim_type: interval_merge
        grounds:
          - calculations.path_window_load_mbps
        excluded_because:
          difficulty_instance: resource_temporal_overlap / satellite_transponder_exclusive_window_with_symmetric_guard_band
          rationale: "That instance asserts a 9-minute gap is refused and a 10-minute gap (exactly guard_band_minutes) is accepted on the same transponder, which is the adjacency/gap-zero claim for this geometry."

  # ===========================================================================
  - section: validations
    instances:
      - name: venue_power_headroom_enforced_from_both_directions
        claim_type: violation_to_error
        grounds:
          - validations[priority=42]
          - errors[ERR_VENUE_POWER_INSUFFICIENT]
          - calculations.survey_signal_loss_budget
        distinguishing_aspect: |
          The same 400 A venue budget is policed at two different endpoints with two different
          summands: submit rejects a plot whose own draw exceeds the venue (410 > 400, headroom -10),
          while truck-assignment rejects a truck whose draw plus the APPROVED plot's draw exceeds it
          (60 + 360 = 420 > 400) even though each figure alone is legal. Both raise
          ERR_VENUE_POWER_INSUFFICIENT, so an implementation that checks only the survey side passes
          the first assert and fails the second.
        test_recipe:
          setup:
            - "Production A with a 410 A plot still in DRAFT; production B with an APPROVED 360 A plot; one 60 A TIER_3 truck."
          setup_api_calls:
            - call: "POST /broadcast-ops/productions"
              payload: { event_tier: "TIER_3", league_code: "NBL", venue_name: "Riverside Arena", venue_power_capacity_amps: 400, venue_roof_type: "OPEN", venue_curfew_utc: "2026-08-16T06:00:00Z", scheduled_start_utc: "2026-08-15T18:00:00Z", scheduled_end_utc: "2026-08-15T22:00:00Z", labor_budget_total_cents: 2000000 }
              as: ProductionManager
              as_user_id: "pm-001"
              captures: { prod_a: $.data.id }
            - call: "POST /broadcast-ops/productions"
              payload: { event_tier: "TIER_3", league_code: "NBL", venue_name: "Harbor Dome", venue_power_capacity_amps: 400, venue_roof_type: "DOMED", venue_curfew_utc: "2026-08-20T06:00:00Z", scheduled_start_utc: "2026-08-19T18:00:00Z", scheduled_end_utc: "2026-08-19T22:00:00Z", labor_budget_total_cents: 2000000 }
              as: ProductionManager
              as_user_id: "pm-001"
              captures: { prod_b: $.data.id }
            - call: "POST /broadcast-ops/trucks"
              payload: { truck_code: "TRK-01", tier_rating: "TIER_3", camera_channel_capacity: 4, power_draw_amps: 60, home_base_code: "SEA" }
              as: ProductionManager
              as_user_id: "pm-001"
              captures: { truck_id: $.data.id }
            - call: "POST /broadcast-ops/venue-surveys"
              payload: { production_id: "${prod_a}", surveyor_name: "R. Ito", fiber_drops_required: 2 }
              as: TechnicalDirector
              as_user_id: "td-001"
              captures: { survey_a: $.data.id }
            - call: "POST /broadcast-ops/venue-surveys/${survey_a}/camera-positions"
              payload: { label: "HIGH_HOME", position_type: "HARD", cable_run_feet: 100, power_draw_amps: 200 }
              as: TechnicalDirector
              as_user_id: "td-001"
            - call: "POST /broadcast-ops/venue-surveys/${survey_a}/camera-positions"
              payload: { label: "LOW_HOME", position_type: "HARD", cable_run_feet: 100, power_draw_amps: 210 }
              as: TechnicalDirector
              as_user_id: "td-001"
            - call: "POST /broadcast-ops/venue-surveys"
              payload: { production_id: "${prod_b}", surveyor_name: "R. Ito", fiber_drops_required: 2 }
              as: TechnicalDirector
              as_user_id: "td-001"
              captures: { survey_b: $.data.id }
            - call: "POST /broadcast-ops/venue-surveys/${survey_b}/camera-positions"
              payload: { label: "HIGH_HOME", position_type: "HARD", cable_run_feet: 100, power_draw_amps: 180 }
              as: TechnicalDirector
              as_user_id: "td-001"
            - call: "POST /broadcast-ops/venue-surveys/${survey_b}/camera-positions"
              payload: { label: "SLASH_LEFT", position_type: "HARD", cable_run_feet: 100, power_draw_amps: 180 }
              as: TechnicalDirector
              as_user_id: "td-001"
            - call: "POST /broadcast-ops/venue-surveys/${survey_b}/submit"
              as: TechnicalDirector
              as_user_id: "td-001"
            - call: "POST /broadcast-ops/venue-surveys/${survey_b}/review"
              payload: { decision: "APPROVE" }
              as: LeagueOperations
              as_user_id: "lo-001"
            - call: "GET /broadcast-ops/productions/${prod_b}"
              as: ProductionManager
              as_user_id: "pm-001"
              captures: { pvb: $.data.version }
          trigger:
            - call: "POST /broadcast-ops/venue-surveys/${survey_a}/submit"
              as: TechnicalDirector
              as_user_id: "td-001"
              captures: { err1: $.data.error_id }
            - call: "POST /broadcast-ops/productions/${prod_b}/truck-assignment"
              payload: { truck_id: "${truck_id}", expected_production_version: "${pvb}" }
              as: ProductionManager
              as_user_id: "pm-001"
              captures: { err2: $.data.error_id }
          assert:
            - "VenueSurvey.${survey_a}.total_power_draw_amps == 410 and power_headroom_amps == -10"
            - "Submit on survey A returns HTTP 422 with error_id == ERR_VENUE_POWER_INSUFFICIENT and the survey stays DRAFT"
            - "VenueSurvey.${survey_b}.total_power_draw_amps == 360, power_headroom_amps == 40, status == APPROVED"
            - "Truck assignment on production B returns HTTP 422 with error_id == ERR_VENUE_POWER_INSUFFICIENT"
            - "Production.${prod_b}.truck_id == null, status is still SURVEYED, version == ${pvb}; ProductionTruck.${truck_id}.status is still AVAILABLE"

      - name: truck_tier_rating_must_cover_the_event_tier
        claim_type: violation_to_error
        grounds:
          - validations[priority=43]
          - errors[ERR_TRUCK_TIER_INSUFFICIENT]
        distinguishing_aspect: |
          TIER_ORDER is {TIER_1: 1, TIER_2: 2, TIER_3: 3} and the rule is
          TIER_ORDER[truck] <= TIER_ORDER[event], so the *smaller* number is the bigger truck: a
          TIER_3 truck cannot cover a TIER_1 event, while a TIER_1 truck may cover a TIER_3 one. An
          implementation that compares the enum strings, or that inverts the direction, fails exactly
          one of the two asserts.
        test_recipe:
          setup:
            - "One TIER_1 production and one TIER_3 production, neither surveyed (so the power and channel rules do not apply); one TIER_3 truck and one TIER_1 truck."
          setup_api_calls:
            - call: "POST /broadcast-ops/productions"
              payload: { event_tier: "TIER_1", league_code: "NBL", venue_name: "Grand Coliseum", venue_power_capacity_amps: 1200, venue_roof_type: "OPEN", venue_curfew_utc: "2026-08-16T06:00:00Z", scheduled_start_utc: "2026-08-15T18:00:00Z", scheduled_end_utc: "2026-08-15T22:00:00Z", labor_budget_total_cents: 9000000 }
              as: ProductionManager
              as_user_id: "pm-001"
              captures: { big_prod: $.data.id, bpv: $.data.version }
            - call: "POST /broadcast-ops/productions"
              payload: { event_tier: "TIER_3", league_code: "NBL", venue_name: "Riverside Arena", venue_power_capacity_amps: 400, venue_roof_type: "OPEN", venue_curfew_utc: "2026-08-20T06:00:00Z", scheduled_start_utc: "2026-08-19T18:00:00Z", scheduled_end_utc: "2026-08-19T22:00:00Z", labor_budget_total_cents: 2000000 }
              as: ProductionManager
              as_user_id: "pm-001"
              captures: { small_prod: $.data.id, spv: $.data.version }
            - call: "POST /broadcast-ops/trucks"
              payload: { truck_code: "TRK-03", tier_rating: "TIER_3", camera_channel_capacity: 4, power_draw_amps: 60, home_base_code: "SEA" }
              as: ProductionManager
              as_user_id: "pm-001"
              captures: { small_truck: $.data.id }
            - call: "POST /broadcast-ops/trucks"
              payload: { truck_code: "TRK-01", tier_rating: "TIER_1", camera_channel_capacity: 24, power_draw_amps: 200, home_base_code: "ATL" }
              as: ProductionManager
              as_user_id: "pm-001"
              captures: { big_truck: $.data.id }
          trigger:
            - call: "POST /broadcast-ops/productions/${big_prod}/truck-assignment"
              payload: { truck_id: "${small_truck}", expected_production_version: "${bpv}" }
              as: ProductionManager
              as_user_id: "pm-001"
              captures: { err: $.data.error_id }
            - call: "POST /broadcast-ops/productions/${small_prod}/truck-assignment"
              payload: { truck_id: "${big_truck}", expected_production_version: "${spv}" }
              as: ProductionManager
              as_user_id: "pm-001"
              captures: { assigned_truck: $.data.truck_id }
          assert:
            - "TIER_3 truck on the TIER_1 event: HTTP 422 with error_id == ERR_TRUCK_TIER_INSUFFICIENT; Production.${big_prod}.truck_id == null and ProductionTruck.${small_truck}.status == AVAILABLE"
            - "TIER_1 truck on the TIER_3 event: HTTP 200 with Production.${small_prod}.truck_id == ${big_truck} and ProductionTruck.${big_truck}.status == ASSIGNED"
            - "Production.${small_prod}.status is still PLANNED (no approved survey, so provisioning cannot promote it) and readiness_score_certified == 0.00"

      - name: approved_plot_must_fit_the_trucks_camera_channels
        claim_type: violation_to_error
        grounds:
          - validations[priority=44]
          - errors[ERR_TRUCK_CHANNEL_CAPACITY_EXCEEDED]
        distinguishing_aspect: |
          Five approved camera positions do not fit a 4-channel truck but do fit a 5-channel one -
          equality is accepted. The comparison uses the APPROVED survey's camera_position_count, so
          the power rule at priority 42 must pass first (60 + 100 <= 400) for this rule to be the one
          that speaks.
        test_recipe:
          setup:
            - "One TIER_3 production with an APPROVED five-position plot (5 x 100 ft, 20 A each) and two trucks of 4 and 5 camera channels."
          setup_api_calls:
            - call: "POST /broadcast-ops/productions"
              payload: { event_tier: "TIER_3", league_code: "NBL", venue_name: "Riverside Arena", venue_power_capacity_amps: 400, venue_roof_type: "OPEN", venue_curfew_utc: "2026-08-16T06:00:00Z", scheduled_start_utc: "2026-08-15T18:00:00Z", scheduled_end_utc: "2026-08-15T22:00:00Z", labor_budget_total_cents: 2000000 }
              as: ProductionManager
              as_user_id: "pm-001"
              captures: { prod_id: $.data.id }
            - call: "POST /broadcast-ops/trucks"
              payload: { truck_code: "TRK-04", tier_rating: "TIER_3", camera_channel_capacity: 4, power_draw_amps: 60, home_base_code: "SEA" }
              as: ProductionManager
              as_user_id: "pm-001"
              captures: { truck4: $.data.id }
            - call: "POST /broadcast-ops/trucks"
              payload: { truck_code: "TRK-05", tier_rating: "TIER_3", camera_channel_capacity: 5, power_draw_amps: 60, home_base_code: "SEA" }
              as: ProductionManager
              as_user_id: "pm-001"
