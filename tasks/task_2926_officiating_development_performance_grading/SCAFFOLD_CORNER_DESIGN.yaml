              payload: {}
              as: CrewScheduler
              captures: { nf_assignment: $.data.error_id }
            - call: "GET /play-grades/ffffffff-ffff-ffff-ffff-ffffffffffff"
              payload: {}
              as: GradingSupervisor
              captures: { nf_grade: $.data.error_id }
            - call: "GET /grade-appeals/ffffffff-ffff-ffff-ffff-ffffffffffff"
              payload: {}
              as: GradingSupervisor
              captures: { nf_appeal: $.data.error_id }
            - call: "GET /replay-stations/ffffffff-ffff-ffff-ffff-ffffffffffff"
              payload: {}
              as: ReplayOfficial
              captures: { nf_station: $.data.error_id }
            - call: "GET /replay-reviews/ffffffff-ffff-ffff-ffff-ffffffffffff"
              payload: {}
              as: ReplayOfficial
              captures: { nf_review: $.data.error_id }
            - call: "GET /pool-reports/ffffffff-ffff-ffff-ffff-ffffffffffff"
              payload: {}
              as: CommunicationsOfficer
              captures: { nf_report: $.data.error_id }
            - call: "GET /discipline-actions/ffffffff-ffff-ffff-ffff-ffffffffffff"
              payload: {}
              as: OfficiatingDirector
              captures: { nf_discipline: $.data.error_id }
            - call: "POST /officials"
              payload: { season_program_id: "ffffffff-ffff-ffff-ffff-ffffffffffff", full_name: "Orphan", position: "UMPIRE", seasons_experience: 2, home_market_code: "PHI" }
              as: OfficiatingDirector
              captures: { nf_program_body: $.data.error_id }
          assert:
            - "${nf_program} == ERR_SEASON_PROGRAM_NOT_FOUND, ${nf_official} == ERR_OFFICIAL_NOT_FOUND, ${nf_application} == ERR_APPLICATION_NOT_FOUND, ${nf_game} == ERR_GAME_NOT_FOUND"
            - "${nf_assignment} == ERR_ASSIGNMENT_NOT_FOUND, ${nf_grade} == ERR_PLAY_GRADE_NOT_FOUND, ${nf_appeal} == ERR_APPEAL_NOT_FOUND, ${nf_station} == ERR_REPLAY_STATION_NOT_FOUND"
            - "${nf_review} == ERR_REPLAY_REVIEW_NOT_FOUND, ${nf_report} == ERR_POOL_REPORT_NOT_FOUND, ${nf_discipline} == ERR_DISCIPLINE_ACTION_NOT_FOUND"
            - "every one of those calls returns HTTP 404 with the standard error envelope: error_id, message and meta"
            - "${nf_program_body} == ERR_SEASON_PROGRAM_NOT_FOUND — an unresolvable FK in the body yields the same code as an unresolvable path id"

      - name: body_ids_are_resolved_in_the_declared_input_order
        claim_type: error_ordering
        grounds:
          - validations[priority=4]
          - endpoints[POST /crew-assignments]
          - endpoints[POST /pool-reports]
        distinguishing_aspect: "When two FKs in one body are both unresolvable, priority 4 checks them in the endpoint's declared input order, so POST /crew-assignments reports ERR_GAME_NOT_FOUND (game_id precedes official_id) and POST /pool-reports reports ERR_GAME_NOT_FOUND before the play_grade_id and supersedes_id checks."
        test_recipe:
          setup:
            - "SeasonProgram 2026 is OPEN with crew_size_required 1 and a valid game G1 exists."
            - "Dan is ACTIVE and preseason-cleared."
          setup_api_calls:
            - *k_clock
            - *k_prog1
            - *k_open
            - *k_off_dan
            - *k_dan_exam
            - *k_dan_phys
            - *k_game
          trigger:
            - call: "POST /crew-assignments"
              payload: { game_id: "ffffffff-ffff-ffff-ffff-ffffffffffff", official_id: "ffffffff-ffff-ffff-ffff-ffffffffffff", position: "UMPIRE", expected_game_version: "${g_v0}" }
              as: CrewScheduler
              captures: { ord_both_bad: $.data.error_id }
            - call: "POST /crew-assignments"
              payload: { game_id: "${g_id}", official_id: "ffffffff-ffff-ffff-ffff-ffffffffffff", position: "UMPIRE", expected_game_version: "${g_v0}" }
              as: CrewScheduler
              captures: { ord_official_bad: $.data.error_id }
            - call: "POST /pool-reports"
              payload: { game_id: "ffffffff-ffff-ffff-ffff-ffffffffffff", play_grade_id: "ffffffff-ffff-ffff-ffff-ffffffffffff", report_type: "POOL_REPORT", body: "Nothing resolves here." }
              as: CommunicationsOfficer
              captures: { ord_report_bad: $.data.error_id }
            - call: "POST /crew-assignments"
              payload: { game_id: "ffffffff-ffff-ffff-ffff-ffffffffffff", official_id: "${dan_id}", position: "NOT_A_POSITION", expected_game_version: "${g_v0}" }
              as: CrewScheduler
              captures: { ord_shape_first: $.data.error_id }
          assert:
            - "${ord_both_bad} == ERR_GAME_NOT_FOUND — game_id comes first in the declared input list, so the official is never looked up"
            - "${ord_official_bad} == ERR_OFFICIAL_NOT_FOUND once game_id resolves, proving the ordering rather than a hardcoded code"
            - "${ord_report_bad} == ERR_GAME_NOT_FOUND for the same reason on a different endpoint"
            - "${ord_shape_first} == ERR_INVALID_REQUEST with HTTP 400 — shape priority 3 outranks existence priority 4 even when the id is also unresolvable"

      - name: residual_state_and_staffing_guards_are_each_triggerable
        claim_type: error_triggerable
        grounds:
          - errors[ERR_CREW_NOT_STAFFED]
          - errors[ERR_REPORT_STATE_INVALID]
          - errors[ERR_DISCIPLINE_STATE_INVALID]
          - validations[priority=21]
          - validations[priority=8]
        distinguishing_aspect: "Three otherwise-unexercised codes are reached on one fixture: kickoff while crew_posture is UNDERSTAFFED, a second publish on an already PUBLISHED pool report, and assign-remediation on a CLEARED discipline action."
        test_recipe:
          setup:
            - "SeasonProgram 2026 is OPEN with crew_size_required 1."
            - "Dan is ACTIVE and preseason-cleared; game G1 is SCHEDULED with no crew yet."
          setup_api_calls:
            - *k_clock
            - *k_prog1
