  - section: errors
    instances:
      - name: error_hold_expired_on_late_confirm
        claim_type: violation_to_error
        grounds: [state_machines.Reservation.HELD_to_CONFIRMED, "errors[ERR_HOLD_EXPIRED]"]
        distinguishing_aspect: "A HELD reservation confirmed after hold_expires_at (creation + 72h, evaluated against the logical clock WITHOUT any ops run) fails ERR_HOLD_EXPIRED — the hold lapses lazily at confirm time."
        test_recipe:
          setup: ["RC; item+unit; renter ACTIVE; production CONFIRMED; reservation created at default clock 2026-08-01T00:00:00Z (hold expires 2026-08-04T00:00:00Z); clock advanced to 2026-08-04T00:00:01Z"]
          setup_api_calls:
            - { call: "POST /rental-house/rate-cards", payload: { name: "RC-2026", long_run_threshold_weeks: 8, long_run_discount_pct: 0.20, deep_run_threshold_weeks: 16, deep_run_discount_pct: 0.30, late_fee_daily_pct: 0.10 }, as: HouseAdmin }
            - { call: "POST /rental-house/items", payload: { name: "I1", period: VICTORIAN, category: COSTUME, size_class: M, alteration_policy: TAILORING_ALLOWED, replacement_value_cents: 100000, base_daily_rate_cents: 1000, base_weekly_rate_cents: 5000 }, as: HouseAdmin, captures: { item_id: $.data.id } }
            - { call: "POST /rental-house/items/${item_id}/units", payload: { barcode: "BC-H1", condition_grade: B, acquisition_date: "2025-01-15", acquisition_cost_cents: 40000 }, as: HouseAdmin }
            - { call: "POST /rental-house/renters", payload: { name: "R", renter_type: THEATRE, credit_limit_cents: 10000000 }, as: HouseAdmin, captures: { r_id: $.data.id } }
            - { call: "POST /rental-house/renters/${r_id}/insurance-certificates", payload: { insurer_name: "InsCo", policy_number: "PH-1", coverage_cents: 600000, effective_date: "2026-01-01", expiry_date: "2027-06-30" }, as: HouseAdmin, captures: { cert: $.data.id } }
            - { call: "POST /rental-house/insurance-certificates/${cert}/decide", payload: { decision: VERIFIED }, as: HouseAdmin }
            - { call: "POST /rental-house/productions", payload: { renter_id: "${r_id}", title: "P", rehearsal_start_date: "2026-08-10", performance_start_date: "2026-09-01", closing_date: "2026-10-26" }, as: RenterContact, as_user_id: "${r_id}", captures: { p_id: $.data.id } }
            - { call: "POST /rental-house/productions/${p_id}/confirm", payload: {}, as: RenterContact, as_user_id: "${r_id}", captures: { p_v: $.data.version } }
            - { call: "POST /rental-house/reservations", payload: { production_id: "${p_id}", item_id: "${item_id}", quantity: 1, window_start_date: "2026-09-01", window_end_date: "2026-09-10", expected_production_version: "${p_v}" }, as: RenterContact, as_user_id: "${r_id}", captures: { r1: $.data.id, exp: $.data.hold_expires_at } }
            - { call: "POST /rental-house/_clock/set_current_utc", payload: { to_iso8601: "2026-08-04T00:00:01Z" }, as: HouseAdmin }
          trigger:
            - { call: "POST /rental-house/reservations/${r1}/confirm", payload: {}, as: RenterContact, as_user_id: "${r_id}", captures: { err: $.data.error_id } }
          assert:
            - "hold_expires_at == 2026-08-04T00:00:00Z (72h after creation at the default clock)"
            - "Confirm at 2026-08-04T00:00:01Z: error_id == ERR_HOLD_EXPIRED (409); reservation still HELD (no ops run happened)"

      - name: error_insurance_not_verified_at_confirm
        claim_type: violation_to_error
        grounds: [state_machines.Production.DRAFT_to_CONFIRMED, "errors[ERR_INSURANCE_NOT_VERIFIED]"]
        distinguishing_aspect: "Production confirm requires a VERIFIED certificate whose expiry_date covers return_by_date: a cert expiring 2026-09-01 cannot confirm a production whose return_by is 2026-09-23."
        test_recipe:
          setup: ["renter ACTIVE via cert expiring 2026-09-01 (coverage 100000 >= THEATRE min); short-run production DRAFT (closing 2026-09-20, return_by 2026-09-23)"]
          setup_api_calls:
            - { call: "POST /rental-house/rate-cards", payload: { name: "RC-2026", long_run_threshold_weeks: 8, long_run_discount_pct: 0.20, deep_run_threshold_weeks: 16, deep_run_discount_pct: 0.30, late_fee_daily_pct: 0.10 }, as: HouseAdmin }
            - { call: "POST /rental-house/renters", payload: { name: "R", renter_type: THEATRE, credit_limit_cents: 10000000 }, as: HouseAdmin, captures: { r_id: $.data.id } }
            - { call: "POST /rental-house/renters/${r_id}/insurance-certificates", payload: { insurer_name: "InsCo", policy_number: "PI-1", coverage_cents: 100000, effective_date: "2026-01-01", expiry_date: "2026-09-01" }, as: HouseAdmin, captures: { cert: $.data.id } }
            - { call: "POST /rental-house/insurance-certificates/${cert}/decide", payload: { decision: VERIFIED }, as: HouseAdmin }
            - { call: "POST /rental-house/productions", payload: { renter_id: "${r_id}", title: "P", rehearsal_start_date: "2026-08-10", performance_start_date: "2026-09-01", closing_date: "2026-09-20" }, as: RenterContact, as_user_id: "${r_id}", captures: { p_id: $.data.id } }
          trigger:
            - { call: "POST /rental-house/productions/${p_id}/confirm", payload: {}, as: RenterContact, as_user_id: "${r_id}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INSURANCE_NOT_VERIFIED (422); production stays DRAFT"

      - name: error_insufficient_coverage_and_minimum_boundary
        claim_type: violation_to_error
        grounds: [state_machines.InsuranceCertificate.SUBMITTED_to_VERIFIED, "errors[ERR_INSUFFICIENT_COVERAGE]"]
        distinguishing_aspect: "Renter-type minimum uses >= semantics: INDIVIDUAL cert at 49999 fails ERR_INSUFFICIENT_COVERAGE while 50000 (== minimum) verifies and flips the renter ACTIVE."
        test_recipe:
          setup: ["INDIVIDUAL renter; two certificates 49999 and 50000"]
          setup_api_calls:
            - { call: "POST /rental-house/renters", payload: { name: "R", renter_type: INDIVIDUAL, credit_limit_cents: 10000000 }, as: HouseAdmin, captures: { r_id: $.data.id } }
            - { call: "POST /rental-house/renters/${r_id}/insurance-certificates", payload: { insurer_name: "InsCo", policy_number: "PU-1", coverage_cents: 49999, effective_date: "2026-01-01", expiry_date: "2027-06-30" }, as: HouseAdmin, captures: { c_low: $.data.id } }
            - { call: "POST /rental-house/renters/${r_id}/insurance-certificates", payload: { insurer_name: "InsCo", policy_number: "PU-2", coverage_cents: 50000, effective_date: "2026-01-01", expiry_date: "2027-06-30" }, as: HouseAdmin, captures: { c_ok: $.data.id } }
          trigger:
            - { call: "POST /rental-house/insurance-certificates/${c_low}/decide", payload: { decision: VERIFIED }, as: HouseAdmin, captures: { err: $.data.error_id } }
            - { call: "POST /rental-house/insurance-certificates/${c_ok}/decide", payload: { decision: VERIFIED }, as: HouseAdmin, captures: { ok: $.data.status } }
            - { call: "GET /rental-house/renters/${r_id}", payload: {}, as: HouseAdmin, captures: { r_st: $.data.status } }
          assert:
            - "49999: error_id == ERR_INSUFFICIENT_COVERAGE (422), cert stays SUBMITTED"
            - "50000 (== minimum): VERIFIED; renter becomes ACTIVE"

      - name: error_certificate_expired_at_verify
        claim_type: violation_to_error
        grounds: [state_machines.InsuranceCertificate.SUBMITTED_to_VERIFIED, "errors[ERR_CERTIFICATE_EXPIRED]"]
        distinguishing_aspect: "Verifying a certificate whose expiry_date (2026-07-01) is already before the current logical date (default 2026-08-01) fails ERR_CERTIFICATE_EXPIRED even with sufficient coverage."
        test_recipe:
