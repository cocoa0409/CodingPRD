          assert:
            - "the first ACTIVATE_PERMIT returns 409 with error_id ERR_INVALID_STATE_TRANSITION"
            - "ServiceZone.${z}.permit_state == PROVISIONED and ServiceZone.${z}.version == 1 after the refusal"
            - "the APPROVE returns 200 and SidewalkSegment.${s1}.status == APPROVED"
            - "the second ACTIVATE_PERMIT returns 200 and ServiceZone.${z}.permit_state == PERMITTED"
            - "ServiceZone.${z}.version == 2, proving the refused call wrote nothing"
      - name: segment_retire_and_approve_from_mapped_are_invalid
        claim_type: invalid_transitions
        grounds:
          - "state_machines.SidewalkSegment"
          - "state_machines.SidewalkSegment.SURVEYED_to_RETIRED"
          - "validations[priority=50]"
          - "errors.ERR_INVALID_STATE_TRANSITION"
          - "entities.SidewalkSegment.fields.status"
        distinguishing_aspect: >-
          MAPPED has exactly one outgoing edge, SURVEY, so both RETIRE and APPROVE from MAPPED are 409
          ERR_INVALID_STATE_TRANSITION; the same RETIRE that was refused succeeds after the single SURVEY
          step, which shows the refusal came from the source state rather than from the action being
          unimplemented.
        test_recipe:
          setup:
            - "logical clock at 2026-08-03T09:00:00.000Z"
            - "ServiceZone Z1 PROVISIONED"
            - "SidewalkSegment S1 freshly created, status MAPPED, version 1, crossing_risk_score null"
