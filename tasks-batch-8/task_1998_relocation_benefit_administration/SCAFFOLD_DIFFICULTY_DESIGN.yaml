            - call: "POST /relocation-cases/${case_id}/authorize"
              payload: {}
              as: MobilityCoordinator
            - call: "POST /relocation-cases/${case_id}/start"
              payload: {}
              as: MobilityCoordinator
            - call: "POST /vendors"
              payload: { name: "Loop Logistics", service_regions: ["IL"] }
              as: MobilityCoordinator
              captures: { vendor_id: $.data.id }
            - call: "POST /move-assignments"
              payload: { case_id: "${case_id}", vendor_id: "${vendor_id}" }
              as: MobilityCoordinator
              captures: { ma_id: $.data.id }
            - call: "POST /move-assignments/${ma_id}/schedule-survey"
              payload: { survey_at: "2026-08-10T10:00:00Z" }
              as: MobilityCoordinator
            - call: "POST /move-assignments/${ma_id}/submit-estimate"
              payload: { estimated_cents: 95000 }
              as: Vendor
              as_user_id: "${vendor_id}"
          trigger:
            - call: "POST /move-assignments/${ma_id}/reject-estimate"
              payload: {}
              as: MobilityCoordinator
            - call: "POST /move-assignments/${ma_id}/schedule-survey"
              payload: { survey_at: "2026-08-12T10:00:00Z" }
              as: MobilityCoordinator
            - call: "POST /move-assignments/${ma_id}/submit-estimate"
              payload: { estimated_cents: 88000 }
              as: Vendor
              as_user_id: "${vendor_id}"
            - call: "GET /relocation-cases/${case_id}"
              as: MobilityCoordinator
              captures: { case_v: $.data.version }
            - call: "POST /move-assignments/${ma_id}/approve-estimate"
              payload: { expected_case_version: "${case_v}" }
              as: MobilityCoordinator
          assert:
            - "after reject-estimate: MoveAssignment.${ma_id}.status == REQUESTED, survey_at == null, estimated_cents == null"
            - "after the second loop: MoveAssignment.${ma_id}.status == ESTIMATE_APPROVED, estimated_cents == 88000"
            - "RelocationCase.${case_id}.total_committed_cents == 88000 (only the second estimate is committed; the rejected 95000 never entered the ledger)"

      - name: expense_claim_resubmit_cycle
        grounds:
          - state_machines.ExpenseClaim.REJECTED_to_SUBMITTED
          - state_machines.ExpenseClaim.SUBMITTED_to_REJECTED
        distinguishing_aspect: |
          ExpenseClaim cycles SUBMITTED -> REJECTED -> SUBMITTED on resubmission
          with replacement lines, then proceeds APPROVED -> PAID — a cycle on the
          claims entity, distinct from the MoveAssignment re-survey loop.
        test_recipe:
          setup:
            - "MANAGER/DOMESTIC/RENTER FLAT policy; case IN_PROGRESS; claim submitted with one 60000 line, rejected, then resubmitted with one 45000 line"
          setup_api_calls:
            - call: "POST /policies"
              payload: { job_level: MANAGER, move_scope: DOMESTIC, home_ownership: RENTER, hhg_cap_cents: 500000, temp_housing_cap_cents: 300000, temp_housing_max_nights: 30, travel_cap_cents: 100000, loss_on_sale_cap_cents: 0, misc_cap_cents: 200000, home_sale_eligible: false, repayment_window_months: 24, gross_up_method: FLAT_SUPPLEMENTAL, flat_gross_up_rate: 0.22, marginal_bracket_threshold_cents: 100000, marginal_rate_low: 0.25, marginal_rate_high: 0.4, loss_basis: APPRAISED }
