  # =========================================================================
  # Rule 4 — transitive_cascade  (instance 1 depth 4, instance 2 depth 3,
  #                               different originating transitions)
  # =========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: door_refusal_cascades_through_case_posture_and_a_second_order
        grounds:
          - state_machines.DeliveryAttempt.ID_VERIFIED_to_REFUSED
          - state_machines.DeliveryPartner.posture.OPEN_to_RESTRICTED
          - state_machines.Order.compliance_state.PREVERIFIED_to_PENDING_COMPLIANCE_REVIEW
          - state_machines.Order.fulfillment_state.DISPATCHED_to_HELD_AT_HUB
          - calculations.partner_posture_derivation
        distinguishing_aspect: |
          DEPTH 4, originating from POST /delivery-attempts/{id}/refuse. Each link exists
          only because the previous one happened:
            link 1  the attempt moves ID_VERIFIED -> REFUSED and its own order moves
                    OUT_FOR_DELIVERY -> RETURN_IN_TRANSIT;
            link 2  because link 1 recorded a compliance refusal reason
                    (INTOXICATED_RECIPIENT), a ViolationCase is opened with origin
                    AUTO_REFUSAL and severity MAJOR;
            link 3  because link 2 created a case, the partner's open_case_count is
                    recomputed from 2 to 3, which is POSTURE_RESTRICTED_OPEN_CASES, so
                    partner_posture_derivation moves posture OPEN -> RESTRICTED;
            link 4  because link 3 worsened the posture, a DIFFERENT order of the same
                    partner — one that this refusal never touched — is pulled
                    DISPATCHED -> HELD_AT_HUB and its compliance_state
                    PREVERIFIED -> PENDING_COMPLIANCE_REVIEW.
          The fourth link lands on an entity row the trigger call does not name anywhere,
          which is what separates this from a fan-out. Note that license_risk_score stays
          0.00 throughout: the posture worsens on the open-case count, not on points.
        test_recipe:
          setup:
            - "logical clock at 2026-08-20T12:00:00Z"
            - "jurisdiction US-NY ALCOHOL policy as in the shared conventions"
            - "customer attested and MATCH-pre-verified; courier CERTIFIED for ALCOHOL"
            - "partner Empire Last Mile already carries exactly 2 OPEN violation cases, so open_case_count == 2, license_risk_score == 0.00 and posture == OPEN"
            - "order_a (3xWINE-A) is submitted, dispatched, an attempt is opened and the door ID check succeeds, so order_a is OUT_FOR_DELIVERY and the attempt is ID_VERIFIED"
            - "order_b (3xWINE-A, created after order_a) is submitted and dispatched and is sitting in (PREVERIFIED, DISPATCHED) with no attempt of its own"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-20T12:00:00Z" }
              as: PlatformAdmin
            - call: "POST /jurisdictions"
              payload: { code: "US-NY", name: "New York", dry_status: "WET", utc_offset_minutes: -240 }
              as: PlatformAdmin
              captures: { j_ny: $.data.id }
