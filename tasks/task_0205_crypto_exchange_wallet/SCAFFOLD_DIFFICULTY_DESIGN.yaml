  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: whitelist_address_halfopen_hold_overlap
        grounds:
          - validations[priority=7.5]
          - entities.WithdrawalAddress.fields.activates_at
          - errors[ERR_ADDRESS_HOLD_OVERLAP]
        distinguishing_aspect: |
          HALF-OPEN [created_at, activates_at): adding a second (account,asset,chain_address)
          duplicate while current_clock is inside the first row's 24h window is rejected; once
          current_clock reaches activates_at exactly, the window no longer contains the point and
          the add succeeds. Resource: WithdrawalAddress.
        test_recipe:
          setup:
            - "BTC asset; account TIER_1; one PENDING_HOLD address 0xDUP added at 2027-01-01T00:00:00Z (activates_at 2027-01-02T00:00:00Z)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-01-01T00:00:00Z" }
