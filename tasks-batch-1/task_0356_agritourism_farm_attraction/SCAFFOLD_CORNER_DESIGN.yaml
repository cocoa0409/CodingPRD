      - name: operate_on_cancelled_window_rejected
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_WINDOW_CANCELLED]"
          - "state_machines.AdmissionWindow.SCHEDULED_to_CANCELLED"
        distinguishing_aspect: "Creating a reservation against a CANCELLED window (closure-cancelled) on a still-OPEN farm window... here: the farm reopens (CLEARED) but the window stays CANCELLED -> ERR_WINDOW_CANCELLED (409)."
        test_recipe:
          setup: ["Farm closed then reopened (CLEARED); a window that was CANCELLED by the closure stays CANCELLED; clock 2026-10-10T12:00Z."]
          setup_api_calls:
            - call: "POST /farms"
              payload: { name: "Cancelled Window Farm" }
              as: FarmManager
              captures: { farm_id: $.data.id }
            - call: "POST /farms/${farm_id}/pricing-policies"
