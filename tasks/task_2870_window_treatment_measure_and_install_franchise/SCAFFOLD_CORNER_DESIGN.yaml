              as_user_id: "${t1}"
              captures: { expo1: $.data.open_order_exposure_cents }
            - call: "POST /blinds/vendor-orders/${ord1}/ship"
              as: VendorRep
              as_user_id: "${v1}"
              captures: { ship_status: $.data.status }
            - call: "POST /blinds/vendor-orders/${ord1}/receive"
              as: Franchisee
              as_user_id: "${t1}"
              captures: { recv_status: $.data.status, recv_at: $.data.received_at }
            - call: "GET /blinds/territories/${t1}"
              as: Franchisee
              as_user_id: "${t1}"
              captures: { expo2: $.data.open_order_exposure_cents, roy2: $.data.royalty_accrued_cents }
            - call: "GET /blinds/territories/${t1}"
              as: Franchisor
              as_user_id: "hq-ops"
              captures: { expo3: $.data.open_order_exposure_cents, roy3: $.data.royalty_accrued_cents }
          assert:
            - "the acceptance response is already complete: the captured ${acc_status} == ACCEPTED with ${acc_recognized} == 9920 - no follow-up read is needed to learn what was recognized"
            - "and the very next request sees its money: the captured ${roy1} == 546 (round_half_up(9920 x 0.055) = 545.6), ${net1} == 9920 and ${ledger_first} == 546"
            - "the placement response already carries the derived cost: the captured ${cost} == 4166, and the immediately following read gives ${expo1} == 4166"
            - "the captured ${ship_status} == SHIPPED and ${recv_status} == RECEIVED with ${recv_at} == 2026-08-01T00:00:00.000Z, the logical clock's startup instant"
            - "the receive response's consequence is visible at once: the captured ${expo2} == 0 while ${roy2} == 546 - receiving releases exposure without touching accrued royalty"
            - "reads are stable and actor-independent: the captured ${expo3} == ${expo2} and ${roy3} == ${roy2} with no intervening write, so nothing converges after the fact"
            - "no operation in this instance needed a retry, a poll or a delay, which is what consistency_model immediate means for every cascade in this domain"
