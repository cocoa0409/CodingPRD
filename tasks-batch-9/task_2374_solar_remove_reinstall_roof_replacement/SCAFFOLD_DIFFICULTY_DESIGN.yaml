              as: ProjectCoordinator
              captures: { juris_id: $.data.id }
            - call: "POST /reroof/parties"
              payload: { name: "Ridgeline Roofing", party_type: "ROOFER", contact_email: "ops@ridgeline.example" }
              as: ProjectCoordinator
              captures: { roofer_id: $.data.id }
            - call: "POST /reroof/parties"
              payload: { name: "Alvarez Household", party_type: "SOLAR_OWNER", contact_email: "owner2@example.com" }
              as: ProjectCoordinator
              captures: { owner_id: $.data.id }
            - call: "POST /reroof/parties"
              payload: { name: "SunSystem Crew A", party_type: "SOLAR_CONTRACTOR", contact_email: "crew.a@sunsystem.example" }
              as: ProjectCoordinator
              captures: { crew_id: $.data.id }
            - call: "POST /reroof/projects"
              payload: { site_address: "77 Ocotillo Ln, Chandler AZ", ownership_model: "HOST_OWNED", system_dc_kw: 6.0, roofer_party_id: "${roofer_id}", solar_owner_party_id: "${owner_id}", solar_contractor_party_id: "${crew_id}", baseline_daily_kwh: 30.0, downtime_days_estimated: 4, upgrade_budget_cents: 2000000 }
              as: ProjectCoordinator
              captures: { proj1_id: $.data.id }
            - call: "POST /reroof/projects"
              payload: { site_address: "912 Saguaro Rd, Mesa AZ", ownership_model: "HOST_OWNED", system_dc_kw: 5.2, roofer_party_id: "${roofer_id}", solar_owner_party_id: "${owner_id}", solar_contractor_party_id: "${crew_id}", baseline_daily_kwh: 26.0, downtime_days_estimated: 3, upgrade_budget_cents: 1500000 }
              as: ProjectCoordinator
              captures: { proj2_id: $.data.id }
            - call: "POST /reroof/permit-applications"
              payload: { project_id: "${proj1_id}", jurisdiction_id: "${juris_id}", scope: "REINSTALL_ONLY" }
              as: ProjectCoordinator
              captures: { permit1_id: $.data.id }
            - call: "POST /reroof/permit-applications/${permit1_id}/submission"
              payload: {}
              as: ProjectCoordinator
            - call: "POST /reroof/permit-applications/${permit1_id}/inspections"
              payload: { inspection_type: "ROOF_DECK", slot_date: "2026-08-06", window_start_utc: "2026-08-06T15:00:00Z", window_end_utc: "2026-08-06T17:00:00Z" }
              as: ProjectCoordinator
              captures: { insp1_id: $.data.id }
            - call: "POST /reroof/permit-applications"
              payload: { project_id: "${proj2_id}", jurisdiction_id: "${juris_id}", scope: "REINSTALL_ONLY" }
              as: ProjectCoordinator
              captures: { permit2_id: $.data.id }
          trigger:
            - call: "POST /reroof/permit-applications/${permit2_id}/inspections"
              payload: { inspection_type: "ROOF_DECK", slot_date: "2026-08-06", window_start_utc: "2026-08-06T18:00:00Z", window_end_utc: "2026-08-06T20:00:00Z" }
              as: ProjectCoordinator
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "${err_id} == ERR_PERMIT_NOT_SUBMITTED"
            - "${err_id} != ERR_INSPECTION_SLOT_FULL"
            - "PermitApplication.${permit2_id}.status == DRAFT"
            - "Inspection.${insp1_id}.status == SCHEDULED"

      - name: role_check_priority_2_outranks_path_existence_priority_3_and_project_not_found_is_masked
        grounds:
          - validations[priority=2]
          - validations[priority=3]
          - errors.ERR_ROLE_NOT_PERMITTED
          - rbac.SolarOwner
          - endpoints["POST /reroof/projects/{id}/party-approvals"]
        distinguishing_aspect: |
          Pairs auth (priority 2) against existence (priority 3) - a third distinct category pair. The
          request is made by a SolarOwner, a role absent from the party-approval creation endpoint's
          role list, against a project id that does not exist. The response must be
          ERR_ROLE_NOT_PERMITTED (403); returning ERR_PROJECT_NOT_FOUND (404) would leak whether the
          id exists to a caller who is not allowed on the endpoint at all.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "A real SOLAR_OWNER party exists so the payload's party_id is itself well formed."
            - "No project exists with id 00000000-0000-0000-0000-0000000000ff."
            - "The party-approval creation endpoint lists only ProjectCoordinator, so SolarOwner is refused on the role check before the path id is resolved."
          setup_api_calls:
            - call: "POST /reroof/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProjectCoordinator
            - call: "POST /reroof/parties"
              payload: { name: "Alvarez Household", party_type: "SOLAR_OWNER", contact_email: "owner2@example.com" }
              as: ProjectCoordinator
              captures: { owner_id: $.data.id }
          trigger:
            - call: "POST /reroof/projects/00000000-0000-0000-0000-0000000000ff/party-approvals"
              payload: { party_id: "${owner_id}" }
              as: SolarOwner
              as_user_id: "${owner_id}"
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP status == 403"
            - "${err_id} == ERR_ROLE_NOT_PERMITTED"
            - "${err_id} != ERR_PROJECT_NOT_FOUND"

  - rule_id: boundary_precision_check
    instances:
      - name: inspection_backlog_floor_accepts_exact_earliest_start_and_refuses_one_hour_earlier
        grounds:
          - calculations.inspection_slot_availability
          - validations[priority=21]
          - errors.ERR_INSPECTION_BACKLOG_VIOLATION
          - endpoints["POST /reroof/permit-applications/{id}/inspections"]
        distinguishing_aspect: |
          Metric: the temporal backlog floor on the inspection-booking endpoint, whose comparison is
          declared closed (>=). With clock_now 2026-08-10T00:00:00Z and backlog_days 5 the earliest
          legal start is exactly 2026-08-15T00:00:00Z: a booking starting at that instant is accepted,
          while a booking one hour earlier on 2026-08-14 is refused ERR_INSPECTION_BACKLOG_VIOLATION.
          The refused candidate is deliberately kept inside a single UTC date so the priority-20
          well-formedness rule cannot fire first and mask the boundary.
        test_recipe:
          setup:
            - "Jurisdiction FLATROCK with backlog_days 5, permit_review_days 7, inspection_slots_per_day 2, repermit_required_for_reinstall false, reinspection_required true."
            - "A HOST_OWNED project with a REINSTALL_ONLY permit already SUBMITTED, so the priority-8 state gate is satisfied."
            - "The logical clock is set to exactly 2026-08-10T00:00:00Z, so clock_now + 5 whole days == 2026-08-15T00:00:00Z."
            - "Both candidate windows are well formed (end strictly after start, both endpoints on the same UTC date as slot_date) and the jurisdiction has spare capacity on both dates."
          setup_api_calls:
            - call: "POST /reroof/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: ProjectCoordinator
            - call: "POST /reroof/jurisdictions"
              payload: { name: "Flatrock AHJ", code: "FLATROCK", repermit_required_for_reinstall: false, reinspection_required: true, inspection_slots_per_day: 2, backlog_days: 5, permit_review_days: 7 }
              as: ProjectCoordinator
              captures: { juris_id: $.data.id }
            - call: "POST /reroof/parties"
              payload: { name: "Ridgeline Roofing", party_type: "ROOFER", contact_email: "ops@ridgeline.example" }
              as: ProjectCoordinator
              captures: { roofer_id: $.data.id }
            - call: "POST /reroof/parties"
              payload: { name: "Alvarez Household", party_type: "SOLAR_OWNER", contact_email: "owner2@example.com" }
              as: ProjectCoordinator
              captures: { owner_id: $.data.id }
            - call: "POST /reroof/parties"
              payload: { name: "SunSystem Crew A", party_type: "SOLAR_CONTRACTOR", contact_email: "crew.a@sunsystem.example" }
              as: ProjectCoordinator
              captures: { crew_id: $.data.id }
            - call: "POST /reroof/projects"
              payload: { site_address: "77 Ocotillo Ln, Chandler AZ", ownership_model: "HOST_OWNED", system_dc_kw: 6.0, roofer_party_id: "${roofer_id}", solar_owner_party_id: "${owner_id}", solar_contractor_party_id: "${crew_id}", baseline_daily_kwh: 30.0, downtime_days_estimated: 4, upgrade_budget_cents: 2000000 }
              as: ProjectCoordinator
              captures: { proj_id: $.data.id }
            - call: "POST /reroof/permit-applications"
              payload: { project_id: "${proj_id}", jurisdiction_id: "${juris_id}", scope: "REINSTALL_ONLY" }
              as: ProjectCoordinator
              captures: { permit_id: $.data.id }
            - call: "POST /reroof/permit-applications/${permit_id}/submission"
              payload: {}
              as: ProjectCoordinator
          trigger:
            - call: "POST /reroof/permit-applications/${permit_id}/inspections"
              payload: { inspection_type: "ROOF_DECK", slot_date: "2026-08-15", window_start_utc: "2026-08-15T00:00:00Z", window_end_utc: "2026-08-15T02:00:00Z" }
              as: ProjectCoordinator
              captures: { insp_ok: $.data.id }
            - call: "POST /reroof/permit-applications/${permit_id}/inspections"
              payload: { inspection_type: "MOUNTING", slot_date: "2026-08-14", window_start_utc: "2026-08-14T23:00:00Z", window_end_utc: "2026-08-14T23:59:00Z" }
              as: ProjectCoordinator
              captures: { err_id: $.data.error_id }
          assert:
            - "trigger call 1 returns HTTP 201 and Inspection.${insp_ok}.status == SCHEDULED"
            - "Inspection.${insp_ok}.window_start_utc == 2026-08-15T00:00:00.000Z"
            - "Inspection.${insp_ok}.attempt_number == 1"
            - "trigger call 2 returns HTTP 422"
            - "${err_id} == ERR_INSPECTION_BACKLOG_VIOLATION"
            - "PermitApplication.${permit_id}.fee_cents == 23100"
            - "PermitApplication.${permit_id}.review_deadline_utc == 2026-08-17T00:00:00.000Z"

      - name: deck_upgrade_floor_boundary_zero_attachments_versus_fifty_two_point_seven_sqft
        grounds:
          - calculations.deck_upgrade_cost
          - entities.DeckFinding.fields.upgrade_cost_cents
          - endpoints["POST /reroof/deck-findings/{id}/upgrade"]
        distinguishing_aspect: |
          Metric: the FLOOR_BASE_CENTS cost floor on the deck-finding upgrade endpoint - a monetary
          boundary on a different endpoint from the temporal backlog boundary. A 10 sqft LOW finding
          with zero attachments computes 9500 raw, so the published cost is the 50000-cent floor, while
          52.7 sqft computes exactly 50065 and the floor stops binding; the pair proves the floor is a
          max over the raw figure and that a fractional-sqft input is not truncated to 52 sqft
          (which would give 49400 and be pulled back to the floor).
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "A HOST_OWNED project with upgrade_budget_cents 2000000, so neither scoping trips the priority-30 budget gate."
            - "Both findings are LOW severity FASTENER_PULLOUT with attachment_count_affected 0, so no flashing surcharge applies, the severity multiplier is 1.00 and the posture stays OPEN (standard_scope variant)."
            - "Finding fA covers 10 affected_area_sqft; finding fB covers 52.7 affected_area_sqft."
          setup_api_calls:
            - call: "POST /reroof/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProjectCoordinator
            - call: "POST /reroof/parties"
              payload: { name: "Ridgeline Roofing", party_type: "ROOFER", contact_email: "ops@ridgeline.example" }
              as: ProjectCoordinator
              captures: { roofer_id: $.data.id }
            - call: "POST /reroof/parties"
              payload: { name: "Alvarez Household", party_type: "SOLAR_OWNER", contact_email: "owner2@example.com" }
              as: ProjectCoordinator
              captures: { owner_id: $.data.id }
            - call: "POST /reroof/parties"
              payload: { name: "SunSystem Crew A", party_type: "SOLAR_CONTRACTOR", contact_email: "crew.a@sunsystem.example" }
              as: ProjectCoordinator
              captures: { crew_id: $.data.id }
            - call: "POST /reroof/projects"
              payload: { site_address: "77 Ocotillo Ln, Chandler AZ", ownership_model: "HOST_OWNED", system_dc_kw: 6.0, roofer_party_id: "${roofer_id}", solar_owner_party_id: "${owner_id}", solar_contractor_party_id: "${crew_id}", baseline_daily_kwh: 30.0, downtime_days_estimated: 4, upgrade_budget_cents: 2000000 }
              as: ProjectCoordinator
              captures: { proj_id: $.data.id }
            - call: "POST /reroof/projects/${proj_id}/deck-findings"
              payload: { finding_type: "FASTENER_PULLOUT", severity: "LOW", affected_area_sqft: 10, attachment_count_affected: 0 }
              as: RoofingContractor
              as_user_id: "${roofer_id}"
              captures: { f_a: $.data.id }
            - call: "POST /reroof/projects/${proj_id}/deck-findings"
              payload: { finding_type: "FASTENER_PULLOUT", severity: "LOW", affected_area_sqft: 52.7, attachment_count_affected: 0 }
              as: RoofingContractor
              as_user_id: "${roofer_id}"
              captures: { f_b: $.data.id }
          trigger:
            - call: "POST /reroof/deck-findings/${f_a}/upgrade"
              payload: { action: "SCOPE" }
              as: RoofingContractor
              as_user_id: "${roofer_id}"
            - call: "POST /reroof/deck-findings/${f_b}/upgrade"
              payload: { action: "SCOPE" }
              as: RoofingContractor
              as_user_id: "${roofer_id}"
          assert:
            - "DeckFinding.${f_a}.upgrade_cost_cents == 50000"
            - "DeckFinding.${f_b}.upgrade_cost_cents == 50065"
            - "DeckFinding.${f_b}.upgrade_cost_cents != 50000"
            - "DeckFinding.${f_a}.requires_repermit == false"
            - "ReroofProject.${proj_id}.scoped_upgrade_cost_cents == 100065"
            - "ReroofProject.${proj_id}.posture == OPEN"

      - name: circuit_watt_spread_accepts_exactly_three_percent_and_refuses_three_point_two_five
        grounds:
          - calculations.circuit_watt_spread
          - validations[priority=19]
          - errors.ERR_CIRCUIT_WATT_SPREAD_EXCEEDED
          - endpoints["POST /reroof/sourcing-orders/{id}/receipt"]
        distinguishing_aspect: |
          Metric: the percentage watt spread of a circuit's PANEL population, checked on the sourcing
          receipt endpoint - a third distinct endpoint and a ratio rather than a date or a cost. Two
          structurally identical circuits differ only in the offered wattage: substituting 412 W beside
          a 400 W neighbour gives exactly 3.00 percent and the receipt is accepted, while 413 W gives
          3.25 percent and the receipt is refused, proving the comparison is strictly greater-than.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "A HOST_OWNED project (so a COMPATIBLE order is auto-APPROVED and no SYSTEM_OWNER review is needed) consented by roofer and solar owner."
            - "Circuit S1 carries a healthy 400 W panel that stays ON_ROOF and a 410 W panel that is removed and graded DAMAGED; circuit S2 is an identical pair."
            - "Both circuits are de-energized so both damaged panels can be removed."
            - "Order o1 offers Meridian Solar MS-412 at 412 W for S1's damaged panel: watt_delta_pct 0.49 <= tolerance 3.00, so match_class COMPATIBLE and status APPROVED."
            - "Order o2 offers Meridian Solar MS-413 at 413 W for S2's damaged panel: watt_delta_pct 0.73, likewise COMPATIBLE and APPROVED."
            - "The project version is re-read before each order because a sourcing-order creation increments it."
