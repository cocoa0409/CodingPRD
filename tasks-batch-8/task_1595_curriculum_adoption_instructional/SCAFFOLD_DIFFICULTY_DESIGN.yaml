              as: InstructionalSpecialist
            - call: "POST /adoption-cycles/${cy_id}/transitions"
              payload: { to_state: ALIGNMENT_REVIEW }
              as: InstructionalSpecialist
            - call: "POST /adoption-cycles/${cy_id}/transitions"
              payload: { to_state: PILOT_OPEN }
              as: InstructionalSpecialist
          trigger:
            - call: "POST /adoption-cycles/${cy_id}/quotes"
              payload: { material_id: "${mat_id}", publisher_name: "PubR", print_unit_price: 10.125, print_quantity: 1, digital_seat_rate: 10.125, digital_seat_count: 1, bundle_discount_pct: 0, training_sessions: 0, license_years: 0 }
              as: ProcurementOfficer
              captures: { q1: $.data.id }
            - call: "POST /quotes/${q1}/transitions"
              payload: { to_state: UNDER_EVALUATION }
              as: ProcurementOfficer
            - call: "POST /adoption-cycles/${cy_id}/quotes"
              payload: { material_id: "${mat_id}", publisher_name: "PubB", print_unit_price: 80.00, print_quantity: 500, digital_seat_rate: 25.00, digital_seat_count: 480, bundle_discount_pct: 0.10, training_sessions: 1, license_years: 1 }
              as: ProcurementOfficer
              captures: { q2: $.data.id }
            - call: "POST /quotes/${q2}/transitions"
              payload: { to_state: UNDER_EVALUATION }
              as: ProcurementOfficer
          assert:
            - "Quote.${q1}.evaluated_total == 20.26 (per-line rounding: 10.13 + 10.13; sum-then-round would give 20.25)"
            - "Quote.${q2}.evaluated_total == 50800.00 (print 40000.00 + digital round(12000.00 * 0.90) = 10800.00; discount applied after the digital line is rounded, then rounded again)"

      - name: best_value_zero_min_pool
        grounds:
          - calculations.best_value_score
        distinguishing_aspect: |
          Mode (a) combinatorial formula with >= 3 inputs and non-linear interaction: nested
          min/max on price/training/license scores plus the conditional branch min_total == 0
          (a zero-priced quote collapses every price_score to 100, so service terms decide).
          Distinct mode from quote_line_rounding_order (mode b).
        test_recipe:
          setup:
            - "BEST_VALUE cycle ADOPTED with material MAT; three UNDER_EVALUATION quotes: FREE1 (total 0.00, 10 sessions, 5 years), FREE2 (total 0.00, 0 sessions, 0 years), PAID (total 100.00, 3 sessions, 2 years)"
          setup_api_calls:
            - call: "POST /frameworks"
              payload: { code: "FW-MATH-K5", subject_area: MATHEMATICS, grade_band: K_5, standards_required_count: 1, effective_year: 2026 }
              as: DistrictAdmin
              captures: { fw_id: $.data.id }
            - call: "POST /adoption-cycles"
              payload: { subject_area: MATHEMATICS, grade_band: K_5, school_year_start: 2027, framework_id: "${fw_id}", district_enrollment: 100, award_method: BEST_VALUE }
              as: CurriculumDirector
              captures: { cy_id: $.data.id }
            - call: "POST /adoption-cycles/${cy_id}/materials"
              payload: { title: "Math Text", publisher_name: "PubA" }
