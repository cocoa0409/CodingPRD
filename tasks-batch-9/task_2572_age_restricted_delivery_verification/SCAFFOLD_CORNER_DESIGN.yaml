        grounds:
          - state_machines.CourierCertification.transitions.EXPIRED_to_ACTIVE
          - validations[priority=60]
          - errors[ERR_TRAINING_STALE]
          - domain_constants.TRAINING_FRESHNESS_DAYS
        distinguishing_aspect: |
          The EXPIRED -> ACTIVE renewal edge carries two independent preconditions; with
          training_score 95 clearing the score bar, training_completed_at 2026-04-01 is 152 days
          before the logical clock 2026-08-31T00:00:00Z and breaches TRAINING_FRESHNESS_DAYS 90,
          so the renewal is rejected 422 ERR_TRAINING_STALE and renewal_count stays 0.
        test_recipe:
          setup:
