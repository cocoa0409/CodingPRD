            - "${c_st} == TERMINATED"
            - "${r_st} == ARCHIVED"
            - "${sd_st} == CANCELLED"
            - "${a_st} == CANCELLED and ${a_reason} == CONTRACT_TERMINATED"
            - "${ch_st} == CANCELLED and ${ch_fee} == 0 and ${ch_ref} == 5000 (full deposit refund on termination)"
      - name: charter_decline_is_terminal_returns_409
        claim_type: terminal_lockdown
        grounds:
