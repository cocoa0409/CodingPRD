scaffold_difficulty_design:
  # =================================================================
  # Rule 1 — dual_variant_calc (different entity domains:
  #           Application review clock vs Fine fiscal accrual)
  # =================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: deemed_approval_calendar_vs_business_deadline
        grounds:
          - calculations.statutory_deadline_check
          - state_machines.Application.UNDER_REVIEW_to_DEEMED_APPROVED
          - entities.Association.fields.counting_mode
        distinguishing_aspect: |
          Identical submission timestamp and statutory_response_days=5 produce different
          deemed-approval dates purely from counting_mode: the CALENDAR application is
          deemed on 2026-05-06 while the BUSINESS application is still UNDER_REVIEW that
          day and is deemed only on 2026-05-08 (weekend skipped). Entity domain: Application
          review clock (temporal), distinct from the fine-accrual instance.
        test_recipe:
          setup:
            - "Two associations CAL (counting_mode CALENDAR) and BIZ (BUSINESS), both statutory_response_days=5"
            - "Each has one owner-applicant with a property and a complete application SUBMITTED then UNDER_REVIEW at logical 2026-05-01 (Friday)"
          setup_api_calls:
            - { call: "POST /arc/associations", payload: { name: "CAL HOA", statutory_response_days: 5, counting_mode: CALENDAR, fine_mode: SIMPLE_DAILY, base_fine_cents: 10000, daily_fine_cents: 1000, lien_threshold_cents: 1000000, committee_size: 5, quorum_min: 3, supermajority_required: true, max_window_days: 180 }, as: Manager, captures: { assoc_cal: $.data.id } }
            - { call: "POST /arc/associations", payload: { name: "BIZ HOA", statutory_response_days: 5, counting_mode: BUSINESS, fine_mode: SIMPLE_DAILY, base_fine_cents: 10000, daily_fine_cents: 1000, lien_threshold_cents: 1000000, committee_size: 5, quorum_min: 3, supermajority_required: true, max_window_days: 180 }, as: Manager, captures: { assoc_biz: $.data.id } }
            - { call: "POST /arc/associations/${assoc_cal}/owners", payload: { full_name: "Ann Cal", email: "ann.cal@x.com" }, as: Manager, captures: { owner_cal: $.data.id } }
            - { call: "POST /arc/associations/${assoc_biz}/owners", payload: { full_name: "Bob Biz", email: "bob.biz@x.com" }, as: Manager, captures: { owner_biz: $.data.id } }
            - { call: "POST /arc/associations/${assoc_cal}/properties", payload: { lot_number: "C-1", address: "1 Calendar Way", primary_owner_id: "${owner_cal}" }, as: Manager, captures: { prop_cal: $.data.id } }
            - { call: "POST /arc/associations/${assoc_biz}/properties", payload: { lot_number: "B-1", address: "1 Business Blvd", primary_owner_id: "${owner_biz}" }, as: Manager, captures: { prop_biz: $.data.id } }
            - { call: "POST /arc/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T09:00:00Z" }, as: Manager }
            - { call: "POST /arc/properties/${prop_cal}/applications", payload: { owner_id: "${owner_cal}", project_type: FENCE, guideline_section: "SEC-4.2", description: "cedar fence", requested_window_start: "2026-06-01", requested_window_end: "2026-07-15" }, as: Homeowner, as_user_id: "${owner_cal}", captures: { app_cal: $.data.id } }
            - { call: "POST /arc/applications/${app_cal}/attachments", payload: { kind: DRAWING, label: "site plan", uri: "s3://cal/d1" }, as: Homeowner, as_user_id: "${owner_cal}" }
            - { call: "POST /arc/applications/${app_cal}/attachments", payload: { kind: MATERIAL_SAMPLE, label: "cedar", uri: "s3://cal/m1" }, as: Homeowner, as_user_id: "${owner_cal}" }
            - { call: "POST /arc/applications/${app_cal}/submit", as: Homeowner, as_user_id: "${owner_cal}" }
            - { call: "POST /arc/applications/${app_cal}/start-review", as: Manager }
            - { call: "POST /arc/properties/${prop_biz}/applications", payload: { owner_id: "${owner_biz}", project_type: FENCE, guideline_section: "SEC-4.2", description: "cedar fence", requested_window_start: "2026-06-01", requested_window_end: "2026-07-15" }, as: Homeowner, as_user_id: "${owner_biz}", captures: { app_biz: $.data.id } }
            - { call: "POST /arc/applications/${app_biz}/attachments", payload: { kind: DRAWING, label: "site plan", uri: "s3://biz/d1" }, as: Homeowner, as_user_id: "${owner_biz}" }
            - { call: "POST /arc/applications/${app_biz}/attachments", payload: { kind: MATERIAL_SAMPLE, label: "cedar", uri: "s3://biz/m1" }, as: Homeowner, as_user_id: "${owner_biz}" }
            - { call: "POST /arc/applications/${app_biz}/submit", as: Homeowner, as_user_id: "${owner_biz}" }
            - { call: "POST /arc/applications/${app_biz}/start-review", as: Manager }
          trigger:
            - { call: "POST /arc/_clock/set_current_utc", payload: { to_iso8601: "2026-05-06T09:00:00Z" }, as: Manager }
            - { call: "POST /arc/_sweeps/daily", as: Manager, captures: { deemed_day5: $.data.applications_deemed_approved } }
            - { call: "GET /arc/applications/${app_cal}", as: Manager, captures: { cal_status_d5: $.data.status } }
            - { call: "GET /arc/applications/${app_biz}", as: Manager, captures: { biz_status_d5: $.data.status } }
            - { call: "POST /arc/_clock/set_current_utc", payload: { to_iso8601: "2026-05-08T09:00:00Z" }, as: Manager }
            - { call: "POST /arc/_sweeps/daily", as: Manager, captures: { deemed_day7: $.data.applications_deemed_approved } }
            - { call: "GET /arc/applications/${app_biz}", as: Manager, captures: { biz_status_d7: $.data.status } }
            - { call: "GET /arc/applications/${app_cal}/permits", as: Manager, captures: { cal_permit_status: "$.data[0].status" } }
          assert:
            - "after 2026-05-06 sweep: applications_deemed_approved == 1 (only CAL fires)"
            - "Application.${app_cal}.status == DEEMED_APPROVED on 2026-05-06 (elapsed calendar days = 5 >= 5)"
            - "Application.${app_biz}.status == UNDER_REVIEW on 2026-05-06 (elapsed business days = 3 < 5)"
            - "after 2026-05-08 sweep: applications_deemed_approved == 1 (BIZ fires)"
            - "Application.${app_biz}.status == DEEMED_APPROVED on 2026-05-08 (business days = 5 >= 5)"
            - "ConstructionPermit for CAL application exists with status == ACTIVE (deemed-approval cascade)"

      - name: fine_accrual_simple_vs_tiered_totals
        grounds:
          - calculations.fine_accrual
          - entities.Fine.fields.mode_snapshot
          - entities.Association.fields.fine_mode
        distinguishing_aspect: |
          Identical base_fine_cents=10000, daily_fine_cents=1000 and 5 days of accrual yield
          15000 (SIMPLE_DAILY) vs 17000 (TIERED_ESCALATION, grace 3, 2.0x) purely from
          fine_mode. Entity domain: Fine/Violation fiscal accrual, distinct from the
          Application review-clock instance.
        test_recipe:
          setup:
            - "Association T: TIERED_ESCALATION grace_days=3 escalation_multiplier_bp=20000; Association S: SIMPLE_DAILY; both base 10000 daily 1000"
            - "One property+owner each; manager reports UNAPPROVED_WORK violation at logical 2026-05-01 (creates Fine ACCRUING with accrued = base)"
          setup_api_calls:
            - { call: "POST /arc/associations", payload: { name: "Tiered HOA", statutory_response_days: 30, counting_mode: CALENDAR, fine_mode: TIERED_ESCALATION, base_fine_cents: 10000, daily_fine_cents: 1000, grace_days: 3, escalation_multiplier_bp: 20000, lien_threshold_cents: 1000000, committee_size: 5, quorum_min: 3, supermajority_required: true, max_window_days: 180 }, as: Manager, captures: { assoc_t: $.data.id } }
            - { call: "POST /arc/associations", payload: { name: "Simple HOA", statutory_response_days: 30, counting_mode: CALENDAR, fine_mode: SIMPLE_DAILY, base_fine_cents: 10000, daily_fine_cents: 1000, lien_threshold_cents: 1000000, committee_size: 5, quorum_min: 3, supermajority_required: true, max_window_days: 180 }, as: Manager, captures: { assoc_s: $.data.id } }
            - { call: "POST /arc/associations/${assoc_t}/owners", payload: { full_name: "Ted T", email: "ted@x.com" }, as: Manager, captures: { owner_t: $.data.id } }
            - { call: "POST /arc/associations/${assoc_s}/owners", payload: { full_name: "Sue S", email: "sue@x.com" }, as: Manager, captures: { owner_s: $.data.id } }
            - { call: "POST /arc/associations/${assoc_t}/properties", payload: { lot_number: "T-1", address: "1 Tier Ln", primary_owner_id: "${owner_t}" }, as: Manager, captures: { prop_t: $.data.id } }
            - { call: "POST /arc/associations/${assoc_s}/properties", payload: { lot_number: "S-1", address: "1 Simple St", primary_owner_id: "${owner_s}" }, as: Manager, captures: { prop_s: $.data.id } }
            - { call: "POST /arc/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T09:00:00Z" }, as: Manager }
            - { call: "POST /arc/properties/${prop_t}/violations", payload: { kind: UNAPPROVED_WORK, description: "shed without approval" }, as: Manager, captures: { vio_t: $.data.id } }
            - { call: "POST /arc/properties/${prop_s}/violations", payload: { kind: UNAPPROVED_WORK, description: "shed without approval" }, as: Manager, captures: { vio_s: $.data.id } }
          trigger:
            - { call: "POST /arc/_clock/set_current_utc", payload: { to_iso8601: "2026-05-06T09:00:00Z" }, as: Manager }
            - { call: "POST /arc/_sweeps/daily", as: Manager }
            - { call: "GET /arc/violations/${vio_t}/fines", as: Manager, captures: { t_accrued: "$.data[0].accrued_cents", t_mode: "$.data[0].mode_snapshot" } }
            - { call: "GET /arc/violations/${vio_s}/fines", as: Manager, captures: { s_accrued: "$.data[0].accrued_cents", s_mode: "$.data[0].mode_snapshot" } }
          assert:
            - "Fine of violation ${vio_t}: mode_snapshot == TIERED_ESCALATION, accrued_cents == 17000 (10000 + 3*1000 + 2*2000)"
            - "Fine of violation ${vio_s}: mode_snapshot == SIMPLE_DAILY, accrued_cents == 15000 (10000 + 5*1000)"
            - "variant delta == 2000 for identical base/rate/duration"

  # =================================================================
  # Rule 2 — combinatorial_formula (mode a: quorum tally with flag
  #           branch; mode b: pinned per-day rounding order)
  # =================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: quorum_tally_supermajority_flag_flips_outcome
        grounds:
          - calculations.quorum_decision_tally
          - entities.Association.fields.supermajority_required
          - state_machines.Application.UNDER_REVIEW_to_APPROVED_WITH_CONDITIONS
          - state_machines.Application.UNDER_REVIEW_to_DENIED
        distinguishing_aspect: |
          Mode (a) combinatorial: with identical ballots A=3,D=2 (5 cast, quorum 3),
          supermajority_required=true denies (3*3=9 < 2*5=10) while false approves
          (3 > 2 strict plurality). The flag branch, quorum gate and abstain-exclusion
          interact non-linearly; companion instance uses rounding-order mode (b).
        test_recipe:
          setup:
            - "Association SUP (supermajority_required=true) and PLU (false); committee_size 5 quorum 3"
            - "Each: applicant owner + 5 committee owners; application SUBMITTED and UNDER_REVIEW at 2026-05-01"
            - "Five ballots cast on each application: three APPROVE then two DENY"
          setup_api_calls:
            - { call: "POST /arc/associations", payload: { name: "Sup HOA", statutory_response_days: 30, counting_mode: CALENDAR, fine_mode: SIMPLE_DAILY, base_fine_cents: 10000, daily_fine_cents: 1000, lien_threshold_cents: 1000000, committee_size: 5, quorum_min: 3, supermajority_required: true, max_window_days: 180 }, as: Manager, captures: { assoc_sup: $.data.id } }
            - { call: "POST /arc/associations", payload: { name: "Plu HOA", statutory_response_days: 30, counting_mode: CALENDAR, fine_mode: SIMPLE_DAILY, base_fine_cents: 10000, daily_fine_cents: 1000, lien_threshold_cents: 1000000, committee_size: 5, quorum_min: 3, supermajority_required: false, max_window_days: 180 }, as: Manager, captures: { assoc_plu: $.data.id } }
            - { call: "POST /arc/associations/${assoc_sup}/owners", payload: { full_name: "Ap Sup", email: "ap.sup@x.com" }, as: Manager, captures: { sup_a: $.data.id } }
            - { call: "POST /arc/associations/${assoc_sup}/owners", payload: { full_name: "Cm Sup1", email: "cm1.sup@x.com" }, as: Manager, captures: { sup_b: $.data.id } }
            - { call: "POST /arc/associations/${assoc_sup}/owners", payload: { full_name: "Cm Sup2", email: "cm2.sup@x.com" }, as: Manager, captures: { sup_c: $.data.id } }
            - { call: "POST /arc/associations/${assoc_sup}/owners", payload: { full_name: "Cm Sup3", email: "cm3.sup@x.com" }, as: Manager, captures: { sup_d: $.data.id } }
            - { call: "POST /arc/associations/${assoc_sup}/owners", payload: { full_name: "Cm Sup4", email: "cm4.sup@x.com" }, as: Manager, captures: { sup_e: $.data.id } }
            - { call: "POST /arc/associations/${assoc_sup}/owners", payload: { full_name: "Cm Sup5", email: "cm5.sup@x.com" }, as: Manager, captures: { sup_f: $.data.id } }
            - { call: "POST /arc/associations/${assoc_plu}/owners", payload: { full_name: "Ap Plu", email: "ap.plu@x.com" }, as: Manager, captures: { plu_a: $.data.id } }
            - { call: "POST /arc/associations/${assoc_plu}/owners", payload: { full_name: "Cm Plu1", email: "cm1.plu@x.com" }, as: Manager, captures: { plu_b: $.data.id } }
            - { call: "POST /arc/associations/${assoc_plu}/owners", payload: { full_name: "Cm Plu2", email: "cm2.plu@x.com" }, as: Manager, captures: { plu_c: $.data.id } }
            - { call: "POST /arc/associations/${assoc_plu}/owners", payload: { full_name: "Cm Plu3", email: "cm3.plu@x.com" }, as: Manager, captures: { plu_d: $.data.id } }
            - { call: "POST /arc/associations/${assoc_plu}/owners", payload: { full_name: "Cm Plu4", email: "cm4.plu@x.com" }, as: Manager, captures: { plu_e: $.data.id } }
            - { call: "POST /arc/associations/${assoc_plu}/owners", payload: { full_name: "Cm Plu5", email: "cm5.plu@x.com" }, as: Manager, captures: { plu_f: $.data.id } }
            - { call: "POST /arc/associations/${assoc_sup}/properties", payload: { lot_number: "SU-1", address: "1 Super Ct", primary_owner_id: "${sup_a}" }, as: Manager, captures: { prop_sup: $.data.id } }
            - { call: "POST /arc/associations/${assoc_plu}/properties", payload: { lot_number: "PL-1", address: "1 Plural Ct", primary_owner_id: "${plu_a}" }, as: Manager, captures: { prop_plu: $.data.id } }
            - { call: "POST /arc/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T09:00:00Z" }, as: Manager }
            - { call: "POST /arc/properties/${prop_sup}/applications", payload: { owner_id: "${sup_a}", project_type: ROOF, guideline_section: "SEC-7.1", description: "roof replacement", requested_window_start: "2026-06-01", requested_window_end: "2026-07-15" }, as: Homeowner, as_user_id: "${sup_a}", captures: { app_sup: $.data.id } }
            - { call: "POST /arc/applications/${app_sup}/attachments", payload: { kind: DRAWING, label: "roof plan", uri: "s3://sup/d1" }, as: Homeowner, as_user_id: "${sup_a}" }
            - { call: "POST /arc/applications/${app_sup}/attachments", payload: { kind: MATERIAL_SAMPLE, label: "shingle", uri: "s3://sup/m1" }, as: Homeowner, as_user_id: "${sup_a}" }
            - { call: "POST /arc/applications/${app_sup}/submit", as: Homeowner, as_user_id: "${sup_a}" }
            - { call: "POST /arc/applications/${app_sup}/start-review", as: Manager }
            - { call: "POST /arc/properties/${prop_plu}/applications", payload: { owner_id: "${plu_a}", project_type: ROOF, guideline_section: "SEC-7.1", description: "roof replacement", requested_window_start: "2026-06-01", requested_window_end: "2026-07-15" }, as: Homeowner, as_user_id: "${plu_a}", captures: { app_plu: $.data.id } }
            - { call: "POST /arc/applications/${app_plu}/attachments", payload: { kind: DRAWING, label: "roof plan", uri: "s3://plu/d1" }, as: Homeowner, as_user_id: "${plu_a}" }
            - { call: "POST /arc/applications/${app_plu}/attachments", payload: { kind: MATERIAL_SAMPLE, label: "shingle", uri: "s3://plu/m1" }, as: Homeowner, as_user_id: "${plu_a}" }
            - { call: "POST /arc/applications/${app_plu}/submit", as: Homeowner, as_user_id: "${plu_a}" }
            - { call: "POST /arc/applications/${app_plu}/start-review", as: Manager }
            - { call: "POST /arc/applications/${app_sup}/votes", payload: { ballot: APPROVE }, as: CommitteeMember, as_user_id: "${sup_b}" }
            - { call: "POST /arc/applications/${app_sup}/votes", payload: { ballot: APPROVE }, as: CommitteeMember, as_user_id: "${sup_c}" }
            - { call: "POST /arc/applications/${app_sup}/votes", payload: { ballot: APPROVE }, as: CommitteeMember, as_user_id: "${sup_d}" }
            - { call: "POST /arc/applications/${app_sup}/votes", payload: { ballot: DENY }, as: CommitteeMember, as_user_id: "${sup_e}" }
            - { call: "POST /arc/applications/${app_sup}/votes", payload: { ballot: DENY }, as: CommitteeMember, as_user_id: "${sup_f}" }
            - { call: "POST /arc/applications/${app_plu}/votes", payload: { ballot: APPROVE }, as: CommitteeMember, as_user_id: "${plu_b}" }
            - { call: "POST /arc/applications/${app_plu}/votes", payload: { ballot: APPROVE }, as: CommitteeMember, as_user_id: "${plu_c}" }
            - { call: "POST /arc/applications/${app_plu}/votes", payload: { ballot: APPROVE }, as: CommitteeMember, as_user_id: "${plu_d}" }
            - { call: "POST /arc/applications/${app_plu}/votes", payload: { ballot: DENY }, as: CommitteeMember, as_user_id: "${plu_e}" }
            - { call: "POST /arc/applications/${app_plu}/votes", payload: { ballot: DENY }, as: CommitteeMember, as_user_id: "${plu_f}" }
          trigger:
            - { call: "POST /arc/applications/${app_sup}/decide", payload: { conditions: ["match existing shingle color"], denial_reason: "insufficient support" }, as: Manager, captures: { sup_status: $.data.status, sup_outcome: $.data.decision_outcome } }
            - { call: "POST /arc/applications/${app_plu}/decide", payload: { conditions: ["match existing shingle color"], denial_reason: "insufficient support" }, as: Manager, captures: { plu_status: $.data.status, plu_outcome: $.data.decision_outcome } }
            - { call: "GET /arc/applications/${app_plu}/permits", as: Manager, captures: { plu_permit: "$.data[0].status" } }
          assert:
            - "SUP application: status == DENIED, decision_outcome == DENIED (3/5 = 0.6 < 2/3 supermajority)"
            - "PLU application: status == APPROVED_WITH_CONDITIONS, decision_outcome == APPROVED (3 > 2 strict plurality)"
            - "PLU permit exists with status == ACTIVE (approval cascade); SUP has no permit"

      - name: fine_accrual_per_day_rounding_order
        grounds:
          - calculations.fine_accrual
          - entities.Fine.fields.accrued_cents
          - entities.Fine.fields.escalation_multiplier_bp_snapshot
        distinguishing_aspect: |
          Mode (b) nested rounding: daily_fine_cents=333 with multiplier 15000bp gives a raw
          escalated increment of 499.5 cents; the scaffold pins round-half-up PER DAY then sum
          (3 days -> 1500), whereas sum-then-round would give 1499. Assert pins 1500.
        test_recipe:
          setup:
            - "Association R: TIERED_ESCALATION, grace_days=0, daily_fine_cents=333, escalation_multiplier_bp=15000, base_fine_cents=0"
            - "Violation reported at logical 2026-05-01; fine ACCRUING with accrued_cents == 0"
          setup_api_calls:
            - { call: "POST /arc/associations", payload: { name: "Round HOA", statutory_response_days: 30, counting_mode: CALENDAR, fine_mode: TIERED_ESCALATION, base_fine_cents: 0, daily_fine_cents: 333, grace_days: 0, escalation_multiplier_bp: 15000, lien_threshold_cents: 1000000, committee_size: 5, quorum_min: 3, supermajority_required: true, max_window_days: 180 }, as: Manager, captures: { assoc_r: $.data.id } }
            - { call: "POST /arc/associations/${assoc_r}/owners", payload: { full_name: "Ray R", email: "ray@x.com" }, as: Manager, captures: { owner_r: $.data.id } }
            - { call: "POST /arc/associations/${assoc_r}/properties", payload: { lot_number: "R-1", address: "1 Round Rd", primary_owner_id: "${owner_r}" }, as: Manager, captures: { prop_r: $.data.id } }
            - { call: "POST /arc/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T09:00:00Z" }, as: Manager }
            - { call: "POST /arc/properties/${prop_r}/violations", payload: { kind: UNAPPROVED_WORK, description: "unapproved deck" }, as: Manager, captures: { vio_r: $.data.id } }
          trigger:
            - { call: "POST /arc/_clock/set_current_utc", payload: { to_iso8601: "2026-05-04T09:00:00Z" }, as: Manager }
            - { call: "POST /arc/_sweeps/daily", as: Manager }
            - { call: "GET /arc/violations/${vio_r}/fines", as: Manager, captures: { r_accrued: "$.data[0].accrued_cents" } }
          assert:
            - "Fine of violation ${vio_r}: accrued_cents == 1500 (3 days x round_half_up(333*15000/10000)=500 per day)"
            - "accrued_cents != 1499 (the forbidden sum-then-round alternative)"

  # =================================================================
  # Rule 3 — non_linear_state_machine (cyclic loops on different
  #           entities: Application revision cycle, Inspection cycle)
  # =================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: application_revision_loop_cycles
        grounds:
          - state_machines.Application.UNDER_REVIEW_to_REVISION_REQUESTED
          - state_machines.Application.REVISION_REQUESTED_to_UNDER_REVIEW
          - entities.Application.fields.applicant_hold_days
        distinguishing_aspect: |
          Application machine is cyclic: UNDER_REVIEW -> REVISION_REQUESTED -> UNDER_REVIEW
          traversed twice in one lifecycle, with applicant_hold_days accumulating 3 + 2 = 5
          whole days across the two holds. Companion instance exercises the Inspection cycle
          on a different entity.
        test_recipe:
          setup:
            - "Standard association (statutory 30, CALENDAR); complete application SUBMITTED and UNDER_REVIEW at 2026-05-01"
          setup_api_calls:
            - { call: "POST /arc/associations", payload: { name: "Loop HOA", statutory_response_days: 30, counting_mode: CALENDAR, fine_mode: SIMPLE_DAILY, base_fine_cents: 10000, daily_fine_cents: 1000, lien_threshold_cents: 1000000, committee_size: 5, quorum_min: 3, supermajority_required: true, max_window_days: 180 }, as: Manager, captures: { assoc: $.data.id } }
            - { call: "POST /arc/associations/${assoc}/owners", payload: { full_name: "Ann A", email: "ann.a@x.com" }, as: Manager, captures: { owner_a: $.data.id } }
            - { call: "POST /arc/associations/${assoc}/owners", payload: { full_name: "Cid B", email: "cid.b@x.com" }, as: Manager, captures: { owner_b: $.data.id } }
            - { call: "POST /arc/associations/${assoc}/properties", payload: { lot_number: "L-1", address: "1 Loop Ln", primary_owner_id: "${owner_a}" }, as: Manager, captures: { prop: $.data.id } }
            - { call: "POST /arc/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T09:00:00Z" }, as: Manager }
            - { call: "POST /arc/properties/${prop}/applications", payload: { owner_id: "${owner_a}", project_type: PAINT, guideline_section: "SEC-3.1", description: "repaint trim", requested_window_start: "2026-06-01", requested_window_end: "2026-07-15" }, as: Homeowner, as_user_id: "${owner_a}", captures: { app: $.data.id } }
