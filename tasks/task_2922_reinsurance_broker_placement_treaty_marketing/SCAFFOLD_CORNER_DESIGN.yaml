      - name: contract_documents_and_renewal_reports_are_immutable_append_only_rows
        claim_type: Immutability
        grounds:
          - entities.ContractDocument.common_fields
          - entities.RenewalReport.common_fields
          - endpoints.GET /programs/{program_id}/contract-documents
          - endpoints.POST /programs/{program_id}/contract-documents
        distinguishing_aspect: |
          ContractDocument and RenewalReport declare common_fields false: they expose id and
          created_at but no version and no updated_at, §1.5 declares no PATCH or DELETE for either,
          and filing a second SLIP-generation document appends a new row rather than mutating the
          first — the collection GET grows from 1 to 2 while the first row's id is unchanged.
        test_recipe:
