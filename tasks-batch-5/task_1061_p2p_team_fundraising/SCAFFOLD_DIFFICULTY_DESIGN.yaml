              as: CampaignManager
              as_user_id: "${org_id}"
            - call: "POST /api/campaigns"
              payload: { organization_id: "${org_id}", title: "Campaign B", goal_amount_cents: 1000000 }
              as: CampaignManager
              as_user_id: "${org_id}"
              captures: { camp_b_id: $.data.id }
            - call: "POST /api/campaigns/${camp_b_id}/publish"
