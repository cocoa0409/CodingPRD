            - "at the touching boundary: ${touch} == 'ERR_CRANE_WINDOW_CONFLICT' — [10:30, 12:45] shares only the single instant 10:30 with M-01's expanded interval, and touching endpoints count as overlap"
            - "one buffer step later: the 11:30 pick succeeds, ${ok_start} == '2026-09-10T11:30:00Z' and ${util} == 85.00 — [10:45, 13:00] clears [08:15, 10:30] by 15 minutes"
            - "GET /modular/modules/${m2} reports pick_window_start == '2026-09-10T11:30:00Z'; the two rejected attempts left no partial reservation"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: factory_committed_line_minutes_returns_to_zero_after_release_reslot_and_line_completion
        grounds:
          - entities.Factory.fields.committed_line_minutes
          - state_machines[ModuleUnit.production_status]
          - endpoints[POST /modular/modules/{moduleId}/release-line-slot]
          - endpoints[POST /modular/modules/{moduleId}/advance-station]
          - calculations.line_slot_schedule
        conserved_quantity: |
          factory.committed_line_minutes == the sum of line_slot_minutes over every ModuleUnit of
          that factory whose production_status IN {SLOTTED, IN_LINE}
        distinguishing_aspect: |
          A minutes-of-capacity ledger, conserved across three different reversals of the same
          reservation — an explicit release, a re-reservation, and the implicit release when the
          module leaves the line at LINE_COMPLETE. The invariant is checked after every step, so an
          implementation that only decrements on the explicit release (or double-decrements at
          completion) drifts and is caught.
        test_recipe:
          setup:
            - "clock at 2026-09-01T08:00:00Z; FROZEN R1 with an APPROVED plan review"
            - "single module M-01 PLANNED at an otherwise idle plant"
          setup_api_calls:
            - call: "POST /modular/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T08:00:00Z" }
              as: ProgramAdmin
            - call: "POST /modular/factories"
              payload: { name: "Puget Modular Plant 1", code: "PMP1", takt_minutes: 90, station_count: 6, parallel_station_capacity: 2, wip_unit_value_cents: 8750000 }
              as: ProgramAdmin
              captures: { fac: "$.data.id", ledger0: "$.data.committed_line_minutes" }
            - call: "POST /modular/projects"
              payload: { name: "Rainier Flats", factory_id: "${fac}", state_code: "WA", ahj_code: "SEA", planned_module_count: 4, contract_price_cents: 3200000000, crane_capacity_chart: [{ radius_ft: 90, capacity_lb: 96000 }] }
              as: ProgramAdmin
              captures: { proj: "$.data.id", projv: "$.data.version" }
            - call: "POST /modular/design-packages"
              payload: { project_id: "${proj}", revision_index: 1, module_split_count: 4, expected_project_version: "${projv}", connection_detail_state: "COMPLETE" }
              as: DesignEngineer
              as_user_id: "eng-001"
              captures: { pkg: "$.data.id" }
            - call: "POST /modular/design-packages/${pkg}/submit"
              payload: { review_note: "R1" }
              as: DesignEngineer
              as_user_id: "eng-001"
            - call: "POST /modular/design-packages/${pkg}/review-decision"
              payload: { decision: "FREEZE" }
              as: DesignEngineer
              as_user_id: "eng-002"
            - call: "POST /modular/permits"
              payload: { project_id: "${proj}", track: "STATE_MODULAR_PROGRAM", scope: "PLAN_REVIEW" }
              as: ProgramAdmin
              captures: { permit: "$.data.id" }
            - call: "POST /modular/permits/${permit}/decide"
              payload: { decision: "APPROVE" }
              as: StateProgramOfficer
            - call: "POST /modular/modules"
              payload: { project_id: "${proj}", design_package_id: "${pkg}", module_code: "M-01", set_sequence_index: 1, width_in: 180, length_in: 600, height_in: 156, gross_weight_lb: 76600 }
              as: FactoryProductionManager
              as_user_id: "${fac}"
              captures: { m1: "$.data.id" }
          trigger:
            - call: "POST /modular/modules/${m1}/schedule-line-slot"
              payload: { line_slot_start: "2026-09-02T14:00:00Z" }
              as: FactoryProductionManager
              as_user_id: "${fac}"
              captures: { mins1: "$.data.line_slot_minutes" }
            - call: "GET /modular/factories/${fac}"
              as: FactoryProductionManager
              as_user_id: "${fac}"
              captures: { ledger1: "$.data.committed_line_minutes" }
            - call: "POST /modular/modules/${m1}/release-line-slot"
              payload: { reason: "sheathing shortage" }
              as: FactoryProductionManager
              as_user_id: "${fac}"
              captures: { mins2: "$.data.line_slot_minutes" }
            - call: "GET /modular/factories/${fac}"
              as: FactoryProductionManager
              as_user_id: "${fac}"
              captures: { ledger2: "$.data.committed_line_minutes" }
            - call: "POST /modular/modules/${m1}/schedule-line-slot"
              payload: { line_slot_start: "2026-09-04T14:00:00Z" }
              as: FactoryProductionManager
              as_user_id: "${fac}"
              captures: { mins3: "$.data.line_slot_minutes" }
            - call: "GET /modular/factories/${fac}"
              as: FactoryProductionManager
              as_user_id: "${fac}"
              captures: { ledger3: "$.data.committed_line_minutes" }
            - call: "POST /modular/modules/${m1}/advance-station"
              payload: { stations_advanced: 6 }
              as: FactoryProductionManager
              as_user_id: "${fac}"
              captures: { pstatus: "$.data.production_status" }
            - call: "GET /modular/factories/${fac}"
              as: FactoryProductionManager
              as_user_id: "${fac}"
              captures: { ledger4: "$.data.committed_line_minutes" }
          assert:
            - "${ledger0} == 0 — a new plant starts with an empty ledger"
            - "${mins1} == 540 and ${ledger1} == 540 — the reservation is booked"
            - "${mins2} == 0 and ${ledger2} == 0 — the explicit release reverses exactly what it booked, back to the starting value"
            - "${mins3} == 540 and ${ledger3} == 540 — re-reserving on an idle line books the same 540 minutes, proving no residue was left behind"
            - "${pstatus} == 'LINE_COMPLETE' and ${ledger4} == 0 — leaving the line releases the reservation implicitly, and the release is not applied twice (a negative ledger is a failure)"
            - "GET /modular/modules/${m1} reports line_slot_minutes == 0 and station_index == 6"
            - "GET /modular/modules?production_status=SLOTTED returns an empty list, so the invariant sum over {SLOTTED, IN_LINE} is 0 and matches the ledger"

      - name: project_wip_certified_cents_reverses_exactly_on_draw_rejection
        grounds:
          - entities.Project.fields.wip_certified_cents
          - entities.DrawRequest.fields.certified_cents
          - calculations.draw_certification_amount
          - endpoints[POST /modular/draw-requests/{drawId}/certify]
          - endpoints[POST /modular/draw-requests/{drawId}/reject]
        conserved_quantity: |
          project.wip_certified_cents == the sum of certified_cents over the project's DrawRequests
          in status IN {CERTIFIED, FUNDED}
        distinguishing_aspect: |
          A different conserved quantity in a different unit (money, on the Project rather than
          minutes on the Factory) and a different reversal mechanism: rejecting a CERTIFIED draw must
          subtract precisely the amount that was added AND zero the draw's own certified /
          retainage / net fields, so re-certifying the identical work through a fresh draw lands on
          exactly the same number with no drift and no double count.
        test_recipe:
          setup:
            - "clock at 2026-09-01T08:00:00Z; FROZEN R1 with an APPROVED plan review; agency CIS ACCREDITED in WA"
            - "module M-01 LINE_COMPLETE at station 6, so its WIP is the full 8_750_000"
            - "no draw has been certified yet"
          setup_api_calls:
            - call: "POST /modular/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T08:00:00Z" }
              as: ProgramAdmin
            - call: "POST /modular/factories"
              payload: { name: "Puget Modular Plant 1", code: "PMP1", takt_minutes: 90, station_count: 6, parallel_station_capacity: 2, wip_unit_value_cents: 8750000 }
              as: ProgramAdmin
              captures: { fac: "$.data.id" }
            - call: "POST /modular/projects"
              payload: { name: "Rainier Flats", factory_id: "${fac}", state_code: "WA", ahj_code: "SEA", planned_module_count: 4, contract_price_cents: 3200000000, crane_capacity_chart: [{ radius_ft: 90, capacity_lb: 96000 }] }
              as: ProgramAdmin
              captures: { proj: "$.data.id", projv: "$.data.version", wip0: "$.data.wip_certified_cents" }
            - call: "POST /modular/design-packages"
              payload: { project_id: "${proj}", revision_index: 1, module_split_count: 4, expected_project_version: "${projv}", connection_detail_state: "COMPLETE" }
              as: DesignEngineer
              as_user_id: "eng-001"
              captures: { pkg: "$.data.id" }
            - call: "POST /modular/design-packages/${pkg}/submit"
              payload: { review_note: "R1" }
              as: DesignEngineer
              as_user_id: "eng-001"
            - call: "POST /modular/design-packages/${pkg}/review-decision"
              payload: { decision: "FREEZE" }
              as: DesignEngineer
              as_user_id: "eng-002"
            - call: "POST /modular/permits"
              payload: { project_id: "${proj}", track: "STATE_MODULAR_PROGRAM", scope: "PLAN_REVIEW" }
              as: ProgramAdmin
              captures: { permit: "$.data.id" }
            - call: "POST /modular/permits/${permit}/decide"
              payload: { decision: "APPROVE" }
              as: StateProgramOfficer
            - call: "POST /modular/agencies"
              payload: { name: "Cascade Inspection Services", agency_code: "CIS", accredited_state_codes: ["WA"], per_inspection_fee_cents: 120000 }
              as: ProgramAdmin
              captures: { agency: "$.data.id" }
            - call: "POST /modular/modules"
              payload: { project_id: "${proj}", design_package_id: "${pkg}", module_code: "M-01", set_sequence_index: 1, width_in: 180, length_in: 600, height_in: 156, gross_weight_lb: 76600 }
              as: FactoryProductionManager
              as_user_id: "${fac}"
              captures: { m1: "$.data.id" }
            - call: "POST /modular/modules/${m1}/schedule-line-slot"
              payload: { line_slot_start: "2026-09-02T14:00:00Z" }
              as: FactoryProductionManager
              as_user_id: "${fac}"
            - call: "POST /modular/modules/${m1}/advance-station"
              payload: { stations_advanced: 6 }
              as: FactoryProductionManager
              as_user_id: "${fac}"
          trigger:
            - call: "POST /modular/draw-requests"
              payload: { project_id: "${proj}", draw_index: 1, basis_mode: "WIP_DEPOSIT", certifying_agency_id: "${agency}" }
              as: LenderDrawAdministrator
              captures: { d1: "$.data.id", req1: "$.data.requested_cents" }
            - call: "POST /modular/draw-requests/${d1}/certify"
              payload: { certification_note: "station 6 complete" }
              as: LenderDrawAdministrator
              captures: { c1: "$.data.certified_cents", r1: "$.data.retainage_held_cents", n1: "$.data.net_funded_cents" }
            - call: "GET /modular/projects/${proj}"
              as: LenderDrawAdministrator
              captures: { wip1: "$.data.wip_certified_cents" }
            - call: "POST /modular/draw-requests/${d1}/reject"
              payload: { reject_reason: "lender inspection report unsigned" }
              as: LenderDrawAdministrator
              captures: { st1: "$.data.status", c1b: "$.data.certified_cents", r1b: "$.data.retainage_held_cents", n1b: "$.data.net_funded_cents" }
            - call: "GET /modular/projects/${proj}"
              as: LenderDrawAdministrator
              captures: { wip2: "$.data.wip_certified_cents" }
            - call: "POST /modular/draw-requests"
              payload: { project_id: "${proj}", draw_index: 2, basis_mode: "WIP_DEPOSIT", certifying_agency_id: "${agency}" }
              as: LenderDrawAdministrator
              captures: { d2: "$.data.id" }
            - call: "POST /modular/draw-requests/${d2}/certify"
              payload: { certification_note: "re-certified with the signed report" }
              as: LenderDrawAdministrator
              captures: { c2: "$.data.certified_cents", r2: "$.data.retainage_held_cents", n2: "$.data.net_funded_cents" }
            - call: "GET /modular/projects/${proj}"
              as: LenderDrawAdministrator
              captures: { wip3: "$.data.wip_certified_cents", funded3: "$.data.funded_to_date_cents" }
          assert:
            - "${wip0} == 0 and ${req1} == 1750000 (20% of 8750000)"
            - "${c1} == 1750000, ${r1} == 87500, ${n1} == 1662500 and ${wip1} == 1750000"
            - "${st1} == 'REJECTED' with ${c1b} == 0, ${r1b} == 0 and ${n1b} == 0 — the draw's own money fields are zeroed"
            - "${wip2} == 0 — the reversal subtracts exactly the amount that was added, returning the ledger to its starting value"
            - "${c2} == 1750000, ${r2} == 87500, ${n2} == 1662500 and ${wip3} == 1750000 — the same underlying work re-certifies to the identical amount, so nothing was double counted and nothing leaked"
            - "${funded3} == 0 — rejection and certification never touch the funded ledger"
            - "GET /modular/draw-requests?project_id=${proj}&status=CERTIFIED returns only the second draw, so the invariant sum over {CERTIFIED, FUNDED} equals wip_certified_cents"
