            - "BypassCase.${case1}.primary_device_id == ${d1} and backup_device_id == ${d2}"

      - name: cancel_is_offered_only_from_the_four_pre_bypass_states
        claim_type: conditional_action
        grounds:
          - endpoints[POST /bypass-cases/{id}/cancel]
          - validations[priority=33]
          - errors.ERR_CASE_NOT_CANCELLABLE
        distinguishing_aspect: |
          Cancellation is admitted from SCHEDULED, STAFFED, PACK_CONFIGURED and SETUP_VERIFIED and refused
          from ON_BYPASS onward, and the accepted cancel must reverse every accrual and reservation it
          finds.
        excluded_because:
          difficulty_instance: "compensating_invariant / assign_supersede_then_cancel_restores_contract_accrual_ledger"
          rationale: |
            That instance cancels from a pre-bypass state and asserts the full reversal of the contract
            ledger, while the out-of-range refusal is already asserted by the corner instance
            closed_case_is_locked_against_all_seven_case_triggers.

  - section: errors
    instances:
      - name: auth_ladder_rejects_missing_headers_bad_role_unknown_actor_and_non_chief
        claim_type: error_triggerability
        grounds:
          - validations[priority=1]
          - validations[priority=2]
          - validations[priority=4]
          - validations[priority=5]
          - errors.ERR_MISSING_AUTH_HEADERS
          - errors.ERR_INVALID_ROLE
          - errors.ERR_ACTOR_NOT_FOUND
          - errors.ERR_NOT_CHIEF_PERFUSIONIST
          - roles.ChiefPerfusionist
        distinguishing_aspect: |
          The first five priorities form a strict ladder on identity alone: absent headers answer 401
          ERR_MISSING_AUTH_HEADERS, a role string outside the five declared roles answers 401
          ERR_INVALID_ROLE, an entity-backed role whose X-User-ID resolves to nothing answers 403
          ERR_ACTOR_NOT_FOUND, and a real Perfusionist with is_chief == false claiming ChiefPerfusionist
          answers 403 ERR_NOT_CHIEF_PERFUSIONIST rather than being silently downgraded.
        test_recipe:
          setup:
            - "Contract c1, a rank-and-file perfusionist p1 (is_chief false) and a chief (is_chief true)."
          setup_api_calls:
            - call: "POST /hospital-contracts"
              payload: { hospital_name: "St Aldate Cardiac Center", staffing_model: "COVERAGE_PLUS_PER_CASE", per_case_fee_cents: 400000, ecmo_hourly_fee_cents: 90000, monthly_case_cap: 5, monthly_coverage_fee_cents: 1200000 }
              as: ContractAdmin
              captures: { c1: $.data.id }
            - call: "POST /perfusionists"
              payload: { full_name: "Rafe Mbeki", employee_code: "EMP-1001", ecmo_privileged: true, career_case_count: 150 }
              as: ContractAdmin
              captures: { p1: $.data.id }
            - call: "POST /perfusionists"
              payload: { full_name: "Dr Yusra Halabi", employee_code: "EMP-1002", is_chief: true, career_case_count: 200 }
              as: ContractAdmin
              captures: { chief: $.data.id }
          trigger:
            - call: "GET /bypass-cases"
              payload: { limit: 10, offset: 0 }
              as: "(no X-User-Role header sent, no X-User-ID header sent)"
              captures: { e_headers: $.data.error_id }
            - call: "GET /bypass-cases"
              payload: { limit: 10, offset: 0 }
              as: "PerfusionAssistant"
              as_user_id: "${p1}"
              captures: { e_role: $.data.error_id }
            - call: "GET /bypass-cases"
              payload: { limit: 10, offset: 0 }
              as: Perfusionist
              as_user_id: "00000000-0000-4000-8000-000000000000"
              captures: { e_actor: $.data.error_id }
            - call: "GET /hospital-contracts/${c1}"
              as: ChiefPerfusionist
              as_user_id: "${p1}"
              captures: { e_not_chief: $.data.error_id }
            - call: "GET /hospital-contracts/${c1}"
              as: ChiefPerfusionist
              as_user_id: "${chief}"
          assert:
            - "${e_headers} == ERR_MISSING_AUTH_HEADERS with HTTP 401"
            - "${e_role} == ERR_INVALID_ROLE with HTTP 401 - 'PerfusionAssistant' is not one of the five declared roles, and this outranks the fact that the endpoint would have admitted the actor"
            - "${e_actor} == ERR_ACTOR_NOT_FOUND with HTTP 403 - Perfusionist is entity-backed, so an unresolvable X-User-ID fails at priority 4"
            - "${e_not_chief} == ERR_NOT_CHIEF_PERFUSIONIST with HTTP 403 - p1 resolves but has is_chief == false"
            - "the final call returns HTTP 200 with HospitalContract.${c1}.hospital_name == 'St Aldate Cardiac Center' - the same request from a real chief is admitted"
            - "every error response carries response_type == 'error' and a non-empty data.message alongside data.error_id"

      - name: error_and_success_envelopes_carry_the_declared_shape_and_status_codes
        claim_type: error_triggerability
        grounds:
          - response_envelope.error
          - response_envelope.success
          - errors.ERR_CONTRACT_NOT_FOUND
          - errors.ERR_INVALID_REQUEST
          - errors.ERR_CASE_NOT_SETUP_VERIFIED
