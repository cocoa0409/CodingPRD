  # =========================================================================
  # Rule 5 — Validation priority conflicts across different error-category pairs
  # =========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: discharge_state_beats_discharge_prerequisite
        grounds:
          - validations[priority=5]
          - validations[priority=10]
        distinguishing_aspect: |
          Error-category pair STATE (priority 5, ERR_INVALID_STATE) vs BUSINESS_REFERENTIAL
          (priority 10, ERR_DISCHARGE_PREREQUISITE). A newborn still in ROOMING_IN (not
          DISCHARGE_READY) and lacking any ISSUED bag violates both; the higher-priority state
          check wins, so ERR_INVALID_STATE is returned, not ERR_DISCHARGE_PREREQUISITE.
        test_recipe:
          setup:
            - "Clock at 2026-03-05T12:00:00Z."
            - "A ROOMING_IN newborn with NO discharge bag and NO birth-cert filing."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-05T12:00:00Z" }
              as: RegistrySupervisor
            - call: "POST /insurance-policies"
              payload: { carrier_name: "EmpCo", subscriber_name: "Pat Doe", plan_type: "EMPLOYER_GROUP", coverage_effective_date: "2026-01-01", dependent_slots_max: 3 }
              as: BenefitsCoordinator
              captures: { policy_id: $.data.id }
            - call: "POST /registrations"
              payload: { mother_full_name: "Pat Doe", mother_dob: "1992-05-01", due_date: "2026-03-12", payer_policy_id: "${policy_id}", planned_delivery_facility: "Mercy" }
              as: IntakeClerk
              captures: { reg_id: $.data.id }
            - call: "POST /registrations/${reg_id}/submit"
              payload: {}
              as: IntakeClerk
            - call: "POST /registrations/${reg_id}/admit"
              payload: {}
              as: IntakeClerk
            - call: "POST /registrations/${reg_id}/newborns"
              payload: { birth_datetime: "2026-03-05T10:00:00Z", birth_sequence: 1, weight_grams: 3200, gestational_age_weeks: 39, apgar_5min: 9 }
              as: AttendingNurse
              captures: { nb_id: $.data.id }
            - call: "POST /newborns/${nb_id}/room-in"
              payload: {}
              as: AttendingNurse
          trigger:
            - call: "POST /newborns/${nb_id}/discharge"
              payload: {}
              as: AttendingNurse
              captures: { err: $.data.error_id }
          assert:
            - "response_type == error"
            - "data.error_id == ERR_INVALID_STATE"

      - name: approve_sep_window_beats_slots_exhausted
        grounds:
          - validations[priority=12]
          - validations[priority=16]
        distinguishing_aspect: |
          Error-category pair BUSINESS_TEMPORAL (priority 12, ERR_SEP_WINDOW_CLOSED) vs
          BUSINESS_FISCAL (priority 16, ERR_DEPENDENT_SLOTS_EXHAUSTED) — a different pair from
          the state/referential conflict above. An enrollment requested past the SEP deadline
          AND against a slot-exhausted policy returns the higher-priority ERR_SEP_WINDOW_CLOSED.
        test_recipe:
          setup:
            - "Clock at 2026-05-01T12:00:00Z."
            - "A MARKETPLACE policy with dependent_slots_max 1, already exhausted by one ENROLLED dependent (newbornA)."
            - "NewbornB with birth_datetime 2026-03-05T10:00:00Z (SEP deadline 2026-04-04T10:00:00Z) and a PENDING enrollment whose requested_at is 2026-04-30T12:00:00Z (past deadline)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-06T12:00:00Z" }
              as: RegistrySupervisor
            - call: "POST /insurance-policies"
              payload: { carrier_name: "MktCo", subscriber_name: "Pat Doe", plan_type: "MARKETPLACE", coverage_effective_date: "2026-01-01", dependent_slots_max: 1 }
              as: BenefitsCoordinator
              captures: { policy_id: $.data.id }
            - call: "POST /registrations"
              payload: { mother_full_name: "Pat Doe", mother_dob: "1992-05-01", due_date: "2026-03-12", payer_policy_id: "${policy_id}", planned_delivery_facility: "Mercy" }
              as: IntakeClerk
              captures: { reg_id: $.data.id }
            - call: "POST /registrations/${reg_id}/submit"
              payload: {}
              as: IntakeClerk
            - call: "POST /registrations/${reg_id}/admit"
              payload: {}
              as: IntakeClerk
            - call: "POST /registrations/${reg_id}/newborns"
              payload: { birth_datetime: "2026-03-05T10:00:00Z", birth_sequence: 1, weight_grams: 3200, gestational_age_weeks: 39, apgar_5min: 9 }
              as: AttendingNurse
              captures: { nb_a: $.data.id }
            - call: "POST /registrations/${reg_id}/newborns"
              payload: { birth_datetime: "2026-03-05T10:00:00Z", birth_sequence: 2, weight_grams: 3100, gestational_age_weeks: 39, apgar_5min: 9 }
              as: AttendingNurse
              captures: { nb_b: $.data.id }
