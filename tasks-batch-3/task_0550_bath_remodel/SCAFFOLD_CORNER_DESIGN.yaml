        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[quote-create-stale-project]", "errors[ERR_STALE_PROJECT_VERSION]"]
        distinguishing_aspect: "After one quote-create advances Project.version, a second create still carrying the pre-create version is rejected 412 ERR_STALE_PROJECT_VERSION."
        test_recipe:
          setup: ["A DESIGN_COMPLETE project; version observed BEFORE the first quote-create; first quote created (version advances)"]
          setup_api_calls:
            - call: "POST /designers"
              payload: { full_name: "Dee D", email: "dee24@x.com", region_state_code: "CA" }
              as: PlatformAdmin
              captures: { des_id: $.data.id }
            - call: "POST /customers"
              payload: { full_name: "Ada A", email: "ada30@x.com", phone: "555-62", street_address: "62 Way", city: "LA", state_code: "CA", postal_code: "90062" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /projects"
              payload: { customer_id: "${cust_id}", state_code: "CA", bathroom_type: "FULL_BATH" }
              as: InstallCoordinator
              captures: { proj_id: $.data.id }
            - call: "POST /design-appointments"
              payload: { project_id: "${proj_id}", designer_id: "${des_id}", scheduled_start: "2026-05-10T14:00:00Z", scheduled_end: "2026-05-10T15:00:00Z" }
              as: InstallCoordinator
              captures: { appt_id: $.data.id }
            - call: "POST /design-appointments/${appt_id}/complete"
              payload: { measured_wall_area_sqft: 100 }
              as: Designer
              as_user_id: "${des_id}"
            - call: "GET /projects/${proj_id}"
              payload: {}
              as: InstallCoordinator
              captures: { p_v: $.data.version }
            - call: "POST /quotes"
              payload: { project_id: "${proj_id}", wall_system: "TILE_LOOK_ACRYLIC", color: "WHITE", expected_project_version: "${p_v}" }
              as: Designer
              as_user_id: "${des_id}"
              captures: { q1: $.data.id }
          trigger:
            - call: "POST /quotes"
              payload: { project_id: "${proj_id}", wall_system: "STONE_LOOK_ACRYLIC", color: "BONE", expected_project_version: "${p_v}" }
