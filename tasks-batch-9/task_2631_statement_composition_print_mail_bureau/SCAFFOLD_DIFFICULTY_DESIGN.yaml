            - call: "POST /bureau/data-files/${es_file_id}/control-check"
              payload: {}
              as: CompositionOperator
            - call: "POST /bureau/press-lines"
              payload: { line_code: "PL-ES", capabilities: ["DUPLEX", "COLOR", "INSERT"], sheets_per_hour: 600, daily_sheet_capacity: 9000, changeover_buffer_minutes: 30 }
              as: BureauAdmin
              captures: { es_line_id: "$.data.id" }
