            - "the fourth submit returns ERR_INVALID_STATE_TRANSITION with http_status 409 because revision_round == MAX_REVISION_ROUNDS 2"
            - "DealRegistration.${regc_id}.status == CHANGES_REQUESTED after the refused submit"
            - "DealRegistration.${regc_id}.revision_round == 2 after the refused submit (no increment on a refused loop)"
            - "DealRegistration.${regc_id}.submitted_at == 2026-03-03T00:00:00.000Z after the refused submit (the chronological key was not advanced to 2026-03-04)"
            - "DealRegistration.${regc_id}.closure_reason == final clarification round (the last reviewer_note, written by REQUEST_CHANGES)"
            - "Account.${acc_id}.coverage_state == OPEN_CHANNEL throughout (no approval ever fired)"

      - name: mdf_claim_settlement_dimension_advances_independently_of_validation
        grounds:
          - state_machines.MdfClaim.settlement_state_UNPAID_to_APPROVED_FOR_PAYMENT
          - state_machines.MdfClaim.settlement_state_APPROVED_FOR_PAYMENT_to_PAID
