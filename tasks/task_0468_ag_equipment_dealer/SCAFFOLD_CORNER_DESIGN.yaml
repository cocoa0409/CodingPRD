# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Agricultural Equipment Dealer — Expert tier
# Breadth probe across claim-extraction-guide sections.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_unit_returns_201_with_all_fields
        claim_type: Creation
        grounds: [entities.Unit, endpoints]
        distinguishing_aspect: "POST /units with all required fields returns 201 and a Unit with status AVAILABLE, version 1, floor_planned false."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /units"
              payload: { stock_number: "S-EC-1", condition: "NEW", model_code: "5045E", serial_number: "SN-EC-1", dealer_cost_cents: 3000000, list_price_cents: 4000000 }
              as: DealerAdmin
              captures: { unit_id: $.data.id, st: $.data.status, v: $.data.version }
          assert:
            - "response code == 201"
            - "Unit.${unit_id}.status == AVAILABLE"
            - "Unit.${unit_id}.version == 1"
            - "Unit.${unit_id}.floor_planned == false"

      - name: get_unit_not_found_returns_404
        claim_type: Not Found
        grounds: [entities.Unit, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /units/{id} with a non-existent UUID returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /units/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: DealerAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response code == 404"
            - "response error_id == ERR_NOT_FOUND"

      - name: create_unit_missing_required_field_returns_invalid_request
        claim_type: Required Fields
        grounds: [entities.Unit.fields.serial_number, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /units omitting serial_number (input, no default) returns ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /units"
              payload: { stock_number: "S-MR-1", condition: "NEW", model_code: "5045E", dealer_cost_cents: 3000000, list_price_cents: 4000000 }
              as: DealerAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response code == 422"
            - "response error_id == ERR_INVALID_REQUEST"

      - name: create_unit_default_engine_hours_zero
        claim_type: Defaults
        grounds: [entities.Unit.fields.engine_hours]
        distinguishing_aspect: "Omitting engine_hours applies the default 0."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /units"
              payload: { stock_number: "S-DE-1", condition: "NEW", model_code: "5045E", serial_number: "SN-DE-1", dealer_cost_cents: 3000000, list_price_cents: 4000000 }
              as: DealerAdmin
              captures: { unit_id: $.data.id, eh: $.data.engine_hours }
          assert:
            - "Unit.${unit_id}.engine_hours == 0"

      - name: duplicate_serial_number_returns_duplicate_key
        claim_type: Type Constraints
        grounds: ["validations[priority=5]", "errors[ERR_DUPLICATE_KEY]", entities.Unit.fields.serial_number]
        distinguishing_aspect: "Creating a second Unit with an already-used serial_number returns ERR_DUPLICATE_KEY (409)."
        test_recipe:
          setup: ["one Unit with serial_number SN-DUP exists"]
          setup_api_calls:
            - call: "POST /units"
              payload: { stock_number: "S-DK-1", condition: "NEW", model_code: "5045E", serial_number: "SN-DUP", dealer_cost_cents: 3000000, list_price_cents: 4000000 }
              as: DealerAdmin
          trigger:
            - call: "POST /units"
              payload: { stock_number: "S-DK-2", condition: "NEW", model_code: "5045E", serial_number: "SN-DUP", dealer_cost_cents: 3100000, list_price_cents: 4100000 }
              as: DealerAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response code == 409"
            - "response error_id == ERR_DUPLICATE_KEY"

      - name: create_unit_invalid_enum_condition_returns_invalid_request
        claim_type: Type Constraints
        grounds: [entities.Unit.fields.condition, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /units with condition outside {NEW,USED} returns ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /units"
              payload: { stock_number: "S-IE-1", condition: "REFURB", model_code: "5045E", serial_number: "SN-IE-1", dealer_cost_cents: 3000000, list_price_cents: 4000000 }
              as: DealerAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response code == 422"
            - "response error_id == ERR_INVALID_REQUEST"

      - name: list_units_paginated_envelope
        claim_type: Listing
        grounds: [endpoints, entities.Unit]
        distinguishing_aspect: "GET /units returns a paginated array envelope with total_count and has_more."
        test_recipe:
          setup: ["two Units exist"]
          setup_api_calls:
            - call: "POST /units"
              payload: { stock_number: "S-LP-1", condition: "NEW", model_code: "5045E", serial_number: "SN-LP-1", dealer_cost_cents: 3000000, list_price_cents: 4000000 }
              as: DealerAdmin
            - call: "POST /units"
              payload: { stock_number: "S-LP-2", condition: "USED", model_code: "5055E", serial_number: "SN-LP-2", dealer_cost_cents: 3200000, list_price_cents: 4200000, engine_hours: 500 }
              as: DealerAdmin
          trigger:
            - call: "GET /units"
              payload: { limit: 1, offset: 0 }
              as: SalesRep
          assert:
            - "response_type == array"
            - "meta.total_count == 2"
            - "has_more == true"

      - name: tradein_minted_unit_acquired_from_tradein_lineage
        claim_type: Parent Relationships
        grounds: [entities.Unit.fields.acquired_from_tradein_id, entities.TradeIn.fields.minted_unit_id]
        distinguishing_aspect: "After a trade-in is ACCEPTED via deal funding, the minted Unit's acquired_from_tradein_id equals the TradeIn id (self-referential lineage)."
        test_recipe:
          setup: ["a funded SALE deal with an accepted trade that minted a used Unit"]
          setup_api_calls:
            - call: "POST /customers"
              payload: { name: "Lineage Cust", customer_type: "RETAIL" }
              as: FinanceManager
              captures: { cust_id: $.data.id }
            - call: "POST /units"
              payload: { stock_number: "S-LN-1", condition: "NEW", model_code: "8R280", serial_number: "SN-LN-1", dealer_cost_cents: 6000000, list_price_cents: 8000000 }
              as: DealerAdmin
              captures: { unit_id: $.data.id }
            - call: "POST /trade-ins"
              payload: { customer_id: "${cust_id}", model_code: "7820", serial_number: "SN-LNTR-1", engine_hours: 800, condition_grade: "FAIR", base_value_cents: 5000000 }
              as: SalesRep
              captures: { ti_id: $.data.id }
            - call: "POST /trade-ins/${ti_id}/offer"
              payload: {}
              as: SalesRep
            - call: "POST /deals"
              payload: { unit_id: "${unit_id}", customer_id: "${cust_id}", deal_type: "SALE", sale_price_cents: 8000000, tradein_id: "${ti_id}" }
              as: SalesRep
              captures: { deal_id: $.data.id }
            - call: "POST /deals/${deal_id}/approve"
              payload: {}
              as: FinanceManager
            - call: "GET /units/${unit_id}"
              payload: {}
              as: FinanceManager
              captures: { unit_v: $.data.version }
            - call: "POST /deals/${deal_id}/fund"
              payload: { expected_unit_version: "${unit_v}" }
              as: FinanceManager
          trigger:
            - call: "GET /trade-ins/${ti_id}"
              payload: {}
              as: FinanceManager
              captures: { minted_unit_id: $.data.minted_unit_id }
          assert:
            - "TradeIn.${ti_id}.status == ACCEPTED"
            - "Unit.${minted_unit_id}.acquired_from_tradein_id == ${ti_id}"
            - "Unit.${minted_unit_id}.condition == USED"
            - "Unit.${minted_unit_id}.dealer_cost_cents == 2990000"

      - name: system_field_id_input_ignored_on_create
        claim_type: System Fields
        grounds: [entities.Customer]
        distinguishing_aspect: "POST /customers ignores any client-supplied id-like field; server mints id and version 1."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /customers"
              payload: { name: "Sys Cust", customer_type: "GOVERNMENT", tax_exempt: true }
              as: DealerAdmin
              captures: { cust_id: $.data.id, v: $.data.version }
          assert:
            - "Customer.${cust_id}.version == 1"
            - "Customer.${cust_id}.tax_exempt == true"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: approve_deal_from_already_approved_returns_invalid_state
        claim_type: Idempotency
        grounds: [state_machines.Deal.QUOTED_to_APPROVED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Approving a Deal already APPROVED returns ERR_INVALID_STATE (409); no further side effects."
        test_recipe:
          setup: ["an APPROVED SALE deal"]
          setup_api_calls:
            - call: "POST /customers"
              payload: { name: "Idem Cust", customer_type: "RETAIL" }
              as: FinanceManager
              captures: { cust_id: $.data.id }
            - call: "POST /units"
              payload: { stock_number: "S-ID-1", condition: "NEW", model_code: "6R155", serial_number: "SN-ID-1", dealer_cost_cents: 7000000, list_price_cents: 9000000 }
              as: DealerAdmin
              captures: { unit_id: $.data.id }
            - call: "POST /deals"
              payload: { unit_id: "${unit_id}", customer_id: "${cust_id}", deal_type: "SALE", sale_price_cents: 9000000 }
              as: SalesRep
              captures: { deal_id: $.data.id }
            - call: "POST /deals/${deal_id}/approve"
              payload: {}
              as: FinanceManager
          trigger:
            - call: "POST /deals/${deal_id}/approve"
              payload: {}
              as: FinanceManager
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE"
            - "Deal.${deal_id}.status == APPROVED"

      - name: fund_deal_from_quoted_without_approval_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.Deal.APPROVED_to_FUNDED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Funding a QUOTED (never approved) deal returns ERR_INVALID_STATE; deal stays QUOTED."
        test_recipe:
          setup: ["a QUOTED SALE deal, not yet approved"]
          setup_api_calls:
            - call: "POST /customers"
              payload: { name: "Skip Cust", customer_type: "RETAIL" }
              as: FinanceManager
              captures: { cust_id: $.data.id }
            - call: "POST /units"
              payload: { stock_number: "S-SK-1", condition: "NEW", model_code: "6R175", serial_number: "SN-SK-1", dealer_cost_cents: 7000000, list_price_cents: 9000000 }
              as: DealerAdmin
              captures: { unit_id: $.data.id }
            - call: "POST /deals"
              payload: { unit_id: "${unit_id}", customer_id: "${cust_id}", deal_type: "SALE", sale_price_cents: 9000000 }
              as: SalesRep
              captures: { deal_id: $.data.id, unit_v: $.data.version }
          trigger:
            - call: "POST /deals/${deal_id}/fund"
              payload: { expected_unit_version: "${unit_v}" }
              as: FinanceManager
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE"
            - "Deal.${deal_id}.status == QUOTED"

      - name: terminal_retired_unit_cannot_recondition
        claim_type: Terminal State Lockdown
        grounds: [state_machines.Unit, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "A RETIRED Unit (terminal) cannot be reconditioned — ERR_INVALID_STATE."
        test_recipe:
          setup: ["a RETIRED Unit"]
          setup_api_calls:
            - call: "POST /units"
              payload: { stock_number: "S-TR-1", condition: "NEW", model_code: "5045E", serial_number: "SN-TR-1", dealer_cost_cents: 3000000, list_price_cents: 4000000 }
              as: DealerAdmin
              captures: { unit_id: $.data.id }
            - call: "POST /units/${unit_id}/retire"
              payload: {}
              as: DealerAdmin
          trigger:
            - call: "POST /units/${unit_id}/recondition"
              payload: {}
              as: DealerAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE"
            - "Unit.${unit_id}.status == RETIRED"

      - name: retire_floor_planned_unit_rejected
        claim_type: Precondition Enforcement
        grounds: [state_machines.Unit.AVAILABLE_to_RETIRED, entities.Unit.fields.floor_planned]
        distinguishing_aspect: "Retiring an AVAILABLE Unit whose floor_planned is true is rejected (precondition floor_planned==false) with ERR_INVALID_STATE."
        test_recipe:
          setup: ["an AVAILABLE Unit with an ACTIVE FloorPlanNote (floor_planned true)"]
          setup_api_calls:
            - call: "POST /units"
              payload: { stock_number: "S-RF-1", condition: "NEW", model_code: "8R370", serial_number: "SN-RF-1", dealer_cost_cents: 9000000, list_price_cents: 12000000 }
              as: DealerAdmin
              captures: { unit_id: $.data.id }
            - call: "POST /floor-plan-notes"
              payload: { unit_id: "${unit_id}", principal_cents: 9000000, annual_rate_bps: 850 }
              as: FinanceManager
              captures: { note_id: $.data.id }
            - call: "POST /floor-plan-notes/${note_id}/activate"
              payload: {}
              as: FinanceManager
          trigger:
            - call: "POST /units/${unit_id}/retire"
              payload: {}
              as: DealerAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE"
            - "Unit.${unit_id}.status == AVAILABLE"
            - "Unit.${unit_id}.floor_planned == true"

      - name: auction_close_no_sale_releases_unit_to_available
        claim_type: Side Effect Execution
        grounds: [state_machines.AuctionLot.LIVE_to_CLOSED_NO_SALE, state_machines.AuctionLot.CLOSED_NO_SALE_to_SETTLED, state_machines.Unit.AUCTION_LISTED_to_AVAILABLE]
        distinguishing_aspect: "A lot closed with no qualifying bid then settled releases its Unit AUCTION_LISTED -> AVAILABLE; no deal created."
        test_recipe:
          setup: ["a LIVE AuctionLot past closes_at with no bids"]
          setup_api_calls:
            - call: "POST /units"
              payload: { stock_number: "S-NS-1", condition: "USED", model_code: "S760", serial_number: "SN-NS-1", dealer_cost_cents: 3500000, list_price_cents: 5000000, engine_hours: 3000 }
              as: DealerAdmin
              captures: { unit_id: $.data.id }
            - call: "POST /auction-lots"
              payload: { unit_id: "${unit_id}", reserve_price_cents: 4500000, opens_at: "2026-01-01T00:00:00Z", closes_at: "2026-02-01T00:00:00Z" }
              as: AuctionClerk
              captures: { lot_id: $.data.id }
            - call: "POST /auction-lots/${lot_id}/open"
              payload: {}
              as: AuctionClerk
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-02T00:00:00Z" }
              as: DealerAdmin
            - call: "POST /auction-lots/${lot_id}/close"
              payload: {}
              as: AuctionClerk
            - call: "GET /units/${unit_id}"
              payload: {}
              as: AuctionClerk
              captures: { unit_v: $.data.version }
          trigger:
            - call: "POST /auction-lots/${lot_id}/settle"
              payload: { expected_unit_version: "${unit_v}" }
              as: AuctionClerk
          assert:
            - "AuctionLot.${lot_id}.status == SETTLED"
            - "Unit.${unit_id}.status == AVAILABLE"

      - name: auction_settle_met_creates_funded_auction_sale_deal
        claim_type: Side Effect Execution
        grounds: [state_machines.AuctionLot.CLOSED_MET_to_SETTLED, state_machines.Unit.AUCTION_LISTED_to_AUCTION_SOLD, entities.AuctionLot.fields.winning_deal_id]
        distinguishing_aspect: "A reserve-met lot settled creates an AUCTION_SALE Deal (FUNDED) for the high bidder and moves the Unit to AUCTION_SOLD; winning_deal_id set."
        test_recipe:
          setup: ["a LIVE AuctionLot, reserve 4000000, with a high bid 4800000, past closes_at and CLOSED_MET"]
          setup_api_calls:
            - call: "POST /customers"
              payload: { name: "Winner", customer_type: "COMMERCIAL_AG" }
              as: DealerAdmin
              captures: { bidder: $.data.id }
            - call: "POST /units"
              payload: { stock_number: "S-WM-1", condition: "USED", model_code: "X9-1100", serial_number: "SN-WM-1", dealer_cost_cents: 3000000, list_price_cents: 5000000, engine_hours: 1200 }
              as: DealerAdmin
              captures: { unit_id: $.data.id }
            - call: "POST /auction-lots"
              payload: { unit_id: "${unit_id}", reserve_price_cents: 4000000, opens_at: "2026-01-01T00:00:00Z", closes_at: "2026-02-01T00:00:00Z" }
              as: AuctionClerk
              captures: { lot_id: $.data.id }
            - call: "POST /auction-lots/${lot_id}/open"
              payload: {}
              as: AuctionClerk
            - call: "POST /auction-lots/${lot_id}/bids"
              payload: { bidder_customer_id: "${bidder}", amount_cents: 4800000 }
              as: AuctionClerk
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-02T00:00:00Z" }
              as: DealerAdmin
            - call: "POST /auction-lots/${lot_id}/close"
              payload: {}
              as: AuctionClerk
            - call: "GET /units/${unit_id}"
              payload: {}
              as: AuctionClerk
              captures: { unit_v: $.data.version }
          trigger:
            - call: "POST /auction-lots/${lot_id}/settle"
              payload: { expected_unit_version: "${unit_v}" }
              as: AuctionClerk
              captures: { winning_deal_id: $.data.winning_deal_id }
          assert:
            - "AuctionLot.${lot_id}.status == SETTLED"
            - "Unit.${unit_id}.status == AUCTION_SOLD"
            - "Deal.${winning_deal_id}.status == FUNDED"
            - "Deal.${winning_deal_id}.deal_type == AUCTION_SALE"
            - "Deal.${winning_deal_id}.sale_price_cents == 4800000"

      - name: list_unit_floorplan_notes_via_filtered_get
        claim_type: Bubble up
        grounds: [endpoints, entities.FloorPlanNote.fields.unit_id]
        distinguishing_aspect: "GET /floor-plan-notes?unit_id={id} returns the notes for that unit (FK reverse-reachability, filtered-list form)."
        test_recipe:
          setup: ["a Unit with one DRAFT FloorPlanNote"]
          setup_api_calls:
            - call: "POST /units"
              payload: { stock_number: "S-RR-1", condition: "NEW", model_code: "8R250", serial_number: "SN-RR-1", dealer_cost_cents: 6000000, list_price_cents: 8000000 }
              as: DealerAdmin
              captures: { unit_id: $.data.id }
            - call: "POST /floor-plan-notes"
              payload: { unit_id: "${unit_id}", principal_cents: 6000000, annual_rate_bps: 800 }
              as: FinanceManager
              captures: { note_id: $.data.id }
          trigger:
            - call: "GET /floor-plan-notes"
              payload: { unit_id: "${unit_id}" }
              as: FinanceManager
          assert:
            - "response_type == array"
            - "result contains FloorPlanNote ${note_id}"

      - name: open_auction_before_opens_at_rejected
        claim_type: guarded transitions
        grounds: [state_machines.AuctionLot.DRAFT_to_LIVE, "validations[priority=11]"]
        distinguishing_aspect: "Opening a lot while current clock < opens_at is rejected with ERR_AUCTION_WINDOW; lot stays DRAFT."
        test_recipe:
          setup: ["a DRAFT lot whose opens_at is in the future relative to the default clock"]
          setup_api_calls:
            - call: "POST /units"
              payload: { stock_number: "S-OB-1", condition: "USED", model_code: "S790", serial_number: "SN-OB-1", dealer_cost_cents: 4000000, list_price_cents: 5500000, engine_hours: 2200 }
              as: DealerAdmin
              captures: { unit_id: $.data.id }
            - call: "POST /auction-lots"
              payload: { unit_id: "${unit_id}", reserve_price_cents: 5000000, opens_at: "2026-05-01T00:00:00Z", closes_at: "2026-06-01T00:00:00Z" }
              as: AuctionClerk
              captures: { lot_id: $.data.id }
          trigger:
            - call: "POST /auction-lots/${lot_id}/open"
              payload: {}
              as: AuctionClerk
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_AUCTION_WINDOW"
            - "AuctionLot.${lot_id}.status == DRAFT"

      - name: whole_goods_two_step_partial_then_full_fulfillment
        claim_type: cyclic
        grounds: [state_machines.WholeGoodsOrder.CONFIRMED_to_PARTIAL_FULFILLED, state_machines.WholeGoodsOrder.PARTIAL_FULFILLED_to_FULFILLED, entities.WholeGoodsOrder.fields.fulfilled_qty]
        distinguishing_aspect: "A CONFIRMED order quantity 2 goes PARTIAL_FULFILLED after first allocate (fulfilled_qty 1) then FULFILLED after second (fulfilled_qty 2)."
        test_recipe:
          setup: ["a CONFIRMED WholeGoodsOrder quantity 2 for model 5075E; two AVAILABLE 5075E units"]
          setup_api_calls:
            - call: "POST /customers"
              payload: { name: "WG Cust", customer_type: "COMMERCIAL_AG" }
              as: SalesRep
              captures: { cust_id: $.data.id }
            - call: "POST /whole-goods-orders"
              payload: { customer_id: "${cust_id}", model_code: "5075E", season_program: "EARLY_ORDER", quantity: 2, unit_msrp_cents: 5000000 }
              as: SalesRep
              captures: { order_id: $.data.id }
            - call: "POST /whole-goods-orders/${order_id}/confirm"
              payload: {}
              as: SalesRep
            - call: "POST /units"
              payload: { stock_number: "S-WG-1", condition: "NEW", model_code: "5075E", serial_number: "SN-WG-1", dealer_cost_cents: 3800000, list_price_cents: 5000000 }
              as: DealerAdmin
              captures: { u1: $.data.id }
            - call: "POST /units"
              payload: { stock_number: "S-WG-2", condition: "NEW", model_code: "5075E", serial_number: "SN-WG-2", dealer_cost_cents: 3800000, list_price_cents: 5000000 }
              as: DealerAdmin
              captures: { u2: $.data.id }
            - call: "POST /whole-goods-orders/${order_id}/allocate"
              payload: { unit_id: "${u1}" }
              as: SalesRep
              captures: { st1: $.data.status, fq1: $.data.fulfilled_qty }
          trigger:
            - call: "POST /whole-goods-orders/${order_id}/allocate"
              payload: { unit_id: "${u2}" }
              as: SalesRep
              captures: { st2: $.data.status, fq2: $.data.fulfilled_qty }
          assert:
            - "after first allocate: WholeGoodsOrder.${order_id}.status == PARTIAL_FULFILLED and fulfilled_qty == 1"
            - "after second allocate: WholeGoodsOrder.${order_id}.status == FULFILLED and fulfilled_qty == 2"
            - "Unit.${u1}.status == RESERVED"
            - "Unit.${u2}.status == RESERVED"

  # ===========================================================================
  - section: calculations
    instances:
      - name: trade_in_appraisal_hour_penalty_capped_at_40pct
        claim_type: Constants Applied
        grounds: [calculations.trade_in_appraisal, entities.TradeIn.fields.appraised_value_cents]
        distinguishing_aspect: "Hour penalty caps at 40%: a POOR-grade trade with 6000 engine_hours (would be 60% penalty) is capped at 40%; base 1000000 POOR -> 1000000*0.40*(1-0.40)=240000."
        test_recipe:
          setup: ["a Customer to own the trade"]
          setup_api_calls:
