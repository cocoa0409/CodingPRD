              payload: { business_unit_id: "${bu_id}", employee_id: "${emp_id}", competitor_name: "Rivex SA", contact_channel: "EMAIL", topic_tags: [], pricing_topic: false, occurred_at: "2026-07-20T10:00:00Z" }
              as: Employee
              as_user_id: "${emp_id}"
              captures: { c_id: $.data.id }
            - call: "POST /compliance/competitor-contacts/${c_id}/review-opening"
              payload: {}
              as: AntitrustCounsel
              as_user_id: "counsel-1"
          trigger:
            - call: "POST /compliance/competitor-contacts/${c_id}/escalation"
              payload: { reason: "Thread reveals coordinated quoting" }
              as: AntitrustCounsel
              as_user_id: "counsel-1"
              captures: { charged: $.data.exposure_points_charged }
            - call: "GET /compliance/business-units/${bu_id}"
              as: AntitrustCounsel
              as_user_id: "counsel-1"
              captures: { bu_after_v: $.data.version }
          assert:
            - "the escalation response body already reports ${charged} == 10.00"
            - "the escalation response envelope has response_type 'object' and meta.api_request_id / meta.api_request_timestamp present"
            - "BusinessUnit.${bu_id}.exposure_points == 10.00 on the immediately following read"
            - "${bu_after_v} is strictly greater than the version the unit held before the escalation"

