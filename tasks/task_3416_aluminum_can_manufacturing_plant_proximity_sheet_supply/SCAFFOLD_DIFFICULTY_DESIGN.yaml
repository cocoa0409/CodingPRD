              as: CustomerPlanner
              as_user_id: "${cust_id}"
              captures: { p1_id: $.data.id }
          trigger:
            - call: "POST /customers/${cust_id}/scrap-returns"
              payload: { plant_id: "${plant_id}", pickup_window_start: "2026-09-05T10:00:00Z", pickup_window_end: "2026-09-05T11:00:00Z", declared_weight_lbs: 4000 }
              as: CustomerPlanner
              as_user_id: "${cust_id}"
              captures: { err_touch: $.data.error_id }
            - call: "POST /customers/${cust_id}/scrap-returns"
              payload: { plant_id: "${plant_id}", pickup_window_start: "2026-09-05T12:00:00Z", pickup_window_end: "2026-09-05T13:00:00Z", declared_weight_lbs: 4000 }
              as: CustomerPlanner
              as_user_id: "${cust_id}"
              captures: { p2_id: $.data.id }
            - call: "POST /customers/${cust_id}/scrap-returns"
              payload: { plant_id: "${plant_id}", pickup_window_start: "2026-09-05T15:00:00Z", pickup_window_end: "2026-09-05T16:00:00Z", declared_weight_lbs: 4000 }
              as: CustomerPlanner
              as_user_id: "${cust_id}"
              captures: { err_cap: $.data.error_id }
          assert:
            - "err_touch == ERR_PICKUP_WINDOW_CONFLICT (closed intervals: touching endpoints conflict)"
            - "the 12:00..13:00 pickup returns 201 and ScrapReturn.${p2_id}.status == SCHEDULED"
            - "err_cap == ERR_PICKUP_DAILY_LIMIT (third pickup on 2026-09-05 exceeds MAX_PICKUPS_PER_DAY = 2)"
            - "GET /scrap-returns?customer_id=${cust_id}&status=SCHEDULED returns exactly 2 rows"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: complete_then_void_conserves_warehouse_units
        grounds:
          - state_machines.ProductionRun.IN_PROGRESS_to_COMPLETED
          - state_machines.ProductionRun.COMPLETED_to_VOIDED
          - entities.Plant.fields.warehouse_on_hand_units
        distinguishing_aspect: |
          Conserved quantity = plant warehouse units: completing a run adds exactly
          produced_qty (0 -> 250000) and voiding that COMPLETED run subtracts exactly the
          same produced_qty, so warehouse_on_hand_units after the pair equals the value
          before it (0) — no drift, and projected_warehouse_units returns to 0 as well.
        test_recipe:
          setup:
            - "Logical clock 2026-09-01. Plant cap 1000000; ACTIVE agreement; line; QUALIFIED format; index 2026-08=128.0; run R 250000 units window 2026-09-10T08:00..16:00 IN_PROGRESS."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /plants"
              payload: { name: "P", region: "US-SW", warehouse_capacity_units: 1000000 }
              as: PlatformAdmin
              captures: { plant_id: $.data.id }
            - call: "POST /customers"
              payload: { name: "C", home_region: "US-SW", filling_lines_count: 1 }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /metal-price-indices"
              payload: { period: "2026-08", index_cents_per_lb: 128.0 }
              as: PlatformAdmin
            - call: "POST /supply-agreements"
              payload: { plant_id: "${plant_id}", customer_id: "${cust_id}", committed_annual_units: 12000000, pass_through_pct: 1.0, conversion_cost_cents_per_1000: 1500, start_date: "2026-01-01", end_date: "2026-12-31" }
              as: PlantManager
              captures: { agr_id: $.data.id, agr_v: $.data.version }
            - call: "POST /supply-agreements/${agr_id}/sign"
              payload: {}
              as: CustomerPlanner
              as_user_id: "${cust_id}"
              captures: { agr_v: $.data.version }
            - call: "POST /plants/${plant_id}/lines"
              payload: { name: "L", nominal_speed_cans_per_hour: 120000, base_spoilage_pct: 0.04 }
              as: PlantManager
              captures: { line_id: $.data.id }
            - call: "POST /plants/${plant_id}/formats"
              payload: { customer_id: "${cust_id}", size_code: "12OZ", shape: "STANDARD", is_specialty: false, metal_lbs_per_1000_units: 30.0, tooling_investment_cents: 0, min_volume_commitment_units: 0 }
              as: PlantManager
              captures: { fmt_id: $.data.id }
            - call: "POST /formats/${fmt_id}/tool"
              payload: {}
              as: PlantManager
            - call: "POST /formats/${fmt_id}/qualify"
              payload: {}
              as: PlantManager
            - call: "POST /supply-agreements/${agr_id}/production-runs"
              payload: { line_id: "${line_id}", format_id: "${fmt_id}", scheduled_qty: 250000, graphics_code: "G1", window_start: "2026-09-10T08:00:00Z", window_end: "2026-09-10T16:00:00Z", expected_agreement_version: "${agr_v}" }
              as: LineScheduler
              captures: { run_id: $.data.id }
            - call: "POST /production-runs/${run_id}/start"
              payload: {}
              as: LineScheduler
            - call: "GET /plants/${plant_id}"
              payload: {}
              as: PlantManager
              captures: { onhand_before: $.data.warehouse_on_hand_units }
          trigger:
            - call: "POST /production-runs/${run_id}/complete"
              payload: { produced_qty: 250000, spoiled_qty: 0 }
              as: LineScheduler
            - call: "GET /plants/${plant_id}"
              payload: {}
              as: PlantManager
              captures: { onhand_mid: $.data.warehouse_on_hand_units }
            - call: "POST /production-runs/${run_id}/void"
              payload: {}
              as: LineScheduler
              captures: { run_st: $.data.status }
            - call: "GET /plants/${plant_id}"
              payload: {}
              as: PlantManager
              captures: { onhand_after: $.data.warehouse_on_hand_units, projected_after: $.data.projected_warehouse_units, posture_after: $.data.posture }
          assert:
            - "onhand_before == 0 and onhand_mid == 250000"
            - "onhand_after == onhand_before == 0 (forward + compensating action conserve warehouse units)"
            - "projected_after == 0 and posture_after == OPEN"
            - "run_st == VOIDED"

      - name: settle_then_void_conserves_agreement_ledger
        grounds:
          - state_machines.ProductionRun.COMPLETED_to_SETTLED
          - state_machines.ProductionRun.SETTLED_to_VOIDED
          - entities.SupplyAgreement.fields.ytd_settled_units
          - entities.SupplyAgreement.fields.delivered_revenue_cents
        distinguishing_aspect: |
          Conserved quantity = the agreement's settled ledger (different from warehouse
          units): settling adds ytd 250000 and revenue 1306500.00; voiding the SETTLED run
          reverses both exactly (back to 0 and 0.00) with volume_tier returning to
          STANDARD — the tier state must not be left drifted by the pair.
        test_recipe:
          setup:
            - "Logical clock 2026-09-01. Plant cap 1000000; ACTIVE agreement committed 12000000 pass 0.92 conversion 1500; indices 2026-08=128.0 and 2026-09=135.0; line; QUALIFIED STANDARD format 30.0 lbs; run R 250000 units window 2026-09-10T08:00..16:00, COMPLETED produced 250000 spoiled 0."
