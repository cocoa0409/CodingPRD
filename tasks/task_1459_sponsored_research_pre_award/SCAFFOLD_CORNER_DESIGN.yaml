        distinguishing_aspect: "total_request_cents == max_request_cents passes (inclusive cap); one cent over fails with ERR_REQUEST_EXCEEDS_CAP. Numbers: 25% rate on PERSONNEL 8000000 -> request exactly 10000000; 8000001 -> 10000001."
        test_recipe:
          setup: ["opportunity max_request_cents 10000000 allowing RESEARCH_OFF_CAMPUS; eligible PI; PROVISIONAL OFF_CAMPUS rate 25%; proposals P-over (line 8000001) and P-exact (line 8000000)"]
