# =============================================================================
# §1.9 Scaffold Corner Design — Coverage Index for Non-Difficulty Tests
# Historic House Museum Docent & Tour Program
# =============================================================================
# All chains assume an empty DB and the logical clock at its startup default
# 2026-08-01T00:00:00Z unless a call explicitly sets it.

scaffold_corner_design:
  # ---------------------------------------------------------------------------
  - section: entities
    instances:
      - name: room_create_defaults_status_open
        claim_type: creation_defaults
        grounds: [entities.Room.fields.status]
        distinguishing_aspect: "POST /rooms with all required fields returns 201; system fields default: status == OPEN, version == 1."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /rooms", payload: { name: "Attic", floor: 3, capacity_max: 8, safety_max_party: 6, collection_tier: "STANDARD" }, as: MuseumAdmin, captures: { r1: $.data.id, st: $.data.status, ver: $.data.version } }
          assert:
            - "http_status == 201 and Room.${r1}.status == OPEN and version == 1"

      - name: room_missing_capacity_returns_invalid_request
        claim_type: required_fields
        grounds: [entities.Room.fields.capacity_max, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Omitting required input field capacity_max yields 400 ERR_INVALID_REQUEST and creates nothing."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /rooms", payload: { name: "Attic", floor: 3, safety_max_party: 6, collection_tier: "STANDARD" }, as: MuseumAdmin }
          assert:
            - "http_status == 400 and error_id == ERR_INVALID_REQUEST"
            - "GET /rooms listing afterwards contains no room"

      - name: booking_computed_price_client_input_ignored
        claim_type: computed_fields
        grounds: [entities.Booking.fields.total_price_cents, calculations.booking_total_price_cents]
        distinguishing_aspect: "Client-supplied total_price_cents is ignored; the server-computed value (party 2 x unit 1000 = 2000) is authoritative."
        test_recipe:
          setup:
            - "OPEN slot ${slot1} on STANDARD route base 1000 (capacity 18), staffed"
          setup_api_calls:
            - { call: "POST /rooms", payload: { name: "Parlor", floor: 1, capacity_max: 20, safety_max_party: 12, collection_tier: "STANDARD" }, as: MuseumAdmin, captures: { r1: $.data.id } }
            - { call: "POST /tour-routes", payload: { name: "Main Floor", kind: "STANDARD", room_ids: ["${r1}"], duration_minutes: 60, base_price_cents: 1000 }, as: MuseumAdmin, captures: { route1: $.data.id, route1_v: $.data.version } }
            - { call: "POST /tour-routes/${route1}/script-versions", payload: { content_text: "Script", curriculum_standards: [] }, as: Curator, captures: { s1: $.data.id } }
            - { call: "POST /script-versions/${s1}/submit", payload: {}, as: Curator }
            - { call: "POST /script-versions/${s1}/review", payload: { decision: "APPROVE", accuracy_score: 90 }, as: Curator }
            - { call: "POST /script-versions/${s1}/publish", payload: { expected_route_version: "${route1_v}" }, as: MuseumAdmin }
            - { call: "POST /tour-routes/${route1}/activate", payload: {}, as: MuseumAdmin }
            - { call: "POST /docents", payload: { full_name: "Dee Ocent", email: "dee@x.org" }, as: DocentCoordinator, captures: { d1: $.data.id } }
            - { call: "POST /docents/${d1}/advance", payload: { to_status: "TRAINEE" }, as: DocentCoordinator }
            - { call: "POST /docents/${d1}/training-records", payload: { kind: "HOURS", value: 30 }, as: DocentCoordinator }
            - { call: "POST /docents/${d1}/training-records", payload: { kind: "SHADOW_TOUR", value: 1 }, as: DocentCoordinator }
            - { call: "POST /docents/${d1}/training-records", payload: { kind: "SHADOW_TOUR", value: 1 }, as: DocentCoordinator }
            - { call: "POST /docents/${d1}/training-records", payload: { kind: "SHADOW_TOUR", value: 1 }, as: DocentCoordinator }
            - { call: "POST /docents/${d1}/training-records", payload: { kind: "QUIZ", value: 90 }, as: DocentCoordinator }
            - { call: "POST /docents/${d1}/advance", payload: { to_status: "CERTIFIED", route_ids: ["${route1}"] }, as: DocentCoordinator }
            - { call: "POST /tour-slots", payload: { route_id: "${route1}", start_at: "2026-09-01T10:00:00Z" }, as: MuseumAdmin, captures: { slot1: $.data.id } }
            - { call: "POST /shift-assignments", payload: { docent_id: "${d1}", slot_id: "${slot1}", shift_role: "LEAD" }, as: DocentCoordinator, captures: { sh1: $.data.id } }
            - { call: "POST /shift-assignments/${sh1}/confirm", payload: {}, as: Docent, as_user_id: "${d1}" }
            - { call: "POST /tour-slots/${slot1}/open", payload: {}, as: MuseumAdmin }
          trigger:
            - { call: "POST /bookings", payload: { slot_id: "${slot1}", booking_kind: "GENERAL", visitor_name: "Ann", party_size: 2, total_price_cents: 1 }, as: FrontDeskStaff, captures: { bk1: $.data.id, total: $.data.total_price_cents } }
          assert:
            - "Booking.${bk1}.total_price_cents == 2000 — the smuggled total_price_cents: 1 was ignored"

      - name: get_missing_room_returns_not_found
        claim_type: not_found
        grounds: ["errors[ERR_NOT_FOUND]", "validations[priority=3]"]
        distinguishing_aspect: "GET on a well-formed but non-existent room id yields 404 ERR_NOT_FOUND."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /rooms/00000000-0000-0000-0000-000000000000", payload: {}, as: MuseumAdmin }
          assert:
            - "http_status == 404 and error_id == ERR_NOT_FOUND"

      - name: visitor_survey_immutable_no_version_field
        claim_type: immutability
        grounds: [entities.VisitorSurvey]
        distinguishing_aspect: "VisitorSurvey is common_fields:false — the create response carries id and created_at but no version / updated_at keys."
        test_recipe:
          setup:
            - "COMPLETED slot ${slot1} with CONFIRMED booking ${bk1}"
          setup_api_calls:
            - { call: "POST /rooms", payload: { name: "Parlor", floor: 1, capacity_max: 20, safety_max_party: 12, collection_tier: "STANDARD" }, as: MuseumAdmin, captures: { r1: $.data.id } }
            - { call: "POST /tour-routes", payload: { name: "Main Floor", kind: "STANDARD", room_ids: ["${r1}"], duration_minutes: 60, base_price_cents: 1000 }, as: MuseumAdmin, captures: { route1: $.data.id, route1_v: $.data.version } }
            - { call: "POST /tour-routes/${route1}/script-versions", payload: { content_text: "Script", curriculum_standards: [] }, as: Curator, captures: { s1: $.data.id } }
            - { call: "POST /script-versions/${s1}/submit", payload: {}, as: Curator }
            - { call: "POST /script-versions/${s1}/review", payload: { decision: "APPROVE", accuracy_score: 90 }, as: Curator }
            - { call: "POST /script-versions/${s1}/publish", payload: { expected_route_version: "${route1_v}" }, as: MuseumAdmin }
            - { call: "POST /tour-routes/${route1}/activate", payload: {}, as: MuseumAdmin }
            - { call: "POST /docents", payload: { full_name: "Dee Ocent", email: "dee@x.org" }, as: DocentCoordinator, captures: { d1: $.data.id } }
            - { call: "POST /docents/${d1}/advance", payload: { to_status: "TRAINEE" }, as: DocentCoordinator }
            - { call: "POST /docents/${d1}/training-records", payload: { kind: "HOURS", value: 30 }, as: DocentCoordinator }
            - { call: "POST /docents/${d1}/training-records", payload: { kind: "SHADOW_TOUR", value: 1 }, as: DocentCoordinator }
            - { call: "POST /docents/${d1}/training-records", payload: { kind: "SHADOW_TOUR", value: 1 }, as: DocentCoordinator }
            - { call: "POST /docents/${d1}/training-records", payload: { kind: "SHADOW_TOUR", value: 1 }, as: DocentCoordinator }
            - { call: "POST /docents/${d1}/training-records", payload: { kind: "QUIZ", value: 90 }, as: DocentCoordinator }
            - { call: "POST /docents/${d1}/advance", payload: { to_status: "CERTIFIED", route_ids: ["${route1}"] }, as: DocentCoordinator }
            - { call: "POST /tour-slots", payload: { route_id: "${route1}", start_at: "2026-08-05T10:00:00Z" }, as: MuseumAdmin, captures: { slot1: $.data.id } }
            - { call: "POST /shift-assignments", payload: { docent_id: "${d1}", slot_id: "${slot1}", shift_role: "LEAD" }, as: DocentCoordinator, captures: { sh1: $.data.id } }
            - { call: "POST /shift-assignments/${sh1}/confirm", payload: {}, as: Docent, as_user_id: "${d1}" }
            - { call: "POST /tour-slots/${slot1}/open", payload: {}, as: MuseumAdmin }
            - { call: "POST /bookings", payload: { slot_id: "${slot1}", booking_kind: "GENERAL", visitor_name: "Ann", party_size: 1 }, as: FrontDeskStaff, captures: { bk1: $.data.id } }
            - { call: "POST /bookings/${bk1}/confirm", payload: { paid_cents: 1000 }, as: FrontDeskStaff }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-05T10:00:00Z" }, as: MuseumAdmin }
            - { call: "POST /tour-slots/${slot1}/advance", payload: { to_status: "IN_PROGRESS" }, as: MuseumAdmin }
            - { call: "POST /tour-slots/${slot1}/advance", payload: { to_status: "COMPLETED" }, as: MuseumAdmin }
          trigger:
            - { call: "POST /bookings/${bk1}/surveys", payload: { overall_rating: 5, interpretation_clarity: 4, would_recommend: true }, as: FrontDeskStaff, captures: { sv1: $.data.id, sv_st: $.data.status } }
          assert:
            - "http_status == 201 and status == SUBMITTED"
            - "response data contains keys id and created_at but NO version and NO updated_at (immutable append-only entity)"

      - name: server_minted_created_at_uses_default_clock
        claim_type: system_fields
        grounds: [entities.Room, response_envelope]
        distinguishing_aspect: "Before any clock-set call, server-stamped created_at equals the logical clock default 2026-08-01T00:00:00Z, not wall-clock time."
        test_recipe:
          setup: ["empty DB; no clock call made"]
          setup_api_calls: []
          trigger:
            - { call: "POST /rooms", payload: { name: "Attic", floor: 3, capacity_max: 8, safety_max_party: 6, collection_tier: "STANDARD" }, as: MuseumAdmin, captures: { r1: $.data.id, cat: $.data.created_at } }
          assert:
            - "Room.${r1}.created_at == 2026-08-01T00:00:00Z (logical clock startup default)"

  # ---------------------------------------------------------------------------
  - section: state_machines
    instances:
      - name: script_initial_state_draft
        claim_type: initial_state
        grounds: [state_machines.ScriptVersion]
        distinguishing_aspect: "A newly created ScriptVersion starts in DRAFT with version_no 1."
        test_recipe:
          setup: ["route ${route1} exists"]
          setup_api_calls:
            - { call: "POST /rooms", payload: { name: "Parlor", floor: 1, capacity_max: 20, safety_max_party: 12, collection_tier: "STANDARD" }, as: MuseumAdmin, captures: { r1: $.data.id } }
            - { call: "POST /tour-routes", payload: { name: "Main Floor", kind: "STANDARD", room_ids: ["${r1}"], duration_minutes: 60, base_price_cents: 1000 }, as: MuseumAdmin, captures: { route1: $.data.id } }
          trigger:
            - { call: "POST /tour-routes/${route1}/script-versions", payload: { content_text: "Draft", curriculum_standards: [] }, as: Curator, captures: { s1: $.data.id, st: $.data.status, vno: $.data.version_no } }
          assert:
            - "ScriptVersion.${s1}.status == DRAFT and version_no == 1"

      - name: script_submit_from_in_review_rejected
        claim_type: invalid_transition
        grounds: [state_machines.ScriptVersion.DRAFT_to_IN_REVIEW, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Submit is only offered from DRAFT; submitting an IN_REVIEW script returns 409 ERR_INVALID_STATE."
        test_recipe:
          setup: ["script ${s1} IN_REVIEW"]
          setup_api_calls:
            - { call: "POST /rooms", payload: { name: "Parlor", floor: 1, capacity_max: 20, safety_max_party: 12, collection_tier: "STANDARD" }, as: MuseumAdmin, captures: { r1: $.data.id } }
            - { call: "POST /tour-routes", payload: { name: "Main Floor", kind: "STANDARD", room_ids: ["${r1}"], duration_minutes: 60, base_price_cents: 1000 }, as: MuseumAdmin, captures: { route1: $.data.id } }
            - { call: "POST /tour-routes/${route1}/script-versions", payload: { content_text: "Draft", curriculum_standards: [] }, as: Curator, captures: { s1: $.data.id } }
            - { call: "POST /script-versions/${s1}/submit", payload: {}, as: Curator }
          trigger:
            - { call: "POST /script-versions/${s1}/submit", payload: {}, as: Curator }
          assert:
            - "http_status == 409 and error_id == ERR_INVALID_STATE; script remains IN_REVIEW"

      - name: booking_cancel_from_cancelled_rejected
        claim_type: terminal_state_lockdown
        grounds: [state_machines.Booking, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "CANCELLED is terminal: a second cancel returns 409 ERR_INVALID_STATE and no side effects re-fire."
        test_recipe:
          setup:
            - "OPEN slot ${slot1}; booking ${bk1} already CANCELLED once"
          setup_api_calls:
            - { call: "POST /rooms", payload: { name: "Parlor", floor: 1, capacity_max: 20, safety_max_party: 12, collection_tier: "STANDARD" }, as: MuseumAdmin, captures: { r1: $.data.id } }
            - { call: "POST /tour-routes", payload: { name: "Main Floor", kind: "STANDARD", room_ids: ["${r1}"], duration_minutes: 60, base_price_cents: 1000 }, as: MuseumAdmin, captures: { route1: $.data.id, route1_v: $.data.version } }
            - { call: "POST /tour-routes/${route1}/script-versions", payload: { content_text: "Script", curriculum_standards: [] }, as: Curator, captures: { s1: $.data.id } }
            - { call: "POST /script-versions/${s1}/submit", payload: {}, as: Curator }
            - { call: "POST /script-versions/${s1}/review", payload: { decision: "APPROVE", accuracy_score: 90 }, as: Curator }
            - { call: "POST /script-versions/${s1}/publish", payload: { expected_route_version: "${route1_v}" }, as: MuseumAdmin }
            - { call: "POST /tour-routes/${route1}/activate", payload: {}, as: MuseumAdmin }
            - { call: "POST /docents", payload: { full_name: "Dee Ocent", email: "dee@x.org" }, as: DocentCoordinator, captures: { d1: $.data.id } }
            - { call: "POST /docents/${d1}/advance", payload: { to_status: "TRAINEE" }, as: DocentCoordinator }
            - { call: "POST /docents/${d1}/training-records", payload: { kind: "HOURS", value: 30 }, as: DocentCoordinator }
            - { call: "POST /docents/${d1}/training-records", payload: { kind: "SHADOW_TOUR", value: 1 }, as: DocentCoordinator }
            - { call: "POST /docents/${d1}/training-records", payload: { kind: "SHADOW_TOUR", value: 1 }, as: DocentCoordinator }
            - { call: "POST /docents/${d1}/training-records", payload: { kind: "SHADOW_TOUR", value: 1 }, as: DocentCoordinator }
            - { call: "POST /docents/${d1}/training-records", payload: { kind: "QUIZ", value: 90 }, as: DocentCoordinator }
            - { call: "POST /docents/${d1}/advance", payload: { to_status: "CERTIFIED", route_ids: ["${route1}"] }, as: DocentCoordinator }
            - { call: "POST /tour-slots", payload: { route_id: "${route1}", start_at: "2026-09-01T10:00:00Z" }, as: MuseumAdmin, captures: { slot1: $.data.id } }
            - { call: "POST /shift-assignments", payload: { docent_id: "${d1}", slot_id: "${slot1}", shift_role: "LEAD" }, as: DocentCoordinator, captures: { sh1: $.data.id } }
            - { call: "POST /shift-assignments/${sh1}/confirm", payload: {}, as: Docent, as_user_id: "${d1}" }
            - { call: "POST /tour-slots/${slot1}/open", payload: {}, as: MuseumAdmin }
            - { call: "POST /bookings", payload: { slot_id: "${slot1}", booking_kind: "GENERAL", visitor_name: "Ann", party_size: 1 }, as: FrontDeskStaff, captures: { bk1: $.data.id } }
            - { call: "POST /bookings/${bk1}/cancel", payload: {}, as: FrontDeskStaff }
          trigger:
            - { call: "POST /bookings/${bk1}/cancel", payload: {}, as: FrontDeskStaff }
          assert:
            - "http_status == 409 and error_id == ERR_INVALID_STATE (CANCELLED is terminal)"

      - name: shift_confirm_from_declined_rejected
        claim_type: invalid_transition
        grounds: [state_machines.ShiftAssignment, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "DECLINED is terminal: confirming a declined shift returns 409 ERR_INVALID_STATE even when the caller is the shift's own docent."
        test_recipe:
          setup: ["slot ${slot1} SCHEDULED; shift ${sh1} DECLINED by its docent"]
          setup_api_calls:
            - { call: "POST /rooms", payload: { name: "Parlor", floor: 1, capacity_max: 20, safety_max_party: 12, collection_tier: "STANDARD" }, as: MuseumAdmin, captures: { r1: $.data.id } }
            - { call: "POST /tour-routes", payload: { name: "Main Floor", kind: "STANDARD", room_ids: ["${r1}"], duration_minutes: 60, base_price_cents: 1000 }, as: MuseumAdmin, captures: { route1: $.data.id } }
            - { call: "POST /tour-routes/${route1}/activate", payload: {}, as: MuseumAdmin }
            - { call: "POST /docents", payload: { full_name: "Dee Ocent", email: "dee@x.org" }, as: DocentCoordinator, captures: { d1: $.data.id } }
            - { call: "POST /docents/${d1}/advance", payload: { to_status: "TRAINEE" }, as: DocentCoordinator }
            - { call: "POST /docents/${d1}/training-records", payload: { kind: "HOURS", value: 30 }, as: DocentCoordinator }
            - { call: "POST /docents/${d1}/training-records", payload: { kind: "SHADOW_TOUR", value: 1 }, as: DocentCoordinator }
            - { call: "POST /docents/${d1}/training-records", payload: { kind: "SHADOW_TOUR", value: 1 }, as: DocentCoordinator }
            - { call: "POST /docents/${d1}/training-records", payload: { kind: "SHADOW_TOUR", value: 1 }, as: DocentCoordinator }
            - { call: "POST /docents/${d1}/training-records", payload: { kind: "QUIZ", value: 90 }, as: DocentCoordinator }
            - { call: "POST /docents/${d1}/advance", payload: { to_status: "CERTIFIED", route_ids: ["${route1}"] }, as: DocentCoordinator }
            - { call: "POST /tour-slots", payload: { route_id: "${route1}", start_at: "2026-09-01T10:00:00Z" }, as: MuseumAdmin, captures: { slot1: $.data.id } }
            - { call: "POST /shift-assignments", payload: { docent_id: "${d1}", slot_id: "${slot1}", shift_role: "LEAD" }, as: DocentCoordinator, captures: { sh1: $.data.id } }
            - { call: "POST /shift-assignments/${sh1}/decline", payload: {}, as: Docent, as_user_id: "${d1}" }
          trigger:
            - { call: "POST /shift-assignments/${sh1}/confirm", payload: {}, as: Docent, as_user_id: "${d1}" }
          assert:
            - "http_status == 409 and error_id == ERR_INVALID_STATE"

      - name: booking_hold_expiry_via_ops_epoch
        claim_type: valid_transition
        grounds: [state_machines.Booking.RESERVED_to_EXPIRED, entities.Booking.fields.hold_expires_at]
        distinguishing_aspect: "A RESERVED booking created at the default clock expires when the ops epoch runs at 2026-08-03T00:00:01Z (past min(created+48h, slot start)); its seats are released."
        test_recipe:
          setup:
            - "OPEN slot ${slot1} (capacity 18, start 2026-09-01) with RESERVED booking ${bk1} party 2 created at the default clock"
          setup_api_calls:
            - { call: "POST /rooms", payload: { name: "Parlor", floor: 1, capacity_max: 20, safety_max_party: 12, collection_tier: "STANDARD" }, as: MuseumAdmin, captures: { r1: $.data.id } }
            - { call: "POST /tour-routes", payload: { name: "Main Floor", kind: "STANDARD", room_ids: ["${r1}"], duration_minutes: 60, base_price_cents: 1000 }, as: MuseumAdmin, captures: { route1: $.data.id, route1_v: $.data.version } }
            - { call: "POST /tour-routes/${route1}/script-versions", payload: { content_text: "Script", curriculum_standards: [] }, as: Curator, captures: { s1: $.data.id } }
            - { call: "POST /script-versions/${s1}/submit", payload: {}, as: Curator }
            - { call: "POST /script-versions/${s1}/review", payload: { decision: "APPROVE", accuracy_score: 90 }, as: Curator }
            - { call: "POST /script-versions/${s1}/publish", payload: { expected_route_version: "${route1_v}" }, as: MuseumAdmin }
            - { call: "POST /tour-routes/${route1}/activate", payload: {}, as: MuseumAdmin }
            - { call: "POST /docents", payload: { full_name: "Dee Ocent", email: "dee@x.org" }, as: DocentCoordinator, captures: { d1: $.data.id } }
            - { call: "POST /docents/${d1}/advance", payload: { to_status: "TRAINEE" }, as: DocentCoordinator }
            - { call: "POST /docents/${d1}/training-records", payload: { kind: "HOURS", value: 30 }, as: DocentCoordinator }
            - { call: "POST /docents/${d1}/training-records", payload: { kind: "SHADOW_TOUR", value: 1 }, as: DocentCoordinator }
            - { call: "POST /docents/${d1}/training-records", payload: { kind: "SHADOW_TOUR", value: 1 }, as: DocentCoordinator }
            - { call: "POST /docents/${d1}/training-records", payload: { kind: "SHADOW_TOUR", value: 1 }, as: DocentCoordinator }
            - { call: "POST /docents/${d1}/training-records", payload: { kind: "QUIZ", value: 90 }, as: DocentCoordinator }
            - { call: "POST /docents/${d1}/advance", payload: { to_status: "CERTIFIED", route_ids: ["${route1}"] }, as: DocentCoordinator }
            - { call: "POST /tour-slots", payload: { route_id: "${route1}", start_at: "2026-09-01T10:00:00Z" }, as: MuseumAdmin, captures: { slot1: $.data.id } }
            - { call: "POST /shift-assignments", payload: { docent_id: "${d1}", slot_id: "${slot1}", shift_role: "LEAD" }, as: DocentCoordinator, captures: { sh1: $.data.id } }
            - { call: "POST /shift-assignments/${sh1}/confirm", payload: {}, as: Docent, as_user_id: "${d1}" }
            - { call: "POST /tour-slots/${slot1}/open", payload: {}, as: MuseumAdmin }
            - { call: "POST /bookings", payload: { slot_id: "${slot1}", booking_kind: "GENERAL", visitor_name: "Ann", party_size: 2 }, as: FrontDeskStaff, captures: { bk1: $.data.id } }
          trigger:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T00:00:01Z" }, as: MuseumAdmin }
            - { call: "POST /_ops/run_epoch", payload: {}, as: MuseumAdmin, captures: { expired: $.data.expired_booking_count } }
            - { call: "GET /bookings/${bk1}", payload: {}, as: FrontDeskStaff, captures: { bk_st: $.data.status } }
            - { call: "GET /tour-slots/${slot1}", payload: {}, as: MuseumAdmin, captures: { avail: $.data.seats_available } }
          assert:
            - "expired_booking_count == 1"
            - "Booking.${bk1}.status == EXPIRED (hold_expires_at was 2026-08-03T00:00:00Z = min(created+48h, slot start))"
            - "TourSlot.${slot1}.seats_available == 18 (seats released)"

      - name: member_lapse_via_ops_epoch
        claim_type: valid_transition
        grounds: [state_machines.Member.ACTIVE_to_LAPSED, state_machines.Member.LAPSED_to_ACTIVE]
        distinguishing_aspect: "ACTIVE member whose renews_on (2026-08-10) is in the past lapses on the next ops epoch; renew returns the member to ACTIVE."
        test_recipe:
          setup: ["member ${m1} ACTIVE with renews_on 2026-08-10"]
          setup_api_calls:
            - { call: "POST /members", payload: { full_name: "Mel Member", email: "mel@x.org", member_number: "M-100", renews_on: "2026-08-10" }, as: FrontDeskStaff, captures: { m1: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-11T00:00:00Z" }, as: MuseumAdmin }
          trigger:
            - { call: "POST /_ops/run_epoch", payload: {}, as: MuseumAdmin, captures: { lapsed: $.data.lapsed_member_count } }
