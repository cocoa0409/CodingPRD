            - "after trigger[1]: BasicScore(carrier_id=${c3_id}, basic_category=UNSAFE_DRIVING).alert_status == ALERT"
            - "after trigger[1]: Carrier.${c3_id}.iss_pre_credit_value == 28.0"
            - "after trigger[1]: Carrier.${c3_id}.iss_value == 28.0"
            - "after trigger[1]: Carrier.${c3_id}.accepted_challenge_count_24mo == 0"
            - "after trigger[1]: Carrier.${c3_id}.resolved_challenge_count_24mo == 0"
            - "after trigger[3]: HTTP status == 200"
            - "after trigger[3]: DataChallenge.${chB_id}.status == SUBMITTED"
            - "after trigger[3]: Carrier.${c3_id}.challenge_quota_used == 1"
            - "after trigger[3]: Violation.${v2_id}.under_challenge == true"
            - "after trigger[3]: BasicScore(carrier_id=${c3_id}, basic_category=UNSAFE_DRIVING).certified_measure == 1.000"
            - "after trigger[3]: BasicScore(carrier_id=${c3_id}, basic_category=UNSAFE_DRIVING).percentile == 65.0"

      - name: time_weighted_severity_conserved_across_carrier_reattribution
        grounds:
          - state_machines.InspectionReport.SCORED_to_AMENDED
          - state_machines.InspectionReport.AMENDED_to_SCORED
          - concurrency_rules[amendment-create-stale-report]
          - entities.ReportAmendment.fields.report_version_before
          - calculations.basic_measure_recompute
        distinguishing_aspect: |
          Total time-weighted severity is conserved across the reattribution rather than created or
          destroyed: the amendment drops the report out of SCORED so BOTH carriers read
          total_time_weighted_severity 0.0 while each violation still carries 15.0 and the report still
          carries 30.0, and re-scoring moves exactly 30.0 onto c2 (measure 0.800 on denominator 37.5)
          while c1 stays at 0.0, so the cross-carrier sum is 30.0 before and after.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "Carrier c1 (20 power units, 1,600,000 VMT) -> MEDIUM, power_unit_exposure 30.0; carrier c2 (25 power units, 2,000,000 VMT) -> MEDIUM, power_unit_exposure 37.5."
            - "UNSAFE_DRIVING code weight 5; UNSAFE_DRIVING/MEDIUM threshold 0.5 / 1.0 / 2.0."
            - "One SCORED report attributed to c1, dated 2026-07-01, with two UNSAFE_DRIVING violations (15.0 each, report total 30.0) -> c1 certified_measure 1.000, percentile 65.0, ALERT."
            - "The report's current version has been read so the amendment can present it as expected_report_version."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: FmcsaProgramAuditor
              as_user_id: "auditor_alice"
            - call: "POST /carriers"
              payload: { dot_number: "1000001", legal_name: "Buckeye Freight LLC", average_power_units: 20, annual_vmt: 1600000 }
              as: FmcsaProgramAuditor
