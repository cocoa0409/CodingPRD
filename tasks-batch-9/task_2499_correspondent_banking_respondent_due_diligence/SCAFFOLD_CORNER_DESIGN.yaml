            - call: "GET /correspondent-banking/respondents?limit=2&offset=4"
              payload: {}
              as: ComplianceAnalyst
              as_user_id: "u-analyst-1"
            - call: "GET /correspondent-banking/respondents?limit=2&offset=99"
              payload: {}
              as: ComplianceAnalyst
              as_user_id: "u-analyst-1"
          assert:
            - "all three responses have status 200"
            - "first response.data ids == [${r3}, ${r4}] in that order with total_count 5 and has_more true"
            - "second response.data ids == [${r5}] with total_count 5 and has_more false"
            - "third response.data is empty with total_count 5 and has_more false"
            - "every response carries meta.api_request_id and meta.api_request_timestamp"

      - name: respondent_list_filters_combine_conjunctively
        claim_type: standard_crud
        grounds:
          - endpoints[GET /correspondent-banking/respondents]
        distinguishing_aspect: "Three respondents differ in dd_state and home jurisdiction; the filter pair dd_state=DD_IN_PROGRESS & home_jurisdiction_code=DE must intersect rather than union, returning exactly the one row that satisfies both, and total_count must reflect the filtered set rather than the table size."
