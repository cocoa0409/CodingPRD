      setup:
      - Center 300000 GLA with occupancy_grace_days 30 and five leases
      - 'CoTenancyCondition on lease I1: required_occupancy_pct 81.67, grace_period_days 0'
      - Lease I3 DARK on 2026-08-01, so the live engine reports 75.00 pct, the condition is BREACHED and lease I1 is ELIGIBLE
      - A DRAFT TRAILING_GRACE OccupancyMeasurement created on 2026-08-01 whose figures re-admit the freshly dark suite at 85.00 pct
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-08-01T00:00:00Z'
        as: ComplianceOfficer
        as_user_id: co-analyst-1
      - call: POST /centers
        payload:
          name: Northgate Crossing
