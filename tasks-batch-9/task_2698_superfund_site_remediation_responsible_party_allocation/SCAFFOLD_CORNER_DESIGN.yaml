          - entities.WasteInRecord
          - endpoints[POST /waste-in-records/{id}/verification]
        distinguishing_aspect: "One party's derived volumetric profile is read after each of the three mutations the guide asks for - a source row added, a source row confirmed, and a source row removed from the basis by rejection - and the pair of party percentages sums to exactly 100.00 at every step."
