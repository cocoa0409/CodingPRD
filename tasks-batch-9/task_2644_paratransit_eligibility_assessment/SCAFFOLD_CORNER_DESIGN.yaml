              as_user_id: "eval-1"
            - call: "POST /assessments/${asmt_id}/scores"
              payload: { board_alight_score: 0, wayfinding_score: 2, distance_meters_walked: 95, heat_sensitivity_flag: false }
              as: Evaluator
              as_user_id: "eval-1"
            - call: "GET /applications/${appn_id}"
              payload: {}
              as: EligibilitySpecialist
              captures: { v_scored: $.data.version, status_scored: $.data.status }
            - call: "POST /assessments/${asmt_id}/sign-off"
              payload: {}
              as: EligibilitySpecialist
