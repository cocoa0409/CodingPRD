              payload: { seller_id: "${seller_id}", street_address: "77 Redwood Rd", city: "Oakland", county_code: "CA-ALAMEDA", state_code: "CA", estimated_value_cents: 28000000 }
              as: Seller
              as_user_id: "${seller_id}"
              captures: { listing_id: $.data.id }
            - call: "POST /asset-listings/${listing_id}/disclosures"
              payload: { occupancy_status: "VACANT", title_condition: "CLEAR" }
              as: Seller
              as_user_id: "${seller_id}"
            - call: "POST /trustee-sales"
              payload: { asset_listing_id: "${listing_id}", county_code: "CA-ALAMEDA", sale_scheduled_at: "2026-09-15T18:00:00Z" }
              as: Trustee
              captures: { sale_id: $.data.id }
            - call: "POST /auction-events"
              payload: { title: "Alameda Redwood Trustee Sale", county_code: "CA-ALAMEDA", starts_at: "2026-09-15T17:00:00Z", ends_at: "2026-09-15T19:00:00Z", trustee_sale_id: "${sale_id}" }
              as: AuctionOps
              captures: { event_id: $.data.id, event_v: $.data.version }
            - call: "POST /auction-events/${event_id}/lots"
              payload: { asset_listing_id: "${listing_id}", lot_number: 1, lot_window_start_at: "2026-09-15T17:00:00Z", lot_window_end_at: "2026-09-15T18:00:00Z", opening_bid_cents: 20000000, reserve_price_cents: 20000000, expected_auction_event_version: "${event_v}" }
              as: AuctionOps
              captures: { lot_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T17:05:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /auction-events/${event_id}/open"
              payload: {}
              as: AuctionOps
              captures: { err_id: $.data.error_id }
            - call: "POST /trustee-sales/${sale_id}/confirm"
              payload: { confirmation_reference: "TS-ALA-7302" }
              as: Trustee
            - call: "POST /auction-events/${event_id}/open"
              payload: {}
              as: AuctionOps
          assert:
            - "First attempt is 409 with ${err_id} == ERR_TRUSTEE_SALE_NOT_CONFIRMED (the failing call is POST /auction-events/{id}/open)"
            - "After the rejection AuctionEvent.${event_id}.event_status == SCHEDULED and opened_at is null"
            - "After the rejection AuctionLot.${lot_id}.lot_status == PENDING"
            - "TrusteeSale.${sale_id}.status == CONFIRMED after the confirm call"
            - "Second attempt is 200: AuctionEvent.${event_id}.event_status == LIVE and opened_at == 2026-09-15T17:05:00Z"
            - "AuctionLot.${lot_id}.lot_status == OPEN and bid_close_at == 2026-09-15T18:00:00Z"

