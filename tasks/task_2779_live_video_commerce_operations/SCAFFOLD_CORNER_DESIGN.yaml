      - name: acknowledge_with_the_wrong_script_code_returns_invalid_request
        claim_type: violation_and_satisfaction
        grounds:
          - validations[priority=6]
          - errors[ERR_INVALID_REQUEST]
          - entities.DisclosureRecord.fields.required_script_code
        distinguishing_aspect: "script_code_spoken must equal required_script_code verbatim: SCRIPT-PAID-99 against SCRIPT-PAID-01 returns 400 ERR_INVALID_REQUEST and leaves the record PENDING; the exact code then acknowledges it."
        test_recipe:
          setup:
            - "A PENDING PAID_ENDORSEMENT disclosure requiring SCRIPT-PAID-01 on a CONFIRMED booking of a DRAFT show."
          setup_api_calls:
            - *k_clock_t0
            - *k_host
            - *k_cert
            - *k_show
            - *k_booking
            - *k_disclosure
            - *k_confirm
          trigger:
            - call: "POST /disclosure-records/${d1}/acknowledge"
              payload: { script_code_spoken: "SCRIPT-PAID-99" }
              as: Host
              as_user_id: "${h1}"
              captures: { err_script: $.data.error_id }
            - call: "POST /disclosure-records/${d1}/acknowledge"
              payload: { script_code_spoken: "SCRIPT-PAID-01" }
              as: Host
              as_user_id: "${h1}"
          assert:
            - "First call: HTTP 400 with ${err_script} == ERR_INVALID_REQUEST; DisclosureRecord.${d1}.status == PENDING and acknowledged_at == null"
            - "Second call: HTTP 200; status == ACKNOWLEDGED, acknowledged_at == 2026-08-01T00:00:00Z"
            - "acknowledged_late == false because Show.${sh1}.went_live_at is still null"

