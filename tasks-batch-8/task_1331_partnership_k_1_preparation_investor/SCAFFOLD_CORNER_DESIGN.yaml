              captures: { t2: "$.data.id" }
            - call: "POST /funds/tax-years"
              payload: { fund_id: "${f}", year: 2025, gross_ordinary_income_cents: 0, capital_gain_cents: 0, interest_income_cents: 0 }
              as: FundTaxAdmin
            - call: "POST /funds/transfers"
              payload: { fund_id: "${f}", transferor_partner_id: "${t1}", transferee_partner_id: "${t2}", pct_bps: 6001, effective_date: "2025-03-01", settlement_date: "2025-03-05" }
              as: FundTaxAdmin
              captures: { tr_over: "$.data.id" }
          trigger:
            - call: "POST /funds/transfers/${tr_over}/confirm"
              payload: {}
              as: FundTaxAdmin
              captures: { e: "$.data.error_id" }
          assert:
            - "error_id == ERR_INSUFFICIENT_OWNERSHIP (422): 6001bps exceeds the transferor's 6000bps"

      - name: generation_without_locked_run_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=13]", "errors[ERR_ALLOCATION_NOT_LOCKED]"]
        distinguishing_aspect: "k1-generation against an APPROVED-less pipeline (run only COMPUTED, never locked) fails with ERR_ALLOCATION_NOT_LOCKED before any K1 is created."
        test_recipe:
          setup: ["fund with partner; TaxYear 2025 BOOKS_CLOSED; one COMPUTED (never locked) FINAL run"]
          setup_api_calls:
            - call: "POST /funds"
              payload: { legal_name: "Fund ER2", ein: "22-6000002", waterfall_hurdle_rate_bps: 800, waterfall_catchup_bps: 2000, waterfall_carry_bps: 2000, foreign_ownership_cap_pct_bps: 10000, management_fee_rate_bps: 0, fee_discount_threshold_cents: 1, fee_discount_bps: 0 }
              as: FundTaxAdmin
              captures: { f: "$.data.id" }
            - call: "POST /funds/partners"
              payload: { fund_id: "${f}", legal_name: "P", partner_type: US_INDIVIDUAL, partner_class: LIMITED, residency_state: "CA", ownership_pct_bps: 10000, capital_commitment_cents: 1, admission_date: "2025-01-01" }
              as: FundTaxAdmin
            - call: "POST /funds/tax-years"
              payload: { fund_id: "${f}", year: 2025, gross_ordinary_income_cents: 1000000, capital_gain_cents: 0, interest_income_cents: 0 }
              as: FundTaxAdmin
              captures: { ty: "$.data.id" }
            - call: "POST /funds/tax-years/${ty}/close-books"
              payload: {}
              as: FundTaxAdmin
              captures: { ty_v: "$.data.version" }
            - call: "POST /funds/allocation-runs"
              payload: { tax_year_id: "${ty}", run_kind: FINAL, expected_tax_year_version: "${ty_v}" }
              as: TaxPreparer
          trigger:
            - call: "POST /funds/k1-generation"
              payload: { tax_year_id: "${ty}" }
              as: TaxPreparer
              captures: { e: "$.data.error_id" }
          assert:
            - "error_id == ERR_INVALID_STATE_TRANSITION (409): the state guard (tax year not APPROVED, priority 5) fires before the fiscal guard ERR_ALLOCATION_NOT_LOCKED (priority 13), and no K1Package is created"

  # ===========================================================================
  # Section: rbac
  # ===========================================================================
  - section: rbac
    instances:
      - name: reviewer_cannot_create_allocation_run
        claim_type: role_denial
        grounds: ["roles[TaxReviewer]", "endpoints[POST /funds/allocation-runs]"]
        distinguishing_aspect: "TaxReviewer is excluded from run creation (TaxPreparer-exclusive): the role check at priority 2 fires before any business logic."
        test_recipe:
          setup: ["fund with partner; TaxYear 2025 OPEN"]
          setup_api_calls:
            - call: "POST /funds"
              payload: { legal_name: "Fund RB1", ein: "22-7000001", waterfall_hurdle_rate_bps: 800, waterfall_catchup_bps: 2000, waterfall_carry_bps: 2000, foreign_ownership_cap_pct_bps: 10000, management_fee_rate_bps: 0, fee_discount_threshold_cents: 1, fee_discount_bps: 0 }
              as: FundTaxAdmin
              captures: { f: "$.data.id" }
            - call: "POST /funds/partners"
              payload: { fund_id: "${f}", legal_name: "P", partner_type: US_INDIVIDUAL, partner_class: LIMITED, residency_state: "CA", ownership_pct_bps: 10000, capital_commitment_cents: 1, admission_date: "2025-01-01" }
