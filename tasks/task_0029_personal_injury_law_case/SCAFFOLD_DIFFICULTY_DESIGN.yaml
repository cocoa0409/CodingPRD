  # =========================================================================
  # Rule 4 — Transitive cascade chains from different triggers
  #
  # Instance 1: SettlementOffer.accept cascade depth ≥ 3
  # Instance 2: DemandLetter.send cascade depth ≥ 2
  # =========================================================================
  - rule_id: transitive_cascade
    instances:

      - name: settlement_accept_three_hop_cascade
        grounds:
          - state_machines.SettlementOffer.PENDING_to_ACCEPTED
          - state_machines.Case.IN_NEGOTIATION_to_SETTLED
          - state_machines.MedicalLien.NEGOTIATING_to_AGREED
          - state_machines.CourtEvent.SCHEDULED_to_CANCELLED
          - calculations.contingency_fee
          - calculations.lien_proportional_cap
          - entities.Disbursement.fields.status
        distinguishing_aspect: |
          Accepting a settlement offer triggers a depth-3 cascade where each hop is
          caused by the previous one (not a fan-out): hop 1 = SettlementOffer
          PENDING→ACCEPTED; hop 2 (caused by hop 1) = Case IN_NEGOTIATION→SETTLED;
          hop 3 (caused by hop 2's Case.SETTLED-state cascade) = every NEGOTIATING/
          ASSERTED MedicalLien auto-transitions to AGREED with negotiated_amount set
          per lien_proportional_cap, AND every SCHEDULED CourtEvent auto-transitions
          to CANCELLED, AND a Disbursement is created with contingency_fee /
          total_lien_payout / net_to_client computed. Replaying without hop 1 leaves
          the lien at NEGOTIATING (no hop-3 effect), confirming the chain shape.
        test_recipe:
          setup:
            - "Active CA Case, clock 2026-01-01; one REVIEWED MedicalRecordsRequest; INCLUDED damages totaling 4_400_000 cents (see Rule 1 instance 1 distribution); one SCHEDULED CourtEvent (HEARING) far in the future; one MedicalLien on the case in NEGOTIATING with asserted_amount_cents=1_500_000; one CARRIER PENDING offer at 6_000_000."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /clients/register"
              payload: { full_name: "Cascade Client", email: "cas@example.com", phone: "555-0600" }
              as: Anonymous
              captures: { client_id: $.data.id }
            - call: "POST /clients/${client_id}/sign-retainer"
              payload: {}
              as: Paralegal
            - call: "POST /cases"
              payload: { client_id: "${client_id}", accident_date: "2024-06-15", jurisdiction: "CA" }
              as: Paralegal
              captures: { case_id: $.data.id }
            - call: "POST /cases/${case_id}/activate"
              payload: {}
              as: Attorney
            - call: "POST /medical-providers"
              payload: { name: "Cascade Hospital", contact: "ch@p.example" }
              as: Paralegal
              captures: { provider_id: $.data.id }
            - call: "POST /medical-records-requests"
              payload: { case_id: "${case_id}", provider_id: "${provider_id}" }
              as: Paralegal
              captures: { mrr_id: $.data.id }
            - call: "POST /medical-records-requests/${mrr_id}/receive"
              payload: {}
              as: Paralegal
            - call: "POST /medical-records-requests/${mrr_id}/review"
              payload: {}
              as: Attorney
            - call: "POST /damages-items"
              payload: { case_id: "${case_id}", category: "MEDICAL_BILLS", amount_cents: 1000000 }
              as: Paralegal
              captures: { di_med: $.data.id }
            - call: "POST /damages-items/${di_med}/include"
              payload: {}
              as: Attorney
            - call: "POST /damages-items"
              payload: { case_id: "${case_id}", category: "LOST_WAGES", amount_cents: 500000 }
              as: Paralegal
              captures: { di_wages: $.data.id }
            - call: "POST /damages-items/${di_wages}/include"
              payload: {}
              as: Attorney
            - call: "POST /damages-items"
              payload: { case_id: "${case_id}", category: "FUTURE_MEDICAL", amount_cents: 600000 }
              as: Paralegal
              captures: { di_fut: $.data.id }
            - call: "POST /damages-items/${di_fut}/include"
              payload: {}
              as: Attorney
            - call: "POST /damages-items"
              payload: { case_id: "${case_id}", category: "PROPERTY", amount_cents: 300000 }
              as: Paralegal
              captures: { di_prop: $.data.id }
            - call: "POST /damages-items/${di_prop}/include"
              payload: {}
              as: Attorney
            - call: "POST /damages-items"
