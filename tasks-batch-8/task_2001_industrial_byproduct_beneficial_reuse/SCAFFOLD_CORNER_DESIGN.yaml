  - section: validations
    instances:
      - name: create_generator_missing_auth_headers_returns_unauthenticated
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "A POST without X-User-Role / X-User-ID headers is rejected 401 ERR_UNAUTHENTICATED before any other check."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /api/generators", payload: { legal_name: "GenCo", hq_state_code: "OH", contact_email: "g@x.com" }, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_UNAUTHENTICATED with HTTP 401"

      - name: same_officer_cannot_approve_own_filing_returns_segregation_error
        claim_type: violation_to_error
        grounds: ["validations[priority=3]", "errors[ERR_SEGREGATION_OF_DUTIES]"]
        distinguishing_aspect: "Segregation of duties: the ComplianceOfficer who filed the determination (co_file) cannot approve it; the same call by a different officer succeeds."
        test_recipe:
          setup: ["FLY_ASH stream with VERIFIED characterization; determination filed and submitted by co_file"]
          setup_api_calls:
            - { call: "POST /api/generators", payload: { legal_name: "GenCo", hq_state_code: "OH", contact_email: "g@x.com" }, as: BrokerOps, captures: { g_id: $.data.id } }
            - { call: "POST /api/streams", payload: { generator_id: "${g_id}", material_type: "FLY_ASH", declared_moisture_pct: 9.0, expected_tons_per_month: 500 }, as: Generator, as_user_id: "${g_id}", captures: { s_id: $.data.id } }
            - { call: "POST /api/streams/${s_id}/characterizations", payload: { lab_name: "LabCo", sampled_on: "2026-07-01", ph: 7.2, arsenic_ppm: 3.0, lead_ppm: 2.0, moisture_pct_measured: 9.5 }, as: Generator, as_user_id: "${g_id}", captures: { c_id: $.data.id } }
            - { call: "POST /api/characterizations/${c_id}/verify", payload: {}, as: BrokerOps }
            - { call: "POST /api/streams/${s_id}/eligibility-determinations", payload: { state_code: "PA", use_case: "CEMENT_ADDITIVE", valid_from: "2026-01-01", valid_until: "2027-01-01" }, as: ComplianceOfficer, as_user_id: "co_file", captures: { d_id: $.data.id } }
            - { call: "POST /api/eligibility-determinations/${d_id}/submit", payload: {}, as: ComplianceOfficer, as_user_id: "co_file" }
          trigger:
            - { call: "POST /api/eligibility-determinations/${d_id}/approve", payload: {}, as: ComplianceOfficer, as_user_id: "co_file", captures: { err: $.data.error_id } }
            - { call: "POST /api/eligibility-determinations/${d_id}/approve", payload: {}, as: ComplianceOfficer, as_user_id: "co_appr" }
          assert:
            - "err == ERR_SEGREGATION_OF_DUTIES with HTTP 403 (filer == approver)"
            - "the second approve (co_appr) succeeds: ReuseEligibility.${d_id}.status == APPROVED"

