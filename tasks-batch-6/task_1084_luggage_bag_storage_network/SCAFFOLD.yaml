# =============================================================================
# Scaffold: Luggage & Bag Storage Network (Bounce-style) — Expert
# =============================================================================

scenario: |
  Luggage & Bag Storage Network (Bounce style): host/location & capacity,
  booking & per-bag/day, drop/pickup & seal/photo, insurance & claim, host
  payout & fee, oversize, extension, rating

domain_name: luggage-bag-storage-network
api_prefix: /

# -----------------------------------------------------------------------------
# Complexity profile (Step 0)
# -----------------------------------------------------------------------------
complexity_profile:
  primary_archetype: temporal_windowing
  secondary_archetype: pricing_engine
  complexity_layers:
    - optimistic_concurrency          # OCC on Location.version guarding booking creation
    - dual_variant_calculation        # booking estimate vs final; payout provisional vs final
    - cascading_side_effects          # pickup->payout->host; claim->payout->host->location
    - rate_threshold_triggers         # oversize threshold, late overage, coverage caps

  entity_topology: hybrid
  # Host -> Location is a nested hierarchy; Booking / Bag / Extension / Claim /
  # Payout / Rating are flat entities linked by foreign keys across aggregates.

  state_machine_shape: cyclic
  # Claim carries a NEEDS_INFO <-> UNDER_REVIEW revision loop; Extension is a
  # branching fork; Location OPEN <-> SUSPENDED is cyclic. Not all-linear.

  relationship_patterns:
    - one_to_many        # Host has many Locations; Booking has many Bags
    - cross_aggregate    # Booking references Location + Traveler + InsurancePlan; Claim references Booking + Bag; Payout references Host + Booking

  role_model: peer_roles
  # Traveler owns bookings/claims/ratings; Host owns locations/drop-off/pickup;
  # PlatformAdmin adjudicates claims and settles payouts.

  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED — EMIT VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Host
    parent: null
    common_fields: true
    fields:
      - { name: display_name, type: string, source: input, description: "Host business name" }
      - { name: email, type: string, source: input, description: "Host contact email" }
      - { name: platform_fee_bps, type: integer, source: input, default: 2000, description: "Platform commission in basis points (2000 = 20%) applied to host-eligible revenue" }
      - { name: max_concurrent_bookings, type: integer, source: input, default: 5, description: "Network-wide cap on simultaneously-active (RESERVED or STORED) bookings across all this host's locations" }
      - { name: status, type: enum, source: system, default: "ACTIVE", description: "ACTIVE | SUSPENDED" }
      - { name: pending_payout_cents, type: integer, source: computed, default: 0, description: "Sum of net_cents over this host's PENDING payouts (moves to payout_balance on release)" }
      - { name: payout_balance_cents, type: integer, source: computed, default: 0, description: "Sum of net_cents over this host's RELEASED (not REVERSED) payouts" }
      - { name: lifetime_earnings_cents, type: integer, source: computed, default: 0, description: "Cumulative net_cents ever credited at payout creation" }
      - { name: rating_sum, type: integer, source: computed, default: 0, description: "Running sum of Rating.score across this host's rated bookings" }
      - { name: rating_count, type: integer, source: computed, default: 0, description: "Running count of ratings" }
      - { name: avg_rating, type: number, source: computed, default: 0, description: "rating_sum / rating_count, 2 decimals, 0 when rating_count == 0" }

  - name: Traveler
    parent: null
    common_fields: true
    fields:
      - { name: email, type: string, source: input, description: "Traveler email" }
      - { name: full_name, type: string, source: input, description: "Traveler full name" }
      - { name: status, type: enum, source: system, default: "ACTIVE", description: "ACTIVE (travelers are always active in this scaffold)" }

  - name: InsurancePlan
    parent: null
    common_fields: true
    fields:
      - { name: tier, type: enum, source: input, description: "NONE | BASIC | PREMIUM (coverage tier)" }
      - { name: per_bag_coverage_cents, type: integer, source: input, description: "Maximum approvable claim per bag under this plan (0 for NONE)" }
      - { name: premium_cents_per_bag_day, type: integer, source: input, description: "Insurance premium charged per bag per billable day (0 for NONE); retained by platform, not host" }

  - name: Location
    parent: Host
    common_fields: true
    fields:
      - { name: host_id, type: string, source: system, description: "FK -> Host.id; owning host (from path)" }
      - { name: name, type: string, source: input, description: "Location display name" }
      - { name: address, type: string, source: input, description: "Street address" }
      - { name: daily_bag_capacity, type: integer, source: input, description: "Max total bags (standard + oversize) stored on any single day" }
      - { name: oversize_capacity, type: integer, source: input, description: "Max oversize bags stored on any single day (sub-limit of daily_bag_capacity)" }
      - { name: per_bag_day_rate_cents, type: integer, source: input, description: "Storage price per bag per billable day" }
      - { name: oversize_surcharge_cents_per_day, type: integer, source: input, description: "Additional charge per oversize bag per billable day" }
      - { name: status, type: enum, source: system, default: "DRAFT", description: "DRAFT | OPEN | SUSPENDED | CLOSED" }

  - name: Booking
    parent: null
    common_fields: true
    fields:
      - { name: location_id, type: string, source: input, description: "FK -> Location.id; storage location" }
      - { name: traveler_id, type: string, source: input, description: "FK -> Traveler.id; booking owner" }
      - { name: insurance_plan_id, type: string, source: input, description: "FK -> InsurancePlan.id; selected coverage tier" }
      - { name: check_in_date, type: string, source: input, description: "Drop-off calendar date (YYYY-MM-DD), inclusive" }
      - { name: check_out_date, type: string, source: input, description: "Scheduled pickup date (YYYY-MM-DD), exclusive of billing; mutated on extension confirm" }
      - { name: bag_count, type: integer, source: computed, description: "Number of Bag rows created for this booking" }
      - { name: oversize_count, type: integer, source: computed, description: "Number of bags with is_oversize == true (dimension_sum_cm >= OVERSIZE_THRESHOLD_CM)" }
      - { name: billable_days, type: integer, source: computed, description: "max(1, (check_out_date - check_in_date) in days)" }
      - { name: estimated_total_cents, type: integer, source: computed, description: "Estimate computed at creation via booking_estimate" }
      - { name: final_total_cents, type: integer, source: computed, default: null, description: "Final settlement computed at pickup via booking_final_settlement (null until COMPLETED)" }
      - { name: overage_days, type: integer, source: computed, default: 0, description: "max(0, (pickup date - check_out_date) in days), set at pickup" }
      - { name: late_fee_cents, type: integer, source: computed, default: 0, description: "Late overage fee set at pickup" }
      - { name: dropoff_at, type: datetime, source: system, default: null, description: "Logical-clock timestamp of drop-off" }
      - { name: pickup_at, type: datetime, source: system, default: null, description: "Logical-clock timestamp of pickup" }
      - { name: status, type: enum, source: system, default: "RESERVED", description: "RESERVED | STORED | OVERDUE | COMPLETED | CANCELLED" }

  - name: Bag
    parent: Booking
    common_fields: true
    fields:
      - { name: booking_id, type: string, source: system, description: "FK -> Booking.id; parent booking (from path)" }
      - { name: declared_value_cents, type: integer, source: input, description: "Traveler-declared value; upper bound on any claim for this bag" }
      - { name: dimension_sum_cm, type: integer, source: input, description: "Sum of length+width+height in cm; determines oversize classification" }
      - { name: is_oversize, type: boolean, source: computed, description: "true iff dimension_sum_cm >= OVERSIZE_THRESHOLD_CM (input ignored)" }
      - { name: seal_code, type: string, source: system, default: null, description: "Tamper-evident seal code recorded at drop-off" }
      - { name: drop_photo_url, type: string, source: system, default: null, description: "Photo captured at drop-off" }
      - { name: status, type: enum, source: system, default: "AWAITING_DROP", description: "AWAITING_DROP | SEALED | RETRIEVED | VOIDED" }

  - name: Extension
    parent: null
    common_fields: true
    fields:
      - { name: booking_id, type: string, source: input, description: "FK -> Booking.id; booking being extended" }
      - { name: previous_check_out_date, type: string, source: system, description: "Booking check_out_date at request time (YYYY-MM-DD)" }
      - { name: new_check_out_date, type: string, source: input, description: "Requested new pickup date (YYYY-MM-DD), must be after previous_check_out_date" }
      - { name: added_days, type: integer, source: computed, description: "(new_check_out_date - previous_check_out_date) in days" }
      - { name: added_cost_cents, type: integer, source: computed, description: "Incremental storage+oversize+insurance cost for the added days" }
      - { name: status, type: enum, source: system, default: "REQUESTED", description: "REQUESTED | CONFIRMED | REJECTED" }

  - name: Claim
    parent: null
    common_fields: true
    fields:
      - { name: booking_id, type: string, source: input, description: "FK -> Booking.id; booking the damaged/lost bag belongs to" }
      - { name: bag_id, type: string, source: input, description: "FK -> Bag.id; the affected bag" }
      - { name: reason, type: enum, source: input, description: "DAMAGE | LOSS | THEFT" }
      - { name: description, type: string, source: input, description: "Free-text description of the incident" }
      - { name: claimed_amount_cents, type: integer, source: input, description: "Amount requested by traveler; must be > 0 and <= bag.declared_value_cents" }
      - { name: approved_amount_cents, type: integer, source: computed, default: null, description: "Amount granted at APPROVE = min(claimed, plan.per_bag_coverage_cents, bag.declared_value_cents); null until APPROVED" }
      - { name: status, type: enum, source: system, default: "OPEN", description: "OPEN | UNDER_REVIEW | NEEDS_INFO | APPROVED | REJECTED" }

  - name: Payout
    parent: null
    common_fields: true
    fields:
      - { name: host_id, type: string, source: system, description: "FK -> Host.id; host receiving the payout" }
      - { name: booking_id, type: string, source: system, description: "FK -> Booking.id; source booking" }
      - { name: gross_cents, type: integer, source: computed, description: "Host-eligible revenue = base_final + oversize_final + late_fee (insurance premium excluded)" }
      - { name: platform_fee_cents, type: integer, source: computed, description: "round_half_up(gross_cents * host.platform_fee_bps / 10000)" }
      - { name: claim_deduction_cents, type: integer, source: computed, default: 0, description: "Sum of approved_amount_cents over APPROVED claims on this booking; grows via claim-approve cascade" }
      - { name: net_cents, type: integer, source: computed, description: "gross_cents - platform_fee_cents - claim_deduction_cents" }
      - { name: status, type: enum, source: system, default: "PENDING", description: "PENDING | RELEASED | REVERSED" }

  - name: Rating
    parent: null
    common_fields: true
    fields:
      - { name: booking_id, type: string, source: input, description: "FK -> Booking.id; rated booking (must be COMPLETED, one rating per booking)" }
      - { name: score, type: integer, source: input, description: "Integer 1..5" }
      - { name: comment, type: string, source: input, default: null, description: "Optional free-text review" }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Host
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /hosts/{id}/status {to_status: SUSPENDED}"
        actor: PlatformAdmin
        preconditions: []
        side_effects:
          - "Cascade: every Location of this host currently in OPEN transitions to SUSPENDED (actor system)"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "system (automatic when pending_payout_cents becomes < 0 after a claim-approve payout adjustment)"
        actor: system
        preconditions: []
        side_effects:
          - "Cascade hop 3: every Location of this host currently OPEN transitions to SUSPENDED"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /hosts/{id}/status {to_status: ACTIVE}"
        actor: PlatformAdmin
        preconditions: []
        side_effects:
          - "Locations are NOT auto-reopened; host must re-open each location explicitly"

  - entity: Location
    initial_state: DRAFT
    terminal_states: [CLOSED]
    transitions:
      - from: DRAFT
        to: OPEN
        trigger: "POST /locations/{id}/status {to_status: OPEN}"
        actor: Host
        preconditions:
          - "Owning host.status == ACTIVE (else ERR_HOST_SUSPENDED)"
        side_effects: []
      - from: OPEN
        to: SUSPENDED
        trigger: "POST /locations/{id}/status {to_status: SUSPENDED}"
        actor: Host | PlatformAdmin | system
        preconditions: []
        side_effects: []
      - from: SUSPENDED
        to: OPEN
        trigger: "POST /locations/{id}/status {to_status: OPEN}"
        actor: Host | PlatformAdmin
        preconditions:
          - "Owning host.status == ACTIVE (else ERR_HOST_SUSPENDED)"
        side_effects: []
      - from: OPEN
        to: CLOSED
        trigger: "POST /locations/{id}/status {to_status: CLOSED}"
        actor: Host | PlatformAdmin
        preconditions:
          - "No booking on this location is in RESERVED, STORED, or OVERDUE (else ERR_LOCATION_HAS_ACTIVE_BOOKINGS)"
        side_effects: []
      - from: SUSPENDED
        to: CLOSED
        trigger: "POST /locations/{id}/status {to_status: CLOSED}"
        actor: Host | PlatformAdmin
        preconditions:
          - "No booking on this location is in RESERVED, STORED, or OVERDUE (else ERR_LOCATION_HAS_ACTIVE_BOOKINGS)"
        side_effects: []

  - entity: Booking
    initial_state: RESERVED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: RESERVED
        to: STORED
        trigger: "POST /bookings/{id}/dropoff"
        actor: Host
        preconditions:
          - "Acting host owns the booking's location (else ERR_NOT_LOCATION_HOST)"
          - "location.status == OPEN (else ERR_LOCATION_NOT_OPEN) — cross-entity Booking->Location"
          - "seals[] provides exactly one entry per bag with a non-empty seal_code and photo_url (else ERR_BAG_NOT_SEALED)"
          - "No seal_code duplicates another SEALED bag at the same location (else ERR_DUPLICATE_SEAL)"
        side_effects:
          - "Each Bag: status AWAITING_DROP -> SEALED, seal_code and drop_photo_url recorded"
          - "booking.dropoff_at = current logical clock"
      - from: RESERVED
        to: CANCELLED
        trigger: "POST /bookings/{id}/cancel"
        actor: Traveler
        preconditions:
          - "Acting traveler owns the booking (else ERR_NOT_BOOKING_OWNER)"
          - "booking.status == RESERVED, i.e. not yet dropped off (else ERR_CANCEL_NOT_ALLOWED)"
        side_effects:
          - "Cascade: every Bag of this booking status -> VOIDED"
          - "Reserved capacity for [check_in_date, check_out_date) is released on the location (capacity_conservation invariant restored)"
      - from: STORED
        to: OVERDUE
        trigger: "system (automatic during POST /_clock/set_current_utc when current date > check_out_date and status == STORED)"
        actor: system
        preconditions: []
        side_effects: []
      - from: STORED
        to: COMPLETED
        trigger: "POST /bookings/{id}/pickup"
        actor: Host
        preconditions:
          - "Acting host owns the booking's location (else ERR_NOT_LOCATION_HOST)"
          - "If presented_seals supplied, every presented seal_code matches the stored value (else ERR_SEAL_TAMPERED)"
        side_effects:
          - "Each Bag: status SEALED -> RETRIEVED"
          - "overage_days, late_fee_cents, final_total_cents computed via booking_final_settlement"
          - "booking.pickup_at = current logical clock"
          - "Cascade hop 1: create Payout(status=PENDING) via payout_provisional"
          - "Cascade hop 2: host.pending_payout_cents += payout.net_cents; host.lifetime_earnings_cents += payout.net_cents"
      - from: OVERDUE
        to: COMPLETED
        trigger: "POST /bookings/{id}/pickup"
        actor: Host
        preconditions:
          - "Acting host owns the booking's location (else ERR_NOT_LOCATION_HOST)"
          - "If presented_seals supplied, every presented seal_code matches the stored value (else ERR_SEAL_TAMPERED)"
        side_effects:
          - "Each Bag: status SEALED -> RETRIEVED"
          - "overage_days > 0, late_fee_cents, final_total_cents computed via booking_final_settlement"
          - "booking.pickup_at = current logical clock"
          - "Cascade hop 1: create Payout(status=PENDING) via payout_provisional"
          - "Cascade hop 2: host.pending_payout_cents += payout.net_cents; host.lifetime_earnings_cents += payout.net_cents"

  - entity: Bag
    initial_state: AWAITING_DROP
    terminal_states: [RETRIEVED, VOIDED]
    transitions:
      - from: AWAITING_DROP
        to: SEALED
        trigger: "POST /bookings/{id}/dropoff (per bag)"
        actor: Host
        preconditions: []
        side_effects: ["seal_code and drop_photo_url set from the matching seals[] entry"]
      - from: SEALED
        to: RETRIEVED
        trigger: "POST /bookings/{id}/pickup (per bag)"
        actor: Host
        preconditions: []
        side_effects: []
      - from: AWAITING_DROP
        to: VOIDED
        trigger: "POST /bookings/{id}/cancel (cascade)"
        actor: Traveler
        preconditions: []
        side_effects: []

  - entity: Extension
    initial_state: REQUESTED
    terminal_states: [CONFIRMED, REJECTED]
    transitions:
      - from: REQUESTED
        to: CONFIRMED
        trigger: "POST /extensions/{id}/decide {decision: CONFIRM}"
        actor: Host | PlatformAdmin
        preconditions:
          - "Acting host owns the booking's location (else ERR_NOT_LOCATION_HOST)"
          - "booking.status == STORED (else ERR_INVALID_STATE) — cross-entity Extension->Booking"
          - "Location daily_bag_capacity holds for [previous_check_out_date, new_check_out_date) with this booking's bags (else ERR_CAPACITY_EXCEEDED)"
        side_effects:
          - "booking.check_out_date = new_check_out_date"
          - "booking.billable_days and booking.estimated_total_cents recomputed to include added_days"
          - "extension.added_cost_cents recorded; location capacity reserved for the added interval"
      - from: REQUESTED
        to: REJECTED
        trigger: "POST /extensions/{id}/decide {decision: REJECT}"
        actor: Host | PlatformAdmin
        preconditions:
          - "Acting host owns the booking's location (else ERR_NOT_LOCATION_HOST)"
        side_effects:
          - "No change to booking; check_out_date unchanged"

  - entity: Claim
    initial_state: OPEN
    terminal_states: [APPROVED, REJECTED]
    transitions:
      - from: OPEN
        to: UNDER_REVIEW
        trigger: "POST /claims/{id}/review"
        actor: Host | PlatformAdmin
        preconditions: []
        side_effects: []
      - from: UNDER_REVIEW
        to: NEEDS_INFO
        trigger: "POST /claims/{id}/request-info"
        actor: Host | PlatformAdmin
        preconditions: []
        side_effects: []
      - from: NEEDS_INFO
        to: UNDER_REVIEW
        trigger: "POST /claims/{id}/resubmit"
        actor: Traveler
        preconditions:
          - "Acting traveler owns the claim's booking (else ERR_NOT_BOOKING_OWNER)"
        side_effects: []
        note: "Revision loop — a claim may cycle UNDER_REVIEW -> NEEDS_INFO -> UNDER_REVIEW any number of times"
      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /claims/{id}/decide {decision: APPROVE, approved_amount_cents}"
        actor: PlatformAdmin
        preconditions:
          - "approved_amount_cents <= min(plan.per_bag_coverage_cents, bag.declared_value_cents, claimed_amount_cents) (else ERR_COVERAGE_CAP_EXCEEDED)"
        side_effects:
          - "claim.approved_amount_cents set"
          - "Cascade hop 1: linked Payout (payout.booking_id == claim.booking_id): claim_deduction_cents += approved_amount_cents; net_cents recomputed"
          - "Cascade hop 2: host.pending_payout_cents -= approved_amount_cents; if host.pending_payout_cents < 0 then Host ACTIVE -> SUSPENDED (system)"
          - "Cascade hop 3: on host suspension, every OPEN Location of that host -> SUSPENDED (system)"
      - from: UNDER_REVIEW
        to: REJECTED
        trigger: "POST /claims/{id}/decide {decision: REJECT}"
        actor: PlatformAdmin
        preconditions: []
        side_effects: ["No payout adjustment"]

  - entity: Payout
    initial_state: PENDING
    terminal_states: [REVERSED]
    transitions:
      - from: PENDING
        to: RELEASED
        trigger: "POST /payouts/{id}/release"
        actor: PlatformAdmin
        preconditions:
          - "No Claim on payout.booking_id is in OPEN, UNDER_REVIEW, or NEEDS_INFO (else ERR_PAYOUT_HAS_OPEN_CLAIM) — cross-entity Payout->Claim"
          - "current date >= booking.pickup_at date + PAYOUT_HOLD_DAYS (PAYOUT_HOLD_DAYS = 2) (else ERR_PAYOUT_HELD)"
        side_effects:
          - "host.pending_payout_cents -= net_cents; host.payout_balance_cents += net_cents"
      - from: RELEASED
        to: REVERSED
        trigger: "POST /payouts/{id}/reverse"
        actor: PlatformAdmin
        preconditions: []
        side_effects:
          - "Compensation: host.payout_balance_cents -= net_cents (money_conservation restored, no drift)"

# -----------------------------------------------------------------------------
# 1.2.1 Concurrency Rules
# -----------------------------------------------------------------------------
concurrency_rules:
  - rule_id: booking-create-stale-location
    parent_entity: Location
    write_endpoint: "POST /bookings"
    occ_field: "expected_location_version"
    description: |
      Creating a Booking against a Location whose version has advanced since the
      client last observed it is rejected. A booking reserves day-capacity on the
      location, so any prior booking (or a status change) that legitimately
      consumed capacity bumps Location.version; the current writer's cached view
      of remaining capacity is therefore stale and the create is refused before
      capacity is evaluated.
    error_id: ERR_STALE_LOCATION_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: booking_estimate
    trigger: "POST /bookings (creation); recomputed on extension confirm"
    algorithm: tiered_pricing
    formula: |
      billable_days = max(1, days_between(check_in_date, check_out_date))
      bag_count      = number of bags
      oversize_count = count of bags with dimension_sum_cm >= OVERSIZE_THRESHOLD_CM
      base_cents      = location.per_bag_day_rate_cents * bag_count * billable_days
      oversize_cents  = location.oversize_surcharge_cents_per_day * oversize_count * billable_days
      insurance_cents = plan.premium_cents_per_bag_day * bag_count * billable_days   # 0 when tier == NONE
      estimated_total_cents = base_cents + oversize_cents + insurance_cents
    input_set: "All bags of the booking; days from requested check_in/check_out dates"
    constants:
      OVERSIZE_THRESHOLD_CM: 150
    precision: "integer cents; no rounding needed (all integer multiplications)"
    variants:
      - name: provisional_estimate
        when: "At booking creation and after extension confirm — forward-looking on requested dates and declared bag sizes"
        difference: "Uses requested check_out_date and declared bag sizes; ignores actual pickup date and any late fee"

  - name: booking_final_settlement
    trigger: "POST /bookings/{id}/pickup (STORED|OVERDUE -> COMPLETED)"
    algorithm: chronological
    formula: |
      billable_days = max(1, days_between(check_in_date, check_out_date))   # check_out already includes confirmed extensions
      overage_days  = max(0, days_between(check_out_date, pickup_date))      # 0 if picked up on/before check_out
      base_cents      = location.per_bag_day_rate_cents * bag_count * billable_days
      oversize_cents  = location.oversize_surcharge_cents_per_day * oversize_count * billable_days
      insurance_cents = plan.premium_cents_per_bag_day * bag_count * billable_days
      late_fee_cents  = overage_days * LATE_FEE_MULTIPLIER * location.per_bag_day_rate_cents * bag_count
      final_total_cents = base_cents + oversize_cents + insurance_cents + late_fee_cents
    input_set: "Bags as sealed at drop-off (oversize_count is the actual sealed classification); pickup date from logical clock"
    constants:
      LATE_FEE_MULTIPLIER: 2
    precision: "integer cents"
    variants:
      - name: final_settlement
        when: "At pickup — chronological on actual pickup date"
        difference: "Adds late_fee_cents for overage_days; diverges from provisional_estimate whenever pickup is late or the sealed oversize classification differs from the declared one"

  - name: payout_provisional
    trigger: "POST /bookings/{id}/pickup (Payout creation)"
    algorithm: aggregation
    formula: |
      gross_cents        = base_cents + oversize_cents + late_fee_cents        # host-eligible; insurance_cents excluded
      platform_fee_cents = round_half_up(gross_cents * host.platform_fee_bps / 10000)   # rounded PER BOOKING, before summing into host balance
      claim_deduction_cents = 0
      net_cents          = gross_cents - platform_fee_cents - claim_deduction_cents
    input_set: "Single booking's final settlement components"
    constants: {}
    precision: "round_half_up to whole cents on platform_fee_cents; host.pending_payout_cents is the SUM of already-rounded per-booking net_cents (round-per-booking-then-sum, never sum-then-round)"
    variants:
      - name: provisional_net
        when: "At payout creation, before any claim is approved"
        difference: "claim_deduction_cents == 0; net_cents == gross - platform_fee"
      - name: final_net
        when: "After one or more claims on the booking are APPROVED"
        difference: "claim_deduction_cents == sum(approved_amount_cents); net_cents drops by that sum — same gross, different net"

  - name: claim_award
    trigger: "POST /claims/{id}/decide {decision: APPROVE}"
    algorithm: threshold
    formula: |
      cap = min(plan.per_bag_coverage_cents, bag.declared_value_cents, claimed_amount_cents)
      # Admin-supplied approved_amount_cents must satisfy 0 < approved_amount_cents <= cap
      approved_amount_cents = approved_amount_cents (validated <= cap)
    input_set: "The claim, its bag, and the booking's insurance plan"
    constants: {}
    precision: "integer cents"

  - name: host_avg_rating
    trigger: "POST /bookings/{id}/rating"
    algorithm: aggregation
    formula: |
      rating_sum   += score
      rating_count += 1
      avg_rating    = round_half_up(rating_sum / rating_count, 2)   # 0.00 when rating_count == 0
    input_set: "All ratings on this host's bookings"
    constants: {}
    precision: "2 decimals, round_half_up"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and well-formed (except Anonymous registration endpoints)"
    error_id: ERR_MISSING_AUTH_HEADER
    http_status: 401
    applies_to: "all endpoints except POST /travelers"

  - priority: 2
    category: auth
    check: "Role is permitted for this endpoint per §1.7"
    error_id: ERR_INVALID_ROLE
    http_status: 403
    applies_to: all endpoints

  - priority: 3
    category: existence
    check: "All path and FK-referenced resources exist, validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all endpoints referencing resources

  - priority: 4
    category: auth
    check: "Ownership — Host acts only on its own location/booking; Traveler acts only on its own booking/claim"
    error_id: "ERR_NOT_LOCATION_HOST | ERR_NOT_BOOKING_OWNER"
    http_status: 403
    applies_to: "dropoff, pickup, cancel, extension decide, claim resubmit, location status"

  - priority: 5
    category: state
    check: "OCC — expected_location_version must equal the current Location.version"
    error_id: ERR_STALE_LOCATION_VERSION
    http_status: 412
    applies_to: "POST /bookings"

  - priority: 6
    category: state
    check: "Resource (and referenced Location) is in a valid state for the operation. Booking creation and drop-off both require location.status == OPEN (ERR_LOCATION_NOT_OPEN)."
    error_id: "ERR_INVALID_STATE | ERR_LOCATION_NOT_OPEN | ERR_CANCEL_NOT_ALLOWED | ERR_HOST_SUSPENDED | ERR_LOCATION_HAS_ACTIVE_BOOKINGS"
    http_status: 409
    applies_to: "all state-transition endpoints AND POST /bookings (referenced location must be OPEN)"

  - priority: 7
    category: business_temporal
    check: "Date-range validity: check_out_date > check_in_date; extension new_check_out_date > current check_out_date; claim filed within CLAIM_WINDOW_DAYS (CLAIM_WINDOW_DAYS = 3) of pickup_at"
    error_id: "ERR_INVALID_DATE_RANGE | ERR_EXTENSION_INVALID_DATE | ERR_CLAIM_WINDOW_CLOSED"
    http_status: 422
    applies_to: "POST /bookings, POST /bookings/{id}/extensions, POST /bookings/{id}/claims"

  - priority: 8
    category: business_safety
    check: "Chain-of-custody: drop-off must seal every bag with a unique seal; pickup rejects tampered seals"
    error_id: "ERR_BAG_NOT_SEALED | ERR_DUPLICATE_SEAL | ERR_SEAL_TAMPERED"
    http_status: 409
    applies_to: "POST /bookings/{id}/dropoff, POST /bookings/{id}/pickup"

  - priority: 9
    category: business_constraint
    check: "Capacity: daily_bag_capacity (and oversize_capacity sub-limit) must hold for every day in the interval; host max_concurrent_bookings must hold"
    error_id: "ERR_CAPACITY_EXCEEDED | ERR_OVERSIZE_CAPACITY_EXCEEDED | ERR_HOST_CONCURRENCY_EXCEEDED"
    http_status: 409
    applies_to: "POST /bookings, POST /extensions/{id}/decide (CONFIRM)"

  - priority: 10
    category: business_constraint
    check: "Insurance/rating preconditions: claim requires plan.tier != NONE; one rating per COMPLETED booking"
    error_id: "ERR_NO_INSURANCE_COVERAGE | ERR_BOOKING_NOT_COMPLETED | ERR_RATING_ALREADY_EXISTS"
    http_status: 409
    applies_to: "POST /bookings/{id}/claims, POST /bookings/{id}/rating"

  - priority: 11
    category: business_fiscal
    check: "Monetary bounds: claimed_amount_cents in (0, bag.declared_value_cents]; approved_amount_cents <= coverage cap"
    error_id: "ERR_CLAIM_AMOUNT_INVALID | ERR_COVERAGE_CAP_EXCEEDED"
    http_status: 422
    applies_to: "POST /bookings/{id}/claims, POST /claims/{id}/decide"

  - priority: 12
    category: business_constraint
    check: "Pagination params: limit in [1,100], offset >= 0"
    error_id: ERR_INVALID_PAGINATION
    http_status: 400
    applies_to: "all list endpoints"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Logical clock (test-driving) ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server logical clock. Server startup default is 2026-05-01T00:00:00Z; the clock never falls back to wall-clock time. Setting the clock sweeps STORED bookings past their check_out_date to OVERDUE."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string, overdue_swept_count: integer }"
    side_effects:
      - "logical clock = to_iso8601"
      - "Every STORED booking whose check_out_date < current date transitions to OVERDUE"

  # --- Host ---
  - method: POST
    path: "/hosts"
    description: "Onboard a Host"
    roles: [PlatformAdmin]
    code: 201
    input: [display_name, email, "platform_fee_bps?", "max_concurrent_bookings?"]
    output: Host
    side_effects: ["status=ACTIVE; balances and rating counters zeroed"]

  - method: GET
    path: "/hosts/{id}"
    description: "Get a Host"
    roles: [Traveler, Host, PlatformAdmin]
    code: 200
    input: []
    output: Host
    side_effects: []

  - method: POST
    path: "/hosts/{id}/status"
    description: "Suspend or reactivate a Host"
    roles: [PlatformAdmin]
    code: 200
    input: [to_status]
    output: Host
    side_effects: ["SUSPENDED cascades this host's OPEN locations to SUSPENDED; ACTIVE does not auto-reopen them"]

  # --- Traveler ---
  - method: POST
    path: "/travelers"
    description: "Self-register a Traveler (no auth headers required)"
    roles: [Anonymous]
    code: 201
    input: [email, full_name]
    output: Traveler
    side_effects: ["status=ACTIVE"]

  - method: GET
    path: "/travelers/{id}"
    description: "Get a Traveler"
    roles: [Traveler, PlatformAdmin]
    code: 200
    input: []
    output: Traveler
    side_effects: []

  # --- InsurancePlan ---
  - method: POST
    path: "/insurance-plans"
    description: "Create an InsurancePlan tier"
    roles: [PlatformAdmin]
    code: 201
    input: [tier, per_bag_coverage_cents, premium_cents_per_bag_day]
    output: InsurancePlan
    side_effects: []

  - method: GET
    path: "/insurance-plans/{id}"
    description: "Get an InsurancePlan"
    roles: [Traveler, Host, PlatformAdmin]
    code: 200
    input: []
    output: InsurancePlan
    side_effects: []

  # --- Location ---
  - method: POST
    path: "/hosts/{id}/locations"
    description: "Create a Location under a Host"
    roles: [Host, PlatformAdmin]
    code: 201
    input: [name, address, daily_bag_capacity, oversize_capacity, per_bag_day_rate_cents, oversize_surcharge_cents_per_day]
    output: Location
    side_effects: ["status=DRAFT; host_id from path"]

  - method: GET
    path: "/locations/{id}"
    description: "Get a Location (version used for booking OCC)"
    roles: [Traveler, Host, PlatformAdmin]
    code: 200
    input: []
    output: Location
    side_effects: []

  - method: GET
    path: "/hosts/{id}/locations"
    description: "List Locations of a Host (FK reverse for Location.host_id)"
    roles: [Traveler, Host, PlatformAdmin]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Location[]
    side_effects: []

  - method: POST
    path: "/locations/{id}/status"
    description: "Transition Location status (OPEN | SUSPENDED | CLOSED)"
    roles: [Host, PlatformAdmin]
    code: 200
    input: [to_status]
    output: Location
    side_effects: ["Per Location state machine"]

  # --- Booking ---
  - method: POST
    path: "/bookings"
    description: "Create a Booking (referenced location must be OPEN; reserves location day-capacity; OCC on Location.version). Bags are minted from the bags[] array."
    roles: [Traveler]
    code: 201
    input: [location_id, traveler_id, insurance_plan_id, check_in_date, check_out_date, bags, expected_location_version]
    output: Booking
    side_effects:
      - "One Bag row per bags[] entry (status=AWAITING_DROP, is_oversize derived)"
      - "estimated_total_cents computed via booking_estimate"
      - "Reserves day-capacity for [check_in_date, check_out_date)"
      - "increments Location.version by 1"

  - method: GET
    path: "/bookings/{id}"
    description: "Get a Booking"
    roles: [Traveler, Host, PlatformAdmin]
    code: 200
    input: []
    output: Booking
    side_effects: []

  - method: GET
    path: "/bookings"
    description: "List/filter Bookings (FK reverse for Booking.location_id, traveler_id, insurance_plan_id)"
    roles: [Traveler, Host, PlatformAdmin]
    code: 200
    input: ["traveler_id?", "location_id?", "host_id?", "insurance_plan_id?", "status?", "limit?", "offset?"]
    output: Booking[]
    side_effects: []

  - method: POST
    path: "/bookings/{id}/cancel"
    description: "Cancel a RESERVED Booking"
    roles: [Traveler]
    code: 200
    input: []
    output: Booking
    side_effects: ["Bags -> VOIDED; reserved capacity released"]

  - method: POST
    path: "/bookings/{id}/dropoff"
    description: "Host drops off & seals bags (RESERVED -> STORED)"
    roles: [Host]
    code: 200
    input: [seals]
    output: Booking
    side_effects: ["Each bag SEALED with seal_code + drop_photo_url; dropoff_at set"]

  - method: POST
    path: "/bookings/{id}/pickup"
    description: "Host returns bags (STORED|OVERDUE -> COMPLETED); final settlement + payout"
    roles: [Host]
    code: 200
    input: ["presented_seals?"]
    output: Booking
    side_effects:
      - "Bags -> RETRIEVED; final_total_cents / overage_days / late_fee_cents computed"
      - "Payout(PENDING) created; host pending_payout & lifetime_earnings updated"

  # --- Bag ---
  - method: GET
    path: "/bags/{id}"
    description: "Get a Bag"
    roles: [Traveler, Host, PlatformAdmin]
    code: 200
    input: []
    output: Bag
    side_effects: []

  - method: GET
    path: "/bookings/{id}/bags"
    description: "List a Booking's Bags (FK reverse for Bag.booking_id)"
    roles: [Traveler, Host, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: Bag[]
    side_effects: []

  # --- Extension ---
  - method: POST
    path: "/bookings/{id}/extensions"
    description: "Traveler requests an extension of check_out_date"
    roles: [Traveler]
    code: 201
    input: [new_check_out_date]
    output: Extension
    side_effects: ["status=REQUESTED; previous_check_out_date & added_days recorded"]

  - method: POST
    path: "/extensions/{id}/decide"
    description: "Host confirms or rejects an extension"
    roles: [Host, PlatformAdmin]
    code: 200
    input: [decision]
    output: Extension
    side_effects: ["CONFIRM extends booking check_out_date + reserves added-interval capacity; REJECT leaves booking unchanged"]

  - method: GET
    path: "/bookings/{id}/extensions"
    description: "List a Booking's Extensions (FK reverse for Extension.booking_id)"
    roles: [Traveler, Host, PlatformAdmin]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Extension[]
    side_effects: []

  # --- Claim ---
  - method: POST
    path: "/bookings/{id}/claims"
    description: "Traveler files a claim on a bag of a COMPLETED booking"
    roles: [Traveler]
    code: 201
    input: [bag_id, reason, description, claimed_amount_cents]
    output: Claim
    side_effects: ["status=OPEN"]

  - method: GET
    path: "/claims/{id}"
    description: "Get a Claim"
    roles: [Traveler, Host, PlatformAdmin]
    code: 200
    input: []
    output: Claim
    side_effects: []

  - method: GET
    path: "/claims"
    description: "List/filter Claims (FK reverse for Claim.booking_id and Claim.bag_id)"
    roles: [Traveler, Host, PlatformAdmin]
    code: 200
    input: ["booking_id?", "bag_id?", "status?", "limit?", "offset?"]
    output: Claim[]
    side_effects: []

  - method: POST
    path: "/claims/{id}/review"
    description: "Open review (OPEN -> UNDER_REVIEW)"
    roles: [Host, PlatformAdmin]
    code: 200
    input: []
    output: Claim
    side_effects: []

  - method: POST
    path: "/claims/{id}/request-info"
    description: "Request more info (UNDER_REVIEW -> NEEDS_INFO)"
    roles: [Host, PlatformAdmin]
    code: 200
    input: []
    output: Claim
    side_effects: []

  - method: POST
    path: "/claims/{id}/resubmit"
    description: "Traveler resubmits info (NEEDS_INFO -> UNDER_REVIEW)"
    roles: [Traveler]
    code: 200
    input: []
    output: Claim
    side_effects: []

  - method: POST
    path: "/claims/{id}/decide"
    description: "Adjudicate (UNDER_REVIEW -> APPROVED | REJECTED)"
    roles: [PlatformAdmin]
    code: 200
    input: [decision, "approved_amount_cents?"]
    output: Claim
    side_effects: ["APPROVE sets approved_amount and cascades a deduction to the booking's Payout, host balance, and possibly host/location suspension"]

  # --- Payout ---
  - method: GET
    path: "/payouts/{id}"
    description: "Get a Payout"
    roles: [Host, PlatformAdmin]
    code: 200
    input: []
    output: Payout
    side_effects: []

  - method: GET
    path: "/payouts"
    description: "List/filter Payouts (FK reverse for Payout.host_id and Payout.booking_id)"
    roles: [Host, PlatformAdmin]
    code: 200
    input: ["host_id?", "booking_id?", "status?", "limit?", "offset?"]
    output: Payout[]
    side_effects: []

  - method: POST
    path: "/payouts/{id}/release"
    description: "Release a payout (PENDING -> RELEASED)"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Payout
    side_effects: ["Moves net_cents from host.pending_payout_cents to host.payout_balance_cents"]

  - method: POST
    path: "/payouts/{id}/reverse"
    description: "Reverse a released payout (RELEASED -> REVERSED)"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Payout
    side_effects: ["Compensation: host.payout_balance_cents -= net_cents"]

  # --- Rating ---
  - method: POST
    path: "/bookings/{id}/rating"
    description: "Traveler rates a COMPLETED booking (one per booking)"
    roles: [Traveler]
    code: 201
    input: [score, "comment?"]
    output: Rating
    side_effects: ["Host rating_sum/rating_count/avg_rating updated"]

  - method: GET
    path: "/bookings/{id}/rating"
    description: "Get a Booking's Rating (FK reverse for Rating.booking_id; array of 0..1)"
    roles: [Traveler, Host, PlatformAdmin]
    code: 200
    input: []
    output: Rating[]
    side_effects: []

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_AUTH_HEADER, http: 401, condition: "X-User-ID/X-User-Role missing or malformed on a protected endpoint" }
  - { id: ERR_INVALID_ROLE, http: 403, condition: "Role not permitted for this endpoint" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path or FK-referenced resource does not exist" }
  - { id: ERR_VALIDATION, http: 400, condition: "Malformed body or missing required field" }
  - { id: ERR_INVALID_PAGINATION, http: 400, condition: "limit outside [1,100] or offset < 0" }
  - { id: ERR_NOT_LOCATION_HOST, http: 403, condition: "Acting host does not own the target location/booking" }
  - { id: ERR_NOT_BOOKING_OWNER, http: 403, condition: "Acting traveler does not own the target booking/claim" }
  - { id: ERR_STALE_LOCATION_VERSION, http: 412, condition: "expected_location_version != current Location.version on booking create" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Resource not in a valid state for the requested transition" }
  - { id: ERR_LOCATION_NOT_OPEN, http: 409, condition: "Booking creation or drop-off attempted while referenced location is not OPEN" }
  - { id: ERR_HOST_SUSPENDED, http: 409, condition: "Location open/reopen attempted while owning host is SUSPENDED" }
  - { id: ERR_LOCATION_HAS_ACTIVE_BOOKINGS, http: 409, condition: "Location close attempted with RESERVED/STORED/OVERDUE bookings" }
  - { id: ERR_CANCEL_NOT_ALLOWED, http: 409, condition: "Cancel attempted on a booking already dropped off or terminal" }
  - { id: ERR_INVALID_DATE_RANGE, http: 422, condition: "check_out_date <= check_in_date (or check_in in the past)" }
  - { id: ERR_EXTENSION_INVALID_DATE, http: 422, condition: "Extension new_check_out_date <= current check_out_date" }
  - { id: ERR_CLAIM_WINDOW_CLOSED, http: 422, condition: "Claim filed more than CLAIM_WINDOW_DAYS after pickup_at" }
  - { id: ERR_BAG_NOT_SEALED, http: 409, condition: "Drop-off seals[] does not cover every bag with a seal_code + photo_url" }
  - { id: ERR_DUPLICATE_SEAL, http: 409, condition: "seal_code collides with another SEALED bag at the same location" }
  - { id: ERR_SEAL_TAMPERED, http: 409, condition: "Presented seal_code at pickup does not match the recorded value" }
  - { id: ERR_CAPACITY_EXCEEDED, http: 409, condition: "daily_bag_capacity would be exceeded on some day in the interval" }
  - { id: ERR_OVERSIZE_CAPACITY_EXCEEDED, http: 409, condition: "oversize_capacity sub-limit would be exceeded on some day" }
  - { id: ERR_HOST_CONCURRENCY_EXCEEDED, http: 409, condition: "host max_concurrent_bookings would be exceeded by overlapping active bookings" }
  - { id: ERR_NO_INSURANCE_COVERAGE, http: 409, condition: "Claim filed on a booking whose plan tier is NONE" }
  - { id: ERR_CLAIM_AMOUNT_INVALID, http: 422, condition: "claimed_amount_cents <= 0 or > bag.declared_value_cents" }
  - { id: ERR_COVERAGE_CAP_EXCEEDED, http: 422, condition: "approved_amount_cents exceeds min(plan cap, declared value, claimed)" }
  - { id: ERR_PAYOUT_HAS_OPEN_CLAIM, http: 409, condition: "Payout release blocked by a non-terminal claim on the booking" }
  - { id: ERR_PAYOUT_HELD, http: 409, condition: "Payout release attempted before pickup_at + PAYOUT_HOLD_DAYS" }
  - { id: ERR_BOOKING_NOT_COMPLETED, http: 409, condition: "Rating attempted on a booking that is not COMPLETED" }
  - { id: ERR_RATING_ALREADY_EXISTS, http: 409, condition: "A rating already exists for this booking" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Anonymous
    description: "Unauthenticated caller; may only self-register a Traveler"
    identity: opaque
    exclusive_operations:
      - "POST /travelers — Self-register"
    shared_operations: []

  - name: Traveler
    description: "Books storage, drops/picks nothing directly, requests extensions, files/resubmits claims, rates bookings"
    identity: "entity_backed:Traveler"
    exclusive_operations:
      - "POST /bookings — Create booking"
      - "POST /bookings/{id}/cancel — Cancel own RESERVED booking"
      - "POST /bookings/{id}/extensions — Request extension"
      - "POST /bookings/{id}/claims — File claim"
      - "POST /claims/{id}/resubmit — Resubmit claim info"
      - "POST /bookings/{id}/rating — Rate booking"
    shared_operations:
      - "GET reads on own bookings/bags/claims/extensions/ratings, hosts, locations, insurance-plans"

  - name: Host
    description: "Owns locations; performs drop-off sealing and pickup; decides extensions; may open review on claims"
    identity: "entity_backed:Host"
    exclusive_operations:
      - "POST /hosts/{id}/locations — Create location"
      - "POST /bookings/{id}/dropoff — Drop-off & seal"
      - "POST /bookings/{id}/pickup — Pickup & settle"
    shared_operations:
      - "POST /locations/{id}/status — Open/suspend/close (shared with PlatformAdmin)"
      - "POST /extensions/{id}/decide — Confirm/reject (shared with PlatformAdmin)"
      - "POST /claims/{id}/review, POST /claims/{id}/request-info (shared with PlatformAdmin)"
      - "GET reads on own locations, bookings, payouts, claims"

  - name: PlatformAdmin
    description: "Marketplace operator: onboards hosts, defines insurance plans, adjudicates claims, settles/reverses payouts, suspends hosts, drives the logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /hosts — Onboard host"
      - "POST /hosts/{id}/status — Suspend/reactivate host"
      - "POST /insurance-plans — Create plan"
      - "POST /claims/{id}/decide — Adjudicate claim"
      - "POST /payouts/{id}/release — Release payout"
      - "POST /payouts/{id}/reverse — Reverse payout"
      - "POST /_clock/set_current_utc — Set logical clock"
    shared_operations:
      - "POST /locations/{id}/status, POST /extensions/{id}/decide, POST /claims/{id}/review, POST /claims/{id}/request-info"
      - "All GET reads"
