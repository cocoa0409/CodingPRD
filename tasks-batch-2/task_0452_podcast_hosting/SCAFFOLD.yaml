# =============================================================================
# Podcast Hosting & Monetization — Scaffold (§1.0–§1.7)
# Difficulty: Expert (§0.4)
# =============================================================================

scenario: |
  Podcast Hosting & Monetization: show/episode & RSS feed, media upload & transcoding,
  dynamic ad insertion (DAI) & campaign, download/IAB analytics, subscription/paywall &
  private feed, sponsorship/CPM & fill rate, distribution (Apple/Spotify), payout &
  revenue share

domain_name: podcast-hosting

# Flat topology: all resources are peer collections referenced by foreign keys.
# api_prefix is empty so every collection (e.g. /shows, /ad-campaigns) is a
# top-level path.
api_prefix: ""

complexity_profile:
  primary_archetype: quota_allocation        # finite ad inventory + finite campaign budget reserved/committed/released
  secondary_archetype: ledger_reconciliation # provisional vs final revenue; payout accrual vs settled
  complexity_layers:
    - optimistic_concurrency        # OCC on AdCampaign.version for budget-reserving placement creation
    - cascading_side_effects        # show suspend → episodes → placements → campaign budget release
    - dual_variant_calculation      # estimated vs delivered spend; accrued vs settled payout
    - derived_field_reconciliation  # fill_rate, available/reserved/spent budget, filled/available slots
    - rate_threshold_triggers       # budget exhaustion, fill-rate CPM tiers

  entity_topology: flat
  state_machine_shape: parallel     # Episode carries independent media_status × publish_status axes; MediaAsset is cyclic
  relationship_patterns:
    - one_to_many                   # Show→Episode, Advertiser→AdCampaign, etc.
    - cross_aggregate               # AdPlacement bridges AdCampaign and Episode aggregates
  role_model: peer_roles            # Publisher / Advertiser / Listener own disjoint resource types; PlatformAdmin operates
  consistency_model: immediate      # all derived fields reconciled synchronously within the mutating request

# =============================================================================
# §1.0 Response Envelope (FIXED — EMIT VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Domain constants (global, fixed) — referenced across §1.2/§1.3/§1.4
# =============================================================================
domain_constants:
  CLOCK_DEFAULT_UTC: "2026-01-01T00:00:00Z"   # logical clock startup default (§1.5 /_clock)
  IAB_MIN_BYTES: 1048576                       # 1 MiB IAB counted-download threshold (>=)
  MAX_TRANSCODE_ATTEMPTS: 3                    # FAILED becomes terminal media_status only at attempt 3
  MID_ROLL_BUFFER_MS: 1000                     # required silent gap on each side of a MID_ROLL interval
  GRACE_MS: 604800000                          # 7 days; PAST_DUE → CANCELLED window after period_end
  PREMIUM_MULTIPLIER: 1.25
  HIGH_FILL_MULT: 1.20
  MID_FILL_MULT: 1.10
  LOW_FILL_MULT: 1.00
  MIN_PLACEMENT_CENTS: 100

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  # ---- Actors -------------------------------------------------------------
  - name: Publisher
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Publisher / network display name" }
      - { name: payout_email, type: string, source: input, description: "Email used on payout statements" }
      - { name: revenue_share_pct, type: number, source: input, description: "Publisher share of net ad revenue, 0.0–1.0 (platform keeps the remainder)", default: 0.70, constraints: "0.0 <= revenue_share_pct <= 1.0" }

  - name: Advertiser
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Advertiser / brand display name" }
      - { name: billing_email, type: string, source: input, description: "Advertiser billing contact email" }

  - name: Listener
    parent: null
    common_fields: true
    fields:
      - { name: email, type: string, source: input, description: "Listener login email (unique)" }
      - { name: display_name, type: string, source: input, description: "Listener display name" }

  # ---- Show / Episode / Media --------------------------------------------
  - name: Show
    parent: null
    common_fields: true
    fields:
      - { name: publisher_id, type: string, source: input, description: "FK -> Publisher.id; owning publisher" }
      - { name: title, type: string, source: input, description: "Show title" }
      - { name: category, type: enum, source: input, description: "IAB content category", constraints: "one of TECH, NEWS, COMEDY, BUSINESS, EDUCATION, TRUE_CRIME" }
      - { name: status, type: enum, source: system, description: "Lifecycle posture gating child operations", constraints: "one of DRAFT, ACTIVE, SUSPENDED, ARCHIVED" }
      - { name: monetization_enabled, type: boolean, source: input, description: "Whether ad placements may be inserted on this show's episodes", default: false }
      - { name: episode_count, type: integer, source: computed, description: "Count of Episodes whose publish_status != DELETED for this show" }

  - name: Episode
    parent: null
    common_fields: true
    fields:
      - { name: show_id, type: string, source: input, description: "FK -> Show.id; owning show" }
      - { name: title, type: string, source: input, description: "Episode title" }
      - { name: duration_ms, type: integer, source: computed, description: "Total audio duration in ms, copied from the READY MediaAsset", default: 0 }
      - { name: total_ad_slots, type: integer, source: input, description: "Fixed number of ad slots offered on this episode (sum across positions)", constraints: ">= 0" }
      - { name: offered_positions, type: array, source: input, description: "Subset of {PRE_ROLL, MID_ROLL, POST_ROLL} this episode offers" }
      - { name: media_status, type: enum, source: computed, description: "Transcode axis, mirrors the active MediaAsset", constraints: "one of NONE, PENDING, PROCESSING, READY, FAILED" }
      - { name: publish_status, type: enum, source: system, description: "Distribution axis, independent of media_status", constraints: "one of DRAFT, SCHEDULED, PUBLISHED, UNPUBLISHED, DELETED" }
      - { name: scheduled_publish_at, type: datetime, source: input, description: "When a SCHEDULED episode auto-publishes (logical clock)", default: null }
      - { name: filled_slots, type: integer, source: computed, description: "Count of AdPlacements on this episode in {INSERTED, DELIVERED}" }
      - { name: available_slots, type: integer, source: computed, description: "total_ad_slots - filled_slots" }
      - { name: fill_rate, type: number, source: computed, description: "filled_slots / total_ad_slots, or 0.0 when total_ad_slots == 0; 4 decimals", default: 0.0 }

  - name: MediaAsset
    parent: null
    common_fields: true
    fields:
      - { name: episode_id, type: string, source: input, description: "FK -> Episode.id; episode this audio belongs to" }
      - { name: source_filename, type: string, source: input, description: "Original uploaded filename" }
      - { name: source_duration_ms, type: integer, source: input, description: "Declared raw duration in ms of the uploaded file", constraints: "> 0" }
      - { name: status, type: enum, source: system, description: "Transcode lifecycle (cyclic on retry)", constraints: "one of UPLOADED, TRANSCODING, READY, FAILED" }
      - { name: transcode_attempts, type: integer, source: system, description: "Number of transcode attempts so far", default: 0 }
      - { name: output_duration_ms, type: integer, source: system, description: "Transcoded duration in ms, set on READY", default: 0 }

  # ---- Distribution / Feeds / Subscriptions ------------------------------
  - name: Feed
    parent: null
    common_fields: true
    fields:
      - { name: show_id, type: string, source: input, description: "FK -> Show.id; show this feed renders" }
      - { name: visibility, type: enum, source: input, description: "Feed access mode", constraints: "one of PUBLIC, PRIVATE" }
      - { name: status, type: enum, source: system, description: "Feed lifecycle", constraints: "one of ENABLED, DISABLED" }
      - { name: token_required, type: boolean, source: computed, description: "True iff visibility == PRIVATE" }

  - name: Subscription
    parent: null
    common_fields: true
    fields:
      - { name: listener_id, type: string, source: input, description: "FK -> Listener.id; subscribing listener" }
      - { name: show_id, type: string, source: input, description: "FK -> Show.id; subscribed show (must have a PRIVATE feed)" }
      - { name: price_cents, type: integer, source: input, description: "Monthly paywall price in cents", constraints: ">= 0" }
      - { name: status, type: enum, source: system, description: "Subscription lifecycle", constraints: "one of PENDING, ACTIVE, PAST_DUE, CANCELLED" }
      - { name: period_start, type: datetime, source: input, description: "Inclusive start of the current billing period (closed interval)" }
      - { name: period_end, type: datetime, source: input, description: "Inclusive end of the current billing period (closed interval)" }
      - { name: access_token, type: string, source: system, description: "Private-feed access token issued on activation", default: null }

  - name: Distribution
    parent: null
    common_fields: true
    fields:
      - { name: show_id, type: string, source: input, description: "FK -> Show.id; show being distributed" }
      - { name: channel, type: enum, source: input, description: "Destination directory", constraints: "one of APPLE, SPOTIFY" }
      - { name: status, type: enum, source: system, description: "Distribution lifecycle", constraints: "one of PENDING, LIVE, REJECTED, REMOVED" }
      - { name: external_ref, type: string, source: system, description: "Directory-assigned reference, set on LIVE", default: null }

  # ---- Monetization: campaigns, placements, downloads, payouts -----------
  - name: AdCampaign
    parent: null
    common_fields: true
    fields:
      - { name: advertiser_id, type: string, source: input, description: "FK -> Advertiser.id; owning advertiser" }
      - { name: name, type: string, source: input, description: "Campaign name" }
      - { name: budget_cents, type: integer, source: input, description: "Total campaign budget in cents (immutable after create)", constraints: "> 0" }
      - { name: bid_cpm_cents, type: integer, source: input, description: "Advertiser bid CPM (cost per 1000 impressions) in cents", constraints: "> 0" }
      - { name: targeting_category, type: enum, source: input, description: "Show category this campaign targets", constraints: "one of TECH, NEWS, COMEDY, BUSINESS, EDUCATION, TRUE_CRIME" }
      - { name: premium_targeting, type: boolean, source: input, description: "Whether the campaign pays the targeting premium multiplier", default: false }
      - { name: flight_start, type: datetime, source: input, description: "Campaign flight window start (inclusive)" }
      - { name: flight_end, type: datetime, source: input, description: "Campaign flight window end (inclusive)" }
      - { name: status, type: enum, source: system, description: "Campaign lifecycle", constraints: "one of DRAFT, ACTIVE, PAUSED, EXHAUSTED, COMPLETED" }
      - { name: reserved_budget_cents, type: integer, source: computed, description: "Sum of estimated_cost_cents over AdPlacements in {PROPOSED, INSERTED}", default: 0 }
      - { name: spent_budget_cents, type: integer, source: computed, description: "Sum of final_cost_cents over AdPlacements in {DELIVERED}", default: 0 }
      - { name: available_budget_cents, type: integer, source: computed, description: "budget_cents - reserved_budget_cents - spent_budget_cents" }

  - name: AdPlacement
    parent: null
    common_fields: true
    fields:
      - { name: campaign_id, type: string, source: input, description: "FK -> AdCampaign.id; campaign funding this placement" }
      - { name: episode_id, type: string, source: input, description: "FK -> Episode.id; episode hosting this placement" }
      - { name: position, type: enum, source: input, description: "Ad insertion point", constraints: "one of PRE_ROLL, MID_ROLL, POST_ROLL" }
      - { name: offset_ms, type: integer, source: input, description: "For MID_ROLL: start offset in ms within the episode timeline; 0 for PRE_ROLL/POST_ROLL", default: 0, constraints: ">= 0" }
      - { name: ad_duration_ms, type: integer, source: input, description: "Length of the ad creative in ms", constraints: "> 0" }
      - { name: forecast_impressions, type: integer, source: input, description: "Estimated impressions used for provisional cost at booking", constraints: "> 0" }
      - { name: delivered_impressions, type: integer, source: computed, description: "Count of DownloadEvents attributed to this placement", default: 0 }
      - { name: estimated_cost_cents, type: integer, source: computed, description: "Provisional cost reserved against the campaign at insertion (see estimated_placement_cost)" }
      - { name: fill_tier_multiplier, type: number, source: computed, description: "Fill-band tier multiplier frozen at insertion (1.00 LOW / 1.10 MID / 1.20 HIGH); reused by final_placement_cost so delivery does not re-band", default: 1.00 }
      - { name: final_cost_cents, type: integer, source: computed, description: "Final billed cost on delivery reconciliation (see final_placement_cost)", default: 0 }
      - { name: status, type: enum, source: system, description: "Placement lifecycle", constraints: "one of PROPOSED, INSERTED, DELIVERED, CANCELLED, REJECTED" }

  - name: DownloadEvent
    parent: null
    common_fields: false   # append-only IAB analytics record: id + created_at only
    fields:
      - { name: episode_id, type: string, source: input, description: "FK -> Episode.id; downloaded episode" }
      - { name: placement_id, type: string, source: input, description: "FK -> AdPlacement.id; placement credited for this impression (optional)", default: null }
      - { name: client_ip_hash, type: string, source: input, description: "Hashed listener IP for IAB unique-download dedup" }
      - { name: user_agent, type: string, source: input, description: "Listener client user agent" }
      - { name: bytes_served, type: integer, source: input, description: "Bytes delivered; IAB requires >= IAB_MIN_BYTES to count as a download", constraints: ">= 0" }
      - { name: counted, type: boolean, source: computed, description: "True iff bytes_served >= IAB_MIN_BYTES (counts toward analytics & delivery)" }
      - { name: event_at, type: datetime, source: input, description: "Logical-clock instant of the download" }

  - name: PayoutStatement
    parent: null
    common_fields: true
    fields:
      - { name: publisher_id, type: string, source: input, description: "FK -> Publisher.id; publisher being paid" }
      - { name: period_start, type: datetime, source: input, description: "Half-open period start (inclusive) used to select DELIVERED placements by created_at" }
      - { name: period_end, type: datetime, source: input, description: "Half-open period end (exclusive) used to select DELIVERED placements by created_at" }
      - { name: status, type: enum, source: system, description: "Statement lifecycle", constraints: "one of DRAFT, FINALIZED, PAID, VOID" }
      - { name: gross_revenue_cents, type: integer, source: computed, description: "Sum of selected placements' final_cost_cents (see payout_gross_revenue)", default: 0 }
      - { name: platform_fee_cents, type: integer, source: computed, description: "Platform's cut = gross - net_payable", default: 0 }
      - { name: net_payable_cents, type: integer, source: computed, description: "Publisher's net payout after revenue share (see payout_net_payable)", default: 0 }
      - { name: settled_revenue_cents, type: integer, source: computed, description: "Net over only placements whose campaign is COMPLETED (settled variant)", default: 0 }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  # ---- Show: posture gating children -------------------------------------
  - entity: Show
    field: status
    initial_state: DRAFT
    terminal_states: [ARCHIVED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /shows/{id}/activate"
        actor: Publisher
        preconditions: ["caller is the owning Publisher"]
        side_effects: []
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /shows/{id}/suspend"
        actor: PlatformAdmin
        preconditions: []
        side_effects:
          - "CASCADE L1: every Episode of this show with publish_status == PUBLISHED transitions to UNPUBLISHED"
          - "CASCADE L2 (caused by L1): for each such episode, every AdPlacement in {PROPOSED, INSERTED} transitions to CANCELLED"
          - "CASCADE L3 (caused by L2): each cancelled placement releases its estimated_cost_cents back to its AdCampaign — campaign.reserved_budget_cents recomputed, campaign.available_budget_cents recomputed"
          - "each affected Episode.filled_slots / available_slots / fill_rate recomputed (caused by L2)"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /shows/{id}/activate"
        actor: PlatformAdmin
        preconditions: []
        note: "reinstatement does NOT auto-republish episodes or restore cancelled placements"
        side_effects: []
      - from: ACTIVE
        to: ARCHIVED
        trigger: "POST /shows/{id}/archive"
        actor: Publisher
        preconditions: ["caller is the owning Publisher", "no Episode in publish_status == PUBLISHED"]
        side_effects: ["all Feeds of this show transition to DISABLED"]
      - from: DRAFT
        to: ARCHIVED
        trigger: "POST /shows/{id}/archive"
        actor: Publisher
        preconditions: ["caller is the owning Publisher"]
        side_effects: ["all Feeds of this show transition to DISABLED"]

  # ---- Episode publish axis (independent of media axis) -------------------
  - entity: Episode
    field: publish_status
    initial_state: DRAFT
    terminal_states: [DELETED]
    transitions:
      - from: DRAFT
        to: SCHEDULED
        trigger: "POST /episodes/{id}/schedule"
        actor: Publisher
        preconditions:
          - "caller is the owning Publisher (Episode.show.publisher_id)"
          - "scheduled_publish_at strictly after current logical clock"
        side_effects: ["scheduled_publish_at stored"]
      - from: DRAFT
        to: PUBLISHED
        trigger: "POST /episodes/{id}/publish"
        actor: Publisher
        preconditions:
          - "caller is the owning Publisher"
          - "CROSS-ENTITY: Show.status == ACTIVE"
          - "CROSS-ENTITY: Episode.media_status == READY"
        side_effects: ["Show.episode_count recomputed"]
      - from: SCHEDULED
        to: PUBLISHED
        trigger: "POST /episodes/{id}/publish  OR  system (clock reaches scheduled_publish_at, fired by POST /_clock/set_current_utc)"
        actor: "Publisher or system"
        preconditions:
          - "CROSS-ENTITY: Show.status == ACTIVE"
          - "CROSS-ENTITY: Episode.media_status == READY"
        side_effects: ["Show.episode_count recomputed"]
      - from: PUBLISHED
        to: UNPUBLISHED
        trigger: "POST /episodes/{id}/unpublish  OR  system (Show suspend cascade L1)"
        actor: "Publisher or system"
        preconditions: []
        side_effects:
          - "CASCADE L2: every AdPlacement on this episode in {PROPOSED, INSERTED} → CANCELLED (each releases campaign reserve — see Show suspend chain)"
          - "Episode.filled_slots / available_slots / fill_rate recomputed"
      - from: UNPUBLISHED
        to: PUBLISHED
        trigger: "POST /episodes/{id}/publish"
        actor: Publisher
        preconditions:
          - "caller is the owning Publisher"
          - "CROSS-ENTITY: Show.status == ACTIVE"
          - "CROSS-ENTITY: Episode.media_status == READY"
        side_effects: []
      - from: DRAFT
        to: DELETED
        trigger: "DELETE /episodes/{id}"
        actor: Publisher
        preconditions: ["caller is the owning Publisher"]
        side_effects: ["Show.episode_count recomputed"]

  # ---- Episode media axis (driven by MediaAsset; parallel dimension) ------
  - entity: Episode
    field: media_status
    initial_state: NONE
    terminal_states: []
    transitions:
      - from: NONE
        to: PENDING
        trigger: "system (MediaAsset created with status UPLOADED for this episode)"
        actor: system
        preconditions: []
        side_effects: []
      - from: PENDING
        to: PROCESSING
        trigger: "system (MediaAsset enters TRANSCODING)"
        actor: system
        preconditions: []
        side_effects: []
      - from: PROCESSING
        to: READY
        trigger: "system (MediaAsset enters READY)"
        actor: system
        preconditions: []
        side_effects: ["Episode.duration_ms := MediaAsset.output_duration_ms"]
      - from: PROCESSING
        to: FAILED
        trigger: "system (MediaAsset enters FAILED after MAX_TRANSCODE_ATTEMPTS)"
        actor: system
        preconditions: []
        side_effects: []
      - from: FAILED
        to: PROCESSING
        trigger: "system (MediaAsset retried into TRANSCODING)"
        actor: system
        preconditions: []
        side_effects: []

  # ---- MediaAsset: cyclic transcode ---------------------------------------
  - entity: MediaAsset
    field: status
    initial_state: UPLOADED
    terminal_states: [READY]
    transitions:
      - from: UPLOADED
        to: TRANSCODING
        trigger: "POST /media-assets/{id}/transcode-start"
        actor: PlatformAdmin
        preconditions: []
        side_effects: ["transcode_attempts += 1", "Episode.media_status → PROCESSING"]
      - from: TRANSCODING
        to: READY
        trigger: "POST /media-assets/{id}/transcode-result  (outcome=SUCCESS)"
        actor: PlatformAdmin
        preconditions: []
        side_effects:
          - "output_duration_ms := provided output_duration_ms"
          - "Episode.media_status → READY"
          - "Episode.duration_ms := output_duration_ms"
      - from: TRANSCODING
        to: FAILED
        trigger: "POST /media-assets/{id}/transcode-result  (outcome=FAILURE)"
        actor: PlatformAdmin
        preconditions: []
        side_effects:
          - "if transcode_attempts >= MAX_TRANSCODE_ATTEMPTS: Episode.media_status → FAILED, else Episode.media_status stays PROCESSING (awaiting retry)"
      - from: FAILED
        to: TRANSCODING
        trigger: "POST /media-assets/{id}/transcode-start  (retry)"
        actor: PlatformAdmin
        preconditions: ["transcode_attempts < MAX_TRANSCODE_ATTEMPTS"]
        side_effects: ["transcode_attempts += 1", "Episode.media_status → PROCESSING"]

  # ---- Feed ---------------------------------------------------------------
  - entity: Feed
    field: status
    initial_state: ENABLED
    terminal_states: []
    transitions:
      - from: ENABLED
        to: DISABLED
        trigger: "POST /feeds/{id}/disable  OR  system (Show archive cascade)"
        actor: "Publisher or system"
        preconditions: []
        side_effects: []
      - from: DISABLED
        to: ENABLED
        trigger: "POST /feeds/{id}/enable"
        actor: Publisher
        preconditions: ["CROSS-ENTITY: Show.status != ARCHIVED"]
        side_effects: []

  # ---- Subscription -------------------------------------------------------
  - entity: Subscription
    field: status
    initial_state: PENDING
    terminal_states: [CANCELLED]
    transitions:
      - from: PENDING
        to: ACTIVE
        trigger: "POST /subscriptions/{id}/activate"
        actor: Listener
        preconditions:
          - "caller is the owning Listener"
          - "CROSS-ENTITY: the show has a Feed with visibility == PRIVATE and status == ENABLED"
          - "no other Subscription for same listener_id+show_id in status {ACTIVE, PAST_DUE} whose [period_start, period_end] (closed) overlaps this one"
        side_effects: ["access_token minted"]
      - from: ACTIVE
        to: PAST_DUE
        trigger: "POST /subscriptions/{id}/mark-past-due  OR  system (clock passes period_end with no renewal)"
        actor: "PlatformAdmin or system"
        preconditions: []
        side_effects: []
      - from: PAST_DUE
        to: ACTIVE
        trigger: "POST /subscriptions/{id}/activate"
        actor: Listener
        preconditions: ["caller is the owning Listener", "renewed period supplied via period_start/period_end"]
        side_effects: []
      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /subscriptions/{id}/cancel"
        actor: Listener
        preconditions: ["caller is the owning Listener"]
        side_effects: ["access_token cleared"]
      - from: PAST_DUE
        to: CANCELLED
        trigger: "POST /subscriptions/{id}/cancel  OR  system (clock passes period_end + GRACE_MS)"
        actor: "Listener or system"
        preconditions: []
        side_effects: ["access_token cleared"]

  # ---- Distribution -------------------------------------------------------
  - entity: Distribution
    field: status
    initial_state: PENDING
    terminal_states: [REMOVED]
    transitions:
      - from: PENDING
        to: LIVE
        trigger: "POST /distributions/{id}/approve"
        actor: PlatformAdmin
        preconditions:
          - "CROSS-ENTITY: Show.status == ACTIVE"
          - "CROSS-ENTITY: the show has a Feed with visibility == PUBLIC and status == ENABLED"
        side_effects: ["external_ref minted"]
      - from: PENDING
        to: REJECTED
        trigger: "POST /distributions/{id}/reject"
        actor: PlatformAdmin
        preconditions: []
        side_effects: []
      - from: LIVE
        to: REMOVED
        trigger: "POST /distributions/{id}/remove"
        actor: "Publisher or PlatformAdmin"
        preconditions: []
        side_effects: []
      - from: REJECTED
        to: REMOVED
        trigger: "POST /distributions/{id}/remove"
        actor: "Publisher or PlatformAdmin"
        preconditions: []
        side_effects: []

  # ---- AdCampaign ---------------------------------------------------------
  - entity: AdCampaign
    field: status
    initial_state: DRAFT
    terminal_states: [COMPLETED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /ad-campaigns/{id}/activate"
        actor: Advertiser
        preconditions: ["caller is the owning Advertiser", "available_budget_cents >= bid-derived minimum (budget_cents > 0)"]
        side_effects: []
      - from: ACTIVE
        to: PAUSED
        trigger: "POST /ad-campaigns/{id}/pause  OR  system (budget exhausted on placement insertion — see exhaustion cascade)"
        actor: "Advertiser or system"
        preconditions: []
        side_effects:
          - "CASCADE L1: every AdPlacement of this campaign in status PROPOSED → REJECTED (releases its reserve — reserved_budget_cents recomputed)"
          - "INSERTED placements are left intact"
      - from: PAUSED
        to: ACTIVE
        trigger: "POST /ad-campaigns/{id}/activate"
        actor: Advertiser
        preconditions: ["caller is the owning Advertiser", "available_budget_cents > 0", "status was not EXHAUSTED"]
        side_effects: []
      - from: ACTIVE
        to: EXHAUSTED
        trigger: "system (a placement insert confirms while available_budget_cents == 0 — boundary)"
        actor: system
        preconditions: ["available_budget_cents == 0 at the moment a placement insert confirms"]
        side_effects:
          - "CASCADE L1: every AdPlacement of this campaign in status PROPOSED → REJECTED (releases reserve)"
      - from: ACTIVE
        to: COMPLETED
        trigger: "POST /ad-campaigns/{id}/complete"
        actor: Advertiser
        preconditions: ["caller is the owning Advertiser", "no AdPlacement of this campaign in status {PROPOSED, INSERTED}"]
        side_effects: []
      - from: EXHAUSTED
        to: COMPLETED
        trigger: "POST /ad-campaigns/{id}/complete"
        actor: Advertiser
        preconditions: ["caller is the owning Advertiser", "no AdPlacement of this campaign in status {PROPOSED, INSERTED}"]
        side_effects: []

  # ---- AdPlacement --------------------------------------------------------
  - entity: AdPlacement
    field: status
    initial_state: PROPOSED
    terminal_states: [DELIVERED, CANCELLED, REJECTED]
    transitions:
      - from: PROPOSED
        to: INSERTED
        trigger: "POST /ad-placements/{id}/insert"
        actor: Advertiser
        preconditions:
          - "caller is the owning Advertiser (placement.campaign.advertiser_id)"
          - "CROSS-ENTITY: AdCampaign.status == ACTIVE"
          - "CROSS-ENTITY: Episode.publish_status == PUBLISHED AND Episode.media_status == READY"
          - "CROSS-ENTITY: Episode.show.monetization_enabled == true AND Episode.show.category == campaign.targeting_category"
          - "available_slots > 0"
          - "for MID_ROLL: [offset_ms, offset_ms + ad_duration_ms) plus MID_ROLL_BUFFER_MS must not overlap another INSERTED/DELIVERED MID_ROLL on the episode"
        side_effects:
          - "no re-pricing: estimated_cost_cents and fill_tier_multiplier stay frozen from create; reserve already held"
          - "Episode.filled_slots/available_slots/fill_rate recomputed (placement now counts as filled)"
          - "if campaign.available_budget_cents == 0 at this point: campaign → EXHAUSTED (auto, cascades PROPOSED→REJECTED on its other placements)"
      - from: INSERTED
        to: DELIVERED
        trigger: "POST /ad-placements/{id}/reconcile"
        actor: PlatformAdmin
        preconditions: ["delivered_impressions reflects counted DownloadEvents attributed to this placement"]
        side_effects:
          - "final_cost_cents computed (see final_placement_cost)"
          - "campaign.reserved_budget_cents -= estimated_cost_cents; campaign.spent_budget_cents += final_cost_cents; available_budget_cents recomputed"
          - "Episode.fill_rate unchanged (DELIVERED still counts as filled)"
      - from: PROPOSED
        to: CANCELLED
        trigger: "POST /ad-placements/{id}/cancel  OR  system (Show suspend / Episode unpublish cascade)"
        actor: "Advertiser or system"
        preconditions: []
        side_effects:
          - "campaign.reserved_budget_cents -= estimated_cost_cents (release); available_budget_cents recomputed"
          - "Episode.filled_slots/available_slots/fill_rate recomputed"
      - from: INSERTED
        to: CANCELLED
        trigger: "POST /ad-placements/{id}/cancel  OR  system (Show suspend / Episode unpublish cascade)"
        actor: "Advertiser or system"
        preconditions: []
        side_effects:
          - "campaign.reserved_budget_cents -= estimated_cost_cents (release); available_budget_cents recomputed"
          - "Episode.filled_slots/available_slots/fill_rate recomputed"
      - from: PROPOSED
        to: REJECTED
        trigger: "system (campaign pause / exhaustion cascade L1)"
        actor: system
        preconditions: []
        side_effects:
          - "campaign.reserved_budget_cents -= estimated_cost_cents (release); available_budget_cents recomputed"
          - "Episode.filled_slots/available_slots/fill_rate recomputed"

  # ---- PayoutStatement ----------------------------------------------------
  - entity: PayoutStatement
    field: status
    initial_state: DRAFT
    terminal_states: [PAID, VOID]
    transitions:
      - from: DRAFT
        to: FINALIZED
        trigger: "POST /payout-statements/{id}/finalize"
        actor: PlatformAdmin
        preconditions: ["gross_revenue_cents/net_payable_cents already computed at draft creation"]
        side_effects: ["snapshot of gross/platform_fee/net/settled is frozen"]
      - from: FINALIZED
        to: PAID
        trigger: "POST /payout-statements/{id}/pay"
        actor: PlatformAdmin
        preconditions: ["net_payable_cents > 0"]
        side_effects: []
      - from: DRAFT
        to: VOID
        trigger: "POST /payout-statements/{id}/void"
        actor: PlatformAdmin
        preconditions: []
        side_effects: []
      - from: FINALIZED
        to: VOID
        trigger: "POST /payout-statements/{id}/void"
        actor: PlatformAdmin
        preconditions: ["statement not yet PAID"]
        side_effects: []

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: placement-create-stale-campaign
    parent_entity: AdCampaign
    write_endpoint: "POST /ad-placements"
    occ_field: "expected_campaign_version"
    description: |
      Creating an AdPlacement against an AdCampaign whose version has advanced
      since the client last observed it is rejected. A prior placement creation
      against the same campaign legitimately reserved budget and bumped the
      campaign's version; the current writer's view of available_budget_cents is
      therefore stale, so the create is refused on the stale-version check rather
      than over-reserving the shared budget pool.
    error_id: ERR_STALE_CAMPAIGN_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: estimated_placement_cost
    trigger: "AdPlacement create (POST /ad-placements) — computed once, reserved immediately, and frozen; insert does NOT re-price"
    algorithm: tiered_pricing
    formula: |
      # Provisional (forecast) cost reserved against the campaign at CREATE time.
      base = campaign.bid_cpm_cents * forecast_impressions / 1000      # CPM math
      premium = PREMIUM_MULTIPLIER if campaign.premium_targeting else 1.0
      # tier multiplier selected by the EPISODE'S CURRENT fill_rate band (more
      # demand on a high-fill episode => surcharge); non-linear, >=3 inputs:
      if   episode.fill_rate >= 0.80: tier = HIGH_FILL_MULT
      elif episode.fill_rate >= 0.50: tier = MID_FILL_MULT
      else:                           tier = LOW_FILL_MULT
      fill_tier_multiplier = tier                                          # frozen on the placement
      raw = base * premium * tier
      estimated_cost_cents = max(MIN_PLACEMENT_CENTS, round_half_up(raw))   # cents, floor at MIN
    input_set: "single AdPlacement + its AdCampaign + its Episode's fill_rate at create time"
    constants:
      PREMIUM_MULTIPLIER: 1.25
      HIGH_FILL_MULT: 1.20
      MID_FILL_MULT: 1.10
      LOW_FILL_MULT: 1.00
      MIN_PLACEMENT_CENTS: 100
    precision: "integer cents, round_half_up on the single raw product"
    variants:
      - name: estimated
        when: "at create — uses forecast_impressions"
        difference: "uses forecast_impressions and the episode's fill_rate band at create, BEFORE this placement is counted (PROPOSED does not count toward filled_slots)"

  - name: final_placement_cost
    trigger: "AdPlacement reconcile (INSERTED → DELIVERED)"
    algorithm: tiered_pricing
    formula: |
      # Final billed cost on delivery — same shape but driven by ACTUAL counted
      # delivered_impressions, and capped so the advertiser never pays beyond the
      # reserved estimate (delivery shortfall lowers the bill; overdelivery never
      # raises it above the reserve).
      base = campaign.bid_cpm_cents * delivered_impressions / 1000
      premium = PREMIUM_MULTIPLIER if campaign.premium_targeting else 1.0
      # tier multiplier frozen at insertion in AdPlacement.fill_tier_multiplier (no re-banding)
      raw = base * premium * placement.fill_tier_multiplier
      uncapped = max(MIN_PLACEMENT_CENTS, round_half_up(raw))
      final_cost_cents = min(uncapped, estimated_cost_cents)               # cap at reserve
    input_set: "single AdPlacement + counted DownloadEvents attributed to it"
    constants:
      PREMIUM_MULTIPLIER: 1.25
      MIN_PLACEMENT_CENTS: 100
    precision: "integer cents, round_half_up on the single raw product"
    variants:
      - name: final
        when: "at reconcile — uses delivered_impressions"
        difference: "DUAL-VARIANT of estimated_placement_cost: same inputs except impressions source (forecast vs delivered) and the min-cap against the reserve; on identical placement data the two produce different cents whenever delivered != forecast"

  - name: episode_fill_rate
    trigger: "any AdPlacement status change touching {PROPOSED,INSERTED,DELIVERED}; episode summary read"
    algorithm: aggregation
    formula: |
      filled_slots   = count(AdPlacement where episode_id == this AND status IN {INSERTED, DELIVERED})
      available_slots = total_ad_slots - filled_slots
      if total_ad_slots == 0:
        fill_rate = 0.0                     # empty-set boundary: no divide-by-zero
      else:
        fill_rate = round_half_up(filled_slots / total_ad_slots, 4)
    input_set: "AdPlacements of one episode in {INSERTED, DELIVERED}"
    constants: {}
    precision: "4 decimal places, round_half_up"

  - name: campaign_budget_ledger
    trigger: "AdPlacement insert/reconcile/cancel/reject; recomputed synchronously on each"
    algorithm: aggregation
    formula: |
      reserved_budget_cents = sum(estimated_cost_cents for placements in {PROPOSED, INSERTED})
      spent_budget_cents    = sum(final_cost_cents     for placements in {DELIVERED})
      available_budget_cents = budget_cents - reserved_budget_cents - spent_budget_cents
      INVARIANT: budget_cents == available_budget_cents + reserved_budget_cents + spent_budget_cents
    input_set: "all AdPlacements of one campaign, filtered by status as above"
    constants: {}
    precision: "integer cents"

  - name: download_counted
    trigger: "DownloadEvent ingestion (POST /download-events)"
    algorithm: threshold
    formula: |
      counted = (bytes_served >= IAB_MIN_BYTES)
      # only counted events with a non-null placement_id increment that
      # placement's delivered_impressions
      if counted and placement_id is not null:
        AdPlacement.delivered_impressions += 1
    input_set: "single DownloadEvent"
    constants:
      IAB_MIN_BYTES: 1048576        # 1 MiB IAB minimum for a counted download
    precision: "exact byte comparison; >= is inclusive at the threshold"

  - name: payout_gross_revenue
    trigger: "PayoutStatement creation (DRAFT); recomputed at finalize-time snapshot"
    algorithm: aggregation
    formula: |
      # ROUNDING ORDER PINNED: each placement's final_cost_cents is already an
      # integer (rounded at reconcile); we SUM the per-placement integer cents.
      # Selection: DELIVERED placements on episodes of shows owned by this
      # publisher whose created_at is in [period_start, period_end) (half-open),
      # ordered by created_at ASC for determinism.
      selected = [p for p in AdPlacement
                  if p.status == DELIVERED
                  and p.episode.show.publisher_id == publisher_id
                  and period_start <= p.created_at < period_end]
      gross_revenue_cents = sum(p.final_cost_cents for p in selected)   # sum of already-rounded ints
    input_set: "DELIVERED AdPlacements for this publisher within the half-open period window"
    constants: {}
    precision: "integer cents; per-placement-rounded-then-summed (NOT sum-then-round)"

  - name: payout_net_payable
    trigger: "PayoutStatement creation (DRAFT); frozen at finalize"
    algorithm: weighted_scoring
    formula: |
      # Evaluation order PINNED to avoid circularity: gross is computed first,
      # THEN net is derived from gross, THEN platform_fee is the residual.
      gross  = gross_revenue_cents                          # from payout_gross_revenue
      net_payable_cents = round_half_up(gross * publisher.revenue_share_pct)   # round once, after the product
      platform_fee_cents = gross - net_payable_cents        # residual so the two always sum to gross
      # settled variant: net over ONLY placements whose campaign.status == COMPLETED
      settled_selected = [p in selected if p.campaign.status == COMPLETED]
      settled_gross = sum(p.final_cost_cents for p in settled_selected)
      settled_revenue_cents = round_half_up(settled_gross * publisher.revenue_share_pct)
      INVARIANT: gross_revenue_cents == net_payable_cents + platform_fee_cents
    input_set: "the gross from payout_gross_revenue + publisher.revenue_share_pct"
    constants: {}
    precision: "integer cents, round_half_up once after multiplying gross by share"
    variants:
      - name: accrued
        when: "net_payable_cents — counts ALL DELIVERED placements in the window regardless of campaign status"
        difference: "DUAL-VARIANT on the PayoutStatement domain: accrued includes DELIVERED placements whose campaign is still ACTIVE/PAUSED/EXHAUSTED"
      - name: settled
        when: "settled_revenue_cents — counts only DELIVERED placements whose campaign.status == COMPLETED"
        difference: "differs from accrued whenever the window contains a DELIVERED placement on a not-yet-COMPLETED campaign"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and well-formed"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all except GET reads of PUBLIC resources"

  - priority: 2
    category: auth
    check: "Role is permitted to perform this operation per §1.7"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all mutating endpoints"

  - priority: 3
    category: auth
    check: "Acting entity_backed role owns the target resource (e.g. Publisher owns Show, Advertiser owns Campaign, Listener owns Subscription)"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "owner-scoped mutations"

  - priority: 4
    category: existence
    check: "All path ids and referenced FK ids resolve to existing resources, left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"

  - priority: 5
    category: state
    check: "Target resource is in a state from which this transition is defined; for POST /ad-placements (create) the funding AdCampaign.status must be ACTIVE"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all transition endpoints AND POST /ad-placements (campaign must be ACTIVE to reserve)"

  - priority: 6
    category: business_referential
    check: "AdPlacement.position must be a member of Episode.offered_positions (static field, checked at create)"
    error_id: ERR_POSITION_NOT_OFFERED
    http_status: 422
    applies_to: "POST /ad-placements (create)"

  - priority: 7
    category: business_referential
    check: "Episode.show.category must equal AdCampaign.targeting_category for insertion"
    error_id: ERR_TARGETING_MISMATCH
    http_status: 422
    applies_to: "POST /ad-placements/{id}/insert"

  - priority: 8
    category: business_safety
    check: "Insertion requires Episode.show.monetization_enabled == true"
    error_id: ERR_MONETIZATION_DISABLED
    http_status: 409
    applies_to: "POST /ad-placements/{id}/insert"

  - priority: 9
    category: business_safety
    check: "Private-feed access: a DownloadEvent on an episode whose show has only a PRIVATE feed requires an ACTIVE subscription for the listener (passed via access token)"
    error_id: ERR_NO_PRIVATE_ACCESS
    http_status: 403
    applies_to: "POST /download-events"

  - priority: 10
    category: business_temporal
    check: "MID_ROLL placement interval [offset_ms, offset_ms+ad_duration_ms) plus MID_ROLL_BUFFER_MS must not overlap an existing INSERTED/DELIVERED MID_ROLL on the same episode"
    error_id: ERR_MIDROLL_OVERLAP
    http_status: 409
    applies_to: "POST /ad-placements/{id}/insert"

  - priority: 11
    category: business_temporal
    check: "Subscription [period_start, period_end] (closed) must not overlap another ACTIVE/PAST_DUE subscription for the same listener_id+show_id"
    error_id: ERR_SUBSCRIPTION_PERIOD_OVERLAP
    http_status: 409
    applies_to: "POST /subscriptions/{id}/activate"

  - priority: 12
    category: business_constraint
    check: "Episode has an available ad slot (available_slots > 0) for insertion"
    error_id: ERR_NO_AVAILABLE_SLOT
    http_status: 409
    applies_to: "POST /ad-placements/{id}/insert"

  - priority: 13
    category: business_fiscal
    check: "estimated_cost_cents must be <= campaign.available_budget_cents at create (would-exceed); reserve is held at create, not insert"
    error_id: ERR_BUDGET_WOULD_EXCEED
    http_status: 409
    applies_to: "POST /ad-placements (create)"

  - priority: 14
    category: business_constraint
    check: "scheduled_publish_at must be strictly after the current logical clock"
    error_id: ERR_SCHEDULE_IN_PAST
    http_status: 422
    applies_to: "POST /episodes/{id}/schedule"

  - priority: 15
    category: business_constraint
    check: "Subscription target show must have a Feed with visibility == PRIVATE and status == ENABLED"
    error_id: ERR_NO_PRIVATE_FEED
    http_status: 409
    applies_to: "POST /subscriptions/{id}/activate"

  - priority: 16
    category: business_constraint
    check: "Request body fields are well-typed and required fields present; enum values valid"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all create/transition endpoints"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- Test-driving: logical clock ---------------------------------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the logical clock. Server startup default is 2026-01-01T00:00:00Z; before any call the clock reads exactly this default and never falls back to wall-clock. Advancing the clock fires due SCHEDULED episode auto-publishes and due Subscription period_end transitions."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects:
      - "logical clock := to_iso8601"
      - "each SCHEDULED Episode with scheduled_publish_at <= clock AND Show.status==ACTIVE AND media_status==READY → PUBLISHED"
      - "each ACTIVE Subscription past period_end → PAST_DUE; each PAST_DUE past period_end+GRACE_MS → CANCELLED"

  # ---- Publisher ----------------------------------------------------------
  - method: POST
    path: "/publishers"
    description: "Register a publisher"
    roles: [PlatformAdmin]
    code: 201
    input: [name, payout_email, "revenue_share_pct?"]
    output: Publisher
    side_effects: []

  # ---- Advertiser ---------------------------------------------------------
  - method: POST
    path: "/advertisers"
    description: "Register an advertiser"
    roles: [PlatformAdmin]
    code: 201
    input: [name, billing_email]
    output: Advertiser
    side_effects: []

  # ---- Listener -----------------------------------------------------------
  - method: POST
    path: "/listeners"
    description: "Register a listener"
    roles: [PlatformAdmin, Listener]
    code: 201
    input: [email, display_name]
    output: Listener
    side_effects: []

  # ---- Show ---------------------------------------------------------------
  - method: POST
    path: "/shows"
    description: "Create a show (status DRAFT)"
    roles: [Publisher]
    code: 201
    input: [publisher_id, title, category, "monetization_enabled?"]
    output: Show
    side_effects: ["status=DRAFT, episode_count=0"]
  - method: GET
    path: "/shows"
    description: "List shows; filter by publisher_id"
    roles: [PlatformAdmin, Publisher, Listener]
    code: 200
    input: ["publisher_id?", "status?", "limit?", "offset?"]
    output: Show[]
    side_effects: []
  - method: GET
    path: "/shows/{id}"
    description: "Get a show with computed episode_count"
    roles: [PlatformAdmin, Publisher, Listener]
    code: 200
    input: []
    output: Show
    side_effects: []
  - method: POST
    path: "/shows/{id}/activate"
    description: "DRAFT/SUSPENDED → ACTIVE"
    roles: [Publisher, PlatformAdmin]
    code: 200
    input: []
    output: Show
    side_effects: []
  - method: POST
    path: "/shows/{id}/suspend"
    description: "ACTIVE → SUSPENDED; cascades unpublish→cancel placements→release budget"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Show
    side_effects: ["3-level cascade: episodes UNPUBLISHED → placements CANCELLED → campaign reserves released"]
  - method: POST
    path: "/shows/{id}/archive"
    description: "DRAFT/ACTIVE → ARCHIVED; disables feeds"
    roles: [Publisher]
    code: 200
    input: []
    output: Show
    side_effects: ["feeds → DISABLED"]

  # ---- Episode ------------------------------------------------------------
  - method: POST
    path: "/episodes"
    description: "Create an episode (publish_status DRAFT, media_status NONE)"
    roles: [Publisher]
    code: 201
    input: [show_id, title, total_ad_slots, offered_positions]
    output: Episode
    side_effects: ["Show.episode_count recomputed"]
  - method: GET
    path: "/episodes"
    description: "List episodes; filter by show_id"
    roles: [PlatformAdmin, Publisher, Listener]
    code: 200
    input: ["show_id?", "publish_status?", "limit?", "offset?"]
    output: Episode[]
    side_effects: []
  - method: GET
    path: "/episodes/{id}"
    description: "Get an episode with computed fill_rate/filled_slots/available_slots"
    roles: [PlatformAdmin, Publisher, Listener, Advertiser]
    code: 200
    input: []
    output: Episode
    side_effects: []
  - method: POST
    path: "/episodes/{id}/schedule"
    description: "DRAFT → SCHEDULED"
    roles: [Publisher]
    code: 200
    input: [scheduled_publish_at]
    output: Episode
    side_effects: []
  - method: POST
    path: "/episodes/{id}/publish"
    description: "DRAFT/SCHEDULED/UNPUBLISHED → PUBLISHED (requires Show ACTIVE + media READY)"
    roles: [Publisher]
    code: 200
    input: []
    output: Episode
    side_effects: ["Show.episode_count recomputed"]
  - method: POST
    path: "/episodes/{id}/unpublish"
    description: "PUBLISHED → UNPUBLISHED; cancels placements (L2), releases reserves"
    roles: [Publisher]
    code: 200
    input: []
    output: Episode
    side_effects: ["placements CANCELLED, fill_rate recomputed"]
  - method: DELETE
    path: "/episodes/{id}"
    description: "DRAFT → DELETED"
    roles: [Publisher]
    code: 200
    input: []
    output: Episode
    side_effects: ["Show.episode_count recomputed"]

  # ---- MediaAsset ---------------------------------------------------------
  - method: POST
    path: "/media-assets"
    description: "Upload media for an episode (status UPLOADED, episode media_status → PENDING)"
    roles: [Publisher]
    code: 201
    input: [episode_id, source_filename, source_duration_ms]
    output: MediaAsset
    side_effects: ["Episode.media_status → PENDING"]
  - method: GET
    path: "/media-assets"
    description: "List media assets; filter by episode_id"
    roles: [PlatformAdmin, Publisher]
    code: 200
    input: ["episode_id?", "limit?", "offset?"]
    output: MediaAsset[]
    side_effects: []
  - method: GET
    path: "/media-assets/{id}"
    description: "Get a media asset"
    roles: [PlatformAdmin, Publisher]
    code: 200
    input: []
    output: MediaAsset
    side_effects: []
  - method: POST
    path: "/media-assets/{id}/transcode-start"
    description: "UPLOADED/FAILED → TRANSCODING (worker pickup or retry); Episode media_status → PROCESSING"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: MediaAsset
    side_effects: ["transcode_attempts += 1, Episode.media_status → PROCESSING"]
  - method: POST
    path: "/media-assets/{id}/transcode-result"
    description: "Transcoder callback: TRANSCODING → READY (SUCCESS) or FAILED (FAILURE)"
    roles: [PlatformAdmin]
    code: 200
    input: [outcome, "output_duration_ms?"]
    output: MediaAsset
    side_effects: ["SUCCESS: Episode media_status→READY, duration_ms set; FAILURE: media_status→FAILED iff attempts>=MAX else stays PROCESSING"]

  # ---- Feed ---------------------------------------------------------------
  - method: POST
    path: "/feeds"
    description: "Create a feed for a show (status ENABLED)"
    roles: [Publisher]
    code: 201
    input: [show_id, visibility]
    output: Feed
    side_effects: ["token_required = (visibility==PRIVATE)"]
  - method: GET
    path: "/feeds"
    description: "List feeds; filter by show_id"
    roles: [PlatformAdmin, Publisher, Listener]
    code: 200
    input: ["show_id?", "visibility?", "limit?", "offset?"]
    output: Feed[]
    side_effects: []
  - method: GET
    path: "/feeds/{id}"
    description: "Get a feed"
    roles: [PlatformAdmin, Publisher, Listener]
    code: 200
    input: []
    output: Feed
    side_effects: []
  - method: POST
    path: "/feeds/{id}/disable"
    description: "ENABLED → DISABLED"
    roles: [Publisher]
    code: 200
    input: []
    output: Feed
    side_effects: []
  - method: POST
    path: "/feeds/{id}/enable"
    description: "DISABLED → ENABLED (requires Show not ARCHIVED)"
    roles: [Publisher]
    code: 200
    input: []
    output: Feed
    side_effects: []

  # ---- Subscription -------------------------------------------------------
  - method: POST
    path: "/subscriptions"
    description: "Create a subscription (status PENDING)"
    roles: [Listener]
    code: 201
    input: [listener_id, show_id, price_cents, period_start, period_end]
    output: Subscription
    side_effects: ["status=PENDING"]
  - method: GET
    path: "/subscriptions"
    description: "List subscriptions; filter by listener_id and/or show_id"
    roles: [PlatformAdmin, Listener, Publisher]
    code: 200
    input: ["listener_id?", "show_id?", "status?", "limit?", "offset?"]
    output: Subscription[]
    side_effects: []
  - method: GET
    path: "/subscriptions/{id}"
    description: "Get a subscription"
    roles: [PlatformAdmin, Listener]
    code: 200
    input: []
    output: Subscription
    side_effects: []
  - method: POST
    path: "/subscriptions/{id}/activate"
    description: "PENDING/PAST_DUE → ACTIVE (requires PRIVATE ENABLED feed, no overlapping period); mints access_token"
    roles: [Listener]
    code: 200
    input: ["period_start?", "period_end?"]
    output: Subscription
    side_effects: ["access_token minted"]
  - method: POST
    path: "/subscriptions/{id}/mark-past-due"
    description: "ACTIVE → PAST_DUE"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Subscription
    side_effects: []
  - method: POST
    path: "/subscriptions/{id}/cancel"
    description: "ACTIVE/PAST_DUE → CANCELLED; clears access_token"
    roles: [Listener]
    code: 200
    input: []
    output: Subscription
    side_effects: ["access_token cleared"]

  # ---- Distribution -------------------------------------------------------
  - method: POST
    path: "/distributions"
    description: "Submit a show to a directory (status PENDING)"
    roles: [Publisher]
    code: 201
    input: [show_id, channel]
    output: Distribution
    side_effects: ["status=PENDING"]
  - method: GET
    path: "/distributions"
    description: "List distributions; filter by show_id"
    roles: [PlatformAdmin, Publisher]
    code: 200
    input: ["show_id?", "channel?", "limit?", "offset?"]
    output: Distribution[]
    side_effects: []
  - method: GET
    path: "/distributions/{id}"
    description: "Get a distribution"
    roles: [PlatformAdmin, Publisher]
    code: 200
    input: []
    output: Distribution
    side_effects: []
  - method: POST
    path: "/distributions/{id}/approve"
    description: "PENDING → LIVE (requires Show ACTIVE + PUBLIC ENABLED feed); mints external_ref"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Distribution
    side_effects: ["external_ref minted"]
  - method: POST
    path: "/distributions/{id}/reject"
    description: "PENDING → REJECTED"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Distribution
    side_effects: []
  - method: POST
    path: "/distributions/{id}/remove"
    description: "LIVE/REJECTED → REMOVED"
    roles: [Publisher, PlatformAdmin]
    code: 200
    input: []
    output: Distribution
    side_effects: []

  # ---- AdCampaign ---------------------------------------------------------
  - method: POST
    path: "/ad-campaigns"
    description: "Create a campaign (status DRAFT)"
    roles: [Advertiser]
    code: 201
    input: [advertiser_id, name, budget_cents, bid_cpm_cents, targeting_category, "premium_targeting?", flight_start, flight_end]
    output: AdCampaign
    side_effects: ["reserved=0, spent=0, available_budget_cents=budget_cents"]
  - method: GET
    path: "/ad-campaigns"
    description: "List campaigns; filter by advertiser_id"
    roles: [PlatformAdmin, Advertiser]
    code: 200
    input: ["advertiser_id?", "status?", "limit?", "offset?"]
    output: AdCampaign[]
    side_effects: []
  - method: GET
    path: "/ad-campaigns/{id}"
    description: "Get a campaign with computed budget ledger fields"
    roles: [PlatformAdmin, Advertiser]
    code: 200
    input: []
    output: AdCampaign
    side_effects: []
  - method: POST
    path: "/ad-campaigns/{id}/activate"
    description: "DRAFT/PAUSED → ACTIVE"
    roles: [Advertiser]
    code: 200
    input: []
    output: AdCampaign
    side_effects: []
  - method: POST
    path: "/ad-campaigns/{id}/pause"
    description: "ACTIVE → PAUSED; rejects PROPOSED placements (L1), releases their reserve"
    roles: [Advertiser]
    code: 200
    input: []
    output: AdCampaign
    side_effects: ["PROPOSED placements → REJECTED, reserves released"]
  - method: POST
    path: "/ad-campaigns/{id}/complete"
    description: "ACTIVE/EXHAUSTED → COMPLETED (no PROPOSED/INSERTED placements)"
    roles: [Advertiser]
    code: 200
    input: []
    output: AdCampaign
    side_effects: []

  # ---- AdPlacement --------------------------------------------------------
  - method: POST
    path: "/ad-placements"
    description: "Create a placement (status PROPOSED) reserving an estimated cost on the campaign; OCC-guarded by expected_campaign_version"
    roles: [Advertiser]
    code: 201
    input: [campaign_id, episode_id, position, "offset_ms?", ad_duration_ms, forecast_impressions, expected_campaign_version]
    output: AdPlacement
    side_effects:
      - "fill_tier_multiplier and estimated_cost_cents computed and frozen on the placement"
      - "campaign.reserved_budget_cents += estimated_cost_cents; available_budget_cents recomputed"
      - "increments AdCampaign.version by 1"
  - method: GET
    path: "/ad-placements"
    description: "List placements; filter by campaign_id and/or episode_id"
    roles: [PlatformAdmin, Advertiser, Publisher]
    code: 200
    input: ["campaign_id?", "episode_id?", "status?", "limit?", "offset?"]
    output: AdPlacement[]
    side_effects: []
  - method: GET
    path: "/ad-placements/{id}"
    description: "Get a placement with computed cost fields"
    roles: [PlatformAdmin, Advertiser, Publisher]
    code: 200
    input: []
    output: AdPlacement
    side_effects: []
  - method: POST
    path: "/ad-placements/{id}/insert"
    description: "PROPOSED → INSERTED (DAI); cross-entity gates + slot/budget/overlap checks; may auto-EXHAUST campaign"
    roles: [Advertiser]
    code: 200
    input: []
    output: AdPlacement
    side_effects: ["reserve confirmed, fill_rate recomputed, possible campaign EXHAUSTED cascade"]
  - method: POST
    path: "/ad-placements/{id}/reconcile"
    description: "INSERTED → DELIVERED; computes final_cost_cents from delivered_impressions, moves reserve→spent"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: AdPlacement
    side_effects: ["final_cost_cents computed, reserved→spent"]
  - method: POST
    path: "/ad-placements/{id}/cancel"
    description: "PROPOSED/INSERTED → CANCELLED; releases reserve, recomputes fill_rate"
    roles: [Advertiser]
    code: 200
    input: []
    output: AdPlacement
    side_effects: ["reserve released, fill_rate recomputed"]

  # ---- DownloadEvent (IAB analytics ingestion) ---------------------------
  - method: POST
    path: "/download-events"
    description: "Ingest an IAB download event; sets counted = (bytes_served >= IAB_MIN_BYTES); credits placement delivered_impressions when counted; private-feed access enforced"
    roles: [PlatformAdmin, Listener]
    code: 201
    input: [episode_id, "placement_id?", client_ip_hash, user_agent, bytes_served, event_at, "access_token?"]
    output: DownloadEvent
    side_effects: ["if counted and placement_id: AdPlacement.delivered_impressions += 1"]
  - method: GET
    path: "/download-events"
    description: "List download events; filter by episode_id and/or placement_id (IAB analytics)"
    roles: [PlatformAdmin, Publisher]
    code: 200
    input: ["episode_id?", "placement_id?", "counted?", "limit?", "offset?"]
    output: DownloadEvent[]
    side_effects: []
  - method: GET
    path: "/download-events/{id}"
    description: "Get a download event"
    roles: [PlatformAdmin, Publisher]
    code: 200
    input: []
    output: DownloadEvent
    side_effects: []

  # ---- PayoutStatement ----------------------------------------------------
  - method: POST
    path: "/payout-statements"
    description: "Create a DRAFT payout statement; computes gross/net/platform_fee/settled over the half-open window"
    roles: [PlatformAdmin]
    code: 201
    input: [publisher_id, period_start, period_end]
    output: PayoutStatement
    side_effects: ["gross_revenue_cents, net_payable_cents, platform_fee_cents, settled_revenue_cents computed"]
  - method: GET
    path: "/payout-statements"
    description: "List payout statements; filter by publisher_id"
    roles: [PlatformAdmin, Publisher]
    code: 200
    input: ["publisher_id?", "status?", "limit?", "offset?"]
    output: PayoutStatement[]
    side_effects: []
  - method: GET
    path: "/payout-statements/{id}"
    description: "Get a payout statement"
    roles: [PlatformAdmin, Publisher]
    code: 200
    input: []
    output: PayoutStatement
    side_effects: []
  - method: POST
    path: "/payout-statements/{id}/finalize"
    description: "DRAFT → FINALIZED; freezes the snapshot"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: PayoutStatement
    side_effects: []
  - method: POST
    path: "/payout-statements/{id}/pay"
    description: "FINALIZED → PAID (net_payable_cents > 0)"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: PayoutStatement
    side_effects: []
  - method: POST
    path: "/payout-statements/{id}/void"
    description: "DRAFT/FINALIZED → VOID"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: PayoutStatement
    side_effects: []

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/invalid auth headers" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted for this operation" }
  - { id: ERR_NOT_RESOURCE_OWNER, http: 403, condition: "entity_backed caller does not own the target resource" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path id or referenced FK id does not exist" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed body, missing required field, bad enum/type" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Transition not defined from the resource's current state" }
  - { id: ERR_POSITION_NOT_OFFERED, http: 422, condition: "Placement position not in episode.offered_positions" }
  - { id: ERR_TARGETING_MISMATCH, http: 422, condition: "Episode show category != campaign targeting_category" }
  - { id: ERR_MONETIZATION_DISABLED, http: 409, condition: "Show.monetization_enabled is false at insertion" }
  - { id: ERR_NO_PRIVATE_ACCESS, http: 403, condition: "Download on private-only show without an ACTIVE subscription access_token" }
  - { id: ERR_NO_PRIVATE_FEED, http: 409, condition: "Subscription show has no PRIVATE ENABLED feed" }
  - { id: ERR_MIDROLL_OVERLAP, http: 409, condition: "MID_ROLL interval (+buffer) overlaps an existing INSERTED/DELIVERED MID_ROLL" }
  - { id: ERR_SUBSCRIPTION_PERIOD_OVERLAP, http: 409, condition: "Subscription period overlaps another ACTIVE/PAST_DUE subscription for same listener+show" }
  - { id: ERR_NO_AVAILABLE_SLOT, http: 409, condition: "Episode.available_slots == 0 at insertion" }
  - { id: ERR_BUDGET_WOULD_EXCEED, http: 409, condition: "estimated_cost_cents > campaign.available_budget_cents" }
  - { id: ERR_SCHEDULE_IN_PAST, http: 422, condition: "scheduled_publish_at not strictly after the logical clock" }
  - { id: ERR_STALE_CAMPAIGN_VERSION, http: 412, condition: "expected_campaign_version != AdCampaign.version on placement create (OCC)" }
  - { id: ERR_CAMPAIGN_HAS_OPEN_PLACEMENTS, http: 409, condition: "Complete campaign while PROPOSED/INSERTED placements remain" }
  - { id: ERR_SHOW_HAS_PUBLISHED_EPISODES, http: 409, condition: "Archive an ACTIVE show that still has PUBLISHED episodes" }
  - { id: ERR_NOTHING_TO_PAY, http: 409, condition: "Pay a statement whose net_payable_cents == 0" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Publisher
    description: "Owns shows, episodes, media, feeds, distributions; reads own payouts"
    identity: "entity_backed:Publisher"
    exclusive_operations:
      - "POST /shows — create show"
      - "POST /shows/{id}/archive — archive own show"
      - "POST /episodes — create episode"
      - "POST /episodes/{id}/schedule|publish|unpublish — manage episode publish axis"
      - "DELETE /episodes/{id} — delete draft episode"
      - "POST /media-assets — upload media"
      - "POST /feeds — create feed"
      - "POST /feeds/{id}/disable|enable — manage feed"
      - "POST /distributions — submit distribution"
    shared_operations:
      - "POST /shows/{id}/activate — shared with PlatformAdmin"
      - "POST /distributions/{id}/remove — shared with PlatformAdmin"
      - "GET reads of own shows/episodes/feeds/distributions/payouts/placements"

  - name: Advertiser
    description: "Owns campaigns and placements"
    identity: "entity_backed:Advertiser"
    exclusive_operations:
      - "POST /ad-campaigns — create campaign"
      - "POST /ad-campaigns/{id}/activate|pause|complete — manage campaign"
      - "POST /ad-placements — create placement (OCC)"
      - "POST /ad-placements/{id}/insert — insert placement (DAI)"
      - "POST /ad-placements/{id}/cancel — cancel placement"
    shared_operations:
      - "GET reads of own campaigns/placements and episodes"

  - name: Listener
    description: "Owns subscriptions; downloads episodes"
    identity: "entity_backed:Listener"
    exclusive_operations:
      - "POST /subscriptions — create subscription"
      - "POST /subscriptions/{id}/activate|cancel — manage own subscription"
    shared_operations:
      - "POST /listeners — register self (shared with PlatformAdmin)"
      - "POST /download-events — ingest download (shared with PlatformAdmin)"
      - "GET reads of shows/episodes/feeds/own subscriptions"

  - name: PlatformAdmin
    description: "Operations: clock, transcoding, suspension, reconciliation, payouts, distribution approval, registrations"
    identity: "opaque"
    exclusive_operations:
      - "POST /_clock/set_current_utc — set logical clock"
      - "POST /publishers|/advertisers — register actors"
      - "POST /shows/{id}/suspend — suspend show (cascade)"
      - "POST /media-assets/{id}/transcode-start|transcode-result — drive transcoding"
      - "POST /ad-placements/{id}/reconcile — reconcile delivery"
      - "POST /subscriptions/{id}/mark-past-due — mark past due"
      - "POST /distributions/{id}/approve|reject — directory review"
      - "POST /payout-statements — create/finalize/pay/void payouts"
    shared_operations:
      - "POST /shows/{id}/activate — shared with Publisher"
      - "POST /distributions/{id}/remove — shared with Publisher"
      - "POST /listeners — shared with Listener"
      - "POST /download-events — shared with Listener"
      - "GET reads across resources"
