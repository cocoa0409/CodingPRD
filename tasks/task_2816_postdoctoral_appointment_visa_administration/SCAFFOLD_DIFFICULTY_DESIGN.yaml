        grounds:
          - calculations.export_control_risk_score
          - state_machines.ExportControlReview.QUEUED_to_CLEARED_WITH_CONDITIONS
          - entities.ExportControlReview.fields.risk_score
        distinguishing_aspect: |
          Metric: a 1-decimal weighted score against CONDITIONS_THRESHOLD (35.0).
          Endpoint: POST /export-control-reviews/{id}/decision — a different metric
          and a different endpoint from the integer month-cap instance. CA (0.5) at
          tier-1 weight 12.5 gives 6.25, controlled technology adds 18.75, and an
          EXTERNAL_FELLOWSHIP (1.6) adds exactly 10.00, summing to 35.00 -> 35.0,
          which is the outcome boundary itself: >= 35.0 is
          CLEARED_WITH_CONDITIONS, below it is CLEARED. The paired
          INSTITUTIONAL_FELLOWSHIP review holds every other input fixed, drops the
