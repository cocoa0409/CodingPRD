# =============================================================================
# §1.9 Scaffold Corner Design — Plumbing & PVF Wholesale
# Breadth probe: every testable claim of §1.1–§1.7 not already covered by §1.8.
# Instances marked excluded_because cite the covering §1.8 instance by name.
# =============================================================================
scaffold_corner_design:
  - section: entities
    instances:
      - name: product_create_returns_201_with_defaults_and_system_fields
        claim_type: creation
        grounds:
          - "entities.Product"
          - "endpoints[POST /pvf/products]"
        distinguishing_aspect: "Create succeeds with 201; optional booleans default false, promo null; system stamps id (uuid), created_at == logical clock default 2026-08-01T00:00:00Z, version == 1."
        test_recipe:
          setup: ["empty DB; logical clock untouched (default 2026-08-01T00:00:00Z)"]
          setup_api_calls:
            - { call: "POST /pvf/branches", payload: { name: "Main", code: "M1" }, as: BranchManager }
          trigger:
            - call: "POST /pvf/products"
              payload: { sku: "P1", description: "PVC pipe", category: "PIPE", list_price_cents: 10000, cost_cents: 5000, manufacturer_name: "Acme", cubes_per_unit: 10 }
              as: BranchManager
              captures: { v: $.data.version, cat: $.data.created_at, cut: $.data.is_cut_to_order, so: $.data.is_special_order, promo: $.data.promo_price_cents }
          assert:
            - "http 201; response envelope has meta.api_request_id and response_type == 'object'"
            - "version == 1; created_at == 2026-08-01T00:00:00Z (logical clock default, not wall clock)"
            - "is_cut_to_order == false, is_special_order == false, promo_price_cents == null (defaults applied)"

      - name: account_create_missing_tier_returns_400
        claim_type: required_fields
        grounds:
          - "entities.ContractorAccount"
          - "validations[priority=4]"
        distinguishing_aspect: "Omitting required pricing_tier is rejected ERR_INVALID_REQUEST 400; no account row created."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /pvf/contractor-accounts"
              payload: { company_name: "No Tier Co", terms: "NET_30", credit_limit_cents: 100000 }
              as: InsideSales
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REQUEST with http 400"

      - name: product_invalid_category_rejected
        claim_type: type_constraints
        grounds:
          - "entities.Product.fields.category"
          - "validations[priority=4]"
        distinguishing_aspect: "Enum closure: category 'HOSE' is outside {PIPE, VALVE, FITTING, FIXTURE} -> ERR_INVALID_REQUEST 400."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /pvf/products"
              payload: { sku: "H1", description: "Hose", category: "HOSE", list_price_cents: 100, cost_cents: 50, manufacturer_name: "Acme", cubes_per_unit: 1 }
              as: BranchManager
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REQUEST with http 400"

      - name: account_computed_fields_input_ignored
        claim_type: computed_fields
        grounds:
          - "entities.ContractorAccount.fields.outstanding_balance_cents"
        distinguishing_aspect: "Client-supplied computed fields (outstanding_balance_cents 999999) are ignored: the created account reports the computed value 0."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /pvf/contractor-accounts"
              payload: { company_name: "Sneaky Co", pricing_tier: "GOLD", terms: "NET_30", credit_limit_cents: 100000, outstanding_balance_cents: 999999 }
              as: InsideSales
              captures: { bal: $.data.outstanding_balance_cents }
          assert:
            - "http 201 and outstanding_balance_cents == 0 (computed, input ignored)"

      - name: branch_duplicate_code_rejected
        claim_type: type_constraints
        grounds:
          - "entities.Branch.fields.code"
          - "validations[priority=14]"
          - "errors[ERR_BRANCH_CODE_EXISTS]"
        distinguishing_aspect: "Branch.code uniqueness: second create with the same code -> ERR_BRANCH_CODE_EXISTS 409."
        test_recipe:
          setup: ["branch with code M1 exists"]
          setup_api_calls:
            - { call: "POST /pvf/branches", payload: { name: "Main", code: "M1" }, as: BranchManager }
          trigger:
            - call: "POST /pvf/branches"
              payload: { name: "Main Clone", code: "M1" }
              as: BranchManager
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_BRANCH_CODE_EXISTS with http 409"

      - name: order_get_nonexistent_returns_404
        claim_type: not_found
        grounds:
          - "validations[priority=5]"
          - "errors[ERR_ORDER_NOT_FOUND]"
        distinguishing_aspect: "GET on a well-formed but unknown order id -> ERR_ORDER_NOT_FOUND 404 with error envelope."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /pvf/orders/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: InsideSales
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_ORDER_NOT_FOUND with http 404"
            - "error envelope: response_type == 'error', data.error_id and data.message present"

      - name: branch_list_pagination_envelope
        claim_type: listing
        grounds:
          - "response_envelope"
          - "endpoints[GET /pvf/branches]"
        distinguishing_aspect: "Pagination contract: limit=2 over 3 rows returns 2 items, total_count 3, has_more true; offset=2 returns the last item with has_more false."
        test_recipe:
          setup: ["three branches B1, B2, B3 created in order"]
          setup_api_calls:
            - { call: "POST /pvf/branches", payload: { name: "B1", code: "B1" }, as: BranchManager }
            - { call: "POST /pvf/branches", payload: { name: "B2", code: "B2" }, as: BranchManager }
            - { call: "POST /pvf/branches", payload: { name: "B3", code: "B3" }, as: BranchManager }
          trigger:
            - { call: "GET /pvf/branches", payload: { limit: 2, offset: 0 }, as: CounterRep }
            - { call: "GET /pvf/branches", payload: { limit: 2, offset: 2 }, as: CounterRep }
          assert:
            - "page 1: data length == 2, total_count == 3, has_more == true, response_type == 'array'"
            - "page 2: data length == 1, total_count == 3, has_more == false"

      - name: order_create_unknown_account_returns_404
        claim_type: parent_relationships
        grounds:
          - "entities.Order.fields.account_id"
          - "validations[priority=6]"
          - "errors[ERR_ACCOUNT_NOT_FOUND]"
        distinguishing_aspect: "Body FK integrity: order create referencing a non-existent account_id -> ERR_ACCOUNT_NOT_FOUND 404 (existence of body references, priority 6)."
        test_recipe:
          setup: ["one branch exists"]
          setup_api_calls:
            - { call: "POST /pvf/branches", payload: { name: "Main", code: "M1" }, as: BranchManager, captures: { b: $.data.id } }
          trigger:
            - call: "POST /pvf/orders"
              payload: { account_id: "00000000-0000-0000-0000-000000000000", branch_id: "${b}" }
              as: CounterRep
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_ACCOUNT_NOT_FOUND with http 404"

      - name: stock_record_duplicate_rejected
        claim_type: type_constraints
        grounds:
          - "entities.InventoryStock"
          - "validations[priority=14]"
          - "errors[ERR_STOCK_RECORD_EXISTS]"
        distinguishing_aspect: "(branch_id, product_id) uniqueness on the stock record: second create for the same pair -> ERR_STOCK_RECORD_EXISTS 409."
        test_recipe:
          setup: ["branch, product, and an existing stock record for the pair"]
          setup_api_calls:
            - { call: "POST /pvf/branches", payload: { name: "Main", code: "M1" }, as: BranchManager, captures: { b: $.data.id } }
            - { call: "POST /pvf/products", payload: { sku: "P1", description: "PVC pipe", category: "PIPE", list_price_cents: 10000, cost_cents: 5000, manufacturer_name: "Acme", cubes_per_unit: 10 }, as: BranchManager, captures: { p1: $.data.id } }
            - { call: "POST /pvf/branches/${b}/inventory", payload: { product_id: "${p1}", initial_on_hand: 5 }, as: WarehouseLead }
          trigger:
            - call: "POST /pvf/branches/${b}/inventory"
              payload: { product_id: "${p1}", initial_on_hand: 3 }
              as: WarehouseLead
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_STOCK_RECORD_EXISTS with http 409; on_hand stays 5"

      - name: cut_length_validation_rejected_both_ways
        claim_type: type_constraints
        grounds:
          - "entities.OrderLine.fields.cut_length_ft"
          - "validations[priority=4]"
        distinguishing_aspect: "Conditional requiredness: cut product line WITHOUT cut_length_ft -> 400; non-cut product line WITH cut_length_ft -> 400."
        test_recipe:
          setup: ["branch; cut product PC (is_cut_to_order true, list 200/ft); plain product P1; GOLD account; DRAFT order"]
          setup_api_calls:
            - { call: "POST /pvf/branches", payload: { name: "Main", code: "M1" }, as: BranchManager, captures: { b: $.data.id } }
            - { call: "POST /pvf/products", payload: { sku: "PC", description: "Cut pipe", category: "PIPE", list_price_cents: 200, cost_cents: 100, manufacturer_name: "Acme", cubes_per_unit: 1, is_cut_to_order: true }, as: BranchManager, captures: { pc: $.data.id } }
            - { call: "POST /pvf/products", payload: { sku: "P1", description: "PVC pipe", category: "PIPE", list_price_cents: 10000, cost_cents: 5000, manufacturer_name: "Acme", cubes_per_unit: 10 }, as: BranchManager, captures: { p1: $.data.id } }
            - { call: "POST /pvf/contractor-accounts", payload: { company_name: "GC Corp", pricing_tier: "GOLD", terms: "NET_30", credit_limit_cents: 10000000 }, as: InsideSales, captures: { acct: $.data.id } }
            - { call: "POST /pvf/orders", payload: { account_id: "${acct}", branch_id: "${b}" }, as: CounterRep, captures: { ord: $.data.id } }
          trigger:
            - call: "POST /pvf/orders/${ord}/lines"
              payload: { product_id: "${pc}", qty: 2 }
              as: CounterRep
              captures: { err1: $.data.error_id }
            - call: "POST /pvf/orders/${ord}/lines"
              payload: { product_id: "${p1}", qty: 1, cut_length_ft: 3 }
              as: CounterRep
              captures: { err2: $.data.error_id }
          assert:
            - "cut product without cut_length_ft: ERR_INVALID_REQUEST 400"
            - "non-cut product with cut_length_ft: ERR_INVALID_REQUEST 400"

  - section: state_machines
    instances:
      - name: quote_initial_state_draft
        claim_type: initial_state
        grounds:
          - "state_machines.Quote"
        distinguishing_aspect: "A newly created quote starts in DRAFT with revision_no 1 and supersedes_quote_id null."
        test_recipe:
          setup: ["branch, product, GOLD account"]
          setup_api_calls:
            - { call: "POST /pvf/branches", payload: { name: "Main", code: "M1" }, as: BranchManager, captures: { b: $.data.id } }
            - { call: "POST /pvf/products", payload: { sku: "P1", description: "PVC pipe", category: "PIPE", list_price_cents: 10000, cost_cents: 5000, manufacturer_name: "Acme", cubes_per_unit: 10 }, as: BranchManager, captures: { p1: $.data.id } }
            - { call: "POST /pvf/contractor-accounts", payload: { company_name: "GC Corp", pricing_tier: "GOLD", terms: "NET_30", credit_limit_cents: 10000000 }, as: InsideSales, captures: { acct: $.data.id } }
          trigger:
            - call: "POST /pvf/quotes"
              payload: { account_id: "${acct}", branch_id: "${b}", job_name: "J", valid_until: "2026-09-01T00:00:00Z", lines: [ { product_id: "${p1}", qty: 1, unit_price_cents: 9000 } ] }
              as: InsideSales
              captures: { st: $.data.status, rn: $.data.revision_no, sup: $.data.supersedes_quote_id }
          assert:
            - "status == DRAFT, revision_no == 1, supersedes_quote_id == null"

      - name: award_draft_quote_rejected
        claim_type: invalid_transition
        grounds:
          - "state_machines.Quote.SUBMITTED_to_AWARDED"
        distinguishing_aspect: "Award is defined only from SUBMITTED; awarding a DRAFT quote -> ERR_INVALID_STATE 409, quote stays DRAFT."
        test_recipe:
          setup: ["quote created but never submitted"]
          setup_api_calls:
            - { call: "POST /pvf/branches", payload: { name: "Main", code: "M1" }, as: BranchManager, captures: { b: $.data.id } }
            - { call: "POST /pvf/products", payload: { sku: "P1", description: "PVC pipe", category: "PIPE", list_price_cents: 10000, cost_cents: 5000, manufacturer_name: "Acme", cubes_per_unit: 10 }, as: BranchManager, captures: { p1: $.data.id } }
            - { call: "POST /pvf/contractor-accounts", payload: { company_name: "GC Corp", pricing_tier: "GOLD", terms: "NET_30", credit_limit_cents: 10000000 }, as: InsideSales, captures: { acct: $.data.id } }
            - { call: "POST /pvf/quotes", payload: { account_id: "${acct}", branch_id: "${b}", job_name: "J", valid_until: "2026-09-01T00:00:00Z", lines: [ { product_id: "${p1}", qty: 1, unit_price_cents: 9000 } ] }, as: InsideSales, captures: { q: $.data.id } }
          trigger:
            - call: "POST /pvf/quotes/${q}/award"
              payload: {}
              as: Contractor
              as_user_id: "${acct}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE with http 409; quote remains DRAFT"

      - name: quote_expires_via_clock_sweep
        claim_type: valid_transition
        grounds:
          - "state_machines.Quote.SUBMITTED_to_EXPIRED"
          - "errors[ERR_QUOTE_EXPIRED]"
        distinguishing_aspect: "System transition: advancing the logical clock past valid_until flips a SUBMITTED quote to EXPIRED; a later award is rejected ERR_QUOTE_EXPIRED 409."
        test_recipe:
          setup: ["quote submitted with valid_until 2026-08-10T00:00:00Z"]
          setup_api_calls:
            - { call: "POST /pvf/branches", payload: { name: "Main", code: "M1" }, as: BranchManager, captures: { b: $.data.id } }
            - { call: "POST /pvf/products", payload: { sku: "P1", description: "PVC pipe", category: "PIPE", list_price_cents: 10000, cost_cents: 5000, manufacturer_name: "Acme", cubes_per_unit: 10 }, as: BranchManager, captures: { p1: $.data.id } }
            - { call: "POST /pvf/contractor-accounts", payload: { company_name: "GC Corp", pricing_tier: "GOLD", terms: "NET_30", credit_limit_cents: 10000000 }, as: InsideSales, captures: { acct: $.data.id } }
            - { call: "POST /pvf/quotes", payload: { account_id: "${acct}", branch_id: "${b}", job_name: "J", valid_until: "2026-08-10T00:00:00Z", lines: [ { product_id: "${p1}", qty: 1, unit_price_cents: 9000 } ] }, as: InsideSales, captures: { q: $.data.id } }
            - { call: "POST /pvf/quotes/${q}/submit", payload: {}, as: InsideSales }
          trigger:
            - { call: "POST /pvf/_clock/set_current_utc", payload: { to_iso8601: "2026-08-11T00:00:00Z" }, as: BranchManager }
            - { call: "GET /pvf/quotes/${q}", payload: {}, as: InsideSales, captures: { st: $.data.status } }
            - call: "POST /pvf/quotes/${q}/award"
              payload: {}
              as: Contractor
              as_user_id: "${acct}"
              captures: { err: $.data.error_id }
          assert:
            - "after the clock sweep: status == EXPIRED (no direct quote call caused it)"
            - "award after expiry: error_id == ERR_QUOTE_EXPIRED with http 409"

      - name: delivered_order_cannot_cancel
        claim_type: terminal_state_lockdown
        grounds:
          - "state_machines.Order"
        distinguishing_aspect: "DELIVERED is terminal for the fulfillment dimension: cancel -> ERR_INVALID_STATE 409; no reservation or balance changes."
        test_recipe:
          setup: ["GOLD account; P1 stock 2; non-will-call order delivered via slot booking path"]
          setup_api_calls:
            - { call: "POST /pvf/branches", payload: { name: "Main", code: "M1" }, as: BranchManager, captures: { b: $.data.id } }
            - { call: "POST /pvf/products", payload: { sku: "P1", description: "PVC pipe", category: "PIPE", list_price_cents: 10000, cost_cents: 5000, manufacturer_name: "Acme", cubes_per_unit: 10 }, as: BranchManager, captures: { p1: $.data.id } }
            - { call: "POST /pvf/contractor-accounts", payload: { company_name: "GC Corp", pricing_tier: "GOLD", terms: "NET_30", credit_limit_cents: 10000000 }, as: InsideSales, captures: { acct: $.data.id } }
            - { call: "POST /pvf/branches/${b}/inventory", payload: { product_id: "${p1}", initial_on_hand: 2 }, as: WarehouseLead }
            - { call: "POST /pvf/branches/${b}/delivery-slots", payload: { truck_label: "T1", window_start: "2026-08-02T08:00:00Z", window_end: "2026-08-02T12:00:00Z", capacity_cubes: 100 }, as: BranchManager, captures: { slot: $.data.id } }
            - { call: "POST /pvf/orders", payload: { account_id: "${acct}", branch_id: "${b}", will_call: false }, as: CounterRep, captures: { ord: $.data.id } }
            - { call: "POST /pvf/orders/${ord}/lines", payload: { product_id: "${p1}", qty: 2 }, as: CounterRep }
            - { call: "POST /pvf/orders/${ord}/submit", payload: {}, as: CounterRep, captures: { ov: $.data.version } }
            - { call: "POST /pvf/orders/${ord}/delivery-booking", payload: { slot_id: "${slot}", expected_order_version: "${ov}" }, as: CounterRep }
            - { call: "POST /pvf/orders/${ord}/mark-staged", payload: {}, as: WarehouseLead }
            - { call: "POST /pvf/orders/${ord}/dispatch", payload: {}, as: WarehouseLead }
            - { call: "POST /pvf/orders/${ord}/confirm-delivery", payload: {}, as: WarehouseLead, captures: { fst: $.data.fulfillment_status } }
          trigger:
            - call: "POST /pvf/orders/${ord}/cancel"
              payload: {}
              as: CounterRep
              captures: { err: $.data.error_id }
          assert:
            - "order reached DELIVERED (fulfillment_status == DELIVERED)"
            - "cancel: error_id == ERR_INVALID_STATE with http 409; order remains DELIVERED; balance unchanged"

      - name: lost_quote_cannot_convert
        claim_type: terminal_state_lockdown
        grounds:
          - "state_machines.Quote.SUBMITTED_to_LOST"
        distinguishing_aspect: "LOST is terminal: convert on a LOST quote -> ERR_INVALID_STATE 409."
        test_recipe:
          setup: ["quote submitted then marked lost"]
          setup_api_calls:
            - { call: "POST /pvf/branches", payload: { name: "Main", code: "M1" }, as: BranchManager, captures: { b: $.data.id } }
            - { call: "POST /pvf/products", payload: { sku: "P1", description: "PVC pipe", category: "PIPE", list_price_cents: 10000, cost_cents: 5000, manufacturer_name: "Acme", cubes_per_unit: 10 }, as: BranchManager, captures: { p1: $.data.id } }
            - { call: "POST /pvf/contractor-accounts", payload: { company_name: "GC Corp", pricing_tier: "GOLD", terms: "NET_30", credit_limit_cents: 10000000 }, as: InsideSales, captures: { acct: $.data.id } }
            - { call: "POST /pvf/quotes", payload: { account_id: "${acct}", branch_id: "${b}", job_name: "J", valid_until: "2026-09-01T00:00:00Z", lines: [ { product_id: "${p1}", qty: 1, unit_price_cents: 9000 } ] }, as: InsideSales, captures: { q: $.data.id } }
            - { call: "POST /pvf/quotes/${q}/submit", payload: {}, as: InsideSales }
            - { call: "POST /pvf/quotes/${q}/lose", payload: {}, as: InsideSales }
          trigger:
            - call: "POST /pvf/quotes/${q}/convert"
              payload: {}
              as: InsideSales
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE with http 409"

      - name: rejected_return_cannot_receive
        claim_type: terminal_state_lockdown
        grounds:
          - "state_machines.ReturnRequest.SUBMITTED_to_REJECTED"
        distinguishing_aspect: "REJECTED is terminal with NO side effects (divergent branch): receive -> ERR_INVALID_STATE 409; inventory and balance untouched."
        test_recipe:
          setup: ["picked-up order; return submitted by rep-1 and REJECTED by mgr-9"]
          setup_api_calls:
            - { call: "POST /pvf/branches", payload: { name: "Main", code: "M1" }, as: BranchManager, captures: { b: $.data.id } }
            - { call: "POST /pvf/products", payload: { sku: "P1", description: "PVC pipe", category: "PIPE", list_price_cents: 10000, cost_cents: 5000, manufacturer_name: "Acme", cubes_per_unit: 10 }, as: BranchManager, captures: { p1: $.data.id } }
            - { call: "POST /pvf/contractor-accounts", payload: { company_name: "GC Corp", pricing_tier: "GOLD", terms: "NET_30", credit_limit_cents: 10000000 }, as: InsideSales, captures: { acct: $.data.id } }
            - { call: "POST /pvf/branches/${b}/inventory", payload: { product_id: "${p1}", initial_on_hand: 2 }, as: WarehouseLead }
            - { call: "POST /pvf/orders", payload: { account_id: "${acct}", branch_id: "${b}", will_call: true }, as: CounterRep, captures: { ord: $.data.id } }
            - { call: "POST /pvf/orders/${ord}/lines", payload: { product_id: "${p1}", qty: 2 }, as: CounterRep, captures: { ln: $.data.id } }
            - { call: "POST /pvf/orders/${ord}/submit", payload: {}, as: CounterRep }
            - { call: "POST /pvf/orders/${ord}/mark-staged", payload: {}, as: WarehouseLead }
            - { call: "POST /pvf/orders/${ord}/pickup", payload: {}, as: CounterRep }
            - { call: "POST /pvf/returns", payload: { order_id: "${ord}", reason: "unwanted", lines: [ { order_line_id: "${ln}", qty: 1 } ] }, as: CounterRep, as_user_id: "rep-1", captures: { ret: $.data.id } }
            - { call: "POST /pvf/returns/${ret}/submit", payload: {}, as: CounterRep, as_user_id: "rep-1" }
            - { call: "POST /pvf/returns/${ret}/decision", payload: { decision: "REJECT" }, as: BranchManager, as_user_id: "mgr-9", captures: { rst: $.data.status } }
          trigger:
            - call: "POST /pvf/returns/${ret}/receive"
              payload: {}
              as: WarehouseLead
              captures: { err: $.data.error_id }
          assert:
            - "decision left status == REJECTED"
            - "receive: error_id == ERR_INVALID_STATE with http 409"
            - "InventoryStock on_hand still 0 (2 picked, no restock); account balance still 20500"

      - name: kit_unstage_rework_loop
        claim_type: valid_transition
        grounds:
          - "state_machines.Kit.STAGED_to_ASSEMBLED"
        distinguishing_aspect: "Cyclic rework: STAGED -> ASSEMBLED via unstage frees the bin; the same kit can then stage into a DIFFERENT bin."
        test_recipe:
          setup: ["will-call order, one line allocated, kit auto-ASSEMBLED, staged into bin B1"]
          setup_api_calls:
            - { call: "POST /pvf/branches", payload: { name: "Main", code: "M1" }, as: BranchManager, captures: { b: $.data.id } }
            - { call: "POST /pvf/products", payload: { sku: "P1", description: "PVC pipe", category: "PIPE", list_price_cents: 10000, cost_cents: 5000, manufacturer_name: "Acme", cubes_per_unit: 10 }, as: BranchManager, captures: { p1: $.data.id } }
            - { call: "POST /pvf/contractor-accounts", payload: { company_name: "GC Corp", pricing_tier: "GOLD", terms: "NET_30", credit_limit_cents: 10000000 }, as: InsideSales, captures: { acct: $.data.id } }
            - { call: "POST /pvf/branches/${b}/inventory", payload: { product_id: "${p1}", initial_on_hand: 5 }, as: WarehouseLead }
            - { call: "POST /pvf/orders", payload: { account_id: "${acct}", branch_id: "${b}", will_call: true }, as: CounterRep, captures: { ord: $.data.id } }
            - { call: "POST /pvf/orders/${ord}/lines", payload: { product_id: "${p1}", qty: 1 }, as: CounterRep, captures: { ln: $.data.id } }
            - { call: "POST /pvf/orders/${ord}/submit", payload: {}, as: CounterRep }
            - { call: "POST /pvf/orders/${ord}/kits", payload: { floor_label: "F1", order_line_ids: [ "${ln}" ] }, as: InsideSales, captures: { kit: $.data.id } }
            - { call: "POST /pvf/kits/${kit}/stage", payload: { staging_bin: "B1", window_start: "2026-08-02T08:00:00Z", window_end: "2026-08-02T10:00:00Z" }, as: WarehouseLead }
          trigger:
            - { call: "POST /pvf/kits/${kit}/unstage", payload: {}, as: WarehouseLead, captures: { st1: $.data.status, bin1: $.data.staging_bin } }
            - { call: "POST /pvf/kits/${kit}/stage", payload: { staging_bin: "B2", window_start: "2026-08-02T09:00:00Z", window_end: "2026-08-02T11:00:00Z" }, as: WarehouseLead, captures: { st2: $.data.status, bin2: $.data.staging_bin } }
          assert:
            - "after unstage: status == ASSEMBLED, staging_bin == null (bin freed)"
            - "re-stage into B2 SUCCEEDS even overlapping the old B1 window (occupancy was released)"
            - "final: status == STAGED, staging_bin == B2"

      - name: sheet_revision_cycle_full_loop
        claim_type: valid_transition
        grounds:
          - "state_machines.SelectionSheet"
        distinguishing_aspect: "Cyclic loop DRAFT -> PRESENTED -> APPROVED -> REVISED -> PRESENTED -> APPROVED: revise replaces selections and clears approved_at; re-present + re-approve restores APPROVED with a fresh approved_at."
        test_recipe:
          setup: ["account; fixture PF; sheet with selections [PF chrome x1]"]
          setup_api_calls:
            - { call: "POST /pvf/branches", payload: { name: "Main", code: "M1" }, as: BranchManager, captures: { b: $.data.id } }
            - { call: "POST /pvf/products", payload: { sku: "PF", description: "Tub", category: "FIXTURE", list_price_cents: 70000, cost_cents: 40000, manufacturer_name: "BathCo", cubes_per_unit: 30, is_special_order: true }, as: BranchManager, captures: { pf: $.data.id } }
            - { call: "POST /pvf/products", payload: { sku: "PF2", description: "Faucet", category: "FIXTURE", list_price_cents: 15000, cost_cents: 8000, manufacturer_name: "BathCo", cubes_per_unit: 5 }, as: BranchManager, captures: { pf2: $.data.id } }
            - { call: "POST /pvf/contractor-accounts", payload: { company_name: "GC Corp", pricing_tier: "GOLD", terms: "NET_30", credit_limit_cents: 10000000 }, as: InsideSales, captures: { acct: $.data.id } }
            - { call: "POST /pvf/selection-sheets", payload: { account_id: "${acct}", branch_id: "${b}", customer_name: "H", selections: [ { product_id: "${pf}", finish: "chrome", qty: 1 } ] }, as: InsideSales, captures: { sheet: $.data.id } }
            - { call: "POST /pvf/selection-sheets/${sheet}/present", payload: {}, as: InsideSales }
            - { call: "POST /pvf/selection-sheets/${sheet}/approve", payload: {}, as: Contractor, as_user_id: "${acct}" }
          trigger:
            - { call: "POST /pvf/selection-sheets/${sheet}/revise", payload: { selections: [ { product_id: "${pf2}", finish: "nickel", qty: 2 } ] }, as: InsideSales, captures: { st1: $.data.status, ap1: $.data.approved_at } }
            - { call: "POST /pvf/selection-sheets/${sheet}/present", payload: {}, as: InsideSales }
            - { call: "POST /pvf/selection-sheets/${sheet}/approve", payload: {}, as: Contractor, as_user_id: "${acct}", captures: { st2: $.data.status, ap2: $.data.approved_at } }
          assert:
            - "revise: status == REVISED, approved_at == null, selections replaced (PF2 nickel x2)"
            - "second loop lands on APPROVED with approved_at re-stamped"

      - name: program_settle_before_close_rejected
        claim_type: invalid_transition
        grounds:
          - "state_machines.ManufacturerProgram.CLOSED_to_SETTLED"
        distinguishing_aspect: "Settle is defined only from CLOSED; settling an ACTIVE program -> ERR_INVALID_STATE 409."
        test_recipe:
          setup: ["ACTIVE program"]
          setup_api_calls:
            - { call: "POST /pvf/manufacturer-programs", payload: { manufacturer_name: "Acme", period_start: "2026-01-01T00:00:00Z", period_end: "2026-06-30T00:00:00Z", tiers: [ { threshold_cents: 100000, rebate_pct: 1 } ], committed_stock_value_cents: 0 }, as: BranchManager, captures: { prog: $.data.id } }
          trigger:
            - call: "POST /pvf/manufacturer-programs/${prog}/settle"
              payload: {}
              as: BranchManager
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE with http 409; program stays ACTIVE"

      - name: dispatch_without_booking_rejected
        claim_type: precondition_enforcement
        grounds:
          - "state_machines.Order.STAGED_to_DISPATCHED"
        distinguishing_aspect: "Guarded transition: dispatch requires an active delivery booking (delivery_slot_id != null); STAGED order without booking -> ERR_INVALID_STATE 409."
        test_recipe:
          setup: ["non-will-call order staged without any delivery booking"]
          setup_api_calls:
            - { call: "POST /pvf/branches", payload: { name: "Main", code: "M1" }, as: BranchManager, captures: { b: $.data.id } }
            - { call: "POST /pvf/products", payload: { sku: "P1", description: "PVC pipe", category: "PIPE", list_price_cents: 10000, cost_cents: 5000, manufacturer_name: "Acme", cubes_per_unit: 10 }, as: BranchManager, captures: { p1: $.data.id } }
            - { call: "POST /pvf/contractor-accounts", payload: { company_name: "GC Corp", pricing_tier: "GOLD", terms: "NET_30", credit_limit_cents: 10000000 }, as: InsideSales, captures: { acct: $.data.id } }
            - { call: "POST /pvf/branches/${b}/inventory", payload: { product_id: "${p1}", initial_on_hand: 2 }, as: WarehouseLead }
            - { call: "POST /pvf/orders", payload: { account_id: "${acct}", branch_id: "${b}", will_call: false }, as: CounterRep, captures: { ord: $.data.id } }
            - { call: "POST /pvf/orders/${ord}/lines", payload: { product_id: "${p1}", qty: 1 }, as: CounterRep }
            - { call: "POST /pvf/orders/${ord}/submit", payload: {}, as: CounterRep }
            - { call: "POST /pvf/orders/${ord}/mark-staged", payload: {}, as: WarehouseLead }
          trigger:
            - call: "POST /pvf/orders/${ord}/dispatch"
              payload: {}
              as: WarehouseLead
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE with http 409 (no active booking); order stays STAGED"

      - name: pickup_non_willcall_rejected
        claim_type: precondition_enforcement
        grounds:
          - "state_machines.Order.STAGED_to_PICKED_UP"
        distinguishing_aspect: "Guarded transition on the will_call flag: pickup on a delivery-routed order -> ERR_INVALID_STATE 409."
        test_recipe:
          setup: ["non-will-call order staged"]
          setup_api_calls:
            - { call: "POST /pvf/branches", payload: { name: "Main", code: "M1" }, as: BranchManager, captures: { b: $.data.id } }
            - { call: "POST /pvf/products", payload: { sku: "P1", description: "PVC pipe", category: "PIPE", list_price_cents: 10000, cost_cents: 5000, manufacturer_name: "Acme", cubes_per_unit: 10 }, as: BranchManager, captures: { p1: $.data.id } }
            - { call: "POST /pvf/contractor-accounts", payload: { company_name: "GC Corp", pricing_tier: "GOLD", terms: "NET_30", credit_limit_cents: 10000000 }, as: InsideSales, captures: { acct: $.data.id } }
            - { call: "POST /pvf/branches/${b}/inventory", payload: { product_id: "${p1}", initial_on_hand: 2 }, as: WarehouseLead }
            - { call: "POST /pvf/orders", payload: { account_id: "${acct}", branch_id: "${b}", will_call: false }, as: CounterRep, captures: { ord: $.data.id } }
            - { call: "POST /pvf/orders/${ord}/lines", payload: { product_id: "${p1}", qty: 1 }, as: CounterRep }
            - { call: "POST /pvf/orders/${ord}/submit", payload: {}, as: CounterRep }
            - { call: "POST /pvf/orders/${ord}/mark-staged", payload: {}, as: WarehouseLead }
          trigger:
            - call: "POST /pvf/orders/${ord}/pickup"
              payload: {}
              as: CounterRep
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE with http 409; fulfillment stays STAGED; payment stays UNINVOICED"

      - name: mark_staged_blocked_until_kits_staged
        claim_type: precondition_enforcement
        grounds:
          - "state_machines.Order.PICKING_to_STAGED"
          - "state_machines.Kit.ASSEMBLED_to_STAGED"
        distinguishing_aspect: "Cross-entity gate inside one aggregate: a will-call order with kits cannot mark-staged while any kit is merely ASSEMBLED; after staging the kit, mark-staged succeeds."
        test_recipe:
          setup: ["will-call order, line allocated, kit over the line auto-ASSEMBLED but not staged"]
          setup_api_calls:
            - { call: "POST /pvf/branches", payload: { name: "Main", code: "M1" }, as: BranchManager, captures: { b: $.data.id } }
            - { call: "POST /pvf/products", payload: { sku: "P1", description: "PVC pipe", category: "PIPE", list_price_cents: 10000, cost_cents: 5000, manufacturer_name: "Acme", cubes_per_unit: 10 }, as: BranchManager, captures: { p1: $.data.id } }
            - { call: "POST /pvf/contractor-accounts", payload: { company_name: "GC Corp", pricing_tier: "GOLD", terms: "NET_30", credit_limit_cents: 10000000 }, as: InsideSales, captures: { acct: $.data.id } }
            - { call: "POST /pvf/branches/${b}/inventory", payload: { product_id: "${p1}", initial_on_hand: 5 }, as: WarehouseLead }
            - { call: "POST /pvf/orders", payload: { account_id: "${acct}", branch_id: "${b}", will_call: true }, as: CounterRep, captures: { ord: $.data.id } }
            - { call: "POST /pvf/orders/${ord}/lines", payload: { product_id: "${p1}", qty: 1 }, as: CounterRep, captures: { ln: $.data.id } }
            - { call: "POST /pvf/orders/${ord}/submit", payload: {}, as: CounterRep }
            - { call: "POST /pvf/orders/${ord}/kits", payload: { floor_label: "F1", order_line_ids: [ "${ln}" ] }, as: InsideSales, captures: { kit: $.data.id } }
          trigger:
            - call: "POST /pvf/orders/${ord}/mark-staged"
              payload: {}
              as: WarehouseLead
              captures: { err: $.data.error_id }
            - { call: "POST /pvf/kits/${kit}/stage", payload: { staging_bin: "B1", window_start: "2026-08-02T08:00:00Z", window_end: "2026-08-02T10:00:00Z" }, as: WarehouseLead }
            - call: "POST /pvf/orders/${ord}/mark-staged"
              payload: {}
              as: WarehouseLead
              captures: { fst: $.data.fulfillment_status }
            - { call: "POST /pvf/orders/${ord}/pickup", payload: {}, as: CounterRep, captures: { fst2: $.data.fulfillment_status } }
            - { call: "GET /pvf/kits/${kit}", payload: {}, as: WarehouseLead, captures: { kst: $.data.status } }
          assert:
            - "first mark-staged: error_id == ERR_INVALID_STATE with http 409 (kit not STAGED)"
            - "after kit staged: mark-staged succeeds, fulfillment_status == STAGED"
            - "after pickup: fulfillment_status == PICKED_UP and the kit cascade lands on RELEASED (terminal)"

      - name: slot_completed_by_clock_then_booking_rejected
        claim_type: valid_transition
        grounds:
          - "state_machines.DeliverySlot.OPEN_to_COMPLETED"
        distinguishing_aspect: "System transition: clock advance past window_end completes the slot; booking a COMPLETED slot then fails the state check with ERR_INVALID_STATE (not the temporal error, since the sweep already ran)."
        test_recipe:
          setup: ["slot 2026-08-02 08:00-12:00; clock advanced to 2026-08-03; submitted order with version captured"]
          setup_api_calls:
            - { call: "POST /pvf/branches", payload: { name: "Main", code: "M1" }, as: BranchManager, captures: { b: $.data.id } }
            - { call: "POST /pvf/products", payload: { sku: "P1", description: "PVC pipe", category: "PIPE", list_price_cents: 10000, cost_cents: 5000, manufacturer_name: "Acme", cubes_per_unit: 10 }, as: BranchManager, captures: { p1: $.data.id } }
            - { call: "POST /pvf/contractor-accounts", payload: { company_name: "GC Corp", pricing_tier: "GOLD", terms: "NET_30", credit_limit_cents: 10000000 }, as: InsideSales, captures: { acct: $.data.id } }
            - { call: "POST /pvf/branches/${b}/inventory", payload: { product_id: "${p1}", initial_on_hand: 5 }, as: WarehouseLead }
            - { call: "POST /pvf/branches/${b}/delivery-slots", payload: { truck_label: "T1", window_start: "2026-08-02T08:00:00Z", window_end: "2026-08-02T12:00:00Z", capacity_cubes: 100 }, as: BranchManager, captures: { slot: $.data.id } }
            - { call: "POST /pvf/orders", payload: { account_id: "${acct}", branch_id: "${b}" }, as: CounterRep, captures: { ord: $.data.id } }
            - { call: "POST /pvf/orders/${ord}/lines", payload: { product_id: "${p1}", qty: 1 }, as: CounterRep }
            - { call: "POST /pvf/orders/${ord}/submit", payload: {}, as: CounterRep, captures: { ov: $.data.version } }
            - { call: "POST /pvf/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T00:00:00Z" }, as: BranchManager }
          trigger:
            - { call: "GET /pvf/delivery-slots/${slot}", payload: {}, as: InsideSales, captures: { sst: $.data.status } }
            - call: "POST /pvf/orders/${ord}/delivery-booking"
              payload: { slot_id: "${slot}", expected_order_version: "${ov}" }
              as: CounterRep
              captures: { err: $.data.error_id }
          assert:
            - "slot.status == COMPLETED after the clock sweep"
            - "booking: error_id == ERR_INVALID_STATE with http 409"

      - name: order_double_submit_rejected
        claim_type: idempotency
        grounds:
          - "state_machines.Order.DRAFT_to_OPEN"
        excluded_because:
          difficulty_instance: state_beats_fiscal_on_double_submit
          rationale: "The second-submit rejection (ERR_INVALID_STATE) is asserted there as the winning branch of the state-vs-fiscal priority conflict."

      - name: kit_auto_assembly_bubble_up
        claim_type: side_effect_execution
        grounds:
          - "state_machines.Kit.DRAFT_to_ASSEMBLED"
        excluded_because:
          difficulty_instance: receipt_stocks_backorder_line_then_waves_order
          rationale: "The DRAFT -> ASSEMBLED bubble-up on allocation is asserted there as link 4 of the receipt cascade."

  - section: calculations
    instances:
      - name: job_cost_excludes_cancelled_orders
        claim_type: input_set_filtering
        grounds:
          - "calculations.job_cost_report"
        distinguishing_aspect: "Input-set filter: orders with fulfillment_status == CANCELLED are excluded entirely (order_count 1, not 2) even though they share the job_name."
        test_recipe:
          setup:
            - "GOLD account; P1 stock 10; JOB-X has order1 (P1 x2 = 18000, submitted) and order2 (P1 x3, CANCELLED while DRAFT)"
          setup_api_calls:
            - { call: "POST /pvf/branches", payload: { name: "Main", code: "M1" }, as: BranchManager, captures: { b: $.data.id } }
            - { call: "POST /pvf/products", payload: { sku: "P1", description: "PVC pipe", category: "PIPE", list_price_cents: 10000, cost_cents: 5000, manufacturer_name: "Acme", cubes_per_unit: 10 }, as: BranchManager, captures: { p1: $.data.id } }
            - { call: "POST /pvf/contractor-accounts", payload: { company_name: "GC Corp", pricing_tier: "GOLD", terms: "NET_30", credit_limit_cents: 10000000 }, as: InsideSales, captures: { acct: $.data.id } }
            - { call: "POST /pvf/branches/${b}/inventory", payload: { product_id: "${p1}", initial_on_hand: 10 }, as: WarehouseLead }
            - { call: "POST /pvf/orders", payload: { account_id: "${acct}", branch_id: "${b}", job_name: "JOB-X" }, as: CounterRep, captures: { o1: $.data.id } }
            - { call: "POST /pvf/orders/${o1}/lines", payload: { product_id: "${p1}", qty: 2 }, as: CounterRep }
            - { call: "POST /pvf/orders/${o1}/submit", payload: {}, as: CounterRep }
            - { call: "POST /pvf/orders", payload: { account_id: "${acct}", branch_id: "${b}", job_name: "JOB-X" }, as: CounterRep, captures: { o2: $.data.id } }
            - { call: "POST /pvf/orders/${o2}/lines", payload: { product_id: "${p1}", qty: 3 }, as: CounterRep }
            - { call: "POST /pvf/orders/${o2}/cancel", payload: {}, as: CounterRep }
          trigger:
            - call: "GET /pvf/contractor-accounts/${acct}/job-costing"
              payload: { job_name: "JOB-X" }
              as: InsideSales
              captures: { prov: $.data.provisional_cost_cents, oc: $.data.order_count, lc: $.data.line_count }
          assert:
            - "provisional_cost_cents == 18000 (order2's 27000 excluded)"
            - "order_count == 1 and line_count == 1"

      - name: backorder_fifo_oldest_line_first
        claim_type: correct_result
        grounds:
          - "calculations.backorder_allocation"
        distinguishing_aspect: "Waterfall order: competing BACKORDERED lines are filled by line.created_at ASC (never id); a 5-unit receipt fully fills the older line and gives the newer line nothing."
        test_recipe:
          setup:
            - "P1 stock 0; order1 line (created first) qty 5 -> BACKORDERED; order2 line (created second) qty 5 -> BACKORDERED"
            - "GOLD account, high limit; both orders submitted"
          setup_api_calls:
            - { call: "POST /pvf/branches", payload: { name: "Main", code: "M1" }, as: BranchManager, captures: { b: $.data.id } }
            - { call: "POST /pvf/products", payload: { sku: "P1", description: "PVC pipe", category: "PIPE", list_price_cents: 10000, cost_cents: 5000, manufacturer_name: "Acme", cubes_per_unit: 10 }, as: BranchManager, captures: { p1: $.data.id } }
            - { call: "POST /pvf/contractor-accounts", payload: { company_name: "GC Corp", pricing_tier: "GOLD", terms: "NET_30", credit_limit_cents: 100000000 }, as: InsideSales, captures: { acct: $.data.id } }
            - { call: "POST /pvf/branches/${b}/inventory", payload: { product_id: "${p1}", initial_on_hand: 0 }, as: WarehouseLead }
            - { call: "POST /pvf/orders", payload: { account_id: "${acct}", branch_id: "${b}" }, as: CounterRep, captures: { o1: $.data.id } }
            - { call: "POST /pvf/orders/${o1}/lines", payload: { product_id: "${p1}", qty: 5 }, as: CounterRep, captures: { l1: $.data.id } }
            - { call: "POST /pvf/orders", payload: { account_id: "${acct}", branch_id: "${b}" }, as: CounterRep, captures: { o2: $.data.id } }
            - { call: "POST /pvf/orders/${o2}/lines", payload: { product_id: "${p1}", qty: 5 }, as: CounterRep, captures: { l2: $.data.id } }
            - { call: "POST /pvf/orders/${o1}/submit", payload: {}, as: CounterRep }
            - { call: "POST /pvf/orders/${o2}/submit", payload: {}, as: CounterRep }
          trigger:
            - { call: "POST /pvf/branches/${b}/stock-receipts", payload: { lines: [ { product_id: "${p1}", qty: 5, unit_cost_cents: 5000 } ] }, as: WarehouseLead }
            - { call: "GET /pvf/orders/${o1}", payload: {}, as: InsideSales, captures: { f1: $.data.fulfillment_status } }
            - { call: "GET /pvf/orders/${o2}", payload: {}, as: InsideSales, captures: { f2: $.data.fulfillment_status } }
          assert:
            - "OrderLine.${l1}: status ALLOCATED, qty_allocated == 5 (oldest created_at wins the whole receipt)"
            - "OrderLine.${l2}: status BACKORDERED, qty_allocated == 0"
            - "order1 fulfillment == PICKING; order2 stays OPEN"

      - name: freight_tier_boundary_49999_vs_50000
        claim_type: correct_result
        grounds:
          - "calculations.document_totals"
        distinguishing_aspect: "Freight threshold precision: post-discount 49999 incurs FLAT_FREIGHT_CENTS 2500; exactly 50000 ships free (>= boundary)."
        test_recipe:
          setup: ["STANDARD account (no discount); product PA list 49999, product PB list 50000; stock both"]
          setup_api_calls:
            - { call: "POST /pvf/branches", payload: { name: "Main", code: "M1" }, as: BranchManager, captures: { b: $.data.id } }
            - { call: "POST /pvf/products", payload: { sku: "PA", description: "A", category: "FITTING", list_price_cents: 49999, cost_cents: 1000, manufacturer_name: "Acme", cubes_per_unit: 1 }, as: BranchManager, captures: { pa: $.data.id } }
            - { call: "POST /pvf/products", payload: { sku: "PB", description: "B", category: "FITTING", list_price_cents: 50000, cost_cents: 1000, manufacturer_name: "Acme", cubes_per_unit: 1 }, as: BranchManager, captures: { pb: $.data.id } }
            - { call: "POST /pvf/contractor-accounts", payload: { company_name: "Std Co", pricing_tier: "STANDARD", terms: "COD", credit_limit_cents: 10000000 }, as: InsideSales, captures: { acct: $.data.id } }
            - { call: "POST /pvf/orders", payload: { account_id: "${acct}", branch_id: "${b}" }, as: CounterRep, captures: { oA: $.data.id } }
            - { call: "POST /pvf/orders/${oA}/lines", payload: { product_id: "${pa}", qty: 1 }, as: CounterRep }
            - { call: "POST /pvf/orders", payload: { account_id: "${acct}", branch_id: "${b}" }, as: CounterRep, captures: { oB: $.data.id } }
            - { call: "POST /pvf/orders/${oB}/lines", payload: { product_id: "${pb}" , qty: 1 }, as: CounterRep }
          trigger:
            - { call: "GET /pvf/orders/${oA}", payload: {}, as: InsideSales, captures: { fA: $.data.freight_cents, tA: $.data.total_cents } }
            - { call: "GET /pvf/orders/${oB}", payload: {}, as: InsideSales, captures: { fB: $.data.freight_cents, tB: $.data.total_cents } }
          assert:
            - "order A (subtotal 49999): freight_cents == 2500, total_cents == 52499"
            - "order B (subtotal 50000): freight_cents == 0, total_cents == 50000"

      - name: volume_tier_top_band_5pct
        claim_type: constants_applied
        grounds:
          - "calculations.document_totals"
        distinguishing_aspect: "Top volume band: subtotal 2500000 >= 2000000 selects the 5% tier (not the 2% middle band); discount 125000, total 2375000."
        test_recipe:
          setup: ["GOLD account; P1 exists; quote with one line P1 x250 @ 10000"]
          setup_api_calls:
            - { call: "POST /pvf/branches", payload: { name: "Main", code: "M1" }, as: BranchManager, captures: { b: $.data.id } }
            - { call: "POST /pvf/products", payload: { sku: "P1", description: "PVC pipe", category: "PIPE", list_price_cents: 10000, cost_cents: 5000, manufacturer_name: "Acme", cubes_per_unit: 10 }, as: BranchManager, captures: { p1: $.data.id } }
            - { call: "POST /pvf/contractor-accounts", payload: { company_name: "GC Corp", pricing_tier: "GOLD", terms: "NET_30", credit_limit_cents: 100000000 }, as: InsideSales, captures: { acct: $.data.id } }
          trigger:
            - call: "POST /pvf/quotes"
              payload: { account_id: "${acct}", branch_id: "${b}", job_name: "BIG", valid_until: "2026-12-31T00:00:00Z", lines: [ { product_id: "${p1}", qty: 250, unit_price_cents: 10000 } ] }
              as: InsideSales
              captures: { pct: $.data.volume_discount_pct, disc: $.data.discount_cents, tot: $.data.total_cents }
          assert:
            - "volume_discount_pct == 5"
            - "discount_cents == 125000 (round_half_up(2500000 * 5 / 100))"
            - "total_cents == 2375000 (freight 0)"

      - name: cut_item_line_extension_per_foot
        claim_type: correct_result
        grounds:
          - "calculations.document_totals"
          - "entities.OrderLine.fields.cut_length_ft"
        distinguishing_aspect: "Cut-item extension: qty x cut_length_ft x per-foot unit price = 2 x 3 x 180 = 1080 (GOLD tier applied to the 200/ft list); the plain qty x price reading would give 360."
        test_recipe:
          setup: ["GOLD account; cut product PC list 200/ft cost 100 is_cut_to_order; stock 20; DRAFT counter order"]
          setup_api_calls:
            - { call: "POST /pvf/branches", payload: { name: "Main", code: "M1" }, as: BranchManager, captures: { b: $.data.id } }
            - { call: "POST /pvf/products", payload: { sku: "PC", description: "Cut pipe", category: "PIPE", list_price_cents: 200, cost_cents: 100, manufacturer_name: "Acme", cubes_per_unit: 1, is_cut_to_order: true }, as: BranchManager, captures: { pc: $.data.id } }
            - { call: "POST /pvf/contractor-accounts", payload: { company_name: "GC Corp", pricing_tier: "GOLD", terms: "NET_30", credit_limit_cents: 10000000 }, as: InsideSales, captures: { acct: $.data.id } }
            - { call: "POST /pvf/branches/${b}/inventory", payload: { product_id: "${pc}", initial_on_hand: 20 }, as: WarehouseLead }
            - { call: "POST /pvf/orders", payload: { account_id: "${acct}", branch_id: "${b}" }, as: CounterRep, captures: { ord: $.data.id } }
          trigger:
            - call: "POST /pvf/orders/${ord}/lines"
              payload: { product_id: "${pc}", qty: 2, cut_length_ft: 3 }
              as: CounterRep
              captures: { up: $.data.unit_price_cents, lt: $.data.line_total_cents }
            - { call: "GET /pvf/orders/${ord}", payload: {}, as: InsideSales, captures: { tot: $.data.total_cents } }
          assert:
            - "unit_price_cents == 180 (200 less 10% GOLD)"
            - "line_total_cents == 1080 (2 cuts x 3 ft x 180)"
            - "order total_cents == 3580 (1080 + 2500 freight, subtotal < 50000)"

      - name: payment_fifo_auto_allocation_oldest_invoice_first
        claim_type: correct_result
        grounds:
          - "calculations.payment_auto_allocation"
        distinguishing_aspect: "Chronological waterfall: an unallocated 40000 payment fills the oldest-invoiced order to full (PAID) and spills only the remainder 1500 to the newer one (stays INVOICED); balance drops by the payment amount exactly once."
        test_recipe:
          setup:
            - "GOLD account; P1 stock 20"
            - "Order A P1 x4 = 38500 picked up first (oldest invoiced_at); order B P1 x2 = 20500 picked up second"
            - "balance after both pickups: 59000"
          setup_api_calls:
            - { call: "POST /pvf/branches", payload: { name: "Main", code: "M1" }, as: BranchManager, captures: { b: $.data.id } }
            - { call: "POST /pvf/products", payload: { sku: "P1", description: "PVC pipe", category: "PIPE", list_price_cents: 10000, cost_cents: 5000, manufacturer_name: "Acme", cubes_per_unit: 10 }, as: BranchManager, captures: { p1: $.data.id } }
            - { call: "POST /pvf/contractor-accounts", payload: { company_name: "GC Corp", pricing_tier: "GOLD", terms: "NET_30", credit_limit_cents: 10000000 }, as: InsideSales, captures: { acct: $.data.id } }
            - { call: "POST /pvf/branches/${b}/inventory", payload: { product_id: "${p1}", initial_on_hand: 20 }, as: WarehouseLead }
            - { call: "POST /pvf/orders", payload: { account_id: "${acct}", branch_id: "${b}", will_call: true }, as: CounterRep, captures: { oA: $.data.id } }
            - { call: "POST /pvf/orders/${oA}/lines", payload: { product_id: "${p1}", qty: 4 }, as: CounterRep }
            - { call: "POST /pvf/orders/${oA}/submit", payload: {}, as: CounterRep }
            - { call: "POST /pvf/orders/${oA}/mark-staged", payload: {}, as: WarehouseLead }
            - { call: "POST /pvf/orders/${oA}/pickup", payload: {}, as: CounterRep }
            - { call: "POST /pvf/orders", payload: { account_id: "${acct}", branch_id: "${b}", will_call: true }, as: CounterRep, captures: { oB: $.data.id } }
            - { call: "POST /pvf/orders/${oB}/lines", payload: { product_id: "${p1}", qty: 2 }, as: CounterRep }
            - { call: "POST /pvf/orders/${oB}/submit", payload: {}, as: CounterRep }
            - { call: "POST /pvf/orders/${oB}/mark-staged", payload: {}, as: WarehouseLead }
            - { call: "POST /pvf/orders/${oB}/pickup", payload: {}, as: CounterRep }
          trigger:
            - { call: "POST /pvf/contractor-accounts/${acct}/payments", payload: { amount_cents: 40000, method: "ACH" }, as: CounterRep }
            - { call: "GET /pvf/orders/${oA}", payload: {}, as: InsideSales, captures: { paA: $.data.payment_status } }
            - { call: "GET /pvf/orders/${oB}", payload: {}, as: InsideSales, captures: { paB: $.data.payment_status } }
            - { call: "GET /pvf/contractor-accounts/${acct}", payload: {}, as: InsideSales, captures: { bal: $.data.outstanding_balance_cents } }
          assert:
            - "order A payment_status == PAID (fully covered: 38500 of 40000)"
            - "order B payment_status == INVOICED (only 1500 spilled over; 19000 still owed)"
            - "outstanding_balance_cents == 19000 (59000 - 40000)"

      - name: job_cost_final_nets_credited_returns
        claim_type: reconciliation
        grounds:
          - "calculations.job_cost_report"
          - "calculations.restocking_fee"
        distinguishing_aspect: "After a CREDITED return of 1 unit: final drops by the GROSS line value 9000 (fee stays with the branch), while provisional still counts the full 36000 — reconciliation pins the delta."
        test_recipe:
          setup:
            - "GOLD account; P1 stock 4; JOB-R order P1 x4 (36000) picked up; return qty 1 submitted within 30 days (fee 10% = 900, credit 8100), approved and received"
          setup_api_calls:
            - { call: "POST /pvf/branches", payload: { name: "Main", code: "M1" }, as: BranchManager, captures: { b: $.data.id } }
            - { call: "POST /pvf/products", payload: { sku: "P1", description: "PVC pipe", category: "PIPE", list_price_cents: 10000, cost_cents: 5000, manufacturer_name: "Acme", cubes_per_unit: 10 }, as: BranchManager, captures: { p1: $.data.id } }
            - { call: "POST /pvf/contractor-accounts", payload: { company_name: "GC Corp", pricing_tier: "GOLD", terms: "NET_30", credit_limit_cents: 10000000 }, as: InsideSales, captures: { acct: $.data.id } }
            - { call: "POST /pvf/branches/${b}/inventory", payload: { product_id: "${p1}", initial_on_hand: 4 }, as: WarehouseLead }
            - { call: "POST /pvf/orders", payload: { account_id: "${acct}", branch_id: "${b}", job_name: "JOB-R", will_call: true }, as: CounterRep, captures: { ord: $.data.id } }
            - { call: "POST /pvf/orders/${ord}/lines", payload: { product_id: "${p1}", qty: 4 }, as: CounterRep, captures: { ln: $.data.id } }
            - { call: "POST /pvf/orders/${ord}/submit", payload: {}, as: CounterRep }
            - { call: "POST /pvf/orders/${ord}/mark-staged", payload: {}, as: WarehouseLead }
            - { call: "POST /pvf/orders/${ord}/pickup", payload: {}, as: CounterRep }
            - { call: "POST /pvf/returns", payload: { order_id: "${ord}", reason: "extra", lines: [ { order_line_id: "${ln}", qty: 1 } ] }, as: CounterRep, as_user_id: "rep-1", captures: { ret: $.data.id } }
            - { call: "POST /pvf/returns/${ret}/submit", payload: {}, as: CounterRep, as_user_id: "rep-1" }
            - { call: "POST /pvf/returns/${ret}/decision", payload: { decision: "APPROVE" }, as: BranchManager, as_user_id: "mgr-9" }
            - { call: "POST /pvf/returns/${ret}/receive", payload: {}, as: WarehouseLead }
          trigger:
            - call: "GET /pvf/contractor-accounts/${acct}/job-costing"
              payload: { job_name: "JOB-R" }
              as: InsideSales
              captures: { prov: $.data.provisional_cost_cents, fin: $.data.final_cost_cents }
          assert:
            - "provisional_cost_cents == 36000 (returns ignored)"
            - "final_cost_cents == 27000 (36000 - 1 x 9000 gross; the 900 fee is NOT added back)"
            - "account balance == 30400 (38500 - 8100 credit)"

      - name: rebate_below_top_threshold_attains_lower_tier
        claim_type: correct_result
        grounds:
          - "calculations.rebate_tier_attainment"
        distinguishing_aspect: "One cent under the top threshold: purchases 499990 attain only the 1% tier -> earned round_half_up(4999.90) == 5000; complements the §1.8 equality case (500000 -> 2%)."
        test_recipe:
          setup:
            - "Program Acme 2026-07-01..2026-08-31, tiers [{250000,1},{500000,2}]"
            - "Receipt 10 x PM @ unit_cost 49999 -> purchases 499990 (in window); clock advanced to 2026-09-01"
          setup_api_calls:
            - { call: "POST /pvf/branches", payload: { name: "Main", code: "M1" }, as: BranchManager, captures: { b: $.data.id } }
            - { call: "POST /pvf/products", payload: { sku: "PM", description: "Acme manifold", category: "FITTING", list_price_cents: 90000, cost_cents: 49999, manufacturer_name: "Acme", cubes_per_unit: 4 }, as: BranchManager, captures: { pm: $.data.id } }
            - { call: "POST /pvf/manufacturer-programs", payload: { manufacturer_name: "Acme", period_start: "2026-07-01T00:00:00Z", period_end: "2026-08-31T23:59:59Z", tiers: [ { threshold_cents: 250000, rebate_pct: 1 }, { threshold_cents: 500000, rebate_pct: 2 } ], committed_stock_value_cents: 0 }, as: BranchManager, captures: { prog: $.data.id } }
            - { call: "POST /pvf/branches/${b}/stock-receipts", payload: { lines: [ { product_id: "${pm}", qty: 10, unit_cost_cents: 49999 } ] }, as: WarehouseLead }
            - { call: "POST /pvf/_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: BranchManager }
          trigger:
            - call: "POST /pvf/manufacturer-programs/${prog}/close"
              payload: {}
              as: BranchManager
              captures: { pct: $.data.attained_rebate_pct, earned: $.data.earned_rebate_cents }
            - call: "POST /pvf/manufacturer-programs/${prog}/settle"
              payload: {}
              as: BranchManager
              captures: { pst: $.data.status }
          assert:
            - "attained_rebate_pct == 1 (499990 < 500000)"
            - "earned_rebate_cents == 5000 (round_half_up(499990 / 100))"
            - "settle after close succeeds: status == SETTLED (terminal)"

  - section: validations
    instances:
      - name: missing_auth_headers_unauthenticated
        claim_type: violation_to_error
        grounds:
          - "validations[priority=1]"
          - "errors[ERR_UNAUTHENTICATED]"
        distinguishing_aspect: "Requests without valid X-User-Role/X-User-ID headers are rejected ERR_UNAUTHENTICATED 401 before any other processing."
        test_recipe:
          setup: ["one branch exists"]
          setup_api_calls:
            - { call: "POST /pvf/branches", payload: { name: "Main", code: "M1" }, as: BranchManager }
          trigger:
            - call: "GET /pvf/branches"
              payload: {}
              as: BranchManager
              captures: { err: $.data.error_id }
          assert:
            - "with headers stripped: error_id == ERR_UNAUTHENTICATED with http 401 (the test harness omits X-User-Role/X-User-ID for this call)"

      - name: auth_priority_beats_existence_unauthenticated
        claim_type: priority_ordering
        grounds:
          - "validations[priority=1]"
          - "validations[priority=5]"
        distinguishing_aspect: "Priority: an unauthenticated GET on a non-existent order id returns 401, never leaking the 404 — auth (p1) strictly precedes existence (p5)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /pvf/orders/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: InsideSales
              captures: { err: $.data.error_id }
          assert:
            - "with headers stripped: error_id == ERR_UNAUTHENTICATED 401 (NOT ERR_ORDER_NOT_FOUND)"

      - name: price_override_by_counterrep_rejected
        claim_type: violation_to_error
        grounds:
          - "validations[priority=28]"
          - "errors[ERR_OVERRIDE_REQUIRES_MANAGER]"
        distinguishing_aspect: "A CounterRep supplying price_override_cents — even a price ABOVE the floor — is rejected ERR_OVERRIDE_REQUIRES_MANAGER 403; the override is manager-only."
        test_recipe:
          setup: ["GOLD account; P1 (list 10000 cost 5000); DRAFT order"]
          setup_api_calls:
            - { call: "POST /pvf/branches", payload: { name: "Main", code: "M1" }, as: BranchManager, captures: { b: $.data.id } }
            - { call: "POST /pvf/products", payload: { sku: "P1", description: "PVC pipe", category: "PIPE", list_price_cents: 10000, cost_cents: 5000, manufacturer_name: "Acme", cubes_per_unit: 10 }, as: BranchManager, captures: { p1: $.data.id } }
            - { call: "POST /pvf/contractor-accounts", payload: { company_name: "GC Corp", pricing_tier: "GOLD", terms: "NET_30", credit_limit_cents: 10000000 }, as: InsideSales, captures: { acct: $.data.id } }
            - { call: "POST /pvf/orders", payload: { account_id: "${acct}", branch_id: "${b}" }, as: CounterRep, captures: { ord: $.data.id } }
          trigger:
            - call: "POST /pvf/orders/${ord}/lines"
              payload: { product_id: "${p1}", qty: 1, price_override_cents: 5300 }
              as: CounterRep
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_OVERRIDE_REQUIRES_MANAGER with http 403 (5300 >= floor 5250 is irrelevant — the role is wrong)"

      - name: price_override_below_floor_rejected
        claim_type: violation_to_error
        grounds:
          - "validations[priority=27]"
          - "errors[ERR_PRICE_FLOOR_VIOLATION]"
          - "calculations.counter_price_resolution"
        distinguishing_aspect: "Even a BranchManager override may not cross the floor: 5200 < ceil(5000 * 1.05) = 5250 -> ERR_PRICE_FLOOR_VIOLATION 422; 5250 exactly would pass."
        test_recipe:
          setup: ["GOLD account; P1 cost 5000; DRAFT order"]
          setup_api_calls:
            - { call: "POST /pvf/branches", payload: { name: "Main", code: "M1" }, as: BranchManager, captures: { b: $.data.id } }
            - { call: "POST /pvf/products", payload: { sku: "P1", description: "PVC pipe", category: "PIPE", list_price_cents: 10000, cost_cents: 5000, manufacturer_name: "Acme", cubes_per_unit: 10 }, as: BranchManager, captures: { p1: $.data.id } }
            - { call: "POST /pvf/contractor-accounts", payload: { company_name: "GC Corp", pricing_tier: "GOLD", terms: "NET_30", credit_limit_cents: 10000000 }, as: InsideSales, captures: { acct: $.data.id } }
            - { call: "POST /pvf/orders", payload: { account_id: "${acct}", branch_id: "${b}" }, as: CounterRep, captures: { ord: $.data.id } }
          trigger:
            - call: "POST /pvf/orders/${ord}/lines"
              payload: { product_id: "${p1}", qty: 1, price_override_cents: 5200 }
              as: BranchManager
              captures: { err: $.data.error_id }
            - call: "POST /pvf/orders/${ord}/lines"
              payload: { product_id: "${p1}", qty: 1, price_override_cents: 5250 }
              as: BranchManager
              captures: { src: $.data.price_source, up: $.data.unit_price_cents }
          assert:
            - "5200: error_id == ERR_PRICE_FLOOR_VIOLATION with http 422"
            - "5250 (exactly the floor): succeeds, price_source == MANUAL_OVERRIDE, unit_price_cents == 5250"

      - name: substitute_group_mismatch_rejected
        claim_type: violation_to_error
        grounds:
          - "validations[priority=24]"
          - "errors[ERR_SUBSTITUTE_GROUP_MISMATCH]"
        distinguishing_aspect: "Substitute eligibility: a product from a different substitute_group (or null group) cannot be proposed -> ERR_SUBSTITUTE_GROUP_MISMATCH 422."
        test_recipe:
          setup: ["P1 group G1 stock 0 (line BACKORDERED); PX group G2; GOLD account"]
          setup_api_calls:
            - { call: "POST /pvf/branches", payload: { name: "Main", code: "M1" }, as: BranchManager, captures: { b: $.data.id } }
            - { call: "POST /pvf/products", payload: { sku: "P1", description: "PVC pipe", category: "PIPE", list_price_cents: 10000, cost_cents: 5000, manufacturer_name: "Acme", cubes_per_unit: 10, substitute_group: "G1" }, as: BranchManager, captures: { p1: $.data.id } }
            - { call: "POST /pvf/products", payload: { sku: "PX", description: "Other valve", category: "VALVE", list_price_cents: 9000, cost_cents: 4000, manufacturer_name: "Acme", cubes_per_unit: 5, substitute_group: "G2" }, as: BranchManager, captures: { px: $.data.id } }
            - { call: "POST /pvf/contractor-accounts", payload: { company_name: "GC Corp", pricing_tier: "GOLD", terms: "NET_30", credit_limit_cents: 10000000 }, as: InsideSales, captures: { acct: $.data.id } }
            - { call: "POST /pvf/branches/${b}/inventory", payload: { product_id: "${p1}", initial_on_hand: 0 }, as: WarehouseLead }
            - { call: "POST /pvf/orders", payload: { account_id: "${acct}", branch_id: "${b}" }, as: CounterRep, captures: { ord: $.data.id } }
            - { call: "POST /pvf/orders/${ord}/lines", payload: { product_id: "${p1}", qty: 2 }, as: CounterRep, captures: { ln: $.data.id } }
            - { call: "POST /pvf/orders/${ord}/submit", payload: {}, as: CounterRep }
          trigger:
            - call: "POST /pvf/order-lines/${ln}/propose-substitute"
              payload: { substitute_product_id: "${px}" }
              as: InsideSales
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_SUBSTITUTE_GROUP_MISMATCH with http 422 (G1 vs G2)"
            - "line substitute_status stays NONE"

      - name: cut_item_return_rejected_non_returnable
        claim_type: violation_to_error
        grounds:
          - "validations[priority=20]"
          - "errors[ERR_NON_RETURNABLE_ITEM]"
        distinguishing_aspect: "Returnability class: a fulfilled cut-to-order line can never enter a return -> ERR_NON_RETURNABLE_ITEM 422 at submit."
        test_recipe:
          setup: ["GOLD account; cut product PC stock 20; will-call order PC qty 2 x 3ft picked up; return DRAFT over the line"]
          setup_api_calls:
            - { call: "POST /pvf/branches", payload: { name: "Main", code: "M1" }, as: BranchManager, captures: { b: $.data.id } }
            - { call: "POST /pvf/products", payload: { sku: "PC", description: "Cut pipe", category: "PIPE", list_price_cents: 200, cost_cents: 100, manufacturer_name: "Acme", cubes_per_unit: 1, is_cut_to_order: true }, as: BranchManager, captures: { pc: $.data.id } }
            - { call: "POST /pvf/contractor-accounts", payload: { company_name: "GC Corp", pricing_tier: "GOLD", terms: "NET_30", credit_limit_cents: 10000000 }, as: InsideSales, captures: { acct: $.data.id } }
            - { call: "POST /pvf/branches/${b}/inventory", payload: { product_id: "${pc}", initial_on_hand: 20 }, as: WarehouseLead }
            - { call: "POST /pvf/orders", payload: { account_id: "${acct}", branch_id: "${b}", will_call: true }, as: CounterRep, captures: { ord: $.data.id } }
            - { call: "POST /pvf/orders/${ord}/lines", payload: { product_id: "${pc}", qty: 2, cut_length_ft: 3 }, as: CounterRep, captures: { ln: $.data.id } }
            - { call: "POST /pvf/orders/${ord}/submit", payload: {}, as: CounterRep }
            - { call: "POST /pvf/orders/${ord}/mark-staged", payload: {}, as: WarehouseLead }
            - { call: "POST /pvf/orders/${ord}/pickup", payload: {}, as: CounterRep }
            - { call: "POST /pvf/returns", payload: { order_id: "${ord}", reason: "oops", lines: [ { order_line_id: "${ln}", qty: 1 } ] }, as: CounterRep, as_user_id: "rep-1", captures: { ret: $.data.id } }
          trigger:
            - call: "POST /pvf/returns/${ret}/submit"
              payload: {}
              as: CounterRep
              as_user_id: "rep-1"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_NON_RETURNABLE_ITEM with http 422; return stays DRAFT"

      - name: return_after_90_days_rejected
        claim_type: violation_to_error
        grounds:
          - "validations[priority=12]"
          - "errors[ERR_RETURN_WINDOW_EXPIRED]"
        distinguishing_aspect: "Return window boundary: day 91 after fulfillment -> ERR_RETURN_WINDOW_EXPIRED 422 (day 90 would pass to the 25% tier)."
        test_recipe:
          setup: ["GOLD account; P1 stock 2; will-call order P1 x1 picked up at 2026-08-01; clock advanced 91 days to 2026-10-31; return DRAFT qty 1"]
          setup_api_calls:
            - { call: "POST /pvf/branches", payload: { name: "Main", code: "M1" }, as: BranchManager, captures: { b: $.data.id } }
            - { call: "POST /pvf/products", payload: { sku: "P1", description: "PVC pipe", category: "PIPE", list_price_cents: 10000, cost_cents: 5000, manufacturer_name: "Acme", cubes_per_unit: 10 }, as: BranchManager, captures: { p1: $.data.id } }
            - { call: "POST /pvf/contractor-accounts", payload: { company_name: "GC Corp", pricing_tier: "GOLD", terms: "NET_30", credit_limit_cents: 10000000 }, as: InsideSales, captures: { acct: $.data.id } }
            - { call: "POST /pvf/branches/${b}/inventory", payload: { product_id: "${p1}", initial_on_hand: 2 }, as: WarehouseLead }
            - { call: "POST /pvf/orders", payload: { account_id: "${acct}", branch_id: "${b}", will_call: true }, as: CounterRep, captures: { ord: $.data.id } }
            - { call: "POST /pvf/orders/${ord}/lines", payload: { product_id: "${p1}", qty: 1 }, as: CounterRep, captures: { ln: $.data.id } }
            - { call: "POST /pvf/orders/${ord}/submit", payload: {}, as: CounterRep }
            - { call: "POST /pvf/orders/${ord}/mark-staged", payload: {}, as: WarehouseLead }
            - { call: "POST /pvf/orders/${ord}/pickup", payload: {}, as: CounterRep }
            - { call: "POST /pvf/_clock/set_current_utc", payload: { to_iso8601: "2026-10-31T00:00:00Z" }, as: BranchManager }
            - { call: "POST /pvf/returns", payload: { order_id: "${ord}", reason: "late", lines: [ { order_line_id: "${ln}", qty: 1 } ] }, as: CounterRep, as_user_id: "rep-1", captures: { ret: $.data.id } }
          trigger:
            - call: "POST /pvf/returns/${ret}/submit"
              payload: {}
              as: CounterRep
              as_user_id: "rep-1"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_RETURN_WINDOW_EXPIRED with http 422 (91 days > 90)"

      - name: empty_return_on_unfulfilled_order_rejected
        claim_type: violation_to_error
        grounds:
          - "validations[priority=21]"
          - "errors[ERR_EMPTY_RETURN]"
        distinguishing_aspect: "Aggregate emptiness: the order was submitted but nothing staged/picked, so every referenced line has zero fulfilled quantity -> ERR_EMPTY_RETURN 422 (fires before the per-line overage check)."
        test_recipe:
          setup: ["GOLD account; P1 stock 2; order P1 x1 submitted (ALLOCATED) but never staged; return DRAFT qty 1"]
          setup_api_calls:
            - { call: "POST /pvf/branches", payload: { name: "Main", code: "M1" }, as: BranchManager, captures: { b: $.data.id } }
            - { call: "POST /pvf/products", payload: { sku: "P1", description: "PVC pipe", category: "PIPE", list_price_cents: 10000, cost_cents: 5000, manufacturer_name: "Acme", cubes_per_unit: 10 }, as: BranchManager, captures: { p1: $.data.id } }
            - { call: "POST /pvf/contractor-accounts", payload: { company_name: "GC Corp", pricing_tier: "GOLD", terms: "NET_30", credit_limit_cents: 10000000 }, as: InsideSales, captures: { acct: $.data.id } }
            - { call: "POST /pvf/branches/${b}/inventory", payload: { product_id: "${p1}", initial_on_hand: 2 }, as: WarehouseLead }
            - { call: "POST /pvf/orders", payload: { account_id: "${acct}", branch_id: "${b}" }, as: CounterRep, captures: { ord: $.data.id } }
            - { call: "POST /pvf/orders/${ord}/lines", payload: { product_id: "${p1}", qty: 1 }, as: CounterRep, captures: { ln: $.data.id } }
            - { call: "POST /pvf/orders/${ord}/submit", payload: {}, as: CounterRep }
            - { call: "POST /pvf/returns", payload: { order_id: "${ord}", reason: "none due", lines: [ { order_line_id: "${ln}", qty: 1 } ] }, as: CounterRep, as_user_id: "rep-1", captures: { ret: $.data.id } }
          trigger:
            - call: "POST /pvf/returns/${ret}/submit"
              payload: {}
              as: CounterRep
              as_user_id: "rep-1"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_EMPTY_RETURN with http 422 (qty_fulfilled == 0 on all lines)"

      - name: kit_foreign_line_rejected
        claim_type: violation_to_error
        grounds:
          - "validations[priority=23]"
          - "errors[ERR_LINE_ORDER_MISMATCH]"
        distinguishing_aspect: "Referential integrity: kitting a line that belongs to a DIFFERENT order -> ERR_LINE_ORDER_MISMATCH 422."
        test_recipe:
          setup: ["GOLD account; P1 stock 10; orders O1 and O2 each with one P1 line, both submitted"]
          setup_api_calls:
            - { call: "POST /pvf/branches", payload: { name: "Main", code: "M1" }, as: BranchManager, captures: { b: $.data.id } }
            - { call: "POST /pvf/products", payload: { sku: "P1", description: "PVC pipe", category: "PIPE", list_price_cents: 10000, cost_cents: 5000, manufacturer_name: "Acme", cubes_per_unit: 10 }, as: BranchManager, captures: { p1: $.data.id } }
            - { call: "POST /pvf/contractor-accounts", payload: { company_name: "GC Corp", pricing_tier: "GOLD", terms: "NET_30", credit_limit_cents: 10000000 }, as: InsideSales, captures: { acct: $.data.id } }
            - { call: "POST /pvf/branches/${b}/inventory", payload: { product_id: "${p1}", initial_on_hand: 10 }, as: WarehouseLead }
            - { call: "POST /pvf/orders", payload: { account_id: "${acct}", branch_id: "${b}" }, as: CounterRep, captures: { o1: $.data.id } }
            - { call: "POST /pvf/orders/${o1}/lines", payload: { product_id: "${p1}", qty: 1 }, as: CounterRep }
            - { call: "POST /pvf/orders/${o1}/submit", payload: {}, as: CounterRep }
            - { call: "POST /pvf/orders", payload: { account_id: "${acct}", branch_id: "${b}" }, as: CounterRep, captures: { o2: $.data.id } }
            - { call: "POST /pvf/orders/${o2}/lines", payload: { product_id: "${p1}", qty: 1 }, as: CounterRep, captures: { l2: $.data.id } }
            - { call: "POST /pvf/orders/${o2}/submit", payload: {}, as: CounterRep }
          trigger:
            - call: "POST /pvf/orders/${o1}/kits"
              payload: { floor_label: "F1", order_line_ids: [ "${l2}" ] }
              as: InsideSales
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_LINE_ORDER_MISMATCH with http 422 (line belongs to order O2)"

      - name: kit_double_membership_rejected
        claim_type: violation_to_error
        grounds:
          - "validations[priority=23]"
          - "errors[ERR_KIT_LINE_CONFLICT]"
        distinguishing_aspect: "A line already assigned to a non-RELEASED kit cannot join a second kit -> ERR_KIT_LINE_CONFLICT 409."
        test_recipe:
          setup: ["GOLD account; P1 stock 5; order with one allocated line; kit K1 already contains the line"]
          setup_api_calls:
            - { call: "POST /pvf/branches", payload: { name: "Main", code: "M1" }, as: BranchManager, captures: { b: $.data.id } }
            - { call: "POST /pvf/products", payload: { sku: "P1", description: "PVC pipe", category: "PIPE", list_price_cents: 10000, cost_cents: 5000, manufacturer_name: "Acme", cubes_per_unit: 10 }, as: BranchManager, captures: { p1: $.data.id } }
            - { call: "POST /pvf/contractor-accounts", payload: { company_name: "GC Corp", pricing_tier: "GOLD", terms: "NET_30", credit_limit_cents: 10000000 }, as: InsideSales, captures: { acct: $.data.id } }
            - { call: "POST /pvf/branches/${b}/inventory", payload: { product_id: "${p1}", initial_on_hand: 5 }, as: WarehouseLead }
            - { call: "POST /pvf/orders", payload: { account_id: "${acct}", branch_id: "${b}" }, as: CounterRep, captures: { ord: $.data.id } }
            - { call: "POST /pvf/orders/${ord}/lines", payload: { product_id: "${p1}", qty: 1 }, as: CounterRep, captures: { ln: $.data.id } }
            - { call: "POST /pvf/orders/${ord}/submit", payload: {}, as: CounterRep }
            - { call: "POST /pvf/orders/${ord}/kits", payload: { floor_label: "F1", order_line_ids: [ "${ln}" ] }, as: InsideSales, captures: { k1: $.data.id } }
          trigger:
            - call: "POST /pvf/orders/${ord}/kits"
              payload: { floor_label: "F2", order_line_ids: [ "${ln}" ] }
              as: InsideSales
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_KIT_LINE_CONFLICT with http 409"

      - name: program_close_before_period_end_rejected
        claim_type: violation_to_error
        grounds:
          - "validations[priority=13]"
          - "errors[ERR_PROGRAM_PERIOD_NOT_ENDED]"
        distinguishing_aspect: "Temporal gate: close while the logical clock is still inside the accrual period -> ERR_PROGRAM_PERIOD_NOT_ENDED 422."
        test_recipe:
          setup: ["program with period_end 2026-12-31; clock still at default 2026-08-01"]
          setup_api_calls:
            - { call: "POST /pvf/manufacturer-programs", payload: { manufacturer_name: "Acme", period_start: "2026-01-01T00:00:00Z", period_end: "2026-12-31T00:00:00Z", tiers: [ { threshold_cents: 100000, rebate_pct: 1 } ], committed_stock_value_cents: 0 }, as: BranchManager, captures: { prog: $.data.id } }
          trigger:
            - call: "POST /pvf/manufacturer-programs/${prog}/close"
              payload: {}
              as: BranchManager
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_PROGRAM_PERIOD_NOT_ENDED with http 422; program stays ACTIVE"

      - name: receipt_unknown_product_rejected
        claim_type: violation_to_error
        grounds:
          - "validations[priority=6]"
          - "errors[ERR_PRODUCT_NOT_FOUND]"
        distinguishing_aspect: "Body-array FK existence: a receipt line referencing a non-existent product_id -> ERR_PRODUCT_NOT_FOUND 404."
        test_recipe:
          setup: ["branch exists"]
          setup_api_calls:
            - { call: "POST /pvf/branches", payload: { name: "Main", code: "M1" }, as: BranchManager, captures: { b: $.data.id } }
          trigger:
            - call: "POST /pvf/branches/${b}/stock-receipts"
              payload: { lines: [ { product_id: "00000000-0000-0000-0000-000000000000", qty: 5, unit_cost_cents: 100 } ] }
              as: WarehouseLead
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_PRODUCT_NOT_FOUND with http 404"

      - name: quote_line_below_floor_rejected
        claim_type: violation_to_error
        grounds:
          - "validations[priority=27]"
          - "errors[ERR_PRICE_FLOOR_VIOLATION]"
        distinguishing_aspect: "The floor also binds explicit quote prices: quote line at 5200 with cost 5000 (floor 5250) -> ERR_PRICE_FLOOR_VIOLATION 422 on the quote endpoint."
        test_recipe:
          setup: ["GOLD account; P1 cost 5000"]
          setup_api_calls:
            - { call: "POST /pvf/branches", payload: { name: "Main", code: "M1" }, as: BranchManager, captures: { b: $.data.id } }
            - { call: "POST /pvf/products", payload: { sku: "P1", description: "PVC pipe", category: "PIPE", list_price_cents: 10000, cost_cents: 5000, manufacturer_name: "Acme", cubes_per_unit: 10 }, as: BranchManager, captures: { p1: $.data.id } }
            - { call: "POST /pvf/contractor-accounts", payload: { company_name: "GC Corp", pricing_tier: "GOLD", terms: "NET_30", credit_limit_cents: 10000000 }, as: InsideSales, captures: { acct: $.data.id } }
          trigger:
            - call: "POST /pvf/quotes"
              payload: { account_id: "${acct}", branch_id: "${b}", job_name: "J", valid_until: "2026-12-31T00:00:00Z", lines: [ { product_id: "${p1}", qty: 1, unit_price_cents: 5200 } ] }
              as: InsideSales
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_PRICE_FLOOR_VIOLATION with http 422"

      - name: credit_exceeded_by_one_cent_rejected
        claim_type: violation_to_error
        grounds:
          - "validations[priority=26]"
          - "errors[ERR_CREDIT_LIMIT_EXCEEDED]"
        distinguishing_aspect: "Strict-greater fiscal boundary: total 50001 against limit 50000 is rejected ERR_CREDIT_LIMIT_EXCEEDED 402 — the mirror image of the §1.8 equality case."
        test_recipe:
          setup: ["STANDARD account limit 50000; product PX list 47501 stock 1; order total = 47501 + 2500 freight = 50001"]
          setup_api_calls:
            - { call: "POST /pvf/branches", payload: { name: "Main", code: "M1" }, as: BranchManager, captures: { b: $.data.id } }
            - { call: "POST /pvf/products", payload: { sku: "PX", description: "Pricey", category: "FITTING", list_price_cents: 47501, cost_cents: 1000, manufacturer_name: "Acme", cubes_per_unit: 1 }, as: BranchManager, captures: { px: $.data.id } }
            - { call: "POST /pvf/contractor-accounts", payload: { company_name: "Std Co", pricing_tier: "STANDARD", terms: "COD", credit_limit_cents: 50000 }, as: InsideSales, captures: { acct: $.data.id } }
            - { call: "POST /pvf/branches/${b}/inventory", payload: { product_id: "${px}", initial_on_hand: 1 }, as: WarehouseLead }
            - { call: "POST /pvf/orders", payload: { account_id: "${acct}", branch_id: "${b}" }, as: CounterRep, captures: { ord: $.data.id } }
            - { call: "POST /pvf/orders/${ord}/lines", payload: { product_id: "${px}", qty: 1 }, as: CounterRep }
          trigger:
            - call: "POST /pvf/orders/${ord}/submit"
              payload: {}
              as: CounterRep
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_CREDIT_LIMIT_EXCEEDED with http 402 (0 + 50001 > 50000)"
            - "order stays DRAFT; no reservation made"

  - section: endpoints
    instances:
      - name: fk_reverse_reachability_gets
        claim_type: standard_crud
        grounds:
          - "endpoints[GET /pvf/orders/{id}/lines]"
          - "endpoints[GET /pvf/products/{id}/inventory]"
          - "endpoints[GET /pvf/quotes/{id}/orders]"
        distinguishing_aspect: "Every FK has a working reverse GET: order->lines, product->inventory, and quote->orders (the convert-created order is discoverable only through this channel)."
        test_recipe:
          setup: ["GOLD account; P1 stock 5; counter order with one line; separate awarded quote converted to a PROJECT order"]
          setup_api_calls:
            - { call: "POST /pvf/branches", payload: { name: "Main", code: "M1" }, as: BranchManager, captures: { b: $.data.id } }
            - { call: "POST /pvf/products", payload: { sku: "P1", description: "PVC pipe", category: "PIPE", list_price_cents: 10000, cost_cents: 5000, manufacturer_name: "Acme", cubes_per_unit: 10 }, as: BranchManager, captures: { p1: $.data.id } }
            - { call: "POST /pvf/contractor-accounts", payload: { company_name: "GC Corp", pricing_tier: "GOLD", terms: "NET_30", credit_limit_cents: 100000000 }, as: InsideSales, captures: { acct: $.data.id } }
            - { call: "POST /pvf/branches/${b}/inventory", payload: { product_id: "${p1}", initial_on_hand: 5 }, as: WarehouseLead }
            - { call: "POST /pvf/orders", payload: { account_id: "${acct}", branch_id: "${b}" }, as: CounterRep, captures: { ord: $.data.id } }
            - { call: "POST /pvf/orders/${ord}/lines", payload: { product_id: "${p1}", qty: 1 }, as: CounterRep, captures: { ln: $.data.id } }
            - { call: "POST /pvf/quotes", payload: { account_id: "${acct}", branch_id: "${b}", job_name: "J", valid_until: "2026-12-31T00:00:00Z", lines: [ { product_id: "${p1}", qty: 2, unit_price_cents: 9000 } ] }, as: InsideSales, captures: { q: $.data.id } }
            - { call: "POST /pvf/quotes/${q}/submit", payload: {}, as: InsideSales }
            - { call: "POST /pvf/quotes/${q}/award", payload: {}, as: Contractor, as_user_id: "${acct}" }
            - { call: "POST /pvf/quotes/${q}/convert", payload: {}, as: InsideSales, captures: { pord: $.data.id, psrc: $.data.source } }
          trigger:
            - { call: "GET /pvf/orders/${ord}/lines", payload: {}, as: InsideSales }
            - { call: "GET /pvf/products/${p1}/inventory", payload: {}, as: InsideSales }
            - { call: "GET /pvf/quotes/${q}/orders", payload: {}, as: InsideSales }
          assert:
            - "GET order lines: array of length 1 containing OrderLine.${ln}"
            - "GET product inventory: array of length 1 for branch ${b} with on_hand 5"
            - "GET quote orders: array of length 1 with id == ${pord}, source == PROJECT"

      - name: account_list_filter_by_status
        claim_type: standard_crud
        grounds:
          - "endpoints[GET /pvf/contractor-accounts]"
        distinguishing_aspect: "Filtered list: ?status=CREDIT_HOLD returns exactly the held account and excludes the ACTIVE one; unfiltered returns both."
        test_recipe:
          setup:
            - "Account H (limit 200000): order P1 x12 = 108000 picked up, then ADJUST_LIMIT to 100000 -> CREDIT_HOLD"
            - "Account A: untouched, ACTIVE"
          setup_api_calls:
            - { call: "POST /pvf/branches", payload: { name: "Main", code: "M1" }, as: BranchManager, captures: { b: $.data.id } }
            - { call: "POST /pvf/products", payload: { sku: "P1", description: "PVC pipe", category: "PIPE", list_price_cents: 10000, cost_cents: 5000, manufacturer_name: "Acme", cubes_per_unit: 10 }, as: BranchManager, captures: { p1: $.data.id } }
            - { call: "POST /pvf/contractor-accounts", payload: { company_name: "H Co", pricing_tier: "GOLD", terms: "NET_30", credit_limit_cents: 200000 }, as: InsideSales, captures: { acctH: $.data.id } }
            - { call: "POST /pvf/contractor-accounts", payload: { company_name: "A Co", pricing_tier: "GOLD", terms: "NET_30", credit_limit_cents: 100000 }, as: InsideSales, captures: { acctA: $.data.id } }
            - { call: "POST /pvf/branches/${b}/inventory", payload: { product_id: "${p1}", initial_on_hand: 20 }, as: WarehouseLead }
            - { call: "POST /pvf/orders", payload: { account_id: "${acctH}", branch_id: "${b}", will_call: true }, as: CounterRep, captures: { ord: $.data.id } }
            - { call: "POST /pvf/orders/${ord}/lines", payload: { product_id: "${p1}", qty: 12 }, as: CounterRep }
            - { call: "POST /pvf/orders/${ord}/submit", payload: {}, as: CounterRep }
            - { call: "POST /pvf/orders/${ord}/mark-staged", payload: {}, as: WarehouseLead }
            - { call: "POST /pvf/orders/${ord}/pickup", payload: {}, as: CounterRep }
            - { call: "POST /pvf/contractor-accounts/${acctH}/credit-review", payload: { action: "ADJUST_LIMIT", new_credit_limit_cents: 100000 }, as: BranchManager }
          trigger:
            - { call: "GET /pvf/contractor-accounts", payload: { status: "CREDIT_HOLD" }, as: InsideSales }
            - { call: "GET /pvf/contractor-accounts", payload: {}, as: InsideSales }
          assert:
            - "filtered: total_count == 1 and the row is ${acctH}"
            - "unfiltered: total_count == 2"

      - name: computed_read_credit_exposure
        claim_type: computed_read
        grounds:
          - "endpoints[GET /pvf/contractor-accounts/{id}/credit-exposure]"
        excluded_because:
          difficulty_instance: credit_exposure_statement_vs_forward
          rationale: "The computed read's values (statement 40500 / forward 81000 / available 919000) are asserted there."

      - name: computed_read_job_costing
        claim_type: computed_read
        grounds:
          - "endpoints[GET /pvf/contractor-accounts/{id}/job-costing]"
        excluded_because:
          difficulty_instance: job_cost_provisional_vs_final
          rationale: "The computed read's values (provisional 108000 / final 0) are asserted there."

  - section: errors
    instances:
      - name: err_slot_full_trigger
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_SLOT_FULL]"
        excluded_because:
          difficulty_instance: slot_capacity_equality_books_then_full
          rationale: "ERR_SLOT_FULL is asserted there on the +1-cube overflow booking."

      - name: err_overlap_triggers
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_SLOT_OVERLAP]"
          - "errors[ERR_BIN_OVERLAP]"
          - "errors[ERR_PROGRAM_OVERLAP]"
        excluded_because:
          difficulty_instance: truck_slot_half_open_adjacency
          rationale: "ERR_SLOT_OVERLAP asserted there; ERR_BIN_OVERLAP in staging_bin_turnaround_buffer; ERR_PROGRAM_OVERLAP in program_closed_interval_touch."

      - name: err_account_hold_and_stale_version_triggers
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_ACCOUNT_CREDIT_HOLD]"
          - "errors[ERR_STALE_QUOTE_VERSION]"
          - "errors[ERR_STALE_ORDER_VERSION]"
          - "errors[ERR_STALE_LINE_VERSION]"
        excluded_because:
          difficulty_instance: order_submit_gated_by_account_hold
          rationale: "ERR_ACCOUNT_CREDIT_HOLD asserted there; the three 412 stale-version errors are asserted by the OCC corner instances (occ_stale_*_rejected) in the cross_cutting_layers section."

  - section: rbac
    instances:
      - name: contractor_cannot_create_product
        claim_type: rbac_deny
        grounds:
          - "roles[Contractor]"
          - "validations[priority=2]"
        distinguishing_aspect: "Role denial: Contractor is absent from POST /pvf/products roles -> ERR_FORBIDDEN 403, no product created."
        test_recipe:
          setup: ["one account to act as"]
          setup_api_calls:
            - { call: "POST /pvf/contractor-accounts", payload: { company_name: "GC Corp", pricing_tier: "GOLD", terms: "NET_30", credit_limit_cents: 100000 }, as: InsideSales, captures: { acct: $.data.id } }
          trigger:
            - call: "POST /pvf/products"
              payload: { sku: "P9", description: "Sneaky", category: "PIPE", list_price_cents: 100, cost_cents: 50, manufacturer_name: "Acme", cubes_per_unit: 1 }
              as: Contractor
              as_user_id: "${acct}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_FORBIDDEN with http 403"

      - name: counterrep_cannot_decide_return
        claim_type: rbac_deny
        grounds:
          - "roles[CounterRep]"
          - "roles[BranchManager]"
        distinguishing_aspect: "Role denial on the decision step: returns decision is BranchManager-exclusive; CounterRep -> ERR_FORBIDDEN 403."
        test_recipe:
          setup: ["picked-up order with a SUBMITTED return (submitted by rep-1)"]
          setup_api_calls:
            - { call: "POST /pvf/branches", payload: { name: "Main", code: "M1" }, as: BranchManager, captures: { b: $.data.id } }
            - { call: "POST /pvf/products", payload: { sku: "P1", description: "PVC pipe", category: "PIPE", list_price_cents: 10000, cost_cents: 5000, manufacturer_name: "Acme", cubes_per_unit: 10 }, as: BranchManager, captures: { p1: $.data.id } }
            - { call: "POST /pvf/contractor-accounts", payload: { company_name: "GC Corp", pricing_tier: "GOLD", terms: "NET_30", credit_limit_cents: 10000000 }, as: InsideSales, captures: { acct: $.data.id } }
            - { call: "POST /pvf/branches/${b}/inventory", payload: { product_id: "${p1}", initial_on_hand: 2 }, as: WarehouseLead }
            - { call: "POST /pvf/orders", payload: { account_id: "${acct}", branch_id: "${b}", will_call: true }, as: CounterRep, captures: { ord: $.data.id } }
            - { call: "POST /pvf/orders/${ord}/lines", payload: { product_id: "${p1}", qty: 1 }, as: CounterRep, captures: { ln: $.data.id } }
            - { call: "POST /pvf/orders/${ord}/submit", payload: {}, as: CounterRep }
            - { call: "POST /pvf/orders/${ord}/mark-staged", payload: {}, as: WarehouseLead }
            - { call: "POST /pvf/orders/${ord}/pickup", payload: {}, as: CounterRep }
            - { call: "POST /pvf/returns", payload: { order_id: "${ord}", reason: "r", lines: [ { order_line_id: "${ln}", qty: 1 } ] }, as: CounterRep, as_user_id: "rep-1", captures: { ret: $.data.id } }
            - { call: "POST /pvf/returns/${ret}/submit", payload: {}, as: CounterRep, as_user_id: "rep-1" }
          trigger:
            - call: "POST /pvf/returns/${ret}/decision"
              payload: { decision: "APPROVE" }
              as: CounterRep
              as_user_id: "rep-2"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_FORBIDDEN with http 403; return stays SUBMITTED"

      - name: warehouselead_cannot_create_quote
        claim_type: rbac_deny
        grounds:
          - "roles[WarehouseLead]"
          - "roles[InsideSales]"
        distinguishing_aspect: "Peer-role isolation: quotes are InsideSales-exclusive; WarehouseLead -> ERR_FORBIDDEN 403."
        test_recipe:
          setup: ["branch, product, account"]
          setup_api_calls:
            - { call: "POST /pvf/branches", payload: { name: "Main", code: "M1" }, as: BranchManager, captures: { b: $.data.id } }
            - { call: "POST /pvf/products", payload: { sku: "P1", description: "PVC pipe", category: "PIPE", list_price_cents: 10000, cost_cents: 5000, manufacturer_name: "Acme", cubes_per_unit: 10 }, as: BranchManager, captures: { p1: $.data.id } }
            - { call: "POST /pvf/contractor-accounts", payload: { company_name: "GC Corp", pricing_tier: "GOLD", terms: "NET_30", credit_limit_cents: 10000000 }, as: InsideSales, captures: { acct: $.data.id } }
          trigger:
            - call: "POST /pvf/quotes"
              payload: { account_id: "${acct}", branch_id: "${b}", job_name: "J", valid_until: "2026-12-31T00:00:00Z", lines: [ { product_id: "${p1}", qty: 1, unit_price_cents: 9000 } ] }
              as: WarehouseLead
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_FORBIDDEN with http 403"

      - name: segregation_same_user_decision_rejected
        claim_type: rbac_deny
        grounds:
          - "validations[priority=19]"
          - "errors[ERR_SEGREGATION_OF_DUTIES]"
        distinguishing_aspect: "Segregation of duties: even with the BranchManager ROLE, deciding a return whose submitted_by equals the caller's X-User-ID -> ERR_SEGREGATION_OF_DUTIES 409."
        test_recipe:
          setup: ["picked-up order; return submitted by user rep-7"]
          setup_api_calls:
            - { call: "POST /pvf/branches", payload: { name: "Main", code: "M1" }, as: BranchManager, captures: { b: $.data.id } }
            - { call: "POST /pvf/products", payload: { sku: "P1", description: "PVC pipe", category: "PIPE", list_price_cents: 10000, cost_cents: 5000, manufacturer_name: "Acme", cubes_per_unit: 10 }, as: BranchManager, captures: { p1: $.data.id } }
            - { call: "POST /pvf/contractor-accounts", payload: { company_name: "GC Corp", pricing_tier: "GOLD", terms: "NET_30", credit_limit_cents: 10000000 }, as: InsideSales, captures: { acct: $.data.id } }
            - { call: "POST /pvf/branches/${b}/inventory", payload: { product_id: "${p1}", initial_on_hand: 2 }, as: WarehouseLead }
            - { call: "POST /pvf/orders", payload: { account_id: "${acct}", branch_id: "${b}", will_call: true }, as: CounterRep, captures: { ord: $.data.id } }
            - { call: "POST /pvf/orders/${ord}/lines", payload: { product_id: "${p1}", qty: 1 }, as: CounterRep, captures: { ln: $.data.id } }
            - { call: "POST /pvf/orders/${ord}/submit", payload: {}, as: CounterRep }
            - { call: "POST /pvf/orders/${ord}/mark-staged", payload: {}, as: WarehouseLead }
            - { call: "POST /pvf/orders/${ord}/pickup", payload: {}, as: CounterRep }
