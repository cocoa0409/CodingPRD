              captures: { co1_id: $.data.id }
            - call: "POST /change-orders"
              payload: { agreement_id: "${agreement_id}", target_milestone_id: "${m1_id}", order_type: "FUNDING_UPLIFT", requested_amount_cents: 350000, ship_date_delta_days: 0, rationale: "Blind supersede attempt on the pre-write version", expected_agreement_version: "${v_read}" }
              as: PublisherFinance
              as_user_id: "${finance_id}"
              captures: { stale_error_id: "$.data.error_id" }
            - call: "GET /development-agreements/${agreement_id}"
              payload: {}
              as: PublisherFinance
              as_user_id: "${finance_id}"
              captures: { v_fresh: $.data.version }
            - call: "POST /change-orders"
              payload: { agreement_id: "${agreement_id}", target_milestone_id: "${m1_id}", order_type: "FUNDING_UPLIFT", requested_amount_cents: 350000, ship_date_delta_days: 0, rationale: "Informed supersede on the current version", expected_agreement_version: "${v_fresh}" }
              as: Developer
              as_user_id: "${studio_id}"
              captures: { co2_id: $.data.id }
            - call: "GET /change-orders/${co1_id}"
              payload: {}
              as: PublisherFinance
