  - rule_id: compensating_invariant
    instances:
      - name: invariant_sampling_slots_conserved_across_create_then_exclude
        grounds:
          - calculations.sample_quota_attainment[CONSERVED QUANTITY]
          - state_machines.SampleSelection.SELECTED_to_EXCLUDED
          - entities.SamplePlan.fields.agent_volume_attainment
          - entities.Interaction.fields.sampled_count
        distinguishing_aspect: |
          Conserved quantity #1: the per-(plan, agent) SAMPLING SLOT LEDGER, consumed + remaining ==
          per_agent_target_volume + reserve. The compensating action is an explicit operator exclude,
          and the invariant is asserted at four points (before, after each of two creates, after the
          exclude) so a drift of one slot cannot hide behind a matching pair of wrong numbers.
          Interaction.sampled_count must unwind with it, while excluded_count RISES -- history is
          kept even though the slot is returned.
        test_recipe:
          setup:
            - "clock 2026-08-05T09:00:00Z; ACTIVE form F1; agent A-1001"
            - "interactions I1 and I2 consent VERIFIED"
            - "OPEN plan pl1 with per_agent_target_volume 4 and mix 50/25/25 -> caps RANDOM 2, TARGETED 1, CUSTOMER_FLAGGED 1, reserve 0"
            - "baseline read of the plan: agent_volume_attainment is {} and selections_count == excluded_count == 0"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T09:00:00Z" }
              as: QualityManager
            - call: "POST /evaluation-forms"
              payload: { name: "Care Quality", version_label: "2026.08", auto_fail_policy: "COMPLIANCE_SECTION_ZERO", min_compliance_item_score: 3, behaviors: [ { code: "DISCLOSE", label: "Disclosures", weight_pct: 30.00, compliance_critical: true, auto_fail_on_violation: true, max_points: 5, allows_not_applicable: false, guidance_text: "State the recording disclosure." }, { code: "GREET", label: "Greeting", weight_pct: 20.00, compliance_critical: false, auto_fail_on_violation: false, max_points: 5, allows_not_applicable: false, guidance_text: "Use the branded greeting." }, { code: "RESOLVE", label: "Resolution", weight_pct: 35.00, compliance_critical: false, auto_fail_on_violation: false, max_points: 5, allows_not_applicable: false, guidance_text: "Resolve or set a next step." }, { code: "SURVEY", label: "Survey", weight_pct: 15.00, compliance_critical: false, auto_fail_on_violation: false, max_points: 5, allows_not_applicable: true, guidance_text: "Invite to the survey." } ] }
              as: QualityManager
              captures: { f1: $.data.id }
            - call: "POST /evaluation-forms/${f1}/activate"
              payload: {}
              as: QualityManager
            - call: "POST /agents"
              payload: { external_ref: "A-1001", full_name: "Ada Agent", team_code: "TEAM-A", hire_date: "2025-03-01T00:00:00Z" }
              as: QualityManager
              captures: { ag1: $.data.id }
            - call: "POST /interactions"
              payload: { agent_id: "${ag1}", channel: "VOICE", started_at: "2026-08-03T10:00:00Z", ended_at: "2026-08-03T10:10:00Z", required_disclosures: ["RECORDING"], customer_flagged: false, csat_score: 4, repeat_contact_within_72h: false }
              as: QualityManager
              captures: { i1: $.data.id }
            - call: "POST /interactions/${i1}/consent-review"
              payload: { consent_outcome: "VERIFIED", captured_disclosures: ["RECORDING"] }
              as: ComplianceAuditor
            - call: "POST /interactions"
              payload: { agent_id: "${ag1}", channel: "VOICE", started_at: "2026-08-04T14:00:00Z", ended_at: "2026-08-04T14:30:00Z", required_disclosures: ["RECORDING"], customer_flagged: false, csat_score: 2, repeat_contact_within_72h: true }
              as: QualityManager
              captures: { i2: $.data.id }
            - call: "POST /interactions/${i2}/consent-review"
              payload: { consent_outcome: "VERIFIED", captured_disclosures: ["RECORDING"] }
              as: ComplianceAuditor
            - call: "POST /sample-plans"
              payload: { form_id: "${f1}", period_start: "2026-08-01T00:00:00Z", period_end: "2026-08-31T23:59:59Z", per_agent_target_volume: 4, source_mix: { random_pct: 50, targeted_pct: 25, customer_flagged_pct: 25 } }
              as: QualityManager
              captures: { pl1: $.data.id }
            - call: "POST /sample-plans/${pl1}/open"
              payload: {}
              as: QualityManager
            - call: "GET /sample-plans/${pl1}"
              payload: {}
              as: QualityManager
          trigger:
            - call: "POST /sample-selections"
              payload: { plan_id: "${pl1}", interaction_id: "${i1}", source: "RANDOM" }
              as: QualityManager
              captures: { sel1: $.data.id }
            - call: "POST /sample-selections"
              payload: { plan_id: "${pl1}", interaction_id: "${i2}", source: "RANDOM" }
              as: QualityManager
              captures: { sel2: $.data.id }
            - call: "GET /sample-plans/${pl1}"
              payload: {}
              as: QualityManager
            - call: "POST /sample-selections/${sel2}/exclude"
              payload: { exclusion_reason: "EVALUATOR_UNAVAILABLE" }
              as: QualityManager
            - call: "GET /sample-plans/${pl1}"
              payload: {}
              as: QualityManager
          assert:
            - "baseline (setup read) -- SamplePlan.${pl1}.selections_count == 0, excluded_count == 0, targeted_reserved_count == 0, agent_volume_attainment == {}"
            - "after the two creates -- agent_volume_attainment[${ag1}] == { consumed: 2, remaining: 2, by_source: { RANDOM: 2, TARGETED: 0, CUSTOMER_FLAGGED: 0 } }; invariant 2 + 2 == 4 + 0"
            - "after the two creates -- selections_count == 2, excluded_count == 0, Interaction.${i1}.sampled_count == 1, Interaction.${i2}.sampled_count == 1"
            - "after the exclude -- agent_volume_attainment[${ag1}] == { consumed: 1, remaining: 3, by_source: { RANDOM: 1, TARGETED: 0, CUSTOMER_FLAGGED: 0 } }; invariant 1 + 3 == 4 + 0 holds again"
            - "after the exclude -- consumed and remaining are byte-identical to their values right after the FIRST create: the compensation left no drift"
            - "after the exclude -- selections_count == 1 but excluded_count == 1 (the history row survives) and Interaction.${i2}.sampled_count == 0"
            - "SampleSelection.${sel2}.status == EXCLUDED with exclusion_reason == EVALUATOR_UNAVAILABLE, assigned_evaluator_id == null, review_window_start == null, review_window_end == null"
            - "SampleSelection.${sel1}.status == SELECTED and untouched by the exclude of its sibling"
      - name: invariant_evaluator_load_ledger_reconciles_after_plan_close_sweep
        grounds:
          - calculations.evaluator_load
          - state_machines.SamplePlan.OPEN_to_CLOSED.side_effects[CASCADE hops 1-3]
          - entities.Evaluator.fields.open_assignment_count
          - calculations.sample_quota_attainment[CONSERVED QUANTITY]
        distinguishing_aspect: |
          A DIFFERENT conserved quantity (the per-evaluator OPEN-ASSIGNMENT ledger, open_assignment_count
          == count of that evaluator's ASSIGNED selections) restored by a DIFFERENT compensating
          trigger (an automatic plan-close sweep over two rows at once, not a per-row operator
          exclude). The two-row sweep is what makes it a ledger test rather than a single-flag test:
          both selections must be released in created_at ASC order and the count must land exactly on
          0, and the freed windows must be nulled so they no longer block ERR_EVALUATOR_WINDOW_CONFLICT.
        test_recipe:
          setup:
            - "clock 2026-08-05T09:00:00Z; ACTIVE form F1; agent A-1001; evaluator Eve with max_open_assignments 3"
            - "interactions I1 and I2 consent VERIFIED"
            - "OPEN plan pl1 with per_agent_target_volume 4 and mix 100/0/0 (RANDOM cap 4)"
            - "sel1 and sel2 both ASSIGNED to Eve on adjacent windows 09:00-11:00 and 11:00-13:00, with NO Evaluation row on either, so the sweep may release both"
            - "baseline read of Eve: open_assignment_count == 2"
