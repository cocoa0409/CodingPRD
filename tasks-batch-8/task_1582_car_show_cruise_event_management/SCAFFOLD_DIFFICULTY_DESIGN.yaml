            - "Registration.${r1}.refunded_cents == 1500 and status == REFUNDED"

      - name: zone_occupancy_conserved_checkin_withdraw
        grounds:
          - entities.Zone.fields.assigned_count
          - entities.Registration.fields.spot_number
          - state_machines.Registration.CHECKED_IN_to_WITHDRAWN
        distinguishing_aspect: |
          Conserved quantity zone occupancy (a count, not money): after every check-in /
          withdrawal pair, Zone.assigned_count == count of CHECKED_IN registrations in the zone,
          and freed spot 1 is reused by the next check-in (lowest-free-spot selector), proving
          no drift in either the count or the spot pool.
        test_recipe:
          setup:
            - "Event REGISTRATION_OPEN; zone FIELD capacity 10 with window 08:00-10:00; three registrations R1/R2/R3 CONFIRMED with waivers signed; clock 08:30"
          setup_api_calls:
            - { call: "POST /events", payload: { name: "Spot Show", event_date: "2026-08-15", gates_open_at: "2026-08-15T09:00:00Z", judging_start_at: "2026-08-15T12:00:00Z", judging_end_at: "2026-08-15T14:00:00Z", ballot_close_at: "2026-08-15T14:30:00Z", prereg_deadline: "2026-08-14T23:59:59Z", curfew_start: "22:00", curfew_end: "07:00", liability_policy_number: "POL-1", tabulation_method: "STRAIGHT_AVERAGE" }, as: Organizer, captures: { ev: $.data.id } }
            - { call: "POST /events/${ev}/classes", payload: { code: "OPEN", name: "Open", min_year: 1900, max_year: 2026, prereg_fee_cents: 3000, day_of_fee_cents: 4500, capacity: 40, judging_mode: "PEOPLES_CHOICE", award_depth: 1 }, as: Organizer, captures: { cl: $.data.id } }
            - { call: "POST /events/${ev}/zones", payload: { name: "Field", zone_type: "SHOW_FIELD", capacity: 10, has_power: false, arrival_window_start: "2026-08-15T08:00:00Z", arrival_window_end: "2026-08-15T10:00:00Z" }, as: Organizer, captures: { zn: $.data.id } }
            - { call: "POST /events/${ev}/publish", payload: {}, as: Organizer }
            - { call: "POST /events/${ev}/open-registration", payload: {}, as: Organizer }
            - { call: "POST /registrants", payload: { full_name: "S1", email: "s1@example.com", club_member: false, is_minor: false }, as: Organizer, captures: { p1: $.data.id } }
            - { call: "POST /registrants/${p1}/vehicles", payload: { year: 1970, make: "Ford", model: "Mustang" }, as: Organizer, captures: { v1: $.data.id } }
            - { call: "POST /waivers", payload: { event_id: "${ev}", registrant_id: "${p1}", signature_name: "S1" }, as: RegistrationDesk }
            - { call: "POST /registrations", payload: { event_id: "${ev}", registrant_id: "${p1}", vehicle_id: "${v1}", class_id: "${cl}" }, as: RegistrationDesk, captures: { r1: $.data.id } }
            - { call: "POST /registrations/${r1}/payments", payload: { amount_cents: 3000, method: "CASH" }, as: RegistrationDesk }
            - { call: "POST /registrants", payload: { full_name: "S2", email: "s2@example.com", club_member: false, is_minor: false }, as: Organizer, captures: { p2: $.data.id } }
            - { call: "POST /registrants/${p2}/vehicles", payload: { year: 1971, make: "Chevrolet", model: "Chevelle" }, as: Organizer, captures: { v2: $.data.id } }
            - { call: "POST /waivers", payload: { event_id: "${ev}", registrant_id: "${p2}", signature_name: "S2" }, as: RegistrationDesk }
            - { call: "POST /registrations", payload: { event_id: "${ev}", registrant_id: "${p2}", vehicle_id: "${v2}", class_id: "${cl}" }, as: RegistrationDesk, captures: { r2: $.data.id } }
            - { call: "POST /registrations/${r2}/payments", payload: { amount_cents: 3000, method: "CARD" }, as: RegistrationDesk }
            - { call: "POST /registrants", payload: { full_name: "S3", email: "s3@example.com", club_member: false, is_minor: false }, as: Organizer, captures: { p3: $.data.id } }
            - { call: "POST /registrants/${p3}/vehicles", payload: { year: 1972, make: "Pontiac", model: "GTO" }, as: Organizer, captures: { v3: $.data.id } }
            - { call: "POST /waivers", payload: { event_id: "${ev}", registrant_id: "${p3}", signature_name: "S3" }, as: RegistrationDesk }
            - { call: "POST /registrations", payload: { event_id: "${ev}", registrant_id: "${p3}", vehicle_id: "${v3}", class_id: "${cl}" }, as: RegistrationDesk, captures: { r3: $.data.id } }
            - { call: "POST /registrations/${r3}/payments", payload: { amount_cents: 3000, method: "CHECK" }, as: RegistrationDesk }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-15T08:30:00Z" }, as: Organizer }
          trigger:
            - { call: "POST /registrations/${r1}/check-in", payload: { zone_id: "${zn}" }, as: RegistrationDesk, captures: { sp1: $.data.spot_number } }
            - { call: "POST /registrations/${r2}/check-in", payload: { zone_id: "${zn}" }, as: RegistrationDesk, captures: { sp2: $.data.spot_number } }
            - { call: "POST /registrations/${r1}/withdraw", payload: { reason: "engine trouble" }, as: RegistrationDesk }
            - { call: "POST /registrations/${r3}/check-in", payload: { zone_id: "${zn}" }, as: RegistrationDesk, captures: { sp3: $.data.spot_number } }
            - { call: "GET /events/${ev}/zones", payload: {}, as: Organizer }
          assert:
            - "R1 gets spot_number 1, R2 gets spot_number 2"
            - "after R1 (CHECKED_IN) withdraws: zones[0].assigned_count == 1"
            - "R3 gets spot_number 1 (lowest free spot reused) and zones[0].assigned_count == 2"
            - "invariant holds: assigned_count == count of CHECKED_IN registrations in the zone (R2, R3)"
