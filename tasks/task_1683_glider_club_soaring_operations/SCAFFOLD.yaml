# =============================================================================
# PRD Benchmark Scaffold — Glider Club & Soaring Operations (SSA-affiliated)
# =============================================================================

scenario: |
  Glider Club & Soaring Operations (SSA-affiliated soaring club): membership
  tier & dues, tow plane scheduling & tow-fee accounting, glider fleet
  reservation & duty officer rotation, instructor availability & student
  progression, launch log & flight-time recording, maintenance/inspection
  currency by airframe, cross-country retrieve coordination, contest &
  badge-flight documentation

domain_name: glider-club-soaring
api_prefix: /soaring

complexity_profile:
  primary_archetype: temporal_windowing        # glider reservations, tow slots, instructor availability, duty roster
  secondary_archetype: ledger_reconciliation   # member account: provisional tow debits vs finalized flight charges vs dues
  complexity_layers:
    - optimistic_concurrency                   # OCC on TowSlot.version (flight posting) and Aircraft.version (reservation create)
    - cascading_side_effects                   # aircraft grounding -> reservation cancels -> tow slot load -> slot cancel
    - dual_variant_calculation                 # provisional vs final tow fee; forward-looking vs chronological dues
    - rate_threshold_triggers                  # 100-hour inspection boundary, tow-slot capacity, solo eligibility recency
    - scheduled_deferred_actions               # ops-day close epoch: NO_SHOW marking, dues posting, badge expiry sweep
  entity_topology: flat                        # peer entities joined by FK references; no nested URL hierarchy
  state_machine_shape: branching               # mixed: cyclic (StudentProgress rework), guarded (Reservation checkout), linear-with-auto (DutyRosterSlot)
  relationship_patterns:
    - one_to_many
    - cross_aggregate                          # Reservation references Aircraft + Member + InstructorAvailability
    - self_referential                         # DutyRosterSlot.swap_with_slot_id references DutyRosterSlot
  role_model: peer_roles                       # Member / DutyOfficer / Instructor / TowPilot / ClubAdmin own different surfaces
  consistency_model: immediate                 # all side effects applied atomically in-request

# =============================================================================
# §1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: MembershipTier
    parent: null
    common_fields: true
    fields:
      - { name: tier_code, type: string, source: input, description: "Unique tier code, e.g. STUDENT | STANDARD | FAMILY | TOW_PILOT", constraints: "unique across MembershipTier" }
      - { name: monthly_dues_cents, type: integer, source: input, description: "Monthly dues charged to member account at ops-day close" }
      - { name: tow_fee_discount_pct, type: number, source: input, description: "Fractional discount applied to tow fees, 0.00-0.50", constraints: "0 <= x <= 0.50" }
      - { name: included_tows_per_month, type: integer, source: input, description: "Number of tow launches per calendar month billed at 0 cents before pay-per-tow applies", default: 0 }
      - { name: student_tier, type: boolean, source: input, description: "True if this tier is eligible for student progression records", default: false }

  - name: Member
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Member full name" }
      - { name: tier_id, type: string, source: input, description: "FK -> MembershipTier.id; membership tier governing dues and discounts" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED | RESIGNED", constraints: "SUSPENDED blocks all flight-side activity" }
      - { name: is_instructor, type: boolean, source: input, description: "Whether member may act as Instructor", default: false }
      - { name: is_tow_pilot, type: boolean, source: input, description: "Whether member may act as TowPilot", default: false }
      - { name: account_balance_cents, type: integer, source: computed, description: "Ledger balance: positive = member owes club; negative = credit. Derived from dues postings + tow charges - payments" }
      - { name: pending_dues_cents, type: integer, source: computed, description: "Prorated dues scheduled by a mid-month tier change; swept into account_balance_cents at next ops-day close", default: 0 }
      - { name: suspension_reason, type: string, source: system, description: "Populated on SUSPENDED; ARREARS when auto-suspended for balance", default: null }
      - { name: solo_endorsed, type: boolean, source: computed, description: "True when member holds a VERIFIED StudentProgress of kind SOLO_SIGNOFF" }
      - { name: badge_level, type: enum, source: computed, description: "NONE | A | B | C | BRONZE | SILVER — highest VERIFIED badge", default: "NONE" }

  - name: Aircraft
    parent: null
    common_fields: true
    fields:
      - { name: registration, type: string, source: input, description: "Tail number, unique", constraints: "unique" }
      - { name: kind, type: enum, source: input, description: "GLIDER | TOW_PLANE" }
      - { name: status, type: enum, source: system, description: "AIRWORTHY | GROUNDED | RETIRED" }
      - { name: total_time_hours, type: number, source: computed, description: "Accumulated airframe hours from closed flights" }
      - { name: hours_since_inspection, type: number, source: computed, description: "Hours flown since last INSPECTION_100H MaintenanceRecord; reset to 0 by inspection" }
      - { name: annual_due_date, type: datetime, source: system, description: "Next annual inspection deadline; set +12 months by ANNUAL MaintenanceRecord" }
      - { name: grounded_reason, type: string, source: system, description: "INSPECTION_OVERDUE | ANNUAL_OVERDUE | MANUAL", default: null }

  - name: DutyRosterSlot
    parent: null
    common_fields: true
    fields:
      - { name: duty_date, type: datetime, source: input, description: "Calendar date (00:00Z) of the duty day" }
      - { name: member_id, type: string, source: input, description: "FK -> Member.id; assigned duty officer" }
      - { name: status, type: enum, source: system, description: "ASSIGNED | CONFIRMED | COMPLETED | SWAP_PENDING | NO_SHOW | CANCELLED" }
      - { name: swap_with_slot_id, type: string, source: system, description: "FK -> DutyRosterSlot.id; self-referential peer slot proposed in a swap", default: null }

  - name: InstructorAvailability
    parent: null
    common_fields: true
    fields:
      - { name: instructor_id, type: string, source: input, description: "FK -> Member.id; must be is_instructor=true" }
      - { name: start_at, type: datetime, source: input, description: "Availability window start (ISO8601 UTC)" }
      - { name: end_at, type: datetime, source: input, description: "Availability window end (ISO8601 UTC)" }
      - { name: status, type: enum, source: system, description: "OPEN | CANCELLED" }

  - name: Reservation
    parent: null
    common_fields: true
    fields:
      - { name: aircraft_id, type: string, source: input, description: "FK -> Aircraft.id; glider being reserved (kind must be GLIDER)" }
      - { name: member_id, type: string, source: input, description: "FK -> Member.id; pilot reserving" }
      - { name: instructor_id, type: string, source: input, description: "FK -> Member.id; optional instructor for dual instructional flights", default: null }
      - { name: start_at, type: datetime, source: input, description: "Reservation window start (ISO8601 UTC)" }
      - { name: end_at, type: datetime, source: input, description: "Reservation window end (ISO8601 UTC)" }
      - { name: status, type: enum, source: system, description: "BOOKED | CHECKED_OUT | CLOSED | CANCELLED | NO_SHOW" }

  - name: Flight
    parent: null
    common_fields: true
    fields:
      - { name: reservation_id, type: string, source: input, description: "FK -> Reservation.id; launch being logged (must be CHECKED_OUT)" }
      - { name: tow_slot_id, type: string, source: input, description: "FK -> TowSlot.id; tow slot this launch consumes" }
      - { name: release_altitude_ft, type: integer, source: input, description: "Tow release altitude in feet MSL", constraints: ">= 500" }
      - { name: takeoff_at, type: datetime, source: input, description: "Actual takeoff time" }
      - { name: landed_at, type: datetime, source: input, description: "Actual landing time; required to close the flight", default: null }
      - { name: status, type: enum, source: system, description: "IN_FLIGHT | LANDED | RECONCILED | VOIDED" }
      - { name: flight_minutes, type: integer, source: computed, description: "ceil((landed_at - takeoff_at)/60s) once landed" }
      - { name: provisional_fee_cents, type: integer, source: computed, description: "Provisional tow fee computed at launch posting" }
      - { name: final_fee_cents, type: integer, source: computed, description: "Final tow fee computed at flight close (landing logged)" }
      - { name: retrieve_id, type: string, source: system, description: "FK -> RetrieveRequest.id; set when this flight generated a cross-country retrieve", default: null }

  - name: TowSlot
    parent: null
    common_fields: true
    fields:
      - { name: tow_plane_id, type: string, source: input, description: "FK -> Aircraft.id; tow plane assigned (kind must be TOW_PLANE)" }
      - { name: tow_pilot_id, type: string, source: input, description: "FK -> Member.id; scheduled tow pilot (is_tow_pilot=true)" }
      - { name: start_at, type: datetime, source: input, description: "Slot window start" }
      - { name: end_at, type: datetime, source: input, description: "Slot window end" }
      - { name: capacity, type: integer, source: input, description: "Maximum tows this slot supports", constraints: ">= 1" }
      - { name: confirmed_count, type: integer, source: computed, description: "Count of flights in IN_FLIGHT|LANDED|RECONCILED linked to this slot" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | CANCELLED" }

  - name: MaintenanceRecord
    parent: null
    common_fields: false
    fields:
      - { name: aircraft_id, type: string, source: input, description: "FK -> Aircraft.id" }
      - { name: kind, type: enum, source: input, description: "INSPECTION_100H | ANNUAL | REPAIR" }
      - { name: performed_at, type: datetime, source: input, description: "When the work was performed (ISO8601 UTC)" }
      - { name: hobbs_hours_at_service, type: number, source: input, description: "Airframe total time at which service occurred" }
      - { name: notes, type: string, source: input, description: "Free-text maintenance notes", default: null }

  - name: StudentProgress
    parent: null
    common_fields: true
    fields:
      - { name: student_id, type: string, source: input, description: "FK -> Member.id; student (tier must have student_tier=true)" }
      - { name: instructor_id, type: string, source: input, description: "FK -> Member.id; endorsing instructor (is_instructor=true)" }
      - { name: kind, type: enum, source: input, description: "SOLO_SIGNOFF | CHECKRIDE_PASS | BADGE_A | BADGE_B | BADGE_C | BADGE_BRONZE | BADGE_SILVER" }
      - { name: status, type: enum, source: system, description: "PENDING | SIGNED_OFF | VERIFIED | REJECTED" }
      - { name: dual_hours_at_signoff, type: number, source: computed, description: "Student's accumulated dual (instructional) flight hours at time of signoff" }
      - { name: signed_off_at, type: datetime, source: system, description: "Timestamp of instructor signoff", default: null }

  - name: RetrieveRequest
    parent: null
    common_fields: true
    fields:
      - { name: flight_id, type: string, source: input, description: "FK -> Flight.id; the cross-country flight that landed out" }
      - { name: distance_km, type: number, source: input, description: "One-way retrieve distance in kilometres", constraints: "> 0" }
      - { name: status, type: enum, source: system, description: "REQUESTED | CREW_ASSIGNED | COMPLETED | CANCELLED" }
      - { name: pilot_share_cents, type: integer, source: computed, description: "Pilot's share of retrieve cost per retrieve_cost_split" }
      - { name: club_share_cents, type: integer, source: computed, description: "Club's share of retrieve cost per retrieve_cost_split" }
      - { name: crew_member_id, type: string, source: system, description: "FK -> Member.id; retrieve crew driver", default: null }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Member
    initial_state: ACTIVE
    terminal_states: [RESIGNED]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /soaring/ops-day/close (system: balance >= arrears threshold after dues posting) OR POST /soaring/members/{id}/suspend"
        actor: "ClubAdmin | system"
        preconditions:
          - "system path: account_balance_cents >= ARREARS_THRESHOLD_CENTS after dues posting"
        side_effects:
          - "suspension_reason set to ARREARS (system path) or MANUAL (admin path)"
          - "all BOOKED reservations of this member with start_at > now -> CANCELLED"
          - "each cancelled reservation's linked TowSlot (via any Flight) unaffected at this stage (no Flight exists for BOOKED reservations)"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /soaring/members/{id}/payments when payment brings account_balance_cents < ARREARS_THRESHOLD_CENTS AND suspension_reason == ARREARS (system automatic reinstatement)"
        actor: system
        preconditions:
          - "suspension_reason == ARREARS"
          - "post-payment account_balance_cents < ARREARS_THRESHOLD_CENTS"
        side_effects:
          - "suspension_reason cleared to null"
      - from: ACTIVE
        to: RESIGNED
        trigger: "POST /soaring/members/{id}/resign"
        actor: "Member | ClubAdmin"
        preconditions:
          - "member has no IN_FLIGHT Flight (ERR_MEMBER_IN_FLIGHT)"
        side_effects:
          - "all BOOKED reservations of this member -> CANCELLED"
          - "all OPEN InstructorAvailability windows of this member -> CANCELLED"
          - "all ASSIGNED|CONFIRMED DutyRosterSlot of this member with duty_date >= today -> CANCELLED"

  - entity: Aircraft
    initial_state: AIRWORTHY
    terminal_states: [RETIRED]
    transitions:
      - from: AIRWORTHY
        to: GROUNDED
        trigger: "system (ops-day close detects annual_due_date <= now or hours_since_inspection >= 100.0) OR POST /soaring/aircraft/{id}/ground"
        actor: "ClubAdmin | system"
        preconditions: []
        side_effects:
          - "grounded_reason set to ANNUAL_OVERDUE | INSPECTION_OVERDUE | MANUAL"
          - "all BOOKED reservations on this airframe with start_at > now -> CANCELLED"
          - "for each such cancelled reservation: if the reservation had instructor_id set, no availability change (availability windows are independent)"
          - "all TowSlot (kind=TOW_PLANE airframes only) in SCHEDULED with start_at > now -> CANCELLED, and their linked IN_FLIGHT|LANDED flights unaffected (flights already consumed the slot)"
      - from: GROUNDED
        to: AIRWORTHY
        trigger: "POST /soaring/aircraft/{id}/maintenance-records with kind=ANNUAL or INSPECTION_100H that restores currency, or POST /soaring/aircraft/{id}/unground after manual ground"
        actor: ClubAdmin
        preconditions:
          - "for system-grounded airframes: a MaintenanceRecord restoring currency must exist (ANNUAL sets annual_due_date = performed_at + 12 months; INSPECTION_100H resets hours_since_inspection = 0)"
          - "for MANUAL ground: unground endpoint directly"
        side_effects:
          - "grounded_reason cleared"
      - from: AIRWORTHY
        to: RETIRED
        trigger: "POST /soaring/aircraft/{id}/retire"
        actor: ClubAdmin
        preconditions:
          - "no Reservation with status CHECKED_OUT on this airframe (ERR_AIRCRAFT_IN_USE)"
        side_effects:
          - "all BOOKED reservations on this airframe -> CANCELLED"
          - "all SCHEDULED TowSlot on this airframe -> CANCELLED"

  - entity: Reservation
    initial_state: BOOKED
    terminal_states: [CLOSED, CANCELLED, NO_SHOW]
    transitions:
      - from: BOOKED
        to: CHECKED_OUT
        trigger: "POST /soaring/reservations/{id}/checkout"
        actor: "Member | DutyOfficer"
        preconditions:
          - "reservation.status == BOOKED (ERR_RESERVATION_NOT_BOOKED)"
          - "aircraft.status == AIRWORTHY (ERR_AIRCRAFT_NOT_AIRWORTHY)"
          - "member.status == ACTIVE (ERR_MEMBER_NOT_ACTIVE)"
          - "instructor (if instructor_id set) .status == ACTIVE (ERR_INSTRUCTOR_NOT_ACTIVE)"
          - "now within [start_at - 15min, end_at] (ERR_OUTSIDE_RESERVATION_WINDOW)"
        side_effects: []
      - from: CHECKED_OUT
        to: CLOSED
        trigger: "POST /soaring/flights/{id}/land on the Flight linked to this reservation (system: reservation closes when its flight is LANDED and reconciled via POST /soaring/flights/{id}/reconcile)"
        actor: "Member | DutyOfficer | system"
        preconditions:
          - "the linked Flight has status RECONCILED"
        side_effects:
          - "reservation.status -> CLOSED"
      - from: BOOKED
        to: CANCELLED
        trigger: "POST /soaring/reservations/{id}/cancel OR cascade (member suspend/resign, aircraft ground/retire)"
        actor: "Member | DutyOfficer | ClubAdmin | system"
        preconditions:
          - "reservation.status == BOOKED (ERR_RESERVATION_NOT_BOOKED)"
        side_effects:
          - "if cancellation is a member-initiated cancel with start_at - now < LATE_CANCEL_WINDOW_HOURS, member.account_balance_cents += LATE_CANCEL_FEE_CENTS"
      - from: BOOKED
        to: NO_SHOW
        trigger: "system (ops-day close: reservation still BOOKED and end_at < now)"
        actor: system
        preconditions: []
        side_effects:
          - "member.account_balance_cents += NO_SHOW_FEE_CENTS"

  - entity: Flight
    initial_state: IN_FLIGHT
    terminal_states: [RECONCILED, VOIDED]
    transitions:
      - from: IN_FLIGHT
        to: LANDED
        trigger: "POST /soaring/flights/{id}/land"
        actor: "Member | DutyOfficer"
        preconditions:
          - "flight.status == IN_FLIGHT (ERR_FLIGHT_NOT_IN_FLIGHT)"
          - "landed_at > takeoff_at (ERR_INVALID_FLIGHT_TIMES)"
        side_effects:
          - "flight_minutes computed"
          - "final_fee_cents computed via tow_fee_calculation (final variant)"
          - "airframe hours: glider total_time_hours += flight_minutes/60; hours_since_inspection += flight_minutes/60; tow plane total_time_hours += tow sortie time (fixed TOW_SORTIE_MINUTES/60) and hours_since_inspection likewise"
          - "member.account_balance_cents: provisional_fee_cents debit replaced by final_fee_cents debit (delta applied)"
          - "immediate currency re-check on both airframes: if the accrual pushed hours_since_inspection >= 100.0 (or annual_due_date <= now), the airframe grounds in-request (AIRWORTHY -> GROUNDED) and its grounding cascade fires: future BOOKED reservations on it -> CANCELLED, future SCHEDULED TowSlots (tow plane) -> CANCELLED"
      - from: LANDED
        to: RECONCILED
        trigger: "POST /soaring/flights/{id}/reconcile"
        actor: "DutyOfficer | ClubAdmin"
        preconditions:
          - "flight.status == LANDED (ERR_FLIGHT_NOT_LANDED)"
        side_effects:
          - "linked Reservation -> CLOSED"
          - "if flight was dual instructional (reservation.instructor_id set) and pilot is a student-tier member: student's dual-hour accumulator updated for StudentProgress.dual_hours_at_signoff"
      - from: IN_FLIGHT
        to: VOIDED
        trigger: "POST /soaring/flights/{id}/void"
        actor: "DutyOfficer | ClubAdmin"
        preconditions:
          - "flight.status == IN_FLIGHT (ERR_FLIGHT_NOT_IN_FLIGHT)"
        side_effects:
          - "provisional_fee_cents debit on member.account_balance_cents reversed"
          - "tow_slot.confirmed_count decremented by 1"
          - "if tow_slot.confirmed_count reaches 0 AND tow_slot.start_at > now: tow_slot -> CANCELLED"
          - "linked Reservation stays CHECKED_OUT (may re-launch)"

  - entity: TowSlot
    initial_state: SCHEDULED
    terminal_states: [CANCELLED]
    transitions:
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /soaring/tow-slots/{id}/cancel OR system cascade (tow plane grounded/retired, or confirmed_count reaches 0 via flight void with start_at > now)"
        actor: "TowPilot | ClubAdmin | system"
        preconditions:
          - "no Flight in IN_FLIGHT status linked to this slot (ERR_TOW_SLOT_IN_USE)"
        side_effects:
          - "all LANDED flights remain (historical); future launches blocked"

  - entity: DutyRosterSlot
    initial_state: ASSIGNED
    terminal_states: [COMPLETED, NO_SHOW, CANCELLED]
    transitions:
      - from: ASSIGNED
        to: CONFIRMED
        trigger: "POST /soaring/duty-roster/{id}/confirm"
        actor: Member
        preconditions:
          - "acting member is the slot's member_id (ERR_NOT_SLOT_OWNER)"
          - "slot.status == ASSIGNED (ERR_SLOT_NOT_ASSIGNED)"
        side_effects: []
      - from: ASSIGNED
        to: SWAP_PENDING
        trigger: "POST /soaring/duty-roster/{id}/propose-swap"
        actor: Member
        preconditions:
          - "acting member is the slot's member_id"
          - "target slot (swap_with_slot_id) status == ASSIGNED (ERR_SWAP_TARGET_NOT_ASSIGNED)"
          - "target slot's member_id != this slot's member_id (ERR_SWAP_SAME_MEMBER)"
        side_effects:
          - "swap_with_slot_id recorded"
      - from: SWAP_PENDING
        to: ASSIGNED
        trigger: "POST /soaring/duty-roster/{id}/accept-swap (member_ids exchanged between the two slots) OR POST /soaring/duty-roster/{id}/decline-swap (swap_with_slot_id cleared, no exchange)"
        actor: Member
        preconditions:
          - "accept: acting member is the target slot's member_id; both slots still ASSIGNED-or-this-SWAP_PENDING pair"
          - "decline: acting member is either slot's member_id"
        side_effects:
          - "accept: member_id values swapped between the two slots; both slots -> ASSIGNED; swap_with_slot_id cleared on both"
          - "decline: swap_with_slot_id cleared; status -> ASSIGNED"
      - from: CONFIRMED
        to: COMPLETED
        trigger: "system (ops-day close: slot CONFIRMED and duty_date < today)"
        actor: system
        preconditions: []
        side_effects: []
      - from: ASSIGNED
        to: NO_SHOW
        trigger: "system (ops-day close: slot still ASSIGNED and duty_date < today — never confirmed)"
        actor: system
        preconditions: []
        side_effects:
          - "member.account_balance_cents += DUTY_NO_SHOW_FEE_CENTS"

  - entity: InstructorAvailability
    initial_state: OPEN
    terminal_states: [CANCELLED]
    transitions:
      - from: OPEN
        to: CANCELLED
        trigger: "POST /soaring/instructor-availability/{id}/cancel OR cascade (member resign)"
        actor: "Instructor | ClubAdmin | system"
        preconditions: []
        side_effects: []

  - entity: StudentProgress
    initial_state: PENDING
    terminal_states: [VERIFIED, REJECTED]
    transitions:
      - from: PENDING
        to: SIGNED_OFF
        trigger: "POST /soaring/student-progress/{id}/signoff"
        actor: Instructor
        preconditions:
          - "acting instructor is the record's instructor_id (ERR_NOT_ENDORSING_INSTRUCTOR)"
          - "record.status == PENDING (ERR_PROGRESS_NOT_PENDING)"
          - "for SOLO_SIGNOFF: student_solo_eligibility passes (dual hours >= MIN_DUAL_HOURS and at least one dual flight in trailing SOLO_RECENCY_DAYS)"
        side_effects:
          - "dual_hours_at_signoff snapshotted from student's accumulator"
          - "signed_off_at set"
      - from: SIGNED_OFF
        to: VERIFIED
        trigger: "POST /soaring/student-progress/{id}/verify"
        actor: ClubAdmin
        preconditions:
          - "record.status == SIGNED_OFF (ERR_PROGRESS_NOT_SIGNED_OFF)"
        side_effects:
          - "if kind == SOLO_SIGNOFF: student.solo_endorsed = true"
          - "if kind is BADGE_*: student.badge_level recomputed as highest VERIFIED badge"
      - from: SIGNED_OFF
        to: PENDING
        trigger: "POST /soaring/student-progress/{id}/return-for-rework"
        actor: ClubAdmin
        preconditions:
          - "record.status == SIGNED_OFF"
        side_effects:
          - "signed_off_at cleared to null (rework loop; may be signed off again)"
      - from: PENDING
        to: REJECTED
        trigger: "POST /soaring/student-progress/{id}/reject"
        actor: ClubAdmin
        preconditions:
          - "record.status == PENDING"
        side_effects: []

  - entity: RetrieveRequest
    initial_state: REQUESTED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: REQUESTED
        to: CREW_ASSIGNED
        trigger: "POST /soaring/retrieves/{id}/assign-crew"
        actor: "DutyOfficer | ClubAdmin"
        preconditions:
          - "retrieve.status == REQUESTED (ERR_RETRIEVE_NOT_REQUESTED)"
          - "crew member status == ACTIVE"
        side_effects:
          - "crew_member_id set"
      - from: CREW_ASSIGNED
        to: COMPLETED
        trigger: "POST /soaring/retrieves/{id}/complete"
        actor: "DutyOfficer | ClubAdmin"
        preconditions:
          - "retrieve.status == CREW_ASSIGNED (ERR_RETRIEVE_NOT_ASSIGNED)"
        side_effects:
          - "pilot_share_cents debited to the pilot member's account_balance_cents"
      - from: REQUESTED
        to: CANCELLED
        trigger: "POST /soaring/retrieves/{id}/cancel"
        actor: "DutyOfficer | ClubAdmin"
        preconditions:
          - "retrieve.status == REQUESTED"
        side_effects: []

# =============================================================================
# §1.2.1 Concurrency Rules (OCC)
# =============================================================================
concurrency_rules:
  - rule_id: flight-post-stale-tow-slot
    parent_entity: TowSlot
    write_endpoint: "POST /soaring/flights"
    occ_field: expected_tow_slot_version
    description: |
      Posting a Flight against a TowSlot whose version has advanced since the
      client last observed it is rejected. Posting a flight legitimately
      advances tow_slot.version (confirmed_count increment), so a second
      create carrying the previously observed version is stale even though
      the slot may still have capacity.
    error_id: ERR_STALE_TOW_SLOT_VERSION
    http_status: 412

  - rule_id: reservation-create-stale-aircraft
    parent_entity: Aircraft
    write_endpoint: "POST /soaring/reservations"
    occ_field: expected_aircraft_version
    description: |
      Creating a Reservation against a glider whose version has advanced
      since the client last observed it is rejected. An earlier reservation's
      checkout/close legitimately mutates the airframe (total_time_hours
      accrual, version bump), so a create carrying the old version is based
      on a stale view of fleet availability.
    error_id: ERR_STALE_AIRCRAFT_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: tow_fee_calculation
    trigger: "flight posting (provisional variant) and flight landing (final variant)"
    algorithm: tiered_pricing
    formula: |
      base_by_release_altitude (tow to release_altitude_ft):
        altitude < 2000            -> 3000 cents
        2000 <= altitude < 3000    -> 3800 cents
        3000 <= altitude < 5000    -> 4600 cents
        altitude >= 5000           -> 5500 cents
      PROVISIONAL variant (at POST /soaring/flights):
        provisional_fee_cents = round_half_up(base * (1 - tier.tow_fee_discount_pct))
        -- uses only release altitude and tier discount; ignores included-tow quota
      FINAL variant (at POST /soaring/flights/{id}/land):
        1. count prior RECONCILED flights of this member in the same calendar month
           as takeoff_at (boundary: same UTC year-month), including the current
           flight's position in created_at order — the current flight is the
           (count+1)-th tow of the month
        2. if (count+1) <= tier.included_tows_per_month: gross = 0
           else: gross = base_by_release_altitude
        3. surcharge for long flights: if flight_minutes > 60, add
           SOAR_SURCHARGE_CENTS per commenced 30-minute block beyond 60 minutes
           (blocks = ceil((flight_minutes - 60) / 30)); if flight_minutes <= 60, surcharge = 0
        4. final_fee_cents = round_half_up(gross * (1 - tier.tow_fee_discount_pct)) + surcharge
        -- rounding order pinned: discount applied to gross FIRST (rounded to
           whole cents), THEN integer surcharge added; surcharge is never discounted
    input_set: "Flight.release_altitude_ft, flight_minutes; Member.tier (MembershipTier fields); prior RECONCILED flights same member same UTC month"
    constants:
      TIER1_CEILING_FT: 2000
      TIER2_CEILING_FT: 3000
      TIER3_CEILING_FT: 5000
      TIER1_CENTS: 3000
      TIER2_CENTS: 3800
      TIER3_CENTS: 4600
      TIER4_CENTS: 5500
      SOAR_SURCHARGE_CENTS: 400
      SOAR_SURCHARGE_BLOCK_MIN: 30
      SOAR_FREE_MINUTES: 60
    precision: "integer cents, round_half_up at the discount step only"
    variants:
      - name: provisional
        when: "at flight posting (POST /soaring/flights)"
        difference: "ignores included-tow monthly quota and soaring surcharge; always base * (1 - discount)"
      - name: final
        when: "at flight landing (POST /soaring/flights/{id}/land)"
        difference: "applies included-tow quota by monthly chronological position and adds non-discounted soaring surcharge"

  - name: monthly_dues_posting
    trigger: "ops-day close (POST /soaring/ops-day/close) on the first close executed for a calendar month (UTC)"
    algorithm: aggregation
    formula: |
      FORWARD variant (default — post for the month containing the close date):
        for each Member with status ACTIVE or SUSPENDED (RESIGNED excluded):
          debit = tier.monthly_dues_cents
          account_balance_cents += debit
        EXCEPTION: a member whose pending_dues_cents is set (mid-month tier
        change) is charged pending_dues_cents INSTEAD of the forward debit for
        that month, and pending_dues_cents is reset to 0.
      PRORATED variant (tier change mid-month — POST /soaring/members/{id}/tier):
        when a member changes tier mid-month, the CURRENT month's dues are
        recomputed as a pro-rata blend, charged at next ops-day close:
          days_in_month = calendar days of the tier-change month (UTC)
          days_on_old = day-of-month of change - 1
          days_on_new = days_in_month - days_on_old
          blended_cents = floor(old_dues * days_on_old / days_in_month)
                        + round_half_up(new_dues * days_on_new / days_in_month)
        -- the two halves use DIFFERENT rounding (floor on old, round_half_up
           on new) and the change-day itself bills to the NEW tier
      The member's pending_dues_cents field is set at tier change and swept
      into account_balance_cents at the next ops-day close.
    input_set: "Members with status in {ACTIVE, SUSPENDED}; tier change records for PRORATED"
    constants:
      ARREARS_THRESHOLD_CENTS: 20000
    precision: "integer cents; floor for old-tier half, round_half_up for new-tier half"
    variants:
      - name: forward
        when: "regular monthly posting at ops-day close"
        difference: "full monthly dues for the close-date month"
      - name: prorated
        when: "member changed tier during the month"
        difference: "day-weighted blend with asymmetric rounding; change-day bills to new tier"

  - name: aircraft_currency_check
    trigger: "ops-day close sweep AND inline on reservation checkout"
    algorithm: threshold
    formula: |
      airworthy requires BOTH:
        hours_since_inspection < 100.0          (strict less-than; exactly 100.0 fails)
        annual_due_date > now                    (strict greater-than; equal fails)
      if either fails at ops-day close: Aircraft AIRWORTHY -> GROUNDED
      with grounded_reason INSPECTION_OVERDUE (hours) or ANNUAL_OVERDUE (date);
      INSPECTION_OVERDUE wins when both fail on the same sweep.
    input_set: "Aircraft.status == AIRWORTHY, kind any (both gliders and tow planes)"
    constants:
      INSPECTION_INTERVAL_HOURS: 100.0
    precision: "hours compared as exact decimal; timestamps compared to the second"

  - name: tow_slot_load
    trigger: "flight posting and flight void"
    algorithm: aggregation
    formula: |
      tow_slot.confirmed_count = count of Flight with tow_slot_id == slot.id
        AND status IN {IN_FLIGHT, LANDED, RECONCILED}
      posting a flight: precondition confirmed_count < capacity
        (exactly capacity - 1 free succeeds; exactly capacity fails — strict <)
      voiding an IN_FLIGHT flight: confirmed_count -= 1; if result == 0 AND
        slot.start_at > now, slot auto-cancels (cascade link)
    input_set: "Flights by tow_slot_id with status filter"
    constants: {}

  - name: student_solo_eligibility
    trigger: "StudentProgress signoff when kind == SOLO_SIGNOFF"
    algorithm: threshold
    formula: |
      eligible when ALL of:
        dual_hours_total >= MIN_DUAL_HOURS
        exists at least one RECONCILED dual instructional flight with
          takeoff_at >= (now - SOLO_RECENCY_DAYS days)
        student.status == ACTIVE
        student tier has student_tier == true
      dual_hours_total = sum of flight_minutes/60 over RECONCILED flights
        where reservation.instructor_id is not null and pilot == student
      -- non-linear: recency gate is a hard boolean over a windowed subset,
         hour total is a cumulative threshold over the full history
    input_set: "RECONCILED flights of the student with instructor set"
    constants:
      MIN_DUAL_HOURS: 10.0
      SOLO_RECENCY_DAYS: 90

  - name: retrieve_cost_split
    trigger: "RetrieveRequest creation"
    algorithm: tiered_pricing
    formula: |
      total_cost_cents = RETRIEVE_BASE_CENTS + ceil(distance_km) * RETRIEVE_PER_KM_CENTS
      pilot share by distance band (marginal-band allocation):
        first BAND1_KM km:        pilot pays 100% of that band's cost
        next  BAND2_KM km:        pilot pays 50%  of that band's cost
        beyond BAND1+BAND2:       pilot pays 0%   (club absorbs)
      Band costs are computed by allocating total_cost_cents across bands
      proportionally to band kilometre widths BEFORE applying pilot share:
        band_cost(b) = round_half_up(total_cost_cents * band_width(b) / distance_km)
      pilot_share_cents = band1_cost + round_half_up(band2_cost * 0.5)
      club_share_cents  = total_cost_cents - pilot_share_cents
      -- evaluation order pinned: total -> band allocation (rounded per band)
         -> shares; club share is the residual so total is always conserved
    input_set: "RetrieveRequest.distance_km"
    constants:
      RETRIEVE_BASE_CENTS: 5000
      RETRIEVE_PER_KM_CENTS: 120
      BAND1_KM: 50
      BAND2_KM: 100
    precision: "integer cents, round_half_up; club_share is residual (conservation)"

  - name: badge_level_recompute
    trigger: "StudentProgress verify when kind is BADGE_*"
    algorithm: aggregation
    formula: |
      badge_level = highest-ranked badge among VERIFIED StudentProgress of the student
      rank order: BADGE_A < BADGE_B < BADGE_C < BADGE_BRONZE < BADGE_SILVER
      if none VERIFIED: NONE
    input_set: "StudentProgress with status VERIFIED, kind BADGE_*"
    constants: {}

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present; role is one of the declared roles"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT
    http_status: 400
    applies_to: "all endpoints"

  - priority: 2
    category: auth
    check: "acting role is permitted for the endpoint per §1.7"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all endpoints"

  - priority: 3
    category: existence
    check: "path and body-referenced resources exist (member, tier, aircraft, reservation, flight, tow slot, duty slot, availability window, progress record, retrieve)"
    error_id: ERR_RESOURCE_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with resource ids"

  - priority: 4
    category: state
    check: "target resource state permits the operation (e.g., reservation BOOKED for checkout, flight IN_FLIGHT for land, slot SCHEDULED)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 5
    category: state
    check: "member-side state gates: pilot/instructor/crew member.status == ACTIVE for flight-side operations; paying member must not be RESIGNED; student must be ACTIVE at solo signoff"
    error_id: ERR_MEMBER_NOT_ACTIVE
    http_status: 409
    applies_to: "reservation create/checkout, flight posting, retrieve crew assignment, member payments, student-progress signoff"

  - priority: 6
    category: business_safety
    check: "aircraft airworthiness: aircraft.status == AIRWORTHY AND inline currency check passes (hours_since_inspection < 100.0 AND annual_due_date > now) at checkout"
    error_id: ERR_AIRCRAFT_NOT_AIRWORTHY
    http_status: 409
    applies_to: "reservation checkout, flight posting"

  - priority: 7
    category: business_temporal
    check: "temporal windows: reservation window valid (start_at < end_at, start_at >= now - grace); checkout within [start_at - 15min, end_at]; flight times ordered"
    error_id: ERR_INVALID_TIME_WINDOW
    http_status: 422
    applies_to: "reservation create, reservation checkout, flight land"

  - priority: 8
    category: business_temporal
    check: "glider overlap: no other Reservation with status IN {BOOKED, CHECKED_OUT} on same aircraft with half-open interval intersection [start_at, end_at); touching endpoints (a.end_at == b.start_at) do NOT overlap"
    error_id: ERR_GLIDER_OVERLAP
    http_status: 409
    applies_to: "reservation create"

  - priority: 9
    category: business_temporal
    check: "instructor double-booking with buffer: if instructor_id set, no other Reservation in {BOOKED, CHECKED_OUT} for same instructor whose window is within INSTRUCTOR_BUFFER_MIN minutes on either side (buffered intervals overlap when gap < 30 min; exactly 30 min gap is allowed)"
    error_id: ERR_INSTRUCTOR_DOUBLE_BOOKED
    http_status: 409
    applies_to: "reservation create"

  - priority: 10
    category: business_temporal
    check: "instructor availability coverage: if instructor_id set, an OPEN InstructorAvailability window of that instructor fully covers [start_at, end_at]"
    error_id: ERR_INSTRUCTOR_UNAVAILABLE
    http_status: 409
    applies_to: "reservation create"

  - priority: 11
    category: business_constraint
    check: "tow slot capacity: tow_slot.confirmed_count < tow_slot.capacity at flight posting"
    error_id: ERR_TOW_SLOT_FULL
    http_status: 409
    applies_to: "flight posting"

  - priority: 12
    category: business_constraint
    check: "reservation-towslot coherence at flight posting: flight.takeoff_at within tow slot [start_at, end_at]; tow slot status SCHEDULED; reservation status CHECKED_OUT"
    error_id: ERR_TOW_SLOT_MISMATCH
    http_status: 409
    applies_to: "flight posting"

  - priority: 12
    category: business_constraint
    check: "retrieve create requires the referenced flight to be landed out: flight.status IN {LANDED, RECONCILED} and no existing non-terminal RetrieveRequest for the same flight"
    error_id: ERR_RETRIEVE_FLIGHT_NOT_LANDED_OUT
    http_status: 409
    applies_to: "retrieve create"

  - priority: 13
    category: business_constraint
    check: "duty swap integrity: swap target ASSIGNED, different member, and not itself SWAP_PENDING with a different partner"
    error_id: ERR_SWAP_INVALID
    http_status: 409
    applies_to: "propose-swap, accept-swap"

  - priority: 14
    category: business_fiscal
    check: "no-show / late-cancel fees and dues postings always apply; payments may not exceed |account_balance_cents| when balance is negative (overpayment into credit beyond CREDIT_CAP rejected)"
    error_id: ERR_CREDIT_CAP_EXCEEDED
    http_status: 402
    applies_to: "member payments"

  - priority: 15
    category: business_referential
    check: "enum + type integrity: aircraft kind GLIDER for reservations, TOW_PLANE for tow slots; tier student_tier=true for StudentProgress creation; instructor is_instructor=true; tow pilot is_tow_pilot=true"
    error_id: ERR_REFERENTIAL_INTEGRITY
    http_status: 422
    applies_to: "reservation create, tow slot create, student progress create"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- logical clock (test-driving) ---
  - method: POST
    path: "/soaring/_clock/set_current_utc"
    description: "Set the server's logical clock. Before any call, the logical clock reads exactly 2026-08-01T00:00:00Z and never falls back to wall-clock time."
    roles: [ClubAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: []

  # --- MembershipTier ---
  - method: POST
    path: "/soaring/tiers"
    description: "Create a membership tier"
    roles: [ClubAdmin]
    code: 201
    input: [tier_code, monthly_dues_cents, tow_fee_discount_pct, included_tows_per_month, "student_tier?"]
    output: MembershipTier
    side_effects: []

  - method: GET
    path: "/soaring/tiers"
    description: "List membership tiers"
    roles: [ClubAdmin, Member, DutyOfficer, Instructor, TowPilot]
    code: 200
    input: ["limit?", "offset?"]
    output: "MembershipTier[]"
    side_effects: []

  - method: GET
    path: "/soaring/tiers/{id}"
    description: "Get a membership tier"
    roles: [ClubAdmin, Member, DutyOfficer, Instructor, TowPilot]
    code: 200
    input: []
    output: MembershipTier
    side_effects: []

  # --- Member ---
  - method: POST
    path: "/soaring/members"
    description: "Register a member"
    roles: [ClubAdmin]
    code: 201
    input: [full_name, tier_id, "is_instructor?", "is_tow_pilot?"]
    output: Member
    side_effects: ["status=ACTIVE, account_balance_cents=0, badge_level=NONE, solo_endorsed=false"]

  - method: GET
    path: "/soaring/members"
    description: "List members (filterable)"
    roles: [ClubAdmin, Member, DutyOfficer, Instructor, TowPilot]
    code: 200
    input: ["tier_id?", "status?", "limit?", "offset?"]
    output: "Member[]"
    side_effects: []

  - method: GET
    path: "/soaring/members/{id}"
    description: "Get a member"
    roles: [ClubAdmin, Member, DutyOfficer, Instructor, TowPilot]
    code: 200
    input: []
    output: Member
    side_effects: []

  - method: POST
    path: "/soaring/members/{id}/tier"
    description: "Change a member's tier (prorated dues scheduled)"
    roles: [ClubAdmin]
    code: 200
    input: [tier_id]
    output: Member
    side_effects: ["pending_dues_cents computed per monthly_dues_posting PRORATED variant"]

  - method: POST
    path: "/soaring/members/{id}/payments"
    description: "Record a payment against the member account"
    roles: [Member, ClubAdmin]
    code: 201
    input: [amount_cents]
    output: Member
    side_effects: ["account_balance_cents -= amount_cents; if SUSPENDED with reason ARREARS and resulting balance < ARREARS_THRESHOLD_CENTS: status -> ACTIVE"]

  - method: POST
    path: "/soaring/members/{id}/suspend"
    description: "Manually suspend a member"
    roles: [ClubAdmin]
    code: 200
    input: []
    output: Member
    side_effects: ["status -> SUSPENDED (MANUAL); future BOOKED reservations cancelled"]

  - method: POST
    path: "/soaring/members/{id}/resign"
    description: "Resign a member"
    roles: [Member, ClubAdmin]
    code: 200
    input: []
    output: Member
    side_effects: ["status -> RESIGNED; BOOKED reservations, OPEN availability, future duty slots cancelled"]

  # --- Aircraft ---
  - method: POST
    path: "/soaring/aircraft"
    description: "Register an airframe"
    roles: [ClubAdmin]
    code: 201
    input: [registration, kind, annual_due_date]
    output: Aircraft
    side_effects: ["status=AIRWORTHY, total_time_hours=0, hours_since_inspection=0"]

  - method: GET
    path: "/soaring/aircraft"
    description: "List aircraft (filterable)"
    roles: [ClubAdmin, Member, DutyOfficer, Instructor, TowPilot]
    code: 200
    input: ["kind?", "status?", "limit?", "offset?"]
    output: "Aircraft[]"
    side_effects: []

  - method: GET
    path: "/soaring/aircraft/{id}"
    description: "Get an airframe"
    roles: [ClubAdmin, Member, DutyOfficer, Instructor, TowPilot]
    code: 200
    input: []
    output: Aircraft
    side_effects: []

  - method: POST
    path: "/soaring/aircraft/{id}/ground"
    description: "Manually ground an airframe"
    roles: [ClubAdmin]
    code: 200
    input: []
    output: Aircraft
    side_effects: ["status -> GROUNDED (MANUAL); future BOOKED reservations cancelled; SCHEDULED tow slots (tow planes) cancelled"]

  - method: POST
    path: "/soaring/aircraft/{id}/unground"
    description: "Return a manually grounded airframe to service"
    roles: [ClubAdmin]
    code: 200
    input: []
    output: Aircraft
    side_effects: ["status -> AIRWORTHY; grounded_reason cleared; only valid when grounded_reason == MANUAL"]

  - method: POST
    path: "/soaring/aircraft/{id}/retire"
    description: "Retire an airframe"
    roles: [ClubAdmin]
    code: 200
    input: []
    output: Aircraft
    side_effects: ["status -> RETIRED; BOOKED reservations and SCHEDULED tow slots cancelled"]

  - method: POST
    path: "/soaring/aircraft/{id}/maintenance-records"
    description: "Log a maintenance record (100h inspection / annual / repair)"
    roles: [ClubAdmin]
    code: 201
    input: [kind, performed_at, hobbs_hours_at_service, "notes?"]
    output: MaintenanceRecord
    side_effects: ["INSPECTION_100H: hours_since_inspection=0; ANNUAL: annual_due_date = performed_at + 12 months; if currency restored and grounded_reason != MANUAL: status -> AIRWORTHY"]

  - method: GET
    path: "/soaring/aircraft/{id}/maintenance-records"
    description: "List maintenance records for an airframe"
    roles: [ClubAdmin, Member, DutyOfficer, Instructor, TowPilot]
    code: 200
    input: ["limit?", "offset?"]
    output: "MaintenanceRecord[]"
    side_effects: []

  # --- InstructorAvailability ---
  - method: POST
    path: "/soaring/instructor-availability"
    description: "Publish an instructor availability window"
    roles: [Instructor, ClubAdmin]
    code: 201
    input: [instructor_id, start_at, end_at]
    output: InstructorAvailability
    side_effects: []

  - method: GET
    path: "/soaring/instructor-availability"
    description: "List availability windows"
    roles: [ClubAdmin, Member, DutyOfficer, Instructor, TowPilot]
    code: 200
    input: ["instructor_id?", "limit?", "offset?"]
    output: "InstructorAvailability[]"
    side_effects: []

  - method: GET
    path: "/soaring/instructor-availability/{id}"
    description: "Get an availability window"
    roles: [ClubAdmin, Member, DutyOfficer, Instructor, TowPilot]
    code: 200
    input: []
    output: InstructorAvailability
    side_effects: []

  - method: POST
    path: "/soaring/instructor-availability/{id}/cancel"
    description: "Cancel an availability window"
    roles: [Instructor, ClubAdmin]
    code: 200
    input: []
    output: InstructorAvailability
    side_effects: ["status -> CANCELLED"]

  # --- Reservation ---
  - method: POST
    path: "/soaring/reservations"
    description: "Create a glider reservation (OCC on aircraft version)"
    roles: [Member, DutyOfficer, ClubAdmin]
    code: 201
    input: [aircraft_id, member_id, "instructor_id?", start_at, end_at, expected_aircraft_version]
    output: Reservation
    side_effects: ["increments Aircraft.version by 1", "validates overlap (half-open), instructor buffer, availability coverage, aircraft airworthiness"]

  - method: GET
    path: "/soaring/reservations"
    description: "List reservations (filterable)"
    roles: [ClubAdmin, Member, DutyOfficer, Instructor, TowPilot]
    code: 200
    input: ["aircraft_id?", "member_id?", "instructor_id?", "status?", "limit?", "offset?"]
    output: "Reservation[]"
    side_effects: []

  - method: GET
    path: "/soaring/reservations/{id}"
    description: "Get a reservation"
    roles: [ClubAdmin, Member, DutyOfficer, Instructor, TowPilot]
    code: 200
    input: []
    output: Reservation
    side_effects: []

  - method: POST
    path: "/soaring/reservations/{id}/checkout"
    description: "Check out a reserved glider for launch"
    roles: [Member, DutyOfficer]
    code: 200
    input: []
    output: Reservation
    side_effects: ["status -> CHECKED_OUT; airframe and member state gates enforced"]

  - method: POST
    path: "/soaring/reservations/{id}/cancel"
    description: "Cancel a BOOKED reservation"
    roles: [Member, DutyOfficer, ClubAdmin]
    code: 200
    input: []
    output: Reservation
    side_effects: ["status -> CANCELLED; late-cancel fee if within LATE_CANCEL_WINDOW_HOURS of start_at"]

  # --- TowSlot ---
  - method: POST
    path: "/soaring/tow-slots"
    description: "Schedule a tow plane slot"
    roles: [ClubAdmin, TowPilot]
    code: 201
    input: [tow_plane_id, tow_pilot_id, start_at, end_at, capacity]
    output: TowSlot
    side_effects: ["status=SCHEDULED, confirmed_count=0"]

  - method: GET
    path: "/soaring/tow-slots"
    description: "List tow slots"
    roles: [ClubAdmin, Member, DutyOfficer, Instructor, TowPilot]
    code: 200
    input: ["tow_plane_id?", "tow_pilot_id?", "status?", "limit?", "offset?"]
    output: "TowSlot[]"
    side_effects: []

  - method: GET
    path: "/soaring/tow-slots/{id}"
    description: "Get a tow slot"
    roles: [ClubAdmin, Member, DutyOfficer, Instructor, TowPilot]
    code: 200
    input: []
    output: TowSlot
    side_effects: []

  - method: POST
    path: "/soaring/tow-slots/{id}/cancel"
    description: "Cancel a tow slot"
    roles: [TowPilot, ClubAdmin]
    code: 200
    input: []
    output: TowSlot
    side_effects: ["status -> CANCELLED; blocked when IN_FLIGHT flights linked"]

  # --- Flight ---
  - method: POST
    path: "/soaring/flights"
    description: "Post a launch (creates Flight IN_FLIGHT, computes provisional fee)"
    roles: [Member, DutyOfficer, TowPilot]
    code: 201
    input: [reservation_id, tow_slot_id, release_altitude_ft, takeoff_at, expected_tow_slot_version]
    output: Flight
    side_effects: ["provisional_fee_cents computed (provisional variant); account_balance_cents += provisional_fee_cents; tow_slot.confirmed_count += 1; increments TowSlot.version by 1; tow slot capacity check"]

  - method: GET
    path: "/soaring/flights"
    description: "List flights (launch log)"
    roles: [ClubAdmin, Member, DutyOfficer, Instructor, TowPilot]
    code: 200
    input: ["reservation_id?", "tow_slot_id?", "retrieve_id?", "status?", "limit?", "offset?"]
    output: "Flight[]"
    side_effects: []

  - method: GET
    path: "/soaring/flights/{id}"
    description: "Get a flight"
    roles: [ClubAdmin, Member, DutyOfficer, Instructor, TowPilot]
    code: 200
    input: []
    output: Flight
    side_effects: []

  - method: POST
    path: "/soaring/flights/{id}/land"
    description: "Log landing; computes final fee and accrues airframe hours"
    roles: [Member, DutyOfficer]
    code: 200
    input: [landed_at]
    output: Flight
    side_effects: ["status -> LANDED; flight_minutes computed; final_fee_cents computed (final variant); balance delta applied; airframe hours accrued on glider and tow plane"]

  - method: POST
    path: "/soaring/flights/{id}/reconcile"
    description: "Reconcile a landed flight into the launch log"
    roles: [DutyOfficer, ClubAdmin]
    code: 200
    input: []
    output: Flight
    side_effects: ["status -> RECONCILED; linked reservation -> CLOSED; student dual-hour accumulator updated if instructional"]

  - method: POST
    path: "/soaring/flights/{id}/void"
    description: "Void an IN_FLIGHT flight (false launch)"
    roles: [DutyOfficer, ClubAdmin]
    code: 200
    input: []
    output: Flight
    side_effects: ["status -> VOIDED; provisional debit reversed; tow_slot.confirmed_count -= 1; slot auto-cancels if count reaches 0 and slot is in the future"]

  # --- DutyRosterSlot ---
  - method: POST
    path: "/soaring/duty-roster"
    description: "Assign a duty officer slot"
    roles: [ClubAdmin]
    code: 201
    input: [duty_date, member_id]
    output: DutyRosterSlot
    side_effects: ["status=ASSIGNED"]

  - method: GET
    path: "/soaring/duty-roster"
    description: "List duty roster slots"
    roles: [ClubAdmin, Member, DutyOfficer, Instructor, TowPilot]
    code: 200
    input: ["member_id?", "status?", "swap_with_slot_id?", "limit?", "offset?"]
    output: "DutyRosterSlot[]"
    side_effects: []

  - method: GET
    path: "/soaring/duty-roster/{id}"
    description: "Get a duty roster slot"
    roles: [ClubAdmin, Member, DutyOfficer, Instructor, TowPilot]
    code: 200
    input: []
    output: DutyRosterSlot
    side_effects: []

  - method: POST
    path: "/soaring/duty-roster/{id}/confirm"
    description: "Duty officer confirms their slot"
    roles: [Member]
    code: 200
    input: []
    output: DutyRosterSlot
    side_effects: ["status -> CONFIRMED"]

  - method: POST
    path: "/soaring/duty-roster/{id}/propose-swap"
    description: "Propose swapping duty with another slot"
    roles: [Member]
    code: 200
    input: [swap_with_slot_id]
    output: DutyRosterSlot
    side_effects: ["status -> SWAP_PENDING; swap_with_slot_id recorded"]

  - method: POST
    path: "/soaring/duty-roster/{id}/accept-swap"
    description: "Target slot's member accepts the swap"
    roles: [Member]
    code: 200
    input: []
    output: DutyRosterSlot
    side_effects: ["member_ids exchanged between the paired slots; both -> ASSIGNED"]

  - method: POST
    path: "/soaring/duty-roster/{id}/decline-swap"
    description: "Decline a proposed swap"
    roles: [Member]
    code: 200
    input: []
    output: DutyRosterSlot
    side_effects: ["status -> ASSIGNED; swap_with_slot_id cleared"]

  # --- StudentProgress ---
  - method: POST
    path: "/soaring/student-progress"
    description: "Open a student progression record"
    roles: [Instructor, ClubAdmin]
    code: 201
    input: [student_id, instructor_id, kind]
    output: StudentProgress
    side_effects: ["status=PENDING"]

  - method: GET
    path: "/soaring/student-progress"
    description: "List progression records"
    roles: [ClubAdmin, Member, DutyOfficer, Instructor, TowPilot]
    code: 200
    input: ["student_id?", "instructor_id?", "status?", "kind?", "limit?", "offset?"]
    output: "StudentProgress[]"
    side_effects: []

  - method: GET
    path: "/soaring/student-progress/{id}"
    description: "Get a progression record"
    roles: [ClubAdmin, Member, DutyOfficer, Instructor, TowPilot]
    code: 200
    input: []
    output: StudentProgress
    side_effects: []

  - method: POST
    path: "/soaring/student-progress/{id}/signoff"
    description: "Instructor signs off the record"
    roles: [Instructor]
    code: 200
    input: []
    output: StudentProgress
    side_effects: ["status -> SIGNED_OFF; dual_hours_at_signoff snapshot; solo eligibility gate for SOLO_SIGNOFF"]

  - method: POST
    path: "/soaring/student-progress/{id}/verify"
    description: "Club admin verifies a signed-off record"
    roles: [ClubAdmin]
    code: 200
    input: []
    output: StudentProgress
    side_effects: ["status -> VERIFIED; solo_endorsed / badge_level recomputed"]

  - method: POST
    path: "/soaring/student-progress/{id}/return-for-rework"
    description: "Return a signed-off record to PENDING"
    roles: [ClubAdmin]
    code: 200
    input: []
    output: StudentProgress
    side_effects: ["status -> PENDING; signed_off_at cleared"]

  - method: POST
    path: "/soaring/student-progress/{id}/reject"
    description: "Reject a pending record"
    roles: [ClubAdmin]
    code: 200
    input: []
    output: StudentProgress
    side_effects: ["status -> REJECTED"]

  # --- RetrieveRequest ---
  - method: POST
    path: "/soaring/retrieves"
    description: "File a cross-country retrieve request for a landed-out flight"
    roles: [Member, DutyOfficer, ClubAdmin]
    code: 201
    input: [flight_id, distance_km]
    output: RetrieveRequest
    side_effects: ["pilot_share_cents / club_share_cents computed via retrieve_cost_split; flight.retrieve_id set"]

  - method: GET
    path: "/soaring/retrieves"
    description: "List retrieve requests"
    roles: [ClubAdmin, Member, DutyOfficer, Instructor, TowPilot]
    code: 200
    input: ["flight_id?", "crew_member_id?", "status?", "limit?", "offset?"]
    output: "RetrieveRequest[]"
    side_effects: []

  - method: GET
    path: "/soaring/retrieves/{id}"
    description: "Get a retrieve request"
    roles: [ClubAdmin, Member, DutyOfficer, Instructor, TowPilot]
    code: 200
    input: []
    output: RetrieveRequest
    side_effects: []

  - method: POST
    path: "/soaring/retrieves/{id}/assign-crew"
    description: "Assign retrieve crew"
    roles: [DutyOfficer, ClubAdmin]
    code: 200
    input: [crew_member_id]
    output: RetrieveRequest
    side_effects: ["status -> CREW_ASSIGNED"]

  - method: POST
    path: "/soaring/retrieves/{id}/complete"
    description: "Complete a retrieve; pilot share debited"
    roles: [DutyOfficer, ClubAdmin]
    code: 200
    input: []
    output: RetrieveRequest
    side_effects: ["status -> COMPLETED; pilot_share_cents debited to pilot account_balance_cents"]

  - method: POST
    path: "/soaring/retrieves/{id}/cancel"
    description: "Cancel a retrieve request"
    roles: [DutyOfficer, ClubAdmin]
    code: 200
    input: []
    output: RetrieveRequest
    side_effects: ["status -> CANCELLED"]

  # --- Ops-day close (epoch advance) ---
  - method: POST
    path: "/soaring/ops-day/close"
    description: "Close the ops day: posts dues on first close of the UTC month, sweeps aircraft currency (auto-ground), marks reservation NO_SHOWs, finalizes duty roster (COMPLETED/NO_SHOW), applies pending prorated dues"
    roles: [ClubAdmin]
    code: 200
    input: []
    output: { dues_posted_count: integer, aircraft_grounded_ids: "string[]", no_show_reservation_ids: "string[]", duty_finalized_ids: "string[]" }
    side_effects: ["monthly_dues_posting (forward + pending prorated)", "aircraft_currency_check sweep", "BOOKED reservations with end_at < now -> NO_SHOW + fee", "duty slots: CONFIRMED past-date -> COMPLETED; ASSIGNED past-date -> NO_SHOW + fee", "auto-suspend members at/above arrears threshold"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT, http: 400, condition: "X-User-ID or X-User-Role header missing or role unknown" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Acting role not permitted for this endpoint" }
  - { id: ERR_RESOURCE_NOT_FOUND, http: 404, condition: "Referenced resource id does not exist" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Generic state precondition failure for the target resource" }
  - { id: ERR_RESERVATION_NOT_BOOKED, http: 409, condition: "Checkout/cancel requires reservation status BOOKED" }
  - { id: ERR_MEMBER_NOT_ACTIVE, http: 409, condition: "Pilot/instructor/crew member status is not ACTIVE" }
  - { id: ERR_MEMBER_IN_FLIGHT, http: 409, condition: "Member cannot resign while a flight is IN_FLIGHT" }
  - { id: ERR_INSTRUCTOR_NOT_ACTIVE, http: 409, condition: "Assigned instructor member status is not ACTIVE" }
  - { id: ERR_AIRCRAFT_NOT_AIRWORTHY, http: 409, condition: "Aircraft GROUNDED/RETIRED or inline currency check fails (hours_since_inspection >= 100.0 or annual_due_date <= now)" }
  - { id: ERR_AIRCRAFT_IN_USE, http: 409, condition: "Retire blocked: a reservation is CHECKED_OUT on this airframe" }
  - { id: ERR_INVALID_TIME_WINDOW, http: 422, condition: "start_at/end_at misordered, checkout outside [start_at - 15min, end_at], or flight times misordered" }
  - { id: ERR_GLIDER_OVERLAP, http: 409, condition: "Half-open interval intersection with an existing BOOKED/CHECKED_OUT reservation on the same glider" }
  - { id: ERR_INSTRUCTOR_DOUBLE_BOOKED, http: 409, condition: "Instructor has another active reservation with gap < 30 minutes (buffered overlap)" }
  - { id: ERR_INSTRUCTOR_UNAVAILABLE, http: 409, condition: "No OPEN InstructorAvailability window fully covers the reservation window" }
  - { id: ERR_TOW_SLOT_FULL, http: 409, condition: "tow_slot.confirmed_count >= capacity at flight posting" }
  - { id: ERR_TOW_SLOT_MISMATCH, http: 409, condition: "Flight takeoff outside slot window, slot not SCHEDULED, or reservation not CHECKED_OUT" }
  - { id: ERR_TOW_SLOT_IN_USE, http: 409, condition: "Tow slot cancel blocked: an IN_FLIGHT flight is linked" }
  - { id: ERR_FLIGHT_NOT_IN_FLIGHT, http: 409, condition: "Land/void requires flight status IN_FLIGHT" }
  - { id: ERR_FLIGHT_NOT_LANDED, http: 409, condition: "Reconcile requires flight status LANDED" }
  - { id: ERR_INVALID_FLIGHT_TIMES, http: 422, condition: "landed_at must be strictly after takeoff_at" }
  - { id: ERR_NOT_SLOT_OWNER, http: 403, condition: "Duty roster confirm/swap requires the acting member to own the slot" }
  - { id: ERR_SLOT_NOT_ASSIGNED, http: 409, condition: "Duty roster confirm requires status ASSIGNED" }
  - { id: ERR_SWAP_TARGET_NOT_ASSIGNED, http: 409, condition: "Swap target slot is not ASSIGNED" }
  - { id: ERR_SWAP_SAME_MEMBER, http: 422, condition: "Cannot swap a duty slot with another slot owned by the same member" }
  - { id: ERR_SWAP_INVALID, http: 409, condition: "Swap integrity violation (target already paired with a different partner)" }
  - { id: ERR_PROGRESS_NOT_PENDING, http: 409, condition: "Signoff requires StudentProgress status PENDING" }
  - { id: ERR_PROGRESS_NOT_SIGNED_OFF, http: 409, condition: "Verify requires status SIGNED_OFF" }
  - { id: ERR_NOT_ENDORSING_INSTRUCTOR, http: 403, condition: "Signoff requires the acting instructor to be the record's instructor_id" }
  - { id: ERR_SOLO_ELIGIBILITY_FAILED, http: 422, condition: "Dual hours < 10.0 or no dual flight within trailing 90 days for SOLO_SIGNOFF" }
  - { id: ERR_RETRIEVE_NOT_REQUESTED, http: 409, condition: "assign-crew requires retrieve status REQUESTED" }
  - { id: ERR_RETRIEVE_FLIGHT_NOT_LANDED_OUT, http: 409, condition: "Retrieve create requires flight status LANDED or RECONCILED and no existing non-terminal retrieve for the flight" }
  - { id: ERR_RETRIEVE_NOT_ASSIGNED, http: 409, condition: "complete requires retrieve status CREW_ASSIGNED" }
  - { id: ERR_CREDIT_CAP_EXCEEDED, http: 402, condition: "Payment would push member credit beyond CREDIT_CAP (-50000 cents)" }
  - { id: ERR_REFERENTIAL_INTEGRITY, http: 422, condition: "Kind/flag mismatch: glider reservation on non-GLIDER, tow slot on non-TOW_PLANE, progress for non-student tier, instructor/tow-pilot flag missing" }
  - { id: ERR_STALE_TOW_SLOT_VERSION, http: 412, condition: "expected_tow_slot_version does not match current TowSlot.version" }
  - { id: ERR_STALE_AIRCRAFT_VERSION, http: 412, condition: "expected_aircraft_version does not match current Aircraft.version" }
  - { id: ERR_UNIQUE_CONSTRAINT, http: 409, condition: "Uniqueness violation (tier_code, aircraft registration)" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: ClubAdmin
    description: "Club operations administrator; owns configuration, maintenance, roster assignment, verification, and the ops-day close"
    identity: opaque
    exclusive_operations:
      - "POST /soaring/tiers"
      - "POST /soaring/members"
      - "POST /soaring/members/{id}/tier"
      - "POST /soaring/members/{id}/suspend"
      - "POST /soaring/aircraft (+ ground/unground/retire)"
      - "POST /soaring/aircraft/{id}/maintenance-records"
      - "POST /soaring/duty-roster"
      - "POST /soaring/student-progress/{id}/verify, return-for-rework, reject"
      - "POST /soaring/ops-day/close"
      - "POST /soaring/_clock/set_current_utc"
    shared_operations:
      - "All GET endpoints; member payments; reservation create/cancel; tow slot create/cancel; flight void/reconcile; retrieve file/assign/complete/cancel"

  - name: Member
    description: "Club member (pilot). Entity-backed identity — X-User-ID equals Member.id for ownership checks (own reservations, own duty slots, own payments)"
    identity: "entity_backed:Member"
    exclusive_operations:
      - "POST /soaring/duty-roster/{id}/confirm, propose-swap, accept-swap, decline-swap (slot owner / swap counterpart)"
    shared_operations:
      - "All GET endpoints; reservation create/checkout/cancel (self or via DutyOfficer); flight post/land; member payments (own); resign (own); retrieve file"

  - name: DutyOfficer
    description: "Duty officer of the day; acts on behalf of members for launch operations and retrieve coordination"
    identity: "entity_backed:Member"
    exclusive_operations:
      - "POST /soaring/flights/{id}/reconcile"
    shared_operations:
      - "All GET endpoints; reservation create/checkout/cancel; flight post/land/void; retrieve file/assign-crew/complete/cancel"

  - name: Instructor
    description: "Flight instructor; publishes availability and signs student progression"
    identity: "entity_backed:Member"
    exclusive_operations:
      - "POST /soaring/instructor-availability (own instructor_id)"
      - "POST /soaring/instructor-availability/{id}/cancel (own)"
      - "POST /soaring/student-progress"
      - "POST /soaring/student-progress/{id}/signoff (own records)"
    shared_operations:
      - "All GET endpoints"

  - name: TowPilot
    description: "Tow pilot; manages tow slots and posts launches"
    identity: "entity_backed:Member"
    exclusive_operations:
      - "POST /soaring/tow-slots (as scheduled pilot)"
      - "POST /soaring/tow-slots/{id}/cancel"
    shared_operations:
      - "All GET endpoints; flight posting"

# =============================================================================
# Domain constants referenced across tables
# =============================================================================
constants:
  ARREARS_THRESHOLD_CENTS: 20000
  LATE_CANCEL_WINDOW_HOURS: 24
  LATE_CANCEL_FEE_CENTS: 1500
  NO_SHOW_FEE_CENTS: 2500
  DUTY_NO_SHOW_FEE_CENTS: 5000
  CREDIT_CAP_CENTS: -50000
  TOW_SORTIE_MINUTES: 12
  INSTRUCTOR_BUFFER_MIN: 30
  CHECKOUT_EARLY_GRACE_MIN: 15
