# =============================================================================
# task_0896 — §1.8 Scaffold Difficulty Design (Test Targeting Index)
# 9 Difficulty Rules × 2 instances = 18 instances
# =============================================================================
scaffold_difficulty_design:

  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: plan_estimated_vs_actual_transport_cost
        grounds:
          - calculations.transport_plan_cost
          - entities.TransportationPlan.fields.estimated_monthly_cost_cents
          - entities.TransportationPlan.fields.actual_cost_cents
          - state_machines.TripAssignment.SCHEDULED_to_COMPLETED
        distinguishing_aspect: "Cost accounting on TransportationPlan: the forward-looking estimate (72000 monthly) and the chronological actual (3600 after one completed trip) diverge for the same plan."
        test_recipe:
          setup:
            - "Eligible student with an ACTIVE plan at route_miles=20 (estimated_daily=3600, estimated_monthly=72000) and one IN_SERVICE vehicle."
          setup_api_calls:
            - call: "POST /mv/districts"
              payload: { name: "D1", nces_code: "0601", transport_budget_cents: 100000000 }
              as: StateCoordinator
              captures: { d1: $.data.id }
            - call: "POST /mv/students"
              payload: { first_name: "A", last_name: "B", birthdate: "2014-03-02", enrolled_district_id: "${d1}", origin_district_id: "${d1}", living_situation: "SHELTER" }
              as: StateCoordinator
              captures: { s1: $.data.id, s1_v: $.data.version }
            - call: "POST /mv/students/${s1}/eligibility-determinations"
              payload: { category: "HOMELESS", basis: "SHELTER", decision: "ELIGIBLE", effective_date: "2026-05-01", expected_student_version: "${s1_v}" }
              as: StateCoordinator
              captures: { det1: $.data.id }
            - call: "POST /mv/eligibility-determinations/${det1}/finalize"
              payload: {}
              as: StateCoordinator
            - call: "POST /mv/transportation-plans"
              payload: { student_id: "${s1}", origin_district_id: "${d1}", serving_district_id: "${d1}", route_miles: 20 }
              as: StateCoordinator
              captures: { p1: $.data.id, p1_v: $.data.version }
            - call: "POST /mv/cost-share-agreements"
              payload: { transportation_plan_id: "${p1}", expected_transportation_plan_version: "${p1_v}" }
              as: StateCoordinator
              captures: { csa1: $.data.id }
            - call: "POST /mv/transportation-plans/${p1}/submit"
              payload: {}
              as: StateCoordinator
            - call: "POST /mv/transportation-plans/${p1}/approve"
              payload: {}
              as: StateCoordinator
            - call: "POST /mv/transportation-plans/${p1}/activate"
              payload: {}
              as: StateCoordinator
            - call: "POST /mv/vehicles"
              payload: { serving_district_id: "${d1}", label: "Bus1", capacity_students: 24 }
              as: StateCoordinator
              captures: { veh1: $.data.id }
            - call: "POST /mv/trip-assignments"
              payload: { transportation_plan_id: "${p1}", vehicle_id: "${veh1}", scheduled_start: "2026-05-04T08:00:00Z", scheduled_end: "2026-05-04T08:30:00Z" }
              as: StateCoordinator
              captures: { t1: $.data.id }
          trigger:
            - call: "POST /mv/trip-assignments/${t1}/complete"
              payload: { actual_miles: 20 }
              as: StateCoordinator
          assert:
            - "TransportationPlan.${p1}.estimated_monthly_cost_cents == 72000"
            - "TransportationPlan.${p1}.actual_cost_cents == 3600"
            - "TransportationPlan.${p1}.estimated_monthly_cost_cents != TransportationPlan.${p1}.actual_cost_cents"

      - name: student_priority_provisional_vs_final
        grounds:
          - calculations.student_priority_score
          - entities.Student.fields.priority_score
          - entities.Student.fields.priority_basis
          - state_machines.EligibilityDetermination.DRAFT_to_FINALIZED
        distinguishing_aspect: "Service-priority scoring on Student (different entity domain than cost): self-reported DOUBLED_UP yields provisional 20, verified UNSHELTERED basis yields final 50."
        test_recipe:
          setup:
            - "Student self-reports living_situation DOUBLED_UP (provisional priority_score=20). A determination with verified basis UNSHELTERED is created."
          setup_api_calls:
            - call: "POST /mv/districts"
              payload: { name: "D1", nces_code: "0601", transport_budget_cents: 100000000 }
              as: StateCoordinator
              captures: { d1: $.data.id }
            - call: "POST /mv/students"
              payload: { first_name: "C", last_name: "D", birthdate: "2013-09-09", enrolled_district_id: "${d1}", origin_district_id: "${d1}", living_situation: "DOUBLED_UP" }
              as: StateCoordinator
              captures: { s1: $.data.id, s1_v: $.data.version }
            - call: "POST /mv/students/${s1}/eligibility-determinations"
              payload: { category: "HOMELESS", basis: "UNSHELTERED", decision: "ELIGIBLE", effective_date: "2026-05-01", expected_student_version: "${s1_v}" }
              as: StateCoordinator
              captures: { det1: $.data.id }
          trigger:
            - call: "POST /mv/eligibility-determinations/${det1}/finalize"
              payload: {}
              as: StateCoordinator
          assert:
            - "Student.${s1}.priority_score == 50"
            - "Student.${s1}.priority_basis == FINAL"

  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: cost_share_tiered_allocation_with_cap
        grounds:
          - calculations.cost_share_allocation
          - entities.CostShareAgreement.fields.serving_share_cents
          - entities.CostShareAgreement.fields.origin_share_cents
          - entities.CostShareAgreement.fields.serving_pct
        distinguishing_aspect: "Mode (a): >=3 inputs (total_monthly, tier-selected serving_pct, SHARE_CAP_CENTS) with non-linear tier selection AND a min() cap — at route_miles=50 raw serving 123750 is capped to 100000, origin 65000."
        test_recipe:
          setup:
            - "A DRAFT plan at route_miles=50 (estimated_monthly=165000); serving_pct tier is 0.75, raw serving 123750 exceeds SHARE_CAP_CENTS=100000."
          setup_api_calls:
            - call: "POST /mv/districts"
              payload: { name: "D1", nces_code: "0601", transport_budget_cents: 100000000 }
              as: StateCoordinator
              captures: { d1: $.data.id }
            - call: "POST /mv/students"
              payload: { first_name: "E", last_name: "F", birthdate: "2012-01-01", enrolled_district_id: "${d1}", origin_district_id: "${d1}", living_situation: "SHELTER" }
              as: StateCoordinator
              captures: { s1: $.data.id }
            - call: "POST /mv/transportation-plans"
              payload: { student_id: "${s1}", origin_district_id: "${d1}", serving_district_id: "${d1}", route_miles: 50 }
              as: StateCoordinator
              captures: { p1: $.data.id, p1_v: $.data.version }
          trigger:
            - call: "POST /mv/cost-share-agreements"
              payload: { transportation_plan_id: "${p1}", expected_transportation_plan_version: "${p1_v}" }
              as: StateCoordinator
              captures: { csa1: $.data.id }
          assert:
            - "CostShareAgreement.${csa1}.total_monthly_cents == 165000"
            - "CostShareAgreement.${csa1}.serving_pct == 0.75"
            - "CostShareAgreement.${csa1}.serving_share_cents == 100000"
            - "CostShareAgreement.${csa1}.origin_share_cents == 65000"

      - name: invoice_per_trip_rounding_then_sum
        grounds:
          - calculations.cost_ledger_invoice
          - entities.CostShareAgreement.fields.serving_pct
          - state_machines.TripAssignment.SCHEDULED_to_COMPLETED
        distinguishing_aspect: "Mode (b): nested rounding pinned to round-per-trip-then-sum — two trips of trip_cost 655 at serving_pct 0.5 give round(327.5)=328 each = 656, NOT round(1310*0.5)=655."
        test_recipe:
          setup:
            - "Eligible student, ACTIVE plan at route_miles=10 (serving_pct=0.5), vehicle IN_SERVICE; two completed trips each actual_miles=1 (trip_cost 655)."
          setup_api_calls:
            - call: "POST /mv/districts"
              payload: { name: "D1", nces_code: "0601", transport_budget_cents: 100000000 }
              as: StateCoordinator
              captures: { d1: $.data.id }
            - call: "POST /mv/students"
              payload: { first_name: "G", last_name: "H", birthdate: "2013-05-05", enrolled_district_id: "${d1}", origin_district_id: "${d1}", living_situation: "SHELTER" }
              as: StateCoordinator
              captures: { s1: $.data.id, s1_v: $.data.version }
            - call: "POST /mv/students/${s1}/eligibility-determinations"
              payload: { category: "HOMELESS", basis: "SHELTER", decision: "ELIGIBLE", effective_date: "2026-05-01", expected_student_version: "${s1_v}" }
              as: StateCoordinator
              captures: { det1: $.data.id }
            - call: "POST /mv/eligibility-determinations/${det1}/finalize"
              payload: {}
              as: StateCoordinator
            - call: "POST /mv/transportation-plans"
              payload: { student_id: "${s1}", origin_district_id: "${d1}", serving_district_id: "${d1}", route_miles: 10 }
              as: StateCoordinator
              captures: { p1: $.data.id, p1_v: $.data.version }
            - call: "POST /mv/cost-share-agreements"
              payload: { transportation_plan_id: "${p1}", expected_transportation_plan_version: "${p1_v}" }
              as: StateCoordinator
              captures: { csa1: $.data.id }
            - call: "POST /mv/transportation-plans/${p1}/submit"
              payload: {}
              as: StateCoordinator
            - call: "POST /mv/transportation-plans/${p1}/approve"
              payload: {}
              as: StateCoordinator
            - call: "POST /mv/transportation-plans/${p1}/activate"
              payload: {}
              as: StateCoordinator
            - call: "POST /mv/vehicles"
              payload: { serving_district_id: "${d1}", label: "Bus1", capacity_students: 24 }
              as: StateCoordinator
              captures: { veh1: $.data.id }
            - call: "POST /mv/trip-assignments"
              payload: { transportation_plan_id: "${p1}", vehicle_id: "${veh1}", scheduled_start: "2026-05-04T08:00:00Z", scheduled_end: "2026-05-04T08:30:00Z" }
              as: StateCoordinator
              captures: { t1: $.data.id }
            - call: "POST /mv/trip-assignments/${t1}/complete"
              payload: { actual_miles: 1 }
              as: StateCoordinator
            - call: "POST /mv/trip-assignments"
              payload: { transportation_plan_id: "${p1}", vehicle_id: "${veh1}", scheduled_start: "2026-05-05T08:00:00Z", scheduled_end: "2026-05-05T08:30:00Z" }
              as: StateCoordinator
              captures: { t2: $.data.id }
            - call: "POST /mv/trip-assignments/${t2}/complete"
              payload: { actual_miles: 1 }
              as: StateCoordinator
          trigger:
            - call: "GET /mv/cost-share-agreements/${csa1}/invoice"
              payload: {}
              as: StateCoordinator
          assert:
            - "invoice.serving_invoice_cents == 656"
            - "invoice.origin_invoice_cents == 654"
            - "invoice.trip_count == 2"

  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: dispute_cyclic_info_request_loop
        grounds:
          - state_machines.Dispute.UNDER_REVIEW_to_INFO_REQUESTED
          - state_machines.Dispute.INFO_REQUESTED_to_FILED
          - state_machines.Dispute.FILED_to_UNDER_REVIEW
        distinguishing_aspect: "Cycle on Dispute: FILED->UNDER_REVIEW->INFO_REQUESTED->FILED returns to a non-terminal prior state, and the review round can restart (begin-review again)."
        test_recipe:
          setup:
            - "A filed dispute for a student, moved to UNDER_REVIEW then INFO_REQUESTED."
          setup_api_calls:
            - call: "POST /mv/districts"
              payload: { name: "D1", nces_code: "0601", transport_budget_cents: 100000000 }
              as: StateCoordinator
              captures: { d1: $.data.id }
            - call: "POST /mv/students"
              payload: { first_name: "I", last_name: "J", birthdate: "2011-02-02", enrolled_district_id: "${d1}", origin_district_id: "${d1}", living_situation: "SHELTER" }
              as: StateCoordinator
              captures: { s1: $.data.id }
            - call: "POST /mv/disputes"
              payload: { student_id: "${s1}", dispute_type: "ELIGIBILITY", description: "Contest determination" }
              as: StateCoordinator
              captures: { dsp1: $.data.id }
            - call: "POST /mv/disputes/${dsp1}/begin-review"
              payload: {}
              as: StateCoordinator
            - call: "POST /mv/disputes/${dsp1}/request-info"
              payload: {}
              as: StateCoordinator
          trigger:
            - call: "POST /mv/disputes/${dsp1}/resubmit"
              payload: {}
              as: Liaison
            - call: "POST /mv/disputes/${dsp1}/begin-review"
              payload: {}
              as: StateCoordinator
          assert:
            - "Dispute.${dsp1}.status == UNDER_REVIEW"

      - name: plan_branch_approve_and_active_suspend_revert
        grounds:
          - state_machines.TransportationPlan.PROPOSED_to_APPROVED
          - state_machines.TransportationPlan.ACTIVE_to_SUSPENDED
          - state_machines.TransportationPlan.SUSPENDED_to_ACTIVE
        distinguishing_aspect: "Branch+revert on TransportationPlan (different entity than Dispute): PROPOSED forks to APPROVED (vs DENIED), and ACTIVE<->SUSPENDED is a revert loop returning to ACTIVE."
        test_recipe:
          setup:
            - "Eligible student, plan taken to ACTIVE with a cost-share agreement, then suspended."
          setup_api_calls:
            - call: "POST /mv/districts"
              payload: { name: "D1", nces_code: "0601", transport_budget_cents: 100000000 }
              as: StateCoordinator
              captures: { d1: $.data.id }
            - call: "POST /mv/students"
              payload: { first_name: "K", last_name: "L", birthdate: "2010-07-07", enrolled_district_id: "${d1}", origin_district_id: "${d1}", living_situation: "SHELTER" }
              as: StateCoordinator
              captures: { s1: $.data.id, s1_v: $.data.version }
            - call: "POST /mv/students/${s1}/eligibility-determinations"
              payload: { category: "HOMELESS", basis: "SHELTER", decision: "ELIGIBLE", effective_date: "2026-05-01", expected_student_version: "${s1_v}" }
              as: StateCoordinator
              captures: { det1: $.data.id }
            - call: "POST /mv/eligibility-determinations/${det1}/finalize"
              payload: {}
              as: StateCoordinator
            - call: "POST /mv/transportation-plans"
              payload: { student_id: "${s1}", origin_district_id: "${d1}", serving_district_id: "${d1}", route_miles: 20 }
              as: StateCoordinator
              captures: { p1: $.data.id, p1_v: $.data.version }
            - call: "POST /mv/cost-share-agreements"
              payload: { transportation_plan_id: "${p1}", expected_transportation_plan_version: "${p1_v}" }
              as: StateCoordinator
              captures: { csa1: $.data.id }
            - call: "POST /mv/transportation-plans/${p1}/submit"
              payload: {}
              as: StateCoordinator
            - call: "POST /mv/transportation-plans/${p1}/approve"
              payload: {}
              as: StateCoordinator
            - call: "POST /mv/transportation-plans/${p1}/activate"
              payload: {}
              as: StateCoordinator
            - call: "POST /mv/transportation-plans/${p1}/suspend"
              payload: {}
              as: StateCoordinator
          trigger:
            - call: "POST /mv/transportation-plans/${p1}/resume"
              payload: {}
              as: StateCoordinator
          assert:
            - "TransportationPlan.${p1}.status == ACTIVE"

  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: finalize_determination_cascade_depth3
        grounds:
          - state_machines.EligibilityDetermination.DRAFT_to_FINALIZED
          - entities.Student.fields.eligibility_status
          - entities.BenefitLink.fields.status
          - entities.District.fields.categorical_eligible_count
        distinguishing_aspect: "Trigger=finalize; depth-3 causal chain A->B->C->D: determination FINALIZED sets Student.eligibility_status=ELIGIBLE (B), which creates a BenefitLink (C), whose creation increments District.categorical_eligible_count to 1 (D)."
        test_recipe:
          setup:
            - "Intake student (UNDETERMINED, no benefit link, district count 0) with a DRAFT ELIGIBLE determination."
          setup_api_calls:
            - call: "POST /mv/districts"
              payload: { name: "D1", nces_code: "0601", transport_budget_cents: 100000000 }
              as: StateCoordinator
              captures: { d1: $.data.id }
            - call: "POST /mv/students"
              payload: { first_name: "M", last_name: "N", birthdate: "2013-03-03", enrolled_district_id: "${d1}", origin_district_id: "${d1}", living_situation: "SHELTER" }
              as: StateCoordinator
              captures: { s1: $.data.id, s1_v: $.data.version }
            - call: "POST /mv/students/${s1}/eligibility-determinations"
              payload: { category: "HOMELESS", basis: "SHELTER", decision: "ELIGIBLE", effective_date: "2026-05-01", expected_student_version: "${s1_v}" }
              as: StateCoordinator
              captures: { det1: $.data.id }
          trigger:
            - call: "POST /mv/eligibility-determinations/${det1}/finalize"
              payload: {}
              as: StateCoordinator
          assert:
            - "Student.${s1}.eligibility_status == ELIGIBLE"
            - "GET /mv/benefit-links?student_id=${s1} returns exactly 1 BenefitLink with status == ACTIVE"
            - "District.${d1}.categorical_eligible_count == 1"

      - name: trip_complete_ledger_cascade_depth3
        grounds:
          - state_machines.TripAssignment.SCHEDULED_to_COMPLETED
          - entities.CostShareAgreement.fields.actual_cost_cents
          - entities.CostLedgerEntry.fields.amount_cents
          - entities.District.fields.transport_balance_cents
        distinguishing_aspect: "Trigger=trip complete; depth-3 causal chain A->B->C->D: completion updates CostShareAgreement.actual_cost_cents (B), appends a TRIP_CHARGE CostLedgerEntry amount 2160 (C), which increments District.transport_balance_cents to 2160 (D)."
        test_recipe:
          setup:
            - "Eligible student, ACTIVE plan route_miles=20 (serving_pct 0.6), vehicle IN_SERVICE, one SCHEDULED trip."
          setup_api_calls:
            - call: "POST /mv/districts"
              payload: { name: "D1", nces_code: "0601", transport_budget_cents: 100000000 }
              as: StateCoordinator
              captures: { d1: $.data.id }
            - call: "POST /mv/students"
              payload: { first_name: "O", last_name: "P", birthdate: "2012-04-04", enrolled_district_id: "${d1}", origin_district_id: "${d1}", living_situation: "SHELTER" }
              as: StateCoordinator
              captures: { s1: $.data.id, s1_v: $.data.version }
            - call: "POST /mv/students/${s1}/eligibility-determinations"
              payload: { category: "HOMELESS", basis: "SHELTER", decision: "ELIGIBLE", effective_date: "2026-05-01", expected_student_version: "${s1_v}" }
              as: StateCoordinator
              captures: { det1: $.data.id }
            - call: "POST /mv/eligibility-determinations/${det1}/finalize"
              payload: {}
              as: StateCoordinator
            - call: "POST /mv/transportation-plans"
              payload: { student_id: "${s1}", origin_district_id: "${d1}", serving_district_id: "${d1}", route_miles: 20 }
              as: StateCoordinator
              captures: { p1: $.data.id, p1_v: $.data.version }
            - call: "POST /mv/cost-share-agreements"
              payload: { transportation_plan_id: "${p1}", expected_transportation_plan_version: "${p1_v}" }
              as: StateCoordinator
              captures: { csa1: $.data.id }
            - call: "POST /mv/transportation-plans/${p1}/submit"
              payload: {}
              as: StateCoordinator
            - call: "POST /mv/transportation-plans/${p1}/approve"
              payload: {}
              as: StateCoordinator
            - call: "POST /mv/transportation-plans/${p1}/activate"
              payload: {}
              as: StateCoordinator
            - call: "POST /mv/vehicles"
              payload: { serving_district_id: "${d1}", label: "Bus1", capacity_students: 24 }
              as: StateCoordinator
              captures: { veh1: $.data.id }
            - call: "POST /mv/trip-assignments"
              payload: { transportation_plan_id: "${p1}", vehicle_id: "${veh1}", scheduled_start: "2026-05-04T08:00:00Z", scheduled_end: "2026-05-04T08:30:00Z" }
              as: StateCoordinator
              captures: { t1: $.data.id }
          trigger:
            - call: "POST /mv/trip-assignments/${t1}/complete"
              payload: { actual_miles: 20 }
              as: StateCoordinator
          assert:
            - "CostShareAgreement.${csa1}.actual_cost_cents == 2160"
            - "GET /mv/cost-ledger-entries?cost_share_agreement_id=${csa1} returns 1 entry with entry_type == TRIP_CHARGE and amount_cents == 2160"
            - "District.${d1}.transport_balance_cents == 2160"

  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_beats_temporal_trip_on_suspended_plan
        grounds:
          - validations[priority=6]
          - validations[priority=9]
          - errors[ERR_PLAN_NOT_ACTIVE]
          - errors[ERR_VEHICLE_TIME_CONFLICT]
        distinguishing_aspect: "Pair {state, business_temporal}: a trip create that BOTH targets a SUSPENDED plan (state, pri 6) AND overlaps the same vehicle within buffer (temporal, pri 9) returns ERR_PLAN_NOT_ACTIVE, proving state outranks temporal."
        test_recipe:
          setup:
            - "ACTIVE plan with a SCHEDULED trip 08:00-08:30 on vehicle veh1; plan then SUSPENDED. A second trip 08:15-08:45 on veh1 overlaps within the 30-minute buffer."
          setup_api_calls:
            - call: "POST /mv/districts"
              payload: { name: "D1", nces_code: "0601", transport_budget_cents: 100000000 }
              as: StateCoordinator
              captures: { d1: $.data.id }
            - call: "POST /mv/students"
              payload: { first_name: "Q", last_name: "R", birthdate: "2012-06-06", enrolled_district_id: "${d1}", origin_district_id: "${d1}", living_situation: "SHELTER" }
              as: StateCoordinator
              captures: { s1: $.data.id, s1_v: $.data.version }
            - call: "POST /mv/students/${s1}/eligibility-determinations"
              payload: { category: "HOMELESS", basis: "SHELTER", decision: "ELIGIBLE", effective_date: "2026-05-01", expected_student_version: "${s1_v}" }
              as: StateCoordinator
              captures: { det1: $.data.id }
            - call: "POST /mv/eligibility-determinations/${det1}/finalize"
              payload: {}
              as: StateCoordinator
            - call: "POST /mv/transportation-plans"
              payload: { student_id: "${s1}", origin_district_id: "${d1}", serving_district_id: "${d1}", route_miles: 20 }
              as: StateCoordinator
              captures: { p1: $.data.id, p1_v: $.data.version }
            - call: "POST /mv/cost-share-agreements"
              payload: { transportation_plan_id: "${p1}", expected_transportation_plan_version: "${p1_v}" }
              as: StateCoordinator
              captures: { csa1: $.data.id }
            - call: "POST /mv/transportation-plans/${p1}/submit"
              payload: {}
              as: StateCoordinator
            - call: "POST /mv/transportation-plans/${p1}/approve"
              payload: {}
              as: StateCoordinator
            - call: "POST /mv/transportation-plans/${p1}/activate"
              payload: {}
              as: StateCoordinator
            - call: "POST /mv/vehicles"
              payload: { serving_district_id: "${d1}", label: "Bus1", capacity_students: 24 }
              as: StateCoordinator
              captures: { veh1: $.data.id }
            - call: "POST /mv/trip-assignments"
              payload: { transportation_plan_id: "${p1}", vehicle_id: "${veh1}", scheduled_start: "2026-05-04T08:00:00Z", scheduled_end: "2026-05-04T08:30:00Z" }
              as: StateCoordinator
              captures: { t1: $.data.id }
            - call: "POST /mv/transportation-plans/${p1}/suspend"
              payload: {}
              as: StateCoordinator
          trigger:
            - call: "POST /mv/trip-assignments"
