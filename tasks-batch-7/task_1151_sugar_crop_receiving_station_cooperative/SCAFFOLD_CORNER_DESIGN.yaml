            - { call: "POST /api/bookings", payload: { campaign_id: "${camp_id}", station_id: "${st_id}", slot_start: "2026-10-01T08:00:00Z", slot_end: "2026-10-01T10:00:00Z", estimated_tons: 20 }, as: MEMBER, as_user_id: "${m1_id}", captures: { b_id: $.data.id } }
            - { call: "POST /api/bookings/${b_id}/confirm", as: SCHEDULER }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-10-01T08:30:00Z" }, as: COOP_ADMIN }
            - { call: "POST /api/tickets", payload: { booking_id: "${b_id}" }, as: STATION_OPERATOR, captures: { t_id: $.data.id } }
            - { call: "POST /api/tickets/${t_id}/weigh", payload: { gross_weight_lbs: 60000, tare_weight_lbs: 32000 }, as: STATION_OPERATOR }
            - { call: "POST /api/samples", payload: { ticket_id: "${t_id}", sample_type: "STATION_QUICK" }, as: QUALITY_TECH, captures: { s_id: $.data.id } }
            - { call: "POST /api/samples/${s_id}/record-result", payload: { sugar_pct: 8.00, trash_pct: 2.00 }, as: QUALITY_TECH, as_user_id: "qt-alice" }
          trigger:
            - { call: "GET /api/tickets/${t_id}", as: POOL_ACCOUNTANT, captures: { prov_factor: $.data.provisional_factor, prov_value: $.data.provisional_value_cents } }
          assert:
            - "prov_factor == 0.7000 (raw 0.68 clamped at PROV_CLAMP_MIN)"
            - "prov_value == 53900 (14.0 t x 5500 x 0.7000; trash 2.00 <= 3.00 so no deduction)"

