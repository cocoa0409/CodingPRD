# =============================================================================
# task_0437_pallet_pooling — §1.8 Scaffold Difficulty Design (Test Targeting Index)
# 9 rule_ids x 2 instances = 18 instances. Grounds resolve into SCAFFOLD.yaml §1.1–§1.6.
# All formula-derived asserts are literals computed against §1.3 formulas + constants.
# =============================================================================

scaffold_difficulty_design:

  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: hire_provisional_accrual_vs_finalized_replay_diverge
        grounds:
          - calculations.hire_accrued_charge
          - calculations.hire_final_charge
          - state_machines.Hire.OPEN_to_CLOSED
          - entities.Hire.fields.accrued_charge_cents
          - entities.Hire.fields.final_charge_cents
        distinguishing_aspect: |
          Same hire, same clock span: the forward-looking provisional accrual uses the CURRENT
          (post-damage) asset count for the whole span, while the chronological close replays the
          damage timeline; with 2 of 11 assets damaged on day 2 the provisional reads 45000 but the
          finalized replay pins 45900 — different numbers on the Hire entity domain.
        test_recipe:
          setup:
            - "PoolPolicy ACTIVE; AssetType PALLET_STD base_daily_rate_cents=500, useful_life_days=1825; clock 2026-06-01"
            - "Account ACTIVE credit_limit_cents=10000000; Location L1 OPEN under it"
            - "11 AVAILABLE assets minted at L1 in_service 2026-01-01"
            - "Hire opened on_hire_at=2026-06-01 with all 11 assets; on 2026-06-03 two assets reported DAMAGED (dropping live count to 9, below tier-1 qty 10); clock advanced to 2026-06-11"
          setup_api_calls:
            - call: "POST /pool-policies"
              payload: { name: "CHEP Blue", currency: "USD" }
              as: PoolAdmin
            - call: "POST /asset-types"
              payload: { code: "PALLET_STD", name: "Standard Pallet", base_daily_rate_cents: 500, replacement_cost_cents: 3000, useful_life_days: 1825 }
              as: PoolAdmin
              captures: { at_id: $.data.id }
            - call: "POST /accounts"
              payload: { legal_name: "Acme Mfg", role_type: "MANUFACTURER", credit_limit_cents: 10000000 }
              as: PoolAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /locations"
              payload: { account_id: "${acct_id}", name: "L1" }
              as: PoolAdmin
              captures: { l1_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: PoolAdmin
            - call: "POST /assets"
              payload: { asset_type_id: "${at_id}", serial: "S1", in_service_at: "2026-01-01T00:00:00Z", current_location_id: "${l1_id}" }
              as: PoolOperator
              captures: { a1: $.data.id }
            - call: "POST /assets"
              payload: { asset_type_id: "${at_id}", serial: "S2", in_service_at: "2026-01-01T00:00:00Z", current_location_id: "${l1_id}" }
              as: PoolOperator
              captures: { a2: $.data.id }
            - call: "POST /assets"
              payload: { asset_type_id: "${at_id}", serial: "S3", in_service_at: "2026-01-01T00:00:00Z", current_location_id: "${l1_id}" }
              as: PoolOperator
              captures: { a3: $.data.id }
            - call: "POST /assets"
              payload: { asset_type_id: "${at_id}", serial: "S4", in_service_at: "2026-01-01T00:00:00Z", current_location_id: "${l1_id}" }
              as: PoolOperator
              captures: { a4: $.data.id }
            - call: "POST /assets"
              payload: { asset_type_id: "${at_id}", serial: "S5", in_service_at: "2026-01-01T00:00:00Z", current_location_id: "${l1_id}" }
              as: PoolOperator
              captures: { a5: $.data.id }
            - call: "POST /assets"
              payload: { asset_type_id: "${at_id}", serial: "S6", in_service_at: "2026-01-01T00:00:00Z", current_location_id: "${l1_id}" }
              as: PoolOperator
              captures: { a6: $.data.id }
            - call: "POST /assets"
              payload: { asset_type_id: "${at_id}", serial: "S7", in_service_at: "2026-01-01T00:00:00Z", current_location_id: "${l1_id}" }
              as: PoolOperator
              captures: { a7: $.data.id }
            - call: "POST /assets"
              payload: { asset_type_id: "${at_id}", serial: "S8", in_service_at: "2026-01-01T00:00:00Z", current_location_id: "${l1_id}" }
              as: PoolOperator
              captures: { a8: $.data.id }
            - call: "POST /assets"
              payload: { asset_type_id: "${at_id}", serial: "S9", in_service_at: "2026-01-01T00:00:00Z", current_location_id: "${l1_id}" }
              as: PoolOperator
              captures: { a9: $.data.id }
            - call: "POST /assets"
              payload: { asset_type_id: "${at_id}", serial: "S10", in_service_at: "2026-01-01T00:00:00Z", current_location_id: "${l1_id}" }
              as: PoolOperator
              captures: { a10: $.data.id }
            - call: "POST /assets"
              payload: { asset_type_id: "${at_id}", serial: "S11", in_service_at: "2026-01-01T00:00:00Z", current_location_id: "${l1_id}" }
              as: PoolOperator
              captures: { a11: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PoolAdmin
            - call: "GET /locations/${l1_id}"
              payload: {}
              as: PoolOperator
              captures: { l1_v: $.data.version }
            - call: "POST /hires"
              payload: { account_id: "${acct_id}", location_id: "${l1_id}", asset_type_id: "${at_id}", asset_ids: ["${a1}","${a2}","${a3}","${a4}","${a5}","${a6}","${a7}","${a8}","${a9}","${a10}","${a11}"], expected_location_version: "${l1_v}" }
              as: PoolOperator
              captures: { hire_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-03T00:00:00Z" }
              as: PoolAdmin
            - call: "POST /assets/${a1}/report-damage"
              payload: {}
              as: PoolOperator
            - call: "POST /assets/${a2}/report-damage"
              payload: {}
              as: PoolOperator
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-11T00:00:00Z" }
              as: PoolAdmin
          trigger:
            - call: "GET /hires/${hire_id}"
              payload: {}
              as: PoolOperator
              captures: { prov: $.data.accrued_charge_cents }
            - call: "POST /hires/${hire_id}/close"
              payload: {}
              as: PoolOperator
              captures: { fin: $.data.final_charge_cents }
          assert:
            - "Hire.${hire_id}.accrued_charge_cents == 45000"
            - "Hire.${hire_id}.final_charge_cents == 45900"
            - "Hire.${hire_id}.accrued_charge_cents != Hire.${hire_id}.final_charge_cents"

      - name: audit_loss_replacement_vs_net_book_diverge
        grounds:
          - calculations.audit_loss_valuation
          - state_machines.AuditReconciliation.DRAFT_to_FINALIZED
          - entities.AuditReconciliation.fields.declared_loss_cents
          - entities.AssetType.fields.replacement_cost_cents
          - entities.AssetType.fields.useful_life_days
        distinguishing_aspect: |
          Identical 3-asset shortfall valued two ways on the AuditReconciliation entity domain:
          REPLACEMENT basis pins declared_loss_cents=9000 (3 x 3000), whereas NET_BOOK straight-line
          depreciation over per-victim ages (730/365/180 days) sums to 6904 — a different number than
          the hire dual-variant, proving dual-variant logic on a second, non-Hire subject.
          (Same shortfall qty; different monetary result.)
        test_recipe:
          setup:
            - "AssetType PALLET_STD replacement_cost_cents=3000, useful_life_days=1825"
            - "Location L1 OPEN with equity_balance=10 (10 assets issued in via ISSUANCE), 3 of the on-site AVAILABLE assets are the oldest, in_service 2024-06-30 / 2025-06-30 / 2026-01-01"
            - "counted_physical=7 at window_end 2026-06-30; two parallel audits attempted under each basis on separate locations to isolate valuation"
          setup_api_calls:
            - call: "POST /pool-policies"
              payload: { name: "CHEP Blue", currency: "USD" }
              as: PoolAdmin
            - call: "POST /asset-types"
              payload: { code: "PALLET_STD", name: "Standard Pallet", base_daily_rate_cents: 500, replacement_cost_cents: 3000, useful_life_days: 1825 }
              as: PoolAdmin
              captures: { at_id: $.data.id }
            - call: "POST /accounts"
              payload: { legal_name: "Acme Mfg", role_type: "MANUFACTURER", credit_limit_cents: 10000000 }
              as: PoolAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /locations"
              payload: { account_id: "${acct_id}", name: "OperatorStock" }
              as: PoolAdmin
              captures: { stock_id: $.data.id }
            - call: "POST /locations"
              payload: { account_id: "${acct_id}", name: "L_NBV" }
              as: PoolAdmin
              captures: { lnbv_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2024-06-30T00:00:00Z" }
              as: PoolAdmin
            - call: "POST /assets"
              payload: { asset_type_id: "${at_id}", serial: "N1", in_service_at: "2024-06-30T00:00:00Z", current_location_id: "${stock_id}" }
              as: PoolOperator
              captures: { n1: $.data.id }
            - call: "POST /assets"
              payload: { asset_type_id: "${at_id}", serial: "N2", in_service_at: "2025-06-30T00:00:00Z", current_location_id: "${stock_id}" }
              as: PoolOperator
              captures: { n2: $.data.id }
            - call: "POST /assets"
              payload: { asset_type_id: "${at_id}", serial: "N3", in_service_at: "2026-01-01T00:00:00Z", current_location_id: "${stock_id}" }
              as: PoolOperator
              captures: { n3: $.data.id }
            - call: "POST /transfer-orders"
              payload: { from_location_id: "${stock_id}", to_location_id: "${lnbv_id}", kind: "ISSUANCE", asset_ids: ["${n1}","${n2}","${n3}"] }
              as: PoolOperator
              captures: { to_id: $.data.id }
            - call: "POST /transfer-orders/${to_id}/dispatch"
              payload: {}
              as: PoolOperator
            - call: "POST /transfer-orders/${to_id}/receive"
              payload: {}
              as: PoolOperator
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-30T00:00:00Z" }
              as: PoolAdmin
            - call: "POST /audit-reconciliations"
              payload: { location_id: "${lnbv_id}", window_start: "2026-06-01T00:00:00Z", window_end: "2026-06-30T00:00:00Z", counted_physical: 0, loss_basis: "NET_BOOK" }
              as: PoolOperator
              captures: { audit_nbv: $.data.id }
          trigger:
            - call: "POST /audit-reconciliations/${audit_nbv}/finalize"
              payload: {}
              as: PoolOperator
              captures: { nbv_cents: $.data.declared_loss_cents, nbv_qty: $.data.declared_loss_qty }
          assert:
            - "AuditReconciliation.${audit_nbv}.declared_loss_qty == 3"
            - "AuditReconciliation.${audit_nbv}.declared_loss_cents == 6904"
            - "AuditReconciliation.${audit_nbv}.declared_loss_cents != 9000"

  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: hire_tiered_rate_three_input_nonlinear
        grounds:
          - calculations.hire_final_charge
          - entities.Hire.fields.final_charge_cents
          - state_machines.Hire.OPEN_to_CLOSED
        distinguishing_aspect: |
          Mode (a): the per-day charge is a non-linear function of three inputs — live asset count n,
          base rate, and tier breakpoints — where tiered_daily_rate(n) selects floor(base*0.90) once
          n crosses the TIER1_QTY=10 breakpoint; a 10-asset 1-day hire pins 10*450=4500 (discounted
          rate), whereas 9 assets would price at the undiscounted 9*500=4500 — the count crossing the
          tier breakpoint changes the rate, a non-linear interaction of three inputs.
        test_recipe:
          setup:
            - "AssetType base_daily_rate_cents=500; exactly 10 AVAILABLE assets at L1; clock 2026-06-01"
            - "Hire opened with all 10 assets, closed exactly 1 day later (2026-06-02) -> tier-1 rate 450 applies"
          setup_api_calls:
            - call: "POST /pool-policies"
              payload: { name: "CHEP Blue", currency: "USD" }
              as: PoolAdmin
            - call: "POST /asset-types"
              payload: { code: "PALLET_STD", name: "Standard Pallet", base_daily_rate_cents: 500, replacement_cost_cents: 3000 }
              as: PoolAdmin
              captures: { at_id: $.data.id }
            - call: "POST /accounts"
              payload: { legal_name: "Acme", role_type: "DISTRIBUTOR", credit_limit_cents: 100000000 }
              as: PoolAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /locations"
              payload: { account_id: "${acct_id}", name: "L1" }
              as: PoolAdmin
              captures: { l1_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PoolAdmin
            - call: "POST /assets"
              payload: { asset_type_id: "${at_id}", serial: "B1", in_service_at: "2026-01-01T00:00:00Z", current_location_id: "${l1_id}" }
              as: PoolOperator
              captures: { b1: $.data.id }
            - call: "POST /assets"
              payload: { asset_type_id: "${at_id}", serial: "B2", in_service_at: "2026-01-01T00:00:00Z", current_location_id: "${l1_id}" }
              as: PoolOperator
              captures: { b2: $.data.id }
            - call: "POST /assets"
              payload: { asset_type_id: "${at_id}", serial: "B3", in_service_at: "2026-01-01T00:00:00Z", current_location_id: "${l1_id}" }
              as: PoolOperator
              captures: { b3: $.data.id }
            - call: "POST /assets"
              payload: { asset_type_id: "${at_id}", serial: "B4", in_service_at: "2026-01-01T00:00:00Z", current_location_id: "${l1_id}" }
              as: PoolOperator
              captures: { b4: $.data.id }
            - call: "POST /assets"
              payload: { asset_type_id: "${at_id}", serial: "B5", in_service_at: "2026-01-01T00:00:00Z", current_location_id: "${l1_id}" }
              as: PoolOperator
              captures: { b5: $.data.id }
            - call: "POST /assets"
              payload: { asset_type_id: "${at_id}", serial: "B6", in_service_at: "2026-01-01T00:00:00Z", current_location_id: "${l1_id}" }
              as: PoolOperator
              captures: { b6: $.data.id }
            - call: "POST /assets"
              payload: { asset_type_id: "${at_id}", serial: "B7", in_service_at: "2026-01-01T00:00:00Z", current_location_id: "${l1_id}" }
              as: PoolOperator
              captures: { b7: $.data.id }
            - call: "POST /assets"
              payload: { asset_type_id: "${at_id}", serial: "B8", in_service_at: "2026-01-01T00:00:00Z", current_location_id: "${l1_id}" }
              as: PoolOperator
              captures: { b8: $.data.id }
            - call: "POST /assets"
              payload: { asset_type_id: "${at_id}", serial: "B9", in_service_at: "2026-01-01T00:00:00Z", current_location_id: "${l1_id}" }
              as: PoolOperator
              captures: { b9: $.data.id }
            - call: "POST /assets"
              payload: { asset_type_id: "${at_id}", serial: "B10", in_service_at: "2026-01-01T00:00:00Z", current_location_id: "${l1_id}" }
              as: PoolOperator
              captures: { b10: $.data.id }
            - call: "GET /locations/${l1_id}"
              payload: {}
              as: PoolOperator
              captures: { l1_v: $.data.version }
          trigger:
            - call: "POST /hires"
              payload: { account_id: "${acct_id}", location_id: "${l1_id}", asset_type_id: "${at_id}", asset_ids: ["${b1}","${b2}","${b3}","${b4}","${b5}","${b6}","${b7}","${b8}","${b9}","${b10}"], expected_location_version: "${l1_v}" }
              as: PoolOperator
              captures: { hire_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-02T00:00:00Z" }
              as: PoolAdmin
            - call: "POST /hires/${hire_id}/close"
              payload: {}
              as: PoolOperator
              captures: { fin: $.data.final_charge_cents }
          assert:
            - "Hire.${hire_id}.final_charge_cents == 4500"

      - name: invoice_round_per_line_then_sum_pinned_order
        grounds:
          - calculations.invoice_total
          - entities.Invoice.fields.subtotal_cents
          - entities.Invoice.fields.credit_cents
          - entities.Invoice.fields.total_cents
          - state_machines.Invoice.DRAFT_to_ISSUED
        distinguishing_aspect: |
          Mode (b): nested rounding order is pinned to round-per-line-then-sum — each InvoiceLine
          amount is an already-rounded integer and the invoice SUMS the integers; with lines
          45900(HIRE)+9000(LOSS)+2000(CREDIT) the issued invoice pins subtotal=54900, credit=2000,
          total=52900, distinct from any sum-then-round interpretation of fractional inputs.
        test_recipe:
          setup:
            - "Account ACTIVE; a DRAFT invoice with three lines: HIRE 45900, LOSS 9000, CREDIT 2000"
          setup_api_calls:
            - call: "POST /pool-policies"
              payload: { name: "CHEP Blue", currency: "USD" }
              as: PoolAdmin
            - call: "POST /accounts"
              payload: { legal_name: "Acme", role_type: "RETAILER", credit_limit_cents: 100000000 }
              as: PoolAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /invoices"
              payload: { account_id: "${acct_id}" }
              as: PoolOperator
              captures: { inv_id: $.data.id }
            - call: "POST /invoices/${inv_id}/lines"
              payload: { kind: "HIRE", amount_cents: 45900 }
              as: PoolOperator
            - call: "POST /invoices/${inv_id}/lines"
              payload: { kind: "LOSS", amount_cents: 9000 }
              as: PoolOperator
            - call: "POST /invoices/${inv_id}/lines"
              payload: { kind: "CREDIT", amount_cents: 2000 }
              as: PoolOperator
          trigger:
            - call: "POST /invoices/${inv_id}/issue"
              payload: {}
              as: PoolOperator
              captures: { sub: $.data.subtotal_cents, cr: $.data.credit_cents, tot: $.data.total_cents }
          assert:
            - "Invoice.${inv_id}.subtotal_cents == 54900"
            - "Invoice.${inv_id}.credit_cents == 2000"
            - "Invoice.${inv_id}.total_cents == 52900"

  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: asset_condition_cycle_available_through_repair_back_to_available
        grounds:
          - state_machines.Asset.DAMAGED_to_IN_REPAIR
          - state_machines.Asset.IN_REPAIR_to_AVAILABLE
          - state_machines.Asset.AVAILABLE_to_DAMAGED
          - entities.Asset.fields.condition
        distinguishing_aspect: |
          The Asset condition machine is cyclic: AVAILABLE -> DAMAGED -> IN_REPAIR -> AVAILABLE
          returns to the start state on the Asset entity, a loop no linear pipeline exhibits.
        test_recipe:
          setup:
            - "One AVAILABLE asset at a depot location; a CollectionRequest collected it; a RepairJob opened over it"
          setup_api_calls:
            - call: "POST /pool-policies"
              payload: { name: "CHEP Blue", currency: "USD" }
              as: PoolAdmin
            - call: "POST /asset-types"
              payload: { code: "PALLET_STD", name: "Standard Pallet", base_daily_rate_cents: 500, replacement_cost_cents: 3000 }
              as: PoolAdmin
              captures: { at_id: $.data.id }
            - call: "POST /accounts"
              payload: { legal_name: "Acme", role_type: "MANUFACTURER", credit_limit_cents: 100000 }
              as: PoolAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /locations"
              payload: { account_id: "${acct_id}", name: "Depot" }
              as: PoolAdmin
              captures: { dep_id: $.data.id }
            - call: "POST /assets"
              payload: { asset_type_id: "${at_id}", serial: "C1", in_service_at: "2026-01-01T00:00:00Z", current_location_id: "${dep_id}" }
              as: PoolOperator
              captures: { a1: $.data.id }
            - call: "POST /assets/${a1}/report-damage"
              payload: {}
              as: PoolOperator
            - call: "POST /collection-requests"
              payload: { location_id: "${dep_id}", asset_ids: ["${a1}"] }
              as: PoolOperator
              captures: { cr_id: $.data.id }
            - call: "POST /collection-requests/${cr_id}/collect"
              payload: {}
              as: PoolOperator
            - call: "POST /repair-jobs"
              payload: { collection_request_id: "${cr_id}", asset_ids: ["${a1}"], repair_cost_cents: 1500 }
              as: PoolOperator
              captures: { rj_id: $.data.id }
          trigger:
            - call: "POST /repair-jobs/${rj_id}/complete"
              payload: {}
              as: PoolOperator
            - call: "GET /assets/${a1}"
              payload: {}
              as: PoolOperator
              captures: { cond: $.data.condition }
          assert:
            - "Asset.${a1}.condition == AVAILABLE"
            - "Asset.${a1}.current_location_id == ${dep_id}"

      - name: hire_parallel_lifecycle_and_settlement_dimensions
        grounds:
          - state_machines.Hire.OPEN_to_CLOSED
          - state_machines.Hire.UNBILLED_to_INVOICED
          - state_machines.Hire.INVOICED_to_SETTLED
          - entities.Hire.fields.lifecycle_status
          - entities.Hire.fields.settlement_status
        distinguishing_aspect: |
          Hire carries two independent axes on the SAME row: lifecycle_status moves OPEN->CLOSED
          while settlement_status independently moves UNBILLED->INVOICED->SETTLED; after invoice
          payment the hire is (lifecycle=CLOSED, settlement=SETTLED), a parallel-dimension shape on
          a different entity than the cyclic Asset machine.
        test_recipe:
          setup:
            - "Account ACTIVE credit_limit large; Location with one asset; hire opened then closed (final_charge pinned)"
            - "Invoice created with a HIRE line referencing the closed hire, issued, then fully paid"
          setup_api_calls:
            - call: "POST /pool-policies"
              payload: { name: "CHEP Blue", currency: "USD" }
              as: PoolAdmin
            - call: "POST /asset-types"
              payload: { code: "PALLET_STD", name: "Standard Pallet", base_daily_rate_cents: 500, replacement_cost_cents: 3000 }
              as: PoolAdmin
              captures: { at_id: $.data.id }
            - call: "POST /accounts"
              payload: { legal_name: "Acme", role_type: "DISTRIBUTOR", credit_limit_cents: 10000000 }
              as: PoolAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /locations"
              payload: { account_id: "${acct_id}", name: "L1" }
              as: PoolAdmin
              captures: { l1_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PoolAdmin
            - call: "POST /assets"
              payload: { asset_type_id: "${at_id}", serial: "P1", in_service_at: "2026-01-01T00:00:00Z", current_location_id: "${l1_id}" }
              as: PoolOperator
              captures: { a1: $.data.id }
            - call: "GET /locations/${l1_id}"
              payload: {}
              as: PoolOperator
              captures: { l1_v: $.data.version }
            - call: "POST /hires"
