  - rule_id: compensating_invariant
    instances:
      - name: failed_reinspection_claws_the_bond_share_back_and_the_three_cent_fields_still_sum
        grounds:
          - state_machines.RestorationTask.VERIFIED_to_REMEDIATION_REQUIRED
          - state_machines.RestorationTask.REMEDIATION_REQUIRED_to_VERIFIED
          - calculations.restoration_bond_release
          - entities.Venue.fields.bond_held_cents
          - validations[priority=28].ERR_RESTORATION_INCOMPLETE
        distinguishing_aspect: |
          The invariant is a conserved money quantity: bond_held_cents + bond_released_cents +
          bond_forfeited_cents must equal restoration_bond_cents after every single write. A
          failed re-inspection is a true compensation, not a fresh calculation: it subtracts
          exactly the cents that task previously released and zeroes the task's attribution, and
          the following pass re-releases exactly the same amount, so a full VERIFIED ->
          REMEDIATION_REQUIRED -> VERIFIED round trip leaves the ledger bit-identical with no
          rounding drift, while inspection_rounds keeps climbing. A FINAL settlement attempted
          mid-cycle must be refused and must move no cents at all.
        test_recipe:
          setup:
            - "One venue with restoration_bond_cents 1000000 and disturbed_area_sqm 4500 (obstacles 1200 + 1500 + 1000 plus an 800 sqm festival installation)."
            - "Three PENDING RestorationTask rows of 1500 sqm each: T1 RESEED, T2 DECOMPACT, T3 SILT_REMOVAL, created in that order."
            - "All three are inspected VERIFIED, so each carries share round_half_up(1000000 * 1500 / 4500) == 333333, the venue has released 999999 and holds 1, and inspection_rounds is 1 on each task."
          setup_api_calls:
            - call: "POST /ocr/venues"
              payload: { name: "Ridgeline Quarry", terrain_type: "QUARRY", water_access: "POND", land_use_zone: "AG-2", protected_acreage_sqm: 2000, restoration_bond_cents: 1000000 }
              as: PermitOfficer
              captures: { venue_id: $.data.id }
            - call: "POST /ocr/venues/${venue_id}/permits"
              payload: { permit_number: "P-2924-12", water_use_allowed: true, max_disturbed_area_sqm: 5000, quiet_hours_start_hour_utc: 22, quiet_hours_end_hour_utc: 6, valid_until_utc: "2026-12-31T00:00:00Z", restoration_deadline_utc: "2026-12-01T00:00:00Z" }
              as: CourseDesigner
              captures: { permit_id: $.data.id }
            - call: "POST /ocr/permits/${permit_id}/submit"
              payload: {}
              as: CourseDesigner
              as_user_id: "designer-1"
            - call: "POST /ocr/permits/${permit_id}/decision"
              payload: { decision: "APPROVED", decision_note: "Approved as filed" }
              as: PermitOfficer
              as_user_id: "officer-1"
            - call: "POST /ocr/venues/${venue_id}/courses"
              payload: { name: "Quarry Gauntlet", total_distance_m: 10000, corral_release_rate_per_min: 12.00, corral_throughput_capacity: 200 }
              as: CourseDesigner
              captures: { course_id: $.data.id }
            - call: "POST /ocr/courses/${course_id}/obstacles"
              payload: { name: "Cargo Net", station_index: 1, difficulty_rating: 3, lane_count: 4, service_rate_per_min: 3.00, marshals_required: 2, footprint_sqm: 1200, water_contact: false, bypass_mode: "NONE", penalty_seconds: 0 }
              as: CourseDesigner
              captures: { o1_id: $.data.id }
            - call: "POST /ocr/courses/${course_id}/obstacles"
              payload: { name: "Pond Crossing", station_index: 2, difficulty_rating: 5, lane_count: 3, service_rate_per_min: 2.50, marshals_required: 2, footprint_sqm: 1500, water_contact: true, bypass_mode: "MANDATORY", penalty_seconds: 120 }
              as: CourseDesigner
              captures: { o2_id: $.data.id }
            - call: "POST /ocr/courses/${course_id}/obstacles"
              payload: { name: "Wall Climb", station_index: 3, difficulty_rating: 7, lane_count: 3, service_rate_per_min: 3.00, marshals_required: 1, footprint_sqm: 1000, water_contact: false, bypass_mode: "TIMED_PENALTY", penalty_seconds: 90 }
              as: CourseDesigner
              captures: { o3_id: $.data.id }
            - call: "POST /ocr/venues/${venue_id}/festival-services"
              payload: { service_type: "BAG_CHECK", footprint_sqm: 800, capacity: 500, water_draw_lpm: 0 }
              as: SiteOpsLead
              captures: { fs_bag_id: $.data.id }
            - call: "POST /ocr/venues/${venue_id}/restoration-tasks"
              payload: { task_type: "RESEED", area_sqm: 1500 }
              as: PermitOfficer
              captures: { t1_id: $.data.id }
            - call: "POST /ocr/venues/${venue_id}/restoration-tasks"
              payload: { task_type: "DECOMPACT", area_sqm: 1500 }
              as: PermitOfficer
              captures: { t2_id: $.data.id }
            - call: "POST /ocr/venues/${venue_id}/restoration-tasks"
              payload: { task_type: "SILT_REMOVAL", area_sqm: 1500 }
              as: PermitOfficer
              captures: { t3_id: $.data.id }
            - call: "POST /ocr/restoration-tasks/${t1_id}/inspect"
              payload: { outcome: "VERIFIED", findings_note: "Seed established" }
              as: PermitOfficer
            - call: "POST /ocr/restoration-tasks/${t2_id}/inspect"
              payload: { outcome: "VERIFIED", findings_note: "Compaction relieved" }
              as: PermitOfficer
            - call: "POST /ocr/restoration-tasks/${t3_id}/inspect"
              payload: { outcome: "VERIFIED", findings_note: "Silt cleared" }
              as: PermitOfficer
          trigger:
            - call: "POST /ocr/restoration-tasks/${t3_id}/inspect"
              payload: { outcome: "REMEDIATION_REQUIRED", findings_note: "Silt curtain failed after rain" }
              as: PermitOfficer
            - call: "GET /ocr/venues/${venue_id}"
              payload: {}
              as: PermitOfficer
              captures: { venue_v_after_clawback: $.data.version }
            - call: "POST /ocr/venues/${venue_id}/bond-releases"
              payload: { settlement_type: "FINAL", expected_venue_version: "${venue_v_after_clawback}" }
              as: PermitOfficer
            - call: "POST /ocr/restoration-tasks/${t3_id}/inspect"
              payload: { outcome: "VERIFIED", findings_note: "Curtain rebuilt and holding" }
              as: PermitOfficer
          assert:
            - "Venue.${venue_id}.disturbed_area_sqm == 4500"
            - "After the first trigger call: RestorationTask.${t3_id}.status == REMEDIATION_REQUIRED, bond_release_cents == 0 and inspection_rounds == 2"
            - "After the first trigger call: Venue.${venue_id}.bond_released_cents == 666666, bond_held_cents == 333334 and bond_forfeited_cents == 0"
            - "After the first trigger call: bond_held_cents + bond_released_cents + bond_forfeited_cents == 1000000"
            - "The third trigger call returns 409 with error_id ERR_RESTORATION_INCOMPLETE"
            - "The refused settlement moves no cents: Venue.${venue_id}.bond_released_cents is still 666666 and site_posture is still OPEN"
            - "After the fourth trigger call: RestorationTask.${t3_id}.status == VERIFIED, bond_release_cents == 333333 and inspection_rounds == 3"
            - "After the fourth trigger call: Venue.${venue_id}.bond_released_cents == 999999 and bond_held_cents == 1, bit-identical to the pre-clawback ledger"
            - "RestorationTask.${t1_id}.bond_release_cents == 333333 and RestorationTask.${t2_id}.bond_release_cents == 333333 throughout"

      - name: reassigning_an_entry_conserves_the_total_roster_count_across_both_heats
        grounds:
          - endpoints[POST /ocr/entries/{id}/reassign-wave]
          - entities.Wave.fields.assigned_count
          - validations[priority=31].ERR_WAVE_CAPACITY_EXCEEDED
          - validations[priority=10].ERR_WAVE_COURSE_MISMATCH
        distinguishing_aspect: |
          The conserved quantity here is a headcount rather than money, and the compensation is
          symmetric within one request: the source heat's assigned_count must fall by exactly one
          at the same moment the target's rises by one, so the sum over the course is invariant.
          Both refusal paths must be neutral: a target at capacity and a target carrying a
          different division each leave BOTH counters exactly where they were, with no
          half-applied move and no orphaned row, and Course.scheduled_capacity_total (a sum of
          declared capacities, not of occupants) never moves at all.
        test_recipe:
          setup:
            - "One venue and one DRAFT course with the three canonical obstacles, so the priority-30 gate is 112 and corral_throughput_capacity 200 is never approached."
            - "Two divisions: OPEN 'Open Wave' (min_age 16) and COMPETITIVE 'Elite' (min_age 18)."
            - "Heat W1 at 08:00:00 capacity 5 carries the OPEN division and holds three REGISTERED entries; heat W2 at 08:02:00 capacity 2 carries the same OPEN division and holds one; heat W3 at 08:04:00 capacity 5 carries the COMPETITIVE division and is empty."
            - "All four participants were born in 2000 and have signed clean waivers, so they are CLEARED and age-eligible for both divisions. Every roster is still OPEN."
          setup_api_calls:
            - call: "POST /ocr/venues"
              payload: { name: "Ridgeline Quarry", terrain_type: "QUARRY", water_access: "POND", land_use_zone: "AG-2", protected_acreage_sqm: 2000, restoration_bond_cents: 500000 }
              as: PermitOfficer
              captures: { venue_id: $.data.id }
            - call: "POST /ocr/venues/${venue_id}/courses"
              payload: { name: "Quarry Gauntlet", total_distance_m: 10000, corral_release_rate_per_min: 12.00, corral_throughput_capacity: 200 }
              as: CourseDesigner
              captures: { course_id: $.data.id }
            - call: "POST /ocr/courses/${course_id}/obstacles"
              payload: { name: "Cargo Net", station_index: 1, difficulty_rating: 3, lane_count: 4, service_rate_per_min: 3.00, marshals_required: 2, footprint_sqm: 1200, water_contact: false, bypass_mode: "NONE", penalty_seconds: 0 }
              as: CourseDesigner
              captures: { o1_id: $.data.id }
            - call: "POST /ocr/courses/${course_id}/obstacles"
              payload: { name: "Pond Crossing", station_index: 2, difficulty_rating: 5, lane_count: 3, service_rate_per_min: 2.50, marshals_required: 2, footprint_sqm: 1500, water_contact: true, bypass_mode: "MANDATORY", penalty_seconds: 120 }
              as: CourseDesigner
              captures: { o2_id: $.data.id }
            - call: "POST /ocr/courses/${course_id}/obstacles"
              payload: { name: "Wall Climb", station_index: 3, difficulty_rating: 7, lane_count: 3, service_rate_per_min: 3.00, marshals_required: 1, footprint_sqm: 1000, water_contact: false, bypass_mode: "TIMED_PENALTY", penalty_seconds: 90 }
              as: CourseDesigner
              captures: { o3_id: $.data.id }
            - call: "POST /ocr/divisions"
              payload: { name: "Open Wave", division_type: "OPEN", bypass_policy: "ALLOWED_WITH_PENALTY", scoring_mode: "GUN_TIME", min_age: 16, team_size_min: 1, team_size_max: 1 }
              as: RaceDirector
              captures: { div_open_id: $.data.id }
            - call: "POST /ocr/divisions"
              payload: { name: "Elite", division_type: "COMPETITIVE", bypass_policy: "DQ_ON_BYPASS", scoring_mode: "CHIP_TIME", min_age: 18, team_size_min: 1, team_size_max: 1 }
              as: RaceDirector
              captures: { div_comp_id: $.data.id }
            - call: "POST /ocr/courses/${course_id}/waves"
              payload: { division_id: "${div_open_id}", wave_code: "W1", scheduled_start_utc: "2026-09-12T08:00:00Z", capacity: 5 }
              as: RaceDirector
              captures: { wave_w1_id: $.data.id }
            - call: "POST /ocr/courses/${course_id}/waves"
              payload: { division_id: "${div_open_id}", wave_code: "W2", scheduled_start_utc: "2026-09-12T08:02:00Z", capacity: 2 }
              as: RaceDirector
              captures: { wave_w2_id: $.data.id }
            - call: "POST /ocr/courses/${course_id}/waves"
              payload: { division_id: "${div_comp_id}", wave_code: "W3", scheduled_start_utc: "2026-09-12T08:04:00Z", capacity: 5 }
              as: RaceDirector
              captures: { wave_w3_id: $.data.id }
            - call: "POST /ocr/participants"
              payload: { full_name: "Ada Rock", birth_year: 2000, email: "ada@example.com", chip_id: "CHIP-001" }
              as: SiteOpsLead
              captures: { p1_id: $.data.id }
            - call: "POST /ocr/participants/${p1_id}/waiver"
              payload: { signature_name: "Ada Rock" }
              as: Participant
              as_user_id: "${p1_id}"
            - call: "POST /ocr/participants"
              payload: { full_name: "Bo Stone", birth_year: 2000, email: "bo@example.com", chip_id: "CHIP-002" }
              as: SiteOpsLead
              captures: { p2_id: $.data.id }
            - call: "POST /ocr/participants/${p2_id}/waiver"
              payload: { signature_name: "Bo Stone" }
              as: Participant
              as_user_id: "${p2_id}"
            - call: "POST /ocr/participants"
              payload: { full_name: "Cy Fern", birth_year: 2000, email: "cy@example.com", chip_id: "CHIP-003" }
              as: SiteOpsLead
              captures: { p3_id: $.data.id }
            - call: "POST /ocr/participants/${p3_id}/waiver"
              payload: { signature_name: "Cy Fern" }
              as: Participant
              as_user_id: "${p3_id}"
            - call: "POST /ocr/participants"
              payload: { full_name: "Di Marsh", birth_year: 2000, email: "di@example.com", chip_id: "CHIP-004" }
              as: SiteOpsLead
              captures: { p4_id: $.data.id }
            - call: "POST /ocr/participants/${p4_id}/waiver"
              payload: { signature_name: "Di Marsh" }
              as: Participant
              as_user_id: "${p4_id}"
            - call: "POST /ocr/waves/${wave_w1_id}/entries"
              payload: { participant_id: "${p1_id}", bib_number: 1 }
              as: SiteOpsLead
              captures: { e1_id: $.data.id }
            - call: "POST /ocr/waves/${wave_w1_id}/entries"
              payload: { participant_id: "${p2_id}", bib_number: 2 }
              as: SiteOpsLead
              captures: { e2_id: $.data.id }
            - call: "POST /ocr/waves/${wave_w1_id}/entries"
              payload: { participant_id: "${p3_id}", bib_number: 3 }
              as: SiteOpsLead
              captures: { e3_id: $.data.id }
            - call: "POST /ocr/waves/${wave_w2_id}/entries"
              payload: { participant_id: "${p4_id}", bib_number: 4 }
              as: SiteOpsLead
              captures: { e4_id: $.data.id }
          trigger:
            - call: "POST /ocr/entries/${e1_id}/reassign-wave"
              payload: { target_wave_id: "${wave_w2_id}" }
              as: RaceDirector
            - call: "POST /ocr/entries/${e2_id}/reassign-wave"
              payload: { target_wave_id: "${wave_w2_id}" }
              as: RaceDirector
            - call: "POST /ocr/entries/${e2_id}/reassign-wave"
              payload: { target_wave_id: "${wave_w3_id}" }
              as: RaceDirector
          assert:
            - "The first trigger call returns 200; Entry.${e1_id}.wave_id == ${wave_w2_id}"
            - "After the first trigger call: Wave.${wave_w1_id}.assigned_count == 2 and Wave.${wave_w2_id}.assigned_count == 2, so the total is still 4"
            - "The second trigger call returns 409 with error_id ERR_WAVE_CAPACITY_EXCEEDED (2 + 1 > 2)"
            - "The third trigger call returns 409 with error_id ERR_WAVE_COURSE_MISMATCH (W3 carries a different division)"
            - "Entry.${e2_id}.wave_id == ${wave_w1_id} after both refusals"
            - "After all three trigger calls: Wave.${wave_w1_id}.assigned_count == 2, Wave.${wave_w2_id}.assigned_count == 2 and Wave.${wave_w3_id}.assigned_count == 0"
            - "Course.${course_id}.scheduled_capacity_total == 12 before and after every trigger call"
