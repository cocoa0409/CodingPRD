            - call: "POST /wholesale/orders"
              payload: { retailer_id: "${r_id}", brand_id: "${b_id}", lines: [{ sku: "S1", unit_price_cents: 5000, qty: 1 }] }
              as: Retailer
              as_user_id: "${r_id}"
              captures: { o_id: $.data.id }
            - call: "POST /wholesale/fraud-flags"
              payload: { retailer_id: "${r_id}", flag_type: "RETURN_ABUSE", order_id: "${o_id}" }
              as: RiskAnalyst
              captures: { f1: $.data.id }
            - call: "POST /wholesale/fraud-flags/${f1}/confirm"
              payload: {}
              as: PlatformAdmin
            - call: "POST /wholesale/fraud-flags"
              payload: { retailer_id: "${r_id}", flag_type: "RETURN_ABUSE", order_id: "${o_id}" }
              as: RiskAnalyst
              captures: { f2: $.data.id }
            - call: "POST /wholesale/fraud-flags/${f2}/confirm"
              payload: {}
              as: PlatformAdmin
            - call: "POST /wholesale/fraud-flags"
              payload: { retailer_id: "${r_id}", flag_type: "RETURN_ABUSE", order_id: "${o_id}" }
              as: RiskAnalyst
              captures: { f3: $.data.id }
            - call: "POST /wholesale/fraud-flags/${f3}/confirm"
