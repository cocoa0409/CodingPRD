      - name: crash_below_threshold_rejected
        claim_type: ViolationToError
        grounds:
          - validations[priority=18]
          - errors.ERR_CRASH_BELOW_THRESHOLD
        distinguishing_aspect: "delta_v=7.99 returns 422 ERR_CRASH_BELOW_THRESHOLD."
        test_recipe:
          setup: ["Circle with OPEN trip."]
          setup_api_calls:
            - *clock_set
            - call: "POST /api/circles"
              payload: { name: "BelowFam", subscription_tier: "PLUS", billing_anchor_day: 1, owner_display_name: "Bl", owner_birthdate: "1980-01-01T00:00:00Z", owner_email: "bl@example.com" }
