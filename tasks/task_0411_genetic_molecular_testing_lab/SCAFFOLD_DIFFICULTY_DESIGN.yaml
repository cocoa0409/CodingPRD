        grounds:
          - validations[priority=5]
          - validations[priority=13]
          - errors[ERR_ORDER_BAD_PIPELINE_STATE]
          - errors[ERR_BILLING_NOT_CLEARED]
        distinguishing_aspect: |
          Sign-out where pipeline_status is wrong (SEQUENCING, not CLASSIFIED — priority-5
          state) AND financial_status is PENDING (priority-13 business_fiscal) returns the
          higher-priority state error ERR_ORDER_BAD_PIPELINE_STATE, not ERR_BILLING_NOT_CLEARED.
          Pair: state vs business_fiscal.
        test_recipe:
          setup:
            - "Order in SEQUENCING with a DRAFT report created early-illegally is not possible; instead the order is at SEQUENCING with no draft report. Sign-out is attempted on a fabricated report path; but to keep both violations live, the order is CLASSIFIED-adjacent: order is left at SEQUENCING (not CLASSIFIED) AND financial PENDING, with a DRAFT report present."
            - "To create a DRAFT report the order must be CLASSIFIED; so we drive to CLASSIFIED, create the report, then regress is impossible. Instead we exploit that report creation requires CLASSIFIED, so we reach CLASSIFIED, create DRAFT report, then the pipeline is CLASSIFIED — to make the state precondition fail we DO NOT advance billing, leaving financial PENDING, and we additionally test by signing out twice: first attempt fails on fiscal only. For the dual-violation we instead place the report and leave billing PENDING while keeping pipeline at CLASSIFIED is single-violation. Therefore this instance drives the order to a DRAFT report at CLASSIFIED but with an UNCLASSIFIED extra variant added after report creation, which is not allowed."
            - "Concrete reachable dual-failure: order CLASSIFIED, DRAFT report exists, financial PENDING (no auth). Then call classification/complete is irrelevant. We force pipeline mismatch by re-opening: not possible. So we instead trigger the two checks both reachable at sign-out by leaving the order at CLASSIFIED but with financial PENDING and signing a report that was NOT yet created (bad report id) — that is existence not state. To keep it a STATE vs FISCAL pair we instead drive order to SEQUENCING, create no report; the sign-out targets a report id from a DIFFERENT classified order, making the path-existence pass and the order-state fail while that other order's billing is PENDING."
          setup_api_calls:
            - call: "POST /lab/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-19T00:00:00.000Z" }
              as: LabDirector
