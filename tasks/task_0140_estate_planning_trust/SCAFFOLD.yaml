# =============================================================================
# Task 0140: Estate Planning & Trust Administration
# =============================================================================

scenario: |
  Estate Planning & Trust Administration: asset inventory, beneficiary
  designation, Executor/Trustee, guardianship, HIPAA authorization, Power
  of Attorney (POA), end-of-life directives, Probate supervision.

domain_name: estate-planning-trust
api_prefix: /estates

complexity_profile:
  primary_archetype: multi_party_negotiation
  secondary_archetype: compliance_audit
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - scheduled_deferred_actions
    - version_pinning_on_approval

  entity_topology: hybrid
  state_machine_shape: branching          # branching with revert on probate + cyclic on directive revisions + compound posture on estate
  relationship_patterns:
    - one_to_many                          # Estate → Assets / Beneficiaries / Directives
    - many_to_many                          # BeneficiaryDesignation links Asset ↔ Beneficiary
    - cross_aggregate                       # POA gates Asset mutations, HIPAA gates EOL execution
    - polymorphic                           # Fiduciary scope_type = EXECUTOR | TRUSTEE | GUARDIAN

  role_model: segregation_of_duties        # Executor, Trustee, Court Clerk separated; petitioner ≠ approver
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Estate
    parent: null
    common_fields: true
    fields:
      - { name: testator_name, type: string, source: input, description: "Full legal name of the decedent/testator" }
      - { name: domicile_state, type: string, source: input, description: "Two-letter US state code where probate is filed" }
      - { name: filing_court_id, type: string, source: input, description: "Opaque identifier of supervising probate court" }
      - { name: gross_estate_value_cents, type: integer, source: computed, description: "Sum of Asset.appraised_value_cents for assets in INVENTORIED/APPRAISED/DISTRIBUTED (in cents, integer)" }
      - { name: net_estate_value_cents, type: integer, source: computed, description: "gross_estate_value_cents minus sum of approved debts/fees; see §1.3 net_estate_value" }
      - { name: admin_phase, type: enum, source: system, description: "DRAFT | IN_PROBATE | INVENTORIED | DISTRIBUTING | SETTLED | CONTESTED", constraints: "Values produced by §1.2 Estate transitions" }
      - { name: probate_posture, type: enum, source: computed, description: "OPEN | UNDER_COURT_REVIEW | FROZEN — derived per §1.3 probate_posture", constraints: "Computed only — never written via input" }
      - { name: petition_filed_at, type: datetime, source: system, description: "Timestamp when estate transitioned DRAFT → IN_PROBATE; null while DRAFT" }
      - { name: settlement_due_at, type: datetime, source: system, description: "petition_filed_at + 18 months; null while DRAFT" }
      - { name: contested_at, type: datetime, source: system, description: "Timestamp of latest unresolved CONTESTED entry; null otherwise" }

  - name: Asset
    parent: Estate
    common_fields: true
    fields:
      - { name: estate_id, type: string, source: system, description: "Parent Estate id" }
      - { name: asset_class, type: enum, source: input, description: "REAL_ESTATE | FINANCIAL | PERSONAL_PROPERTY | DIGITAL", constraints: "One of the four literals" }
      - { name: description, type: string, source: input, description: "Free-text asset description (max 500 chars)" }
      - { name: declared_value_cents, type: integer, source: input, description: "Executor's initial declared value, cents integer ≥ 0" }
      - { name: appraised_value_cents, type: integer, source: input, description: "Court-recognized appraised value, set on APPRAISED transition; cents integer ≥ 0" }
      - { name: status, type: enum, source: system, description: "DECLARED | INVENTORIED | APPRAISED | DISTRIBUTED | EXCLUDED", constraints: "Values produced by §1.2 Asset transitions" }
      - { name: distribution_id, type: string, source: system, description: "Set when Asset transitions to DISTRIBUTED; references Distribution.id; null otherwise" }
      - { name: requires_poa_for_mutation, type: boolean, source: input, description: "If true, PATCH/state changes pre-probate require an ACTIVE financial POA covering this asset_class", default: false }

  - name: Beneficiary
    parent: Estate
    common_fields: true
    fields:
      - { name: estate_id, type: string, source: system, description: "Parent Estate id" }
      - { name: full_name, type: string, source: input, description: "Legal name of the beneficiary" }
      - { name: relationship, type: enum, source: input, description: "SPOUSE | CHILD | PARENT | SIBLING | CHARITY | OTHER" }
      - { name: is_minor, type: boolean, source: input, description: "True if beneficiary is under 18 at estate filing; gates guardianship requirement" }
      - { name: guardianship_id, type: string, source: system, description: "If is_minor=true, required GuardianshipDirective id; null when minor not yet matched" }
      - { name: status, type: enum, source: system, description: "ACTIVE | DISCLAIMED | REMOVED", constraints: "Values produced by §1.2 Beneficiary transitions; DISCLAIMED is irrevocable" }

  - name: BeneficiaryDesignation
    parent: Estate
    common_fields: false                # append-only allocation record per asset+beneficiary
    fields:
      - { name: estate_id, type: string, source: system, description: "Parent Estate id" }
      - { name: asset_id, type: string, source: input, description: "Asset receiving this designation" }
      - { name: beneficiary_id, type: string, source: input, description: "Beneficiary id (must be Beneficiary.status=ACTIVE at creation)" }
      - { name: share_basis_points, type: integer, source: input, description: "Share of this asset, in basis points (0–10000). Sum of all ACTIVE designations per asset ≤ 10000" }
      - { name: priority_rank, type: integer, source: input, description: "Tie-break for waterfall allocation when total exceeds 10000 due to retroactive disclaim; lower rank = paid first" }
      - { name: status, type: enum, source: system, description: "PROPOSED | LOCKED | VOIDED", constraints: "PROPOSED → LOCKED on Estate INVENTORIED→DISTRIBUTING; VOIDED when Beneficiary DISCLAIMED or REMOVED" }

  - name: Fiduciary
    parent: Estate
    common_fields: true
    fields:
      - { name: estate_id, type: string, source: system, description: "Parent Estate id" }
      - { name: scope_type, type: enum, source: input, description: "EXECUTOR | TRUSTEE | GUARDIAN", constraints: "Polymorphic role — EXECUTOR active during IN_PROBATE; TRUSTEE on trust assets; GUARDIAN of minor beneficiaries" }
      - { name: full_name, type: string, source: input, description: "Legal name of appointed fiduciary" }
      - { name: contact_user_id, type: string, source: input, description: "X-User-ID that this fiduciary signs requests with; used for RBAC ownership check" }
      - { name: status, type: enum, source: system, description: "NOMINATED | CONFIRMED | RESIGNED | REMOVED", constraints: "Values produced by §1.2 Fiduciary transitions" }
      - { name: bond_amount_cents, type: integer, source: input, description: "Bond posted with court, cents integer ≥ 0. Required ≥ §1.3 required_bond when scope_type=EXECUTOR and Estate.admin_phase=IN_PROBATE" }
      - { name: court_confirmation_at, type: datetime, source: system, description: "Timestamp of court CONFIRMED transition; null while NOMINATED" }

  - name: GuardianshipDirective
    parent: Estate
    common_fields: true
    fields:
      - { name: estate_id, type: string, source: system, description: "Parent Estate id" }
      - { name: minor_beneficiary_id, type: string, source: input, description: "Beneficiary id with is_minor=true" }
      - { name: guardian_fiduciary_id, type: string, source: input, description: "Fiduciary with scope_type=GUARDIAN" }
      - { name: effective_at, type: datetime, source: input, description: "Wall-clock time at which guardianship becomes effective (ISO8601 UTC)" }
      - { name: status, type: enum, source: system, description: "DRAFT | EFFECTIVE | SUPERSEDED | REVOKED", constraints: "Auto-transitions to EFFECTIVE when current clock ≥ effective_at AND Estate.admin_phase = IN_PROBATE" }

  - name: HIPAAAuthorization
    parent: Estate
    common_fields: true
    fields:
      - { name: estate_id, type: string, source: system, description: "Parent Estate id" }
      - { name: authorized_recipient, type: string, source: input, description: "Name/identifier of authorized recipient (provider, family, fiduciary)" }
      - { name: scope, type: enum, source: input, description: "MEDICAL_RECORDS | MENTAL_HEALTH | SUBSTANCE_ABUSE | ALL", constraints: "Determines coverage envelope for EndOfLifeDirective execution" }
      - { name: signed_at, type: datetime, source: input, description: "Date HIPAA form was signed by testator (ISO8601 UTC)" }
      - { name: expires_at, type: datetime, source: input, description: "Expiry timestamp; if null, authorization is durable (no expiry)" }
      - { name: status, type: enum, source: system, description: "ACTIVE | EXPIRED | REVOKED", constraints: "Auto-transitions ACTIVE→EXPIRED when current clock ≥ expires_at" }

  - name: PowerOfAttorney
    parent: Estate
    common_fields: true
    fields:
      - { name: estate_id, type: string, source: system, description: "Parent Estate id" }
      - { name: poa_type, type: enum, source: input, description: "FINANCIAL_DURABLE | MEDICAL | LIMITED" }
      - { name: agent_fiduciary_id, type: string, source: input, description: "Fiduciary id of designated agent" }
      - { name: asset_class_scope, type: array, source: input, description: "Subset of {REAL_ESTATE, FINANCIAL, PERSONAL_PROPERTY, DIGITAL} the POA covers; empty array means none; ALL when full envelope" }
      - { name: effective_at, type: datetime, source: input, description: "Earliest activation timestamp; UTC" }
      - { name: revoked_at, type: datetime, source: system, description: "Timestamp of revocation; null while ACTIVE" }
      - { name: status, type: enum, source: system, description: "PENDING | ACTIVE | REVOKED | TERMINATED", constraints: "Auto-transitions PENDING→ACTIVE when current clock ≥ effective_at; TERMINATED on testator death (Estate IN_PROBATE)" }

  - name: EndOfLifeDirective
    parent: Estate
    common_fields: true
    fields:
      - { name: estate_id, type: string, source: system, description: "Parent Estate id" }
      - { name: directive_type, type: enum, source: input, description: "LIVING_WILL | DNR | DNI | POLST" }
      - { name: instructions, type: string, source: input, description: "Free-text instructions, max 4000 chars" }
      - { name: requires_hipaa_scope, type: enum, source: input, description: "Minimum HIPAA scope required to execute this directive: MEDICAL_RECORDS | MENTAL_HEALTH | SUBSTANCE_ABUSE | ALL" }
      - { name: status, type: enum, source: system, description: "DRAFT | EXECUTED | SUPERSEDED | REVOKED", constraints: "Cyclic: DRAFT → SUPERSEDED on new revision then new DRAFT created (revision loop)" }
      - { name: supersedes_directive_id, type: string, source: input, description: "If non-null, this directive supersedes a prior one; the prior directive auto-transitions DRAFT/EXECUTED → SUPERSEDED" }
      - { name: executed_at, type: datetime, source: system, description: "Timestamp directive moved to EXECUTED; null otherwise" }

  - name: ProbateFiling
    parent: Estate
    common_fields: true
    fields:
      - { name: estate_id, type: string, source: system, description: "Parent Estate id" }
      - { name: filing_type, type: enum, source: input, description: "PETITION_TO_PROBATE | INVENTORY_REPORT | INTERIM_ACCOUNTING | FINAL_ACCOUNTING | DISTRIBUTION_PETITION" }
      - { name: filed_by_fiduciary_id, type: string, source: input, description: "Fiduciary submitting the filing (must be EXECUTOR with status=CONFIRMED for ALL filing_types except PETITION_TO_PROBATE)" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | ACCEPTED | REJECTED | REVISION_REQUESTED", constraints: "Cyclic: REVISION_REQUESTED → SUBMITTED (re-filed) → ACCEPTED|REJECTED" }
      - { name: court_response_at, type: datetime, source: system, description: "Timestamp court last responded; null while SUBMITTED" }
      - { name: rejection_reason, type: string, source: input, description: "Required when status=REJECTED or REVISION_REQUESTED; null otherwise" }

  - name: Distribution
    parent: Estate
    common_fields: true
    fields:
      - { name: estate_id, type: string, source: system, description: "Parent Estate id" }
      - { name: beneficiary_id, type: string, source: input, description: "Beneficiary receiving this distribution (must be Beneficiary.status=ACTIVE)" }
      - { name: planned_amount_cents, type: integer, source: computed, description: "Planned share, cents integer ≥ 0; computed per §1.3 planned_distribution" }
      - { name: actual_amount_cents, type: integer, source: input, description: "Actual disbursed amount; required on EXECUTED transition; cents integer ≥ 0" }
      - { name: status, type: enum, source: system, description: "PLANNED | EXECUTED | REVERSED", constraints: "Values per §1.2 Distribution transitions; REVERSED is compensating action" }
      - { name: executed_at, type: datetime, source: system, description: "Timestamp moved to EXECUTED; null otherwise" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:

  # ---------------- Estate ----------------
  - entity: Estate
    initial_state: DRAFT
    terminal_states: [SETTLED]
    transitions:
      - from: DRAFT
        to: IN_PROBATE
        trigger: "POST /estates/{estateId}/state with to_status=IN_PROBATE"
        actor: Executor
        preconditions:
          - "At least one Fiduciary with scope_type=EXECUTOR and status=CONFIRMED (ERR_NO_CONFIRMED_EXECUTOR)"
          - "A ProbateFiling with filing_type=PETITION_TO_PROBATE and status=ACCEPTED exists (ERR_NO_ACCEPTED_PETITION)"
          - "Executor.bond_amount_cents ≥ §1.3 required_bond computed against current Estate.gross_estate_value_cents (ERR_BOND_INSUFFICIENT)"
        side_effects:
          - "Estate.petition_filed_at = now()"
          - "Estate.settlement_due_at = petition_filed_at + 18 months"
          - "ALL PowerOfAttorney rows with status IN {PENDING, ACTIVE} → TERMINATED (cascade depth 1)"
          - "Each TERMINATED PowerOfAttorney further triggers Asset.requires_poa_for_mutation revalidation; any DECLARED asset whose mutation was permitted only via a now-TERMINATED POA becomes locked from PATCH (cascade depth 2)"
        note: "Death event simulated by IN_PROBATE; all POAs terminate."

      - from: IN_PROBATE
        to: INVENTORIED
        trigger: "POST /estates/{estateId}/state with to_status=INVENTORIED"
        actor: Executor
        preconditions:
          - "A ProbateFiling with filing_type=INVENTORY_REPORT and status=ACCEPTED exists (ERR_NO_ACCEPTED_INVENTORY)"
          - "Every Asset is in status IN {INVENTORIED, APPRAISED, EXCLUDED} (ERR_ASSETS_NOT_INVENTORIED)"
        side_effects:
          - "Estate.gross_estate_value_cents recomputed per §1.3 gross_estate_value"

      - from: INVENTORIED
        to: DISTRIBUTING
        trigger: "POST /estates/{estateId}/state with to_status=DISTRIBUTING"
        actor: Executor
        preconditions:
          - "Probate posture (§1.3) must be OPEN — not UNDER_COURT_REVIEW or FROZEN (ERR_POSTURE_BLOCKED)"
          - "Every minor Beneficiary has GuardianshipDirective.status=EFFECTIVE (ERR_GUARDIANSHIP_MISSING)"
          - "Sum of share_basis_points per asset across PROPOSED BeneficiaryDesignations = 10000 (ERR_DESIGNATIONS_INCOMPLETE)"
          - "A ProbateFiling with filing_type=DISTRIBUTION_PETITION and status=ACCEPTED exists (ERR_NO_ACCEPTED_DISTRIBUTION_PETITION)"
        side_effects:
          - "All BeneficiaryDesignation.status PROPOSED → LOCKED (version-pinned: bound to current Beneficiary set and asset appraised values)"
          - "Planned Distribution rows are computed and persisted per §1.3 planned_distribution"

      - from: DISTRIBUTING
        to: SETTLED
        trigger: "POST /estates/{estateId}/state with to_status=SETTLED"
        actor: Executor
        preconditions:
          - "Every Asset with a LOCKED BeneficiaryDesignation has status=DISTRIBUTED (ERR_ASSETS_NOT_DISTRIBUTED)"
          - "A ProbateFiling with filing_type=FINAL_ACCOUNTING and status=ACCEPTED exists (ERR_NO_ACCEPTED_FINAL_ACCOUNTING)"
          - "Sum of Distribution.actual_amount_cents for EXECUTED rows equals §1.3 planned_distribution_total within rounding floor (ERR_DISTRIBUTION_DRIFT)"
        side_effects:
          - "All Fiduciary rows with status=CONFIRMED and scope_type=EXECUTOR → REMOVED (cascade depth 1)"
          - "All HIPAAAuthorization rows with status=ACTIVE → REVOKED (cascade depth 1)"

      - from: IN_PROBATE
        to: CONTESTED
        trigger: "POST /estates/{estateId}/state with to_status=CONTESTED"
        actor: CourtClerk
        preconditions: []
        side_effects:
          - "Estate.contested_at = now()"
          - "All ProbateFiling rows with status=SUBMITTED → REVISION_REQUESTED with rejection_reason='estate_contested' (cascade depth 1)"
          - "Each REVISION_REQUESTED filing blocks Estate from advancing INVENTORIED→DISTRIBUTING until it is re-SUBMITTED and ACCEPTED (cascade depth 2)"
        note: "Branching with revert — court raises a contest mid-probate."

      - from: INVENTORIED
        to: CONTESTED
        trigger: "POST /estates/{estateId}/state with to_status=CONTESTED"
        actor: CourtClerk
        preconditions: []
        side_effects:
          - "Same as IN_PROBATE→CONTESTED"

      - from: CONTESTED
        to: IN_PROBATE
        trigger: "POST /estates/{estateId}/state with to_status=IN_PROBATE (resolution)"
        actor: CourtClerk
        preconditions:
          - "No ProbateFiling with status=REVISION_REQUESTED remains (ERR_FILINGS_PENDING)"
        side_effects:
          - "Estate.contested_at = null"

  # ---------------- Asset ----------------
  - entity: Asset
    initial_state: DECLARED
    terminal_states: [DISTRIBUTED, EXCLUDED]
    transitions:
      - from: DECLARED
        to: INVENTORIED
        trigger: "POST /estates/{estateId}/assets/{assetId}/state with to_status=INVENTORIED"
        actor: Executor
        preconditions:
          - "Estate.admin_phase IN {IN_PROBATE, INVENTORIED} (ERR_INVALID_STATE)"
        side_effects: []

      - from: INVENTORIED
        to: APPRAISED
        trigger: "POST /estates/{estateId}/assets/{assetId}/state with to_status=APPRAISED, appraised_value_cents=N"
        actor: Executor
        preconditions:
          - "appraised_value_cents required and ≥ 0 (ERR_BAD_REQUEST)"
        side_effects:
          - "Asset.appraised_value_cents = N"
          - "Estate.gross_estate_value_cents recomputed per §1.3 gross_estate_value"

      - from: APPRAISED
        to: DISTRIBUTED
        trigger: "POST /estates/{estateId}/assets/{assetId}/state with to_status=DISTRIBUTED, distribution_id=D"
        actor: Executor
        preconditions:
          - "Estate.admin_phase = DISTRIBUTING (ERR_INVALID_STATE)"
          - "Distribution D exists, status=EXECUTED (ERR_INVALID_STATE)"
          - "A LOCKED BeneficiaryDesignation links this Asset to Distribution.beneficiary_id (ERR_DESIGNATION_MISMATCH)"
        side_effects:
          - "Asset.distribution_id = D"

      - from: DECLARED
        to: EXCLUDED
        trigger: "POST /estates/{estateId}/assets/{assetId}/state with to_status=EXCLUDED"
        actor: Executor
        preconditions:
          - "Estate.admin_phase IN {DRAFT, IN_PROBATE} (ERR_INVALID_STATE)"
        side_effects: []

      - from: INVENTORIED
        to: EXCLUDED
        trigger: "POST /estates/{estateId}/assets/{assetId}/state with to_status=EXCLUDED"
        actor: Executor
        preconditions:
          - "No BeneficiaryDesignation references this Asset (ERR_HAS_DEPENDENCIES)"
        side_effects: []

  # ---------------- Beneficiary ----------------
  - entity: Beneficiary
    initial_state: ACTIVE
    terminal_states: [DISCLAIMED, REMOVED]
    transitions:
      - from: ACTIVE
        to: DISCLAIMED
        trigger: "POST /estates/{estateId}/beneficiaries/{beneficiaryId}/state with to_status=DISCLAIMED"
        actor: Beneficiary
        preconditions:
          - "Estate.admin_phase IN {IN_PROBATE, INVENTORIED} (ERR_INVALID_STATE)"
          - "No Distribution with this beneficiary_id has status=EXECUTED (ERR_HAS_DEPENDENCIES)"
        side_effects:
          - "All BeneficiaryDesignation rows with this beneficiary_id and status IN {PROPOSED, LOCKED} → VOIDED (cascade depth 1)"
          - "Each VOIDED designation invalidates per-asset share sum; any Asset where Σ designation.share_basis_points (status IN {PROPOSED, LOCKED}) < 10000 blocks Estate INVENTORIED→DISTRIBUTING until reissued (cascade depth 2)"

      - from: ACTIVE
        to: REMOVED
        trigger: "POST /estates/{estateId}/beneficiaries/{beneficiaryId}/state with to_status=REMOVED"
        actor: CourtClerk
        preconditions:
          - "Estate.admin_phase != SETTLED (ERR_INVALID_STATE)"
        side_effects:
          - "All BeneficiaryDesignation rows with this beneficiary_id, status PROPOSED → VOIDED (cascade depth 1; LOCKED rows are court-protected and remain LOCKED)"

  # ---------------- BeneficiaryDesignation ----------------
  - entity: BeneficiaryDesignation
    initial_state: PROPOSED
    terminal_states: [VOIDED]
    transitions:
      - from: PROPOSED
        to: LOCKED
        trigger: "system: Estate INVENTORIED→DISTRIBUTING"
        actor: system
        preconditions:
          - "Beneficiary.status = ACTIVE at the moment of locking (ERR_INVALID_STATE)"
        side_effects: []

      - from: PROPOSED
        to: VOIDED
        trigger: "system: Beneficiary DISCLAIMED/REMOVED, OR DELETE /estates/{estateId}/designations/{designationId}"
        actor: system
        preconditions: []
        side_effects: []

      - from: LOCKED
        to: VOIDED
        trigger: "system: Beneficiary DISCLAIMED (only — REMOVED does not void LOCKED)"
        actor: system
        preconditions: []
        side_effects:
          - "Estate.admin_phase=DISTRIBUTING is forced back to INVENTORIED if any Asset is left without a LOCKED designation summing to 10000 (cascade depth 2 from Beneficiary.DISCLAIMED)"

  # ---------------- Fiduciary ----------------
  - entity: Fiduciary
    initial_state: NOMINATED
    terminal_states: [REMOVED]
    transitions:
      - from: NOMINATED
        to: CONFIRMED
        trigger: "POST /estates/{estateId}/fiduciaries/{fiduciaryId}/state with to_status=CONFIRMED"
        actor: CourtClerk
        preconditions:
          - "If scope_type=EXECUTOR: Fiduciary.bond_amount_cents ≥ §1.3 required_bond (ERR_BOND_INSUFFICIENT)"
          - "If scope_type=EXECUTOR: no other CONFIRMED EXECUTOR exists for this Estate (ERR_DUPLICATE_EXECUTOR)"
          - "If scope_type=GUARDIAN: at least one Beneficiary with is_minor=true exists for this Estate (ERR_NO_MINOR_BENEFICIARY)"
        side_effects:
          - "Fiduciary.court_confirmation_at = now()"

      - from: CONFIRMED
        to: RESIGNED
        trigger: "POST /estates/{estateId}/fiduciaries/{fiduciaryId}/state with to_status=RESIGNED"
        actor: Fiduciary
        preconditions:
          - "If scope_type=EXECUTOR and Estate.admin_phase IN {IN_PROBATE, INVENTORIED, DISTRIBUTING}: a successor Fiduciary with scope_type=EXECUTOR and status=NOMINATED must already exist (ERR_NO_SUCCESSOR)"
        side_effects: []

      - from: NOMINATED
        to: REMOVED
        trigger: "POST /estates/{estateId}/fiduciaries/{fiduciaryId}/state with to_status=REMOVED"
        actor: CourtClerk
        preconditions: []
        side_effects: []

      - from: CONFIRMED
        to: REMOVED
        trigger: "POST /estates/{estateId}/fiduciaries/{fiduciaryId}/state with to_status=REMOVED"
        actor: CourtClerk
        preconditions: []
        side_effects: []

  # ---------------- GuardianshipDirective ----------------
  - entity: GuardianshipDirective
    initial_state: DRAFT
    terminal_states: [REVOKED, SUPERSEDED]
    transitions:
      - from: DRAFT
        to: EFFECTIVE
        trigger: "system: clock advance AND Estate.admin_phase = IN_PROBATE AND now() >= effective_at"
        actor: system
        preconditions:
          - "Fiduciary.status = CONFIRMED and scope_type=GUARDIAN (ERR_INVALID_STATE)"
        side_effects:
          - "Beneficiary.guardianship_id = this.id (cascade: enables Estate INVENTORIED→DISTRIBUTING precondition for that minor)"
        note: "Time-gated; reached via POST /_clock/advance."

      - from: EFFECTIVE
        to: SUPERSEDED
        trigger: "system: new GuardianshipDirective created for the same minor_beneficiary_id"
        actor: system
        preconditions: []
        side_effects:
          - "Beneficiary.guardianship_id updated to new directive id"

      - from: DRAFT
        to: REVOKED
        trigger: "POST /estates/{estateId}/guardianships/{guardianshipId}/state with to_status=REVOKED"
        actor: CourtClerk
        preconditions: []
        side_effects: []

      - from: EFFECTIVE
        to: REVOKED
        trigger: "POST /estates/{estateId}/guardianships/{guardianshipId}/state with to_status=REVOKED"
        actor: CourtClerk
        preconditions:
          - "Estate.admin_phase != DISTRIBUTING (ERR_INVALID_STATE)"
        side_effects:
          - "Beneficiary.guardianship_id = null for the affected minor"

  # ---------------- HIPAAAuthorization ----------------
  - entity: HIPAAAuthorization
    initial_state: ACTIVE
    terminal_states: [EXPIRED, REVOKED]
    transitions:
      - from: ACTIVE
        to: EXPIRED
        trigger: "system: clock advance AND expires_at != null AND now() >= expires_at"
        actor: system
        preconditions: []
        side_effects:
          - "Any EndOfLifeDirective with status=DRAFT whose requires_hipaa_scope is no longer covered by any ACTIVE HIPAAAuthorization blocks future EXECUTED transition (cascade depth 1)"
        note: "Time-gated; reached via POST /_clock/advance."

      - from: ACTIVE
        to: REVOKED
        trigger: "POST /estates/{estateId}/hipaa/{hipaaId}/state with to_status=REVOKED"
        actor: Executor
        preconditions: []
        side_effects:
          - "Same recompute as ACTIVE→EXPIRED"

  # ---------------- PowerOfAttorney ----------------
  - entity: PowerOfAttorney
    initial_state: PENDING
    terminal_states: [REVOKED, TERMINATED]
    transitions:
      - from: PENDING
        to: ACTIVE
        trigger: "system: clock advance AND now() >= effective_at AND Estate.admin_phase = DRAFT"
        actor: system
        preconditions: []
        side_effects: []
        note: "Time-gated; reached via POST /_clock/advance."

      - from: PENDING
        to: REVOKED
        trigger: "POST /estates/{estateId}/poas/{poaId}/state with to_status=REVOKED"
        actor: Executor
        preconditions: []
        side_effects:
          - "PowerOfAttorney.revoked_at = now()"

      - from: ACTIVE
        to: REVOKED
        trigger: "POST /estates/{estateId}/poas/{poaId}/state with to_status=REVOKED"
        actor: Executor
        preconditions: []
        side_effects:
          - "PowerOfAttorney.revoked_at = now()"

      - from: PENDING
        to: TERMINATED
        trigger: "system: Estate DRAFT→IN_PROBATE (cascade)"
        actor: system
        preconditions: []
        side_effects: []

      - from: ACTIVE
        to: TERMINATED
        trigger: "system: Estate DRAFT→IN_PROBATE (cascade)"
        actor: system
        preconditions: []
        side_effects: []

  # ---------------- EndOfLifeDirective ----------------
  - entity: EndOfLifeDirective
    initial_state: DRAFT
    terminal_states: [REVOKED]
    transitions:
      - from: DRAFT
        to: EXECUTED
        trigger: "POST /estates/{estateId}/directives/{directiveId}/state with to_status=EXECUTED"
        actor: Executor
        preconditions:
          - "An ACTIVE HIPAAAuthorization covering requires_hipaa_scope exists (ERR_HIPAA_SCOPE_INSUFFICIENT)"
          - "Estate.admin_phase IN {IN_PROBATE, INVENTORIED} (ERR_INVALID_STATE)"
        side_effects:
          - "EndOfLifeDirective.executed_at = now()"

      - from: DRAFT
        to: SUPERSEDED
        trigger: "system: new EndOfLifeDirective with supersedes_directive_id = this.id"
        actor: system
        preconditions: []
        side_effects: []

      - from: EXECUTED
        to: SUPERSEDED
        trigger: "system: new EndOfLifeDirective with supersedes_directive_id = this.id"
        actor: system
        preconditions: []
        side_effects: []

      - from: DRAFT
        to: REVOKED
        trigger: "POST /estates/{estateId}/directives/{directiveId}/state with to_status=REVOKED"
        actor: Executor
        preconditions: []
        side_effects: []

      - from: SUPERSEDED
        to: DRAFT
        trigger: "POST /estates/{estateId}/directives/{directiveId}/state with to_status=DRAFT (revision loop)"
        actor: Executor
        preconditions:
          - "Estate.admin_phase != SETTLED (ERR_INVALID_STATE)"
        side_effects: []
        note: "Cyclic — supports revision loops on revoked/superseded drafts."

  # ---------------- ProbateFiling ----------------
  - entity: ProbateFiling
    initial_state: SUBMITTED
    terminal_states: [ACCEPTED, REJECTED]
    transitions:
      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /estates/{estateId}/filings/{filingId}/state with to_status=ACCEPTED"
        actor: CourtClerk
        preconditions:
          - "If filing_type=INVENTORY_REPORT: every Asset of this Estate has status IN {INVENTORIED, APPRAISED, EXCLUDED} (ERR_ASSETS_NOT_INVENTORIED)"
          - "If filing_type=DISTRIBUTION_PETITION: sum of share_basis_points per asset across PROPOSED designations = 10000 (ERR_DESIGNATIONS_INCOMPLETE)"
          - "If filing_type=FINAL_ACCOUNTING: every Distribution row is EXECUTED (ERR_DISTRIBUTIONS_PENDING)"
        side_effects:
          - "ProbateFiling.court_response_at = now()"

      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /estates/{estateId}/filings/{filingId}/state with to_status=REJECTED, rejection_reason=R"
        actor: CourtClerk
        preconditions:
          - "rejection_reason required (ERR_BAD_REQUEST)"
        side_effects:
          - "ProbateFiling.court_response_at = now()"

      - from: SUBMITTED
        to: REVISION_REQUESTED
        trigger: "POST /estates/{estateId}/filings/{filingId}/state with to_status=REVISION_REQUESTED, rejection_reason=R"
        actor: CourtClerk
        preconditions:
          - "rejection_reason required (ERR_BAD_REQUEST)"
        side_effects:
          - "ProbateFiling.court_response_at = now()"

      - from: REVISION_REQUESTED
        to: SUBMITTED
        trigger: "POST /estates/{estateId}/filings/{filingId}/state with to_status=SUBMITTED"
        actor: Executor
        preconditions: []
        side_effects:
          - "ProbateFiling.rejection_reason = null"
          - "ProbateFiling.court_response_at = null"
        note: "Cyclic — review revision loop."

  # ---------------- Distribution ----------------
  - entity: Distribution
    initial_state: PLANNED
    terminal_states: [REVERSED]
    transitions:
      - from: PLANNED
        to: EXECUTED
        trigger: "POST /estates/{estateId}/distributions/{distributionId}/state with to_status=EXECUTED, actual_amount_cents=N"
        actor: Executor
        preconditions:
          - "Estate.admin_phase = DISTRIBUTING (ERR_INVALID_STATE)"
          - "actual_amount_cents required and ≥ 0 (ERR_BAD_REQUEST)"
          - "actual_amount_cents = planned_amount_cents (ERR_DISTRIBUTION_DRIFT)"
        side_effects:
          - "Distribution.executed_at = now()"

      - from: EXECUTED
        to: REVERSED
        trigger: "POST /estates/{estateId}/distributions/{distributionId}/state with to_status=REVERSED"
        actor: CourtClerk
        preconditions:
          - "Estate.admin_phase != SETTLED (ERR_INVALID_STATE)"
          - "Beneficiary.status != REMOVED — REVERSED is only valid when Beneficiary later DISCLAIMED while Estate is still DISTRIBUTING (ERR_INVALID_STATE)"
        side_effects:
          - "Asset whose distribution_id = this.id reverts to status=APPRAISED with distribution_id=null (compensating action: invariant — Estate.gross_estate_value_cents unchanged by EXECUTED+REVERSED pair, per §1.3)"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - scenario: "Two executors submit conflicting INVENTORY_REPORT filings for the same estate concurrently"
    guarantee: "At most one ProbateFiling of filing_type=INVENTORY_REPORT may be in status=SUBMITTED at a time per Estate; second create is rejected"
    error_id: ERR_FILING_ALREADY_PENDING
    http_status: 409
    serialization: "First-writer-wins on (estate_id, filing_type) when status=SUBMITTED"

  - scenario: "Beneficiary DISCLAIMS while Executor advances Estate INVENTORIED→DISTRIBUTING"
    guarantee: "Exactly one wins; if disclaim commits first, the state advance is rejected (LOCKED designations would void); if advance commits first, disclaim still succeeds but voids LOCKED rows triggering a forced revert"
    error_id: ERR_INVALID_STATE
    http_status: 409
    serialization: "First-writer-wins on Estate.admin_phase"

  - scenario: "Two Fiduciaries with scope_type=EXECUTOR are confirmed simultaneously for the same Estate"
    guarantee: "Only one EXECUTOR may be CONFIRMED at a time per Estate; second confirm is rejected"
    error_id: ERR_DUPLICATE_EXECUTOR
    http_status: 409
    serialization: "First-writer-wins on (estate_id, scope_type=EXECUTOR, status=CONFIRMED)"

  - scenario: "Executor REVOKES HIPAA while another request EXECUTES an EndOfLifeDirective dependent on it"
    guarantee: "Exactly one wins; if revoke commits first, directive execution is rejected; if execute commits first, directive remains EXECUTED and revoke proceeds"
    error_id: ERR_HIPAA_SCOPE_INSUFFICIENT
    http_status: 409
    serialization: "First-writer-wins on HIPAAAuthorization.status"

  - scenario: "Two Distributions for the same Asset (race via two LOCKED designations mistakenly co-pointing)"
    guarantee: "At most one Distribution per Asset transitions Asset→DISTRIBUTED; the second Asset→DISTRIBUTED is rejected"
    error_id: ERR_ASSET_ALREADY_DISTRIBUTED
    http_status: 409
    serialization: "First-writer-wins on Asset.status=DISTRIBUTED"

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:

  - name: gross_estate_value
    trigger: "Asset INVENTORIED→APPRAISED transition AND Asset state changes that affect inclusion set"
    algorithm: aggregation
    formula: |
      gross_estate_value_cents = Σ Asset.appraised_value_cents
                                  WHERE Asset.estate_id = estate.id
                                    AND Asset.status IN {APPRAISED, DISTRIBUTED}
      Notes:
        - Asset.status=INVENTORIED contributes Asset.declared_value_cents (NOT appraised) — see chronological variant.
        - Tie-break on equal appraised_value: process in ascending Asset.id (string) when order matters
          (e.g., for matching distribution drift).
    input_set: "Asset rows with estate_id = this Estate; status in {INVENTORIED → use declared_value, APPRAISED/DISTRIBUTED → use appraised_value}; EXCLUDED rows omitted"
    constants: {}
    precision: "Integer cents; no rounding."
    variants:
      - name: forward_looking
        when: "Computed at Estate INVENTORIED→DISTRIBUTING precondition check"
        difference: "Uses appraised_value_cents for APPRAISED assets AND declared_value_cents for INVENTORIED assets (projecting that INVENTORIED will become APPRAISED). Goal: pre-validate that planned_distribution total ≥ 95% of projected gross."
      - name: chronological
        when: "Computed at Estate INVENTORIED→SETTLED precondition check (FINAL_ACCOUNTING)"
        difference: "Includes ONLY appraised_value_cents for APPRAISED and DISTRIBUTED assets — INVENTORIED-but-never-appraised assets are excluded. Same data, different result whenever any asset stayed in INVENTORIED without being appraised."

  - name: required_bond
    trigger: "Estate DRAFT→IN_PROBATE precondition check AND Fiduciary NOMINATED→CONFIRMED precondition check (scope_type=EXECUTOR)"
    algorithm: tiered_pricing
    formula: |
      Let G = Estate.gross_estate_value_cents (forward_looking variant of gross_estate_value).
      Let R = court bond rate, applied to G as marginal tiers in this fixed order:
        Tier 1: 0 ≤ portion ≤ 10_000_000 (cents)  → rate 0.0100
        Tier 2: 10_000_000 < portion ≤ 100_000_000 → rate 0.0050
        Tier 3: portion > 100_000_000              → rate 0.0025
      Compute per_tier_cents per-tier with banker's rounding (round_half_even) to nearest cent,
      THEN sum the per-tier rounded amounts (pin: per-tier round, then sum — NOT sum then round).
      Add flat fee FLAT_BOND_FEE_CENTS at the end (unrounded).
      required_bond_cents = Σ rounded_per_tier_cents + FLAT_BOND_FEE_CENTS
    input_set: "Single estate; only assets contributing to gross_estate_value (per inclusion rules above)"
    constants:
      FLAT_BOND_FEE_CENTS: 25000
      TIER1_LIMIT_CENTS: 10000000
      TIER2_LIMIT_CENTS: 100000000
      TIER1_RATE: 0.0100
      TIER2_RATE: 0.0050
      TIER3_RATE: 0.0025
    precision: "Per-tier round_half_even to integer cents; final sum is integer cents."
    variants: []

  - name: planned_distribution
    trigger: "Estate INVENTORIED→DISTRIBUTING side effect"
    algorithm: waterfall_allocation
    formula: |
      For each Asset A with status=APPRAISED and at least one LOCKED BeneficiaryDesignation:
        Total share basis-points S = Σ designation.share_basis_points
                                       FOR designation in BeneficiaryDesignation
                                       WHERE asset_id=A.id AND status=LOCKED
        If S < 10000: redistribute the (10000 - S) shortfall via waterfall by ascending
          priority_rank (lower rank paid first); within ties, ascending designation.id (string).
        For each LOCKED designation D on A, in ascending priority_rank then ascending designation.id:
          allocated_share_bp = original D.share_basis_points + share_from_waterfall
          per_designation_cents = floor(A.appraised_value_cents * allocated_share_bp / 10000)
        After processing all designations on A, distribute the rounding remainder
          (A.appraised_value_cents - Σ per_designation_cents) one cent at a time
          in ascending priority_rank then ascending designation.id until exhausted.
      Aggregate per Beneficiary:
        Distribution.planned_amount_cents = Σ per_designation_cents
          FOR designations across all Assets for that beneficiary.
    input_set: "Assets with status=APPRAISED; LOCKED BeneficiaryDesignations"
    constants: {}
    precision: "Integer cents; floor per designation, remainder distributed deterministically."
    variants: []

  - name: planned_distribution_total
    trigger: "Estate DISTRIBUTING→SETTLED precondition (FINAL_ACCOUNTING check)"
    algorithm: aggregation
    formula: |
      planned_total_cents = Σ Distribution.planned_amount_cents
        FOR Distribution WHERE estate_id = this AND status IN {PLANNED, EXECUTED}
    input_set: "Distribution rows for this estate (PLANNED + EXECUTED)"
    constants: {}
    precision: "Integer cents."
    variants: []

  - name: net_estate_value
    trigger: "Estate DISTRIBUTING→SETTLED precondition check"
    algorithm: aggregation
    formula: |
      net_estate_value_cents = gross_estate_value_cents (chronological variant)
                               - Σ ProbateFiling-recognized fees and debts (out of scope: model only as 0 for benchmark).
      Identity in this benchmark:
        net_estate_value_cents == Σ Distribution.actual_amount_cents WHERE status=EXECUTED
      Invariant (compensating action): for any Distribution pair (EXECUTED at t1, REVERSED at t2),
        Estate.gross_estate_value_cents at t0 (before EXECUTED) == Estate.gross_estate_value_cents at t2 (after REVERSED).
    input_set: "All Distribution rows; gross_estate_value chronological variant"
    constants: {}
    precision: "Integer cents."
    variants: []

  - name: probate_posture
    trigger: "Any change to ProbateFiling, Fiduciary, or Estate.admin_phase"
    algorithm: derived
    formula: |
      if Estate.admin_phase = CONTESTED:
        probate_posture = FROZEN
      else if ANY ProbateFiling.status = REVISION_REQUESTED for this estate:
        probate_posture = UNDER_COURT_REVIEW
      else if Estate.admin_phase = SETTLED:
        probate_posture = OPEN  # idle
      else:
        probate_posture = OPEN
    input_set: "ProbateFiling rows of this estate; Estate.admin_phase"
    constants: {}
    precision: "n/a"
    variants: []

  - name: fiduciary_risk_score
    trigger: "Fiduciary CONFIRMED→RESIGNED transition AND Fiduciary REMOVED transition"
    algorithm: weighted_scoring
    formula: |
      For Fiduciary F (scope_type=EXECUTOR):
        risk_score = (TIME_FACTOR_WEIGHT * time_factor)
                   + (BOND_FACTOR_WEIGHT * bond_factor)
                   + (FILING_FACTOR_WEIGHT * filing_factor)
        where
          time_factor = max(0, (Estate.settlement_due_at - now()) days / 540)  # ≤ 1.0
          bond_factor = (F.bond_amount_cents / required_bond_cents)            # ≥ 0
          filing_factor = (count(ProbateFiling for this estate filed_by_fiduciary_id=F.id with status=ACCEPTED)
                           / max(1, count(all ProbateFiling for this estate filed_by_fiduciary_id=F.id)))
      Pin evaluation order: time_factor, then bond_factor, then filing_factor.
      Score is rounded_half_up to 4 decimal places.
      Score floor: 0.0000; score ceiling: 5.0000.
    input_set: "Fiduciary; Estate; ProbateFiling rows of this estate"
    constants:
      TIME_FACTOR_WEIGHT: 1.0
      BOND_FACTOR_WEIGHT: 2.0
      FILING_FACTOR_WEIGHT: 2.0
      SCORE_FLOOR: 0.0
      SCORE_CEILING: 5.0
    precision: "4 decimal places, round_half_up; clamped to [0, 5]."
    variants:
      - name: provisional
        when: "Computed at RESIGNED transition (Estate still active)"
        difference: "Uses Estate.gross_estate_value_cents forward_looking variant for required_bond_cents denominator."
      - name: final
        when: "Computed at SETTLED precondition (final accounting)"
        difference: "Uses Estate.gross_estate_value_cents chronological variant for required_bond_cents denominator."

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:

  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and non-empty"
    error_id: ERR_AUTH_REQUIRED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "X-User-Role is one of {Executor, Beneficiary, CourtClerk, Fiduciary} AND is authorized for the endpoint per §1.7"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "URL path resources exist and parent-child scoping is consistent (validated left-to-right)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all resource endpoints"

  - priority: 4
    category: business_referential
    check: "Foreign keys in request body reference existing resources within the same Estate scope"
    error_id: ERR_REFERENCE_NOT_FOUND
    http_status: 404
    applies_to: "all create/update endpoints with FK fields"

  - priority: 5
    category: state
    check: "Optimistic concurrency: request 'version' (when supplied) equals resource.version"
    error_id: ERR_VERSION_MISMATCH
    http_status: 409
    applies_to: "PATCH and state transition endpoints on entities with common_fields=true"

  - priority: 6
    category: state
    check: "Target state is reachable from current state per §1.2 state machine for this entity"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state transition endpoints"

  - priority: 7
    category: business_safety
    check: "HIPAA scope coverage: EndOfLifeDirective DRAFT→EXECUTED requires an ACTIVE HIPAAAuthorization whose scope covers requires_hipaa_scope (ALL covers all; MEDICAL_RECORDS covers MEDICAL_RECORDS only; etc.)"
    error_id: ERR_HIPAA_SCOPE_INSUFFICIENT
    http_status: 403
    applies_to: "POST /estates/{estateId}/directives/{directiveId}/state with to_status=EXECUTED"

  - priority: 8
    category: business_safety
    check: "POA scope coverage: PATCH/state on an Asset with requires_poa_for_mutation=true while Estate.admin_phase=DRAFT requires an ACTIVE PowerOfAttorney whose asset_class_scope contains Asset.asset_class"
    error_id: ERR_POA_SCOPE_INSUFFICIENT
    http_status: 403
    applies_to: "PATCH /estates/{estateId}/assets/{assetId}; POST /estates/{estateId}/assets/{assetId}/state"

  - priority: 9
    category: business_safety
    check: "Court-supervised filings: only Fiduciary with scope_type=EXECUTOR and status=CONFIRMED may submit non-PETITION filing types"
    error_id: ERR_FILING_NOT_PERMITTED
    http_status: 403
    applies_to: "POST /estates/{estateId}/filings"

  - priority: 10
    category: business_referential
    check: "Sum of share_basis_points per asset across PROPOSED and LOCKED BeneficiaryDesignations ≤ 10000 at creation time"
    error_id: ERR_DESIGNATION_OVER_ALLOCATED
    http_status: 422
    applies_to: "POST /estates/{estateId}/designations"

  - priority: 11
    category: business_constraint
    check: "Beneficiary.is_minor=true AND status=ACTIVE implies Beneficiary.guardianship_id is non-null at Estate INVENTORIED→DISTRIBUTING"
    error_id: ERR_GUARDIANSHIP_MISSING
    http_status: 422
    applies_to: "POST /estates/{estateId}/state with to_status=DISTRIBUTING"

  - priority: 12
    category: business_fiscal
    check: "Fiduciary.bond_amount_cents ≥ §1.3 required_bond_cents at NOMINATED→CONFIRMED for scope_type=EXECUTOR"
    error_id: ERR_BOND_INSUFFICIENT
    http_status: 422
    applies_to: "POST /estates/{estateId}/fiduciaries/{fiduciaryId}/state with to_status=CONFIRMED"

  - priority: 13
    category: business_fiscal
    check: "Distribution.actual_amount_cents == planned_amount_cents at PLANNED→EXECUTED (no drift permitted)"
    error_id: ERR_DISTRIBUTION_DRIFT
    http_status: 422
    applies_to: "POST /estates/{estateId}/distributions/{distributionId}/state with to_status=EXECUTED"

  - priority: 14
    category: business_temporal
    check: "GuardianshipDirective.effective_at must not be in the past at create time (≥ now())"
    error_id: ERR_DIRECTIVE_EFFECTIVE_PAST
    http_status: 422
    applies_to: "POST /estates/{estateId}/guardianships"

  - priority: 15
    category: business_temporal
    check: "Estate.settlement_due_at not exceeded at Estate INVENTORIED→DISTRIBUTING (strict: now() < Estate.settlement_due_at)"
    error_id: ERR_SETTLEMENT_DEADLINE_PASSED
    http_status: 422
    applies_to: "POST /estates/{estateId}/state with to_status=DISTRIBUTING"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:

  # ---- Test-driving control surface ----
  - method: POST
    path: "/_clock/advance"
    description: "Advance server logical clock to a given timestamp (test-only). Reaches all time-gated transitions: PowerOfAttorney PENDING→ACTIVE, GuardianshipDirective DRAFT→EFFECTIVE, HIPAAAuthorization ACTIVE→EXPIRED."
    roles: [CourtClerk]
    code: 200
    input: [to_timestamp]
    output: null
    side_effects:
      - "All time-gated auto-transitions evaluated and applied"

  - method: GET
    path: "/_clock"
    description: "Return current logical clock"
    roles: [CourtClerk, Executor, Beneficiary, Fiduciary]
    code: 200
    input: []
    output: null
    side_effects: []

  # ---- Estate ----
  - method: POST
    path: "/estates"
    description: "Create a new Estate"
    roles: [Executor]
    code: 201
    input: [testator_name, domicile_state, filing_court_id]
    output: Estate
    side_effects:
      - "admin_phase=DRAFT, probate_posture=OPEN"

  - method: GET
    path: "/estates/{estateId}"
    description: "Get a specific Estate"
    roles: [Executor, Beneficiary, CourtClerk, Fiduciary]
    code: 200
    input: []
    output: Estate
    side_effects: []

  - method: GET
    path: "/estates"
    description: "List estates (filterable by admin_phase, probate_posture, contested)"
    roles: [CourtClerk]
    code: 200
    input: ["limit?", "offset?", "admin_phase?", "probate_posture?"]
    output: "Estate[]"
    side_effects: []

  - method: PATCH
    path: "/estates/{estateId}"
    description: "Update Estate non-state fields (testator_name, domicile_state, filing_court_id only while DRAFT)"
    roles: [Executor]
    code: 200
    input: ["testator_name?", "domicile_state?", "filing_court_id?", "version?"]
    output: Estate
    side_effects: []

  - method: POST
    path: "/estates/{estateId}/state"
    description: "Transition estate admin_phase per §1.2"
    roles: [Executor, CourtClerk]
    code: 200
    input: [to_status, "version?"]
    output: Estate
    side_effects:
      - "Per §1.2 Estate transitions, including cascades to POA/HIPAA/Distribution"

  # ---- Asset ----
  - method: POST
    path: "/estates/{estateId}/assets"
    description: "Create an asset under an Estate"
    roles: [Executor]
    code: 201
    input: [asset_class, description, declared_value_cents, "requires_poa_for_mutation?"]
    output: Asset
    side_effects:
      - "status=DECLARED"

  - method: GET
    path: "/estates/{estateId}/assets/{assetId}"
    description: "Get a specific asset"
    roles: [Executor, Beneficiary, CourtClerk, Fiduciary]
    code: 200
    input: []
    output: Asset
    side_effects: []

  - method: GET
    path: "/estates/{estateId}/assets"
    description: "List assets (filterable by status, asset_class)"
    roles: [Executor, Beneficiary, CourtClerk, Fiduciary]
    code: 200
    input: ["limit?", "offset?", "status?", "asset_class?"]
    output: "Asset[]"
    side_effects: []

  - method: PATCH
    path: "/estates/{estateId}/assets/{assetId}"
    description: "Update asset description/declared_value while DECLARED or INVENTORIED"
    roles: [Executor]
    code: 200
    input: ["description?", "declared_value_cents?", "version?"]
    output: Asset
    side_effects: []

  - method: POST
    path: "/estates/{estateId}/assets/{assetId}/state"
    description: "Transition asset status per §1.2"
    roles: [Executor]
    code: 200
    input: [to_status, "appraised_value_cents?", "distribution_id?", "version?"]
    output: Asset
    side_effects: ["Per §1.2 Asset transitions; recompute gross_estate_value"]

  # ---- Beneficiary ----
  - method: POST
    path: "/estates/{estateId}/beneficiaries"
    description: "Create a Beneficiary"
    roles: [Executor]
    code: 201
    input: [full_name, relationship, "is_minor?"]
    output: Beneficiary
    side_effects:
      - "status=ACTIVE"

  - method: GET
    path: "/estates/{estateId}/beneficiaries/{beneficiaryId}"
    description: "Get a specific Beneficiary"
    roles: [Executor, Beneficiary, CourtClerk]
    code: 200
    input: []
    output: Beneficiary
    side_effects: []

  - method: GET
    path: "/estates/{estateId}/beneficiaries"
    description: "List beneficiaries"
    roles: [Executor, CourtClerk]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: "Beneficiary[]"
    side_effects: []

  - method: POST
    path: "/estates/{estateId}/beneficiaries/{beneficiaryId}/state"
    description: "Transition Beneficiary per §1.2"
    roles: [Beneficiary, CourtClerk]
    code: 200
    input: [to_status, "version?"]
    output: Beneficiary
    side_effects: ["Cascade to BeneficiaryDesignation per §1.2"]

  # ---- BeneficiaryDesignation ----
  - method: POST
    path: "/estates/{estateId}/designations"
    description: "Create a BeneficiaryDesignation linking Asset to Beneficiary with share basis points"
    roles: [Executor]
    code: 201
    input: [asset_id, beneficiary_id, share_basis_points, priority_rank]
    output: BeneficiaryDesignation
    side_effects:
      - "status=PROPOSED"

  - method: GET
    path: "/estates/{estateId}/designations/{designationId}"
    description: "Get designation"
    roles: [Executor, Beneficiary, CourtClerk]
    code: 200
    input: []
    output: BeneficiaryDesignation
    side_effects: []

  - method: GET
    path: "/estates/{estateId}/designations"
    description: "List designations (filterable by asset_id, beneficiary_id, status)"
    roles: [Executor, Beneficiary, CourtClerk]
    code: 200
    input: ["limit?", "offset?", "asset_id?", "beneficiary_id?", "status?"]
    output: "BeneficiaryDesignation[]"
    side_effects: []

  - method: DELETE
    path: "/estates/{estateId}/designations/{designationId}"
    description: "Void a PROPOSED designation"
    roles: [Executor]
    code: 200
    input: ["version?"]
    output: BeneficiaryDesignation
    side_effects: ["status=VOIDED; only allowed from PROPOSED"]

  # ---- Fiduciary ----
  - method: POST
    path: "/estates/{estateId}/fiduciaries"
    description: "Nominate a Fiduciary"
    roles: [Executor, CourtClerk]
    code: 201
    input: [scope_type, full_name, contact_user_id, "bond_amount_cents?"]
    output: Fiduciary
    side_effects:
      - "status=NOMINATED"

  - method: GET
    path: "/estates/{estateId}/fiduciaries/{fiduciaryId}"
    description: "Get a Fiduciary"
    roles: [Executor, Beneficiary, CourtClerk, Fiduciary]
    code: 200
    input: []
    output: Fiduciary
    side_effects: []

  - method: GET
    path: "/estates/{estateId}/fiduciaries"
    description: "List fiduciaries"
    roles: [Executor, Beneficiary, CourtClerk, Fiduciary]
    code: 200
    input: ["limit?", "offset?", "scope_type?", "status?"]
    output: "Fiduciary[]"
    side_effects: []

  - method: POST
    path: "/estates/{estateId}/fiduciaries/{fiduciaryId}/state"
    description: "Transition Fiduciary per §1.2"
    roles: [CourtClerk, Fiduciary]
    code: 200
    input: [to_status, "version?"]
    output: Fiduciary
    side_effects: ["Per §1.2 Fiduciary transitions"]

  # ---- GuardianshipDirective ----
  - method: POST
    path: "/estates/{estateId}/guardianships"
    description: "Create a GuardianshipDirective"
    roles: [Executor]
    code: 201
    input: [minor_beneficiary_id, guardian_fiduciary_id, effective_at]
    output: GuardianshipDirective
    side_effects:
      - "status=DRAFT; supersedes any prior EFFECTIVE directive for the same minor (cascade to SUPERSEDED on auto-transition)"

  - method: GET
    path: "/estates/{estateId}/guardianships/{guardianshipId}"
    description: "Get guardianship"
    roles: [Executor, Beneficiary, CourtClerk]
    code: 200
    input: []
    output: GuardianshipDirective
    side_effects: []

  - method: POST
    path: "/estates/{estateId}/guardianships/{guardianshipId}/state"
    description: "Transition guardianship per §1.2"
    roles: [CourtClerk]
    code: 200
    input: [to_status, "version?"]
    output: GuardianshipDirective
    side_effects: []

  # ---- HIPAAAuthorization ----
  - method: POST
    path: "/estates/{estateId}/hipaa"
    description: "Create HIPAA authorization"
    roles: [Executor]
    code: 201
    input: [authorized_recipient, scope, signed_at, "expires_at?"]
    output: HIPAAAuthorization
    side_effects:
      - "status=ACTIVE"

  - method: GET
    path: "/estates/{estateId}/hipaa/{hipaaId}"
    description: "Get HIPAA authorization"
    roles: [Executor, CourtClerk]
    code: 200
    input: []
    output: HIPAAAuthorization
    side_effects: []

  - method: POST
    path: "/estates/{estateId}/hipaa/{hipaaId}/state"
    description: "Revoke a HIPAA authorization"
    roles: [Executor]
    code: 200
    input: [to_status, "version?"]
    output: HIPAAAuthorization
    side_effects: ["status=REVOKED"]

  # ---- PowerOfAttorney ----
  - method: POST
    path: "/estates/{estateId}/poas"
    description: "Create a PowerOfAttorney"
    roles: [Executor]
    code: 201
    input: [poa_type, agent_fiduciary_id, asset_class_scope, effective_at]
    output: PowerOfAttorney
    side_effects:
      - "status=PENDING"

  - method: GET
    path: "/estates/{estateId}/poas/{poaId}"
    description: "Get a PowerOfAttorney"
    roles: [Executor, CourtClerk]
    code: 200
    input: []
    output: PowerOfAttorney
    side_effects: []

  - method: POST
    path: "/estates/{estateId}/poas/{poaId}/state"
    description: "Revoke a POA"
    roles: [Executor]
    code: 200
    input: [to_status, "version?"]
    output: PowerOfAttorney
    side_effects: []

  # ---- EndOfLifeDirective ----
  - method: POST
    path: "/estates/{estateId}/directives"
    description: "Create an EndOfLifeDirective (optionally supersedes another)"
    roles: [Executor]
    code: 201
    input: [directive_type, instructions, requires_hipaa_scope, "supersedes_directive_id?"]
    output: EndOfLifeDirective
    side_effects:
      - "status=DRAFT; if supersedes_directive_id non-null, prior directive (DRAFT or EXECUTED) → SUPERSEDED"

  - method: GET
    path: "/estates/{estateId}/directives/{directiveId}"
    description: "Get a directive"
    roles: [Executor, CourtClerk]
    code: 200
    input: []
    output: EndOfLifeDirective
    side_effects: []

  - method: POST
    path: "/estates/{estateId}/directives/{directiveId}/state"
    description: "Transition directive per §1.2 (DRAFT→EXECUTED, DRAFT→REVOKED, SUPERSEDED→DRAFT)"
    roles: [Executor]
    code: 200
    input: [to_status, "version?"]
    output: EndOfLifeDirective
    side_effects: []

  # ---- ProbateFiling ----
  - method: POST
    path: "/estates/{estateId}/filings"
    description: "Submit a probate filing"
    roles: [Executor]
    code: 201
    input: [filing_type, filed_by_fiduciary_id]
    output: ProbateFiling
    side_effects:
      - "status=SUBMITTED"

  - method: GET
    path: "/estates/{estateId}/filings/{filingId}"
    description: "Get a filing"
    roles: [Executor, Beneficiary, CourtClerk]
    code: 200
    input: []
    output: ProbateFiling
    side_effects: []

  - method: GET
    path: "/estates/{estateId}/filings"
    description: "List filings"
    roles: [Executor, Beneficiary, CourtClerk]
    code: 200
    input: ["limit?", "offset?", "filing_type?", "status?"]
    output: "ProbateFiling[]"
    side_effects: []

  - method: POST
    path: "/estates/{estateId}/filings/{filingId}/state"
    description: "Court transitions a filing per §1.2"
    roles: [CourtClerk, Executor]
    code: 200
    input: [to_status, "rejection_reason?", "version?"]
    output: ProbateFiling
    side_effects: []

  # ---- Distribution ----
  - method: GET
    path: "/estates/{estateId}/distributions/{distributionId}"
    description: "Get a planned/executed distribution"
    roles: [Executor, Beneficiary, CourtClerk]
    code: 200
    input: []
    output: Distribution
    side_effects: []

  - method: GET
    path: "/estates/{estateId}/distributions"
    description: "List distributions"
    roles: [Executor, Beneficiary, CourtClerk]
    code: 200
    input: ["limit?", "offset?", "status?", "beneficiary_id?"]
    output: "Distribution[]"
    side_effects: []

  - method: POST
    path: "/estates/{estateId}/distributions/{distributionId}/state"
    description: "Transition a Distribution per §1.2 (PLANNED→EXECUTED, EXECUTED→REVERSED)"
    roles: [Executor, CourtClerk]
    code: 200
    input: [to_status, "actual_amount_cents?", "version?"]
    output: Distribution
    side_effects: []

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_BAD_REQUEST
    http: 400
    condition: "Malformed request: missing required field, invalid type, value out of range"

  - id: ERR_AUTH_REQUIRED
    http: 401
    condition: "Authentication headers (X-User-Role and/or X-User-ID) missing or empty"

  - id: ERR_FORBIDDEN
    http: 403
    condition: "Role not permitted for this endpoint per §1.7"

  - id: ERR_HIPAA_SCOPE_INSUFFICIENT
    http: 403
    condition: "No ACTIVE HIPAAAuthorization covers the directive's requires_hipaa_scope; OR HIPAA revoke loses race with directive execute"

  - id: ERR_POA_SCOPE_INSUFFICIENT
    http: 403
    condition: "PATCH or state-change on asset with requires_poa_for_mutation=true while Estate.admin_phase=DRAFT and no ACTIVE POA covers asset_class"

  - id: ERR_FILING_NOT_PERMITTED
    http: 403
    condition: "Non-PETITION filing submitted by user who is not a CONFIRMED EXECUTOR fiduciary"

  - id: ERR_POSTURE_BLOCKED
    http: 403
    condition: "Operation blocked by Estate.probate_posture = FROZEN or UNDER_COURT_REVIEW"

  - id: ERR_NOT_FOUND
    http: 404
    condition: "Resource id in path not found, or out of declared parent scope"

  - id: ERR_REFERENCE_NOT_FOUND
    http: 404
    condition: "Foreign-key in body references nonexistent resource in this Estate"

  - id: ERR_INVALID_STATE
    http: 409
    condition: "Target state unreachable from current state; or cross-entity state precondition violated"

  - id: ERR_VERSION_MISMATCH
    http: 409
    condition: "OCC: supplied version does not match current resource.version"

  - id: ERR_FILING_ALREADY_PENDING
    http: 409
    condition: "Another ProbateFiling of the same filing_type for this Estate is in status=SUBMITTED"

  - id: ERR_DUPLICATE_EXECUTOR
    http: 409
    condition: "Another Fiduciary with scope_type=EXECUTOR and status=CONFIRMED already exists for this Estate"

  - id: ERR_NO_SUCCESSOR
    http: 409
    condition: "EXECUTOR cannot RESIGN without a NOMINATED successor"

  - id: ERR_NO_CONFIRMED_EXECUTOR
    http: 409
    condition: "Estate DRAFT→IN_PROBATE requires a CONFIRMED EXECUTOR fiduciary"

  - id: ERR_NO_ACCEPTED_PETITION
    http: 409
    condition: "Estate DRAFT→IN_PROBATE requires an ACCEPTED PETITION_TO_PROBATE filing"

  - id: ERR_NO_ACCEPTED_INVENTORY
    http: 409
    condition: "Estate IN_PROBATE→INVENTORIED requires an ACCEPTED INVENTORY_REPORT filing"

  - id: ERR_NO_ACCEPTED_DISTRIBUTION_PETITION
    http: 409
    condition: "Estate INVENTORIED→DISTRIBUTING requires an ACCEPTED DISTRIBUTION_PETITION filing"

  - id: ERR_NO_ACCEPTED_FINAL_ACCOUNTING
    http: 409
    condition: "Estate DISTRIBUTING→SETTLED requires an ACCEPTED FINAL_ACCOUNTING filing"

  - id: ERR_ASSETS_NOT_INVENTORIED
    http: 409
    condition: "Some Asset is in status=DECLARED while Estate is being moved to INVENTORIED or beyond"

  - id: ERR_ASSETS_NOT_DISTRIBUTED
    http: 409
    condition: "Estate DISTRIBUTING→SETTLED requires every Asset with a LOCKED designation to be DISTRIBUTED"

  - id: ERR_ASSET_ALREADY_DISTRIBUTED
    http: 409
    condition: "Asset is already in status=DISTRIBUTED; concurrent second distribution loses"

  - id: ERR_HAS_DEPENDENCIES
    http: 409
    condition: "Cannot transition due to dependent rows (e.g., Beneficiary DISCLAIMED but EXECUTED distribution exists; Asset EXCLUDED but designation exists)"

  - id: ERR_DESIGNATION_MISMATCH
    http: 409
    condition: "Asset APPRAISED→DISTRIBUTED supplied a distribution_id whose Beneficiary is not in any LOCKED designation on the Asset"

  - id: ERR_FILINGS_PENDING
    http: 409
    condition: "Estate CONTESTED→IN_PROBATE blocked by any REVISION_REQUESTED filing"

  - id: ERR_DISTRIBUTIONS_PENDING
    http: 409
    condition: "FINAL_ACCOUNTING acceptance requires every Distribution row to be EXECUTED"

  - id: ERR_DESIGNATION_OVER_ALLOCATED
    http: 422
    condition: "Σ designation.share_basis_points on a single asset would exceed 10000"

  - id: ERR_DESIGNATIONS_INCOMPLETE
    http: 422
    condition: "Σ designation.share_basis_points per asset across PROPOSED designations ≠ 10000 (or LOCKED for FINAL stage)"

  - id: ERR_GUARDIANSHIP_MISSING
    http: 422
    condition: "Minor beneficiary lacks an EFFECTIVE GuardianshipDirective at Estate INVENTORIED→DISTRIBUTING"

  - id: ERR_NO_MINOR_BENEFICIARY
    http: 422
    condition: "Fiduciary scope_type=GUARDIAN confirm requires at least one is_minor=true Beneficiary"

  - id: ERR_BOND_INSUFFICIENT
    http: 422
    condition: "Fiduciary.bond_amount_cents below required_bond_cents at EXECUTOR confirm or estate IN_PROBATE entry"

  - id: ERR_DISTRIBUTION_DRIFT
    http: 422
    condition: "Distribution.actual_amount_cents != planned_amount_cents at PLANNED→EXECUTED; or sum drift at FINAL_ACCOUNTING"

  - id: ERR_DIRECTIVE_EFFECTIVE_PAST
    http: 422
    condition: "GuardianshipDirective.effective_at is before now() at creation"

  - id: ERR_SETTLEMENT_DEADLINE_PASSED
    http: 422
    condition: "Estate.settlement_due_at has elapsed at INVENTORIED→DISTRIBUTING attempt"

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Executor
    description: "Person petitioning probate and administering the estate before/during/after court supervision. Acts as the estate's primary fiduciary."
    identity: "entity_backed:Fiduciary"
    exclusive_operations:
      - "POST /estates — create estate"
      - "POST /estates/{estateId}/assets — declare assets"
      - "PATCH /estates/{estateId}/assets/{assetId} — modify assets"
      - "POST /estates/{estateId}/assets/{assetId}/state — advance asset states"
      - "POST /estates/{estateId}/beneficiaries — nominate beneficiaries"
      - "POST /estates/{estateId}/designations — propose designations"
      - "DELETE /estates/{estateId}/designations/{designationId} — void PROPOSED designations"
      - "POST /estates/{estateId}/hipaa — file HIPAA authorization"
      - "POST /estates/{estateId}/poas — file POA"
      - "POST /estates/{estateId}/directives — file end-of-life directive"
      - "POST /estates/{estateId}/guardianships — file guardianship"
      - "POST /estates/{estateId}/filings — submit probate filing"
    shared_operations:
      - "POST /estates/{estateId}/fiduciaries — nominate other fiduciaries (shared with CourtClerk)"
      - "POST /estates/{estateId}/state — advance estate (shared with CourtClerk)"
      - "POST /estates/{estateId}/filings/{filingId}/state — re-submit revision-requested filings (shared with CourtClerk for accept/reject)"
      - "POST /estates/{estateId}/distributions/{distributionId}/state — execute distributions (shared with CourtClerk for REVERSED)"
      - "GET … — read endpoints on Estate and its children (shared with Beneficiary, CourtClerk, Fiduciary)"

  - name: CourtClerk
    description: "Court-side actor — segregation of duties: rules on filings, confirms fiduciaries, removes beneficiaries, marks estate CONTESTED. Cannot create assets, designations, or directives."
    identity: "opaque"
    exclusive_operations:
      - "POST /estates/{estateId}/fiduciaries/{fiduciaryId}/state — confirm/remove fiduciary (CONFIRMED/REMOVED transitions are court-only)"
      - "POST /estates/{estateId}/beneficiaries/{beneficiaryId}/state — REMOVED transition"
      - "POST /estates/{estateId}/filings/{filingId}/state — ACCEPTED/REJECTED/REVISION_REQUESTED on filings"
      - "POST /estates/{estateId}/guardianships/{guardianshipId}/state — REVOKED transition"
      - "POST /_clock/advance — advance logical clock"
      - "GET /estates (cross-estate list) — browse estates"
    shared_operations:
      - "POST /estates/{estateId}/fiduciaries — nominate fiduciaries (shared with Executor)"
      - "POST /estates/{estateId}/state — CONTESTED and CONTESTED→IN_PROBATE transitions (shared with Executor for DRAFT→IN_PROBATE etc.)"
      - "POST /estates/{estateId}/distributions/{distributionId}/state — REVERSED transition (shared with Executor for EXECUTED)"
      - "GET … — read endpoints"

  - name: Beneficiary
    description: "Named beneficiary of the estate. Can read estate, its assets, designations on themselves; can DISCLAIM their own designations."
    identity: "entity_backed:Beneficiary"
    exclusive_operations:
      - "POST /estates/{estateId}/beneficiaries/{beneficiaryId}/state with to_status=DISCLAIMED — only on self (X-User-ID == Beneficiary.id)"
    shared_operations:
      - "GET /estates/{estateId} — read estate"
      - "GET /estates/{estateId}/assets — read assets"
      - "GET /estates/{estateId}/designations — read designations"
      - "GET /estates/{estateId}/beneficiaries/{beneficiaryId} — read self"
      - "GET /estates/{estateId}/distributions — read distributions"
      - "GET /estates/{estateId}/filings — read filings"

  - name: Fiduciary
    description: "Non-executor fiduciary (TRUSTEE or GUARDIAN). Can read estate context and transition own status (RESIGNED). Cannot create or transition other entities."
    identity: "entity_backed:Fiduciary"
    exclusive_operations:
      - "POST /estates/{estateId}/fiduciaries/{fiduciaryId}/state with to_status=RESIGNED — only on self (X-User-ID == Fiduciary.contact_user_id)"
    shared_operations:
      - "GET /estates/{estateId} — read estate"
      - "GET /estates/{estateId}/fiduciaries — read fiduciaries"
      - "GET /estates/{estateId}/assets — read assets"
