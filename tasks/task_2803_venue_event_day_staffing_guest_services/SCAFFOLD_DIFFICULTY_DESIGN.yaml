            - "M3 is ACTIVE and holds a VALID CODE_OF_CONDUCT certification."
            - "One OPEN GuestIssue (CONDUCT_VIOLATION / HIGH, sla_minutes 15, filed at 19:00:00Z so its 19:15:00Z deadline is not yet reached)."
