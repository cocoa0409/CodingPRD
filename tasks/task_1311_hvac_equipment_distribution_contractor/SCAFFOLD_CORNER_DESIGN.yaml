            - "Order.${os1_id}.status == BACKORDERED (still short despite being older)"
            - "AllocationPool.${apr1_id}.committed_qty == 1"

      - name: pagination_filter_interaction_under_mutation
        claim_type: pagination_filtering
        grounds: ["complexity_profile.complexity_layers[pagination_with_filtering]", response_envelope]
        distinguishing_aspect: "Filtered list with limit/offset stays consistent when a matching row transitions out of the filter between page fetches (offset pagination re-evaluates the filter)."
        test_recipe:
