            - "${c_created} == 2026-08-01T00:00:00.000Z"
            - "${c2_created} == 2026-09-01T12:30:00.000Z"
            - "the clock endpoint returns HTTP 200 with a null data payload"

      - name: corner_customer_products_subresource_is_scoped
        claim_type: cross_reference
        grounds:
          - endpoints[GET /sterilization/customers/{id}/products]
          - entities.Product.fields.customer_id
        distinguishing_aspect: "The products sub-resource is scoped to the addressed customer, so a customer owning two products returns both while the other customer's single product never appears."
        test_recipe:
          setup:
            - "Customer ACME-01 owns products P1 and P2; customer BETA-02 owns product P3."
          setup_api_calls:
            - call: "POST /sterilization/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: RegulatoryAdmin
            - call: "POST /sterilization/customers"
              payload: { name: "Acme Medical", account_code: "ACME-01", contracted_modalities: ["ETO", "GAMMA"] }
              as: RegulatoryAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /sterilization/customers"
              payload: { name: "Acme Medical", account_code: "BETA-02", contracted_modalities: ["ETO", "GAMMA"] }
              as: RegulatoryAdmin
              captures: { cust2_id: $.data.id }
            - call: "POST /sterilization/products"
              payload: { customer_id: "${cust_id}", product_code: "P1", pallet_mass_kg: 120.0, pallet_volume_m3: 1.2, max_allowed_dose_kgy: 45.0, max_cumulative_dose_kgy: 60.0, eto_residual_limit_ppm: 4.0, ech_residual_limit_ppm: 9.0, requires_aeration: false }
              as: RegulatoryAdmin
              captures: { p1_id: $.data.id }
            - call: "POST /sterilization/products"
              payload: { customer_id: "${cust_id}", product_code: "P2", pallet_mass_kg: 90.0, pallet_volume_m3: 0.8, max_allowed_dose_kgy: 45.0, max_cumulative_dose_kgy: 60.0, eto_residual_limit_ppm: 4.0, ech_residual_limit_ppm: 9.0, requires_aeration: false }
              as: RegulatoryAdmin
              captures: { p2_id: $.data.id }
            - call: "POST /sterilization/products"
              payload: { customer_id: "${cust2_id}", product_code: "P3", pallet_mass_kg: 120.0, pallet_volume_m3: 1.2, max_allowed_dose_kgy: 45.0, max_cumulative_dose_kgy: 60.0, eto_residual_limit_ppm: 4.0, ech_residual_limit_ppm: 9.0, requires_aeration: false }
              as: RegulatoryAdmin
              captures: { p3_id: $.data.id }
          trigger:
            - call: "GET /sterilization/customers/${cust_id}/products"
              payload: {}
              as: CustomerRep
              as_user_id: "${cust_id}"
            - call: "GET /sterilization/customers/${cust2_id}/products"
              payload: {}
              as: RegulatoryAdmin
          assert:
            - "the first read returns total_count == 2 containing ${p1_id} and ${p2_id}"
            - "the second read returns total_count == 1 containing only ${p3_id}"
            - "Product.${p3_id}.customer_id == ${cust2_id}"

