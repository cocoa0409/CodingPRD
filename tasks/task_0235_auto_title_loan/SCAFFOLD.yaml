scenario: "Auto Title Loan: vehicle appraisal/LTV, loan terms & state APR cap, title-lien filing, payment schedule, default/repossession, redemption/reinstatement, rollover/renewal limits, GPS/starter-interrupt device"
domain_name: auto-title-loan
api_prefix: /atl

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: ledger_reconciliation
  complexity_layers:
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
    - optimistic_concurrency
    - derived_field_reconciliation

  entity_topology: hybrid
  state_machine_shape: parallel
  relationship_patterns:
    - one_to_many
    - cross_aggregate

  role_model: segregation_of_duties
  consistency_model: immediate

# =====================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =====================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =====================================================================
# §1.1 Entity-Relationship Table
# =====================================================================
entities:
  - name: Borrower
    parent: null
    common_fields: true
    fields:
      - name: email
        type: string
        source: input
        description: borrower contact email
        constraints: required, unique across Borrowers
      - name: full_name
        type: string
        source: input
        description: legal name of borrower
        constraints: required
      - name: state_code
        type: string
        source: input
        description: two-letter US state of residence; selects the applicable APR/LTV regulatory profile
        constraints: required, one of {CA, TX, FL, VA, AZ}
      - name: monthly_income_cents
        type: integer
        source: input
        description: declared gross monthly income in cents; used for ability-to-repay gate
        constraints: required, >= 0
      - name: status
        type: enum
        source: system
        description: borrower lifecycle status
        default: ACTIVE
        constraints: one of {ACTIVE, BARRED}

  - name: RegulatoryProfile
    parent: null
    common_fields: false
    fields:
      - name: state_code
        type: string
        source: input
        description: two-letter US state this profile governs
        constraints: required, unique, one of {CA, TX, FL, VA, AZ}
      - name: max_apr_bps
        type: integer
        source: input
        description: state-mandated maximum effective APR in basis points (e.g., 3600 = 36.00%)
        constraints: required, > 0
      - name: max_ltv_bps
        type: integer
        source: input
        description: maximum loan-to-value ratio in basis points (e.g., 5000 = 50.00%) measured against the appraisal valuation basis
        constraints: required, > 0 and <= 10000
      - name: max_renewals
        type: integer
        source: input
        description: maximum number of rollovers/renewals permitted on a single Loan before further renewal is barred
        constraints: required, >= 0
      - name: min_term_months
        type: integer
        source: input
        description: minimum permitted loan term in months
        constraints: required, >= 1
      - name: max_term_months
        type: integer
        source: input
        description: maximum permitted loan term in months
        constraints: required, >= min_term_months
      - name: redemption_grace_days
        type: integer
        source: input
        description: days after a RepossessionOrder is RECOVERED during which the borrower may still redeem before sale is permitted
        constraints: required, >= 0
      - name: valuation_basis
        type: enum
        source: input
        description: which appraisal value variant the LTV ceiling is measured against in this state
        constraints: required, one of {TRADE_IN, AUCTION}

  - name: Vehicle
    parent: null
    common_fields: true
    fields:
      - name: borrower_id
        type: string
        source: input
        description: FK -> Borrower.id; owner of the vehicle pledged as collateral
        constraints: required
      - name: vin
        type: string
        source: input
        description: vehicle identification number
        constraints: required, unique across Vehicles
      - name: year
        type: integer
        source: input
        description: model year
        constraints: required
      - name: make
        type: string
        source: input
        description: manufacturer
        constraints: required
      - name: model
        type: string
        source: input
        description: model name
        constraints: required
      - name: odometer_miles
        type: integer
        source: input
        description: odometer reading in miles
        constraints: required, >= 0
      - name: lien_state
        type: enum
        source: system
        description: collateral encumbrance status, advanced by TitleLien filing/release
        default: CLEAR
        constraints: one of {CLEAR, ENCUMBERED}

  - name: Appraisal
    parent: null
    common_fields: true
    fields:
      - name: vehicle_id
        type: string
        source: input
        description: FK -> Vehicle.id; the vehicle being valued
        constraints: required
      - name: trade_in_value_cents
        type: integer
        source: input
        description: clean retail / trade-in valuation in cents (the optimistic, higher basis)
        constraints: required, > 0
      - name: auction_value_cents
        type: integer
        source: input
        description: forced-sale / auction valuation in cents (the pessimistic, lower basis)
        constraints: required, > 0 and <= trade_in_value_cents
      - name: condition_grade
        type: enum
        source: input
        description: physical condition grade affecting the haircut applied to the valuation basis
        constraints: required, one of {EXCELLENT, GOOD, FAIR, POOR}
      - name: basis_value_cents
        type: integer
        source: computed
        description: the post-haircut valuation in cents under the borrower-state valuation_basis; LTV ceiling is measured against this (see calc appraisal_basis_value)
      - name: max_principal_cents
        type: integer
        source: computed
        description: maximum loanable principal = floor(basis_value_cents * max_ltv_bps / 10000) (see calc max_principal_from_ltv)
      - name: status
        type: enum
        source: system
        description: appraisal lifecycle status
        default: DRAFT
        constraints: one of {DRAFT, FINALIZED, CONSUMED}

  - name: LoanApplication
    parent: null
    common_fields: true
    fields:
      - name: borrower_id
        type: string
        source: input
        description: FK -> Borrower.id; the applicant
        constraints: required
      - name: appraisal_id
        type: string
        source: input
        description: FK -> Appraisal.id; the appraisal backing the requested principal
        constraints: required
      - name: requested_principal_cents
        type: integer
        source: input
        description: principal amount the borrower requests in cents
        constraints: required, > 0
      - name: contract_apr_bps
        type: integer
        source: input
        description: lender's offered annual percentage rate in basis points before the state cap is applied
        constraints: required, > 0
      - name: term_months
        type: integer
        source: input
        description: requested repayment term in months
        constraints: required, >= 1
      - name: effective_apr_bps
        type: integer
        source: computed
        description: min(contract_apr_bps, RegulatoryProfile.max_apr_bps) — the capped rate actually used (see calc effective_apr)
      - name: status
        type: enum
        source: system
        description: application underwriting lifecycle
        default: SUBMITTED
        constraints: one of {SUBMITTED, APPROVED, REJECTED}

  - name: Loan
    parent: null
    common_fields: true
    fields:
      - name: application_id
        type: string
        source: input
        description: FK -> LoanApplication.id; the approved application that originated this loan
        constraints: required
      - name: borrower_id
        type: string
        source: system
        description: FK -> Borrower.id; copied from the originating application
      - name: vehicle_id
        type: string
        source: system
        description: FK -> Vehicle.id; collateral, copied from the appraisal on the application
      - name: original_principal_cents
        type: integer
        source: system
        description: principal disbursed at origination in cents; immutable after origination
      - name: effective_apr_bps
        type: integer
        source: system
        description: capped APR copied from the application; immutable
      - name: term_months
        type: integer
        source: system
        description: current contractual term in months; reset by a renewal
      - name: principal_balance_cents
        type: integer
        source: computed
        description: outstanding principal in cents; reduced by payment principal allocations (see calc payment_allocation)
      - name: accrued_interest_cents
        type: integer
        source: computed
        description: interest accrued and unpaid in cents; increased by schedule accrual, reduced by payment interest allocations
      - name: fees_balance_cents
        type: integer
        source: computed
        description: unpaid late fees and repossession fees in cents
      - name: renewal_count
        type: integer
        source: system
        description: number of renewals/rollovers applied to this loan
        default: 0
      - name: payoff_status
        type: enum
        source: system
        description: payoff dimension of the parallel state machine
        default: OUTSTANDING
        constraints: one of {OUTSTANDING, REDEEMED, PAID_OFF, CHARGED_OFF}
      - name: delinquency_status
        type: enum
        source: system
        description: delinquency dimension of the parallel state machine, evolves independently of payoff_status
        default: CURRENT
        constraints: one of {CURRENT, DELINQUENT, DEFAULT}

  - name: TitleLien
    parent: null
    common_fields: true
    fields:
      - name: loan_id
        type: string
        source: input
        description: FK -> Loan.id; the loan secured by this lien
        constraints: required
      - name: vehicle_id
        type: string
        source: system
        description: denormalized Vehicle.id of the encumbered collateral, copied from loan.vehicle_id at filing (read-only mirror, not an independently-set reference)
      - name: dmv_reference
        type: string
        source: input
        description: state DMV lien filing reference number
        constraints: required when filing
      - name: status
        type: enum
        source: system
        description: lien filing lifecycle
        default: PENDING
        constraints: one of {PENDING, FILED, RELEASED}

  - name: Installment
    parent: null
    common_fields: true
    fields:
      - name: loan_id
        type: string
        source: input
        description: FK -> Loan.id; the loan this installment belongs to
        constraints: required
      - name: sequence_no
        type: integer
        source: system
        description: 1-based position in the amortization schedule
        constraints: unique per loan
      - name: due_date
        type: datetime
        source: system
        description: ISO 8601 UTC due date for this installment
      - name: principal_due_cents
        type: integer
        source: computed
        description: scheduled principal portion in cents (see calc amortization_schedule)
      - name: interest_due_cents
        type: integer
        source: computed
        description: scheduled interest portion in cents (see calc amortization_schedule)
      - name: late_fee_cents
        type: integer
        source: computed
        description: late fee assessed when this installment goes past due (see calc late_fee_assessment)
      - name: status
        type: enum
        source: system
        description: installment lifecycle
        default: SCHEDULED
        constraints: one of {SCHEDULED, PAID, PAST_DUE, WAIVED}

  - name: Payment
    parent: null
    common_fields: true
    fields:
      - name: loan_id
        type: string
        source: input
        description: FK -> Loan.id; the loan being paid
        constraints: required
      - name: amount_cents
        type: integer
        source: input
        description: gross payment amount tendered in cents
        constraints: required, > 0
      - name: payment_type
        type: enum
        source: input
        description: nature of the payment; controls allocation order and which calc applies
        constraints: required, one of {REGULAR, REINSTATEMENT, REDEMPTION}
      - name: posted_at
        type: datetime
        source: system
        description: ISO 8601 UTC timestamp the payment was posted
      - name: principal_applied_cents
        type: integer
        source: computed
        description: portion allocated to principal (see calc payment_allocation)
      - name: interest_applied_cents
        type: integer
        source: computed
        description: portion allocated to accrued interest (see calc payment_allocation)
      - name: fees_applied_cents
        type: integer
        source: computed
        description: portion allocated to fees (see calc payment_allocation)
      - name: overpayment_cents
        type: integer
        source: computed
        description: amount tendered beyond total owed, refunded to borrower (see calc payment_allocation)

  - name: Renewal
    parent: null
    common_fields: true
    fields:
      - name: loan_id
        type: string
        source: input
        description: FK -> Loan.id; the loan being rolled over
        constraints: required
      - name: expected_loan_version
        type: integer
        source: input
        description: the Loan.version the client last observed; OCC guard for create-with-supersede
        constraints: required
      - name: new_term_months
        type: integer
        source: input
        description: extended term in months that supersedes the loan's prior term
        constraints: required, >= 1
      - name: rolled_fees_cents
        type: integer
        source: computed
        description: outstanding fees+accrued interest capitalized into principal at renewal (see calc renewal_capitalization)
      - name: new_principal_cents
        type: integer
        source: computed
        description: principal balance after capitalization (see calc renewal_capitalization)
      - name: renewal_index
        type: integer
        source: system
        description: 1-based ordinal of this renewal on the loan (equals loan.renewal_count after this renewal)

  - name: RepossessionOrder
    parent: null
    common_fields: true
    fields:
      - name: loan_id
        type: string
        source: input
        description: FK -> Loan.id; the defaulted loan whose collateral is being recovered
        constraints: required
      - name: vehicle_id
        type: string
        source: system
        description: denormalized Vehicle.id of the collateral, copied from loan.vehicle_id at order creation (read-only mirror, not an independently-set reference)
      - name: recovered_at
        type: datetime
        source: system
        description: ISO 8601 UTC timestamp collateral was physically recovered; null until RECOVERED
      - name: redemption_deadline
        type: datetime
        source: system
        description: recovered_at + RegulatoryProfile.redemption_grace_days; sale barred before this (see calc redemption_deadline)
      - name: sale_proceeds_cents
        type: integer
        source: input
        description: gross auction proceeds in cents, supplied at sale
        constraints: required when selling, >= 0
      - name: deficiency_cents
        type: integer
        source: computed
        description: amount still owed after sale proceeds applied (see calc deficiency_balance)
      - name: status
        type: enum
        source: system
        description: repossession lifecycle
        default: ORDERED
        constraints: one of {ORDERED, ASSIGNED, RECOVERED, SOLD, CANCELLED}

  - name: RepossessionAssignment
    parent: null
    common_fields: true
    fields:
      - name: repossession_order_id
        type: string
        source: input
        description: FK -> RepossessionOrder.id; the order this field-agent assignment serves
        constraints: required
      - name: agent_name
        type: string
        source: input
        description: name of the recovery agent
        constraints: required
      - name: window_start
        type: datetime
        source: input
        description: ISO 8601 UTC start of the agent's recovery attempt window for the vehicle (half-open interval start, inclusive)
        constraints: required
      - name: window_end
        type: datetime
        source: input
        description: ISO 8601 UTC end of the agent's recovery attempt window (half-open interval end, exclusive)
        constraints: required, > window_start

  - name: Device
    parent: null
    common_fields: true
    fields:
      - name: vehicle_id
        type: string
        source: input
        description: FK -> Vehicle.id; vehicle the GPS/starter-interrupt unit is installed on
        constraints: required, unique across Devices
      - name: serial_number
        type: string
        source: input
        description: hardware serial number
        constraints: required, unique
      - name: starter_state
        type: enum
        source: system
        description: current starter-interrupt state, advanced by DeviceCommand
        default: ENABLED
        constraints: one of {ENABLED, DISABLED}
      - name: active_disable_count
        type: integer
        source: system
        description: net count of unreversed DISABLE commands; invariant target (must return to 0 on reinstatement/redemption)
        default: 0

  - name: DeviceCommand
    parent: null
    common_fields: true
    fields:
      - name: device_id
        type: string
        source: input
        description: FK -> Device.id; the device receiving the command
        constraints: required
      - name: command_type
        type: enum
        source: input
        description: command kind
        constraints: required, one of {STARTER_DISABLE, STARTER_ENABLE, LOCATE}
      - name: effective_start
        type: datetime
        source: input
        description: ISO 8601 UTC start of the command's effective window (closed interval start, inclusive)
        constraints: required
      - name: effective_end
        type: datetime
        source: input
        description: ISO 8601 UTC end of the command's effective window (closed interval end, inclusive)
        constraints: required, >= effective_start
      - name: status
        type: enum
        source: system
        description: command lifecycle
        default: ISSUED
        constraints: one of {ISSUED, REVERSED}

# =====================================================================
# §1.2 State Machine Table
# =====================================================================
state_machines:
  - entity: Appraisal
    initial_state: DRAFT
    terminal_states: [CONSUMED]
    transitions:
      - from: DRAFT
        to: FINALIZED
        trigger: "POST /atl/appraisals/{id}/finalize"
        actor: Appraiser
        preconditions:
          - "appraisal.status == DRAFT"
        side_effects:
          - "compute basis_value_cents per calc appraisal_basis_value"
          - "compute max_principal_cents per calc max_principal_from_ltv"
          - "increments Appraisal.version by 1"
      - from: FINALIZED
        to: CONSUMED
        trigger: "system: LoanApplication approval consumes the appraisal"
        actor: system
        preconditions:
          - "appraisal.status == FINALIZED"
        side_effects:
          - "appraisal is locked from reuse by any other application"
          - "increments Appraisal.version by 1"

  - entity: LoanApplication
    initial_state: SUBMITTED
    terminal_states: [APPROVED, REJECTED]
    transitions:
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /atl/applications/{id}/approve"
        actor: Underwriter
        preconditions:
          - "application.status == SUBMITTED"
          - "referenced Appraisal.status == FINALIZED"
          - "requested_principal_cents <= Appraisal.max_principal_cents (LTV gate)"
          - "effective_apr_bps <= RegulatoryProfile.max_apr_bps for borrower.state_code"
          - "term_months within [min_term_months, max_term_months]"
          - "borrower.status == ACTIVE (a BARRED borrower is rejected with ERR_BORROWER_BARRED)"
        side_effects:
          - "Appraisal transitions FINALIZED -> CONSUMED (cascade)"
          - "create Loan in payoff_status=OUTSTANDING, delinquency_status=CURRENT with original_principal_cents = requested_principal_cents"
          - "create TitleLien in PENDING for the new loan"
          - "generate Installment schedule per calc amortization_schedule"
          - "set Vehicle.lien_state = ENCUMBERED"
          - "increments LoanApplication.version by 1"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /atl/applications/{id}/reject"
        actor: Underwriter
        preconditions:
          - "application.status == SUBMITTED"
        side_effects:
          - "no Loan created; Appraisal remains FINALIZED and reusable"
          - "increments LoanApplication.version by 1"

  - entity: TitleLien
    initial_state: PENDING
    terminal_states: [RELEASED]
    transitions:
      - from: PENDING
        to: FILED
        trigger: "POST /atl/title-liens/{id}/file"
        actor: TitleClerk
        preconditions:
          - "lien.status == PENDING"
          - "dmv_reference supplied"
          - "Loan.payoff_status == OUTSTANDING"
        side_effects:
          - "increments TitleLien.version by 1"
      - from: FILED
        to: RELEASED
        trigger: "system: lien release on loan payoff/redemption"
        actor: system
        preconditions:
          - "lien.status == FILED"
          - "Loan.payoff_status IN {PAID_OFF, REDEEMED}"
        side_effects:
          - "set Vehicle.lien_state = CLEAR (cascade)"
          - "increments TitleLien.version by 1"

  - entity: Loan
    initial_state: CURRENT
    terminal_states: [PAID_OFF, REDEEMED, CHARGED_OFF]
    note: "Two parallel dimensions: delinquency_status {CURRENT,DELINQUENT,DEFAULT} and payoff_status {OUTSTANDING,REDEEMED,PAID_OFF,CHARGED_OFF}. Terminal states above are payoff_status terminals; delinquency_status evolves independently until payoff terminal is reached."
    transitions:
      - from: CURRENT
        to: DELINQUENT
        trigger: "POST /atl/loans/{id}/assess-delinquency"
        actor: LoanServicer
        preconditions:
          - "loan.delinquency_status == CURRENT"
          - "loan.payoff_status == OUTSTANDING"
          - "at least one Installment with status==SCHEDULED has due_date < current clock time (otherwise ERR_INVALID_STATE: nothing to assess)"
        side_effects:
          - "flip every Installment with status==SCHEDULED and due_date < current clock time to PAST_DUE"
          - "accrue interest: accrued_interest_cents += sum of interest_due_cents over the newly PAST_DUE Installments"
          - "assess late_fee on each newly PAST_DUE Installment per calc late_fee_assessment; fees_balance_cents += total assessed late fees"
          - "issue DeviceCommand STARTER_DISABLE (status ISSUED) on the vehicle's Device if a Device exists (cascade): effective_start = effective_end = current clock time (zero-length window); Device.starter_state=DISABLED, Device.active_disable_count += 1. If no Device is installed on the vehicle, no command is issued and the transition still succeeds."
          - "increments Loan.version by 1"
      - from: DELINQUENT
        to: CURRENT
        trigger: "system: reinstatement payment cures past-due (cyclic)"
        actor: system
        preconditions:
          - "loan.delinquency_status == DELINQUENT"
          - "Payment.payment_type == REINSTATEMENT covers full reinstatement_amount per calc reinstatement_amount"
        side_effects:
          - "ledger: reduce principal_balance_cents by arrears_principal (sum of PAST_DUE principal_due_cents), set accrued_interest_cents -= arrears_interest, set fees_balance_cents to 0 (the reinstatement payment exactly retires arrears+fees per calc reinstatement_amount; no repo fee in DELINQUENT)"
          - "all PAST_DUE Installments set to PAID"
          - "issue DeviceCommand STARTER_ENABLE (status ISSUED, cascade) if a Device exists: effective_start=effective_end=current clock time; Device.starter_state=ENABLED, Device.active_disable_count -= 1 (floor 0; compensates the prior DISABLE). The prior STARTER_DISABLE command record stays ISSUED and continues to count for command-window-overlap checks."
          - "increments Loan.version by 1"
      - from: DELINQUENT
        to: DEFAULT
        trigger: "POST /atl/loans/{id}/declare-default"
        actor: LoanServicer
        preconditions:
          - "loan.delinquency_status == DELINQUENT"
          - "loan.payoff_status == OUTSTANDING"
        side_effects:
          - "create RepossessionOrder in ORDERED (cascade) which itself issues a STARTER_DISABLE DeviceCommand if a Device exists (depth-3 chain): effective_start = effective_end = current clock time (zero-length window); Device.starter_state=DISABLED, Device.active_disable_count += 1"
          - "increments Loan.version by 1"
      - from: DEFAULT
        to: CURRENT
        trigger: "system: reinstatement before sale restores the loan (cyclic)"
        actor: system
        preconditions:
          - "loan.delinquency_status == DEFAULT"
          - "active RepossessionOrder.status IN {ORDERED, ASSIGNED, RECOVERED}"
          - "Payment.payment_type == REINSTATEMENT covers full reinstatement_amount per calc reinstatement_amount"
        side_effects:
          - "ledger: reduce principal_balance_cents by arrears_principal (sum of PAST_DUE principal_due_cents), set accrued_interest_cents -= arrears_interest, set fees_balance_cents to 0 (the reinstatement payment retires arrears+fees+repo recovery per calc reinstatement_amount in DEFAULT)"
          - "active RepossessionOrder transitions to CANCELLED (cascade)"
          - "all PAST_DUE Installments set to PAID"
          - "issue DeviceCommand STARTER_ENABLE: Device.starter_state=ENABLED, Device.active_disable_count reset to 0"
          - "increments Loan.version by 1"
      - from: OUTSTANDING
        to: PAID_OFF
        trigger: "system: a REGULAR payment clears principal+interest+fees to zero"
        actor: system
        preconditions:
          - "loan.payoff_status == OUTSTANDING"
          - "after allocation principal_balance_cents == 0 AND accrued_interest_cents == 0 AND fees_balance_cents == 0"
        side_effects:
          - "TitleLien FILED -> RELEASED (cascade) which sets Vehicle.lien_state=CLEAR (depth-2 chain)"
          - "remaining SCHEDULED Installments set to WAIVED"
          - "increments Loan.version by 1"
      - from: OUTSTANDING
        to: REDEEMED
        trigger: "system: a REDEMPTION payment pays the full redemption_amount"
        actor: system
        preconditions:
          - "loan.payoff_status == OUTSTANDING"
          - "Payment.payment_type == REDEMPTION covers full redemption_amount per calc redemption_amount"
        side_effects:
          - "TitleLien FILED -> RELEASED (cascade) which sets Vehicle.lien_state=CLEAR"
          - "any active RepossessionOrder transitions to CANCELLED (cascade)"
          - "issue DeviceCommand STARTER_ENABLE: Device.active_disable_count reset to 0"
          - "increments Loan.version by 1"
      - from: OUTSTANDING
        to: CHARGED_OFF
        trigger: "system: RepossessionOrder SOLD finalizes the loan"
        actor: system
        preconditions:
          - "loan.payoff_status == OUTSTANDING"
          - "RepossessionOrder.status == SOLD"
        side_effects:
          - "deficiency_cents recorded per calc deficiency_balance"
          - "TitleLien FILED -> RELEASED (cascade); Vehicle.lien_state=CLEAR"
          - "set Borrower.status = BARRED (cascade): a borrower whose collateral was sold at a charge-off is barred from originating new loans"
          - "increments Loan.version by 1"

  - entity: RepossessionOrder
    initial_state: ORDERED
    terminal_states: [SOLD, CANCELLED]
    note: "Branching fork-join: ORDERED -> {ASSIGNED -> RECOVERED -> SOLD} OR ORDERED/ASSIGNED/RECOVERED -> CANCELLED (redemption/reinstatement path). Divergent side-effect sets per branch."
    transitions:
      - from: ORDERED
        to: ASSIGNED
        trigger: "POST /atl/repossession-orders/{id}/assign"
        actor: RecoveryManager
        preconditions:
          - "order.status == ORDERED"
          - "Loan.delinquency_status == DEFAULT"
          - "a RepossessionAssignment exists for this order"
        side_effects:
          - "increments RepossessionOrder.version by 1"
      - from: ASSIGNED
        to: RECOVERED
        trigger: "POST /atl/repossession-orders/{id}/recover"
        actor: RecoveryManager
        preconditions:
          - "order.status == ASSIGNED"
          - "Loan.delinquency_status == DEFAULT"
        side_effects:
          - "set recovered_at = current clock time"
          - "set redemption_deadline per calc redemption_deadline"
          - "increments RepossessionOrder.version by 1"
      - from: RECOVERED
        to: SOLD
        trigger: "POST /atl/repossession-orders/{id}/sell"
        actor: RecoveryManager
        preconditions:
          - "order.status == RECOVERED"
          - "current clock time >= redemption_deadline (redemption grace elapsed)"
          - "sale_proceeds_cents supplied"
        side_effects:
          - "compute deficiency_cents per calc deficiency_balance"
          - "Loan OUTSTANDING -> CHARGED_OFF (cascade)"
          - "increments RepossessionOrder.version by 1"
      - from: ORDERED
        to: CANCELLED
        trigger: "system: redemption or reinstatement cancels recovery"
        actor: system
        preconditions:
          - "order.status IN {ORDERED, ASSIGNED, RECOVERED}"
        side_effects:
          - "no deficiency recorded; collateral returned"
          - "increments RepossessionOrder.version by 1"

  - entity: Device
    initial_state: ENABLED
    terminal_states: []
    note: "starter_state is toggled by DeviceCommand issuance; cyclic ENABLED<->DISABLED. The ENABLED precondition below guards ONLY the public POST /atl/devices/{id}/commands endpoint. System cascades (assess-delinquency, declare-default) increment active_disable_count and set starter_state=DISABLED idempotently even if the device is already DISABLED — they bypass the public-endpoint preconditions but still run the command-window-overlap check is NOT applied to cascade-issued commands (cascades always succeed)."
    transitions:
      - from: ENABLED
        to: DISABLED
        trigger: "POST /atl/devices/{id}/commands (command_type=STARTER_DISABLE)"
        actor: LoanServicer
        preconditions:
          - "device.starter_state == ENABLED"
          - "Loan secured by this vehicle has delinquency_status IN {DELINQUENT, DEFAULT}"
          - "no other ISSUED STARTER_DISABLE command window overlaps the requested [effective_start, effective_end] (closed-interval overlap)"
        side_effects:
          - "active_disable_count += 1"
          - "increments Device.version by 1"
      - from: DISABLED
        to: ENABLED
        trigger: "POST /atl/devices/{id}/commands (command_type=STARTER_ENABLE)"
        actor: LoanServicer
        preconditions:
          - "device.starter_state == DISABLED"
        side_effects:
          - "active_disable_count -= 1 (floor 0)"
          - "increments Device.version by 1"

# =====================================================================
# §1.2.1 Concurrency Rules
# =====================================================================
concurrency_rules:
  - rule_id: renewal-create-stale-loan
    parent_entity: Loan
    write_endpoint: "POST /atl/loans/{id}/renewals"
    occ_field: "expected_loan_version"
    description: |
      Creating a Renewal against a Loan whose version has advanced since the
      client last observed it is rejected with a stale-version error. A Renewal
      legitimately supersedes the loan's prior term and capitalizes outstanding
      fees into principal; if another writer has already renewed (or any cascade
      bumped the loan version) the current writer's view is stale and the
      create must be refused.
    error_id: ERR_STALE_LOAN_VERSION
    http_status: 412

# =====================================================================
# §1.3 Calculation Rules Table
# =====================================================================
calculations:
  - name: appraisal_basis_value
    trigger: "on POST /atl/appraisals/{id}/finalize (Appraisal DRAFT -> FINALIZED)"
    algorithm: weighted_scoring
    formula: |
      raw = (RegulatoryProfile.valuation_basis == TRADE_IN)
              ? trade_in_value_cents
              : auction_value_cents
      haircut_bps = CONDITION_HAIRCUT_BPS[condition_grade]
      basis_value_cents = floor(raw * (10000 - haircut_bps) / 10000)
    input_set: "the single Appraisal being finalized; valuation_basis read from the borrower's state RegulatoryProfile (borrower resolved via Vehicle.borrower_id)"
    constants:
      CONDITION_HAIRCUT_BPS: { EXCELLENT: 0, GOOD: 500, FAIR: 1500, POOR: 3000 }
    precision: "integer cents, floor"
    variants:
      - name: trade_in_basis
        when: "borrower state RegulatoryProfile.valuation_basis == TRADE_IN"
        difference: "uses the higher trade_in_value_cents, yielding a larger basis and a larger LTV ceiling"
      - name: auction_basis
        when: "borrower state RegulatoryProfile.valuation_basis == AUCTION"
        difference: "uses the lower auction_value_cents, yielding a smaller basis and a smaller LTV ceiling for identical condition"

  - name: max_principal_from_ltv
    trigger: "on POST /atl/appraisals/{id}/finalize (immediately after appraisal_basis_value)"
    algorithm: threshold
    formula: |
      max_principal_cents = floor(basis_value_cents * RegulatoryProfile.max_ltv_bps / 10000)
    input_set: "the finalized Appraisal's basis_value_cents and the borrower-state max_ltv_bps"
    constants: {}
    precision: "integer cents, floor"

  - name: effective_apr
    trigger: "on LoanApplication submit (computed) and re-checked at approve"
    algorithm: threshold
    formula: |
      # Cap-and-store. The regulatory GATE is separate: ERR_APR_CAP_EXCEEDED fires
      # when contract_apr_bps > max_apr_bps (strict >; contract == cap is allowed).
      # When the gate passes, effective_apr_bps = min(contract_apr_bps, max_apr_bps)
      # = contract_apr_bps (since contract <= cap when the gate passes).
      effective_apr_bps = min(contract_apr_bps, RegulatoryProfile.max_apr_bps)
    input_set: "the application's contract_apr_bps and the borrower-state max_apr_bps"
    constants: {}
    precision: "integer basis points"

  - name: amortization_schedule
    trigger: "on LoanApplication APPROVED (Loan + Installment schedule generation)"
    algorithm: tiered_pricing
    formula: |
      # Inputs: P = original_principal_cents, r_annual = effective_apr_bps/10000,
      #         n = term_months. Monthly rate i = r_annual / 12.
      # Standard amortizing payment, all interest rounded per-installment.
      i = (effective_apr_bps / 10000) / 12
      pmt = P * i / (1 - (1 + i) ** (-n))      # real cents, unrounded
      balance = P
      for seq in 1..n:
        interest_due_cents[seq] = round_half_up(balance * i)     # ROUND PER INSTALLMENT
        if seq < n:
          principal_due_cents[seq] = round_half_up(pmt) - interest_due_cents[seq]
        else:
          principal_due_cents[seq] = balance                     # final installment absorbs residue
        balance = balance - principal_due_cents[seq]
      # Pinned order: interest is rounded per installment THEN summed; the final
      # installment's principal absorbs any rounding residue so sum(principal)==P.
    input_set: "the newly originated Loan's original_principal_cents, effective_apr_bps, term_months"
    constants:
      FIRST_DUE_OFFSET_DAYS: 30
      DUE_SPACING_DAYS: 30
    precision: "integer cents, round_half_up per installment; final installment absorbs residue"

  - name: late_fee_assessment
    trigger: "on POST /atl/loans/{id}/assess-delinquency (Loan CURRENT -> DELINQUENT) for each newly PAST_DUE Installment"
    algorithm: aggregation
    formula: |
      # Per newly PAST_DUE installment:
      per_installment_fee = min(
        max(LATE_FEE_FLOOR_CENTS, floor(installment.principal_due_cents * LATE_FEE_BPS / 10000)),
        LATE_FEE_CAP_CENTS
      )
      total_assessed = sum(per_installment_fee for each newly PAST_DUE installment)
      loan.fees_balance_cents += total_assessed
    input_set: "Installments on the loan whose status flips SCHEDULED -> PAST_DUE in this assessment (due_date < current clock time, status == SCHEDULED)"
    constants:
      LATE_FEE_BPS: 500
      LATE_FEE_FLOOR_CENTS: 1500
      LATE_FEE_CAP_CENTS: 5000
    precision: "integer cents, floor on the percentage term before min/max clamp"

  - name: payment_allocation
    trigger: "on POST /atl/loans/{id}/payments (payment_type == REGULAR)"
    algorithm: waterfall_allocation
    formula: |
      # Waterfall order is FIXED: fees -> accrued interest -> principal -> overpayment.
      remaining = amount_cents
      fees_applied_cents = min(remaining, fees_balance_cents); remaining -= fees_applied_cents
      interest_applied_cents = min(remaining, accrued_interest_cents); remaining -= interest_applied_cents
      principal_applied_cents = min(remaining, principal_balance_cents); remaining -= principal_applied_cents
      overpayment_cents = remaining     # refunded to borrower
      loan.fees_balance_cents -= fees_applied_cents
      loan.accrued_interest_cents -= interest_applied_cents
      loan.principal_balance_cents -= principal_applied_cents
    input_set: "the single REGULAR Payment and the loan's current fees/interest/principal balances"
    constants: {}
    precision: "integer cents, exact"

  - name: redemption_amount
    trigger: "on POST /atl/loans/{id}/payments (payment_type == REDEMPTION); also read-only via GET /atl/loans/{id}/payoff-quote"
    algorithm: aggregation
    formula: |
      # FULL payoff: everything owed plus repossession cost recovery if a repo
      # order has been opened (depth & inclusion differ from reinstatement).
      repo_recovery = (loan has RepossessionOrder.status IN {ORDERED,ASSIGNED,RECOVERED})
                        ? REPO_RECOVERY_FEE_CENTS : 0
      redemption_amount_cents = principal_balance_cents
                              + accrued_interest_cents
                              + fees_balance_cents
                              + repo_recovery
    input_set: "the loan's full principal+interest+fees balances plus a flat repossession recovery fee when an active RepossessionOrder exists"
    constants:
      REPO_RECOVERY_FEE_CENTS: 25000
    precision: "integer cents, exact"
    variants:
      - name: pre_repo_redemption
        when: "no active RepossessionOrder on the loan"
        difference: "excludes REPO_RECOVERY_FEE_CENTS"
      - name: post_repo_redemption
        when: "an active RepossessionOrder (ORDERED/ASSIGNED/RECOVERED) exists"
        difference: "adds REPO_RECOVERY_FEE_CENTS to the full balance"

  - name: reinstatement_amount
    trigger: "on POST /atl/loans/{id}/payments (payment_type == REINSTATEMENT); also read-only via GET /atl/loans/{id}/payoff-quote"
    algorithm: aggregation
    formula: |
      # CURE amount only: arrears (past-due principal+interest) + assessed late
      # fees + repo recovery if defaulted. Does NOT include not-yet-due principal.
      arrears_principal = sum(principal_due_cents for Installment where status==PAST_DUE)
      arrears_interest  = sum(interest_due_cents  for Installment where status==PAST_DUE)
      repo_recovery = (loan.delinquency_status == DEFAULT) ? REPO_RECOVERY_FEE_CENTS : 0
      reinstatement_amount_cents = arrears_principal + arrears_interest
                                 + fees_balance_cents + repo_recovery
    input_set: "Installments on the loan with status==PAST_DUE plus current fees_balance_cents; repo fee only when delinquency_status==DEFAULT"
    constants:
      REPO_RECOVERY_FEE_CENTS: 25000
    precision: "integer cents, exact"

  - name: renewal_capitalization
    trigger: "on POST /atl/loans/{id}/renewals (Renewal create)"
    algorithm: aggregation
    formula: |
      rolled_fees_cents = accrued_interest_cents + fees_balance_cents
      new_principal_cents = principal_balance_cents + rolled_fees_cents
      # post-renewal loan state:
      loan.principal_balance_cents = new_principal_cents
      loan.accrued_interest_cents = 0
      loan.fees_balance_cents = 0
      loan.term_months = new_term_months
      loan.renewal_count += 1
    input_set: "the loan's current principal/interest/fees balances at the moment of renewal"
    constants: {}
    precision: "integer cents, exact"

  - name: redemption_deadline
    trigger: "on POST /atl/repossession-orders/{id}/recover (ASSIGNED -> RECOVERED)"
    algorithm: aggregation
    formula: |
      redemption_deadline = recovered_at + RegulatoryProfile.redemption_grace_days days
    input_set: "the order's recovered_at timestamp and the borrower-state redemption_grace_days"
    constants: {}
    precision: "ISO 8601 UTC datetime"

  - name: deficiency_balance
    trigger: "on POST /atl/repossession-orders/{id}/sell (RECOVERED -> SOLD)"
    algorithm: waterfall_allocation
    formula: |
      total_owed = principal_balance_cents + accrued_interest_cents
                 + fees_balance_cents + REPO_RECOVERY_FEE_CENTS
      net_proceeds = max(0, sale_proceeds_cents - SALE_COST_CENTS)
      deficiency_cents = max(0, total_owed - net_proceeds)
      # surplus (net_proceeds > total_owed) is returned to borrower, deficiency floored at 0
    input_set: "the loan's full balances at sale, the order's sale_proceeds_cents, fixed sale cost"
    constants:
      REPO_RECOVERY_FEE_CENTS: 25000
      SALE_COST_CENTS: 30000
    precision: "integer cents, exact, floored at 0"

# =====================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =====================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and well-formed"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "acting role is permitted for the operation per §1.7 RBAC"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: all

  - priority: 3
    category: auth
    check: "segregation of duties: the Underwriter approving an application MUST differ (X-User-ID) from the Appraiser who finalized its appraisal"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /atl/applications/{id}/approve"

  - priority: 4
    category: existence
    check: "every path/body resource id resolves to an existing entity, validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all

  - priority: 5
    category: business_constraint
    check: "required body fields present and well-typed; enum members valid"
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: all

  - priority: 5
    category: business_constraint
    check: "numeric/interval range checks evaluated after the field-presence/type check in the request-validation group: amount_cents > 0, requested_principal_cents > 0, monthly_income_cents >= 0, sale_proceeds_cents >= 0, and window_end strictly after window_start (effective_end >= effective_start for commands). A type-valid but out-of-range value yields ERR_VALIDATION_RANGE."
    error_id: ERR_VALIDATION_RANGE
    http_status: 422
    applies_to: "POST /atl/loans/{id}/payments, POST /atl/applications, POST /atl/borrowers, POST /atl/repossession-orders/{id}/assignments, POST /atl/repossession-orders/{id}/sell, POST /atl/devices/{id}/commands"

  - priority: 6
    category: state
    check: "target entity is in a state from which the requested transition is defined in §1.2; for renewal specifically, Loan.payoff_status MUST == OUTSTANDING (a REDEEMED/PAID_OFF/CHARGED_OFF loan cannot be renewed)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all transition endpoints, POST /atl/loans/{id}/renewals"

  - priority: 7
    category: state
    check: "OCC: Renewal create's expected_loan_version equals current Loan.version"
    error_id: ERR_STALE_LOAN_VERSION
    http_status: 412
    applies_to: "POST /atl/loans/{id}/renewals"

  - priority: 8
    category: business_referential
    check: "cross-entity guard: RepossessionOrder actions require the referenced Loan.delinquency_status == DEFAULT"
    error_id: ERR_LOAN_NOT_IN_DEFAULT
    http_status: 409
    applies_to: "POST /atl/repossession-orders, POST /atl/repossession-orders/{id}/assign, POST /atl/repossession-orders/{id}/recover"

  - priority: 9
    category: business_referential
    check: "cross-entity guard: TitleLien may only be FILED while the referenced Loan.payoff_status == OUTSTANDING"
    error_id: ERR_LIEN_LOAN_NOT_OUTSTANDING
    http_status: 409
    applies_to: "POST /atl/title-liens/{id}/file"

  - priority: 10
    category: business_referential
    check: "cross-entity guard: a public STARTER_DISABLE command requires the vehicle's active loan (the single Loan where loan.vehicle_id == device.vehicle_id AND loan.payoff_status == OUTSTANDING) to have delinquency_status IN {DELINQUENT, DEFAULT}; STARTER_ENABLE and LOCATE are exempt"
    error_id: ERR_DEVICE_LOAN_NOT_DELINQUENT
    http_status: 409
    applies_to: "POST /atl/devices/{id}/commands"

  - priority: 11
    category: business_safety
    check: "borrower eligibility: the application's borrower.status MUST == ACTIVE; a BARRED borrower (one whose prior loan was charged off after sale) cannot have a new application approved. Evaluated before the APR/term/LTV gates within the business_safety group."
    error_id: ERR_BORROWER_BARRED
    http_status: 403
    applies_to: "POST /atl/applications/{id}/approve"

  - priority: 11
    category: business_safety
    check: "regulatory APR cap: application contract_apr_bps must not exceed the borrower-state max_apr_bps (strict: contract_apr_bps > max_apr_bps rejected; contract_apr_bps == max_apr_bps allowed); re-verified at approve"
    error_id: ERR_APR_CAP_EXCEEDED
    http_status: 422
    applies_to: "POST /atl/applications, POST /atl/applications/{id}/approve"

  - priority: 12
    category: business_safety
    check: "regulatory term bounds: term_months within [min_term_months, max_term_months] for borrower state"
    error_id: ERR_TERM_OUT_OF_BOUNDS
    http_status: 422
    applies_to: "POST /atl/applications, POST /atl/applications/{id}/approve"

  - priority: 13
    category: business_safety
    check: "rollover limit: a Renewal is barred once Loan.renewal_count >= RegulatoryProfile.max_renewals for the borrower state"
    error_id: ERR_RENEWAL_LIMIT_REACHED
    http_status: 409
    applies_to: "POST /atl/loans/{id}/renewals"

  - priority: 14
    category: business_temporal
    check: "redemption grace: a RepossessionOrder may not be SOLD before current clock time >= redemption_deadline"
    error_id: ERR_REDEMPTION_GRACE_ACTIVE
    http_status: 409
    applies_to: "POST /atl/repossession-orders/{id}/sell"

  - priority: 15
    category: business_temporal
    check: "DeviceCommand STARTER_DISABLE window must not overlap an existing ISSUED STARTER_DISABLE window on the same device (closed-interval, adjacency-touch counts as overlap)"
    error_id: ERR_COMMAND_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /atl/devices/{id}/commands"

  - priority: 16
    category: business_temporal
    check: "RepossessionAssignment window must not overlap another assignment window on the same RepossessionOrder (half-open interval, adjacency-touch allowed)"
    error_id: ERR_ASSIGNMENT_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /atl/repossession-orders/{id}/assignments"

  - priority: 17
    category: business_fiscal
    check: "LTV ceiling: requested_principal_cents must not exceed Appraisal.max_principal_cents (strict: requested > max_principal rejected; requested == max_principal allowed); re-verified at approve"
    error_id: ERR_LTV_EXCEEDED
    http_status: 422
    applies_to: "POST /atl/applications, POST /atl/applications/{id}/approve"

  - priority: 18
    category: business_fiscal
    check: "payment polarity: REINSTATEMENT/REDEMPTION payment amount must fully cover the corresponding computed amount (no partial cure/payoff)"
    error_id: ERR_INSUFFICIENT_PAYMENT
    http_status: 422
    applies_to: "POST /atl/loans/{id}/payments"

# =====================================================================
# §1.5 API Endpoint Table
# =====================================================================
endpoints:
  # ---- RegulatoryProfile (config) ----
  - method: POST
    path: "/atl/regulatory-profiles"
    description: "create a state regulatory profile (APR cap, LTV cap, renewal limit, term bounds, grace, valuation basis)"
    roles: [ComplianceAdmin]
    code: 201
    input: [state_code, max_apr_bps, max_ltv_bps, max_renewals, min_term_months, max_term_months, redemption_grace_days, valuation_basis]
    output: RegulatoryProfile
    side_effects: []
  - method: GET
    path: "/atl/regulatory-profiles"
    description: "list regulatory profiles, optionally filtered by state_code"
    roles: [ComplianceAdmin, Underwriter, Appraiser, LoanServicer, RecoveryManager, TitleClerk]
    code: 200
    input: ["state_code?", "limit?", "offset?"]
    output: RegulatoryProfile[]
    side_effects: []

  # ---- Borrower ----
  - method: POST
    path: "/atl/borrowers"
    description: "register a borrower"
    roles: [Underwriter, ComplianceAdmin]
    code: 201
    input: [email, full_name, state_code, monthly_income_cents]
    output: Borrower
    side_effects: []
  - method: GET
    path: "/atl/borrowers/{id}"
    description: "fetch a borrower"
    roles: [Underwriter, ComplianceAdmin, LoanServicer, Appraiser]
    code: 200
    input: []
    output: Borrower
    side_effects: []
  - method: GET
    path: "/atl/borrowers/{id}/vehicles"
    description: "list vehicles owned by a borrower (FK reverse-reachability for Vehicle.borrower_id)"
    roles: [Underwriter, ComplianceAdmin, Appraiser, LoanServicer]
    code: 200
    input: ["limit?", "offset?"]
    output: Vehicle[]
    side_effects: []

  # ---- Vehicle ----
  - method: POST
    path: "/atl/vehicles"
    description: "register a collateral vehicle for a borrower"
    roles: [Appraiser, Underwriter]
    code: 201
    input: [borrower_id, vin, year, make, model, odometer_miles]
    output: Vehicle
    side_effects: []
  - method: GET
    path: "/atl/vehicles/{id}"
    description: "fetch a vehicle"
    roles: [Appraiser, Underwriter, LoanServicer, RecoveryManager, TitleClerk]
    code: 200
    input: []
    output: Vehicle
    side_effects: []
  - method: GET
    path: "/atl/vehicles/{id}/appraisals"
    description: "list appraisals for a vehicle (FK reverse-reachability for Appraisal.vehicle_id)"
    roles: [Appraiser, Underwriter]
    code: 200
    input: ["limit?", "offset?"]
    output: Appraisal[]
    side_effects: []
  - method: GET
    path: "/atl/vehicles/{id}/devices"
    description: "list devices installed on a vehicle (FK reverse-reachability for Device.vehicle_id)"
    roles: [LoanServicer, RecoveryManager, Appraiser]
    code: 200
    input: ["limit?", "offset?"]
    output: Device[]
    side_effects: []

  # ---- Appraisal ----
  - method: POST
    path: "/atl/appraisals"
    description: "create a DRAFT appraisal with trade-in and auction valuations and a condition grade"
    roles: [Appraiser]
    code: 201
    input: [vehicle_id, trade_in_value_cents, auction_value_cents, condition_grade]
    output: Appraisal
    side_effects: []
  - method: GET
    path: "/atl/appraisals/{id}"
    description: "fetch an appraisal including computed basis_value_cents and max_principal_cents"
    roles: [Appraiser, Underwriter]
    code: 200
    input: []
    output: Appraisal
    side_effects: []
  - method: POST
    path: "/atl/appraisals/{id}/finalize"
    description: "finalize a DRAFT appraisal, computing basis_value_cents and max_principal_cents"
    roles: [Appraiser]
    code: 200
    input: []
    output: Appraisal
    side_effects:
      - "compute basis_value_cents (calc appraisal_basis_value)"
      - "compute max_principal_cents (calc max_principal_from_ltv)"
      - "Appraisal DRAFT -> FINALIZED"

  # ---- LoanApplication ----
  - method: POST
    path: "/atl/applications"
    description: "submit a loan application against a finalized appraisal; computes effective_apr_bps and runs APR/LTV/term gates"
    roles: [Underwriter]
    code: 201
    input: [borrower_id, appraisal_id, requested_principal_cents, contract_apr_bps, term_months]
    output: LoanApplication
    side_effects:
      - "compute effective_apr_bps (calc effective_apr)"
  - method: GET
    path: "/atl/applications"
    description: "list loan applications, optionally filtered by borrower_id or appraisal_id (FK reverse-reachability for LoanApplication.borrower_id/appraisal_id)"
    roles: [Underwriter, ComplianceAdmin]
    code: 200
    input: ["borrower_id?", "appraisal_id?", "limit?", "offset?"]
    output: LoanApplication[]
    side_effects: []
  - method: GET
    path: "/atl/applications/{id}"
    description: "fetch an application"
    roles: [Underwriter, ComplianceAdmin]
    code: 200
    input: []
    output: LoanApplication
    side_effects: []
  - method: POST
    path: "/atl/applications/{id}/approve"
    description: "approve a submitted application; originates a Loan, lien, and schedule"
    roles: [Underwriter]
    code: 200
    input: []
    output: LoanApplication
    side_effects:
      - "Appraisal FINALIZED -> CONSUMED (cascade)"
      - "create Loan (OUTSTANDING/CURRENT)"
      - "create TitleLien (PENDING)"
      - "generate Installment schedule (calc amortization_schedule)"
      - "Vehicle.lien_state = ENCUMBERED"
      - "LoanApplication SUBMITTED -> APPROVED"
  - method: POST
    path: "/atl/applications/{id}/reject"
    description: "reject a submitted application"
    roles: [Underwriter]
    code: 200
    input: []
    output: LoanApplication
    side_effects:
      - "LoanApplication SUBMITTED -> REJECTED"

  # ---- Loan ----
  - method: GET
    path: "/atl/loans/{id}"
    description: "fetch a loan with balances and both state dimensions"
    roles: [Underwriter, ComplianceAdmin, LoanServicer, RecoveryManager, TitleClerk]
    code: 200
    input: []
    output: Loan
    side_effects: []
  - method: GET
    path: "/atl/loans"
    description: "list loans, optionally filtered by application_id, borrower_id, or vehicle_id (FK reverse-reachability for Loan.application_id/borrower_id/vehicle_id)"
    roles: [Underwriter, ComplianceAdmin, LoanServicer, RecoveryManager, TitleClerk]
    code: 200
    input: ["application_id?", "borrower_id?", "vehicle_id?", "limit?", "offset?"]
    output: Loan[]
    side_effects: []
  - method: GET
    path: "/atl/loans/{id}/installments"
    description: "list a loan's amortization schedule (FK reverse-reachability for Installment.loan_id)"
    roles: [Underwriter, ComplianceAdmin, LoanServicer]
    code: 200
    input: ["limit?", "offset?"]
    output: Installment[]
    side_effects: []
  - method: GET
    path: "/atl/loans/{id}/payoff-quote"
    description: "read-only computed redemption_amount and reinstatement_amount for the loan"
    roles: [LoanServicer, Underwriter, ComplianceAdmin]
    code: 200
    input: []
    output: "{ redemption_amount_cents: integer, reinstatement_amount_cents: integer }"
    side_effects: []
  - method: POST
    path: "/atl/loans/{id}/assess-delinquency"
    description: "assess delinquency: flip past-due installments, charge late fees, disable starter (CURRENT -> DELINQUENT)"
    roles: [LoanServicer]
    code: 200
    input: []
    output: Loan
    side_effects:
      - "Installments past due -> PAST_DUE; assess late_fee (calc late_fee_assessment)"
      - "fees_balance_cents increases"
      - "issue STARTER_DISABLE DeviceCommand (cascade)"
      - "Loan delinquency CURRENT -> DELINQUENT"
  - method: POST
    path: "/atl/loans/{id}/declare-default"
    description: "declare default on a delinquent loan, opening a repossession order (DELINQUENT -> DEFAULT)"
    roles: [LoanServicer]
    code: 200
    input: []
    output: Loan
    side_effects:
      - "create RepossessionOrder (ORDERED) (cascade) which issues a STARTER_DISABLE DeviceCommand (depth-3)"
      - "Loan delinquency DELINQUENT -> DEFAULT"
  - method: POST
    path: "/atl/loans/{id}/payments"
    description: "post a payment (REGULAR allocates by waterfall; REINSTATEMENT cures; REDEMPTION pays off)"
    roles: [LoanServicer]
    code: 201
    input: [amount_cents, payment_type]
    output: Payment
    side_effects:
      - "REGULAR: allocate fees->interest->principal->overpayment (calc payment_allocation); may trigger Loan -> PAID_OFF cascade"
      - "REINSTATEMENT: verify covers reinstatement_amount; cure past-due; STARTER_ENABLE; Loan DELINQUENT/DEFAULT -> CURRENT (cyclic, cancels active repo)"
      - "REDEMPTION: verify covers redemption_amount; Loan OUTSTANDING -> REDEEMED; release lien; cancel active repo"
  - method: POST
    path: "/atl/loans/{id}/renewals"
    description: "roll over / renew a loan, capitalizing fees+interest into principal and extending the term (OCC-guarded)"
    roles: [LoanServicer]
    code: 201
    input: [expected_loan_version, new_term_months]
    output: Renewal
    side_effects:
      - "capitalize fees+interest into principal (calc renewal_capitalization)"
      - "reset accrued_interest_cents and fees_balance_cents to 0; set term_months=new_term_months; renewal_count += 1"
      - "increments Loan.version by 1"
  - method: GET
    path: "/atl/loans/{id}/renewals"
    description: "list a loan's renewals (FK reverse-reachability for Renewal.loan_id)"
    roles: [LoanServicer, ComplianceAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: Renewal[]
    side_effects: []
  - method: GET
    path: "/atl/loans/{id}/payments"
    description: "list a loan's payments (FK reverse-reachability for Payment.loan_id)"
    roles: [LoanServicer, ComplianceAdmin, Underwriter]
    code: 200
    input: ["limit?", "offset?"]
    output: Payment[]
    side_effects: []

  # ---- TitleLien ----
  - method: GET
    path: "/atl/title-liens/{id}"
    description: "fetch a title lien"
    roles: [TitleClerk, Underwriter, ComplianceAdmin, LoanServicer]
    code: 200
    input: []
    output: TitleLien
    side_effects: []
  - method: GET
    path: "/atl/loans/{id}/title-liens"
    description: "list title liens for a loan (FK reverse-reachability for TitleLien.loan_id)"
    roles: [TitleClerk, Underwriter, ComplianceAdmin, LoanServicer]
    code: 200
    input: ["limit?", "offset?"]
    output: TitleLien[]
    side_effects: []
  - method: POST
    path: "/atl/title-liens/{id}/file"
    description: "file the lien with the DMV (PENDING -> FILED)"
    roles: [TitleClerk]
    code: 200
    input: [dmv_reference]
    output: TitleLien
    side_effects:
      - "TitleLien PENDING -> FILED"

  # ---- RepossessionOrder ----
  - method: POST
    path: "/atl/repossession-orders"
    description: "open a repossession order directly against a defaulted loan (idempotent: rejected if loan not in DEFAULT or an active order exists)"
    roles: [RecoveryManager]
    code: 201
    input: [loan_id]
    output: RepossessionOrder
    side_effects:
      - "create RepossessionOrder (ORDERED)"
      - "issue STARTER_DISABLE DeviceCommand on vehicle's device"
  - method: GET
    path: "/atl/repossession-orders/{id}"
    description: "fetch a repossession order"
    roles: [RecoveryManager, LoanServicer, ComplianceAdmin]
    code: 200
    input: []
    output: RepossessionOrder
    side_effects: []
  - method: GET
    path: "/atl/loans/{id}/repossession-orders"
    description: "list repossession orders for a loan (FK reverse-reachability for RepossessionOrder.loan_id)"
    roles: [RecoveryManager, LoanServicer, ComplianceAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: RepossessionOrder[]
    side_effects: []
  - method: POST
    path: "/atl/repossession-orders/{id}/assignments"
    description: "attach a field-agent recovery window to a repossession order"
    roles: [RecoveryManager]
    code: 201
    input: [agent_name, window_start, window_end]
    output: RepossessionAssignment
    side_effects:
      - "reject if window overlaps an existing assignment window on the same order (calc/validation ERR_ASSIGNMENT_WINDOW_OVERLAP)"
  - method: GET
    path: "/atl/repossession-orders/{id}/assignments"
    description: "list assignments for a repossession order (FK reverse-reachability for RepossessionAssignment.repossession_order_id)"
    roles: [RecoveryManager, ComplianceAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: RepossessionAssignment[]
    side_effects: []
  - method: POST
    path: "/atl/repossession-orders/{id}/assign"
    description: "advance a repossession order to ASSIGNED (ORDERED -> ASSIGNED)"
    roles: [RecoveryManager]
    code: 200
    input: []
    output: RepossessionOrder
    side_effects:
      - "RepossessionOrder ORDERED -> ASSIGNED"
  - method: POST
    path: "/atl/repossession-orders/{id}/recover"
    description: "record physical recovery (ASSIGNED -> RECOVERED), setting recovered_at and redemption_deadline"
    roles: [RecoveryManager]
    code: 200
    input: []
    output: RepossessionOrder
    side_effects:
      - "set recovered_at, redemption_deadline (calc redemption_deadline)"
      - "RepossessionOrder ASSIGNED -> RECOVERED"
  - method: POST
    path: "/atl/repossession-orders/{id}/sell"
    description: "sell recovered collateral at auction after grace elapses (RECOVERED -> SOLD); computes deficiency and charges off the loan"
    roles: [RecoveryManager]
    code: 200
    input: [sale_proceeds_cents]
    output: RepossessionOrder
    side_effects:
      - "compute deficiency_cents (calc deficiency_balance)"
      - "Loan OUTSTANDING -> CHARGED_OFF (cascade); lien released"
      - "RepossessionOrder RECOVERED -> SOLD"

  # ---- Device / DeviceCommand ----
  - method: POST
    path: "/atl/devices"
    description: "register a GPS/starter-interrupt device on a vehicle"
    roles: [LoanServicer]
    code: 201
    input: [vehicle_id, serial_number]
    output: Device
    side_effects: []
  - method: GET
    path: "/atl/devices/{id}"
    description: "fetch a device with starter_state and active_disable_count"
    roles: [LoanServicer, RecoveryManager, ComplianceAdmin]
    code: 200
    input: []
    output: Device
    side_effects: []
  - method: POST
    path: "/atl/devices/{id}/commands"
    description: "issue a device command (STARTER_DISABLE / STARTER_ENABLE / LOCATE) within an effective window"
    roles: [LoanServicer]
    code: 201
    input: [command_type, effective_start, effective_end]
    output: DeviceCommand
    side_effects:
      - "STARTER_DISABLE: window-overlap check; Device ENABLED -> DISABLED; active_disable_count += 1"
      - "STARTER_ENABLE: Device DISABLED -> ENABLED; active_disable_count -= 1 (floor 0)"
  - method: GET
    path: "/atl/devices/{id}/commands"
    description: "list commands issued to a device (FK reverse-reachability for DeviceCommand.device_id)"
    roles: [LoanServicer, RecoveryManager, ComplianceAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: DeviceCommand[]
    side_effects: []

  # ---- Test-driving clock ----
  - method: POST
    path: "/_clock/set_current_utc"
    description: "test-driving endpoint: set the server's current UTC clock for time-gated logic (due dates, redemption grace)"
    roles: [ComplianceAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects:
      - "advances/sets the system clock used for due_date comparison, recovered_at, redemption_deadline, payment posted_at, command windows"

# =====================================================================
# §1.6 Error Code Catalog
# =====================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "missing or malformed X-User-Role / X-User-ID headers"
  - id: ERR_FORBIDDEN_ROLE
    http: 403
    condition: "acting role not permitted for the operation"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "approving Underwriter is the same user (X-User-ID) as the Appraiser who finalized the appraisal"
  - id: ERR_NOT_FOUND
    http: 404
    condition: "referenced resource id does not exist"
  - id: ERR_INVALID_REQUEST
    http: 422
    condition: "missing required field, wrong type, or invalid enum member"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "entity not in a state from which the requested transition is defined"
  - id: ERR_STALE_LOAN_VERSION
    http: 412
    condition: "Renewal create's expected_loan_version != current Loan.version"
  - id: ERR_LOAN_NOT_IN_DEFAULT
    http: 409
    condition: "repossession-order action attempted on a loan whose delinquency_status != DEFAULT"
  - id: ERR_LIEN_LOAN_NOT_OUTSTANDING
    http: 409
    condition: "lien filing attempted while the loan's payoff_status != OUTSTANDING"
  - id: ERR_DEVICE_LOAN_NOT_DELINQUENT
    http: 409
    condition: "STARTER_DISABLE issued while the vehicle's loan delinquency_status not in {DELINQUENT, DEFAULT}"
  - id: ERR_APR_CAP_EXCEEDED
    http: 422
    condition: "application effective_apr_bps exceeds the borrower-state max_apr_bps"
  - id: ERR_TERM_OUT_OF_BOUNDS
    http: 422
    condition: "term_months outside [min_term_months, max_term_months]"
  - id: ERR_RENEWAL_LIMIT_REACHED
    http: 409
    condition: "Loan.renewal_count >= RegulatoryProfile.max_renewals at renewal time"
  - id: ERR_REDEMPTION_GRACE_ACTIVE
    http: 409
    condition: "sell attempted before current clock time >= redemption_deadline"
  - id: ERR_COMMAND_WINDOW_OVERLAP
    http: 409
    condition: "STARTER_DISABLE window collides (closed-interval, adjacency counts) with an existing ISSUED STARTER_DISABLE window on the device"
  - id: ERR_ASSIGNMENT_WINDOW_OVERLAP
    http: 409
    condition: "recovery assignment window overlaps another assignment window on the same order (half-open, adjacency allowed)"
  - id: ERR_LTV_EXCEEDED
    http: 422
    condition: "requested_principal_cents exceeds Appraisal.max_principal_cents"
  - id: ERR_INSUFFICIENT_PAYMENT
    http: 422
    condition: "REINSTATEMENT/REDEMPTION payment does not fully cover the computed amount"
  - id: ERR_ACTIVE_REPO_EXISTS
    http: 409
    condition: "repossession-order create attempted while a non-terminal RepossessionOrder already exists for the loan"
  - id: ERR_VALIDATION_RANGE
    http: 422
    condition: "numeric field out of allowed range (negative amount, zero principal, window_end <= window_start)"
  - id: ERR_BORROWER_BARRED
    http: 403
    condition: "application approval attempted for a borrower whose status is BARRED (a prior loan was charged off after sale)"

# =====================================================================
# §1.7 RBAC Matrix
# =====================================================================
roles:
  - name: ComplianceAdmin
    description: "configures regulatory profiles and operates the test clock; read-only over the rest"
    identity: opaque
    exclusive_operations:
      - "POST /atl/regulatory-profiles"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "POST /atl/borrowers"
      - "GET (all read endpoints)"

  - name: Appraiser
    description: "registers vehicles and creates/finalizes appraisals; cannot underwrite"
    identity: opaque
    exclusive_operations:
      - "POST /atl/appraisals"
      - "POST /atl/appraisals/{id}/finalize"
    shared_operations:
      - "POST /atl/vehicles"
      - "GET vehicle/appraisal/borrower reads"

  - name: Underwriter
    description: "submits and approves/rejects applications; segregated from the Appraiser who finalized the appraisal"
    identity: opaque
    exclusive_operations:
      - "POST /atl/applications"
      - "POST /atl/applications/{id}/approve"
      - "POST /atl/applications/{id}/reject"
    shared_operations:
      - "POST /atl/borrowers"
      - "POST /atl/vehicles"
      - "GET application/loan/installment reads"

  - name: LoanServicer
    description: "services live loans: payments, delinquency, default, renewals, devices/commands"
    identity: opaque
    exclusive_operations:
      - "POST /atl/loans/{id}/assess-delinquency"
      - "POST /atl/loans/{id}/declare-default"
      - "POST /atl/loans/{id}/payments"
      - "POST /atl/loans/{id}/renewals"
      - "POST /atl/devices"
      - "POST /atl/devices/{id}/commands"
    shared_operations:
      - "GET loan/installment/payoff-quote/device reads"

  - name: RecoveryManager
    description: "manages repossession orders, assignments, recovery, and sale"
    identity: opaque
    exclusive_operations:
      - "POST /atl/repossession-orders"
      - "POST /atl/repossession-orders/{id}/assignments"
      - "POST /atl/repossession-orders/{id}/assign"
      - "POST /atl/repossession-orders/{id}/recover"
      - "POST /atl/repossession-orders/{id}/sell"
    shared_operations:
      - "GET repossession/loan/device reads"

  - name: TitleClerk
    description: "files title liens; lien release is system-driven on payoff"
    identity: opaque
    exclusive_operations:
      - "POST /atl/title-liens/{id}/file"
    shared_operations:
      - "GET title-lien/loan/vehicle reads"
