            - "Manifest ledger preserved across the cycle: loaded_weight_lbs == 26000 and utilization_pct == 65.0"
            - "OutboundTrailer.${tr_id}.version advanced by reopen (OCC observable)"

  # =====================================================================
  # Rule 4 — transitive_cascade (different triggers, depths)
  # =====================================================================
  - rule_id: transitive_cascade
    instances:
      - name: leg_arrival_delivery_cascade_depth3
        grounds:
          - state_machines.LinehaulLeg.EN_ROUTE_to_ARRIVED
          - state_machines.OutboundTrailer.DISPATCHED_to_ARRIVED
          - state_machines.Shipment.IN_LINEHAUL_to_DELIVERED
        distinguishing_aspect: |
          Depth-3 cascade from the final-leg arrive trigger: leg arrive mutates LinehaulLeg
          (actual_arrival_utc) -> that mutation flips OutboundTrailer DISPATCHED->ARRIVED ->
          the trailer arrival flips every ACTIVE-manifested Shipment IN_LINEHAUL->DELIVERED
          and stamps delivered_at_utc. Each hop is caused by the previous link, not by the
          original arrive call.
        test_recipe:
          setup:
            - "Trailer sealed, one manifested shipment, single leg CHI->ATL EN_ROUTE"
          setup_api_calls:
            - { call: "POST /ltl/terminals", payload: { code: "CHI", name: "Chicago", dock_doors: 12 }, as: TerminalAdmin, captures: { t_chi: $.data.id } }
            - { call: "POST /ltl/terminals", payload: { code: "ATL", name: "Atlanta", dock_doors: 10 }, as: TerminalAdmin, captures: { t_atl: $.data.id } }
            - { call: "POST /ltl/dock-doors", payload: { terminal_id: "${t_chi}", door_number: 25, door_kind: "OUTBOUND" }, as: DockSupervisor, captures: { door_id: $.data.id } }
            - { call: "POST /ltl/trailers", payload: { terminal_id: "${t_chi}", destination_terminal_id: "${t_atl}", outbound_door_id: "${door_id}", max_weight_lbs: 40000, max_cube_cuft: 3500 }, as: DockSupervisor, captures: { tr_id: $.data.id, tr_v0: $.data.version } }
            - { call: "POST /ltl/shipments", payload: { origin_terminal_id: "${t_chi}", destination_terminal_id: "${t_atl}", nmfc_class: "CLASS_60", actual_weight_lbs: 26000, length_in: 96, width_in: 96, height_in: 96, service_standard: "STANDARD" }, as: Dispatcher, captures: { s1: $.data.id } }
            - { call: "POST /ltl/shipments/${s1}/rate", payload: {}, as: RatingClerk }
            - { call: "POST /ltl/pickup-routes", payload: { terminal_id: "${t_chi}", route_date: "2026-08-01", driver_id: "DRV-7", shift_start_minute: 480, shift_end_minute: 1020 }, as: Dispatcher, captures: { r_id: $.data.id } }
            - { call: "POST /ltl/pickup-stops", payload: { route_id: "${r_id}", shipment_id: "${s1}", stop_sequence: 1, planned_arrival_minute: 540 }, as: Dispatcher, captures: { stop1: $.data.id } }
            - { call: "POST /ltl/pickup-routes/${r_id}/dispatch", payload: {}, as: Dispatcher }
            - { call: "POST /ltl/pickup-stops/${stop1}/arrive", payload: {}, as: Dispatcher }
            - { call: "POST /ltl/pickup-stops/${stop1}/complete", payload: {}, as: Dispatcher }
            - { call: "POST /ltl/trailers/${tr_id}/manifest-entries", payload: { shipment_id: "${s1}", load_position: 1, expected_trailer_version: "${tr_v0}" }, as: DockSupervisor }
            - { call: "GET /ltl/trailers/${tr_id}", payload: {}, as: DockSupervisor, captures: { tr_v1: $.data.version } }
            - { call: "POST /ltl/trailers/${tr_id}/mark-ready", payload: {}, as: DockSupervisor }
            - { call: "POST /ltl/trailers/${tr_id}/seal", payload: { expected_trailer_version: "${tr_v1}" }, as: DockSupervisor }
            - { call: "POST /ltl/linehaul-legs", payload: { origin_terminal_id: "${t_chi}", destination_terminal_id: "${t_atl}", trailer_id: "${tr_id}", planned_departure_utc: "2026-08-01T20:00:00Z", planned_arrival_utc: "2026-08-02T08:00:00Z", relay_sequence: 1 }, as: Dispatcher, captures: { leg1: $.data.id } }
            - { call: "POST /ltl/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T20:00:00Z" }, as: TerminalAdmin }
            - { call: "POST /ltl/linehaul-legs/${leg1}/depart", payload: {}, as: Dispatcher }
            - { call: "POST /ltl/_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T08:00:00Z" }, as: TerminalAdmin }
          trigger:
            - { call: "POST /ltl/linehaul-legs/${leg1}/arrive", payload: {}, as: Dispatcher }
          assert:
            - "LinehaulLeg.${leg1}.status == ARRIVED with actual_arrival_utc == 2026-08-02T08:00:00Z (hop 1)"
            - "OutboundTrailer.${tr_id}.posture == ARRIVED (hop 2, caused by leg arrival)"
            - "Shipment.${s1}.handling_status == DELIVERED and delivered_at_utc == 2026-08-02T08:00:00Z (hop 3, caused by trailer arrival)"

      - name: shipment_cancel_stop_skip_cascade_depth2
        grounds:
          - state_machines.Shipment.TENDERED_to_CANCELLED
          - state_machines.PickupStop.PLANNED_to_SKIPPED
        distinguishing_aspect: |
          Depth-2 cascade from the shipment-cancel trigger (different trigger than the
          leg-arrival cascade): cancelling a TENDERED shipment mutates the shipment, and that
          mutation forces every PLANNED PickupStop referencing it to SKIPPED — which in turn
          can bubble the route to COMPLETED when it was the last non-terminal stop (depth 3
          through the route aggregate).
        test_recipe:
          setup:
            - "Route DISPATCHED with two stops; stop A PICKED_UP, stop B (shipment S2) still PLANNED"
          setup_api_calls:
            - { call: "POST /ltl/terminals", payload: { code: "CHI", name: "Chicago", dock_doors: 12 }, as: TerminalAdmin, captures: { t_chi: $.data.id } }
            - { call: "POST /ltl/terminals", payload: { code: "ATL", name: "Atlanta", dock_doors: 10 }, as: TerminalAdmin, captures: { t_atl: $.data.id } }
            - { call: "POST /ltl/shipments", payload: { origin_terminal_id: "${t_chi}", destination_terminal_id: "${t_atl}", nmfc_class: "CLASS_60", actual_weight_lbs: 500, length_in: 48, width_in: 40, height_in: 48, service_standard: "STANDARD" }, as: Dispatcher, captures: { s_a: $.data.id } }
            - { call: "POST /ltl/shipments", payload: { origin_terminal_id: "${t_chi}", destination_terminal_id: "${t_atl}", nmfc_class: "CLASS_60", actual_weight_lbs: 700, length_in: 48, width_in: 40, height_in: 48, service_standard: "STANDARD" }, as: Dispatcher, captures: { s_b: $.data.id } }
            - { call: "POST /ltl/pickup-routes", payload: { terminal_id: "${t_chi}", route_date: "2026-08-01", driver_id: "DRV-7", shift_start_minute: 480, shift_end_minute: 1020 }, as: Dispatcher, captures: { r_id: $.data.id } }
            - { call: "POST /ltl/pickup-stops", payload: { route_id: "${r_id}", shipment_id: "${s_a}", stop_sequence: 1, planned_arrival_minute: 540 }, as: Dispatcher, captures: { stop_a: $.data.id } }
            - { call: "POST /ltl/pickup-stops", payload: { route_id: "${r_id}", shipment_id: "${s_b}", stop_sequence: 2, planned_arrival_minute: 560 }, as: Dispatcher, captures: { stop_b: $.data.id } }
            - { call: "POST /ltl/pickup-routes/${r_id}/dispatch", payload: {}, as: Dispatcher }
            - { call: "POST /ltl/pickup-stops/${stop_a}/arrive", payload: {}, as: Dispatcher }
            - { call: "POST /ltl/pickup-stops/${stop_a}/complete", payload: {}, as: Dispatcher }
          trigger:
            - { call: "POST /ltl/shipments/${s_b}/cancel", payload: {}, as: Dispatcher }
          assert:
            - "Shipment.${s_b}.handling_status == CANCELLED (hop 1)"
            - "PickupStop.${stop_b}.status == SKIPPED (hop 2, caused by the cancel)"
            - "PickupRoute.${r_id}.status == COMPLETED (hop 3, bubble-up once every stop is PICKED_UP or SKIPPED)"

  # =====================================================================
  # Rule 5 — priority_pair_validation_conflict (different category pairs)
  # =====================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: osd_hold_safety_beats_destination_constraint
        grounds:
          - validations[priority=7]
          - validations[priority=8]
        distinguishing_aspect: |
          Category pair business_safety (p7) vs business_constraint (p8): manifest-add on a
          shipment that is BOTH on OS&D hold AND bound for a different destination than the
          trailer MUST return ERR_SHIPMENT_ON_OSD_HOLD — the safety check wins by priority.
        test_recipe:
          setup:
            - "Trailer destination ATL; shipment destination DEN (mismatch) with an OPEN OsdCase (hold)"
            - "Shipment otherwise manifestable: RATED, ON_DOCK"
          setup_api_calls:
            - { call: "POST /ltl/terminals", payload: { code: "CHI", name: "Chicago", dock_doors: 12 }, as: TerminalAdmin, captures: { t_chi: $.data.id } }
            - { call: "POST /ltl/terminals", payload: { code: "ATL", name: "Atlanta", dock_doors: 10 }, as: TerminalAdmin, captures: { t_atl: $.data.id } }
            - { call: "POST /ltl/terminals", payload: { code: "DEN", name: "Denver", dock_doors: 8 }, as: TerminalAdmin, captures: { t_den: $.data.id } }
            - { call: "POST /ltl/dock-doors", payload: { terminal_id: "${t_chi}", door_number: 26, door_kind: "OUTBOUND" }, as: DockSupervisor, captures: { door_id: $.data.id } }
            - { call: "POST /ltl/trailers", payload: { terminal_id: "${t_chi}", destination_terminal_id: "${t_atl}", outbound_door_id: "${door_id}", max_weight_lbs: 40000, max_cube_cuft: 3500 }, as: DockSupervisor, captures: { tr_id: $.data.id, tr_v0: $.data.version } }
            - { call: "POST /ltl/shipments", payload: { origin_terminal_id: "${t_chi}", destination_terminal_id: "${t_den}", nmfc_class: "CLASS_60", actual_weight_lbs: 500, length_in: 48, width_in: 40, height_in: 48, service_standard: "STANDARD" }, as: Dispatcher, captures: { s_id: $.data.id } }
            - { call: "POST /ltl/shipments/${s_id}/rate", payload: {}, as: RatingClerk }
            - { call: "POST /ltl/pickup-routes", payload: { terminal_id: "${t_chi}", route_date: "2026-08-01", driver_id: "DRV-7", shift_start_minute: 480, shift_end_minute: 1020 }, as: Dispatcher, captures: { r_id: $.data.id } }
            - { call: "POST /ltl/pickup-stops", payload: { route_id: "${r_id}", shipment_id: "${s_id}", stop_sequence: 1, planned_arrival_minute: 540 }, as: Dispatcher, captures: { stop1: $.data.id } }
            - { call: "POST /ltl/pickup-routes/${r_id}/dispatch", payload: {}, as: Dispatcher }
            - { call: "POST /ltl/pickup-stops/${stop1}/arrive", payload: {}, as: Dispatcher }
            - { call: "POST /ltl/pickup-stops/${stop1}/complete", payload: {}, as: Dispatcher }
            - { call: "POST /ltl/osd-cases", payload: { shipment_id: "${s_id}", case_kind: "SHORTAGE", claimed_amount_cents: 5000, item_amounts_cents: [5000] }, as: OsdClerk }
          trigger:
            - { call: "POST /ltl/trailers/${tr_id}/manifest-entries", payload: { shipment_id: "${s_id}", load_position: 1, expected_trailer_version: "${tr_v0}" }, as: DockSupervisor, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_SHIPMENT_ON_OSD_HOLD (safety p7 wins over destination constraint p8), NOT ERR_DESTINATION_MISMATCH"
            - "Shipment.${s_id}.handling_status remains ON_DOCK; OutboundTrailer.${tr_id}.version unchanged"

      - name: occ_stale_version_beats_capacity_fiscal
        grounds:
          - validations[priority=6]
          - validations[priority=14]
          - concurrency_rules[trailer-manifest-stale-version]
        distinguishing_aspect: |
          Category pair state/OCC (p6) vs business_fiscal (p14): a manifest-add carrying a
          stale expected_trailer_version AND exceeding the weight cap MUST return
          ERR_STALE_TRAILER_VERSION (412) — the OCC check outranks the fiscal capacity check.
        test_recipe:
          setup:
            - "Trailer (max_weight 1000) at version V after one manifest-add; client holds stale V-1"
            - "Incoming shipment weighs 2000 lbs (would exceed cap if version were fresh)"
          setup_api_calls:
            - { call: "POST /ltl/terminals", payload: { code: "CHI", name: "Chicago", dock_doors: 12 }, as: TerminalAdmin, captures: { t_chi: $.data.id } }
            - { call: "POST /ltl/terminals", payload: { code: "ATL", name: "Atlanta", dock_doors: 10 }, as: TerminalAdmin, captures: { t_atl: $.data.id } }
            - { call: "POST /ltl/dock-doors", payload: { terminal_id: "${t_chi}", door_number: 27, door_kind: "OUTBOUND" }, as: DockSupervisor, captures: { door_id: $.data.id } }
            - { call: "POST /ltl/trailers", payload: { terminal_id: "${t_chi}", destination_terminal_id: "${t_atl}", outbound_door_id: "${door_id}", max_weight_lbs: 1000, max_cube_cuft: 500 }, as: DockSupervisor, captures: { tr_id: $.data.id, tr_v0: $.data.version } }
            - { call: "POST /ltl/shipments", payload: { origin_terminal_id: "${t_chi}", destination_terminal_id: "${t_atl}", nmfc_class: "CLASS_60", actual_weight_lbs: 600, length_in: 48, width_in: 40, height_in: 48, service_standard: "STANDARD" }, as: Dispatcher, captures: { s_a: $.data.id } }
            - { call: "POST /ltl/shipments", payload: { origin_terminal_id: "${t_chi}", destination_terminal_id: "${t_atl}", nmfc_class: "CLASS_60", actual_weight_lbs: 2000, length_in: 48, width_in: 40, height_in: 48, service_standard: "STANDARD" }, as: Dispatcher, captures: { s_b: $.data.id } }
            - { call: "POST /ltl/shipments/${s_a}/rate", payload: {}, as: RatingClerk }
            - { call: "POST /ltl/shipments/${s_b}/rate", payload: {}, as: RatingClerk }
            - { call: "POST /ltl/pickup-routes", payload: { terminal_id: "${t_chi}", route_date: "2026-08-01", driver_id: "DRV-7", shift_start_minute: 480, shift_end_minute: 1020 }, as: Dispatcher, captures: { r_id: $.data.id } }
            - { call: "POST /ltl/pickup-stops", payload: { route_id: "${r_id}", shipment_id: "${s_a}", stop_sequence: 1, planned_arrival_minute: 540 }, as: Dispatcher, captures: { stop_a: $.data.id } }
            - { call: "POST /ltl/pickup-stops", payload: { route_id: "${r_id}", shipment_id: "${s_b}", stop_sequence: 2, planned_arrival_minute: 560 }, as: Dispatcher, captures: { stop_b: $.data.id } }
            - { call: "POST /ltl/pickup-routes/${r_id}/dispatch", payload: {}, as: Dispatcher }
            - { call: "POST /ltl/pickup-stops/${stop_a}/arrive", payload: {}, as: Dispatcher }
            - { call: "POST /ltl/pickup-stops/${stop_a}/complete", payload: {}, as: Dispatcher }
            - { call: "POST /ltl/pickup-stops/${stop_b}/arrive", payload: {}, as: Dispatcher }
            - { call: "POST /ltl/pickup-stops/${stop_b}/complete", payload: {}, as: Dispatcher }
            - { call: "POST /ltl/trailers/${tr_id}/manifest-entries", payload: { shipment_id: "${s_a}", load_position: 1, expected_trailer_version: "${tr_v0}" }, as: DockSupervisor }
          trigger:
            - { call: "POST /ltl/trailers/${tr_id}/manifest-entries", payload: { shipment_id: "${s_b}", load_position: 2, expected_trailer_version: "${tr_v0}" }, as: DockSupervisor, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_STALE_TRAILER_VERSION with HTTP 412 (OCC p6 beats capacity fiscal p14), NOT ERR_TRAILER_OVER_CAPACITY"
            - "OutboundTrailer.${tr_id}.loaded_weight_lbs == 600 (no partial mutation from the rejected write)"

  # =====================================================================
  # Rule 6 — boundary_precision_check (different metrics/endpoints)
  # =====================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: trailer_capacity_exactly_at_cap_allowed
        grounds:
          - validations[priority=14]
          - calculations.trailer_utilization
        distinguishing_aspect: |
          Metric = projected weight, endpoint = manifest-entries: the cap predicate is
          strictly-greater-rejects, so loading to EXACTLY max_weight_lbs (600+400=1000 on a
          1000-lb cap) is accepted, while one pound more (600+401) is rejected with
          ERR_TRAILER_OVER_CAPACITY.
        test_recipe:
          setup:
            - "Trailer max_weight 1000 lbs / max_cube 500 cuft; three rated on-dock shipments of 600, 400, and 401 lbs (all 48x40x48 -> cube 54)"
          setup_api_calls:
            - { call: "POST /ltl/terminals", payload: { code: "CHI", name: "Chicago", dock_doors: 12 }, as: TerminalAdmin, captures: { t_chi: $.data.id } }
            - { call: "POST /ltl/terminals", payload: { code: "ATL", name: "Atlanta", dock_doors: 10 }, as: TerminalAdmin, captures: { t_atl: $.data.id } }
            - { call: "POST /ltl/dock-doors", payload: { terminal_id: "${t_chi}", door_number: 28, door_kind: "OUTBOUND" }, as: DockSupervisor, captures: { door_id: $.data.id } }
            - { call: "POST /ltl/trailers", payload: { terminal_id: "${t_chi}", destination_terminal_id: "${t_atl}", outbound_door_id: "${door_id}", max_weight_lbs: 1000, max_cube_cuft: 500 }, as: DockSupervisor, captures: { tr_id: $.data.id, tr_v0: $.data.version } }
            - { call: "POST /ltl/shipments", payload: { origin_terminal_id: "${t_chi}", destination_terminal_id: "${t_atl}", nmfc_class: "CLASS_60", actual_weight_lbs: 600, length_in: 48, width_in: 40, height_in: 48, service_standard: "STANDARD" }, as: Dispatcher, captures: { s_a: $.data.id } }
            - { call: "POST /ltl/shipments", payload: { origin_terminal_id: "${t_chi}", destination_terminal_id: "${t_atl}", nmfc_class: "CLASS_60", actual_weight_lbs: 400, length_in: 48, width_in: 40, height_in: 48, service_standard: "STANDARD" }, as: Dispatcher, captures: { s_b: $.data.id } }
            - { call: "POST /ltl/shipments", payload: { origin_terminal_id: "${t_chi}", destination_terminal_id: "${t_atl}", nmfc_class: "CLASS_60", actual_weight_lbs: 401, length_in: 48, width_in: 40, height_in: 48, service_standard: "STANDARD" }, as: Dispatcher, captures: { s_c: $.data.id } }
            - { call: "POST /ltl/shipments/${s_a}/rate", payload: {}, as: RatingClerk }
            - { call: "POST /ltl/shipments/${s_b}/rate", payload: {}, as: RatingClerk }
            - { call: "POST /ltl/shipments/${s_c}/rate", payload: {}, as: RatingClerk }
            - { call: "POST /ltl/pickup-routes", payload: { terminal_id: "${t_chi}", route_date: "2026-08-01", driver_id: "DRV-7", shift_start_minute: 480, shift_end_minute: 1020 }, as: Dispatcher, captures: { r_id: $.data.id } }
            - { call: "POST /ltl/pickup-stops", payload: { route_id: "${r_id}", shipment_id: "${s_a}", stop_sequence: 1, planned_arrival_minute: 540 }, as: Dispatcher, captures: { stop_a: $.data.id } }
            - { call: "POST /ltl/pickup-stops", payload: { route_id: "${r_id}", shipment_id: "${s_b}", stop_sequence: 2, planned_arrival_minute: 550 }, as: Dispatcher, captures: { stop_b: $.data.id } }
            - { call: "POST /ltl/pickup-stops", payload: { route_id: "${r_id}", shipment_id: "${s_c}", stop_sequence: 3, planned_arrival_minute: 560 }, as: Dispatcher, captures: { stop_c: $.data.id } }
            - { call: "POST /ltl/pickup-routes/${r_id}/dispatch", payload: {}, as: Dispatcher }
            - { call: "POST /ltl/pickup-stops/${stop_a}/arrive", payload: {}, as: Dispatcher }
            - { call: "POST /ltl/pickup-stops/${stop_a}/complete", payload: {}, as: Dispatcher }
            - { call: "POST /ltl/pickup-stops/${stop_b}/arrive", payload: {}, as: Dispatcher }
            - { call: "POST /ltl/pickup-stops/${stop_b}/complete", payload: {}, as: Dispatcher }
            - { call: "POST /ltl/pickup-stops/${stop_c}/arrive", payload: {}, as: Dispatcher }
            - { call: "POST /ltl/pickup-stops/${stop_c}/complete", payload: {}, as: Dispatcher }
            - { call: "POST /ltl/trailers/${tr_id}/manifest-entries", payload: { shipment_id: "${s_a}", load_position: 1, expected_trailer_version: "${tr_v0}" }, as: DockSupervisor }
            - { call: "GET /ltl/trailers/${tr_id}", payload: {}, as: DockSupervisor, captures: { tr_v1: $.data.version } }
          trigger:
            - { call: "POST /ltl/trailers/${tr_id}/manifest-entries", payload: { shipment_id: "${s_b}", load_position: 2, expected_trailer_version: "${tr_v1}" }, as: DockSupervisor }
            - { call: "GET /ltl/trailers/${tr_id}", payload: {}, as: DockSupervisor, captures: { tr_v2: $.data.version } }
            - { call: "POST /ltl/trailers/${tr_id}/manifest-entries", payload: { shipment_id: "${s_c}", load_position: 3, expected_trailer_version: "${tr_v2}" }, as: DockSupervisor, captures: { err: $.data.error_id } }
          assert:
            - "600+400=1000 == max_weight accepted: OutboundTrailer.${tr_id}.loaded_weight_lbs == 1000 and utilization_pct == 100.0"
            - "Adding 401 lbs on top rejected: ${err} == ERR_TRAILER_OVER_CAPACITY (strictly-greater predicate; the at-cap boundary itself is allowed)"

      - name: mark_ready_empty_manifest_and_utilization_floor
        grounds:
          - validations[priority=19]
          - state_machines.OutboundTrailer.LOADING_to_READY
        distinguishing_aspect: |
          Metric = ACTIVE-manifest-entry count (empty-collection edge), endpoint =
          mark-ready: zero entries is rejected with ERR_TRAILER_NOT_LOADABLE even though the
          utilization floor is vacuous at 0.0; separately the >= 60.0 floor admits exactly
          60.0 (shipment of exactly 24000 lbs on a 40000-lb cap).
        test_recipe:
          setup:
            - "Empty trailer (no manifest entries)"
            - "Second trailer with one 24000-lb shipment on a 40000-lb cap (utilization exactly 60.0)"
          setup_api_calls:
