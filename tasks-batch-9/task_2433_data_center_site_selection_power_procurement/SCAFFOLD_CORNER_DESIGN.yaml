  - section: rbac
    instances:
      - name: exclusive_operations_denied_to_other_roles_and_to_anonymous
        claim_type: Exclusive Operations
        grounds:
          - roles
          - validations[priority=1]
          - validations[priority=2]
        distinguishing_aspect: "Role enforcement runs before every business check: commit called by a SiteScreeningAnalyst on a DRAFT site returns ERR_ROLE_NOT_PERMITTED rather than ERR_SITE_INVALID_STATE, and a call with no X-User-Role at all returns ERR_UNAUTHENTICATED at priority 1 ahead of the role check."
        test_recipe:
          setup:
            - "One DRAFT site under a program, utility and basin; no request in the trigger set carries a permitted role."
          setup_api_calls:
            - call: "POST /siting-programs"
              payload: { name: "Hyperscale Alpha", target_load_mw: 300, required_energization_date: "2029-06-30T00:00:00Z", capital_budget_usd: 60000000 }
              as: PortfolioDirector
              captures: { p_id: $.data.id }
            - call: "POST /utilities"
              payload: { name: "Piedmont Power", state_code: "NC", balancing_authority: "PJM", total_transmission_capacity_mw: 500, interconnect_study_fee_per_mw_usd: 1200, network_upgrade_rate_usd_per_mw: 85000, commissioning_buffer_days: 90, energization_lead_days: 540, queue_policy: "FIRST_COME_FIRST_SERVED" }
              as: PortfolioDirector
              captures: { u_id: $.data.id }
            - call: "POST /water-sources"
              payload: { name: "Yadkin Basin", basin_code: "YAD-03", state_code: "NC", annual_permitted_mgal: 900 }
              as: PermittingAuthority
              captures: { w_id: $.data.id }
            - call: "POST /candidate-sites"
              payload: { program_id: "${p_id}", utility_id: "${u_id}", water_source_id: "${w_id}", name: "Site Alpha", state_code: "NC", county: "Rowan", gross_acres: 300 }
              as: SiteScreeningAnalyst
              captures: { s1_id: $.data.id }
          trigger:
            - call: "POST /candidate-sites/${s1_id}/commit"
              payload: {}
              as: SiteScreeningAnalyst
              as_user_id: "user_analyst_1"
              captures: { e_commit: $.data.error_id }
            - call: "POST /candidate-sites"
              payload: { program_id: "${p_id}", utility_id: "${u_id}", water_source_id: "${w_id}", name: "Site Bravo", state_code: "NC", county: "Davie", gross_acres: 300 }
              as: PortfolioDirector
              captures: { e_create: $.data.error_id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-01-01T00:00:00Z" }
              as: UtilityPlanner
              as_user_id: "${u_id}"
              captures: { e_clock: $.data.error_id }
            - call: "POST /water-sources/${w_id}/drought-declarations"
              payload: { drought_stage: "STAGE_1", effective_date: "2027-03-01T00:00:00Z" }
              as: PortfolioDirector
              captures: { e_drought: $.data.error_id }
            - call: "POST /candidate-sites/${s1_id}/commit"
              payload: {}
              as: "<no X-User-Role header>"
              captures: { e_anon: $.data.error_id }
          assert:
            - "${e_commit} == ERR_ROLE_NOT_PERMITTED with HTTP 403 (not ERR_SITE_INVALID_STATE: priority 2 precedes priority 10)"
            - "${e_create} == ERR_ROLE_NOT_PERMITTED with HTTP 403 and no second CandidateSite row exists"
            - "${e_clock} == ERR_ROLE_NOT_PERMITTED with HTTP 403 and the logical clock is still 2026-08-01T00:00:00Z"
            - "${e_drought} == ERR_ROLE_NOT_PERMITTED with HTTP 403 and WaterSource.${w_id}.drought_stage == NORMAL"
            - "${e_anon} == ERR_UNAUTHENTICATED with HTTP 401 when the X-User-Role header is absent (priority 1 precedes priority 2)"
            - "CandidateSite.${s1_id}.status == DRAFT and version is unchanged by all five calls"

      - name: utility_planner_bound_to_its_own_utility
        claim_type: Exclusive Operations
        grounds:
          - roles[UtilityPlanner].identity
          - validations[priority=3]
          - errors[ERR_UTILITY_IDENTITY_MISMATCH]
        distinguishing_aspect: "UtilityPlanner is entity_backed, so the identity check at priority 3 binds X-User-ID to the Utility owning the addressed resource — and it runs before field validation, so a call from the wrong utility carrying an out-of-range diversity_factor still returns ERR_UTILITY_IDENTITY_MISMATCH rather than ERR_INVALID_REQUEST."
        test_recipe:
          setup:
            - "Two utilities, Piedmont (500 MW) and Catawba (400 MW); Site Alpha is served by Piedmont and its 300 MW application is SUBMITTED at Piedmont."
          setup_api_calls:
