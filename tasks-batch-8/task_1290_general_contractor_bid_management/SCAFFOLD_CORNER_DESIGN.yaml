              as_user_id: "${sub_d}"
            - call: "POST /bid-packages/${pkg}/publish"
              as: LeadEstimator
            - call: "POST /bids"
              payload: { bid_package_id: "${pkg}", base_bid_cents: 1000000, bond_amount_cents: 50000 }
              as: Subcontractor
              as_user_id: "${sub_d}"
              captures: { bid_d: $.data.id }
          trigger:
            - call: "POST /invitations"
              payload: { bid_package_id: "${pkg}", subcontractor_id: "${sub_d}" }
              as: LeadEstimator
              captures: { e_inv: $.data.error_id }
            - call: "POST /bids"
              payload: { bid_package_id: "${pkg}", base_bid_cents: 900000, bond_amount_cents: 50000 }
              as: Subcontractor
              as_user_id: "${sub_d}"
              captures: { e_bid: $.data.error_id }
            - call: "POST /bids/${bid_d}/withdraw"
              as: Subcontractor
