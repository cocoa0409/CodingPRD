# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing or empty"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "the acting role is not permitted for the operation"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "a required input field is absent, or a field fails its declared type or enum constraint"
  - id: ERR_ORGANIZATION_NOT_FOUND
    http: 404
    condition: "no Organization exists with the given id"
  - id: ERR_USER_NOT_FOUND
    http: 404
    condition: "no User exists with the given id"
  - id: ERR_PROPERTY_NOT_FOUND
    http: 404
    condition: "no Property exists with the given id or it is outside the acting analyst's assigned market scope for a scoped operation"
  - id: ERR_ATTRIBUTE_NOT_FOUND
    http: 404
    condition: "no PropertyAttribute exists with the given id, or it does not belong to the Property named in the path"
  - id: ERR_SOURCE_DOCUMENT_NOT_FOUND
    http: 404
    condition: "no SourceDocument exists with the given id, or it does not belong to the Property named in the path"
  - id: ERR_TRANSACTION_NOT_FOUND
    http: 404
    condition: "no SaleTransaction exists with the given id"
  - id: ERR_LISTING_NOT_FOUND
    http: 404
    condition: "no Listing exists with the given id"
  - id: ERR_CONTRACT_NOT_FOUND
    http: 404
    condition: "no LicensingContract exists with the given id"
  - id: ERR_SEAT_NOT_FOUND
    http: 404
    condition: "no LicenseSeat exists with the given id, or it does not belong to the contract named in the path"
  - id: ERR_ENFORCEMENT_CASE_NOT_FOUND
    http: 404
    condition: "no EnforcementCase exists with the given id"
  - id: ERR_PROPERTY_FROZEN
    http: 409
    condition: "the Property's land_posture is FROZEN; attribute proposals, finalize, research/start and subdivision are blocked"
  - id: ERR_PROPERTY_RESTRICTED
    http: 409
    condition: "the Property's land_posture is RESTRICTED; new source-document attachment and attribute proposals are blocked"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "the target resource is not in the state the requested transition requires"
  - id: ERR_EMPTY_ATTRIBUTE_SET
    http: 409
    condition: "finalize attempted on a Property with attribute_total_count == 0"
  - id: ERR_ATTRIBUTES_UNRESOLVED
    http: 409
    condition: "finalize attempted while at least one PropertyAttribute is PENDING"
  - id: ERR_ATTRIBUTE_DUPLICATE_FIELD
    http: 409
    condition: "a PropertyAttribute with the same field_name already exists on the Property"
  - id: ERR_ATTRIBUTE_MARKET_MISMATCH
    http: 422
    condition: "PropertyAttribute.attribute_market does not equal the parent Property's market"
  - id: ERR_ATTRIBUTE_SOURCE_MISMATCH
    http: 422
    condition: "the named source_document_id belongs to a different Property than the attribute"
  - id: ERR_SUBDIVISION_PARENT_INVALID
    http: 422
    condition: "subdivision attempted from a Property whose research_status is not DRAFT"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 409
    condition: "the verifying analyst is the same user who created the attribute"
  - id: ERR_THIRD_PARTY_UNLICENSED
    http: 409
    condition: "a third-party-derived attribute is submitted with third_party_approved == false"
  - id: ERR_UNAUTHORIZED_REDISTRIBUTION
    http: 409
    condition: "a THIRD_PARTY_LICENSED source document is applied to a market outside the acting organization's licensed markets"
  - id: ERR_SOURCE_FUTURE_DATED
    http: 409
    condition: "SourceDocument.obtained_at is later than the logical clock"
  - id: ERR_LEASE_WINDOW_INVALID
    http: 422
    condition: "lease_end is not strictly after lease_start"
  - id: ERR_COMP_TEMPORAL_IMPOSSIBLE
    http: 409
    condition: "the comparable's lease_end precedes the instant it was recorded"
  - id: ERR_SALE_PROPERTY_NOT_RESEARCHED
    http: 422
    condition: "a sale transaction is recorded on a Property whose research_status is not RESEARCHING or VERIFIED"
  - id: ERR_SALE_PRICE_NOT_POSITIVE
    http: 409
    condition: "gross_sale_price_cents is not strictly positive"
  - id: ERR_SUBORDINATION_DEADLINE_PASSED
    http: 409
    condition: "subordination attempted after SaleTransaction.subordination_deadline"
  - id: ERR_SUBSCRIPTION_INACTIVE
    http: 409
    condition: "an operation requires a contract in ACTIVE or GRACE state but the contract is PENDING, RENEWED, LAPSED or TERMINATED"
  - id: ERR_NO_SEATS
    http: 409
    condition: "contract activation attempted with no LicenseSeat rows"
  - id: ERR_SEAT_CAPACITY_EXCEEDED
    http: 409
    condition: "creating a LicenseSeat would exceed the contract's seat_count"
  - id: ERR_SEAT_MARKET_NOT_LICENSED
    http: 409
    condition: "a LicenseSeat.market is absent from the contract's licensed_markets"
  - id: ERR_SEAT_ALREADY_ASSIGNED
    http: 409
    condition: "seat assignment attempted on a LicenseSeat that already has an occupant"
  - id: ERR_USER_INACTIVE
    http: 409
    condition: "the nominated seat occupant has status INACTIVE"
  - id: ERR_USER_OUT_OF_SCOPE
    http: 409
    condition: "the nominated seat occupant belongs to a different organization than the contract's subscriber"
  - id: ERR_MARKET_ALREADY_LICENSED
    http: 409
    condition: "the market is already present in the contract's licensed_markets"
  - id: ERR_AUTO_RENEW_DISABLED
    http: 409
    condition: "renewal attempted on a contract whose auto_renew is false"
  - id: ERR_RENEWAL_LAPSED
    http: 409
    condition: "renewal attempted at or after the contract's renewal_due_at"
  - id: ERR_RENEWAL_TERMINATED
    http: 409
    condition: "renewal attempted after a termination decision was recorded"
  - id: ERR_TERMINATION_WINDOW_CLOSED
    http: 409
    condition: "termination attempted at or after the deadline for the contract's status"
  - id: ERR_FEE_NOT_POSITIVE
    http: 409
    condition: "annual_fee_cents is not strictly positive"
  - id: ERR_SUBSCRIPTION_REACH_EXCEEDED
    http: 409
    condition: "the subscription's market occupy-limit share exceeds the GLOBAL_ALL roll-up share"
  - id: ERR_LISTING_OVERLAP
    http: 409
    condition: "publishing would collide with another PUBLISHED listing of the same property"
  - id: ERR_LITIGATION_NOT_ESCALATABLE
    http: 409
    condition: "escalation attempted on a case that is already a LITIGATION case"
  - id: ERR_LITIGATION_NOT_PERMITTED
    http: 409
    condition: "escalation attempted where the underlying contract's audit_intensity is STANDARD"
  - id: ERR_PENALTY_BELOW_LITIGATION_FLOOR
    http: 409
    condition: "penalty_cents is below LITIGATION_PENALTY_THRESHOLD_CENTS"
  - id: ERR_SETTLEMENT_INSUFFICIENT
    http: 409
    condition: "the settlement offer is below the case's penalty_cents"
  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_<parent>_version does not equal the parent's current version"
  - id: ERR_EMPTY_INDEX_SET
    http: 409
    condition: "an index run's refined comparable set is empty"

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Marketplace operator identity spanning research, licensing and enforcement operations; the only role permitted to create base organizations, set the logical clock and run the periodic research cycle."
    identity: opaque
    exclusive_operations:
      - "POST /organizations"
      - "POST /_clock/set_current_utc"
      - "POST /run_research_cycle"
    shared_operations:
      - "GET /organizations/{organizationId}"
      - "GET /organizations/{organizationId}/users"
      - "POST /organizations/{organizationId}/users"
      - "GET /users/{userId}"
      - "GET /properties/{propertyId}/subdivisions"
      - "POST /licensing-contracts"
      - "GET /licensing-contracts"
      - "GET /licensing-contracts/{contractId}"
      - "GET /licensing-contracts/{contractId}/seats"
      - "POST /seats/{seatId}/usage-events"
      - "GET /seats/{seatId}/usage-events"
      - "GET /enforcement-cases"

  - name: ResearchAnalyst
    description: "Field researcher and analyst in a data-provider organization. Entity-backed: X-User-ID equals the id of a User row whose role is RESEARCH_ANALYST, so the defined-address territory check (Property.market equals the acting User.assigned_market) is resolvable."
    identity: entity_backed:User
    exclusive_operations:
      - "POST /properties/{propertyId}/research/start"
      - "POST /properties/{propertyId}/finalize"
