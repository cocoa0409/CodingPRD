            - "trigger[1]: HTTP 409, data.error_id == 'ERR_ACTIVE_DETERMINATION_EXISTS' — blocked while DRAFT"
            - "trigger[2]: HTTP 200, status == 'PREPARED'"
            - "trigger[4]: HTTP 409, data.error_id == 'ERR_ACTIVE_DETERMINATION_EXISTS' — blocked while PREPARED, and the freshly re-read version rules out a 412"
            - "trigger[5]: HTTP 200, status == 'UNDER_REVIEW'"
            - "trigger[7]: HTTP 409, data.error_id == 'ERR_ACTIVE_DETERMINATION_EXISTS' — blocked while UNDER_REVIEW"
            - "trigger[8]: 1 row, total_count == 1 — the three refused creates left exactly one determination"

      - name: insured_subrogation_cannot_be_declared_after_a_general_unsecured_round_settles
        claim_type: error_triggerable
        grounds:
          - errors[ERR_PRIORITY_CLASS_OUT_OF_ORDER]
          - validations[priority=74]
          - calculations.dividend_waterfall_allocation.input_set
        distinguishing_aspect: "Priority classes must be paid in order, and the guard keys on the GENERAL_UNSECURED round having reached SETTLED — so the insurer's subrogated round is declarable before that point, refused afterwards with ERR_PRIORITY_CLASS_OUT_OF_ORDER (409), while further GENERAL_UNSECURED rounds remain declarable."
        test_recipe:
          setup:
            - "Institution 61078 is CLOSED_IN_RECEIVERSHIP with depositor Ursula (SINGLE 30000000, CERTIFIED): aggregate_insured_cents 25000000, certificate face 5000000 in status ISSUED."
            - "one proceeds row (gross 10000000, expense 0) gives receivership_cash_cents 10000000."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
