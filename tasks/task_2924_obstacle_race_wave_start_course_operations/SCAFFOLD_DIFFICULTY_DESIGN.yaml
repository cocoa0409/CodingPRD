              payload: { decision: "APPROVED", decision_note: "Approved as filed" }
              as: PermitOfficer
              as_user_id: "officer-1"
            - call: "POST /ocr/venues/${venue_id}/festival-services"
              payload: { service_type: "SPECTATOR_ZONE", footprint_sqm: 4500, capacity: 3000 }
              as: SiteOpsLead
            - call: "POST /ocr/venues/${venue_id}/restoration-tasks"
              payload: { task_type: "RESEED", area_sqm: 1500 }
              as: PermitOfficer
              captures: { task1_id: $.data.id }
            - call: "POST /ocr/venues/${venue_id}/restoration-tasks"
              payload: { task_type: "DECOMPACT", area_sqm: 1500 }
              as: PermitOfficer
