              as: SystemAdmin
              captures: { batchA: $.data.created_event_count }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-05T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /_events/alert-firings"
              payload: { alert_id: "${al_id}", fired_at_start: "2026-11-01T00:00:00Z", interval_seconds: 3600, fire_count: 5, override_count: 5, distinct_clinician_count: 3, override_reason_code: "ECG_PENDING" }
              as: SystemAdmin
              captures: { batchB: $.data.created_event_count }
            - call: "GET /cds/alerts/${al_id}"
              as: CommitteeChair
              as_user_id: "${chair_id}"
              captures: { v1: $.data.version, life_0: $.data.lifetime_fire_count, win_0: $.data.windowed_fire_count, unwin_0: $.data.unwindowed_fire_count, idx_0: $.data.latest_burden_index }
            - call: "POST /cds/alerts/${al_id}/burden-windows"
              payload: { expected_alert_version: "${v1}", window_start: "2026-09-01T00:00:00Z", window_end: "2026-10-01T00:00:00Z" }
              as: SystemAdmin
              captures: { win_id: $.data.id, win_state_0: $.data.state }
          trigger:
            - call: "POST /cds/alerts/${al_id}/burden-windows/${win_id}/close"
              payload: { closure_reason: "MONITORING_PERIOD_ENDED" }
              as: SystemAdmin
              captures: { w_fires_1: $.data.fire_count, w_overrides_1: $.data.override_count, w_index_1: $.data.burden_index, w_class_1: $.data.burden_classification }
            - call: "GET /cds/alerts/${al_id}"
              as: CommitteeChair
              as_user_id: "${chair_id}"
              captures: { life_1: $.data.lifetime_fire_count, win_1: $.data.windowed_fire_count, unwin_1: $.data.unwindowed_fire_count, idx_1: $.data.latest_burden_index, class_1: $.data.latest_burden_classification, lifeovr_1: $.data.lifetime_override_count }
            - call: "POST /cds/alerts/${al_id}/burden-windows/${win_id}/reopen"
              payload: { reopen_reason: "Interface backfill under investigation" }
              as: SystemAdmin
              captures: { w_state_2: $.data.state, w_fires_2: $.data.fire_count, w_index_2: $.data.burden_index, w_class_2: $.data.burden_classification, w_closed_at_2: $.data.closed_at, w_reopen_count: $.data.reopen_count }
            - call: "GET /cds/alerts/${al_id}"
              as: CommitteeChair
              as_user_id: "${chair_id}"
              captures: { life_2: $.data.lifetime_fire_count, win_2: $.data.windowed_fire_count, unwin_2: $.data.unwindowed_fire_count, idx_2: $.data.latest_burden_index, class_2: $.data.latest_burden_classification }
            - call: "POST /cds/alerts/${al_id}/burden-windows/${win_id}/close"
              payload: { closure_reason: "MONITORING_PERIOD_ENDED" }
              as: SystemAdmin
              captures: { w_fires_3: $.data.fire_count, w_overrides_3: $.data.override_count, w_index_3: $.data.burden_index, w_class_3: $.data.burden_classification, w_reopen_count_3: $.data.reopen_count }
            - call: "GET /cds/alerts/${al_id}"
              as: CommitteeChair
              as_user_id: "${chair_id}"
              captures: { life_3: $.data.lifetime_fire_count, win_3: $.data.windowed_fire_count, unwin_3: $.data.unwindowed_fire_count, idx_3: $.data.latest_burden_index, class_3: $.data.latest_burden_classification }
          assert:
            - "${batchA} == 40 and ${batchB} == 5"
            - "${life_0} == 45, ${win_0} == 0, ${unwin_0} == 45, ${idx_0} == null and ${win_state_0} == OPEN — checkpoint 0: 45 == 0 + 45"
            - "${w_fires_1} == 40, ${w_overrides_1} == 36, ${w_index_1} == 72.00, ${w_class_1} == LOW_VALUE — the five November firings are excluded by the half-open filter"
            - "${life_1} == 45, ${win_1} == 40, ${unwin_1} == 5 — checkpoint 1: 45 == 40 + 5, the close SHIFTED the partition and did not create or destroy firings"
            - "${idx_1} == 72.00 and ${class_1} == LOW_VALUE and ${lifeovr_1} == 41 (36 in-window plus 5 out-of-window overrides, a ledger that windows never touch)"
            - "${w_state_2} == OPEN, ${w_fires_2} == 0, ${w_index_2} == null, ${w_class_2} == null, ${w_closed_at_2} == null, ${w_reopen_count} == 1 — the compensation wipes every derived field on the window"
            - "${life_2} == 45, ${win_2} == 0, ${unwin_2} == 45 — checkpoint 2: 45 == 0 + 45, byte-identical to checkpoint 0; exactly the 40 that moved out moved back"
            - "${idx_2} == null and ${class_2} == null — with no CLOSED or FINALIZED window left, the alert's latest-burden mirrors are nulled rather than left stale at 72.00"
            - "${w_fires_3} == 40, ${w_overrides_3} == 36, ${w_index_3} == 72.00, ${w_class_3} == LOW_VALUE, ${w_reopen_count_3} == 1 — the recomputation is deterministic and reopen_count is NOT reset by the second close"
            - "${life_3} == 45, ${win_3} == 40, ${unwin_3} == 5, ${idx_3} == 72.00, ${class_3} == LOW_VALUE — checkpoint 3 equals checkpoint 1 exactly; a full close / reopen / close round trip leaves zero drift in any of the three ledger fields"
            - "lifetime_fire_count is 45 at all four checkpoints: no window transition may ever alter it, because it is defined directly over OverrideEvent rows"
