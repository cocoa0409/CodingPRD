            - "unfiltered GET /ops/storm-events/${se}/units returns total_count == 2"

      - name: fk_reverse_reachability_collections_all_resolve
        claim_type: Standard CRUD
        grounds:
          - endpoints.GET_/ops/units/{unitId}/condition-reports
          - endpoints.GET_/ops/units/{unitId}/crew-members
          - endpoints.GET_/ops/assets/{assetId}/allocations
          - endpoints.GET_/ops/units/{unitId}/lodging-bookings
        distinguishing_aspect: "Every FK declared in §1.1 is discoverable through its reverse GET: condition-reports, crew-members and lodging-bookings nest under the unit, allocations nest under the asset, and empty relationships return total_count 0 rather than 404."
        test_recipe:
          setup: ["Clock 2026-09-10T08:00:00Z. Storm with U1 (one report) and U2 (no reports); one member M with home_unit_id U1 and no assignments; one asset with home_unit_id U1 and no allocations."]
          setup_api_calls:
            - call: "POST /ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-10T08:00:00Z" }
              as: CommandCenterAdmin
            - call: "POST /ops/storm-events"
              payload: { name: "Hurricane Delta" }
              as: CommandCenterAdmin
              captures: { se: $.data.id }
            - call: "POST /ops/storm-events/${se}/units"
