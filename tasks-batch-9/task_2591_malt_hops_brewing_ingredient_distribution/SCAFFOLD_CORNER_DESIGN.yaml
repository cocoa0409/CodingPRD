              captures: { af_plain_score: $.data.match_score, af_plain_floor: $.data.applicable_diastatic_power_floor, af_plain_fail: $.data.hard_fail_reason }
            - call: "GET /malt-lots/${af_lot_id}/spec-match"
              payload: { recipe_id: "${af_adjunct_recipe_id}" }
              as: Brewer
              as_user_id: "${af_id}"
