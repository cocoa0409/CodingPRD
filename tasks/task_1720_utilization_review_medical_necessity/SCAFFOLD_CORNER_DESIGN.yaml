# Section 1.9: Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Enumerative breadth coverage of every testable claim in SCAFFOLD.yaml section 1.1-1.7
# that SCAFFOLD_DIFFICULTY_DESIGN.yaml does not already cover.
scaffold_corner_design:
  - section: entities
    instances:
      - name: physician_is_advisor_defaults_false
        claim_type: defaults
        grounds: [entities.Physician.fields.is_advisor]
        distinguishing_aspect: "Omitting the optional is_advisor field yields false on the created Physician."
        test_recipe:
          setup: ["URDirector available"]
          setup_api_calls:
            - call: "POST /api/physicians"
              payload: { full_name: "Dr. Plain", specialty: "Family Medicine" }
              as: URDirector
              captures: { dr_plain: $.data.id }
          trigger:
            - call: "GET /api/physicians/${dr_plain}"
              as: URNurse
          assert:
            - "Physician.${dr_plain}.is_advisor == false"
            - "Physician.${dr_plain}.version == 1"
      - name: utilization_case_create_computed_and_system_fields
        claim_type: computed_fields
        grounds: [entities.UtilizationCase]
        distinguishing_aspect: "Case creation returns server-minted id, version 1, computed expected_midnight_count 2, PROVISIONAL basis, initial axes, and current_admission_status copied from the order."
        test_recipe:
          setup: ["Medicare payer and attending exist"]
          setup_api_calls:
            - call: "POST /api/payers"
              payload: { name: "Medicare FFS", plan_class: "MEDICARE", requires_inpatient_auth: true, concurrent_review_cadence_hours: 48, p2p_window_hours: 72, appeal_deadline_days: 60, bed_day_budget_per_case: 30, avoidable_attribution_method: "FIRST_CAUSE" }
              as: URDirector
              captures: { pay_med: $.data.id }
            - call: "POST /api/physicians"
              payload: { full_name: "Dr. Attend", specialty: "Internal Medicine", is_advisor: false }
              as: URDirector
              captures: { dr_att: $.data.id }
          trigger:
            - call: "POST /api/utilization-cases"
              payload: { patient_mrn: "MRN-ENT", payer_id: "${pay_med}", attending_physician_id: "${dr_att}", admit_at: "2026-08-01T08:00:00Z", expected_discharge_at: "2026-08-03T10:00:00Z", requested_admission_status: "INPATIENT" }
              as: URNurse
              captures: { case_id: $.data.id }
          assert:
            - "UtilizationCase.${case_id}.version == 1 and id is a server-minted UUID"
            - "expected_midnight_count == 2, two_midnight_benchmark_met == MET, benchmark_basis == PROVISIONAL, actual_midnight_count is null, discharge_at is null"
            - "review_status == INTAKE, auth_status == AUTH_PENDING, current_admission_status == INPATIENT"
            - "certified_day_count == 0 and open_avoidable_day_count == 0 and escalation_tier == 0"
      - name: case_create_computed_field_input_rejected
        claim_type: system_fields
        grounds: [entities.UtilizationCase.fields.two_midnight_benchmark_met, "validations[priority=3]"]
        distinguishing_aspect: "Client-supplied computed/system fields in the create body are rejected, not silently ignored."
        test_recipe:
          setup: ["Medicare payer and attending exist"]
          setup_api_calls:
            - call: "POST /api/payers"
              payload: { name: "Medicare FFS", plan_class: "MEDICARE", requires_inpatient_auth: true, concurrent_review_cadence_hours: 48, p2p_window_hours: 72, appeal_deadline_days: 60, bed_day_budget_per_case: 30, avoidable_attribution_method: "FIRST_CAUSE" }
              as: URDirector
              captures: { pay_med: $.data.id }
            - call: "POST /api/physicians"
              payload: { full_name: "Dr. Attend", specialty: "Internal Medicine", is_advisor: false }
              as: URDirector
              captures: { dr_att: $.data.id }
          trigger:
            - call: "POST /api/utilization-cases"
              payload: { patient_mrn: "MRN-SYS", payer_id: "${pay_med}", attending_physician_id: "${dr_att}", admit_at: "2026-08-01T08:00:00Z", expected_discharge_at: "2026-08-03T10:00:00Z", requested_admission_status: "INPATIENT", two_midnight_benchmark_met: "MET" }
              as: URNurse
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_VALIDATION_FAILED with http 400"
      - name: list_payers_pagination_envelope
        claim_type: listing
        grounds: [response_envelope, endpoints]
        distinguishing_aspect: "List responses carry the fixed envelope: meta block, response_type array, and pagination fields with defaults."
        test_recipe:
          setup: ["two payers created"]
          setup_api_calls:
            - call: "POST /api/payers"
              payload: { name: "Payer One", plan_class: "MEDICARE", requires_inpatient_auth: true, concurrent_review_cadence_hours: 48, p2p_window_hours: 72, appeal_deadline_days: 60, bed_day_budget_per_case: 30, avoidable_attribution_method: "FIRST_CAUSE" }
              as: URDirector
            - call: "POST /api/payers"
              payload: { name: "Payer Two", plan_class: "COMMERCIAL", requires_inpatient_auth: false, concurrent_review_cadence_hours: 24, p2p_window_hours: 48, appeal_deadline_days: 30, bed_day_budget_per_case: 10, avoidable_attribution_method: "DOMINANT_CAUSE" }
              as: URDirector
          trigger:
            - call: "GET /api/payers"
              as: CaseManager
          assert:
            - "response envelope: meta.api_request_id and meta.api_request_timestamp present; response_type == array"
            - "pagination block: limit == 10 (default), offset == 0, total_count == 2, has_more == false"
      - name: get_case_missing_id_returns_not_found
        claim_type: not_found
        grounds: ["errors[ERR_NOT_FOUND]", "validations[priority=4]"]
        distinguishing_aspect: "A well-formed but nonexistent UUID path id yields the 404 catalog error."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "GET /api/utilization-cases/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              as: URNurse
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_NOT_FOUND with http 404 and response_type == error"
      - name: audit_event_has_no_version_field
        claim_type: immutability
        grounds: [entities.AuditEvent]
        distinguishing_aspect: "AuditEvent is append-only (common_fields false): rows expose id and created_at but no version or updated_at, and no update endpoint exists."
        test_recipe:
          setup: ["one case created (emits CASE_OPENED)"]
          setup_api_calls:
            - call: "POST /api/payers"
              payload: { name: "Medicare FFS", plan_class: "MEDICARE", requires_inpatient_auth: true, concurrent_review_cadence_hours: 48, p2p_window_hours: 72, appeal_deadline_days: 60, bed_day_budget_per_case: 30, avoidable_attribution_method: "FIRST_CAUSE" }
              as: URDirector
              captures: { pay_med: $.data.id }
            - call: "POST /api/physicians"
              payload: { full_name: "Dr. Attend", specialty: "Internal Medicine", is_advisor: false }
              as: URDirector
              captures: { dr_att: $.data.id }
            - call: "POST /api/utilization-cases"
              payload: { patient_mrn: "MRN-AUD", payer_id: "${pay_med}", attending_physician_id: "${dr_att}", admit_at: "2026-08-01T08:00:00Z", expected_discharge_at: "2026-08-03T10:00:00Z", requested_admission_status: "INPATIENT" }
              as: URNurse
              captures: { case_id: $.data.id }
          trigger:
            - call: "GET /api/utilization-cases/${case_id}/audit-events"
              as: URDirector
          assert:
            - "exactly one AuditEvent with event_type == CASE_OPENED, actor_role == URNurse"
            - "the event object has id and created_at fields and neither version nor updated_at"
      - name: admission_review_child_listing_under_case
        claim_type: parent_relationships
        grounds: [entities.AdmissionReview.fields.case_id, endpoints]
        distinguishing_aspect: "The sub-resource GET returns exactly the reviews belonging to the named case (FK scoping, array shape)."
        test_recipe:
          setup: ["one case with one DRAFT review"]
          setup_api_calls:
            - call: "POST /api/payers"
              payload: { name: "Medicare FFS", plan_class: "MEDICARE", requires_inpatient_auth: true, concurrent_review_cadence_hours: 48, p2p_window_hours: 72, appeal_deadline_days: 60, bed_day_budget_per_case: 30, avoidable_attribution_method: "FIRST_CAUSE" }
              as: URDirector
              captures: { pay_med: $.data.id }
            - call: "POST /api/physicians"
              payload: { full_name: "Dr. Attend", specialty: "Internal Medicine", is_advisor: false }
              as: URDirector
              captures: { dr_att: $.data.id }
            - call: "POST /api/utilization-cases"
              payload: { patient_mrn: "MRN-PAR", payer_id: "${pay_med}", attending_physician_id: "${dr_att}", admit_at: "2026-08-01T08:00:00Z", expected_discharge_at: "2026-08-03T10:00:00Z", requested_admission_status: "INPATIENT" }
              as: URNurse
              captures: { case_id: $.data.id }
            - call: "POST /api/utilization-cases/${case_id}/admission-reviews"
              payload: { criteria_set: "MCG", severity_of_illness_points: 4, intensity_of_service_points: 4, comorbidity_count: 1, two_midnight_attestation: false }
              as: URNurse
              captures: { rev_id: $.data.id }
          trigger:
            - call: "GET /api/utilization-cases/${case_id}/admission-reviews"
              as: PayerReviewer
          assert:
            - "list contains exactly one AdmissionReview with id == ${rev_id} and case_id == ${case_id}"

  - section: state_machines
    instances:
      - name: admission_review_initial_state_draft
        claim_type: initial_state
        grounds: [state_machines.AdmissionReview]
        distinguishing_aspect: "A newly created review is DRAFT with determination PENDING and null computed fields."
        test_recipe:
          setup: ["case exists"]
          setup_api_calls:
            - call: "POST /api/payers"
              payload: { name: "Medicare FFS", plan_class: "MEDICARE", requires_inpatient_auth: true, concurrent_review_cadence_hours: 48, p2p_window_hours: 72, appeal_deadline_days: 60, bed_day_budget_per_case: 30, avoidable_attribution_method: "FIRST_CAUSE" }
              as: URDirector
              captures: { pay_med: $.data.id }
            - call: "POST /api/physicians"
              payload: { full_name: "Dr. Attend", specialty: "Internal Medicine", is_advisor: false }
              as: URDirector
              captures: { dr_att: $.data.id }
            - call: "POST /api/utilization-cases"
              payload: { patient_mrn: "MRN-INIT", payer_id: "${pay_med}", attending_physician_id: "${dr_att}", admit_at: "2026-08-01T08:00:00Z", expected_discharge_at: "2026-08-03T10:00:00Z", requested_admission_status: "INPATIENT" }
              as: URNurse
              captures: { case_id: $.data.id }
          trigger:
            - call: "POST /api/utilization-cases/${case_id}/admission-reviews"
              payload: { criteria_set: "INTERQUAL", severity_of_illness_points: 9, intensity_of_service_points: 7, comorbidity_count: 1, two_midnight_attestation: true }
              as: URNurse
              captures: { rev_id: $.data.id }
          assert:
            - "AdmissionReview.${rev_id}.status == DRAFT and determination == PENDING and necessity_score is null and submitted_at is null"
      - name: payer_decision_pend_from_approved_rejected
        claim_type: invalid_transition
        grounds: [state_machines.AuthorizationRequest, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "APPROVED is not a listed from-state for PEND: deciding PEND on an approved request fails with ERR_INVALID_STATE."
        test_recipe:
          setup: ["case with an APPROVED authorization (interval [1,4))"]
          setup_api_calls:
            - call: "POST /api/payers"
              payload: { name: "Medicare FFS", plan_class: "MEDICARE", requires_inpatient_auth: true, concurrent_review_cadence_hours: 48, p2p_window_hours: 72, appeal_deadline_days: 60, bed_day_budget_per_case: 30, avoidable_attribution_method: "FIRST_CAUSE" }
              as: URDirector
              captures: { pay_med: $.data.id }
            - call: "POST /api/physicians"
              payload: { full_name: "Dr. Attend", specialty: "Internal Medicine", is_advisor: false }
              as: URDirector
              captures: { dr_att: $.data.id }
            - call: "POST /api/utilization-cases"
              payload: { patient_mrn: "MRN-INV", payer_id: "${pay_med}", attending_physician_id: "${dr_att}", admit_at: "2026-08-01T08:00:00Z", expected_discharge_at: "2026-08-03T10:00:00Z", requested_admission_status: "INPATIENT" }
              as: URNurse
              captures: { case_id: $.data.id, case_v: $.data.version }
            - call: "POST /api/utilization-cases/${case_id}/authorization-requests"
              payload: { level_of_care: "INPATIENT", requested_day_count: 3, clinical_summary: "Patient with acute decompensated heart failure requiring IV diuresis.", expected_case_version: "${case_v}" }
              as: URNurse
              captures: { auth_id: $.data.id }
            - call: "POST /api/authorization-requests/${auth_id}/payer-decision"
              payload: { decision: "APPROVE", certified_day_start: 1, certified_day_count: 3 }
              as: PayerReviewer
          trigger:
            - call: "POST /api/authorization-requests/${auth_id}/payer-decision"
              payload: { decision: "PEND", pend_reason: "late pend attempt" }
              as: PayerReviewer
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE with http 409; AuthorizationRequest.${auth_id}.status remains APPROVED"
      - name: discharge_terminal_lockdown
        claim_type: terminal_state_lockdown
        grounds: [state_machines.UtilizationCase, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "From CLOSED no transition exists: a second discharge is rejected."
        test_recipe:
          setup: ["case discharged once"]
          setup_api_calls:
            - call: "POST /api/payers"
              payload: { name: "Medicare FFS", plan_class: "MEDICARE", requires_inpatient_auth: true, concurrent_review_cadence_hours: 48, p2p_window_hours: 72, appeal_deadline_days: 60, bed_day_budget_per_case: 30, avoidable_attribution_method: "FIRST_CAUSE" }
              as: URDirector
              captures: { pay_med: $.data.id }
            - call: "POST /api/physicians"
              payload: { full_name: "Dr. Attend", specialty: "Internal Medicine", is_advisor: false }
              as: URDirector
              captures: { dr_att: $.data.id }
            - call: "POST /api/utilization-cases"
              payload: { patient_mrn: "MRN-TERM", payer_id: "${pay_med}", attending_physician_id: "${dr_att}", admit_at: "2026-08-01T08:00:00Z", expected_discharge_at: "2026-08-03T10:00:00Z", requested_admission_status: "INPATIENT" }
              as: URNurse
              captures: { case_id: $.data.id }
            - call: "POST /api/utilization-cases/${case_id}/discharge"
              payload: { discharge_at: "2026-08-03T09:00:00Z" }
              as: URNurse
          trigger:
            - call: "POST /api/utilization-cases/${case_id}/discharge"
              payload: { discharge_at: "2026-08-03T09:00:00Z" }
              as: URNurse
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE with http 409; review_status remains CLOSED"
      - name: advisor_review_requires_not_met_determination
        claim_type: precondition_enforcement
        grounds: [state_machines.AdmissionReview.SUBMITTED_to_ADVISOR_REVIEWED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Advisor review of a CRITERIA_MET review is a from-state violation (the machine only allows it after CRITERIA_NOT_MET)."
        test_recipe:
          setup: ["submitted review scoring 98 (CRITERIA_MET)"]
          setup_api_calls:
            - call: "POST /api/payers"
              payload: { name: "Medicare FFS", plan_class: "MEDICARE", requires_inpatient_auth: true, concurrent_review_cadence_hours: 48, p2p_window_hours: 72, appeal_deadline_days: 60, bed_day_budget_per_case: 30, avoidable_attribution_method: "FIRST_CAUSE" }
              as: URDirector
              captures: { pay_med: $.data.id }
            - call: "POST /api/physicians"
              payload: { full_name: "Dr. Attend", specialty: "Internal Medicine", is_advisor: false }
              as: URDirector
              captures: { dr_att: $.data.id }
            - call: "POST /api/physicians"
              payload: { full_name: "Dr. Advisor", specialty: "Utilization Medicine", is_advisor: true }
              as: URDirector
              captures: { dr_adv: $.data.id }
            - call: "POST /api/utilization-cases"
              payload: { patient_mrn: "MRN-ADV", payer_id: "${pay_med}", attending_physician_id: "${dr_att}", admit_at: "2026-08-01T08:00:00Z", expected_discharge_at: "2026-08-03T10:00:00Z", requested_admission_status: "INPATIENT" }
              as: URNurse
              captures: { case_id: $.data.id }
            - call: "POST /api/utilization-cases/${case_id}/admission-reviews"
              payload: { criteria_set: "INTERQUAL", severity_of_illness_points: 10, intensity_of_service_points: 8, comorbidity_count: 2, two_midnight_attestation: true }
              as: URNurse
              captures: { rev_id: $.data.id }
            - call: "POST /api/admission-reviews/${rev_id}/submit"
              payload: {}
              as: URNurse
          trigger:
            - call: "POST /api/admission-reviews/${rev_id}/advisor-review"
              payload: { advisor_decision: "REVERSE" }
              as: PhysicianAdvisor
              as_user_id: "${dr_adv}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE with http 409; determination remains CRITERIA_MET"
      - name: advisor_reverse_rewrites_determination
        claim_type: side_effect_execution
        grounds: [state_machines.AdmissionReview.SUBMITTED_to_ADVISOR_REVIEWED]
        distinguishing_aspect: "A REVERSE advisor decision on a NOT_MET review rewrites determination to CRITERIA_MET and recomputes recommended_status."
        test_recipe:
          setup: ["submitted review scoring 20 (CRITERIA_NOT_MET, recommended OBSERVATION); benchmark MET (expected 2026-08-03)"]
          setup_api_calls:
            - call: "POST /api/payers"
              payload: { name: "Medicare FFS", plan_class: "MEDICARE", requires_inpatient_auth: true, concurrent_review_cadence_hours: 48, p2p_window_hours: 72, appeal_deadline_days: 60, bed_day_budget_per_case: 30, avoidable_attribution_method: "FIRST_CAUSE" }
              as: URDirector
              captures: { pay_med: $.data.id }
            - call: "POST /api/physicians"
              payload: { full_name: "Dr. Attend", specialty: "Internal Medicine", is_advisor: false }
              as: URDirector
              captures: { dr_att: $.data.id }
            - call: "POST /api/physicians"
              payload: { full_name: "Dr. Advisor", specialty: "Utilization Medicine", is_advisor: true }
              as: URDirector
              captures: { dr_adv: $.data.id }
            - call: "POST /api/utilization-cases"
              payload: { patient_mrn: "MRN-REV", payer_id: "${pay_med}", attending_physician_id: "${dr_att}", admit_at: "2026-08-01T08:00:00Z", expected_discharge_at: "2026-08-03T10:00:00Z", requested_admission_status: "INPATIENT" }
              as: URNurse
              captures: { case_id: $.data.id }
            - call: "POST /api/utilization-cases/${case_id}/admission-reviews"
              payload: { criteria_set: "INTERQUAL", severity_of_illness_points: 2, intensity_of_service_points: 2, comorbidity_count: 0, two_midnight_attestation: false }
              as: URNurse
              captures: { rev_id: $.data.id }
            - call: "POST /api/admission-reviews/${rev_id}/submit"
              payload: {}
              as: URNurse
          trigger:
            - call: "POST /api/admission-reviews/${rev_id}/advisor-review"
              payload: { advisor_decision: "REVERSE", advisor_note: "Severity understated by initial screen" }
              as: PhysicianAdvisor
              as_user_id: "${dr_adv}"
          assert:
            - "AdmissionReview.${rev_id}.status == ADVISOR_REVIEWED and determination == CRITERIA_MET"
            - "recommended_status recomputed: with benchmark MET the reversal moves recommended_status from OBSERVATION to INPATIENT"
      - name: p2p_complete_overturn_restores_auth
        claim_type: side_effect_execution
        grounds: [state_machines.PeerToPeerConference.SCHEDULED_to_COMPLETED, state_machines.AuthorizationRequest.DENIED_to_APPROVED]
        distinguishing_aspect: "The OVERTURNED outcome executes the full restore chain: auth DENIED -> APPROVED with frontier-appended certified interval, denial RESOLVED_OVERTURNED, case auth axis back to AUTHORIZED."
        test_recipe:
          setup:
            - "Medicare case; authorization for 3 days denied at 2026-08-02T12:00:00Z; conference scheduled 2026-08-03T10:00-10:30"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T12:00:00Z" }
              as: URDirector
            - call: "POST /api/payers"
              payload: { name: "Medicare FFS", plan_class: "MEDICARE", requires_inpatient_auth: true, concurrent_review_cadence_hours: 48, p2p_window_hours: 72, appeal_deadline_days: 60, bed_day_budget_per_case: 30, avoidable_attribution_method: "FIRST_CAUSE" }
              as: URDirector
              captures: { pay_med: $.data.id }
            - call: "POST /api/physicians"
              payload: { full_name: "Dr. Attend", specialty: "Internal Medicine", is_advisor: false }
              as: URDirector
              captures: { dr_att: $.data.id }
            - call: "POST /api/physicians"
              payload: { full_name: "Dr. Advisor", specialty: "Utilization Medicine", is_advisor: true }
              as: URDirector
              captures: { dr_adv: $.data.id }
            - call: "POST /api/utilization-cases"
              payload: { patient_mrn: "MRN-P2PO", payer_id: "${pay_med}", attending_physician_id: "${dr_att}", admit_at: "2026-08-01T08:00:00Z", expected_discharge_at: "2026-08-03T10:00:00Z", requested_admission_status: "INPATIENT" }
              as: URNurse
              captures: { case_id: $.data.id, case_v: $.data.version }
            - call: "POST /api/utilization-cases/${case_id}/authorization-requests"
              payload: { level_of_care: "INPATIENT", requested_day_count: 3, clinical_summary: "Patient with acute decompensated heart failure requiring IV diuresis.", expected_case_version: "${case_v}" }
              as: URNurse
              captures: { auth_id: $.data.id }
            - call: "POST /api/authorization-requests/${auth_id}/payer-decision"
              payload: { decision: "DENY", denial_reason_code: "CRITERIA_NOT_MET" }
              as: PayerReviewer
            - call: "POST /api/authorization-requests/${auth_id}/peer-to-peer-conferences"
              payload: { advisor_physician_id: "${dr_adv}", scheduled_start_at: "2026-08-03T10:00:00Z", scheduled_end_at: "2026-08-03T10:30:00Z" }
              as: AttendingPhysician
              as_user_id: "${dr_att}"
              captures: { conf_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T10:25:00Z" }
              as: URDirector
          trigger:
            - call: "POST /api/peer-to-peer-conferences/${conf_id}/complete"
              payload: { outcome: "OVERTURNED", certified_day_count: 3 }
              as: PhysicianAdvisor
              as_user_id: "${dr_adv}"
          assert:
            - "PeerToPeerConference.${conf_id}.status == COMPLETED and outcome == OVERTURNED"
            - "AuthorizationRequest.${auth_id}.status == APPROVED with certified_day_start == 1 and certified_day_end == 4 (frontier append)"
            - "DenialCase linked to ${auth_id} has status RESOLVED_OVERTURNED"
            - "UtilizationCase.${case_id}.auth_status == AUTHORIZED and certified_day_count == 3"
      - name: p2p_lazy_expiry_materializes_on_read
        claim_type: valid_transition
        grounds: [state_machines.PeerToPeerConference.SCHEDULED_to_EXPIRED, state_machines.DenialCase.P2P_SCHEDULED_to_OPEN]
        distinguishing_aspect: "Time-driven EXPIRED is materialized lazily: reading the conference after window_deadline_at flips it to EXPIRED and returns the denial to OPEN."
        test_recipe:
          setup:
            - "denial at 2026-08-02T12:00:00Z (window deadline 2026-08-05T12:00:00Z); conference SCHEDULED for 2026-08-03"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T12:00:00Z" }
              as: URDirector
            - call: "POST /api/payers"
              payload: { name: "Medicare FFS", plan_class: "MEDICARE", requires_inpatient_auth: true, concurrent_review_cadence_hours: 48, p2p_window_hours: 72, appeal_deadline_days: 60, bed_day_budget_per_case: 30, avoidable_attribution_method: "FIRST_CAUSE" }
              as: URDirector
              captures: { pay_med: $.data.id }
            - call: "POST /api/physicians"
              payload: { full_name: "Dr. Attend", specialty: "Internal Medicine", is_advisor: false }
              as: URDirector
              captures: { dr_att: $.data.id }
            - call: "POST /api/physicians"
              payload: { full_name: "Dr. Advisor", specialty: "Utilization Medicine", is_advisor: true }
              as: URDirector
              captures: { dr_adv: $.data.id }
            - call: "POST /api/utilization-cases"
              payload: { patient_mrn: "MRN-EXP", payer_id: "${pay_med}", attending_physician_id: "${dr_att}", admit_at: "2026-08-01T08:00:00Z", expected_discharge_at: "2026-08-03T10:00:00Z", requested_admission_status: "INPATIENT" }
              as: URNurse
              captures: { case_id: $.data.id, case_v: $.data.version }
            - call: "POST /api/utilization-cases/${case_id}/authorization-requests"
              payload: { level_of_care: "INPATIENT", requested_day_count: 3, clinical_summary: "Patient with acute decompensated heart failure requiring IV diuresis.", expected_case_version: "${case_v}" }
              as: URNurse
              captures: { auth_id: $.data.id }
            - call: "POST /api/authorization-requests/${auth_id}/payer-decision"
              payload: { decision: "DENY", denial_reason_code: "DOC_INSUFFICIENT" }
              as: PayerReviewer
            - call: "POST /api/authorization-requests/${auth_id}/peer-to-peer-conferences"
              payload: { advisor_physician_id: "${dr_adv}", scheduled_start_at: "2026-08-03T10:00:00Z", scheduled_end_at: "2026-08-03T10:30:00Z" }
              as: AttendingPhysician
              as_user_id: "${dr_att}"
              captures: { conf_id: $.data.id }
            - call: "GET /api/utilization-cases/${case_id}/denial-cases"
              as: URNurse
              captures: { den_id: "$.data[0].id" }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-06T00:00:00Z" }
              as: URDirector
            - call: "GET /api/peer-to-peer-conferences/${conf_id}"
              as: URNurse
            - call: "GET /api/denial-cases/${den_id}"
              as: URNurse
          assert:
            - "PeerToPeerConference.${conf_id}.status == EXPIRED after the read (lazy materialization past window_deadline_at)"
            - "DenialCase.${den_id}.status == OPEN (expiry returns the denial) and appeal_deadline_at == 2026-10-01T12:00:00Z"
      - name: appeal_decision_terminal_lockdown
        claim_type: terminal_state_lockdown
        grounds: [state_machines.AppealCase, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "A decided appeal accepts no further decision: the second decision call fails with ERR_INVALID_STATE."
        test_recipe:
          setup: ["denial with an appeal decided UPHELD"]
