              as: BookingAgent
              as_user_id: "agent-01"
              captures: { opt_a: $.data.id }
            - call: "POST /proposals/${pr_a}/present"
              payload: {}
              as: BookingAgent
              as_user_id: "agent-01"
            - call: "POST /proposals/${pr_a}/select"
              payload: { option_id: "${opt_a}" }
              as: Client
              as_user_id: "${cl}"
              captures: { eng_a: $.data.id }
            - call: "POST /engagements/${eng_a}/confirm"
              payload: {}
              as: Speaker
              as_user_id: "${sp}"
            - call: "POST /engagements/${eng_a}/contracts"
