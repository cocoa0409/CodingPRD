            - "AssortmentAction for 0101 is MARKDOWN with markdown_pct_bp == 3000 (broken_ratio 2/4 = 5000bp) because the only COMPLETE peer 0102 has headroom max(0, 24 - 20 - 0) == 4 < available 6 - the highest-stocked store fails the eligibility filter"
            - "AssortmentAction.${a3_id} for 0103 is CONSOLIDATION with consolidation_target_store_id == store 0102 and units_at_detection == 2, because headroom 4 >= 2"
            - "AssortmentAction.${a4_id} for 0104 is MARKDOWN with markdown_pct_bp == 4500 (broken_ratio 4/4 = 10000bp) and consolidation_target_store_id == null - available 0 empties the candidate set by rule"
            - "Executing ${a3_id} succeeds: it creates a CONSOLIDATION TransferRecommendation with units == 2, size_split == [{M:1},{L:1}], proposed_by_user_id == system, and Item.${item_id}.lifecycle_state == CONSOLIDATION_PENDING"
            - "Executing ${a1_id} now returns ERR_ITEM_LIFECYCLE_BLOCKED (409) and AssortmentAction.${a1_id}.status stays PENDING"
            - "Executing ${a4_id} also returns ERR_ITEM_LIFECYCLE_BLOCKED (409) - the gate is per item, not per store"
            - "Cancelling ${a4_id} succeeds (status == CANCELLED): cancel carries no lifecycle precondition, so the block is provably the Item state and not the action state"
            - "Item.${item_id}.lifecycle_state is still CONSOLIDATION_PENDING and broken_store_count is still 3 after all four calls"
  - rule_id: resource_temporal_overlap
    instances:
      - name: fixture_plan_half_open_intervals_adjacency_versus_intersection
        grounds:
          - validations[priority:22]
          - validations[priority:25]
          - entities.FixturePlan.fields.effective_to
          - errors.ERR_FIXTURE_PLAN_OVERLAP
          - errors.ERR_NO_FIXTURE_PLAN_IN_EFFECT
        distinguishing_aspect: |
          The shelf of one (store, item_class) is a resource that may be described by at most one plan at
          any instant, and the interval algebra is half-open with no buffer. Five creations probe it: a plan
          starting exactly at the incumbent's effective_to is accepted, a plan ending exactly at the
          incumbent's effective_from is accepted, a plan strictly inside is rejected, a plan for a different
          item_class over the identical window is accepted, and a plan intersecting the open-ended
          (effective_to null = +infinity) tail is rejected. The mirror rule is then shown from the consumer
          side: store 0102 has no plan covering the logical clock at all, so the whole detection sweep is
          refused instead of silently skipping it.
        test_recipe:
          setup:
            - "Program FA26 with stores 0101(A,URBAN) and 0102(B,URBAN); SizeProfile TOP-4SZ with all four sizes CORE; SKU-1001 SEASONAL APPAREL_TOP"
            - "Store 0101 already has ONE APPAREL_TOP plan: [2026-07-01, 2026-09-01) with 4 x 3 x 4 = capacity 48 and presentation minimum 12"
            - "Store 0102 has NO fixture plan at all"
            - "Positions: 0101 holds 6 units (M 4, L 2) so S and XL are out; 0102 is empty"
            - "The logical clock is 2026-08-01T00:00:00Z"
          setup_api_calls:
            - call: "POST /allocation/programs"
              payload: { name: "FA26 Core Tops", season_code: "FA26", banner_code: "NORTH" }
              as: PlanningAdmin
              as_user_id: "u-plan-1"
              captures: { prog_id: $.data.id }
            - call: "POST /allocation/stores"
              payload: { program_id: "${prog_id}", store_code: "0101", grade: "A", grade_index_bp: 13000, cluster_code: "URBAN", freight_flat_usd: 41.00, historical_sell_through_bp: 6500 }
              as: PlanningAdmin
              as_user_id: "u-plan-1"
              captures: { s1_id: $.data.id }
            - call: "POST /allocation/stores"
              payload: { program_id: "${prog_id}", store_code: "0102", grade: "B", grade_index_bp: 10000, cluster_code: "URBAN", freight_flat_usd: 38.00, historical_sell_through_bp: 5800 }
              as: PlanningAdmin
              as_user_id: "u-plan-1"
              captures: { s2_id: $.data.id }
            - call: "POST /allocation/size-profiles"
              payload: { program_id: "${prog_id}", profile_code: "TOP-4SZ", item_class: "APPAREL_TOP", size_curve: [{ size_code: "S", share_bp: 2000 }, { size_code: "M", share_bp: 3500 }, { size_code: "L", share_bp: 3000 }, { size_code: "XL", share_bp: 1500 }] }
              as: PlanningAdmin
              as_user_id: "u-plan-1"
              captures: { sp_id: $.data.id }
            - call: "POST /allocation/items"
              payload: { program_id: "${prog_id}", sku_code: "SKU-1001", style_code: "ST-100", item_class: "APPAREL_TOP", item_type: "SEASONAL", size_profile_id: "${sp_id}", unit_cost_usd: 14.20, retail_price_usd: 36.50 }
              as: PlanningAdmin
              as_user_id: "u-plan-1"
              captures: { item_id: $.data.id }
            - call: "POST /allocation/fixture-plans"
              payload: { store_id: "${s1_id}", item_class: "APPAREL_TOP", effective_from: "2026-07-01T00:00:00Z", effective_to: "2026-09-01T00:00:00Z", fixture_count: 4, facings_per_fixture: 3, units_per_facing: 4, presentation_min_units: 12 }
              as: PlanningAdmin
              as_user_id: "u-plan-1"
              captures: { fp_mid: $.data.id }
            - call: "POST /allocation/programs/${prog_id}/activate"
              payload: {}
              as: PlanningAdmin
              as_user_id: "u-plan-1"
            - call: "POST /allocation/store-positions"
              payload: { store_id: "${s1_id}", item_id: "${item_id}", on_hand_units: 6, size_on_hand: [{ size_code: "M", units: 4 }, { size_code: "L", units: 2 }], min_units: 12, max_units: 48, weekly_forecast_units: 9, trailing_4wk_sales_units: 30 }
              as: Allocator
              as_user_id: "u-alloc-1"
              captures: { p1_id: $.data.id }
            - call: "POST /allocation/store-positions"
              payload: { store_id: "${s2_id}", item_id: "${item_id}", on_hand_units: 0, size_on_hand: [], min_units: 8, max_units: 24, weekly_forecast_units: 5, trailing_4wk_sales_units: 16 }
              as: Allocator
              as_user_id: "u-alloc-1"
              captures: { p2_id: $.data.id }
          trigger:
            - call: "POST /allocation/fixture-plans"
              payload: { store_id: "${s1_id}", item_class: "APPAREL_TOP", effective_from: "2026-09-01T00:00:00Z", fixture_count: 2, facings_per_fixture: 3, units_per_facing: 4, presentation_min_units: 8 }
              as: PlanningAdmin
              as_user_id: "u-plan-1"
              captures: { fp_late: $.data.id }
            - call: "POST /allocation/fixture-plans"
              payload: { store_id: "${s1_id}", item_class: "APPAREL_TOP", effective_from: "2026-08-15T00:00:00Z", effective_to: "2026-08-20T00:00:00Z", fixture_count: 1, facings_per_fixture: 2, units_per_facing: 3, presentation_min_units: 4 }
              as: PlanningAdmin
              as_user_id: "u-plan-1"
            - call: "POST /allocation/fixture-plans"
              payload: { store_id: "${s1_id}", item_class: "APPAREL_TOP", effective_from: "2026-06-01T00:00:00Z", effective_to: "2026-07-01T00:00:00Z", fixture_count: 1, facings_per_fixture: 3, units_per_facing: 4, presentation_min_units: 6 }
              as: PlanningAdmin
              as_user_id: "u-plan-1"
              captures: { fp_early: $.data.id }
            - call: "POST /allocation/fixture-plans"
              payload: { store_id: "${s1_id}", item_class: "APPAREL_BOTTOM", effective_from: "2026-07-01T00:00:00Z", fixture_count: 2, facings_per_fixture: 2, units_per_facing: 5, presentation_min_units: 5 }
              as: PlanningAdmin
              as_user_id: "u-plan-1"
              captures: { fp_bottom: $.data.id }
            - call: "POST /allocation/fixture-plans"
              payload: { store_id: "${s1_id}", item_class: "APPAREL_TOP", effective_from: "2026-09-01T00:00:00Z", effective_to: "2026-09-15T00:00:00Z", fixture_count: 1, facings_per_fixture: 1, units_per_facing: 4, presentation_min_units: 2 }
              as: PlanningAdmin
              as_user_id: "u-plan-1"
            - call: "POST /allocation/_run-assortment-detection"
              payload: { program_id: "${prog_id}" }
              as: AllocationManager
              as_user_id: "u-mgr-1"
              captures: { err_no_plan: $.data.error_id }
            - call: "POST /allocation/fixture-plans"
              payload: { store_id: "${s2_id}", item_class: "APPAREL_TOP", effective_from: "2026-07-01T00:00:00Z", effective_to: "2026-09-01T00:00:00Z", fixture_count: 2, facings_per_fixture: 3, units_per_facing: 4, presentation_min_units: 8 }
              as: PlanningAdmin
              as_user_id: "u-plan-1"
              captures: { fp_s2: $.data.id }
            - call: "POST /allocation/_run-assortment-detection"
              payload: { program_id: "${prog_id}" }
              as: AllocationManager
              as_user_id: "u-mgr-1"
          assert:
            - "The [2026-09-01, null) plan is accepted (201): adjacency at the incumbent effective_to shares no instant under half-open semantics; FixturePlan.${fp_late}.capacity_units == 24"
            - "The [2026-08-15, 2026-08-20) plan is rejected with ERR_FIXTURE_PLAN_OVERLAP (409) - strictly inside the incumbent"
            - "The [2026-06-01, 2026-07-01) plan is accepted (201): it ends exactly where the incumbent begins; FixturePlan.${fp_early}.capacity_units == 12"
            - "The APPAREL_BOTTOM plan over [2026-07-01, null) is accepted (201) despite fully overlapping two APPAREL_TOP plans - the resource is keyed on (store_id, item_class)"
            - "The [2026-09-01, 2026-09-15) plan is rejected with ERR_FIXTURE_PLAN_OVERLAP (409) because ${fp_late} has effective_to null, i.e. +infinity"
            - "Store 0101 therefore ends with exactly three APPAREL_TOP plans and exactly one of them, ${fp_mid}, contains the clock 2026-08-01"
            - "The first detection sweep returns ERR_NO_FIXTURE_PLAN_IN_EFFECT (422) because position 0102 has no plan covering 2026-08-01, and ZERO AssortmentActions exist afterwards - the sweep is all-or-nothing, not per-position best-effort"
            - "After store 0102 receives its [2026-07-01, 2026-09-01) plan the identical sweep returns 200 with exactly 2 actions, ordered by store_code ASC: 0101 then 0102"
            - "The 0101 action is MARKDOWN with markdown_pct_bp == 3000 (broken_ratio 2/4 == 5000bp) and the 0102 action is MARKDOWN with markdown_pct_bp == 4500 (broken_ratio 4/4 == 10000bp); neither has a consolidation target because no position of SKU-1001 is COMPLETE"
            - "The 0101 action snapshots available_units == 6, proving the in-effect plan (capacity 48) was used rather than the 2026-06 plan (12) or the 2026-09 plan (24)"
      - name: promo_event_buffered_closed_windows_per_scope_target_and_class
        grounds:
          - validations[priority:23]
          - entities.PromoEvent.fields.start_date
          - state_machines[PromoEvent].transitions[DRAFT->SCHEDULED]
          - errors.ERR_PROMO_WINDOW_CONFLICT
          - endpoints.POST /allocation/promo-events/{eventId}/schedule
        distinguishing_aspect: |
          A different overlap resource with different algebra: promo windows are CLOSED intervals expanded
          by PROMO_BUFFER_DAYS = 1 on BOTH ends, so the incumbent [08-05, 08-10] actually reserves
          [08-04, 08-11] and a follower must start no earlier than 08-13 - two clear calendar days, not
          zero as with fixture plans and not one. The conflict is also keyed on three coordinates at once
          (scope, target, item_class) and only against SCHEDULED/ACTIVE incumbents, which is why two DRAFT
          events may be created on top of each other and the collision only surfaces on the second
          schedule.
        test_recipe:
          setup:
            - "Program FA26 ACTIVE with stores 0101(A,URBAN), 0102(B,URBAN) and 0103(C,SUBURBAN)"
            - "One SCHEDULED event BTS-A exists: scope STORE on 0101, item_class APPAREL_TOP, window [2026-08-05, 2026-08-10], lift 11000"
            - "PROMO_BUFFER_DAYS = 1, so BTS-A's effective reserved window is [2026-08-04, 2026-08-11] inclusive"
            - "No other event exists yet"
          setup_api_calls:
            - call: "POST /allocation/programs"
              payload: { name: "FA26 Core Tops", season_code: "FA26", banner_code: "NORTH" }
              as: PlanningAdmin
              as_user_id: "u-plan-1"
              captures: { prog_id: $.data.id }
            - call: "POST /allocation/stores"
              payload: { program_id: "${prog_id}", store_code: "0101", grade: "A", grade_index_bp: 13000, cluster_code: "URBAN", freight_flat_usd: 41.00, historical_sell_through_bp: 6500 }
              as: PlanningAdmin
              as_user_id: "u-plan-1"
              captures: { s1_id: $.data.id }
            - call: "POST /allocation/stores"
              payload: { program_id: "${prog_id}", store_code: "0102", grade: "B", grade_index_bp: 10000, cluster_code: "URBAN", freight_flat_usd: 38.00, historical_sell_through_bp: 5800 }
              as: PlanningAdmin
              as_user_id: "u-plan-1"
              captures: { s2_id: $.data.id }
            - call: "POST /allocation/stores"
              payload: { program_id: "${prog_id}", store_code: "0103", grade: "C", grade_index_bp: 12500, cluster_code: "SUBURBAN", freight_flat_usd: 42.00, historical_sell_through_bp: 4200 }
              as: PlanningAdmin
              as_user_id: "u-plan-1"
              captures: { s3_id: $.data.id }
            - call: "POST /allocation/programs/${prog_id}/activate"
              payload: {}
              as: PlanningAdmin
              as_user_id: "u-plan-1"
            - call: "POST /allocation/promo-events"
              payload: { program_id: "${prog_id}", event_code: "BTS-A", scope: "STORE", store_id: "${s1_id}", item_class: "APPAREL_TOP", start_date: "2026-08-05T00:00:00Z", end_date: "2026-08-10T00:00:00Z", lift_factor_bp: 11000 }
              as: PlanningAdmin
              as_user_id: "u-plan-1"
              captures: { e1_id: $.data.id }
            - call: "POST /allocation/promo-events/${e1_id}/schedule"
              payload: {}
              as: PlanningAdmin
              as_user_id: "u-plan-1"
          trigger:
            - call: "POST /allocation/promo-events"
              payload: { program_id: "${prog_id}", event_code: "BTS-B", scope: "STORE", store_id: "${s1_id}", item_class: "APPAREL_TOP", start_date: "2026-08-11T00:00:00Z", end_date: "2026-08-15T00:00:00Z", lift_factor_bp: 10500 }
              as: PlanningAdmin
              as_user_id: "u-plan-1"
              captures: { err_touch: $.data.error_id }
            - call: "POST /allocation/promo-events"
              payload: { program_id: "${prog_id}", event_code: "BTS-C", scope: "STORE", store_id: "${s1_id}", item_class: "APPAREL_TOP", start_date: "2026-08-12T00:00:00Z", end_date: "2026-08-15T00:00:00Z", lift_factor_bp: 10500 }
              as: PlanningAdmin
              as_user_id: "u-plan-1"
              captures: { err_buffer: $.data.error_id }
            - call: "POST /allocation/promo-events"
              payload: { program_id: "${prog_id}", event_code: "BTS-D", scope: "STORE", store_id: "${s1_id}", item_class: "APPAREL_TOP", start_date: "2026-08-13T00:00:00Z", end_date: "2026-08-18T00:00:00Z", lift_factor_bp: 10500 }
              as: PlanningAdmin
              as_user_id: "u-plan-1"
              captures: { e4_id: $.data.id }
            - call: "POST /allocation/promo-events"
              payload: { program_id: "${prog_id}", event_code: "BTS-E", scope: "STORE", store_id: "${s2_id}", item_class: "APPAREL_TOP", start_date: "2026-08-05T00:00:00Z", end_date: "2026-08-10T00:00:00Z", lift_factor_bp: 11000 }
              as: PlanningAdmin
              as_user_id: "u-plan-1"
              captures: { e5_id: $.data.id }
            - call: "POST /allocation/promo-events"
              payload: { program_id: "${prog_id}", event_code: "BTS-F", scope: "CLUSTER", cluster_code: "URBAN", item_class: "APPAREL_TOP", start_date: "2026-08-05T00:00:00Z", end_date: "2026-08-10T00:00:00Z", lift_factor_bp: 12500 }
              as: PlanningAdmin
              as_user_id: "u-plan-1"
              captures: { e6_id: $.data.id }
            - call: "POST /allocation/promo-events"
              payload: { program_id: "${prog_id}", event_code: "BTS-G", scope: "STORE", store_id: "${s1_id}", start_date: "2026-08-05T00:00:00Z", end_date: "2026-08-10T00:00:00Z", lift_factor_bp: 10800 }
              as: PlanningAdmin
              as_user_id: "u-plan-1"
              captures: { err_nullclass: $.data.error_id }
            - call: "POST /allocation/promo-events"
              payload: { program_id: "${prog_id}", event_code: "BTS-H", scope: "STORE", store_id: "${s3_id}", item_class: "APPAREL_TOP", start_date: "2026-08-05T00:00:00Z", end_date: "2026-08-10T00:00:00Z", lift_factor_bp: 11000 }
              as: PlanningAdmin
              as_user_id: "u-plan-1"
              captures: { e8_id: $.data.id }
            - call: "POST /allocation/promo-events"
              payload: { program_id: "${prog_id}", event_code: "BTS-I", scope: "STORE", store_id: "${s3_id}", item_class: "APPAREL_TOP", start_date: "2026-08-06T00:00:00Z", end_date: "2026-08-09T00:00:00Z", lift_factor_bp: 11500 }
              as: PlanningAdmin
              as_user_id: "u-plan-1"
              captures: { e9_id: $.data.id }
            - call: "POST /allocation/promo-events/${e9_id}/schedule"
              payload: {}
              as: PlanningAdmin
              as_user_id: "u-plan-1"
            - call: "POST /allocation/promo-events/${e8_id}/schedule"
              payload: {}
              as: PlanningAdmin
              as_user_id: "u-plan-1"
              captures: { err_schedule_conflict: $.data.error_id }
          assert:
            - "BTS-B [08-11, 08-15] is rejected with ERR_PROMO_WINDOW_CONFLICT (409): its buffered window [08-10, 08-16] intersects BTS-A buffered [08-04, 08-11]"
            - "BTS-C [08-12, 08-15] is ALSO rejected: buffered [08-11, 08-16] touches BTS-A buffered end 08-11 exactly, and closed intervals that touch do intersect"
            - "BTS-D [08-13, 08-18] is accepted (201, status DRAFT): buffered [08-12, 08-19] clears 08-11 by one day, so 08-13 is the earliest legal start after a window ending 08-10"
            - "BTS-E on store 0102 over the identical window is accepted (201) - same scope and class but a different target"
            - "BTS-F with scope CLUSTER on URBAN over the identical window is accepted (201) even though store 0101 is in URBAN - the conflict test compares scope first and never mixes STORE with CLUSTER"
            - "BTS-G on store 0101 with item_class omitted (null) over the identical window is rejected with ERR_PROMO_WINDOW_CONFLICT (409) - a null class overlaps every class"
            - "BTS-H on store 0103 is accepted and left DRAFT; BTS-I on store 0103 over the strictly-inside window [08-06, 08-09] is ALSO accepted (201) because a DRAFT incumbent is invisible to the test"
            - "Scheduling BTS-I succeeds (status SCHEDULED); scheduling BTS-H then returns ERR_PROMO_WINDOW_CONFLICT (409) and PromoEvent.${e8_id}.status stays DRAFT - the same test runs again at schedule time"
            - "Exactly 5 PromoEvents exist at the end: BTS-A SCHEDULED, BTS-D DRAFT, BTS-E DRAFT, BTS-F DRAFT, BTS-I SCHEDULED; the three rejected creations persisted nothing"
  - rule_id: compensating_invariant
    instances:
      - name: receipt_unit_ledger_survives_commit_recall_recommit_with_zero_drift
        grounds:
          - calculations.receipt_unit_ledger_invariant
          - endpoints.POST /allocation/allocation-runs/{runId}/recall
          - entities.Receipt.fields.units_unallocated
          - entities.AllocationProgram.fields.open_reserve_units
          - state_machines[Receipt].transitions
        distinguishing_aspect: |
          units_received = units_committed + units_unallocated must hold after every ledger-moving
          operation, and recall is the exact compensation for commit: it returns precisely the units the
          matching commit booked, no more. The cycle is run twice through the same 44-unit receipt via a
          second run, so any double-counting of the RECALLED lines, or any failure to move the receipt back
          from ALLOCATED to ALLOCATING, shows up as drift in units_unallocated or in the program's
          open_reserve_units.
        test_recipe:
          setup:
            - "Program FA26 ACTIVE with four stores 0101(A,13000,URBAN) 0102(B,10000,URBAN) 0103(C,12500,SUBURBAN) 0104(D,11000,SUBURBAN)"
            - "Shelf plans effective 2026-07-01 open-ended: 0101 capacity 48 / pmin 12, 0102 capacity 24 / pmin 8, 0103 capacity 20 / pmin 8, 0104 capacity 20 / pmin 6"
            - "SizeProfile TOP-4SZ = S 2000 / M 3500 / L 3000 / XL 1500, core_size_min_share_bp 1500; SKU-1001 is SEASONAL so its resolved model is DEMAND_DRIVEN"
            - "Positions: 0101 on_hand 6 + on_order 4, forecast 9, trailing 30; 0102 on_hand 20, forecast 5, trailing 16; 0103 on_hand 2, forecast 3, trailing 6; 0104 on_hand 0, forecast 2, trailing 5"
            - "A 44-unit receipt (S 8 / M 16 / L 14 / XL 6) has been spread DEMAND_DRIVEN / FORWARD_LOOKING and COMMITTED"
            - "Checkpoint 0: receipt 44 = 44 committed + 0 unallocated, status ALLOCATED; program open_reserve_units 0"
            - "Nothing has shipped, so every line is still PENDING and recall is permitted"
          setup_api_calls:
            - call: "POST /allocation/programs"
              payload: { name: "FA26 Core Tops", season_code: "FA26", banner_code: "NORTH" }
              as: PlanningAdmin
              as_user_id: "u-plan-1"
              captures: { prog_id: $.data.id }
            - call: "POST /allocation/stores"
              payload: { program_id: "${prog_id}", store_code: "0101", grade: "A", grade_index_bp: 13000, cluster_code: "URBAN", freight_flat_usd: 41.00, historical_sell_through_bp: 6500 }
              as: PlanningAdmin
              as_user_id: "u-plan-1"
              captures: { s1_id: $.data.id }
            - call: "POST /allocation/stores"
              payload: { program_id: "${prog_id}", store_code: "0102", grade: "B", grade_index_bp: 10000, cluster_code: "URBAN", freight_flat_usd: 38.00, historical_sell_through_bp: 5800 }
              as: PlanningAdmin
              as_user_id: "u-plan-1"
              captures: { s2_id: $.data.id }
            - call: "POST /allocation/stores"
              payload: { program_id: "${prog_id}", store_code: "0103", grade: "C", grade_index_bp: 12500, cluster_code: "SUBURBAN", freight_flat_usd: 42.00, historical_sell_through_bp: 4200 }
              as: PlanningAdmin
              as_user_id: "u-plan-1"
              captures: { s3_id: $.data.id }
            - call: "POST /allocation/stores"
              payload: { program_id: "${prog_id}", store_code: "0104", grade: "D", grade_index_bp: 11000, cluster_code: "SUBURBAN", freight_flat_usd: 55.00, historical_sell_through_bp: 3100 }
              as: PlanningAdmin
              as_user_id: "u-plan-1"
              captures: { s4_id: $.data.id }
            - call: "POST /allocation/fixture-plans"
              payload: { store_id: "${s1_id}", item_class: "APPAREL_TOP", effective_from: "2026-07-01T00:00:00Z", fixture_count: 4, facings_per_fixture: 3, units_per_facing: 4, presentation_min_units: 12 }
              as: PlanningAdmin
              as_user_id: "u-plan-1"
            - call: "POST /allocation/fixture-plans"
              payload: { store_id: "${s2_id}", item_class: "APPAREL_TOP", effective_from: "2026-07-01T00:00:00Z", fixture_count: 2, facings_per_fixture: 3, units_per_facing: 4, presentation_min_units: 8 }
              as: PlanningAdmin
              as_user_id: "u-plan-1"
            - call: "POST /allocation/fixture-plans"
