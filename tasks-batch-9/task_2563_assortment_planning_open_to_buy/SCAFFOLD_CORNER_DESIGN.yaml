          setup:
            - "an APPROVED plan with M1 IN_SEASON (otb_open 18,200,000, first_receipt 2027-03-05) and M2 LOCKED_PLAN (first_receipt 2027-04-02), two items IN_SEASON on a 45-day vendor, and an OPEN reforecast cycle"
