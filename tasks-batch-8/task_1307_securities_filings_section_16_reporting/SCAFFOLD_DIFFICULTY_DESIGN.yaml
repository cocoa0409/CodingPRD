            - "late2 == true"
            - "lc_end == 2 AND flag_end == true (hop 3: count reached DELINQUENT_LATE_THRESHOLD)"

      - name: confirm_autogenerates_form4_and_obligation
        grounds:
          - state_machines.SecurityTransaction.INGESTED_to_CONFIRMED
          - calculations.open_filing_obligations
          - entities.ReportingPerson.fields.open_obligation_count
        distinguishing_aspect: |
