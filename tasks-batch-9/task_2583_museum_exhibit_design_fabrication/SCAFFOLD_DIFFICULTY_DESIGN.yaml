              as: ProjectManager
              as_user_id: pm-01
              captures: { pkg1: $.data.id }
            - call: "POST /design-packages/${pkg1}/review-rounds"
              payload: { panel_roles: ["Curator", "Conservator", "ProjectManager"], decision_deadline_at: "2026-08-20T00:00:00Z" }
