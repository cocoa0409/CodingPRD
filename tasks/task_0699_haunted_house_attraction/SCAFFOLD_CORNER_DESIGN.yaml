# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# task_0699_haunted_house_attraction — breadth probe over §1.1-§1.7
# =============================================================================
scaffold_corner_design:

  # ---------------------------------------------------------------------------
  - section: entities
    instances:
      - name: create_venue_returns_201_with_defaults
        claim_type: Creation
        grounds: [entities.Venue, endpoints]
        distinguishing_aspect: "POST /venues with name+timezone returns 201; weather_status defaults CLEAR, operational_state OPEN, open_attraction_count 0, version 1."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /venues"
              payload: { name: "Fright Park", timezone: "UTC" }
              as: OpsManager
              captures: { ven_id: $.data.id }
          assert:
            - "response http status == 201"
            - "Venue.${ven_id}.weather_status == CLEAR"
            - "Venue.${ven_id}.operational_state == OPEN"
            - "Venue.${ven_id}.open_attraction_count == 0"
            - "Venue.${ven_id}.version == 1"

      - name: create_attraction_missing_scare_level_returns_invalid_request
        claim_type: Required Fields
        grounds: [entities.Attraction, 'errors[ERR_INVALID_REQUEST]']
        distinguishing_aspect: "POST /attractions without required scare_level returns ERR_INVALID_REQUEST (400); no attraction is created."
        test_recipe:
          setup: ["A venue exists."]
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "Fright Park", timezone: "UTC" }
              as: OpsManager
              captures: { ven_id: $.data.id }
          trigger:
            - call: "POST /attractions"
              payload: { venue_id: "${ven_id}", name: "Crypt", min_age: 0, throughput_per_slot: 10 }
              as: OpsManager
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_REQUEST"
            - "response http status == 400"

      - name: get_attraction_unknown_id_returns_not_found
        claim_type: Not Found
        grounds: [entities.Attraction, 'errors[ERR_NOT_FOUND]']
        distinguishing_aspect: "GET /attractions/{id} with a non-existent UUID returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /attractions/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: OpsManager
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_NOT_FOUND"
            - "response http status == 404"

      - name: attraction_status_initial_open
        claim_type: Computed Fields
        grounds: [entities.Attraction.fields.status]
        distinguishing_aspect: "A newly created attraction starts with status OPEN and increments Venue.open_attraction_count to 1."
        test_recipe:
          setup: ["A venue exists."]
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "Fright Park", timezone: "UTC" }
              as: OpsManager
              captures: { ven_id: $.data.id }
          trigger:
            - call: "POST /attractions"
              payload: { venue_id: "${ven_id}", name: "Crypt", min_age: 0, scare_level: 1, throughput_per_slot: 10, requires_waiver: false }
              as: OpsManager
              captures: { att_id: $.data.id, att_status: $.data.status }
            - call: "GET /venues/${ven_id}"
              payload: {}
              as: OpsManager
              captures: { open_count: $.data.open_attraction_count }
          assert:
            - "Attraction.${att_id}.status == OPEN"
            - "Venue.${ven_id}.open_attraction_count == 1"

      - name: pass_product_min_party_default_is_one
        claim_type: Defaults
        grounds: [entities.PassProduct.fields.min_party]
        distinguishing_aspect: "Omitting min_party on POST /venues/{id}/pass-products applies default 1."
        test_recipe:
          setup: ["A venue exists."]
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "Fright Park", timezone: "UTC" }
              as: OpsManager
              captures: { ven_id: $.data.id }
          trigger:
            - call: "POST /venues/${ven_id}/pass-products"
              payload: { kind: "SEASON", price_cents: 5000, discount_pct: 10, max_redemptions: 5 }
              as: OpsManager
              captures: { pp_id: $.data.id, mp: $.data.min_party }
          assert:
            - "PassProduct.${pp_id}.min_party == 1"

      - name: time_slot_capacity_over_throughput_rejected
        claim_type: Type Constraints
        grounds: [entities.TimeSlot.fields.capacity, 'validations[priority=14]', 'errors[ERR_CAPACITY_OVER_THROUGHPUT]']
        distinguishing_aspect: "Creating a TimeSlot with capacity 20 on an attraction with throughput_per_slot 10 returns ERR_CAPACITY_OVER_THROUGHPUT (422)."
        test_recipe:
          setup: ["Attraction with throughput_per_slot 10."]
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "Fright Park", timezone: "UTC" }
              as: OpsManager
              captures: { ven_id: $.data.id }
            - call: "POST /attractions"
              payload: { venue_id: "${ven_id}", name: "Crypt", min_age: 0, scare_level: 1, throughput_per_slot: 10, requires_waiver: false }
              as: OpsManager
              captures: { att_id: $.data.id }
          trigger:
            - call: "POST /attractions/${att_id}/time-slots"
              payload: { window_start: "2026-10-31T18:00:00Z", window_end: "2026-10-31T19:00:00Z", capacity: 20 }
              as: OpsManager
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_CAPACITY_OVER_THROUGHPUT"
            - "response http status == 422"

      - name: list_attractions_pagination_envelope
        claim_type: Listing
        grounds: [entities.Attraction, endpoints]
        distinguishing_aspect: "GET /attractions?venue_id=... returns an array envelope with pagination fields total_count and has_more."
        test_recipe:
          setup: ["One venue with one attraction."]
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "Fright Park", timezone: "UTC" }
              as: OpsManager
              captures: { ven_id: $.data.id }
            - call: "POST /attractions"
              payload: { venue_id: "${ven_id}", name: "Crypt", min_age: 0, scare_level: 1, throughput_per_slot: 10, requires_waiver: false }
              as: OpsManager
          trigger:
            - call: "GET /attractions"
              payload: { venue_id: "${ven_id}" }
              as: OpsManager
          assert:
            - "response_type == array"
            - "meta.total_count == 1"
            - "meta.has_more == false"

  # ---------------------------------------------------------------------------
  - section: state_machines
    instances:
      - name: confirm_already_reserved_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.Reservation.HELD_to_RESERVED, 'errors[ERR_INVALID_STATE]']
        distinguishing_aspect: "Confirming a reservation already in entry_status RESERVED returns ERR_INVALID_STATE (409); slot counts unchanged."
        test_recipe:
          setup: ["A RESERVED reservation of 1 GA ticket on a fresh slot."]
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "Fright Park", timezone: "UTC" }
              as: OpsManager
              captures: { ven_id: $.data.id }
            - call: "POST /attractions"
              payload: { venue_id: "${ven_id}", name: "Crypt", min_age: 0, scare_level: 1, throughput_per_slot: 10, requires_waiver: false }
              as: OpsManager
              captures: { att_id: $.data.id }
            - call: "POST /attractions/${att_id}/pricing-rules"
              payload: { tier: "GA", base_price_cents: 2410 }
              as: OpsManager
            - call: "POST /attractions/${att_id}/time-slots"
              payload: { window_start: "2026-10-31T18:00:00Z", window_end: "2026-10-31T19:00:00Z", capacity: 10 }
              as: OpsManager
              captures: { slot_id: $.data.id, slot_v: $.data.version }
            - call: "POST /guests"
              payload: { full_name: "G", age: 30, email: "g@x.com" }
              as: BoxOffice
              captures: { g_id: $.data.id }
            - call: "POST /reservations"
              payload: { venue_id: "${ven_id}", guest_id: "${g_id}" }
              as: BoxOffice
              captures: { r_id: $.data.id }
            - call: "POST /reservations/${r_id}/tickets"
              payload: { time_slot_id: "${slot_id}", guest_age: 30, max_scare_level: 1, tier: "GA" }
              as: BoxOffice
            - call: "POST /reservations/${r_id}/confirm"
              payload: { expected_time_slot_version: "${slot_v}" }
              as: BoxOffice
            - call: "GET /time-slots/${slot_id}"
              payload: {}
              as: BoxOffice
              captures: { slot_v2: $.data.version }
          trigger:
            - call: "POST /reservations/${r_id}/confirm"
              payload: { expected_time_slot_version: "${slot_v2}" }
              as: BoxOffice
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE"
            - "response http status == 409"

      - name: confirm_empty_reservation_returns_empty_reservation
        claim_type: Precondition Enforcement
        grounds: [state_machines.Reservation.HELD_to_RESERVED, 'errors[ERR_EMPTY_RESERVATION]']
        distinguishing_aspect: "Confirming a HELD reservation with zero tickets returns ERR_EMPTY_RESERVATION (422)."
        test_recipe:
          setup: ["A HELD reservation with no tickets."]
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "Fright Park", timezone: "UTC" }
              as: OpsManager
              captures: { ven_id: $.data.id }
            - call: "POST /attractions"
              payload: { venue_id: "${ven_id}", name: "Crypt", min_age: 0, scare_level: 1, throughput_per_slot: 10, requires_waiver: false }
              as: OpsManager
              captures: { att_id: $.data.id }
            - call: "POST /attractions/${att_id}/time-slots"
              payload: { window_start: "2026-10-31T18:00:00Z", window_end: "2026-10-31T19:00:00Z", capacity: 10 }
              as: OpsManager
              captures: { slot_id: $.data.id, slot_v: $.data.version }
            - call: "POST /guests"
              payload: { full_name: "G", age: 30, email: "g@x.com" }
              as: BoxOffice
              captures: { g_id: $.data.id }
            - call: "POST /reservations"
              payload: { venue_id: "${ven_id}", guest_id: "${g_id}" }
              as: BoxOffice
              captures: { r_id: $.data.id }
          trigger:
            - call: "POST /reservations/${r_id}/confirm"
              payload: { expected_time_slot_version: "${slot_v}" }
              as: BoxOffice
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_EMPTY_RESERVATION"
            - "response http status == 422"

      - name: check_in_outside_shift_window_returns_outside_shift_window
        claim_type: Precondition Enforcement
        grounds: [state_machines.ActorShift.SCHEDULED_to_CHECKED_IN, 'validations[priority=11]', 'errors[ERR_OUTSIDE_SHIFT_WINDOW]']
        distinguishing_aspect: "Actor check_in at a clock before shift_start (17:00 vs shift 18:00-19:00) returns ERR_OUTSIDE_SHIFT_WINDOW (409); status stays SCHEDULED."
        test_recipe:
          setup: ["Scheduled shift [18:00,19:00); clock at 17:00."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-31T17:00:00Z" }
              as: OpsManager
            - call: "POST /venues"
              payload: { name: "Fright Park", timezone: "UTC" }
              as: OpsManager
              captures: { ven_id: $.data.id }
            - call: "POST /attractions"
              payload: { venue_id: "${ven_id}", name: "Crypt", min_age: 0, scare_level: 1, throughput_per_slot: 10, requires_waiver: false }
              as: OpsManager
              captures: { att_id: $.data.id }
            - call: "POST /attractions/${att_id}/scare-zones"
              payload: { name: "Z", min_actors: 1 }
              as: OpsManager
              captures: { zone_id: $.data.id }
            - call: "POST /scare-zones/${zone_id}/actor-shifts"
              payload: { actor_user_id: "actor-3", shift_start: "2026-10-31T18:00:00Z", shift_end: "2026-10-31T19:00:00Z" }
              as: OpsManager
              captures: { shift_id: $.data.id }
          trigger:
            - call: "POST /actor-shifts/${shift_id}/check_in"
              payload: {}
              as: Actor
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_OUTSIDE_SHIFT_WINDOW"
            - "response http status == 409"

      - name: revoke_already_revoked_waiver_returns_invalid_state
        claim_type: Terminal State Lockdown
        grounds: [state_machines.Waiver.SIGNED_to_REVOKED, 'errors[ERR_INVALID_STATE]']
        distinguishing_aspect: "Revoking a waiver already in REVOKED (terminal) returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["A guest waiver already REVOKED."]
          setup_api_calls:
            - call: "POST /guests"
              payload: { full_name: "G", age: 30, email: "g@x.com" }
              as: BoxOffice
              captures: { g_id: $.data.id }
            - call: "POST /guests/${g_id}/waivers"
              payload: { max_scare_level: 5 }
              as: Guest
              as_user_id: "${g_id}"
              captures: { w_id: $.data.id, w_v: $.data.version }
            - call: "POST /waivers/${w_id}/revoke"
              payload: { expected_waiver_version: "${w_v}" }
              as: Guest
              as_user_id: "${g_id}"
          trigger:
            - call: "POST /waivers/${w_id}/revoke"
              payload: { expected_waiver_version: "${w_v}" }
              as: Guest
              as_user_id: "${g_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE"
            - "response http status == 409"

      - name: admit_requires_waiver_when_attraction_requires_it
        claim_type: guarded transitions
        grounds: [state_machines.Reservation.RESERVED_to_ADMITTED, 'validations[priority=7]', 'errors[ERR_WAIVER_REQUIRED]']
        distinguishing_aspect: "Admit on a waiver-required attraction (scare_level 3) for a guest with no SIGNED waiver returns ERR_WAIVER_REQUIRED (422)."
        test_recipe:
          setup: ["RESERVED+PAID reservation inside window; zone STAFFED; attraction requires_waiver true, scare_level 3; guest has NO waiver."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-31T18:30:00Z" }
              as: OpsManager
            - call: "POST /venues"
              payload: { name: "Fright Park", timezone: "UTC" }
              as: OpsManager
              captures: { ven_id: $.data.id }
            - call: "POST /attractions"
              payload: { venue_id: "${ven_id}", name: "Crypt", min_age: 0, scare_level: 3, throughput_per_slot: 10, requires_waiver: true }
              as: OpsManager
              captures: { att_id: $.data.id }
            - call: "POST /attractions/${att_id}/pricing-rules"
              payload: { tier: "GA", base_price_cents: 2410 }
              as: OpsManager
            - call: "POST /attractions/${att_id}/scare-zones"
              payload: { name: "Z", min_actors: 1 }
              as: OpsManager
              captures: { zone_id: $.data.id }
            - call: "POST /scare-zones/${zone_id}/actor-shifts"
              payload: { actor_user_id: "actor-4", shift_start: "2026-10-31T18:00:00Z", shift_end: "2026-10-31T22:00:00Z" }
              as: OpsManager
              captures: { shift_id: $.data.id }
            - call: "POST /actor-shifts/${shift_id}/check_in"
              payload: {}
              as: Actor
            - call: "POST /attractions/${att_id}/time-slots"
              payload: { window_start: "2026-10-31T18:00:00Z", window_end: "2026-10-31T19:00:00Z", capacity: 10 }
              as: OpsManager
              captures: { slot_id: $.data.id, slot_v: $.data.version }
            - call: "POST /guests"
              payload: { full_name: "No Waiver", age: 30, email: "nw@x.com" }
              as: BoxOffice
              captures: { g_id: $.data.id }
            - call: "POST /reservations"
              payload: { venue_id: "${ven_id}", guest_id: "${g_id}" }
              as: BoxOffice
              captures: { r_id: $.data.id }
            - call: "POST /reservations/${r_id}/tickets"
              payload: { time_slot_id: "${slot_id}", guest_age: 30, max_scare_level: 5, tier: "GA" }
              as: BoxOffice
            - call: "POST /reservations/${r_id}/confirm"
              payload: { expected_time_slot_version: "${slot_v}" }
              as: BoxOffice
            - call: "POST /reservations/${r_id}/pay"
              payload: {}
              as: BoxOffice
          trigger:
            - call: "POST /reservations/${r_id}/admit"
              payload: {}
              as: BoxOffice
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_WAIVER_REQUIRED"
            - "response http status == 422"

      - name: closure_cascade_already_covered_stub
        claim_type: Side Effect Execution
        grounds: [state_machines.Attraction.OPEN_to_PAUSED]
        excluded_because:
          difficulty_instance: transitive_cascade / tc_depth3_closure_pauses_slot_cancels_reservation_refunds_wallet
          rationale: "The full OPEN->PAUSED slot/reservation/wallet cascade side-effect chain is asserted by the named §1.8 depth-3 instance."

  # ---------------------------------------------------------------------------
  - section: calculations
    instances:
      - name: wallet_apply_drains_before_cash
        claim_type: Correct Result
        grounds: [calculations.wallet_apply, entities.Guest.fields.wallet_credit_cents]
        distinguishing_aspect: "Guest with wallet 4820 paying a 2410 reservation drains wallet to 2410 and charges cash 0; payment_status PAID."
        test_recipe:
          setup: ["Guest wallet 4820 (from a prior cancelled paid 4820 two-ticket reservation); a new RESERVED+UNPAID reservation total 2410."]
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "Fright Park", timezone: "UTC" }
              as: OpsManager
              captures: { ven_id: $.data.id }
            - call: "POST /attractions"
              payload: { venue_id: "${ven_id}", name: "Crypt", min_age: 0, scare_level: 1, throughput_per_slot: 10, requires_waiver: false }
              as: OpsManager
              captures: { att_id: $.data.id }
            - call: "POST /attractions/${att_id}/pricing-rules"
              payload: { tier: "GA", base_price_cents: 2410 }
              as: OpsManager
            - call: "POST /attractions/${att_id}/time-slots"
              payload: { window_start: "2026-10-31T18:00:00Z", window_end: "2026-10-31T19:00:00Z", capacity: 10 }
              as: OpsManager
              captures: { slot_id: $.data.id, slot_v: $.data.version }
            - call: "POST /guests"
              payload: { full_name: "Wallet Guest", age: 30, email: "wal@x.com" }
              as: BoxOffice
              captures: { g_id: $.data.id }
            - call: "POST /reservations"
              payload: { venue_id: "${ven_id}", guest_id: "${g_id}" }
              as: BoxOffice
              captures: { rbig_id: $.data.id }
            - call: "POST /reservations/${rbig_id}/tickets"
              payload: { time_slot_id: "${slot_id}", guest_age: 30, max_scare_level: 1, tier: "GA" }
              as: BoxOffice
            - call: "POST /reservations/${rbig_id}/tickets"
              payload: { time_slot_id: "${slot_id}", guest_age: 30, max_scare_level: 1, tier: "GA" }
              as: BoxOffice
            - call: "POST /reservations/${rbig_id}/confirm"
              payload: { expected_time_slot_version: "${slot_v}" }
              as: BoxOffice
            - call: "POST /reservations/${rbig_id}/pay"
              payload: {}
              as: BoxOffice
            - call: "POST /reservations/${rbig_id}/cancel"
              payload: {}
              as: BoxOffice
            - call: "GET /time-slots/${slot_id}"
              payload: {}
              as: BoxOffice
              captures: { slot_v2: $.data.version }
            - call: "POST /reservations"
              payload: { venue_id: "${ven_id}", guest_id: "${g_id}" }
              as: BoxOffice
              captures: { rnew_id: $.data.id }
            - call: "POST /reservations/${rnew_id}/tickets"
              payload: { time_slot_id: "${slot_id}", guest_age: 30, max_scare_level: 1, tier: "GA" }
              as: BoxOffice
            - call: "POST /reservations/${rnew_id}/confirm"
              payload: { expected_time_slot_version: "${slot_v2}" }
              as: BoxOffice
          trigger:
            - call: "POST /reservations/${rnew_id}/pay"
              payload: {}
              as: BoxOffice
            - call: "GET /guests/${g_id}"
              payload: {}
              as: BoxOffice
              captures: { wallet_after: $.data.wallet_credit_cents }
          assert:
            - "Guest.${g_id}.wallet_credit_cents == 4820 after rbig is cancelled (full refund of the 4820 two-ticket reservation)"
            - "Reservation.${rnew_id}.payment_status == PAID"
            - "Guest.${g_id}.wallet_credit_cents == 2410 after rnew pay applies 2410 of the 4820 credit"

      - name: pass_discount_zero_when_group_min_party_not_met
        claim_type: Input Set Filtering
        grounds: [calculations.pass_discount, entities.PassProduct.fields.min_party]
        distinguishing_aspect: "A GROUP pass with min_party 3 applied to a 1-ticket reservation yields discount_cents 0 (min_party not met); total == subtotal."
        test_recipe:
          setup: ["Guest with GROUP pass (discount 15, min_party 3); reservation of 1 GA ticket price 2410."]
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "Fright Park", timezone: "UTC" }
              as: OpsManager
              captures: { ven_id: $.data.id }
            - call: "POST /attractions"
              payload: { venue_id: "${ven_id}", name: "Crypt", min_age: 0, scare_level: 1, throughput_per_slot: 10, requires_waiver: false }
              as: OpsManager
              captures: { att_id: $.data.id }
            - call: "POST /attractions/${att_id}/pricing-rules"
              payload: { tier: "GA", base_price_cents: 2410 }
              as: OpsManager
            - call: "POST /attractions/${att_id}/time-slots"
              payload: { window_start: "2026-10-31T18:00:00Z", window_end: "2026-10-31T19:00:00Z", capacity: 10 }
              as: OpsManager
              captures: { slot_id: $.data.id, slot_v: $.data.version }
            - call: "POST /venues/${ven_id}/pass-products"
              payload: { kind: "GROUP", price_cents: 0, discount_pct: 15, max_redemptions: 2, min_party: 3 }
              as: OpsManager
              captures: { pp_id: $.data.id }
            - call: "POST /guests"
              payload: { full_name: "Solo", age: 30, email: "solo@x.com" }
              as: BoxOffice
              captures: { g_id: $.data.id }
            - call: "POST /passes"
              payload: { pass_product_id: "${pp_id}", guest_id: "${g_id}" }
              as: BoxOffice
              captures: { pass_id: $.data.id }
            - call: "POST /reservations"
              payload: { venue_id: "${ven_id}", guest_id: "${g_id}", pass_id: "${pass_id}" }
              as: BoxOffice
              captures: { r_id: $.data.id }
            - call: "POST /reservations/${r_id}/tickets"
              payload: { time_slot_id: "${slot_id}", guest_age: 30, max_scare_level: 1, tier: "GA" }
              as: BoxOffice
          trigger:
            - call: "POST /reservations/${r_id}/confirm"
              payload: { expected_time_slot_version: "${slot_v}" }
              as: BoxOffice
          assert:
            - "Reservation.${r_id}.subtotal_cents == 2410"
            - "Reservation.${r_id}.discount_cents == 0"
            - "Reservation.${r_id}.total_cents == 2410"

      - name: dynamic_price_low_band_stub
        claim_type: Correct Result
        grounds: [calculations.dynamic_ticket_price]
        excluded_because:
