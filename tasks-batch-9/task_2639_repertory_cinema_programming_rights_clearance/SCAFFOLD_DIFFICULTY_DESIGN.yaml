              payload: { cancel_reason: "PRINT_UNAVAILABLE" }
              as: Programmer
          assert:
            - "Before the cancel: RightsClearance.${c_id}.screenings_used == 3 and screenings_remaining == 3, and 3 + 3 == 6."
            - "The cancel returns 200 with Showtime.${s2_id}.status == CANCELLED, sale_status == SALES_CLOSED and cancel_reason == PRINT_UNAVAILABLE."
            - "After the cancel: RightsClearance.${c_id}.screenings_used == 2 and screenings_remaining == 4, and 2 + 4 == 6 - the invariant is preserved and one screening returned to the pool."
            - "Showtime.${s1_id}.status == SCHEDULED and Showtime.${s3_id}.status == SCHEDULED - the recount excluded only the cancelled row."
            - "Booking.${b_id}.scheduled_showtime_count == 2, decremented in step with the allowance restore."
            - "RightsClearance.${c_id}.version is strictly greater than ${c_v3}, so the restore is itself an OCC-visible write."

      - name: member_credit_ledger_conserved_across_refund_then_redemption
        grounds:
          - calculations.ticket_order_pricing
          - calculations.member_standing
          - state_machines.TicketOrder[PAID -> REFUNDED]
          - entities.Member.credit_balance_cents
          - entities.TicketOrder.applied_credit_cents
        distinguishing_aspect: |
          Conserved quantity: MEMBER CREDIT CENTS. A refund to MEMBER_CREDIT moves the full 4149 out of the
          cash ledger and into the member's balance, and the next order consumes exactly the part it needs, so
          applied_credit_cents + remaining credit_balance_cents == the refunded amount at all times. Distinct
          from the seat pool and the screening pool: this quantity is money, it moves between two ledgers
          rather than being recounted from rows, and it is only conserved because per-ticket rounding is
          applied identically on the way out and on the way back in.
        test_recipe:
          setup:
            - "Canonical venue / distributor / title / CONFIRMED booking / CLEARED clearance / non-encrypted DCP asset. The clock is left at its startup default 2026-08-01T00:00:00Z."
            - "Member Ada Wells donated 20000 cents on 2026-03-01T10:00:00Z: rolling_donation_cents 20000 gives rolling_tier SUPPORTER, fiscal_ytd_donation_cents 0 gives fiscal_tier PROSPECT, so effective_tier is SUPPORTER with discount_pct 0.15."
            - "Showtime SA at 2026-08-14T12:00:00Z has base_price_cents 1450 and surcharge_cents 0, and its sales are open."
            - "The member bought 3 seats: unit_price_cents 1233 (1450 x 0.85 == 1232.5 rounded half up per ticket), line_subtotal_cents 3699, facility_fee_cents 450, total_cents 4149. That order is PAID."
            - "The member's credit_balance_cents is 0 before the refund."
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "Reel Repertory", seat_capacity: 12, house_hold_seats: 4, trailer_reel_minutes: 12, turnaround_minutes: 25, min_useful_gap_minutes: 45, dcp_ingest_lane_count: 2, open_local_time: "11:00", last_start_local_time: "22:00", utc_offset_minutes: 0, max_first_run_share: 0.60, weekly_repertory_target: 3, supported_formats: ["DCP_2K", "DCP_4K"], base_house_nut_weekly_cents: 200000 }
              as: ExecutiveDirector
              captures: { v_id: $.data.id }
            - call: "POST /distributors"
              payload: { name: "Coyote Films", contact_email: "book@coyote.example", default_terms_variant: "SLIDING_SCALE_90_10", default_min_run_days: 4, default_distributor_share_pct: 0.35, requires_advance_guarantee: false }
              as: Programmer
              captures: { d_id: $.data.id }
            - call: "POST /titles"
              payload: { title_name: "La Jetee Redux", release_year: 1962, runtime_minutes: 104, is_first_run: false, native_format: "DCP_2K", rights_holder_distributor_id: "${d_id}" }
              as: Programmer
              captures: { t1_id: $.data.id }
            - call: "POST /bookings"
              payload: { title_id: "${t1_id}", distributor_id: "${d_id}", venue_id: "${v_id}", terms_variant: "SLIDING_SCALE_90_10", house_nut_cents: 12500, distributor_share_pct: 0.35, guarantee_cents: 3000, min_run_days: 4, engagement_start_date: "2026-08-10", engagement_end_date: "2026-08-20" }
              as: Programmer
              captures: { b_id: $.data.id }
            - call: "POST /bookings/${b_id}/confirm"
              payload: {}
              as: ExecutiveDirector
              as_user_id: "u-ed-1"
            - call: "POST /clearances"
              payload: { title_id: "${t1_id}", booking_id: "${b_id}", licensor_name: "Cinematheque Nord", license_fee_cents: 45000, territory: "US-NY-METRO", window_start_date: "2026-08-10", window_end_date: "2026-08-20", max_screenings: 6, source_format: "DCP_2K" }
              as: RightsManager
              as_user_id: "u-rm-1"
              captures: { c_id: $.data.id }
            - call: "POST /clearances/${c_id}/clear"
              payload: {}
              as: RightsManager
              as_user_id: "u-rm-2"
            - call: "POST /dcp-assets"
              payload: { title_id: "${t1_id}", source_distributor_id: "${d_id}", venue_id: "${v_id}", format: "DCP_2K", is_encrypted: false, carrier_ref: "WB-77120", ingest_window_start_at: "2026-07-30T08:00:00Z", ingest_window_end_at: "2026-07-31T08:00:00Z" }
              as: TechnicalManager
              captures: { a_id: $.data.id }
            - call: "GET /clearances/${c_id}"
              payload: {}
              as: Programmer
              captures: { c_v1: $.data.version }
            - call: "POST /showtimes"
              payload: { venue_id: "${v_id}", title_id: "${t1_id}", booking_id: "${b_id}", clearance_id: "${c_id}", dcp_asset_id: "${a_id}", strand: "REPERTORY_SERIES", start_at: "2026-08-14T12:00:00Z", base_price_cents: 1450, public_sale_opens_at: "2026-08-01T00:00:00Z", format: "DCP_2K", expected_clearance_version: "${c_v1}" }
              as: Programmer
              captures: { sa_id: $.data.id }
            - call: "POST /showtimes/${sa_id}/open-sales"
              payload: {}
              as: BoxOfficeManager
            - call: "POST /members"
              payload: { full_name: "Ada Wells", email: "ada@example.com", join_date: "2026-07-01" }
              as: BoxOfficeManager
              captures: { m_id: $.data.id }
            - call: "POST /members/${m_id}/donations"
              payload: { amount_cents: 20000, received_at: "2026-03-01T10:00:00Z" }
              as: BoxOfficeManager
            - call: "POST /ticket-orders"
              payload: { showtime_id: "${sa_id}", quantity: 3, purchaser_email: "ada@example.com", member_id: "${m_id}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { o1_id: $.data.id }
            - call: "POST /ticket-orders/${o1_id}/pay"
              payload: {}
              as: BoxOfficeManager
          trigger:
            - call: "POST /ticket-orders/${o1_id}/refund"
              payload: { refund_destination: "MEMBER_CREDIT" }
              as: BoxOfficeManager
            - call: "POST /ticket-orders"
              payload: { showtime_id: "${sa_id}", quantity: 1, purchaser_email: "ada@example.com", member_id: "${m_id}", apply_credit: true }
              as: Member
              as_user_id: "${m_id}"
              captures: { o2_id: $.data.id }
          assert:
            - "The refund returns 200: TicketOrder.${o1_id}.status == REFUNDED, refund_destination == MEMBER_CREDIT, and Member.${m_id}.credit_balance_cents == 4149 - the entire total_cents crossed into the credit ledger."
            - "Showtime.${sa_id}.gross_cents == 0, admissions_count == 0, seats_sold == 0 and seats_available == 8 after the refund."
            - "The redemption returns 201: TicketOrder.${o2_id}.unit_price_cents == 1233 and facility_fee_cents == 150, so the amount owed before credit is 1383."
            - "TicketOrder.${o2_id}.applied_credit_cents == 1383 and total_cents == 0 - the credit covered the whole order and was not over-applied."
            - "Member.${m_id}.credit_balance_cents == 2766 afterwards, and 1383 + 2766 == 4149: the ledger is conserved to the cent."
            - "Member.${m_id}.effective_tier == SUPPORTER and discount_pct == 0.15 are unchanged; the refund did not disturb standing."
            - "Showtime.${sa_id}.seats_sold == 1 and seats_available == 7 after the redemption, and 1 + 7 + 4 == 12."
