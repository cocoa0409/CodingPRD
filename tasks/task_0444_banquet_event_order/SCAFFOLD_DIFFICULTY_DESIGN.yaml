            - call: "POST /events/${event_a}/bookings"
              payload: { function_room_id: "${room_id}", start_utc: "2027-10-01T18:00:00Z", end_utc: "2027-10-01T22:00:00Z", expected_event_version: "${eva_v0}" }
              as: SalesManager
              captures: { booking_a: $.data.id }
            - call: "POST /events/${event_a}/hold"
              payload: {}
              as: SalesManager
            - call: "POST /events/${event_a}/bookings/${booking_a}/make-definite"
              payload: {}
              as: SalesManager
            - call: "POST /events"
              payload: { account_name: "Omicron B", event_date: "2027-10-01", setup_style: "THEATER", expected_attendance: 50 }
              as: SalesManager
              captures: { event_b: $.data.id, evb_v0: $.data.version }
            - call: "POST /events/${event_b}/bookings"
              payload: { function_room_id: "${room_id}", start_utc: "2027-10-01T22:30:00Z", end_utc: "2027-10-01T23:30:00Z", expected_event_version: "${evb_v0}" }
              as: SalesManager
              captures: { booking_b: $.data.id }
            - call: "POST /events/${event_b}/hold"
              payload: {}
              as: SalesManager
          trigger:
            - call: "POST /events/${event_b}/bookings/${booking_b}/make-definite"
              payload: {}
