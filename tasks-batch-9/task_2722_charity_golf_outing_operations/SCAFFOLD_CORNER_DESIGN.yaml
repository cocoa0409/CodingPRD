      - name: the_tee_sheet_slot_conflict_on_one_starting_hole
        claim_type: Violation → Error
        grounds:
          - validations[priority=21]
          - errors.ERR_TEE_SLOT_CONFLICT
        distinguishing_aspect: "Half-open [tee_time, tee_time + tee_interval_minutes) occupancy scoped per starting_hole, so an exactly-touching follower is accepted and the same time on another hole never conflicts."
        excluded_because:
          difficulty_instance: tee_sheet_slot_is_half_open_per_starting_hole
          rationale: "The §1.8 instance already drives the three-call boundary set - overlapping, exactly-touching and same-time-other-hole - on one outing, and it is the interval semantics rather than the error code that carries the difficulty."

      - name: the_wave_window_and_the_cart_allowance_on_one_tee_assignment
        claim_type: Priority Ordering
        grounds:
          - validations[priority=24]
          - validations[priority=27]
          - errors.ERR_WAVE_WINDOW_VIOLATION
          - errors.ERR_CART_ALLOWANCE_EXCEEDED
        distinguishing_aspect: "A single request that both leaves its wave window and asks for a cart above the contracted allowance must report the temporal rule at priority 24, not the constraint rule at priority 27."
        excluded_because:
          difficulty_instance: temporal_wave_window_outranks_constraint_cart_allowance
          rationale: "The §1.8 instance already violates both rules on the same call and then isolates each one, which is exactly the claim a corner test would make."

      - name: the_cart_turnaround_gap_between_two_waves
        claim_type: Violation → Error
        grounds:
          - validations[priority=23]
          - errors.ERR_CART_DOUBLE_BOOKED
        distinguishing_aspect: "A cart reissued to a wave-B group needs CART_TURNAROUND_MINUTES (30) between wave A's end and wave B's start, and the boundary gap of exactly 30 minutes is accepted."
        excluded_because:
          difficulty_instance: cart_reuse_across_waves_needs_a_thirty_minute_turnaround_gap
          rationale: "The §1.8 instance already tests the 29 / 30 / 31 minute boundary triple on a WAVE_SPLIT outing, including the CART_PREP_MINUTES leg."

      - name: the_padded_closed_service_window_on_one_asset
        claim_type: Violation → Error
        grounds:
          - validations[priority=22]
          - errors.ERR_SERVICE_WINDOW_CONFLICT
        distinguishing_aspect: "Service windows are padded 30 minutes on BOTH sides and treated as closed, so two windows whose padded edges merely touch DO conflict - the opposite convention from the tee sheet."
        excluded_because:
          difficulty_instance: sponsorship_service_window_is_closed_and_padded_thirty_minutes
          rationale: "The §1.8 instance already contrasts the closed padded interval against the half-open tee-sheet interval on the same fixture, which is the whole point of the rule."

      - name: a_withdrawn_asset_reports_before_the_capacity_comparison
        claim_type: Priority Ordering
        grounds:
          - validations[priority=28]
          - errors.ERR_ASSET_WITHDRAWN
        distinguishing_aspect: "A WITHDRAWN asset also reads remaining_capacity 0, so the two halves of priority 28 are both violated and the withdrawal must be reported."
        excluded_because:
          difficulty_instance: allocation_cannot_be_reserved_against_a_withdrawn_asset
          rationale: "The §1.8 instance already withdraws a live asset, shows ERR_ASSET_WITHDRAWN rather than ERR_ASSET_CAPACITY_EXCEEDED, and then RESTOREs it to prove the allocation succeeds afterwards."

      - name: the_asset_capacity_boundary_of_exactly_zero
        claim_type: Violation → Error
        grounds:
          - validations[priority=28]
          - errors.ERR_ASSET_CAPACITY_EXCEEDED
        distinguishing_aspect: "A live asset sitting exactly on remaining_capacity 0 is a rejection, not a silent queue, while remaining_capacity 1 still admits a sponsor."
        excluded_because:
          difficulty_instance: asset_remaining_capacity_zero_is_a_rejection
          rationale: "The §1.8 instance already walks capacity 2 down to 0 and asserts the boundary value 0 rejects while 1 accepts."

      - name: a_commit_needs_a_revenue_recognized_registration
        claim_type: Violation → Error
        grounds:
          - state_machines.SponsorAllocation.RESERVED_to_COMMITTED
          - errors.ERR_REGISTRATION_NOT_REVENUE_RECOGNIZED
        distinguishing_aspect: "A reservation may be taken while the sponsor package is still PENDING_PAYMENT, but the COMMIT that recognizes the upsell as revenue may not."
        excluded_because:
          difficulty_instance: allocation_cannot_commit_while_its_registration_is_unpaid
          rationale: "The §1.8 instance already reserves against an unpaid registration, fails the COMMIT, pays, and then succeeds - covering both the violation and the satisfaction."

      - name: a_closed_registration_reports_before_the_payment_amount_check
        claim_type: Priority Ordering
        grounds:
          - validations[priority=9]
          - validations[priority=35]
          - errors.ERR_REGISTRATION_CLOSED
          - errors.ERR_PAYMENT_AMOUNT_MISMATCH
        distinguishing_aspect: "A wrong-amount payment taken after the field was locked must report the state rule at priority 9, and the fiscal rule at priority 35 only surfaces once the outing is reopened."
        excluded_because:
          difficulty_instance: state_registration_closed_outranks_fiscal_payment_mismatch
          rationale: "The §1.8 instance already sends the identical wrong-amount payment in both play states, which is precisely the priority-ordering claim plus both codes."

      - name: the_third_field_reopen_is_refused
        claim_type: Violation → Error
        grounds:
          - state_machines.Outing.play_status.FIELD_LOCKED_to_OPEN
          - validations[priority=32]
          - errors.ERR_MAX_REOPENS_EXCEEDED
        distinguishing_aspect: "The cyclic play dimension counts accepted FIELD_LOCKED -> OPEN transitions and refuses the third one while the finance dimension keeps cycling without any cap."
        excluded_because:
          difficulty_instance: outing_field_reopen_cycle_with_independent_finance_dimension
          rationale: "The §1.8 instance already drives two accepted reopens, the refused third, and the uncapped finance RECONCILE/REOPEN cycle alongside it."

  - section: endpoints
    instances:
      - name: registration_listing_filters_and_paginates_over_one_outing
        claim_type: Listing
        grounds:
          - endpoints["GET /outing-ops/registrations"]
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: "Filter, sort and paginate interact on one collection: total_count always describes the FILTERED set rather than the page or the whole table, has_more is derived from limit + offset against that filtered count, the default page size is 10, and a limit above the declared maximum of 100 is a schema rejection rather than a clamp."
        test_recipe:
          setup:
            - "One OPEN outing with two tiers - SOLO (30000, one slot) and TEAM4 (120000, four slots)."
            - "Five registrations on that outing: three SOLO (one paid, two still PENDING_PAYMENT) and two TEAM4 (one paid, one still PENDING_PAYMENT)."
            - "A second outing holds one registration that must never appear in the filtered results."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: TournamentDirector
            - call: "POST /outing-ops/outings"
              payload: { name: "Listing Open", beneficiary_name: "Northside Youth Fund", format: "SCRAMBLE", start_format: "TEE_TIME", scheduled_date: "2026-09-19T12:00:00Z", wave_a_start: "2026-09-19T12:00:00Z", wave_a_end: "2026-09-19T16:30:00Z", field_capacity_teams: 4, prize_pool_cents: 0 }
              as: TournamentDirector
              captures: { o_id: $.data.id }
            - call: "POST /outing-ops/contracts"
              payload: { outing_id: "${o_id}", course_name: "Cedar Ridge GC", rate_per_player_cents: 9500, guaranteed_player_count: 0 }
              as: CourseOperations
              captures: { c_id: $.data.id }
            - call: "POST /outing-ops/contracts/${c_id}/lifecycle"
              payload: { action: "SIGN" }
              as: CourseOperations
            - call: "POST /outing-ops/package-tiers"
              payload: { outing_id: "${o_id}", code: "SOLO", kind: "INDIVIDUAL", price_cents: 30000, player_slots: 1, gsv_cents: 0, inventory_cap: 10 }
              as: TournamentDirector
              captures: { ts_id: $.data.id }
            - call: "POST /outing-ops/package-tiers"
              payload: { outing_id: "${o_id}", code: "TEAM4", kind: "TEAM", price_cents: 120000, player_slots: 4, gsv_cents: 24000, inventory_cap: 10 }
              as: TournamentDirector
              captures: { tt_id: $.data.id }
            - call: "POST /outing-ops/outings/${o_id}/play-transition"
              payload: { action: "OPEN_REGISTRATION" }
              as: TournamentDirector
            - call: "POST /outing-ops/registrations"
              payload: { outing_id: "${o_id}", package_tier_id: "${ts_id}", buyer_name: "Solo Alpha", player_count: 1 }
              as: TournamentDirector
              captures: { rs1_id: $.data.id }
            - call: "POST /outing-ops/registrations/${rs1_id}/payment"
              payload: { amount_cents: 30000 }
              as: CharityTreasurer
            - call: "POST /outing-ops/registrations"
              payload: { outing_id: "${o_id}", package_tier_id: "${ts_id}", buyer_name: "Solo Bravo", player_count: 1 }
              as: TournamentDirector
              captures: { rs2_id: $.data.id }
            - call: "POST /outing-ops/registrations"
              payload: { outing_id: "${o_id}", package_tier_id: "${ts_id}", buyer_name: "Solo Charlie", player_count: 1 }
              as: TournamentDirector
              captures: { rs3_id: $.data.id }
            - call: "POST /outing-ops/registrations"
              payload: { outing_id: "${o_id}", package_tier_id: "${tt_id}", buyer_name: "Team Delta", player_count: 4 }
              as: TournamentDirector
              captures: { rt1_id: $.data.id }
            - call: "POST /outing-ops/registrations/${rt1_id}/payment"
              payload: { amount_cents: 120000 }
              as: CharityTreasurer
            - call: "POST /outing-ops/registrations"
              payload: { outing_id: "${o_id}", package_tier_id: "${tt_id}", buyer_name: "Team Echo", player_count: 4 }
              as: TournamentDirector
              captures: { rt2_id: $.data.id }
            - call: "POST /outing-ops/outings"
              payload: { name: "Other Listing Open", beneficiary_name: "Southside Literacy Trust", format: "SCRAMBLE", start_format: "TEE_TIME", scheduled_date: "2026-09-26T12:00:00Z", wave_a_start: "2026-09-26T12:00:00Z", wave_a_end: "2026-09-26T16:30:00Z", field_capacity_teams: 4, prize_pool_cents: 0 }
              as: TournamentDirector
              captures: { o2_id: $.data.id }
            - call: "POST /outing-ops/package-tiers"
              payload: { outing_id: "${o2_id}", code: "SOLO", kind: "INDIVIDUAL", price_cents: 30000, player_slots: 1, gsv_cents: 0, inventory_cap: 10 }
              as: TournamentDirector
              captures: { t2_id: $.data.id }
            - call: "POST /outing-ops/registrations"
              payload: { outing_id: "${o2_id}", package_tier_id: "${t2_id}", buyer_name: "Foreign Buyer", player_count: 1 }
              as: TournamentDirector
              captures: { rf_id: $.data.id }
          trigger:
            - call: "GET /outing-ops/registrations?outing_id=${o_id}"
              as: CharityTreasurer
            - call: "GET /outing-ops/registrations?outing_id=${o_id}&limit=2&offset=0"
              as: CharityTreasurer
            - call: "GET /outing-ops/registrations?outing_id=${o_id}&limit=2&offset=4"
              as: CharityTreasurer
            - call: "GET /outing-ops/registrations?outing_id=${o_id}&status=CONFIRMED"
              as: CharityTreasurer
            - call: "GET /outing-ops/registrations?outing_id=${o_id}&package_tier_id=${ts_id}&status=PENDING_PAYMENT"
              as: CharityTreasurer
            - call: "GET /outing-ops/registrations?outing_id=${o_id}&limit=101"
              as: CharityTreasurer
              captures: { e_limit: $.data.error_id }
          assert:
            - "the unpaginated read is HTTP 200 with total_count == 5, has_more == false and exactly 5 rows - the default limit of 10 covers the whole filtered set, and ${rf_id} from the other outing is absent"
            - "limit=2&offset=0 returns 2 rows with total_count == 5 and has_more == true - total_count describes the filtered set, not the page"
            - "limit=2&offset=4 returns exactly 1 row with total_count == 5 and has_more == false - the last partial page closes the cursor"
            - "status=CONFIRMED returns total_count == 2 (${rs1_id} and ${rt1_id})"
            - "package_tier_id=${ts_id} combined with status=PENDING_PAYMENT returns total_count == 2 (${rs2_id} and ${rs3_id}) - the two filters intersect rather than union"
            - "${e_limit} == 'ERR_INVALID_REQUEST' (HTTP 422) - limit 101 exceeds the declared maximum of 100 and is rejected rather than silently clamped"

      - name: the_pairing_sheet_orders_by_wave_then_starting_hole_then_tee_time_then_created_at
