              as_user_id: "u_officer_1"
              captures: { c_a62_id: "$.data.id" }
            - call: "GET /allotments"
              payload: {}
              as: RangeSpecialist
              as_user_id: "u_spec_1"
            - call: "GET /allotments/00000000-0000-4000-8000-000000000099"
              payload: {}
              as: RangeSpecialist
