          assert:
            - "all three writes against the CLOSED building return HTTP 409 with data.error_id == ERR_SCHOOL_CLOSED"
            - "the same student payload against the ACTIVE building returns HTTP 201 — the sis_student_id was never consumed by the refused call"
            - "GET /rostering/schools/${sch_ne_id} still returns HTTP 200 with status CLOSED and enrolled_student_count 0"
            - "GET /rostering/teachers?school_id=${sch_ne_id} and GET /rostering/sections?school_id=${sch_ne_id} both return total_count 0"

      - name: withdrawn_student_and_separated_teacher_cannot_be_rostered
        claim_type: Triggerable
        grounds:
