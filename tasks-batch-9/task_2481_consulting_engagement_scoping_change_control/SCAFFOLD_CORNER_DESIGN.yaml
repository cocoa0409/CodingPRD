  - name: cross_aggregate_counters_settle_before_the_response_returns
    claim_type: immediate
    grounds:
    - complexity_profile.consistency_model
    - entities.Client.fields.at_risk_engagement_count
    - state_machines.QualityReview.SCHEDULED_to_FAILED
