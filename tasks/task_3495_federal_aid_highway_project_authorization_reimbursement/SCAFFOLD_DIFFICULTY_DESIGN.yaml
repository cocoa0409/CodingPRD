        test_recipe:
          setup:
            - "Project authorized for 500,000 (share 0.80); one final voucher of 500,000 eligible approved (reimbursed 400,000); audit finds 50,000 ineligible and is finalized after the response window: final_eligible 360,000, repayment_due 40,000."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /federal-aid/funding-programs"
              payload: { code: "NHPP", name: "NHPP", eligible_activity_codes: ["ROAD_RESURFACING"] }
              as: PlatformAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /federal-aid/apportionments"
              payload: { funding_program_id: "${prog_id}", state_code: "CA", federal_fiscal_year: 2027, apportioned_cents: 1000000 }
              as: FHWADivisionAdmin
              captures: { ap_id: $.data.id }
            - call: "POST /federal-aid/stips"
              payload: { state_code: "CA", state_federal_land_pct: 0.0, start_federal_fiscal_year: 2027, description: "Net outlay STIP" }
              as: StateDOTPlanner
              captures: { stip_id: $.data.id }
            - call: "POST /federal-aid/stips/${stip_id}/comments"
              payload: { author_name: "Citizen", comment_text: "Ok." }
              as: StateDOTPlanner
            - call: "POST /federal-aid/projects"
              payload: { stip_id: "${stip_id}", funding_program_id: "${prog_id}", route_name: "I-5", description: "P", activity_code: "ROAD_RESURFACING", is_interstate_system: false, dbe_goal_pct: 0.10, total_estimated_cost_cents: 700000 }
              as: StateDOTPlanner
              captures: { p_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-10-02T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /federal-aid/stips/${stip_id}/submit"
              payload: {}
              as: StateDOTPlanner
            - call: "POST /federal-aid/stips/${stip_id}/decide"
              payload: { decision: "APPROVE" }
              as: FHWADivisionAdmin
            - call: "POST /federal-aid/projects/${p_id}/determine-eligibility"
              payload: { determination: "ELIGIBLE" }
              as: FHWADivisionAdmin
            - call: "POST /federal-aid/clearances"
              payload: { project_id: "${p_id}", kind: "ENVIRONMENTAL", nepa_class: "CE" }
              as: StateDOTEngineer
              captures: { c_env: $.data.id }
            - call: "POST /federal-aid/clearances/${c_env}/decide"
              payload: { decision: "CLEARED" }
              as: FHWAReviewer
            - call: "POST /federal-aid/clearances"
              payload: { project_id: "${p_id}", kind: "RIGHT_OF_WAY" }
              as: StateDOTEngineer
              captures: { c_row: $.data.id }
            - call: "POST /federal-aid/clearances/${c_row}/decide"
              payload: { decision: "CLEARED", row_cert_level: "LEVEL_1_FULL" }
              as: FHWAReviewer
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-10-15T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /federal-aid/authorizations"
              payload: { project_id: "${p_id}", agreement_number: "FA-N-1", initial_obligated_cents: 500000 }
              as: FHWADivisionAdmin
              captures: { auth_id: $.data.id }
            - call: "POST /federal-aid/projects/${p_id}/advertise"
              payload: {}
              as: StateDOTEngineer
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-11-06T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /federal-aid/projects/${p_id}/open-bids"
              payload: { bids: [{ contractor_name: "Low", bid_amount_cents: 650000, is_responsive: true }] }
              as: StateDOTEngineer
            - call: "GET /federal-aid/projects/${p_id}/bids"
              payload: {}
              as: FHWAReviewer
              captures: { bid0: "$.data[0].id" }
            - call: "POST /federal-aid/projects/${p_id}/award"
              payload: { bid_id: "${bid0}", dbe_commitment_pct: 0.10 }
              as: FHWAReviewer
            - call: "POST /federal-aid/vouchers"
              payload: { authorization_id: "${auth_id}", period_start_date: "2027-01-01T00:00:00Z", period_end_date: "2027-04-01T00:00:00Z", line_items: [{ description: "all work", eligible_amount_cents: 500000 }], documentation_complete: true, is_final: true }
              as: StateDOTEngineer
              captures: { v_id: $.data.id }
            - call: "POST /federal-aid/vouchers/${v_id}/submit"
              payload: {}
              as: StateDOTEngineer
            - call: "POST /federal-aid/vouchers/${v_id}/decide"
              payload: { decision: "APPROVE" }
              as: FHWAReviewer
              as_user_id: "fhwa_rev_m"
            - call: "POST /federal-aid/audits"
              payload: { project_id: "${p_id}" }
              as: FHWAReviewer
              as_user_id: "fhwa_rev_a"
              captures: { audit_id: $.data.id }
            - call: "POST /federal-aid/audits/${audit_id}/issue-findings"
              payload: { findings_text: "50k ineligible", ineligible_amount_cents: 50000 }
              as: FHWAReviewer
              as_user_id: "fhwa_rev_a"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-12-07T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /federal-aid/audits/${audit_id}/finalize"
              payload: {}
              as: FHWAReviewer
              as_user_id: "fhwa_rev_a"
              captures: { final_elig: $.data.final_eligible_federal_share_cents, due: $.data.repayment_due_cents }
          trigger:
            - call: "POST /federal-aid/audits/${audit_id}/record-repayment"
              payload: { amount_cents: 40000 }
              as: FHWAReviewer
              as_user_id: "fhwa_rev_a"
              captures: { audit_status: $.data.status }
            - call: "GET /federal-aid/authorizations/${auth_id}"
              payload: {}
              as: FHWAReviewer
              captures: { auth_reimb: $.data.reimbursed_cents, auth_repaid: $.data.repaid_cents, auth_obligated: $.data.obligated_cents }
          assert:
            - "at finalize, final_eligible_federal_share_cents == 360000 (round((500,000 - 50,000) x 0.80)) and repayment_due_cents == 40000"
            - "after repayment of 40,000 the audit is CLOSED and Authorization.reimbursed_cents - repaid_cents == 360000 == final_eligible_federal_share_cents"
            - "Authorization.${auth_id}.obligated_cents == 360000 (the net outlay, not the original 500,000)"
