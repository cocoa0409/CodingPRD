scaffold_corner_design:

  # =========================================================================
  # Entities
  # =========================================================================
  - section: entities
    instances:
      - name: create_election_returns_201_with_period1_materialized
        claim_type: Creation
        grounds:
          - entities.Election
          - endpoints["POST /hospice/elections"]
          - state_machines.Election.null_to_ELECTED
        distinguishing_aspect: "POST /elections with all required fields returns 201, status ELECTED, current_period_number 1, days_used_in_period 0, version 1, and materializes benefit period 1."
        test_recipe:
          setup:
            - "Provider exists; clock 2026-01-01."
          setup_api_calls:
            - call: "POST /hospice/providers"
              payload: { name: "EntCreate Hospice", cap_year_start: "2026-01-01T00:00:00Z", per_beneficiary_cap_cents: 3490000 }
              as: BillingAdmin
              captures: { prov_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: BillingAdmin
          trigger:
            - call: "POST /hospice/elections"
              payload: { provider_id: "${prov_id}", patient_name: "New Pt", election_date: "2026-01-01T00:00:00Z", attending_physician_id: "ext-att-c1" }
              as: IntakeCoordinator
              captures: { e_id: $.data.id, st: $.data.status, ver: $.data.version }
          assert:
            - "Election.${e_id}.status == ELECTED"
            - "Election.${e_id}.current_period_number == 1"
            - "Election.${e_id}.days_used_in_period == 0"
            - "Election.${e_id}.version == 1"

      - name: get_election_by_id_returns_stored_entity
        claim_type: Retrieval
        grounds:
          - entities.Election
          - endpoints["GET /hospice/elections/{id}"]
        distinguishing_aspect: "GET /elections/{id} returns the patient_name and provider_id exactly as stored."
        test_recipe:
          setup:
            - "Election exists; clock 2026-01-01."
          setup_api_calls:
            - call: "POST /hospice/providers"
              payload: { name: "EntGet Hospice", cap_year_start: "2026-01-01T00:00:00Z", per_beneficiary_cap_cents: 3490000 }
              as: BillingAdmin
              captures: { prov_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: BillingAdmin
            - call: "POST /hospice/elections"
              payload: { provider_id: "${prov_id}", patient_name: "Stored Pt", election_date: "2026-01-01T00:00:00Z", attending_physician_id: "ext-att-c2" }
              as: IntakeCoordinator
              captures: { e_id: $.data.id }
          trigger:
            - call: "GET /hospice/elections/${e_id}"
              payload: {}
              as: ClinicalManager
              captures: { pn: $.data.patient_name }
          assert:
            - "Election.${e_id}.patient_name == Stored Pt"
            - "Election.${e_id}.provider_id == ${prov_id}"

      - name: list_provider_elections_paginated
        claim_type: Listing
        grounds:
          - endpoints["GET /hospice/providers/{id}/elections"]
        distinguishing_aspect: "GET /providers/{id}/elections returns an array envelope with total_count and has_more pagination fields."
        test_recipe:
          setup:
            - "Provider with one election; clock 2026-01-01."
          setup_api_calls:
            - call: "POST /hospice/providers"
              payload: { name: "EntList Hospice", cap_year_start: "2026-01-01T00:00:00Z", per_beneficiary_cap_cents: 3490000 }
              as: BillingAdmin
              captures: { prov_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: BillingAdmin
            - call: "POST /hospice/elections"
              payload: { provider_id: "${prov_id}", patient_name: "List Pt", election_date: "2026-01-01T00:00:00Z", attending_physician_id: "ext-att-c3" }
              as: IntakeCoordinator
          trigger:
            - call: "GET /hospice/providers/${prov_id}/elections"
              payload: { limit: 10, offset: 0 }
              as: BillingAdmin
          assert:
            - "response_type == array"
            - "meta.total_count == 1"
            - "data array length == 1"

      - name: get_nonexistent_election_returns_404
        claim_type: Not Found
        grounds:
          - endpoints["GET /hospice/elections/{id}"]
          - errors[ERR_RESOURCE_NOT_FOUND]
        distinguishing_aspect: "GET /elections/{random-uuid} returns ERR_RESOURCE_NOT_FOUND with HTTP 404."
        test_recipe:
          setup:
            - "Empty DB."
          setup_api_calls: []
          trigger:
            - call: "GET /hospice/elections/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: ClinicalManager
              captures: { err: $.data.error_id }
          assert:
            - "response_type == error"
            - "data.error_id == ERR_RESOURCE_NOT_FOUND"

      - name: create_election_missing_patient_name_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - entities.Election.fields.patient_name
          - endpoints["POST /hospice/elections"]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "POST /elections omitting patient_name returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup:
            - "Provider exists; clock 2026-01-01."
          setup_api_calls:
            - call: "POST /hospice/providers"
              payload: { name: "EntReq Hospice", cap_year_start: "2026-01-01T00:00:00Z", per_beneficiary_cap_cents: 3490000 }
              as: BillingAdmin
              captures: { prov_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: BillingAdmin
          trigger:
            - call: "POST /hospice/elections"
              payload: { provider_id: "${prov_id}", election_date: "2026-01-01T00:00:00Z", attending_physician_id: "ext-att-c4" }
              as: IntakeCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "response_type == error"
            - "data.error_id == ERR_INVALID_REQUEST"

      - name: care_plan_review_due_offset_default_applied
        claim_type: Defaults
        grounds:
          - entities.CarePlan.fields.review_due_offset_days
          - endpoints["POST /hospice/care-plans"]
        distinguishing_aspect: "Omitting review_due_offset_days on POST /care-plans applies the default 15."
        test_recipe:
          setup:
            - "Election elected 2026-01-01; clock 2026-01-01."
          setup_api_calls:
            - call: "POST /hospice/providers"
              payload: { name: "EntDef Hospice", cap_year_start: "2026-01-01T00:00:00Z", per_beneficiary_cap_cents: 3490000 }
              as: BillingAdmin
              captures: { prov_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: BillingAdmin
            - call: "POST /hospice/elections"
              payload: { provider_id: "${prov_id}", patient_name: "Def Pt", election_date: "2026-01-01T00:00:00Z", attending_physician_id: "ext-att-c5" }
              as: IntakeCoordinator
              captures: { e_id: $.data.id, e_ver: $.data.version }
          trigger:
            - call: "POST /hospice/care-plans"
              payload: { election_id: "${e_id}", idg_members: ["PHYSICIAN","NURSE","SOCIAL_WORK","COUNSELOR"], expected_election_version: "${e_ver}" }
              as: ClinicalManager
              captures: { plan_id: $.data.id, rdo: $.data.review_due_offset_days }
          assert:
            - "CarePlan.${plan_id}.review_due_offset_days == 15"

      - name: careday_payment_cents_is_computed_input_ignored
        claim_type: Computed Fields
        grounds:
          - entities.CareDay.fields.payment_cents
          - endpoints["POST /hospice/care-days"]
        distinguishing_aspect: "payment_cents is server-computed from the rate table; a GIP day yields 110000 and any client-supplied payment_cents is ignored (not an input field)."
        test_recipe:
          setup:
            - "Election elected 2026-01-02; clock 2026-01-02."
          setup_api_calls:
            - call: "POST /hospice/providers"
              payload: { name: "EntComp Hospice", cap_year_start: "2026-01-01T00:00:00Z", per_beneficiary_cap_cents: 3490000 }
              as: BillingAdmin
              captures: { prov_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-02T00:00:00Z" }
              as: BillingAdmin
            - call: "POST /hospice/elections"
              payload: { provider_id: "${prov_id}", patient_name: "Comp Pt", election_date: "2026-01-02T00:00:00Z", attending_physician_id: "ext-att-c6" }
              as: IntakeCoordinator
              captures: { e_id: $.data.id }
          trigger:
            - call: "POST /hospice/care-days"
              payload: { election_id: "${e_id}", service_date: "2026-01-02T00:00:00Z", level_of_care: "GIP", high_intensity: false }
              as: ClinicalManager
              captures: { cd_id: $.data.id }
          assert:
            - "CareDay.${cd_id}.payment_cents == 110000"

      - name: election_id_is_server_minted_uuid
        claim_type: System Fields
        grounds:
          - entities.Election
          - endpoints["POST /hospice/elections"]
        distinguishing_aspect: "Election.id, created_at, version are system-generated; id is a bare UUID with no type prefix and version starts at 1."
        test_recipe:
          setup:
            - "Provider exists; clock 2026-01-01."
          setup_api_calls:
            - call: "POST /hospice/providers"
              payload: { name: "EntSys Hospice", cap_year_start: "2026-01-01T00:00:00Z", per_beneficiary_cap_cents: 3490000 }
              as: BillingAdmin
              captures: { prov_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: BillingAdmin
          trigger:
            - call: "POST /hospice/elections"
              payload: { provider_id: "${prov_id}", patient_name: "Sys Pt", election_date: "2026-01-01T00:00:00Z", attending_physician_id: "ext-att-c7" }
              as: IntakeCoordinator
              captures: { e_id: $.data.id, ver: $.data.version }
          assert:
            - "Election.${e_id}.version == 1"
            - "Election.${e_id}.id matches uuid-without-prefix"

      - name: careday_invalid_level_of_care_enum_rejected
        claim_type: Type Constraints
        grounds:
          - entities.CareDay.fields.level_of_care
          - endpoints["POST /hospice/care-days"]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "POST /care-days with level_of_care='HOSPITAL' (not in {ROUTINE,RESPITE,GIP}) returns ERR_INVALID_REQUEST."
        test_recipe:
          setup:
            - "Election elected 2026-01-02; clock 2026-01-02."
          setup_api_calls:
            - call: "POST /hospice/providers"
              payload: { name: "EntEnum Hospice", cap_year_start: "2026-01-01T00:00:00Z", per_beneficiary_cap_cents: 3490000 }
              as: BillingAdmin
              captures: { prov_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-02T00:00:00Z" }
              as: BillingAdmin
            - call: "POST /hospice/elections"
              payload: { provider_id: "${prov_id}", patient_name: "Enum Pt", election_date: "2026-01-02T00:00:00Z", attending_physician_id: "ext-att-c8" }
              as: IntakeCoordinator
              captures: { e_id: $.data.id }
          trigger:
            - call: "POST /hospice/care-days"
              payload: { election_id: "${e_id}", service_date: "2026-01-02T00:00:00Z", level_of_care: "HOSPITAL", high_intensity: false }
              as: ClinicalManager
              captures: { err: $.data.error_id }
          assert:
            - "response_type == error"
            - "data.error_id == ERR_INVALID_REQUEST"

      - name: election_wrong_provider_id_returns_not_found
        claim_type: Parent Relationships
        grounds:
          - entities.Election.fields.provider_id
          - endpoints["POST /hospice/elections"]
          - errors[ERR_RESOURCE_NOT_FOUND]
        distinguishing_aspect: "POST /elections with a non-existent provider_id returns ERR_RESOURCE_NOT_FOUND (404)."
        test_recipe:
          setup:
            - "Clock 2026-01-01; no provider with the cited id."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: BillingAdmin
          trigger:
            - call: "POST /hospice/elections"
              payload: { provider_id: "00000000-0000-4000-8000-0000000000aa", patient_name: "NoProv Pt", election_date: "2026-01-01T00:00:00Z", attending_physician_id: "ext-att-c9" }
              as: IntakeCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "response_type == error"
            - "data.error_id == ERR_RESOURCE_NOT_FOUND"

  # =========================================================================
  # State Machines
  # =========================================================================
  - section: state_machines
    instances:
      - name: new_election_starts_in_elected
        claim_type: Initial State
        grounds:
          - state_machines.Election.initial_state
          - entities.Election.fields.status
        distinguishing_aspect: "A freshly created Election has status == ELECTED (initial_state)."
        test_recipe:
          setup:
            - "Provider exists; clock 2026-01-01."
          setup_api_calls:
            - call: "POST /hospice/providers"
              payload: { name: "SmInit Hospice", cap_year_start: "2026-01-01T00:00:00Z", per_beneficiary_cap_cents: 3490000 }
              as: BillingAdmin
              captures: { prov_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: BillingAdmin
          trigger:
            - call: "POST /hospice/elections"
              payload: { provider_id: "${prov_id}", patient_name: "Init Pt", election_date: "2026-01-01T00:00:00Z", attending_physician_id: "ext-att-c10" }
              as: IntakeCoordinator
              captures: { e_id: $.data.id }
          assert:
            - "Election.${e_id}.status == ELECTED"

      - name: revoke_already_revoked_election_rejected
        claim_type: Invalid Transitions
        grounds:
          - state_machines.Election.ELECTED_to_REVOKED
          - validations[priority=4]
          - errors[ERR_ELECTION_NOT_ELECTED]
          - endpoints["POST /hospice/elections/{id}/revoke"]
        distinguishing_aspect: "A second revoke on an already-REVOKED election returns ERR_ELECTION_NOT_ELECTED (409); no side effects."
        test_recipe:
          setup:
            - "Election elected 2026-01-01, revoked 2026-01-05; clock 2026-01-05."
          setup_api_calls:
            - call: "POST /hospice/providers"
              payload: { name: "SmInv Hospice", cap_year_start: "2026-01-01T00:00:00Z", per_beneficiary_cap_cents: 3490000 }
              as: BillingAdmin
              captures: { prov_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: BillingAdmin
            - call: "POST /hospice/elections"
              payload: { provider_id: "${prov_id}", patient_name: "Inv Pt", election_date: "2026-01-01T00:00:00Z", attending_physician_id: "ext-att-c11" }
              as: IntakeCoordinator
              captures: { e_id: $.data.id }
            - call: "POST /hospice/elections/${e_id}/revoke"
              payload: { revocation_date: "2026-01-05T00:00:00Z" }
              as: IntakeCoordinator
          trigger:
            - call: "POST /hospice/elections/${e_id}/revoke"
              payload: { revocation_date: "2026-01-06T00:00:00Z" }
              as: IntakeCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "response_type == error"
            - "data.error_id == ERR_ELECTION_NOT_ELECTED"

      - name: discharge_terminal_election_locked
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.Election.terminal_states
          - state_machines.Election.ELECTED_to_DISCHARGED
          - errors[ERR_ELECTION_NOT_ELECTED]
          - endpoints["POST /hospice/elections/{id}/discharge"]
        distinguishing_aspect: "Discharging an already-DISCHARGED election returns ERR_ELECTION_NOT_ELECTED — terminal states accept no transitions."
        test_recipe:
          setup:
            - "Election elected 2026-01-01, discharged (DEATH) 2026-01-05; clock 2026-01-05."
          setup_api_calls:
            - call: "POST /hospice/providers"
              payload: { name: "SmTerm Hospice", cap_year_start: "2026-01-01T00:00:00Z", per_beneficiary_cap_cents: 3490000 }
              as: BillingAdmin
              captures: { prov_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: BillingAdmin
            - call: "POST /hospice/elections"
              payload: { provider_id: "${prov_id}", patient_name: "Term Pt", election_date: "2026-01-01T00:00:00Z", attending_physician_id: "ext-att-c12" }
              as: IntakeCoordinator
              captures: { e_id: $.data.id }
            - call: "POST /hospice/elections/${e_id}/discharge"
              payload: { discharge_date: "2026-01-05T00:00:00Z", discharge_reason: "DEATH" }
              as: ClinicalManager
          trigger:
            - call: "POST /hospice/elections/${e_id}/discharge"
              payload: { discharge_date: "2026-01-06T00:00:00Z", discharge_reason: "DEATH" }
              as: ClinicalManager
              captures: { err: $.data.error_id }
          assert:
            - "response_type == error"
            - "data.error_id == ERR_ELECTION_NOT_ELECTED"

      - name: discharge_by_death_sets_bereavement_required
        claim_type: Side Effect Execution
        grounds:
          - state_machines.Election.ELECTED_to_DISCHARGED
          - entities.Election.fields.bereavement_required
          - endpoints["POST /hospice/elections/{id}/discharge"]
        distinguishing_aspect: "Discharge with discharge_reason=DEATH sets bereavement_required=true; status becomes DISCHARGED."
        test_recipe:
          setup:
            - "Election elected 2026-01-01; clock 2026-01-05."
          setup_api_calls:
            - call: "POST /hospice/providers"
              payload: { name: "SmSe Hospice", cap_year_start: "2026-01-01T00:00:00Z", per_beneficiary_cap_cents: 3490000 }
              as: BillingAdmin
              captures: { prov_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: BillingAdmin
            - call: "POST /hospice/elections"
              payload: { provider_id: "${prov_id}", patient_name: "Se Pt", election_date: "2026-01-01T00:00:00Z", attending_physician_id: "ext-att-c13" }
              as: IntakeCoordinator
              captures: { e_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-05T00:00:00Z" }
              as: BillingAdmin
          trigger:
            - call: "POST /hospice/elections/${e_id}/discharge"
              payload: { discharge_date: "2026-01-05T00:00:00Z", discharge_reason: "DEATH" }
              as: ClinicalManager
              captures: { st: $.data.status, ber: $.data.bereavement_required }
          assert:
            - "Election.${e_id}.status == DISCHARGED"
            - "Election.${e_id}.bereavement_required == true"

      - name: revoke_does_not_set_bereavement_required
        claim_type: Side Effect Execution
        grounds:
          - state_machines.Election.ELECTED_to_REVOKED
          - entities.Election.fields.bereavement_required
          - endpoints["POST /hospice/elections/{id}/revoke"]
        distinguishing_aspect: "Revocation leaves bereavement_required=false (revocation is not death) and sets revocation_date."
        test_recipe:
          setup:
            - "Election elected 2026-01-01; clock 2026-01-05."
          setup_api_calls:
            - call: "POST /hospice/providers"
              payload: { name: "SmRev Hospice", cap_year_start: "2026-01-01T00:00:00Z", per_beneficiary_cap_cents: 3490000 }
              as: BillingAdmin
              captures: { prov_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: BillingAdmin
            - call: "POST /hospice/elections"
              payload: { provider_id: "${prov_id}", patient_name: "Rev Pt", election_date: "2026-01-01T00:00:00Z", attending_physician_id: "ext-att-c14" }
              as: IntakeCoordinator
              captures: { e_id: $.data.id }
          trigger:
            - call: "POST /hospice/elections/${e_id}/revoke"
              payload: { revocation_date: "2026-01-05T00:00:00Z" }
              as: IntakeCoordinator
              captures: { st: $.data.status, ber: $.data.bereavement_required }
          assert:
            - "Election.${e_id}.status == REVOKED"
            - "Election.${e_id}.bereavement_required == false"

      - name: election_expires_when_period_lapses_uncertified
        claim_type: guarded transitions
        grounds:
          - state_machines.Election.ELECTED_to_EXPIRED
          - endpoints["POST /_clock/set_current_utc"]
        distinguishing_aspect: "Advancing the clock past the end of period 1 (90 days) while period 1 is still PENDING_CERT auto-transitions the election to EXPIRED."
        test_recipe:
          setup:
            - "Election elected 2026-01-01, period 1 never certified; clock 2026-01-01."
          setup_api_calls:
            - call: "POST /hospice/providers"
              payload: { name: "SmExp Hospice", cap_year_start: "2026-01-01T00:00:00Z", per_beneficiary_cap_cents: 3490000 }
              as: BillingAdmin
              captures: { prov_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: BillingAdmin
            - call: "POST /hospice/elections"
              payload: { provider_id: "${prov_id}", patient_name: "Exp Pt", election_date: "2026-01-01T00:00:00Z", attending_physician_id: "ext-att-c15" }
              as: IntakeCoordinator
              captures: { e_id: $.data.id }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: BillingAdmin
          assert:
            - "Election.${e_id}.status == EXPIRED"

      - name: certify_out_of_order_period_sequence_rejected
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.Certification.DRAFT_to_CERTIFIED
          - validations[priority=6]
          - errors[ERR_PERIOD_SEQUENCE_MISMATCH]
          - endpoints["POST /hospice/certifications"]
        distinguishing_aspect: "Certifying period_sequence 2 while period 1 is still PENDING_CERT returns ERR_PERIOD_SEQUENCE_MISMATCH."
        test_recipe:
          setup:
            - "Election elected 2026-01-01; medical-director physician; period 1 PENDING_CERT (never certified)."
          setup_api_calls:
            - call: "POST /hospice/providers"
              payload: { name: "SmSeq Hospice", cap_year_start: "2026-01-01T00:00:00Z", per_beneficiary_cap_cents: 3490000 }
              as: BillingAdmin
              captures: { prov_id: $.data.id }
            - call: "POST /hospice/physicians"
