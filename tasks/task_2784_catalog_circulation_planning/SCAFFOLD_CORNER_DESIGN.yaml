      - name: the_waterfall_fills_by_priority_and_clamps_on_audience_then_budget
        claim_type: waterfall_allocation
        grounds:
          - calculations.drop_allocation_waterfall
          - calculations.drop_provisional_cost_per_book
          - entities.CirculationLine.fields.allocation_rank
        distinguishing_aspect: "Three lines are arranged so that each of the three clamps binds on a different line: rank 1 is clamped by its audience cap (8000 of 12000 requested), rank 2 gets its full request, and rank 3 is clamped by the floored budget cap to 5637 of 9000. The rental line is also the only one carrying a per-name surcharge, so its unit cost is 237 while the housefile lines pay 228 - a handler that applies one unit cost to the whole drop lands on a different remainder."
        test_recipe:
          setup:
            - "Season FW26; plan P1 budget 10000000."
            - "S_HI (rfm 1000, 8000 names, aov 18500, response 620) and S_LO (rfm 660, 30000 names, aov 12000, response 400)."
            - "Rental R1: coop 640, gross 10000, housefile overlap 1000 bps, inter-list 0, 8500 per thousand, so unit_cost_cents_per_name 9 and net_names_delivered 9000 after the merge-purge run."
            - "Drop 1 at page_count 64 with lines L_LO (30000), L_R (9000) and L_HI (12000) created in that order, so priority - not creation order - decides the ranks."
            - "requested_quantity_total 51000 sits in the >= 40000 rebate band, so the provisional cost per book is round_half_up(166.4 * 0.95) == 158 printing + 15 paper + 55 postage == 228."
          setup_api_calls:
            - call: "POST /catalog-circulation/seasons"
              payload: { season_code: "FW26", fiscal_year: 2026 }
              as: PlatformAdmin
              captures: { season_id: "$.data.id" }
