# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- StateProfile / StateStandard -----------------------------------------
  - method: POST
    path: "/state-profiles"
    description: "Register an adopting state with its submission requirements, content rules and pricing limits"
    roles: [PlatformAdmin]
    code: 201
    input: [state_code, adoption_model, "sampling_copies_required?", "comment_response_days?", "required_topics?", "prohibited_content_tags?", "multi_year_max_years?", "price_cap_cents?", "min_verified_coverage_pct?", "accessibility_standard?", "rostering_standard?", "data_privacy_addendum_required?"]
    output: StateProfile
    side_effects: ["state_code uniqueness enforced (ERR_DUPLICATE_RESOURCE)"]
  - method: GET
    path: "/state-profiles/{id}"
    description: "Read one state profile"
    roles: [PlatformAdmin, StateAdoptionOfficer, PublisherEditor, EditorialDirector, PricingManager, SalesRep, ReviewCommitteeMember]
    code: 200
    input: []
    output: StateProfile
    side_effects: []
  - method: POST
    path: "/state-profiles/{id}/standards"
    description: "Add one academic standard to the state's framework for a subject and grade band"
    roles: [PlatformAdmin, StateAdoptionOfficer]
    code: 201
    input: [subject, standard_code, grade_low, grade_high, weight, "is_focus?"]
    output: StateStandard
    side_effects:
      - "state_id set from the path"
      - "standard_code uniqueness per (state_id, subject) enforced (ERR_DUPLICATE_RESOURCE)"
      - "StateAdoptionOfficer callers must act on their own state (ERR_STATE_SCOPE_VIOLATION)"
  - method: GET
    path: "/state-profiles/{id}/standards"
    description: "List the state's framework standards, optionally narrowed to one subject"
    roles: [PlatformAdmin, StateAdoptionOfficer, PublisherEditor, EditorialDirector, ReviewCommitteeMember]
    code: 200
    input: ["subject?", "is_focus?", "limit?", "offset?"]
    output: StateStandard[]
    side_effects: []

  # --- AdoptionCycle --------------------------------------------------------
  - method: POST
    path: "/adoption-cycles"
    description: "Open an adoption cycle for a subject rotation slot with its calendar of phase timestamps"
    roles: [StateAdoptionOfficer]
    code: 201
    input: [state_id, subject, cycle_year, submission_open_at, submission_deadline_at, committee_review_at, public_comment_start_at, public_comment_end_at, adoption_decision_at, contract_term_years]
    output: AdoptionCycle
    side_effects:
      - "status set to SCHEDULED and phase_epoch to 0"
      - "half-open submission window checked against every existing cycle of the same (state_id, subject) (ERR_CYCLE_WINDOW_OVERLAP)"
  - method: GET
    path: "/adoption-cycles/{id}"
    description: "Read one adoption cycle with its phase and submission counters"
    roles: [PlatformAdmin, StateAdoptionOfficer, PublisherEditor, EditorialDirector, PricingManager, ReviewCommitteeMember, SalesRep]
    code: 200
    input: []
    output: AdoptionCycle
    side_effects: []
  - method: GET
    path: "/adoption-cycles"
    description: "List adoption cycles filtered by state, subject or phase"
    roles: [PlatformAdmin, StateAdoptionOfficer, PublisherEditor, EditorialDirector, PricingManager, ReviewCommitteeMember, SalesRep]
    code: 200
    input: ["state_id?", "subject?", "cycle_year?", "status?", "limit?", "offset?"]
    output: AdoptionCycle[]
    side_effects: []
  - method: POST
    path: "/adoption-cycles/{id}/phase-advance"
    description: "Advance the cycle exactly one phase when the logical clock has reached that phase's timestamp, running the shared epoch sweep S1-S3"
    roles: [StateAdoptionOfficer]
    code: 200
    input: []
    output: AdoptionCycle
    side_effects:
      - "status advances one step along SCHEDULED -> OPEN -> CLOSED_FOR_SUBMISSION -> IN_REVIEW -> PUBLIC_COMMENT -> DECIDED -> ARCHIVED"
      - "phase_epoch incremented by 1"
      - "sweep S1: overdue OPEN public comments of this cycle's submissions become ESCALATED"
      - "sweep S2: every submission of this cycle recomputes comment counters, compliance_score and adoption_blocked"
      - "sweep S3: RESERVED slots of newly blocked submissions become CANCELLED, panel reserved_minutes released, SCHEDULED submissions fall back to FILED"
      - "on OPEN -> CLOSED_FOR_SUBMISSION: DRAFT submissions of this cycle become WITHDRAWN"
      - "on PUBLIC_COMMENT -> DECIDED: remaining FILED, SCHEDULED and PRESENTED submissions become NOT_ADOPTED and their RESERVED slots CANCELLED"
  - method: GET
    path: "/adoption-cycles/{id}/panels"
    description: "List the review committee panels seated for this cycle"
    roles: [PlatformAdmin, StateAdoptionOfficer, PublisherEditor, ReviewCommitteeMember]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: CommitteePanel[]
    side_effects: []

  # --- Title / AncillaryBundle ---------------------------------------------
  - method: POST
    path: "/titles"
    description: "Create a print program edition in DRAFT with its seed content tags, page count and press signature capacity"
    roles: [PlatformAdmin, PublisherEditor]
    code: 201
    input: [isbn_base, subject, grade_low, grade_high, "edition_number?", copyright_year, "content_tags?", page_count, signature_page_capacity, list_price_cents]
    output: Title
    side_effects:
      - "page_budget_remaining set to signature_page_capacity - page_count"
      - "content_revision set to 1; all inventory counters set to 0"
      - "isbn_base uniqueness enforced (ERR_DUPLICATE_RESOURCE)"
  - method: GET
    path: "/titles/{id}"
    description: "Read one title with its content, page-budget and inventory counters"
    roles: [PlatformAdmin, PublisherEditor, EditorialDirector, PricingManager, SalesRep, StateAdoptionOfficer, ReviewCommitteeMember]
    code: 200
    input: []
    output: Title
    side_effects: []
  - method: POST
    path: "/titles/{id}/release"
    description: "Release a DRAFT edition to ACTIVE so it may be submitted, priced and ordered"
    roles: [PublisherEditor]
    code: 200
    input: ["note?"]
    output: Title
    side_effects: ["status moves DRAFT -> ACTIVE"]
  - method: POST
    path: "/titles/{id}/inventory-adjustments"
    description: "Receive print units into the warehouse or write units off, preserving the print-unit ledger identity"
    roles: [PlatformAdmin, EditorialDirector]
    code: 200
    input: [adjustment_type, units, "reason?"]
    output: Title
    side_effects:
      - "RECEIPT: total_received_units += units and on_hand_units += units"
      - "WRITE_OFF: on_hand_units -= units and written_off_units += units, refused when on_hand_units < units (ERR_INSUFFICIENT_PRINT_INVENTORY)"
      - "total_received_units == on_hand_units + committed_units + sample_reserved_units + fulfilled_units + written_off_units holds after every adjustment"
  - method: POST
    path: "/titles/{id}/revision-plan"
    description: "Plan, cancel or execute the next revision cycle of the edition against the adoption calendar"
    roles: [EditorialDirector]
    code: 200
    input: [action, "revision_target_cycle_year?"]
    output: Title
    side_effects:
      - "action PLAN: status ACTIVE -> REVISION_PLANNED and revision_target_cycle_year recorded"
      - "action CANCEL_PLAN: status REVISION_PLANNED -> ACTIVE and revision_target_cycle_year reset to null"
      - "action SUNSET: status REVISION_PLANNED -> SUNSET, written_off_units += on_hand_units, on_hand_units set to 0"
  - method: POST
    path: "/titles/{id}/ancillary-bundles"
    description: "Define an ancillary bundle with its component count, digital seat price, rostering standard and accessibility and privacy commitments"
    roles: [PricingManager]
    code: 201
    input: [bundle_code, component_count, component_list_total_cents, digital_seat_price_cents, rostering_standard, accessibility_conformance, "privacy_addendum_signed?"]
    output: AncillaryBundle
    side_effects:
      - "title_id set from the path"
      - "bundle_code uniqueness per title_id enforced (ERR_DUPLICATE_RESOURCE)"
  - method: GET
    path: "/titles/{id}/ancillary-bundles"
    description: "List the ancillary bundles defined for this title"
    roles: [PlatformAdmin, PricingManager, PublisherEditor, StateAdoptionOfficer, SalesRep]
    code: 200
    input: ["rostering_standard?", "limit?", "offset?"]
    output: AncillaryBundle[]
    side_effects: []

  # --- ContentEdit ---------------------------------------------------------
  - method: POST
    path: "/content-edits"
    description: "Propose a state-specific content change adding a required topic, removing a prohibited tag or substituting regional material"
    roles: [PublisherEditor]
    code: 201
    input: [title_id, state_id, edit_type, topic_code, pages_delta, rationale]
    output: ContentEdit
    side_effects:
      - "status set to PROPOSED, revision_round to 1"
      - "proposed_by_user_id set from X-User-ID"
  - method: GET
    path: "/content-edits/{id}"
    description: "Read one content edit"
    roles: [PlatformAdmin, PublisherEditor, EditorialDirector, StateAdoptionOfficer]
    code: 200
    input: []
    output: ContentEdit
    side_effects: []
  - method: GET
    path: "/content-edits"
    description: "List content edits filtered by title, state, type or workflow status"
    roles: [PlatformAdmin, PublisherEditor, EditorialDirector, StateAdoptionOfficer]
    code: 200
    input: ["title_id?", "state_id?", "edit_type?", "status?", "limit?", "offset?"]
    output: ContentEdit[]
    side_effects: []
  - method: POST
    path: "/content-edits/{id}/review"
    description: "Record the editorial director's approve or reject verdict on a proposed edit; the reviewer must differ from the proposer"
    roles: [EditorialDirector]
    code: 200
    input: [verdict, "rejection_reason?"]
    output: ContentEdit
    side_effects:
      - "verdict APPROVE: status PROPOSED -> APPROVED and rejection_reason cleared"
      - "verdict REJECT: status PROPOSED -> REJECTED and rejection_reason stored"
      - "reviewed_by_user_id set from X-User-ID"
  - method: POST
    path: "/content-edits/{id}/resubmit"
    description: "Resubmit a rejected edit for another review round, up to MAX_REVISION_ROUNDS rounds"
    roles: [PublisherEditor]
    code: 200
    input: ["topic_code?", "pages_delta?", "rationale?"]
    output: ContentEdit
    side_effects:
      - "status REJECTED -> PROPOSED and revision_round incremented by 1"
      - "proposed_by_user_id overwritten with X-User-ID; supplied topic_code, pages_delta and rationale overwrite the stored values"
  - method: POST
    path: "/content-edits/{id}/apply"
    description: "Apply an approved edit to the edition, bumping content_revision and cascading staleness through submissions, slots and panels"
    roles: [EditorialDirector]
    code: 200
    input: []
    output: ContentEdit
    side_effects:
      - "HOP 1: title.page_count += pages_delta, page_budget_remaining -= pages_delta, content_revision += 1, content_tags mutated per edit_type"
      - "HOP 2: submissions of this title in {FILED, SCHEDULED, PRESENTED} with an older pin set content_pin_stale true, recompute compliance_score and set adoption_blocked true"
      - "HOP 3: RESERVED slots of those submissions become CANCELLED and their panels' reserved_minutes decrease"
      - "HOP 4: affected submissions with no remaining slot in {RESERVED, PRESENTED, TALLIED} move review_status SCHEDULED -> FILED and decrement cycle.scheduled_submission_count"
  - method: POST
    path: "/content-edits/{id}/revert"
    description: "Compensate an applied edit, restoring page count, page budget and content tags"
    roles: [EditorialDirector]
    code: 200
    input: ["reason?"]
    output: ContentEdit
    side_effects:
      - "status APPLIED -> REVERTED"
      - "title.page_count -= pages_delta and page_budget_remaining += pages_delta, restoring page_count + page_budget_remaining == signature_page_capacity"
      - "content_tags change of the apply is undone and content_revision += 1"
      - "submissions of this title in {FILED, SCHEDULED, PRESENTED} recompute their compliance counters"

  # --- Submission / CorrelationEntry ---------------------------------------
  - method: POST
    path: "/submissions"
    description: "Start a DRAFT submission of one title into one state adoption cycle"
    roles: [PublisherEditor]
    code: 201
    input: [cycle_id, title_id]
    output: Submission
    side_effects:
      - "review_status DRAFT, pricing_status UNPRICED"
      - "sampling_status seeded by sampling_fulfilment from the state's sampling_copies_required"
      - "compliance counters and compliance_score computed from the state's content rules"
      - "duplicate live submission per (cycle_id, title_id) refused (ERR_DUPLICATE_SUBMISSION)"
  - method: GET
    path: "/submissions/{id}"
    description: "Read one submission with both status dimensions, coverage percentages and compliance counters"
    roles: [PlatformAdmin, PublisherEditor, EditorialDirector, StateAdoptionOfficer, ReviewCommitteeMember, PricingManager]
    code: 200
    input: []
    output: Submission
    side_effects: []
  - method: GET
    path: "/submissions"
    description: "List submissions filtered by cycle, title or either status dimension"
    roles: [PlatformAdmin, PublisherEditor, EditorialDirector, StateAdoptionOfficer, ReviewCommitteeMember, PricingManager]
    code: 200
    input: ["cycle_id?", "title_id?", "review_status?", "pricing_status?", "adoption_blocked?", "limit?", "offset?"]
    output: Submission[]
    side_effects: []
  - method: POST
    path: "/submissions/{id}/correlations"
    description: "Document one correlation entry mapping submitted content to a state standard with an evidence citation"
    roles: [PublisherEditor]
    code: 201
    input: [standard_code, depth_level, page_reference, evidence_citation]
    output: CorrelationEntry
    side_effects:
      - "submission_id set from the path; reviewer_verdict set to PENDING"
      - "standard_code validated against the cycle's state and subject framework (ERR_STANDARD_NOT_IN_FRAMEWORK)"
      - "effective_weight computed as standard.weight x the depth multiplier"
      - "submission.self_reported_coverage_pct and verified_coverage_pct recomputed by correlation_coverage"
  - method: GET
    path: "/submissions/{id}/correlations"
    description: "List the submission's correlation entries with their committee verdicts"
    roles: [PlatformAdmin, PublisherEditor, ReviewCommitteeMember, StateAdoptionOfficer]
    code: 200
    input: ["reviewer_verdict?", "depth_level?", "limit?", "offset?"]
    output: CorrelationEntry[]
    side_effects: []
  - method: POST
    path: "/submissions/{id}/correlations/{entryId}/verdict"
    description: "Record a committee member's verdict on one correlation entry's evidence citation"
    roles: [ReviewCommitteeMember]
    code: 200
    input: [verdict]
    output: CorrelationEntry
    side_effects:
      - "verdict ACCEPT sets reviewer_verdict ACCEPTED; verdict INSUFFICIENT sets reviewer_verdict INSUFFICIENT"
      - "verdict_by_user_id set from X-User-ID"
      - "submission.self_reported_coverage_pct and verified_coverage_pct recomputed by correlation_coverage"
  - method: POST
    path: "/submissions/{id}/file"
    description: "File the submission with the state, pinning the title's content revision and enforcing every submission requirement"
    roles: [PublisherEditor]
    code: 200
    input: []
    output: Submission
    side_effects:
      - "review_status DRAFT -> FILED and filed_at set to the logical clock"
      - "pinned_content_revision set to title.content_revision and content_pin_stale set to false"
      - "cycle.submission_count incremented by 1"
      - "compliance_score and adoption_blocked recomputed"
  - method: POST
    path: "/submissions/{id}/withdraw"
    description: "Withdraw a submission, either back to DRAFT for revision or abandoning it entirely"
    roles: [PublisherEditor]
    code: 200
    input: [reason]
    output: Submission
    side_effects:
      - "reason REVISE from FILED: review_status -> DRAFT, cycle.submission_count decremented, pin reset to null"
      - "reason REVISE from SCHEDULED: RESERVED slots become CANCELLED, panel reserved_minutes released, then review_status -> DRAFT"
      - "reason ABANDON from DRAFT: review_status -> WITHDRAWN and the submission becomes read-only"
  - method: POST
    path: "/submissions/{id}/sampling-shipments"
    description: "Ship print sample copies toward the state's sampling requirement, drawing them out of on-hand inventory"
    roles: [PublisherEditor]
    code: 200
    input: [units, "carrier_ref?"]
    output: Submission
    side_effects:
      - "sample_copies_shipped += units and sampling_status recomputed by sampling_fulfilment"
      - "title.on_hand_units -= units and title.sample_reserved_units += units"
      - "refused when title.on_hand_units < units (ERR_INSUFFICIENT_PRINT_INVENTORY)"
  - method: POST
    path: "/submissions/{id}/public-comments"
    description: "Record a public comment against a filed submission, starting the response clock"
    roles: [PublicCommenter, StateAdoptionOfficer]
    code: 201
    input: [commenter_ref, category, severity, body]
    output: PublicComment
    side_effects:
      - "submission_id set from the path; status set to OPEN"
      - "response_due_at set to created_at + state.comment_response_days days by comment_response_obligation"
      - "submission.unresolved_critical_count, compliance_score and adoption_blocked recomputed"
  - method: GET
    path: "/submissions/{id}/public-comments"
    description: "List the public comments filed against this submission"
    roles: [PlatformAdmin, PublisherEditor, StateAdoptionOfficer, ReviewCommitteeMember, PublicCommenter]
    code: 200
    input: ["status?", "severity?", "category?", "limit?", "offset?"]
    output: PublicComment[]
    side_effects: []
  - method: POST
    path: "/public-comments/{id}/response"
    description: "Publish the publisher's response to a public comment, on time or late"
    roles: [PublisherEditor]
    code: 200
    input: [response_body]
    output: PublicComment
    side_effects:
      - "status OPEN or ESCALATED -> RESPONDED, responded_at set to the logical clock"
      - "was_overdue_at_response set true when the comment had escalated or clock_now >= response_due_at"
      - "submission.unresolved_critical_count, overdue_response_count, compliance_score and adoption_blocked recomputed"

  # --- CommitteePanel / PresentationSlot / CommitteeVote --------------------
  - method: POST
    path: "/committee-panels"
    description: "Seat a review committee panel for a cycle with its session window, turnover buffer and quorum"
    roles: [StateAdoptionOfficer]
    code: 201
    input: [cycle_id, panel_label, session_start_at, session_end_at, "buffer_minutes?", "slot_minutes_capacity?", member_count, quorum_required]
    output: CommitteePanel
    side_effects:
      - "status set to SCHEDULED; reserved_minutes set to 0"
      - "slot_minutes_capacity taken from the payload, or defaulted to the whole minutes between session_start_at and session_end_at when omitted; a supplied value above the session length is refused with ERR_INVALID_REQUEST"
  - method: GET
    path: "/committee-panels/{id}"
    description: "Read one panel with its capacity and reservation counters"
    roles: [PlatformAdmin, StateAdoptionOfficer, ReviewCommitteeMember, PublisherEditor]
    code: 200
    input: []
    output: CommitteePanel
    side_effects: []
  - method: POST
    path: "/committee-panels/{id}/slots"
    description: "Reserve a presentation slot for a filed submission inside the panel's session, honouring the turnover buffer and the panel's minute budget"
    roles: [StateAdoptionOfficer]
    code: 201
    input: [submission_id, start_at, end_at, expected_panel_version]
    output: PresentationSlot
    side_effects:
      - "panel_id set from the path; status set to RESERVED and duration_minutes computed"
      - "panel.reserved_minutes += duration_minutes and panel.version incremented by 1"
      - "submission.review_status FILED -> SCHEDULED and cycle.scheduled_submission_count incremented by 1"
  - method: POST
    path: "/committee-panels/{id}/open-session"
    description: "Open the panel session once the cycle is in review and the clock has reached session_start_at"
    roles: [StateAdoptionOfficer]
    code: 200
    input: []
    output: CommitteePanel
    side_effects:
      - "status SCHEDULED -> IN_SESSION; further slot reservations are refused"
  - method: POST
    path: "/committee-panels/{id}/close-session"
    description: "Close the panel session, marking still-reserved slots as no-shows"
    roles: [StateAdoptionOfficer]
    code: 200
    input: []
    output: CommitteePanel
    side_effects:
      - "status IN_SESSION -> CLOSED"
      - "every RESERVED slot moves to NO_SHOW with reserved_minutes unchanged"
      - "each affected submission with no slot left in {RESERVED, PRESENTED, TALLIED} moves review_status SCHEDULED -> FILED"
  - method: GET
    path: "/presentation-slots/{id}"
    description: "Read one presentation slot with its tally outcome and ratio"
    roles: [PlatformAdmin, StateAdoptionOfficer, ReviewCommitteeMember, PublisherEditor]
    code: 200
    input: []
    output: PresentationSlot
    side_effects: []
  - method: GET
    path: "/presentation-slots"
    description: "List presentation slots filtered by panel, submission or slot status"
    roles: [PlatformAdmin, StateAdoptionOfficer, ReviewCommitteeMember, PublisherEditor]
    code: 200
    input: ["panel_id?", "submission_id?", "status?", "tally_outcome?", "limit?", "offset?"]
    output: PresentationSlot[]
    side_effects: []
  - method: POST
    path: "/presentation-slots/{id}/present"
    description: "Mark the submission as presented to the seated committee at its slot"
    roles: [StateAdoptionOfficer]
    code: 200
    input: []
    output: PresentationSlot
    side_effects:
      - "status RESERVED -> PRESENTED"
      - "submission.review_status SCHEDULED -> PRESENTED"
  - method: POST
    path: "/presentation-slots/{id}/votes"
    description: "Cast or recast a committee member's ballot on a presented submission; ballots are append-only and the member's latest ballot supersedes the earlier ones"
    roles: [ReviewCommitteeMember]
    code: 201
    input: [vote, rationale]
    output: CommitteeVote
    side_effects:
      - "slot_id set from the path; member_user_id set from X-User-ID; sequence_no assigned as the next per-slot integer starting at 1"
      - "every earlier ballot of the same member on this slot sets superseded true"
  - method: GET
    path: "/presentation-slots/{id}/votes"
    description: "List the ballot log of a slot including superseded ballots"
    roles: [PlatformAdmin, StateAdoptionOfficer, ReviewCommitteeMember]
    code: 200
    input: ["vote?", "superseded?", "limit?", "offset?"]
    output: CommitteeVote[]
    side_effects: []
  - method: POST
    path: "/presentation-slots/{id}/tally"
    description: "Tally the slot's ballot log into a committee recommendation and branch the submission to its terminal review status"
    roles: [StateAdoptionOfficer]
    code: 200
    input: []
    output: PresentationSlot
    side_effects:
      - "counted_vote_count, recommend_ratio and tally_outcome written by committee_tally; status PRESENTED -> TALLIED"
      - "BRANCH RECOMMEND or RECOMMEND_WITH_CONDITIONS with every adoption gate met: submission.review_status -> ADOPTED or ADOPTED_WITH_CONDITIONS, title.adopted_state_codes gains the state code, the APPROVED PricingProposal sets contract_locked true, cycle.adopted_count incremented and submission_count decremented"
      - "BRANCH REJECT, or any adoption gate unmet: submission.review_status -> NOT_ADOPTED and cycle.submission_count decremented"

  # --- PricingProposal -----------------------------------------------------
  - method: POST
    path: "/pricing-proposals"
    description: "File a multi-year price and contract-term proposal for a submission, superseding any live proposal on the same submission"
    roles: [PricingManager]
    code: 201
    input: [submission_id, "bundle_id?", base_price_cents, term_years, annual_escalator_bps, projected_adoption_units, digital_seat_price_cents, expected_submission_version]
    output: PricingProposal
    side_effects:
      - "discount tiers, total_discount_pct, net_state_price_cents and avg_annual_price_cents written by state_net_price"
      - "status set to FILED and submission.pricing_status set to PRICE_FILED"
      - "any prior FILED or APPROVED proposal of the submission with contract_locked false moves to SUPERSEDED"
      - "submission.version incremented by 1"
  - method: GET
    path: "/pricing-proposals/{id}"
    description: "Read one pricing proposal with its computed discounts and net price"
    roles: [PlatformAdmin, PricingManager, StateAdoptionOfficer, SalesRep]
    code: 200
    input: []
    output: PricingProposal
    side_effects: []
  - method: GET
    path: "/pricing-proposals"
    description: "List pricing proposals filtered by submission, bundle or review status"
    roles: [PlatformAdmin, PricingManager, StateAdoptionOfficer, SalesRep]
    code: 200
    input: ["submission_id?", "bundle_id?", "status?", "contract_locked?", "limit?", "offset?"]
    output: PricingProposal[]
    side_effects: []
  - method: POST
    path: "/pricing-proposals/{id}/decision"
    description: "Record the state's approval or rejection of a filed price proposal"
    roles: [StateAdoptionOfficer]
    code: 200
    input: [verdict, "reason?"]
    output: PricingProposal
    side_effects:
      - "verdict APPROVE: status FILED -> APPROVED and submission.pricing_status -> PRICE_APPROVED"
      - "verdict REJECT: status FILED -> REJECTED and submission.pricing_status -> PRICE_REJECTED"
      - "decision_officer_ref set from X-User-ID"

  # --- DistrictOrder -------------------------------------------------------
  - method: POST
    path: "/district-orders"
    description: "Quote a district order for a released title, at list price in open territory or against an approved state price filing"
    roles: [SalesRep]
    code: 201
    input: [district_ref, state_id, title_id, "pricing_proposal_id?", print_units, digital_seats]
    output: DistrictOrder
    side_effects:
      - "status set to QUOTED; created_by_user_id set from X-User-ID"
      - "quoted_tcv_cents and freight_surcharge_cents written by order_total_value variant quoted"
      - "no inventory movement (allocated_units stays 0)"
  - method: GET
    path: "/district-orders/{id}"
    description: "Read one district order with both total contract values"
    roles: [PlatformAdmin, SalesRep, PricingManager, StateAdoptionOfficer]
    code: 200
    input: []
    output: DistrictOrder
    side_effects: []
  - method: GET
    path: "/district-orders"
    description: "List district orders filtered by state, title, price filing or order status"
    roles: [PlatformAdmin, SalesRep, PricingManager, StateAdoptionOfficer]
    code: 200
    input: ["state_id?", "title_id?", "pricing_proposal_id?", "district_ref?", "status?", "limit?", "offset?"]
    output: DistrictOrder[]
    side_effects: []
  - method: POST
    path: "/district-orders/{id}/confirm"
    description: "Confirm a quoted order against the adopted list or open territory rules, recomputing the contracted value and committing inventory"
    roles: [SalesRep]
    code: 200
    input: []
    output: DistrictOrder
    side_effects:
      - "status QUOTED -> CONFIRMED; confirmed_by_user_id set from X-User-ID and required to differ from created_by_user_id"
      - "contracted_tcv_cents and freight_surcharge_cents written by order_total_value variant contracted"
      - "allocated_units set to print_units; title.on_hand_units -= print_units and title.committed_units += print_units"
      - "when pricing_proposal_id is not null and that proposal's status is APPROVED, that proposal sets contract_locked true, so it can no longer be superseded by a new filing (ERR_CONTRACT_LOCKED)"
  - method: POST
    path: "/district-orders/{id}/fulfill"
    description: "Ship a confirmed order, moving committed print units to fulfilled"
    roles: [SalesRep]
    code: 200
    input: []
    output: DistrictOrder
    side_effects:
      - "status CONFIRMED -> FULFILLED"
      - "title.committed_units -= allocated_units and title.fulfilled_units += allocated_units"
  - method: POST
    path: "/district-orders/{id}/cancel"
    description: "Cancel a quoted or confirmed order, releasing any committed print units back to on hand"
    roles: [SalesRep]
    code: 200
    input: [reason]
    output: DistrictOrder
    side_effects:
      - "status -> CANCELLED"
      - "from CONFIRMED: title.committed_units -= allocated_units, title.on_hand_units += allocated_units, allocated_units set to 0, contracted_tcv_cents reset to null and freight_surcharge_cents to 0"
      - "the print-unit ledger identity total_received_units == on_hand_units + committed_units + sample_reserved_units + fulfilled_units + written_off_units is preserved"

  # --- test-driving endpoint ----------------------------------------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical UTC clock, which every deadline, window, escalation and phase check reads. Before any call to this endpoint the logical clock reads exactly 2026-08-01T00:00:00Z; the server never falls back to real wall-clock time."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: datetime }"
    side_effects: ["subsequent phase-advance, filing-window, session, slot, escalation and response-deadline evaluations read the new instant"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  # auth
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, or the role is not one of the eight declared roles"
  - id: ERR_ROLE_NOT_PERMITTED
    http: 403
    condition: "the acting role is not listed in the endpoint's roles"
  - id: ERR_STATE_SCOPE_VIOLATION
    http: 403
    condition: "a StateAdoptionOfficer acts on a state, cycle, panel, slot or price filing that does not belong to its own StateProfile"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "the reviewer of a content edit equals its proposer, or the confirmer of a district order equals its creator"
  # request shape
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "missing required field, wrong type, unknown enum member, out-of-range number, unparseable datetime, limit outside 1..100, negative offset, or REJECT verdict without rejection_reason"
  # existence
  - id: ERR_STATE_PROFILE_NOT_FOUND
    http: 404
    condition: "the addressed StateProfile does not exist"
  - id: ERR_ADOPTION_CYCLE_NOT_FOUND
    http: 404
    condition: "the addressed AdoptionCycle does not exist"
  - id: ERR_TITLE_NOT_FOUND
    http: 404
    condition: "the addressed Title does not exist"
  - id: ERR_CONTENT_EDIT_NOT_FOUND
    http: 404
    condition: "the addressed ContentEdit does not exist"
  - id: ERR_SUBMISSION_NOT_FOUND
    http: 404
    condition: "the addressed Submission does not exist"
  - id: ERR_CORRELATION_ENTRY_NOT_FOUND
    http: 404
    condition: "the addressed CorrelationEntry does not exist or belongs to a different submission"
  - id: ERR_COMMITTEE_PANEL_NOT_FOUND
    http: 404
    condition: "the addressed CommitteePanel does not exist"
  - id: ERR_PRESENTATION_SLOT_NOT_FOUND
    http: 404
    condition: "the addressed PresentationSlot does not exist"
  - id: ERR_PRICING_PROPOSAL_NOT_FOUND
    http: 404
    condition: "the addressed PricingProposal does not exist"
  - id: ERR_DISTRICT_ORDER_NOT_FOUND
    http: 404
    condition: "the addressed DistrictOrder does not exist"
  - id: ERR_PUBLIC_COMMENT_NOT_FOUND
    http: 404
    condition: "the addressed PublicComment does not exist"
  - id: ERR_REFERENCED_RESOURCE_NOT_FOUND
    http: 404
    condition: "a foreign key supplied in the request body does not resolve to an existing row"
  # optimistic concurrency
  - id: ERR_STALE_SUBMISSION_VERSION
    http: 412
    condition: "expected_submission_version does not equal the Submission's current version"
  - id: ERR_STALE_PANEL_VERSION
    http: 412
    condition: "expected_panel_version does not equal the CommitteePanel's current version"
  # entity state
  - id: ERR_ADOPTION_CYCLE_STATE_INVALID
    http: 409
    condition: "the cycle's phase does not admit the operation, including phase-advance from ARCHIVED"
  - id: ERR_SUBMISSION_STATE_INVALID
    http: 409
    condition: "the submission's review_status does not admit the operation"
  - id: ERR_CONTENT_EDIT_STATE_INVALID
    http: 409
    condition: "the content edit's status does not admit review, resubmit, apply or revert"
  - id: ERR_TITLE_STATE_INVALID
    http: 409
    condition: "the title's status does not admit release or the requested revision-plan action"
  - id: ERR_TITLE_SUNSET
    http: 409
    condition: "the referenced title has been sunset"
  - id: ERR_TITLE_NOT_RELEASED
    http: 409
    condition: "the referenced title is still DRAFT and may not be filed or ordered"
  - id: ERR_COMMITTEE_PANEL_STATE_INVALID
    http: 409
    condition: "the panel's session state does not admit the operation, or a panel of the cycle is still IN_SESSION at the review-to-comment phase advance"
  - id: ERR_PRESENTATION_SLOT_STATE_INVALID
    http: 409
    condition: "the slot's status does not admit present, vote or tally, or a slot is still PRESENTED at session close"
  - id: ERR_PRICING_PROPOSAL_STATE_INVALID
    http: 409
    condition: "the price filing is not FILED at decision time, or the order's proposal is not APPROVED at confirmation"
  - id: ERR_DISTRICT_ORDER_STATE_INVALID
    http: 409
    condition: "the order's status does not admit confirm, fulfill or cancel, or a CONFIRMED order blocks sunsetting the title"
  - id: ERR_PUBLIC_COMMENT_STATE_INVALID
    http: 409
    condition: "the comment has already been answered"
  - id: ERR_CYCLE_NOT_OPEN_FOR_SUBMISSION
    http: 409
    condition: "filing is attempted while the cycle's status is not OPEN"
  - id: ERR_CONTENT_PIN_STALE
    http: 409
    condition: "the submission's pinned content revision no longer matches the title's current content revision"
  - id: ERR_EDIT_REVERT_BLOCKED
    http: 409
    condition: "an adopted submission pinned the content revision this edit produced, so the edit may not be reverted"
  - id: ERR_REVISION_CONFLICTS_WITH_OPEN_ADOPTION
    http: 409
    condition: "the requested revision target year collides with a live submission of the title"
  # temporal
  - id: ERR_CYCLE_WINDOW_OVERLAP
    http: 409
    condition: "the new cycle's half-open submission window intersects an existing cycle's window for the same state and subject"
  - id: ERR_SLOT_BUFFER_CONFLICT
    http: 409
    condition: "the requested slot window violates the panel's mandatory turnover buffer against an existing slot"
  - id: ERR_PHASE_NOT_DUE
    http: 409
    condition: "the logical clock has not reached the timestamp of the phase being entered"
  - id: ERR_PANEL_SESSION_NOT_DUE
    http: 409
    condition: "the logical clock has not reached the panel's session_start_at"
  - id: ERR_SLOT_NOT_STARTED
    http: 409
    condition: "the logical clock has not reached the slot's start_at"
  - id: ERR_SUBMISSION_WINDOW_CLOSED
    http: 422
    condition: "the logical clock sits outside the cycle's half-open submission window at filing"
  - id: ERR_SLOT_OUTSIDE_SESSION
    http: 422
    condition: "the requested slot window is not contained in the panel's session window"
  # duplicates and limits
  - id: ERR_DUPLICATE_SUBMISSION
    http: 409
    condition: "a live submission already exists for this cycle and title"
  - id: ERR_DUPLICATE_RESOURCE
    http: 409
    condition: "state_code, isbn_base, standard_code per state and subject, or bundle_code per title already exists"
  - id: ERR_EDIT_REVISION_LIMIT_REACHED
    http: 409
    condition: "a rejected edit has already used all MAX_REVISION_ROUNDS review rounds"
  - id: ERR_CONTRACT_LOCKED
    http: 409
    condition: "a contract-locked price filing cannot be superseded by a new filing"
  - id: ERR_QUORUM_NOT_MET
    http: 409
    condition: "fewer members have counted ballots than the panel's quorum_required"
  - id: ERR_PANEL_CAPACITY_EXCEEDED
    http: 409
    condition: "the requested slot's duration would push reserved_minutes past the panel's slot_minutes_capacity"
  - id: ERR_PAGE_BUDGET_EXCEEDED
    http: 409
    condition: "applying the edit or releasing the title would push page_count outside 1..signature_page_capacity"
  - id: ERR_INSUFFICIENT_PRINT_INVENTORY
    http: 409
    condition: "on-hand print units do not cover the requested sampling, order or write-off units"
  # business content and pricing
  - id: ERR_PROHIBITED_CONTENT_PRESENT
    http: 422
    condition: "a prohibited content tag of the state is still present in the title at filing"
  - id: ERR_REQUIRED_TOPIC_MISSING
    http: 422
    condition: "a required topic of the state is absent from the title at filing"
  - id: ERR_ACCESSIBILITY_COMMITMENT_MISSING
    http: 422
    condition: "the bundle's accessibility conformance does not meet the state's accessibility standard"
  - id: ERR_PRIVACY_ADDENDUM_MISSING
    http: 422
    condition: "the state requires a signed student data privacy addendum and the bundle has none"
  - id: ERR_ROSTERING_STANDARD_UNSUPPORTED
    http: 422
    condition: "the bundle's rostering standard differs from the state's required rostering standard"
  - id: ERR_STANDARD_NOT_IN_FRAMEWORK
    http: 422
    condition: "the cited standard_code does not exist in the cycle's state and subject framework"
  - id: ERR_BUNDLE_TITLE_MISMATCH
    http: 422
    condition: "the referenced ancillary bundle belongs to a different title than the submission's"
  - id: ERR_PRICING_PROPOSAL_REQUIRED
    http: 422
    condition: "an order in an ADOPTION_LIST state is confirmed without an approved price filing"
  - id: ERR_TITLE_NOT_ON_ADOPTED_LIST
    http: 422
    condition: "an order in an ADOPTION_LIST state names a title the state has not adopted"
  - id: ERR_CORRELATION_SET_EMPTY
    http: 422
    condition: "filing is attempted with no correlation entry"
  - id: ERR_FOCUS_STANDARD_UNCOVERED
    http: 422
    condition: "a focus standard in the coverage input set has no PRACTICE or MASTERY citation"
  - id: ERR_COVERAGE_BELOW_MINIMUM
    http: 422
    condition: "self-reported correlation coverage is below the state's minimum at filing"
  - id: ERR_SAMPLING_INCOMPLETE
    http: 422
    condition: "the state's sampling requirement is not yet satisfied at filing"
  - id: ERR_TERM_YEARS_EXCEED_STATE_MAX
    http: 422
    condition: "the proposed contract term exceeds the state's or the cycle's maximum term"
  - id: ERR_PRICE_CAP_EXCEEDED
    http: 422
    condition: "the computed net state price exceeds the state's price cap"
  - id: ERR_NO_COUNTABLE_VOTES
    http: 422
    condition: "every counted ballot on the slot is an abstention"
  - id: ERR_TITLE_NOT_RELEASABLE
    http: 422
    condition: "the title has no content tags and therefore cannot be released"

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Operator of the publishing platform; seeds states and titles, moves warehouse inventory and drives the logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /state-profiles"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "POST /state-profiles/{id}/standards"
      - "POST /titles"
      - "POST /titles/{id}/inventory-adjustments"
      - "every GET endpoint except GET /district-orders filtering by district_ref"
  - name: StateAdoptionOfficer
    description: "Officer of one adopting state; runs the adoption calendar, seats committees, schedules presentations, tallies recommendations and decides price filings"
    identity: "entity_backed:StateProfile"
    exclusive_operations:
      - "POST /adoption-cycles"
      - "POST /adoption-cycles/{id}/phase-advance"
      - "POST /committee-panels"
      - "POST /committee-panels/{id}/slots"
      - "POST /committee-panels/{id}/open-session"
      - "POST /committee-panels/{id}/close-session"
      - "POST /presentation-slots/{id}/present"
      - "POST /presentation-slots/{id}/tally"
      - "POST /pricing-proposals/{id}/decision"
    shared_operations:
      - "POST /state-profiles/{id}/standards"
      - "POST /submissions/{id}/public-comments"
      - "read access to cycles, submissions, panels, slots, votes, comments, price filings and orders of its own state"
    note: "X-User-ID equals the StateProfile.id this officer serves; acting on another state's resources fails with ERR_STATE_SCOPE_VIOLATION"
  - name: ReviewCommitteeMember
    description: "Seated committee member; judges correlation evidence and casts ballots on presented submissions"
    identity: opaque
    exclusive_operations:
      - "POST /submissions/{id}/correlations/{entryId}/verdict"
      - "POST /presentation-slots/{id}/votes"
    shared_operations:
      - "read access to submissions, correlations, panels, slots, votes and public comments"
  - name: PublisherEditor
    description: "Publisher-side editor; builds submissions and correlation documentation, files with the state, ships samples and answers public comments"
    identity: opaque
    exclusive_operations:
      - "POST /submissions"
      - "POST /submissions/{id}/correlations"
      - "POST /submissions/{id}/file"
      - "POST /submissions/{id}/withdraw"
      - "POST /submissions/{id}/sampling-shipments"
      - "POST /public-comments/{id}/response"
      - "POST /titles/{id}/release"
      - "POST /content-edits"
      - "POST /content-edits/{id}/resubmit"
    shared_operations:
      - "POST /titles"
      - "read access to titles, bundles, content edits, submissions, correlations, comments, cycles, panels and slots"
    note: "May not review its own proposed content edits; the reviewing EditorialDirector must carry a different X-User-ID"
  - name: EditorialDirector
    description: "Editorial approver; reviews, applies and reverts state-specific content edits, plans revision cycles and moves warehouse inventory"
    identity: opaque
    exclusive_operations:
      - "POST /content-edits/{id}/review"
      - "POST /content-edits/{id}/apply"
      - "POST /content-edits/{id}/revert"
      - "POST /titles/{id}/revision-plan"
    shared_operations:
      - "POST /titles/{id}/inventory-adjustments"
      - "read access to titles, content edits, submissions and cycles"
  - name: PricingManager
    description: "Publisher-side pricing owner; defines ancillary bundles and files multi-year price proposals with the state"
    identity: opaque
    exclusive_operations:
      - "POST /titles/{id}/ancillary-bundles"
      - "POST /pricing-proposals"
    shared_operations:
      - "read access to titles, bundles, submissions, price filings and orders"
  - name: SalesRep
    description: "Field sales representative; quotes, confirms, fulfils and cancels district orders inside adopted lists and open territory states"
    identity: opaque
    exclusive_operations:
      - "POST /district-orders"
      - "POST /district-orders/{id}/confirm"
      - "POST /district-orders/{id}/fulfill"
      - "POST /district-orders/{id}/cancel"
    shared_operations:
      - "read access to titles, bundles, price filings, orders, states and cycles"
    note: "A rep may not confirm an order it entered itself; confirmation requires a different X-User-ID"
  - name: PublicCommenter
    description: "Member of the public filing comments on submissions during the public comment phase"
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "POST /submissions/{id}/public-comments"
      - "GET /submissions/{id}/public-comments"
