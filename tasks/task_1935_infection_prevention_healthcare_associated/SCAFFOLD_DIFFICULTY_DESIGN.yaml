          admitted_at: '2026-08-01T08:00:00Z'
          unit_id: ${unit_id}
        as: UnitNurseManager
        captures:
          pat_id: $.data.id
      - call: POST /api/device-episodes
        payload:
          patient_id: ${pat_id}
          device_type: CENTRAL_LINE
          placed_at: '2026-08-01T10:00:00Z'
        as: UnitNurseManager
        captures:
          ep_id: $.data.id
      - call: POST /api/infection-cases
        payload:
          patient_id: ${pat_id}
          case_type: CLABSI
          suspected_organism: Pseudomonas aeruginosa
          first_positive_specimen_at: '2026-08-04T10:00:00Z'
          linked_device_episode_id: ${ep_id}
        as: InfectionPreventionist
        captures:
          case_id: $.data.id
      - call: POST /api/infection-cases/${case_id}/begin-review
        payload: {}
        as: InfectionPreventionist
      - call: POST /api/infection-cases/${case_id}/adjudicate
        payload:
          outcome: ADJUDICATED_HAI
          date_of_event: '2026-08-04T00:00:00Z'
          rationale: LCBI-1 confirmed by culture
        as: InfectionPreventionist
      - call: POST /api/monthly-summaries
        payload:
          unit_id: ${unit_id}
          month: 2026-08
        as: InfectionPreventionist
        captures:
          sum_id: $.data.id
          sum_count_at_create: $.data.clabsi_count
      trigger:
      - call: POST /api/infection-cases/${case_id}/reopen
        payload:
          reason: new serology contradicts
        as: InfectionPreventionist
      - call: POST /api/infection-cases/${case_id}/begin-review
        payload: {}
        as: InfectionPreventionist
      - call: POST /api/infection-cases/${case_id}/adjudicate
        payload:
          outcome: RULED_OUT
          rationale: contaminant on repeat culture
        as: InfectionPreventionist
      - call: GET /api/monthly-summaries/${sum_id}
        payload: {}
        as: InfectionPreventionist
      assert:
      - 'setup sanity: MonthlySummary.${sum_id}.clabsi_count was 1 right after creation (sum_count_at_create == 1)'
      - post-cycle InfectionCase.${case_id}.status == RULED_OUT
      - post-cycle InfectionCase.${case_id}.date_of_event == null and rit_blocked_until == null
      - post-cycle MonthlySummary.${sum_id}.clabsi_count == 0 (cyclic loop restores the aggregate)
      - GET /api/infection-cases?status=ADJUDICATED_HAI returns total_count == 0
  - name: isolation_order_parallel_status_and_compliance_axes
    grounds:
    - state_machines.IsolationOrder
    - entities.IsolationOrder.fields.compliance_status
    distinguishing_aspect: 'Parallel state dimensions on ONE IsolationOrder entity: the status

      axis (ORDERED -> ACTIVE -> DISCONTINUED) and the compliance axis

      (NOT_AUDITED -> NON_COMPLIANT) evolve independently; discontinuing

      the order must NOT reset compliance_status, and audits are gated only

      on the status axis.

      '
    test_recipe:
      setup:
      - Facility + unit + admitted patient; CONTACT isolation order started (ACTIVE)
      - One NON_COMPLIANT audit (8/9 = 88.9 pct) recorded while ACTIVE
      setup_api_calls:
      - call: POST /api/facilities
        payload:
          name: F1
          nhsn_org_id: ORG-1
          clabsi_baseline_per_1000: 2.0
          cauti_baseline_per_1000: 1.5
          ssi_baseline_per_procedure: 0.25
        as: PlatformAdmin
        captures:
          fac_id: $.data.id
      - call: POST /api/units
        payload:
          facility_id: ${fac_id}
          name: WARD-2
          unit_type: WARD
          nhsn_location_code: W2
        as: PlatformAdmin
        captures:
          unit_id: $.data.id
      - call: POST /api/patients
        payload:
          mrn: MRN-E
          admitted_at: '2026-08-01T08:00:00Z'
          unit_id: ${unit_id}
        as: UnitNurseManager
        captures:
          pat_id: $.data.id
      - call: POST /api/isolation-orders
        payload:
          patient_id: ${pat_id}
          precaution_type: CONTACT
        as: InfectionPreventionist
        captures:
          iso_id: $.data.id
          iso_cs0: $.data.compliance_status
      - call: POST /api/isolation-orders/${iso_id}/start
        payload: {}
        as: UnitNurseManager
      - call: POST /api/isolation-compliance-audits
        payload:
          isolation_order_id: ${iso_id}
          observed_at: '2026-08-03T10:00:00Z'
          elements_checked: 9
          elements_passed: 8
        as: UnitNurseManager
        captures:
          audit_id: $.data.id
      trigger:
      - call: POST /api/isolation-orders/${iso_id}/discontinue
        payload: {}
        as: UnitNurseManager
      - call: GET /api/isolation-orders/${iso_id}
        payload: {}
        as: UnitNurseManager
      assert:
      - at creation IsolationOrder.${iso_id}.compliance_status was NOT_AUDITED (iso_cs0)
      - IsolationComplianceAudit.${audit_id}.compliance_pct == 88.9 and outcome == NON_COMPLIANT
      - post-discontinue IsolationOrder.${iso_id}.status == DISCONTINUED
      - post-discontinue IsolationOrder.${iso_id}.compliance_status == NON_COMPLIANT (axis NOT reset by status transition)
      - 'the NON_COMPLIANT audit auto-created a CorrectiveActionPlan: GET /api/corrective-action-plans?unit_id=<unit> contains one with source_type == ISOLATION_AUDIT and status == ACTIVE'
      - Unit.${unit_id}.surveillance_posture == ELEVATED (auto-CAP drives posture)
- rule_id: transitive_cascade
  instances:
  - name: audit_noncompliance_cascades_cap_then_posture
    grounds:
    - state_machines.IsolationOrder.transitions (audit side-effect chain)
    - state_machines.CorrectiveActionPlan
    - entities.Unit.fields.surveillance_posture
    distinguishing_aspect: 'Depth-3 cascade triggered by audit creation: audit outcome

      NON_COMPLIANT mutates IsolationOrder.compliance_status (hop 1); that

      order-field mutation system-creates a CorrectiveActionPlan in ACTIVE

      (hop 2); that CAP creation recomputes Unit.surveillance_posture to

      ELEVATED (hop 3). Each hop is caused by the previous hop, not by the

      original POST.

      '
    test_recipe:
      setup:
      - Facility + unit (posture NORMAL) + admitted patient + ACTIVE AIRBORNE isolation order
      - No CorrectiveActionPlan exists for the unit beforehand
      setup_api_calls:
      - call: POST /api/facilities
