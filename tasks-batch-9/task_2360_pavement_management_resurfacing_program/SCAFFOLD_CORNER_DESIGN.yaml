              payload: { action: "SCHEDULE", parking_restriction_start: "2026-09-01T00:00:00Z", parking_restriction_end: "2026-09-30T00:00:00Z", driveway_access_plan: "MAINTAINED" }
              as: PavementEngineer
            - call: "POST /pavement/project-segments/${ps1}/notice"
              payload: { action: "DELIVER" }
              as: PavementEngineer
            - call: "POST /pavement/projects/${p1}/advance"
              payload: { action: "START_CONSTRUCTION" }
              as: PavementEngineer
          trigger:
            - call: "POST /pavement/acceptance-tests"
              payload: { project_segment_id: "${ps1}", core_density_pct: 94.0, iri_in_per_mi: 120.0, thickness_in: 1.8, witness_inspector_user_id: "insp-witness-1" }
              as: Inspector
              as_user_id: "insp-witness-1"
              captures: { t1: "$.data.id", t_pf: "$.data.computed_pay_factor", t_out: "$.data.computed_outcome", t_st: "$.data.test_status", t_round: "$.data.test_round" }
            - call: "GET /pavement/project-segments/${ps1}"
              payload: {}
              as: PavementEngineer
              captures: { ps_w: "$.data.work_state", ps_pf: "$.data.pay_factor", ps_tc: "$.data.test_count", ps_design: "$.data.design_thickness_in" }
            - call: "GET /pavement/projects/${p1}"
              payload: {}
              as: PavementEngineer
              captures: { q_st: "$.data.quality_status" }
          assert:
            - "HTTP 201."
            - "data.computed_pay_factor == 0.9126 — round_half_up(0.98 * 0.97 * 0.96, 4) = round_half_up(0.912576, 4)."
            - "data.computed_outcome == 'FAIL' (0.9126 < PASS_FLOOR 0.95) even though no component evaluated to 0.00."
            - "The factor is below the 1.02 cap, so the cap is not what produced this number."
            - "data.test_status == 'SUBMITTED' and data.test_round == 1."
