# =============================================================================
# Device Protection & Mobile Insurance Claims (Asurion-style) — seed tables
# Expert difficulty band (§0.4)
# =============================================================================

scenario: |
  Device Protection & Mobile Insurance Claims (Asurion style): enrollment & device
  eligibility/IMEI, monthly premium add-on (carrier bill), claim (cracked/lost/theft)
  & deductible tier, advanced exchange & replacement logistics, repair-vs-replace
  routing, e-waste/trade-in, fraud/velocity check, depreciation & replacement value.

domain_name: device-protection-insurance
api_prefix: /

# =============================================================================
# §0.1-§0.3 Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: ledger_reconciliation
  secondary_archetype: workflow_orchestration
  complexity_layers:
    - dual_variant_calculation        # depreciated book value vs flat replacement value
    - rate_threshold_triggers         # fraud velocity window, deductible tier breakpoints
    - cascading_side_effects          # claim approve -> advanced exchange -> trade-in -> ledger
    - optimistic_concurrency          # claim adjudication / exchange dispatch on enrollment version

  entity_topology: flat
  # Peer entities linked by foreign keys; Customer/Plan/ReplacementSku are reference roots,
  # Enrollment/Claim/AdvancedExchange/TradeIn/PremiumInvoice/FraudScreen/RepairOrder are FK-linked peers.

  state_machine_shape: branching
  # Claim forks at routing into REPAIR vs REPLACE branches with divergent side-effect sets that
  # rejoin at FULFILLED; Enrollment has a revert (SUSPENDED <-> ACTIVE) loop.

  relationship_patterns:
    - one_to_many                     # Enrollment has many Claims, many PremiumInvoices
    - cross_aggregate                 # Claim references ReplacementSku across the reference root

  role_model: peer_roles
  # Subscriber owns own enrollment/claims; ClaimsAdjuster adjudicates; LogisticsAgent dispatches
  # exchanges & trade-ins; PlatformAdmin manages reference data & clock.

  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Customer
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, no prefix" }
      - { name: full_name, type: string, source: input, description: "Account holder name" }
      - { name: carrier_account_number, type: string, source: input, description: "Carrier billing account; unique across customers" }
      - { name: risk_flag, type: enum, source: computed, description: "GREEN | WATCH | BLOCKED — set by fraud velocity outcomes; gates new claims" }
      - { name: lifetime_approved_claim_count, type: integer, source: computed, description: "Count of this customer's claims that ever reached APPROVED or beyond", default: 0 }
      - { name: created_at, type: datetime, source: system, description: "ISO8601 UTC, 3 fractional digits" }
      - { name: updated_at, type: datetime, source: system, description: "Refreshed on every mutation incl. cascades" }
      - { name: version, type: integer, source: system, description: "OCC version, starts at 1" }

  - name: Plan
    parent: null
    common_fields: false
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, no prefix" }
      - { name: code, type: string, source: input, description: "Plan code, unique (e.g. PROTECT_PLUS)" }
      - { name: monthly_premium_cents, type: integer, source: input, description: "Premium add-on billed to carrier bill each cycle", constraints: ">= 0" }
      - { name: base_deductible_cents, type: integer, source: input, description: "Tier-1 (cracked) base deductible before adjustments", constraints: ">= 0" }
      - { name: loss_deductible_multiplier_bps, type: integer, source: input, description: "Basis points applied to base for LOST/THEFT tier (10000 = 1.0x)", constraints: ">= 10000" }
      - { name: annual_claim_limit, type: integer, source: input, description: "Max APPROVED-or-beyond claims allowed per enrollment per rolling 12 months", constraints: ">= 1" }
      - { name: replacement_value_cap_cents, type: integer, source: input, description: "Maximum replacement value the plan will fund for any single device", constraints: "> 0" }
      - { name: created_at, type: datetime, source: system, description: "ISO8601 UTC, 3 fractional digits" }

  - name: ReplacementSku
    parent: null
    common_fields: false
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, no prefix" }
      - { name: model_name, type: string, source: input, description: "Replacement device model (e.g. Pixel-9)" }
      - { name: msrp_cents, type: integer, source: input, description: "Manufacturer suggested retail price, used as replacement_value basis", constraints: "> 0" }
      - { name: depreciation_rate_bps_per_month, type: integer, source: input, description: "Monthly straight-line depreciation in basis points of MSRP (e.g. 200 = 2%/mo)", constraints: ">= 0; <= 10000" }
      - { name: stock_on_hand, type: integer, source: input, description: "Refurbished units available for advanced exchange", constraints: ">= 0" }
      - { name: created_at, type: datetime, source: system, description: "ISO8601 UTC, 3 fractional digits" }

  - name: Enrollment
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, no prefix" }
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id" }
      - { name: plan_id, type: string, source: input, description: "FK -> Plan.id" }
      - { name: imei, type: string, source: input, description: "15-digit device IMEI; Luhn-valid; unique across non-cancelled enrollments" }
      - { name: device_model, type: string, source: input, description: "Insured device model label" }
      - { name: device_purchase_date, type: datetime, source: input, description: "Date insured device was purchased; drives depreciation age" }
      - { name: replacement_sku_id, type: string, source: input, description: "FK -> ReplacementSku.id; the SKU used to fulfill REPLACE claims" }
      - { name: status, type: enum, source: system, description: "PENDING_ELIGIBILITY | ACTIVE | SUSPENDED | CANCELLED" }
      - { name: enrolled_at, type: datetime, source: system, description: "Logical-clock timestamp at activation; null until ACTIVE" }
      - { name: premium_paid_through_cycle, type: integer, source: computed, description: "Highest billing cycle index marked PAID; -1 if none", default: -1 }
      - { name: open_claim_id, type: string, source: computed, description: "Id of the single non-terminal claim on this enrollment, null if none" }
      - { name: created_at, type: datetime, source: system, description: "ISO8601 UTC, 3 fractional digits" }
      - { name: updated_at, type: datetime, source: system, description: "Refreshed on every mutation incl. cascades" }
      - { name: version, type: integer, source: system, description: "OCC version, starts at 1" }

  - name: PremiumInvoice
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, no prefix" }
      - { name: enrollment_id, type: string, source: input, description: "FK -> Enrollment.id" }
      - { name: cycle_index, type: integer, source: input, description: "0-based billing cycle index since enrollment activation", constraints: ">= 0" }
      - { name: amount_cents, type: integer, source: system, description: "Snapshot of plan.monthly_premium_cents at issue" }
      - { name: status, type: enum, source: system, description: "ISSUED | PAID | VOID" }
      - { name: created_at, type: datetime, source: system, description: "ISO8601 UTC, 3 fractional digits" }
      - { name: updated_at, type: datetime, source: system, description: "Refreshed on every mutation" }
      - { name: version, type: integer, source: system, description: "OCC version, starts at 1" }

  - name: Claim
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, no prefix" }
      - { name: enrollment_id, type: string, source: input, description: "FK -> Enrollment.id" }
      - { name: peril, type: enum, source: input, description: "CRACKED | LOST | THEFT" }
      - { name: incident_at, type: datetime, source: input, description: "When the incident occurred; must be <= current clock and after enrolled_at" }
      - { name: police_report_number, type: string, source: input, description: "Required for THEFT; ignored for CRACKED/LOST", default: null }
      - { name: status, type: enum, source: system, description: "SUBMITTED | UNDER_REVIEW | APPROVED | ROUTED_REPAIR | ROUTED_REPLACE | FULFILLED | DENIED | WITHDRAWN" }
      - { name: routing, type: enum, source: computed, description: "REPAIR | REPLACE | null — pinned at routing time", default: null }
      - { name: deductible_cents, type: integer, source: computed, description: "Deductible quoted at adjudication; tier + risk surcharge applied", default: 0 }
      - { name: replacement_value_cents, type: integer, source: computed, description: "Depreciated replacement value computed at adjudication for REPLACE routing", default: 0 }
      - { name: net_payout_cents, type: integer, source: computed, description: "replacement_value_cents - deductible_cents, floored at 0; REPLACE only", default: 0 }
      - { name: denial_reason, type: enum, source: input, description: "FRAUD | INELIGIBLE | LIMIT_EXCEEDED | NO_COVERAGE — set on DENIED", default: null }
      - { name: created_at, type: datetime, source: system, description: "ISO8601 UTC, 3 fractional digits" }
      - { name: updated_at, type: datetime, source: system, description: "Refreshed on every mutation incl. cascades" }
      - { name: version, type: integer, source: system, description: "OCC version, starts at 1" }

  - name: FraudScreen
    parent: null
    common_fields: false
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, no prefix" }
      - { name: claim_id, type: string, source: input, description: "FK -> Claim.id" }
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; denormalized for velocity scan" }
      - { name: velocity_count, type: integer, source: computed, description: "Count of this customer's claims with incident_at inside the velocity window ending at this claim's incident_at, inclusive of self" }
      - { name: outcome, type: enum, source: computed, description: "PASS | REVIEW | BLOCK — from velocity_count vs thresholds" }
      - { name: created_at, type: datetime, source: system, description: "ISO8601 UTC, 3 fractional digits" }

  - name: RepairOrder
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, no prefix" }
      - { name: claim_id, type: string, source: input, description: "FK -> Claim.id" }
      - { name: repair_cost_cents, type: integer, source: input, description: "Quoted repair cost at order creation", constraints: ">= 0" }
      - { name: status, type: enum, source: system, description: "OPEN | COMPLETED | CANCELLED" }
      - { name: created_at, type: datetime, source: system, description: "ISO8601 UTC, 3 fractional digits" }
      - { name: updated_at, type: datetime, source: system, description: "Refreshed on every mutation" }
      - { name: version, type: integer, source: system, description: "OCC version, starts at 1" }

  - name: AdvancedExchange
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, no prefix" }
      - { name: claim_id, type: string, source: input, description: "FK -> Claim.id" }
      - { name: replacement_sku_id, type: string, source: system, description: "FK -> ReplacementSku.id; copied from enrollment at dispatch" }
      - { name: status, type: enum, source: system, description: "RESERVED | SHIPPED | DELIVERED | RETURN_DUE | CLOSED | CANCELLED" }
      - { name: return_due_at, type: datetime, source: computed, description: "Deadline for old device return; SHIPPED time + return window; null until shipped" }
      - { name: nonreturn_fee_cents, type: integer, source: computed, description: "Fee charged when return window lapses without trade-in; 0 until assessed", default: 0 }
      - { name: created_at, type: datetime, source: system, description: "ISO8601 UTC, 3 fractional digits" }
      - { name: updated_at, type: datetime, source: system, description: "Refreshed on every mutation incl. cascades" }
      - { name: version, type: integer, source: system, description: "OCC version, starts at 1" }

  - name: TradeIn
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, no prefix" }
      - { name: advanced_exchange_id, type: string, source: input, description: "FK -> AdvancedExchange.id" }
      - { name: condition_grade, type: enum, source: input, description: "A | B | C | EWASTE — drives credit tier" }
      - { name: credit_cents, type: integer, source: computed, description: "Trade-in credit applied; depends on grade and depreciated value", default: 0 }
      - { name: status, type: enum, source: system, description: "RECEIVED | GRADED | CREDITED | RECYCLED" }
      - { name: created_at, type: datetime, source: system, description: "ISO8601 UTC, 3 fractional digits" }
      - { name: updated_at, type: datetime, source: system, description: "Refreshed on every mutation" }
      - { name: version, type: integer, source: system, description: "OCC version, starts at 1" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Enrollment
    field: status
    initial_state: PENDING_ELIGIBILITY
    terminal_states: [CANCELLED]
    transitions:
      - from: PENDING_ELIGIBILITY
        to: ACTIVE
        trigger: "POST /enrollments/{id}/activate"
        actor: PlatformAdmin
        preconditions:
          - "imei passed Luhn + 15-digit format at creation"
          - "referenced Plan and ReplacementSku exist"
          - "no other non-CANCELLED enrollment shares this imei"
        side_effects:
          - "set status=ACTIVE"
          - "set enrolled_at = current logical clock"
          - "increments Enrollment.version by 1"
        note: "Activation begins premium billing eligibility."

      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /enrollments/{id}/suspend"
        actor: PlatformAdmin
        preconditions:
          - "enrollment.open_claim_id is null (no non-terminal claim)"
        side_effects:
          - "set status=SUSPENDED"
          - "increments Enrollment.version by 1"
        note: "Suspension (e.g. unpaid carrier bill) blocks new claims."

      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /enrollments/{id}/activate"
        actor: PlatformAdmin
        preconditions:
          - "premium_paid_through_cycle covers the current cycle (reinstatement paid)"
        side_effects:
          - "set status=ACTIVE"
          - "increments Enrollment.version by 1"
        note: "Revert loop: reinstatement after suspension (branching-with-revert)."

      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /enrollments/{id}/cancel"
        actor: Subscriber
        preconditions:
          - "enrollment.open_claim_id is null"
        side_effects:
          - "set status=CANCELLED"
          - "VOID all PremiumInvoice rows for this enrollment in status ISSUED"
          - "increments Enrollment.version by 1"
        note: "Cancel cascades to outstanding invoices (depth-2 cascade origin)."

      - from: SUSPENDED
        to: CANCELLED
        trigger: "POST /enrollments/{id}/cancel"
        actor: Subscriber
        preconditions:
          - "enrollment.open_claim_id is null"
        side_effects:
          - "set status=CANCELLED"
          - "VOID all PremiumInvoice rows for this enrollment in status ISSUED"
          - "increments Enrollment.version by 1"

  - entity: Claim
    field: status
    initial_state: SUBMITTED
    terminal_states: [FULFILLED, DENIED, WITHDRAWN]
    transitions:
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /claims/{id}/screen"
        actor: ClaimsAdjuster
        preconditions:
          - "parent Enrollment.status == ACTIVE"
          - "claim is the enrollment.open_claim_id"
        side_effects:
          - "create FraudScreen: compute velocity_count over Customer's claims, set outcome"
          - "if FraudScreen.outcome == BLOCK: set Customer.risk_flag = BLOCKED (cascade)"
          - "if FraudScreen.outcome == REVIEW and Customer.risk_flag == GREEN: set Customer.risk_flag = WATCH (cascade)"
          - "set status=UNDER_REVIEW"
          - "increments Claim.version by 1"
        note: "Cascade origin A: claim screen -> FraudScreen -> Customer.risk_flag."

      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /claims/{id}/approve"
        actor: ClaimsAdjuster
        actor_occ_field: expected_enrollment_version
        preconditions:
          - "the claim's FraudScreen.outcome != BLOCK"
          - "Customer.risk_flag != BLOCKED"
          - "enrollment's APPROVED-or-beyond claim count in trailing 12 months < plan.annual_claim_limit"
          - "expected_enrollment_version matches parent Enrollment.version"
        side_effects:
          - "compute deductible_cents (tier + risk surcharge) per calc quote_deductible"
          - "set status=APPROVED"
          - "increment Customer.lifetime_approved_claim_count by 1 (cascade)"
          - "increments Enrollment.version by 1"
          - "increments Claim.version by 1"
        note: "Guard depends on sibling FraudScreen state and parent Customer/Enrollment state."

      - from: APPROVED
        to: ROUTED_REPAIR
        trigger: "POST /claims/{id}/route"
        actor: ClaimsAdjuster
        preconditions:
          - "peril == CRACKED"
          - "the RepairOrder created in this call has repair_cost_cents <= replacement_value (cracked) computed for this claim"
        side_effects:
          - "create RepairOrder (status OPEN) with the supplied repair_cost_cents"
          - "set routing=REPAIR"
          - "set status=ROUTED_REPAIR"
          - "increments Claim.version by 1"
        note: "Branch fork (REPAIR): repair-vs-replace routing chooses repair when repairable and economical."

      - from: APPROVED
        to: ROUTED_REPLACE
        trigger: "POST /claims/{id}/route"
        actor: ClaimsAdjuster
        preconditions:
          - "peril in {LOST, THEFT} OR (peril == CRACKED AND supplied repair_cost_cents > replacement_value computed for this claim)"
          - "enrollment's ReplacementSku.stock_on_hand >= 1"
        side_effects:
          - "compute replacement_value_cents and net_payout_cents per calc replacement_value"
          - "create AdvancedExchange (status RESERVED) referencing enrollment's replacement_sku_id"
          - "decrement ReplacementSku.stock_on_hand by 1 (cascade)"
          - "set routing=REPLACE"
          - "set status=ROUTED_REPLACE"
          - "increments Claim.version by 1"
        note: "Branch fork (REPLACE): divergent side-effects vs REPAIR; reserves stock."

      - from: ROUTED_REPAIR
        to: FULFILLED
        trigger: "POST /repair-orders/{id}/complete"
        actor: LogisticsAgent
        preconditions:
          - "RepairOrder.status == OPEN"
        side_effects:
          - "set RepairOrder.status=COMPLETED"
          - "set Claim.status=FULFILLED (bubble-up)"
          - "clear Enrollment.open_claim_id (cascade)"
          - "increments Claim.version by 1"
        note: "Branch rejoin from REPAIR side."

      - from: ROUTED_REPLACE
        to: FULFILLED
        trigger: "POST /advanced-exchanges/{id}/close"
        actor: LogisticsAgent
        preconditions:
          - "AdvancedExchange.status == DELIVERED OR AdvancedExchange.status == CLOSED"
        side_effects:
          - "set Claim.status=FULFILLED (bubble-up)"
          - "clear Enrollment.open_claim_id (cascade)"
          - "increments Claim.version by 1"
        note: "Branch rejoin from REPLACE side."

      - from: SUBMITTED
        to: WITHDRAWN
        trigger: "POST /claims/{id}/withdraw"
        actor: Subscriber
        preconditions:
          - "acting Subscriber owns the parent enrollment's customer_id"
        side_effects:
          - "set status=WITHDRAWN"
          - "clear Enrollment.open_claim_id (cascade)"
          - "increments Claim.version by 1"

      - from: UNDER_REVIEW
        to: DENIED
        trigger: "POST /claims/{id}/deny"
        actor: ClaimsAdjuster
        preconditions:
          - "denial_reason supplied"
        side_effects:
          - "set status=DENIED, set denial_reason"
          - "if denial_reason == FRAUD: set Customer.risk_flag = BLOCKED (cascade)"
          - "clear Enrollment.open_claim_id (cascade)"
          - "increments Claim.version by 1"

  - entity: AdvancedExchange
    field: status
    initial_state: RESERVED
    terminal_states: [CLOSED, CANCELLED]
    transitions:
      - from: RESERVED
        to: SHIPPED
        trigger: "POST /advanced-exchanges/{id}/ship"
        actor: LogisticsAgent
        preconditions:
          - "parent Claim.status == ROUTED_REPLACE"
        side_effects:
          - "set status=SHIPPED"
          - "set return_due_at = current clock + RETURN_WINDOW_DAYS"
          - "increments AdvancedExchange.version by 1"

      - from: SHIPPED
        to: DELIVERED
        trigger: "POST /advanced-exchanges/{id}/deliver"
        actor: LogisticsAgent
        preconditions:
          - "AdvancedExchange.status == SHIPPED"
        side_effects:
          - "set status=DELIVERED"
          - "set status=RETURN_DUE if no trade-in received and clock past return_due_at (handled by sweep)"
          - "increments AdvancedExchange.version by 1"

      - from: DELIVERED
        to: RETURN_DUE
        trigger: "POST /_clock/run_return_sweep"
        actor: system
        preconditions:
          - "current clock > return_due_at"
          - "no TradeIn exists for this AdvancedExchange"
        side_effects:
          - "set status=RETURN_DUE"
          - "set nonreturn_fee_cents per calc nonreturn_fee"
          - "increments AdvancedExchange.version by 1"
        note: "Auto/system transition driven by clock sweep."

      - from: DELIVERED
        to: CLOSED
        trigger: "POST /advanced-exchanges/{id}/close"
        actor: LogisticsAgent
        preconditions:
          - "a TradeIn exists for this AdvancedExchange in status CREDITED or RECYCLED"
        side_effects:
          - "set status=CLOSED"
          - "increments AdvancedExchange.version by 1"

      - from: RESERVED
        to: CANCELLED
        trigger: "POST /advanced-exchanges/{id}/cancel"
        actor: LogisticsAgent
        preconditions:
          - "AdvancedExchange.status == RESERVED"
        side_effects:
          - "set status=CANCELLED"
          - "increment ReplacementSku.stock_on_hand by 1 (compensating cascade — restores reserved unit)"
          - "increments AdvancedExchange.version by 1"
        note: "Compensation: undoes the stock decrement from claim REPLACE routing."

  - entity: TradeIn
    field: status
    initial_state: RECEIVED
    terminal_states: [CREDITED, RECYCLED]
    transitions:
      - from: RECEIVED
        to: GRADED
        trigger: "POST /trade-ins/{id}/grade"
        actor: LogisticsAgent
        preconditions:
          - "parent AdvancedExchange.status in {SHIPPED, DELIVERED, RETURN_DUE}"
        side_effects:
          - "compute credit_cents per calc tradein_credit using condition_grade"
          - "set status=GRADED"
          - "increments TradeIn.version by 1"

      - from: GRADED
        to: CREDITED
        trigger: "POST /trade-ins/{id}/credit"
        actor: LogisticsAgent
        preconditions:
          - "condition_grade != EWASTE"
        side_effects:
          - "set status=CREDITED"
          - "if parent AdvancedExchange.status == RETURN_DUE: reset nonreturn_fee_cents to 0 and set AdvancedExchange.status=DELIVERED (compensating cascade)"
          - "increments TradeIn.version by 1"
        note: "Compensation: late trade-in reverses the non-return fee."

      - from: GRADED
        to: RECYCLED
        trigger: "POST /trade-ins/{id}/recycle"
        actor: LogisticsAgent
        preconditions:
          - "condition_grade == EWASTE"
        side_effects:
          - "set status=RECYCLED"
          - "increments TradeIn.version by 1"
        note: "E-waste path: no credit, device recycled."

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: claim-approve-stale-enrollment
    parent_entity: Enrollment
    write_endpoint: "POST /claims/{id}/approve"
    occ_field: "expected_enrollment_version"
    description: |
      Approving a Claim against an Enrollment whose version has advanced since the
      client last observed it is rejected. Approval debits the enrollment's annual
      claim allowance and bumps Enrollment.version; a client approving a second
      claim while still carrying a stale enrollment version is rejected on the
      stale-version check before the limit is re-evaluated.
    error_id: ERR_STALE_ENROLLMENT_VERSION
    http_status: 412

  - rule_id: exchange-dispatch-stale-claim
    parent_entity: Claim
    write_endpoint: "POST /advanced-exchanges/{id}/ship"
    occ_field: "expected_claim_version"
    description: |
      Shipping an AdvancedExchange requires the client's observed parent Claim
      version. When the Claim version has advanced (e.g. a re-route mutated it),
      the dispatch is rejected on the stale-version check so a superseding ship
      against an out-of-date claim view cannot proceed.
    error_id: ERR_STALE_CLAIM_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: quote_deductible
    trigger: "Claim UNDER_REVIEW -> APPROVED (POST /claims/{id}/approve)"
    algorithm: threshold
    formula: |
      # peril tier selection then risk surcharge — pin evaluation order:
      # STEP 1 tier base:
      if peril == CRACKED:
          tier_base = plan.base_deductible_cents
      else:  # LOST or THEFT
          tier_base = round_half_up(plan.base_deductible_cents
                       * plan.loss_deductible_multiplier_bps / 10000)
      # STEP 2 risk surcharge keyed on the customer's risk_flag AT approval time:
      if customer.risk_flag == WATCH:
          surcharge = round_half_up(tier_base * RISK_SURCHARGE_BPS / 10000)
      else:  # GREEN  (BLOCKED never reaches approval)
          surcharge = 0
      deductible_cents = tier_base + surcharge
    input_set: "Single claim; plan via enrollment; customer.risk_flag snapshot at approval."
    constants:
      RISK_SURCHARGE_BPS: 2500
    precision: "integer cents, round_half_up at each round_half_up() call"
    variants:
      - name: cracked_tier
        when: "peril == CRACKED"
        difference: "tier_base = plan.base_deductible_cents (no multiplier)."
      - name: loss_tier
        when: "peril in {LOST, THEFT}"
        difference: "tier_base scaled by loss_deductible_multiplier_bps."

  - name: replacement_value
    trigger: "Claim APPROVED -> ROUTED_REPLACE (POST /claims/{id}/route), and used to decide CRACKED repair-vs-replace"
    algorithm: decay_function
    formula: |
      # straight-line monthly depreciation of MSRP, floored, then capped:
      age_months = floor( days_between(enrollment.device_purchase_date, current_clock) / 30 )
      raw = sku.msrp_cents
            - round_half_up(sku.msrp_cents * sku.depreciation_rate_bps_per_month * age_months / 10000)
      depreciated = max(raw, MIN_RESIDUAL_FLOOR_CENTS)
      replacement_value_cents = min(depreciated, plan.replacement_value_cap_cents)
      net_payout_cents = max(replacement_value_cents - claim.deductible_cents, 0)
    input_set: "Enrollment device age vs current clock; SKU MSRP & depreciation; plan cap; claim deductible."
    constants:
      MIN_RESIDUAL_FLOOR_CENTS: 5000
      DAYS_PER_MONTH: 30
    precision: "integer cents, round_half_up on the depreciation product; floor on age_months."
    variants:
      - name: book_value_variant
        when: "depreciated < plan.replacement_value_cap_cents"
        difference: "Pays depreciated book value (chronological device-age basis)."
      - name: capped_replacement_variant
        when: "depreciated >= plan.replacement_value_cap_cents"
        difference: "Pays plan cap (flat replacement basis), diverging from book value for the same device."

  - name: fraud_velocity
    trigger: "Claim SUBMITTED -> UNDER_REVIEW (POST /claims/{id}/screen) — creates FraudScreen"
    algorithm: aggregation
    formula: |
      # count this customer's claims (any status except WITHDRAWN) whose incident_at
      # falls inside the trailing window ending at THIS claim's incident_at, inclusive:
      window_start = this_claim.incident_at - VELOCITY_WINDOW_DAYS (days)
      velocity_count = count(c in customer.claims
                             where c.status != WITHDRAWN
                             and c.incident_at >= window_start
                             and c.incident_at <= this_claim.incident_at)
      # this_claim is itself included (it is SUBMITTED at screen time).
      if velocity_count >= BLOCK_THRESHOLD:
          outcome = BLOCK
      elif velocity_count >= REVIEW_THRESHOLD:
          outcome = REVIEW
      else:
          outcome = PASS
    input_set: "All non-WITHDRAWN claims of the customer; window is a closed interval [window_start, incident_at]."
    constants:
      VELOCITY_WINDOW_DAYS: 90
      REVIEW_THRESHOLD: 2
      BLOCK_THRESHOLD: 3
    precision: "integer count; window boundaries inclusive (>=, <=)."

  - name: tradein_credit
    trigger: "TradeIn RECEIVED -> GRADED (POST /trade-ins/{id}/grade)"
    algorithm: tiered_pricing
    formula: |
      # base is depreciated replacement value of the SKU (same depreciated value
      # used by replacement_value, BEFORE the plan cap), times a grade factor:
      base = depreciated   # = replacement_value's `depreciated` (pre-cap), recomputed at grade time
      if condition_grade == A:   factor_bps = 6000
      elif condition_grade == B: factor_bps = 4000
      elif condition_grade == C: factor_bps = 2000
      else:                      factor_bps = 0   # EWASTE
      credit_cents = round_half_up(base * factor_bps / 10000)
    input_set: "Parent exchange -> claim -> enrollment SKU; depreciated value recomputed at grade-time clock."
    constants:
      GRADE_A_BPS: 6000
      GRADE_B_BPS: 4000
      GRADE_C_BPS: 2000
      GRADE_EWASTE_BPS: 0
    precision: "integer cents, round_half_up."

  - name: nonreturn_fee
    trigger: "AdvancedExchange DELIVERED -> RETURN_DUE (POST /_clock/run_return_sweep)"
    algorithm: threshold
    formula: |
      # flat fraction of the SKU MSRP when old device not returned in window:
      nonreturn_fee_cents = round_half_up(sku.msrp_cents * NONRETURN_FEE_BPS / 10000)
    input_set: "Exchange -> claim -> enrollment SKU MSRP; only exchanges past return_due_at with no TradeIn."
    constants:
      NONRETURN_FEE_BPS: 3500
    precision: "integer cents, round_half_up."

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and well-formed"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all except POST /customers, POST /plans, POST /replacement-skus when no auth required? (no — all require headers)"

  - priority: 2
    category: auth
    check: "Acting role is permitted for this operation per §1.7"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "Every path/body referenced resource exists, validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with path ids or FK body fields"

  - priority: 4
    category: business_referential
    check: "Subscriber acting on a Claim/Enrollment must own the parent Customer (X-User-ID == customer_id)"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "Subscriber-scoped writes"

  - priority: 5
    category: state
    check: "Target resource is in a state from which the requested transition is defined"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 6
    category: state
    check: "Parent Enrollment.status == ACTIVE when submitting/screening a Claim"
    error_id: ERR_ENROLLMENT_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /claims, POST /claims/{id}/screen"

  - priority: 7
    category: business_constraint
    check: "IMEI is exactly 15 digits and passes the Luhn checksum"
    error_id: ERR_INVALID_IMEI
    http_status: 422
    applies_to: "POST /enrollments"

  - priority: 8
    category: business_constraint
    check: "IMEI is unique across all non-CANCELLED enrollments"
    error_id: ERR_DUPLICATE_IMEI
    http_status: 409
    applies_to: "POST /enrollments, POST /enrollments/{id}/activate"

  - priority: 9
    category: business_temporal
    check: "Claim.incident_at is after enrollment.enrolled_at and not after the current clock"
    error_id: ERR_INCIDENT_OUT_OF_WINDOW
    http_status: 422
    applies_to: "POST /claims"

  - priority: 10
    category: business_constraint
    check: "police_report_number present and non-empty when peril == THEFT"
    error_id: ERR_POLICE_REPORT_REQUIRED
    http_status: 422
    applies_to: "POST /claims"

  - priority: 11
    category: business_constraint
    check: "Enrollment has no existing non-terminal Claim (open_claim_id is null) when submitting a new Claim"
    error_id: ERR_OPEN_CLAIM_EXISTS
    http_status: 409
    applies_to: "POST /claims"

  - priority: 12
    category: business_safety
    check: "Customer.risk_flag != BLOCKED and the claim's FraudScreen.outcome != BLOCK at approval"
    error_id: ERR_FRAUD_BLOCKED
    http_status: 409
    applies_to: "POST /claims/{id}/approve"

  - priority: 13
    category: business_fiscal
    check: "Enrollment's APPROVED-or-beyond claim count in trailing 12 months < plan.annual_claim_limit"
    error_id: ERR_CLAIM_LIMIT_EXCEEDED
    http_status: 409
    applies_to: "POST /claims/{id}/approve"

  - priority: 14
    category: business_constraint
    check: "ReplacementSku.stock_on_hand >= 1 before reserving a unit on REPLACE routing"
    error_id: ERR_NO_STOCK
    http_status: 409
    applies_to: "POST /claims/{id}/route"

  - priority: 15
    category: business_fiscal
    check: "OCC expected_enrollment_version / expected_claim_version matches the parent's current version"
    error_id: ERR_STALE_ENROLLMENT_VERSION
    http_status: 412
    applies_to: "POST /claims/{id}/approve, POST /advanced-exchanges/{id}/ship"

  - priority: 16
    category: business_constraint
    check: "route payload supplies repair_cost_cents for CRACKED claims; routing decision uses it"
    error_id: ERR_ROUTE_INPUT_MISSING
    http_status: 422
    applies_to: "POST /claims/{id}/route"

  - priority: 17
    category: business_constraint
    check: "credit transition rejected when condition_grade == EWASTE; recycle rejected when grade != EWASTE"
    error_id: ERR_GRADE_PATH_MISMATCH
    http_status: 409
    applies_to: "POST /trade-ins/{id}/credit, POST /trade-ins/{id}/recycle"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- reference data ----
  - { method: POST, path: "/customers", description: "Create a customer", roles: [PlatformAdmin], code: 201, input: [full_name, carrier_account_number], output: Customer, side_effects: ["risk_flag defaults GREEN"] }
  - { method: GET, path: "/customers/{id}", description: "Get a customer", roles: [PlatformAdmin, Subscriber, ClaimsAdjuster], code: 200, input: [], output: Customer, side_effects: [] }
  - { method: POST, path: "/plans", description: "Create a plan", roles: [PlatformAdmin], code: 201, input: [code, monthly_premium_cents, base_deductible_cents, loss_deductible_multiplier_bps, annual_claim_limit, replacement_value_cap_cents], output: Plan, side_effects: [] }
  - { method: GET, path: "/plans/{id}", description: "Get a plan", roles: [PlatformAdmin, Subscriber, ClaimsAdjuster], code: 200, input: [], output: Plan, side_effects: [] }
  - { method: POST, path: "/replacement-skus", description: "Create a replacement SKU", roles: [PlatformAdmin], code: 201, input: [model_name, msrp_cents, depreciation_rate_bps_per_month, stock_on_hand], output: ReplacementSku, side_effects: [] }
  - { method: GET, path: "/replacement-skus/{id}", description: "Get a replacement SKU", roles: [PlatformAdmin, ClaimsAdjuster, LogisticsAgent], code: 200, input: [], output: ReplacementSku, side_effects: [] }

  # ---- enrollments ----
  - { method: POST, path: "/enrollments", description: "Create enrollment in PENDING_ELIGIBILITY", roles: [PlatformAdmin, Subscriber], code: 201, input: [customer_id, plan_id, imei, device_model, device_purchase_date, replacement_sku_id], output: Enrollment, side_effects: ["validate IMEI Luhn", "validate IMEI uniqueness"] }
  - { method: GET, path: "/enrollments/{id}", description: "Get an enrollment", roles: [PlatformAdmin, Subscriber, ClaimsAdjuster], code: 200, input: [], output: Enrollment, side_effects: [] }
  - { method: GET, path: "/enrollments", description: "List/filter enrollments", roles: [PlatformAdmin, Subscriber, ClaimsAdjuster], code: 200, input: ["customer_id?", "plan_id?", "replacement_sku_id?", "limit?", "offset?"], output: "Enrollment[]", side_effects: [] }
  - { method: POST, path: "/enrollments/{id}/activate", description: "Activate (PENDING/SUSPENDED -> ACTIVE)", roles: [PlatformAdmin], code: 200, input: [], output: Enrollment, side_effects: ["set enrolled_at", "increments Enrollment.version by 1"] }
  - { method: POST, path: "/enrollments/{id}/suspend", description: "Suspend ACTIVE enrollment", roles: [PlatformAdmin], code: 200, input: [], output: Enrollment, side_effects: ["increments Enrollment.version by 1"] }
  - { method: POST, path: "/enrollments/{id}/cancel", description: "Cancel enrollment; void ISSUED invoices", roles: [Subscriber, PlatformAdmin], code: 200, input: [], output: Enrollment, side_effects: ["VOID ISSUED PremiumInvoices", "increments Enrollment.version by 1"] }

  # ---- premium invoices (carrier bill) ----
  - { method: POST, path: "/premium-invoices", description: "Issue a premium invoice for a cycle", roles: [PlatformAdmin], code: 201, input: [enrollment_id, cycle_index], output: PremiumInvoice, side_effects: ["amount snapshot from plan"] }
  - { method: GET, path: "/premium-invoices", description: "List/filter invoices", roles: [PlatformAdmin, Subscriber], code: 200, input: ["enrollment_id?", "limit?", "offset?"], output: "PremiumInvoice[]", side_effects: [] }
  - { method: GET, path: "/premium-invoices/{id}", description: "Get a premium invoice", roles: [PlatformAdmin, Subscriber], code: 200, input: [], output: PremiumInvoice, side_effects: [] }
  - { method: POST, path: "/premium-invoices/{id}/pay", description: "Mark invoice PAID; advance premium_paid_through_cycle", roles: [PlatformAdmin, Subscriber], code: 200, input: [expected_enrollment_version], output: PremiumInvoice, side_effects: ["set PAID", "recompute Enrollment.premium_paid_through_cycle", "increments Enrollment.version by 1"] }

  # ---- claims ----
  - { method: POST, path: "/claims", description: "Submit a claim (SUBMITTED)", roles: [Subscriber, PlatformAdmin], code: 201, input: [enrollment_id, peril, incident_at, "police_report_number?"], output: Claim, side_effects: ["set Enrollment.open_claim_id"] }
  - { method: GET, path: "/claims/{id}", description: "Get a claim", roles: [PlatformAdmin, Subscriber, ClaimsAdjuster, LogisticsAgent], code: 200, input: [], output: Claim, side_effects: [] }
  - { method: GET, path: "/claims", description: "List/filter claims", roles: [PlatformAdmin, Subscriber, ClaimsAdjuster], code: 200, input: ["enrollment_id?", "limit?", "offset?"], output: "Claim[]", side_effects: [] }
  - { method: POST, path: "/claims/{id}/screen", description: "Screen claim; run fraud velocity (SUBMITTED -> UNDER_REVIEW)", roles: [ClaimsAdjuster], code: 200, input: [], output: Claim, side_effects: ["create FraudScreen", "maybe set Customer.risk_flag", "increments Claim.version by 1"] }
  - { method: POST, path: "/claims/{id}/approve", description: "Approve claim; quote deductible (UNDER_REVIEW -> APPROVED)", roles: [ClaimsAdjuster], code: 200, input: [expected_enrollment_version], output: Claim, side_effects: ["compute deductible_cents", "increment Customer.lifetime_approved_claim_count", "increments Enrollment.version by 1", "increments Claim.version by 1"] }
  - { method: POST, path: "/claims/{id}/route", description: "Route APPROVED claim to REPAIR or REPLACE", roles: [ClaimsAdjuster], code: 200, input: ["repair_cost_cents?"], output: Claim, side_effects: ["maybe create RepairOrder", "maybe create AdvancedExchange + decrement stock", "compute replacement_value/net_payout for REPLACE", "increments Claim.version by 1"] }
  - { method: POST, path: "/claims/{id}/deny", description: "Deny claim (UNDER_REVIEW -> DENIED)", roles: [ClaimsAdjuster], code: 200, input: [denial_reason], output: Claim, side_effects: ["maybe BLOCK customer", "clear open_claim_id", "increments Claim.version by 1"] }
  - { method: POST, path: "/claims/{id}/withdraw", description: "Withdraw claim (SUBMITTED -> WITHDRAWN)", roles: [Subscriber], code: 200, input: [], output: Claim, side_effects: ["clear open_claim_id", "increments Claim.version by 1"] }

  # ---- fraud screens ----
  - { method: GET, path: "/fraud-screens", description: "List/filter fraud screens", roles: [PlatformAdmin, ClaimsAdjuster], code: 200, input: ["claim_id?", "customer_id?", "limit?", "offset?"], output: "FraudScreen[]", side_effects: [] }
  - { method: GET, path: "/fraud-screens/{id}", description: "Get a fraud screen", roles: [PlatformAdmin, ClaimsAdjuster], code: 200, input: [], output: FraudScreen, side_effects: [] }

  # ---- repair orders ----
  - { method: GET, path: "/repair-orders", description: "List/filter repair orders", roles: [PlatformAdmin, ClaimsAdjuster, LogisticsAgent], code: 200, input: ["claim_id?", "limit?", "offset?"], output: "RepairOrder[]", side_effects: [] }
  - { method: GET, path: "/repair-orders/{id}", description: "Get a repair order", roles: [PlatformAdmin, ClaimsAdjuster, LogisticsAgent], code: 200, input: [], output: RepairOrder, side_effects: [] }
  - { method: POST, path: "/repair-orders/{id}/complete", description: "Complete repair; fulfill claim", roles: [LogisticsAgent], code: 200, input: [], output: RepairOrder, side_effects: ["set Claim FULFILLED", "clear open_claim_id", "increments Claim.version by 1"] }

  # ---- advanced exchanges ----
  - { method: GET, path: "/advanced-exchanges", description: "List/filter advanced exchanges", roles: [PlatformAdmin, ClaimsAdjuster, LogisticsAgent], code: 200, input: ["claim_id?", "replacement_sku_id?", "limit?", "offset?"], output: "AdvancedExchange[]", side_effects: [] }
  - { method: GET, path: "/advanced-exchanges/{id}", description: "Get an advanced exchange", roles: [PlatformAdmin, ClaimsAdjuster, LogisticsAgent], code: 200, input: [], output: AdvancedExchange, side_effects: [] }
  - { method: POST, path: "/advanced-exchanges/{id}/ship", description: "Ship exchange (RESERVED -> SHIPPED); set return_due_at", roles: [LogisticsAgent], code: 200, input: [expected_claim_version], output: AdvancedExchange, side_effects: ["set return_due_at", "increments AdvancedExchange.version by 1"] }
  - { method: POST, path: "/advanced-exchanges/{id}/deliver", description: "Mark delivered (SHIPPED -> DELIVERED)", roles: [LogisticsAgent], code: 200, input: [], output: AdvancedExchange, side_effects: ["increments AdvancedExchange.version by 1"] }
  - { method: POST, path: "/advanced-exchanges/{id}/close", description: "Close exchange (DELIVERED -> CLOSED); fulfill claim", roles: [LogisticsAgent], code: 200, input: [], output: AdvancedExchange, side_effects: ["set Claim FULFILLED", "clear open_claim_id", "increments AdvancedExchange.version by 1", "increments Claim.version by 1"] }
  - { method: POST, path: "/advanced-exchanges/{id}/cancel", description: "Cancel reserved exchange; restore stock", roles: [LogisticsAgent], code: 200, input: [], output: AdvancedExchange, side_effects: ["increment ReplacementSku.stock_on_hand", "increments AdvancedExchange.version by 1"] }

  # ---- trade-ins ----
  - { method: POST, path: "/trade-ins", description: "Record a returned device for an exchange (RECEIVED)", roles: [LogisticsAgent], code: 201, input: [advanced_exchange_id, condition_grade], output: TradeIn, side_effects: [] }
  - { method: GET, path: "/trade-ins", description: "List/filter trade-ins", roles: [PlatformAdmin, LogisticsAgent], code: 200, input: ["advanced_exchange_id?", "limit?", "offset?"], output: "TradeIn[]", side_effects: [] }
  - { method: GET, path: "/trade-ins/{id}", description: "Get a trade-in", roles: [PlatformAdmin, LogisticsAgent], code: 200, input: [], output: TradeIn, side_effects: [] }
  - { method: POST, path: "/trade-ins/{id}/grade", description: "Grade trade-in; compute credit (RECEIVED -> GRADED)", roles: [LogisticsAgent], code: 200, input: [], output: TradeIn, side_effects: ["compute credit_cents", "increments TradeIn.version by 1"] }
  - { method: POST, path: "/trade-ins/{id}/credit", description: "Apply credit (GRADED -> CREDITED); reverse non-return fee if any", roles: [LogisticsAgent], code: 200, input: [], output: TradeIn, side_effects: ["maybe reverse nonreturn_fee", "increments TradeIn.version by 1"] }
  - { method: POST, path: "/trade-ins/{id}/recycle", description: "Recycle e-waste trade-in (GRADED -> RECYCLED)", roles: [LogisticsAgent], code: 200, input: [], output: TradeIn, side_effects: ["increments TradeIn.version by 1"] }

  # ---- clock / sweeps (test-driving) ----
  - { method: POST, path: "/_clock/set_current_utc", description: "Set logical clock. Server startup default is 2026-01-01T00:00:00Z; before any set call the clock reads exactly this default and never falls back to wall-clock.", roles: [PlatformAdmin], code: 200, input: [to_iso8601], output: "{ current_utc: string }", side_effects: ["advances logical clock"] }
  - { method: POST, path: "/_clock/run_return_sweep", description: "Sweep DELIVERED exchanges past return_due_at with no trade-in -> RETURN_DUE + non-return fee", roles: [PlatformAdmin], code: 200, input: [], output: "{ swept_exchange_ids: string[] }", side_effects: ["set RETURN_DUE", "assess nonreturn_fee_cents", "increments AdvancedExchange.version by 1"] }

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/invalid auth headers" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Acting role not permitted for operation" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Referenced resource does not exist" }
  - { id: ERR_NOT_RESOURCE_OWNER, http: 403, condition: "Subscriber acts on a resource not owned by their customer_id" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Transition not defined from the target's current state" }
  - { id: ERR_ENROLLMENT_NOT_ACTIVE, http: 409, condition: "Claim submit/screen attempted while parent enrollment not ACTIVE" }
  - { id: ERR_INVALID_IMEI, http: 422, condition: "IMEI not 15 digits or fails Luhn checksum" }
  - { id: ERR_DUPLICATE_IMEI, http: 409, condition: "IMEI already used by a non-CANCELLED enrollment" }
  - { id: ERR_INCIDENT_OUT_OF_WINDOW, http: 422, condition: "incident_at before enrolled_at or after current clock" }
  - { id: ERR_POLICE_REPORT_REQUIRED, http: 422, condition: "THEFT claim missing police_report_number" }
  - { id: ERR_OPEN_CLAIM_EXISTS, http: 409, condition: "Enrollment already has a non-terminal claim" }
  - { id: ERR_FRAUD_BLOCKED, http: 409, condition: "Approval blocked by BLOCKED risk_flag or BLOCK fraud outcome" }
  - { id: ERR_CLAIM_LIMIT_EXCEEDED, http: 409, condition: "Annual approved-claim limit reached for enrollment" }
  - { id: ERR_NO_STOCK, http: 409, condition: "No replacement stock to reserve for REPLACE routing" }
  - { id: ERR_STALE_ENROLLMENT_VERSION, http: 412, condition: "expected_enrollment_version != Enrollment.version" }
  - { id: ERR_STALE_CLAIM_VERSION, http: 412, condition: "expected_claim_version != Claim.version" }
  - { id: ERR_ROUTE_INPUT_MISSING, http: 422, condition: "CRACKED route missing repair_cost_cents" }
  - { id: ERR_GRADE_PATH_MISMATCH, http: 409, condition: "credit on EWASTE grade, or recycle on non-EWASTE grade" }
  - { id: ERR_VALIDATION, http: 422, condition: "Generic missing/invalid required field (e.g. denial_reason, enum out of range)" }
  - { id: ERR_PAGINATION_INVALID, http: 422, condition: "limit/offset out of allowed range" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Operator managing reference data, enrollment lifecycle, billing, clock/sweeps"
    identity: "opaque"
    exclusive_operations:
      - "POST /customers"
      - "POST /plans"
      - "POST /replacement-skus"
      - "POST /enrollments/{id}/activate"
      - "POST /enrollments/{id}/suspend"
      - "POST /premium-invoices"
      - "POST /_clock/set_current_utc"
      - "POST /_clock/run_return_sweep"
    shared_operations:
      - "POST /enrollments"
      - "POST /enrollments/{id}/cancel"
      - "POST /premium-invoices/{id}/pay"
      - "POST /claims"
      - "GET endpoints"

  - name: Subscriber
    description: "Insured customer; acts on own enrollments and claims"
    identity: "entity_backed:Customer"
    exclusive_operations:
      - "POST /claims/{id}/withdraw"
    shared_operations:
      - "POST /enrollments"
      - "POST /enrollments/{id}/cancel"
      - "POST /premium-invoices/{id}/pay"
      - "POST /claims"
      - "GET own enrollments/claims/invoices/customer"

  - name: ClaimsAdjuster
    description: "Adjudicates claims: screen, approve, route, deny"
    identity: "opaque"
    exclusive_operations:
      - "POST /claims/{id}/screen"
      - "POST /claims/{id}/approve"
      - "POST /claims/{id}/route"
      - "POST /claims/{id}/deny"
    shared_operations:
      - "GET claims/enrollments/fraud-screens/repair-orders/advanced-exchanges"

  - name: LogisticsAgent
    description: "Handles replacement logistics, exchanges, trade-ins, repair completion"
    identity: "opaque"
    exclusive_operations:
      - "POST /repair-orders/{id}/complete"
      - "POST /advanced-exchanges/{id}/ship"
      - "POST /advanced-exchanges/{id}/deliver"
      - "POST /advanced-exchanges/{id}/close"
      - "POST /advanced-exchanges/{id}/cancel"
      - "POST /trade-ins"
      - "POST /trade-ins/{id}/grade"
      - "POST /trade-ins/{id}/credit"
      - "POST /trade-ins/{id}/recycle"
    shared_operations:
      - "GET advanced-exchanges/trade-ins/repair-orders/replacement-skus/claims"
