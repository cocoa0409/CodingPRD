  - name: state_plan_entry_second_approve_returns_invalid_state
    claim_type: Idempotency
    grounds:
    - §1.2 CollectionPlanEntry DRAFT -> APPROVED
    - §1.4 priority 10 (ERR_INVALID_STATE)
    - §1.6 ERR_INVALID_STATE (409)
    - §1.1 CollectionPlanEntry.approved_by_user_id / approved_at
