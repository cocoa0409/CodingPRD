            - "PensionPlan.${plan_id}.accounting_funded_status_bp == 9200 and cumulative_settlement_charge_cents == 0 and deferred_settlement_charge_cents == 0"
            - "GET /prt/settlement-entries?plan_id=${plan_id} returns 0 rows — abandonment recognises nothing"
            - "the rebuilt tranche re-locks the identical 12000000 successfully: BuyoutTranche.${t2_id}.tranche_status == PRICING_LOCKED and locked_premium_cents == 12000000, which is only possible if the first lock's capacity was fully returned"
            - "after the re-lock Insurer.${ins_id}.committed_capacity_cents == 12000000 and available_capacity_cents == 8000000 again"

      - name: complaint_retriage_reverses_remediation_without_erasing_the_ledger
        grounds:
          - state_machines.ParticipantComplaint.RESOLVED_to_TRIAGED
          - entities.SettlementEntry
          - entities.PensionPlan.fields.cumulative_settlement_charge_cents
          - calculations.funded_status_measurement
        distinguishing_aspect: |
          The conserved identity is cumulative_settlement_charge_cents == the sum
          of amount_cents over every SettlementEntry of the plan, and the ledger is
          append-only, so the compensating action must ADD a negative
          REMEDIATION_REVERSAL row rather than delete or mutate the REMEDIATION
          row. The instance pays 250000 of remediation out of plan assets, then
          re-triages the complaint from SPONSOR_RESPONSIBLE to NO_ERROR and
          requires plan_assets_cents, cumulative_settlement_charge_cents and
          accounting_funded_status_bp to return to their exact pre-remediation
          values while the entry count grows from 2 to 3. Two further traps: the
          reversal must leave deferred_settlement_charge_cents (998400 from the
          buyout) untouched, since a remediation reversal has nothing to do with
          AOCI; and it must NOT reopen the participant's audit the way the original
          SPONSOR_RESPONSIBLE triage did, because the reopen cascade is conditioned
          on the new determination, not on the transition.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "a PensionPlan (total_liability 100000000, assets 92000000, service_cost 3000000, interest_cost 9000000, unrecognized loss 4000000)"
            - "one cleansed DEFERRED_VESTED participant at stated monthly 100000, audit PASSED_CLOSED at variance 0"
            - "a tranche settled on an 11800000 premium funded IN_KIND at gross 12000000 over 2 lots, so settlement_cost is exactly 12000000 and the whole 998400 charge is deferred"
            - "the transferred participant files a BENEFIT_AMOUNT complaint, triage lands SPONSOR_RESPONSIBLE, the reopened audit is corrected, and the complaint resolves with remediation_amount_cents 250000"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlanAdministrator
              as_user_id: "tpa-ops-01"
            - call: "POST /prt/plans"
              payload: { sponsor_name: "Thistledown Grain", plan_name: "Thistledown Salaried Plan", plan_ein: "560884219", total_liability_cents: 100000000, plan_assets_cents: 92000000, service_cost_cents: 3000000, interest_cost_cents: 9000000, unrecognized_actuarial_loss_cents: 4000000, discount_rate_bps: 500 }
              as: PlanSponsor
              as_user_id: "sponsor-treasury-01"
              captures: { plan_id: $.data.id }
            - call: "POST /prt/plans/${plan_id}/participants"
              payload: { participant_reference: "TD-0001", cohort: "DEFERRED_VESTED", stated_monthly_benefit_cents: 100000, final_average_monthly_earnings_cents: 250000, credited_service_months: 320, date_of_birth: "1965-11-11" }
              as: PlanAdministrator
              as_user_id: "tpa-ops-01"
              captures: { p1_id: $.data.id }
            - call: "POST /prt/participants/${p1_id}/address-searches"
              payload: { search_result: "CONFIRMED_MATCH", confirmed_address_line1: "44 Granary Way", confirmed_postal_code: "27601" }
              as: PlanAdministrator
              as_user_id: "tpa-ops-01"
            - call: "POST /prt/participants/${p1_id}/mortality-checks"
              payload: { match_result: "NO_MATCH" }
              as: PlanAdministrator
              as_user_id: "tpa-ops-01"
              captures: { p1_v: $.data.version }
            - call: "POST /prt/participants/${p1_id}/benefit-audits"
              payload: { expected_participant_version: "${p1_v}" }
              as: Actuary
              as_user_id: "actuary-01"
              captures: { a1_id: $.data.id, a1_variance: $.data.variance_cents }
            - call: "POST /prt/benefit-audits/${a1_id}/resolution"
              payload: { resolution: "ACCEPT_AS_IS" }
              as: Actuary
              as_user_id: "actuary-01"
            - call: "POST /prt/plans/${plan_id}/strategies"
              payload: { strategy_name: "Thistledown Buyout", strategy_type: "ANNUITY_BUYOUT" }
              as: Actuary
              as_user_id: "actuary-01"
              captures: { strategy_id: $.data.id }
            - call: "POST /prt/strategies/${strategy_id}/submission"
              payload: {}
              as: Actuary
              as_user_id: "actuary-01"
            - call: "POST /prt/strategies/${strategy_id}/decision"
              payload: { decision: "APPROVE", decision_rationale: "Buyout approved." }
