  - rule_id: priority_pair_validation_conflict
    instances:
      - name: event_overlap_beats_budget_priority
        grounds:
          - validations[priority=9]
          - validations[priority=11]
          - errors[ERR_EVENT_WINDOW_OVERLAP]
          - errors[ERR_CAMPAIGN_BUDGET_EXCEEDED]
        distinguishing_aspect: |
          Error-category pair business_temporal (priority 9) vs business_fiscal (priority 11):
          the new event both overlaps an existing event on 2027-03-12 under closed-interval
          semantics AND would overspend the budget (600000 + 500000 > 1000000); the temporal
          error ERR_EVENT_WINDOW_OVERLAP must win.
        test_recipe:
          setup:
            - "Physician + case; an ACTIVE campaign with budget_cents 1000000"
            - "Existing PLANNED event E1 covering [2027-03-10, 2027-03-12] costing 600000 (spent_cents == 600000)"
          setup_api_calls:
            - { call: "POST /onboarding/physicians", payload: { full_name: "Dr. Jon", specialty: "PEDIATRICS", email: "jon@x.com", hire_type: "NEW_GRAD" }, as: Recruiter, captures: { phys_id: "$.data.id" } }
            - { call: "POST /onboarding/onboarding-cases", payload: { physician_id: "${phys_id}", target_start_date: "2027-06-01" }, as: Recruiter, captures: { case_id: "$.data.id" } }
            - { call: "POST /onboarding/referral-campaigns", payload: { onboarding_case_id: "${case_id}", name: "Launch", budget_cents: 1000000 }, as: PracticeManager, captures: { camp_id: "$.data.id" } }
            - { call: "POST /onboarding/referral-campaigns/${camp_id}/activate", payload: {}, as: PracticeManager }
            - { call: "POST /onboarding/campaign-events", payload: { campaign_id: "${camp_id}", event_type: "COMMUNITY_TALK", start_date: "2027-03-10", end_date: "2027-03-12", cost_cents: 600000, venue: "Library" }, as: PracticeManager, captures: { ev1: "$.data.id" } }
          trigger:
            - { call: "POST /onboarding/campaign-events", payload: { campaign_id: "${camp_id}", event_type: "REFERRAL_DINNER", start_date: "2027-03-12", end_date: "2027-03-14", cost_cents: 500000, venue: "Bistro" }, as: PracticeManager, captures: { err: "$.data.error_id" } }
          assert:
            - "Response error_id == ERR_EVENT_WINDOW_OVERLAP (HTTP 422), NOT ERR_CAMPAIGN_BUDGET_EXCEEDED, although both conditions hold"
            - "ReferralCampaign.${camp_id}.spent_cents == 600000 unchanged (no debit on rejection)"

      - name: verify_state_beats_segregation_priority
        grounds:
          - validations[priority=6]
          - validations[priority=7]
          - errors[ERR_ITEM_NOT_SUBMITTED]
          - errors[ERR_SEGREGATION_OF_DUTIES]
        distinguishing_aspect: |
          Error-category pair state (priority 6) vs business_safety (priority 7): the item is
          REJECTED (not DOCS_SUBMITTED) AND the caller is the original submitter, so both the
          state precondition and the segregation-of-duties rule fail; the state error
          ERR_ITEM_NOT_SUBMITTED must win. A different category pair than the temporal/fiscal
          instance.
        test_recipe:
          setup:
            - "Physician + case; one STATE_LICENSE item submitted by user cs-1 and then REJECTED by the director"
          setup_api_calls:
            - { call: "POST /onboarding/physicians", payload: { full_name: "Dr. Kim", specialty: "CARDIOLOGY", email: "kim@x.com", hire_type: "EXPERIENCED" }, as: Recruiter, captures: { phys_id: "$.data.id" } }
            - { call: "POST /onboarding/onboarding-cases", payload: { physician_id: "${phys_id}", target_start_date: "2027-06-01" }, as: Recruiter, captures: { case_id: "$.data.id" } }
            - { call: "POST /onboarding/credential-items", payload: { onboarding_case_id: "${case_id}", item_type: "STATE_LICENSE", expires_on: "2028-06-01", document_ref: "doc-lic" }, as: CredentialingSpecialist, captures: { lic: "$.data.id" } }
            - { call: "POST /onboarding/credential-items/${lic}/submit-docs", payload: {}, as: CredentialingSpecialist, as_user_id: "cs-1" }
            - { call: "POST /onboarding/credential-items/${lic}/reject", payload: { reason: "blurry scan" }, as: OnboardingDirector }
          trigger:
            - { call: "POST /onboarding/credential-items/${lic}/verify", payload: {}, as: CredentialingSpecialist, as_user_id: "cs-1", captures: { err: "$.data.error_id" } }
          assert:
            - "Response error_id == ERR_ITEM_NOT_SUBMITTED (HTTP 409), NOT ERR_SEGREGATION_OF_DUTIES, although the caller equals submitted_by_user_id as well"
            - "CredentialItem.${lic}.status == REJECTED unchanged; verified_by_user_id remains null"

