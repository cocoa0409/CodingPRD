        claim_type: invalid_transition
        grounds:
          - state_machines.License.transitions.ACTIVE_to_INACTIVE
          - complexity_profile.state_machine_shape
        excluded_because:
          difficulty_instance: non_linear_state_machine / license_registration_and_encumbrance_dimensions_move_independently
          rationale: "The parallel-dimension corner — driving license_status and encumbrance_status simultaneously and showing that a SUSPENDED encumbrance blocks the ACTIVE -> INACTIVE hop while leaving license_status untouched — is exactly what the difficulty instance walks end to end, including the invalid-transition refusals from each combined state."

      - name: proceeding_cycle_relitigation_stub
        claim_type: invalid_transition
        grounds:
          - state_machines.DisciplinaryProceeding.transitions.HEARING_CONVENED_to_CONTINUED
          - state_machines.DisciplinaryProceeding.transitions.DELIBERATION_to_HEARING_CONVENED
        excluded_because:
          difficulty_instance: non_linear_state_machine / hearing_continuance_cycle_returns_to_convened_state
          rationale: "The cyclic CONVENE -> CONTINUE -> CONVENE and DELIBERATION -> REOPEN edges, the shared continuance_count budget, the re-freezing of sanction_floor_tier and the refusal once the budget is spent are all asserted by that difficulty instance; a separate corner test would only re-walk the same edges."

  # ===========================================================================
  - section: calculations
    instances:

      - name: ce_credit_hours_quantised_to_a_quarter_hour_round_half_up
        claim_type: precision
        grounds:
          - calculations.ce_hour_credit_total.precision
          - entities.CeRecord.fields.credit_hours
          - calculations.ce_hour_credit_total.constants
        distinguishing_aspect: "Quantisation happens on the individual CeRecord at creation time, before any variant runs: 50 minutes is 3.3333 quarter-hours and rounds DOWN to 0.75 h while 55 minutes is 3.6667 and rounds UP to 1.00 h, so a naive minutes/60 rounded to two decimals (0.83 / 0.92) is wrong."
        test_recipe:
          setup:
            - "An RN license issued 2026-08-01 under board OH has a DRAFT renewal whose window is [2026-08-01, 2028-08-01)."
          setup_api_calls:
            - call: "POST /state-board-configs"
              payload: { state_code: "OH", board_name: "Ohio Board of Nursing", compact_member: true }
