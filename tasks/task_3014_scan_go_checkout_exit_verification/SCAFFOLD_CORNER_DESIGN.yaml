  # ===========================================================================
  # Section: errors
  # ===========================================================================
  - section: errors
    instances:
      - name: error_envelope_shape_and_success_envelope_shape
        claim_type: envelope_shape
        grounds: [response_envelope]
        distinguishing_aspect: "Error responses carry meta + response_type 'error' + data.error_id/message; success responses carry meta.api_request_id + response_type 'object' + data."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /clubs/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              as: PlatformAdmin
              captures: { err: $.data.error_id }
            - call: "POST /clubs"
              payload: { name: "Club EV", open_minute: 600, early_shopping_start_minute: 480, exit_verification_mode: "RECEIPT_CODE" }
              as: PlatformAdmin
              captures: { new_id: $.data.id }
          assert:
            - "err == ERR_CLUB_NOT_FOUND (error envelope populated)"
            - "Success response has meta.api_request_id and response_type == object"

      - name: error_session_not_paid_on_exit_scan
        claim_type: violation_to_error
        grounds: ["errors[ERR_SESSION_NOT_PAID]"]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / exit_scan_requires_paid_session
          rationale: "Asserted as the failure path of the named §1.8 instance."

      - name: error_empty_cart_on_pay
        claim_type: violation_to_error
        grounds: ["errors[ERR_EMPTY_CART]"]
        excluded_because:
          difficulty_instance: boundary_precision_check / empty_cart_pay_rejected_single_line_accepted
          rationale: "Asserted as the failure path of the named §1.8 instance."

      - name: error_offer_window_conflict_on_touching_windows
        claim_type: violation_to_error
        grounds: ["errors[ERR_OFFER_WINDOW_CONFLICT]"]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / offer_window_closed_interval_touching_endpoints_conflict
          rationale: "Asserted as the failure path of the named §1.8 instance."

      - name: error_slot_capacity_exceeded_on_overlap
        claim_type: violation_to_error
        grounds: ["errors[ERR_SLOT_CAPACITY_EXCEEDED]"]
        excluded_because:
          difficulty_instance: compensating_invariant / stage_then_cancel_restores_slot_occupancy
          rationale: "Asserted inside the named §1.8 instance (blocked stage before cancel)."

      - name: error_intercept_pending_on_pay
        claim_type: violation_to_error
        grounds: ["errors[ERR_INTERCEPT_PENDING]"]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / pending_intercept_safety_beats_declined_tender_fiscal
          rationale: "Asserted as the winning error of the named §1.8 priority instance."

      - name: error_tender_declined_on_pay
        claim_type: violation_to_error
        grounds: ["errors[ERR_TENDER_DECLINED]"]
        distinguishing_aspect: "With a clean cart (no intercepts) and tender DECLINED, pay fails with 402 ERR_TENDER_DECLINED — the fiscal gate firing unmasked by any safety gate."
        test_recipe:
          setup: ["Club, UNIT item 500c, member tender DECLINED, clock 12:00, session with one non-restricted line"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T12:00:00Z" }
              as: PlatformAdmin
            - call: "POST /clubs"
              payload: { name: "Club TD", open_minute: 600, early_shopping_start_minute: 480, exit_verification_mode: "RECEIPT_CODE" }
              as: PlatformAdmin
              captures: { club_id: $.data.id }
            - call: "POST /clubs/${club_id}/catalog-items"
              payload: { sku: "MILK", item_name: "Milk", pricing_mode: "UNIT", unit_price_cents: 500 }
              as: PlatformAdmin
              captures: { item_id: $.data.id }
            - call: "POST /members"
              payload: { tier: "CLUB", birth_year: 1990, home_club_id: "${club_id}", tender_status: "DECLINED" }
              as: PlatformAdmin
              captures: { member_id: $.data.id }
            - call: "POST /scan-sessions"
              payload: { club_id: "${club_id}" }
              as: Member
              as_user_id: "${member_id}"
              captures: { session_id: $.data.id }
            - call: "POST /scan-sessions/${session_id}/lines"
              payload: { catalog_item_id: "${item_id}", quantity: 1 }
              as: Member
              as_user_id: "${member_id}"
          trigger:
            - call: "POST /scan-sessions/${session_id}/pay"
              as: Member
              as_user_id: "${member_id}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_TENDER_DECLINED"

      - name: error_verification_not_pending_on_second_cv_report
        claim_type: violation_to_error
        grounds: ["errors[ERR_VERIFICATION_NOT_PENDING]"]
        distinguishing_aspect: "A second cv-report on an already-VERIFIED verification fails with ERR_VERIFICATION_NOT_PENDING — terminal verifications accept no further reports."
        test_recipe:
          setup: ["CV_ARCH club; paid session at EXIT_PENDING; first cv-report verifies it"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T12:00:00Z" }
              as: PlatformAdmin
            - call: "POST /clubs"
              payload: { name: "Club VP", open_minute: 600, early_shopping_start_minute: 480, exit_verification_mode: "CV_ARCH" }
              as: PlatformAdmin
              captures: { club_id: $.data.id }
            - call: "POST /clubs/${club_id}/catalog-items"
              payload: { sku: "MILK", item_name: "Milk", pricing_mode: "UNIT", unit_price_cents: 300 }
              as: PlatformAdmin
              captures: { item_id: $.data.id }
            - call: "POST /members"
              payload: { tier: "CLUB", birth_year: 1990, home_club_id: "${club_id}" }
              as: PlatformAdmin
