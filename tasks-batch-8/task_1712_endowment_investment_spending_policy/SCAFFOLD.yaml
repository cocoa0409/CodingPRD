# =============================================================================
# PRD Benchmark Scaffold: Endowment Investment & Spending Policy
# University endowment office — pooled unitization, quarterly valuation,
# spending-rate smoothing, underwater-fund governance, manager oversight.
# =============================================================================

scenario: |
  Endowment Investment & Spending Policy (university endowment office): fund establishment & donor restriction recording, pooled unitization & quarterly unit valuation, spending-rate formula & smoothing calculation, underwater-fund treatment & policy exception, asset allocation & manager performance, gift addition timing & unit purchase, payout distribution to programs & unspent balance, annual donor & board reporting

domain_name: endowment-investment-spending-policy
api_prefix: /endowment

# =============================================================================
# §0: Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: ledger_reconciliation
  secondary_archetype: compliance_audit
  complexity_layers:
    - dual_variant_calculation      # provisional vs final unit price; Dietz vs simple return
    - optimistic_concurrency        # OCC on EndowmentPool.version for finalize / adopt
    - rate_threshold_triggers       # underwater flag, drift bands, excess-return streaks, lapse quarters
    - ops_run_checkpoint            # quarterly valuation finalize advances the pool epoch and runs the close pipeline
  entity_topology: flat             # peer collections under /endowment, FK links in bodies
  state_machine_shape: cyclic       # distribution review loop, fund posture loop, manager watchlist loop, report review loop; Fund also carries parallel dimensions (fund_status x spending_posture)
  relationship_patterns:
    - one_to_many
    - cross_aggregate               # distributions reference exceptions; payouts reference distributions; ledger entries reference any originating entity
    - polymorphic                   # UnitLedgerEntry.reference_id points at GiftContribution | SpendingDistribution | ProgramPayout | UnitValuation
  role_model: segregation_of_duties # proposer/requester/author may never approve/publish their own item
  consistency_model: immediate      # all side effects land inside the triggering request

  constants_glossary:
    INCEPTION_UNIT_PRICE_MILLICENTS: 100000   # $1.000 per unit at pool inception
    MIN_ENDOWMENT_CORPUS_CENTS: 5000000       # $50,000.00 minimum to activate an endowed fund
    LAPSE_QUARTERS: 4                          # payout unspent balance sweeps back to the fund at age >= 4 quarters
    QUARTER_DAYS: 90                           # every quarter is treated as exactly 90 days for return math
    QUARTERS_PER_FISCAL_YEAR: 4                # FY k (k = fiscal_year - inception_fiscal_year) covers quarters 4k+1 .. 4k+4
    UNIT_SCALE: 1000000                        # units tracked in micro-units (1 unit = 1e6 micro)
    PRICE_SCALE: 1000                          # unit price tracked in millicents (1 cent = 1000 millicents); value_cents = units_micro * price_millicents / 1e9

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: EndowmentPool
    parent: null
    common_fields: true
    fields:
      - { name: pool_name, type: string, source: input, description: "Display name of the pooled endowment" }
      - { name: inception_fiscal_year, type: integer, source: input, description: "Fiscal year the pool begins operating (e.g. 2026); quarters are numbered globally from 1 and FY k covers quarters 4k+1..4k+4 where k = fiscal_year - inception_fiscal_year", constraints: ">= 2000 and <= 2100" }
      - { name: pool_status, type: enum, source: system, description: "ACTIVE | SUSPENDED | TERMINATED; gates nearly all child mutations", default: ACTIVE }
      - { name: current_quarter_index, type: integer, source: system, description: "Count of FINALIZED quarters; 0 at inception; the open quarter is always current_quarter_index + 1", default: 0 }
      - { name: current_unit_price_millicents, type: integer, source: computed, description: "Unit price of the most recent FINAL valuation in millicents; INCEPTION_UNIT_PRICE_MILLICENTS before any finalize", default: 100000 }
      - { name: total_units_outstanding_micro, type: integer, source: computed, description: "Sum of all funds' units_held_micro; exact integer identity maintained by construction", default: 0 }
      - { name: total_market_value_cents, type: integer, source: computed, description: "final_pool_market_value_cents of the most recent FINAL valuation; 0 before any finalize", default: 0 }

  - name: SpendingPolicyVersion
    parent: null
    common_fields: true
    fields:
      - { name: pool_id, type: string, source: input, description: "FK -> EndowmentPool.id; pool this policy governs" }
      - { name: spending_rate_bps, type: integer, source: input, description: "Annual spending rate in basis points", constraints: "100..2000 (1.00%..20.00%)" }
      - { name: smoothing_window_quarters, type: integer, source: input, description: "Trailing quarters averaged into the spending base", constraints: "4..20" }
      - { name: band_floor_bps, type: integer, source: input, description: "Max allowed DECREASE vs prior-year final distribution, in bps of the prior amount", constraints: "0..10000" }
      - { name: band_cap_bps, type: integer, source: input, description: "Max allowed INCREASE vs prior-year final distribution, in bps of the prior amount", constraints: "0..10000" }
      - { name: effective_from_fiscal_year, type: integer, source: input, description: "First fiscal year governed; ADOPTED policies of a pool must form a strictly increasing sequence of effective years (half-open windows [e_i, e_{i+1})); equal to an existing adopted year conflicts" }
      - { name: policy_status, type: enum, source: system, description: "DRAFT | ADOPTED | SUPERSEDED | WITHDRAWN", default: DRAFT }
      - { name: proposed_by_user_id, type: string, source: system, description: "X-User-ID of creator; adoption by the same user is a segregation-of-duties violation" }
      - { name: adopted_by_user_id, type: string, source: system, description: "X-User-ID of adopter; null until ADOPTED" }

  - name: UnitValuation
    parent: null
    common_fields: true
    fields:
      - { name: pool_id, type: string, source: input, description: "FK -> EndowmentPool.id" }
      - { name: quarter_index, type: integer, source: system, description: "Assigned at creation as pool.current_quarter_index + 1; only the open quarter may be valued" }
      - { name: valuation_status, type: enum, source: system, description: "PRELIMINARY | FINAL | SUPERSEDED", default: PRELIMINARY }
      - { name: estimated_pool_market_value_cents, type: integer, source: input, description: "Unaudited pool market value used for the preliminary price", constraints: ">= 0" }
      - { name: final_pool_market_value_cents, type: integer, source: input, description: "Audited pool market value supplied at finalize; must equal the sum of ending_mv_cents across that quarter's eligible manager reports", constraints: ">= 0" }
      - { name: preliminary_unit_price_millicents, type: integer, source: computed, description: "At creation: if total_units_outstanding_micro == 0 then INCEPTION price else round_half_up(estimated_mv * 1e9 / total_units_outstanding_micro)" }
      - { name: final_unit_price_millicents, type: integer, source: computed, description: "At finalize: if pre-flow units == 0 then INCEPTION price else round_half_up(final_mv * 1e9 / pre-flow units); null until FINAL" }
      - { name: created_by_user_id, type: string, source: system, description: "X-User-ID of creator" }
      - { name: finalized_by_user_id, type: string, source: system, description: "X-User-ID of finalizer; null until FINAL" }
      - { name: supersedes_valuation_id, type: string, source: system, description: "FK -> UnitValuation.id; set on the corrective PRELIMINARY created by a supersede; null otherwise" }

  - name: Donor
    parent: null
    common_fields: true
    fields:
      - { name: donor_name, type: string, source: input, description: "Legal name of the donor" }
      - { name: donor_type, type: enum, source: input, description: "INDIVIDUAL | FOUNDATION | CORPORATION | ESTATE" }
      - { name: contact_email, type: string, source: input, description: "Optional contact", constraints: "nullable" }
      - { name: total_contributed_cents, type: integer, source: computed, description: "Sum of amount_cents over the donor's gifts with gift_status in {RECEIVED, UNITIZED}", default: 0 }

  - name: Fund
    parent: null
    common_fields: true
    fields:
      - { name: pool_id, type: string, source: input, description: "FK -> EndowmentPool.id" }
      - { name: fund_code, type: string, source: input, description: "Unique per pool, case-sensitive", constraints: "unique within pool_id" }
      - { name: fund_name, type: string, source: input, description: "Display name" }
      - { name: endowment_class, type: enum, source: input, description: "TRUE_ENDOWMENT | QUASI_ENDOWMENT | TERM_ENDOWMENT; QUASI is exempt from underwater suspension and HGV floor; TERM becomes exempt from quarter term_end_quarter_index onward" }
      - { name: term_end_quarter_index, type: integer, source: input, description: "Required iff endowment_class == TERM_ENDOWMENT, else must be null; restriction lifts when a finalized quarter_index >= this value", constraints: ">= 1, nullable" }
      - { name: purpose_restriction, type: enum, source: input, description: "UNRESTRICTED | SCHOLARSHIP | PROFESSORSHIP | RESEARCH | CAPITAL_PROJECTS; payouts from a non-UNRESTRICTED fund must carry the same program_purpose" }
      - { name: fund_status, type: enum, source: system, description: "Lifecycle dimension: DRAFT | ACTIVE | TERMINATED", default: DRAFT }
      - { name: spending_posture, type: enum, source: system, description: "Parallel dimension independent of fund_status: NORMAL | SPENDING_SUSPENDED | EXCEPTION_ACTIVE", default: NORMAL }
      - { name: historic_gift_value_cents, type: integer, source: computed, description: "Donor-restricted corpus basis; += amount on CORPUS gift unitization, -= amount on corpus redemption (floor 0); never moved by market or spending", default: 0 }
      - { name: pledged_corpus_cents, type: integer, source: computed, description: "Sum of amount_cents over gifts with gift_type CORPUS and gift_status in {PLEDGED, RECEIVED, UNITIZED} (i.e. all non-CANCELLED, non-RETURNED corpus gifts); drives the activation minimum so a fund can activate on signed pledges before cash arrives", default: 0 }
      - { name: units_held_micro, type: integer, source: computed, description: "Micro-units held in the pool; moved only by unitizations and redemptions", default: 0 }
      - { name: market_value_cents, type: integer, source: computed, description: "round_half_up(units_held_micro * pool.current_unit_price_millicents / 1e9); refreshed on every price move and unit flow", default: 0 }
      - { name: is_underwater, type: boolean, source: computed, description: "market_value_cents < historic_gift_value_cents (strictly less; equality is NOT underwater); recomputed at finalize and on corpus redemption", default: false }
      - { name: activated_quarter_index, type: integer, source: system, description: "Open quarter index at activation; null until ACTIVE" }
      - { name: created_by_user_id, type: string, source: system, description: "X-User-ID of creator" }

  - name: GiftContribution
    parent: null
    common_fields: true
    fields:
      - { name: fund_id, type: string, source: input, description: "FK -> Fund.id" }
      - { name: donor_id, type: string, source: input, description: "FK -> Donor.id; null only for system-created sweep reinvestments", constraints: "nullable for system sweep gifts" }
      - { name: external_ref, type: string, source: input, description: "Client-supplied dedup key; unique per fund among all non-CANCELLED gifts; system sweep gifts use SWEEP-<payout_id>" }
      - { name: gift_type, type: enum, source: input, description: "CORPUS (adds to historic_gift_value at unitization) | EXPENDABLE (unitizes without touching HGV)" }
      - { name: amount_cents, type: integer, source: input, description: "Gift amount", constraints: "> 0" }
      - { name: gift_status, type: enum, source: system, description: "PLEDGED | RECEIVED | UNITIZED | RETURNED | CANCELLED", default: PLEDGED }
      - { name: received_quarter_index, type: integer, source: system, description: "Open quarter (pool.current_quarter_index + 1) stamped at receive; determines which quarter's FINAL price unitizes the gift" }
      - { name: provisional_units_estimate_micro, type: integer, source: computed, description: "At receive: round_half_up(amount_cents * 1e9 / pool.current_unit_price_millicents) using the latest FINAL price — advisory only" }
      - { name: unitized_quarter_index, type: integer, source: system, description: "Quarter whose FINAL price actually unitized the gift; null until UNITIZED" }
      - { name: units_purchased_micro, type: integer, source: computed, description: "At unitization: round_half_up(amount_cents * 1e9 / final_unit_price of unitized_quarter_index); null until UNITIZED" }
      - { name: source_payout_id, type: string, source: system, description: "FK -> ProgramPayout.id; set only on sweep reinvestment gifts; null for donor gifts", constraints: "nullable" }

  - name: SpendingDistribution
    parent: null
    common_fields: true
    fields:
      - { name: fund_id, type: string, source: input, description: "FK -> Fund.id" }
      - { name: fiscal_year, type: integer, source: input, description: "Distribution year; must satisfy pool.inception_fiscal_year <= fiscal_year <= current_fiscal_year + 1 where current_fiscal_year = inception + floor(current_quarter_index / 4)" }
      - { name: distribution_status, type: enum, source: system, description: "PROJECTED | PROPOSED | REVISION_REQUESTED | APPROVED | DISTRIBUTED | CANCELLED", default: PROJECTED }
      - { name: policy_id, type: string, source: system, description: "FK -> SpendingPolicyVersion.id; the applicable policy (max effective_from_fiscal_year <= fiscal_year among ADOPTED or SUPERSEDED) captured at each computation" }
      - { name: smoothed_base_cents, type: integer, source: computed, description: "Average of the fund's quarter-end market values over the trailing smoothing_window_quarters finalized quarters in which the fund held units; per-quarter MV rounded half-up to cents first, then averaged, then rounded half-up to cents; if the fund held units in no finalized quarter, base = current market_value_cents" }
      - { name: raw_amount_cents, type: integer, source: computed, description: "round_half_up(smoothed_base_cents * spending_rate_bps / 10000)" }
      - { name: prior_year_distribution_cents, type: integer, source: system, description: "final_amount_cents of the fund's DISTRIBUTED distribution for fiscal_year - 1; null if none exists, which disables the band clamp" }
      - { name: band_adjusted_amount_cents, type: integer, source: computed, description: "If prior_year_distribution_cents is null: raw_amount_cents. Else clamp: min(raw, round_half_up(prior * (10000 + band_cap_bps) / 10000)) then max(that, round_half_up(prior * (10000 - band_floor_bps) / 10000))" }
      - { name: was_underwater_at_proposal, type: boolean, source: computed, description: "Fund is_underwater snapshot at the most recent computation", default: false }
      - { name: applied_exception_id, type: string, source: system, description: "FK -> PolicyException.id; set at approve when the fund is underwater and an APPROVED exception for (fund, fiscal_year) exists; null otherwise", constraints: "nullable" }
      - { name: final_amount_cents, type: integer, source: computed, description: "Computed at propose/repropose/approve: if fund is underwater and not exempt (QUASI or matured TERM): 0 unless an APPROVED exception exists, then min(exception.approved_amount_cents, band_adjusted_amount_cents); else band_adjusted_amount_cents" }
      - { name: distributed_amount_cents, type: integer, source: computed, description: "Cash actually redeemed at distribute; equals final_amount_cents on success", default: 0 }
      - { name: units_redeemed_micro, type: integer, source: computed, description: "Units burned at distribute: round_half_up(final_amount_cents * 1e9 / pool.current_unit_price_millicents); null until DISTRIBUTED" }
      - { name: proposed_by_user_id, type: string, source: system, description: "X-User-ID of the most recent propose/repropose" }
      - { name: approved_by_user_id, type: string, source: system, description: "X-User-ID of approver; must differ from proposed_by_user_id; null until APPROVED" }

  - name: PolicyException
    parent: null
    common_fields: true
    fields:
      - { name: fund_id, type: string, source: input, description: "FK -> Fund.id; fund must be ACTIVE and currently underwater at request time" }
      - { name: fiscal_year, type: integer, source: input, description: "Year the exception authorizes spending for" }
      - { name: requested_amount_cents, type: integer, source: input, description: "Requested spending allowance", constraints: "> 0" }
      - { name: justification, type: string, source: input, description: "Free-text rationale for the board" }
      - { name: exception_status, type: enum, source: system, description: "REQUESTED | ENDORSED | APPROVED | REJECTED | EXERCISED | EXPIRED | RESCINDED", default: REQUESTED }
      - { name: approved_amount_cents, type: integer, source: input, description: "Supplied at approve; must be <= requested_amount_cents; null until APPROVED", constraints: "> 0 and <= requested_amount_cents" }
      - { name: requested_by_user_id, type: string, source: system, description: "X-User-ID of requester" }
      - { name: endorsed_by_user_id, type: string, source: system, description: "X-User-ID of endorser; must differ from requested_by_user_id; null until ENDORSED" }
      - { name: approved_by_user_id, type: string, source: system, description: "X-User-ID of approver; must differ from both requested_by and endorsed_by; null until APPROVED" }

  - name: ProgramPayout
    parent: null
    common_fields: true
    fields:
      - { name: distribution_id, type: string, source: input, description: "FK -> SpendingDistribution.id; distribution must be DISTRIBUTED at creation" }
      - { name: program_code, type: string, source: input, description: "Identifier of the receiving university program" }
      - { name: program_purpose, type: enum, source: input, description: "SCHOLARSHIP | PROFESSORSHIP | RESEARCH | CAPITAL_PROJECTS; must equal the fund's purpose_restriction unless that restriction is UNRESTRICTED" }
      - { name: allocated_amount_cents, type: integer, source: input, description: "Amount earmarked; sum over the distribution's non-cancelled payouts must not exceed distributed_amount_cents", constraints: "> 0" }
      - { name: payout_status, type: enum, source: system, description: "SCHEDULED | DISBURSED | CLOSED_FULLY_SPENT | CLOSED_RETURNED", default: SCHEDULED }
      - { name: disbursed_quarter_index, type: integer, source: system, description: "Open quarter at disbursement; lapse age is measured against it; null until DISBURSED" }
      - { name: spent_amount_cents, type: integer, source: input, description: "Cumulative program spending, set by report_spending; must be >= current value and <= allocated_amount_cents", default: 0 }
      - { name: unspent_amount_cents, type: integer, source: computed, description: "allocated_amount_cents - spent_amount_cents while DISBURSED; 0 once CLOSED", default: 0 }
      - { name: swept_gift_id, type: string, source: system, description: "FK -> GiftContribution.id; the EXPENDABLE reinvestment gift created by the lapse sweep; null until swept", constraints: "nullable" }

  - name: AssetClassAllocation
    parent: null
    common_fields: true
    fields:
      - { name: pool_id, type: string, source: input, description: "FK -> EndowmentPool.id" }
      - { name: asset_class, type: enum, source: input, description: "US_EQUITY | DEVELOPED_INTL_EQUITY | EMERGING_MARKETS | FIXED_INCOME | REAL_ASSETS | PRIVATE_EQUITY | CASH; unique per pool" }
      - { name: target_pct_bps, type: integer, source: input, description: "Policy target weight in bps; the pool's targets must sum to exactly 10000", constraints: "0..10000" }
      - { name: rebalance_band_bps, type: integer, source: input, description: "Tolerance around target; breach iff abs(actual_pct_bps - target_pct_bps) > rebalance_band_bps (strictly greater; equality stays in-band)", constraints: "1..5000" }
      - { name: actual_pct_bps, type: integer, source: computed, description: "At finalize: round_half_up(class_market_value_cents * 10000 / total market value); 0 when total is 0", default: 0 }
      - { name: drift_status, type: enum, source: system, description: "IN_BAND | BREACHED; recomputed at every finalize", default: IN_BAND }
      - { name: drift_acknowledged, type: boolean, source: system, description: "Set true by BoardMember acknowledge_drift; reset to false whenever a finalize flips the allocation into BREACHED", default: false }

  - name: InvestmentManager
    parent: null
    common_fields: true
    fields:
      - { name: pool_id, type: string, source: input, description: "FK -> EndowmentPool.id" }
      - { name: manager_name, type: string, source: input, description: "External manager name" }
      - { name: asset_class, type: enum, source: input, description: "Same enum as AssetClassAllocation.asset_class" }
      - { name: benchmark_code, type: string, source: input, description: "Benchmark identifier used for excess-return comparison" }
      - { name: coverage_start_quarter, type: integer, source: input, description: "First quarter the manager may report", constraints: ">= 1" }
      - { name: coverage_end_quarter, type: integer, source: system, description: "Set to pool.current_quarter_index at termination; null while engaged; coverage interval is INCLUSIVE at both ends" }
      - { name: engagement_status, type: enum, source: system, description: "PROSPECT | ENGAGED | WATCHLIST | PROBATION | TERMINATED | DECLINED", default: PROSPECT }
      - { name: neg_excess_streak, type: integer, source: system, description: "Consecutive reports (chronological by quarter) with excess_bps < 0; reset to 0 by any excess_bps >= 0", default: 0 }
      - { name: nonneg_excess_streak, type: integer, source: system, description: "Consecutive reports with excess_bps >= 0; reset to 0 by any excess_bps < 0", default: 0 }

  - name: ManagerQuarterReport
    parent: null
    common_fields: true
    fields:
      - { name: manager_id, type: string, source: input, description: "FK -> InvestmentManager.id; manager must be ENGAGED, WATCHLIST, or PROBATION" }
      - { name: quarter_index, type: integer, source: input, description: "Must equal the pool's open quarter (current_quarter_index + 1) and be >= coverage_start_quarter; unique per manager" }
      - { name: beginning_mv_cents, type: integer, source: input, description: "Market value at quarter start; must equal the manager's prior-quarter ending_mv_cents when a prior report exists", constraints: ">= 0" }
      - { name: ending_mv_cents, type: integer, source: input, description: "Market value at quarter end", constraints: ">= 0" }
      - { name: flows, type: array, source: input, description: "List of {day_offset: integer 0..89, amount_cents: integer != 0}; contributions positive, distributions negative; may be empty" }
      - { name: benchmark_return_bps, type: integer, source: input, description: "Benchmark total return for the quarter in bps; may be negative" }
      - { name: return_bps, type: integer, source: computed, description: "Modified Dietz: round_half_up(10000 * (E - B - sumF) * 90 / (B * 90 + sum((90 - day_offset_i) * amount_i))); 0 when the denominator is 0" }
      - { name: simple_return_bps, type: integer, source: computed, description: "Flow-blind variant: round_half_up(10000 * (E - B - sumF) / B); 0 when B == 0; stored for comparison with return_bps" }
      - { name: excess_bps, type: integer, source: computed, description: "return_bps - benchmark_return_bps; sign drives the engagement streaks" }

  - name: AnnualReport
    parent: null
    common_fields: true
    fields:
      - { name: pool_id, type: string, source: input, description: "FK -> EndowmentPool.id" }
      - { name: fund_id, type: string, source: input, description: "FK -> Fund.id; required for DONOR_FUND reports, must be null otherwise", constraints: "nullable" }
      - { name: report_type, type: enum, source: input, description: "DONOR_FUND | BOARD_INVESTMENT | SPENDING_COMPLIANCE" }
      - { name: fiscal_year, type: integer, source: input, description: "Must be a completed fiscal year: 4 * (fiscal_year - inception + 1) <= pool.current_quarter_index" }
      - { name: report_status, type: enum, source: system, description: "DRAFT | UNDER_REVIEW | PUBLISHED", default: DRAFT }
      - { name: created_by_user_id, type: string, source: system, description: "X-User-ID of author; publish by the same user is a segregation-of-duties violation" }
      - { name: published_by_user_id, type: string, source: system, description: "X-User-ID of publisher; null until PUBLISHED" }

  - name: UnitLedgerEntry
    parent: null
    common_fields: false
    fields:
      - { name: fund_id, type: string, source: system, description: "FK -> Fund.id" }
      - { name: quarter_index, type: integer, source: system, description: "Quarter the entry belongs to (the quarter being finalized, or the open quarter for out-of-band redemptions)" }
      - { name: entry_type, type: enum, source: system, description: "GIFT_UNITIZE | REINVEST_UNITIZE | DISTRIBUTION_REDEEM | CORPUS_REDEEM" }
      - { name: units_delta_micro, type: integer, source: system, description: "Signed micro-unit movement" }
      - { name: amount_cents, type: integer, source: system, description: "Signed cash value associated with the movement" }
      - { name: reference_id, type: string, source: system, description: "Polymorphic origin identifier: id of the GiftContribution, SpendingDistribution, ProgramPayout, or superseding UnitValuation that caused the entry; identity only, never used for ordering (entries order by created_at)" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: EndowmentPool
    field: pool_status
    initial_state: ACTIVE
    terminal_states: [TERMINATED]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /endowment/pools/{pool_id}/suspend"
        actor: EndowmentAdmin
        preconditions: ["pool_status == ACTIVE"]
        side_effects:
          - "increments EndowmentPool.version by 1"
          - "while SUSPENDED, all value-moving child operations are rejected with ERR_POOL_SUSPENDED (gift receive, valuation create/finalize/supersede, distribution create/propose/repropose/approve/distribute, payout create/disburse, manager engage, manager report filing, allocation bulk_upsert, policy create/adopt, fund activate/redeem_corpus)"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /endowment/pools/{pool_id}/resume"
        actor: EndowmentAdmin
        preconditions: ["pool_status == SUSPENDED"]
        side_effects: ["increments EndowmentPool.version by 1"]
      - from: [ACTIVE, SUSPENDED]
        to: TERMINATED
        trigger: "POST /endowment/pools/{pool_id}/terminate"
        actor: BoardMember
        preconditions:
          - "every Fund with pool_id == this pool has fund_status == TERMINATED (a pool with zero funds qualifies)"
        side_effects:
          - "increments EndowmentPool.version by 1"
          - "all remaining non-terminal GiftContribution records of the pool's funds are rejected going forward (pool read-only)"

  - entity: SpendingPolicyVersion
    field: policy_status
    initial_state: DRAFT
    terminal_states: [SUPERSEDED, WITHDRAWN]
    transitions:
      - from: DRAFT
        to: ADOPTED
        trigger: "POST /endowment/policies/{policy_id}/adopt"
        actor: BoardMember
        preconditions:
          - "pool.pool_status == ACTIVE"
          - "policy_status == DRAFT"
          - "no ADOPTED policy of the same pool has effective_from_fiscal_year == this policy's (strictly increasing half-open windows)"
          - "this policy's effective_from_fiscal_year > every other ADOPTED policy's effective_from_fiscal_year for the pool (adoption appends a new latest window)"
          - "adopter X-User-ID != proposed_by_user_id (segregation of duties)"
          - "expected_pool_version matches pool.version (OCC)"
        side_effects:
          - "the pool's previously latest ADOPTED policy (if any) transitions ADOPTED -> SUPERSEDED (its window closes; it still governs its past fiscal years for historical lookups)"
          - "increments EndowmentPool.version by 1"
      - from: DRAFT
        to: WITHDRAWN
        trigger: "POST /endowment/policies/{policy_id}/withdraw"
        actor: InvestmentOfficer
        preconditions: ["policy_status == DRAFT"]
        side_effects: []

  - entity: UnitValuation
    field: valuation_status
    initial_state: PRELIMINARY
    terminal_states: [FINAL, SUPERSEDED]
    transitions:
      - from: PRELIMINARY
        to: FINAL
        trigger: "POST /endowment/valuations/{valuation_id}/finalize"
        actor: InvestmentOfficer
        preconditions:
          - "valuation_status == PRELIMINARY"
          - "pool.pool_status == ACTIVE"
          - "every InvestmentManager of the pool with coverage_start_quarter <= quarter_index, (coverage_end_quarter null or >= quarter_index), and engagement_status not in {PROSPECT, DECLINED} has a ManagerQuarterReport for quarter_index (ERR_MANAGER_REPORT_MISSING)"
          - "final_pool_market_value_cents == sum of ending_mv_cents over those reports (ERR_POOL_MV_MISMATCH)"
          - "sum of target_pct_bps over the pool's AssetClassAllocation records == 10000 (ERR_ALLOCATION_SUM_INVALID)"
          - "expected_pool_version matches pool.version (OCC)"
        side_effects:
          - "runs calculation quarter_close_pipeline in its pinned step order (price, lapse sweep, unitization, HGV/MV refresh, underwater & posture, exception expiry cascade, allocation drift, epoch advance)"
          - "pool.current_quarter_index := quarter_index; pool.current_unit_price_millicents and total_market_value_cents updated"
          - "increments EndowmentPool.version by 1"
      - from: FINAL
        to: SUPERSEDED
        trigger: "POST /endowment/valuations/{valuation_id}/supersede"
        actor: InvestmentOfficer
        preconditions:
          - "valuation_status == FINAL"
          - "quarter_index == pool.current_quarter_index (only the latest finalized quarter may be restated)"
          - "no GiftContribution has unitized_quarter_index == quarter_index, no ProgramPayout was swept in quarter_index, no ManagerQuarterReport exists for quarter_index, and no SpendingDistribution was DISTRIBUTED after this finalize (ERR_VALUATION_LOCKED otherwise) — in practice only quarters of a zero-manager pool with no unitizing gifts qualify"
          - "expected_pool_version matches pool.version (OCC)"
        side_effects:
          - "pool state rolls back to the end of quarter_index - 1: current_quarter_index decremented, current_unit_price_millicents and total_market_value_cents restored to the prior quarter's FINAL values (INCEPTION price and 0 when quarter_index == 1), allocation drift restored to pre-finalize values; no unit flows are touched because the lock preconditions guarantee none consumed this quarter"
          - "creates a corrective PRELIMINARY UnitValuation for the same quarter_index with supersedes_valuation_id == this valuation's id and estimated_pool_market_value_cents := revised_pool_market_value_cents"
          - "increments EndowmentPool.version by 1"

  - entity: Fund
    field: fund_status
    initial_state: DRAFT
    terminal_states: [TERMINATED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /endowment/funds/{fund_id}/activate"
        actor: DevelopmentOfficer
        preconditions:
          - "fund_status == DRAFT"
          - "pool.pool_status == ACTIVE"
          - "pledged_corpus_cents >= MIN_ENDOWMENT_CORPUS_CENTS (5000000)"
          - "if endowment_class == TERM_ENDOWMENT then term_end_quarter_index is not null"
        side_effects:
          - "activated_quarter_index := pool.current_quarter_index + 1"
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /endowment/funds/{fund_id}/terminate"
        actor: BoardMember
        preconditions:
          - "fund_status == ACTIVE"
          - "units_held_micro == 0"
          - "no GiftContribution of the fund in PLEDGED or RECEIVED"
          - "no SpendingDistribution of the fund in PROJECTED, PROPOSED, REVISION_REQUESTED, or APPROVED"
          - "no ProgramPayout (via the fund's distributions) in SCHEDULED or DISBURSED"
        side_effects: ["spending_posture forced to NORMAL"]

  - entity: Fund
    field: spending_posture
    initial_state: NORMAL
    terminal_states: []
    transitions:
      - from: NORMAL
        to: SPENDING_SUSPENDED
        trigger: "system (valuation finalize: is_underwater computed true and fund not exempt)"
        actor: system
        preconditions:
          - "market_value_cents < historic_gift_value_cents after the finalize refresh (strict)"
          - "endowment_class != QUASI_ENDOWMENT and not (endowment_class == TERM_ENDOWMENT and finalized quarter_index >= term_end_quarter_index)"
        side_effects: ["increments Fund.version by 1"]
      - from: SPENDING_SUSPENDED
        to: NORMAL
        trigger: "system (valuation finalize: fund no longer underwater, or became exempt by term maturity)"
        actor: system
        preconditions:
          - "is_underwater == false after refresh, OR fund became exempt this finalize"
        side_effects: ["increments Fund.version by 1"]
      - from: SPENDING_SUSPENDED
        to: EXCEPTION_ACTIVE
        trigger: "system (PolicyException for this fund reaches APPROVED)"
        actor: system
        preconditions: ["an exception for (fund, fiscal_year) transitions to APPROVED while fund remains underwater"]
        side_effects: ["increments Fund.version by 1"]
      - from: EXCEPTION_ACTIVE
        to: SPENDING_SUSPENDED
        trigger: "system (exception EXERCISED at distribution payout, or EXPIRED at quarter close, or RESCINDED by board)"
        actor: system
        preconditions: ["the governing exception left APPROVED state"]
        side_effects:
          - "if the exception exit was EXPIRED or RESCINDED and the fund remains underwater, posture lands on SPENDING_SUSPENDED; if the fund is no longer underwater the next finalize will move it to NORMAL"
          - "increments Fund.version by 1"

  - entity: GiftContribution
    field: gift_status
    initial_state: PLEDGED
    terminal_states: [UNITIZED, RETURNED, CANCELLED]
    transitions:
      - from: PLEDGED
        to: RECEIVED
        trigger: "POST /endowment/gifts/{gift_id}/receive"
        actor: DevelopmentOfficer
        preconditions:
          - "gift_status == PLEDGED"
          - "fund.fund_status == ACTIVE"
          - "pool.pool_status == ACTIVE"
        side_effects:
          - "received_quarter_index := pool.current_quarter_index + 1"
          - "provisional_units_estimate_micro := round_half_up(amount_cents * 1e9 / pool.current_unit_price_millicents)"
          - "donor.total_contributed_cents += amount_cents"
      - from: RECEIVED
        to: UNITIZED
        trigger: "system (valuation finalize of quarter received_quarter_index — the gift must be RECEIVED strictly before that quarter's finalize to catch its price)"
        actor: system
        preconditions: ["gift_status == RECEIVED and received_quarter_index == quarter being finalized"]
        side_effects:
          - "units_purchased_micro := round_half_up(amount_cents * 1e9 / final_unit_price_millicents of the finalized quarter); unitized_quarter_index set"
          - "fund.units_held_micro += units_purchased_micro; pool.total_units_outstanding_micro += same"
          - "if gift_type == CORPUS: fund.historic_gift_value_cents += amount_cents"
          - "emits UnitLedgerEntry (GIFT_UNITIZE for donor gifts, REINVEST_UNITIZE when source_payout_id is set)"
      - from: PLEDGED
        to: CANCELLED
        trigger: "POST /endowment/gifts/{gift_id}/cancel"
        actor: DevelopmentOfficer
        preconditions: ["gift_status == PLEDGED"]
        side_effects:
          - "if gift_type == CORPUS: fund.pledged_corpus_cents -= amount_cents (compensates the create step)"
      - from: RECEIVED
        to: RETURNED
        trigger: "POST /endowment/gifts/{gift_id}/rescind"
        actor: DevelopmentOfficer
        preconditions:
          - "gift_status == RECEIVED (rescission after unitization is impossible)"
        side_effects:
          - "if gift_type == CORPUS: fund.pledged_corpus_cents -= amount_cents (compensates the create step)"
          - "donor.total_contributed_cents -= amount_cents (compensates the receive step)"

  - entity: SpendingDistribution
    field: distribution_status
    initial_state: PROJECTED
    terminal_states: [DISTRIBUTED, CANCELLED]
    transitions:
      - from: PROJECTED
        to: PROPOSED
        trigger: "POST /endowment/distributions/{distribution_id}/propose"
        actor: DevelopmentOfficer
        preconditions:
          - "distribution_status == PROJECTED"
          - "pool.pool_status == ACTIVE"
          - "fund.fund_status == ACTIVE"
        side_effects:
          - "recomputes smoothed_base_cents, raw_amount_cents, prior_year_distribution_cents, band_adjusted_amount_cents, was_underwater_at_proposal, final_amount_cents, policy_id against current data"
          - "proposed_by_user_id := X-User-ID"
      - from: REVISION_REQUESTED
        to: PROPOSED
        trigger: "POST /endowment/distributions/{distribution_id}/repropose"
        actor: DevelopmentOfficer
        preconditions:
          - "distribution_status == REVISION_REQUESTED"
          - "pool.pool_status == ACTIVE"
        side_effects: ["same recomputation as propose; proposed_by_user_id refreshed"]
      - from: PROPOSED
        to: REVISION_REQUESTED
        trigger: "POST /endowment/distributions/{distribution_id}/request_revision"
        actor: BoardMember
        preconditions: ["distribution_status == PROPOSED"]
        side_effects: []
        note: "review loop: PROPOSED -> REVISION_REQUESTED -> PROPOSED may iterate without bound"
      - from: PROPOSED
        to: APPROVED
        trigger: "POST /endowment/distributions/{distribution_id}/approve"
        actor: BoardMember
        preconditions:
          - "distribution_status == PROPOSED"
          - "pool.pool_status == ACTIVE"
          - "approver X-User-ID != proposed_by_user_id (segregation of duties)"
          - "if fund.is_underwater and fund not exempt: an APPROVED PolicyException for (fund_id, fiscal_year) must exist (ERR_UNDERWATER_SPENDING_BLOCKED)"
        side_effects:
          - "recomputes all derived amounts; sets final_amount_cents (0 when underwater without exception; min(exception.approved_amount_cents, band_adjusted) with one; else band_adjusted)"
          - "applied_exception_id set when an exception is used"
          - "approved_by_user_id := X-User-ID"
      - from: APPROVED
        to: DISTRIBUTED
        trigger: "POST /endowment/distributions/{distribution_id}/distribute"
        actor: InvestmentOfficer
        preconditions:
          - "distribution_status == APPROVED"
          - "pool.pool_status == ACTIVE"
          - "units_redeemed_micro = round_half_up(final_amount_cents * 1e9 / pool.current_unit_price_millicents) <= fund.units_held_micro (ERR_INSUFFICIENT_UNITS)"
          - "final_amount_cents > 0"
        side_effects:
          - "fund.units_held_micro -= units_redeemed_micro; pool.total_units_outstanding_micro -= same; fund.market_value_cents and is_underwater refreshed"
          - "distributed_amount_cents := final_amount_cents"
          - "emits UnitLedgerEntry DISTRIBUTION_REDEEM"
          - "if applied_exception_id is set: that PolicyException transitions APPROVED -> EXERCISED, and the fund's spending_posture EXCEPTION_ACTIVE -> SPENDING_SUSPENDED (if still underwater) — a finalize may later move it to NORMAL"
      - from: [PROJECTED, PROPOSED, REVISION_REQUESTED]
        to: CANCELLED
        trigger: "POST /endowment/distributions/{distribution_id}/cancel"
        actor: DevelopmentOfficer
        preconditions: ["distribution_status in {PROJECTED, PROPOSED, REVISION_REQUESTED}"]
        side_effects: []
      - from: APPROVED
        to: CANCELLED
        trigger: "POST /endowment/distributions/{distribution_id}/cancel (board-level withdrawal before any disbursement)"
        actor: BoardMember
        preconditions:
          - "distribution_status == APPROVED"
          - "no ProgramPayout referencing this distribution exists in any status"
        side_effects:
          - "if applied_exception_id is set and that exception is still APPROVED: exception -> RESCINDED and fund posture EXCEPTION_ACTIVE -> SPENDING_SUSPENDED"

  - entity: PolicyException
    field: exception_status
    initial_state: REQUESTED
    terminal_states: [REJECTED, EXERCISED, EXPIRED, RESCINDED]
    transitions:
      - from: REQUESTED
        to: ENDORSED
        trigger: "POST /endowment/exceptions/{exception_id}/endorse"
        actor: InvestmentOfficer
        preconditions:
          - "exception_status == REQUESTED"
          - "endorser X-User-ID != requested_by_user_id (segregation of duties)"
        side_effects: ["endorsed_by_user_id := X-User-ID"]
      - from: [REQUESTED, ENDORSED]
        to: REJECTED
        trigger: "POST /endowment/exceptions/{exception_id}/reject"
        actor: BoardMember
        preconditions: ["exception_status in {REQUESTED, ENDORSED}"]
        side_effects: []
      - from: ENDORSED
        to: APPROVED
        trigger: "POST /endowment/exceptions/{exception_id}/approve"
        actor: BoardMember
        preconditions:
          - "exception_status == ENDORSED"
          - "approved_amount_cents present and <= requested_amount_cents (ERR_EXCEPTION_AMOUNT_EXCEEDS_REQUESTED)"
          - "approver X-User-ID != requested_by_user_id and != endorsed_by_user_id (three-person segregation)"
          - "fund still underwater (ERR_FUND_NOT_UNDERWATER)"
        side_effects:
          - "approved_by_user_id := X-User-ID"
          - "fund.spending_posture SPENDING_SUSPENDED -> EXCEPTION_ACTIVE (this approval is what flips the fund)"
      - from: APPROVED
        to: EXERCISED
        trigger: "system (the SpendingDistribution carrying applied_exception_id == this exception reaches DISTRIBUTED)"
        actor: system
        preconditions: []
        side_effects: ["fund.spending_posture EXCEPTION_ACTIVE -> SPENDING_SUSPENDED when still underwater"]
      - from: APPROVED
        to: EXPIRED
        trigger: "system (valuation finalize closes the last quarter of exception.fiscal_year while the exception is still unused)"
        actor: system
        preconditions: ["finalized quarter_index == 4 * (fiscal_year - pool.inception_fiscal_year + 1)"]
        side_effects:
          - "any SpendingDistribution with applied_exception_id == this exception and status APPROVED reverts APPROVED -> PROPOSED with final_amount_cents recomputed (0 while the fund remains underwater)"
          - "fund.spending_posture EXCEPTION_ACTIVE -> SPENDING_SUSPENDED"
      - from: APPROVED
        to: RESCINDED
        trigger: "POST /endowment/exceptions/{exception_id}/rescind"
        actor: BoardMember
        preconditions: ["exception_status == APPROVED"]
        side_effects:
          - "any SpendingDistribution with applied_exception_id == this exception and status APPROVED reverts APPROVED -> PROPOSED with recomputed final_amount_cents"
          - "fund.spending_posture EXCEPTION_ACTIVE -> SPENDING_SUSPENDED"

  - entity: ProgramPayout
    field: payout_status
    initial_state: SCHEDULED
    terminal_states: [CLOSED_FULLY_SPENT, CLOSED_RETURNED]
    transitions:
      - from: SCHEDULED
        to: DISBURSED
        trigger: "POST /endowment/payouts/{payout_id}/disburse"
        actor: DevelopmentOfficer
        preconditions:
          - "payout_status == SCHEDULED"
          - "pool.pool_status == ACTIVE"
          - "distribution.distribution_status == DISTRIBUTED"
        side_effects:
          - "disbursed_quarter_index := pool.current_quarter_index + 1"
          - "unspent_amount_cents := allocated_amount_cents - spent_amount_cents"
      - from: DISBURSED
        to: CLOSED_FULLY_SPENT
        trigger: "POST /endowment/payouts/{payout_id}/report_spending with spent_amount_cents == allocated_amount_cents"
        actor: ProgramManager
        preconditions:
          - "payout_status == DISBURSED"
          - "spent_amount_cents >= current spent_amount_cents and <= allocated_amount_cents"
        side_effects: ["unspent_amount_cents := 0"]
        note: "partial reports keep the payout DISBURSED and shrink unspent_amount_cents"
      - from: DISBURSED
        to: CLOSED_RETURNED
        trigger: "system (valuation finalize: finalized quarter_index - disbursed_quarter_index >= LAPSE_QUARTERS (4); age exactly 4 lapses)"
        actor: system
        preconditions: ["payout_status == DISBURSED at finalize"]
        side_effects:
          - "unspent = allocated_amount_cents - spent_amount_cents; a GiftContribution is created on the fund with gift_type EXPENDABLE, amount_cents = unspent, gift_status RECEIVED, received_quarter_index = finalized quarter, source_payout_id = this payout, external_ref = SWEEP-<payout_id>; it unitizes in the same finalize pipeline at the new price"
          - "swept_gift_id set; unspent_amount_cents := 0"
      - from: DISBURSED
        to: DISBURSED
        trigger: "POST /endowment/payouts/{payout_id}/report_spending (partial report)"
        actor: ProgramManager
        preconditions: ["payout_status == DISBURSED", "spent_amount_cents > current value and < allocated_amount_cents"]
        side_effects: ["unspent_amount_cents := allocated_amount_cents - spent_amount_cents"]
        note: "self-transition models the cumulative report without leaving DISBURSED"

  - entity: InvestmentManager
    field: engagement_status
    initial_state: PROSPECT
    terminal_states: [TERMINATED, DECLINED]
    transitions:
      - from: PROSPECT
        to: ENGAGED
        trigger: "POST /endowment/managers/{manager_id}/engage"
        actor: InvestmentOfficer
        preconditions:
          - "engagement_status == PROSPECT"
          - "pool.pool_status == ACTIVE"
          - "coverage interval [coverage_start_quarter, +inf) must not intersect the coverage interval of any other manager of the same (pool_id, asset_class) whose engagement_status is not in {PROSPECT, DECLINED}: engaged-family managers occupy [their start, +inf), TERMINATED managers occupy the closed historical interval [their start, their coverage_end_quarter]; intervals are INCLUSIVE at both ends, so this manager's start must be strictly greater than any terminated predecessor's end (adjacency end+1 is allowed) — historical quarters may never be double-covered"
        side_effects: []
      - from: PROSPECT
        to: DECLINED
        trigger: "POST /endowment/managers/{manager_id}/decline"
        actor: InvestmentOfficer
        preconditions: ["engagement_status == PROSPECT"]
        side_effects: []
      - from: ENGAGED
        to: WATCHLIST
        trigger: "system (manager report filed: neg_excess_streak reaches exactly 3)"
        actor: system
        preconditions: ["neg_excess_streak == 3 after the streak update"]
        side_effects: []
      - from: WATCHLIST
        to: PROBATION
        trigger: "system (manager report filed: neg_excess_streak reaches exactly 6)"
        actor: system
        preconditions: ["neg_excess_streak == 6 after the streak update"]
        side_effects: []
      - from: WATCHLIST
        to: ENGAGED
        trigger: "system (manager report filed: nonneg_excess_streak reaches exactly 2)"
        actor: system
        preconditions: ["nonneg_excess_streak == 2 after the streak update"]
        side_effects: []
      - from: PROBATION
        to: WATCHLIST
        trigger: "system (manager report filed: nonneg_excess_streak reaches exactly 2)"
        actor: system
        preconditions: ["nonneg_excess_streak == 2 after the streak update"]
        side_effects: []
        note: "WATCHLIST <-> PROBATION loop is unbounded; a manager oscillates as streaks flip"
      - from: [WATCHLIST, PROBATION]
        to: TERMINATED
        trigger: "POST /endowment/managers/{manager_id}/terminate"
        actor: BoardMember
        preconditions:
          - "engagement_status in {WATCHLIST, PROBATION} (an ENGAGED manager may not be terminated — ERR_INVALID_STATE_TRANSITION)"
        side_effects:
          - "coverage_end_quarter := pool.current_quarter_index"
          - "the manager owes reports for quarters coverage_start..coverage_end inclusive; a finalize covering those quarters requires them"

  - entity: AssetClassAllocation
    field: drift_status
    initial_state: IN_BAND
    terminal_states: []
    transitions:
      - from: IN_BAND
        to: BREACHED
        trigger: "system (valuation finalize: abs(actual_pct_bps - target_pct_bps) > rebalance_band_bps)"
        actor: system
        preconditions: ["strictly greater than the band; equality remains IN_BAND"]
        side_effects: ["drift_acknowledged := false"]
      - from: BREACHED
        to: IN_BAND
        trigger: "system (valuation finalize: abs(actual_pct_bps - target_pct_bps) <= rebalance_band_bps)"
        actor: system
        preconditions: []
        side_effects: ["drift_acknowledged := false"]

  - entity: AnnualReport
    field: report_status
    initial_state: DRAFT
    terminal_states: [PUBLISHED]
    transitions:
      - from: DRAFT
        to: UNDER_REVIEW
        trigger: "POST /endowment/reports/{report_id}/submit_review"
        actor: [DevelopmentOfficer, InvestmentOfficer]
        preconditions: ["report_status == DRAFT"]
        side_effects: []
      - from: UNDER_REVIEW
        to: DRAFT
        trigger: "POST /endowment/reports/{report_id}/return_for_revision"
        actor: BoardMember
        preconditions: ["report_status == UNDER_REVIEW"]
        side_effects: []
        note: "review loop DRAFT -> UNDER_REVIEW -> DRAFT may iterate"
      - from: UNDER_REVIEW
        to: PUBLISHED
        trigger: "POST /endowment/reports/{report_id}/publish"
        actor: BoardMember
        preconditions:
          - "report_status == UNDER_REVIEW"
          - "publisher X-User-ID != created_by_user_id (segregation of duties)"
          - "fiscal_year complete: 4 * (fiscal_year - pool.inception_fiscal_year + 1) <= pool.current_quarter_index (ERR_INCOMPLETE_FISCAL_YEAR)"
          - "every SpendingDistribution of the report's scope (the fund for DONOR_FUND; the whole pool otherwise) for fiscal_year is in a terminal state {DISTRIBUTED, CANCELLED} (ERR_INCOMPLETE_FISCAL_YEAR)"
          - "for BOARD_INVESTMENT only: every AssetClassAllocation of the pool has drift_status == IN_BAND or drift_acknowledged == true (ERR_DRIFT_NOT_ACKNOWLEDGED)"
        side_effects: ["published_by_user_id := X-User-ID"]

# =============================================================================
# §1.2.1 Concurrency Rules (true races only, resolved by OCC on parent version)
# =============================================================================
concurrency_rules:
  - rule_id: valuation-finalize-stale-pool
    parent_entity: EndowmentPool
    write_endpoint: "POST /endowment/valuations/{valuation_id}/finalize"
    occ_field: expected_pool_version
    description: |
      Finalizing a valuation against an EndowmentPool whose version has
      advanced since the client last read the pool is rejected. The
      finalizer assembled final_pool_market_value_cents and the manager
      report set against a particular pool configuration; an intervening
      pool mutation (e.g. suspend followed by resume, or another finalize)
      means that basis is stale even though every state precondition on
      the valuation itself still holds.
    error_id: ERR_STALE_POOL_VERSION
    http_status: 412
  - rule_id: policy-adopt-stale-pool
    parent_entity: EndowmentPool
    write_endpoint: "POST /endowment/policies/{policy_id}/adopt"
    occ_field: expected_pool_version
    description: |
      Adopting a spending-policy version against an EndowmentPool whose
      version has advanced since the client last read the pool is
      rejected. Adoption legitimately supersedes the pool's currently
      latest ADOPTED policy under the half-open window rule, so a client
      working from a stale view of which policy is current must not
      commit the supersede.
    error_id: ERR_STALE_POOL_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: unit_price_calculation
    trigger: "UnitValuation creation (preliminary) and finalize (final)"
    algorithm: aggregation
    formula: |
      preliminary_unit_price_millicents (at create):
        if pool.total_units_outstanding_micro == 0: INCEPTION_UNIT_PRICE_MILLICENTS (100000)
        else: round_half_up(estimated_pool_market_value_cents * 1000000000 / pool.total_units_outstanding_micro)
      final_unit_price_millicents (at finalize):
        units_pre = pool.total_units_outstanding_micro BEFORE any gift unitization or redemption of this close
        if units_pre == 0: INCEPTION_UNIT_PRICE_MILLICENTS
        else: max(1, round_half_up(final_pool_market_value_cents * 1000000000 / units_pre))   # price floor: 1 millicent
      preliminary uses the same floor: max(1, round_half_up(estimate * 1e9 / units)) when units > 0
    input_set: "the valuation's pool; units measured before the quarter's flows"
    constants: { INCEPTION_UNIT_PRICE_MILLICENTS: 100000 }
    precision: "integer millicents, round_half_up"
    variants:
      - name: preliminary_estimate
        when: "valuation created (PRELIMINARY)"
        difference: "uses the unaudited estimated_pool_market_value_cents; drives GiftContribution.provisional_units_estimate_micro for gifts received during the open quarter"
      - name: final_audited
        when: "valuation finalized (FINAL)"
        difference: "uses audited final_pool_market_value_cents; drives actual unitization; the two prices differ whenever the estimate was off, so the same gift buys different units under each variant"

  - name: gift_unitization
    trigger: "valuation finalize, for every GiftContribution with gift_status == RECEIVED and received_quarter_index == finalized quarter"
    algorithm: chronological
    formula: |
      For each eligible gift, processed in created_at ASC order (tie-break: external_ref ASC — never id):
        units_purchased_micro = round_half_up(amount_cents * 1000000000 / final_unit_price_millicents)
      Timing rule: the gift catches the price of the quarter it was RECEIVED in; a gift received one request after that quarter's finalize catches the NEXT quarter's price instead.
    input_set: "gifts RECEIVED with received_quarter_index == finalized quarter_index"
    precision: "integer micro-units, round_half_up per gift (never aggregate-then-round)"

  - name: manager_return_calculation
    trigger: "POST /endowment/manager-quarter-reports (at filing)"
    algorithm: weighted_scoring
    formula: |
      sumF = sum of flows[i].amount_cents
      dietz_denominator = beginning_mv_cents * 90 + sum over flows of (90 - day_offset_i) * amount_i
      return_bps (Modified Dietz, official):
        if dietz_denominator == 0: 0
        else: round_half_up(10000 * (ending_mv_cents - beginning_mv_cents - sumF) * 90 / dietz_denominator)
      simple_return_bps (flow-blind comparator):
        if beginning_mv_cents == 0: 0
        else: round_half_up(10000 * (ending_mv_cents - beginning_mv_cents - sumF) / beginning_mv_cents)
      excess_bps = return_bps - benchmark_return_bps
    input_set: "the filed ManagerQuarterReport only"
    constants: { QUARTER_DAYS: 90 }
    precision: "integer bps, round_half_up; Dietz evaluated in exact integer arithmetic (multiply before divide)"
    variants:
      - name: modified_dietz
        when: "always (official return, drives streaks)"
        difference: "weights each flow by the fraction of the 90-day quarter it was invested; a mid-quarter inflow halves its weight"
      - name: simple_flow_blind
        when: "stored alongside for audit comparison"
        difference: "divides by beginning market value only, ignoring flow timing; identical inputs yield a different bps whenever flows is non-empty"

  - name: excess_streak_tracking
    trigger: "POST /endowment/manager-quarter-reports (at filing), after manager_return_calculation"
    algorithm: threshold
    formula: |
      if excess_bps < 0:  neg_excess_streak += 1; nonneg_excess_streak := 0
      else (excess_bps >= 0 — zero counts as NON-negative and resets the negative streak): nonneg_excess_streak += 1; neg_excess_streak := 0
      Auto-transitions (evaluated immediately after the streak update):
        ENGAGED   and neg_excess_streak == 3    -> WATCHLIST
        WATCHLIST and neg_excess_streak == 6    -> PROBATION
        WATCHLIST and nonneg_excess_streak == 2 -> ENGAGED
        PROBATION and nonneg_excess_streak == 2 -> WATCHLIST
    input_set: "the manager's reports in chronological quarter order"
    precision: "integer streak counts; thresholds are exact equality checks evaluated post-increment"

  - name: smoothed_spending_base
    trigger: "SpendingDistribution create / propose / repropose / approve (each recomputation)"
    algorithm: aggregation
    formula: |
      window = policy.smoothing_window_quarters trailing FINALIZED quarters, newest first, ending at pool.current_quarter_index
      For each quarter q in the window where the fund held units at end of q (units_at_end(q) derived by replaying UnitLedgerEntry rows with quarter_index <= q — a projection over the ledger):
        fund_mv(q) = round_half_up(units_at_end(q) * final_unit_price_millicents(q) / 1000000000)   # per-quarter rounding FIRST
      If no quarter in the window has the fund holding units: smoothed_base_cents = fund.market_value_cents (current)
      Else: smoothed_base_cents = round_half_up(sum of fund_mv(q) over eligible quarters / count of eligible quarters)   # average SECOND
      Rounding order is pinned: per-quarter round, then average, then round. Averaging unrounded products first is a different (rejected) order.
    input_set: "finalized quarters only (valuations with valuation_status == FINAL); quarters before the fund's first unitization are excluded from the denominator"
    precision: "integer cents, round_half_up, per-quarter values rounded before averaging"

  - name: spending_distribution_amount
    trigger: "SpendingDistribution create / propose / repropose / approve"
    algorithm: threshold
    formula: |
      raw_amount_cents = round_half_up(smoothed_base_cents * policy.spending_rate_bps / 10000)
      prior = final_amount_cents of the fund's DISTRIBUTED distribution for fiscal_year - 1 (null if none)
      if prior is null: band_adjusted = raw_amount_cents
      else:
        cap   = round_half_up(prior * (10000 + policy.band_cap_bps)   / 10000)
        floor = round_half_up(prior * (10000 - policy.band_floor_bps) / 10000)
        band_adjusted = max(floor, min(raw_amount_cents, cap))        # nested clamp; cap evaluated then floor
      exemption = (fund.endowment_class == QUASI_ENDOWMENT) or (fund.endowment_class == TERM_ENDOWMENT and pool.current_quarter_index >= fund.term_end_quarter_index)
      if fund.is_underwater and not exemption:
        exc = the APPROVED PolicyException for (fund, fiscal_year), if any
        final_amount_cents = if exc exists: min(exc.approved_amount_cents, band_adjusted) else: 0
      else: final_amount_cents = band_adjusted
      Inputs interact non-linearly: rate x smoothed average feeds a nested min/max clamp keyed on prior year, then a conditional underwater branch keyed on entity state can zero or exception-cap the result.
    input_set: "applicable policy (max effective_from_fiscal_year <= fiscal_year among ADOPTED or SUPERSEDED; ERR_NO_APPLICABLE_POLICY if none), fund ledger history, prior-year DISTRIBUTED distribution, APPROVED exceptions"
    precision: "integer cents, round_half_up at each pinned rounding point in the order written"

  - name: distribution_redemption_units
    trigger: "POST /endowment/distributions/{id}/distribute and POST /endowment/funds/{id}/redeem_corpus"
    algorithm: threshold
    formula: |
      units_redeemed_micro = round_half_up(amount_cents * 1000000000 / pool.current_unit_price_millicents)
      require units_redeemed_micro <= fund.units_held_micro else ERR_INSUFFICIENT_UNITS
      cash settled == amount_cents exactly (the redemption is dollar-denominated; per-unit rounding dust stays in the fund's remaining units)
    input_set: "the fund, the amount, the latest FINAL unit price"
    precision: "integer micro-units, round_half_up"

  - name: underwater_flag
    trigger: "valuation finalize (after unitization step) and redeem_corpus / distribute (after redemption)"
    algorithm: threshold
    formula: |
      fund.market_value_cents = round_half_up(fund.units_held_micro * pool.current_unit_price_millicents / 1000000000)
      fund.is_underwater = (market_value_cents < historic_gift_value_cents)    # strictly less; equality is NOT underwater
      exempt = endowment_class == QUASI_ENDOWMENT or (endowment_class == TERM_ENDOWMENT and finalized quarter_index >= term_end_quarter_index)
      posture effects apply only when is_underwater and not exempt
    input_set: "the fund and the pool's current FINAL price"
    precision: "integer cents comparison; boundary at exact equality"

  - name: allocation_drift
    trigger: "valuation finalize (after price step), per AssetClassAllocation of the pool"
    algorithm: threshold
    formula: |
      class_mv(c) = sum of ending_mv_cents over this quarter's ManagerQuarterReport rows whose manager.asset_class == c
      total_mv = final_pool_market_value_cents
      actual_pct_bps(c) = if total_mv == 0: 0 else round_half_up(class_mv(c) * 10000 / total_mv)
      breach iff abs(actual_pct_bps - target_pct_bps) > rebalance_band_bps     # strictly greater; equality stays IN_BAND
      breach -> drift_status BREACHED and drift_acknowledged := false; recovery -> IN_BAND
    input_set: "this quarter's manager reports grouped by asset_class"
    precision: "integer bps, round_half_up"

  - name: unspent_sweep
    trigger: "valuation finalize, before the unitization step, per ProgramPayout"
    algorithm: threshold
    formula: |
      eligible iff payout_status == DISBURSED and (finalized quarter_index - disbursed_quarter_index) >= LAPSE_QUARTERS (4)   # age exactly 4 sweeps
      unspent = allocated_amount_cents - spent_amount_cents
      payout -> CLOSED_RETURNED; a GiftContribution (EXPENDABLE, RECEIVED in the finalized quarter, source_payout_id set) is created with amount_cents = unspent and unitizes at the new price in the same close
      Conservation: allocated_amount_cents == spent_amount_cents + swept unspent, exactly, per payout.
    input_set: "payouts DISBURSED with disbursement quarter at least LAPSE_QUARTERS older than the finalized quarter"
    constants: { LAPSE_QUARTERS: 4 }
    precision: "integer cents; sweep value equals unspent exactly (unit rounding happens downstream in gift_unitization)"

  - name: quarter_close_pipeline
    trigger: "POST /endowment/valuations/{id}/finalize"
    algorithm: chronological
    formula: |
      Pinned evaluation order (each step observes the output of the previous steps only):
        1. price: final_unit_price_millicents from final_pool_market_value_cents and PRE-FLOW total units
        2. lapse sweep: unspent_sweep marks payouts CLOSED_RETURNED and creates reinvestment gifts (RECEIVED in this quarter)
        3. unitization: gift_unitization over all gifts RECEIVED with received_quarter_index == this quarter (donor gifts AND the sweep reinvestments created in step 2), created_at ASC, external_ref ASC tie-break
        4. HGV refresh: historic_gift_value_cents += amount for CORPUS gifts unitized in step 3
        5. MV refresh + underwater: underwater_flag per fund using post-unitization units and the new price
        6. posture: fund spending_posture auto-transitions (NORMAL<->SPENDING_SUSPENDED) from step 5 results
        7. exception expiry: APPROVED exceptions whose fiscal year's last quarter == this quarter -> EXPIRED with the distribution/posture cascade
        8. allocation drift: allocation_drift per allocation row
        9. epoch advance: pool.current_quarter_index := finalized quarter; pool price/MV fields stored; pool.version incremented
      The circular-looking dependency — step 2's reinvestment units depend on the price from step 1, while the price must not include step 3's new units — is resolved by the pinned order: price uses pre-flow units only, and reinvestments/gifts unitize at that already-fixed price. Recomputing price after step 3 is forbidden.
    input_set: "the PRELIMINARY valuation, this quarter's manager reports, pending gifts, DISBURSED payouts, APPROVED exceptions, allocation rows"
    precision: "each step uses its own pinned precision; no step recomputes an earlier step"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority — lower number wins when
# several checks fail on the same request)
# =============================================================================
validations:
  - { priority: 1, category: auth, check: "X-User-ID and X-User-Role headers present and non-empty", error_id: ERR_MISSING_OR_INVALID_CONTEXT_HEADER, http_status: 400, applies_to: "all" }
  - { priority: 2, category: auth, check: "X-User-Role is listed in the endpoint's roles", error_id: ERR_FORBIDDEN_ROLE, http_status: 403, applies_to: "all" }
  - { priority: 3, category: auth, check: "Segregation of duties: policy adopt requires adopter != proposed_by_user_id; exception endorse requires endorser != requested_by_user_id; exception approve requires approver != requested_by and != endorsed_by; distribution approve requires approver != proposed_by_user_id; report publish requires publisher != created_by_user_id", error_id: ERR_SEGREGATION_OF_DUTIES_VIOLATION, http_status: 403, applies_to: "POST /endowment/policies/{id}/adopt, POST /endowment/exceptions/{id}/endorse, POST /endowment/exceptions/{id}/approve, POST /endowment/distributions/{id}/approve, POST /endowment/reports/{id}/publish" }
  - { priority: 4, category: business_constraint, check: "Request body shape: required fields present, enums valid, integer ranges respected (amount_cents > 0, bps fields within bounds, day_offset 0..89, flow amount != 0, fund_code non-empty, TERM_ENDOWMENT requires term_end_quarter_index and other classes forbid it, DONOR_FUND report requires fund_id and other types forbid it)", error_id: ERR_INVALID_REQUEST, http_status: 400, applies_to: "all mutating endpoints" }
  - { priority: 5, category: existence, check: "Path and body resource ids exist, validated left-to-right (pool, then fund/donor/valuation/policy/distribution/exception/payout/manager/allocation/report/ledger-entry)", error_id: ERR_NOT_FOUND, http_status: 404, applies_to: "all" }
  - { priority: 6, category: state, check: "Target resource lifecycle permits the trigger (per §1.2 from-states; e.g. approve requires PROPOSED, receive requires PLEDGED, finalize requires PRELIMINARY, terminal states reject everything)", error_id: ERR_INVALID_STATE_TRANSITION, http_status: 409, applies_to: "all state-transition endpoints" }
  - { priority: 7, category: state, check: "Pool posture gate: pool.pool_status == SUSPENDED blocks value-moving child operations; TERMINATED blocks all mutations", error_id: ERR_POOL_SUSPENDED, http_status: 409, applies_to: "gift receive, valuation create/finalize/supersede, distribution create/propose/repropose/approve/distribute, payout create/disburse, manager engage, manager-quarter-report create, allocations bulk_upsert, policy create/adopt, fund activate/redeem_corpus" }
  - { priority: 8, category: state, check: "OCC: expected_pool_version in the request equals the pool's current version", error_id: ERR_STALE_POOL_VERSION, http_status: 412, applies_to: "POST /endowment/valuations/{id}/finalize, POST /endowment/valuations/{id}/supersede, POST /endowment/policies/{id}/adopt" }
  - { priority: 9, category: business_safety, check: "Donor-restriction compliance: payout program_purpose must equal fund.purpose_restriction unless UNRESTRICTED; corpus redemption only for QUASI or matured TERM funds", error_id: ERR_PURPOSE_MISMATCH, http_status: 422, applies_to: "POST /endowment/payouts" }
  - { priority: 10, category: business_safety, check: "Underwater spending lock: approving a distribution for an underwater, non-exempt fund requires an APPROVED PolicyException for (fund, fiscal_year); exception request/approve requires the fund to actually be underwater", error_id: ERR_UNDERWATER_SPENDING_BLOCKED, http_status: 422, applies_to: "POST /endowment/distributions/{id}/approve" }
  - { priority: 11, category: business_safety, check: "Exception create/approve on a fund that is not underwater is rejected", error_id: ERR_FUND_NOT_UNDERWATER, http_status: 422, applies_to: "POST /endowment/exceptions, POST /endowment/exceptions/{id}/approve" }
  - { priority: 12, category: business_safety, check: "Corpus inviolability: redeem_corpus on TRUE_ENDOWMENT or unmatured TERM_ENDOWMENT", error_id: ERR_CORPUS_INVIOLABLE, http_status: 422, applies_to: "POST /endowment/funds/{id}/redeem_corpus" }
  - { priority: 13, category: business_constraint, check: "Uniqueness: (fund_id, external_ref) among non-CANCELLED gifts; (pool_id, fund_code); (pool_id, asset_class) allocations; (manager_id, quarter_index) reports; (fund_id, fiscal_year) among non-CANCELLED distributions; (fund_id, fiscal_year) among non-terminal exceptions; (pool_id, fund_id, fiscal_year, report_type) among reports", error_id: ERR_DUPLICATE_RECORD, http_status: 409, applies_to: "create endpoints" }
  - { priority: 14, category: business_constraint, check: "Temporal windows: policy adoption requires effective_from_fiscal_year strictly greater than every ADOPTED sibling; manager engage requires non-intersecting inclusive coverage intervals per (pool, asset_class); report quarter must equal the pool's open quarter and be >= coverage_start_quarter; distribution/report fiscal_year within allowed range", error_id: ERR_WINDOW_CONFLICT, http_status: 409, applies_to: "policy adopt, manager engage, manager-quarter-report create, distribution create, report create" }
  - { priority: 15, category: business_constraint, check: "Valuation sequencing: create only for the open quarter; supersede only the latest FINAL with no downstream consumption", error_id: ERR_VALUATION_OUT_OF_ORDER, http_status: 409, applies_to: "POST /endowment/valuations, POST /endowment/valuations/{id}/supersede" }
  - { priority: 16, category: business_constraint, check: "Valuation consumption lock: supersede rejected when any gift unitized at that quarter, any payout swept in it, or any later distribution executed", error_id: ERR_VALUATION_LOCKED, http_status: 409, applies_to: "POST /endowment/valuations/{id}/supersede" }
  - { priority: 17, category: business_constraint, check: "Report completeness gates: at create the fiscal year must be complete (4 * (fiscal_year - inception + 1) <= current_quarter_index); at publish, additionally, every distribution in the report's scope for that fiscal year must be terminal (DISTRIBUTED or CANCELLED)", error_id: ERR_INCOMPLETE_FISCAL_YEAR, http_status: 422, applies_to: "POST /endowment/reports, POST /endowment/reports/{id}/publish" }
  - { priority: 18, category: business_constraint, check: "Drift acknowledgement gate for BOARD_INVESTMENT publish", error_id: ERR_DRIFT_NOT_ACKNOWLEDGED, http_status: 422, applies_to: "POST /endowment/reports/{id}/publish" }
  - { priority: 19, category: business_fiscal, check: "Fund activation minimum: pledged_corpus_cents >= 5000000", error_id: ERR_MINIMUM_FUNDING_NOT_MET, http_status: 422, applies_to: "POST /endowment/funds/{id}/activate" }
  - { priority: 20, category: business_fiscal, check: "Policy numeric ranges: spending_rate_bps in 100..2000, smoothing_window_quarters in 4..20, band bps in 0..10000", error_id: ERR_POLICY_PARAM_OUT_OF_RANGE, http_status: 422, applies_to: "POST /endowment/policies" }
  - { priority: 21, category: business_fiscal, check: "Allocation targets of the pool must sum to exactly 10000 (at bulk_upsert and at finalize)", error_id: ERR_ALLOCATION_SUM_INVALID, http_status: 422, applies_to: "POST /endowment/allocations/bulk_upsert, POST /endowment/valuations/{id}/finalize" }
  - { priority: 22, category: business_fiscal, check: "Finalize reconciliation: every coverage-eligible manager filed a report for the quarter", error_id: ERR_MANAGER_REPORT_MISSING, http_status: 422, applies_to: "POST /endowment/valuations/{id}/finalize" }
  - { priority: 23, category: business_fiscal, check: "Finalize reconciliation: final_pool_market_value_cents equals the sum of that quarter's ending_mv_cents across eligible manager reports", error_id: ERR_POOL_MV_MISMATCH, http_status: 422, applies_to: "POST /endowment/valuations/{id}/finalize" }
  - { priority: 24, category: business_fiscal, check: "Manager report continuity: beginning_mv_cents equals the manager's prior-quarter ending_mv_cents when a prior report exists", error_id: ERR_MV_CONTINUITY_BREAK, http_status: 422, applies_to: "POST /endowment/manager-quarter-reports" }
  - { priority: 25, category: business_fiscal, check: "Exception approved_amount_cents <= requested_amount_cents at approve", error_id: ERR_EXCEPTION_AMOUNT_EXCEEDS_REQUESTED, http_status: 422, applies_to: "POST /endowment/exceptions/{id}/approve" }
  - { priority: 26, category: business_fiscal, check: "Payout aggregate cap: sum of allocated_amount_cents over the distribution's payouts plus the new amount must be <= distribution.distributed_amount_cents", error_id: ERR_ALLOCATION_EXCEEDS_DISTRIBUTION, http_status: 422, applies_to: "POST /endowment/payouts" }
  - { priority: 27, category: business_fiscal, check: "Spending report monotonicity and cap: new spent_amount_cents >= current and <= allocated_amount_cents", error_id: ERR_INVALID_SPENT_AMOUNT, http_status: 422, applies_to: "POST /endowment/payouts/{id}/report_spending" }
  - { priority: 28, category: business_fiscal, check: "Redemption coverage: round_half_up(amount * 1e9 / current price) <= fund.units_held_micro for distribute and redeem_corpus", error_id: ERR_INSUFFICIENT_UNITS, http_status: 422, applies_to: "POST /endowment/distributions/{id}/distribute, POST /endowment/funds/{id}/redeem_corpus" }
  - { priority: 29, category: business_fiscal, check: "Policy lookup: an applicable policy exists for the requested fiscal_year", error_id: ERR_NO_APPLICABLE_POLICY, http_status: 422, applies_to: "POST /endowment/distributions, POST /endowment/distributions/{id}/propose, POST /endowment/distributions/{id}/repropose, POST /endowment/distributions/{id}/approve" }
  - { priority: 30, category: business_fiscal, check: "Fund termination eligibility: zero units, no pending gifts, no non-terminal distributions, no open payouts; pool termination requires every fund TERMINATED", error_id: ERR_NOT_TERMINABLE, http_status: 422, applies_to: "POST /endowment/funds/{id}/terminate, POST /endowment/pools/{id}/terminate" }

# =============================================================================
# §1.5 API Endpoint Table (flat topology under /endowment; FK links in bodies;
# every FK has a filtered-list reverse-reachability GET)
# =============================================================================
endpoints:
  # --- EndowmentPool ---
  - { method: POST, path: "/endowment/pools", description: "Create an endowment pool (status ACTIVE, quarter 0, inception unit price)", roles: [EndowmentAdmin], code: 201, input: [pool_name, inception_fiscal_year], output: EndowmentPool, side_effects: ["pool_status=ACTIVE, current_quarter_index=0, current_unit_price_millicents=100000"] }
  - { method: GET, path: "/endowment/pools", description: "List pools with pagination", roles: [EndowmentAdmin, InvestmentOfficer, DevelopmentOfficer, BoardMember, ProgramManager], code: 200, input: ["limit?", "offset?", "pool_status?"], output: "EndowmentPool[]", side_effects: [] }
  - { method: GET, path: "/endowment/pools/{pool_id}", description: "Read one pool (version field feeds OCC)", roles: [EndowmentAdmin, InvestmentOfficer, DevelopmentOfficer, BoardMember, ProgramManager], code: 200, input: [], output: EndowmentPool, side_effects: [] }
  - { method: POST, path: "/endowment/pools/{pool_id}/suspend", description: "ACTIVE -> SUSPENDED; blocks value-moving child operations", roles: [EndowmentAdmin], code: 200, input: [], output: EndowmentPool, side_effects: ["pool_status=SUSPENDED", "increments EndowmentPool.version by 1"] }
  - { method: POST, path: "/endowment/pools/{pool_id}/resume", description: "SUSPENDED -> ACTIVE", roles: [EndowmentAdmin], code: 200, input: [], output: EndowmentPool, side_effects: ["pool_status=ACTIVE", "increments EndowmentPool.version by 1"] }
  - { method: POST, path: "/endowment/pools/{pool_id}/terminate", description: "Pool termination; requires every fund TERMINATED", roles: [BoardMember], code: 200, input: [], output: EndowmentPool, side_effects: ["pool_status=TERMINATED", "increments EndowmentPool.version by 1"] }

  # --- SpendingPolicyVersion ---
  - { method: POST, path: "/endowment/policies", description: "Propose a spending policy version (DRAFT)", roles: [InvestmentOfficer], code: 201, input: [pool_id, spending_rate_bps, smoothing_window_quarters, band_floor_bps, band_cap_bps, effective_from_fiscal_year], output: SpendingPolicyVersion, side_effects: ["proposed_by_user_id := X-User-ID"] }
  - { method: GET, path: "/endowment/policies", description: "List policies (reverse-reachability for pool_id FK)", roles: [EndowmentAdmin, InvestmentOfficer, DevelopmentOfficer, BoardMember, ProgramManager], code: 200, input: ["limit?", "offset?", "pool_id?", "policy_status?"], output: "SpendingPolicyVersion[]", side_effects: [] }
  - { method: GET, path: "/endowment/policies/{policy_id}", description: "Read one policy", roles: [EndowmentAdmin, InvestmentOfficer, DevelopmentOfficer, BoardMember, ProgramManager], code: 200, input: [], output: SpendingPolicyVersion, side_effects: [] }
  - { method: POST, path: "/endowment/policies/{policy_id}/adopt", description: "Board adopts a DRAFT policy; supersedes the pool's previously latest ADOPTED policy; OCC on pool version", roles: [BoardMember], code: 200, input: [expected_pool_version], output: SpendingPolicyVersion, side_effects: ["prior latest ADOPTED policy -> SUPERSEDED", "policy_status=ADOPTED, adopted_by_user_id set", "increments EndowmentPool.version by 1"] }
  - { method: POST, path: "/endowment/policies/{policy_id}/withdraw", description: "Withdraw a DRAFT policy", roles: [InvestmentOfficer], code: 200, input: [], output: SpendingPolicyVersion, side_effects: ["policy_status=WITHDRAWN"] }

  # --- UnitValuation ---
  - { method: POST, path: "/endowment/valuations", description: "Open a PRELIMINARY valuation for the pool's open quarter (current_quarter_index + 1); computes preliminary price", roles: [InvestmentOfficer], code: 201, input: [pool_id, estimated_pool_market_value_cents], output: UnitValuation, side_effects: ["quarter_index := pool.current_quarter_index + 1", "preliminary_unit_price_millicents computed"] }
  - { method: GET, path: "/endowment/valuations", description: "List valuations (reverse-reachability for pool_id and supersedes_valuation_id FKs)", roles: [EndowmentAdmin, InvestmentOfficer, DevelopmentOfficer, BoardMember, ProgramManager], code: 200, input: ["limit?", "offset?", "pool_id?", "valuation_status?", "supersedes_valuation_id?"], output: "UnitValuation[]", side_effects: [] }
  - { method: GET, path: "/endowment/valuations/{valuation_id}", description: "Read one valuation", roles: [EndowmentAdmin, InvestmentOfficer, DevelopmentOfficer, BoardMember, ProgramManager], code: 200, input: [], output: UnitValuation, side_effects: [] }
  - { method: POST, path: "/endowment/valuations/{valuation_id}/finalize", description: "Finalize the open quarter; runs quarter_close_pipeline; OCC on pool version", roles: [InvestmentOfficer], code: 200, input: [final_pool_market_value_cents, expected_pool_version], output: UnitValuation, side_effects: ["valuation_status=FINAL, final_unit_price_millicents computed", "runs quarter_close_pipeline (sweep, unitization, HGV/MV refresh, posture, exception expiry, drift)", "pool.current_quarter_index := quarter_index", "increments EndowmentPool.version by 1"] }
  - { method: POST, path: "/endowment/valuations/{valuation_id}/supersede", description: "Restate the latest FINAL quarter when nothing consumed it; rolls the pool back and spawns a corrective PRELIMINARY", roles: [InvestmentOfficer], code: 201, input: [revised_pool_market_value_cents, expected_pool_version], output: UnitValuation, side_effects: ["old valuation -> SUPERSEDED", "pool state rolls back to end of quarter_index - 1", "creates corrective PRELIMINARY with supersedes_valuation_id", "increments EndowmentPool.version by 1"] }

  # --- Donor ---
  - { method: POST, path: "/endowment/donors", description: "Register a donor", roles: [DevelopmentOfficer], code: 201, input: [donor_name, donor_type, "contact_email?"], output: Donor, side_effects: [] }
  - { method: GET, path: "/endowment/donors", description: "List donors", roles: [EndowmentAdmin, InvestmentOfficer, DevelopmentOfficer, BoardMember, ProgramManager], code: 200, input: ["limit?", "offset?", "donor_type?"], output: "Donor[]", side_effects: [] }
  - { method: GET, path: "/endowment/donors/{donor_id}", description: "Read one donor", roles: [EndowmentAdmin, InvestmentOfficer, DevelopmentOfficer, BoardMember, ProgramManager], code: 200, input: [], output: Donor, side_effects: [] }

  # --- Fund ---
  - { method: POST, path: "/endowment/funds", description: "Establish a fund with its donor restriction record (DRAFT until activated)", roles: [DevelopmentOfficer], code: 201, input: [pool_id, fund_code, fund_name, endowment_class, "term_end_quarter_index?", purpose_restriction], output: Fund, side_effects: ["fund_status=DRAFT, spending_posture=NORMAL"] }
  - { method: GET, path: "/endowment/funds", description: "List funds (reverse-reachability for pool_id FK)", roles: [EndowmentAdmin, InvestmentOfficer, DevelopmentOfficer, BoardMember, ProgramManager], code: 200, input: ["limit?", "offset?", "pool_id?", "fund_status?", "spending_posture?"], output: "Fund[]", side_effects: [] }
  - { method: GET, path: "/endowment/funds/{fund_id}", description: "Read one fund", roles: [EndowmentAdmin, InvestmentOfficer, DevelopmentOfficer, BoardMember, ProgramManager], code: 200, input: [], output: Fund, side_effects: [] }
  - { method: POST, path: "/endowment/funds/{fund_id}/activate", description: "DRAFT -> ACTIVE once pledged corpus meets the $50,000 minimum", roles: [DevelopmentOfficer], code: 200, input: [], output: Fund, side_effects: ["fund_status=ACTIVE, activated_quarter_index := open quarter"] }
  - { method: POST, path: "/endowment/funds/{fund_id}/terminate", description: "ACTIVE -> TERMINATED when fully redeemed and clear of open items", roles: [BoardMember], code: 200, input: [], output: Fund, side_effects: ["fund_status=TERMINATED, spending_posture=NORMAL"] }
  - { method: POST, path: "/endowment/funds/{fund_id}/redeem_corpus", description: "Redeem corpus units for cash (QUASI or matured TERM only); reduces HGV", roles: [BoardMember], code: 200, input: [amount_cents], output: Fund, side_effects: ["burns units per distribution_redemption_units", "historic_gift_value_cents -= amount_cents (floor 0)", "market_value_cents and is_underwater refreshed", "emits UnitLedgerEntry CORPUS_REDEEM", "pool.total_units_outstanding_micro decreases"] }

  # --- GiftContribution ---
  - { method: POST, path: "/endowment/gifts", description: "Record a gift or pledge (PLEDGED); CORPUS gifts immediately count toward pledged_corpus_cents", roles: [DevelopmentOfficer], code: 201, input: [fund_id, donor_id, external_ref, gift_type, amount_cents], output: GiftContribution, side_effects: ["gift_status=PLEDGED", "if gift_type == CORPUS: fund.pledged_corpus_cents += amount_cents"] }
  - { method: GET, path: "/endowment/gifts", description: "List gifts (reverse-reachability for fund_id, donor_id, source_payout_id FKs)", roles: [EndowmentAdmin, InvestmentOfficer, DevelopmentOfficer, BoardMember, ProgramManager], code: 200, input: ["limit?", "offset?", "fund_id?", "donor_id?", "source_payout_id?", "gift_status?", "gift_type?"], output: "GiftContribution[]", side_effects: [] }
  - { method: GET, path: "/endowment/gifts/{gift_id}", description: "Read one gift", roles: [EndowmentAdmin, InvestmentOfficer, DevelopmentOfficer, BoardMember, ProgramManager], code: 200, input: [], output: GiftContribution, side_effects: [] }
  - { method: POST, path: "/endowment/gifts/{gift_id}/receive", description: "PLEDGED -> RECEIVED; stamps the open quarter and the provisional unit estimate", roles: [DevelopmentOfficer], code: 200, input: [], output: GiftContribution, side_effects: ["received_quarter_index := open quarter", "provisional_units_estimate_micro computed at latest FINAL price", "CORPUS gifts increment pledged_corpus_cents and donor.total_contributed_cents"] }
  - { method: POST, path: "/endowment/gifts/{gift_id}/cancel", description: "PLEDGED -> CANCELLED; CORPUS pledges decrement pledged_corpus_cents", roles: [DevelopmentOfficer], code: 200, input: [], output: GiftContribution, side_effects: ["if gift_type == CORPUS: fund.pledged_corpus_cents -= amount_cents"] }
  - { method: POST, path: "/endowment/gifts/{gift_id}/rescind", description: "RECEIVED -> RETURNED; compensates pledged corpus and donor totals", roles: [DevelopmentOfficer], code: 200, input: [], output: GiftContribution, side_effects: ["pledged_corpus_cents and donor.total_contributed_cents decremented for CORPUS gifts"] }

  # --- SpendingDistribution ---
  - { method: POST, path: "/endowment/distributions", description: "Project a fund's spending distribution for a fiscal year (PROJECTED; full computation against latest FINAL data); fund must be ACTIVE", roles: [DevelopmentOfficer], code: 201, input: [fund_id, fiscal_year], output: SpendingDistribution, side_effects: ["runs smoothed_spending_base and spending_distribution_amount"] }
  - { method: GET, path: "/endowment/distributions", description: "List distributions (reverse-reachability for fund_id, policy_id, applied_exception_id FKs)", roles: [EndowmentAdmin, InvestmentOfficer, DevelopmentOfficer, BoardMember, ProgramManager], code: 200, input: ["limit?", "offset?", "fund_id?", "policy_id?", "applied_exception_id?", "fiscal_year?", "distribution_status?"], output: "SpendingDistribution[]", side_effects: [] }
  - { method: GET, path: "/endowment/distributions/{distribution_id}", description: "Read one distribution", roles: [EndowmentAdmin, InvestmentOfficer, DevelopmentOfficer, BoardMember, ProgramManager], code: 200, input: [], output: SpendingDistribution, side_effects: [] }
  - { method: POST, path: "/endowment/distributions/{distribution_id}/propose", description: "PROJECTED -> PROPOSED with recomputation", roles: [DevelopmentOfficer], code: 200, input: [], output: SpendingDistribution, side_effects: ["recomputes all derived amounts", "proposed_by_user_id set"] }
  - { method: POST, path: "/endowment/distributions/{distribution_id}/request_revision", description: "PROPOSED -> REVISION_REQUESTED (board review loop)", roles: [BoardMember], code: 200, input: [], output: SpendingDistribution, side_effects: [] }
  - { method: POST, path: "/endowment/distributions/{distribution_id}/repropose", description: "REVISION_REQUESTED -> PROPOSED with recomputation (review loop)", roles: [DevelopmentOfficer], code: 200, input: [], output: SpendingDistribution, side_effects: ["recomputes all derived amounts", "proposed_by_user_id refreshed"] }
  - { method: POST, path: "/endowment/distributions/{distribution_id}/approve", description: "PROPOSED -> APPROVED; underwater funds need an APPROVED exception; segregation of duties vs proposer", roles: [BoardMember], code: 200, input: [], output: SpendingDistribution, side_effects: ["final_amount_cents recomputed with underwater/exception logic", "applied_exception_id set when used", "approved_by_user_id set"] }
  - { method: POST, path: "/endowment/distributions/{distribution_id}/distribute", description: "APPROVED -> DISTRIBUTED; redeems units at the latest FINAL price", roles: [InvestmentOfficer], code: 200, input: [], output: SpendingDistribution, side_effects: ["units redeemed per distribution_redemption_units", "distributed_amount_cents := final_amount_cents", "emits UnitLedgerEntry DISTRIBUTION_REDEEM", "applied exception -> EXERCISED; fund posture EXCEPTION_ACTIVE -> SPENDING_SUSPENDED if still underwater"] }
  - { method: POST, path: "/endowment/distributions/{distribution_id}/cancel", description: "Cancel a non-terminal distribution (board may cancel APPROVED before any payout exists)", roles: [DevelopmentOfficer, BoardMember], code: 200, input: [], output: SpendingDistribution, side_effects: ["distribution_status=CANCELLED", "cancelling APPROVED with an applied exception rescinds that exception and reverts fund posture"] }

  # --- PolicyException ---
  - { method: POST, path: "/endowment/exceptions", description: "Request an underwater-spending exception for (fund, fiscal_year)", roles: [DevelopmentOfficer], code: 201, input: [fund_id, fiscal_year, requested_amount_cents, justification], output: PolicyException, side_effects: ["exception_status=REQUESTED", "requested_by_user_id set"] }
  - { method: GET, path: "/endowment/exceptions", description: "List exceptions (reverse-reachability for fund_id FK)", roles: [EndowmentAdmin, InvestmentOfficer, DevelopmentOfficer, BoardMember, ProgramManager], code: 200, input: ["limit?", "offset?", "fund_id?", "exception_status?", "fiscal_year?"], output: "PolicyException[]", side_effects: [] }
  - { method: GET, path: "/endowment/exceptions/{exception_id}", description: "Read one exception", roles: [EndowmentAdmin, InvestmentOfficer, DevelopmentOfficer, BoardMember, ProgramManager], code: 200, input: [], output: PolicyException, side_effects: [] }
  - { method: POST, path: "/endowment/exceptions/{exception_id}/endorse", description: "REQUESTED -> ENDORSED (investment office); endorser != requester", roles: [InvestmentOfficer], code: 200, input: [], output: PolicyException, side_effects: ["endorsed_by_user_id set"] }
  - { method: POST, path: "/endowment/exceptions/{exception_id}/approve", description: "ENDORSED -> APPROVED (board); three-person segregation; flips fund posture to EXCEPTION_ACTIVE", roles: [BoardMember], code: 200, input: [approved_amount_cents], output: PolicyException, side_effects: ["approved_amount_cents recorded", "approved_by_user_id set", "fund.spending_posture SPENDING_SUSPENDED -> EXCEPTION_ACTIVE"] }
  - { method: POST, path: "/endowment/exceptions/{exception_id}/reject", description: "REQUESTED or ENDORSED -> REJECTED", roles: [BoardMember], code: 200, input: [], output: PolicyException, side_effects: ["exception_status=REJECTED"] }
  - { method: POST, path: "/endowment/exceptions/{exception_id}/rescind", description: "APPROVED -> RESCINDED; cascades: dependent APPROVED distribution reverts to PROPOSED and fund posture reverts", roles: [BoardMember], code: 200, input: [], output: PolicyException, side_effects: ["linked APPROVED distribution -> PROPOSED with recomputed final_amount_cents", "fund.spending_posture EXCEPTION_ACTIVE -> SPENDING_SUSPENDED"] }

  # --- ProgramPayout ---
  - { method: POST, path: "/endowment/payouts", description: "Allocate part of a DISTRIBUTED distribution to a program (SCHEDULED)", roles: [DevelopmentOfficer], code: 201, input: [distribution_id, program_code, program_purpose, allocated_amount_cents], output: ProgramPayout, side_effects: ["payout_status=SCHEDULED", "unspent_amount_cents := allocated_amount_cents"] }
  - { method: GET, path: "/endowment/payouts", description: "List payouts (reverse-reachability for distribution_id and swept_gift_id FKs)", roles: [EndowmentAdmin, InvestmentOfficer, DevelopmentOfficer, BoardMember, ProgramManager], code: 200, input: ["limit?", "offset?", "distribution_id?", "swept_gift_id?", "payout_status?"], output: "ProgramPayout[]", side_effects: [] }
  - { method: GET, path: "/endowment/payouts/{payout_id}", description: "Read one payout", roles: [EndowmentAdmin, InvestmentOfficer, DevelopmentOfficer, BoardMember, ProgramManager], code: 200, input: [], output: ProgramPayout, side_effects: [] }
  - { method: POST, path: "/endowment/payouts/{payout_id}/disburse", description: "SCHEDULED -> DISBURSED; stamps the open quarter for lapse aging", roles: [DevelopmentOfficer], code: 200, input: [], output: ProgramPayout, side_effects: ["disbursed_quarter_index := pool.current_quarter_index + 1"] }
  - { method: POST, path: "/endowment/payouts/{payout_id}/report_spending", description: "Program reports cumulative spending; reaching the full allocation closes the payout", roles: [ProgramManager], code: 200, input: [spent_amount_cents], output: ProgramPayout, side_effects: ["spent_amount_cents updated", "unspent_amount_cents recomputed", "spent == allocated -> CLOSED_FULLY_SPENT"] }

  # --- AssetClassAllocation ---
  - { method: POST, path: "/endowment/allocations/bulk_upsert", description: "Atomically replace the pool's target allocation set; targets must sum to exactly 10000 bps", roles: [EndowmentAdmin], code: 200, input: [pool_id, items], output: "AssetClassAllocation[]", side_effects: ["items: array of {asset_class, target_pct_bps, rebalance_band_bps}; duplicate asset_class within items rejected", "existing rows not in items are deleted; matching rows updated"] }
  - { method: GET, path: "/endowment/allocations", description: "List allocations (reverse-reachability for pool_id FK)", roles: [EndowmentAdmin, InvestmentOfficer, DevelopmentOfficer, BoardMember, ProgramManager], code: 200, input: ["limit?", "offset?", "pool_id?", "asset_class?", "drift_status?"], output: "AssetClassAllocation[]", side_effects: [] }
  - { method: GET, path: "/endowment/allocations/{allocation_id}", description: "Read one allocation", roles: [EndowmentAdmin, InvestmentOfficer, DevelopmentOfficer, BoardMember, ProgramManager], code: 200, input: [], output: AssetClassAllocation, side_effects: [] }
  - { method: POST, path: "/endowment/allocations/{allocation_id}/acknowledge_drift", description: "Board acknowledges a BREACHED allocation (gates BOARD_INVESTMENT report publish)", roles: [BoardMember], code: 200, input: [], output: AssetClassAllocation, side_effects: ["drift_acknowledged=true (only valid while BREACHED)"] }

  # --- InvestmentManager ---
  - { method: POST, path: "/endowment/managers", description: "Register a manager (PROSPECT) with inclusive coverage from coverage_start_quarter", roles: [InvestmentOfficer], code: 201, input: [pool_id, manager_name, asset_class, benchmark_code, coverage_start_quarter], output: InvestmentManager, side_effects: ["engagement_status=PROSPECT"] }
  - { method: GET, path: "/endowment/managers", description: "List managers (reverse-reachability for pool_id FK)", roles: [EndowmentAdmin, InvestmentOfficer, DevelopmentOfficer, BoardMember, ProgramManager], code: 200, input: ["limit?", "offset?", "pool_id?", "asset_class?", "engagement_status?"], output: "InvestmentManager[]", side_effects: [] }
  - { method: GET, path: "/endowment/managers/{manager_id}", description: "Read one manager", roles: [EndowmentAdmin, InvestmentOfficer, DevelopmentOfficer, BoardMember, ProgramManager], code: 200, input: [], output: InvestmentManager, side_effects: [] }
  - { method: POST, path: "/endowment/managers/{manager_id}/engage", description: "PROSPECT -> ENGAGED; inclusive coverage interval must not intersect same-class engaged-family managers", roles: [InvestmentOfficer], code: 200, input: [], output: InvestmentManager, side_effects: ["engagement_status=ENGAGED"] }
  - { method: POST, path: "/endowment/managers/{manager_id}/decline", description: "PROSPECT -> DECLINED", roles: [InvestmentOfficer], code: 200, input: [], output: InvestmentManager, side_effects: ["engagement_status=DECLINED"] }
  - { method: POST, path: "/endowment/managers/{manager_id}/terminate", description: "WATCHLIST/PROBATION -> TERMINATED (board governance; ENGAGED managers cannot be terminated)", roles: [BoardMember], code: 200, input: [], output: InvestmentManager, side_effects: ["coverage_end_quarter := pool.current_quarter_index"] }

  # --- ManagerQuarterReport ---
  - { method: POST, path: "/endowment/manager-quarter-reports", description: "File a manager's quarter report; computes Dietz + simple returns and drives watchlist streaks", roles: [InvestmentOfficer], code: 201, input: [manager_id, quarter_index, beginning_mv_cents, ending_mv_cents, flows, benchmark_return_bps], output: ManagerQuarterReport, side_effects: ["return_bps, simple_return_bps, excess_bps computed", "streaks updated; engagement_status auto-transition may fire", "pool must be ACTIVE"] }
  - { method: GET, path: "/endowment/manager-quarter-reports", description: "List manager reports (reverse-reachability for manager_id FK)", roles: [EndowmentAdmin, InvestmentOfficer, DevelopmentOfficer, BoardMember, ProgramManager], code: 200, input: ["limit?", "offset?", "manager_id?", "quarter_index?"], output: "ManagerQuarterReport[]", side_effects: [] }
  - { method: GET, path: "/endowment/manager-quarter-reports/{report_id}", description: "Read one manager report", roles: [EndowmentAdmin, InvestmentOfficer, DevelopmentOfficer, BoardMember, ProgramManager], code: 200, input: [], output: ManagerQuarterReport, side_effects: [] }

  # --- AnnualReport ---
  - { method: POST, path: "/endowment/reports", description: "Author an annual report (DRAFT); fiscal year must be complete and scoped distributions terminal", roles: [DevelopmentOfficer, InvestmentOfficer], code: 201, input: [pool_id, "fund_id?", report_type, fiscal_year], output: AnnualReport, side_effects: ["created_by_user_id set"] }
  - { method: GET, path: "/endowment/reports", description: "List reports (reverse-reachability for pool_id and fund_id FKs)", roles: [EndowmentAdmin, InvestmentOfficer, DevelopmentOfficer, BoardMember, ProgramManager], code: 200, input: ["limit?", "offset?", "pool_id?", "fund_id?", "report_type?", "fiscal_year?", "report_status?"], output: "AnnualReport[]", side_effects: [] }
  - { method: GET, path: "/endowment/reports/{report_id}", description: "Read one report", roles: [EndowmentAdmin, InvestmentOfficer, DevelopmentOfficer, BoardMember, ProgramManager], code: 200, input: [], output: AnnualReport, side_effects: [] }
  - { method: POST, path: "/endowment/reports/{report_id}/submit_review", description: "DRAFT -> UNDER_REVIEW", roles: [DevelopmentOfficer, InvestmentOfficer], code: 200, input: [], output: AnnualReport, side_effects: [] }
  - { method: POST, path: "/endowment/reports/{report_id}/return_for_revision", description: "UNDER_REVIEW -> DRAFT (board review loop)", roles: [BoardMember], code: 200, input: [], output: AnnualReport, side_effects: [] }
  - { method: POST, path: "/endowment/reports/{report_id}/publish", description: "UNDER_REVIEW -> PUBLISHED; completeness gates + drift acknowledgement + segregation of duties", roles: [BoardMember], code: 200, input: [], output: AnnualReport, side_effects: ["published_by_user_id set"] }

  # --- UnitLedgerEntry (immutable, append-only) ---
  - { method: GET, path: "/endowment/ledger-entries", description: "List ledger entries (reverse-reachability for fund_id FK); ordered by created_at ASC", roles: [EndowmentAdmin, InvestmentOfficer, DevelopmentOfficer, BoardMember, ProgramManager], code: 200, input: ["limit?", "offset?", "fund_id?", "entry_type?", "quarter_index?"], output: "UnitLedgerEntry[]", side_effects: [] }
  - { method: GET, path: "/endowment/ledger-entries/{entry_id}", description: "Read one ledger entry", roles: [EndowmentAdmin, InvestmentOfficer, DevelopmentOfficer, BoardMember, ProgramManager], code: 200, input: [], output: UnitLedgerEntry, side_effects: [] }

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_OR_INVALID_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing or empty" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Role not permitted on this endpoint" }
  - { id: ERR_SEGREGATION_OF_DUTIES_VIOLATION, http: 403, condition: "Approver/publisher/endorser is the same X-User-ID as a prior-stage actor on the same record" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, invalid enum, out-of-range scalar, malformed flow array, or class/shape rule broken (TERM without term_end_quarter_index, non-DONOR_FUND report carrying fund_id, etc.)" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Referenced resource id does not exist (path or body, checked left-to-right)" }
  - { id: ERR_INVALID_STATE_TRANSITION, http: 409, condition: "Current lifecycle state does not permit the requested transition (including terminal-state lockdown and ENGAGED-manager termination)" }
  - { id: ERR_POOL_SUSPENDED, http: 409, condition: "Pool is SUSPENDED (or TERMINATED); value-moving child operation blocked" }
  - { id: ERR_STALE_POOL_VERSION, http: 412, condition: "expected_pool_version does not match the pool's current version (OCC)" }
  - { id: ERR_PURPOSE_MISMATCH, http: 422, condition: "Payout program_purpose conflicts with the fund's donor purpose restriction" }
  - { id: ERR_UNDERWATER_SPENDING_BLOCKED, http: 422, condition: "Approving a distribution for an underwater, non-exempt fund without an APPROVED exception" }
  - { id: ERR_FUND_NOT_UNDERWATER, http: 422, condition: "Exception requested or approved for a fund that is not currently underwater" }
  - { id: ERR_CORPUS_INVIOLABLE, http: 422, condition: "Corpus redemption attempted on TRUE_ENDOWMENT or unmatured TERM_ENDOWMENT" }
  - { id: ERR_DUPLICATE_RECORD, http: 409, condition: "Uniqueness violation: (fund, external_ref) gift, (pool, fund_code), (pool, asset_class) allocation, (manager, quarter) report, (fund, fiscal_year) distribution, (fund, fiscal_year) open exception, (pool, fund, fiscal_year, report_type) report" }
  - { id: ERR_WINDOW_CONFLICT, http: 409, condition: "Temporal window rule broken: policy effective year not strictly increasing, manager coverage interval intersects an engaged same-class manager, report filed for a non-open quarter, fiscal year out of range" }
  - { id: ERR_VALUATION_OUT_OF_ORDER, http: 409, condition: "Valuation created for a quarter other than the open one, or a PRELIMINARY/FINAL already exists for the open quarter" }
  - { id: ERR_VALUATION_LOCKED, http: 409, condition: "Supersede blocked: the quarter already unitized gifts, swept payouts, funded a distribution, or has manager reports on file" }
  - { id: ERR_INCOMPLETE_FISCAL_YEAR, http: 422, condition: "Report created/published for an incomplete fiscal year, or scoped distributions not all terminal" }
  - { id: ERR_DRIFT_NOT_ACKNOWLEDGED, http: 422, condition: "BOARD_INVESTMENT publish while an allocation is BREACHED and unacknowledged" }
  - { id: ERR_MINIMUM_FUNDING_NOT_MET, http: 422, condition: "Fund activation with pledged_corpus_cents below the 5000000 minimum" }
  - { id: ERR_POLICY_PARAM_OUT_OF_RANGE, http: 422, condition: "Policy rate/window/band parameters outside allowed bounds" }
  - { id: ERR_ALLOCATION_SUM_INVALID, http: 422, condition: "Pool allocation targets do not sum to exactly 10000 bps" }
  - { id: ERR_MANAGER_REPORT_MISSING, http: 422, condition: "Finalize blocked: a coverage-eligible manager has not filed the quarter's report" }
  - { id: ERR_POOL_MV_MISMATCH, http: 422, condition: "Finalize final_pool_market_value_cents differs from the sum of the quarter's manager ending market values" }
  - { id: ERR_MV_CONTINUITY_BREAK, http: 422, condition: "Manager report beginning_mv_cents differs from the manager's prior-quarter ending_mv_cents" }
  - { id: ERR_EXCEPTION_AMOUNT_EXCEEDS_REQUESTED, http: 422, condition: "approved_amount_cents greater than requested_amount_cents" }
  - { id: ERR_ALLOCATION_EXCEEDS_DISTRIBUTION, http: 422, condition: "Payout allocations would exceed the distribution's distributed_amount_cents" }
  - { id: ERR_INVALID_SPENT_AMOUNT, http: 422, condition: "Spending report decreases the cumulative amount or exceeds the allocation" }
  - { id: ERR_INSUFFICIENT_UNITS, http: 422, condition: "Redemption requires more units than the fund holds at the current FINAL price" }
  - { id: ERR_NO_APPLICABLE_POLICY, http: 422, condition: "No ADOPTED or SUPERSEDED policy covers the requested fiscal year" }
  - { id: ERR_NOT_TERMINABLE, http: 422, condition: "Fund/pool termination preconditions unmet (units remain, open gifts/distributions/payouts, or non-terminated funds)" }

# =============================================================================
# §1.7 RBAC Matrix (segregation_of_duties model)
# =============================================================================
roles:
  - name: EndowmentAdmin
    description: "Endowment office operations lead; owns pool lifecycle and target allocations"
    identity: opaque
    exclusive_operations:
      - "POST /endowment/pools — create pool"
      - "POST /endowment/pools/{id}/suspend, /resume — pool posture"
      - "POST /endowment/allocations/bulk_upsert — target allocation set"
    shared_operations: ["all GET endpoints"]
  - name: InvestmentOfficer
    description: "Investment office; owns valuations, managers, performance reports, exception endorsement, and distribution payout execution"
    identity: opaque
    exclusive_operations:
      - "POST /endowment/valuations, /finalize, /supersede — valuation lifecycle"
      - "POST /endowment/managers, /engage, /decline — manager roster"
      - "POST /endowment/manager-quarter-reports — performance filing"
      - "POST /endowment/policies, /withdraw — policy proposal"
      - "POST /endowment/exceptions/{id}/endorse — exception endorsement"
      - "POST /endowment/distributions/{id}/distribute — unit redemption"
    shared_operations: ["all GET endpoints", "POST /endowment/reports, /submit_review — report authorship (shared with DevelopmentOfficer)"]
  - name: DevelopmentOfficer
    description: "Advancement office; owns donors, funds, gifts, distribution proposals, exception requests, and payout allocation"
    identity: opaque
    exclusive_operations:
      - "POST /endowment/donors — donor registry"
      - "POST /endowment/funds, /activate — fund establishment"
      - "POST /endowment/gifts, /receive, /cancel, /rescind — gift lifecycle"
      - "POST /endowment/distributions, /propose, /repropose — spending proposals"
      - "POST /endowment/exceptions — underwater exception requests"
      - "POST /endowment/payouts, /disburse — program payout allocation"
    shared_operations: ["all GET endpoints", "POST /endowment/reports, /submit_review", "POST /endowment/distributions/{id}/cancel (shared with BoardMember)"]
  - name: BoardMember
    description: "Board/committee approver; never proposes the items it approves (segregation of duties)"
    identity: opaque
    exclusive_operations:
      - "POST /endowment/policies/{id}/adopt — policy adoption"
      - "POST /endowment/distributions/{id}/request_revision, /approve — spending approval"
      - "POST /endowment/exceptions/{id}/approve, /reject, /rescind — exception adjudication"
      - "POST /endowment/managers/{id}/terminate — manager termination"
      - "POST /endowment/funds/{id}/terminate, /redeem_corpus — corpus governance"
      - "POST /endowment/pools/{id}/terminate — pool termination"
      - "POST /endowment/allocations/{id}/acknowledge_drift — drift governance"
      - "POST /endowment/reports/{id}/return_for_revision, /publish — report release"
    shared_operations: ["all GET endpoints", "POST /endowment/distributions/{id}/cancel (APPROVED only, shared with DevelopmentOfficer)"]
  - name: ProgramManager
    description: "Receiving university program; reports spending against disbursed payouts"
    identity: opaque
    exclusive_operations:
      - "POST /endowment/payouts/{id}/report_spending — cumulative spending reports"
    shared_operations: ["all GET endpoints"]
