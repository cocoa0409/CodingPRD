              as: SalesRep
              captures: { site_id: $.data.id }
            - call: "POST /placement-permits"
              payload: { site_id: "${site_id}", permit_kind: "PLACEMENT", authority_ref: "PL-10501", effective_from: "2026-08-01", effective_to: "2026-12-31" }
              as: PermitCoordinator
              captures: { p_place: $.data.id }
            - call: "POST /placement-permits/${p_place}/submit"
              payload: {}
              as: PermitCoordinator
            - call: "POST /placement-permits/${p_place}/approve"
              payload: { authority_decision_ref: "AD-10501" }
              as: ComplianceOfficer
            - call: "POST /rental-contracts"
              payload: { account_id: "${acct_id}", site_id: "${site_id}", contract_kind: "CONSTRUCTION", term_start: "2026-08-03", term_end: "2026-09-30", headcount: 40, event_duration_hours: 8, service_frequency_per_week: 3, season_code: "OFF", construction_phase: "SITEWORK", ada_required: false }
              as: SalesRep
              captures: { contract_id: $.data.id, contract_v: $.data.version }
            - call: "POST /rental-contracts/${contract_id}/quote"
              payload: { expected_contract_version: "${contract_v}" }
              as: SalesRep
              captures: { quoted: $.data.quoted_cents }
          trigger:
            - call: "GET /service-sites/${site_id}"
              payload: {}
              as: PermitCoordinator
              captures: { status_one_kind: $.data.permit_status, posture_one_kind: $.data.site_posture }
            - call: "POST /rental-contracts/${contract_id}/activate"
              payload: {}
              as: SalesRep
              captures: { e_restricted: $.data.error_id }
            - call: "POST /placement-permits"
              payload: { site_id: "${site_id}", permit_kind: "RIGHT_OF_WAY", authority_ref: "RW-10501", effective_from: "2026-08-01", effective_to: "2026-12-31" }
              as: PermitCoordinator
              captures: { p_row: $.data.id }
            - call: "GET /service-sites/${site_id}"
              payload: {}
              as: PermitCoordinator
              captures: { status_row_draft: $.data.permit_status, posture_row_draft: $.data.site_posture }
            - call: "POST /placement-permits/${p_row}/submit"
              payload: {}
              as: PermitCoordinator
            - call: "GET /service-sites/${site_id}"
              payload: {}
              as: PermitCoordinator
              captures: { status_row_submitted: $.data.permit_status, posture_row_submitted: $.data.site_posture }
            - call: "POST /placement-permits/${p_row}/approve"
              payload: { authority_decision_ref: "AD-RW-10501" }
              as: ComplianceOfficer
            - call: "GET /service-sites/${site_id}"
              payload: {}
              as: PermitCoordinator
              captures: { status_both: $.data.permit_status, posture_both: $.data.site_posture }
            - call: "POST /rental-contracts/${contract_id}/activate"
              payload: {}
              as: SalesRep
              captures: { fs_final: $.data.fulfillment_state }
          assert:
            - "${quoted} == 91500"
            - "${status_one_kind} == NONE and ${posture_one_kind} == RESTRICTED — NONE precedes PENDING and APPROVED in PERMIT_STATUS_PRECEDENCE, so the missing RIGHT_OF_WAY kind dominates the APPROVED PLACEMENT"
            - "${e_restricted} == ERR_SITE_POSTURE_RESTRICTED with HTTP 409"
            - "${status_row_draft} == PENDING and ${posture_row_draft} == RESTRICTED — filing the second kind improves NONE to PENDING but does not open the site"
            - "${status_row_submitted} == PENDING and ${posture_row_submitted} == RESTRICTED — SUBMITTED also maps to PENDING, so nothing changed"
            - "${status_both} == APPROVED and ${posture_both} == OPEN — the propagation has reached its fixed point"
            - "${fs_final} == ACTIVE — the identical activate call now succeeds"

  # ===========================================================================
  - section: validations
