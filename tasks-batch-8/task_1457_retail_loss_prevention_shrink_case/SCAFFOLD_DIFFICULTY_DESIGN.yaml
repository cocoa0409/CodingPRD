  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: interview_overlap_half_open_adjacency_allowed
        grounds:
          - validations[priority=10]
          - errors[ERR_INTERVIEW_OVERLAP]
          - entities.Interview.fields.scheduled_start
        distinguishing_aspect: |
          Half-open interval semantics on the employee resource: interview [10:00, 11:00) and
          [11:00, 12:00) touch at 11:00 and BOTH succeed (adjacency is not overlap), while
          [10:30, 11:30) genuinely overlaps and is rejected with ERR_INTERVIEW_OVERLAP.
        test_recipe:
          setup:
            - "Store S1; employee E1 ACTIVE; EMPLOYEE-subject case CX for E1 (manual loss 50000) assigned to ana-1 with evidence, advanced to READY_FOR_INTERVIEW"
            - "Interviews I1 [2026-08-10T10:00, 11:00) and I2 [11:00, 12:00) scheduled for E1 without conflict"
          setup_api_calls:
            - call: "POST /stores"
              payload: { store_number: "S220", name: "Store 220", region_code: "R9" }
              as: LPAdmin
              as_user_id: adm-1
              captures: { s1: $.data.id }
            - call: "POST /employees"
              payload: { store_id: "${s1}", employee_ref: "E-220", full_name: "Emp 220" }
              as: HRPartner
              as_user_id: hr-1
              captures: { e1: $.data.id }
            - call: "POST /cases"
              payload: { store_id: "${s1}", subject_type: "EMPLOYEE", employee_id: "${e1}", manual_loss_cents: 50000 }
              as: LPAnalyst
              as_user_id: ana-1
              captures: { cx: $.data.id }
            - call: "POST /cases/${cx}/assign"
              payload: { analyst_id: "ana-1" }
              as: LPManager
              as_user_id: mgr-1
            - call: "POST /evidence-items"
              payload: { case_id: "${cx}", evidence_type: "TRANSACTION_LOG", captured_at: "2026-07-15T10:00:00Z", retention_class: "STANDARD" }
              as: LPAnalyst
              as_user_id: ana-1
            - call: "POST /cases/${cx}/advance"
              payload: {}
              as: LPAnalyst
              as_user_id: ana-1
            - call: "POST /interviews"
              payload: { case_id: "${cx}", interviewer_id: "ana-1", subject_employee_id: "${e1}", scheduled_start: "2026-08-10T10:00:00Z", scheduled_end: "2026-08-10T11:00:00Z" }
              as: LPAnalyst
              as_user_id: ana-1
              captures: { i1: $.data.id }
            - call: "POST /interviews"
              payload: { case_id: "${cx}", interviewer_id: "ana-1", subject_employee_id: "${e1}", scheduled_start: "2026-08-10T11:00:00Z", scheduled_end: "2026-08-10T12:00:00Z" }
              as: LPAnalyst
              as_user_id: ana-1
              captures: { i2: $.data.id }
          trigger:
            - call: "POST /interviews"
              payload: { case_id: "${cx}", interviewer_id: "ana-1", subject_employee_id: "${e1}", scheduled_start: "2026-08-10T10:30:00Z", scheduled_end: "2026-08-10T11:30:00Z" }
              as: LPAnalyst
              as_user_id: ana-1
              captures: { err_overlap: $.data.error_id }
          assert:
            - "Interview.${i1}.status == SCHEDULED and Interview.${i2}.status == SCHEDULED  # touching endpoints accepted"
            - "err_overlap == ERR_INTERVIEW_OVERLAP  # strict intersection rejected"

      - name: shrink_period_overlap_closed_interval_touching_rejected
        grounds:
          - validations[priority=10]
          - errors[ERR_PERIOD_OVERLAP]
          - entities.ShrinkPeriod.fields.period_start
        distinguishing_aspect: |
          Closed-interval semantics on the store resource (different interval geometry from the
          half-open interview rule): P2 whose period_start equals P1's period_end
          (2026-03-31T23:59:59Z) TOUCHES P1 and is rejected with ERR_PERIOD_OVERLAP, while P3
          starting the next second (2026-04-01T00:00:00Z) is accepted.
        test_recipe:
          setup:
            - "Store S1 ACTIVE; period P1 [2026-01-01T00:00:00Z, 2026-03-31T23:59:59Z] created"
          setup_api_calls:
            - call: "POST /stores"
              payload: { store_number: "S221", name: "Store 221", region_code: "R9" }
              as: LPAdmin
              as_user_id: adm-1
              captures: { s1: $.data.id }
            - call: "POST /shrink-periods"
              payload: { store_id: "${s1}", period_start: "2026-01-01T00:00:00Z", period_end: "2026-03-31T23:59:59Z", book_inventory_cents: 1000000, period_sales_cents: 1000000 }
              as: LPAdmin
              as_user_id: adm-1
              captures: { p1: $.data.id }
          trigger:
            - call: "POST /shrink-periods"
              payload: { store_id: "${s1}", period_start: "2026-03-31T23:59:59Z", period_end: "2026-06-30T23:59:59Z", book_inventory_cents: 1000000, period_sales_cents: 1000000 }
              as: LPAdmin
              as_user_id: adm-1
              captures: { err_touch: $.data.error_id }
            - call: "POST /shrink-periods"
              payload: { store_id: "${s1}", period_start: "2026-04-01T00:00:00Z", period_end: "2026-06-30T23:59:59Z", book_inventory_cents: 1000000, period_sales_cents: 1000000 }
              as: LPAdmin
              as_user_id: adm-1
              captures: { p3: $.data.id }
          assert:
            - "err_touch == ERR_PERIOD_OVERLAP  # closed intervals: touching endpoints conflict"
            - "ShrinkPeriod.${p3}.status == OPEN  # next-instant start accepted"
            - "ShrinkPeriod.${p1}.status == OPEN and unchanged"

  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: payment_post_return_conserves_outstanding_equation
        grounds:
          - calculations.restitution_waterfall
          - state_machines.RestitutionPayment.RECEIVED_to_POSTED
          - state_machines.RestitutionPayment.POSTED_to_RETURNED
          - state_machines.CivilDemand.PARTIALLY_PAID_to_ISSUED
        distinguishing_aspect: |
          Conserved quantity: money equation outstanding_cents == amount_due_cents +
          fees_incurred_cents - paid_to_date_cents. Forward post (40000) drives outstanding to 0
          (PAID_IN_FULL); the compensating return restores outstanding to exactly 42500
          (40000 + 2500 NSF fee - 0), flips the demand back to ISSUED (paid_to_date 0), and
          returns Store.restitution_collected_cents to its baseline 0. No drift anywhere.
        test_recipe:
          setup:
            - "Store S1; EXTERNAL case CX (manual loss 30000) INTERVIEWED; demand DD (STATUTORY, priors 0) ISSUED with amount_due_cents == 40000"
            - "Payment PAY (40000, CARD) POSTED: DD PAID_IN_FULL, S1.restitution_collected_cents == 40000"
          setup_api_calls:
            - call: "POST /stores"
              payload: { store_number: "S230", name: "Store 230", region_code: "R10" }
              as: LPAdmin
              as_user_id: adm-1
              captures: { s1: $.data.id }
            - call: "POST /cases"
              payload: { store_id: "${s1}", subject_type: "EXTERNAL", manual_loss_cents: 30000 }
              as: LPAnalyst
              as_user_id: ana-1
              captures: { cx: $.data.id }
            - call: "POST /cases/${cx}/assign"
              payload: { analyst_id: "ana-1" }
              as: LPManager
              as_user_id: mgr-1
            - call: "POST /evidence-items"
              payload: { case_id: "${cx}", evidence_type: "PHOTO", captured_at: "2026-07-15T10:00:00Z", retention_class: "STANDARD" }
              as: LPAnalyst
              as_user_id: ana-1
            - call: "POST /cases/${cx}/advance"
              payload: {}
              as: LPAnalyst
              as_user_id: ana-1
            - call: "POST /interviews"
              payload: { case_id: "${cx}", interviewer_id: "ana-1", scheduled_start: "2026-08-02T09:00:00Z", scheduled_end: "2026-08-02T10:00:00Z" }
              as: LPAnalyst
              as_user_id: ana-1
              captures: { iv: $.data.id }
            - call: "POST /interviews/${iv}/record-outcome"
              payload: { outcome: "ADMITTED" }
              as: LPAnalyst
              as_user_id: ana-1
            - call: "POST /interviews/${iv}/document"
              payload: { notes: "Documented." }
              as: LPAnalyst
              as_user_id: ana-1
            - call: "GET /cases/${cx}"
              as: LPManager
              as_user_id: mgr-1
              captures: { cx_v: $.data.version }
            - call: "POST /civil-demands"
              payload: { case_id: "${cx}", basis: "STATUTORY", priors_offense_count: 0, expected_case_version: "${cx_v}" }
              as: LPAnalyst
              as_user_id: ana-1
              captures: { dd: $.data.id }
            - call: "POST /civil-demands/${dd}/issue"
              payload: {}
              as: LPManager
              as_user_id: mgr-1
            - call: "POST /restitution-payments"
              payload: { demand_id: "${dd}", amount_cents: 40000, method: "CARD" }
              as: LPAnalyst
              as_user_id: ana-1
              captures: { pay: $.data.id }
            - call: "POST /restitution-payments/${pay}/post"
              payload: {}
              as: LPAnalyst
              as_user_id: ana-1
          trigger:
            - call: "POST /restitution-payments/${pay}/return"
              payload: {}
              as: LPAnalyst
              as_user_id: ana-1
            - call: "GET /civil-demands/${dd}"
              as: LPManager
              as_user_id: mgr-1
            - call: "GET /stores/${s1}"
              as: LPAdmin
              as_user_id: adm-1
          assert:
            - "CivilDemand.${dd}.outstanding_cents == 42500  # 40000 + 2500 - 0: equation holds after compensating return"
            - "CivilDemand.${dd}.fees_incurred_cents == 2500 and paid_to_date_cents == 0"
            - "CivilDemand.${dd}.status == ISSUED  # paid_to_date back to zero flips PARTIALLY_PAID -> ISSUED"
            - "Store.${s1}.restitution_collected_cents == 0  # baseline restored exactly"
            - "RestitutionPayment.${pay}.status == RETURNED"

      - name: merge_conserves_attributed_loss_sum
        grounds:
          - state_machines.Case.READY_FOR_INTERVIEW_to_MERGED
          - calculations.case_total_loss
          - entities.Case.fields.total_loss_cents
        distinguishing_aspect: |
          Conserved quantity: attributed loss. Pre-merge C1 (alert-sourced, event sum 75000,
          recovered 5000 -> total_loss 70000) and C2 (manual 30000) sum to 100000; merging C1
          into C2 leaves the enterprise loss sum over non-MERGED cases at exactly 100000
          (C2.total_loss_cents), because the per-case non-negativity gate
          (ERR_RECOVERED_EXCEEDS_LOSS) keeps raw sums additive. Distinct conserved quantity
          from the money equation of the sibling instance.
        test_recipe:
          setup:
            - "Store S1; unattributed events HIGH_VALUE_VOID 40000 + HIGH_VALUE_VOID 35000 aggregate into alert A1 (score 56.0, OPEN)"
            - "A1 converted to EXTERNAL case C1 (source=ALERT); C1 assigned ana-1, one evidence item, advanced with recovered_value_cents=5000 (READY_FOR_INTERVIEW, total_loss 70000)"
            - "Manual EXTERNAL case C2 (manual_loss_cents 30000) assigned ana-1 (INVESTIGATING, total_loss 30000)"
          setup_api_calls:
            - call: "POST /stores"
              payload: { store_number: "S231", name: "Store 231", region_code: "R10" }
              as: LPAdmin
              as_user_id: adm-1
              captures: { s1: $.data.id }
            - call: "POST /exception-events"
              payload: { store_id: "${s1}", register_ref: "R09", txn_ref: "TX1", exception_type: "HIGH_VALUE_VOID", amount_cents: 40000, occurred_at: "2026-07-12T10:00:00Z" }
              as: PosFeed
              as_user_id: feed-1
            - call: "POST /exception-events"
              payload: { store_id: "${s1}", register_ref: "R09", txn_ref: "TX2", exception_type: "HIGH_VALUE_VOID", amount_cents: 35000, occurred_at: "2026-07-12T11:00:00Z" }
              as: PosFeed
              as_user_id: feed-1
            - call: "GET /alerts?store_id=${s1}"
              as: LPAnalyst
              as_user_id: ana-1
              captures: { a1: "$.data[0].id" }
            - call: "POST /alerts/${a1}/convert"
              payload: { subject_type: "EXTERNAL" }
              as: LPAnalyst
              as_user_id: ana-1
              captures: { c1: $.data.id }
            - call: "POST /cases/${c1}/assign"
              payload: { analyst_id: "ana-1" }
              as: LPManager
              as_user_id: mgr-1
            - call: "POST /evidence-items"
              payload: { case_id: "${c1}", evidence_type: "VIDEO_CLIP", captured_at: "2026-07-12T10:00:00Z", retention_class: "STANDARD" }
              as: LPAnalyst
              as_user_id: ana-1
            - call: "POST /cases/${c1}/advance"
              payload: { recovered_value_cents: 5000 }
              as: LPAnalyst
              as_user_id: ana-1
            - call: "POST /cases"
              payload: { store_id: "${s1}", subject_type: "EXTERNAL", manual_loss_cents: 30000 }
              as: LPAnalyst
              as_user_id: ana-1
              captures: { c2: $.data.id }
            - call: "POST /cases/${c2}/assign"
              payload: { analyst_id: "ana-1" }
              as: LPManager
              as_user_id: mgr-1
            - call: "GET /cases/${c1}"
              as: LPManager
              as_user_id: mgr-1
              captures: { c1_loss_pre: $.data.total_loss_cents }
            - call: "GET /cases/${c2}"
              as: LPManager
              as_user_id: mgr-1
              captures: { c2_loss_pre: $.data.total_loss_cents }
          trigger:
            - call: "POST /cases/${c1}/merge"
              payload: { target_case_id: "${c2}" }
              as: LPManager
              as_user_id: mgr-1
            - call: "GET /cases/${c2}"
              as: LPManager
              as_user_id: mgr-1
            - call: "GET /cases/${c1}"
              as: LPManager
              as_user_id: mgr-1
          assert:
            - "c1_loss_pre == 70000 and c2_loss_pre == 30000  # pre-merge sum 100000"
            - "Case.${c1}.status == MERGED and merged_into_case_id == ${c2}"
            - "Case.${c2}.total_loss_cents == 100000  # 70000 + 30000 conserved exactly"
            - "Case.${c2}.manual_loss_cents == 30000 and recovered_value_cents == 5000"
            - "GET /alerts?case_id=${c1} returns 0 items; GET /alerts?case_id=${c2} returns 1 item  # alert re-pointed to surviving case"