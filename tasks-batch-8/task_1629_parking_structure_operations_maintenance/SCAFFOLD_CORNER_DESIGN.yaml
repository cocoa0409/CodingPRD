      trigger:
      - call: GET /ops/facilities/${fac}
        as: MonthlyParker
        as_user_id: ${pk}
        captures:
          nm: $.data.name
      assert:
      - 'GET succeeds for MonthlyParker: name == ''RB5 Fac'' (shared read surface)'
- section: complexity_layers
  instances:
  - name: occ_stale_facility_version_publish
    claim_type: optimistic_concurrency
    grounds:
    - concurrency_rules[rate-publish-stale-facility]
    - errors[ERR_STALE_FACILITY_VERSION]
    distinguishing_aspect: 'Two sequential publishes: the second carries the pre-first facility version and is rejected 412; retrying with the fresh version succeeds and supersedes rs1.'
    test_recipe:
      setup:
      - Facility v1; rs1 PUBLISHED (facility advanced to v2); rs2 DRAFT created against the stale v1 view
      setup_api_calls:
      - call: POST /ops/facilities
        payload:
          name: OCC1 Fac
          total_spaces: 200
          monthly_capacity: 50
          event_pool_spaces: 40
        as: FacilityManager
        captures:
          fac: $.data.id
          fac_v: $.data.version
      - call: POST /ops/rate-schedules
        payload:
          facility_id: ${fac}
          label: R1
          grace_minutes: 15
          first_hour_cents: 500
          additional_hour_cents: 300
          daily_max_cents: 2400
          event_flat_cents: 1500
          lost_ticket_daily_cents: 2400
          effective_from: '2026-08-01T00:00:00Z'
        as: FacilityManager
        captures:
          rs1: $.data.id
      - call: POST /ops/rate-schedules/${rs1}/publish
        payload:
          expected_facility_version: ${fac_v}
        as: FacilityManager
      - call: POST /ops/rate-schedules
        payload:
          facility_id: ${fac}
          label: R2
          grace_minutes: 20
          first_hour_cents: 600
          additional_hour_cents: 300
          daily_max_cents: 2600
          event_flat_cents: 1600
          lost_ticket_daily_cents: 2600
          effective_from: '2026-08-01T00:00:00Z'
        as: FacilityManager
        captures:
          rs2: $.data.id
      trigger:
      - call: POST /ops/rate-schedules/${rs2}/publish
        payload:
          expected_facility_version: ${fac_v}
        as: FacilityManager
        captures:
          err: $.data.error_id
      - call: GET /ops/facilities/${fac}
        as: FacilityManager
        captures:
          fac_v2: $.data.version
      - call: POST /ops/rate-schedules/${rs2}/publish
        payload:
          expected_facility_version: ${fac_v2}
        as: FacilityManager
        captures:
          st2: $.data.schedule_status
      - call: GET /ops/rate-schedules/${rs1}
        as: FacilityManager
        captures:
          st1: $.data.schedule_status
      assert:
      - 'Stale publish (${fac_v} == 1 while facility is 2): ERR_STALE_FACILITY_VERSION 412; rs2 stays DRAFT'
      - 'Fresh publish (${fac_v2} == 2): rs2 PUBLISHED and rs1 SUPERSEDED'
  - name: occ_stale_agreement_version_amend
    claim_type: optimistic_concurrency
    grounds:
    - concurrency_rules[agreement-amend-stale-version]
    - errors[ERR_STALE_AGREEMENT_VERSION]
    distinguishing_aspect: 'Two sequential amends: the second replays the version captured before the first and is rejected 412; the first amend''s field change survives.'
    test_recipe:
      setup:
      - Facility; agreement APPROVED at version 1
      setup_api_calls:
      - call: POST /ops/facilities
        payload:
          name: OCC2 Fac
          total_spaces: 200
          monthly_capacity: 50
          event_pool_spaces: 40
        as: FacilityManager
        captures:
          fac: $.data.id
      - call: POST /ops/parker-accounts
        payload:
          full_name: Occ Two
          email: occ2@x.com
        as: ParkingAttendant
        as_user_id: att-1
        captures:
          pk: $.data.id
      - call: POST /ops/monthly-agreements
        payload:
          facility_id: ${fac}
          parker_account_id: ${pk}
          tier: STANDARD
          monthly_rate_cents: 20000
        as: ParkingAttendant
        as_user_id: att-1
        captures:
          agr: $.data.id
          ag_v: $.data.version
      trigger:
      - call: POST /ops/monthly-agreements/${agr}/amend
        payload:
          expected_agreement_version: ${ag_v}
          monthly_rate_cents: 21000
        as: FacilityManager
        captures:
          rate1: $.data.monthly_rate_cents
          v1: $.data.version
      - call: POST /ops/monthly-agreements/${agr}/amend
        payload:
          expected_agreement_version: ${ag_v}
          monthly_rate_cents: 22000
        as: FacilityManager
        captures:
          err: $.data.error_id
      - call: GET /ops/monthly-agreements/${agr}
        as: FacilityManager
        captures:
          rate2: $.data.monthly_rate_cents
          v2: $.data.version
      assert:
      - 'First amend succeeds: monthly_rate_cents == 21000, version == 2'
      - 'Second amend replaying version 1: ERR_STALE_AGREEMENT_VERSION 412'
      - 'After rejection: monthly_rate_cents still == 21000 and version still == 2'
  - name: cascading_side_effects_covered_by_difficulty
    claim_type: cascading_side_effects
    grounds:
    - complexity_profile
    excluded_because:
      difficulty_instance: transitive_cascade / critical_inspection_cascades_to_credential_revocation
      rationale: The 3-link inspection cascade and the 2-link event activation/reversal cascades are exercised end-to-end by the difficulty instances.
