            - "MaterialOrder.${ord_id}.fulfillment_status stays CANCELLED and version == 2 (bumped once by the first cancel only)"
            - "MaterialOrder.${ord_id}.settlement_status stays UNBILLED throughout"

      - name: confirming_a_confirmed_order_twice_is_rejected
