      - name: an_uncovered_and_a_non_active_postal_code_both_land_unroutable
        claim_type: Input Set Filtering
        grounds:
          - calculations.territory_lead_routing
          - state_machines.Lead.NEW_to_UNROUTABLE
          - entities.Lead.fields.territory_id
        distinguishing_aspect: "UNROUTABLE, not QUEUED, is the answer whenever the failure is on eligibility conditions (1) or (2): a postal code nobody charters and a postal code whose only franchise sits in PROBATION are indistinguishable to the router, while capacity exhaustion - the only retryable failure - queues instead. All three creations still return 201."
        test_recipe:
          setup:
            - "Territory T1 ACTIVE over postal code 30301 with lead_capacity_per_week 5."
            - "Territory T2 chartered over postal code 30401 and then moved to PROBATION by headquarters, so 30401 has coverage on paper but no ACTIVE franchise."
          setup_api_calls:
            - call: "POST /blinds/territories"
              payload: { legal_name: "Northgate Blinds LLC", postal_codes: ["30301"], lead_capacity_per_week: 5 }
              as: Franchisor
              as_user_id: "hq-ops"
              captures: { t1: $.data.id }
            - call: "POST /blinds/territories"
              payload: { legal_name: "Southmark Window Fashions", postal_codes: ["30401"], lead_capacity_per_week: 5 }
              as: Franchisor
              as_user_id: "hq-ops"
              captures: { t2: $.data.id }
            - call: "PATCH /blinds/territories/${t2}"
              payload: { status: "PROBATION" }
              as: Franchisor
              as_user_id: "hq-ops"
              captures: { t2_status: $.data.status }
          trigger:
            - call: "POST /blinds/leads"
              payload: { customer_name: "Ana Ruiz", postal_code: "30301", source: "NATIONAL_CALL_CENTER", requested_at: "2026-08-01T08:00:00.000Z" }
              as: Franchisor
              as_user_id: "hq-ops"
              captures: { l1: $.data.id, l1_status: $.data.status, l1_territory: $.data.territory_id }
            - call: "POST /blinds/leads"
              payload: { customer_name: "Bo Chen", postal_code: "30401", source: "NATIONAL_CALL_CENTER", requested_at: "2026-08-01T09:00:00.000Z" }
              as: Franchisor
              as_user_id: "hq-ops"
              captures: { l2: $.data.id, l2_status: $.data.status, l2_territory: $.data.territory_id }
            - call: "POST /blinds/leads"
              payload: { customer_name: "Cy Doyle", postal_code: "99999", source: "WEB_FORM", requested_at: "2026-08-01T10:00:00.000Z" }
              as: Franchisor
              as_user_id: "hq-ops"
              captures: { l3: $.data.id, l3_status: $.data.status, l3_territory: $.data.territory_id }
          assert:
            - "the captured ${t2_status} == PROBATION and Territory.${t2}.version was incremented by the PATCH"
            - "the covered code routes: the captured ${l1_status} == ROUTED with ${l1_territory} == ${t1} and routed_at stamped from the logical clock"
            - "the PROBATION code does not: the captured ${l2_status} == UNROUTABLE with ${l2_territory} == null and routed_at null, even though a territory does list 30401"
            - "the unchartered code behaves identically: the captured ${l3_status} == UNROUTABLE with ${l3_territory} == null"
            - "all three creations returned 201 - a routing failure is a business state, never a request error"
            - "counters see only the routed lead: Territory.${t1}.open_leads_count == 1 and Territory.${t2}.open_leads_count == 0"
            - "GET /blinds/leads?status=UNROUTABLE returns total_count 2 and GET /blinds/leads?territory_id=${t2} returns total_count 0"

      - name: a_clean_install_is_clamped_at_the_base_score_but_still_offsets_a_later_exception
        claim_type: Constants Applied
