scenario: |
  748. Community Resource & Social-Services Directory (211/findhelp style):
  resource catalog & eligibility/category, need intake & screening, referral &
  closed-loop (consent), availability/capacity update, geo/transport match,
  outcome/follow-up, multilingual & accessibility, funder reporting

domain_name: community-resource-directory
api_prefix: ""

complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: quota_allocation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - scheduled_actions

  entity_topology: hybrid
  state_machine_shape: branching  # Referral branching; Intake cyclic; Program parallel dimensions
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: peer_roles
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# ==========================================================================
# §1.1 Entity-Relationship Table
# ==========================================================================
entities:
  - name: Funder
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Funder legal name"
      - name: fiscal_year_start_month
        type: integer
        source: input
        description: "1-12; month a new fiscal year begins for reporting cadence"
        constraints: "integer in [1, 12]"
      - name: grant_cents_total
        type: integer
        source: input
        description: "Total grant budget in whole cents for the current fiscal year"
        constraints: ">= 0"
      - name: grant_cents_remaining
        type: integer
        source: computed
        description: "grant_cents_total minus sum of ACTIVE OutcomeReport.service_cost_final_cents whose Referral.program.funder_id == this.id"
      - name: reporting_currency
        type: enum
        source: input
        description: "Currency label used in every FunderReport line item"
        constraints: "one of [USD, CAD, EUR]"

  - name: Provider
    parent: null
    common_fields: true
    fields:
      - name: legal_name
        type: string
        source: input
        description: "Provider legal name"
      - name: location_lat
        type: number
        source: input
        description: "Provider service address latitude in decimal degrees"
        constraints: "number in [-90.0, 90.0]"
      - name: location_lng
        type: number
        source: input
        description: "Provider service address longitude in decimal degrees"
        constraints: "number in [-180.0, 180.0]"
      - name: accessibility_features
        type: array
        source: input
        description: "Accessibility features the provider offers on-site"
        constraints: "subset of [WHEELCHAIR, HEARING_LOOP, ASL_INTERPRETER, LARGE_PRINT]"
      - name: languages_supported
        type: array
        source: input
        description: "Languages in which the provider can deliver service"
        constraints: "non-empty subset of [EN, ES, FR, ZH, VI, AR]"

  - name: Program
    parent: null
    common_fields: true
    fields:
      - name: provider_id
        type: string
        source: input
        description: "FK -> Provider.id; the provider operating this program"
      - name: funder_id
        type: string
        source: input
        description: "FK -> Funder.id; the funder underwriting completion costs"
      - name: category
        type: enum
        source: input
        description: "Primary service category delivered"
        constraints: "one of [FOOD, HOUSING, HEALTHCARE, MENTAL_HEALTH, EMPLOYMENT, TRANSPORT, LEGAL_AID, CHILDCARE]"
      - name: eligibility_income_max_cents
        type: integer
        source: input
        description: "Monthly household-income ceiling in cents; strictly-greater income → ERR_INCOME_INELIGIBLE"
        constraints: ">= 0"
      - name: eligibility_age_min
        type: integer
        source: input
        description: "Minimum eligible client age in years (inclusive)"
        constraints: "integer in [0, 120]"
      - name: eligibility_age_max
        type: integer
        source: input
        description: "Maximum eligible client age in years (inclusive)"
        constraints: "integer in [0, 120]; >= eligibility_age_min"
      - name: unit_cost_cents
        type: integer
        source: input
        description: "Baseline cost billed to funder per completed referral, in cents"
        constraints: ">= 0"
      - name: capacity_slots_total
        type: integer
        source: input
        description: "Total concurrent referral slots this program can hold across all statuses PROPOSED / ACCEPTED / SERVICE_IN_PROGRESS"
        constraints: ">= 1"
      - name: capacity_slots_taken
        type: integer
        source: computed
        description: "Count of Referrals with program_id == this.id AND status in {PROPOSED, ACCEPTED, SERVICE_IN_PROGRESS}; see calc program_utilization"
      - name: intake_posture
        type: enum
        source: computed
        description: "Parallel-dimension posture derived from utilization; see calc program_utilization; independent of funder_reporting_posture"
        constraints: "one of [OPEN, RESTRICTED, CLOSED]"
      - name: funder_reporting_posture
        type: enum
        source: system
        description: "Parallel-dimension posture governing whether outcomes on this program are still open for inclusion in a fresh FunderReport; advances OPEN→LOCKED when a FunderReport that covers this program is generated, LOCKED→ARCHIVED when the funder's fiscal year rolls over"
        constraints: "one of [OPEN, LOCKED, ARCHIVED]"

  - name: AvailabilityWindow
    parent: Program
    common_fields: true
    fields:
      - name: program_id
        type: string
        source: input
        description: "FK -> Program.id; the program this window belongs to"
      - name: start_ts
        type: datetime
        source: input
        description: "Window start (inclusive) in ISO 8601 UTC with millisecond precision"
      - name: end_ts
        type: datetime
        source: input
        description: "Window end (exclusive); half-open interval [start_ts, end_ts) per calc window_overlap; must be strictly greater than start_ts"
      - name: max_slots
        type: integer
        source: input
        description: "Maximum concurrent referrals servable during this window"
        constraints: ">= 1"

  - name: Client
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: "Client's full legal name"
      - name: date_of_birth
        type: string
        source: input
        description: "ISO 8601 date (YYYY-MM-DD); must be strictly greater than 1900-01-01 and strictly less than the current clock date"
      - name: monthly_income_cents
        type: integer
        source: input
        description: "Household monthly income in cents"
        constraints: ">= 0"
      - name: home_lat
        type: number
        source: input
        description: "Home address latitude in decimal degrees"
        constraints: "number in [-90.0, 90.0]"
      - name: home_lng
        type: number
        source: input
        description: "Home address longitude in decimal degrees"
        constraints: "number in [-180.0, 180.0]"
      - name: preferred_language
        type: enum
        source: input
        description: "Client's preferred service language"
        constraints: "one of [EN, ES, FR, ZH, VI, AR]"
      - name: accessibility_needs
        type: array
        source: input
        description: "Accessibility accommodations the client requires"
        constraints: "subset of [WHEELCHAIR, HEARING_LOOP, ASL_INTERPRETER, LARGE_PRINT]"

  - name: Intake
    parent: Client
    common_fields: true
    fields:
      - name: client_id
        type: string
        source: input
        description: "FK -> Client.id; the client whose needs this intake captures"
      - name: presenting_needs
        type: array
        source: input
        description: "Categories the client is presenting for"
        constraints: "non-empty subset of [FOOD, HOUSING, HEALTHCARE, MENTAL_HEALTH, EMPLOYMENT, TRANSPORT, LEGAL_AID, CHILDCARE]"
      - name: urgency
        type: enum
        source: input
        description: "Screening urgency; drives eligibility_score.urgency_multiplier"
        constraints: "one of [ROUTINE, PRIORITY, EMERGENCY]"
      - name: household_size
        type: integer
        source: input
        description: "Number of persons in the client's household"
        constraints: ">= 1"
      - name: disability_flag
        type: boolean
        source: input
        description: "True if the client self-identifies as having a disability"
      - name: status
        type: enum
        source: system
        description: "Intake lifecycle; see §1.2 Intake state machine"
        constraints: "one of [DRAFT, SCREENED, CLOSED]"
        default: "DRAFT"

  - name: ConsentGrant
    parent: Client
    common_fields: true
    fields:
      - name: client_id
        type: string
        source: input
        description: "FK -> Client.id; the client granting consent"
      - name: provider_id
        type: string
        source: input
        description: "FK -> Provider.id; the provider authorized to receive client information"
      - name: scope
        type: enum
        source: input
        description: "Data scope authorized to flow to the provider"
        constraints: "one of [BASIC_CONTACT, FULL_CASE_FILE, HEALTHCARE_HIPAA]"
      - name: granted_at
        type: datetime
        source: system
        description: "Timestamp of grant creation from the logical clock"
      - name: expires_at
        type: datetime
        source: computed
        description: "granted_at + 90 days exactly; ConsentGrant auto-transitions GRANTED → EXPIRED when clock >= expires_at"
      - name: status
        type: enum
        source: system
        description: "Consent lifecycle; see §1.2 ConsentGrant state machine"
        constraints: "one of [GRANTED, REVOKED, EXPIRED]"
        default: "GRANTED"

  - name: Referral
    parent: Intake
    common_fields: true
    fields:
      - name: intake_id
        type: string
        source: input
        description: "FK -> Intake.id; the source intake"
      - name: program_id
        type: string
        source: input
        description: "FK -> Program.id; the target program"
      - name: consent_grant_id
        type: string
        source: input
        description: "FK -> ConsentGrant.id; the consent authorizing information exchange with the program's provider"
      - name: transport_mode
        type: enum
        source: input
        description: "Mode used to compute travel burden variants"
        constraints: "one of [PUBLIC_TRANSIT, CAR, WALKING, AGENCY_SHUTTLE]"
      - name: travel_burden_naive_min
        type: number
        source: computed
        description: "Minutes computed by calc travel_burden_minutes variant NAIVE_STRAIGHT_LINE"
      - name: travel_burden_routed_min
        type: number
        source: computed
        description: "Minutes computed by calc travel_burden_minutes variant ROUTED_TRAVEL_TIME"
      - name: eligibility_score
        type: number
        source: computed
        description: "Weighted score at creation from calc eligibility_score; referral creation requires score >= 75.0 (see priority 22)"
      - name: provisional_cost_cents
        type: integer
        source: computed
        description: "Provisional variant of calc service_cost_estimate at referral creation; equals program.unit_cost_cents at creation time"
      - name: status
        type: enum
        source: system
        description: "Referral lifecycle; see §1.2 Referral state machine"
        constraints: "one of [PROPOSED, ACCEPTED, DECLINED, SERVICE_IN_PROGRESS, COMPLETED_SUCCESS, COMPLETED_UNSUCCESSFUL, WITHDRAWN]"
        default: "PROPOSED"

  - name: TransportPlan
    parent: Referral
    common_fields: true
    fields:
      - name: referral_id
        type: string
        source: input
        description: "FK -> Referral.id; the referral this plan supports"
      - name: pickup_start_ts
        type: datetime
        source: input
        description: "Pickup window start (inclusive) in ISO 8601 UTC"
      - name: pickup_end_ts
        type: datetime
        source: input
        description: "Pickup window end (inclusive); [pickup_start_ts, pickup_end_ts] closed-closed per calc transport_overlap; must be strictly greater than pickup_start_ts"
      - name: mode
        type: enum
        source: input
        description: "Transport delivery mode"
        constraints: "one of [AGENCY_SHUTTLE, RIDESHARE_VOUCHER]"
      - name: cost_cents
        type: integer
        source: input
        description: "Cost of transport in cents (not billed to funder; recorded for provider reconciliation)"
        constraints: ">= 0"
      - name: status
        type: enum
        source: system
        description: "TransportPlan lifecycle; see §1.2 TransportPlan state machine"
        constraints: "one of [SCHEDULED, CANCELLED]"
        default: "SCHEDULED"

  - name: OutcomeReport
    parent: Referral
    common_fields: true
    fields:
      - name: referral_id
        type: string
        source: input
        description: "FK -> Referral.id; the referral being evaluated"
      - name: outcome
        type: enum
        source: input
        description: "Outcome classification"
        constraints: "one of [FULLY_MET, PARTIALLY_MET, UNMET]"
      - name: service_hours
        type: number
        source: input
        description: "Hours of service delivered; drives final cost variant"
        constraints: ">= 0.0"
      - name: follow_up_needed
        type: boolean
        source: input
        description: "True if caseworker follow-up is scheduled"
      - name: service_cost_final_cents
        type: integer
        source: computed
        description: "Final variant of calc service_cost_estimate; charged against Funder.grant_cents_remaining"
      - name: status
        type: enum
        source: system
        description: "OutcomeReport lifecycle; see §1.2 OutcomeReport state machine"
        constraints: "one of [ACTIVE, REVERSED]"
        default: "ACTIVE"

  - name: FunderReport
    parent: Funder
    common_fields: false
    fields:
      - name: funder_id
        type: string
        source: input
        description: "FK -> Funder.id; the funder this report belongs to"
      - name: reporting_period_start
        type: datetime
        source: input
        description: "Inclusive lower bound of the reporting window in ISO 8601 UTC"
      - name: reporting_period_end
        type: datetime
        source: input
        description: "Exclusive upper bound of the reporting window; must be strictly greater than reporting_period_start"
      - name: rounding_variant
        type: enum
        source: input
        description: "Selects calc funder_report_allocation nested-rounding order"
        constraints: "one of [PER_REFERRAL_ROUND_THEN_SUM, SUM_THEN_ROUND]"
      - name: total_referrals
        type: integer
        source: computed
        description: "Count of Referrals whose program.funder_id == this.funder_id AND created_at in [reporting_period_start, reporting_period_end)"
      - name: total_completions
        type: integer
        source: computed
        description: "Count of Referrals in {COMPLETED_SUCCESS, COMPLETED_UNSUCCESSFUL} in the same window"
      - name: total_disbursement_cents
        type: integer
        source: computed
        description: "Waterfall sum from calc funder_report_allocation over all ACTIVE OutcomeReports whose Referral.program.funder_id == this.funder_id AND OutcomeReport.created_at in the reporting window; rounding order per rounding_variant"
      - name: language_breakdown
        type: object
        source: computed
        description: "Map from language enum to count of referrals whose client.preferred_language == that language, over the same window"

# ==========================================================================
# §1.2 State Machine Table
# ==========================================================================
state_machines:
  - entity: Intake
    initial_state: DRAFT
    terminal_states: [CLOSED]
    transitions:
      - from: DRAFT
        to: SCREENED
        trigger: "POST /intakes/{id}/screen"
        actor: Caseworker
        preconditions:
          - "intake.status == DRAFT"
          - "intake.client_id references a Client that exists"
        side_effects:
          - "computes intake.eligibility_summary is not modelled as an entity field but the transition is legal"
          - "sets intake.status = SCREENED"
          - "increments intake.version by 1 and refreshes intake.updated_at"
      - from: SCREENED
        to: DRAFT
        trigger: "POST /intakes/{id}/reopen"
        actor: Caseworker
        preconditions:
          - "intake.status == SCREENED"
          - "no Referral tied to this intake is in {ACCEPTED, SERVICE_IN_PROGRESS}"
        side_effects:
          - "sets intake.status = DRAFT (revision loop)"
          - "increments intake.version by 1 and refreshes intake.updated_at"
        note: "Cycle: SCREENED -> DRAFT re-opens intake for edits; then DRAFT -> SCREENED runs again to re-compute eligibility."
      - from: SCREENED
        to: CLOSED
        trigger: "system: bubble-up from Referral entering terminal state"
        actor: system
        preconditions:
          - "intake.status == SCREENED"
          - "every Referral with intake_id == this.id is in a terminal state {DECLINED, COMPLETED_SUCCESS, COMPLETED_UNSUCCESSFUL, WITHDRAWN}"
          - "at least one Referral exists for this intake"
        side_effects:
          - "sets intake.status = CLOSED"
          - "increments intake.version by 1 and refreshes intake.updated_at"

  - entity: ConsentGrant
    initial_state: GRANTED
    terminal_states: [REVOKED, EXPIRED]
    transitions:
      - from: GRANTED
        to: REVOKED
        trigger: "POST /consent-grants/{id}/revoke"
        actor: Client
        preconditions:
          - "consent_grant.status == GRANTED"
        side_effects:
          - "sets consent_grant.status = REVOKED"
          - "for every Referral with consent_grant_id == this.id AND status in {PROPOSED, ACCEPTED, SERVICE_IN_PROGRESS}: transition Referral -> WITHDRAWN via the same cascade path as POST /referrals/{id}/withdraw (see Referral transitions to WITHDRAWN for their side_effects)"
          - "increments consent_grant.version by 1 and refreshes consent_grant.updated_at"
      - from: GRANTED
        to: EXPIRED
        trigger: "system: clock advance past consent_grant.expires_at"
        actor: system
        preconditions:
          - "consent_grant.status == GRANTED"
          - "current logical clock >= consent_grant.expires_at"
        side_effects:
          - "sets consent_grant.status = EXPIRED"
          - "no cascade to Referrals: EXPIRED consents leave in-flight referrals alone; only the accept transition rejects an expired consent"
          - "increments consent_grant.version by 1 and refreshes consent_grant.updated_at"
        note: "Branching from GRANTED: two divergent terminal states with different side-effect sets."

  - entity: Referral
    initial_state: PROPOSED
    terminal_states: [DECLINED, COMPLETED_SUCCESS, COMPLETED_UNSUCCESSFUL, WITHDRAWN]
    transitions:
      - from: PROPOSED
        to: ACCEPTED
        trigger: "POST /referrals/{id}/accept"
        actor: ProviderStaff
        preconditions:
          - "referral.status == PROPOSED"
          - "consent_grant.status == GRANTED (cross-entity)"
          - "program.intake_posture != CLOSED"
        side_effects:
          - "sets referral.status = ACCEPTED"
          - "increments referral.version by 1 and refreshes referral.updated_at"
      - from: PROPOSED
        to: DECLINED
        trigger: "POST /referrals/{id}/decline"
        actor: ProviderStaff
        preconditions:
          - "referral.status == PROPOSED"
        side_effects:
          - "sets referral.status = DECLINED"
          - "decrements program.capacity_slots_taken by 1 (recompute of calc program_utilization)"
          - "if resulting utilization crosses the RESTRICTED_THRESHOLD_PCT downward, program.intake_posture recomputes (RESTRICTED -> OPEN)"
          - "if resulting utilization crosses the CLOSED_THRESHOLD_PCT downward, program.intake_posture recomputes (CLOSED -> RESTRICTED)"
          - "if this intake now has all referrals terminal AND has at least one referral: Intake auto-transitions SCREENED -> CLOSED (bubble-up)"
          - "increments referral.version by 1 and refreshes referral.updated_at"
      - from: PROPOSED
        to: WITHDRAWN
        trigger: "POST /referrals/{id}/withdraw"
        actor: Client
        preconditions:
          - "referral.status == PROPOSED"
        side_effects:
          - "sets referral.status = WITHDRAWN"
          - "decrements program.capacity_slots_taken by 1 (recompute of calc program_utilization)"
          - "if utilization crosses RESTRICTED_THRESHOLD_PCT downward, program.intake_posture recomputes; likewise for CLOSED_THRESHOLD_PCT"
          - "if this intake now has all referrals terminal: Intake auto-transitions SCREENED -> CLOSED (bubble-up)"
          - "increments referral.version by 1 and refreshes referral.updated_at"
      - from: ACCEPTED
        to: SERVICE_IN_PROGRESS
        trigger: "POST /referrals/{id}/start-service"
        actor: ProviderStaff
        preconditions:
          - "referral.status == ACCEPTED"
          - "consent_grant.status == GRANTED (cross-entity)"
        side_effects:
          - "sets referral.status = SERVICE_IN_PROGRESS"
          - "increments referral.version by 1 and refreshes referral.updated_at"
      - from: ACCEPTED
        to: WITHDRAWN
        trigger: "POST /referrals/{id}/withdraw"
        actor: Client
        preconditions:
          - "referral.status == ACCEPTED"
        side_effects:
          - "sets referral.status = WITHDRAWN"
          - "decrements program.capacity_slots_taken by 1"
          - "if utilization crosses posture thresholds downward, program.intake_posture recomputes"
          - "if this referral has a SCHEDULED TransportPlan: transition TransportPlan SCHEDULED -> CANCELLED (cross-entity cascade)"
          - "if this intake now has all referrals terminal: Intake auto-transitions SCREENED -> CLOSED (bubble-up)"
          - "increments referral.version by 1 and refreshes referral.updated_at"
      - from: SERVICE_IN_PROGRESS
        to: COMPLETED_SUCCESS
        trigger: "POST /referrals/{id}/complete with outcome_class == SUCCESS"
        actor: ProviderStaff
        preconditions:
          - "referral.status == SERVICE_IN_PROGRESS"
        side_effects:
          - "sets referral.status = COMPLETED_SUCCESS"
          - "decrements program.capacity_slots_taken by 1 (recompute of calc program_utilization)"
          - "if utilization crosses posture thresholds downward, program.intake_posture recomputes"
          - "if this intake now has all referrals terminal: Intake auto-transitions SCREENED -> CLOSED (bubble-up)"
          - "increments referral.version by 1 and refreshes referral.updated_at"
      - from: SERVICE_IN_PROGRESS
        to: COMPLETED_UNSUCCESSFUL
        trigger: "POST /referrals/{id}/complete with outcome_class == UNSUCCESSFUL"
        actor: ProviderStaff
        preconditions:
          - "referral.status == SERVICE_IN_PROGRESS"
        side_effects:
          - "sets referral.status = COMPLETED_UNSUCCESSFUL"
          - "decrements program.capacity_slots_taken by 1"
          - "if utilization crosses posture thresholds downward, program.intake_posture recomputes"
          - "if this intake now has all referrals terminal: Intake auto-transitions SCREENED -> CLOSED (bubble-up)"
          - "increments referral.version by 1 and refreshes referral.updated_at"
      - from: SERVICE_IN_PROGRESS
        to: WITHDRAWN
        trigger: "POST /referrals/{id}/withdraw"
        actor: Client
        preconditions:
          - "referral.status == SERVICE_IN_PROGRESS"
        side_effects:
          - "sets referral.status = WITHDRAWN"
          - "decrements program.capacity_slots_taken by 1"
          - "if utilization crosses posture thresholds downward, program.intake_posture recomputes"
          - "if this referral has a SCHEDULED TransportPlan: transition TransportPlan SCHEDULED -> CANCELLED (cross-entity cascade)"
          - "if this intake now has all referrals terminal: Intake auto-transitions SCREENED -> CLOSED (bubble-up)"
          - "increments referral.version by 1 and refreshes referral.updated_at"

  - entity: Program
    initial_state: "intake_posture=OPEN, funder_reporting_posture=OPEN"
    terminal_states: ["funder_reporting_posture=ARCHIVED (per dimension); intake_posture has no terminal state (recomputed continuously)"]
    transitions:
      # ---- Dimension 1: intake_posture (computed from capacity_slots_taken/capacity_slots_total) ----
      - from: "intake_posture=OPEN"
        to: "intake_posture=RESTRICTED"
        trigger: "system: capacity_slots_taken crossing 80% of capacity_slots_total upward"
        actor: system
        preconditions:
          - "program.capacity_slots_taken * 100 >= 80 * program.capacity_slots_total"
          - "program.capacity_slots_taken < program.capacity_slots_total"
        side_effects:
          - "sets program.intake_posture = RESTRICTED"
          - "increments program.version by 1 and refreshes program.updated_at"
      - from: "intake_posture=RESTRICTED"
        to: "intake_posture=OPEN"
        trigger: "system: capacity_slots_taken crossing 80% downward"
        actor: system
        preconditions:
          - "program.capacity_slots_taken * 100 < 80 * program.capacity_slots_total"
        side_effects:
          - "sets program.intake_posture = OPEN"
          - "increments program.version by 1"
      - from: "intake_posture=RESTRICTED"
        to: "intake_posture=CLOSED"
        trigger: "system: capacity_slots_taken reaching capacity_slots_total"
        actor: system
        preconditions:
          - "program.capacity_slots_taken >= program.capacity_slots_total"
        side_effects:
          - "sets program.intake_posture = CLOSED"
          - "increments program.version by 1"
      - from: "intake_posture=CLOSED"
        to: "intake_posture=RESTRICTED"
        trigger: "system: capacity_slots_taken dropping below capacity_slots_total"
        actor: system
        preconditions:
          - "program.capacity_slots_taken < program.capacity_slots_total"
          - "program.capacity_slots_taken * 100 >= 80 * program.capacity_slots_total"
        side_effects:
          - "sets program.intake_posture = RESTRICTED"
          - "increments program.version by 1"
      # ---- Dimension 2: funder_reporting_posture (independent of intake_posture) ----
      - from: "funder_reporting_posture=OPEN"
        to: "funder_reporting_posture=LOCKED"
        trigger: "POST /funders/{id}/reports (report includes at least one OutcomeReport whose Referral.program_id == this.id)"
        actor: PlatformAdmin
        preconditions:
          - "program.funder_reporting_posture == OPEN"
        side_effects:
          - "sets program.funder_reporting_posture = LOCKED"
          - "increments program.version by 1"
      - from: "funder_reporting_posture=LOCKED"
        to: "funder_reporting_posture=ARCHIVED"
        trigger: "system: logical clock crosses next fiscal-year boundary of the program's funder"
        actor: system
        preconditions:
          - "program.funder_reporting_posture == LOCKED"
          - "current logical clock month == funder.fiscal_year_start_month AND current day == 1 (fiscal year rollover)"
        side_effects:
          - "sets program.funder_reporting_posture = ARCHIVED"
          - "resets program.funder_reporting_posture to OPEN for the NEW fiscal year is NOT modelled: ARCHIVED is terminal for this program's current fiscal cycle"
          - "increments program.version by 1"

  - entity: TransportPlan
    initial_state: SCHEDULED
    terminal_states: [CANCELLED]
    transitions:
      - from: SCHEDULED
        to: CANCELLED
        trigger: "system: cascade from Referral WITHDRAWN (see Referral state machine ACCEPTED -> WITHDRAWN and SERVICE_IN_PROGRESS -> WITHDRAWN)"
        actor: system
        preconditions:
          - "transport_plan.status == SCHEDULED"
          - "the parent Referral.status is transitioning to WITHDRAWN"
        side_effects:
          - "sets transport_plan.status = CANCELLED"
          - "increments transport_plan.version by 1 and refreshes transport_plan.updated_at"

  - entity: OutcomeReport
    initial_state: ACTIVE
    terminal_states: [REVERSED]
    transitions:
      - from: ACTIVE
        to: REVERSED
        trigger: "POST /outcome-reports/{id}/reverse"
        actor: PlatformAdmin
        preconditions:
          - "outcome_report.status == ACTIVE"
          - "the OutcomeReport's Referral.program.funder_reporting_posture != ARCHIVED (a fully archived program's outcomes are frozen)"
        side_effects:
          - "sets outcome_report.status = REVERSED"
          - "credits Funder.grant_cents_remaining by outcome_report.service_cost_final_cents (compensating action for the debit at outcome creation) — see calc funder_grant_ledger"
          - "increments outcome_report.version by 1 and refreshes outcome_report.updated_at"

concurrency_rules:
  - rule_id: program-patch-stale-version
    parent_entity: Program
    write_endpoint: "PATCH /programs/{id}"
    occ_field: "expected_program_version"
    description: |
      Editing a Program whose version has advanced since the client last observed
      it is rejected. This captures the case where another writer has just patched
      the program (or a cascaded referral state change has silently bumped
      program.version via a capacity_slots_taken recompute) and the current
      writer's view of the program is therefore stale.
    error_id: ERR_STALE_PROGRAM_VERSION
    http_status: 412

# ==========================================================================
# §1.3 Calculation Rules Table
# ==========================================================================
calculations:
  - name: eligibility_score
    trigger: "POST /intakes/{id}/screen (writes per-program map into intake.eligibility_summary is not modelled; the score is materialised on Referral.eligibility_score at POST /intakes/{intake_id}/referrals)"
    algorithm: weighted_scoring
    formula: |
      # inputs pulled at referral-creation time:
      #   c = client, p = program, i = intake, pr = program.provider
      age_years = floor_years_between(c.date_of_birth, current_clock_date)   # integer years, floor
      income_ratio = c.monthly_income_cents / max(p.eligibility_income_max_cents, 1)

      # income_score (nested branches, tiered)
      if income_ratio <= 0.50:
        income_score = 100.0
      elif income_ratio <= 0.80:
        income_score = 75.0
      elif income_ratio <= 1.00:
        income_score = 50.0
      else:
        income_score = 0.0

      # age_score (inclusive at both bounds)
      if p.eligibility_age_min <= age_years <= p.eligibility_age_max:
        age_score = 100.0
      else:
        age_score = 0.0

      # category_score (need <-> program category)
      if p.category in i.presenting_needs:
        category_score = 100.0
      else:
        category_score = 0.0

      # language_match (100 if client language served by provider, else 50)
      if c.preferred_language in pr.languages_supported:
        language_match = 100.0
      else:
        language_match = 50.0

      # accessibility_match (100 if client's needs are a subset of provider features; 0 otherwise)
      if set(c.accessibility_needs).issubset(set(pr.accessibility_features)):
        accessibility_match = 100.0
      else:
        accessibility_match = 0.0

      # urgency multiplier
      urgency_multiplier = {ROUTINE: 1.00, PRIORITY: 1.20, EMERGENCY: 1.50}[i.urgency]

      # weighted sum then multiplier (evaluation order pinned; see mode-a note below)
      weighted = (0.30*income_score + 0.20*age_score + 0.25*category_score
                  + 0.15*language_match + 0.10*accessibility_match)
      eligibility_score = round_half_up(weighted * urgency_multiplier, 2)
    input_set: "Client, Intake, Program, Provider fields listed above; NO Referral-history inputs."
    constants:
      INCOME_BAND_1: 0.50
      INCOME_BAND_2: 0.80
      INCOME_BAND_3: 1.00
      WEIGHT_INCOME: 0.30
      WEIGHT_AGE: 0.20
      WEIGHT_CATEGORY: 0.25
      WEIGHT_LANGUAGE: 0.15
      WEIGHT_ACCESSIBILITY: 0.10
      URGENCY_MULT_ROUTINE: 1.00
      URGENCY_MULT_PRIORITY: 1.20
      URGENCY_MULT_EMERGENCY: 1.50
      REFERRAL_ACCEPT_THRESHOLD: 75.0
    precision: "2 decimal places, round_half_up"
    variants:
      - name: score
        when: "single formula; combinatorial mode (a) — >=3 inputs with nested conditional branches and tiered branches"
        difference: "n/a — single evaluation; feeds validation ERR_ELIGIBILITY_BELOW_THRESHOLD at referral creation"

  - name: travel_burden_minutes
    trigger: "POST /intakes/{intake_id}/referrals — computes BOTH variants and writes them to Referral.travel_burden_naive_min and Referral.travel_burden_routed_min in the same request"
    algorithm: forward_looking
    formula: |
      # dist_deg = sum of absolute latitude and longitude deltas in degrees
      dist_deg = abs(client.home_lat - provider.location_lat) + abs(client.home_lng - provider.location_lng)

      # variant NAIVE_STRAIGHT_LINE:
      naive_km    = dist_deg * 111.0
      naive_min   = round_half_up((naive_km / SPEED_KPH[transport_mode]) * 60.0, 2)

      # variant ROUTED_TRAVEL_TIME:
      routed_km   = dist_deg * 111.0 * WINDING_FACTOR       # 1.35
      routed_min  = round_half_up((routed_km / SPEED_KPH[transport_mode]) * 60.0, 2)
    input_set: "Client.home_lat/lng, Provider.location_lat/lng, Referral.transport_mode. Client entity domain (paired with Referral entity)."
    constants:
      SPEED_KPH_PUBLIC_TRANSIT: 25.0
      SPEED_KPH_CAR: 40.0
      SPEED_KPH_WALKING: 5.0
      SPEED_KPH_AGENCY_SHUTTLE: 20.0
      WINDING_FACTOR: 1.35
      DEG_TO_KM: 111.0
    precision: "2 decimal places, round_half_up"
    variants:
      - name: NAIVE_STRAIGHT_LINE
        when: "Written to Referral.travel_burden_naive_min at referral creation"
        difference: "No winding factor applied; distance is the raw sum-of-absolute-deltas × 111km/deg"
      - name: ROUTED_TRAVEL_TIME
        when: "Written to Referral.travel_burden_routed_min at referral creation"
        difference: "Applies WINDING_FACTOR = 1.35 to distance before the /speed*60 step; produces a strictly larger value than NAIVE for the same inputs"

  - name: service_cost_estimate
    trigger: "PROVISIONAL variant runs at POST /intakes/{intake_id}/referrals (writes Referral.provisional_cost_cents). FINAL variant runs at POST /referrals/{id}/outcome-reports (writes OutcomeReport.service_cost_final_cents). Different entity domains: Referral vs OutcomeReport."
    algorithm: forward_looking
    formula: |
      # PROVISIONAL variant (at referral creation):
      provisional_cost_cents = program.unit_cost_cents        # baseline estimate; no service_hours yet

      # FINAL variant (at outcome-report creation):
      # raw_ratio depends on outcome AND service_hours:
      if outcome_report.outcome == UNMET:
        raw_ratio = 0.50
      else:  # PARTIALLY_MET or FULLY_MET
        raw_ratio = 0.50 + (outcome_report.service_hours * 0.10)   # unbounded; typical range 0.50 – 1.50 for 0–10 hours

      raw_cents = program.unit_cost_cents * raw_ratio          # floating point
      service_cost_final_cents = round_half_up(raw_cents, 0)   # integer cents; single-rounding at outcome time
    input_set: "Referral.program (for provisional); OutcomeReport.outcome, OutcomeReport.service_hours, Referral.program.unit_cost_cents (for final)."
    constants:
      RAW_BASELINE_UNMET: 0.50
      RAW_BASELINE_MET: 0.50
      RAW_HOURS_COEFFICIENT: 0.10
    precision: "PROVISIONAL: integer cents (no rounding — unit_cost_cents is already integer). FINAL: integer cents, round_half_up on the last step."
    variants:
      - name: PROVISIONAL_AT_REFERRAL
        when: "POST /intakes/{intake_id}/referrals — Referral entity domain"
        difference: "Ignores outcome and service_hours; simply mirrors program.unit_cost_cents"
      - name: FINAL_AT_OUTCOME
        when: "POST /referrals/{id}/outcome-reports — OutcomeReport entity domain"
        difference: "Uses outcome-class and service_hours to compute raw_ratio, then rounds once; can be strictly less than, equal to, or strictly greater than the provisional value"

  - name: program_utilization
    trigger: "system: any Referral creation OR any transition that changes Referral.status; also read by POST /intakes/{intake_id}/referrals validation"
    algorithm: aggregation
    formula: |
      capacity_slots_taken = count(Referral WHERE program_id == this.id
                                   AND status in {PROPOSED, ACCEPTED, SERVICE_IN_PROGRESS})
      utilization_ratio = capacity_slots_taken / capacity_slots_total   # float

      # intake_posture posture assignment (thresholds are ratios, not percentages, evaluated after ratio computation):
      if utilization_ratio >= 1.00:
        intake_posture = CLOSED
      elif utilization_ratio >= 0.80:
        intake_posture = RESTRICTED
      else:
        intake_posture = OPEN
    input_set: "All Referrals for the program; status filter pinned above (PROPOSED, ACCEPTED, SERVICE_IN_PROGRESS)."
    constants:
      RESTRICTED_THRESHOLD_RATIO: 0.80
      CLOSED_THRESHOLD_RATIO: 1.00
    precision: "capacity_slots_taken is integer; utilization_ratio is float (not exposed on any entity); intake_posture is enum."
    variants:
      - name: aggregate
        when: "Only one variant; boundary precision at 80% and 100% is exact-integer count comparison (see Rule 6 boundary_precision_check)"
        difference: "n/a"

  - name: funder_report_allocation
    trigger: "POST /funders/{id}/reports — computes total_disbursement_cents on the new FunderReport"
    algorithm: waterfall_allocation
    formula: |
      # input_set: every OutcomeReport `o` such that
      #   o.status == ACTIVE
      #   o.created_at >= funder_report.reporting_period_start
      #   o.created_at <  funder_report.reporting_period_end
      #   o.referral.program.funder_id == funder_report.funder_id
      # tie-break within input_set: order by OutcomeReport.created_at ASC, then by created_at ASC (never by id)

      # For each such OutcomeReport, recompute the RAW (unrounded, float) service cost from the
      # final formula in calc service_cost_estimate:
      def raw(o):
          program = o.referral.program
          if o.outcome == UNMET:
              return program.unit_cost_cents * 0.50
          else:
              return program.unit_cost_cents * (0.50 + o.service_hours * 0.10)

      if rounding_variant == PER_REFERRAL_ROUND_THEN_SUM:
        # Sum the ALREADY-ROUNDED per-outcome final costs (as stored on the entity)
        total_disbursement_cents = sum(o.service_cost_final_cents for o in input_set)

      elif rounding_variant == SUM_THEN_ROUND:
        # Sum the raw float values first, then apply round_half_up once
        total_raw = sum(raw(o) for o in input_set)
        total_disbursement_cents = round_half_up(total_raw, 0)
    input_set: "See formula. Waterfall over OutcomeReports scoped to funder + period; boundary of period is half-open [start, end)."
    constants:
      HALF_OPEN_LOWER: inclusive
      HALF_OPEN_UPPER: exclusive
    precision: "integer cents; rounding order controlled by rounding_variant"
    variants:
      - name: PER_REFERRAL_ROUND_THEN_SUM
        when: "funder_report.rounding_variant == PER_REFERRAL_ROUND_THEN_SUM"
        difference: "Adds already-rounded integer cents per outcome; each per-outcome rounding introduces up to 0.5-cent error which accumulates over the input set."
      - name: SUM_THEN_ROUND
        when: "funder_report.rounding_variant == SUM_THEN_ROUND"
        difference: "Sums float raw values FIRST, then rounds once at the end — total is off from the PER_REFERRAL variant by up to N * 0.5 cents where N is the count of outcomes with fractional raw. The two totals CAN differ for the same input set (combinatorial mode (b) — nested-rounding order matters)."

  - name: funder_grant_ledger
    trigger: "POST /referrals/{id}/outcome-reports (debit); POST /outcome-reports/{id}/reverse (credit — compensating action, see Rule 9)"
    algorithm: aggregation
    formula: |
      # Recomputed after every outcome-report creation or reversal:
      Funder.grant_cents_remaining =
          Funder.grant_cents_total
          - sum(o.service_cost_final_cents for every OutcomeReport o
                where o.status == ACTIVE
                  AND o.referral.program.funder_id == Funder.id)
      # Invariant: after any (create outcome, reverse outcome) pair on the same OutcomeReport,
      # Funder.grant_cents_remaining returns to the exact integer cents value it held before the create.
    input_set: "All ACTIVE OutcomeReports whose referral.program.funder_id == this.id."
    constants: {}
    precision: "integer cents"
    variants:
      - name: ledger
        when: "Only one variant"
        difference: "n/a"

# ==========================================================================
# §1.4 Validation Rules Table (Ordered by Priority)
# ==========================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role header is present and one of [PlatformAdmin, Caseworker, ProviderStaff, Client, FunderReporter]; X-User-ID header is present"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "Role is permitted for the endpoint per §1.7"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "Funder in path resolves to an existing Funder"
    error_id: ERR_FUNDER_NOT_FOUND
    http_status: 404
    applies_to: "GET /funders/{id}, GET /funders/{id}/reports, POST /funders/{id}/reports"

  - priority: 4
    category: existence
    check: "Provider in path resolves to an existing Provider"
    error_id: ERR_PROVIDER_NOT_FOUND
    http_status: 404
    applies_to: "GET /providers/{id}, GET /providers/{id}/programs"

  - priority: 5
    category: existence
    check: "Program in path resolves to an existing Program"
    error_id: ERR_PROGRAM_NOT_FOUND
    http_status: 404
    applies_to: "GET /programs/{id}, PATCH /programs/{id}, POST /programs/{id}/availability-windows, GET /programs/{id}/availability-windows"

  - priority: 6
    category: existence
    check: "Client in path resolves to an existing Client"
    error_id: ERR_CLIENT_NOT_FOUND
    http_status: 404
    applies_to: "GET /clients/{id}, POST /clients/{id}/intakes, POST /clients/{id}/consent-grants"

  - priority: 7
    category: existence
    check: "Intake in path resolves to an existing Intake"
    error_id: ERR_INTAKE_NOT_FOUND
    http_status: 404
    applies_to: "POST /intakes/{id}/screen, POST /intakes/{id}/reopen, POST /intakes/{id}/referrals"

  - priority: 8
    category: existence
    check: "ConsentGrant in path resolves to an existing ConsentGrant"
    error_id: ERR_CONSENT_GRANT_NOT_FOUND
    http_status: 404
    applies_to: "POST /consent-grants/{id}/revoke"

  - priority: 9
    category: existence
    check: "Referral in path resolves to an existing Referral"
    error_id: ERR_REFERRAL_NOT_FOUND
    http_status: 404
    applies_to: "POST /referrals/{id}/accept, POST /referrals/{id}/decline, POST /referrals/{id}/start-service, POST /referrals/{id}/complete, POST /referrals/{id}/withdraw, POST /referrals/{id}/transport-plans, GET /referrals/{id}/transport-plans, POST /referrals/{id}/outcome-reports, GET /referrals/{id}/outcome-reports"

  - priority: 10
    category: existence
    check: "OutcomeReport in path resolves to an existing OutcomeReport"
    error_id: ERR_OUTCOME_REPORT_NOT_FOUND
    http_status: 404
    applies_to: "POST /outcome-reports/{id}/reverse"

  - priority: 11
    category: existence
    check: "Body-referenced foreign keys resolve to existing entities: on POST /programs the provider_id and funder_id must exist; on POST /clients/{id}/consent-grants provider_id must exist; on POST /intakes/{id}/referrals program_id AND consent_grant_id must exist"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "POST /programs, POST /clients/{id}/consent-grants, POST /intakes/{id}/referrals"

  - priority: 12
    category: auth
    check: "For entity_backed roles, X-User-ID matches the resource-owner FK on the target resource: Client acting on Consent/Referral/Client must own it; ProviderStaff acting on Referral/Program/AvailabilityWindow must own the target program's Provider; FunderReporter reading a FunderReport must own the Funder"
    error_id: ERR_OWNERSHIP_VIOLATION
    http_status: 403
    applies_to: "all endpoints whose roles list includes an entity_backed role"

  - priority: 13
    category: state
    check: "Intake.status must be DRAFT for POST /intakes/{id}/screen"
    error_id: ERR_INTAKE_NOT_DRAFT
    http_status: 409
    applies_to: "POST /intakes/{id}/screen"

  - priority: 14
    category: state
    check: "Intake.status must be SCREENED for POST /intakes/{id}/reopen AND POST /intakes/{id}/referrals"
    error_id: ERR_INTAKE_NOT_SCREENED
    http_status: 409
    applies_to: "POST /intakes/{id}/reopen, POST /intakes/{id}/referrals"

  - priority: 15
    category: state
    check: "Referral.status must be PROPOSED for accept/decline; ACCEPTED for start-service; SERVICE_IN_PROGRESS for complete; non-terminal for withdraw"
    error_id: ERR_REFERRAL_INVALID_STATE
    http_status: 409
    applies_to: "POST /referrals/{id}/accept, POST /referrals/{id}/decline, POST /referrals/{id}/start-service, POST /referrals/{id}/complete, POST /referrals/{id}/withdraw"

  - priority: 16
    category: state
    check: "ConsentGrant.status must be GRANTED for POST /consent-grants/{id}/revoke"
    error_id: ERR_CONSENT_ALREADY_TERMINAL
    http_status: 409
    applies_to: "POST /consent-grants/{id}/revoke"

  - priority: 17
    category: state
    check: "OutcomeReport.status must be ACTIVE for POST /outcome-reports/{id}/reverse; AND the report's Referral.program.funder_reporting_posture must not be ARCHIVED"
    error_id: ERR_OUTCOME_ALREADY_REVERSED
    http_status: 409
    applies_to: "POST /outcome-reports/{id}/reverse"

  - priority: 18
    category: state
    check: "Program.intake_posture must not be CLOSED for POST /intakes/{id}/referrals AND for POST /referrals/{id}/accept"
    error_id: ERR_PROGRAM_CLOSED_TO_INTAKE
    http_status: 409
    applies_to: "POST /intakes/{id}/referrals, POST /referrals/{id}/accept"

  - priority: 19
    category: business_safety
    check: "The Referral's ConsentGrant.status must be GRANTED (not REVOKED, not EXPIRED) at POST /referrals/{id}/accept AND at POST /referrals/{id}/start-service (cross-entity — Rule 7 Referral<->ConsentGrant)"
    error_id: ERR_CONSENT_NOT_GRANTED
    http_status: 422
    applies_to: "POST /referrals/{id}/accept, POST /referrals/{id}/start-service"

  - priority: 20
    category: business_safety
    check: "On POST /intakes/{id}/referrals: consent_grant.provider_id must equal program.provider_id AND consent_grant.client_id must equal intake.client_id AND consent_grant.status must be GRANTED"
    error_id: ERR_CONSENT_PROVIDER_MISMATCH
    http_status: 422
    applies_to: "POST /intakes/{id}/referrals"

  - priority: 21
    category: business_referential
    check: "On POST /intakes/{id}/referrals: program.category must be a member of intake.presenting_needs (referential match between intake need vector and program category)"
    error_id: ERR_PROGRAM_CATEGORY_MISMATCH
    http_status: 422
    applies_to: "POST /intakes/{id}/referrals"

  - priority: 22
    category: business_referential
    check: "On POST /intakes/{id}/referrals: eligibility_score (see calc eligibility_score) must be >= REFERRAL_ACCEPT_THRESHOLD (75.0). Boundary is inclusive; score of exactly 75.00 passes."
    error_id: ERR_ELIGIBILITY_BELOW_THRESHOLD
    http_status: 422
    applies_to: "POST /intakes/{id}/referrals"

  - priority: 23
    category: business_constraint
    check: "On POST /intakes/{id}/referrals: floor((current_clock_date - client.date_of_birth) in years) must be in [program.eligibility_age_min, program.eligibility_age_max]"
    error_id: ERR_AGE_INELIGIBLE
    http_status: 422
    applies_to: "POST /intakes/{id}/referrals"

  - priority: 24
    category: business_constraint
    check: "On POST /intakes/{id}/referrals: client.monthly_income_cents <= program.eligibility_income_max_cents (strictly-greater income is rejected; equal passes)"
    error_id: ERR_INCOME_INELIGIBLE
    http_status: 422
    applies_to: "POST /intakes/{id}/referrals"

  - priority: 25
    category: business_temporal
    check: "On POST /programs/{id}/availability-windows: start_ts must be strictly greater than the current logical clock; equal to the clock is rejected (Rule 6 boundary — strict >)"
    error_id: ERR_WINDOW_IN_PAST
    http_status: 422
    applies_to: "POST /programs/{id}/availability-windows"

  - priority: 26
    category: business_temporal
    check: "On POST /programs/{id}/availability-windows: [start_ts, end_ts) must NOT half-open-overlap any existing AvailabilityWindow with the same program_id. Two windows overlap iff a.start_ts < b.end_ts AND b.start_ts < a.end_ts. Adjacent windows sharing an endpoint (a.end_ts == b.start_ts) do NOT overlap (Rule 8 half-open semantics)."
    error_id: ERR_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /programs/{id}/availability-windows"

  - priority: 27
    category: business_temporal
    check: "On POST /referrals/{id}/transport-plans: the new [pickup_start_ts, pickup_end_ts] closed-closed interval must not conflict with any SCHEDULED TransportPlan whose Referral.intake.client_id equals this Referral.intake.client_id. Two plans conflict iff min(gap_before, gap_after) < 30 minutes, where the gap is measured in seconds between the closing endpoint of one interval and the opening endpoint of the other (Rule 8 closed-closed with 30-minute buffer)."
    error_id: ERR_TRANSPORT_OVERLAP
    http_status: 409
    applies_to: "POST /referrals/{id}/transport-plans"

  - priority: 28
    category: business_constraint
    check: "On POST /intakes/{id}/referrals: program.capacity_slots_taken must be strictly less than program.capacity_slots_total; equality means program is full and referral is rejected (Rule 6 boundary — integer zero-remaining)."
    error_id: ERR_CAPACITY_EXHAUSTED
    http_status: 422
    applies_to: "POST /intakes/{id}/referrals"

  - priority: 29
    category: business_fiscal
    check: "On POST /referrals/{id}/outcome-reports: computed service_cost_final_cents <= Funder.grant_cents_remaining (funder must have budget). Exact equality passes."
    error_id: ERR_GRANT_INSUFFICIENT
    http_status: 402
    applies_to: "POST /referrals/{id}/outcome-reports"

  - priority: 30
    category: business_fiscal
    check: "On POST /programs/{id}/availability-windows: the sum of max_slots across all AvailabilityWindows for this program (including the new one) must be <= program.capacity_slots_total"
    error_id: ERR_WINDOW_SLOTS_EXCEED_CAPACITY
    http_status: 422
    applies_to: "POST /programs/{id}/availability-windows"

  - priority: 31
    category: business_temporal
    check: "On POST /funders/{id}/reports: reporting_period_start must be strictly less than reporting_period_end"
    error_id: ERR_REPORTING_PERIOD_INVALID
    http_status: 422
    applies_to: "POST /funders/{id}/reports"

  - priority: 32
    category: state
    check: "On PATCH /programs/{id}: expected_program_version must equal program.version (OCC); if it doesn't, reject with ERR_STALE_PROGRAM_VERSION (see §1.2.1)"
    error_id: ERR_STALE_PROGRAM_VERSION
    http_status: 412
    applies_to: "PATCH /programs/{id}"

# ==========================================================================
# §1.5 API Endpoint Table
# ==========================================================================
endpoints:
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Test-driving endpoint (§1.5 priority ladder rung 3): sets the server's logical clock to a given ISO 8601 UTC instant. Server startup default is 2026-03-01T00:00:00Z; before any set_current_utc call the logical clock reads exactly this default (never wall-clock time). Advancing the clock through a ConsentGrant.expires_at triggers the GRANTED->EXPIRED system transition; advancing through a Funder's fiscal-year rollover advances Program.funder_reporting_posture LOCKED->ARCHIVED."
    roles: [PlatformAdmin]
    code: 200
    input: ["to_iso8601"]
    output: "{ current_utc: string }"
    side_effects:
      - "sets the logical clock to to_iso8601"
      - "system-transitions all GRANTED ConsentGrants whose expires_at <= new clock to EXPIRED"
      - "system-transitions Programs' funder_reporting_posture LOCKED->ARCHIVED if the funder's fiscal_year_start_month/day-1 rollover falls between old and new clock"

  - method: POST
    path: "/funders"
    description: "Register a new Funder."
    roles: [PlatformAdmin]
    code: 201
    input: ["name", "fiscal_year_start_month", "grant_cents_total", "reporting_currency"]
    output: Funder
    side_effects:
      - "creates Funder with grant_cents_remaining = grant_cents_total"

  - method: GET
    path: "/funders/{id}"
    description: "Fetch a single Funder."
    roles: [PlatformAdmin, FunderReporter]
    code: 200
    input: []
    output: Funder
    side_effects: []

  - method: GET
    path: "/funders/{id}/reports"
    description: "List FunderReports for the funder (reverse-reachability for FunderReport.funder_id)."
    roles: [PlatformAdmin, FunderReporter]
    code: 200
    input: ["limit?", "offset?"]
    output: FunderReport[]
    side_effects: []

  - method: POST
    path: "/funders/{id}/reports"
    description: "Generate a new FunderReport aggregating outcomes in [reporting_period_start, reporting_period_end)."
    roles: [PlatformAdmin]
    code: 201
    input: ["reporting_period_start", "reporting_period_end", "rounding_variant"]
    output: FunderReport
    side_effects:
      - "computes total_referrals, total_completions, total_disbursement_cents via calc funder_report_allocation"
      - "for every Program that contributed at least one OutcomeReport to the report: transitions program.funder_reporting_posture OPEN->LOCKED (bumps program.version by 1)"

  - method: POST
    path: "/providers"
    description: "Register a new Provider."
    roles: [PlatformAdmin]
    code: 201
    input: ["legal_name", "location_lat", "location_lng", "accessibility_features", "languages_supported"]
    output: Provider
    side_effects: []

  - method: GET
    path: "/providers/{id}"
    description: "Fetch a single Provider."
    roles: [PlatformAdmin, ProviderStaff, Caseworker]
    code: 200
    input: []
    output: Provider
    side_effects: []

  - method: GET
    path: "/providers/{id}/programs"
    description: "List Programs operated by the provider (reverse-reachability for Program.provider_id)."
    roles: [PlatformAdmin, ProviderStaff, Caseworker]
    code: 200
    input: ["limit?", "offset?"]
    output: Program[]
    side_effects: []

  - method: POST
    path: "/programs"
    description: "Create a new Program under an existing Provider and Funder."
    roles: [PlatformAdmin]
    code: 201
    input: ["provider_id", "funder_id", "category", "eligibility_income_max_cents", "eligibility_age_min", "eligibility_age_max", "unit_cost_cents", "capacity_slots_total"]
    output: Program
    side_effects:
      - "capacity_slots_taken initialised to 0"
      - "intake_posture initialised to OPEN"
      - "funder_reporting_posture initialised to OPEN"

  - method: GET
    path: "/programs/{id}"
    description: "Fetch a single Program."
    roles: [PlatformAdmin, ProviderStaff, Caseworker, Client]
    code: 200
    input: []
    output: Program
    side_effects: []

  - method: GET
    path: "/programs"
    description: "List Programs with optional filters (reverse-reachability for Program.funder_id via funder_id?, and also acceptable filter for provider_id? and category?)."
    roles: [PlatformAdmin, Caseworker]
    code: 200
    input: ["provider_id?", "funder_id?", "category?", "limit?", "offset?"]
    output: Program[]
    side_effects: []

  - method: PATCH
    path: "/programs/{id}"
    description: "Update Program fields; guarded by OCC on program.version (see §1.2.1)."
    roles: [PlatformAdmin]
    code: 200
    input: ["expected_program_version", "eligibility_income_max_cents?", "eligibility_age_min?", "eligibility_age_max?", "unit_cost_cents?", "capacity_slots_total?"]
    output: Program
    side_effects:
      - "increments program.version by 1"
      - "refreshes program.updated_at"

  - method: POST
    path: "/programs/{id}/availability-windows"
    description: "Add an AvailabilityWindow to a Program."
    roles: [ProviderStaff, PlatformAdmin]
    code: 201
    input: ["start_ts", "end_ts", "max_slots"]
    output: AvailabilityWindow
    side_effects: []

  - method: GET
    path: "/programs/{id}/availability-windows"
    description: "List AvailabilityWindows for a Program (reverse-reachability for AvailabilityWindow.program_id)."
    roles: [ProviderStaff, PlatformAdmin, Caseworker]
    code: 200
    input: ["limit?", "offset?"]
    output: AvailabilityWindow[]
    side_effects: []

  - method: POST
    path: "/clients"
    description: "Register a new Client."
    roles: [Caseworker, PlatformAdmin]
    code: 201
    input: ["full_name", "date_of_birth", "monthly_income_cents", "home_lat", "home_lng", "preferred_language", "accessibility_needs"]
    output: Client
    side_effects: []

  - method: GET
    path: "/clients/{id}"
    description: "Fetch a single Client. Client role only for self."
    roles: [Client, Caseworker, PlatformAdmin]
    code: 200
    input: []
    output: Client
    side_effects: []

  - method: POST
    path: "/clients/{id}/intakes"
    description: "Create a new Intake for the client, initial state DRAFT."
    roles: [Caseworker, PlatformAdmin]
    code: 201
    input: ["presenting_needs", "urgency", "household_size", "disability_flag"]
    output: Intake
    side_effects:
      - "creates Intake with status = DRAFT"

  - method: GET
    path: "/intakes/{id}"
    description: "Fetch a single Intake."
    roles: [Caseworker, PlatformAdmin]
    code: 200
    input: []
    output: Intake
    side_effects: []

  - method: GET
    path: "/intakes"
    description: "List Intakes with optional filters (reverse-reachability for Intake.client_id via client_id?)."
    roles: [Caseworker, PlatformAdmin]
    code: 200
    input: ["client_id?", "status?", "limit?", "offset?"]
    output: Intake[]
    side_effects: []

  - method: POST
    path: "/intakes/{id}/screen"
    description: "Screen the intake — Intake DRAFT -> SCREENED."
    roles: [Caseworker, PlatformAdmin]
    code: 200
    input: []
    output: Intake
    side_effects:
      - "sets intake.status = SCREENED"
      - "increments intake.version by 1"

  - method: POST
    path: "/intakes/{id}/reopen"
    description: "Reopen a screened intake — Intake SCREENED -> DRAFT (revision cycle)."
    roles: [Caseworker, PlatformAdmin]
    code: 200
    input: []
    output: Intake
    side_effects:
      - "sets intake.status = DRAFT"
      - "increments intake.version by 1"

  - method: POST
    path: "/clients/{id}/consent-grants"
    description: "Client (or Caseworker on client's behalf) grants consent to a Provider. Initial state GRANTED."
    roles: [Client, Caseworker, PlatformAdmin]
    code: 201
    input: ["provider_id", "scope"]
    output: ConsentGrant
    side_effects:
      - "sets granted_at to current logical clock"
      - "sets expires_at = granted_at + 90 days"
      - "sets status = GRANTED"

  - method: GET
    path: "/consent-grants/{id}"
    description: "Fetch a single ConsentGrant."
    roles: [Client, Caseworker, ProviderStaff, PlatformAdmin]
    code: 200
    input: []
    output: ConsentGrant
    side_effects: []

  - method: GET
    path: "/consent-grants"
    description: "List ConsentGrants with optional filters (reverse-reachability for ConsentGrant.client_id and ConsentGrant.provider_id)."
    roles: [Client, Caseworker, ProviderStaff, PlatformAdmin]
    code: 200
    input: ["client_id?", "provider_id?", "status?", "limit?", "offset?"]
    output: ConsentGrant[]
    side_effects: []

  - method: POST
    path: "/consent-grants/{id}/revoke"
    description: "Client revokes a ConsentGrant. Cascades: all in-flight Referrals under this consent transition WITHDRAWN."
    roles: [Client, PlatformAdmin]
    code: 200
    input: []
    output: ConsentGrant
    side_effects:
      - "sets consent_grant.status = REVOKED"
      - "for every Referral with this consent_grant_id AND status in {PROPOSED, ACCEPTED, SERVICE_IN_PROGRESS}: transitions Referral -> WITHDRAWN, which itself triggers program.capacity_slots_taken decrement AND (if scheduled) TransportPlan -> CANCELLED (Rule 4 cascade)"

  - method: POST
    path: "/intakes/{id}/referrals"
    description: "Create a Referral from an Intake to a Program under a ConsentGrant."
    roles: [Caseworker, PlatformAdmin]
    code: 201
    input: ["program_id", "consent_grant_id", "transport_mode"]
    output: Referral
    side_effects:
      - "computes travel_burden_naive_min and travel_burden_routed_min via calc travel_burden_minutes"
      - "computes eligibility_score via calc eligibility_score"
      - "sets provisional_cost_cents = program.unit_cost_cents (calc service_cost_estimate PROVISIONAL variant)"
      - "sets status = PROPOSED"
      - "increments program.capacity_slots_taken by 1 (calc program_utilization); may cross OPEN->RESTRICTED or RESTRICTED->CLOSED threshold and bump program.version"

  - method: GET
    path: "/referrals/{id}"
    description: "Fetch a single Referral."
    roles: [Caseworker, ProviderStaff, PlatformAdmin]
    code: 200
    input: []
    output: Referral
    side_effects: []

  - method: GET
    path: "/referrals"
    description: "List Referrals with optional filters (reverse-reachability for Referral.intake_id, Referral.program_id, Referral.consent_grant_id)."
    roles: [Caseworker, ProviderStaff, PlatformAdmin]
    code: 200
    input: ["intake_id?", "program_id?", "consent_grant_id?", "status?", "limit?", "offset?"]
    output: Referral[]
    side_effects: []

  - method: POST
    path: "/referrals/{id}/accept"
    description: "Provider accepts the referral — PROPOSED -> ACCEPTED."
    roles: [ProviderStaff, PlatformAdmin]
    code: 200
    input: []
    output: Referral
    side_effects:
      - "sets referral.status = ACCEPTED"
      - "increments referral.version by 1"

  - method: POST
    path: "/referrals/{id}/decline"
    description: "Provider declines the referral — PROPOSED -> DECLINED."
    roles: [ProviderStaff, PlatformAdmin]
    code: 200
    input: []
    output: Referral
    side_effects:
      - "sets referral.status = DECLINED"
      - "decrements program.capacity_slots_taken by 1; may recompute intake_posture (RESTRICTED->OPEN or CLOSED->RESTRICTED)"
      - "if all referrals for the intake are terminal: bubble-up intake.status SCREENED->CLOSED"

  - method: POST
    path: "/referrals/{id}/start-service"
    description: "Provider starts service — ACCEPTED -> SERVICE_IN_PROGRESS."
    roles: [ProviderStaff, PlatformAdmin]
    code: 200
    input: []
    output: Referral
    side_effects:
      - "sets referral.status = SERVICE_IN_PROGRESS"

  - method: POST
    path: "/referrals/{id}/complete"
    description: "Provider completes service — SERVICE_IN_PROGRESS -> COMPLETED_SUCCESS or COMPLETED_UNSUCCESSFUL."
    roles: [ProviderStaff, PlatformAdmin]
    code: 200
    input: ["outcome_class"]
    output: Referral
    side_effects:
      - "sets referral.status = COMPLETED_SUCCESS (if outcome_class == SUCCESS) or COMPLETED_UNSUCCESSFUL (if outcome_class == UNSUCCESSFUL)"
      - "decrements program.capacity_slots_taken by 1; may recompute intake_posture"
      - "if all referrals for the intake are terminal: bubble-up intake.status SCREENED->CLOSED"

  - method: POST
    path: "/referrals/{id}/withdraw"
    description: "Client withdraws the referral. Legal from PROPOSED, ACCEPTED, or SERVICE_IN_PROGRESS."
    roles: [Client, Caseworker, PlatformAdmin]
    code: 200
    input: []
    output: Referral
    side_effects:
      - "sets referral.status = WITHDRAWN"
      - "decrements program.capacity_slots_taken by 1; may recompute intake_posture"
      - "cascades SCHEDULED TransportPlan on this referral -> CANCELLED"
      - "if all referrals for the intake are terminal: bubble-up intake.status SCREENED->CLOSED"

  - method: POST
    path: "/referrals/{id}/transport-plans"
    description: "Create a TransportPlan for the referral."
    roles: [Caseworker, PlatformAdmin]
    code: 201
    input: ["pickup_start_ts", "pickup_end_ts", "mode", "cost_cents"]
    output: TransportPlan
    side_effects: []

  - method: GET
    path: "/referrals/{id}/transport-plans"
    description: "List TransportPlans for the referral (reverse-reachability for TransportPlan.referral_id)."
    roles: [Caseworker, ProviderStaff, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: TransportPlan[]
    side_effects: []

  - method: POST
    path: "/referrals/{id}/outcome-reports"
    description: "File an OutcomeReport against a completed Referral."
    roles: [Caseworker, ProviderStaff, PlatformAdmin]
    code: 201
    input: ["outcome", "service_hours", "follow_up_needed"]
    output: OutcomeReport
    side_effects:
      - "computes service_cost_final_cents via calc service_cost_estimate FINAL variant"
      - "debits Funder.grant_cents_remaining by service_cost_final_cents (calc funder_grant_ledger)"
      - "sets status = ACTIVE"

  - method: GET
    path: "/referrals/{id}/outcome-reports"
    description: "List OutcomeReports for the referral (reverse-reachability for OutcomeReport.referral_id)."
    roles: [Caseworker, ProviderStaff, PlatformAdmin, FunderReporter]
    code: 200
    input: ["limit?", "offset?"]
    output: OutcomeReport[]
    side_effects: []

  - method: POST
    path: "/outcome-reports/{id}/reverse"
    description: "PlatformAdmin reverses an OutcomeReport (compensating action, Rule 9)."
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: OutcomeReport
    side_effects:
      - "sets outcome_report.status = REVERSED"
      - "credits Funder.grant_cents_remaining by outcome_report.service_cost_final_cents"

# ==========================================================================
# §1.6 Error Code Catalog
# ==========================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing / unrecognised"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "role not permitted for the endpoint per §1.7"
  - id: ERR_OWNERSHIP_VIOLATION
    http: 403
    condition: "entity_backed role's X-User-ID does not match the resource-owner FK"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "malformed body, missing required field, or body-referenced FK that does not resolve"
  - id: ERR_FUNDER_NOT_FOUND
    http: 404
    condition: "Funder in path or body does not exist"
  - id: ERR_PROVIDER_NOT_FOUND
    http: 404
    condition: "Provider in path or body does not exist"
  - id: ERR_PROGRAM_NOT_FOUND
    http: 404
    condition: "Program in path or body does not exist"
  - id: ERR_CLIENT_NOT_FOUND
    http: 404
    condition: "Client in path does not exist"
  - id: ERR_INTAKE_NOT_FOUND
    http: 404
    condition: "Intake in path does not exist"
  - id: ERR_CONSENT_GRANT_NOT_FOUND
    http: 404
    condition: "ConsentGrant in path or body does not exist"
  - id: ERR_REFERRAL_NOT_FOUND
    http: 404
    condition: "Referral in path does not exist"
  - id: ERR_OUTCOME_REPORT_NOT_FOUND
    http: 404
    condition: "OutcomeReport in path does not exist"
  - id: ERR_INTAKE_NOT_DRAFT
    http: 409
    condition: "Intake not in DRAFT state for POST /intakes/{id}/screen"
  - id: ERR_INTAKE_NOT_SCREENED
    http: 409
    condition: "Intake not in SCREENED state for POST /intakes/{id}/reopen or POST /intakes/{id}/referrals"
  - id: ERR_REFERRAL_INVALID_STATE
    http: 409
    condition: "Referral not in the state expected by the endpoint (per priority 15 table)"
  - id: ERR_CONSENT_ALREADY_TERMINAL
    http: 409
    condition: "ConsentGrant is REVOKED or EXPIRED — cannot be revoked again"
  - id: ERR_OUTCOME_ALREADY_REVERSED
    http: 409
    condition: "OutcomeReport is REVERSED OR its program's funder_reporting_posture is ARCHIVED"
  - id: ERR_PROGRAM_CLOSED_TO_INTAKE
    http: 409
    condition: "Program.intake_posture == CLOSED at the moment of POST /intakes/{id}/referrals or POST /referrals/{id}/accept"
  - id: ERR_CONSENT_NOT_GRANTED
    http: 422
    condition: "The referenced ConsentGrant is not in GRANTED status at Referral accept / start-service"
  - id: ERR_CONSENT_PROVIDER_MISMATCH
    http: 422
    condition: "On POST /intakes/{id}/referrals: consent_grant.provider_id != program.provider_id OR consent_grant.client_id != intake.client_id"
  - id: ERR_PROGRAM_CATEGORY_MISMATCH
    http: 422
    condition: "program.category not in intake.presenting_needs"
  - id: ERR_ELIGIBILITY_BELOW_THRESHOLD
    http: 422
    condition: "computed eligibility_score < 75.0"
  - id: ERR_AGE_INELIGIBLE
    http: 422
    condition: "client age outside [program.eligibility_age_min, program.eligibility_age_max]"
  - id: ERR_INCOME_INELIGIBLE
    http: 422
    condition: "client.monthly_income_cents > program.eligibility_income_max_cents"
  - id: ERR_WINDOW_IN_PAST
    http: 422
    condition: "AvailabilityWindow.start_ts <= current logical clock"
  - id: ERR_WINDOW_OVERLAP
    http: 409
    condition: "AvailabilityWindow [start,end) half-open overlaps another window on the same program"
  - id: ERR_WINDOW_SLOTS_EXCEED_CAPACITY
    http: 422
    condition: "sum of max_slots across all AvailabilityWindows for the program would exceed program.capacity_slots_total"
  - id: ERR_TRANSPORT_OVERLAP
    http: 409
    condition: "TransportPlan pickup interval violates the 30-minute buffer against another SCHEDULED plan for the same client"
  - id: ERR_CAPACITY_EXHAUSTED
    http: 422
    condition: "program.capacity_slots_taken == program.capacity_slots_total at POST /intakes/{id}/referrals"
  - id: ERR_GRANT_INSUFFICIENT
    http: 402
    condition: "service_cost_final_cents > Funder.grant_cents_remaining at POST /referrals/{id}/outcome-reports"
  - id: ERR_REPORTING_PERIOD_INVALID
    http: 422
    condition: "reporting_period_start >= reporting_period_end on POST /funders/{id}/reports"
  - id: ERR_STALE_PROGRAM_VERSION
    http: 412
    condition: "expected_program_version != program.version on PATCH /programs/{id}"

# ==========================================================================
# §1.7 RBAC Matrix
# ==========================================================================
roles:
  - name: PlatformAdmin
    description: "System operator; unrestricted access."
    identity: opaque
    exclusive_operations:
      - "POST /funders"
      - "POST /providers"
      - "POST /programs"
      - "PATCH /programs/{id}"
      - "POST /funders/{id}/reports"
      - "POST /outcome-reports/{id}/reverse"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "everything else in §1.5 (readable via PlatformAdmin role listing in every endpoint's roles)"

  - name: Caseworker
    description: "Community caseworker who intakes clients and creates referrals."
    identity: opaque
    exclusive_operations:
      - "POST /clients/{id}/intakes (creation)"
      - "POST /intakes/{id}/screen"
      - "POST /intakes/{id}/reopen"
      - "POST /intakes/{id}/referrals"
    shared_operations:
      - "POST /clients (with PlatformAdmin)"
      - "POST /clients/{id}/consent-grants (with Client, PlatformAdmin)"
      - "POST /referrals/{id}/withdraw (with Client, PlatformAdmin)"
      - "POST /referrals/{id}/transport-plans (with PlatformAdmin)"
      - "POST /referrals/{id}/outcome-reports (with ProviderStaff, PlatformAdmin)"
      - "GET endpoints on Client, Intake, Program, Provider, Referral, OutcomeReport, TransportPlan, ConsentGrant, AvailabilityWindow (see each endpoint's roles list)"

  - name: ProviderStaff
    description: "Provider-side staff acting on their own Provider's programs."
    identity: "entity_backed:Provider"
    exclusive_operations:
      - "POST /referrals/{id}/accept"
      - "POST /referrals/{id}/decline"
      - "POST /referrals/{id}/start-service"
      - "POST /referrals/{id}/complete"
    shared_operations:
      - "POST /programs/{id}/availability-windows (with PlatformAdmin)"
      - "POST /referrals/{id}/outcome-reports (with Caseworker, PlatformAdmin)"
      - "GET endpoints on their own Provider and its Programs, and on Referrals whose program.provider_id == this Provider's id"

  - name: Client
    description: "Community client acting on their own resources."
    identity: "entity_backed:Client"
    exclusive_operations:
      - "POST /consent-grants/{id}/revoke (Client OR PlatformAdmin)"
    shared_operations:
      - "POST /clients/{id}/consent-grants (with Caseworker, PlatformAdmin) — X-User-ID must equal client.id"
      - "POST /referrals/{id}/withdraw (with Caseworker, PlatformAdmin) — X-User-ID must equal referral.intake.client_id"
      - "GET /clients/{id} — must equal self"
      - "GET /programs/{id} (read-only browse)"

  - name: FunderReporter
    description: "Funder-side viewer of their own Funder's reports."
    identity: "entity_backed:Funder"
    exclusive_operations: []
    shared_operations:
      - "GET /funders/{id} — X-User-ID must equal funder.id"
      - "GET /funders/{id}/reports — X-User-ID must equal funder.id"
      - "GET /referrals/{id}/outcome-reports (with Caseworker, ProviderStaff, PlatformAdmin) — X-User-ID must equal the outcome report's referral.program.funder_id"
