      - name: safety_hold_cascade_shifts_to_assignments_to_volunteer_hours
        depth: 3
        chain: "BuildSite -> SAFETY_HOLD -> ConstructionShift CANCELLED -> ShiftAssignment CANCELLED -> VolunteerProfile.assigned_hours_committed released"
        grounds:
          - state_machines.BuildSite.readiness_status.READY_TO_BUILD_to_SAFETY_HOLD
          - state_machines.ConstructionShift.status.SCHEDULED_to_CANCELLED
          - state_machines.ShiftAssignment.status.RESERVED_to_CANCELLED
          - calculations.volunteer_hour_capacity_invariant
        distinguishing_aspect: |
          A single safety-posture write on the SITE reaches an entity three hops
          away that the request never names: the shift is cancelled, its
          reservation is cancelled, and the volunteer's
          assigned_hours_committed falls from 8.00 to 0.00 with NO strike
          recorded (no_show_strikes stays 0) — which is exactly what separates
          the cascade path from the no-show path. pre_hold_readiness_status must
          capture READY_TO_BUILD so a later release can restore it.
        test_recipe:
          setup:
            - "BuildSite READY_TO_BUILD with safety_posture CLEAR."
            - "One OPEN ConstructionShift 2026-08-10T08:00Z-16:00Z (duration_hours 8.00, volunteer_slots 1)."
