          team_id: $.data.id
      - call: POST /v1/teams/${team_id}/projects
        payload:
          name: web
          production_branch: main
        as: TeamOwner
        captures:
          project_id: $.data.id
      - call: POST /v1/projects/${project_id}/domains
        payload:
          name: example.com
        as: TeamOwner
        captures:
          dom_id: $.data.id
          dom_v: $.data.version
      - call: POST /v1/domains/${dom_id}/verify
        payload:
          outcome: SUCCESS
        as: Developer
      trigger:
      - call: POST /v1/domains/${dom_id}/reverify
        payload: {}
        as: Developer
        captures:
          err0: $.data.error_id
      - call: PATCH /v1/domains/${dom_id}
        payload:
          name: www.example.com
          expected_domain_version: ${dom_v}
        as: TeamOwner
        captures:
          err: $.data.error_id
      assert:
      - reverify on VERIFIED domain rejected with ERR_INVALID_STATE (loop only from FAILED) — optional intermediate assert
      - PATCH with stale expected_domain_version (${dom_v} captured pre-verify) rejected with ERR_STALE_VERSION, HTTP 412
      - Domain.${dom_id}.name == 'example.com' unchanged
  - name: occ_project_patch_current_version_succeeds_then_stale_fails
    claim_type: optimistic_concurrency
    grounds:
    - concurrency_rules[project-config-stale-version]
    - errors[ERR_STALE_VERSION]
    distinguishing_aspect: 'Happy path then stale path on PATCH /v1/projects/{id}: correct version increments; replaying the same version now
      fails 412.'
    test_recipe:
      setup:
      - Project created (version captured)
      setup_api_calls:
      - call: POST /v1/plan-catalog
        payload:
          tier: PRO
          seat_limit: 10
          included_build_minutes: 300
          build_concurrency_limit: 2
          included_bandwidth_gb: 100
          included_invocations_millions: 5
          bandwidth_tier1_rate_cents_per_gb: 10
          bandwidth_tier2_rate_cents_per_gb: 5
          bandwidth_tier2_threshold_gb: 50
          invocation_rate_cents_per_million: 40
          seat_price_cents_monthly: 0
          overage_build_minute_rate_cents: 5
        as: PlatformAdmin
      - call: POST /v1/teams
        payload:
          name: Acme
          plan_tier: PRO
        as: PlatformAdmin
        captures:
          team_id: $.data.id
      - call: POST /v1/teams/${team_id}/projects
        payload:
          name: web
          production_branch: main
        as: TeamOwner
        captures:
          project_id: $.data.id
          proj_v: $.data.version
      trigger:
      - call: PATCH /v1/projects/${project_id}
        payload:
          preview_protection: NONE
          expected_project_version: ${proj_v}
        as: TeamOwner
        captures:
          proj_v2: $.data.version
      - call: PATCH /v1/projects/${project_id}
        payload:
          preview_protection: TEAM_ONLY
          expected_project_version: ${proj_v}
        as: TeamOwner
        captures:
          err: $.data.error_id
      assert:
      - first PATCH succeeds; version incremented to ${proj_v} + 1
      - second PATCH with stale version rejected with ERR_STALE_VERSION, HTTP 412
      - Project.preview_protection == NONE (first write won)
  - name: certificate_expiry_and_renewal_scheduled_action
    claim_type: scheduled_actions
    grounds:
    - state_machines.Certificate.ACTIVE_to_EXPIRED
    - entities.Certificate.fields.not_after
    distinguishing_aspect: Advancing the logical clock past not_after expires the ACTIVE certificate, suspends the domain, and auto-issues a renewal
      certificate (ISSUING) with auto_renewed_from_id set.
    test_recipe:
      setup:
      - Domain VERIFIED with ACTIVE certificate at clock 2026-09-01; not_after = 2026-11-30 (90 days)
      setup_api_calls:
      - call: POST /v1/plan-catalog
        payload:
          tier: PRO
          seat_limit: 10
          included_build_minutes: 300
          build_concurrency_limit: 2
          included_bandwidth_gb: 100
          included_invocations_millions: 5
          bandwidth_tier1_rate_cents_per_gb: 10
          bandwidth_tier2_rate_cents_per_gb: 5
          bandwidth_tier2_threshold_gb: 50
          invocation_rate_cents_per_million: 40
          seat_price_cents_monthly: 0
          overage_build_minute_rate_cents: 5
        as: PlatformAdmin
      - call: POST /v1/teams
        payload:
          name: Acme
          plan_tier: PRO
        as: PlatformAdmin
        captures:
          team_id: $.data.id
      - call: POST /v1/teams/${team_id}/projects
        payload:
          name: web
          production_branch: main
        as: TeamOwner
        captures:
          project_id: $.data.id
      - call: POST /v1/projects/${project_id}/domains
        payload:
          name: example.com
        as: TeamOwner
        captures:
          dom_id: $.data.id
      - call: POST /v1/domains/${dom_id}/verify
        payload:
          outcome: SUCCESS
        as: Developer
      - call: GET /v1/domains/${dom_id}/certificates
        as: TeamOwner
        captures:
          cert_id: $.data.0.id
      - call: POST /v1/certificates/${cert_id}/complete
        payload: {}
        as: SystemWebhook
      trigger:
      - call: POST /v1/_clock/set_current_utc
        payload:
          to_iso8601: '2026-12-01T00:00:00Z'
        as: PlatformAdmin
      - call: GET /v1/domains/${dom_id}/certificates
        as: TeamOwner
      assert:
      - Certificate.${cert_id}.status == EXPIRED after clock passes not_after
      - Domain.${dom_id}.status == SUSPENDED and certificate_id == null
      - a new Certificate exists with status == ISSUING and auto_renewed_from_id == ${cert_id}
  - name: clock_default_is_fixed_epoch
    claim_type: scheduled_actions
    grounds:
    - entities.Certificate.fields.not_before
    distinguishing_aspect: Before any set_current_utc call, the logical clock reads exactly 2026-09-01T00:00:00Z; a certificate completed before
      any clock set stamps not_before at that default.
    test_recipe:
