          assert:
            - "anchor - ${d1_start} == 2026-09-10T09:00:00.000Z, ${d1_end} == 2026-09-10T13:00:00.000Z and ${d1_status} == ASSIGNED  # 240 minutes for WATER_SERVICE_LINE"
            - "trailing edge minus one minute - ${collide_error} == ERR_CONTRACTOR_WINDOW_CONFLICT with HTTP 422  # 13:44 < 13:00 + 45min = 13:45"
            - "leading edge minus one minute - ${mirror_error} == ERR_CONTRACTOR_WINDOW_CONFLICT with HTTP 422  # candidate window 04:16-08:16, and 09:00 < 08:16 + 45min = 09:01, so the buffer bites on the OTHER end too"
            - "trailing edge exactly - the 13:45 dispatch returns 201: ${d3_status} == ASSIGNED, ${d3_start} == 2026-09-10T13:45:00.000Z and ${d3_end} == 2026-09-10T17:45:00.000Z"
            - "13:44 and 13:45 differ by one minute and land on opposite sides; the first non-conflicting start is exactly existing window_end + TRAVEL_BUFFER_MINUTES"
            - "GET /dispatches?contractor_id=${c_a_id} returns total_count == 2 containing only ${d1_id} and ${d3_id}  # both rejections wrote nothing"
            - "Contractor.${c_a_id}.open_dispatch_count == 2, well under max_open_dispatches 5, so capacity never participated"
            - "Claim.${claim2_id}.status == APPROVED and Claim.${claim4_id}.status == APPROVED, each still at its pre-call version"
            - "Enrollment.${enrollment_id}.annual_benefit_reserved_cents == 456000  # exactly two provisional reservations of 228000; the two refused dispatches reserved nothing"

      - name: campaign_drop_dates_collide_inside_the_partner_spacing_window
        grounds:
          - calculations.campaign_drop_window_conflict
          - validations.drop-window-spacing
          - errors.ERR_DROP_WINDOW_CONFLICT
          - entities.UtilityPartner.fields.min_days_between_drops
          - entities.MarketingCampaign.fields.drop_date
          - state_machines.MarketingCampaign.DRAFT_to_PARTNER_REVIEW
          - endpoints.POST /campaigns/{campaignId}/submission
        distinguishing_aspect: |
          A SECOND, structurally different overlap resource: the contended thing is a PARTNER's household
          contact calendar, measured in whole calendar DAYS rather than minutes, symmetric via abs(), and
          enforced at SUBMISSION rather than at creation - so two conflicting campaigns can happily coexist in
          DRAFT and only collide when the second one is submitted. The status filter is the trap: DRAFT,
          REJECTED and WITHDRAWN siblings are invisible to the rule, so a candidate refused against an
          APPROVED sibling must be accepted once that sibling is withdrawn, at the same drop_date.
        test_recipe:
          setup:
            - "Partner Cascadia Water ACTIVE with min_days_between_drops 21 and max_mailings_per_year 2, and one AVAILABLE product."
            - "Sibling campaign 'Anchor drop' with drop_date 2026-08-05 is submitted by mops-001 and APPROVED by the brand reviewer, so it sits in APPROVED and is visible to the spacing rule."
            - "Candidate A 'Twenty-day follow-up' with drop_date 2026-08-25 (gap_days 20) and candidate B 'Twenty-one-day follow-up' with drop_date 2026-08-26 (gap_days 21) are both created and left in DRAFT, which POST /campaigns permits because the spacing rule is not evaluated at creation."
            - "The clock stands at 2026-08-01T00:00:00.000Z throughout, so no drop date is in the past."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /partners"
              payload: { name: "Cascadia Water", utility_type: "WATER", state_code: "OR", brand_approval_required: true, min_days_between_drops: 21, max_mailings_per_year: 2, rate_filing_required: false, bill_insert_supported: true }
              as: PlatformAdmin
              captures: { partner_id: $.data.id, partner_v1: $.data.version, min_gap: $.data.min_days_between_drops }
            - call: "POST /service-line-products"
              payload: { partner_id: "${partner_id}", name: "Water Line Protect", line_type: "WATER_SERVICE_LINE", ownership_boundary: "CURB_STOP", required_owned_segment: "WATER_CURB_STOP_TO_HOME", monthly_price_cents: 2499, waiting_period_days: 30, per_occurrence_cap_cents: 800000, annual_cap_cents: 1000000, permit_covered: true, restoration_covered_scope: "BASIC_BACKFILL", cap_reset_basis: "ENROLLMENT_ANNIVERSARY" }
              as: PlatformAdmin
              captures: { product_id: $.data.id }
            - call: "POST /partners/${partner_id}/status-changes"
              payload: { target_status: "ACTIVE", reason: "Onboarding complete, product filed.", expected_partner_version: "${partner_v1}" }
              as: PlatformAdmin
            - call: "POST /campaigns"
              payload: { partner_id: "${partner_id}", product_id: "${product_id}", name: "Anchor drop", piece_type: "POSTCARD", drop_date: "2026-08-05", requested_quantity: 500 }
              as: MarketingOps
              as_user_id: "mops-001"
              captures: { anchor_id: $.data.id }
            - call: "POST /campaigns/${anchor_id}/submission"
              payload: { note: "First drop of the quarter." }
              as: MarketingOps
              as_user_id: "mops-001"
              captures: { anchor_status_review: $.data.status }
            - call: "POST /campaigns/${anchor_id}/decision"
              payload: { decision: "APPROVE", decision_note: "Approved as filed.", approved_quantity: 500 }
              as: PartnerBrandReviewer
              as_user_id: "${partner_id}"
              captures: { anchor_status: $.data.status, anchor_drop: $.data.drop_date }
            - call: "POST /campaigns"
              payload: { partner_id: "${partner_id}", product_id: "${product_id}", name: "Twenty-day follow-up", piece_type: "DIRECT_MAIL_LETTER", drop_date: "2026-08-25", requested_quantity: 300 }
              as: MarketingOps
              as_user_id: "mops-001"
              captures: { cand_a_id: $.data.id, cand_a_status_draft: $.data.status }
            - call: "POST /campaigns"
              payload: { partner_id: "${partner_id}", product_id: "${product_id}", name: "Twenty-one-day follow-up", piece_type: "DIRECT_MAIL_LETTER", drop_date: "2026-08-26", requested_quantity: 300 }
              as: MarketingOps
              as_user_id: "mops-001"
              captures: { cand_b_id: $.data.id, cand_b_status_draft: $.data.status }
          trigger:
            - call: "POST /campaigns/${cand_a_id}/submission"
              payload: { note: "Submitting the 20-day follow-up." }
