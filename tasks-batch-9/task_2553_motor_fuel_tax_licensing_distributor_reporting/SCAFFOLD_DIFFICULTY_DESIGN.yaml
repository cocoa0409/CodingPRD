      - name: revoked_and_underbonded_purchaser_prefers_safety_over_fiscal_error
        grounds:
          - validations[priority=100]
          - validations[priority=500]
          - errors[ERR_PURCHASER_LICENSE_INVALID]
          - errors[ERR_PURCHASER_BOND_DEFICIENT]
          - state_machines.Licensee.ACTIVE_to_REVOKED
          - state_machines.BondInstrument.ACTIVE_to_FORFEITED
        distinguishing_aspect: |
          Error-category pair is business_safety (priority 100) versus business_fiscal (priority 500) -
          a different pair from the state/safety instance: a REVOKED distributor purchaser whose bonds
          were forfeited by the revoke cascade fails BOTH the licence check and the
          status-independent deferral-shape bond check on the same request, and the rack removal must be refused with
          ERR_PURCHASER_LICENSE_INVALID, never ERR_PURCHASER_BOND_DEFICIENT.
        test_recipe:
          setup:
            - "One ACTIVE NET-electing SUPPLIER position holder and one terminal."
            - "One DISTRIBUTOR that posted a 1500000 bond, was activated, and was then revoked; the revoke cascade forfeits the bond so posted_bond_cents is 0 and bond_deficiency_cents is the full 1500000."
            - "Clock left at its 2026-08-01T00:00:00Z default."
          setup_api_calls:
            - call: "POST /mft/licensees"
              payload: { legal_name: "Northline Fuel Supply LLC", fein: "41-1000001", license_type: "SUPPLIER", mailing_state: "MN", gross_net_election: "NET" }
              as: LicensingOfficer
              captures: { sup_id: $.data.id, sup_v0: $.data.version }
            - call: "POST /mft/licensees/${sup_id}/bonds"
