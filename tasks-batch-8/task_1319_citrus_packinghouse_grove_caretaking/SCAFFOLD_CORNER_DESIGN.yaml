            - "No SortRun persisted; delivery still READY_TO_SORT with version unchanged (${v4_d_v})"

      - name: acres_treated_grove_boundary
        claim_type: violation_to_error
        grounds: ["validations[priority=10]", "errors[ERR_ACRES_EXCEED_GROVE]"]
        distinguishing_aspect: "acres_treated <= grove.acreage is inclusive: 30.0 on a 30-acre grove is accepted, 30.001 rejected."
