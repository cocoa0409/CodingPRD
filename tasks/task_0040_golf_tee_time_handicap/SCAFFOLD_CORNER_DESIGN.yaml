            - "response.data.error_id == ERR_SLOT_FULL_NO_STANDBY"

      - name: book_slot_already_started_rejected
        claim_type: Temporal validation
        grounds: ["validations[priority=9]", "errors[ERR_SLOT_START_PASSED]"]
        distinguishing_aspect: "Clock advanced to exactly the slot start_utc; booking is rejected with 409 ERR_SLOT_START_PASSED (start at current instant is not strictly after)."
        test_recipe:
          setup: ["Slot start 2026-06-02T09:00:00Z; clock then set to 2026-06-02T09:00:00Z (== start)."]
