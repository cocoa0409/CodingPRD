      - name: campaign_completion_window_day_granularity
        grounds:
          - calculations.campaign_overdue_sweep
          - entities.Campaign.fields.closes_on
          - entities.CampaignCompletion.fields.completion_status
        distinguishing_aspect: |
          Resource: CampaignCompletion (an in-scope slot on a Campaign).
          Semantics: day-granularity closed interval — a completion row whose
          closes_on is exactly == now is NOT overdue (> not >=). Different
          from the bay's half-open [start, end) minute-granularity semantics.
          The test places the clock exactly at closes_on, runs ops, and verifies
          the row is NOT counted overdue; then advances 1 second past and
          re-runs ops to verify it IS counted.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z. Fleet/Truck; Campaign with closes_on = 2026-09-01T00:00:00Z."
            - "A single CampaignCompletion row exists in OPEN status."
            - "Clock advanced to EXACTLY 2026-09-01T00:00:00Z; ops_run fired; row should NOT be overdue."
            - "Clock advanced to 2026-09-01T00:00:01Z; ops_run fired; row SHOULD be overdue."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: UptimeCoordinator
            - call: "POST /fleets"
              payload: { fleet_name: "CmpWin Fleet", home_region: "SE" }
              as: FleetManager
              as_user_id: "fm-cw"
              captures: { fleet_id: $.data.id }
