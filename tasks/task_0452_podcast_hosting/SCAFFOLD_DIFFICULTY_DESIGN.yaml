# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Podcast Hosting & Monetization — 9 rules × ≥2 instances
# Pinned literals computed against §1.3 formulas + constants.
# Clock default before any set_current_utc: 2026-01-01T00:00:00Z.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: placement_estimated_vs_final_cost_diverge
        grounds:
          - calculations.estimated_placement_cost
          - calculations.final_placement_cost
          - entities.AdPlacement.fields.estimated_cost_cents
          - entities.AdPlacement.fields.final_cost_cents
          - state_machines.AdPlacement.INSERTED_to_DELIVERED
        distinguishing_aspect: |
          On the AdPlacement entity domain: estimated_cost_cents uses forecast_impressions=5
          (=> 250) while final_cost_cents uses delivered_impressions=3 (=> 150); identical
          placement, two impression sources, different cents.
        test_recipe:
          setup:
            - "Publisher pub1 with show1 (category TECH, monetization_enabled=true), ACTIVE"
            - "Episode ep1 PUBLISHED, media READY, total_ad_slots=2, offers PRE_ROLL"
            - "Advertiser adv1 with campaign c1 (budget 100000, bid_cpm 50000, targeting TECH, no premium), ACTIVE"
            - "Placement p1 PROPOSED then INSERTED on ep1 PRE_ROLL, forecast_impressions=5, estimated 250 (LOW tier, fill 0 at insert)"
            - "3 counted DownloadEvents attributed to p1 (delivered_impressions=3)"
          setup_api_calls:
            - call: "POST /publishers"
              payload: { name: "Pub One", payout_email: "p1@x.com" }
              as: PlatformAdmin
              captures: { pub1: $.data.id }
            - call: "POST /shows"
              payload: { publisher_id: "${pub1}", title: "Show 1", category: "TECH", monetization_enabled: true }
              as: Publisher
              as_user_id: "${pub1}"
              captures: { show1: $.data.id }
            - call: "POST /shows/${show1}/activate"
              payload: {}
              as: Publisher
              as_user_id: "${pub1}"
            - call: "POST /episodes"
              payload: { show_id: "${show1}", title: "Ep 1", total_ad_slots: 2, offered_positions: ["PRE_ROLL"] }
              as: Publisher
              as_user_id: "${pub1}"
              captures: { ep1: $.data.id }
            - call: "POST /media-assets"
              payload: { episode_id: "${ep1}", source_filename: "a.wav", source_duration_ms: 600000 }
              as: Publisher
              as_user_id: "${pub1}"
              captures: { ma1: $.data.id }
            - call: "POST /media-assets/${ma1}/transcode-start"
              payload: {}
              as: PlatformAdmin
            - call: "POST /media-assets/${ma1}/transcode-result"
              payload: { outcome: "SUCCESS", output_duration_ms: 600000 }
              as: PlatformAdmin
            - call: "POST /episodes/${ep1}/publish"
              payload: {}
              as: Publisher
              as_user_id: "${pub1}"
            - call: "POST /advertisers"
              payload: { name: "Adv One", billing_email: "a1@x.com" }
              as: PlatformAdmin
              captures: { adv1: $.data.id }
            - call: "POST /ad-campaigns"
              payload: { advertiser_id: "${adv1}", name: "C1", budget_cents: 100000, bid_cpm_cents: 50000, targeting_category: "TECH", flight_start: "2026-01-01T00:00:00Z", flight_end: "2026-12-31T00:00:00Z" }
              as: Advertiser
              as_user_id: "${adv1}"
              captures: { c1: $.data.id, c1v: $.data.version }
            - call: "POST /ad-campaigns/${c1}/activate"
              payload: {}
              as: Advertiser
              as_user_id: "${adv1}"
              captures: { c1v2: $.data.version }
            - call: "POST /ad-placements"
              payload: { campaign_id: "${c1}", episode_id: "${ep1}", position: "PRE_ROLL", ad_duration_ms: 30000, forecast_impressions: 5, expected_campaign_version: "${c1v2}" }
              as: Advertiser
              as_user_id: "${adv1}"
              captures: { p1: $.data.id, p1est: $.data.estimated_cost_cents }
            - call: "POST /ad-placements/${p1}/insert"
              payload: {}
              as: Advertiser
              as_user_id: "${adv1}"
            - call: "POST /download-events"
              payload: { episode_id: "${ep1}", placement_id: "${p1}", client_ip_hash: "h1", user_agent: "ua", bytes_served: 2000000, event_at: "2026-01-01T01:00:00Z" }
              as: PlatformAdmin
            - call: "POST /download-events"
              payload: { episode_id: "${ep1}", placement_id: "${p1}", client_ip_hash: "h2", user_agent: "ua", bytes_served: 2000000, event_at: "2026-01-01T01:00:00Z" }
              as: PlatformAdmin
            - call: "POST /download-events"
              payload: { episode_id: "${ep1}", placement_id: "${p1}", client_ip_hash: "h3", user_agent: "ua", bytes_served: 2000000, event_at: "2026-01-01T01:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /ad-placements/${p1}/reconcile"
              payload: {}
              as: PlatformAdmin
              captures: { p1final: $.data.final_cost_cents }
          assert:
            - "AdPlacement.${p1}.estimated_cost_cents == 250"
            - "AdPlacement.${p1}.delivered_impressions == 3"
            - "AdPlacement.${p1}.final_cost_cents == 150"
            - "AdPlacement.${p1}.final_cost_cents != AdPlacement.${p1}.estimated_cost_cents"

      - name: payout_accrued_vs_settled_diverge
        grounds:
          - calculations.payout_net_payable
          - entities.PayoutStatement.fields.net_payable_cents
          - entities.PayoutStatement.fields.settled_revenue_cents
          - state_machines.AdCampaign.ACTIVE_to_COMPLETED
        distinguishing_aspect: |
          On the PayoutStatement entity domain (different from AdPlacement): net_payable_cents=280
          counts both DELIVERED placements (campaigns COMPLETED + ACTIVE) while settled_revenue_cents=175
          counts only the placement whose campaign is COMPLETED.
        test_recipe:
          setup:
            - "Publisher pubP (revenue_share_pct 0.70) with ACTIVE show showP (TECH, monetization on)"
            - "Episode epP PUBLISHED+READY, total_ad_slots 2, offers PRE_ROLL and POST_ROLL"
            - "Campaign cA (bid_cpm 50000, budget 100000) ACTIVE then COMPLETED; placement pA DELIVERED final 250 (forecast 5, delivered 5)"
            - "Campaign cB (bid_cpm 50000, budget 100000) ACTIVE (not completed); placement pB DELIVERED final 150 (forecast 5, delivered 3)"
            - "Both placements created at clock 2026-03-10, in window [2026-03-01,2026-04-01)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /publishers"
              payload: { name: "Pub P", payout_email: "pp@x.com", revenue_share_pct: 0.70 }
              as: PlatformAdmin
              captures: { pubP: $.data.id }
            - call: "POST /shows"
              payload: { publisher_id: "${pubP}", title: "Show P", category: "TECH", monetization_enabled: true }
              as: Publisher
              as_user_id: "${pubP}"
              captures: { showP: $.data.id }
            - call: "POST /shows/${showP}/activate"
              payload: {}
              as: Publisher
              as_user_id: "${pubP}"
            - call: "POST /episodes"
              payload: { show_id: "${showP}", title: "Ep P1", total_ad_slots: 1, offered_positions: ["PRE_ROLL"] }
              as: Publisher
              as_user_id: "${pubP}"
              captures: { epP: $.data.id }
            - call: "POST /media-assets"
              payload: { episode_id: "${epP}", source_filename: "p.wav", source_duration_ms: 600000 }
              as: Publisher
              as_user_id: "${pubP}"
              captures: { maP: $.data.id }
            - call: "POST /media-assets/${maP}/transcode-start"
              payload: {}
              as: PlatformAdmin
            - call: "POST /media-assets/${maP}/transcode-result"
              payload: { outcome: "SUCCESS", output_duration_ms: 600000 }
              as: PlatformAdmin
            - call: "POST /episodes/${epP}/publish"
              payload: {}
              as: Publisher
              as_user_id: "${pubP}"
            - call: "POST /episodes"
              payload: { show_id: "${showP}", title: "Ep P2", total_ad_slots: 1, offered_positions: ["PRE_ROLL"] }
              as: Publisher
              as_user_id: "${pubP}"
              captures: { epP2: $.data.id }
            - call: "POST /media-assets"
              payload: { episode_id: "${epP2}", source_filename: "p2.wav", source_duration_ms: 600000 }
              as: Publisher
              as_user_id: "${pubP}"
              captures: { maP2: $.data.id }
            - call: "POST /media-assets/${maP2}/transcode-start"
              payload: {}
              as: PlatformAdmin
            - call: "POST /media-assets/${maP2}/transcode-result"
              payload: { outcome: "SUCCESS", output_duration_ms: 600000 }
              as: PlatformAdmin
            - call: "POST /episodes/${epP2}/publish"
              payload: {}
              as: Publisher
              as_user_id: "${pubP}"
            - call: "POST /advertisers"
              payload: { name: "Adv AB", billing_email: "ab@x.com" }
              as: PlatformAdmin
              captures: { advAB: $.data.id }
            - call: "POST /ad-campaigns"
              payload: { advertiser_id: "${advAB}", name: "cA", budget_cents: 100000, bid_cpm_cents: 50000, targeting_category: "TECH", flight_start: "2026-01-01T00:00:00Z", flight_end: "2026-12-31T00:00:00Z" }
              as: Advertiser
              as_user_id: "${advAB}"
              captures: { cA: $.data.id }
            - call: "POST /ad-campaigns/${cA}/activate"
              payload: {}
              as: Advertiser
              as_user_id: "${advAB}"
              captures: { cAv: $.data.version }
            - call: "POST /ad-placements"
              payload: { campaign_id: "${cA}", episode_id: "${epP}", position: "PRE_ROLL", ad_duration_ms: 30000, forecast_impressions: 5, expected_campaign_version: "${cAv}" }
              as: Advertiser
              as_user_id: "${advAB}"
              captures: { pA: $.data.id }
            - call: "POST /ad-placements/${pA}/insert"
              payload: {}
              as: Advertiser
              as_user_id: "${advAB}"
            - call: "POST /download-events"
              payload: { episode_id: "${epP}", placement_id: "${pA}", client_ip_hash: "a1", user_agent: "ua", bytes_served: 2000000, event_at: "2026-03-10T01:00:00Z" }
              as: PlatformAdmin
            - call: "POST /download-events"
              payload: { episode_id: "${epP}", placement_id: "${pA}", client_ip_hash: "a2", user_agent: "ua", bytes_served: 2000000, event_at: "2026-03-10T01:00:00Z" }
              as: PlatformAdmin
            - call: "POST /download-events"
              payload: { episode_id: "${epP}", placement_id: "${pA}", client_ip_hash: "a3", user_agent: "ua", bytes_served: 2000000, event_at: "2026-03-10T01:00:00Z" }
              as: PlatformAdmin
            - call: "POST /download-events"
              payload: { episode_id: "${epP}", placement_id: "${pA}", client_ip_hash: "a4", user_agent: "ua", bytes_served: 2000000, event_at: "2026-03-10T01:00:00Z" }
              as: PlatformAdmin
            - call: "POST /download-events"
              payload: { episode_id: "${epP}", placement_id: "${pA}", client_ip_hash: "a5", user_agent: "ua", bytes_served: 2000000, event_at: "2026-03-10T01:00:00Z" }
              as: PlatformAdmin
            - call: "POST /ad-placements/${pA}/reconcile"
              payload: {}
              as: PlatformAdmin
            - call: "POST /ad-campaigns/${cA}/complete"
              payload: {}
              as: Advertiser
              as_user_id: "${advAB}"
            - call: "POST /ad-campaigns"
              payload: { advertiser_id: "${advAB}", name: "cB", budget_cents: 100000, bid_cpm_cents: 50000, targeting_category: "TECH", flight_start: "2026-01-01T00:00:00Z", flight_end: "2026-12-31T00:00:00Z" }
              as: Advertiser
              as_user_id: "${advAB}"
              captures: { cB: $.data.id }
            - call: "POST /ad-campaigns/${cB}/activate"
              payload: {}
              as: Advertiser
              as_user_id: "${advAB}"
              captures: { cBv: $.data.version }
            - call: "POST /ad-placements"
              payload: { campaign_id: "${cB}", episode_id: "${epP2}", position: "PRE_ROLL", ad_duration_ms: 30000, forecast_impressions: 5, expected_campaign_version: "${cBv}" }
              as: Advertiser
              as_user_id: "${advAB}"
              captures: { pB: $.data.id }
            - call: "POST /ad-placements/${pB}/insert"
              payload: {}
              as: Advertiser
              as_user_id: "${advAB}"
            - call: "POST /download-events"
              payload: { episode_id: "${epP2}", placement_id: "${pB}", client_ip_hash: "b1", user_agent: "ua", bytes_served: 2000000, event_at: "2026-03-10T02:00:00Z" }
              as: PlatformAdmin
            - call: "POST /download-events"
              payload: { episode_id: "${epP2}", placement_id: "${pB}", client_ip_hash: "b2", user_agent: "ua", bytes_served: 2000000, event_at: "2026-03-10T02:00:00Z" }
              as: PlatformAdmin
            - call: "POST /download-events"
              payload: { episode_id: "${epP2}", placement_id: "${pB}", client_ip_hash: "b3", user_agent: "ua", bytes_served: 2000000, event_at: "2026-03-10T02:00:00Z" }
              as: PlatformAdmin
            - call: "POST /ad-placements/${pB}/reconcile"
              payload: {}
              as: PlatformAdmin
          trigger:
            - call: "POST /payout-statements"
              payload: { publisher_id: "${pubP}", period_start: "2026-03-01T00:00:00Z", period_end: "2026-04-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { ps: $.data.id }
          assert:
            - "PayoutStatement.${ps}.gross_revenue_cents == 400"
            - "PayoutStatement.${ps}.net_payable_cents == 280"
            - "PayoutStatement.${ps}.settled_revenue_cents == 175"
            - "PayoutStatement.${ps}.net_payable_cents != PayoutStatement.${ps}.settled_revenue_cents"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: estimated_cost_tiered_premium_fillband_mode_a
        grounds:
          - calculations.estimated_placement_cost
          - entities.AdPlacement.fields.estimated_cost_cents
          - entities.Episode.fields.fill_rate
          - state_machines.AdPlacement.PROPOSED_to_INSERTED
        distinguishing_aspect: |
          MODE (a) non-linear: 3 inputs interact — bid_cpm(40000)*forecast(4)/1000=160, ×premium 1.25
          (premium_targeting true), ×MID_FILL_MULT 1.10 (episode fill_rate==0.50 band selected by
          conditional branch) => round_half_up(220.0)=220; floor MIN not binding.
        test_recipe:
          setup:
            - "Show ACTIVE TECH monetized; episode total_ad_slots=2, offers PRE_ROLL+POST_ROLL"
            - "One placement already INSERTED on PRE_ROLL so episode.fill_rate==0.5000 at the trigger insertion"
            - "Trigger campaign cT premium_targeting=true, bid_cpm 40000; trigger placement forecast=4 on POST_ROLL"
          setup_api_calls:
            - call: "POST /publishers"
              payload: { name: "PubC", payout_email: "pc@x.com" }
              as: PlatformAdmin
              captures: { pubC: $.data.id }
            - call: "POST /shows"
              payload: { publisher_id: "${pubC}", title: "ShowC", category: "TECH", monetization_enabled: true }
              as: Publisher
              as_user_id: "${pubC}"
              captures: { showC: $.data.id }
            - call: "POST /shows/${showC}/activate"
              payload: {}
              as: Publisher
              as_user_id: "${pubC}"
            - call: "POST /episodes"
              payload: { show_id: "${showC}", title: "EpC", total_ad_slots: 2, offered_positions: ["PRE_ROLL", "POST_ROLL"] }
              as: Publisher
              as_user_id: "${pubC}"
              captures: { epC: $.data.id }
            - call: "POST /media-assets"
              payload: { episode_id: "${epC}", source_filename: "c.wav", source_duration_ms: 600000 }
              as: Publisher
              as_user_id: "${pubC}"
              captures: { maC: $.data.id }
            - call: "POST /media-assets/${maC}/transcode-start"
              payload: {}
              as: PlatformAdmin
            - call: "POST /media-assets/${maC}/transcode-result"
              payload: { outcome: "SUCCESS", output_duration_ms: 600000 }
              as: PlatformAdmin
            - call: "POST /episodes/${epC}/publish"
              payload: {}
              as: Publisher
              as_user_id: "${pubC}"
            - call: "POST /advertisers"
              payload: { name: "AdvC", billing_email: "ac@x.com" }
              as: PlatformAdmin
              captures: { advC: $.data.id }
            - call: "POST /ad-campaigns"
              payload: { advertiser_id: "${advC}", name: "cFill", budget_cents: 1000000, bid_cpm_cents: 50000, targeting_category: "TECH", flight_start: "2026-01-01T00:00:00Z", flight_end: "2026-12-31T00:00:00Z" }
              as: Advertiser
              as_user_id: "${advC}"
              captures: { cFill: $.data.id }
            - call: "POST /ad-campaigns/${cFill}/activate"
              payload: {}
              as: Advertiser
              as_user_id: "${advC}"
              captures: { cFillv: $.data.version }
            - call: "POST /ad-placements"
              payload: { campaign_id: "${cFill}", episode_id: "${epC}", position: "PRE_ROLL", ad_duration_ms: 30000, forecast_impressions: 5, expected_campaign_version: "${cFillv}" }
              as: Advertiser
              as_user_id: "${advC}"
              captures: { pFill: $.data.id }
            - call: "POST /ad-placements/${pFill}/insert"
              payload: {}
              as: Advertiser
              as_user_id: "${advC}"
            - call: "POST /ad-campaigns"
              payload: { advertiser_id: "${advC}", name: "cT", budget_cents: 1000000, bid_cpm_cents: 40000, targeting_category: "TECH", premium_targeting: true, flight_start: "2026-01-01T00:00:00Z", flight_end: "2026-12-31T00:00:00Z" }
              as: Advertiser
              as_user_id: "${advC}"
              captures: { cT: $.data.id }
            - call: "POST /ad-campaigns/${cT}/activate"
              payload: {}
              as: Advertiser
              as_user_id: "${advC}"
              captures: { cTv: $.data.version }
          trigger:
            - call: "POST /ad-placements"
              payload: { campaign_id: "${cT}", episode_id: "${epC}", position: "POST_ROLL", ad_duration_ms: 30000, forecast_impressions: 4, expected_campaign_version: "${cTv}" }
              as: Advertiser
              as_user_id: "${advC}"
              captures: { pT: $.data.id, pTest: $.data.estimated_cost_cents }
          assert:
            - "Episode.${epC}.fill_rate == 0.5"
            - "AdPlacement.${pT}.estimated_cost_cents == 220"

      - name: payout_rounding_order_per_placement_then_sum_mode_b
        grounds:
          - calculations.payout_gross_revenue
          - calculations.payout_net_payable
          - entities.PayoutStatement.fields.gross_revenue_cents
          - entities.PayoutStatement.fields.net_payable_cents
          - entities.PayoutStatement.fields.platform_fee_cents
        distinguishing_aspect: |
          MODE (b) rounding order: per-placement final_cost_cents (already-rounded ints 250 and 150)
          are SUMMED to gross=400 (NOT summing raw then rounding); then net=round_half_up(400×0.70)=280
          rounded once; platform_fee=400-280=120 as residual so the two sum back to gross.
        test_recipe:
          setup:
            - "Publisher pubR share 0.70; ACTIVE TECH monetized show; two episodes epR1/epR2 each total 1 PRE_ROLL, READY+PUBLISHED"
            - "Two DELIVERED placements (one per episode, both at fill 0.0 LOW tier) final 250 and 150 in window [2026-05-01,2026-06-01) at clock 2026-05-15"
