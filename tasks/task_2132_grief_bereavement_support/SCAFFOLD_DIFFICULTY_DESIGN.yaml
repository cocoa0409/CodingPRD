      - name: outcome_summary_with_empty_baseline_set_is_a_precondition_failure
        grounds:
          - validations[priority=15]
          - errors[ERR_NO_BASELINE_ASSESSMENT]
          - calculations.participant_outcome_delta
          - entities.Participant.fields.baseline_score
        distinguishing_aspect: |
          A different metric and a different endpoint from the minute-axis boundary:
          this is the empty-collection edge on GET
          /bereavement/participants/{id}/outcome-summary, where the participant has
          exactly zero BASELINE Assessments (a NEEDS row does not count) and the read
