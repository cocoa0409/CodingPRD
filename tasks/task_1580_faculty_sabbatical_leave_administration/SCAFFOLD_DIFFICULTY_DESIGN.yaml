            - "Fellowship F1 amount 25000.00 window 2027-01-01..2027-07-03 (183 days >= 182.5) reported+verified FIRST; F2 amount 40000.00 window 2027-06-01..2028-01-01 (214 days) reported+verified SECOND"
            - "3 reviews submitted; 5-course plan approved; cycle closed+allocated (CONSUME 72 -> balance 0); grant SCHEDULED"
