# Seed tables for task 2476 — Optical Laboratory & Prescription Fulfillment
# §1.0–§1.7. §1.8 lives in SCAFFOLD_DIFFICULTY_DESIGN.yaml, §1.9 in SCAFFOLD_CORNER_DESIGN.yaml.

scenario: |
  Generate task harder than expert level!

  2476. Optical Laboratory & Prescription Fulfillment (retail optical laboratory): prescription
  intake with verification against the prescriber record and expiration checking, lens design
  selection across single vision, progressive and specialty with material and coating options,
  frame tracing, layout calculation and edging with pupillary distance and fitting height inputs,
  surfacing operations for prescriptions outside stock inventory with breakage and remake tracking,
  quality inspection against tolerance standards for power, axis, prism and cosmetic defects,
  remake and warranty policy with responsibility assignment between store and lab, turnaround time
  commitments by product tier with expedite handling, insurance benefit application and patient
  portion calculation

domain_name: optical-lab-fulfillment

# Flat topology: every entity owns a top-level collection and children carry FKs in the request
# body, so there is no shared parent path segment. Nested paths exist only for action endpoints
# and read sub-resources of RxOrder.
api_prefix: ""

complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: pricing_engine
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - rate_threshold_triggers
    - optimistic_concurrency

  entity_topology: flat
  state_machine_shape: parallel
  # RxOrder carries two independent state dimensions (fulfillment_status x billing_status) that
  # advance on disjoint endpoint sets; LabJob is cyclic (rework loops) and branching (route fork,
  # fork-join on per-eye inspections); RemakeCase is branching with divergent side-effect sets.

  relationship_patterns:
    - one_to_many          # RxOrder -> FrameLayout / LabJob / SettlementEntry
    - cross_aggregate      # LabJob side effects reach Patient.benefit_used_cents and LensBlankLot
    - polymorphic          # LabOperation binds either machine_id (SURFACING) or bay_id (EDGING)

  role_model: segregation_of_duties
  # The X-User-ID that performed the last COMPLETED LabOperation on a job may not record that
  # job's QualityInspection. Beyond that gate the roles are peers over disjoint resource types.

  consistency_model: immediate

  difficulty_level: beyond_expert
  surface_counts:
    entities: 16
    endpoints: 63
    errors: 72
    calculations: 14
    state_machines: 7
    validations: 71

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }
  pagination_placement: >-
    every response with response_type "array" carries the four pagination_fields inside "meta"
    alongside api_request_id and api_request_timestamp; "data" holds the row array alone

# ---------------------------------------------------------------------------
# §1.1 Entity-Relationship Table
#
# common_fields: true means the entity carries id (server-minted uuid), created_at and updated_at
# (both stamped from the logical clock) and version (integer, starts at 1 on creation and increments
# by exactly 1 on every persisted write to that row, including cascade-driven writes).
# common_fields: false marks an append-only event row: id, created_at and NO version, no updated_at.
# ---------------------------------------------------------------------------

entities:
  - name: Prescriber
    parent: null
    common_fields: true
    kind: resource
    fields:
      - name: npi
        type: string
        source: input
        description: National Provider Identifier printed on the prescriber's license record
        constraints: "exactly 10 digits; unique across Prescriber rows"
      - name: full_name
        type: string
        source: input
        description: prescriber display name
        constraints: "1..120 chars"
      - name: license_state
        type: string
        source: input
        description: two-letter state code of the prescriber's license of record
        constraints: "exactly 2 uppercase letters"
      - name: max_rx_validity_months
        type: integer
        source: input
        description: number of calendar months a prescription written by this prescriber stays valid
        default: 12
        constraints: "1..36"
      - name: status
        type: enum
        source: input
        description: registry standing of the prescriber
        default: ACTIVE
        constraints: "ACTIVE | SUSPENDED | RETIRED"
      - name: verified_rx_count
        type: integer
        source: computed
        description: >-
          count of PrescriptionRecord rows with prescriber_id == this.id AND
          verification_status == VERIFIED; recomputed on every prescription verification-status
          change and on prescriber status cascades

  - name: PrescriptionRecord
    parent: null
    common_fields: true
    kind: resource
    fields:
      - name: prescriber_id
        type: string
        source: input
        description: "FK -> Prescriber.id; prescriber of record for this Rx"
      - name: patient_id
        type: string
        source: input
        description: "FK -> Patient.id; patient the Rx was written for"
      - name: prescriber_npi_claimed
        type: string
        source: input
        description: NPI as printed on the paper Rx; compared against Prescriber.npi during verification
        constraints: "exactly 10 digits"
      - name: prescriber_license_state_claimed
        type: string
        source: input
        description: license state as printed on the paper Rx; compared against Prescriber.license_state
        constraints: "exactly 2 uppercase letters"
      - name: sphere_od
        type: number
        source: input
        description: right-eye sphere power in diopters
        constraints: "-20.00..20.00 in 0.25 steps"
      - name: sphere_os
        type: number
        source: input
        description: left-eye sphere power in diopters
        constraints: "-20.00..20.00 in 0.25 steps"
      - name: cylinder_od
        type: number
        source: input
        description: right-eye cylinder power in diopters
        constraints: "-6.00..6.00 in 0.25 steps"
      - name: cylinder_os
        type: number
        source: input
        description: left-eye cylinder power in diopters
        constraints: "-6.00..6.00 in 0.25 steps"
      - name: axis_od
        type: integer
        source: input
        description: right-eye cylinder axis in degrees
        constraints: "0..180"
      - name: axis_os
        type: integer
        source: input
        description: left-eye cylinder axis in degrees
        constraints: "0..180"
      - name: add_power_od
        type: number
        source: input
        description: right-eye near add power in diopters
        default: 0.00
        constraints: "0.00..4.00 in 0.25 steps"
      - name: add_power_os
        type: number
        source: input
        description: left-eye near add power in diopters
        default: 0.00
        constraints: "0.00..4.00 in 0.25 steps"
      - name: prism_diopter_od
        type: number
        source: input
        description: right-eye prescribed prism in prism diopters
        default: 0.00
        constraints: "0.00..10.00 in 0.25 steps"
      - name: prism_diopter_os
        type: number
        source: input
        description: left-eye prescribed prism in prism diopters
        default: 0.00
        constraints: "0.00..10.00 in 0.25 steps"
      - name: pd_distance_mm
        type: number
        source: input
        description: binocular distance pupillary distance in millimetres
        constraints: "40.0..80.0, one decimal"
      - name: issued_on
        type: string
        source: input
        description: calendar date the Rx was written, YYYY-MM-DD
      - name: expires_at
        type: datetime
        source: computed
        description: >-
          issued_on advanced by Prescriber.max_rx_validity_months calendar months, at
          00:00:00.000Z; day-of-month clamped to the last day of the target month
      - name: verification_status
        type: enum
        source: system
        description: verification state against the prescriber record
        default: UNVERIFIED
        constraints: "UNVERIFIED | VERIFIED | REJECTED"
      - name: verification_note
        type: string
        source: system
        description: free text recorded by the verifying optician or by a cascade; null until set
      - name: verified_at
        type: datetime
        source: system
        description: logical clock at the moment verification_status became VERIFIED; null otherwise
      - name: requires_multifocal
        type: boolean
        source: computed
        description: "true when max(add_power_od, add_power_os) > 0.00"
      - name: resubmit_count
        type: integer
        source: system
        description: number of REJECTED -> UNVERIFIED corrections applied to this Rx
        default: 0

  - name: Patient
    parent: null
    common_fields: true
    kind: resource
    fields:
      - name: full_name
        type: string
        source: input
        description: patient display name
      - name: date_of_birth
        type: string
        source: input
        description: patient date of birth, YYYY-MM-DD
      - name: insurance_plan_id
        type: string
        source: input
        description: "FK -> InsurancePlan.id; null means the patient is self-pay"
      - name: member_number
        type: string
        source: input
        description: member identifier on the insurance plan; null when self-pay
      - name: benefit_period_start
        type: string
        source: input
        description: first day of the patient's 12-month benefit period, YYYY-MM-DD
        default: "2026-01-01"
      - name: benefit_used_cents
        type: integer
        source: computed
        description: >-
          sum of RxOrder.insurance_benefit_cents over RxOrder rows with patient_id == this.id AND
          billing_status IN {BENEFIT_APPLIED, PATIENT_SETTLED, REFUND_DUE} AND
          benefit_applied_at >= benefit_period_start (inclusive) AND
          benefit_applied_at < benefit_period_start + 12 months (exclusive)
        default: 0
      - name: status
        type: enum
        source: input
        description: patient record standing
        default: ACTIVE
        constraints: "ACTIVE | INACTIVE"

  - name: InsurancePlan
    parent: null
    common_fields: true
    kind: configuration
    fields:
      - name: plan_code
        type: string
        source: input
        description: plan identifier code
        constraints: "unique across InsurancePlan rows"
      - name: frame_allowance_cents
        type: integer
        source: input
        description: allowance applied to the FRAME component before coinsurance
        constraints: ">= 0"
      - name: lens_base_allowance_cents
        type: integer
        source: input
        description: allowance applied to the LENS component before coinsurance
        constraints: ">= 0"
      - name: coating_allowance_cents
        type: integer
        source: input
        description: single shared allowance pool consumed by COATING components in waterfall order
        constraints: ">= 0"
      - name: progressive_copay_cents
        type: integer
        source: input
        description: amount subtracted from lens_base_allowance_cents when the design is PROGRESSIVE
        constraints: ">= 0"
      - name: coinsurance_pct
        type: number
        source: input
        description: plan share of each component's uncovered remainder
        constraints: "0.00..1.00, exactly 2 decimals"
      - name: annual_benefit_cap_cents
        type: integer
        source: input
        description: maximum benefit the plan pays per patient per 12-month benefit period
        constraints: ">= 0"
      - name: expedite_covered
        type: boolean
        source: input
        description: when true the expedite fee is paid by the plan instead of the patient
        default: false
      - name: specialty_requires_prior_auth
        type: boolean
        source: input
        description: when true a SPECIALTY design requires a prior_auth_reference at order intake
        default: true

  - name: LensDesign
    parent: null
    common_fields: true
    kind: configuration
    fields:
      - name: design_code
        type: string
        source: input
        description: catalogue code of the lens design
        constraints: "unique across LensDesign rows"
      - name: design_type
        type: enum
        source: input
        description: optical class of the design
        constraints: "SINGLE_VISION | PROGRESSIVE | SPECIALTY"
      - name: material
        type: enum
        source: input
        description: lens material
        constraints: "CR39 | POLYCARBONATE | TRIVEX | HIGH_INDEX_167"
      - name: allowed_coatings
        type: array
        source: input
        description: coatings this design may be ordered with
        constraints: "non-empty subset of {HARDCOAT, AR_STANDARD, AR_PREMIUM, PHOTOCHROMIC, POLARIZED}"
      - name: retail_price_cents
        type: integer
        source: input
        description: lens retail charge before any surfacing surcharge
        constraints: "> 0"
      - name: min_fitting_height_mm
        type: number
        source: input
        description: smallest fitting height the design may be laid out at
        constraints: "8.0..30.0, one decimal"
      - name: min_blank_diameter_mm
        type: number
        source: input
        description: smallest semi-finished blank diameter the design is manufactured in
        constraints: "50.0..85.0, one decimal"
      - name: product_tier
        type: enum
        source: input
        description: turnaround tier the design is promised at
        constraints: "ECONOMY | STANDARD | PREMIUM"
      - name: stock_sku_available
        type: boolean
        source: input
        description: when true finished stock lenses exist, so an order may skip surfacing
      - name: base_curve
        type: number
        source: input
        description: nominal front base curve in diopters
        constraints: "0.5..10.0"

  - name: LensBlankLot
    parent: null
    common_fields: true
    kind: resource
    fields:
      - name: lens_design_id
        type: string
        source: input
        description: "FK -> LensDesign.id; design the semi-finished blanks in this lot belong to"
      - name: blank_sku
        type: string
        source: input
        description: supplier SKU of the semi-finished blank
      - name: diameter_mm
        type: number
        source: input
        description: uncut diameter of every blank in this lot
        constraints: "50.0..85.0, one decimal"
      - name: received_qty
        type: integer
        source: input
        description: units received; immutable after creation except by replenishment, which adds to it
        constraints: "> 0"
      - name: on_hand_qty
        type: integer
        source: system
        description: units physically on the shelf and not yet allocated to a LabJob
      - name: allocated_qty
        type: integer
        source: system
        description: units reserved by LabJob rows that have not consumed or released them
        default: 0
      - name: consumed_qty
        type: integer
        source: system
        description: units surfaced successfully into a finished lens
        default: 0
      - name: scrapped_qty
        type: integer
        source: system
        description: units destroyed by a reported breakage
        default: 0
      - name: status
        type: enum
        source: system
        description: shelf availability of the lot
        default: AVAILABLE
        constraints: "AVAILABLE | DEPLETED"
      - name: received_on
        type: string
        source: input
        description: date the lot arrived, YYYY-MM-DD; ties in lot ranking break on this field

  - name: RxOrder
    parent: null
    common_fields: true
    kind: resource
    fields:
      - name: patient_id
        type: string
        source: input
        description: "FK -> Patient.id; patient the eyewear is being made for"
      - name: prescription_id
        type: string
        source: input
        description: "FK -> PrescriptionRecord.id; Rx being fulfilled"
      - name: lens_design_id
        type: string
        source: input
        description: "FK -> LensDesign.id; design selected at intake"
      - name: frame_sku
        type: string
        source: input
        description: frame catalogue SKU chosen by the patient
      - name: frame_retail_cents
        type: integer
        source: input
        description: frame retail charge
        constraints: ">= 0"
      - name: requested_coatings
        type: array
        source: input
        description: coatings ordered; may be empty; every member must be in LensDesign.allowed_coatings
      - name: monocular_pd_od_mm
        type: number
        source: input
        description: right-eye monocular pupillary distance used for horizontal decentration
        constraints: "20.0..40.0, one decimal"
      - name: monocular_pd_os_mm
        type: number
        source: input
        description: left-eye monocular pupillary distance used for horizontal decentration
        constraints: "20.0..40.0, one decimal"
      - name: fitting_height_mm
        type: number
        source: input
        description: fitting height measured in the chosen frame
        constraints: "8.0..40.0, one decimal"
      - name: expedite_requested
        type: boolean
        source: input
        description: when true the promised turnaround is compressed and an expedite fee applies
        default: false
      - name: prior_auth_reference
        type: string
        source: input
        description: prior authorization reference required for SPECIALTY designs on plans that demand it
      - name: product_tier
        type: enum
        source: computed
        description: copied from LensDesign.product_tier at intake and frozen on the order
        constraints: "ECONOMY | STANDARD | PREMIUM"
      - name: fulfillment_status
        type: enum
        source: system
        description: production dimension of the order lifecycle
        default: DRAFT
        constraints: "DRAFT | LAYOUT_READY | IN_LAB | LAB_COMPLETE | REMAKE_PENDING | DISPENSED | CANCELLED"
      - name: billing_status
        type: enum
        source: system
        description: money dimension of the order lifecycle, advancing independently of fulfillment_status
        default: PROVISIONAL_QUOTED
        constraints: "PROVISIONAL_QUOTED | BENEFIT_APPLIED | BENEFIT_VOIDED | SELF_PAY_FINAL | PATIENT_SETTLED | REFUND_DUE | CANCELLED_NO_CHARGE"
      - name: quote_variant
        type: enum
        source: system
        description: which variant of order_quote_and_patient_portion produced the persisted money fields
        default: PROVISIONAL
        constraints: "PROVISIONAL | FINAL"
      - name: gross_charge_cents
        type: integer
        source: computed
        description: sum of component charges plus expedite_fee_cents for the active quote variant
      - name: estimated_benefit_cents
        type: integer
        source: computed
        description: uncapped plan benefit projected by the PROVISIONAL variant; informational after FINAL
      - name: insurance_benefit_cents
        type: integer
        source: computed
        description: benefit actually applied after the annual cap waterfall; 0 until benefit application
        default: 0
      - name: patient_portion_cents
        type: integer
        source: computed
        description: "gross_charge_cents - insurance_benefit_cents - lab_writeoff_cents"
      - name: lab_writeoff_cents
        type: integer
        source: computed
        description: amount the lab absorbs under the remake and warranty policy
        default: 0
      - name: patient_paid_cents
        type: integer
        source: system
        description: cumulative amount settled by the patient
        default: 0
      - name: expedite_fee_cents
        type: integer
        source: computed
        description: fee added for a compressed turnaround; 0 when expedite_requested is false
        default: 0
      - name: patient_balance_due_cents
        type: integer
        source: computed
        description: "patient_portion_cents - patient_paid_cents; negative when a refund is owed"
      - name: promised_tat_hours
        type: integer
        source: computed
        description: promised turnaround in whole hours for the active route assumption
      - name: promised_due_at
        type: datetime
        source: computed
        description: "created_at advanced by promised_tat_hours hours, plus any backorder extension"
      - name: tat_commitment_status
        type: enum
        source: system
        description: standing of the turnaround promise
        default: ON_TRACK
        constraints: "ON_TRACK | AT_RISK | BREACHED"
      - name: remake_count
        type: integer
        source: system
        description: number of RemakeCase rows raised against this order
        default: 0
      - name: benefit_applied_at
        type: datetime
        source: system
        description: logical clock at the most recent successful benefit application; null before that
      - name: created_by_optician_id
        type: string
        source: system
        description: X-User-ID of the StoreOptician who created the order

  - name: FrameLayout
    parent: null
    common_fields: true
    kind: resource
    fields:
      - name: rx_order_id
        type: string
        source: input
        description: "FK -> RxOrder.id; order this trace and layout belong to"
      - name: trace_source
        type: enum
        source: input
        description: how the frame shape was captured
        constraints: "DIGITAL_TRACER | MANUAL_CALIPER | CATALOG"
      - name: a_mm
        type: number
        source: input
        description: boxed horizontal lens width of the frame
        constraints: "30.0..70.0, one decimal"
      - name: b_mm
        type: number
        source: input
        description: boxed vertical lens height of the frame
        constraints: "15.0..60.0, one decimal"
      - name: ed_mm
        type: number
        source: input
        description: effective diameter, the longest diagonal of the boxed shape
        constraints: "30.0..80.0, one decimal"
      - name: dbl_mm
        type: number
        source: input
        description: distance between lenses (bridge width)
        constraints: "10.0..30.0, one decimal"
      - name: fitting_height_override_mm
        type: number
        source: input
        description: fitting height to use instead of RxOrder.fitting_height_mm for this trace
        constraints: "8.0..40.0, one decimal"
      - name: effective_fitting_height_mm
        type: number
        source: computed
        description: fitting_height_override_mm when supplied, otherwise RxOrder.fitting_height_mm
      - name: decentration_h_od_mm
        type: number
        source: computed
        description: "abs((a_mm + dbl_mm)/2 - RxOrder.monocular_pd_od_mm)"
      - name: decentration_h_os_mm
        type: number
        source: computed
        description: "abs((a_mm + dbl_mm)/2 - RxOrder.monocular_pd_os_mm)"
      - name: decentration_v_mm
        type: number
        source: computed
        description: "abs(effective_fitting_height_mm - b_mm/2)"
      - name: required_blank_diameter_mm
        type: number
        source: computed
        description: minimum blank diameter that can cut both eyes, per frame_layout_geometry
      - name: layout_status
        type: enum
        source: system
        description: usability of this layout
        default: COMPUTED
        constraints: "COMPUTED | BLANK_TOO_SMALL | SUPERSEDED"

  - name: LabJob
    parent: null
    common_fields: true
    kind: resource
    fields:
      - name: rx_order_id
        type: string
        source: input
        description: "FK -> RxOrder.id; order this job produces lenses for"
      - name: frame_layout_id
        type: string
        source: system
        description: "FK -> FrameLayout.id; the COMPUTED layout the job was opened against"
      - name: blank_lot_id
        type: string
        source: system
        description: "FK -> LensBlankLot.id; lot holding the allocated blank; null for stock routes and after release of the allocation"
      - name: route
        type: enum
        source: computed
        description: production path chosen at job creation
        constraints: "STOCK_EDGE_ONLY | SURFACE_AND_EDGE"
      - name: status
        type: enum
        source: system
        description: production state of the job
        default: QUEUED
        constraints: "QUEUED | SURFACING | SURFACED | EDGING | EDGED | PASSED | RELEASED | REWORK_QUEUED | BLANK_BACKORDER | SCRAPPED"
      - name: rework_cycle_count
        type: integer
        source: system
        description: number of completed inspect-fail loops on this job
        default: 0
      - name: breakage_count
        type: integer
        source: system
        description: number of reported blank breakages on this job
        default: 0
      - name: released_at
        type: datetime
        source: system
        description: logical clock at release; null until RELEASED
      - name: scrap_reason
        type: string
        source: system
        description: why the job reached SCRAPPED; null otherwise

  - name: LabMachine
    parent: null
    common_fields: true
    kind: resource
    fields:
      - name: machine_code
        type: string
        source: input
        description: shop-floor identifier of the machine
        constraints: "unique across LabMachine rows"
      - name: machine_type
        type: enum
        source: input
        description: what the machine does
        constraints: "GENERATOR | POLISHER"
      - name: calibration_buffer_minutes
        type: integer
        source: input
        description: mandatory idle minutes appended to every occupation of this machine
        default: 15
        constraints: "0..120"
      - name: status
        type: enum
        source: input
        description: operational standing of the machine
        default: AVAILABLE
        constraints: "AVAILABLE | CALIBRATION_HOLD | DOWN"

  - name: FinishingBay
    parent: null
    common_fields: true
    kind: resource
    fields:
      - name: bay_code
        type: string
        source: input
        description: shop-floor identifier of the edging bay
        constraints: "unique across FinishingBay rows"
      - name: concurrent_capacity
        type: integer
        source: input
        description: how many overlapping edging occupations the bay supports
        constraints: "1..4"
      - name: status
        type: enum
        source: input
        description: whether the bay accepts new occupations
        default: OPEN
        constraints: "OPEN | CLOSED"

  - name: LabOperation
    parent: null
    common_fields: true
    kind: resource
    fields:
      - name: lab_job_id
        type: string
        source: input
        description: "FK -> LabJob.id; job this operation advances"
      - name: machine_id
        type: string
        source: input
        description: "FK -> LabMachine.id; required for SURFACING, must be null for EDGING"
      - name: bay_id
        type: string
        source: input
        description: "FK -> FinishingBay.id; required for EDGING, must be null for SURFACING"
      - name: blank_lot_id
        type: string
        source: system
        description: "FK -> LensBlankLot.id; copied from LabJob.blank_lot_id for SURFACING, null for EDGING"
      - name: operation_type
        type: enum
        source: input
        description: which shop operation this occupation performs
        constraints: "SURFACING | EDGING"
      - name: window_start
        type: datetime
        source: input
        description: start of the resource occupation, ISO 8601 UTC
      - name: window_end
        type: datetime
        source: input
        description: end of the resource occupation, ISO 8601 UTC
      - name: status
        type: enum
        source: system
        description: lifecycle of the occupation
        default: SCHEDULED
        constraints: "SCHEDULED | RUNNING | COMPLETED | BROKEN | CANCELLED"
      - name: performed_by_user_id
        type: string
        source: system
        description: X-User-ID captured when the operation was started; null while SCHEDULED
      - name: breakage_reason
        type: string
        source: system
        description: reason text recorded when the operation reached BROKEN
      - name: cancel_reason
        type: string
        source: system
        description: reason text recorded when the operation reached CANCELLED

  - name: QualityInspection
    parent: null
    common_fields: false
    kind: event
    fields:
      - name: lab_job_id
        type: string
        source: input
        description: "FK -> LabJob.id; job whose lens was measured"
      - name: tolerance_standard_id
        type: string
        source: system
        description: "FK -> ToleranceStandard.id; standard resolved by tolerance_standard_selection at creation"
      - name: eye
        type: enum
        source: input
        description: which lens of the pair was measured
        constraints: "OD | OS"
      - name: measured_sphere
        type: number
        source: input
        description: measured sphere power in diopters
      - name: measured_cylinder
        type: number
        source: input
        description: measured cylinder power in diopters
      - name: measured_axis
        type: integer
        source: input
        description: measured cylinder axis in degrees
        constraints: "0..180"
      - name: measured_prism
        type: number
        source: input
        description: measured prism in prism diopters
      - name: cosmetic_defect_codes
        type: array
        source: input
        description: >-
          cosmetic findings; array of strings drawn from {MINOR_EDGE_CHIP, DEEP_SCRATCH,
          COATING_CRAZE, INCLUSION, POLISH_HAZE}. Membership is enforced by
          inspection_defect_codes_known at priority 460 (ERR_UNKNOWN_DEFECT_CODE), NOT by the
          structural check at priority 10; defaults to the empty array when omitted
      - name: inspector_user_id
        type: string
        source: system
        description: X-User-ID of the QualityInspector who recorded the measurement
      - name: cycle_index
        type: integer
        source: system
        description: LabJob.rework_cycle_count at the moment the inspection was recorded
      - name: sphere_delta
        type: number
        source: computed
        description: "round(abs(measured_sphere - prescribed sphere for this eye), 2)"
      - name: cylinder_delta
        type: number
        source: computed
        description: "round(abs(measured_cylinder - prescribed cylinder for this eye), 2)"
      - name: axis_delta
        type: integer
        source: computed
        description: "min(abs(d), 360 - abs(d)) where d = measured_axis - prescribed axis for this eye"
      - name: prism_delta
        type: number
        source: computed
        description: "round(abs(measured_prism - prescribed prism for this eye), 2)"
      - name: verdict
        type: enum
        source: computed
        description: PASS when failed_metrics is empty, otherwise FAIL
        constraints: "PASS | FAIL"
      - name: failed_metrics
        type: array
        source: computed
        description: >-
          subset of [SPHERE, CYLINDER, AXIS, PRISM, COSMETIC] emitted in exactly that order,
          listing every metric that exceeded the resolved standard

  - name: ToleranceStandard
    parent: null
    common_fields: true
    kind: configuration
    fields:
      - name: design_type
        type: enum
        source: input
        description: design class the standard governs
        constraints: "SINGLE_VISION | PROGRESSIVE | SPECIALTY"
      - name: power_band_min_abs
        type: number
        source: input
        description: inclusive lower bound of the absolute sphere power band the standard covers
        constraints: ">= 0.00"
      - name: power_band_max_abs
        type: number
        source: input
        description: inclusive upper bound of the absolute sphere power band the standard covers
        constraints: "> power_band_min_abs"
      - name: sphere_tolerance_diopters
        type: number
        source: input
        description: largest permitted sphere deviation
        constraints: "> 0"
      - name: cylinder_tolerance_diopters
        type: number
        source: input
        description: largest permitted cylinder deviation
        constraints: "> 0"
      - name: axis_tolerance_degrees
        type: integer
        source: input
        description: largest permitted axis deviation in degrees
        constraints: "> 0"
      - name: prism_tolerance_pd
        type: number
        source: input
        description: largest permitted prism deviation in prism diopters
        constraints: "> 0"
      - name: allowed_cosmetic_defect_codes
        type: array
        source: input
        description: cosmetic findings that do not fail an inspection; may be empty
      - name: effective_from
        type: string
        source: input
        description: first date the standard may be resolved, YYYY-MM-DD; ranking key for selection

  - name: RemakeCase
    parent: null
    common_fields: true
    kind: resource
    fields:
      - name: lab_job_id
        type: string
        source: input
        description: "FK -> LabJob.id; job being remade"
      - name: quality_inspection_id
        type: string
        source: input
        description: "FK -> QualityInspection.id; failing inspection that evidences the case; null for non-dimensional complaints"
      - name: defect_codes
        type: array
        source: input
        description: >-
          reported defects; members of {POWER_OUT_OF_TOL, AXIS_OUT_OF_TOL, PRISM_OUT_OF_TOL,
          COSMETIC_DEFECT, WRONG_MATERIAL, WRONG_COATING, WRONG_PD, WRONG_FITTING_HEIGHT,
          WRONG_FRAME, PATIENT_NONADAPT, RX_TRANSCRIPTION}
        constraints: "non-empty"
      - name: warranty_claim
        type: boolean
        source: input
        description: whether the store is claiming this remake under warranty
      - name: warranty_covered
        type: boolean
        source: computed
        description: >-
          warranty_claim AND (LabJob.released_at IS NULL OR logical clock <= released_at + 90 days)
      - name: responsibility
        type: enum
        source: system
        description: which party owns the remake cost
        default: UNASSIGNED
        constraints: "UNASSIGNED | STORE | LAB | SPLIT"
      - name: adjudication_method
        type: enum
        source: system
        description: which variant of remake_responsibility_split was applied; null before adjudication
        constraints: "PROCESS_AUDIT | TOLERANCE_DELTA"
      - name: lab_share_pct
        type: integer
        source: computed
        description: percentage of the job cost basis charged to the lab; null before adjudication
        constraints: "0..100"
      - name: lab_chargeback_cents
        type: integer
        source: computed
        description: "round_half_up(job_cost_basis_cents * lab_share_pct / 100)"
        default: 0
      - name: status
        type: enum
        source: system
        description: lifecycle of the remake case
        default: SUBMITTED
        constraints: "SUBMITTED | ADJUDICATED | CLOSED"

  - name: SettlementEntry
    parent: null
    common_fields: false
    kind: event
    fields:
      - name: rx_order_id
        type: string
        source: input
        description: "FK -> RxOrder.id; order this money movement belongs to"
      - name: entry_type
        type: enum
        source: system
        description: which money movement this row records
        constraints: "ORDER_CHARGE | INSURANCE_BENEFIT | BENEFIT_REVERSAL | LAB_WRITEOFF | PATIENT_PAYMENT"
      - name: amount_cents
        type: integer
        source: system
        description: >-
          signed amount; positive increases what the patient owes (ORDER_CHARGE, BENEFIT_REVERSAL),
          negative decreases it (INSURANCE_BENEFIT, LAB_WRITEOFF, PATIENT_PAYMENT)
      - name: memo
        type: string
        source: system
        description: short human-readable reason for the entry
      - name: effective_at
        type: datetime
        source: system
        description: logical clock at the moment the entry was appended

# ---------------------------------------------------------------------------
# §1.2 State Machine Table
# ---------------------------------------------------------------------------

state_machines:
  - entity: PrescriptionRecord
    state_field: verification_status
    shape: "branching with revert plus REJECTED -> UNVERIFIED cycle"
    initial_state: UNVERIFIED
    terminal_states: []
    note: >-
      No terminal state: a rejected Rx may be corrected and resubmitted without bound, and a
      verified Rx may be pulled back to REJECTED when its prescriber loses standing.
    transitions:
      - from: UNVERIFIED
        to: VERIFIED
        trigger: "POST /prescriptions/{id}/verify"
        actor: StoreOptician
        preconditions:
          - "verification_status == UNVERIFIED"
          - "Prescriber(prescriber_id).status == ACTIVE"
          - "prescriber_npi_claimed == Prescriber(prescriber_id).npi"
          - "prescriber_license_state_claimed == Prescriber(prescriber_id).license_state"
        side_effects:
          - "sets verified_at = logical clock"
          - "sets verification_note = request verification_note when supplied"
          - "recomputes Prescriber(prescriber_id).verified_rx_count"
      - from: UNVERIFIED
        to: VERIFIED
        trigger: "POST /prescriptions/{id}/prescriber-attest"
        actor: Prescriber
        preconditions:
          - "verification_status == UNVERIFIED"
          - "X-User-ID == PrescriptionRecord.prescriber_id"
          - "Prescriber(prescriber_id).status == ACTIVE"
        side_effects:
          - "sets verified_at = logical clock"
          - "sets verification_note = attestation_statement"
          - "recomputes Prescriber(prescriber_id).verified_rx_count"
        note: >-
          Self-attestation bypasses the npi/license_state comparison because the acting identity IS
          the prescriber record.
      - from: UNVERIFIED
        to: REJECTED
        trigger: "POST /prescriptions/{id}/reject"
        actor: StoreOptician
        preconditions: ["verification_status == UNVERIFIED"]
        side_effects: ["sets verification_note = request verification_note"]
      - from: VERIFIED
        to: REJECTED
        trigger: "POST /prescriptions/{id}/reject"
        actor: StoreOptician
        preconditions: ["verification_status == VERIFIED"]
        side_effects:
          - "clears verified_at"
          - "recomputes Prescriber(prescriber_id).verified_rx_count"
      - from: VERIFIED
        to: REJECTED
        trigger: "system cascade from PATCH /prescribers/{id}/status when status becomes SUSPENDED or RETIRED"
        actor: system
        preconditions: ["verification_status == VERIFIED"]
        side_effects:
          - "sets verification_note = 'PRESCRIBER_STANDING_LOST'; clears verified_at"
          - "CASCADE HOP 2 of prescriber-standing chain: for every RxOrder with prescription_id == this.id AND fulfillment_status IN {DRAFT, LAYOUT_READY}, the order is cancelled (HOP 3) exactly as POST /rx-orders/{id}/cancel does it"
          - "recomputes Prescriber(prescriber_id).verified_rx_count"
      - from: REJECTED
        to: UNVERIFIED
        trigger: "POST /prescriptions/{id}/resubmit"
        actor: StoreOptician
        preconditions: ["verification_status == REJECTED"]
        side_effects:
          - "increments resubmit_count by 1"
          - "clears verification_note"
          - "applies any corrected_* field supplied and recomputes expires_at from the resulting issued_on"

  - entity: RxOrder
    state_field: fulfillment_status
    shape: "branching plus REMAKE_PENDING -> IN_LAB cycle; independent of billing_status"
    initial_state: DRAFT
    terminal_states: [DISPENSED, CANCELLED]
    transitions:
      - from: DRAFT
        to: LAYOUT_READY
        trigger: "POST /frame-layouts"
        actor: StoreOptician
        preconditions:
          - "fulfillment_status IN {DRAFT, LAYOUT_READY}"
          - "expected_rx_order_version == RxOrder.version"
        side_effects:
          - "creates FrameLayout with computed geometry per frame_layout_geometry, whose layout_status is COMPUTED or BLANK_TOO_SMALL"
          - "sets layout_status = SUPERSEDED on every earlier FrameLayout of this order"
          - "increments RxOrder.version by 1"
        note: >-
          LAYOUT_READY means "the order has a layout of record", not "the layout is usable". A
          BLANK_TOO_SMALL layout still advances the order; usability is enforced later by
          job_layout_usable on POST /lab-jobs.
      - from: LAYOUT_READY
        to: LAYOUT_READY
        trigger: "POST /frame-layouts (retrace)"
        actor: StoreOptician
        preconditions:
          - "fulfillment_status == LAYOUT_READY"
          - "expected_rx_order_version == RxOrder.version"
        side_effects:
          - "creates the new FrameLayout and supersedes every earlier one"
          - "increments RxOrder.version by 1"
      - from: LAYOUT_READY
        to: IN_LAB
        trigger: "POST /lab-jobs"
        actor: LabTechnician
        preconditions:
          - "fulfillment_status IN {LAYOUT_READY, REMAKE_PENDING}"
          - "the order's newest FrameLayout has layout_status == COMPUTED"
          - "for SURFACE_AND_EDGE route: blank_lot_selection returns a lot"
        side_effects:
          - "creates LabJob in QUEUED with route from lab_route_determination and frame_layout_id set to the newest COMPUTED layout"
          - "for SURFACE_AND_EDGE: allocates one blank (lot.on_hand_qty -= 1, lot.allocated_qty += 1) and sets LabJob.blank_lot_id"
          - "sets lot.status = DEPLETED when the allocation drives lot.on_hand_qty to 0"
          - "recomputes RxOrder.promised_tat_hours and promised_due_at with turnaround_and_expedite_fee variant ROUTE_ACTUAL"
      - from: REMAKE_PENDING
        to: IN_LAB
        trigger: "POST /lab-jobs"
        actor: LabTechnician
        preconditions:
          - "fulfillment_status == REMAKE_PENDING"
          - "the order's newest FrameLayout has layout_status == COMPUTED"
        side_effects:
          - "same as LAYOUT_READY -> IN_LAB"
          - "does NOT reset remake_count and does NOT restore promised_due_at extensions"
      - from: IN_LAB
        to: LAB_COMPLETE
        trigger: "POST /lab-jobs/{id}/release"
        actor: LabTechnician
        preconditions:
          - "the order's newest LabJob has status == PASSED"
          - "fulfillment_status == IN_LAB"
        side_effects:
          - "LabJob -> RELEASED with released_at = logical clock"
          - "for SURFACE_AND_EDGE: lot.allocated_qty -= 1 and lot.consumed_qty += 1"
          - "sets tat_commitment_status = BREACHED when logical clock > promised_due_at, else leaves it unchanged"
      - from: LAB_COMPLETE
        to: REMAKE_PENDING
        trigger: "POST /remake-cases"
        actor: StoreOptician
        preconditions:
          - "fulfillment_status IN {IN_LAB, LAB_COMPLETE}"
          - "remake_count < 2"
          - "no RemakeCase for this job with status IN {SUBMITTED, ADJUDICATED}"
        side_effects:
          - "CASCADE HOP 1 (remake chain): RemakeCase created in SUBMITTED; the linked LabJob moves to SCRAPPED with scrap_reason 'REMAKE_REQUESTED' and, if it still holds an allocation, lot.allocated_qty -= 1 and lot.on_hand_qty += 1 (lot DEPLETED -> AVAILABLE when on_hand_qty becomes 1)"
          - "CASCADE HOP 2 (caused by HOP 1's job scrap): fulfillment_status LAB_COMPLETE -> REMAKE_PENDING and remake_count += 1"
          - "CASCADE HOP 3 (caused by HOP 2's remake_count change): when RemakeCase.warranty_covered is true, remake_writeoff_and_chargeback raises lab_writeoff_cents and lowers patient_portion_cents by the same amount and appends a LAB_WRITEOFF SettlementEntry"
          - "CASCADE HOP 4 (caused by HOP 3's patient_portion_cents drop): when patient_paid_cents > patient_portion_cents, billing_status PATIENT_SETTLED -> REFUND_DUE"
      - from: IN_LAB
        to: REMAKE_PENDING
        trigger: "POST /remake-cases"
        actor: StoreOptician
        preconditions:
          - "fulfillment_status == IN_LAB"
          - "the linked LabJob status IN {EDGED, PASSED, REWORK_QUEUED}"
          - "remake_count < 2"
        side_effects: ["same four-hop chain as LAB_COMPLETE -> REMAKE_PENDING"]
      - from: LAB_COMPLETE
        to: DISPENSED
        trigger: "POST /rx-orders/{id}/dispense"
        actor: StoreOptician
        preconditions:
          - "fulfillment_status == LAB_COMPLETE"
          - "billing_status == PATIENT_SETTLED"
          - "patient_balance_due_cents == 0"
        side_effects: ["freezes the order: no further fulfillment or billing transition is accepted"]
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /rx-orders/{id}/cancel"
        actor: StoreOptician
        preconditions:
          - "fulfillment_status IN {DRAFT, LAYOUT_READY, IN_LAB, REMAKE_PENDING}"
          - "billing_status == PROVISIONAL_QUOTED"
          - "no LabOperation of the order's newest LabJob has status == RUNNING"
        side_effects:
          - "every SCHEDULED LabOperation of the order's newest LabJob -> CANCELLED with cancel_reason 'ORDER_CANCELLED'"
          - "the order's newest LabJob -> SCRAPPED with scrap_reason 'ORDER_CANCELLED'"
          - "COMPENSATION: when that job held an allocation, lot.allocated_qty -= 1 and lot.on_hand_qty += 1, restoring on_hand_qty to its pre-allocation value and flipping lot.status DEPLETED -> AVAILABLE when on_hand_qty becomes 1"
          - "billing_status -> CANCELLED_NO_CHARGE and gross_charge_cents, patient_portion_cents, expedite_fee_cents, estimated_benefit_cents all set to 0"
      - from: LAYOUT_READY
        to: CANCELLED
        trigger: "POST /rx-orders/{id}/cancel"
        actor: StoreOptician
        preconditions: ["same as DRAFT -> CANCELLED"]
        side_effects: ["same as DRAFT -> CANCELLED"]
      - from: IN_LAB
        to: CANCELLED
        trigger: "POST /rx-orders/{id}/cancel"
        actor: StoreOptician
        preconditions: ["same as DRAFT -> CANCELLED"]
        side_effects: ["same as DRAFT -> CANCELLED"]
      - from: REMAKE_PENDING
        to: CANCELLED
        trigger: "POST /rx-orders/{id}/cancel"
        actor: StoreOptician
        preconditions: ["same as DRAFT -> CANCELLED"]
        side_effects: ["same as DRAFT -> CANCELLED"]
      - from: DRAFT
        to: CANCELLED
        trigger: "system cascade HOP 3 of the prescriber-standing chain"
        actor: system
        preconditions:
          - "fulfillment_status IN {DRAFT, LAYOUT_READY}"
          - "billing_status == PROVISIONAL_QUOTED"
        side_effects: ["same side effects as POST /rx-orders/{id}/cancel"]

  - entity: RxOrder
    state_field: billing_status
    shape: "independent state dimension on the same row; contains the BENEFIT_APPLIED <-> BENEFIT_VOIDED cycle"
    initial_state: PROVISIONAL_QUOTED
    terminal_states: [REFUND_DUE, CANCELLED_NO_CHARGE]
    note: >-
      This dimension advances on POST /rx-orders/{id}/benefit-application, benefit-void,
      settle-patient-portion and cancel only. None of the fulfillment endpoints
      (frame-layouts, lab-jobs, lab-operations, quality-inspections, release, dispense) may change
      billing_status, and none of the billing endpoints may change fulfillment_status.
    transitions:
      - from: PROVISIONAL_QUOTED
        to: BENEFIT_APPLIED
        trigger: "POST /rx-orders/{id}/benefit-application"
        actor: BenefitsAdministrator
        preconditions:
          - "billing_status IN {PROVISIONAL_QUOTED, BENEFIT_VOIDED}"
          - "Patient(patient_id).insurance_plan_id IS NOT NULL"
          - "a LabJob exists for this order with status != SCRAPPED so route is known"
        side_effects:
          - "runs order_quote_and_patient_portion variant FINAL, overwriting gross_charge_cents, expedite_fee_cents and patient_portion_cents"
          - "runs benefit_application_waterfall and sets insurance_benefit_cents, benefit_applied_at, quote_variant = FINAL"
          - "appends an ORDER_CHARGE SettlementEntry of +gross_charge_cents"
          - "appends an INSURANCE_BENEFIT SettlementEntry of -insurance_benefit_cents only when insurance_benefit_cents > 0"
          - "recomputes Patient.benefit_used_cents"
      - from: BENEFIT_VOIDED
        to: BENEFIT_APPLIED
        trigger: "POST /rx-orders/{id}/benefit-application"
        actor: BenefitsAdministrator
        preconditions: ["billing_status == BENEFIT_VOIDED"]
        side_effects:
          - "same as PROVISIONAL_QUOTED -> BENEFIT_APPLIED, except no second ORDER_CHARGE entry is appended when one already exists for the order"
      - from: PROVISIONAL_QUOTED
        to: SELF_PAY_FINAL
        trigger: "POST /rx-orders/{id}/benefit-application"
        actor: BenefitsAdministrator
        preconditions:
          - "billing_status == PROVISIONAL_QUOTED"
          - "Patient(patient_id).insurance_plan_id IS NULL"
          - "a LabJob exists for this order with status != SCRAPPED"
        side_effects:
          - "runs order_quote_and_patient_portion variant FINAL with all allowances and coinsurance_pct treated as 0"
          - "sets insurance_benefit_cents = 0, quote_variant = FINAL, benefit_applied_at = logical clock"
          - "appends an ORDER_CHARGE SettlementEntry of +gross_charge_cents; appends NO INSURANCE_BENEFIT entry"
      - from: BENEFIT_APPLIED
        to: BENEFIT_VOIDED
        trigger: "POST /rx-orders/{id}/benefit-void"
        actor: BenefitsAdministrator
        preconditions: ["billing_status == BENEFIT_APPLIED"]
        side_effects:
          - "COMPENSATION: appends a BENEFIT_REVERSAL SettlementEntry of +the insurance_benefit_cents being reversed"
          - "sets insurance_benefit_cents = 0 and benefit_applied_at = null"
          - "recomputes patient_portion_cents = gross_charge_cents - lab_writeoff_cents"
          - "recomputes Patient.benefit_used_cents, which returns to its exact pre-application value"
      - from: BENEFIT_APPLIED
        to: PATIENT_SETTLED
        trigger: "POST /rx-orders/{id}/settle-patient-portion"
        actor: StoreOptician
        preconditions:
          - "billing_status IN {BENEFIT_APPLIED, SELF_PAY_FINAL}"
          - "amount_cents <= patient_balance_due_cents"
          - "patient_paid_cents + amount_cents == patient_portion_cents"
        side_effects:
          - "patient_paid_cents += amount_cents"
          - "appends a PATIENT_PAYMENT SettlementEntry of -amount_cents"
        note: >-
          A payment that leaves a positive balance is accepted and appended but leaves
          billing_status unchanged; only the payment that zeroes the balance transitions.
      - from: SELF_PAY_FINAL
        to: PATIENT_SETTLED
        trigger: "POST /rx-orders/{id}/settle-patient-portion"
        actor: StoreOptician
        preconditions: ["same as BENEFIT_APPLIED -> PATIENT_SETTLED"]
        side_effects: ["same as BENEFIT_APPLIED -> PATIENT_SETTLED"]
      - from: PATIENT_SETTLED
        to: REFUND_DUE
        trigger: "system cascade HOP 4 of the remake chain"
        actor: system
        preconditions: ["patient_paid_cents > patient_portion_cents after the writeoff recompute"]
        side_effects: ["no further billing transition is accepted; patient_balance_due_cents stays negative"]
      - from: PROVISIONAL_QUOTED
        to: CANCELLED_NO_CHARGE
        trigger: "POST /rx-orders/{id}/cancel"
        actor: StoreOptician
        preconditions: ["billing_status == PROVISIONAL_QUOTED"]
        side_effects: ["zeroes every money field on the order; appends no SettlementEntry"]

  - entity: LabJob
    state_field: status
    shape: "branching route fork, per-eye fork-join on inspection, and an EDGED -> REWORK_QUEUED -> SURFACING/EDGING -> EDGED cycle"
    initial_state: QUEUED
    terminal_states: [SCRAPPED]
    transitions:
      - from: QUEUED
        to: SURFACING
        trigger: "POST /lab-operations/{id}/start on a SURFACING operation"
        actor: LabTechnician
        preconditions:
          - "LabJob.route == SURFACE_AND_EDGE"
          - "LabJob.status IN {QUEUED, REWORK_QUEUED}"
          - "LabMachine(machine_id).status == AVAILABLE"
        side_effects:
          - "LabOperation -> RUNNING with performed_by_user_id = X-User-ID"
          - "increments LabJob.version by 1"
      - from: REWORK_QUEUED
        to: SURFACING
        trigger: "POST /lab-operations/{id}/start on a SURFACING operation"
        actor: LabTechnician
        preconditions: ["same as QUEUED -> SURFACING"]
        side_effects: ["same as QUEUED -> SURFACING"]
      - from: SURFACING
        to: SURFACED
        trigger: "POST /lab-operations/{id}/complete"
        actor: LabTechnician
        preconditions: ["LabOperation.status == RUNNING", "LabOperation.operation_type == SURFACING"]
        side_effects: ["LabOperation -> COMPLETED", "increments LabJob.version by 1"]
      - from: SURFACING
        to: QUEUED
        trigger: "POST /lab-operations/{id}/report-breakage when blank_lot_selection finds a replacement lot"
        actor: LabTechnician
        preconditions: ["LabOperation.status == RUNNING", "LabOperation.operation_type == SURFACING"]
        side_effects:
          - "LabOperation -> BROKEN with breakage_reason; LabJob.breakage_count += 1"
          - "scraps the held blank: lot.allocated_qty -= 1 and lot.scrapped_qty += 1"
          - "allocates the replacement: newlot.on_hand_qty -= 1, newlot.allocated_qty += 1, LabJob.blank_lot_id = newlot.id, newlot.status = DEPLETED when its on_hand_qty reaches 0"
      - from: SURFACING
        to: BLANK_BACKORDER
        trigger: "POST /lab-operations/{id}/report-breakage when blank_lot_selection finds no eligible lot"
        actor: LabTechnician
        preconditions: ["LabOperation.status == RUNNING", "LabOperation.operation_type == SURFACING"]
        side_effects:
          - "CASCADE HOP 1 (breakage chain): LabOperation -> BROKEN, LabJob.breakage_count += 1, lot.allocated_qty -= 1, lot.scrapped_qty += 1, LabJob.blank_lot_id = null"
          - "CASCADE HOP 2 (caused by HOP 1 leaving the job with no blank and the selector returning the empty set): LabJob -> BLANK_BACKORDER"
          - "CASCADE HOP 3 (caused by HOP 2): RxOrder.promised_due_at += 48 hours and RxOrder.tat_commitment_status -> AT_RISK"
      - from: BLANK_BACKORDER
        to: QUEUED
        trigger: "POST /lens-blank-lots/{id}/replenish"
        actor: LabManager
        preconditions:
          - "the replenished lot belongs to the job's LensDesign and its diameter_mm >= the job's FrameLayout.required_blank_diameter_mm"
        side_effects:
          - "lot.status DEPLETED -> AVAILABLE when added_qty > 0"
          - "promotes waiting jobs in status BLANK_BACKORDER for that design in created_at ASC order, one blank each, until on_hand_qty is exhausted; each promoted job gets blank_lot_id set and moves to QUEUED"
          - "RxOrder.tat_commitment_status stays AT_RISK and promised_due_at keeps the 48-hour extension"
      - from: SURFACED
        to: EDGING
        trigger: "POST /lab-operations/{id}/start on an EDGING operation"
        actor: LabTechnician
        preconditions:
          - "LabJob.status IN {SURFACED, REWORK_QUEUED} or (LabJob.status == QUEUED AND route == STOCK_EDGE_ONLY)"
          - "FinishingBay(bay_id).status == OPEN"
        side_effects:
          - "LabOperation -> RUNNING with performed_by_user_id = X-User-ID"
          - "increments LabJob.version by 1"
      - from: QUEUED
        to: EDGING
        trigger: "POST /lab-operations/{id}/start on an EDGING operation for a STOCK_EDGE_ONLY job"
        actor: LabTechnician
        preconditions: ["LabJob.route == STOCK_EDGE_ONLY", "LabJob.status == QUEUED", "FinishingBay(bay_id).status == OPEN"]
        side_effects: ["same as SURFACED -> EDGING"]
      - from: REWORK_QUEUED
        to: EDGING
        trigger: "POST /lab-operations/{id}/start on an EDGING operation"
        actor: LabTechnician
        preconditions: ["LabJob.status == REWORK_QUEUED", "FinishingBay(bay_id).status == OPEN"]
        side_effects: ["same as SURFACED -> EDGING"]
      - from: EDGING
        to: EDGED
        trigger: "POST /lab-operations/{id}/complete"
        actor: LabTechnician
        preconditions: ["LabOperation.status == RUNNING", "LabOperation.operation_type == EDGING"]
        side_effects: ["LabOperation -> COMPLETED", "increments LabJob.version by 1"]
      - from: EDGED
        to: EDGED
        trigger: "POST /quality-inspections recording the first PASS of the current cycle"
        actor: QualityInspector
        preconditions:
          - "LabJob.status == EDGED"
          - "no QualityInspection exists for this job with the same eye AND cycle_index == LabJob.rework_cycle_count"
        side_effects:
          - "QualityInspection created with verdict PASS"
        note: "Fork-join: the join fires only when both eyes have a PASS at the current cycle_index."
      - from: EDGED
        to: PASSED
        trigger: "POST /quality-inspections completing a PASS pair at the current cycle_index"
        actor: QualityInspector
        preconditions:
          - "LabJob.status == EDGED"
          - "the other eye already has a PASS inspection with cycle_index == LabJob.rework_cycle_count"
        side_effects: ["QualityInspection created with verdict PASS"]
      - from: EDGED
        to: REWORK_QUEUED
        trigger: "POST /quality-inspections whose verdict is FAIL"
        actor: QualityInspector
        preconditions:
          - "LabJob.status == EDGED"
          - "LabJob.rework_cycle_count < 2"
        side_effects:
          - "QualityInspection created with verdict FAIL and failed_metrics populated"
          - "LabJob.rework_cycle_count += 1, which invalidates any PASS recorded at the previous cycle_index"
      - from: EDGED
        to: SCRAPPED
        trigger: "POST /quality-inspections whose verdict is FAIL when the rework cap is already reached"
        actor: QualityInspector
        preconditions:
          - "LabJob.status == EDGED"
          - "LabJob.rework_cycle_count >= 2"
        side_effects:
          - "QualityInspection created with verdict FAIL"
          - "LabJob -> SCRAPPED with scrap_reason 'REWORK_LIMIT'"
          - "for SURFACE_AND_EDGE: lot.allocated_qty -= 1 and lot.scrapped_qty += 1"
      - from: PASSED
        to: RELEASED
        trigger: "POST /lab-jobs/{id}/release"
        actor: LabTechnician
        preconditions: ["LabJob.status == PASSED"]
        side_effects: ["see RxOrder.fulfillment_status IN_LAB -> LAB_COMPLETE"]
      - from: RELEASED
        to: SCRAPPED
        trigger: "POST /remake-cases"
        actor: StoreOptician
        preconditions: ["LabJob.status IN {EDGED, PASSED, RELEASED, REWORK_QUEUED}"]
        side_effects: ["HOP 1 of the remake chain, see RxOrder LAB_COMPLETE -> REMAKE_PENDING"]
      - from: QUEUED
        to: SCRAPPED
        trigger: "POST /rx-orders/{id}/cancel"
        actor: StoreOptician
        preconditions: ["RxOrder.fulfillment_status is non-terminal", "no LabOperation of this job is RUNNING"]
        side_effects: ["see RxOrder DRAFT -> CANCELLED"]

  - entity: LabOperation
    state_field: status
    shape: "branching: RUNNING forks to COMPLETED or BROKEN"
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, BROKEN, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: RUNNING
        trigger: "POST /lab-operations/{id}/start"
        actor: LabTechnician
        preconditions:
          - "status == SCHEDULED"
          - "for SURFACING: LabMachine.status == AVAILABLE; for EDGING: FinishingBay.status == OPEN"
          - "the LabJob is in a state that permits this operation_type"
        side_effects: ["sets performed_by_user_id = X-User-ID", "advances LabJob per the LabJob machine"]
      - from: RUNNING
        to: COMPLETED
        trigger: "POST /lab-operations/{id}/complete"
        actor: LabTechnician
        preconditions: ["status == RUNNING"]
        side_effects: ["advances LabJob to SURFACED or EDGED per operation_type"]
      - from: RUNNING
        to: BROKEN
        trigger: "POST /lab-operations/{id}/report-breakage"
        actor: LabTechnician
        preconditions: ["status == RUNNING", "operation_type == SURFACING"]
        side_effects: ["breakage chain HOP 1; see LabJob SURFACING -> BLANK_BACKORDER"]
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /lab-operations/{id}/cancel"
        actor: LabTechnician
        preconditions: ["status == SCHEDULED"]
        side_effects:
          - "sets cancel_reason; frees the machine or bay window so a previously conflicting occupation becomes schedulable"
          - "increments LabJob.version by 1"

  - entity: RemakeCase
    state_field: status
    shape: "fork-join: adjudication forks into STORE / LAB / SPLIT with divergent side-effect sets"
    initial_state: SUBMITTED
    terminal_states: [CLOSED]
    transitions:
      - from: SUBMITTED
        to: ADJUDICATED
        trigger: "POST /remake-cases/{id}/adjudicate with adjudication_method == PROCESS_AUDIT or TOLERANCE_DELTA"
        actor: LabManager
        preconditions:
          - "status == SUBMITTED"
          - "for adjudication_method == TOLERANCE_DELTA: quality_inspection_id IS NOT NULL"
        side_effects:
          - "runs remake_responsibility_split with the requested variant and sets lab_share_pct"
          - "BRANCH lab_share_pct == 0: responsibility = STORE, lab_chargeback_cents = 0"
          - "BRANCH lab_share_pct == 100: responsibility = LAB, lab_chargeback_cents = full job cost basis"
          - "BRANCH 0 < lab_share_pct < 100: responsibility = SPLIT, lab_chargeback_cents = round_half_up(job_cost_basis_cents * lab_share_pct / 100)"
      - from: ADJUDICATED
        to: CLOSED
        trigger: "POST /remake-cases/{id}/close"
        actor: LabManager
        preconditions:
          - "status == ADJUDICATED"
          - "RxOrder(of lab_job_id).fulfillment_status IN {LAB_COMPLETE, DISPENSED}"
        side_effects: ["freezes the case; no further adjudication is accepted"]

  - entity: LensBlankLot
    state_field: status
    shape: "cyclic: AVAILABLE <-> DEPLETED"
    initial_state: AVAILABLE
    terminal_states: []
    transitions:
      - from: AVAILABLE
        to: DEPLETED
        trigger: "system, when an allocation or replacement allocation drives on_hand_qty to 0"
        actor: system
        preconditions: ["on_hand_qty == 0 after the decrement"]
        side_effects: ["the lot stops being an eligible candidate in blank_lot_selection"]
      - from: DEPLETED
        to: AVAILABLE
        trigger: "POST /lens-blank-lots/{id}/replenish, or any allocation release that raises on_hand_qty above 0"
        actor: LabManager
        preconditions: ["on_hand_qty > 0 after the increment"]
        side_effects:
          - "received_qty += added_qty and on_hand_qty += added_qty for the replenish path"
          - "promotes BLANK_BACKORDER jobs per LabJob BLANK_BACKORDER -> QUEUED"

# ---------------------------------------------------------------------------
# §1.2.1 Concurrency Rules
# ---------------------------------------------------------------------------

concurrency_rules:
  - rule_id: frame-layout-create-stale-rx-order
    parent_entity: RxOrder
    write_endpoint: "POST /frame-layouts"
    occ_field: "expected_rx_order_version"
    description: |
      Creating a FrameLayout against an RxOrder whose version has advanced since the client last
      read it is rejected. A retrace legitimately supersedes the previous layout, so the write
      itself is always permitted by the state machine; the stale-version check is the only guard
      that stops a trace derived from an outdated view of the order (outdated monocular PD,
      fitting height, or an intervening retrace) from silently becoming the layout of record.
    error_id: ERR_STALE_RX_ORDER_VERSION
    http_status: 412
  - rule_id: lab-operation-create-stale-lab-job
    parent_entity: LabJob
    write_endpoint: "POST /lab-operations"
    occ_field: "expected_lab_job_version"
    description: |
      Scheduling a LabOperation against a LabJob whose version has advanced since the client last
      read it is rejected. Multiple operations per job are legitimate by design (surfacing then
      edging, and again after every rework loop), so nothing in the state machine forbids a second
      create; the stale-version check is what stops an occupation from being booked against a job
      whose route, blank allocation or rework cycle has moved on.
    error_id: ERR_STALE_LAB_JOB_VERSION
    http_status: 412

# ---------------------------------------------------------------------------
# §1.3 Calculation Rules
#
# Global money convention: every money field is an integer number of cents. Every money
# multiplication rounds HALF-UP to whole cents at the point named in the formula and never later.
# Every geometry field is millimetres rounded HALF-UP to 1 decimal place. Every diopter delta is
# rounded HALF-UP to 2 decimal places before comparison.
# ---------------------------------------------------------------------------

calculations:
  - rule_id: rx_expiration_window
    target: "PrescriptionRecord.expires_at"
    algorithm_type: threshold
    inputs:
      - "PrescriptionRecord.issued_on (date)"
      - "Prescriber.max_rx_validity_months (integer, default 12)"
    formula: |
      expires_at = issued_on + max_rx_validity_months calendar months, rendered as an instant at
      00:00:00.000Z on the resulting date.
      Day clamping: when the target month has fewer days than issued_on's day-of-month, clamp to the
      last day of the target month (2026-01-31 + 12 -> 2027-01-31; 2026-02-29 + 12 -> 2027-02-28;
      2025-08-31 + 6 -> 2026-02-28).
      A prescription is usable while logical_clock < expires_at. Equality is NOT usable.
    constants: {}
    rounding: "none; the instant is always exactly midnight UTC"
    recompute_on:
      - "POST /prescriptions (creation)"
      - "POST /prescriptions/{id}/resubmit when corrected_issued_on is supplied"
    note: >-
      max_rx_validity_months is read from the Prescriber row at the moment of computation, so two
      prescriptions issued on the same date by different prescribers can expire in different months.

  - rule_id: frame_layout_geometry
    target: "FrameLayout.decentration_h_od_mm, decentration_h_os_mm, decentration_v_mm, required_blank_diameter_mm, layout_status"
    algorithm_type: threshold
    inputs:
      - "FrameLayout.a_mm, b_mm, ed_mm, dbl_mm (trace)"
      - "RxOrder.monocular_pd_od_mm, monocular_pd_os_mm, fitting_height_mm"
      - "FrameLayout.fitting_height_override_mm (nullable)"
      - "LensDesign.design_type"
    formula: |
      effective_fitting_height_mm = fitting_height_override_mm when not null else RxOrder.fitting_height_mm
      frame_pd_mm = a_mm + dbl_mm
      For each eye E in [OD, OS] with monocular_pd_E:
        decentration_h_E = abs(frame_pd_mm / 2 - monocular_pd_E)
      decentration_v_mm = abs(effective_fitting_height_mm - b_mm / 2)   # shared by both eyes
      total_decentration_E =
        design_type == SINGLE_VISION -> decentration_h_E
        design_type == PROGRESSIVE   -> max(decentration_h_E, decentration_v_mm) + FITTING_CROSS_ALLOWANCE_MM
        design_type == SPECIALTY     -> decentration_h_E + decentration_v_mm + SPECIALTY_ALLOWANCE_MM
      blank_needed_E = round_half_up(ed_mm + 2 * total_decentration_E + CHUCK_ALLOWANCE_MM, 1)
      required_blank_diameter_mm = max(blank_needed_OD, blank_needed_OS)
      layout_status = BLANK_TOO_SMALL when required_blank_diameter_mm > MAX_BLANK_DIAMETER_MM
                      else COMPUTED
    constants:
      FITTING_CROSS_ALLOWANCE_MM: 4.0
      SPECIALTY_ALLOWANCE_MM: 2.0
      CHUCK_ALLOWANCE_MM: 2.0
      MAX_BLANK_DIAMETER_MM: 85.0
    rounding: "half-up to 1 decimal place on blank_needed_E only; the decentration fields keep full 1-dp precision"
    note: >-
      decentration_v_mm is recorded for every design type but only PROGRESSIVE and SPECIALTY consume
      it, so a single-vision layout is insensitive to fitting height while the other two are not.

  - rule_id: lab_route_determination
    target: "LabJob.route"
    algorithm_type: threshold
    inputs:
      - "LensDesign.stock_sku_available, design_type"
      - "PrescriptionRecord sphere_od, sphere_os, cylinder_od, cylinder_os, prism_od, prism_os"
      - "FrameLayout.required_blank_diameter_mm"
      - "the LensBlankLot candidate set from blank_lot_selection"
    formula: |
      route = STOCK_EDGE_ONLY when ALL of:
        LensDesign.stock_sku_available == true
        LensDesign.design_type != SPECIALTY
        max(abs(sphere_od), abs(sphere_os)) <= STOCK_SPHERE_ABS_MAX
        max(abs(cylinder_od), abs(cylinder_os)) <= STOCK_CYLINDER_ABS_MAX
        prism_od == 0.00 AND prism_os == 0.00
      otherwise route = SURFACE_AND_EDGE
    constants:
      STOCK_SPHERE_ABS_MAX: 6.00
      STOCK_CYLINDER_ABS_MAX: 2.00
    rounding: "none"
    note: >-
      A STOCK_EDGE_ONLY job consumes no LensBlankLot at all: stock finished lenses are not tracked
      as lots. Only SURFACE_AND_EDGE allocates, scraps or consumes blanks.

  - rule_id: blank_lot_selection
    target: "LabJob.blank_lot_id"
    algorithm_type: chronological
    inputs:
      - "LensBlankLot rows for the order's lens_design_id"
      - "FrameLayout.required_blank_diameter_mm"
      - "the lot id just scrapped, when called from the breakage path"
    formula: |
      candidate set = LensBlankLot where
        lens_design_id == RxOrder.lens_design_id
        AND status == AVAILABLE
        AND on_hand_qty > 0
        AND diameter_mm >= FrameLayout.required_blank_diameter_mm
        AND id != the lot whose blank was just scrapped (breakage path only)
      rank: diameter_mm ASC (smallest sufficient blank first),
            then received_on ASC (oldest stock first),
            then created_at ASC
      result = the first ranked row, or the empty set
    constants: {}
    rounding: "none"
    note: >-
      Ties are never broken by id. The empty set means ERR_NO_ELIGIBLE_BLANK_LOT on POST /lab-jobs
      and LabJob -> BLANK_BACKORDER on POST /lab-operations/{id}/report-breakage.

  - rule_id: machine_bay_occupation_feasibility
    target: "acceptance of POST /lab-operations"
    algorithm_type: interval_merge
    inputs:
      - "requested window_start, window_end"
      - "existing LabOperation rows on the same machine_id or bay_id with status IN {SCHEDULED, RUNNING}"
      - "LabMachine.calibration_buffer_minutes"
      - "FinishingBay.concurrent_capacity"
    formula: |
      SURFACING (machine, exclusive with calibration buffer B = calibration_buffer_minutes):
        conflict when  requested.window_start < existing.window_end + B
                  AND  existing.window_start  < requested.window_end + B
        A requested start exactly at existing.window_end + B is FEASIBLE (strict <).
      EDGING (bay, capacity C = concurrent_capacity, no buffer):
        overlapping_count = count of existing rows where
          existing.window_start <= requested.window_end AND requested.window_start <= existing.window_end
        (closed intervals: a shared endpoint counts as overlapping)
        feasible when overlapping_count < C
      CANCELLED, COMPLETED and BROKEN operations never occupy a resource.
    constants: {}
    rounding: "none; all comparisons are on UTC instants at second precision"
    note: >-
      The two resource types use deliberately different overlap semantics: machines are exclusive
      and buffered, bays are counted and unbuffered.

  - rule_id: turnaround_and_expedite_fee
    target: "RxOrder.promised_tat_hours, promised_due_at, expedite_fee_cents"
    algorithm_type: tiered_pricing
    variants: [PROVISIONAL, ROUTE_ACTUAL]
    inputs:
      - "RxOrder.product_tier (copied from LensDesign.product_tier)"
      - "RxOrder.expedite_requested"
      - "LabJob.route (ROUTE_ACTUAL only)"
      - "lens_subtotal_cents from order_quote_and_patient_portion of the matching variant"
    formula: |
      nominal_tat_hours = BASE_TAT_HOURS[product_tier]
                          + (SURFACING_TAT_PENALTY_HOURS when variant == ROUTE_ACTUAL
                             AND LabJob.route == SURFACE_AND_EDGE else 0)
      promised_tat_hours = ceil(nominal_tat_hours * EXPEDITE_FACTOR) when expedite_requested
                           else nominal_tat_hours
      expedite_rate = first matching band of EXPEDITE_FEE_BANDS on promised_tat_hours
      expedite_fee_cents = round_half_up(lens_subtotal_cents * expedite_rate) when expedite_requested
                           else 0
      promised_due_at = RxOrder.created_at + promised_tat_hours hours
                        + 48 hours for every BLANK_BACKORDER event the order has suffered
      Only order_quote_and_patient_portion writes expedite_fee_cents onto the order. POST /lab-jobs
      runs this rule for its schedule outputs (promised_tat_hours, promised_due_at) alone.
    constants:
      BASE_TAT_HOURS: {ECONOMY: 120, STANDARD: 72, PREMIUM: 48}
      SURFACING_TAT_PENALTY_HOURS: 24
      EXPEDITE_FACTOR: 0.5
      EXPEDITE_FEE_BANDS: "promised_tat_hours <= 24 -> 0.30; <= 48 -> 0.20; <= 72 -> 0.12; otherwise 0.00"
      BACKORDER_EXTENSION_HOURS: 48
    rounding: "ceil on hours; half-up to whole cents on the fee"
    note: >-
      The variants can move the fee in the OPPOSITE direction from the base: ROUTE_ACTUAL adds 24
      hours of surfacing time, which pushes promised_tat_hours into a cheaper expedite band, so the
      final fee can be strictly lower than the provisional fee even though the final lens subtotal is
      strictly higher.

  - rule_id: order_quote_and_patient_portion
    target: "RxOrder.gross_charge_cents, estimated_benefit_cents, insurance_benefit_cents, patient_portion_cents, patient_balance_due_cents"
    algorithm_type: aggregation
    variants: [PROVISIONAL, FINAL]
    inputs:
      - "RxOrder.frame_retail_cents, requested_coatings, expedite_requested"
      - "LensDesign.retail_price_cents, design_type, product_tier"
      - "LabJob.route (FINAL only)"
      - "InsurancePlan of the patient, or null for self-pay"
      - "RxOrder.lab_writeoff_cents"
    formula: |
      component_order = [FRAME, LENS] then every requested coating sorted by
        COATING_PRICE_CENTS DESC, then coating code ASC
      frame_charge_cents = RxOrder.frame_retail_cents
      lens_charge_cents  = LensDesign.retail_price_cents
                           + (SURFACING_SURCHARGE_CENTS when variant == FINAL
                              AND LabJob.route == SURFACE_AND_EDGE else 0)
      coating_charge_cents[c] = COATING_PRICE_CENTS[c]
      lens_subtotal_cents = lens_charge_cents + sum(coating_charge_cents)
      expedite_fee_cents  = turnaround_and_expedite_fee(variant PROVISIONAL for FINAL=false /
                            ROUTE_ACTUAL for variant FINAL).expedite_fee_cents
      gross_charge_cents  = frame_charge_cents + lens_charge_cents
                            + sum(coating_charge_cents) + expedite_fee_cents

      variant PROVISIONAL (at POST /rx-orders, route unknown):
        estimated_benefit_cents = benefit_application_waterfall(..., apply_annual_cap=false)
        patient_portion_cents   = gross_charge_cents - estimated_benefit_cents
        insurance_benefit_cents = 0 and quote_variant = PROVISIONAL

      variant FINAL (at POST /rx-orders/{id}/benefit-application, route known):
        insurance_benefit_cents = benefit_application_waterfall(..., apply_annual_cap=true)
        patient_portion_cents   = gross_charge_cents - insurance_benefit_cents - lab_writeoff_cents
        quote_variant = FINAL

      patient_balance_due_cents = patient_portion_cents - patient_paid_cents  (may go negative)
      INVARIANT, after every write:
        gross_charge_cents == insurance_benefit_cents + patient_portion_cents + lab_writeoff_cents
    constants:
      SURFACING_SURCHARGE_CENTS: 4500
      COATING_PRICE_CENTS: {HARDCOAT: 2495, AR_STANDARD: 5995, POLARIZED: 11995, AR_PREMIUM: 10995, PHOTOCHROMIC: 13995}
    rounding: "no rounding here; every cent value is already integral"
    note: >-
      Self-pay (Patient.insurance_plan_id IS NULL) runs the identical formula with every allowance
      and coinsurance_pct forced to 0, so estimated_benefit_cents and insurance_benefit_cents are 0
      and patient_portion_cents equals gross_charge_cents.

  - rule_id: benefit_application_waterfall
    target: "RxOrder.insurance_benefit_cents (or estimated_benefit_cents for the uncapped call)"
    algorithm_type: waterfall_allocation
    inputs:
      - "the ordered component charge list from order_quote_and_patient_portion"
      - "InsurancePlan.frame_allowance_cents, lens_base_allowance_cents, coating_allowance_cents, progressive_copay_cents, coinsurance_pct, annual_benefit_cap_cents, expedite_covered"
      - "LensDesign.design_type"
      - "Patient.benefit_used_cents"
    formula: |
      allowance[FRAME] = frame_allowance_cents
      allowance[LENS]  = max(0, lens_base_allowance_cents
                              - (progressive_copay_cents when design_type == PROGRESSIVE else 0))
      coating_pool = coating_allowance_cents        # ONE shared pool for all coatings
      for each coating c in component_order:
        allowance[c] = min(coating_pool, coating_charge_cents[c])
        coating_pool = coating_pool - allowance[c]
      for each component i:
        uncovered_i = max(0, charge_i - allowance_i)
        plan_coinsurance_i = round_half_up(uncovered_i * coinsurance_pct)   # PER COMPONENT
      uncapped_benefit_cents = sum(allowance_i) + sum(plan_coinsurance_i)
                               + (expedite_fee_cents when expedite_covered else 0)
      when apply_annual_cap is false:
        result = uncapped_benefit_cents
      when apply_annual_cap is true:
        cap_remaining_cents = max(0, annual_benefit_cap_cents
                                     - Patient.benefit_used_cents excluding this order)
        result = min(uncapped_benefit_cents, cap_remaining_cents)
    constants: {}
    rounding: >-
      half-up to whole cents on plan_coinsurance_i, applied INDEPENDENTLY to each component and then
      summed. Rounding the summed uncovered amount once would produce a different total whenever the
      per-component fractional parts add to more than a cent.
    note: >-
      coinsurance_pct is the PLAN's share of the uncovered remainder, not the patient's, which is
      what keeps the money invariant exact in integer cents. The expedite fee is never given an
      allowance; it is either fully covered (expedite_covered) or fully patient-side.

  - rule_id: patient_benefit_used_rolling
    target: "Patient.benefit_used_cents"
    algorithm_type: aggregation
    inputs:
      - "Patient.benefit_period_start"
      - "RxOrder.insurance_benefit_cents, billing_status, benefit_applied_at for every order of the patient"
    formula: |
      window_start = benefit_period_start at 00:00:00.000Z
      window_end   = benefit_period_start + 12 calendar months at 00:00:00.000Z
      benefit_used_cents = sum of insurance_benefit_cents over the patient's RxOrders where
        billing_status IN {BENEFIT_APPLIED, PATIENT_SETTLED, REFUND_DUE}
        AND window_start <= benefit_applied_at < window_end
      Orders in PROVISIONAL_QUOTED, SELF_PAY_FINAL, BENEFIT_VOIDED or CANCELLED_NO_CHARGE contribute
      nothing regardless of any historical benefit amount.
    constants:
      BENEFIT_PERIOD_MONTHS: 12
    rounding: "none"
    note: >-
      Inclusive start, exclusive end. A void returns this figure to its exact pre-application value
      because the voided order leaves the qualifying billing_status set AND has its
      insurance_benefit_cents reset to 0.

  - rule_id: tolerance_standard_selection
    target: "QualityInspection.tolerance_standard_id"
    algorithm_type: chronological
    inputs:
      - "LensDesign.design_type of the inspected job's order"
      - "abs(PrescriptionRecord sphere for the inspected eye) as reference_power_abs"
      - "ToleranceStandard rows"
      - "logical clock"
    formula: |
      candidate set = ToleranceStandard where
        design_type == LensDesign.design_type
        AND power_band_min_abs <= reference_power_abs <= power_band_max_abs   (both ends inclusive)
        AND effective_from <= logical clock date
      rank: effective_from DESC, then created_at DESC
      result = the first ranked row, or the empty set -> ERR_NO_TOLERANCE_STANDARD
    constants: {}
    rounding: "none"
    note: >-
      A standard whose effective_from is in the future is invisible, so advancing the clock past it
      changes the verdict of an otherwise identical inspection.

  - rule_id: inspection_delta_and_verdict
    target: "QualityInspection.sphere_delta, cylinder_delta, axis_delta, prism_delta, failed_metrics, verdict"
    algorithm_type: threshold
    inputs:
      - "QualityInspection.measured_sphere, measured_cylinder, measured_axis, measured_prism, cosmetic_defect_codes, eye"
      - "PrescriptionRecord sphere/cylinder/axis/prism for that eye"
      - "the ToleranceStandard chosen by tolerance_standard_selection"
    formula: |
      sphere_delta   = round_half_up(abs(measured_sphere   - prescribed_sphere),   2)
      cylinder_delta = round_half_up(abs(measured_cylinder - prescribed_cylinder), 2)
      prism_delta    = round_half_up(abs(measured_prism    - prescribed_prism),    2)
      raw_axis_gap   = abs(measured_axis - prescribed_axis)
      axis_delta     = min(raw_axis_gap, 180 - raw_axis_gap)      # circular distance in degrees
      failed_metrics is built in the fixed order [SPHERE, CYLINDER, AXIS, PRISM, COSMETIC]:
        SPHERE   fails when sphere_delta   > sphere_tolerance_diopters
        CYLINDER fails when cylinder_delta > cylinder_tolerance_diopters
        AXIS     is evaluated ONLY when abs(prescribed_cylinder) >= AXIS_RELEVANCE_CYL_MIN;
                 it then fails when axis_delta > axis_tolerance_degrees
        PRISM    fails when prism_delta    > prism_tolerance_pd
        COSMETIC fails when any code in cosmetic_defect_codes is NOT in
                 ToleranceStandard.allowed_cosmetic_defect_codes
      verdict = FAIL when failed_metrics is non-empty, else PASS
    constants:
      AXIS_RELEVANCE_CYL_MIN: 0.25
    rounding: "half-up to 2 decimal places on every diopter delta before the comparison; axis_delta is an exact integer"
    note: >-
      Every comparison is STRICTLY greater-than, so a delta exactly equal to the tolerance passes.
      A spherical prescription (cylinder 0.00) never reports AXIS in failed_metrics no matter how far
      the measured axis is from the prescribed one.

  - rule_id: remake_responsibility_split
    target: "RemakeCase.lab_share_pct, responsibility, lab_chargeback_cents"
    algorithm_type: weighted_scoring
    variants: [PROCESS_AUDIT, TOLERANCE_DELTA]
    inputs:
      - "RemakeCase.defect_codes (PROCESS_AUDIT)"
      - "the linked QualityInspection deltas and its ToleranceStandard tolerances (TOLERANCE_DELTA)"
      - "the order's lens_charge_cents and coating charges"
    formula: |
      variant PROCESS_AUDIT (defect attribution, no measurements):
        lab_share_pct = 100 when every code in defect_codes is in LAB_ATTRIBUTABLE_DEFECTS
                        0   when every code in defect_codes is in STORE_ATTRIBUTABLE_DEFECTS
                        MIXED_DEFECT_LAB_SHARE_PCT otherwise
      variant TOLERANCE_DELTA (measurement severity, four equally weighted metrics):
        for m in [SPHERE, CYLINDER, AXIS, PRISM]:
          ratio_m = min(1, delta_m / tolerance_m)
        lab_share_pct = round_half_up(100 * sum(ratio_m) / 4)
      responsibility = STORE when lab_share_pct == 0
                       LAB   when lab_share_pct == 100
                       SPLIT otherwise
      job_cost_basis_cents = LensDesign.retail_price_cents
                             + (SURFACING_SURCHARGE_CENTS when LabJob.route == SURFACE_AND_EDGE else 0)
                             + sum of the order's coating charges
                             (the frame and the expedite fee are never charged back to the lab;
                              the surcharge is included on route alone, whether or not the FINAL
                              quote has been produced yet)
      lab_chargeback_cents = round_half_up(job_cost_basis_cents * lab_share_pct / 100)
    constants:
      LAB_ATTRIBUTABLE_DEFECTS: [POWER_OUT_OF_TOL, AXIS_OUT_OF_TOL, PRISM_OUT_OF_TOL, COSMETIC_DEFECT, WRONG_MATERIAL, WRONG_COATING]
      STORE_ATTRIBUTABLE_DEFECTS: [WRONG_PD, WRONG_FITTING_HEIGHT, WRONG_FRAME, PATIENT_NONADAPT, RX_TRANSCRIPTION]
      MIXED_DEFECT_LAB_SHARE_PCT: 50
    rounding: "half-up to a whole percent on lab_share_pct, then half-up to whole cents on the chargeback"
    note: >-
      The two variants can disagree sharply on the same case: a single out-of-tolerance sphere
      reading yields 100 under PROCESS_AUDIT but a fractional share under TOLERANCE_DELTA, because
      TOLERANCE_DELTA dilutes it with the three metrics that were in tolerance.

  - rule_id: remake_writeoff_and_chargeback
    target: "RxOrder.lab_writeoff_cents, patient_portion_cents, patient_balance_due_cents"
    algorithm_type: tiered_pricing
    inputs:
      - "RxOrder.remake_count after the increment"
      - "RxOrder.patient_portion_cents and lab_writeoff_cents before the write"
      - "RemakeCase.warranty_covered"
    formula: |
      applies only when RemakeCase.warranty_covered == true; otherwise nothing changes.
      patient_gross_share_cents = patient_portion_cents + lab_writeoff_cents   # writeoff-free base
      cumulative_pct = REMAKE_WRITEOFF_PCT[remake_count]
      lab_writeoff_cents    = round_half_up(patient_gross_share_cents * cumulative_pct)
      patient_portion_cents = patient_gross_share_cents - lab_writeoff_cents
      patient_balance_due_cents = patient_portion_cents - patient_paid_cents
    constants:
      REMAKE_WRITEOFF_PCT: {1: 0.25, 2: 0.60}
      MAX_REMAKES_PER_ORDER: 2
    rounding: "half-up to whole cents, applied to the CUMULATIVE percentage rather than incrementally"
    note: >-
      Because the percentage is cumulative and recomputed from the writeoff-free base, two
      successive remakes give exactly the tier-2 writeoff, never tier-1 plus tier-2. The money
      invariant gross == benefit + patient + writeoff survives every remake untouched.

  - rule_id: warranty_coverage_window
    target: "RemakeCase.warranty_covered"
    algorithm_type: threshold
    inputs:
      - "RemakeCase.warranty_claim"
      - "LabJob.released_at (null while the job never reached RELEASED)"
      - "logical clock"
    formula: |
      warranty_covered = warranty_claim == true
                         AND (LabJob.released_at IS NULL
                              OR logical_clock <= released_at + WARRANTY_DAYS days)
    constants:
      WARRANTY_DAYS: 90
    rounding: "none"
    note: >-
      A job that never left the lab is always inside warranty. The boundary is inclusive: exactly 90
      days after release is still covered, one second later is not.

# ---------------------------------------------------------------------------
# §1.4 Validation Rules (evaluated in ascending priority; the first violated rule wins)
# ---------------------------------------------------------------------------

validations:
  - rule_id: request_body_wellformed
    applies_to: "every POST and PATCH endpoint"
    priority: 10
    condition: "a required input field is missing, has the wrong type, or carries a value outside its declared enum"
    error_id: ERR_VALIDATION
    category: structural
  - rule_id: path_entity_exists
    applies_to: "every endpoint with a path parameter"
    priority: 20
    condition: "the id in the path matches no row of the addressed collection"
    error_id: "ERR_<ENTITY>_NOT_FOUND"
    category: existence
  - rule_id: referenced_entity_exists
    applies_to: "every endpoint accepting a foreign key in its body"
    priority: 30
    condition: "a foreign key in the body matches no row of the referenced collection"
    error_id: "ERR_<PARENT_ENTITY>_NOT_FOUND"
    category: referential
  - rule_id: actor_role_permitted
    applies_to: "every endpoint"
    priority: 40
    condition: "the X-Role header is absent, unknown, or not listed for the endpoint in §1.7"
    error_id: ERR_UNAUTHORIZED
    category: authorization
  - rule_id: clock_monotonic
    applies_to: "POST /_clock/set_current_utc"
    priority: 50
    condition: "the requested instant is strictly earlier than the current logical clock"
    error_id: ERR_CLOCK_NOT_MONOTONIC
    category: temporal
  - rule_id: prescriber_npi_unique
    applies_to: "POST /prescribers"
    priority: 60
    condition: "npi already belongs to another Prescriber"
    error_id: ERR_DUPLICATE_NPI
    category: uniqueness
  - rule_id: plan_code_unique
    applies_to: "POST /insurance-plans"
    priority: 70
    condition: "plan_code already belongs to another InsurancePlan"
    error_id: ERR_DUPLICATE_PLAN_CODE
    category: uniqueness
  - rule_id: design_code_unique
    applies_to: "POST /lens-designs"
    priority: 80
    condition: "design_code already belongs to another LensDesign"
    error_id: ERR_DUPLICATE_DESIGN_CODE
    category: uniqueness
  - rule_id: patient_member_number_required
    applies_to: "POST /patients"
    priority: 90
    condition: "insurance_plan_id is not null and member_number is null or empty"
    error_id: ERR_MEMBER_NUMBER_REQUIRED
    category: conditional
  - rule_id: rx_power_within_dispensable_range
    applies_to: "POST /prescriptions"
    priority: 100
    condition: >-
      any sphere outside [-20.00, 20.00], any cylinder outside [-6.00, 0.00] (minus-cylinder form
      only), any axis outside the integers 1..180, add_power present and outside [0.75, 3.50], any
      prism outside [0.00, 5.00], or any of these values not a multiple of 0.25 diopters
    error_id: ERR_RX_POWER_OUT_OF_RANGE
    category: range
  - rule_id: rx_axis_required_with_cylinder
    applies_to: "POST /prescriptions"
    priority: 110
    condition: "cylinder for an eye is non-zero and the axis for that eye is null"
    error_id: ERR_RX_AXIS_REQUIRED
    category: conditional
  - rule_id: rx_issue_date_not_future
    applies_to: "POST /prescriptions"
    priority: 120
    condition: "issued_on is later than the logical clock's UTC date"
    error_id: ERR_RX_ISSUE_DATE_IN_FUTURE
    category: temporal
  - rule_id: rx_pd_within_range
    applies_to: "POST /prescriptions"
    priority: 130
    condition: "pd_distance_mm outside [40.0, 80.0]"
    error_id: ERR_PD_OUT_OF_RANGE
    category: range
  - rule_id: rx_state_permits_verification_action
    applies_to: "POST /prescriptions/{id}/verify, /prescriber-attest, /reject, /resubmit"
    priority: 140
    condition: "the prescription's verification_status has no transition for the requested action"
    error_id: ERR_RX_STATE_INVALID
    category: state
  - rule_id: attestation_by_prescriber_of_record
    applies_to: "POST /prescriptions/{id}/prescriber-attest"
    priority: 150
    condition: "X-User-ID differs from PrescriptionRecord.prescriber_id"
    error_id: ERR_NOT_PRESCRIBER_OF_RECORD
    category: authorization
  - rule_id: prescriber_active_for_verification
    applies_to: "POST /prescriptions/{id}/verify, /prescriber-attest"
    priority: 160
    condition: "the referenced Prescriber's status is not ACTIVE"
    error_id: ERR_PRESCRIBER_NOT_ACTIVE
    category: cross_entity
  - rule_id: prescriber_record_matches_claim
    applies_to: "POST /prescriptions/{id}/verify"
    priority: 170
    condition: "prescriber_npi_claimed != Prescriber.npi or prescriber_license_state_claimed != Prescriber.license_state"
    error_id: ERR_PRESCRIBER_RECORD_MISMATCH
    category: cross_entity
  - rule_id: order_patient_matches_prescription
    applies_to: "POST /rx-orders"
    priority: 180
    condition: "PrescriptionRecord.patient_id differs from the request's patient_id"
    error_id: ERR_RX_PATIENT_MISMATCH
    category: cross_entity
  - rule_id: order_coatings_offered_by_design
    applies_to: "POST /rx-orders"
    priority: 190
    condition: "requested_coatings contains a code absent from LensDesign.allowed_coatings"
    error_id: ERR_COATING_NOT_AVAILABLE_FOR_DESIGN
    category: cross_entity
  - rule_id: order_design_supports_rx
    applies_to: "POST /rx-orders"
    priority: 200
    condition: "PrescriptionRecord.requires_multifocal is true and LensDesign.design_type is SINGLE_VISION"
    error_id: ERR_DESIGN_INCOMPATIBLE_WITH_RX
    category: cross_entity
  - rule_id: order_prescription_verified
    applies_to: "POST /rx-orders"
    priority: 210
    condition: "PrescriptionRecord.verification_status is not VERIFIED"
    error_id: ERR_RX_NOT_VERIFIED
    category: state
    note: "PRIORITY PAIR A, higher half. Beats order_prescription_not_expired at 220."
  - rule_id: order_prescription_not_expired
    applies_to: "POST /rx-orders"
    priority: 220
    condition: "the logical clock is at or after PrescriptionRecord.expires_at"
    error_id: ERR_RX_EXPIRED
    category: temporal
    note: "PRIORITY PAIR A, lower half. Only reachable on a VERIFIED prescription."
  - rule_id: order_monocular_pd_consistent
    applies_to: "POST /rx-orders"
    priority: 230
    condition: "abs(monocular_pd_od_mm + monocular_pd_os_mm - PrescriptionRecord.pd_distance_mm) > 1.0"
    error_id: ERR_MONOCULAR_PD_INCONSISTENT
    category: cross_entity
  - rule_id: order_specialty_prior_auth
    applies_to: "POST /rx-orders"
    priority: 240
    condition: >-
      LensDesign.design_type is SPECIALTY, the patient has an InsurancePlan whose
      specialty_requires_prior_auth is true, and prior_auth_reference is null
    error_id: ERR_PRIOR_AUTH_REQUIRED
    category: conditional
  - rule_id: layout_order_state
    applies_to: "POST /frame-layouts"
    priority: 250
    condition: "RxOrder.fulfillment_status is not DRAFT or LAYOUT_READY"
    error_id: ERR_ORDER_STATE_INVALID
    category: state
  - rule_id: layout_order_version_current
    applies_to: "POST /frame-layouts"
    priority: 260
    condition: "expected_rx_order_version differs from RxOrder.version"
    error_id: ERR_STALE_RX_ORDER_VERSION
    category: concurrency
  - rule_id: trace_dimensions_in_range
    applies_to: "POST /frame-layouts"
    priority: 270
    condition: >-
      a_mm outside [40.0, 70.0], b_mm outside [15.0, 60.0], dbl_mm outside [10.0, 26.0],
      ed_mm outside [40.0, 85.0], or ed_mm < a_mm
    error_id: ERR_TRACE_DIMENSIONS_OUT_OF_RANGE
    category: range
    note: "PRIORITY PAIR B, higher half. Beats layout_fitting_height_minimum at 280."
  - rule_id: layout_fitting_height_minimum
    applies_to: "POST /frame-layouts"
    priority: 280
    condition: "the effective fitting height is below LensDesign.min_fitting_height_mm"
    error_id: ERR_FITTING_HEIGHT_BELOW_DESIGN_MINIMUM
    category: cross_entity
    note: "PRIORITY PAIR B, lower half."
  - rule_id: job_single_active_per_order
    applies_to: "POST /lab-jobs"
    priority: 285
    condition: "the order already has a LabJob whose status is neither SCRAPPED nor RELEASED"
    error_id: ERR_ACTIVE_LAB_JOB_EXISTS
    category: uniqueness
    note: >-
      Deliberately ordered ABOVE job_order_state: an order that is IN_LAB always has an active job,
      so the specific "you already have a job" answer must win over the generic state answer,
      otherwise ERR_ACTIVE_LAB_JOB_EXISTS would be unreachable.
  - rule_id: job_order_state
    applies_to: "POST /lab-jobs"
    priority: 290
    condition: "RxOrder.fulfillment_status is not LAYOUT_READY or REMAKE_PENDING"
    error_id: ERR_ORDER_STATE_INVALID
    category: state
    note: "Still reachable on a DRAFT order and on a LAB_COMPLETE, DISPENSED or CANCELLED order."
  - rule_id: job_layout_usable
    applies_to: "POST /lab-jobs"
    priority: 310
    condition: "the order's newest FrameLayout has layout_status BLANK_TOO_SMALL or SUPERSEDED, or the order has no layout"
    error_id: ERR_LAYOUT_NOT_USABLE
    category: cross_entity
  - rule_id: job_blank_lot_available
    applies_to: "POST /lab-jobs"
    priority: 320
    condition: "the computed route is SURFACE_AND_EDGE and blank_lot_selection returns the empty set"
    error_id: ERR_NO_ELIGIBLE_BLANK_LOT
    category: cross_entity
  - rule_id: operation_job_version_current
    applies_to: "POST /lab-operations"
    priority: 330
    condition: "expected_lab_job_version differs from LabJob.version"
    error_id: ERR_STALE_LAB_JOB_VERSION
    category: concurrency
  - rule_id: operation_window_wellformed
    applies_to: "POST /lab-operations"
    priority: 340
    condition: "window_end is at or before window_start, or the window is longer than 8 hours"
    error_id: ERR_OPERATION_WINDOW_INVALID
    category: range
  - rule_id: operation_resource_matches_type
    applies_to: "POST /lab-operations"
    priority: 350
    condition: >-
      operation_type SURFACING without a machine_id of machine_type GENERATOR or with a bay_id set,
      or operation_type EDGING without a bay_id or with a machine_id set
    error_id: ERR_RESOURCE_TYPE_MISMATCH
    category: structural
  - rule_id: operation_permitted_for_route
    applies_to: "POST /lab-operations"
    priority: 360
    condition: "operation_type is SURFACING and the LabJob's route is STOCK_EDGE_ONLY"
    error_id: ERR_OPERATION_NOT_PERMITTED_FOR_ROUTE
    category: cross_entity
  - rule_id: machine_available
    applies_to: "POST /lab-operations with operation_type SURFACING"
    priority: 370
    condition: "the LabMachine's status is not AVAILABLE"
    error_id: ERR_MACHINE_NOT_AVAILABLE
    category: cross_entity
    note: "PRIORITY PAIR C, higher half. Beats machine_window_free at 380."
  - rule_id: machine_window_free
    applies_to: "POST /lab-operations with operation_type SURFACING"
    priority: 380
    condition: "machine_bay_occupation_feasibility reports a buffered overlap on that machine"
    error_id: ERR_MACHINE_WINDOW_CONFLICT
    category: temporal
    note: "PRIORITY PAIR C, lower half."
  - rule_id: bay_open
    applies_to: "POST /lab-operations with operation_type EDGING"
    priority: 390
    condition: "the FinishingBay's status is not OPEN"
    error_id: ERR_BAY_NOT_OPEN
    category: cross_entity
  - rule_id: bay_capacity_available
    applies_to: "POST /lab-operations with operation_type EDGING"
    priority: 400
    condition: "the overlapping SCHEDULED or RUNNING count on that bay is already at concurrent_capacity"
    error_id: ERR_BAY_CAPACITY_EXCEEDED
    category: aggregate
  - rule_id: operation_state_permits_action
    applies_to: "POST /lab-operations/{id}/start, /complete, /report-breakage, /cancel"
    priority: 410
    condition: "the LabOperation's status has no transition for the requested action"
    error_id: ERR_OPERATION_STATE_INVALID
    category: state
  - rule_id: operation_job_state_permits_start
    applies_to: "POST /lab-operations/{id}/start"
    priority: 420
    condition: "the LabJob's status does not admit an operation of this operation_type"
    error_id: ERR_LAB_JOB_STATE_INVALID
    category: cross_entity
  - rule_id: breakage_surfacing_only
    applies_to: "POST /lab-operations/{id}/report-breakage"
    priority: 430
    condition: "the operation_type is EDGING"
    error_id: ERR_BREAKAGE_NOT_APPLICABLE
    category: conditional
  - rule_id: inspection_job_state
    applies_to: "POST /quality-inspections"
    priority: 440
    condition: "the LabJob's status is not EDGED"
    error_id: ERR_LAB_JOB_STATE_INVALID
    category: cross_entity
  - rule_id: inspection_eye_not_already_judged
    applies_to: "POST /quality-inspections"
    priority: 450
    condition: "a QualityInspection already exists for the same lab_job_id and eye at cycle_index == LabJob.rework_cycle_count"
    error_id: ERR_EYE_ALREADY_INSPECTED_THIS_CYCLE
    category: uniqueness
  - rule_id: inspection_defect_codes_known
    applies_to: "POST /quality-inspections"
    priority: 460
    condition: >-
      cosmetic_defect_codes contains a string outside the cosmetic vocabulary
      {MINOR_EDGE_CHIP, DEEP_SCRATCH, COATING_CRAZE, INCLUSION, POLISH_HAZE}
    error_id: ERR_UNKNOWN_DEFECT_CODE
    category: range
    note: >-
      cosmetic_defect_codes is structurally only "array of strings", so an unknown member is NOT an
      ERR_VALIDATION at priority 10; it reaches this rule. A non-array value still fails at 10.
  - rule_id: inspection_standard_exists
    applies_to: "POST /quality-inspections"
    priority: 470
    condition: "tolerance_standard_selection returns the empty set for the design type, power band and clock"
    error_id: ERR_NO_TOLERANCE_STANDARD
    category: cross_entity
  - rule_id: inspector_is_not_the_operator
    applies_to: "POST /quality-inspections"
    priority: 480
    condition: "X-User-ID equals performed_by_user_id of any COMPLETED LabOperation of the inspected LabJob"
    error_id: ERR_SEGREGATION_OF_DUTIES
    category: segregation_of_duties
  - rule_id: release_requires_passed_job
    applies_to: "POST /lab-jobs/{id}/release"
    priority: 490
    condition: "the LabJob's status is not PASSED"
    error_id: ERR_LAB_JOB_STATE_INVALID
    category: state
  - rule_id: benefit_billing_state
    applies_to: "POST /rx-orders/{id}/benefit-application"
    priority: 500
    condition: "billing_status is not PROVISIONAL_QUOTED or BENEFIT_VOIDED"
    error_id: ERR_BILLING_STATE_INVALID
    category: state
  - rule_id: benefit_requires_known_route
    applies_to: "POST /rx-orders/{id}/benefit-application"
    priority: 510
    condition: "the order has no LabJob whose status is not SCRAPPED, so the surfacing surcharge and route penalty are undetermined"
    error_id: ERR_ROUTE_NOT_DETERMINED
    category: cross_entity
  - rule_id: benefit_cap_not_exhausted
    applies_to: "POST /rx-orders/{id}/benefit-application"
    priority: 520
    condition: "the patient has an InsurancePlan and cap_remaining_cents is 0"
    error_id: ERR_BENEFIT_CAP_EXHAUSTED
    category: aggregate
  - rule_id: void_billing_state
    applies_to: "POST /rx-orders/{id}/benefit-void"
    priority: 530
    condition: "billing_status is not BENEFIT_APPLIED"
    error_id: ERR_BILLING_STATE_INVALID
    category: state
  - rule_id: settle_billing_state
    applies_to: "POST /rx-orders/{id}/settle-patient-portion"
    priority: 540
    condition: "billing_status is not BENEFIT_APPLIED or SELF_PAY_FINAL"
    error_id: ERR_BILLING_STATE_INVALID
    category: state
  - rule_id: settle_amount_within_balance
    applies_to: "POST /rx-orders/{id}/settle-patient-portion"
    priority: 550
    condition: "amount_cents is not positive, or exceeds patient_balance_due_cents"
    error_id: ERR_SETTLEMENT_AMOUNT_INVALID
    category: range
  - rule_id: dispense_order_state
    applies_to: "POST /rx-orders/{id}/dispense"
    priority: 560
    condition: "fulfillment_status is not LAB_COMPLETE"
    error_id: ERR_ORDER_STATE_INVALID
    category: state
  - rule_id: dispense_balance_cleared
    applies_to: "POST /rx-orders/{id}/dispense"
    priority: 570
    condition: "patient_balance_due_cents is not 0 (a positive balance is unpaid; a negative balance means a refund is owed)"
    error_id: ERR_BALANCE_OUTSTANDING
    category: cross_entity
    note: >-
      Reachable in both directions: LAB_COMPLETE with billing_status BENEFIT_APPLIED and a positive
      balance, and LAB_COMPLETE with billing_status REFUND_DUE and a negative balance.
  - rule_id: cancel_order_state
    applies_to: "POST /rx-orders/{id}/cancel"
    priority: 580
    condition: "fulfillment_status is DISPENSED or CANCELLED"
    error_id: ERR_ORDER_STATE_INVALID
    category: state
  - rule_id: cancel_billing_not_finalized
    applies_to: "POST /rx-orders/{id}/cancel"
    priority: 590
    condition: "billing_status is not PROVISIONAL_QUOTED"
    error_id: ERR_BILLING_ALREADY_FINALIZED
    category: state
  - rule_id: cancel_no_operation_running
    applies_to: "POST /rx-orders/{id}/cancel"
    priority: 600
    condition: "any LabOperation of the order's newest LabJob has status RUNNING"
    error_id: ERR_OPERATION_IN_PROGRESS
    category: cross_entity
  - rule_id: remake_order_state
    applies_to: "POST /remake-cases"
    priority: 610
    condition: "the order's fulfillment_status is not IN_LAB or LAB_COMPLETE"
    error_id: ERR_ORDER_STATE_INVALID
    category: state
  - rule_id: remake_no_open_case
    applies_to: "POST /remake-cases"
    priority: 615
    condition: "a RemakeCase for that LabJob already exists with status SUBMITTED or ADJUDICATED"
    error_id: ERR_OPEN_REMAKE_CASE_EXISTS
    category: uniqueness
    note: >-
      Deliberately ordered ABOVE remake_job_state: opening a case always scraps its LabJob, so a job
      that already carries an open case is necessarily SCRAPPED and the generic job-state answer
      would otherwise make ERR_OPEN_REMAKE_CASE_EXISTS unreachable. Reachable path: open a case on
      job 1, build job 2 (the order returns to IN_LAB), then aim a second case at job 1 again.
  - rule_id: remake_job_state
    applies_to: "POST /remake-cases"
    priority: 620
    condition: "the LabJob's status is not EDGED, PASSED, RELEASED or REWORK_QUEUED"
    error_id: ERR_LAB_JOB_STATE_INVALID
    category: cross_entity
    note: "Still reachable on a QUEUED, SURFACING, EDGING or BLANK_BACKORDER job that carries no case."
  - rule_id: remake_limit_not_reached
    applies_to: "POST /remake-cases"
    priority: 640
    condition: "RxOrder.remake_count is already at MAX_REMAKES_PER_ORDER"
    error_id: ERR_REMAKE_LIMIT_REACHED
    category: aggregate
  - rule_id: remake_inspection_belongs_to_job
    applies_to: "POST /remake-cases"
    priority: 650
    condition: "quality_inspection_id is supplied and its lab_job_id differs from the request's lab_job_id"
    error_id: ERR_INSPECTION_JOB_MISMATCH
    category: referential
  - rule_id: adjudicate_case_state
    applies_to: "POST /remake-cases/{id}/adjudicate"
    priority: 660
    condition: "the RemakeCase's status is not SUBMITTED"
    error_id: ERR_REMAKE_STATE_INVALID
    category: state
  - rule_id: adjudicate_method_needs_inspection
    applies_to: "POST /remake-cases/{id}/adjudicate"
    priority: 670
    condition: "adjudication_method is TOLERANCE_DELTA and the case has no quality_inspection_id"
    error_id: ERR_INSPECTION_REQUIRED_FOR_METHOD
    category: conditional
  - rule_id: adjudicator_is_not_the_inspector
    applies_to: "POST /remake-cases/{id}/adjudicate"
    priority: 680
    condition: "X-User-ID equals the inspector_user_id of the case's linked QualityInspection"
    error_id: ERR_SEGREGATION_OF_DUTIES
    category: segregation_of_duties
  - rule_id: close_case_state
    applies_to: "POST /remake-cases/{id}/close"
    priority: 690
    condition: "the RemakeCase's status is not ADJUDICATED"
    error_id: ERR_REMAKE_STATE_INVALID
    category: state
  - rule_id: close_requires_delivered_remake
    applies_to: "POST /remake-cases/{id}/close"
    priority: 700
    condition: "the RxOrder behind the case is not in fulfillment_status LAB_COMPLETE or DISPENSED"
    error_id: ERR_REMAKE_NOT_DELIVERABLE
    category: cross_entity
  - rule_id: replenish_quantity_positive
    applies_to: "POST /lens-blank-lots/{id}/replenish"
    priority: 710
    condition: "added_qty is not a positive integer"
    error_id: ERR_VALIDATION
    category: range

# ---------------------------------------------------------------------------
# §1.5 Endpoint Table
#
# api_prefix is the empty string, so every path below is also the full URL path.
# Every path parameter is named {id} and always addresses the collection it sits under.
# Every request carries X-Role; every request that records an acting identity also carries
# X-User-ID (see §1.7).
# ---------------------------------------------------------------------------

endpoints:
  # --- logical clock -------------------------------------------------------
  - method: POST
    path: /_clock/set_current_utc
    purpose: "Advance the logical clock. Test-driving endpoint; the clock starts at 2026-08-01T00:00:00Z."
    roles: [StoreOptician, Prescriber, LabTechnician, QualityInspector, LabManager, BenefitsAdministrator]
    input: [current_utc]
    output: "{ current_utc: string }"
    side_effects:
      - "sets the logical clock used by every temporal rule; must be monotonically non-decreasing"

  # --- Prescriber ----------------------------------------------------------
  - method: POST
    path: /prescribers
    purpose: "Register a prescriber of record."
    roles: [StoreOptician, LabManager]
    input: [npi, full_name, license_state, "max_rx_validity_months?"]
    output: Prescriber
    side_effects: ["creates Prescriber in ACTIVE with verified_rx_count 0"]
  - method: GET
    path: /prescribers/{id}
    purpose: "Read one prescriber, including the derived verified_rx_count."
    roles: [StoreOptician, Prescriber, LabTechnician, QualityInspector, LabManager, BenefitsAdministrator]
    input: []
    output: Prescriber
    side_effects: []
  - method: GET
    path: /prescribers
    purpose: "List prescribers."
    roles: [StoreOptician, Prescriber, LabTechnician, QualityInspector, LabManager, BenefitsAdministrator]
    input: ["status?", "license_state?", "limit?", "offset?"]
    output: "Prescriber[]"
    side_effects: []
  - method: PATCH
    path: /prescribers/{id}/status
    purpose: "Change a prescriber's standing; SUSPENDED or RETIRED starts the standing cascade."
    roles: [LabManager]
    input: [status]
    output: Prescriber
    side_effects:
      - "HOP 1: sets Prescriber.status"
      - "HOP 2: every VERIFIED PrescriptionRecord of this prescriber -> REJECTED with verification_note 'PRESCRIBER_STANDING_LOST'"
      - "HOP 3: every RxOrder on those prescriptions in fulfillment_status DRAFT or LAYOUT_READY is cancelled with the full cancel side-effect set"
      - "recomputes verified_rx_count"

  # --- InsurancePlan -------------------------------------------------------
  - method: POST
    path: /insurance-plans
    purpose: "Define a vision plan's allowances, coinsurance share and annual cap."
    roles: [BenefitsAdministrator]
    input: [plan_code, frame_allowance_cents, lens_base_allowance_cents, coating_allowance_cents, progressive_copay_cents, coinsurance_pct, annual_benefit_cap_cents, "expedite_covered?", "specialty_requires_prior_auth?"]
    output: InsurancePlan
    side_effects: ["creates InsurancePlan"]
  - method: GET
    path: /insurance-plans/{id}
    purpose: "Read one plan."
    roles: [StoreOptician, LabManager, BenefitsAdministrator]
    input: []
    output: InsurancePlan
    side_effects: []

  # --- Patient -------------------------------------------------------------
  - method: POST
    path: /patients
    purpose: "Register a patient, optionally attached to a plan."
    roles: [StoreOptician, BenefitsAdministrator]
    input: [full_name, date_of_birth, "insurance_plan_id?", "member_number?", "benefit_period_start?"]
    output: Patient
    side_effects: ["creates Patient in ACTIVE with benefit_used_cents 0"]
  - method: GET
    path: /patients/{id}
    purpose: "Read one patient, including the derived rolling benefit_used_cents."
    roles: [StoreOptician, LabManager, BenefitsAdministrator]
    input: []
    output: Patient
    side_effects: []
  - method: GET
    path: /patients
    purpose: "List patients, optionally filtered by plan."
    roles: [StoreOptician, LabManager, BenefitsAdministrator]
    input: ["insurance_plan_id?", "status?", "limit?", "offset?"]
    output: "Patient[]"
    side_effects: []

  # --- LensDesign / ToleranceStandard -------------------------------------
  - method: POST
    path: /lens-designs
    purpose: "Publish a lens design (type, material, coatings, tier, price, geometry minimums)."
    roles: [LabManager]
    input: [design_code, design_type, material, allowed_coatings, retail_price_cents, min_fitting_height_mm, min_blank_diameter_mm, product_tier, "stock_sku_available?", "base_curve?"]
    output: LensDesign
    side_effects: ["creates LensDesign"]
  - method: GET
    path: /lens-designs/{id}
    purpose: "Read one lens design."
    roles: [StoreOptician, LabTechnician, QualityInspector, LabManager, BenefitsAdministrator]
    input: []
    output: LensDesign
    side_effects: []
  - method: POST
    path: /tolerance-standards
    purpose: "Publish an inspection tolerance standard for a design type and power band, effective from a date."
    roles: [LabManager]
    input: [design_type, power_band_min_abs, power_band_max_abs, sphere_tolerance_diopters, cylinder_tolerance_diopters, axis_tolerance_degrees, prism_tolerance_pd, allowed_cosmetic_defect_codes, effective_from]
    output: ToleranceStandard
    side_effects: ["creates ToleranceStandard; becomes selectable once effective_from is at or before the clock"]
  - method: GET
    path: /tolerance-standards/{id}
    purpose: "Read one tolerance standard."
    roles: [LabTechnician, QualityInspector, LabManager]
    input: []
    output: ToleranceStandard
    side_effects: []

  # --- LensBlankLot --------------------------------------------------------
  - method: POST
    path: /lens-blank-lots
    purpose: "Receive a lot of semi-finished blanks for a design at a given diameter."
    roles: [LabManager]
    input: [lens_design_id, blank_sku, diameter_mm, received_qty, received_on]
    output: LensBlankLot
    side_effects: ["creates LensBlankLot in AVAILABLE with on_hand_qty == received_qty and allocated/consumed/scrapped 0"]
  - method: GET
    path: /lens-blank-lots/{id}
    purpose: "Read one blank lot with its full quantity ledger."
    roles: [LabTechnician, QualityInspector, LabManager]
    input: []
    output: LensBlankLot
    side_effects: []
  - method: GET
    path: /lens-blank-lots
    purpose: "List blank lots, optionally filtered by design or status."
    roles: [LabTechnician, QualityInspector, LabManager]
    input: ["lens_design_id?", "status?", "limit?", "offset?"]
    output: "LensBlankLot[]"
    side_effects: []
  - method: POST
    path: /lens-blank-lots/{id}/replenish
    purpose: "Add blanks to an existing lot and promote jobs waiting in BLANK_BACKORDER."
    roles: [LabManager]
    input: [added_qty]
    output: LensBlankLot
    side_effects:
      - "received_qty += added_qty and on_hand_qty += added_qty"
      - "status DEPLETED -> AVAILABLE"
      - "promotes BLANK_BACKORDER jobs for the lot's design in created_at ASC order, one blank each, until on_hand_qty is exhausted; each promoted job moves to QUEUED with blank_lot_id set"

  # --- LabMachine / FinishingBay ------------------------------------------
  - method: POST
    path: /lab-machines
    purpose: "Commission a surfacing generator or polisher with its calibration buffer."
    roles: [LabManager]
    input: [machine_code, machine_type, "calibration_buffer_minutes?"]
    output: LabMachine
    side_effects: ["creates LabMachine in AVAILABLE"]
  - method: GET
    path: /lab-machines/{id}
    purpose: "Read one machine."
    roles: [LabTechnician, QualityInspector, LabManager]
    input: []
    output: LabMachine
    side_effects: []
  - method: PATCH
    path: /lab-machines/{id}/status
    purpose: "Put a machine on calibration hold or take it down."
    roles: [LabManager]
    input: [status]
    output: LabMachine
    side_effects:
      - "sets LabMachine.status"
      - "already-RUNNING operations are unaffected; new SURFACING starts on this machine are refused while it is not AVAILABLE"
  - method: POST
    path: /finishing-bays
    purpose: "Open a finishing bay with a concurrent edging capacity."
    roles: [LabManager]
    input: [bay_code, concurrent_capacity]
    output: FinishingBay
    side_effects: ["creates FinishingBay in OPEN"]
  - method: PATCH
    path: /finishing-bays/{id}/status
    purpose: "Open or close a finishing bay."
    roles: [LabManager]
    input: [status]
    output: FinishingBay
    side_effects:
      - "sets FinishingBay.status"
      - "already-RUNNING edging operations are unaffected; new EDGING starts in this bay are refused while it is CLOSED"
  - method: GET
    path: /finishing-bays/{id}
    purpose: "Read one finishing bay."
    roles: [LabTechnician, QualityInspector, LabManager]
    input: []
    output: FinishingBay
    side_effects: []

  # --- PrescriptionRecord --------------------------------------------------
  - method: POST
    path: /prescriptions
    purpose: "Intake a prescription with the prescriber identity claimed on the paper Rx."
    roles: [StoreOptician]
    input: [patient_id, prescriber_id, prescriber_npi_claimed, prescriber_license_state_claimed, sphere_od, cylinder_od, "axis_od?", sphere_os, cylinder_os, "axis_os?", "add_power?", "prism_od?", "prism_os?", pd_distance_mm, issued_on]
    output: PrescriptionRecord
    side_effects:
      - "creates PrescriptionRecord in UNVERIFIED with resubmit_count 0"
      - "computes expires_at per rx_expiration_window and requires_multifocal from add_power"
      - "input-to-field mapping: the single add_power input is stored on BOTH add_power_od and add_power_os; prism_od is stored as prism_diopter_od and prism_os as prism_diopter_os; an omitted add_power stores null on both add fields and an omitted prism stores 0.00"
  - method: GET
    path: /prescriptions/{id}
    purpose: "Read one prescription with its computed expiry and verification state."
    roles: [StoreOptician, Prescriber, LabTechnician, QualityInspector, LabManager, BenefitsAdministrator]
    input: []
    output: PrescriptionRecord
    side_effects: []
  - method: GET
    path: /prescriptions
    purpose: "List prescriptions, optionally filtered by prescriber, patient or verification state."
    roles: [StoreOptician, Prescriber, LabTechnician, QualityInspector, LabManager, BenefitsAdministrator]
    input: ["prescriber_id?", "patient_id?", "verification_status?", "limit?", "offset?"]
    output: "PrescriptionRecord[]"
    side_effects: []
  - method: POST
    path: /prescriptions/{id}/verify
    purpose: "Optician verification against the prescriber record."
    roles: [StoreOptician]
    input: ["verification_note?"]
    output: PrescriptionRecord
    side_effects:
      - "UNVERIFIED -> VERIFIED with verified_at set"
      - "recomputes Prescriber.verified_rx_count"
  - method: POST
    path: /prescriptions/{id}/prescriber-attest
    purpose: "Prescriber self-attestation, which verifies without the npi/license comparison."
    roles: [Prescriber]
    input: [attestation_statement]
    output: PrescriptionRecord
    side_effects:
      - "UNVERIFIED -> VERIFIED with verified_at set and verification_note = attestation_statement"
      - "recomputes Prescriber.verified_rx_count"
  - method: POST
    path: /prescriptions/{id}/reject
    purpose: "Reject a prescription that does not match the prescriber record."
    roles: [StoreOptician]
    input: [verification_note]
    output: PrescriptionRecord
    side_effects: ["UNVERIFIED or VERIFIED -> REJECTED; clears verified_at; recomputes Prescriber.verified_rx_count"]
  - method: POST
    path: /prescriptions/{id}/resubmit
    purpose: "Correct and resubmit a rejected prescription."
    roles: [StoreOptician]
    input: ["corrected_issued_on?", "corrected_pd_distance_mm?"]
    output: PrescriptionRecord
    side_effects:
      - "REJECTED -> UNVERIFIED; resubmit_count += 1; verification_note cleared"
      - "recomputes expires_at when corrected_issued_on is supplied"

  # --- RxOrder -------------------------------------------------------------
  - method: POST
    path: /rx-orders
    purpose: "Open an order against a verified, unexpired prescription and a lens design."
    roles: [StoreOptician]
    input: [patient_id, prescription_id, lens_design_id, frame_sku, frame_retail_cents, requested_coatings, monocular_pd_od_mm, monocular_pd_os_mm, fitting_height_mm, "expedite_requested?", "prior_auth_reference?"]
    output: RxOrder
    side_effects:
      - "creates RxOrder in fulfillment_status DRAFT and billing_status PROVISIONAL_QUOTED"
      - "copies product_tier from LensDesign"
      - "runs order_quote_and_patient_portion variant PROVISIONAL and turnaround_and_expedite_fee variant PROVISIONAL"
      - "sets created_by_optician_id = X-User-ID"
  - method: GET
    path: /rx-orders/{id}
    purpose: "Read one order with both state dimensions, the money block and the TAT commitment."
    roles: [StoreOptician, Prescriber, LabTechnician, QualityInspector, LabManager, BenefitsAdministrator]
    input: []
    output: RxOrder
    side_effects: []
  - method: GET
    path: /rx-orders
    purpose: "List orders with filters and pagination."
    roles: [StoreOptician, LabTechnician, QualityInspector, LabManager, BenefitsAdministrator]
    input: ["patient_id?", "prescription_id?", "lens_design_id?", "fulfillment_status?", "billing_status?", "tat_commitment_status?", "limit?", "offset?"]
    output: "RxOrder[]"
    side_effects: []
  - method: GET
    path: /rx-orders/{id}/charge-summary
    purpose: "Computed read that reconciles the order's money block and asserts the conservation invariant."
    roles: [StoreOptician, LabManager, BenefitsAdministrator]
    input: []
    output: "{ gross_charge_cents: integer, estimated_benefit_cents: integer, insurance_benefit_cents: integer, patient_portion_cents: integer, lab_writeoff_cents: integer, patient_paid_cents: integer, patient_balance_due_cents: integer, expedite_fee_cents: integer, quote_variant: string, invariant_holds: boolean }"
    side_effects: []
  - method: POST
    path: /rx-orders/{id}/benefit-application
    purpose: "Finalize the quote against the actual lab route and apply the insurance benefit."
    roles: [BenefitsAdministrator]
    input: []
    output: RxOrder
    side_effects:
      - "runs order_quote_and_patient_portion variant FINAL and benefit_application_waterfall with the annual cap"
      - "billing_status -> BENEFIT_APPLIED (insured) or SELF_PAY_FINAL (self-pay)"
      - "appends an ORDER_CHARGE SettlementEntry, plus an INSURANCE_BENEFIT entry when the benefit is positive"
      - "recomputes Patient.benefit_used_cents"
  - method: POST
    path: /rx-orders/{id}/benefit-void
    purpose: "Reverse an applied benefit and return the patient portion to the full uncovered amount."
    roles: [BenefitsAdministrator]
    input: []
    output: RxOrder
    side_effects:
      - "appends a BENEFIT_REVERSAL SettlementEntry equal to the benefit being reversed"
      - "insurance_benefit_cents -> 0, benefit_applied_at -> null, billing_status -> BENEFIT_VOIDED"
      - "patient_portion_cents = gross_charge_cents - lab_writeoff_cents"
      - "Patient.benefit_used_cents returns to its exact pre-application value"
  - method: POST
    path: /rx-orders/{id}/settle-patient-portion
    purpose: "Record a patient payment against the outstanding balance."
    roles: [StoreOptician]
    input: [amount_cents]
    output: RxOrder
    side_effects:
      - "patient_paid_cents += amount_cents and appends a PATIENT_PAYMENT SettlementEntry"
      - "billing_status -> PATIENT_SETTLED only when the payment zeroes patient_balance_due_cents"
  - method: POST
    path: /rx-orders/{id}/dispense
    purpose: "Hand the finished eyewear to the patient."
    roles: [StoreOptician]
    input: []
    output: RxOrder
    side_effects: ["fulfillment_status LAB_COMPLETE -> DISPENSED; the order becomes doubly terminal on the fulfillment dimension"]
  - method: POST
    path: /rx-orders/{id}/cancel
    purpose: "Cancel an order, unwinding the lab job, its scheduled operations and its blank allocation."
    roles: [StoreOptician]
    input: []
    output: RxOrder
    side_effects:
      - "every SCHEDULED LabOperation of the newest LabJob -> CANCELLED"
      - "the newest LabJob -> SCRAPPED with scrap_reason ORDER_CANCELLED"
      - "any held blank allocation is returned: allocated_qty -= 1, on_hand_qty += 1, DEPLETED -> AVAILABLE"
      - "fulfillment_status -> CANCELLED, billing_status -> CANCELLED_NO_CHARGE, every money field zeroed"
  - method: GET
    path: /rx-orders/{id}/frame-layouts
    purpose: "Every trace and layout computed for the order, newest first."
    roles: [StoreOptician, LabTechnician, QualityInspector, LabManager]
    input: ["layout_status?"]
    output: "FrameLayout[]"
    side_effects: []
  - method: GET
    path: /rx-orders/{id}/settlement-entries
    purpose: "The order's immutable money ledger in effective_at order."
    roles: [StoreOptician, LabManager, BenefitsAdministrator]
    input: ["entry_type?"]
    output: "SettlementEntry[]"
    side_effects: []

  # --- FrameLayout ---------------------------------------------------------
  - method: POST
    path: /frame-layouts
    purpose: "Record a frame trace and compute the layout, decentration and minimum blank."
    roles: [StoreOptician]
    input: [rx_order_id, expected_rx_order_version, trace_source, a_mm, b_mm, ed_mm, dbl_mm, "fitting_height_override_mm?"]
    output: FrameLayout
    side_effects:
      - "computes the geometry per frame_layout_geometry and sets layout_status COMPUTED or BLANK_TOO_SMALL"
      - "supersedes every earlier FrameLayout of the order"
      - "moves RxOrder DRAFT -> LAYOUT_READY regardless of the computed layout_status"
      - "increments RxOrder.version"
  - method: GET
    path: /frame-layouts/{id}
    purpose: "Read one layout."
    roles: [StoreOptician, LabTechnician, QualityInspector, LabManager]
    input: []
    output: FrameLayout
    side_effects: []

  # --- LabJob --------------------------------------------------------------
  - method: POST
    path: /lab-jobs
    purpose: "Release the order to the lab: pick the route, allocate a blank if surfacing is needed, and re-promise the turnaround."
    roles: [LabTechnician]
    input: [rx_order_id]
    output: LabJob
    side_effects:
      - "creates LabJob in QUEUED with route from lab_route_determination and frame_layout_id = the newest COMPUTED layout"
      - "for SURFACE_AND_EDGE: allocates a blank per blank_lot_selection (on_hand_qty -= 1, allocated_qty += 1, DEPLETED at 0)"
      - "RxOrder LAYOUT_READY or REMAKE_PENDING -> IN_LAB"
      - "recomputes promised_tat_hours and promised_due_at with turnaround_and_expedite_fee variant ROUTE_ACTUAL; the money block (gross_charge_cents, expedite_fee_cents, estimated_benefit_cents, patient_portion_cents) is deliberately left at its PROVISIONAL values until benefit-application"
  - method: GET
    path: /lab-jobs/{id}
    purpose: "Read one lab job, including its version for OCC and its rework and breakage counters."
    roles: [StoreOptician, LabTechnician, QualityInspector, LabManager]
    input: []
    output: LabJob
    side_effects: []
  - method: GET
    path: /lab-jobs
    purpose: "List lab jobs with filters."
    roles: [StoreOptician, LabTechnician, QualityInspector, LabManager]
    input: ["rx_order_id?", "frame_layout_id?", "blank_lot_id?", "status?", "route?", "limit?", "offset?"]
    output: "LabJob[]"
    side_effects: []
  - method: POST
    path: /lab-jobs/{id}/release
    purpose: "Release a PASSED job to the store and stop the turnaround clock."
    roles: [LabTechnician]
    input: []
    output: LabJob
    side_effects:
      - "LabJob PASSED -> RELEASED with released_at set"
      - "for SURFACE_AND_EDGE: allocated_qty -= 1 and consumed_qty += 1 on the blank lot"
      - "RxOrder IN_LAB -> LAB_COMPLETE and tat_commitment_status -> BREACHED when the clock is past promised_due_at"

  # --- LabOperation --------------------------------------------------------
  - method: POST
    path: /lab-operations
    purpose: "Book a surfacing window on a machine or an edging window in a bay."
    roles: [LabTechnician]
    input: [lab_job_id, expected_lab_job_version, operation_type, window_start, window_end, "machine_id?", "bay_id?"]
    output: LabOperation
    side_effects:
      - "creates LabOperation in SCHEDULED after machine_bay_occupation_feasibility clears the window"
      - "increments LabJob.version"
  - method: GET
    path: /lab-operations/{id}
    purpose: "Read one operation."
    roles: [StoreOptician, LabTechnician, QualityInspector, LabManager]
    input: []
    output: LabOperation
    side_effects: []
  - method: GET
    path: /lab-operations
    purpose: "List operations with filters, used to inspect resource occupation."
    roles: [StoreOptician, LabTechnician, QualityInspector, LabManager]
    input: ["lab_job_id?", "machine_id?", "bay_id?", "blank_lot_id?", "operation_type?", "status?", "limit?", "offset?"]
    output: "LabOperation[]"
    side_effects: []
  - method: POST
    path: /lab-operations/{id}/start
    purpose: "Begin the booked operation and record the operator identity."
    roles: [LabTechnician]
    input: []
    output: LabOperation
    side_effects:
      - "SCHEDULED -> RUNNING with performed_by_user_id = X-User-ID"
      - "LabJob -> SURFACING or EDGING; increments LabJob.version"
  - method: POST
    path: /lab-operations/{id}/complete
    purpose: "Finish the operation."
    roles: [LabTechnician]
    input: []
    output: LabOperation
    side_effects:
      - "RUNNING -> COMPLETED"
      - "LabJob -> SURFACED or EDGED; increments LabJob.version"
  - method: POST
    path: /lab-operations/{id}/report-breakage
    purpose: "Report a blank broken on the generator and either re-allocate or fall into backorder."
    roles: [LabTechnician]
    input: [breakage_reason]
    output: LabOperation
    side_effects:
      - "RUNNING -> BROKEN; LabJob.breakage_count += 1; the held blank is scrapped (allocated_qty -= 1, scrapped_qty += 1)"
      - "a replacement blank exists: it is allocated and LabJob -> QUEUED"
      - "no replacement blank exists: LabJob -> BLANK_BACKORDER, RxOrder.promised_due_at += 48 hours, tat_commitment_status -> AT_RISK"
  - method: POST
    path: /lab-operations/{id}/cancel
    purpose: "Drop a booked operation and free the machine or bay window."
    roles: [LabTechnician]
    input: [cancel_reason]
    output: LabOperation
    side_effects:
      - "SCHEDULED -> CANCELLED; the window stops occupying its resource"
      - "increments LabJob.version"

  # --- QualityInspection ---------------------------------------------------
  - method: POST
    path: /quality-inspections
    purpose: "Inspect one eye against the effective tolerance standard for power, axis, prism and cosmetics."
    roles: [QualityInspector]
    input: [lab_job_id, eye, measured_sphere, measured_cylinder, "measured_axis?", measured_prism, "cosmetic_defect_codes?"]
    output: QualityInspection
    side_effects:
      - "selects the standard per tolerance_standard_selection and computes every delta, failed_metrics and the verdict"
      - "records inspector_user_id = X-User-ID and cycle_index = LabJob.rework_cycle_count"
      - "PASS completing the OD/OS pair at the current cycle: LabJob EDGED -> PASSED"
      - "FAIL below the rework cap: LabJob EDGED -> REWORK_QUEUED and rework_cycle_count += 1"
      - "FAIL at the rework cap: LabJob -> SCRAPPED with scrap_reason REWORK_LIMIT and the blank scrapped"
  - method: GET
    path: /quality-inspections/{id}
    purpose: "Read one inspection with its deltas and failed metrics."
    roles: [StoreOptician, LabTechnician, QualityInspector, LabManager]
    input: []
    output: QualityInspection
    side_effects: []
  - method: GET
    path: /quality-inspections
    purpose: "List inspections with filters."
    roles: [StoreOptician, LabTechnician, QualityInspector, LabManager]
    input: ["lab_job_id?", "tolerance_standard_id?", "eye?", "verdict?", "cycle_index?", "limit?", "offset?"]
    output: "QualityInspection[]"
    side_effects: []

  # --- RemakeCase ----------------------------------------------------------
  - method: POST
    path: /remake-cases
    purpose: "Open a remake or warranty case, scrapping the job and reopening the order."
    roles: [StoreOptician]
    input: [lab_job_id, defect_codes, warranty_claim, "quality_inspection_id?"]
    output: RemakeCase
    side_effects:
      - "HOP 1: creates RemakeCase in SUBMITTED with warranty_covered per warranty_coverage_window; the LabJob -> SCRAPPED and any held blank is returned to its lot"
      - "HOP 2: RxOrder -> REMAKE_PENDING and remake_count += 1"
      - "HOP 3: when warranty_covered, remake_writeoff_and_chargeback raises lab_writeoff_cents, lowers patient_portion_cents and appends a LAB_WRITEOFF SettlementEntry"
      - "HOP 4: when patient_paid_cents now exceeds patient_portion_cents, billing_status PATIENT_SETTLED -> REFUND_DUE"
  - method: GET
    path: /remake-cases/{id}
    purpose: "Read one remake case with its responsibility split and chargeback."
    roles: [StoreOptician, LabTechnician, QualityInspector, LabManager]
    input: []
    output: RemakeCase
    side_effects: []
  - method: GET
    path: /remake-cases
    purpose: "List remake cases with filters."
    roles: [StoreOptician, LabTechnician, QualityInspector, LabManager]
    input: ["lab_job_id?", "quality_inspection_id?", "status?", "responsibility?", "limit?", "offset?"]
    output: "RemakeCase[]"
    side_effects: []
  - method: POST
    path: /remake-cases/{id}/adjudicate
    purpose: "Assign responsibility between store and lab by defect audit or by measured tolerance severity."
    roles: [LabManager]
    input: [adjudication_method]
    output: RemakeCase
    side_effects:
      - "runs remake_responsibility_split with the chosen variant, setting lab_share_pct, responsibility and lab_chargeback_cents"
      - "SUBMITTED -> ADJUDICATED"
  - method: POST
    path: /remake-cases/{id}/close
    purpose: "Close an adjudicated case once the replacement eyewear has actually been produced."
    roles: [LabManager]
    input: []
    output: RemakeCase
    side_effects: ["ADJUDICATED -> CLOSED; the case becomes immutable"]

