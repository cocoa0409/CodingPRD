# ============================================================================
# PRD-Bench Scaffold — Defensible Space & Fuels Inspection Program
# Difficulty band: Expert+ (14 entities / 62 endpoints / 40 error codes /
#                  7 calculations / 7 state machines / 2 OCC races)
# ============================================================================

scenario: |
  Generate task harder than expert level!

  2626. Defensible Space & Fuels Inspection Program (fire protection district): parcel inventory in the wildland urban interface with risk classification and inspection priority, inspection scheduling with property owner notice and access arrangements, evaluation against defensible space zone requirements for vegetation clearance, ember-resistant zones and structure hardening, violation notice with compliance deadlines, reinspection and abatement authority including contractor abatement with cost recovery, chipper day, curbside collection and cost-share programs to support compliance, insurance and real estate transaction documentation requests for compliance certificates, community-level certification programs with neighborhood organizing, program metrics on compliance rate and correlation with structure survival

domain_name: defensible-space-fuels-inspection
api_prefix: /fire-district

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: temporal_windowing
  complexity_layers:
    - cascading_side_effects
    - dual_variant_calculation
    - optimistic_concurrency
    - ops_run_checkpoint

  entity_topology: flat
  # Every entity is a peer collection under /fire-district/<collection>. Ownership is
  # expressed purely through FK fields carried in request bodies or in a single nested
  # creation segment; no entity is addressed through a multi-level ownership path.

  state_machine_shape: cyclic
  # Inspection cycles ACCESS_DENIED -> SCHEDULED -> NOTICED -> ACCESS_DENIED; Community
  # cycles DEFERRED/LAPSED -> ORGANIZING -> SUBMITTED; ViolationNotice branches
  # ISSUED -> {EXTENDED, OVERDUE, CLEARED, VOIDED} with divergent side-effect sets.

  relationship_patterns:
    - one_to_many          # Parcel -> Inspection, Inspection -> ZoneEvaluation
    - self_referential     # ViolationNotice.supersedes_notice_id -> ViolationNotice.id
    - cross_aggregate      # AbatementOrder -> ViolationNotice -> Inspection -> Parcel -> Community
    - polymorphic          # CostRecoveryPayment.allocation buckets keyed by cost-line kind

  role_model: segregation_of_duties
  # The Inspector who completed the failing Inspection that produced a ViolationNotice
  # MUST NOT be the Inspector who verifies the abatement work performed under it.

  consistency_model: immediate

# ============================================================================
# 1.1 Entity-Relationship Table
# ============================================================================

entities:

  - name: InspectionCycle
    parent: null
    common_fields: true
    fields:
      - name: season_year
        type: integer
        source: input
        description: Fire-season program year this inspection cycle governs.
        constraints: "2020 <= season_year <= 2100; unique across InspectionCycle"
      - name: status
        type: enum
        source: system
        description: Cycle lifecycle state; gates every Inspection and SupportProgram operation inside it.
        default: PLANNING
        constraints: "PLANNING | ACTIVE | CLOSED"
      - name: notice_lead_days
        type: integer
        source: input
        description: Minimum whole days required between an Inspection's notice_sent_at_utc and its scheduled_start_utc.
        default: 10
        constraints: ">= 0"
      - name: invoice_due_days
        type: integer
        source: input
        description: Whole days after an AbatementOrder reaches INVOICED before an unpaid balance is converted to a lien at the next cycle advance.
        default: 45
        constraints: ">= 1"
      - name: epoch
        type: integer
        source: system
        description: Ops-run checkpoint counter; incremented by exactly 1 on every successful cycle advance.
        default: 0
      - name: activated_at_utc
        type: datetime
        source: system
        description: Logical-clock instant at which the cycle moved PLANNING -> ACTIVE; null while PLANNING.
      - name: closed_at_utc
        type: datetime
        source: system
        description: Logical-clock instant at which the cycle moved ACTIVE -> CLOSED; null before that.

  - name: Community
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: Neighborhood name used for the community-level certification program.
        constraints: "non-empty; unique across Community"
      - name: organizer_name
        type: string
        source: input
        description: Volunteer neighborhood organizer of record.
      - name: target_certification_year
        type: integer
        source: input
        description: Program year the neighborhood is organizing toward.
        constraints: "2020 <= target_certification_year <= 2100"
      - name: status
        type: enum
        source: system
        description: Community certification lifecycle state.
        default: ORGANIZING
        constraints: "ORGANIZING | SUBMITTED | CERTIFIED | DEFERRED | LAPSED"
      - name: parcels_outreached_count
        type: integer
        source: system
        description: Door-to-door outreach count supplied on the certification submission; 0 until a submission is recorded.
        default: 0
      - name: compliance_rate_pct
        type: number
        source: computed
        description: "Community-scoped compliance rate from calculations.program_compliance_metrics (community_scope variant); null when the eligible member-Parcel set is empty."
        constraints: "0.00 <= compliance_rate_pct <= 100.00, 2 decimals, or null"
      - name: certified_at_utc
        type: datetime
        source: system
        description: Logical-clock instant of the most recent CERTIFY decision; null if never certified.
      - name: lapse_count
        type: integer
        source: system
        description: Number of times this Community has fallen CERTIFIED -> LAPSED at a cycle advance.
        default: 0

  - name: Parcel
    parent: null
    common_fields: true
    fields:
      - name: apn
        type: string
        source: input
        description: Assessor parcel number identifying the WUI parcel.
        constraints: "non-empty; unique across Parcel"
      - name: owner_name
        type: string
        source: input
        description: Property owner of record for notice service.
      - name: owner_email
        type: string
        source: input
        description: Email address used when notice_method is EMAIL.
      - name: situs_address
        type: string
        source: input
        description: Physical situs address of the parcel.
      - name: community_id
        type: string
        source: input
        description: "FK -> Community.id; null for parcels outside any organized community."
      - name: structure_present
        type: boolean
        source: input
        description: Whether a habitable structure exists on the parcel.
        default: true
      - name: roof_class
        type: enum
        source: input
        description: Roof assembly fire rating driving the structure subscore.
        constraints: "CLASS_A | CLASS_B | CLASS_C | NONE"
      - name: vegetation_type
        type: enum
        source: input
        description: Dominant fuel model reported at intake; drives the self-reported vegetation subscore.
        constraints: "IRRIGATED_LANDSCAPE | GRASS | BRUSH | MIXED_CONIFER"
      - name: slope_pct
        type: number
        source: input
        description: Average parcel slope in percent; drives both the slope subscore and the zone clearance slope factor.
        constraints: "0 <= slope_pct <= 100"
      - name: lot_area_sqft
        type: integer
        source: input
        description: Recorded lot area in square feet.
        constraints: ">= 1"
      - name: hazard_zone
        type: enum
        source: input
        description: State-mapped fire hazard severity zone; supplies the risk multiplier and shortens compliance deadlines.
        constraints: "MODERATE | HIGH | VERY_HIGH"
      - name: access_constraint
        type: enum
        source: input
        description: Field-access impediment recorded for inspection planning.
        constraints: "NONE | GATED | LOCKED_GATE | DOG_ON_SITE"
      - name: owner_hardship_flag
        type: boolean
        source: input
        description: Income/senior hardship determination enabling the cost-share hardship bonus.
        default: false
      - name: exemption_flag
        type: boolean
        source: input
        description: District-granted program exemption; when true the parcel is excluded from compliance-rate denominators.
        default: false
      - name: risk_score
        type: number
        source: computed
        description: "Output of calculations.parcel_risk_score under the variant named by risk_score_basis."
        constraints: "0.00 <= risk_score <= 100.00, 2 decimals"
      - name: risk_score_basis
        type: enum
        source: computed
        description: Which parcel_risk_score variant produced the current risk_score.
        default: INTAKE_PROVISIONAL
        constraints: "INTAKE_PROVISIONAL | POST_INSPECTION_VERIFIED"
      - name: risk_class
        type: enum
        source: computed
        description: "Banded classification of risk_score per calculations.parcel_risk_score thresholds."
        constraints: "LOW | MODERATE | HIGH | EXTREME"
      - name: compliance_status
        type: enum
        source: computed
        description: Derived defensible-space compliance posture used by certificate issuance and program metrics.
        default: PENDING_INSPECTION
        constraints: "PENDING_INSPECTION | COMPLIANT | NON_COMPLIANT | ABATEMENT_PENDING | EXEMPT"
      - name: open_violation_count
        type: integer
        source: computed
        description: "Count of ViolationNotice rows for this parcel whose status IN {ISSUED, EXTENDED, OVERDUE, ABATEMENT_AUTHORIZED}."
        default: 0
      - name: inspection_priority_rank
        type: integer
        source: computed
        description: "1-based dense rank from calculations.inspection_priority_rank, recomputed at every cycle advance; null before the first advance."
      - name: last_passed_inspection_at_utc
        type: datetime
        source: system
        description: completed_at_utc of the most recent Inspection on this parcel whose result is PASS; null if none.
      - name: structure_survival_outcome
        type: enum
        source: system
        description: Post-incident structure outcome recorded for the survival-correlation metric; null until an incident outcome is recorded.
        constraints: "SURVIVED | DESTROYED"
      - name: survival_incident_name
        type: string
        source: system
        description: Incident name attached to structure_survival_outcome; null until recorded.
      - name: survival_incident_date_utc
        type: datetime
        source: system
        description: Incident date attached to structure_survival_outcome; null until recorded.

  - name: Inspector
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: District inspector name.
      - name: certification_level
        type: enum
        source: input
        description: Highest defensible-space certification held; WUI_SPECIALIST is required to inspect VERY_HIGH hazard-zone parcels.
        constraints: "BASIC | ADVANCED | WUI_SPECIALIST"
      - name: status
        type: enum
        source: input
        description: Employment/credential standing; SUSPENDED inspectors cannot be scheduled.
        default: ACTIVE
        constraints: "ACTIVE | SUSPENDED"
      - name: assigned_open_count
        type: integer
        source: computed
        description: "Conserved workload counter; MUST always equal count(Inspection) with this inspector_id whose status IN {SCHEDULED, NOTICED, ACCESS_DENIED}."
        default: 0

  - name: Contractor
    parent: null
    common_fields: true
    fields:
      - name: business_name
        type: string
        source: input
        description: Abatement contractor business name.
        constraints: "non-empty; unique across Contractor"
      - name: hourly_rate_cents
        type: integer
        source: input
        description: Crew labor rate in whole cents per crew-hour used by the cost-recovery labor line.
        constraints: ">= 1"
      - name: mobilization_fee_cents
        type: integer
        source: input
        description: Flat mobilization charge in whole cents added as its own cost-recovery line.
        constraints: ">= 0"
      - name: license_status
        type: enum
        source: input
        description: Contractor licensing standing; only ACTIVE contractors may be awarded work.
        default: ACTIVE
        constraints: "ACTIVE | SUSPENDED | REVOKED"
      - name: insurance_expiry_utc
        type: datetime
        source: input
        description: Liability insurance expiry; an award whose work_start_utc is at or after this instant is rejected.
      - name: max_daily_orders
        type: integer
        source: input
        description: Maximum number of AWARDED/WORK_COMPLETE AbatementOrders whose closed work window covers any single UTC calendar date.
        default: 2
        constraints: ">= 1"
      - name: committed_crew_hours
        type: number
        source: computed
        description: "Conserved reservation quantity; MUST always equal sum(AbatementOrder.crew_hours) over orders of this contractor whose status IN {AWARDED, WORK_COMPLETE}."
        default: 0
      - name: completed_crew_hours
        type: number
        source: computed
        description: "Lifetime settled crew hours; incremented by actual_crew_hours when an order is verified into INVOICED and never decremented."
        default: 0
        constraints: ">= 0, 1 decimal"

  - name: Inspection
    parent: null
    common_fields: true
    fields:
      - name: parcel_id
        type: string
        source: input
        description: "FK -> Parcel.id; the parcel being inspected."
      - name: cycle_id
        type: string
        source: input
        description: "FK -> InspectionCycle.id; the cycle that must be ACTIVE for field operations."
      - name: inspector_id
        type: string
        source: input
        description: "FK -> Inspector.id; currently assigned inspector, reassignable on reschedule."
      - name: inspection_type
        type: enum
        source: input
        description: Why this inspection exists; REINSPECTION is what can clear a ViolationNotice.
        constraints: "INITIAL | REINSPECTION | COMPLAINT"
      - name: scheduled_start_utc
        type: datetime
        source: input
        description: Inclusive start of the half-open inspector occupation window.
      - name: scheduled_end_utc
        type: datetime
        source: input
        description: Exclusive end of the half-open inspector occupation window.
        constraints: "scheduled_end_utc > scheduled_start_utc"
      - name: access_arrangement
        type: enum
        source: input
        description: Access agreed with the property owner for this visit.
        constraints: "EXTERIOR_ONLY | OWNER_PRESENT | GATE_CODE"
      - name: status
        type: enum
        source: system
        description: Inspection lifecycle state.
        default: SCHEDULED
        constraints: "SCHEDULED | NOTICED | ACCESS_DENIED | COMPLETED | CANCELLED | ABANDONED"
      - name: result
        type: enum
        source: input
        description: Field outcome supplied at completion; null until COMPLETED.
        constraints: "PASS | FAIL"
      - name: notice_method
        type: enum
        source: input
        description: How the owner notice for this visit was served; null until the notice is sent.
        constraints: "IN_PERSON | CERTIFIED_MAIL | EMAIL"
      - name: notice_sent_at_utc
        type: datetime
        source: system
        description: Logical-clock instant the owner notice was dispatched; null while SCHEDULED.
      - name: access_denial_count
        type: integer
        source: system
        description: Number of recorded access denials on this inspection; the second denial abandons the inspection.
        default: 0
      - name: measured_veg_points
        type: number
        source: computed
        description: "Output of calculations.zone_deficiency_assessment aggregate step; null until completion."
        constraints: "0.00 <= measured_veg_points <= 100.00, 2 decimals"
      - name: hardening_credit_points
        type: number
        source: computed
        description: "Structure-hardening credit aggregated from HardeningFinding.credit_points, capped per calculations.parcel_risk_score; null until completion."
        constraints: "0.00 <= hardening_credit_points <= 20.00, 2 decimals"
      - name: max_deficiency_severity
        type: enum
        source: computed
        description: "Worst ZoneEvaluation.deficiency_severity on this inspection; drives ViolationNotice.severity. NONE when every zone is compliant."
        constraints: "NONE | MINOR | MAJOR | CRITICAL"
      - name: completed_at_utc
        type: datetime
        source: system
        description: Logical-clock instant of completion; null unless COMPLETED.

  - name: ZoneEvaluation
    parent: null
    common_fields: false
    fields:
      - name: inspection_id
        type: string
        source: input
        description: "FK -> Inspection.id; the inspection this zone finding belongs to."
      - name: zone
        type: enum
        source: input
        description: Defensible-space zone evaluated; at most one evaluation per zone per inspection.
        constraints: "ZONE_0_EMBER | ZONE_1 | ZONE_2"
      - name: measured_clearance_ft
        type: number
        source: input
        description: Measured horizontal clearance achieved in this zone, in feet.
        constraints: ">= 0"
      - name: ladder_fuel_present
        type: boolean
        source: input
        description: Whether continuous ladder fuels were observed in this zone; adds a flat point penalty.
        default: false
      - name: required_clearance_ft
        type: number
        source: computed
        description: "Slope-adjusted required clearance from calculations.zone_deficiency_assessment step 1."
        constraints: "> 0, 1 decimal"
      - name: deficit_ft
        type: number
        source: computed
        description: "max(0, required_clearance_ft - measured_clearance_ft), 1 decimal."
      - name: deficit_ratio
        type: number
        source: computed
        description: "deficit_ft / required_clearance_ft, 4 decimals; the severity band input."
      - name: deficiency_severity
        type: enum
        source: computed
        description: "Severity band of deficit_ratio per calculations.zone_deficiency_assessment step 3."
        constraints: "NONE | MINOR | MAJOR | CRITICAL"
      - name: points
        type: number
        source: computed
        description: "Per-zone deficiency points, rounded to 2 decimals BEFORE the inspection-level sum."
        constraints: "0.00 <= points <= 100.00, 2 decimals"

  - name: HardeningFinding
    parent: null
    common_fields: false
    fields:
      - name: inspection_id
        type: string
        source: input
        description: "FK -> Inspection.id; the inspection this structure-hardening finding belongs to."
      - name: item_code
        type: enum
        source: input
        description: Structure hardening element inspected; at most one finding per item_code per inspection.
        constraints: "EAVE_VENTS | ROOF_ASSEMBLY | DECK_UNDERSIDE | WINDOW_GLAZING | SIDING | GUTTER_DEBRIS"
      - name: status
        type: enum
        source: input
        description: Compliance of this hardening element.
        constraints: "COMPLIANT | DEFICIENT | NOT_APPLICABLE"
      - name: credit_points
        type: number
        source: computed
        description: "HARDENING_CREDIT_PER_ITEM (4.00) when status is COMPLIANT, otherwise 0.00."
        constraints: "0.00 or 4.00"

  - name: ViolationNotice
    parent: null
    common_fields: true
    fields:
      - name: parcel_id
        type: string
        source: input
        description: "FK -> Parcel.id; the parcel cited."
      - name: inspection_id
        type: string
        source: input
        description: "FK -> Inspection.id; the COMPLETED FAIL inspection (or ABANDONED access refusal) that substantiates the citation."
      - name: supersedes_notice_id
        type: string
        source: system
        description: "FK -> ViolationNotice.id; set when this notice replaces a still-open notice on the same parcel, which is driven to VOIDED at creation. Null otherwise."
      - name: notice_method
        type: enum
        source: input
        description: Service method determining delivered_at_utc.
        default: CERTIFIED_MAIL
        constraints: "IN_PERSON | CERTIFIED_MAIL | EMAIL"
      - name: severity
        type: enum
        source: computed
        description: "Copied from the substantiating Inspection.max_deficiency_severity, or CRITICAL for an access-refusal notice."
        constraints: "MINOR | MAJOR | CRITICAL"
      - name: status
        type: enum
        source: system
        description: Notice lifecycle state.
        default: ISSUED
        constraints: "ISSUED | EXTENDED | OVERDUE | ABATEMENT_AUTHORIZED | CLEARED | VOIDED"
      - name: issued_at_utc
        type: datetime
        source: system
        description: Logical-clock instant the notice was created.
      - name: delivered_at_utc
        type: datetime
        source: computed
        description: "Constructive service instant from calculations.notice_compliance_deadline step 1 (issued_at_utc for IN_PERSON/EMAIL, issued_at_utc + MAIL_SERVICE_DAYS for CERTIFIED_MAIL)."
      - name: compliance_days
        type: integer
        source: computed
        description: "Whole days granted for compliance from calculations.notice_compliance_deadline step 3."
        constraints: ">= 7"
      - name: deadline_utc
        type: datetime
        source: computed
        description: "End-of-day compliance deadline from calculations.notice_compliance_deadline step 4; extended in place by an approved extension."
      - name: extension_count
        type: integer
        source: system
        description: Number of granted extensions; capped by MAX_EXTENSIONS.
        default: 0
      - name: cleared_at_utc
        type: datetime
        source: system
        description: Logical-clock instant the notice reached CLEARED; null otherwise.
      - name: void_reason
        type: string
        source: system
        description: Free-text reason recorded when the notice reached VOIDED; null otherwise.

  - name: AbatementOrder
    parent: null
    common_fields: true
    fields:
      - name: violation_notice_id
        type: string
        source: input
        description: "FK -> ViolationNotice.id; the OVERDUE notice whose abatement authority this order exercises."
      - name: contractor_id
        type: string
        source: input
        description: "FK -> Contractor.id; null until the order is AWARDED."
      - name: verified_by_inspector_id
        type: string
        source: system
        description: "FK -> Inspector.id; the inspector who verified completion, constrained by segregation of duties. Null until INVOICED."
      - name: status
        type: enum
        source: system
        description: Abatement/cost-recovery lifecycle state.
        default: AUTHORIZED
        constraints: "AUTHORIZED | AWARDED | WORK_COMPLETE | INVOICED | PAID | LIEN_FILED | CANCELLED"
      - name: estimated_cost_cents
        type: integer
        source: input
        description: District cost estimate checked against ABATEMENT_CAP_CENTS at authorization.
        constraints: ">= 0"
      - name: crew_hours
        type: number
        source: input
        description: Crew hours reserved against the contractor at award; null until AWARDED.
        constraints: "> 0, multiples of 0.5"
      - name: work_start_utc
        type: datetime
        source: input
        description: Inclusive start of the CLOSED contractor work window; null until AWARDED.
      - name: work_end_utc
        type: datetime
        source: input
        description: Inclusive end of the CLOSED contractor work window; null until AWARDED.
        constraints: "work_end_utc > work_start_utc"
      - name: actual_crew_hours
        type: number
        source: input
        description: Crew hours actually worked, reported by the contractor; null until WORK_COMPLETE.
        constraints: "> 0, multiples of 0.5"
      - name: green_waste_tons
        type: number
        source: input
        description: Green waste tonnage hauled, reported by the contractor; null until WORK_COMPLETE.
        constraints: ">= 0, 2 decimals"
      - name: labor_line_cents
        type: integer
        source: computed
        description: "Cost-recovery labor line from calculations.abatement_cost_recovery step 1; null until INVOICED."
      - name: disposal_line_cents
        type: integer
        source: computed
        description: "Cost-recovery disposal line from calculations.abatement_cost_recovery step 2; null until INVOICED."
      - name: mobilization_line_cents
        type: integer
        source: computed
        description: "Cost-recovery mobilization line copied from Contractor.mobilization_fee_cents; null until INVOICED."
      - name: admin_overhead_cents
        type: integer
        source: computed
        description: "Per-line-rounded administrative overhead from calculations.abatement_cost_recovery step 4; null until INVOICED."
      - name: pre_subsidy_total_cents
        type: integer
        source: computed
        description: "Sum of the three cost lines plus admin_overhead_cents; the subsidy tier key. Null until INVOICED."
      - name: subsidy_pct
        type: number
        source: computed
        description: "District subsidy fraction selected by the pre_subsidy_total_cents tier; null until INVOICED."
      - name: district_subsidy_cents
        type: integer
        source: computed
        description: "Subsidy withheld from the owner's bill; null until INVOICED."
      - name: total_recoverable_cents
        type: integer
        source: computed
        description: "pre_subsidy_total_cents - district_subsidy_cents; the conserved cost-recovery quantity. Null until INVOICED."
      - name: recovery_basis
        type: enum
        source: computed
        description: Which abatement_cost_recovery variant produced the cost fields.
        constraints: "DISTRICT_CONTRACTED | VOLUNTARY_PRECOMPLIANCE"
      - name: paid_cents
        type: integer
        source: computed
        description: "Sum of CostRecoveryPayment.amount_cents applied to this order."
        default: 0
      - name: lien_amount_cents
        type: integer
        source: computed
        description: "Unpaid balance converted to a recorded lien at the cycle advance following invoice_due_utc; 0 before that."
        default: 0
      - name: invoice_due_utc
        type: datetime
        source: computed
        description: "INVOICED instant + InspectionCycle.invoice_due_days, at 23:59:59Z; null until INVOICED."
      - name: cancel_reason
        type: string
        source: system
        description: Reason recorded when the order reached CANCELLED; null otherwise.

  - name: CostRecoveryPayment
    parent: null
    common_fields: false
    fields:
      - name: abatement_order_id
        type: string
        source: input
        description: "FK -> AbatementOrder.id; the invoiced order this payment is applied to."
      - name: amount_cents
        type: integer
        source: input
        description: Payment amount in whole cents; may not exceed the order's outstanding balance.
        constraints: ">= 1"
      - name: method
        type: enum
        source: input
        description: Tender used; WRITE_OFF records a district write-off that still consumes outstanding balance.
        constraints: "CHECK | CARD | ACH | WRITE_OFF"
      - name: allocation
        type: object
        source: computed
        description: "Waterfall allocation map produced by calculations.abatement_cost_recovery step 8, with integer-cent values under the keys ADMIN_OVERHEAD, MOBILIZATION, DISPOSAL, LABOR."
      - name: outstanding_after_cents
        type: integer
        source: computed
        description: "AbatementOrder.total_recoverable_cents - AbatementOrder.paid_cents immediately after this payment is applied."
        constraints: ">= 0"

  - name: SupportProgram
    parent: null
    common_fields: true
    fields:
      - name: cycle_id
        type: string
        source: input
        description: "FK -> InspectionCycle.id; the cycle whose ACTIVE status gates enrollment."
      - name: program_type
        type: enum
        source: input
        description: Compliance-support offering type; only COST_SHARE_GRANT reimburses money.
        constraints: "CHIPPER_DAY | CURBSIDE_COLLECTION | COST_SHARE_GRANT"
      - name: budget_total_cents
        type: integer
        source: input
        description: Total reimbursement budget in whole cents.
        constraints: ">= 0"
      - name: budget_remaining_cents
        type: integer
        source: computed
        description: "Conserved quantity; MUST always equal budget_total_cents - sum(SupportEnrollment.reserved_amount_cents) over enrollments whose status IN {APPROVED, REIMBURSED}."
        constraints: ">= 0"
      - name: capacity_slots
        type: integer
        source: input
        description: Maximum simultaneously APPROVED enrollments.
        constraints: ">= 1"
      - name: reserved_slots
        type: integer
        source: computed
        description: "Count of enrollments on this program whose status IN {APPROVED, COMPLETED, REIMBURSED}."
        default: 0
      - name: service_window_start_utc
        type: datetime
        source: input
        description: Inclusive start of the service window in which enrollment is accepted.
      - name: service_window_end_utc
        type: datetime
        source: input
        description: Exclusive end of the service window in which enrollment is accepted.
        constraints: "service_window_end_utc > service_window_start_utc"

  - name: SupportEnrollment
    parent: null
    common_fields: true
    fields:
      - name: support_program_id
        type: string
        source: input
        description: "FK -> SupportProgram.id; the program enrolled into."
      - name: parcel_id
        type: string
        source: input
        description: "FK -> Parcel.id; the enrolling parcel, at most one non-CANCELLED enrollment per program."
      - name: vendor_invoice_cents
        type: integer
        source: input
        description: Contractor invoice submitted for cost-share reimbursement; required for COST_SHARE_GRANT, must be omitted otherwise.
        constraints: ">= 1 when present"
      - name: status
        type: enum
        source: system
        description: Enrollment lifecycle state.
        default: REQUESTED
        constraints: "REQUESTED | APPROVED | WAITLISTED | COMPLETED | NO_SHOW | REIMBURSED | CANCELLED"
      - name: award_before_bonus_cents
        type: integer
        source: computed
        description: "calculations.cost_share_award step 3 output; null for non-grant programs."
      - name: bonus_pct
        type: number
        source: computed
        description: "Hardship bonus fraction selected by the award_before_bonus_cents tier (NOT by award_cents); null for non-grant programs."
      - name: hardship_bonus_cents
        type: integer
        source: computed
        description: "calculations.cost_share_award step 4 output; 0 when Parcel.owner_hardship_flag is false."
      - name: award_cents
        type: integer
        source: computed
        description: "award_before_bonus_cents + hardship_bonus_cents; null for non-grant programs."
      - name: reserved_amount_cents
        type: integer
        source: computed
        description: "Budget actually reserved against the program; equals award_cents while APPROVED/REIMBURSED, 0 while WAITLISTED/CANCELLED/NO_SHOW."
        default: 0
      - name: reimbursed_cents
        type: integer
        source: computed
        description: "Amount disbursed to the owner; equals award_cents once REIMBURSED, else 0."
        default: 0
      - name: waitlist_position
        type: integer
        source: computed
        description: "1-based position among WAITLISTED enrollments on this program ordered by created_at ASC; null unless WAITLISTED."

  - name: ComplianceCertificate
    parent: null
    common_fields: true
    fields:
      - name: parcel_id
        type: string
        source: input
        description: "FK -> Parcel.id; the parcel whose compliance is being documented."
      - name: requester_kind
        type: enum
        source: input
        description: Why the certificate is requested; drives nothing but is retained for program reporting.
        constraints: "INSURANCE | REAL_ESTATE | LENDER"
      - name: transaction_reference
        type: string
        source: input
        description: Escrow, policy or loan reference supplied by the requester.
      - name: status
        type: enum
        source: system
        description: Certificate request lifecycle state.
        default: REQUESTED
        constraints: "REQUESTED | ISSUED | DENIED | REVOKED"
      - name: decision_note
        type: string
        source: system
        description: Reviewer note captured with the ISSUE/DENY decision; null while REQUESTED.
      - name: issued_at_utc
        type: datetime
        source: system
        description: Logical-clock instant of issuance; null unless ISSUED or REVOKED.
      - name: expires_at_utc
        type: datetime
        source: computed
        description: "date(issued_at_utc + CERTIFICATE_VALID_DAYS days) at 23:59:59Z, with CERTIFICATE_VALID_DAYS = 90; null unless ISSUED or REVOKED."
      - name: snapshot_risk_class
        type: enum
        source: computed
        description: "Parcel.risk_class pinned at issuance; later parcel rescoring does not change it."
        constraints: "LOW | MODERATE | HIGH | EXTREME"
      - name: snapshot_compliance_status
        type: enum
        source: computed
        description: "Parcel.compliance_status pinned at issuance."
        constraints: "COMPLIANT | EXEMPT"
      - name: revoked_at_utc
        type: datetime
        source: system
        description: Logical-clock instant the certificate was revoked by a later failing inspection; null otherwise.

# ============================================================================
# 1.2 State Machine Table
# ============================================================================

state_machines:

  - entity: InspectionCycle
    initial_state: PLANNING
    terminal_states: [CLOSED]
    transitions:
      - from: PLANNING
        to: ACTIVE
        trigger: "POST /fire-district/inspection-cycles/{cycle_id}/activate"
        actor: ProgramAdmin
        preconditions:
          - "cycle.status == PLANNING"
          - "no other InspectionCycle has status == ACTIVE"
        side_effects:
          - "sets activated_at_utc to the logical clock"
          - "increments InspectionCycle.version by 1"
        note: "At most one ACTIVE cycle exists at any time; a second activation attempt is rejected with ERR_CYCLE_ALREADY_ACTIVE."
      - from: ACTIVE
        to: ACTIVE
        trigger: "POST /fire-district/inspection-cycles/{cycle_id}/advance"
        actor: ProgramAdmin
        preconditions:
          - "cycle.status == ACTIVE"
        side_effects:
          - "STEP 1 — every ViolationNotice whose parcel belongs to any community or none, with status IN {ISSUED, EXTENDED} and deadline_utc < logical clock, transitions to OVERDUE"
          - "STEP 2 — because notices became OVERDUE in step 1, each affected Parcel.compliance_status is set to NON_COMPLIANT (idempotent when already NON_COMPLIANT) and Parcel.updated_at/version advance"
          - "STEP 3 — every AbatementOrder with status == INVOICED and invoice_due_utc < logical clock transitions to LIEN_FILED, setting lien_amount_cents = total_recoverable_cents - paid_cents"
          - "STEP 4 — for each SupportProgram whose cycle_id == this cycle, WAITLISTED enrollments are promoted to APPROVED in created_at ASC order while reserved_slots < capacity_slots AND budget_remaining_cents >= enrollment.award_cents; each promotion sets reserved_amount_cents = award_cents and debits SupportProgram.budget_remaining_cents; remaining WAITLISTED rows have waitlist_position renumbered from 1 in created_at ASC order"
          - "STEP 5 — Parcel.inspection_priority_rank is recomputed for every Parcel with exemption_flag == false per calculations.inspection_priority_rank"
          - "STEP 6 — Community.compliance_rate_pct is recomputed for every Community per calculations.program_compliance_metrics (community_scope variant)"
          - "STEP 7 — because step 6 changed compliance_rate_pct, every Community with status == CERTIFIED whose recomputed compliance_rate_pct < COMMUNITY_LAPSE_FLOOR_PCT transitions to LAPSED and increments lapse_count by 1"
          - "STEP 8 — increments epoch by 1 and InspectionCycle.version by 1"
        note: "Ops-run checkpoint. Steps execute strictly in the order listed; step 2 depends on step 1, and step 7 depends on step 6."
      - from: ACTIVE
        to: CLOSED
        trigger: "POST /fire-district/inspection-cycles/{cycle_id}/close"
        actor: ProgramAdmin
        preconditions:
          - "cycle.status == ACTIVE"
          - "no Inspection with cycle_id == this cycle has status IN {SCHEDULED, NOTICED, ACCESS_DENIED}"
        side_effects:
          - "sets closed_at_utc to the logical clock"
          - "increments InspectionCycle.version by 1"

  - entity: Inspection
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED, ABANDONED]
    transitions:
      - from: SCHEDULED
        to: NOTICED
        trigger: "POST /fire-district/inspections/{inspection_id}/notice"
        actor: ProgramAdmin
        preconditions:
          - "inspection.status == SCHEDULED"
          - "the referenced InspectionCycle.status == ACTIVE"
          - "scheduled_start_utc - logical clock >= InspectionCycle.notice_lead_days whole days"
        side_effects:
          - "sets notice_method and notice_sent_at_utc = logical clock"
          - "increments Inspection.version by 1"
        note: "Cross-entity guard on InspectionCycle.status; a PLANNING or CLOSED cycle rejects with ERR_CYCLE_NOT_ACTIVE."
      - from: NOTICED
        to: ACCESS_DENIED
        trigger: "POST /fire-district/inspections/{inspection_id}/access-denial"
        actor: Inspector
        preconditions:
          - "inspection.status == NOTICED"
          - "inspection.access_denial_count < MAX_ACCESS_DENIALS - 1 (i.e. == 0 with MAX_ACCESS_DENIALS = 2)"
          - "the acting Inspector's X-User-ID equals inspection.inspector_id"
        side_effects:
          - "increments access_denial_count by 1"
          - "increments Inspection.version by 1"
      - from: ACCESS_DENIED
        to: SCHEDULED
        trigger: "POST /fire-district/inspections/{inspection_id}/reschedule"
        actor: ProgramAdmin
        preconditions:
          - "inspection.status == ACCESS_DENIED"
          - "the new half-open window does not collide with another Inspection of the target inspector per validations priority 62"
        side_effects:
          - "replaces scheduled_start_utc, scheduled_end_utc and optionally inspector_id"
          - "clears notice_method and notice_sent_at_utc back to null"
          - "increments Inspection.version by 1"
        note: "Closes the cycle ACCESS_DENIED -> SCHEDULED -> NOTICED -> ACCESS_DENIED; access_denial_count is NOT reset."
      - from: NOTICED
        to: ABANDONED
        trigger: "POST /fire-district/inspections/{inspection_id}/access-denial (second denial on the same inspection)"
        actor: Inspector
        preconditions:
          - "inspection.status == NOTICED and access_denial_count == MAX_ACCESS_DENIALS - 1 at request time"
          - "the acting Inspector's X-User-ID equals inspection.inspector_id"
        side_effects:
          - "increments access_denial_count to MAX_ACCESS_DENIALS and sets status to ABANDONED instead of ACCESS_DENIED"
          - "creates a ViolationNotice on inspection.parcel_id with severity CRITICAL, notice_method CERTIFIED_MAIL and supersedes_notice_id resolution per the ViolationNotice creation rules"
          - "because that notice was created, Parcel.compliance_status becomes NON_COMPLIANT and Parcel.open_violation_count increases by 1"
          - "increments Inspection.version by 1"
        note: "Branch of the same trigger as NOTICED -> ACCESS_DENIED with a divergent side-effect set, selected by access_denial_count."
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /fire-district/inspections/{inspection_id}/cancel"
        actor: ProgramAdmin
        preconditions:
          - "inspection.status IN {SCHEDULED, NOTICED}"
        side_effects:
          - "releases the inspector's half-open window so a later Inspection may occupy it"
          - "increments Inspection.version by 1"
      - from: NOTICED
        to: CANCELLED
        trigger: "POST /fire-district/inspections/{inspection_id}/cancel"
        actor: ProgramAdmin
        preconditions:
          - "inspection.status IN {SCHEDULED, NOTICED}"
        side_effects:
          - "releases the inspector's half-open window so a later Inspection may occupy it"
          - "increments Inspection.version by 1"
      - from: NOTICED
        to: COMPLETED
        trigger: "POST /fire-district/inspections/{inspection_id}/complete with result == PASS"
        actor: Inspector
        preconditions:
          - "inspection.status == NOTICED"
          - "the acting Inspector's X-User-ID equals inspection.inspector_id"
          - "ZoneEvaluation rows exist for all three zones ZONE_0_EMBER, ZONE_1 and ZONE_2 on this inspection"
          - "every ZoneEvaluation on this inspection has deficiency_severity == NONE when result == PASS"
        side_effects:
          - "computes measured_veg_points, hardening_credit_points and max_deficiency_severity per calculations.zone_deficiency_assessment"
          - "sets completed_at_utc = logical clock and result = PASS"
          - "recomputes Parcel.risk_score under the post_inspection_verified variant, setting risk_score_basis = POST_INSPECTION_VERIFIED and re-banding risk_class"
          - "sets Parcel.last_passed_inspection_at_utc = completed_at_utc and Parcel.compliance_status = COMPLIANT (unless exemption_flag is true, in which case EXEMPT is retained)"
          - "when inspection_type == REINSPECTION, every ViolationNotice on the parcel with status IN {ISSUED, EXTENDED, OVERDUE} transitions to CLEARED, setting cleared_at_utc"
          - "because those notices cleared, Parcel.open_violation_count is recomputed"
          - "because Parcel.compliance_status changed, Community.compliance_rate_pct is recomputed for the parcel's community when community_id is not null"
          - "increments Inspection.version and Parcel.version by 1"
      - from: NOTICED
        to: COMPLETED
        trigger: "POST /fire-district/inspections/{inspection_id}/complete with result == FAIL"
        actor: Inspector
        preconditions:
          - "inspection.status == NOTICED"
          - "the acting Inspector's X-User-ID equals inspection.inspector_id"
          - "ZoneEvaluation rows exist for all three zones ZONE_0_EMBER, ZONE_1 and ZONE_2 on this inspection"
          - "at least one ZoneEvaluation on this inspection has deficiency_severity != NONE when result == FAIL"
        side_effects:
          - "LINK 1 — computes measured_veg_points, hardening_credit_points and max_deficiency_severity, sets completed_at_utc and result = FAIL"
          - "LINK 2 — because link 1 produced verified measurements, Parcel.risk_score is recomputed under the post_inspection_verified variant, risk_score_basis becomes POST_INSPECTION_VERIFIED, risk_class is re-banded and Parcel.compliance_status becomes NON_COMPLIANT"
          - "LINK 3 — because Parcel.compliance_status became NON_COMPLIANT, a ViolationNotice is created with inspection_id = this inspection, severity = max_deficiency_severity, notice_method = the request's violation_notice_method (default CERTIFIED_MAIL) and delivered_at_utc/compliance_days/deadline_utc from calculations.notice_compliance_deadline; Parcel.open_violation_count increases by 1"
          - "LINK 4 — because a ViolationNotice now exists on the parcel, every ComplianceCertificate on the parcel with status == ISSUED and expires_at_utc >= logical clock transitions to REVOKED with revoked_at_utc = logical clock"
          - "LINK 5 — because Parcel.compliance_status changed in link 2, Community.compliance_rate_pct is recomputed for the parcel's community when community_id is not null"
          - "LINK 6 — because link 5 lowered compliance_rate_pct, a Community with status == CERTIFIED whose recomputed rate < COMMUNITY_LAPSE_FLOOR_PCT transitions to LAPSED and increments lapse_count by 1"
          - "increments Inspection.version and Parcel.version by 1"
        note: "Transitive cascade of depth 5 (Inspection -> Parcel -> ViolationNotice -> Community.compliance_rate_pct -> Community.status). Link 4 is a further consequence of link 3."

  - entity: ViolationNotice
    initial_state: ISSUED
    terminal_states: [CLEARED, VOIDED]
    transitions:
      - from: ISSUED
        to: EXTENDED
        trigger: "POST /fire-district/violation-notices/{notice_id}/extend"
        actor: ProgramAdmin | PropertyOwner
        preconditions:
          - "notice.status == ISSUED"
          - "notice.extension_count < MAX_EXTENSIONS"
          - "logical clock <= notice.deadline_utc"
          - "when the actor is PropertyOwner, X-User-ID equals notice.parcel_id"
        side_effects:
          - "adds EXTENSION_DAYS whole days to deadline_utc, keeping the 23:59:59Z end-of-day form"
          - "increments extension_count by 1"
          - "increments ViolationNotice.version by 1"
        note: "The extend endpoint also accepts an already-EXTENDED notice as a target: that request clears the priority-40 state gate and is refused by validations priority 68 with ERR_EXTENSION_LIMIT_REACHED, leaving deadline_utc and extension_count untouched."
      - from: ISSUED
        to: OVERDUE
        trigger: "system: STEP 1 of POST /fire-district/inspection-cycles/{cycle_id}/advance"
        actor: system
        preconditions:
          - "notice.status == ISSUED"
          - "notice.deadline_utc < logical clock"
        side_effects:
          - "sets Parcel.compliance_status to NON_COMPLIANT for notice.parcel_id"
          - "increments ViolationNotice.version and Parcel.version by 1"
      - from: EXTENDED
        to: OVERDUE
        trigger: "system: STEP 1 of POST /fire-district/inspection-cycles/{cycle_id}/advance"
        actor: system
        preconditions:
          - "notice.status == EXTENDED"
          - "notice.deadline_utc < logical clock"
        side_effects:
          - "sets Parcel.compliance_status to NON_COMPLIANT for notice.parcel_id"
          - "increments ViolationNotice.version and Parcel.version by 1"
      - from: ISSUED
        to: CLEARED
        trigger: "POST /fire-district/inspections/{inspection_id}/complete with inspection_type == REINSPECTION and result == PASS"
        actor: Inspector
        preconditions:
          - "notice.status IN {ISSUED, EXTENDED, OVERDUE}"
          - "the completing Inspection has parcel_id == notice.parcel_id and inspection_type == REINSPECTION"
        side_effects:
          - "sets cleared_at_utc = logical clock"
          - "decrements Parcel.open_violation_count by 1 and recomputes Parcel.compliance_status"
          - "increments ViolationNotice.version by 1"
      - from: EXTENDED
        to: CLEARED
        trigger: "POST /fire-district/inspections/{inspection_id}/complete with inspection_type == REINSPECTION and result == PASS"
        actor: Inspector
        preconditions:
          - "notice.status IN {ISSUED, EXTENDED, OVERDUE}"
          - "the completing Inspection has parcel_id == notice.parcel_id and inspection_type == REINSPECTION"
        side_effects:
          - "sets cleared_at_utc = logical clock"
          - "decrements Parcel.open_violation_count by 1 and recomputes Parcel.compliance_status"
          - "increments ViolationNotice.version by 1"
      - from: OVERDUE
        to: CLEARED
        trigger: "POST /fire-district/inspections/{inspection_id}/complete with inspection_type == REINSPECTION and result == PASS"
        actor: Inspector
        preconditions:
          - "notice.status == OVERDUE"
          - "the completing Inspection has parcel_id == notice.parcel_id and inspection_type == REINSPECTION"
        side_effects:
          - "sets cleared_at_utc = logical clock"
          - "decrements Parcel.open_violation_count by 1 and recomputes Parcel.compliance_status"
          - "increments ViolationNotice.version by 1"
        note: "Late voluntary compliance after the deadline still clears the notice; the OVERDUE detour does not become terminal."
      - from: OVERDUE
        to: ABATEMENT_AUTHORIZED
        trigger: "POST /fire-district/violation-notices/{notice_id}/authorize-abatement"
        actor: FireMarshal
        preconditions:
          - "notice.status == OVERDUE"
          - "no AbatementOrder with status IN {AUTHORIZED, AWARDED, WORK_COMPLETE, INVOICED} already references this notice"
          - "estimated_cost_cents <= ABATEMENT_CAP_CENTS"
        side_effects:
          - "creates an AbatementOrder in status AUTHORIZED with violation_notice_id = this notice"
          - "sets Parcel.compliance_status = ABATEMENT_PENDING for notice.parcel_id"
          - "increments ViolationNotice.version and Parcel.version by 1"
      - from: ABATEMENT_AUTHORIZED
        to: CLEARED
        trigger: "POST /fire-district/abatement-orders/{order_id}/verify-completion"
        actor: Inspector
        preconditions:
          - "notice.status == ABATEMENT_AUTHORIZED"
          - "the order referencing this notice is in status WORK_COMPLETE"
        side_effects:
          - "sets cleared_at_utc = logical clock"
          - "decrements Parcel.open_violation_count by 1 and sets Parcel.compliance_status = COMPLIANT when no other open notice remains"
          - "increments ViolationNotice.version by 1"
      - from: ABATEMENT_AUTHORIZED
        to: OVERDUE
        trigger: "POST /fire-district/abatement-orders/{order_id}/cancel"
        actor: FireMarshal
        preconditions:
          - "notice.status == ABATEMENT_AUTHORIZED"
          - "the order referencing this notice is in status IN {AUTHORIZED, AWARDED}"
        side_effects:
          - "reverts Parcel.compliance_status to NON_COMPLIANT"
          - "increments ViolationNotice.version and Parcel.version by 1"
        note: "Compensating transition: reverses exactly the OVERDUE -> ABATEMENT_AUTHORIZED side-effect set."
      - from: ISSUED
        to: VOIDED
        trigger: "POST /fire-district/violation-notices/{notice_id}/void"
        actor: FireMarshal
        preconditions:
          - "notice.status IN {ISSUED, EXTENDED, OVERDUE}"
          - "the acting FireMarshal's X-User-ID differs from the verified_by_inspector_id of any AbatementOrder on this notice (vacuously true while none exists)"
        side_effects:
          - "sets void_reason to the request reason"
          - "decrements Parcel.open_violation_count by 1 and recomputes Parcel.compliance_status"
          - "increments ViolationNotice.version and Parcel.version by 1"
      - from: EXTENDED
        to: VOIDED
        trigger: "POST /fire-district/violation-notices/{notice_id}/void"
        actor: FireMarshal
        preconditions:
          - "notice.status IN {ISSUED, EXTENDED, OVERDUE}"
        side_effects:
          - "sets void_reason to the request reason"
          - "decrements Parcel.open_violation_count by 1 and recomputes Parcel.compliance_status"
          - "increments ViolationNotice.version and Parcel.version by 1"
      - from: OVERDUE
        to: VOIDED
        trigger: "POST /fire-district/violation-notices/{notice_id}/void, or system supersession by POST /fire-district/parcels/{parcel_id}/violation-notices"
        actor: FireMarshal | system
        preconditions:
          - "notice.status IN {ISSUED, EXTENDED, OVERDUE}"
        side_effects:
          - "sets void_reason (SUPERSEDED_BY_NEW_NOTICE for the system path) and, on the system path, sets the new notice's supersedes_notice_id to this notice's id"
          - "decrements Parcel.open_violation_count by 1 and recomputes Parcel.compliance_status"
          - "increments ViolationNotice.version and Parcel.version by 1"

  - entity: AbatementOrder
    initial_state: AUTHORIZED
    terminal_states: [PAID, LIEN_FILED, CANCELLED]
    transitions:
      - from: AUTHORIZED
        to: AWARDED
        trigger: "POST /fire-district/abatement-orders/{order_id}/award"
        actor: FireMarshal
        preconditions:
          - "order.status == AUTHORIZED"
          - "Contractor.license_status == ACTIVE"
          - "work_start_utc < Contractor.insurance_expiry_utc"
          - "the CLOSED work window does not intersect another AWARDED/WORK_COMPLETE order of the same contractor"
          - "the contractor's per-UTC-date order count stays within max_daily_orders"
        side_effects:
          - "sets contractor_id, crew_hours, work_start_utc, work_end_utc"
          - "increases Contractor.committed_crew_hours by crew_hours"
          - "increments AbatementOrder.version and Contractor.version by 1"
      - from: AWARDED
        to: WORK_COMPLETE
        trigger: "POST /fire-district/abatement-orders/{order_id}/complete-work"
        actor: Contractor
        preconditions:
          - "order.status == AWARDED"
          - "the acting Contractor's X-User-ID equals order.contractor_id"
          - "logical clock >= order.work_start_utc"
        side_effects:
          - "sets actual_crew_hours and green_waste_tons"
          - "increments AbatementOrder.version by 1"
        note: "committed_crew_hours is still reserved in WORK_COMPLETE; it is released only at INVOICED or CANCELLED."
      - from: WORK_COMPLETE
        to: INVOICED
        trigger: "POST /fire-district/abatement-orders/{order_id}/verify-completion"
        actor: Inspector
        preconditions:
          - "order.status == WORK_COMPLETE"
          - "the acting Inspector's X-User-ID differs from the inspector_id of the Inspection referenced by this order's ViolationNotice (segregation of duties)"
          - "the acting Inspector.status == ACTIVE"
        side_effects:
          - "LINK 1 — computes labor_line_cents, disposal_line_cents, mobilization_line_cents, admin_overhead_cents, pre_subsidy_total_cents, subsidy_pct, district_subsidy_cents, total_recoverable_cents and recovery_basis per calculations.abatement_cost_recovery; sets invoice_due_utc and verified_by_inspector_id"
          - "LINK 2 — because the order became INVOICED, Contractor.committed_crew_hours decreases by order.crew_hours and Contractor.completed_crew_hours increases by order.actual_crew_hours, restoring the conservation identity"
          - "LINK 3 — because the order became INVOICED, the referenced ViolationNotice transitions ABATEMENT_AUTHORIZED -> CLEARED with cleared_at_utc = logical clock"
          - "LINK 4 — because that notice cleared, Parcel.open_violation_count decreases by 1 and Parcel.compliance_status becomes COMPLIANT when no other open notice remains"
          - "LINK 5 — because Parcel.compliance_status changed in link 4, Community.compliance_rate_pct is recomputed for the parcel's community when community_id is not null"
          - "increments AbatementOrder.version, Contractor.version, ViolationNotice.version and Parcel.version by 1"
        note: "Transitive cascade of depth 5 originating from a different trigger than the Inspection FAIL cascade."
      - from: INVOICED
        to: PAID
        trigger: "POST /fire-district/abatement-orders/{order_id}/payments (payment that zeroes the outstanding balance)"
        actor: PropertyOwner | ProgramAdmin
        preconditions:
          - "order.status == INVOICED"
          - "amount_cents <= total_recoverable_cents - paid_cents"
          - "paid_cents + amount_cents == total_recoverable_cents"
        side_effects:
          - "creates a CostRecoveryPayment with its waterfall allocation map and outstanding_after_cents == 0"
          - "sets paid_cents = total_recoverable_cents"
          - "increments AbatementOrder.version by 1"
      - from: INVOICED
        to: LIEN_FILED
        trigger: "system: STEP 3 of POST /fire-district/inspection-cycles/{cycle_id}/advance"
        actor: system
        preconditions:
          - "order.status == INVOICED"
          - "order.invoice_due_utc < logical clock"
        side_effects:
          - "sets lien_amount_cents = total_recoverable_cents - paid_cents"
          - "increments AbatementOrder.version by 1"
      - from: AUTHORIZED
        to: CANCELLED
        trigger: "POST /fire-district/abatement-orders/{order_id}/cancel"
        actor: FireMarshal
        preconditions:
          - "order.status IN {AUTHORIZED, AWARDED}"
        side_effects:
          - "sets cancel_reason"
          - "reverts the referenced ViolationNotice ABATEMENT_AUTHORIZED -> OVERDUE and Parcel.compliance_status -> NON_COMPLIANT"
          - "increments AbatementOrder.version, ViolationNotice.version and Parcel.version by 1"
      - from: AWARDED
        to: CANCELLED
        trigger: "POST /fire-district/abatement-orders/{order_id}/cancel"
        actor: FireMarshal
        preconditions:
          - "order.status IN {AUTHORIZED, AWARDED}"
        side_effects:
          - "sets cancel_reason"
          - "decreases Contractor.committed_crew_hours by order.crew_hours, restoring the conservation identity exactly"
          - "reverts the referenced ViolationNotice ABATEMENT_AUTHORIZED -> OVERDUE and Parcel.compliance_status -> NON_COMPLIANT"
          - "increments AbatementOrder.version, Contractor.version, ViolationNotice.version and Parcel.version by 1"
        note: "Compensating action for the AUTHORIZED -> AWARDED reservation; Contractor.committed_crew_hours must return to its pre-award value."

  - entity: Community
    initial_state: ORGANIZING
    terminal_states: []
    transitions:
      - from: ORGANIZING
        to: SUBMITTED
        trigger: "POST /fire-district/communities/{community_id}/submit-certification"
        actor: CommunityOrganizer
        preconditions:
          - "community.status IN {ORGANIZING}"
          - "the acting CommunityOrganizer's X-User-ID equals community.id"
          - "at least COMMUNITY_MIN_MEMBER_PARCELS Parcels have community_id == this community"
          - "parcels_outreached_count in the request >= the number of member Parcels"
        side_effects:
          - "records parcels_outreached_count"
          - "recomputes compliance_rate_pct per calculations.program_compliance_metrics (community_scope variant)"
          - "increments Community.version by 1"
      - from: SUBMITTED
        to: CERTIFIED
        trigger: "POST /fire-district/communities/{community_id}/certification-decision with decision == CERTIFY"
        actor: FireMarshal
        preconditions:
          - "community.status == SUBMITTED"
          - "community.compliance_rate_pct is not null AND >= COMMUNITY_CERTIFY_FLOOR_PCT"
        side_effects:
          - "sets certified_at_utc = logical clock"
          - "increments Community.version by 1"
      - from: SUBMITTED
        to: DEFERRED
        trigger: "POST /fire-district/communities/{community_id}/certification-decision with decision == DEFER"
        actor: FireMarshal
        preconditions:
          - "community.status == SUBMITTED"
        side_effects:
          - "leaves certified_at_utc untouched"
          - "increments Community.version by 1"
        note: "Fork-join branch of the same trigger with a divergent side-effect set from CERTIFY."
      - from: DEFERRED
        to: ORGANIZING
        trigger: "POST /fire-district/communities/{community_id}/reopen-organizing"
        actor: CommunityOrganizer
        preconditions:
          - "community.status IN {DEFERRED, LAPSED}"
          - "the acting CommunityOrganizer's X-User-ID equals community.id"
        side_effects:
          - "resets parcels_outreached_count to 0"
          - "increments Community.version by 1"
        note: "Closes the certification cycle DEFERRED -> ORGANIZING -> SUBMITTED, allowing an unbounded number of rounds."
      - from: LAPSED
        to: ORGANIZING
        trigger: "POST /fire-district/communities/{community_id}/reopen-organizing"
        actor: CommunityOrganizer
        preconditions:
          - "community.status IN {DEFERRED, LAPSED}"
          - "the acting CommunityOrganizer's X-User-ID equals community.id"
        side_effects:
          - "resets parcels_outreached_count to 0"
          - "increments Community.version by 1"
      - from: CERTIFIED
        to: LAPSED
        trigger: "system: STEP 7 of POST /fire-district/inspection-cycles/{cycle_id}/advance"
        actor: system
        preconditions:
          - "community.status == CERTIFIED"
          - "the compliance_rate_pct recomputed in STEP 6 is not null AND < COMMUNITY_LAPSE_FLOOR_PCT"
        side_effects:
          - "increments lapse_count by 1"
          - "increments Community.version by 1"
        note: "Also fires as LINK 6 of the Inspection FAIL cascade, which recomputes the same field outside a cycle advance."

  - entity: SupportEnrollment
    initial_state: REQUESTED
    terminal_states: [COMPLETED, NO_SHOW, REIMBURSED, CANCELLED]
    transitions:
      - from: REQUESTED
        to: APPROVED
        trigger: "system: automatic admission decision inside POST /fire-district/support-enrollments"
        actor: system
        preconditions:
          - "SupportProgram.reserved_slots < SupportProgram.capacity_slots"
          - "for COST_SHARE_GRANT programs, SupportProgram.budget_remaining_cents >= the enrollment's award_cents from calculations.cost_share_award"
        side_effects:
          - "for COST_SHARE_GRANT, sets award_before_bonus_cents, bonus_pct, hardship_bonus_cents, award_cents and reserved_amount_cents = award_cents, and debits SupportProgram.budget_remaining_cents by award_cents"
          - "increments SupportProgram.reserved_slots by 1 and SupportProgram.version by 1"
      - from: REQUESTED
        to: WAITLISTED
        trigger: "system: automatic admission decision inside POST /fire-district/support-enrollments"
        actor: system
        preconditions:
          - "SupportProgram.reserved_slots == SupportProgram.capacity_slots, OR (COST_SHARE_GRANT AND SupportProgram.budget_remaining_cents < award_cents)"
        side_effects:
          - "sets reserved_amount_cents = 0 and waitlist_position = 1 + count of existing WAITLISTED enrollments on the program"
          - "leaves SupportProgram.budget_remaining_cents and reserved_slots unchanged"
        note: "Partial funding is never granted; an under-funded enrollment waits for its full award_cents."
      - from: WAITLISTED
        to: APPROVED
        trigger: "system: STEP 4 of POST /fire-district/inspection-cycles/{cycle_id}/advance"
        actor: system
        preconditions:
          - "enrollment.status == WAITLISTED"
          - "the enrollment is the earliest remaining WAITLISTED row on its program by created_at ASC that still fits both reserved_slots < capacity_slots and budget_remaining_cents >= award_cents"
        side_effects:
          - "sets reserved_amount_cents = award_cents, clears waitlist_position to null, debits SupportProgram.budget_remaining_cents and increments reserved_slots"
          - "renumbers waitlist_position of the remaining WAITLISTED rows from 1 in created_at ASC order"
          - "increments SupportEnrollment.version and SupportProgram.version by 1"
      - from: APPROVED
        to: COMPLETED
        trigger: "POST /fire-district/support-enrollments/{enrollment_id}/complete with attended == true on a CHIPPER_DAY or CURBSIDE_COLLECTION program"
        actor: ProgramAdmin
        preconditions:
          - "enrollment.status == APPROVED"
          - "SupportProgram.program_type IN {CHIPPER_DAY, CURBSIDE_COLLECTION}"
        side_effects:
          - "leaves reserved_amount_cents and SupportProgram.budget_remaining_cents unchanged"
          - "increments SupportEnrollment.version by 1"
      - from: APPROVED
        to: REIMBURSED
        trigger: "POST /fire-district/support-enrollments/{enrollment_id}/complete with attended == true on a COST_SHARE_GRANT program"
        actor: ProgramAdmin
        preconditions:
          - "enrollment.status == APPROVED"
          - "SupportProgram.program_type == COST_SHARE_GRANT"
        side_effects:
          - "sets reimbursed_cents = award_cents, keeping reserved_amount_cents = award_cents so budget_remaining_cents does not move"
          - "increments SupportEnrollment.version by 1"
        note: "Fork-join branch of the same trigger; the branch is selected by SupportProgram.program_type."
      - from: APPROVED
        to: NO_SHOW
        trigger: "POST /fire-district/support-enrollments/{enrollment_id}/complete with attended == false"
        actor: ProgramAdmin
        preconditions:
          - "enrollment.status == APPROVED"
        side_effects:
          - "sets reserved_amount_cents = 0 and credits SupportProgram.budget_remaining_cents by the previously reserved amount"
          - "decrements SupportProgram.reserved_slots by 1"
          - "increments SupportEnrollment.version and SupportProgram.version by 1"
      - from: APPROVED
        to: CANCELLED
        trigger: "POST /fire-district/support-enrollments/{enrollment_id}/cancel"
        actor: PropertyOwner | ProgramAdmin
        preconditions:
          - "enrollment.status IN {APPROVED, WAITLISTED}"
          - "when the actor is PropertyOwner, X-User-ID equals enrollment.parcel_id"
        side_effects:
          - "sets reserved_amount_cents = 0, credits SupportProgram.budget_remaining_cents by the previously reserved amount and decrements reserved_slots by 1"
          - "increments SupportEnrollment.version and SupportProgram.version by 1"
        note: "Compensating action for REQUESTED -> APPROVED; SupportProgram.budget_remaining_cents must return to its pre-approval value exactly."
      - from: WAITLISTED
        to: CANCELLED
        trigger: "POST /fire-district/support-enrollments/{enrollment_id}/cancel"
        actor: PropertyOwner | ProgramAdmin
        preconditions:
          - "enrollment.status IN {APPROVED, WAITLISTED}"
        side_effects:
          - "leaves SupportProgram.budget_remaining_cents and reserved_slots unchanged (nothing was reserved)"
          - "renumbers waitlist_position of the remaining WAITLISTED rows from 1 in created_at ASC order"
          - "increments SupportEnrollment.version by 1"

  - entity: ComplianceCertificate
    initial_state: REQUESTED
    terminal_states: [DENIED, REVOKED]
    transitions:
      - from: REQUESTED
        to: ISSUED
        trigger: "POST /fire-district/compliance-certificates/{certificate_id}/decision with decision == ISSUE"
        actor: ProgramAdmin
        preconditions:
          - "certificate.status == REQUESTED"
          - "Parcel.compliance_status IN {COMPLIANT, EXEMPT}"
          - "no ViolationNotice on the parcel has status IN {ISSUED, EXTENDED, OVERDUE, ABATEMENT_AUTHORIZED}"
        side_effects:
          - "sets issued_at_utc = logical clock, expires_at_utc = date(issued_at_utc + 90 days) at 23:59:59Z (CERTIFICATE_VALID_DAYS = 90), snapshot_risk_class = Parcel.risk_class and snapshot_compliance_status = Parcel.compliance_status"
          - "increments ComplianceCertificate.version by 1"
      - from: REQUESTED
        to: DENIED
        trigger: "POST /fire-district/compliance-certificates/{certificate_id}/decision with decision == DENY"
        actor: ProgramAdmin
        preconditions:
          - "certificate.status == REQUESTED"
        side_effects:
          - "records decision_note and leaves every snapshot field null"
          - "increments ComplianceCertificate.version by 1"
      - from: ISSUED
        to: REVOKED
        trigger: "system: LINK 4 of POST /fire-district/inspections/{inspection_id}/complete with result == FAIL"
        actor: system
        preconditions:
          - "certificate.status == ISSUED"
          - "certificate.expires_at_utc >= logical clock"
          - "a ViolationNotice was just created on certificate.parcel_id"
        side_effects:
          - "sets revoked_at_utc = logical clock, preserving snapshot_risk_class and snapshot_compliance_status as issued"
          - "increments ComplianceCertificate.version by 1"

# ============================================================================
# 1.2.1 Concurrency Rules  (OCC on the parent entity's version — only mechanism)
# ============================================================================

concurrency_rules:
  - rule_id: notice-create-stale-parcel
    parent_entity: Parcel
    write_endpoint: "POST /fire-district/parcels/{parcel_id}/violation-notices"
    occ_field: "expected_parcel_version"
    description: |
      Issuing a discretionary ViolationNotice against a Parcel whose version has
      advanced past the version the client last observed is rejected. This is a
      true race rather than a state precondition: a second notice on the same
      parcel is legitimately permitted by the supersession rule (it drives the
      prior open notice to VOIDED and records supersedes_notice_id), so the
      second writer's request would otherwise succeed while acting on a stale
      picture of open_violation_count and compliance_status.
    error_id: ERR_STALE_PARCEL_VERSION
    http_status: 412

  - rule_id: enrollment-create-stale-program
    parent_entity: SupportProgram
    write_endpoint: "POST /fire-district/support-enrollments"
    occ_field: "expected_program_version"
    description: |
      Creating a SupportEnrollment against a SupportProgram whose version has
      advanced past the version the client last observed is rejected. Enrollment
      is legitimately repeatable for other parcels and the admission decision
      reads budget_remaining_cents and reserved_slots, both of which the prior
      writer moved; without the version check the later writer would be admitted
      on the strength of budget that is already reserved.
    error_id: ERR_STALE_PROGRAM_VERSION
    http_status: 412

# ============================================================================
# 1.3 Calculation Rules Table
# ============================================================================

calculations:

  - name: parcel_risk_score
    trigger: "On POST /fire-district/parcels (intake), on PATCH /fire-district/parcels/{parcel_id} when any scoring field changes, and on POST /fire-district/inspections/{inspection_id}/complete (both PASS and FAIL)."
    algorithm: weighted_scoring
    formula: |
      slope_points      = min(100, slope_pct * 2)
      veg_points        = VEG_POINTS[vegetation_type]                # intake_provisional only
      structure_points  = ROOF_POINTS[roof_class]
      access_points     = ACCESS_POINTS[access_constraint]
      weighted_subtotal = 0.30 * slope_points
                        + 0.30 * <vegetation input, see variants>
                        + 0.25 * structure_points
                        + 0.15 * access_points
      # EVALUATION ORDER IS PINNED — the hardening credit is subtracted from
      # weighted_subtotal BEFORE the hazard multiplier is applied. Multiplying
      # first and subtracting afterwards is incorrect.
      risk_score = round_half_up( min(100.00,
                       (weighted_subtotal - hardening_credit) * HAZARD_MULT[hazard_zone]
                   ), 2 )
      risk_class = EXTREME  if risk_score >= 75.00
                 = HIGH     if risk_score >= 55.00
                 = MODERATE if risk_score >= 35.00
                 = LOW      otherwise
    input_set: "A single Parcel row. The post_inspection_verified variant additionally reads every ZoneEvaluation and HardeningFinding row whose inspection_id equals the Inspection being completed; no other inspection's findings enter the computation."
    constants:
      VEG_POINTS: { IRRIGATED_LANDSCAPE: 15, GRASS: 40, BRUSH: 75, MIXED_CONIFER: 90 }
      ROOF_POINTS: { CLASS_A: 10, CLASS_B: 45, CLASS_C: 80, NONE: 100 }
      ACCESS_POINTS: { NONE: 0, GATED: 25, LOCKED_GATE: 60, DOG_ON_SITE: 40 }
      HAZARD_MULT: { MODERATE: 1.00, HIGH: 1.15, VERY_HIGH: 1.30 }
      HARDENING_CREDIT_PER_ITEM: 4.00
      HARDENING_CREDIT_CAP: 20.00
      RISK_CLASS_THRESHOLDS: { EXTREME: 75.00, HIGH: 55.00, MODERATE: 35.00 }
    precision: "risk_score 2 decimals, round_half_up; the min(100.00, ...) clamp is applied before rounding; risk_class boundaries are inclusive (>=)."
    variants:
      - name: intake_provisional
        when: "Parcel creation and any PATCH that changes slope_pct, vegetation_type, roof_class, access_constraint or hazard_zone while risk_score_basis would remain INTAKE_PROVISIONAL."
        difference: "The vegetation input is the self-reported VEG_POINTS[vegetation_type] and hardening_credit is fixed at 0.00 because no structure-hardening findings exist. Sets risk_score_basis = INTAKE_PROVISIONAL."
      - name: post_inspection_verified
        when: "Inspection completion (result PASS or FAIL)."
        difference: "The vegetation input is Inspection.measured_veg_points from zone_deficiency_assessment instead of VEG_POINTS[vegetation_type], and hardening_credit = min(HARDENING_CREDIT_CAP, HARDENING_CREDIT_PER_ITEM * count(HardeningFinding on this inspection with status == COMPLIANT)). Sets risk_score_basis = POST_INSPECTION_VERIFIED. For identical parcel attributes the two variants produce different risk_score values and can produce different risk_class bands."

  - name: zone_deficiency_assessment
    trigger: "Per-zone fields are computed on POST /fire-district/inspections/{inspection_id}/zone-evaluations; the inspection-level aggregate is computed on POST /fire-district/inspections/{inspection_id}/complete."
    algorithm: threshold
    formula: |
      # --- per ZoneEvaluation row ---
      slope_factor = 1.00 if parcel.slope_pct < 20
                   = 1.25 if 20 <= parcel.slope_pct < 40
                   = 1.50 if parcel.slope_pct >= 40
      required_clearance_ft = round_half_up(ZONE_BASE_FT[zone] * slope_factor, 1)
      deficit_ft   = max(0, required_clearance_ft - measured_clearance_ft)      # 1 decimal
      deficit_ratio = round_half_up(deficit_ft / required_clearance_ft, 4)
      deficiency_severity = NONE     if deficit_ratio == 0.0000
                          = MINOR    if deficit_ratio <= 0.2500
                          = MAJOR    if deficit_ratio <= 0.6000
                          = CRITICAL otherwise
      zone_points = min(100.00, round_half_up(deficit_ratio * 100 * ZONE_WEIGHT[zone], 2))
      points      = min(100.00, round_half_up(zone_points + (LADDER_FUEL_PENALTY if ladder_fuel_present else 0.00), 2))

      # --- inspection-level aggregate: ROUND PER ZONE, THEN SUM ---
      # Each ZoneEvaluation.points is already rounded to 2 decimals; the sum of
      # those rounded values is taken. Summing the unrounded per-zone values and
      # rounding once at the end is incorrect.
      measured_veg_points     = min(100.00, round_half_up(sum(ZoneEvaluation.points), 2))
      hardening_credit_points = min(20.00, 4.00 * count(HardeningFinding with status == COMPLIANT))
      max_deficiency_severity = the worst deficiency_severity among the three
                                ZoneEvaluation rows, ordered NONE < MINOR < MAJOR < CRITICAL
    input_set: "Exactly the three ZoneEvaluation rows (ZONE_0_EMBER, ZONE_1, ZONE_2) and all HardeningFinding rows whose inspection_id equals the completing Inspection. Rows attached to any other inspection on the same parcel are excluded."
    constants:
      ZONE_BASE_FT: { ZONE_0_EMBER: 5, ZONE_1: 30, ZONE_2: 100 }
      ZONE_WEIGHT: { ZONE_0_EMBER: 1.50, ZONE_1: 1.00, ZONE_2: 0.60 }
      LADDER_FUEL_PENALTY: 8.00
      SEVERITY_MINOR_MAX_RATIO: 0.2500
      SEVERITY_MAJOR_MAX_RATIO: 0.6000
      SLOPE_FACTOR_BREAKS: { LOW_MAX_EXCL: 20, MID_MAX_EXCL: 40 }
    precision: "required_clearance_ft 1 decimal round_half_up; deficit_ratio 4 decimals round_half_up; points and measured_veg_points 2 decimals round_half_up. Severity band boundaries are inclusive on the upper edge (a ratio of exactly 0.2500 is MINOR, exactly 0.6000 is MAJOR)."

  - name: notice_compliance_deadline
    trigger: "On ViolationNotice creation (cascaded from inspection completion or the discretionary POST /fire-district/parcels/{parcel_id}/violation-notices) and again on POST /fire-district/violation-notices/{notice_id}/extend."
    algorithm: interval_merge
    formula: |
      # STEP 1 — constructive service
      delivered_at_utc = issued_at_utc                                   if notice_method IN {IN_PERSON, EMAIL}
                       = issued_at_utc + MAIL_SERVICE_DAYS days          if notice_method == CERTIFIED_MAIL
      # STEP 2 — severity base
      base_days = SEVERITY_DAYS[severity]
      # STEP 3 — hazard-zone compression (VERY_HIGH only), floor-protected
      compliance_days = base_days                                        if parcel.hazard_zone != VERY_HIGH
                      = max(MIN_COMPLIANCE_DAYS, ceil(base_days * 0.75)) if parcel.hazard_zone == VERY_HIGH
      # STEP 4 — end-of-day deadline
      deadline_utc = date(delivered_at_utc + compliance_days days) at 23:59:59Z
      # STEP 5 — extension (in place, at most MAX_EXTENSIONS times)
      deadline_utc := date(deadline_utc + EXTENSION_DAYS days) at 23:59:59Z
      # A notice is OVERDUE only when deadline_utc < logical clock; a clock reading
      # exactly equal to deadline_utc is still within the compliance window.
    input_set: "The single ViolationNotice plus its Parcel's hazard_zone. Severity comes from the substantiating Inspection.max_deficiency_severity, or is CRITICAL for an access-refusal notice."
    constants:
      MAIL_SERVICE_DAYS: 5
      SEVERITY_DAYS: { MINOR: 60, MAJOR: 30, CRITICAL: 14 }
      VERY_HIGH_COMPRESSION: 0.75
      MIN_COMPLIANCE_DAYS: 7
      EXTENSION_DAYS: 30
      MAX_EXTENSIONS: 1
    precision: "compliance_days is a whole number produced by ceil(); deadline_utc always carries the time component 23:59:59Z with zero fractional seconds."

  - name: abatement_cost_recovery
    trigger: "On POST /fire-district/abatement-orders/{order_id}/verify-completion (the WORK_COMPLETE -> INVOICED transition)."
    algorithm: waterfall_allocation
    formula: |
      # EVALUATION ORDER IS PINNED. The subsidy tier is keyed on
      # pre_subsidy_total_cents produced in STEP 5 — NOT on the final
      # total_recoverable_cents produced in STEP 7 — so the apparent circularity
      # (total depends on subsidy, subsidy tier depends on a total) is resolved.
      # STEP 1
      labor_line_cents        = round_half_up(actual_crew_hours * contractor.hourly_rate_cents)
      # STEP 2
      disposal_line_cents     = round_half_up(green_waste_tons * DISPOSAL_RATE_PER_TON_CENTS)
      # STEP 3
      mobilization_line_cents = contractor.mobilization_fee_cents
      # STEP 4 — PER-LINE ROUNDING, THEN SUM (round-then-sum, not sum-then-round)
      admin_overhead_cents    = round_half_up(labor_line_cents        * ADMIN_OVERHEAD_PCT)
                              + round_half_up(disposal_line_cents     * ADMIN_OVERHEAD_PCT)
                              + round_half_up(mobilization_line_cents * ADMIN_OVERHEAD_PCT)
      # STEP 5
      pre_subsidy_total_cents = labor_line_cents + disposal_line_cents
                              + mobilization_line_cents + admin_overhead_cents
      # STEP 6 — tier selected from STEP 5's value
      subsidy_pct = SUBSIDY_TIERS lookup on pre_subsidy_total_cents
      district_subsidy_cents  = round_half_up(pre_subsidy_total_cents * subsidy_pct)
      # STEP 7
      total_recoverable_cents = pre_subsidy_total_cents - district_subsidy_cents
      invoice_due_utc         = date(logical clock + cycle.invoice_due_days days) at 23:59:59Z
      # STEP 8 — payment waterfall, evaluated per CostRecoveryPayment
      bucket_order  = [ADMIN_OVERHEAD, MOBILIZATION, DISPOSAL, LABOR]
      bucket_cap    = { ADMIN_OVERHEAD: admin_overhead_cents,
                        MOBILIZATION:   mobilization_line_cents,
                        DISPOSAL:       disposal_line_cents,
                        LABOR:          labor_line_cents }
      # The recoverable amount is poured into the buckets in bucket_order, each
      # filled to bucket_cap before the next; the subsidy shortfall therefore
      # lands entirely in the LAST bucket (LABOR).
      recoverable_alloc[b] = min(remaining, bucket_cap[b]) walking bucket_order
      # A payment consumes recoverable_alloc in the same bucket_order, net of
      # what earlier payments already consumed.
      allocation[b]            = min(payment_remaining, recoverable_alloc[b] - already_paid[b])
      outstanding_after_cents  = total_recoverable_cents - paid_cents (after this payment)
      # CONSERVATION INVARIANT (must hold after every payment and every lien filing):
      #   total_recoverable_cents == paid_cents + lien_amount_cents + outstanding_after_cents
      #   sum(recoverable_alloc.values()) == total_recoverable_cents
    input_set: "The AbatementOrder's own actual_crew_hours and green_waste_tons, its Contractor's hourly_rate_cents and mobilization_fee_cents, and — for variant selection only — SupportEnrollment rows on the same Parcel whose status IN {APPROVED, COMPLETED, REIMBURSED} and whose created_at is strictly earlier than the substantiating ViolationNotice.issued_at_utc."
    constants:
      DISPOSAL_RATE_PER_TON_CENTS: 9200
      ADMIN_OVERHEAD_PCT: 0.125
      SUBSIDY_TIERS: "pre_subsidy_total_cents < 100000 -> 0.30; 100000 <= t < 300000 -> 0.20; t >= 300000 -> 0.10"
      SUBSIDY_TIER_LADDER: "[0.10, 0.20, 0.30] ordered least-to-most generous; the voluntary_precompliance variant steps exactly one position toward more generous, saturating at 0.30"
      ABATEMENT_CAP_CENTS: 750000
    precision: "All monetary values are whole cents; every multiplication is rounded with round_half_up to 0 decimals at the step in which it appears. subsidy_pct is an exact 2-decimal fraction."
    variants:
      - name: district_contracted
        when: "No qualifying earlier SupportEnrollment exists on the parcel (see input_set)."
        difference: "admin_overhead_cents is charged in full per STEP 4 and the subsidy tier is used as looked up. Sets recovery_basis = DISTRICT_CONTRACTED."
      - name: voluntary_precompliance
        when: "At least one qualifying earlier SupportEnrollment exists on the parcel (see input_set)."
        difference: "admin_overhead_cents is forced to 0 (so pre_subsidy_total_cents equals the three raw cost lines) AND subsidy_pct is stepped one position toward more generous along SUBSIDY_TIER_LADDER. For identical cost lines this yields a strictly smaller total_recoverable_cents than district_contracted. Sets recovery_basis = VOLUNTARY_PRECOMPLIANCE."

  - name: cost_share_award
    trigger: "On POST /fire-district/support-enrollments for a SupportProgram whose program_type == COST_SHARE_GRANT, and again at STEP 4 of a cycle advance when a WAITLISTED enrollment is evaluated for promotion."
    algorithm: tiered_pricing
    formula: |
      # EVALUATION ORDER IS PINNED. The bonus tier is keyed on
      # award_before_bonus_cents from STEP 3 — NOT on the final award_cents from
      # STEP 5 — so the apparent circularity (award = base + bonus, bonus tier
      # keyed on an award bracket) is resolved to a single well-defined value.
      # STEP 1
      eligible_cost_cents      = min(vendor_invoice_cents, PER_PARCEL_CAP_CENTS)
      # STEP 2
      base_match_pct           = MATCH_BY_RISK_CLASS[parcel.risk_class]   # read at decision time
      # STEP 3
      award_before_bonus_cents = round_half_up(eligible_cost_cents * base_match_pct)
      # STEP 4 — tier selected from STEP 3's value
      bonus_pct                = BONUS_TIERS lookup on award_before_bonus_cents
      hardship_bonus_cents     = round_half_up(award_before_bonus_cents * bonus_pct)
                                   if parcel.owner_hardship_flag else 0
      # STEP 5
      award_cents              = award_before_bonus_cents + hardship_bonus_cents
      # STEP 6 — all-or-nothing funding against the program budget
      if award_cents <= program.budget_remaining_cents AND reserved_slots < capacity_slots:
          reserved_amount_cents = award_cents ; status = APPROVED
      else:
          reserved_amount_cents = 0           ; status = WAITLISTED
      # BUDGET CONSERVATION INVARIANT (must hold after every enrollment mutation):
      #   program.budget_remaining_cents
      #     == program.budget_total_cents
      #        - sum(SupportEnrollment.reserved_amount_cents
      #              over enrollments on this program with status IN {APPROVED, COMPLETED, REIMBURSED})
    input_set: "The single SupportEnrollment, its SupportProgram's budget_remaining_cents / capacity_slots / reserved_slots, and its Parcel's risk_class and owner_hardship_flag as they stand at decision time. Enrollments with status CANCELLED, NO_SHOW or WAITLISTED contribute 0 to the reserved sum."
    constants:
      PER_PARCEL_CAP_CENTS: 250000
      MATCH_BY_RISK_CLASS: { EXTREME: 0.75, HIGH: 0.60, MODERATE: 0.45, LOW: 0.30 }
      BONUS_TIERS: "award_before_bonus_cents < 50000 -> 0.15; 50000 <= a < 120000 -> 0.10; a >= 120000 -> 0.05"
      COST_SHARE_INVOICE_CAP_CENTS: 1000000
    precision: "Whole cents throughout, round_half_up at STEP 3 and STEP 4. Tier boundaries are inclusive on the lower edge (an award_before_bonus_cents of exactly 120000 selects 0.05)."

  - name: inspection_priority_rank
    trigger: "At STEP 5 of POST /fire-district/inspection-cycles/{cycle_id}/advance, and read back through GET /fire-district/inspection-cycles/{cycle_id}/priority-queue."
    algorithm: chronological
    formula: |
      candidate_set = every Parcel with exemption_flag == false
                      (parcels with exemption_flag == true keep inspection_priority_rank = null)
      sort_key (all descending unless noted):
        1. RISK_CLASS_ORDINAL[risk_class]      # EXTREME 4, HIGH 3, MODERATE 2, LOW 1
        2. open_violation_count
        3. staleness_days = floor(
             (logical clock - last_passed_inspection_at_utc) / 86400 seconds
           ), or NEVER_INSPECTED_STALENESS_DAYS when last_passed_inspection_at_utc is null
        4. Parcel.created_at ASCENDING          # final tie-break; Parcel.id is NEVER used
      inspection_priority_rank = 1-based dense position in that ordering
    input_set: "All Parcel rows with exemption_flag == false, regardless of compliance_status. Exempt parcels are excluded from the ordering entirely rather than ranked last."
    constants:
      RISK_CLASS_ORDINAL: { EXTREME: 4, HIGH: 3, MODERATE: 2, LOW: 1 }
      NEVER_INSPECTED_STALENESS_DAYS: 100000
    precision: "Ranks are consecutive integers starting at 1 with no gaps; staleness_days is a whole number produced by floor()."

  - name: program_compliance_metrics
    trigger: "On GET /fire-district/inspection-cycles/{cycle_id}/metrics and GET /fire-district/communities/{community_id}/metrics (computed on read), and at STEP 6 of a cycle advance / LINK 5 of the inspection-FAIL cascade for the persisted Community.compliance_rate_pct."
    algorithm: aggregation
    formula: |
      eligible_parcels  = Parcels with compliance_status IN {COMPLIANT, NON_COMPLIANT, ABATEMENT_PENDING}
                          # PENDING_INSPECTION and EXEMPT are excluded from BOTH numerator and denominator
      compliant_parcels = eligible_parcels with compliance_status == COMPLIANT
      eligible_parcel_count  = count(eligible_parcels)
      compliant_parcel_count = count(compliant_parcels)
      compliance_rate_pct = null
                              if eligible_parcel_count == 0
                          = round_half_up(100.0 * compliant_parcel_count / eligible_parcel_count, 2)
                              otherwise
      # --- survival correlation ---
      outcome_set = Parcels with structure_survival_outcome IN {SURVIVED, DESTROYED}
                    AND compliance_status IN {COMPLIANT, NON_COMPLIANT, ABATEMENT_PENDING}
      survived_compliant_pct    = round_half_up(100.0 * count(outcome_set, COMPLIANT and SURVIVED)
                                                / count(outcome_set, COMPLIANT), 2)          or null if denominator == 0
      survived_noncompliant_pct = round_half_up(100.0 * count(outcome_set, not COMPLIANT and SURVIVED)
                                                / count(outcome_set, not COMPLIANT), 2)      or null if denominator == 0
      survival_delta_pp = round_half_up(survived_compliant_pct - survived_noncompliant_pct, 2)
                          or null when either component is null
    input_set: "district_scope reads every Parcel row in the database. community_scope reads only Parcels whose community_id equals the target community. In both scopes the status filter above applies; an empty eligible set yields null (never 0.00)."
    constants:
      COMMUNITY_CERTIFY_FLOOR_PCT: 75.00
      COMMUNITY_LAPSE_FLOOR_PCT: 60.00
      COMMUNITY_MIN_MEMBER_PARCELS: 3
    precision: "All percentages 2 decimals round_half_up; null is a distinct value from 0.00 and is what an empty eligible set produces."
    variants:
      - name: district_scope
        when: "GET /fire-district/inspection-cycles/{cycle_id}/metrics."
        difference: "Denominator spans every Parcel in the district, including parcels with community_id == null."
      - name: community_scope
        when: "GET /fire-district/communities/{community_id}/metrics, STEP 6 of a cycle advance, and LINK 5 of the inspection-FAIL cascade."
        difference: "Denominator spans only member Parcels (community_id == the target community); this is the value persisted to Community.compliance_rate_pct and compared against COMMUNITY_CERTIFY_FLOOR_PCT / COMMUNITY_LAPSE_FLOOR_PCT."

# ============================================================================
# 1.4 Validation Rules Table (evaluated strictly in ascending priority order)
# ============================================================================

validations:

  - priority: 10
    category: auth
    check: "X-User-Role and X-User-ID headers are both present and X-User-Role is one of the seven declared roles."
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 12
    category: auth
    check: "The acting role appears in the target endpoint's roles list in §1.5."
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: all

  - priority: 20
    category: existence
    check: "Every resource referenced in the path exists, validated left-to-right, then every FK supplied in the body in declaration order: cycle_id, parcel_id, community_id, inspector_id, contractor_id, inspection_id, violation_notice_id, support_program_id."
    error_id: "ERR_CYCLE_NOT_FOUND | ERR_PARCEL_NOT_FOUND | ERR_COMMUNITY_NOT_FOUND | ERR_INSPECTOR_NOT_FOUND | ERR_CONTRACTOR_NOT_FOUND | ERR_INSPECTION_NOT_FOUND | ERR_NOTICE_NOT_FOUND | ERR_ABATEMENT_ORDER_NOT_FOUND | ERR_PROGRAM_NOT_FOUND | ERR_ENROLLMENT_NOT_FOUND | ERR_CERTIFICATE_NOT_FOUND"
    http_status: 404
    applies_to: all

  - priority: 22
    category: auth
    check: "For entity_backed roles acting on their own resource, X-User-ID equals the resource's owning FK: Inspector -> Inspection.inspector_id, PropertyOwner -> Parcel.id (directly, or transitively via ViolationNotice.parcel_id / SupportEnrollment.parcel_id / AbatementOrder -> ViolationNotice.parcel_id), Contractor -> AbatementOrder.contractor_id, CommunityOrganizer -> Community.id."
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "POST /fire-district/inspections/{inspection_id}/access-denial, POST /fire-district/inspections/{inspection_id}/zone-evaluations, POST /fire-district/inspections/{inspection_id}/hardening-findings, POST /fire-district/inspections/{inspection_id}/complete, POST /fire-district/violation-notices/{notice_id}/extend, POST /fire-district/abatement-orders/{order_id}/complete-work, POST /fire-district/abatement-orders/{order_id}/payments, POST /fire-district/support-enrollments, POST /fire-district/support-enrollments/{enrollment_id}/cancel, POST /fire-district/parcels/{parcel_id}/compliance-certificates, POST /fire-district/communities/{community_id}/submit-certification, POST /fire-district/communities/{community_id}/reopen-organizing"

  - priority: 30
    category: business_constraint
    check: "Required body fields are present, enum values are members of their declared constraint set, numbers respect their declared ranges (slope_pct 0..100, crew_hours a positive multiple of 0.5, amount_cents >= 1), datetimes parse as ISO-8601 UTC, and window ends strictly follow window starts."
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all

  - priority: 31
    category: business_temporal
    check: "scheduled_end_utc > scheduled_start_utc for Inspection windows, work_end_utc > work_start_utc for AbatementOrder windows, and service_window_end_utc > service_window_start_utc for SupportProgram windows."
    error_id: ERR_INVALID_TIME_WINDOW
    http_status: 422
    applies_to: "POST /fire-district/inspections, POST /fire-district/inspections/{inspection_id}/reschedule, POST /fire-district/abatement-orders/{order_id}/award, POST /fire-district/support-programs"

  - priority: 32
    category: business_constraint
    check: "vendor_invoice_cents is present when SupportProgram.program_type == COST_SHARE_GRANT and absent otherwise."
    error_id: ERR_MISSING_VENDOR_INVOICE
    http_status: 422
    applies_to: "POST /fire-district/support-enrollments"

  - priority: 34
    category: business_constraint
    check: "Uniqueness of natural keys: Parcel.apn, Contractor.business_name, Community.name, InspectionCycle.season_year."
    error_id: ERR_APN_ALREADY_REGISTERED
    http_status: 409
    applies_to: "POST /fire-district/parcels, POST /fire-district/contractors, POST /fire-district/communities, POST /fire-district/inspection-cycles"

  - priority: 36
    category: state
    check: "expected_parcel_version equals the current Parcel.version (OCC), and expected_program_version equals the current SupportProgram.version (OCC)."
    error_id: "ERR_STALE_PARCEL_VERSION | ERR_STALE_PROGRAM_VERSION"
    http_status: 412
    applies_to: "POST /fire-district/parcels/{parcel_id}/violation-notices, PATCH /fire-district/parcels/{parcel_id}, POST /fire-district/support-enrollments"

  - priority: 40
    category: state
    check: "The target resource is in a state from which the requested transition is declared in §1.2. Includes: a notice that must be OVERDUE before abatement may be authorized (ERR_NOTICE_NOT_OVERDUE), a second activation while another cycle is ACTIVE (ERR_CYCLE_ALREADY_ACTIVE), a zone already evaluated on this inspection (ERR_ZONE_ALREADY_EVALUATED), a third access denial (ERR_ACCESS_DENIAL_LIMIT_REACHED), a duplicate non-CANCELLED enrollment for the same parcel and program (ERR_DUPLICATE_ENROLLMENT), and every other undeclared transition (ERR_INVALID_STATE)."
    error_id: "ERR_INVALID_STATE | ERR_NOTICE_NOT_OVERDUE | ERR_CYCLE_ALREADY_ACTIVE | ERR_ZONE_ALREADY_EVALUATED | ERR_ACCESS_DENIAL_LIMIT_REACHED | ERR_DUPLICATE_ENROLLMENT"
    http_status: 409
    applies_to: "every state-changing endpoint"

  - priority: 42
    category: state
    check: "The InspectionCycle governing the operation has status == ACTIVE (inspection scheduling, notice service, zone evaluation, hardening findings, completion, support-program creation, enrollment creation, cycle advance and cycle close)."
    error_id: ERR_CYCLE_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /fire-district/inspections, POST /fire-district/inspections/{inspection_id}/notice, POST /fire-district/inspections/{inspection_id}/zone-evaluations, POST /fire-district/inspections/{inspection_id}/hardening-findings, POST /fire-district/inspections/{inspection_id}/complete, POST /fire-district/support-programs, POST /fire-district/support-enrollments, POST /fire-district/inspection-cycles/{cycle_id}/advance, POST /fire-district/inspection-cycles/{cycle_id}/close"

  - priority: 44
    category: business_temporal
    check: "The SupportProgram's service window is open at the logical clock: service_window_start_utc <= clock < service_window_end_utc (half-open)."
    error_id: ERR_PROGRAM_WINDOW_CLOSED
    http_status: 409
    applies_to: "POST /fire-district/support-enrollments"

  - priority: 50
    category: business_safety
    check: "An Inspection on a Parcel whose hazard_zone == VERY_HIGH requires Inspector.certification_level == WUI_SPECIALIST."
    error_id: ERR_INSPECTOR_NOT_CERTIFIED
    http_status: 422
    applies_to: "POST /fire-district/inspections, POST /fire-district/inspections/{inspection_id}/reschedule"

  - priority: 51
    category: business_safety
    check: "The assigned Inspector.status == ACTIVE at scheduling, rescheduling and abatement verification time."
    error_id: ERR_INSPECTOR_SUSPENDED
    http_status: 409
    applies_to: "POST /fire-district/inspections, POST /fire-district/inspections/{inspection_id}/reschedule, POST /fire-district/abatement-orders/{order_id}/verify-completion"

  - priority: 52
    category: business_safety
    check: "Segregation of duties: the Inspector verifying an AbatementOrder's completion MUST NOT be the Inspector recorded on the Inspection referenced by that order's ViolationNotice."
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /fire-district/abatement-orders/{order_id}/verify-completion"

  - priority: 54
    category: business_safety
    check: "Notice lead time: scheduled_start_utc - logical clock >= InspectionCycle.notice_lead_days whole days when serving an owner notice."
    error_id: ERR_NOTICE_LEAD_TIME_VIOLATION
    http_status: 422
    applies_to: "POST /fire-district/inspections/{inspection_id}/notice"

  - priority: 56
    category: business_referential
    check: "Completion requires exactly one ZoneEvaluation for each of ZONE_0_EMBER, ZONE_1 and ZONE_2 on this inspection, and the submitted result must agree with the findings (PASS requires every deficiency_severity == NONE; FAIL requires at least one != NONE)."
    error_id: ERR_ZONE_COVERAGE_INCOMPLETE
    http_status: 422
    applies_to: "POST /fire-district/inspections/{inspection_id}/complete"

  - priority: 58
    category: business_referential
    check: "Certificate issuance requires Parcel.compliance_status IN {COMPLIANT, EXEMPT} and no ViolationNotice on the parcel with status IN {ISSUED, EXTENDED, OVERDUE, ABATEMENT_AUTHORIZED}. Error selection is unambiguous: ERR_PARCEL_NOT_INSPECTED when compliance_status == PENDING_INSPECTION, otherwise ERR_OPEN_VIOLATION_EXISTS."
    error_id: "ERR_OPEN_VIOLATION_EXISTS | ERR_PARCEL_NOT_INSPECTED"
    http_status: 409
    applies_to: "POST /fire-district/compliance-certificates/{certificate_id}/decision"

  - priority: 59
    category: business_referential
    check: "Community certification submission requires at least COMMUNITY_MIN_MEMBER_PARCELS member Parcels and parcels_outreached_count >= the member-Parcel count; the CERTIFY decision additionally requires compliance_rate_pct >= COMMUNITY_CERTIFY_FLOOR_PCT."
    error_id: ERR_COMMUNITY_THRESHOLD_NOT_MET
    http_status: 422
    applies_to: "POST /fire-district/communities/{community_id}/submit-certification, POST /fire-district/communities/{community_id}/certification-decision"

  - priority: 62
    category: business_temporal
    check: "Inspector occupation conflict — the new HALF-OPEN window [scheduled_start_utc, scheduled_end_utc) must not intersect the half-open window of any other Inspection with the same inspector_id whose status IN {SCHEDULED, NOTICED, ACCESS_DENIED}. Exact adjacency (new start == existing end, or new end == existing start) does NOT conflict."
    error_id: ERR_INSPECTOR_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /fire-district/inspections, POST /fire-district/inspections/{inspection_id}/reschedule"

  - priority: 64
    category: business_temporal
    check: "Contractor occupation conflict — the new CLOSED window [work_start_utc, work_end_utc] must not intersect the closed window of any other AbatementOrder with the same contractor_id whose status IN {AWARDED, WORK_COMPLETE}. Touching endpoints (new start == existing end) DO conflict, unlike the inspector rule."
    error_id: ERR_CONTRACTOR_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /fire-district/abatement-orders/{order_id}/award"

  - priority: 66
    category: business_constraint
    check: "Contractor licensing and insurance: license_status == ACTIVE, and work_start_utc < insurance_expiry_utc."
    error_id: "ERR_CONTRACTOR_NOT_LICENSED | ERR_CONTRACTOR_INSURANCE_LAPSED"
    http_status: 409
    applies_to: "POST /fire-district/abatement-orders/{order_id}/award"

  - priority: 68
    category: business_constraint
    check: "Notice extension limit: extension_count < MAX_EXTENSIONS (1). The extend endpoint accepts BOTH ISSUED and EXTENDED as from-states, so an already-extended notice clears the priority-40 state gate and is answered here rather than with ERR_INVALID_STATE."
    error_id: ERR_EXTENSION_LIMIT_REACHED
    http_status: 409
    applies_to: "POST /fire-district/violation-notices/{notice_id}/extend"

  - priority: 70
    category: business_constraint
    check: "Contractor aggregate daily capacity — for every UTC calendar date covered by the new closed work window, the count of that contractor's AbatementOrders with status IN {AWARDED, WORK_COMPLETE} whose closed window covers that date must stay <= max_daily_orders."
    error_id: ERR_CONTRACTOR_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /fire-district/abatement-orders/{order_id}/award"

  - priority: 72
    category: business_fiscal
    check: "estimated_cost_cents <= ABATEMENT_CAP_CENTS (750000) at abatement authorization."
    error_id: ERR_ABATEMENT_CAP_EXCEEDED
    http_status: 422
    applies_to: "POST /fire-district/violation-notices/{notice_id}/authorize-abatement"

  - priority: 74
    category: business_fiscal
    check: "vendor_invoice_cents <= COST_SHARE_INVOICE_CAP_CENTS (1000000, i.e. 4x PER_PARCEL_CAP_CENTS); invoices above that are refused outright rather than clamped at the per-parcel cap."
    error_id: ERR_COST_SHARE_CAP_EXCEEDED
    http_status: 422
    applies_to: "POST /fire-district/support-enrollments"

  - priority: 76
    category: business_fiscal
    check: "amount_cents <= AbatementOrder.total_recoverable_cents - AbatementOrder.paid_cents."
    error_id: ERR_PAYMENT_EXCEEDS_OUTSTANDING
    http_status: 422
    applies_to: "POST /fire-district/abatement-orders/{order_id}/payments"

# ============================================================================
# 1.5 API Endpoint Table   (all business paths under api_prefix /fire-district)
# ============================================================================

endpoints:

  # --- InspectionCycle -------------------------------------------------------
  - method: POST
    path: "/fire-district/inspection-cycles"
    description: "Create a fire-season inspection cycle in PLANNING."
    roles: [ProgramAdmin]
    code: 201
    input: ["season_year", "notice_lead_days?", "invoice_due_days?"]
    output: InspectionCycle
    side_effects: ["initializes status = PLANNING, epoch = 0, version = 1"]

  - method: POST
    path: "/fire-district/inspection-cycles/{cycle_id}/activate"
    description: "Move a PLANNING cycle to ACTIVE; rejected while another cycle is ACTIVE."
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: InspectionCycle
    side_effects: ["sets activated_at_utc", "increments InspectionCycle.version by 1"]

  - method: POST
    path: "/fire-district/inspection-cycles/{cycle_id}/advance"
    description: "Ops-run checkpoint. Executes STEPS 1-8 of the cycle-advance side-effect list in §1.2 in that exact order."
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: InspectionCycle
    side_effects:
      - "expires ISSUED/EXTENDED notices past deadline_utc to OVERDUE and marks their parcels NON_COMPLIANT"
      - "converts INVOICED orders past invoice_due_utc to LIEN_FILED with lien_amount_cents"
      - "promotes WAITLISTED SupportEnrollments in created_at ASC order and debits SupportProgram.budget_remaining_cents"
      - "recomputes Parcel.inspection_priority_rank per calculations.inspection_priority_rank"
      - "recomputes Community.compliance_rate_pct then lapses CERTIFIED communities below COMMUNITY_LAPSE_FLOOR_PCT"
      - "increments epoch by 1 and InspectionCycle.version by 1"

  - method: POST
    path: "/fire-district/inspection-cycles/{cycle_id}/close"
    description: "Close an ACTIVE cycle once no inspection remains in SCHEDULED, NOTICED or ACCESS_DENIED."
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: InspectionCycle
    side_effects: ["sets closed_at_utc", "increments InspectionCycle.version by 1"]

  - method: GET
    path: "/fire-district/inspection-cycles/{cycle_id}"
    description: "Read one inspection cycle including its epoch counter."
    roles: [ProgramAdmin, FireMarshal]
    code: 200
    input: []
    output: InspectionCycle
    side_effects: []

  - method: GET
    path: "/fire-district/inspection-cycles/{cycle_id}/metrics"
    description: "District-scope program metrics computed on read per calculations.program_compliance_metrics (district_scope variant)."
    roles: [ProgramAdmin, FireMarshal]
    code: 200
    input: []
    output: "{ eligible_parcel_count: integer, compliant_parcel_count: integer, compliance_rate_pct: number, survived_compliant_pct: number, survived_noncompliant_pct: number, survival_delta_pp: number, epoch: integer }"
    side_effects: []

  - method: GET
    path: "/fire-district/inspection-cycles/{cycle_id}/priority-queue"
    description: "Non-exempt parcels ordered by calculations.inspection_priority_rank ascending (rank 1 first)."
    roles: [ProgramAdmin, FireMarshal]
    code: 200
    input: ["limit?", "offset?"]
    output: Parcel[]
    side_effects: []

  # --- Community -------------------------------------------------------------
  - method: POST
    path: "/fire-district/communities"
    description: "Register a neighborhood for the community certification program."
    roles: [ProgramAdmin]
    code: 201
    input: [name, organizer_name, target_certification_year]
    output: Community
    side_effects: ["initializes status = ORGANIZING, compliance_rate_pct = null"]

  - method: GET
    path: "/fire-district/communities/{community_id}"
    description: "Read one community including status, compliance_rate_pct and lapse_count."
    roles: [ProgramAdmin, FireMarshal, CommunityOrganizer]
    code: 200
    input: []
    output: Community
    side_effects: []

  - method: GET
    path: "/fire-district/communities/{community_id}/metrics"
    description: "Community-scope metrics computed on read per calculations.program_compliance_metrics (community_scope variant)."
    roles: [ProgramAdmin, FireMarshal, CommunityOrganizer]
    code: 200
    input: []
    output: "{ eligible_parcel_count: integer, compliant_parcel_count: integer, compliance_rate_pct: number, member_parcel_count: integer }"
    side_effects: []

  - method: POST
    path: "/fire-district/communities/{community_id}/submit-certification"
    description: "Organizer submits the neighborhood certification application (ORGANIZING -> SUBMITTED)."
    roles: [CommunityOrganizer]
    code: 200
    input: [parcels_outreached_count]
    output: Community
    side_effects: ["records parcels_outreached_count", "recomputes compliance_rate_pct (community_scope)", "increments Community.version by 1"]

  - method: POST
    path: "/fire-district/communities/{community_id}/certification-decision"
    description: "Fire marshal certifies or defers a SUBMITTED community."
    roles: [FireMarshal]
    code: 200
    input: ["decision", "note?"]
    output: Community
    side_effects: ["CERTIFY sets certified_at_utc; DEFER leaves it null", "increments Community.version by 1"]

  - method: POST
    path: "/fire-district/communities/{community_id}/reopen-organizing"
    description: "Organizer reopens a DEFERRED or LAPSED community for another certification round."
    roles: [CommunityOrganizer]
    code: 200
    input: []
    output: Community
    side_effects: ["resets parcels_outreached_count to 0", "increments Community.version by 1"]

  # --- Parcel ----------------------------------------------------------------
  - method: POST
    path: "/fire-district/parcels"
    description: "Add a WUI parcel to the inventory; scores it with the intake_provisional risk variant."
    roles: [ProgramAdmin]
    code: 201
    input: ["apn", "owner_name", "owner_email", "situs_address", "community_id?", "structure_present?", "roof_class", "vegetation_type", "slope_pct", "lot_area_sqft", "hazard_zone", "access_constraint", "owner_hardship_flag?"]
    output: Parcel
    side_effects:
      - "computes risk_score and risk_class under calculations.parcel_risk_score (intake_provisional), setting risk_score_basis = INTAKE_PROVISIONAL"
      - "initializes compliance_status = PENDING_INSPECTION, open_violation_count = 0, inspection_priority_rank = null"

  - method: GET
    path: "/fire-district/parcels/{parcel_id}"
    description: "Read one parcel including risk_score, risk_class, compliance_status and inspection_priority_rank."
    roles: [ProgramAdmin, FireMarshal, Inspector, PropertyOwner, TitleAgent]
    code: 200
    input: []
    output: Parcel
    side_effects: []

  - method: GET
    path: "/fire-district/parcels"
    description: "List parcels, filterable by community and derived posture."
    roles: [ProgramAdmin, FireMarshal]
    code: 200
    input: ["community_id?", "compliance_status?", "risk_class?", "limit?", "offset?"]
    output: Parcel[]
    side_effects: []

  - method: PATCH
    path: "/fire-district/parcels/{parcel_id}"
    description: "Update parcel attributes under OCC; rescoring uses the intake_provisional variant unless a completed inspection already pinned POST_INSPECTION_VERIFIED."
    roles: [ProgramAdmin]
    code: 200
    input: ["expected_parcel_version", "access_constraint?", "roof_class?", "vegetation_type?", "slope_pct?", "hazard_zone?", "owner_email?", "community_id?", "owner_hardship_flag?", "exemption_flag?"]
    output: Parcel
    side_effects:
      - "recomputes risk_score/risk_class when any scoring field changes"
      - "setting exemption_flag = true sets compliance_status = EXEMPT and inspection_priority_rank = null"
      - "increments Parcel.version by 1"

  - method: POST
    path: "/fire-district/parcels/{parcel_id}/survival-outcome"
    description: "Record a post-incident structure outcome feeding the survival-correlation metric."
    roles: [ProgramAdmin]
    code: 200
    input: [incident_name, outcome, incident_date_utc]
    output: Parcel
    side_effects: ["sets structure_survival_outcome, survival_incident_name, survival_incident_date_utc", "increments Parcel.version by 1"]

  - method: POST
    path: "/fire-district/parcels/{parcel_id}/violation-notices"
    description: "Issue a discretionary ViolationNotice against a parcel under OCC on expected_parcel_version; supersedes any still-open notice on the same parcel."
    roles: [ProgramAdmin]
    code: 201
    input: [inspection_id, notice_method, expected_parcel_version]
    output: ViolationNotice
    side_effects:
      - "drives any existing notice on the parcel with status IN {ISSUED, EXTENDED, OVERDUE} to VOIDED and sets the new notice's supersedes_notice_id"
      - "computes delivered_at_utc, compliance_days and deadline_utc per calculations.notice_compliance_deadline"
      - "recomputes Parcel.open_violation_count and sets compliance_status = NON_COMPLIANT"
      - "increments Parcel.version by 1"

  - method: POST
    path: "/fire-district/parcels/{parcel_id}/compliance-certificates"
    description: "Open a compliance-certificate request for an insurance, real-estate or lender transaction."
    roles: [TitleAgent, PropertyOwner]
    code: 201
    input: [requester_kind, transaction_reference]
    output: ComplianceCertificate
    side_effects: ["initializes status = REQUESTED with every snapshot field null"]

  # --- Inspector / Contractor ------------------------------------------------
  - method: POST
    path: "/fire-district/inspectors"
    description: "Register a district inspector with a certification level."
    roles: [ProgramAdmin]
    code: 201
    input: ["full_name", "certification_level", "status?"]
    output: Inspector
    side_effects: ["initializes assigned_open_count = 0"]

  - method: GET
    path: "/fire-district/inspectors/{inspector_id}"
    description: "Read one inspector including certification_level and assigned_open_count."
    roles: [ProgramAdmin, FireMarshal]
    code: 200
    input: []
    output: Inspector
    side_effects: []

  - method: POST
    path: "/fire-district/contractors"
    description: "Register an abatement contractor with rates, licence state and insurance expiry."
    roles: [ProgramAdmin]
    code: 201
    input: ["business_name", "hourly_rate_cents", "mobilization_fee_cents", "license_status?", "insurance_expiry_utc", "max_daily_orders?"]
    output: Contractor
    side_effects: ["initializes committed_crew_hours = 0, completed_crew_hours = 0"]

  - method: GET
    path: "/fire-district/contractors/{contractor_id}"
    description: "Read one contractor including committed_crew_hours and completed_crew_hours."
    roles: [ProgramAdmin, FireMarshal, Contractor]
    code: 200
    input: []
    output: Contractor
    side_effects: []

  - method: PATCH
    path: "/fire-district/contractors/{contractor_id}"
    description: "Update a contractor's licence, insurance, rates or daily order cap."
    roles: [ProgramAdmin]
    code: 200
    input: ["license_status?", "insurance_expiry_utc?", "hourly_rate_cents?", "mobilization_fee_cents?", "max_daily_orders?"]
    output: Contractor
    side_effects: ["increments Contractor.version by 1"]

  # --- Inspection ------------------------------------------------------------
  - method: POST
    path: "/fire-district/inspections"
    description: "Schedule an inspection for a parcel inside an ACTIVE cycle."
    roles: [ProgramAdmin]
    code: 201
    input: [parcel_id, cycle_id, inspector_id, inspection_type, scheduled_start_utc, scheduled_end_utc, access_arrangement]
    output: Inspection
    side_effects: ["initializes status = SCHEDULED, access_denial_count = 0", "increments Inspector.assigned_open_count by 1"]

  - method: GET
    path: "/fire-district/inspections/{inspection_id}"
    description: "Read one inspection including result, access_denial_count, measured_veg_points and max_deficiency_severity."
    roles: [ProgramAdmin, FireMarshal, Inspector, PropertyOwner]
    code: 200
    input: []
    output: Inspection
    side_effects: []

  - method: GET
    path: "/fire-district/inspections"
    description: "List inspections filterable by parcel, cycle, inspector or status."
    roles: [ProgramAdmin, FireMarshal, Inspector]
    code: 200
    input: ["parcel_id?", "cycle_id?", "inspector_id?", "status?", "limit?", "offset?"]
    output: Inspection[]
    side_effects: []

  - method: POST
    path: "/fire-district/inspections/{inspection_id}/notice"
    description: "Send the property-owner entry notice (SCHEDULED -> NOTICED); enforces the notice lead-time floor."
    roles: [ProgramAdmin]
    code: 200
    input: [notice_method]
    output: Inspection
    side_effects: ["sets notice_sent_at_utc and notice_method", "increments Inspection.version by 1"]

  - method: POST
    path: "/fire-district/inspections/{inspection_id}/access-denial"
    description: "Inspector records a denied or failed site access attempt."
    roles: [Inspector]
    code: 200
    input: [reason_code]
    output: Inspection
    side_effects:
      - "increments access_denial_count by 1"
      - "moves to ACCESS_DENIED below the limit, or to ABANDONED at the limit while releasing Inspector.assigned_open_count by 1"
      - "increments Inspection.version by 1"

  - method: POST
    path: "/fire-district/inspections/{inspection_id}/reschedule"
    description: "Re-book an ACCESS_DENIED inspection into a new window (returns it to SCHEDULED); any other status is rejected with ERR_INVALID_STATE."
    roles: [ProgramAdmin]
    code: 200
    input: ["scheduled_start_utc", "scheduled_end_utc", "inspector_id?"]
    output: Inspection
    side_effects:
      - "clears notice_sent_at_utc and notice_method"
      - "on inspector reassignment decrements the previous Inspector.assigned_open_count by 1 and increments the new one by 1"
      - "increments Inspection.version by 1"

  - method: POST
    path: "/fire-district/inspections/{inspection_id}/cancel"
    description: "Cancel a not-yet-completed inspection."
    roles: [ProgramAdmin]
    code: 200
    input: [reason]
    output: Inspection
    side_effects: ["decrements Inspector.assigned_open_count by 1", "increments Inspection.version by 1"]

  - method: POST
    path: "/fire-district/inspections/{inspection_id}/zone-evaluations"
    description: "Record one defensible-space zone measurement (ZONE_0_EMBER, ZONE_1 or ZONE_2) for the inspection."
    roles: [Inspector]
    code: 201
    input: ["zone", "measured_clearance_ft", "ladder_fuel_present?"]
    output: ZoneEvaluation
    side_effects: ["computes required_clearance_ft, deficit_ft, deficit_ratio, deficiency_severity and points per calculations.zone_deficiency_assessment"]

  - method: POST
    path: "/fire-district/inspections/{inspection_id}/hardening-findings"
    description: "Record one structure-hardening finding (ember-resistant vent, deck, eave, roof or window item)."
    roles: [Inspector]
    code: 201
    input: [item_code, status]
    output: HardeningFinding
    side_effects: ["sets credit_points = 4.00 when status == COMPLIANT and 0.00 otherwise"]

  - method: POST
    path: "/fire-district/inspections/{inspection_id}/complete"
    description: "Close out an inspection with PASS or FAIL; a FAIL fires the inspection-complete-FAIL cascade in §1.2."
    roles: [Inspector]
    code: 200
    input: ["result", "violation_notice_method?"]
    output: Inspection
    side_effects:
      - "requires all three zones evaluated; sets measured_veg_points, hardening_credit_points and max_deficiency_severity"
      - "rescores the parcel with calculations.parcel_risk_score (post_inspection_verified) and sets risk_score_basis = POST_INSPECTION_VERIFIED"
      - "on FAIL creates a ViolationNotice, sets Parcel.compliance_status = NON_COMPLIANT, revokes any ISSUED ComplianceCertificate and recomputes then possibly lapses the Community"
      - "on PASS sets Parcel.compliance_status = COMPLIANT, Parcel.last_passed_inspection_at_utc = the logical clock, and recomputes the Community rate"
      - "decrements Inspector.assigned_open_count by 1"
      - "increments Inspection.version by 1"

  - method: GET
    path: "/fire-district/zone-evaluations/{zone_evaluation_id}"
    description: "Read one immutable zone evaluation."
    roles: [ProgramAdmin, FireMarshal, Inspector]
    code: 200
    input: []
    output: ZoneEvaluation
    side_effects: []

  - method: GET
    path: "/fire-district/zone-evaluations"
    description: "List zone evaluations for an inspection."
    roles: [ProgramAdmin, FireMarshal, Inspector]
    code: 200
    input: ["inspection_id?", "zone?", "limit?", "offset?"]
    output: ZoneEvaluation[]
    side_effects: []

  - method: GET
    path: "/fire-district/hardening-findings/{hardening_finding_id}"
    description: "Read one immutable structure-hardening finding."
    roles: [ProgramAdmin, FireMarshal, Inspector]
    code: 200
    input: []
    output: HardeningFinding
    side_effects: []

  - method: GET
    path: "/fire-district/hardening-findings"
    description: "List structure-hardening findings for an inspection."
    roles: [ProgramAdmin, FireMarshal, Inspector]
    code: 200
    input: ["inspection_id?", "item_code?", "limit?", "offset?"]
    output: HardeningFinding[]
    side_effects: []

  # --- ViolationNotice -------------------------------------------------------
  - method: GET
    path: "/fire-district/violation-notices/{notice_id}"
    description: "Read one violation notice including deadline_utc, compliance_days and extension_count."
    roles: [ProgramAdmin, FireMarshal, Inspector, PropertyOwner]
    code: 200
    input: []
    output: ViolationNotice
    side_effects: []

  - method: GET
    path: "/fire-district/violation-notices"
    description: "List violation notices filterable by parcel, originating inspection, superseded notice or status."
    roles: [ProgramAdmin, FireMarshal, PropertyOwner]
    code: 200
    input: ["parcel_id?", "inspection_id?", "supersedes_notice_id?", "status?", "limit?", "offset?"]
    output: ViolationNotice[]
    side_effects: []

  - method: POST
    path: "/fire-district/violation-notices/{notice_id}/extend"
    description: "Grant the single permitted compliance extension on an ISSUED notice, before its deadline lapses. An already-EXTENDED notice is an accepted target for the state gate and is refused by validations priority 68 with ERR_EXTENSION_LIMIT_REACHED."
    roles: [ProgramAdmin, PropertyOwner]
    code: 200
    input: [reason]
    output: ViolationNotice
    side_effects:
      - "adds EXTENSION_DAYS to deadline_utc per calculations.notice_compliance_deadline and increments extension_count by 1"
      - "increments ViolationNotice.version by 1"

  - method: POST
    path: "/fire-district/violation-notices/{notice_id}/void"
    description: "Fire marshal voids a notice issued in error; releases the parcel if it holds no other open notice."
    roles: [FireMarshal]
    code: 200
    input: [reason]
    output: ViolationNotice
    side_effects:
      - "decrements Parcel.open_violation_count by 1 and restores compliance_status to COMPLIANT when the count reaches 0 and a passed inspection exists, else PENDING_INSPECTION"
      - "increments ViolationNotice.version by 1"

  - method: POST
    path: "/fire-district/violation-notices/{notice_id}/authorize-abatement"
    description: "Fire marshal exercises abatement authority on an OVERDUE notice, creating an AUTHORIZED AbatementOrder."
    roles: [FireMarshal]
    code: 201
    input: [estimated_cost_cents]
    output: AbatementOrder
    side_effects:
      - "moves the notice to ABATEMENT_AUTHORIZED"
      - "initializes the AbatementOrder in AUTHORIZED with estimated_cost_cents, paid_cents = 0 and lien_amount_cents = 0"
      - "increments ViolationNotice.version by 1"

  # --- AbatementOrder / CostRecoveryPayment ----------------------------------
  - method: GET
    path: "/fire-district/abatement-orders/{order_id}"
    description: "Read one abatement order including labor, overhead, subsidy and recoverable totals."
    roles: [ProgramAdmin, FireMarshal, Contractor, PropertyOwner]
    code: 200
    input: []
    output: AbatementOrder
    side_effects: []

  - method: GET
    path: "/fire-district/abatement-orders"
    description: "List abatement orders filterable by notice, awarded contractor, verifying inspector or status."
    roles: [ProgramAdmin, FireMarshal, Contractor]
    code: 200
    input: ["violation_notice_id?", "contractor_id?", "verified_by_inspector_id?", "status?", "limit?", "offset?"]
    output: AbatementOrder[]
    side_effects: []

  - method: POST
    path: "/fire-district/abatement-orders/{order_id}/award"
    description: "Award an AUTHORIZED order to a licensed, insured contractor for a closed work window."
    roles: [FireMarshal]
    code: 200
    input: [contractor_id, crew_hours, work_start_utc, work_end_utc]
    output: AbatementOrder
    side_effects:
      - "sets contractor_id, crew_hours, work_start_utc, work_end_utc and status = AWARDED"
      - "increments Contractor.committed_crew_hours by crew_hours"
      - "increments AbatementOrder.version by 1"

  - method: POST
    path: "/fire-district/abatement-orders/{order_id}/cancel"
    description: "Cancel an AUTHORIZED or AWARDED order; returns the notice to OVERDUE."
    roles: [FireMarshal]
    code: 200
    input: [reason]
    output: AbatementOrder
    side_effects:
      - "releases Contractor.committed_crew_hours by crew_hours when the order was AWARDED"
      - "returns the ViolationNotice to OVERDUE"
      - "increments AbatementOrder.version by 1"

  - method: POST
    path: "/fire-district/abatement-orders/{order_id}/complete-work"
    description: "Contractor reports actual crew hours and green-waste tonnage (AWARDED -> WORK_COMPLETE)."
    roles: [Contractor]
    code: 200
    input: [actual_crew_hours, green_waste_tons]
    output: AbatementOrder
    side_effects: ["sets actual_crew_hours and green_waste_tons", "increments AbatementOrder.version by 1"]

  - method: POST
    path: "/fire-district/abatement-orders/{order_id}/verify-completion"
    description: "Inspector verifies abated work and invoices the owner; fires the verify-completion cascade in §1.2. The verifying inspector may not be the inspector on the originating inspection."
    roles: [Inspector]
    code: 200
    input: ["verified_note?"]
    output: AbatementOrder
    side_effects:
      - "computes labor_line_cents, disposal_line_cents, mobilization_line_cents, admin_overhead_cents, pre_subsidy_total_cents, subsidy_pct, district_subsidy_cents and total_recoverable_cents per calculations.abatement_cost_recovery (district_contracted)"
      - "sets verified_by_inspector_id, recovery_basis, invoice_due_utc and status = INVOICED"
      - "releases Contractor.committed_crew_hours by crew_hours and adds actual_crew_hours to completed_crew_hours"
      - "clears the ViolationNotice to CLEARED, sets Parcel.compliance_status = COMPLIANT and recomputes the Community rate"
      - "increments AbatementOrder.version by 1"

  - method: POST
    path: "/fire-district/abatement-orders/{order_id}/payments"
    description: "Record an owner cost-recovery payment against an INVOICED or LIEN_FILED order."
    roles: [ProgramAdmin, PropertyOwner]
    code: 201
    input: [amount_cents, method]
    output: CostRecoveryPayment
    side_effects:
      - "increments AbatementOrder.paid_cents by amount_cents"
      - "moves the order to PAID once paid_cents == total_recoverable_cents"
      - "increments AbatementOrder.version by 1"

  - method: GET
    path: "/fire-district/cost-recovery-payments/{payment_id}"
    description: "Read one immutable cost-recovery payment."
    roles: [ProgramAdmin, FireMarshal, PropertyOwner]
    code: 200
    input: []
    output: CostRecoveryPayment
    side_effects: []

  - method: GET
    path: "/fire-district/cost-recovery-payments"
    description: "List cost-recovery payments for an abatement order."
    roles: [ProgramAdmin, FireMarshal, PropertyOwner]
    code: 200
    input: ["abatement_order_id?", "method?", "limit?", "offset?"]
    output: CostRecoveryPayment[]
    side_effects: []

  # --- SupportProgram / SupportEnrollment ------------------------------------
  - method: POST
    path: "/fire-district/support-programs"
    description: "Open a compliance-support program (chipper day, curbside collection or cost-share grant) inside a cycle."
    roles: [ProgramAdmin]
    code: 201
    input: [cycle_id, program_type, budget_total_cents, capacity_slots, service_window_start_utc, service_window_end_utc]
    output: SupportProgram
    side_effects: ["initializes budget_remaining_cents = budget_total_cents and reserved_slots = 0"]

  - method: GET
    path: "/fire-district/support-programs/{support_program_id}"
    description: "Read one support program including budget_remaining_cents and reserved_slots."
    roles: [ProgramAdmin, FireMarshal, PropertyOwner, CommunityOrganizer]
    code: 200
    input: []
    output: SupportProgram
    side_effects: []

  - method: GET
    path: "/fire-district/support-programs"
    description: "List support programs for a cycle."
    roles: [ProgramAdmin, FireMarshal, PropertyOwner, CommunityOrganizer]
    code: 200
    input: ["cycle_id?", "program_type?", "limit?", "offset?"]
    output: SupportProgram[]
    side_effects: []

  - method: POST
    path: "/fire-district/support-enrollments"
    description: "Enrol a parcel in a support program under OCC on expected_program_version; the admission branch (APPROVED or WAITLISTED) is decided inside this call."
    roles: [ProgramAdmin, PropertyOwner]
    code: 201
    input: ["support_program_id", "parcel_id", "vendor_invoice_cents?", "expected_program_version"]
    output: SupportEnrollment
    side_effects:
      - "for COST_SHARE_GRANT computes award_before_bonus_cents, bonus_pct, hardship_bonus_cents and award_cents per calculations.cost_share_award"
      - "APPROVED branch reserves the slot and debits SupportProgram.budget_remaining_cents; WAITLISTED branch reserves nothing and sets waitlist_position"
      - "increments SupportProgram.version by 1"

  - method: GET
    path: "/fire-district/support-enrollments/{enrollment_id}"
    description: "Read one enrollment including award_cents, reserved_amount_cents and waitlist_position."
    roles: [ProgramAdmin, FireMarshal, PropertyOwner]
    code: 200
    input: []
    output: SupportEnrollment
    side_effects: []

  - method: GET
    path: "/fire-district/support-enrollments"
    description: "List enrollments filterable by program, parcel or status."
    roles: [ProgramAdmin, FireMarshal, PropertyOwner]
    code: 200
    input: ["support_program_id?", "parcel_id?", "status?", "limit?", "offset?"]
    output: SupportEnrollment[]
    side_effects: []

  - method: POST
    path: "/fire-district/support-enrollments/{enrollment_id}/complete"
    description: "Close out an APPROVED enrollment; attended == true forks to COMPLETED or REIMBURSED by program_type, attended == false lands on NO_SHOW."
    roles: [ProgramAdmin]
    code: 200
    input: [attended]
    output: SupportEnrollment
    side_effects:
      - "COST_SHARE_GRANT with attended == true sets reimbursed_cents = award_cents without moving budget_remaining_cents"
      - "attended == false zeroes reserved_amount_cents, credits budget_remaining_cents back and decrements reserved_slots"
      - "increments SupportEnrollment.version by 1"

  - method: POST
    path: "/fire-district/support-enrollments/{enrollment_id}/cancel"
    description: "Cancel an APPROVED or WAITLISTED enrollment, compensating any reservation exactly."
    roles: [ProgramAdmin, PropertyOwner]
    code: 200
    input: [reason]
    output: SupportEnrollment
    side_effects:
      - "from APPROVED credits SupportProgram.budget_remaining_cents by reserved_amount_cents and decrements reserved_slots by 1"
      - "from WAITLISTED renumbers the remaining waitlist_position values from 1 in created_at ASC order"
      - "increments SupportEnrollment.version by 1"

  # --- ComplianceCertificate -------------------------------------------------
  - method: GET
    path: "/fire-district/compliance-certificates/{certificate_id}"
    description: "Read one compliance certificate including its issued snapshot fields."
    roles: [ProgramAdmin, FireMarshal, PropertyOwner, TitleAgent]
    code: 200
    input: []
    output: ComplianceCertificate
    side_effects: []

  - method: GET
    path: "/fire-district/compliance-certificates"
    description: "List compliance-certificate requests filterable by parcel or status."
    roles: [ProgramAdmin, FireMarshal, PropertyOwner, TitleAgent]
    code: 200
    input: ["parcel_id?", "requester_kind?", "status?", "limit?", "offset?"]
    output: ComplianceCertificate[]
    side_effects: []

  - method: POST
    path: "/fire-district/compliance-certificates/{certificate_id}/decision"
    description: "Issue or deny a REQUESTED certificate; issuance requires a clean parcel posture."
    roles: [ProgramAdmin]
    code: 200
    input: ["decision", "note?"]
    output: ComplianceCertificate
    side_effects:
      - "ISSUE sets issued_at_utc, expires_at_utc and the snapshot fields; DENY records decision_note only"
      - "increments ComplianceCertificate.version by 1"

  # --- Test clock ------------------------------------------------------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the logical clock used for every deadline, window and expiry comparison. The clock starts at 2026-08-01T00:00:00Z on a fresh server and every timestamp in this scaffold is evaluated against it."
    roles: [ProgramAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: datetime }"
    side_effects: ["advances or rewinds the logical clock; performs no state transitions of its own"]

# ============================================================================
# 1.6 Error Code Catalog
# ============================================================================

errors:

  # --- authentication / authorization ---------------------------------------
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header is missing or blank on any endpoint under /fire-district."
  - id: ERR_FORBIDDEN_ROLE
    http: 403
    condition: "The X-User-Role value is not listed in the endpoint's roles: list in §1.5."
  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "An entity_backed role's X-User-ID does not match the resource it acts on: PropertyOwner whose X-User-ID != the target Parcel.id, Inspector whose X-User-ID != Inspection.inspector_id, Contractor whose X-User-ID != AbatementOrder.contractor_id, or CommunityOrganizer whose X-User-ID != the target Community.id."
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "The Inspector calling POST /fire-district/abatement-orders/{order_id}/verify-completion is the same Inspector recorded on the inspection that produced the order's originating ViolationNotice."

  # --- request shape ---------------------------------------------------------
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "A required input field is absent or null, an enum field carries an undeclared value, a numeric field is negative or outside its declared range, or a computed/system field is supplied and must be ignored per §1.1."
  - id: ERR_INVALID_TIME_WINDOW
    http: 422
    condition: "A window's end timestamp is less than or equal to its start timestamp: scheduled_end_utc <= scheduled_start_utc, work_end_utc <= work_start_utc, or service_window_end_utc <= service_window_start_utc."

  # --- not found -------------------------------------------------------------
  - id: ERR_CYCLE_NOT_FOUND
    http: 404
    condition: "No InspectionCycle exists with the supplied cycle_id, whether in the path or in a request body."
  - id: ERR_COMMUNITY_NOT_FOUND
    http: 404
    condition: "No Community exists with the supplied community_id."
  - id: ERR_PARCEL_NOT_FOUND
    http: 404
    condition: "No Parcel exists with the supplied parcel_id."
  - id: ERR_INSPECTOR_NOT_FOUND
    http: 404
    condition: "No Inspector exists with the supplied inspector_id."
  - id: ERR_CONTRACTOR_NOT_FOUND
    http: 404
    condition: "No Contractor exists with the supplied contractor_id."
  - id: ERR_INSPECTION_NOT_FOUND
    http: 404
    condition: "No Inspection exists with the supplied inspection_id."
  - id: ERR_ZONE_EVALUATION_NOT_FOUND
    http: 404
    condition: "No ZoneEvaluation exists with the supplied zone_evaluation_id."
  - id: ERR_FINDING_NOT_FOUND
    http: 404
    condition: "No HardeningFinding exists with the supplied hardening_finding_id."
  - id: ERR_NOTICE_NOT_FOUND
    http: 404
    condition: "No ViolationNotice exists with the supplied notice_id or supersedes_notice_id."
  - id: ERR_ABATEMENT_ORDER_NOT_FOUND
    http: 404
    condition: "No AbatementOrder exists with the supplied order_id."
  - id: ERR_PAYMENT_NOT_FOUND
    http: 404
    condition: "No CostRecoveryPayment exists with the supplied payment_id."
  - id: ERR_PROGRAM_NOT_FOUND
    http: 404
    condition: "No SupportProgram exists with the supplied support_program_id."
  - id: ERR_ENROLLMENT_NOT_FOUND
    http: 404
    condition: "No SupportEnrollment exists with the supplied enrollment_id."
  - id: ERR_CERTIFICATE_NOT_FOUND
    http: 404
    condition: "No ComplianceCertificate exists with the supplied certificate_id."

  # --- optimistic concurrency ------------------------------------------------
  - id: ERR_STALE_PARCEL_VERSION
    http: 412
    condition: "expected_parcel_version on PATCH /fire-district/parcels/{parcel_id} or POST /fire-district/parcels/{parcel_id}/violation-notices does not equal the stored Parcel.version (per §1.2.1 rule notice-create-stale-parcel)."
  - id: ERR_STALE_PROGRAM_VERSION
    http: 412
    condition: "expected_program_version on POST /fire-district/support-enrollments does not equal the stored SupportProgram.version (per §1.2.1 rule enrollment-create-stale-program)."

  # --- state errors ----------------------------------------------------------
  - id: ERR_INVALID_STATE
    http: 409
    condition: "The target entity's status is not a declared from: state for the transition this endpoint triggers in §1.2 — including any attempt to transition out of a terminal state."
  - id: ERR_CYCLE_NOT_ACTIVE
    http: 409
    condition: "A cycle-scoped write (inspection scheduling, support-program creation, cycle advance or cycle close) targets an InspectionCycle whose status is not ACTIVE."
  - id: ERR_CYCLE_ALREADY_ACTIVE
    http: 409
    condition: "POST /fire-district/inspection-cycles/{cycle_id}/activate is called while a different InspectionCycle already has status ACTIVE."
  - id: ERR_APN_ALREADY_REGISTERED
    http: 409
    condition: "POST /fire-district/parcels supplies an apn already held by another Parcel."
  - id: ERR_ZONE_ALREADY_EVALUATED
    http: 409
    condition: "POST /fire-district/inspections/{inspection_id}/zone-evaluations supplies a zone that already has a ZoneEvaluation on this inspection."
  - id: ERR_ZONE_COVERAGE_INCOMPLETE
    http: 422
    condition: "POST /fire-district/inspections/{inspection_id}/complete is called before all three of ZONE_0_EMBER, ZONE_1 and ZONE_2 have a ZoneEvaluation on the inspection."
  - id: ERR_ACCESS_DENIAL_LIMIT_REACHED
    http: 409
    condition: "POST /fire-district/inspections/{inspection_id}/access-denial is called on an inspection whose access_denial_count already equals MAX_ACCESS_DENIALS (2), or on one already in ABANDONED."
  - id: ERR_NOTICE_NOT_OVERDUE
    http: 409
    condition: "POST /fire-district/violation-notices/{notice_id}/authorize-abatement is called on a ViolationNotice whose status is not OVERDUE (abatement authority attaches only after the compliance deadline has lapsed)."
  - id: ERR_MISSING_VENDOR_INVOICE
    http: 422
    condition: "POST /fire-district/support-enrollments omits vendor_invoice_cents for a SupportProgram whose program_type is COST_SHARE_GRANT."
  - id: ERR_OPEN_VIOLATION_EXISTS
    http: 409
    condition: "POST /fire-district/compliance-certificates/{certificate_id}/decision with decision == ISSUE is called while the parcel holds a ViolationNotice in ISSUED, EXTENDED, OVERDUE or ABATEMENT_AUTHORIZED."
  - id: ERR_PARCEL_NOT_INSPECTED
    http: 409
    condition: "POST /fire-district/compliance-certificates/{certificate_id}/decision with decision == ISSUE is called while Parcel.compliance_status is PENDING_INSPECTION (no passed inspection and no exemption on record)."
  - id: ERR_DUPLICATE_ENROLLMENT
    http: 409
    condition: "POST /fire-district/support-enrollments targets a (support_program_id, parcel_id) pair that already has an enrollment in REQUESTED, APPROVED, WAITLISTED, COMPLETED or REIMBURSED."

  # --- business rules: safety / eligibility ----------------------------------
  - id: ERR_INSPECTOR_NOT_CERTIFIED
    http: 422
    condition: "An Inspection is scheduled or rescheduled on a Parcel whose hazard_zone == VERY_HIGH while the assigned Inspector.certification_level is not WUI_SPECIALIST (per §1.4 priority 50)."
  - id: ERR_INSPECTOR_SUSPENDED
    http: 409
    condition: "The assigned or acting Inspector has status SUSPENDED."
  - id: ERR_CONTRACTOR_NOT_LICENSED
    http: 409
    condition: "POST /fire-district/abatement-orders/{order_id}/award names a Contractor whose license_status is not ACTIVE."
  - id: ERR_CONTRACTOR_INSURANCE_LAPSED
    http: 409
    condition: "The named Contractor's insurance_expiry_utc is at or before the requested work_start_utc."
  - id: ERR_COMMUNITY_THRESHOLD_NOT_MET
    http: 422
    condition: "POST /fire-district/communities/{community_id}/submit-certification is called while the community holds fewer than COMMUNITY_MIN_MEMBER_PARCELS member Parcels or the supplied parcels_outreached_count is below the member-Parcel count; or POST /fire-district/communities/{community_id}/certification-decision with decision == CERTIFY is called while the community's compliance_rate_pct is null or below COMMUNITY_CERTIFY_FLOOR_PCT."

  # --- business rules: temporal ----------------------------------------------
  - id: ERR_NOTICE_LEAD_TIME_VIOLATION
    http: 422
    condition: "POST /fire-district/inspections/{inspection_id}/notice would leave fewer than InspectionCycle.notice_lead_days whole days between the logical clock and scheduled_start_utc."
  - id: ERR_INSPECTOR_WINDOW_CONFLICT
    http: 409
    condition: "The requested [scheduled_start_utc, scheduled_end_utc) half-open window overlaps another live inspection window already held by the same Inspector; exact adjacency (previous end == new start) does not conflict."
  - id: ERR_CONTRACTOR_WINDOW_CONFLICT
    http: 409
    condition: "The requested [work_start_utc, work_end_utc] closed work window intersects another live awarded window of the same Contractor at any instant, including a shared endpoint."
  - id: ERR_PROGRAM_WINDOW_CLOSED
    http: 409
    condition: "POST /fire-district/support-enrollments arrives with the logical clock outside the half-open service window of the SupportProgram: clock < service_window_start_utc or clock >= service_window_end_utc."

  # --- business rules: fiscal / capacity -------------------------------------
  - id: ERR_EXTENSION_LIMIT_REACHED
    http: 409
    condition: "POST /fire-district/violation-notices/{notice_id}/extend is called on a notice whose extension_count already equals MAX_EXTENSIONS."
  - id: ERR_ABATEMENT_CAP_EXCEEDED
    http: 422
    condition: "estimated_cost_cents on POST /fire-district/violation-notices/{notice_id}/authorize-abatement exceeds ABATEMENT_CAP_CENTS (750000)."
  - id: ERR_CONTRACTOR_CAPACITY_EXCEEDED
    http: 409
    condition: "Awarding this order would leave the Contractor holding more than max_daily_orders live awarded orders whose work windows touch the same UTC calendar day."
  - id: ERR_COST_SHARE_CAP_EXCEEDED
    http: 422
    condition: "vendor_invoice_cents on POST /fire-district/support-enrollments exceeds COST_SHARE_INVOICE_CAP_CENTS, so no award tier applies."
  - id: ERR_PAYMENT_EXCEEDS_OUTSTANDING
    http: 422
    condition: "amount_cents on POST /fire-district/abatement-orders/{order_id}/payments is greater than AbatementOrder.total_recoverable_cents minus AbatementOrder.paid_cents."

# ============================================================================
# 1.7 RBAC Matrix
# ============================================================================

roles:

  - name: ProgramAdmin
    description: "District defensible-space program staff. Owns the parcel inventory, cycle operation, scheduling, notice issuance, support-program administration and certificate adjudication."
    identity: "opaque"
    exclusive_operations:
      - "POST /fire-district/inspection-cycles"
      - "POST /fire-district/inspection-cycles/{cycle_id}/activate"
      - "POST /fire-district/inspection-cycles/{cycle_id}/advance"
      - "POST /fire-district/inspection-cycles/{cycle_id}/close"
      - "POST /fire-district/communities"
      - "POST /fire-district/parcels"
      - "PATCH /fire-district/parcels/{parcel_id}"
      - "POST /fire-district/parcels/{parcel_id}/survival-outcome"
      - "POST /fire-district/parcels/{parcel_id}/violation-notices"
      - "POST /fire-district/inspectors"
      - "POST /fire-district/contractors"
      - "PATCH /fire-district/contractors/{contractor_id}"
      - "POST /fire-district/inspections"
      - "POST /fire-district/inspections/{inspection_id}/notice"
      - "POST /fire-district/inspections/{inspection_id}/reschedule"
      - "POST /fire-district/inspections/{inspection_id}/cancel"
      - "POST /fire-district/support-programs"
      - "POST /fire-district/support-enrollments/{enrollment_id}/complete"
      - "POST /fire-district/compliance-certificates/{certificate_id}/decision"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "POST /fire-district/violation-notices/{notice_id}/extend (with PropertyOwner)"
      - "POST /fire-district/abatement-orders/{order_id}/payments (with PropertyOwner)"
      - "POST /fire-district/support-enrollments (with PropertyOwner)"
      - "POST /fire-district/support-enrollments/{enrollment_id}/cancel (with PropertyOwner)"
      - "all GET reads under /fire-district"

  - name: FireMarshal
    description: "Statutory authority for abatement. Adjudicates community certification, voids notices, authorizes and awards abatement, and cancels orders. Cannot schedule, notice, complete or verify inspections."
    identity: "opaque"
    exclusive_operations:
      - "POST /fire-district/communities/{community_id}/certification-decision"
      - "POST /fire-district/violation-notices/{notice_id}/void"
      - "POST /fire-district/violation-notices/{notice_id}/authorize-abatement"
      - "POST /fire-district/abatement-orders/{order_id}/award"
      - "POST /fire-district/abatement-orders/{order_id}/cancel"
    shared_operations:
      - "all GET reads under /fire-district"

  - name: Inspector
    description: "Field inspector. Records access denials, zone evaluations and hardening findings, completes inspections, and verifies contractor abatement work — subject to segregation of duties."
    identity: "entity_backed:Inspector"
    exclusive_operations:
      - "POST /fire-district/inspections/{inspection_id}/access-denial"
      - "POST /fire-district/inspections/{inspection_id}/zone-evaluations"
      - "POST /fire-district/inspections/{inspection_id}/hardening-findings"
      - "POST /fire-district/inspections/{inspection_id}/complete"
      - "POST /fire-district/abatement-orders/{order_id}/verify-completion"
    shared_operations:
      - "GET /fire-district/parcels/{parcel_id}"
      - "GET /fire-district/inspections and GET /fire-district/inspections/{inspection_id}"
      - "GET /fire-district/zone-evaluations, GET /fire-district/hardening-findings and their /{id} reads"
      - "GET /fire-district/violation-notices/{notice_id}"

  - name: PropertyOwner
    description: "Parcel owner. Requests compliance certificates, enrolls in support programs, cancels its own enrollments, and pays cost-recovery invoices. X-User-ID is the owned Parcel.id."
    identity: "entity_backed:Parcel"
    exclusive_operations: []
    shared_operations:
      - "POST /fire-district/violation-notices/{notice_id}/extend (with ProgramAdmin)"
      - "POST /fire-district/parcels/{parcel_id}/compliance-certificates (with TitleAgent)"
      - "POST /fire-district/support-enrollments (with ProgramAdmin)"
      - "POST /fire-district/support-enrollments/{enrollment_id}/cancel (with ProgramAdmin)"
      - "POST /fire-district/abatement-orders/{order_id}/payments (with ProgramAdmin)"
      - "GET reads scoped to the owned parcel: parcels/{id}, inspections/{id}, violation-notices, abatement-orders/{id}, support-programs, support-enrollments, compliance-certificates"

  - name: Contractor
    description: "Licensed abatement contractor. Reports completed work on its own awarded orders. X-User-ID is the awarded Contractor.id."
    identity: "entity_backed:Contractor"
    exclusive_operations:
      - "POST /fire-district/abatement-orders/{order_id}/complete-work"
    shared_operations:
      - "GET /fire-district/contractors/{contractor_id}"
      - "GET /fire-district/abatement-orders and GET /fire-district/abatement-orders/{order_id}"

  - name: CommunityOrganizer
    description: "Volunteer neighborhood organizer. Submits and reopens the community certification application. X-User-ID is the organized Community.id."
    identity: "entity_backed:Community"
    exclusive_operations:
      - "POST /fire-district/communities/{community_id}/submit-certification"
      - "POST /fire-district/communities/{community_id}/reopen-organizing"
    shared_operations:
      - "GET /fire-district/communities/{community_id} and GET /fire-district/communities/{community_id}/metrics"
      - "GET /fire-district/support-programs and GET /fire-district/support-programs/{support_program_id}"

  - name: TitleAgent
    description: "Insurer, lender or escrow agent requesting compliance documentation for a transaction. Read-only apart from opening certificate requests."
    identity: "opaque"
    exclusive_operations: []
    shared_operations:
      - "POST /fire-district/parcels/{parcel_id}/compliance-certificates (with PropertyOwner)"
      - "GET /fire-district/parcels/{parcel_id}"
      - "GET /fire-district/compliance-certificates and GET /fire-district/compliance-certificates/{certificate_id}"
