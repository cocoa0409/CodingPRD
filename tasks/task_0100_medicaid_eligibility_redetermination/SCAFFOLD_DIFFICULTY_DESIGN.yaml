# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Cross-references SCAFFOLD.yaml §1.1–§1.7 against the nine §0.5 Difficulty Rules.
# 9 rule_ids × 2 instances = 18 instances.
#
# Reusable literals (all integer cents unless noted):
#   FplSchedule 2026: base_annual_cents=1500000, per_member_increment_cents=520000
#     fpl_base(size=1)=1500000  fpl_base(size=2)=2020000  fpl_base(size=3)=2540000
#   StateRule CA (expansion): adult=138, child=200, abd_limit=200000, std_limit=300000
#   StateRule TX (non-expansion): adult=100, child=200, abd_limit=200000, std_limit=300000
#   FPL_DISREGARD_PCT=0.05  EXEMPT_BURIAL_CAP_CENTS=150000
# =============================================================================

scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: magi_point_in_time_vs_projected_annual_diverge
        grounds:
          - calculations.magi_annual_income
          - entities.Application.fields.magi_variant
          - entities.EligibilityDetermination.fields.magi_annual_cents
        distinguishing_aspect: |
          Two MAGI variants on the INCOME domain (HouseholdMember income sources): POINT_IN_TIME
          annualizes monthly*12 = 1440000 (magi 1339000, fpl% 66) while PROJECTED_ANNUAL uses
          projected_annual_cents=1500000 (magi 1399000, fpl% 69) — same household, different magi_annual_cents.
        test_recipe:
          setup:
            - "FplSchedule 2026 and StateRule CA exist."
            - "Household size 2 (adult SELF age 30 plus non-earning SPOUSE age 28) in CA, fpl_year 2026 → fpl_base 2020000, disregard 101000."
            - "SELF has one WAGES IncomeSource monthly_amount_cents=120000, projected_annual_cents=1500000; the spouse has no income."
            - "Two applications on the same household: app_pit (magi_variant POINT_IN_TIME) and app_proj (PROJECTED_ANNUAL), each claimed UNDER_REVIEW."
          setup_api_calls:
            - call: "POST /fpl-schedules"
              payload: { year: 2026, base_annual_cents: 1500000, per_member_increment_cents: 520000 }
              as: CaseWorker
            - call: "POST /state-rules"
              payload: { state_code: "CA", is_expansion_state: true, magi_adult_threshold_pct: 138, magi_child_threshold_pct: 200, abd_asset_limit_cents: 200000, standard_asset_limit_cents: 300000 }
              as: CaseWorker
            - call: "POST /households"
              payload: { state_code: "CA", fpl_year: 2026, primary_applicant_name: "Ana Diaz" }
              as: CaseWorker
              captures: { hh_id: $.data.id }
            - call: "POST /households/${hh_id}/members"
              payload: { full_name: "Ana Diaz", age: 30, relationship: "SELF" }
              as: CaseWorker
              captures: { mem_id: $.data.id }
            - call: "POST /households/${hh_id}/members"
              payload: { full_name: "Bo Diaz", age: 28, relationship: "SPOUSE" }
              as: CaseWorker
            - call: "POST /members/${mem_id}/income-sources"
              payload: { income_type: "WAGES", monthly_amount_cents: 120000, projected_annual_cents: 1500000 }
              as: CaseWorker
            - call: "POST /households/${hh_id}/applications"
              payload: { pathway: "MAGI", magi_variant: "POINT_IN_TIME" }
              as: CaseWorker
              captures: { app_pit: $.data.id }
            - call: "POST /applications/${app_pit}/submit"
              payload: {}
              as: Applicant
            - call: "POST /applications/${app_pit}/claim-review"
              payload: {}
              as: CaseWorker
            - call: "POST /households/${hh_id}/applications"
              payload: { pathway: "MAGI", magi_variant: "PROJECTED_ANNUAL" }
              as: CaseWorker
              captures: { app_proj: $.data.id }
            - call: "POST /applications/${app_proj}/submit"
              payload: {}
              as: Applicant
            - call: "POST /applications/${app_proj}/claim-review"
              payload: {}
              as: CaseWorker
          trigger:
            - call: "POST /applications/${app_pit}/determinations"
              payload: {}
              as: CaseWorker
              captures: { det_pit: $.data.id }
            - call: "POST /applications/${app_proj}/determinations"
              payload: {}
              as: CaseWorker
              captures: { det_proj: $.data.id }
          assert:
            - "EligibilityDetermination.${det_pit}.magi_annual_cents == 1339000"
            - "EligibilityDetermination.${det_pit}.fpl_percentage == 66"
            - "EligibilityDetermination.${det_proj}.magi_annual_cents == 1399000"
            - "EligibilityDetermination.${det_proj}.fpl_percentage == 69"
            - "EligibilityDetermination.${det_pit}.magi_annual_cents != EligibilityDetermination.${det_proj}.magi_annual_cents"

      - name: asset_test_abd_vs_standard_limit_diverge
        grounds:
          - calculations.countable_assets_and_eligibility
          - entities.HouseholdMember.fields.is_disabled
          - entities.EligibilityDetermination.fields.decision
        distinguishing_aspect: |
          Two asset-test variants on the ASSET domain (Household assets, not income): identical countable
          assets of 300000 yield INELIGIBLE under abd_limit=200000 (disabled household) but ELIGIBLE under
          std_limit=300000 (non-disabled household) — the variant is selected by member is_disabled, a
          different entity domain than dual_variant_calc instance 1's income domain.
        test_recipe:
          setup:
            - "FplSchedule 2026 and StateRule CA exist (abd_limit 200000, std_limit 300000)."
            - "Two NON_MAGI households in CA, each with identical assets: CASH 250000, HOME 5000000, VEHICLE 800000, BURIAL_FUND 200000 (countable = 250000 + 0 + 0 + 50000 = 300000)."
            - "Household hh_abd has a disabled COUNTED member; hh_std has a non-disabled COUNTED member."
            - "An application on each household claimed UNDER_REVIEW."
          setup_api_calls:
            - call: "POST /fpl-schedules"
              payload: { year: 2026, base_annual_cents: 1500000, per_member_increment_cents: 520000 }
              as: CaseWorker
            - call: "POST /state-rules"
              payload: { state_code: "CA", is_expansion_state: true, magi_adult_threshold_pct: 138, magi_child_threshold_pct: 200, abd_asset_limit_cents: 200000, standard_asset_limit_cents: 300000 }
              as: CaseWorker
            - call: "POST /households"
              payload: { state_code: "CA", fpl_year: 2026, primary_applicant_name: "Abe Disabled" }
              as: CaseWorker
              captures: { hh_abd: $.data.id }
            - call: "POST /households/${hh_abd}/members"
              payload: { full_name: "Abe Disabled", age: 67, relationship: "SELF", is_disabled: true }
              as: CaseWorker
            - call: "POST /households/${hh_abd}/assets"
              payload: { asset_type: "CASH", value_cents: 250000 }
              as: CaseWorker
            - call: "POST /households/${hh_abd}/assets"
              payload: { asset_type: "HOME", value_cents: 5000000 }
              as: CaseWorker
            - call: "POST /households/${hh_abd}/assets"
              payload: { asset_type: "VEHICLE", value_cents: 800000 }
              as: CaseWorker
            - call: "POST /households/${hh_abd}/assets"
              payload: { asset_type: "BURIAL_FUND", value_cents: 200000 }
              as: CaseWorker
            - call: "POST /households/${hh_abd}/applications"
              payload: { pathway: "NON_MAGI" }
              as: CaseWorker
              captures: { app_abd: $.data.id }
            - call: "POST /applications/${app_abd}/submit"
              payload: {}
              as: Applicant
            - call: "POST /applications/${app_abd}/claim-review"
              payload: {}
              as: CaseWorker
            - call: "POST /households"
              payload: { state_code: "CA", fpl_year: 2026, primary_applicant_name: "Stan Standard" }
              as: CaseWorker
              captures: { hh_std: $.data.id }
            - call: "POST /households/${hh_std}/members"
              payload: { full_name: "Stan Standard", age: 40, relationship: "SELF", is_disabled: false }
              as: CaseWorker
            - call: "POST /households/${hh_std}/assets"
              payload: { asset_type: "CASH", value_cents: 250000 }
              as: CaseWorker
            - call: "POST /households/${hh_std}/assets"
              payload: { asset_type: "HOME", value_cents: 5000000 }
              as: CaseWorker
            - call: "POST /households/${hh_std}/assets"
              payload: { asset_type: "VEHICLE", value_cents: 800000 }
              as: CaseWorker
            - call: "POST /households/${hh_std}/assets"
              payload: { asset_type: "BURIAL_FUND", value_cents: 200000 }
              as: CaseWorker
            - call: "POST /households/${hh_std}/applications"
              payload: { pathway: "NON_MAGI" }
              as: CaseWorker
              captures: { app_std: $.data.id }
            - call: "POST /applications/${app_std}/submit"
              payload: {}
              as: Applicant
            - call: "POST /applications/${app_std}/claim-review"
              payload: {}
              as: CaseWorker
          trigger:
            - call: "POST /applications/${app_abd}/determinations"
              payload: {}
              as: CaseWorker
              captures: { det_abd: $.data.id }
            - call: "POST /applications/${app_std}/determinations"
              payload: {}
              as: CaseWorker
              captures: { det_std: $.data.id }
          assert:
            - "EligibilityDetermination.${det_abd}.countable_assets_cents == 300000"
            - "EligibilityDetermination.${det_abd}.decision == INELIGIBLE"
            - "EligibilityDetermination.${det_abd}.decision_reason == ASSETS_OVER_LIMIT"
            - "EligibilityDetermination.${det_std}.countable_assets_cents == 300000"
            - "EligibilityDetermination.${det_std}.decision == ELIGIBLE"
            - "EligibilityDetermination.${det_std}.decision_reason == ASSETS_UNDER_LIMIT"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: magi_multi_input_nonlinear_aggregation_mode_a
        grounds:
          - calculations.magi_annual_income
          - calculations.fpl_percentage_and_eligibility
          - entities.HouseholdMember.fields.member_status
        distinguishing_aspect: |
          Mode (a): ≥3 inputs with non-linear interaction — per-member annualization with a max(.,0) floor,
          income-type countability filter (CHILD_SUPPORT excluded), household-size-driven fpl_base, and a 5%
          disregard combine so MAGI=1793000 and fpl%=70 for a 3-member household with two earners.
        test_recipe:
          setup:
            - "FplSchedule 2026 and StateRule CA exist."
            - "Household size 3 in CA: adult A (WAGES monthly 90000), adult B (WAGES monthly 70000), child C (no income)."
            - "Adult A also has a CHILD_SUPPORT IncomeSource monthly 50000 (non-countable, must be excluded)."
            - "Application MAGI/POINT_IN_TIME claimed UNDER_REVIEW."
          setup_api_calls:
            - call: "POST /fpl-schedules"
              payload: { year: 2026, base_annual_cents: 1500000, per_member_increment_cents: 520000 }
              as: CaseWorker
            - call: "POST /state-rules"
              payload: { state_code: "CA", is_expansion_state: true, magi_adult_threshold_pct: 138, magi_child_threshold_pct: 200, abd_asset_limit_cents: 200000, standard_asset_limit_cents: 300000 }
              as: CaseWorker
            - call: "POST /households"
              payload: { state_code: "CA", fpl_year: 2026, primary_applicant_name: "Adult A" }
              as: CaseWorker
              captures: { hh_id: $.data.id }
            - call: "POST /households/${hh_id}/members"
              payload: { full_name: "Adult A", age: 35, relationship: "SELF" }
              as: CaseWorker
              captures: { mem_a: $.data.id }
            - call: "POST /households/${hh_id}/members"
              payload: { full_name: "Adult B", age: 33, relationship: "SPOUSE" }
              as: CaseWorker
              captures: { mem_b: $.data.id }
            - call: "POST /households/${hh_id}/members"
              payload: { full_name: "Child C", age: 7, relationship: "CHILD" }
              as: CaseWorker
            - call: "POST /members/${mem_a}/income-sources"
              payload: { income_type: "WAGES", monthly_amount_cents: 90000 }
              as: CaseWorker
            - call: "POST /members/${mem_a}/income-sources"
              payload: { income_type: "CHILD_SUPPORT", monthly_amount_cents: 50000 }
              as: CaseWorker
            - call: "POST /members/${mem_b}/income-sources"
              payload: { income_type: "WAGES", monthly_amount_cents: 70000 }
              as: CaseWorker
            - call: "POST /households/${hh_id}/applications"
              payload: { pathway: "MAGI", magi_variant: "POINT_IN_TIME" }
              as: CaseWorker
              captures: { app_id: $.data.id }
            - call: "POST /applications/${app_id}/submit"
              payload: {}
              as: Applicant
            - call: "POST /applications/${app_id}/claim-review"
              payload: {}
              as: CaseWorker
          trigger:
            - call: "POST /applications/${app_id}/determinations"
              payload: {}
              as: CaseWorker
              captures: { det_id: $.data.id }
          assert:
            - "EligibilityDetermination.${det_id}.magi_annual_cents == 1793000"
            - "EligibilityDetermination.${det_id}.fpl_percentage == 70"
            - "EligibilityDetermination.${det_id}.applicable_threshold_pct == 138"
            - "EligibilityDetermination.${det_id}.decision == ELIGIBLE"

      - name: magi_round_per_member_then_sum_mode_b
        grounds:
          - calculations.magi_annual_income
          - entities.IncomeSource.fields.projected_annual_cents
          - entities.Application.fields.magi_variant
        distinguishing_aspect: |
          Mode (b): nested rounding where ORDER matters — the scaffold pins per-member annualization
          (round_half_up per member) BEFORE summation, then a single household-level disregard rounded once.
          PROJECTED_ANNUAL with per-member projected sums proves the round-then-sum order: gross 1920000,
          one disregard 127000 → magi 1793000 (NOT a per-member-split disregard).
        test_recipe:
          setup:
            - "FplSchedule 2026 and StateRule CA exist (fpl_base size 3 = 2540000, disregard = 127000)."
            - "Household size 3 in CA: adult A (projected_annual 1080000 across two WAGES sources), adult B (projected_annual 840000), child C (no income)."
            - "Application MAGI/PROJECTED_ANNUAL claimed UNDER_REVIEW."
          setup_api_calls:
            - call: "POST /fpl-schedules"
              payload: { year: 2026, base_annual_cents: 1500000, per_member_increment_cents: 520000 }
              as: CaseWorker
            - call: "POST /state-rules"
              payload: { state_code: "CA", is_expansion_state: true, magi_adult_threshold_pct: 138, magi_child_threshold_pct: 200, abd_asset_limit_cents: 200000, standard_asset_limit_cents: 300000 }
              as: CaseWorker
            - call: "POST /households"
              payload: { state_code: "CA", fpl_year: 2026, primary_applicant_name: "Adult A" }
              as: CaseWorker
              captures: { hh_id: $.data.id }
            - call: "POST /households/${hh_id}/members"
              payload: { full_name: "Adult A", age: 35, relationship: "SELF" }
              as: CaseWorker
              captures: { mem_a: $.data.id }
            - call: "POST /households/${hh_id}/members"
              payload: { full_name: "Adult B", age: 33, relationship: "SPOUSE" }
              as: CaseWorker
              captures: { mem_b: $.data.id }
            - call: "POST /households/${hh_id}/members"
              payload: { full_name: "Child C", age: 7, relationship: "CHILD" }
              as: CaseWorker
            - call: "POST /members/${mem_a}/income-sources"
              payload: { income_type: "WAGES", monthly_amount_cents: 45000, projected_annual_cents: 540000 }
              as: CaseWorker
            - call: "POST /members/${mem_a}/income-sources"
              payload: { income_type: "SELF_EMPLOYMENT", monthly_amount_cents: 45000, projected_annual_cents: 540000 }
              as: CaseWorker
            - call: "POST /members/${mem_b}/income-sources"
              payload: { income_type: "WAGES", monthly_amount_cents: 70000, projected_annual_cents: 840000 }
              as: CaseWorker
            - call: "POST /households/${hh_id}/applications"
              payload: { pathway: "MAGI", magi_variant: "PROJECTED_ANNUAL" }
              as: CaseWorker
              captures: { app_id: $.data.id }
            - call: "POST /applications/${app_id}/submit"
              payload: {}
              as: Applicant
            - call: "POST /applications/${app_id}/claim-review"
              payload: {}
              as: CaseWorker
          trigger:
            - call: "POST /applications/${app_id}/determinations"
              payload: {}
              as: CaseWorker
              captures: { det_id: $.data.id }
          assert:
            - "EligibilityDetermination.${det_id}.magi_annual_cents == 1793000"
            - "EligibilityDetermination.${det_id}.fpl_percentage == 70"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: enrollment_cyclic_active_redetermination_active
        grounds:
          - state_machines.Enrollment.ACTIVE_to_IN_REDETERMINATION
          - state_machines.Enrollment.IN_REDETERMINATION_to_ACTIVE
          - state_machines.Redetermination.INITIATED_to_RENEWED
        distinguishing_aspect: |
          Non-linear CYCLE on the Enrollment entity: ACTIVE → IN_REDETERMINATION → ACTIVE, closed when the
          child Redetermination reaches RENEWED. Distinct entity from instance 2 (Redetermination).
        test_recipe:
          setup:
            - "An ACTIVE enrollment exists for a CA household with an APPROVED MAGI application and an ELIGIBLE renewal determination."
            - "A redetermination is opened (enrollment → IN_REDETERMINATION) pointing at the ELIGIBLE renewal determination."
          setup_api_calls:
            - call: "POST /fpl-schedules"
              payload: { year: 2026, base_annual_cents: 1500000, per_member_increment_cents: 520000 }
              as: CaseWorker
            - call: "POST /state-rules"
              payload: { state_code: "CA", is_expansion_state: true, magi_adult_threshold_pct: 138, magi_child_threshold_pct: 200, abd_asset_limit_cents: 200000, standard_asset_limit_cents: 300000 }
              as: CaseWorker
            - call: "POST /households"
              payload: { state_code: "CA", fpl_year: 2026, primary_applicant_name: "Ren Ewell" }
              as: CaseWorker
              captures: { hh_id: $.data.id }
            - call: "POST /households/${hh_id}/members"
              payload: { full_name: "Ren Ewell", age: 30, relationship: "SELF" }
              as: CaseWorker
              captures: { mem_id: $.data.id }
            - call: "POST /members/${mem_id}/income-sources"
              payload: { income_type: "WAGES", monthly_amount_cents: 120000 }
              as: CaseWorker
            - call: "POST /households/${hh_id}/applications"
              payload: { pathway: "MAGI", magi_variant: "POINT_IN_TIME" }
              as: CaseWorker
              captures: { app_id: $.data.id }
            - call: "POST /applications/${app_id}/submit"
              payload: {}
              as: Applicant
            - call: "POST /applications/${app_id}/claim-review"
              payload: {}
              as: CaseWorker
            - call: "POST /applications/${app_id}/determinations"
              payload: {}
              as: CaseWorker
              captures: { det_id: $.data.id }
            - call: "POST /applications/${app_id}/verify"
              payload: {}
              as: CaseWorker
            - call: "POST /applications/${app_id}/decide"
              payload: { target_status: "APPROVED" }
              as: CaseWorker
            - call: "POST /enrollments"
              payload: { household_id: "${hh_id}", application_id: "${app_id}", coverage_start: "2026-01-01T00:00:00Z", coverage_end: "2026-12-31T00:00:00Z", redetermination_due: "2026-11-01T00:00:00Z" }
              as: CaseWorker
              captures: { enr_id: $.data.id }
            - call: "POST /enrollments/${enr_id}/activate"
              payload: {}
              as: CaseWorker
              captures: { enr_v: $.data.version }
            - call: "POST /applications/${app_id}/determinations"
              payload: {}
              as: CaseWorker
              captures: { redet_det_id: $.data.id }
            - call: "POST /redeterminations"
              payload: { enrollment_id: "${enr_id}", window_open: "2026-11-01T00:00:00Z", window_close: "2026-12-15T00:00:00Z", new_determination_id: "${redet_det_id}", expected_enrollment_version: "${enr_v}" }
              as: CaseWorker
              captures: { redet_id: $.data.id }
          trigger:
            - call: "POST /redeterminations/${redet_id}/finalize"
              payload: { target_status: "RENEWED" }
              as: CaseWorker
          assert:
            - "Redetermination.${redet_id}.redet_status == RENEWED"
            - "Enrollment.${enr_id}.coverage_status == ACTIVE"

      - name: redetermination_self_loop_info_requested
        grounds:
          - state_machines.Redetermination.INITIATED_to_INFO_REQUESTED
          - state_machines.Redetermination.INFO_REQUESTED_to_INFO_REQUESTED
          - entities.Redetermination.fields.info_request_count
        distinguishing_aspect: |
          Non-linear SELF-LOOP on the Redetermination entity: INFO_REQUESTED → INFO_REQUESTED re-entered twice,
          incrementing info_request_count to 2. Distinct entity from instance 1 (Enrollment).
        test_recipe:
          setup:
            - "A redetermination in INITIATED exists for an ACTIVE-then-IN_REDETERMINATION enrollment (CA household)."
          setup_api_calls:
            - call: "POST /fpl-schedules"
              payload: { year: 2026, base_annual_cents: 1500000, per_member_increment_cents: 520000 }
              as: CaseWorker
            - call: "POST /state-rules"
              payload: { state_code: "CA", is_expansion_state: true, magi_adult_threshold_pct: 138, magi_child_threshold_pct: 200, abd_asset_limit_cents: 200000, standard_asset_limit_cents: 300000 }
              as: CaseWorker
            - call: "POST /households"
              payload: { state_code: "CA", fpl_year: 2026, primary_applicant_name: "Lou Pe" }
              as: CaseWorker
              captures: { hh_id: $.data.id }
            - call: "POST /households/${hh_id}/members"
              payload: { full_name: "Lou Pe", age: 30, relationship: "SELF" }
              as: CaseWorker
              captures: { mem_id: $.data.id }
            - call: "POST /members/${mem_id}/income-sources"
              payload: { income_type: "WAGES", monthly_amount_cents: 120000 }
              as: CaseWorker
            - call: "POST /households/${hh_id}/applications"
              payload: { pathway: "MAGI", magi_variant: "POINT_IN_TIME" }
              as: CaseWorker
              captures: { app_id: $.data.id }
            - call: "POST /applications/${app_id}/submit"
              payload: {}
              as: Applicant
            - call: "POST /applications/${app_id}/claim-review"
              payload: {}
              as: CaseWorker
            - call: "POST /applications/${app_id}/determinations"
              payload: {}
              as: CaseWorker
              captures: { det_id: $.data.id }
            - call: "POST /applications/${app_id}/verify"
              payload: {}
              as: CaseWorker
            - call: "POST /applications/${app_id}/decide"
              payload: { target_status: "APPROVED" }
              as: CaseWorker
            - call: "POST /enrollments"
              payload: { household_id: "${hh_id}", application_id: "${app_id}", coverage_start: "2026-01-01T00:00:00Z", coverage_end: "2026-12-31T00:00:00Z", redetermination_due: "2026-11-01T00:00:00Z" }
              as: CaseWorker
              captures: { enr_id: $.data.id }
            - call: "POST /enrollments/${enr_id}/activate"
              payload: {}
              as: CaseWorker
              captures: { enr_v: $.data.version }
            - call: "POST /applications/${app_id}/determinations"
              payload: {}
              as: CaseWorker
              captures: { redet_det_id: $.data.id }
            - call: "POST /redeterminations"
              payload: { enrollment_id: "${enr_id}", window_open: "2026-11-01T00:00:00Z", window_close: "2026-12-15T00:00:00Z", new_determination_id: "${redet_det_id}", expected_enrollment_version: "${enr_v}" }
              as: CaseWorker
              captures: { redet_id: $.data.id }
            - call: "POST /redeterminations/${redet_id}/request-info"
              payload: {}
              as: CaseWorker
          trigger:
            - call: "POST /redeterminations/${redet_id}/request-info"
              payload: {}
              as: CaseWorker
          assert:
            - "Redetermination.${redet_id}.redet_status == INFO_REQUESTED"
            - "Redetermination.${redet_id}.info_request_count == 2"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: redet_terminate_cascades_enrollment_terminate_then_ledger_debit
        grounds:
