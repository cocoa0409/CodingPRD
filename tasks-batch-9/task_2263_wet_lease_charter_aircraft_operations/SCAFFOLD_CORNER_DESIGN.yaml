# =============================================================================
# 1.9 Scaffold Corner Design - wet-lease-charter-operations (task 2263)
#
# Breadth probe. One walk of references/claim-extraction-guide.md's nine
# sections against this scaffold's SS1.1-SS1.7 surface. Depth (the nine SS0.5
# Difficulty Rules) lives in SCAFFOLD_DIFFICULTY_DESIGN.yaml; corners already
# asserted there appear here as `excluded_because:` stubs citing the covering
# instance by name.
#
# Every literal below was executed as code, not derived by hand. The logical
# clock is pinned with POST /_clock/set_current_utc in every chain, so no
# assertion depends on wall-clock time.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:

      - name: lease_creation_returns_declared_fields_with_draft_status_and_zeroed_ledgers
        claim_type: Creation
        grounds:
          - entities.LeaseAgreement
          - endpoints[POST /wetlease/leases]
          - entities.LeaseAgreement.fields.status
          - entities.LeaseAgreement.fields.return_deposit_remaining_cents
        distinguishing_aspect: |
          All twenty contractual input fields are echoed back verbatim on a 201, and the three
          computed ledgers plus the two system fields take their declared initial values -
          status DRAFT, suspension_reason null, return_deposit_applied_cents 0,
          return_deposit_remaining_cents 0 (the deposit is only seeded at ACTIVATION, not at
          creation) and lifetime_credited_block_minutes 0. Seeding the deposit remainder at
          creation is the plausible wrong answer.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z."
            - "One Lessee and one AVAILABLE airframe enrolled in MP-B738-REV12."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: LessorOpsController
            - call: "POST /wetlease/lessees"
              payload: { name: "Meridian Charter Group", icao_code: "MCG", home_base_icao: "EGSS", credit_limit_usd_cents: 500000000 }
              as: BillingAdmin
              captures: { lessee_id: $.data.id }
            - call: "POST /wetlease/aircraft"
              payload: { tail_number: "G-ACMI", type_designator: "B738", type_family: "B737", seat_count: 189, mtow_kg: 79000, maintenance_program_ref: "MP-B738-REV12", airframe_hours_total: 24000.00, hours_since_last_check: 120.00, cycles_since_last_check: 40 }
              as: MaintenanceController
              captures: { ac1_id: $.data.id }
          trigger:
            - call: "POST /wetlease/leases"
              payload: { lessee_id: "${lessee_id}", primary_aircraft_id: "${ac1_id}", term_start_date: "2026-09-01", term_end_date: "2026-12-31", block_hour_rate_usd_cents: 480000, min_guaranteed_block_hours_per_month: 5, shortfall_credit_pct: 0.60, crew_provided_by: "LESSOR", maintenance_provided_by: "LESSOR", insurance_provided_by: "LESSOR", operational_control: "LESSOR", substitution_rights: "LESSOR_UNILATERAL", reliability_basis: "DEPARTURE", required_maintenance_program_ref: "MP-B738-REV12", return_hours_since_check_max: 300.00, return_cycles_since_check_max: 120, return_fuel_kg_required: 4000, return_liability_cap_cents: 900000, return_deposit_cents: 500000, redelivery_icao: "EGSS" }
              as: LessorOpsController
          assert:
            - "trigger[0].status == 201"
            - "trigger[0].data.status == DRAFT"
            - "trigger[0].data.suspension_reason == null"
            - "trigger[0].data.lessee_id == ${lessee_id}"
            - "trigger[0].data.primary_aircraft_id == ${ac1_id}"
            - "trigger[0].data.block_hour_rate_usd_cents == 480000"
            - "trigger[0].data.min_guaranteed_block_hours_per_month == 5"
            - "trigger[0].data.shortfall_credit_pct == 0.60"
            - "trigger[0].data.reliability_basis == DEPARTURE"
            - "trigger[0].data.substitution_rights == LESSOR_UNILATERAL"
            - "trigger[0].data.return_deposit_cents == 500000"
            - "trigger[0].data.return_deposit_applied_cents == 0"
            - "trigger[0].data.return_deposit_remaining_cents == 0"
            - "trigger[0].data.lifetime_credited_block_minutes == 0"
            - "trigger[0].data.version == 1"
            - "trigger[0].data.id is a non-empty string and created_at == 2026-09-01T00:00:00Z"
            - "Aircraft.${ac1_id}.status == AVAILABLE and assigned_lease_id == null (creation assigns nothing)"

      - name: aircraft_retrieval_returns_stored_airframe_record
        claim_type: Retrieval
        grounds:
          - entities.Aircraft
          - endpoints[GET /wetlease/aircraft/{aircraftId}]
        distinguishing_aspect: |
          A read-back of the airframe returns every stored value unchanged, including the two
          maintenance counters that later mutate on completion and on RETURN_TO_SERVICE, and the
          two system fields status AVAILABLE / assigned_lease_id null.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; one airframe registered."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: MaintenanceController
            - call: "POST /wetlease/aircraft"
              payload: { tail_number: "G-ACMI", type_designator: "B738", type_family: "B737", seat_count: 189, mtow_kg: 79000, maintenance_program_ref: "MP-B738-REV12", airframe_hours_total: 24000.00, hours_since_last_check: 120.00, cycles_since_last_check: 40 }
              as: MaintenanceController
              captures: { ac1_id: $.data.id }
          trigger:
            - call: "GET /wetlease/aircraft/${ac1_id}"
              payload: {}
              as: LessorOpsController
          assert:
            - "trigger[0].status == 200"
            - "trigger[0].data.id == ${ac1_id}"
            - "trigger[0].data.tail_number == G-ACMI"
            - "trigger[0].data.type_designator == B738"
            - "trigger[0].data.type_family == B737"
            - "trigger[0].data.seat_count == 189"
            - "trigger[0].data.mtow_kg == 79000"
            - "trigger[0].data.maintenance_program_ref == MP-B738-REV12"
            - "trigger[0].data.airframe_hours_total == 24000.00"
            - "trigger[0].data.hours_since_last_check == 120.00"
            - "trigger[0].data.cycles_since_last_check == 40"
            - "trigger[0].data.status == AVAILABLE"
            - "trigger[0].data.assigned_lease_id == null"
            - "trigger[0].data.version == 1"

      - name: flight_leg_listing_paginates_and_filters_by_billing_state
        claim_type: Listing
        grounds:
          - endpoints[GET /wetlease/flight-legs]
          - response_envelope.pagination_fields
          - entities.FlightLeg.fields.billing_state
        distinguishing_aspect: |
          Three legs exist; the list endpoint must honour limit/offset AND the billing_state
          filter at the same time, reporting total_count as the size of the FILTERED set (3, not
          the unfiltered table) and has_more true only while unread rows remain inside that
          filtered set. Reporting the unfiltered count, or applying the filter after the page
          slice, both fail.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z."
            - "ACTIVE lease on G-ACMI, term 2026-09-01..2026-12-31, with three SCHEDULED REVENUE legs on 2026-09-05, 2026-09-12 and 2026-09-19, each 06:00Z-08:00Z."
            - "All three legs are UNBILLED: the 2026-09 period is still OPEN and no invoice has been prepared."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: LessorOpsController
            - call: "POST /wetlease/lessees"
              payload: { name: "Meridian Charter Group", icao_code: "MCG", home_base_icao: "EGSS", credit_limit_usd_cents: 500000000 }
              as: BillingAdmin
              captures: { lessee_id: $.data.id }
            - call: "POST /wetlease/aircraft"
              payload: { tail_number: "G-ACMI", type_designator: "B738", type_family: "B737", seat_count: 189, mtow_kg: 79000, maintenance_program_ref: "MP-B738-REV12", airframe_hours_total: 24000.00, hours_since_last_check: 120.00, cycles_since_last_check: 40 }
              as: MaintenanceController
              captures: { ac1_id: $.data.id }
            - call: "POST /wetlease/crew-members"
              payload: { full_name: "A Hallam", employee_no: "EMP-1001", crew_role: "CAPTAIN", type_ratings: ["B738"] }
              as: LessorOpsController
              captures: { cap_id: $.data.id }
            - call: "POST /wetlease/crew-members"
              payload: { full_name: "B Nkosi", employee_no: "EMP-1002", crew_role: "FIRST_OFFICER", type_ratings: ["B738"] }
              as: LessorOpsController
              captures: { fo_id: $.data.id }
            - call: "POST /wetlease/leases"
              payload: { lessee_id: "${lessee_id}", primary_aircraft_id: "${ac1_id}", term_start_date: "2026-09-01", term_end_date: "2026-12-31", block_hour_rate_usd_cents: 480000, min_guaranteed_block_hours_per_month: 5, shortfall_credit_pct: 0.60, crew_provided_by: "LESSOR", maintenance_provided_by: "LESSOR", insurance_provided_by: "LESSOR", operational_control: "LESSOR", substitution_rights: "LESSOR_UNILATERAL", reliability_basis: "DEPARTURE", required_maintenance_program_ref: "MP-B738-REV12", return_hours_since_check_max: 300.00, return_cycles_since_check_max: 120, return_fuel_kg_required: 4000, return_liability_cap_cents: 900000, return_deposit_cents: 500000, redelivery_icao: "EGSS" }
              as: LessorOpsController
              captures: { lease_id: $.data.id }
            - call: "POST /wetlease/leases/${lease_id}/submit-for-approval"
              payload: { authority_docket_no: "CAA-2026-4471" }
              as: LessorOpsController
              captures: { appr_id: $.data.id }
            - call: "POST /wetlease/regulatory-approvals/${appr_id}/decision"
              payload: { determination: "APPROVED" }
              as: RegulatoryAuthority
            - call: "POST /wetlease/insurance-certificates"
              payload: { lease_id: "${lease_id}", certificate_no: "COI-88001", hull_limit_usd_cents: 6000000000, liability_limit_usd_cents: 75000000000, breach_of_warranty_endorsed: true, additional_insured_lessee: true, effective_from: "2026-08-15T00:00:00Z", expires_at: "2027-01-31T23:59:59Z" }
              as: InsuranceUnderwriter
            - call: "POST /wetlease/crew-qualifications"
              payload: { crew_member_id: "${cap_id}", lease_id: "${lease_id}" }
              as: LessorOpsController
              captures: { q_cap_id: $.data.id }
            - call: "POST /wetlease/crew-qualifications/${q_cap_id}/complete-checkride"
              payload: { differences_training_completed_on: "2026-08-20", checkride_valid_until: "2027-08-31" }
              as: LessorOpsController
            - call: "POST /wetlease/leases/${lease_id}/activate"
              payload: {}
              as: LessorOpsController
            - call: "POST /wetlease/crew-qualifications"
              payload: { crew_member_id: "${fo_id}", lease_id: "${lease_id}" }
              as: LessorOpsController
              captures: { q_fo_id: $.data.id }
            - call: "POST /wetlease/crew-qualifications/${q_fo_id}/complete-checkride"
              payload: { differences_training_completed_on: "2026-08-20", checkride_valid_until: "2027-08-31" }
              as: LessorOpsController
            - call: "POST /wetlease/flight-legs"
              payload: { lease_id: "${lease_id}", aircraft_id: "${ac1_id}", captain_id: "${cap_id}", first_officer_id: "${fo_id}", origin_icao: "EGSS", dest_icao: "LEPA", leg_class: "REVENUE", scheduled_out: "2026-09-05T06:00:00Z", scheduled_in: "2026-09-05T08:00:00Z" }
              as: LessorOpsController
            - call: "POST /wetlease/flight-legs"
              payload: { lease_id: "${lease_id}", aircraft_id: "${ac1_id}", captain_id: "${cap_id}", first_officer_id: "${fo_id}", origin_icao: "EGSS", dest_icao: "LEPA", leg_class: "REVENUE", scheduled_out: "2026-09-12T06:00:00Z", scheduled_in: "2026-09-12T08:00:00Z" }
              as: LessorOpsController
            - call: "POST /wetlease/flight-legs"
              payload: { lease_id: "${lease_id}", aircraft_id: "${ac1_id}", captain_id: "${cap_id}", first_officer_id: "${fo_id}", origin_icao: "EGSS", dest_icao: "LEPA", leg_class: "REVENUE", scheduled_out: "2026-09-19T06:00:00Z", scheduled_in: "2026-09-19T08:00:00Z" }
              as: LessorOpsController
          trigger:
            - call: "GET /wetlease/flight-legs?lease_id=${lease_id}&billing_state=UNBILLED&limit=2&offset=0"
              payload: { lease_id: "${lease_id}", billing_state: "UNBILLED", limit: 2, offset: 0 }
              as: BillingAdmin
            - call: "GET /wetlease/flight-legs?lease_id=${lease_id}&billing_state=UNBILLED&limit=2&offset=2"
              payload: { lease_id: "${lease_id}", billing_state: "UNBILLED", limit: 2, offset: 2 }
              as: BillingAdmin
            - call: "GET /wetlease/flight-legs?lease_id=${lease_id}&billing_state=FINALIZED"
              payload: { lease_id: "${lease_id}", billing_state: "FINALIZED" }
              as: BillingAdmin
          assert:
            - "trigger[0].status == 200 and response_type == array"
            - "trigger[0].data length == 2"
            - "trigger[0].total_count == 3"
            - "trigger[0].has_more == true"
            - "trigger[1].data length == 1"
            - "trigger[1].total_count == 3"
            - "trigger[1].has_more == false"
            - "trigger[2].data length == 0"
            - "trigger[2].total_count == 0"
            - "trigger[2].has_more == false"
            - "every returned leg has billing_state == UNBILLED and status == SCHEDULED"

      - name: lease_retrieval_with_unknown_id_returns_lease_not_found
        claim_type: Not Found
        grounds:
          - endpoints[GET /wetlease/leases/{leaseId}]
          - validations[priority 12 ERR_LEASE_NOT_FOUND]
          - errors.ERR_LEASE_NOT_FOUND
        distinguishing_aspect: |
          A syntactically valid but unknown UUID must yield 404 ERR_LEASE_NOT_FOUND with the error
          envelope, not 200 with a null body and not 400.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; no LeaseAgreement rows at all."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: LessorOpsController
          trigger:
            - call: "GET /wetlease/leases/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: LessorOpsController
              captures: { err: $.data.error_id }
          assert:
            - "trigger[0].status == 404"
            - "trigger[0].response_type == error"
            - "trigger[0].data.error_id == ERR_LEASE_NOT_FOUND"
            - "trigger[0].data.message is a non-empty string"

      - name: aircraft_creation_missing_required_mtow_kg_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - entities.Aircraft.fields.mtow_kg
          - endpoints[POST /wetlease/aircraft]
          - validations[priority 3 ERR_INVALID_REQUEST]
        distinguishing_aspect: |
          mtow_kg is `source: input` with no default, so omitting it is a 400 ERR_INVALID_REQUEST
          and nothing is persisted - contrast airframe_hours_total, hours_since_last_check and
          cycles_since_last_check, which DO carry defaults and may be omitted.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; empty Aircraft table."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: MaintenanceController
          trigger:
            - call: "POST /wetlease/aircraft"
              payload: { tail_number: "G-ZZZZ", type_designator: "B738", type_family: "B737", seat_count: 189, maintenance_program_ref: "MP-B738-REV12", airframe_hours_total: 100.00, hours_since_last_check: 10.00, cycles_since_last_check: 3 }
              as: MaintenanceController
              captures: { err: $.data.error_id }
            - call: "GET /wetlease/aircraft?tail_number=G-ZZZZ"
              payload: { type_designator: "B738" }
              as: MaintenanceController
          assert:
            - "trigger[0].status == 400"
            - "trigger[0].data.error_id == ERR_INVALID_REQUEST"
            - "trigger[1].data length == 0 (nothing was persisted)"
            - "trigger[1].total_count == 0"

      - name: regulatory_docket_defaults_review_round_one_and_empty_conditions
        claim_type: Defaults
        grounds:
          - entities.RegulatoryApproval.fields.review_round
          - entities.RegulatoryApproval.fields.conditions
          - entities.RegulatoryApproval.fields.open_condition_codes
          - entities.RegulatoryApproval.fields.expires_on
          - endpoints[POST /wetlease/leases/{leaseId}/submit-for-approval]
        distinguishing_aspect: |
          The docket is minted by the submit-for-approval side effect, not by a client POST, so
          every defaulted field must be materialised by the server: determination UNDER_REVIEW,
          review_round 1, conditions [], open_condition_codes [], decided_at null, expires_on
          null, revocation_reason null.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; one DRAFT lease on an AVAILABLE airframe."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: LessorOpsController
            - call: "POST /wetlease/lessees"
              payload: { name: "Meridian Charter Group", icao_code: "MCG", home_base_icao: "EGSS", credit_limit_usd_cents: 500000000 }
              as: BillingAdmin
              captures: { lessee_id: $.data.id }
            - call: "POST /wetlease/aircraft"
              payload: { tail_number: "G-ACMI", type_designator: "B738", type_family: "B737", seat_count: 189, mtow_kg: 79000, maintenance_program_ref: "MP-B738-REV12", airframe_hours_total: 24000.00, hours_since_last_check: 120.00, cycles_since_last_check: 40 }
              as: MaintenanceController
              captures: { ac1_id: $.data.id }
            - call: "POST /wetlease/leases"
              payload: { lessee_id: "${lessee_id}", primary_aircraft_id: "${ac1_id}", term_start_date: "2026-09-01", term_end_date: "2026-12-31", block_hour_rate_usd_cents: 480000, min_guaranteed_block_hours_per_month: 5, shortfall_credit_pct: 0.60, crew_provided_by: "LESSOR", maintenance_provided_by: "LESSOR", insurance_provided_by: "LESSOR", operational_control: "LESSOR", substitution_rights: "LESSOR_UNILATERAL", reliability_basis: "DEPARTURE", required_maintenance_program_ref: "MP-B738-REV12", return_hours_since_check_max: 300.00, return_cycles_since_check_max: 120, return_fuel_kg_required: 4000, return_liability_cap_cents: 900000, return_deposit_cents: 500000, redelivery_icao: "EGSS" }
              as: LessorOpsController
              captures: { lease_id: $.data.id }
          trigger:
            - call: "POST /wetlease/leases/${lease_id}/submit-for-approval"
              payload: { authority_docket_no: "CAA-2026-4471" }
              as: LessorOpsController
              captures: { appr_id: $.data.id }
          assert:
            - "trigger[0].status == 201"
            - "trigger[0].data.lease_id == ${lease_id}"
            - "trigger[0].data.authority_docket_no == CAA-2026-4471"
            - "trigger[0].data.determination == UNDER_REVIEW"
            - "trigger[0].data.review_round == 1"
            - "trigger[0].data.conditions == []"
            - "trigger[0].data.open_condition_codes == []"
            - "trigger[0].data.decided_at == null"
            - "trigger[0].data.expires_on == null"
            - "trigger[0].data.revocation_reason == null"
            - "LeaseAgreement.${lease_id}.status == PENDING_REGULATORY_APPROVAL"

      - name: flight_leg_scheduled_block_minutes_computed_and_client_supplied_value_ignored
        claim_type: Computed Fields
        grounds:
          - entities.FlightLeg.fields.scheduled_block_minutes
          - entities.FlightLeg.fields.block_minutes
          - entities.FlightLeg.fields.billable_block_minutes
          - calculations.leg_billable_block_minutes
          - endpoints[POST /wetlease/flight-legs]
        distinguishing_aspect: |
          scheduled_block_minutes is derived from the two timestamps by flooring seconds to
          minutes, so a 2h35m30s schedule yields 155 - and a client-supplied
          scheduled_block_minutes / block_minutes / billable_block_minutes in the payload is
          discarded rather than honoured (they are not in the endpoint's input set). block_minutes
          and billable_block_minutes stay 0 until completion.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z."
            - "ACTIVE lease on G-ACMI with both crew QUALIFIED, term 2026-09-01..2026-12-31."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: LessorOpsController
            - call: "POST /wetlease/lessees"
              payload: { name: "Meridian Charter Group", icao_code: "MCG", home_base_icao: "EGSS", credit_limit_usd_cents: 500000000 }
              as: BillingAdmin
              captures: { lessee_id: $.data.id }
            - call: "POST /wetlease/aircraft"
              payload: { tail_number: "G-ACMI", type_designator: "B738", type_family: "B737", seat_count: 189, mtow_kg: 79000, maintenance_program_ref: "MP-B738-REV12", airframe_hours_total: 24000.00, hours_since_last_check: 120.00, cycles_since_last_check: 40 }
              as: MaintenanceController
              captures: { ac1_id: $.data.id }
            - call: "POST /wetlease/crew-members"
              payload: { full_name: "A Hallam", employee_no: "EMP-1001", crew_role: "CAPTAIN", type_ratings: ["B738"] }
              as: LessorOpsController
              captures: { cap_id: $.data.id }
            - call: "POST /wetlease/crew-members"
              payload: { full_name: "B Nkosi", employee_no: "EMP-1002", crew_role: "FIRST_OFFICER", type_ratings: ["B738"] }
              as: LessorOpsController
              captures: { fo_id: $.data.id }
            - call: "POST /wetlease/leases"
              payload: { lessee_id: "${lessee_id}", primary_aircraft_id: "${ac1_id}", term_start_date: "2026-09-01", term_end_date: "2026-12-31", block_hour_rate_usd_cents: 480000, min_guaranteed_block_hours_per_month: 5, shortfall_credit_pct: 0.60, crew_provided_by: "LESSOR", maintenance_provided_by: "LESSOR", insurance_provided_by: "LESSOR", operational_control: "LESSOR", substitution_rights: "LESSOR_UNILATERAL", reliability_basis: "DEPARTURE", required_maintenance_program_ref: "MP-B738-REV12", return_hours_since_check_max: 300.00, return_cycles_since_check_max: 120, return_fuel_kg_required: 4000, return_liability_cap_cents: 900000, return_deposit_cents: 500000, redelivery_icao: "EGSS" }
              as: LessorOpsController
              captures: { lease_id: $.data.id }
            - call: "POST /wetlease/leases/${lease_id}/submit-for-approval"
              payload: { authority_docket_no: "CAA-2026-4471" }
              as: LessorOpsController
              captures: { appr_id: $.data.id }
            - call: "POST /wetlease/regulatory-approvals/${appr_id}/decision"
              payload: { determination: "APPROVED" }
              as: RegulatoryAuthority
            - call: "POST /wetlease/insurance-certificates"
              payload: { lease_id: "${lease_id}", certificate_no: "COI-88001", hull_limit_usd_cents: 6000000000, liability_limit_usd_cents: 75000000000, breach_of_warranty_endorsed: true, additional_insured_lessee: true, effective_from: "2026-08-15T00:00:00Z", expires_at: "2027-01-31T23:59:59Z" }
