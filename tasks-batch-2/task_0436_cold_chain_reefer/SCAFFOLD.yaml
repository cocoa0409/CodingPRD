scenario: "436. Cold-Chain & Reefer Logistics: temperature-controlled lane & set-point, multi-temp compartment, sensor telemetry & excursion alert, precool & load integrity, time-and-temp proof (food/pharma), spoilage claim, FSMA Sanitary Transport, lumper & detention"

domain_name: cold-chain-reefer
api_prefix: ""

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: posture_driven_gating
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
    - derived_field_reconciliation
  entity_topology: hybrid
  # Shipment is a hierarchy root (Compartment -> ProductLot nested under it), but
  # Carrier / ReeferUnit / TempLane are flat config peers linked by FK, and
  # SensorReading is an append-only event log under a Compartment.
  state_machine_shape: posture_driven
  # Shipment.load_integrity_posture (INTACT/AT_RISK/COMPROMISED) is a derived
  # aggregate field that gates excursion-sensitive operations on its children;
  # SpoilageClaim and StopEvent add branching + revert shapes.
  relationship_patterns:
    - one_to_many        # Shipment -> Compartment -> ProductLot; Compartment -> SensorReading
    - cross_aggregate    # Shipment.reefer_unit_id -> ReeferUnit; Compartment.temp_lane_id -> TempLane
    - polymorphic        # StopEvent.kind (PICKUP/DELIVERY) governs which fees apply
  role_model: peer_roles
  # Shipper owns Shipments/ProductLots; Carrier owns ReeferUnits and accepts/dispatches;
  # Driver records telemetry/stops; ComplianceOfficer adjudicates claims & sanitary holds.
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — EMIT VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Carrier
    parent: null
    common_fields: true
    fields:
      - name: legal_name
        type: string
        source: input
        description: "Registered carrier legal name"
      - name: fsma_registered
        type: boolean
        source: input
        default: false
        description: "Whether the carrier holds an active FSMA Sanitary Transport registration. Required true before any of its ReeferUnits may be dispatched on a regulated lane."
      - name: sanitary_training_current
        type: boolean
        source: input
        default: false
        description: "Whether driver sanitary-transport training is current. Gates DISPATCH on FOOD/PHARMA cargo."
      - name: liability_cap_cents
        type: integer
        source: input
        default: 5000000
        description: "Maximum carrier liability per spoilage claim, in cents. Caps SpoilageClaim.approved_payout_cents."

  - name: ReeferUnit
    parent: null
    common_fields: true
    fields:
      - name: carrier_id
        type: string
        source: input
        description: "FK -> Carrier.id; the owning carrier of this reefer unit."
      - name: asset_tag
        type: string
        source: input
        description: "Carrier-unique asset tag for the reefer unit."
        constraints: "Unique per carrier_id among non-RETIRED units."
      - name: compartment_count
        type: integer
        source: input
        description: "Number of independently controllable temperature compartments (1 = single-temp, >1 = multi-temp)."
        constraints: "1..4 inclusive"
      - name: status
        type: enum
        source: system
        default: AVAILABLE
        description: "Lifecycle state of the unit."
        constraints: "AVAILABLE | ASSIGNED | IN_TRANSIT | RETIRED"
      - name: last_sanitation_at
        type: datetime
        source: input
        description: "Timestamp of last documented washout/sanitation. Used by the precool/sanitary gate."

  - name: TempLane
    parent: null
    common_fields: true
    fields:
      - name: code
        type: string
        source: input
        description: "Human-readable lane code (e.g. FROZEN, CHILLED, PHARMA_CRT)."
        constraints: "Globally unique among lanes."
      - name: setpoint_min_c
        type: number
        source: input
        description: "Inclusive lower bound of the allowed temperature band, in Celsius."
      - name: setpoint_max_c
        type: number
        source: input
        description: "Inclusive upper bound of the allowed temperature band, in Celsius."
        constraints: "Must be >= setpoint_min_c."
      - name: regulated
        type: boolean
        source: input
        default: true
        description: "Whether this lane carries food/pharma cargo subject to FSMA Sanitary Transport rules."
      - name: tolerance_degree_minutes
        type: integer
        source: input
        default: 30
        description: "Free allowance of out-of-band degree-minutes before a lot is considered impaired (TOL_FREE)."

  - name: Shipment
    parent: null
    common_fields: true
    fields:
      - name: shipper_user_id
        type: string
        source: system
        description: "Opaque shipper operator id, stamped from the X-User-ID header of the Shipper that created the shipment. Not a foreign key; ownership of cancel/claim/withdraw is checked by comparing X-User-ID to this field."
      - name: carrier_id
        type: string
        source: input
        description: "FK -> Carrier.id; the carrier tendered this shipment."
      - name: reefer_unit_id
        type: string
        source: input
        default: null
        description: "FK -> ReeferUnit.id; the assigned reefer unit (null until ACCEPTED)."
      - name: cargo_class
        type: enum
        source: input
        description: "Regulatory class of the cargo."
        constraints: "FOOD | PHARMA | GENERAL"
      - name: status
        type: enum
        source: system
        default: TENDERED
        description: "Lifecycle state of the shipment."
        constraints: "TENDERED | ACCEPTED | PRECOOLED | IN_TRANSIT | DELIVERED | REJECTED | CANCELLED"
      - name: load_integrity_posture
        type: enum
        source: computed
        description: "Derived aggregate posture over all compartments: INTACT (no compartment impaired), AT_RISK (>=1 compartment over tolerance but none in total loss), COMPROMISED (>=1 compartment in total loss). Recomputed on every SensorReading and door event. Gates DELIVER and claim filing."
        constraints: "INTACT | AT_RISK | COMPROMISED"
      - name: precool_verified
        type: boolean
        source: computed
        default: false
        description: "True once every compartment has a precool reading within its lane band before dispatch."
      - name: total_detention_fee_cents
        type: integer
        source: computed
        default: 0
        description: "Sum over this shipment's StopEvents of detention_fee_cents. Recomputed when a StopEvent closes."
      - name: total_lumper_fee_cents
        type: integer
        source: computed
        default: 0
        description: "Sum over this shipment's StopEvents of lumper_fee_cents. Recomputed when a StopEvent closes."

  - name: Compartment
    parent: Shipment
    common_fields: true
    fields:
      - name: shipment_id
        type: string
        source: input
        description: "FK -> Shipment.id; the owning shipment."
      - name: temp_lane_id
        type: string
        source: input
        description: "FK -> TempLane.id; the temperature lane (set-point band) this compartment runs on."
      - name: ordinal
        type: integer
        source: input
        description: "1-based compartment position within the reefer unit."
        constraints: "1..4; unique per shipment_id."
      - name: door_open_events
        type: integer
        source: computed
        default: 0
        description: "Count of DOOR_OPEN sensor events recorded against this compartment."
      - name: degree_minutes_out
        type: number
        source: computed
        default: 0
        description: "Cumulative out-of-band degree-minutes (FINAL variant) integrated over recorded SensorReadings; see degree_minutes_out_of_range calc."
      - name: impairment
        type: enum
        source: computed
        default: NONE
        description: "Derived per-compartment impairment classification from degree_minutes_out vs the lane tolerance thresholds."
        constraints: "NONE | PARTIAL | TOTAL_LOSS"

  - name: ProductLot
    parent: Compartment
    common_fields: true
    fields:
      - name: compartment_id
        type: string
        source: input
        description: "FK -> Compartment.id; the compartment carrying this lot."
      - name: sku
        type: string
        source: input
        description: "Stock-keeping unit / product code."
      - name: pallet_count
        type: integer
        source: input
        description: "Number of pallets in the lot."
        constraints: ">= 0"
      - name: declared_value_cents
        type: integer
        source: input
        description: "Declared cargo value of the lot, in cents. Basis for spoilage payout."
        constraints: ">= 0"
      - name: spoilage_status
        type: enum
        source: computed
        default: SOUND
        description: "Derived spoilage classification mirroring its compartment.impairment at the moment a SpoilageClaim is filed."
        constraints: "SOUND | IMPAIRED | SPOILED"

  - name: SensorReading
    parent: Compartment
    common_fields: false
    fields:
      - name: compartment_id
        type: string
        source: input
        description: "FK -> Compartment.id; the compartment this reading belongs to."
      - name: kind
        type: enum
        source: input
        description: "Reading kind."
        constraints: "TEMP | DOOR_OPEN | PRECOOL"
      - name: temp_c
        type: number
        source: input
        default: null
        description: "Observed temperature in Celsius (required for TEMP and PRECOOL kinds; ignored for DOOR_OPEN)."
      - name: offset_min
        type: integer
        source: input
        description: "Minutes elapsed from the shipment's IN_TRANSIT start at which the reading was taken. Telemetry is integrated as a step function ordered by offset_min ASC, ties broken by created_at ASC."
        constraints: ">= 0"
      - name: excursion_flagged
        type: boolean
        source: computed
        default: false
        description: "True when a TEMP reading falls outside the compartment lane band (set on insert)."

  - name: SpoilageClaim
    parent: null
    common_fields: true
    fields:
      - name: shipment_id
        type: string
        source: input
        description: "FK -> Shipment.id; the delivered shipment the claim is filed against."
      - name: filed_by_user_id
        type: string
        source: input
        description: "Opaque shipper operator id (X-User-ID of the filing Shipper)."
      - name: status
        type: enum
        source: system
        default: FILED
        description: "Claim lifecycle state."
        constraints: "FILED | UNDER_REVIEW | APPROVED | DENIED | WITHDRAWN"
      - name: claimed_value_cents
        type: integer
        source: computed
        description: "Snapshot at filing: sum over impaired/spoiled lots of their per-lot eligible payout (pre-cap). See spoilage_claim_payout calc."
      - name: approved_payout_cents
        type: integer
        source: computed
        default: 0
        description: "Final payout after carrier liability cap is applied on APPROVE. 0 until approved; 0 if denied."

  - name: StopEvent
    parent: Shipment
    common_fields: true
    fields:
      - name: shipment_id
        type: string
        source: input
        description: "FK -> Shipment.id; the shipment this stop belongs to."
      - name: kind
        type: enum
        source: input
        description: "Stop kind; governs which fees may apply."
        constraints: "PICKUP | DELIVERY"
      - name: appointment_min
        type: integer
        source: input
        description: "Scheduled appointment time as minutes offset from the shipment IN_TRANSIT start."
        constraints: ">= 0"
      - name: arrived_min
        type: integer
        source: input
        default: null
        description: "Actual arrival time (offset minutes) recorded when the stop is opened."
      - name: departed_min
        type: integer
        source: input
        default: null
        description: "Actual departure time (offset minutes) recorded when the stop is closed."
      - name: pallets_handled
        type: integer
        source: input
        default: 0
        description: "Pallets handled by the lumper at this stop (basis for lumper fee)."
        constraints: ">= 0"
      - name: compartments_touched
        type: integer
        source: input
        default: 1
        description: "Distinct compartments accessed at this stop (multi-temp surcharge basis)."
        constraints: ">= 1"
      - name: status
        type: enum
        source: system
        default: SCHEDULED
        description: "Stop lifecycle state."
        constraints: "SCHEDULED | ARRIVED | CLOSED"
      - name: detention_fee_cents
        type: integer
        source: computed
        default: 0
        description: "Detention fee accrued for dwell beyond free time at this stop; computed on close. See detention_fee calc."
      - name: lumper_fee_cents
        type: integer
        source: computed
        default: 0
        description: "Lumper handling fee for this stop; computed on close. See lumper_fee calc."

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: ReeferUnit
    initial_state: AVAILABLE
    terminal_states: [RETIRED]
    transitions:
      - from: AVAILABLE
        to: ASSIGNED
        trigger: "POST /shipments/{id}/accept (carrier assigns this unit)"
        actor: Carrier
        preconditions:
          - "ReeferUnit.status == AVAILABLE"
          - "ReeferUnit.compartment_count >= number of Compartments declared on the shipment"
        side_effects:
          - "Shipment.reefer_unit_id set to this unit"
      - from: ASSIGNED
        to: IN_TRANSIT
        trigger: "POST /shipments/{id}/dispatch"
        actor: Carrier
        preconditions:
          - "ReeferUnit.status == ASSIGNED"
        side_effects:
          - "no further unit-side effects"
      - from: IN_TRANSIT
        to: AVAILABLE
        trigger: "POST /shipments/{id}/deliver (system releases the unit)"
        actor: Driver
        preconditions:
          - "ReeferUnit.status == IN_TRANSIT"
        side_effects:
          - "unit returns to the available pool"
      - from: ASSIGNED
        to: AVAILABLE
        trigger: "POST /shipments/{id}/cancel or POST /shipments/{id}/reject — unit released"
        actor: Carrier
        preconditions:
          - "ReeferUnit.status == ASSIGNED"
        side_effects:
          - "Shipment.reefer_unit_id cleared to null"
      - from: AVAILABLE
        to: RETIRED
        trigger: "DELETE /reefer-units/{id}"
        actor: Carrier
        preconditions:
          - "ReeferUnit.status == AVAILABLE"
        side_effects:
          - "asset_tag freed for reuse"

  - entity: Shipment
    initial_state: TENDERED
    terminal_states: [DELIVERED, REJECTED, CANCELLED]
    transitions:
      - from: TENDERED
        to: ACCEPTED
        trigger: "POST /shipments/{id}/accept"
        actor: Carrier
        preconditions:
          - "Shipment.status == TENDERED"
          - "Shipment has >= 1 Compartment"
          - "expected_shipment_version matches Shipment.version (OCC)"
          - "named ReeferUnit.status == AVAILABLE and belongs to Shipment.carrier_id"
          - "ReeferUnit.compartment_count >= count of Shipment's Compartments"
        side_effects:
          - "Shipment.reefer_unit_id set to the named unit"
          - "ReeferUnit transitions AVAILABLE -> ASSIGNED"
          - "increments Shipment.version by 1"
      - from: ACCEPTED
        to: PRECOOLED
        trigger: "POST /shipments/{id}/precool-verify"
        actor: Carrier
        preconditions:
          - "Shipment.status == ACCEPTED"
          - "every Compartment has >= 1 PRECOOL SensorReading whose temp_c is within its lane [setpoint_min_c, setpoint_max_c]"
        side_effects:
          - "Shipment.precool_verified set to true"
      - from: PRECOOLED
        to: IN_TRANSIT
        trigger: "POST /shipments/{id}/dispatch"
        actor: Carrier
        preconditions:
          - "Shipment.status == PRECOOLED"
          - "Shipment.precool_verified == true"
          - "if any Compartment's TempLane.regulated == true: Carrier.fsma_registered == true"
          - "if Shipment.cargo_class IN {FOOD, PHARMA}: Carrier.sanitary_training_current == true"
          - "ReeferUnit.last_sanitation_at is not null"
        side_effects:
          - "ReeferUnit transitions ASSIGNED -> IN_TRANSIT"
          - "shipment IN_TRANSIT start anchors telemetry offset_min = 0"
      - from: IN_TRANSIT
        to: DELIVERED
        trigger: "POST /shipments/{id}/deliver"
        actor: Driver
        preconditions:
          - "Shipment.status == IN_TRANSIT"
          - "every DELIVERY StopEvent on the shipment is CLOSED"
        side_effects:
          - "finalize degree_minutes_out for every Compartment (FINAL variant)"
          - "recompute each Compartment.impairment and Shipment.load_integrity_posture"
          - "ReeferUnit transitions IN_TRANSIT -> AVAILABLE"
      - from: TENDERED
        to: REJECTED
        trigger: "POST /shipments/{id}/reject"
        actor: Carrier
        preconditions:
          - "Shipment.status == TENDERED"
        side_effects:
          - "terminal; no unit was assigned"
      - from: ACCEPTED
        to: CANCELLED
        trigger: "POST /shipments/{id}/cancel"
        actor: Shipper
        preconditions:
          - "Shipment.status == ACCEPTED"
          - "X-User-ID == Shipment.shipper_user_id"
        side_effects:
          - "ReeferUnit transitions ASSIGNED -> AVAILABLE and Shipment.reefer_unit_id cleared"
      - from: PRECOOLED
        to: CANCELLED
        trigger: "POST /shipments/{id}/cancel"
        actor: Shipper
        preconditions:
          - "Shipment.status == PRECOOLED"
          - "X-User-ID == Shipment.shipper_user_id"
        side_effects:
          - "ReeferUnit transitions ASSIGNED -> AVAILABLE and Shipment.reefer_unit_id cleared"

  - entity: StopEvent
    initial_state: SCHEDULED
    terminal_states: [CLOSED]
    transitions:
      - from: SCHEDULED
        to: ARRIVED
        trigger: "POST /shipments/{id}/stops/{stopId}/arrive"
        actor: Driver
        preconditions:
          - "StopEvent.status == SCHEDULED"
          - "Shipment.status == IN_TRANSIT"
          - "arrived_min >= 0"
        side_effects:
          - "StopEvent.arrived_min recorded"
      - from: ARRIVED
        to: CLOSED
        trigger: "POST /shipments/{id}/stops/{stopId}/close"
        actor: Driver
        preconditions:
          - "StopEvent.status == ARRIVED"
          - "departed_min >= arrived_min"
        side_effects:
          - "compute StopEvent.detention_fee_cents via detention_fee calc"
          - "compute StopEvent.lumper_fee_cents via lumper_fee calc"
          - "recompute Shipment.total_detention_fee_cents (sum over CLOSED stops)"
          - "recompute Shipment.total_lumper_fee_cents (sum over CLOSED stops)"

  - entity: SpoilageClaim
    initial_state: FILED
    terminal_states: [APPROVED, DENIED, WITHDRAWN]
    transitions:
      - from: FILED
        to: UNDER_REVIEW
        trigger: "POST /spoilage-claims/{id}/review"
        actor: ComplianceOfficer
        preconditions:
          - "SpoilageClaim.status == FILED"
        side_effects:
          - "claim locked from withdrawal by shipper"
      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /spoilage-claims/{id}/approve"
        actor: ComplianceOfficer
        preconditions:
          - "SpoilageClaim.status == UNDER_REVIEW"
          - "related Shipment.load_integrity_posture IN {AT_RISK, COMPROMISED}"
        side_effects:
          - "compute approved_payout_cents = min(claimed_value_cents, Carrier.liability_cap_cents)"
          - "for each impaired/spoiled ProductLot set spoilage_status (IMPAIRED or SPOILED)"
      - from: UNDER_REVIEW
        to: DENIED
        trigger: "POST /spoilage-claims/{id}/deny"
        actor: ComplianceOfficer
        preconditions:
          - "SpoilageClaim.status == UNDER_REVIEW"
        side_effects:
          - "approved_payout_cents stays 0"
      - from: FILED
        to: WITHDRAWN
        trigger: "POST /spoilage-claims/{id}/withdraw"
        actor: Shipper
        preconditions:
          - "SpoilageClaim.status == FILED"
          - "X-User-ID == SpoilageClaim.filed_by_user_id"
        side_effects:
          - "terminal; no payout"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: accept-stale-shipment
    parent_entity: Shipment
    write_endpoint: "POST /shipments/{id}/accept"
    occ_field: "expected_shipment_version"
    description: |
      Accepting a TENDERED Shipment whose version has advanced since the client
      last observed it is rejected on a stale expected_shipment_version. This
      captures the case where the shipper added or removed a Compartment (which
      legitimately changes the unit-sizing precondition and bumps the
      shipment's version) after the carrier read the shipment; the carrier's
      view — including which ReeferUnit is large enough — is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: degree_minutes_out_of_range
    trigger: "PROVISIONAL: GET /compartments/{cid}/excursion-report (live). FINAL: on POST /shipments/{id}/deliver (DELIVER transition side_effect finalizes Compartment.degree_minutes_out)."
    algorithm: chronological
    formula: |
      # Step-function integration of out-of-band magnitude over TEMP readings,
      # ordered by offset_min ASC, ties broken by created_at ASC.
      readings = TEMP readings of compartment, sorted (offset_min ASC, created_at ASC)
      total = 0
      for i, r in enumerate(readings):
          next_off = readings[i+1].offset_min if i+1 < len(readings) else END_OFFSET
          duration = max(0, next_off - r.offset_min)
          out_mag  = max(0, r.temp_c - lane.setpoint_max_c, lane.setpoint_min_c - r.temp_c)
          total += duration * out_mag
      return total
    input_set: "Only SensorReading.kind == TEMP for the compartment; DOOR_OPEN and PRECOOL readings excluded."
    constants: {}
    precision: "degree-minutes carried as exact number; reported to 2 decimal places, round_half_up"
    variants:
      - name: PROVISIONAL
        when: "computed live via the excursion-report endpoint while Shipment.status == IN_TRANSIT"
        difference: "END_OFFSET = current logical clock offset (now); the last reading is extended to clock-now, so the open trailing interval grows as time passes."
      - name: FINAL
        when: "computed on the DELIVER transition"
        difference: "END_OFFSET = the latest TEMP reading's own offset_min (series is closed; no open trailing interval), making the result fixed and replay-stable."

  - name: spoilage_claim_payout
    trigger: "snapshot computed on POST /spoilage-claims (claimed_value_cents); approved_payout_cents finalized on the APPROVE transition."
    algorithm: waterfall_allocation
    formula: |
      # Per-lot eligible payout, rounded per-lot, THEN summed (PINNED ORDER),
      # then clamped to the carrier liability cap.
      for each ProductLot lot in the shipment (walk compartments ordered by
      Compartment.ordinal ASC, lots within a compartment ordered by created_at ASC):
          g = lot.compartment.degree_minutes_out   # FINAL value
          if   g <= lane.tolerance_degree_minutes:        factor = 0.0   # SOUND
          elif g <= lane.tolerance_degree_minutes + TOL_PARTIAL_SPAN: factor = 0.5   # IMPAIRED
          else:                                            factor = 1.0   # SPOILED
          lot_payout = round_half_up(lot.declared_value_cents * factor)   # round per lot
      claimed_value_cents  = sum(lot_payout over all lots)                # then sum
      approved_payout_cents = min(claimed_value_cents, Carrier.liability_cap_cents)
    input_set: "All ProductLots under the claim's Shipment, walked compartment.ordinal ASC then lot.created_at ASC."
    constants:
      TOL_PARTIAL_SPAN: 90
    precision: "round_half_up to whole cents per lot before summing"
    variants:
      - name: ELIGIBLE
        when: "at filing — claimed_value_cents (pre-cap)"
        difference: "no carrier cap applied"
      - name: SETTLED
        when: "on APPROVE — approved_payout_cents"
        difference: "min(claimed_value_cents, Carrier.liability_cap_cents); cap may shrink the figure"

  - name: detention_fee
    trigger: "on the StopEvent ARRIVED -> CLOSED transition (close)."
    algorithm: tiered_pricing
    formula: |
      dwell_min     = StopEvent.departed_min - StopEvent.arrived_min
      billable_min  = max(0, dwell_min - FREE_TIME_MIN)
      billable_hours = ceil(billable_min / 60)          # any started hour is billed
      tier1_hours   = min(billable_hours, DET_TIER1_MAX)
      tier2_hours   = billable_hours - tier1_hours
      detention_fee_cents = tier1_hours * RATE1_CENTS + tier2_hours * RATE2_CENTS
    input_set: "Single StopEvent; uses arrived_min and departed_min only."
    constants:
      FREE_TIME_MIN: 120
      DET_TIER1_MAX: 4
      RATE1_CENTS: 5000
      RATE2_CENTS: 7500
    precision: "integer cents; billable_hours via ceil (started hour billed)"
    variants: []

  - name: lumper_fee
    trigger: "on the StopEvent ARRIVED -> CLOSED transition (close)."
    algorithm: weighted_scoring
    formula: |
      lumper_fee_cents = BASE_CENTS
                       + StopEvent.pallets_handled * PER_PALLET_CENTS
                       + max(0, StopEvent.compartments_touched - 1) * MULTITEMP_SURCHARGE_CENTS
    input_set: "Single StopEvent; pallets_handled and compartments_touched."
    constants:
      BASE_CENTS: 7500
      PER_PALLET_CENTS: 350
      MULTITEMP_SURCHARGE_CENTS: 2500
    precision: "integer cents"
    variants: []

  - name: load_integrity_score
    trigger: "GET /shipments/{id}/integrity-report (computed read); also drives Shipment.load_integrity_posture classification."
    algorithm: weighted_scoring
    formula: |
      # Worst-compartment aggregate. First each compartment's degree_minutes_out
      # (FINAL when DELIVERED, else PROVISIONAL) yields a per-compartment score;
      # the shipment score is the MIN over compartments (worst link).
      for each Compartment c:
          deg = c.degree_minutes_out
          s = 100
          if not c precooled within band:  s -= PRECOOL_PENALTY
          s -= DOOR_PENALTY * max(0, c.door_open_events - DOOR_FREE)
          s -= EXC_PER_DEGREE_HOUR * (deg / 60)
          c_score = clamp(s, 0, 100)
      shipment_score = round_half_up( min over compartments of c_score )
      # posture mapping is driven by per-compartment impairment, NOT this score:
      #   any compartment.impairment == TOTAL_LOSS -> COMPROMISED
      #   else any compartment.impairment == PARTIAL -> AT_RISK
      #   else -> INTACT
    input_set: "All Compartments of the shipment."
    constants:
      PRECOOL_PENALTY: 30
      DOOR_PENALTY: 5
      DOOR_FREE: 2
      EXC_PER_DEGREE_HOUR: 10
    precision: "round_half_up to integer score in [0,100]"
    variants: []

  - name: compartment_impairment
    trigger: "recomputed on every SensorReading; finalized on the DELIVER transition."
    algorithm: threshold
    formula: |
      g    = Compartment.degree_minutes_out          # PROVISIONAL live, FINAL at deliver
      tol  = lane.tolerance_degree_minutes           # TOL_FREE
      if   g <= tol:                       impairment = NONE        # SOUND
      elif g <= tol + TOL_PARTIAL_SPAN:    impairment = PARTIAL     # IMPAIRED
      else:                                impairment = TOTAL_LOSS  # SPOILED
    input_set: "Single compartment's FINAL (or PROVISIONAL) degree_minutes_out vs its lane tolerance."
    constants:
      TOL_PARTIAL_SPAN: 90
    precision: "boundary uses <= (a lot exactly at tol is NONE; exactly at tol+90 is PARTIAL; tol+90.01 is TOTAL_LOSS)"
    variants: []

  - name: stop_window_overlap
    trigger: "on POST /shipments/{id}/stops (scheduling a stop)."
    algorithm: interval_merge
    formula: |
      # New stop window W = [appointment_min, appointment_min + STOP_SERVICE_MIN].
      # For each existing non-CLOSED stop E on the same shipment, window
      # E = [E.appointment_min, E.appointment_min + STOP_SERVICE_MIN].
      # Collision (reject) iff the buffered windows are NOT separated:
      #   not (W.end + STOP_BUFFER_MIN <= E.start  OR  E.end + STOP_BUFFER_MIN <= W.start)
      # Closed intervals; a positive buffer means windows that merely touch
      # (gap < STOP_BUFFER_MIN) still collide.
    input_set: "All non-CLOSED StopEvents of the shipment vs the candidate window."
    constants:
      STOP_SERVICE_MIN: 60
      STOP_BUFFER_MIN: 30
    precision: "closed-interval overlap with a STOP_BUFFER_MIN separation gap"
    variants: []

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and X-User-Role is a known role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all except POST /_clock/set_current_utc which still requires PlatformAdmin"
  - priority: 2
    category: auth
    check: "Acting role is permitted for the operation per §1.7 RBAC matrix"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "Every path-referenced resource exists, validated left-to-right (shipment before compartment before lot/stop)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all id-bearing paths"
  - priority: 4
    category: business_referential
    check: "Every FK in a request body resolves to an existing resource of the correct type (carrier_id, reefer_unit_id, temp_lane_id, compartment_id, shipment_id)"
    error_id: ERR_FK_NOT_FOUND
    http_status: 422
    applies_to: "all create/accept endpoints"
  - priority: 5
    category: state
    check: "Target resource is in a state from which this transition is legal (state-machine from-state precondition)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action endpoints"
  - priority: 6
    category: business_safety
    check: "On dispatch of a regulated lane, the owning Carrier.fsma_registered must be true"
    error_id: ERR_FSMA_NOT_REGISTERED
    http_status: 422
    applies_to: "POST /shipments/{id}/dispatch"
  - priority: 7
    category: business_safety
    check: "On dispatch of FOOD/PHARMA cargo, Carrier.sanitary_training_current must be true"
    error_id: ERR_SANITARY_TRAINING_LAPSED
    http_status: 422
    applies_to: "POST /shipments/{id}/dispatch"
  - priority: 8
    category: business_safety
    check: "On dispatch, the assigned ReeferUnit.last_sanitation_at must be set (washout documented)"
    error_id: ERR_SANITATION_UNDOCUMENTED
    http_status: 422
    applies_to: "POST /shipments/{id}/dispatch"
  - priority: 9
    category: business_constraint
    check: "On precool-verify, every compartment must have a PRECOOL reading inside its lane band"
    error_id: ERR_PRECOOL_INCOMPLETE
    http_status: 422
    applies_to: "POST /shipments/{id}/precool-verify"
  - priority: 10
    category: business_constraint
    check: "On accept, the named ReeferUnit.compartment_count must be >= the shipment's compartment count"
    error_id: ERR_UNIT_TOO_SMALL
    http_status: 422
    applies_to: "POST /shipments/{id}/accept"
  - priority: 11
    category: business_constraint
    check: "Compartment.ordinal must be unique within a shipment and within 1..reefer compartment_count"
    error_id: ERR_DUPLICATE_ORDINAL
    http_status: 422
    applies_to: "POST /shipments/{id}/compartments"
  - priority: 12
    category: business_constraint
    check: "ReeferUnit.asset_tag must be unique among the carrier's non-RETIRED units"
    error_id: ERR_DUPLICATE_ASSET_TAG
    http_status: 422
    applies_to: "POST /reefer-units"
  - priority: 13
    category: business_temporal
    check: "SensorReading.offset_min and StopEvent arrived/departed offsets are non-negative; departed_min >= arrived_min on close"
    error_id: ERR_INVALID_INTERVAL
    http_status: 422
    applies_to: "POST /compartments/{cid}/readings, POST /shipments/{id}/stops/{stopId}/close"
  - priority: 14
    category: business_temporal
    check: "On scheduling a StopEvent, its closed service window [appointment_min, appointment_min + STOP_SERVICE_MIN] must not overlap any existing non-CLOSED StopEvent's service window on the same shipment; a buffer of STOP_BUFFER_MIN must separate adjacent windows (windows touching within the buffer collide). Closed-interval semantics with a positive separation buffer."
    error_id: ERR_STOP_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /shipments/{id}/stops"
  - priority: 15
    category: business_temporal
    check: "On appending a SensorReading, its offset_min must be strictly greater than the maximum existing offset_min among the same compartment's readings of the SAME kind (monotonic point-event series; a reading at or before the latest same-kind offset collides). Zero-width point semantics — equality collides, no buffer."
    error_id: ERR_READING_OFFSET_DUPLICATE
    http_status: 409
    applies_to: "POST /compartments/{cid}/readings"
  - priority: 16
    category: business_constraint
    check: "A SpoilageClaim may only be filed against a DELIVERED shipment whose load_integrity_posture is AT_RISK or COMPROMISED, and at most one claim in {FILED, UNDER_REVIEW, APPROVED} per shipment"
    error_id: ERR_CLAIM_NOT_ELIGIBLE
    http_status: 422
    applies_to: "POST /spoilage-claims"
  - priority: 17
    category: business_referential
    check: "TEMP/PRECOOL readings require temp_c; DOOR_OPEN must omit temp_c"
    error_id: ERR_READING_SHAPE
    http_status: 422
    applies_to: "POST /compartments/{cid}/readings"
  - priority: 18
    category: business_constraint
    check: "Request body is well-formed: required fields present, enums valid, numerics in range, pagination params within bounds"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all"
  - priority: 19
    category: state
    check: "OCC: expected_shipment_version must equal the current Shipment.version on accept"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /shipments/{id}/accept"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- Carriers ----
  - method: POST
    path: "/carriers"
    description: "Register a carrier."
    roles: [Carrier, PlatformAdmin]
    code: 201
    input: ["legal_name", "fsma_registered?", "sanitary_training_current?", "liability_cap_cents?"]
    output: Carrier
    side_effects: []
  - method: GET
    path: "/carriers/{id}"
    description: "Fetch a carrier."
    roles: [Carrier, Shipper, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: []
    output: Carrier
    side_effects: []
  - method: PATCH
    path: "/carriers/{id}"
    description: "Update carrier compliance flags (FSMA registration, sanitary training, liability cap)."
    roles: [Carrier, PlatformAdmin]
    code: 200
    input: ["fsma_registered?", "sanitary_training_current?", "liability_cap_cents?"]
    output: Carrier
    side_effects: ["increments Carrier.version by 1"]
  - method: GET
    path: "/carriers"
    description: "List carriers."
    roles: [Carrier, Shipper, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: Carrier[]
    side_effects: []

  # ---- ReeferUnits ----
  - method: POST
    path: "/reefer-units"
    description: "Register a reefer unit under a carrier."
    roles: [Carrier, PlatformAdmin]
    code: 201
    input: ["carrier_id", "asset_tag", "compartment_count", "last_sanitation_at?"]
    output: ReeferUnit
    side_effects: []
  - method: GET
    path: "/reefer-units/{id}"
    description: "Fetch a reefer unit."
    roles: [Carrier, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: []
    output: ReeferUnit
    side_effects: []
  - method: GET
    path: "/reefer-units"
    description: "List reefer units; filterable by carrier_id (FK reverse-reachability for ReeferUnit.carrier_id)."
    roles: [Carrier, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: ["carrier_id?", "status?", "limit?", "offset?"]
    output: ReeferUnit[]
    side_effects: []
  - method: PATCH
    path: "/reefer-units/{id}"
    description: "Document a washout/sanitation timestamp on a reefer unit."
    roles: [Carrier, PlatformAdmin]
    code: 200
    input: [last_sanitation_at]
    output: ReeferUnit
    side_effects: ["increments ReeferUnit.version by 1"]
  - method: DELETE
    path: "/reefer-units/{id}"
    description: "Retire an AVAILABLE reefer unit."
    roles: [Carrier, PlatformAdmin]
    code: 200
    input: []
    output: ReeferUnit
    side_effects: ["ReeferUnit.status -> RETIRED"]

  # ---- TempLanes ----
  - method: POST
    path: "/temp-lanes"
    description: "Create a temperature-controlled lane / set-point band."
    roles: [PlatformAdmin]
    code: 201
    input: ["code", "setpoint_min_c", "setpoint_max_c", "regulated?", "tolerance_degree_minutes?"]
    output: TempLane
    side_effects: []
  - method: GET
    path: "/temp-lanes/{id}"
    description: "Fetch a temp lane."
    roles: [Carrier, Shipper, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: []
    output: TempLane
    side_effects: []
  - method: GET
    path: "/temp-lanes"
    description: "List temp lanes."
    roles: [Carrier, Shipper, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: ["regulated?", "limit?", "offset?"]
    output: TempLane[]
    side_effects: []

  # ---- Shipments ----
  - method: POST
    path: "/shipments"
    description: "Tender a new shipment (TENDERED). shipper_user_id is stamped from X-User-ID."
    roles: [Shipper, PlatformAdmin]
    code: 201
    input: [carrier_id, cargo_class]
    output: Shipment
    side_effects: ["Shipment.shipper_user_id stamped from X-User-ID header"]
  - method: GET
    path: "/shipments/{id}"
    description: "Fetch a shipment with computed posture and fee totals."
    roles: [Shipper, Carrier, Driver, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: []
    output: Shipment
    side_effects: []
  - method: GET
    path: "/shipments"
    description: "List shipments; filterable by carrier_id / reefer_unit_id / shipper_user_id (FK reverse-reachability for Shipment.carrier_id and Shipment.reefer_unit_id)."
    roles: [Shipper, Carrier, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: ["carrier_id?", "reefer_unit_id?", "shipper_user_id?", "status?", "limit?", "offset?"]
    output: Shipment[]
    side_effects: []
  - method: POST
    path: "/shipments/{id}/accept"
    description: "Carrier accepts the tender, naming a reefer unit (TENDERED -> ACCEPTED). OCC on shipment version."
    roles: [Carrier]
    code: 200
    input: [reefer_unit_id, expected_shipment_version]
    output: Shipment
    side_effects: ["Shipment.reefer_unit_id set", "ReeferUnit AVAILABLE -> ASSIGNED", "increments Shipment.version by 1"]
  - method: POST
    path: "/shipments/{id}/reject"
    description: "Carrier rejects the tender (TENDERED -> REJECTED)."
    roles: [Carrier]
    code: 200
    input: []
    output: Shipment
    side_effects: ["terminal"]
  - method: POST
    path: "/shipments/{id}/precool-verify"
    description: "Verify all compartments are precooled within band (ACCEPTED -> PRECOOLED)."
    roles: [Carrier]
    code: 200
    input: []
    output: Shipment
    side_effects: ["Shipment.precool_verified -> true"]
  - method: POST
    path: "/shipments/{id}/dispatch"
    description: "Dispatch the load; runs FSMA / sanitary / sanitation gates (PRECOOLED -> IN_TRANSIT)."
    roles: [Carrier]
    code: 200
    input: []
    output: Shipment
    side_effects: ["ReeferUnit ASSIGNED -> IN_TRANSIT", "anchors telemetry offset 0"]
  - method: POST
    path: "/shipments/{id}/deliver"
    description: "Mark delivered; finalizes degree-minutes, impairment, posture, releases unit (IN_TRANSIT -> DELIVERED)."
    roles: [Driver]
    code: 200
    input: []
    output: Shipment
    side_effects: ["FINAL degree_minutes_out per compartment", "recompute impairment + load_integrity_posture", "ReeferUnit IN_TRANSIT -> AVAILABLE"]
  - method: POST
    path: "/shipments/{id}/cancel"
    description: "Shipper cancels before dispatch (ACCEPTED|PRECOOLED -> CANCELLED)."
    roles: [Shipper]
    code: 200
    input: []
    output: Shipment
    side_effects: ["ReeferUnit ASSIGNED -> AVAILABLE", "Shipment.reefer_unit_id cleared"]
  - method: GET
    path: "/shipments/{id}/integrity-report"
    description: "Computed read: load_integrity_score plus per-compartment breakdown."
    roles: [Shipper, Carrier, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: []
    output: "{ shipment_id: string, load_integrity_score: integer, load_integrity_posture: string, compartments: array }"
    side_effects: []

  # ---- Compartments (created nested, read flat for FK reverse-reachability) ----
  - method: POST
    path: "/shipments/{id}/compartments"
    description: "Add a compartment to a TENDERED shipment, bound to a temp lane."
    roles: [Shipper, PlatformAdmin]
    code: 201
    input: [temp_lane_id, ordinal]
    output: Compartment
    side_effects: ["increments Shipment.version by 1"]
  - method: GET
    path: "/compartments/{cid}"
    description: "Fetch a single compartment with computed degree_minutes_out and impairment."
    roles: [Shipper, Carrier, Driver, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: []
    output: Compartment
    side_effects: []
  - method: GET
    path: "/compartments"
    description: "List compartments; filterable by shipment_id and temp_lane_id (FK reverse-reachability for Compartment.shipment_id and Compartment.temp_lane_id)."
    roles: [Shipper, Carrier, Driver, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: ["shipment_id?", "temp_lane_id?", "impairment?", "limit?", "offset?"]
    output: Compartment[]
    side_effects: []
  - method: GET
    path: "/compartments/{cid}/excursion-report"
    description: "Computed read: PROVISIONAL degree_minutes_out at the current logical clock for a compartment."
    roles: [Shipper, Carrier, Driver, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: []
    output: "{ compartment_id: string, provisional_degree_minutes_out: number, excursion_flagged_count: integer, as_of_offset_min: integer }"
    side_effects: []

  # ---- SensorReadings (created nested, read flat) ----
  - method: POST
    path: "/compartments/{cid}/readings"
    description: "Append a sensor reading (TEMP / DOOR_OPEN / PRECOOL) to a compartment."
    roles: [Driver, Carrier]
    code: 201
    input: ["kind", "offset_min", "temp_c?"]
    output: SensorReading
    side_effects: ["TEMP outside band sets excursion_flagged + recomputes posture", "DOOR_OPEN increments Compartment.door_open_events + recomputes posture", "PRECOOL within band enables precool-verify"]
  - method: GET
    path: "/sensor-readings/{id}"
    description: "Fetch a single sensor reading."
    roles: [Shipper, Carrier, Driver, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: []
    output: SensorReading
    side_effects: []
  - method: GET
    path: "/sensor-readings"
    description: "List sensor readings; filterable by compartment_id (FK reverse-reachability for SensorReading.compartment_id)."
    roles: [Shipper, Carrier, Driver, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: ["compartment_id?", "kind?", "limit?", "offset?"]
    output: SensorReading[]
    side_effects: []

  # ---- ProductLots (created nested, read flat) ----
  - method: POST
    path: "/compartments/{cid}/lots"
    description: "Add a product lot to a compartment of a TENDERED shipment."
    roles: [Shipper, PlatformAdmin]
    code: 201
    input: [sku, pallet_count, declared_value_cents]
    output: ProductLot
    side_effects: []
  - method: GET
    path: "/product-lots/{id}"
    description: "Fetch a single product lot."
    roles: [Shipper, Carrier, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: []
    output: ProductLot
    side_effects: []
  - method: GET
    path: "/product-lots"
    description: "List product lots; filterable by compartment_id (FK reverse-reachability for ProductLot.compartment_id)."
    roles: [Shipper, Carrier, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: ["compartment_id?", "limit?", "offset?"]
    output: ProductLot[]
    side_effects: []

  # ---- StopEvents (created nested, read flat) ----
  - method: POST
    path: "/shipments/{id}/stops"
    description: "Schedule a pickup/delivery stop for a shipment; rejects buffered-window overlaps with existing non-CLOSED stops (stop_window_overlap calc)."
    roles: [Shipper, Carrier, PlatformAdmin]
    code: 201
    input: ["kind", "appointment_min", "pallets_handled?", "compartments_touched?"]
    output: StopEvent
    side_effects: ["run stop_window_overlap check against existing non-CLOSED stops"]
  - method: GET
    path: "/stops/{stopId}"
    description: "Fetch a single stop event."
    roles: [Shipper, Carrier, Driver, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: []
    output: StopEvent
    side_effects: []
  - method: GET
    path: "/stops"
    description: "List stop events; filterable by shipment_id (FK reverse-reachability for StopEvent.shipment_id)."
    roles: [Shipper, Carrier, Driver, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: ["shipment_id?", "kind?", "status?", "limit?", "offset?"]
    output: StopEvent[]
    side_effects: []
  - method: POST
    path: "/shipments/{id}/stops/{stopId}/arrive"
    description: "Record arrival at a stop (SCHEDULED -> ARRIVED)."
    roles: [Driver]
    code: 200
    input: [arrived_min]
    output: StopEvent
    side_effects: ["StopEvent.arrived_min recorded"]
  - method: POST
    path: "/shipments/{id}/stops/{stopId}/close"
    description: "Close a stop; computes detention + lumper fees and rolls them into shipment totals (ARRIVED -> CLOSED)."
    roles: [Driver]
    code: 200
    input: ["departed_min", "pallets_handled?", "compartments_touched?"]
    output: StopEvent
    side_effects: ["compute detention_fee_cents", "compute lumper_fee_cents", "recompute Shipment.total_detention_fee_cents", "recompute Shipment.total_lumper_fee_cents"]

  # ---- SpoilageClaims ----
  - method: POST
    path: "/spoilage-claims"
    description: "File a spoilage claim against a DELIVERED, impaired/compromised shipment; snapshots claimed_value_cents."
    roles: [Shipper]
    code: 201
    input: [shipment_id]
    output: SpoilageClaim
    side_effects: ["snapshot claimed_value_cents via spoilage_claim_payout (ELIGIBLE)"]
  - method: GET
    path: "/spoilage-claims/{id}"
    description: "Fetch a spoilage claim."
    roles: [Shipper, Carrier, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: []
    output: SpoilageClaim
    side_effects: []
  - method: GET
    path: "/spoilage-claims"
    description: "List spoilage claims; filterable by shipment_id (FK reverse-reachability for SpoilageClaim.shipment_id)."
    roles: [Shipper, Carrier, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: ["shipment_id?", "status?", "limit?", "offset?"]
    output: SpoilageClaim[]
    side_effects: []
  - method: POST
    path: "/spoilage-claims/{id}/review"
    description: "Open review on a claim (FILED -> UNDER_REVIEW)."
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: SpoilageClaim
    side_effects: ["claim locked from withdrawal"]
  - method: POST
    path: "/spoilage-claims/{id}/approve"
    description: "Approve a claim; applies carrier liability cap and sets lot spoilage_status (UNDER_REVIEW -> APPROVED)."
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: SpoilageClaim
    side_effects: ["approved_payout_cents = min(claimed, cap)", "ProductLot.spoilage_status set per impairment"]
  - method: POST
    path: "/spoilage-claims/{id}/deny"
    description: "Deny a claim (UNDER_REVIEW -> DENIED)."
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: SpoilageClaim
    side_effects: ["approved_payout_cents stays 0"]
  - method: POST
    path: "/spoilage-claims/{id}/withdraw"
    description: "Shipper withdraws a filed claim (FILED -> WITHDRAWN)."
    roles: [Shipper]
    code: 200
    input: []
    output: SpoilageClaim
    side_effects: ["terminal"]

  # ---- Test-driving clock ----
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server logical clock. Startup default is 2026-01-01T00:00:00Z; before any call the clock reads exactly this default and never falls back to wall-clock time. Used to make PROVISIONAL excursion windows deterministic."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["logical clock set to to_iso8601"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "Missing/unknown X-User-Role or missing X-User-ID header"
  - id: ERR_FORBIDDEN_ROLE
    http: 403
    condition: "Acting role not permitted for the operation"
  - id: ERR_NOT_FOUND
    http: 404
    condition: "Path-referenced resource does not exist"
  - id: ERR_FK_NOT_FOUND
    http: 422
    condition: "A foreign key in the request body does not resolve to an existing resource"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "Target resource not in a legal state for the requested transition"
  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_shipment_version does not match current Shipment.version on accept"
  - id: ERR_UNIT_TOO_SMALL
    http: 422
    condition: "Named ReeferUnit has fewer compartments than the shipment requires"
  - id: ERR_DUPLICATE_ORDINAL
    http: 422
    condition: "Compartment ordinal already used on this shipment or out of 1..unit-count range"
  - id: ERR_PRECOOL_INCOMPLETE
    http: 422
    condition: "precool-verify attempted while some compartment lacks an in-band PRECOOL reading"
  - id: ERR_FSMA_NOT_REGISTERED
    http: 422
    condition: "Dispatch of a regulated lane while carrier is not FSMA-registered"
  - id: ERR_SANITARY_TRAINING_LAPSED
    http: 422
    condition: "Dispatch of FOOD/PHARMA cargo while carrier sanitary training is not current"
  - id: ERR_SANITATION_UNDOCUMENTED
    http: 422
    condition: "Dispatch while the assigned reefer unit has no documented last_sanitation_at"
  - id: ERR_INVALID_INTERVAL
    http: 422
    condition: "Negative offset, or departed_min < arrived_min on stop close"
  - id: ERR_CLAIM_NOT_ELIGIBLE
    http: 422
    condition: "Claim filed against a non-delivered/INTACT shipment, or a second open claim on the same shipment"
  - id: ERR_READING_SHAPE
    http: 422
    condition: "TEMP/PRECOOL reading missing temp_c, or DOOR_OPEN reading carrying temp_c"
  - id: ERR_STOP_WINDOW_OVERLAP
    http: 409
    condition: "A new StopEvent's buffered service window collides with an existing non-CLOSED stop window on the same shipment"
  - id: ERR_READING_OFFSET_DUPLICATE
    http: 409
    condition: "A SensorReading offset_min is not strictly greater than the latest same-kind reading offset on the same compartment"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Malformed body: missing required field, bad enum, out-of-range numeric, bad pagination"
  - id: ERR_DUPLICATE_ASSET_TAG
    http: 422
    condition: "asset_tag already used by a non-RETIRED unit of the same carrier"

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Shipper
    description: "Owns shipments, compartments, product lots; files/withdraws spoilage claims."
    identity: "opaque"
    exclusive_operations:
      - "POST /shipments"
      - "POST /shipments/{id}/compartments"
      - "POST /compartments/{cid}/lots"
      - "POST /shipments/{id}/cancel"
      - "POST /spoilage-claims"
      - "POST /spoilage-claims/{id}/withdraw"
    shared_operations:
      - "POST /shipments/{id}/stops"
      - "GET (shipments, compartments, lots, stops, claims, carriers, temp-lanes, integrity-report, excursion-report)"
  - name: Carrier
    description: "Owns reefer units; accepts/rejects tenders, verifies precool, dispatches, manages sanitation."
    identity: "entity_backed:Carrier"
    exclusive_operations:
      - "POST /shipments/{id}/accept"
      - "POST /shipments/{id}/reject"
      - "POST /shipments/{id}/precool-verify"
      - "POST /shipments/{id}/dispatch"
      - "POST /reefer-units"
      - "PATCH /reefer-units/{id}"
      - "DELETE /reefer-units/{id}"
    shared_operations:
      - "POST /shipments/{id}/stops"
      - "POST /compartments/{cid}/readings"
      - "POST /carriers"
      - "PATCH /carriers/{id}"
      - "GET (most read endpoints)"
  - name: Driver
    description: "Records telemetry, opens/closes stops, marks delivery."
    identity: "opaque"
    exclusive_operations:
      - "POST /shipments/{id}/deliver"
      - "POST /shipments/{id}/stops/{stopId}/arrive"
      - "POST /shipments/{id}/stops/{stopId}/close"
    shared_operations:
      - "POST /compartments/{cid}/readings"
      - "GET (shipment/compartment/reading/stop reads)"
  - name: ComplianceOfficer
    description: "Adjudicates spoilage claims (review/approve/deny)."
    identity: "opaque"
    exclusive_operations:
      - "POST /spoilage-claims/{id}/review"
      - "POST /spoilage-claims/{id}/approve"
      - "POST /spoilage-claims/{id}/deny"
    shared_operations:
      - "GET (all read endpoints)"
  - name: PlatformAdmin
    description: "Operator: manages temp lanes, clock, and may perform any operation for setup."
    identity: "opaque"
    exclusive_operations:
      - "POST /temp-lanes"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "POST /carriers"
      - "PATCH /carriers/{id}"
      - "POST /reefer-units"
      - "PATCH /reefer-units/{id}"
      - "DELETE /reefer-units/{id}"
      - "POST /shipments"
      - "POST /shipments/{id}/compartments"
      - "POST /compartments/{cid}/lots"
      - "POST /shipments/{id}/stops"
      - "GET (all read endpoints)"
