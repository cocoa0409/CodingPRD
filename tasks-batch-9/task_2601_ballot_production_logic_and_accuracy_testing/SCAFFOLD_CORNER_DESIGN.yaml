            - call: "POST /elections/${el}/certify-ballot-order"
              payload: {}
              as: ElectionsDirector
            - call: "POST /ballot-styles/${st}/language-certifications"
              payload: { translated_languages: ["EN"], certified_formats: ["PAPER_STANDARD"] }
              as: LanguageAccessCoordinator
            - call: "POST /ballot-styles/${st}/request-proof"
              payload: {}
              as: BallotCoordinator
              as_user_id: "user-coord-1"
            - call: "POST /ballot-styles/${st}/proof-decision"
              payload: { decision: "APPROVE", decision_note: "Artwork accepted" }
              as: ElectionsDirector
              as_user_id: "user-director-1"
            - call: "POST /precincts/${pr}/assign-style"
              payload: { style_id: "${st}" }
              as: BallotCoordinator
            - call: "POST /elections/${el}/lock-styles"
              payload: {}
              as: ElectionsDirector
          trigger:
            - call: "GET /contests/${ct}"
              payload: {}
              as: ElectionsDirector
              captures: { cc0: $.data.certified_candidate_count }
            - call: "GET /elections/${el}"
              payload: {}
              as: ElectionsDirector
              captures: { ec0: $.data.certified_contest_count }
            - call: "POST /candidates/${c_alv}/disqualify"
              payload: { disqualified_reason: "Residency requirement not met" }
              as: ElectionsDirector
              captures: { dq_status: $.data.status, dq_idx: $.data.base_order_index }
            - call: "GET /contests/${ct}"
              payload: {}
              as: ElectionsDirector
              captures: { cc1: $.data.certified_candidate_count, ct_status: $.data.status }
            - call: "GET /contests/${ct}/candidates"
              payload: { status: "CERTIFIED" }
              as: ElectionsDirector
              captures: { surv_name: "$.data[0].ballot_name", surv_idx: "$.data[0].base_order_index" }
            - call: "POST /candidates/${c_bro}/disqualify"
              payload: { disqualified_reason: "Filing withdrawn" }
              as: ElectionsDirector
              captures: { dq2_status: $.data.status }
            - call: "GET /contests/${ct}"
              payload: {}
              as: ElectionsDirector
              captures: { cc2: $.data.certified_candidate_count, ct_status2: $.data.status }
            - call: "GET /elections/${el}"
              payload: {}
              as: ElectionsDirector
              captures: { ec1: $.data.certified_contest_count }
            - call: "GET /ballot-styles/${st}/layout"
              payload: { basis: "CERTIFIED_BASIS" }
              as: BallotCoordinator
              captures: { lay_cands: $.data.candidate_count, lay_contests: $.data.contest_count }
          assert:
            - "${cc0} == 2 and ${ec0} == 1 after certification - both counters are derived from rows, not from the certify payload."
            - "${dq_status} == \"DISQUALIFIED\" and ${dq_idx} is null: a disqualified candidate has no printed position at all."
            - "${cc1} == 1 with ${ct_status} == \"CERTIFIED\" - the count follows the surviving rows while the contest's own state is untouched."
            - "${surv_name} == \"Brooks\" and ${surv_idx} == 1, and the filtered list has total_count 1: Brooks was 2 before the disqualification and is renumbered to 1, so the ordering is re-derived rather than patched."
            - "${dq2_status} == \"DISQUALIFIED\", ${cc2} == 0 and ${ct_status2} == \"CERTIFIED\": a certified contest with zero surviving candidates is a legal (if unhappy) state - the counter is not coupled to the contest's status."
            - "${ec1} == 1 - the election's certified_contest_count counts CERTIFIED contests, and no candidate change can move it."
            - "${lay_contests} == 1 and ${lay_cands} == 0: the computed layout is re-derived from the same surviving rows, so the printed ballot face shows the contest with no names under it."

      - name: cl_style_version_occ_on_print_job_creation_covered_by_difficulty_design
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.print-job-create-stale-style
          - validations.ballot-style-version-current
        distinguishing_aspect: "The second declared concurrency rule guards POST /print-jobs with expected_ballot_style_version, and its interesting form is the interleaving with the style's own state and pinned revision - which is exactly what the cross-entity difficulty instance already drives."
        excluded_because:
          difficulty_instance: "cross_entity_state_dependency / ce_print_job_legality_depends_on_style_state_and_pinned_revision"
          rationale: >
            That instance advances the style's version with a real language re-certification and a
            re-proof, then submits the pre-advance number and asserts ERR_STALE_BALLOT_STYLE_VERSION
            (412) is returned rather than the ERR_STYLE_STATE_INVALID (409) the same stale view produces
            on approve-proof - covering both the stale-then-current pair and the priority-60-before-70
            ordering. A standalone OCC instance here would be a strict subset of it.

      - name: cl_cascading_side_effects_depth5_covered_by_difficulty_design
        claim_type: cascading_side_effects
        grounds:
          - endpoints.POST /contests/{id}/withdraw
          - state_machines.Contest
        distinguishing_aspect: "The deepest cascade in the model runs contest withdrawal through candidates, styles, decks and precinct assignments to the election's deployment readiness, and the claim worth testing is the whole five-hop chain end to end rather than any single hop."
        excluded_because:
          difficulty_instance: "transitive_cascade / tc_contest_withdrawal_depth5_to_election_readiness"
          rationale: >
            That instance walks all five hops in one call and asserts each intermediate entity, so it
            already covers hop ordering, the depth of the chain and the recomputation of
            election.deployment_readiness at the end. Duplicating it here would add no distinct claim.

      - name: cl_cascading_side_effects_on_la_failure_covered_by_difficulty_design
        claim_type: cascading_side_effects
        grounds:
          - endpoints.POST /la-test-sessions/{id}/record-results
          - state_machines.TabulatorUnit
        distinguishing_aspect: "A failed logic-and-accuracy test is the one cascade that runs backwards through custody: it voids the deck, fails the unit, breaks a live seal, decrements the election's open seal count and drops both the precinct and the election out of readiness."
        excluded_because:
          difficulty_instance: "transitive_cascade / tc_la_failure_depth4_blocks_election_deploy"
          rationale: >
            That instance drives a deliberate reported-mark discrepancy on a deployed unit and asserts
            every hop of the four-level cascade including the SEAL_BROKEN custody event and the
            resulting BLOCKED deployment readiness, which is the strongest available form of this claim.

      - name: cl_dual_variant_invoice_estimate_to_final_covered_by_difficulty_design
        claim_type: dual_variant_calculation
        grounds:
          - calculations.print_job_invoice_total
        distinguishing_aspect: "The invoice has two variants that differ in rounding topology as well as in components, so the claim that matters is the signed delta applied to election.committed_print_cents when the job switches from ESTIMATE to FINAL."
        excluded_because:
          difficulty_instance: "dual_variant_calc / dv_print_job_invoice_estimate_versus_final_rounding"
          rationale: >
            That instance bills the same 12500 ballots as one ordered line and then as three shipped
            lots, showing the round-then-sum subtotal landing one cent below the sum-then-round subtotal,
            the defect credit computed off the FINAL subtotal and the -1268 delta on
            election.committed_print_cents. Both variants and the switch delta are already asserted.

  - section: consistency_model
    instances:
      - name: cm_derived_fields_are_visible_in_the_triggering_response
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - calculations.print_job_invoice_total
          - calculations.print_job_quality_inspection
        distinguishing_aspect: "Every derived value in this model is written inside the request that caused it, including the ones that live on a different aggregate: the moment approve-proof returns, the election's committed_print_cents already carries the ESTIMATE total, and the moment deliver returns, the vendor's rolling defect rate, the FINAL invoice and the freshly created lot rows are all readable. Nothing is allowed to lag behind a background pass."
        test_recipe:
          setup:
            - "A PROOF_PENDING print job for 12500 ballots at 8450 cents per thousand against a secure two-press-line vendor."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { now: "2026-08-01T00:00:00Z" }
              as: ElectionsDirector
            - call: "POST /elections"
              payload: { name: "November 2026 General", jurisdiction: "Kestrel County", election_date: "2026-11-03", rotation_policy: "NONE", candidate_order_method: "ALPHABETICAL_BY_BALLOT_NAME", la_notice_hours: 48 }
              as: ElectionsDirector
              captures: { el: $.data.id }
            - call: "POST /elections/${el}/contests"
              payload: { title: "County Sheriff", contest_type: "CANDIDATE", district_code: "D-12", seats_open: 1, rotation_required: false }
              as: BallotCoordinator
              captures: { ct: $.data.id }
            - call: "POST /contests/${ct}/candidates"
              payload: { full_name: "Ana Alvarez", ballot_name: "Alvarez", filing_received_at: "2026-06-01T09:00:00Z", party_code: "IND" }
              as: BallotCoordinator
              captures: { c_alv: $.data.id }
            - call: "POST /contests/${ct}/certify"
              payload: {}
              as: ElectionsDirector
            - call: "POST /elections/${el}/ballot-styles"
              payload: { style_code: "S-100", district_codes: ["D-12"], language_set: ["EN"], required_formats: ["PAPER_STANDARD"] }
              as: BallotCoordinator
              captures: { st: $.data.id }
            - call: "POST /elections/${el}/precincts"
              payload: { precinct_code: "P-001", district_codes: ["D-12"], registered_voter_count: 100, polling_place: "Kestrel Community Hall" }
              as: BallotCoordinator
              captures: { pr: $.data.id }
            - call: "POST /elections/${el}/certify-ballot-order"
              payload: {}
              as: ElectionsDirector
            - call: "POST /ballot-styles/${st}/language-certifications"
              payload: { translated_languages: ["EN"], certified_formats: ["PAPER_STANDARD"] }
              as: LanguageAccessCoordinator
            - call: "POST /ballot-styles/${st}/request-proof"
              payload: {}
              as: BallotCoordinator
              as_user_id: "user-coord-1"
            - call: "POST /ballot-styles/${st}/proof-decision"
              payload: { decision: "APPROVE", decision_note: "Artwork accepted" }
              as: ElectionsDirector
              as_user_id: "user-director-1"
            - call: "POST /precincts/${pr}/assign-style"
              payload: { style_id: "${st}" }
              as: BallotCoordinator
            - call: "POST /elections/${el}/lock-styles"
              payload: {}
              as: ElectionsDirector
            - call: "GET /ballot-styles/${st}"
              payload: {}
              as: BallotCoordinator
              captures: { st_v: $.data.version }
            - call: "POST /print-vendors"
              payload: { name: "Ridgeline Secure Print", press_line_count: 2, certified_secure: true, status: "ACTIVE" }
              as: ElectionsDirector
              captures: { vend: $.data.id }
            - call: "POST /print-jobs"
              payload: { vendor_id: "${vend}", style_id: "${st}", quantity_ordered: 12500, unit_cost_cents_per_thousand: 8450, press_window_start: "2026-08-10T08:00:00Z", press_window_end: "2026-08-12T08:00:00Z", expected_ballot_style_version: "${st_v}" }
              as: BallotCoordinator
              captures: { job: $.data.id }
          trigger:
            - call: "POST /print-jobs/${job}/approve-proof"
              payload: {}
              as: ElectionsDirector
              captures: { a_basis: $.data.invoice_basis, a_sub: $.data.invoice_subtotal_cents, a_freight: $.data.freight_cents, a_credit: $.data.defect_credit_cents, a_total: $.data.invoice_total_cents, a_delivered: $.data.delivered_quantity }
            - call: "GET /elections/${el}"
              payload: {}
              as: ElectionsDirector
              captures: { e_committed: $.data.committed_print_cents }
            - call: "POST /print-jobs/${job}/inspect"
              payload: { sample_size: 500, defect_count: 6 }
              as: WarehouseCustodian
              captures: { i_rate: $.data.defect_rate_bp, i_status: $.data.status, i_count: $.data.inspection_count }
            - call: "GET /print-vendors/${vend}"
              payload: {}
              as: ElectionsDirector
              captures: { v_rate: $.data.quality_defect_rate_bp, v_jobs: $.data.active_job_count }
            - call: "POST /print-jobs/${job}/deliver"
              payload: { lots: [{ lot_code: "L-001", quantity_shipped: 12500, seal_number: "SEAL-1001" }] }
              as: PrintVendorRep
              as_user_id: "${vend}"
              captures: { d_basis: $.data.invoice_basis, d_sub: $.data.invoice_subtotal_cents, d_credit: $.data.defect_credit_cents, d_total: $.data.invoice_total_cents, d_delivered: $.data.delivered_quantity }
            - call: "GET /elections/${el}"
              payload: {}
              as: ElectionsDirector
              captures: { e_committed2: $.data.committed_print_cents }
            - call: "GET /ballot-lots"
              payload: { print_job_id: "${job}" }
              as: WarehouseCustodian
              captures: { l_code: "$.data[0].lot_code", l_state: "$.data[0].custody_state" }
            - call: "GET /elections/${el}/custody-events"
              payload: {}
              as: WarehouseCustodian
              captures: { ce_type: "$.data[0].event_type" }
          assert:
            - "Call 1's own response already carries the whole ESTIMATE invoice: ${a_basis} == \"ESTIMATE\", ${a_sub} == 105625, ${a_freight} == 45000, ${a_credit} == 0, ${a_total} == 150625, ${a_delivered} == 0. No second read is needed to see the numbers."
            - "${e_committed} == 150625 immediately - the counter lives on the Election, a different aggregate from the PrintJob that was written, and it is already correct on the very next read."
            - "${i_rate} == 120, ${i_status} == \"QC_PASSED\" and ${i_count} == 1 in the inspect response itself: round_half_up(6 * 10000 / 500) == 120, below the 150 basis-point hold threshold."
            - "${v_rate} == 120 and ${v_jobs} == 1: the vendor's rolling rate is re-derived across the vendor inside the inspect call, not on a later sweep."
            - "Call 5 returns the FINAL invoice in its own response: ${d_basis} == \"FINAL\", ${d_sub} == 105625 (a single lot rounds once, so round-then-sum and sum-then-round agree here), ${d_credit} == 1268 == round_half_up(105625 * 120 / 10000), ${d_delivered} == 12500 and ${d_total} == 149357."
            - "${e_committed2} == 149357: the switch from ESTIMATE to FINAL applied the signed delta of -1268 to the election in the same request."
            - "The lot list answers with total_count 1, ${l_code} == \"L-001\" and ${l_state} == \"IN_TRANSIT\" - the lot the manifest created is listable straight away."
            - "${ce_type} == \"TRANSFER_OUT\": the custody trail is appended synchronously too, so the audit record and the state it describes can never be observed out of step."

      - name: cm_compensating_release_of_committed_cents_covered_by_difficulty_design
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - entities.Election.committed_print_cents
        distinguishing_aspect: "The hardest form of an immediate cross-aggregate write is the compensating one: rejecting a job must remove its whole contribution from the election's committed total in the same request, with no residue and no drift after repeated writes."
        excluded_because:
          difficulty_instance: "compensating_invariant / ci_committed_print_cents_released_on_job_rejection"
          rationale: >
            That instance walks committed_print_cents through an ESTIMATE write, a FINAL write and a
            rejection, asserting the counter returns to exactly the value it held before the job existed
            and that a second job's contribution is untouched - which subsumes any plainer read-your-write
            claim about the same field.
