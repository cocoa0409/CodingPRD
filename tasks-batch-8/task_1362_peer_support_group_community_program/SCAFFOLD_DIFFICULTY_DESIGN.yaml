  # ==========================================================================
  # Rule 9: Compensating-action invariants across different conserved quantities
  # ==========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: enrollment_seat_conservation_release_restores_count
        grounds:
          - state_machines.Enrollment.CONFIRMED_to_RELEASED
          - entities.PeerGroup.fields.active_enrollment_count
        distinguishing_aspect: |
          Conserved quantity: PeerGroup.active_enrollment_count. Forward action
          (confirm) increments by 1; compensating action (release) decrements by
          1. After confirm + release, active_enrollment_count MUST return to the
          exact pre-confirm value.
        test_recipe:
          setup:
            - "PeerGroup G ACTIVE, base_capacity=5, active_enrollment_count=0"
            - "Participant A ACTIVE with SIGNED agreement"
            - "A enrolled (RESERVED)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /programs"
              payload: { name: "P", focus_area: "GRIEF" }
              as: ProgramAdmin
              captures: { pid: $.data.id }
            - call: "POST /programs/${pid}/groups"
              payload: { name: "G", modality: "VIRTUAL", base_capacity: 5, required_facilitator_level: 1 }
              as: ProgramAdmin
              captures: { gid: $.data.id }
            - call: "POST /programs/${pid}/groups/${gid}/activate"
              payload: {}
              as: ProgramAdmin
            - call: "POST /participants"
              payload: { full_name: "A", email: "a@x.com", household_size: 1 }
              as: ProgramAdmin
              captures: { pa: $.data.id }
            - call: "POST /participants/${pa}/agreements"
              payload: { signed_at: "2026-07-25T00:00:00Z", expires_at: "2027-07-25T00:00:00Z", agreement_version: 1 }
              as: ProgramAdmin
            - call: "POST /participants/${pa}/activate"
              payload: {}
              as: ProgramAdmin
            - call: "POST /programs/${pid}/groups/${gid}/enrollments"
              payload: { participant_id: "${pa}" }
              as: ProgramAdmin
              captures: { eid: $.data.id }
            - call: "GET /programs/${pid}/groups/${gid}"
              payload: {}
              as: ProgramAdmin
              captures: { count_initial: $.data.active_enrollment_count, gv: $.data.version }
          trigger:
            - call: "POST /programs/${pid}/groups/${gid}/enrollments/${eid}/confirm"
              payload: { expected_group_version: "${gv}" }
              as: ProgramAdmin
            - call: "GET /programs/${pid}/groups/${gid}"
              payload: {}
              as: ProgramAdmin
              captures: { count_after_confirm: $.data.active_enrollment_count }
            - call: "POST /programs/${pid}/groups/${gid}/enrollments/${eid}/release"
              payload: {}
              as: ProgramAdmin
            - call: "GET /programs/${pid}/groups/${gid}"
              payload: {}
              as: ProgramAdmin
              captures: { count_after_release: $.data.active_enrollment_count }
          assert:
            - "count_initial == 0 (RESERVED does not count toward active_enrollment_count pre-confirm per spec)"
            - "count_after_confirm == 1"
            - "count_after_release == 0"
            - "Invariant: confirm + release returns count to pre-confirm value"
            - "count_after_release == count_initial"

      - name: attendance_streak_conservation_void_restores_streak
        grounds:
          - state_machines.AttendanceRecord.CHECKED_IN_to_VOIDED
          - state_machines.AttendanceRecord.CHECKED_IN_to_ATTENDED
          - entities.Participant.fields.attendance_streak
        distinguishing_aspect: |
          Conserved quantity: Participant.attendance_streak. Forward action
          (checkout → ATTENDED) increments streak by 1; compensating action
          (void a CHECKED_IN record before checkout) restores streak to prior
          value (i.e., void does NOT decrement — the record was voided before
          attendance was finalized). The invariant differs from seat
          conservation because it operates on Participant streak, not
          PeerGroup count.
