          assert:
            - "The 24-unit order (setup) has unit_price_cents == 1799, base_cents == 43176, contract_discount_cents == 3022, handling_fee_cents == 1250, total_cost_cents == 41404, auto_approved == false, status == SUBMITTED"
            - "The 25-unit trigger has unit_price_cents == 1709 (round_half_up(1799 * 0.95) == round_half_up(1709.05)), base_cents == 42725, contract_discount_cents == 2991 (round_half_up(2990.75)), handling_fee_cents == 0"
            - "The 25-unit order's total_cost_cents == 39734 — LESS than the 24-unit order's 41404"
            - "The 25-unit order has auto_approved == true and status == APPROVED (39734 <= 40000)"

