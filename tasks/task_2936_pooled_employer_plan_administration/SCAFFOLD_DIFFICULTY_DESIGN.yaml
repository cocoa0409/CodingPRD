        grounds:
          - validations[priority=48]
          - state_machines.ExitTransfer.SETTLED_to_REVERSED
          - entities.ExitTransfer.fields.blackout_start_date
          - entities.ExitTransfer.fields.blackout_end_date
        distinguishing_aspect: |
          The overlapping resource here is the plan's single asset-transfer slot, and the
          exclusion is not a plain interval intersection: a BLACKOUT_BUFFER_DAYS gap of five
          calendar days is reserved around the incumbent window, and the slot is released only
          by REVERSED status. A second employer whose window merely sits close to the incumbent
          is refused at approve, is still refused after the incumbent has SETTLED, and is
          admitted only once the incumbent transfer is reversed — so status, not the calendar,
          decides when the resource frees up.
