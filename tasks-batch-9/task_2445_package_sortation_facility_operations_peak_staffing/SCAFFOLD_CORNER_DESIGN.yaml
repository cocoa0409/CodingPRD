        grounds:
          - calculations.required_headcount
          - endpoints.POST_/sortation/shift-plans/{id}/submit
        distinguishing_aspect: "The 85 percent tier edge is inclusive: 86 and 85 both select PPH_TIER_HIGH 1200 and require 5 associates, while 84 drops to PPH_TIER_MID 950 and requires 6 for the identical plan."
        test_recipe:
          setup:
            - "Three centers identical except for automation_utilization_pct: SC-86 (86), SC-85 (85), SC-84 (84); each has exactly one ACTIVE chute, so the per-line floor is MIN_HEADCOUNT_PER_LINE x 1 == 4"
            - "Each center gets one DRAFT plan for 2026-08-03 06:00-14:00 (shift_hours 8.0) with forecast_volume 40000, core 4, seasonal 0, budget 500000"
            - "All three centers are OPEN, so POSTURE_MULTIPLIER is 1.0 and only the tier term moves"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T05:00:00Z" }
