      - name: sod_settlement_closer_cannot_finalize
        claim_type: segregation_of_duties
        grounds: ["validations[priority=7]", entities.PeriodSettlement.fields.closed_by, "errors[ERR_SOD_VIOLATION]"]
        distinguishing_aspect: "The FinanceAnalyst who closed the settlement cannot finalize it via a PlantManager role swap (user id match); a distinct manager finalizes."
