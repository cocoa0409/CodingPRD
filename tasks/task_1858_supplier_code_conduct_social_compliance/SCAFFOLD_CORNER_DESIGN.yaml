      - name: annual_blocked_by_valid_mutual_recognition
        claim_type: violation_to_error
        grounds: ["validations[priority=9]", "errors[ERR_COVERED_BY_MUTUAL_RECOGNITION]", calculations.next_audit_interval]
        distinguishing_aspect: "A valid ACCEPTED claim substitutes for the internal ANNUAL audit: scheduling ANNUAL at the covered facility fails, while INITIAL still succeeds (the recognition scope is audit-type specific)."
