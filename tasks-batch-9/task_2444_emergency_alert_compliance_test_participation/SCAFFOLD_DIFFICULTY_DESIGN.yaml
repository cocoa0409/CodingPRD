      - name: penalty_ceiling_reads_pre_write_total_and_rejects_the_amendment
        grounds:
          - "§1.6 ERR_PENALTY_CEILING_EXCEEDED: 'Station.penalty_points_total + this filing's penalty_points would exceed STATION_POINT_CEILING (5.00)'"
          - "§1.4 priority 12 (the last rule evaluated) and §1.3 filing_penalty_points constants STATION_POINT_CEILING=5.00, LATE_DAY_POINTS=0.75, PER_ENTRY_LATE_RATE=0.065"
          - "§1.5 POST /filing-records side effect 'prior SUBMITTED/ACCEPTED filing for the same event -> REVERSED with reversal_reason SUPERSEDED_BY_AMENDMENT'"
          - "§1.2 state_machines.FilingRecord {SUBMITTED, ACCEPTED} -> REVERSED"
        distinguishing_aspect: "Combinatorial mode (c): the ceiling is evaluated against the PRE-write penalty_points_total (3.00, which still includes the very row this amendment would reverse), giving 3.00 + 3.00 = 6.00 > 5.00 and a rejection — whereas an implementation that reverses first, or that evaluates the ceiling on the post-write ledger, would compute 0.00 + 3.00 = 3.00 and accept the amendment."
