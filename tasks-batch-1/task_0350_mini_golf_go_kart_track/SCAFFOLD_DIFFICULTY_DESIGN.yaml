              as_user_id: "ops-1"
              captures: { attr_id: $.data.id }
            - call: "POST /heats"
              payload: { venue_id: "${venue_id}", attraction_id: "${attr_id}", start_utc: "2026-06-14T10:00:00Z", end_utc: "2026-06-14T10:15:00Z" }
              as: OpsManager
              as_user_id: "ops-1"
              captures: { heat_id: $.data.id }
            - call: "GET /venues/${venue_id}"
              payload: {}
              as: OpsManager
              as_user_id: "ops-1"
