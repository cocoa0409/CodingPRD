# =============================================================================
# SCAFFOLD.yaml — task_3226_independent_film_acquisition_festival_premiere_strategy_awards
#
# A24-style independent-film acquisition, festival premiere strategy, and awards
# campaign system. Expert-band scaffold (13 entities, 31 endpoints, 30 errors).
#
# §1.0 response envelope, §1.1 entities, §1.2 state machines, §1.2.1 concurrency
# rules, §1.3 calculations, §1.4 validations, §1.5 endpoints, §1.6 errors,
# §1.7 RBAC. §1.8 and §1.9 live in sibling files and are NOT declared here.
# =============================================================================

scenario: |
  Independent Film Acquisition, Festival Premiere Strategy & Awards Campaign (A24):
  acquisition of finished films at festivals with negotiation under competitive time
  pressure and rights scope by territory and window, premiere strategy selecting
  festival slots and embargo timing to shape critical reception, theatrical release
  planning with platform releases expanding by market based on per-screen performance,
  awards campaign budgeting across screenings, guild mailers, publicity and category
  placement decisions, talent campaign availability with travel, press and event
  obligations, streaming and home entertainment window negotiation as part of the
  acquisition, marketing spend allocation between theatrical and awards phases,
  participation and profit definition for filmmakers.

domain_name: indie-film-acquisition
api_prefix: ""

complexity_profile:
  primary_archetype: multi_party_negotiation
  secondary_archetype: posture_driven_gating
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - derived_field_reconciliation
  entity_topology: hybrid
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - cross_aggregate
    - many_to_many
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — emit verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table (13 entities)
# =============================================================================
entities:

  - name: Film
    parent: null
    common_fields: true
    fields:
      - { name: title, type: string, source: input, description: "Working title of the finished film being shopped" }
      - { name: director_name, type: string, source: input, description: "Director's name (used in awards credit lines)" }
      - { name: principal_cast, type: array, source: input, description: "List of principal cast member names; feeds TalentObligation creation" }
      - { name: genre, type: enum, source: input, description: "DRAMA | COMEDY | HORROR | DOCUMENTARY | THRILLER", constraints: "closed enum" }
      - { name: runtime_minutes, type: integer, source: input, description: "Final-cut runtime in minutes", constraints: "> 0" }
      - { name: production_budget_cents, type: integer, source: input, description: "Negative cost; feeds participation waterfall", constraints: ">= 0" }
      - { name: acquisition_status, type: enum, source: computed, description: "SHOPPING | UNDER_NEGOTIATION | ACQUIRED | PASSED" }
      - { name: release_posture, type: enum, source: computed, description: "PRE_ACQUISITION | PREMIERE_LOCKED | PLATFORM | WIDE | HOME_WINDOW | ARCHIVED; gates downstream ops" }
      - { name: awards_posture, type: enum, source: computed, description: "INELIGIBLE | ELIGIBLE | CAMPAIGNING | SUBMITTED | CONCLUDED" }

  - name: Territory
    parent: null
    common_fields: true
    fields:
      - { name: code, type: string, source: input, description: "ISO-style territory code, e.g. US, UK, FR, JP, WW_EX_US", constraints: "unique; 2–8 chars uppercase" }
      - { name: name, type: string, source: input, description: "Human-readable territory name" }
      - { name: is_home_ent_eligible, type: boolean, source: input, description: "Whether this territory permits home-entertainment windows in RightsGrants" }

  - name: Festival
    parent: null
    common_fields: true
    fields:
      - { name: code, type: string, source: input, description: "Short festival code, e.g. SUNDANCE, TIFF, CANNES, SXSW", constraints: "unique" }
      - { name: name, type: string, source: input, description: "Festival display name" }
      - { name: start_date, type: datetime, source: input, description: "Festival opening instant (UTC)" }
      - { name: end_date, type: datetime, source: input, description: "Festival closing instant (UTC); must be > start_date" }
      - { name: prestige_tier, type: enum, source: input, description: "A_LIST | B_LIST | REGIONAL", constraints: "closed enum; feeds premiere cachet calculation" }
      - { name: default_review_embargo_hours, type: integer, source: input, description: "Default press embargo length in hours, applied to PremiereSlots that don't override it", constraints: ">= 0" }

  - name: PremiereSlot
    parent: Festival
    common_fields: true
    fields:
      - { name: festival_id, type: string, source: input, description: "FK -> Festival.id; owning festival" }
      - { name: film_id, type: string, source: input, description: "FK -> Film.id; film occupying the slot (null until booked)", constraints: "nullable" }
      - { name: section, type: enum, source: input, description: "COMPETITION | MIDNIGHT | PREMIERES | NEXT", constraints: "closed enum" }
      - { name: screening_starts_at, type: datetime, source: input, description: "Screening start instant (UTC); must fall inside the festival window" }
      - { name: screening_ends_at, type: datetime, source: input, description: "Screening end instant (UTC); must be > screening_starts_at" }
      - { name: review_embargo_lifts_at, type: datetime, source: input, description: "Press embargo lift instant; must be >= screening_ends_at" }
      - { name: status, type: enum, source: computed, description: "OPEN | HELD | BOOKED | CANCELLED" }
      - { name: cachet_score, type: integer, source: computed, description: "Derived from Festival.prestige_tier + section + embargo timing; see calc premiere_cachet" }

  - name: AcquisitionOffer
    parent: Film
    common_fields: true
    fields:
      - { name: film_id, type: string, source: input, description: "FK -> Film.id; the film under negotiation" }
      - { name: buyer_code, type: string, source: input, description: "Buyer label, e.g. A24, NEON, SEARCHLIGHT" }
      - { name: round_number, type: integer, source: system, description: "Negotiation round ordinal; starts at 1, increments per counter-offer cycle on the same film" }
      - { name: upfront_price_cents, type: integer, source: input, description: "Minimum guarantee", constraints: "> 0" }
      - { name: backend_participation_pct, type: number, source: input, description: "Filmmaker share of net profits, 0..1", constraints: ">= 0 and <= 1" }
      - { name: prints_advertising_commit_cents, type: integer, source: input, description: "P&A floor the buyer commits to spend", constraints: ">= 0" }
      - { name: requested_territory_codes, type: array, source: input, description: "List of Territory.code values the offer seeks rights for", constraints: "non-empty" }
      - { name: requested_windows, type: array, source: input, description: "Subset of {THEATRICAL, STREAMING, HOME_ENT, TV}", constraints: "non-empty subset" }
      - { name: expiry_at, type: datetime, source: input, description: "Wall-clock expiry of this offer (competitive pressure); evaluated against logical clock" }
      - { name: status, type: enum, source: computed, description: "OPEN | COUNTERED | ACCEPTED | REJECTED | WITHDRAWN | EXPIRED" }
      - { name: expected_film_version, type: integer, source: input, description: "OCC field — client-observed Film.version; the OCC parent for offer acceptance" }

  - name: AcquisitionDeal
    parent: Film
    common_fields: true
    fields:
      - { name: film_id, type: string, source: system, description: "FK -> Film.id; the acquired film" }
      - { name: source_offer_id, type: string, source: system, description: "FK -> AcquisitionOffer.id; the offer that produced this deal" }
      - { name: buyer_code, type: string, source: system, description: "Copied from the accepted offer" }
      - { name: upfront_price_cents, type: integer, source: system, description: "Copied from the accepted offer" }
      - { name: backend_participation_pct, type: number, source: system, description: "Copied from the accepted offer" }
      - { name: prints_advertising_commit_cents, type: integer, source: system, description: "Copied from the accepted offer" }
      - { name: status, type: enum, source: computed, description: "EXECUTED | IN_RELEASE | CLOSED_OUT | RESCINDED" }
      - { name: pa_spent_theatrical_cents, type: integer, source: computed, description: "Derived: sum of theatrical-phase marketing spend" }
      - { name: pa_spent_awards_cents, type: integer, source: computed, description: "Derived: sum of awards-phase marketing spend" }
      - { name: pa_shortfall_cents, type: integer, source: computed, description: "max(0, prints_advertising_commit_cents - (pa_spent_theatrical_cents + pa_spent_awards_cents))" }

  - name: RightsGrant
    parent: AcquisitionDeal
    common_fields: true
    fields:
      - { name: deal_id, type: string, source: input, description: "FK -> AcquisitionDeal.id" }
      - { name: territory_code, type: string, source: input, description: "FK-like reference to Territory.code (lookup, not id)" }
      - { name: window, type: enum, source: input, description: "THEATRICAL | STREAMING | HOME_ENT | TV", constraints: "closed enum" }
      - { name: window_starts_at, type: datetime, source: input, description: "Window open instant (UTC)" }
      - { name: window_ends_at, type: datetime, source: input, description: "Window close instant (UTC); exclusive upper bound", constraints: "> window_starts_at" }
      - { name: status, type: enum, source: computed, description: "GRANTED | LAPSED | REVOKED" }

  - name: ReleasePlan
    parent: Film
    common_fields: true
    fields:
      - { name: film_id, type: string, source: input, description: "FK -> Film.id" }
      - { name: deal_id, type: string, source: input, description: "FK -> AcquisitionDeal.id; must be EXECUTED or IN_RELEASE" }
      - { name: platform_strategy, type: enum, source: input, description: "LIMITED_4 | LIMITED_8 | WIDE_DIRECT", constraints: "closed enum" }
      - { name: opening_weekend_date, type: datetime, source: input, description: "First Friday 00:00 UTC of opening weekend" }
      - { name: target_market_codes, type: array, source: input, description: "Initial platform market codes (NY, LA, etc.)" }
      - { name: expansion_threshold_psa_cents, type: integer, source: input, description: "Per-screen-average cents required to trigger expansion", constraints: "> 0" }
      - { name: status, type: enum, source: computed, description: "DRAFT | OPENED | EXPANDING | WIDE | PULLED" }
      - { name: current_screen_count, type: integer, source: computed, description: "Sum over non-PULLED MarketScreening screen counts" }
      - { name: cumulative_gross_cents, type: integer, source: computed, description: "Sum over MarketScreening gross" }

  - name: MarketScreening
    parent: ReleasePlan
    common_fields: true
    fields:
      - { name: release_plan_id, type: string, source: input, description: "FK -> ReleasePlan.id" }
      - { name: market_code, type: string, source: input, description: "Market identifier (NY, LA, CHI, ...)" }
      - { name: weekend_index, type: integer, source: input, description: "1 for opening weekend, 2 for next, ...", constraints: ">= 1" }
      - { name: screen_count, type: integer, source: input, description: "Screens playing the film in this market this weekend", constraints: "> 0" }
      - { name: weekend_gross_cents, type: integer, source: input, description: "Box-office gross for this market-weekend", constraints: ">= 0" }
      - { name: per_screen_avg_cents, type: integer, source: computed, description: "weekend_gross_cents / screen_count, integer division rounding half up" }
      - { name: status, type: enum, source: computed, description: "SCHEDULED | REPORTED | EXPANSION_TRIGGERED | PULLED" }

  - name: AwardsCampaign
    parent: Film
    common_fields: true
    fields:
      - { name: film_id, type: string, source: input, description: "FK -> Film.id" }
      - { name: deal_id, type: string, source: input, description: "FK -> AcquisitionDeal.id; the deal funding the campaign" }
      - { name: awards_body, type: enum, source: input, description: "OSCARS | GOLDEN_GLOBES | INDEPENDENT_SPIRIT | BAFTA", constraints: "closed enum" }
      - { name: target_categories, type: array, source: input, description: "List of category codes (BEST_PICTURE, DIRECTOR, ACTOR_LEAD, ACTRESS_LEAD, SCREENPLAY, ...)" }
      - { name: budget_total_cents, type: integer, source: input, description: "Total campaign budget", constraints: "> 0" }
      - { name: budget_screenings_cents, type: integer, source: computed, description: "Sum over SCREENING spends" }
      - { name: budget_mailers_cents, type: integer, source: computed, description: "Sum over GUILD_MAILER spends" }
      - { name: budget_publicity_cents, type: integer, source: computed, description: "Sum over PUBLICITY spends" }
      - { name: budget_remaining_cents, type: integer, source: computed, description: "budget_total_cents - sum of all CampaignSpend.amount_cents" }
      - { name: status, type: enum, source: computed, description: "PLANNING | ACTIVE | SUBMITTED | CONCLUDED" }

  - name: CampaignSpend
    parent: AwardsCampaign
    common_fields: true
    fields:
      - { name: campaign_id, type: string, source: input, description: "FK -> AwardsCampaign.id" }
      - { name: category, type: enum, source: input, description: "SCREENING | GUILD_MAILER | PUBLICITY | TRAVEL | EVENT", constraints: "closed enum" }
      - { name: amount_cents, type: integer, source: input, description: "Cost of the line item", constraints: "> 0" }
      - { name: incurred_at, type: datetime, source: input, description: "When the spend was incurred (UTC)" }
      - { name: target_category, type: string, source: input, description: "Optional category code the spend promotes (e.g. BEST_PICTURE)", constraints: "nullable" }
      - { name: eligible_amount_cents, type: integer, source: computed, description: "Awards-body-eligible portion after category caps and disallowance rules; see calc campaign_eligible_spend" }

  - name: TalentObligation
    parent: Film
    common_fields: true
    fields:
      - { name: film_id, type: string, source: input, description: "FK -> Film.id" }
      - { name: campaign_id, type: string, source: input, description: "FK -> AwardsCampaign.id this obligation supports", constraints: "nullable before campaign exists" }
      - { name: talent_name, type: string, source: input, description: "Cast/crew member name (must appear in Film.principal_cast or be the director)" }
      - { name: obligation_kind, type: enum, source: input, description: "TRAVEL | PRESS_JUNKET | SCREENING_QA | AWARDS_SHOW | PHOTO_SHOOT", constraints: "closed enum" }
      - { name: window_starts_at, type: datetime, source: input, description: "Obligation window open (UTC)" }
      - { name: window_ends_at, type: datetime, source: input, description: "Obligation window close (UTC)", constraints: "> window_starts_at" }
      - { name: city_code, type: string, source: input, description: "City where obligation occurs (NY, LA, LON, ...)" }
      - { name: status, type: enum, source: computed, description: "REQUESTED | CONFIRMED | FULFILLED | BREACHED | WAIVED" }
      - { name: conflicts_with_obligation_id, type: string, source: computed, description: "FK -> TalentObligation.id of the conflicting obligation, when a booking collides on the same talent_name with overlapping windows", constraints: "nullable" }

  - name: FilmmakerStatement
    parent: Film
    common_fields: false
    fields:
      - { name: film_id, type: string, source: system, description: "FK -> Film.id" }
      - { name: deal_id, type: string, source: system, description: "FK -> AcquisitionDeal.id" }
      - { name: period_label, type: string, source: input, description: "e.g. Q1-2027, AWARDS-2026" }
      - { name: basis, type: enum, source: input, description: "GROSS_RECEIPTS | NET_PROFITS — selects the participation waterfall variant", constraints: "closed enum" }
      - { name: gross_receipts_cents, type: integer, source: input, description: "Total receipts for the period", constraints: ">= 0" }
      - { name: distribution_fee_cents, type: integer, source: computed, description: "Distribution fee per waterfall variant" }
      - { name: recoupable_costs_cents, type: integer, source: computed, description: "P&A + acquisition price + campaign eligible spend per waterfall variant" }
      - { name: filmmaker_participation_cents, type: integer, source: computed, description: "Amount payable to the filmmaker this period" }
      - { name: statement_status, type: enum, source: computed, description: "ISSUED | FINAL" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:

  - entity: Film
    field: acquisition_status
    initial_state: SHOPPING
    terminal_states: [ACQUIRED, PASSED]
    transitions:
      - from: SHOPPING
        to: UNDER_NEGOTIATION
        trigger: "POST /films/{film_id}/offers — first offer on the film"
        actor: AcquisitionExec
        preconditions:
          - "Film.acquisition_status == SHOPPING"
        side_effects:
          - "Film.version increments by 1"

      - from: UNDER_NEGOTIATION
        to: UNDER_NEGOTIATION
        trigger: "POST /films/{film_id}/offers/{offer_id}/counter — negotiation round cycle"
        actor: AcquisitionExec
        preconditions:
          - "Offer.status == OPEN"
          - "Offer.expiry_at > logical clock (else offer auto-EXPIRED on read)"
        side_effects:
          - "Offer.status -> COUNTERED; a new OPEN AcquisitionOffer row is minted with round_number = prior round_number + 1"
          - "Film.version increments by 1"
        note: "Cyclic loop on UNDER_NEGOTIATION; round_number is monotonic"

      - from: UNDER_NEGOTIATION
        to: ACQUIRED
        trigger: "POST /films/{film_id}/offers/{offer_id}/accept"
        actor: AcquisitionExec
        preconditions:
          - "Offer.status == OPEN"
          - "Offer.expiry_at > logical clock"
          - "expected_film_version matches Film.version (OCC)"
          - "No other AcquisitionDeal for this film in {EXECUTED, IN_RELEASE}"
        side_effects:
          - "Offer.status -> ACCEPTED"
          - "All sibling OPEN offers on the same film -> REJECTED"
          - "AcquisitionDeal created (status EXECUTED), fields copied from the accepted offer"
          - "For each requested_territory_codes × requested_windows pair, a RightsGrant is created (status GRANTED) with window_starts_at = deal close instant, window_ends_at = close + 10 years"
          - "Film.release_posture PRE_ACQUISITION -> PREMIERE_LOCKED is NOT automatic; release_posture moves when a PremiereSlot is booked"
          - "Film.awards_posture -> ELIGIBLE if any RightsGrant.window == THEATRICAL"
          - "Film.version increments by 1"

      - from: SHOPPING
        to: PASSED
        trigger: "POST /films/{film_id}/pass"
        actor: AcquisitionExec
        preconditions:
          - "Film.acquisition_status == SHOPPING"
          - "No AcquisitionOffer in OPEN status exists for this film"
        side_effects:
          - "Film.version increments by 1"

      - from: UNDER_NEGOTIATION
        to: SHOPPING
        trigger: "system — last OPEN offer on this film transitions to WITHDRAWN or EXPIRED and no ACCEPTED deal exists"
        actor: system
        preconditions:
          - "No remaining OPEN offers on the film"
        side_effects:
          - "Film.version increments by 1"
        note: "Revert loop — negotiation collapse returns the film to SHOPPING"

  - entity: Film
    field: release_posture
    initial_state: PRE_ACQUISITION
    terminal_states: [ARCHIVED]
    transitions:
      - from: PRE_ACQUISITION
        to: PREMIERE_LOCKED
        trigger: "system — first PremiereSlot on this Film transitions to BOOKED"
        actor: system
        preconditions:
          - "Film.acquisition_status == ACQUIRED"
        side_effects: []

      - from: PREMIERE_LOCKED
        to: PLATFORM
        trigger: "POST /films/{film_id}/release-plans/{plan_id}/open"
        actor: DistributionExec
        preconditions:
          - "ReleasePlan.status == DRAFT"
          - "Film.acquisition_status == ACQUIRED"
          - "At least one PremiereSlot on this film has status == BOOKED"
          - "ReleasePlan.opening_weekend_date >= the earliest BOOKED PremiereSlot.screening_starts_at"
        side_effects:
          - "ReleasePlan.status -> OPENED"
          - "Film.version increments by 1"

      - from: PLATFORM
        to: EXPANDING
        trigger: "system — any MarketScreening.per_screen_avg_cents >= ReleasePlan.expansion_threshold_psa_cents on weekend_index == current_weekend"
        actor: system
        preconditions:
          - "ReleasePlan.platform_strategy != WIDE_DIRECT"
        side_effects:
          - "ReleasePlan.status -> EXPANDING"
          - "Triggering MarketScreening.status -> EXPANSION_TRIGGERED"

      - from: EXPANDING
        to: WIDE
        trigger: "system — ReleasePlan.current_screen_count >= 600 screens (cumulative across non-PULLED MarketScreenings)"
        actor: system
        preconditions: []
        side_effects:
          - "ReleasePlan.status -> WIDE"
          - "Film.release_posture -> WIDE"

      - from: WIDE
        to: HOME_WINDOW
        trigger: "system — logical clock reaches the earliest RightsGrant with window == HOME_ENT and status == GRANTED's window_starts_at"
        actor: system
        preconditions:
          - "Film.acquisition_status == ACQUIRED"
          - "A HOME_ENT RightsGrant exists in GRANTED status"
        side_effects: []

      - from: HOME_WINDOW
        to: ARCHIVED
        trigger: "POST /films/{film_id}/archive"
        actor: DistributionExec
        preconditions:
          - "Film.release_posture == HOME_WINDOW"
          - "No ReleasePlan for this film in {OPENED, EXPANDING}"
          - "All AwardsCampaigns for this film in CONCLUDED status"
        side_effects:
          - "Film.version increments by 1"

  - entity: Film
    field: awards_posture
    initial_state: INELIGIBLE
    terminal_states: [CONCLUDED]
    transitions:
      - from: INELIGIBLE
        to: ELIGIBLE
        trigger: "system — Film acquisition accept grants a THEATRICAL RightsGrant"
        actor: system
        preconditions: []
        side_effects: []

      - from: ELIGIBLE
        to: CAMPAIGNING
        trigger: "system — first AwardsCampaign on this film transitions to ACTIVE"
        actor: system
        preconditions: []
        side_effects: []

      - from: CAMPAIGNING
        to: SUBMITTED
        trigger: "system — every ACTIVE AwardsCampaign on the film has transitioned to SUBMITTED"
        actor: system
        preconditions: []
        side_effects: []

      - from: SUBMITTED
        to: CONCLUDED
        trigger: "system — every SUBMITTED AwardsCampaign transitions to CONCLUDED"
        actor: system
        preconditions: []
        side_effects: []

  - entity: PremiereSlot
    field: status
    initial_state: OPEN
    terminal_states: [BOOKED, CANCELLED]
    transitions:
      - from: OPEN
        to: HELD
        trigger: "POST /festivals/{festival_id}/premiere-slots/{slot_id}/hold"
        actor: FestivalProgrammer
        preconditions:
          - "PremiereSlot.status == OPEN"
          - "Film exists (payload film_id)"
        side_effects:
          - "PremiereSlot.film_id set"
          - "cachet_score recomputed"

      - from: HELD
        to: BOOKED
        trigger: "POST /festivals/{festival_id}/premiere-slots/{slot_id}/book"
        actor: FestivalProgrammer
        preconditions:
          - "PremiereSlot.status == HELD"
          - "Film.acquisition_status == ACQUIRED"
          - "No other BOOKED PremiereSlot on the same Film whose screening interval overlaps this slot's interval (same-film double-booking)"
          - "No other BOOKED PremiereSlot at the same Festival whose screening interval overlaps this slot's interval (festival-venue conflict)"
        side_effects:
          - "Film.release_posture PRE_ACQUISITION -> PREMIERE_LOCKED (idempotent)"
          - "cachet_score recomputed and frozen"

      - from: HELD
        to: OPEN
        trigger: "POST /festivals/{festival_id}/premiere-slots/{slot_id}/release-hold or system — hold timeout (logical clock > hold expiry)"
        actor: "FestivalProgrammer or system"
        preconditions: []
        side_effects:
          - "PremiereSlot.film_id cleared"
          - "cachet_score reset to 0"

      - from: [OPEN, HELD]
        to: CANCELLED
        trigger: "POST /festivals/{festival_id}/premiere-slots/{slot_id}/cancel"
        actor: FestivalProgrammer
        preconditions: []
        side_effects: []

  - entity: AcquisitionOffer
    field: status
    initial_state: OPEN
    terminal_states: [ACCEPTED, REJECTED, WITHDRAWN, EXPIRED]
    transitions:
      - from: OPEN
        to: COUNTERED
        trigger: "POST /films/{film_id}/offers/{offer_id}/counter"
        actor: AcquisitionExec
        preconditions:
          - "Offer.status == OPEN"
          - "Offer.expiry_at > logical clock"
        side_effects:
          - "New OPEN offer minted on the same film with round_number + 1 (cyclic negotiation)"
          - "If new offer is the only OPEN offer and Film.acquisition_status was SHOPPING, film -> UNDER_NEGOTIATION"

      - from: OPEN
        to: ACCEPTED
        trigger: "POST /films/{film_id}/offers/{offer_id}/accept"
        actor: AcquisitionExec
        preconditions:
          - "Offer.status == OPEN"
          - "Offer.expiry_at > logical clock"
          - "expected_film_version == Film.version (OCC)"
        side_effects:
          - "Sibling OPEN offers on the film -> REJECTED"
          - "AcquisitionDeal created"
          - "RightsGrants created per territory × window"
          - "Film.acquisition_status -> ACQUIRED"
          - "Film.awards_posture -> ELIGIBLE if THEATRICAL window present"

      - from: OPEN
        to: REJECTED
        trigger: "POST /films/{film_id}/offers/{offer_id}/reject or system — sibling offer accepted"
        actor: "AcquisitionExec or system"
        preconditions: []
        side_effects:
          - "If this rejection leaves no OPEN offers AND no ACCEPTED deal exists on the film, Film.acquisition_status UNDER_NEGOTIATION -> SHOPPING"

      - from: OPEN
        to: WITHDRAWN
        trigger: "POST /films/{film_id}/offers/{offer_id}/withdraw"
        actor: AcquisitionExec
        preconditions:
          - "Offer.status == OPEN"
        side_effects:
          - "If this leaves no OPEN offers on the film AND no ACCEPTED deal, film -> SHOPPING"

      - from: OPEN
        to: EXPIRED
        trigger: "system — logical clock reaches Offer.expiry_at; evaluated lazily on read/write of the offer"
        actor: system
        preconditions: []
        side_effects:
          - "If this leaves no OPEN offers on the film AND no ACCEPTED deal, film -> SHOPPING"

  - entity: ReleasePlan
    field: status
    initial_state: DRAFT
    terminal_states: [WIDE, PULLED]
    transitions:
      - from: DRAFT
        to: OPENED
        trigger: "POST /films/{film_id}/release-plans/{plan_id}/open"
        actor: DistributionExec
        preconditions:
          - "ReleasePlan.status == DRAFT"
          - "Film.acquisition_status == ACQUIRED"
          - "At least one BOOKED PremiereSlot for the film"
          - "opening_weekend_date >= earliest BOOKED slot's screening_starts_at"
        side_effects:
          - "Film.release_posture PREMIERE_LOCKED -> PLATFORM"
          - "Initial MarketScreening rows (weekend_index=1, status SCHEDULED) are minted for each target_market_codes entry"

      - from: OPENED
        to: EXPANDING
        trigger: "system — per-screen threshold breach (see calc platform_expansion)"
        actor: system
        preconditions: []
        side_effects:
          - "Triggering MarketScreening.status REPORTED -> EXPANSION_TRIGGERED"

      - from: EXPANDING
        to: WIDE
        trigger: "system — current_screen_count >= 600"
        actor: system
        preconditions: []
        side_effects:
          - "Film.release_posture PLATFORM/EXPANDING -> WIDE"

      - from: [OPENED, EXPANDING]
        to: PULLED
        trigger: "POST /films/{film_id}/release-plans/{plan_id}/pull"
        actor: DistributionExec
        preconditions:
          - "All MarketScreenings for this plan have weekend_index <= current_weekend (no future weekends scheduled)"
        side_effects:
          - "ReleasePlan.status -> PULLED"
          - "Future SCHEDULED MarketScreenings -> PULLED"

  - entity: MarketScreening
    field: status
    initial_state: SCHEDULED
    terminal_states: [REPORTED, EXPANSION_TRIGGERED, PULLED]
    transitions:
      - from: SCHEDULED
        to: REPORTED
        trigger: "POST /release-plans/{plan_id}/market-screenings/{screening_id}/report"
        actor: DistributionExec
        preconditions:
          - "MarketScreening.status == SCHEDULED"
          - "ReleasePlan.status in {OPENED, EXPANDING}"
        side_effects:
          - "per_screen_avg_cents computed"
          - "ReleasePlan.cumulative_gross_cents and current_screen_count recomputed"
          - "If per_screen_avg_cents >= ReleasePlan.expansion_threshold_psa_cents AND ReleasePlan.platform_strategy != WIDE_DIRECT: ReleasePlan OPENED -> EXPANDING, this screening -> EXPANSION_TRIGGERED"

      - from: REPORTED
        to: EXPANSION_TRIGGERED
        trigger: "system — part of platform_expansion cascade"
        actor: system
        preconditions: []
        side_effects: []

      - from: SCHEDULED
        to: PULLED
        trigger: "system — parent ReleasePlan pulled"
        actor: system
        preconditions: []
        side_effects: []

  - entity: AwardsCampaign
    field: status
    initial_state: PLANNING
    terminal_states: [CONCLUDED]
    transitions:
      - from: PLANNING
        to: ACTIVE
        trigger: "POST /films/{film_id}/awards-campaigns/{campaign_id}/activate"
        actor: AwardsStrategist
        preconditions:
          - "AwardsCampaign.status == PLANNING"
          - "Film.acquisition_status == ACQUIRED"
          - "Film.release_posture in {PREMIERE_LOCKED, PLATFORM, EXPANDING, WIDE} — campaign cannot activate before premiere or after archive"
          - "target_categories non-empty"
          - "budget_total_cents > 0"
        side_effects:
          - "Film.awards_posture ELIGIBLE -> CAMPAIGNING (idempotent)"

      - from: ACTIVE
        to: SUBMITTED
        trigger: "POST /films/{film_id}/awards-campaigns/{campaign_id}/submit"
        actor: AwardsStrategist
        preconditions:
          - "AwardsCampaign.status == ACTIVE"
          - "Every TalentObligation tied to this campaign is in {FULFILLED, WAIVED} — outstanding REQUESTED/CONFIRMED block submission"
        side_effects:
          - "When the last ACTIVE campaign on the film submits, Film.awards_posture CAMPAIGNING -> SUBMITTED"

      - from: SUBMITTED
        to: CONCLUDED
        trigger: "POST /films/{film_id}/awards-campaigns/{campaign_id}/conclude"
        actor: AwardsStrategist
        preconditions:
          - "AwardsCampaign.status == SUBMITTED"
        side_effects:
          - "When the last SUBMITTED campaign on the film concludes, Film.awards_posture SUBMITTED -> CONCLUDED"
          - "Deal.pa_spent_awards_cents frozen at this point"

  - entity: TalentObligation
    field: status
    initial_state: REQUESTED
    terminal_states: [FULFILLED, BREACHED, WAIVED]
    transitions:
      - from: REQUESTED
        to: CONFIRMED
        trigger: "POST /films/{film_id}/talent-obligations/{obligation_id}/confirm"
        actor: TalentCoordinator
        preconditions:
          - "TalentObligation.status == REQUESTED"
          - "No other TalentObligation with same talent_name, status in {CONFIRMED}, and overlapping window (half-open interval)"
          - "No other TalentObligation with same talent_name and same city_code whose windows are within TRAVEL_BUFFER_HOURS hours (travel-time aggregate rule)"
        side_effects:
          - "conflicts_with_obligation_id cleared"

      - from: CONFIRMED
        to: FULFILLED
        trigger: "POST /films/{film_id}/talent-obligations/{obligation_id}/fulfill"
        actor: TalentCoordinator
        preconditions:
          - "TalentObligation.status == CONFIRMED"
          - "Logical clock >= window_ends_at"
        side_effects: []

      - from: CONFIRMED
        to: BREACHED
        trigger: "system — logical clock passes window_ends_at without a fulfill call"
        actor: system
        preconditions: []
        side_effects:
          - "If the parent AwardsCampaign is ACTIVE and any obligation becomes BREACHED, budget_publicity_cents is reduced by BREACH_PENALTY_CENTS (floor 0) and the difference is added to budget_remaining_cents"

      - from: [REQUESTED, CONFIRMED]
        to: WAIVED
        trigger: "POST /films/{film_id}/talent-obligations/{obligation_id}/waive"
        actor: AwardsStrategist
        preconditions: []
        side_effects: []

  - entity: FilmmakerStatement
    field: statement_status
    initial_state: ISSUED
    terminal_states: [FINAL]
    transitions:
      - from: ISSUED
        to: FINAL
        trigger: "POST /films/{film_id}/statements/{statement_id}/finalize"
        actor: ParticipationAccountant
        preconditions:
          - "FilmmakerStatement.statement_status == ISSUED"
          - "All CampaignSpends for any AwardsCampaign on the deal have eligible_amount_cents computed (always true; enforced by construction)"
        side_effects: []

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:

  - rule_id: offer-accept-stale-film
    parent_entity: Film
    write_endpoint: "POST /films/{film_id}/offers/{offer_id}/accept"
    occ_field: "expected_film_version"
    description: |
      Accepting an offer against a Film whose version has advanced since the
      client last observed it is rejected. This captures the case where another
      writer has just accepted a sibling offer (which under the negotiation
      protocol legitimately supersedes the in-flight accept) and the current
      writer's view of the film is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: premiere-slot-book-stale-film
    parent_entity: Film
    write_endpoint: "POST /festivals/{festival_id}/premiere-slots/{slot_id}/book"
    occ_field: "expected_film_version"
    description: |
      Booking a premiere slot whose held film's version has advanced since the
      client last observed it is rejected. This captures the case where another
      writer has just booked a competing slot for the same film (which under
      the premiere-strategy protocol supersedes the in-flight booking) and the
      current writer's view of the film is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:

  - name: premiere_cachet
    trigger: "PremiereSlot transitions OPEN->HELD and HELD->BOOKED; also on Festival.prestige_tier edit while slot is HELD"
    algorithm: weighted_scoring
    formula: |
      base = PRESTIGE_POINTS[Festival.prestige_tier]
      section_bonus = SECTION_BONUS[PremiereSlot.section]
      embargo_delay_hours = (PremiereSlot.review_embargo_lifts_at - PremiereSlot.screening_ends_at) in whole hours
      embargo_multiplier =
        1.25 if embargo_delay_hours <= 12
        1.00 if 12 < embargo_delay_hours <= 48
        0.75 if embargo_delay_hours > 48
      cachet_score = round_half_up((base + section_bonus) * embargo_multiplier)
    constants:
      PRESTIGE_POINTS: { A_LIST: 100, B_LIST: 60, REGIONAL: 30 }
      SECTION_BONUS: { COMPETITION: 40, PREMIERES: 25, MIDNIGHT: 15, NEXT: 10 }
    precision: "integer, round_half_up"
    input_set: "the slot's own festival prestige_tier + section + embargo timing"
    variants:
      - name: provisional
        when: "PremiereSlot.status == HELD"
        difference: "computed with current Festival.prestige_tier; may drift if the festival row is edited"
      - name: locked
        when: "PremiereSlot.status == BOOKED"
        difference: "frozen at book time; subsequent Festival edits do NOT recompute"

  - name: platform_expansion
    trigger: "MarketScreening REPORTED transition"
    algorithm: threshold
    formula: |
      per_screen_avg_cents = round_half_up(weekend_gross_cents / screen_count)
      if per_screen_avg_cents >= ReleasePlan.expansion_threshold_psa_cents
         AND ReleasePlan.platform_strategy != WIDE_DIRECT
         AND ReleasePlan.status == OPENED:
            ReleasePlan.status -> EXPANDING
            this MarketScreening.status -> EXPANSION_TRIGGERED
      if ReleasePlan.status == EXPANDING
         AND sum(screen_count over non-PULLED MarketScreenings of this plan) >= 600:
            ReleasePlan.status -> WIDE
            Film.release_posture -> WIDE
    constants:
      WIDE_SCREEN_THRESHOLD: 600
    precision: "integer cents; boundary uses >= on per-screen average AND >= on screen count"
    input_set: "MarketScreening rows on this ReleasePlan with status != PULLED"
    variants: []

  - name: campaign_eligible_spend
    trigger: "CampaignSpend create"
    algorithm: constraint_propagation
    formula: |
      eligible = CampaignSpend.amount_cents
      cap_pct = CAP_PCT[CampaignSpend.category]
      cap = round_half_up(AwardsCampaign.budget_total_cents * cap_pct)
      already = sum(eligible_amount_cents over prior CampaignSpends on this campaign with same category)
      if already + eligible > cap:
          eligible = max(0, cap - already)
      if AwardsCampaign.awards_body == INDEPENDENT_SPIRIT and CampaignSpend.category == TRAVEL:
          eligible = min(eligible, INDIE_TRAVEL_CAP_CENTS)
      eligible_amount_cents = eligible
    constants:
      CAP_PCT: { SCREENING: 0.40, GUILD_MAILER: 0.25, PUBLICITY: 0.30, TRAVEL: 0.15, EVENT: 0.20 }
      INDIE_TRAVEL_CAP_CENTS: 25000000
    precision: "integer cents, round_half_up on the cap computation"
    input_set: "prior CampaignSpend rows on the same AwardsCampaign, processed in created_at ASC order"
    variants: []

  - name: participation_waterfall
    trigger: "FilmmakerStatement create"
    algorithm: waterfall_allocation
    formula: |
      # Common inputs
      G = FilmmakerStatement.gross_receipts_cents
      deal = AcquisitionDeal(FilmmakerStatement.deal_id)
      film = Film(deal.film_id)
      pct = deal.backend_participation_pct

      # Variant A — GROSS_RECEIPTS basis (off-the-top, no cost recoupment)
      if basis == GROSS_RECEIPTS:
          distribution_fee_cents = round_half_up(G * DIST_FEE_PCT_GROSS)
          recoupable_costs_cents = 0
          filmmaker_participation_cents =
              round_half_up((G - distribution_fee_cents) * pct)

      # Variant B — NET_PROFITS basis (recoup acquisition + P&A + eligible campaign spend first)
      if basis == NET_PROFITS:
          distribution_fee_cents = round_half_up(G * DIST_FEE_PCT_NET)
          awards_eligible_total = sum(CampaignSpend.eligible_amount_cents
                                      over every AwardsCampaign on this deal)
          recoupable_costs_cents = (
              deal.upfront_price_cents
              + film.production_budget_cents
              + deal.pa_spent_theatrical_cents
              + awards_eligible_total
          )
          net = G - distribution_fee_cents - recoupable_costs_cents
          if net <= 0:
              filmmaker_participation_cents = 0
          else:
              filmmaker_participation_cents = round_half_up(net * pct)
    constants:
      DIST_FEE_PCT_GROSS: 0.15
      DIST_FEE_PCT_NET: 0.30
    precision: "integer cents, round_half_up at each step; evaluation order pinned: fee first, then costs, then participation"
    input_set: "AcquisitionDeal row, parent Film, all CampaignSpend rows across all AwardsCampaigns tied to the deal"
    variants:
      - name: gross_receipts_basis
        when: "FilmmakerStatement.basis == GROSS_RECEIPTS"
        difference: "15% distribution fee, no cost recoupment, filmmaker paid off the top"
      - name: net_profits_basis
        when: "FilmmakerStatement.basis == NET_PROFITS"
        difference: "30% distribution fee, full cost recoupment, filmmaker paid only on positive net"

  - name: deal_pa_reconciliation
    trigger: "CampaignSpend create (category in {SCREENING, GUILD_MAILER, PUBLICITY}) AND whenever AwardsCampaign transitions to CONCLUDED"
    algorithm: aggregation
    formula: |
      pa_spent_awards_cents = sum(amount_cents over CampaignSpends on AwardsCampaigns tied to this deal)
      pa_spent_theatrical_cents: minted from explicit DistributionExec-reported theatrical spend entries
                                  on the deal (separate field updated via PATCH /deals/{deal_id}/report-theatrical-spend)
      pa_shortfall_cents = max(0, prints_advertising_commit_cents
                                - (pa_spent_theatrical_cents + pa_spent_awards_cents))
    constants: {}
    precision: "integer cents"
    input_set: "CampaignSpend rows on campaigns tied to this deal, all statuses"
    variants: []

  - name: talent_travel_conflict
    trigger: "TalentObligation CONFIRMED transition"
    algorithm: interval_merge
    formula: |
      Half-open interval overlap:
        A overlaps B iff A.window_starts_at < B.window_ends_at AND B.window_starts_at < A.window_ends_at
      Direct overlap rule:
        Reject if any other TalentObligation with the same talent_name, status == CONFIRMED,
        and overlapping window (half-open) exists.
      Travel-buffer aggregate rule (different interval semantics):
        For any other CONFIRMED obligation B with same talent_name AND same city_code:
          Reject if 0 < gap_hours(A, B) < TRAVEL_BUFFER_HOURS,
          where gap_hours(A,B) = max(0, (later.window_starts_at - earlier.window_ends_at) / 3600)
          Adjacent obligations (gap == 0) are permitted in the same city.
          Adjacent obligations in different cities are NOT covered by this rule
          (they fall under direct overlap only).
      On rejection, the new obligation stays REQUESTED and conflicts_with_obligation_id is set.
    constants:
      TRAVEL_BUFFER_HOURS: 6
    precision: "whole hours, floor division"
    input_set: "TalentObligations with same talent_name and status == CONFIRMED"
    variants: []

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:

  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present; role is one of the declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "Caller role is permitted for this endpoint per §1.7 RBAC"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "Path-segment ids (left-to-right: film, festival, slot, offer, plan, screening, campaign, obligation, statement) resolve to existing rows"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with path ids"

  - priority: 4
    category: existence
    check: "Request-body foreign keys resolve (deal_id, source_offer_id, campaign_id, etc.)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "endpoints taking body FKs"

  - priority: 5
    category: state
    check: "Target resource in a state that permits the requested transition"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action endpoints (accept, counter, book, open, activate, submit, conclude, confirm, fulfill, report, ...)"

  - priority: 6
    category: business_safety
    check: "Segregation-of-duties: the X-User-ID that created an AcquisitionOffer cannot be the one to accept it; the X-User-ID that created an AwardsCampaign cannot be the one to submit it"
    error_id: ERR_DUTY_SEPARATION_VIOLATION
    http_status: 403
    applies_to: "POST /films/{film_id}/offers/{offer_id}/accept, POST /films/{film_id}/awards-campaigns/{campaign_id}/submit"

  - priority: 7
    category: business_temporal
    check: "Time-window sanity: end > start; embargo >= screening_ends_at; obligation window within logical-clock horizon; offer expiry_at > current logical clock at creation"
    error_id: ERR_INVALID_WINDOW
    http_status: 422
    applies_to: "create endpoints with windows"

  - priority: 8
    category: business_temporal
    check: "Interval overlap on resources: same-film premiere double-booking; same-festival venue overlap; talent direct overlap (half-open)"
    error_id: ERR_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST .../premiere-slots/{id}/book, POST .../talent-obligations/{id}/confirm"

  - priority: 9
    category: business_temporal
    check: "Travel-buffer aggregate rule (different-city adjacency allowed, same-city gap < TRAVEL_BUFFER_HOURS rejected)"
    error_id: ERR_TRAVEL_BUFFER_VIOLATION
    http_status: 422
    applies_to: "POST /films/{film_id}/talent-obligations/{obligation_id}/confirm"

  - priority: 10
    category: business_referential
    check: "Cross-entity state: Film.acquisition_status == ACQUIRED for slot book / campaign activate / plan open; PremiereSlot BOOKED exists before plan open; all TalentObligations FULFILLED/WAIVED before campaign submit"
    error_id: ERR_PREREQUISITE_NOT_MET
    http_status: 409
    applies_to: "multiple action endpoints"

  - priority: 11
    category: business_constraint
    check: "Rights-window scope: HOME_ENT window may only be granted on territories where Territory.is_home_ent_eligible == true"
    error_id: ERR_WINDOW_NOT_AVAILABLE
    http_status: 422
    applies_to: "POST /films/{film_id}/offers/{offer_id}/accept (rights derivation), POST /deals/{deal_id}/rights-grants"

  - priority: 12
    category: business_constraint
    check: "Category-target validity: CampaignSpend.target_category, if set, must appear in the parent AwardsCampaign.target_categories"
    error_id: ERR_CATEGORY_NOT_TARGETED
    http_status: 422
    applies_to: "POST /awards-campaigns/{campaign_id}/spends"

  - priority: 13
    category: business_fiscal
    check: "Campaign budget not exceeded: sum of CampaignSpend.amount_cents + new spend <= AwardsCampaign.budget_total_cents"
    error_id: ERR_CAMPAIGN_BUDGET_EXCEEDED
    http_status: 402
    applies_to: "POST /awards-campaigns/{campaign_id}/spends"

  - priority: 14
    category: business_fiscal
    check: "Statement non-negativity: gross_receipts_cents >= 0; participation computed never negative"
    error_id: ERR_INVALID_AMOUNT
    http_status: 422
    applies_to: "POST /films/{film_id}/statements"

  - priority: 15
    category: business_constraint
    check: "Offer-side field sanity: requested_territory_codes all resolve to Territory rows; requested_windows subset of allowed enum; runtime_minutes > 0; budget_total_cents > 0"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "create endpoints"

# =============================================================================
# §1.5 API Endpoint Table (31 endpoints)
# =============================================================================
endpoints:

  # --- Clock (test-driving) ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Advance the server's logical clock. The clock's startup default is 2026-09-01T00:00:00Z; before any set_current_utc call the logical clock reads exactly this default and MUST NOT fall back to real wall-clock time. All expiry/window logic evaluates against this clock."
    roles: [PlatformAdmin]
    code: 200
    input: [current_utc]
    output: "{ current_utc: string }"
    side_effects:
      - "Re-evaluate lazy transitions that depend on the clock (offer EXPIRED, obligation BREACHED, release_posture HOME_WINDOW promotion)"

  # --- Films ---
  - method: POST
    path: "/films"
    description: "Register a finished film being shopped"
    roles: [PlatformAdmin]
    code: 201
    input: [title, director_name, principal_cast, genre, runtime_minutes, production_budget_cents]
    output: Film
    side_effects: ["acquisition_status=SHOPPING, release_posture=PRE_ACQUISITION, awards_posture=INELIGIBLE"]

  - method: GET
    path: "/films/{film_id}"
    description: "Read a film"
    roles: [PlatformAdmin, AcquisitionExec, FestivalProgrammer, DistributionExec, AwardsStrategist, TalentCoordinator, ParticipationAccountant]
    code: 200
    input: []
    output: Film
    side_effects: []

  - method: GET
    path: "/films"
    description: "List films"
    roles: [PlatformAdmin, AcquisitionExec, FestivalProgrammer, DistributionExec, AwardsStrategist, TalentCoordinator, ParticipationAccountant]
    code: 200
    input: ["acquisition_status?", "release_posture?", "genre?", "limit?", "offset?"]
    output: "Film[]"
    side_effects: []

  - method: GET
    path: "/films/{film_id}/premiere-slots"
    description: "Reverse-lookup: list premiere slots held/booked for a film"
    roles: [PlatformAdmin, AcquisitionExec, FestivalProgrammer, DistributionExec]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "PremiereSlot[]"
    side_effects: []

  - method: POST
    path: "/films/{film_id}/pass"
    description: "Pass on a film (no further negotiation)"
    roles: [AcquisitionExec]
    code: 200
    input: []
    output: Film
    side_effects: ["acquisition_status -> PASSED", "increments Film.version by 1"]

  - method: POST
    path: "/films/{film_id}/archive"
    description: "Archive a film once home-window reached and awards concluded"
    roles: [DistributionExec]
    code: 200
    input: []
    output: Film
    side_effects: ["release_posture -> ARCHIVED", "increments Film.version by 1"]

  # --- Offers (negotiation) ---
  - method: POST
    path: "/films/{film_id}/offers"
    description: "Open a new acquisition offer on a film"
    roles: [AcquisitionExec]
    code: 201
    input: [buyer_code, upfront_price_cents, backend_participation_pct, prints_advertising_commit_cents, requested_territory_codes, requested_windows, expiry_at]
    output: AcquisitionOffer
    side_effects:
      - "status=OPEN; round_number=1 if first offer, else max(existing round_number) + 1"
      - "If first OPEN offer on the film: acquisition_status SHOPPING -> UNDER_NEGOTIATION"
      - "increments Film.version by 1"

  - method: GET
    path: "/films/{film_id}/offers"
    description: "List offers on a film"
    roles: [AcquisitionExec, PlatformAdmin, ParticipationAccountant]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "AcquisitionOffer[]"
    side_effects: []

  - method: GET
    path: "/films/{film_id}/offers/{offer_id}"
    description: "Read one offer"
    roles: [AcquisitionExec, PlatformAdmin, ParticipationAccountant]
    code: 200
    input: []
    output: AcquisitionOffer
    side_effects: []

  - method: POST
    path: "/films/{film_id}/offers/{offer_id}/counter"
    description: "Counter an open offer; mints the next round as a fresh OPEN offer"
    roles: [AcquisitionExec]
    code: 201
    input: [buyer_code, upfront_price_cents, backend_participation_pct, prints_advertising_commit_cents, requested_territory_codes, requested_windows, expiry_at]
    output: AcquisitionOffer
    side_effects:
      - "Original offer -> COUNTERED; new offer minted with round_number = prior + 1"
      - "increments Film.version by 1"

  - method: POST
    path: "/films/{film_id}/offers/{offer_id}/accept"
    description: "Accept an open offer; closes the deal, grants rights, rejects sibling opens"
    roles: [AcquisitionExec]
    code: 201
    input: [expected_film_version]
    output: AcquisitionDeal
    side_effects:
      - "Offer -> ACCEPTED; sibling OPEN offers -> REJECTED"
      - "AcquisitionDeal created (status EXECUTED)"
      - "RightsGrant created for each requested_territory × requested_window (status GRANTED)"
      - "Film.acquisition_status -> ACQUIRED"
      - "Film.awards_posture -> ELIGIBLE if any THEATRICAL window granted"
      - "increments Film.version by 1"

  - method: POST
    path: "/films/{film_id}/offers/{offer_id}/reject"
    description: "Reject an open offer"
    roles: [AcquisitionExec]
    code: 200
    input: []
    output: AcquisitionOffer
    side_effects:
      - "Offer -> REJECTED"
      - "If no OPEN offers remain on the film AND no deal exists: acquisition_status UNDER_NEGOTIATION -> SHOPPING"
      - "increments Film.version by 1"

  - method: POST
    path: "/films/{film_id}/offers/{offer_id}/withdraw"
    description: "Withdraw an open offer"
    roles: [AcquisitionExec]
    code: 200
    input: []
    output: AcquisitionOffer
    side_effects:
      - "Offer -> WITHDRAWN"
      - "If no OPEN offers remain AND no deal exists: acquisition_status UNDER_NEGOTIATION -> SHOPPING"
      - "increments Film.version by 1"

