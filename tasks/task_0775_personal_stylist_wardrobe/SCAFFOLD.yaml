scenario: "775. Personal Stylist & Wardrobe Consulting (in-person): client profile & style assessment, closet-audit & shopping session, per-hour/package & retail markup/commission, lookbook & outfit delivery, seasonal refresh & subscription, virtual styling, event/special-occasion, referral"
domain_name: "personal-stylist-wardrobe"
api_prefix: "/styling"

complexity_profile:
  primary_archetype: "Pricing engine"
  secondary_archetype: "Temporal windowing"
  complexity_layers:
    - "Dual-variant calculation"        # provisional (scheduled) vs final (actual) session charge; estimated vs realized referral credit
    - "Cascading side effects"          # session complete -> engagement fulfilled -> lookbook auto-created; invoice paid -> referral credited -> referrer wallet
    - "Optimistic concurrency"          # OCC on Engagement.version when scheduling sessions against a finite prepaid package
    - "Derived field reconciliation"    # engagement hours ledger; engagement.retail_spend_cents; client.wallet_credit_cents; stylist.earned_commission_cents

  entity_topology: hybrid
  # Engagement is the hub aggregate (owns sessions, lookbooks, invoices under nested paths);
  # Client / Stylist / Subscription / Referral are peers linked by flat FK references.

  state_machine_shape: cyclic
  # Session (reschedule loop) and Lookbook (revision loop) are cyclic; Engagement bubbles up to FULFILLED.

  relationship_patterns:
    - one_to_many        # Client -> Engagements; Engagement -> Sessions/Lookbooks/Invoices; Session -> PurchaseItems
    - cross_aggregate    # Referral.qualifying_invoice_id -> Invoice; Session overlap checks read sibling Engagements' stylist/client
    - self_referential   # Referral links referrer_client_id and referee_client_id, both -> Client

  role_model: peer_roles
  # Stylist owns delivery-side operations (assessment completion, session confirm/complete, purchases, lookbooks);
  # Client owns demand-side operations (engagements, session scheduling, lookbook acceptance, subscriptions, referrals, payment);
  # PlatformAdmin is an operational superuser for provisioning, billing issuance, wallet adjustments, and the clock.

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# ─────────────────────────────────────────────────────────────────────────────
# §1.1 Entity-Relationship Table
# ─────────────────────────────────────────────────────────────────────────────
entities:
  - name: Client
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: "Client display name."
      - name: email
        type: string
        source: input
        description: "Client contact email; unique across Clients."
        constraints: "unique"
      - name: wallet_credit_cents
        type: integer
        source: computed
        description: "Store credit balance in cents. Credited by referral rewards and admin adjustments; debited by subscription activation fees and invoice payment. Never negative."
        default: 0
        constraints: ">= 0"
      - name: has_paid_invoice
        type: boolean
        source: computed
        description: "True once this client has at least one Invoice in PAID status. Used to gate referral qualification to the referee's FIRST paid invoice."
        default: false
      - name: status
        type: enum
        source: system
        description: "Lifecycle flag; all registered clients are ACTIVE (no suspension workflow in this system)."
        default: ACTIVE
        constraints: "ACTIVE"

  - name: Stylist
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: "Stylist display name."
      - name: email
        type: string
        source: input
        description: "Stylist contact email; unique across Stylists."
        constraints: "unique"
      - name: commission_pct
        type: number
        source: input
        description: "Fraction (0..1) of the retail markup MARGIN this stylist earns on each purchased item."
        constraints: "0 <= commission_pct <= 1"
      - name: tier
        type: enum
        source: input
        description: "Seniority tier (informational; does not alter pricing)."
        constraints: "JUNIOR | SENIOR | LEAD"
      - name: earned_commission_cents
        type: integer
        source: computed
        description: "Running total of commission earned across all PURCHASED items on this stylist's engagements. Reversed when an item is returned."
        default: 0
      - name: status
        type: enum
        source: system
        description: "Lifecycle flag; created stylists are ACTIVE (no deactivation workflow in this system)."
        default: ACTIVE
        constraints: "ACTIVE"

  - name: StyleAssessment
    parent: Client
    common_fields: true
    fields:
      - name: client_id
        type: string
        source: input
        description: "FK -> Client.id; the client this style profile belongs to."
      - name: body_type
        type: string
        source: input
        description: "Free-text body-shape descriptor captured at intake."
      - name: color_palette
        type: enum
        source: input
        description: "Seasonal color palette result of the assessment."
        constraints: "WARM | COOL | NEUTRAL"
      - name: budget_band
        type: enum
        source: input
        description: "Client shopping budget band captured at intake."
        constraints: "ECONOMY | MID | PREMIUM | LUXURY"
      - name: lifestyle
        type: string
        source: input
        description: "Free-text lifestyle / occasion notes."
      - name: status
        type: enum
        source: system
        description: "DRAFT on creation; COMPLETED once the stylist finalizes the profile. A COMPLETED assessment is a precondition for confirming any session for this client."
        default: DRAFT
        constraints: "DRAFT | COMPLETED"

  - name: Engagement
    parent: Client
    common_fields: true
    fields:
      - name: client_id
        type: string
        source: input
        description: "FK -> Client.id; the client who owns this engagement."
      - name: stylist_id
        type: string
        source: input
        description: "FK -> Stylist.id; the stylist assigned to this engagement."
      - name: mode
        type: enum
        source: input
        description: "HOURLY = sessions billed per 15-minute block on the invoice; PACKAGE = client prepays a finite block pool (package_blocks) that sessions reserve and consume."
        constraints: "HOURLY | PACKAGE"
      - name: block_rate_cents
        type: integer
        source: input
        description: "Price in cents of one 15-minute billing block. Used for HOURLY invoice line items and for PACKAGE overage beyond package_blocks."
        constraints: "> 0"
      - name: package_blocks
        type: integer
        source: input
        description: "PACKAGE mode only: total prepaid 15-minute blocks. Required when mode==PACKAGE, must be null/omitted when mode==HOURLY."
        default: null
        constraints: ">= 4 when present"
      - name: package_price_cents
        type: integer
        source: input
        description: "PACKAGE mode only: prepaid amount in cents for the block pool (informational; not re-billed)."
        default: null
      - name: hours_reserved_blocks
        type: integer
        source: computed
        description: "PACKAGE mode: blocks held by SCHEDULED/CONFIRMED sessions (their estimated_blocks) not yet consumed. Incremented on scheduling, decremented on cancel and on completion (moved to consumed)."
        default: 0
      - name: hours_consumed_blocks
        type: integer
        source: computed
        description: "PACKAGE mode: blocks permanently used by COMPLETED sessions (their final billable blocks)."
        default: 0
      - name: hours_available_blocks
        type: integer
        source: computed
        description: "PACKAGE mode: package_blocks - hours_reserved_blocks - hours_consumed_blocks. Conserved invariant: package_blocks == available + reserved + consumed at all times."
        default: 0
      - name: retail_spend_cents
        type: integer
        source: computed
        description: "Sum of marked_up_price_cents over this engagement's PurchaseItems currently in PURCHASED status. Decremented when an item is returned. Invariant: equals SUM(marked_up_price_cents) of PURCHASED items."
        default: 0
      - name: status
        type: enum
        source: system
        description: "DRAFT -> ACTIVE (activate) -> FULFILLED (auto, PACKAGE pool exhausted). DRAFT/ACTIVE -> CANCELLED. FULFILLED and CANCELLED are terminal."
        default: DRAFT
        constraints: "DRAFT | ACTIVE | FULFILLED | CANCELLED"

  - name: Session
    parent: Engagement
    common_fields: true
    fields:
      - name: engagement_id
        type: string
        source: input
        description: "FK -> Engagement.id; the engagement this session is booked under. The engagement supplies the acting stylist and client for overlap and ownership checks."
      - name: session_type
        type: enum
        source: input
        description: "Nature of the session."
        constraints: "CLOSET_AUDIT | SHOPPING | VIRTUAL | EVENT"
      - name: modality
        type: enum
        source: input
        description: "IN_PERSON sessions are subject to the client travel-buffer overlap rule; VIRTUAL sessions are exempt from the client buffer but still subject to stylist overlap."
        default: IN_PERSON
        constraints: "IN_PERSON | VIRTUAL"
      - name: scheduled_start
        type: datetime
        source: input
        description: "Planned start (ISO 8601 UTC)."
      - name: scheduled_end
        type: datetime
        source: input
        description: "Planned end (ISO 8601 UTC); must be strictly after scheduled_start."
      - name: estimated_blocks
        type: integer
        source: computed
        description: "Billable 15-minute blocks derived from the scheduled window: max(4, ceil((scheduled_end - scheduled_start)/15min)). Recomputed on reschedule. Drives PACKAGE reservation."
      - name: actual_minutes
        type: integer
        source: input
        description: "Actual elapsed minutes supplied at completion. Required by POST complete; ignored otherwise."
        default: null
      - name: charge_cents
        type: integer
        source: computed
        description: "PROVISIONAL charge from estimated_blocks at scheduling; recomputed as the FINAL charge from actual_minutes at completion. See calculation session_charge."
        default: 0
      - name: charge_variant
        type: enum
        source: computed
        description: "PROVISIONAL while SCHEDULED/CONFIRMED; FINAL once COMPLETED."
        default: PROVISIONAL
        constraints: "PROVISIONAL | FINAL"
      - name: status
        type: enum
        source: system
        description: "SCHEDULED -> CONFIRMED -> COMPLETED. CONFIRMED -> SCHEDULED (reschedule loop). SCHEDULED/CONFIRMED -> CANCELLED. COMPLETED and CANCELLED are terminal."
        default: SCHEDULED
        constraints: "SCHEDULED | CONFIRMED | COMPLETED | CANCELLED"

  - name: PurchaseItem
    parent: Session
    common_fields: true
    fields:
      - name: session_id
        type: string
        source: input
        description: "FK -> Session.id; the SHOPPING session during which this item was purchased."
      - name: description
        type: string
        source: input
        description: "Item description."
      - name: retail_cost_cents
        type: integer
        source: input
        description: "Raw retailer cost in cents before markup."
        constraints: "> 0"
      - name: markup_pct
        type: number
        source: computed
        description: "Tier-selected markup fraction: retail<5000 -> 0.30; 5000<=retail<20000 -> 0.20; retail>=20000 -> 0.10."
      - name: marked_up_price_cents
        type: integer
        source: computed
        description: "round_half_up(retail_cost_cents * (1 + markup_pct)). What the client is billed for the item."
      - name: commission_cents
        type: integer
        source: computed
        description: "round_half_up((marked_up_price_cents - retail_cost_cents) * stylist.commission_pct). The stylist's cut of the markup margin."
      - name: status
        type: enum
        source: system
        description: "PURCHASED on creation; RETURNED after a return (reverses engagement.retail_spend_cents and stylist.earned_commission_cents)."
        default: PURCHASED
        constraints: "PURCHASED | RETURNED"

  - name: Lookbook
    parent: Engagement
    common_fields: true
    fields:
      - name: engagement_id
        type: string
        source: input
        description: "FK -> Engagement.id; the engagement this lookbook is delivered under."
      - name: title
        type: string
        source: input
        description: "Lookbook title."
      - name: outfits
        type: array
        source: system
        description: "Appended list of outfit objects added via POST outfits."
        default: []
      - name: outfit_count
        type: integer
        source: computed
        description: "Number of outfits currently attached. A lookbook cannot be DELIVERED with outfit_count == 0."
        default: 0
      - name: revision_round
        type: integer
        source: computed
        description: "Incremented each time the client requests a revision (DELIVERED -> DRAFT)."
        default: 0
      - name: status
        type: enum
        source: system
        description: "DRAFT -> DELIVERED -> ACCEPTED (terminal). DELIVERED -> DRAFT (request-revision loop)."
        default: DRAFT
        constraints: "DRAFT | DELIVERED | ACCEPTED"

  - name: Subscription
    parent: Client
    common_fields: true
    fields:
      - name: client_id
        type: string
        source: input
        description: "FK -> Client.id; the subscriber."
      - name: tier
        type: enum
        source: input
        description: "SILVER grants 2 seasonal-refresh credits per period; GOLD grants 4."
        constraints: "SILVER | GOLD"
      - name: monthly_fee_cents
        type: integer
        source: input
        description: "Recurring fee in cents debited from the client's wallet on activation."
        constraints: "> 0"
      - name: refresh_credits_total
        type: integer
        source: computed
        description: "Set on activation from tier: SILVER -> 2, GOLD -> 4."
        default: 0
      - name: refresh_credits_remaining
        type: integer
        source: computed
        description: "Seasonal-refresh credits left in the current period. Decremented by redeem-refresh; cannot go below 0."
        default: 0
      - name: current_period_start
        type: datetime
        source: computed
        description: "Set to the logical clock at activation."
        default: null
      - name: current_period_end
        type: datetime
        source: computed
        description: "current_period_start + 90 days."
        default: null
      - name: status
        type: enum
        source: system
        description: "PENDING -> ACTIVE (activate) -> CANCELLED. ACTIVE is required to redeem refreshes."
        default: PENDING
        constraints: "PENDING | ACTIVE | CANCELLED"

  - name: Referral
    parent: null
    common_fields: true
    fields:
      - name: referrer_client_id
        type: string
        source: input
        description: "FK -> Client.id; the existing client who made the referral and receives the credit."
      - name: referee_email
        type: string
        source: input
        description: "Email of the invited prospect."
      - name: referee_client_id
        type: string
        source: computed
        description: "FK -> Client.id; the Client that signed up under this referral. Null until signup; set by POST signup."
        default: null
      - name: qualifying_invoice_id
        type: string
        source: computed
        description: "FK -> Invoice.id; the referee's first PAID invoice that triggered qualification. Null until CREDITED."
        default: null
      - name: estimated_credit_cents
        type: integer
        source: computed
        description: "Provisional projected reward set at creation = REFERRAL_ESTIMATE_CENTS flat. See calculation referral_credit variant 'estimated'."
        default: 0
      - name: realized_credit_cents
        type: integer
        source: computed
        description: "Final reward credited to the referrer at qualification = min(REFERRAL_CAP_CENTS, round_half_up(REFERRAL_RATE_PCT * qualifying_invoice.total_cents)). See calculation referral_credit variant 'realized'."
        default: 0
      - name: expires_at
        type: datetime
        source: computed
        description: "created_at + 90 days. Signup after this instant is rejected."
        default: null
      - name: status
        type: enum
        source: system
        description: "PENDING -> SIGNED_UP (signup) -> CREDITED (auto when referee's first invoice is paid)."
        default: PENDING
        constraints: "PENDING | SIGNED_UP | CREDITED"

  - name: Invoice
    parent: Engagement
    common_fields: true
    fields:
      - name: engagement_id
        type: string
        source: input
        description: "FK -> Engagement.id; the engagement being billed."
      - name: line_items
        type: array
        source: computed
        description: "Snapshot at issuance: one line per COMPLETED session (charge_cents) and one per PURCHASED item (marked_up_price_cents)."
        default: []
      - name: subtotal_cents
        type: integer
        source: computed
        description: "Sum of all line-item base amounts."
        default: 0
      - name: styling_fee_cents
        type: integer
        source: computed
        description: "Per-line styling fee: round_half_up(line * STYLING_FEE_PCT) computed PER LINE then summed (round-per-line-then-sum order is pinned; NOT round(subtotal * pct)). See calculation engagement_invoice_total."
        default: 0
      - name: volume_discount_cents
        type: integer
        source: computed
        description: "round_half_up(subtotal_cents * volume_discount_pct) where pct is a tiered breakpoint on subtotal_cents."
        default: 0
      - name: wallet_credit_applied_cents
        type: integer
        source: computed
        description: "min(client.wallet_credit_cents, subtotal + styling_fee - volume_discount) applied at issuance."
        default: 0
      - name: total_cents
        type: integer
        source: computed
        description: "subtotal_cents + styling_fee_cents - volume_discount_cents - wallet_credit_applied_cents."
        default: 0
      - name: paid_at
        type: datetime
        source: computed
        description: "Logical clock instant when the invoice was paid."
        default: null
      - name: status
        type: enum
        source: system
        description: "ISSUED on creation -> PAID (pay). Both computed at issuance; totals frozen."
        default: ISSUED
        constraints: "ISSUED | PAID"

# ─────────────────────────────────────────────────────────────────────────────
# §1.2 State Machine Table
# ─────────────────────────────────────────────────────────────────────────────
state_machines:
  - entity: StyleAssessment
    initial_state: DRAFT
    terminal_states: [COMPLETED]
    transitions:
      - from: null
        to: DRAFT
        trigger: "POST /styling/clients/{id}/assessments"
        actor: Client
        preconditions: ["referenced Client exists", "acting Client owns {id}"]
        side_effects: ["create StyleAssessment in DRAFT"]
      - from: DRAFT
        to: COMPLETED
        trigger: "POST /styling/assessments/{id}/complete"
        actor: Stylist
        preconditions: ["assessment.status == DRAFT"]
        side_effects: ["set status=COMPLETED", "unblocks confirming sessions for this client"]

  - entity: Engagement
    initial_state: DRAFT
    terminal_states: [FULFILLED, CANCELLED]
    transitions:
      - from: null
        to: DRAFT
        trigger: "POST /styling/engagements"
        actor: Client
        preconditions: ["Client exists and is acting owner", "Stylist exists", "if mode==PACKAGE then package_blocks present (>=4); if mode==HOURLY then package_blocks omitted"]
        side_effects: ["create Engagement DRAFT", "if PACKAGE: hours_available_blocks=package_blocks, reserved=0, consumed=0"]
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /styling/engagements/{id}/activate"
        actor: Client
        preconditions: ["engagement.status == DRAFT"]
        side_effects: ["set status=ACTIVE"]
      - from: ACTIVE
        to: FULFILLED
        trigger: "system (auto) on session completion when PACKAGE pool exhausted"
        actor: system
        preconditions: ["mode == PACKAGE", "after applying the completing session's consumption, hours_available_blocks == 0", "no session remains in SCHEDULED or CONFIRMED"]
        side_effects: ["set status=FULFILLED", "CASCADE link 3: auto-create one Lookbook in DRAFT (title='Final Lookbook') under this engagement for outfit delivery"]
        note: "Cascade A tail. See Session COMPLETE transition for links 1-2."
      - from: [DRAFT, ACTIVE]
        to: CANCELLED
        trigger: "POST /styling/engagements/{id}/cancel"
        actor: Client
        preconditions: ["engagement.status in {DRAFT, ACTIVE}"]
        side_effects:
          - "set status=CANCELLED"
          - "CASCADE: for each Session under this engagement in {SCHEDULED, CONFIRMED} -> set status=CANCELLED and release its estimated_blocks (hours_reserved_blocks -= estimated_blocks; hours_available_blocks += estimated_blocks)"
          - "COMPLETED sessions and their PurchaseItems are untouched"

  - entity: Session
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: null
        to: SCHEDULED
        trigger: "POST /styling/engagements/{id}/sessions"
        actor: Client
        preconditions:
          - "engagement.status == ACTIVE"
          - "scheduled_end strictly after scheduled_start"
          - "no stylist time conflict (see validation priority 13)"
          - "no client buffer conflict for IN_PERSON (see validation priority 14)"
          - "if PACKAGE: hours_available_blocks >= estimated_blocks (see validation priority 15)"
          - "OCC: expected_engagement_version == engagement.version (see concurrency_rules)"
        side_effects:
          - "compute estimated_blocks and provisional charge_cents (charge_variant=PROVISIONAL)"
          - "if PACKAGE: hours_reserved_blocks += estimated_blocks; hours_available_blocks -= estimated_blocks"
          - "increments Engagement.version by 1"
      - from: SCHEDULED
        to: CONFIRMED
        trigger: "POST /styling/sessions/{id}/confirm"
        actor: Stylist
        preconditions:
          - "session.status == SCHEDULED"
          - "the engagement's client has a StyleAssessment in COMPLETED status (cross-entity: Session depends on StyleAssessment)"
        side_effects: ["set status=CONFIRMED"]
      - from: [SCHEDULED, CONFIRMED]
        to: SCHEDULED
        trigger: "POST /styling/sessions/{id}/reschedule"
        actor: Client
        preconditions:
          - "session.status in {SCHEDULED, CONFIRMED}"
          - "new scheduled_end strictly after scheduled_start"
          - "no stylist time conflict at the new window (excluding this session)"
          - "no client buffer conflict at the new window for IN_PERSON (excluding this session)"
        side_effects:
          - "set status=SCHEDULED"
          - "recompute estimated_blocks and provisional charge_cents"
          - "if PACKAGE and estimated_blocks changed: adjust hours_reserved_blocks/available_blocks by the delta (must still satisfy availability)"
        note: "Cyclic: CONFIRMED -> SCHEDULED loop."
      - from: CONFIRMED
        to: COMPLETED
        trigger: "POST /styling/sessions/{id}/complete"
        actor: Stylist
        preconditions: ["session.status == CONFIRMED", "actual_minutes present and > 0"]
        side_effects:
          - "compute FINAL charge_cents from actual_minutes (charge_variant=FINAL); billable_blocks=max(4, ceil(actual_minutes/15))"
          - "CASCADE A link 1: if PACKAGE -> hours_reserved_blocks -= estimated_blocks; hours_consumed_blocks += billable_blocks; recompute hours_available_blocks"
          - "CASCADE A link 2: if PACKAGE and hours_available_blocks == 0 and no SCHEDULED/CONFIRMED sibling session remains -> Engagement ACTIVE->FULFILLED (which itself fires link 3, auto-creating the DRAFT Lookbook)"
      - from: [SCHEDULED, CONFIRMED]
        to: CANCELLED
        trigger: "POST /styling/sessions/{id}/cancel"
        actor: Client | Stylist
        preconditions: ["session.status in {SCHEDULED, CONFIRMED}"]
        side_effects:
          - "set status=CANCELLED"
          - "COMPENSATION (hours invariant): if PACKAGE -> hours_reserved_blocks -= estimated_blocks; hours_available_blocks += estimated_blocks (restores package_blocks == available + reserved + consumed)"

  - entity: PurchaseItem
    initial_state: PURCHASED
    terminal_states: [RETURNED]
    transitions:
      - from: null
        to: PURCHASED
        trigger: "POST /styling/sessions/{id}/items"
        actor: Stylist
        preconditions: ["session.status == CONFIRMED", "session.session_type == SHOPPING"]
        side_effects:
          - "compute markup_pct (tiered), marked_up_price_cents, commission_cents"
          - "FORWARD (money invariant): engagement.retail_spend_cents += marked_up_price_cents; stylist.earned_commission_cents += commission_cents"
      - from: PURCHASED
        to: RETURNED
        trigger: "POST /styling/purchase-items/{id}/return"
        actor: Stylist
        preconditions: ["item.status == PURCHASED"]
        side_effects:
          - "set status=RETURNED"
          - "COMPENSATION (money invariant): engagement.retail_spend_cents -= marked_up_price_cents; stylist.earned_commission_cents -= commission_cents (both conserved quantities returned to pre-purchase totals)"

  - entity: Lookbook
    initial_state: DRAFT
    terminal_states: [ACCEPTED]
    transitions:
      - from: null
        to: DRAFT
        trigger: "POST /styling/engagements/{id}/lookbooks (or auto on Engagement FULFILLED)"
        actor: Stylist | system
        preconditions: ["engagement.status in {ACTIVE, FULFILLED}"]
        side_effects: ["create Lookbook DRAFT with outfits=[], outfit_count=0, revision_round=0"]
      - from: DRAFT
        to: DELIVERED
        trigger: "POST /styling/lookbooks/{id}/deliver"
        actor: Stylist
        preconditions:
          - "lookbook.status == DRAFT"
          - "outfit_count >= 1 (empty lookbook rejected)"
          - "engagement.status in {ACTIVE, FULFILLED} (cross-entity: Lookbook depends on Engagement)"
        side_effects: ["set status=DELIVERED"]
      - from: DELIVERED
        to: ACCEPTED
        trigger: "POST /styling/lookbooks/{id}/accept"
        actor: Client
        preconditions: ["lookbook.status == DELIVERED"]
        side_effects: ["set status=ACCEPTED"]
      - from: DELIVERED
        to: DRAFT
        trigger: "POST /styling/lookbooks/{id}/request-revision"
        actor: Client
        preconditions: ["lookbook.status == DELIVERED"]
        side_effects: ["set status=DRAFT", "revision_round += 1"]
        note: "Cyclic revision loop."

  - entity: Subscription
    initial_state: PENDING
    terminal_states: [CANCELLED]
    transitions:
      - from: null
        to: PENDING
        trigger: "POST /styling/clients/{id}/subscriptions"
        actor: Client
        preconditions: ["Client exists and is acting owner"]
        side_effects: ["create Subscription PENDING"]
      - from: PENDING
        to: ACTIVE
        trigger: "POST /styling/subscriptions/{id}/activate"
        actor: PlatformAdmin
        preconditions: ["subscription.status == PENDING", "client.wallet_credit_cents >= monthly_fee_cents"]
        side_effects:
          - "set status=ACTIVE"
          - "refresh_credits_total = refresh_credits_remaining = (tier==GOLD ? 4 : 2)"
          - "current_period_start = clock; current_period_end = clock + 90 days"
          - "CASCADE: client.wallet_credit_cents -= monthly_fee_cents"
      - from: ACTIVE
        to: ACTIVE
        trigger: "POST /styling/subscriptions/{id}/redeem-refresh"
        actor: Client
        preconditions: ["subscription.status == ACTIVE", "refresh_credits_remaining >= 1"]
        side_effects: ["refresh_credits_remaining -= 1"]
        note: "Self-loop; decrements the credit counter (books a seasonal refresh slot)."
      - from: [PENDING, ACTIVE]
        to: CANCELLED
        trigger: "POST /styling/subscriptions/{id}/cancel"
        actor: Client
        preconditions: ["subscription.status in {PENDING, ACTIVE}"]
        side_effects: ["set status=CANCELLED"]

  - entity: Referral
    initial_state: PENDING
    terminal_states: [CREDITED]
    transitions:
      - from: null
        to: PENDING
        trigger: "POST /styling/referrals"
        actor: Client
        preconditions: ["referrer_client_id exists and equals acting client", "referee_email is not the referrer's own email (no self-referral)"]
        side_effects: ["create Referral PENDING", "estimated_credit_cents = REFERRAL_ESTIMATE_CENTS", "expires_at = created_at + 90 days"]
      - from: PENDING
        to: SIGNED_UP
        trigger: "POST /styling/referrals/{id}/signup"
        actor: PlatformAdmin
        preconditions:
          - "referral.status == PENDING"
          - "clock <= expires_at (else ERR_REFERRAL_EXPIRED)"
          - "referee_client_id references an existing Client (referential)"
          - "referee_client_id != referrer_client_id (no self-referral)"
        side_effects: ["set status=SIGNED_UP", "set referee_client_id"]
      - from: SIGNED_UP
        to: CREDITED
        trigger: "system (auto) when the referee client's FIRST Invoice reaches PAID"
        actor: system
        preconditions: ["referral.status == SIGNED_UP", "the paying invoice's engagement.client_id == referral.referee_client_id", "referee client had no prior PAID invoice (client.has_paid_invoice was false before this payment)"]
        side_effects:
          - "CASCADE B link 2: set status=CREDITED; set qualifying_invoice_id; realized_credit_cents = min(REFERRAL_CAP_CENTS, round_half_up(REFERRAL_RATE_PCT * invoice.total_cents))"
          - "CASCADE B link 3: referrer_client (referrer_client_id) wallet_credit_cents += realized_credit_cents"
        note: "Cascade B tail. Link 1 is Invoice ISSUED->PAID (which sets referee client's has_paid_invoice=true)."

  - entity: Invoice
    initial_state: ISSUED
    terminal_states: [PAID]
    transitions:
      - from: null
        to: ISSUED
        trigger: "POST /styling/engagements/{id}/invoices"
        actor: PlatformAdmin
        preconditions: ["engagement exists", "engagement.status in {ACTIVE, FULFILLED}"]
        side_effects:
          - "snapshot line_items from COMPLETED sessions (charge_cents) and PURCHASED items (marked_up_price_cents)"
          - "compute subtotal_cents, styling_fee_cents (round-per-line), volume_discount_cents, wallet_credit_applied_cents, total_cents"
          - "CASCADE: client.wallet_credit_cents -= wallet_credit_applied_cents"
      - from: ISSUED
        to: PAID
        trigger: "POST /styling/invoices/{id}/pay"
        actor: Client | PlatformAdmin
        preconditions: ["invoice.status == ISSUED"]
        side_effects:
          - "set status=PAID; paid_at = clock"
          - "CASCADE B link 1: if this is the client's first PAID invoice -> set client.has_paid_invoice=true, then evaluate any Referral in SIGNED_UP whose referee_client_id == this client -> fire that referral's SIGNED_UP->CREDITED transition (links 2-3)"

# ─────────────────────────────────────────────────────────────────────────────
# §1.2.1 Concurrency Rules
# ─────────────────────────────────────────────────────────────────────────────
concurrency_rules:
  - rule_id: session-schedule-stale-engagement
    parent_entity: Engagement
    write_endpoint: "POST /styling/engagements/{id}/sessions"
    occ_field: "expected_engagement_version"
    description: |
      Scheduling a new Session against a PACKAGE Engagement whose version has
      advanced since the client last read it is rejected. A prior schedule call
      legitimately reserved blocks from the finite prepaid pool and advanced the
      engagement's version; a second create still carrying the older version has
      a stale view of remaining availability and is rejected on the version
      check before any further reservation.
    error_id: ERR_STALE_ENGAGEMENT_VERSION
    http_status: 412

# ─────────────────────────────────────────────────────────────────────────────
# §1.3 Calculation Rules Table
# ─────────────────────────────────────────────────────────────────────────────
calculations:
  - name: session_charge
    trigger: "provisional at POST /engagements/{id}/sessions and reschedule; final at POST /sessions/{id}/complete"
    algorithm: threshold
    formula: |
      raw_minutes = PROVISIONAL ? (scheduled_end - scheduled_start in minutes)
                                : actual_minutes
      billable_blocks = max(4, ceil(raw_minutes / 15))     # min 4 blocks (60 min); 15-min blocks rounded UP
      charge_cents = billable_blocks * engagement.block_rate_cents
    input_set: "single Session; PROVISIONAL uses the scheduled window, FINAL uses actual_minutes at completion"
    constants:
      BILLING_BLOCK_MINUTES: 15
      MIN_BILLABLE_BLOCKS: 4
    precision: "charge_cents is an exact integer (blocks * block_rate_cents); no rounding needed"
    variants:
      - name: provisional
        when: "at scheduling / reschedule while status in {SCHEDULED, CONFIRMED}"
        difference: "raw_minutes = scheduled window; charge_variant=PROVISIONAL"
      - name: final
        when: "at completion (CONFIRMED->COMPLETED)"
        difference: "raw_minutes = actual_minutes; charge_variant=FINAL; may differ from provisional when actual duration lands in a different 15-min block"

  - name: retail_markup_and_commission
    trigger: "on POST /sessions/{id}/items (PurchaseItem creation)"
    algorithm: tiered_pricing
    formula: |
      markup_pct = retail_cost_cents < 5000  ? 0.30 :
                   retail_cost_cents < 20000 ? 0.20 : 0.10     # tier by retail band
      marked_up_price_cents = round_half_up(retail_cost_cents * (1 + markup_pct))
      commission_cents      = round_half_up((marked_up_price_cents - retail_cost_cents) * stylist.commission_pct)
    input_set: "single PurchaseItem + its session's engagement's stylist.commission_pct"
    constants:
      TIER_LOW_MAX: 5000
      TIER_MID_MAX: 20000
      MARKUP_LOW: 0.30
      MARKUP_MID: 0.20
      MARKUP_HIGH: 0.10
    precision: "2 decimal places (whole cents), round_half_up on each of marked_up_price_cents and commission_cents independently"

  - name: engagement_invoice_total
    trigger: "on POST /engagements/{id}/invoices (Invoice issuance)"
    algorithm: aggregation
    formula: |
      lines = [ each COMPLETED session.charge_cents ] ++ [ each PURCHASED item.marked_up_price_cents ]
      subtotal_cents = sum(lines)
      # PINNED ROUNDING ORDER: round the styling fee PER LINE, then sum.
      styling_fee_cents = sum( round_half_up(line * STYLING_FEE_PCT) for line in lines )
        # NOTE: this deliberately differs from round_half_up(subtotal_cents * STYLING_FEE_PCT).
      volume_discount_pct  = subtotal_cents >= 100000 ? 0.10 :
                             subtotal_cents >= 50000  ? 0.05 : 0.00
      volume_discount_cents = round_half_up(subtotal_cents * volume_discount_pct)   # single rounding on the raw subtotal
      pre_credit = subtotal_cents + styling_fee_cents - volume_discount_cents
      wallet_credit_applied_cents = min(client.wallet_credit_cents, pre_credit)
      total_cents = pre_credit - wallet_credit_applied_cents
    input_set: "COMPLETED sessions and PURCHASED items of the engagement at issuance time; excludes CANCELLED sessions and RETURNED items"
    constants:
      STYLING_FEE_PCT: 0.10
      VOLUME_TIER_1_MIN: 50000
      VOLUME_TIER_1_PCT: 0.05
      VOLUME_TIER_2_MIN: 100000
      VOLUME_TIER_2_PCT: 0.10
    precision: "whole cents, round_half_up; styling fee rounded per-line THEN summed (order is load-bearing)"

  - name: referral_credit
    trigger: "estimated at POST /referrals (creation); realized when the referee's first invoice reaches PAID"
    algorithm: threshold
    formula: |
      estimated_credit_cents = REFERRAL_ESTIMATE_CENTS                                  # flat projection at creation
      realized_credit_cents  = min(REFERRAL_CAP_CENTS,
                                    round_half_up(REFERRAL_RATE_PCT * qualifying_invoice.total_cents))
    input_set: "the Referral; realized reads the referee's FIRST PAID invoice total_cents"
    constants:
      REFERRAL_ESTIMATE_CENTS: 5000
      REFERRAL_RATE_PCT: 0.10
      REFERRAL_CAP_CENTS: 10000
    precision: "whole cents, round_half_up"
    variants:
      - name: estimated
        when: "at referral creation, before any signup or payment"
        difference: "flat REFERRAL_ESTIMATE_CENTS independent of the eventual invoice"
      - name: realized
        when: "at qualification (referee's first PAID invoice)"
        difference: "rate * actual invoice.total_cents, capped; typically differs from the flat estimate"

  - name: package_hours_ledger
    trigger: "on every PACKAGE session schedule / reschedule / cancel / complete"
    algorithm: aggregation
    formula: |
      hours_available_blocks = package_blocks - hours_reserved_blocks - hours_consumed_blocks
      # Conserved invariant (enforced after every mutation):
      # package_blocks == hours_available_blocks + hours_reserved_blocks + hours_consumed_blocks
    input_set: "all non-terminal (reserved) and COMPLETED (consumed) sessions of a PACKAGE engagement"
    constants: {}
    precision: "integer blocks; no rounding"

# ─────────────────────────────────────────────────────────────────────────────
# §1.4 Validation Rules Table (ordered by priority)
# ─────────────────────────────────────────────────────────────────────────────
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and well-formed (X-User-ID optional only for Anonymous-role endpoints)"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all except POST /styling/clients/register and POST /_clock/set_current_utc"

  - priority: 2
    category: auth
    check: "acting role is permitted for this endpoint per §1.7"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "every resource named in the path exists (validated left-to-right)"
    error_id: "ERR_<RESOURCE>_NOT_FOUND"
    http_status: 404
    applies_to: "all path-parameterized endpoints"

  - priority: 4
    category: business_referential
    check: "referenced foreign keys in the body resolve to existing entities (client_id, stylist_id, referrer_client_id, referee_client_id)"
    error_id: "ERR_<RESOURCE>_NOT_FOUND"
    http_status: 404
    applies_to: "POST /engagements, POST /referrals, POST /referrals/{id}/signup"

  - priority: 5
    category: business_constraint
    check: "acting entity_backed user owns the target: Client acts only on own engagements/sessions/subscriptions/referrals; Stylist acts only on sessions/lookbooks/items whose engagement.stylist_id == X-User-ID"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all owner-scoped mutations"

  - priority: 6
    category: business_constraint
    check: "request body is well-formed: required fields present, enums in range, ints non-negative; scheduled_end strictly after scheduled_start (ERR_INVALID_TIME_RANGE); PACKAGE requires package_blocks and HOURLY forbids it"
    error_id: ERR_VALIDATION
    http_status: 422
    applies_to: "all POST with a body"

  - priority: 7
    category: state
    check: "target resource is in a state that permits the requested transition (session must be SCHEDULED to confirm, CONFIRMED to complete, etc.)"
    error_id: "ERR_INVALID_<ENTITY>_STATE"
    http_status: 409
    applies_to: "all transition endpoints"

  - priority: 8
    category: business_constraint
    check: "confirming a session requires the engagement's client to have a COMPLETED StyleAssessment (cross-entity Session->StyleAssessment)"
    error_id: ERR_ASSESSMENT_NOT_COMPLETED
    http_status: 409
    applies_to: "POST /sessions/{id}/confirm"

  - priority: 9
    category: business_constraint
    check: "delivering a lookbook requires its engagement.status in {ACTIVE, FULFILLED} (cross-entity Lookbook->Engagement)"
    error_id: ERR_ENGAGEMENT_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /lookbooks/{id}/deliver"

  - priority: 10
    category: business_constraint
    check: "delivering a lookbook requires outfit_count >= 1 (empty lookbook rejected)"
    error_id: ERR_LOOKBOOK_EMPTY
    http_status: 422
    applies_to: "POST /lookbooks/{id}/deliver"

  - priority: 11
    category: business_referential
    check: "referral: referee differs from referrer (self-referral rejected by email at create and by id at signup)"
    error_id: ERR_SELF_REFERRAL
    http_status: 422
    applies_to: "POST /referrals, POST /referrals/{id}/signup"

  - priority: 12
    category: business_temporal
    check: "referral signup occurs at or before expires_at"
    error_id: ERR_REFERRAL_EXPIRED
    http_status: 409
    applies_to: "POST /referrals/{id}/signup"

  - priority: 13
    category: business_temporal
    check: "STYLIST OVERLAP: the new/rescheduled session window [scheduled_start, scheduled_end) must not overlap any other non-terminal (SCHEDULED/CONFIRMED) session whose engagement.stylist_id equals this engagement's stylist_id. Half-open intervals: touching endpoints (prev.end == new.start) do NOT conflict."
    error_id: ERR_STYLIST_TIME_CONFLICT
    http_status: 409
    applies_to: "POST /engagements/{id}/sessions, POST /sessions/{id}/reschedule"

  - priority: 14
    category: business_temporal
    check: "CLIENT BUFFER OVERLAP: for IN_PERSON sessions only, the window expanded by CLIENT_BUFFER_MINUTES=60 on each side must not overlap any other non-terminal IN_PERSON session of the same client (engagement.client_id). Requires >= 60 min gap between the client's consecutive in-person sessions; adjacency is NOT enough. VIRTUAL sessions are exempt from the client buffer (but still subject to priority-13 stylist overlap)."
    error_id: ERR_CLIENT_TIME_CONFLICT
    http_status: 409
    applies_to: "POST /engagements/{id}/sessions, POST /sessions/{id}/reschedule"

  - priority: 15
    category: business_fiscal
    check: "PACKAGE engagement: hours_available_blocks >= estimated_blocks of the requested session"
    error_id: ERR_INSUFFICIENT_PACKAGE_HOURS
    http_status: 409
    applies_to: "POST /engagements/{id}/sessions, POST /sessions/{id}/reschedule"

  - priority: 16
    category: business_fiscal
    check: "subscription activation requires client.wallet_credit_cents >= monthly_fee_cents"
    error_id: ERR_INSUFFICIENT_WALLET
    http_status: 409
    applies_to: "POST /subscriptions/{id}/activate"

  - priority: 17
    category: business_fiscal
    check: "redeem-refresh requires refresh_credits_remaining >= 1"
    error_id: ERR_NO_REFRESH_CREDITS
    http_status: 409
    applies_to: "POST /subscriptions/{id}/redeem-refresh"

  - priority: 18
    category: state
    check: "OCC: expected_engagement_version equals the current Engagement.version (checked last, after all business rules pass)"
    error_id: ERR_STALE_ENGAGEMENT_VERSION
    http_status: 412
    applies_to: "POST /engagements/{id}/sessions"

# ─────────────────────────────────────────────────────────────────────────────
# §1.5 API Endpoint Table
# ─────────────────────────────────────────────────────────────────────────────
endpoints:
  # ---- Provisioning / identity ----
  - method: POST
    path: "/styling/stylists"
    description: "Create a stylist."
    roles: [PlatformAdmin]
    code: 201
    input: [full_name, email, commission_pct, tier]
    output: Stylist
    side_effects: ["create Stylist ACTIVE"]
  - method: GET
    path: "/styling/stylists/{id}"
    description: "Fetch one stylist (exposes earned_commission_cents)."
    roles: [PlatformAdmin, Stylist, Client]
    code: 200
    input: []
    output: Stylist
    side_effects: []
  - method: POST
    path: "/styling/clients/register"
    description: "Self-register a client."
    roles: [Anonymous]
    code: 201
    input: [full_name, email]
    output: Client
    side_effects: ["create Client ACTIVE with wallet_credit_cents=0"]
  - method: GET
    path: "/styling/clients/{id}"
    description: "Fetch one client (exposes wallet_credit_cents, has_paid_invoice)."
    roles: [PlatformAdmin, Stylist, Client]
    code: 200
    input: []
    output: Client
    side_effects: []

  # ---- Style assessment ----
  - method: POST
    path: "/styling/clients/{id}/assessments"
    description: "Create a DRAFT style assessment for a client."
    roles: [Client]
    code: 201
    input: [body_type, color_palette, budget_band, lifestyle]
    output: StyleAssessment
    side_effects: ["create StyleAssessment DRAFT"]
  - method: GET
    path: "/styling/clients/{id}/assessments"
    description: "List a client's assessments (reverse-reachability for StyleAssessment.client_id)."
    roles: [PlatformAdmin, Stylist, Client]
    code: 200
    input: []
    output: StyleAssessment[]
    side_effects: []
  - method: POST
    path: "/styling/assessments/{id}/complete"
    description: "Stylist finalizes an assessment (DRAFT->COMPLETED)."
    roles: [Stylist]
    code: 200
    input: []
    output: StyleAssessment
    side_effects: ["status=COMPLETED"]

  # ---- Engagements ----
  - method: POST
    path: "/styling/engagements"
    description: "Client opens a DRAFT engagement with a stylist (HOURLY or PACKAGE)."
    roles: [Client]
    code: 201
    input: [client_id, stylist_id, mode, block_rate_cents, "package_blocks?", "package_price_cents?"]
    output: Engagement
    side_effects: ["create Engagement DRAFT; PACKAGE initializes block ledger"]
  - method: GET
    path: "/styling/engagements/{id}"
    description: "Fetch one engagement (exposes hours ledger, retail_spend_cents, version)."
    roles: [PlatformAdmin, Stylist, Client]
    code: 200
    input: []
    output: Engagement
    side_effects: []
  - method: GET
    path: "/styling/engagements"
    description: "List/filter engagements (reverse-reachability for Engagement.client_id and Engagement.stylist_id)."
    roles: [PlatformAdmin, Stylist, Client]
    code: 200
    input: ["client_id?", "stylist_id?", "status?", "limit?", "offset?"]
    output: Engagement[]
    side_effects: []
  - method: POST
    path: "/styling/engagements/{id}/activate"
    description: "Activate an engagement (DRAFT->ACTIVE)."
    roles: [Client]
    code: 200
    input: []
    output: Engagement
    side_effects: ["status=ACTIVE"]
  - method: POST
    path: "/styling/engagements/{id}/cancel"
    description: "Cancel an engagement (cascade-cancels non-terminal sessions and releases their reserved blocks)."
    roles: [Client]
    code: 200
    input: []
    output: Engagement
    side_effects: ["status=CANCELLED", "cascade cancel SCHEDULED/CONFIRMED sessions + release blocks"]

  # ---- Sessions ----
  - method: POST
    path: "/styling/engagements/{id}/sessions"
    description: "Schedule a session under an ACTIVE engagement. OCC-guarded on the engagement version; PACKAGE reserves estimated_blocks."
    roles: [Client]
    code: 201
    input: [session_type, "modality?", scheduled_start, scheduled_end, expected_engagement_version]
    output: Session
    side_effects: ["compute estimated_blocks + provisional charge", "PACKAGE: reserve blocks", "increments Engagement.version by 1"]
  - method: GET
    path: "/styling/sessions/{id}"
    description: "Fetch one session (exposes estimated_blocks, charge_cents, charge_variant)."
    roles: [PlatformAdmin, Stylist, Client]
    code: 200
    input: []
    output: Session
    side_effects: []
  - method: GET
    path: "/styling/engagements/{id}/sessions"
    description: "List sessions of an engagement (reverse-reachability for Session.engagement_id)."
    roles: [PlatformAdmin, Stylist, Client]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Session[]
    side_effects: []
  - method: POST
    path: "/styling/sessions/{id}/confirm"
    description: "Stylist confirms a session (SCHEDULED->CONFIRMED); requires client's COMPLETED assessment."
    roles: [Stylist]
    code: 200
    input: []
    output: Session
    side_effects: ["status=CONFIRMED"]
  - method: POST
    path: "/styling/sessions/{id}/reschedule"
    description: "Reschedule a session to a new window (SCHEDULED/CONFIRMED->SCHEDULED); re-runs overlap and availability checks."
    roles: [Client, Stylist]
    code: 200
    input: [scheduled_start, scheduled_end]
    output: Session
    side_effects: ["status=SCHEDULED", "recompute estimated_blocks + provisional charge", "PACKAGE: adjust reservation by delta"]
  - method: POST
    path: "/styling/sessions/{id}/complete"
    description: "Stylist completes a session (CONFIRMED->COMPLETED); computes FINAL charge; cascades package consumption -> engagement fulfillment -> auto lookbook."
    roles: [Stylist]
    code: 200
    input: [actual_minutes]
    output: Session
    side_effects: ["FINAL charge", "PACKAGE: reserved->consumed", "may fulfill engagement and auto-create Lookbook"]
  - method: POST
    path: "/styling/sessions/{id}/cancel"
    description: "Cancel a session (SCHEDULED/CONFIRMED->CANCELLED); releases reserved blocks."
    roles: [Client, Stylist]
    code: 200
    input: []
    output: Session
    side_effects: ["status=CANCELLED", "PACKAGE: release reserved blocks"]

  # ---- Purchases (shopping) ----
  - method: POST
    path: "/styling/sessions/{id}/items"
    description: "Record a purchased item during a CONFIRMED SHOPPING session; computes markup + commission and updates engagement/stylist ledgers."
    roles: [Stylist]
    code: 201
    input: [description, retail_cost_cents]
    output: PurchaseItem
    side_effects: ["compute markup/marked_up_price/commission", "engagement.retail_spend_cents += marked_up_price_cents", "stylist.earned_commission_cents += commission_cents"]
  - method: GET
    path: "/styling/sessions/{id}/items"
    description: "List purchased items of a session (reverse-reachability for PurchaseItem.session_id)."
    roles: [PlatformAdmin, Stylist, Client]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: PurchaseItem[]
    side_effects: []
  - method: POST
    path: "/styling/purchase-items/{id}/return"
    description: "Return a purchased item (PURCHASED->RETURNED); reverses ledgers (money invariant)."
    roles: [Stylist]
    code: 200
    input: []
    output: PurchaseItem
    side_effects: ["status=RETURNED", "engagement.retail_spend_cents -= marked_up_price_cents", "stylist.earned_commission_cents -= commission_cents"]

  # ---- Lookbooks & outfits ----
  - method: POST
    path: "/styling/engagements/{id}/lookbooks"
    description: "Create a DRAFT lookbook under an engagement."
    roles: [Stylist]
    code: 201
    input: [title]
    output: Lookbook
    side_effects: ["create Lookbook DRAFT"]
  - method: GET
    path: "/styling/lookbooks/{id}"
    description: "Fetch one lookbook (exposes outfit_count, revision_round)."
    roles: [PlatformAdmin, Stylist, Client]
    code: 200
    input: []
    output: Lookbook
    side_effects: []
  - method: GET
    path: "/styling/engagements/{id}/lookbooks"
    description: "List lookbooks of an engagement (reverse-reachability for Lookbook.engagement_id)."
    roles: [PlatformAdmin, Stylist, Client]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Lookbook[]
    side_effects: []
  - method: POST
    path: "/styling/lookbooks/{id}/outfits"
    description: "Append an outfit to a DRAFT lookbook (increments outfit_count)."
    roles: [Stylist]
    code: 201
    input: [name, "item_refs?"]
    output: Lookbook
    side_effects: ["append outfit; outfit_count += 1"]
  - method: POST
    path: "/styling/lookbooks/{id}/deliver"
    description: "Deliver a lookbook (DRAFT->DELIVERED); requires >=1 outfit and an ACTIVE/FULFILLED engagement."
    roles: [Stylist]
    code: 200
    input: []
    output: Lookbook
    side_effects: ["status=DELIVERED"]
  - method: POST
    path: "/styling/lookbooks/{id}/accept"
    description: "Client accepts a delivered lookbook (DELIVERED->ACCEPTED)."
    roles: [Client]
    code: 200
    input: []
    output: Lookbook
    side_effects: ["status=ACCEPTED"]
  - method: POST
    path: "/styling/lookbooks/{id}/request-revision"
    description: "Client requests a revision (DELIVERED->DRAFT); increments revision_round."
    roles: [Client]
    code: 200
    input: ["notes?"]
    output: Lookbook
    side_effects: ["status=DRAFT", "revision_round += 1"]

  # ---- Subscriptions & seasonal refresh ----
  - method: POST
    path: "/styling/clients/{id}/subscriptions"
    description: "Create a PENDING subscription for a client."
    roles: [Client]
    code: 201
    input: [tier, monthly_fee_cents]
    output: Subscription
    side_effects: ["create Subscription PENDING"]
  - method: GET
    path: "/styling/subscriptions/{id}"
    description: "Fetch one subscription (exposes refresh_credits_remaining, period dates)."
    roles: [PlatformAdmin, Stylist, Client]
    code: 200
    input: []
    output: Subscription
    side_effects: []
  - method: GET
    path: "/styling/clients/{id}/subscriptions"
    description: "List a client's subscriptions (reverse-reachability for Subscription.client_id)."
    roles: [PlatformAdmin, Stylist, Client]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Subscription[]
    side_effects: []
  - method: POST
    path: "/styling/subscriptions/{id}/activate"
    description: "Admin activates a subscription (PENDING->ACTIVE); debits the monthly fee from the client's wallet and grants refresh credits."
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Subscription
    side_effects: ["status=ACTIVE", "grant refresh credits", "set period dates", "client.wallet_credit_cents -= monthly_fee_cents"]
  - method: POST
    path: "/styling/subscriptions/{id}/redeem-refresh"
    description: "Client redeems one seasonal-refresh credit on an ACTIVE subscription."
    roles: [Client]
    code: 200
    input: []
    output: Subscription
    side_effects: ["refresh_credits_remaining -= 1"]
  - method: POST
    path: "/styling/subscriptions/{id}/cancel"
    description: "Cancel a subscription (PENDING/ACTIVE->CANCELLED)."
    roles: [Client]
    code: 200
    input: []
    output: Subscription
    side_effects: ["status=CANCELLED"]

  # ---- Referrals ----
  - method: POST
    path: "/styling/referrals"
    description: "Client creates a referral for a prospect email (PENDING); sets estimated credit and 90-day expiry."
    roles: [Client]
    code: 201
    input: [referrer_client_id, referee_email]
    output: Referral
    side_effects: ["create Referral PENDING", "estimated_credit_cents=REFERRAL_ESTIMATE_CENTS", "expires_at=created_at+90d"]
  - method: GET
    path: "/styling/referrals/{id}"
    description: "Fetch one referral (exposes estimated/realized credit, status)."
    roles: [PlatformAdmin, Stylist, Client]
    code: 200
    input: []
    output: Referral
    side_effects: []
  - method: GET
    path: "/styling/referrals"
    description: "List/filter referrals (reverse-reachability for referrer_client_id, referee_client_id, qualifying_invoice_id)."
    roles: [PlatformAdmin, Stylist, Client]
    code: 200
    input: ["referrer_client_id?", "referee_client_id?", "qualifying_invoice_id?", "status?", "limit?", "offset?"]
    output: Referral[]
    side_effects: []
  - method: POST
    path: "/styling/referrals/{id}/signup"
    description: "Admin links a registered referee client to a PENDING referral (PENDING->SIGNED_UP); rejects if expired or self-referral."
    roles: [PlatformAdmin]
    code: 200
    input: [referee_client_id]
    output: Referral
    side_effects: ["status=SIGNED_UP", "set referee_client_id"]

  # ---- Invoices ----
  - method: POST
    path: "/styling/engagements/{id}/invoices"
    description: "Admin issues an invoice for an engagement; snapshots completed sessions + purchased items and computes totals; applies wallet credit."
    roles: [PlatformAdmin]
    code: 201
    input: []
    output: Invoice
    side_effects: ["compute totals", "client.wallet_credit_cents -= wallet_credit_applied_cents"]
  - method: GET
    path: "/styling/invoices/{id}"
    description: "Fetch one invoice (exposes subtotal/fee/discount/total)."
    roles: [PlatformAdmin, Stylist, Client]
    code: 200
    input: []
    output: Invoice
    side_effects: []
  - method: GET
    path: "/styling/engagements/{id}/invoices"
    description: "List invoices of an engagement (reverse-reachability for Invoice.engagement_id)."
    roles: [PlatformAdmin, Stylist, Client]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Invoice[]
    side_effects: []
  - method: POST
    path: "/styling/invoices/{id}/pay"
    description: "Pay an issued invoice (ISSUED->PAID); if the client's first paid invoice, cascades referral qualification and referrer wallet credit."
    roles: [Client, PlatformAdmin]
    code: 200
    input: []
    output: Invoice
    side_effects: ["status=PAID; paid_at=clock", "set client.has_paid_invoice", "cascade referral CREDITED + referrer wallet"]

  # ---- Admin / test-driving ----
  - method: POST
    path: "/styling/clients/{id}/wallet/adjustments"
    description: "Admin credits or debits a client's wallet balance."
    roles: [PlatformAdmin]
    code: 200
    input: [amount_cents, "reason?"]
    output: Client
    side_effects: ["client.wallet_credit_cents += amount_cents (may be negative; result must stay >= 0)"]
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server logical clock. Startup default is 2026-03-01T00:00:00Z; before any call the clock reads exactly this default and never falls back to real wall-clock time. All expiry/window/period rules read this clock."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["logical clock set to to_iso8601"]

# ─────────────────────────────────────────────────────────────────────────────
# §1.6 Error Code Catalog
# ─────────────────────────────────────────────────────────────────────────────
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "missing/invalid auth headers on a protected endpoint"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "role not permitted, or entity_backed user acting on a resource it does not own"
  - id: ERR_VALIDATION
    http: 422
    condition: "malformed body: missing required field, bad enum, negative amount, invalid time range, or PACKAGE/HOURLY package_blocks mismatch"
  - id: ERR_INVALID_TIME_RANGE
    http: 422
    condition: "scheduled_end is not strictly after scheduled_start"
  - id: ERR_CLIENT_NOT_FOUND
    http: 404
    condition: "referenced Client id does not exist"
  - id: ERR_STYLIST_NOT_FOUND
    http: 404
    condition: "referenced Stylist id does not exist"
  - id: ERR_ASSESSMENT_NOT_FOUND
    http: 404
    condition: "referenced StyleAssessment id does not exist"
  - id: ERR_ENGAGEMENT_NOT_FOUND
    http: 404
    condition: "referenced Engagement id does not exist"
  - id: ERR_SESSION_NOT_FOUND
    http: 404
    condition: "referenced Session id does not exist"
  - id: ERR_PURCHASE_ITEM_NOT_FOUND
    http: 404
    condition: "referenced PurchaseItem id does not exist"
  - id: ERR_LOOKBOOK_NOT_FOUND
    http: 404
    condition: "referenced Lookbook id does not exist"
  - id: ERR_SUBSCRIPTION_NOT_FOUND
    http: 404
    condition: "referenced Subscription id does not exist"
  - id: ERR_REFERRAL_NOT_FOUND
    http: 404
    condition: "referenced Referral id does not exist"
  - id: ERR_INVOICE_NOT_FOUND
    http: 404
    condition: "referenced Invoice id does not exist"
  - id: ERR_INVALID_ASSESSMENT_STATE
    http: 409
    condition: "assessment not in a state permitting the transition (e.g., complete when not DRAFT)"
  - id: ERR_INVALID_ENGAGEMENT_STATE
    http: 409
    condition: "engagement not in a state permitting the transition (activate/cancel/schedule)"
  - id: ERR_INVALID_SESSION_STATE
    http: 409
    condition: "session not in a state permitting the transition (confirm/complete/cancel/reschedule)"
  - id: ERR_INVALID_LOOKBOOK_STATE
    http: 409
    condition: "lookbook not in a state permitting the transition (deliver/accept/request-revision)"
  - id: ERR_INVALID_SUBSCRIPTION_STATE
    http: 409
    condition: "subscription not in a state permitting the transition (activate/redeem/cancel)"
  - id: ERR_INVALID_INVOICE_STATE
    http: 409
    condition: "invoice not ISSUED when paying"
  - id: ERR_INVALID_REFERRAL_STATE
    http: 409
    condition: "referral not in a state permitting the transition (signup when not PENDING)"
  - id: ERR_ASSESSMENT_NOT_COMPLETED
    http: 409
    condition: "confirming a session while the client's StyleAssessment is not COMPLETED"
  - id: ERR_ENGAGEMENT_NOT_ACTIVE
    http: 409
    condition: "delivering a lookbook whose engagement is not ACTIVE/FULFILLED"
  - id: ERR_LOOKBOOK_EMPTY
    http: 422
    condition: "delivering a lookbook with outfit_count == 0"
  - id: ERR_STYLIST_TIME_CONFLICT
    http: 409
    condition: "session window overlaps another non-terminal session of the same stylist (half-open intervals)"
  - id: ERR_CLIENT_TIME_CONFLICT
    http: 409
    condition: "IN_PERSON session violates the client's 60-minute travel buffer against another IN_PERSON session"
  - id: ERR_INSUFFICIENT_PACKAGE_HOURS
    http: 409
    condition: "PACKAGE engagement lacks enough available blocks to reserve the requested session"
  - id: ERR_INSUFFICIENT_WALLET
    http: 409
    condition: "subscription activation with wallet balance below the monthly fee"
  - id: ERR_NO_REFRESH_CREDITS
    http: 409
    condition: "redeem-refresh with refresh_credits_remaining == 0"
  - id: ERR_SELF_REFERRAL
    http: 422
    condition: "referrer and referee are the same client (or same email)"
  - id: ERR_REFERRAL_EXPIRED
    http: 409
    condition: "referral signup after expires_at"
  - id: ERR_STALE_ENGAGEMENT_VERSION
    http: 412
    condition: "expected_engagement_version does not match the current Engagement.version (OCC)"

# ─────────────────────────────────────────────────────────────────────────────
# §1.7 RBAC Matrix
# ─────────────────────────────────────────────────────────────────────────────
roles:
  - name: Anonymous
    description: "Unauthenticated caller; may only self-register a client."
    identity: opaque
    exclusive_operations:
      - "POST /styling/clients/register"
    shared_operations: []

  - name: Client
    description: "Demand-side actor. entity_backed:Client; X-User-ID is the acting Client.id. Acts only on engagements/sessions/subscriptions/referrals it owns (engagement.client_id == X-User-ID, referral.referrer_client_id == X-User-ID)."
    identity: "entity_backed:Client"
    exclusive_operations:
      - "POST /styling/clients/{id}/assessments"
      - "POST /styling/engagements"
      - "POST /styling/engagements/{id}/activate"
      - "POST /styling/engagements/{id}/cancel"
      - "POST /styling/engagements/{id}/sessions"
      - "POST /styling/lookbooks/{id}/accept"
      - "POST /styling/lookbooks/{id}/request-revision"
      - "POST /styling/clients/{id}/subscriptions"
      - "POST /styling/subscriptions/{id}/redeem-refresh"
      - "POST /styling/subscriptions/{id}/cancel"
      - "POST /styling/referrals"
    shared_operations:
      - "POST /styling/sessions/{id}/reschedule (with Stylist)"
      - "POST /styling/sessions/{id}/cancel (with Stylist)"
      - "POST /styling/invoices/{id}/pay (with PlatformAdmin)"
      - "GET (all read endpoints)"

  - name: Stylist
    description: "Delivery-side actor. entity_backed:Stylist; X-User-ID is the acting Stylist.id. Acts only on sessions/lookbooks/items whose engagement.stylist_id == X-User-ID."
    identity: "entity_backed:Stylist"
    exclusive_operations:
      - "POST /styling/assessments/{id}/complete"
      - "POST /styling/sessions/{id}/confirm"
      - "POST /styling/sessions/{id}/complete"
      - "POST /styling/sessions/{id}/items"
      - "POST /styling/purchase-items/{id}/return"
      - "POST /styling/engagements/{id}/lookbooks"
      - "POST /styling/lookbooks/{id}/outfits"
      - "POST /styling/lookbooks/{id}/deliver"
    shared_operations:
      - "POST /styling/sessions/{id}/reschedule (with Client)"
      - "POST /styling/sessions/{id}/cancel (with Client)"
      - "GET (all read endpoints)"

  - name: PlatformAdmin
    description: "Operational superuser. opaque identity; X-User-ID is an operator handle not tied to any entity."
    identity: opaque
    exclusive_operations:
      - "POST /styling/stylists"
      - "POST /styling/subscriptions/{id}/activate"
      - "POST /styling/referrals/{id}/signup"
      - "POST /styling/engagements/{id}/invoices"
      - "POST /styling/clients/{id}/wallet/adjustments"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "POST /styling/invoices/{id}/pay (with Client)"
      - "GET (all read endpoints)"
