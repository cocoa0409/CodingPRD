              as: CrewManager
              captures: { emp1_id: $.data.id }
            - call: "POST /api/employees"
              payload: { employee_number: "E9702", full_name: "Tia Two", craft: "CONDUCTOR", seniority_date: "2006-01-01T00:00:00Z", home_terminal: "CHI" }
              as: CrewManager
              captures: { emp2_id: $.data.id }
            - call: "POST /api/employees"
              payload: { employee_number: "E9703", full_name: "Uma Three", craft: "CONDUCTOR", seniority_date: "2007-01-01T00:00:00Z", home_terminal: "CHI" }
              as: CrewManager
              captures: { emp3_id: $.data.id }
            - call: "POST /api/extra-boards"
              payload: { board_code: "CHI-CONDR-11", craft: "CONDUCTOR", terminal: "CHI", guaranteed_slots: 3 }
              as: CrewManager
              captures: { board_id: $.data.id }
            - call: "POST /api/extra-boards/${board_id}/slots"
              payload: { employee_id: "${emp1_id}" }
              as: CrewManager
            - call: "POST /api/extra-boards/${board_id}/slots"
              payload: { employee_id: "${emp2_id}" }
              as: CrewManager
            - call: "POST /api/extra-boards/${board_id}/slots"
              payload: { employee_id: "${emp3_id}" }
              as: CrewManager
            - call: "POST /api/jobs"
              payload: { job_symbol: "M-CHIGAL-19", craft: "CONDUCTOR", origin_terminal: "CHI", report_time: "2026-08-03T08:00:00Z", crew_required: 2 }
              as: CrewManager
              captures: { job_id: $.data.id, job_v0: $.data.version }
            - call: "POST /api/jobs/${job_id}/calls"
              payload: {}
              as: CrewCaller
              captures: { call1_id: $.data.id }
            - call: "POST /api/calls/${call1_id}/accept"
              payload: { expected_job_version: "${job_v0}" }
              as: Employee
              as_user_id: "${emp1_id}"
              captures: { asg1_id: $.data.id, job_v1: $.data.version }
            - call: "POST /api/jobs/${job_id}/calls"
              payload: {}
              as: CrewCaller
              captures: { call2_id: $.data.id }
            - call: "POST /api/calls/${call2_id}/accept"
              payload: { expected_job_version: "${job_v1}" }
              as: Employee
              as_user_id: "${emp2_id}"
              captures: { asg2_id: $.data.id, job_v2: $.data.version }
            - call: "GET /api/jobs/${job_id}"
              payload: {}
              as: CrewManager
              captures: { filled_at_cap: $.data.filled_count, status_at_cap: $.data.job_status }
          trigger:
            - call: "POST /api/jobs/${job_id}/calls"
              payload: {}
              as: CrewCaller
              captures: { err_third: $.data.error_id }
          assert:
            - "captured filled_at_cap == 2 and status_at_cap == FILLED (aggregate reached capacity)"
            - "captured err_third == ERR_INVALID_STATE (no CALLING job to call against) OR ERR_JOB_ALREADY_FILLED — pinned: issuing a call on a FILLED job is a state violation (job_status not in {BULLETINED, CALLING}) -> ERR_INVALID_STATE"

  # ------------------------------------------------------------------
  # Rule 9 — compensating_invariant (different conserved quantities)
  # ------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: board_slot_count_conserved_through_layoff_markup
        grounds:
          - state_machines.Employee.AVAILABLE_to_MARKED_OFF
          - state_machines.Employee.MARKED_OFF_to_AVAILABLE
          - calculations.board_rotation
        distinguishing_aspect: |
          Conserved quantity = the count of ExtraBoardSlot rows in
          {ACTIVE, FROZEN} on the board. Lay-off (freeze) + mark-up (restore)
          is a forward/compensating pair: ACTIVE∪FROZEN count after the pair
          equals the count before, and standing_position ordering is
          preserved (the frozen slot returns to its remembered position, not
          the tail).
        test_recipe:
          setup:
            - "Board B with E1 (pos 1), E2 (pos 2), E3 (pos 3), all AVAILABLE"
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: CrewManager
            - call: "POST /api/employees"
              payload: { employee_number: "E9801", full_name: "Vic One", craft: "CONDUCTOR", seniority_date: "2004-01-01T00:00:00Z", home_terminal: "CHI" }
              as: CrewManager
              captures: { emp1_id: $.data.id }
            - call: "POST /api/employees"
              payload: { employee_number: "E9802", full_name: "Wes Two", craft: "CONDUCTOR", seniority_date: "2005-02-01T00:00:00Z", home_terminal: "CHI" }
              as: CrewManager
              captures: { emp2_id: $.data.id }
            - call: "POST /api/employees"
              payload: { employee_number: "E9803", full_name: "Xia Three", craft: "CONDUCTOR", seniority_date: "2006-03-01T00:00:00Z", home_terminal: "CHI" }
              as: CrewManager
              captures: { emp3_id: $.data.id }
            - call: "POST /api/extra-boards"
              payload: { board_code: "CHI-CONDR-12", craft: "CONDUCTOR", terminal: "CHI", guaranteed_slots: 3 }
              as: CrewManager
              captures: { board_id: $.data.id }
            - call: "POST /api/extra-boards/${board_id}/slots"
              payload: { employee_id: "${emp1_id}" }
              as: CrewManager
            - call: "POST /api/extra-boards/${board_id}/slots"
              payload: { employee_id: "${emp2_id}" }
              as: CrewManager
            - call: "POST /api/extra-boards/${board_id}/slots"
              payload: { employee_id: "${emp3_id}" }
              as: CrewManager
          trigger:
            - call: "POST /api/employees/${emp2_id}/lay-off"
              payload: {}
              as: Employee
              as_user_id: "${emp2_id}"
            - call: "POST /api/employees/${emp2_id}/mark-up"
              payload: {}
              as: Employee
              as_user_id: "${emp2_id}"
            - call: "GET /api/extra-board-slots?board_id=${board_id}"
              payload: {}
              as: CrewManager
          assert:
            - "after the lay-off/mark-up pair, exactly 3 slots remain in {ACTIVE, FROZEN} (count conserved — no drift)"
            - "E1 slot standing_position == 1, E2 slot standing_position == 2, E3 slot standing_position == 3 (order fully restored)"

      - name: pay_finalize_reconciles_provisional_delta
        grounds:
          - state_machines.PayRecord.SUBMITTED_to_FINALIZED
          - calculations.agreement_pay
        distinguishing_aspect: |
          Conserved quantity = gross_pay_cents ledger consistency across the
          dispute/resubmit/finalize chain: the FINALIZE write recomputes from
          the same pinned inputs (claimed_minutes, claimed_deadhead_minutes,
          deadhead_mode) so that gross_pay_cents after finalize equals the
          FINAL formula value 74866 exactly — the provisional 74867 is fully
          replaced (delta -1 absorbed), never accumulated on top.
        test_recipe:
          setup:
            - "Employee E with Assignment A (TRAIN deadhead 100) and PayRecord P resubmitted at claimed_minutes=600 (provisional 74867)"
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
