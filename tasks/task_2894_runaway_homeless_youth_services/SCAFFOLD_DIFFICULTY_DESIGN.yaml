            - "youth Cy Ferrer (dob 2014-01-20, age 12) has no contacts, so priority_score is 24 + 0 + 0 + 15 = 39"
            - "Bo's and Cy's admissions were both requested with planned_discharge_at 2026-08-25T00:00:00Z against the FROZEN program and are therefore WAITLISTED; waitlisted_count is 2"
            - "all three youths carry a CLEARED SafetyScreening so validations priority 19 and 30 never fire"
