              payload: { buyer_reference: "BR-OWNER-0001" }
              captures: { cure_status: "$.data.cure_status", waived_by: "$.data.waived_by_buyer_id" }
          assert:
            - "err_foreign_waiver == \"ERR_BUYER_SCOPE_VIOLATION\" with HTTP 403 — buyer B is a valid identity (priority 4 passes) but does not own the order reached through finding to credit to order"
            - "err_foreign_dispute == \"ERR_BUYER_SCOPE_VIOLATION\": the priority-7 check on POST /dispute-cases reads buyer_id off the body's ExportOrder, not off the header"
            - "the scoped list returns HTTP 200 with total_count == 1 and own_order == order B — a scope mismatch narrows a collection read instead of erroring"
            - "the owner's waiver returns HTTP 200 with cure_status == \"WAIVED\" and waived_by == buyer A's id, so the finding was never poisoned by the rejected attempt"
      - name: corner_the_person_who_captured_the_credit_cannot_review_it_under_a_second_hat
        claim_type: segregation_of_duties
        grounds:
          - validations.priority_17
          - errors[ERR_SEGREGATION_OF_DUTIES]
          - entities.LetterOfCredit.fields.captured_by_user_id
          - rbac.role_model_notes
        distinguishing_aspect: "Segregation is keyed on X-User-ID, not on X-User-Role: the same human who captured the credit as ExportOpsCoordinator is barred from opening its terms review even while presenting a permitted DocumentaryCreditReviewer role, which is the only way the check is observable at all. Both barred and permitted attempts carry a current expected_letter_of_credit_version, so priority 13 is satisfied and the 409 is attributable to identity alone; the reverse ordering (a stale version masking the duty conflict) is exercised in the optimistic_concurrency section rather than here, because no legitimately stale credit version exists in a chain this short."
        test_recipe:
          setup:
            - "u_dual_dana captures the credit while wearing the ExportOpsCoordinator role"
            - "u_dual_dana then presents the DocumentaryCreditReviewer role, so priority 3 passes"
          setup_api_calls:
            - call: "POST /foreign-buyers"
