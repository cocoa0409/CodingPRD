# =============================================================================
# 1.8 Scaffold Difficulty Design (Test Targeting Index)
# Physician & Provider Recruitment — Expert
# 9 rule_ids x 2 instances = 18 instances
# =============================================================================
scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: placement_fee_estimate_vs_final_divergence
        grounds:
          - calculations.placement_fee
          - entities.Placement.fields.fee_estimate_cents
          - entities.Placement.fields.placement_fee_cents
        distinguishing_aspect: |
          On Placement, the estimate variant (offered comp 26,500,000 at ACCEPT) yields
          fee_estimate_cents 6,360,000 while the final variant (signed comp 25,000,000 at
          INVOICE) yields placement_fee_cents 6,000,000 — same entity, two algorithms, delta 360,000.
        test_recipe:
          setup:
            - "One AM, one RECRUITER (covers CARDIOLOGY), one COORD; a CARDIOLOGY, hard-to-fill opening (contingency 0.20, min_fee 2,000,000, guarantee 90d)."
            - "Application driven to an ACCEPTED offer -> Placement PRE_START; credentialing cleared; placement ONBOARDed to ACTIVE; fee INVOICEd with final comp 25,000,000."
          setup_api_calls:
            - { call: "POST /staff-users", payload: { role: "ACCOUNT_MANAGER", full_name: "Amy AM", email: "am@x.com" }, as: PlatformAdmin, captures: { am_id: "$.data.id" } }
            - { call: "POST /staff-users", payload: { role: "RECRUITER", full_name: "Rio Rec", email: "rec@x.com", covered_specialties: ["CARDIOLOGY"] }, as: PlatformAdmin, captures: { rec_id: "$.data.id" } }
            - { call: "POST /staff-users", payload: { role: "CREDENTIALING_COORDINATOR", full_name: "Cora Coord", email: "coord@x.com" }, as: PlatformAdmin, captures: { coord_id: "$.data.id" } }
            - { call: "POST /clients", payload: { name: "West Health", region: "West", account_manager_id: "${am_id}", contingency_pct: 0.20, min_fee_cents: 2000000, guarantee_days: 90 }, as: AccountManager, as_user_id: "${am_id}", captures: { client_id: "$.data.id" } }
            - { call: "POST /job-openings", payload: { client_id: "${client_id}", specialty: "CARDIOLOGY", region: "West", region_state: "CA", comp_min_cents: 20000000, comp_max_cents: 30000000, is_hard_to_fill: true, positions_total: 1 }, as: AccountManager, as_user_id: "${am_id}", captures: { opening_id: "$.data.id" } }
            - { call: "POST /job-openings/${opening_id}/transition", payload: { action: "PUBLISH" }, as: AccountManager, as_user_id: "${am_id}" }
            - { call: "POST /candidates", payload: { recruiter_id: "${rec_id}", full_name: "Dr Vale", specialty: "CARDIOLOGY", home_region: "West", license_states: ["CA"], desired_comp_cents: 26000000 }, as: Recruiter, as_user_id: "${rec_id}", captures: { cand_id: "$.data.id" } }
            - { call: "POST /applications", payload: { candidate_id: "${cand_id}", opening_id: "${opening_id}" }, as: Recruiter, as_user_id: "${rec_id}", captures: { app_id: "$.data.id" } }
            - { call: "POST /applications/${app_id}/advance", payload: { action: "SCREEN" }, as: Recruiter, as_user_id: "${rec_id}" }
            - { call: "POST /applications/${app_id}/advance", payload: { action: "SUBMIT" }, as: Recruiter, as_user_id: "${rec_id}" }
            - { call: "POST /applications/${app_id}/advance", payload: { action: "ADVANCE_TO_INTERVIEW" }, as: ClientContact, as_user_id: "${client_id}" }
            - { call: "POST /site-visits", payload: { application_id: "${app_id}", interviewer_user_id: "${rec_id}", scheduled_start: "2026-05-03T15:00:00Z", scheduled_end: "2026-05-03T16:00:00Z", location: "HQ" }, as: Recruiter, as_user_id: "${rec_id}", captures: { sv_id: "$.data.id" } }
            - { call: "POST /site-visits/${sv_id}/transition", payload: { action: "COMPLETE" }, as: Recruiter, as_user_id: "${rec_id}" }
            - { call: "POST /offers", payload: { application_id: "${app_id}", base_salary_cents: 24000000, sign_on_bonus_cents: 2500000, start_date: "2026-06-01T00:00:00Z", expires_at: "2026-05-20T00:00:00Z" }, as: AccountManager, as_user_id: "${am_id}", captures: { offer_id: "$.data.id" } }
            - { call: "POST /offers/${offer_id}/transition", payload: { action: "ACCEPT" }, as: Recruiter, as_user_id: "${rec_id}" }
            - { call: "GET /placements?offer_id=${offer_id}", payload: {}, as: AccountManager, as_user_id: "${am_id}", captures: { placement_id: "$.data[0].id", fee_est: "$.data[0].fee_estimate_cents" } }
            - { call: "GET /credentialing-files?placement_id=${placement_id}", payload: {}, as: CredentialingCoordinator, as_user_id: "${coord_id}", captures: { cfile_id: "$.data[0].id" } }
            - { call: "POST /credentialing-files/${cfile_id}/items", payload: { item_type: "STATE_LICENSE", is_required: true }, as: CredentialingCoordinator, as_user_id: "${coord_id}", captures: { item_id: "$.data.id" } }
            - { call: "POST /credential-items/${item_id}/transition", payload: { action: "SUBMIT" }, as: CredentialingCoordinator, as_user_id: "${coord_id}" }
            - { call: "POST /credential-items/${item_id}/transition", payload: { action: "VERIFY" }, as: CredentialingCoordinator, as_user_id: "${coord_id}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /placements/${placement_id}/transition", payload: { action: "ONBOARD" }, as: CredentialingCoordinator, as_user_id: "${coord_id}" }
          trigger:
            - { call: "POST /placements/${placement_id}/transition", payload: { action: "INVOICE", final_first_year_comp_cents: 25000000 }, as: AccountManager, as_user_id: "${am_id}" }
            - { call: "GET /placements/${placement_id}", payload: {}, as: AccountManager, as_user_id: "${am_id}", captures: { fee_final: "$.data.placement_fee_cents" } }
          assert:
            - "Placement.${placement_id}.fee_estimate_cents == 6360000"
            - "Placement.${placement_id}.placement_fee_cents == 6000000"
            - "6360000 - 6000000 == 360000"

      - name: guarantee_credit_refund_prorated
        grounds:
          - calculations.guarantee_credit
          - state_machines.GuaranteeClaim.APPROVED_to_RESOLVED_REFUND
          - entities.GuaranteeClaim.fields.credit_cents
        distinguishing_aspect: |
          guarantee_credit lives on GuaranteeClaim (a different entity domain than the placement_fee
          instance). The REFUND variant returns placement_fee 6,000,000 pro-rated by unworked fraction
          (60/90) = 4,000,000; the REPLACEMENT variant on identical fallout would instead credit the
          capped full fee (5,000,000) — two algorithms, different results.
        test_recipe:
          setup:
            - "Placement ACTIVE (guarantee_end 2026-08-30), fee INVOICEd at 6,000,000 (final comp 25,000,000)."
            - "Provider falls out 2026-07-01 (30 of 90 guarantee days worked); claim FILED then APPROVED then RESOLVED_REFUND."
          setup_api_calls:
            - { call: "POST /staff-users", payload: { role: "ACCOUNT_MANAGER", full_name: "Amy AM", email: "am@x.com" }, as: PlatformAdmin, captures: { am_id: "$.data.id" } }
            - { call: "POST /staff-users", payload: { role: "RECRUITER", full_name: "Rio Rec", email: "rec@x.com", covered_specialties: ["CARDIOLOGY"] }, as: PlatformAdmin, captures: { rec_id: "$.data.id" } }
            - { call: "POST /staff-users", payload: { role: "CREDENTIALING_COORDINATOR", full_name: "Cora Coord", email: "coord@x.com" }, as: PlatformAdmin, captures: { coord_id: "$.data.id" } }
            - { call: "POST /clients", payload: { name: "West Health", region: "West", account_manager_id: "${am_id}", contingency_pct: 0.20, min_fee_cents: 2000000, guarantee_days: 90 }, as: AccountManager, as_user_id: "${am_id}", captures: { client_id: "$.data.id" } }
            - { call: "POST /job-openings", payload: { client_id: "${client_id}", specialty: "CARDIOLOGY", region: "West", region_state: "CA", comp_min_cents: 20000000, comp_max_cents: 30000000, is_hard_to_fill: true, positions_total: 1 }, as: AccountManager, as_user_id: "${am_id}", captures: { opening_id: "$.data.id" } }
            - { call: "POST /job-openings/${opening_id}/transition", payload: { action: "PUBLISH" }, as: AccountManager, as_user_id: "${am_id}" }
            - { call: "POST /candidates", payload: { recruiter_id: "${rec_id}", full_name: "Dr Vale", specialty: "CARDIOLOGY", home_region: "West", license_states: ["CA"], desired_comp_cents: 26000000 }, as: Recruiter, as_user_id: "${rec_id}", captures: { cand_id: "$.data.id" } }
            - { call: "POST /applications", payload: { candidate_id: "${cand_id}", opening_id: "${opening_id}" }, as: Recruiter, as_user_id: "${rec_id}", captures: { app_id: "$.data.id" } }
            - { call: "POST /applications/${app_id}/advance", payload: { action: "SCREEN" }, as: Recruiter, as_user_id: "${rec_id}" }
            - { call: "POST /applications/${app_id}/advance", payload: { action: "SUBMIT" }, as: Recruiter, as_user_id: "${rec_id}" }
            - { call: "POST /applications/${app_id}/advance", payload: { action: "ADVANCE_TO_INTERVIEW" }, as: ClientContact, as_user_id: "${client_id}" }
            - { call: "POST /site-visits", payload: { application_id: "${app_id}", interviewer_user_id: "${rec_id}", scheduled_start: "2026-05-03T15:00:00Z", scheduled_end: "2026-05-03T16:00:00Z", location: "HQ" }, as: Recruiter, as_user_id: "${rec_id}", captures: { sv_id: "$.data.id" } }
            - { call: "POST /site-visits/${sv_id}/transition", payload: { action: "COMPLETE" }, as: Recruiter, as_user_id: "${rec_id}" }
            - { call: "POST /offers", payload: { application_id: "${app_id}", base_salary_cents: 24000000, sign_on_bonus_cents: 2500000, start_date: "2026-06-01T00:00:00Z", expires_at: "2026-05-20T00:00:00Z" }, as: AccountManager, as_user_id: "${am_id}", captures: { offer_id: "$.data.id" } }
            - { call: "POST /offers/${offer_id}/transition", payload: { action: "ACCEPT" }, as: Recruiter, as_user_id: "${rec_id}" }
            - { call: "GET /placements?offer_id=${offer_id}", payload: {}, as: AccountManager, as_user_id: "${am_id}", captures: { placement_id: "$.data[0].id" } }
            - { call: "GET /credentialing-files?placement_id=${placement_id}", payload: {}, as: CredentialingCoordinator, as_user_id: "${coord_id}", captures: { cfile_id: "$.data[0].id" } }
            - { call: "POST /credentialing-files/${cfile_id}/items", payload: { item_type: "STATE_LICENSE", is_required: true }, as: CredentialingCoordinator, as_user_id: "${coord_id}", captures: { item_id: "$.data.id" } }
            - { call: "POST /credential-items/${item_id}/transition", payload: { action: "SUBMIT" }, as: CredentialingCoordinator, as_user_id: "${coord_id}" }
            - { call: "POST /credential-items/${item_id}/transition", payload: { action: "VERIFY" }, as: CredentialingCoordinator, as_user_id: "${coord_id}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /placements/${placement_id}/transition", payload: { action: "ONBOARD" }, as: CredentialingCoordinator, as_user_id: "${coord_id}" }
            - { call: "POST /placements/${placement_id}/transition", payload: { action: "INVOICE", final_first_year_comp_cents: 25000000 }, as: AccountManager, as_user_id: "${am_id}" }
            - { call: "POST /guarantee-claims", payload: { placement_id: "${placement_id}", fell_out_date: "2026-07-01T00:00:00Z", reason: "left practice" }, as: AccountManager, as_user_id: "${am_id}", captures: { claim_id: "$.data.id" } }
            - { call: "POST /guarantee-claims/${claim_id}/transition", payload: { action: "APPROVE" }, as: AccountManager, as_user_id: "${am_id}" }
          trigger:
