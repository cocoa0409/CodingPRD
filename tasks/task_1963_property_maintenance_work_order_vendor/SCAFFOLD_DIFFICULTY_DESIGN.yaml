              payload: { property_id: "${prop_id}", resident_id: "${res_id}", category: "PLUMBING", priority: "ROUTINE", description: "Exact threshold job" }
              as: Resident
              as_user_id: "${res_id}"
              captures: { wo_id: $.data.id }
            - call: "POST /work-orders/${wo_id}/dispatch"
              payload: { assignment_type: "IN_HOUSE", technician_id: "${tech_id}", scheduled_start_at: "2026-08-01T10:00:00Z", scheduled_end_at: "2026-08-01T12:00:00Z", entry_authorization: "RESIDENT_CONSENT" }
              as: Dispatcher
            - call: "POST /work-orders/${wo_id}/start"
              payload: { resident_consent_confirmed: true }
              as: Technician
              as_user_id: "${tech_id}"
              captures: { wo_v3: $.data.version }
          trigger:
            - call: "POST /work-orders/${wo_id}/purchase-requests"
              payload: { part_id: "${part_id}", quantity: 3, quoted_unit_cost_cents: 12000, shipping_fee_cents: 2000, expected_work_order_version: "${wo_v3}" }
              as: Technician
              as_user_id: "${tech_id}"
              captures: { pr1_status: $.data.status, pr1_total: $.data.estimated_total_cents, pr1_auto: $.data.auto_approved }
            - call: "GET /work-orders/${wo_id}"
              payload: {}
              as: Dispatcher
              captures: { wo_v4: $.data.version }
            - call: "POST /work-orders/${wo_id}/purchase-requests"
              payload: { part_id: "${part_id}", quantity: 3, quoted_unit_cost_cents: 12000, shipping_fee_cents: 2001, expected_work_order_version: "${wo_v4}" }
              as: Technician
              as_user_id: "${tech_id}"
              captures: { pr2_status: $.data.status, pr2_total: $.data.estimated_total_cents, pr2_auto: $.data.auto_approved }
          assert:
            - "First request: estimated_total_cents == 40880 == threshold -> status == APPROVED, auto_approved == true (<= comparison includes equality)"
            - "Second request: estimated_total_cents == 40881 == threshold + 1 -> status == PENDING, auto_approved == false"

      - name: reopen_window_exact_boundary
        grounds:
          - validations[priority=13]
          - entities.Property.fields.recall_window_days
          - state_machines.WorkOrder.COMPLETED_to_REOPENED
        distinguishing_aspect: |
          Metric: elapsed time since completed_at on POST /work-orders/{id}/reopen.
          Exactly recall_window_days (30d) after completion reopens successfully;
          30 days + 1 second is rejected with ERR_RECALL_WINDOW_EXPIRED.
        test_recipe:
          setup:
