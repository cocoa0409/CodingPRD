            - { call: "POST /milk-bank/shipments", payload: { donor_id: "${d1}", tracking_code: "TRK-0001", container_count: 1, uses_dry_ice: false, declared_volume_ml: 600, shipped_on: "2026-08-02" }, as: IntakeCoordinator, as_user_id: "u-intake-1", captures: { s1: "$.data.id" } }
