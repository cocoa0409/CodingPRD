            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-05T00:00:00Z" }, as: CommissionStaff, captures: { err2: $.data.error_id } }
          assert:
            - "${t1} == 2026-08-05T00:00:00Z (forward move accepted)"
            - "${err1} == ERR_CLOCK_REGRESSION (backward move rejected)"
            - "${err2} == ERR_CLOCK_REGRESSION (equal instant is not strictly forward)"

