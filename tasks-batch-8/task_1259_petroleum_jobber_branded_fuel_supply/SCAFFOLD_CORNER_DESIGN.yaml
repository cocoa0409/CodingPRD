        distinguishing_aspect: "Loss supports the dispute loop: REPORTED -> DISPUTED (dealer) -> VERIFIED (jobber); book deduction happens only at VERIFY, not at DISPUTE."
        test_recipe:
          setup: ["station with tank opening 10000; loss of 300 gal REPORTED by dealer"]
          setup_api_calls:
            - call: "POST /api/products"
