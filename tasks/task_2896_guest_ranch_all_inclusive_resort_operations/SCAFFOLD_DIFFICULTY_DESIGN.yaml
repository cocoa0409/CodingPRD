              captures: { horse_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-10-12T08:00:00Z" }
              as: HorseProgramDirector
          trigger:
            - call: "POST /horses/${horse_id}/health-events"
              payload: { event_type: "LAMENESS", observed_on: "2026-10-12", note: "off on the left fore" }
              as: HorseProgramDirector
