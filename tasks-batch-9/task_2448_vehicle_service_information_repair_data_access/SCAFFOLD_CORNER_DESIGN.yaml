            - "after the first revoke: Technician.${tech_id}.identity_status == UNVERIFIED"
            - "suspend call: HTTP status == 200 and response.data.identity_status == SUSPENDED"
            - "second revoke: HTTP status == 200 and response.data.identity_status == REVOKED"

