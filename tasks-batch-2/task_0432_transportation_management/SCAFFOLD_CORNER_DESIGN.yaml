              as: CarrierOps
            - call: "POST /tms/orders"
              payload: { customer_ref: "C1", origin_zone: "Z1", dest_zone: "Z2", weight_lbs: 10000, declared_value_cents: 200000 }
              as: ShipperOps
              captures: { order_id: $.data.id }
            - call: "POST /tms/shipments"
              payload: { order_id: "${order_id}", mode: "TL", distance_miles: 300, weight_lbs: 6000, promised_eta_minute: 500 }
              as: ShipperOps
              captures: { ship_id: $.data.id }
            - call: "POST /tms/shipments/${ship_id}/tenders"
              payload: { tender_minute: 100 }
              as: ShipperOps
              captures: { tender_id: $.data.id }
            - call: "POST /tms/tenders/${tender_id}/accept"
              payload: {}
              as: CarrierOps
            - call: "POST /tms/loads"
              payload: { carrier_id: "${carrier_a_id}", planned_capacity_lbs: 10000 }
              as: DockOps
              captures: { load_id: $.data.id, load_v: $.data.version }
            - call: "POST /tms/loads/${load_id}/shipments"
              payload: { shipment_id: "${ship_id}", expected_load_version: "${load_v}" }
              as: DockOps
            - call: "POST /tms/dock-appointments"
              payload: { load_id: "${load_id}", dock_door: "D1", start_minute: 200, end_minute: 260 }
              as: DockOps
            - call: "POST /tms/loads/${load_id}/dispatch"
              payload: {}
              as: DockOps
            - call: "POST /tms/shipments/${ship_id}/depart"
              payload: {}
              as: CarrierOps
            - call: "POST /tms/shipments/${ship_id}/deliver"
              payload: { delivered_minute: 400 }
              as: CarrierOps
          trigger:
            - call: "POST /tms/claims"
              payload: { shipment_id: "${ship_id}", claim_type: "DAMAGE", claimed_amount_cents: 50000 }
              as: ShipperOps
              captures: { claim_id: $.data.id }
          assert:
            - "Carrier.${carrier_a_id}.claim_count == 1"
            - "Carrier.${carrier_a_id}.on_time_pct == 100.0"
            - "Carrier.${carrier_a_id}.scorecard_grade == C"

      - name: shipment_cancel_cascade_chain
        claim_type: cascading_side_effects
        grounds: [state_machines.Shipment.execution_status=PENDING_to_execution_status=CANCELLED]
        excluded_because:
          difficulty_instance: transitive_cascade / shipment_cancel_cascade_depth3_tender_decline_reverts_status
          rationale: "The multi-hop cancel cascade is asserted end-to-end by the named §1.8 instance."

  # ===========================================================================
  - section: consistency_model
    instances:
      - name: immediate_visibility_quoted_cost_in_accept_response
        claim_type: immediate
        grounds: [state_machines.Shipment.tender_status=TENDERED_to_tender_status=BOOKED, entities.Shipment.fields.quoted_cost_cents]
        distinguishing_aspect: "After accepting a tender, an immediate GET /tms/shipments/{id} reflects quoted_cost_cents=91250 and tender_status BOOKED in the same request flow (immediate consistency)."
        test_recipe:
          setup: ["A shipment tendered (rate A) and accepted."]
          setup_api_calls:
            - call: "POST /tms/carriers"
              payload: { name: "Acme TL", scac: "ACME", mode: "TL" }
              as: CarrierOps
              captures: { carrier_a_id: $.data.id }
            - call: "POST /tms/contract-rates"
              payload: { carrier_id: "${carrier_a_id}", mode: "TL", origin_zone: "Z1", dest_zone: "Z2", base_rate_per_mile_cents: 250, min_charge_cents: 50000, fuel_surcharge_pct: 0.15, effective_start_minute: 0, effective_end_minute: 1000 }
              as: CarrierOps
            - call: "POST /tms/orders"
              payload: { customer_ref: "C1", origin_zone: "Z1", dest_zone: "Z2", weight_lbs: 10000, declared_value_cents: 200000 }
              as: ShipperOps
              captures: { order_id: $.data.id }
            - call: "POST /tms/shipments"
              payload: { order_id: "${order_id}", mode: "TL", distance_miles: 300, weight_lbs: 6000, promised_eta_minute: 500 }
              as: ShipperOps
              captures: { ship_id: $.data.id }
            - call: "POST /tms/shipments/${ship_id}/tenders"
              payload: { tender_minute: 100 }
              as: ShipperOps
              captures: { tender_id: $.data.id }
            - call: "POST /tms/tenders/${tender_id}/accept"
              payload: {}
              as: CarrierOps
          trigger:
            - call: "GET /tms/shipments/${ship_id}"
              payload: {}
              as: ShipperOps
          assert:
            - "Shipment.${ship_id}.tender_status == BOOKED"
            - "Shipment.${ship_id}.quoted_cost_cents == 91250"
            - "Shipment.${ship_id}.assigned_carrier_id == ${carrier_a_id}"
