          expected_case_version: ${ep_v1}
        as: EdPhysician
        as_user_id: ed_ann
        captures:
          p_ok: $.data.id
          p_ok_st: $.data.status
      assert:
      - '${p_role_id} == ERR_FORBIDDEN_ROLE (403): the role check at priority 5 fires before the centre is looked up at 15'
      - '${p_shape_id} == ERR_INVALID_REQUEST (422): the unknown field documentation_status is caught at priority 10 before the dangling case_id at 18'
      - '${p_enum_id} == ERR_INVALID_ENUM_VALUE (422): the bad mode is caught at priority 12 even though BOTH foreign keys in the same body are dangling'
      - '${p_fk_occ_id} == ERR_AGREEMENT_NOT_FOUND (404): the dangling agreement_id at priority 18 outranks the stale expected_case_version at 22'
      - ${p_occ_id} == ERR_STALE_CASE_VERSION (412) proves ${ep_v0} really was stale, so the previous call's 404 was an ordering result and not an accident
      - '${p_own_id} == ERR_CONSULT_NOT_FOUND (404), not ERR_NOT_CONSULT_OWNER: the priority-8 ownership comparison has no assigned_neurologist_id to read on a row that does not exist'
      - ${p_nf_state_id} == ERR_AGREEMENT_NOT_FOUND (404) while ${p_state_id} == ERR_INVALID_AGREEMENT_STATE (409) — the same endpoint, the same verb, and the lookup at 15 beats the state check at 30
      - 'after all eight refusals the request with the CURRENT version succeeds: ${p_ok_st} == ASSIGNED, so none of the failed calls left partial state behind'
