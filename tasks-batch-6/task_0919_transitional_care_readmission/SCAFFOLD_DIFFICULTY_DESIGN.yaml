          - entities.TcmClaim.fields.net_before_withhold_cents
          - entities.Payer.fields.coinsurance_rate
        distinguishing_aspect: |
          Mode (c) - a circular-looking dependency whose evaluation order the
          scaffold pins. The withhold percentage is selected from
          net_before_withhold_cents, which only exists after coinsurance has
