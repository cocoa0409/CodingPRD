        distinguishing_aspect: |
          Depth-3 cascade: POST /missions/{id}/complete (link 1: mission ->
          COMPLETED, creates deliverable, increments grower acres) -> POST
          /deliverables/{id}/process (link 2: deliverable PROCESSING -> READY,
          creates ScoutingAlert on anomaly) -> Field.health_score recomputed
          (link 3: derived aggregate on a third entity). Trigger is mission
          completion, distinct from grower suspension.
        test_recipe:
          setup:
            - "Plan P; Grower G; Field F with initial health_score=100"
            - "Pilot H; Mission M CAPTURED with acres_flown=100"
