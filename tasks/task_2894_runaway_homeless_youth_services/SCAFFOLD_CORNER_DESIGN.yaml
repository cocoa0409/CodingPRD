        distinguishing_aspect: "The same RESTRICTED program admits a candidate scoring 94 - age 12 gives 24, a same-day contact flagged COMMERCIAL_SEX plus THIRD_PARTY_CONTROL scores 70 so the risk component caps at 40, one contact gives 5, zero prior nights gives 15 and the CRITICAL tier adds 10 - proving priority 42 is a floor test and not a blanket freeze."
        test_recipe:
          setup:
            - "an EMERGENCY_SHELTER program with licensed_bed_capacity 2, RESTRICTED because one notification went OVERDUE at the census run after the clock moved to 2026-08-03T00:00:00Z; one bed is still free"
