        grounds: ["entities.ServerInstance.fields.booked_minutes", "calculations.server_booked_minutes"]
        excluded_because:
          difficulty_instance: server_minutes_conserved_across_forfeit
          rationale: "booked_minutes is asserted before/after schedule and after forfeit in the named §1.8 instance and again at 150 in server_halfopen_buffer_adjacency."

  - section: consistency_model
    instances:
      - name: compute_response_reflects_writes_immediately
        claim_type: immediate
        grounds: ["complexity_profile.consistency_model", "endpoints.POST_/api/tournaments/{id}/payout-records/compute"]
        excluded_because:
          difficulty_instance: prize_pool_conserved_across_recompute
          rationale: "The named §1.8 instance reads record ids and gross values directly from the compute 201 response and cross-checks the follow-up list read in the same recipe."

  - section: errors
    instances:
      - name: double_roster_add_returns_player_double_rostered
        claim_type: violation_to_error
        grounds: ["validations[priority=8]", "errors[ERR_PLAYER_DOUBLE_ROSTERED]"]
        distinguishing_aspect: "A player holding an ACTIVE slot on r1 cannot be added to r2 for the same tournament: the cross-registration uniqueness check rejects with ERR_PLAYER_DOUBLE_ROSTERED (409)."
        test_recipe:
          setup: ["tournament REGISTRATION_OPEN; registrations r1, r2 in DRAFT; p1 already an ACTIVE STARTER on r1"]
          setup_api_calls:
            - { call: "POST /api/tournaments", payload: { name: "Dup Cup", game_title: "TacShooter", region: NA, prize_pool_target_cents: 100000, roster_size: 1, max_roster_size: 2, registration_opens_at: "2026-08-01T00:00:00Z", registration_closes_at: "2026-08-10T00:00:00Z", minor_curfew_local: "22:00" }, as: OrganizerAdmin, captures: { t: $.data.id } }
            - { call: "POST /api/tournaments/${t}/advance", payload: { target_status: REGISTRATION_OPEN }, as: TournamentDirector }
            - { call: "POST /api/players", payload: { handle: "p1", date_of_birth: "2000-01-01", region: NA }, as: OrganizerAdmin, captures: { p1: $.data.id } }
            - { call: "POST /api/players", payload: { handle: "p2", date_of_birth: "2000-02-02", region: NA }, as: OrganizerAdmin, captures: { p2: $.data.id } }
            - { call: "POST /api/registrations", payload: { tournament_id: "${t}", team_name: "Alpha", manager_contact_email: "a@x.gg", region_rank_points: 100, prior_event_points: 0, qualifier_wins: 0, captain_player_id: "${p1}" }, as: OrganizerAdmin, captures: { r1: $.data.id } }
            - { call: "POST /api/registrations", payload: { tournament_id: "${t}", team_name: "Beta", manager_contact_email: "b@x.gg", region_rank_points: 80, prior_event_points: 0, qualifier_wins: 0, captain_player_id: "${p2}" }, as: OrganizerAdmin, captures: { r2: $.data.id } }
            - { call: "POST /api/roster-slots", payload: { registration_id: "${r1}", player_id: "${p1}", slot_role: STARTER }, as: TeamManager, as_user_id: "${r1}" }
          trigger:
            - { call: "POST /api/roster-slots", payload: { registration_id: "${r2}", player_id: "${p1}", slot_role: SUBSTITUTE }, as: TeamManager, as_user_id: "${r2}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_PLAYER_DOUBLE_ROSTERED; no second slot exists for ${p1} in this tournament"

      - name: double_submit_returns_invalid_registration_status
        claim_type: violation_to_error
        grounds: ["validations[priority=6]", "errors[ERR_INVALID_REGISTRATION_STATUS]"]
        distinguishing_aspect: "Submit is a DRAFT-only transition: a second submit on a SUBMITTED registration is rejected with ERR_INVALID_REGISTRATION_STATUS (idempotency via state machine, not silent success)."
        test_recipe:
          setup: ["tournament REGISTRATION_OPEN; r1 SUBMITTED"]
          setup_api_calls:
            - { call: "POST /api/tournaments", payload: { name: "Twice Cup", game_title: "TacShooter", region: NA, prize_pool_target_cents: 100000, roster_size: 1, max_roster_size: 2, registration_opens_at: "2026-08-01T00:00:00Z", registration_closes_at: "2026-08-10T00:00:00Z", minor_curfew_local: "22:00" }, as: OrganizerAdmin, captures: { t: $.data.id } }
            - { call: "POST /api/tournaments/${t}/advance", payload: { target_status: REGISTRATION_OPEN }, as: TournamentDirector }
            - { call: "POST /api/players", payload: { handle: "p1", date_of_birth: "2000-01-01", region: NA }, as: OrganizerAdmin, captures: { p1: $.data.id } }
            - { call: "POST /api/registrations", payload: { tournament_id: "${t}", team_name: "Alpha", manager_contact_email: "a@x.gg", region_rank_points: 100, prior_event_points: 0, qualifier_wins: 0, captain_player_id: "${p1}" }, as: OrganizerAdmin, captures: { r1: $.data.id } }
            - { call: "POST /api/roster-slots", payload: { registration_id: "${r1}", player_id: "${p1}", slot_role: STARTER }, as: TeamManager, as_user_id: "${r1}" }
            - { call: "POST /api/registrations/${r1}/submit", payload: {}, as: TeamManager, as_user_id: "${r1}" }
          trigger:
            - { call: "POST /api/registrations/${r1}/submit", payload: {}, as: TeamManager, as_user_id: "${r1}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_REGISTRATION_STATUS; Registration.${r1}.status == SUBMITTED (unchanged)"

      - name: settle_tentative_booking_returns_invalid_booking_status
        claim_type: violation_to_error
        grounds: ["validations[priority=6]", "errors[ERR_INVALID_BOOKING_STATUS]", "state_machines.TalentBooking"]
        distinguishing_aspect: "SETTLE is valid only from CONFIRMED: settling a TENTATIVE booking is rejected with ERR_INVALID_BOOKING_STATUS and fee_final_cents stays null."
        test_recipe:
          setup: ["tournament exists; talent exists; booking b1 TENTATIVE"]
          setup_api_calls:
            - { call: "POST /api/tournaments", payload: { name: "Book Cup", game_title: "TacShooter", region: NA, prize_pool_target_cents: 100000, roster_size: 1, max_roster_size: 2, registration_opens_at: "2026-08-01T00:00:00Z", registration_closes_at: "2026-08-10T00:00:00Z", minor_curfew_local: "22:00" }, as: OrganizerAdmin, captures: { t: $.data.id } }
            - { call: "POST /api/talents", payload: { stage_name: "CasterY", home_region: NA, day_rate_cents: 80000 }, as: BroadcastProducer, captures: { tal: $.data.id } }
