            - call: "GET /otb/plan-months/${m1_id}"
              payload: {}
              as: CategoryBuyer
              as_user_id: "buyer-1"
              captures: { v3: $.data.version }
            - call: "POST /otb/receipt-commitments"
              payload: { plan_month_id: "${m1_id}", assortment_item_id: "${item_b}", vendor_id: "${vendor_b}", units: 400, unit_cost_cents: 2600, ship_window_start: "2026-10-01T00:00:00Z", ship_window_end: "2026-10-15T00:00:00Z", expected_plan_month_version: "${v3}" }
              as: CategoryBuyer
              as_user_id: "buyer-1"
              captures: { rc_b: $.data.id }
            - call: "POST /otb/receipt-commitments/${rc_b}/commit"
              payload: {}
