            - "observation 2 (after the waiver): gross_excess_cost_usd == 3005.10 (unchanged), excess_cost_waived_usd == 1200.00, excess_cost_due_usd == 1805.10"
            - "observation 3 (after the revocation): gross_excess_cost_usd == 3005.10 (unchanged), excess_cost_waived_usd == 0.00, excess_cost_due_usd == 3005.10"
            - "the invariant excess_cost_due_usd + excess_cost_waived_usd == gross_excess_cost_usd holds at all three observations"
            - "EntitlementAuthorization.${ent_id}.status == SUSPENDED throughout (1805.10 is still non-zero, so no automatic resume)"
            - "the third trigger call returns HTTP 409 with ${err} == ERR_NO_WAIVER_TO_REVOKE and leaves all three money fields at observation 3 values"
            - "EntitlementAuthorization.${ent_id}.excess_weight_lbs == 3000 and charged_billable_weight_lbs == 10000 at every observation"

      - name: award_release_restores_capacity_pools_without_drift
        grounds:
          - calculations.capacity_pool_allocation
          - endpoints[POST /hhg/capacity-blocks/{id}/release-award]
          - entities.CapacityBlock.fields.committed_general_lbs
          - entities.Shipment.fields.capacity_block_id
        distinguishing_aspect: >-
          A different conserved quantity — the block's capacity partition. Awarding 5286 lb and then
          releasing it must return committed_general_lbs and committed_lbs to 0 while
          general_pool_lbs (10200) and short_notice_pool_lbs (1800) never move, and re-awarding the
          same shipment must land on exactly 5286 again: pool sizes are derived from
          total_capacity_lbs, not decremented, so no rounding drift can accumulate over the cycle.
        test_recipe:
          setup:
            - "Clock at 2026-08-03T00:00:00Z; E6 member; entitlement AUTHORIZED with cap 11000 lb."
            - "Non-peak block: MKT-BWI, week 2026-10-05, total 12000 lb, reserve 0.15 -> general 10200 / short-notice 1800."
            - "Shipment requested_pickup_date 2026-10-07, surveyed to 5286 lb."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /hhg/service-members"
              payload: { dod_id: "1000001706", full_name: "Dana Reyes", rank_code: "E6", branch: "ARMY", email: "dana.reyes@example.mil", dependents_count: 2, spouse_present: true }
              as: MoveCounselor
              as_user_id: "counselor-01"
              captures: { m_id: $.data.id }
            - call: "POST /hhg/orders"
              payload: { service_member_id: "${m_id}", order_number: "ORD-2296-0022", move_type: "PCS_CONUS", issue_date: "2026-08-01T00:00:00Z", report_no_later_than_date: "2026-11-01T00:00:00Z", origin_duty_station: "FORT MEADE MD", destination_duty_station: "FORT CARSON CO", origin_market_code: "MKT-BWI", distance_miles: 1200 }
              as: MoveCounselor
              as_user_id: "counselor-01"
              captures: { o_id: $.data.id }
            - call: "POST /hhg/counseling-sessions"
              payload: { order_id: "${o_id}", session_type: "IN_PERSON", scheduled_at: "2026-08-05T00:00:00Z" }
              as: MoveCounselor
              as_user_id: "counselor-01"
              captures: { cs_id: $.data.id }
            - call: "POST /hhg/counseling-sessions/${cs_id}/complete"
              payload: { entitlement_briefed: true }
              as: MoveCounselor
              as_user_id: "counselor-01"
            - call: "GET /hhg/counseling-sessions/${cs_id}/entitlements"
              payload: {}
              as: MoveCounselor
              as_user_id: "counselor-01"
              captures: { ent_id: "$.data[0].id" }
            - call: "POST /hhg/entitlements/${ent_id}/authorize"
              payload: { admin_weight_bump_lbs: 0 }
              as: MoveCounselor
              as_user_id: "counselor-01"
              captures: { ent_v: $.data.version }
            - call: "POST /hhg/tsps"
              payload: { name: "Chesapeake Van Lines", scac_code: "CVLQ", markets: ["MKT-BWI"] }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { tsp_id: $.data.id }
            - call: "POST /hhg/shipments"
              payload: { order_id: "${o_id}", entitlement_id: "${ent_id}", tsp_id: "${tsp_id}", shipment_code: "SHP-0022", shipment_method: "HHG", origin_market_code: "MKT-BWI", requested_pack_date: "2026-10-06T00:00:00Z", requested_pickup_date: "2026-10-07T00:00:00Z", requested_delivery_date: "2026-10-14T00:00:00Z", expected_entitlement_version: "${ent_v}" }
              as: MoveCounselor
              as_user_id: "counselor-01"
              captures: { s_id: $.data.id }
            - call: "POST /hhg/shipments/${s_id}/survey"
              payload: { estimate_method: "CUBE_X7", room_estimates: [{ room_name: "KITCHEN", cube_feet: 143.5 }, { room_name: "LIVING_ROOM", cube_feet: 268.25 }, { room_name: "MASTER_BEDROOM", cube_feet: 210.5 }, { room_name: "GARAGE", cube_feet: 96.75 }] }
              as: TspCoordinator
              as_user_id: "${tsp_id}"
            - call: "POST /hhg/capacity-blocks"
              payload: { tsp_id: "${tsp_id}", market_code: "MKT-BWI", week_start_date: "2026-10-05T00:00:00Z", total_capacity_lbs: 12000, short_notice_reserve_pct: 0.15 }
              as: TspCoordinator
              as_user_id: "${tsp_id}"
              captures: { cb_id: $.data.id, cb_v: $.data.version }
          trigger:
            - call: "POST /hhg/capacity-blocks/${cb_id}/awards"
              payload: { shipment_id: "${s_id}", expected_capacity_block_version: "${cb_v}" }
              as: TspCoordinator
              as_user_id: "${tsp_id}"
            - call: "POST /hhg/capacity-blocks/${cb_id}/release-award"
              payload: { shipment_id: "${s_id}", release_reason: "Crew reassigned to another market" }
              as: TspCoordinator
              as_user_id: "${tsp_id}"
            - call: "GET /hhg/capacity-blocks/${cb_id}"
              payload: {}
              as: TspCoordinator
              as_user_id: "${tsp_id}"
              captures: { cb_v2: $.data.version }
            - call: "POST /hhg/capacity-blocks/${cb_id}/awards"
              payload: { shipment_id: "${s_id}", expected_capacity_block_version: "${cb_v2}" }
              as: TspCoordinator
              as_user_id: "${tsp_id}"
          assert:
            - "observation 1 (after the award): CapacityBlock.${cb_id}.committed_general_lbs == 5286, committed_short_notice_lbs == 0, committed_lbs == 5286, status == OPEN"
            - "observation 2 (after the release): committed_general_lbs == 0, committed_short_notice_lbs == 0, committed_lbs == 0, status == OPEN"
            - "observation 2: Shipment.${s_id}.capacity_block_id == null and movement_status == SURVEYED (the shipment is not cancelled by the release)"
            - "observation 3 (after re-awarding): committed_general_lbs == 5286 and committed_lbs == 5286 — exactly the observation-1 figures, no drift"
            - "general_pool_lbs == 10200 and short_notice_pool_lbs == 1800 and total_capacity_lbs == 12000 at all three observations"
            - "EntitlementAuthorization.${ent_id}.charged_billable_weight_lbs == 5286 at all three observations (capacity moves never touch the weight ledger)"
            - "GET /hhg/capacity-blocks/${cb_id}/shipments returns 1 row at observation 1, 0 rows at observation 2 and 1 row at observation 3"
