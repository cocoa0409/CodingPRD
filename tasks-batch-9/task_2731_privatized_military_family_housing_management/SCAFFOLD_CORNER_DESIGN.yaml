          assert:
            - "the first run returns HTTP 200 with ${o_epoch1} == 1 and ${o_last1} == 2026-08-25T00:00:00Z"
            - "${o_a2_status} == OFFERED and ${o_a2_unit} == ${u1_id} - the 2BR townhome went to the 2026-08-20 control date, not to sponsor 1"
            - "${o_a2_exp} == 2026-08-28T00:00:00Z and ${o_a2_count} == 1"
            - "${o_a3_status} == OFFERED and ${o_a3_unit} == ${u3_id} - the 3BR SFH went to the only application whose bedroom_eligibility equals 3 and whose rank_category equals SENIOR_ENLISTED"
            - "${o_a1_status} == PENDING and ${o_a1_unit} == null and ${o_a1_count} == 0 - sponsor 1 matched the 2BR pool but lost the ranking and no second unit of that size existed"
            - "${o_avail1} == 0 and ${o_assigned1} == 2 and ${o_pending1} == 1"
            - "the second run also returns HTTP 200 with ${o_epoch2} == 2 - an offer run over zero AVAILABLE units is a success, not an error"
            - "${o_avail2} == 0 and ${o_assigned2} == 2 and ${o_a1_status2} == PENDING with ${o_a1_count2} == 0 - the empty walk created no offer"

      - name: allotment_run_charges_only_active_leases_and_is_idempotent_per_period
        claim_type: input_set_filtering
        grounds:
          - calculations.allotment_charge_posting
          - endpoints.POST_/installations/{id}/allotment-run
          - entities.Lease.fields.allotment_status
          - entities.Lease.fields.allotment_balance_cents
        distinguishing_aspect: "The run posts one CHARGE row per ACTIVE lease and nothing else: the occupied lease is charged 218150 for 2026-09 while the second lease, still PENDING_MOVE_IN with allotment_status NOT_STARTED, receives no row at all; a repeat run for 2026-09 is a silent no-op; and a run for 2026-10 appends a second row that carries the running balance to 436300."
        test_recipe:
          setup:
            - "One installation (Fort Cavazos Family Housing, ARMY, TX-FTC, bill_of_rights_version 2026.1) carrying the five Installation defaults: turn_buffer_days 5, offer_response_hours 72, decline_limit 2, decline_penalty_days 15, incentive_base_pct 0.03."
            - "One BahRate row for pay_grade E5, with_dependents true, effective_year 2026: monthly_rate_cents 245000, utility_allowance_cents 19500."
            - "One unit A-101, 2 bedrooms, TOWNHOME, designated JUNIOR_ENLISTED, historic_flag false."
            - "One E5 sponsor (rank_category JUNIOR_ENLISTED) with three full-time-custody dependents - spouse born 1992-03-04 plus two boys born 2018-04-10 and 2022-03-15 - so bedroom_eligibility is 2 and dependent_count is 3."
            - "The application (pcs_orders_date 2026-08-25) was offered A-101 by the offer run, accepted it, and the lease starting 2026-09-01 for 12 months was written, inspected and acknowledged."
            - "The lease is OCCUPIED / ACTIVE after move-in at 2026-09-01T09:00:00Z with gross_rent_cents 237650, utility_allowance_cents 19500, net_rent_cents 218150 and daily_rent_cents 7172; the unit is OCCUPIED; the allotment ledger is empty."
            - "A second unit A-102 (2BR TOWNHOME, JUNIOR_ENLISTED) was added after the first tenancy and offered to a second E5 sponsor with three full-time-custody dependents, who accepted; that lease starting 2026-09-05 has been written but NOT moved into, so its occupancy_status is PENDING_MOVE_IN and its allotment_status is NOT_STARTED."
            - "The clock stands at 2026-09-01T09:00:00Z and no ledger row exists on either lease."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-25T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /installations"
              payload: { name: "Fort Cavazos Family Housing", branch: "ARMY", mha_code: "TX-FTC", bill_of_rights_version: "2026.1" }
              as: PlatformAdmin
              captures: { inst_id: "$.data.id" }
            - call: "POST /bah-rates"
              payload: { installation_id: "${inst_id}", pay_grade: "E5", with_dependents: true, effective_year: 2026, monthly_rate_cents: 245000, utility_allowance_cents: 19500 }
