            - { call: "POST /packinghouse/pools", payload: { variety: HAMLIN, week_start: "2026-07-27" }, as: PoolAccountant, captures: { qc_p: "$.data.id" } }
            - { call: "POST /packinghouse/crews", payload: { crew_code: "CR-QC1", daily_capacity_boxes: 400 }, as: PackinghouseAdmin, captures: { qc_c: "$.data.id" } }
            - { call: "POST /packinghouse/harvest-assignments", payload: { crew_id: "${qc_c}", grove_id: "${qc_g1}", window_start: "2026-08-01T06:00:00Z", window_end: "2026-08-01T18:00:00Z", planned_boxes: 100 }, as: FieldSupervisor, captures: { qc_a1: "$.data.id" } }
            - { call: "POST /packinghouse/_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T07:00:00Z" }, as: PackinghouseAdmin }
            - { call: "POST /packinghouse/harvest-assignments", payload: { crew_id: "${qc_c}", grove_id: "${qc_g1}", window_start: "2026-08-02T06:00:00Z", window_end: "2026-08-02T18:00:00Z", planned_boxes: 50 }, as: FieldSupervisor, captures: { qc_a2: "$.data.id" } }
