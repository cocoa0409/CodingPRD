              as: LegalCounsel
              as_user_id: "${legal_id}"
              captures: { doc_id: $.data.id }
            - call: "GET /disclosure/documents/${doc_id}"
              payload: {}
              as: Controller
              as_user_id: "${fin_id}"
              captures: { doc_v1: $.data.version }
            - call: "POST /disclosure/documents/${doc_id}/tie-out-items"
              payload: { line_label: "Total revenue", reported_value: 4120000, source_record_value: 4120000, tolerance_bp: 25, preparer_member_id: "${fin_id}", expected_document_version: "${doc_v1}" }
              as: Controller
