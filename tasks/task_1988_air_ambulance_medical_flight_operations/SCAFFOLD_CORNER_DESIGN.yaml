# =============================================================================
# Task 1988 — §1.9 Scaffold Corner Design (Coverage Index)
# Enumerative breadth over §1.1–§1.7 claims NOT covered by §1.8.
# Claim types/sections follow references/claim-extraction-guide.md.
# =============================================================================
scaffold_corner_design:
  # ================================================== Section: entities
  - section: entities
    instances:
      - name: aircraft_creation_applies_default_status
        claim_type: defaults
        grounds: [entities.Aircraft.fields.status]
        distinguishing_aspect: "Omitting status on aircraft registration yields status AVAILABLE and version 1; the client cannot pre-set ASSIGNED."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls:
            - { call: "POST /air-ambulance/bases", payload: { name: "Base A", region: "SW-US" }, as: OpsAdmin, captures: { base_id: "$.data.id" } }
          trigger:
            - { call: "POST /air-ambulance/aircraft", payload: { base_id: "${base_id}", tail_number: "N100DF", aircraft_class: "ROTOR_WING", medical_config: "ALS_CAPABLE" }, as: OpsAdmin, captures: { ac_id: "$.data.id", st: "$.data.status", v: "$.data.version" } }
          assert:
            - "st == AVAILABLE (default applied)"
            - "v == 1"
      - name: crew_member_missing_required_crew_role_returns_invalid_request
        claim_type: required_fields
        grounds: [entities.CrewMember.fields.crew_role, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "crew_role has source input with no default; omitting it must fail with ERR_VALIDATION (400)."
        test_recipe:
          setup: ["Base exists"]
          setup_api_calls:
            - { call: "POST /air-ambulance/bases", payload: { name: "Base A", region: "SW-US" }, as: OpsAdmin, captures: { base_id: "$.data.id" } }
          trigger:
            - { call: "POST /air-ambulance/crew-members", payload: { base_id: "${base_id}", full_name: "No Role" }, as: OpsAdmin, captures: { err: "$.data.error_id" } }
          assert:
            - "err == ERR_VALIDATION and HTTP status 400"
      - name: mission_request_computed_triage_score_present
        claim_type: computed_fields
        grounds: [entities.MissionRequest.fields.triage_acuity_score, calculations.patient_acuity_score]
        distinguishing_aspect: "triage_acuity_score is server-computed at intake: reported 1/2/3/4 yields 1*.30+2*.30+3*.20+4*.20 = 2.30 regardless of any client attempt to influence it."
        test_recipe:
          setup: ["Clock set; patient exists"]
          setup_api_calls:
            - { call: "POST /air-ambulance/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: OpsAdmin }
            - { call: "POST /air-ambulance/patients", payload: { full_name: "Comp Uted", date_of_birth: "1992-02-02", weight_kg: 75 }, as: Dispatcher, captures: { pat_id: "$.data.id" } }
          trigger:
            - { call: "POST /air-ambulance/mission-requests", payload: { patient_id: "${pat_id}", transport_class: "EMERGENCY_SCENE", origin_facility: "Scene", destination_facility: "County General", reported_cardio: 1, reported_resp: 2, reported_neuro: 3, reported_interventions: 4, onset_iso: "2026-07-31T20:00:00Z" }, as: Dispatcher, captures: { req_id: "$.data.id", score: "$.data.triage_acuity_score", st: "$.data.status" } }
          assert:
            - "score == 2.3 (computed by C2 triage variant)"
            - "st == RECEIVED (initial state)"
      - name: get_mission_request_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "Reading a mission request with a well-formed but nonexistent UUID yields ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /air-ambulance/mission-requests/00000000-0000-0000-0000-000000000000", as: Dispatcher, captures: { err: "$.data.error_id" } }
          assert:
            - "err == ERR_NOT_FOUND and HTTP status 404"
      - name: weather_assessment_immutable_record
        claim_type: immutability
        grounds: [entities.WeatherAssessment]
        distinguishing_aspect: "WeatherAssessment has common_fields false: the creation response exposes id and created_at but no version or updated_at, and no update endpoint exists in §1.5."
        test_recipe:
          setup: ["PLANNING ALS mission (rotor, pilot + nurse)"]
          setup_api_calls:
            - { call: "POST /air-ambulance/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: OpsAdmin }
            - { call: "POST /air-ambulance/bases", payload: { name: "Base A", region: "SW-US" }, as: OpsAdmin, captures: { base_id: "$.data.id" } }
            - { call: "POST /air-ambulance/aircraft", payload: { base_id: "${base_id}", tail_number: "N100IM", aircraft_class: "ROTOR_WING", medical_config: "CCT_CAPABLE" }, as: OpsAdmin, captures: { ac_id: "$.data.id" } }
            - { call: "POST /air-ambulance/crew-members", payload: { base_id: "${base_id}", full_name: "Pat Pilot", crew_role: "PILOT" }, as: OpsAdmin, captures: { pilot_id: "$.data.id" } }
            - { call: "POST /air-ambulance/crew-members", payload: { base_id: "${base_id}", full_name: "Nina Nurse", crew_role: "NURSE" }, as: OpsAdmin, captures: { nurse_id: "$.data.id" } }
            - { call: "POST /air-ambulance/patients", payload: { full_name: "Paul Patient", date_of_birth: "1980-04-12", weight_kg: 80 }, as: Dispatcher, captures: { pat_id: "$.data.id" } }
            - { call: "POST /air-ambulance/mission-requests", payload: { patient_id: "${pat_id}", transport_class: "EMERGENCY_SCENE", origin_facility: "Scene", destination_facility: "County General", reported_cardio: 8, reported_resp: 6, reported_neuro: 5, reported_interventions: 3, onset_iso: "2026-07-31T14:00:00Z" }, as: Dispatcher, captures: { req_id: "$.data.id" } }
            - { call: "POST /air-ambulance/mission-requests/${req_id}/triage", payload: { verified_cardio: 8, verified_resp: 6, verified_neuro: 5, verified_interventions: 3 }, as: MedicalDirector }
            - { call: "POST /air-ambulance/mission-requests/${req_id}/accept", payload: { aircraft_id: "${ac_id}", crew: [{ crew_member_id: "${pilot_id}", role_in_mission: "PILOT" }, { crew_member_id: "${nurse_id}", role_in_mission: "NURSE" }], estimated_loaded_miles: 40, planned_launch_iso: "2026-08-01T06:00:00Z", planned_duration_min: 120 }, as: Dispatcher, captures: { m_id: "$.data.id", m_v: "$.data.version" } }
          trigger:
            - { call: "POST /air-ambulance/weather-assessments", payload: { mission_id: "${m_id}", ceiling_ft: 1000, visibility_sm: 5.0, wind_kt: 10, precip: "NONE", day_night: "DAY", terrain: "FLAT", expected_mission_version: "${m_v}" }, as: FlightCrew, as_user_id: "${pilot_id}", captures: { wa_id: "$.data.id", dec: "$.data.decision" } }
          assert:
            - "wa_id is a server-minted UUID and the response carries created_at but no version/updated_at keys (common_fields: false)"
            - "dec == GO"
      - name: aircraft_invalid_enum_medical_config_returns_invalid_request
        claim_type: type_constraints
        grounds: [entities.Aircraft.fields.medical_config, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "medical_config is a closed enum; JET is not a member and must be rejected with ERR_VALIDATION."
        test_recipe:
          setup: ["Base exists"]
          setup_api_calls:
            - { call: "POST /air-ambulance/bases", payload: { name: "Base A", region: "SW-US" }, as: OpsAdmin, captures: { base_id: "$.data.id" } }
          trigger:
            - { call: "POST /air-ambulance/aircraft", payload: { base_id: "${base_id}", tail_number: "N100XX", aircraft_class: "ROTOR_WING", medical_config: "JET" }, as: OpsAdmin, captures: { err: "$.data.error_id" } }
          assert:
            - "err == ERR_VALIDATION and HTTP status 400"
      - name: list_mission_requests_pagination_envelope
        claim_type: listing
        grounds: [response_envelope.pagination_fields, response_envelope.pagination_defaults]
        distinguishing_aspect: "With 2 requests in the DB, GET /mission-requests with limit=1&offset=1 returns exactly 1 row, total_count == 2, has_more == false."
        test_recipe:
          setup: ["Patient with two mission requests"]
          setup_api_calls:
            - { call: "POST /air-ambulance/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: OpsAdmin }
            - { call: "POST /air-ambulance/patients", payload: { full_name: "Page Nate", date_of_birth: "1991-01-01", weight_kg: 70 }, as: Dispatcher, captures: { pat_id: "$.data.id" } }
            - { call: "POST /air-ambulance/mission-requests", payload: { patient_id: "${pat_id}", transport_class: "EMERGENCY_SCENE", origin_facility: "Scene A", destination_facility: "County General", reported_cardio: 1, reported_resp: 1, reported_neuro: 1, reported_interventions: 1, onset_iso: "2026-07-31T20:00:00Z" }, as: Dispatcher }
            - { call: "POST /air-ambulance/mission-requests", payload: { patient_id: "${pat_id}", transport_class: "EMERGENCY_SCENE", origin_facility: "Scene B", destination_facility: "County General", reported_cardio: 1, reported_resp: 1, reported_neuro: 1, reported_interventions: 1, onset_iso: "2026-07-31T20:00:00Z" }, as: Dispatcher }
          trigger:
            - { call: "GET /air-ambulance/mission-requests?limit=1&offset=1", as: Dispatcher }
          assert:
            - "Response envelope: response_type == array, meta.api_request_id present"
            - "data has exactly 1 element; pagination block reports total_count == 2 and has_more == false"
      - name: ground_leg_requires_existing_mission_fk
        claim_type: parent_relationships
        grounds: [entities.GroundTransportLeg.fields.mission_id, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "Flat-topology FK integrity: a ground leg referencing a nonexistent mission_id is rejected with ERR_NOT_FOUND (404), validated after auth."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /air-ambulance/ground-legs", payload: { mission_id: "00000000-0000-0000-0000-000000000000", leg_type: "ORIGIN", provider_name: "City EMS", scheduled_pickup_iso: "2026-08-01T09:00:00Z" }, as: Dispatcher, captures: { err: "$.data.error_id" } }
          assert:
            - "err == ERR_NOT_FOUND and HTTP status 404"
      - name: patient_system_fields_server_minted
        claim_type: system_fields
        grounds: [entities.Patient]
        distinguishing_aspect: "id and created_at are system-sourced: the creation response id is a server-minted UUID (not derivable from any input) and created_at is stamped from the logical clock (2026-08-01T00:00:00Z), and the §1.5 input list for POST /patients contains no id/created_at keys at all."
        test_recipe:
          setup: ["Clock set"]
          setup_api_calls:
            - { call: "POST /air-ambulance/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: OpsAdmin }
          trigger:
            - { call: "POST /air-ambulance/patients", payload: { full_name: "Sys Fields", date_of_birth: "2000-01-01", weight_kg: 60 }, as: Dispatcher, captures: { pid: "$.data.id", cat: "$.data.created_at" } }
          assert:
            - "pid matches the UUIDv4 shape and is non-null (server-minted)"
            - "cat == 2026-08-01T00:00:00Z (logical clock, not wall clock)"
            - "POST /air-ambulance/patients input schema is exactly [full_name, date_of_birth, weight_kg] — no client-writable id/created_at"

  # ================================================== Section: state_machines
  - section: state_machines
    instances:
      - name: membership_initial_state_active
        claim_type: initial_state
        grounds: [entities.MembershipSubscription.fields.status, state_machines.MembershipSubscription.ACTIVE_to_LAPSED]
        distinguishing_aspect: "A newly enrolled membership starts ACTIVE with lapsed_at null."
        test_recipe:
          setup: ["Patient exists"]
          setup_api_calls:
            - { call: "POST /air-ambulance/patients", payload: { full_name: "Mem Ber", date_of_birth: "1988-08-08", weight_kg: 70 }, as: Dispatcher, captures: { pat_id: "$.data.id" } }
          trigger:
            - { call: "POST /air-ambulance/memberships", payload: { patient_id: "${pat_id}", tier: "STANDARD", effective_from: "2026-08-01" }, as: BillingSpecialist, captures: { st: "$.data.status", lapsed: "$.data.lapsed_at" } }
          assert:
            - "st == ACTIVE and lapsed == null"
      - name: membership_terminated_lockdown_rejected
        claim_type: terminal_lockdown
        grounds: [state_machines.MembershipSubscription.ACTIVE_to_TERMINATED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "TERMINATED is terminal: PUT to ACTIVE afterwards fails with ERR_INVALID_STATE and no fields change."
        test_recipe:
          setup: ["ACTIVE membership"]
          setup_api_calls:
            - { call: "POST /air-ambulance/patients", payload: { full_name: "Mem Ber", date_of_birth: "1988-08-08", weight_kg: 70 }, as: Dispatcher, captures: { pat_id: "$.data.id" } }
            - { call: "POST /air-ambulance/memberships", payload: { patient_id: "${pat_id}", tier: "STANDARD", effective_from: "2026-08-01" }, as: BillingSpecialist, captures: { mem_id: "$.data.id" } }
            - { call: "PUT /air-ambulance/memberships/${mem_id}", payload: { status: "TERMINATED" }, as: BillingSpecialist }
          trigger:
            - { call: "PUT /air-ambulance/memberships/${mem_id}", payload: { status: "ACTIVE" }, as: BillingSpecialist, captures: { err: "$.data.error_id" } }
          assert:
            - "err == ERR_INVALID_STATE (409)"
            - "GET /air-ambulance/memberships/${mem_id} still shows TERMINATED"
      - name: ground_leg_skip_state_rejected
        claim_type: invalid_transition
        grounds: [state_machines.GroundTransportLeg.SCHEDULED_to_ENROUTE, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "SCHEDULED -> COMPLETED skips ENROUTE/AT_BEDSIDE and must be rejected with ERR_INVALID_STATE; the leg remains SCHEDULED."
        test_recipe:
          setup: ["PLANNING mission with a SCHEDULED ORIGIN leg"]
          setup_api_calls:
            - { call: "POST /air-ambulance/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: OpsAdmin }
            - { call: "POST /air-ambulance/bases", payload: { name: "Base A", region: "SW-US" }, as: OpsAdmin, captures: { base_id: "$.data.id" } }
            - { call: "POST /air-ambulance/aircraft", payload: { base_id: "${base_id}", tail_number: "N200GS", aircraft_class: "ROTOR_WING", medical_config: "CCT_CAPABLE" }, as: OpsAdmin, captures: { ac_id: "$.data.id" } }
            - { call: "POST /air-ambulance/crew-members", payload: { base_id: "${base_id}", full_name: "Pat Pilot", crew_role: "PILOT" }, as: OpsAdmin, captures: { pilot_id: "$.data.id" } }
            - { call: "POST /air-ambulance/crew-members", payload: { base_id: "${base_id}", full_name: "Nina Nurse", crew_role: "NURSE" }, as: OpsAdmin, captures: { nurse_id: "$.data.id" } }
            - { call: "POST /air-ambulance/patients", payload: { full_name: "Paul Patient", date_of_birth: "1980-04-12", weight_kg: 80 }, as: Dispatcher, captures: { pat_id: "$.data.id" } }
            - { call: "POST /air-ambulance/mission-requests", payload: { patient_id: "${pat_id}", transport_class: "EMERGENCY_INTERFACILITY", origin_facility: "St Mary", destination_facility: "County General", reported_cardio: 8, reported_resp: 6, reported_neuro: 5, reported_interventions: 3, onset_iso: "2026-07-31T14:00:00Z" }, as: Dispatcher, captures: { req_id: "$.data.id" } }
            - { call: "POST /air-ambulance/mission-requests/${req_id}/triage", payload: { verified_cardio: 8, verified_resp: 6, verified_neuro: 5, verified_interventions: 3 }, as: MedicalDirector }
            - { call: "POST /air-ambulance/mission-requests/${req_id}/accept", payload: { aircraft_id: "${ac_id}", crew: [{ crew_member_id: "${pilot_id}", role_in_mission: "PILOT" }, { crew_member_id: "${nurse_id}", role_in_mission: "NURSE" }], estimated_loaded_miles: 40, planned_launch_iso: "2026-08-01T06:00:00Z", planned_duration_min: 120 }, as: Dispatcher, captures: { m_id: "$.data.id" } }
            - { call: "POST /air-ambulance/ground-legs", payload: { mission_id: "${m_id}", leg_type: "ORIGIN", provider_name: "City EMS", scheduled_pickup_iso: "2026-08-01T05:30:00Z" }, as: Dispatcher, captures: { leg_id: "$.data.id" } }
          trigger:
            - { call: "PUT /air-ambulance/ground-legs/${leg_id}", payload: { status: "COMPLETED" }, as: Dispatcher, captures: { err: "$.data.error_id" } }
          assert:
            - "err == ERR_INVALID_STATE (409)"
            - "GroundTransportLeg.${leg_id}.status remains SCHEDULED"
      - name: mission_advance_skipping_states_rejected
        claim_type: invalid_transition
        grounds: [state_machines.Mission.PLANNING_to_LAUNCHED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "PLANNING -> IN_TRANSIT is not a declared transition; advance must reject with ERR_INVALID_STATE even though both states exist."
        test_recipe:
          setup: ["PLANNING mission"]
          setup_api_calls:
            - { call: "POST /air-ambulance/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: OpsAdmin }
            - { call: "POST /air-ambulance/bases", payload: { name: "Base A", region: "SW-US" }, as: OpsAdmin, captures: { base_id: "$.data.id" } }
            - { call: "POST /air-ambulance/aircraft", payload: { base_id: "${base_id}", tail_number: "N200SK", aircraft_class: "ROTOR_WING", medical_config: "CCT_CAPABLE" }, as: OpsAdmin, captures: { ac_id: "$.data.id" } }
            - { call: "POST /air-ambulance/crew-members", payload: { base_id: "${base_id}", full_name: "Pat Pilot", crew_role: "PILOT" }, as: OpsAdmin, captures: { pilot_id: "$.data.id" } }
            - { call: "POST /air-ambulance/crew-members", payload: { base_id: "${base_id}", full_name: "Nina Nurse", crew_role: "NURSE" }, as: OpsAdmin, captures: { nurse_id: "$.data.id" } }
            - { call: "POST /air-ambulance/patients", payload: { full_name: "Paul Patient", date_of_birth: "1980-04-12", weight_kg: 80 }, as: Dispatcher, captures: { pat_id: "$.data.id" } }
            - { call: "POST /air-ambulance/mission-requests", payload: { patient_id: "${pat_id}", transport_class: "EMERGENCY_SCENE", origin_facility: "Scene", destination_facility: "County General", reported_cardio: 8, reported_resp: 6, reported_neuro: 5, reported_interventions: 3, onset_iso: "2026-07-31T14:00:00Z" }, as: Dispatcher, captures: { req_id: "$.data.id" } }
            - { call: "POST /air-ambulance/mission-requests/${req_id}/triage", payload: { verified_cardio: 8, verified_resp: 6, verified_neuro: 5, verified_interventions: 3 }, as: MedicalDirector }
            - { call: "POST /air-ambulance/mission-requests/${req_id}/accept", payload: { aircraft_id: "${ac_id}", crew: [{ crew_member_id: "${pilot_id}", role_in_mission: "PILOT" }, { crew_member_id: "${nurse_id}", role_in_mission: "NURSE" }], estimated_loaded_miles: 40, planned_launch_iso: "2026-08-01T06:00:00Z", planned_duration_min: 120 }, as: Dispatcher, captures: { m_id: "$.data.id" } }
          trigger:
            - { call: "POST /air-ambulance/missions/${m_id}/advance", payload: { to_state: "IN_TRANSIT" }, as: FlightCrew, as_user_id: "${pilot_id}", captures: { err: "$.data.error_id" } }
          assert:
            - "err == ERR_INVALID_STATE (409)"
            - "Mission.${m_id}.status remains PLANNING"
      - name: insurance_authorization_deny_appeal_cycle
        claim_type: valid_transition
        grounds: [state_machines.InsuranceAuthorization.REQUESTED_to_DENIED, state_machines.InsuranceAuthorization.DENIED_to_APPEALED, state_machines.InsuranceAuthorization.APPEALED_to_APPROVED]
        distinguishing_aspect: "REQUESTED -> DENIED -> APPEALED -> APPROVED exercises the appeal cycle on InsuranceAuthorization; each hop returns 200 with the new status."
        test_recipe:
          setup: ["PLANNING mission; authorization REQUESTED"]
          setup_api_calls:
            - { call: "POST /air-ambulance/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: OpsAdmin }
            - { call: "POST /air-ambulance/bases", payload: { name: "Base A", region: "SW-US" }, as: OpsAdmin, captures: { base_id: "$.data.id" } }
            - { call: "POST /air-ambulance/aircraft", payload: { base_id: "${base_id}", tail_number: "N200IA", aircraft_class: "ROTOR_WING", medical_config: "CCT_CAPABLE" }, as: OpsAdmin, captures: { ac_id: "$.data.id" } }
            - { call: "POST /air-ambulance/crew-members", payload: { base_id: "${base_id}", full_name: "Pat Pilot", crew_role: "PILOT" }, as: OpsAdmin, captures: { pilot_id: "$.data.id" } }
            - { call: "POST /air-ambulance/crew-members", payload: { base_id: "${base_id}", full_name: "Nina Nurse", crew_role: "NURSE" }, as: OpsAdmin, captures: { nurse_id: "$.data.id" } }
            - { call: "POST /air-ambulance/patients", payload: { full_name: "Paul Patient", date_of_birth: "1980-04-12", weight_kg: 80 }, as: Dispatcher, captures: { pat_id: "$.data.id" } }
            - { call: "POST /air-ambulance/mission-requests", payload: { patient_id: "${pat_id}", transport_class: "SCHEDULED_INTERFACILITY", origin_facility: "Clinic West", destination_facility: "County General", reported_cardio: 2, reported_resp: 1, reported_neuro: 1, reported_interventions: 0, onset_iso: "2026-07-31T10:00:00Z" }, as: Dispatcher, captures: { req_id: "$.data.id" } }
            - { call: "POST /air-ambulance/mission-requests/${req_id}/triage", payload: { verified_cardio: 2, verified_resp: 1, verified_neuro: 1, verified_interventions: 0 }, as: MedicalDirector }
            - { call: "POST /air-ambulance/mission-requests/${req_id}/accept", payload: { aircraft_id: "${ac_id}", crew: [{ crew_member_id: "${pilot_id}", role_in_mission: "PILOT" }, { crew_member_id: "${nurse_id}", role_in_mission: "NURSE" }], estimated_loaded_miles: 30, planned_launch_iso: "2026-08-01T06:00:00Z", planned_duration_min: 90 }, as: Dispatcher, captures: { m_id: "$.data.id" } }
            - { call: "POST /air-ambulance/insurance-authorizations", payload: { mission_id: "${m_id}", payer_name: "Acme Health", policy_number: "POL-1" }, as: BillingSpecialist, captures: { ia_id: "$.data.id", s0: "$.data.status" } }
          trigger:
            - { call: "PUT /air-ambulance/insurance-authorizations/${ia_id}", payload: { status: "DENIED" }, as: BillingSpecialist, captures: { s1: "$.data.status" } }
            - { call: "PUT /air-ambulance/insurance-authorizations/${ia_id}", payload: { status: "APPEALED" }, as: BillingSpecialist, captures: { s2: "$.data.status" } }
            - { call: "PUT /air-ambulance/insurance-authorizations/${ia_id}", payload: { status: "APPROVED" }, as: BillingSpecialist, captures: { s3: "$.data.status" } }
          assert:
            - "s0 == REQUESTED (initial state)"
            - "s1 == DENIED, s2 == APPEALED, s3 == APPROVED (cycle traversed)"
      - name: bed_release_after_consumed_rejected
        claim_type: terminal_lockdown
        grounds: [state_machines.BedReservation.HELD_to_CONSUMED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "CONSUMED is terminal: a bed auto-consumed at mission completion cannot be released afterwards."
        test_recipe:
          setup: ["COMPLETED mission whose HELD bed was auto-consumed"]
          setup_api_calls:
            - { call: "POST /air-ambulance/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: OpsAdmin }
            - { call: "POST /air-ambulance/bases", payload: { name: "Base A", region: "SW-US" }, as: OpsAdmin, captures: { base_id: "$.data.id" } }
