  # ---------------------------------------------------------------------------
  # Rule 4 — transitive_cascade (different triggers)
  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: consummate_forgiveness_cascade_depth3
        grounds:
          - state_machines.RestructureProposal.APPROVED_to_CONSUMMATED
          - state_machines.WorkoutCase.NEGOTIATION_to_IMPAIRMENT_REVIEW
          - calculations.loss_given_default
        distinguishing_aspect: |
          Depth-3 cascade from the consummate trigger: consummate proposal
          (A) → books cascaded ChargeOffEvent (B) → recomputes
          Loan.current_principal_cents / charged_off (C) → recomputes
          Case.loss_given_default_cents (D). Each hop is caused by the
          previous mutation, not fanned out directly from the original request.
        test_recipe:
          setup:
            - "Case in NEGOTIATION with an APPROVED proposal carrying principal_forgiveness_cents = 4,000,000; loan current principal 60,000,000; no collateral (so LGD tracks principal exactly)"
          setup_api_calls:
            - call: "POST /borrowers"
              payload: { legal_name: "Greenfield Farms", tax_id: "55-5555555", naics_code: "111110", internal_risk_rating: 8, guarantor_name: "", guarantor_net_worth_cents: 0 }
              as: WorkoutOfficer
              captures: { bor_id: $.data.id }
            - call: "POST /loans"
              payload: { borrower_id: "${bor_id}", loan_number: "LN-7007", original_principal_cents: 60000000, contractual_rate_bps: 1050, days_past_due: 80 }
              as: WorkoutOfficer
              captures: { loan_id: $.data.id }
            - call: "POST /loans/${loan_id}/workout-cases"
              payload: { entry_trigger: "DELINQUENCY_60", risk_rating_at_entry: 8, case_officer_id: "officer-7" }
              as: WorkoutOfficer
              captures: { case_id: $.data.id, case_v: $.data.version }
            - call: "POST /loans/${loan_id}/workout-cases/${case_id}/action-plans"
              payload: { plan_text: "Restructure", target_resolution_date: "2027-06-01T00:00:00Z", milestone_count: 2, expected_case_version: "${case_v}" }
              as: WorkoutOfficer
              as_user_id: "officer-7"
              captures: { plan_id: $.data.id }
            - call: "POST /loans/${loan_id}/workout-cases/${case_id}/action-plans/${plan_id}/submit"
              payload: {}
              as: WorkoutOfficer
              as_user_id: "officer-7"
            - call: "POST /loans/${loan_id}/workout-cases/${case_id}/action-plans/${plan_id}/approve"
              payload: {}
              as: SpecialAssetsManager
              as_user_id: "mgr-7"
            - call: "GET /loans/${loan_id}/workout-cases/${case_id}"
              payload: {}
              as: WorkoutOfficer
              captures: { case_v2: $.data.version }
            - call: "POST /loans/${loan_id}/workout-cases/${case_id}/proposals"
              payload: { proposal_kind: "RESTRUCTURE", concession_rate_bps: 700, term_extension_months: 18, principal_forgiveness_cents: 4000000, borrower_concession_cents: 0, expected_case_version: "${case_v2}" }
              as: WorkoutOfficer
              as_user_id: "officer-7"
              captures: { prop_id: $.data.id }
            - call: "POST /loans/${loan_id}/workout-cases/${case_id}/proposals/${prop_id}/submit"
              payload: {}
              as: WorkoutOfficer
              as_user_id: "officer-7"
            - call: "POST /loans/${loan_id}/workout-cases/${case_id}/proposals/${prop_id}/escalate-to-committee"
              payload: {}
              as: WorkoutOfficer
              as_user_id: "officer-7"
            - call: "POST /loans/${loan_id}/workout-cases/${case_id}/proposals/${prop_id}/committee-approve"
              payload: {}
              as: CreditCommittee
              as_user_id: "cc-7"
          trigger:
            - call: "POST /loans/${loan_id}/workout-cases/${case_id}/proposals/${prop_id}/consummate"
              payload: {}
              as: WorkoutOfficer
              as_user_id: "officer-7"
          assert:
            - "RestructureProposal.${prop_id}.status == CONSUMMATED and tdr_flag == true (concession + difficulty)"
            - "Hop 1: cascaded ChargeOffEvent exists with amount_cents == 4000000 and reason_code == PARTIAL_IMPAIRMENT (visible via GET charge-offs)"
            - "Hop 2: Loan.current_principal_cents == 56000000 and Loan.charged_off_principal_cents == 4000000"
            - "Hop 3: WorkoutCase.${case_id}.loss_given_default_cents == 56000000 (no collateral) and status == IMPAIRMENT_REVIEW and tdr_status == TDR_CONFIRMED"
            - "Loan.is_tdr == true"

      - name: guarantor_settle_cascade_depth2
        grounds:
          - state_machines.LegalReferral.ACTIVE_to_SETTLED
          - calculations.recovery_allocation
          - calculations.loss_given_default
        distinguishing_aspect: |
          Depth-2 cascade from a DIFFERENT trigger (counsel settle, not
          consummate): settle GUARANTOR_PURSUITS referral (A) → synthesizes a
          RecoveryEvent with CHRONOLOGICAL allocation (B) → that allocation
          mutates Loan balances and recomputes Case.loss_given_default_cents
          (C). The recovery is caused by the settle, and the rebalance is
          caused by the recovery.
        test_recipe:
          setup:
            - "Borrower with guarantor net worth 30,000,000; loan 50,000,000 current, 10,000,000 already charged off; case in LEGAL with an ACTIVE GUARANTOR_PURSUITS referral demanding 8,000,000"
          setup_api_calls:
