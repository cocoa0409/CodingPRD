# =============================================================================
# DMV Driver Licensing & Road Test — benchmark seed tables (Expert tier)
# =============================================================================

scenario: |
  DMV Driver Licensing & Road Test: knowledge-test scheduling, road-test
  appointment/examiner, license issuance/renewal, REAL ID document verification,
  point accumulation & suspension, CDL endorsements/medical card, reinstatement,
  organ-donor/voter opt-in

domain_name: dmv-driver-licensing
api_prefix: ""   # flat topology: collections live at root (/driver-records, /examiners, /violations, ...); no single hub prefix

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: posture_driven_gating
  complexity_layers:
    - dual_variant_calculation
    - rate_threshold_triggers
    - cascading_side_effects
    - scheduled_deferred_actions
    - derived_field_reconciliation

  entity_topology: flat
  # DriverRecord is the hub; KnowledgeTest, RoadTestAppointment, License, Violation,
  # Suspension, CdlEndorsement, MedicalCard, FeePayment are peer spokes each carrying a
  # driver_record_id FK. FK reverse-reachability is served by sub-resource list GETs.

  state_machine_shape: cyclic
  # DriverRecord.licensing_status cycles ACTIVE -> SUSPENDED -> ACTIVE through the
  # suspension/reinstatement loop, and carries a PARALLEL cdl_status dimension
  # (NONE/ACTIVE/MEDICALLY_DOWNGRADED) that evolves independently of licensing_status.

  relationship_patterns:
    - one_to_many       # DriverRecord 1:N spokes
    - cross_aggregate   # Suspension reads DriverRecord.point_balance; License reads RoadTestAppointment.outcome

  role_model: segregation_of_duties
  # The Examiner who scored a RoadTestAppointment cannot be the LicenseClerk issuing the
  # resulting License; the AdjudicationOfficer dismissing a Suspension cannot be the officer
  # who recorded the triggering Violation.

  consistency_model: immediate

# =============================================================================
# Table 1: Entity-Relationship Table
# =============================================================================
entities:
  - name: DriverRecord
    parent: null
    common_fields: true   # id, created_at, updated_at, version
    fields:
      - { name: full_name, type: string, source: input, description: "Driver full legal name" }
      - { name: date_of_birth, type: string, source: input, description: "ISO date YYYY-MM-DD; age derived against AGE_REFERENCE_YEAR for fee/eligibility" }
      - { name: state_code, type: string, source: input, description: "Two-letter issuing state code, e.g. CA" }
      - { name: licensing_status, type: enum, source: system, default: "UNLICENSED", description: "Licensing track: UNLICENSED -> ELIGIBLE -> ACTIVE -> SUSPENDED -> ACTIVE (cycle) / REVOKED (terminal)" }
      - { name: cdl_status, type: enum, source: system, default: "NONE", description: "Parallel commercial track: NONE -> ACTIVE -> MEDICALLY_DOWNGRADED -> ACTIVE; independent of licensing_status" }
      - { name: point_balance, type: integer, source: computed, default: 0, description: "Sum of points of Violations with status==ACTIVE occurred within POINT_WINDOW_PERIODS (inclusive) of current clock; recomputed on violation add/dismiss/expire and clock advance" }
      - { name: prior_suspension_count, type: integer, source: computed, default: 0, description: "Count of this record's Suspensions with status IN {SERVED, LIFTED_BY_REINSTATEMENT}; feeds suspension_duration multiplier and revocation threshold" }
      - { name: knowledge_test_passed, type: boolean, source: computed, default: false, description: "True once a KnowledgeTest with status==PASSED exists for this record within KNOWLEDGE_VALIDITY_PERIODS of current clock" }
      - { name: real_id_status, type: enum, source: computed, default: "NONE", description: "NONE -> SUBMITTED -> APPROVED / REJECTED; set by real-id-submit/adjudicate actions" }
      - { name: real_id_categories_met, type: integer, source: computed, default: 0, description: "Distinct count of required REAL ID categories {IDENTITY, RESIDENCY, SSN} covered by last submitted documents" }
      - { name: organ_donor, type: boolean, source: input, default: false, description: "Organ-donor opt-in flag" }
      - { name: voter_registration_opt_in, type: boolean, source: input, default: false, description: "Motor-voter opt-in flag" }

  - name: Examiner
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Examiner name" }
      - { name: certified_classes, type: array, source: input, description: "Enum list of license classes this examiner may proctor, e.g. [D, M]" }
      - { name: opaque_user_id, type: string, source: input, description: "Operator login id used as X-User-ID when acting as Examiner" }

  - name: KnowledgeTest
    parent: null
    common_fields: true
    fields:
      - { name: driver_record_id, type: string, source: input, description: "FK -> DriverRecord.id" }
      - { name: scheduled_period, type: integer, source: input, description: "Clock period (day index) of the sitting; must be >= current clock at booking" }
      - { name: total_questions, type: integer, source: input, default: 40, description: "Number of questions on the sitting" }
      - { name: correct_answers, type: integer, source: input, required: false, description: "Correct count submitted at grading; 0..total_questions" }
      - { name: score_pct, type: number, source: computed, description: "= round(correct_answers / total_questions * 100, 2); set on grade" }
      - { name: status, type: enum, source: system, default: "SCHEDULED", description: "SCHEDULED -> PASSED (terminal) / FAILED; FAILED -> SCHEDULED via reschedule" }

  - name: RoadTestAppointment
    parent: null
    common_fields: true
    fields:
      - { name: driver_record_id, type: string, source: input, description: "FK -> DriverRecord.id" }
      - { name: examiner_id, type: string, source: input, description: "FK -> Examiner.id" }
      - { name: license_class, type: enum, source: input, description: "Target class: D (regular) | M (motorcycle) | A | B | C (commercial)" }
      - { name: slot_start_period, type: integer, source: input, description: "Inclusive start of the examiner time slot (day-period index)" }
      - { name: slot_end_period, type: integer, source: input, description: "Exclusive end of the examiner time slot; must be > slot_start_period" }
      - { name: maneuver_scores, type: array, source: input, required: false, description: "List of {maneuver, weight, auto_score} (proctor) or {maneuver, weight, score} (score) objects" }
      - { name: provisional_score, type: number, source: computed, description: "Weighted auto score = round(sum(weight*auto_score)/sum(weight),2); set on PROCTORED. Advisory only." }
      - { name: final_score, type: number, source: computed, description: "Weighted score over examiner-adjusted maneuver scores; set on SCORED. Decides outcome." }
      - { name: outcome, type: enum, source: computed, description: "PASS if final_score >= ROAD_PASS_THRESHOLD else FAIL; set on SCORED" }
      - { name: scored_by_examiner_id, type: string, source: system, description: "Examiner.id (from X-User-ID) that scored this appointment; segregation-of-duties source for license issuance" }
      - { name: status, type: enum, source: system, default: "BOOKED", description: "BOOKED -> PROCTORED -> SCORED (terminal) ; BOOKED -> CANCELLED (terminal)" }

  - name: License
    parent: null
    common_fields: true
    fields:
      - { name: driver_record_id, type: string, source: input, description: "FK -> DriverRecord.id" }
      - { name: road_test_appointment_id, type: string, source: input, required: false, description: "FK -> RoadTestAppointment.id; the passing road test that authorized issuance (null for renewals)" }
      - { name: license_class, type: enum, source: input, description: "D | M | A | B | C" }
      - { name: is_real_id, type: boolean, source: input, default: false, description: "Whether this license is REAL ID compliant; requires DriverRecord.real_id_status==APPROVED" }
      - { name: issued_period, type: integer, source: computed, description: "Clock period at issuance/renewal" }
      - { name: expiry_period, type: integer, source: computed, description: "= issued_period + LICENSE_TERM_PERIODS" }
      - { name: fee_cents, type: integer, source: computed, description: "Issuance or renewal fee in cents, per renewal_fee calc" }
      - { name: status, type: enum, source: system, default: "ISSUED", description: "ISSUED -> RENEWED (superseded by newer) / VOID (on record revocation)" }

  - name: Violation
    parent: null
    common_fields: true
    fields:
      - { name: driver_record_id, type: string, source: input, description: "FK -> DriverRecord.id" }
      - { name: code, type: string, source: input, description: "Moving-violation code, e.g. SPEEDING_20_OVER" }
      - { name: points, type: integer, source: input, description: "Point value of the violation (positive integer)" }
      - { name: occurred_period, type: integer, source: input, description: "Clock period the offense occurred; must be <= current clock" }
      - { name: recorded_by_officer, type: string, source: system, description: "X-User-ID of the AdjudicationOfficer who recorded it; segregation-of-duties source for suspension dismissal" }
      - { name: status, type: enum, source: system, default: "ACTIVE", description: "ACTIVE -> EXPIRED (system, older than POINT_WINDOW_PERIODS) / DISMISSED (officer)" }

  - name: Suspension
    parent: null
    common_fields: true
    fields:
      - { name: driver_record_id, type: string, source: input, description: "FK -> DriverRecord.id" }
      - { name: triggering_violation_id, type: string, source: input, required: false, description: "FK -> Violation.id; the Violation whose posting pushed point_balance over threshold" }
      - { name: point_balance_at_start, type: integer, source: computed, description: "Snapshot of DriverRecord.point_balance when the suspension opened" }
      - { name: start_period, type: integer, source: computed, description: "Clock period the suspension opened" }
      - { name: duration_days, type: integer, source: computed, description: "Per suspension_duration calc; tiered by point_balance_at_start and prior_suspension_count" }
      - { name: eligible_period, type: integer, source: computed, description: "= start_period + duration_days; reinstatement allowed only when current clock >= eligible_period" }
      - { name: point_balance_at_reinstatement, type: integer, source: computed, description: "Snapshot of DriverRecord.point_balance at reinstatement; drives reinstatement_fee" }
      - { name: reinstatement_fee, type: number, source: computed, description: "Fee in dollars charged at reinstatement, per reinstatement_fee calc (per-component rounding)" }
      - { name: status, type: enum, source: system, default: "ACTIVE", description: "ACTIVE -> SERVED (clock reached eligible_period) -> LIFTED_BY_REINSTATEMENT; ACTIVE -> LIFTED_BY_DISMISSAL (early, violation overturned)" }

  - name: CdlEndorsement
    parent: null
    common_fields: true
    fields:
      - { name: driver_record_id, type: string, source: input, description: "FK -> DriverRecord.id" }
      - { name: endorsement_code, type: enum, source: input, description: "H (hazmat) | P (passenger) | S (school bus) | N (tank) | T (double/triple)" }
      - { name: status, type: enum, source: system, default: "GRANTED", description: "GRANTED -> SUSPENDED (medical downgrade) -> GRANTED (medical reinstated) / WITHDRAWN (terminal)" }

  - name: MedicalCard
    parent: null
    common_fields: true
    fields:
      - { name: driver_record_id, type: string, source: input, description: "FK -> DriverRecord.id" }
      - { name: issued_period, type: integer, source: input, description: "Clock period the medical examiner certified the card" }
      - { name: valid_through_period, type: integer, source: input, description: "Inclusive last valid clock period; CDL downgrades when current clock > this and no newer VALID card" }
      - { name: status, type: enum, source: system, default: "VALID", description: "VALID -> EXPIRED (system, current clock > valid_through_period) / SUPERSEDED (newer VALID card filed)" }

  - name: FeePayment
    parent: null
    common_fields: true
    fields:
      - { name: driver_record_id, type: string, source: input, description: "FK -> DriverRecord.id" }
      - { name: purpose, type: enum, source: input, description: "RENEWAL | REINSTATEMENT | ROAD_TEST | KNOWLEDGE_TEST" }
      - { name: amount_cents, type: integer, source: input, description: "Amount tendered, in cents" }
      - { name: status, type: enum, source: system, default: "CAPTURED", description: "CAPTURED (terminal); a fiscal check consumes the most-recent CAPTURED payment of a matching purpose" }

# =============================================================================
# Table 2: State Machine Table
# =============================================================================
state_machines:
  # --- DriverRecord: cyclic licensing_status track + PARALLEL cdl_status track ---
  - entity: DriverRecord
    initial_state: UNLICENSED
    terminal_states: [REVOKED]
    note: |
      Two INDEPENDENT dimensions on one row. Transitions tagged [LICENSING] read/write only
      licensing_status; transitions tagged [CDL] read/write only cdl_status — EXCEPT the single
      sanctioned cross-dimension guard NONE->ACTIVE (granting the first endorsement reads
      licensing_status). The cycle is ACTIVE -> SUSPENDED -> ACTIVE on the LICENSING track.
    transitions:
      - from: UNLICENSED
        to: ELIGIBLE
        trigger: "system (automatic on KnowledgeTest grade -> PASSED)"
        actor: system
        preconditions:
          - "licensing_status == UNLICENSED [LICENSING]"
          - "A KnowledgeTest reached PASSED within KNOWLEDGE_VALIDITY_PERIODS"
        side_effects:
          - "knowledge_test_passed recomputed to true"

      - from: ELIGIBLE
        to: ACTIVE
        trigger: "POST /licenses (issuance)"
        actor: LicenseClerk
        preconditions:
          - "licensing_status == ELIGIBLE [LICENSING] (ERR_RECORD_NOT_ELIGIBLE)"
          - "Referenced RoadTestAppointment.outcome == PASS (ERR_ROAD_TEST_NOT_PASSED)"
          - "Acting X-User-ID != RoadTestAppointment.scored_by_examiner_id (ERR_SEGREGATION_OF_DUTIES)"
          - "If is_real_id: DriverRecord.real_id_status == APPROVED (ERR_REAL_ID_NOT_VERIFIED)"
          - "A CAPTURED RENEWAL FeePayment >= fee_cents exists (ERR_RENEWAL_FEE_UNPAID)"
        side_effects:
          - "License created status ISSUED; issued_period, expiry_period, fee_cents computed"
          - "licensing_status -> ACTIVE; increments DriverRecord.version by 1"

      - from: ACTIVE
        to: SUSPENDED
        trigger: "system (automatic when point_balance >= SUSPENSION_POINT_THRESHOLD after a Violation is posted)"
        actor: system
        preconditions:
          - "licensing_status == ACTIVE [LICENSING]"
          - "point_balance >= SUSPENSION_POINT_THRESHOLD (12)"
        side_effects:
          - "Suspension created: point_balance_at_start snapshot, start_period=clock, duration_days + eligible_period computed (suspension_duration), status ACTIVE"
          - "licensing_status -> SUSPENDED"

      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /suspensions/{id}/reinstate (fee-paid, OCC-guarded)"
        actor: LicenseClerk
        preconditions:
          - "licensing_status == SUSPENDED [LICENSING] (ERR_RECORD_NOT_SUSPENDED)"
          - "Suspension.status == SERVED, i.e. current clock >= eligible_period (ERR_NOT_YET_ELIGIBLE)"
          - "A CAPTURED REINSTATEMENT FeePayment >= round(reinstatement_fee*100) exists (ERR_REINSTATEMENT_FEE_UNPAID)"
        side_effects:
          - "point_balance_at_reinstatement snapshot; reinstatement_fee computed"
          - "Suspension.status SERVED -> LIFTED_BY_REINSTATEMENT"
          - "prior_suspension_count recomputed (now counts this suspension)"
          - "licensing_status -> ACTIVE (CYCLE CLOSES); increments DriverRecord.version by 1"

      - from: SUSPENDED
        to: REVOKED
        trigger: "POST /driver-records/{id}/revoke"
        actor: AdjudicationOfficer
        preconditions:
          - "licensing_status == SUSPENDED [LICENSING] (ERR_RECORD_NOT_SUSPENDED)"
          - "prior_suspension_count >= REVOCATION_PRIOR_THRESHOLD (3) (ERR_REVOCATION_THRESHOLD_NOT_MET)"
        side_effects:
          - "licensing_status -> REVOKED (terminal)"
          - "All Licenses with status ISSUED -> VOID (cascade)"
          - "All CdlEndorsements with status GRANTED/SUSPENDED -> WITHDRAWN (cascade)"
          - "increments DriverRecord.version by 1"

      # --- parallel CDL dimension ---
      - from: NONE
        to: ACTIVE
        trigger: "POST /cdl-endorsements (first endorsement granted)"
        actor: LicenseClerk
        preconditions:
          - "cdl_status == NONE [CDL]"
          - "A MedicalCard with status VALID and valid_through_period >= current clock exists (ERR_NO_VALID_MEDICAL_CARD)"
          - "licensing_status == ACTIVE [cross-dimension guard] (ERR_RECORD_NOT_ACTIVE)"
        side_effects:
          - "cdl_status -> ACTIVE"

      - from: ACTIVE
        to: MEDICALLY_DOWNGRADED
        trigger: "system (automatic on clock advance when no VALID MedicalCard covers current clock)"
        actor: system
        preconditions:
          - "cdl_status == ACTIVE [CDL]"
          - "No MedicalCard with status VALID and valid_through_period >= current clock"
        side_effects:
          - "cdl_status -> MEDICALLY_DOWNGRADED"
          - "All CdlEndorsements with status GRANTED -> SUSPENDED (cascade)"

      - from: MEDICALLY_DOWNGRADED
        to: ACTIVE
        trigger: "POST /driver-records/{id}/cdl-reinstate (after a new valid card is filed)"
        actor: LicenseClerk
        preconditions:
          - "cdl_status == MEDICALLY_DOWNGRADED [CDL] (ERR_CDL_NOT_DOWNGRADED)"
          - "A MedicalCard with status VALID and valid_through_period >= current clock exists (ERR_NO_VALID_MEDICAL_CARD)"
        side_effects:
          - "cdl_status -> ACTIVE"
          - "All CdlEndorsements with status SUSPENDED -> GRANTED (cascade)"

  # --- KnowledgeTest: branching with revert (FAILED -> SCHEDULED loop) ---
  - entity: KnowledgeTest
    initial_state: SCHEDULED
    terminal_states: [PASSED]
    transitions:
      - from: SCHEDULED
        to: PASSED
        trigger: "POST /knowledge-tests/{id}/grade with correct_answers"
        actor: KnowledgeProctor
        preconditions:
          - "status == SCHEDULED (ERR_TEST_NOT_SCHEDULED)"
          - "current clock >= scheduled_period (ERR_TEST_NOT_YET_DUE)"
          - "score_pct >= KNOWLEDGE_PASS_THRESHOLD (80)"
        side_effects:
          - "score_pct computed and stored"
          - "On first PASS in validity window: DriverRecord.knowledge_test_passed=true; UNLICENSED record -> ELIGIBLE"

      - from: SCHEDULED
        to: FAILED
        trigger: "POST /knowledge-tests/{id}/grade with correct_answers"
        actor: KnowledgeProctor
        preconditions:
          - "status == SCHEDULED (ERR_TEST_NOT_SCHEDULED)"
          - "current clock >= scheduled_period (ERR_TEST_NOT_YET_DUE)"
          - "score_pct < KNOWLEDGE_PASS_THRESHOLD (80)"
        side_effects:
          - "score_pct computed and stored"

      - from: FAILED
        to: SCHEDULED
        trigger: "POST /knowledge-tests/{id}/reschedule with new scheduled_period"
        actor: KnowledgeProctor
        preconditions:
          - "status == FAILED (ERR_TEST_NOT_FAILED)"
          - "new scheduled_period >= current clock + KNOWLEDGE_RETAKE_COOLDOWN (ERR_RETAKE_COOLDOWN)"
        side_effects:
          - "scheduled_period updated; correct_answers and score_pct cleared"

  # --- RoadTestAppointment: linear booking lifecycle + cancel branch ---
  - entity: RoadTestAppointment
    initial_state: BOOKED
    terminal_states: [SCORED, CANCELLED]
    transitions:
      - from: BOOKED
        to: PROCTORED
        trigger: "POST /road-test-appointments/{id}/proctor with maneuver_scores"
        actor: Examiner
        preconditions:
          - "status == BOOKED (ERR_APPT_NOT_BOOKED)"
          - "Acting Examiner.id == appointment.examiner_id (ERR_EXAMINER_MISMATCH)"
          - "current clock >= slot_start_period (ERR_SLOT_NOT_STARTED)"
          - "DriverRecord.knowledge_test_passed == true (ERR_KNOWLEDGE_TEST_REQUIRED)"
        side_effects:
          - "provisional_score computed (road_test_score provisional variant); scored_by_examiner_id set; status -> PROCTORED"

      - from: PROCTORED
        to: SCORED
        trigger: "POST /road-test-appointments/{id}/score with adjusted maneuver_scores"
        actor: Examiner
        preconditions:
          - "status == PROCTORED (ERR_APPT_NOT_PROCTORED)"
          - "Acting Examiner.id == appointment.examiner_id (ERR_EXAMINER_MISMATCH)"
        side_effects:
          - "final_score computed (road_test_score final variant); outcome = PASS if final_score >= ROAD_PASS_THRESHOLD else FAIL; status -> SCORED"

      - from: BOOKED
        to: CANCELLED
        trigger: "POST /road-test-appointments/{id}/cancel"
        actor: Examiner
        preconditions:
          - "status == BOOKED (ERR_APPT_NOT_BOOKED)"
        side_effects:
          - "status -> CANCELLED; examiner slot freed for reuse"

  # --- Suspension: ACTIVE -> SERVED -> LIFTED_BY_REINSTATEMENT, with early LIFTED_BY_DISMISSAL branch ---
  - entity: Suspension
    initial_state: ACTIVE
    terminal_states: [LIFTED_BY_REINSTATEMENT, LIFTED_BY_DISMISSAL]
    transitions:
      - from: ACTIVE
        to: SERVED
        trigger: "system (automatic on clock advance when current clock >= eligible_period)"
        actor: system
        preconditions:
          - "status == ACTIVE"
          - "current clock >= eligible_period"
        side_effects:
          - "status -> SERVED (record now reinstatable on fee payment)"

      - from: SERVED
        to: LIFTED_BY_REINSTATEMENT
        trigger: "POST /suspensions/{id}/reinstate"
        actor: LicenseClerk
        preconditions:
          - "status == SERVED (ERR_SUSPENSION_NOT_SERVED)"
        side_effects:
          - "status -> LIFTED_BY_REINSTATEMENT; DriverRecord.licensing_status -> ACTIVE; prior_suspension_count recomputed"

      - from: ACTIVE
        to: LIFTED_BY_DISMISSAL
        trigger: "POST /suspensions/{id}/dismiss"
        actor: AdjudicationOfficer
        preconditions:
          - "status == ACTIVE (ERR_SUSPENSION_NOT_ACTIVE)"
          - "triggering_violation_id present and that Violation.status == DISMISSED (ERR_VIOLATION_NOT_DISMISSED)"
          - "Acting X-User-ID != triggering Violation.recorded_by_officer (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "status -> LIFTED_BY_DISMISSAL (no fee); DriverRecord.licensing_status -> ACTIVE; prior_suspension_count NOT incremented"
        note: "Compensating action: restores licensing_status without charging a reinstatement fee, conserving the record's fee ledger."

  # --- Violation: append-once lifecycle, ACTIVE -> EXPIRED (system) / DISMISSED (officer) ---
  - entity: Violation
    initial_state: ACTIVE
    terminal_states: [EXPIRED, DISMISSED]
    transitions:
      - from: ACTIVE
        to: EXPIRED
        trigger: "system (automatic on clock advance when (current clock - occurred_period) > POINT_WINDOW_PERIODS)"
        actor: system
        preconditions:
          - "status == ACTIVE"
          - "(current clock - occurred_period) > POINT_WINDOW_PERIODS"
        side_effects:
          - "Violation drops out of DriverRecord.point_balance (point_balance recomputed)"

      - from: ACTIVE
        to: DISMISSED
        trigger: "POST /violations/{id}/dismiss"
        actor: AdjudicationOfficer
        preconditions:
          - "status == ACTIVE (ERR_VIOLATION_NOT_ACTIVE — already EXPIRED/DISMISSED)"
        side_effects:
          - "Violation drops out of DriverRecord.point_balance (point_balance recomputed)"

  # --- MedicalCard: VALID -> EXPIRED (system) / SUPERSEDED (newer card) ---
  - entity: MedicalCard
    initial_state: VALID
    terminal_states: [EXPIRED, SUPERSEDED]
    transitions:
      - from: VALID
        to: EXPIRED
        trigger: "system (automatic on clock advance when current clock > valid_through_period)"
        actor: system
        preconditions:
          - "status == VALID"
          - "current clock > valid_through_period"
        side_effects:
          - "If the record then has no VALID card covering the clock and cdl_status==ACTIVE: cdl_status -> MEDICALLY_DOWNGRADED and GRANTED endorsements -> SUSPENDED (cascade)"

      - from: VALID
        to: SUPERSEDED
        trigger: "POST /medical-cards (a newer card is filed for the same record)"
        actor: LicenseClerk
        preconditions:
          - "status == VALID"
        side_effects:
          - "The newer MedicalCard becomes the active VALID card"

# =============================================================================
# Concurrency Rules (§1.2.1) — true CREATE-with-supersede races, OCC-resolved
# =============================================================================
concurrency_rules:
  - rule_id: license-renewal-stale-record
    parent_entity: DriverRecord
    write_endpoint: "POST /licenses/renew"
    occ_field: "expected_driver_record_version"
    description: |
      Renewing a License against a DriverRecord whose version has advanced
      since the client last observed it is rejected. A renewal mints a new
      License that supersedes the prior one (prior -> RENEWED); if another
      writer has already renewed (bumping the record version via the renewal
      side-effects), the current writer's view of which License is current is
      stale.
    error_id: ERR_STALE_RECORD_VERSION
    http_status: 412

  - rule_id: reinstatement-stale-record
    parent_entity: DriverRecord
    write_endpoint: "POST /suspensions/{id}/reinstate"
    occ_field: "expected_driver_record_version"
    description: |
      Reinstating against a DriverRecord whose version has advanced since the
      client last read it is rejected. A reinstatement legitimately flips
      licensing_status SUSPENDED -> ACTIVE and lifts the suspension; if the
      record version moved on (e.g. a license renewal or another reinstatement
      already advanced it), this filing operates on a stale view.
    error_id: ERR_STALE_RECORD_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table
# =============================================================================
calculations:
  - name: point_balance
    trigger: "Violation created/dismissed; clock advance (expiry); suspension/reinstatement snapshots"
    algorithm: aggregation
    formula: |
      point_balance = sum(v.points
                          for v in Violations[driver_record_id == record.id]
                          if v.status == ACTIVE
                          and (current_period - v.occurred_period) <= POINT_WINDOW_PERIODS)
      Window boundary is INCLUSIVE: (current_period - occurred_period) == POINT_WINDOW_PERIODS still counts.
      On clock advance, any ACTIVE Violation with diff > POINT_WINDOW_PERIODS is set EXPIRED and drops out.
      DISMISSED and EXPIRED violations are excluded.
    input_set: "Violations of this record with status == ACTIVE within the inclusive window."
    constants:
      POINT_WINDOW_PERIODS: 730   # 24 months in day-periods
    precision: "integer points; no rounding"

  - name: suspension_duration
    trigger: "DriverRecord ACTIVE -> SUSPENDED (suspension open)"
    algorithm: tiered_pricing
    formula: |
      # base tier from point_balance_at_start (snapshot at open):
      if   point_balance_at_start >= 24: base_days = 180
      elif point_balance_at_start >= 16: base_days = 90
      elif point_balance_at_start >= 12: base_days = 30
      else:                              base_days = 0
      # repeat-offender multiplier from prior_suspension_count:
      mult = min(1 + MULT_STEP * prior_suspension_count, MULT_CAP)
      duration_days   = floor(base_days * mult)
      eligible_period = start_period + duration_days
    input_set: "point_balance_at_start (snapshot) and prior_suspension_count at open."
    constants:
      TIER1_POINTS: 12
      TIER2_POINTS: 16
      TIER3_POINTS: 24
      TIER1_DAYS: 30
      TIER2_DAYS: 90
      TIER3_DAYS: 180
      MULT_STEP: 0.5
      MULT_CAP: 3.0
    precision: "floor to integer days"
    variants: []

  - name: renewal_fee
    trigger: "POST /licenses (issuance) and POST /licenses/renew"
    algorithm: weighted_scoring
    formula: |
      # >=3 inputs, nested min/max, conditional branches (combinatorial mode a):
      base              = CLASS_BASE_FEE_CENTS[license_class]
      senior_discount   = SENIOR_DISCOUNT_CENTS if applicant_age >= SENIOR_AGE else 0
      real_id_surcharge = REAL_ID_SURCHARGE_CENTS if is_real_id else 0
      days_late         = max(current_period - prior_expiry_period, 0)   # 0 for first issuance
      late_penalty      = min(days_late * LATE_PER_DAY_CENTS, LATE_CAP_CENTS)
      fee_cents         = max(base - senior_discount, 0) + real_id_surcharge + late_penalty
      # applicant_age = AGE_REFERENCE_YEAR - year(date_of_birth)
    input_set: "license_class, applicant_age (from date_of_birth), is_real_id, prior License.expiry_period (renewals only)."
    constants:
      CLASS_BASE_FEE_CENTS: { D: 4000, M: 3500, A: 6000, B: 6000, C: 5500 }
      SENIOR_AGE: 65
      SENIOR_DISCOUNT_CENTS: 2000
      REAL_ID_SURCHARGE_CENTS: 3000
      LATE_PER_DAY_CENTS: 100
      LATE_CAP_CENTS: 5000
      AGE_REFERENCE_YEAR: 2026
    precision: "integer cents; min/max applied before sum"

  - name: reinstatement_fee
    trigger: "POST /suspensions/{id}/reinstate (computes fee before fee-payment check)"
    algorithm: aggregation
    formula: |
      # nested rounding where order matters (combinatorial mode b). PIN: round EACH component
      # to cents (round_half_up) FIRST, THEN sum. NOT sum-then-round.
      base_component  = round(BASE_REINSTATEMENT_DOLLARS, 2)                            # 75.00
      point_component = round(point_balance_at_reinstatement * PER_POINT_DOLLARS, 2)    # pb * 8.333
      admin_component = round(ADMIN_PCT * (base_component + point_component), 2)         # 7.5% of (base+point)
      reinstatement_fee = round(base_component + point_component + admin_component, 2)
    input_set: "point_balance_at_reinstatement (snapshot at reinstatement)."
    constants:
      BASE_REINSTATEMENT_DOLLARS: 75.00
      PER_POINT_DOLLARS: 8.333
      ADMIN_PCT: 0.075
    precision: "2 decimals, round_half_up, PER-COMPONENT then sum (order pinned)"

  - name: road_test_score
    trigger: "RoadTestAppointment proctor (provisional) and score (final)"
    algorithm: weighted_scoring
    formula: |
      weighted(items) = round( sum(m.weight * m.value for m in items)
                               / sum(m.weight for m in items), 2 )
      provisional_score = weighted over maneuver_scores using each item's auto_score
      final_score       = weighted over maneuver_scores using each item's examiner-adjusted score
      outcome           = PASS if final_score >= ROAD_PASS_THRESHOLD else FAIL
    input_set: "maneuver_scores array. Provisional uses auto_score; final uses examiner-adjusted score on the same maneuver set."
    constants:
      ROAD_PASS_THRESHOLD: 80
    precision: "2 decimals, round_half_up"
    variants:
      - name: provisional
        when: "at proctor time, system auto-grades each maneuver"
        difference: "uses auto_score; advisory only, never decides PASS/FAIL"
      - name: final
        when: "at score time, examiner may raise/lower individual maneuver scores"
        difference: "uses examiner-adjusted score; final_score alone determines outcome and license eligibility"

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and valid"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: all

  - priority: 2
    category: auth
    check: "Role permitted for this operation per RBAC matrix"
    error_id: ERR_INSUFFICIENT_PERMISSIONS
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "All path/body resource ids exist (validated left-to-right)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all resource endpoints

  - priority: 3.5
    category: existence
    check: "Body well-formed: required fields present, types valid, enums in range, and field-domain checks — slot_end_period > slot_start_period (ERR_INVALID_SLOT_INTERVAL); violation occurred_period <= current clock (ERR_OCCURRED_IN_FUTURE); knowledge scheduled_period >= current clock (ERR_SCHEDULED_IN_PAST); otherwise ERR_INVALID_REQUEST"
    error_id: "ERR_INVALID_REQUEST / ERR_INVALID_SLOT_INTERVAL / ERR_OCCURRED_IN_FUTURE / ERR_SCHEDULED_IN_PAST"
    http_status: 400
    applies_to: "all write endpoints with a request body"

  - priority: 4
    category: state
    check: "OCC: expected_driver_record_version (when required) matches DriverRecord.version BEFORE business logic"
    error_id: ERR_STALE_RECORD_VERSION
    http_status: 412
    applies_to: "POST /licenses/renew, POST /suspensions/{id}/reinstate"

  - priority: 5
    category: state
    check: "Target resource is in the correct state for the requested transition"
    error_id: "ERR_*_NOT_* (domain-specific state error)"
    http_status: 409
    applies_to: all transition endpoints

  - priority: 6
    category: business_safety
    check: "Segregation of duties: the Examiner who scored a road test cannot issue its license; the officer who recorded a violation cannot dismiss the suspension it triggered"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /licenses, POST /suspensions/{id}/dismiss"

  - priority: 7
    category: business_safety
    check: "REAL ID license requires DriverRecord.real_id_status == APPROVED"
    error_id: ERR_REAL_ID_NOT_VERIFIED
    http_status: 409
    applies_to: "POST /licenses, POST /licenses/renew (when is_real_id true)"

  - priority: 8
    category: business_safety
    check: "Road test prerequisite: DriverRecord.knowledge_test_passed must be true before proctoring"
    error_id: ERR_KNOWLEDGE_TEST_REQUIRED
    http_status: 409
    applies_to: "POST /road-test-appointments/{id}/proctor"

  - priority: 9
    category: business_safety
    check: "Examiner must be certified for the appointment's license_class"
    error_id: ERR_EXAMINER_NOT_CERTIFIED
    http_status: 409
    applies_to: "POST /road-test-appointments"

  - priority: 10
    category: business_constraint
    check: "Road-test slot must not overlap an existing non-cancelled appointment on the same examiner. Half-open intervals [slot_start_period, slot_end_period): touching endpoints (a.end == b.start) do NOT overlap."
    error_id: ERR_EXAMINER_SLOT_CONFLICT
    http_status: 409
    applies_to: "POST /road-test-appointments"

  - priority: 11
    category: business_constraint
    check: "Knowledge-test sitting must not collide with another SCHEDULED sitting for the same record in the same scheduled_period (single-period point-occupancy)."
    error_id: ERR_KNOWLEDGE_SITTING_CONFLICT
    http_status: 409
    applies_to: "POST /knowledge-tests"

  - priority: 12
    category: business_constraint
    check: "REAL ID approval requires last submitted documents to cover all 3 categories {IDENTITY, RESIDENCY, SSN} (real_id_categories_met == 3)"
    error_id: ERR_INSUFFICIENT_DOCUMENTS
    http_status: 422
    applies_to: "POST /driver-records/{id}/real-id-adjudicate (decision=APPROVE)"

  - priority: 13
    category: business_temporal
    check: "Reinstatement allowed only when current clock >= Suspension.eligible_period (status SERVED)"
    error_id: ERR_NOT_YET_ELIGIBLE
    http_status: 409
    applies_to: "POST /suspensions/{id}/reinstate"

  - priority: 14
    category: business_fiscal
    check: "Reinstatement requires a CAPTURED REINSTATEMENT FeePayment of at least round(reinstatement_fee*100) cents for this record"
    error_id: ERR_REINSTATEMENT_FEE_UNPAID
    http_status: 402
    applies_to: "POST /suspensions/{id}/reinstate"

  - priority: 15
    category: business_fiscal
    check: "License issuance/renewal requires a CAPTURED RENEWAL FeePayment of at least fee_cents for this record"
    error_id: ERR_RENEWAL_FEE_UNPAID
    http_status: 402
    applies_to: "POST /licenses, POST /licenses/renew"

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 5: API Endpoint Table
# =============================================================================
endpoints:
  # --- System clock (test-driving) ---
  - method: POST
    path: "/_clock/advance"
    description: "Advance the global clock by N day-periods. Runs the deferred sweep: expire stale violations (recompute point_balance), expire medical cards (downgrade CDL + suspend endorsements), mark eligible suspensions SERVED."
    roles: [AdjudicationOfficer, LicenseClerk]
    code: 200
    input: [by_periods]
    output: "{ current_period: integer }"
    side_effects:
      - "current_period += by_periods"
      - "ACTIVE Violations with (current_period - occurred_period) > POINT_WINDOW_PERIODS -> EXPIRED; affected DriverRecord.point_balance recomputed"
      - "VALID MedicalCards with current_period > valid_through_period -> EXPIRED; if record has no VALID card covering clock and cdl_status==ACTIVE: cdl_status -> MEDICALLY_DOWNGRADED, GRANTED endorsements -> SUSPENDED"
      - "ACTIVE Suspensions with current_period >= eligible_period -> SERVED"

  - method: GET
    path: "/_clock"
    description: "Read current clock period"
    roles: [AdjudicationOfficer, LicenseClerk, Examiner, KnowledgeProctor]
    code: 200
    input: []
    output: "{ current_period: integer }"
    side_effects: []

  # --- Driver records ---
  - method: POST
    path: "/driver-records"
    description: "Create a driver record"
    roles: [LicenseClerk]
    code: 201
    input: [full_name, date_of_birth, state_code, "organ_donor?", "voter_registration_opt_in?"]
    output: DriverRecord
    side_effects: ["licensing_status=UNLICENSED, cdl_status=NONE, point_balance=0, real_id_status=NONE"]

  - method: GET
    path: "/driver-records/{id}"
    description: "Get a driver record with computed point_balance, prior_suspension_count, statuses, real_id_status, version"
    roles: [LicenseClerk, AdjudicationOfficer, Examiner, KnowledgeProctor]
    code: 200
    input: []
    output: DriverRecord
    side_effects: []

  - method: POST
    path: "/driver-records/{id}/opt-in"
    description: "Set organ-donor and/or motor-voter opt-in flags"
    roles: [LicenseClerk]
    code: 200
    input: ["organ_donor?", "voter_registration_opt_in?"]
    output: DriverRecord
    side_effects: ["organ_donor and/or voter_registration_opt_in updated; increments DriverRecord.version by 1"]

  - method: POST
    path: "/driver-records/{id}/real-id-submit"
    description: "Submit REAL ID identity documents. `documents` is an array of {doc_type, category} where category is one of {IDENTITY, RESIDENCY, SSN}; real_id_categories_met is the count of distinct categories covered."
    roles: [LicenseClerk]
    code: 200
    input: [documents]
    output: DriverRecord
    side_effects: ["real_id_categories_met = count of distinct document categories in {IDENTITY, RESIDENCY, SSN}; real_id_status -> SUBMITTED"]

  - method: POST
    path: "/driver-records/{id}/real-id-adjudicate"
    description: "Approve or reject the submitted REAL ID documents"
    roles: [LicenseClerk]
    code: 200
    input: [decision]
    output: DriverRecord
    side_effects:
      - "On APPROVE (requires real_id_categories_met==3): real_id_status -> APPROVED"
      - "On REJECT: real_id_status -> REJECTED"

  - method: POST
    path: "/driver-records/{id}/cdl-reinstate"
    description: "Reinstate CDL privileges after a new valid medical card is on file"
    roles: [LicenseClerk]
    code: 200
    input: []
    output: DriverRecord
    side_effects:
      - "cdl_status MEDICALLY_DOWNGRADED -> ACTIVE; CdlEndorsements SUSPENDED -> GRANTED (cascade); increments DriverRecord.version by 1"

  - method: POST
    path: "/driver-records/{id}/revoke"
    description: "Adjudicated revocation of a suspended record (cascades to licenses and CDL endorsements)"
    roles: [AdjudicationOfficer]
    code: 200
    input: [reason]
    output: DriverRecord
    side_effects:
      - "licensing_status SUSPENDED -> REVOKED"
      - "Licenses ISSUED -> VOID (cascade); CdlEndorsements GRANTED/SUSPENDED -> WITHDRAWN (cascade)"
      - "increments DriverRecord.version by 1"

  # --- Driver-record sub-resource discovery (FK reverse-reachability) ---
  - method: GET
    path: "/driver-records/{id}/knowledge-tests"
    description: "List knowledge tests for a record (resolves KnowledgeTest.driver_record_id)"
    roles: [LicenseClerk, AdjudicationOfficer, KnowledgeProctor]
    code: 200
    input: ["status?"]
    output: "KnowledgeTest[]"
    side_effects: []

  - method: GET
    path: "/driver-records/{id}/road-test-appointments"
    description: "List road-test appointments for a record (resolves RoadTestAppointment.driver_record_id)"
    roles: [LicenseClerk, AdjudicationOfficer, Examiner]
    code: 200
    input: ["status?"]
    output: "RoadTestAppointment[]"
    side_effects: []

  - method: GET
    path: "/driver-records/{id}/licenses"
    description: "List licenses for a record (resolves License.driver_record_id)"
    roles: [LicenseClerk, AdjudicationOfficer, Examiner]
    code: 200
    input: ["status?"]
    output: "License[]"
    side_effects: []

  - method: GET
    path: "/driver-records/{id}/violations"
    description: "List violations for a record (resolves Violation.driver_record_id)"
    roles: [AdjudicationOfficer, LicenseClerk]
    code: 200
    input: ["status?"]
    output: "Violation[]"
    side_effects: []

  - method: GET
    path: "/driver-records/{id}/suspensions"
    description: "List suspensions for a record (resolves Suspension.driver_record_id)"
    roles: [AdjudicationOfficer, LicenseClerk]
    code: 200
    input: ["status?"]
    output: "Suspension[]"
    side_effects: []

  - method: GET
    path: "/driver-records/{id}/cdl-endorsements"
    description: "List CDL endorsements for a record (resolves CdlEndorsement.driver_record_id)"
    roles: [LicenseClerk, AdjudicationOfficer]
    code: 200
    input: ["status?"]
    output: "CdlEndorsement[]"
    side_effects: []

  - method: GET
    path: "/driver-records/{id}/medical-cards"
    description: "List medical cards for a record (resolves MedicalCard.driver_record_id)"
    roles: [LicenseClerk, AdjudicationOfficer]
    code: 200
    input: ["status?"]
    output: "MedicalCard[]"
    side_effects: []

  - method: GET
    path: "/driver-records/{id}/fee-payments"
    description: "List fee payments for a record (resolves FeePayment.driver_record_id)"
    roles: [LicenseClerk, AdjudicationOfficer]
    code: 200
    input: ["purpose?", "status?"]
    output: "FeePayment[]"
    side_effects: []

  # --- Examiners ---
  - method: POST
    path: "/examiners"
    description: "Register a road-test examiner"
    roles: [AdjudicationOfficer]
    code: 201
    input: [full_name, certified_classes, opaque_user_id]
    output: Examiner
    side_effects: []

  - method: GET
    path: "/examiners/{id}"
    description: "Get an examiner"
    roles: [LicenseClerk, AdjudicationOfficer, Examiner]
    code: 200
    input: []
    output: Examiner
    side_effects: []

  - method: GET
    path: "/examiners/{id}/road-test-appointments"
    description: "List appointments assigned to an examiner (resolves RoadTestAppointment.examiner_id)"
    roles: [LicenseClerk, AdjudicationOfficer, Examiner]
    code: 200
    input: ["status?"]
    output: "RoadTestAppointment[]"
    side_effects: []

  # --- Knowledge tests ---
  - method: POST
    path: "/knowledge-tests"
    description: "Schedule a knowledge test sitting"
    roles: [KnowledgeProctor, LicenseClerk]
    code: 201
    input: [driver_record_id, scheduled_period, "total_questions?"]
    output: KnowledgeTest
    side_effects: ["status=SCHEDULED"]

  - method: POST
    path: "/knowledge-tests/{id}/grade"
    description: "Grade a knowledge test"
    roles: [KnowledgeProctor]
    code: 200
    input: [correct_answers]
    output: KnowledgeTest
    side_effects:
      - "score_pct computed; status -> PASSED or FAILED"
      - "On first PASS in validity window: DriverRecord.knowledge_test_passed=true; UNLICENSED record -> ELIGIBLE"

  - method: POST
    path: "/knowledge-tests/{id}/reschedule"
    description: "Reschedule a failed knowledge test"
    roles: [KnowledgeProctor]
    code: 200
    input: [scheduled_period]
    output: KnowledgeTest
    side_effects: ["status FAILED -> SCHEDULED; correct_answers/score_pct cleared"]

  # --- Road-test appointments ---
  - method: POST
    path: "/road-test-appointments"
    description: "Book a road test on an examiner slot"
    roles: [LicenseClerk]
    code: 201
    input: [driver_record_id, examiner_id, license_class, slot_start_period, slot_end_period]
    output: RoadTestAppointment
    side_effects: ["status=BOOKED"]

  - method: GET
    path: "/road-test-appointments/{id}"
    description: "Get a road-test appointment"
    roles: [LicenseClerk, AdjudicationOfficer, Examiner]
    code: 200
    input: []
    output: RoadTestAppointment
    side_effects: []

  - method: GET
    path: "/road-test-appointments/{id}/licenses"
    description: "List licenses issued from an appointment (resolves License.road_test_appointment_id)"
    roles: [LicenseClerk, AdjudicationOfficer, Examiner]
    code: 200
    input: ["status?"]
    output: "License[]"
    side_effects: []

  - method: POST
    path: "/road-test-appointments/{id}/proctor"
    description: "Examiner proctors the road test (auto-scored maneuvers)"
    roles: [Examiner]
    code: 200
    input: [maneuver_scores]
    output: RoadTestAppointment
    side_effects: ["provisional_score computed; scored_by_examiner_id set; status BOOKED -> PROCTORED"]

  - method: POST
    path: "/road-test-appointments/{id}/score"
    description: "Examiner finalizes the road test (examiner-adjusted maneuvers)"
    roles: [Examiner]
    code: 200
    input: [maneuver_scores]
    output: RoadTestAppointment
    side_effects: ["final_score and outcome computed; status PROCTORED -> SCORED"]

  - method: POST
    path: "/road-test-appointments/{id}/cancel"
    description: "Cancel a booked road test, freeing the slot"
    roles: [Examiner, LicenseClerk]
    code: 200
    input: []
    output: RoadTestAppointment
    side_effects: ["status BOOKED -> CANCELLED"]

  # --- Licenses ---
  - method: POST
    path: "/licenses"
    description: "Issue a license after a passing road test (first issuance)"
    roles: [LicenseClerk]
    code: 201
    input: [driver_record_id, road_test_appointment_id, license_class, "is_real_id?"]
    output: License
    side_effects:
      - "Segregation-of-duties: acting X-User-ID must != appointment.scored_by_examiner_id"
      - "Requires CAPTURED RENEWAL FeePayment >= fee_cents; fee_cents computed (renewal_fee, days_late=0)"
      - "issued_period, expiry_period set; status=ISSUED; DriverRecord ELIGIBLE -> ACTIVE; increments DriverRecord.version by 1"

  - method: POST
    path: "/licenses/renew"
    description: "Renew a license (supersede-with-OCC)"
    roles: [LicenseClerk]
    code: 201
    input: [driver_record_id, license_class, "is_real_id?", expected_driver_record_version]
    output: License
    side_effects:
      - "OCC: expected_driver_record_version must equal DriverRecord.version (else ERR_STALE_RECORD_VERSION)"
      - "Requires CAPTURED RENEWAL FeePayment >= fee_cents; fee_cents computed (renewal_fee with days_late from prior expiry)"
      - "New License ISSUED; prior current License -> RENEWED; increments DriverRecord.version by 1"

  # --- Violations ---
  - method: POST
    path: "/violations"
    description: "Record a moving violation; may auto-trigger suspension"
    roles: [AdjudicationOfficer]
    code: 201
    input: [driver_record_id, code, points, occurred_period]
    output: Violation
    side_effects:
      - "status=ACTIVE; recorded_by_officer set from X-User-ID; DriverRecord.point_balance recomputed"
      - "If point_balance >= SUSPENSION_POINT_THRESHOLD and licensing_status==ACTIVE: open Suspension (cascade), licensing_status -> SUSPENDED"

  - method: GET
    path: "/violations/{id}"
    description: "Get a violation"
    roles: [AdjudicationOfficer, LicenseClerk]
    code: 200
    input: []
    output: Violation
    side_effects: []

  - method: GET
    path: "/violations/{id}/suspensions"
    description: "List suspensions triggered by a violation (resolves Suspension.triggering_violation_id)"
    roles: [AdjudicationOfficer, LicenseClerk]
    code: 200
    input: ["status?"]
    output: "Suspension[]"
    side_effects: []

  - method: POST
    path: "/violations/{id}/dismiss"
    description: "Dismiss a violation (overturned on appeal)"
    roles: [AdjudicationOfficer]
    code: 200
    input: []
    output: Violation
    side_effects: ["status ACTIVE -> DISMISSED; DriverRecord.point_balance recomputed"]

  # --- Suspensions ---
  - method: GET
    path: "/suspensions/{id}"
    description: "Get a suspension"
    roles: [AdjudicationOfficer, LicenseClerk]
    code: 200
    input: []
    output: Suspension
    side_effects: []

  - method: POST
    path: "/suspensions/{id}/dismiss"
    description: "Lift a suspension because its triggering violation was dismissed (no fee)"
    roles: [AdjudicationOfficer]
    code: 200
    input: []
    output: Suspension
    side_effects:
      - "Segregation-of-duties: acting X-User-ID must != triggering Violation.recorded_by_officer"
      - "status ACTIVE -> LIFTED_BY_DISMISSAL; DriverRecord.licensing_status -> ACTIVE; prior_suspension_count NOT incremented; increments DriverRecord.version by 1"

  - method: POST
    path: "/suspensions/{id}/reinstate"
    description: "Reinstate a served suspension (fee-paid, OCC-guarded) — closes the suspension cycle"
    roles: [LicenseClerk]
    code: 200
    input: [expected_driver_record_version]
    output: Suspension
    side_effects:
      - "OCC: expected_driver_record_version must equal DriverRecord.version (else ERR_STALE_RECORD_VERSION)"
      - "point_balance_at_reinstatement snapshot; reinstatement_fee computed; requires SERVED + CAPTURED REINSTATEMENT FeePayment >= round(reinstatement_fee*100)"
      - "status SERVED -> LIFTED_BY_REINSTATEMENT; licensing_status SUSPENDED -> ACTIVE; prior_suspension_count recomputed; increments DriverRecord.version by 1"

  # --- CDL endorsements ---
  - method: POST
    path: "/cdl-endorsements"
    description: "Grant a CDL endorsement (requires valid medical card + ACTIVE record)"
    roles: [LicenseClerk]
    code: 201
    input: [driver_record_id, endorsement_code]
    output: CdlEndorsement
    side_effects: ["status=GRANTED; if cdl_status==NONE then cdl_status -> ACTIVE"]

  - method: POST
    path: "/cdl-endorsements/{id}/withdraw"
    description: "Withdraw a CDL endorsement permanently"
    roles: [LicenseClerk, AdjudicationOfficer]
    code: 200
    input: []
    output: CdlEndorsement
    side_effects: ["status -> WITHDRAWN (terminal)"]

  # --- Medical cards ---
  - method: POST
    path: "/medical-cards"
    description: "File a DOT medical card; supersedes prior VALID card"
    roles: [LicenseClerk]
    code: 201
    input: [driver_record_id, issued_period, valid_through_period]
    output: MedicalCard
    side_effects: ["status=VALID; prior VALID card for record -> SUPERSEDED"]

  # --- Fee payments ---
  - method: POST
    path: "/fee-payments"
    description: "Capture a fee payment for renewal/reinstatement/road-test/knowledge-test"
    roles: [LicenseClerk]
    code: 201
    input: [driver_record_id, purpose, amount_cents]
    output: FeePayment
    side_effects: ["status=CAPTURED"]

# =============================================================================
# Table 6: Error Code Catalog
# =============================================================================
errors:
  # --- Auth ---
  - id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http: 400
    condition: "X-User-ID or X-User-Role header missing or invalid"
  - id: ERR_INSUFFICIENT_PERMISSIONS
    http: 403
    condition: "Role not permitted for this operation"

  # --- Not found ---
  - id: ERR_NOT_FOUND
    http: 404
    condition: "A referenced resource id does not exist"

  # --- Input validation ---
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Malformed body, missing required field, type mismatch, invalid enum value"
  - id: ERR_INVALID_SLOT_INTERVAL
    http: 400
    condition: "slot_end_period <= slot_start_period on a road-test booking"
  - id: ERR_OCCURRED_IN_FUTURE
    http: 400
    condition: "Violation occurred_period > current clock"
  - id: ERR_SCHEDULED_IN_PAST
    http: 400
    condition: "Knowledge-test scheduled_period < current clock at booking"

  # --- OCC ---
  - id: ERR_STALE_RECORD_VERSION
    http: 412
    condition: "expected_driver_record_version does not match DriverRecord.version"

  # --- State ---
  - id: ERR_RECORD_NOT_ELIGIBLE
    http: 409
    condition: "License issuance requires licensing_status == ELIGIBLE"
  - id: ERR_RECORD_NOT_ACTIVE
    http: 409
    condition: "Operation requires licensing_status == ACTIVE"
  - id: ERR_RECORD_NOT_SUSPENDED
    http: 409
    condition: "Operation requires licensing_status == SUSPENDED"
  - id: ERR_TEST_NOT_SCHEDULED
    http: 409
    condition: "Knowledge test is not in SCHEDULED state"
  - id: ERR_TEST_NOT_FAILED
    http: 409
    condition: "Reschedule requires the knowledge test to be FAILED"
  - id: ERR_TEST_NOT_YET_DUE
    http: 409
    condition: "current clock < knowledge test scheduled_period at grade time"
  - id: ERR_RETAKE_COOLDOWN
    http: 409
    condition: "New scheduled_period earlier than current clock + KNOWLEDGE_RETAKE_COOLDOWN"
  - id: ERR_APPT_NOT_BOOKED
    http: 409
    condition: "Road-test appointment is not in BOOKED state"
  - id: ERR_APPT_NOT_PROCTORED
    http: 409
    condition: "Scoring requires the appointment to be PROCTORED"
  - id: ERR_SLOT_NOT_STARTED
    http: 409
    condition: "current clock < slot_start_period at proctor time"
  - id: ERR_SUSPENSION_NOT_SERVED
    http: 409
    condition: "Reinstatement requires the suspension to be SERVED"
  - id: ERR_SUSPENSION_NOT_ACTIVE
    http: 409
    condition: "Dismiss requires the suspension to be ACTIVE"
  - id: ERR_VIOLATION_NOT_ACTIVE
    http: 409
    condition: "Dismiss requires the violation to be ACTIVE (not already EXPIRED/DISMISSED)"
  - id: ERR_CDL_NOT_DOWNGRADED
    http: 409
    condition: "cdl-reinstate requires cdl_status == MEDICALLY_DOWNGRADED"

  # --- Business: safety / segregation ---
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "Acting user is barred (scored the road test being licensed, or recorded the violation being dismissed)"
  - id: ERR_ROAD_TEST_NOT_PASSED
    http: 409
    condition: "Referenced road-test appointment outcome is not PASS"
  - id: ERR_REAL_ID_NOT_VERIFIED
    http: 409
    condition: "REAL ID license requested but real_id_status != APPROVED"
  - id: ERR_KNOWLEDGE_TEST_REQUIRED
    http: 409
    condition: "Proctoring requires knowledge_test_passed == true"
  - id: ERR_EXAMINER_MISMATCH
    http: 403
    condition: "Acting examiner is not the appointment's assigned examiner"
  - id: ERR_EXAMINER_NOT_CERTIFIED
    http: 409
    condition: "Examiner not certified for the appointment's license_class"
  - id: ERR_NO_VALID_MEDICAL_CARD
    http: 409
    condition: "CDL operation requires a VALID medical card on file covering current clock"
  - id: ERR_VIOLATION_NOT_DISMISSED
    http: 409
    condition: "Suspension dismiss requires the triggering violation to be DISMISSED"

  # --- Business: constraints / temporal ---
  - id: ERR_EXAMINER_SLOT_CONFLICT
    http: 409
    condition: "Booked slot overlaps an existing non-cancelled appointment on the same examiner (half-open intervals)"
  - id: ERR_KNOWLEDGE_SITTING_CONFLICT
    http: 409
    condition: "Another SCHEDULED knowledge test exists for this record in the same scheduled_period"
  - id: ERR_INSUFFICIENT_DOCUMENTS
    http: 422
    condition: "REAL ID approval requires all 3 document categories (real_id_categories_met < 3)"
  - id: ERR_NOT_YET_ELIGIBLE
    http: 409
    condition: "current clock < suspension eligible_period at reinstatement"
  - id: ERR_REVOCATION_THRESHOLD_NOT_MET
    http: 409
    condition: "Revocation requires prior_suspension_count >= REVOCATION_PRIOR_THRESHOLD"

  # --- Business: fiscal ---
  - id: ERR_REINSTATEMENT_FEE_UNPAID
    http: 402
    condition: "No CAPTURED REINSTATEMENT FeePayment >= reinstatement_fee for this record"
  - id: ERR_RENEWAL_FEE_UNPAID
    http: 402
    condition: "No CAPTURED RENEWAL FeePayment >= fee_cents for this record"

# =============================================================================
# Table 7: RBAC Matrix
# =============================================================================
roles:
  - name: LicenseClerk
    description: "Front-counter clerk: creates records, issues/renews licenses, processes REAL ID, schedules tests, books road tests, grants CDL endorsements, files medical cards, captures fees, reinstates suspensions, opt-ins."
    identity: "opaque"
    exclusive_operations:
      - "POST /driver-records — create record"
      - "POST /driver-records/{id}/opt-in — set donor/voter flags"
      - "POST /driver-records/{id}/real-id-submit — submit REAL ID docs"
      - "POST /driver-records/{id}/real-id-adjudicate — approve/reject REAL ID"
      - "POST /driver-records/{id}/cdl-reinstate — reinstate CDL"
      - "POST /licenses — issue license"
      - "POST /licenses/renew — renew license"
      - "POST /cdl-endorsements — grant endorsement"
      - "POST /medical-cards — file medical card"
      - "POST /fee-payments — capture fee"
      - "POST /suspensions/{id}/reinstate — reinstate suspension"
    shared_operations:
      - "POST /road-test-appointments — book road test"
      - "POST /road-test-appointments/{id}/cancel — shared with Examiner"
      - "POST /knowledge-tests — shared with KnowledgeProctor"
      - "POST /cdl-endorsements/{id}/withdraw — shared with AdjudicationOfficer"
      - "POST /_clock/advance — shared with AdjudicationOfficer"
      - "GET endpoints across the record's spokes"

  - name: Examiner
    description: "Road-test examiner: proctors and scores road tests on their own assigned appointments. Entity-backed; X-User-ID equals the acting Examiner.id."
    identity: "entity_backed:Examiner"
    exclusive_operations:
      - "POST /road-test-appointments/{id}/proctor — proctor own appointment"
      - "POST /road-test-appointments/{id}/score — score own appointment"
    shared_operations:
      - "POST /road-test-appointments/{id}/cancel — shared with LicenseClerk"
      - "GET /road-test-appointments/{id}, /examiners/{id}, /licenses/{id}, /driver-records/{id}"

  - name: KnowledgeProctor
    description: "Knowledge-test proctor: grades and reschedules knowledge tests."
    identity: "opaque"
    exclusive_operations:
      - "POST /knowledge-tests/{id}/grade — grade test"
      - "POST /knowledge-tests/{id}/reschedule — reschedule failed test"
    shared_operations:
      - "POST /knowledge-tests — shared with LicenseClerk"
      - "GET /knowledge-tests under a record, /driver-records/{id}, /_clock"

  - name: AdjudicationOfficer
    description: "Adjudication/enforcement officer: records and dismisses violations, dismisses suspensions, revokes records, registers examiners. Opaque operator id is recorded on violations for segregation-of-duties checks."
    identity: "opaque"
    exclusive_operations:
      - "POST /violations — record violation"
      - "POST /violations/{id}/dismiss — dismiss violation"
      - "POST /suspensions/{id}/dismiss — lift suspension on dismissed violation"
      - "POST /driver-records/{id}/revoke — revoke record"
      - "POST /examiners — register examiner"
    shared_operations:
      - "POST /cdl-endorsements/{id}/withdraw — shared with LicenseClerk"
      - "POST /_clock/advance — shared with LicenseClerk"
      - "GET endpoints across enforcement spokes"
