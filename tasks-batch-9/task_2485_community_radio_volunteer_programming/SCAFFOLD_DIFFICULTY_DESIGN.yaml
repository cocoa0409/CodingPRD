            - { call: "POST /schedule-grids/${grid_id}/slot-assignments", payload: { expected_grid_version: "${grid_v3}", program_id: "${eve_program_id}", day_of_week: 1, start_minute: 1200, duration_minutes: 120, conflict_policy: "SENIORITY_PREEMPT" }, as: ProgramDirector, captures: { eve_slot_id: "$.data.id" } }
          assert:
            - "GET /volunteers/${ada_id} shows seniority_score == 54.00, GET /volunteers/${fay_id} shows 58.00 and GET /volunteers/${eve_id} shows 59.00"
            - "Fay's request, a margin of exactly 4.00, returns 409 with data.error_id == ERR_SENIORITY_MARGIN_UNMET"
            - "After Fay's rejection GET /slot-assignments/${ada_slot_id} still shows status == CONFIRMED and GET /schedule-grids/${grid_id} still shows version == ${grid_v2} and total_assigned_minutes == 120"
            - "Eve's request, a margin of exactly 5.00, returns 201 with SlotAssignment.status == TENTATIVE on the new row"
            - "GET /slot-assignments/${ada_slot_id} now shows status == PREEMPTED with preempted_by_program_id == ${eve_program_id}"
            - "GET /programs/${ada_program_id} shows programming_status == APPROVED_UNSCHEDULED, because the preemption left it with no live occupation"
            - "GET /schedule-grids/${grid_id} shows total_assigned_minutes == 120 and public_affairs_minutes_pct == 0.00"
            - "GET /slot-assignments?grid_id=${grid_id}&status=PREEMPTED returns total_count == 1"

      - name: grid_public_affairs_share_of_exactly_eight_percent_publishes
        grounds:
          - validations[priority=74 v_diversity_quota]
          - calculations.grid_public_affairs_share
          - entities.ScheduleGrid.fields.public_affairs_minutes_pct
          - errors[ERR_DIVERSITY_QUOTA_UNMET]
          - endpoints[POST /schedule-grids/{gridId}/publish]
        distinguishing_aspect: |
          The metric is the single grid-level percentage ScheduleGrid.public_affairs_minutes_pct measured against the absolute inclusive 8.00 threshold on POST /schedule-grids/{gridId}/publish, walked by changing only the music show's minutes so the same 60 public-affairs minutes read 7.69 percent of 780 (rejected) and then exactly 8.00 percent of 750 (published); the other boundary_precision_check instance measures a DIFFERENCE between two Volunteer seniority scores on the slot-assignment endpoint.
        test_recipe:
          setup:
            - "Default logical clock 2026-08-01T00:00:00Z."
            - "Certified host, three seated committee members, an approved NEWS program (a public-affairs format) and an approved MUSIC program (not)."
            - "An IN_REVIEW 2026-FALL grid holds the news show CONFIRMED on Tuesday 07:00 for 30 minutes and, twice over, a Monday 00:00 music occupation - first 720 minutes, then 690."
            - "The news show carries a second CONFIRMED 30-minute Wednesday occupation, so the public-affairs numerator is 60 minutes in both attempts."
            - "Every occupation is CONFIRMED before each publish attempt, so the tentative-slot rule at priority 73 never fires."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-01T00:00:00Z" }, as: ProgramDirector }
            - { call: "POST /volunteers", payload: { legal_name: "Ada Reyes", email: "ada@krcr.example", role_track: "PROGRAMMER", seniority_start_date: "2024-08-01" }, as: TrainingCoordinator, captures: { host_id: "$.data.id" } }
            - { call: "POST /volunteers/${host_id}/certifications", payload: { cert_type: "BOARD_OPERATION", exam_score: 88 }, as: TrainingCoordinator }
            - { call: "POST /volunteers/${host_id}/certifications", payload: { cert_type: "STATION_POLICY", exam_score: 90 }, as: TrainingCoordinator }
            - { call: "POST /volunteers/${host_id}/certifications", payload: { cert_type: "BROADCAST_REGULATION", exam_score: 91 }, as: TrainingCoordinator }
            - { call: "POST /volunteers", payload: { legal_name: "Bo Lin", email: "bo@krcr.example", role_track: "PROGRAMMER", seniority_start_date: "2023-01-01", committee_seat: true }, as: TrainingCoordinator, captures: { m1_id: "$.data.id" } }
            - { call: "POST /volunteers", payload: { legal_name: "Cy Nakamura", email: "cy@krcr.example", role_track: "PROGRAMMER", seniority_start_date: "2023-01-01", committee_seat: true }, as: TrainingCoordinator, captures: { m2_id: "$.data.id" } }
            - { call: "POST /volunteers", payload: { legal_name: "Dee Okafor", email: "dee@krcr.example", role_track: "PROGRAMMER", seniority_start_date: "2023-01-01", committee_seat: true }, as: TrainingCoordinator, captures: { m3_id: "$.data.id" } }
            - { call: "POST /program-proposals", payload: { proposer_volunteer_id: "${host_id}", title: "County Report", format_code: "NEWS", language_code: "EN", requested_daypart: "MORNING_DRIVE", requested_duration_minutes: 30 }, as: Volunteer, as_user_id: "${host_id}", captures: { news_proposal_id: "$.data.id" } }
            - { call: "POST /program-proposals/${news_proposal_id}/submit", as: Volunteer, as_user_id: "${host_id}" }
            - { call: "POST /program-proposals/${news_proposal_id}/open-review", as: ProgramDirector }
            - { call: "POST /program-proposals/${news_proposal_id}/votes", payload: { member_volunteer_id: "${m1_id}", format_fit_score: 4, diversity_score: 4, quality_score: 4, recommendation: "APPROVE", rationale: "Approve." }, as: CommitteeMember, as_user_id: "${m1_id}" }
            - { call: "POST /program-proposals/${news_proposal_id}/votes", payload: { member_volunteer_id: "${m2_id}", format_fit_score: 4, diversity_score: 4, quality_score: 4, recommendation: "APPROVE", rationale: "Approve." }, as: CommitteeMember, as_user_id: "${m2_id}" }
            - { call: "POST /program-proposals/${news_proposal_id}/votes", payload: { member_volunteer_id: "${m3_id}", format_fit_score: 4, diversity_score: 4, quality_score: 4, recommendation: "APPROVE", rationale: "Approve." }, as: CommitteeMember, as_user_id: "${m3_id}" }
            - { call: "GET /program-proposals/${news_proposal_id}", as: ProgramDirector, captures: { news_pv: "$.data.version" } }
            - { call: "POST /program-proposals/${news_proposal_id}/decide", payload: { expected_proposal_version: "${news_pv}" }, as: ProgramDirector }
            - { call: "GET /programs?proposal_id=${news_proposal_id}", as: ProgramDirector, captures: { news_program_id: "$.data[0].id" } }
            - { call: "POST /program-proposals", payload: { proposer_volunteer_id: "${host_id}", title: "Delta Sessions", format_code: "MUSIC", language_code: "EN", requested_daypart: "OVERNIGHT", requested_duration_minutes: 720 }, as: Volunteer, as_user_id: "${host_id}", captures: { music_proposal_id: "$.data.id" } }
            - { call: "POST /program-proposals/${music_proposal_id}/submit", as: Volunteer, as_user_id: "${host_id}" }
            - { call: "POST /program-proposals/${music_proposal_id}/open-review", as: ProgramDirector }
            - { call: "POST /program-proposals/${music_proposal_id}/votes", payload: { member_volunteer_id: "${m1_id}", format_fit_score: 4, diversity_score: 4, quality_score: 4, recommendation: "APPROVE", rationale: "Approve." }, as: CommitteeMember, as_user_id: "${m1_id}" }
            - { call: "POST /program-proposals/${music_proposal_id}/votes", payload: { member_volunteer_id: "${m2_id}", format_fit_score: 4, diversity_score: 4, quality_score: 4, recommendation: "APPROVE", rationale: "Approve." }, as: CommitteeMember, as_user_id: "${m2_id}" }
            - { call: "POST /program-proposals/${music_proposal_id}/votes", payload: { member_volunteer_id: "${m3_id}", format_fit_score: 4, diversity_score: 4, quality_score: 4, recommendation: "APPROVE", rationale: "Approve." }, as: CommitteeMember, as_user_id: "${m3_id}" }
            - { call: "GET /program-proposals/${music_proposal_id}", as: ProgramDirector, captures: { music_pv: "$.data.version" } }
            - { call: "POST /program-proposals/${music_proposal_id}/decide", payload: { expected_proposal_version: "${music_pv}" }, as: ProgramDirector }
            - { call: "GET /programs?proposal_id=${music_proposal_id}", as: ProgramDirector, captures: { music_program_id: "$.data[0].id" } }
            - { call: "POST /schedule-grids", payload: { season_code: "2026-FALL", effective_from: "2026-09-07T00:00:00Z", effective_to: "2026-12-27T23:59:00Z" }, as: ProgramDirector, captures: { grid_id: "$.data.id", grid_v1: "$.data.version" } }
            - { call: "POST /schedule-grids/${grid_id}/slot-assignments", payload: { expected_grid_version: "${grid_v1}", program_id: "${news_program_id}", day_of_week: 2, start_minute: 420, duration_minutes: 30 }, as: ProgramDirector, captures: { news_slot_a: "$.data.id" } }
            - { call: "GET /schedule-grids/${grid_id}", as: ProgramDirector, captures: { grid_v2: "$.data.version" } }
            - { call: "POST /schedule-grids/${grid_id}/slot-assignments", payload: { expected_grid_version: "${grid_v2}", program_id: "${news_program_id}", day_of_week: 3, start_minute: 420, duration_minutes: 30 }, as: ProgramDirector, captures: { news_slot_b: "$.data.id" } }
            - { call: "GET /schedule-grids/${grid_id}", as: ProgramDirector, captures: { grid_v3: "$.data.version" } }
            - { call: "POST /schedule-grids/${grid_id}/slot-assignments", payload: { expected_grid_version: "${grid_v3}", program_id: "${music_program_id}", day_of_week: 1, start_minute: 0, duration_minutes: 720 }, as: ProgramDirector, captures: { music_slot_720: "$.data.id" } }
            - { call: "POST /slot-assignments/${news_slot_a}/confirm", as: ProgramDirector }
            - { call: "POST /slot-assignments/${news_slot_b}/confirm", as: ProgramDirector }
            - { call: "POST /slot-assignments/${music_slot_720}/confirm", as: ProgramDirector }
            - { call: "GET /schedule-grids/${grid_id}", as: ProgramDirector, captures: { grid_v4: "$.data.version" } }
          trigger:
            - { call: "POST /schedule-grids/${grid_id}/publish", payload: { expected_grid_version: "${grid_v4}" }, as: ProgramDirector, captures: { near_miss_error: "$.data.error_id" } }
            - { call: "POST /slot-assignments/${music_slot_720}/release", payload: { release_reason: "Trimmed to make room for the public-affairs quota." }, as: ProgramDirector }
            - { call: "GET /schedule-grids/${grid_id}", as: ProgramDirector, captures: { grid_v5: "$.data.version" } }
            - { call: "POST /schedule-grids/${grid_id}/slot-assignments", payload: { expected_grid_version: "${grid_v5}", program_id: "${music_program_id}", day_of_week: 1, start_minute: 0, duration_minutes: 690 }, as: ProgramDirector, captures: { music_slot_690: "$.data.id" } }
            - { call: "POST /slot-assignments/${music_slot_690}/confirm", as: ProgramDirector }
            - { call: "GET /schedule-grids/${grid_id}", as: ProgramDirector, captures: { grid_v6: "$.data.version", pct_before_publish: "$.data.public_affairs_minutes_pct" } }
            - { call: "POST /schedule-grids/${grid_id}/publish", payload: { expected_grid_version: "${grid_v6}" }, as: ProgramDirector }
          assert:
            - "Before the first publish GET /schedule-grids/${grid_id} shows total_assigned_minutes == 780 and public_affairs_minutes_pct == 7.69 (60/780 = 7.6923, rounded half up to 2 places)"
            - "The first publish returns 422 with data.error_id == ERR_DIVERSITY_QUOTA_UNMET and leaves ScheduleGrid.status == IN_REVIEW"
            - "After the release and the 690-minute replacement GET /schedule-grids/${grid_id} shows total_assigned_minutes == 750 and public_affairs_minutes_pct == 8.00"
            - "The second publish returns 200 with ScheduleGrid.status == PUBLISHED and published_at == 2026-08-01T00:00:00Z"
            - "GET /programs/${news_program_id} and GET /programs/${music_program_id} both show programming_status == ON_AIR_ACTIVE"
            - "GET /slot-assignments/${music_slot_720} shows status == RELEASED and GET /slot-assignments/${music_slot_690} shows status == CONFIRMED"
            - "GET /schedule-grids?status=PUBLISHED returns total_count == 1"
  - rule_id: cross_entity_state_dependency
    instances:
      - name: proposal_submit_depends_on_the_proposer_volunteer_state
        grounds:
          - validations[priority=60 v_proposer_certified]
          - state_machines.Volunteer.IN_TRAINING_to_CERTIFIED
          - state_machines.ProgramProposal.DRAFT_to_SUBMITTED
          - errors[ERR_PROPOSER_NOT_CERTIFIED]
          - endpoints[POST /program-proposals/{proposalId}/submit]
        distinguishing_aspect: |
          The dependent pair is (ProgramProposal, Volunteer): the proposal's own DRAFT -> SUBMITTED transition is gated on a state field of a DIFFERENT entity, the proposer Volunteer.status, and the same unchanged proposal flips from 422 to 200 the instant the third core certification lifts the volunteer IN_TRAINING -> CERTIFIED; the other cross_entity_state_dependency instance pairs (Episode, Program) and reads a compliance dimension rather than a training lifecycle.
        test_recipe:
          setup:
            - "Default logical clock 2026-08-01T00:00:00Z."
            - "Ada Reyes holds only two of the three core certifications (BOARD_OPERATION 88, STATION_POLICY 90), so her Volunteer.status is IN_TRAINING."
            - "Three seated committee members exist, so the committee-staffing rule never interferes."
            - "Ada authors a DRAFT MUSIC proposal and submits it herself, satisfying the owner-only rule at priority 12."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-01T00:00:00Z" }, as: ProgramDirector }
            - { call: "POST /volunteers", payload: { legal_name: "Ada Reyes", email: "ada@krcr.example", role_track: "PROGRAMMER", seniority_start_date: "2024-08-01" }, as: TrainingCoordinator, captures: { host_id: "$.data.id" } }
            - { call: "POST /volunteers/${host_id}/certifications", payload: { cert_type: "BOARD_OPERATION", exam_score: 88 }, as: TrainingCoordinator }
            - { call: "POST /volunteers/${host_id}/certifications", payload: { cert_type: "STATION_POLICY", exam_score: 90 }, as: TrainingCoordinator }
            - { call: "POST /volunteers", payload: { legal_name: "Bo Lin", email: "bo@krcr.example", role_track: "PROGRAMMER", seniority_start_date: "2023-01-01", committee_seat: true }, as: TrainingCoordinator, captures: { m1_id: "$.data.id" } }
            - { call: "POST /volunteers", payload: { legal_name: "Cy Nakamura", email: "cy@krcr.example", role_track: "PROGRAMMER", seniority_start_date: "2023-01-01", committee_seat: true }, as: TrainingCoordinator, captures: { m2_id: "$.data.id" } }
            - { call: "POST /volunteers", payload: { legal_name: "Dee Okafor", email: "dee@krcr.example", role_track: "PROGRAMMER", seniority_start_date: "2023-01-01", committee_seat: true }, as: TrainingCoordinator, captures: { m3_id: "$.data.id" } }
            - { call: "POST /program-proposals", payload: { proposer_volunteer_id: "${host_id}", title: "Delta Sessions", format_code: "MUSIC", language_code: "EN", requested_daypart: "EVENING", requested_duration_minutes: 120 }, as: Volunteer, as_user_id: "${host_id}", captures: { proposal_id: "$.data.id" } }
            - { call: "GET /volunteers/${host_id}", as: TrainingCoordinator, captures: { pre_status: "$.data.status" } }
          trigger:
            - { call: "POST /program-proposals/${proposal_id}/submit", as: Volunteer, as_user_id: "${host_id}", captures: { blocked_error: "$.data.error_id" } }
            - { call: "POST /volunteers/${host_id}/certifications", payload: { cert_type: "BROADCAST_REGULATION", exam_score: 91 }, as: TrainingCoordinator, captures: { third_cert_id: "$.data.id" } }
            - { call: "POST /program-proposals/${proposal_id}/submit", as: Volunteer, as_user_id: "${host_id}", captures: { post_status: "$.data.status" } }
          assert:
            - "Before the third certification GET /volunteers/${host_id} shows status == IN_TRAINING, current_certification_count == 2 and needs_core_renewal == true"
            - "The first submit returns 422 with data.error_id == ERR_PROPOSER_NOT_CERTIFIED"
            - "GET /program-proposals/${proposal_id} still shows status == DRAFT and review_round == 0 after the rejection"
            - "The third certification returns 201 with CertificationRecord.status == PASSED and expires_on == 2028-08-01T00:00:00Z"
            - "GET /volunteers/${host_id} now shows status == CERTIFIED, current_certification_count == 3, needs_core_renewal == false and seniority_score == 54.00"
            - "The second submit - byte-identical to the first - returns 200 with ProgramProposal.status == SUBMITTED and review_round == 1"
            - "GET /program-proposals?status=SUBMITTED returns total_count == 1"

      - name: episode_creation_depends_on_the_program_compliance_state
        grounds:
          - validations[priority=46 v_program_not_restricted]
          - state_machines.Program.CLEAR_to_RESTRICTED
          - state_machines.Program.RESTRICTED_to_CLEAR
          - errors[ERR_PROGRAM_RESTRICTED]
          - endpoints[POST /episodes]
        distinguishing_aspect: |
          The dependent pair is (Episode, Program): creating an Episode is gated on the parent Program's compliance_standing dimension, so the identical POST /episodes body is refused while the program sits at RESTRICTED and accepted after the incident is remediated back to CLEAR, with the operator and slot facts never changing; the other cross_entity_state_dependency instance pairs (ProgramProposal, Volunteer) and reads a training lifecycle on a non-parent entity.
