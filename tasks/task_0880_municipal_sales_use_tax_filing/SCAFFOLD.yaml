scenario: "Local Sales/Use & Business-Activity Tax Filing (municipal): taxpayer registration & account, return filing & rate/jurisdiction, remittance & prepayment, exemption & credit, audit & assessment, penalty/interest & appeal, discovery/nexus, refund"
domain_name: municipal-sales-use-tax-filing
api_prefix: "/tax"

complexity_profile:
  primary_archetype: "Ledger reconciliation"
  secondary_archetype: "Compliance / audit"
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - optimistic_concurrency
    - rate_threshold_triggers
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate
  notes: |
    Core challenge is ledger reconciliation: the same taxable base produces a
    different amount owed depending on which algorithm (audit-deficiency penalty
    vs late-filing penalty; statutory-delay refund interest vs overpayment-date
    refund interest) and which rounding order (per-line vs summed) is applied.
    A taxpayer's account_balance_cents is a derived-on-read aggregate over
    returns, assessments, remittances and refunds; forward actions paired with
    their compensating actions (amend un-applies remittances; appeal abates an
    assessment) MUST leave the conserved ledger identities intact.

# ============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# ============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# ============================================================================
# §1.1 Entity-Relationship Table
# ============================================================================
entities:
  - name: Taxpayer
    parent: null
    common_fields: true
    fields:
      - name: legal_name
        type: string
        source: input
        description: "Registered legal name of the business."
      - name: entity_type
        type: enum
        source: input
        description: "Legal form of the taxpayer."
        constraints: "one of SOLE_PROP | LLC | CORP | PARTNERSHIP"
      - name: email
        type: string
        source: input
        description: "Contact email; unique per taxpayer."
      - name: filing_frequency
        type: enum
        source: input
        description: "How often returns are due."
        constraints: "one of MONTHLY | QUARTERLY | ANNUAL"
      - name: account_status
        type: enum
        source: system
        default: PENDING
        description: "Account lifecycle state."
        constraints: "one of PENDING | ACTIVE | SUSPENDED"
      - name: nexus_status
        type: enum
        source: system
        default: NONE
        description: "Economic-nexus determination; flips to ESTABLISHED when a NEXUS_DISCOVERY audit closes with nexus_established true."
        constraints: "one of NONE | ESTABLISHED"
      - name: suspend_reason
        type: string
        source: input
        description: "Free-text reason captured when the account is suspended."
        default: null
      - name: activated_at
        type: datetime
        source: system
        description: "Logical-clock timestamp the account first became ACTIVE."
        default: null
      - name: account_balance_cents
        type: integer
        source: computed
        description: "Derived-on-read ledger balance (positive = owed to the municipality). See calculations.taxpayer_account_balance for the exact formula over returns, assessments, remittances and refunds."

  - name: Jurisdiction
    parent: null
    common_fields: true
    fields:
      - name: code
        type: string
        source: input
        description: "Short jurisdiction code; unique."
        constraints: "unique across all Jurisdiction rows"
      - name: name
        type: string
        source: input
        description: "Human-readable jurisdiction name."
      - name: rate_bps
        type: integer
        source: input
        description: "Combined sales/use tax rate in basis points (e.g. 850 = 8.50%)."
        constraints: ">= 0"
      - name: active
        type: boolean
        source: input
        default: true
        description: "Whether the jurisdiction may be cited on new return lines."

  - name: TaxReturn
    parent: null
    common_fields: true
    fields:
      - name: taxpayer_id
        type: string
        source: input
        description: "FK -> Taxpayer.id; the filer that owns this return."
      - name: exemption_certificate_id
        type: string
        source: input
        default: null
        description: "FK -> ExemptionCertificate.id; optional certificate justifying the exempt_sales on this return."
      - name: period_key
        type: string
        source: input
        description: "Filing period label, e.g. '2026-Q1'."
      - name: period_start_date
        type: datetime
        source: input
        description: "Inclusive first day of the filing period (ISO date at 00:00:00Z)."
      - name: period_end_date
        type: datetime
        source: input
        description: "Inclusive last day of the filing period (ISO date at 00:00:00Z)."
      - name: filing_due_date
        type: datetime
        source: input
        description: "Statutory due date for this return (ISO date). Timeliness for the vendor discount compares the logical clock at file time against this date, inclusive."
      - name: lines
        type: array
        source: input
        description: "Array of line objects: { jurisdiction_id (FK Jurisdiction), gross_sales_cents, exempt_sales_cents, deduction_cents }. Server fills each line's rate_bps from the Jurisdiction and computes taxable_cents and line_tax_cents at file time."
      - name: status
        type: enum
        source: system
        default: DRAFT
        description: "Return lifecycle state."
        constraints: "one of DRAFT | FILED | AMENDING | ASSESSED"
      - name: filed_at
        type: datetime
        source: system
        default: null
        description: "Logical-clock timestamp the return most recently transitioned to FILED."
      - name: total_taxable_cents
        type: integer
        source: computed
        description: "Sum of per-line taxable_cents; set at file time."
      - name: tax_due_cents
        type: integer
        source: computed
        description: "Sum of per-line rounded tax; see calculations.return_tax_due (per-line round-then-sum)."
      - name: vendor_discount_cents
        type: integer
        source: computed
        description: "Timely-filing vendor collection discount; see calculations.vendor_collection_discount."
      - name: net_return_due_cents
        type: integer
        source: computed
        description: "tax_due_cents - vendor_discount_cents; the amount this return contributes to the account balance."

  - name: ExemptionCertificate
    parent: null
    common_fields: true
    fields:
      - name: taxpayer_id
        type: string
        source: input
        description: "FK -> Taxpayer.id; the certificate holder."
      - name: exemption_type
        type: enum
        source: input
        description: "Category of exemption."
        constraints: "one of RESALE | GOVERNMENT | NONPROFIT | MANUFACTURING"
      - name: certificate_number
        type: string
        source: input
        description: "Issuer-assigned certificate number."
      - name: effective_date
        type: datetime
        source: input
        description: "Inclusive first day the certificate is valid (ISO date)."
      - name: expiry_date
        type: datetime
        source: input
        description: "Exclusive expiry instant (ISO date). Validity interval is half-open [effective_date, expiry_date)."

  - name: Remittance
    parent: null
    common_fields: true
    fields:
      - name: taxpayer_id
        type: string
        source: input
        description: "FK -> Taxpayer.id; the payer."
      - name: applied_return_id
        type: string
        source: system
        default: null
        description: "FK -> TaxReturn.id; the return this remittance is currently applied against (null when unapplied)."
      - name: remittance_type
        type: enum
        source: input
        description: "PAYMENT settles a filed return; PREPAYMENT is an on-account deposit."
        constraints: "one of PAYMENT | PREPAYMENT"
      - name: amount_cents
        type: integer
        source: input
        description: "Total remitted amount; conserved: applied_amount_cents + unapplied_amount_cents == amount_cents always."
        constraints: "> 0"
      - name: applied_amount_cents
        type: integer
        source: system
        default: 0
        description: "Portion currently applied to applied_return_id."
      - name: unapplied_amount_cents
        type: integer
        source: computed
        description: "amount_cents - applied_amount_cents; on-account balance still available to apply."
      - name: received_at
        type: datetime
        source: system
        description: "Logical-clock timestamp the remittance was recorded."

  - name: Audit
    parent: null
    common_fields: true
    fields:
      - name: taxpayer_id
        type: string
        source: input
        description: "FK -> Taxpayer.id; the audited taxpayer."
      - name: audit_type
        type: enum
        source: input
        description: "FIELD_AUDIT reviews a filed period; NEXUS_DISCOVERY tests economic nexus."
        constraints: "one of FIELD_AUDIT | NEXUS_DISCOVERY"
      - name: period_key
        type: string
        source: input
        description: "The filing period under audit (matches TaxReturn.period_key for FIELD_AUDIT)."
      - name: gross_receipts_cents
        type: integer
        source: input
        default: null
        description: "Measured in-jurisdiction gross receipts (required for NEXUS_DISCOVERY)."
      - name: nexus_established
        type: boolean
        source: computed
        description: "For NEXUS_DISCOVERY: gross_receipts_cents >= NEXUS_THRESHOLD_CENTS (see calculations.nexus_determination). Null/false otherwise."
      - name: status
        type: enum
        source: system
        default: OPEN
        description: "Audit lifecycle state."
        constraints: "one of OPEN | CLOSED_ASSESSED | CLOSED_NO_CHANGE"
      - name: opened_by_user_id
        type: string
        source: system
        description: "X-User-ID of the TaxAuditor who opened the audit."
      - name: closed_at
        type: datetime
        source: system
        default: null
        description: "Logical-clock timestamp the audit closed."

  - name: Assessment
    parent: null
    common_fields: true
    fields:
      - name: taxpayer_id
        type: string
        source: input
        description: "FK -> Taxpayer.id; the assessed taxpayer."
      - name: audit_id
        type: string
        source: input
        default: null
        description: "FK -> Audit.id; the audit that produced an AUDIT_DEFICIENCY assessment (null for LATE_FILING)."
      - name: return_id
        type: string
        source: input
        default: null
        description: "FK -> TaxReturn.id; the return the deficiency attaches to (null when none)."
      - name: assessment_type
        type: enum
        source: input
        description: "Drives the penalty/interest variant."
        constraints: "one of AUDIT_DEFICIENCY | LATE_FILING"
      - name: tax_deficiency_cents
        type: integer
        source: input
        description: "Additional tax base the assessment charges."
        constraints: "> 0"
      - name: original_due_date
        type: datetime
        source: input
        description: "Due date the deficiency should have been paid by; interest accrues from here (ISO date)."
      - name: penalty_cents
        type: integer
        source: computed
        description: "See calculations.assessment_penalty_interest (variant by assessment_type)."
      - name: interest_cents
        type: integer
        source: computed
        description: "Interest on (tax_deficiency_cents + penalty_cents); see calculations.assessment_penalty_interest."
      - name: total_due_cents
        type: integer
        source: computed
        description: "tax_deficiency_cents + penalty_cents + interest_cents."
      - name: status
        type: enum
        source: system
        default: ISSUED
        description: "Assessment lifecycle state."
        constraints: "one of ISSUED | ABATED | AFFIRMED"
      - name: issued_by_user_id
        type: string
        source: system
        description: "X-User-ID that issued the assessment (auditor for AUDIT_DEFICIENCY, issuer for LATE_FILING). Compared against the appeal decider for segregation of duties."
      - name: issued_at
        type: datetime
        source: system
        description: "Logical-clock timestamp the assessment was issued."

  - name: Appeal
    parent: null
    common_fields: true
    fields:
      - name: assessment_id
        type: string
        source: input
        description: "FK -> Assessment.id; the assessment being contested. Ownership derives from the assessment's taxpayer_id."
      - name: grounds
        type: string
        source: input
        description: "Taxpayer's stated grounds for the appeal."
      - name: status
        type: enum
        source: system
        default: SUBMITTED
        description: "Appeal lifecycle state; cycles SUBMITTED <-> INFO_REQUESTED before a terminal decision."
        constraints: "one of SUBMITTED | INFO_REQUESTED | ALLOWED | DENIED"
      - name: info_request_note
        type: string
        source: system
        default: null
        description: "Most recent information request from the AppealsOfficer."
      - name: filed_at
        type: datetime
        source: system
        description: "Logical-clock timestamp the appeal was filed."
      - name: decided_by_user_id
        type: string
        source: system
        default: null
        description: "X-User-ID of the AppealsOfficer who decided the appeal."
      - name: decided_at
        type: datetime
        source: system
        default: null
        description: "Logical-clock timestamp of the decision."

  - name: RefundClaim
    parent: null
    common_fields: true
    fields:
      - name: taxpayer_id
        type: string
        source: input
        description: "FK -> Taxpayer.id; the claimant."
      - name: return_id
        type: string
        source: input
        description: "FK -> TaxReturn.id; the return the overpayment relates to."
      - name: claim_amount_cents
        type: integer
        source: input
        description: "Overpayment principal claimed for refund."
        constraints: "> 0"
      - name: reason
        type: enum
        source: input
        description: "Drives the refund-interest variant."
        constraints: "one of TAXPAYER_ERROR | AUDIT_ADJUSTMENT"
      - name: overpayment_date
        type: datetime
        source: input
        description: "Date the overpayment was made (ISO date); used by the OVERPAYMENT_DATE interest variant."
      - name: status
        type: enum
        source: system
        default: OPEN
        description: "Refund lifecycle state."
        constraints: "one of OPEN | APPROVED | DENIED | VOIDED | SUPERSEDED"
      - name: interest_cents
        type: integer
        source: computed
        description: "Refund interest; see calculations.refund_interest (variant by reason). Computed at approval."
      - name: refund_total_cents
        type: integer
        source: computed
        description: "claim_amount_cents + interest_cents; the credit posted to the balance on approval."
      - name: approved_at
        type: datetime
        source: system
        default: null
        description: "Logical-clock timestamp the refund was approved."

# ============================================================================
# §1.2 State Machine Table
# ============================================================================
state_machines:
  - entity: Taxpayer
    initial_state: PENDING
    terminal_states: []
    transitions:
      - from: PENDING
        to: ACTIVE
        trigger: "POST /tax/taxpayers/{id}/activate"
        actor: TaxAdmin
        preconditions: ["taxpayer.account_status == PENDING"]
        side_effects: ["set activated_at = current clock", "increments Taxpayer.version by 1"]
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /tax/taxpayers/{id}/activate"
        actor: TaxAdmin
        preconditions: ["taxpayer.account_status == SUSPENDED"]
        side_effects: ["clear suspend_reason", "increments Taxpayer.version by 1"]
        note: "Reinstatement path — makes the account state machine non-terminal/cyclic on the ACTIVE<->SUSPENDED pair."
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /tax/taxpayers/{id}/suspend"
        actor: TaxAdmin
        preconditions: ["taxpayer.account_status == ACTIVE"]
        side_effects: ["set suspend_reason from body", "increments Taxpayer.version by 1"]

  - entity: TaxReturn
    initial_state: DRAFT
    terminal_states: [ASSESSED]
    transitions:
      - from: DRAFT
        to: FILED
        trigger: "POST /tax/returns/{id}/file"
        actor: Taxpayer
        preconditions:
          - "return.status == DRAFT"
          - "owning taxpayer.account_status == ACTIVE"
        side_effects:
          - "resolve each line's rate_bps from its Jurisdiction; compute per-line taxable_cents and line_tax_cents"
          - "compute total_taxable_cents, tax_due_cents (calculations.return_tax_due)"
          - "compute vendor_discount_cents (calculations.vendor_collection_discount) and net_return_due_cents"
          - "set filed_at = current clock"
          - "recompute owning Taxpayer.account_balance_cents (derived-on-read)"
          - "increments TaxReturn.version by 1"
      - from: FILED
        to: AMENDING
        trigger: "POST /tax/returns/{id}/amend"
        actor: Taxpayer
        preconditions:
          - "return.status == FILED"
          - "expected_return_version matches TaxReturn.version"
          - "no Audit exists for the same taxpayer_id AND period_key in status OPEN (cross-entity dependency on Audit)"
        side_effects:
          - "replace lines with the amended lines from the body"
          - "CASCADE (depth-2): for every Remittance with applied_return_id == this return, reset applied_amount_cents=0, unapplied_amount_cents=amount_cents, applied_return_id=null (un-apply caused by the return leaving FILED)"
          - "recompute owning Taxpayer.account_balance_cents"
          - "increments TaxReturn.version by 1"
        note: "Cyclic: a return re-files after amendment (AMENDING -> FILED)."
      - from: AMENDING
        to: FILED
        trigger: "POST /tax/returns/{id}/file"
        actor: Taxpayer
        preconditions:
          - "return.status == AMENDING"
          - "owning taxpayer.account_status == ACTIVE"
        side_effects:
          - "recompute total_taxable_cents, tax_due_cents, vendor_discount_cents, net_return_due_cents from amended lines"
          - "set filed_at = current clock"
          - "recompute owning Taxpayer.account_balance_cents"
          - "increments TaxReturn.version by 1"
      - from: FILED
        to: ASSESSED
        trigger: "system: Audit close with outcome ASSESSED referencing this return"
        actor: system
        preconditions: ["return.status == FILED", "closing Audit.taxpayer_id == return.taxpayer_id"]
        side_effects:
          - "CASCADE (depth-3 link 2): the newly ISSUED Assessment marks this return ASSESSED"
          - "CASCADE (depth-3 link 3): because the return became ASSESSED, any RefundClaim on this return in status OPEN is voided (OPEN -> VOIDED)"
          - "recompute owning Taxpayer.account_balance_cents"
          - "increments TaxReturn.version by 1"

  - entity: Audit
    initial_state: OPEN
    terminal_states: [CLOSED_ASSESSED, CLOSED_NO_CHANGE]
    transitions:
      - from: OPEN
        to: CLOSED_ASSESSED
        trigger: "POST /tax/audits/{id}/close with outcome=ASSESSED"
        actor: TaxAuditor
        preconditions:
          - "audit.status == OPEN"
          - "body supplies tax_deficiency_cents > 0 and original_due_date"
        side_effects:
          - "CASCADE (depth-3 link 1): create Assessment{ assessment_type: AUDIT_DEFICIENCY, audit_id: this.id, taxpayer_id, return_id, tax_deficiency_cents, original_due_date } in status ISSUED, issued_by_user_id = audit.opened_by_user_id"
          - "compute the new Assessment's penalty_cents, interest_cents, total_due_cents (calculations.assessment_penalty_interest)"
          - "CASCADE link 2/3: if return_id supplied, drive that TaxReturn FILED -> ASSESSED (which itself voids OPEN RefundClaims on that return)"
          - "recompute owning Taxpayer.account_balance_cents"
          - "set closed_at = current clock"
          - "increments Audit.version by 1"
      - from: OPEN
        to: CLOSED_NO_CHANGE
        trigger: "POST /tax/audits/{id}/close with outcome=NO_CHANGE"
        actor: TaxAuditor
        preconditions: ["audit.status == OPEN"]
        side_effects:
          - "if audit_type == NEXUS_DISCOVERY and nexus_established, set owning Taxpayer.nexus_status = ESTABLISHED"
          - "set closed_at = current clock"
          - "increments Audit.version by 1"

  - entity: Assessment
    initial_state: ISSUED
    terminal_states: [ABATED, AFFIRMED]
    transitions:
      - from: ISSUED
        to: ABATED
        trigger: "system: Appeal decided ALLOWED referencing this assessment"
        actor: system
        preconditions: ["assessment.status == ISSUED"]
        side_effects:
          - "CASCADE: the assessment drops out of the balance (status ABATED excludes total_due_cents from calculations.taxpayer_account_balance)"
          - "if return_id present and that return is ASSESSED, revert it to FILED"
          - "recompute owning Taxpayer.account_balance_cents (conserved: balance falls by exactly the abated total_due_cents)"
          - "increments Assessment.version by 1"
      - from: ISSUED
        to: AFFIRMED
        trigger: "system: Appeal decided DENIED referencing this assessment"
        actor: system
        preconditions: ["assessment.status == ISSUED"]
        side_effects: ["assessment total_due_cents remains in the balance", "increments Assessment.version by 1"]

  - entity: Appeal
    initial_state: SUBMITTED
    terminal_states: [ALLOWED, DENIED]
    transitions:
      - from: SUBMITTED
        to: INFO_REQUESTED
        trigger: "POST /tax/appeals/{id}/request-info"
        actor: AppealsOfficer
        preconditions: ["appeal.status == SUBMITTED"]
        side_effects: ["set info_request_note from body", "increments Appeal.version by 1"]
      - from: INFO_REQUESTED
        to: SUBMITTED
        trigger: "POST /tax/appeals/{id}/respond"
        actor: Taxpayer
        preconditions: ["appeal.status == INFO_REQUESTED", "acting taxpayer owns the appealed assessment"]
        side_effects: ["append response; return to review queue", "increments Appeal.version by 1"]
        note: "Cyclic: SUBMITTED -> INFO_REQUESTED -> SUBMITTED may repeat any number of rounds."
      - from: SUBMITTED
        to: ALLOWED
        trigger: "POST /tax/appeals/{id}/decide with outcome=ALLOW"
        actor: AppealsOfficer
        preconditions:
          - "appeal.status == SUBMITTED"
          - "X-User-ID != appealed Assessment.issued_by_user_id (segregation of duties)"
        side_effects:
          - "set decided_by_user_id, decided_at"
          - "CASCADE: drive the appealed Assessment ISSUED -> ABATED"
          - "increments Appeal.version by 1"
      - from: SUBMITTED
        to: DENIED
        trigger: "POST /tax/appeals/{id}/decide with outcome=DENY"
        actor: AppealsOfficer
        preconditions:
          - "appeal.status == SUBMITTED"
          - "X-User-ID != appealed Assessment.issued_by_user_id (segregation of duties)"
        side_effects:
          - "set decided_by_user_id, decided_at"
          - "CASCADE: drive the appealed Assessment ISSUED -> AFFIRMED"
          - "increments Appeal.version by 1"

  - entity: RefundClaim
    initial_state: OPEN
    terminal_states: [APPROVED, DENIED, VOIDED, SUPERSEDED]
    transitions:
      - from: OPEN
        to: APPROVED
        trigger: "POST /tax/refund-claims/{id}/approve"
        actor: TaxAdmin
        preconditions:
          - "refund.status == OPEN"
          - "owning Taxpayer.account_status != SUSPENDED (cross-entity dependency on Taxpayer)"
        side_effects:
          - "compute interest_cents (calculations.refund_interest, variant by reason) and refund_total_cents"
          - "set approved_at = current clock"
          - "recompute owning Taxpayer.account_balance_cents (balance falls by refund_total_cents)"
          - "increments RefundClaim.version by 1"
      - from: OPEN
        to: DENIED
        trigger: "POST /tax/refund-claims/{id}/deny"
        actor: TaxAdmin
        preconditions: ["refund.status == OPEN"]
        side_effects: ["increments RefundClaim.version by 1"]
      - from: OPEN
        to: SUPERSEDED
        trigger: "system: a newer RefundClaim is created for the same return_id"
        actor: system
        preconditions: ["refund.status == OPEN"]
        side_effects: ["increments RefundClaim.version by 1"]
      - from: OPEN
        to: VOIDED
        trigger: "system: the claim's return transitions to ASSESSED"
        actor: system
        preconditions: ["refund.status == OPEN"]
        side_effects: ["increments RefundClaim.version by 1"]

# ----------------------------------------------------------------------------
# §1.2.1 Concurrency Rules
# ----------------------------------------------------------------------------
concurrency_rules:
  - rule_id: refund-create-stale-return
    parent_entity: TaxReturn
    write_endpoint: "POST /tax/refund-claims"
    occ_field: "expected_return_version"
    description: |
      Creating a RefundClaim against a TaxReturn whose version has advanced
      since the client last observed it is rejected. Creating a claim
      annotates the return (marking it as carrying an outstanding refund) and
      supersedes any prior OPEN claim for the same return, so the operation
      legitimately advances the return's version; a second create still
      carrying the previously observed version is therefore working from a
      stale view and is refused.
    error_id: ERR_STALE_VERSION
    http_status: 412

# ============================================================================
# §1.3 Calculation Rules Table
# ============================================================================
calculations:
  - name: return_tax_due
    trigger: "TaxReturn file (DRAFT->FILED or AMENDING->FILED)"
    algorithm: aggregation
    formula: |
      for each line L in return.lines:
        rate_bps = Jurisdiction(L.jurisdiction_id).rate_bps
        L.taxable_cents  = max(0, L.gross_sales_cents - L.exempt_sales_cents - L.deduction_cents)
        L.line_tax_cents = round_half_up(L.taxable_cents * rate_bps / 10000)   # ROUND PER LINE
      total_taxable_cents = sum(L.taxable_cents)
      tax_due_cents       = sum(L.line_tax_cents)                              # THEN SUM
    input_set: "all line objects on the return being filed"
    constants: {}
    precision: "integer cents; round_half_up applied to EACH line before summing (per-line-then-sum, pinned)"
    variants: []

  - name: vendor_collection_discount
    trigger: "TaxReturn file (DRAFT->FILED or AMENDING->FILED), after return_tax_due"
    algorithm: threshold
    formula: |
      timely = (clock_date_at_file <= return.filing_due_date)   # inclusive: on the due date IS timely
      if timely AND owning_taxpayer.account_status == ACTIVE:
        vendor_discount_cents = min(round_half_up(tax_due_cents * VENDOR_DISCOUNT_BPS / 10000),
                                    VENDOR_DISCOUNT_CAP_CENTS)
      else:
        vendor_discount_cents = 0
      net_return_due_cents = tax_due_cents - vendor_discount_cents
    input_set: "the single return being filed; clock compared to filing_due_date at day granularity"
    constants:
      VENDOR_DISCOUNT_BPS: 150
      VENDOR_DISCOUNT_CAP_CENTS: 100000
    precision: "integer cents, round_half_up; boundary is <= (file exactly on filing_due_date qualifies)"
    variants: []

  - name: assessment_penalty_interest
    trigger: "Assessment issuance (Audit close ASSESSED, or POST /tax/assessments)"
    algorithm: tiered_pricing
    formula: |
      base = assessment.tax_deficiency_cents
      months_late = floor( (issued_clock_date - assessment.original_due_date) / 30_days )   # 30-day months
      if assessment_type == AUDIT_DEFICIENCY:
        penalty_cents = round_half_up(base * NEGLIGENCE_PENALTY_BPS / 10000)
      else:  # LATE_FILING
        penalty_cents = min(round_half_up(base * LATE_FILING_PENALTY_BPS / 10000),
                            LATE_FILING_PENALTY_CAP_CENTS)
      # PINNED evaluation order: base -> penalty -> interest(on base+penalty) -> total
      interest_cents  = round_half_up( (base + penalty_cents) * MONTHLY_INTEREST_BPS / 10000 * months_late )
      total_due_cents = base + penalty_cents + interest_cents
    input_set: "the single assessment"
    constants:
      NEGLIGENCE_PENALTY_BPS: 2500
      LATE_FILING_PENALTY_BPS: 1000
      LATE_FILING_PENALTY_CAP_CENTS: 500000
      MONTHLY_INTEREST_BPS: 100
    precision: "integer cents, round_half_up; interest is charged on (base + penalty), never on base alone"
    variants:
      - name: AUDIT_DEFICIENCY
        when: "assessment_type == AUDIT_DEFICIENCY (auditor-found deficiency)"
        difference: "penalty = 25% of base (NEGLIGENCE_PENALTY_BPS); no cap"
      - name: LATE_FILING
        when: "assessment_type == LATE_FILING (self-reported late filing)"
        difference: "penalty = 10% of base (LATE_FILING_PENALTY_BPS) capped at LATE_FILING_PENALTY_CAP_CENTS"

  - name: refund_interest
    trigger: "RefundClaim approve (OPEN->APPROVED)"
    algorithm: decay_function
    formula: |
      principal = refund.claim_amount_cents
      if refund.reason == TAXPAYER_ERROR:   # variant STATUTORY_DELAY
        days_since_filed = (approve_clock_date - refund.created_at_date)
        chargeable = max(0, days_since_filed - REFUND_GRACE_DAYS)
        interest_cents = round_half_up(principal * DAILY_INTEREST_BPS / 10000 * chargeable)
      else:                                 # reason == AUDIT_ADJUSTMENT, variant OVERPAYMENT_DATE
        days_since_overpayment = (approve_clock_date - refund.overpayment_date)
        interest_cents = round_half_up(principal * DAILY_INTEREST_BPS / 10000 * days_since_overpayment)
      refund_total_cents = principal + interest_cents
    input_set: "the single refund claim; day counts inclusive of end, exclusive of start"
    constants:
      REFUND_GRACE_DAYS: 90
      DAILY_INTEREST_BPS: 3
    precision: "integer cents, round_half_up"
    variants:
      - name: STATUTORY_DELAY
        when: "reason == TAXPAYER_ERROR"
        difference: "interest starts only after REFUND_GRACE_DAYS from claim filing date (created_at); zero if within grace"
      - name: OVERPAYMENT_DATE
        when: "reason == AUDIT_ADJUSTMENT"
        difference: "interest accrues from the overpayment_date with no grace period"

  - name: nexus_determination
    trigger: "Audit create/close where audit_type == NEXUS_DISCOVERY"
    algorithm: threshold
    formula: |
      nexus_established = (audit.gross_receipts_cents >= NEXUS_THRESHOLD_CENTS)   # boundary is >=
    input_set: "the single audit's gross_receipts_cents"
    constants:
      NEXUS_THRESHOLD_CENTS: 10000000
    precision: "exact integer compare; gross_receipts_cents EQUAL to the threshold establishes nexus"
    variants: []

  - name: taxpayer_account_balance
    trigger: "derived-on-read; recomputed after any return/assessment/remittance/refund mutation"
    algorithm: aggregation
    formula: |
      account_balance_cents =
          sum( r.net_return_due_cents for TaxReturn r
               where r.taxpayer_id == tp.id AND r.status IN {FILED, ASSESSED} )
        + sum( a.total_due_cents      for Assessment a
               where a.taxpayer_id == tp.id AND a.status IN {ISSUED, AFFIRMED} )
        - sum( m.applied_amount_cents for Remittance m
               where m.taxpayer_id == tp.id )
        - sum( f.refund_total_cents   for RefundClaim f
               where f.taxpayer_id == tp.id AND f.status == APPROVED )
    input_set: "explicit status filters as above; AMENDING/DRAFT returns, ABATED assessments, and non-APPROVED refunds are excluded"
    constants: {}
    precision: "integer cents; positive balance = owed to the municipality"
    variants: []

  - name: remittance_application
    trigger: "POST /tax/remittances/{id}/apply"
    algorithm: waterfall_allocation
    formula: |
      target = TaxReturn(applied_return_id)
      already = sum(applied_amount_cents of other remittances applied to target)
      room    = target.net_return_due_cents - already
      request = body.apply_amount_cents
      # conservation invariant: applied_amount_cents + unapplied_amount_cents == amount_cents (always)
      if request > remittance.unapplied_amount_cents: reject ERR_OVERAPPLICATION
      if request > room: reject ERR_OVERAPPLICATION
      remittance.applied_amount_cents   += request
      remittance.unapplied_amount_cents  = amount_cents - applied_amount_cents
      remittance.applied_return_id       = target.id
    input_set: "the remittance and its target return"
    constants: {}
    precision: "integer cents"
    variants: []

# ============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# ============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all except POST /tax/taxpayers (public registration)"
  - priority: 2
    category: auth
    check: "acting role is permitted for the operation per §1.7"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all
  - priority: 3
    category: validation
    check: "request body well-formed; required fields present; enums in range; amounts > 0 where required"
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: "all write endpoints"
  - priority: 4
    category: existence
    check: "all path ids and referenced FK ids resolve (validated left-to-right)"
    error_id: ERR_TAXPAYER_NOT_FOUND
    http_status: 404
    applies_to: "endpoints referencing a taxpayer_id"
  - priority: 4
    category: existence
    check: "referenced jurisdiction on each line exists and is active"
    error_id: ERR_JURISDICTION_NOT_FOUND
    http_status: 404
    applies_to: "POST /tax/returns, POST /tax/returns/{id}/amend"
  - priority: 4
    category: existence
    check: "referenced return exists"
    error_id: ERR_RETURN_NOT_FOUND
    http_status: 404
    applies_to: "return sub-paths, remittance apply, assessment/refund creation"
  - priority: 4
    category: existence
    check: "referenced remittance exists"
    error_id: ERR_REMITTANCE_NOT_FOUND
    http_status: 404
    applies_to: "POST /tax/remittances/{id}/apply, GET /tax/remittances/{id}"
  - priority: 4
    category: existence
    check: "referenced exemption certificate exists"
    error_id: ERR_CERTIFICATE_NOT_FOUND
    http_status: 404
    applies_to: "POST /tax/returns when exemption_certificate_id supplied"
  - priority: 4
    category: existence
    check: "referenced audit exists"
    error_id: ERR_AUDIT_NOT_FOUND
    http_status: 404
    applies_to: "audit sub-paths"
  - priority: 4
    category: existence
    check: "referenced assessment exists"
    error_id: ERR_ASSESSMENT_NOT_FOUND
    http_status: 404
    applies_to: "POST /tax/appeals, assessment reads"
  - priority: 4
    category: existence
    check: "referenced appeal exists"
    error_id: ERR_APPEAL_NOT_FOUND
    http_status: 404
    applies_to: "appeal sub-paths"
  - priority: 4
    category: existence
    check: "referenced refund claim exists"
    error_id: ERR_REFUND_NOT_FOUND
    http_status: 404
    applies_to: "refund sub-paths"
  - priority: 5
    category: state
    check: "return is in DRAFT or AMENDING before file"
    error_id: ERR_RETURN_NOT_DRAFT
    http_status: 409
    applies_to: "POST /tax/returns/{id}/file"
  - priority: 5
    category: state
    check: "taxpayer account_status == ACTIVE when filing a return"
    error_id: ERR_ACCOUNT_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /tax/returns/{id}/file"
  - priority: 5
    category: state
    check: "return is FILED before amend or before a remittance may be applied to it"
    error_id: ERR_RETURN_NOT_FILED
    http_status: 409
    applies_to: "POST /tax/returns/{id}/amend, POST /tax/remittances/{id}/apply"
  - priority: 5
    category: state
    check: "assessment is ISSUED before an appeal may be filed"
    error_id: ERR_ASSESSMENT_NOT_ISSUED
    http_status: 409
    applies_to: "POST /tax/appeals"
  - priority: 5
    category: state
    check: "appeal is SUBMITTED before decide; INFO_REQUESTED before respond"
    error_id: ERR_APPEAL_NOT_OPEN
    http_status: 409
    applies_to: "POST /tax/appeals/{id}/decide, POST /tax/appeals/{id}/request-info"
  - priority: 5
    category: state
    check: "appeal is INFO_REQUESTED before respond"
    error_id: ERR_INFO_NOT_REQUESTED
    http_status: 409
    applies_to: "POST /tax/appeals/{id}/respond"
  - priority: 5
    category: state
    check: "audit is OPEN before close"
    error_id: ERR_AUDIT_NOT_OPEN
    http_status: 409
    applies_to: "POST /tax/audits/{id}/close"
  - priority: 5
    category: state
    check: "refund claim is OPEN before approve/deny"
    error_id: ERR_REFUND_NOT_OPEN
    http_status: 409
    applies_to: "POST /tax/refund-claims/{id}/approve, /deny"
  - priority: 5
    category: state
    check: "owning taxpayer is not SUSPENDED when approving a refund"
    error_id: ERR_ACCOUNT_SUSPENDED
    http_status: 409
    applies_to: "POST /tax/refund-claims/{id}/approve"
  - priority: 6
    category: state
    check: "expected_return_version matches TaxReturn.version (OCC on refund creation)"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /tax/refund-claims"
  - priority: 7
    category: business_referential
    check: "supplied exemption_certificate_id belongs to the same taxpayer as the return"
    error_id: ERR_CERTIFICATE_OWNER_MISMATCH
    http_status: 409
    applies_to: "POST /tax/returns"
  - priority: 8
    category: business_temporal
    check: "supplied exemption certificate is valid at period_end_date (effective_date <= period_end_date < expiry_date)"
    error_id: ERR_CERTIFICATE_EXPIRED
    http_status: 409
    applies_to: "POST /tax/returns"
  - priority: 8
    category: business_temporal
    check: "appeal filed within APPEAL_WINDOW_DAYS (= 60) days of assessment issued_at, compared on the logical clock"
    error_id: ERR_APPEAL_WINDOW_CLOSED
    http_status: 409
    applies_to: "POST /tax/appeals"
  - priority: 9
    category: business_constraint
    check: "no existing TaxReturn for the same taxpayer whose closed period [start,end] overlaps the new period"
    error_id: ERR_PERIOD_OVERLAP
    http_status: 409
    applies_to: "POST /tax/returns"
  - priority: 9
    category: business_constraint
    check: "no existing ExemptionCertificate for the same taxpayer AND exemption_type whose half-open validity [effective,expiry) overlaps the new one"
    error_id: ERR_CERTIFICATE_OVERLAP
    http_status: 409
    applies_to: "POST /tax/exemption-certificates"
  - priority: 9
    category: business_constraint
    check: "jurisdiction code is unique"
    error_id: ERR_DUPLICATE_JURISDICTION
    http_status: 409
    applies_to: "POST /tax/jurisdictions"
  - priority: 9
    category: business_constraint
    check: "no OPEN Audit for the same taxpayer_id AND period_key when amending a return"
    error_id: ERR_AUDIT_OPEN_ON_PERIOD
    http_status: 409
    applies_to: "POST /tax/returns/{id}/amend"
  - priority: 9
    category: business_constraint
    check: "deciding AppealsOfficer's X-User-ID differs from the appealed assessment's issued_by_user_id (segregation of duties)"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 409
    applies_to: "POST /tax/appeals/{id}/decide"
  - priority: 10
    category: business_fiscal
    check: "applied amount does not exceed the remittance unapplied balance nor the target return's remaining net due"
    error_id: ERR_OVERAPPLICATION
    http_status: 422
    applies_to: "POST /tax/remittances/{id}/apply"

# ============================================================================
# §1.5 API Endpoint Table
# ============================================================================
endpoints:
  # --- Jurisdictions ---
  - method: POST
    path: "/tax/jurisdictions"
    description: "Create a tax jurisdiction (rate config)."
    roles: [TaxAdmin]
    code: 201
    input: [code, name, rate_bps, "active?"]
    output: Jurisdiction
    side_effects: ["reject duplicate code (ERR_DUPLICATE_JURISDICTION)"]
  - method: GET
    path: "/tax/jurisdictions/{id}"
    description: "Read a jurisdiction."
    roles: [TaxAdmin, TaxAuditor, AppealsOfficer, Taxpayer]
    code: 200
    input: []
    output: Jurisdiction
    side_effects: []
  - method: GET
    path: "/tax/jurisdictions"
    description: "List jurisdictions."
    roles: [TaxAdmin, TaxAuditor, AppealsOfficer, Taxpayer]
    code: 200
    input: ["active?", "limit?", "offset?"]
    output: Jurisdiction[]
    side_effects: []

  # --- Taxpayers ---
  - method: POST
    path: "/tax/taxpayers"
    description: "Public taxpayer registration; account starts PENDING."
    roles: [Anonymous]
    code: 201
    input: [legal_name, entity_type, email, filing_frequency]
    output: Taxpayer
    side_effects: ["account_status = PENDING"]
  - method: GET
    path: "/tax/taxpayers/{id}"
    description: "Read a taxpayer, including derived account_balance_cents."
    roles: [TaxAdmin, TaxAuditor, AppealsOfficer, Taxpayer]
    code: 200
    input: []
    output: Taxpayer
    side_effects: ["account_balance_cents recomputed on read"]
  - method: GET
    path: "/tax/taxpayers"
    description: "List taxpayers."
    roles: [TaxAdmin, TaxAuditor, AppealsOfficer]
    code: 200
    input: ["account_status?", "limit?", "offset?"]
    output: Taxpayer[]
    side_effects: []
  - method: POST
    path: "/tax/taxpayers/{id}/activate"
    description: "Activate (PENDING->ACTIVE) or reinstate (SUSPENDED->ACTIVE) an account."
    roles: [TaxAdmin]
    code: 200
    input: []
    output: Taxpayer
    side_effects: ["set activated_at on first activation", "increments Taxpayer.version by 1"]
  - method: POST
    path: "/tax/taxpayers/{id}/suspend"
    description: "Suspend an ACTIVE account."
    roles: [TaxAdmin]
    code: 200
    input: [suspend_reason]
    output: Taxpayer
    side_effects: ["set suspend_reason", "increments Taxpayer.version by 1"]

  # --- Returns ---
  - method: POST
    path: "/tax/returns"
    description: "Create a DRAFT return with line objects (jurisdiction rates resolved at file time)."
    roles: [Taxpayer]
    code: 201
    input: [taxpayer_id, period_key, period_start_date, period_end_date, filing_due_date, lines, "exemption_certificate_id?"]
    output: TaxReturn
    side_effects:
      - "reject overlapping period (ERR_PERIOD_OVERLAP)"
      - "if exemption_certificate_id supplied: owner match then validity checks (ERR_CERTIFICATE_OWNER_MISMATCH, ERR_CERTIFICATE_EXPIRED)"
  - method: GET
    path: "/tax/returns/{id}"
    description: "Read a return."
    roles: [TaxAdmin, TaxAuditor, AppealsOfficer, Taxpayer]
    code: 200
    input: []
    output: TaxReturn
    side_effects: []
  - method: GET
    path: "/tax/returns"
    description: "List/filter returns (reverse-reachability for taxpayer_id and exemption_certificate_id)."
    roles: [TaxAdmin, TaxAuditor, AppealsOfficer, Taxpayer]
    code: 200
    input: ["taxpayer_id?", "exemption_certificate_id?", "status?", "period_key?", "limit?", "offset?"]
    output: TaxReturn[]
    side_effects: []
  - method: POST
    path: "/tax/returns/{id}/file"
    description: "File a DRAFT/AMENDING return: compute tax, discount, net due; set filed_at."
    roles: [Taxpayer]
    code: 200
    input: []
    output: TaxReturn
    side_effects:
      - "calculations.return_tax_due, vendor_collection_discount"
      - "recompute Taxpayer.account_balance_cents"
      - "increments TaxReturn.version by 1"
  - method: POST
    path: "/tax/returns/{id}/amend"
    description: "Reopen a FILED return for correction (FILED->AMENDING) with new lines; OCC-guarded."
    roles: [Taxpayer]
    code: 200
    input: [expected_return_version, lines]
    output: TaxReturn
    side_effects:
      - "cross-entity check: no OPEN Audit on the period (ERR_AUDIT_OPEN_ON_PERIOD)"
      - "CASCADE: un-apply all remittances applied to this return"
      - "increments TaxReturn.version by 1"

  # --- Exemption Certificates ---
  - method: POST
    path: "/tax/exemption-certificates"
    description: "Register an exemption certificate for a taxpayer."
    roles: [Taxpayer]
    code: 201
    input: [taxpayer_id, exemption_type, certificate_number, effective_date, expiry_date]
    output: ExemptionCertificate
    side_effects: ["reject overlapping validity for same taxpayer+type (ERR_CERTIFICATE_OVERLAP)"]
  - method: GET
    path: "/tax/exemption-certificates/{id}"
    description: "Read an exemption certificate."
    roles: [TaxAdmin, TaxAuditor, AppealsOfficer, Taxpayer]
    code: 200
    input: []
    output: ExemptionCertificate
    side_effects: []
  - method: GET
    path: "/tax/exemption-certificates"
    description: "List/filter exemption certificates (reverse-reachability for taxpayer_id)."
    roles: [TaxAdmin, TaxAuditor, AppealsOfficer, Taxpayer]
    code: 200
    input: ["taxpayer_id?", "exemption_type?", "limit?", "offset?"]
    output: ExemptionCertificate[]
    side_effects: []

  # --- Remittances ---
  - method: POST
    path: "/tax/remittances"
    description: "Record a PAYMENT or PREPAYMENT on account (unapplied)."
    roles: [Taxpayer]
    code: 201
    input: [taxpayer_id, remittance_type, amount_cents]
    output: Remittance
    side_effects: ["received_at = current clock", "applied_amount_cents = 0"]
  - method: GET
    path: "/tax/remittances/{id}"
    description: "Read a remittance."
    roles: [TaxAdmin, TaxAuditor, AppealsOfficer, Taxpayer]
    code: 200
    input: []
    output: Remittance
    side_effects: []
  - method: GET
    path: "/tax/remittances"
    description: "List/filter remittances (reverse-reachability for taxpayer_id and applied_return_id)."
    roles: [TaxAdmin, TaxAuditor, AppealsOfficer, Taxpayer]
    code: 200
    input: ["taxpayer_id?", "applied_return_id?", "remittance_type?", "limit?", "offset?"]
    output: Remittance[]
    side_effects: []
  - method: POST
    path: "/tax/remittances/{id}/apply"
    description: "Apply part/all of a remittance's unapplied balance to a FILED return."
    roles: [Taxpayer]
    code: 200
    input: [applied_return_id, apply_amount_cents]
    output: Remittance
    side_effects:
      - "state check ERR_RETURN_NOT_FILED before fiscal check ERR_OVERAPPLICATION"
      - "calculations.remittance_application"
      - "recompute Taxpayer.account_balance_cents"
      - "increments Remittance.version by 1"

  # --- Audits ---
  - method: POST
    path: "/tax/audits"
    description: "Open a FIELD_AUDIT or NEXUS_DISCOVERY audit; NEXUS_DISCOVERY computes nexus_established."
    roles: [TaxAuditor]
    code: 201
    input: [taxpayer_id, audit_type, period_key, "gross_receipts_cents?"]
    output: Audit
    side_effects: ["opened_by_user_id = X-User-ID", "nexus_established via calculations.nexus_determination for NEXUS_DISCOVERY"]
  - method: GET
    path: "/tax/audits/{id}"
    description: "Read an audit."
    roles: [TaxAdmin, TaxAuditor, AppealsOfficer, Taxpayer]
    code: 200
    input: []
    output: Audit
    side_effects: []
  - method: GET
    path: "/tax/audits"
    description: "List/filter audits (reverse-reachability for taxpayer_id)."
    roles: [TaxAdmin, TaxAuditor, AppealsOfficer, Taxpayer]
    code: 200
    input: ["taxpayer_id?", "status?", "audit_type?", "limit?", "offset?"]
    output: Audit[]
    side_effects: []
  - method: POST
    path: "/tax/audits/{id}/close"
    description: "Close an audit; outcome ASSESSED creates an AUDIT_DEFICIENCY Assessment (cascade)."
    roles: [TaxAuditor]
    code: 200
    input: [outcome, "tax_deficiency_cents?", "original_due_date?", "return_id?"]
    output: Audit
    side_effects:
      - "outcome ASSESSED: create ISSUED Assessment (depth-3 cascade -> return ASSESSED -> void OPEN refunds)"
      - "outcome NO_CHANGE on NEXUS_DISCOVERY with nexus_established: set Taxpayer.nexus_status = ESTABLISHED"
      - "increments Audit.version by 1"

  # --- Assessments ---
  - method: POST
    path: "/tax/assessments"
    description: "Issue a LATE_FILING assessment directly (no audit)."
    roles: [TaxAuditor]
    code: 201
    input: [taxpayer_id, assessment_type, tax_deficiency_cents, original_due_date, "return_id?"]
    output: Assessment
    side_effects: ["issued_by_user_id = X-User-ID", "calculations.assessment_penalty_interest", "recompute Taxpayer.account_balance_cents"]
  - method: GET
    path: "/tax/assessments/{id}"
    description: "Read an assessment."
    roles: [TaxAdmin, TaxAuditor, AppealsOfficer, Taxpayer]
    code: 200
    input: []
    output: Assessment
    side_effects: []
  - method: GET
    path: "/tax/assessments"
    description: "List/filter assessments (reverse-reachability for taxpayer_id, audit_id, return_id)."
    roles: [TaxAdmin, TaxAuditor, AppealsOfficer, Taxpayer]
    code: 200
    input: ["taxpayer_id?", "audit_id?", "return_id?", "status?", "limit?", "offset?"]
    output: Assessment[]
    side_effects: []

  # --- Appeals ---
  - method: POST
    path: "/tax/appeals"
    description: "File an appeal against an ISSUED assessment (within the appeal window)."
    roles: [Taxpayer]
    code: 201
    input: [assessment_id, grounds]
    output: Appeal
    side_effects: ["filed_at = current clock", "reject if window closed (ERR_APPEAL_WINDOW_CLOSED)"]
  - method: GET
    path: "/tax/appeals/{id}"
    description: "Read an appeal."
    roles: [TaxAdmin, TaxAuditor, AppealsOfficer, Taxpayer]
    code: 200
    input: []
    output: Appeal
    side_effects: []
  - method: GET
    path: "/tax/appeals"
    description: "List/filter appeals (reverse-reachability for assessment_id)."
    roles: [TaxAdmin, TaxAuditor, AppealsOfficer, Taxpayer]
    code: 200
    input: ["assessment_id?", "status?", "limit?", "offset?"]
    output: Appeal[]
    side_effects: []
  - method: POST
    path: "/tax/appeals/{id}/request-info"
    description: "AppealsOfficer requests more information (SUBMITTED->INFO_REQUESTED)."
    roles: [AppealsOfficer]
    code: 200
    input: [info_request_note]
    output: Appeal
    side_effects: ["increments Appeal.version by 1"]
  - method: POST
    path: "/tax/appeals/{id}/respond"
    description: "Taxpayer responds to an info request (INFO_REQUESTED->SUBMITTED)."
    roles: [Taxpayer]
    code: 200
    input: [response_note]
    output: Appeal
    side_effects: ["increments Appeal.version by 1"]
  - method: POST
    path: "/tax/appeals/{id}/decide"
    description: "AppealsOfficer allows or denies (SoD-checked); cascades to the assessment."
    roles: [AppealsOfficer]
    code: 200
    input: [outcome]
    output: Appeal
    side_effects:
      - "ERR_SEGREGATION_OF_DUTIES if X-User-ID == assessment.issued_by_user_id"
      - "ALLOW -> Assessment ABATED; DENY -> Assessment AFFIRMED"
      - "recompute Taxpayer.account_balance_cents"
      - "increments Appeal.version by 1"

  # --- Refund Claims ---
  - method: POST
    path: "/tax/refund-claims"
    description: "File a refund claim for a return overpayment; OCC-guarded on the return; supersedes prior OPEN claim for the same return."
    roles: [Taxpayer]
    code: 201
    input: [taxpayer_id, return_id, claim_amount_cents, reason, overpayment_date, expected_return_version]
    output: RefundClaim
    side_effects:
      - "ERR_STALE_VERSION (412) when expected_return_version != TaxReturn.version"
      - "supersede prior OPEN RefundClaim for the same return (OPEN -> SUPERSEDED)"
      - "increments TaxReturn.version by 1"
  - method: GET
    path: "/tax/refund-claims/{id}"
    description: "Read a refund claim."
    roles: [TaxAdmin, TaxAuditor, AppealsOfficer, Taxpayer]
    code: 200
    input: []
    output: RefundClaim
    side_effects: []
  - method: GET
    path: "/tax/refund-claims"
    description: "List/filter refund claims (reverse-reachability for taxpayer_id and return_id)."
    roles: [TaxAdmin, TaxAuditor, AppealsOfficer, Taxpayer]
    code: 200
    input: ["taxpayer_id?", "return_id?", "status?", "limit?", "offset?"]
    output: RefundClaim[]
    side_effects: []
  - method: POST
    path: "/tax/refund-claims/{id}/approve"
    description: "Approve a refund (computes interest); blocked if taxpayer SUSPENDED."
    roles: [TaxAdmin]
    code: 200
    input: []
    output: RefundClaim
    side_effects:
      - "calculations.refund_interest; set refund_total_cents, approved_at"
      - "recompute Taxpayer.account_balance_cents"
      - "increments RefundClaim.version by 1"
  - method: POST
    path: "/tax/refund-claims/{id}/deny"
    description: "Deny a refund claim (OPEN->DENIED)."
    roles: [TaxAdmin]
    code: 200
    input: ["deny_reason?"]
    output: RefundClaim
    side_effects: ["increments RefundClaim.version by 1"]

  # --- Test-driving clock ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the logical clock. Server startup default is 2026-05-01T00:00:00Z; before any call here the clock reads exactly this default and never falls back to wall-clock time."
    roles: [TaxAdmin]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["all subsequent created_at / filed_at / received_at / issued_at / approved_at reads use this instant"]

# ============================================================================
# §1.6 Error Code Catalog
# ============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "auth headers missing on a protected endpoint"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "acting role not permitted for the operation"
  - id: ERR_VALIDATION
    http: 400
    condition: "malformed body, missing required field, out-of-range enum/amount"
  - id: ERR_TAXPAYER_NOT_FOUND
    http: 404
    condition: "referenced taxpayer_id does not exist"
  - id: ERR_JURISDICTION_NOT_FOUND
    http: 404
    condition: "referenced jurisdiction on a line does not exist or is inactive"
  - id: ERR_RETURN_NOT_FOUND
    http: 404
    condition: "referenced return does not exist"
  - id: ERR_REMITTANCE_NOT_FOUND
    http: 404
    condition: "referenced remittance does not exist"
  - id: ERR_CERTIFICATE_NOT_FOUND
    http: 404
    condition: "referenced exemption certificate does not exist"
  - id: ERR_AUDIT_NOT_FOUND
    http: 404
    condition: "referenced audit does not exist"
  - id: ERR_ASSESSMENT_NOT_FOUND
    http: 404
    condition: "referenced assessment does not exist"
  - id: ERR_APPEAL_NOT_FOUND
    http: 404
    condition: "referenced appeal does not exist"
  - id: ERR_REFUND_NOT_FOUND
    http: 404
    condition: "referenced refund claim does not exist"
  - id: ERR_RETURN_NOT_DRAFT
    http: 409
    condition: "file attempted on a return not in DRAFT/AMENDING"
  - id: ERR_RETURN_NOT_FILED
    http: 409
    condition: "amend or remittance-apply attempted against a return not in FILED"
  - id: ERR_ACCOUNT_NOT_ACTIVE
    http: 409
    condition: "filing attempted while taxpayer account_status != ACTIVE"
  - id: ERR_ACCOUNT_SUSPENDED
    http: 409
    condition: "refund approval attempted while owning taxpayer is SUSPENDED"
  - id: ERR_AUDIT_NOT_OPEN
    http: 409
    condition: "close attempted on an audit not in OPEN"
  - id: ERR_ASSESSMENT_NOT_ISSUED
    http: 409
    condition: "appeal filed against an assessment not in ISSUED"
  - id: ERR_APPEAL_NOT_OPEN
    http: 409
    condition: "decide/request-info attempted on an appeal not in SUBMITTED"
  - id: ERR_INFO_NOT_REQUESTED
    http: 409
    condition: "respond attempted on an appeal not in INFO_REQUESTED"
  - id: ERR_REFUND_NOT_OPEN
    http: 409
    condition: "approve/deny attempted on a refund not in OPEN"
  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_return_version does not match current TaxReturn.version on refund creation"
  - id: ERR_CERTIFICATE_OWNER_MISMATCH
    http: 409
    condition: "exemption certificate belongs to a different taxpayer than the return (referential)"
  - id: ERR_CERTIFICATE_EXPIRED
    http: 409
    condition: "exemption certificate not valid at the return's period_end_date (temporal)"
  - id: ERR_APPEAL_WINDOW_CLOSED
    http: 409
    condition: "appeal filed more than APPEAL_WINDOW_DAYS (= 60) days after assessment issued_at (temporal)"
  - id: ERR_PERIOD_OVERLAP
    http: 409
    condition: "new return period [start,end] overlaps an existing return period for the taxpayer (closed interval)"
  - id: ERR_CERTIFICATE_OVERLAP
    http: 409
    condition: "new certificate validity [effective,expiry) overlaps an existing same-type certificate for the taxpayer (half-open)"
  - id: ERR_DUPLICATE_JURISDICTION
    http: 409
    condition: "jurisdiction code already exists"
  - id: ERR_AUDIT_OPEN_ON_PERIOD
    http: 409
    condition: "amend blocked by an OPEN audit for the same taxpayer+period"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 409
    condition: "appeal decider's X-User-ID equals the appealed assessment's issued_by_user_id"
  - id: ERR_OVERAPPLICATION
    http: 422
    condition: "applied amount exceeds remittance unapplied balance or the return's remaining net due"

# ============================================================================
# §1.7 RBAC Matrix
# ============================================================================
roles:
  - name: Anonymous
    description: "Unauthenticated public caller; may only register a taxpayer."
    identity: opaque
    exclusive_operations:
      - "POST /tax/taxpayers (register)"
    shared_operations: []
  - name: Taxpayer
    description: "A registered business acting on its own resources (X-User-ID == Taxpayer.id)."
    identity: "entity_backed:Taxpayer"
    exclusive_operations:
      - "POST /tax/returns"
      - "POST /tax/returns/{id}/file"
      - "POST /tax/returns/{id}/amend"
      - "POST /tax/exemption-certificates"
      - "POST /tax/remittances"
      - "POST /tax/remittances/{id}/apply"
      - "POST /tax/appeals"
      - "POST /tax/appeals/{id}/respond"
      - "POST /tax/refund-claims"
    shared_operations:
      - "GET reads on own returns/remittances/certificates/audits/assessments/appeals/refund-claims/taxpayer"
  - name: TaxAuditor
    description: "Municipal auditor; opens/closes audits and issues assessments."
    identity: opaque
    exclusive_operations:
      - "POST /tax/audits"
      - "POST /tax/audits/{id}/close"
      - "POST /tax/assessments"
    shared_operations:
      - "GET reads across taxpayers/returns/audits/assessments/appeals"
  - name: AppealsOfficer
    description: "Independent appeals officer; reviews and decides appeals. Must not decide an appeal on an assessment they issued (SoD)."
    identity: opaque
    exclusive_operations:
      - "POST /tax/appeals/{id}/request-info"
      - "POST /tax/appeals/{id}/decide"
    shared_operations:
      - "GET reads on appeals/assessments"
  - name: TaxAdmin
    description: "Administrative operator; manages jurisdictions, account lifecycle, refunds, and the logical clock."
    identity: opaque
    exclusive_operations:
      - "POST /tax/jurisdictions"
      - "POST /tax/taxpayers/{id}/activate"
      - "POST /tax/taxpayers/{id}/suspend"
      - "POST /tax/refund-claims/{id}/approve"
      - "POST /tax/refund-claims/{id}/deny"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "GET reads across all collections"
