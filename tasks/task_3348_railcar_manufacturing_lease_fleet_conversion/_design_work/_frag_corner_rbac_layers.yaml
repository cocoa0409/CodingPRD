          assert:
            - "Level 1: the booking returns HTTP 201 with data.settlement_status == ${ret_settlement} == \"PENDING\" and data.mileage_overage_cents == ${ret_overage} == 26400 == (5200 - 3 * 1000) * 12"
            - "Level 2a: the placement is closed by the same request — GET /car-assignments/${asg_id} returns data.status == ${asg_status} == \"COMPLETED\""
            - "Level 2b: the car is pulled back with its mileage banked — GET /lease-fleet-cars/${car_id} returns data.status == ${car_status} == \"UNDER_REPAIR\" and data.accumulated_mileage == ${car_mileage} == 5200"
            - "Ordering: the ledger has not moved while the return is PENDING — data.outstanding_balance_cents == ${balance_before_settle} == 0"
            - "Level 3: the settle returns HTTP 200 with data.settlement_status == ${ret_settled} == \"SETTLED\" and the ledger now reads data.outstanding_balance_cents == ${balance_after_settle} == 26400"
