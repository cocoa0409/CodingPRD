# =============================================================================
# SCAFFOLD: Sports Tournament Hosting & Event Bid (sports commission host)
# §1.0–§1.7 only. scaffold_difficulty_design / scaffold_corner_design live in
# their own sibling files.
#
# Common-fields convention: entities with `common_fields: true` carry
#   id (server-minted UUID, no type prefix; identity ONLY — never used in
#       ranking/tie-break/allocation decisions),
#   created_at / created_at (ISO 8601 UTC, 3 fractional digits),
#   updated_at (refreshed on every mutation incl. cascades),
#   version (integer, starts at 1, +1 on every mutation).
# =============================================================================

scenario: |
  Sports Tournament Hosting & Event Bid (sports commission host): bid submission
  to sanctioning body & requirement checklist, venue/hotel block agreement &
  rebate structure, participant registration & bracket seeding, officials
  assignment & housing, economic impact reporting to sponsors/CVB, volunteer
  recruitment & shift scheduling, weather contingency & field rescheduling,
  post-event settlement & bid renewal. The sports commission runs the full
  lifecycle: draft and submit a bid with a verifiable requirement checklist,
  negotiate venue and hotel block contracts with tiered rebates and attrition,
  register teams, seed brackets, schedule matches on fields, assign certified
  officials with housing, recruit volunteers into shifts, react to weather
  alerts with a rescheduling queue, then report economic impact to the CVB and
  settle all funds under segregation-of-duties controls.

domain_name: sports-tournament-hosting
api_prefix: /api/v1

complexity_profile:
  primary_archetype: posture_driven_gating
  secondary_archetype: quota_allocation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
  entity_topology: graph
  state_machine_shape: posture_driven
  relationship_patterns:
    - one_to_many
    - many_to_many
    - self_referential
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate
  notes: |
    Event.posture gates every child workflow (bid ops only in BIDDING,
    registration only in REGISTRATION_OPEN, scheduling only in
    COMPETITION_SETUP/LIVE, settlement only in COMPLETED). Finite pools:
    hotel room-nights, field time slots, division team caps, shift capacity,
    official daily game limits. Signature machines are cyclic (Bid revision
    loop, Match weather-reschedule loop, ImpactReport dispute loop,
    Settlement dispute loop, Shift OPEN<->FILLED bubble).

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table (18 entities)
# =============================================================================
entities:
  - name: Event
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Event display name" }
      - { name: sanctioning_body, type: string, source: input, description: "Sanctioning body the bid is submitted to" }
      - { name: host_city, type: string, source: input, description: "Host city" }
      - { name: starts_on, type: string, source: input, description: "First event day, ISO date YYYY-MM-DD" }
      - { name: ends_on, type: string, source: input, description: "Last event day, ISO date YYYY-MM-DD; must be >= starts_on" }
      - { name: posture, type: enum, source: system, description: "BIDDING | AWARDED | PLANNING | REGISTRATION_OPEN | COMPETITION_SETUP | LIVE | COMPLETED | SETTLED | BID_LOST | CANCELLED", default: BIDDING }
      - { name: active_bid_id, type: string, source: system, description: "FK -> Bid.id; the single non-terminal bid, null when none", constraints: "nullable" }
      - { name: registered_team_count, type: integer, source: computed, description: "Teams of this event in {ENTERED, ROSTER_SUBMITTED, ELIGIBLE, CHECKED_IN, ELIMINATED, FINISHED, CHAMPION, DISQUALIFIED}" }
      - { name: finalized_match_count, type: integer, source: computed, description: "Matches of this event in {FINAL, FORFEITED}" }

  - name: Bid
    parent: Event
    common_fields: true
    fields:
      - { name: event_id, type: string, source: system, description: "FK -> Event.id; owning event" }
      - { name: cycle_number, type: integer, source: system, description: "Bid cycle for this event, 1-based, increments per new bid (renewal)" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | UNDER_REVIEW | REVISION_REQUESTED | AWARDED | REJECTED | WITHDRAWN | SUPERSEDED", default: DRAFT }
      - { name: notes, type: string, source: input, description: "Free-form bid notes", constraints: "nullable" }
      - { name: revision_count, type: integer, source: system, description: "Number of REVISION_REQUESTED -> SUBMITTED resubmissions", default: 0 }
      - { name: submitted_at, type: datetime, source: system, description: "Logical-clock timestamp of last submission", constraints: "nullable" }
      - { name: decided_at, type: datetime, source: system, description: "Timestamp of award/reject decision", constraints: "nullable" }
      - { name: decided_by_user_id, type: string, source: system, description: "SanctioningReviewer X-User-ID who decided", constraints: "nullable" }
      - { name: review_score, type: integer, source: computed, description: "Weighted checklist score per bid_completeness_score calculation" }

  - name: BidRequirement
    parent: Bid
    common_fields: true
    fields:
      - { name: bid_id, type: string, source: system, description: "FK -> Bid.id; owning bid" }
      - { name: kind, type: enum, source: input, description: "VENUE_CONTRACT | HOTEL_BLOCKS | INSURANCE_CERT | FINANCIAL_GUARANTEE | VOLUNTEER_PLAN | MEDICAL_PLAN | TRANSPORT_PLAN | LEGACY_PLAN" }
      - { name: is_mandatory, type: boolean, source: input, description: "Mandatory requirements must be VERIFIED before submit and can never be waived" }
      - { name: weight_points, type: integer, source: input, description: "Scoring weight", constraints: "1..100" }
      - { name: notes, type: string, source: input, description: "Free-form notes", constraints: "nullable" }
      - { name: status, type: enum, source: system, description: "PENDING | EVIDENCE_SUBMITTED | VERIFIED | RETURNED | WAIVED", default: PENDING }
      - { name: evidence_uri, type: string, source: input, description: "Evidence document reference set by the evidence endpoint", constraints: "nullable" }
      - { name: evidence_submitted_by_user_id, type: string, source: system, description: "X-User-ID of the evidence submitter (SoD anchor)", constraints: "nullable" }
      - { name: verified_by_user_id, type: string, source: system, description: "X-User-ID of verifying reviewer", constraints: "nullable" }
      - { name: review_notes, type: string, source: input, description: "Reviewer notes from verify/waive", constraints: "nullable" }

  - name: Venue
    parent: Event
    common_fields: true
    fields:
      - { name: event_id, type: string, source: system, description: "FK -> Event.id; owning event" }
      - { name: name, type: string, source: input, description: "Venue name" }
      - { name: address, type: string, source: input, description: "Street address" }
      - { name: rental_fee_cents, type: integer, source: input, description: "Flat rental fee in cents", constraints: ">= 0" }
      - { name: revenue_share_pct, type: number, source: input, description: "Venue revenue share fraction", constraints: "0..0.5" }
      - { name: contract_uri, type: string, source: input, description: "Executed contract document reference", constraints: "nullable" }
      - { name: status, type: enum, source: system, description: "PROPOSED | CONTRACTED | RELEASED", default: PROPOSED }

  - name: Field
    parent: Venue
    common_fields: true
    fields:
      - { name: venue_id, type: string, source: system, description: "FK -> Venue.id; owning venue" }
      - { name: name, type: string, source: input, description: "Field/court name" }
      - { name: surface_type, type: enum, source: input, description: "TURF | GRASS | COURT | INDOOR" }
      - { name: has_lights, type: boolean, source: input, description: "Required for matches starting at/after 18:00 local" }
      - { name: slot_minutes, type: integer, source: input, description: "Match slot length in minutes", constraints: "30..180" }
      - { name: status, type: enum, source: system, description: "AVAILABLE | BLACKED_OUT", default: AVAILABLE }
      - { name: blackout_start, type: datetime, source: system, description: "Blackout window start while BLACKED_OUT", constraints: "nullable" }
      - { name: blackout_end, type: datetime, source: system, description: "Blackout window end while BLACKED_OUT", constraints: "nullable" }

  - name: HotelBlock
    parent: Event
    common_fields: true
    fields:
      - { name: event_id, type: string, source: system, description: "FK -> Event.id; owning event" }
      - { name: hotel_name, type: string, source: input, description: "Hotel name" }
      - { name: contracted_rooms_per_night, type: integer, source: input, description: "Rooms contracted per night", constraints: ">= 1" }
      - { name: room_rate_cents, type: integer, source: input, description: "Negotiated nightly rate in cents", constraints: ">= 1" }
      - { name: block_start_date, type: string, source: input, description: "First block night, ISO date" }
      - { name: block_end_date, type: string, source: input, description: "Day after last block night, ISO date; > block_start_date" }
      - { name: cutoff_date, type: string, source: input, description: "Last day new bookings/cancellations without fee are accepted, ISO date" }
      - { name: attrition_allowance_pct, type: number, source: input, description: "Allowed slippage fraction before attrition penalty", constraints: "0..0.5" }
      - { name: status, type: enum, source: system, description: "NEGOTIATING | CONTRACTED | CUTOFF_PASSED | RECONCILED | SETTLED | RELEASED", default: NEGOTIATING }
      - { name: picked_up_room_nights, type: integer, source: computed, description: "Sum of room_nights over bookings in {RESERVED, CONFIRMED, CHECKED_IN, CHECKED_OUT, NO_SHOW}" }
      - { name: rebate_tier, type: enum, source: computed, description: "TIER_0 | TIER_1 | TIER_2 | TIER_3 per hotel_pickup_rebate; TIER_0 until computable", default: TIER_0 }
      - { name: estimated_rebate_cents, type: integer, source: computed, description: "Forward-looking rebate variant (includes RESERVED/CONFIRMED bookings)" }
      - { name: final_rebate_cents, type: integer, source: computed, description: "Actualized rebate variant set at reconcile; null before", constraints: "nullable" }
      - { name: attrition_penalty_cents, type: integer, source: computed, description: "Attrition penalty set at reconcile; null before", constraints: "nullable" }

  - name: RoomBooking
    parent: HotelBlock
    common_fields: true
    fields:
      - { name: hotel_block_id, type: string, source: system, description: "FK -> HotelBlock.id; owning block" }
      - { name: booker_type, type: enum, source: input, description: "TEAM | OFFICIAL | COMMISSION" }
      - { name: team_id, type: string, source: input, description: "FK -> Team.id; required when booker_type=TEAM, else null", constraints: "nullable" }
      - { name: official_id, type: string, source: input, description: "FK -> Official.id; required when booker_type=OFFICIAL, else null (officials housing)", constraints: "nullable" }
      - { name: guest_name, type: string, source: input, description: "Lead guest name" }
      - { name: rooms_count, type: integer, source: input, description: "Rooms in this booking", constraints: ">= 1" }
      - { name: check_in_date, type: string, source: input, description: "ISO date; night interval is [check_in_date, check_out_date)" }
      - { name: check_out_date, type: string, source: input, description: "ISO date; exclusive" }
      - { name: rate_cents, type: integer, source: system, description: "Nightly rate pinned from HotelBlock.room_rate_cents at creation (version-pinned; later block rate changes do not reprice)" }
      - { name: room_nights, type: integer, source: computed, description: "rooms_count * (check_out_date - check_in_date in days)" }
      - { name: total_charge_cents, type: integer, source: computed, description: "room_nights * rate_cents" }
      - { name: cancellation_fee_cents, type: integer, source: computed, description: "0 before cutoff; after cutoff round_half_up(rooms_count * rate_cents * CANCEL_FEE_RATE)", default: 0 }
      - { name: status, type: enum, source: system, description: "RESERVED | CONFIRMED | CHECKED_IN | CHECKED_OUT | CANCELLED | NO_SHOW", default: RESERVED }

  - name: Division
    parent: Event
    common_fields: true
    fields:
      - { name: event_id, type: string, source: system, description: "FK -> Event.id; owning event" }
      - { name: name, type: string, source: input, description: "Division label (e.g. U16_BOYS)" }
      - { name: team_cap, type: integer, source: input, description: "Max ENTERED-or-later teams; overflow becomes WAITLISTED", constraints: ">= 2" }
      - { name: min_teams, type: integer, source: input, description: "Minimum ELIGIBLE teams required to lock seeding", constraints: ">= 2, <= team_cap" }
      - { name: registration_fee_cents, type: integer, source: input, description: "Entry fee per fee-paid team", constraints: ">= 0" }
      - { name: status, type: enum, source: system, description: "OPEN | SEEDING_LOCKED | BRACKET_PUBLISHED | COMPLETED | CANCELLED", default: OPEN }
      - { name: entered_team_count, type: integer, source: computed, description: "Teams in {ENTERED, ROSTER_SUBMITTED, ELIGIBLE, CHECKED_IN, ELIMINATED, FINISHED, CHAMPION, DISQUALIFIED}" }
      - { name: eligible_team_count, type: integer, source: computed, description: "Teams in {ELIGIBLE, CHECKED_IN, ELIMINATED, FINISHED, CHAMPION}" }
      - { name: bracket_size, type: integer, source: computed, description: "Smallest power of 2 >= seeded team count; set at publish", constraints: "nullable" }
      - { name: total_rounds, type: integer, source: computed, description: "log2(bracket_size); set at publish", constraints: "nullable" }

  - name: Team
    parent: Division
    common_fields: true
    fields:
      - { name: division_id, type: string, source: system, description: "FK -> Division.id; owning division" }
      - { name: name, type: string, source: input, description: "Team name" }
      - { name: contact_email, type: string, source: input, description: "Primary contact email" }
      - { name: strength_rating, type: integer, source: input, description: "Seeding input rating", constraints: "1..100" }
      - { name: roster_player_count, type: integer, source: input, description: "Roster size submitted at roster lock", constraints: "nullable, >= 7 when set" }
      - { name: status, type: enum, source: system, description: "ENTERED | WAITLISTED | ROSTER_SUBMITTED | ELIGIBLE | CHECKED_IN | ELIMINATED | FINISHED | CHAMPION | WITHDRAWN | DISQUALIFIED", default: ENTERED }
      - { name: seed_number, type: integer, source: system, description: "Seed assigned at division lock per bracket_seeding; null until seeded", constraints: "nullable" }

  - name: Match
    parent: Division
    common_fields: true
    fields:
      - { name: division_id, type: string, source: system, description: "FK -> Division.id; owning division" }
      - { name: round_number, type: integer, source: system, description: "1 = first round; total_rounds = final" }
      - { name: bracket_slot, type: integer, source: system, description: "1-based slot within the round" }
      - { name: home_team_id, type: string, source: system, description: "FK -> Team.id; null until seeding/advancement fills it", constraints: "nullable" }
      - { name: away_team_id, type: string, source: system, description: "FK -> Team.id; null until seeding/advancement fills it", constraints: "nullable" }
      - { name: winner_advances_to_match_id, type: string, source: system, description: "FK -> Match.id; self-referential bracket wiring; null for the final", constraints: "nullable" }
      - { name: field_id, type: string, source: system, description: "FK -> Field.id; null until scheduled", constraints: "nullable" }
      - { name: scheduled_start, type: datetime, source: input, description: "Set via schedule/reschedule endpoint input", constraints: "nullable" }
      - { name: scheduled_end, type: datetime, source: computed, description: "scheduled_start + field.slot_minutes", constraints: "nullable" }
      - { name: original_scheduled_start, type: datetime, source: system, description: "First scheduled_start ever assigned; preserved across weather delays; orders the reschedule queue", constraints: "nullable" }
      - { name: status, type: enum, source: system, description: "PENDING_TEAMS | SCHEDULED | WEATHER_DELAYED | RESCHEDULE_QUEUE | IN_PROGRESS | FINAL | FORFEITED | CANCELLED", default: PENDING_TEAMS }
      - { name: home_score, type: integer, source: input, description: "Set at finalize/forfeit", constraints: "nullable, >= 0" }
      - { name: away_score, type: integer, source: input, description: "Set at finalize/forfeit", constraints: "nullable, >= 0" }
      - { name: winner_team_id, type: string, source: computed, description: "FK -> Team.id; higher score at finalize, opponent at forfeit", constraints: "nullable" }

  - name: Official
    parent: Event
    common_fields: true
    fields:
      - { name: event_id, type: string, source: system, description: "FK -> Event.id; owning event" }
      - { name: name, type: string, source: input, description: "Official name" }
      - { name: certification_level, type: enum, source: input, description: "TRAINEE | REGIONAL | NATIONAL" }
      - { name: needs_housing, type: boolean, source: input, description: "Requires officials-housing room booking", default: false }
      - { name: game_limit_per_day, type: integer, source: input, description: "Max ACCEPTED/WORKED assignments per calendar day", default: 4, constraints: ">= 1" }
      - { name: status, type: enum, source: system, description: "REGISTERED | VETTED | ACTIVE | SUSPENDED | INACTIVE", default: REGISTERED }
      - { name: assigned_game_count, type: integer, source: computed, description: "Assignments in {PROPOSED, ACCEPTED, WORKED}; decremented on RELEASED/DECLINED" }

  - name: OfficialAssignment
    parent: Match
    common_fields: true
    fields:
      - { name: match_id, type: string, source: system, description: "FK -> Match.id; assigned match" }
      - { name: official_id, type: string, source: system, description: "FK -> Official.id; assigned official" }
      - { name: slot_role, type: enum, source: input, description: "CREW_CHIEF | ASSISTANT" }
      - { name: status, type: enum, source: system, description: "PROPOSED | ACCEPTED | DECLINED | RELEASED | WORKED", default: PROPOSED }
      - { name: released_reason, type: enum, source: system, description: "WEATHER | MANUAL | OFFICIAL_SUSPENDED | MATCH_CANCELLED; null unless RELEASED", constraints: "nullable" }

  - name: Volunteer
    parent: Event
    common_fields: true
    fields:
      - { name: event_id, type: string, source: system, description: "FK -> Event.id; owning event" }
      - { name: name, type: string, source: input, description: "Volunteer name" }
      - { name: email, type: string, source: input, description: "Contact email" }
      - { name: background_check_cleared, type: boolean, source: input, description: "Set by CommissionAdmin via PATCH before approval", default: false }
      - { name: status, type: enum, source: system, description: "APPLIED | APPROVED | ACTIVE | REJECTED | INACTIVE", default: APPLIED }
      - { name: hours_worked, type: number, source: computed, description: "Sum of credited_hours over WORKED signups, 2 decimal places" }

  - name: Shift
    parent: Event
    common_fields: true
    fields:
      - { name: event_id, type: string, source: system, description: "FK -> Event.id; owning event" }
      - { name: role_needed, type: enum, source: input, description: "FIELD_MARSHAL | REGISTRATION_DESK | SCORE_RUNNER | HOSPITALITY | PARKING" }
      - { name: starts_at, type: datetime, source: input, description: "Shift window start" }
      - { name: ends_at, type: datetime, source: input, description: "Shift window end; must be > starts_at" }
      - { name: capacity, type: integer, source: input, description: "Max CONFIRMED signups", constraints: ">= 1" }
      - { name: status, type: enum, source: system, description: "OPEN | FILLED | COMPLETED | CANCELLED", default: OPEN }
      - { name: confirmed_count, type: integer, source: computed, description: "Signups in {CONFIRMED, WORKED}" }

  - name: ShiftSignup
    parent: Shift
    common_fields: true
    fields:
      - { name: shift_id, type: string, source: system, description: "FK -> Shift.id; signed-up shift" }
      - { name: volunteer_id, type: string, source: system, description: "FK -> Volunteer.id; signing volunteer" }
      - { name: status, type: enum, source: system, description: "SIGNED_UP | CONFIRMED | WORKED | NO_SHOW | CANCELLED", default: SIGNED_UP }
      - { name: credited_hours, type: number, source: computed, description: "Shift duration hours (2dp) when WORKED; null otherwise", constraints: "nullable" }

  - name: WeatherAlert
    parent: Event
    common_fields: true
    fields:
      - { name: event_id, type: string, source: system, description: "FK -> Event.id; owning event" }
      - { name: venue_id, type: string, source: input, description: "FK -> Venue.id; scoped venue, null = all venues of the event", constraints: "nullable" }
      - { name: severity, type: enum, source: input, description: "WATCH | WARNING | EMERGENCY" }
      - { name: window_start, type: datetime, source: input, description: "Alert window start" }
      - { name: window_end, type: datetime, source: input, description: "Alert window end; must be > window_start" }
      - { name: status, type: enum, source: system, description: "ISSUED | ACTIVE | RESOLVED | EXPIRED", default: ISSUED }

  - name: ImpactReport
    parent: Event
    common_fields: true
    fields:
      - { name: event_id, type: string, source: system, description: "FK -> Event.id; owning event" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | UNDER_AUDIT | ACCEPTED | DISPUTED", default: DRAFT }
      - { name: projected_attendance, type: integer, source: input, description: "Projected unique attendees", constraints: ">= 0" }
      - { name: notes, type: string, source: input, description: "Free-form notes", constraints: "nullable" }
      - { name: projected_room_nights, type: integer, source: computed, description: "Forward-looking variant input set at submit: bookings in {RESERVED, CONFIRMED, CHECKED_IN, CHECKED_OUT, NO_SHOW}" }
      - { name: projected_direct_spend_cents, type: integer, source: computed, description: "Projected variant total set at submit" }
      - { name: actual_attendance, type: integer, source: input, description: "Audited attendance posted by CVB auditor", constraints: "nullable, >= 0" }
      - { name: actual_room_nights, type: integer, source: computed, description: "Audited variant input set at audit: bookings in {CHECKED_OUT, NO_SHOW} only" }
      - { name: audited_direct_spend_cents, type: integer, source: computed, description: "Audited variant total set at audit", constraints: "nullable" }
      - { name: created_by_user_id, type: string, source: system, description: "X-User-ID of creator (SoD anchor)" }
      - { name: audited_by_user_id, type: string, source: system, description: "X-User-ID of CVB auditor", constraints: "nullable" }
      - { name: revision_count, type: integer, source: system, description: "Number of DISPUTED -> DRAFT revisions", default: 0 }

  - name: Settlement
    parent: Event
    common_fields: true
    fields:
      - { name: event_id, type: string, source: system, description: "FK -> Event.id; owning event; at most one Settlement per event" }
      - { name: status, type: enum, source: system, description: "OPEN | EXPENSES_CERTIFIED | APPROVED | PAID | DISPUTED", default: OPEN }
      - { name: sponsor_contributions_cents, type: integer, source: input, description: "Sponsor/CVB contributions recognized in settlement", constraints: ">= 0" }
      - { name: expense_lines, type: array, source: input, description: "Appended expense entries {category, amount_cents, description}; editable only while OPEN", default: [] }
      - { name: registration_revenue_cents, type: integer, source: computed, description: "Sum of division.registration_fee_cents over fee-paid teams (statuses in calculation), snapshot at certify" }
      - { name: rebate_total_cents, type: integer, source: computed, description: "Sum of final_rebate_cents over RECONCILED/SETTLED blocks, snapshot at certify" }
      - { name: sanction_fee_cents, type: integer, source: computed, description: "Marginal tiered sanctioning-body fee per sanction_fee calculation, snapshot at certify" }
      - { name: venue_rental_total_cents, type: integer, source: computed, description: "Sum of rental_fee_cents over CONTRACTED/RELEASED venues, snapshot at certify" }
      - { name: officials_stipend_total_cents, type: integer, source: computed, description: "Sum of per-assignment rounded stipends over WORKED assignments, snapshot at certify" }
      - { name: expense_total_cents, type: integer, source: computed, description: "Sum of expense_lines amounts" }
      - { name: gross_revenue_cents, type: integer, source: computed, description: "registration_revenue + rebate_total + sponsor_contributions" }
      - { name: net_to_commission_cents, type: integer, source: computed, description: "Waterfall remainder per settlement_waterfall; may be negative (receivable)" }
      - { name: certified_by_user_id, type: string, source: system, description: "X-User-ID of certifier (SoD anchor)", constraints: "nullable" }
      - { name: approved_by_user_id, type: string, source: system, description: "X-User-ID of approver; must differ from certified_by_user_id", constraints: "nullable" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Event
    field: posture
    initial_state: BIDDING
    terminal_states: [CANCELLED]
    transitions:
      - from: BIDDING
        to: AWARDED
        trigger: "system (POST /api/v1/bids/{id}/decide with decision=AWARDED)"
        actor: system
        preconditions: ["awarded bid belongs to this event"]
        side_effects: ["Event.version +1", "all other bids of this event in {DRAFT, SUBMITTED, UNDER_REVIEW, REVISION_REQUESTED} -> SUPERSEDED (each version +1)"]
      - from: BIDDING
        to: BID_LOST
        trigger: "system (POST /api/v1/bids/{id}/decide with decision=REJECTED)"
        actor: system
        preconditions: ["rejected bid belongs to this event"]
        side_effects: ["Event.version +1"]
      - from: BID_LOST
        to: BIDDING
        trigger: "system (POST /api/v1/events/{id}/bids creates a renewal bid)"
        actor: system
        preconditions: []
        side_effects: ["Event.version +1 (the bid-create request performs a single Event.version increment that covers both the creation and this revival)"]
        note: "Bid renewal: a fresh bid on a BID_LOST event revives it to BIDDING."
      - from: SETTLED
        to: BIDDING
        trigger: "system (POST /api/v1/events/{id}/bids creates a renewal bid for the next hosting cycle)"
        actor: system
        preconditions: []
        side_effects: ["Event.version +1 (single increment covering creation and revival)", "Event.active_bid_id set to the new bid"]
        note: "Post-event bid renewal: a settled event re-enters BIDDING with cycle_number incremented."
      - from: AWARDED
        to: PLANNING
        trigger: "POST /api/v1/events/{id}/posture"
        actor: CommissionAdmin
        preconditions: ["at least one Venue of this event is CONTRACTED", "at least one HotelBlock of this event is CONTRACTED"]
        side_effects: ["Event.version +1"]
      - from: PLANNING
        to: REGISTRATION_OPEN
        trigger: "POST /api/v1/events/{id}/posture"
        actor: CommissionAdmin
        preconditions: ["at least one Division exists for this event"]
        side_effects: ["Event.version +1"]
      - from: REGISTRATION_OPEN
        to: COMPETITION_SETUP
        trigger: "POST /api/v1/events/{id}/posture"
        actor: CommissionAdmin
        preconditions: ["every Division of this event with eligible_team_count >= min_teams has status in {SEEDING_LOCKED, BRACKET_PUBLISHED, COMPLETED}"]
        side_effects:
          - "Divisions with eligible_team_count < min_teams -> CANCELLED (each version +1)"
          - "Teams of cancelled divisions in {ENTERED, WAITLISTED, ROSTER_SUBMITTED, ELIGIBLE} -> WITHDRAWN (each version +1)"
          - "Event.version +1"
      - from: COMPETITION_SETUP
        to: LIVE
        trigger: "POST /api/v1/events/{id}/posture"
        actor: CommissionAdmin
        preconditions: ["every Division of this event has status in {BRACKET_PUBLISHED, COMPLETED, CANCELLED}"]
        side_effects: ["Event.version +1"]
      - from: LIVE
        to: COMPLETED
        trigger: "POST /api/v1/events/{id}/posture"
        actor: CommissionAdmin
        preconditions: ["no Match of this event in {PENDING_TEAMS, SCHEDULED, WEATHER_DELAYED, RESCHEDULE_QUEUE, IN_PROGRESS}"]
        side_effects: ["Event.version +1"]
      - from: COMPLETED
        to: SETTLED
        trigger: "system (POST /api/v1/settlements/{id}/pay)"
        actor: system
        preconditions: ["an ImpactReport of this event is ACCEPTED"]
        side_effects:
          - "HotelBlocks of this event in RECONCILED -> SETTLED (each version +1; final_rebate_cents and attrition_penalty_cents frozen)"
          - "Event.version +1"
      - from: BIDDING
        to: CANCELLED
        trigger: "POST /api/v1/events/{id}/posture"
        actor: CommissionAdmin
        preconditions: []
        side_effects: ["bids in {DRAFT, SUBMITTED, UNDER_REVIEW, REVISION_REQUESTED} -> WITHDRAWN", "Event.version +1"]
      - from: AWARDED
        to: CANCELLED
        trigger: "POST /api/v1/events/{id}/posture"
        actor: CommissionAdmin
        preconditions: []
        side_effects: ["HotelBlocks in {NEGOTIATING, CONTRACTED} -> RELEASED", "RoomBookings in {RESERVED, CONFIRMED} -> CANCELLED (no fee)", "Event.version +1"]
      - from: PLANNING
        to: CANCELLED
        trigger: "POST /api/v1/events/{id}/posture"
        actor: CommissionAdmin
        preconditions: []
        side_effects: ["same cascades as AWARDED -> CANCELLED", "Event.version +1"]
      - from: REGISTRATION_OPEN
        to: CANCELLED
        trigger: "POST /api/v1/events/{id}/posture"
        actor: CommissionAdmin
        preconditions: []
        side_effects: ["teams in {ENTERED, WAITLISTED, ROSTER_SUBMITTED, ELIGIBLE} -> WITHDRAWN", "same cascades as AWARDED -> CANCELLED", "Event.version +1"]
      - from: COMPETITION_SETUP
        to: CANCELLED
        trigger: "POST /api/v1/events/{id}/posture"
        actor: CommissionAdmin
        preconditions: []
        side_effects: ["matches in {PENDING_TEAMS, SCHEDULED, RESCHEDULE_QUEUE} -> CANCELLED", "assignments in {PROPOSED, ACCEPTED} -> RELEASED (MATCH_CANCELLED)", "same cascades as REGISTRATION_OPEN -> CANCELLED", "Event.version +1"]
    note: "CANCELLED is absorbing; SETTLED is absorbing; BID_LOST revives to BIDDING only via a renewal bid."

  - entity: Bid
    field: status
    initial_state: DRAFT
    terminal_states: [AWARDED, REJECTED, WITHDRAWN, SUPERSEDED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /api/v1/bids/{id}/submit"
        actor: CommissionAdmin
        preconditions:
          - "Event.posture == BIDDING (ERR_EVENT_POSTURE_FORBIDS)"
          - "every BidRequirement of this bid with is_mandatory=true has status VERIFIED (ERR_BID_REQUIREMENTS_INCOMPLETE)"
          - "every BidRequirement of this bid has status in {VERIFIED, WAIVED} (ERR_BID_REQUIREMENTS_INCOMPLETE)"
        side_effects: ["submitted_at = logical clock", "Bid.version +1"]
      - from: REVISION_REQUESTED
        to: SUBMITTED
        trigger: "POST /api/v1/bids/{id}/submit"
        actor: CommissionAdmin
        preconditions: ["same requirement gates as DRAFT -> SUBMITTED"]
        side_effects: ["revision_count +1", "submitted_at = logical clock", "Bid.version +1"]
        note: "Cyclic revision loop: UNDER_REVIEW -> REVISION_REQUESTED -> SUBMITTED -> UNDER_REVIEW."
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /api/v1/bids/{id}/review"
        actor: SanctioningReviewer
        preconditions: []
        side_effects: ["Bid.version +1"]
      - from: UNDER_REVIEW
        to: REVISION_REQUESTED
        trigger: "POST /api/v1/bids/{id}/request-revision"
        actor: SanctioningReviewer
        preconditions: []
        side_effects: ["Bid.version +1"]
      - from: UNDER_REVIEW
        to: AWARDED
        trigger: "POST /api/v1/bids/{id}/decide (decision=AWARDED)"
        actor: SanctioningReviewer
        preconditions: ["review_score >= 80 (AWARD_MIN_SCORE; ERR_BID_SCORE_BELOW_THRESHOLD)"]
        side_effects: ["decided_at/decided_by_user_id set", "Event.posture BIDDING -> AWARDED cascade", "Bid.version +1"]
      - from: UNDER_REVIEW
        to: REJECTED
        trigger: "POST /api/v1/bids/{id}/decide (decision=REJECTED)"
        actor: SanctioningReviewer
        preconditions: []
        side_effects: ["decided_at/decided_by_user_id set", "Event.posture BIDDING -> BID_LOST cascade", "Bid.version +1"]
      - from: DRAFT
        to: WITHDRAWN
        trigger: "POST /api/v1/bids/{id}/withdraw"
        actor: CommissionAdmin
        preconditions: []
        side_effects: ["Event.active_bid_id cleared", "Bid.version +1"]
      - from: SUBMITTED
        to: WITHDRAWN
        trigger: "POST /api/v1/bids/{id}/withdraw"
        actor: CommissionAdmin
        preconditions: []
        side_effects: ["Event.active_bid_id cleared", "Bid.version +1"]
      - from: REVISION_REQUESTED
        to: WITHDRAWN
        trigger: "POST /api/v1/bids/{id}/withdraw"
        actor: CommissionAdmin
        preconditions: []
        side_effects: ["Event.active_bid_id cleared", "Bid.version +1"]
      - from: DRAFT
        to: SUPERSEDED
        trigger: "system (a newer bid is created for the same event, or another bid is awarded)"
        actor: system
        preconditions: []
        side_effects: ["Bid.version +1"]

  - entity: BidRequirement
    field: status
    initial_state: PENDING
    terminal_states: [VERIFIED, WAIVED]
    transitions:
      - from: PENDING
        to: EVIDENCE_SUBMITTED
        trigger: "POST /api/v1/requirements/{id}/evidence"
        actor: CommissionAdmin
        preconditions: ["parent bid status in {DRAFT, REVISION_REQUESTED} (ERR_BID_NOT_EDITABLE)"]
        side_effects: ["evidence_uri, evidence_submitted_by_user_id set", "BidRequirement.version +1"]
      - from: RETURNED
        to: EVIDENCE_SUBMITTED
        trigger: "POST /api/v1/requirements/{id}/evidence"
        actor: CommissionAdmin
        preconditions: ["parent bid status in {DRAFT, REVISION_REQUESTED} (ERR_BID_NOT_EDITABLE)"]
        side_effects: ["evidence_uri, evidence_submitted_by_user_id overwritten", "BidRequirement.version +1"]
      - from: EVIDENCE_SUBMITTED
        to: VERIFIED
        trigger: "POST /api/v1/requirements/{id}/verify (decision=VERIFIED)"
        actor: SanctioningReviewer
        preconditions: ["reviewer X-User-ID != evidence_submitted_by_user_id (ERR_SOD_VIOLATION)"]
        side_effects: ["verified_by_user_id set", "parent bid review_score recomputed", "BidRequirement.version +1"]
      - from: EVIDENCE_SUBMITTED
        to: RETURNED
        trigger: "POST /api/v1/requirements/{id}/verify (decision=RETURNED)"
        actor: SanctioningReviewer
        preconditions: ["reviewer X-User-ID != evidence_submitted_by_user_id (ERR_SOD_VIOLATION)"]
        side_effects: ["BidRequirement.version +1"]
      - from: PENDING
        to: WAIVED
        trigger: "POST /api/v1/requirements/{id}/waive"
        actor: SanctioningReviewer
        preconditions: ["is_mandatory == false (ERR_REQUIREMENT_NOT_WAIVABLE)", "parent bid status in {DRAFT, REVISION_REQUESTED} (ERR_BID_NOT_EDITABLE)"]
        side_effects: ["parent bid review_score recomputed", "BidRequirement.version +1"]

  - entity: Venue
    field: status
    initial_state: PROPOSED
    terminal_states: [RELEASED]
    transitions:
      - from: PROPOSED
        to: CONTRACTED
        trigger: "POST /api/v1/venues/{id}/contract"
        actor: CommissionAdmin
        preconditions: ["Event.posture in {BIDDING, AWARDED, PLANNING} (ERR_EVENT_POSTURE_FORBIDS)"]
        side_effects: ["contract_uri set", "Venue.version +1"]
      - from: CONTRACTED
        to: RELEASED
        trigger: "POST /api/v1/venues/{id}/release"
        actor: CommissionAdmin
        preconditions: ["no Match on any field of this venue in {SCHEDULED, WEATHER_DELAYED, RESCHEDULE_QUEUE, IN_PROGRESS} (ERR_VENUE_HAS_ACTIVE_MATCHES)"]
        side_effects: ["Venue.version +1"]

  - entity: Field
    field: status
    initial_state: AVAILABLE
    terminal_states: []
    transitions:
      - from: AVAILABLE
        to: BLACKED_OUT
        trigger: "POST /api/v1/fields/{id}/blackout"
        actor: "CommissionAdmin or VenueManager (own venue)"
        preconditions: ["venue.status == CONTRACTED (ERR_INVALID_STATE)", "blackout_end > blackout_start (ERR_VALIDATION)"]
        side_effects:
          - "blackout_start/blackout_end set; Field.version +1"
          - "Matches on this field in SCHEDULED whose [scheduled_start, scheduled_end) intersects [blackout_start, blackout_end) -> RESCHEDULE_QUEUE (each version +1; original_scheduled_start preserved)"
          - "Assignments on those matches in {PROPOSED, ACCEPTED} -> RELEASED (MATCH_CANCELLED), Official.assigned_game_count recomputed"
      - from: BLACKED_OUT
        to: AVAILABLE
        trigger: "POST /api/v1/fields/{id}/unblackout"
        actor: "CommissionAdmin or VenueManager (own venue)"
        preconditions: []
        side_effects: ["blackout window cleared", "Field.version +1"]
    note: "AVAILABLE <-> BLACKED_OUT is cyclic; blackout does not auto-reschedule, it enqueues."

  - entity: HotelBlock
    field: status
    initial_state: NEGOTIATING
    terminal_states: [SETTLED, RELEASED]
    transitions:
      - from: NEGOTIATING
        to: CONTRACTED
        trigger: "POST /api/v1/hotel-blocks/{id}/contract"
        actor: CommissionAdmin
        preconditions: ["Event.posture in {BIDDING, AWARDED, PLANNING} (ERR_EVENT_POSTURE_FORBIDS)"]
        side_effects: ["HotelBlock.version +1"]
      - from: CONTRACTED
        to: CUTOFF_PASSED
        trigger: "POST /api/v1/hotel-blocks/{id}/close-cutoff"
        actor: CommissionAdmin
        preconditions: ["logical clock date > cutoff_date (ERR_CUTOFF_PASSED not yet reached otherwise)"]
        side_effects: ["HotelBlock.version +1"]
      - from: CUTOFF_PASSED
        to: RECONCILED
        trigger: "POST /api/v1/hotel-blocks/{id}/reconcile"
        actor: "CommissionAdmin or HotelManager (own block)"
        preconditions: []
        side_effects: ["final_rebate_cents and attrition_penalty_cents computed per hotel_pickup_rebate (final variant)", "rebate_tier frozen", "HotelBlock.version +1"]
      - from: RECONCILED
        to: SETTLED
        trigger: "system (settlement pay cascade)"
        actor: system
        preconditions: []
        side_effects: ["HotelBlock.version +1"]
      - from: CONTRACTED
        to: RELEASED
        trigger: "POST /api/v1/events/{id}/posture cancel cascade"
        actor: system
        preconditions: []
        side_effects: ["bookings in {RESERVED, CONFIRMED} -> CANCELLED (no fee)", "HotelBlock.version +1"]

  - entity: RoomBooking
    field: status
    initial_state: RESERVED
    terminal_states: [CHECKED_OUT, CANCELLED, NO_SHOW]
    transitions:
      - from: RESERVED
        to: CONFIRMED
        trigger: "POST /api/v1/room-bookings/{id}/transition (action=CONFIRM)"
        actor: "CommissionAdmin or HotelManager (own block)"
        preconditions: ["parent block status == CONTRACTED (ERR_BLOCK_NOT_CONTRACTED)"]
        side_effects: ["RoomBooking.version +1", "HotelBlock picked_up_room_nights unchanged (already counted)"]
      - from: CONFIRMED
        to: CHECKED_IN
        trigger: "POST /api/v1/room-bookings/{id}/transition (action=CHECK_IN)"
        actor: "CommissionAdmin or HotelManager (own block)"
        preconditions: ["logical clock date >= check_in_date (ERR_VALIDATION)"]
        side_effects: ["RoomBooking.version +1"]
      - from: CHECKED_IN
        to: CHECKED_OUT
        trigger: "POST /api/v1/room-bookings/{id}/transition (action=CHECK_OUT)"
        actor: "CommissionAdmin or HotelManager (own block)"
        preconditions: []
        side_effects: ["RoomBooking.version +1"]
      - from: RESERVED
        to: CANCELLED
        trigger: "POST /api/v1/room-bookings/{id}/transition (action=CANCEL)"
        actor: "CommissionAdmin, HotelManager (own block), TeamRep (own team booking), Official (own booking)"
        preconditions: []
        side_effects: ["cancellation_fee_cents = 0 when clock date <= cutoff_date, else round_half_up(rooms_count * rate_cents * 0.5)", "HotelBlock picked_up_room_nights -= room_nights", "RoomBooking.version +1"]
      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /api/v1/room-bookings/{id}/transition (action=CANCEL)"
        actor: "same as RESERVED -> CANCELLED"
        preconditions: []
        side_effects: ["same fee rule and pickup decrement", "RoomBooking.version +1"]
      - from: CONFIRMED
        to: NO_SHOW
        trigger: "POST /api/v1/room-bookings/{id}/transition (action=NO_SHOW)"
        actor: "CommissionAdmin or HotelManager (own block)"
        preconditions: ["logical clock date > check_in_date (ERR_VALIDATION)"]
        side_effects: ["room_nights still count toward pickup (attrition convention)", "RoomBooking.version +1"]

  - entity: Division
    field: status
    initial_state: OPEN
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: OPEN
        to: SEEDING_LOCKED
        trigger: "POST /api/v1/divisions/{id}/lock-seeding"
        actor: CommissionAdmin
        preconditions: ["Event.posture == REGISTRATION_OPEN (ERR_EVENT_POSTURE_FORBIDS)", "eligible_team_count >= min_teams (ERR_DIVISION_BELOW_MIN_TEAMS)"]
        side_effects:
          - "seed_number assigned to each ELIGIBLE team per bracket_seeding (strength_rating DESC, created_at ASC)"
          - "teams of this division in {ENTERED, WAITLISTED, ROSTER_SUBMITTED} -> WITHDRAWN (each version +1)"
          - "Division.version +1"
      - from: SEEDING_LOCKED
        to: BRACKET_PUBLISHED
        trigger: "POST /api/v1/divisions/{id}/publish-bracket"
        actor: CommissionAdmin
        preconditions: ["Event.posture in {REGISTRATION_OPEN, COMPETITION_SETUP} (ERR_EVENT_POSTURE_FORBIDS)"]
        side_effects: ["matches generated per bracket_topology with winner_advances_to_match_id wiring", "bracket_size and total_rounds set", "Division.version +1"]
      - from: BRACKET_PUBLISHED
        to: COMPLETED
        trigger: "system (all matches of this division reach {FINAL, FORFEITED, CANCELLED})"
        actor: system
        preconditions: []
        side_effects: ["Division.version +1"]
      - from: OPEN
        to: CANCELLED
        trigger: "system (REGISTRATION_OPEN -> COMPETITION_SETUP posture cascade when eligible_team_count < min_teams)"
        actor: system
        preconditions: []
        side_effects: ["teams in {ENTERED, WAITLISTED, ROSTER_SUBMITTED, ELIGIBLE} -> WITHDRAWN", "Division.version +1"]

  - entity: Team
    field: status
    initial_state: ENTERED
    terminal_states: [ELIMINATED, FINISHED, CHAMPION, WITHDRAWN, DISQUALIFIED]
    transitions:
      - from: ENTERED
        to: ROSTER_SUBMITTED
        trigger: "POST /api/v1/teams/{id}/roster"
        actor: TeamRep (own team)
        preconditions: ["division.status == OPEN (ERR_DIVISION_NOT_OPEN)", "roster_player_count >= 7 (ERR_ROSTER_TOO_SMALL)"]
        side_effects: ["Team.version +1"]
      - from: ROSTER_SUBMITTED
        to: ELIGIBLE
        trigger: "POST /api/v1/teams/{id}/verify-eligibility"
        actor: CommissionAdmin
        preconditions: ["division.status == OPEN (ERR_DIVISION_NOT_OPEN)"]
        side_effects: ["Team.version +1"]
      - from: ELIGIBLE
        to: CHECKED_IN
        trigger: "POST /api/v1/teams/{id}/check-in"
        actor: "CommissionAdmin or TeamRep (own team)"
        preconditions: ["Event.posture == LIVE (ERR_EVENT_POSTURE_FORBIDS)", "team status == ELIGIBLE (ERR_INVALID_STATE)"]
        side_effects: ["Team.version +1"]
      - from: ENTERED
        to: WITHDRAWN
        trigger: "POST /api/v1/teams/{id}/withdraw or system (registration-close / division-cancel cascade)"
        actor: "CommissionAdmin, TeamRep (own team), or system"
        preconditions: []
        side_effects: ["if division OPEN and a WAITLISTED team exists: oldest-WAITLISTED (created_at ASC) team -> ENTERED (version +1)", "Division entered_team_count recomputed", "Team.version +1"]
      - from: WAITLISTED
        to: WITHDRAWN
        trigger: "POST /api/v1/teams/{id}/withdraw"
        actor: "CommissionAdmin or TeamRep (own team)"
        preconditions: []
        side_effects: ["Team.version +1"]
      - from: ROSTER_SUBMITTED
        to: WITHDRAWN
        trigger: "POST /api/v1/teams/{id}/withdraw or system cascade"
        actor: "CommissionAdmin, TeamRep (own team), or system"
        preconditions: []
        side_effects: ["Division entered_team_count recomputed", "Team.version +1"]
      - from: ELIGIBLE
        to: WITHDRAWN
        trigger: "POST /api/v1/teams/{id}/withdraw or system cascade"
        actor: "CommissionAdmin, TeamRep (own team), or system"
        preconditions: ["division.status == OPEN (manual withdraw only; ERR_DIVISION_NOT_OPEN)"]
        side_effects: ["same waitlist promotion as ENTERED -> WITHDRAWN (no WAITLISTED team can exist past lock)", "Team.version +1"]
      - from: ELIGIBLE
        to: DISQUALIFIED
        trigger: "POST /api/v1/teams/{id}/disqualify"
        actor: CommissionAdmin
        preconditions: []
        side_effects: ["PENDING_TEAMS matches containing this team: that slot cleared to null", "Team.version +1"]
      - from: CHECKED_IN
        to: DISQUALIFIED
        trigger: "POST /api/v1/teams/{id}/disqualify"
        actor: CommissionAdmin
        preconditions: []
        side_effects:
          - "matches in {SCHEDULED, IN_PROGRESS} containing this team -> FORFEITED (winner = opponent; advancement cascade as finalize)"
          - "PENDING_TEAMS matches containing this team: slot cleared"
          - "assignments on forfeited matches in {PROPOSED, ACCEPTED} -> RELEASED (MATCH_CANCELLED), Official.assigned_game_count recomputed"
          - "Team.version +1"
      - from: WAITLISTED
        to: ENTERED
        trigger: "system (waitlist promotion when an ENTERED-or-later team withdraws while division OPEN)"
        actor: system
        preconditions: ["oldest WAITLISTED by created_at ASC"]
        side_effects: ["Team.version +1", "Division entered_team_count recomputed"]
      - from: ELIGIBLE
        to: ELIMINATED
        trigger: "system (loses a non-final match at finalize/forfeit)"
        actor: system
        preconditions: []
        side_effects: ["Team.version +1"]
      - from: CHECKED_IN
        to: ELIMINATED
        trigger: "system (loses a non-final match at finalize/forfeit)"
        actor: system
        preconditions: []
        side_effects: ["Team.version +1"]
      - from: ELIGIBLE
        to: FINISHED
        trigger: "system (loses the final match)"
        actor: system
        preconditions: []
        side_effects: ["Team.version +1"]
      - from: CHECKED_IN
        to: FINISHED
        trigger: "system (loses the final match)"
        actor: system
        preconditions: []
        side_effects: ["Team.version +1"]
      - from: ELIGIBLE
        to: CHAMPION
        trigger: "system (wins the final match)"
        actor: system
        preconditions: []
        side_effects: ["Team.version +1"]
      - from: CHECKED_IN
        to: CHAMPION
        trigger: "system (wins the final match)"
        actor: system
        preconditions: []
        side_effects: ["Team.version +1"]

  - entity: Match
    field: status
    initial_state: PENDING_TEAMS
    terminal_states: [FINAL, FORFEITED, CANCELLED]
    transitions:
      - from: PENDING_TEAMS
        to: SCHEDULED
        trigger: "POST /api/v1/matches/{id}/schedule"
        actor: CommissionAdmin
        preconditions:
          - "home_team_id and away_team_id both set (ERR_MATCH_TEAMS_INCOMPLETE)"
          - "division.status == BRACKET_PUBLISHED (ERR_MATCH_NOT_SCHEDULABLE)"
          - "Event.posture in {COMPETITION_SETUP, LIVE} (ERR_EVENT_POSTURE_FORBIDS)"
          - "field belongs to a CONTRACTED venue of the same event (ERR_CROSS_EVENT_REFERENCE)"
          - "field.status == AVAILABLE (ERR_FIELD_BLACKED_OUT)"
          - "[scheduled_start, scheduled_start+slot_minutes) does not overlap any other SCHEDULED/IN_PROGRESS match on this field; half-open adjacency allowed (ERR_FIELD_TIME_CONFLICT)"
          - "scheduled_start hour >= 18:00 requires field.has_lights == true (ERR_FIELD_NO_LIGHTS)"
          - "scheduled date within [event.starts_on, event.ends_on] (ERR_MATCH_OUTSIDE_EVENT_DATES)"
        side_effects: ["field_id, scheduled_start set; scheduled_end computed; original_scheduled_start = scheduled_start on first scheduling", "Match.version +1"]
      - from: RESCHEDULE_QUEUE
        to: SCHEDULED
        trigger: "POST /api/v1/matches/{id}/reschedule"
        actor: CommissionAdmin
        preconditions:
          - "all schedule preconditions except division status (division may be BRACKET_PUBLISHED)"
          - "queue order: every other RESCHEDULE_QUEUE match of the same division that sorts earlier per reschedule_queue_order must already be SCHEDULED-or-terminal (ERR_RESCHEDULE_ORDER_VIOLATION)"
        side_effects: ["field_id, scheduled_start updated; scheduled_end recomputed; original_scheduled_start preserved", "Match.version +1"]
      - from: SCHEDULED
        to: IN_PROGRESS
        trigger: "POST /api/v1/matches/{id}/start"
        actor: CommissionAdmin
        preconditions: ["Event.posture == LIVE (ERR_EVENT_POSTURE_FORBIDS)"]
        side_effects: ["Match.version +1"]
      - from: IN_PROGRESS
        to: FINAL
        trigger: "POST /api/v1/matches/{id}/finalize"
        actor: CommissionAdmin
        preconditions: ["home_score != away_score (ERR_TIE_NOT_ALLOWED)", "both scores >= 0 (ERR_SCORE_INVALID)"]
        side_effects:
          - "winner_team_id = higher-score team; Match.version +1"
          - "if winner_advances_to_match_id set: that match's home (odd bracket_slot) or away (even bracket_slot) slot := winner (target Match version +1)"
          - "loser in {ELIGIBLE, CHECKED_IN} -> ELIMINATED (non-final round) or FINISHED (final round); final-round winner in {ELIGIBLE, CHECKED_IN} -> CHAMPION"
          - "if all division matches terminal: Division -> COMPLETED"
      - from: SCHEDULED
        to: FORFEITED
        trigger: "POST /api/v1/matches/{id}/forfeit or system (disqualify cascade)"
        actor: "CommissionAdmin or system"
        preconditions: ["forfeiting_team_id must be one of the two teams (ERR_VALIDATION)"]
        side_effects: ["winner_team_id = opponent; same advancement/elimination cascades as FINAL", "assignments in {PROPOSED, ACCEPTED} -> RELEASED (MATCH_CANCELLED)", "Match.version +1"]
      - from: IN_PROGRESS
        to: FORFEITED
        trigger: "POST /api/v1/matches/{id}/forfeit or system (disqualify cascade)"
        actor: "CommissionAdmin or system"
        preconditions: ["same as SCHEDULED -> FORFEITED"]
        side_effects: ["same as SCHEDULED -> FORFEITED", "Match.version +1"]
      - from: SCHEDULED
        to: WEATHER_DELAYED
        trigger: "system (weather alert activate cascade)"
        actor: system
        preconditions: []
        side_effects: ["assignments in {PROPOSED, ACCEPTED} -> RELEASED (WEATHER); Official.assigned_game_count recomputed", "Match.version +1"]
      - from: IN_PROGRESS
        to: WEATHER_DELAYED
        trigger: "system (weather alert activate cascade)"
        actor: system
        preconditions: []
        side_effects: ["same assignment release cascade", "Match.version +1"]
      - from: WEATHER_DELAYED
        to: RESCHEDULE_QUEUE
        trigger: "system (weather alert resolve cascade)"
        actor: system
        preconditions: []
        side_effects: ["field_id and scheduled_start cleared (queue holds only original_scheduled_start)", "Match.version +1"]
      - from: PENDING_TEAMS
        to: CANCELLED
        trigger: "system (event cancel cascade)"
        actor: system
        preconditions: []
        side_effects: ["Match.version +1"]
    note: "SCHEDULED -> WEATHER_DELAYED -> RESCHEDULE_QUEUE -> SCHEDULED is the cyclic weather loop."

  - entity: Official
    field: status
    initial_state: REGISTERED
    terminal_states: [INACTIVE]
    transitions:
      - from: REGISTERED
        to: VETTED
        trigger: "POST /api/v1/officials/{id}/transition (action=VET)"
        actor: CommissionAdmin
        preconditions: []
        side_effects: ["Official.version +1"]
      - from: VETTED
        to: ACTIVE
        trigger: "POST /api/v1/officials/{id}/transition (action=ACTIVATE)"
        actor: CommissionAdmin
        preconditions: []
        side_effects: ["Official.version +1"]
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /api/v1/officials/{id}/transition (action=SUSPEND)"
        actor: CommissionAdmin
        preconditions: []
        side_effects: ["assignments in {PROPOSED, ACCEPTED} -> RELEASED (OFFICIAL_SUSPENDED), assigned_game_count recomputed", "Official.version +1"]
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /api/v1/officials/{id}/transition (action=REINSTATE)"
        actor: CommissionAdmin
        preconditions: []
        side_effects: ["Official.version +1"]
      - from: ACTIVE
        to: INACTIVE
        trigger: "POST /api/v1/officials/{id}/transition (action=DEACTIVATE)"
        actor: CommissionAdmin
        preconditions: []
        side_effects: ["same release cascade as SUSPEND", "Official.version +1"]
      - from: SUSPENDED
        to: INACTIVE
        trigger: "POST /api/v1/officials/{id}/transition (action=DEACTIVATE)"
        actor: CommissionAdmin
        preconditions: []
        side_effects: ["Official.version +1"]

  - entity: OfficialAssignment
    field: status
    initial_state: PROPOSED
    terminal_states: [DECLINED, RELEASED, WORKED]
    transitions:
      - from: PROPOSED
        to: ACCEPTED
        trigger: "POST /api/v1/official-assignments/{id}/respond (response=ACCEPTED)"
        actor: Official (own)
        preconditions: ["match still SCHEDULED (ERR_INVALID_STATE)", "official still ACTIVE (ERR_OFFICIAL_NOT_ACTIVE)"]
        side_effects: ["Official.assigned_game_count +1", "OfficialAssignment.version +1"]
      - from: PROPOSED
        to: DECLINED
        trigger: "POST /api/v1/official-assignments/{id}/respond (response=DECLINED)"
        actor: Official (own)
        preconditions: []
        side_effects: ["OfficialAssignment.version +1"]
      - from: PROPOSED
        to: RELEASED
        trigger: "POST /api/v1/official-assignments/{id}/release or system cascade (weather/forfeit/suspend)"
        actor: "CommissionAdmin or system"
        preconditions: []
        side_effects: ["released_reason set", "Official.assigned_game_count -1", "OfficialAssignment.version +1"]
      - from: ACCEPTED
        to: RELEASED
        trigger: "POST /api/v1/official-assignments/{id}/release or system cascade"
        actor: "CommissionAdmin or system"
        preconditions: []
        side_effects: ["released_reason set", "Official.assigned_game_count -1", "OfficialAssignment.version +1"]
      - from: ACCEPTED
        to: WORKED
        trigger: "POST /api/v1/official-assignments/{id}/complete"
        actor: CommissionAdmin
        preconditions: ["match.status == FINAL (ERR_INVALID_STATE)"]
        side_effects: ["OfficialAssignment.version +1"]

  - entity: Volunteer
    field: status
    initial_state: APPLIED
    terminal_states: [REJECTED, INACTIVE]
    transitions:
      - from: APPLIED
        to: APPROVED
        trigger: "POST /api/v1/volunteers/{id}/transition (action=APPROVE)"
        actor: CommissionAdmin
        preconditions: ["background_check_cleared == true (ERR_BACKGROUND_CHECK_REQUIRED)"]
        side_effects: ["Volunteer.version +1"]
      - from: APPLIED
        to: REJECTED
        trigger: "POST /api/v1/volunteers/{id}/transition (action=REJECT)"
        actor: CommissionAdmin
        preconditions: []
        side_effects: ["Volunteer.version +1"]
      - from: APPROVED
        to: ACTIVE
        trigger: "POST /api/v1/volunteers/{id}/transition (action=ACTIVATE)"
        actor: CommissionAdmin
        preconditions: []
        side_effects: ["Volunteer.version +1"]
      - from: ACTIVE
        to: INACTIVE
        trigger: "POST /api/v1/volunteers/{id}/transition (action=DEACTIVATE)"
        actor: CommissionAdmin
        preconditions: []
        side_effects: ["signups in {SIGNED_UP, CONFIRMED} -> CANCELLED; shift confirmed_count recomputed (FILLED may reopen to OPEN)", "Volunteer.version +1"]

  - entity: Shift
    field: status
    initial_state: OPEN
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: OPEN
        to: FILLED
        trigger: "system (confirmed_count reaches capacity)"
        actor: system
        preconditions: []
        side_effects: ["Shift.version +1"]
      - from: FILLED
        to: OPEN
        trigger: "system (confirmed_count drops below capacity after cancel/no-show)"
        actor: system
        preconditions: []
        side_effects: ["Shift.version +1"]
      - from: OPEN
        to: COMPLETED
        trigger: "POST /api/v1/shifts/{id}/complete"
        actor: CommissionAdmin
        preconditions: ["logical clock > ends_at (ERR_SHIFT_TIME_INVALID)"]
        side_effects: ["signups in CONFIRMED -> WORKED with credited_hours = (ends_at - starts_at) hours, 2dp; Volunteer.hours_worked recomputed", "signups in SIGNED_UP -> CANCELLED", "Shift.version +1"]
      - from: FILLED
        to: COMPLETED
        trigger: "POST /api/v1/shifts/{id}/complete"
        actor: CommissionAdmin
        preconditions: ["logical clock > ends_at (ERR_SHIFT_TIME_INVALID)"]
        side_effects: ["same signup cascades as OPEN -> COMPLETED", "Shift.version +1"]
      - from: OPEN
        to: CANCELLED
        trigger: "POST /api/v1/shifts/{id}/cancel"
        actor: CommissionAdmin
        preconditions: []
        side_effects: ["signups in {SIGNED_UP, CONFIRMED} -> CANCELLED", "Shift.version +1"]
      - from: FILLED
        to: CANCELLED
        trigger: "POST /api/v1/shifts/{id}/cancel"
        actor: CommissionAdmin
        preconditions: []
        side_effects: ["same signup cascade", "Shift.version +1"]

  - entity: ShiftSignup
    field: status
    initial_state: SIGNED_UP
    terminal_states: [WORKED, NO_SHOW, CANCELLED]
    transitions:
      - from: SIGNED_UP
        to: CONFIRMED
        trigger: "POST /api/v1/shift-signups/{id}/confirm"
        actor: CommissionAdmin
        preconditions: ["shift confirmed_count < capacity (ERR_SHIFT_FULL)", "shift status in {OPEN, FILLED} (ERR_SHIFT_NOT_OPEN)"]
        side_effects: ["Shift confirmed_count +1 (may bubble to FILLED)", "ShiftSignup.version +1"]
      - from: SIGNED_UP
        to: CANCELLED
        trigger: "POST /api/v1/shift-signups/{id}/cancel or system cascade"
        actor: "CommissionAdmin, Volunteer (own), or system"
        preconditions: []
        side_effects: ["ShiftSignup.version +1"]
      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /api/v1/shift-signups/{id}/cancel or system cascade"
        actor: "CommissionAdmin, Volunteer (own), or system"
        preconditions: []
        side_effects: ["Shift confirmed_count -1 (may reopen FILLED -> OPEN)", "ShiftSignup.version +1"]
      - from: CONFIRMED
        to: WORKED
        trigger: "system (shift complete cascade)"
        actor: system
        preconditions: []
        side_effects: ["credited_hours set", "Volunteer.hours_worked recomputed", "ShiftSignup.version +1"]
      - from: CONFIRMED
        to: NO_SHOW
        trigger: "POST /api/v1/shift-signups/{id}/mark-no-show"
        actor: CommissionAdmin
        preconditions: ["logical clock > shift.ends_at (ERR_SHIFT_TIME_INVALID)"]
        side_effects: ["Shift confirmed_count -1 (may reopen FILLED -> OPEN)", "ShiftSignup.version +1"]

  - entity: WeatherAlert
    field: status
    initial_state: ISSUED
    terminal_states: [RESOLVED, EXPIRED]
    transitions:
      - from: ISSUED
        to: ACTIVE
        trigger: "POST /api/v1/weather-alerts/{id}/activate"
        actor: CommissionAdmin
        preconditions: ["Event.posture in {COMPETITION_SETUP, LIVE} (ERR_EVENT_POSTURE_FORBIDS)"]
        side_effects:
          - "matches in {SCHEDULED, IN_PROGRESS} on fields of the scoped venue (or all event venues when venue_id null) whose [scheduled_start, scheduled_end) intersects [window_start, window_end) -> WEATHER_DELAYED (each Match version +1)"
          - "each such match transition releases its {PROPOSED, ACCEPTED} assignments (WEATHER) and recomputes Official.assigned_game_count"
          - "WeatherAlert.version +1"
      - from: ACTIVE
        to: RESOLVED
        trigger: "POST /api/v1/weather-alerts/{id}/resolve"
        actor: CommissionAdmin
        preconditions: []
        side_effects: ["matches in WEATHER_DELAYED under this alert -> RESCHEDULE_QUEUE (field/time cleared)", "WeatherAlert.version +1"]
      - from: ISSUED
        to: EXPIRED
        trigger: "POST /api/v1/weather-alerts/{id}/resolve (on an ISSUED alert)"
        actor: CommissionAdmin
        preconditions: []
        side_effects: ["WeatherAlert.version +1"]
        note: "Resolving an un-activated alert expires it without any match cascade."

  - entity: ImpactReport
    field: status
    initial_state: DRAFT
    terminal_states: [ACCEPTED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /api/v1/impact-reports/{id}/submit"
        actor: CommissionAdmin
        preconditions: []
        side_effects: ["projected_room_nights and projected_direct_spend_cents snapshotted per impact_direct_spend (projected variant)", "ImpactReport.version +1"]
      - from: SUBMITTED
        to: UNDER_AUDIT
        trigger: "POST /api/v1/impact-reports/{id}/audit"
        actor: CvbAuditor
        preconditions: ["auditor X-User-ID != created_by_user_id (ERR_SOD_VIOLATION)"]
        side_effects: ["actual_attendance, audited_by_user_id set; actual_room_nights and audited_direct_spend_cents computed per audited variant", "ImpactReport.version +1"]
      - from: UNDER_AUDIT
        to: ACCEPTED
        trigger: "POST /api/v1/impact-reports/{id}/audit-decision (decision=ACCEPTED)"
        actor: CvbAuditor
        preconditions: []
        side_effects: ["ImpactReport.version +1"]
      - from: UNDER_AUDIT
        to: DISPUTED
        trigger: "POST /api/v1/impact-reports/{id}/audit-decision (decision=DISPUTED)"
        actor: CvbAuditor
        preconditions: []
        side_effects: ["ImpactReport.version +1"]
      - from: DISPUTED
        to: DRAFT
        trigger: "POST /api/v1/impact-reports/{id}/revise"
        actor: CommissionAdmin
        preconditions: []
        side_effects: ["revision_count +1", "ImpactReport.version +1"]
    note: "Cyclic: DRAFT -> SUBMITTED -> UNDER_AUDIT -> DISPUTED -> DRAFT."

  - entity: Settlement
    field: status
    initial_state: OPEN
    terminal_states: [PAID]
    transitions:
      - from: OPEN
        to: EXPENSES_CERTIFIED
        trigger: "POST /api/v1/settlements/{id}/certify"
        actor: CommissionAdmin
        preconditions: ["all HotelBlocks of the event in {RECONCILED, SETTLED, RELEASED} (ERR_BLOCK_NOT_RECONCILABLE)"]
        side_effects: ["certified_by_user_id = X-User-ID", "all computed totals snapshotted (registration_revenue, sanction_fee, venue_rental, officials_stipend, rebate, expenses, gross, net)", "Settlement.version +1"]
      - from: EXPENSES_CERTIFIED
        to: APPROVED
        trigger: "POST /api/v1/settlements/{id}/approve"
        actor: CommissionAdmin
        preconditions: ["X-User-ID != certified_by_user_id (ERR_SOD_VIOLATION)", "an ImpactReport of this event is ACCEPTED (ERR_IMPACT_REPORT_NOT_ACCEPTED)"]
        side_effects: ["approved_by_user_id = X-User-ID", "Settlement.version +1"]
      - from: APPROVED
        to: PAID
        trigger: "POST /api/v1/settlements/{id}/pay"
        actor: CommissionAdmin
        preconditions: []
        side_effects: ["Event.posture COMPLETED -> SETTLED cascade (HotelBlocks RECONCILED -> SETTLED)", "Settlement.version +1"]
      - from: EXPENSES_CERTIFIED
        to: DISPUTED
        trigger: "POST /api/v1/settlements/{id}/dispute"
        actor: "CommissionAdmin or CvbAuditor"
        preconditions: []
        side_effects: ["Settlement.version +1"]
      - from: DISPUTED
        to: OPEN
        trigger: "POST /api/v1/settlements/{id}/reopen"
        actor: CommissionAdmin
        preconditions: []
        side_effects: ["certified_by_user_id cleared; expense_lines editable again", "Settlement.version +1"]
    note: "Cyclic: OPEN -> EXPENSES_CERTIFIED -> DISPUTED -> OPEN."

# =============================================================================
# §1.2.1 Concurrency Rules (true races only, OCC on parent version)
# =============================================================================
concurrency_rules:
  - rule_id: bid-create-stale-event
    parent_entity: Event
    write_endpoint: "POST /api/v1/events/{id}/bids"
    occ_field: expected_event_version
    description: |
      Creating a Bid against an Event whose version has advanced since the
      client last observed it is rejected. Creating a bid legitimately
      supersedes an existing DRAFT bid and can revive a BID_LOST event, so a
      writer holding a stale event view (e.g. unaware another writer just
      created a bid) must restart from a fresh read.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: bid-patch-stale-bid
    parent_entity: Bid
    write_endpoint: "PATCH /api/v1/bids/{id}"
    occ_field: expected_bid_version
    description: |
      Editing a DRAFT/REVISION_REQUESTED Bid whose version has advanced since
      the client last observed it is rejected, because requirement verifications
      and reviewer actions mutate the bid's review surface between reads.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: hotel-block-patch-stale
    parent_entity: HotelBlock
    write_endpoint: "PATCH /api/v1/hotel-blocks/{id}"
    occ_field: expected_hotel_block_version
    description: |
      Editing NEGOTIATING HotelBlock terms against a stale block version is
      rejected; bookings pin their rate from the block, so repricing from a
      stale view would corrupt already-quoted offers.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: posture-advance-stale-event
    parent_entity: Event
    write_endpoint: "POST /api/v1/events/{id}/posture"
    occ_field: expected_event_version
    description: |
      Advancing posture against a stale Event version is rejected; posture
      transitions fire multi-entity cascades whose preconditions were evaluated
      against the version the client observed.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: hotel_pickup_rebate
    trigger: "estimated variant: computed on every HotelBlock read; final variant: POST /api/v1/hotel-blocks/{id}/reconcile"
    algorithm: threshold
    formula: |
      block_nights = (block_end_date - block_start_date) in days
      contracted_room_nights = contracted_rooms_per_night * block_nights
      picked_up_room_nights = sum(room_nights of bookings in the variant's input set)
      pickup_pct = picked_up_room_nights / contracted_room_nights   (4dp, round_half_up)
      tier_rate: pickup_pct >= 1.0000 -> 0.12 ; >= 0.9000 -> 0.10 ; >= 0.8000 -> 0.07 ; else 0.00
      rebate_tier: TIER_3 at 0.12, TIER_2 at 0.10, TIER_1 at 0.07, TIER_0 at 0.00
      rebate_cents = sum over in-set bookings of round_half_up(booking.total_charge_cents * tier_rate)
        -- rounding order PINNED: round per booking first, then sum. Never round the block-level product.
      attrition_floor_pct = 1 - attrition_allowance_pct
      if pickup_pct < attrition_floor_pct:
        shortfall_nights = floor(attrition_floor_pct * contracted_room_nights) - picked_up_room_nights
        attrition_penalty_cents = round_half_up(shortfall_nights * room_rate_cents * ATTRITION_RATE)
      else attrition_penalty_cents = 0
    input_set: "estimated: bookings in {RESERVED, CONFIRMED, CHECKED_IN, CHECKED_OUT, NO_SHOW}; final: bookings in {CHECKED_OUT, NO_SHOW} only"
    constants:
      TIER_3_FLOOR: 1.0000
      TIER_3_RATE: 0.12
      TIER_2_FLOOR: 0.9000
      TIER_2_RATE: 0.10
      TIER_1_FLOOR: 0.8000
      TIER_1_RATE: 0.07
      ATTRITION_RATE: 0.50
    precision: "money: integer cents, round_half_up; pickup_pct: 4 decimal places, round_half_up"
    variants:
      - name: estimated
        when: "any read before reconcile; includes RESERVED and CONFIRMED bookings"
        difference: "forward-looking pickup: bookings that may still cancel are counted"
      - name: final
        when: "at reconcile (CUTOFF_PASSED -> RECONCILED); frozen thereafter"
        difference: "actualized pickup: only CHECKED_OUT and NO_SHOW bookings count; identical data yields a lower-or-equal rebate"

  - name: impact_direct_spend
    trigger: "projected variant: POST /api/v1/impact-reports/{id}/submit; audited variant: POST /api/v1/impact-reports/{id}/audit"
    algorithm: forward_looking
    formula: |
      projected_room_nights = sum(room_nights of event bookings in {RESERVED, CONFIRMED, CHECKED_IN, CHECKED_OUT, NO_SHOW})
      projected_direct_spend_cents = sum(total_charge_cents of those bookings) + projected_attendance * PER_CAPITA_SPEND_CENTS
      actual_room_nights = sum(room_nights of event bookings in {CHECKED_OUT, NO_SHOW})
      audited_direct_spend_cents = sum(total_charge_cents of those bookings) + actual_attendance * PER_CAPITA_SPEND_CENTS
    input_set: "projected: bookings in {RESERVED, CONFIRMED, CHECKED_IN, CHECKED_OUT, NO_SHOW}; audited: {CHECKED_OUT, NO_SHOW}"
    constants:
      PER_CAPITA_SPEND_CENTS: 14500
    precision: "integer cents; no intermediate rounding"
    variants:
      - name: projected
        when: "at submit"
        difference: "uses forward-looking booking set and the planner's projected_attendance"
      - name: audited
        when: "at audit"
        difference: "uses actualized booking set and the auditor's actual_attendance; identical event data produces a different total"

  - name: sanction_fee
    trigger: "settlement certify (snapshot)"
    algorithm: tiered_pricing
    formula: |
      registration_revenue_cents = sum over teams in FEE_PAID_STATUSES of their division.registration_fee_cents
      FEE_PAID_STATUSES = {ROSTER_SUBMITTED, ELIGIBLE, CHECKED_IN, ELIMINATED, FINISHED, CHAMPION, DISQUALIFIED}
        -- ENTERED, WAITLISTED, WITHDRAWN are excluded (fee not yet due / refunded)
      marginal tiers over registration_revenue_cents:
        tier1: first 5_000_000 cents at 0.08
        tier2: next 5_000_000 cents (5_000_001..10_000_000) at 0.10
        tier3: remainder above 10_000_000 at 0.12
      sanction_fee_cents = round_half_up(tier1_slice) + round_half_up(tier2_slice) + round_half_up(tier3_slice)
        -- rounding order PINNED: round each tier slice to whole cents, then sum
    input_set: "all teams of the event in FEE_PAID_STATUSES, joined to their division's registration_fee_cents"
    constants:
      TIER1_CAP_CENTS: 5000000
      TIER1_RATE: 0.08
      TIER2_CAP_CENTS: 10000000
      TIER2_RATE: 0.10
      TIER3_RATE: 0.12
    precision: "integer cents per tier slice, round_half_up, then summed"
    variants: []

  - name: official_stipend_total
    trigger: "settlement certify (snapshot)"
    algorithm: aggregation
    formula: |
      per_assignment_stipend = round_half_up(BASE_STIPEND_CENTS * LEVEL_MULTIPLIER[official.certification_level])
      officials_stipend_total_cents = sum of per_assignment_stipend over OfficialAssignments in WORKED for this event
        -- rounding order PINNED: round each assignment's stipend to whole cents first, then sum.
        -- Summing raw products and rounding once yields a different total and is non-conformant.
    input_set: "OfficialAssignments with status WORKED whose match belongs to this event"
    constants:
      BASE_STIPEND_CENTS: 9999
      LEVEL_MULTIPLIER_TRAINEE: 0.6
      LEVEL_MULTIPLIER_REGIONAL: 1.0
      LEVEL_MULTIPLIER_NATIONAL: 1.5
    precision: "integer cents, round_half_up per assignment"
    variants: []

  - name: settlement_waterfall
    trigger: "settlement certify (snapshot)"
    algorithm: waterfall_allocation
    formula: |
      gross_revenue_cents = registration_revenue_cents + rebate_total_cents + sponsor_contributions_cents
      deduct in strict bucket order (each bucket fully satisfied before the next):
        1. sanction_fee_cents
        2. venue_rental_total_cents
        3. officials_stipend_total_cents
        4. expense_total_cents
      net_to_commission_cents = gross_revenue_cents - sanction_fee_cents - venue_rental_total_cents
                                - officials_stipend_total_cents - expense_total_cents
        -- remainder bucket; MAY be negative (commission owes the difference)
    input_set: "snapshot fields computed at certify"
    constants: {}
    precision: "integer cents"
    variants: []

  - name: bracket_seeding
    trigger: "POST /api/v1/divisions/{id}/lock-seeding"
    algorithm: weighted_scoring
    formula: |
      candidates = teams of the division in ELIGIBLE
      order by strength_rating DESC, tie-break created_at ASC (3-digit fractional precision; id never consulted)
      assign seed_number 1..N in that order
    input_set: "ELIGIBLE teams of the division at lock time"
    constants: {}
    precision: "integer seeds"
    variants: []

  - name: bracket_topology
    trigger: "POST /api/v1/divisions/{id}/publish-bracket"
    algorithm: topological
    formula: |
      N = eligible_team_count (all ELIGIBLE teams are seeded)
      bracket_size = smallest power of 2 >= max(2, N); total_rounds = log2(bracket_size)
      byes = bracket_size - N; seeds 1..byes receive byes
      round-1 real matches pair seeds (s, bracket_size + 1 - s) for s in bye_excluded low half
      total matches created = bracket_size - 1 - byes
      advancement: match (round r, slot k) winner_advances_to match (round r+1, slot ceil(k/2));
        winner fills home slot of the target when k is odd, away slot when k is even
      bye seeds are placed directly into their round-2 match slots at publish time
    input_set: "seeded teams of the division"
    constants: {}
    precision: "integer counts"
    variants: []

  - name: reschedule_queue_order
    trigger: "POST /api/v1/matches/{id}/reschedule (ordering gate)"
    algorithm: chronological
    formula: |
      queue = matches of the same division in RESCHEDULE_QUEUE
      sort by round_number ASC, then original_scheduled_start ASC (nulls last), then created_at ASC
      a match may only be rescheduled when every queue entry sorting before it is already SCHEDULED or terminal
    input_set: "RESCHEDULE_QUEUE matches of the division"
    constants: {}
    precision: "n/a"
    variants: []

  - name: official_daily_load
    trigger: "POST /api/v1/matches/{id}/official-assignments (create gate)"
    algorithm: threshold
    formula: |
      day = calendar date of match.scheduled_start (UTC)
      load = count of the official's assignments in {ACCEPTED, WORKED} whose match scheduled_start falls on day
      reject the new assignment when load >= official.game_limit_per_day (ERR_OFFICIAL_DAILY_LIMIT)
      -- boundary: reaching exactly the limit is allowed; the assignment that would exceed it is rejected
    input_set: "the official's ACCEPTED/WORKED assignments on the same UTC calendar date"
    constants: {}
    precision: "integer count"
    variants: []

  - name: volunteer_hours
    trigger: "recomputed on Shift complete cascade and on every Volunteer read"
    algorithm: aggregation
    formula: |
      credited_hours per WORKED signup = (shift.ends_at - shift.starts_at) in minutes / 60, rounded to 2dp round_half_up
      volunteer.hours_worked = sum of credited_hours over WORKED signups
      NO_SHOW, CANCELLED, SIGNED_UP, CONFIRMED contribute 0
    input_set: "ShiftSignups of the volunteer in WORKED"
    constants: {}
    precision: "2 decimal places, round_half_up"
    variants: []

  - name: bid_completeness_score
    trigger: "requirement verify/waive cascades and bid decide"
    algorithm: weighted_scoring
    formula: |
      review_score = sum(weight_points of VERIFIED requirements)
                   + sum(floor(weight_points / 2) of WAIVED requirements)
      award gate: review_score >= AWARD_MIN_SCORE (boundary is inclusive)
    input_set: "all BidRequirements of the bid"
    constants:
      AWARD_MIN_SCORE: 80
    precision: "integer points; floor division for WAIVED half-credit"
    variants: []

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present; X-User-Role is a declared role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "role is in the endpoint's roles list; entity-backed ownership scope: TeamRep X-User-ID == target team.id; Official == assignment.official_id or booking.official_id; Volunteer == signup/booking volunteer or volunteer_id input; HotelManager == block.id (path block or booking's block); VenueManager == field.venue_id"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "path resource ids exist, validated left-to-right (event -> child -> grandchild); body FK references (field_id, official_id, volunteer_id, team_id) exist"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"
  - priority: 4
    category: state
    check: "OCC: expected_<parent>_version equals the parent entity's current version (declared endpoints only)"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /api/v1/events/{id}/bids, PATCH /api/v1/bids/{id}, PATCH /api/v1/hotel-blocks/{id}, POST /api/v1/events/{id}/posture"
  - priority: 5
    category: state
    check: "Event.posture permits the operation (bid create in BIDDING/BID_LOST/SETTLED, bid submit in BIDDING; venue/block contract in BIDDING/AWARDED/PLANNING; team registration in REGISTRATION_OPEN; scheduling in COMPETITION_SETUP/LIVE; weather alert activation in COMPETITION_SETUP/LIVE (alert creation is ungated); impact report and settlement creation in COMPLETED; check-in/start/finalize in LIVE)"
    error_id: ERR_EVENT_POSTURE_FORBIDS
    http_status: 409
    applies_to: "all posture-gated endpoints"
  - priority: 6
    category: state
    check: "target entity state permits the transition (generic fallback for transition endpoints)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all transition/action endpoints"
  - priority: 6.1
    category: state
    check: "bid is DRAFT or REVISION_REQUESTED for PATCH/evidence/requirement-create/waive"
    error_id: ERR_BID_NOT_EDITABLE
    http_status: 409
    applies_to: "PATCH /api/v1/bids/{id}, POST .../requirements, POST .../evidence, POST .../waive"
  - priority: 6.2
    category: state
    check: "requirement is EVIDENCE_SUBMITTED for verify; PENDING for waive"
    error_id: ERR_REQUIREMENT_NOT_REVIEWABLE
    http_status: 409
    applies_to: "POST /api/v1/requirements/{id}/verify, POST /api/v1/requirements/{id}/waive"
  - priority: 6.3
    category: state
    check: "division is OPEN for roster/verify-eligibility/manual-withdraw; SEEDING_LOCKED for publish; OPEN for lock"
    error_id: ERR_DIVISION_NOT_OPEN
    http_status: 409
    applies_to: "team lifecycle endpoints, division endpoints"
  - priority: 6.4
    category: state
    check: "match is PENDING_TEAMS for schedule; RESCHEDULE_QUEUE for reschedule; SCHEDULED for start/forfeit; IN_PROGRESS for finalize/forfeit; SCHEDULED for assignment create/respond-accept"
    error_id: ERR_MATCH_NOT_SCHEDULABLE
    http_status: 409
    applies_to: "match endpoints, assignment endpoints"
  - priority: 6.5
    category: state
    check: "match is RESCHEDULE_QUEUE for reschedule (distinct error for queue misuse)"
    error_id: ERR_MATCH_NOT_RESCHEDULABLE
    http_status: 409
    applies_to: "POST /api/v1/matches/{id}/reschedule"
  - priority: 6.6
    category: state
    check: "hotel block is CONTRACTED for booking create/confirm; NEGOTIATING for PATCH; CUTOFF_PASSED for reconcile"
    error_id: ERR_BLOCK_NOT_CONTRACTED
    http_status: 409
    applies_to: "room booking + hotel block endpoints"
  - priority: 6.7
    category: state
    check: "official is ACTIVE for assignment create and respond-accept"
    error_id: ERR_OFFICIAL_NOT_ACTIVE
    http_status: 409
    applies_to: "assignment endpoints"
  - priority: 6.8
    category: state
    check: "volunteer is ACTIVE for signup create"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "POST /api/v1/shifts/{id}/signups"
  - priority: 6.9
    category: state
    check: "shift is OPEN for signup create; OPEN/FILLED for confirm/complete/cancel"
    error_id: ERR_SHIFT_NOT_OPEN
    http_status: 409
    applies_to: "shift + signup endpoints"
  - priority: 6.10
    category: state
    check: "entity already in a terminal state rejects any further transition"
    error_id: ERR_ALREADY_TERMINAL
    http_status: 409
    applies_to: "all transition endpoints"
  - priority: 7
    category: business_safety
    check: "segregation of duties: settlement approver != certified_by_user_id; requirement verifier != evidence_submitted_by_user_id; impact auditor != created_by_user_id"
    error_id: ERR_SOD_VIOLATION
    http_status: 403
    applies_to: "settlement approve, requirement verify, impact audit"
  - priority: 7.1
    category: business_safety
    check: "certification: CREW_CHIEF requires REGIONAL or NATIONAL; on the final round CREW_CHIEF requires NATIONAL; TRAINEE may only hold ASSISTANT"
    error_id: ERR_CERTIFICATION_INSUFFICIENT
    http_status: 409
    applies_to: "POST /api/v1/matches/{id}/official-assignments"
  - priority: 7.2
    category: business_safety
    check: "volunteer background_check_cleared must be true for APPROVE"
    error_id: ERR_BACKGROUND_CHECK_REQUIRED
    http_status: 409
    applies_to: "POST /api/v1/volunteers/{id}/transition"
  - priority: 8
    category: business_constraint
    check: "at most one non-terminal Bid per event (new bid supersedes only a DRAFT bid; an active SUBMITTED/UNDER_REVIEW/REVISION_REQUESTED bid blocks creation)"
    error_id: ERR_BID_ALREADY_ACTIVE
    http_status: 409
    applies_to: "POST /api/v1/events/{id}/bids"
  - priority: 8.1
    category: business_constraint
    check: "bid submit gates: all mandatory requirements VERIFIED; all requirements VERIFIED or WAIVED"
    error_id: ERR_BID_REQUIREMENTS_INCOMPLETE
    http_status: 409
    applies_to: "POST /api/v1/bids/{id}/submit"
  - priority: 8.2
    category: business_constraint
    check: "waive only when is_mandatory == false"
    error_id: ERR_REQUIREMENT_NOT_WAIVABLE
    http_status: 409
    applies_to: "POST /api/v1/requirements/{id}/waive"
  - priority: 8.3
    category: business_constraint
    check: "roster_player_count >= 7"
    error_id: ERR_ROSTER_TOO_SMALL
    http_status: 422
    applies_to: "POST /api/v1/teams/{id}/roster"
  - priority: 8.4
    category: business_constraint
    check: "eligible_team_count >= min_teams at lock-seeding"
    error_id: ERR_DIVISION_BELOW_MIN_TEAMS
    http_status: 409
    applies_to: "POST /api/v1/divisions/{id}/lock-seeding"
  - priority: 8.6
    category: business_constraint
    check: "schedule requires both teams assigned"
    error_id: ERR_MATCH_TEAMS_INCOMPLETE
    http_status: 409
    applies_to: "POST /api/v1/matches/{id}/schedule"
  - priority: 8.7
    category: business_constraint
    check: "finalize/forfeit: scores >= 0"
    error_id: ERR_SCORE_INVALID
    http_status: 422
    applies_to: "POST /api/v1/matches/{id}/finalize"
  - priority: 8.8
    category: business_constraint
    check: "finalize requires home_score != away_score"
    error_id: ERR_TIE_NOT_ALLOWED
    http_status: 422
    applies_to: "POST /api/v1/matches/{id}/finalize"
  - priority: 8.9
    category: business_constraint
    check: "no second non-terminal assignment for the same official on the same match; at most one non-terminal CREW_CHIEF per match"
    error_id: ERR_DUPLICATE_ASSIGNMENT
    http_status: 409
    applies_to: "POST /api/v1/matches/{id}/official-assignments"
  - priority: 8.10
    category: business_constraint
    check: "reschedule must honor reschedule_queue_order (round ASC, original_scheduled_start ASC, created_at ASC) within the division"
    error_id: ERR_RESCHEDULE_ORDER_VIOLATION
    http_status: 409
    applies_to: "POST /api/v1/matches/{id}/reschedule"
  - priority: 8.11
    category: business_constraint
    check: "venue release blocked while any of its fields hosts a match in {SCHEDULED, WEATHER_DELAYED, RESCHEDULE_QUEUE, IN_PROGRESS}"
    error_id: ERR_VENUE_HAS_ACTIVE_MATCHES
    http_status: 409
    applies_to: "POST /api/v1/venues/{id}/release"
  - priority: 8.12
    category: business_constraint
    check: "at most one Settlement per event"
    error_id: ERR_SETTLEMENT_EXISTS
    http_status: 409
    applies_to: "POST /api/v1/events/{id}/settlements"
  - priority: 8.13
    category: business_constraint
    check: "award requires review_score >= 80 (inclusive boundary)"
    error_id: ERR_BID_SCORE_BELOW_THRESHOLD
    http_status: 409
    applies_to: "POST /api/v1/bids/{id}/decide"
  - priority: 9
    category: business_temporal
    check: "match window [scheduled_start, scheduled_start+slot_minutes) must not overlap another SCHEDULED/IN_PROGRESS match on the same field; half-open: end == other start is allowed"
    error_id: ERR_FIELD_TIME_CONFLICT
    http_status: 409
    applies_to: "POST /api/v1/matches/{id}/schedule, POST /api/v1/matches/{id}/reschedule"
  - priority: 9.1
    category: business_temporal
    check: "official's new match window expanded by +/-30 min buffer must not intersect windows of that official's ACCEPTED/WORKED assignments"
    error_id: ERR_OFFICIAL_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /api/v1/matches/{id}/official-assignments"
  - priority: 9.2
    category: business_temporal
    check: "volunteer's SIGNED_UP/CONFIRMED signups must have pairwise non-overlapping shift windows [starts_at, ends_at)"
    error_id: ERR_SHIFT_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /api/v1/shifts/{id}/signups"
  - priority: 9.3
    category: business_temporal
    check: "booking nights [check_in_date, check_out_date) must be within [block_start_date, block_end_date)"
    error_id: ERR_BOOKING_OUTSIDE_BLOCK_DATES
    http_status: 422
    applies_to: "POST /api/v1/hotel-blocks/{id}/room-bookings"
  - priority: 9.4
    category: business_temporal
    check: "logical clock date must be <= cutoff_date for booking create; > cutoff_date for close-cutoff"
    error_id: ERR_CUTOFF_PASSED
    http_status: 409
    applies_to: "booking create, close-cutoff"
  - priority: 9.5
    category: business_temporal
    check: "scheduled date within [event.starts_on, event.ends_on]; scheduled_start at/after 18:00 requires field lights"
    error_id: ERR_MATCH_OUTSIDE_EVENT_DATES
    http_status: 422
    applies_to: "schedule/reschedule (lights uses ERR_FIELD_NO_LIGHTS 409)"
  - priority: 9.6
    category: business_temporal
    check: "window_end > window_start for weather alerts; ends_at > starts_at for shifts"
    error_id: ERR_ALERT_WINDOW_INVALID
    http_status: 422
    applies_to: "weather alert create, shift create (shifts use ERR_SHIFT_TIME_INVALID 422)"
  - priority: 10
    category: business_referential
    check: "referenced child entities belong to the same event (field's venue event, team/official/volunteer event, booking team/official event)"
    error_id: ERR_CROSS_EVENT_REFERENCE
    http_status: 409
    applies_to: "schedule, assignment create, booking create, signup create"
  - priority: 11
    category: business_fiscal
    check: "per-night room inventory: for every night in [check_in_date, check_out_date), sum(rooms_count over non-CANCELLED bookings occupying that night) + rooms_count <= contracted_rooms_per_night"
    error_id: ERR_BLOCK_INVENTORY_EXCEEDED
    http_status: 409
    applies_to: "POST /api/v1/hotel-blocks/{id}/room-bookings"
  - priority: 11.1
    category: business_fiscal
    check: "shift confirm: confirmed_count < capacity; signup create: non-cancelled signup count < capacity"
    error_id: ERR_SHIFT_FULL
    http_status: 409
    applies_to: "POST /api/v1/shifts/{id}/signups, POST /api/v1/shift-signups/{id}/confirm"
  - priority: 11.2
    category: business_fiscal
    check: "official daily load: existing ACCEPTED/WORKED assignments on that UTC date < game_limit_per_day"
    error_id: ERR_OFFICIAL_DAILY_LIMIT
    http_status: 409
    applies_to: "POST /api/v1/matches/{id}/official-assignments"
  - priority: 11.3
    category: business_fiscal
    check: "settlement certify requires all hotel blocks in {RECONCILED, SETTLED, RELEASED}"
    error_id: ERR_BLOCK_NOT_RECONCILABLE
    http_status: 409
    applies_to: "POST /api/v1/settlements/{id}/certify"
  - priority: 11.4
    category: business_fiscal
    check: "settlement approve requires an ACCEPTED impact report"
    error_id: ERR_IMPACT_REPORT_NOT_ACCEPTED
    http_status: 409
    applies_to: "POST /api/v1/settlements/{id}/approve"
  - priority: 12
    category: business_constraint
    check: "malformed payloads, missing required fields, invalid enum members, out-of-range numbers, ends_on < starts_on, ends_at <= starts_at"
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: "all"
    note: "schema-level validation; runs after auth/existence but its exact position vs state checks is: malformed body (400) is detected before state evaluation whenever the body cannot be interpreted; semantic range errors listed above use the pinned error ids."

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- clock (test-driving; startup default 2026-08-01T00:00:00Z) ---
  - method: POST
    path: "/api/v1/_clock/set_current_utc"
    description: "Set the server's logical clock. Startup default is exactly 2026-08-01T00:00:00Z and never falls back to wall-clock time; all date/datetime rules (cutoffs, event dates, shift completion, no-show) read this clock, and all created_at/updated_at timestamps are stamped from it."
    roles: [CommissionAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: ["logical clock advanced (monotonic: setting an earlier time is rejected with ERR_VALIDATION)"]

  # --- Event ---
  - method: POST
    path: "/api/v1/events"
    description: "Create an event (posture BIDDING)"
    roles: [CommissionAdmin]
    code: 201
    input: [name, sanctioning_body, host_city, starts_on, ends_on]
    output: Event
    side_effects: ["posture=BIDDING, version=1"]
  - method: GET
    path: "/api/v1/events"
    description: "List events; default sort created_at DESC; active_bid_id filter finds the event pointing at a given bid"
    roles: [Any]
    code: 200
    input: ["posture?", "active_bid_id?", "limit?", "offset?"]
    output: "Event[]"
    side_effects: []
  - method: GET
    path: "/api/v1/events/{id}"
    description: "Get one event"
    roles: [Any]
    code: 200
    input: []
    output: Event
    side_effects: []
  - method: POST
    path: "/api/v1/events/{id}/posture"
    description: "Advance event posture per the Event state machine (OCC on event version)"
    roles: [CommissionAdmin]
    code: 200
    input: [to_posture, expected_event_version]
    output: Event
    side_effects: ["posture transition + cascades per state machine", "increments Event.version by 1"]
  - method: GET
    path: "/api/v1/events/{id}/summary"
    description: "Computed operational summary"
    roles: [Any]
    code: 200
    input: []
    output: { posture: string, registered_team_count: integer, finalized_match_count: integer, active_bid_id: string, total_final_rebate_cents: integer, picked_up_room_nights_total: integer }
    side_effects: []

  # --- Bid ---
  - method: POST
    path: "/api/v1/events/{id}/bids"
    description: "Create a bid (renewal cycle when prior bids terminal); supersedes an existing DRAFT bid; revives BID_LOST or SETTLED event to BIDDING; OCC on event version"
    roles: [CommissionAdmin]
    code: 201
    input: [expected_event_version, "notes?"]
    output: Bid
    side_effects: ["cycle_number = prior max + 1", "existing DRAFT bid -> SUPERSEDED", "Event.active_bid_id set", "increments Event.version by 1", "posture BID_LOST -> BIDDING if applicable"]
  - method: GET
    path: "/api/v1/events/{id}/bids"
    description: "List bids of an event, sorted cycle_number DESC"
    roles: [Any]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "Bid[]"
    side_effects: []
  - method: GET
    path: "/api/v1/bids/{id}"
    description: "Get one bid"
    roles: [Any]
    code: 200
    input: []
    output: Bid
    side_effects: []
  - method: PATCH
    path: "/api/v1/bids/{id}"
    description: "Edit bid notes while DRAFT/REVISION_REQUESTED (OCC on bid version)"
    roles: [CommissionAdmin]
    code: 200
    input: [expected_bid_version, "notes?"]
    output: Bid
    side_effects: ["increments Bid.version by 1"]
  - method: POST
    path: "/api/v1/bids/{id}/submit"
    description: "Submit bid (DRAFT or REVISION_REQUESTED -> SUBMITTED); enforces checklist gates"
    roles: [CommissionAdmin]
    code: 200
    input: []
    output: Bid
    side_effects: ["submitted_at set", "revision_count +1 when resubmitting", "Bid.version +1"]
  - method: POST
    path: "/api/v1/bids/{id}/withdraw"
    description: "Withdraw a non-terminal bid"
    roles: [CommissionAdmin]
    code: 200
    input: []
    output: Bid
    side_effects: ["status WITHDRAWN", "Event.active_bid_id cleared", "Bid.version +1"]
  - method: POST
    path: "/api/v1/bids/{id}/review"
    description: "Sanctioning body opens review (SUBMITTED -> UNDER_REVIEW)"
    roles: [SanctioningReviewer]
    code: 200
    input: []
    output: Bid
    side_effects: ["Bid.version +1"]
  - method: POST
    path: "/api/v1/bids/{id}/request-revision"
    description: "Request revisions (UNDER_REVIEW -> REVISION_REQUESTED)"
    roles: [SanctioningReviewer]
    code: 200
    input: [revision_notes]
    output: Bid
    side_effects: ["Bid.version +1"]
  - method: POST
    path: "/api/v1/bids/{id}/decide"
    description: "Award or reject (UNDER_REVIEW -> AWARDED/REJECTED); award gated on review_score >= 80"
    roles: [SanctioningReviewer]
    code: 200
    input: [decision]
    output: Bid
    side_effects: ["AWARDED: Event BIDDING -> AWARDED + other non-terminal bids SUPERSEDED", "REJECTED: Event BIDDING -> BID_LOST", "decided_at/decided_by_user_id set", "Bid.version +1"]
  - method: GET
    path: "/api/v1/bids/{id}/requirements"
    description: "List requirements of a bid, sorted created_at ASC"
    roles: [Any]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "BidRequirement[]"
    side_effects: []

  # --- BidRequirement ---
  - method: POST
    path: "/api/v1/bids/{id}/requirements"
    description: "Add a checklist requirement (bid DRAFT/REVISION_REQUESTED)"
    roles: [CommissionAdmin]
    code: 201
    input: [kind, is_mandatory, weight_points, "notes?"]
    output: BidRequirement
    side_effects: ["status PENDING"]
  - method: GET
    path: "/api/v1/requirements/{id}"
    description: "Get one requirement"
    roles: [Any]
    code: 200
    input: []
    output: BidRequirement
    side_effects: []
  - method: POST
    path: "/api/v1/requirements/{id}/evidence"
    description: "Submit evidence (PENDING/RETURNED -> EVIDENCE_SUBMITTED)"
    roles: [CommissionAdmin]
    code: 200
    input: [evidence_uri, "notes?"]
    output: BidRequirement
    side_effects: ["evidence_submitted_by_user_id = X-User-ID", "version +1"]
  - method: POST
    path: "/api/v1/requirements/{id}/verify"
    description: "Verify or return evidence (SoD: verifier != evidence submitter)"
    roles: [SanctioningReviewer]
    code: 200
    input: [decision, "review_notes?"]
    output: BidRequirement
    side_effects: ["VERIFIED/RETURNED", "bid review_score recomputed", "version +1"]
  - method: POST
    path: "/api/v1/requirements/{id}/waive"
    description: "Waive a non-mandatory requirement"
    roles: [SanctioningReviewer]
    code: 200
    input: [waiver_reason]
    output: BidRequirement
    side_effects: ["status WAIVED", "bid review_score recomputed", "version +1"]

  # --- Venue / Field ---
  - method: POST
    path: "/api/v1/events/{id}/venues"
    description: "Create a venue (PROPOSED)"
    roles: [CommissionAdmin]
    code: 201
    input: [name, address, rental_fee_cents, revenue_share_pct]
    output: Venue
    side_effects: ["status PROPOSED"]
  - method: GET
    path: "/api/v1/events/{id}/venues"
    description: "List venues of an event, sorted created_at ASC"
    roles: [Any]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "Venue[]"
    side_effects: []
  - method: GET
    path: "/api/v1/venues/{id}"
    description: "Get one venue"
    roles: [Any]
    code: 200
    input: []
    output: Venue
    side_effects: []
  - method: POST
    path: "/api/v1/venues/{id}/contract"
    description: "Execute venue agreement (PROPOSED -> CONTRACTED)"
    roles: [CommissionAdmin]
    code: 200
    input: [contract_uri]
    output: Venue
    side_effects: ["Venue.version +1"]
  - method: POST
    path: "/api/v1/venues/{id}/release"
    description: "Release venue (CONTRACTED -> RELEASED); blocked while active matches exist on its fields"
    roles: [CommissionAdmin]
