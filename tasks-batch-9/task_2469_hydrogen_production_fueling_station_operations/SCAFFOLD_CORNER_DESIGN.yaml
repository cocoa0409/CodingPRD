              as: SafetyOfficer
            - call: "POST /stations/${st_id}/responder-certifications"
              payload: { responder_ref: "RSP-E4-1", cert_type: "EMERGENCY_RESPONSE", valid_from: "2026-01-01", expires_on: "2027-01-01" }
              as: SafetyOfficer
            - call: "POST /stations/${st_id}/responder-certifications"
              payload: { responder_ref: "RSP-E4-2", cert_type: "EMERGENCY_RESPONSE", valid_from: "2026-01-01", expires_on: "2027-01-01" }
              as: SafetyOfficer
            - call: "GET /stations/${st_id}"
              payload: {}
              as: StationOperator
              as_user_id: "${st_id}"
              captures: { st_v1: "$.data.version" }
            - call: "POST /dispense-sessions"
              payload: { station_id: "${st_id}", vehicle_class: "TRANSIT_BUS", target_pressure_class: "H35", fill_protocol: "SAE_J2601_TABLE", planned_kg: 24.000, ambient_temp_c: -18.0, expected_station_version: "${st_v1}" }
              as: StationOperator
              as_user_id: "${st_id}"
              captures: { s1: "$.data.id" }
            - call: "POST /dispense-sessions/${s1}/fuel"
              payload: { precool_temp_achieved_c: -20.0 }
              as: StationOperator
              as_user_id: "${st_id}"
            - call: "POST /dispense-sessions/${s1}/complete"
              payload: { metered_kg: 24.000, avg_dispense_pressure_bar: 700.00, final_pressure_bar: 438.00 }
              as: StationOperator
              as_user_id: "${st_id}"
          trigger:
            - call: "POST /dispense-sessions/${s1}/void-meter"
              payload: { void_reason: "Meter under audit" }
              as: ComplianceAdmin
              as_user_id: "CA-1"
              captures: { err_early: "$.data.error_id" }
            - call: "POST /dispense-sessions/${s1}/meter-settlement"
              payload: {}
              as: ComplianceAdmin
              as_user_id: "CA-1"
            - call: "POST /dispense-sessions/${s1}/void-meter"
              payload: { void_reason: "Meter under audit" }
              as: ComplianceAdmin
              as_user_id: "CA-1"
              captures: { bs: "$.data.billing_status" }
            - call: "POST /dispense-sessions/${s1}/void-meter"
              payload: { void_reason: "Second attempt" }
              as: ComplianceAdmin
              as_user_id: "CA-1"
              captures: { err_again: "$.data.error_id" }
            - call: "GET /stations/${st_id}/inventory-ledger"
              payload: {}
              as: ProgramAuditor
              as_user_id: "PA-1"
              captures: { total: "$.total_count" }
          assert:
            - "first void while PENDING: HTTP 409 and ${err_early} == ERR_INVALID_STATE_TRANSITION; ledger still has 2 rows"
            - "after settlement the void succeeds: HTTP 200 and ${bs} == VOIDED with void_reason recorded"
            - "second void: HTTP 409 and ${err_again} == ERR_INVALID_STATE_TRANSITION"
            - "${total} == 4 - exactly one METER_CORRECTION (-0.365) and exactly one METER_VOID_REVERSAL (+0.365)"
            - "Station.${st_id}.onsite_inventory_kg == 21.600, back to the post-draw balance"
            - "the metering rollup now excludes the session: metered_kg_mtd 0.000, corrected_kg_mtd 0.000, metering_error_pct_mtd 0.000"

      - name: delivery_booking_links_station_lot_and_receiving_vessel
        claim_type: cross_reference_link
        grounds:
          - endpoints.POST_/deliveries
          - validations.priority_60
          - endpoints.GET_/deliveries
        distinguishing_aspect: |
          A Delivery is the join of three independent aggregates, and each missing leg must produce
          its OWN 404 (station, lot, vessel) rather than a generic one; once linked, the row is
          reachable from every side through the list filters and the station's inbound_planned_kg
          reflects it.
        test_recipe:
          setup:
            - "Station STN-E5 with one LOW vessel; one PRODUCED lot on a PEM asset with a covering contract."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
