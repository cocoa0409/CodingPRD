            - call: "GET /ccs/storage-projects/${proj_id}"
              payload: {}
              as: ProgramAdmin
              captures: { cumulative_restored: $.data.cumulative_stored_tonnes }
          assert:
            - "${p1_net} == 299500.000"
            - "${p2_net} == 250000.000"
            - "${reported_pre} == 550000.000"
            - "${rate_pre} == 70.00"
            - "${credit_pre} == 38500000.00"
            - "${cumulative_pre} == 549500.000"
