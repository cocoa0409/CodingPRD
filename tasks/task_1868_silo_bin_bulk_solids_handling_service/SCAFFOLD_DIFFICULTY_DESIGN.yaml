  - rule_id: resource_temporal_overlap
    instances:
      - name: technician_window_half_open_overlap
        grounds:
          - state_machines.ServiceTicket.APPROVED_to_SCHEDULED
          - errors[ERR_TECHNICIAN_DOUBLE_BOOKED]
        distinguishing_aspect: |
          Half-open interval semantics on the Technician resource: a window
          starting exactly when another ends (12:00 after 09:00-12:00) is
          adjacent and allowed; 11:30-13:00 overlaps and is rejected with
          ERR_TECHNICIAN_DOUBLE_BOOKED.
