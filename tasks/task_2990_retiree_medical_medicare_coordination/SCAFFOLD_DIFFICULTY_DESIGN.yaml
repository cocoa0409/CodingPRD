              captures: { det_at_id: $.data.id }
            - call: "POST /retiree-benefits/eligibility-determinations"
              payload: { retiree_id: "${r3_id}", plan_year_id: "${py_id}", expected_retiree_version: "${r3_v}" }
              as: EligibilityAnalyst
              as_user_id: "analyst-01"
              captures: { det_below_id: $.data.id }
          assert:
            - "AT THRESHOLD: EligibilityDetermination.${det_at_id}.age_years_at_retirement == 63"
            - "AT THRESHOLD: EligibilityDetermination.${det_at_id}.service_years == 12"
            - "AT THRESHOLD: EligibilityDetermination.${det_at_id}.points == 75"
            - "AT THRESHOLD: EligibilityDetermination.${det_at_id}.outcome == ELIGIBLE"
            - "AT THRESHOLD: EligibilityDetermination.${det_at_id}.rule_set_code == RULE_OF_75_GRANDFATHERED and grandfathered_group == GRANDFATHERED_A"
            - "ONE BELOW: EligibilityDetermination.${det_below_id}.service_years == 11, not 12, so floor division was used"
            - "ONE BELOW: EligibilityDetermination.${det_below_id}.points == 74"
            - "ONE BELOW: EligibilityDetermination.${det_below_id}.outcome == INELIGIBLE"
            - "Retiree.${r1_id}.eligibility_points == 75 and eligibility_status == ELIGIBLE"
            - "Retiree.${r3_id}.eligibility_points == 74 and eligibility_status == INELIGIBLE"
            - "Both determinations were created with HTTP 201; the INELIGIBLE outcome is a recorded result, not an error"

      - name: part_d_net_value_exactly_at_inclusive_threshold
        grounds:
          - calculations.actuarial_equivalence_test
          - validations[priority=27]
          - errors.ERR_ACTUARIAL_NET_TEST_FAILED
          - entities.PlanOption.fields.equivalence_margin_bps
          - state_machines.PlanOption.NOT_STARTED_to_ATTESTED
        distinguishing_aspect: |
          A different boundary on a different calculation, and one where the
          off-by-one straddles the success/error line rather than two recorded
          outcomes. STANDARD_PART_D_NET_VALUE_BPS is 7450 and the comparison is
          inclusive, so 7449 must raise ERR_ACTUARIAL_NET_TEST_FAILED (422)
          while 7450 must succeed with equivalence_margin_bps exactly 0 - the
          margin is signed, so an implementation that stores abs() or refuses a
          zero margin fails. The gross value is held at exactly
          STANDARD_PART_D_GROSS_VALUE_BPS 10000 in both calls, pinning a second
          inclusive comparison, and the rejected attempt must leave
          subsidy_certification_status at NOT_STARTED.
        test_recipe:
          setup:
            - "PlanYear 2027 in status OPEN."
            - "PlanOption MED-WRAP with coverage_class MEDICARE_GROUP_WRAP and subsidy_vehicle EGWP, left in status DRAFT (attestation is permitted from DRAFT)."
            - "PlanOption.subsidy_certification_status is NOT_STARTED and gross_test_passed / net_test_passed are false."
            - "Logical clock at 2026-10-20T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-20T00:00:00Z" }
              as: BenefitsAdmin
              as_user_id: "admin-01"
            - call: "POST /retiree-benefits/plan-years"
              payload: { year: 2027, open_enrollment_start: "2026-10-15T00:00:00Z", open_enrollment_end: "2026-11-15T00:00:00Z", coverage_start: "2027-01-01T00:00:00Z", hra_credit_pre_medicare_cents: 185000, hra_credit_medicare_cents: 209500, carryover_cap_pct: 0.5, discount_rate_bps: 500, assumed_annual_subsidy_cents: 240000, assumed_payment_years: 20, premium_grace_period_days: 31, reinstatement_window_days: 60, notice_lead_days: 60 }
              as: BenefitsAdmin
              as_user_id: "admin-01"
              captures: { py_id: $.data.id }
            - call: "POST /retiree-benefits/plan-years/${py_id}/status"
              payload: { to_status: "OPEN" }
              as: BenefitsAdmin
              as_user_id: "admin-01"
            - call: "POST /retiree-benefits/plan-options"
              payload: { plan_year_id: "${py_id}", plan_code: "MED-WRAP", coverage_class: "MEDICARE_GROUP_WRAP", monthly_premium_cents: 32900, requires_medicare_part_b: true, allowed_grandfather_groups: ["GRANDFATHERED_A", "TRANSITION_B"], subsidy_vehicle: "EGWP", rx_gross_value_bps: 10500, rx_net_value_bps: 7800 }
              as: BenefitsAdmin
              as_user_id: "admin-01"
              captures: { po_med_id: $.data.id }
          trigger:
            - call: "POST /retiree-benefits/plan-options/${po_med_id}/attest"
              payload: { rx_gross_value_bps: 10000, rx_net_value_bps: 7449 }
              as: Actuary
              as_user_id: "actuary-01"
            - call: "POST /retiree-benefits/plan-options/${po_med_id}/attest"
              payload: { rx_gross_value_bps: 10000, rx_net_value_bps: 7450 }
              as: Actuary
              as_user_id: "actuary-01"
          assert:
            - "ONE BELOW: the first attest returns HTTP 422 with data.error_id == ERR_ACTUARIAL_NET_TEST_FAILED"
            - "ONE BELOW: the error is not ERR_ACTUARIAL_GROSS_TEST_FAILED, because rx_gross_value_bps 10000 equals the inclusive gross threshold and therefore passes"
            - "ONE BELOW: after the rejection PlanOption.${po_med_id}.subsidy_certification_status is still NOT_STARTED, rx_net_value_bps is still 7800 and attested_by_user_id is still null"
            - "AT THRESHOLD: the second attest returns HTTP 200"
            - "AT THRESHOLD: PlanOption.${po_med_id}.gross_test_passed == true and net_test_passed == true"
            - "AT THRESHOLD: PlanOption.${po_med_id}.equivalence_margin_bps == 0"
            - "AT THRESHOLD: PlanOption.${po_med_id}.subsidy_certification_status == ATTESTED and attested_by_user_id == actuary-01"
            - "AT THRESHOLD: PlanOption.${po_med_id}.rx_gross_value_bps == 10000 and rx_net_value_bps == 7450, overwriting the 10500 / 7800 seeded on creation"

  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:

      - name: election_creation_blocked_by_uncertified_determination
        grounds:
          - validations[priority=29]
          - errors.ERR_DETERMINATION_NOT_CERTIFIED
          - state_machines.EligibilityDetermination.DRAFT_to_CERTIFIED
          - endpoints["POST /retiree-benefits/election-events"]
        distinguishing_aspect: |
          The blocking state lives on a sibling entity that the request body
          never mentions. POST /retiree-benefits/election-events carries only
          retiree_id, plan_year_id, requested_plan_option_id, event_type and
          event_date; the gate is the status of a separate
          EligibilityDetermination row that must be looked up by the
          (retiree_id, plan_year_id) pair. The retiree, the plan year and the
          plan option are all in perfectly valid states, and the determination
          already exists with outcome ELIGIBLE - only its status is DRAFT, so
          an implementation that checks outcome without checking status
          wrongly succeeds. Certifying the determination, changing nothing in
          the request, flips the identical call from 409 to 201.
        test_recipe:
          setup:
            - "PlanYear 2027 in status OPEN, logical clock 2026-10-20T00:00:00Z inside the open enrollment window."
            - "PlanOption PRE65-CORE in status ACTIVE permitting all three grandfather groups."
            - "Retiree R1 with an EligibilityDetermination for plan year 2027 in status DRAFT whose outcome is already ELIGIBLE with points 75."
            - "No other determination exists for (R1, 2027)."
