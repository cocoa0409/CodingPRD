  - section: errors
    instances:
      - name: unknown_ids_on_the_read_surface_report_their_own_not_found_codes
        claim_type: violation_to_error
        grounds:
          - errors.ERR_CUSTOMER_NOT_FOUND
          - errors.ERR_ORDER_LINE_NOT_FOUND
          - errors.ERR_REPLACEMENT_NOT_FOUND
          - errors.ERR_RATING_NOT_FOUND
          - errors.ERR_PAYOUT_NOT_FOUND
          - errors.ERR_CREDIT_ENTRY_NOT_FOUND
          - validations[priority=3]
        distinguishing_aspect: "Each detail read owns a distinct 404 code rather than a shared generic one: the same never-minted UUID answers ERR_CUSTOMER_NOT_FOUND, ERR_ORDER_LINE_NOT_FOUND, ERR_REPLACEMENT_NOT_FOUND, ERR_RATING_NOT_FOUND, ERR_PAYOUT_NOT_FOUND and ERR_CREDIT_ENTRY_NOT_FOUND on its six respective endpoints."
        test_recipe:
          setup:
            - "Empty database apart from the logical clock; the id 00000000-0000-4000-8000-00000000beef is never minted."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T08:00:00Z" }
              as: DispatchAdmin
          trigger:
            - call: "GET /customers/00000000-0000-4000-8000-00000000beef"
              payload: {}
              as: CustomerSupport
              captures: { e1: $.data.error_id }
            - call: "GET /order-lines/00000000-0000-4000-8000-00000000beef"
              payload: {}
              as: CustomerSupport
              captures: { e2: $.data.error_id }
            - call: "GET /replacement-requests/00000000-0000-4000-8000-00000000beef"
              payload: {}
              as: CustomerSupport
              captures: { e3: $.data.error_id }
            - call: "GET /shopper-ratings/00000000-0000-4000-8000-00000000beef"
              payload: {}
              as: CustomerSupport
              captures: { e4: $.data.error_id }
            - call: "GET /shopper-payouts/00000000-0000-4000-8000-00000000beef"
              payload: {}
              as: CustomerSupport
              captures: { e5: $.data.error_id }
            - call: "GET /credit-ledger-entries/00000000-0000-4000-8000-00000000beef"
              payload: {}
              as: CustomerSupport
              captures: { e6: $.data.error_id }
          assert:
            - "All six calls return HTTP 404 with response_type error"
            - "${e1} == ERR_CUSTOMER_NOT_FOUND, ${e2} == ERR_ORDER_LINE_NOT_FOUND, ${e3} == ERR_REPLACEMENT_NOT_FOUND"
            - "${e4} == ERR_RATING_NOT_FOUND, ${e5} == ERR_PAYOUT_NOT_FOUND, ${e6} == ERR_CREDIT_ENTRY_NOT_FOUND"
            - "Every error envelope carries meta.api_request_id and meta.api_request_timestamp plus data.error_id and data.message"

      - name: batch_membership_refusals_name_the_specific_conflict
        claim_type: violation_to_error
        grounds:
          - errors.ERR_ORDER_NOT_PLACED
          - errors.ERR_ORDER_ALREADY_BATCHED
          - errors.ERR_BATCH_NOT_BUILDING
          - validations[priority=7]
        distinguishing_aspect: "POST /batches/{id}/orders distinguishes three refusals on the same route: a DRAFT order gives ERR_ORDER_NOT_PLACED, an order that already has a membership row gives ERR_ORDER_ALREADY_BATCHED (the priority-7 rule, ahead of the order-state gate it also violates), and an OFFERED target gives ERR_BATCH_NOT_BUILDING."
        test_recipe:
          setup:
            - "Retailer R1 (markup 0.15, concurrent_shopper_cap 5) with I1 EACH in_store 400 -> 460 unit_weight 1.0; Customer C1; Shopper S1 in SF-42 capacity 10."
            - "Order OD has one line and was never submitted (DRAFT). Orders OP1 and OP2 are submitted (PLACED)."
            - "Batch B1 (SF-42, window 08:00-11:00) holds OP1 and has been dispatched, so its status is OFFERED. Batch B2 (SF-42, same window) is still BUILDING and empty."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T08:00:00Z" }
              as: DispatchAdmin
            - call: "POST /retailers"
              payload: { legal_name: "Bay Fresh Market LLC", store_code: "BFM-01", catalog_markup_pct: 0.15, concurrent_shopper_cap: 5 }
              as: DispatchAdmin
              captures: { r1: $.data.id }
            - call: "POST /catalog-items"
              payload: { retailer_id: "${r1}", sku: "SKU-EACH-EBT", name: "Canned Beans", pricing_unit: "EACH", in_store_price_cents: 400, is_ebt_eligible: true, unit_weight_lb: 1.0 }
              as: RetailerManager
              as_user_id: "${r1}"
              captures: { i1: $.data.id }
            - call: "POST /customers"
              payload: { display_name: "Dana Ortiz", card_last4: "4242" }
              as: CustomerSupport
              captures: { c1: $.data.id }
            - call: "POST /shoppers"
              payload: { display_name: "Sam Reyes", service_area_code: "SF-42", vehicle_capacity_units: 10 }
              as: DispatchAdmin
              captures: { s1: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${c1}", retailer_id: "${r1}", delivery_distance_mi: 3.0, delivery_deadline: "2026-08-01T11:00:00Z", ebt_requested: false, tip_amount_cents: 0 }
              as: Customer
              as_user_id: "${c1}"
              captures: { od: $.data.id }
            - call: "POST /orders/${od}/lines"
              payload: { catalog_item_id: "${i1}", requested_qty: 1 }
              as: Customer
              as_user_id: "${c1}"
            - call: "POST /orders"
              payload: { customer_id: "${c1}", retailer_id: "${r1}", delivery_distance_mi: 3.0, delivery_deadline: "2026-08-01T11:00:00Z", ebt_requested: false, tip_amount_cents: 0 }
              as: Customer
              as_user_id: "${c1}"
              captures: { op1: $.data.id }
            - call: "POST /orders/${op1}/lines"
              payload: { catalog_item_id: "${i1}", requested_qty: 1 }
              as: Customer
              as_user_id: "${c1}"
            - call: "POST /orders/${op1}/submit"
              payload: {}
              as: Customer
              as_user_id: "${c1}"
            - call: "POST /orders"
              payload: { customer_id: "${c1}", retailer_id: "${r1}", delivery_distance_mi: 3.0, delivery_deadline: "2026-08-01T11:00:00Z", ebt_requested: false, tip_amount_cents: 0 }
              as: Customer
              as_user_id: "${c1}"
              captures: { op2: $.data.id }
            - call: "POST /orders/${op2}/lines"
              payload: { catalog_item_id: "${i1}", requested_qty: 1 }
              as: Customer
              as_user_id: "${c1}"
            - call: "POST /orders/${op2}/submit"
              payload: {}
              as: Customer
              as_user_id: "${c1}"
            - call: "POST /batches"
              payload: { service_area_code: "SF-42", shop_window_start: "2026-08-01T08:00:00Z", shop_window_end: "2026-08-01T11:00:00Z", tier_access_floor: "PROBATION" }
              as: DispatchAdmin
              captures: { b1: $.data.id, b1_v0: $.data.version }
            - call: "POST /batches/${b1}/orders"
              payload: { order_id: "${op1}", expected_batch_version: "${b1_v0}" }
              as: DispatchAdmin
            - call: "POST /batches/${b1}/dispatch"
              payload: {}
              as: DispatchAdmin
            - call: "GET /batches/${b1}"
              payload: {}
              as: DispatchAdmin
              captures: { b1_v1: $.data.version }
            - call: "POST /batches"
              payload: { service_area_code: "SF-42", shop_window_start: "2026-08-01T08:00:00Z", shop_window_end: "2026-08-01T11:00:00Z", tier_access_floor: "PROBATION" }
              as: DispatchAdmin
              captures: { b2: $.data.id, b2_v: $.data.version }
          trigger:
            - call: "POST /batches/${b2}/orders"
              payload: { order_id: "${od}", expected_batch_version: "${b2_v}" }
              as: DispatchAdmin
              captures: { e1: $.data.error_id }
            - call: "POST /batches/${b2}/orders"
              payload: { order_id: "${op1}", expected_batch_version: "${b2_v}" }
              as: DispatchAdmin
              captures: { e2: $.data.error_id }
            - call: "POST /batches/${b1}/orders"
              payload: { order_id: "${op2}", expected_batch_version: "${b1_v1}" }
              as: DispatchAdmin
              captures: { e3: $.data.error_id }
          assert:
            - "${e1} == ERR_ORDER_NOT_PLACED with HTTP 409, and Order.${od}.fulfillment_status is still DRAFT"
            - "${e2} == ERR_ORDER_ALREADY_BATCHED with HTTP 409 - not ERR_ORDER_NOT_PLACED, even though OP1 sits in IN_BATCH and violates that gate too"
            - "${e3} == ERR_BATCH_NOT_BUILDING with HTTP 409, and Order.${op2}.fulfillment_status is still PLACED"
            - "All three refusals left the OCC versions alone: GET /batches/${b2} still reports version ${b2_v} and GET /batches/${b1} still reports version ${b1_v1}"
            - "GET /batches/${b2}/batch-orders returns total_count == 0 and GET /batches/${b1}/batch-orders returns total_count == 1"

      - name: dispatch_and_reassign_refuse_on_emptiness_and_state
        claim_type: violation_to_error
        grounds:
          - errors.ERR_BATCH_EMPTY
          - errors.ERR_BATCH_NOT_ABANDONED
          - validations[priority=9]
        distinguishing_aspect: "With no Shopper rows in the database at all, an empty batch still answers ERR_BATCH_EMPTY (422) rather than the priority-14 ERR_NO_ELIGIBLE_SHOPPER, and reassigning a BUILDING batch answers ERR_BATCH_NOT_ABANDONED (409)."
