  # ------------------------------------------------------------ Consistency model
  - section: consistency_model
    instances:
      - name: immediate_visibility_after_mutation
        claim_type: immediate
        grounds:
          - complexity_profile
        distinguishing_aspect: "Immediate consistency: the mutation response AND a subsequent GET both reflect the change in the same logical instant (no lag) — shown on scheme approval status and the program's approved_scheme_id pin."
        test_recipe:
          setup: ["program QUOTED; scheme SUBMITTED"]
          setup_api_calls:
            - { call: "POST /completion/customers", payload: { name: "Apex Aviation LLC", contact_email: "ops@apex.example" }, as: CenterAdmin, captures: { cust_id: $.data.id } }
            - { call: "POST /completion/aircraft", payload: { customer_id: "${cust_id}", tail_number: "N1869A", model: "G650", max_delta_lbs: 50.0 }, as: CenterAdmin, captures: { ac_id: $.data.id } }
            - { call: "POST /completion/programs", payload: { aircraft_id: "${ac_id}", customer_id: "${cust_id}", base_price_cents: 12345673, daily_penalty_rate_cents: 150000, penalty_cap_pct: 0.10, contractual_delivery_date: "2026-09-01" }, as: ProgramManager, captures: { prog_id: $.data.id, prog_v0: $.data.version } }
            - { call: "POST /completion/paint-schemes", payload: { program_id: "${prog_id}", drawing_ref: "DWG-1869-A", painted_area_sqft: 2400, coat_count: 2, stripe_pct: 0.10 }, as: DesignLead, captures: { sch_id: $.data.id } }
            - { call: "POST /completion/paint-schemes/${sch_id}/submit", payload: {}, as: DesignLead }
          trigger:
            - { call: "POST /completion/paint-schemes/${sch_id}/approve", payload: { expected_program_version: "${prog_v0}" }, as: CustomerRep, as_user_id: "${cust_id}", captures: { st: $.data.status } }
            - { call: "GET /completion/programs/${prog_id}", as: ProgramManager, captures: { pin: $.data.approved_scheme_id, v: $.data.version } }
          assert:
            - "st == APPROVED in the mutation response itself"
            - "immediate GET: pin == sch_id and v == 2 (prog_v0 was 1; approve bumped it exactly once)"
