  - rule_id: boundary_precision_check
    instances:

      - name: pace_warning_third_crosses_penalty_threshold
        grounds:
          - calculations.round_pace_penalty
          - entities.Round.fields.pace_warning_count
          - entities.Round.fields.pace_penalty_strokes
          - endpoints.POST_rounds_roundId_pace_observations
        distinguishing_aspect: |
          Exact threshold crossing at PACE_FREE_WARNINGS = 2. The formula is
          max(0, pace_warning_count - 2), so warning 2 must still cost ZERO strokes and warning 3
          must cost exactly ONE. An off-by-one implementation using >= instead of > penalises the
          second warning; one that only penalises above three misses the third. The observations
          also carry minutes_behind 5, strictly below PACE_BREACH_MINUTES = 15, so the timing
          component must stay 0 and the total must be 1, not 3.
        test_recipe:
          setup:
            - "The standard two-member REGIONAL 2-round tournament driven to IN_PROGRESS with both entries ACCEPTED and PAID; m1's round 1 is SCHEDULED with no score yet."
            - "Two WARNING observations at minutes_behind 5 are recorded first, and the second one's response is captured to prove the free allowance is still intact."
