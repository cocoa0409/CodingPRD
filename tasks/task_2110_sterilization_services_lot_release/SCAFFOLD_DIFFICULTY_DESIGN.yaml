  # ===========================================================================
  # Rule 9 - Compensating-action invariants across different conserved quantities
  # ===========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: abort_restores_abated_eto_mass_ledger_and_reinstates_permit
        grounds:
          - calculations.emission_fee_usd
          - state_machines.Cycle.RUNNING_to_CANCELLED
          - state_machines.EmissionPermit.SUSPENDED_to_ACTIVE
          - entities.EmissionPermit.fields.consumed_kg_ytd
          - entities.EmissionPermit.fields.total_emission_fee_usd
          - invariants.abated_eto_mass_ledger
        distinguishing_aspect: |
          Conserved quantity #1 is a CONTINUOUS mass ledger in kilograms:
          EmissionPermit.consumed_kg_ytd must equal the sum of abated_eto_kg over
          non-CANCELLED cycles under the permit. Starting a cycle that abates
          exactly 48.000 kg against a 48.0 kg allowance drives the permit to
          SUSPENDED; aborting it credits back exactly 48.000 kg and 576.00 USD,
          returning consumed_kg_ytd to 0.0 and the permit to ACTIVE with zero
          drift.
        test_recipe:
          setup:
            - "Permit AP-2026 has annual_allowance_kg exactly 48.0; chamber CH-E1 has abatement_efficiency_pct 96.0."
            - "Cycle C-A with raw_eto_charge_kg 1200.0 was signed off READY and then STARTED, so it is RUNNING with abated_eto_kg 48.000 and emission_fee_usd 576.00."
            - "The start left consumed_kg_ytd at exactly the allowance, so the permit auto-transitioned ACTIVE -> SUSPENDED."
          setup_api_calls:
            - call: "POST /sterilization/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: RegulatoryAdmin
            - call: "POST /sterilization/customers"
