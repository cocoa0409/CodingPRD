      - name: loaner_selector_ranks_grade_then_count_then_created_at
        claim_type: Correct Result
        grounds:
          - calculations.loaner_unit_selection
          - entities.LoanerAssignment.fields.selected_by
        distinguishing_aspect: |
          With loaner_unit_id omitted the server must run the full eligibility +
          ranking policy: LN-D is filtered out by certification_valid_until
          2026-08-11 < window_end 2026-08-12, LN-B loses on condition_grade even
          though its assignment_count is lowest, and the LN-C/LN-A tie on grade A
          plus assignment_count 0 is broken by created_at ASC — so LN-C (created
          first) wins and selected_by is SERVER_SELECTED.
        test_recipe:
          setup:
            - "one account with a waiver on file and four LoanerUnits of the same model"
            - "LN-C grade A created first, LN-A grade A created second, LN-B grade B, LN-D grade A but certification lapses 2026-08-11"
          setup_api_calls:
            - *k_clock
            - *k_model
            - *k_acct
            - *k_waiver
            - call: "POST /loaner-units"
              payload: { model_spec_id: "${model_id}", asset_tag: "LN-C", condition_grade: "A", certification_valid_until: "2026-12-31T00:00:00Z" }
              as: PlantManager
              captures: { loaner_c: $.data.id }
            - call: "POST /loaner-units"
              payload: { model_spec_id: "${model_id}", asset_tag: "LN-A", condition_grade: "A", certification_valid_until: "2026-12-31T00:00:00Z" }
              as: PlantManager
              captures: { loaner_a: $.data.id }
            - call: "POST /loaner-units"
              payload: { model_spec_id: "${model_id}", asset_tag: "LN-B", condition_grade: "B", certification_valid_until: "2026-12-31T00:00:00Z" }
              as: PlantManager
              captures: { loaner_b: $.data.id }
            - call: "POST /loaner-units"
              payload: { model_spec_id: "${model_id}", asset_tag: "LN-D", condition_grade: "A", certification_valid_until: "2026-08-11T00:00:00Z" }
              as: PlantManager
              captures: { loaner_d: $.data.id }
          trigger:
            - call: "POST /loaner-assignments"
              payload: { customer_account_id: "${acct_id}", requested_model_spec_id: "${model_id}", window_start: "2026-08-05T00:00:00Z", window_end: "2026-08-12T00:00:00Z" }
              as: IntakeClerk
