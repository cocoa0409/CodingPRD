  # =========================================================================
  # Rule 8 — Resource temporal-overlap conflicts across different interval semantics
  # =========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: covered_period_half_open_adjacent_ok_overlap_rejected
        grounds:
          - validations[priority=38]
          - errors.ERR_COVERED_PERIOD_OVERLAP
          - entities.CertificationLine.fields.covered_period_start
          - entities.CertificationLine.fields.covered_period_end
        distinguishing_aspect: |
          Half-open [start, end) interval semantics on the LoanAccount resource: a new line whose
          covered window starts exactly at an existing line's end instant is ACCEPTED (touching
          endpoints do not intersect), while a window that starts one week before that end instant is
          rejected with ERR_COVERED_PERIOD_OVERLAP.
        test_recipe:
          setup:
            - "One PlanYear 2026 in status OPEN."
            - "One Employee with one payroll period and one VERIFIED LoanAccount."
            - "One DRAFT LoanCertification already carrying a 10000-cent line whose covered window is [2026-03-01T00:00:00Z, 2026-04-01T00:00:00Z)."
          setup_api_calls:
            - call: "POST /plan-years"
              payload: { year: 2026, period_start: "2026-01-01T00:00:00Z", period_end: "2026-12-31T23:59:59Z", certification_window_open: "2026-01-01T00:00:00Z", certification_deadline: "2026-12-31T23:59:59Z" }
              as: BenefitsAdministrator
              captures: { py_id: $.data.id }
            - call: "POST /plan-years/${py_id}/status"
              payload: { to_status: "OPEN" }
              as: BenefitsAdministrator
            - call: "POST /employees"
              payload: { external_id: "E-007", hire_date: "2019-01-01T00:00:00Z", prior_year_compensation_cents: 6000000, vesting_service_months: 72 }
              as: BenefitsAdministrator
              captures: { emp_id: $.data.id }
            - call: "POST /payroll-periods"
              payload: { plan_year_id: "${py_id}", period_number: 1, start_date: "2026-01-01T00:00:00Z", end_date: "2026-01-31T23:59:59Z", pay_date: "2026-02-05T00:00:00Z" }
              as: PayrollOperator
              captures: { pp1_id: $.data.id }
            - call: "POST /contribution-records"
              payload: { employee_id: "${emp_id}", payroll_period_id: "${pp1_id}", eligible_compensation_cents: 1000000, elective_deferral_cents: 20000 }
              as: PayrollOperator
            - call: "POST /loan-accounts"
              payload: { employee_id: "${emp_id}", servicer_name: "Nelnet", account_last4: "4321", original_principal_cents: 2500000 }
              as: Employee
              as_user_id: "${emp_id}"
              captures: { la_id: $.data.id }
            - call: "POST /loan-accounts/${la_id}/verification"
              payload: { to_status: "VERIFIED", evidence_ref: "STMT-2026-03" }
              as: BenefitsAdministrator
            - call: "GET /employees/${emp_id}"
              payload: {}
              as: BenefitsAdministrator
              captures: { emp_v: $.data.version }
            - call: "POST /loan-certifications"
              payload: { employee_id: "${emp_id}", plan_year_id: "${py_id}", certification_method: "SERVICER_STATEMENT", expected_employee_version: "${emp_v}" }
              as: Employee
              as_user_id: "${emp_id}"
              captures: { cert_id: $.data.id }
            - call: "POST /loan-certifications/${cert_id}/lines"
              payload: { loan_account_id: "${la_id}", payment_date: "2026-03-15T00:00:00Z", amount_cents: 10000, covered_period_start: "2026-03-01T00:00:00Z", covered_period_end: "2026-04-01T00:00:00Z" }
              as: Employee
              as_user_id: "${emp_id}"
              captures: { line_a_id: $.data.id }
          trigger:
            - call: "POST /loan-certifications/${cert_id}/lines"
              payload: { loan_account_id: "${la_id}", payment_date: "2026-04-15T00:00:00Z", amount_cents: 10000, covered_period_start: "2026-04-01T00:00:00Z", covered_period_end: "2026-05-01T00:00:00Z" }
              as: Employee
              as_user_id: "${emp_id}"
              captures: { line_b_id: $.data.id }
            - call: "POST /loan-certifications/${cert_id}/lines"
              payload: { loan_account_id: "${la_id}", payment_date: "2026-04-20T00:00:00Z", amount_cents: 10000, covered_period_start: "2026-03-25T00:00:00Z", covered_period_end: "2026-04-10T00:00:00Z" }
              as: Employee
              as_user_id: "${emp_id}"
              captures: { err: $.data.error_id }
          assert:
            - "CertificationLine.${line_b_id}.covered_period_start == 2026-04-01T00:00:00Z  # adjacency at the exact endpoint is accepted"
            - "err == ERR_COVERED_PERIOD_OVERLAP"
            - "HTTP status == 409 on the third line"
            - "LoanCertification.${cert_id}.certified_total_cents == 20000"
            - "exactly two CertificationLine rows with certification_id == ${cert_id}"

      - name: leave_event_closed_interval_with_buffer_conflict
        grounds:
          - validations[priority=42]
          - errors.ERR_LEAVE_WINDOW_CONFLICT
          - calculations.unpaid_leave_days
          - entities.PlanYear.fields.leave_merge_buffer_days
          - entities.LeaveEvent.fields.day_count
        distinguishing_aspect: |
          Closed [start, end] interval semantics inflated by a 14-day buffer on the Employee resource
          — different interval arithmetic from the half-open, buffer-free CertificationLine rule: a new
          leave starting exactly 14 days after an existing leave's end (2026-04-14) collides, while
          starting 15 days after (2026-04-15) does not.
        test_recipe:
          setup:
            - "One PlanYear 2026 in status OPEN with leave_merge_buffer_days 14 and unpaid_leave_day_cap 180."
            - "One Employee with one existing UNPAID LeaveEvent spanning 2026-03-01 to 2026-03-31 inclusive (31 days)."
            - "Logical clock at its default 2026-08-01T00:00:00Z, outside every leave interval, so employment_status stays ACTIVE."
          setup_api_calls:
            - call: "POST /plan-years"
              payload: { year: 2026, period_start: "2026-01-01T00:00:00Z", period_end: "2026-12-31T23:59:59Z", certification_window_open: "2026-01-01T00:00:00Z", certification_deadline: "2026-12-31T23:59:59Z", unpaid_leave_day_cap: 180, leave_merge_buffer_days: 14 }
              as: BenefitsAdministrator
              captures: { py_id: $.data.id }
            - call: "POST /plan-years/${py_id}/status"
              payload: { to_status: "OPEN" }
              as: BenefitsAdministrator
            - call: "POST /employees"
              payload: { external_id: "E-008", hire_date: "2019-01-01T00:00:00Z", prior_year_compensation_cents: 6000000, vesting_service_months: 72 }
              as: BenefitsAdministrator
              captures: { emp_id: $.data.id }
            - call: "POST /leave-events"
              payload: { employee_id: "${emp_id}", leave_type: "UNPAID", start_date: "2026-03-01T00:00:00Z", end_date: "2026-03-31T00:00:00Z" }
              as: BenefitsAdministrator
              captures: { le1_id: $.data.id, le1_days: $.data.day_count }
          trigger:
            - call: "POST /leave-events"
              payload: { employee_id: "${emp_id}", leave_type: "UNPAID", start_date: "2026-04-14T00:00:00Z", end_date: "2026-04-30T00:00:00Z" }
              as: BenefitsAdministrator
              captures: { err: $.data.error_id }
            - call: "POST /leave-events"
              payload: { employee_id: "${emp_id}", leave_type: "UNPAID", start_date: "2026-04-15T00:00:00Z", end_date: "2026-04-30T00:00:00Z" }
              as: BenefitsAdministrator
              captures: { le2_id: $.data.id, le2_days: $.data.day_count }
          assert:
            - "le1_days == 31"
            - "err == ERR_LEAVE_WINDOW_CONFLICT  # 2026-04-14 == 2026-03-31 + 14 buffer days, equality collides"
            - "HTTP status == 409 on the 2026-04-14 attempt"
            - "le2_days == 16"
            - "exactly two LeaveEvent rows with employee_id == ${emp_id}"
            - "Employee.${emp_id}.unpaid_leave_days_ytd == 47  # the two spans do not merge, 31 + 16"
            - "Employee.${emp_id}.employment_status == ACTIVE"

  # =========================================================================
  # Rule 9 — Compensating-action invariants across different conserved quantities
  # =========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: void_after_accept_restores_plan_year_funded_total
        grounds:
          - state_machines.LoanCertification.AUDIT_HOLD_to_VOIDED
          - state_machines.LoanCertification.SUBMITTED_to_ACCEPTED
          - entities.PlanYear.fields.total_qslp_match_funded_cents
          - entities.CorrectionAdjustment.fields.reason_code
          - validations[priority=31]
        distinguishing_aspect: |
          Conserved quantity Q1 = sum(MatchAllocation.amount_cents where funding_status IN
          {SCHEDULED, FUNDED}) + sum(CorrectionAdjustment.amount_cents where reason_code ==
          TRUE_UP_RECOUPMENT), surfaced as PlanYear.total_qslp_match_funded_cents: ACCEPT raises it
          from 0 to 20000 and the compensating audit VOID returns it to exactly 0 with no drift.
        test_recipe:
          setup:
            - "One PlanYear 2026 in status OPEN with an EFFECTIVE PlanAmendment; total_qslp_match_funded_cents is 0 before the ACCEPT."
            - "One Employee with one payroll period of 1000000 cents compensation and 20000 cents deferral, so remaining_qslp_space_cents is 2280000 before submit."
            - "One VERIFIED LoanAccount and one LoanCertification accepted by X-User-ID admin-1, producing one 20000-cent MIRROR allocation SCHEDULED into a PENDING FundingBatch."
            - "The accepted claim then placed on AUDIT_HOLD by the ComplianceAuditor."
          setup_api_calls:
            - call: "POST /plan-years"
              payload: { year: 2026, period_start: "2026-01-01T00:00:00Z", period_end: "2026-12-31T23:59:59Z", certification_window_open: "2026-01-01T00:00:00Z", certification_deadline: "2026-12-31T23:59:59Z", annual_deferral_limit_cents: 2300000 }
              as: BenefitsAdministrator
              captures: { py_id: $.data.id }
            - call: "POST /plan-years/${py_id}/status"
              payload: { to_status: "OPEN" }
              as: BenefitsAdministrator
            - call: "POST /plan-amendments"
              payload: { plan_year_id: "${py_id}", document_ref: "AMD-2026-QSLP-5", effective_date: "2026-01-01T00:00:00Z" }
              as: BenefitsAdministrator
              captures: { amd_id: $.data.id }
            - call: "POST /plan-amendments/${amd_id}/status"
              payload: { to_status: "ADOPTED" }
              as: BenefitsAdministrator
            - call: "POST /plan-amendments/${amd_id}/status"
              payload: { to_status: "NOTICE_SENT", notice_channel: "EMAIL" }
              as: BenefitsAdministrator
            - call: "POST /plan-amendments/${amd_id}/status"
              payload: { to_status: "EFFECTIVE" }
              as: BenefitsAdministrator
            - call: "POST /employees"
              payload: { external_id: "E-009", hire_date: "2019-01-01T00:00:00Z", prior_year_compensation_cents: 6000000, vesting_service_months: 72 }
              as: BenefitsAdministrator
              captures: { emp_id: $.data.id }
            - call: "POST /payroll-periods"
              payload: { plan_year_id: "${py_id}", period_number: 1, start_date: "2026-01-01T00:00:00Z", end_date: "2026-01-31T23:59:59Z", pay_date: "2026-02-05T00:00:00Z" }
              as: PayrollOperator
              captures: { pp1_id: $.data.id }
            - call: "POST /contribution-records"
              payload: { employee_id: "${emp_id}", payroll_period_id: "${pp1_id}", eligible_compensation_cents: 1000000, elective_deferral_cents: 20000 }
              as: PayrollOperator
            - call: "POST /loan-accounts"
              payload: { employee_id: "${emp_id}", servicer_name: "Nelnet", account_last4: "4321", original_principal_cents: 2500000 }
              as: Employee
              as_user_id: "${emp_id}"
              captures: { la_id: $.data.id }
            - call: "POST /loan-accounts/${la_id}/verification"
              payload: { to_status: "VERIFIED", evidence_ref: "STMT-2026-03" }
              as: BenefitsAdministrator
            - call: "GET /employees/${emp_id}"
              payload: {}
              as: BenefitsAdministrator
              captures: { emp_v: $.data.version, space_pre_submit: $.data.remaining_qslp_space_cents }
            - call: "POST /loan-certifications"
              payload: { employee_id: "${emp_id}", plan_year_id: "${py_id}", certification_method: "SERVICER_STATEMENT", expected_employee_version: "${emp_v}" }
              as: Employee
              as_user_id: "${emp_id}"
              captures: { cert_id: $.data.id }
            - call: "POST /loan-certifications/${cert_id}/lines"
              payload: { loan_account_id: "${la_id}", payment_date: "2026-03-15T00:00:00Z", amount_cents: 30000, covered_period_start: "2026-03-01T00:00:00Z", covered_period_end: "2026-04-01T00:00:00Z" }
              as: Employee
              as_user_id: "${emp_id}"
            - call: "POST /loan-certifications/${cert_id}/submit"
              payload: {}
              as: Employee
              as_user_id: "${emp_id}"
            - call: "POST /funding-batches"
              payload: { plan_year_id: "${py_id}", payroll_period_id: "${pp1_id}" }
              as: PayrollOperator
              captures: { fb1_id: $.data.id }
            - call: "POST /loan-certifications/${cert_id}/decision"
              payload: { decision: "ACCEPT" }
              as: BenefitsAdministrator
              as_user_id: "admin-1"
            - call: "GET /plan-years/${py_id}"
              payload: {}
              as: BenefitsAdministrator
              captures: { q1_after_accept: $.data.total_qslp_match_funded_cents }
            - call: "GET /match-allocations"
              payload: { certification_id: "${cert_id}" }
              as: BenefitsAdministrator
              captures: { alloc_id: "$.data[0].id", alloc_amount: "$.data[0].amount_cents" }
            - call: "POST /loan-certifications/${cert_id}/audit-hold"
              payload: { reason: "servicer statement authenticity under review" }
              as: ComplianceAuditor
              as_user_id: "auditor-9"
          trigger:
            - call: "POST /loan-certifications/${cert_id}/audit-release"
              payload: { resolution: "VOID", note: "statement proved not authentic" }
              as: ComplianceAuditor
              as_user_id: "auditor-9"
              captures: { cert_status_after: $.data.status }
            - call: "GET /plan-years/${py_id}"
              payload: {}
              as: BenefitsAdministrator
              captures: { q1_after_void: $.data.total_qslp_match_funded_cents }
            - call: "GET /correction-adjustments"
              payload: { match_allocation_id: "${alloc_id}" }
              as: BenefitsAdministrator
              captures: { adj_reason: "$.data[0].reason_code", adj_amount: "$.data[0].amount_cents" }
            - call: "GET /funding-batches/${fb1_id}"
              payload: {}
              as: PayrollOperator
              captures: { fb_total_after: $.data.total_allocated_cents, fb_count_after: $.data.allocation_count }
          assert:
            - "space_pre_submit == 2280000"
            - "alloc_amount == 20000"
            - "q1_after_accept == 20000"
            - "cert_status_after == VOIDED"
            - "q1_after_void == 0  # conserved quantity Q1 returned exactly to its pre-ACCEPT value"
            - "MatchAllocation.${alloc_id}.funding_status == REVERSED"
            - "adj_reason == CERTIFICATION_VOID"
            - "adj_amount == -20000"
            - "exactly one CorrectionAdjustment with match_allocation_id == ${alloc_id}"
            - "fb_total_after == 0"
            - "fb_count_after == 0"
            - "Employee.${emp_id}.remaining_qslp_space_cents == 2280000"

      - name: return_after_submit_restores_remaining_qslp_space
        grounds:
          - state_machines.LoanCertification.DRAFT_to_SUBMITTED
          - state_machines.LoanCertification.SUBMITTED_to_RETURNED
          - calculations.employee_remaining_qslp_space
          - entities.Employee.fields.remaining_qslp_space_cents
        distinguishing_aspect: |
          A different conserved quantity Q2 = max(annual_deferral_limit_cents - ytd_deferral_cents -
          sum(certified_total_cents of claims in {SUBMITTED, ACCEPTED, AUDIT_HOLD}), 0), surfaced as
          Employee.remaining_qslp_space_cents — a statutory-room reservation rather than a funded
          money total: submit drops it 2280000 -> 2250000 and the compensating RETURN restores exactly
          2280000.
        test_recipe:
          setup:
            - "One PlanYear 2026 in status OPEN with annual_deferral_limit_cents 2300000 and an EFFECTIVE PlanAmendment."
            - "One Employee with one payroll period of 1000000 cents compensation and 20000 cents elective deferral, so remaining_qslp_space_cents is 2280000."
            - "One VERIFIED LoanAccount and one DRAFT LoanCertification carrying a single 30000-cent line."
          setup_api_calls:
            - call: "POST /plan-years"
              payload: { year: 2026, period_start: "2026-01-01T00:00:00Z", period_end: "2026-12-31T23:59:59Z", certification_window_open: "2026-01-01T00:00:00Z", certification_deadline: "2026-12-31T23:59:59Z", annual_deferral_limit_cents: 2300000 }
              as: BenefitsAdministrator
              captures: { py_id: $.data.id }
            - call: "POST /plan-years/${py_id}/status"
              payload: { to_status: "OPEN" }
              as: BenefitsAdministrator
            - call: "POST /plan-amendments"
              payload: { plan_year_id: "${py_id}", document_ref: "AMD-2026-QSLP-6", effective_date: "2026-01-01T00:00:00Z" }
              as: BenefitsAdministrator
              captures: { amd_id: $.data.id }
            - call: "POST /plan-amendments/${amd_id}/status"
              payload: { to_status: "ADOPTED" }
              as: BenefitsAdministrator
            - call: "POST /plan-amendments/${amd_id}/status"
              payload: { to_status: "NOTICE_SENT", notice_channel: "EMAIL" }
              as: BenefitsAdministrator
            - call: "POST /plan-amendments/${amd_id}/status"
              payload: { to_status: "EFFECTIVE" }
              as: BenefitsAdministrator
            - call: "POST /employees"
              payload: { external_id: "E-010", hire_date: "2019-01-01T00:00:00Z", prior_year_compensation_cents: 6000000, vesting_service_months: 72 }
              as: BenefitsAdministrator
              captures: { emp_id: $.data.id }
            - call: "POST /payroll-periods"
              payload: { plan_year_id: "${py_id}", period_number: 1, start_date: "2026-01-01T00:00:00Z", end_date: "2026-01-31T23:59:59Z", pay_date: "2026-02-05T00:00:00Z" }
              as: PayrollOperator
              captures: { pp1_id: $.data.id }
            - call: "POST /contribution-records"
              payload: { employee_id: "${emp_id}", payroll_period_id: "${pp1_id}", eligible_compensation_cents: 1000000, elective_deferral_cents: 20000 }
              as: PayrollOperator
            - call: "POST /loan-accounts"
              payload: { employee_id: "${emp_id}", servicer_name: "Nelnet", account_last4: "4321", original_principal_cents: 2500000 }
              as: Employee
              as_user_id: "${emp_id}"
              captures: { la_id: $.data.id }
            - call: "POST /loan-accounts/${la_id}/verification"
              payload: { to_status: "VERIFIED", evidence_ref: "STMT-2026-03" }
              as: BenefitsAdministrator
            - call: "GET /employees/${emp_id}"
              payload: {}
              as: BenefitsAdministrator
              captures: { emp_v: $.data.version, q2_before_submit: $.data.remaining_qslp_space_cents }
            - call: "POST /loan-certifications"
              payload: { employee_id: "${emp_id}", plan_year_id: "${py_id}", certification_method: "SERVICER_STATEMENT", expected_employee_version: "${emp_v}" }
              as: Employee
              as_user_id: "${emp_id}"
              captures: { cert_id: $.data.id }
            - call: "POST /loan-certifications/${cert_id}/lines"
              payload: { loan_account_id: "${la_id}", payment_date: "2026-03-15T00:00:00Z", amount_cents: 30000, covered_period_start: "2026-03-01T00:00:00Z", covered_period_end: "2026-04-01T00:00:00Z" }
              as: Employee
              as_user_id: "${emp_id}"
          trigger:
            - call: "POST /loan-certifications/${cert_id}/submit"
              payload: {}
              as: Employee
              as_user_id: "${emp_id}"
            - call: "GET /employees/${emp_id}"
              payload: {}
              as: BenefitsAdministrator
              captures: { q2_after_submit: $.data.remaining_qslp_space_cents }
            - call: "POST /loan-certifications/${cert_id}/decision"
              payload: { decision: "RETURN", reason: "payment allocation letter missing" }
              as: BenefitsAdministrator
              as_user_id: "admin-1"
              captures: { cert_status_after: $.data.status, rc_after: $.data.return_count }
            - call: "GET /employees/${emp_id}"
              payload: {}
              as: BenefitsAdministrator
              captures: { q2_after_return: $.data.remaining_qslp_space_cents }
          assert:
            - "q2_before_submit == 2280000"
            - "q2_after_submit == 2250000  # the SUBMITTED claim reserves its 30000-cent certified total"
            - "cert_status_after == RETURNED"
            - "rc_after == 1"
            - "q2_after_return == 2280000  # conserved quantity Q2 returned exactly to its pre-submit value"
            - "no MatchAllocation exists with certification_id == ${cert_id}"
            - "PlanYear.${py_id}.total_qslp_match_funded_cents == 0"
