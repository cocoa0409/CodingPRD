  - { id: ERR_NOT_RESOURCE_OWNER, http: 403, condition: "entity_backed Seller/Buyer acting on a resource they do not own" }
  - { id: ERR_SALE_NOT_FOUND, http: 404, condition: "saleId does not exist" }
  - { id: ERR_LANE_NOT_FOUND, http: 404, condition: "laneId does not exist" }
  - { id: ERR_SELLER_NOT_FOUND, http: 404, condition: "sellerId does not exist" }
  - { id: ERR_BUYER_NOT_FOUND, http: 404, condition: "buyerId does not exist" }
  - { id: ERR_CONSIGNMENT_NOT_FOUND, http: 404, condition: "consignmentId does not exist" }
  - { id: ERR_CONDITION_REPORT_NOT_FOUND, http: 404, condition: "conditionReportId does not exist" }
  - { id: ERR_LOT_NOT_FOUND, http: 404, condition: "lotId does not exist" }
  - { id: ERR_BID_NOT_FOUND, http: 404, condition: "bidId does not exist" }
  - { id: ERR_CLAIM_NOT_FOUND, http: 404, condition: "claimId does not exist" }
  - { id: ERR_SETTLEMENT_NOT_FOUND, http: 404, condition: "settlementId does not exist" }
  - { id: ERR_GATE_PASS_NOT_FOUND, http: 404, condition: "gatePassId does not exist" }
  - { id: ERR_CARRIER_NOT_FOUND, http: 404, condition: "carrierId does not exist" }
  - { id: ERR_TRANSPORT_NOT_FOUND, http: 404, condition: "transportOrderId does not exist" }

  - { id: ERR_SALE_NOT_IN_DRAFT, http: 409, condition: "sale open attempted when not DRAFT" }
  - { id: ERR_SALE_NOT_OPEN, http: 409, condition: "sale start attempted when not OPEN" }
  - { id: ERR_SALE_NOT_RUNNING, http: 409, condition: "operation requires sale RUNNING (open-bidding, relist) or sale close attempted when not RUNNING" }
  - { id: ERR_SALE_NOT_CLOSED, http: 409, condition: "settle/write-off requires sale CLOSED" }
  - { id: ERR_NO_LANES, http: 409, condition: "sale start with no PLANNED/ACTIVE lanes" }
  - { id: ERR_LOTS_STILL_LIVE, http: 409, condition: "sale close while a lot is BIDDING_OPEN" }
  - { id: ERR_UNSETTLED_LOTS_EXIST, http: 409, condition: "sale settle while a Settlement is not CLEARED/VOID/DEFAULTED" }

  - { id: ERR_LANE_NOT_PLANNED, http: 409, condition: "lane archive when not PLANNED" }
  - { id: ERR_LANE_HAS_LOTS, http: 409, condition: "lane archive while scheduled_slot_count > 0" }
  - { id: ERR_LANE_NOT_ACTIVE, http: 409, condition: "open-bidding while lane not ACTIVE" }
  - { id: ERR_DUPLICATE_LANE_NUMBER, http: 409, condition: "lane_number already used in this sale" }

  - { id: ERR_CONSIGNMENT_NOT_SUBMITTED, http: 409, condition: "catalog when consignment not SUBMITTED" }
  - { id: ERR_CONDITION_REPORT_MISSING, http: 409, condition: "catalog without an attached condition report" }
  - { id: ERR_FLOOR_ABOVE_RESERVE, http: 409, condition: "floor_price_cents > reserve_price_cents at catalog" }
  - { id: ERR_CONSIGNMENT_NOT_WITHDRAWABLE, http: 409, condition: "withdraw when consignment not SUBMITTED/CATALOGED" }
  - { id: ERR_DUPLICATE_VIN, http: 409, condition: "vin already consigned in this sale" }

  - { id: ERR_CROSS_SALE_REFERENCE, http: 409, condition: "lot lane_id/consignment_id reference a different sale, or settlement seller mismatch" }
  - { id: ERR_LANE_SLOT_OVERLAP, http: 409, condition: "lot slot window overlaps another active lot in the same lane or lies outside the lane window" }
  - { id: ERR_DUPLICATE_RUN_NUMBER, http: 409, condition: "run_number already used in this lane" }
  - { id: ERR_LOT_NOT_SCHEDULED, http: 409, condition: "open-bidding/withdraw when lot not SCHEDULED" }
  - { id: ERR_LOT_NOT_BIDDING_OPEN, http: 409, condition: "close-bidding or bid when lot not BIDDING_OPEN" }
  - { id: ERR_LOT_NOT_BIDDING_CLOSED, http: 409, condition: "hammer/mark-if/pass when lot not BIDDING_CLOSED" }
  - { id: ERR_LOT_NOT_IF_PENDING, http: 409, condition: "relist when lot not IF_PENDING" }
  - { id: ERR_LOT_NOT_HAMMERED, http: 409, condition: "record-payment when lot not HAMMERED" }
  - { id: ERR_OUTCOME_NOT_SOLD, http: 409, condition: "hammer when sale_outcome != SOLD" }
  - { id: ERR_OUTCOME_NOT_IF, http: 409, condition: "mark-if when sale_outcome != IF" }
  - { id: ERR_OUTCOME_NOT_PASSED, http: 409, condition: "pass when sale_outcome != PASSED" }

  - { id: ERR_BUYER_SUSPENDED, http: 409, condition: "bid placed by a SUSPENDED buyer" }
  - { id: ERR_BID_BELOW_MINIMUM, http: 409, condition: "bid amount below required minimum increment" }
  - { id: ERR_INSUFFICIENT_CREDIT, http: 402, condition: "buyer available credit cannot cover projected total_due" }
  - { id: ERR_STALE_LOT_VERSION, http: 412, condition: "expected_lot_version != RunListEntry.version (OCC)" }

  - { id: ERR_CLAIM_NOT_OPEN, http: 409, condition: "rule on a claim not OPEN" }
  - { id: ERR_SETTLEMENT_NOT_PAID, http: 409, condition: "arbitration rule when settlement payment_status != PAID" }
  - { id: ERR_SETTLEMENT_NOT_UNPAID, http: 409, condition: "record-payment/write-off when payment_status != UNPAID" }
  - { id: ERR_TITLE_ALREADY_RECEIVED, http: 409, condition: "record-title when title_status != PENDING_TITLE" }
  - { id: ERR_SETTLEMENT_NOT_CLEARED, http: 409, condition: "transport dispatch when settlement not CLEARED" }

  - { id: ERR_GATE_PASS_NOT_ISSUED, http: 409, condition: "redeem when gate pass not ISSUED" }
  - { id: ERR_NO_DISPATCHED_TRANSPORT, http: 409, condition: "redeem gate pass without a DISPATCHED transport order for the settlement" }
  - { id: ERR_CARRIER_SUSPENDED, http: 409, condition: "dispatch with a SUSPENDED carrier" }
  - { id: ERR_CARRIER_WINDOW_CONFLICT, http: 409, condition: "transport pickup window violates the carrier turnaround buffer" }
  - { id: ERR_TRANSPORT_NOT_REQUESTED, http: 409, condition: "dispatch/cancel when transport not REQUESTED" }
  - { id: ERR_TRANSPORT_NOT_DISPATCHED, http: 409, condition: "deliver when transport not DISPATCHED" }

  - { id: ERR_VALIDATION, http: 400, condition: "missing/invalid request field, bad enum, negative amount, malformed window" }

# =============================================================================
# Table 1.7: RBAC Matrix
# =============================================================================
roles:
  - name: AuctionAdmin
    description: "Auction operator: runs sales/lanes, catalogs, run-lists, drives the block, records payment/title, settles, dispatches transport"
    identity: opaque
    exclusive_operations:
      - "POST /auction/sales (+ open/start/close/settle)"
      - "POST /auction/lanes (+ archive)"
      - "POST /auction/sellers (+ suspend/reinstate)"
      - "POST /auction/buyers (+ suspend/reinstate)"
      - "POST /auction/consignments/{id}/catalog"
      - "POST /auction/condition-reports"
      - "POST /auction/lots (+ open-bidding/close-bidding/hammer/mark-if/pass/relist/withdraw)"
      - "POST /auction/settlements/{id}/record-payment | record-title | write-off"
      - "POST /auction/gate-passes/{id}/redeem"
      - "POST /auction/carriers (+ suspend)"
      - "POST /auction/transport-orders/{id}/dispatch | deliver"
    shared_operations:
      - "POST /auction/consignments (with Seller)"
      - "POST /auction/transport-orders (with Buyer)"
      - "POST /auction/transport-orders/{id}/cancel (with Buyer)"
      - "GET endpoints"

  - name: Seller
    description: "Selling dealer: consigns and withdraws own vehicles"
    identity: "entity_backed:Seller"
    exclusive_operations:
      - "POST /auction/consignments/{id}/withdraw (own consignment)"
    shared_operations:
      - "POST /auction/consignments (own, with AuctionAdmin)"
      - "GET endpoints scoped to own resources"

  - name: Buyer
    description: "Buying dealer: places bids, opens arbitration claims, books transport"
    identity: "entity_backed:Buyer"
    exclusive_operations:
      - "POST /auction/lots/{id}/bids (own buyer_id)"
      - "POST /auction/arbitration-claims (own buyer_id)"
    shared_operations:
      - "POST /auction/transport-orders (own, with AuctionAdmin)"
      - "POST /auction/transport-orders/{id}/cancel (own, with AuctionAdmin)"
      - "GET endpoints scoped to own resources"

  - name: Arbitrator
    description: "Independent adjudicator who rules on arbitration claims"
    identity: opaque
    exclusive_operations:
      - "POST /auction/arbitration-claims/{id}/rule"
    shared_operations:
      - "GET endpoints"
