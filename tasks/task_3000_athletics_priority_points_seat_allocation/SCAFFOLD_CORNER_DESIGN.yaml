      - name: streak_grace_year_is_applied_once_and_the_scan_stops_at_the_first_gap
        claim_type: chronological
        grounds:
          - calculations.priority_point_score.formula
          - entities.Donor.fields.consecutive_giving_years
        distinguishing_aspect: |
          The streak walk has two distinct rules that a naive "count qualifying
          years" implementation conflates: the one-year grace is consumed ONLY
          when the recalculation's own cycle_year fails to qualify, and the
          backwards scan stops at the FIRST gap regardless. Two donors with the
          same 2000000-cent lifetime giving therefore separate: 2024+2025 (no
          2026) uses the grace and reaches streak 2, while 2024+2026 (no 2025)
          starts at 2026, hits the 2025 gap immediately and stops at streak 1.
          Awarding the grace to the second donor would give it streak 2 as well.
        test_recipe:
          setup:
            - "Logical clock at 2026-07-01T00:00:00.000Z."
            - "Donor G with RECEIVED ATHLETICS_ANNUAL gifts of 1000000 cents dated 2024-05-01 and 2025-05-01 and no 2026 gift."
            - "Donor H with RECEIVED ATHLETICS_ANNUAL gifts of 1000000 cents dated 2024-05-01 and 2026-05-01 and no 2025 gift."
            - "One PointRecalculation for cycle 2026 with cutoff_date 2026-06-30T23:59:59.999Z, not yet run."
