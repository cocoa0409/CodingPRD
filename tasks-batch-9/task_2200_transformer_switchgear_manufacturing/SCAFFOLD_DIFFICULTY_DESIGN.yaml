      - name: release_penalty_lead_time_tier_120_vs_121_vs_five_percent_ceiling_vs_reserved_release
        grounds:
          - calculations.allocation_release_penalty
          - entities.ComponentAllocation.fields.release_penalty_cents
          - entities.LongLeadComponent.fields.lead_time_days
          - state_machines.ComponentAllocation
        distinguishing_aspect: |
          Four releases on one order (contract_value_cents 4000000, penalty_ceiling 200000) span every
          branch of the threshold table: lead_time_days 30 -> 0, lead_time_days 120 x qty 2 -> 50000,
          lead_time_days 121 x qty 2 -> 120000 (a single extra day multiplies the unit rate by 2.4),
          lead_time_days 121 x qty 4 -> raw 240000 clamped to the 200000 ceiling, and a RESERVED (never
          committed) allocation released for 0 because the calculation is not run on that edge at all.
        test_recipe:
          setup:
            - "One order TX-REL-0004 with contract_value_cents 4000000 driven to engineering_status DESIGN_RELEASED (needed to commit allocations); fulfillment_status stays PLANNING throughout because allocation E remains RESERVED, so no MATERIAL_ALLOCATED transition occurs and P82 never fires."
            - "Three components under one supplier: CMP-A lead_time_days 30, CMP-B lead_time_days 120, CMP-C lead_time_days 121, each quantity_on_hand 20 and allocation_policy DEDICATED."
            - "Five allocations: A(CMP-A, qty 3), B(CMP-B, qty 2), C(CMP-C, qty 2), D(CMP-C, qty 4), E(CMP-A, qty 1). A-D are committed; E stays RESERVED."
            - "penalty_ceiling = round_half_up(4000000 * 5 / 100, 0) = 200000."
          setup_api_calls:
