          assert:
            - "hop 1: SupplierLot.${lot_id}.label_status == MISMATCHED"
            - "hop 2: CaseLabel.${label_id}.status == WITHDRAWN and CaseLabel.${label_id}.withdraw_reason == SPECIES_MISMATCH"
            - "hop 3: exactly 1 ShrinkEvent exists for SupplierLot.${lot_id} with reason == MISLABEL_DESTRUCTION, shrink_weight_kg == 10.000, status == VALUED and provisional_value_cents == 18450"
            - "hop 4: SupplierLot.${lot_id}.chargeback_status == ASSESSED and SupplierLot.${lot_id}.chargeback_assessed_cents == 47840"
            - "hop 5: Supplier.${supplier_id}.chargeback_assessed_total_cents == 47840 and Supplier.${supplier_id}.chargeback_outstanding_cents == 47840"
