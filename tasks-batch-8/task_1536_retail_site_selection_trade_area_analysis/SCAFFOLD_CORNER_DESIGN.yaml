          rationale: "Both variant pairs produce pinned, unequal literals in forecast_gravity_vs_analog_divergence and cannibalization_flat_band_vs_distance_decay."

      - name: temporal_windowing_layer_covered_by_difficulty
        claim_type: temporal_windowing
        grounds:
