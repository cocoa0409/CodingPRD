# =============================================================================
# Task 1300 §1.8: Scaffold Difficulty Design (Test Targeting Index)
# 9 Difficulty Rules × 2 instances each = 18 instances.
# =============================================================================
scaffold_difficulty_design:
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: prototype_estimate_provisional_vs_engineered
        grounds:
          - calculations.prototype_cost_estimate
          - entities.FixturePrototype.fields.provisional_cost_cents
          - entities.FixturePrototype.fields.engineered_cost_cents
          - entities.FixturePrototype.fields.final_cost_cents
        distinguishing_aspect: |
          Fixture-domain dual variant: the same bom_lines price to 55000 under
          the PROVISIONAL (list-price) variant and 47000 under the ENGINEERED
          (negotiated-price) variant; approval after a VE round finalizes 47000
          while the provisional figure stays 55000.
        test_recipe:
          setup:
            - "Program ACTIVE with budget 1000000"
            - "Prototype created with bom_lines [{part_number: PN-100, quantity: 10, list_unit_cost_cents: 5000}, {part_number: PN-200, quantity: 4, list_unit_cost_cents: 1250}] and target_cost_cents 50000"
            - "One VE round executed, patching PN-100 negotiated_unit_cost_cents to 4200, then resubmitted and approved by a different user"
          setup_api_calls:
            - call: "POST /rollout-programs"
              payload: { program_name: "P-DUAL-PROTO", retailer_code: "RTL-1", budget_total_cents: 1000000, contingency_budget_cents: 100000 }
              as: ProgramManager
              captures: { prog_id: $.data.id }
            - call: "POST /rollout-programs/${prog_id}/activate"
              payload: {}
              as: ProgramManager
            - call: "POST /fixture-prototypes"
              payload: { program_id: "${prog_id}", fixture_code: "GONDOLA-4FT", bom_lines: [ { part_number: "PN-100", quantity: 10, list_unit_cost_cents: 5000 }, { part_number: "PN-200", quantity: 4, list_unit_cost_cents: 1250 } ], target_cost_cents: 50000 }
              as: FixtureEngineer
              captures: { proto_id: $.data.id }
            - call: "POST /fixture-prototypes/${proto_id}/submit-review"
              payload: {}
              as: FixtureEngineer
              as_user_id: "eng-1"
            - call: "POST /fixture-prototypes/${proto_id}/request-value-engineering"
              payload: {}
              as: ProgramManager
            - call: "PATCH /fixture-prototypes/${proto_id}"
              payload: { bom_lines: [ { part_number: "PN-100", quantity: 10, list_unit_cost_cents: 5000, negotiated_unit_cost_cents: 4200 }, { part_number: "PN-200", quantity: 4, list_unit_cost_cents: 1250 } ] }
              as: FixtureEngineer
            - call: "POST /fixture-prototypes/${proto_id}/submit-review"
              payload: {}
              as: FixtureEngineer
              as_user_id: "eng-1"
            - call: "POST /fixture-prototypes/${proto_id}/approve"
              payload: {}
              as: ProgramManager
              as_user_id: "pm-1"
          trigger:
            - call: "GET /fixture-prototypes/${proto_id}"
              payload: {}
              as: ProgramManager
          assert:
            - "FixturePrototype.${proto_id}.provisional_cost_cents == 55000"
            - "FixturePrototype.${proto_id}.engineered_cost_cents == 47000"
            - "FixturePrototype.${proto_id}.final_cost_cents == 47000"
            - "FixturePrototype.${proto_id}.provisional_cost_cents != FixturePrototype.${proto_id}.engineered_cost_cents"
            - "FixturePrototype.${proto_id}.ve_round_count == 1"
            - "FixturePrototype.${proto_id}.status == APPROVED"

      - name: attic_valuation_program_average_vs_liquidation
        grounds:
          - calculations.attic_stock_valuation
          - entities.AtticStockLedger.fields.recovery_value_cents
          - entities.RolloutProgram.fields.attic_valuation_method
        distinguishing_aspect: |
          Inventory-disposition-domain dual variant (distinct from the fixture
          prototype domain): two identical 5-unit ledgers disposed as
          RETURN_VENDOR value at 12720 under PROGRAM_AVERAGE (unit cost 3180
          derived from the kit) and 10000 under LIQUIDATION (flat 2500 market
          rate) — same quantity, same disposition, different entity domain and
          different result.
        test_recipe:
          setup:
            - "Program A (PROGRAM_AVERAGE) and Program B (LIQUIDATION), each driven through: prototype approved → kit (100 components at unit_cost 1000) frozen → wave (capacity 200) committed → kit released → delivery scheduled/dispatched/confirmed → signoff submitted/approved → ledger auto-created with quantity_on_hand == 5"
            - "Each program's wave completed and program moved to CLOSEOUT_PENDING"
          setup_api_calls:
            - call: "POST /rollout-programs"
              payload: { program_name: "P-AVG", retailer_code: "RTL-1", budget_total_cents: 2000000, contingency_budget_cents: 100000, attic_valuation_method: "PROGRAM_AVERAGE" }
              as: ProgramManager
              captures: { prog_a: $.data.id }
            - call: "POST /rollout-programs/${prog_a}/activate"
              payload: {}
              as: ProgramManager
            - call: "POST /fixture-prototypes"
              payload: { program_id: "${prog_a}", fixture_code: "GONDOLA-8FT", bom_lines: [ { part_number: "PN-300", quantity: 5, list_unit_cost_cents: 9000 } ], target_cost_cents: 999999 }
              as: FixtureEngineer
              captures: { proto_a: $.data.id }
            - call: "POST /fixture-prototypes/${proto_a}/submit-review"
              payload: {}
              as: FixtureEngineer
              as_user_id: "eng-1"
            - call: "POST /fixture-prototypes/${proto_a}/approve"
              payload: {}
              as: ProgramManager
              as_user_id: "pm-1"
            - call: "POST /store-kit-configs"
              payload: { program_id: "${prog_a}", prototype_id: "${proto_a}", store_code: "STORE-A", config_lines: [ { part_number: "PN-300", quantity: 100, unit_cost_cents: 1000 } ] }
              as: ConfigCoordinator
              captures: { kit_a: $.data.id }
            - call: "POST /store-kit-configs/${kit_a}/freeze"
              payload: {}
              as: ConfigCoordinator
            - call: "POST /production-waves"
              payload: { program_id: "${prog_a}", wave_label: "WAVE-A", start_date: "2026-09-01", end_date: "2026-09-10", capacity_units: 200 }
              as: ProductionPlanner
              captures: { wave_a: $.data.id }
            - call: "POST /production-waves/${wave_a}/commit"
              payload: {}
              as: ProductionPlanner
            - call: "POST /store-kit-configs/${kit_a}/release"
              payload: { wave_id: "${wave_a}" }
              as: ConfigCoordinator
            - call: "POST /install-deliveries"
              payload: { kit_id: "${kit_a}", crew_code: "CREW-A", delivery_date: "2026-09-15", estimated_install_hours: 4 }
              as: InstallCrewLead
              captures: { del_a: $.data.id }
            - call: "POST /install-deliveries/${del_a}/dispatch"
              payload: {}
              as: InstallCrewLead
            - call: "POST /install-deliveries/${del_a}/confirm-delivery"
              payload: {}
              as: InstallCrewLead
            - call: "POST /install-signoffs"
              payload: { delivery_id: "${del_a}", photo_urls: [ "https://photos/a1.jpg" ] }
              as: InstallCrewLead
              as_user_id: "crew-1"
              captures: { so_a: $.data.id }
            - call: "POST /install-signoffs/${so_a}/approve"
              payload: {}
              as: StoreManager
              as_user_id: "sm-1"
            - call: "GET /attic-stock-ledgers?kit_id=${kit_a}"
              payload: {}
              as: ProgramManager
              captures: { ledger_a: "$.data[0].id"}
            - call: "POST /production-waves/${wave_a}/complete"
              payload: {}
              as: ProductionPlanner
            - call: "POST /rollout-programs/${prog_a}/initiate-closeout"
              payload: {}
              as: ProgramManager
            - call: "POST /rollout-programs"
              payload: { program_name: "P-LIQ", retailer_code: "RTL-1", budget_total_cents: 2000000, contingency_budget_cents: 100000, attic_valuation_method: "LIQUIDATION" }
              as: ProgramManager
              captures: { prog_b: $.data.id }
            - call: "POST /rollout-programs/${prog_b}/activate"
              payload: {}
              as: ProgramManager
            - call: "POST /fixture-prototypes"
              payload: { program_id: "${prog_b}", fixture_code: "GONDOLA-8FT", bom_lines: [ { part_number: "PN-300", quantity: 5, list_unit_cost_cents: 9000 } ], target_cost_cents: 999999 }
              as: FixtureEngineer
              captures: { proto_b: $.data.id }
            - call: "POST /fixture-prototypes/${proto_b}/submit-review"
              payload: {}
              as: FixtureEngineer
              as_user_id: "eng-1"
            - call: "POST /fixture-prototypes/${proto_b}/approve"
              payload: {}
              as: ProgramManager
              as_user_id: "pm-1"
            - call: "POST /store-kit-configs"
              payload: { program_id: "${prog_b}", prototype_id: "${proto_b}", store_code: "STORE-B", config_lines: [ { part_number: "PN-300", quantity: 100, unit_cost_cents: 1000 } ] }
              as: ConfigCoordinator
              captures: { kit_b: $.data.id }
            - call: "POST /store-kit-configs/${kit_b}/freeze"
              payload: {}
              as: ConfigCoordinator
            - call: "POST /production-waves"
              payload: { program_id: "${prog_b}", wave_label: "WAVE-B", start_date: "2026-09-01", end_date: "2026-09-10", capacity_units: 200 }
              as: ProductionPlanner
              captures: { wave_b: $.data.id }
            - call: "POST /production-waves/${wave_b}/commit"
              payload: {}
              as: ProductionPlanner
            - call: "POST /store-kit-configs/${kit_b}/release"
              payload: { wave_id: "${wave_b}" }
              as: ConfigCoordinator
            - call: "POST /install-deliveries"
              payload: { kit_id: "${kit_b}", crew_code: "CREW-B", delivery_date: "2026-09-15", estimated_install_hours: 4 }
              as: InstallCrewLead
              captures: { del_b: $.data.id }
            - call: "POST /install-deliveries/${del_b}/dispatch"
              payload: {}
              as: InstallCrewLead
            - call: "POST /install-deliveries/${del_b}/confirm-delivery"
              payload: {}
              as: InstallCrewLead
            - call: "POST /install-signoffs"
              payload: { delivery_id: "${del_b}", photo_urls: [ "https://photos/b1.jpg" ] }
              as: InstallCrewLead
              as_user_id: "crew-1"
              captures: { so_b: $.data.id }
            - call: "POST /install-signoffs/${so_b}/approve"
              payload: {}
              as: StoreManager
              as_user_id: "sm-1"
            - call: "GET /attic-stock-ledgers?kit_id=${kit_b}"
              payload: {}
              as: ProgramManager
              captures: { ledger_b: "$.data[0].id"}
            - call: "POST /production-waves/${wave_b}/complete"
              payload: {}
              as: ProductionPlanner
            - call: "POST /rollout-programs/${prog_b}/initiate-closeout"
              payload: {}
              as: ProgramManager
          trigger:
            - call: "POST /attic-stock-ledgers/${ledger_a}/dispose"
              payload: { disposition_type: "RETURN_VENDOR" }
              as: ProgramManager
            - call: "POST /attic-stock-ledgers/${ledger_b}/dispose"
              payload: { disposition_type: "RETURN_VENDOR" }
              as: ProgramManager
          assert:
            - "AtticStockLedger.${ledger_a}.quantity_on_hand == 5"
            - "AtticStockLedger.${ledger_a}.unit_cost_cents == 3180"
            - "AtticStockLedger.${ledger_a}.recovery_value_cents == 12720"
            - "AtticStockLedger.${ledger_b}.quantity_on_hand == 5"
            - "AtticStockLedger.${ledger_b}.recovery_value_cents == 10000"
            - "AtticStockLedger.${ledger_a}.recovery_value_cents != AtticStockLedger.${ledger_b}.recovery_value_cents"
            - "RolloutProgram.${prog_a}.closeout_recovery_cents == 12720"
            - "RolloutProgram.${prog_b}.closeout_recovery_cents == 10000"

  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: wave_release_charge_tiered_rush
        grounds:
          - calculations.wave_release_charge
          - entities.StoreKitConfig.fields.wave_release_charge_cents
          - state_machines.ProductionWave.COMMITTED_to_IN_PRODUCTION
        distinguishing_aspect: |
          Mode (a) combinatorial formula: 3+ inputs (total_components,
          utilization_after tier, wave.status rush branch) with non-linear
          tiered-rate selection and a conditional 1.25 rush multiplier —
          three releases of 60/20/10 components on one capacity-100 wave price
          at 9000 / 3450 / 2531 as the tier escalates and the wave flips to
          IN_PRODUCTION.
        test_recipe:
          setup:
            - "Program ACTIVE, budget 2000000; prototype APPROVED"
            - "Wave W capacity_units 100, start_date 2026-08-10, COMMITTED"
            - "Kit K1 (60 components) released while wave COMMITTED (utilization_after 60% → tier 1.0)"
            - "Kit K2 (20 components) released while wave COMMITTED (utilization_after 80% → tier 1.15)"
            - "Logical clock advanced to 2026-08-10 so W auto-transitions to IN_PRODUCTION"
            - "Kit K3 (10 components) released while wave IN_PRODUCTION (utilization_after 90% → tier 1.35, rush 1.25)"
          setup_api_calls:
            - call: "POST /rollout-programs"
              payload: { program_name: "P-TIER", retailer_code: "RTL-2", budget_total_cents: 2000000, contingency_budget_cents: 100000 }
              as: ProgramManager
              captures: { prog_id: $.data.id }
            - call: "POST /rollout-programs/${prog_id}/activate"
              payload: {}
              as: ProgramManager
            - call: "POST /fixture-prototypes"
              payload: { program_id: "${prog_id}", fixture_code: "WALL-BAY", bom_lines: [ { part_number: "PN-400", quantity: 2, list_unit_cost_cents: 1000 } ], target_cost_cents: 999999 }
              as: FixtureEngineer
              captures: { proto_id: $.data.id }
            - call: "POST /fixture-prototypes/${proto_id}/submit-review"
              payload: {}
              as: FixtureEngineer
              as_user_id: "eng-1"
            - call: "POST /fixture-prototypes/${proto_id}/approve"
              payload: {}
              as: ProgramManager
              as_user_id: "pm-1"
            - call: "POST /production-waves"
              payload: { program_id: "${prog_id}", wave_label: "WAVE-T", start_date: "2026-08-10", end_date: "2026-08-20", capacity_units: 100 }
              as: ProductionPlanner
              captures: { wave_id: $.data.id }
            - call: "POST /production-waves/${wave_id}/commit"
              payload: {}
              as: ProductionPlanner
            - call: "POST /store-kit-configs"
              payload: { program_id: "${prog_id}", prototype_id: "${proto_id}", store_code: "STORE-T1", config_lines: [ { part_number: "PN-400", quantity: 60, unit_cost_cents: 1000 } ] }
              as: ConfigCoordinator
              captures: { kit1: $.data.id }
            - call: "POST /store-kit-configs/${kit1}/freeze"
              payload: {}
              as: ConfigCoordinator
            - call: "POST /store-kit-configs"
              payload: { program_id: "${prog_id}", prototype_id: "${proto_id}", store_code: "STORE-T2", config_lines: [ { part_number: "PN-400", quantity: 20, unit_cost_cents: 1000 } ] }
              as: ConfigCoordinator
              captures: { kit2: $.data.id }
            - call: "POST /store-kit-configs/${kit2}/freeze"
              payload: {}
              as: ConfigCoordinator
            - call: "POST /store-kit-configs"
              payload: { program_id: "${prog_id}", prototype_id: "${proto_id}", store_code: "STORE-T3", config_lines: [ { part_number: "PN-400", quantity: 10, unit_cost_cents: 1000 } ] }
              as: ConfigCoordinator
              captures: { kit3: $.data.id }
            - call: "POST /store-kit-configs/${kit3}/freeze"
              payload: {}
              as: ConfigCoordinator
            - call: "POST /store-kit-configs/${kit1}/release"
              payload: { wave_id: "${wave_id}" }
              as: ConfigCoordinator
            - call: "POST /store-kit-configs/${kit2}/release"
              payload: { wave_id: "${wave_id}" }
              as: ConfigCoordinator
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /store-kit-configs/${kit3}/release"
              payload: { wave_id: "${wave_id}" }
              as: ConfigCoordinator
          trigger:
            - call: "GET /production-waves/${wave_id}"
              payload: {}
              as: ProductionPlanner
            - call: "GET /store-kit-configs/${kit1}"
              payload: {}
              as: ConfigCoordinator
            - call: "GET /store-kit-configs/${kit2}"
              payload: {}
              as: ConfigCoordinator
            - call: "GET /store-kit-configs/${kit3}"
              payload: {}
              as: ConfigCoordinator
          assert:
            - "StoreKitConfig.${kit1}.wave_release_charge_cents == 9000"
            - "StoreKitConfig.${kit2}.wave_release_charge_cents == 3450"
            - "StoreKitConfig.${kit3}.wave_release_charge_cents == 2531"
            - "ProductionWave.${wave_id}.status == IN_PRODUCTION"
            - "ProductionWave.${wave_id}.committed_units == 90"
            - "ProductionWave.${wave_id}.utilization_pct == 90.0"
            - "ProductionWave.${wave_id}.utilization_posture == AT_RISK"

      - name: kit_total_per_line_rounding
        grounds:
          - calculations.kit_total_cost
          - entities.StoreKitConfig.fields.kit_total_cost_cents
        distinguishing_aspect: |
          Mode (b) combinatorial formula (different mode from instance 1's
          tiered branch selection): nested rounding where order matters — the
          scaffold pins per-line round_half_up THEN sum, so a 1×1025 line plus
          a 1×2075 line totals 3287 cents, while the forbidden sum-then-round
          order yields 3286.
        test_recipe:
          setup:
            - "Program ACTIVE, budget 2000000; prototype APPROVED"
            - "Kit created with config_lines [{part_number: PN-500, quantity: 1, unit_cost_cents: 1025}, {part_number: PN-501, quantity: 1, unit_cost_cents: 2075}]"
          setup_api_calls:
            - call: "POST /rollout-programs"
              payload: { program_name: "P-ROUND", retailer_code: "RTL-2", budget_total_cents: 2000000, contingency_budget_cents: 100000 }
              as: ProgramManager
              captures: { prog_id: $.data.id }
            - call: "POST /rollout-programs/${prog_id}/activate"
              payload: {}
              as: ProgramManager
            - call: "POST /fixture-prototypes"
              payload: { program_id: "${prog_id}", fixture_code: "CASH-WRAP", bom_lines: [ { part_number: "PN-500", quantity: 1, list_unit_cost_cents: 1025 } ], target_cost_cents: 999999 }
              as: FixtureEngineer
              captures: { proto_id: $.data.id }
            - call: "POST /fixture-prototypes/${proto_id}/submit-review"
              payload: {}
              as: FixtureEngineer
              as_user_id: "eng-1"
            - call: "POST /fixture-prototypes/${proto_id}/approve"
              payload: {}
              as: ProgramManager
              as_user_id: "pm-1"
            - call: "POST /store-kit-configs"
              payload: { program_id: "${prog_id}", prototype_id: "${proto_id}", store_code: "STORE-R1", config_lines: [ { part_number: "PN-500", quantity: 1, unit_cost_cents: 1025 }, { part_number: "PN-501", quantity: 1, unit_cost_cents: 2075 } ] }
              as: ConfigCoordinator
              captures: { kit_id: $.data.id, kit_v: $.data.version }
          trigger:
            - call: "POST /store-kit-configs/${kit_id}/freeze"
              payload: {}
              as: ConfigCoordinator
          assert:
            - "StoreKitConfig.${kit_id}.kit_total_cost_cents == 3287"
            - "StoreKitConfig.${kit_id}.total_components == 2"
            - "StoreKitConfig.${kit_id}.status == FROZEN"
            - "RolloutProgram.${prog_id}.remaining_budget_cents == 1996713"

  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: prototype_value_engineering_cycle
        grounds:
          - state_machines.FixturePrototype.ENGINEERING_REVIEW_to_VALUE_ENGINEERING
          - state_machines.FixturePrototype.VALUE_ENGINEERING_to_ENGINEERING_REVIEW
        distinguishing_aspect: |
          Cyclic machine on FixturePrototype: ENGINEERING_REVIEW →
          VALUE_ENGINEERING → ENGINEERING_REVIEW → VALUE_ENGINEERING →
          ENGINEERING_REVIEW loops twice before approval, with ve_round_count
          tracking 2 and engineered_cost_cents recomputed on each resubmission.
        test_recipe:
          setup:
            - "Program ACTIVE, budget 1000000"
            - "Prototype with provisional 55000 > target 50000, submitted for review by eng-1"
          setup_api_calls:
            - call: "POST /rollout-programs"
              payload: { program_name: "P-VE", retailer_code: "RTL-3", budget_total_cents: 1000000, contingency_budget_cents: 100000 }
              as: ProgramManager
              captures: { prog_id: $.data.id }
            - call: "POST /rollout-programs/${prog_id}/activate"
              payload: {}
              as: ProgramManager
            - call: "POST /fixture-prototypes"
              payload: { program_id: "${prog_id}", fixture_code: "GONDOLA-4FT", bom_lines: [ { part_number: "PN-100", quantity: 10, list_unit_cost_cents: 5000 }, { part_number: "PN-200", quantity: 4, list_unit_cost_cents: 1250 } ], target_cost_cents: 50000 }
              as: FixtureEngineer
              captures: { proto_id: $.data.id }
            - call: "POST /fixture-prototypes/${proto_id}/submit-review"
              payload: {}
              as: FixtureEngineer
              as_user_id: "eng-1"
          trigger:
            - call: "POST /fixture-prototypes/${proto_id}/request-value-engineering"
              payload: {}
              as: ProgramManager
            - call: "PATCH /fixture-prototypes/${proto_id}"
              payload: { bom_lines: [ { part_number: "PN-100", quantity: 10, list_unit_cost_cents: 5000, negotiated_unit_cost_cents: 4200 }, { part_number: "PN-200", quantity: 4, list_unit_cost_cents: 1250 } ] }
              as: FixtureEngineer
            - call: "POST /fixture-prototypes/${proto_id}/submit-review"
              payload: {}
              as: FixtureEngineer
              as_user_id: "eng-1"
            - call: "POST /fixture-prototypes/${proto_id}/request-value-engineering"
              payload: {}
              as: ProgramManager
            - call: "PATCH /fixture-prototypes/${proto_id}"
              payload: { bom_lines: [ { part_number: "PN-100", quantity: 10, list_unit_cost_cents: 5000, negotiated_unit_cost_cents: 4000 }, { part_number: "PN-200", quantity: 4, list_unit_cost_cents: 1250 } ] }
              as: FixtureEngineer
            - call: "POST /fixture-prototypes/${proto_id}/submit-review"
              payload: {}
              as: FixtureEngineer
              as_user_id: "eng-1"
            - call: "POST /fixture-prototypes/${proto_id}/approve"
              payload: {}
              as: ProgramManager
              as_user_id: "pm-9"
          assert:
            - "FixturePrototype.${proto_id}.ve_round_count == 2"
            - "FixturePrototype.${proto_id}.engineered_cost_cents == 45000"
            - "FixturePrototype.${proto_id}.provisional_cost_cents == 55000"
            - "FixturePrototype.${proto_id}.final_cost_cents == 45000"
            - "FixturePrototype.${proto_id}.status == APPROVED"

      - name: signoff_reject_resubmit_cycle
        grounds:
          - state_machines.InstallSignoff.SUBMITTED_to_REJECTED
          - state_machines.InstallSignoff.REJECTED_to_SUBMITTED
        distinguishing_aspect: |
          Cyclic machine on InstallSignoff (a different entity from the
          prototype loop): SUBMITTED → REJECTED → SUBMITTED → APPROVED, with
          submission_count incrementing to 2 on resubmission and the delivery
          only reaching COMPLETE after the second-cycle approval.
        test_recipe:
          setup:
            - "Program ACTIVE; prototype APPROVED; kit (10 components at 1000) FROZEN then RELEASED to a COMMITTED wave (capacity 100); delivery DISPATCHED then DELIVERED"
          setup_api_calls:
            - call: "POST /rollout-programs"
              payload: { program_name: "P-SO", retailer_code: "RTL-3", budget_total_cents: 1000000, contingency_budget_cents: 100000 }
              as: ProgramManager
              captures: { prog_id: $.data.id }
            - call: "POST /rollout-programs/${prog_id}/activate"
              payload: {}
              as: ProgramManager
            - call: "POST /fixture-prototypes"
              payload: { program_id: "${prog_id}", fixture_code: "ENDCAP", bom_lines: [ { part_number: "PN-600", quantity: 1, list_unit_cost_cents: 3000 } ], target_cost_cents: 999999 }
              as: FixtureEngineer
