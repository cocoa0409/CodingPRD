        distinguishing_aspect: >-
          Three machines are born in one instance, and the Shift is born on TWO independent
          dimensions at once: time_status OPEN and declaration_status UNDECLARED. Nothing derived
          at close time is populated yet — tip_credit_eligible_minutes is still 0 even though
          scheduled_minutes is already 480 — which is what separates "created" from "closed".
