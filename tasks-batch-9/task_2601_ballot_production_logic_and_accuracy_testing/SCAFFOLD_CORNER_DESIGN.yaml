            - "HTTP 200 and BallotLot.${lot1}.custody_state == \"ISSUED\"."
            - "lot_code == \"L-001\", seal_number == \"SEAL-1001\", quantity_shipped == 12500, quantity_received == 12500."
            - "issued_quantity == 3000 and unused_quantity == 9500 (quantity_received - issued_quantity)."
            - "voted_quantity == 0, spoiled_quantity == 0, returned_unused_quantity == 0, accounted_quantity == 0, and lot_variance == null (null until custody_state == RETURNED)."
