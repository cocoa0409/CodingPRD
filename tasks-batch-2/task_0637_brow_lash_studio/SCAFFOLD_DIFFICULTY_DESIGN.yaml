            - call: "POST /sanitation-logs"
              payload: { lash_tech_id: "${tech1_id}", sanitized_at_utc: "2026-06-01T09:00:00Z" }
              as: StudioManager
            - call: "POST /sanitation-logs"
              payload: { lash_tech_id: "${tech1_id}", sanitized_at_utc: "2026-06-09T08:00:00Z" }
              as: StudioManager
            - call: "POST /members"
              payload: { studio_id: "${studio_id}", full_name: "Ada", email: "ada@x.com" }
