  - rule_id: compensating_invariant
    instances:
      - name: pack_void_restores_fish_lot_mass_exactly
        grounds:
          - "state_machines.PackLot.ON_SHELF_to_VOIDED"
          - "state_machines.FishLot.CONSUMED_to_RELEASED"
          - "calculations.rice_yield_ceiling"
          - "entities.FishLot.fields.allocated_kg"
          - "entities.FishLot.fields.remaining_kg"
          - "entities.ProductionPlan.fields.actual_pack_count"
        distinguishing_aspect: |
          CONSERVED QUANTITY: fish mass in kilograms on a single FishLot. The invariant
          allocated_kg + remaining_kg == net_weight_kg must hold before, during and after the compensation,
          and the allocate-then-void round trip must leave exactly zero drift at 3 decimal places.
        test_recipe:
          setup:
            - "clock at 2026-08-03T11:00:00Z"
            - "a commissioned kiosk with a RELEASED plan for 2026-08-03 whose planned_pack_count is 162"
            - "an APPROVED 21.6 kg rice batch with max_pack_yield 180"
            - "a RELEASED exempt tuna lot whose net_weight_kg is exactly 7.200"
            - "an ON_SHELF pack lot of 160 packs at 900 cents with sold_count 0, which consumed exactly 7.200 kg and drove the fish lot to CONSUMED with remaining_kg 0.000"
            - "the plan reads actual_pack_count 160"
          setup_api_calls:
            - call: "POST /kiosk-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T11:00:00Z" }
              as: FranchisorOps
            - call: "POST /kiosk-ops/host-stores"
              payload: { name: "Northgate Market 418", banner_chain: "Northgate", store_number: "418", state_code: "CA", weekly_traffic_count: 63000, sushi_space_sqft: 240, refrigerated_case_linear_ft: 20.0, refrigerated_case_capacity_packs: 400 }
              as: FranchisorOps
              captures: { hs_id: $.data.id }
            - call: "POST /kiosk-ops/host-stores/${hs_id}/pos-integration"
              payload: { pos_integration_status: "CONNECTED", pos_terminal_count: 6 }
              as: HostStoreManager
              as_user_id: "${hs_id}"
            - call: "POST /kiosk-ops/host-stores/${hs_id}/space-attestation"
              payload: { attested_sushi_space_sqft: 240, attested_case_linear_ft: 20.0, attested_on: "2026-08-01" }
              as: HostStoreManager
              as_user_id: "${hs_id}"
            - call: "POST /kiosk-ops/license-agreements"
              payload: { host_store_id: "${hs_id}", revenue_share_model: "GROSS_SALES", markdown_policy: "PRORATED_REMAINING_LIFE", min_space_sqft_obligation: 220, min_case_linear_ft_obligation: 18.0, space_credit_cents_per_sqft: 1250, effective_from: "2026-08-01", effective_to: "2027-07-31" }
              as: FranchisorOps
              captures: { la_id: $.data.id }
            - call: "POST /kiosk-ops/license-agreements/${la_id}/activate"
              as: FranchisorOps
            - call: "POST /kiosk-ops/chefs"
