              as: PlanSponsorAdmin
              captures: { v_tpa: "$.data.id" }
            - call: "POST /compliance/contracts"
              payload: { plan_year_id: "${py}", vendor_id: "${v_tpa}", contract_type: "TPA", term_start: "2027-01-01", term_end: "2028-01-01", annual_fee_cents: 48000000 }
              as: PlanSponsorAdmin
            - call: "POST /compliance/plan-years/${py}/activate"
              payload: {}
              as: PlanSponsorAdmin
            - call: "POST /compliance/vendors"
              payload: { legal_name: "Pinehurst Benefits Consulting", vendor_type: "CONSULTANT", contact_email: "advisors@pinehurst.example" }
              as: PlanSponsorAdmin
              captures: { v_cx: "$.data.id" }
            - call: "POST /compliance/contracts"
              payload: { plan_year_id: "${py}", vendor_id: "${v_cx}", contract_type: "CONSULTANT", term_start: "2027-01-01", term_end: "2028-01-01", annual_fee_cents: 875000 }
              as: PlanSponsorAdmin
              captures: { c_cx: "$.data.id" }
            - call: "POST /compliance/vendors"
              payload: { legal_name: "Lakeshore Actuarial Advisors", vendor_type: "CONSULTANT", contact_email: "team@lakeshore.example" }
              as: PlanSponsorAdmin
              captures: { v_cy: "$.data.id" }
            - call: "POST /compliance/contracts"
              payload: { plan_year_id: "${py}", vendor_id: "${v_cy}", contract_type: "CONSULTANT", term_start: "2027-01-01", term_end: "2028-01-01", annual_fee_cents: 874750 }
              as: PlanSponsorAdmin
