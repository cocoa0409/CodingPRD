              as: SystemIngestion
              captures: { dr_r1: $.data.id }
            - call: "POST /vehicles/${veh_v1}/diagnostic-reports"
              payload: { odometer_km: 20010, engine_hours: 801, dtc_codes: ["P0420"], oil_life_pct: 35 }
              as: SystemIngestion
              captures: { dr_r2: $.data.id }
            - call: "POST /dealers/${dl_d1}/appointments"
              payload: { vehicle_id: "${veh_v1}", diagnostic_report_id: "${dr_r1}", scheduled_date: "2026-09-10" }
              as: DealerService
              captures: { ap_1: $.data.id }
            - call: "POST /dealers/${dl_d2}/appointments"
              payload: { vehicle_id: "${veh_v1}", diagnostic_report_id: "${dr_r2}", scheduled_date: "2026-09-10" }
              as: DealerService
              captures: { ap_2: $.data.id }
          trigger:
            - call: "POST /dealers/${dl_d1}/appointments/${ap_1}/confirm"
              payload: {}
              as: DealerService
            - call: "POST /dealers/${dl_d2}/appointments/${ap_2}/confirm"
              payload: {}
              as: DealerService
              captures: { err_5: $.data.error_id }
          assert:
            - "ServiceAppointment.${ap_1}.status == CONFIRMED (dealer ACTIVE)"
            - "DiagnosticReport.${dr_r1}.status == SERVICE_SCHEDULED (cross-entity side effect of the confirm)"
            - "second confirm rejected: error_id == ERR_INVALID_STATE (dealer D2 SUSPENDED blocks its REQUESTED appointments)"
            - "DiagnosticReport.${dr_r2}.status still == GENERATED (no side effect on the rejected confirm)"

