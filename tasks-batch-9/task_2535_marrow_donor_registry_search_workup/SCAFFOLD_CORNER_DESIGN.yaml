              as: MedicalDirector
              as_user_id: "md-1"
              captures: { p_v3: "$.data.version", p_status_started: "$.data.conditioning_status" }
            - call: "POST /registry/patients/${p_id}/conditioning"
              payload: { action: "SCHEDULE", expected_patient_version: "${p_v2}", conditioning_start_date: "2026-08-09" }
