              payload: {}
              as: OperationsManager
              captures: { d_status: $.data.status }
          assert:
            - "work order status == CANCELLED"
            - "window.committed_hours == 0.00 (5 hours returned)"
            - "defect status == OPEN (WORK_ORDERED compensated)"
      - name: deploy_and_return_drive_unit_status
        claim_type: side_effect_execution
        grounds: ["state_machines.SpareUnit.RESERVED_to_DEPLOYED", "state_machines.SpareUnit.DEPLOYED_to_AVAILABLE"]
        distinguishing_aspect: "Deploy requires the clock inside the reservation window and drives the unit RESERVED->DEPLOYED; return drives it back to AVAILABLE and fulfils the reservation."
        test_recipe:
          setup: ["unit with ACTIVE reservation [2026-08-05T08:00Z, 2026-08-05T18:00Z); clock advanced into the window"]
          setup_api_calls:
            - call: "POST /spare-units"
              payload: { unit_type: "MOBILE_SUBSTATION", rating_mva: 30, voltage_class_kv: 115, impedance_pct: 8.0, home_location: "Depot-1" }
              as: OperationsManager
              captures: { unit_id: $.data.id }
            - call: "POST /spare-reservations"
              payload: { spare_unit_id: "${unit_id}", unit_type: "MOBILE_SUBSTATION", required_mva: 25, required_voltage_kv: 115, start_ts: "2026-08-05T08:00:00Z", end_ts: "2026-08-05T18:00:00Z" }
              as: OutageCoordinator
              captures: { res_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T10:00:00Z" }
              as: OperationsManager
          trigger:
            - call: "POST /spare-reservations/${res_id}/deploy"
              payload: {}
              as: OutageCoordinator
            - call: "GET /spare-units/${unit_id}"
              payload: {}
              as: OperationsManager
              captures: { unit_deployed: $.data.status }
            - call: "POST /spare-reservations/${res_id}/return"
              payload: {}
              as: OutageCoordinator
              captures: { res_status: $.data.status }
            - call: "GET /spare-units/${unit_id}"
              payload: {}
              as: OperationsManager
              captures: { unit_returned: $.data.status }
          assert:
            - "after deploy: unit.status == DEPLOYED"
            - "after return: reservation.status == FULFILLED and unit.status == AVAILABLE"
      - name: deploy_before_window_start_rejected
        claim_type: conditional_action
        grounds: ["validations[priority=14]", "errors[ERR_OUTSIDE_WINDOW]"]
        distinguishing_aspect: "Deploy is clock-gated per-reservation: at the default clock (before start_ts) deploy fails with ERR_OUTSIDE_WINDOW."
        test_recipe:
          setup: ["unit with ACTIVE reservation starting 2026-12-01; clock at default 2026-08-01"]
          setup_api_calls:
            - call: "POST /spare-units"
              payload: { unit_type: "SPARE_TRANSFORMER", rating_mva: 25, voltage_class_kv: 115, impedance_pct: 6.5, home_location: "Yard-Q" }
