            - "Every one of the eleven reads returns HTTP 404"
            - "error_id values are, in order, ERR_SECURITY_NOT_FOUND, ERR_SPONSOR_NOT_FOUND, ERR_MODEL_NOT_FOUND, ERR_MODEL_VERSION_NOT_FOUND, ERR_DISTRIBUTION_NOT_FOUND, ERR_RESTRICTION_NOT_FOUND, ERR_TRADE_ORDER_NOT_FOUND, ERR_BLOCK_NOT_FOUND, ERR_TAX_LOT_NOT_FOUND, ERR_HARVEST_PROPOSAL_NOT_FOUND, ERR_INVOICE_NOT_FOUND"
            - "Every response body carries response_type == 'error' with exactly error_id and message under data"

      - name: rebalancing_a_synced_account_returns_account_not_drifted
        claim_type: violation_to_error
        grounds: ["errors[ERR_ACCOUNT_NOT_DRIFTED]", "validations[priority=11]", "state_machines.Account.implementation_status.DRIFTED_to_DRIFTED"]
        distinguishing_aspect: "Rebalancing is gated on the drift monitor: an account that has never been evaluated is still SYNCED, so POST /sma/accounts/{id}/rebalances returns HTTP 409 ERR_ACCOUNT_NOT_DRIFTED and generates nothing."
        test_recipe:
          setup: ["Account ACC-001 holds 1,000,000c cash on published Model CORE and has never had a drift evaluation, so implementation_status is SYNCED"]
          setup_api_calls:
            - call: "POST /sma/securities"
              payload: { ticker: "ALFA", name: "Alfa Industrials", asset_class: "US_EQUITY", last_price_cents: 10000 }
