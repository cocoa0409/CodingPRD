scaffold_corner_design:

  # =========================================================================
  - section: entities
    instances:
      - name: create_member_returns_all_fields_201
        claim_type: Creation
        grounds: ["entities.Member", "endpoints"]
        distinguishing_aspect: "POST /members with email+full_name returns 201 with id, status==ACTIVE, success_fee_pct default 0.40, lifetime totals 0."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /members"
              payload: { email: "c1@x.com", full_name: "C1" }
              as: Anonymous
              captures: { m_id: "$.data.id" }
          assert:
            - "Member.${m_id}.status == ACTIVE"
            - "Member.${m_id}.success_fee_pct == 0.40"
            - "Member.${m_id}.lifetime_gross_savings_cents == 0"
            - "Member.${m_id}.version == 1"

      - name: get_member_not_found
        claim_type: Not Found
        grounds: ["entities.Member", "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /members/{nonexistent-uuid} returns ERR_NOT_FOUND 404."
        test_recipe:
          setup: ["A registered member exists for auth."]
          setup_api_calls:
            - call: "POST /members"
              payload: { email: "c2@x.com", full_name: "C2" }
              as: Anonymous
              captures: { m_id: "$.data.id" }
          trigger:
            - call: "GET /members/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: Member
              as_user_id: "${m_id}"
          assert:
            - "response.error_id == ERR_NOT_FOUND"
            - "response.http_status == 404"

      - name: create_recurring_charge_missing_required_field
        claim_type: Required Fields
        grounds: ["entities.RecurringCharge", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /recurring-charges missing amount_cents returns ERR_INVALID_REQUEST 400."
        test_recipe:
          setup: ["A member with a LINKED account."]
          setup_api_calls:
            - call: "POST /members"
              payload: { email: "c3@x.com", full_name: "C3" }
              as: Anonymous
              captures: { m_id: "$.data.id" }
            - call: "POST /linked-accounts"
              payload: { member_id: "${m_id}", institution_name: "Bank", account_type: "CHECKING" }
              as: Member
              as_user_id: "${m_id}"
              captures: { la_id: "$.data.id" }
          trigger:
            - call: "POST /recurring-charges"
              payload: { linked_account_id: "${la_id}", merchant_name: "X", cadence: "MONTHLY", first_seen_utc: "2026-01-01T00:00:00Z" }
              as: Member
              as_user_id: "${m_id}"
          assert:
            - "response.error_id == ERR_INVALID_REQUEST"
            - "response.http_status == 400"

      - name: create_recurring_charge_invalid_enum_cadence
        claim_type: Type Constraints
        grounds: ["entities.RecurringCharge.fields.cadence", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /recurring-charges with cadence='DAILY' (not in enum) returns ERR_INVALID_REQUEST 400."
        test_recipe:
          setup: ["A member with a LINKED account."]
          setup_api_calls:
            - call: "POST /members"
              payload: { email: "c4@x.com", full_name: "C4" }
              as: Anonymous
              captures: { m_id: "$.data.id" }
            - call: "POST /linked-accounts"
              payload: { member_id: "${m_id}", institution_name: "Bank", account_type: "CHECKING" }
              as: Member
              as_user_id: "${m_id}"
              captures: { la_id: "$.data.id" }
          trigger:
            - call: "POST /recurring-charges"
              payload: { linked_account_id: "${la_id}", merchant_name: "X", amount_cents: 1000, cadence: "DAILY", first_seen_utc: "2026-01-01T00:00:00Z" }
              as: Member
              as_user_id: "${m_id}"
          assert:
            - "response.error_id == ERR_INVALID_REQUEST"
            - "response.http_status == 400"

      - name: charge_amount_below_min_range
        claim_type: Type Constraints
        grounds: ["entities.RecurringCharge.fields.amount_cents", "validations[priority=7]", "errors[ERR_VALUE_OUT_OF_RANGE]"]
        distinguishing_aspect: "POST /recurring-charges with amount_cents=0 violates >=1 and returns ERR_VALUE_OUT_OF_RANGE 422."
        test_recipe:
          setup: ["A member with a LINKED account."]
          setup_api_calls:
            - call: "POST /members"
              payload: { email: "c5@x.com", full_name: "C5" }
              as: Anonymous
              captures: { m_id: "$.data.id" }
            - call: "POST /linked-accounts"
              payload: { member_id: "${m_id}", institution_name: "Bank", account_type: "CHECKING" }
              as: Member
              as_user_id: "${m_id}"
              captures: { la_id: "$.data.id" }
          trigger:
            - call: "POST /recurring-charges"
              payload: { linked_account_id: "${la_id}", merchant_name: "X", amount_cents: 0, cadence: "MONTHLY", first_seen_utc: "2026-01-01T00:00:00Z" }
              as: Member
              as_user_id: "${m_id}"
          assert:
            - "response.error_id == ERR_VALUE_OUT_OF_RANGE"
            - "response.http_status == 422"

      - name: charge_default_category_other_applied
        claim_type: Defaults
        grounds: ["entities.RecurringCharge.fields.category"]
        distinguishing_aspect: "POST /recurring-charges without category defaults category to OTHER."
        test_recipe:
          setup: ["A member with a LINKED account."]
          setup_api_calls:
            - call: "POST /members"
              payload: { email: "c6@x.com", full_name: "C6" }
              as: Anonymous
              captures: { m_id: "$.data.id" }
            - call: "POST /linked-accounts"
              payload: { member_id: "${m_id}", institution_name: "Bank", account_type: "CHECKING" }
              as: Member
              as_user_id: "${m_id}"
              captures: { la_id: "$.data.id" }
          trigger:
            - call: "POST /recurring-charges"
              payload: { linked_account_id: "${la_id}", merchant_name: "X", amount_cents: 1000, cadence: "MONTHLY", first_seen_utc: "2026-01-01T00:00:00Z" }
              as: Member
              as_user_id: "${m_id}"
              captures: { rc_id: "$.data.id" }
          assert:
            - "RecurringCharge.${rc_id}.category == OTHER"
            - "RecurringCharge.${rc_id}.status == DETECTED"

      - name: annualize_weekly_charge_computed
        claim_type: Computed Fields
        grounds: ["calculations.annualize_charge_cost", "entities.RecurringCharge.fields.annualized_cost_cents"]
        distinguishing_aspect: "A WEEKLY charge of 1000 yields annualized_cost_cents == 52000 (1000*52), not 12000."
        test_recipe:
          setup: ["A member with a LINKED account."]
          setup_api_calls:
            - call: "POST /members"
              payload: { email: "c7@x.com", full_name: "C7" }
              as: Anonymous
              captures: { m_id: "$.data.id" }
            - call: "POST /linked-accounts"
              payload: { member_id: "${m_id}", institution_name: "Bank", account_type: "CHECKING" }
              as: Member
              as_user_id: "${m_id}"
              captures: { la_id: "$.data.id" }
          trigger:
            - call: "POST /recurring-charges"
              payload: { linked_account_id: "${la_id}", merchant_name: "GymCo", amount_cents: 1000, cadence: "WEEKLY", category: "OTHER", first_seen_utc: "2026-01-01T00:00:00Z" }
              as: Member
              as_user_id: "${m_id}"
              captures: { rc_id: "$.data.id" }
          assert:
            - "RecurringCharge.${rc_id}.annualized_cost_cents == 52000"

      - name: listing_pagination_envelope
        claim_type: Listing
        grounds: ["entities.RecurringCharge", "endpoints"]
        distinguishing_aspect: "GET /recurring-charges?linked_account_id=X returns array with total_count and has_more in meta/pagination."
        test_recipe:
          setup: ["A member with a LINKED account holding two detected charges."]
          setup_api_calls:
            - call: "POST /members"
              payload: { email: "c8@x.com", full_name: "C8" }
              as: Anonymous
              captures: { m_id: "$.data.id" }
            - call: "POST /linked-accounts"
              payload: { member_id: "${m_id}", institution_name: "Bank", account_type: "CHECKING" }
              as: Member
              as_user_id: "${m_id}"
              captures: { la_id: "$.data.id" }
            - call: "POST /recurring-charges"
              payload: { linked_account_id: "${la_id}", merchant_name: "A", amount_cents: 1000, cadence: "MONTHLY", first_seen_utc: "2026-01-01T00:00:00Z" }
              as: Member
              as_user_id: "${m_id}"
            - call: "POST /recurring-charges"
              payload: { linked_account_id: "${la_id}", merchant_name: "B", amount_cents: 2000, cadence: "MONTHLY", first_seen_utc: "2026-01-01T00:00:00Z" }
              as: Member
              as_user_id: "${m_id}"
          trigger:
            - call: "GET /recurring-charges?linked_account_id=${la_id}"
              payload: {}
              as: Member
              as_user_id: "${m_id}"
          assert:
            - "response.total_count == 2"
            - "response.has_more == false"

      - name: system_fields_ignored_on_create
        claim_type: System Fields
        grounds: ["entities.Member"]
        distinguishing_aspect: "POST /members ignores any client-supplied status/lifetime fields; server forces status=ACTIVE and lifetime totals 0."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /members"
              payload: { email: "c9@x.com", full_name: "C9" }
              as: Anonymous
              captures: { m_id: "$.data.id" }
          assert:
            - "Member.${m_id}.status == ACTIVE"
            - "Member.${m_id}.lifetime_member_savings_cents == 0"

  # =========================================================================
  - section: state_machines
    instances:
      - name: confirm_already_confirmed_charge_invalid_state
        claim_type: invalid_transition
        grounds: ["state_machines.RecurringCharge.DETECTED_to_CONFIRMED", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Confirming a charge already CONFIRMED returns ERR_INVALID_STATE 409; no side effects."
        test_recipe:
          setup: ["A member, LINKED account, a CONFIRMED charge."]
          setup_api_calls:
            - call: "POST /members"
              payload: { email: "s1@x.com", full_name: "S1" }
              as: Anonymous
              captures: { m_id: "$.data.id" }
            - call: "POST /linked-accounts"
              payload: { member_id: "${m_id}", institution_name: "Bank", account_type: "CHECKING" }
              as: Member
              as_user_id: "${m_id}"
              captures: { la_id: "$.data.id" }
            - call: "POST /recurring-charges"
              payload: { linked_account_id: "${la_id}", merchant_name: "X", amount_cents: 1000, cadence: "MONTHLY", first_seen_utc: "2026-01-01T00:00:00Z" }
              as: Member
              as_user_id: "${m_id}"
              captures: { rc_id: "$.data.id" }
            - call: "POST /recurring-charges/${rc_id}/confirm"
              payload: {}
              as: Member
              as_user_id: "${m_id}"
          trigger:
            - call: "POST /recurring-charges/${rc_id}/confirm"
              payload: {}
              as: Member
              as_user_id: "${m_id}"
          assert:
            - "response.error_id == ERR_INVALID_STATE"
            - "response.http_status == 409"

      - name: terminal_dismissed_charge_no_transitions
        claim_type: terminal_state_lockdown
        grounds: ["state_machines.RecurringCharge", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Confirming a DISMISSED (terminal) charge returns ERR_INVALID_STATE 409."
        test_recipe:
          setup: ["A member, LINKED account, a DISMISSED charge."]
          setup_api_calls:
            - call: "POST /members"
              payload: { email: "s2@x.com", full_name: "S2" }
              as: Anonymous
              captures: { m_id: "$.data.id" }
            - call: "POST /linked-accounts"
              payload: { member_id: "${m_id}", institution_name: "Bank", account_type: "CHECKING" }
              as: Member
              as_user_id: "${m_id}"
              captures: { la_id: "$.data.id" }
            - call: "POST /recurring-charges"
              payload: { linked_account_id: "${la_id}", merchant_name: "X", amount_cents: 1000, cadence: "MONTHLY", first_seen_utc: "2026-01-01T00:00:00Z" }
              as: Member
              as_user_id: "${m_id}"
              captures: { rc_id: "$.data.id" }
            - call: "POST /recurring-charges/${rc_id}/dismiss"
              payload: {}
              as: Member
              as_user_id: "${m_id}"
          trigger:
            - call: "POST /recurring-charges/${rc_id}/confirm"
              payload: {}
              as: Member
              as_user_id: "${m_id}"
          assert:
            - "response.error_id == ERR_INVALID_STATE"
            - "response.http_status == 409"

      - name: initial_state_subscription_active
        claim_type: initial_state
        grounds: ["state_machines.Subscription", "entities.Subscription.fields.status"]
        distinguishing_aspect: "A newly created Subscription has status==ACTIVE."
        test_recipe:
          setup: ["A member with a CONFIRMED charge."]
          setup_api_calls:
            - call: "POST /members"
              payload: { email: "s3@x.com", full_name: "S3" }
              as: Anonymous
              captures: { m_id: "$.data.id" }
            - call: "POST /linked-accounts"
              payload: { member_id: "${m_id}", institution_name: "Bank", account_type: "CHECKING" }
              as: Member
              as_user_id: "${m_id}"
              captures: { la_id: "$.data.id" }
            - call: "POST /recurring-charges"
              payload: { linked_account_id: "${la_id}", merchant_name: "X", amount_cents: 1000, cadence: "MONTHLY", first_seen_utc: "2026-01-01T00:00:00Z" }
              as: Member
              as_user_id: "${m_id}"
              captures: { rc_id: "$.data.id" }
            - call: "POST /recurring-charges/${rc_id}/confirm"
              payload: {}
              as: Member
              as_user_id: "${m_id}"
          trigger:
            - call: "POST /subscriptions"
              payload: { member_id: "${m_id}", recurring_charge_id: "${rc_id}", plan_name: "P", monthly_cost_cents: 1000 }
              as: Member
              as_user_id: "${m_id}"
              captures: { sub_id: "$.data.id" }
          assert:
            - "Subscription.${sub_id}.status == ACTIVE"

      - name: cancel_failed_retry_request_cancel_cycle
        claim_type: valid_transition
        grounds: ["state_machines.Subscription.CANCEL_FAILED_to_CANCEL_REQUESTED"]
        distinguishing_aspect: "A CANCEL_FAILED subscription can be re-requested back to CANCEL_REQUESTED via request-cancel (retry loop)."
        test_recipe:
          setup: ["A member with a CONFIRMED charge and a Subscription driven to CANCEL_FAILED."]
          setup_api_calls:
            - call: "POST /members"
              payload: { email: "s4@x.com", full_name: "S4" }
              as: Anonymous
              captures: { m_id: "$.data.id" }
            - call: "POST /linked-accounts"
              payload: { member_id: "${m_id}", institution_name: "Bank", account_type: "CHECKING" }
              as: Member
              as_user_id: "${m_id}"
              captures: { la_id: "$.data.id" }
            - call: "POST /recurring-charges"
              payload: { linked_account_id: "${la_id}", merchant_name: "X", amount_cents: 1000, cadence: "MONTHLY", first_seen_utc: "2026-01-01T00:00:00Z" }
              as: Member
              as_user_id: "${m_id}"
              captures: { rc_id: "$.data.id" }
            - call: "POST /recurring-charges/${rc_id}/confirm"
              payload: {}
              as: Member
              as_user_id: "${m_id}"
            - call: "POST /subscriptions"
              payload: { member_id: "${m_id}", recurring_charge_id: "${rc_id}", plan_name: "P", monthly_cost_cents: 1000 }
              as: Member
              as_user_id: "${m_id}"
              captures: { sub_id: "$.data.id", v0: "$.data.version" }
            - call: "POST /subscriptions/${sub_id}/request-cancel"
              payload: { expected_subscription_version: "${v0}" }
              as: Member
              as_user_id: "${m_id}"
            - call: "POST /subscriptions/${sub_id}/fail-cancel"
              payload: {}
              as: ConciergeAgent
              as_user_id: "agent-x"
              captures: { v_failed: "$.data.version" }
          trigger:
            - call: "POST /subscriptions/${sub_id}/request-cancel"
              payload: { expected_subscription_version: "${v_failed}" }
              as: Member
              as_user_id: "${m_id}"
          assert:
            - "Subscription.${sub_id}.status == CANCEL_REQUESTED"

      - name: confirm_cancel_sets_cancelled_utc_side_effect
        claim_type: side_effect_execution
        grounds: ["state_machines.Subscription.CANCEL_REQUESTED_to_CANCELLED", "entities.Subscription.fields.cancelled_utc"]
        distinguishing_aspect: "confirm-cancel sets cancelled_utc to SystemClock.current_utc (2026-03-15T00:00:00Z) and reminder_due=false."
        test_recipe:
          setup: ["A CANCEL_REQUESTED subscription; clock at 2026-03-15T00:00:00Z."]
          setup_api_calls:
            - call: "POST /members"
              payload: { email: "s5@x.com", full_name: "S5" }
              as: Anonymous
              captures: { m_id: "$.data.id" }
            - call: "POST /linked-accounts"
              payload: { member_id: "${m_id}", institution_name: "Bank", account_type: "CHECKING" }
              as: Member
              as_user_id: "${m_id}"
              captures: { la_id: "$.data.id" }
            - call: "POST /recurring-charges"
              payload: { linked_account_id: "${la_id}", merchant_name: "X", amount_cents: 1000, cadence: "MONTHLY", first_seen_utc: "2026-01-01T00:00:00Z" }
              as: Member
              as_user_id: "${m_id}"
              captures: { rc_id: "$.data.id" }
            - call: "POST /recurring-charges/${rc_id}/confirm"
              payload: {}
              as: Member
              as_user_id: "${m_id}"
            - call: "POST /subscriptions"
              payload: { member_id: "${m_id}", recurring_charge_id: "${rc_id}", plan_name: "P", monthly_cost_cents: 1000 }
              as: Member
              as_user_id: "${m_id}"
              captures: { sub_id: "$.data.id", v0: "$.data.version" }
            - call: "POST /subscriptions/${sub_id}/request-cancel"
              payload: { expected_subscription_version: "${v0}" }
              as: Member
              as_user_id: "${m_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-15T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /subscriptions/${sub_id}/confirm-cancel"
              payload: {}
              as: ConciergeAgent
              as_user_id: "agent-x"
          assert:
            - "Subscription.${sub_id}.status == CANCELLED"
            - "Subscription.${sub_id}.cancelled_utc == 2026-03-15T00:00:00.000Z"

      - name: max_rounds_reached_on_propose
        claim_type: precondition_enforcement
        grounds: ["state_machines.NegotiationCase.COUNTERED_to_PROPOSED", "validations[priority=12]", "errors[ERR_MAX_ROUNDS_REACHED]"]
        distinguishing_aspect: "After MAX_ROUNDS proposals, a further propose from COUNTERED returns ERR_MAX_ROUNDS_REACHED 409."
        test_recipe:
          setup: ["A case driven through propose/counter until round_count == MAX_ROUNDS (3), status COUNTERED."]
          setup_api_calls:
            - call: "POST /members"
              payload: { email: "s6@x.com", full_name: "S6" }
              as: Anonymous
              captures: { m_id: "$.data.id" }
            - call: "POST /linked-accounts"
              payload: { member_id: "${m_id}", institution_name: "Bank", account_type: "CHECKING" }
              as: Member
              as_user_id: "${m_id}"
              captures: { la_id: "$.data.id" }
            - call: "POST /recurring-charges"
              payload: { linked_account_id: "${la_id}", merchant_name: "X", amount_cents: 5000, cadence: "MONTHLY", first_seen_utc: "2026-01-01T00:00:00Z" }
              as: Member
              as_user_id: "${m_id}"
              captures: { rc_id: "$.data.id" }
            - call: "POST /recurring-charges/${rc_id}/confirm"
              payload: {}
              as: Member
              as_user_id: "${m_id}"
            - call: "POST /concierge-agents"
              payload: { display_name: "A", max_open_cases: 5 }
              as: PlatformAdmin
              captures: { ag_id: "$.data.id" }
            - call: "POST /negotiation-cases"
              payload: { member_id: "${m_id}", recurring_charge_id: "${rc_id}", assigned_agent_id: "${ag_id}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { nc_id: "$.data.id" }
            - call: "POST /negotiation-cases/${nc_id}/propose"
              payload: { offered_annual_cost_cents: 58000 }
              as: ConciergeAgent
              as_user_id: "${ag_id}"
            - call: "POST /negotiation-cases/${nc_id}/counter"
              payload: { counter_annual_cost_cents: 57000 }
              as: ConciergeAgent
              as_user_id: "${ag_id}"
            - call: "POST /negotiation-cases/${nc_id}/propose"
              payload: { offered_annual_cost_cents: 56000 }
              as: ConciergeAgent
              as_user_id: "${ag_id}"
            - call: "POST /negotiation-cases/${nc_id}/counter"
              payload: { counter_annual_cost_cents: 55000 }
              as: ConciergeAgent
              as_user_id: "${ag_id}"
            - call: "POST /negotiation-cases/${nc_id}/propose"
              payload: { offered_annual_cost_cents: 54000 }
              as: ConciergeAgent
              as_user_id: "${ag_id}"
            - call: "POST /negotiation-cases/${nc_id}/counter"
              payload: { counter_annual_cost_cents: 53000 }
              as: ConciergeAgent
              as_user_id: "${ag_id}"
          trigger:
            - call: "POST /negotiation-cases/${nc_id}/propose"
              payload: { offered_annual_cost_cents: 52000 }
              as: ConciergeAgent
              as_user_id: "${ag_id}"
          assert:
            - "response.error_id == ERR_MAX_ROUNDS_REACHED"
            - "response.http_status == 409"
            - "NegotiationCase.${nc_id}.round_count == 3"

      - name: max_dispute_rounds_reached
        claim_type: precondition_enforcement
        grounds: ["state_machines.RefundClaim.DENIED_to_DISPUTED", "validations[priority=13]", "errors[ERR_MAX_DISPUTE_ROUNDS_REACHED]"]
        distinguishing_aspect: "After MAX_DISPUTE_ROUNDS (2) disputes, a further dispute from DENIED returns ERR_MAX_DISPUTE_ROUNDS_REACHED 409."
        test_recipe:
          setup: ["A claim disputed twice and denied again so dispute_round==2 and status==DENIED."]
          setup_api_calls:
            - call: "POST /members"
              payload: { email: "s7@x.com", full_name: "S7" }
              as: Anonymous
              captures: { m_id: "$.data.id" }
            - call: "POST /linked-accounts"
              payload: { member_id: "${m_id}", institution_name: "Bank", account_type: "CHECKING" }
              as: Member
              as_user_id: "${m_id}"
              captures: { la_id: "$.data.id" }
            - call: "POST /recurring-charges"
              payload: { linked_account_id: "${la_id}", merchant_name: "X", amount_cents: 2000, cadence: "MONTHLY", first_seen_utc: "2026-01-01T00:00:00Z" }
              as: Member
              as_user_id: "${m_id}"
              captures: { rc_id: "$.data.id" }
            - call: "POST /recurring-charges/${rc_id}/confirm"
