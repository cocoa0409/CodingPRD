scenario: "desgin task harder than expert level.!!!!2178. Continuing Education & Non-Credit Registration (university extension school): course catalog & term/rolling offerings, registration/payment & corporate voucher, CEU award & completion certificate, instructor contracting & pay per enrollment, minimum-enrollment cancellation decision, refund/transfer policy, credit-for-prior-learning conversion pathway, marketing list & repeat-learner tracking"
domain_name: continuing-ed-noncredit
api_prefix: ""

complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: ledger_reconciliation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers

  entity_topology: graph
  # Course self-references (prerequisite_course_id), Registration self-references
  # (transferred_to_registration_id), CplCitation is a true many-to-many junction
  # between CplPetition and CompletionRecord, and Registration is itself a
  # junction of Learner x Offering. No URL nesting expresses ownership except for
  # creation-in-context endpoints.

  state_machine_shape: parallel
  # Registration carries two independent state axes (enrollment_status x
  # payment_status). Offering additionally cycles OPEN <-> WAITLIST_ONLY and
  # forks at census into CENSUS_LOCKED or CANCELLED with divergent side-effect
  # sets. CplPetition cycles UNDER_REVIEW -> REVISION_REQUESTED -> SUBMITTED.
  # RefundTransferRequest forks SUBMITTED -> {REFUND_APPROVED, TRANSFER_APPROVED}
  # and joins at SETTLED.

  relationship_patterns:
    - one_to_many
    - many_to_many
    - self_referential
    - cross_aggregate

  role_model: segregation_of_duties
  # A ProgramAdmin who records the CPL assessment (sets UNDER_REVIEW or requests
  # a revision) may never be the ProgramAdmin who approves that petition.

  consistency_model: immediate

  difficulty_level: expert_plus
  # 13 entities / 57 endpoints / 38 errors / 10 calculations / 9 state machines / 29 ordered validations.

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# ---------------------------------------------------------------------------
# 1.1 Entity-Relationship Table
# ---------------------------------------------------------------------------
entities:

  - name: Course
    parent: null
    common_fields: true
    fields:
      - name: course_code
        type: string
        source: input
        description: "Catalog code, unique across all Courses (case-sensitive exact match)."
        constraints: "1-32 chars; uniqueness violation -> ERR_INVALID_REQUEST"
      - name: title
        type: string
        source: input
        description: "Human-readable catalog title."
      - name: ceu_units
        type: number
        source: input
        description: "Continuing Education Units awarded on completion; one decimal place."
        constraints: "> 0 and <= 10.0; exactly one decimal place"
      - name: contact_hours
        type: number
        source: input
        description: "Instructional contact hours backing the CEU award."
        constraints: "> 0"
      - name: list_price_cents
        type: integer
        source: input
        description: "Catalog reference price in cents; Offerings may override with their own tuition_cents."
        constraints: ">= 0"
      - name: delivery_mode
        type: enum
        source: input
        description: "Delivery modality of the course."
        constraints: "IN_PERSON | ONLINE_SYNC | ONLINE_ASYNC"
      - name: prerequisite_course_id
        type: string
        source: input
        description: "FK -> Course.id; self-referential prerequisite. null when the course has no prerequisite."
        default: null
        constraints: "MUST NOT equal the course's own id; MUST NOT create a prerequisite cycle"
      - name: cpl_credit_units
        type: number
        source: input
        description: "Academic credit units this course is worth when awarded through the credit-for-prior-learning pathway."
        constraints: "> 0; one decimal place"
      - name: status
        type: enum
        source: system
        description: "Catalog lifecycle state."
        default: ACTIVE
        constraints: "ACTIVE | RETIRED"
      - name: active_offering_count
        type: integer
        source: computed
        description: "Count of Offerings on this Course whose status IN {DRAFT, OPEN, WAITLIST_ONLY, CENSUS_LOCKED}."
        default: 0

  - name: Offering
    parent: null
    common_fields: true
    fields:
      - name: course_id
        type: string
        source: input
        description: "FK -> Course.id; the catalog course this section delivers."
      - name: scheduling_mode
        type: enum
        source: input
        description: "TERM offerings belong to an academic term; ROLLING offerings start on demand."
        constraints: "TERM | ROLLING"
      - name: term_code
        type: string
        source: input
        description: "Academic term label such as 2026FA. REQUIRED when scheduling_mode == TERM, MUST be omitted or null when scheduling_mode == ROLLING."
        default: null
      - name: start_date
        type: datetime
        source: input
        description: "ISO 8601 UTC instant at which instruction begins."
      - name: end_date
        type: datetime
        source: input
        description: "ISO 8601 UTC instant at which instruction ends."
        constraints: "MUST be strictly greater than start_date"
      - name: census_at
        type: datetime
        source: input
        description: "ISO 8601 UTC instant at or after which the minimum-enrollment cancellation decision may be taken."
        constraints: "MUST be <= start_date"
      - name: session_count
        type: integer
        source: input
        description: "Number of scheduled class sessions; denominator of the attendance ratio."
        constraints: ">= 1"
      - name: min_enrollment
        type: integer
        source: input
        description: "Minimum paid enrollment headcount required at census for the offering to run."
        constraints: ">= 1"
      - name: max_enrollment
        type: integer
        source: input
        description: "Seat capacity. Confirmed enrollments beyond this go to the waitlist."
        constraints: ">= min_enrollment"
      - name: tuition_cents
        type: integer
        source: input
        description: "Section tuition in cents; overrides Course.list_price_cents for pricing."
        constraints: ">= 0"
      - name: status
        type: enum
        source: system
        description: "Offering lifecycle state."
        default: DRAFT
        constraints: "DRAFT | OPEN | WAITLIST_ONLY | CENSUS_LOCKED | COMPLETED | CANCELLED"
      - name: cancellation_reason
        type: enum
        source: system
        description: "Why the offering was cancelled; null while not CANCELLED."
        default: null
        constraints: "MIN_ENROLLMENT_NOT_MET | ADMIN_DISCRETION | null"
      - name: confirmed_enrollment_count
        type: integer
        source: computed
        description: "Count of Registrations on this Offering with enrollment_status == ENROLLED."
        default: 0
      - name: paid_enrollment_count
        type: integer
        source: computed
        description: "Count of Registrations on this Offering with enrollment_status == ENROLLED AND payment_status IN {PAID, VOUCHER_COMMITTED}."
        default: 0
      - name: waitlist_count
        type: integer
        source: computed
        description: "Count of Registrations on this Offering with enrollment_status == WAITLISTED."
        default: 0
      - name: net_program_revenue_cents
        type: integer
        source: computed
        description: "Output of calculation offering_net_program_revenue; recomputed on every payment, refund settlement, census decision and completion."
        default: 0

  - name: Learner
    parent: null
    common_fields: true
    fields:
      - name: email
        type: string
        source: input
        description: "Login/contact email, unique across all Learners (case-insensitive)."
      - name: full_name
        type: string
        source: input
        description: "Learner display name."
      - name: marketing_opt_in
        type: boolean
        source: input
        description: "Whether the learner consented to the extension school marketing list at signup."
        default: true
      - name: marketing_status
        type: enum
        source: system
        description: "Current marketing-list standing; SUBSCRIBED at creation when marketing_opt_in is true, UNSUBSCRIBED otherwise."
        default: SUBSCRIBED
        constraints: "SUBSCRIBED | UNSUBSCRIBED"
      - name: lifetime_completed_count
        type: integer
        source: computed
        description: "Count of CompletionRecords for this Learner whose status == ISSUED."
        default: 0
      - name: lifetime_ceu_total
        type: number
        source: computed
        description: "Sum of ceu_awarded over this Learner's CompletionRecords whose status == ISSUED; one decimal place."
        default: 0.0
      - name: loyalty_tier
        type: enum
        source: computed
        description: "Repeat-learner tier derived from lifetime_completed_count by calculation learner_loyalty_and_ceu."
        default: NEW
        constraints: "NEW | RETURNING | LOYAL | CHAMPION"

  - name: Instructor
    parent: null
    common_fields: true
    fields:
      - name: email
        type: string
        source: input
        description: "Contact email, unique across all Instructors (case-insensitive)."
      - name: full_name
        type: string
        source: input
        description: "Instructor display name."
      - name: credential_level
        type: enum
        source: input
        description: "Pay multiplier band for this instructor."
        constraints: "ADJUNCT | SENIOR | MASTER"
      - name: active_contract_count
        type: integer
        source: computed
        description: "Count of this Instructor's InstructorContracts whose status IN {SIGNED, ACTIVE}."
        default: 0

  - name: CorporateAccount
    parent: null
    common_fields: true
    fields:
      - name: org_name
        type: string
        source: input
        description: "Sponsoring organisation name."
      - name: billing_email
        type: string
        source: input
        description: "Invoice contact for the sponsor."
      - name: status
        type: enum
        source: system
        description: "Account standing; SUSPENDED accounts cannot issue or redeem vouchers."
        default: ACTIVE
        constraints: "ACTIVE | SUSPENDED"
      - name: funded_cents
        type: integer
        source: computed
        description: "Sum of all deposit amounts posted to this account; monotonically non-decreasing."
        default: 0
      - name: available_cents
        type: integer
        source: computed
        description: "funded_cents minus the sum of face_value_cents over this account's Vouchers whose status != VOIDED."
        default: 0
      - name: unallocated_voucher_cents
        type: integer
        source: computed
        description: "Sum of remaining_cents over this account's Vouchers whose status != VOIDED."
        default: 0
      - name: committed_cents
        type: integer
        source: computed
        description: "Sum of committed_cents over this account's Vouchers whose status != VOIDED."
        default: 0
      - name: consumed_cents
        type: integer
        source: computed
        description: "Sum of consumed_cents over this account's Vouchers whose status != VOIDED."
        default: 0

  - name: Voucher
    parent: null
    common_fields: true
    fields:
      - name: corporate_account_id
        type: string
        source: input
        description: "FK -> CorporateAccount.id; the sponsor whose funds back this voucher."
      - name: assigned_learner_id
        type: string
        source: system
        description: "FK -> Learner.id; null until POST /vouchers/{id}/assign binds the voucher to a learner."
        default: null
      - name: face_value_cents
        type: integer
        source: input
        description: "Total value drawn from the sponsor's available_cents when the voucher is issued."
        constraints: "> 0"
      - name: remaining_cents
        type: integer
        source: computed
        description: "Unspent, uncommitted value still available on this voucher."
      - name: committed_cents
        type: integer
        source: computed
        description: "Value reserved against Registrations whose payment_status == VOUCHER_COMMITTED."
        default: 0
      - name: consumed_cents
        type: integer
        source: computed
        description: "Value irrevocably spent on Registrations whose payment_status IN {PAID, PARTIALLY_REFUNDED}."
        default: 0
      - name: expires_at
        type: datetime
        source: input
        description: "ISO 8601 UTC instant at or after which the voucher can no longer be redeemed."
      - name: status
        type: enum
        source: system
        description: "Voucher lifecycle state."
        default: ISSUED
        constraints: "ISSUED | ASSIGNED | PARTIALLY_REDEEMED | EXHAUSTED | VOIDED"

  - name: Registration
    parent: null
    common_fields: true
    fields:
      - name: offering_id
        type: string
        source: input
        description: "FK -> Offering.id; the section the learner is registering into."
      - name: learner_id
        type: string
        source: input
        description: "FK -> Learner.id; the registering learner."
      - name: voucher_id
        type: string
        source: system
        description: "FK -> Voucher.id; set by POST /registrations/{id}/pay when method == VOUCHER, null for SELF_PAY."
        default: null
      - name: transferred_to_registration_id
        type: string
        source: system
        description: "FK -> Registration.id; self-referential pointer set when this registration is settled as a TRANSFER; null otherwise."
        default: null
      - name: enrollment_status
        type: enum
        source: system
        description: "Seat dimension of the parallel state machine."
        default: PENDING
        constraints: "PENDING | ENROLLED | WAITLISTED | WITHDRAWN | TRANSFERRED_OUT | COMPLETED | NO_SHOW"
      - name: payment_status
        type: enum
        source: system
        description: "Money dimension of the parallel state machine; evolves independently of enrollment_status."
        default: UNPAID
        constraints: "UNPAID | VOUCHER_COMMITTED | PAID | PARTIALLY_REFUNDED | REFUNDED"
      - name: list_tuition_cents
        type: integer
        source: computed
        description: "Snapshot of Offering.tuition_cents taken at registration creation; step 1 of registration_price_resolution."
      - name: loyalty_discount_cents
        type: integer
        source: computed
        description: "Step 3 of registration_price_resolution, keyed on the learner's loyalty_tier as of registration creation."
        default: 0
      - name: processing_fee_cents
        type: integer
        source: computed
        description: "Step 7 of registration_price_resolution; clamped between FEE_MIN_CENTS and FEE_MAX_CENTS."
      - name: total_due_cents
        type: integer
        source: computed
        description: "Step 8 of registration_price_resolution: (list_tuition_cents - loyalty_discount_cents) + processing_fee_cents."
      - name: amount_paid_cents
        type: integer
        source: computed
        description: "Cash or voucher value actually applied to this registration."
        default: 0
      - name: amount_refunded_cents
        type: integer
        source: computed
        description: "Cumulative value returned to the payer for this registration."
        default: 0
      - name: sessions_attended
        type: integer
        source: system
        description: "Attendance counter advanced by POST /registrations/{id}/attendance."
        default: 0
      - name: total_sessions
        type: integer
        source: computed
        description: "Snapshot of Offering.session_count taken at registration creation; denominator of attendance_ratio."
      - name: enrolled_at
        type: datetime
        source: system
        description: "Logical-clock instant at which enrollment_status first became ENROLLED; null while never enrolled."
        default: null

  - name: InstructorContract
    parent: null
    common_fields: true
    fields:
      - name: offering_id
        type: string
        source: input
        description: "FK -> Offering.id; the section this contract staffs."
      - name: instructor_id
        type: string
        source: input
        description: "FK -> Instructor.id; the contracted instructor."
      - name: base_stipend_cents
        type: integer
        source: input
        description: "Guaranteed stipend paid regardless of headcount."
        constraints: ">= 0"
      - name: per_enrollment_cents
        type: integer
        source: input
        description: "Additional pay per counted enrollment."
        constraints: ">= 0"
      - name: enrollment_cap_for_pay
        type: integer
        source: input
        description: "Upper bound on the headcount that earns per_enrollment_cents."
        constraints: ">= 0"
      - name: pay_basis
        type: enum
        source: input
        description: "Selects which variant of instructor_contract_pay settles this contract."
        default: CENSUS_LOCKED
        constraints: "CENSUS_LOCKED | FINAL_COMPLETION"
      - name: status
        type: enum
        source: system
        description: "Contract lifecycle state."
        default: OFFERED
        constraints: "OFFERED | SIGNED | ACTIVE | SETTLED | DECLINED | TERMINATED_NO_FAULT"
      - name: census_headcount
        type: integer
        source: computed
        description: "Offering.paid_enrollment_count frozen at the instant POST /offerings/{id}/census locked the offering; null until then."
        default: null
      - name: final_headcount
        type: integer
        source: computed
        description: "Count of Registrations on the offering with enrollment_status == COMPLETED, evaluated at settle time."
        default: null
      - name: settled_pay_cents
        type: integer
        source: computed
        description: "Output of instructor_contract_pay under the contract's pay_basis variant; null until SETTLED."
        default: null
      - name: kill_fee_cents
        type: integer
        source: computed
        description: "Output of instructor_kill_fee; null unless the contract reached TERMINATED_NO_FAULT."
        default: null

  - name: CompletionRecord
    parent: null
    common_fields: true
    fields:
      - name: registration_id
        type: string
        source: system
        description: "FK -> Registration.id; the registration that earned this completion."
      - name: learner_id
        type: string
        source: system
        description: "FK -> Learner.id; denormalised from the registration for direct learner queries."
      - name: ceu_awarded
        type: number
        source: computed
        description: "CEU credited to the learner; output of calculation ceu_award. One decimal place."
      - name: attendance_ratio
        type: number
        source: computed
        description: "sessions_attended / total_sessions at the instant of completion, rounded half-up to 4 decimal places."
      - name: certificate_number
        type: string
        source: system
        description: "Completion certificate identifier, minted as CEU-{term_code or ROLL}-{sequence} where sequence is the 1-based position of this record among the offering's CompletionRecords ordered by created_at ASC, zero-padded to 4 digits."
      - name: issued_at
        type: datetime
        source: system
        description: "Logical-clock instant at which the certificate was issued."
      - name: status
        type: enum
        source: system
        description: "ISSUED on award; REVOKED after POST /completion-records/{id}/revoke."
        default: ISSUED
        constraints: "ISSUED | REVOKED"

  - name: CplPetition
    parent: null
    common_fields: true
    fields:
      - name: learner_id
        type: string
        source: input
        description: "FK -> Learner.id; the petitioner."
      - name: target_course_id
        type: string
        source: input
        description: "FK -> Course.id; the course whose academic credit the petition seeks."
      - name: status
        type: enum
        source: system
        description: "Petition lifecycle state; the review loop cycles UNDER_REVIEW -> REVISION_REQUESTED -> SUBMITTED."
        default: DRAFT
        constraints: "DRAFT | SUBMITTED | UNDER_REVIEW | REVISION_REQUESTED | APPROVED | DENIED"
      - name: revision_round
        type: integer
        source: computed
        description: "Number of completed revision loops; incremented by POST /cpl-petitions/{id}/request-revision."
        default: 0
      - name: assessed_by_user_id
        type: string
        source: system
        description: "X-User-ID of the ProgramAdmin who most recently moved this petition to UNDER_REVIEW or REVISION_REQUESTED; opaque operator id, never a Learner id."
        default: null
      - name: claimed_ceu_total
        type: number
        source: computed
        description: "Recency-decayed, weight-adjusted CEU total over the petition's citations; output of cpl_credit_conversion step 2. Two decimal places."
        default: null
      - name: awarded_credit_units
        type: number
        source: computed
        description: "Academic credit units granted; output of cpl_credit_conversion. null until the petition is decided."
        default: null
      - name: decision_note
        type: string
        source: input
        description: "Free-text rationale recorded by the deciding ProgramAdmin."
        default: null

  - name: CplCitation
    parent: CplPetition
    common_fields: false
    fields:
      - name: petition_id
        type: string
        source: system
        description: "FK -> CplPetition.id; taken from the creation path."
      - name: completion_record_id
        type: string
        source: input
        description: "FK -> CompletionRecord.id; the prior learning being cited."
      - name: weight
        type: number
        source: input
        description: "Fraction of the cited record's ceu_awarded that this petition claims."
        constraints: "> 0 and <= 1.0; at most two decimal places"

  - name: RefundTransferRequest
    parent: null
    common_fields: true
    fields:
      - name: registration_id
        type: string
        source: input
        description: "FK -> Registration.id; the registration being unwound or moved."
      - name: target_offering_id
        type: string
        source: input
        description: "FK -> Offering.id; destination section for a TRANSFER. MUST be null for request_type == REFUND."
        default: null
      - name: request_type
        type: enum
        source: input
        description: "Which arm of the fork this request takes."
        constraints: "REFUND | TRANSFER"
      - name: refund_basis
        type: enum
        source: input
        description: "Selects which variant of refund_amount values this request."
        default: POLICY_SCHEDULE
        constraints: "POLICY_SCHEDULE | PRO_RATA_ATTENDANCE"
      - name: days_before_start
        type: integer
        source: computed
        description: "floor((offering.start_date - logical clock now) / 86400 seconds) evaluated at request creation; may be negative."
      - name: computed_refund_cents
        type: integer
        source: computed
        description: "Output of calculation refund_amount under refund_basis; for TRANSFER requests this holds the cash residual returned after the transfer credit is applied, and is 0 until settlement."
        default: 0
      - name: status
        type: enum
        source: system
        description: "Request lifecycle state."
        default: SUBMITTED
        constraints: "SUBMITTED | REFUND_APPROVED | TRANSFER_APPROVED | DENIED | SETTLED"
      - name: settled_at
        type: datetime
        source: system
        description: "Logical-clock instant at which the request reached SETTLED; null before that."
        default: null

  - name: MarketingMembership
    parent: Learner
    common_fields: true
    fields:
      - name: learner_id
        type: string
        source: system
        description: "FK -> Learner.id; the learner this list membership belongs to."
      - name: segment
        type: enum
        source: system
        description: "Marketing segment this membership represents."
        constraints: "PROSPECT | FIRST_TIME | REPEAT | CORPORATE_SPONSORED | LAPSED"
      - name: state
        type: enum
        source: system
        description: "ACTIVE while the learner currently belongs to the segment; REMOVED once the recompute moves them out."
        default: ACTIVE
        constraints: "ACTIVE | REMOVED"
      - name: recomputed_at
        type: datetime
        source: system
        description: "Logical-clock instant of the most recent marketing_segment_recompute run that touched this membership."

# ---------------------------------------------------------------------------
# 1.2 State Machine Table
# ---------------------------------------------------------------------------
state_machines:

  - entity: Course
    initial_state: ACTIVE
    terminal_states: [RETIRED]
    transitions:
      - from: ACTIVE
        to: RETIRED
        trigger: "POST /courses/{id}/retire"
        actor: ProgramAdmin
        preconditions:
          - "course.active_offering_count == 0"
        side_effects:
          - "Course.status := RETIRED"
          - "increments Course.version by 1"
        note: "A RETIRED course may not back a new Offering (ERR_COURSE_RETIRED) and may not be a CplPetition.target_course_id."

  - entity: Offering
    initial_state: DRAFT
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: DRAFT
        to: OPEN
        trigger: "POST /offerings/{id}/open"
        actor: ProgramAdmin
        preconditions:
          - "offering.status == DRAFT"
          - "course.status == ACTIVE"
          - "at least one InstructorContract exists with offering_id == offering.id AND status IN {SIGNED, ACTIVE}"
          - "logical clock now < offering.start_date"
        side_effects:
          - "Offering.status := OPEN"
          - "increments Offering.version by 1"

      - from: OPEN
        to: WAITLIST_ONLY
        trigger: "system: a Registration on this Offering reaches enrollment_status == ENROLLED and confirmed_enrollment_count thereby equals max_enrollment"
        actor: system
        preconditions:
          - "offering.status == OPEN"
          - "offering.confirmed_enrollment_count == offering.max_enrollment after the seat is taken"
        side_effects:
          - "Offering.status := WAITLIST_ONLY"
          - "increments Offering.version by 1"
        note: "Auto-transition fired inside POST /registrations/{id}/pay; no separate endpoint."

      - from: WAITLIST_ONLY
        to: OPEN
        trigger: "system: a seat is released because a Registration leaves enrollment_status == ENROLLED (settled refund, settled transfer, or offering-cancellation cascade) and no WAITLISTED registration is available to promote"
        actor: system
        preconditions:
          - "offering.status == WAITLIST_ONLY"
          - "offering.confirmed_enrollment_count < offering.max_enrollment after promotion of the waitlist head, if any"
        side_effects:
          - "Offering.status := OPEN"
          - "increments Offering.version by 1"
        note: "Closes the OPEN <-> WAITLIST_ONLY cycle. Waitlist promotion is attempted FIRST: the WAITLISTED registration on this offering with payment_status IN {PAID, VOUCHER_COMMITTED} and the smallest created_at is promoted to ENROLLED; only when no such registration exists does the offering fall back to OPEN."

      - from: OPEN
        to: CENSUS_LOCKED
        trigger: "POST /offerings/{id}/census"
        actor: ProgramAdmin
        preconditions:
          - "offering.status IN {OPEN, WAITLIST_ONLY}"
          - "logical clock now >= offering.census_at (else ERR_CENSUS_TOO_EARLY)"
          - "offering.paid_enrollment_count >= offering.min_enrollment"
        side_effects:
          - "Offering.status := CENSUS_LOCKED"
          - "for every InstructorContract on this offering with status IN {OFFERED, SIGNED, ACTIVE}: census_headcount := offering.paid_enrollment_count (frozen)"
          - "for every Registration on this offering with payment_status == VOUCHER_COMMITTED: payment_status := PAID; the backing Voucher moves committed_cents -> consumed_cents for exactly total_due_cents; the Voucher's CorporateAccount recomputes committed_cents and consumed_cents"
          - "recompute Offering.net_program_revenue_cents"
          - "increments Offering.version by 1"

      - from: WAITLIST_ONLY
        to: CENSUS_LOCKED
        trigger: "POST /offerings/{id}/census"
        actor: ProgramAdmin
        preconditions:
          - "offering.status IN {OPEN, WAITLIST_ONLY}"
          - "logical clock now >= offering.census_at"
          - "offering.paid_enrollment_count >= offering.min_enrollment"
        side_effects:
          - "identical to the OPEN -> CENSUS_LOCKED side-effect set"
          - "increments Offering.version by 1"

      - from: OPEN
        to: CANCELLED
        trigger: "POST /offerings/{id}/census"
        actor: ProgramAdmin
        preconditions:
          - "offering.status IN {OPEN, WAITLIST_ONLY}"
          - "logical clock now >= offering.census_at"
          - "offering.paid_enrollment_count < offering.min_enrollment"
        side_effects:
          - "CASCADE HOP 1: Offering.status := CANCELLED; cancellation_reason := MIN_ENROLLMENT_NOT_MET"
          - "CASCADE HOP 2 (caused by hop 1): every Registration on this offering with enrollment_status IN {PENDING, ENROLLED, WAITLISTED} moves enrollment_status := WITHDRAWN and, when payment_status IN {PAID, VOUCHER_COMMITTED, PARTIALLY_REFUNDED}, payment_status := REFUNDED with amount_refunded_cents := amount_paid_cents (full refund INCLUDING processing_fee_cents - the only path on which the fee is returned)"
          - "CASCADE HOP 3 (caused by hop 2, only for registrations whose voucher_id is not null): the backing Voucher releases the registration's value - committed_cents or consumed_cents decreases by total_due_cents and remaining_cents increases by the same amount; Voucher.status is re-derived (EXHAUSTED/PARTIALLY_REDEEMED -> PARTIALLY_REDEEMED or ASSIGNED)"
          - "CASCADE HOP 4 (caused by hop 3): the Voucher's CorporateAccount recomputes unallocated_voucher_cents, committed_cents and consumed_cents so that funded_cents == available_cents + unallocated_voucher_cents + committed_cents + consumed_cents still holds"
          - "FAN-OUT (caused by hop 1, not part of the hop chain): every InstructorContract on this offering with status IN {OFFERED, SIGNED, ACTIVE} moves to TERMINATED_NO_FAULT and kill_fee_cents is computed"
          - "recompute Offering.net_program_revenue_cents (drops to 0 - every line was fully refunded)"
          - "increments Offering.version by 1"

      - from: WAITLIST_ONLY
        to: CANCELLED
        trigger: "POST /offerings/{id}/census"
        actor: ProgramAdmin
        preconditions:
          - "offering.status IN {OPEN, WAITLIST_ONLY}"
          - "logical clock now >= offering.census_at"
          - "offering.paid_enrollment_count < offering.min_enrollment"
        side_effects:
          - "identical to the OPEN -> CANCELLED cascade"
          - "increments Offering.version by 1"

      - from: CENSUS_LOCKED
        to: COMPLETED
        trigger: "POST /offerings/{id}/complete"
        actor: ProgramAdmin
        preconditions:
          - "offering.status == CENSUS_LOCKED"
          - "logical clock now >= offering.end_date (else ERR_OFFERING_NOT_ENDED)"
        side_effects:
          - "every Registration on this offering still in enrollment_status == ENROLLED moves to NO_SHOW"
          - "every Registration on this offering still in enrollment_status IN {PENDING, WAITLISTED} moves to WITHDRAWN with payment_status := REFUNDED and amount_refunded_cents := amount_paid_cents"
          - "Offering.status := COMPLETED"
          - "recompute Offering.net_program_revenue_cents"
          - "increments Offering.version by 1"

  - entity: Registration
    initial_state: "PENDING x UNPAID"
    terminal_states: [WITHDRAWN, TRANSFERRED_OUT, COMPLETED, NO_SHOW, REFUNDED]
    note: |
      PARALLEL state dimensions. enrollment_status (seat axis) and payment_status
      (money axis) advance independently on the same row: a registration may sit
      in WAITLISTED x PAID, ENROLLED x VOUCHER_COMMITTED, or
      ENROLLED x PARTIALLY_REFUNDED. Terminal states listed above are terminal
      per axis - WITHDRAWN/TRANSFERRED_OUT/COMPLETED/NO_SHOW terminate the seat
      axis, REFUNDED terminates the money axis.
    transitions:
      - from: "UNPAID"
        to: "PAID"
        trigger: "POST /registrations/{id}/pay with method == SELF_PAY"
        actor: Learner | Registrar
        preconditions:
          - "registration.payment_status == UNPAID"
          - "registration.enrollment_status == PENDING"
          - "offering.status IN {OPEN, WAITLIST_ONLY} (else ERR_OFFERING_NOT_OPEN)"
        side_effects:
          - "Registration.payment_status := PAID; amount_paid_cents := total_due_cents"
          - "seat resolution runs (see PENDING -> ENROLLED / PENDING -> WAITLISTED)"
          - "recompute Offering.net_program_revenue_cents"
          - "increments Registration.version by 1 and Offering.version by 1"

      - from: "UNPAID"
        to: "VOUCHER_COMMITTED"
        trigger: "POST /registrations/{id}/pay with method == VOUCHER"
        actor: Learner | Registrar
        preconditions:
          - "registration.payment_status == UNPAID"
          - "registration.enrollment_status == PENDING"
          - "offering.status IN {OPEN, WAITLIST_ONLY}"
          - "voucher.status IN {ASSIGNED, PARTIALLY_REDEEMED} AND voucher.assigned_learner_id == registration.learner_id AND logical clock now < voucher.expires_at AND voucher's CorporateAccount.status == ACTIVE (else ERR_VOUCHER_NOT_USABLE)"
          - "voucher.remaining_cents >= registration.total_due_cents (else ERR_VOUCHER_INSUFFICIENT_BALANCE)"
        side_effects:
          - "Registration.voucher_id := payload voucher_id; payment_status := VOUCHER_COMMITTED; amount_paid_cents := total_due_cents"
          - "Voucher.remaining_cents -= total_due_cents; Voucher.committed_cents += total_due_cents; Voucher.status := PARTIALLY_REDEEMED when remaining_cents > 0 else EXHAUSTED"
          - "CorporateAccount.unallocated_voucher_cents -= total_due_cents; CorporateAccount.committed_cents += total_due_cents"
          - "seat resolution runs"
          - "recompute Offering.net_program_revenue_cents"
          - "increments Registration.version, Voucher.version, CorporateAccount.version and Offering.version by 1 each"

      - from: "VOUCHER_COMMITTED"
        to: "PAID"
        trigger: "system: POST /offerings/{id}/census locks the offering"
        actor: system
        preconditions:
          - "offering transitions OPEN|WAITLIST_ONLY -> CENSUS_LOCKED"
        side_effects:
          - "Registration.payment_status := PAID"
          - "Voucher.committed_cents -= total_due_cents; Voucher.consumed_cents += total_due_cents"
          - "CorporateAccount.committed_cents -= total_due_cents; CorporateAccount.consumed_cents += total_due_cents"

      - from: "PENDING"
        to: "ENROLLED"
        trigger: "system: seat resolution inside POST /registrations/{id}/pay"
        actor: system
        preconditions:
          - "payment_status has just become PAID or VOUCHER_COMMITTED"
          - "offering.confirmed_enrollment_count < offering.max_enrollment"
        side_effects:
          - "Registration.enrollment_status := ENROLLED; enrolled_at := logical clock now"
          - "Offering.confirmed_enrollment_count += 1; paid_enrollment_count += 1"
          - "when confirmed_enrollment_count now equals max_enrollment: Offering OPEN -> WAITLIST_ONLY"
          - "run marketing_segment_recompute for the learner"

      - from: "PENDING"
        to: "WAITLISTED"
        trigger: "system: seat resolution inside POST /registrations/{id}/pay"
        actor: system
        preconditions:
          - "payment_status has just become PAID or VOUCHER_COMMITTED"
          - "offering.confirmed_enrollment_count == offering.max_enrollment"
        side_effects:
          - "Registration.enrollment_status := WAITLISTED"
          - "Offering.waitlist_count += 1"
          - "run marketing_segment_recompute for the learner"

      - from: "WAITLISTED"
        to: "ENROLLED"
        trigger: "system: waitlist promotion when a seat is released on the offering"
        actor: system
        preconditions:
          - "offering.confirmed_enrollment_count < offering.max_enrollment"
          - "this registration has payment_status IN {PAID, VOUCHER_COMMITTED} and is the WAITLISTED registration on the offering with the smallest created_at"
        side_effects:
          - "Registration.enrollment_status := ENROLLED; enrolled_at := logical clock now"
          - "Offering.waitlist_count -= 1; confirmed_enrollment_count += 1; paid_enrollment_count += 1"

      - from: "ENROLLED"
        to: "COMPLETED"
        trigger: "POST /registrations/{id}/complete"
        actor: Instructor
        preconditions:
          - "registration.enrollment_status == ENROLLED"
          - "offering.status == CENSUS_LOCKED"
          - "the acting Instructor holds an InstructorContract on this offering with status == ACTIVE (else ERR_NOT_RESOURCE_OWNER)"
          - "attendance_ratio = round_half_up(sessions_attended / total_sessions, 4) >= MIN_ATTENDANCE_RATIO (else ERR_ATTENDANCE_BELOW_THRESHOLD)"
        side_effects:
          - "CASCADE HOP 1: Registration.enrollment_status := COMPLETED"
          - "CASCADE HOP 2 (caused by hop 1): a CompletionRecord is created with status ISSUED, ceu_awarded from calculation ceu_award, attendance_ratio, issued_at, and certificate_number"
          - "CASCADE HOP 3 (caused by hop 2): the Learner's lifetime_completed_count, lifetime_ceu_total and loyalty_tier are recomputed by calculation learner_loyalty_and_ceu"
          - "CASCADE HOP 4 (caused by hop 3): marketing_segment_recompute runs for the learner - the previously ACTIVE membership among {PROSPECT, FIRST_TIME, REPEAT} moves to state REMOVED and the newly matching segment gains an ACTIVE membership"
          - "Offering.confirmed_enrollment_count and paid_enrollment_count are NOT decremented - a completed seat is consumed, not released, so no waitlist promotion fires"
          - "increments Registration.version, Learner.version and Offering.version by 1 each"

      - from: "ENROLLED"
        to: "WITHDRAWN"
        trigger: "POST /refund-transfer-requests/{id}/settle on a REFUND_APPROVED request, or the Offering CANCELLED cascade"
        actor: Registrar | system
        preconditions:
          - "the request is in status REFUND_APPROVED (settle path), or the offering is transitioning to CANCELLED (cascade path)"
        side_effects:
          - "Registration.enrollment_status := WITHDRAWN"
          - "Registration.payment_status := REFUNDED when computed_refund_cents == amount_paid_cents, else PARTIALLY_REFUNDED; amount_refunded_cents += computed_refund_cents"
          - "Offering.confirmed_enrollment_count -= 1; paid_enrollment_count -= 1; a waitlist promotion is attempted, and when none is available and the offering is WAITLIST_ONLY it reverts to OPEN"
          - "when voucher_id is not null the voucher and its CorporateAccount release the value (cascade hops 3 and 4 of the cancellation chain)"
          - "recompute Offering.net_program_revenue_cents"

      - from: "ENROLLED"
        to: "TRANSFERRED_OUT"
        trigger: "POST /refund-transfer-requests/{id}/settle on a TRANSFER_APPROVED request"
        actor: Registrar
        preconditions:
          - "request.status == TRANSFER_APPROVED"
          - "target offering.status IN {OPEN, WAITLIST_ONLY}"
        side_effects:
          - "a new Registration N is created on request.target_offering_id for the same learner, priced fresh by registration_price_resolution using the learner's CURRENT loyalty_tier"
          - "N.amount_paid_cents := N.total_due_cents; N.payment_status := PAID; seat resolution runs on the target offering"
          - "source Registration.transferred_to_registration_id := N.id; enrollment_status := TRANSFERRED_OUT; payment_status := REFUNDED"
          - "source Registration.amount_refunded_cents += transfer residual = (amount_paid_cents - TRANSFER_FEE_CENTS) - N.total_due_cents"
          - "source Offering.confirmed_enrollment_count -= 1; paid_enrollment_count -= 1; waitlist promotion attempted; WAITLIST_ONLY may revert to OPEN"
          - "recompute net_program_revenue_cents on BOTH offerings"

      - from: "ENROLLED"
        to: "NO_SHOW"
        trigger: "system: POST /offerings/{id}/complete"
        actor: system
        preconditions:
          - "offering transitions CENSUS_LOCKED -> COMPLETED while this registration is still ENROLLED"
        side_effects:
          - "Registration.enrollment_status := NO_SHOW"
          - "no refund is issued; the line stays in the net_program_revenue input set"

      - from: "PAID"
        to: "PARTIALLY_REFUNDED"
        trigger: "POST /refund-transfer-requests/{id}/settle where computed_refund_cents < amount_paid_cents"
        actor: Registrar
        preconditions:
          - "registration.payment_status == PAID"
          - "0 < computed_refund_cents < amount_paid_cents"
        side_effects:
          - "Registration.payment_status := PARTIALLY_REFUNDED; amount_refunded_cents += computed_refund_cents"

      - from: "PAID"
        to: "REFUNDED"
        trigger: "POST /refund-transfer-requests/{id}/settle where computed_refund_cents == amount_paid_cents, or the Offering CANCELLED cascade"
        actor: Registrar | system
        preconditions:
          - "registration.payment_status == PAID"
        side_effects:
          - "Registration.payment_status := REFUNDED; amount_refunded_cents := amount_paid_cents"

      - from: "VOUCHER_COMMITTED"
        to: "REFUNDED"
        trigger: "system: Offering CANCELLED cascade, or POST /refund-transfer-requests/{id}/settle on a pre-census REFUND"
        actor: system | Registrar
        preconditions:
          - "registration.payment_status == VOUCHER_COMMITTED"
        side_effects:
          - "Registration.payment_status := REFUNDED; amount_refunded_cents := amount_paid_cents"
          - "Voucher.committed_cents -= amount_paid_cents; Voucher.remaining_cents += amount_paid_cents; Voucher.status re-derived"
          - "CorporateAccount.committed_cents -= amount_paid_cents; CorporateAccount.unallocated_voucher_cents += amount_paid_cents"

  - entity: InstructorContract
    initial_state: OFFERED
    terminal_states: [SETTLED, DECLINED, TERMINATED_NO_FAULT]
    transitions:
      - from: OFFERED
        to: SIGNED
        trigger: "POST /instructor-contracts/{id}/sign with decision == ACCEPT"
        actor: Instructor
        preconditions:
          - "contract.status == OFFERED"
          - "X-User-ID == contract.instructor_id (else ERR_NOT_RESOURCE_OWNER)"
          - "offering.status IN {DRAFT, OPEN, WAITLIST_ONLY}"
          - "no other InstructorContract of this instructor with status IN {SIGNED, ACTIVE} staffs an Offering whose HALF-OPEN window [start_date, end_date) intersects this offering's half-open window (else ERR_INSTRUCTOR_SCHEDULE_CONFLICT)"
        side_effects:
          - "InstructorContract.status := SIGNED"
          - "Instructor.active_contract_count += 1"
          - "increments InstructorContract.version and Instructor.version by 1 each"

      - from: OFFERED
        to: DECLINED
        trigger: "POST /instructor-contracts/{id}/sign with decision == DECLINE"
        actor: Instructor
        preconditions:
          - "contract.status == OFFERED"
          - "X-User-ID == contract.instructor_id"
        side_effects:
          - "InstructorContract.status := DECLINED"
          - "increments InstructorContract.version by 1"

      - from: SIGNED
        to: ACTIVE
        trigger: "POST /instructor-contracts/{id}/activate"
        actor: ProgramAdmin
        preconditions:
          - "contract.status == SIGNED"
          - "the contract's Offering.status == CENSUS_LOCKED (cross-entity guard; else ERR_INVALID_STATE)"
        side_effects:
          - "InstructorContract.status := ACTIVE"
          - "increments InstructorContract.version by 1"

      - from: ACTIVE
        to: SETTLED
        trigger: "POST /instructor-contracts/{id}/settle"
        actor: ProgramAdmin
        preconditions:
          - "contract.status == ACTIVE"
          - "the contract's Offering.status == COMPLETED (cross-entity guard; else ERR_INVALID_STATE)"
        side_effects:
          - "final_headcount := count of Registrations on the offering with enrollment_status == COMPLETED"
          - "settled_pay_cents := output of calculation instructor_contract_pay under the contract's pay_basis variant"
          - "InstructorContract.status := SETTLED"
          - "Instructor.active_contract_count -= 1"
          - "increments InstructorContract.version and Instructor.version by 1 each"

      - from: OFFERED
        to: TERMINATED_NO_FAULT
        trigger: "system: the Offering CANCELLED cascade"
        actor: system
        preconditions:
          - "the offering is transitioning to CANCELLED"
        side_effects:
          - "kill_fee_cents := output of calculation instructor_kill_fee"
          - "InstructorContract.status := TERMINATED_NO_FAULT"

      - from: SIGNED
        to: TERMINATED_NO_FAULT
        trigger: "system: the Offering CANCELLED cascade"
        actor: system
        preconditions:
          - "the offering is transitioning to CANCELLED"
        side_effects:
          - "kill_fee_cents := output of calculation instructor_kill_fee"
          - "InstructorContract.status := TERMINATED_NO_FAULT"
          - "Instructor.active_contract_count -= 1"

      - from: ACTIVE
        to: TERMINATED_NO_FAULT
        trigger: "system: the Offering CANCELLED cascade"
        actor: system
        preconditions:
          - "the offering is transitioning to CANCELLED"
        side_effects:
          - "kill_fee_cents := output of calculation instructor_kill_fee"
          - "InstructorContract.status := TERMINATED_NO_FAULT"
          - "Instructor.active_contract_count -= 1"

  - entity: CompletionRecord
    initial_state: ISSUED
    terminal_states: [REVOKED]
    transitions:
      - from: ISSUED
        to: REVOKED
        trigger: "POST /completion-records/{id}/revoke"
        actor: Registrar
        preconditions:
          - "record.status == ISSUED"
          - "no CplCitation whose completion_record_id == record.id belongs to a CplPetition with status == APPROVED (else ERR_CITATION_NOT_ELIGIBLE)"
        side_effects:
          - "CompletionRecord.status := REVOKED"
          - "the source Registration.enrollment_status moves COMPLETED -> NO_SHOW"
          - "the Learner's lifetime_completed_count, lifetime_ceu_total and loyalty_tier are recomputed by learner_loyalty_and_ceu; because the record leaves the ISSUED input set, lifetime_ceu_total returns to exactly its pre-award value"
          - "marketing_segment_recompute runs for the learner"
          - "increments CompletionRecord.version, Registration.version and Learner.version by 1 each"

  - entity: Voucher
    initial_state: ISSUED
    terminal_states: [VOIDED]
    transitions:
      - from: ISSUED
        to: ASSIGNED
        trigger: "POST /vouchers/{id}/assign"
        actor: CorporateSponsor
        preconditions:
          - "voucher.status == ISSUED"
          - "X-User-ID == voucher.corporate_account_id (else ERR_NOT_RESOURCE_OWNER)"
          - "the CorporateAccount.status == ACTIVE"
          - "logical clock now < voucher.expires_at"
        side_effects:
          - "Voucher.assigned_learner_id := payload learner_id; status := ASSIGNED"
          - "marketing_segment_recompute runs for the assigned learner"
          - "increments Voucher.version by 1"

      - from: ASSIGNED
        to: PARTIALLY_REDEEMED
        trigger: "system: a Registration commits part of the voucher via POST /registrations/{id}/pay with method == VOUCHER"
        actor: system
        preconditions:
          - "voucher.remaining_cents - registration.total_due_cents > 0"
        side_effects:
          - "Voucher.status := PARTIALLY_REDEEMED"

      - from: ASSIGNED
        to: EXHAUSTED
        trigger: "system: a Registration commits the entire remaining balance"
        actor: system
        preconditions:
          - "voucher.remaining_cents - registration.total_due_cents == 0"
        side_effects:
          - "Voucher.status := EXHAUSTED"

      - from: PARTIALLY_REDEEMED
        to: EXHAUSTED
        trigger: "system: a further Registration commits the entire remaining balance"
        actor: system
        preconditions:
          - "voucher.remaining_cents - registration.total_due_cents == 0"
        side_effects:
          - "Voucher.status := EXHAUSTED"

      - from: EXHAUSTED
        to: PARTIALLY_REDEEMED
        trigger: "system: value is released back to the voucher by the Offering CANCELLED cascade or a settled REFUND"
        actor: system
        preconditions:
          - "voucher.remaining_cents > 0 after the release"
          - "voucher.committed_cents + voucher.consumed_cents > 0 after the release"
        side_effects:
          - "Voucher.status := PARTIALLY_REDEEMED"
        note: "Closes the ASSIGNED/PARTIALLY_REDEEMED <-> EXHAUSTED redemption cycle."

      - from: EXHAUSTED
        to: ASSIGNED
        trigger: "system: the entire committed or consumed balance is released back to the voucher by the Offering CANCELLED cascade or a settled REFUND"
        actor: system
        preconditions:
          - "voucher.committed_cents == 0 AND voucher.consumed_cents == 0 after the release"
          - "voucher.remaining_cents == voucher.face_value_cents after the release"
        side_effects:
          - "Voucher.status := ASSIGNED"
        note: "Full unwind of a fully redeemed voucher; closes the ASSIGNED -> EXHAUSTED -> ASSIGNED loop."

      - from: PARTIALLY_REDEEMED
        to: ASSIGNED
        trigger: "system: the last committed/consumed value is released back to the voucher"
        actor: system
        preconditions:
          - "voucher.committed_cents == 0 AND voucher.consumed_cents == 0 after the release"
        side_effects:
          - "Voucher.status := ASSIGNED"

      - from: ISSUED
        to: VOIDED
        trigger: "POST /vouchers/{id}/void"
        actor: CorporateSponsor
        preconditions:
          - "voucher.status IN {ISSUED, ASSIGNED}"
          - "voucher.committed_cents == 0 AND voucher.consumed_cents == 0"
        side_effects:
          - "Voucher.status := VOIDED; remaining_cents := 0"
          - "CorporateAccount.available_cents += face_value_cents; unallocated_voucher_cents -= face_value_cents"
          - "increments Voucher.version and CorporateAccount.version by 1 each"

      - from: ASSIGNED
        to: VOIDED
        trigger: "POST /vouchers/{id}/void"
        actor: CorporateSponsor
        preconditions:
          - "voucher.status IN {ISSUED, ASSIGNED}"
          - "voucher.committed_cents == 0 AND voucher.consumed_cents == 0"
        side_effects:
          - "identical to the ISSUED -> VOIDED side-effect set"

  - entity: CorporateAccount
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /corporate-accounts/{id}/suspend"
        actor: ProgramAdmin
        preconditions:
          - "account.status == ACTIVE"
        side_effects:
          - "CorporateAccount.status := SUSPENDED"
          - "no voucher of this account may be issued, assigned or redeemed while SUSPENDED (ERR_VOUCHER_NOT_USABLE on redemption); already-committed value is untouched"
          - "increments CorporateAccount.version by 1"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /corporate-accounts/{id}/reinstate"
        actor: ProgramAdmin
        preconditions:
          - "account.status == SUSPENDED"
        side_effects:
          - "CorporateAccount.status := ACTIVE"
          - "increments CorporateAccount.version by 1"
        note: "Closes the ACTIVE <-> SUSPENDED cycle on the sponsor account."

  - entity: CplPetition
    initial_state: DRAFT
    terminal_states: [APPROVED, DENIED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /cpl-petitions/{id}/submit"
        actor: Learner
        preconditions:
          - "petition.status IN {DRAFT, REVISION_REQUESTED}"
          - "X-User-ID == petition.learner_id"
          - "at least one CplCitation exists with petition_id == petition.id"
          - "every cited CompletionRecord has status == ISSUED AND learner_id == petition.learner_id (else ERR_CITATION_NOT_ELIGIBLE)"
          - "no other CplPetition of this learner with the same target_course_id has status == APPROVED (else ERR_CPL_DUPLICATE_AWARD)"
          - "target Course.status == ACTIVE (else ERR_COURSE_RETIRED)"
        side_effects:
          - "CplPetition.status := SUBMITTED"
          - "increments CplPetition.version by 1"

      - from: REVISION_REQUESTED
        to: SUBMITTED
        trigger: "POST /cpl-petitions/{id}/submit"
        actor: Learner
        preconditions:
          - "identical to the DRAFT -> SUBMITTED precondition set"
        side_effects:
          - "CplPetition.status := SUBMITTED"
          - "increments CplPetition.version by 1"
        note: "Closes the review cycle SUBMITTED -> UNDER_REVIEW -> REVISION_REQUESTED -> SUBMITTED."

      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /cpl-petitions/{id}/review"
        actor: ProgramAdmin
        preconditions:
          - "petition.status == SUBMITTED"
        side_effects:
          - "CplPetition.assessed_by_user_id := the acting X-User-ID"
          - "CplPetition.status := UNDER_REVIEW"
          - "increments CplPetition.version by 1"

      - from: UNDER_REVIEW
        to: REVISION_REQUESTED
        trigger: "POST /cpl-petitions/{id}/request-revision"
        actor: ProgramAdmin
        preconditions:
          - "petition.status == UNDER_REVIEW"
          - "petition.revision_round < MAX_CPL_REVISION_ROUNDS (else ERR_CPL_REVISION_LIMIT)"
        side_effects:
          - "CplPetition.revision_round += 1"
          - "CplPetition.assessed_by_user_id := the acting X-User-ID"
          - "CplPetition.status := REVISION_REQUESTED"
          - "increments CplPetition.version by 1"

      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /cpl-petitions/{id}/decide with decision == APPROVE"
        actor: ProgramAdmin
        preconditions:
          - "petition.status == UNDER_REVIEW"
          - "the acting X-User-ID != petition.assessed_by_user_id (else ERR_SEGREGATION_OF_DUTIES)"
          - "awarded_credit_units computed by cpl_credit_conversion > 0 (else ERR_CPL_AWARD_ZERO)"
        side_effects:
          - "CplPetition.claimed_ceu_total and awarded_credit_units := outputs of cpl_credit_conversion"
          - "CplPetition.decision_note := payload decision_note"
          - "CplPetition.status := APPROVED"
          - "the petition's target_course_id counts as a satisfied prerequisite for the learner in every later ERR_PREREQUISITE_NOT_MET check"
          - "increments CplPetition.version by 1"

      - from: UNDER_REVIEW
        to: DENIED
        trigger: "POST /cpl-petitions/{id}/decide with decision == DENY"
        actor: ProgramAdmin
        preconditions:
          - "petition.status == UNDER_REVIEW"
          - "the acting X-User-ID != petition.assessed_by_user_id (else ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "CplPetition.claimed_ceu_total and awarded_credit_units := outputs of cpl_credit_conversion (recorded even on denial)"
          - "CplPetition.decision_note := payload decision_note"
          - "CplPetition.status := DENIED"
          - "increments CplPetition.version by 1"

  - entity: RefundTransferRequest
    initial_state: SUBMITTED
    terminal_states: [SETTLED, DENIED]
    transitions:
      - from: SUBMITTED
        to: REFUND_APPROVED
        trigger: "POST /refund-transfer-requests/{id}/decide with decision == APPROVE"
        actor: Registrar
        preconditions:
          - "request.status == SUBMITTED"
          - "request.request_type == REFUND"
          - "the source Registration.enrollment_status == ENROLLED"
        side_effects:
          - "computed_refund_cents := output of calculation refund_amount under the request's refund_basis (recomputed at decide time using the CURRENT logical clock and sessions_attended)"
          - "RefundTransferRequest.status := REFUND_APPROVED"
          - "increments RefundTransferRequest.version by 1"

      - from: SUBMITTED
        to: TRANSFER_APPROVED
        trigger: "POST /refund-transfer-requests/{id}/decide with decision == APPROVE"
        actor: Registrar
        preconditions:
          - "request.status == SUBMITTED"
          - "request.request_type == TRANSFER"
          - "the source Registration.enrollment_status == ENROLLED"
          - "target Offering.status IN {OPEN, WAITLIST_ONLY}, target Offering.id != source offering id, target Course.status == ACTIVE, and target Course.ceu_units == source Course.ceu_units (else ERR_TRANSFER_TARGET_INCOMPATIBLE)"
          - "(registration.amount_paid_cents - TRANSFER_FEE_CENTS) >= the target-offering total_due_cents produced by registration_price_resolution for this learner (else ERR_TRANSFER_CREDIT_INSUFFICIENT)"
        side_effects:
          - "RefundTransferRequest.status := TRANSFER_APPROVED"
          - "increments RefundTransferRequest.version by 1"
        note: "Divergent branch: the REFUND arm values money, the TRANSFER arm validates the destination section and the carried credit. The two arms rejoin at SETTLED."

      - from: SUBMITTED
        to: DENIED
        trigger: "POST /refund-transfer-requests/{id}/decide with decision == DENY"
        actor: Registrar
        preconditions:
          - "request.status == SUBMITTED"
        side_effects:
          - "RefundTransferRequest.status := DENIED"
          - "computed_refund_cents stays 0; the Registration is untouched"
          - "increments RefundTransferRequest.version by 1"

      - from: REFUND_APPROVED
        to: SETTLED
        trigger: "POST /refund-transfer-requests/{id}/settle"
        actor: Registrar
        preconditions:
          - "request.status == REFUND_APPROVED"
        side_effects:
          - "the source Registration follows ENROLLED -> WITHDRAWN and PAID -> REFUNDED or PAID -> PARTIALLY_REFUNDED"
          - "voucher and CorporateAccount value is released when voucher_id is not null"
          - "seat release runs on the source Offering (waitlist promotion, then WAITLIST_ONLY -> OPEN when nothing is promotable)"
          - "RefundTransferRequest.settled_at := logical clock now; status := SETTLED"
          - "recompute Offering.net_program_revenue_cents"

      - from: TRANSFER_APPROVED
        to: SETTLED
        trigger: "POST /refund-transfer-requests/{id}/settle"
        actor: Registrar
        preconditions:
          - "request.status == TRANSFER_APPROVED"
          - "target Offering.status IN {OPEN, WAITLIST_ONLY} (re-checked at settle time)"
        side_effects:
          - "the source Registration follows ENROLLED -> TRANSFERRED_OUT with the new-registration side-effect set"
          - "computed_refund_cents := the cash residual (amount_paid_cents - TRANSFER_FEE_CENTS) - N.total_due_cents"
          - "RefundTransferRequest.settled_at := logical clock now; status := SETTLED"
          - "recompute net_program_revenue_cents on BOTH offerings"

# ---------------------------------------------------------------------------
# 1.2.1 Concurrency Rules
# ---------------------------------------------------------------------------
concurrency_rules:
  - rule_id: registration-create-stale-offering
    parent_entity: Offering
    write_endpoint: "POST /offerings/{id}/registrations"
    occ_field: "expected_offering_version"
    description: |
      Creating a Registration against an Offering whose version has advanced
      since the client last observed it is rejected. Seat availability,
      waitlist depth and the OPEN <-> WAITLIST_ONLY posture are all encoded in
      the offering row, so a client holding a stale version is deciding to
      enroll against a seat picture that no longer exists; the write is
      refused and the client must re-read the offering.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: voucher-issue-stale-account
    parent_entity: CorporateAccount
    write_endpoint: "POST /corporate-accounts/{id}/vouchers"
    occ_field: "expected_corporate_account_version"
    description: |
      Issuing a Voucher draws face_value_cents out of the sponsor's
      available_cents. A sponsor whose expected_corporate_account_version no
      longer matches the stored version is sizing the voucher against a budget
      snapshot that a prior deposit or voucher issue has already invalidated,
      so the issue is refused.
    error_id: ERR_STALE_VERSION
    http_status: 412

# ---------------------------------------------------------------------------
# 1.3 Calculation Rules Table
# ---------------------------------------------------------------------------
calculations:

  - name: registration_price_resolution
    trigger: "POST /offerings/{id}/registrations (initial pricing) and the TRANSFER settle side-effect that creates the destination Registration"
    algorithm: tiered_pricing
    formula: |
      # EVALUATION ORDER IS PINNED. The processing fee tier is selected from
      # subtotal_cents and NEVER from total_due_cents. Reading the fee tier off
      # total_due_cents would be circular (total_due depends on the fee) and is
      # explicitly forbidden.
      step 1: list_tuition_cents      = offering.tuition_cents
      step 2: tier                    = learner.loyalty_tier AS STORED IMMEDIATELY BEFORE this call
                                        (loyalty_tier is only ever recomputed by
                                         learner_loyalty_and_ceu on completion award/revocation,
                                         never by registration or payment)
      step 3: loyalty_discount_cents  = round_half_up(list_tuition_cents * LOYALTY_DISCOUNT_PCT[tier])
      step 4: subtotal_cents          = list_tuition_cents - loyalty_discount_cents
      step 5: i                       = max{ j : subtotal_cents >= FEE_TIER_BREAKPOINTS_CENTS[j] }   # >= , not >
              fee_pct                 = FEE_TIER_PCT[i]
      step 6: raw_fee_cents           = round_half_up(subtotal_cents * fee_pct)
      step 7: processing_fee_cents    = min(FEE_MAX_CENTS, max(FEE_MIN_CENTS, raw_fee_cents))
      step 8: total_due_cents         = subtotal_cents + processing_fee_cents
    input_set: "Exactly one Offering and one Learner. No aggregation over other registrations."
    constants:
      LOYALTY_DISCOUNT_PCT: { NEW: 0.00, RETURNING: 0.05, LOYAL: 0.10, CHAMPION: 0.15 }
      FEE_TIER_BREAKPOINTS_CENTS: [0, 25000, 75000]
      FEE_TIER_PCT: [0.06, 0.04, 0.025]
      FEE_MIN_CENTS: 500
      FEE_MAX_CENTS: 4000
    precision: "All monetary outputs are whole cents; every round_half_up rounds to 0 decimal places."

  - name: offering_net_program_revenue
    trigger: "recomputed on POST /registrations/{id}/pay, POST /offerings/{id}/census, POST /offerings/{id}/complete and POST /refund-transfer-requests/{id}/settle; writes Offering.net_program_revenue_cents"
    algorithm: aggregation
    formula: |
      # ROUNDING ORDER IS PINNED: round PER REGISTRATION LINE, then sum the
      # integer line results. Summing gross across lines and applying the
      # overhead rate once at the end is FORBIDDEN and produces a different
      # number whenever the per-line overhead has a fractional cent.
      lines = [ r for r in Registration
                where r.offering_id == offering.id
                  AND r.payment_status IN {PAID, PARTIALLY_REFUNDED}
                  AND r.enrollment_status IN {ENROLLED, COMPLETED, NO_SHOW} ]
      lines ordered by r.created_at ASC
      for each line r:
          gross_cents    = r.amount_paid_cents - r.amount_refunded_cents
          overhead_cents = round_half_up(gross_cents * INSTITUTIONAL_OVERHEAD_RATE)   # rounded HERE
          line_net_cents = gross_cents - overhead_cents - PLATFORM_FEE_PER_REG_CENTS
      net_program_revenue_cents = sum(line_net_cents over lines)                      # integer sum, no further rounding
    input_set: "Registrations of this Offering with payment_status IN {PAID, PARTIALLY_REFUNDED} AND enrollment_status IN {ENROLLED, COMPLETED, NO_SHOW}. Registrations that are UNPAID, VOUCHER_COMMITTED, REFUNDED, WITHDRAWN, TRANSFERRED_OUT, PENDING or WAITLISTED are excluded."
    constants:
      INSTITUTIONAL_OVERHEAD_RATE: 0.185
      PLATFORM_FEE_PER_REG_CENTS: 250
    precision: "Whole cents; round_half_up applied once per line and never to the sum."

  - name: refund_amount
    trigger: "POST /refund-transfer-requests (provisional value stored on computed_refund_cents) and re-evaluated on POST /refund-transfer-requests/{id}/decide for a REFUND request"
    algorithm: threshold
    formula: |
      subtotal_paid_cents = registration.amount_paid_cents - registration.processing_fee_cents
      days_before_start   = floor((offering.start_date - logical_clock_now) / 86400 seconds)   # may be negative
      # BASE (variant policy_schedule):
      if   days_before_start >= 14 : tier_pct = 1.00
      elif days_before_start >=  7 : tier_pct = 0.75
      elif days_before_start >=  1 : tier_pct = 0.50
      else                         : tier_pct = 0.00
      refund_cents = round_half_up(subtotal_paid_cents * tier_pct)
    input_set: "Exactly one Registration and its Offering. The processing fee is NEVER refunded on this path; only the Offering CANCELLED cascade returns it."
    constants:
      POLICY_TIER_DAYS: [14, 7, 1]
      POLICY_TIER_PCT: [1.00, 0.75, 0.50, 0.00]
      PRO_RATA_MAX_REFUND_PCT: 0.90
    precision: "Whole cents, round_half_up."
    variants:
      - name: policy_schedule
        when: "RefundTransferRequest.refund_basis == POLICY_SCHEDULE (the default)"
        difference: "Uses only days_before_start against POLICY_TIER_DAYS. Attendance is ignored entirely."
      - name: pro_rata_attendance
        when: "RefundTransferRequest.refund_basis == PRO_RATA_ATTENDANCE"
        difference: |
          Ignores days_before_start completely and instead values the unused
          portion of the course:
            unused_ratio  = (registration.total_sessions - registration.sessions_attended)
                            / registration.total_sessions
            effective_pct = min(unused_ratio, PRO_RATA_MAX_REFUND_PCT)
            refund_cents  = round_half_up(subtotal_paid_cents * effective_pct)
          For identical inputs the two variants diverge: a registration one day
          before start with zero sessions attended yields 0.50 * subtotal under
          policy_schedule and 0.90 * subtotal under pro_rata_attendance.

  - name: instructor_contract_pay
    trigger: "POST /instructor-contracts/{id}/settle; writes InstructorContract.settled_pay_cents"
    algorithm: weighted_scoring
    formula: |
      headcount   = <variant-supplied integer>
      capped      = min(headcount, contract.enrollment_cap_for_pay)
      variable    = capped * contract.per_enrollment_cents
      raw_cents   = contract.base_stipend_cents + variable
      settled_pay_cents = round_half_up(raw_cents * CREDENTIAL_MULTIPLIER[instructor.credential_level])
    input_set: "One InstructorContract, its Instructor, and the Registrations of its Offering filtered by the variant."
    constants:
      CREDENTIAL_MULTIPLIER: { ADJUNCT: 1.00, SENIOR: 1.15, MASTER: 1.30 }
    precision: "Whole cents, round_half_up applied once to the multiplied raw total."
    variants:
      - name: census_locked
        when: "InstructorContract.pay_basis == CENSUS_LOCKED (the default)"
        difference: "headcount = contract.census_headcount, the Offering.paid_enrollment_count value frozen at the instant POST /offerings/{id}/census locked the offering. Later withdrawals, no-shows and completions do not change it."
      - name: final_completion
        when: "InstructorContract.pay_basis == FINAL_COMPLETION"
        difference: "headcount = contract.final_headcount, the count of Registrations on the offering with enrollment_status == COMPLETED evaluated at settle time. For the same offering this is strictly smaller than census_headcount whenever any enrolled learner withdrew, no-showed or failed the attendance gate, so the two variants settle different amounts from identical inputs."

  - name: instructor_kill_fee
    trigger: "the Offering CANCELLED cascade; writes InstructorContract.kill_fee_cents"
    algorithm: threshold
    formula: |
      kill_fee_cents = round_half_up(contract.base_stipend_cents
                                     * KILL_FEE_PCT
                                     * CREDENTIAL_MULTIPLIER[instructor.credential_level])
    input_set: "One InstructorContract and its Instructor. Enrollment counts are irrelevant - the kill fee never includes the per-enrollment component."
    constants:
      KILL_FEE_PCT: 0.25
      CREDENTIAL_MULTIPLIER: { ADJUNCT: 1.00, SENIOR: 1.15, MASTER: 1.30 }
    precision: "Whole cents, round_half_up applied once to the fully multiplied product."

  - name: ceu_award
    trigger: "POST /registrations/{id}/complete; writes CompletionRecord.ceu_awarded and CompletionRecord.attendance_ratio"
    algorithm: threshold
    formula: |
      attendance_ratio = round_half_up(registration.sessions_attended / registration.total_sessions, 4)
      if attendance_ratio < MIN_ATTENDANCE_RATIO:      # strict <, so exactly 0.8000 PASSES
          reject with ERR_ATTENDANCE_BELOW_THRESHOLD
      ceu_awarded = round_half_up(course.ceu_units, 1)
    input_set: "One Registration, its Offering and that Offering's Course."
    constants:
      MIN_ATTENDANCE_RATIO: 0.80
    precision: "attendance_ratio to 4 decimal places round_half_up; ceu_awarded to 1 decimal place round_half_up."

  - name: learner_loyalty_and_ceu
    trigger: "a CompletionRecord is created with status ISSUED (POST /registrations/{id}/complete) or moves ISSUED -> REVOKED (POST /completion-records/{id}/revoke); writes Learner.lifetime_completed_count, Learner.lifetime_ceu_total and Learner.loyalty_tier"
    algorithm: aggregation
    formula: |
      issued = [ cr for cr in CompletionRecord
                 where cr.learner_id == learner.id AND cr.status == ISSUED ]
      lifetime_completed_count = count(issued)
      lifetime_ceu_total       = round_half_up(sum(cr.ceu_awarded for cr in issued), 1)
      loyalty_tier =
          CHAMPION  if lifetime_completed_count >= LOYALTY_THRESHOLDS.CHAMPION
        else LOYAL      if lifetime_completed_count >= LOYALTY_THRESHOLDS.LOYAL
        else RETURNING  if lifetime_completed_count >= LOYALTY_THRESHOLDS.RETURNING
        else NEW
      # CONSERVED QUANTITY (ceu_ledger_conservation):
      #   learner.lifetime_ceu_total == round_half_up(SUM of ceu_awarded over the
      #   learner's CompletionRecords whose status == ISSUED, 1)
      #   must hold after EVERY mutation, so award-then-revoke returns the total
      #   to exactly its pre-award value with zero drift.
    input_set: "CompletionRecords of this Learner with status == ISSUED. REVOKED records are excluded from both the count and the CEU sum."
    constants:
      LOYALTY_THRESHOLDS: { RETURNING: 1, LOYAL: 4, CHAMPION: 8 }
    precision: "lifetime_ceu_total to 1 decimal place, round_half_up; counts are exact integers."

  - name: cpl_credit_conversion
    trigger: "POST /cpl-petitions/{id}/decide; writes CplPetition.claimed_ceu_total and CplPetition.awarded_credit_units"
    algorithm: waterfall_allocation
    formula: |
      # >= 3 inputs interacting non-linearly: per-citation weight, per-citation
      # recency decay, the target course's own credit ceiling, and a floor-to-step
      # quantiser. Citation contributions are rounded individually, then summed.
      citations ordered by CplCitation.created_at ASC
      for each citation c:
          rec        = c.completion_record
          age_years  = floor((logical_clock_now - rec.issued_at) / (365 * 86400 seconds))
          factor     = RECENCY_DECAY_FACTOR if age_years >= RECENCY_DECAY_YEARS else 1.0
          contrib    = round_half_up(rec.ceu_awarded * c.weight * factor, 2)
      claimed_ceu_total    = round_half_up(sum(contrib), 2)
      raw_credits          = claimed_ceu_total / CEU_TO_CREDIT_DIVISOR
      ceiling_credits      = target_course.cpl_credit_units * CPL_MAX_PCT_OF_COURSE
      capped_credits       = min(raw_credits, ceiling_credits)
      awarded_credit_units = floor(capped_credits / CPL_ROUND_STEP) * CPL_ROUND_STEP   # floor, never round
      if awarded_credit_units <= 0 AND decision == APPROVE:
          reject with ERR_CPL_AWARD_ZERO
    input_set: "Every CplCitation whose petition_id == petition.id, together with each cited CompletionRecord (which the SUBMITTED precondition has already constrained to status == ISSUED) and the petition's target Course."
    constants:
      CEU_TO_CREDIT_DIVISOR: 3.0
      CPL_MAX_PCT_OF_COURSE: 0.75
      CPL_ROUND_STEP: 0.5
      RECENCY_DECAY_YEARS: 5
      RECENCY_DECAY_FACTOR: 0.5
      MAX_CPL_REVISION_ROUNDS: 2
    precision: "claimed_ceu_total to 2 decimal places round_half_up; awarded_credit_units is an exact multiple of 0.5 obtained by flooring, never by rounding."

  - name: corporate_voucher_ledger
    trigger: "recomputed on POST /corporate-accounts/{id}/deposits, POST /corporate-accounts/{id}/vouchers, POST /vouchers/{id}/void, POST /registrations/{id}/pay with method == VOUCHER, POST /offerings/{id}/census and every value release driven by a settled REFUND or the Offering CANCELLED cascade"
    algorithm: constraint_propagation
    formula: |
      live = [ v for v in Voucher where v.corporate_account_id == account.id AND v.status != VOIDED ]
      funded_cents              = sum of every deposit amount_cents posted to this account (monotonic)
      available_cents           = funded_cents - sum(v.face_value_cents for v in live)
      unallocated_voucher_cents = sum(v.remaining_cents for v in live)
      committed_cents           = sum(v.committed_cents for v in live)
      consumed_cents            = sum(v.consumed_cents  for v in live)
      # PER-VOUCHER INVARIANT:
      #   v.face_value_cents == v.remaining_cents + v.committed_cents + v.consumed_cents
      # CONSERVED QUANTITY (voucher_value_conservation):
      #   account.funded_cents == account.available_cents
      #                         + account.unallocated_voucher_cents
      #                         + account.committed_cents
      #                         + account.consumed_cents
      # must hold after EVERY mutation. Committing a voucher against a
      # registration and then releasing it (settled REFUND, or the Offering
      # CANCELLED cascade) is a forward/compensating pair that MUST leave
      # funded_cents, available_cents and the identity above unchanged.
    input_set: "The account's Vouchers with status != VOIDED. VOIDED vouchers are excluded from all four aggregates and their face value has already returned to available_cents."
    constants:
      TRANSFER_FEE_CENTS: 2500
    precision: "Whole cents throughout; no rounding occurs - every term is an integer sum."

  - name: marketing_segment_recompute
    trigger: "POST /learners (initial PROSPECT membership), seat resolution inside POST /registrations/{id}/pay, POST /vouchers/{id}/assign, the CompletionRecord ISSUED cascade, POST /completion-records/{id}/revoke, and POST /learners/{id}/marketing-preference"
    algorithm: projection
    formula: |
      # EXCLUSIVE AXIS - exactly one of PROSPECT / FIRST_TIME / REPEAT is ACTIVE.
      if   learner.lifetime_completed_count == 0 : exclusive = PROSPECT
      elif learner.lifetime_completed_count == 1 : exclusive = FIRST_TIME
      else                                       : exclusive = REPEAT
      # ADDITIVE AXIS - independent of the exclusive axis.
      corporate_active = TRUE when at least one Registration of this learner has
                         voucher_id != null AND enrollment_status NOT IN {WITHDRAWN, TRANSFERRED_OUT},
                         OR at least one Voucher has assigned_learner_id == learner.id
                         AND status != VOIDED
      # OVERRIDE AXIS.
      if learner.marketing_status == UNSUBSCRIBED:
          every membership of this learner moves to state REMOVED and a single
          LAPSED membership is ACTIVE (created if it does not exist yet)
      else:
          the LAPSED membership, if any, moves to state REMOVED
          the membership whose segment == exclusive is ACTIVE (created if absent);
          every other membership on the exclusive axis moves to state REMOVED
          the CORPORATE_SPONSORED membership is ACTIVE iff corporate_active,
          otherwise REMOVED
      recomputed_at := logical clock now on every membership the run touched
    input_set: "One Learner, that Learner's CompletionRecords with status == ISSUED (via lifetime_completed_count), that Learner's Registrations, and Vouchers whose assigned_learner_id == learner.id with status != VOIDED."
    constants:
      EXCLUSIVE_SEGMENTS: [PROSPECT, FIRST_TIME, REPEAT]
    precision: "Integer counts only; no arithmetic rounding."

# ---------------------------------------------------------------------------
# 1.4 Validation Rules Table (evaluated strictly in ascending priority order;
#     the FIRST rule that fails determines the response error_id)
# ---------------------------------------------------------------------------
validations:

  - priority: 1
    category: auth
    check: "X-User-Role header present and naming a role declared in section 1.7; X-User-ID header present for every role except Anonymous."
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "The acting X-User-Role appears in the target endpoint's roles list."
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: all

  - priority: 3
    category: business_constraint
    check: "Request-shape validation, evaluated before any database lookup: every required input field present; types correct; enum members valid; monetary and count fields non-negative integers; ceu_units and weight within their declared ranges; course_code and email uniqueness; end_date > start_date; census_at <= start_date; term_code present iff scheduling_mode == TERM; max_enrollment >= min_enrollment; target_offering_id present iff request_type == TRANSFER; pagination limit in [1,100] and offset >= 0."
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all

  - priority: 4
    category: existence
    check: "Every resource named by a path segment exists, validated left-to-right."
    error_id: "ERR_COURSE_NOT_FOUND | ERR_OFFERING_NOT_FOUND | ERR_LEARNER_NOT_FOUND | ERR_INSTRUCTOR_NOT_FOUND | ERR_ACCOUNT_NOT_FOUND | ERR_VOUCHER_NOT_FOUND | ERR_REGISTRATION_NOT_FOUND | ERR_CONTRACT_NOT_FOUND | ERR_COMPLETION_RECORD_NOT_FOUND | ERR_PETITION_NOT_FOUND | ERR_REQUEST_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with path parameters"

  - priority: 5
    category: existence
    check: "Every foreign key supplied in the request body resolves to an existing row (course_id, learner_id, instructor_id, offering_id, voucher_id, target_offering_id, completion_record_id, prerequisite_course_id, target_course_id)."
    error_id: "ERR_COURSE_NOT_FOUND | ERR_OFFERING_NOT_FOUND | ERR_LEARNER_NOT_FOUND | ERR_INSTRUCTOR_NOT_FOUND | ERR_VOUCHER_NOT_FOUND | ERR_COMPLETION_RECORD_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints accepting foreign keys in the body"

  - priority: 6
    category: auth
    check: "Entity-backed ownership. Learner: X-User-ID equals the learner_id of the addressed Learner / Registration / CplPetition. Instructor on a contract endpoint: X-User-ID equals contract.instructor_id. Instructor on POST /registrations/{id}/attendance: holds an InstructorContract on that registration's offering with status IN {SIGNED, ACTIVE}. Instructor on POST /registrations/{id}/complete: holds an InstructorContract on that offering with status == ACTIVE. CorporateSponsor: X-User-ID equals the addressed CorporateAccount.id or the voucher's corporate_account_id."
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "POST /offerings/{id}/registrations, POST /registrations/{id}/pay, POST /registrations/{id}/attendance, POST /registrations/{id}/complete, POST /learners/{id}/marketing-preference, GET /learners/{id}, POST /cpl-petitions, POST /cpl-petitions/{id}/citations, POST /cpl-petitions/{id}/submit, POST /instructor-contracts/{id}/sign, POST /corporate-accounts/{id}/deposits, POST /corporate-accounts/{id}/vouchers, POST /vouchers/{id}/assign, POST /vouchers/{id}/void, POST /refund-transfer-requests"

  - priority: 7
    category: state
    check: "Optimistic concurrency: the supplied expected_<parent>_version equals the stored parent version."
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /offerings/{id}/registrations, POST /corporate-accounts/{id}/vouchers"

  - priority: 8
    category: state
    check: "The Offering backing this operation has status IN {OPEN, WAITLIST_ONLY}."
    error_id: ERR_OFFERING_NOT_OPEN
    http_status: 409
    applies_to: "POST /offerings/{id}/registrations, POST /registrations/{id}/pay"

  - priority: 9
    category: state
    check: "The addressed resource is in a from-state declared for this transition in section 1.2 (covers double-open, double-census, re-sign, re-decide, re-settle, revoking an already-REVOKED record, submitting a petition that is not DRAFT or REVISION_REQUESTED, paying a registration that is not UNPAID, completing a registration that is not ENROLLED, activating a contract whose offering is not CENSUS_LOCKED, settling a contract whose offering is not COMPLETED)."
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 10
    category: state
    check: "The referenced Course has status == ACTIVE (blocks creating an Offering on a retired course, opening such an Offering, and submitting a CplPetition against a retired target course)."
    error_id: ERR_COURSE_RETIRED
    http_status: 422
    applies_to: "POST /offerings, POST /offerings/{id}/open, POST /cpl-petitions/{id}/submit"

  - priority: 11
    category: business_safety
    check: "Segregation of duties: the acting X-User-ID on a CPL decision differs from petition.assessed_by_user_id."
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /cpl-petitions/{id}/decide"

  - priority: 12
    category: business_safety
    check: "Prerequisite satisfaction: when the offering's Course has a non-null prerequisite_course_id P, the learner must hold either a CompletionRecord with status == ISSUED whose registration's offering's course_id == P, or a CplPetition with status == APPROVED and target_course_id == P."
    error_id: ERR_PREREQUISITE_NOT_MET
    http_status: 422
    applies_to: "POST /offerings/{id}/registrations"

  - priority: 13
    category: business_safety
    check: "Attendance gate: round_half_up(sessions_attended / total_sessions, 4) >= MIN_ATTENDANCE_RATIO (0.80). Exactly 0.8000 passes."
    error_id: ERR_ATTENDANCE_BELOW_THRESHOLD
    http_status: 422
    applies_to: "POST /registrations/{id}/complete"

  - priority: 14
    category: business_temporal
    check: "The logical clock has reached the offering's census_at: clock_now >= offering.census_at."
    error_id: ERR_CENSUS_TOO_EARLY
    http_status: 409
    applies_to: "POST /offerings/{id}/census"

  - priority: 15
    category: business_temporal
    check: "The logical clock has reached the offering's end_date: clock_now >= offering.end_date."
    error_id: ERR_OFFERING_NOT_ENDED
    http_status: 409
    applies_to: "POST /offerings/{id}/complete"

  - priority: 16
    category: business_temporal
    check: "Refund/transfer window: clock_now < offering.end_date at request creation. Once the offering's end_date has been reached no refund or transfer request may be opened."
    error_id: ERR_REFUND_WINDOW_CLOSED
    http_status: 422
    applies_to: "POST /refund-transfer-requests"

  - priority: 17
    category: business_temporal
    check: "Instructor schedule: no other InstructorContract of this instructor with status IN {SIGNED, ACTIVE} staffs an Offering whose HALF-OPEN interval [start_date, end_date) intersects the target offering's half-open interval. Adjacency (one offering's end_date exactly equal to the other's start_date) is NOT a conflict."
    error_id: ERR_INSTRUCTOR_SCHEDULE_CONFLICT
    http_status: 409
    applies_to: "POST /instructor-contracts/{id}/sign"

  - priority: 18
    category: business_temporal
    check: "Learner concurrent load: take the learner's Registrations with enrollment_status IN {PENDING, ENROLLED, WAITLISTED} whose Offering's CLOSED interval [start_date, end_date] intersects the new offering's closed interval - endpoints that merely touch DO intersect. The sum of Course.ceu_units over those offerings plus the new offering's Course.ceu_units MUST be <= MAX_CONCURRENT_CEU (4.0)."
    error_id: ERR_LEARNER_LOAD_EXCEEDED
    http_status: 409
    applies_to: "POST /offerings/{id}/registrations"

  - priority: 19
    category: business_referential
    check: "Transfer target compatibility: target_offering_id != the source registration's offering_id; target Offering.status IN {OPEN, WAITLIST_ONLY}; target Course.status == ACTIVE; target Course.ceu_units == source Course.ceu_units."
    error_id: ERR_TRANSFER_TARGET_INCOMPATIBLE
    http_status: 422
    applies_to: "POST /refund-transfer-requests, POST /refund-transfer-requests/{id}/decide"

  - priority: 20
    category: business_referential
    check: "Citation eligibility: every cited CompletionRecord has status == ISSUED and learner_id == petition.learner_id; and, on revocation, no ACTIVE citation of the record belongs to an APPROVED petition."
    error_id: ERR_CITATION_NOT_ELIGIBLE
    http_status: 422
    applies_to: "POST /cpl-petitions/{id}/citations, POST /cpl-petitions/{id}/submit, POST /completion-records/{id}/revoke"

  - priority: 21
    category: business_constraint
    check: "Duplicate registration: the learner has no other Registration on this Offering with enrollment_status IN {PENDING, ENROLLED, WAITLISTED, COMPLETED}."
    error_id: ERR_DUPLICATE_REGISTRATION
    http_status: 409
    applies_to: "POST /offerings/{id}/registrations"

  - priority: 22
    category: business_constraint
    check: "Duplicate CPL award: the learner has no other CplPetition with the same target_course_id and status == APPROVED."
    error_id: ERR_CPL_DUPLICATE_AWARD
    http_status: 409
    applies_to: "POST /cpl-petitions/{id}/submit"

  - priority: 23
    category: business_constraint
    check: "Revision budget: petition.revision_round < MAX_CPL_REVISION_ROUNDS (2)."
    error_id: ERR_CPL_REVISION_LIMIT
    http_status: 409
    applies_to: "POST /cpl-petitions/{id}/request-revision"

  - priority: 24
    category: business_constraint
    check: "Waitlist capacity: when the offering is WAITLIST_ONLY, offering.waitlist_count < WAITLIST_CAP (5)."
    error_id: ERR_OFFERING_FULL
    http_status: 409
    applies_to: "POST /offerings/{id}/registrations"

  - priority: 25
    category: business_fiscal
    check: "Voucher usability: voucher.status IN {ASSIGNED, PARTIALLY_REDEEMED}; voucher.assigned_learner_id == registration.learner_id; clock_now < voucher.expires_at; the voucher's CorporateAccount.status == ACTIVE."
    error_id: ERR_VOUCHER_NOT_USABLE
    http_status: 422
    applies_to: "POST /registrations/{id}/pay"

  - priority: 26
    category: business_fiscal
    check: "Sponsor budget: corporate_account.available_cents >= face_value_cents."
    error_id: ERR_ACCOUNT_FUNDS_INSUFFICIENT
    http_status: 402
    applies_to: "POST /corporate-accounts/{id}/vouchers"

  - priority: 27
    category: business_fiscal
    check: "Voucher balance: voucher.remaining_cents >= registration.total_due_cents."
    error_id: ERR_VOUCHER_INSUFFICIENT_BALANCE
    http_status: 402
    applies_to: "POST /registrations/{id}/pay"

  - priority: 28
    category: business_fiscal
    check: "Transfer credit: (registration.amount_paid_cents - TRANSFER_FEE_CENTS) >= the target-offering total_due_cents produced by registration_price_resolution for this learner."
    error_id: ERR_TRANSFER_CREDIT_INSUFFICIENT
    http_status: 402
    applies_to: "POST /refund-transfer-requests/{id}/decide"

  - priority: 29
    category: business_fiscal
    check: "CPL award floor: awarded_credit_units computed by cpl_credit_conversion > 0 when the decision is APPROVE."
    error_id: ERR_CPL_AWARD_ZERO
    http_status: 422
    applies_to: "POST /cpl-petitions/{id}/decide"

# ---------------------------------------------------------------------------
# 1.5 API Endpoint Table
# ---------------------------------------------------------------------------
endpoints:

  # ---- Catalog ------------------------------------------------------------
  - method: POST
    path: "/courses"
    description: "Create a catalog course. Created directly in status ACTIVE."
    roles: [ProgramAdmin]
    code: 201
    input: ["course_code", "title", "ceu_units", "contact_hours", "list_price_cents", "delivery_mode", "cpl_credit_units", "prerequisite_course_id?"]
    output: Course
    side_effects: ["Course.status := ACTIVE", "Course.active_offering_count := 0"]

  - method: GET
    path: "/courses"
    description: "List catalog courses. Filtering by prerequisite_course_id is the reverse-reachability channel for the self-referential prerequisite FK."
    roles: [ProgramAdmin, Registrar, Learner, Instructor, CorporateSponsor]
    code: 200
    input: ["status?", "prerequisite_course_id?", "delivery_mode?", "limit?", "offset?"]
    output: Course[]
    side_effects: []

  - method: GET
    path: "/courses/{id}"
    description: "Fetch one course."
    roles: [ProgramAdmin, Registrar, Learner, Instructor, CorporateSponsor]
    code: 200
    input: []
    output: Course
    side_effects: []

  - method: POST
    path: "/courses/{id}/retire"
    description: "Retire a catalog course. Rejected while any DRAFT/OPEN/WAITLIST_ONLY/CENSUS_LOCKED offering still references it."
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: Course
    side_effects: ["Course ACTIVE -> RETIRED", "increments Course.version by 1"]

  # ---- Offerings ----------------------------------------------------------
  - method: POST
    path: "/offerings"
    description: "Create a term or rolling section of a course. Starts in DRAFT."
    roles: [ProgramAdmin]
    code: 201
    input: ["course_id", "scheduling_mode", "term_code?", "start_date", "end_date", "census_at", "session_count", "min_enrollment", "max_enrollment", "tuition_cents"]
    output: Offering
    side_effects: ["Offering.status := DRAFT", "Course.active_offering_count += 1", "increments Course.version by 1"]

  - method: GET
    path: "/offerings"
    description: "List offerings; course_id is the reverse-reachability filter for Offering.course_id."
    roles: [ProgramAdmin, Registrar, Learner, Instructor, CorporateSponsor]
    code: 200
    input: ["course_id?", "term_code?", "status?", "scheduling_mode?", "limit?", "offset?"]
    output: Offering[]
    side_effects: []

  - method: GET
    path: "/offerings/{id}"
    description: "Fetch one offering, including the live seat counters and net_program_revenue_cents. Used to re-read version before an OCC-guarded registration create."
    roles: [ProgramAdmin, Registrar, Learner, Instructor, CorporateSponsor]
    code: 200
    input: []
    output: Offering
    side_effects: []

  - method: POST
    path: "/offerings/{id}/open"
    description: "Publish a DRAFT offering for registration."
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: Offering
    side_effects: ["Offering DRAFT -> OPEN", "increments Offering.version by 1"]

  - method: POST
    path: "/offerings/{id}/census"
    description: "Take the minimum-enrollment cancellation decision. Forks: paid_enrollment_count >= min_enrollment locks the offering and converts every VOUCHER_COMMITTED registration to PAID; otherwise the offering is CANCELLED and the four-hop refund/voucher/sponsor cascade plus instructor kill-fee fan-out runs."
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: Offering
    side_effects: ["Offering OPEN|WAITLIST_ONLY -> CENSUS_LOCKED or CANCELLED", "freezes InstructorContract.census_headcount", "recompute Offering.net_program_revenue_cents", "increments Offering.version by 1"]

  - method: POST
    path: "/offerings/{id}/complete"
    description: "Close a CENSUS_LOCKED offering after its end_date. Remaining ENROLLED registrations become NO_SHOW; remaining PENDING/WAITLISTED registrations are withdrawn and refunded."
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: Offering
    side_effects: ["Offering CENSUS_LOCKED -> COMPLETED", "recompute Offering.net_program_revenue_cents", "increments Offering.version by 1"]

  - method: POST
    path: "/offerings/{id}/registrations"
    description: "Register a learner into an offering. OCC-guarded on the offering's version; the created registration starts PENDING x UNPAID and holds no seat until payment."
    roles: [Learner, Registrar]
    code: 201
    input: [learner_id, expected_offering_version]
    output: Registration
    side_effects: ["Registration created in PENDING x UNPAID", "prices the registration via registration_price_resolution", "snapshots total_sessions from Offering.session_count", "increments Offering.version by 1"]

  # ---- Learners & marketing ----------------------------------------------
  - method: POST
    path: "/learners"
    description: "Self-service learner signup."
    roles: [Anonymous, Registrar, ProgramAdmin]
    code: 201
    input: ["email", "full_name", "marketing_opt_in?"]
    output: Learner
    side_effects: ["Learner created with loyalty_tier NEW", "marketing_status := SUBSCRIBED when marketing_opt_in is true else UNSUBSCRIBED", "marketing_segment_recompute creates the initial membership"]

  - method: GET
    path: "/learners/{id}"
    description: "Fetch one learner including lifetime_completed_count, lifetime_ceu_total and loyalty_tier."
    roles: [Learner, Registrar, ProgramAdmin]
    code: 200
    input: []
    output: Learner
    side_effects: []

  - method: GET
    path: "/learners/{id}/marketing-memberships"
    description: "List every marketing list membership of this learner, ACTIVE and REMOVED alike. Reverse-reachability channel for MarketingMembership.learner_id."
    roles: [Registrar, ProgramAdmin, Learner]
    code: 200
    input: ["segment?", "state?", "limit?", "offset?"]
    output: MarketingMembership[]
    side_effects: []

  - method: POST
    path: "/learners/{id}/marketing-preference"
    description: "Toggle marketing consent; drives the LAPSED override axis of marketing_segment_recompute."
    roles: [Learner, Registrar]
    code: 200
    input: [marketing_opt_in]
    output: Learner
    side_effects: ["Learner.marketing_status := SUBSCRIBED|UNSUBSCRIBED", "marketing_segment_recompute runs", "increments Learner.version by 1"]

  # ---- Instructors --------------------------------------------------------
  - method: POST
    path: "/instructors"
    description: "Create an instructor record."
    roles: [ProgramAdmin]
    code: 201
    input: [email, full_name, credential_level]
    output: Instructor
    side_effects: []

  - method: GET
    path: "/instructors/{id}"
    description: "Fetch one instructor including active_contract_count."
    roles: [ProgramAdmin, Registrar, Instructor]
    code: 200
    input: []
    output: Instructor
    side_effects: []

  # ---- Corporate sponsorship ---------------------------------------------
  - method: POST
    path: "/corporate-accounts"
    description: "Open a corporate sponsor account with zero funding."
    roles: [ProgramAdmin]
    code: 201
    input: [org_name, billing_email]
    output: CorporateAccount
    side_effects: ["all five ledger aggregates initialised to 0"]

  - method: GET
    path: "/corporate-accounts/{id}"
    description: "Fetch one sponsor account with the full voucher ledger (funded / available / unallocated / committed / consumed)."
    roles: [ProgramAdmin, Registrar, CorporateSponsor]
    code: 200
    input: []
    output: CorporateAccount
    side_effects: []

  - method: POST
    path: "/corporate-accounts/{id}/suspend"
    description: "Suspend a sponsor account. Its vouchers stop being redeemable while suspended."
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: CorporateAccount
    side_effects: ["CorporateAccount ACTIVE -> SUSPENDED", "increments CorporateAccount.version by 1"]

  - method: POST
    path: "/corporate-accounts/{id}/reinstate"
    description: "Return a suspended sponsor account to ACTIVE."
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: CorporateAccount
    side_effects: ["CorporateAccount SUSPENDED -> ACTIVE", "increments CorporateAccount.version by 1"]

  - method: POST
    path: "/corporate-accounts/{id}/deposits"
    description: "Post funds to a sponsor account. Returns the updated account so the caller can read the new version for the OCC-guarded voucher issue."
    roles: [ProgramAdmin, CorporateSponsor]
    code: 201
    input: [amount_cents]
    output: CorporateAccount
    side_effects: ["funded_cents += amount_cents", "available_cents += amount_cents", "increments CorporateAccount.version by 1"]

  - method: POST
    path: "/corporate-accounts/{id}/vouchers"
    description: "Issue a voucher against the sponsor's available budget. OCC-guarded on the account's version."
    roles: [CorporateSponsor, ProgramAdmin]
    code: 201
    input: [face_value_cents, expires_at, expected_corporate_account_version]
    output: Voucher
    side_effects: ["Voucher created in status ISSUED with remaining_cents := face_value_cents", "CorporateAccount.available_cents -= face_value_cents; unallocated_voucher_cents += face_value_cents", "increments CorporateAccount.version by 1"]

  - method: GET
    path: "/vouchers"
    description: "List vouchers. corporate_account_id and assigned_learner_id are the reverse-reachability filters for both Voucher FKs."
    roles: [ProgramAdmin, Registrar, CorporateSponsor, Learner]
    code: 200
    input: ["corporate_account_id?", "assigned_learner_id?", "status?", "limit?", "offset?"]
    output: Voucher[]
    side_effects: []

  - method: GET
    path: "/vouchers/{id}"
    description: "Fetch one voucher with its remaining / committed / consumed split."
    roles: [ProgramAdmin, Registrar, CorporateSponsor, Learner]
    code: 200
    input: []
    output: Voucher
    side_effects: []

  - method: POST
    path: "/vouchers/{id}/assign"
    description: "Bind an ISSUED voucher to a learner."
    roles: [CorporateSponsor]
    code: 200
    input: [learner_id]
    output: Voucher
    side_effects: ["Voucher ISSUED -> ASSIGNED", "marketing_segment_recompute runs for the learner", "increments Voucher.version by 1"]

  - method: POST
    path: "/vouchers/{id}/void"
    description: "Void an unredeemed voucher and return its face value to the sponsor's available_cents."
    roles: [CorporateSponsor]
    code: 200
    input: []
    output: Voucher
    side_effects: ["Voucher ISSUED|ASSIGNED -> VOIDED", "CorporateAccount.available_cents += face_value_cents; unallocated_voucher_cents -= face_value_cents", "increments Voucher.version and CorporateAccount.version by 1 each"]

  # ---- Registrations ------------------------------------------------------
  - method: GET
    path: "/registrations"
    description: "List registrations. offering_id, learner_id, voucher_id and transferred_to_registration_id are the reverse-reachability filters for all four Registration FKs."
    roles: [ProgramAdmin, Registrar, Learner, Instructor]
    code: 200
    input: ["offering_id?", "learner_id?", "voucher_id?", "transferred_to_registration_id?", "enrollment_status?", "payment_status?", "limit?", "offset?"]
    output: Registration[]
    side_effects: []

  - method: GET
    path: "/registrations/{id}"
    description: "Fetch one registration with both state axes and the full price breakdown."
    roles: [ProgramAdmin, Registrar, Learner, Instructor]
    code: 200
    input: []
    output: Registration
    side_effects: []

  - method: POST
    path: "/registrations/{id}/pay"
    description: "Settle a PENDING x UNPAID registration by SELF_PAY or by committing a corporate VOUCHER. Seat resolution runs immediately afterwards."
    roles: [Learner, Registrar]
    code: 200
    input: ["method", "voucher_id?"]
    output: Registration
    side_effects: ["payment_status UNPAID -> PAID or VOUCHER_COMMITTED", "seat resolution: PENDING -> ENROLLED or PENDING -> WAITLISTED", "Offering OPEN -> WAITLIST_ONLY when the last seat is taken", "voucher and sponsor ledgers move remaining -> committed", "recompute Offering.net_program_revenue_cents", "increments Registration.version and Offering.version by 1 each"]

  - method: POST
    path: "/registrations/{id}/attendance"
    description: "Set the absolute number of sessions the learner attended. Idempotent overwrite, not an increment."
    roles: [Instructor, Registrar]
    code: 200
    input: [sessions_attended]
    output: Registration
    side_effects: ["Registration.sessions_attended := payload value", "increments Registration.version by 1"]

  - method: POST
    path: "/registrations/{id}/complete"
    description: "Award completion: gates on the attendance ratio, then issues the CEU CompletionRecord and runs the four-hop learner/marketing cascade."
    roles: [Instructor]
    code: 201
    input: []
    output: CompletionRecord
    side_effects: ["Registration ENROLLED -> COMPLETED", "CompletionRecord created with status ISSUED, ceu_awarded, attendance_ratio and certificate_number", "Learner lifetime totals and loyalty_tier recomputed", "marketing_segment_recompute runs", "increments Registration.version, Learner.version and Offering.version by 1 each"]

  # ---- Instructor contracting --------------------------------------------
  - method: POST
    path: "/instructor-contracts"
    description: "Offer a teaching contract for an offering. Starts in OFFERED."
    roles: [ProgramAdmin]
    code: 201
    input: ["offering_id", "instructor_id", "base_stipend_cents", "per_enrollment_cents", "enrollment_cap_for_pay", "pay_basis?"]
    output: InstructorContract
    side_effects: ["InstructorContract created in status OFFERED with pay_basis defaulting to CENSUS_LOCKED"]

  - method: GET
    path: "/instructor-contracts"
    description: "List contracts. offering_id and instructor_id are the reverse-reachability filters for both InstructorContract FKs."
    roles: [ProgramAdmin, Registrar, Instructor]
    code: 200
    input: ["offering_id?", "instructor_id?", "status?", "limit?", "offset?"]
    output: InstructorContract[]
    side_effects: []

  - method: GET
    path: "/instructor-contracts/{id}"
    description: "Fetch one contract including census_headcount, final_headcount, settled_pay_cents and kill_fee_cents."
    roles: [ProgramAdmin, Registrar, Instructor]
    code: 200
    input: []
    output: InstructorContract
    side_effects: []

  - method: POST
    path: "/instructor-contracts/{id}/sign"
    description: "Instructor accepts or declines the offered contract. Acceptance runs the half-open teaching-window overlap check."
    roles: [Instructor]
    code: 200
    input: [decision]
    output: InstructorContract
    side_effects: ["InstructorContract OFFERED -> SIGNED or OFFERED -> DECLINED", "Instructor.active_contract_count += 1 on acceptance", "increments InstructorContract.version and Instructor.version by 1 each"]

  - method: POST
    path: "/instructor-contracts/{id}/activate"
    description: "Move a SIGNED contract to ACTIVE once the offering has cleared census."
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: InstructorContract
    side_effects: ["InstructorContract SIGNED -> ACTIVE", "increments InstructorContract.version by 1"]

  - method: POST
    path: "/instructor-contracts/{id}/settle"
    description: "Settle instructor pay after the offering completes, using the contract's pay_basis variant of instructor_contract_pay."
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: InstructorContract
    side_effects: ["final_headcount and settled_pay_cents computed", "InstructorContract ACTIVE -> SETTLED", "Instructor.active_contract_count -= 1", "increments InstructorContract.version and Instructor.version by 1 each"]

  # ---- Completion records -------------------------------------------------
  - method: GET
    path: "/completion-records"
    description: "List completion records. registration_id and learner_id are the reverse-reachability filters for both CompletionRecord FKs."
    roles: [ProgramAdmin, Registrar, Learner, Instructor]
    code: 200
    input: ["registration_id?", "learner_id?", "status?", "limit?", "offset?"]
    output: CompletionRecord[]
    side_effects: []

  - method: GET
    path: "/completion-records/{id}"
    description: "Fetch one completion record with its certificate_number and ceu_awarded."
    roles: [ProgramAdmin, Registrar, Learner, Instructor]
    code: 200
    input: []
    output: CompletionRecord
    side_effects: []

  - method: GET
    path: "/completion-records/{id}/citations"
    description: "List every CPL citation that references this completion record. Reverse-reachability channel for CplCitation.completion_record_id."
    roles: [ProgramAdmin, Registrar, Learner]
    code: 200
    input: ["limit?", "offset?"]
    output: CplCitation[]
    side_effects: []

  - method: POST
    path: "/completion-records/{id}/revoke"
    description: "Revoke an issued certificate. Compensating action for POST /registrations/{id}/complete - the learner's lifetime_ceu_total returns to its pre-award value."
    roles: [Registrar]
    code: 200
    input: []
    output: CompletionRecord
    side_effects: ["CompletionRecord ISSUED -> REVOKED", "source Registration COMPLETED -> NO_SHOW", "Learner lifetime totals and loyalty_tier recomputed", "marketing_segment_recompute runs", "increments CompletionRecord.version, Registration.version and Learner.version by 1 each"]

  # ---- Refund / transfer --------------------------------------------------
  - method: POST
    path: "/refund-transfer-requests"
    description: "Open a refund or transfer request against an ENROLLED registration."
    roles: [Learner, Registrar]
    code: 201
    input: ["registration_id", "request_type", "refund_basis?", "target_offering_id?"]
    output: RefundTransferRequest
    side_effects: ["RefundTransferRequest created in SUBMITTED with days_before_start computed and a provisional computed_refund_cents"]

  - method: GET
    path: "/refund-transfer-requests"
    description: "List refund/transfer requests. registration_id and target_offering_id are the reverse-reachability filters for both FKs."
    roles: [ProgramAdmin, Registrar, Learner]
    code: 200
    input: ["registration_id?", "target_offering_id?", "status?", "request_type?", "limit?", "offset?"]
    output: RefundTransferRequest[]
    side_effects: []

  - method: GET
    path: "/refund-transfer-requests/{id}"
    description: "Fetch one refund/transfer request."
    roles: [ProgramAdmin, Registrar, Learner]
    code: 200
    input: []
    output: RefundTransferRequest
    side_effects: []

  - method: POST
    path: "/refund-transfer-requests/{id}/decide"
    description: "Approve into the REFUND or TRANSFER arm, or deny. An approving Registrar may override refund_basis, which re-values computed_refund_cents."
    roles: [Registrar]
    code: 200
    input: ["decision", "refund_basis?"]
    output: RefundTransferRequest
    side_effects: ["SUBMITTED -> REFUND_APPROVED | TRANSFER_APPROVED | DENIED", "computed_refund_cents re-evaluated under the effective refund_basis", "increments RefundTransferRequest.version by 1"]

  - method: POST
    path: "/refund-transfer-requests/{id}/settle"
    description: "Execute the approved arm: move money and seats for a refund, or mint the destination registration for a transfer."
    roles: [Registrar]
    code: 200
    input: []
    output: RefundTransferRequest
    side_effects: ["REFUND_APPROVED|TRANSFER_APPROVED -> SETTLED", "source Registration seat and money axes advance", "voucher and sponsor ledgers release value", "waitlist promotion / WAITLIST_ONLY -> OPEN on the source offering", "recompute net_program_revenue_cents on every affected offering"]

  # ---- Credit for prior learning -----------------------------------------
  - method: POST
    path: "/cpl-petitions"
    description: "Open a credit-for-prior-learning petition in DRAFT."
    roles: [Learner, Registrar]
    code: 201
    input: [learner_id, target_course_id]
    output: CplPetition
    side_effects: ["CplPetition created in DRAFT with revision_round 0"]

  - method: GET
    path: "/cpl-petitions"
    description: "List petitions. learner_id and target_course_id are the reverse-reachability filters for both CplPetition FKs."
    roles: [ProgramAdmin, Registrar, Learner]
    code: 200
    input: ["learner_id?", "target_course_id?", "status?", "limit?", "offset?"]
    output: CplPetition[]
    side_effects: []

  - method: GET
    path: "/cpl-petitions/{id}"
    description: "Fetch one petition including revision_round, assessed_by_user_id, claimed_ceu_total and awarded_credit_units."
    roles: [ProgramAdmin, Registrar, Learner]
    code: 200
    input: []
    output: CplPetition
    side_effects: []

  - method: GET
    path: "/cpl-petitions/{id}/citations"
    description: "List the petition's citations. Reverse-reachability channel for CplCitation.petition_id."
    roles: [ProgramAdmin, Registrar, Learner]
    code: 200
    input: ["limit?", "offset?"]
    output: CplCitation[]
    side_effects: []

  - method: POST
    path: "/cpl-petitions/{id}/citations"
    description: "Cite a prior CompletionRecord on a DRAFT or REVISION_REQUESTED petition, with the fraction of its CEU being claimed."
    roles: [Learner]
    code: 201
    input: [completion_record_id, weight]
    output: CplCitation
    side_effects: ["CplCitation created", "increments CplPetition.version by 1"]

  - method: POST
    path: "/cpl-petitions/{id}/submit"
    description: "Submit a DRAFT petition, or re-submit one that came back as REVISION_REQUESTED (closing the review cycle)."
    roles: [Learner]
    code: 200
    input: []
    output: CplPetition
    side_effects: ["CplPetition DRAFT|REVISION_REQUESTED -> SUBMITTED", "increments CplPetition.version by 1"]

  - method: POST
    path: "/cpl-petitions/{id}/review"
    description: "Take a submitted petition under review; stamps assessed_by_user_id with the acting ProgramAdmin."
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: CplPetition
    side_effects: ["CplPetition SUBMITTED -> UNDER_REVIEW", "assessed_by_user_id := acting X-User-ID", "increments CplPetition.version by 1"]

  - method: POST
    path: "/cpl-petitions/{id}/request-revision"
    description: "Send a petition back to the learner for revision, consuming one of the two revision rounds."
    roles: [ProgramAdmin]
    code: 200
    input: ["decision_note?"]
    output: CplPetition
    side_effects: ["CplPetition UNDER_REVIEW -> REVISION_REQUESTED", "revision_round += 1", "assessed_by_user_id := acting X-User-ID", "increments CplPetition.version by 1"]

  - method: POST
    path: "/cpl-petitions/{id}/decide"
    description: "Approve or deny a petition under review. The deciding ProgramAdmin must differ from assessed_by_user_id."
    roles: [ProgramAdmin]
    code: 200
    input: ["decision", "decision_note?"]
    output: CplPetition
    side_effects: ["claimed_ceu_total and awarded_credit_units computed by cpl_credit_conversion", "CplPetition UNDER_REVIEW -> APPROVED | DENIED", "increments CplPetition.version by 1"]

  # ---- Test-driving surface ----------------------------------------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical UTC clock, which every deadline, expiry, window and recency rule reads. The server starts with the logical clock at exactly 2026-08-01T00:00:00Z and MUST NOT fall back to real wall-clock time before or after this endpoint is called."
    roles: [ProgramAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: ["the logical clock is repositioned; no entity is mutated and no version is incremented"]

# ---------------------------------------------------------------------------
# 1.6 Error Code Catalog
# ---------------------------------------------------------------------------
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role missing or not a declared role, or X-User-ID missing for a non-Anonymous role."
  - id: ERR_FORBIDDEN_ROLE
    http: 403
    condition: "The acting role is not listed in the target endpoint's roles."
  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "An entity-backed role acts on a resource it does not own: a Learner on another learner's registration/petition, an Instructor on a contract that is not theirs or on a registration whose offering they do not staff, a CorporateSponsor on another sponsor's account or voucher."
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Missing required field, wrong type, invalid enum member, negative money/count, duplicate course_code or email, end_date <= start_date, census_at > start_date, term_code present for a ROLLING offering or absent for a TERM offering, max_enrollment < min_enrollment, target_offering_id supplied for a REFUND or missing for a TRANSFER, weight outside (0, 1], pagination limit outside [1,100]."
  - id: ERR_COURSE_NOT_FOUND
    http: 404
    condition: "A course id in the path or body does not resolve."
  - id: ERR_OFFERING_NOT_FOUND
    http: 404
    condition: "An offering id in the path or body does not resolve."
  - id: ERR_LEARNER_NOT_FOUND
    http: 404
    condition: "A learner id in the path or body does not resolve."
  - id: ERR_INSTRUCTOR_NOT_FOUND
    http: 404
    condition: "An instructor id in the body does not resolve."
  - id: ERR_ACCOUNT_NOT_FOUND
    http: 404
    condition: "A corporate account id in the path does not resolve."
  - id: ERR_VOUCHER_NOT_FOUND
    http: 404
    condition: "A voucher id in the path or body does not resolve."
  - id: ERR_REGISTRATION_NOT_FOUND
    http: 404
    condition: "A registration id in the path or body does not resolve."
  - id: ERR_CONTRACT_NOT_FOUND
    http: 404
    condition: "An instructor-contract id in the path does not resolve."
  - id: ERR_COMPLETION_RECORD_NOT_FOUND
    http: 404
    condition: "A completion-record id in the path or body does not resolve."
  - id: ERR_PETITION_NOT_FOUND
    http: 404
    condition: "A CPL petition id in the path does not resolve."
  - id: ERR_REQUEST_NOT_FOUND
    http: 404
    condition: "A refund/transfer request id in the path does not resolve."
  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_offering_version or expected_corporate_account_version does not match the stored parent version."
  - id: ERR_OFFERING_NOT_OPEN
    http: 409
    condition: "A registration create or payment targets an Offering whose status is not OPEN and not WAITLIST_ONLY."
  - id: ERR_INVALID_STATE
    http: 409
    condition: "The addressed resource is not in a from-state declared for the requested transition."
  - id: ERR_COURSE_RETIRED
    http: 422
    condition: "An Offering create/open or a CPL petition submission references a Course whose status is RETIRED."
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "The ProgramAdmin deciding a CPL petition is the same X-User-ID recorded in assessed_by_user_id."
  - id: ERR_PREREQUISITE_NOT_MET
    http: 422
    condition: "The offering's course declares a prerequisite the learner has neither completed (ISSUED CompletionRecord) nor been granted through an APPROVED CPL petition."
  - id: ERR_ATTENDANCE_BELOW_THRESHOLD
    http: 422
    condition: "attendance_ratio computed at completion is strictly below MIN_ATTENDANCE_RATIO (0.80)."
  - id: ERR_CENSUS_TOO_EARLY
    http: 409
    condition: "POST /offerings/{id}/census called while the logical clock is strictly before offering.census_at."
  - id: ERR_OFFERING_NOT_ENDED
    http: 409
    condition: "POST /offerings/{id}/complete called while the logical clock is strictly before offering.end_date."
  - id: ERR_REFUND_WINDOW_CLOSED
    http: 422
    condition: "A refund or transfer request is opened at or after the source offering's end_date."
  - id: ERR_INSTRUCTOR_SCHEDULE_CONFLICT
    http: 409
    condition: "Accepting the contract would give the instructor two SIGNED/ACTIVE contracts whose offerings' half-open [start_date, end_date) windows intersect."
  - id: ERR_LEARNER_LOAD_EXCEEDED
    http: 409
    condition: "The learner's CEU load over closed, endpoint-inclusive overlapping offering windows would exceed MAX_CONCURRENT_CEU (4.0)."
  - id: ERR_TRANSFER_TARGET_INCOMPATIBLE
    http: 422
    condition: "The transfer destination is the same offering, is not OPEN/WAITLIST_ONLY, sits on a RETIRED course, or carries a different Course.ceu_units than the source."
  - id: ERR_CITATION_NOT_ELIGIBLE
    http: 422
    condition: "A cited CompletionRecord is not ISSUED or belongs to another learner, or a revocation would invalidate a citation on an APPROVED petition."
  - id: ERR_DUPLICATE_REGISTRATION
    http: 409
    condition: "The learner already holds a PENDING/ENROLLED/WAITLISTED/COMPLETED registration on this offering."
  - id: ERR_CPL_DUPLICATE_AWARD
    http: 409
    condition: "The learner already holds an APPROVED CPL petition for the same target course."
  - id: ERR_CPL_REVISION_LIMIT
    http: 409
    condition: "A revision is requested when petition.revision_round has already reached MAX_CPL_REVISION_ROUNDS (2)."
  - id: ERR_OFFERING_FULL
    http: 409
    condition: "A registration is attempted on a WAITLIST_ONLY offering whose waitlist_count has reached WAITLIST_CAP (5)."
  - id: ERR_VOUCHER_NOT_USABLE
    http: 422
    condition: "The voucher is not ASSIGNED/PARTIALLY_REDEEMED, is bound to another learner, has expired, or its sponsor account is SUSPENDED."
  - id: ERR_ACCOUNT_FUNDS_INSUFFICIENT
    http: 402
    condition: "The sponsor's available_cents is below the requested voucher face_value_cents."
  - id: ERR_VOUCHER_INSUFFICIENT_BALANCE
    http: 402
    condition: "The voucher's remaining_cents is below the registration's total_due_cents."
  - id: ERR_TRANSFER_CREDIT_INSUFFICIENT
    http: 402
    condition: "The carried credit (amount_paid_cents - TRANSFER_FEE_CENTS) is below the destination registration's total_due_cents."
  - id: ERR_CPL_AWARD_ZERO
    http: 422
    condition: "An APPROVE decision is attempted on a petition whose cpl_credit_conversion output floors to 0.0 credit units."

# ---------------------------------------------------------------------------
# 1.7 RBAC Matrix
# ---------------------------------------------------------------------------
roles:
  - name: ProgramAdmin
    description: "Extension-school program office. Owns the catalog, offerings, the census cancellation decision, instructor contracting and CPL adjudication."
    identity: opaque
    exclusive_operations:
      - "POST /courses"
      - "POST /courses/{id}/retire"
      - "POST /offerings"
      - "POST /offerings/{id}/open"
      - "POST /offerings/{id}/census"
      - "POST /offerings/{id}/complete"
      - "POST /instructors"
      - "POST /corporate-accounts"
      - "POST /instructor-contracts"
      - "POST /instructor-contracts/{id}/activate"
      - "POST /instructor-contracts/{id}/settle"
      - "POST /cpl-petitions/{id}/review"
      - "POST /cpl-petitions/{id}/request-revision"
      - "POST /cpl-petitions/{id}/decide"
      - "POST /corporate-accounts/{id}/suspend"
      - "POST /corporate-accounts/{id}/reinstate"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "POST /learners"
      - "POST /corporate-accounts/{id}/deposits"
      - "POST /corporate-accounts/{id}/vouchers"
      - "all GET endpoints"
    note: "Segregation of duties: the X-User-ID that stamped assessed_by_user_id on a petition may never be the X-User-ID that decides it."

  - name: Registrar
    description: "Student records office. Registers learners on their behalf, records attendance, revokes certificates and adjudicates refund/transfer requests."
    identity: opaque
    exclusive_operations:
      - "POST /completion-records/{id}/revoke"
      - "POST /refund-transfer-requests/{id}/decide"
      - "POST /refund-transfer-requests/{id}/settle"
    shared_operations:
      - "POST /learners"
      - "POST /learners/{id}/marketing-preference"
      - "POST /offerings/{id}/registrations"
      - "POST /registrations/{id}/pay"
      - "POST /registrations/{id}/attendance"
      - "POST /refund-transfer-requests"
      - "POST /cpl-petitions"
      - "all GET endpoints except GET /instructors/{id} is shared with Instructor"

  - name: Learner
    description: "A registered continuing-education learner acting on their own records."
    identity: "entity_backed:Learner"
    exclusive_operations:
      - "POST /cpl-petitions/{id}/citations"
      - "POST /cpl-petitions/{id}/submit"
    shared_operations:
      - "POST /offerings/{id}/registrations"
      - "POST /registrations/{id}/pay"
      - "POST /learners/{id}/marketing-preference"
      - "POST /refund-transfer-requests"
      - "POST /cpl-petitions"
      - "GET /courses, GET /courses/{id}, GET /offerings, GET /offerings/{id}, GET /learners/{id}, GET /learners/{id}/marketing-memberships, GET /vouchers, GET /vouchers/{id}, GET /registrations, GET /registrations/{id}, GET /completion-records, GET /completion-records/{id}, GET /completion-records/{id}/citations, GET /cpl-petitions, GET /cpl-petitions/{id}, GET /cpl-petitions/{id}/citations, GET /refund-transfer-requests, GET /refund-transfer-requests/{id}"
    note: "X-User-ID MUST equal the Learner.id being acted on; otherwise ERR_NOT_RESOURCE_OWNER."

  - name: Instructor
    description: "Contracted teaching staff. Signs or declines contracts, records attendance and awards completions for offerings they staff."
    identity: "entity_backed:Instructor"
    exclusive_operations:
      - "POST /instructor-contracts/{id}/sign"
      - "POST /registrations/{id}/complete"
    shared_operations:
      - "POST /registrations/{id}/attendance"
      - "GET /courses, GET /courses/{id}, GET /offerings, GET /offerings/{id}, GET /instructors/{id}, GET /registrations, GET /registrations/{id}, GET /instructor-contracts, GET /instructor-contracts/{id}, GET /completion-records, GET /completion-records/{id}"
    note: "X-User-ID MUST equal the Instructor.id; contract-scoped operations additionally require an InstructorContract on the relevant offering."

  - name: CorporateSponsor
    description: "Employer sponsoring learners through prepaid vouchers."
    identity: "entity_backed:CorporateAccount"
    exclusive_operations:
      - "POST /vouchers/{id}/assign"
      - "POST /vouchers/{id}/void"
    shared_operations:
      - "POST /corporate-accounts/{id}/deposits"
      - "POST /corporate-accounts/{id}/vouchers"
      - "GET /courses, GET /courses/{id}, GET /offerings, GET /offerings/{id}, GET /corporate-accounts/{id}, GET /vouchers, GET /vouchers/{id}"
    note: "X-User-ID MUST equal the CorporateAccount.id."

  - name: Anonymous
    description: "Unauthenticated visitor; may only create a learner account."
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "POST /learners"
    note: "The only role for which X-User-ID may be omitted."
