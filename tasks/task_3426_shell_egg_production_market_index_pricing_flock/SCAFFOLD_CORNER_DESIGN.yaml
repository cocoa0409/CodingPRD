              captures: { h1_id: $.data.id }
            - call: "POST /api/houses/${h1_id}/flocks"
              payload: { flock_code: "F1", program: "CONVENTIONAL", ownership: "OWNED", placement_date: "2026-04-28T00:00:00Z", placed_hen_count: 60000 }
              as: ProductionPlanner
              captures: { f1_id: $.data.id }
