      - name: parallel_custody_and_compliance_dimensions_move_independently
        claim_type: parallel
        excluded_because:
          difficulty_instance: "non_linear_state_machine / intake_parallel_custody_and_compliance_dimensions_evolve_independently"
          rationale: "The §1.8 instance drives both Intake dimensions through the full RECEIVED..RELEASED and MANIFEST_DRAFT..MANIFEST_CLOSED walks in one recipe and asserts the combined (custody_state, compliance_state) pair after every step, including the states no single-dimension test can reach (PACKAGED + MANIFEST_SUBMITTED, QUARANTINED + MANIFEST_REJECTED). A separate breadth test would replay the same call sequence with weaker assertions."

      - name: module_triage_fork_branches_carry_different_side_effects
        claim_type: guarded_transitions
        excluded_because:
          difficulty_instance: "non_linear_state_machine / module_triage_fork_three_branches_divergent_side_effects"
          rationale: "The §1.8 instance triages three sibling modules of one intake into REFURB_QUEUE, SECOND_LIFE_QUEUE and RECOVERY_QUEUE, then proves only the RECOVERY_QUEUE branch is chargeable into a lot while the other two are only shippable - which is exactly the branching-shape claim (each fork path works and carries branch-specific side effects)."

      - name: manifest_rejection_cascades_down_to_modules_and_triage_decisions
        claim_type: cascade_down
        excluded_because:
          difficulty_instance: "transitive_cascade / manifest_reject_three_link_cascade_voids_triage_decisions"
          rationale: "The §1.8 instance walks manifest REJECTED -> Intake QUARANTINED -> ACTIVE TriageDecisions VOIDED -> Modules back to PENDING_TRIAGE and asserts that only non-terminal children were touched, covering the cascade-down pattern end to end."

      - name: campaign_bubbles_up_to_closed_when_its_last_lot_becomes_terminal
        claim_type: bubble_up
        excluded_because:
          difficulty_instance: "transitive_cascade / finalize_lot_four_link_cascade_to_supplier_quality_strike"
          rationale: "The §1.8 finalize cascade asserts ProcessingCampaign.status == CLOSED with committed_input_kg == 100.000 once its only RecoveryLot reaches FINALIZED, which is the bubble-up claim (all children terminal -> parent auto-transitions)."

      - name: settlement_post_adjusts_the_supplier_ledger_across_entities
        claim_type: cross_entity
        excluded_because:
          difficulty_instance: "transitive_cascade / post_settlement_four_link_cascade_to_intake_quarantine"
          rationale: "The §1.8 instance asserts the full cross-entity chain settlement POSTED -> Supplier.payable_balance_cents -> Supplier.credit_hold -> RECEIVED Intakes QUARANTINED, including the fields and states of every downstream row."

      - name: consumed_modules_sync_the_settlement_ledger_on_finalize
        claim_type: ledger_sync
        excluded_because:
          difficulty_instance: "dual_variant_calc / settlement_provisional_vs_final_repricing_on_lot_finalize"
          rationale: "The §1.8 instance reconciles the ancestor's derived money fields before and after the FINALIZED cascade (gross 260224 -> 257008, net 216493 -> 213727), which is the ledger-sync claim for the module -> settlement chain."

      - name: voiding_a_settlement_reverses_every_original_side_effect
        claim_type: compensation
        excluded_because:
          difficulty_instance: "compensating_invariant / settlement_post_then_void_restores_supplier_obligation_invariant"
          rationale: "The §1.8 instance posts then voids a settlement and asserts payable_balance_cents, posted_amount_cents, credit_hold and the released quarantines all return to their pre-post values with no drift - the compensation pattern in full."

      - name: charge_is_guarded_by_the_intakes_custody_state
        claim_type: conditional_cascade
        excluded_because:
          difficulty_instance: "cross_entity_state_dependency / charge_requires_intake_released_not_merely_packaged"
          rationale: "The §1.8 instance shows the RECOVERY_QUEUE -> CHARGED transition firing only when the module's Intake is RELEASED (ERR_INTAKE_NOT_RELEASED while merely PACKAGED), i.e. the side effect is applied conditionally on a different entity's state."

  - section: calculations
    instances:
      - name: capacity_projection_growth_curve_and_first_deficit_day
        claim_type: correct_result
        grounds:
          - calculations.facility_capacity_projection
          - endpoints[GET /recycling/facilities/{facility_id}/capacity-projection]
          - global_constants.LOOKBACK_DAYS
          - global_constants.GROWTH_RATE_PER_DAY
        distinguishing_aspect: "Three 1000.0 kg intakes inside the 30-day lookback give baseline 3000/30 = 100.000 kg/day; the 0.4%/day compounding-free ramp is rounded per day before the horizon sum (2084.000 over 20 days) and the first day strictly above the 105.0 mech ceiling is day 13 at 105.200, a deficit of 0.200 kg."
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00.000Z; one campus with mech_capacity_kg_per_day 105.0 and hydro_capacity_kg_per_day 2000.0; one supplier; three NMC622 intakes of gross 1010.0 / tare 10.0 (net 1000.0 each) all received at 2026-08-01T00:00:00.000Z and left at custody_state RECEIVED."
          setup_api_calls:
            - call: "POST /recycling/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /recycling/facilities"
              payload: { name: "Reno Campus", state_code: "NV", mech_capacity_kg_per_day: 105.0, hydro_capacity_kg_per_day: 2000.0 }
              as: PlatformAdmin
              captures: { fac_id: "$.data.id" }
            - call: "POST /recycling/suppliers"
              payload: { legal_name: "Northstar Automotive", channel: "AUTOMAKER", credit_limit_cents: 200000 }
              as: PlatformAdmin
              captures: { sup_id: "$.data.id" }
            - call: "POST /recycling/intakes"
              payload: { supplier_id: "${sup_id}", facility_id: "${fac_id}", declared_chemistry: "NMC622", gross_mass_kg: 1010.0, packaging_tare_kg: 10.0, declared_ni_pct: 12.0 }
              as: IntakeClerk
              captures: { i1_id: "$.data.id" }
            - call: "POST /recycling/intakes"
              payload: { supplier_id: "${sup_id}", facility_id: "${fac_id}", declared_chemistry: "NMC622", gross_mass_kg: 1010.0, packaging_tare_kg: 10.0, declared_ni_pct: 12.0 }
              as: IntakeClerk
              captures: { i2_id: "$.data.id" }
            - call: "POST /recycling/intakes"
              payload: { supplier_id: "${sup_id}", facility_id: "${fac_id}", declared_chemistry: "NMC622", gross_mass_kg: 1010.0, packaging_tare_kg: 10.0, declared_ni_pct: 12.0 }
              as: IntakeClerk
              captures: { i3_id: "$.data.id" }
          trigger:
            - call: "GET /recycling/facilities/${fac_id}/capacity-projection"
              payload: { horizon_days: 20 }
              as: PlantOperator
              captures: { baseline: "$.data.baseline_kg_per_day", horizon: "$.data.horizon_days", projected: "$.data.projected_input_kg", mech: "$.data.mech_capacity_kg_per_day", hydro: "$.data.hydro_capacity_kg_per_day", dday: "$.data.first_deficit_day", ddate: "$.data.first_deficit_date", dkg: "$.data.deficit_kg" }
          assert:
            - "HTTP 200 and ${baseline} == 100.000 (3 x 1000.0 / LOOKBACK_DAYS 30)"
            - "${horizon} == 20, ${mech} == 105.0 and ${hydro} == 2000.0"
            - "${projected} == 2084.000 - sum over d=1..20 of round_half_up(100.000 * (1 + 0.004*d), 3), i.e. 100.0 * (20 + 0.004*210)"
            - "${dday} == 13 because projected_kg[13] == 105.200 > 105.0 while projected_kg[12] == 104.800 is not (the comparison is strict)"
            - "${ddate} == 2026-08-14T00:00:00.000Z (clock_now + 13 days)"
            - "${dkg} == 0.200 == 105.200 - 105.0"
            - "The projection performs no writes: Intake.${i1_id}.version == 1, Intake.${i2_id}.version == 1 and Intake.${i3_id}.version == 1"

      - name: capacity_projection_excludes_quarantined_intake_mass
        claim_type: input_set_filtering
        grounds:
          - calculations.facility_capacity_projection.input_set
          - state_machines.Intake.custody_state.DISCHARGED_to_QUARANTINED
        distinguishing_aspect: "Quarantining one of the three 1000.0 kg intakes through a manifest rejection re-bases the same projection from 100.000 to 66.667 kg/day, dropping projected_input_kg to 1389.340 and removing the deficit entirely (first_deficit_day null, deficit_kg 0.0) - the projection is re-evaluated from live state, not cached."
        test_recipe:
          setup:
            - "The fixture of capacity_projection_growth_curve_and_first_deficit_day: clock 2026-08-01T00:00:00.000Z, mech ceiling 105.0, three RECEIVED intakes of net 1000.0 kg each."
          setup_api_calls:
            - call: "POST /recycling/_clock/set_current_utc"
