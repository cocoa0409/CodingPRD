        grounds:
          - "§1.2 Hire ACCEPTED -> ONBOARDED requires orientation_session_id to be set and that TrainingSession to be COMPLETED (else ERR_ORIENTATION_NOT_COMPLETED), and separately that the clock has reached start_date; §1.6 declares ERR_ORIENTATION_NOT_COMPLETED at 422."
        distinguishing_aspect: "The clock has passed the hire's start_date, so the date gate is satisfied and the only unmet condition is the still-SCHEDULED orientation session, which is ERR_ORIENTATION_NOT_COMPLETED at 422."
