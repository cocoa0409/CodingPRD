          setup:
            - "Vendor NRTH, style TOP1001, sample SMP-1001 RECEIVED, MATCHED and IN_STUDIO (Style is SAMPLE_READY)."
            - "One required ON_MODEL item assigned to a 09:00-13:00 MODEL session, which is then LOCKED (Style is SCHEDULED)."
