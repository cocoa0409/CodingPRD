              as_user_id: "${ag1_id}"
              captures: { err_sign: "$.data.error_id" }
          assert:
            - 'HTTP 409 with data.error_id == "ERR_INVALID_CONTRACT_STATE"'
            - 'AgentContract.${c1_id}.status == "PENDING_COMPLIANCE_REVIEW" and .agency_signed_by_user_id == "${ag1_id}"'
            - 'AgentContract.${c1_id}.version == ${c1_v_signed} (the replay wrote nothing)'

      - name: vetting_and_posture_dimensions_are_independent
        claim_type: parallel
        grounds:
          - complexity_profile.state_machine_shape
          - state_machines.Agency.vetting_state
          - state_machines.Agency.compliance_posture
        distinguishing_aspect: |
          Posture actions move compliance_posture GOOD_STANDING to WATCH and back while
          vetting_state remains CLEARED, and a RE_SCREEN afterwards moves vetting_state
          without disturbing the posture, so the combined state is the product of the two.
        test_recipe:
          setup:
            - "One agency has been cleared, so vetting_state is CLEARED and compliance_posture is GOOD_STANDING with rolling_risk_score 0.00."
          setup_api_calls:
            - call: "POST /recruitment/agencies"
              payload: { legal_name: "Parallel Dimensions Agency", home_country_code: "IN", ownership_disclosed: true, beneficial_owner_count: 1, sanctions_screen_passed: true, reference_check_count: 2 }
              as: RecruitmentOfficer
              as_user_id: "officer-1"
              captures: { ag1_id: "$.data.id" }
            - call: "POST /recruitment/agencies/${ag1_id}/vetting"
              payload: { action: "SUBMIT_FOR_SCREENING" }
              as: RecruitmentOfficer
              as_user_id: "officer-1"
            - call: "POST /recruitment/agencies/${ag1_id}/vetting"
              payload: { action: "CLEAR" }
              as: ComplianceOfficer
              as_user_id: "compliance-1"
          trigger:
            - call: "POST /recruitment/agencies/${ag1_id}/posture-actions"
              payload: { action: "PLACE_ON_WATCH", reason: "Third-party complaint under review" }
              as: ComplianceOfficer
              as_user_id: "compliance-1"
            - call: "POST /recruitment/agencies/${ag1_id}/posture-actions"
              payload: { action: "CLEAR_WATCH", reason: "Complaint withdrawn" }
              as: ComplianceOfficer
              as_user_id: "compliance-1"
            - call: "POST /recruitment/agencies/${ag1_id}/vetting"
              payload: { action: "RE_SCREEN" }
              as: ComplianceOfficer
              as_user_id: "compliance-1"
          assert:
            - 'after PLACE_ON_WATCH: Agency.${ag1_id}.compliance_posture == "WATCH", .vetting_state == "CLEARED", .last_posture_reason == "Third-party complaint under review"'
            - 'after CLEAR_WATCH: Agency.${ag1_id}.compliance_posture == "GOOD_STANDING" (allowed because rolling_risk_score is 0.00 < 40.00) and .vetting_state is still "CLEARED"'
            - 'after RE_SCREEN: Agency.${ag1_id}.vetting_state == "SCREENING" while .compliance_posture stays "GOOD_STANDING"'
            - 'Agency.${ag1_id}.version == 6 (three creation/vetting writes plus three trigger writes)'

      - name: disclosure_reissue_after_invalidation_cycles
        claim_type: cyclic
        grounds:
          - state_machines.StudentApplication.disclosure_state
          - state_machines.AgentContract.status.PENDING_COMPLIANCE_REVIEW_to_DRAFT
          - entities.StudentApplication.fields.disclosure_ack_token
        distinguishing_aspect: |
          The disclosure dimension loops NOT_ISSUED to ISSUED to INVALIDATED and back to
          ISSUED, and the re-issue mints a different token while re-pinning the contract's
