  - section: errors
    instances:
      - name: corner_unknown_identifier_probes_return_the_entity_specific_not_found
        claim_type: violation_to_error
        grounds:
          - errors[ERR_PROTOCOL_NOT_FOUND]
          - errors[ERR_PHYSICIAN_NOT_FOUND]
          - errors[ERR_CLINICIAN_NOT_FOUND]
          - errors[ERR_STAFFING_ASSIGNMENT_NOT_FOUND]
          - errors[ERR_QUEUE_ENTRY_NOT_FOUND]
          - errors[ERR_ASSESSMENT_NOT_FOUND]
          - errors[ERR_PRESCRIPTION_NOT_FOUND]
          - errors[ERR_CHART_REVIEW_NOT_FOUND]
          - errors[ERR_VISIT_SUMMARY_NOT_FOUND]
        distinguishing_aspect: "Each by-id read reports ITS OWN not-found code rather than a shared 404, and identifiers are type-scoped: feeding a real Protocol id to GET /physicians/{physicianId} yields ERR_PHYSICIAN_NOT_FOUND, not a successful read and not ERR_PROTOCOL_NOT_FOUND."
        test_recipe:
          setup:
            - "A CA StateRule and one real Protocol exist, so the tables are not empty and a 404 cannot be explained away as 'no rows at all'."
          setup_api_calls:
            - call: "POST /state-rules"
              payload: { state_code: "CA", chart_review_sample_pct: 40, review_deadline_hours: 72, collaborating_physician_required: true, min_independent_practice_age_months: 24, controlled_rx_allowed: false, max_supervised_clinicians_per_physician: 3 }
              as: ClinicAdmin
            - call: "POST /protocols"
              payload: { complaint_code: "SORE_THROAT", min_age_months: 12, max_age_months: 1200, base_price_cents: 9900, acuity_tier: 2, red_flag_codes: ["STRIDOR"], max_temp_c: 39.5, max_heart_rate_bpm: 120, min_spo2_pct: 92, requires_cosign: false, allowed_state_codes: ["CA"] }
              as: ClinicAdmin
              captures: { prot61_id: $.data.id }
          trigger:
            - call: "GET /protocols/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: ClinicAdmin
              captures: { e_protocol: $.data.error_id }
            - call: "GET /physicians/${prot61_id}"
              payload: {}
              as: ClinicAdmin
              captures: { e_physician: $.data.error_id }
            - call: "GET /clinicians/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: ClinicAdmin
              captures: { e_clinician: $.data.error_id }
            - call: "GET /staffing-assignments/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: ClinicAdmin
              captures: { e_assignment: $.data.error_id }
            - call: "GET /queue-entries/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: ClinicAdmin
              captures: { e_queue_entry: $.data.error_id }
            - call: "GET /assessments/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: ClinicAdmin
              captures: { e_assessment: $.data.error_id }
            - call: "GET /prescriptions/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: ClinicAdmin
              captures: { e_prescription: $.data.error_id }
            - call: "GET /chart-reviews/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: ClinicAdmin
              captures: { e_chart_review: $.data.error_id }
            - call: "GET /visit-summaries/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: ClinicAdmin
              captures: { e_summary: $.data.error_id }
            - call: "GET /protocols/${prot61_id}"
              payload: {}
              as: ClinicAdmin
              captures: { control_complaint: $.data.complaint_code }
          assert:
            - "${e_protocol} == ERR_PROTOCOL_NOT_FOUND with HTTP status 404"
            - "${e_physician} == ERR_PHYSICIAN_NOT_FOUND with HTTP status 404   # a real Protocol id is not a Physician id"
            - "${e_clinician} == ERR_CLINICIAN_NOT_FOUND with HTTP status 404"
            - "${e_assignment} == ERR_STAFFING_ASSIGNMENT_NOT_FOUND with HTTP status 404"
            - "${e_queue_entry} == ERR_QUEUE_ENTRY_NOT_FOUND with HTTP status 404"
            - "${e_assessment} == ERR_ASSESSMENT_NOT_FOUND with HTTP status 404"
            - "${e_prescription} == ERR_PRESCRIPTION_NOT_FOUND with HTTP status 404"
            - "${e_chart_review} == ERR_CHART_REVIEW_NOT_FOUND with HTTP status 404"
            - "${e_summary} == ERR_VISIT_SUMMARY_NOT_FOUND with HTTP status 404"
            - "${control_complaint} == SORE_THROAT with HTTP status 200   # the real id still reads back"

      - name: corner_state_with_no_state_rule_blocks_staffing_until_the_rule_is_filed
        claim_type: violation_to_error
        grounds:
          - validations[priority=8]
          - errors[ERR_STATE_RULE_NOT_FOUND]
        distinguishing_aspect: "Clinics, clinicians and physicians can be registered for a state that has no StateRule — the rule is only demanded at the first state-dependent write. Staffing a TX clinic returns ERR_STATE_RULE_NOT_FOUND (404, not 422) and the very same request succeeds unchanged once the TX StateRule is filed."
        test_recipe:
          setup:
            - "A CA StateRule exists but no TX StateRule."
            - "A TX clinic, a TX-licensed physician and a TX-licensed clinician are registered — none of those three writes consults a StateRule."
          setup_api_calls:
            - call: "POST /state-rules"
              payload: { state_code: "CA", chart_review_sample_pct: 40, review_deadline_hours: 72, collaborating_physician_required: true, min_independent_practice_age_months: 24, controlled_rx_allowed: false, max_supervised_clinicians_per_physician: 3 }
              as: ClinicAdmin
            - call: "POST /clinics"
              payload: { name: "TX Store 62", state_code: "TX", min_clinicians_required: 1, appointment_slots_per_hour: 2, walk_in_queue_capacity: 5 }
              as: ClinicAdmin
              captures: { c62_id: $.data.id }
            - call: "POST /physicians"
              payload: { full_name: "Dr Dogwood", licensed_state_codes: ["TX"], max_supervised_clinicians: 3 }
              as: ClinicAdmin
              captures: { p62_id: $.data.id }
            - call: "POST /clinicians"
              payload: { full_name: "NP Dogwood", credential: "NP", license_state_code: "TX", home_clinic_id: "${c62_id}", supervising_physician_id: "${p62_id}" }
              as: ClinicAdmin
              captures: { cl62_id: $.data.id }
          trigger:
            - call: "POST /staffing-assignments"
              payload: { clinic_id: "${c62_id}", clinician_id: "${cl62_id}", role_kind: "PRIMARY", starts_at: "2026-08-01T00:00:00Z", ends_at: "2026-08-01T23:00:00Z", pinned_supervising_physician_id: "${p62_id}" }
              as: ClinicAdmin
              captures: { no_rule_err: $.data.error_id }
            - call: "POST /state-rules"
              payload: { state_code: "TX", chart_review_sample_pct: 10, review_deadline_hours: 120, collaborating_physician_required: true, min_independent_practice_age_months: 24, controlled_rx_allowed: true, max_supervised_clinicians_per_physician: 5 }
              as: ClinicAdmin
            - call: "POST /staffing-assignments"
              payload: { clinic_id: "${c62_id}", clinician_id: "${cl62_id}", role_kind: "PRIMARY", starts_at: "2026-08-01T00:00:00Z", ends_at: "2026-08-01T23:00:00Z", pinned_supervising_physician_id: "${p62_id}" }
              as: ClinicAdmin
              captures: { sa62_id: $.data.id, sa62_status: $.data.status }
          assert:
            - "the clinic, physician and clinician writes all returned 201 with no TX StateRule on file"
            - "${no_rule_err} == ERR_STATE_RULE_NOT_FOUND with HTTP status 404"
            - "the retried assignment returns 201 with ${sa62_status} == ACTIVE   # the logical clock 2026-08-01T00:00:00Z is inside [starts_at, ends_at)"
            - "Clinic.${c62_id}.on_duty_clinician_count == 1 and Clinic.${c62_id}.open_status == OPEN"

      - name: corner_state_rule_and_protocol_offering_uniqueness_are_scoped_differently
        claim_type: violation_to_error
        grounds:
          - validations[priority=55]
          - errors[ERR_DUPLICATE_STATE_RULE]
          - errors[ERR_DUPLICATE_PROTOCOL_OFFERING]
        distinguishing_aspect: "StateRule uniqueness is on the scalar state_code, but Protocol uniqueness is a SET INTERSECTION on (complaint_code, allowed_state_codes): a second SORE_THROAT protocol sharing only NV is rejected, while the same complaint in a disjoint state list and a different complaint in an already-used state are both accepted."
        test_recipe:
          setup:
            - "One CA StateRule exists and one SORE_THROAT protocol is offered in CA and NV."
          setup_api_calls:
            - call: "POST /state-rules"
              payload: { state_code: "CA", chart_review_sample_pct: 40, review_deadline_hours: 72, collaborating_physician_required: true, min_independent_practice_age_months: 24, controlled_rx_allowed: false, max_supervised_clinicians_per_physician: 3 }
              as: ClinicAdmin
            - call: "POST /protocols"
              payload: { complaint_code: "SORE_THROAT", min_age_months: 12, max_age_months: 1200, base_price_cents: 9900, acuity_tier: 2, red_flag_codes: ["STRIDOR"], max_temp_c: 39.5, max_heart_rate_bpm: 120, min_spo2_pct: 92, requires_cosign: false, allowed_state_codes: ["CA", "NV"] }
              as: ClinicAdmin
              captures: { prot63_id: $.data.id }
          trigger:
            - call: "POST /state-rules"
              payload: { state_code: "CA", chart_review_sample_pct: 25, review_deadline_hours: 48, collaborating_physician_required: false, min_independent_practice_age_months: 36, controlled_rx_allowed: true, max_supervised_clinicians_per_physician: 9 }
              as: ClinicAdmin
              captures: { dup_rule_err: $.data.error_id }
            - call: "POST /protocols"
              payload: { complaint_code: "SORE_THROAT", min_age_months: 24, max_age_months: 900, base_price_cents: 8800, acuity_tier: 1, red_flag_codes: [], max_temp_c: 39.0, max_heart_rate_bpm: 118, min_spo2_pct: 93, requires_cosign: false, allowed_state_codes: ["NV", "AZ"] }
              as: ClinicAdmin
              captures: { dup_offer_err: $.data.error_id }
            - call: "POST /protocols"
              payload: { complaint_code: "SORE_THROAT", min_age_months: 24, max_age_months: 900, base_price_cents: 8800, acuity_tier: 1, red_flag_codes: [], max_temp_c: 39.0, max_heart_rate_bpm: 118, min_spo2_pct: 93, requires_cosign: false, allowed_state_codes: ["AZ"] }
              as: ClinicAdmin
              captures: { disjoint_prot_id: $.data.id }
            - call: "POST /protocols"
              payload: { complaint_code: "EAR_PAIN", min_age_months: 24, max_age_months: 1200, base_price_cents: 7900, acuity_tier: 1, red_flag_codes: ["MASTOID_SWELLING"], max_temp_c: 39.0, max_heart_rate_bpm: 118, min_spo2_pct: 93, requires_cosign: false, allowed_state_codes: ["CA", "NV"] }
              as: ClinicAdmin
              captures: { other_complaint_prot_id: $.data.id }
            - call: "GET /protocols"
              payload: { complaint_code: "SORE_THROAT" }
              as: ClinicAdmin
              captures: { sore_throat_count: $.meta.total_count }
          assert:
            - "${dup_rule_err} == ERR_DUPLICATE_STATE_RULE with HTTP status 409   # the rejected body's values are NOT applied"
            - "StateRule for CA still reports chart_review_sample_pct 40 and max_supervised_clinicians_per_physician 3"
            - "${dup_offer_err} == ERR_DUPLICATE_PROTOCOL_OFFERING with HTTP status 409   # NV overlaps, AZ does not — one shared state is enough"
            - "${disjoint_prot_id} is a new id with HTTP status 201   # AZ alone is disjoint from {CA, NV}"
            - "${other_complaint_prot_id} is a new id with HTTP status 201   # uniqueness is per complaint_code, not per state"
            - "${sore_throat_count} == 2   # the original CA/NV offering plus the AZ-only offering"

      - name: corner_invalid_time_range_is_checked_at_all_three_write_sites
        claim_type: violation_to_error
        grounds:
          - validations[priority=51]
          - errors[ERR_INVALID_TIME_RANGE]
        distinguishing_aspect: "One rule guards three shapes: a zero-length assignment interval (starts_at == ends_at fails strict inequality), a booking whose scheduled_at is behind the logical clock, and a sampling window with window_start == window_end. All three return ERR_INVALID_TIME_RANGE (422); nudging each by one minute makes it legal."
        test_recipe:
          setup:
            - "A CA StateRule, a SORE_THROAT protocol, an OPEN CA clinic, a CA physician and a CA clinician exist; the clock sits at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /state-rules"
              payload: { state_code: "CA", chart_review_sample_pct: 40, review_deadline_hours: 72, collaborating_physician_required: true, min_independent_practice_age_months: 24, controlled_rx_allowed: false, max_supervised_clinicians_per_physician: 3 }
