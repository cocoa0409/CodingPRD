  # ===========================================================================
  - section: validations
    instances:
      - name: missing_role_header_returns_unauthenticated
        claim_type: violation_to_error
        grounds:
          - validations[priority=1]
          - errors.ERR_UNAUTHENTICATED
        distinguishing_aspect: "A request with no X-User-Role header fails priority 1 with 401 ERR_UNAUTHENTICATED before any other check — even for an otherwise valid payload."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /wiki/pages/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: Anonymous
              captures: { aerr: $.data.error_id }
          assert:
            - "request sent with NO X-User-Role header returns 401 ERR_UNAUTHENTICATED"

      - name: editor_cannot_approve_protection_request
        claim_type: violation_to_error
        grounds:
          - validations[priority=2]
          - errors.ERR_UNAUTHORIZED
        distinguishing_aspect: "VolunteerEditor role is not in the roles list for POST /wiki/protection-requests/{id}/approve; the attempt fails 403 ERR_UNAUTHORIZED (priority 2) before existence or state checks."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Editor and a PENDING protection request exist."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /wiki/editors"
              payload: { username: "ua", email: "ua@x.com" }
              as: Anonymous
              captures: { uae_id: $.data.id }
            - call: "POST /wiki/pages"
              payload: { title: "UA Page", topic_area: "GENERAL" }
              as: VolunteerEditor
              as_user_id: "${uae_id}"
              captures: { uap_id: $.data.id }
            - call: "POST /wiki/pages/${uap_id}/protection-requests"
              payload: { requested_level: "SEMI", reason: "r" }
              as: VolunteerEditor
              as_user_id: "${uae_id}"
              captures: { uar_id: $.data.id }
          trigger:
            - call: "POST /wiki/protection-requests/${uar_id}/approve"
              payload: {}
              as: VolunteerEditor
              as_user_id: "${uae_id}"
              captures: { uaerr: $.data.error_id }
          assert:
            - "status 403 and error_id == ERR_UNAUTHORIZED"
            - "ProtectionRequest.${uar_id}.status == PENDING (unchanged)"

      - name: escalate_nonexistent_dispute_returns_not_found
        claim_type: violation_to_error
        grounds:
          - validations[priority=3]
          - errors.ERR_NOT_FOUND
        distinguishing_aspect: "Existence (priority 3) fires before state checks: escalating a nonexistent dispute id returns 404 ERR_NOT_FOUND, not ERR_INVALID_STATE."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /wiki/editors"
              payload: { username: "nf", email: "nf@x.com" }
              as: Anonymous
              captures: { nf_id: $.data.id, nf_v: $.data.version }
          trigger:
            - call: "POST /wiki/disputes/00000000-0000-4000-8000-000000000000/escalate"
              payload: { expected_dispute_version: "${nf_v}" }
              as: Administrator
              captures: { xnf: $.data.error_id }
          assert:
            - "status 404 and error_id == ERR_NOT_FOUND"

      - name: refund_after_90_days_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=10]
          - errors.ERR_REFUND_WINDOW_EXPIRED
        distinguishing_aspect: "A refund attempted 91 days after processed_at fails with ERR_REFUND_WINDOW_EXPIRED; at exactly 90 days it is still allowed (inclusive boundary)."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. COMPLETED donation processed 2026-09-01; clock advanced to 2026-12-01 (91 days)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /wiki/campaigns"
              payload: { name: "RW Drive", start_at: "2026-09-01T00:00:00Z", end_at: "2027-12-31T23:59:59Z", target_amount_cents: 100000 }
              as: FundraisingManager
              captures: { rwc_id: $.data.id, rwc_v: $.data.version }
            - call: "POST /wiki/campaigns/${rwc_id}/banners"
              payload: { message_variant: "W", geo_target: "GLOBAL", frequency_cap: 5 }
              as: FundraisingManager
              captures: { rwb_id: $.data.id }
            - call: "POST /wiki/campaigns/${rwc_id}/activate"
              payload: { expected_campaign_version: "${rwc_v}" }
              as: FundraisingManager
            - call: "POST /wiki/campaigns/${rwc_id}/donations"
              payload: { banner_id: "${rwb_id}", donor_email_hash: "rw", amount_cents: 1000, currency: "USD" }
              as: Anonymous
              captures: { rwd_id: $.data.id }
            - call: "POST /wiki/donations/${rwd_id}/process"
              payload: {}
              as: PaymentProcessor
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-12-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /wiki/donations/${rwd_id}/refund"
              payload: {}
              as: FundraisingManager
              captures: { rwerr: $.data.error_id }
          assert:
            - "error_id == ERR_REFUND_WINDOW_EXPIRED"
            - "Donation.${rwd_id}.status == COMPLETED (unchanged)"

