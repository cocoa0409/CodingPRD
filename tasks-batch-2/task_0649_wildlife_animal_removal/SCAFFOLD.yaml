    input: [account_id, latitude, longitude]
    output: Property
    side_effects: ["posture initialized OPEN."]
  - method: GET
    path: "/properties/{id}"
    description: "Fetch a property including computed posture."
    roles: [Dispatcher, PropertyOwner, ComplianceOfficer, FieldTechnician]
    code: 200
    input: []
    output: Property
    side_effects: []
  - method: GET
    path: "/properties"
    description: "List properties; optional account_id filter (FK reverse-reachability for Property.account_id)."
    roles: [Dispatcher, PropertyOwner, ComplianceOfficer]
    code: 200
    input: ["account_id?", "limit?", "offset?"]
    output: Property[]
    side_effects: []

  # ---- Inspection (nested under Property) ----
  - method: POST
    path: "/properties/{id}/inspections"
    description: "Schedule an inspection on a property."
    roles: [Dispatcher]
    code: 201
    input: [scheduled_for, "is_emergency?"]
    output: Inspection
    side_effects: ["status=DRAFT; detected_individual_count=0."]
  - method: GET
    path: "/properties/{id}/inspections"
    description: "List a property's inspections (FK reverse-reachability for Inspection.property_id)."
    roles: [Dispatcher, PropertyOwner, ComplianceOfficer, FieldTechnician]
    code: 200
    input: ["limit?", "offset?"]
    output: Inspection[]
    side_effects: []
