            - { call: "POST /api/employee-snapshots", payload: { study_id: "${sk}", employee_ref: "KF1", gender_class: FEMALE, ethnicity_class: WHITE, age_band: UNDER_40, job_family: FIN, job_level: 5, location_code: NY, fte_factor: 1.0, base_salary_cents: 9500000, bonus_cents: 0, hire_date: "2020-01-01" }, as: PeopleOpsAdmin, captures: { k_f1: "$.data.id" } }
            - { call: "POST /api/employee-snapshots", payload: { study_id: "${sk}", employee_ref: "KF2", gender_class: FEMALE, ethnicity_class: WHITE, age_band: UNDER_40, job_family: FIN, job_level: 5, location_code: NY, fte_factor: 1.0, base_salary_cents: 9000000, bonus_cents: 0, hire_date: "2020-01-01" }, as: PeopleOpsAdmin, captures: { k_f2: "$.data.id" } }
