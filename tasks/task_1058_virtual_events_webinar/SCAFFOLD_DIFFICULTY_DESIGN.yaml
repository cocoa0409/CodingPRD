  - rule_id: non_linear_state_machine
    instances:
      - name: registration_payment_and_attendance_axes_advance_independently
        grounds:
          - state_machines.Registration.payment_status_UNPAID_to_PAID
          - state_machines.Registration.attendance_status_REGISTERED_to_CHECKED_IN
          - entities.Registration.fields.payment_status
          - entities.Registration.fields.attendance_status
        distinguishing_aspect: |
          PARALLEL DIMENSIONS on Registration: attendance_status reaches CHECKED_IN while
          payment_status is still UNPAID, and the subsequent pay call moves payment_status to PAID
          while leaving attendance_status at CHECKED_IN — the two axes on the same row never gate
          each other.
        test_recipe:
          setup:
            - "Event 'Summit E' PUBLISHED then LIVE, early_bird_ends_at in the past."
            - "One registration created (UNPAID / REGISTERED) at 20600 cents and then CHECKED_IN while still UNPAID."
          setup_api_calls:
            - call: "POST /api/events"
              payload: { name: "Summit E", timezone: "UTC", starts_at: "2026-09-14T09:00:00Z", ends_at: "2026-09-14T18:00:00Z", early_bird_ends_at: "2026-06-01T00:00:00Z", capacity: 100 }
              as: Organizer
              as_user_id: "org-1"
              captures: { ev_id: $.data.id }
            - call: "POST /api/events/${ev_id}/ticket-types"
              payload: { name: "General", tier: "GENERAL", price_cents: 20000, quota: 10, gating_level: "BOTH" }
              as: Organizer
              as_user_id: "org-1"
              captures: { tt_id: $.data.id }
            - call: "POST /api/events/${ev_id}/publish"
              payload: {}
              as: Organizer
              as_user_id: "org-1"
            - call: "POST /api/registrations"
              payload: { event_id: "${ev_id}", ticket_type_id: "${tt_id}", attendee_email: "axis@example.com" }
              as: Organizer
              as_user_id: "org-1"
              captures: { reg_id: $.data.id }
            - call: "POST /api/events/${ev_id}/start"
              payload: {}
              as: Organizer
              as_user_id: "org-1"
            - call: "POST /api/registrations/${reg_id}/check-in"
              payload: {}
              as: Organizer
              as_user_id: "org-1"
              captures: { pay_status_before: $.data.payment_status }
          trigger:
            - call: "POST /api/registrations/${reg_id}/pay"
              payload: { amount_cents: 20600 }
              as: Organizer
              as_user_id: "org-1"
          assert:
            - "${pay_status_before} == UNPAID"
            - "Registration.${reg_id}.payment_status == PAID"
            - "Registration.${reg_id}.attendance_status == CHECKED_IN"
            - "Registration.${reg_id}.amount_paid_cents == 20600"
            - "Event.${ev_id}.gross_collected_cents == 20600"

      - name: session_speaker_withdraw_then_reinvite_completes_invite_cycle
        grounds:
          - state_machines.SessionSpeaker.ACCEPTED_to_WITHDRAWN
          - state_machines.SessionSpeaker.WITHDRAWN_to_INVITED
          - entities.SessionSpeaker.fields.invite_round
          - entities.Speaker.fields.engagement_status
        distinguishing_aspect: |
          CYCLE on a different entity than the parallel-axis instance: SessionSpeaker traverses
          INVITED -> ACCEPTED -> WITHDRAWN -> INVITED -> ACCEPTED, returning to a previously visited
          state with invite_round incremented to 2, which a linear pipeline cannot express.
        test_recipe:
