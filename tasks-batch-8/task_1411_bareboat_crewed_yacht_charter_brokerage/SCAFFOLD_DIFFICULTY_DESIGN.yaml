            - { call: "POST /charter-agreements/${ag_id}/sign", payload: {}, as: CentralAgent, as_user_id: "${ca_id}", captures: { ag_v3: $.data.version } }
            - { call: "POST /charter-agreements/${ag_id}/fund", payload: { tranche: SIGNING, amount_cents: 1000000 }, as: Client, as_user_id: "${cl_id}" }
