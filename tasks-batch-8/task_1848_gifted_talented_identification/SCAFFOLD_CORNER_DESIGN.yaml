            - { call: "POST /gifted/students", payload: { student_number: "ST-1", legal_name: "Stu One", grade_level: 3, school_site_id: "${site_id}", demographic_group: "WHITE", primary_guardian_user_id: "guard-1" }, as: GiftedCoordinator, captures: { stu: $.data.id } }
            - { call: "POST /gifted/screening-cycles", payload: { name: "Fall ES", school_year: "2026-2027", grade_band: "ELEMENTARY", screening_open_on: "2026-08-15", screening_close_on: "2026-12-15", referral_close_on: "2026-09-30" }, as: GiftedCoordinator, captures: { cyc: $.data.id, cyc_v: $.data.version } }
            - { call: "POST /gifted/screening-cycles/${cyc}/cut-score-profiles", payload: { label: "P_BAND", ability_weight: 0.40, achievement_weight: 0.30, rating_weight: 0.20, portfolio_weight: 0.10, cut_score: 95, review_band_floor: 88, cut_score_2e: 90, review_band_floor_2e: 82 }, as: GiftedCoordinator, captures: { prof: $.data.id } }
            - { call: "POST /gifted/cut-score-profiles/${prof}/publish", payload: { expected_cycle_version: "${cyc_v}" }, as: GiftedCoordinator }
            - { call: "POST /gifted/screening-cycles/${cyc}/advance", payload: { target_state: "OPEN" }, as: GiftedCoordinator }
            - { call: "POST /gifted/cases", payload: { student_id: "${stu}", cycle_id: "${cyc}", pathway: "UNIVERSAL_SCREEN" }, as: GiftedCoordinator }
          trigger:
            - { call: "POST /gifted/cases", payload: { student_id: "${stu}", cycle_id: "${cyc}", pathway: "UNIVERSAL_SCREEN" }, as: GiftedCoordinator, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_DUPLICATE_CASE (http 409)"

      - name: grade_band_mismatch_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=9]
          - errors[ERR_GRADE_BAND_MISMATCH]
        distinguishing_aspect: "A grade-7 student cannot open a case in an ELEMENTARY (grades 0-5) cycle: ERR_GRADE_BAND_MISMATCH (422)."
        test_recipe:
          setup: ["clock 2026-08-20; site; grade-7 student; ELEMENTARY cycle OPEN"]
          setup_api_calls:
