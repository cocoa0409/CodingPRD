            - "after verifying session B: reconcile succeeds, Settlement.${st_id}.status == RECONCILED, final_gross_cents == 16000"

  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: venue_same_date_conflict_adjacent_allowed
        grounds:
          - validations[priority=6]
          - entities.Show.fields.venue_name
        distinguishing_aspect: |
          Aggregate-capacity semantics on the Show resource: a venue holds at
          most one non-CANCELLED show per calendar date — a second show at the
          same venue on the same date (even at a different hour) is rejected,
          while the adjacent calendar date is accepted.
        test_recipe:
          setup:
            - "Tour with existing show H1 at venue 'Roxy' on 2026-08-25T20:00:00Z"
          setup_api_calls:
            - call: "POST /merch/tours"
              payload: { name: "TO1 Tour", artist_name: "Artist", cash_variance_tolerance_cents: 1000, standard_rate_bps: 1000, tier_threshold_cents: 500000, tier_bonus_bps: 500, licensed_flat_per_unit_cents: 500, licensed_rate_bps: 2000 }
              as: TourManager
              as_user_id: "tm-1"
              captures: { t_id: $.data.id }
            - call: "POST /merch/shows"
              payload: { tour_id: "${t_id}", city: "Vegas", venue_name: "Roxy", show_date: "2026-08-25T20:00:00Z", commission_mode: "FLAT", flat_commission_bps: 1500 }
              as: TourManager
              as_user_id: "tm-1"
              captures: { h1_id: $.data.id }
          trigger:
            - call: "POST /merch/shows"
              payload: { tour_id: "${t_id}", city: "Vegas", venue_name: "Roxy", show_date: "2026-08-25T12:00:00Z", commission_mode: "FLAT", flat_commission_bps: 1500 }
              as: TourManager
              as_user_id: "tm-1"
              captures: { err: $.data.error_id }
            - call: "POST /merch/shows"
              payload: { tour_id: "${t_id}", city: "Vegas", venue_name: "Roxy", show_date: "2026-08-26T20:00:00Z", commission_mode: "FLAT", flat_commission_bps: 1500 }
              as: TourManager
              as_user_id: "tm-1"
              captures: { h3_id: $.data.id }
          assert:
            - "same venue + same calendar date (different hour): err == ERR_VENUE_DATE_CONFLICT, HTTP 409"
            - "same venue + adjacent date: created with 201, Show.${h3_id}.status == SCHEDULED"

      - name: dispatch_buffer_violation_inside_48h
        grounds:
          - validations[priority=6.7]
          - state_machines.Shipment.DRAFT_to_DISPATCHED
        distinguishing_aspect: |
          Buffer semantics on the Shipment resource: after moving the logical
          clock to 2026-08-05T12:00:00Z, dispatching toward a show at
          2026-08-06T12:00:00Z leaves only a 24h buffer and is rejected —
          the rule measures a minimum gap from the dispatch instant rather than
          any same-day equality.
        test_recipe:
          setup:
            - "Tour with OS product (warehouse OS 1000); show at 2026-08-06T12:00:00Z; DRAFT shipment of 10 OS units to it"
            - "Logical clock moved to 2026-08-05T12:00:00Z"
          setup_api_calls:
            - call: "POST /merch/tours"
              payload: { name: "TO2 Tour", artist_name: "Artist", cash_variance_tolerance_cents: 1000, standard_rate_bps: 1000, tier_threshold_cents: 500000, tier_bonus_bps: 500, licensed_flat_per_unit_cents: 500, licensed_rate_bps: 2000 }
              as: TourManager
              as_user_id: "tm-1"
              captures: { t_id: $.data.id }
            - call: "POST /merch/shows"
              payload: { tour_id: "${t_id}", city: "Bend", venue_name: "TO2 Hall", show_date: "2026-08-06T12:00:00Z", commission_mode: "FLAT", flat_commission_bps: 1500 }
              as: TourManager
              as_user_id: "tm-1"
              captures: { s_id: $.data.id }
            - call: "POST /merch/products"
              payload: { tour_id: "${t_id}", sku: "TO2-TEE", name: "TO2 Tee", product_type: "REGULAR", royalty_treatment: "STANDARD", sized: false, base_price_cents: 4000, initial_stock_by_size: { OS: 1000 } }
              as: TourManager
              as_user_id: "tm-1"
              captures: { p_id: $.data.id }
            - call: "POST /merch/shipments"
              payload: { tour_id: "${t_id}", origin_type: "WAREHOUSE", destination_show_id: "${s_id}", lines: [ { product_id: "${p_id}", size: "OS", quantity: 10 } ] }
              as: TourManager
              as_user_id: "tm-1"
              captures: { sh_id: $.data.id }
            - call: "POST /merch/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T12:00:00Z" }
              as: TourManager
              as_user_id: "tm-1"
          trigger:
            - call: "POST /merch/shipments/${sh_id}/dispatch"
              payload: {}
              as: TourManager
              as_user_id: "tm-1"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_LEAD_TIME_VIOLATION, HTTP 409 (only 24h of buffer remain; 48h required)"
            - "Shipment.${sh_id}.status stays DRAFT and warehouse stock is unchanged (OS == 1000)"

  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: sale_then_void_leaves_expected_cash_unchanged
        grounds:
          - calculations.session_cash_reconciliation
          - state_machines.SaleRecord.ACTIVE_to_VOIDED
          - entities.Allocation.fields.quantity_sold
        distinguishing_aspect: |
          Conserved quantity is money: recording a 40000-cent CASH sale then
          voiding it returns SellerSession.expected_cash_cents to exactly the
          cash_float_cents baseline (5000) and Allocation.quantity_sold to 0 —
          the compensating pair leaves no drift in the cash expectation.
        test_recipe:
          setup:
            - "ACTIVE tour; FLAT 1500 show opened; OS product price 4000, 100 allocated; seller A session (float 5000)"
          setup_api_calls:
            - call: "POST /merch/tours"
              payload: { name: "CI1 Tour", artist_name: "Artist", cash_variance_tolerance_cents: 1000, standard_rate_bps: 1000, tier_threshold_cents: 500000, tier_bonus_bps: 500, licensed_flat_per_unit_cents: 500, licensed_rate_bps: 2000 }
              as: TourManager
              as_user_id: "tm-1"
              captures: { t_id: $.data.id }
            - call: "POST /merch/tours/${t_id}/activate"
              payload: {}
              as: TourManager
              as_user_id: "tm-1"
            - call: "POST /merch/shows"
              payload: { tour_id: "${t_id}", city: "Chico", venue_name: "CI1 Hall", show_date: "2026-08-27T20:00:00Z", commission_mode: "FLAT", flat_commission_bps: 1500 }
              as: TourManager
              as_user_id: "tm-1"
              captures: { s_id: $.data.id }
            - call: "POST /merch/products"
              payload: { tour_id: "${t_id}", sku: "CI1-TEE", name: "CI1 Tee", product_type: "REGULAR", royalty_treatment: "STANDARD", sized: false, base_price_cents: 4000, initial_stock_by_size: { OS: 500 } }
              as: TourManager
              as_user_id: "tm-1"
              captures: { p_id: $.data.id }
            - call: "POST /merch/show-products"
              payload: { show_id: "${s_id}", product_id: "${p_id}", price_cents: 4000 }
              as: TourManager
              as_user_id: "tm-1"
            - call: "POST /merch/shows/${s_id}/allocations/generate"
              payload: { product_id: "${p_id}", total_units: 100 }
              as: TourManager
              as_user_id: "tm-1"
              captures: { a_id: "$.data[0].id" }
            - call: "POST /merch/sellers"
              payload: { tour_id: "${t_id}", display_name: "Seller A", seller_code: "CI1-A" }
              as: TourManager
              as_user_id: "tm-1"
              captures: { sl_a: $.data.id }
            - call: "POST /merch/shows/${s_id}/open"
              payload: {}
              as: TourManager
              as_user_id: "tm-1"
            - call: "POST /merch/seller-sessions"
              payload: { show_id: "${s_id}", seller_id: "${sl_a}", cash_float_cents: 5000 }
              as: TourManager
              as_user_id: "tm-1"
              captures: { ss_id: $.data.id }
          trigger:
            - call: "POST /merch/sale-records"
              payload: { session_id: "${ss_id}", allocation_id: "${a_id}", quantity: 10, tender: "CASH" }
              as: Seller
              as_user_id: "${sl_a}"
              captures: { sr_id: $.data.id }
            - call: "POST /merch/sale-records/${sr_id}/void"
              payload: { void_reason: "miskeyed quantity" }
              as: Seller
              as_user_id: "${sl_a}"
          assert:
            - "immediately after the sale: expected_cash_cents was 45000 (5000 + 40000) and Allocation.${a_id}.quantity_sold was 10"
            - "after the void: SellerSession.${ss_id}.expected_cash_cents == 5000 (== cash_float_cents, invariant restored)"
            - "after the void: Allocation.${a_id}.quantity_sold == 0"
            - "SaleRecord.${sr_id}.status == VOIDED and voided_by_user_id == ${sl_a}"

      - name: dispatch_then_cancel_restores_warehouse_stock
        grounds:
          - calculations.warehouse_stock_reconciliation
          - state_machines.Shipment.DISPATCHED_to_CANCELLED
        distinguishing_aspect: |
          Conserved quantity is inventory units (a different type than money):
          dispatching 100 OS units from the warehouse drops stock to 900, and
          cancelling the DISPATCHED shipment restores exactly 1000 — the
          compensation leaves warehouse_stock_by_size unchanged end to end.
        test_recipe:
          setup:
            - "Tour with OS product (initial warehouse OS 1000); destination show at 2026-08-10T20:00:00Z (well beyond the 48h lead from the default clock)"
          setup_api_calls:
            - call: "POST /merch/tours"
              payload: { name: "CI2 Tour", artist_name: "Artist", cash_variance_tolerance_cents: 1000, standard_rate_bps: 1000, tier_threshold_cents: 500000, tier_bonus_bps: 500, licensed_flat_per_unit_cents: 500, licensed_rate_bps: 2000 }
