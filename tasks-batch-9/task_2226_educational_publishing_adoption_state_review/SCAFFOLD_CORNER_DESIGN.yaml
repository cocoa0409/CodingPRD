              payload: {}
              as: PublisherEditor
            - call: "POST /titles"
              payload: { isbn_base: "9780000012201", subject: "MATH", grade_low: 1, grade_high: 1, copyright_year: 2026, content_tags: ["NUMBER_SENSE"], page_count: 260, signature_page_capacity: 384, list_price_cents: 8300 }
              as: PublisherEditor
