            - "Advance the clock to 2026-03-25 so that first schedule is now in the past, then SUSPEND — suspend only cancels rows with effective_pickup_date >= clock (2026-03-25), so the captured 2026-03-02 row stays PLANNED while the account is SUSPENDED."
          setup_api_calls:
