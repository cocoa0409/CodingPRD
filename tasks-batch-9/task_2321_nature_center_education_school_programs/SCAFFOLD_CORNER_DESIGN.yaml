      - name: delivery_settles_the_award_the_fund_and_the_school_ledger_in_one_write
        claim_type: cascading_side_effects
        grounds:
          - state_machines.AidApplication.APPROVED_to_DISBURSED
          - state_machines.Booking.funding_status.AID_APPROVED_to_INVOICED
          - calculations.school_standing
          - calculations.booking_fee_assessment
        distinguishing_aspect: |
          One delivery call must move four rows: the award to DISBURSED, the fund's money from
          committed to disbursed, the booking to INVOICED with a net due net of the award, and the
          school's outstanding balance up by exactly that net. All four are read back after the
          single write, so a cascade that stops after the booking leaves the fund's committed
          balance overstated.
        test_recipe:
