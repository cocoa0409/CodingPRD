            - { call: "POST /api/evidence-packets/${pkt_id}/review-responses", payload: { party_side: "COMPLAINANT", response_text: "ok" }, as: Party, as_user_id: "${comp_id}" }
            - { call: "POST /api/evidence-packets/${pkt_id}/review-responses", payload: { party_side: "RESPONDENT", response_text: "ok" }, as: Party, as_user_id: "${resp_id}" }
            - { call: "POST /api/evidence-packets/${pkt_id}/finalize", as: Investigator, as_user_id: "${inv_id}" }
            - { call: "POST /api/cases/${case_id}/advisor-appointments", payload: { party_side: "COMPLAINANT", advisor_id: "${advc_id}" }, as: Party, as_user_id: "${comp_id}" }
            - { call: "POST /api/cases/${case_id}/advisor-appointments", payload: { party_side: "RESPONDENT", advisor_id: "${advr_id}" }, as: Party, as_user_id: "${resp_id}" }
            - call: "POST /api/cases/${case_id}/hearings"
              payload: { decision_maker_id: "${dm_id}", scheduled_at: "2026-09-01T10:00:00Z", estimated_duration_minutes: 60, modality: "VIRTUAL" }
              as: TitleIXCoordinator
              as_user_id: "${coord_id}"
              captures: { hr_id: $.data.id }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T10:00:00Z" }, as: CaseAdministrator }
            - { call: "POST /api/hearings/${hr_id}/convene", as: DecisionMaker, as_user_id: "${dm_id}" }
            - { call: "POST /api/hearings/${hr_id}/close-cross-exam", as: DecisionMaker, as_user_id: "${dm_id}" }
            - { call: "GET /api/cases/${case_id}", as: TitleIXCoordinator, as_user_id: "${coord_id}", captures: { case_v2: $.data.version } }
            - call: "POST /api/cases/${case_id}/determinations"
              payload: { responsibility_finding: "RESPONSIBLE", standard_of_evidence: "PREPONDERANCE", rationale: "Established", aggravating_factor_count: 1, mitigating_factor_count: 0, prior_responsible_findings: 0, expected_case_version: "${case_v2}" }
              as: DecisionMaker
              as_user_id: "${dm_id}"
              captures: { det_id: $.data.id }
            - { call: "POST /api/determinations/${det_id}/issue", payload: { sanction_selections: [ { sanction_type: "SUSPENSION", duration_days: 120 } ] }, as: DecisionMaker, as_user_id: "${dm_id}" }
            - call: "POST /api/cases/${case_id}/appeals"
              payload: { filed_by_side: "RESPONDENT", appeal_target: "DETERMINATION", grounds: ["NEW_EVIDENCE"], statement: "New witness" }
              as: Party
              as_user_id: "${resp_id}"
              captures: { app_id: $.data.id }
            - { call: "POST /api/appeals/${app_id}/begin-review", payload: { appeal_officer_id: "${ao_id}" }, as: TitleIXCoordinator, as_user_id: "${coord_id}" }
          trigger:
            - { call: "POST /api/appeals/${app_id}/decide", payload: { outcome: "REMANDED", remand_scope: "INVESTIGATION" }, as: AppealOfficer, as_user_id: "${ao_id}" }
            - { call: "POST /api/cases/${case_id}/resume", as: TitleIXCoordinator, as_user_id: "${coord_id}", captures: { case_after: $.data.status } }
            - { call: "GET /api/evidence-packets/${pkt_id}", as: TitleIXCoordinator, as_user_id: "${coord_id}", captures: { pkt_after: $.data.status } }
            - { call: "GET /api/evidence-items/${ev_id}", as: TitleIXCoordinator, as_user_id: "${coord_id}", captures: { item_after: $.data.status } }
          assert:
            - "hop 1 (decide): Case.${case_id}.status == REMANDED, Determination.${det_id}.status == SUPERSEDED, its SUSPENSION sanction status == STAYED"
            - "hop 2 (resume, caused by REMANDED): Case.${case_id}.status == INVESTIGATION and EvidencePacket.${pkt_id}.status == SUPERSEDED"
            - "hop 3 (packet supersession, caused by hop 2): EvidenceItem.${ev_id}.status == UNDER_REVIEW - the item's ACCEPTED ruling was undone by the packet, not by the appeal call directly"

      - name: violation_substantiation_exposure_contagion_cascade
        grounds:
          - state_machines.DirectiveViolation.PENDING_to_SUBSTANTIATED
          - calculations.calc_case_exposure_score
          - calculations.calc_ncd_violation_rolling_count
          - entities.Case.fields.interim_suspension_eligible
        distinguishing_aspect: |
          Depth-3 contagion from a different trigger (violation substantiation, not appeal): substantiate
          mutates DirectiveViolation -> SUBSTANTIATED; that mutation increments the parent
          NoContactDirective.substantiated_violation_count; the counter increment itself forces
          calc_case_exposure_score recomputation on the Case, flipping interim_suspension_eligible
          false -> true exactly at score 70.
        test_recipe:
          setup:
            - "Case [SEXUAL_ASSAULT] (base 40) with one ACTIVE mutual NoContactDirective (+10) and two PENDING violation reports on it"
          setup_api_calls:
            - { call: "POST /api/party-profiles", payload: { full_name: "Comp One", university_id: "U-C-1", role_type: "STUDENT", email: "c1@example.edu" }, as: CaseAdministrator, captures: { comp_id: $.data.id } }
            - { call: "POST /api/party-profiles", payload: { full_name: "Resp One", university_id: "U-R-1", role_type: "STUDENT", email: "r1@example.edu" }, as: CaseAdministrator, captures: { resp_id: $.data.id } }
            - { call: "POST /api/party-profiles", payload: { full_name: "Coord One", university_id: "U-CO-1", role_type: "STAFF", email: "co1@example.edu" }, as: CaseAdministrator, captures: { coord_id: $.data.id } }
