          rationale: "The §1.8 instance runs both variants over one unchanged data set and asserts every divergent field - included_program_count 5 versus 4, overlap index 1.0000 versus 0.5000, exposure 0 versus 29916670, reserve 5.99 versus 4.20 and composite 60.00 MODERATE versus 90.00 STRONG."

