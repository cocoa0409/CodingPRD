      - name: prerequisite_integrity_and_acyclicity_are_both_enforced
        claim_type: violation_to_error
        grounds:
          - validations[priority=20]
          - validations[priority=21]
          - errors[ERR_PREREQUISITE_INVALID]
          - errors[ERR_PREREQUISITE_CYCLE]
          - entities.SequenceCourse.fields.prerequisite_course_id
          - entities.SequenceCourse.fields.depth_from_root
        distinguishing_aspect: |
          Priority 20 bundles four independent clauses and priority 21 sits directly beneath it, so all five failures are
          probed on the same two-course chain: a prerequisite belonging to another program, a course naming itself, a
          SECONDARY course naming a POSTSECONDARY prerequisite, and a prerequisite whose position is not strictly less.
          The cycle probe is deliberately constructed to SATISFY every priority-20 clause — same program, not itself, both
          courses POSTSECONDARY, and the prerequisite's position 2 genuinely below the patched position 3 — so the only
          rule left to catch it is the acyclicity check, which proves priority 21 is not shadowed by priority 20.
        test_recipe:
          setup:
            - "One DRAFT ProgramOfStudy A with two POSTSECONDARY courses: A1 at position 1 with no prerequisite, and A2 at position 2 whose prerequisite is A1."
            - "One separate DRAFT ProgramOfStudy B with one SECONDARY course B1 at position 1."
            - "The logical clock stays at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /cte/programs-of-study"
              payload: { cip_code: "10.0201", title: "Digital Media", cluster: "ARTS_AV", labor_market_data_asof: "2026-03-01" }
              as: CteDirector
              as_user_id: "u_dir_1"
              captures: { pos_a_id: $.data.id }
            - call: "POST /cte/programs-of-study/${pos_a_id}/sequence-courses"
              payload: { code: "CYC-1", title: "Media Production Studio", segment: "POSTSECONDARY", position: 1, credit_hours: 3.00 }
              as: CteDirector
              as_user_id: "u_dir_1"
              captures: { a1_id: $.data.id, a1_depth: $.data.depth_from_root }
            - call: "POST /cte/programs-of-study/${pos_a_id}/sequence-courses"
              payload: { code: "CYC-2", title: "Advanced Motion Graphics", segment: "POSTSECONDARY", position: 2, credit_hours: 3.00, prerequisite_course_id: "${a1_id}" }
              as: CteDirector
              as_user_id: "u_dir_1"
              captures: { a2_id: $.data.id, a2_depth: $.data.depth_from_root }
            - call: "POST /cte/programs-of-study"
              payload: { cip_code: "10.0304", title: "Animation", cluster: "ARTS_AV", labor_market_data_asof: "2026-03-01" }
              as: CteDirector
              as_user_id: "u_dir_1"
              captures: { pos_b_id: $.data.id }
            - call: "POST /cte/programs-of-study/${pos_b_id}/sequence-courses"
              payload: { code: "OTH-1", title: "Animation Foundations", segment: "SECONDARY", position: 1, credit_hours: 4.00 }
              as: CteDirector
              as_user_id: "u_dir_1"
              captures: { b1_id: $.data.id }
          trigger:
            - call: "POST /cte/programs-of-study/${pos_a_id}/sequence-courses"
              payload: { code: "XPG-1", title: "Cross Program Probe", segment: "POSTSECONDARY", position: 4, credit_hours: 3.00, prerequisite_course_id: "${b1_id}" }
              as: CteDirector
              as_user_id: "u_dir_1"
            - call: "PATCH /cte/sequence-courses/${a1_id}"
              payload: { prerequisite_course_id: "${a1_id}" }
              as: CteDirector
              as_user_id: "u_dir_1"
            - call: "POST /cte/programs-of-study/${pos_a_id}/sequence-courses"
              payload: { code: "SEG-1", title: "Segment Probe", segment: "SECONDARY", position: 3, credit_hours: 4.00, prerequisite_course_id: "${a2_id}" }
              as: CteDirector
              as_user_id: "u_dir_1"
            - call: "POST /cte/programs-of-study/${pos_a_id}/sequence-courses"
              payload: { code: "POS-1", title: "Position Probe", segment: "POSTSECONDARY", position: 1, credit_hours: 3.00, prerequisite_course_id: "${a2_id}" }
              as: CteDirector
              as_user_id: "u_dir_1"
            - call: "PATCH /cte/sequence-courses/${a1_id}"
              payload: { position: 3, prerequisite_course_id: "${a2_id}" }
              as: CteDirector
              as_user_id: "u_dir_1"
            - call: "GET /cte/sequence-courses/${a1_id}"
              payload: {}
              as: CteDirector
              as_user_id: "u_dir_1"
              captures: { f_pos: $.data.position, f_pre: $.data.prerequisite_course_id, f_depth: $.data.depth_from_root }
          assert:
            - "${a1_depth} == 0 and ${a2_depth} == 1"
            - "the XPG-1 create call returns error_id == ERR_PREREQUISITE_INVALID with HTTP status 422"
            - "the self-referencing PATCH call returns error_id == ERR_PREREQUISITE_INVALID with HTTP status 422"
            - "the SEG-1 create call returns error_id == ERR_PREREQUISITE_INVALID with HTTP status 422"
            - "the POS-1 create call returns error_id == ERR_PREREQUISITE_INVALID with HTTP status 422"
            - "the cycle-forming PATCH call returns error_id == ERR_PREREQUISITE_CYCLE with HTTP status 422"
            - "${f_pos} == 1 and ${f_pre} == null and ${f_depth} == 0"
            - "GET /cte/programs-of-study/${pos_a_id}/sequence-courses reports total_count == 2"

