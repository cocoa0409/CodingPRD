  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: release_blocked_by_stale_engineering_pin
        grounds:
          - state_machines.Project.PRECONDITIONS_PENDING_to_RELEASED
          - entities.Project.fields.pinned_engineering_revision
          - entities.EngineeringSurvey.fields.revision_number
        distinguishing_aspect: |
          Pair EngineeringSurvey -> Project: after the pinned survey is revised
          (revision_number 1 -> 2) and re-CERTIFIED, release fails with
          ERR_ENGINEERING_PIN_STALE until the pin is re-set — the Project's
          valid transition depends on a DIFFERENT entity's revision state.
        test_recipe:
          setup:
            - "Project was RELEASED with pin at revision 1; pinned survey then went REQUEST_REVISION (cascade reverted project to PRECONDITIONS_PENDING), SUBMIT, CERTIFY (now CERTIFIED at revision 2; pin still 1)."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T09:00:00Z" }, as: ContractorAdmin }
            - { call: "POST /demolition/projects", payload: { name: "Pin Lot", address: "63 Elm St", lot_area_sqft: 30000, required_diversion_rate: 0.5 }, as: ContractorAdmin, captures: { p_id: $.data.id } }
            - { call: "POST /demolition/projects/${p_id}/structure-surveys", payload: { structure_label: "Main" }, as: Surveyor, captures: { sv_id: $.data.id } }
            - { call: "POST /demolition/structure-surveys/${sv_id}/transition", payload: { action: "COMPLETE", hazmat_found: false, findings_summary: "clean" }, as: Surveyor }
            - { call: "POST /demolition/projects/${p_id}/utility-disconnects", payload: { utility_type: "ELECTRIC", provider_name: "City Power", disconnect_window_start: "2026-08-02T08:00:00Z", disconnect_window_end: "2026-08-02T12:00:00Z" }, as: UtilityCoordinator, captures: { ud_id: $.data.id } }
            - { call: "POST /demolition/utility-disconnects/${ud_id}/transition", payload: { action: "REPORT_DISCONNECTED" }, as: UtilityCoordinator, as_user_id: "sp-r-1" }
            - { call: "POST /demolition/utility-disconnects/${ud_id}/transition", payload: { action: "VERIFY" }, as: UtilityCoordinator, as_user_id: "sp-v-1" }
            - { call: "POST /demolition/utility-disconnects/${ud_id}/transition", payload: { action: "CONFIRM" }, as: UtilityCoordinator, as_user_id: "sp-c-1" }
            - { call: "POST /demolition/projects/${p_id}/permits", payload: { permit_number: "P-1", gross_floor_area_sqft: 20000 }, as: PermitCoordinator, captures: { pm_id: $.data.id } }
            - { call: "POST /demolition/permits/${pm_id}/transition", payload: { action: "SUBMIT" }, as: PermitCoordinator }
            - { call: "POST /demolition/permits/${pm_id}/transition", payload: { action: "APPROVE" }, as: AuthorityReviewer }
            - { call: "POST /demolition/permits/${pm_id}/transition", payload: { action: "ACTIVATE" }, as: PermitCoordinator }
            - { call: "POST /demolition/projects/${p_id}/engineering-surveys", payload: { demolition_method: "HIGH_REACH_ARM", structural_stability_rating: "CONDITIONALLY_STABLE", max_structure_height_ft: 60, adjacent_structure_distance_ft: 25 }, as: StructuralEngineer, as_user_id: "sp-a-1", captures: { es_id: $.data.id } }
            - { call: "POST /demolition/engineering-surveys/${es_id}/transition", payload: { action: "SUBMIT" }, as: StructuralEngineer, as_user_id: "sp-a-1" }
            - { call: "POST /demolition/engineering-surveys/${es_id}/transition", payload: { action: "CERTIFY" }, as: PeerReviewEngineer, as_user_id: "sp-p-1" }
            - { call: "GET /demolition/projects/${p_id}", as: SiteSupervisor, captures: { p_v: $.data.version } }
            - { call: "POST /demolition/projects/${p_id}/engineering-pin", payload: { engineering_survey_id: "${es_id}", expected_project_version: "${p_v}" }, as: SiteSupervisor }
            - { call: "POST /demolition/projects/${p_id}/neighbor-notifications", payload: { address: "65 Elm St", notice_method: "CERTIFIED_MAIL", scheduled_delivery_date: "2026-08-02" }, as: SiteSupervisor, captures: { nn_id: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T09:00:00Z" }, as: ContractorAdmin }
            - { call: "POST /demolition/neighbor-notifications/${nn_id}/transition", payload: { action: "DELIVER" }, as: SiteSupervisor }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-05T09:00:00Z" }, as: ContractorAdmin }
            - { call: "POST /demolition/projects/${p_id}/release", payload: {}, as: SiteSupervisor }
            - { call: "POST /demolition/engineering-surveys/${es_id}/transition", payload: { action: "REQUEST_REVISION" }, as: PeerReviewEngineer, as_user_id: "sp-p-1" }
            - { call: "POST /demolition/engineering-surveys/${es_id}/transition", payload: { action: "SUBMIT" }, as: StructuralEngineer, as_user_id: "sp-a-1" }
            - { call: "POST /demolition/engineering-surveys/${es_id}/transition", payload: { action: "CERTIFY" }, as: PeerReviewEngineer, as_user_id: "sp-p-1" }
          trigger:
            - { call: "POST /demolition/projects/${p_id}/release", payload: {}, as: SiteSupervisor, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_ENGINEERING_PIN_STALE (pinned revision 1 != survey revision_number 2)"
            - "survey IS CERTIFIED (so ERR_ENGINEERING_NOT_CERTIFIED does not mask the stale-pin error)"
            - "Project.${p_id}.status remains PRECONDITIONS_PENDING"

      - name: abatement_clearance_requires_survey_complete
        grounds:
          - state_machines.HazmatAbatement.ABATEMENT_ACTIVE_to_CLEARANCE_PENDING
          - entities.HazmatAbatement.fields.structure_survey_id
        distinguishing_aspect: |
          Pair StructureSurvey -> HazmatAbatement: REQUEST_CLEARANCE on an
          ABATEMENT_ACTIVE order is rejected while its parent survey is still
          IN_PROGRESS — child transition gated by parent entity state.
        test_recipe:
          setup:
            - "Project SURVEY_PHASE; survey IN_PROGRESS with an abatement order started (ABATEMENT_ACTIVE)."
          setup_api_calls:
            - { call: "POST /demolition/projects", payload: { name: "Gate Lot", address: "67 Elm St", lot_area_sqft: 20000 }, as: ContractorAdmin, captures: { p_id: $.data.id } }
            - { call: "POST /demolition/projects/${p_id}/structure-surveys", payload: { structure_label: "Main" }, as: Surveyor, captures: { sv_id: $.data.id } }
            - { call: "POST /demolition/structure-surveys/${sv_id}/abatements", payload: { material_type: "LEAD_PAINT", description: "window trim", containment_method: "chemical strip" }, as: Surveyor, captures: { ab_id: $.data.id } }
            - { call: "POST /demolition/abatements/${ab_id}/transition", payload: { action: "START" }, as: AbatementSupervisor, as_user_id: "ga-s-1" }
          trigger:
            - { call: "POST /demolition/abatements/${ab_id}/transition", payload: { action: "REQUEST_CLEARANCE" }, as: AbatementSupervisor, as_user_id: "ga-s-1", captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_SURVEY_INCOMPLETE (parent survey IN_PROGRESS blocks clearance request)"
            - "HazmatAbatement.${ab_id}.status remains ABATEMENT_ACTIVE"

      - name: permit_activate_requires_all_utilities_confirmed
        grounds:
          - state_machines.DemolitionPermit.APPROVED_to_ACTIVE
          - entities.UtilityDisconnect.fields.verification_status
        distinguishing_aspect: |
          Pair UtilityDisconnect -> DemolitionPermit: ACTIVATE on an APPROVED
          permit fails with ERR_UTILITY_UNVERIFIED while the project's one
          disconnect is only FIELD_VERIFIED (not CONFIRMED) — permit transition
          gated by sibling-entity state.
        test_recipe:
          setup:
            - "Project with one disconnect at REPORTED_DISCONNECTED x FIELD_VERIFIED; permit APPROVED."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T09:00:00Z" }, as: ContractorAdmin }
            - { call: "POST /demolition/projects", payload: { name: "Act Lot", address: "69 Elm St", lot_area_sqft: 20000 }, as: ContractorAdmin, captures: { p_id: $.data.id } }
            - { call: "POST /demolition/projects/${p_id}/utility-disconnects", payload: { utility_type: "SEWER", provider_name: "City Sewer", disconnect_window_start: "2026-08-03T08:00:00Z", disconnect_window_end: "2026-08-03T10:00:00Z" }, as: UtilityCoordinator, captures: { ud_id: $.data.id } }
            - { call: "POST /demolition/utility-disconnects/${ud_id}/transition", payload: { action: "REPORT_DISCONNECTED" }, as: UtilityCoordinator, as_user_id: "pa-r-1" }
            - { call: "POST /demolition/utility-disconnects/${ud_id}/transition", payload: { action: "VERIFY" }, as: UtilityCoordinator, as_user_id: "pa-v-1" }
            - { call: "POST /demolition/projects/${p_id}/permits", payload: { permit_number: "P-1", gross_floor_area_sqft: 15000 }, as: PermitCoordinator, captures: { pm_id: $.data.id } }
            - { call: "POST /demolition/permits/${pm_id}/transition", payload: { action: "SUBMIT" }, as: PermitCoordinator }
            - { call: "POST /demolition/permits/${pm_id}/transition", payload: { action: "APPROVE" }, as: AuthorityReviewer }
          trigger:
            - { call: "POST /demolition/permits/${pm_id}/transition", payload: { action: "ACTIVATE" }, as: PermitCoordinator, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_UTILITY_UNVERIFIED (FIELD_VERIFIED is not CONFIRMED)"
            - "DemolitionPermit.${pm_id}.status remains APPROVED"

      - name: ticket_create_requires_demolition_phase
        grounds:
          - state_machines.DebrisTicket
          - "validations[priority=5]"
        distinguishing_aspect: |
          Pair Project -> DebrisTicket: creating a ticket while the project is
          PRECONDITIONS_PENDING (not yet DEMOLITION_ACTIVE / DEBRIS_CLEARANCE)
          is rejected with ERR_INVALID_STATE — child creation gated by parent
          phase, a fourth distinct entity pair.
        test_recipe:
          setup:
            - "Project PRECONDITIONS_PENDING (survey COMPLETE, no release attempted)."
          setup_api_calls:
            - { call: "POST /demolition/projects", payload: { name: "Phase Lot", address: "71 Elm St", lot_area_sqft: 20000 }, as: ContractorAdmin, captures: { p_id: $.data.id } }
            - { call: "POST /demolition/projects/${p_id}/structure-surveys", payload: { structure_label: "Main" }, as: Surveyor, captures: { sv_id: $.data.id } }
            - { call: "POST /demolition/structure-surveys/${sv_id}/transition", payload: { action: "COMPLETE", hazmat_found: false, findings_summary: "clean" }, as: Surveyor }
          trigger:
            - { call: "POST /demolition/projects/${p_id}/debris-tickets", payload: { ticket_number: "T-X", facility_type: "LANDFILL", material_class: "MIXED_CD", gross_tons: 5.0 }, as: HaulingDispatcher, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_INVALID_STATE (project phase PRECONDITIONS_PENDING does not allow ticket creation)"
            - "Project.${p_id}.in_transit_tons remains 0"

  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: disconnect_windows_half_open_adjacency
        grounds:
          - "validations[priority=11]"
          - entities.UtilityDisconnect.fields.disconnect_window_start
        distinguishing_aspect: |
          Resource UtilityDisconnect, semantics half-open [start, end): a second
          ELECTRIC window starting exactly at the first's end (12:00 == 12:00)
          is ADJACENT and allowed; starting at 11:00 overlaps and is rejected.
          Adjacency-tolerant half-open interval arithmetic.
        test_recipe:
          setup:
            - "Project exists; one ELECTRIC window [2026-08-03T08:00:00Z, 2026-08-03T12:00:00Z) scheduled."
          setup_api_calls:
            - { call: "POST /demolition/projects", payload: { name: "Overlap Lot", address: "73 Elm St", lot_area_sqft: 20000 }, as: ContractorAdmin, captures: { p_id: $.data.id } }
            - { call: "POST /demolition/projects/${p_id}/utility-disconnects", payload: { utility_type: "ELECTRIC", provider_name: "City Power", disconnect_window_start: "2026-08-03T08:00:00Z", disconnect_window_end: "2026-08-03T12:00:00Z" }, as: UtilityCoordinator, captures: { ud1: $.data.id } }
          trigger:
            - { call: "POST /demolition/projects/${p_id}/utility-disconnects", payload: { utility_type: "ELECTRIC", provider_name: "City Power", disconnect_window_start: "2026-08-03T12:00:00Z", disconnect_window_end: "2026-08-03T16:00:00Z" }, as: UtilityCoordinator, captures: { ud2: $.data.id } }
            - { call: "POST /demolition/projects/${p_id}/utility-disconnects", payload: { utility_type: "ELECTRIC", provider_name: "City Power", disconnect_window_start: "2026-08-03T11:00:00Z", disconnect_window_end: "2026-08-03T13:00:00Z" }, as: UtilityCoordinator, captures: { err: $.data.error_id } }
            - { call: "POST /demolition/projects/${p_id}/utility-disconnects", payload: { utility_type: "GAS", provider_name: "City Gas", disconnect_window_start: "2026-08-03T09:00:00Z", disconnect_window_end: "2026-08-03T10:00:00Z" }, as: UtilityCoordinator, captures: { ud3: $.data.id } }
          assert:
            - "adjacent (start == prior end): ${ud2} created successfully (half-open semantics permit touching)"
            - "overlapping (11:00 < 12:00): ${err} == ERR_DISCONNECT_WINDOW_OVERLAP"
            - "different utility_type overlapping in time: ${ud3} created successfully (overlap rule is per utility_type)"

      - name: quiet_hours_delivery_occupation_window
        grounds:
          - "validations[priority=9]"
          - state_machines.NeighborNotification.PENDING_DELIVERY_to_DELIVERED
        distinguishing_aspect: |
          Resource NeighborNotification, semantics delivery-occupation vs a
          recurring daily quiet window: delivery occupies [now, now+30min); at
          07:00:00 the occupation clears [19:00,07:00) (allowed), at 18:30:00 it
          ends exactly at 19:00 (allowed, half-open occupation), at 18:45:00 it
          crosses 19:00 (rejected). Different geometric treatment than the
          disconnect half-open range-range adjacency.
        test_recipe:
          setup:
            - "Project with blackout_dates [2026-08-10]; three PENDING_DELIVERY notifications; deliveries on 2026-08-03 (not blacked out)."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T09:00:00Z" }, as: ContractorAdmin }
            - { call: "POST /demolition/projects", payload: { name: "Quiet Lot", address: "75 Elm St", lot_area_sqft: 20000, blackout_dates: ["2026-08-10"] }, as: ContractorAdmin, captures: { p_id: $.data.id } }
            - { call: "POST /demolition/projects/${p_id}/neighbor-notifications", payload: { address: "77 Elm St", notice_method: "CERTIFIED_MAIL", scheduled_delivery_date: "2026-08-03" }, as: SiteSupervisor, captures: { n1: $.data.id } }
            - { call: "POST /demolition/projects/${p_id}/neighbor-notifications", payload: { address: "79 Elm St", notice_method: "DOOR_HANGER", scheduled_delivery_date: "2026-08-03" }, as: SiteSupervisor, captures: { n2: $.data.id } }
            - { call: "POST /demolition/projects/${p_id}/neighbor-notifications", payload: { address: "81 Elm St", notice_method: "POSTING", scheduled_delivery_date: "2026-08-03" }, as: SiteSupervisor, captures: { n3: $.data.id } }
          trigger:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T07:00:00Z" }, as: ContractorAdmin }
            - { call: "POST /demolition/neighbor-notifications/${n1}/transition", payload: { action: "DELIVER" }, as: SiteSupervisor, captures: { d1: $.data.delivered_at } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T18:30:00Z" }, as: ContractorAdmin }
            - { call: "POST /demolition/neighbor-notifications/${n2}/transition", payload: { action: "DELIVER" }, as: SiteSupervisor, captures: { d2: $.data.delivered_at } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T18:45:00Z" }, as: ContractorAdmin }
            - { call: "POST /demolition/neighbor-notifications/${n3}/transition", payload: { action: "DELIVER" }, as: SiteSupervisor, captures: { err: $.data.error_id } }
          assert:
            - "07:00:00 delivery: ${d1} == 2026-08-03T07:00:00Z (occupation [07:00,07:30) clears quiet window)"
            - "18:30:00 delivery: ${d2} == 2026-08-03T18:30:00Z (occupation [18:30,19:00) ends exactly at quiet start — allowed)"
            - "18:45:00 delivery: ${err} == ERR_QUIET_HOURS (occupation [18:45,19:15) crosses 19:00)"

  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: debris_mass_invariant_through_receive_and_void
        grounds:
          - calculations.diversion_rate
          - state_machines.DebrisTicket.MANIFESTED_to_RECEIVED
          - state_machines.DebrisTicket.RECEIVED_to_VOIDED
        distinguishing_aspect: |
          Conserved quantity: accounted debris mass M = in_transit_tons +
          landfill_tons + diverted_tons + removed_tons == sum of gross_tons over
          all created tickets (16.0). Forward RECEIVE and compensating VOID of a
          RECEIVED ticket must leave M unchanged at every step.
        test_recipe:
          setup:
            - "Project DEMOLITION_ACTIVE (release chain); tickets A (gross 10.000) and B (gross 6.000) manifested."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T09:00:00Z" }, as: ContractorAdmin }
            - { call: "POST /demolition/projects", payload: { name: "Mass Lot", address: "83 Elm St", lot_area_sqft: 30000, required_diversion_rate: 0.5 }, as: ContractorAdmin, captures: { p_id: $.data.id } }
            - { call: "POST /demolition/projects/${p_id}/structure-surveys", payload: { structure_label: "Main" }, as: Surveyor, captures: { sv_id: $.data.id } }
            - { call: "POST /demolition/structure-surveys/${sv_id}/transition", payload: { action: "COMPLETE", hazmat_found: false, findings_summary: "clean" }, as: Surveyor }
            - { call: "POST /demolition/projects/${p_id}/utility-disconnects", payload: { utility_type: "ELECTRIC", provider_name: "City Power", disconnect_window_start: "2026-08-02T08:00:00Z", disconnect_window_end: "2026-08-02T12:00:00Z" }, as: UtilityCoordinator, captures: { ud_id: $.data.id } }
            - { call: "POST /demolition/utility-disconnects/${ud_id}/transition", payload: { action: "REPORT_DISCONNECTED" }, as: UtilityCoordinator, as_user_id: "mi-r-1" }
            - { call: "POST /demolition/utility-disconnects/${ud_id}/transition", payload: { action: "VERIFY" }, as: UtilityCoordinator, as_user_id: "mi-v-1" }
            - { call: "POST /demolition/utility-disconnects/${ud_id}/transition", payload: { action: "CONFIRM" }, as: UtilityCoordinator, as_user_id: "mi-c-1" }
            - { call: "POST /demolition/projects/${p_id}/permits", payload: { permit_number: "P-1", gross_floor_area_sqft: 20000 }, as: PermitCoordinator, captures: { pm_id: $.data.id } }
            - { call: "POST /demolition/permits/${pm_id}/transition", payload: { action: "SUBMIT" }, as: PermitCoordinator }
            - { call: "POST /demolition/permits/${pm_id}/transition", payload: { action: "APPROVE" }, as: AuthorityReviewer }
            - { call: "POST /demolition/permits/${pm_id}/transition", payload: { action: "ACTIVATE" }, as: PermitCoordinator }
            - { call: "POST /demolition/projects/${p_id}/engineering-surveys", payload: { demolition_method: "MECHANICAL", structural_stability_rating: "STABLE", max_structure_height_ft: 30, adjacent_structure_distance_ft: 40 }, as: StructuralEngineer, as_user_id: "mi-a-1", captures: { es_id: $.data.id } }
            - { call: "POST /demolition/engineering-surveys/${es_id}/transition", payload: { action: "SUBMIT" }, as: StructuralEngineer, as_user_id: "mi-a-1" }
            - { call: "POST /demolition/engineering-surveys/${es_id}/transition", payload: { action: "CERTIFY" }, as: PeerReviewEngineer, as_user_id: "mi-p-1" }
            - { call: "GET /demolition/projects/${p_id}", as: SiteSupervisor, captures: { p_v: $.data.version } }
            - { call: "POST /demolition/projects/${p_id}/engineering-pin", payload: { engineering_survey_id: "${es_id}", expected_project_version: "${p_v}" }, as: SiteSupervisor }
            - { call: "POST /demolition/projects/${p_id}/neighbor-notifications", payload: { address: "85 Elm St", notice_method: "CERTIFIED_MAIL", scheduled_delivery_date: "2026-08-02" }, as: SiteSupervisor, captures: { nn_id: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T09:00:00Z" }, as: ContractorAdmin }
            - { call: "POST /demolition/neighbor-notifications/${nn_id}/transition", payload: { action: "DELIVER" }, as: SiteSupervisor }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-05T09:00:00Z" }, as: ContractorAdmin }
            - { call: "POST /demolition/projects/${p_id}/release", payload: {}, as: SiteSupervisor }
            - { call: "POST /demolition/projects/${p_id}/transition", payload: { action: "START_DEMOLITION" }, as: SiteSupervisor }
            - { call: "POST /demolition/projects/${p_id}/debris-tickets", payload: { ticket_number: "T-A", facility_type: "LANDFILL", material_class: "MIXED_CD", gross_tons: 10.0 }, as: HaulingDispatcher, captures: { tk_a: $.data.id } }
            - { call: "POST /demolition/projects/${p_id}/debris-tickets", payload: { ticket_number: "T-B", facility_type: "TRANSFER", material_class: "METAL", gross_tons: 6.0 }, as: HaulingDispatcher, captures: { tk_b: $.data.id } }
          trigger:
            - { call: "POST /demolition/debris-tickets/${tk_a}/transition", payload: { action: "RECEIVE", diverted_tons: 4.0 }, as: HaulingDispatcher }
            - { call: "GET /demolition/projects/${p_id}", as: SiteSupervisor, captures: { i1: $.data.in_transit_tons, l1: $.data.landfill_tons, d1: $.data.diverted_tons, r1: $.data.removed_tons } }
            - { call: "POST /demolition/debris-tickets/${tk_b}/transition", payload: { action: "VOID" }, as: HaulingDispatcher }
            - { call: "POST /demolition/debris-tickets/${tk_a}/transition", payload: { action: "VOID" }, as: HaulingDispatcher }
            - { call: "GET /demolition/projects/${p_id}", as: SiteSupervisor, captures: { i2: $.data.in_transit_tons, l2: $.data.landfill_tons, d2: $.data.diverted_tons, r2: $.data.removed_tons } }
          assert:
            - "after RECEIVE A: ${i1} == 6.0, ${l1} == 6.0, ${d1} == 4.0, ${r1} == 0 — M = 16.0 == 10.0 + 6.0"
            - "after VOID B (MANIFESTED) and VOID A (RECEIVED): ${i2} == 0, ${l2} == 0, ${d2} == 0, ${r2} == 16.0 — M = 16.0 conserved, zero drift"
            - "Project.${p_id}.diversion_rate == 0 (denominator 0 after both voids)"

      - name: salvage_credit_invariant_through_amend_cycle
        grounds:
          - calculations.salvage_valuation
          - state_machines.SalvageManifest.FINALIZED_to_AMENDED
          - state_machines.SalvageManifest.AMENDED_to_FINALIZED
        distinguishing_aspect: |
          Conserved quantity: net_credit_cents == policy-extended sum -
          processing_fee_cents across a FINALIZE -> AMEND -> add signed
          amendment line -> FINALIZE cycle (1130000 -> 1110000 with a -20000
          compensating line). Different conserved quantity (money identity)
          than debris mass.
        test_recipe:
          setup:
            - "Manifest CONSERVATIVE, fee 50000, items STEEL 4x(20000/32000) + COPPER 2x(550000/700000), FINALIZED with net 1130000."
          setup_api_calls:
            - { call: "POST /demolition/projects", payload: { name: "Amend Lot", address: "87 Elm St", lot_area_sqft: 30000 }, as: ContractorAdmin, captures: { p_id: $.data.id } }
            - { call: "POST /demolition/projects/${p_id}/salvage-manifests", payload: { valuation_policy: "CONSERVATIVE", processing_fee_cents: 50000 }, as: SalvageEstimator, captures: { m_id: $.data.id } }
            - { call: "POST /demolition/salvage-manifests/${m_id}/items", payload: { material: "STEEL", description: "beams", quantity: 4, unit: "TON", low_unit_value_cents: 20000, high_unit_value_cents: 32000 }, as: SalvageEstimator }
            - { call: "POST /demolition/salvage-manifests/${m_id}/items", payload: { material: "COPPER", description: "wire", quantity: 2, unit: "TON", low_unit_value_cents: 550000, high_unit_value_cents: 700000 }, as: SalvageEstimator }
            - { call: "POST /demolition/salvage-manifests/${m_id}/transition", payload: { action: "FINALIZE" }, as: SalvageEstimator, captures: { net1: $.data.net_credit_cents } }
          trigger:
            - { call: "POST /demolition/salvage-manifests/${m_id}/transition", payload: { action: "AMEND" }, as: SalvageEstimator, captures: { st_am: $.data.status, ac: $.data.amendment_count } }
            - { call: "POST /demolition/salvage-manifests/${m_id}/items", payload: { material: "STEEL", description: "beams short-count adjustment", quantity: -1, unit: "TON", low_unit_value_cents: 20000, high_unit_value_cents: 32000 }, as: SalvageEstimator, captures: { li_flag: $.data.is_amendment_line, li_ext: $.data.extended_value_cents } }
            - { call: "POST /demolition/salvage-manifests/${m_id}/transition", payload: { action: "FINALIZE" }, as: SalvageEstimator, captures: { net2: $.data.net_credit_cents, con2: $.data.conservative_total_cents } }
          assert:
            - "before amend: ${net1} == 1130000 (1180000 - 50000)"
            - "AMEND: ${st_am} == AMENDED and ${ac} == 1"
            - "amendment line: ${li_flag} == true and ${li_ext} == -20000 (signed quantity allowed only while AMENDED)"
            - "invariant after re-FINALIZE: ${con2} == 1160000 and ${net2} == 1110000 == 1160000 - 50000 (identity net == policy_total - fee holds)"
