# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task: task_3100_private_mortgage_insurance_underwriting_claim_settlement
#
# Nine Difficulty Rules from SKILL.md §0.5, two instances each (18 total).
# Every `grounds:` ref resolves into SCAFFOLD.yaml §1.1–§1.6.
# Every `test_recipe` is transcribed verbatim by the unit-test-generator.
#
# Canonical fixtures reused below:
#   Master policy MP-1001: delegated curtailment 0.12, non-delegated 0.08,
#     LTV tolerance 0.05, PARTICIPATION_COMPLETE, relief cycles 2,
#     third-party floor 1500 bps, two-year flag true, exposure rate 0.35.
#   Rate card at credit B / band 831_TO_85 / coverage 25 / BPM / 62 bps,
#     no reserve requirement.
#   Delegated loan: 34000000 note, 40000000 appraised value, 25 percent
#     coverage, base 8500000, annual premium 52700, months 4392/4388.
#   Claim items: unpaid principal 8000000, accrued interest 1500000,
#     allowable advances 5000000, gross proceeds 7000000, expenses 500000.
#     Computed: permitted interest 1200000, permitted advances 5000000,
#     net unpaid 14200000, recoverable 7700000, covered 7700000,
#     curtailed 924000, post-curtailment 6776000, deductible 677600,
#     net claim amount 6098400.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  # Rule 1 — dual_variant_calc
  # Two valid approaches to the same question produce different results, on two
  # DIFFERENT entity domains.
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: lender_paid_versus_borrower_paid_premium_divergence
        grounds:
          - calculations.borrower_monthly_premium.variants
          - calculations.single_premium.variants
          - entities.Loan.fields.premium_plan
          - entities.Loan.fields.borrower_paid
          - endpoints.POST_/loans
        distinguishing_aspect: "Two loans that differ only in premium plan and payer produce divergent premium fields on two different entities' data: the borrower-paid monthly loan carries a 52700-cent annual premium billed as eleven periods of 4392 and a final period of 4388, while the lender-paid loan carries a 0-cent annual premium — and the divergence must come from the premium variant alone, since every other field of the two loans is identical."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z, the server default; empty database."
            - "Master policy MP-1001 with a 0.12 delegated and 0.08 non-delegated curtailment rate."
            - "Two rate cards on that policy, identical except that one prices BPM and the other LPM."
            - "A lender without delegated authority and an active TIER_2 servicer."
            - "Two coverage applications differing only in premium_plan and borrower_paid, both taken through the non-delegated underwriting path and approved."
          setup_api_calls:
            - call: "POST /mortgage-insurance/master-policies"
              payload: { policy_number: "MP-1001", anniversary_utc: "2026-01-15T00:00:00Z", coverage_percent_default: 25, delegated_curtailment_rate: 0.12, nondelagated_curtailment_rate: 0.08, ltv_variance_tolerance: 0.05, servicer_loss_mitigation_standard: "PARTICIPATION_COMPLETE", rescission_relief_cycles: 2, min_third_party_net_bps: 1500, two_year_effective_flag: true, exposure_contribution_rate: 0.35 }
              as: MasterPolicyAdmin
              captures: { mp_id: $.data.id }
            - call: "POST /mortgage-insurance/rate-cards"
              payload: { master_policy_id: "${mp_id}", credit_grade: "B", ltv_band: "831_TO_85", coverage_percent: 25, premium_plan: "BPM", rate_bps: 62, min_borrower_reserves_months: 0 }
              as: MasterPolicyAdmin
              captures: { rc_bpm_id: $.data.id }
            - call: "POST /mortgage-insurance/rate-cards"
              payload: { master_policy_id: "${mp_id}", credit_grade: "B", ltv_band: "831_TO_85", coverage_percent: 25, premium_plan: "LPM", rate_bps: 62, min_borrower_reserves_months: 0 }
              as: MasterPolicyAdmin
              captures: { rc_lpm_id: $.data.id }
            - call: "POST /mortgage-insurance/lenders"
              payload: { lender_name: "Cascade Mortgage", delegated_underwriting: false, policy_exposure_cap_cents: 200000000 }
              as: MasterPolicyAdmin
              captures: { lender_id: $.data.id }
            - call: "POST /mortgage-insurance/servicers"
              payload: { servicer_name: "Northline Servicing", tier: "TIER_2", loss_mitigation_capability: "PARTICIPATION_COMPLETE" }
              as: MasterPolicyAdmin
              captures: { servicer_id: $.data.id }
            - call: "POST /mortgage-insurance/coverage-applications"
              payload: { lender_id: "${lender_id}", master_policy_id: "${mp_id}", rate_card_id: "${rc_bpm_id}", borrower_reference: "BPM-1", loan_amount_cents: 34000000, property_value_cents: 40000000, credit_grade: "B", coverage_percent: 25, premium_plan: "BPM", borrower_paid: true, financed_premium: false, borrower_reserves_months: 6, county_code: "06037", term_months: 360 }
              as: Lender
              as_user_id: "${lender_id}"
              captures: { app_bpm_id: $.data.id }
            - call: "POST /mortgage-insurance/coverage-applications"
              payload: { lender_id: "${lender_id}", master_policy_id: "${mp_id}", rate_card_id: "${rc_lpm_id}", borrower_reference: "LPM-1", loan_amount_cents: 34000000, property_value_cents: 40000000, credit_grade: "B", coverage_percent: 25, premium_plan: "LPM", borrower_paid: false, financed_premium: false, borrower_reserves_months: 6, county_code: "06037", term_months: 360 }
              as: Lender
              as_user_id: "${lender_id}"
              captures: { app_lpm_id: $.data.id }
            - call: "POST /mortgage-insurance/coverage-applications/${app_bpm_id}/underwrite"
              payload: {}
              as: Underwriter
            - call: "POST /mortgage-insurance/coverage-applications/${app_lpm_id}/underwrite"
              payload: {}
              as: Underwriter
            - call: "POST /mortgage-insurance/coverage-applications/${app_bpm_id}/approve"
              payload: {}
              as: Underwriter
            - call: "POST /mortgage-insurance/coverage-applications/${app_lpm_id}/approve"
              payload: {}
              as: Underwriter
            - call: "POST /mortgage-insurance/loans"
              payload: { application_id: "${app_bpm_id}", servicer_id: "${servicer_id}", reinsurance_treaty_id: "TREATY-NONE" }
              as: MasterPolicyAdmin
              captures: { loan_bpm_id: $.data.id }
          trigger:
            - call: "POST /mortgage-insurance/loans"
              payload: { application_id: "${app_lpm_id}", servicer_id: "${servicer_id}", reinsurance_treaty_id: "TREATY-NONE" }
              as: MasterPolicyAdmin
              captures: { loan_lpm_id: $.data.id }
          assert:
            - "Loan.${loan_bpm_id}.coverage_base_upb_cents == 8500000 and Loan.${loan_bpm_id}.rate_bps_applied == 62"
            - "Loan.${loan_bpm_id}.annual_premium_cents == 52700"
            - "Loan.${loan_bpm_id}.monthly_period_cents == 4392 and Loan.${loan_bpm_id}.final_period_cents == 4388"
            - "Loan.${loan_lpm_id}.coverage_base_upb_cents == 8500000 and Loan.${loan_lpm_id}.rate_bps_applied == 0"
            - "Loan.${loan_lpm_id}.annual_premium_cents == 0 and Loan.${loan_lpm_id}.monthly_period_cents == 0"
            - "the two loans report identical coverage_percent 25 and identical coverage_base_upb_cents 8500000, so the 52700-cent premium divergence is attributable to the premium variant alone"

      - name: true_up_versus_per_period_rounding_divergence
        grounds:
          - calculations.borrower_monthly_premium.variants
          - calculations.premium_schedule_invariant
          - entities.Loan.fields.final_period_cents
          - entities.Loan.fields.annual_premium_cents
        distinguishing_aspect: "The same 52700-cent annual premium is billed two different ways and the two readings produce different payment schedules: the pinned true-up reading bills eleven periods of 4392 plus a final period of 4388 summing to 52700, whereas rounding each period independently produces twelve periods of 4391 summing to 52692, and the scaffold's Loan fields must carry the pinned reading."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; empty database; delegated lender; a BPM loan with a 8500000-cent coverage base priced at 62 basis points."
          setup_api_calls:
            - call: "POST /mortgage-insurance/master-policies"
              payload: { policy_number: "MP-1001", anniversary_utc: "2026-01-15T00:00:00Z", coverage_percent_default: 25, delegated_curtailment_rate: 0.12, nondelagated_curtailment_rate: 0.08, ltv_variance_tolerance: 0.05, servicer_loss_mitigation_standard: "PARTICIPATION_COMPLETE", rescission_relief_cycles: 2, min_third_party_net_bps: 1500, two_year_effective_flag: true, exposure_contribution_rate: 0.35 }
              as: MasterPolicyAdmin
              captures: { mp_id: $.data.id }
            - call: "POST /mortgage-insurance/rate-cards"
              payload: { master_policy_id: "${mp_id}", credit_grade: "B", ltv_band: "831_TO_85", coverage_percent: 25, premium_plan: "BPM", rate_bps: 62, min_borrower_reserves_months: 0 }
              as: MasterPolicyAdmin
              captures: { rc_id: $.data.id }
            - call: "POST /mortgage-insurance/lenders"
              payload: { lender_name: "Cascade Mortgage", delegated_underwriting: true, policy_exposure_cap_cents: 200000000 }
              as: MasterPolicyAdmin
              captures: { lender_id: $.data.id }
            - call: "POST /mortgage-insurance/servicers"
              payload: { servicer_name: "Northline Servicing", tier: "TIER_2", loss_mitigation_capability: "PARTICIPATION_COMPLETE" }
              as: MasterPolicyAdmin
              captures: { servicer_id: $.data.id }
            - call: "POST /mortgage-insurance/coverage-applications"
              payload: { lender_id: "${lender_id}", master_policy_id: "${mp_id}", rate_card_id: "${rc_id}", borrower_reference: "TRUEUP-1", loan_amount_cents: 34000000, property_value_cents: 40000000, credit_grade: "B", coverage_percent: 25, premium_plan: "BPM", borrower_paid: true, financed_premium: false, borrower_reserves_months: 6, county_code: "06037", term_months: 360 }
              as: Lender
              as_user_id: "${lender_id}"
              captures: { app_id: $.data.id }
            - call: "POST /mortgage-insurance/coverage-applications/${app_id}/delegated-approve"
              payload: {}
              as: Lender
              as_user_id: "${lender_id}"
          trigger:
            - call: "POST /mortgage-insurance/loans"
              payload: { application_id: "${app_id}", servicer_id: "${servicer_id}", reinsurance_treaty_id: "TREATY-NONE" }
              as: MasterPolicyAdmin
              captures: { loan_id: $.data.id }
          assert:
            - "Loan.${loan_id}.annual_premium_cents == 52700"
            - "Loan.${loan_id}.monthly_period_cents == 4392"
            - "Loan.${loan_id}.final_period_cents == 4388"
            - "11 * Loan.${loan_id}.monthly_period_cents + Loan.${loan_id}.final_period_cents == 52700"
            - "Loan.${loan_id}.monthly_period_cents != 4391, so the per-period-independent-rounding reading is rejected"
            - "Loan.${loan_id}.final_period_cents != 4408, so redistributing the remainder across the final period is rejected"
  # ===========================================================================
  # Rule 2 — combinatorial_formula
  # Two combinatorial calculations in DIFFERENT modes: (a) non-linear
  # interaction over 3+ inputs, (b) nested rounding where the order matters.
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: claim_amount_nested_rounding_order
        grounds:
          - calculations.claim_amount_computation
          - calculations.claim_amount_computation.variants.coverage_ceiling_before_curtailment
          - entities.Claim.fields.claim_deductible_cents
          - entities.Claim.fields.net_claim_amount_cents
        distinguishing_aspect: "Mode (b) nested rounding where the order matters: the ceiling is applied to the recoverable amount before the curtailment and the deductible is taken on the post-curtailment figure, so a claim with a 7700000-cent recoverable amount and a 0.12 delegated curtailment yields a 6098400-cent net; curtailing the raw recoverable amount first and ceilinging afterwards yields a different figure for identical claim items."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; empty database; a delegated loan whose coverage base is 8500000 cents and whose approval credit grade is B."
            - "A filed claim on that loan with 8000000 cents principal, 1500000 cents interest, 5000000 cents advances, 7000000 cents gross proceeds and 500000 cents expenses of sale."
          setup_api_calls:
            - call: "POST /mortgage-insurance/master-policies"
              payload: { policy_number: "MP-1001", anniversary_utc: "2026-01-15T00:00:00Z", coverage_percent_default: 25, delegated_curtailment_rate: 0.12, nondelagated_curtailment_rate: 0.08, ltv_variance_tolerance: 0.05, servicer_loss_mitigation_standard: "PARTICIPATION_COMPLETE", rescission_relief_cycles: 2, min_third_party_net_bps: 1500, two_year_effective_flag: true, exposure_contribution_rate: 0.35 }
              as: MasterPolicyAdmin
              captures: { mp_id: $.data.id }
            - call: "POST /mortgage-insurance/rate-cards"
              payload: { master_policy_id: "${mp_id}", credit_grade: "B", ltv_band: "831_TO_85", coverage_percent: 25, premium_plan: "BPM", rate_bps: 62, min_borrower_reserves_months: 0 }
              as: MasterPolicyAdmin
              captures: { rc_id: $.data.id }
            - call: "POST /mortgage-insurance/lenders"
              payload: { lender_name: "Cascade Mortgage", delegated_underwriting: true, policy_exposure_cap_cents: 200000000 }
              as: MasterPolicyAdmin
              captures: { lender_id: $.data.id }
            - call: "POST /mortgage-insurance/servicers"
              payload: { servicer_name: "Northline Servicing", tier: "TIER_2", loss_mitigation_capability: "PARTICIPATION_COMPLETE" }
              as: MasterPolicyAdmin
              captures: { servicer_id: $.data.id }
            - call: "POST /mortgage-insurance/coverage-applications"
              payload: { lender_id: "${lender_id}", master_policy_id: "${mp_id}", rate_card_id: "${rc_id}", borrower_reference: "ROUND-1", loan_amount_cents: 34000000, property_value_cents: 40000000, credit_grade: "B", coverage_percent: 25, premium_plan: "BPM", borrower_paid: true, financed_premium: false, borrower_reserves_months: 6, county_code: "06037", term_months: 360 }
              as: Lender
              as_user_id: "${lender_id}"
              captures: { app_id: $.data.id }
            - call: "POST /mortgage-insurance/coverage-applications/${app_id}/delegated-approve"
              payload: {}
              as: Lender
              as_user_id: "${lender_id}"
            - call: "POST /mortgage-insurance/loans"
              payload: { application_id: "${app_id}", servicer_id: "${servicer_id}", reinsurance_treaty_id: "TREATY-NONE" }
              as: MasterPolicyAdmin
              captures: { loan_id: $.data.id }
            - call: "POST /mortgage-insurance/loans/${loan_id}/amortization-milestones"
              payload: { current_upb_cents: 34500000 }
              as: Servicer
            - call: "POST /mortgage-insurance/claims"
              payload: { loan_id: "${loan_id}", event_kind: "FORECLOSURE", event_completed_utc: "2026-08-01T00:00:00Z", unpaid_principal_cents: 8000000, accrued_interest_cents: 1500000, allowable_advances_cents: 5000000, gross_proceeds_cents: 7000000, expenses_of_sale_cents: 500000 }
              as: Lender
              as_user_id: "${lender_id}"
              captures: { claim_id: $.data.id }
            - call: "POST /mortgage-insurance/claims/${claim_id}/begin-review"
              payload: {}
              as: Underwriter
          trigger:
            - call: "POST /mortgage-insurance/claims/${claim_id}/approve"
              payload: {}
              as: Underwriter
          assert:
            - "Claim.${claim_id}.permitted_interest_cents == 1200000"
            - "Claim.${claim_id}.permitted_advances_cents == 5000000"
            - "Claim.${claim_id}.net_unpaid_balance_cents == 14200000"
            - "Claim.${claim_id}.recoverable_amount_cents == 7700000"
            - "Claim.${claim_id}.coverage_ceiling_cents == 8500000"
            - "Claim.${claim_id}.covered_claim_amount_cents == 7700000"
            - "Claim.${claim_id}.curtailment_rate_applied == 0.12"
            - "Claim.${claim_id}.post_curtailment_cents == 6776000"
            - "Claim.${claim_id}.claim_deductible_cents == 677600"
            - "Claim.${claim_id}.net_claim_amount_cents == 6098400"
            - "Claim.${claim_id}.net_claim_amount_cents != 6177600, which is what curtailing the raw recoverable amount and ceilinging afterwards would produce"

      - name: third_party_sale_floor_then_reinsurance_retention_waterfall
        grounds:
          - calculations.settlement_option_computation
          - calculations.reinsurance_cession_allocation
          - entities.ReinsuranceTreaty.fields.retention_per_claim_cents
          - entities.ClaimSettlementOption.fields.computed_amount_cents
        distinguishing_aspect: "Mode (a) non-linear interaction over four inputs: the THIRD_PARTY_SALE option is first floored by the master policy's third-party net basis-point floor and the resulting amount is then run through the treaty's retention-and-capacity waterfall, so one net claim amount of 6098400 cents produces a 5183640-cent option price and a 4183640-cent ceded amount — neither figure is reachable by a single linear pass."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; a delegated loan under an in-force treaty with retention 1000000 cents, exhaustion 6000000 cents and a 5000000-cent aggregate cap; a filed and approved claim with the canonical claim items."
          setup_api_calls:
            - call: "POST /mortgage-insurance/master-policies"
              payload: { policy_number: "MP-1001", anniversary_utc: "2026-01-15T00:00:00Z", coverage_percent_default: 25, delegated_curtailment_rate: 0.12, nondelagated_curtailment_rate: 0.08, ltv_variance_tolerance: 0.05, servicer_loss_mitigation_standard: "PARTICIPATION_COMPLETE", rescission_relief_cycles: 2, min_third_party_net_bps: 1500, two_year_effective_flag: true, exposure_contribution_rate: 0.35 }
              as: MasterPolicyAdmin
              captures: { mp_id: $.data.id }
            - call: "POST /mortgage-insurance/rate-cards"
              payload: { master_policy_id: "${mp_id}", credit_grade: "B", ltv_band: "831_TO_85", coverage_percent: 25, premium_plan: "BPM", rate_bps: 62, min_borrower_reserves_months: 0 }
              as: MasterPolicyAdmin
              captures: { rc_id: $.data.id }
            - call: "POST /mortgage-insurance/reinsurance-treaties"
              payload: { treaty_number: "TR-2026-A", inception_utc: "2026-01-01T00:00:00Z", expiration_utc: "2028-01-01T00:00:00Z", retention_per_claim_cents: 1000000, exhaustion_per_claim_cents: 6000000, aggregate_ceded_cap_cents: 5000000 }
              as: MasterPolicyAdmin
              captures: { treaty_id: $.data.id }
            - call: "POST /mortgage-insurance/lenders"
              payload: { lender_name: "Cascade Mortgage", delegated_underwriting: true, policy_exposure_cap_cents: 200000000 }
              as: MasterPolicyAdmin
              captures: { lender_id: $.data.id }
            - call: "POST /mortgage-insurance/servicers"
              payload: { servicer_name: "Northline Servicing", tier: "TIER_2", loss_mitigation_capability: "PARTICIPATION_COMPLETE" }
              as: MasterPolicyAdmin
              captures: { servicer_id: $.data.id }
            - call: "POST /mortgage-insurance/coverage-applications"
              payload: { lender_id: "${lender_id}", master_policy_id: "${mp_id}", rate_card_id: "${rc_id}", borrower_reference: "TPS-1", loan_amount_cents: 34000000, property_value_cents: 40000000, credit_grade: "B", coverage_percent: 25, premium_plan: "BPM", borrower_paid: true, financed_premium: false, borrower_reserves_months: 6, county_code: "06037", term_months: 360 }
              as: Lender
              as_user_id: "${lender_id}"
              captures: { app_id: $.data.id }
            - call: "POST /mortgage-insurance/coverage-applications/${app_id}/delegated-approve"
              payload: {}
              as: Lender
              as_user_id: "${lender_id}"
            - call: "POST /mortgage-insurance/loans"
              payload: { application_id: "${app_id}", servicer_id: "${servicer_id}", reinsurance_treaty_id: "${treaty_id}" }
              as: MasterPolicyAdmin
              captures: { loan_id: $.data.id }
            - call: "POST /mortgage-insurance/loans/${loan_id}/amortization-milestones"
              payload: { current_upb_cents: 34500000 }
              as: Servicer
            - call: "POST /mortgage-insurance/claims"
              payload: { loan_id: "${loan_id}", event_kind: "FORECLOSURE", event_completed_utc: "2026-08-01T00:00:00Z", unpaid_principal_cents: 8000000, accrued_interest_cents: 1500000, allowable_advances_cents: 5000000, gross_proceeds_cents: 7000000, expenses_of_sale_cents: 500000 }
              as: Lender
              as_user_id: "${lender_id}"
              captures: { claim_id: $.data.id }
            - call: "POST /mortgage-insurance/claims/${claim_id}/begin-review"
              payload: {}
              as: Underwriter
            - call: "POST /mortgage-insurance/claims/${claim_id}/approve"
              payload: {}
              as: Underwriter
              captures: { claim_v: $.data.version }
            - call: "GET /mortgage-insurance/loans/${loan_id}"
              payload: {}
              as: Underwriter
              captures: { loan_v: $.data.version }
          trigger:
            - call: "POST /mortgage-insurance/claims/${claim_id}/settle"
              payload: { settlement_option_kind: "THIRD_PARTY_SALE", expected_claim_version: "${claim_v}", expected_loan_version: "${loan_v}" }
              as: Lender
              as_user_id: "${lender_id}"
          assert:
            - "the claim's approved net_claim_amount_cents == 6098400"
            - "GET /mortgage-insurance/claims/${claim_id}/settlement-options returns THIRD_PARTY_SALE with computed_amount_cents == 5183640 and CASH with computed_amount_cents == 6098400"
            - "Claim.${claim_id}.settlement_amount_cents == 5183640"
            - "GET /mortgage-insurance/reinsurance-cessions?claim_id=${claim_id} returns exactly 1 row with status ACCEPTED"
            - "that cession's ceded_amount_cents == 4183640 and retained_amount_cents == 1000000"
            - "Loan.${loan_id}.aggregate_ceded_cents == 4183640"

  # ===========================================================================
  # Rule 3 — non_linear_state_machine
  # Two non-linear machines on DIFFERENT entities: one cyclic, one parallel.
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: claim_reconsideration_cycle_reopens_denied_claims
        grounds:
          - state_machines.Claim.UNDER_REVIEW_to_FILED
          - state_machines.Claim.DENIED_to_FILED
          - entities.Claim.fields.status
          - errors[ERR_INVALID_STATE_TRANSITION]
        distinguishing_aspect: "Claim is a cyclic machine, not a pipeline: a DENIED claim is not terminal because RECONSIDERATION returns it to FILED and the claim can complete the whole review cycle a second time, so the graph contains a genuine A→B→A loop with an explicit re-entry state rather than a single forward path."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; a delegated loan carrying one filed claim that has already been taken into review and denied."
          setup_api_calls:
            - call: "POST /mortgage-insurance/master-policies"
              payload: { policy_number: "MP-1001", anniversary_utc: "2026-01-15T00:00:00Z", coverage_percent_default: 25, delegated_curtailment_rate: 0.12, nondelagated_curtailment_rate: 0.08, ltv_variance_tolerance: 0.05, servicer_loss_mitigation_standard: "PARTICIPATION_COMPLETE", rescission_relief_cycles: 2, min_third_party_net_bps: 1500, two_year_effective_flag: true, exposure_contribution_rate: 0.35 }
              as: MasterPolicyAdmin
              captures: { mp_id: $.data.id }
            - call: "POST /mortgage-insurance/rate-cards"
              payload: { master_policy_id: "${mp_id}", credit_grade: "B", ltv_band: "831_TO_85", coverage_percent: 25, premium_plan: "BPM", rate_bps: 62, min_borrower_reserves_months: 0 }
              as: MasterPolicyAdmin
              captures: { rc_id: $.data.id }
            - call: "POST /mortgage-insurance/lenders"
              payload: { lender_name: "Cascade Mortgage", delegated_underwriting: true, policy_exposure_cap_cents: 200000000 }
              as: MasterPolicyAdmin
              captures: { lender_id: $.data.id }
            - call: "POST /mortgage-insurance/servicers"
              payload: { servicer_name: "Northline Servicing", tier: "TIER_2", loss_mitigation_capability: "PARTICIPATION_COMPLETE" }
              as: MasterPolicyAdmin
              captures: { servicer_id: $.data.id }
            - call: "POST /mortgage-insurance/coverage-applications"
