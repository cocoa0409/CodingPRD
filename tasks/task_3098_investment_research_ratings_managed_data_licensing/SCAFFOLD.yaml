# =============================================================================
# SCAFFOLD.yaml — task_3098_investment_research_ratings_managed_data_licensing
# Investment Research Ratings & Managed Data Licensing (Morningstar-style)
# =============================================================================

scenario: |
  Investment Research Ratings & Managed Data Licensing (Morningstar): fund and
  equity data ingestion with holdings-based analysis and category assignment,
  quantitative and analyst-driven rating methodologies with rating committee
  governance and rating changes, methodology change management with historical
  restatement and client communication, data licensing tiers for display,
  redistribution and derived-works usage with audit rights, index construction
  and licensing for products tracking a methodology, conflict management
  between research ratings and commercial relationships, adviser workstation
  entitlements and seat-based licensing, data quality dispute handling with
  fund companies.

domain_name: research-ratings-licensing
api_prefix: /research

# =============================================================================
# §0 Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: quota_allocation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
  entity_topology: flat
  state_machine_shape: branching
  relationship_patterns:
    - one_to_many
    - many_to_many
    - self_referential
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: FundCompany
    parent: null
    common_fields: true
    fields:
      - { name: legal_name, type: string, source: input, description: "Fund company legal name" }
      - { name: company_status, type: enum, source: system, description: "ACTIVE | SUSPENDED | OFFBOARDED; starts ACTIVE" }
      - { name: commercial_relationship, type: enum, source: input, description: "NONE | LICENSED_CLIENT | INDEX_LICENSEE; drives conflict checks" , default: NONE }
      - { name: open_dispute_count, type: integer, source: computed, description: "Count of DataDispute rows in OPEN or UNDER_INVESTIGATION for this company", default: 0 }
      - { name: quality_score_bp, type: integer, source: computed, description: "Computed on read per data_quality_score calculation" }

  - name: Fund
    parent: null
    common_fields: true
    fields:
      - { name: fund_company_id, type: string, source: input, description: "FK -> FundCompany.id; issuer" }
      - { name: ticker, type: string, source: input, description: "Fund ticker; unique" }
      - { name: inception_date, type: string, source: input, description: "ISO date YYYY-MM-DD" }
      - { name: fund_status, type: enum, source: system, description: "ACTIVE | SUSPENDED | LIQUIDATED; starts ACTIVE" }
      - { name: category_id, type: string, source: computed, description: "FK -> Category.id; assigned by holdings analysis, null until first assignment" }
      - { name: category_assignment_revision, type: integer, source: system, description: "Revision counter incremented on each category reassignment", default: 0 }
      - { name: trailing_return_3y_bp, type: integer, source: input, description: "Trailing 3-year total return in basis points, from last ingestion" }
      - { name: trailing_return_5y_bp, type: integer, source: input, description: "Trailing 5-year total return in basis points; null if fund younger than 5y" }
      - { name: risk_score_bp, type: integer, source: input, description: "Downside deviation risk score in basis points from last ingestion" }

  - name: Holding
    parent: Fund
    common_fields: false
    fields:
      - { name: fund_id, type: string, source: input, description: "FK -> Fund.id; owning fund" }
      - { name: as_of_date, type: string, source: input, description: "ISO date the snapshot is as-of" }
      - { name: security_ticker, type: string, source: input, description: "Underlying security ticker" }
      - { name: asset_class, type: enum, source: input, description: "EQUITY | BOND | CASH | OTHER" }
      - { name: sector, type: enum, source: input, description: "TECH | HEALTH | FINANCE | ENERGY | CONSUMER | INDUSTRIAL | MIXED" }
      - { name: weight_bp, type: integer, source: input, description: "Portfolio weight in basis points; sum over a snapshot must equal 10000" }

  - name: Category
    parent: null
    common_fields: true
    fields:
      - { name: category_code, type: string, source: input, description: "Unique code, e.g. LG_GRW, FI_GOV" }
      - { name: dominant_asset_class, type: enum, source: input, description: "EQUITY | BOND | MIXED" }
      - { name: dominant_sector, type: enum, source: input, description: "TECH | HEALTH | FINANCE | ENERGY | CONSUMER | INDUSTRIAL | MIXED" }
      - { name: min_weight_bp, type: integer, source: input, description: "Minimum aggregated weight (bp) of dominant asset class required for assignment" }
      - { name: active, type: boolean, source: input, default: true, description: "Inactive categories accept no new assignments" }

  - name: Methodology
    parent: null
    common_fields: true
    fields:
      - { name: methodology_code, type: string, source: input, description: "Unique code, e.g. QUANT_STAR_V1" }
      - { name: methodology_kind, type: enum, source: input, description: "QUANTITATIVE | ANALYST" }
      - { name: version_number, type: integer, source: input, description: "Integer version; unique per methodology_code" }
      - { name: effective_from, type: string, source: input, description: "ISO date inclusive start of effectiveness window" }
      - { name: effective_to, type: string, source: input, description: "ISO date exclusive end of window; null = open-ended" }
      - { name: methodology_status, type: enum, source: system, description: "DRAFT | EFFECTIVE | SUPERSEDED | RETIRED; starts DRAFT" }
      - { name: weight_return_bp, type: integer, source: input, description: "Weight (bp) applied to return leg in quantitative score" }
      - { name: weight_risk_bp, type: integer, source: input, description: "Weight (bp) applied to risk leg; weight_return_bp + weight_risk_bp == 10000" }
      - { name: rating_ceilings, type: array, source: input, description: "Four integer bp cutoffs [c1,c2,c3,c4] ascending mapping score to stars 5,4,3,2 else 1" }

  - name: MethodologyChange
    parent: Methodology
    common_fields: true
    fields:
      - { name: methodology_id, type: string, source: input, description: "FK -> Methodology.id being changed" }
      - { name: change_status, type: enum, source: system, description: "PROPOSED | APPROVED | EFFECTIVE | WITHDRAWN; starts PROPOSED" }
      - { name: restatement_required, type: boolean, source: input, description: "Whether historical ratings must be restated" }
      - { name: effective_date, type: string, source: input, description: "ISO date the change takes effect" }
      - { name: client_notice_sent, type: boolean, source: system, description: "True once client communication recorded; required before EFFECTIVE", default: false }
      - { name: restated_rating_count, type: integer, source: computed, description: "Ratings restated by this change; null until EFFECTIVE" }

  - name: Rating
    parent: Fund
    common_fields: true
    fields:
      - { name: fund_id, type: string, source: input, description: "FK -> Fund.id being rated" }
      - { name: methodology_id, type: string, source: input, description: "FK -> Methodology.id used" }
      - { name: rating_kind, type: enum, source: system, description: "QUANTITATIVE | ANALYST" }
      - { name: stars, type: integer, source: system, description: "1..5 for quantitative; null for analyst until committee approval" }
      - { name: analyst_grade, type: enum, source: system, description: "GOLD | SILVER | BRONZE | NEUTRAL | NEGATIVE; analyst ratings only" }
      - { name: rating_status, type: enum, source: system, description: "PROVISIONAL | COMMITTEE_REVIEW | PUBLISHED | SUPERSEDED | WITHDRAWN | RESTATED" }
      - { name: as_of_date, type: string, source: system, description: "Logical-clock date at computation" }
      - { name: provisional_stars, type: integer, source: computed, description: "Provisional-variant star value kept alongside final when variants diverge" }
      - { name: restatement_of_id, type: string, source: system, description: "FK -> Rating.id (self-referential); set on restated successor", default: null }
      - { name: suppression_reason, type: enum, source: system, description: "NONE | CONFLICT_HOLD | DISPUTE_HOLD; why publication is blocked", default: NONE }

  - name: RatingProposal
    parent: Rating
    common_fields: true
    fields:
      - { name: rating_id, type: string, source: input, description: "FK -> Rating.id the proposal mutates (analyst ratings only)" }
      - { name: proposed_grade, type: enum, source: input, description: "GOLD | SILVER | BRONZE | NEUTRAL | NEGATIVE" }
      - { name: proposed_by, type: string, source: input, description: "Analyst id proposing; cannot vote on own proposal (segregation of duties)" }
      - { name: proposal_status, type: enum, source: system, description: "OPEN | QUORUM_MET | APPROVED | REJECTED | WITHDRAWN; starts OPEN" }
      - { name: approvals, type: integer, source: computed, description: "Count of APPROVE votes cast", default: 0 }
      - { name: rejections, type: integer, source: computed, description: "Count of REJECT votes cast", default: 0 }

  - name: CommitteeVote
    parent: RatingProposal
    common_fields: false
    fields:
      - { name: proposal_id, type: string, source: input, description: "FK -> RatingProposal.id" }
      - { name: voter_id, type: string, source: input, description: "Committee member id" }
      - { name: vote, type: enum, source: input, description: "APPROVE | REJECT | ABSTAIN" }

  - name: Licensee
    parent: null
    common_fields: true
    fields:
      - { name: licensee_name, type: string, source: input, description: "Client firm name" }
      - { name: licensee_status, type: enum, source: system, description: "ACTIVE | SUSPENDED | TERMINATED; starts ACTIVE" }
      - { name: arrears_cents, type: integer, source: computed, description: "Outstanding invoiced cents unpaid", default: 0 }

  - name: LicenseAgreement
    parent: Licensee
    common_fields: true
    fields:
      - { name: licensee_id, type: string, source: input, description: "FK -> Licensee.id" }
      - { name: tier, type: enum, source: input, description: "DISPLAY | REDISTRIBUTION | DERIVED_WORKS" }
      - { name: seat_limit, type: integer, source: input, description: "Maximum concurrent seats; > 0" }
      - { name: seats_in_use, type: integer, source: computed, description: "Active SeatEntitlement count", default: 0 }
      - { name: effective_from, type: string, source: input, description: "ISO date inclusive" }
      - { name: effective_to, type: string, source: input, description: "ISO date exclusive; null = open" }
      - { name: agreement_status, type: enum, source: system, description: "DRAFT | ACTIVE | SUSPENDED | TERMINATED; starts DRAFT" }
      - { name: base_fee_cents, type: integer, source: input, description: "Annual base fee in cents" }
      - { name: audit_count, type: integer, source: computed, description: "LicenseAudit rows opened against this agreement", default: 0 }

  - name: SeatEntitlement
    parent: LicenseAgreement
    common_fields: true
    fields:
      - { name: agreement_id, type: string, source: input, description: "FK -> LicenseAgreement.id" }
      - { name: workstation_user_id, type: string, source: input, description: "Adviser workstation user identity; unique per agreement" }
      - { name: seat_status, type: enum, source: system, description: "ACTIVE | REVOKED; starts ACTIVE" }
      - { name: entitled_data_scope, type: enum, source: system, description: "DISPLAY | REDISTRIBUTION | DERIVED_WORKS; derived from agreement tier at grant; tier upgrades re-derive" }

  - name: LicenseAudit
    parent: LicenseAgreement
    common_fields: true
    fields:
      - { name: agreement_id, type: string, source: input, description: "FK -> LicenseAgreement.id" }
      - { name: audit_status, type: enum, source: system, description: "OPEN | FINDINGS_FILED | CLOSED_NO_ACTION | CLOSED_WITH_PENALTY; starts OPEN" }
      - { name: unlicensed_uses_found, type: integer, source: system, description: "Count of unlicensed uses recorded at findings", default: 0 }
      - { name: penalty_cents, type: integer, source: computed, description: "Computed penalty at close; 0 when CLOSED_NO_ACTION" }

  - name: DataDispute
    parent: Fund
    common_fields: true
    fields:
      - { name: fund_id, type: string, source: input, description: "FK -> Fund.id under dispute" }
      - { name: raised_by_company_id, type: string, source: input, description: "FK -> FundCompany.id raising the dispute; must equal the fund's issuer" }
      - { name: disputed_field, type: enum, source: input, description: "HOLDINGS | TRAILING_RETURN_3Y | TRAILING_RETURN_5Y | RISK_SCORE | CATEGORY" }
      - { name: corrected_value, type: integer, source: input, description: "Corrected integer value (bp) when the dispute is a numeric field; ignored for HOLDINGS/CATEGORY" }
      - { name: dispute_status, type: enum, source: system, description: "OPEN | UNDER_INVESTIGATION | RESOLVED_ACCEPTED | RESOLVED_REJECTED; starts OPEN" }
      - { name: resolution_note, type: string, source: system, description: "Resolution rationale recorded at resolve" }

  - name: IndexDefinition
    parent: null
    common_fields: true
    fields:
      - { name: index_code, type: string, source: input, description: "Unique code" }
      - { name: methodology_id, type: string, source: input, description: "FK -> Methodology.id the index tracks" }
      - { name: max_constituents, type: integer, source: input, description: "Constituent cap; > 0" }
      - { name: single_constituent_cap_bp, type: integer, source: input, description: "Per-constituent weight cap in basis points" }
      - { name: index_status, type: enum, source: system, description: "DRAFT | LIVE | SUSPENDED | RETIRED; starts DRAFT" }
      - { name: licensed_agreement_id, type: string, source: system, description: "FK -> LicenseAgreement.id of DERIVED_WORKS agreement licensing this index; required to go LIVE" }

  - name: IndexConstituent
    parent: IndexDefinition
    common_fields: false
    fields:
      - { name: index_id, type: string, source: input, description: "FK -> IndexDefinition.id" }
      - { name: fund_id, type: string, source: input, description: "FK -> Fund.id; fund must be ACTIVE with a PUBLISHED rating under the index methodology" }
      - { name: target_weight_bp, type: integer, source: input, description: "Requested weight before capping" }
      - { name: final_weight_bp, type: integer, source: computed, description: "Weight after cap-and-redistribute; null until rebalance" }

  - name: ConflictFlag
    parent: Fund
    common_fields: true
    fields:
      - { name: fund_id, type: string, source: input, description: "FK -> Fund.id" }
      - { name: flag_kind, type: enum, source: system, description: "COMMERCIAL_RATING_CONFLICT | INDEX_LICENSOR_CONFLICT" }
      - { name: flag_status, type: enum, source: system, description: "OPEN | WAIVED | RESOLVED; starts OPEN" }
      - { name: blocking, type: boolean, source: computed, description: "True while OPEN and flag_kind == COMMERCIAL_RATING_CONFLICT; blocks rating publication" }

  - name: ClientNotice
    parent: MethodologyChange
    common_fields: false
    fields:
      - { name: methodology_change_id, type: string, source: input, description: "FK -> MethodologyChange.id" }
      - { name: licensee_id, type: string, source: input, description: "FK -> Licensee.id notified" }
      - { name: notice_channel, type: enum, source: input, description: "EMAIL | PORTAL | API" }
      - { name: notice_sent_at, type: string, source: system, description: "Logical-clock timestamp of send" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: FundCompany
    field: company_status
    initial_state: ACTIVE
    terminal_states: [OFFBOARDED]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /research/fund-companies/{id}/suspend"
        actor: ResearchOps
        preconditions:
          - "company_status == ACTIVE"
        side_effects:
          - "All ACTIVE Fund rows of this company move to SUSPENDED"
          - "Each such Fund's non-terminal Rating rows (PROVISIONAL, COMMITTEE_REVIEW) gain suppression_reason DISPUTE_HOLD"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /research/fund-companies/{id}/reinstate"
        actor: ResearchOps
        preconditions:
          - "company_status == SUSPENDED"
          - "open_dispute_count == 0"
        side_effects:
          - "All SUSPENDED Fund rows of this company return to ACTIVE"
      - from: ACTIVE
        to: OFFBOARDED
        trigger: "POST /research/fund-companies/{id}/offboard"
        actor: ResearchOps
        preconditions:
          - "company_status == ACTIVE"
          - "No Fund of this company is ACTIVE or SUSPENDED (all LIQUIDATED)"
          - "open_dispute_count == 0"
        side_effects: []

  - entity: Fund
    field: fund_status
    initial_state: ACTIVE
    terminal_states: [LIQUIDATED]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "system (FundCompany suspended)"
        actor: system
        preconditions: []
        side_effects: []
      - from: SUSPENDED
        to: ACTIVE
        trigger: "system (FundCompany reinstated)"
        actor: system
        preconditions: []
        side_effects: []
      - from: ACTIVE
        to: LIQUIDATED
        trigger: "POST /research/funds/{id}/liquidate"
        actor: ResearchOps
        preconditions:
          - "fund_status == ACTIVE"
          - "No DataDispute for this fund in OPEN or UNDER_INVESTIGATION"
        side_effects:
          - "All non-terminal Rating rows (PROVISIONAL, COMMITTEE_REVIEW, PUBLISHED) of the fund move to WITHDRAWN"
          - "The fund is removed from every IndexConstituent row of a LIVE or DRAFT index (row deleted)"

  - entity: Rating
    field: rating_status
    initial_state: PROVISIONAL
    terminal_states: [SUPERSEDED, WITHDRAWN]
    transitions:
      - from: PROVISIONAL
        to: COMMITTEE_REVIEW
        trigger: "POST /research/ratings/{id}/proposals (analyst ratings only)"
        actor: Analyst
        preconditions:
          - "rating_kind == ANALYST"
          - "rating_status == PROVISIONAL"
          - "Fund.fund_status == ACTIVE"
        side_effects:
          - "RatingProposal created in OPEN status linked to this rating"
      - from: PROVISIONAL
        to: PUBLISHED
        trigger: "POST /research/ratings/{id}/publish (quantitative ratings only)"
        actor: ResearchOps
        preconditions:
          - "rating_kind == QUANTITATIVE"
          - "rating_status == PROVISIONAL"
          - "Methodology.methodology_status == EFFECTIVE"
          - "Fund.fund_status == ACTIVE"
          - "suppression_reason == NONE"
          - "No ConflictFlag for the fund with flag_status == OPEN and flag_kind == COMMERCIAL_RATING_CONFLICT"
        side_effects:
          - "Any prior PUBLISHED Rating for the same fund with the same rating_kind moves to SUPERSEDED"
      - from: COMMITTEE_REVIEW
        to: PUBLISHED
        trigger: "system (proposal APPROVED)"
        actor: system
        preconditions:
          - "suppression_reason == NONE"
          - "No OPEN COMMERCIAL_RATING_CONFLICT ConflictFlag for the fund"
        side_effects:
          - "analyst_grade set from the approved proposal's proposed_grade"
          - "Any prior PUBLISHED analyst Rating for the same fund moves to SUPERSEDED"
      - from: COMMITTEE_REVIEW
        to: PROVISIONAL
        trigger: "system (proposal REJECTED or WITHDRAWN)"
        actor: system
        preconditions: []
        side_effects: []
      - from: PUBLISHED
        to: RESTATED
        trigger: "system (MethodologyChange with restatement_required=true becomes EFFECTIVE, or DataDispute RESOLVED_ACCEPTED on a rated field)"
        actor: system
        preconditions: []
        side_effects:
          - "A successor Rating row is created in PROVISIONAL (quantitative) or COMMITTEE_REVIEW (analyst) with restatement_of_id set to this rating"
          - "MethodologyChange.restated_rating_count incremented by 1 when triggered by a methodology change"
      - from: [PROVISIONAL, COMMITTEE_REVIEW, PUBLISHED]
        to: WITHDRAWN
        trigger: "system (fund liquidated, or POST /research/ratings/{id}/withdraw)"
        actor: "ResearchOps or system"
        preconditions:
          - "Manual withdraw: rating_status != WITHDRAWN and != SUPERSEDED"
        side_effects: []

  - entity: RatingProposal
    field: proposal_status
    initial_state: OPEN
    terminal_states: [APPROVED, REJECTED, WITHDRAWN]
    transitions:
      - from: OPEN
        to: QUORUM_MET
        trigger: "system (CommitteeVote cast: approvals + rejections >= QUORUM=3 and approvals > rejections is not yet decided; exact rule: status flips when total votes >= 3)"
        actor: system
        preconditions: []
        side_effects: []
      - from: [OPEN, QUORUM_MET]
        to: APPROVED
        trigger: "system (approvals >= 2 AND approvals > rejections after at least 3 votes)"
        actor: system
        preconditions:
          - "approvals >= 2"
          - "approvals + rejections + abstentions >= 3"
          - "approvals > rejections"
        side_effects:
          - "Rating moves COMMITTEE_REVIEW → PUBLISHED (subject to conflict suppression preconditions)"
      - from: [OPEN, QUORUM_MET]
        to: REJECTED
        trigger: "system (rejections >= 2 AND rejections >= approvals after at least 3 votes)"
        actor: system
        preconditions:
          - "rejections >= 2"
          - "rejections >= approvals"
        side_effects:
          - "Rating moves COMMITTEE_REVIEW → PROVISIONAL"
      - from: OPEN
        to: WITHDRAWN
        trigger: "POST /research/proposals/{id}/withdraw"
        actor: Analyst
        preconditions:
          - "X-User-ID == proposed_by"
          - "proposal_status == OPEN"
        side_effects:
          - "Rating moves COMMITTEE_REVIEW → PROVISIONAL"

  - entity: Methodology
    field: methodology_status
    initial_state: DRAFT
    terminal_states: [RETIRED]
    transitions:
      - from: DRAFT
        to: EFFECTIVE
        trigger: "POST /research/methodologies/{id}/activate"
        actor: ResearchOps
        preconditions:
          - "No other Methodology with the same methodology_code has methodology_status == EFFECTIVE with an overlapping [effective_from, effective_to) window"
        side_effects:
          - "Any same-code Methodology in EFFECTIVE whose window this one abuts or overlaps per the non-overlap rule moves to SUPERSEDED with effective_to clipped to this row's effective_from"
      - from: EFFECTIVE
        to: SUPERSEDED
        trigger: "system (a newer same-code Methodology activates with effective_from <= this row's effective_to)"
        actor: system
        preconditions: []
        side_effects:
          - "effective_to set to successor's effective_from"
      - from: EFFECTIVE
        to: RETIRED
        trigger: "POST /research/methodologies/{id}/retire"
        actor: ResearchOps
        preconditions:
          - "methodology_status == EFFECTIVE"
          - "No IndexDefinition in LIVE status references this methodology"
        side_effects: []
      - from: DRAFT
        to: RETIRED
        trigger: "POST /research/methodologies/{id}/retire"
        actor: ResearchOps
        preconditions:
          - "methodology_status == DRAFT"
        side_effects: []

  - entity: MethodologyChange
    field: change_status
    initial_state: PROPOSED
    terminal_states: [EFFECTIVE, WITHDRAWN]
    transitions:
      - from: PROPOSED
        to: APPROVED
        trigger: "POST /research/methodology-changes/{id}/approve"
        actor: ResearchOps
        preconditions:
          - "change_status == PROPOSED"
          - "Methodology.methodology_status == EFFECTIVE"
          - "effective_date >= logical clock date"
        side_effects: []
      - from: APPROVED
        to: EFFECTIVE
        trigger: "POST /research/methodology-changes/{id}/effectuate"
        actor: ResearchOps
        preconditions:
          - "change_status == APPROVED"
          - "client_notice_sent == true"
          - "logical clock date >= effective_date"
        side_effects:
          - "If restatement_required: every PUBLISHED Rating computed under the changed Methodology moves to RESTATED with a successor created; restated_rating_count set to the number restated"
      - from: [PROPOSED, APPROVED]
        to: WITHDRAWN
        trigger: "POST /research/methodology-changes/{id}/withdraw"
        actor: ResearchOps
        preconditions:
          - "change_status in {PROPOSED, APPROVED}"
        side_effects: []

  - entity: Licensee
    field: licensee_status
    initial_state: ACTIVE
    terminal_states: [TERMINATED]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "system (LicenseAudit closed CLOSED_WITH_PENALTY with penalty_cents > 0 and arrears_cents becomes > 0)"
        actor: system
        preconditions: []
        side_effects:
          - "All ACTIVE SeatEntitlement rows under this licensee's agreements move to REVOKED; seats_in_use recomputed to 0 on each agreement"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /research/licensees/{id}/reinstate"
        actor: LicenseAdmin
        preconditions:
          - "licensee_status == SUSPENDED"
          - "arrears_cents == 0"
        side_effects: []
      - from: [ACTIVE, SUSPENDED]
        to: TERMINATED
        trigger: "POST /research/licensees/{id}/terminate"
        actor: LicenseAdmin
        preconditions:
          - "No LicenseAgreement in ACTIVE status under this licensee"
        side_effects:
          - "All DRAFT or SUSPENDED agreements move to TERMINATED"

  - entity: LicenseAgreement
    field: agreement_status
    initial_state: DRAFT
    terminal_states: [TERMINATED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /research/license-agreements/{id}/activate"
        actor: LicenseAdmin
        preconditions:
          - "agreement_status == DRAFT"
          - "Licensee.licensee_status == ACTIVE"
          - "No other LicenseAgreement for the same licensee and same tier has agreement_status == ACTIVE with an overlapping [effective_from, effective_to) window"
        side_effects: []
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /research/license-agreements/{id}/suspend"
        actor: LicenseAdmin
        preconditions:
          - "agreement_status == ACTIVE"
        side_effects:
          - "New seat grants blocked while SUSPENDED"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /research/license-agreements/{id}/activate"
        actor: LicenseAdmin
        preconditions:
          - "agreement_status == SUSPENDED"
          - "Licensee.licensee_status == ACTIVE"
        side_effects: []
      - from: [DRAFT, ACTIVE, SUSPENDED]
        to: TERMINATED
        trigger: "POST /research/license-agreements/{id}/terminate or system (licensee terminated)"
        actor: "LicenseAdmin or system"
        preconditions:
          - "Manual: seats_in_use == 0"
        side_effects:
          - "Any IndexDefinition whose licensed_agreement_id == this agreement and index_status == LIVE moves to SUSPENDED"

  - entity: SeatEntitlement
    field: seat_status
    initial_state: ACTIVE
    terminal_states: [REVOKED]
    transitions:
      - from: ACTIVE
        to: REVOKED
        trigger: "POST /research/seat-entitlements/{id}/revoke or system (licensee suspended)"
        actor: "LicenseAdmin or system"
        preconditions: []
        side_effects:
          - "LicenseAgreement.seats_in_use decremented by 1"

  - entity: LicenseAudit
    field: audit_status
    initial_state: OPEN
    terminal_states: [CLOSED_NO_ACTION, CLOSED_WITH_PENALTY]
    transitions:
      - from: OPEN
        to: FINDINGS_FILED
        trigger: "POST /research/license-audits/{id}/file-findings"
        actor: LicenseAdmin
        preconditions:
          - "audit_status == OPEN"
          - "unlicensed_uses_found >= 0"
        side_effects: []
      - from: FINDINGS_FILED
        to: CLOSED_WITH_PENALTY
        trigger: "POST /research/license-audits/{id}/close with outcome=PENALTY"
        actor: LicenseAdmin
        preconditions:
          - "audit_status == FINDINGS_FILED"
          - "unlicensed_uses_found > 0"
        side_effects:
          - "penalty_cents computed per audit_penalty calculation"
          - "Licensee.arrears_cents incremented by penalty_cents; if arrears becomes > 0, Licensee moves ACTIVE → SUSPENDED, revoking all seats and zeroing seats_in_use on its agreements"
      - from: FINDINGS_FILED
        to: CLOSED_NO_ACTION
        trigger: "POST /research/license-audits/{id}/close with outcome=NO_ACTION"
        actor: LicenseAdmin
        preconditions:
          - "audit_status == FINDINGS_FILED"
        side_effects: []

  - entity: DataDispute
    field: dispute_status
    initial_state: OPEN
    terminal_states: [RESOLVED_ACCEPTED, RESOLVED_REJECTED]
    transitions:
      - from: OPEN
        to: UNDER_INVESTIGATION
        trigger: "POST /research/data-disputes/{id}/investigate"
        actor: ResearchOps
        preconditions:
          - "dispute_status == OPEN"
        side_effects:
          - "FundCompany.open_dispute_count incremented by 1"
          - "The disputed fund's PROVISIONAL and COMMITTEE_REVIEW ratings gain suppression_reason DISPUTE_HOLD"
      - from: UNDER_INVESTIGATION
        to: RESOLVED_ACCEPTED
        trigger: "POST /research/data-disputes/{id}/resolve with outcome=ACCEPTED"
        actor: ResearchOps
        preconditions:
          - "dispute_status == UNDER_INVESTIGATION"
        side_effects:
          - "FundCompany.open_dispute_count decremented by 1"
          - "If disputed_field is a numeric field: Fund field updated to corrected_value; every PUBLISHED rating on the fund moves to RESTATED with successor created"
          - "If disputed_field == CATEGORY: fund category recomputed by category_assignment calculation with category_assignment_revision incremented"
          - "DISPUTE_HOLD suppression cleared from the fund's ratings whose suppression_reason == DISPUTE_HOLD (unless another OPEN/UNDER_INVESTIGATION dispute on the same fund remains)"
      - from: UNDER_INVESTIGATION
        to: RESOLVED_REJECTED
        trigger: "POST /research/data-disputes/{id}/resolve with outcome=REJECTED"
        actor: ResearchOps
        preconditions:
          - "dispute_status == UNDER_INVESTIGATION"
        side_effects:
          - "FundCompany.open_dispute_count decremented by 1"
          - "DISPUTE_HOLD suppression cleared per the same remaining-dispute rule"

  - entity: IndexDefinition
    field: index_status
    initial_state: DRAFT
    terminal_states: [RETIRED]
    transitions:
      - from: DRAFT
        to: LIVE
        trigger: "POST /research/indices/{id}/launch"
        actor: LicenseAdmin
        preconditions:
          - "index_status == DRAFT"
          - "licensed_agreement_id references a LicenseAgreement with agreement_status == ACTIVE and tier == DERIVED_WORKS"
          - "Methodology referenced has methodology_status == EFFECTIVE"
          - "Constituent count (IndexConstituent rows) >= 1 and <= max_constituents"
        side_effects:
          - "index_rebalance calculation runs; final_weight_bp set on every constituent"
      - from: LIVE
        to: SUSPENDED
        trigger: "POST /research/indices/{id}/suspend or system (licensing agreement terminated)"
        actor: "LicenseAdmin or system"
        preconditions: []
        side_effects: []
      - from: SUSPENDED
        to: LIVE
        trigger: "POST /research/indices/{id}/launch"
        actor: LicenseAdmin
        preconditions:
          - "index_status == SUSPENDED"
          - "Same licensing and methodology preconditions as DRAFT → LIVE"
        side_effects:
          - "index_rebalance calculation runs"
      - from: [DRAFT, LIVE, SUSPENDED]
        to: RETIRED
        trigger: "POST /research/indices/{id}/retire"
        actor: LicenseAdmin
        preconditions:
          - "index_status != LIVE (LIVE indices must be suspended first)"
        side_effects: []

  - entity: ConflictFlag
    field: flag_status
    initial_state: OPEN
    terminal_states: [WAIVED, RESOLVED]
    transitions:
      - from: OPEN
        to: WAIVED
        trigger: "POST /research/conflict-flags/{id}/waive"
        actor: ComplianceOfficer
        preconditions:
          - "flag_status == OPEN"
        side_effects:
          - "blocking recomputed false; rating publication unblocked unless another OPEN COMMERCIAL_RATING_CONFLICT flag remains on the fund"
      - from: OPEN
        to: RESOLVED
        trigger: "system (FundCompany.commercial_relationship changed to NONE)"
        actor: system
        preconditions: []
        side_effects: []

# =============================================================================
# §1.2.1 Concurrency Rules (OCC only)
# =============================================================================
concurrency_rules:
  - rule_id: seat-grant-stale-agreement
    parent_entity: LicenseAgreement
    write_endpoint: "POST /research/license-agreements/{agreement_id}/seats"
    occ_field: "expected_agreement_version"
    description: |
      Granting a seat against a LicenseAgreement whose version has advanced
      since the client last observed it is rejected with ERR_STALE_VERSION.
      This captures the case where another grant or revocation just changed
      seats_in_use (and therefore agreement.version), so the client's view of
      remaining capacity is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: methodology-change-stale-methodology
    parent_entity: Methodology
    write_endpoint: "POST /research/methodologies/{methodology_id}/changes"
    occ_field: "expected_methodology_version"
    description: |
      Proposing a MethodologyChange against a Methodology whose version has
      advanced since the client last observed it is rejected with
      ERR_STALE_VERSION. This captures the case where a competing change was
      just proposed or the methodology was re-activated, leaving the client's
      baseline stale.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: dispute-resolve-stale-dispute
    parent_entity: DataDispute
    write_endpoint: "POST /research/data-disputes/{dispute_id}/resolve"
    occ_field: "expected_dispute_version"
    description: |
      Resolving a DataDispute whose version has advanced since the client
      last observed it (e.g., an investigate transition already applied by
      another operator's read-modify-write chain) is rejected with
      ERR_STALE_VERSION.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: quantitative_star_rating
    trigger: "POST /research/ratings/compute (QUANTITATIVE kind), and restatement cascades"
    algorithm: weighted_scoring
    formula: |
      inputs: Fund.trailing_return_3y_bp (R3), Fund.trailing_return_5y_bp (R5),
              Fund.risk_score_bp (K), Methodology.weight_return_bp (WR),
              Methodology.weight_risk_bp (WK, WR+WK==10000),
              Methodology.rating_ceilings [c1,c2,c3,c4] ascending.
      return_leg = (R3 * 6000 + R5 * 4000) / 10000   # integer floor division; if R5 is null, return_leg = R3
      score_bp = (return_leg * WR + (10000 - K) * WK) / 10000   # integer floor division
      stars = 5 if score_bp >= c1 else 4 if score_bp >= c2 else 3 if score_bp >= c3 else 2 if score_bp >= c4 else 1
    input_set: "Funds with fund_status == ACTIVE that have at least one Holding snapshot ingested"
    constants:
      THREE_YEAR_WEIGHT_BP: 6000
      FIVE_YEAR_WEIGHT_BP: 4000
    precision: "integer basis points; floor division; no rounding"
    variants:
      - name: provisional
        when: "Computed at ingestion time before the as-of window is locked"
        difference: "return_leg uses R3 alone (five-year leg ignored even when present), so provisional_stars may differ from the final stars for identical fund rows"
      - name: final
        when: "Computed via POST /research/ratings/compute or restatement"
        difference: "Uses the blended 6000/4000 return_leg; result stored in stars"

  - name: category_assignment
    trigger: "POST /research/funds/{id}/holdings ingestion completing, POST /research/funds/{id}/assign-category, or DataDispute RESOLVED_ACCEPTED with disputed_field == CATEGORY"
    algorithm: weighted_scoring
    formula: |
      snapshot = the Holding set for the fund with the LATEST as_of_date
        (ties broken by lexicographically smaller security_ticker first — but
        note: an equal-weight tie across categories is broken by
        Category.category_code ASC, never by id).
      For each active Category c:
        asset_bp[c] = sum of weight_bp of holdings whose asset_class matches
                      c.dominant_asset_class (MIXED category counts EQUITY+BOND)
        sector_bp[c] = sum of weight_bp of holdings whose sector matches
                      c.dominant_sector (MIXED sector matches all)
        eligible[c] = asset_bp[c] >= c.min_weight_bp
        score[c] = asset_bp[c] * 7000 + sector_bp[c] * 3000   # integer
      winner = eligible category with max score; tie-break category_code ASC.
      If no category is eligible -> ERR_NO_ELIGIBLE_CATEGORY.
    input_set: "Categories with active == true; holdings from the latest snapshot only"
    precision: "integer basis points"
    variants:
      - name: strict
        when: "Default assignment"
        difference: "Requires eligible[c]; fails with ERR_NO_ELIGIBLE_CATEGORY when none qualifies"

  - name: license_fee_quote
    trigger: "POST /research/license-agreements fee preview and seat overage at audit close"
    algorithm: tiered_pricing
    formula: |
      seat_fee_cents = per-seat rate by tier:
        DISPLAY: 120000; REDISTRIBUTION: 250000; DERIVED_WORKS: 500000
      volume_discount_bp applied to the SEAT component only, by seat_limit:
        1-10 seats: 0; 11-50: 1000; 51-200: 2000; >200: 3000
      derived_surcharge_bp = 2500 on (base_fee_cents + discounted seat component)
        when tier == DERIVED_WORKS; else 0.
      Evaluation order (pinned, circular-looking dependency resolved):
        1. seat_component_raw = seat_fee_cents * seat_limit
        2. seat_component = seat_component_raw - (seat_component_raw * volume_discount_bp)/10000
        3. pre_surcharge = base_fee_cents + seat_component
        4. total_fee_cents = pre_surcharge + (pre_surcharge * derived_surcharge_bp)/10000
      All divisions floor to the cent at each numbered step (round per-step then
      sum — NOT sum-then-round).
    constants:
      SEAT_FEE_DISPLAY_CENTS: 120000
      SEAT_FEE_REDIS_CENTS: 250000
      SEAT_FEE_DERIVED_CENTS: 500000
      SURCHARGE_DERIVED_BP: 2500
    precision: "integer cents; floor at each numbered step"

  - name: audit_penalty
    trigger: "LicenseAudit close with outcome=PENALTY"
    algorithm: threshold
    formula: |
      per_use_cents by agreement tier: DISPLAY 50000, REDISTRIBUTION 150000,
        DERIVED_WORKS 400000.
      raw_penalty = per_use_cents * unlicensed_uses_found
      repeat_offender_bp = 5000 if the licensee has any prior audit
        CLOSED_WITH_PENALTY; else 0.
      penalty_cents = raw_penalty + (raw_penalty * repeat_offender_bp)/10000
      penalty_cents is floored at 100000 (minimum penalty floor applies AFTER
        the repeat multiplier).
    constants:
      REPEAT_OFFENDER_BP: 5000
      MIN_PENALTY_CENTS: 100000
    precision: "integer cents; floor division"
    variants:
      - name: standard
        when: "Licensee has no prior audit closed CLOSED_WITH_PENALTY"
        difference: "repeat_offender_bp = 0; penalty = max(raw, 100000)"
      - name: repeat_offender
        when: "Licensee has at least one prior audit closed CLOSED_WITH_PENALTY on ANY of its agreements"
        difference: "repeat_offender_bp = 5000 applied to raw BEFORE the minimum floor; produces a strictly larger penalty than the standard variant for identical unlicensed_uses_found whenever raw_penalty >= 100000"

  - name: index_rebalance
    trigger: "IndexDefinition DRAFT→LIVE or SUSPENDED→LIVE, and POST /research/indices/{id}/rebalance"
    algorithm: waterfall_allocation
    formula: |
      Let C = constituents sorted by target_weight_bp DESC, tie-break by
        Fund.ticker ASC (never by id).
      Pass 1 (cap): for each constituent in order,
        final = min(target_weight_bp, single_constituent_cap_bp);
        excess += target - final.
      Pass 2 (redistribute): while excess > 0, walk C in the SAME order and add
        to each constituent d = min(excess, cap - final_current); when a full
        pass adds 0 to every constituent, stop (remaining excess is discarded —
        total final weight may be < 10000 bp; this is by design and is NOT an
        error).
    input_set: "All IndexConstituent rows of the index"
    precision: "integer basis points"

  - name: data_quality_score
    trigger: "GET /research/fund-companies/{id} computed field quality_score_bp"
    algorithm: decay_function
    formula: |
      quality_score_bp = 10000
        - 1500 * (count of DataDispute rows RESOLVED_ACCEPTED for the company's
          funds in the trailing 365 logical days)
        - 500 * open_dispute_count
      Floored at 0.
    constants:
      ACCEPTED_DISPUTE_HIT_BP: 1500
      OPEN_DISPUTE_HIT_BP: 500
    precision: "integer basis points"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and role is a declared role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "Role permitted for the endpoint per RBAC matrix"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "Path ids exist, validated left-to-right (parent before child)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"
  - priority: 4
    category: existence
    check: "Request-body FK references exist (fund_company_id, methodology_id, licensed_agreement_id, etc.)"
    error_id: ERR_REFERENCE_NOT_FOUND
    http_status: 422
    applies_to: "creation endpoints with body FKs"
  - priority: 5
    category: state
    check: "Target resource in a legal source state for the transition"
    error_id: ERR_INVALID_STATE_TRANSITION
    http_status: 409
    applies_to: "all state-transition endpoints"
  - priority: 6
    category: business_safety
    check: "Conflict-of-interest gate: rating publish/approval blocked while an OPEN COMMERCIAL_RATING_CONFLICT flag exists on the fund; analyst proposal blocked when proposed_by covers a fund whose issuer has commercial_relationship != NONE unless flag WAIVED"
    error_id: ERR_CONFLICT_OF_INTEREST
    http_status: 422
    applies_to: "POST /research/ratings/{id}/publish, POST /research/proposals, POST /research/proposals/{id}/votes"
  - priority: 7
    category: business_safety
    check: "Segregation of duties: proposed_by may not cast a CommitteeVote on their own proposal; a voter may not vote twice on the same proposal"
    error_id: ERR_SOD_VIOLATION
    http_status: 422
    applies_to: "POST /research/proposals/{id}/votes"
  - priority: 8
    category: business_constraint
    check: "Uniqueness: Fund.ticker unique; Methodology (methodology_code, version_number) unique; SeatEntitlement (agreement_id, workstation_user_id) unique among seat_status == ACTIVE; IndexDefinition.index_code unique; Category.category_code unique"
    error_id: ERR_UNIQUENESS_VIOLATION
    http_status: 409
    applies_to: "creation endpoints"
  - priority: 9
    category: business_temporal
    check: "Temporal overlap: same-code EFFECTIVE Methodology windows [effective_from, effective_to) must not overlap (abutting allowed: effective_to == other's effective_from is legal); same-tier ACTIVE agreements per licensee must not overlap; effective_to must be > effective_from when non-null"
    error_id: ERR_TEMPORAL_OVERLAP
    http_status: 422
    applies_to: "POST /research/methodologies/{id}/activate, POST /research/license-agreements, POST /research/license-agreements/{id}/activate"
  - priority: 10
    category: business_referential
    check: "Holdings snapshot integrity: weights sum to exactly 10000 bp per (fund_id, as_of_date); as_of_date not in the future; a snapshot date may be ingested only once per fund"
    error_id: ERR_SNAPSHOT_INVALID
    http_status: 422
    applies_to: "POST /research/funds/{id}/holdings"
  - priority: 11
    category: business_fiscal
    check: "Seat quota: granting a seat requires seats_in_use < seat_limit; agreement must be ACTIVE; licensee must be ACTIVE"
    error_id: ERR_SEAT_LIMIT_REACHED
    http_status: 422
    applies_to: "POST /research/license-agreements/{id}/seats"
  - priority: 12
    category: business_fiscal
    check: "Licensee must be ACTIVE and agreement ACTIVE for derived-works index launch; licensed tier must be DERIVED_WORKS"
    error_id: ERR_LICENSE_TIER_INSUFFICIENT
    http_status: 422
    applies_to: "POST /research/indices/{id}/launch, POST /research/indices/{id}/link-license"
  - priority: 13
    category: business_constraint
    check: "Dispute raiser must be the fund's issuer (raised_by_company_id == Fund.fund_company_id); corrected_value required for numeric disputed_field"
    error_id: ERR_DISPUTE_NOT_ISSUER
    http_status: 422
    applies_to: "POST /research/funds/{id}/disputes"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Test-driving / platform ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the logical clock. Server default before any call is 2026-09-01T00:00:00Z and MUST NOT fall back to wall-clock time."
    roles: [ResearchOps]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["Logical clock advanced; date-dependent rules evaluate against the new value on next operation"]

  # --- Fund companies ---
  - method: POST
    path: "/research/fund-companies"
    description: "Register a fund company"
    roles: [ResearchOps]
    code: 201
    input: [legal_name, "commercial_relationship?"]
    output: FundCompany
    side_effects: ["company_status=ACTIVE, open_dispute_count=0"]
  - method: GET
    path: "/research/fund-companies/{id}"
    description: "Get fund company including computed quality_score_bp"
    roles: [ResearchOps, Analyst, LicenseAdmin, ComplianceOfficer, FundCompanyRep]
    code: 200
    input: []
    output: FundCompany
    side_effects: ["data_quality_score computed on read"]
  - method: GET
    path: "/research/fund-companies"
    description: "List fund companies"
    roles: [ResearchOps, Analyst, LicenseAdmin, ComplianceOfficer]
    code: 200
    input: ["company_status?", "limit?", "offset?"]
    output: "FundCompany[]"
    side_effects: []
  - method: GET
    path: "/research/fund-companies/{id}/funds"
    description: "List funds issued by the company"
    roles: [ResearchOps, Analyst, LicenseAdmin, ComplianceOfficer, FundCompanyRep]
    code: 200
    input: ["limit?", "offset?"]
    output: "Fund[]"
    side_effects: []
  - method: GET
    path: "/research/fund-companies/{id}/disputes"
    description: "List disputes raised against the company's funds"
    roles: [ResearchOps, Analyst, ComplianceOfficer, FundCompanyRep]
    code: 200
    input: ["limit?", "offset?"]
    output: "DataDispute[]"
    side_effects: []
  - method: POST
    path: "/research/fund-companies/{id}/suspend"
    description: "Suspend a fund company; cascades to funds and ratings"
    roles: [ResearchOps]
    code: 200
    input: []
    output: FundCompany
    side_effects: ["FundCompany ACTIVE→SUSPENDED cascade per §1.2", "increments FundCompany.version by 1"]
  - method: POST
    path: "/research/fund-companies/{id}/reinstate"
    description: "Reinstate a suspended fund company (requires zero open disputes)"
    roles: [ResearchOps]
    code: 200
    input: []
    output: FundCompany
    side_effects: ["FundCompany SUSPENDED→ACTIVE", "increments FundCompany.version by 1"]
  - method: POST
    path: "/research/fund-companies/{id}/offboard"
    description: "Offboard a fund company (terminal)"
    roles: [ResearchOps]
    code: 200
    input: []
    output: FundCompany
    side_effects: ["FundCompany → OFFBOARDED", "increments FundCompany.version by 1"]

  # --- Funds & holdings ---
  - method: POST
    path: "/research/funds"
    description: "Register a fund"
    roles: [ResearchOps]
    code: 201
    input: [fund_company_id, ticker, inception_date, trailing_return_3y_bp, "trailing_return_5y_bp?", risk_score_bp]
    output: Fund
    side_effects: ["fund_status=ACTIVE, category_id=null, category_assignment_revision=0"]
  - method: GET
    path: "/research/funds/{id}"
    description: "Get fund"
    roles: [ResearchOps, Analyst, LicenseAdmin, ComplianceOfficer, FundCompanyRep]
    code: 200
    input: []
    output: Fund
    side_effects: []
  - method: GET
    path: "/research/funds"
    description: "List funds with filters"
    roles: [ResearchOps, Analyst, LicenseAdmin, ComplianceOfficer, FundCompanyRep]
    code: 200
    input: ["fund_company_id?", "fund_status?", "category_id?", "limit?", "offset?"]
    output: "Fund[]"
    side_effects: []
  - method: POST
    path: "/research/funds/{id}/holdings"
    description: "Ingest a holdings snapshot (array of holding rows sharing one as_of_date)"
    roles: [ResearchOps]
    code: 201
    input: [as_of_date, holdings]
    output: "Holding[]"
    side_effects: ["Snapshot integrity validation (weights sum 10000)", "category_assignment recomputed on a best-effort basis: if no category is eligible the snapshot is still persisted and Fund.category_id stays null (assignment failure is reported only by POST /research/funds/{id}/assign-category)", "Fund.category_id updated and category_assignment_revision incremented on change", "increments Fund.version by 1 when category changes"]
  - method: GET
    path: "/research/funds/{id}/holdings"
    description: "List holdings snapshots for a fund (optionally by as_of_date)"
    roles: [ResearchOps, Analyst, ComplianceOfficer, FundCompanyRep]
    code: 200
    input: ["as_of_date?", "limit?", "offset?"]
    output: "Holding[]"
    side_effects: []
  - method: POST
    path: "/research/funds/{id}/assign-category"
    description: "Re-run category assignment from latest snapshot"
    roles: [ResearchOps]
    code: 200
    input: []
    output: Fund
    side_effects: ["category_assignment calculation; category_assignment_revision incremented on change", "increments Fund.version by 1 on change"]
  - method: POST
    path: "/research/funds/{id}/liquidate"
    description: "Liquidate a fund (terminal); withdraws its ratings and strips it from indices"
    roles: [ResearchOps]
    code: 200
    input: []
    output: Fund
    side_effects: ["Fund ACTIVE→LIQUIDATED cascade per §1.2", "increments Fund.version by 1"]
  - method: GET
    path: "/research/funds/{id}/ratings"
    description: "List ratings for a fund"
    roles: [ResearchOps, Analyst, LicenseAdmin, ComplianceOfficer, FundCompanyRep]
    code: 200
    input: ["rating_status?", "limit?", "offset?"]
    output: "Rating[]"
    side_effects: []
  - method: GET
    path: "/research/funds/{id}/disputes"
    description: "List disputes for a fund"
