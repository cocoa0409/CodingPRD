              captures: { it3: $.data.id }
            - call: "POST /chargemaster/charge-items/${it3}/reprice"
              payload: {}
              as: RevenueIntegrityAnalyst
            - call: "POST /chargemaster/charge-items/${it3}/lifecycle"
              payload: { action: "SUBMIT_FOR_REVIEW" }
              as: RevenueIntegrityAnalyst
              as_user_id: "ria_1"
            - call: "POST /chargemaster/charge-items/${it3}/lifecycle"
