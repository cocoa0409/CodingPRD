    side_effects: []

  - method: GET
    path: "/preservation/invoices"
    description: "List invoices with filters and pagination"
    roles: [Servicer, VendorAdmin, Dispatcher, FieldCrew, QualityReviewer]
    code: 200
    input: ["property_id?", "work_order_id?", "status?", "limit?", "offset?"]
    output: Invoice[]
