              payload: { delta_on_hand: 1, expected_inventory_version: "${inv_v2} - 1" }
              as: StoreManager
              captures: { err: $.data.error_id }
          assert:
            - "response 412 with error_id == ERR_STALE_INVENTORY_VERSION (expected version one behind current)"

