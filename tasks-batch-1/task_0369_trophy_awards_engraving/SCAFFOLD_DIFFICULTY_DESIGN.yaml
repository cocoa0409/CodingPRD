            - call: "POST /orders"
              payload: { customer_id: "${cust_id}", service_level: "RUSH", due_date: "2026-06-16T00:00:00Z" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { order_id: $.data.id }
            - call: "POST /orders/${order_id}/lines"
              payload: { catalog_product_id: "${prod_id}", quantity: 1 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { line_id: $.data.id }
          trigger:
            - call: "POST /orders/${order_id}/price"
              payload: {}
              as: ShopStaff
              captures: { err: $.data.error_id }
          assert:
            - "trigger response error_id == ERR_DUE_DATE_INFEASIBLE (422)"
            - "Order.${order_id}.production_status == DRAFT"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      # ---- conserved quantity 1: component physical+allocated conservation on cancel release ----
      - name: cancel_release_conserves_on_hand_qty
        grounds:
          - state_machines.Order.DRAFT_to_CANCELLED
          - state_machines.ComponentAllocation.RESERVED_to_RELEASED
          - calculations.component_available
        distinguishing_aspect: |
          Conserved quantity = Component.on_hand_qty (physical stock). Forward confirm RESERVES then compensating
          cancel RELEASES; on_hand_qty is invariant: on_hand_qty == 7 both before confirm and after cancel, while
          available_qty returns to 7 (allocated back to 0). Pinned: on_hand_qty unchanged by the reserve/release pair.
        test_recipe:
          setup:
            - "Component on_hand 7. Confirm reserves 2 (available 5), then cancel releases (available back to 7)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T00:00:00Z" }
              as: Anonymous
            - call: "POST /rush-policies"
              payload: { name: "std", expedited_surcharge_pct: 0.25, rush_surcharge_pct: 0.50, rush_min_business_days: 1, active: true }
              as: ShopManager
            - call: "POST /components"
              payload: { code: "BASE-17", name: "Base", on_hand_qty: 7, reorder_point: 0 }
              as: ShopManager
              captures: { comp_id: $.data.id }
            - call: "POST /catalog-products"
              payload: { sku: "ASA-17", name: "Plaque", product_type: "PLAQUE", base_price_cents: 1000, engraving_price_per_char_cents: 0, logo_setup_fee_cents: 0, standard_lead_days: 3, bom: [{ component_id: "${comp_id}", qty_per_unit: 1 }] }
              as: ShopManager
              captures: { prod_id: $.data.id }
            - call: "POST /customers"
              payload: { email: "c17@x.com", full_name: "C Seventeen" }
              as: Anonymous
              captures: { cust_id: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}", service_level: "STANDARD", due_date: "2026-07-15T00:00:00Z" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { order_id: $.data.id }
            - call: "POST /orders/${order_id}/lines"
              payload: { catalog_product_id: "${prod_id}", quantity: 2 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { line_id: $.data.id }
            - call: "POST /order-lines/${line_id}/proofs"
              payload: { proof_kind: "TEXT", content_ref: "X" }
              as: ShopStaff
              captures: { proof_id: $.data.id }
            - call: "POST /order-lines/${line_id}/proofs/${proof_id}/send"
              payload: {}
              as: ShopStaff
            - call: "POST /order-lines/${line_id}/proofs/${proof_id}/approve"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /orders/${order_id}/price"
              payload: {}
              as: ShopStaff
              captures: { ord_v: $.data.version }
            - call: "POST /orders/${order_id}/confirm"
              payload: { expected_order_version: "${ord_v}" }
              as: Customer
              as_user_id: "${cust_id}"
          trigger:
            - call: "POST /orders/${order_id}/cancel"
              payload: {}
              as: ShopManager
          assert:
            - "Order.${order_id}.production_status == CANCELLED"
            - "ComponentAllocation for line ${line_id} alloc_status == RELEASED"
            - "Component.${comp_id}.on_hand_qty == 7"
            - "Component.${comp_id}.allocated_qty == 0"
            - "Component.${comp_id}.available_qty == 7"

      # ---- conserved quantity 2: promo uses_count conservation on cancel un-redeem ----
      - name: cancel_unredeem_conserves_promo_uses_count
        grounds:
          - state_machines.Order.DRAFT_to_CANCELLED
