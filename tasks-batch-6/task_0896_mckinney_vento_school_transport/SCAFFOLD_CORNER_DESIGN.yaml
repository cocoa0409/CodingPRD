        grounds: ["entities.Student.fields.living_situation", "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "POST /mv/students with living_situation='MANSION' (not in the enum) returns 422 ERR_VALIDATION."
        test_recipe:
