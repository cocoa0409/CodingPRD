          A NARROW pair 30 bands apart (business_safety 70 against business_referential
          100) resolved by swapping only the X-User-ID header rather than by changing any
          entity state: the same decision payload returns 403
          ERR_SOD_EXCEPTION_APPROVER when the acting user equals the unit's
          funded_by_user_id and 409 ERR_UNIT_HAS_OPEN_SOT when it does not, and the
