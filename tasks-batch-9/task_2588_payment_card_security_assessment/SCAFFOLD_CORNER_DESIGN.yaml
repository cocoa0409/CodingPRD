      - name: calc_ccw_rigor_score_precision_and_thin_control_cap
        claim_type: Precision
        grounds:
          - calculations.ccw_rigor_score
          - entities.CompensatingControlWorksheet.fields.rigor_score
        excluded_because:
          difficulty_instance: ccw_rigor_weighted_score_with_thin_control_cap
          rationale: "That §1.8 instance already pins control_depth_points, monitoring_factor, risk_offset_points and the two-decimal rigor_score as literals for both an uncapped and a thin-control worksheet, including the post-sum ordering of the cap."

      - name: calc_ccw_acceptance_at_the_seventy_point_boundary
        claim_type: threshold
        grounds:
          - calculations.ccw_rigor_score
          - validations[priority=13]
        excluded_because:
          difficulty_instance: ccw_rigor_score_inclusive_seventy_boundary
          rationale: "The boundary instance tests rigor_score exactly 70.00 (accepted) against 66.25 (refused with ERR_CCW_RIGOR_INSUFFICIENT), which is the threshold row for this calculation."

      - name: calc_sampling_variant_divergence_between_preliminary_and_final
        claim_type: Variant Divergence
        grounds:
          - calculations.component_sample_allocation
          - entities.SystemComponent.fields.declared_scope_class
        excluded_because:
          difficulty_instance: sampling_plan_preliminary_vs_final_scope_divergence
          rationale: "That instance runs both variants over the same component population after a segmentation verdict has moved scope_class away from declared_scope_class, and asserts the differing sample sizes, coverage ratios and fees."

      - name: calc_sampling_variant_switch_reprices_the_engagement
        claim_type: Reconciliation
        grounds:
          - calculations.assessment_fee_total
          - entities.SamplingPlan.fields.status
        excluded_because:
          difficulty_instance: sampling_plan_preliminary_vs_final_scope_divergence
          rationale: "The same instance covers the switch: the PRELIMINARY plan moves to SUPERSEDED, the FINAL plan becomes ACTIVE, and estimated_hours plus assessment_fee_total are asserted as literals on both sides of the switch."

      - name: calc_compliance_variant_selected_per_surface
        claim_type: Variant Selection
        grounds:
          - calculations.compliance_projection
          - entities.RocReport.fields.compliance_result
        excluded_because:
          difficulty_instance: compliance_projection_as_found_versus_as_attested
          rationale: "That instance shows the same requirement population producing two different percentages and verifies that compliance_result keys on AS_ATTESTED alone, which is exactly the variant-selection claim."

      - name: calc_empty_eligible_population_boundary
        claim_type: aggregation
        grounds:
          - calculations.component_sample_allocation
          - validations[priority=13]
        excluded_because:
          difficulty_instance: empty_eligible_population_zero_versus_one_boundary
          rationale: "The zero-versus-one boundary instance covers the empty-population arm (ERR_EMPTY_SAMPLE_POPULATION) and the single-row arm where MIN_PER_STRATUM is capped by the population."

  # ---------------------------------------------------------------------------
  # Section 4 — Validations (Table 5 claim types + validation-pattern rows)
  # ---------------------------------------------------------------------------
  - section: validations
    instances:

      - name: validation_segment_name_uniqueness_is_scoped_to_the_engagement
        claim_type: Violation → Error
        grounds:
          - validations[priority=13]
          - errors[ERR_DUPLICATE_SEGMENT_NAME]
          - entities.NetworkSegment.fields.name
        distinguishing_aspect: "Uniqueness is per engagement, not global: re-using 'CDE-CORE' inside the same engagement answers 422 ERR_DUPLICATE_SEGMENT_NAME, while the identical name under a second engagement is accepted. An implementation with a global unique index fails the second half."
        test_recipe:
          setup:
            - "Two engagements exist with different leads and non-overlapping fieldwork windows: E1 ('Northwind Retail Inc', 2026-08-10 to 2026-08-28) and E2 ('Harbor Fuel Stops LLC', 2026-10-04 to 2026-10-20)."
            - "E1 already holds a segment named 'CDE-CORE'."
          setup_api_calls:
            - call: "POST /assessors"
              payload: { full_name: "Dana Reyes", email: "dana.reyes@qsa.example", certification_expires_at: "2027-06-30T00:00:00Z", qa_qualified: false }
              as: PlatformAdmin
              captures: { lead_1_id: $.data.id }
            - call: "POST /assessors"
              payload: { full_name: "Owen Marsh", email: "owen.marsh@qsa.example", certification_expires_at: "2027-06-30T00:00:00Z", qa_qualified: false }
              as: PlatformAdmin
              captures: { lead_2_id: $.data.id }
            - call: "POST /assessors"
              payload: { full_name: "Kim Vance", email: "kim.vance@qsa.example", certification_expires_at: "2027-06-30T00:00:00Z", qa_qualified: true }
              as: PlatformAdmin
              captures: { qa_id: $.data.id }
            - call: "POST /engagements"
              payload: { client_legal_name: "Northwind Retail Inc", merchant_level: "L1", assessment_year: 2026, acquirer_name: "First Coast Bank", fieldwork_start_date: "2026-08-10", fieldwork_end_date: "2026-08-28", approved_budget_amount: 200000.00, lead_assessor_id: "${lead_1_id}", qa_reviewer_id: "${qa_id}" }
              as: LeadAssessor
              as_user_id: "${lead_1_id}"
              captures: { eng_1_id: $.data.id }
            - call: "POST /engagements"
              payload: { client_legal_name: "Harbor Fuel Stops LLC", merchant_level: "L1", assessment_year: 2026, acquirer_name: "Second Harbor Bank", fieldwork_start_date: "2026-10-04", fieldwork_end_date: "2026-10-20", approved_budget_amount: 200000.00, lead_assessor_id: "${lead_2_id}", qa_reviewer_id: "${qa_id}" }
              as: LeadAssessor
              as_user_id: "${lead_2_id}"
              captures: { eng_2_id: $.data.id }
            - call: "POST /engagements/${eng_1_id}/network-segments"
              payload: { name: "CDE-CORE", segment_class: "CDE" }
              as: LeadAssessor
              as_user_id: "${lead_1_id}"
              captures: { seg_1_id: $.data.id }
          trigger:
            - call: "POST /engagements/${eng_1_id}/network-segments"
              payload: { name: "CDE-CORE", segment_class: "CONNECTED" }
              as: LeadAssessor
              as_user_id: "${lead_1_id}"
              captures: { err_dup_segment: $.data.error_id }
            - call: "POST /engagements/${eng_2_id}/network-segments"
              payload: { name: "CDE-CORE", segment_class: "CDE" }
              as: LeadAssessor
              as_user_id: "${lead_2_id}"
              captures: { seg_2_id: $.data.id }
          assert:
            - "The first call returns HTTP 422 with ${err_dup_segment} == ERR_DUPLICATE_SEGMENT_NAME"
            - "GET /network-segments?engagement_id=${eng_1_id} returns total_count 1 and NetworkSegment.${seg_1_id}.segment_class is still CDE"
            - "The second call returns HTTP 201; NetworkSegment.${seg_2_id}.engagement_id == ${eng_2_id} and name == 'CDE-CORE'"
            - "GET /network-segments?engagement_id=${eng_2_id} returns total_count 1"
            - "Engagement.${eng_1_id}.unvalidated_segment_count == 1 and Engagement.${eng_2_id}.unvalidated_segment_count == 1"

      - name: validation_facility_name_may_not_carry_two_facility_types
        claim_type: Conditional validation
        grounds:
          - validations[priority=13]
          - errors[ERR_FACILITY_TYPE_CONFLICT]
          - entities.SystemComponent.fields.facility_name
        distinguishing_aspect: "The rule binds a facility_name to one facility_type for the whole engagement, so a second component at 'DC-EAST' declared OFFICE is refused with 422 ERR_FACILITY_TYPE_CONFLICT even though its hostname is unique - the conflict is on a non-key attribute pair, which a hostname-only uniqueness check misses. Declaring a different facility_name with type OFFICE is accepted."
        test_recipe:
          setup:
            - "One engagement in SCOPING holds a DECLARED CDE segment with one component 'pay-01' at facility 'DC-EAST' of type DATA_CENTER."
          setup_api_calls:
            - call: "POST /assessors"
              payload: { full_name: "Dana Reyes", email: "dana.reyes@qsa.example", certification_expires_at: "2027-06-30T00:00:00Z", qa_qualified: false }
              as: PlatformAdmin
              captures: { lead_id: $.data.id }
            - call: "POST /assessors"
              payload: { full_name: "Kim Vance", email: "kim.vance@qsa.example", certification_expires_at: "2027-06-30T00:00:00Z", qa_qualified: true }
              as: PlatformAdmin
              captures: { qa_id: $.data.id }
            - call: "POST /engagements"
              payload: { client_legal_name: "Northwind Retail Inc", merchant_level: "L1", assessment_year: 2026, acquirer_name: "First Coast Bank", fieldwork_start_date: "2026-08-10", fieldwork_end_date: "2026-08-28", approved_budget_amount: 200000.00, lead_assessor_id: "${lead_id}", qa_reviewer_id: "${qa_id}" }
              as: LeadAssessor
              as_user_id: "${lead_id}"
              captures: { eng_id: $.data.id }
            - call: "POST /engagements/${eng_id}/network-segments"
              payload: { name: "CDE-CORE", segment_class: "CDE" }
              as: LeadAssessor
              as_user_id: "${lead_id}"
              captures: { seg_cde_id: $.data.id }
            - call: "POST /engagements/${eng_id}/system-components"
              payload: { hostname: "pay-01", component_type: "APPLICATION", function_class: "PAYMENT_APPLICATION", stores_chd: true, facility_name: "DC-EAST", facility_type: "DATA_CENTER", segment_id: "${seg_cde_id}" }
              as: LeadAssessor
              as_user_id: "${lead_id}"
          trigger:
            - call: "POST /engagements/${eng_id}/system-components"
              payload: { hostname: "hr-01", component_type: "SERVER", function_class: "CONNECTED_SUPPORT", stores_chd: false, facility_name: "DC-EAST", facility_type: "OFFICE", segment_id: "${seg_cde_id}" }
              as: Assessor
              as_user_id: "${lead_id}"
              captures: { err_facility: $.data.error_id }
            - call: "POST /engagements/${eng_id}/system-components"
              payload: { hostname: "pay-01", component_type: "SERVER", function_class: "CONNECTED_SUPPORT", stores_chd: false, facility_name: "HQ-NORTH", facility_type: "OFFICE", segment_id: "${seg_cde_id}" }
              as: Assessor
              as_user_id: "${lead_id}"
              captures: { err_dup_host: $.data.error_id }
            - call: "POST /engagements/${eng_id}/system-components"
              payload: { hostname: "hr-01", component_type: "SERVER", function_class: "CONNECTED_SUPPORT", stores_chd: false, facility_name: "HQ-NORTH", facility_type: "OFFICE", segment_id: "${seg_cde_id}" }
              as: Assessor
              as_user_id: "${lead_id}"
              captures: { comp_hr_id: $.data.id }
          assert:
            - "The first call returns HTTP 422 with ${err_facility} == ERR_FACILITY_TYPE_CONFLICT"
            - "The second call returns HTTP 422 with ${err_dup_host} == ERR_DUPLICATE_HOSTNAME - a fresh facility does not excuse a reused hostname"
            - "The third call returns HTTP 201; SystemComponent.${comp_hr_id}.facility_name == 'HQ-NORTH' and facility_type == OFFICE"
            - "GET /system-components?engagement_id=${eng_id} returns total_count 2 - exactly one row was added by the three calls"
            - "GET /system-components?engagement_id=${eng_id}&facility_name=DC-EAST returns total_count 1"
            - "Engagement.${eng_id}.cde_component_count == 2 and assessment_fee_total == 43200.00 (no sampling plan exists yet, so the sample sizes are still zero)"

      - name: validation_evidence_shape_depends_on_the_collection_technique
        claim_type: Conditional validation
        grounds:
          - validations[priority=13]
          - errors[ERR_INTERVIEWEE_REQUIRED]
          - errors[ERR_EVIDENCE_TARGET_REQUIRED]
        distinguishing_aspect: "The same endpoint enforces different required fields per evidence_type: INTERVIEW without interviewee_name and interviewee_title answers ERR_INTERVIEWEE_REQUIRED, OBSERVATION without component_id answers ERR_EVIDENCE_TARGET_REQUIRED, and DOCUMENT_REVIEW needs neither - so neither field can be declared globally required at priority 3."
        test_recipe:
          setup:
            - "Engagement 'Northwind Retail Inc' is in FIELDWORK with a VALIDATED CDE segment, three sampled components at DC-EAST, an ACTIVE FINAL plan, and requirement 1.2.1 in IN_TESTING with no evidence yet."
          setup_api_calls:
