              as: PlatformAdmin
              captures: { p1: "$.data.id" }
            - call: "POST /bookings"
              payload: { property_id: "${p1}", external_ref: "OUT-1", guest_name: "Guest Out", checkin_at: "2026-08-05T21:00:00Z", checkout_at: "2026-08-08T16:00:00Z" }
              as: Coordinator
              captures: { b1: "$.data.id", b1_notice0: "$.data.guest_notice_code", b1_late0: "$.data.late_checkout_until_at" }
          trigger:
            - call: "POST /bookings/${b1}/schedule-change"
              payload: { change_type: "LATE_CHECKOUT", new_time_at: "2026-08-08T20:01:00Z" }
              as: Coordinator
              captures: { e1: "$.data.error_id" }
            - call: "GET /bookings/${b1}"
              payload: {}
              as: Coordinator
              captures: { mid_notice: "$.data.guest_notice_code", mid_late: "$.data.late_checkout_until_at" }
            - call: "POST /bookings/${b1}/schedule-change"
              payload: { change_type: "LATE_CHECKOUT", new_time_at: "2026-08-08T20:00:00Z" }
              as: Coordinator
              captures: { ok_late: "$.data.late_checkout_until_at", ok_notice: "$.data.guest_notice_code", ok_status: "$.data.status" }
          assert:
            - "${b1_notice0} == NONE and ${b1_late0} is null on a fresh booking"
            - "${e1} == ERR_SCHEDULE_CHANGE_LIMIT_EXCEEDED (422) - 16:00Z + 241 minutes exceeds the 240-minute ceiling"
            - "${mid_notice} == NONE and ${mid_late} is null - the refused change wrote nothing"
            - "${ok_late} == 2026-08-08T20:00:00Z with HTTP 200 - exactly 240 minutes is inside the inclusive ceiling"
            - "${ok_notice} == LATE_CHECKOUT_GRANTED and ${ok_status} == SCHEDULED"

      - name: corner_val_zero_length_window_is_refused_while_one_minute_survives_with_override
        claim_type: Violation → Error
        grounds:
          - validations[priority=22]
          - validations[priority=23]
          - errors.ERR_CLEANING_WINDOW_NON_POSITIVE
          - calculations.turnover_window_and_requirement
        distinguishing_aspect: |
          window_end_at is checkin_at minus GUEST_ARRIVAL_BUFFER_MINUTES 30, so an incoming stay
          starting exactly 30 minutes after checkout produces window_end_at == window_start_at and
          a window of 0 - refused at priority 22, and NOT rescuable by override_reason, which only
          waives the priority 23 sufficiency check. One extra minute produces a legal 1-minute
          window that IS accepted with an override even though it is 109 minutes short of the
          requirement, proving the two rules guard different things.
        test_recipe:
          setup:
            - "Property P1 'AUS-101' TWO_BR (required_minutes 198) and property P2 'AUS-102' STUDIO with 1 bathroom / 1 bed (required_minutes 110)."
            - "On P1: OUT-1 checks out 2026-08-08T16:00:00Z and IN-1 checks in 2026-08-08T16:30:00Z - exactly the arrival buffer."
            - "On P2: OUT-2 checks out 2026-08-08T16:00:00Z and IN-2 checks in 2026-08-08T16:31:00Z."
