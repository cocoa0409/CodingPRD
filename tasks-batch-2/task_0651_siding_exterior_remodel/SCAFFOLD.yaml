    output: MaterialOrder
    side_effects: ["MaterialOrder -> BACKORDERED", "push delivery_eta_iso"]
  - method: POST
    path: "/material-orders/{id}/deliver"
    description: "Record delivery (clock-gated: current clock must be >= delivery_eta_iso)."
    roles: [ProjectManager]
    code: 200
    input: []
    output: MaterialOrder
    side_effects: ["MaterialOrder -> DELIVERED"]
  - method: POST
    path: "/material-orders/{id}/cancel"
    description: "Cancel a non-delivered material order; cascades schedules to CANCELLED."
    roles: [ProjectManager]
    code: 200
    input: []
    output: MaterialOrder
    side_effects: ["MaterialOrder -> CANCELLED", "cascade PROPOSED/CONFIRMED WorkSchedule -> CANCELLED"]

  # ---- change order ----
  - method: POST
    path: "/change-orders"
    description: "Submit a change order targeting a baseline line item."
    roles: [ProjectManager, HomeownerClient]
    code: 201
    input: [project_id, target_line_item_id, delta_cents, "supersedes_change_order_id?"]
    output: ChangeOrder
    side_effects: ["create ChangeOrder SUBMITTED"]
  - method: GET
    path: "/change-orders/{id}"
    description: "Fetch a ChangeOrder."
    roles: [ProjectManager, FinanceOfficer, HomeownerClient]
    code: 200
    input: []
    output: ChangeOrder
    side_effects: []
  - method: GET
    path: "/change-orders"
    description: "List change orders. Reverse-reachability for ChangeOrder.project_id, ChangeOrder.target_line_item_id, and ChangeOrder.supersedes_change_order_id."
    roles: [ProjectManager, FinanceOfficer, HomeownerClient]
    code: 200
    input: ["project_id?", "target_line_item_id?", "supersedes_change_order_id?", "limit?", "offset?"]
    output: ChangeOrder[]
    side_effects: []
  - method: POST
    path: "/change-orders/{id}/sign"
    description: "Record a sign-off; ProjectManager sets pm_approved, HomeownerClient sets client_approved. Self-loop, no status change."
    roles: [ProjectManager, HomeownerClient]
    code: 200
    input: []
    output: ChangeOrder
    side_effects: ["set pm_approved or client_approved per caller role"]
  - method: POST
    path: "/change-orders/{id}/negotiate"
    description: "Move a submitted change order into NEGOTIATING; resets sign-offs."
    roles: [HomeownerClient]
    code: 200
    input: []
    output: ChangeOrder
    side_effects: ["ChangeOrder -> NEGOTIATING", "reset pm_approved/client_approved"]
  - method: POST
    path: "/change-orders/{id}/revise"
    description: "Propose a revised delta and return to SUBMITTED (closes a negotiation round)."
    roles: [ProjectManager]
    code: 200
    input: [delta_cents]
    output: ChangeOrder
    side_effects: ["ChangeOrder -> SUBMITTED", "update delta_cents"]
  - method: POST
    path: "/change-orders/{id}/approve"
    description: "Approve a dual-signed change order; recomputes contract total, adjusts target line item. OCC-guarded."
    roles: [ProjectManager]
    code: 200
    input: [expected_project_version]
    output: ChangeOrder
    side_effects: ["ChangeOrder -> APPROVED", "recompute Project.contract_total_cents (calc realized_contract_total)", "adjust target EstimateLineItem.extended_cents", "increments Project.version by 1"]
  - method: POST
    path: "/change-orders/{id}/reject"
    description: "Reject a submitted change order."
    roles: [ProjectManager]
    code: 200
    input: []
    output: ChangeOrder
    side_effects: ["ChangeOrder -> REJECTED"]
  - method: POST
    path: "/change-orders/{id}/withdraw"
    description: "Homeowner withdraws a change order."
    roles: [HomeownerClient]
    code: 200
    input: []
    output: ChangeOrder
    side_effects: ["ChangeOrder -> WITHDRAWN"]

  # ---- crew + work schedule ----
  - method: POST
    path: "/crews"
