        claim_type: violation_to_error
        grounds:
          - "validations[priority=3]"
          - "errors[ERR_NOT_RESOURCE_OWNER]"
        distinguishing_aspect: "Entity-backed ownership: consumer C2 reading C1's complaint -> 403 ERR_NOT_RESOURCE_OWNER (role itself is allowed on the endpoint)."
        test_recipe:
          setup: ["C1's complaint exists; C2 registered"]
