  - rule_id: transitive_cascade
    instances:
      - name: accept_fills_opening_rejects_sibling_and_rescinds_offer
        grounds:
          - state_machines.Offer.EXTENDED_to_ACCEPTED
          - state_machines.JobOpening.OPEN_to_FILLED
          - state_machines.Application.OFFER_STAGE_to_REJECTED
          - state_machines.Offer.EXTENDED_to_RESCINDED
        distinguishing_aspect: |
          Depth-4 chain from ONE trigger (Offer A ACCEPT): (1) Placement A created; (2) opening
          positions_filled reaches total -> JobOpening OPEN->FILLED; (3) caused by the FILLED opening,
          sibling Application B OFFER_STAGE->REJECTED (reject_reason OPENING_FILLED); (4) caused by B's
          rejection, Offer B EXTENDED->RESCINDED. Each hop is caused by the prior hop, not by the ACCEPT directly.
        test_recipe:
          setup:
            - "Single-position CARDIOLOGY opening with TWO applications A and B both driven to EXTENDED offers."
            - "Offer A is then ACCEPTED."
