              payload: { carrier_id: "${c1_id}", vehicle_id: "${v1_id}", trip_start_utc: "2026-04-05T06:00:00Z", trip_end_utc: "2026-04-05T18:00:00Z", start_odometer: 700.0, end_odometer: 1000.0, legs: [ { jurisdiction_code: "IL", leg_miles: 300.0 } ] }
              as: MileageAnalyst
              as_user_id: "analyst-1"
              captures: { t_ok_id: $.data.id }
            - call: "POST /apportionment/trip-records"
              payload: { carrier_id: "${c1_id}", vehicle_id: "${v1_id}", trip_start_utc: "2026-05-10T06:00:00Z", trip_end_utc: "2026-05-10T18:00:00Z", start_odometer: 1100.0, end_odometer: 1400.0, legs: [ { jurisdiction_code: "IL", leg_miles: 300.0 } ] }
              as: MileageAnalyst
              as_user_id: "analyst-1"
              captures: { t_gap_id: $.data.id }
          trigger:
            - call: "POST /apportionment/trip-records/${t_ok_id}/review"
              payload: { decision: "ACCEPT" }
              as: TaxPreparer
              as_user_id: "preparer-1"
              captures: { err_review: "$.data.error_id" }
            - call: "POST /apportionment/fuel-tax-returns"
              payload: { carrier_id: "${c1_id}", filing_year: 2026, filing_quarter: 2 }
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { err_open: "$.data.error_id" }
            - call: "POST /apportionment/trip-records/${t_gap_id}/reconstruct"
              payload: { reconstructed_legs: [ { jurisdiction_code: "IL", leg_miles: 400.0 } ], supporting_document_reference: "FUEL-LOG-88" }
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { err_reconstruct: "$.data.error_id" }
          assert:
            - "Preparer reviewing a trip: HTTP 403 and error_id 'ERR_FORBIDDEN_ROLE'; TripRecord.${t_ok_id}.trip_status is still CAPTURED"
            - "Officer opening a return: HTTP 403 and error_id 'ERR_FORBIDDEN_ROLE'; GET /apportionment/fuel-tax-returns?carrier_id=${c1_id} returns total_count == 0"
            - "Officer reconstructing a trip: HTTP 403 and error_id 'ERR_FORBIDDEN_ROLE'; TripRecord.${t_gap_id}.trip_status is still GAP_FLAGGED with mileage_source TELEMATICS"
            - "Carrier.${c1_id}.unsubstantiated_mileage_ratio == 0.5000 — unchanged by the three denials"

      - name: every_role_can_read_the_shared_get_surface
        claim_type: shared_operations
        grounds:
          - roles.CarrierAdmin.shared_operations
          - roles.MileageAnalyst.shared_operations
          - roles.TaxPreparer.shared_operations
          - roles.ComplianceOfficer.shared_operations
        distinguishing_aspect: "All four roles are granted 'all GET endpoints', so the same vehicle read returns 200 for CarrierAdmin, MileageAnalyst, TaxPreparer and ComplianceOfficer alike — read access is not narrowed to the owning carrier even though writes are."
        test_recipe:
          setup:
            - "Two carriers, each with one vehicle, so the CarrierAdmin read crosses its own scope boundary."
          setup_api_calls:
            - call: "POST /apportionment/jurisdictions"
              payload: { jurisdiction_code: "IL", name: "Illinois", fuel_tax_rate_per_gallon: 0.6270 }
              as: ComplianceOfficer
              as_user_id: "officer-1"
