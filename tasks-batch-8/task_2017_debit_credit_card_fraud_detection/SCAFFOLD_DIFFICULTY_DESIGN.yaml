            - { call: "POST /fraudops/rule-sets/${rs}/activate", as: FraudOpsManager, as_user_id: "mgr-1" }
            - { call: "POST /fraudops/auth-transactions", payload: { card_id: "${card}", amount_cents: 200000, merchant_id: "M-TC4", merchant_category_code: "5411", channel: "CNP", origin_country: "US" }, as: NetworkGateway, captures: { t: "$.data.id" } }
