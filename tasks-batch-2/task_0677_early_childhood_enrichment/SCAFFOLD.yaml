scenario: "Early-Childhood Enrichment Classes (The Little Gym/Gymboree style): class by age/developmental stage, recurring membership & makeup credits, capacity & parent-participation ratio, trial class & enrollment fee, birthday-party & open-gym add-on, instructor & room schedule, sibling discount, level advancement"
domain_name: "early-childhood-enrichment"
api_prefix: "/enrichment"

complexity_profile:
  primary_archetype: temporal_windowing
  secondary_archetype: quota_allocation
  complexity_layers:
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
    - optimistic_concurrency
    - derived_field_reconciliation

  entity_topology: flat
  # Peer entities linked by foreign keys: Family, Child, Membership, Program,
  # Room, Instructor, ClassSession, Enrollment, AttendanceRecord, MakeupCredit,
  # FacilityBooking, Invoice. No nested-in-URL ownership tree; cross-references
  # are FKs validated on write and discovered via reverse-reachability GETs.

  state_machine_shape: branching
  # ClassSession: SCHEDULED -> {HELD, CANCELLED} fork with divergent side effects.
  # Membership: cyclic ACTIVE <-> FROZEN revision loop.
  # Enrollment: cyclic ENROLLED <-> WAITLISTED with promotion/demotion.

  relationship_patterns:
    - one_to_many        # Family -> Child, Membership -> MakeupCredit, ClassSession -> Enrollment
    - cross_aggregate    # Enrollment references Child + ClassSession + Membership across aggregates
    - self_referential   # Program.next_program_id chains the level-advancement ladder

  role_model: peer_roles
  # FrontDeskStaff (opaque operator) owns scheduling/enrollment ops;
  # Parent (entity_backed:Family) owns own family/child/membership ops;
  # StudioAdmin (opaque operator) owns programs/rooms/instructors/billing config.

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =====================================================================
# §1.1 Entity-Relationship Table
# =====================================================================
entities:
  - name: Family
    parent: null
    common_fields: true
    fields:
      - name: account_email
        type: string
        source: input
        description: Login/billing email; unique across families.
        constraints: "unique; non-empty"
      - name: primary_contact_name
        type: string
        source: input
        description: Name of the responsible adult on the account.
      - name: child_count
        type: integer
        source: computed
        description: Count of Child rows whose family_id == this Family.id AND Child.status == ENROLLED_ELIGIBLE; drives the sibling-discount tier.
        default: 0

  - name: Child
    parent: null
    common_fields: true
    fields:
      - name: family_id
        type: string
        source: input
        description: "FK -> Family.id; the family this child belongs to."
      - name: full_name
        type: string
        source: input
        description: Child's name.
      - name: birth_date
        type: string
        source: input
        description: ISO 8601 date (YYYY-MM-DD) of birth; used to compute age_months at a session's start instant.
        constraints: "valid date; not in the future relative to logical clock"
      - name: current_level
        type: integer
        source: system
        description: Index of the Program level the child is currently placed at; starts at the level of the first program the child is enrolled into, advances via POST advancement.
        default: 0
      - name: status
        type: enum
        source: system
        description: Child lifecycle for sibling-discount counting.
        default: ENROLLED_ELIGIBLE
        constraints: "one of {ENROLLED_ELIGIBLE, WITHDRAWN}"

  - name: Membership
    parent: null
    common_fields: true
    fields:
      - name: family_id
        type: string
        source: input
        description: "FK -> Family.id; the family this recurring membership bills."
      - name: tier
        type: enum
        source: input
        description: Membership tier governing monthly base fee and monthly makeup-credit grant.
        constraints: "one of {CORE, PLUS, UNLIMITED}"
      - name: status
        type: enum
        source: system
        description: Membership lifecycle; FROZEN suspends billing and blocks new enrollments but preserves credits.
        default: PENDING_PAYMENT
        constraints: "one of {PENDING_PAYMENT, ACTIVE, FROZEN, CANCELLED}"
      - name: cycle_anchor_day
        type: integer
        source: input
        description: Day-of-month (1..28) on which the monthly billing cycle renews.
        constraints: "integer in [1,28]"
      - name: current_cycle_start
        type: string
        source: system
        description: ISO 8601 UTC start instant of the active billing cycle; advanced by the renew operation.
      - name: makeup_credit_balance
        type: integer
        source: computed
        description: Count of MakeupCredit rows for this membership with status == AVAILABLE; reconciled on every credit issue/redeem/expire.
        default: 0
      - name: monthly_base_fee_cents
        type: integer
        source: computed
        description: Base monthly fee in cents resolved from tier at activation; snapshotted so later config changes do not retroactively reprice.
        default: 0

  - name: Program
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: Program/level name (e.g., "Birds", "Beasts").
      - name: level_index
        type: integer
        source: input
        description: Ordinal level rank; higher means more advanced. Unique among programs.
        constraints: "integer >= 0; unique"
      - name: min_age_months
        type: integer
        source: input
        description: Inclusive lower bound on child age in whole months at a session's start instant.
        constraints: "integer >= 0"
      - name: max_age_months
        type: integer
        source: input
        description: Exclusive upper bound on child age in whole months at a session's start instant (half-open band [min, max)).
        constraints: "integer > min_age_months"
      - name: participation_required
        type: boolean
        source: input
        description: Whether each enrolled child must have an accompanying participating adult (parent-participation ratio 1:1 when true).
        default: true
      - name: tuition_cents
        type: integer
        source: input
        description: Per-cycle tuition in cents charged per enrolled child for sessions of this program.
        constraints: "integer >= 0"
      - name: next_program_id
        type: string
        source: input
        description: "FK -> Program.id; the program a child advances into from this one (self-referential ladder). Null for the top level."
        default: null

  - name: Room
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: Room label.
      - name: physical_capacity
        type: integer
        source: input
        description: Maximum number of children the room can physically hold at once for any single session or facility booking.
        constraints: "integer >= 1"

  - name: Instructor
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: Instructor name.
      - name: certified_level_indices
        type: array
        source: input
        description: Sorted list of Program.level_index values this instructor is certified to teach.
        constraints: "non-empty array of integers"
      - name: buffer_minutes
        type: integer
        source: input
        description: Required clear gap (minutes) between any two sessions assigned to this instructor; the instructor's interval occupation is expanded by this buffer on each side for overlap detection.
        default: 15
        constraints: "integer >= 0"
      - name: status
        type: enum
        source: system
        description: Instructor availability for scheduling.
        default: ACTIVE
        constraints: "one of {ACTIVE, INACTIVE}"

  - name: ClassSession
    parent: null
    common_fields: true
    fields:
      - name: program_id
        type: string
        source: input
        description: "FK -> Program.id; the program/level this session teaches."
      - name: room_id
        type: string
        source: input
        description: "FK -> Room.id; the room hosting this session."
      - name: instructor_id
        type: string
        source: input
        description: "FK -> Instructor.id; the instructor leading this session."
      - name: start_at
        type: string
        source: input
        description: ISO 8601 UTC start instant (inclusive) of the session interval.
      - name: end_at
        type: string
        source: input
        description: ISO 8601 UTC end instant (exclusive) of the session interval (half-open [start_at, end_at)).
        constraints: "end_at > start_at"
      - name: capacity
        type: integer
        source: input
        description: Maximum ENROLLED children; must not exceed the room's physical_capacity.
        constraints: "integer >= 1; <= Room.physical_capacity"
      - name: enrolled_count
        type: integer
        source: computed
        description: Count of Enrollment rows for this session with status == ENROLLED; reconciled on enroll, cancel, promote, demote, advancement-transfer.
        default: 0
      - name: status
        type: enum
        source: system
        description: Session lifecycle (branching SCHEDULED -> {HELD, CANCELLED}).
        default: SCHEDULED
        constraints: "one of {SCHEDULED, HELD, CANCELLED}"

  - name: Enrollment
    parent: null
    common_fields: true
    fields:
      - name: child_id
        type: string
        source: input
        description: "FK -> Child.id; the enrolled child."
      - name: session_id
        type: string
        source: input
        description: "FK -> ClassSession.id; the session the child is enrolled or waitlisted in."
      - name: membership_id
        type: string
        source: input
        description: "FK -> Membership.id; the membership billed for this enrollment."
      - name: kind
        type: enum
        source: input
        description: TRIAL is a one-off paid trial that never grants makeup credits; RECURRING is a standing seat.
        default: RECURRING
        constraints: "one of {TRIAL, RECURRING}"
      - name: status
        type: enum
        source: system
        description: Enrollment lifecycle (cyclic ENROLLED <-> WAITLISTED, terminal CANCELLED).
        default: ENROLLED
        constraints: "one of {ENROLLED, WAITLISTED, CANCELLED}"
      - name: waitlist_seq
        type: integer
        source: system
        description: Monotonic order assigned when a row enters WAITLISTED; lowest seq is promoted first. Null while ENROLLED.
        default: null
      - name: redeemed_credit_id
        type: string
        source: system
        description: "Identifier of the MakeupCredit spent to create this enrollment (set only on a redeem-makeup enrollment, else null); not a queryable foreign key — discover via the credit's own membership listing."
        default: null
      - name: residual_owed_cents
        type: integer
        source: computed
        description: For a redemption enrollment, the uncovered tuition residual_owed_cents from makeup_credit_valuation (max(0, target_program.tuition_cents - credit.issued_tuition_cents)); 0 for ordinary enrollments.
        default: 0

  - name: AttendanceRecord
    parent: null
    common_fields: false
    fields:
      - name: enrollment_id
        type: string
        source: input
        description: "FK -> Enrollment.id; the enrollment this attendance row belongs to."
      - name: session_id
        type: string
        source: input
        description: "FK -> ClassSession.id; the session this record is for (denormalized for reverse lookup)."
      - name: outcome
        type: enum
        source: system
        description: PRESENT and ABSENT are recorded at session hold; EXCUSED is stamped by a cascade when the session is cancelled and is the only outcome that issues a makeup credit.
        constraints: "one of {PRESENT, ABSENT, EXCUSED}"

  - name: MakeupCredit
    parent: null
    common_fields: false
    fields:
      - name: membership_id
        type: string
        source: input
        description: "FK -> Membership.id; the membership holding this credit."
      - name: source_attendance_id
        type: string
        source: system
        description: "Provenance pointer to the EXCUSED AttendanceRecord.id that minted this credit (1:1, set by the cascade); not a queryable foreign key — credits are discovered via the membership's makeup-credits listing."
      - name: issued_tuition_cents
        type: integer
        source: system
        description: Tuition_cents of the cancelled session's program, snapshotted at issuance; the issuance-time valuation variant.
      - name: status
        type: enum
        source: system
        description: Credit lifecycle.
        default: AVAILABLE
        constraints: "one of {AVAILABLE, REDEEMED, EXPIRED}"
      - name: expires_at
        type: string
        source: system
        description: ISO 8601 UTC instant after which the credit expires (issued_at + CREDIT_TTL_DAYS).

  - name: FacilityBooking
    parent: null
    common_fields: true
    fields:
      - name: room_id
        type: string
        source: input
        description: "FK -> Room.id; the room reserved for this add-on booking."
      - name: family_id
        type: string
        source: input
        description: "FK -> Family.id; the booking family."
      - name: booking_type
        type: enum
        source: input
        description: BIRTHDAY_PARTY (private, occupies whole room) or OPEN_GYM (shared, counts head_count against physical_capacity).
        constraints: "one of {BIRTHDAY_PARTY, OPEN_GYM}"
      - name: start_at
        type: string
        source: input
        description: ISO 8601 UTC start instant (inclusive) of the booking interval.
      - name: end_at
        type: string
        source: input
        description: ISO 8601 UTC end instant (exclusive) of the booking interval.
        constraints: "end_at > start_at"
      - name: head_count
        type: integer
        source: input
        description: Expected children for an OPEN_GYM booking; for BIRTHDAY_PARTY it is informational and the room is held exclusively regardless.
        default: 1
        constraints: "integer >= 1"
      - name: status
        type: enum
        source: system
        description: Booking lifecycle.
        default: CONFIRMED
        constraints: "one of {CONFIRMED, CANCELLED}"

  - name: Invoice
    parent: null
    common_fields: true
    fields:
      - name: membership_id
        type: string
        source: input
        description: "FK -> Membership.id; the membership being charged."
      - name: cycle_start
        type: string
        source: system
        description: ISO 8601 UTC start of the cycle this invoice covers.
      - name: subtotal_cents
        type: integer
        source: computed
        description: Sum of per-child rounded tuition lines plus membership base fee, before sibling discount.
        default: 0
      - name: sibling_discount_cents
        type: integer
        source: computed
        description: Discount applied per the sibling-discount tiered rule.
        default: 0
      - name: total_cents
        type: integer
        source: computed
        description: subtotal_cents - sibling_discount_cents; never below 0.
        default: 0
      - name: status
        type: enum
        source: system
        description: Invoice lifecycle.
        default: OPEN
        constraints: "one of {OPEN, PAID, VOID}"

# =====================================================================
# §1.2 State Machine Table
# =====================================================================
state_machines:
  - entity: Child
    initial_state: ENROLLED_ELIGIBLE
    terminal_states: [WITHDRAWN]
    transitions:
      - from: ENROLLED_ELIGIBLE
        to: WITHDRAWN
        trigger: "POST /enrichment/children/{id}/withdraw"
        actor: Parent
        preconditions:
          - "child.status == ENROLLED_ELIGIBLE"
        side_effects:
          - "each ENROLLED/WAITLISTED Enrollment of this child transitions to CANCELLED; each ENROLLED cancellation decrements its ClassSession.enrolled_count and promotes that session's next waitlisted row"
          - "Family.child_count reconciled (excludes WITHDRAWN children)"
        note: "Linear terminal withdrawal; supplies the WITHDRAWN enum value and a Child->Enrollment cascade distinct from the membership-cancel cascade."

  - entity: Membership
    initial_state: PENDING_PAYMENT
    terminal_states: [CANCELLED]
    transitions:
      - from: PENDING_PAYMENT
        to: ACTIVE
        trigger: "POST /enrichment/memberships/{id}/activate"
        actor: FrontDeskStaff
        preconditions:
          - "membership.status == PENDING_PAYMENT"
        side_effects:
          - "set monthly_base_fee_cents from tier via membership_base_fee constants"
          - "set current_cycle_start to the logical clock instant"
          - "increments Membership.version by 1"
      - from: ACTIVE
        to: FROZEN
        trigger: "POST /enrichment/memberships/{id}/freeze"
        actor: Parent
        preconditions:
          - "membership.status == ACTIVE"
        side_effects:
          - "billing suspended: subsequent renew is rejected while FROZEN"
          - "increments Membership.version by 1"
        note: "Cyclic: a frozen membership can be reactivated; credits are preserved across the freeze."
      - from: FROZEN
        to: ACTIVE
        trigger: "POST /enrichment/memberships/{id}/activate"
        actor: Parent
        preconditions:
          - "membership.status == FROZEN"
        side_effects:
          - "set current_cycle_start to the logical clock instant"
          - "increments Membership.version by 1"
        note: "Closes the ACTIVE <-> FROZEN cycle."
      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /enrichment/memberships/{id}/cancel"
        actor: Parent
        preconditions:
          - "membership.status == ACTIVE"
        side_effects:
          - "all AVAILABLE MakeupCredit rows for this membership transition to EXPIRED (cascade); makeup_credit_balance reconciled to 0"
          - "every ENROLLED/WAITLISTED Enrollment billed to this membership transitions to CANCELLED (cascade); each ENROLLED cancellation decrements its ClassSession.enrolled_count and frees a seat for waitlist promotion"
          - "increments Membership.version by 1"
      - from: FROZEN
        to: CANCELLED
        trigger: "POST /enrichment/memberships/{id}/cancel"
        actor: Parent
        preconditions:
          - "membership.status == FROZEN"
        side_effects:
          - "all AVAILABLE MakeupCredit rows for this membership transition to EXPIRED (cascade); makeup_credit_balance reconciled to 0"
          - "increments Membership.version by 1"

  - entity: ClassSession
    initial_state: SCHEDULED
    terminal_states: [HELD, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: HELD
        trigger: "POST /enrichment/sessions/{id}/hold"
        actor: FrontDeskStaff
        preconditions:
          - "session.status == SCHEDULED"
          - "instructor.status == ACTIVE (cross-entity: ClassSession depends on Instructor)"
          - "logical clock >= session.start_at"
        side_effects:
          - "for each ENROLLED Enrollment in this session, create an AttendanceRecord with the outcome supplied in the request's attendance map (PRESENT or ABSENT); enrollments omitted from the map default to ABSENT"
          - "increments ClassSession.version by 1"
        note: "Branch HELD: attendance is recorded; no makeup credits are minted."
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /enrichment/sessions/{id}/cancel"
        actor: FrontDeskStaff
        preconditions:
          - "session.status == SCHEDULED"
        side_effects:
          - "depth-1: for each ENROLLED RECURRING Enrollment in this session create an AttendanceRecord with outcome EXCUSED"
          - "depth-2: each EXCUSED AttendanceRecord mints one MakeupCredit on the enrollment's Membership with issued_tuition_cents = this session's Program.tuition_cents and status AVAILABLE"
          - "depth-3: each minted MakeupCredit increments its Membership.makeup_credit_balance by 1 and bumps that Membership.version"
          - "every ENROLLED/WAITLISTED Enrollment in this session transitions to CANCELLED; enrolled_count set to 0"
          - "increments ClassSession.version by 1"
        note: "Branch CANCELLED: divergent side-effect set vs HELD — mints makeup credits and voids enrollments. TRIAL enrollments never receive a credit."

  - entity: Enrollment
    initial_state: ENROLLED
    terminal_states: [CANCELLED]
    transitions:
      - from: ENROLLED
        to: CANCELLED
        trigger: "POST /enrichment/enrollments/{id}/cancel"
        actor: Parent
        preconditions:
          - "enrollment.status == ENROLLED"
          - "session.status == SCHEDULED (cross-entity: Enrollment depends on ClassSession)"
        side_effects:
          - "decrement ClassSession.enrolled_count by 1, freeing a seat"
          - "depth-2 cascade: if any WAITLISTED Enrollment remains, promote the one with the lowest waitlist_seq to ENROLLED, which itself increments ClassSession.enrolled_count by 1 and clears that row's waitlist_seq"
          - "increments ClassSession.version by 1"
      - from: WAITLISTED
        to: ENROLLED
        trigger: "system: promotion when a seat frees (enrollment cancel, advancement transfer)"
        actor: system
        preconditions:
          - "enrollment.status == WAITLISTED"
          - "ClassSession.enrolled_count < ClassSession.capacity"
        side_effects:
          - "set waitlist_seq to null"
          - "increment ClassSession.enrolled_count by 1"
        note: "Cyclic with the ENROLLED -> WAITLISTED edge below; promotion order is lowest waitlist_seq first, then created_at ASC."
      - from: ENROLLED
        to: WAITLISTED
        trigger: "system: advancement transfer when child's current_level changes off this session's program level"
        actor: system
        preconditions:
          - "enrollment.status == ENROLLED"
          - "child.current_level != session.program.level_index"
        side_effects:
          - "assign waitlist_seq = current max waitlist_seq for the session + 1 (created_at ASC tie-break)"
          - "decrement ClassSession.enrolled_count by 1, freeing a seat that triggers promotion of the next waitlisted row"
          - "increments ClassSession.version by 1"
        note: "Cyclic: a demoted enrollment re-enters WAITLISTED and may be promoted again."
      - from: WAITLISTED
        to: CANCELLED
        trigger: "POST /enrichment/enrollments/{id}/cancel"
        actor: Parent
        preconditions:
          - "enrollment.status == WAITLISTED"
        side_effects:
          - "no enrolled_count change (waitlisted rows hold no seat)"
          - "increments ClassSession.version by 1"

  - entity: FacilityBooking
    initial_state: CONFIRMED
    terminal_states: [CANCELLED]
    transitions:
      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /enrichment/facility-bookings/{id}/cancel"
        actor: Parent
        preconditions:
          - "booking.status == CONFIRMED"
        side_effects:
          - "releases the room interval, allowing later bookings/sessions in the freed window"
          - "increments FacilityBooking.version by 1"

  - entity: Invoice
    initial_state: OPEN
    terminal_states: [PAID, VOID]
    transitions:
      - from: OPEN
        to: PAID
        trigger: "POST /enrichment/invoices/{id}/pay"
        actor: FrontDeskStaff
        preconditions:
          - "invoice.status == OPEN"
          - "membership.status == ACTIVE (cross-entity: Invoice depends on Membership)"
        side_effects:
          - "increments Invoice.version by 1"
      - from: OPEN
        to: VOID
        trigger: "system: membership cancellation voids the current OPEN invoice"
        actor: system
        preconditions:
          - "invoice.status == OPEN"
        side_effects:
          - "increments Invoice.version by 1"

# ---------------------------------------------------------------------
# §1.2.1 Concurrency Rules
# ---------------------------------------------------------------------
concurrency_rules:
  - rule_id: enroll-stale-session
    parent_entity: ClassSession
    write_endpoint: "POST /enrichment/enrollments"
    occ_field: "expected_session_version"
    description: |
      Creating an Enrollment against a ClassSession whose version has advanced
      since the client last observed it is rejected. The last open seat may have
      been taken by an enrollment that already advanced the session version; the
      current writer's view of the session (and its enrolled_count) is therefore
      stale and the create is rejected on the stale version rather than silently
      overbooking.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: schedule-stale-room
    parent_entity: Room
    write_endpoint: "POST /enrichment/facility-bookings"
    occ_field: "expected_room_version"
    description: |
      Booking a FacilityBooking against a Room whose version has advanced since
      the client last observed it is rejected. A prior booking that occupies the
      requested window legitimately bumps the room version; a writer holding a
      stale room view is rejected before its overlapping booking is committed.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =====================================================================
# §1.3 Calculation Rules Table
# =====================================================================
calculations:
  - name: membership_cycle_invoice
    trigger: "POST /enrichment/memberships/{id}/renew (and on first activation's first invoice)"
    algorithm: aggregation
    formula: |
      # Per-child tuition lines: one line per ENROLLED RECURRING Enrollment whose
      # membership_id == this membership, joined to the session's Program.tuition_cents.
      # FROZEN-period proration variant differs only in the line amount (see variants).
      for each distinct child with an ENROLLED RECURRING enrollment on this membership:
        child_line_cents = round_half_up(program.tuition_cents)   # already integer cents; rounding is a no-op unless proration applies
      subtotal_cents = membership.monthly_base_fee_cents + SUM(child_line_cents over children)
      # PIN: round per child line FIRST, then sum. (rounding-order mode (b))
      sibling_discount_cents = sibling_discount(child_count_for_billing, subtotal_tuition_only_cents)
      total_cents = max(0, subtotal_cents - sibling_discount_cents)
    input_set: "ENROLLED RECURRING Enrollment rows for the membership; WAITLISTED, TRIAL, and CANCELLED rows are excluded. The membership must be ACTIVE."
    constants:
      MEMBERSHIP_BASE_FEE_CENTS: { CORE: 3000, PLUS: 5000, UNLIMITED: 9000 }
      CYCLE_DAYS: 30
    precision: "integer cents; round_half_up; round each child line before summing (sum-of-rounded, NOT round-of-sum)"
    variants:
      - name: full_cycle
        when: "membership was ACTIVE for the entire billing cycle"
        difference: "each child_line_cents = program.tuition_cents (no proration)"
      - name: mid_cycle_prorated
        when: "membership reactivated from FROZEN partway through the cycle (membership.current_cycle_start was reset to the reactivation instant, which is later than the cycle's nominal anchor)"
        difference: |
          child_line_cents = round_half_up(program.tuition_cents * active_days / CYCLE_DAYS), then summed.
          CYCLE_DAYS is fixed at 30. active_days = whole-day count, floor((cycle_end - current_cycle_start) / 1 day), clamped to [0, 30],
          where cycle_end = the renew instant. Reactivating 20 days before renew yields active_days=10, so a 2500-cent line prorates to round_half_up(2500*10/30)=833 cents.
          Rounding is applied PER CHILD LINE BEFORE summing (sum-of-rounded), never round-of-sum.

  - name: makeup_credit_valuation
    trigger: "POST /enrichment/enrollments/{id}/redeem-makeup and the session-cancel cascade that mints credits"
    algorithm: forward_looking
    formula: |
      # Two valuation variants on the credit ledger (DIFFERENT domain from
      # membership invoicing — operates on MakeupCredit + ClassSession.Program).
      # Issuance value (snapshotted): credit.issued_tuition_cents = cancelled session's Program.tuition_cents.
      # Redemption value (live): when a credit is redeemed to enroll a child into a
      # target session, the credit covers up to the TARGET session's Program.tuition_cents.
      redemption_coverage_cents = min(credit.issued_tuition_cents, target_program.tuition_cents)
      residual_owed_cents = max(0, target_program.tuition_cents - credit.issued_tuition_cents)
    input_set: "A single AVAILABLE MakeupCredit (lowest expires_at first, created_at ASC tie-break) for the redeeming membership; target session must be SCHEDULED with a free seat."
    constants:
      CREDIT_TTL_DAYS: 60
    precision: "integer cents; round_half_up"
    variants:
      - name: issuance_value
        when: "credit is minted by a session-cancel cascade"
        difference: "value fixed at the CANCELLED session's program tuition_cents; stored on issued_tuition_cents"
      - name: redemption_value
        when: "credit is spent on a target session of a different level"
        difference: "value capped at the TARGET program's tuition_cents; residual_owed_cents may be charged when target tuition exceeds the snapshotted issuance value"

  - name: sibling_discount
    trigger: "during membership_cycle_invoice computation"
    algorithm: tiered_pricing
    formula: |
      # Tiered, >= 3 inputs, nested conditional + min/max (combinatorial mode (a)).
      # n = Family.child_count (ENROLLED_ELIGIBLE children with >=1 ENROLLED RECURRING enrollment on this membership)
      # tuition_only_cents = subtotal_cents - monthly_base_fee_cents
      if n <= 1:        rate = 0.00
      elif n == 2:      rate = 0.10
      elif n == 3:      rate = 0.15
      else:             rate = 0.20    # n >= 4
      raw_discount = tuition_only_cents * rate
      # discount applies ONLY to tuition, never to the base fee, and is capped at one full child line:
      cap_cents = max over the n children of their rounded child_line_cents
      sibling_discount_cents = min( round_half_up(raw_discount), cap_cents )
    input_set: "The set of ENROLLED_ELIGIBLE children on the membership; base fee excluded from the discount base."
    constants:
      SIBLING_RATE_2: 0.10
      SIBLING_RATE_3: 0.15
      SIBLING_RATE_4_PLUS: 0.20
    precision: "integer cents; round_half_up on raw_discount before applying the cap"

  - name: child_age_months_at_session
    trigger: "POST /enrichment/enrollments (eligibility check) and POST /enrichment/children/{id}/advance"
    algorithm: threshold
    formula: |
      # Whole-month age at the session's start instant; drives the half-open age band.
      age_months = floor( (session.start_at - child.birth_date) measured in whole calendar months )
      eligible = (age_months >= program.min_age_months) AND (age_months < program.max_age_months)
      # Boundary: a child exactly at max_age_months is INELIGIBLE (half-open upper bound).
    input_set: "One Child birth_date and one target ClassSession.start_at and its Program band."
    constants: {}
    precision: "whole months; calendar-month floor"

# =====================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =====================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and X-User-Role is a known role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "the acting role is permitted for this operation per §1.7 (and for Parent ops, X-User-ID equals the owning Family.id)"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "every path/body referenced resource exists, validated left-to-right (Family, Child, Membership, Program, Room, Instructor, ClassSession, Enrollment, MakeupCredit, FacilityBooking, Invoice)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with a resource id"
  - priority: 4
    category: business_constraint
    check: "request body field types/enums valid and required fields present (e.g., missing program_id, bad tier enum, end_at <= start_at)"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all write endpoints"
  - priority: 5
    category: state
    check: "target resource is in a state from which the requested transition is defined (e.g., enroll requires session.status == SCHEDULED; hold requires SCHEDULED; redeem requires session SCHEDULED)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all transition/action endpoints"
  - priority: 6
    category: business_referential
    check: "instructor must be certified for the session's program level (session.program.level_index IN instructor.certified_level_indices) on session create; instructor.status == ACTIVE on hold"
    error_id: ERR_INSTRUCTOR_NOT_CERTIFIED
    http_status: 422
    applies_to: "POST /enrichment/sessions, POST /enrichment/sessions/{id}/hold"
  - priority: 7
    category: business_temporal
    check: "instructor schedule conflict: the new session's [start_at, end_at) expanded by instructor.buffer_minutes on each side must not overlap any other non-CANCELLED session of the same instructor"
    error_id: ERR_INSTRUCTOR_SCHEDULE_CONFLICT
    http_status: 409
    applies_to: "POST /enrichment/sessions"
  - priority: 8
    category: business_temporal
    check: "room schedule conflict: a session/booking [start_at, end_at) must not strictly overlap any other non-CANCELLED session or BIRTHDAY_PARTY booking on the same room; adjacency (one's end_at == other's start_at) is allowed; OPEN_GYM bookings may coexist while SUM(head_count of overlapping CONFIRMED OPEN_GYM) <= Room.physical_capacity"
    error_id: ERR_ROOM_SCHEDULE_CONFLICT
    http_status: 409
    applies_to: "POST /enrichment/sessions, POST /enrichment/facility-bookings"
  - priority: 9
    category: business_safety
    check: "age eligibility: child age_months at session.start_at must satisfy [program.min_age_months, program.max_age_months); a child exactly at max_age_months is ineligible"
    error_id: ERR_AGE_BAND_MISMATCH
    http_status: 422
    applies_to: "POST /enrichment/enrollments, POST /enrichment/enrollments/{id}/redeem-makeup"
  - priority: 10
    category: business_safety
    check: "level match: a RECURRING enrollment requires child.current_level == session.program.level_index (a child cannot recurringly enroll off-level); TRIAL enrollments are exempt. Makeup redemption is EXEMPT from level match — a credit may be applied to a target session of any level the child is age-eligible for (the redemption-value variant of makeup_credit_valuation caps coverage at the target program's tuition)."
    error_id: ERR_LEVEL_MISMATCH
    http_status: 422
    applies_to: "POST /enrichment/enrollments (kind=RECURRING)"
  - priority: 11
    category: business_fiscal
    check: "membership must be ACTIVE for a RECURRING enrollment, redemption, or invoice payment; a FROZEN/PENDING_PAYMENT/CANCELLED membership cannot acquire new recurring seats"
    error_id: ERR_MEMBERSHIP_NOT_ACTIVE
    http_status: 422
    applies_to: "POST /enrichment/enrollments (kind=RECURRING), POST /enrichment/enrollments/{id}/redeem-makeup, POST /enrichment/invoices/{id}/pay"
  - priority: 12
    category: business_constraint
    check: "capacity: enrolling as ENROLLED requires session.enrolled_count < session.capacity; at-capacity recurring enrollment requests are placed WAITLISTED instead of rejected, but a TRIAL enrollment at capacity is rejected outright"
    error_id: ERR_SESSION_FULL
    http_status: 409
    applies_to: "POST /enrichment/enrollments (kind=TRIAL), POST /enrichment/enrollments/{id}/redeem-makeup"
  - priority: 13
    category: business_safety
    check: "parent-participation ratio: when the session's program participation_required is true, each ENROLLED child must declare an accompanying_adult in the enroll request; omitting it for a participation-required program is rejected"
    error_id: ERR_PARTICIPATION_REQUIRED
    http_status: 422
    applies_to: "POST /enrichment/enrollments"
  - priority: 14
    category: business_constraint
    check: "no available makeup credit to redeem (makeup_credit_balance == 0 or all credits EXPIRED) when redeem-makeup is called"
    error_id: ERR_NO_CREDIT_AVAILABLE
    http_status: 409
    applies_to: "POST /enrichment/enrollments/{id}/redeem-makeup"
  - priority: 15
    category: business_constraint
    check: "OCC stale-version: expected_<parent>_version must equal the live parent.version (see §1.2.1)"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /enrichment/enrollments, POST /enrichment/facility-bookings"

# =====================================================================
# §1.5 API Endpoint Table
# =====================================================================
endpoints:
  # ---- Test-driving clock ----
  - method: POST
    path: "/enrichment/_clock/set_current_utc"
    description: "Set the logical clock to an arbitrary UTC instant. Server startup default is 2026-04-01T00:00:00Z; before any call the clock reads exactly this default and never falls back to wall-clock time. All age, expiry, cycle, and overlap rules read this clock."
    roles: [StudioAdmin]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["logical clock advanced to to_iso8601"]

  # ---- Family ----
  - method: POST
    path: "/enrichment/families"
    description: "Register a family account."
    roles: [StudioAdmin, FrontDeskStaff]
    code: 201
    input: [account_email, primary_contact_name]
    output: Family
    side_effects: ["Family created with status ACTIVE, child_count 0"]
  - method: GET
    path: "/enrichment/families/{id}"
    description: "Fetch a family, including computed child_count."
    roles: [StudioAdmin, FrontDeskStaff, Parent]
    code: 200
    input: []
    output: Family
    side_effects: []
  - method: GET
    path: "/enrichment/families/{id}/children"
    description: "List children of a family (FK reverse-reachability for Child.family_id)."
    roles: [StudioAdmin, FrontDeskStaff, Parent]
    code: 200
    input: []
    output: Child[]
    side_effects: []
  - method: GET
    path: "/enrichment/families/{id}/memberships"
    description: "List memberships of a family (FK reverse-reachability for Membership.family_id)."
    roles: [StudioAdmin, FrontDeskStaff, Parent]
    code: 200
    input: []
    output: Membership[]
    side_effects: []

  # ---- Child ----
  - method: POST
    path: "/enrichment/children"
    description: "Add a child to a family."
    roles: [StudioAdmin, FrontDeskStaff, Parent]
    code: 201
    input: [family_id, full_name, birth_date]
    output: Child
    side_effects: ["Child created status ENROLLED_ELIGIBLE, current_level 0; Family.child_count reconciled"]
  - method: GET
    path: "/enrichment/children/{id}"
    description: "Fetch a child."
    roles: [StudioAdmin, FrontDeskStaff, Parent]
    code: 200
    input: []
    output: Child
    side_effects: []
  - method: GET
    path: "/enrichment/children/{id}/enrollments"
    description: "List enrollments of a child (FK reverse-reachability for Enrollment.child_id)."
    roles: [StudioAdmin, FrontDeskStaff, Parent]
    code: 200
    input: []
    output: Enrollment[]
    side_effects: []
  - method: POST
    path: "/enrichment/children/{id}/advance"
    description: "Advance a child to the next program level (level advancement). Sets current_level to target program level_index and triggers the advancement-transfer cascade on the child's off-level ENROLLED enrollments."
    roles: [StudioAdmin, FrontDeskStaff]
    code: 200
    input: [target_program_id]
    output: Child
    side_effects:
      - "child.current_level updated to target program's level_index"
      - "advancement-transfer cascade: each ENROLLED RECURRING Enrollment of this child on a session whose program level_index != new current_level transitions ENROLLED -> WAITLISTED, decrementing that session's enrolled_count and promoting that session's next waitlisted row"
  - method: POST
    path: "/enrichment/children/{id}/withdraw"
    description: "Withdraw a child from the studio (status -> WITHDRAWN); cancels the child's active enrollments and removes it from sibling-discount counting."
    roles: [StudioAdmin, FrontDeskStaff, Parent]
    code: 200
    input: []
    output: Child
    side_effects:
      - "child.status -> WITHDRAWN"
      - "cascade: each ENROLLED/WAITLISTED Enrollment of this child -> CANCELLED; each ENROLLED cancellation decrements its session's enrolled_count and promotes the next waitlisted row"
      - "Family.child_count reconciled (the withdrawn child no longer counts)"

  # ---- Membership ----
  - method: POST
    path: "/enrichment/memberships"
    description: "Create a recurring membership for a family (status PENDING_PAYMENT)."
    roles: [StudioAdmin, FrontDeskStaff, Parent]
    code: 201
    input: [family_id, tier, cycle_anchor_day]
    output: Membership
    side_effects: ["Membership created PENDING_PAYMENT; makeup_credit_balance 0"]
  - method: GET
    path: "/enrichment/memberships/{id}"
    description: "Fetch a membership, including computed makeup_credit_balance and version."
    roles: [StudioAdmin, FrontDeskStaff, Parent]
    code: 200
    input: []
    output: Membership
    side_effects: []
  - method: GET
    path: "/enrichment/memberships/{id}/makeup-credits"
    description: "List makeup credits of a membership (FK reverse-reachability for MakeupCredit.membership_id)."
    roles: [StudioAdmin, FrontDeskStaff, Parent]
    code: 200
    input: []
    output: MakeupCredit[]
    side_effects: []
  - method: GET
    path: "/enrichment/memberships/{id}/invoices"
    description: "List invoices of a membership (FK reverse-reachability for Invoice.membership_id)."
    roles: [StudioAdmin, FrontDeskStaff, Parent]
    code: 200
    input: []
    output: Invoice[]
    side_effects: []
  - method: POST
    path: "/enrichment/memberships/{id}/activate"
    description: "Activate a PENDING_PAYMENT or reactivate a FROZEN membership."
    roles: [StudioAdmin, FrontDeskStaff, Parent]
    code: 200
    input: []
    output: Membership
    side_effects: ["snapshot monthly_base_fee_cents from tier; set current_cycle_start; status -> ACTIVE; version +1"]
  - method: POST
    path: "/enrichment/memberships/{id}/freeze"
    description: "Freeze an ACTIVE membership (suspends billing, preserves credits)."
    roles: [Parent, StudioAdmin, FrontDeskStaff]
    code: 200
    input: []
    output: Membership
    side_effects: ["status -> FROZEN; version +1"]
  - method: POST
    path: "/enrichment/memberships/{id}/cancel"
    description: "Cancel a membership; expires all AVAILABLE credits and cancels its enrollments (cascade)."
    roles: [Parent, StudioAdmin, FrontDeskStaff]
    code: 200
    input: []
    output: Membership
    side_effects:
      - "all AVAILABLE MakeupCredit -> EXPIRED; makeup_credit_balance -> 0"
      - "all ENROLLED/WAITLISTED Enrollment on this membership -> CANCELLED; sessions' enrolled_count decremented and waitlists promoted"
      - "current OPEN Invoice -> VOID; status -> CANCELLED; version +1"
  - method: POST
    path: "/enrichment/memberships/{id}/renew"
    description: "Advance the membership to the next billing cycle and emit the cycle Invoice (membership_cycle_invoice calculation)."
    roles: [StudioAdmin, FrontDeskStaff]
    code: 201
    input: []
    output: Invoice
    side_effects:
      - "current_cycle_start advanced by one cycle (next cycle_anchor_day)"
      - "create OPEN Invoice with subtotal_cents, sibling_discount_cents, total_cents computed by membership_cycle_invoice + sibling_discount"

  # ---- Program ----
  - method: POST
    path: "/enrichment/programs"
    description: "Create a program/level."
    roles: [StudioAdmin]
    code: 201
    input: [name, level_index, min_age_months, max_age_months, tuition_cents, "participation_required?", "next_program_id?"]
    output: Program
