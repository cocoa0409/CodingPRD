scenario: |
  2990. Retiree Medical & Medicare Coordination (employer retiree benefits program): retiree eligibility rules by hire date, age and service with grandfathered group tracking, pre-Medicare versus Medicare-eligible plan design with individual marketplace exchange alternatives, health reimbursement arrangement funding, substantiation and unused balance carryover, Medicare secondary payer determination and coordination of benefits with the group plan, retiree drug subsidy versus employer group waiver plan election with actuarial equivalence testing, enrollment support, annual election windows and life event changes, premium billing, delinquency and reinstatement rules, accounting liability valuation and plan change communication

domain_name: "retiree-medical-medicare-coordination"
api_prefix: "/retiree-benefits"

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: ledger_reconciliation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers

  entity_topology: flat
  # Nine peer entities linked by explicit foreign keys. No entity is nested in a
  # URL path under another; every collection lives directly under /retiree-benefits.

  state_machine_shape: parallel
  # Retiree carries (eligibility_status x medicare_status); Enrollment carries
  # (coverage_status x billing_status); PlanOption carries (status x
  # subsidy_certification_status). EligibilityDetermination and
  # ReimbursementClaim add revision cycles; ElectionEvent adds a branching fork.

  relationship_patterns:
    - one_to_many
    - self_referential      # HraAccount.prior_year_account_id -> HraAccount.id
    - cross_aggregate       # Enrollment references PlanOption + ElectionEvent + PlanYear

  role_model: segregation_of_duties
  # The Actuary who attests actuarial equivalence may never be the acting user who
  # certifies the subsidy election; the EligibilityAnalyst who certifies a
  # determination may never be the acting user who decides its appeal.

  consistency_model: immediate

  difficulty_level: expert

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:

  - name: PlanYear
    parent: null
    common_fields: true
    fields:
      - name: year
        type: integer
        source: input
        description: "Calendar plan year the program covers; unique across all PlanYear rows."
        constraints: "2024 <= year <= 2099; uniqueness violation raises ERR_DUPLICATE_PLAN_YEAR"
      - name: status
        type: enum
        source: system
        description: "Program lifecycle for this plan year."
        default: DRAFT
        constraints: "one of {DRAFT, OPEN, CLOSED, ARCHIVED}"
      - name: open_enrollment_start
        type: datetime
        source: input
        description: "Inclusive lower bound of the annual election window (ISO 8601 UTC, three fractional digits)."
      - name: open_enrollment_end
        type: datetime
        source: input
        description: "EXCLUSIVE upper bound of the annual election window; the window is half-open [open_enrollment_start, open_enrollment_end)."
        constraints: "must be strictly greater than open_enrollment_start"
      - name: coverage_start
        type: datetime
        source: input
        description: "Instant at which coverage elected in this plan year becomes effective for ANNUAL_OPEN elections."
      - name: hra_credit_pre_medicare_cents
        type: integer
        source: input
        description: "Full-year HRA credit granted to a retiree whose medicare_status is not MEDICARE_ENROLLED."
        constraints: ">= 0"
      - name: hra_credit_medicare_cents
        type: integer
        source: input
        description: "Full-year HRA credit granted to a retiree whose medicare_status is MEDICARE_ENROLLED."
        constraints: ">= 0"
      - name: carryover_cap_pct
        type: number
        source: input
        description: "Fraction of this plan year's annual_credit_cents that may survive year-end close as carryover; the excess is forfeited."
        constraints: "0 <= carryover_cap_pct <= 1"
      - name: premium_grace_period_days
        type: integer
        source: input
        description: "Days added to a PremiumInvoice due_date before the invoice becomes PAST_DUE."
        default: 31
        constraints: ">= 0"
      - name: reinstatement_window_days
        type: integer
        source: input
        description: "Days after Enrollment.lapse_date during which reinstatement remains permitted."
        default: 60
        constraints: ">= 0"
      - name: notice_lead_days
        type: integer
        source: input
        description: "Minimum whole days that must separate a plan change notice issuance from the change effective_date."
        default: 60
        constraints: ">= 0"
      - name: discount_rate_bps
        type: integer
        source: input
        description: "Discount rate in basis points used by the accounting liability valuation."
        constraints: "0 <= discount_rate_bps <= 5000"
      - name: assumed_annual_subsidy_cents
        type: integer
        source: input
        description: "Actuarial assumption: annual employer subsidy per covered retiree used by the liability valuation."
        constraints: ">= 0"
      - name: assumed_payment_years
        type: integer
        source: input
        description: "Actuarial assumption: number of years the employer subsidy is expected to be paid per retiree."
        constraints: ">= 1"
      - name: liability_method
        type: enum
        source: system
        description: "Attribution method recorded by the most recent liability valuation run."
        default: null
        constraints: "null or one of {PROJECTED_UNIT_CREDIT, ATTRIBUTION_TO_FULL_ELIGIBILITY}"
      - name: measured_retiree_count
        type: integer
        source: computed
        description: "Size of the valuation cohort produced by the most recent liability valuation run."
        default: 0
      - name: epbo_total_cents
        type: integer
        source: computed
        description: "Expected postretirement benefit obligation total from the most recent liability valuation run."
        default: 0
      - name: apbo_total_cents
        type: integer
        source: computed
        description: "Accumulated postretirement benefit obligation total from the most recent liability valuation run; depends on liability_method."
        default: 0
      - name: service_cost_total_cents
        type: integer
        source: computed
        description: "Annual service cost total from the most recent liability valuation run."
        default: 0
      - name: liability_valued_at
        type: datetime
        source: system
        description: "Logical-clock instant at which the most recent liability valuation run executed."
        default: null

  - name: Retiree
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: "Retiree display name."
        constraints: "1..120 characters"
      - name: birth_date
        type: string
        source: input
        description: "Date of birth, YYYY-MM-DD."
      - name: hire_date
        type: string
        source: input
        description: "Original hire date, YYYY-MM-DD; sole input to grandfathered_group."
      - name: retirement_date
        type: string
        source: input
        description: "Retirement (benefit commencement) date, YYYY-MM-DD; the measurement date for age_years_at_retirement."
      - name: credited_service_months
        type: integer
        source: input
        description: "Whole months of credited service at retirement."
        constraints: ">= 0"
      - name: eligibility_status
        type: enum
        source: system
        description: "Retiree-medical eligibility dimension; written only by EligibilityDetermination certification and appeal decisions."
        default: UNDETERMINED
        constraints: "one of {UNDETERMINED, ELIGIBLE, INELIGIBLE}"
      - name: medicare_status
        type: enum
        source: input
        description: "Medicare dimension, evolving independently of eligibility_status."
        default: PRE_MEDICARE
        constraints: "one of {PRE_MEDICARE, MEDICARE_ELIGIBLE_NOT_ENROLLED, MEDICARE_ENROLLED, MEDICARE_WAIVED}"
      - name: medicare_part_b_effective_date
        type: string
        source: input
        description: "Part B effective date, YYYY-MM-DD, or null when Part B is not in force."
        default: null
      - name: other_group_coverage_employer_size
        type: integer
        source: input
        description: "Employee count of the other group health plan sponsor covering this retiree; 0 means no other group coverage."
        default: 0
        constraints: ">= 0"
      - name: active_employment_flag
        type: boolean
        source: input
        description: "True when the other group coverage arises from current employment status (self or spouse)."
        default: false
      - name: esrd_flag
        type: boolean
        source: input
        description: "True when Medicare entitlement is based on end-stage renal disease."
        default: false
      - name: esrd_entitlement_date
        type: string
        source: input
        description: "First day of ESRD-based Medicare entitlement, YYYY-MM-DD, or null."
        default: null
      - name: disability_entitlement_flag
        type: boolean
        source: input
        description: "True when Medicare entitlement is based on disability rather than age."
        default: false
      - name: grandfathered_group
        type: enum
        source: computed
        description: "Grandfather cohort derived from hire_date at Retiree creation; never changes afterward."
        constraints: "one of {GRANDFATHERED_A, TRANSITION_B, STANDARD_C}"
      - name: eligibility_points
        type: integer
        source: computed
        description: "age_years_at_retirement + floor(credited_service_months / 12); recomputed whenever credited_service_months changes."
      - name: determination_sequence
        type: integer
        source: system
        description: "Count of EligibilityDetermination rows ever created for this retiree; incremented on every determination creation."
        default: 0

  - name: PlanOption
    parent: null
    common_fields: true
    fields:
      - name: plan_year_id
        type: string
        source: input
        description: "FK -> PlanYear.id; the plan year this option belongs to."
      - name: plan_code
        type: string
        source: input
        description: "Human-readable option code, unique within plan_year_id."
        constraints: "1..32 characters; uniqueness violation raises ERR_DUPLICATE_PLAN_CODE"
      - name: coverage_class
        type: enum
        source: input
        description: "Plan design family that determines which medicare_status values may elect it."
        constraints: "one of {PRE_MEDICARE_GROUP, MEDICARE_GROUP_WRAP, INDIVIDUAL_EXCHANGE_HRA}"
      - name: monthly_premium_cents
        type: integer
        source: input
        description: "Base monthly premium before administrative fee, employer subsidy and HRA offset."
        constraints: ">= 0"
      - name: requires_medicare_part_b
        type: boolean
        source: input
        description: "When true, an electing retiree must carry a non-null medicare_part_b_effective_date."
      - name: allowed_grandfather_groups
        type: array
        source: input
        description: "Grandfather cohorts permitted to elect this option."
        constraints: "non-empty array of {GRANDFATHERED_A, TRANSITION_B, STANDARD_C}"
      - name: subsidy_vehicle
        type: enum
        source: input
        description: "Retiree drug subsidy vehicle elected for this option's drug coverage."
        constraints: "one of {RDS, EGWP, NONE}"
      - name: rx_gross_value_bps
        type: integer
        source: input
        description: "Gross actuarial value of the option's drug benefit in basis points of the standard Part D benefit."
        constraints: ">= 0"
      - name: rx_net_value_bps
        type: integer
        source: input
        description: "Net actuarial value of the option's drug benefit in basis points, after supplemental premium offset."
        constraints: ">= 0"
      - name: status
        type: enum
        source: system
        description: "Option availability dimension, independent of subsidy_certification_status."
        default: DRAFT
        constraints: "one of {DRAFT, ACTIVE, CLOSED_TO_NEW, RETIRED}"
      - name: subsidy_certification_status
        type: enum
        source: system
        description: "Actuarial-equivalence certification dimension, independent of status."
        default: NOT_STARTED
        constraints: "one of {NOT_STARTED, ATTESTED, CERTIFIED, REJECTED}"
      - name: gross_test_passed
        type: boolean
        source: computed
        description: "Result of the gross actuarial equivalence test at the most recent attestation."
        default: false
      - name: net_test_passed
        type: boolean
        source: computed
        description: "Result of the net actuarial equivalence test at the most recent attestation."
        default: false
      - name: equivalence_margin_bps
        type: integer
        source: computed
        description: "rx_net_value_bps - STANDARD_PART_D_NET_VALUE_BPS at the most recent attestation."
        default: 0
      - name: attested_by_user_id
        type: string
        source: system
        description: "X-User-ID of the Actuary who performed the most recent attestation."
        default: null
      - name: certified_by_user_id
        type: string
        source: system
        description: "X-User-ID of the ComplianceOfficer who decided the most recent certification."
        default: null
      - name: enrolled_count
        type: integer
        source: computed
        description: "Count of Enrollment rows on this option whose coverage_status is in {PENDING, ACTIVE, SUSPENDED}."
        default: 0
      - name: pending_change_type
        type: enum
        source: system
        description: "Change announced by the most recent plan change notice and not yet applied."
        default: null
        constraints: "null or one of {PREMIUM_INCREASE, PLAN_TERMINATION}"
      - name: pending_change_effective_date
        type: datetime
        source: system
        description: "Instant at which the announced change takes effect during a daily operations run."
        default: null
      - name: pending_new_monthly_premium_cents
        type: integer
        source: system
        description: "Premium that replaces monthly_premium_cents when a PREMIUM_INCREASE change is applied."
        default: null
      - name: change_notice_issued_at
        type: datetime
        source: system
        description: "Logical-clock instant at which the plan change notice was issued to retirees."
        default: null

  - name: EligibilityDetermination
    parent: null
    common_fields: true
    fields:
      - name: retiree_id
        type: string
        source: input
        description: "FK -> Retiree.id; subject of the determination."
      - name: plan_year_id
        type: string
        source: input
        description: "FK -> PlanYear.id; plan year the determination is scoped to."
      - name: rule_set_code
        type: enum
        source: computed
        description: "Eligibility rule set selected by the subject's grandfathered_group."
        constraints: "one of {RULE_OF_75_GRANDFATHERED, AGE_60_SERVICE_15, AGE_65_SERVICE_10}"
      - name: grandfathered_group
        type: enum
        source: computed
        description: "Copy of Retiree.grandfathered_group frozen at determination creation."
        constraints: "one of {GRANDFATHERED_A, TRANSITION_B, STANDARD_C}"
      - name: age_years_at_retirement
        type: integer
        source: computed
        description: "Whole completed years between Retiree.birth_date and Retiree.retirement_date."
      - name: service_years
        type: integer
        source: computed
        description: "floor(Retiree.credited_service_months / 12) frozen at determination creation."
      - name: points
        type: integer
        source: computed
        description: "age_years_at_retirement + service_years."
      - name: outcome
        type: enum
        source: computed
        description: "Determination result produced by rule_set_code."
        constraints: "one of {ELIGIBLE, INELIGIBLE}"
      - name: status
        type: enum
        source: system
        description: "Determination lifecycle; CERTIFIED and UNDER_APPEAL form a revision cycle."
        default: DRAFT
        constraints: "one of {DRAFT, CERTIFIED, UNDER_APPEAL, SUPERSEDED}"
      - name: created_by_user_id
        type: string
        source: system
        description: "X-User-ID of the EligibilityAnalyst who created this determination; the segregation-of-duties counterparty for certify."
        default: null
      - name: certified_by_user_id
        type: string
        source: system
        description: "X-User-ID of the EligibilityAnalyst who certified this determination."
        default: null
      - name: appeal_reason
        type: string
        source: input
        description: "Free-text reason recorded when the determination enters UNDER_APPEAL."
        default: null
      - name: appeal_decided_by_user_id
        type: string
        source: system
        description: "X-User-ID of the ComplianceOfficer who decided the appeal; must differ from certified_by_user_id."
        default: null
      - name: appeal_decision
        type: enum
        source: system
        description: "Outcome of the most recent appeal decision."
        default: null
        constraints: "null or one of {UPHOLD, REVERSE}"
      - name: certified_at
        type: datetime
        source: system
        description: "Logical-clock instant of the most recent entry into CERTIFIED."
        default: null

  - name: ElectionEvent
    parent: null
    common_fields: true
    fields:
      - name: retiree_id
        type: string
        source: input
        description: "FK -> Retiree.id; the electing retiree."
      - name: plan_year_id
        type: string
        source: input
        description: "FK -> PlanYear.id; plan year the election targets."
      - name: requested_plan_option_id
        type: string
        source: input
        description: "FK -> PlanOption.id; the option the retiree wants."
      - name: event_type
        type: enum
        source: input
        description: "Annual window election or qualifying life event."
        constraints: "one of {ANNUAL_OPEN, MEDICARE_ENTITLEMENT, LOSS_OF_OTHER_COVERAGE, MARRIAGE, DEPENDENT_DEATH}"
      - name: event_date
        type: string
        source: input
        description: "Date of the qualifying event, YYYY-MM-DD; for ANNUAL_OPEN it is the submission date."
      - name: submitted_at
        type: datetime
        source: system
        description: "Logical-clock instant at which the election was submitted."
      - name: window_deadline
        type: datetime
        source: computed
        description: "Last instant at which this election could be validly submitted; see election_window_evaluation."
      - name: coverage_effective_date
        type: datetime
        source: computed
        description: "Instant coverage would begin if the election is approved."
      - name: status
        type: enum
        source: system
        description: "Election lifecycle; UNDER_REVIEW forks into APPROVED or DENIED with disjoint side-effect sets."
        default: SUBMITTED
        constraints: "one of {SUBMITTED, UNDER_REVIEW, APPROVED, DENIED}"
      - name: created_by_user_id
        type: string
        source: system
        description: "X-User-ID of the actor who submitted this election; the segregation-of-duties counterparty for decision."
        default: null
      - name: reviewed_by_user_id
        type: string
        source: system
        description: "X-User-ID of the EnrollmentCounselor who moved the election into UNDER_REVIEW."
        default: null
      - name: denial_reason_code
        type: enum
        source: system
        description: "Reason recorded when the election lands in DENIED."
        default: null
        constraints: "null or one of {COUNSELOR_DENIAL, PLAN_CLOSED}"
      - name: resulting_enrollment_id
        type: string
        source: system
        description: "FK -> Enrollment.id; the Enrollment synthesized by an APPROVE decision, else null."
        default: null

  - name: Enrollment
    parent: null
    common_fields: true
    fields:
      - name: retiree_id
        type: string
        source: input
        description: "FK -> Retiree.id; the covered retiree."
      - name: plan_year_id
        type: string
        source: input
        description: "FK -> PlanYear.id; plan year of coverage."
      - name: plan_option_id
        type: string
        source: input
        description: "FK -> PlanOption.id; elected option."
      - name: election_event_id
        type: string
        source: input
        description: "FK -> ElectionEvent.id; the approved election that produced this enrollment."
      - name: coverage_status
        type: enum
        source: system
        description: "Coverage dimension, evolving independently of billing_status."
        default: PENDING
        constraints: "one of {PENDING, ACTIVE, SUSPENDED, TERMINATED}"
      - name: billing_status
        type: enum
        source: system
        description: "Premium-billing dimension, evolving independently of coverage_status."
        default: CURRENT
        constraints: "one of {CURRENT, DELINQUENT, LAPSED, REINSTATED}"
      - name: coverage_effective_date
        type: datetime
        source: computed
        description: "Inclusive start of the coverage interval, copied from ElectionEvent.coverage_effective_date."
      - name: coverage_end_date
        type: datetime
        source: system
        description: "EXCLUSIVE end of the coverage interval; null means open-ended."
        default: null
      - name: payer_order
        type: enum
        source: computed
        description: "Medicare secondary payer determination for this coverage."
        constraints: "one of {GROUP_PRIMARY, GROUP_PRIMARY_WORKING_AGED, MEDICARE_PRIMARY}"
      - name: msp_basis_code
        type: enum
        source: computed
        description: "Branch of msp_payer_order_determination that produced payer_order."
        constraints: "one of {NO_OTHER_COVERAGE, ESRD_WITHIN_COORDINATION, ESRD_AFTER_COORDINATION, WORKING_AGED_LARGE_EMPLOYER, WORKING_AGED_SMALL_EMPLOYER, DISABILITY_LARGE_EMPLOYER, DISABILITY_SMALL_EMPLOYER, MEDICARE_PRIMARY_RETIREE_COVERAGE}"
      - name: monthly_retiree_premium_cents
        type: integer
        source: computed
        description: "retiree_share_cents from premium_invoice_assembly steps 1-6, evaluated with no HRA offset."
      - name: consecutive_unpaid_periods
        type: integer
        source: system
        description: "Count of consecutive PremiumInvoice rows on this enrollment that became PAST_DUE without full payment."
        default: 0
      - name: delinquency_first_unpaid_period_start
        type: datetime
        source: system
        description: "billing_period_start of the earliest still-unpaid PAST_DUE invoice, or null."
        default: null
      - name: lapse_date
        type: datetime
        source: system
        description: "Logical-clock instant at which billing_status became LAPSED."
        default: null
      - name: reinstatement_deadline
        type: datetime
        source: computed
        description: "lapse_date + PlanYear.reinstatement_window_days days; null before lapse."
        default: null
      - name: reinstatement_count
        type: integer
        source: system
        description: "Number of times this enrollment has been reinstated."
        default: 0
      - name: termination_reason
        type: string
        source: input
        description: "Free-text reason recorded when coverage_status becomes TERMINATED."
        default: null

  - name: HraAccount
    parent: null
    common_fields: true
    fields:
      - name: retiree_id
        type: string
        source: input
        description: "FK -> Retiree.id; account owner."
      - name: plan_year_id
        type: string
        source: input
        description: "FK -> PlanYear.id; plan year the account funds. (retiree_id, plan_year_id) is unique."
      - name: prior_year_account_id
        type: string
        source: input
        description: "FK -> HraAccount.id; the CLOSED prior-year account whose surviving balance carries over, or null for a first-year account."
        default: null
      - name: covered_months
        type: integer
        source: input
        description: "Whole months of retiree-medical coverage this plan year, used to prorate the annual credit."
        constraints: "0 <= covered_months <= 12"
      - name: annual_credit_cents
        type: integer
        source: computed
        description: "Prorated employer credit for this plan year; see hra_annual_funding_and_carryover."
      - name: carryover_in_cents
        type: integer
        source: computed
        description: "Balance inherited from prior_year_account_id, or 0 when absent."
      - name: funded_cents
        type: integer
        source: computed
        description: "annual_credit_cents + carryover_in_cents; the conserved total of the HRA ledger invariant."
      - name: available_balance_cents
        type: integer
        source: computed
        description: "Unspent, unheld, unforfeited balance available to new claims and premium offsets."
      - name: pending_hold_cents
        type: integer
        source: computed
        description: "Sum of eligible_cents over claims on this account whose status is in {SUBMITTED, PENDING_SUBSTANTIATION, APPROVED}."
        default: 0
      - name: substantiated_paid_cents
        type: integer
        source: computed
        description: "Sum of eligible_cents over claims on this account whose status is PAID."
        default: 0
      - name: premium_offset_cents
        type: integer
        source: computed
        description: "Cumulative HRA dollars applied to PremiumInvoice rows for this retiree and plan year."
        default: 0
      - name: forfeited_cents
        type: integer
        source: computed
        description: "Balance carved off at year-end close because it exceeded the carryover cap."
        default: 0
      - name: status
        type: enum
        source: system
        description: "Account lifecycle; FROZEN is entered by coverage lapse and left by reinstatement."
        default: OPEN
        constraints: "one of {OPEN, FROZEN, CLOSED}"
      - name: closed_at
        type: datetime
        source: system
        description: "Logical-clock instant at which the year-end close ran."
        default: null

  - name: ReimbursementClaim
    parent: null
    common_fields: true
    fields:
      - name: hra_account_id
        type: string
        source: input
        description: "FK -> HraAccount.id; account the claim draws against."
      - name: expense_category
        type: enum
        source: input
        description: "Category of the substantiated expense; drives the final eligible-amount cap."
        constraints: "one of {MEDICARE_PART_B_PREMIUM, MEDIGAP_PREMIUM, PART_D_PREMIUM, EXCHANGE_PREMIUM, DENTAL_VISION_PREMIUM, QUALIFIED_MEDICAL}"
      - name: service_date
        type: string
        source: input
        description: "Date the expense was incurred, YYYY-MM-DD; must fall in the account's plan year."
      - name: submitted_cents
        type: integer
        source: input
        description: "Amount the retiree claims."
        constraints: "> 0"
      - name: documentation_reference
        type: string
        source: input
        description: "Substantiation document reference, or null when none was attached."
        default: null
      - name: provisional_eligible_cents
        type: integer
        source: computed
        description: "PROVISIONAL variant of hra_claim_eligible_amount, frozen at claim creation."
      - name: eligible_cents
        type: integer
        source: computed
        description: "Currently effective eligible amount: the PROVISIONAL variant until review, the FINAL variant once APPROVED."
      - name: status
        type: enum
        source: system
        description: "Claim lifecycle; SUBMITTED and PENDING_SUBSTANTIATION form a documentation cycle."
        default: SUBMITTED
        constraints: "one of {SUBMITTED, PENDING_SUBSTANTIATION, APPROVED, PAID, DENIED, REVERSED}"
      - name: substantiation_resubmit_count
        type: integer
        source: system
        description: "Number of times documentation was resubmitted after a substantiation request."
        default: 0
      - name: denial_reason_code
        type: enum
        source: system
        description: "Reason recorded when the claim lands in DENIED."
        default: null
        constraints: "null or one of {UNSUBSTANTIATED, INELIGIBLE_CATEGORY, ACCOUNT_NOT_OPEN, REVIEWER_DENIAL}"
      - name: created_by_user_id
        type: string
        source: system
        description: "X-User-ID of the actor who submitted this claim; the segregation-of-duties counterparty for review."
        default: null
      - name: reviewed_by_user_id
        type: string
        source: system
        description: "X-User-ID of the HraAdministrator who last reviewed the claim."
        default: null
      - name: paid_at
        type: datetime
        source: system
        description: "Logical-clock instant at which the claim was paid."
        default: null

  - name: PremiumInvoice
    parent: null
    common_fields: true
    fields:
      - name: enrollment_id
        type: string
        source: input
        description: "FK -> Enrollment.id; enrollment being billed."
      - name: billing_period_start
        type: datetime
        source: input
        description: "INCLUSIVE start of the billed period; PremiumInvoice periods are closed intervals [start, end]."
      - name: billing_period_end
        type: datetime
        source: input
        description: "INCLUSIVE end of the billed period; two invoices whose closed intervals share even one endpoint collide."
        constraints: "must be strictly greater than billing_period_start"
      - name: base_premium_cents
        type: integer
        source: computed
        description: "PlanOption.monthly_premium_cents at invoice creation."
      - name: admin_fee_cents
        type: integer
        source: computed
        description: "Administrative fee, computed on base_premium_cents only; see premium_invoice_assembly step 2."
      - name: gross_premium_cents
        type: integer
        source: computed
        description: "base_premium_cents + admin_fee_cents."
      - name: employer_subsidy_bps
        type: integer
        source: computed
        description: "Employer subsidy rate in basis points selected by grandfathered_group with a long-service bump."
      - name: employer_subsidy_cents
        type: integer
        source: computed
        description: "floor(gross_premium_cents * employer_subsidy_bps / 10000)."
      - name: retiree_share_cents
        type: integer
        source: computed
        description: "gross_premium_cents - employer_subsidy_cents."
      - name: hra_applied_cents
        type: integer
        source: computed
        description: "HRA dollars consumed by this invoice; min(HraAccount.available_balance_cents, retiree_share_cents)."
      - name: net_due_cents
        type: integer
        source: computed
        description: "retiree_share_cents - hra_applied_cents; the amount the retiree must remit."
      - name: paid_cents
        type: integer
        source: system
        description: "Cumulative payments applied to this invoice."
        default: 0
      - name: due_date
        type: datetime
        source: computed
        description: "billing_period_start + PREMIUM_DUE_DAYS days."
      - name: past_due_at
        type: datetime
        source: computed
        description: "due_date + PlanYear.premium_grace_period_days days; the daily run marks the invoice PAST_DUE once the clock reaches it."
      - name: status
        type: enum
        source: system
        description: "Invoice lifecycle."
        default: ISSUED
        constraints: "one of {ISSUED, PARTIALLY_PAID, PAID, PAST_DUE, WRITTEN_OFF}"

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:

  - entity: PlanYear
    initial_state: DRAFT
    terminal_states: [ARCHIVED]
    transitions:
      - from: DRAFT
        to: OPEN
        trigger: "POST /retiree-benefits/plan-years/{plan_year_id}/status with to_status=OPEN"
        actor: BenefitsAdmin
        preconditions:
          - "PlanYear.status == DRAFT"
        side_effects:
          - "PlanYear.status = OPEN"
          - "increments PlanYear.version by 1"
      - from: OPEN
        to: CLOSED
        trigger: "POST /retiree-benefits/plan-years/{plan_year_id}/status with to_status=CLOSED"
        actor: BenefitsAdmin
        preconditions:
          - "PlanYear.status == OPEN"
        side_effects:
          - "PlanYear.status = CLOSED"
          - "CASCADE HOP 1 -> HOP 2: every PlanOption with plan_option.plan_year_id == PlanYear.id and status == ACTIVE moves to CLOSED_TO_NEW (processed in created_at ASC order); each such PlanOption.version increments by 1"
          - "CASCADE HOP 2 -> HOP 3: for every PlanOption that HOP 2 just moved to CLOSED_TO_NEW, every ElectionEvent whose requested_plan_option_id equals that option id and whose status is in {SUBMITTED, UNDER_REVIEW} moves to DENIED with denial_reason_code = PLAN_CLOSED (processed in created_at ASC order); each such ElectionEvent.version increments by 1"
          - "increments PlanYear.version by 1"
        note: "HOP 3 is caused by HOP 2, not by the CLOSED transition itself: an ElectionEvent is denied only because its requested option left ACTIVE."
      - from: CLOSED
        to: ARCHIVED
        trigger: "POST /retiree-benefits/plan-years/{plan_year_id}/status with to_status=ARCHIVED"
        actor: BenefitsAdmin
        preconditions:
          - "PlanYear.status == CLOSED"
          - "no HraAccount with hra_account.plan_year_id == PlanYear.id has status == OPEN"
        side_effects:
          - "PlanYear.status = ARCHIVED"
          - "increments PlanYear.version by 1"
        note: "Any to_status value that is not the single legal successor of the current status raises ERR_INVALID_PLAN_YEAR_TRANSITION."

  - entity: Retiree
    initial_state: "UNDETERMINED x PRE_MEDICARE"
    terminal_states: []
    transitions:
      - from: "eligibility_status=UNDETERMINED"
        to: "eligibility_status=ELIGIBLE or eligibility_status=INELIGIBLE"
        trigger: "POST /retiree-benefits/eligibility-determinations/{determination_id}/certify"
        actor: EligibilityAnalyst
        preconditions:
          - "EligibilityDetermination.status == DRAFT"
          - "EligibilityDetermination.retiree_id == Retiree.id"
        side_effects:
          - "Retiree.eligibility_status = EligibilityDetermination.outcome"
          - "increments Retiree.version by 1"
        note: "Dimension A. medicare_status is untouched by this transition."
      - from: "eligibility_status=ELIGIBLE"
        to: "eligibility_status=INELIGIBLE"
        trigger: "POST /retiree-benefits/eligibility-determinations/{determination_id}/appeal-decision with decision=REVERSE"
        actor: ComplianceOfficer
        preconditions:
          - "EligibilityDetermination.status == UNDER_APPEAL"
          - "EligibilityDetermination.outcome == ELIGIBLE"
        side_effects:
          - "EligibilityDetermination.outcome = INELIGIBLE"
          - "Retiree.eligibility_status = INELIGIBLE"
          - "increments Retiree.version by 1"
        note: "Dimension A cycle: ELIGIBLE -> INELIGIBLE -> ELIGIBLE is reachable by successive appeal reversals."
      - from: "eligibility_status=INELIGIBLE"
        to: "eligibility_status=ELIGIBLE"
        trigger: "POST /retiree-benefits/eligibility-determinations/{determination_id}/appeal-decision with decision=REVERSE"
        actor: ComplianceOfficer
        preconditions:
          - "EligibilityDetermination.status == UNDER_APPEAL"
          - "EligibilityDetermination.outcome == INELIGIBLE"
        side_effects:
          - "EligibilityDetermination.outcome = ELIGIBLE"
          - "Retiree.eligibility_status = ELIGIBLE"
          - "increments Retiree.version by 1"
      - from: "medicare_status=PRE_MEDICARE"
        to: "medicare_status=MEDICARE_ELIGIBLE_NOT_ENROLLED"
        trigger: "PATCH /retiree-benefits/retirees/{retiree_id} with medicare_status=MEDICARE_ELIGIBLE_NOT_ENROLLED"
        actor: BenefitsAdmin
        preconditions:
          - "Retiree.medicare_status == PRE_MEDICARE"
        side_effects:
          - "Retiree.medicare_status = MEDICARE_ELIGIBLE_NOT_ENROLLED"
          - "recomputes msp_payer_order_determination for every Enrollment whose retiree_id == Retiree.id and coverage_status is in {PENDING, ACTIVE, SUSPENDED}; each such Enrollment.version increments by 1"
          - "increments Retiree.version by 1"
        note: "Dimension B. eligibility_status is untouched by this transition."
      - from: "medicare_status=MEDICARE_ELIGIBLE_NOT_ENROLLED"
        to: "medicare_status=MEDICARE_ENROLLED"
        trigger: "PATCH /retiree-benefits/retirees/{retiree_id} with medicare_status=MEDICARE_ENROLLED and medicare_part_b_effective_date set"
        actor: BenefitsAdmin
        preconditions:
          - "Retiree.medicare_status is in {MEDICARE_ELIGIBLE_NOT_ENROLLED, MEDICARE_WAIVED}"
          - "the request supplies a non-null medicare_part_b_effective_date, or Retiree.medicare_part_b_effective_date is already non-null"
        side_effects:
          - "Retiree.medicare_status = MEDICARE_ENROLLED"
          - "recomputes msp_payer_order_determination for every Enrollment whose retiree_id == Retiree.id and coverage_status is in {PENDING, ACTIVE, SUSPENDED}; each such Enrollment.version increments by 1"
          - "increments Retiree.version by 1"
      - from: "medicare_status=MEDICARE_ELIGIBLE_NOT_ENROLLED"
        to: "medicare_status=MEDICARE_WAIVED"
        trigger: "PATCH /retiree-benefits/retirees/{retiree_id} with medicare_status=MEDICARE_WAIVED"
        actor: BenefitsAdmin
        preconditions:
          - "Retiree.medicare_status == MEDICARE_ELIGIBLE_NOT_ENROLLED"
        side_effects:
          - "Retiree.medicare_status = MEDICARE_WAIVED"
          - "recomputes msp_payer_order_determination for every Enrollment whose retiree_id == Retiree.id and coverage_status is in {PENDING, ACTIVE, SUSPENDED}; each such Enrollment.version increments by 1"
          - "increments Retiree.version by 1"

  - entity: PlanOption
    initial_state: "DRAFT x NOT_STARTED"
    terminal_states: [RETIRED]
    transitions:
      - from: "status=DRAFT"
        to: "status=ACTIVE"
        trigger: "POST /retiree-benefits/plan-options/{plan_option_id}/activate"
        actor: BenefitsAdmin
        preconditions:
          - "PlanOption.status == DRAFT"
          - "PlanYear(PlanOption.plan_year_id).status is in {DRAFT, OPEN}"
        side_effects:
          - "PlanOption.status = ACTIVE"
          - "increments PlanOption.version by 1"
        note: "Dimension A. subsidy_certification_status is untouched."
      - from: "status=ACTIVE"
        to: "status=CLOSED_TO_NEW"
        trigger: "system cascade from PlanYear OPEN -> CLOSED"
        actor: system
        preconditions:
          - "PlanOption.status == ACTIVE"
        side_effects:
          - "PlanOption.status = CLOSED_TO_NEW"
          - "increments PlanOption.version by 1"
      - from: "status in {ACTIVE, CLOSED_TO_NEW}"
        to: "status=RETIRED"
        trigger: "system cascade during POST /_ops/daily-run when pending_change_type == PLAN_TERMINATION and pending_change_effective_date <= logical clock"
        actor: system
        preconditions:
          - "PlanOption.change_notice_issued_at is not null"
          - "PlanOption.pending_change_effective_date <= logical clock"
        side_effects:
          - "PlanOption.status = RETIRED"
          - "PlanOption.pending_change_type = null, pending_change_effective_date = null, pending_new_monthly_premium_cents = null"
          - "CASCADE: every Enrollment whose plan_option_id == PlanOption.id and coverage_status is in {PENDING, ACTIVE, SUSPENDED} moves to coverage_status = TERMINATED with coverage_end_date = logical clock and termination_reason = 'PLAN_TERMINATION' (processed in created_at ASC order)"
          - "PlanOption.enrolled_count = 0"
          - "increments PlanOption.version by 1"
      - from: "subsidy_certification_status in {NOT_STARTED, REJECTED}"
        to: "subsidy_certification_status=ATTESTED"
        trigger: "POST /retiree-benefits/plan-options/{plan_option_id}/attest"
        actor: Actuary
        preconditions:
          - "PlanOption.subsidy_vehicle is in {RDS, EGWP}"
          - "PlanOption.status is in {DRAFT, ACTIVE, CLOSED_TO_NEW}"
          - "actuarial_equivalence_test gross test passes"
          - "actuarial_equivalence_test net test passes when PlanOption.subsidy_vehicle == EGWP"
        side_effects:
          - "PlanOption.rx_gross_value_bps and rx_net_value_bps are overwritten with the attested values"
          - "PlanOption.gross_test_passed, net_test_passed, equivalence_margin_bps recomputed by actuarial_equivalence_test"
          - "PlanOption.attested_by_user_id = X-User-ID of the acting Actuary"
          - "PlanOption.subsidy_certification_status = ATTESTED"
          - "increments PlanOption.version by 1"
        note: "Dimension B. status is untouched. REJECTED -> ATTESTED closes the re-attestation cycle."
      - from: "subsidy_certification_status=ATTESTED"
        to: "subsidy_certification_status=CERTIFIED"
        trigger: "POST /retiree-benefits/plan-options/{plan_option_id}/subsidy-certification with decision=CERTIFY"
        actor: ComplianceOfficer
        preconditions:
          - "PlanOption.subsidy_certification_status == ATTESTED"
          - "X-User-ID of the acting ComplianceOfficer != PlanOption.attested_by_user_id"
        side_effects:
          - "PlanOption.subsidy_certification_status = CERTIFIED"
          - "PlanOption.certified_by_user_id = X-User-ID of the acting ComplianceOfficer"
          - "increments PlanOption.version by 1"
      - from: "subsidy_certification_status=ATTESTED"
        to: "subsidy_certification_status=REJECTED"
        trigger: "POST /retiree-benefits/plan-options/{plan_option_id}/subsidy-certification with decision=REJECT"
        actor: ComplianceOfficer
        preconditions:
          - "PlanOption.subsidy_certification_status == ATTESTED"
          - "X-User-ID of the acting ComplianceOfficer != PlanOption.attested_by_user_id"
        side_effects:
          - "PlanOption.subsidy_certification_status = REJECTED"
          - "PlanOption.certified_by_user_id = X-User-ID of the acting ComplianceOfficer"
          - "increments PlanOption.version by 1"

  - entity: EligibilityDetermination
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: CERTIFIED
        trigger: "POST /retiree-benefits/eligibility-determinations/{determination_id}/certify"
        actor: EligibilityAnalyst
        preconditions:
          - "EligibilityDetermination.status == DRAFT"
          - "PlanYear(EligibilityDetermination.plan_year_id).status is in {DRAFT, OPEN}"
        side_effects:
          - "EligibilityDetermination.status = CERTIFIED"
          - "EligibilityDetermination.certified_by_user_id = X-User-ID of the acting EligibilityAnalyst"
          - "EligibilityDetermination.certified_at = logical clock"
          - "Retiree.eligibility_status = EligibilityDetermination.outcome; increments Retiree.version by 1"
          - "PlanYear.version increments by 1 (measured cohort membership changed)"
          - "increments EligibilityDetermination.version by 1"
      - from: CERTIFIED
        to: UNDER_APPEAL
        trigger: "POST /retiree-benefits/eligibility-determinations/{determination_id}/appeal"
        actor: "Retiree | EnrollmentCounselor"
        preconditions:
          - "EligibilityDetermination.status == CERTIFIED"
          - "when acting as Retiree, X-User-ID == EligibilityDetermination.retiree_id"
        side_effects:
          - "EligibilityDetermination.status = UNDER_APPEAL"
          - "EligibilityDetermination.appeal_reason = supplied appeal_reason"
          - "increments EligibilityDetermination.version by 1"
      - from: UNDER_APPEAL
        to: CERTIFIED
        trigger: "POST /retiree-benefits/eligibility-determinations/{determination_id}/appeal-decision with decision=UPHOLD"
        actor: ComplianceOfficer
        preconditions:
          - "EligibilityDetermination.status == UNDER_APPEAL"
          - "X-User-ID of the acting ComplianceOfficer != EligibilityDetermination.certified_by_user_id"
        side_effects:
          - "EligibilityDetermination.status = CERTIFIED"
          - "EligibilityDetermination.appeal_decision = UPHOLD"
          - "EligibilityDetermination.appeal_decided_by_user_id = X-User-ID of the acting ComplianceOfficer"
          - "EligibilityDetermination.certified_at = logical clock"
          - "outcome unchanged; Retiree.eligibility_status unchanged"
          - "increments EligibilityDetermination.version by 1"
        note: "Revision cycle CERTIFIED -> UNDER_APPEAL -> CERTIFIED; an unbounded number of appeal rounds is permitted."
      - from: UNDER_APPEAL
        to: CERTIFIED
        trigger: "POST /retiree-benefits/eligibility-determinations/{determination_id}/appeal-decision with decision=REVERSE"
        actor: ComplianceOfficer
        preconditions:
          - "EligibilityDetermination.status == UNDER_APPEAL"
          - "X-User-ID of the acting ComplianceOfficer != EligibilityDetermination.certified_by_user_id"
        side_effects:
          - "EligibilityDetermination.status = CERTIFIED"
          - "EligibilityDetermination.appeal_decision = REVERSE"
          - "EligibilityDetermination.outcome flips: ELIGIBLE becomes INELIGIBLE and INELIGIBLE becomes ELIGIBLE"
          - "EligibilityDetermination.appeal_decided_by_user_id = X-User-ID of the acting ComplianceOfficer"
          - "EligibilityDetermination.certified_at = logical clock"
          - "Retiree.eligibility_status = the flipped outcome; increments Retiree.version by 1"
          - "increments EligibilityDetermination.version by 1"
        note: "Same (from, to) pair as the UPHOLD transition but a strictly larger side-effect set: the branch is selected by the decision field."
      - from: "CERTIFIED | UNDER_APPEAL | DRAFT"
        to: SUPERSEDED
        trigger: "system cascade from POST /retiree-benefits/eligibility-determinations creating a newer determination for the same (retiree_id, plan_year_id)"
        actor: system
        preconditions:
          - "EligibilityDetermination.status != SUPERSEDED"
          - "the newly created determination has the same retiree_id and plan_year_id"
        side_effects:
          - "EligibilityDetermination.status = SUPERSEDED"
          - "increments EligibilityDetermination.version by 1"
        note: "Terminal. A SUPERSEDED determination accepts no certify, appeal or appeal-decision call."

  - entity: ElectionEvent
    initial_state: SUBMITTED
    terminal_states: [APPROVED, DENIED]
    transitions:
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /retiree-benefits/election-events/{election_event_id}/review"
        actor: EnrollmentCounselor
        preconditions:
          - "ElectionEvent.status == SUBMITTED"
          - "PlanYear(ElectionEvent.plan_year_id).status == OPEN"
        side_effects:
          - "ElectionEvent.status = UNDER_REVIEW"
          - "ElectionEvent.reviewed_by_user_id = X-User-ID of the acting EnrollmentCounselor"
          - "increments ElectionEvent.version by 1"
      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /retiree-benefits/election-events/{election_event_id}/decision with decision=APPROVE"
        actor: EnrollmentCounselor
        preconditions:
          - "ElectionEvent.status == UNDER_REVIEW"
          - "PlanOption(ElectionEvent.requested_plan_option_id).status == ACTIVE"
          - "there exists an EligibilityDetermination with retiree_id == ElectionEvent.retiree_id and plan_year_id == ElectionEvent.plan_year_id and status == CERTIFIED (else ERR_DETERMINATION_NOT_CERTIFIED)"
          - "that CERTIFIED determination has outcome == ELIGIBLE (else ERR_NOT_ELIGIBLE_FOR_RETIREE_MEDICAL)"
          - "when PlanOption.coverage_class == MEDICARE_GROUP_WRAP, PlanOption.subsidy_certification_status == CERTIFIED (else ERR_SUBSIDY_NOT_CERTIFIED)"
          - "enrollment_coverage_interval_overlap finds no colliding Enrollment for ElectionEvent.retiree_id (else ERR_DUPLICATE_ENROLLMENT_PERIOD)"
        side_effects:
          - "ElectionEvent.status = APPROVED"
          - "creates one Enrollment with retiree_id, plan_year_id, plan_option_id = requested_plan_option_id, election_event_id = this ElectionEvent.id"
          - "the new Enrollment.coverage_effective_date = ElectionEvent.coverage_effective_date"
          - "the new Enrollment.coverage_status = ACTIVE when logical clock >= coverage_effective_date, otherwise PENDING"
          - "the new Enrollment.billing_status = CURRENT"
          - "runs msp_payer_order_determination to set the new Enrollment.payer_order and msp_basis_code"
          - "runs premium_invoice_assembly steps 1-6 with no HRA offset to set the new Enrollment.monthly_retiree_premium_cents"
          - "PlanOption.enrolled_count increments by 1; increments PlanOption.version by 1"
          - "ElectionEvent.resulting_enrollment_id = the new Enrollment.id"
          - "increments ElectionEvent.version by 1"
        note: "Fork branch A. Compare with the DENY branch below: the two branches share (from) but have disjoint side-effect sets."
      - from: UNDER_REVIEW
        to: DENIED
        trigger: "POST /retiree-benefits/election-events/{election_event_id}/decision with decision=DENY"
        actor: EnrollmentCounselor
        preconditions:
          - "ElectionEvent.status == UNDER_REVIEW"
        side_effects:
          - "ElectionEvent.status = DENIED"
          - "ElectionEvent.denial_reason_code = COUNSELOR_DENIAL"
          - "no Enrollment is created; resulting_enrollment_id stays null"
          - "PlanOption.enrolled_count unchanged"
          - "increments ElectionEvent.version by 1"
        note: "Fork branch B. No eligibility, subsidy-certification or overlap precondition applies, because nothing is created."
      - from: "SUBMITTED | UNDER_REVIEW"
        to: DENIED
        trigger: "system cascade from PlanYear OPEN -> CLOSED (via PlanOption ACTIVE -> CLOSED_TO_NEW)"
        actor: system
        preconditions:
          - "ElectionEvent.status is in {SUBMITTED, UNDER_REVIEW}"
          - "PlanOption(ElectionEvent.requested_plan_option_id) was just moved to CLOSED_TO_NEW by the same request"
        side_effects:
          - "ElectionEvent.status = DENIED"
          - "ElectionEvent.denial_reason_code = PLAN_CLOSED"
          - "increments ElectionEvent.version by 1"

  - entity: Enrollment
    initial_state: "PENDING x CURRENT"
    terminal_states: ["coverage_status=TERMINATED"]
    transitions:
      - from: "coverage_status=PENDING"
        to: "coverage_status=ACTIVE"
        trigger: "system cascade during POST /_ops/daily-run when coverage_effective_date <= logical clock"
        actor: system
        preconditions:
          - "Enrollment.coverage_status == PENDING"
          - "Enrollment.coverage_effective_date <= logical clock"
        side_effects:
          - "Enrollment.coverage_status = ACTIVE"
          - "increments Enrollment.version by 1"
        note: "Dimension A. billing_status is untouched."
      - from: "coverage_status=ACTIVE"
        to: "coverage_status=SUSPENDED"
        trigger: "system cascade during POST /_ops/daily-run when an invoice on this enrollment becomes PAST_DUE"
        actor: system
        preconditions:
          - "Enrollment.coverage_status == ACTIVE"
          - "Enrollment.billing_status just became DELINQUENT in the same run"
        side_effects:
          - "Enrollment.coverage_status = SUSPENDED"
          - "increments Enrollment.version by 1"
        note: "CASCADE HOP 3 of the delinquency chain: caused by the billing_status change (HOP 2), which was itself caused by the invoice moving to PAST_DUE (HOP 1)."
      - from: "coverage_status=SUSPENDED"
        to: "coverage_status=ACTIVE"
        trigger: "POST /retiree-benefits/premium-invoices/{invoice_id}/payments that clears the last unpaid PAST_DUE invoice"
        actor: "Retiree | BillingClerk"
        preconditions:
          - "Enrollment.coverage_status == SUSPENDED"
          - "Enrollment.billing_status == DELINQUENT"
          - "after this payment, no PremiumInvoice with enrollment_id == Enrollment.id has status == PAST_DUE"
        side_effects:
          - "Enrollment.billing_status = CURRENT"
          - "Enrollment.consecutive_unpaid_periods = 0"
          - "Enrollment.delinquency_first_unpaid_period_start = null"
          - "Enrollment.coverage_status = ACTIVE"
          - "increments Enrollment.version by 1"
        note: "Dimension A cycle ACTIVE -> SUSPENDED -> ACTIVE."
      - from: "coverage_status in {PENDING, ACTIVE, SUSPENDED}"
        to: "coverage_status=TERMINATED"
        trigger: "POST /retiree-benefits/enrollments/{enrollment_id}/terminate"
        actor: "BenefitsAdmin | EnrollmentCounselor"
        preconditions:
          - "Enrollment.coverage_status != TERMINATED"
        side_effects:
          - "Enrollment.coverage_status = TERMINATED"
          - "Enrollment.coverage_end_date = logical clock"
          - "Enrollment.termination_reason = supplied termination_reason"
          - "PlanOption(Enrollment.plan_option_id).enrolled_count decrements by 1; increments PlanOption.version by 1"
          - "increments Enrollment.version by 1"
        note: "Compensating action for the election-approve headcount increment; the enrollment_headcount_conservation invariant must be restored exactly."
      - from: "billing_status in {CURRENT, REINSTATED}"
        to: "billing_status=DELINQUENT"
        trigger: "system cascade during POST /_ops/daily-run when a PremiumInvoice on this enrollment moves ISSUED|PARTIALLY_PAID -> PAST_DUE"
        actor: system
        preconditions:
          - "Enrollment.billing_status is in {CURRENT, REINSTATED}"
          - "a PremiumInvoice with enrollment_id == Enrollment.id just moved to PAST_DUE in the same run"
        side_effects:
          - "Enrollment.consecutive_unpaid_periods increments by 1"
          - "Enrollment.delinquency_first_unpaid_period_start = that invoice's billing_period_start when it was previously null"
          - "Enrollment.billing_status = DELINQUENT"
          - "increments Enrollment.version by 1"
        note: "CASCADE HOP 2 of the delinquency chain. Dimension B; coverage_status is changed by the separate HOP 3 transition."
      - from: "billing_status=DELINQUENT"
        to: "billing_status=LAPSED"
        trigger: "system cascade during POST /_ops/daily-run when consecutive_unpaid_periods reaches LAPSE_THRESHOLD_PERIODS"
        actor: system
        preconditions:
          - "Enrollment.billing_status == DELINQUENT"
          - "Enrollment.consecutive_unpaid_periods >= 3"
        side_effects:
          - "Enrollment.billing_status = LAPSED"
          - "Enrollment.lapse_date = logical clock"
          - "Enrollment.reinstatement_deadline = logical clock + PlanYear(Enrollment.plan_year_id).reinstatement_window_days days"
          - "Enrollment.coverage_status = TERMINATED and coverage_end_date = logical clock and termination_reason = 'PREMIUM_LAPSE'; PlanOption.enrolled_count decrements by 1 and PlanOption.version increments by 1 (HOP 4)"
          - "every PremiumInvoice with enrollment_id == Enrollment.id and status == PAST_DUE moves to WRITTEN_OFF (created_at ASC order)"
          - "CASCADE HOP 5: the HraAccount with retiree_id == Enrollment.retiree_id and plan_year_id == Enrollment.plan_year_id and status == OPEN moves to FROZEN; HraAccount.version increments by 1"
          - "CASCADE HOP 6: for that FROZEN HraAccount, every ReimbursementClaim with status in {SUBMITTED, PENDING_SUBSTANTIATION, APPROVED} moves to DENIED with denial_reason_code = ACCOUNT_NOT_OPEN; its eligible_cents is released from pending_hold_cents back into available_balance_cents (created_at ASC order); each such ReimbursementClaim.version increments by 1"
          - "increments Enrollment.version by 1"
        note: "HOP 5 is caused by HOP 4 (coverage terminated), and HOP 6 is caused by HOP 5 (account frozen). Neither is caused directly by the invoice becoming PAST_DUE."
      - from: "billing_status=LAPSED"
        to: "billing_status=REINSTATED"
        trigger: "POST /retiree-benefits/enrollments/{enrollment_id}/reinstate"
        actor: BillingClerk
        preconditions:
          - "Enrollment.billing_status == LAPSED"
          - "logical clock <= Enrollment.reinstatement_deadline (else ERR_REINSTATEMENT_WINDOW_EXPIRED)"
          - "no PremiumInvoice with enrollment_id == Enrollment.id has status in {ISSUED, PARTIALLY_PAID, PAST_DUE} (else ERR_OUTSTANDING_PREMIUM_BALANCE)"
        side_effects:
          - "Enrollment.billing_status = REINSTATED"
          - "Enrollment.consecutive_unpaid_periods = 0"
          - "Enrollment.delinquency_first_unpaid_period_start = null"
          - "Enrollment.reinstatement_count increments by 1"
          - "Enrollment.coverage_status = ACTIVE and coverage_end_date = null and termination_reason = null"
          - "PlanOption(Enrollment.plan_option_id).enrolled_count increments by 1; increments PlanOption.version by 1"
          - "the HraAccount with retiree_id == Enrollment.retiree_id and plan_year_id == Enrollment.plan_year_id and status == FROZEN moves to OPEN; HraAccount.version increments by 1"
          - "runs msp_payer_order_determination to refresh Enrollment.payer_order and msp_basis_code"
          - "increments Enrollment.version by 1"
        note: "Dimension B cycle CURRENT -> DELINQUENT -> LAPSED -> REINSTATED -> DELINQUENT is reachable; a REINSTATED enrollment re-enters DELINQUENT on the next PAST_DUE invoice."

  - entity: HraAccount
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: FROZEN
        trigger: "system cascade from Enrollment billing_status DELINQUENT -> LAPSED"
        actor: system
        preconditions:
          - "HraAccount.status == OPEN"
          - "HraAccount.retiree_id and plan_year_id match the lapsing Enrollment"
        side_effects:
          - "HraAccount.status = FROZEN"
          - "increments HraAccount.version by 1"
      - from: FROZEN
        to: OPEN
        trigger: "POST /retiree-benefits/enrollments/{enrollment_id}/reinstate"
        actor: BillingClerk
        preconditions:
          - "HraAccount.status == FROZEN"
          - "HraAccount.retiree_id and plan_year_id match the reinstated Enrollment"
        side_effects:
          - "HraAccount.status = OPEN"
          - "increments HraAccount.version by 1"
        note: "Cycle OPEN -> FROZEN -> OPEN."
      - from: OPEN
        to: CLOSED
        trigger: "POST /retiree-benefits/hra-accounts/{hra_account_id}/close-year"
        actor: HraAdministrator
        preconditions:
          - "HraAccount.status == OPEN"
          - "PlanYear(HraAccount.plan_year_id).status is in {OPEN, CLOSED}"
        side_effects:
          - "CASCADE: every ReimbursementClaim on this account with status in {SUBMITTED, PENDING_SUBSTANTIATION, APPROVED} moves to DENIED with denial_reason_code = ACCOUNT_NOT_OPEN; its eligible_cents returns from pending_hold_cents to available_balance_cents (created_at ASC order); each such claim's version increments by 1"
          - "runs hra_year_end_forfeiture: forfeited_cents and available_balance_cents are rewritten"
          - "HraAccount.status = CLOSED, closed_at = logical clock"
          - "increments HraAccount.version by 1"
        note: "Terminal. hra_ledger_conservation must still hold after the close."

  - entity: ReimbursementClaim
    initial_state: SUBMITTED
    terminal_states: [PAID, DENIED, REVERSED]
    transitions:
      - from: SUBMITTED
        to: PENDING_SUBSTANTIATION
        trigger: "POST /retiree-benefits/reimbursement-claims/{claim_id}/review with decision=REQUEST_SUBSTANTIATION"
        actor: HraAdministrator
        preconditions:
          - "ReimbursementClaim.status == SUBMITTED"
          - "HraAccount(ReimbursementClaim.hra_account_id).status == OPEN"
        side_effects:
          - "ReimbursementClaim.status = PENDING_SUBSTANTIATION"
          - "ReimbursementClaim.reviewed_by_user_id = X-User-ID of the acting HraAdministrator"
          - "eligible_cents stays held in HraAccount.pending_hold_cents"
          - "increments ReimbursementClaim.version by 1"
      - from: PENDING_SUBSTANTIATION
        to: SUBMITTED
        trigger: "POST /retiree-benefits/reimbursement-claims/{claim_id}/substantiation"
        actor: "Retiree | EnrollmentCounselor"
        preconditions:
          - "ReimbursementClaim.status == PENDING_SUBSTANTIATION"
          - "HraAccount(ReimbursementClaim.hra_account_id).status == OPEN"
          - "when acting as Retiree, X-User-ID == HraAccount(ReimbursementClaim.hra_account_id).retiree_id"
        side_effects:
          - "ReimbursementClaim.status = SUBMITTED"
          - "ReimbursementClaim.documentation_reference = supplied documentation_reference"
          - "ReimbursementClaim.substantiation_resubmit_count increments by 1"
          - "increments ReimbursementClaim.version by 1"
        note: "Documentation cycle SUBMITTED -> PENDING_SUBSTANTIATION -> SUBMITTED, repeatable without bound."
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /retiree-benefits/reimbursement-claims/{claim_id}/review with decision=APPROVE"
        actor: HraAdministrator
        preconditions:
          - "ReimbursementClaim.status == SUBMITTED"
          - "HraAccount(ReimbursementClaim.hra_account_id).status == OPEN"
          - "ReimbursementClaim.documentation_reference is not null (else ERR_INVALID_CLAIM_STATE)"
        side_effects:
          - "recomputes hra_claim_eligible_amount under the FINAL variant and writes ReimbursementClaim.eligible_cents"
          - "HraAccount.pending_hold_cents adjusts by (FINAL eligible_cents - previously held amount); the difference returns to available_balance_cents when FINAL is smaller"
          - "ReimbursementClaim.status = APPROVED"
          - "ReimbursementClaim.reviewed_by_user_id = X-User-ID of the acting HraAdministrator"
          - "increments HraAccount.version by 1"
          - "increments ReimbursementClaim.version by 1"
      - from: SUBMITTED
        to: DENIED
        trigger: "POST /retiree-benefits/reimbursement-claims/{claim_id}/review with decision=DENY"
        actor: HraAdministrator
        preconditions:
          - "ReimbursementClaim.status == SUBMITTED"
          - "HraAccount(ReimbursementClaim.hra_account_id).status == OPEN"
        side_effects:
          - "ReimbursementClaim.status = DENIED"
          - "ReimbursementClaim.denial_reason_code = supplied denial_reason_code, defaulting to REVIEWER_DENIAL"
          - "HraAccount.pending_hold_cents decreases by eligible_cents; available_balance_cents increases by the same amount"
          - "increments HraAccount.version by 1"
          - "increments ReimbursementClaim.version by 1"
      - from: "SUBMITTED | PENDING_SUBSTANTIATION | APPROVED"
        to: DENIED
        trigger: "system cascade from HraAccount OPEN -> FROZEN or OPEN -> CLOSED"
        actor: system
        preconditions:
          - "ReimbursementClaim.status is in {SUBMITTED, PENDING_SUBSTANTIATION, APPROVED}"
        side_effects:
          - "ReimbursementClaim.status = DENIED with denial_reason_code = ACCOUNT_NOT_OPEN"
          - "HraAccount.pending_hold_cents decreases by eligible_cents; available_balance_cents increases by the same amount"
          - "increments ReimbursementClaim.version by 1"
      - from: APPROVED
        to: PAID
        trigger: "POST /retiree-benefits/reimbursement-claims/{claim_id}/settlement with action=PAY"
        actor: BillingClerk
        preconditions:
          - "ReimbursementClaim.status == APPROVED"
          - "HraAccount(ReimbursementClaim.hra_account_id).status == OPEN"
        side_effects:
          - "ReimbursementClaim.status = PAID, paid_at = logical clock"
          - "HraAccount.pending_hold_cents decreases by eligible_cents; HraAccount.substantiated_paid_cents increases by the same amount; available_balance_cents unchanged"
          - "increments HraAccount.version by 1"
          - "increments ReimbursementClaim.version by 1"
      - from: PAID
        to: REVERSED
        trigger: "POST /retiree-benefits/reimbursement-claims/{claim_id}/settlement with action=REVERSE"
        actor: BillingClerk
        preconditions:
          - "ReimbursementClaim.status == PAID"
          - "HraAccount(ReimbursementClaim.hra_account_id).status == OPEN"
        side_effects:
          - "ReimbursementClaim.status = REVERSED"
          - "HraAccount.substantiated_paid_cents decreases by eligible_cents; HraAccount.available_balance_cents increases by the same amount"
          - "increments HraAccount.version by 1"
          - "increments ReimbursementClaim.version by 1"
        note: "Compensating action for PAY; hra_ledger_conservation must hold before and after, and available_balance_cents must return to its pre-claim value when no other activity intervened."

  - entity: PremiumInvoice
    initial_state: ISSUED
    terminal_states: [PAID, WRITTEN_OFF]
    transitions:
      - from: ISSUED
        to: PAID
        trigger: "POST /retiree-benefits/premium-invoices/{invoice_id}/payments with amount_cents == net_due_cents - paid_cents, or invoice creation when net_due_cents == 0"
        actor: "Retiree | BillingClerk | system"
        preconditions:
          - "PremiumInvoice.status is in {ISSUED, PARTIALLY_PAID, PAST_DUE}"
          - "PremiumInvoice.paid_cents + amount_cents <= PremiumInvoice.net_due_cents (else ERR_PAYMENT_EXCEEDS_BALANCE)"
        side_effects:
          - "PremiumInvoice.paid_cents increases by amount_cents"
          - "PremiumInvoice.status = PAID"
          - "increments PremiumInvoice.version by 1"
      - from: ISSUED
        to: PARTIALLY_PAID
        trigger: "POST /retiree-benefits/premium-invoices/{invoice_id}/payments with 0 < amount_cents < net_due_cents - paid_cents"
        actor: "Retiree | BillingClerk"
        preconditions:
          - "PremiumInvoice.status is in {ISSUED, PARTIALLY_PAID, PAST_DUE}"
        side_effects:
          - "PremiumInvoice.paid_cents increases by amount_cents"
          - "PremiumInvoice.status = PARTIALLY_PAID"
          - "increments PremiumInvoice.version by 1"
      - from: "ISSUED | PARTIALLY_PAID"
        to: PAST_DUE
        trigger: "system cascade during POST /_ops/daily-run when past_due_at <= logical clock"
        actor: system
        preconditions:
          - "PremiumInvoice.status is in {ISSUED, PARTIALLY_PAID}"
          - "PremiumInvoice.past_due_at <= logical clock"
        side_effects:
          - "PremiumInvoice.status = PAST_DUE"
          - "CASCADE HOP 2: the owning Enrollment enters billing_status DELINQUENT (see Enrollment transitions)"
          - "increments PremiumInvoice.version by 1"
        note: "CASCADE HOP 1 of the delinquency chain."
      - from: PAST_DUE
        to: WRITTEN_OFF
        trigger: "system cascade from Enrollment billing_status DELINQUENT -> LAPSED"
        actor: system
        preconditions:
          - "PremiumInvoice.status == PAST_DUE"
        side_effects:
          - "PremiumInvoice.status = WRITTEN_OFF"
          - "increments PremiumInvoice.version by 1"
        note: "Terminal. A WRITTEN_OFF invoice is excluded from the billing-period overlap candidate set."

# =============================================================================
# 1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: eligibility-determination-create-stale-retiree
    parent_entity: Retiree
    write_endpoint: "POST /retiree-benefits/eligibility-determinations"
    occ_field: "expected_retiree_version"
    description: |
      Creating an EligibilityDetermination against a Retiree whose version has
      advanced since the client last observed it is rejected with a stale-version
      error. A new determination legitimately supersedes the prior CERTIFIED
      determination for the same (retiree_id, plan_year_id), so the second create
      would otherwise succeed on its own terms; the OCC check on Retiree.version
      is what forces the writer to re-read the retiree (whose eligibility_status,
      credited_service_months or determination_sequence another writer may have
      already moved) before superseding anything.
    error_id: ERR_STALE_RETIREE_VERSION
    http_status: 412

  - rule_id: reimbursement-claim-create-stale-hra-account
    parent_entity: HraAccount
    write_endpoint: "POST /retiree-benefits/reimbursement-claims"
    occ_field: "expected_hra_account_version"
    description: |
      Creating a ReimbursementClaim against an HraAccount whose version has
      advanced since the client last observed it is rejected with a stale-version
      error. A claim draws down available_balance_cents, and a claim submitted on
      a stale view of that balance would be admitted with a provisional eligible
      amount computed from a balance that no longer exists; the OCC check on
      HraAccount.version reduces this to a deterministic stale-version rejection.
    error_id: ERR_STALE_HRA_ACCOUNT_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:

  - name: retiree_grandfather_group_assignment
    trigger: "POST /retiree-benefits/retirees (writes Retiree.grandfathered_group; never recomputed afterward)"
    algorithm: threshold
    formula: |
      if Retiree.hire_date < GRANDFATHER_CUTOFF_A:          group = GRANDFATHERED_A
      elif Retiree.hire_date < GRANDFATHER_CUTOFF_B:        group = TRANSITION_B
      else:                                                 group = STANDARD_C
      # Boundaries are half-open on the LOW side: hire_date exactly equal to
      # GRANDFATHER_CUTOFF_A lands in TRANSITION_B, and hire_date exactly equal to
      # GRANDFATHER_CUTOFF_B lands in STANDARD_C.
    input_set: "The single Retiree row being created. hire_date is compared as a calendar date, not an instant."
    constants:
      GRANDFATHER_CUTOFF_A: "1993-01-01"
      GRANDFATHER_CUTOFF_B: "2005-01-01"
    precision: "exact integer/date comparison; no rounding"

  - name: eligibility_rule_evaluation
    trigger: "POST /retiree-benefits/eligibility-determinations (writes rule_set_code, age_years_at_retirement, service_years, points, outcome, grandfathered_group on the new EligibilityDetermination and Retiree.eligibility_points)"
    algorithm: threshold
    formula: |
      age_years_at_retirement = whole completed years from Retiree.birth_date to
          Retiree.retirement_date (calendar-year difference minus 1 when the
          (month, day) of retirement_date is strictly before that of birth_date)
      service_years = floor(Retiree.credited_service_months / 12)
      points        = age_years_at_retirement + service_years

      if Retiree.grandfathered_group == GRANDFATHERED_A:
          rule_set_code = RULE_OF_75_GRANDFATHERED
          outcome = ELIGIBLE if (points >= RULE_OF_75_POINTS
                                 and age_years_at_retirement >= GRANDFATHERED_MIN_AGE
                                 and service_years >= GRANDFATHERED_MIN_SERVICE_YEARS)
                    else INELIGIBLE
      elif Retiree.grandfathered_group == TRANSITION_B:
          rule_set_code = AGE_60_SERVICE_15
          outcome = ELIGIBLE if (age_years_at_retirement >= 60 and service_years >= 15)
                    else INELIGIBLE
      else:
          rule_set_code = AGE_65_SERVICE_10
          outcome = ELIGIBLE if (age_years_at_retirement >= 65 and service_years >= 10)
                    else INELIGIBLE
      # Every threshold is inclusive (>=). points == 75 exactly is ELIGIBLE.
    input_set: "One Retiree row plus its frozen grandfathered_group. No other retiree or plan-year data participates."
    constants:
      RULE_OF_75_POINTS: 75
      GRANDFATHERED_MIN_AGE: 55
      GRANDFATHERED_MIN_SERVICE_YEARS: 10
    precision: "integer arithmetic; floor division for service_years"

  - name: msp_payer_order_determination
    trigger: "ElectionEvent APPROVE decision (initial write on the new Enrollment); PATCH /retiree-benefits/retirees/{retiree_id}; POST /retiree-benefits/enrollments/{enrollment_id}/reinstate; POST /_ops/daily-run (ESRD coordination-period crossings)"
    algorithm: constraint_propagation
    formula: |
      # Evaluated top to bottom; the FIRST matching branch wins. Order is pinned.
      R = Retiree(Enrollment.retiree_id)
      if R.medicare_status != MEDICARE_ENROLLED:
          payer_order = GROUP_PRIMARY;              basis = NO_OTHER_COVERAGE
      elif R.esrd_flag and R.esrd_entitlement_date is not null
           and whole_months(R.esrd_entitlement_date -> logical clock date) < ESRD_COORDINATION_MONTHS:
          payer_order = GROUP_PRIMARY;              basis = ESRD_WITHIN_COORDINATION
      elif R.esrd_flag and R.esrd_entitlement_date is not null:
          payer_order = MEDICARE_PRIMARY;           basis = ESRD_AFTER_COORDINATION
      elif R.active_employment_flag and R.other_group_coverage_employer_size >= WORKING_AGED_EMPLOYER_THRESHOLD:
          payer_order = GROUP_PRIMARY_WORKING_AGED; basis = WORKING_AGED_LARGE_EMPLOYER
      elif R.active_employment_flag and R.other_group_coverage_employer_size > 0:
          payer_order = MEDICARE_PRIMARY;           basis = WORKING_AGED_SMALL_EMPLOYER
      elif R.disability_entitlement_flag and R.other_group_coverage_employer_size >= DISABILITY_EMPLOYER_THRESHOLD:
          payer_order = GROUP_PRIMARY;              basis = DISABILITY_LARGE_EMPLOYER
      elif R.disability_entitlement_flag and R.other_group_coverage_employer_size > 0:
          payer_order = MEDICARE_PRIMARY;           basis = DISABILITY_SMALL_EMPLOYER
      else:
          payer_order = MEDICARE_PRIMARY;           basis = MEDICARE_PRIMARY_RETIREE_COVERAGE

      whole_months(d1 -> d2) = (d2.year - d1.year) * 12 + (d2.month - d1.month)
                               - (1 if d2.day < d1.day else 0)
    input_set: "One Enrollment row with coverage_status in {PENDING, ACTIVE, SUSPENDED}, its Retiree row, and the logical clock. TERMINATED enrollments are never recomputed."
    constants:
      ESRD_COORDINATION_MONTHS: 30
      WORKING_AGED_EMPLOYER_THRESHOLD: 20
      DISABILITY_EMPLOYER_THRESHOLD: 100
    precision: "exact integer month arithmetic; thresholds inclusive (>=)"

  - name: hra_annual_funding_and_carryover
    trigger: "POST /retiree-benefits/hra-accounts (writes annual_credit_cents, carryover_in_cents, funded_cents, available_balance_cents)"
    algorithm: waterfall_allocation
    formula: |
      base_credit_cents = PlanYear.hra_credit_medicare_cents
                            if Retiree.medicare_status == MEDICARE_ENROLLED
                          else PlanYear.hra_credit_pre_medicare_cents

      # PINNED ROUNDING ORDER: floor to whole cents PER MONTH first, then multiply.
      monthly_credit_cents = floor(base_credit_cents / 12)
      annual_credit_cents  = monthly_credit_cents * covered_months
      # NOT USED: floor(base_credit_cents * covered_months / 12). With
      # base_credit_cents = 209500 and covered_months = 7 the pinned order yields
      # 122206 while the rejected order yields 122208.

      carryover_in_cents = 0 if prior_year_account_id is null
                           else HraAccount(prior_year_account_id).available_balance_cents
      funded_cents            = annual_credit_cents + carryover_in_cents
      available_balance_cents = funded_cents
      pending_hold_cents = 0; substantiated_paid_cents = 0
      premium_offset_cents = 0; forfeited_cents = 0
    input_set: "One Retiree row, one PlanYear row, the supplied covered_months, and at most one prior HraAccount whose status MUST be CLOSED (else ERR_PRIOR_HRA_ACCOUNT_NOT_CLOSED)."
    constants: {}
    precision: "integer cents, floor at each pinned step"

  - name: hra_year_end_forfeiture
    trigger: "POST /retiree-benefits/hra-accounts/{hra_account_id}/close-year (writes forfeited_cents and available_balance_cents)"
    algorithm: threshold
    formula: |
      # Runs AFTER the cascade that denies every non-terminal claim on the account,
      # so pending_hold_cents is 0 at this point.
      carryover_cap_cents = floor(annual_credit_cents * PlanYear.carryover_cap_pct)
      forfeited_cents         = max(0, available_balance_cents - carryover_cap_cents)
      available_balance_cents = available_balance_cents - forfeited_cents
      # The cap is a fraction of THIS year's annual_credit_cents only; inherited
      # carryover_in_cents does not raise the cap.
    input_set: "One HraAccount row in status OPEN and its PlanYear's carryover_cap_pct."
    constants: {}
    precision: "integer cents, floor on the cap"

  - name: hra_claim_eligible_amount
    trigger: "POST /retiree-benefits/reimbursement-claims (PROVISIONAL variant); POST /retiree-benefits/reimbursement-claims/{claim_id}/review with decision=APPROVE (FINAL variant)"
    algorithm: aggregation
    formula: |
      # ---- PROVISIONAL (claim creation) ----
      provisional_eligible_cents = min(submitted_cents,
                                       HraAccount.available_balance_cents)
      eligible_cents = provisional_eligible_cents
      HraAccount.pending_hold_cents      += provisional_eligible_cents
      HraAccount.available_balance_cents -= provisional_eligible_cents

      # ---- FINAL (approval) ----
      if expense_category == DENTAL_VISION_PREMIUM:
          category_allowed_cents = floor(submitted_cents * DENTAL_VISION_REIMBURSEMENT_BPS / 10000)
      elif expense_category == QUALIFIED_MEDICAL:
          category_allowed_cents = min(submitted_cents, QUALIFIED_MEDICAL_PER_CLAIM_CAP_CENTS)
      else:
          category_allowed_cents = submitted_cents
      eligible_cents = min(category_allowed_cents,
                           HraAccount.available_balance_cents + provisional_eligible_cents)
      delta = provisional_eligible_cents - eligible_cents
      HraAccount.pending_hold_cents      -= delta
      HraAccount.available_balance_cents += delta
    input_set: "One ReimbursementClaim row and its HraAccount, whose status MUST be OPEN. No other claim participates directly; the account's running aggregates carry the history."
    constants:
      DENTAL_VISION_REIMBURSEMENT_BPS: 5000
      QUALIFIED_MEDICAL_PER_CLAIM_CAP_CENTS: 50000
    precision: "integer cents, floor on the category proration"
    variants:
      - name: PROVISIONAL
        when: "At claim creation, before any HraAdministrator has seen the documentation."
        difference: "Caps only against the account's available balance; ignores the expense-category reimbursement percentage and the per-claim cap entirely."
      - name: FINAL
        when: "At review with decision=APPROVE."
        difference: "Applies the expense-category cap first and only then the balance cap, so identical claim data yields a strictly different eligible_cents whenever the category is DENTAL_VISION_PREMIUM or the amount exceeds the QUALIFIED_MEDICAL per-claim cap."

  - name: premium_invoice_assembly
    trigger: "POST /retiree-benefits/premium-invoices (all computed PremiumInvoice fields); steps 1-6 only, with hra_available forced to 0, on the ElectionEvent APPROVE decision to write Enrollment.monthly_retiree_premium_cents"
    algorithm: waterfall_allocation
    formula: |
      # EVALUATION ORDER IS PINNED. The dependency looks circular because the
      # administrative fee is a percentage of a "total" that also contains the fee.
      # It is resolved by declaring the fee to be FEE-EXCLUSIVE.
      1. base_premium_cents  = PlanOption.monthly_premium_cents
      2. admin_fee_cents     = floor(base_premium_cents * ADMIN_FEE_BPS / 10000)
         # NOT USED: the fixed-point reading admin_fee = floor((base + admin_fee)
         # * ADMIN_FEE_BPS / 10000). With base_premium_cents = 74500 the pinned
         # order yields 2607 while the rejected fixed point yields 2702.
      3. gross_premium_cents = base_premium_cents + admin_fee_cents
      4. employer_subsidy_bps = EMPLOYER_SUBSIDY_BPS_BY_GROUP[Retiree.grandfathered_group]
         service_years = floor(Retiree.credited_service_months / 12)
         if service_years >= LONG_SERVICE_BONUS_YEARS:
             employer_subsidy_bps = min(10000, employer_subsidy_bps + LONG_SERVICE_BONUS_BPS)
      5. employer_subsidy_cents = floor(gross_premium_cents * employer_subsidy_bps / 10000)
      6. retiree_share_cents    = gross_premium_cents - employer_subsidy_cents
      7. hra_available = available_balance_cents of the HraAccount whose retiree_id ==
                         Enrollment.retiree_id and plan_year_id == Enrollment.plan_year_id
                         and status == OPEN; 0 when no such account exists
         hra_applied_cents = min(hra_available, retiree_share_cents)
      8. net_due_cents = retiree_share_cents - hra_applied_cents
      9. due_date    = billing_period_start + PREMIUM_DUE_DAYS days
         past_due_at = due_date + PlanYear.premium_grace_period_days days
      10. status = PAID when net_due_cents == 0, else ISSUED
      # Side effects on the HraAccount when hra_applied_cents > 0:
      #   available_balance_cents -= hra_applied_cents
      #   premium_offset_cents    += hra_applied_cents
      #   HraAccount.version increments by 1
    input_set: "One Enrollment with coverage_status in {PENDING, ACTIVE, SUSPENDED}, its PlanOption, its Retiree, its PlanYear, and at most one OPEN HraAccount for (retiree_id, plan_year_id)."
    constants:
      ADMIN_FEE_BPS: 350
      EMPLOYER_SUBSIDY_BPS_BY_GROUP: { GRANDFATHERED_A: 8000, TRANSITION_B: 6000, STANDARD_C: 4000 }
      LONG_SERVICE_BONUS_YEARS: 25
      LONG_SERVICE_BONUS_BPS: 1000
      PREMIUM_DUE_DAYS: 30
    precision: "integer cents; floor at steps 2 and 5; no other rounding"

  - name: actuarial_equivalence_test
    trigger: "POST /retiree-benefits/plan-options/{plan_option_id}/attest (writes gross_test_passed, net_test_passed, equivalence_margin_bps)"
    algorithm: threshold
    formula: |
      gross_test_passed      = (rx_gross_value_bps >= STANDARD_PART_D_GROSS_VALUE_BPS)
      net_test_passed        = (rx_net_value_bps   >= STANDARD_PART_D_NET_VALUE_BPS)
      equivalence_margin_bps = rx_net_value_bps - STANDARD_PART_D_NET_VALUE_BPS
      # Gating (evaluated in this order):
      #   subsidy_vehicle == NONE                        -> ERR_INVALID_REQUEST
      #   not gross_test_passed                          -> ERR_ACTUARIAL_GROSS_TEST_FAILED
      #   subsidy_vehicle == EGWP and not net_test_passed -> ERR_ACTUARIAL_NET_TEST_FAILED
      # Both thresholds are inclusive: rx_net_value_bps == 7450 exactly PASSES and
      # yields equivalence_margin_bps == 0.
      # RDS is gated on the gross test only; EGWP is gated on gross AND net.
    input_set: "The attested rx_gross_value_bps / rx_net_value_bps supplied in the request plus PlanOption.subsidy_vehicle. Historical attestations are not consulted."
    constants:
      STANDARD_PART_D_GROSS_VALUE_BPS: 10000
      STANDARD_PART_D_NET_VALUE_BPS: 7450
    precision: "integer basis points; thresholds inclusive"

  - name: retiree_medical_liability_valuation
    trigger: "POST /retiree-benefits/plan-years/{plan_year_id}/liability-valuation (writes liability_method, measured_retiree_count, epbo_total_cents, apbo_total_cents, service_cost_total_cents, liability_valued_at)"
    algorithm: weighted_scoring
    formula: |
      cohort = every Retiree R such that there exists an EligibilityDetermination D
               with D.retiree_id == R.id, D.plan_year_id == PlanYear.id,
               D.status == CERTIFIED and D.outcome == ELIGIBLE.
               Iterated in R.created_at ASC order (tie-break: none needed, but if two
               rows share created_at the earlier-created_at-then-lower-year row is
               irrelevant because per-retiree results are summed, not ordered).
      epbo_r = floor(PlanYear.assumed_annual_subsidy_cents
                     * PlanYear.assumed_payment_years
                     * 10000 / (10000 + PlanYear.discount_rate_bps))
      full_elig_years = FULL_ELIGIBILITY_SERVICE_YEARS_BY_GROUP[R.grandfathered_group]
      retire_years    = full_elig_years + ASSUMED_POST_ELIGIBILITY_SERVICE_YEARS
      service_years   = floor(R.credited_service_months / 12)

      if method == PROJECTED_UNIT_CREDIT:
          apbo_r = floor(epbo_r * min(service_years, retire_years) / retire_years)
      else:  # ATTRIBUTION_TO_FULL_ELIGIBILITY
          apbo_r = floor(epbo_r * min(service_years, full_elig_years) / full_elig_years)

      service_cost_r = floor(epbo_r / retire_years) if service_years < retire_years else 0

      # PINNED ROUNDING ORDER: floor PER RETIREE, then sum. Summing the unrounded
      # per-retiree values and flooring once is NOT used.
      measured_retiree_count  = |cohort|
      epbo_total_cents        = sum(epbo_r)
      apbo_total_cents        = sum(apbo_r)
      service_cost_total_cents = sum(service_cost_r)
    input_set: "Retirees with a CERTIFIED, ELIGIBLE EligibilityDetermination for this plan year. DRAFT, UNDER_APPEAL and SUPERSEDED determinations are excluded, and so are CERTIFIED determinations whose outcome is INELIGIBLE. Enrollment state is irrelevant."
    constants:
      FULL_ELIGIBILITY_SERVICE_YEARS_BY_GROUP: { GRANDFATHERED_A: 15, TRANSITION_B: 20, STANDARD_C: 25 }
      ASSUMED_POST_ELIGIBILITY_SERVICE_YEARS: 5
    precision: "integer cents; floor per retiree then sum"
    variants:
      - name: PROJECTED_UNIT_CREDIT
        when: "method == PROJECTED_UNIT_CREDIT"
        difference: "Attributes the obligation over service to the assumed RETIREMENT date, so the denominator is full_elig_years + 5."
      - name: ATTRIBUTION_TO_FULL_ELIGIBILITY
        when: "method == ATTRIBUTION_TO_FULL_ELIGIBILITY"
        difference: "Attributes the obligation over service to the FULL ELIGIBILITY date, so the denominator is full_elig_years and the numerator saturates five years earlier. For a GRANDFATHERED_A retiree with 150 credited service months the two methods yield apbo 2742856 and 3657142 from identical inputs."

  - name: election_window_evaluation
    trigger: "POST /retiree-benefits/election-events (writes window_deadline and coverage_effective_date, and gates admission)"
    algorithm: interval_merge
    formula: |
      if event_type == ANNUAL_OPEN:
          window_deadline = PlanYear.open_enrollment_end
          admitted iff PlanYear.open_enrollment_start <= logical clock
                       < PlanYear.open_enrollment_end            # half-open
                  else ERR_ELECTION_WINDOW_CLOSED
          coverage_effective_date = PlanYear.coverage_start
      else:  # any qualifying life event
          window_deadline = event_date at 00:00:00.000Z + LIFE_EVENT_WINDOW_DAYS days
          admitted iff event_date at 00:00:00.000Z <= logical clock <= window_deadline
                  else ERR_LIFE_EVENT_WINDOW_EXPIRED                  # closed on both ends
          coverage_effective_date = first day of the calendar month AFTER
                                    event_date, at 00:00:00.000Z
    input_set: "The submitted ElectionEvent fields, its PlanYear, and the logical clock."
    constants:
      LIFE_EVENT_WINDOW_DAYS: 31
    precision: "instant comparison at millisecond resolution"

  - name: enrollment_coverage_interval_overlap
    trigger: "POST /retiree-benefits/election-events/{election_event_id}/decision with decision=APPROVE (gates Enrollment creation)"
    algorithm: interval_merge
    formula: |
      new_interval = [ElectionEvent.coverage_effective_date, +infinity)
      candidates   = every Enrollment E with E.retiree_id == ElectionEvent.retiree_id,
                     REGARDLESS of E.coverage_status (PENDING, ACTIVE, SUSPENDED and
                     TERMINATED all count), ordered created_at ASC
      existing_interval(E) = [E.coverage_effective_date,
                              E.coverage_end_date if not null else +infinity)
      # HALF-OPEN semantics: intervals collide iff
      #     new.start < existing.end  AND  existing.start < new.end
      # so existing.coverage_end_date == new.coverage_effective_date is ADJACENT,
      # not overlapping, and is admitted.
      reject with ERR_DUPLICATE_ENROLLMENT_PERIOD on the first colliding candidate
    input_set: "All Enrollment rows of the electing retiree across every plan year and every coverage_status."
    constants: {}
    precision: "instant comparison at millisecond resolution; half-open [start, end)"

  - name: billing_period_overlap
    trigger: "POST /retiree-benefits/premium-invoices (gates invoice creation)"
    algorithm: interval_merge
    formula: |
      new_interval = [billing_period_start, billing_period_end]
      candidates   = every PremiumInvoice I with I.enrollment_id == the request's
                     enrollment_id and I.status != WRITTEN_OFF, ordered created_at ASC
      # CLOSED semantics on BOTH endpoints: intervals collide iff
      #     new.start <= existing.end  AND  existing.start <= new.end
      # so a new period whose start EQUALS a prior period's end is a COLLISION.
      # Contiguous monthly billing must therefore start strictly after the prior end.
      reject with ERR_BILLING_PERIOD_OVERLAP on the first colliding candidate
    input_set: "All non-WRITTEN_OFF PremiumInvoice rows of the target Enrollment."
    constants: {}
    precision: "instant comparison at millisecond resolution; closed [start, end]"

  - name: plan_change_notice_lead_time
    trigger: "POST /retiree-benefits/plan-options/{plan_option_id}/change-notice (gates issuance and writes change_notice_issued_at)"
    algorithm: threshold
    formula: |
      lead_days = floor((effective_date - logical clock) / 86400 seconds)
      admitted iff lead_days >= PlanYear(PlanOption.plan_year_id).notice_lead_days
              else ERR_NOTICE_LEAD_TIME_INSUFFICIENT
      # BUFFER semantics: the constraint is a minimum separation between two
      # instants, not an overlap between two intervals. lead_days exactly equal to
      # notice_lead_days is admitted.
      on admission: change_notice_issued_at = logical clock
                    pending_change_type = change_type
                    pending_change_effective_date = effective_date
                    pending_new_monthly_premium_cents = new_monthly_premium_cents
                        (required when change_type == PREMIUM_INCREASE, else null)
    input_set: "The target PlanOption, its PlanYear's notice_lead_days, and the logical clock."
    constants: {}
    precision: "whole-day floor on the separation"

  - name: delinquency_progression
    trigger: "POST /_ops/daily-run"
    algorithm: chronological
    formula: |
      # PHASE ORDER IS PINNED. Each phase runs to completion before the next.
      PHASE 1 - activation:
        every Enrollment with coverage_status == PENDING and
        coverage_effective_date <= clock, in created_at ASC order -> coverage_status = ACTIVE
        (counted in activated_enrollment_count)
      PHASE 2 - past-due sweep:
        every PremiumInvoice with status in {ISSUED, PARTIALLY_PAID} and past_due_at
        <= clock, in created_at ASC order:
          invoice -> PAST_DUE                                   (counted in processed_invoice_count)
          owning Enrollment: consecutive_unpaid_periods += 1;
            delinquency_first_unpaid_period_start = invoice.billing_period_start when null;
            billing_status CURRENT|REINSTATED -> DELINQUENT;
            coverage_status ACTIVE -> SUSPENDED                  (counted in suspended_enrollment_count)
          if consecutive_unpaid_periods >= LAPSE_THRESHOLD_PERIODS:
            billing_status -> LAPSED with lapse_date = clock and
            reinstatement_deadline = clock + PlanYear.reinstatement_window_days days;
            coverage_status -> TERMINATED (termination_reason 'PREMIUM_LAPSE');
            PlanOption.enrolled_count -= 1;
            every PAST_DUE invoice on the enrollment -> WRITTEN_OFF;
            the OPEN HraAccount for (retiree_id, plan_year_id) -> FROZEN;
            every claim on that account in {SUBMITTED, PENDING_SUBSTANTIATION, APPROVED}
              -> DENIED (ACCOUNT_NOT_OPEN) with its hold released to available_balance_cents
            (counted in lapsed_enrollment_count)
      PHASE 3 - pending plan changes:
        every PlanOption with change_notice_issued_at not null and
        pending_change_effective_date <= clock, in created_at ASC order:
          PREMIUM_INCREASE  -> monthly_premium_cents = pending_new_monthly_premium_cents
          PLAN_TERMINATION  -> status = RETIRED and every Enrollment on the option with
                               coverage_status in {PENDING, ACTIVE, SUSPENDED} ->
                               TERMINATED (termination_reason 'PLAN_TERMINATION');
                               enrolled_count = 0
          pending_change_* fields cleared          (counted in applied_plan_change_count)
      PHASE 4 - MSP refresh:
        every Enrollment with coverage_status in {PENDING, ACTIVE, SUSPENDED} whose
        msp_payer_order_determination result differs from its stored payer_order or
        msp_basis_code, in created_at ASC order -> both fields rewritten
        (counted in recomputed_msp_count)
    input_set: "All PremiumInvoice, Enrollment, PlanOption, HraAccount and ReimbursementClaim rows in the system; no plan-year filter."
    constants:
      LAPSE_THRESHOLD_PERIODS: 3
    precision: "integer counters; instant comparison at millisecond resolution; thresholds inclusive"

  - name: hra_ledger_conservation
    trigger: "invariant; MUST hold after every mutation that touches an HraAccount or any of its ReimbursementClaim rows"
    algorithm: aggregation
    formula: |
      HraAccount.funded_cents ==
            HraAccount.available_balance_cents
          + HraAccount.pending_hold_cents
          + HraAccount.substantiated_paid_cents
          + HraAccount.premium_offset_cents
          + HraAccount.forfeited_cents
      # funded_cents itself is annual_credit_cents + carryover_in_cents and never
      # changes after account creation. Every claim transition, premium offset and
      # year-end forfeiture only moves cents BETWEEN the five right-hand buckets.
      # A PAY followed by its compensating REVERSE must therefore leave
      # available_balance_cents at exactly its pre-PAY value.
    input_set: "One HraAccount row and the five denormalized buckets it carries."
    constants: {}
    precision: "exact integer equality; zero tolerance for drift"

  - name: enrollment_headcount_conservation
    trigger: "invariant; MUST hold after every mutation that creates or terminates an Enrollment"
    algorithm: aggregation
    formula: |
      for every PlanOption P:
        P.enrolled_count == count of Enrollment E with E.plan_option_id == P.id
                            and E.coverage_status in {PENDING, ACTIVE, SUSPENDED}
      and, summed over one plan year Y:
        sum(P.enrolled_count for P where P.plan_year_id == Y.id)
            == count of Enrollment E with E.plan_year_id == Y.id
               and E.coverage_status in {PENDING, ACTIVE, SUSPENDED}
      # The ElectionEvent APPROVE decision is the forward action (+1) and
      # POST /enrollments/{id}/terminate is its compensating action (-1); a lapse
      # cascade and a plan termination cascade are also -1 each. Reinstatement is
      # +1. No path may leave the count and the row set disagreeing.
    input_set: "All PlanOption rows of a plan year and all Enrollment rows referencing them, at every coverage_status."
    constants: {}
    precision: "exact integer equality; zero tolerance for drift"

# =============================================================================
# 1.4 Validation Rules Table (Ordered by Priority)
#
# The ordering is TOTAL: whenever a single request violates more than one row,
# the row with the numerically lowest `priority` produces the response, and no
# lower-priority check is evaluated or reported.
#
# Domain ordering rationale (within the business band):
#   business_safety     (25-30) - regulatory / actuarial / segregation-of-duties
#   business_temporal   (31-32) - election windows and life-event deadlines
#   business_referential(33-38) - plan-class, group and interval integrity
#   business_constraint (39-43) - uniqueness, reinstatement and plan-year scope
#   business_fiscal     (44-45) - money availability, checked last
# =============================================================================
validations:

  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers are both present and non-empty, and X-User-Role is one of the eight declared role names"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "The caller's X-User-Role appears in the target endpoint's roles list"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "plan_year_id in the path or body resolves to an existing PlanYear"
    error_id: ERR_PLAN_YEAR_NOT_FOUND
    http_status: 404
    applies_to: "GET|POST /retiree-benefits/plan-years/{plan_year_id}*, POST /retiree-benefits/plan-options, POST /retiree-benefits/eligibility-determinations, POST /retiree-benefits/election-events, POST /retiree-benefits/hra-accounts"

  - priority: 4
    category: existence
    check: "retiree_id in the path or body resolves to an existing Retiree"
    error_id: ERR_RETIREE_NOT_FOUND
    http_status: 404
    applies_to: "GET|PATCH /retiree-benefits/retirees/{retiree_id}, POST /retiree-benefits/eligibility-determinations, POST /retiree-benefits/election-events, POST /retiree-benefits/hra-accounts"

  - priority: 5
    category: existence
    check: "plan_option_id in the path, or requested_plan_option_id in the body, resolves to an existing PlanOption"
    error_id: ERR_PLAN_OPTION_NOT_FOUND
    http_status: 404
    applies_to: "GET|POST /retiree-benefits/plan-options/{plan_option_id}*, POST /retiree-benefits/election-events"

  - priority: 6
    category: existence
    check: "determination_id in the path resolves to an existing EligibilityDetermination"
    error_id: ERR_DETERMINATION_NOT_FOUND
    http_status: 404
    applies_to: "GET|POST /retiree-benefits/eligibility-determinations/{determination_id}*"

  - priority: 7
    category: existence
    check: "election_event_id in the path resolves to an existing ElectionEvent"
    error_id: ERR_ELECTION_EVENT_NOT_FOUND
    http_status: 404
    applies_to: "GET|POST /retiree-benefits/election-events/{election_event_id}*"

  - priority: 8
    category: existence
    check: "enrollment_id in the path or body resolves to an existing Enrollment"
    error_id: ERR_ENROLLMENT_NOT_FOUND
    http_status: 404
    applies_to: "GET|POST /retiree-benefits/enrollments/{enrollment_id}*, POST /retiree-benefits/premium-invoices"

  - priority: 9
    category: existence
    check: "hra_account_id in the path or body, and prior_year_account_id when supplied, resolve to existing HraAccount rows"
    error_id: ERR_HRA_ACCOUNT_NOT_FOUND
    http_status: 404
    applies_to: "GET|POST /retiree-benefits/hra-accounts/{hra_account_id}*, POST /retiree-benefits/hra-accounts, POST /retiree-benefits/reimbursement-claims"

  - priority: 10
    category: existence
    check: "claim_id in the path resolves to an existing ReimbursementClaim"
    error_id: ERR_CLAIM_NOT_FOUND
    http_status: 404
    applies_to: "GET|POST /retiree-benefits/reimbursement-claims/{claim_id}*"

  - priority: 11
    category: existence
    check: "invoice_id in the path resolves to an existing PremiumInvoice"
    error_id: ERR_INVOICE_NOT_FOUND
    http_status: 404
    applies_to: "GET|POST /retiree-benefits/premium-invoices/{invoice_id}*"

  - priority: 12
    category: state
    check: "Every required body field is present, every field has the declared JSON type, every enum field carries a declared member, every *_cents and *_bps field is a non-negative integer, every *_date / *_at field parses as ISO-8601, carryover_cap_pct is a number in [0, 1], and interval fields satisfy start < end"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all"

  - priority: 13
    category: state
    check: "limit is an integer in [1, 100] and offset is an integer >= 0"
    error_id: ERR_INVALID_PAGINATION
    http_status: 400
    applies_to: "every GET list endpoint"

  - priority: 14
    category: state
    check: "expected_retiree_version equals the current Retiree.version"
    error_id: ERR_STALE_RETIREE_VERSION
    http_status: 412
    applies_to: "POST /retiree-benefits/eligibility-determinations"

  - priority: 15
    category: state
    check: "expected_hra_account_version equals the current HraAccount.version"
    error_id: ERR_STALE_HRA_ACCOUNT_VERSION
    http_status: 412
    applies_to: "POST /retiree-benefits/reimbursement-claims"

  - priority: 16
    category: state
    check: "The requested PlanYear status transition is declared in the PlanYear state machine (DRAFT->OPEN, OPEN->CLOSED, CLOSED->ARCHIVED only)"
    error_id: ERR_INVALID_PLAN_YEAR_TRANSITION
    http_status: 409
    applies_to: "POST /retiree-benefits/plan-years/{plan_year_id}/status"

  - priority: 17
    category: state
    check: "The governing PlanYear.status is OPEN"
    error_id: ERR_PLAN_YEAR_NOT_OPEN
    http_status: 409
    applies_to: "POST /retiree-benefits/eligibility-determinations, POST /retiree-benefits/election-events, POST /retiree-benefits/hra-accounts, POST /retiree-benefits/premium-invoices"

  - priority: 18
    category: state
    check: "PlanOption.status is ACTIVE"
    error_id: ERR_PLAN_OPTION_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /retiree-benefits/plan-options/{plan_option_id}/change-notice, POST /retiree-benefits/election-events"

  - priority: 19
    category: state
    check: "EligibilityDetermination.status permits the requested transition (certify requires DRAFT; appeal requires CERTIFIED; appeal-decision requires UNDER_APPEAL)"
    error_id: ERR_INVALID_DETERMINATION_STATE
    http_status: 409
    applies_to: "POST /retiree-benefits/eligibility-determinations/{determination_id}/certify, .../appeal, .../appeal-decision"

  - priority: 20
    category: state
    check: "ElectionEvent.status permits the requested transition (review requires SUBMITTED; decision requires UNDER_REVIEW)"
    error_id: ERR_INVALID_ELECTION_STATE
    http_status: 409
    applies_to: "POST /retiree-benefits/election-events/{election_event_id}/review, .../decision"

  - priority: 21
    category: state
    check: "Enrollment.coverage_status permits the requested transition (terminate requires PENDING, ACTIVE or SUSPENDED; reinstate requires TERMINATED with billing_status LAPSED)"
    error_id: ERR_INVALID_ENROLLMENT_STATE
    http_status: 409
    applies_to: "POST /retiree-benefits/enrollments/{enrollment_id}/terminate, .../reinstate"

  - priority: 22
    category: state
    check: "HraAccount.status is OPEN"
    error_id: ERR_HRA_ACCOUNT_NOT_OPEN
    http_status: 409
    applies_to: "POST /retiree-benefits/reimbursement-claims, POST /retiree-benefits/hra-accounts/{hra_account_id}/close-year"

  - priority: 23
    category: state
    check: "ReimbursementClaim.status permits the requested transition (substantiation requires PENDING_SUBSTANTIATION; review requires SUBMITTED, and an APPROVE decision additionally requires a non-null documentation_reference; settlement action PAY requires APPROVED and action REVERSE requires PAID)"
    error_id: ERR_INVALID_CLAIM_STATE
    http_status: 409
    applies_to: "POST /retiree-benefits/reimbursement-claims/{claim_id}/substantiation, .../review, .../settlement"

  - priority: 24
    category: state
    check: "PremiumInvoice.status is ISSUED, PARTIALLY_PAID or PAST_DUE - a PAID or WRITTEN_OFF invoice accepts no further payment"
    error_id: ERR_INVOICE_ALREADY_SETTLED
    http_status: 409
    applies_to: "POST /retiree-benefits/premium-invoices/{invoice_id}/payments"

  - priority: 25
    category: business_safety
    check: "The X-User-ID performing an approval, certification or settlement differs from the X-User-ID that created or attested the same record (EligibilityDetermination.created_by_user_id vs certify and EligibilityDetermination.certified_by_user_id vs appeal-decision; PlanOption.attested_by_user_id vs subsidy-certification; ElectionEvent.created_by_user_id vs decision; ReimbursementClaim.created_by_user_id vs review; ReimbursementClaim.reviewed_by_user_id vs settlement)"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /retiree-benefits/eligibility-determinations/{determination_id}/certify, .../appeal-decision, POST /retiree-benefits/plan-options/{plan_option_id}/subsidy-certification, POST /retiree-benefits/election-events/{election_event_id}/decision, POST /retiree-benefits/reimbursement-claims/{claim_id}/review, .../settlement"

  - priority: 26
    category: business_safety
    check: "The attested rx_gross_value_bps is at least STANDARD_PART_D_GROSS_VALUE_BPS (10000)"
    error_id: ERR_ACTUARIAL_GROSS_TEST_FAILED
    http_status: 422
    applies_to: "POST /retiree-benefits/plan-options/{plan_option_id}/attest"

  - priority: 27
    category: business_safety
    check: "For an EGWP option the attested rx_net_value_bps is at least STANDARD_PART_D_NET_VALUE_BPS (7450); evaluated only after the gross test has passed"
    error_id: ERR_ACTUARIAL_NET_TEST_FAILED
    http_status: 422
    applies_to: "POST /retiree-benefits/plan-options/{plan_option_id}/attest"

  - priority: 28
    category: business_safety
    check: "When the requested PlanOption.subsidy_vehicle is RDS or EGWP, its subsidy_certification_status is CERTIFIED"
    error_id: ERR_SUBSIDY_NOT_CERTIFIED
    http_status: 409
    applies_to: "POST /retiree-benefits/election-events/{election_event_id}/decision"

  - priority: 29
    category: business_safety
    check: "The retiree holds an EligibilityDetermination for the same plan year whose status is CERTIFIED"
    error_id: ERR_DETERMINATION_NOT_CERTIFIED
    http_status: 409
    applies_to: "POST /retiree-benefits/election-events, POST /retiree-benefits/election-events/{election_event_id}/decision (APPROVE only), POST /retiree-benefits/hra-accounts"

  - priority: 30
    category: business_safety
    check: "That CERTIFIED determination's outcome is ELIGIBLE, not INELIGIBLE"
    error_id: ERR_NOT_ELIGIBLE_FOR_RETIREE_MEDICAL
    http_status: 422
    applies_to: "POST /retiree-benefits/election-events, POST /retiree-benefits/election-events/{election_event_id}/decision (APPROVE only), POST /retiree-benefits/hra-accounts"

  - priority: 31
    category: business_temporal
    check: "For event_type ANNUAL_OPEN the logical clock lies in the half-open window [PlanYear.open_enrollment_start, PlanYear.open_enrollment_end)"
    error_id: ERR_ELECTION_WINDOW_CLOSED
    http_status: 422
    applies_to: "POST /retiree-benefits/election-events"

  - priority: 32
    category: business_temporal
    check: "For any qualifying life event the logical clock lies in the closed window [event_date, event_date + 31 days]"
    error_id: ERR_LIFE_EVENT_WINDOW_EXPIRED
    http_status: 422
    applies_to: "POST /retiree-benefits/election-events"

  - priority: 33
    category: business_referential
    check: "The requested PlanOption.coverage_class matches the retiree's medicare_status: MEDICARE_ENROLLED requires MEDICARE_GROUP_WRAP or INDIVIDUAL_EXCHANGE_HRA, while PRE_MEDICARE, MEDICARE_ELIGIBLE_NOT_ENROLLED and MEDICARE_WAIVED require PRE_MEDICARE_GROUP or INDIVIDUAL_EXCHANGE_HRA"
    error_id: ERR_PLAN_CLASS_MISMATCH
    http_status: 422
    applies_to: "POST /retiree-benefits/election-events"

  - priority: 34
    category: business_referential
    check: "When PlanOption.requires_medicare_part_b is true the retiree's medicare_part_b_effective_date is non-null and not after the election's coverage_effective_date"
    error_id: ERR_MEDICARE_PART_B_REQUIRED
    http_status: 422
    applies_to: "POST /retiree-benefits/election-events"

  - priority: 35
    category: business_referential
    check: "Retiree.grandfathered_group appears in PlanOption.allowed_grandfather_groups"
    error_id: ERR_GRANDFATHER_GROUP_NOT_PERMITTED
    http_status: 422
    applies_to: "POST /retiree-benefits/election-events"

  - priority: 36
    category: business_referential
    check: "The new coverage interval [coverage_effective_date, coverage_end_date) does not overlap any existing Enrollment interval of the same retiree under half-open semantics; an existing interval whose end equals the new start is adjacent and admitted"
    error_id: ERR_DUPLICATE_ENROLLMENT_PERIOD
    http_status: 409
    applies_to: "POST /retiree-benefits/election-events/{election_event_id}/decision"

  - priority: 37
    category: business_referential
    check: "The new billing interval [billing_period_start, billing_period_end] does not overlap any non-WRITTEN_OFF PremiumInvoice interval of the same enrollment under closed semantics; a new start equal to a prior end is a collision"
    error_id: ERR_BILLING_PERIOD_OVERLAP
    http_status: 409
    applies_to: "POST /retiree-benefits/premium-invoices"

  - priority: 38
    category: business_referential
    check: "The whole-day separation between the logical clock and the requested effective_date is at least PlanYear.notice_lead_days"
    error_id: ERR_NOTICE_LEAD_TIME_INSUFFICIENT
    http_status: 422
    applies_to: "POST /retiree-benefits/plan-options/{plan_option_id}/change-notice"

  - priority: 39
    category: business_constraint
    check: "The logical clock is not after Enrollment.reinstatement_deadline"
    error_id: ERR_REINSTATEMENT_WINDOW_EXPIRED
    http_status: 422
    applies_to: "POST /retiree-benefits/enrollments/{enrollment_id}/reinstate"

  - priority: 40
    category: business_constraint
    check: "ReimbursementClaim.service_date lies in the closed calendar interval [PlanYear.coverage_start, PlanYear.coverage_start + 1 year - 1 day] of the HraAccount's plan year"
    error_id: ERR_EXPENSE_OUTSIDE_PLAN_YEAR
    http_status: 422
    applies_to: "POST /retiree-benefits/reimbursement-claims"

  - priority: 41
    category: business_constraint
    check: "No other PlanYear already carries the requested year"
    error_id: ERR_DUPLICATE_PLAN_YEAR
    http_status: 409
    applies_to: "POST /retiree-benefits/plan-years"

  - priority: 42
    category: business_constraint
    check: "No other PlanOption in the same plan year already carries the requested plan_code"
    error_id: ERR_DUPLICATE_PLAN_CODE
    http_status: 409
    applies_to: "POST /retiree-benefits/plan-options"

  - priority: 43
    category: business_constraint
    check: "No other HraAccount already exists for the same (retiree_id, plan_year_id) pair in any status, and any supplied prior_year_account_id belongs to the same retiree, references an earlier plan year, and has status CLOSED"
    error_id: ERR_DUPLICATE_HRA_ACCOUNT
    http_status: 409
    applies_to: "POST /retiree-benefits/hra-accounts"

  - priority: 44
    category: business_constraint
    check: "A supplied prior_year_account_id references an HraAccount whose status is CLOSED"
    error_id: ERR_PRIOR_HRA_ACCOUNT_NOT_CLOSED
    http_status: 409
    applies_to: "POST /retiree-benefits/hra-accounts"

  - priority: 45
    category: business_constraint
    check: "The retiree has no PremiumInvoice in status PAST_DUE with a non-zero outstanding balance on any enrollment other than the one being reinstated"
    error_id: ERR_OUTSTANDING_PREMIUM_BALANCE
    http_status: 409
    applies_to: "POST /retiree-benefits/enrollments/{enrollment_id}/reinstate"

  - priority: 46
    category: business_fiscal
    check: "HraAccount.available_balance_cents is strictly greater than zero, so the account can fund at least part of the submitted claim"
    error_id: ERR_HRA_BALANCE_INSUFFICIENT
    http_status: 422
    applies_to: "POST /retiree-benefits/reimbursement-claims"

  - priority: 47
    category: business_fiscal
    check: "amount_cents does not exceed PremiumInvoice.net_due_cents - PremiumInvoice.paid_cents"
    error_id: ERR_PAYMENT_EXCEEDS_BALANCE
    http_status: 422
    applies_to: "POST /retiree-benefits/premium-invoices/{invoice_id}/payments"

# =============================================================================
# 1.5 API Endpoint Table
#
# 47 endpoints. Every path is prefixed with /retiree-benefits except the two
# test-driving endpoints under /_clock and /_ops (priority-ladder step 3).
#
# ALL_ROLES = [BenefitsAdmin, EligibilityAnalyst, EnrollmentCounselor,
#              HraAdministrator, BillingClerk, Actuary, ComplianceOfficer, Retiree]
# =============================================================================
endpoints:

  # --------------------------------------------------------------- PlanYear ---
  - method: POST
    path: "/retiree-benefits/plan-years"
    description: "Register a plan year in DRAFT with its HRA credit schedule, billing calendar parameters and actuarial assumptions."
    roles: [BenefitsAdmin]
    code: 201
    input: [year, open_enrollment_start, open_enrollment_end, coverage_start, hra_credit_pre_medicare_cents, hra_credit_medicare_cents, carryover_cap_pct, discount_rate_bps, assumed_annual_subsidy_cents, assumed_payment_years, "premium_grace_period_days?", "reinstatement_window_days?", "notice_lead_days?"]
    output: PlanYear
    side_effects: ["status set to DRAFT", "measured_retiree_count / epbo_total_cents / apbo_total_cents / service_cost_total_cents initialised to 0"]

  - method: GET
    path: "/retiree-benefits/plan-years/{plan_year_id}"
    description: "Read one plan year including its most recent liability valuation."
    roles: [BenefitsAdmin, EligibilityAnalyst, EnrollmentCounselor, HraAdministrator, BillingClerk, Actuary, ComplianceOfficer, Retiree]
    code: 200
    input: []
    output: PlanYear
    side_effects: []

  - method: GET
    path: "/retiree-benefits/plan-years"
    description: "List plan years with filtering and pagination."
    roles: [BenefitsAdmin, EligibilityAnalyst, EnrollmentCounselor, HraAdministrator, BillingClerk, Actuary, ComplianceOfficer, Retiree]
    code: 200
    input: ["status?", "year?", "limit?", "offset?"]
    output: PlanYear[]
    side_effects: []

  - method: POST
    path: "/retiree-benefits/plan-years/{plan_year_id}/status"
    description: "Advance the plan year lifecycle. Only DRAFT->OPEN, OPEN->CLOSED and CLOSED->ARCHIVED are declared."
    roles: [BenefitsAdmin]
    code: 200
    input: [to_status]
    output: PlanYear
    side_effects: ["OPEN->CLOSED cascade hop 2: every ACTIVE PlanOption of the year -> CLOSED_TO_NEW, in created_at ASC order", "OPEN->CLOSED cascade hop 3: for each option hop 2 just closed, every ElectionEvent requesting it whose status is SUBMITTED or UNDER_REVIEW -> DENIED with denial_reason_code PLAN_CLOSED, in created_at ASC order", "CLOSED->ARCHIVED requires that no HraAccount of the year is still OPEN and cascades nothing further"]

  - method: POST
    path: "/retiree-benefits/plan-years/{plan_year_id}/liability-valuation"
    description: "Run the accounting liability valuation for the plan year under the requested attribution method and store the result on the PlanYear."
    roles: [Actuary]
    code: 200
    input: [method]
    output: PlanYear
    side_effects: ["retiree_medical_liability_valuation executed", "liability_method, measured_retiree_count, epbo_total_cents, apbo_total_cents, service_cost_total_cents and liability_valued_at rewritten"]

  # ---------------------------------------------------------------- Retiree ---
  - method: POST
    path: "/retiree-benefits/retirees"
    description: "Enrol a retiree record. grandfathered_group is derived from hire_date at creation and never recomputed."
    roles: [BenefitsAdmin, EligibilityAnalyst]
    code: 201
    input: [full_name, birth_date, hire_date, retirement_date, credited_service_months, "medicare_status?", "medicare_part_b_effective_date?", "other_group_coverage_employer_size?", "active_employment_flag?", "esrd_flag?", "esrd_entitlement_date?", "disability_entitlement_flag?"]
    output: Retiree
    side_effects: ["retiree_grandfather_group_assignment executed", "eligibility_status set to UNDETERMINED", "determination_sequence set to 0"]

  - method: GET
    path: "/retiree-benefits/retirees/{retiree_id}"
    description: "Read one retiree including its derived grandfathered_group and eligibility_points."
    roles: [BenefitsAdmin, EligibilityAnalyst, EnrollmentCounselor, HraAdministrator, BillingClerk, Actuary, ComplianceOfficer, Retiree]
    code: 200
    input: []
    output: Retiree
    side_effects: []

  - method: GET
    path: "/retiree-benefits/retirees"
    description: "List retirees with filtering and pagination."
    roles: [BenefitsAdmin, EligibilityAnalyst, EnrollmentCounselor, HraAdministrator, BillingClerk, Actuary, ComplianceOfficer]
    code: 200
    input: ["eligibility_status?", "medicare_status?", "grandfathered_group?", "limit?", "offset?"]
    output: Retiree[]
    side_effects: []

  - method: PATCH
    path: "/retiree-benefits/retirees/{retiree_id}"
    description: "Update the Medicare and other-coverage attributes that drive secondary-payer determination. hire_date and grandfathered_group are immutable."
    roles: [BenefitsAdmin, EligibilityAnalyst]
    code: 200
    input: ["medicare_status?", "medicare_part_b_effective_date?", "other_group_coverage_employer_size?", "active_employment_flag?", "esrd_flag?", "esrd_entitlement_date?", "disability_entitlement_flag?", "credited_service_months?"]
    output: Retiree
    side_effects: ["msp_payer_order_determination re-run for every Enrollment of the retiree whose coverage_status is PENDING, ACTIVE or SUSPENDED, in created_at ASC order", "version increments"]

  # ------------------------------------------------------------- PlanOption ---
  - method: POST
    path: "/retiree-benefits/plan-options"
    description: "Define a plan option in DRAFT under a plan year: pre-Medicare group, Medicare group wrap or individual exchange with HRA."
    roles: [BenefitsAdmin]
    code: 201
    input: [plan_year_id, plan_code, coverage_class, monthly_premium_cents, requires_medicare_part_b, allowed_grandfather_groups, subsidy_vehicle, rx_gross_value_bps, rx_net_value_bps]
    output: PlanOption
    side_effects: ["status set to DRAFT", "subsidy_certification_status set to NOT_STARTED", "enrolled_count set to 0"]

  - method: GET
    path: "/retiree-benefits/plan-options/{plan_option_id}"
    description: "Read one plan option including its actuarial-equivalence results and pending plan change."
    roles: [BenefitsAdmin, EligibilityAnalyst, EnrollmentCounselor, HraAdministrator, BillingClerk, Actuary, ComplianceOfficer, Retiree]
    code: 200
    input: []
    output: PlanOption
    side_effects: []

  - method: GET
    path: "/retiree-benefits/plan-options"
    description: "List plan options; filter by plan_year_id to reach every option of a plan year."
    roles: [BenefitsAdmin, EligibilityAnalyst, EnrollmentCounselor, HraAdministrator, BillingClerk, Actuary, ComplianceOfficer, Retiree]
    code: 200
    input: ["plan_year_id?", "coverage_class?", "status?", "subsidy_certification_status?", "limit?", "offset?"]
    output: PlanOption[]
    side_effects: []

  - method: POST
    path: "/retiree-benefits/plan-options/{plan_option_id}/activate"
    description: "Move a DRAFT plan option to ACTIVE so it can be elected."
    roles: [BenefitsAdmin]
    code: 200
    input: []
    output: PlanOption
    side_effects: ["status DRAFT -> ACTIVE"]

  - method: POST
    path: "/retiree-benefits/plan-options/{plan_option_id}/attest"
    description: "Record the actuary's attested prescription-drug values and run the actuarial equivalence gross and net tests."
    roles: [Actuary]
    code: 200
    input: [rx_gross_value_bps, rx_net_value_bps]
    output: PlanOption
    side_effects: ["actuarial_equivalence_test executed", "rx_gross_value_bps and rx_net_value_bps overwritten with the attested values", "gross_test_passed, net_test_passed and equivalence_margin_bps rewritten", "attested_by_user_id set to the calling X-User-ID", "subsidy_certification_status NOT_STARTED -> ATTESTED"]

  - method: POST
    path: "/retiree-benefits/plan-options/{plan_option_id}/subsidy-certification"
    description: "Compliance decision on the retiree drug subsidy (RDS) or employer group waiver plan (EGWP) election for an already attested option."
    roles: [ComplianceOfficer]
    code: 200
    input: [decision]
    output: PlanOption
    side_effects: ["subsidy_certification_status ATTESTED -> CERTIFIED when decision is CERTIFY, or ATTESTED -> REJECTED when decision is REJECT", "certified_by_user_id set to the calling X-User-ID"]

  - method: POST
    path: "/retiree-benefits/plan-options/{plan_option_id}/change-notice"
    description: "Issue a plan change communication with the statutory lead time and stage the change for later application."
    roles: [BenefitsAdmin]
    code: 200
    input: [change_type, effective_date, "new_monthly_premium_cents?"]
    output: PlanOption
    side_effects: ["plan_change_notice_lead_time executed", "change_notice_issued_at, pending_change_type, pending_change_effective_date and pending_new_monthly_premium_cents written"]

  # ------------------------------------------------ EligibilityDetermination ---
  - method: POST
    path: "/retiree-benefits/eligibility-determinations"
    description: "Run the retiree-medical eligibility rules for one retiree and plan year and record a DRAFT determination. Guarded by optimistic concurrency on the retiree."
    roles: [EligibilityAnalyst]
    code: 201
    input: [retiree_id, plan_year_id, expected_retiree_version]
    output: EligibilityDetermination
    side_effects: ["eligibility_rule_evaluation executed", "any existing DRAFT or CERTIFIED determination for the same (retiree_id, plan_year_id) -> SUPERSEDED", "Retiree.determination_sequence incremented and Retiree.eligibility_points rewritten, so Retiree.version increments", "created_by_user_id recorded from the calling X-User-ID"]

  - method: GET
    path: "/retiree-benefits/eligibility-determinations/{determination_id}"
    description: "Read one eligibility determination with its rule set, points and outcome."
    roles: [BenefitsAdmin, EligibilityAnalyst, EnrollmentCounselor, HraAdministrator, BillingClerk, Actuary, ComplianceOfficer, Retiree]
    code: 200
    input: []
    output: EligibilityDetermination
    side_effects: []

  - method: GET
    path: "/retiree-benefits/eligibility-determinations"
    description: "List eligibility determinations; filter by retiree_id or plan_year_id to reach every determination of a retiree or a plan year."
    roles: [BenefitsAdmin, EligibilityAnalyst, EnrollmentCounselor, HraAdministrator, BillingClerk, Actuary, ComplianceOfficer, Retiree]
    code: 200
    input: ["retiree_id?", "plan_year_id?", "status?", "outcome?", "limit?", "offset?"]
    output: EligibilityDetermination[]
    side_effects: []

  - method: POST
    path: "/retiree-benefits/eligibility-determinations/{determination_id}/certify"
    description: "Certify a DRAFT determination so it can gate elections, HRA funding and liability valuation."
    roles: [EligibilityAnalyst, ComplianceOfficer]
    code: 200
    input: []
    output: EligibilityDetermination
    side_effects: ["status DRAFT -> CERTIFIED", "certified_by_user_id set to the calling X-User-ID and certified_at set to the logical clock", "Retiree.eligibility_status set to ELIGIBLE or INELIGIBLE from the determination outcome"]

  - method: POST
    path: "/retiree-benefits/eligibility-determinations/{determination_id}/appeal"
    description: "Open an appeal against a CERTIFIED determination, moving it out of its certified state."
    roles: [Retiree, EnrollmentCounselor]
    code: 200
    input: [appeal_reason]
    output: EligibilityDetermination
    side_effects: ["status CERTIFIED -> UNDER_APPEAL", "appeal_reason stored", "Retiree.eligibility_status set back to UNDETERMINED"]

  - method: POST
    path: "/retiree-benefits/eligibility-determinations/{determination_id}/appeal-decision"
    description: "Decide an open appeal. UPHOLD returns the determination to CERTIFIED unchanged; REVERSE returns it to CERTIFIED with the outcome flipped."
    roles: [ComplianceOfficer]
    code: 200
    input: [decision]
    output: EligibilityDetermination
    side_effects: ["status UNDER_APPEAL -> CERTIFIED", "appeal_decision and appeal_decided_by_user_id recorded", "outcome flipped between ELIGIBLE and INELIGIBLE when decision is REVERSE", "Retiree.eligibility_status resynchronised from the resulting outcome"]

  # ----------------------------------------------------------- ElectionEvent ---
  - method: POST
    path: "/retiree-benefits/election-events"
    description: "Submit an annual-open or life-event election for a certified-eligible retiree, computing the election window and the coverage effective date."
    roles: [Retiree, EnrollmentCounselor]
    code: 201
    input: [retiree_id, plan_year_id, requested_plan_option_id, event_type, event_date]
    output: ElectionEvent
    side_effects: ["election_window_evaluation executed", "window_deadline and coverage_effective_date written", "status set to SUBMITTED and submitted_at set to the logical clock", "created_by_user_id recorded from the calling X-User-ID"]

  - method: GET
    path: "/retiree-benefits/election-events/{election_event_id}"
    description: "Read one election event including the enrollment it produced."
    roles: [BenefitsAdmin, EligibilityAnalyst, EnrollmentCounselor, HraAdministrator, BillingClerk, Actuary, ComplianceOfficer, Retiree]
    code: 200
    input: []
    output: ElectionEvent
    side_effects: []

  - method: GET
    path: "/retiree-benefits/election-events"
    description: "List election events; filter by retiree_id, plan_year_id, requested_plan_option_id or resulting_enrollment_id to reach every event referencing a given parent."
    roles: [BenefitsAdmin, EligibilityAnalyst, EnrollmentCounselor, HraAdministrator, BillingClerk, Actuary, ComplianceOfficer, Retiree]
    code: 200
    input: ["retiree_id?", "plan_year_id?", "requested_plan_option_id?", "resulting_enrollment_id?", "status?", "event_type?", "limit?", "offset?"]
    output: ElectionEvent[]
    side_effects: []

  - method: POST
    path: "/retiree-benefits/election-events/{election_event_id}/review"
    description: "Take a SUBMITTED election into enrollment-support review."
    roles: [EnrollmentCounselor, BenefitsAdmin]
    code: 200
    input: []
    output: ElectionEvent
    side_effects: ["status SUBMITTED -> UNDER_REVIEW", "reviewed_by_user_id set to the calling X-User-ID"]

  - method: POST
    path: "/retiree-benefits/election-events/{election_event_id}/decision"
    description: "Approve or deny an election under review. APPROVE materialises the Enrollment; DENY records a denial reason code."
    roles: [EnrollmentCounselor, BenefitsAdmin]
    code: 200
    input: [decision, "denial_reason_code?"]
    output: ElectionEvent
    side_effects: ["status UNDER_REVIEW -> APPROVED or DENIED", "on APPROVE: enrollment_coverage_interval_overlap enforced, a PENDING Enrollment created with coverage_effective_date copied from the event, msp_payer_order_determination executed, monthly_retiree_premium_cents computed by premium_invoice_assembly steps 1-6, PlanOption.enrolled_count incremented, resulting_enrollment_id written back", "on DENY: denial_reason_code stored and no Enrollment created"]

  # ------------------------------------------------------------- Enrollment ---
  - method: GET
    path: "/retiree-benefits/enrollments/{enrollment_id}"
    description: "Read one enrollment with its coverage dimension, billing dimension and Medicare secondary-payer determination."
    roles: [BenefitsAdmin, EligibilityAnalyst, EnrollmentCounselor, HraAdministrator, BillingClerk, Actuary, ComplianceOfficer, Retiree]
    code: 200
    input: []
    output: Enrollment
    side_effects: []

  - method: GET
    path: "/retiree-benefits/enrollments"
    description: "List enrollments; filter by retiree_id, plan_year_id, plan_option_id or election_event_id to reach every enrollment referencing a given parent."
    roles: [BenefitsAdmin, EligibilityAnalyst, EnrollmentCounselor, HraAdministrator, BillingClerk, Actuary, ComplianceOfficer, Retiree]
    code: 200
    input: ["retiree_id?", "plan_year_id?", "plan_option_id?", "election_event_id?", "coverage_status?", "billing_status?", "limit?", "offset?"]
    output: Enrollment[]
    side_effects: []

  - method: POST
    path: "/retiree-benefits/enrollments/{enrollment_id}/terminate"
    description: "Terminate coverage voluntarily or administratively, closing the coverage interval at the logical clock."
    roles: [BenefitsAdmin, EnrollmentCounselor]
    code: 200
    input: [termination_reason]
    output: Enrollment
    side_effects: ["coverage_status PENDING|ACTIVE|SUSPENDED -> TERMINATED with coverage_end_date set to the logical clock", "PlanOption.enrolled_count decremented, restoring enrollment_headcount_conservation", "every ISSUED or PARTIALLY_PAID PremiumInvoice of the enrollment -> WRITTEN_OFF"]

  - method: POST
    path: "/retiree-benefits/enrollments/{enrollment_id}/reinstate"
    description: "Reinstate a lapsed enrollment inside the reinstatement window once no other enrollment of the retiree carries a past-due balance."
    roles: [BillingClerk]
    code: 200
    input: []
    output: Enrollment
    side_effects: ["coverage_status TERMINATED -> ACTIVE with coverage_end_date cleared", "billing_status LAPSED -> REINSTATED, consecutive_unpaid_periods reset to 0, delinquency_first_unpaid_period_start and lapse_date cleared, reinstatement_count incremented", "PlanOption.enrolled_count incremented", "msp_payer_order_determination re-run", "the FROZEN HraAccount for (retiree_id, plan_year_id), if any, -> OPEN"]

  # ------------------------------------------------------------- HraAccount ---
  - method: POST
    path: "/retiree-benefits/hra-accounts"
    description: "Open a health reimbursement arrangement account for a certified-eligible retiree, funding it with the prorated annual credit plus any carryover from a closed prior-year account."
    roles: [HraAdministrator]
    code: 201
    input: [retiree_id, plan_year_id, covered_months, "prior_year_account_id?"]
    output: HraAccount
    side_effects: ["hra_annual_funding_and_carryover executed", "annual_credit_cents, carryover_in_cents, funded_cents and available_balance_cents written; the four spent buckets initialised to 0", "status set to OPEN"]

  - method: GET
    path: "/retiree-benefits/hra-accounts/{hra_account_id}"
    description: "Read one HRA account with its five-bucket ledger."
    roles: [BenefitsAdmin, EligibilityAnalyst, EnrollmentCounselor, HraAdministrator, BillingClerk, Actuary, ComplianceOfficer, Retiree]
    code: 200
    input: []
    output: HraAccount
    side_effects: []

  - method: GET
    path: "/retiree-benefits/hra-accounts"
    description: "List HRA accounts; filter by retiree_id, plan_year_id or prior_year_account_id to reach every account referencing a given parent, including the self-referential carryover chain."
    roles: [BenefitsAdmin, EligibilityAnalyst, EnrollmentCounselor, HraAdministrator, BillingClerk, Actuary, ComplianceOfficer, Retiree]
    code: 200
    input: ["retiree_id?", "plan_year_id?", "prior_year_account_id?", "status?", "limit?", "offset?"]
    output: HraAccount[]
    side_effects: []

  - method: POST
    path: "/retiree-benefits/hra-accounts/{hra_account_id}/close-year"
    description: "Close an OPEN account for the year, denying every non-terminal claim and forfeiting the balance above the carryover cap."
    roles: [HraAdministrator]
    code: 200
    input: []
    output: HraAccount
    side_effects: ["every ReimbursementClaim on the account in SUBMITTED, PENDING_SUBSTANTIATION or APPROVED -> DENIED (ACCOUNT_NOT_OPEN) with its pending hold released to available_balance_cents, in created_at ASC order", "hra_year_end_forfeiture executed, writing forfeited_cents and reducing available_balance_cents", "status OPEN -> CLOSED with closed_at set to the logical clock", "hra_ledger_conservation still holds"]

  # ------------------------------------------------------ ReimbursementClaim ---
  - method: POST
    path: "/retiree-benefits/reimbursement-claims"
    description: "Submit an HRA reimbursement claim. The provisional eligible amount is held against the account balance immediately. Guarded by optimistic concurrency on the account."
    roles: [Retiree, EnrollmentCounselor]
    code: 201
    input: [hra_account_id, expense_category, service_date, submitted_cents, expected_hra_account_version, "documentation_reference?"]
    output: ReimbursementClaim
    side_effects: ["hra_claim_eligible_amount PROVISIONAL variant executed, writing provisional_eligible_cents and eligible_cents", "HraAccount.pending_hold_cents increased and available_balance_cents decreased by the provisional amount, so HraAccount.version increments", "status set to SUBMITTED", "created_by_user_id recorded from the calling X-User-ID"]

  - method: GET
    path: "/retiree-benefits/reimbursement-claims/{claim_id}"
    description: "Read one reimbursement claim with both its provisional and final eligible amounts."
    roles: [BenefitsAdmin, EligibilityAnalyst, EnrollmentCounselor, HraAdministrator, BillingClerk, Actuary, ComplianceOfficer, Retiree]
    code: 200
    input: []
    output: ReimbursementClaim
    side_effects: []

  - method: GET
    path: "/retiree-benefits/reimbursement-claims"
    description: "List reimbursement claims; filter by hra_account_id to reach every claim of an account."
    roles: [BenefitsAdmin, EligibilityAnalyst, EnrollmentCounselor, HraAdministrator, BillingClerk, Actuary, ComplianceOfficer, Retiree]
    code: 200
    input: ["hra_account_id?", "status?", "expense_category?", "limit?", "offset?"]
    output: ReimbursementClaim[]
    side_effects: []

  - method: POST
    path: "/retiree-benefits/reimbursement-claims/{claim_id}/substantiation"
    description: "Attach substantiating documentation to a claim awaiting it, returning the claim to the review queue."
    roles: [Retiree, EnrollmentCounselor]
    code: 200
    input: [documentation_reference]
    output: ReimbursementClaim
    side_effects: ["status PENDING_SUBSTANTIATION -> SUBMITTED", "documentation_reference stored and substantiation_resubmit_count incremented"]

  - method: POST
    path: "/retiree-benefits/reimbursement-claims/{claim_id}/review"
    description: "Adjudicate a claim. APPROVE recomputes the eligible amount under the FINAL variant, DENY releases the whole provisional hold, and REQUEST_SUBSTANTIATION sends the claim back for documentation while keeping the hold in place."
    roles: [HraAdministrator]
    code: 200
    input: [decision, "denial_reason_code?"]
    output: ReimbursementClaim
    side_effects: ["on APPROVE: hra_claim_eligible_amount FINAL variant executed, eligible_cents rewritten, the difference against provisional_eligible_cents moved from pending_hold_cents back to available_balance_cents, status SUBMITTED -> APPROVED", "on DENY: the entire provisional hold released from pending_hold_cents to available_balance_cents, eligible_cents set to 0, denial_reason_code stored, status SUBMITTED -> DENIED", "on REQUEST_SUBSTANTIATION: status SUBMITTED -> PENDING_SUBSTANTIATION with the hold untouched", "reviewed_by_user_id set to the calling X-User-ID", "hra_ledger_conservation still holds"]

  - method: POST
    path: "/retiree-benefits/reimbursement-claims/{claim_id}/settlement"
    description: "Settle an approved claim (action PAY) or compensate an already paid claim (action REVERSE), which is the exact inverse of the payment."
    roles: [BillingClerk]
    code: 200
    input: [action]
    output: ReimbursementClaim
    side_effects: ["PAY: status APPROVED -> PAID, eligible_cents moved from pending_hold_cents to substantiated_paid_cents, paid_at set to the logical clock", "REVERSE: status PAID -> REVERSED, eligible_cents moved from substantiated_paid_cents back to available_balance_cents and paid_at cleared, so available_balance_cents returns to exactly its pre-PAY value", "hra_ledger_conservation still holds after both actions"]

  # --------------------------------------------------------- PremiumInvoice ---
  - method: POST
    path: "/retiree-benefits/premium-invoices"
    description: "Issue a premium invoice for one billing period of an enrollment, applying the administrative fee, the service-weighted employer subsidy and any available HRA balance."
    roles: [BillingClerk]
    code: 201
    input: [enrollment_id, billing_period_start, billing_period_end]
    output: PremiumInvoice
    side_effects: ["billing_period_overlap enforced under closed-interval semantics", "premium_invoice_assembly executed, writing all eleven computed money fields plus due_date and past_due_at", "when hra_applied_cents is positive the HraAccount's available_balance_cents decreases and premium_offset_cents increases by that amount, so HraAccount.version increments", "status set to PAID when net_due_cents is 0, otherwise ISSUED"]

  - method: GET
    path: "/retiree-benefits/premium-invoices/{invoice_id}"
    description: "Read one premium invoice with its full subsidy and HRA offset breakdown."
    roles: [BenefitsAdmin, EligibilityAnalyst, EnrollmentCounselor, HraAdministrator, BillingClerk, Actuary, ComplianceOfficer, Retiree]
    code: 200
    input: []
    output: PremiumInvoice
    side_effects: []

  - method: GET
    path: "/retiree-benefits/premium-invoices"
    description: "List premium invoices; filter by enrollment_id to reach every invoice of an enrollment."
    roles: [BenefitsAdmin, EligibilityAnalyst, EnrollmentCounselor, HraAdministrator, BillingClerk, Actuary, ComplianceOfficer, Retiree]
    code: 200
    input: ["enrollment_id?", "status?", "limit?", "offset?"]
    output: PremiumInvoice[]
    side_effects: []

  - method: POST
    path: "/retiree-benefits/premium-invoices/{invoice_id}/payments"
    description: "Record a retiree premium payment against an open invoice, clearing delinquency once the invoice is fully paid."
    roles: [Retiree, BillingClerk]
    code: 200
    input: [amount_cents]
    output: PremiumInvoice
    side_effects: ["paid_cents increased by amount_cents", "status -> PARTIALLY_PAID while paid_cents is below net_due_cents, or -> PAID once they are equal", "on full payment of an invoice that was PAST_DUE: Enrollment.consecutive_unpaid_periods decremented, and when it reaches 0 billing_status DELINQUENT -> CURRENT with delinquency_first_unpaid_period_start cleared and coverage_status SUSPENDED -> ACTIVE"]

  # ------------------------------------------- test-driving endpoints (/_*) ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical UTC clock, which every deadline, window, proration and sweep rule reads. Before any call to this endpoint the logical clock reads exactly the fixed startup default 2026-08-01T00:00:00Z and MUST NOT fall back to real wall-clock time."
    roles: [BenefitsAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: datetime }"
    side_effects: ["the logical clock used by every subsequent request is replaced; no entity is mutated"]

  - method: POST
    path: "/_ops/daily-run"
    description: "Run the scheduled daily benefits administration sweep: activate due coverage, age unpaid invoices into delinquency and lapse, apply due plan changes, and refresh Medicare secondary-payer determinations."
    roles: [BenefitsAdmin]
    code: 200
    input: []
    output: "{ processed_invoice_count: integer, activated_enrollment_count: integer, suspended_enrollment_count: integer, lapsed_enrollment_count: integer, applied_plan_change_count: integer, recomputed_msp_count: integer }"
    side_effects: ["delinquency_progression executed across all four pinned phases"]

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:

  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-ID or X-User-Role missing, empty, or X-User-Role is not one of the eight declared role names."
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "The caller's role is not listed in the target endpoint's roles."
  - id: ERR_PLAN_YEAR_NOT_FOUND
    http: 404
    condition: "A plan_year_id in the path or body matches no PlanYear."
  - id: ERR_RETIREE_NOT_FOUND
    http: 404
    condition: "A retiree_id in the path or body matches no Retiree."
  - id: ERR_PLAN_OPTION_NOT_FOUND
    http: 404
    condition: "A plan_option_id or requested_plan_option_id matches no PlanOption."
  - id: ERR_DETERMINATION_NOT_FOUND
    http: 404
    condition: "A determination_id matches no EligibilityDetermination."
  - id: ERR_ELECTION_EVENT_NOT_FOUND
    http: 404
    condition: "An election_event_id matches no ElectionEvent."
  - id: ERR_ENROLLMENT_NOT_FOUND
    http: 404
    condition: "An enrollment_id in the path or body matches no Enrollment."
  - id: ERR_HRA_ACCOUNT_NOT_FOUND
    http: 404
    condition: "An hra_account_id or prior_year_account_id matches no HraAccount."
  - id: ERR_CLAIM_NOT_FOUND
    http: 404
    condition: "A claim_id matches no ReimbursementClaim."
  - id: ERR_INVOICE_NOT_FOUND
    http: 404
    condition: "An invoice_id matches no PremiumInvoice."
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "A required field is absent, a field has the wrong JSON type, an enum value is undeclared, a money or basis-point field is negative, a timestamp does not parse, carryover_cap_pct falls outside [0, 1], an interval has start >= end, new_monthly_premium_cents is absent on a PREMIUM_INCREASE notice, or an actuarial attestation is attempted on an option whose subsidy_vehicle is NONE."
  - id: ERR_INVALID_PAGINATION
    http: 400
    condition: "limit outside [1, 100] or offset below 0 on a list endpoint."
  - id: ERR_STALE_RETIREE_VERSION
    http: 412
    condition: "expected_retiree_version does not equal the current Retiree.version when creating an eligibility determination."
  - id: ERR_STALE_HRA_ACCOUNT_VERSION
    http: 412
    condition: "expected_hra_account_version does not equal the current HraAccount.version when submitting a reimbursement claim."
  - id: ERR_INVALID_PLAN_YEAR_TRANSITION
    http: 409
    condition: "A plan-year status transition other than DRAFT->OPEN, OPEN->CLOSED or CLOSED->ARCHIVED is requested."
  - id: ERR_PLAN_YEAR_NOT_OPEN
    http: 409
    condition: "An eligibility determination, election, HRA account or premium invoice is attempted while the governing PlanYear.status is not OPEN."
  - id: ERR_PLAN_OPTION_NOT_ACTIVE
    http: 409
    condition: "An election or change notice targets a PlanOption whose status is DRAFT or RETIRED."
  - id: ERR_INVALID_DETERMINATION_STATE
    http: 409
    condition: "certify on a determination not in DRAFT, appeal on one not in CERTIFIED, or appeal-decision on one not in UNDER_APPEAL."
  - id: ERR_INVALID_ELECTION_STATE
    http: 409
    condition: "review on an election not in SUBMITTED, or decision on one not in UNDER_REVIEW."
  - id: ERR_INVALID_ENROLLMENT_STATE
    http: 409
    condition: "terminate on an already TERMINATED enrollment, or reinstate on an enrollment that is not TERMINATED with billing_status LAPSED."
  - id: ERR_HRA_ACCOUNT_NOT_OPEN
    http: 409
    condition: "A claim submission or a year-end close targets an HraAccount whose status is FROZEN or CLOSED."
  - id: ERR_INVALID_CLAIM_STATE
    http: 409
    condition: "substantiation on a claim not in PENDING_SUBSTANTIATION, review on a claim not in SUBMITTED, APPROVE of a claim with no documentation_reference, settlement PAY on a claim not in APPROVED, or settlement REVERSE on a claim not in PAID."
  - id: ERR_INVOICE_ALREADY_SETTLED
    http: 409
    condition: "A payment is posted to an invoice whose status is PAID or WRITTEN_OFF."
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "The X-User-ID approving, certifying, deciding or settling a record is the same X-User-ID that created or attested it."
  - id: ERR_ACTUARIAL_GROSS_TEST_FAILED
    http: 422
    condition: "Attested rx_gross_value_bps is below 10000, so the plan is not at least actuarially equivalent to standard Part D on a gross basis."
  - id: ERR_ACTUARIAL_NET_TEST_FAILED
    http: 422
    condition: "An EGWP option passes the gross test but its attested rx_net_value_bps is below 7450."
  - id: ERR_SUBSIDY_NOT_CERTIFIED
    http: 409
    condition: "An election is approved onto an RDS or EGWP option whose subsidy_certification_status is not CERTIFIED."
  - id: ERR_DETERMINATION_NOT_CERTIFIED
    http: 409
    condition: "An election or HRA account is created for, or an election is approved onto, a retiree with no CERTIFIED EligibilityDetermination for that plan year. The check is re-evaluated at APPROVE because an appeal can move a determination out of CERTIFIED after submission."
  - id: ERR_NOT_ELIGIBLE_FOR_RETIREE_MEDICAL
    http: 422
    condition: "The retiree's CERTIFIED determination for the plan year has outcome INELIGIBLE, at election creation, election approval or HRA account creation."
  - id: ERR_ELECTION_WINDOW_CLOSED
    http: 422
    condition: "An ANNUAL_OPEN election is submitted while the logical clock is outside the half-open window [open_enrollment_start, open_enrollment_end)."
  - id: ERR_LIFE_EVENT_WINDOW_EXPIRED
    http: 422
    condition: "A life-event election is submitted while the logical clock is outside the closed window [event_date, event_date + 31 days]."
  - id: ERR_PLAN_CLASS_MISMATCH
    http: 422
    condition: "The requested option's coverage_class does not match the retiree's Medicare posture."
  - id: ERR_MEDICARE_PART_B_REQUIRED
    http: 422
    condition: "The requested option requires Part B but the retiree has no medicare_part_b_effective_date on or before the coverage effective date."
  - id: ERR_GRANDFATHER_GROUP_NOT_PERMITTED
    http: 422
    condition: "The retiree's grandfathered_group is absent from the option's allowed_grandfather_groups."
  - id: ERR_DUPLICATE_ENROLLMENT_PERIOD
    http: 409
    condition: "The new coverage interval overlaps an existing Enrollment interval of the same retiree under half-open semantics."
  - id: ERR_BILLING_PERIOD_OVERLAP
    http: 409
    condition: "The new billing interval overlaps a non-written-off invoice interval of the same enrollment under closed semantics, including the case where the new start equals a prior end."
  - id: ERR_NOTICE_LEAD_TIME_INSUFFICIENT
    http: 422
    condition: "A plan change notice is issued with fewer whole days of lead time than the plan year's notice_lead_days."
  - id: ERR_REINSTATEMENT_WINDOW_EXPIRED
    http: 422
    condition: "Reinstatement is attempted after Enrollment.reinstatement_deadline."
  - id: ERR_EXPENSE_OUTSIDE_PLAN_YEAR
    http: 422
    condition: "A claim's service_date falls outside the account's plan-year coverage window."
  - id: ERR_DUPLICATE_PLAN_YEAR
    http: 409
    condition: "A PlanYear already exists for the requested year."
  - id: ERR_DUPLICATE_PLAN_CODE
    http: 409
    condition: "A PlanOption with the same plan_code already exists in the same plan year."
  - id: ERR_DUPLICATE_HRA_ACCOUNT
    http: 409
    condition: "An HraAccount already exists for the same (retiree_id, plan_year_id) pair, or the supplied prior_year_account_id belongs to a different retiree or to a plan year that is not earlier."
  - id: ERR_PRIOR_HRA_ACCOUNT_NOT_CLOSED
    http: 409
    condition: "The supplied prior_year_account_id references an HraAccount whose status is not CLOSED, so its unused balance is not yet final."
  - id: ERR_OUTSTANDING_PREMIUM_BALANCE
    http: 409
    condition: "Reinstatement is attempted while another enrollment of the same retiree carries a PAST_DUE invoice with a non-zero outstanding balance."
  - id: ERR_HRA_BALANCE_INSUFFICIENT
    http: 422
    condition: "A claim is submitted against an account whose available_balance_cents is zero, so no part of the expense can be held."
  - id: ERR_PAYMENT_EXCEEDS_BALANCE
    http: 422
    condition: "A premium payment exceeds the invoice's remaining balance (net_due_cents - paid_cents)."

# =============================================================================
# 1.7 RBAC Matrix
#
# role_model: segregation_of_duties. Seven operator roles are `opaque`; the
# eighth, Retiree, is entity_backed so ownership checks are unambiguous.
# =============================================================================
roles:

  - name: BenefitsAdmin
    description: "Plan sponsor administrator. Owns the plan-year and plan-option catalogue, retiree records, the logical clock and the nightly administration sweep."
    identity: "opaque"
    exclusive_operations:
      - "POST /retiree-benefits/plan-years"
      - "POST /retiree-benefits/plan-years/{plan_year_id}/status"
      - "POST /retiree-benefits/plan-options"
      - "POST /retiree-benefits/plan-options/{plan_option_id}/activate"
      - "POST /retiree-benefits/plan-options/{plan_option_id}/change-notice"
      - "POST /_clock/set_current_utc"
      - "POST /_ops/daily-run"
    shared_operations:
      - "POST /retiree-benefits/retirees (with EligibilityAnalyst)"
      - "PATCH /retiree-benefits/retirees/{retiree_id} (with EligibilityAnalyst)"
      - "POST /retiree-benefits/election-events/{election_event_id}/review (with EnrollmentCounselor)"
      - "POST /retiree-benefits/election-events/{election_event_id}/decision (with EnrollmentCounselor)"
      - "POST /retiree-benefits/enrollments/{enrollment_id}/terminate (with EnrollmentCounselor)"
      - "every GET endpoint except GET /retiree-benefits/retirees is shared with all roles"

  - name: EligibilityAnalyst
    description: "Runs the hire-date, age and service eligibility rules and certifies the resulting determinations."
    identity: "opaque"
    exclusive_operations:
      - "POST /retiree-benefits/eligibility-determinations"
    shared_operations:
      - "POST /retiree-benefits/retirees (with BenefitsAdmin)"
      - "PATCH /retiree-benefits/retirees/{retiree_id} (with BenefitsAdmin)"
      - "POST /retiree-benefits/eligibility-determinations/{determination_id}/certify (with ComplianceOfficer)"
      - "read access to every GET endpoint"

  - name: EnrollmentCounselor
    description: "Enrollment support. Submits and adjudicates elections on behalf of retirees, opens appeals and helps retirees file HRA claims."
    identity: "opaque"
    exclusive_operations: []
    shared_operations:
      - "POST /retiree-benefits/eligibility-determinations/{determination_id}/appeal (with Retiree)"
      - "POST /retiree-benefits/election-events (with Retiree)"
      - "POST /retiree-benefits/election-events/{election_event_id}/review (with BenefitsAdmin)"
      - "POST /retiree-benefits/election-events/{election_event_id}/decision (with BenefitsAdmin)"
      - "POST /retiree-benefits/enrollments/{enrollment_id}/terminate (with BenefitsAdmin)"
      - "POST /retiree-benefits/reimbursement-claims (with Retiree)"
      - "POST /retiree-benefits/reimbursement-claims/{claim_id}/substantiation (with Retiree)"
      - "read access to every GET endpoint"

  - name: HraAdministrator
    description: "Third-party HRA administrator. Funds accounts, adjudicates substantiation and closes accounts at year end."
    identity: "opaque"
    exclusive_operations:
      - "POST /retiree-benefits/hra-accounts"
      - "POST /retiree-benefits/hra-accounts/{hra_account_id}/close-year"
      - "POST /retiree-benefits/reimbursement-claims/{claim_id}/review"
    shared_operations:
      - "read access to every GET endpoint"

  - name: BillingClerk
    description: "Premium billing and collections. Issues invoices, settles approved HRA claims, and reinstates lapsed coverage."
    identity: "opaque"
    exclusive_operations:
      - "POST /retiree-benefits/premium-invoices"
      - "POST /retiree-benefits/reimbursement-claims/{claim_id}/settlement"
      - "POST /retiree-benefits/enrollments/{enrollment_id}/reinstate"
    shared_operations:
      - "POST /retiree-benefits/premium-invoices/{invoice_id}/payments (with Retiree)"
      - "read access to every GET endpoint"

  - name: Actuary
    description: "Attests prescription-drug actuarial values for subsidy elections and runs the accounting liability valuation."
    identity: "opaque"
    exclusive_operations:
      - "POST /retiree-benefits/plan-options/{plan_option_id}/attest"
      - "POST /retiree-benefits/plan-years/{plan_year_id}/liability-valuation"
    shared_operations:
      - "read access to every GET endpoint"

  - name: ComplianceOfficer
    description: "Independent control function. Certifies subsidy elections and decides eligibility appeals; never creates the records it reviews."
    identity: "opaque"
    exclusive_operations:
      - "POST /retiree-benefits/plan-options/{plan_option_id}/subsidy-certification"
      - "POST /retiree-benefits/eligibility-determinations/{determination_id}/appeal-decision"
    shared_operations:
      - "POST /retiree-benefits/eligibility-determinations/{determination_id}/certify (with EligibilityAnalyst)"
      - "read access to every GET endpoint"

  - name: Retiree
    description: "The covered retiree. X-User-ID is the Retiree.id, so ownership checks compare it directly against the retiree_id chain of the target resource."
    identity: "entity_backed:Retiree"
    exclusive_operations: []
    shared_operations:
      - "POST /retiree-benefits/eligibility-determinations/{determination_id}/appeal (with EnrollmentCounselor)"
      - "POST /retiree-benefits/election-events (with EnrollmentCounselor)"
      - "POST /retiree-benefits/reimbursement-claims (with EnrollmentCounselor)"
      - "POST /retiree-benefits/reimbursement-claims/{claim_id}/substantiation (with EnrollmentCounselor)"
      - "POST /retiree-benefits/premium-invoices/{invoice_id}/payments (with BillingClerk)"
      - "read access to every GET endpoint except GET /retiree-benefits/retirees"
