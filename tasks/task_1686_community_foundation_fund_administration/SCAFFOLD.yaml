  - method: GET
    path: "/funds/{fundId}/fee-assessments"
    description: "List fee assessments"
    roles: [FoundationAdmin, FinanceOfficer]
    code: 200
    input: ["limit?", "offset?"]
    output: "FeeAssessment[]"
    side_effects: []

  - method: POST
    path: "/funds/{fundId}/annual-statements"
    description: "Generate annual statement for a fiscal year"
    roles: [FoundationAdmin]
    code: 201
    input: [fiscal_year]
    output: AnnualStatement
    side_effects: ["roll-forward computed; status GENERATED"]

  - method: GET
    path: "/funds/{fundId}/annual-statements"
    description: "List annual statements"
    roles: [FoundationAdmin, FinanceOfficer, Advisor]
    code: 200
    input: ["limit?", "offset?"]
