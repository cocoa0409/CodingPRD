- rule_id: boundary_precision_check
  instances:
  - name: long_lead_threshold_inclusive_at_exactly_ninety_days
    grounds:
    - calculations.release_for_fabrication_schedule
    - entities.MaterialPackage.fields.is_long_lead
    distinguishing_aspect: 'is_long_lead uses >= LONG_LEAD_THRESHOLD_DAYS over fabrication_duration_days + delivery_transit_days ONLY: 70 + 20 == 90 is true, and 60 + 29 == 89 is false even though its submittal_review_days of 21 would push lead_time_days to 110.'
    test_recipe:
      setup:
      - An empty project, clock at its 2026-08-01T00:00:00Z startup default
      setup_api_calls:
      - call: POST /procurement/projects
        payload: {name: Riverside Medical Tower, contract_number: GC-2996-A, owner_name: Riverside Health System, schedule_data_date: '2026-08-01T00:00:00.000Z', escalation_contingency_budget: '500000.00'}
        as: BuyoutManager
        captures: {proj_id: $.data.id}
      trigger:
      - call: POST /procurement/material-packages
        payload: {project_id: '${proj_id}', scope_code: STRUCT-STEEL-01, description: Package at the long-lead boundary, commodity_index_code: PPI_STEEL_MILL, estimated_cost: '1200000.00', required_onsite_date: '2027-03-01T00:00:00.000Z', fabrication_duration_days: 70, delivery_transit_days: 20, submittal_review_days: 21}
        as: BuyoutManager
        captures: {pkg_at_id: $.data.id}
      - call: POST /procurement/material-packages
        payload: {project_id: '${proj_id}', scope_code: STRUCT-STEEL-02, description: Package one day below the long-lead boundary, commodity_index_code: PPI_STEEL_MILL, estimated_cost: '1200000.00', required_onsite_date: '2027-03-01T00:00:00.000Z', fabrication_duration_days: 60, delivery_transit_days: 29, submittal_review_days: 21}
        as: BuyoutManager
        captures: {pkg_below_id: $.data.id}
      assert:
      - MaterialPackage.${pkg_at_id}.is_long_lead == true with fabrication_duration_days 70 + delivery_transit_days 20 == 90
      - MaterialPackage.${pkg_at_id}.lead_time_days == 111 and release_for_fabrication_date == "2026-11-10T00:00:00.000Z"
      - MaterialPackage.${pkg_below_id}.is_long_lead == false with 60 + 29 == 89
      - MaterialPackage.${pkg_below_id}.lead_time_days == 110 and release_for_fabrication_date == "2026-11-11T00:00:00.000Z"
      - MaterialPackage.${pkg_below_id}.float_days == 102
  - name: supplier_exposure_high_band_at_exactly_sixty_blocks_commitment
    grounds:
    - calculations.supplier_exposure_score
    - validations[priority=70]
    - errors[ERR_SUPPLIER_EXPOSURE_TOO_HIGH]
    distinguishing_aspect: 'EXPOSURE_HIGH_THRESHOLD is an inclusive lower bound: a CN supplier declaring 25.00 pct scores exactly 60.00 (tariff component capped at 40 plus the 20 non-domestic penalty) and its quote cannot be bought out, while declaring 24.90 pct scores 59.84 / ELEVATED and the identical commitment succeeds.'
    test_recipe:
      setup:
      - Two steel packages each estimated at 1200000.00
      - Supplier 'Pacific Rim Steel' registered as CN with declared_tariff_rate_pct 25.00, scoring exactly 60.00 / HIGH
      - Supplier 'Han River Metals' registered as CN with declared_tariff_rate_pct 24.90, scoring 59.84 / ELEVATED
      - Each supplier holds one OPEN quote at base_price 1150000.00 on its own package
      - The project's version has been read once and no write has advanced it since
      setup_api_calls:
      - call: POST /procurement/projects
        payload: {name: Riverside Medical Tower, contract_number: GC-2996-A, owner_name: Riverside Health System, schedule_data_date: '2026-08-01T00:00:00.000Z', escalation_contingency_budget: '500000.00'}
        as: BuyoutManager
        captures: {proj_id: $.data.id}
      - call: POST /procurement/material-packages
        payload: {project_id: '${proj_id}', scope_code: STRUCT-STEEL-01, description: Package quoted by the HIGH-exposure supplier, commodity_index_code: PPI_STEEL_MILL, estimated_cost: '1200000.00', required_onsite_date: '2027-03-01T00:00:00.000Z', fabrication_duration_days: 70, delivery_transit_days: 20, submittal_review_days: 21}
        as: BuyoutManager
        captures: {pkg_high_id: $.data.id}
      - call: POST /procurement/material-packages
        payload: {project_id: '${proj_id}', scope_code: STRUCT-STEEL-02, description: Package quoted by the ELEVATED-exposure supplier, commodity_index_code: PPI_STEEL_MILL, estimated_cost: '1200000.00', required_onsite_date: '2027-03-01T00:00:00.000Z', fabrication_duration_days: 70, delivery_transit_days: 20, submittal_review_days: 21}
        as: BuyoutManager
        captures: {pkg_elev_id: $.data.id}
      - call: POST /procurement/suppliers
        payload: {legal_name: Pacific Rim Steel, country_of_origin: CN, declared_tariff_rate_pct: '25.00'}
        as: BuyoutManager
        captures: {sup_high_id: $.data.id}
      - call: POST /procurement/suppliers
        payload: {legal_name: Han River Metals, country_of_origin: CN, declared_tariff_rate_pct: '24.90'}
        as: BuyoutManager
        captures: {sup_elev_id: $.data.id}
      - call: POST /procurement/quotes
        payload: {material_package_id: '${pkg_high_id}', supplier_id: '${sup_high_id}', base_price: '1150000.00', received_at: '2026-08-01T00:00:00.000Z', price_hold_days: 45}
        as: SupplierRep
        as_user_id: ${sup_high_id}
        captures: {q_high_id: $.data.id}
      - call: POST /procurement/quotes
        payload: {material_package_id: '${pkg_elev_id}', supplier_id: '${sup_elev_id}', base_price: '1150000.00', received_at: '2026-08-01T00:00:00.000Z', price_hold_days: 45}
        as: SupplierRep
        as_user_id: ${sup_elev_id}
        captures: {q_elev_id: $.data.id}
      - call: GET /procurement/projects/${proj_id}
        payload: {}
        as: BuyoutManager
        captures: {pv: $.data.version}
      trigger:
      - call: POST /procurement/purchase-commitments
        payload: {quote_id: '${q_high_id}', po_number: PO-2996-0031, expected_project_version: '${pv}', is_early_buyout: false}
        as: BuyoutManager
        captures: {pc_high_id: $.data.id}
      - call: POST /procurement/purchase-commitments
        payload: {quote_id: '${q_elev_id}', po_number: PO-2996-0032, expected_project_version: '${pv}', is_early_buyout: false}
        as: BuyoutManager
        captures: {pc_elev_id: $.data.id}
      assert:
      - Supplier.${sup_high_id}.exposure_score_snapshot == 60.00 and exposure_band_snapshot == HIGH
      - Supplier.${sup_elev_id}.exposure_score_snapshot == 59.84 and exposure_band_snapshot == ELEVATED
      - the first trigger call fails with error_id ERR_SUPPLIER_EXPOSURE_TOO_HIGH and HTTP 409
      - the second trigger call returns HTTP 201 with PurchaseCommitment.${pc_elev_id}.commitment_status == PENDING
      - MaterialPackage.${pkg_high_id}.status == SOURCING (never BOUGHT_OUT)
      - MaterialPackage.${pkg_elev_id}.status == BOUGHT_OUT
      - the second call succeeded with the same expected_project_version the first call used, proving the rejected request did not advance Project.version
  - name: rff_risk_band_boundaries_at_zero_fourteen_and_fifteen_float_days
    grounds:
    - calculations.release_for_fabrication_schedule
    - entities.MaterialPackage.fields.rff_risk_band
    - entities.MaterialPackage.fields.float_days
    distinguishing_aspect: 'The band cut-points are RFF_CRITICAL_FLOAT_DAYS 0 (inclusive, CRITICAL) and RFF_AT_RISK_FLOAT_DAYS 14 (inclusive, AT_RISK): with lead_time_days 111 and the clock at 2026-08-01, required_onsite 2026-11-20 gives float 0 / CRITICAL, 2026-12-04 gives float 14 / AT_RISK and 2026-12-05 gives float 15 / ON_TRACK.'
    test_recipe:
      setup:
      - An empty project, clock at its 2026-08-01T00:00:00Z startup default
      - All three packages share fabrication_duration_days 70, delivery_transit_days 20 and submittal_review_days 21, so lead_time_days is 111
      setup_api_calls:
      - call: POST /procurement/projects
        payload: {name: Riverside Medical Tower, contract_number: GC-2996-A, owner_name: Riverside Health System, schedule_data_date: '2026-08-01T00:00:00.000Z', escalation_contingency_budget: '500000.00'}
        as: BuyoutManager
        captures: {proj_id: $.data.id}
      trigger:
      - call: POST /procurement/material-packages
        payload: {project_id: '${proj_id}', scope_code: STRUCT-STEEL-01, description: Package whose release date is today, commodity_index_code: PPI_STEEL_MILL, estimated_cost: '1200000.00', required_onsite_date: '2026-11-20T00:00:00.000Z', fabrication_duration_days: 70, delivery_transit_days: 20, submittal_review_days: 21}
        as: BuyoutManager
        captures: {pkg_crit_id: $.data.id}
      - call: POST /procurement/material-packages
        payload: {project_id: '${proj_id}', scope_code: STRUCT-STEEL-02, description: Package with 14 days of float, commodity_index_code: PPI_STEEL_MILL, estimated_cost: '1200000.00', required_onsite_date: '2026-12-04T00:00:00.000Z', fabrication_duration_days: 70, delivery_transit_days: 20, submittal_review_days: 21}
        as: BuyoutManager
        captures: {pkg_risk_id: $.data.id}
      - call: POST /procurement/material-packages
        payload: {project_id: '${proj_id}', scope_code: STRUCT-STEEL-03, description: Package with 15 days of float, commodity_index_code: PPI_STEEL_MILL, estimated_cost: '1200000.00', required_onsite_date: '2026-12-05T00:00:00.000Z', fabrication_duration_days: 70, delivery_transit_days: 20, submittal_review_days: 21}
        as: BuyoutManager
        captures: {pkg_ok_id: $.data.id}
      assert:
      - MaterialPackage.${pkg_crit_id}.release_for_fabrication_date == "2026-08-01T00:00:00.000Z", float_days == 0, rff_risk_band == CRITICAL
      - MaterialPackage.${pkg_risk_id}.release_for_fabrication_date == "2026-08-15T00:00:00.000Z", float_days == 14, rff_risk_band == AT_RISK
      - MaterialPackage.${pkg_ok_id}.release_for_fabrication_date == "2026-08-16T00:00:00.000Z", float_days == 15, rff_risk_band == ON_TRACK
      - all three report lead_time_days == 111 and is_long_lead == true
  - name: price_hold_adjacent_window_allowed_and_one_day_overlap_rejected
    grounds:
    - validations[priority=80]
    - errors[ERR_PRICE_HOLD_OVERLAP]
    - entities.Quote.fields.expires_at
    distinguishing_aspect: 'The price-hold interval is HALF-OPEN [received_at, expires_at): a new quote whose received_at is exactly the CONVERTED quote''s expires_at (2026-08-11) is accepted, while a new quote received one day earlier (2026-08-10) overlaps and is refused with ERR_PRICE_HOLD_OVERLAP.'
    test_recipe:
      setup:
      - Steel package with a quote from Ironworks Fabricators LLC received 2026-08-01 with price_hold_days 10, so expires_at is 2026-08-11
      - That quote has been bought out and committed, so its status is CONVERTED — still inside the {OPEN, CONVERTED} overlap-eligibility set
      - Clock advanced to 2026-08-11
      setup_api_calls:
      - call: POST /procurement/projects
        payload: {name: Riverside Medical Tower, contract_number: GC-2996-A, owner_name: Riverside Health System, schedule_data_date: '2026-08-01T00:00:00.000Z', escalation_contingency_budget: '500000.00'}
        as: BuyoutManager
        captures: {proj_id: $.data.id}
      - call: POST /procurement/material-packages
