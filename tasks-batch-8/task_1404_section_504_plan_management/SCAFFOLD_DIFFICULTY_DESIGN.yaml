# =============================================================================
# §1.8 Scaffold Difficulty Design — Test Targeting Index
# Section 504 Plan Management — 9 rules × 2 instances each = 18 instances
# =============================================================================

scaffold_difficulty_design:

  # ===========================================================================
  # Rule 1 — dual_variant_calc (two different entity domains)
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: implementation_compliance_trailing_vs_cumulative_diverge
        grounds:
          - calculations.implementation_compliance_ratio
          - entities.Section504Plan.fields.implementation_compliance_pct
        distinguishing_aspect: |
          Same ImplementationLog history on the same Section504Plan yields
          different compliance_pct values under the two variants:
          trailing_30_day excludes the old success log (window = last 30 days),
          cumulative_plan_year includes it (anchor = plan_effective_date).
          Entity domain: Section504Plan implementation monitoring.
        test_recipe:
          setup:
            - "School S1 created at clock=2025-12-15; coordinator CO; teacher T1 (TRAINED_CURRENT via training on 2025-12-20)"
            - "Student STU; full pipeline to plan P with one ACTIVE accommodation A1; clock advanced to 2026-01-01 BEFORE final ack so plan_effective_date = 2026-01-01"
            - "ImplementationLog L_old (log_date=2026-02-01, was_implemented_as_planned=true)"
            - "ImplementationLog L_new (log_date=2026-07-25, was_implemented_as_planned=false, deviation_notes provided)"
            - "Clock advanced to 2026-08-01T00:00:00Z before read"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2025-12-15T00:00:00Z" }
              as: District504Director
              as_user_id: "bootstrap-director"
            - call: "POST /schools"
              payload: { school_name: "Lincoln High", district_code: "D01", current_academic_year: "2025-2026" }
              as: District504Director
              as_user_id: "bootstrap-director"
              captures: { school_id: $.data.id }
            - call: "POST /staff-members"
              payload: { school_id: "${school_id}", staff_external_ref: "CO-1", full_name: "Coordinator One", staff_role: "COORDINATOR" }
              as: District504Director
              as_user_id: "bootstrap-director"
              captures: { co_id: $.data.id }
            - call: "POST /staff-members"
              payload: { school_id: "${school_id}", staff_external_ref: "T-1", full_name: "Teacher One", staff_role: "TEACHER" }
              as: District504Director
              as_user_id: "bootstrap-director"
              captures: { t1_id: $.data.id }
            - call: "POST /training-records"
              payload: { staff_id: "${t1_id}", training_topic: "SECTION_504_BASICS", trained_at: "2025-12-20T00:00:00Z" }
              as: District504Director
              as_user_id: "bootstrap-director"
            - call: "POST /students"
              payload: { school_id: "${school_id}", student_external_ref: "STU-1", full_name: "Student One", date_of_birth: "2012-05-15T00:00:00Z", grade_level: 8 }
              as: Section504Coordinator
              as_user_id: "${co_id}"
              captures: { stu_id: $.data.id }
            - call: "POST /referrals"
              payload: { student_id: "${stu_id}", referral_reason: "Teacher observes attention difficulty", suspected_disability_category: "LEARNING" }
              as: Teacher
              as_user_id: "${t1_id}"
              captures: { ref_id: $.data.id }
            - call: "POST /referrals/${ref_id}/start-review"
              payload: {}
              as: Section504Coordinator
              as_user_id: "${co_id}"
            - call: "POST /referrals/${ref_id}/initiate-evaluation"
              payload: {}
              as: Section504Coordinator
              as_user_id: "${co_id}"
              captures: { eval_id: $.data.id }
            - call: "POST /evaluations/${eval_id}/request-consent"
              payload: {}
              as: Section504Coordinator
              as_user_id: "${co_id}"
            - call: "POST /evaluations/${eval_id}/record-consent"
              payload: { granted: true, responded_by_parent_ref: "parent-1" }
              as: Section504Coordinator
              as_user_id: "${co_id}"
            - call: "POST /evaluations/${eval_id}/start"
              payload: {}
              as: Section504Coordinator
              as_user_id: "${co_id}"
            - call: "POST /evaluations/${eval_id}/determine"
              payload: { determination_outcome: "ELIGIBLE", disability_impairment_found: true, major_life_activity_affected: true }
              as: Section504Coordinator
              as_user_id: "${co_id}"
            - call: "GET /students/${stu_id}"
              payload: {}
              as: Section504Coordinator
              as_user_id: "${co_id}"
              captures: { stu_v: $.data.version }
            - call: "POST /plans"
              payload: { student_id: "${stu_id}", evaluation_id: "${eval_id}", expected_student_version: "${stu_v}" }
              as: Section504Coordinator
              as_user_id: "${co_id}"
              captures: { plan_id: $.data.id }
            - call: "POST /accommodations"
              payload: { plan_id: "${plan_id}", accommodation_type: "EXTENDED_TIME", description: "1.5x time on assessments", applies_to_testing: true }
              as: Section504Coordinator
              as_user_id: "${co_id}"
              captures: { ac1_id: $.data.id }
            - call: "GET /plans/${plan_id}"
              payload: {}
              as: Section504Coordinator
              as_user_id: "${co_id}"
              captures: { plan_v: $.data.version }
            - call: "POST /plans/${plan_id}/submit-for-consent"
              payload: { expected_plan_version: "${plan_v}" }
              as: Section504Coordinator
              as_user_id: "${co_id}"
            - call: "POST /plans/${plan_id}/record-parent-consent"
              payload: { granted: true, responded_by_parent_ref: "parent-1" }
              as: Section504Coordinator
              as_user_id: "${co_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: District504Director
              as_user_id: "bootstrap-director"
            - call: "GET /teacher-acks?plan_id=${plan_id}&ack_status=PENDING"
              payload: {}
              as: Section504Coordinator
              as_user_id: "${co_id}"
              captures: { ack1_id: '$.data[0].id' }
            - call: "POST /teacher-acks/${ack1_id}/acknowledge"
              payload: {}
              as: Teacher
              as_user_id: "${t1_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: District504Director
              as_user_id: "bootstrap-director"
            - call: "POST /implementation-logs"
              payload: { plan_id: "${plan_id}", accommodation_id: "${ac1_id}", log_date: "2026-02-01T00:00:00Z", was_implemented_as_planned: true }
              as: Teacher
              as_user_id: "${t1_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-25T00:00:00Z" }
              as: District504Director
              as_user_id: "bootstrap-director"
            - call: "POST /implementation-logs"
              payload: { plan_id: "${plan_id}", accommodation_id: "${ac1_id}", log_date: "2026-07-25T00:00:00Z", was_implemented_as_planned: false, deviation_notes: "Sub forgot extended time" }
              as: Teacher
              as_user_id: "${t1_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: District504Director
              as_user_id: "bootstrap-director"
          trigger:
            - call: "GET /plans/${plan_id}/compliance-summary"
              payload: {}
              as: Section504Coordinator
              as_user_id: "${co_id}"
              captures:
                trailing_pct: $.data.implementation_compliance_pct_trailing_30
                cumulative_pct: $.data.implementation_compliance_pct_cumulative
          assert:
            - "implementation_compliance_pct_trailing_30 == 0.0 (only L_new inside last-30-day window; 0 implemented / 1 total)"
            - "implementation_compliance_pct_cumulative == 50.0 (both logs inside plan-year window; 1 implemented / 2 total)"
            - "trailing_pct != cumulative_pct — variants genuinely diverge on identical log history"

      - name: annual_review_window_annual_vs_reeval_variant_diverge
        grounds:
          - calculations.annual_review_window_check
          - entities.ReviewEvent.fields.was_late
        distinguishing_aspect: |
          Same review-timing input yields different was_late outcomes under the
          two variants: ANNUAL applies a 14-day grace window (overdue only when
          days_since_anchor > 379), while RE_EVALUATION applies no grace
          (overdue strictly at > 1095 days). Entity domain: ReviewEvent cadence
          (different entity from the implementation_compliance instance above).
        test_recipe:
          setup:
            - "Two schools S_a and S_b, each with active plan (P_a and P_b) anchored at 2025-08-01"
            - "Schedule an ANNUAL review on P_a with scheduled_for = 2026-08-01T00:00:00Z (exactly 365 days after anchor)"
            - "Schedule a RE_EVALUATION review on P_b with scheduled_for = 2026-08-01T00:00:00Z"
            - "Advance clock to 2026-08-10T00:00:00Z (374 days after anchor): within ANNUAL grace, past RE_EVALUATION date"
          setup_api_calls:
            # --- S_a setup ---
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2025-07-15T00:00:00Z" }
              as: District504Director
              as_user_id: "bootstrap-director"
            - call: "POST /schools"
              payload: { school_name: "School A", district_code: "D01", current_academic_year: "2025-2026" }
              as: District504Director
              as_user_id: "bootstrap-director"
              captures: { school_a_id: $.data.id }
            - call: "POST /staff-members"
              payload: { school_id: "${school_a_id}", staff_external_ref: "CO-A", full_name: "Coordinator A", staff_role: "COORDINATOR" }
              as: District504Director
              as_user_id: "bootstrap-director"
              captures: { co_a_id: $.data.id }
            - call: "POST /staff-members"
              payload: { school_id: "${school_a_id}", staff_external_ref: "T-A", full_name: "Teacher A", staff_role: "TEACHER" }
              as: District504Director
              as_user_id: "bootstrap-director"
              captures: { t_a_id: $.data.id }
            - call: "POST /training-records"
              payload: { staff_id: "${t_a_id}", training_topic: "SECTION_504_BASICS", trained_at: "2025-07-16T00:00:00Z" }
              as: District504Director
              as_user_id: "bootstrap-director"
            - call: "POST /students"
              payload: { school_id: "${school_a_id}", student_external_ref: "STU-A", full_name: "Student A", date_of_birth: "2012-01-01T00:00:00Z", grade_level: 8 }
              as: Section504Coordinator
              as_user_id: "${co_a_id}"
              captures: { stu_a_id: $.data.id }
            - call: "POST /referrals"
              payload: { student_id: "${stu_a_id}", referral_reason: "reason A", suspected_disability_category: "LEARNING" }
              as: Teacher
              as_user_id: "${t_a_id}"
              captures: { ref_a_id: $.data.id }
            - call: "POST /referrals/${ref_a_id}/start-review"
              payload: {}
              as: Section504Coordinator
              as_user_id: "${co_a_id}"
            - call: "POST /referrals/${ref_a_id}/initiate-evaluation"
              payload: {}
              as: Section504Coordinator
              as_user_id: "${co_a_id}"
              captures: { eval_a_id: $.data.id }
            - call: "POST /evaluations/${eval_a_id}/request-consent"
              payload: {}
              as: Section504Coordinator
              as_user_id: "${co_a_id}"
            - call: "POST /evaluations/${eval_a_id}/record-consent"
              payload: { granted: true, responded_by_parent_ref: "parent-A" }
              as: Section504Coordinator
              as_user_id: "${co_a_id}"
            - call: "POST /evaluations/${eval_a_id}/start"
              payload: {}
              as: Section504Coordinator
              as_user_id: "${co_a_id}"
            - call: "POST /evaluations/${eval_a_id}/determine"
              payload: { determination_outcome: "ELIGIBLE", disability_impairment_found: true, major_life_activity_affected: true }
              as: Section504Coordinator
              as_user_id: "${co_a_id}"
            - call: "GET /students/${stu_a_id}"
              payload: {}
              as: Section504Coordinator
              as_user_id: "${co_a_id}"
              captures: { stu_a_v: $.data.version }
            - call: "POST /plans"
              payload: { student_id: "${stu_a_id}", evaluation_id: "${eval_a_id}", expected_student_version: "${stu_a_v}" }
              as: Section504Coordinator
              as_user_id: "${co_a_id}"
              captures: { plan_a_id: $.data.id }
            - call: "POST /accommodations"
              payload: { plan_id: "${plan_a_id}", accommodation_type: "EXTENDED_TIME", description: "A", applies_to_testing: false }
              as: Section504Coordinator
              as_user_id: "${co_a_id}"
            - call: "GET /plans/${plan_a_id}"
              payload: {}
              as: Section504Coordinator
              as_user_id: "${co_a_id}"
              captures: { plan_a_v: $.data.version }
            - call: "POST /plans/${plan_a_id}/submit-for-consent"
              payload: { expected_plan_version: "${plan_a_v}" }
              as: Section504Coordinator
              as_user_id: "${co_a_id}"
            - call: "POST /plans/${plan_a_id}/record-parent-consent"
              payload: { granted: true, responded_by_parent_ref: "parent-A" }
              as: Section504Coordinator
              as_user_id: "${co_a_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2025-08-01T00:00:00Z" }
              as: District504Director
              as_user_id: "bootstrap-director"
            - call: "GET /teacher-acks?plan_id=${plan_a_id}&ack_status=PENDING"
              payload: {}
              as: Section504Coordinator
              as_user_id: "${co_a_id}"
              captures: { ack_a_id: '$.data[0].id' }
            - call: "POST /teacher-acks/${ack_a_id}/acknowledge"
              payload: {}
              as: Teacher
              as_user_id: "${t_a_id}"
            # plan_a ACTIVE; plan_effective_date = 2025-08-01
            # --- S_b setup (mirrors S_a) ---
            - call: "POST /schools"
              payload: { school_name: "School B", district_code: "D01", current_academic_year: "2025-2026" }
              as: District504Director
              as_user_id: "bootstrap-director"
              captures: { school_b_id: $.data.id }
            - call: "POST /staff-members"
              payload: { school_id: "${school_b_id}", staff_external_ref: "CO-B", full_name: "Coordinator B", staff_role: "COORDINATOR" }
              as: District504Director
              as_user_id: "bootstrap-director"
              captures: { co_b_id: $.data.id }
            - call: "POST /staff-members"
              payload: { school_id: "${school_b_id}", staff_external_ref: "T-B", full_name: "Teacher B", staff_role: "TEACHER" }
              as: District504Director
              as_user_id: "bootstrap-director"
              captures: { t_b_id: $.data.id }
            - call: "POST /training-records"
              payload: { staff_id: "${t_b_id}", training_topic: "SECTION_504_BASICS", trained_at: "2025-07-16T00:00:00Z" }
              as: District504Director
              as_user_id: "bootstrap-director"
            - call: "POST /students"
              payload: { school_id: "${school_b_id}", student_external_ref: "STU-B", full_name: "Student B", date_of_birth: "2012-01-01T00:00:00Z", grade_level: 8 }
              as: Section504Coordinator
              as_user_id: "${co_b_id}"
              captures: { stu_b_id: $.data.id }
            - call: "POST /referrals"
              payload: { student_id: "${stu_b_id}", referral_reason: "reason B", suspected_disability_category: "LEARNING" }
              as: Teacher
              as_user_id: "${t_b_id}"
              captures: { ref_b_id: $.data.id }
            - call: "POST /referrals/${ref_b_id}/start-review"
              payload: {}
              as: Section504Coordinator
              as_user_id: "${co_b_id}"
            - call: "POST /referrals/${ref_b_id}/initiate-evaluation"
              payload: {}
              as: Section504Coordinator
              as_user_id: "${co_b_id}"
              captures: { eval_b_id: $.data.id }
            - call: "POST /evaluations/${eval_b_id}/request-consent"
              payload: {}
              as: Section504Coordinator
              as_user_id: "${co_b_id}"
            - call: "POST /evaluations/${eval_b_id}/record-consent"
              payload: { granted: true, responded_by_parent_ref: "parent-B" }
              as: Section504Coordinator
              as_user_id: "${co_b_id}"
            - call: "POST /evaluations/${eval_b_id}/start"
              payload: {}
              as: Section504Coordinator
              as_user_id: "${co_b_id}"
            - call: "POST /evaluations/${eval_b_id}/determine"
              payload: { determination_outcome: "ELIGIBLE", disability_impairment_found: true, major_life_activity_affected: true }
              as: Section504Coordinator
              as_user_id: "${co_b_id}"
            - call: "GET /students/${stu_b_id}"
              payload: {}
              as: Section504Coordinator
              as_user_id: "${co_b_id}"
              captures: { stu_b_v: $.data.version }
            - call: "POST /plans"
              payload: { student_id: "${stu_b_id}", evaluation_id: "${eval_b_id}", expected_student_version: "${stu_b_v}" }
              as: Section504Coordinator
              as_user_id: "${co_b_id}"
              captures: { plan_b_id: $.data.id }
            - call: "POST /accommodations"
              payload: { plan_id: "${plan_b_id}", accommodation_type: "EXTENDED_TIME", description: "B", applies_to_testing: false }
              as: Section504Coordinator
              as_user_id: "${co_b_id}"
            - call: "GET /plans/${plan_b_id}"
              payload: {}
              as: Section504Coordinator
              as_user_id: "${co_b_id}"
              captures: { plan_b_v: $.data.version }
            - call: "POST /plans/${plan_b_id}/submit-for-consent"
              payload: { expected_plan_version: "${plan_b_v}" }
              as: Section504Coordinator
              as_user_id: "${co_b_id}"
            - call: "POST /plans/${plan_b_id}/record-parent-consent"
              payload: { granted: true, responded_by_parent_ref: "parent-B" }
              as: Section504Coordinator
              as_user_id: "${co_b_id}"
            - call: "GET /teacher-acks?plan_id=${plan_b_id}&ack_status=PENDING"
              payload: {}
              as: Section504Coordinator
              as_user_id: "${co_b_id}"
              captures: { ack_b_id: '$.data[0].id' }
            - call: "POST /teacher-acks/${ack_b_id}/acknowledge"
              payload: {}
              as: Teacher
              as_user_id: "${t_b_id}"
            # plan_b ACTIVE; plan_effective_date = 2025-08-01 (clock unchanged since plan_a activation)
            # --- Schedule reviews; both scheduled_for 2026-08-01 ---
            - call: "POST /reviews"
              payload: { plan_id: "${plan_a_id}", review_type: "ANNUAL", scheduled_for: "2026-08-01T00:00:00Z" }
              as: Section504Coordinator
              as_user_id: "${co_a_id}"
              captures: { rev_a_id: $.data.id }
            - call: "POST /reviews"
              payload: { plan_id: "${plan_b_id}", review_type: "RE_EVALUATION", scheduled_for: "2026-08-01T00:00:00Z" }
              as: Section504Coordinator
              as_user_id: "${co_b_id}"
              captures: { rev_b_id: $.data.id }
            # Advance clock to 2026-08-10: 374 days after anchor. ANNUAL review is still within grace (boundary 379); RE_EVALUATION is past its date.
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: District504Director
              as_user_id: "bootstrap-director"
          trigger:
            - call: "POST /reviews/${rev_a_id}/start"
              payload: {}
              as: Section504Coordinator
              as_user_id: "${co_a_id}"
            - call: "POST /reviews/${rev_a_id}/complete"
              payload: { outcome: "CONTINUE_PLAN" }
              as: Section504Coordinator
              as_user_id: "${co_a_id}"
              captures: { rev_a_late: $.data.was_late }
            - call: "POST /reviews/${rev_b_id}/start"
              payload: {}
              as: Section504Coordinator
              as_user_id: "${co_b_id}"
            - call: "POST /reviews/${rev_b_id}/complete"
              payload: { outcome: "CONTINUE_PLAN" }
              as: Section504Coordinator
              as_user_id: "${co_b_id}"
              captures: { rev_b_late: $.data.was_late }
          assert:
            - "ReviewEvent.${rev_a_id}.was_late == false (ANNUAL at day 374 <= 379 grace boundary)"
            - "ReviewEvent.${rev_b_id}.was_late == true (RE_EVALUATION has no grace; completed 9 days past scheduled_for)"
            - "Same scheduled_for and same completion instant produce different was_late outcomes purely from variant selection"

  # ===========================================================================
  # Rule 2 — combinatorial_formula (two different modes: (a) and (b))
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: school_posture_composite_weighted_scoring_mode_a
        grounds:
          - calculations.school_posture_derivation
          - entities.School.fields.school_posture
        distinguishing_aspect: |
          Mode (a) — a formula with 4 inputs and non-linear interaction:
          nested min(count*15, 30) on overdue reviews, conditional branch on
          ocr_escalation_flag bypassing composite threshold, additive cap at 100.
          Distinct from mode (b) instance below.
        test_recipe:
          setup:
            - "School S1 with 1 open grievance (FILED) and 1 overdue review (OVERDUE), all 5 active staff trained (no training gap)"
            - "Expected: open_grievance_weight=20, ocr_flag=0, overdue_weight=min(1*15,30)=15, training_gap_weight=0"
            - "Composite = min(20+0+15+0, 100) = 35 → posture = PROBATION (30 <= 35 < 60)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2025-07-15T00:00:00Z" }
              as: District504Director
              as_user_id: "bootstrap-director"
            - call: "POST /schools"
              payload: { school_name: "Posture School", district_code: "D02", current_academic_year: "2025-2026" }
              as: District504Director
              as_user_id: "bootstrap-director"
              captures: { school_id: $.data.id }
            - call: "POST /staff-members"
              payload: { school_id: "${school_id}", staff_external_ref: "CO-P", full_name: "Coord P", staff_role: "COORDINATOR" }
              as: District504Director
              as_user_id: "bootstrap-director"
              captures: { co_id: $.data.id }
            - call: "POST /staff-members"
              payload: { school_id: "${school_id}", staff_external_ref: "T-P", full_name: "Teacher P", staff_role: "TEACHER" }
              as: District504Director
              as_user_id: "bootstrap-director"
              captures: { t1_id: $.data.id }
            - call: "POST /training-records"
              payload: { staff_id: "${t1_id}", training_topic: "SECTION_504_BASICS", trained_at: "2025-07-16T00:00:00Z" }
              as: District504Director
              as_user_id: "bootstrap-director"
            - call: "POST /training-records"
              payload: { staff_id: "${co_id}", training_topic: "SECTION_504_BASICS", trained_at: "2025-07-16T00:00:00Z" }
              as: District504Director
              as_user_id: "bootstrap-director"
            - call: "POST /students"
              payload: { school_id: "${school_id}", student_external_ref: "STU-P", full_name: "Student P", date_of_birth: "2012-01-01T00:00:00Z", grade_level: 8 }
              as: Section504Coordinator
              as_user_id: "${co_id}"
              captures: { stu_id: $.data.id }
            - call: "POST /grievances"
              payload: { student_id: "${stu_id}", grievance_category: "NON_IMPLEMENTATION", description: "Accommodation not delivered", filed_by_parent_ref: "parent-P" }
              as: Parent
