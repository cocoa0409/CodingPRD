# =============================================================================
# Task 1553: University Technology Transfer & Licensing — seed tables
# =============================================================================

scenario: |
  University Technology Transfer & Licensing (university tech transfer office): invention disclosure intake & inventorship determination, patentability & market assessment gating, patent prosecution docket & cost tracking, licensing negotiation (exclusive/non-exclusive) & milestone terms, royalty receipt, distribution to inventors/departments, startup formation & equity/conflict management, compliance reporting for federally funded inventions, license default & termination

domain_name: university-tech-transfer
api_prefix: /tlo

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: multi_party_negotiation
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - rate_threshold_triggers
    - optimistic_concurrency
  entity_topology: hybrid
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - many_to_many
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Department
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Department name" }
      - { name: college_name, type: string, source: input, description: "College the department belongs to" }
      - { name: distribution_pool_cents, type: integer, source: computed, default: 0, description: "Cumulative department-pool cents credited by PAID distributions; ledger-synced at distribution pay" }

  - name: Inventor
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Inventor full name" }
      - { name: email, type: string, source: input, description: "Inventor email" }
      - { name: department_id, type: string, source: input, description: "FK -> Department.id; home department used for department-pool splits" }
      - { name: appointment_type, type: enum, source: input, description: "FACULTY | STAFF | STUDENT" }

  - name: InventionDisclosure
    parent: null
    common_fields: true
    fields:
      - { name: title, type: string, source: input, description: "Invention title" }
      - { name: description, type: string, source: input, description: "Technical description" }
      - { name: funding_source, type: enum, source: input, description: "FEDERAL | NON_FEDERAL | MIXED" }
      - { name: federal_agency, type: string, source: input, description: "Funding agency name; required iff funding_source in {FEDERAL, MIXED}", default: null }
      - { name: grant_number, type: string, source: input, description: "Federal grant number; required iff funding_source in {FEDERAL, MIXED}", default: null }
      - { name: public_disclosure_date, type: datetime, source: input, description: "First public disclosure date if any; drives patent bar date for ELECTION_OF_TITLE due dates", default: null }
      - { name: submitter_inventor_id, type: string, source: system, description: "FK -> Inventor.id; set from X-User-ID of the creating Inventor" }
      - { name: status, type: enum, source: system, description: "INVENTORSHIP_REVIEW | INVENTORSHIP_DISPUTED | INVENTORSHIP_CONFIRMED | UNDER_ASSESSMENT | PATENT_PURSUED | WAIVED_TO_INVENTORS | SHELVED" }
      - { name: patentability_rating, type: enum, source: system, description: "HIGH | MEDIUM | LOW; set by assessment endpoint", default: null }
      - { name: market_rating, type: enum, source: system, description: "HIGH | MEDIUM | LOW; set by assessment endpoint", default: null }
      - { name: unreimbursed_cost_cents, type: integer, source: computed, default: 0, description: "Sum of (amount_cents - reimbursed_amount_cents) over PatentCost rows with reimbursement_status = UNREIMBURSED across this disclosure's patent applications" }
      - { name: written_off_cost_cents, type: integer, source: computed, default: 0, description: "Sum of amount_cents over PatentCost rows with reimbursement_status = WRITTEN_OFF across this disclosure's patent applications" }
      - { name: cost_writeoff_review_required, type: boolean, source: computed, default: false, description: "true once written_off_cost_cents >= WRITE_OFF_REVIEW_THRESHOLD_CENTS; blocks new patent applications until cleared" }

  - name: DisclosureInventor
    parent: InventionDisclosure
    common_fields: true
    fields:
      - { name: disclosure_id, type: string, source: system, description: "FK -> InventionDisclosure.id; from path" }
      - { name: inventor_id, type: string, source: input, description: "FK -> Inventor.id" }
      - { name: share_bp, type: integer, source: input, description: "Inventorship share in basis points (1..10000); all CONFIRMED entries must sum to 10000 at finalize" }
      - { name: confirmation_status, type: enum, source: system, description: "PENDING | CONFIRMED | DISPUTED" }
      - { name: confirmed_at, type: datetime, source: system, description: "Clock timestamp of confirmation", default: null }

  - name: InventorshipDispute
    parent: null
    common_fields: true
    fields:
      - { name: disclosure_id, type: string, source: system, description: "FK -> InventionDisclosure.id" }
      - { name: entry_id, type: string, source: system, description: "FK -> DisclosureInventor.id; the roster entry being disputed" }
      - { name: raised_by_inventor_id, type: string, source: system, description: "FK -> Inventor.id; set from X-User-ID of the disputing Inventor" }
      - { name: reason, type: string, source: input, description: "Dispute rationale" }
      - { name: status, type: enum, source: system, description: "OPEN | RESOLVED" }
      - { name: resolution_notes, type: string, source: system, description: "Set at resolve", default: null }

  - name: PatentApplication
    parent: InventionDisclosure
    common_fields: true
    fields:
      - { name: disclosure_id, type: string, source: system, description: "FK -> InventionDisclosure.id; from path" }
      - { name: docket_number, type: string, source: input, description: "Attorney docket number" }
      - { name: application_type, type: enum, source: input, description: "PROVISIONAL | NON_PROVISIONAL | PCT" }
      - { name: filed_date, type: datetime, source: input, description: "Filing date" }
      - { name: status, type: enum, source: system, description: "FILED | OFFICE_ACTION_RECEIVED | RESPONSE_FILED | GRANTED | ABANDONED" }
      - { name: total_cost_cents, type: integer, source: computed, default: 0, description: "Sum of amount_cents over all PatentCost rows for this application regardless of reimbursement status" }
      - { name: unreimbursed_cost_cents, type: integer, source: computed, default: 0, description: "Sum of (amount_cents - reimbursed_amount_cents) over this application's PatentCost rows with reimbursement_status = UNREIMBURSED" }

  - name: PatentCost
    parent: PatentApplication
    common_fields: true
    fields:
      - { name: patent_application_id, type: string, source: system, description: "FK -> PatentApplication.id; from path" }
      - { name: cost_type, type: enum, source: input, description: "FILING_FEE | ATTORNEY_FEE | MAINTENANCE_FEE | TRANSLATION_FEE" }
      - { name: amount_cents, type: integer, source: input, description: "Cost amount in cents; must be > 0" }
      - { name: incurred_date, type: datetime, source: input, description: "Date the cost was incurred" }
      - { name: reimbursed_amount_cents, type: integer, source: system, default: 0, description: "Portion of this cost offset by APPROVED distributions; 0..amount_cents" }
      - { name: reimbursement_status, type: enum, source: system, description: "UNREIMBURSED | REIMBURSED | WRITTEN_OFF; REIMBURSED iff reimbursed_amount_cents == amount_cents" }

  - name: Startup
    parent: InventionDisclosure
    common_fields: true
    fields:
      - { name: disclosure_id, type: string, source: system, description: "FK -> InventionDisclosure.id; from path" }
      - { name: name, type: string, source: input, description: "Startup company name" }
      - { name: founded_date, type: datetime, source: input, description: "Incorporation date" }
      - { name: equity_model, type: enum, source: input, description: "FIXED | ANTI_DILUTION; selects the university_equity_bp calculation variant at issue-equity" }
      - { name: university_equity_bp, type: integer, source: computed, description: "University equity stake in basis points; null until issue-equity", default: null }
      - { name: equity_issued, type: boolean, source: system, default: false, description: "true once issue-equity succeeds" }
      - { name: status, type: enum, source: system, description: "INCORPORATION | EQUITY_ISSUED | DISSOLVED" }

  - name: ConflictOfInterestPlan
    parent: Startup
    common_fields: true
    fields:
      - { name: startup_id, type: string, source: system, description: "FK -> Startup.id; from path" }
      - { name: inventor_id, type: string, source: input, description: "FK -> Inventor.id; must be on the roster of the startup's disclosure" }
      - { name: coverage_start, type: datetime, source: input, description: "Coverage window start (inclusive)" }
      - { name: coverage_end, type: datetime, source: input, description: "Coverage window end (exclusive); must be > coverage_start" }
      - { name: management_plan_text, type: string, source: input, description: "Conflict management plan text" }
      - { name: rejection_reason, type: string, source: system, description: "Set at reject", default: null }
      - { name: status, type: enum, source: system, description: "SUBMITTED | APPROVED | REJECTED | TERMINATED" }

  - name: LicenseAgreement
    parent: InventionDisclosure
    common_fields: true
    fields:
      - { name: disclosure_id, type: string, source: system, description: "FK -> InventionDisclosure.id; from path" }
      - { name: startup_id, type: string, source: input, description: "FK -> Startup.id; optional; links license to a startup (triggers COI coverage gate at execute and the startup-linked inventor-share reduction)", default: null }
      - { name: licensee_name, type: string, source: input, description: "Licensee legal name" }
      - { name: exclusivity, type: enum, source: input, description: "EXCLUSIVE | NON_EXCLUSIVE" }
      - { name: effective_date, type: datetime, source: input, description: "License effective date (closed interval start for exclusivity overlap)" }
      - { name: expiration_date, type: datetime, source: input, description: "License expiration date (closed interval end; must be > effective_date)" }
      - { name: royalty_rate_bp, type: integer, source: input, description: "Running royalty rate in basis points (100..2000)" }
      - { name: minimum_annual_royalty_cents, type: integer, source: input, description: "Minimum annual royalty in cents; >= 0" }
      - { name: upfront_fee_cents, type: integer, source: input, description: "Upfront fee in cents; >= 0; EXCLUSIVE licenses require >= EXCLUSIVE_MIN_UPFRONT_CENTS at execute" }
      - { name: status, type: enum, source: system, description: "IN_NEGOTIATION | COUNTERED | EXECUTED | ACTIVE | DEFAULT_NOTICE | TERMINATED | EXPIRED" }
      - { name: default_notice_date, type: datetime, source: system, description: "Clock timestamp when DEFAULT_NOTICE entered", default: null }
      - { name: cure_deadline, type: datetime, source: system, description: "default_notice_date + CURE_PERIOD_DAYS", default: null }
      - { name: cumulative_sales_cents, type: integer, source: computed, default: 0, description: "Sum of reported_sales_cents over this license's RoyaltyReport rows with status in {ACCEPTED, PAID}" }
      - { name: cumulative_royalty_cents, type: integer, source: computed, default: 0, description: "Sum of accepted_royalty_cents over this license's RoyaltyReport rows with status in {ACCEPTED, PAID}" }

  - name: LicenseMilestone
    parent: LicenseAgreement
    common_fields: true
    fields:
      - { name: license_id, type: string, source: system, description: "FK -> LicenseAgreement.id; from path" }
      - { name: description, type: string, source: input, description: "Milestone description" }
      - { name: due_date, type: datetime, source: input, description: "Milestone due date; a PENDING milestone with due_date < current clock is overdue" }
      - { name: amount_cents, type: integer, source: input, description: "Milestone payment in cents; >= 0" }
      - { name: waiver_reason, type: string, source: system, description: "Set at waive", default: null }
      - { name: status, type: enum, source: system, description: "PENDING | ACHIEVED | WAIVED | CANCELLED" }

  - name: RoyaltyReport
    parent: LicenseAgreement
    common_fields: true
    fields:
      - { name: license_id, type: string, source: system, description: "FK -> LicenseAgreement.id; from path" }
      - { name: period_start, type: datetime, source: input, description: "Report period start (inclusive)" }
      - { name: period_end, type: datetime, source: input, description: "Report period end (exclusive); must be > period_start; must not overlap any non-VOIDED report period on this license" }
      - { name: reported_sales_cents, type: integer, source: input, description: "Net sales reported for the period in cents; >= 0" }
      - { name: earned_royalty_cents, type: integer, source: computed, description: "Tiered earned royalty; computed at accept; null before", default: null }
      - { name: true_up_cents, type: integer, source: computed, description: "Annual minimum true-up; computed at accept; null before", default: null }
      - { name: accepted_royalty_cents, type: integer, source: computed, description: "earned_royalty_cents + true_up_cents; null before accept", default: null }
      - { name: status, type: enum, source: system, description: "SUBMITTED | ACCEPTED | PAID | VOIDED" }

  - name: RoyaltyDistribution
    parent: RoyaltyReport
    common_fields: true
    fields:
      - { name: royalty_report_id, type: string, source: system, description: "FK -> RoyaltyReport.id; from path; unique — at most one distribution per report" }
      - { name: gross_cents, type: integer, source: computed, description: "Snapshot of report.accepted_royalty_cents at calculation" }
      - { name: cost_offset_cents, type: integer, source: computed, description: "min(gross_cents, disclosure.unreimbursed_cost_cents at calculation time)" }
      - { name: net_cents, type: integer, source: computed, description: "gross_cents - cost_offset_cents" }
      - { name: admin_fee_cents, type: integer, source: computed, description: "round_half_up(net_cents * ADMIN_FEE_PCT)" }
      - { name: inventor_pool_cents, type: integer, source: computed, description: "round_half_up(net_cents * inventor_pct) where inventor_pct depends on funding_source and startup linkage" }
      - { name: department_pool_cents, type: integer, source: computed, description: "net_cents - admin_fee_cents - inventor_pool_cents (remainder absorbs rounding)" }
      - { name: university_pool_cents, type: integer, source: computed, description: "cost_offset_cents + admin_fee_cents" }
      - { name: inventor_shares, type: array, source: computed, description: "[{inventor_id, amount_cents}] per CONFIRMED DisclosureInventor; split per inventor_share_split" }
      - { name: department_shares, type: array, source: computed, description: "[{department_id, amount_cents}] per distinct department of CONFIRMED inventors; split per department_share_split" }
      - { name: cost_applications, type: array, source: computed, description: "[{cost_id, applied_cents}] recording exactly which PatentCost rows were offset at approve; used for exact reversal at cancel", default: [] }
      - { name: prepared_by_user_id, type: string, source: system, description: "X-User-ID of the FinanceOfficer who created the distribution; segregation-of-duties anchor" }
      - { name: status, type: enum, source: system, description: "CALCULATED | APPROVED | PAID | CANCELLED" }

  - name: FederalComplianceReport
    parent: InventionDisclosure
    common_fields: true
    fields:
      - { name: disclosure_id, type: string, source: system, description: "FK -> InventionDisclosure.id; from path" }
      - { name: report_type, type: enum, source: input, description: "INITIAL_DISCLOSURE | ELECTION_OF_TITLE | UTILIZATION_REPORT | EXTENSION_REQUEST" }
      - { name: due_date, type: datetime, source: computed, description: "Computed by compliance_due_date for INITIAL_DISCLOSURE and ELECTION_OF_TITLE; client-provided for UTILIZATION_REPORT and EXTENSION_REQUEST" }
      - { name: prepared_by_user_id, type: string, source: system, description: "X-User-ID of the creating ComplianceOfficer; segregation-of-duties anchor" }
      - { name: certified_by_user_id, type: string, source: system, description: "X-User-ID of the certifying ComplianceDirector", default: null }
      - { name: submitted_at, type: datetime, source: system, description: "Clock timestamp of certification", default: null }
      - { name: late_flag, type: boolean, source: computed, description: "submitted_at > due_date; computed at certify", default: null }
      - { name: rejection_reason, type: string, source: system, description: "Set at certification reject or agency rejection", default: null }
      - { name: status, type: enum, source: system, description: "DRAFT | PENDING_CERTIFICATION | SUBMITTED | AGENCY_ACCEPTED" }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: InventionDisclosure
    initial_state: INVENTORSHIP_REVIEW
    terminal_states: [WAIVED_TO_INVENTORS, SHELVED]
    transitions:
      - from: INVENTORSHIP_REVIEW
        to: INVENTORSHIP_DISPUTED
        trigger: POST /tlo/disclosure-entries/{entryId}/dispute
        actor: Inventor
        preconditions:
          - "Entry confirmation_status in {PENDING, CONFIRMED} (ERR_ENTRY_NOT_DISPUTABLE)"
          - "Actor X-User-ID is an Inventor listed on the entry's disclosure roster (ERR_FORBIDDEN)"
        side_effects:
          - "Entry confirmation_status -> DISPUTED"
          - "Create InventorshipDispute (status OPEN) with disclosure_id, entry_id, raised_by_inventor_id = X-User-ID"
          - "Increments InventionDisclosure.version by 1"
      - from: INVENTORSHIP_DISPUTED
        to: INVENTORSHIP_REVIEW
        trigger: POST /tlo/inventorship-disputes/{disputeId}/resolve
        actor: TechTransferOfficer
        preconditions:
          - "Dispute status == OPEN (ERR_DISPUTE_NOT_OPEN)"
          - "Sum of adjusted_shares.share_bp == SHARE_TOTAL_BP exactly and every roster entry appears exactly once (ERR_SHARE_SUM_INVALID)"
        side_effects:
          - "Dispute status -> RESOLVED; resolution_notes stored"
          - "Each roster entry share_bp overwritten by adjusted_shares and confirmation_status reset to PENDING, confirmed_at cleared"
          - "InventionDisclosure.version incremented by 1"
      - from: INVENTORSHIP_REVIEW
        to: INVENTORSHIP_CONFIRMED
        trigger: POST /tlo/disclosures/{disclosureId}/inventorship/finalize
        actor: TechTransferOfficer
        preconditions:
          - "Disclosure status == INVENTORSHIP_REVIEW (ERR_INVENTORSHIP_NOT_FINALIZABLE)"
          - "At least one DisclosureInventor entry exists and every entry confirmation_status == CONFIRMED (ERR_INVENTORSHIP_NOT_FINALIZABLE)"
          - "Sum of share_bp over all entries == SHARE_TOTAL_BP (10000) exactly (ERR_SHARE_SUM_INVALID)"
          - "OCC: expected_disclosure_version matches current version (ERR_STALE_VERSION)"
        side_effects:
          - "Increments InventionDisclosure.version by 1"
      - from: INVENTORSHIP_CONFIRMED
        to: UNDER_ASSESSMENT
        trigger: POST /tlo/disclosures/{disclosureId}/assessment
        actor: TechTransferOfficer
        preconditions:
          - "Disclosure status == INVENTORSHIP_CONFIRMED (ERR_DISCLOSURE_INVALID_STATE)"
        side_effects:
          - "patentability_rating and market_rating stored"
      - from: UNDER_ASSESSMENT
        to: PATENT_PURSUED
        trigger: POST /tlo/disclosures/{disclosureId}/decision (decision=PURSUE_PATENT)
        actor: TechTransferOfficer
        preconditions:
          - "Disclosure status == UNDER_ASSESSMENT (ERR_DISCLOSURE_INVALID_STATE)"
          - "patentability_rating in {HIGH, MEDIUM} AND market_rating in {HIGH, MEDIUM} (ERR_ASSESSMENT_GATE_FAILED)"
        side_effects: []
      - from: UNDER_ASSESSMENT
        to: WAIVED_TO_INVENTORS
        trigger: POST /tlo/disclosures/{disclosureId}/decision (decision=WAIVE_TO_INVENTORS)
        actor: TechTransferOfficer
        preconditions:
          - "Disclosure status == UNDER_ASSESSMENT (ERR_DISCLOSURE_INVALID_STATE)"
        side_effects: []
      - from: UNDER_ASSESSMENT
        to: SHELVED
        trigger: POST /tlo/disclosures/{disclosureId}/decision (decision=SHELF)
        actor: TechTransferOfficer
        preconditions:
          - "Disclosure status == UNDER_ASSESSMENT (ERR_DISCLOSURE_INVALID_STATE)"
        side_effects: []

  - entity: DisclosureInventor
    initial_state: PENDING
    terminal_states: []
    transitions:
      - from: PENDING
        to: CONFIRMED
        trigger: POST /tlo/disclosure-entries/{entryId}/confirm
        actor: Inventor
        preconditions:
          - "Entry confirmation_status == PENDING (ERR_ENTRY_NOT_CONFIRMABLE)"
          - "Disclosure status == INVENTORSHIP_REVIEW (ERR_DISCLOSURE_INVALID_STATE)"
          - "X-User-ID == entry.inventor_id (ERR_FORBIDDEN)"
        side_effects:
          - "confirmed_at = current clock"
      - from: PENDING
        to: DISPUTED
        trigger: POST /tlo/disclosure-entries/{entryId}/dispute
        actor: Inventor
        preconditions: ["see InventionDisclosure INVENTORSHIP_REVIEW -> INVENTORSHIP_DISPUTED"]
        side_effects: ["see disclosure transition"]
      - from: CONFIRMED
        to: DISPUTED
        trigger: POST /tlo/disclosure-entries/{entryId}/dispute
        actor: Inventor
        preconditions: ["see InventionDisclosure INVENTORSHIP_REVIEW -> INVENTORSHIP_DISPUTED"]
        side_effects: ["confirmed_at cleared"]
      - from: CONFIRMED
        to: PENDING
        trigger: POST /tlo/inventorship-disputes/{disputeId}/resolve
        actor: TechTransferOfficer
        preconditions: []
        side_effects: ["share_bp overwritten; confirmed_at cleared"]
      - from: DISPUTED
        to: PENDING
        trigger: POST /tlo/inventorship-disputes/{disputeId}/resolve
        actor: TechTransferOfficer
        preconditions: []
        side_effects: ["share_bp overwritten; confirmed_at cleared"]

  - entity: InventorshipDispute
    initial_state: OPEN
    terminal_states: [RESOLVED]
    transitions:
      - from: OPEN
        to: RESOLVED
        trigger: POST /tlo/inventorship-disputes/{disputeId}/resolve
        actor: TechTransferOfficer
        preconditions: ["Dispute status == OPEN (ERR_DISPUTE_NOT_OPEN)"]
        side_effects: ["See disclosure/entry transitions"]

  - entity: PatentApplication
    initial_state: FILED
    terminal_states: [GRANTED, ABANDONED]
    transitions:
      - from: FILED
        to: OFFICE_ACTION_RECEIVED
        trigger: POST /tlo/patent-applications/{applicationId}/office-action
        actor: TechTransferOfficer
        preconditions: ["Status == FILED (ERR_PATENT_INVALID_STATE)"]
        side_effects: []
      - from: OFFICE_ACTION_RECEIVED
        to: RESPONSE_FILED
        trigger: POST /tlo/patent-applications/{applicationId}/file-response
        actor: TechTransferOfficer
        preconditions: ["Status == OFFICE_ACTION_RECEIVED (ERR_PATENT_INVALID_STATE)"]
        side_effects: []
      - from: RESPONSE_FILED
        to: OFFICE_ACTION_RECEIVED
        trigger: POST /tlo/patent-applications/{applicationId}/office-action
        actor: TechTransferOfficer
        preconditions: ["Status in {FILED, RESPONSE_FILED} (ERR_PATENT_INVALID_STATE)"]
        side_effects: []
        note: "Prosecution cycle: office actions may recur"
      - from: FILED
        to: GRANTED
        trigger: POST /tlo/patent-applications/{applicationId}/grant
        actor: TechTransferOfficer
        preconditions: ["Status in {FILED, RESPONSE_FILED} (ERR_PATENT_INVALID_STATE)"]
        side_effects: []
      - from: RESPONSE_FILED
        to: GRANTED
        trigger: POST /tlo/patent-applications/{applicationId}/grant
        actor: TechTransferOfficer
        preconditions: ["Status in {FILED, RESPONSE_FILED} (ERR_PATENT_INVALID_STATE)"]
        side_effects: []
      - from: FILED
        to: ABANDONED
        trigger: POST /tlo/patent-applications/{applicationId}/abandon
        actor: TechTransferOfficer
        preconditions: ["Status in {FILED, OFFICE_ACTION_RECEIVED, RESPONSE_FILED} (ERR_PATENT_INVALID_STATE)"]
        side_effects:
          - "CASCADE hop 1: every PatentCost of this application with reimbursement_status == UNREIMBURSED and reimbursed_amount_cents == 0 -> WRITTEN_OFF (partially reimbursed rows are NOT written off)"
          - "CASCADE hop 2: each write-off recomputes disclosure.unreimbursed_cost_cents (drops) and disclosure.written_off_cost_cents (rises by amount_cents)"
          - "CASCADE hop 3: when the hop-2 recompute leaves written_off_cost_cents >= WRITE_OFF_REVIEW_THRESHOLD_CENTS (5000000), disclosure.cost_writeoff_review_required flips to true, blocking POST /tlo/disclosures/{id}/patent-applications with ERR_COST_REVIEW_REQUIRED until cleared"
      - from: OFFICE_ACTION_RECEIVED
        to: ABANDONED
        trigger: POST /tlo/patent-applications/{applicationId}/abandon
        actor: TechTransferOfficer
        preconditions: ["Status in {FILED, OFFICE_ACTION_RECEIVED, RESPONSE_FILED} (ERR_PATENT_INVALID_STATE)"]
        side_effects: ["Same cascade as FILED -> ABANDONED"]
      - from: RESPONSE_FILED
        to: ABANDONED
        trigger: POST /tlo/patent-applications/{applicationId}/abandon
        actor: TechTransferOfficer
        preconditions: ["Status in {FILED, OFFICE_ACTION_RECEIVED, RESPONSE_FILED} (ERR_PATENT_INVALID_STATE)"]
        side_effects: ["Same cascade as FILED -> ABANDONED"]

  - entity: Startup
    initial_state: INCORPORATION
    terminal_states: [DISSOLVED]
    transitions:
      - from: INCORPORATION
        to: EQUITY_ISSUED
        trigger: POST /tlo/startups/{startupId}/issue-equity
        actor: TechTransferOfficer
        preconditions:
          - "Status == INCORPORATION (ERR_STARTUP_INVALID_STATE)"
          - "At least one ConflictOfInterestPlan with startup_id == this startup, status == APPROVED, and coverage_start <= current clock < coverage_end (ERR_COI_COVERAGE_REQUIRED)"
        side_effects:
          - "university_equity_bp computed per startup_equity_bp calculation (variant selected by equity_model)"
          - "equity_issued = true"
      - from: INCORPORATION
        to: DISSOLVED
        trigger: POST /tlo/startups/{startupId}/dissolve
        actor: TechTransferOfficer
        preconditions: ["Status in {INCORPORATION, EQUITY_ISSUED} (ERR_STARTUP_INVALID_STATE)"]
        side_effects:
          - "All COI plans of this startup with status in {SUBMITTED, APPROVED} -> TERMINATED"
      - from: EQUITY_ISSUED
        to: DISSOLVED
        trigger: POST /tlo/startups/{startupId}/dissolve
        actor: TechTransferOfficer
        preconditions: ["Status in {INCORPORATION, EQUITY_ISSUED} (ERR_STARTUP_INVALID_STATE)"]
        side_effects:
          - "All COI plans of this startup with status in {SUBMITTED, APPROVED} -> TERMINATED"

  - entity: ConflictOfInterestPlan
    initial_state: SUBMITTED
    terminal_states: [TERMINATED]
    transitions:
      - from: SUBMITTED
        to: APPROVED
        trigger: POST /tlo/coi-plans/{planId}/approve
        actor: ComplianceDirector
        preconditions:
          - "Status == SUBMITTED (ERR_COI_NOT_REVIEWABLE)"
          - "Startup status != DISSOLVED (ERR_STARTUP_INVALID_STATE)"
          - "Half-open overlap re-check vs other APPROVED plans for the same (startup_id, inventor_id) (ERR_COI_WINDOW_OVERLAP)"
        side_effects: []
      - from: SUBMITTED
        to: REJECTED
        trigger: POST /tlo/coi-plans/{planId}/reject
        actor: ComplianceDirector
        preconditions: ["Status == SUBMITTED (ERR_COI_NOT_REVIEWABLE)"]
        side_effects: ["rejection_reason stored"]
      - from: REJECTED
        to: SUBMITTED
        trigger: PATCH /tlo/coi-plans/{planId}
        actor: ComplianceOfficer
        preconditions:
          - "Status == REJECTED (ERR_COI_NOT_REVISABLE)"
          - "Revised [coverage_start, coverage_end) must not half-open overlap any SUBMITTED or APPROVED plan for the same (startup_id, inventor_id) (ERR_COI_WINDOW_OVERLAP)"
        side_effects: ["rejection_reason cleared"]
      - from: SUBMITTED
        to: TERMINATED
        trigger: "system (startup dissolve cascade)"
        actor: system
        preconditions: []
        side_effects: []
      - from: APPROVED
        to: TERMINATED
        trigger: "system (startup dissolve cascade)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: LicenseAgreement
    initial_state: IN_NEGOTIATION
    terminal_states: [TERMINATED, EXPIRED]
    transitions:
      - from: IN_NEGOTIATION
        to: COUNTERED
        trigger: POST /tlo/licenses/{licenseId}/counter
        actor: LicensingManager
        preconditions: ["Status in {IN_NEGOTIATION, COUNTERED} (ERR_LICENSE_NOT_NEGOTIABLE)"]
        side_effects: ["Terms overwritten by payload fields present; increments LicenseAgreement.version by 1"]
      - from: COUNTERED
        to: IN_NEGOTIATION
        trigger: POST /tlo/licenses/{licenseId}/counter
        actor: LicensingManager
        preconditions: ["Status in {IN_NEGOTIATION, COUNTERED} (ERR_LICENSE_NOT_NEGOTIABLE)"]
        side_effects: ["Terms overwritten by payload fields present; increments LicenseAgreement.version by 1"]
      - from: IN_NEGOTIATION
        to: EXECUTED
        trigger: POST /tlo/licenses/{licenseId}/execute
        actor: LicensingManager
        preconditions:
          - "Status in {IN_NEGOTIATION, COUNTERED} (ERR_LICENSE_NOT_EXECUTABLE)"
          - "OCC: expected_license_version matches current version (ERR_STALE_VERSION)"
          - "If startup_id set: an APPROVED ConflictOfInterestPlan for this startup must cover the current clock (ERR_COI_COVERAGE_REQUIRED)"
          - "If exclusivity == EXCLUSIVE: closed interval [effective_date, expiration_date] must not intersect any other EXECUTED/ACTIVE/DEFAULT_NOTICE EXCLUSIVE license on the same disclosure (ERR_EXCLUSIVE_OVERLAP)"
          - "If exclusivity == EXCLUSIVE: upfront_fee_cents >= EXCLUSIVE_MIN_UPFRONT_CENTS (500000) (ERR_UPFRONT_BELOW_FLOOR)"
        side_effects: ["Increments LicenseAgreement.version by 1"]
      - from: COUNTERED
        to: EXECUTED
        trigger: POST /tlo/licenses/{licenseId}/execute
        actor: LicensingManager
        preconditions: ["Same as IN_NEGOTIATION -> EXECUTED"]
        side_effects: ["Increments LicenseAgreement.version by 1"]
      - from: EXECUTED
        to: ACTIVE
        trigger: "system (POST /tlo/_clock/set_current_utc sweep: clock >= effective_date)"
        actor: system
        preconditions: ["current clock >= effective_date"]
        side_effects: []
      - from: ACTIVE
        to: EXPIRED
        trigger: "system (POST /tlo/_clock/set_current_utc sweep: clock >= expiration_date)"
        actor: system
        preconditions: ["current clock >= expiration_date"]
        side_effects: []
      - from: EXECUTED
        to: EXPIRED
        trigger: "system (POST /tlo/_clock/set_current_utc sweep: clock >= expiration_date)"
        actor: system
        preconditions: ["current clock >= expiration_date"]
        side_effects: []
      - from: ACTIVE
        to: DEFAULT_NOTICE
        trigger: POST /tlo/licenses/{licenseId}/declare-default
        actor: LicensingManager
        preconditions:
          - "Status == ACTIVE (ERR_LICENSE_NOT_ACTIVE)"
          - "At least one LicenseMilestone with status == PENDING and due_date < current clock (ERR_NO_DEFAULT_GROUNDS)"
        side_effects:
          - "default_notice_date = current clock; cure_deadline = clock + CURE_PERIOD_DAYS (60 days)"
      - from: DEFAULT_NOTICE
        to: ACTIVE
        trigger: POST /tlo/licenses/{licenseId}/cure
        actor: LicensingManager
        preconditions:
          - "Status == DEFAULT_NOTICE (ERR_LICENSE_NOT_IN_DEFAULT)"
          - "current clock <= cure_deadline (ERR_CURE_PERIOD_EXPIRED)"
        side_effects: ["default_notice_date and cure_deadline cleared"]
      - from: DEFAULT_NOTICE
        to: TERMINATED
        trigger: POST /tlo/licenses/{licenseId}/terminate
        actor: LicensingManager
        preconditions:
          - "Status == DEFAULT_NOTICE (ERR_LICENSE_NOT_TERMINABLE)"
          - "current clock > cure_deadline (ERR_CURE_PERIOD_ACTIVE)"
        side_effects:
          - "CASCADE hop 1: every LicenseMilestone with status == PENDING -> CANCELLED"
          - "CASCADE hop 1: every RoyaltyReport with status in {SUBMITTED, ACCEPTED} -> VOIDED"
          - "CASCADE hop 2: each report voided in hop 1 that has a RoyaltyDistribution with status in {CALCULATED, APPROVED} -> distribution CANCELLED"
          - "CASCADE hop 3: each APPROVED distribution cancelled in hop 2 reverses its cost_applications (each PatentCost.reimbursed_amount_cents reduced by applied_cents; rows returning to 0 flip REIMBURSED -> UNREIMBURSED), then disclosure.unreimbursed_cost_cents and written_off_cost_cents are recomputed"

  - entity: LicenseMilestone
    initial_state: PENDING
    terminal_states: [ACHIEVED, WAIVED, CANCELLED]
    transitions:
      - from: PENDING
        to: ACHIEVED
        trigger: POST /tlo/licenses/{licenseId}/milestones/{milestoneId}/achieve
        actor: LicensingManager
        preconditions:
          - "Milestone status == PENDING (ERR_MILESTONE_NOT_PENDING)"
          - "License status in {EXECUTED, ACTIVE} (ERR_LICENSE_NOT_ACTIVE)"
          - "current clock <= due_date (ERR_MILESTONE_OVERDUE)"
        side_effects: []
      - from: PENDING
        to: WAIVED
        trigger: POST /tlo/licenses/{licenseId}/milestones/{milestoneId}/waive
        actor: LicensingManager
        preconditions:
          - "Milestone status == PENDING (ERR_MILESTONE_NOT_PENDING)"
          - "License status in {ACTIVE, DEFAULT_NOTICE} (ERR_LICENSE_NOT_ACTIVE)"
        side_effects: ["waiver_reason stored"]
      - from: PENDING
        to: CANCELLED
        trigger: "system (license termination cascade)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: RoyaltyReport
    initial_state: SUBMITTED
    terminal_states: [PAID, VOIDED]
    transitions:
      - from: SUBMITTED
        to: ACCEPTED
        trigger: POST /tlo/royalty-reports/{reportId}/accept
        actor: FinanceOfficer
        preconditions: ["Status == SUBMITTED (ERR_REPORT_NOT_ACCEPTABLE)"]
        side_effects:
          - "earned_royalty_cents computed per tiered_earned_royalty"
          - "true_up_cents computed per annual_minimum_true_up"
          - "accepted_royalty_cents = earned_royalty_cents + true_up_cents"
          - "license.cumulative_sales_cents and cumulative_royalty_cents recomputed"
      - from: ACCEPTED
        to: PAID
        trigger: "system (POST /tlo/distributions/{distributionId}/pay)"
        actor: system
        preconditions: []
        side_effects: []
      - from: SUBMITTED
        to: VOIDED
        trigger: "system (license termination cascade)"
        actor: system
        preconditions: []
        side_effects: ["If a RoyaltyDistribution exists with status in {CALCULATED, APPROVED} -> CANCELLED (with offset reversal when APPROVED)"]
      - from: ACCEPTED
        to: VOIDED
        trigger: "system (license termination cascade)"
        actor: system
        preconditions: []
        side_effects: ["license.cumulative_sales_cents and cumulative_royalty_cents recomputed after void; distribution cancellation cascade as above"]

  - entity: RoyaltyDistribution
    initial_state: CALCULATED
    terminal_states: [PAID, CANCELLED]
    transitions:
      - from: CALCULATED
        to: APPROVED
        trigger: POST /tlo/distributions/{distributionId}/approve
        actor: FinanceDirector
        preconditions:
          - "Status == CALCULATED (ERR_DISTRIBUTION_NOT_APPROVABLE)"
          - "X-User-ID != prepared_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
          - "OCC: expected_distribution_version matches current version (ERR_STALE_VERSION)"
        side_effects:
          - "Apply cost_offset_cents to the disclosure's UNREIMBURSED PatentCost rows in order (incurred_date ASC, created_at ASC tie-break): each row absorbs min(remaining_offset, amount_cents - reimbursed_amount_cents); a row reaching full amount flips to REIMBURSED"
          - "cost_applications recorded exactly as applied"
          - "disclosure.unreimbursed_cost_cents recomputed"
          - "Increments RoyaltyDistribution.version by 1"
      - from: APPROVED
        to: PAID
        trigger: POST /tlo/distributions/{distributionId}/pay
        actor: FinanceDirector
        preconditions: ["Status == APPROVED (ERR_DISTRIBUTION_NOT_PAYABLE)"]
        side_effects:
          - "CASCADE hop 1: RoyaltyReport ACCEPTED -> PAID"
          - "CASCADE hop 2: the hop-1 report transition recomputes license.cumulative_sales_cents and cumulative_royalty_cents (report stays in {ACCEPTED, PAID} set — amounts unchanged but updated_at refreshed)"
          - "CASCADE hop 1 (ledger sync): each Department in department_shares: distribution_pool_cents += amount_cents"
      - from: CALCULATED
        to: CANCELLED
        trigger: POST /tlo/distributions/{distributionId}/cancel
        actor: FinanceDirector
        preconditions: ["Status in {CALCULATED, APPROVED} (ERR_DISTRIBUTION_NOT_CANCELLABLE)"]
        side_effects: ["No cost reversal needed from CALCULATED (offsets only apply at approve)"]
      - from: APPROVED
        to: CANCELLED
        trigger: POST /tlo/distributions/{distributionId}/cancel
        actor: FinanceDirector
        preconditions: ["Status in {CALCULATED, APPROVED} (ERR_DISTRIBUTION_NOT_CANCELLABLE)"]
        side_effects:
          - "Reverse cost_applications exactly: each PatentCost.reimbursed_amount_cents -= applied_cents; rows returning to 0 flip REIMBURSED -> UNREIMBURSED"
          - "disclosure.unreimbursed_cost_cents recomputed (invariant: equals its pre-approve value)"
      - from: CALCULATED
        to: CANCELLED
        trigger: "system (license termination cascade via report voiding)"
        actor: system
        preconditions: []
        side_effects: []
      - from: APPROVED
        to: CANCELLED
        trigger: "system (license termination cascade via report voiding)"
        actor: system
        preconditions: []
        side_effects: ["Offset reversal identical to manual cancel"]

  - entity: FederalComplianceReport
    initial_state: DRAFT
    terminal_states: [AGENCY_ACCEPTED]
    transitions:
      - from: DRAFT
        to: PENDING_CERTIFICATION
        trigger: POST /tlo/compliance-reports/{reportId}/submit
        actor: ComplianceOfficer
        preconditions: ["Status == DRAFT (ERR_COMPLIANCE_REPORT_INVALID_STATE)"]
        side_effects: []
      - from: PENDING_CERTIFICATION
        to: SUBMITTED
        trigger: POST /tlo/compliance-reports/{reportId}/certify
        actor: ComplianceDirector
        preconditions:
          - "Status == PENDING_CERTIFICATION (ERR_COMPLIANCE_REPORT_INVALID_STATE)"
          - "X-User-ID != prepared_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "certified_by_user_id = X-User-ID; submitted_at = current clock"
          - "late_flag = (submitted_at > due_date)"
      - from: PENDING_CERTIFICATION
        to: DRAFT
        trigger: POST /tlo/compliance-reports/{reportId}/reject
        actor: ComplianceDirector
        preconditions: ["Status == PENDING_CERTIFICATION (ERR_COMPLIANCE_REPORT_INVALID_STATE)"]
        side_effects: ["rejection_reason stored"]
      - from: SUBMITTED
        to: AGENCY_ACCEPTED
        trigger: POST /tlo/compliance-reports/{reportId}/agency-response (outcome=ACCEPTED)
        actor: ComplianceDirector
        preconditions: ["Status == SUBMITTED (ERR_COMPLIANCE_REPORT_INVALID_STATE)"]
        side_effects: []
      - from: SUBMITTED
        to: DRAFT
        trigger: POST /tlo/compliance-reports/{reportId}/agency-response (outcome=REJECTED)
        actor: ComplianceDirector
        preconditions: ["Status == SUBMITTED (ERR_COMPLIANCE_REPORT_INVALID_STATE)"]
        side_effects: ["rejection_reason stored from agency_notes; submitted_at/certified_by/late_flag cleared for the revision cycle"]

# =============================================================================
# 1.2.1 Concurrency Rules (OCC — true create-with-supersede races only)
# =============================================================================
concurrency_rules:
  - rule_id: inventorship-finalize-stale-disclosure
    parent_entity: InventionDisclosure
    write_endpoint: "POST /tlo/disclosures/{disclosureId}/inventorship/finalize"
    occ_field: "expected_disclosure_version"
    description: |
      Finalizing inventorship against a disclosure whose version has advanced
      since the officer last observed it (e.g., a dispute was raised or resolved,
      mutating the roster and bumping the version) is rejected as stale. The
      officer must re-read the disclosure and re-issue with the fresh version.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: license-execute-stale-license
    parent_entity: LicenseAgreement
    write_endpoint: "POST /tlo/licenses/{licenseId}/execute"
    occ_field: "expected_license_version"
    description: |
      Executing a license whose version has advanced since the client last
      observed it (e.g., a counter round legitimately superseded the negotiated
      terms and bumped the version) is rejected as stale; the client executes
      against terms it has not seen.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: distribution-approve-stale-distribution
    parent_entity: RoyaltyDistribution
    write_endpoint: "POST /tlo/distributions/{distributionId}/approve"
    occ_field: "expected_distribution_version"
    description: |
      Approving a distribution whose version has advanced since the director
      last observed it (e.g., a FinanceOfficer recalculated the pools from
      updated cost data, legitimately superseding the prior figures and bumping
      the version) is rejected as stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: tiered_earned_royalty
    trigger: "POST /tlo/royalty-reports/{reportId}/accept"
    algorithm: tiered_pricing
    formula: |
      cumulative_before = sum of reported_sales_cents over this license's
        RoyaltyReport rows with status in {ACCEPTED, PAID}, EXCLUDING the
        report being accepted. (Accept processes reports in chronological
        order; a report accepted after a later-period report still uses the
        full current {ACCEPTED, PAID} set as its base.)
      rate1_bp = license.royalty_rate_bp
      rate2_bp = floor(license.royalty_rate_bp / 2)   # tier-2 rate halves
      cap = TIER1_SALES_CAP_CENTS
      below_portion = min(reported_sales_cents, max(0, cap - cumulative_before))
      above_portion = reported_sales_cents - below_portion
      # Boundary precision: when cumulative_before >= cap, below_portion = 0
      # and the ENTIRE report prices at tier 2. Sales exactly AT the cap are
      # still tier 1 (cap is a sales-cents ceiling, reached inclusive).
      tier1_amount = round_half_up(below_portion * rate1_bp / 10000)
      tier2_amount = round_half_up(above_portion * rate2_bp / 10000)
      earned_royalty_cents = tier1_amount + tier2_amount
      # Rounding order is pinned: each tier portion is rounded to cents
      # FIRST (round_half_up), then summed. Summing raw values and rounding
      # once at the end is the alternative interpretation and yields
      # different cents when a tier-2 portion has a fractional cent.
    input_set: "The RoyaltyReport being accepted plus the license's other reports with status in {ACCEPTED, PAID} (SUBMITTED and VOIDED excluded)"
    constants:
      TIER1_SALES_CAP_CENTS: 100000000
    precision: "integer cents; per-portion round_half_up then sum"

  - name: annual_minimum_true_up
    trigger: "POST /tlo/royalty-reports/{reportId}/accept (computed alongside tiered_earned_royalty)"
    algorithm: threshold
    formula: |
      License year Y (1-indexed) = [effective_date + 365*(Y-1) days,
                                    effective_date + 365*Y days).
      A report is year-closing iff
        floor((period_end - effective_date)/86400s / 365)
          > floor((period_start - effective_date)/86400s / 365)
      If NOT year-closing: true_up_cents = 0.
      If year-closing (closing year Y):
        earned_in_year = sum of earned_royalty_cents over this license's
          ACCEPTED/PAID reports whose [period_start, period_end) lies entirely
          within year Y, INCLUDING this report's just-computed
          earned_royalty_cents.
        true_up_cents = max(0, license.minimum_annual_royalty_cents
                               - earned_in_year)
      No proration: the full minimum applies to any crossed year, even a
      partial one. Two valid readings of "royalty owed for the year" —
      earned-only vs earned-plus-true-up — produce different totals for the
      same sales data whenever the minimum binds.
    input_set: "The report being accepted plus the license's ACCEPTED/PAID reports in the closed license year"
    constants: {}
    precision: "integer cents, no rounding needed"
    variants:
      - name: earned_only
        when: "Report is not year-closing"
        difference: "accepted_royalty_cents == earned_royalty_cents; minimum ignored"
      - name: with_true_up
        when: "Report is year-closing"
        difference: "accepted_royalty_cents == earned_royalty_cents + max(0, minimum_annual_royalty_cents - earned_in_year); differs from earned-only whenever earned_in_year < minimum"

  - name: distribution_waterfall
    trigger: "POST /tlo/royalty-reports/{reportId}/distribution and POST /tlo/distributions/{distributionId}/recalculate"
    algorithm: waterfall_allocation
    formula: |
      # Evaluation order is pinned; later steps consume earlier outputs.
      # (mode (a): >=3 inputs, nested min, conditional branches on entity state)
      gross_cents = report.accepted_royalty_cents   # snapshot
      cost_offset_cents = min(gross_cents, disclosure.unreimbursed_cost_cents)
      net_cents = gross_cents - cost_offset_cents
      admin_fee_cents = round_half_up(net_cents * ADMIN_FEE_PCT / 100)
      inventor_pct = INVENTOR_PCT_FEDERAL if disclosure.funding_source
                       in {FEDERAL, MIXED} else INVENTOR_PCT_NONFEDERAL
      if license.startup_id is not null:
        inventor_pct = inventor_pct - STARTUP_LINKED_REDUCTION_PCT
      inventor_pool_cents = round_half_up(net_cents * inventor_pct / 100)
      department_pool_cents = net_cents - admin_fee_cents - inventor_pool_cents
      university_pool_cents = cost_offset_cents + admin_fee_cents
      # Conservation: gross == cost_offset + admin_fee + inventor_pool
      #                + department_pool  ==  university_pool + inventor_pool
      #                + department_pool
    input_set: "The ACCEPTED report, its license, the disclosure (funding_source, unreimbursed_cost_cents), and the disclosure's CONFIRMED roster"
    constants:
      ADMIN_FEE_PCT: 25
      INVENTOR_PCT_FEDERAL: 40
      INVENTOR_PCT_NONFEDERAL: 35
      STARTUP_LINKED_REDUCTION_PCT: 5
    precision: "integer cents; round_half_up where noted; department_pool absorbs remainder"

  - name: inventor_share_split
    trigger: "POST /tlo/royalty-reports/{reportId}/distribution and POST /tlo/distributions/{distributionId}/recalculate"
    algorithm: waterfall_allocation
    formula: |
      # (mode (b): nested rounding — order pinned, alternative order differs)
      Let E = DisclosureInventor entries of the disclosure with
        confirmation_status == CONFIRMED.
      For each entry: raw_cents = inventor_pool_cents * share_bp / 10000
      floor_cents = floor(raw_cents)
      remainder = inventor_pool_cents - sum(floor_cents)
      Order entries by share_bp DESC, then entry.created_at ASC (earliest
        first). NEVER use id for ordering.
      Distribute remainder one cent at a time to entries in that order,
      wrapping to the front if remainder > len(E), until exhausted.
      amount_cents = floor_cents + extra cents received.
      # Alternative interpretation (round_half_up per entry) is NOT used and
      # yields different per-inventor cents whenever fractions arise.
    input_set: "CONFIRMED DisclosureInventor entries of the disclosure"
    constants:
      SHARE_TOTAL_BP: 10000
    precision: "integer cents; floor then largest-order remainder distribution"

  - name: department_share_split
    trigger: "POST /tlo/royalty-reports/{reportId}/distribution and POST /tlo/distributions/{distributionId}/recalculate"
    algorithm: waterfall_allocation
    formula: |
      Let D = distinct departments of CONFIRMED DisclosureInventor entries.
      Each department's weight = sum of share_bp over CONFIRMED entries whose
        inventor.department_id == department.id.
      raw_cents = department_pool_cents * weight / 10000
      floor_cents = floor(raw_cents)
      remainder = department_pool_cents - sum(floor_cents)
      Order departments by weight DESC, then Department.created_at ASC.
      Distribute remainder one cent at a time in that order, wrapping, until
      exhausted. sum(department_shares.amount_cents) == department_pool_cents.
    input_set: "CONFIRMED DisclosureInventor entries joined to Inventor.department_id"
    constants:
      SHARE_TOTAL_BP: 10000
    precision: "integer cents; floor then remainder in pinned order"

  - name: unreimbursed_cost_rollup
    trigger: "PatentCost create; distribution approve; distribution cancel; patent-application abandon cascade; license termination cascade"
    algorithm: aggregation
    formula: |
      disclosure.unreimbursed_cost_cents =
        sum over PatentCost rows of the disclosure's patent applications
        where reimbursement_status == UNREIMBURSED
        of (amount_cents - reimbursed_amount_cents)
      disclosure.written_off_cost_cents =
        sum over PatentCost rows of the disclosure's patent applications
        where reimbursement_status == WRITTEN_OFF of amount_cents
      patent.unreimbursed_cost_cents / total_cost_cents: same aggregation
        scoped to one application (total includes all statuses).
      After each recompute: cost_writeoff_review_required =
        (written_off_cost_cents >= WRITE_OFF_REVIEW_THRESHOLD_CENTS)
        unless explicitly cleared by cost-review/clear (clearing is sticky
        until the NEXT recompute crosses the threshold again).
    input_set: "PatentCost rows filtered by reimbursement_status; WRITTEN_OFF rows contribute 0 to unreimbursed and their full amount to written_off"
    constants:
      WRITE_OFF_REVIEW_THRESHOLD_CENTS: 5000000
    precision: "integer cents"

  - name: compliance_due_date
    trigger: "POST /tlo/disclosures/{disclosureId}/compliance-reports"
    algorithm: threshold
    formula: |
      INITIAL_DISCLOSURE: due_date = disclosure.created_at + INITIAL_REPORT_DUE_DAYS days
      ELECTION_OF_TITLE:
        statutory = disclosure.created_at + ELECTION_DUE_DAYS days
        bar = public_disclosure_date + BAR_DATE_DAYS days - BAR_BUFFER_DAYS days
              (only if public_disclosure_date is set)
        due_date = min(statutory, bar)   # earlier of the two
      UTILIZATION_REPORT, EXTENSION_REQUEST: due_date = client-provided input.
      Lateness boundary: late_flag = (submitted_at > due_date) — strictly
      greater. submitted_at == due_date exactly is ON TIME.
    input_set: "The disclosure (created_at, public_disclosure_date) and report_type"
    constants:
      INITIAL_REPORT_DUE_DAYS: 180
      ELECTION_DUE_DAYS: 730
      BAR_DATE_DAYS: 365
      BAR_BUFFER_DAYS: 30
    precision: "datetime, second precision"

  - name: startup_equity_bp
    trigger: "POST /tlo/startups/{startupId}/issue-equity"
    algorithm: threshold
    formula: |
      Variant FIXED: university_equity_bp = EQUITY_FIXED_BP (regardless of
        valuation inputs; post_money_valuation_cents is ignored).
      Variant ANTI_DILUTION (requires post_money_valuation_cents input, > 0):
        raw = AD_BASE_BP * BASE_VALUATION_CENTS / post_money_valuation_cents
        university_equity_bp = clamp(floor(raw), EQUITY_FLOOR_BP,
                                     EQUITY_CAP_BP)
      Both clamps are reachable: post_money > 2.666...e9 drives raw below the
      200bp floor; post_money < ~5.333e8 drives raw above the 1500bp cap.
      The two variants answer the same question ("how much equity does the
      university get?") with different numbers for identical startup data
      whenever floor(800 * 1e9 / post_money) != 500.
    input_set: "The Startup (equity_model) and, for ANTI_DILUTION, the post_money_valuation_cents payload"
    constants:
      EQUITY_FIXED_BP: 500
      AD_BASE_BP: 800
      BASE_VALUATION_CENTS: 1000000000
      EQUITY_FLOOR_BP: 200
      EQUITY_CAP_BP: 1500
    precision: "integer basis points, floor before clamp"
    variants:
      - name: fixed_grant
        when: "equity_model == FIXED"
        difference: "always EQUITY_FIXED_BP; valuation-independent"
      - name: anti_dilution
        when: "equity_model == ANTI_DILUTION"
        difference: "clamped floor(AD_BASE_BP * BASE_VALUATION_CENTS / post_money); equals fixed grant only at post_money = 1.6e9 cents"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and well-formed"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: all
  - priority: 2
    category: auth
    check: "Role is permitted for this endpoint per RBAC; for entity-backed ownership rules (Inventor confirming own entry; Inventor must be on the disclosure roster to dispute), X-User-ID must match the relevant Inventor id"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: all
  - priority: 3
    category: existence
    check: "Path resource ids exist, validated left-to-right (disclosure, then entry/milestone/report/plan nested under it)"
    error_id: ERR_DISCLOSURE_NOT_FOUND | ERR_DISCLOSURE_ENTRY_NOT_FOUND | ERR_DISPUTE_NOT_FOUND | ERR_PATENT_APPLICATION_NOT_FOUND | ERR_LICENSE_NOT_FOUND | ERR_MILESTONE_NOT_FOUND | ERR_ROYALTY_REPORT_NOT_FOUND | ERR_DISTRIBUTION_NOT_FOUND | ERR_STARTUP_NOT_FOUND | ERR_COI_PLAN_NOT_FOUND | ERR_COMPLIANCE_REPORT_NOT_FOUND | ERR_DEPARTMENT_NOT_FOUND | ERR_INVENTOR_NOT_FOUND
    http_status: 404
    applies_to: all
  - priority: 4
    category: business_constraint
    check: "Request body schema: required fields present, enum membership valid, integer ranges (share_bp 1..10000; royalty_rate_bp 100..2000; amount/fee/sales cents >= 0; cost amount > 0), end > start for date windows, federal_agency+grant_number required iff funding_source in {FEDERAL, MIXED}, post_money_valuation_cents required and > 0 iff equity_model == ANTI_DILUTION; unknown payload fields rejected"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all POST/PATCH endpoints
  - priority: 5
    category: state
    check: "Target entity is in a state from which the requested transition is defined (per §1.2 preconditions)"
    error_id: ERR_DISCLOSURE_INVALID_STATE | ERR_INVENTORSHIP_NOT_FINALIZABLE | ERR_ENTRY_NOT_CONFIRMABLE | ERR_ENTRY_NOT_DISPUTABLE | ERR_DISPUTE_NOT_OPEN | ERR_PATENT_INVALID_STATE | ERR_STARTUP_INVALID_STATE | ERR_COI_NOT_REVIEWABLE | ERR_COI_NOT_REVISABLE | ERR_LICENSE_NOT_NEGOTIABLE | ERR_LICENSE_NOT_EXECUTABLE | ERR_LICENSE_NOT_ACTIVE | ERR_LICENSE_NOT_IN_DEFAULT | ERR_LICENSE_NOT_TERMINABLE | ERR_MILESTONE_NOT_PENDING | ERR_REPORT_NOT_ACCEPTABLE | ERR_DISTRIBUTION_NOT_APPROVABLE | ERR_DISTRIBUTION_NOT_PAYABLE | ERR_DISTRIBUTION_NOT_CANCELLABLE | ERR_COMPLIANCE_REPORT_INVALID_STATE | ERR_COST_REVIEW_NOT_REQUIRED
    http_status: 409
    applies_to: action endpoints
  - priority: 6
    category: business_safety
    check: "Segregation of duties and compliance gates: (a) compliance-report certifier != prepared_by_user_id; (b) distribution approver != prepared_by_user_id; (c) NON_PROVISIONAL/PCT application on FEDERAL/MIXED disclosure requires an ELECTION_OF_TITLE report in {SUBMITTED, AGENCY_ACCEPTED}; (d) startup-linked license execute and startup issue-equity require APPROVED COI coverage of the current clock"
    error_id: ERR_SEGREGATION_OF_DUTIES | ERR_TITLE_NOT_ELECTED | ERR_COI_COVERAGE_REQUIRED
    http_status: 409
    applies_to: "compliance-reports/{id}/certify, distributions/{id}/approve, patent-applications create, licenses/{id}/execute, startups/{id}/issue-equity"
  - priority: 7
    category: business_referential
    check: "Referenced entities are usable: COI plan inventor must be on the startup's disclosure roster; compliance reports only on FEDERAL/MIXED disclosures; startup/license/patent creation only on PATENT_PURSUED disclosures; cost-writeoff review block; duplicate roster inventor"
    error_id: ERR_INVENTOR_NOT_ON_DISCLOSURE | ERR_NOT_FEDERALLY_FUNDED | ERR_COST_REVIEW_REQUIRED | ERR_DUPLICATE_INVENTOR
    http_status: 422
    applies_to: "coi-plans create, compliance-reports create, startups create, licenses create, patent-applications create, disclosures/{id}/inventors create"
  - priority: 8
    category: business_constraint
    check: "Intra-entity and intra-aggregate constraints: share sums to 10000 at finalize/resolve; COI window half-open overlap; exclusive license closed-interval overlap; report period half-open overlap; milestone terms sane"
    error_id: ERR_SHARE_SUM_INVALID | ERR_COI_WINDOW_OVERLAP | ERR_EXCLUSIVE_OVERLAP | ERR_REPORT_PERIOD_OVERLAP
    http_status: 409
    applies_to: "inventorship/finalize, disputes resolve, coi-plans create/approve/PATCH, licenses/{id}/execute, royalty-reports create"
  - priority: 9
    category: business_temporal
    check: "Clock-dependent windows: milestone achieve before due; cure within cure_deadline; terminate only after cure_deadline; default grounds require overdue milestone; assessment gate ratings"
    error_id: ERR_MILESTONE_OVERDUE | ERR_CURE_PERIOD_EXPIRED | ERR_CURE_PERIOD_ACTIVE | ERR_NO_DEFAULT_GROUNDS | ERR_ASSESSMENT_GATE_FAILED
    http_status: 409
    applies_to: "milestones achieve, licenses cure/terminate/declare-default, disclosures decision"
  - priority: 10
    category: business_fiscal
    check: "Fiscal floors last: EXCLUSIVE license execute requires upfront_fee_cents >= EXCLUSIVE_MIN_UPFRONT_CENTS (500000)"
    error_id: ERR_UPFRONT_BELOW_FLOOR
    http_status: 402
    applies_to: "licenses/{id}/execute"

