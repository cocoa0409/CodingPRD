# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# domain: map-authorized-reseller-enforcement   (difficulty_level: expert_plus)
#
# Every instance grounds exclusively in SCAFFOLD.yaml §1.1-§1.7. Every literal
# money / points / score value below was computed by executing the relevant
# §1.3 `formula:` against its `constants:` (see each instance's setup for the
# pinned inputs). Logical clock starts at the documented default
# 2026-08-01T00:00:00Z and is only ever moved with POST /_clock/set_current_utc.
#
# Enum-spelling adjudications (SCAFFOLD.yaml states two spellings in a few
# places; §1.5 `input:`/`side_effects:` is the request contract and wins):
#   - POST /pricing-policies/{id}/review-decision      decision: APPROVE | RETURN
#   - POST /test-purchases/{id}/confirm-outcome         outcome:  CONFIRM | CLEAR
#   - POST /violations/{id}/dispute-decision            decision: UPHOLD | REVERSE
#   - notice rescind puts the cited Violation in VOIDED (§1.5 + §1.3
#     reseller_points_ledger, which pins VOIDED <-> assessed_points = null)
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: violation_points_provisional_at_detection_vs_final_at_notice
        grounds:
          - calculations.violation_points
          - calculations.violation_points.variants.PROVISIONAL_AT_DETECTION
          - calculations.violation_points.variants.FINAL_AT_NOTICE
          - calculations.effective_map_floor
          - calculations.exception_override_floor
          - entities.Violation.fields.provisional_points
          - entities.Violation.fields.assessed_points
          - entities.Violation.fields.provisional_floor_cents
          - entities.Violation.fields.assessed_floor_cents
          - state_machines.PriceObservation.CAPTURED_to_EVALUATED_BREACH
          - state_machines.Violation.DETECTED_to_NOTICED
        distinguishing_aspect: |
          On the Violation / PriceObservation money domain the same listing yields
          provisional_points == 6 at detection (floor 10000) and assessed_points == 3
          at notice issuance (floor 8500 after a retroactive PROMOTIONAL_EVENT
          exception), because PROVISIONAL_AT_DETECTION evaluates as_of
          observation.observed_at while FINAL_AT_NOTICE re-evaluates as_of the
          issuance clock.
        test_recipe:
          setup:
            - "PricingPolicy MAP-2026-A published with default definitions (shipping_counts_as_advertised false, auto_coupon_counts_as_advertised true, promo_code_counts_as_advertised false, max_discount_attribution_pct 0.40, cure_window_days 10, suspension_points_threshold 6, termination_points_threshold 12), effective_from 2026-08-01T00:00:00Z."
            - "Product SKU-MAP-1: msrp_cents 15000, standard_map_floor_cents 10000, lifecycle_status ACTIVE."
            - "Reseller AUTHORIZED / OPEN under an ACTIVE agreement whose permitted_channels == [MARKETPLACE]; violation_points_total 0."
            - "Logical clock advanced to 2026-08-10T00:00:00Z."
            - "One MARKETPLACE observation observed_at 2026-08-05T00:00:00Z, listed_price_cents 8000, no shipping / coupon / promo, matched to the reseller; evaluated -> EVALUATED_BREACH with Violation in DETECTED (provisional_floor_cents 10000, provisional_points 6)."
            - "A retroactive PROMOTIONAL_EVENT PricingException on the same product, channel_scope MARKETPLACE, window [2026-08-04T00:00:00Z, 2026-08-20T00:00:00Z), requested_override_floor_cents 8500, APPROVED after the violation was detected; the violation is NOT voided because 8000 < 8500."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /pricing-policies"
              payload: { policy_code: "MAP-2026-A", cure_window_days: 10, suspension_points_threshold: 6, termination_points_threshold: 12, suspension_cooling_off_days: 14, max_discount_attribution_pct: 0.40 }
              as: BrandChannelManager
              captures: { pol_id: $.data.id }
            - call: "POST /pricing-policies/${pol_id}/submit-review"
              payload: {}
              as: BrandChannelManager
            - call: "POST /pricing-policies/${pol_id}/review-decision"
              payload: { decision: "APPROVE", legal_review_notes: "Unilateral policy; no dealer input recorded." }
              as: BrandLegalCounsel
              as_user_id: "counsel-1"
            - call: "POST /pricing-policies/${pol_id}/publish"
              payload: { effective_from: "2026-08-01T00:00:00Z" }
              as: BrandLegalCounsel
              as_user_id: "counsel-1"
            - call: "POST /products"
              payload: { sku: "SKU-MAP-1", name: "Aurora Headphones", msrp_cents: 15000, standard_map_floor_cents: 10000, governing_policy_id: "${pol_id}", lifecycle_status: "ACTIVE" }
              as: BrandChannelManager
              captures: { prod_id: $.data.id }
            - call: "POST /resellers"
              payload: { legal_name: "Alpha Retail LLC", contact_email: "notices@alpharetail.example", primary_channel: "MARKETPLACE" }
              as: BrandChannelManager
              captures: { rs_id: $.data.id }
            - call: "POST /reseller-agreements"
              payload: { reseller_id: "${rs_id}", policy_id: "${pol_id}", permitted_channels: ["MARKETPLACE"], quality_obligations: ["AUTHENTICITY_LABELING", "WARRANTY_HONORED"], term_ends_at: "2027-08-01T00:00:00Z", price_terms_included: false }
              as: BrandChannelManager
              captures: { ag_id: $.data.id }
            - call: "POST /reseller-agreements/${ag_id}/send"
              payload: {}
              as: BrandChannelManager
            - call: "POST /reseller-agreements/${ag_id}/respond"
              payload: { decision: "COUNTERSIGN", non_negotiation_acknowledged: true }
              as: Reseller
              as_user_id: "${rs_id}"
            - call: "POST /reseller-agreements/${ag_id}/activate"
              payload: {}
              as: BrandChannelManager
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /price-observations"
              payload: { product_id: "${prod_id}", channel: "MARKETPLACE", marketplace_name: "BigMarket", seller_display_name: "Alpha Retail", listing_url: "https://bigmarket.example/alpha/sku-map-1", listed_price_cents: 8000, shipping_cents: 0, auto_coupon_cents: 0, promo_code_cents: 0, observed_at: "2026-08-05T00:00:00Z", evidence_hash: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef", matched_reseller_id: "${rs_id}" }
              as: MonitoringAnalyst
              as_user_id: "analyst-1"
              captures: { obs_id: $.data.id }
            - call: "POST /price-observations/${obs_id}/evaluate"
              payload: {}
              as: MonitoringAnalyst
              as_user_id: "analyst-1"
              captures: { v_id: $.data.violation_id, prov_points: $.data.provisional_points, prov_floor: $.data.effective_map_floor_cents }
            - call: "POST /pricing-exceptions"
              payload: { product_id: "${prod_id}", exception_type: "PROMOTIONAL_EVENT", starts_at: "2026-08-04T00:00:00Z", ends_at: "2026-08-20T00:00:00Z", channel_scope: "MARKETPLACE", requested_override_floor_cents: 8500, dealer_input_source: "BRAND_MARKETING_PLAN" }
              as: BrandChannelManager
              captures: { exc_id: $.data.id }
            - call: "POST /pricing-exceptions/${exc_id}/decision"
              payload: { decision: "APPROVE", decision_reason: "Back-to-school event, brand marketing plan." }
              as: BrandLegalCounsel
              as_user_id: "counsel-1"
              captures: { exc_floor: $.data.override_floor_cents, voided_count: $.data.voided_violation_count }
            - call: "GET /resellers/${rs_id}"
              payload: {}
              as: BrandChannelManager
              captures: { rs_v: $.data.version }
          trigger:
            - call: "POST /enforcement-notices"
              payload: { reseller_id: "${rs_id}", violation_id: "${v_id}", delivery_channel: "EMAIL", expected_reseller_version: "${rs_v}", contains_pricing_discussion: false }
              as: BrandChannelManager
              as_user_id: "channel-mgr-1"
              captures: { n_id: $.data.id, n_rung: $.data.rung, n_points: $.data.assessed_points, n_cum: $.data.cumulative_points_at_issue }
          assert:
            - "${prov_points} == 6 and Violation.${v_id}.provisional_points == 6"
            - "Violation.${v_id}.provisional_floor_cents == 10000 and ${prov_floor} == 10000"
            - "${exc_floor} == 8500 and ${voided_count} == 0 (8000 < 8500, so the exception approval voids nothing)"
            - "Violation.${v_id}.assessed_floor_cents == 8500"
            - "Violation.${v_id}.assessed_points == 3 and ${n_points} == 3"
            - "Violation.${v_id}.provisional_points != Violation.${v_id}.assessed_points (6 vs 3 on identical listing evidence)"
            - "Violation.${v_id}.status == NOTICED and Violation.${v_id}.cure_deadline_at == 2026-08-20T00:00:00Z"
            - "Reseller.${rs_id}.violation_points_total == 3 (only the FINAL_AT_NOTICE points enter the ledger)"
            - "${n_cum} == 3 and EnforcementNotice.${n_id}.rung == WARNING"
            - "Product.${prod_id}.open_exception_count == 1"

      - name: distributor_exposure_trace_attributed_vs_lot_prorated
        grounds:
          - calculations.distributor_diversion_exposure
          - calculations.distributor_diversion_exposure.variants.TRACE_ATTRIBUTED
          - calculations.distributor_diversion_exposure.variants.LOT_PRORATED
          - entities.SerialUnit.fields.lot_code
          - entities.SerialUnit.fields.shipped_distributor_id
          - entities.Distributor.fields.diversion_score
          - state_machines.SerialUnit.SHIPPED_TO_DISTRIBUTOR_to_TRACED_UNAUTHORIZED
          - state_machines.TestPurchase.SERIAL_CAPTURED_to_CONFIRMED_UNAUTHORIZED
        distinguishing_aspect: |
          On the Distributor risk-exposure domain (a different entity domain from the
          Violation points ledger) the same single traced unit yields exposure_cents
          2500 under TRACE_ATTRIBUTED (whole unit charged to the named shipper) and
          1500 under LOT_PRORATED (0.6 of a unit, the shipper's 3-of-5 share of lot
          LOT-A), while the peer distributor reads 0 and 1000 respectively.
        test_recipe:
          setup:
            - "PricingPolicy MAP-2026-B published effective_from 2026-08-01T00:00:00Z; Product SKU-SER-1 with serialization_enabled true."
            - "Two distributors: D1 (North Distribution) and D2 (South Distribution), both standing GOOD with diversion_score 0."
            - "Lot LOT-A contains exactly 5 SerialUnits: SN-1, SN-2, SN-3 shipped to D1 and SN-4, SN-5 shipped to D2; all SHIPPED_TO_DISTRIBUTOR."
            - "Clock at 2026-08-10T00:00:00Z; one unmatched MARKETPLACE observation of a grey-market storefront, one test purchase against it whose captured serial SN-1 is CONFIRMED_UNAUTHORIZED, so exactly one unit (SN-1, shipped by D1) is TRACED_UNAUTHORIZED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /pricing-policies"
              payload: { policy_code: "MAP-2026-B" }
              as: BrandChannelManager
              captures: { pol_id: $.data.id }
            - call: "POST /pricing-policies/${pol_id}/submit-review"
              payload: {}
              as: BrandChannelManager
            - call: "POST /pricing-policies/${pol_id}/review-decision"
              payload: { decision: "APPROVE", legal_review_notes: "Cleared." }
              as: BrandLegalCounsel
              as_user_id: "counsel-1"
            - call: "POST /pricing-policies/${pol_id}/publish"
              payload: { effective_from: "2026-08-01T00:00:00Z" }
              as: BrandLegalCounsel
              as_user_id: "counsel-1"
            - call: "POST /products"
              payload: { sku: "SKU-SER-1", name: "Aurora Speaker", msrp_cents: 20000, standard_map_floor_cents: 14000, governing_policy_id: "${pol_id}", serialization_enabled: true }
              as: BrandChannelManager
              captures: { prod_id: $.data.id }
            - call: "POST /distributors"
              payload: { legal_name: "North Distribution", annual_chargeback_cap_cents: 5000000 }
              as: BrandChannelManager
              captures: { d1_id: $.data.id }
            - call: "POST /distributors"
              payload: { legal_name: "South Distribution", annual_chargeback_cap_cents: 5000000 }
              as: BrandChannelManager
              captures: { d2_id: $.data.id }
            - call: "POST /serial-units"
              payload: { serial_number: "SN-1", product_id: "${prod_id}", lot_code: "LOT-A", shipped_distributor_id: "${d1_id}" }
              as: BrandChannelManager
              captures: { su1_id: $.data.id }
            - call: "POST /serial-units"
              payload: { serial_number: "SN-2", product_id: "${prod_id}", lot_code: "LOT-A", shipped_distributor_id: "${d1_id}" }
              as: BrandChannelManager
            - call: "POST /serial-units"
              payload: { serial_number: "SN-3", product_id: "${prod_id}", lot_code: "LOT-A", shipped_distributor_id: "${d1_id}" }
              as: BrandChannelManager
            - call: "POST /serial-units"
              payload: { serial_number: "SN-4", product_id: "${prod_id}", lot_code: "LOT-A", shipped_distributor_id: "${d2_id}" }
              as: BrandChannelManager
            - call: "POST /serial-units"
              payload: { serial_number: "SN-5", product_id: "${prod_id}", lot_code: "LOT-A", shipped_distributor_id: "${d2_id}" }
              as: BrandChannelManager
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /price-observations"
              payload: { product_id: "${prod_id}", channel: "MARKETPLACE", marketplace_name: "BigMarket", seller_display_name: "GreyDeals", listing_url: "https://bigmarket.example/greydeals/sku-ser-1", listed_price_cents: 9900, observed_at: "2026-08-05T00:00:00Z", evidence_hash: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef" }
              as: MonitoringAnalyst
              as_user_id: "analyst-1"
              captures: { obs_id: $.data.id }
            - call: "POST /test-purchases"
              payload: { observation_id: "${obs_id}", ordered_at: "2026-08-08T00:00:00Z", purchase_price_cents: 9900 }
              as: MonitoringAnalyst
              as_user_id: "analyst-1"
              captures: { tp_id: $.data.id }
            - call: "POST /test-purchases/${tp_id}/serial-capture"
              payload: { serial_number: "SN-1" }
              as: MonitoringAnalyst
              as_user_id: "analyst-1"
              captures: { traced_su: $.data.traced_serial_unit_id }
            - call: "POST /test-purchases/${tp_id}/confirm-outcome"
              payload: { outcome: "CONFIRM", outcome_reason: "Storefront is not an authorized reseller of record." }
              as: MonitoringAnalyst
              as_user_id: "analyst-1"
          trigger:
            - call: "GET /distributors/${d1_id}/diversion-exposure"
              payload: { variant: "TRACE_ATTRIBUTED" }
              as: BrandChannelManager
              captures: { d1_ta_units: $.data.units_counted, d1_ta_exposure: $.data.exposure_cents, d1_ta_traced: $.data.traced_unit_count, d1_tier: $.data.tier_rate_cents_per_unit }
            - call: "GET /distributors/${d1_id}/diversion-exposure"
              payload: { variant: "LOT_PRORATED" }
              as: BrandChannelManager
              captures: { d1_lp_units: $.data.units_counted, d1_lp_exposure: $.data.exposure_cents }
            - call: "GET /distributors/${d2_id}/diversion-exposure"
              payload: { variant: "TRACE_ATTRIBUTED" }
              as: BrandChannelManager
              captures: { d2_ta_units: $.data.units_counted, d2_ta_exposure: $.data.exposure_cents }
            - call: "GET /distributors/${d2_id}/diversion-exposure"
              payload: { variant: "LOT_PRORATED" }
              as: BrandChannelManager
              captures: { d2_lp_units: $.data.units_counted, d2_lp_exposure: $.data.exposure_cents }
          assert:
            - "SerialUnit.${su1_id}.status == TRACED_UNAUTHORIZED and ${traced_su} == ${su1_id}"
            - "${d1_tier} == 2500 (Distributor.${d1_id}.diversion_score == 0 selects the first TIER_RATES_CENTS bucket)"
            - "${d1_ta_traced} == 1 and ${d1_ta_units} == 1 and ${d1_ta_exposure} == 2500"
            - "${d1_lp_units} == 0.6 and ${d1_lp_exposure} == 1500"
            - "${d2_ta_units} == 0 and ${d2_ta_exposure} == 0 (empty candidate set, no division performed)"
            - "${d2_lp_units} == 0.4 and ${d2_lp_exposure} == 1000"
            - "${d1_lp_units} + ${d2_lp_units} == 1.0 — LOT_PRORATED conserves the single traced unit across the lot's two shippers, while TRACE_ATTRIBUTED charges it whole to D1"
            - "Distributor.${d1_id}.chargeback_balance_cents == 0 and Distributor.${d1_id}.diversion_score == 0 (a computed read mutates nothing)"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: bundle_allocation_round_per_component_then_residual
        grounds:
          - calculations.bundle_component_allocation
          - calculations.effective_advertised_price
          - calculations.effective_map_floor
          - entities.PriceObservation.fields.allocated_component_price_cents
          - entities.PriceObservation.fields.bundle_components
          - entities.PriceObservation.fields.bundle_total_price_cents
          - state_machines.PriceObservation.CAPTURED_to_EVALUATED_BREACH
        distinguishing_aspect: |
          Mode (b) nested-rounding-order: the scaffold pins round-per-component-then-
          give-the-residual-to-the-last-member, so the SKU-C leg of a 10000-cent
          three-way-equal bundle allocates 3334 and the SKU-A leg allocates 3333;
          a sum-then-round implementation would allocate 3333 to SKU-C and lose a
          cent against bundle_total_price_cents.
        test_recipe:
          setup:
            - "PricingPolicy MAP-2026-C published effective_from 2026-08-01T00:00:00Z with default advertised-price definitions."
            - "Two products under it: SKU-A and SKU-C, each msrp_cents 4000 and standard_map_floor_cents 3400."
            - "Clock at 2026-08-10T00:00:00Z."
            - "Two RETAILER_SITE observations of the SAME three-item bundle listing (bundle_total_price_cents 10000; evidenced components SKU-A / SKU-B / SKU-C each msrp_cents 4000, total_component_msrp_cents 12000), one filed against SKU-A and one against SKU-C, both unmatched to any reseller."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /pricing-policies"
              payload: { policy_code: "MAP-2026-C", shipping_counts_as_advertised: false, auto_coupon_counts_as_advertised: true, promo_code_counts_as_advertised: false, max_discount_attribution_pct: 0.40 }
              as: BrandChannelManager
              captures: { pol_id: $.data.id }
            - call: "POST /pricing-policies/${pol_id}/submit-review"
              payload: {}
              as: BrandChannelManager
            - call: "POST /pricing-policies/${pol_id}/review-decision"
              payload: { decision: "APPROVE", legal_review_notes: "Advertised-price definition reviewed." }
              as: BrandLegalCounsel
              as_user_id: "counsel-1"
            - call: "POST /pricing-policies/${pol_id}/publish"
              payload: { effective_from: "2026-08-01T00:00:00Z" }
              as: BrandLegalCounsel
              as_user_id: "counsel-1"
            - call: "POST /products"
              payload: { sku: "SKU-A", name: "Aurora Earbuds", msrp_cents: 4000, standard_map_floor_cents: 3400, governing_policy_id: "${pol_id}" }
              as: BrandChannelManager
              captures: { pa_id: $.data.id }
            - call: "POST /products"
              payload: { sku: "SKU-C", name: "Aurora Charging Case", msrp_cents: 4000, standard_map_floor_cents: 3400, governing_policy_id: "${pol_id}" }
              as: BrandChannelManager
              captures: { pc_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /price-observations"
              payload: { product_id: "${pa_id}", channel: "RETAILER_SITE", marketplace_name: "MegaRetail", seller_display_name: "MegaRetail Direct", listing_url: "https://megaretail.example/aurora-bundle", listed_price_cents: 10000, shipping_cents: 0, auto_coupon_cents: 0, promo_code_cents: 0, is_bundle: true, bundle_total_price_cents: 10000, bundle_components: [{ sku: "SKU-A", msrp_cents: 4000 }, { sku: "SKU-B", msrp_cents: 4000 }, { sku: "SKU-C", msrp_cents: 4000 }], observed_at: "2026-08-05T00:00:00Z", evidence_hash: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef" }
              as: MonitoringAnalyst
              as_user_id: "analyst-1"
              captures: { obs_a_id: $.data.id }
            - call: "POST /price-observations"
              payload: { product_id: "${pc_id}", channel: "RETAILER_SITE", marketplace_name: "MegaRetail", seller_display_name: "MegaRetail Direct", listing_url: "https://megaretail.example/aurora-bundle", listed_price_cents: 10000, shipping_cents: 0, auto_coupon_cents: 0, promo_code_cents: 0, is_bundle: true, bundle_total_price_cents: 10000, bundle_components: [{ sku: "SKU-A", msrp_cents: 4000 }, { sku: "SKU-B", msrp_cents: 4000 }, { sku: "SKU-C", msrp_cents: 4000 }], observed_at: "2026-08-05T00:00:00Z", evidence_hash: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef" }
              as: MonitoringAnalyst
              as_user_id: "analyst-1"
              captures: { obs_c_id: $.data.id }
          trigger:
            - call: "POST /price-observations/${obs_a_id}/evaluate"
              payload: {}
              as: MonitoringAnalyst
              as_user_id: "analyst-1"
              captures: { alloc_a: $.data.allocated_component_price_cents, adv_a: $.data.effective_advertised_price_cents, dev_a: $.data.deviation_cents, src_a: $.data.floor_source }
            - call: "POST /price-observations/${obs_c_id}/evaluate"
              payload: {}
              as: MonitoringAnalyst
              as_user_id: "analyst-1"
              captures: { alloc_c: $.data.allocated_component_price_cents, adv_c: $.data.effective_advertised_price_cents, dev_c: $.data.deviation_cents, pct_c: $.data.deviation_pct }
          assert:
            - "${alloc_a} == 3333 and PriceObservation.${obs_a_id}.allocated_component_price_cents == 3333"
            - "${alloc_c} == 3334 and PriceObservation.${obs_c_id}.allocated_component_price_cents == 3334"
            - "the pinned order gives shares 3333 (SKU-A) + 3333 (SKU-B) + 3334 (SKU-C, residual recipient as last of msrp_cents DESC, sku ASC) == 10000 == bundle_total_price_cents exactly; sum-then-round would yield 3333 for SKU-C and drop a cent"
            - "${adv_a} == 3333 and ${adv_c} == 3334 (base_price_cents is the allocation, not listed_price_cents 10000)"
            - "${dev_a} == 67 and ${dev_c} == 66 (standard floor 3400)"
            - "${pct_c} == 0.0194 and ${src_a} == STANDARD"
            - "PriceObservation.${obs_a_id}.evaluation_status == EVALUATED_BREACH and PriceObservation.${obs_c_id}.evaluation_status == EVALUATED_BREACH"
            - "GET /violations with observation_id=${obs_c_id} returns total_count == 0 (matched_reseller_id is null, so no Violation is opened)"

      - name: chargeback_tier_priced_from_pre_increment_diversion_score
        grounds:
          - calculations.chargeback_assessment
          - calculations.distributor_chargeback_ledger
          - entities.DistributorChargeback.fields.tier_rate_cents_per_unit
          - entities.DistributorChargeback.fields.score_delta_applied
          - entities.Distributor.fields.diversion_score
          - entities.Distributor.fields.standing
          - concurrency_rules[chargeback-create-stale-distributor]
          - validations[priority=8]
        distinguishing_aspect: |
          Mode (c) pinned evaluation order on a circular-looking dependency: the tier
          is read from score_pre BEFORE score_delta_applied is added, so the first
          chargeback (4 units, score_pre 0.0) prices at 2500/unit == 10000 rather than
