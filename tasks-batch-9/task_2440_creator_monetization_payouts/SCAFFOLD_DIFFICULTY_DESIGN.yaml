# =============================================================================
# 1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task: task_2440_creator_monetization_payouts
# Grounding source: SCAFFOLD.yaml (this directory) sections 1.1 - 1.7 ONLY.
#
# Conventions used by every test_recipe below:
#   * All paths carry the /monetization api_prefix exactly as declared in 1.5.
#   * The logical clock starts at 2026-08-01T00:00:00Z (1.5 _clock endpoint) and
#     is only moved forward with POST /monetization/_clock/set_current_utc.
#   * PolicyReviewer / FinanceOperator / PlatformAdmin / Auditor are opaque
#     roles; as_user_id is pinned only where a segregation-of-duties comparand
#     (Investigation.opened_by_user_id, ContentItem.last_rated_by_user_id) or an
#     audit id is observable. Creator is entity_backed:Creator, so as_user_id is
#     always the creator's server-minted id captured earlier.
#   * Every money literal in assert: was computed by executing the relevant
#     1.3 formula with its declared constants.
# =============================================================================
scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: statement_withholding_provisional_vs_final_rounding_order
        variant_pair: "calculations.statement_withholding: PROVISIONAL (per-event rounding at close) vs FINAL (whole-statement rounding at finalize)"
        grounds:
          - calculations.statement_withholding
          - calculations.withholding_rate_resolution
          - entities.EarningsStatement.fields.withholding_variant
          - entities.EarningsStatement.fields.withholding_cents
          - entities.EarningsStatement.fields.net_payable_cents
          - entities.LedgerEntry.fields.entry_type
          - "state_machines.EarningsStatement.transitions[PROVISIONAL -> FINALIZED]"
          - "state_machines.EarningsPeriod.transitions[OPEN -> CLOSED]"
        distinguishing_aspect: |
          Dual variant on the EarningsStatement / tax-withholding domain: the
          PROVISIONAL variant applies ONE ROUND_HALF_UP to the aggregate
          (1005 * 3000bps -> 302) while the FINAL variant applies ROUND_HALF_UP
          per member of E(S) and sums (3 * 101 -> 303), so identical frozen
          inputs and an identical rate 3000 bps yield withholding_cents 302 then
          303 and a WITHHOLDING_TRUE_UP LedgerEntry of exactly -1 cent.
        test_recipe:
          setup:
            - "Logical clock at its 2026-08-01T00:00:00Z startup default (never moved)."
            - "One GB Creator with follower_count 10000 and watch_time_minutes_365d 240000, evaluated once so eligibility_status == ELIGIBLE, payout_state ACCRUING, lifetime_paid_cents 0 (tier bonus bucket T0 = 0 bps)."
            - "That creator's single TaxProfile is W8BEN / GB / tin_provided true / treaty_claimed false and has reached VERIFIED, so withholding_rate_resolution returns NRA_DEFAULT_BPS == 3000."
            - "One TIPS RevenueProduct (suitability_sensitive false) with creator_share_bps 6700, platform_fee_bps 3300, min_payable_cents 0."
            - "One EarningsPeriod [2026-07-01T00:00:00Z, 2026-08-01T00:00:00Z) holding exactly three ACCRUED RevenueEvents of gross_amount_cents 500 each, each with creator_share_cents 335 and one ACCRUAL LedgerEntry of +335."
            - "The period has been CLOSED, so one PROVISIONAL EarningsStatement exists with gross_cents 1500, creator_share_cents 1005, event_count 3, withholding_rate_bps 3000, withholding_cents 302, net_payable_cents 703, and a WITHHOLDING LedgerEntry of -302 was appended."
          setup_api_calls:
            - call: "POST /monetization/creators"
              payload: { display_name: "Ada GB", country_code: "GB", follower_count: 10000, watch_time_minutes_365d: 240000 }
              as: PlatformAdmin
              captures: { cr_id: "$.data.id" }
            - call: "POST /monetization/creators/${cr_id}/evaluate"
              payload: {}
              as: FinanceOperator
              captures: { cr_v2: "$.data.version" }
            - call: "POST /monetization/tax-profiles"
              payload: { creator_id: "${cr_id}", form_type: "W8BEN", country_code: "GB", tin_provided: true, treaty_claimed: false, expected_creator_version: "${cr_v2}" }
              as: FinanceOperator
              captures: { tp_id: "$.data.id" }
            - call: "POST /monetization/tax-profiles/${tp_id}/submit"
              payload: {}
              as: Creator
              as_user_id: "${cr_id}"
            - call: "POST /monetization/tax-profiles/${tp_id}/verify"
              payload: { decision: "VERIFY" }
              as: FinanceOperator
            - call: "POST /monetization/revenue-products"
              payload: { product_type: "TIPS", name: "Tips Standard", creator_share_bps: 6700, platform_fee_bps: 3300, min_payable_cents: 0 }
              as: PlatformAdmin
              captures: { prod_id: "$.data.id" }
            - call: "POST /monetization/earnings-periods"
              payload: { label: "2026-07", period_start: "2026-07-01T00:00:00Z", period_end: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { p1_id: "$.data.id" }
            - call: "POST /monetization/revenue-events"
              payload: { creator_id: "${cr_id}", product_id: "${prod_id}", gross_amount_cents: 500, occurred_at: "2026-07-05T00:00:00Z" }
              as: FinanceOperator
              captures: { ev1_id: "$.data.id" }
            - call: "POST /monetization/revenue-events"
              payload: { creator_id: "${cr_id}", product_id: "${prod_id}", gross_amount_cents: 500, occurred_at: "2026-07-06T00:00:00Z" }
              as: FinanceOperator
              captures: { ev2_id: "$.data.id" }
            - call: "POST /monetization/revenue-events"
              payload: { creator_id: "${cr_id}", product_id: "${prod_id}", gross_amount_cents: 500, occurred_at: "2026-07-07T00:00:00Z" }
              as: FinanceOperator
              captures: { ev3_id: "$.data.id" }
            - call: "POST /monetization/earnings-periods/${p1_id}/close"
              payload: {}
              as: FinanceOperator
            - call: "GET /monetization/earnings-statements"
              payload: { creator_id: "${cr_id}", period_id: "${p1_id}" }
              as: FinanceOperator
              captures: { s1_id: "$.data[0].id", s1_prov_wh: "$.data[0].withholding_cents", s1_prov_net: "$.data[0].net_payable_cents" }
          trigger:
            - call: "POST /monetization/earnings-statements/${s1_id}/finalize"
              payload: {}
              as: FinanceOperator
              captures: { s1_final_wh: "$.data.withholding_cents", s1_final_net: "$.data.net_payable_cents" }
          assert:
            - "${s1_prov_wh} == 302 and ${s1_prov_net} == 703 (PROVISIONAL aggregate-then-round)"
            - "${s1_final_wh} == 303 and ${s1_final_net} == 702 (FINAL per-event-then-sum)"
            - "EarningsStatement.${s1_id}.withholding_variant == FINAL"
            - "EarningsStatement.${s1_id}.withholding_rate_bps == 3000 (the rate did NOT move; the whole delta is rounding order)"
            - "EarningsStatement.${s1_id}.creator_share_cents == 1005 and gross_cents == 1500 and event_count == 3"
            - "EarningsStatement.${s1_id}.status == FINALIZED"
            - "GET /monetization/creators/${cr_id}/ledger-entries?entry_type=WITHHOLDING_TRUE_UP returns exactly one LedgerEntry with amount_cents == -1 and source_entity == EARNINGS_STATEMENT"
            - "Creator.${cr_id}.ledger_balance_cents == 702 (335+335+335-302-1)"
            - "Creator.${cr_id}.available_balance_cents == 702"
            - "EarningsPeriod.${p1_id}.status == FINALIZED and finalized_statement_count == 1 and statement_count == 1"

      - name: eligibility_ondemand_vs_period_close_strike_lapse
        variant_pair: "calculations.eligibility_evaluation: on-demand variant via POST /creators/{id}/evaluate vs the implicit period-close variant run inside POST /earnings-periods/{id}/close"
        grounds:
          - calculations.eligibility_evaluation
          - entities.Creator.fields.eligibility_status
          - entities.Creator.fields.active_strike_count
          - entities.Creator.fields.last_strike_at
          - entities.Creator.fields.last_evaluation_failed_criteria
          - entities.Creator.fields.evaluation_count
          - "state_machines.Creator.transitions[eligibility_status IN {PENDING_REVIEW, ELIGIBLE, INELIGIBLE} -> eligibility_status=SUSPENDED]"
          - "state_machines.Creator.transitions[eligibility_status=SUSPENDED -> eligibility_status=ELIGIBLE]"
        distinguishing_aspect: |
          Dual variant on a different entity domain (Creator eligibility, not
          money): with byte-identical stored creator state at logical time
          2026-10-30T00:00:00Z the ON_DEMAND variant reads active_strike_count
          as stored and returns SUSPENDED with ["POLICY_COMPLIANCE"], while the
          PERIOD_CLOSE variant runs after close step 2 has zeroed the lapsed
          strike and returns ELIGIBLE with an empty failed-criteria array.
        test_recipe:
          setup:
            - "One Creator with follower_count 10000 and watch_time_minutes_365d 240000 (both exactly at MIN_FOLLOWERS / MIN_WATCH_MINUTES_365D)."
            - "One policy strike recorded at logical time 2026-08-01T00:00:00Z, so active_strike_count == 1, last_strike_at == 2026-08-01T00:00:00.000Z, eligibility_status == SUSPENDED and evaluation_count == 1 from the strike cascade."
            - "The logical clock has been advanced to exactly 2026-08-01T00:00:00Z + STRIKE_ACTIVE_DAYS(90) == 2026-10-30T00:00:00Z, so the lapse test last_strike_at + 90d <= close time holds with equality."
            - "One OPEN EarningsPeriod [2026-07-01T00:00:00Z, 2026-08-01T00:00:00Z) exists with no RevenueEvents, so close creates no EarningsStatement."
          setup_api_calls:
            - call: "POST /monetization/creators"
              payload: { display_name: "Bo Strike", country_code: "US", follower_count: 10000, watch_time_minutes_365d: 240000 }
              as: PlatformAdmin
              captures: { cr_id: "$.data.id" }
            - call: "POST /monetization/earnings-periods"
              payload: { label: "2026-07", period_start: "2026-07-01T00:00:00Z", period_end: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { p1_id: "$.data.id" }
            - call: "POST /monetization/creators/${cr_id}/policy-strikes"
              payload: { reason: "Reused third-party footage without licence." }
              as: PolicyReviewer
              as_user_id: "reviewer-r1"
              captures: { strike_status: "$.data.eligibility_status", strike_evals: "$.data.evaluation_count" }
            - call: "POST /monetization/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-30T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /monetization/creators/${cr_id}/evaluate"
              payload: {}
              as: FinanceOperator
              captures: { od_status: "$.data.eligibility_status", od_criteria: "$.data.last_evaluation_failed_criteria", od_strikes: "$.data.active_strike_count", od_evals: "$.data.evaluation_count" }
            - call: "POST /monetization/earnings-periods/${p1_id}/close"
              payload: {}
              as: FinanceOperator
            - call: "GET /monetization/creators/${cr_id}"
              payload: {}
              as: FinanceOperator
              captures: { pc_status: "$.data.eligibility_status", pc_criteria: "$.data.last_evaluation_failed_criteria", pc_strikes: "$.data.active_strike_count", pc_evals: "$.data.evaluation_count", pc_last_eval: "$.data.last_evaluated_at" }
          assert:
            - "${strike_status} == SUSPENDED and ${strike_evals} == 1 (strike cascade hop 2 already ran one evaluation)"
            - "${od_status} == SUSPENDED (ON_DEMAND variant applies no strike lapse)"
            - "${od_criteria} == ['POLICY_COMPLIANCE'] (exactly one element; the metric criteria are not appended)"
            - "${od_strikes} == 1 and ${od_evals} == 2"
            - "${pc_status} == ELIGIBLE (PERIOD_CLOSE variant runs after close step 2)"
            - "${pc_criteria} == [] (empty array)"
            - "${pc_strikes} == 0 and ${pc_evals} == 3"
            - "${pc_last_eval} == '2026-10-30T00:00:00.000Z'"
            - "EarningsPeriod.${p1_id}.status == CLOSED and statement_count == 0 (compound FINALIZED needs statement_count >= 1)"

      - name: fund_methodology_pro_rata_vs_guaranteed_floor_same_pool
        variant_pair: "calculations.fund_allocation: PRO_RATA_WATCH_TIME vs GUARANTEED_FLOOR over an identical pool and candidate set"
        grounds:
          - calculations.fund_allocation
          - entities.CreatorFund.fields.methodology
          - entities.CreatorFund.fields.allocated_cents
          - entities.CreatorFund.fields.unallocated_remainder_cents
          - entities.FundAllocation.fields.amount_cents
          - entities.FundAllocation.fields.rank
          - entities.FundAllocation.fields.methodology_snapshot
          - "state_machines.CreatorFund.transitions[DRAFT -> ALLOCATED]"
        distinguishing_aspect: |
          Dual variant on a third entity domain (CreatorFund allocation, neither
          statement withholding nor creator eligibility): the same pool of
          100000 cents over the same three ELIGIBLE creators (watch time
          500000 / 300000 / 200001) pays rank 1 exactly 50000 and rank 3 exactly
          20000 under PRO_RATA_WATCH_TIME but 47500 and 22000 under
          GUARANTEED_FLOOR_WATERFALL, a cent-level transparency-versus-
          predictability divergence with identical inputs.
          Verified arithmetic: PRO_RATA floor quotients 49999/29999/20000 sum to
          99998, single rank-ordered remainder pass adds +1 to ranks 1 and 2 ->
          50000/30000/20000. GUARANTEED_FLOOR with N=3, floor 5000, surplus
          85000 gives shares 42499/25499/17000 -> 47499/30499/22000, remainder 2
          -> 47500/30500/22000.
        test_recipe:
          setup:
            - "Three Creators created in this order with watch_time_minutes_365d 500000, 300000 and 200001 and follower_count 10000 each; each has been evaluated so eligibility_status == ELIGIBLE."
            - "Ranking under watch_time_minutes_365d DESC, created_at ASC is therefore c1 rank 1, c2 rank 2, c3 rank 3; total_wt == 1000001."
            - "Two OPEN abutting EarningsPeriods exist so two live CreatorFunds can coexist (validation 64 allows at most one DRAFT/ALLOCATED fund per period)."
            - "Fund A: period 1, total_pool_cents 100000, methodology PRO_RATA_WATCH_TIME, min_watch_time_minutes 0, max_allocation_cents 1000000, status DRAFT, version 1."
            - "Fund B: period 2, identical pool and cap, methodology GUARANTEED_FLOOR_WATERFALL, status DRAFT, version 1."
          setup_api_calls:
            - call: "POST /monetization/creators"
              payload: { display_name: "Fund C1", country_code: "US", follower_count: 10000, watch_time_minutes_365d: 500000 }
              as: PlatformAdmin
              captures: { c1_id: "$.data.id" }
            - call: "POST /monetization/creators"
              payload: { display_name: "Fund C2", country_code: "US", follower_count: 10000, watch_time_minutes_365d: 300000 }
              as: PlatformAdmin
              captures: { c2_id: "$.data.id" }
            - call: "POST /monetization/creators"
              payload: { display_name: "Fund C3", country_code: "US", follower_count: 10000, watch_time_minutes_365d: 200001 }
              as: PlatformAdmin
              captures: { c3_id: "$.data.id" }
            - call: "POST /monetization/creators/${c1_id}/evaluate"
              payload: {}
              as: FinanceOperator
            - call: "POST /monetization/creators/${c2_id}/evaluate"
              payload: {}
              as: FinanceOperator
            - call: "POST /monetization/creators/${c3_id}/evaluate"
              payload: {}
              as: FinanceOperator
            - call: "POST /monetization/earnings-periods"
              payload: { label: "2026-07", period_start: "2026-07-01T00:00:00Z", period_end: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { p1_id: "$.data.id" }
            - call: "POST /monetization/earnings-periods"
              payload: { label: "2026-08", period_start: "2026-08-01T00:00:00Z", period_end: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { p2_id: "$.data.id" }
            - call: "POST /monetization/creator-funds"
              payload: { name: "Pro Rata Fund", period_id: "${p1_id}", total_pool_cents: 100000, methodology: "PRO_RATA_WATCH_TIME", min_watch_time_minutes: 0, max_allocation_cents: 1000000 }
              as: PlatformAdmin
              captures: { fa_id: "$.data.id", fa_v: "$.data.version" }
            - call: "POST /monetization/creator-funds"
              payload: { name: "Guaranteed Floor Fund", period_id: "${p2_id}", total_pool_cents: 100000, methodology: "GUARANTEED_FLOOR_WATERFALL", min_watch_time_minutes: 0, max_allocation_cents: 1000000 }
              as: PlatformAdmin
              captures: { fb_id: "$.data.id", fb_v: "$.data.version" }
          trigger:
            - call: "POST /monetization/creator-funds/${fa_id}/allocate"
              payload: { expected_fund_version: "${fa_v}" }
              as: FinanceOperator
            - call: "POST /monetization/creator-funds/${fb_id}/allocate"
              payload: { expected_fund_version: "${fb_v}" }
              as: FinanceOperator
          assert:
            - "GET /monetization/creator-funds/${fa_id}/fund-allocations returns 3 ACTIVE rows ordered rank ASC with amount_cents 50000, 30000, 20000 and creator_id ${c1_id}, ${c2_id}, ${c3_id}"
            - "GET /monetization/creator-funds/${fb_id}/fund-allocations returns 3 ACTIVE rows ordered rank ASC with amount_cents 47500, 30500, 22000 and creator_id ${c1_id}, ${c2_id}, ${c3_id}"
            - "every FundAllocation of ${fa_id} has methodology_snapshot == PRO_RATA_WATCH_TIME; every FundAllocation of ${fb_id} has methodology_snapshot == GUARANTEED_FLOOR_WATERFALL"
            - "FundAllocation rows of both funds carry watch_time_minutes_at_allocation 500000, 300000, 200001 in rank order"
            - "CreatorFund.${fa_id}.allocated_cents == 100000 and unallocated_remainder_cents == 0 and recipient_count == 3 and allocation_run_count == 1 and status == ALLOCATED"
            - "CreatorFund.${fb_id}.allocated_cents == 100000 and unallocated_remainder_cents == 0 and recipient_count == 3 and allocation_run_count == 1 and status == ALLOCATED"
            - "Creator.${c1_id}.fund_credit_balance_cents == 0 (allocate never credits; only disburse does)"

  - rule_id: combinatorial_formula
    instances:
      - name: revenue_share_cap_before_suitability_multiplier_mode_a
        mode: "a_multi_input_non_linear_interaction"
        grounds:
          - calculations.revenue_share_split
          - entities.RevenueProduct.fields.creator_share_bps
          - entities.RevenueProduct.fields.suitability_sensitive
          - entities.RevenueProduct.fields.min_payable_cents
          - entities.Creator.fields.lifetime_paid_cents
          - entities.ContentItem.fields.suitability_rating
          - entities.RevenueEvent.fields.effective_share_bps
          - entities.RevenueEvent.fields.creator_share_cents
          - calculations.payout_fee_and_amount
        distinguishing_aspect: |
          Mode (a): five independent inputs interact non-linearly in a single
          effective_share_bps derivation - product.creator_share_bps (8800),
          the loyalty tier bonus selected from Creator.lifetime_paid_cents
          (exactly 1000000 -> bucket [1000000,9999999] -> +400 bps),
          MAX_EFFECTIVE_SHARE_BPS (9000), product.suitability_sensitive (true
          for ADVERTISING) and SUITABILITY_MULT_BPS[YELLOW] (6000). The cap is
          applied BEFORE the multiplier, so effective_share_bps == 5400 and
          creator_share_cents == 666; applying the multiplier first and then the
          cap yields 5520 and 681. The tier input itself is only reachable by
          driving a real payout to PAID, so the instance also composes the
          payout fee waterfall.
        test_recipe:
          setup:
            - "One US Creator, follower_count 10000, watch_time_minutes_365d 240000, payout_method CHECK, evaluated to ELIGIBLE."
            - "Its TaxProfile is W9 / US / tin_provided true / treaty_claimed false and VERIFIED, so withholding_rate_resolution returns 0 bps and every statement's net_payable_cents equals its creator_share_cents."
            - "A TIPS RevenueProduct (creator_share_bps 5000, platform_fee_bps 5000, min_payable_cents 0) accrued one event of gross_amount_cents 2000500 in period 2026-07, giving creator_share_cents 1000250."
            - "Period 2026-07 has been CLOSED and its statement FINALIZED with withholding_cents 0 and net_payable_cents 1000250, so available_balance_cents == 1000250."
            - "A Payout was created (payable_before_fee_cents 1000250, volume tier T3 because 1000250 >= 500000, CHECK gross fee 500, tiered ceil(500*5000/10000) == 250, cap 500 -> fee_cents 250, amount_cents 1000000), submitted, and settled SUCCEEDED, so Creator.lifetime_paid_cents == 1000000 exactly and payout_state is back to ACCRUING."
            - "An ADVERTISING RevenueProduct exists with creator_share_bps 8800, platform_fee_bps 1200, min_payable_cents 0, terms_version 1, suitability_sensitive true."
            - "One ContentItem of that creator (published_at 2026-07-01T00:00:00Z) has been rated YELLOW by a PolicyReviewer, so monetization_state == LIMITED; no RevenueEvent references it yet, so the rating cascade re-scored nothing."
            - "The clock has been advanced to 2026-08-15T00:00:00Z and a second OPEN EarningsPeriod [2026-08-01T00:00:00Z, 2026-09-01T00:00:00Z) exists."
          setup_api_calls:
            - call: "POST /monetization/creators"
              payload: { display_name: "Cy Tier", country_code: "US", follower_count: 10000, watch_time_minutes_365d: 240000, payout_method: "CHECK" }
              as: PlatformAdmin
              captures: { cr_id: "$.data.id" }
            - call: "POST /monetization/creators/${cr_id}/evaluate"
              payload: {}
              as: FinanceOperator
              captures: { cr_v2: "$.data.version" }
            - call: "POST /monetization/tax-profiles"
              payload: { creator_id: "${cr_id}", form_type: "W9", country_code: "US", tin_provided: true, treaty_claimed: false, expected_creator_version: "${cr_v2}" }
              as: FinanceOperator
              captures: { tp_id: "$.data.id" }
            - call: "POST /monetization/tax-profiles/${tp_id}/submit"
              payload: {}
              as: Creator
              as_user_id: "${cr_id}"
            - call: "POST /monetization/tax-profiles/${tp_id}/verify"
              payload: { decision: "VERIFY" }
              as: FinanceOperator
            - call: "POST /monetization/revenue-products"
              payload: { product_type: "TIPS", name: "Tips Flat", creator_share_bps: 5000, platform_fee_bps: 5000, min_payable_cents: 0 }
              as: PlatformAdmin
              captures: { tips_id: "$.data.id" }
            - call: "POST /monetization/revenue-products"
              payload: { product_type: "ADVERTISING", name: "Ads Premium", creator_share_bps: 8800, platform_fee_bps: 1200, min_payable_cents: 0, terms_version: 1 }
              as: PlatformAdmin
              captures: { ads_id: "$.data.id" }
            - call: "POST /monetization/earnings-periods"
              payload: { label: "2026-07", period_start: "2026-07-01T00:00:00Z", period_end: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { p1_id: "$.data.id" }
            - call: "POST /monetization/earnings-periods"
              payload: { label: "2026-08", period_start: "2026-08-01T00:00:00Z", period_end: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { p2_id: "$.data.id" }
            - call: "POST /monetization/content-items"
              payload: { creator_id: "${cr_id}", title: "Ad Friendly Vlog", published_at: "2026-07-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { ci_id: "$.data.id" }
            - call: "POST /monetization/revenue-events"
              payload: { creator_id: "${cr_id}", product_id: "${tips_id}", gross_amount_cents: 2000500, occurred_at: "2026-07-05T00:00:00Z" }
              as: FinanceOperator
              captures: { seed_ev_id: "$.data.id" }
            - call: "POST /monetization/earnings-periods/${p1_id}/close"
              payload: {}
              as: FinanceOperator
            - call: "GET /monetization/earnings-statements"
              payload: { creator_id: "${cr_id}", period_id: "${p1_id}" }
              as: FinanceOperator
              captures: { s1_id: "$.data[0].id" }
            - call: "POST /monetization/earnings-statements/${s1_id}/finalize"
              payload: {}
              as: FinanceOperator
            - call: "POST /monetization/payouts"
              payload: { creator_id: "${cr_id}" }
              as: FinanceOperator
              captures: { po_id: "$.data.id", seed_fee: "$.data.fee_cents", seed_amount: "$.data.amount_cents" }
            - call: "POST /monetization/payouts/${po_id}/submit"
              payload: {}
              as: FinanceOperator
            - call: "POST /monetization/payouts/${po_id}/record-settlement"
              payload: { outcome: "SUCCEEDED" }
              as: FinanceOperator
              captures: { seed_lifetime: "$.data.amount_cents" }
            - call: "POST /monetization/content-items/${ci_id}/rate"
