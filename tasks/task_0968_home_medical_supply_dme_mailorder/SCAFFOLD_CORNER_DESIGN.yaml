  - section: endpoints
    instances:
      - name: patient_list_pagination_envelope
        claim_type: pagination_with_filtering
        grounds:
          - response_envelope
        distinguishing_aspect: "GET /api/patients?limit=1 with 2 patients returns response_type array, exactly 1 item, total_count 2, has_more true; offset 1 returns the second item with has_more false."
        test_recipe:
          setup: ["MCR plan; two patients created"]
          setup_api_calls:
            - { call: "POST /api/payer-plans", payload: { name: "Medicare DMEPOS", plan_type: MEDICARE_DMEPOS, coinsurance_pct: 0.20, cycle_months: 3, is_active: true }, as: PlatformAdmin, captures: { pln: $.data.id } }
            - { call: "POST /api/patients", payload: { full_name: "Pat P1", date_of_birth: "1960-01-01", payer_plan_id: "${pln}", hsa_initial_credit_cents: 0 }, as: IntakeCoordinator, captures: { p1: $.data.id } }
            - { call: "POST /api/patients", payload: { full_name: "Pat P2", date_of_birth: "1961-02-02", payer_plan_id: "${pln}", hsa_initial_credit_cents: 0 }, as: IntakeCoordinator, captures: { p2: $.data.id } }
          trigger:
            - { call: "GET /api/patients", payload: { limit: 1, offset: 0 }, as: IntakeCoordinator }
          assert:
            - "response envelope has meta.api_request_id, response_type == array, total_count == 2, has_more == true, data length == 1"

      - name: order_lines_subresource_reverse_reachability
        claim_type: reverse_reachability
        grounds:
          - entities.OrderLine.fields.order_id
        excluded_because:
