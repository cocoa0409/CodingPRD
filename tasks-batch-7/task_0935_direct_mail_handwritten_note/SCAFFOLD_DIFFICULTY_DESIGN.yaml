          Entity pair MailJob -> Proof: the job's own fields are all valid, but scheduling is refused
          with ERR_PROOF_NOT_APPROVED purely because the Proof row sitting on a different entity is
          still in DRAFT rather than APPROVED.
        test_recipe:
          setup:
            - "One ADDRESSED MARKETING_MAIL job in DRAFT whose only proof is still in DRAFT — never submitted, never approved."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
