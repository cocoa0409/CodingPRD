              as: Member
              as_user_id: "${m1_id}"
          assert:
            - "Membership.${sub1_id}.credit_balance == 20 (debit -5 then refund +5 nets to grant 20)"
            - "Reservation.${r1_id}.attendance_status == CANCELLED and late_fee_cents == 0"
            - "no FeeCharge exists for r1 (early cancel, no fee)"

      - name: strike_conservation_no_show_then_fee_waive
        grounds:
          - state_machines.ClassSession.OPEN_to_COMPLETED
          - state_machines.FeeCharge.ASSESSED_to_WAIVED
          - calculations.member_standing_strike
          - entities.Member.fields.no_show_strikes
        distinguishing_aspect: |
          Different conserved quantity = Member.no_show_strikes. Forward NO_SHOW
          increments strikes by +1 and assesses a fee; the compensating fee waive
          decrements strikes by -1, returning no_show_strikes to its pre-event value 0
          and standing to GOOD.
        test_recipe:
          setup:
            - "Member m1 ACTIVE CREDIT_PACK grant 20, no_show_strikes 0; single-seat session s with m1 BOOKED, completed as NO_SHOW (strikes -> 1, one ASSESSED fee)."
          setup_api_calls:
            - call: "POST /studios"
              payload: { name: "Downtown", state_code: "CA" }
              as: NetworkAdmin
              captures: { studio_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: NetworkAdmin
            - call: "POST /studios/${studio_id}/rooms"
              payload: { name: "Room A", physical_capacity: 10 }
              as: NetworkAdmin
              captures: { room_a: $.data.id }
            - call: "POST /instructors"
              payload: { full_name: "Ina", home_studio_id: "${studio_id}" }
              as: NetworkAdmin
              captures: { inst_a: $.data.id }
            - call: "POST /class-templates"
              payload: { name: "Flow", duration_min: 60, credit_cost: 5, late_cancel_window_hours: 12 }
              as: NetworkAdmin
              captures: { tmpl_id: $.data.id }
            - call: "POST /package-plans"
              payload: { name: "20 Pack", kind: "CREDIT_PACK", price_cents: 8000, grant_credits: 20, validity_days: 60 }
              as: NetworkAdmin
              captures: { pack_plan_id: $.data.id }
            - call: "POST /members"
              payload: { email: "m1@x.com", full_name: "M One", home_studio_id: "${studio_id}" }
              as: NetworkAdmin
              captures: { m1_id: $.data.id }
            - call: "POST /members/${m1_id}/memberships"
              payload: { plan_id: "${pack_plan_id}" }
              as: Member
              as_user_id: "${m1_id}"
              captures: { sub1_id: $.data.id }
            - call: "POST /_payments/capture"
              payload: { membership_id: "${sub1_id}", outcome: "CAPTURED" }
              as: NetworkAdmin
            - call: "POST /sessions"
              payload: { studio_id: "${studio_id}", room_id: "${room_a}", instructor_id: "${inst_a}", template_id: "${tmpl_id}", starts_at: "2026-06-10T10:00:00Z", seat_capacity: 1 }
              as: StudioManager
              captures: { s_id: $.data.id }
            - call: "POST /sessions/${s_id}/publish"
              payload: {}
              as: StudioManager
              captures: { s_v: $.data.version }
            - call: "POST /sessions/${s_id}/reservations"
              payload: { membership_id: "${sub1_id}", expected_session_version: "${s_v}" }
              as: Member
              as_user_id: "${m1_id}"
              captures: { r1_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-10T11:30:00Z" }
              as: NetworkAdmin
            - call: "POST /_ops/run_completion"
              payload: {}
              as: NetworkAdmin
            - call: "GET /members/${m1_id}/fees"
              payload: {}
              as: StudioManager
              captures: { fee_id: "$.data[0].id" }
          trigger:
            - call: "POST /fees/${fee_id}/waive"
              payload: {}
              as: StudioManager
          assert:
            - "Member.${m1_id}.no_show_strikes == 1 immediately after completion, BEFORE waive"
            - "FeeCharge.${fee_id}.status == WAIVED after waive"
            - "Member.${m1_id}.no_show_strikes == 0 after waive (returns to pre-event value)"
            - "Member.${m1_id}.standing == GOOD after waive"
