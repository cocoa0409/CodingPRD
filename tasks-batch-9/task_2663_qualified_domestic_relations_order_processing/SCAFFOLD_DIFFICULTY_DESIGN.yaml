            - "${scope_wins} == \"ERR_DISCLOSURE_SCOPE_EXCEEDED\" with HTTP 403 — priority 50 resolves the revoked LIMITED authorization anyway and objects to the FULL disclosure level before priority 62 can object to the attorney's standing."
            - "${standing_error} == \"ERR_ATTORNEY_NOT_AUTHORIZED\" with HTTP 403 — dropping to LIMITED satisfies priority 50, and the SAME revoked authorization now produces the priority-62 error instead."
            - "The AP_ATTORNEY call returns 201 with ${ok_email} == \"reidun@vikqdro.example\", ${ok_origin} == \"MANUAL\", disclosure_level == \"FULL\", recipient_type == \"AP_ATTORNEY\" and sent_at == \"2026-09-01T00:00:00Z\" — an ACTIVE FULL authorization passes both rules, and attorney_email is a value copy taken from the authorization rather than a foreign key."
            - "${payee_scope_error} == \"ERR_DISCLOSURE_SCOPE_EXCEEDED\" with HTTP 403 — the second clause of priority 50 refuses FULL detail to the alternate payee while review_status is UNDER_REVIEW rather than QUALIFIED, with no attorney involved at all."
            - "GET /qdro-cases/${case_id}/communications with origin=MANUAL returns exactly 1 row — the three refused calls appended nothing."
            - "GET /qdro-cases/${case_id}/attorney-authorizations with status=ACTIVE returns exactly 1 row (${auth_ap}), and the unfiltered call returns 2 rows."

  - rule_id: boundary_precision_check
    instances:
      - name: segregation_hold_expires_only_strictly_after_expires_at
        grounds:
          - calculations.hold_window_and_deadlines
          - endpoints[POST /_ops/run-segregation-sweep]
          - validations[priority=55]
          - entities.SegregationHold.fields.expires_at
          - entities.DeficiencyNotice.fields.resubmission_deadline_at
        distinguishing_aspect: |
          Both time windows in this domain close with a STRICT inequality, and both boundaries are
          tested to the second. A hold placed at 2026-09-01T00:00:00Z with segregation_period_days 548
          expires_at 2028-03-02T00:00:00Z; a sweep run at exactly that instant must leave the hold HELD
          and report every id array empty, and only a sweep at 2028-03-02T00:00:01Z may expire it. The
          same asymmetry governs resubmission: a notice issued 2026-09-01 with a 60-day window has
          resubmission_deadline_at 2026-10-31T00:00:00Z, and a resubmission arriving at exactly that
          instant is ACCEPTED because priority 55's predicate is clock <= deadline. One boundary uses
          `>` on the server side and the other `<=`, so an implementation that normalises both to the
          same comparison fails exactly one of the two halves.
        test_recipe:
          setup:
            - "A PUBLISHED plan with segregation_period_days 548, resubmission_window_days 60, max_revisions 3, requires_model_language true."
            - "A participant not in pay status with a single assignable PRE_TAX_DEFERRAL source of 1000000 and one snapshot on 2026-06-30 at 1000000."
            - "A draft with uses_model_language false received at exactly 2026-09-01T00:00:00Z (hold 400000, expires_at 2028-03-02T00:00:00Z) and a notice issued at the same instant (resubmission_deadline_at 2026-10-31T00:00:00Z)."
          setup_api_calls:
            - call: "POST /plans"
              payload: { plan_name: "Boundary Plan", plan_type: "DEFINED_CONTRIBUTION", model_language_version: "MLA-2026.1", acceptable_formula_codes: ["PERCENTAGE_OF_ACCOUNT"], allowed_approaches: ["SEPARATE_INTEREST"], requires_model_language: true, permits_benefit_not_otherwise_available: false, review_period_days: 45, segregation_period_days: 548, resubmission_window_days: 60, max_revisions: 3, earnings_adjustment_method: "PERIOD_END", max_assignable_pct_bps: 5000, max_assignable_amount_cents: 2000000 }
              as: PlanAdministrator
              captures: { plan_id: $.data.id }
            - call: "POST /plans/${plan_id}/procedure-status"
              payload: { to_status: "PUBLISHED" }
              as: PlanAdministrator
            - call: "POST /participants"
              payload: { plan_id: "${plan_id}", full_name: "Sanne Delacroix", ssn_last4: "3031", date_of_birth: "1973-07-07", participation_start_date: "2010-01-01", employment_status: "ACTIVE", benefit_commenced: false }
              as: PlanAdministrator
              captures: { part_id: $.data.id }
            - call: "POST /participants/${part_id}/plan-accounts"
              payload: { monthly_payment_cents: 0 }
              as: PlanAdministrator
              captures: { acct_id: $.data.id }
            - call: "POST /plan-accounts/${acct_id}/money-sources"
              payload: { source_code: "PRE_TAX_DEFERRAL", balance_cents: 1000000, basis_cents: 0, is_assignable: true }
              as: PlanAdministrator
            - call: "POST /plan-accounts/${acct_id}/valuation-snapshots"
              payload: { as_of_date: "2026-06-30", balance_cents: 1000000, source: "TRUSTEE_STATEMENT" }
              as: PlanAdministrator
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlanAdministrator
            - call: "POST /qdro-cases"
              payload: { participant_id: "${part_id}", alternate_payee_name: "Yves Delacroix", valuation_date: "2026-06-30", marital_period_start: "2012-03-01", marital_period_end: "2026-02-01", alternate_payee_dob: "1975-03-03", alternate_payee_address_on_file: true }
              as: QdroAnalyst
              captures: { case_id: $.data.id, case_v: $.data.version }
            - call: "POST /draft-orders"
              payload: { qdro_case_id: "${case_id}", expected_case_version: "${case_v}", document_reference: "DRO-2663-B1", uses_model_language: false, proposed_approach: "SEPARATE_INTEREST", proposed_formula_code: "PERCENTAGE_OF_ACCOUNT", proposed_percentage_bps: 4000, provisions: [] }
              as: QdroAnalyst
              captures: { draft_id: $.data.id }
            - call: "GET /segregation-holds"
              payload: { qdro_case_id: "${case_id}" }
              as: PlanAdministrator
              captures: { hold_id: "$.data[0].id", hold_expires: "$.data[0].expires_at" }
            - call: "POST /draft-orders/${draft_id}/deficiency-notices"
              payload: { reviewer_notes: "notice at the window opening" }
              as: QdroAnalyst
              as_user_id: "u-9001"
              captures: { deadline: $.data.resubmission_deadline_at }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-10-31T00:00:00Z" }
              as: PlanAdministrator
            - call: "POST /draft-orders/${draft_id}/resubmit"
              payload: { document_reference: "DRO-2663-B1-rev2", uses_model_language: false, proposed_approach: "SEPARATE_INTEREST", proposed_formula_code: "PERCENTAGE_OF_ACCOUNT", proposed_percentage_bps: 4000, provisions: [] }
              as: PlanAdministrator
              captures: { on_deadline_status: $.data.status, on_deadline_rev: $.data.revision_number }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2028-03-02T00:00:00Z" }
              as: PlanAdministrator
            - call: "POST /_ops/run-segregation-sweep"
              payload: {}
              as: PlanAdministrator
              captures: { at_boundary_count: $.data.evaluated_count }
            - call: "GET /segregation-holds/${hold_id}"
              payload: {}
              as: PlanAdministrator
              captures: { status_at_boundary: $.data.status }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2028-03-02T00:00:01Z" }
              as: PlanAdministrator
            - call: "POST /_ops/run-segregation-sweep"
              payload: {}
              as: PlanAdministrator
              captures: { past_boundary_count: $.data.evaluated_count }
            - call: "GET /segregation-holds/${hold_id}"
              payload: {}
              as: PlanAdministrator
              captures: { status_past_boundary: $.data.status }
          assert:
            - "${hold_expires} == \"2028-03-02T00:00:00Z\" and ${deadline} == \"2026-10-31T00:00:00Z\"."
            - "${on_deadline_status} == \"UNDER_REVIEW\" and ${on_deadline_rev} == 2 — a resubmission at exactly the deadline instant is accepted, because priority 55 compares clock <= resubmission_deadline_at."
            - "${at_boundary_count} == 0, and the same sweep response has expired_hold_ids == [], lapsed_case_ids == [], denied_draft_order_ids == [], expired_notice_ids == [] and closed_ap_account_ids == []."
            - "${status_at_boundary} == \"HELD\" — at exactly expires_at the hold survives; GET /plan-accounts/${acct_id} still reports held_amount_cents == 400000 and available_balance_cents == 600000, and GET /qdro-cases/${case_id} still reports segregation_status == \"HELD\"."
            - "${past_boundary_count} == 1 with expired_hold_ids == [\"${hold_id}\"] — one second later the strict `>` predicate is satisfied."
            - "${status_past_boundary} == \"EXPIRED\"; GET /qdro-cases/${case_id} reports segregation_status == \"LAPSED\" and review_status == \"DENIED\", and GET /draft-orders/${draft_id} reports denial_reason == \"SEGREGATION_LAPSED\"."
            - "GET /plan-accounts/${acct_id} finally reports held_amount_cents == 0 and available_balance_cents == 1000000."
            - "The resubmission at 2026-10-31T00:00:00Z did NOT move ${hold_expires}: GET /segregation-holds/${hold_id} still reports placed_at \"2026-09-01T00:00:00Z\" — the 548-day clock runs from first receipt only."

      - name: withholding_triggers_at_exactly_twenty_thousand_taxable_cents
        grounds:
          - calculations.distribution_settlement
          - entities.Distribution.fields.federal_withheld_cents
          - entities.Distribution.fields.net_amount_cents
        distinguishing_aspect: |
          WITHHOLDING_TAXABLE_FLOOR_CENTS is 20000 and the comparison is `taxable_amount_cents >=
          20000`, so on a zero-basis account a CASH gross of 20000 withholds 4000 while a CASH gross of
          19999 withholds nothing. The observable consequence inverts the ordering of the two payments:
          the LARGER gross nets 13500 while the SMALLER gross nets 17499, because the fee tier is the
          same 2500 in both cases and only the withholding differs. The threshold is on the taxable
          amount and not on the gross, which is why a zero-basis account is the only clean probe — with
          basis present, a gross of 20000 would fall below the floor.
        test_recipe:
          setup:
            - "A PUBLISHED PERIOD_END plan (max_assignable_pct_bps 5000, max_assignable_amount_cents 2000000)."
