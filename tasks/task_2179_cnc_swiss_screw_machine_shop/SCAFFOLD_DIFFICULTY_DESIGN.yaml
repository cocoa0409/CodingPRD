  - name: tool_assignment_offset_hold_index_cycle
    grounds:
    - state_machines.ToolAssignment.IN_SERVICE_to_OFFSET_HOLD
    - state_machines.ToolAssignment.OFFSET_HOLD_to_IN_SERVICE
    - state_machines.Machine.DOWN_to_AVAILABLE
    - calculations.tool_wear_state
    distinguishing_aspect: |
      ToolAssignment is a cycle on a different entity from WorkOrder: IN_SERVICE -> OFFSET_HOLD -> IN_SERVICE, and the return edge zeroes pieces_since_index, cumulative_drift_um and offset_log_count while leaving the Machine DOWN until a separate restore call.
    test_recipe:
      setup:
      - Logical clock at 2026-09-01T00:00:00Z.
      - Machine SW-01 is AVAILABLE with no work order scheduled on it.
      - Tool station 5 is IN_SERVICE with cumulative_drift_um 3 and pieces_since_index 40 after one offset log.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-09-01T00:00:00Z'
        as: ShopPlanner
        as_user_id: planner-1
      - call: POST /swiss-shop/operators
        payload:
          name: Rey Molina
          badge_code: BM-01
          certifications:
          - SWISS_SETUP
          - LIGHTS_OUT
        as: ShopPlanner
        as_user_id: planner-1
        captures:
          op_mach: $.data.id
      - call: POST /swiss-shop/machines
        payload:
          asset_tag: SW-01
          max_bar_diameter_mm: 20.0
          lights_out_certified: true
        as: ShopPlanner
        as_user_id: planner-1
        captures:
          mach: $.data.id
      - call: POST /swiss-shop/tool-assignments
        payload:
          machine_id: ${mach}
          station: 5
          tool_code: T05-OD
          expected_life_pieces: 1500
          drift_limit_um: 8
        as: ShopPlanner
        as_user_id: planner-1
        captures:
          tool: $.data.id
      - call: POST /swiss-shop/tool-assignments/${tool}/offset-logs
        payload:
          pieces_produced: 40
          measured_drift_um: 3
        as: Machinist
        as_user_id: ${op_mach}
      trigger:
      - call: POST /swiss-shop/tool-assignments/${tool}/offset-logs
        payload:
          pieces_produced: 40
          measured_drift_um: 5
        as: Machinist
        as_user_id: ${op_mach}
        captures:
          hold_status: $.data.status
          cum: $.data.cumulative_drift_um
      - call: POST /swiss-shop/tool-assignments/${tool}/index
        payload:
          new_tool_code: T05-OD-B
        as: Machinist
        as_user_id: ${op_mach}
        captures:
          idx_status: $.data.status
          idx_pieces: $.data.pieces_since_index
          idx_drift: $.data.cumulative_drift_um
          idx_logs: $.data.offset_log_count
      - call: GET /swiss-shop/machines/${mach}
        payload: {}
        as: Machinist
        as_user_id: ${op_mach}
        captures:
          m_mid: $.data.status
      - call: POST /swiss-shop/machines/${mach}/restore
        payload: {}
        as: Machinist
        as_user_id: ${op_mach}
        captures:
          m_end: $.data.status
      assert:
      - ${hold_status} == OFFSET_HOLD
      - ${cum} == 8
      - ${idx_status} == IN_SERVICE
      - ${idx_pieces} == 0
      - ${idx_drift} == 0
      - ${idx_logs} == 0
      - ToolAssignment.${tool}.tool_code == T05-OD-B
      - ${m_mid} == DOWN
      - ${m_end} == AVAILABLE
