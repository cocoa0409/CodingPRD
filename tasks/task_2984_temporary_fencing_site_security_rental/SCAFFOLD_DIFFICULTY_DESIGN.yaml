  - rule_id: transitive_cascade
    instances:

      - name: install_completion_five_hop_cascade
        grounds:
          - state_machines.WorkOrder.SCHEDULED_to_COMPLETED_install
          - state_machines.RentalContract.PENDING_MOBILIZATION_to_ACTIVE
          - state_machines.RentalContract.billing_NOT_BILLED_to_CURRENT
          - calculations.invoice_total_rollup
          - calculations.account_exposure
          - validations.priority_25_ERR_ACCOUNT_CREDIT_HOLD
        distinguishing_aspect: |
          One POST /work-orders/{id}/complete must propagate five hops inside the
          same request: (1) 50 panels move reserved_count -> deployed_count, (2) the
          contract goes PENDING_MOBILIZATION -> ACTIVE with billing_anchor_utc
          2026-08-20T00:00:00Z, (3) a MOBILIZATION invoice appears with three lines
          totalling 78500 / tax 6987 / total 85487 due 2026-09-19T00:00:00Z, (4) the
          account's open_balance_cents becomes exactly 85487, and (5) because the
          credit_limit_cents is 85486 the credit_hold_flag flips true. Hop 5 is
          observable only through a later call: dispatching the already-PLANNED
          relocation order now returns ERR_ACCOUNT_CREDIT_HOLD 402. An
          implementation that stops at hop 3 or 4 dispatches the relocation happily.
        test_recipe:
          setup:
            - "Logical clock 2026-08-01, advanced to 2026-08-20T00:00:00Z before dispatch."
            - "Municipality HRB-01, rental_tax_rate_bp 890."
            - "CustomerAccount credit_limit_cents 85486 — exactly one cent below the mobilization invoice total."
            - "PANEL-CL-10 owned_count 400, panel_length_ft 10; no other product is used."
            - "Jobsite SOIL, phase_count 4, requires_sidewalk_closure false so no permit gating applies."
            - "CONSTRUCTION quote 500 ft, NONE screen, term 3, no add-ons -> monthly 27000, install_labor 47500, one_time 78500, panel_unit_count 50."
