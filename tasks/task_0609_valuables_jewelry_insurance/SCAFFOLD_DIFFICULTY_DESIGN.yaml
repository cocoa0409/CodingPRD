  # =========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      # --- state (5) vs business_referential (11) on claim file ---
      - name: claim_file_state_beats_policy_not_active
        grounds:
          - validations[priority=5]
          - validations[priority=11]
          - state_machines.Policy.QUOTED_to_BOUND
        distinguishing_aspect: |
          Filing a claim against a QUOTED (never-bound) policy violates both existence-of-ACTIVE-coverage
          (priority 11, ERR_POLICY_NOT_ACTIVE) and is not a billable state; the higher-priority state/
          referential gate returns ERR_POLICY_NOT_ACTIVE — pairing category state(5) vs business_referential(11).
        test_recipe:
          setup:
            - "A QUOTED policy (never bound) with one RING."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: Underwriter
            - call: "POST /risk-zones"
              payload: { zip_prefix: "100", risk_band: "MODERATE", rate_per_thousand_cents: 300 }
              as: Underwriter
            - call: "POST /policyholders"
              payload: { email: "q@x.com", full_name: "Q H", residence_zip: "10001" }
              as: Underwriter
              captures: { ph_q: $.data.id }
            - call: "POST /policies"
              payload: { policyholder_id: "${ph_q}", coverage_type: "ALL_RISK", valuation_basis: "AGREED_VALUE", deductible_option: "STANDARD" }
              as: Underwriter
              captures: { pol_q: $.data.id }
            - call: "POST /policies/${pol_q}/scheduled-items"
              payload: { description: "Ring", category: "RING", location_zip: "10001", scheduled_value_cents: 1000000 }
              as: Underwriter
              captures: { it_q: $.data.id }
          trigger:
            - call: "POST /policies/${pol_q}/claims"
              payload: { scheduled_item_id: "${it_q}", peril: "THEFT", loss_type: "TOTAL_LOSS", claimed_amount_cents: 1000000 }
              as: ClaimsAdjuster
              captures: { err: $.data.error_id }
          assert:
            - "trigger response data.error_id == ERR_POLICY_NOT_ACTIVE"
            - "trigger response status == 409"

      # --- business_referential (8 appraisal) vs business_constraint (9 named-peril) on bind ---
      - name: bind_appraisal_required_beats_named_peril_perils
        grounds:
          - validations[priority=8]
          - validations[priority=9]
          - state_machines.Policy.QUOTED_to_BOUND
        distinguishing_aspect: |
          A NAMED_PERIL policy with empty listed_perils AND a 2,000,000 item lacking a VALID appraisal
          violates both priority 8 (ERR_APPRAISAL_REQUIRED) and priority 9 (ERR_NAMED_PERIL_REQUIRES_PERILS);
          the lower-numbered priority 8 wins -> ERR_APPRAISAL_REQUIRED. Pairing business_referential(8) vs
          business_constraint(9), a different category pair than instance 1.
        test_recipe:
          setup:
            - "A QUOTED NAMED_PERIL policy with empty listed_perils and a RING scheduled 2,000,000 (above appraisal threshold) with NO appraisal_id."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: Underwriter
            - call: "POST /risk-zones"
              payload: { zip_prefix: "100", risk_band: "MODERATE", rate_per_thousand_cents: 300 }
              as: Underwriter
            - call: "POST /policyholders"
              payload: { email: "np@x.com", full_name: "Np H", residence_zip: "10001" }
              as: Underwriter
              captures: { ph_np: $.data.id }
            - call: "POST /policies"
              payload: { policyholder_id: "${ph_np}", coverage_type: "NAMED_PERIL", valuation_basis: "AGREED_VALUE", deductible_option: "STANDARD", listed_perils: [] }
              as: Underwriter
              captures: { pol_np: $.data.id }
            - call: "POST /policies/${pol_np}/scheduled-items"
              payload: { description: "Big ring", category: "RING", location_zip: "10001", scheduled_value_cents: 2000000 }
              as: Underwriter
              captures: { it_np: $.data.id }
          trigger:
            - call: "POST /policies/${pol_np}/bind"
              payload: {}
              as: Underwriter
              captures: { err: $.data.error_id }
          assert:
            - "trigger response data.error_id == ERR_APPRAISAL_REQUIRED"
            - "trigger response status == 409"

  # =========================================================================
  - rule_id: boundary_precision_check
    instances:
      # --- strict '>' threshold on appraisal-required value, via bind endpoint ---
      - name: appraisal_threshold_strict_greater_than
        grounds:
          - calculations.deductible_resolution
          - validations[priority=8]
          - entities.ScheduledItem.fields.scheduled_value_cents
        distinguishing_aspect: |
          An item scheduled at exactly 1,000,000 (== APPRAISAL_REQUIRED_THRESHOLD_CENTS) binds WITHOUT
          an appraisal (strict '>' means 1,000,000 does not require one); the boundary metric is the
          item value crossing on POST .../bind.
        test_recipe:
          setup:
            - "QUOTED ALL_RISK policy with one RING scheduled exactly 1,000,000 and NO appraisal_id."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
