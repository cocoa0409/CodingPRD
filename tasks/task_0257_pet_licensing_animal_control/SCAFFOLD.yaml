    input: [vaccination_record_id]
    output: License
    side_effects: ["set vaccination_record_id"]

  - method: POST
    path: "/licenses/{id}/approve"
    description: "Approve (UNDER_REVIEW→APPROVED); stamps final_fee_cents"
    roles: [LicensingClerk]
