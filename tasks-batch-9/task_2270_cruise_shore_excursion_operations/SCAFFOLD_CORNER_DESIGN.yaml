        excluded_because:
          difficulty_instance: combinatorial_formula / statement_waterfall_pins_fee_on_gross_and_selects_the_rebate_tier_once
          rationale: "The nine-step waterfall, the fee-on-gross ordering and the single rebate-tier selection are asserted by the named §1.8 instance."

      - name: the_service_fee_rounds_half_up_on_an_exact_half_cent
        claim_type: precision
        grounds:
          - calculations.booking_price_quote.constants.SERVICE_FEE_BPS
          - entities.Booking.fields.service_fee_cents
        excluded_because:
          difficulty_instance: boundary_precision_check / booking_service_fee_rounds_half_up_at_an_exact_half_cent
          rationale: "The exact .5 fee case and its half-up resolution are asserted by the named §1.8 instance."

      - name: meeting_point_windows_are_half_open_with_an_aggregate_ceiling
        claim_type: interval_overlap
        grounds:
          - calculations.meeting_point_occupancy
          - validations[39].ERR_MEETING_POINT_CONGESTED
        excluded_because:
          difficulty_instance: resource_temporal_overlap / meeting_point_windows_are_half_open_with_an_end_side_buffer_and_an_aggregate_group_ceiling
          rationale: "Touching windows, the end-side buffer and the aggregate peak test are all asserted by the named §1.8 instance."

      - name: the_four_axis_quote_blend_saturates_at_the_discount_cap
        claim_type: multi_input_combination
        grounds:
          - calculations.booking_price_quote.constants.DISCOUNT_CAP_BPS
          - entities.Booking.fields.per_guest_price_cents
        excluded_because:
