          trigger:
            - call: "POST /eqp/mandatory-offers"
              payload: { insurer_id: "${ins_id}", policyholder_id: "${ph_a}", dwelling_id: "00000000-0000-4000-8000-000000000000" }
              as: ParticipatingInsurer
              as_user_id: "${ins_id}"
              captures: { nf_err: $.data.error_id }
            - call: "POST /eqp/mandatory-offers"
              payload: { insurer_id: "${ins_id}", policyholder_id: "${ph_a}", dwelling_id: "${dw_b}" }
              as: ParticipatingInsurer
              as_user_id: "${ins_id}"
              captures: { mm_err: $.data.error_id }
            - call: "POST /eqp/mandatory-offers"
