  # ---------------------------------------------------------------------------
  # Endpoints (envelope / response-shape claims)
  # ---------------------------------------------------------------------------
  - section: endpoints
    instances:
      - name: envelope_success_shape_object
        claim_type: standard_crud
        grounds: [response_envelope]
        distinguishing_aspect: "A successful create wraps data in the fixed envelope with meta.api_request_id and response_type object."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /ppc/communities", payload: { name: "Envelope", state_code: "TX", population: 4000, area_sq_miles: 40, rural_area_pct: 20, dept_type: "CAREER", needed_fire_flow_gpm: 1000, storage_capacity_gal: 0, supply_works_capacity_gpm: 500, daily_consumption_gpm: 100 }, as: EvaluationCoordinator, captures: { c_id: $.data.id } }
          assert:
            - "response has meta.api_request_id, meta.api_request_timestamp, response_type == object, and data.id present"

      - name: envelope_error_shape_on_404
        claim_type: standard_crud
        grounds: [response_envelope]
        distinguishing_aspect: "An error response carries response_type error and data.error_id / data.message."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "GET /ppc/communities/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", as: EvaluationCoordinator, captures: { err: $.data.error_id } }
          assert:
            - "response_type == error with data.error_id == ERR_COMMUNITY_NOT_FOUND and data.message present"

      - name: list_envelope_pagination_defaults
        claim_type: listing
        grounds: [response_envelope]
        distinguishing_aspect: "A list call with no pagination params applies the defaults limit 10 / offset 0."
        test_recipe:
