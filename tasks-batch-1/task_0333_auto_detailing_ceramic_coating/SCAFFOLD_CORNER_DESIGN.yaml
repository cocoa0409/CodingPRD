              payload: { email: "cr1@x.com", full_name: "Cr One" }
              as: Scheduler
              captures: { cust_id: $.data.id }
            - call: "POST /detailing/mobile-units"
              payload: { unit_code: "CR1", travel_buffer_minutes: 30 }
              as: Scheduler
              captures: { unit_id: $.data.id }
            - call: "POST /detailing/appointments"
              payload: { customer_id: "${cust_id}", tier: "FULL", vehicle_size: "SEDAN", location_mode: "MOBILE", scheduled_start_utc: "2026-06-15T09:00:00Z", mobile_unit_id: "${unit_id}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { appt_id: $.data.id }
            - call: "POST /detailing/appointments/${appt_id}/check-in"
              payload: {}
              as: Detailer
            - call: "POST /detailing/appointments/${appt_id}/photos"
              payload: { phase: "BEFORE", image_url: "s3://b.jpg" }
              as: Detailer
            - call: "POST /detailing/appointments/${appt_id}/start-prep"
              payload: {}
              as: Detailer
            - call: "POST /detailing/appointments/${appt_id}/start-service"
              payload: {}
              as: Detailer
            - call: "POST /detailing/appointments/${appt_id}/photos"
              payload: { phase: "AFTER", image_url: "s3://a.jpg" }
              as: Detailer
            - call: "POST /detailing/appointments/${appt_id}/finish-service"
              payload: {}
              as: Detailer
            - call: "POST /detailing/appointments/${appt_id}/pay"
              payload: { amount_cents: 12000 }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /detailing/appointments/${appt_id}/release"
              payload: {}
              as: Detailer
          trigger:
            - call: "POST /detailing/appointments/${appt_id}/refund"
              payload: {}
              as: ShopManager
          assert:
            - "Customer.${cust_id}.chronological_lifetime_spend_cents == 0"
            - "Customer.${cust_id}.loyalty_tier == BRONZE"

      - name: renew_expires_unconsumed_credit_then_grants_new
        claim_type: rate_threshold_triggers
        grounds:
          - calculations.membership_credit_ledger
          - state_machines.Membership.ACTIVE_to_ACTIVE
          - entities.Membership.fields.credits_expired_total
        distinguishing_aspect: "Renewing with an unconsumed prior-cycle credit expires it (credits_expired_total 1) and grants a fresh one (credits_remaining 1), keeping the conservation identity."
        test_recipe:
          setup:
            - "ACTIVE membership activated 2026-06-01 (1 credit, unconsumed); clock to 2026-07-01."
          setup_api_calls:
            - call: "POST /detailing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: Scheduler
            - call: "POST /detailing/packages"
              payload: { tier: "WASH", base_price_cents: 4000, prep_minutes: 10, service_minutes: 30, cure_minutes: 0, guarantee_days: 0 }
              as: Scheduler
            - call: "POST /detailing/vehicle-size-rates"
              payload: { vehicle_size: "SEDAN", size_multiplier_bps: 10000 }
              as: Scheduler
            - call: "POST /detailing/customers"
              payload: { email: "rn1@x.com", full_name: "Rn One" }
              as: Scheduler
              captures: { cust_id: $.data.id }
            - call: "POST /detailing/memberships"
              payload: { customer_id: "${cust_id}", default_vehicle_size: "SEDAN" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { mem_id: $.data.id }
            - call: "POST /detailing/memberships/${mem_id}/activate"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /detailing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: Scheduler
          trigger:
            - call: "POST /detailing/memberships/${mem_id}/renew"
              payload: {}
              as: Scheduler
          assert:
            - "Membership.${mem_id}.credits_granted_total == 2"
            - "Membership.${mem_id}.credits_expired_total == 1"
            - "Membership.${mem_id}.credits_remaining == 1"

  # ===================================================================
  # Consistency Model
  # ===================================================================
  - section: consistency_model
    instances:
      - name: immediate_consistency_provisional_total_visible_in_create_response
        claim_type: immediate
        grounds:
          - calculations.appointment_total
          - entities.Appointment.fields.provisional_total_cents
        distinguishing_aspect: "POST /detailing/appointments returns provisional_total_cents and occupancy fields in the SAME response (immediate consistency), no re-read needed."
        excluded_because:
          difficulty_instance: combinatorial_formula / appointment_total_nonlinear_tier_size_discount_addon_interaction
          rationale: "The combinatorial-formula instance asserts provisional_total_cents directly from a create/add-on response."
