        distinguishing_aspect: "One sweep over all twelve single-row GET routes with a syntactically valid but unknown UUID. Each route must name ITS OWN entity in the error_id — a shared generic 404 would satisfy none of them — and a list route with no matching rows must still return 200 with an empty page rather than a 404."
