# ============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# ----------------------------------------------------------------------------
# Companion file to SCAFFOLD.yaml. Every instance grounds in §1.1–§1.7 of the
# sibling SCAFFOLD.yaml. ≥2 instances per Difficulty Rule (≥18 total).
# ============================================================================
scaffold_difficulty_design:

  # --------------------------------------------------------------------------
  # Rule 1 — Dual-variant calculations across different entity domains
  # --------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:

      - name: aid_offer_federal_vs_institutional_divergence
        grounds:
          - calculations.demonstrated_need_calc
          - entities.AidOffer.fields.variant
          - entities.AidOffer.fields.demonstrated_need_cents
          - entities.FinancialAidProfile.fields.fafsa_efc_cents
          - entities.FinancialAidProfile.fields.css_efc_cents
          - entities.School.fields.requires_css_profile
        distinguishing_aspect: |
          Same Applicant + School + COA produces different demonstrated_need_cents under
          variant=FEDERAL (uses fafsa_efc_cents) vs variant=INSTITUTIONAL (uses css_efc_cents).
          Operates on the AidOffer entity domain — distinct from the Application-domain dual
          variant in applicant_admission_probability_score.
        test_recipe:
          setup:
            - "School S exists with requires_css_profile=true, target_class_size=10, all deadlines well in the future"
            - "Applicant A exists with full profile (gpa=3.8, sat=1500) and FinancialAidProfile with fafsa_efc_cents=2_000_000, css_efc_cents=3_500_000, status=SUBMITTED"
            - "Application of A at S is in ADMITTED status (submitted, reviewed, admitted)"
            - "Server clock is well before any deadlines"
          setup_api_calls:
            - call: "POST /schools"
              payload: { name: "Stanford-DV", target_class_size: 10, ed_deadline_iso: "2030-11-01T00:00:00Z", ea_deadline_iso: "2030-11-15T00:00:00Z", rd_deadline_iso: "2031-01-01T00:00:00Z", rolling_open: false, requires_css_profile: true, cooldown_ms: 86400000 }
              as: PlatformAdmin
              captures: { school_id: $.data.id }
            - call: "POST /_clock/advance"
              payload: { to_iso8601: "2030-10-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /applicants/register"
              payload: { email: "dv1@x.com", full_name: "DV One", gpa: 3.8, sat_total: 1500 }
              as: Anonymous
              captures: { applicant_id: $.data.id }
            - call: "POST /recommenders"
              payload: { applicant_id: "${applicant_id}", email: "r1@x.com", full_name: "Rec One", relationship: "TEACHER" }
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { rec_id: $.data.id }
            - call: "POST /recommenders/${rec_id}/accept"
              payload: {}
              as: Anonymous
            - call: "POST /applications"
              payload: { applicant_id: "${applicant_id}", school_id: "${school_id}", plan: "REGULAR" }
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { app_id: $.data.id }
            - call: "POST /essay-submissions"
              payload: { application_id: "${app_id}", prompt_code: "P1", body: "essay body words " }
              as: Applicant
              as_user_id: "${applicant_id}"
            - call: "POST /recommendation-letters"
              payload: { application_id: "${app_id}", recommender_id: "${rec_id}" }
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { letter_id: $.data.id }
            - call: "POST /recommendation-letters/${letter_id}/start"
              payload: {}
              as: Recommender
              as_user_id: "${rec_id}"
            - call: "POST /recommendation-letters/${letter_id}/submit"
              payload: { body: "This applicant is exceptional in every domain we tested and demonstrates extraordinary mathematical talent worthy of the most selective program offered at the institution today." }
              as: Recommender
              as_user_id: "${rec_id}"
            - call: "POST /applications/${app_id}/submit"
              payload: {}
              as: Applicant
              as_user_id: "${applicant_id}"
            - call: "POST /applications/${app_id}/start-review"
              payload: {}
              as: AdmissionsOfficer
              captures: { v_review: $.data.version }
            - call: "POST /applications/${app_id}/decide"
              payload: { decision: "ADMIT", expected_application_version: "${v_review}" }
              as: AdmissionsOfficer
              captures: { v_admitted: $.data.version }
            - call: "POST /financial-aid-profiles"
              payload: { applicant_id: "${applicant_id}", fafsa_efc_cents: 2000000, css_efc_cents: 3500000, family_income_cents: 8000000 }
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { fap_id: $.data.id }
            - call: "POST /financial-aid-profiles/${fap_id}/submit"
              payload: {}
              as: Applicant
              as_user_id: "${applicant_id}"
          trigger:
            - call: "POST /aid-offers"
              payload: { application_id: "${app_id}", cost_of_attendance_cents: 8000000, variant: "FEDERAL", grant_cents: 0, loan_cents: 0, work_study_cents: 0, expected_application_version: "${v_admitted}" }
              as: FinancialAidOfficer
              captures: { fed_offer_id: $.data.id, fed_need: $.data.demonstrated_need_cents }
          assert:
            - "AidOffer.${fed_offer_id}.demonstrated_need_cents == 6000000"
            - "AidOffer.${fed_offer_id}.variant == 'FEDERAL'"
            - "AidOffer.${fed_offer_id}.net_price_cents == 8000000"
            - "An identical AidOffer with variant=INSTITUTIONAL on the same Application would yield demonstrated_need_cents == 4500000 (= 8000000 - 3500000), strictly less than the FEDERAL result 6000000."

      - name: admission_probability_provisional_vs_final_divergence
        grounds:
          - calculations.applicant_admission_probability_score
          - entities.Application.fields.admission_probability_score
          - entities.RecommendationLetter.fields.status
          - state_machines.Application.transitions.SUBMITTED_to_UNDER_REVIEW
        distinguishing_aspect: |
          Same Applicant + Application reads two different integer scores depending on
          ?score_variant=PROVISIONAL (counts REQUESTED+IN_PROGRESS+SUBMITTED letters) vs
          FINAL (counts SUBMITTED only). Operates on Application domain — distinct entity
          from the AidOffer-domain variant above.
        test_recipe:
          setup:
            - "Applicant with gpa=3.8 (gpa_component=38), sat=1500 (sat_component=27)"
            - "Application in SUBMITTED status with plan=REGULAR (plan_bonus=0)"
            - "Two RecommendationLetters: one SUBMITTED, one REQUESTED (not yet started)"
          setup_api_calls:
            - call: "POST /schools"
              payload: { name: "Yale-AP", target_class_size: 5, ed_deadline_iso: "2030-11-01T00:00:00Z", ea_deadline_iso: "2030-11-15T00:00:00Z", rd_deadline_iso: "2031-01-01T00:00:00Z", rolling_open: false, requires_css_profile: false, cooldown_ms: 86400000 }
              as: PlatformAdmin
              captures: { school_id: $.data.id }
            - call: "POST /_clock/advance"
              payload: { to_iso8601: "2030-10-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /applicants/register"
              payload: { email: "ap1@x.com", full_name: "AP One", gpa: 3.8, sat_total: 1500 }
              as: Anonymous
              captures: { applicant_id: $.data.id }
            - call: "POST /recommenders"
              payload: { applicant_id: "${applicant_id}", email: "rec_a@x.com", full_name: "Rec A", relationship: "TEACHER" }
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { rec_a: $.data.id }
            - call: "POST /recommenders/${rec_a}/accept"
              payload: {}
              as: Anonymous
            - call: "POST /recommenders"
              payload: { applicant_id: "${applicant_id}", email: "rec_b@x.com", full_name: "Rec B", relationship: "COUNSELOR" }
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { rec_b: $.data.id }
            - call: "POST /recommenders/${rec_b}/accept"
              payload: {}
              as: Anonymous
            - call: "POST /applications"
              payload: { applicant_id: "${applicant_id}", school_id: "${school_id}", plan: "REGULAR" }
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { app_id: $.data.id }
            - call: "POST /essay-submissions"
              payload: { application_id: "${app_id}", prompt_code: "P1", body: "essay text words for app" }
              as: Applicant
              as_user_id: "${applicant_id}"
            - call: "POST /recommendation-letters"
              payload: { application_id: "${app_id}", recommender_id: "${rec_a}" }
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { letter_a: $.data.id }
            - call: "POST /recommendation-letters"
              payload: { application_id: "${app_id}", recommender_id: "${rec_b}" }
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { letter_b: $.data.id }
            - call: "POST /recommendation-letters/${letter_a}/start"
              payload: {}
              as: Recommender
              as_user_id: "${rec_a}"
            - call: "POST /recommendation-letters/${letter_a}/submit"
              payload: { body: "Recommendation letter body that exceeds two hundred characters of text by including a long-form discussion of the applicant's character qualities and academic achievements." }
              as: Recommender
              as_user_id: "${rec_a}"
            - call: "POST /applications/${app_id}/submit"
              payload: {}
              as: Applicant
              as_user_id: "${applicant_id}"
          trigger:
            - call: "GET /applications/${app_id}?score_variant=PROVISIONAL"
              payload: {}
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { prov_score: $.data.admission_probability_score }
            - call: "GET /applications/${app_id}?score_variant=FINAL"
              payload: {}
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { final_score: $.data.admission_probability_score }
          assert:
            - "Application.${app_id}.admission_probability_score (PROVISIONAL) == 75   # 38 + 27 + 0 + min(15, 5*2)=10 = 75"
            - "Application.${app_id}.admission_probability_score (FINAL) == 70         # 38 + 27 + 0 + min(15, 5*1)=5  = 70"
            - "PROVISIONAL strictly greater than FINAL because REQUESTED letter counts under PROVISIONAL only"

  # --------------------------------------------------------------------------
  # Rule 2 — Combinatorial formulas across different modes
  # --------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:

      - name: admission_score_per_component_rounding_order_pinned
        grounds:
          - calculations.applicant_admission_probability_score
          - entities.Applicant.fields.gpa
          - entities.Applicant.fields.sat_total
        distinguishing_aspect: |
          Mode (b) — nested rounding where order matters. The scaffold pins per-component
          round_half_up INSIDE min(...) and forbids deferring rounding to the final sum.
          gpa=3.85 → gpa_real=38.5 → per-component rounds to 39 (then summed as integer);
          a single-final-round implementation would propagate 38.5 into the sum.
        test_recipe:
          setup:
            - "Applicant with gpa=3.85, sat_total=null"
            - "Application in DRAFT, plan=REGULAR, zero letters"
          setup_api_calls:
            - call: "POST /schools"
              payload: { name: "MIT-RD", target_class_size: 5, ed_deadline_iso: "2030-11-01T00:00:00Z", ea_deadline_iso: "2030-11-15T00:00:00Z", rd_deadline_iso: "2031-01-01T00:00:00Z", rolling_open: false, requires_css_profile: false, cooldown_ms: 86400000 }
              as: PlatformAdmin
              captures: { school_id: $.data.id }
            - call: "POST /_clock/advance"
              payload: { to_iso8601: "2030-10-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /applicants/register"
              payload: { email: "rd_round@x.com", full_name: "Round Test", gpa: 3.85, sat_total: null }
              as: Anonymous
              captures: { applicant_id: $.data.id }
            - call: "POST /recommenders"
              payload: { applicant_id: "${applicant_id}", email: "rc@x.com", full_name: "RC", relationship: "TEACHER" }
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { rec_id: $.data.id }
            - call: "POST /applications"
              payload: { applicant_id: "${applicant_id}", school_id: "${school_id}", plan: "REGULAR" }
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { app_id: $.data.id }
          trigger:
            - call: "GET /applications/${app_id}?score_variant=PROVISIONAL"
              payload: {}
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { score: $.data.admission_probability_score }
          assert:
            - "Application.${app_id}.admission_probability_score == 39   # gpa: min(40, round_half_up(38.5))=39; sat:0; plan_bonus:0; letters:0"

      - name: aid_offer_three_input_conditional_branch_with_floor
        grounds:
          - calculations.demonstrated_need_calc
          - entities.AidOffer.fields.cost_of_attendance_cents
          - entities.AidOffer.fields.grant_cents
          - entities.AidOffer.fields.loan_cents
          - entities.AidOffer.fields.work_study_cents
          - entities.AidOffer.fields.variant
          - entities.AidOffer.fields.net_price_cents
        distinguishing_aspect: |
          Mode (a) — formula with ≥3 inputs and non-linear interaction. demonstrated_need_calc
          combines cost_of_attendance_cents, variant-conditional efc selection (FEDERAL vs
          INSTITUTIONAL), three deductible award fields (grant/loan/work_study), and a
          FLOOR_CENTS=0 clamp. Awarding grant+loan+work_study > COA must clamp net_price_cents
          at 0, not produce a negative value.
        test_recipe:
          setup:
            - "School with requires_css_profile=false"
            - "Applicant with FinancialAidProfile submitted (fafsa_efc_cents=1_500_000)"
            - "Application in ADMITTED status"
            - "Sum of grant+loan+work_study deliberately exceeds COA so the floor activates"
          setup_api_calls:
            - call: "POST /schools"
              payload: { name: "Harvard-Floor", target_class_size: 5, ed_deadline_iso: "2030-11-01T00:00:00Z", ea_deadline_iso: "2030-11-15T00:00:00Z", rd_deadline_iso: "2031-01-01T00:00:00Z", rolling_open: false, requires_css_profile: false, cooldown_ms: 86400000 }
              as: PlatformAdmin
              captures: { school_id: $.data.id }
            - call: "POST /_clock/advance"
              payload: { to_iso8601: "2030-10-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /applicants/register"
              payload: { email: "floor@x.com", full_name: "Floor App", gpa: 3.7, sat_total: 1400 }
              as: Anonymous
              captures: { applicant_id: $.data.id }
            - call: "POST /recommenders"
              payload: { applicant_id: "${applicant_id}", email: "fr@x.com", full_name: "FR", relationship: "TEACHER" }
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { rec_id: $.data.id }
            - call: "POST /recommenders/${rec_id}/accept"
              payload: {}
              as: Anonymous
            - call: "POST /applications"
              payload: { applicant_id: "${applicant_id}", school_id: "${school_id}", plan: "REGULAR" }
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { app_id: $.data.id }
            - call: "POST /essay-submissions"
              payload: { application_id: "${app_id}", prompt_code: "P1", body: "short essay body here" }
              as: Applicant
              as_user_id: "${applicant_id}"
            - call: "POST /recommendation-letters"
              payload: { application_id: "${app_id}", recommender_id: "${rec_id}" }
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { letter_id: $.data.id }
            - call: "POST /recommendation-letters/${letter_id}/start"
              payload: {}
              as: Recommender
              as_user_id: "${rec_id}"
            - call: "POST /recommendation-letters/${letter_id}/submit"
              payload: { body: "Reasoned recommendation extending well beyond two hundred characters with substantive evaluation of the applicant's strengths in academic disciplines and personal qualities documented during the teaching relationship." }
              as: Recommender
              as_user_id: "${rec_id}"
            - call: "POST /applications/${app_id}/submit"
              payload: {}
              as: Applicant
              as_user_id: "${applicant_id}"
            - call: "POST /applications/${app_id}/start-review"
              payload: {}
              as: AdmissionsOfficer
              captures: { v_review: $.data.version }
            - call: "POST /applications/${app_id}/decide"
              payload: { decision: "ADMIT", expected_application_version: "${v_review}" }
              as: AdmissionsOfficer
              captures: { v_admitted: $.data.version }
            - call: "POST /financial-aid-profiles"
              payload: { applicant_id: "${applicant_id}", fafsa_efc_cents: 1500000, family_income_cents: 6000000 }
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { fap_id: $.data.id }
            - call: "POST /financial-aid-profiles/${fap_id}/submit"
              payload: {}
              as: Applicant
              as_user_id: "${applicant_id}"
          trigger:
            - call: "POST /aid-offers"
              payload: { application_id: "${app_id}", cost_of_attendance_cents: 7000000, variant: "FEDERAL", grant_cents: 5500000, loan_cents: 1000000, work_study_cents: 1000000, expected_application_version: "${v_admitted}" }
              as: FinancialAidOfficer
              captures: { offer_id: $.data.id, need: $.data.demonstrated_need_cents, net: $.data.net_price_cents }
          assert:
            - "AidOffer.${offer_id}.demonstrated_need_cents == 5500000   # max(0, 7000000 - 1500000)"
            - "AidOffer.${offer_id}.net_price_cents == 0                  # max(0, 7000000 - 5500000 - 1000000 - 1000000) — floor activates"
            - "AidOffer.${offer_id}.grant_cents == 5500000               # equals demonstrated_need_cents exactly (boundary, not over)"

  # --------------------------------------------------------------------------
  # Rule 3 — Non-linear state-machine shape on different entities
  # --------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:

      - name: application_branching_under_review_diverges_admit_vs_defer
        grounds:
          - state_machines.Application.transitions.UNDER_REVIEW_to_ADMITTED
          - state_machines.Application.transitions.UNDER_REVIEW_to_DEFERRED
          - state_machines.Application.transitions.DEFERRED_to_UNDER_REVIEW
          - entities.Application.fields.plan
        distinguishing_aspect: |
          Application has BRANCHING fork-join shape: UNDER_REVIEW forks into {ADMITTED,
          WAITLISTED, DENIED, DEFERRED} with DIVERGENT side effects per branch (DEFER also
          rewrites plan to REGULAR; WAITLIST also computes waitlist_rank). Additionally
          DEFERRED→UNDER_REVIEW is a revision-loop arc unique to the early-plan branch.
          Different entity from the Recommender branching machine.
        test_recipe:
          setup:
            - "School with ed_deadline=2030-11-01 and rd_deadline=2031-01-01"
            - "Applicant with valid profile and one SUBMITTED letter"
            - "Application with plan=EARLY_DECISION submitted before ed_deadline, started review"
            - "Server clock just past ED deadline so DEFERRED→UNDER_REVIEW becomes eligible"
          setup_api_calls:
            - call: "POST /schools"
              payload: { name: "Brown-Branch", target_class_size: 5, ed_deadline_iso: "2030-11-01T00:00:00Z", ea_deadline_iso: "2030-11-15T00:00:00Z", rd_deadline_iso: "2031-01-01T00:00:00Z", rolling_open: false, requires_css_profile: false, cooldown_ms: 86400000 }
              as: PlatformAdmin
              captures: { school_id: $.data.id }
            - call: "POST /_clock/advance"
              payload: { to_iso8601: "2030-10-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /applicants/register"
              payload: { email: "brn@x.com", full_name: "BR", gpa: 3.6, sat_total: 1400 }
              as: Anonymous
              captures: { applicant_id: $.data.id }
            - call: "POST /recommenders"
              payload: { applicant_id: "${applicant_id}", email: "rb@x.com", full_name: "RB", relationship: "TEACHER" }
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { rec_id: $.data.id }
            - call: "POST /recommenders/${rec_id}/accept"
              payload: {}
              as: Anonymous
            - call: "POST /applications"
              payload: { applicant_id: "${applicant_id}", school_id: "${school_id}", plan: "EARLY_DECISION" }
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { app_id: $.data.id }
            - call: "POST /essay-submissions"
              payload: { application_id: "${app_id}", prompt_code: "P1", body: "essay" }
              as: Applicant
              as_user_id: "${applicant_id}"
            - call: "POST /recommendation-letters"
              payload: { application_id: "${app_id}", recommender_id: "${rec_id}" }
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { letter_id: $.data.id }
            - call: "POST /recommendation-letters/${letter_id}/start"
              payload: {}
              as: Recommender
              as_user_id: "${rec_id}"
            - call: "POST /recommendation-letters/${letter_id}/submit"
              payload: { body: "Substantive recommendation body extending past two hundred characters demonstrating real assessment of the applicant's qualifications, character, and academic record over a meaningful period." }
              as: Recommender
              as_user_id: "${rec_id}"
            - call: "POST /applications/${app_id}/submit"
              payload: {}
              as: Applicant
              as_user_id: "${applicant_id}"
            - call: "POST /applications/${app_id}/start-review"
              payload: {}
              as: AdmissionsOfficer
              captures: { v_review: $.data.version }
            - call: "POST /applications/${app_id}/decide"
              payload: { decision: "DEFER", expected_application_version: "${v_review}" }
              as: AdmissionsOfficer
              captures: { v_after_defer: $.data.version, plan_after_defer: $.data.plan, status_after_defer: $.data.status }
            - call: "POST /_clock/advance"
              payload: { to_iso8601: "2030-11-02T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /applications/${app_id}/start-review"
              payload: {}
              as: AdmissionsOfficer
              captures: { status_after_reopen: $.data.status }
          assert:
            - "After DEFER: Application.${app_id}.plan == 'REGULAR' (DEFER branch rewrites plan, distinct from ADMIT branch which does not)"
            - "After DEFER: Application.${app_id}.status == 'DEFERRED'"
            - "After re-open: Application.${app_id}.status == 'UNDER_REVIEW' (revision-loop arc DEFERRED→UNDER_REVIEW)"

      - name: recommender_branching_invited_diverges_accept_vs_decline_with_cascade
        grounds:
          - state_machines.Recommender.transitions.INVITED_to_ACCEPTED
          - state_machines.Recommender.transitions.INVITED_to_DECLINED
          - entities.Recommender.fields.invite_status
          - entities.RecommendationLetter.fields.status
        distinguishing_aspect: |
          Recommender entity has BRANCHING shape with DIVERGENT side effects: INVITED→ACCEPTED
          merely flips invite_status, while INVITED→DECLINED additionally cascade-deletes all
          REQUESTED letters pointing at this Recommender and may flip owning Applicant's
          profile_status back. Different entity (Recommender) from the Application branching
          instance above.
        test_recipe:
          setup:
            - "Applicant with full profile and one Recommender (INVITED) — profile is READY"
            - "One RecommendationLetter (REQUESTED) on a DRAFT Application pointing at that Recommender"
          setup_api_calls:
            - call: "POST /schools"
              payload: { name: "Cornell-Branch", target_class_size: 5, ed_deadline_iso: "2030-11-01T00:00:00Z", ea_deadline_iso: "2030-11-15T00:00:00Z", rd_deadline_iso: "2031-01-01T00:00:00Z", rolling_open: false, requires_css_profile: false, cooldown_ms: 86400000 }
              as: PlatformAdmin
              captures: { school_id: $.data.id }
            - call: "POST /_clock/advance"
              payload: { to_iso8601: "2030-10-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /applicants/register"
              payload: { email: "cor@x.com", full_name: "CR", gpa: 3.5, sat_total: 1300 }
              as: Anonymous
              captures: { applicant_id: $.data.id }
            - call: "POST /recommenders"
              payload: { applicant_id: "${applicant_id}", email: "rc@x.com", full_name: "RC", relationship: "TEACHER" }
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { rec_id: $.data.id }
            - call: "POST /applications"
              payload: { applicant_id: "${applicant_id}", school_id: "${school_id}", plan: "REGULAR" }
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { app_id: $.data.id }
            - call: "POST /recommendation-letters"
              payload: { application_id: "${app_id}", recommender_id: "${rec_id}" }
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { letter_id: $.data.id }
          trigger:
            - call: "POST /recommenders/${rec_id}/decline"
              payload: {}
              as: Anonymous
              captures: { rec_status: $.data.invite_status }
          assert:
            - "Recommender.${rec_id}.invite_status == 'DECLINED' (took the DECLINE branch)"
            - "RecommendationLetter.${letter_id} no longer exists (cascade-deleted because its status was REQUESTED) — GET /recommendation-letters/{letter_id} via implementation surface returns ERR_RESOURCE_NOT_FOUND; the ACCEPT branch would NOT delete it"
            - "Applicant.${applicant_id}.profile_status == 'DRAFT' (re-evaluated; no Recommender rows remain — divergent from ACCEPT branch which leaves profile READY)"

  # --------------------------------------------------------------------------
  # Rule 4 — Transitive cascade chains from different triggers
  # --------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:

      - name: ed_accept_offer_cascade_three_deep
        grounds:
          - state_machines.Application.transitions.ADMITTED_to_ENROLLED
          - state_machines.Application.transitions.WAITLISTED_to_WITHDRAWN
          - entities.Application.fields.waitlist_rank
          - entities.School.fields.confirmed_enrollment_count
        distinguishing_aspect: |
          Depth ≥ 3 cascade triggered by ED accept-offer: (depth 1) Application X ADMITTED→
          ENROLLED; (depth 2) sibling non-terminal Applications of same Applicant auto-
          transition to WITHDRAWN; (depth 3) for any sibling that was WAITLISTED, removal
          itself triggers waitlist_rank recompute on the freed school. Each link is caused by
          the previous link, not by the original trigger.
        test_recipe:
          setup:
            - "Three schools S1, S2, S3 created"
            - "Applicant A with READY profile, one accepted Recommender, one SUBMITTED letter per application"
            - "App1 on S1 plan=EARLY_DECISION in ADMITTED status"
            - "App2 on S2 plan=REGULAR in WAITLISTED status; another Applicant B also has an App on S2 in WAITLISTED so we can observe rank recompute"
            - "App3 on S3 plan=REGULAR in SUBMITTED status (still non-terminal)"
          setup_api_calls:
            - call: "POST /schools"
              payload: { name: "Cascade-S1", target_class_size: 10, ed_deadline_iso: "2030-11-01T00:00:00Z", ea_deadline_iso: "2030-11-15T00:00:00Z", rd_deadline_iso: "2031-01-01T00:00:00Z", rolling_open: false, requires_css_profile: false, cooldown_ms: 86400000 }
              as: PlatformAdmin
              captures: { s1: $.data.id }
            - call: "POST /schools"
              payload: { name: "Cascade-S2", target_class_size: 10, ed_deadline_iso: "2030-11-01T00:00:00Z", ea_deadline_iso: "2030-11-15T00:00:00Z", rd_deadline_iso: "2031-01-01T00:00:00Z", rolling_open: false, requires_css_profile: false, cooldown_ms: 86400000 }
              as: PlatformAdmin
              captures: { s2: $.data.id }
            - call: "POST /schools"
              payload: { name: "Cascade-S3", target_class_size: 10, ed_deadline_iso: "2030-11-01T00:00:00Z", ea_deadline_iso: "2030-11-15T00:00:00Z", rd_deadline_iso: "2031-01-01T00:00:00Z", rolling_open: false, requires_css_profile: false, cooldown_ms: 86400000 }
              as: PlatformAdmin
              captures: { s3: $.data.id }
            - call: "POST /_clock/advance"
              payload: { to_iso8601: "2030-10-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /applicants/register"
              payload: { email: "cas_a@x.com", full_name: "CAS A", gpa: 3.9, sat_total: 1550 }
              as: Anonymous
              captures: { a_id: $.data.id }
            - call: "POST /recommenders"
              payload: { applicant_id: "${a_id}", email: "rca@x.com", full_name: "RCA", relationship: "TEACHER" }
              as: Applicant
              as_user_id: "${a_id}"
              captures: { rec_a: $.data.id }
            - call: "POST /recommenders/${rec_a}/accept"
              payload: {}
              as: Anonymous
            - call: "POST /applicants/register"
              payload: { email: "cas_b@x.com", full_name: "CAS B", gpa: 3.7, sat_total: 1400 }
              as: Anonymous
              captures: { b_id: $.data.id }
            - call: "POST /recommenders"
              payload: { applicant_id: "${b_id}", email: "rcb@x.com", full_name: "RCB", relationship: "TEACHER" }
              as: Applicant
              as_user_id: "${b_id}"
              captures: { rec_b: $.data.id }
            - call: "POST /recommenders/${rec_b}/accept"
              payload: {}
              as: Anonymous
            # App1 — ED on S1, drive to ADMITTED
            - call: "POST /applications"
              payload: { applicant_id: "${a_id}", school_id: "${s1}", plan: "EARLY_DECISION" }
              as: Applicant
              as_user_id: "${a_id}"
              captures: { app1: $.data.id }
            - call: "POST /essay-submissions"
              payload: { application_id: "${app1}", prompt_code: "P1", body: "essay one body" }
              as: Applicant
              as_user_id: "${a_id}"
            - call: "POST /recommendation-letters"
              payload: { application_id: "${app1}", recommender_id: "${rec_a}" }
              as: Applicant
              as_user_id: "${a_id}"
              captures: { l1: $.data.id }
            - call: "POST /recommendation-letters/${l1}/start"
              payload: {}
              as: Recommender
              as_user_id: "${rec_a}"
            - call: "POST /recommendation-letters/${l1}/submit"
              payload: { body: "First substantial recommendation letter content for the ED application, extending well beyond two hundred characters with concrete examples of the applicant's strengths in coursework." }
              as: Recommender
              as_user_id: "${rec_a}"
            - call: "POST /applications/${app1}/submit"
              payload: {}
              as: Applicant
              as_user_id: "${a_id}"
            - call: "POST /applications/${app1}/start-review"
              payload: {}
              as: AdmissionsOfficer
              captures: { v1_review: $.data.version }
            - call: "POST /applications/${app1}/decide"
              payload: { decision: "ADMIT", expected_application_version: "${v1_review}" }
              as: AdmissionsOfficer
              captures: { v1_admitted: $.data.version }
            # App2 — REGULAR on S2, drive to WAITLISTED
            - call: "POST /applications"
              payload: { applicant_id: "${a_id}", school_id: "${s2}", plan: "REGULAR" }
              as: Applicant
              as_user_id: "${a_id}"
              captures: { app2: $.data.id }
            - call: "POST /essay-submissions"
              payload: { application_id: "${app2}", prompt_code: "P2", body: "essay two body" }
              as: Applicant
              as_user_id: "${a_id}"
            - call: "POST /recommendation-letters"
              payload: { application_id: "${app2}", recommender_id: "${rec_a}" }
              as: Applicant
              as_user_id: "${a_id}"
              captures: { l2: $.data.id }
            - call: "POST /recommendation-letters/${l2}/start"
              payload: {}
              as: Recommender
              as_user_id: "${rec_a}"
            - call: "POST /recommendation-letters/${l2}/submit"
              payload: { body: "Second substantial recommendation letter content for the REGULAR application at school two, more than two hundred characters describing the applicant's strengths in detail and substance." }
              as: Recommender
              as_user_id: "${rec_a}"
            - call: "POST /applications/${app2}/submit"
              payload: {}
              as: Applicant
              as_user_id: "${a_id}"
            - call: "POST /applications/${app2}/start-review"
              payload: {}
              as: AdmissionsOfficer
              captures: { v2_review: $.data.version }
            - call: "POST /applications/${app2}/decide"
              payload: { decision: "WAITLIST", expected_application_version: "${v2_review}" }
              as: AdmissionsOfficer
              captures: { v2_waitlisted: $.data.version, app2_rank: $.data.waitlist_rank }
            # Another applicant's App on S2 also goes WAITLISTED so we have a peer to recompute
            - call: "POST /applications"
              payload: { applicant_id: "${b_id}", school_id: "${s2}", plan: "REGULAR" }
              as: Applicant
              as_user_id: "${b_id}"
              captures: { appB: $.data.id }
            - call: "POST /essay-submissions"
              payload: { application_id: "${appB}", prompt_code: "P2", body: "applicant b essay body" }
              as: Applicant
              as_user_id: "${b_id}"
            - call: "POST /recommendation-letters"
              payload: { application_id: "${appB}", recommender_id: "${rec_b}" }
              as: Applicant
              as_user_id: "${b_id}"
              captures: { lB: $.data.id }
            - call: "POST /recommendation-letters/${lB}/start"
              payload: {}
              as: Recommender
              as_user_id: "${rec_b}"
            - call: "POST /recommendation-letters/${lB}/submit"
              payload: { body: "B's letter content for school S2 written here at length to satisfy the 200-character minimum, with concrete characterizations of the applicant's recent academic work, ambitions and disposition." }
              as: Recommender
              as_user_id: "${rec_b}"
            - call: "POST /applications/${appB}/submit"
              payload: {}
              as: Applicant
              as_user_id: "${b_id}"
            - call: "POST /applications/${appB}/start-review"
              payload: {}
              as: AdmissionsOfficer
              captures: { vB_review: $.data.version }
            - call: "POST /applications/${appB}/decide"
              payload: { decision: "WAITLIST", expected_application_version: "${vB_review}" }
              as: AdmissionsOfficer
              captures: { appB_rank: $.data.waitlist_rank }
            # App3 — REGULAR on S3 in SUBMITTED (non-terminal)
            - call: "POST /applications"
              payload: { applicant_id: "${a_id}", school_id: "${s3}", plan: "REGULAR" }
              as: Applicant
              as_user_id: "${a_id}"
              captures: { app3: $.data.id }
            - call: "POST /essay-submissions"
              payload: { application_id: "${app3}", prompt_code: "P3", body: "essay three body" }
              as: Applicant
              as_user_id: "${a_id}"
            - call: "POST /recommendation-letters"
              payload: { application_id: "${app3}", recommender_id: "${rec_a}" }
              as: Applicant
              as_user_id: "${a_id}"
              captures: { l3: $.data.id }
            - call: "POST /recommendation-letters/${l3}/start"
              payload: {}
              as: Recommender
              as_user_id: "${rec_a}"
            - call: "POST /recommendation-letters/${l3}/submit"
              payload: { body: "Third application letter content also extending well past two hundred characters with substantive content about the applicant's performance, qualities, demeanor and overall academic preparation." }
              as: Recommender
              as_user_id: "${rec_a}"
            - call: "POST /applications/${app3}/submit"
              payload: {}
              as: Applicant
              as_user_id: "${a_id}"
          trigger:
            - call: "POST /applications/${app1}/accept-offer"
              payload: {}
              as: Applicant
              as_user_id: "${a_id}"
              captures: { app1_status: $.data.status }
          assert:
            - "Depth 1: Application.${app1}.status == 'ENROLLED'; School.${s1}.confirmed_enrollment_count == 1; School.${s1}.posture == 'OPEN' (still < target)"
            - "Depth 2: Application.${app2}.status == 'WITHDRAWN' (auto-cascaded because plan=EARLY_DECISION)"
            - "Depth 2: Application.${app3}.status == 'WITHDRAWN' (auto-cascaded)"
            - "Depth 3: Application.${appB}.waitlist_rank == 1 (recomputed from 2 down to 1 after App2 left WAITLISTED — this is caused by the depth-2 withdrawal of App2, not directly by the accept-offer)"

      - name: recommender_decline_two_step_cascade
        grounds:
          - state_machines.Recommender.transitions.INVITED_to_DECLINED
          - entities.RecommendationLetter.fields.status
          - entities.Applicant.fields.profile_status
        distinguishing_aspect: |
          Depth = 2 cascade from a DIFFERENT trigger: POST /recommenders/{id}/decline →
          (depth 1) deletes all REQUESTED RecommendationLetter rows pointing at this
          Recommender → (depth 2) each owning Application's Applicant has profile_status
          re-evaluated; with no Recommender rows remaining, READY flips back to DRAFT.
          The depth-2 link is caused by the depth-1 deletion, not by the original decline.
        test_recipe:
          setup:
            - "Applicant with gpa+name populated and one Recommender invited → profile_status flipped to READY when Recommender was created"
            - "RecommendationLetter REQUESTED exists for an Application of that Applicant"
          setup_api_calls:
            - call: "POST /schools"
              payload: { name: "Decline-S", target_class_size: 5, ed_deadline_iso: "2030-11-01T00:00:00Z", ea_deadline_iso: "2030-11-15T00:00:00Z", rd_deadline_iso: "2031-01-01T00:00:00Z", rolling_open: false, requires_css_profile: false, cooldown_ms: 86400000 }
              as: PlatformAdmin
              captures: { school_id: $.data.id }
            - call: "POST /_clock/advance"
              payload: { to_iso8601: "2030-10-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /applicants/register"
              payload: { email: "dec@x.com", full_name: "Dec User", gpa: 3.5, sat_total: 1200 }
              as: Anonymous
              captures: { applicant_id: $.data.id }
            - call: "POST /recommenders"
              payload: { applicant_id: "${applicant_id}", email: "decr@x.com", full_name: "Dec Rec", relationship: "TEACHER" }
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { rec_id: $.data.id, profile_status_after: $.data.applicant_id }
            - call: "GET /applicants/${applicant_id}"
              payload: {}
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { ps_before: $.data.profile_status }
            - call: "POST /applications"
              payload: { applicant_id: "${applicant_id}", school_id: "${school_id}", plan: "REGULAR" }
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { app_id: $.data.id }
            - call: "POST /recommendation-letters"
              payload: { application_id: "${app_id}", recommender_id: "${rec_id}" }
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { letter_id: $.data.id }
          trigger:
            - call: "POST /recommenders/${rec_id}/decline"
              payload: {}
              as: Anonymous
              captures: { rec_status: $.data.invite_status }
            - call: "GET /applicants/${applicant_id}"
              payload: {}
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { ps_after: $.data.profile_status }
          assert:
            - "Depth 1: RecommendationLetter.${letter_id} no longer exists (cascade-deleted because status was REQUESTED)"
            - "Depth 2: Applicant.${applicant_id}.profile_status == 'DRAFT' (re-evaluated to DRAFT because no Recommender rows remain) — caused by the depth-1 deletion, not directly by the decline call"
            - "Recommender.${rec_id}.invite_status == 'DECLINED' (the originating trigger landed)"
            - "ps_before == 'READY' and ps_after == 'DRAFT' — the cascade reached profile_status"

  # --------------------------------------------------------------------------
  # Rule 5 — Validation priority conflicts across different error-category pairs
  # --------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:

      - name: ed_submit_deadline_passed_beats_missing_letter
        grounds:
          - validations[priority=12]
          - validations[priority=15]
          - errors[ERR_DEADLINE_PASSED]
          - errors[ERR_ED_REQUIRES_LETTER]
        distinguishing_aspect: |
          Submit ED application AFTER ED deadline AND with no SUBMITTED letter. Both
          ERR_DEADLINE_PASSED (priority 12, category=business_temporal) and
          ERR_ED_REQUIRES_LETTER (priority 15, category=business_constraint) fire. Priority
          12 < 15 → ERR_DEADLINE_PASSED wins. Error-category pair = temporal vs constraint.
        test_recipe:
          setup:
            - "School S with ed_deadline_iso=2030-11-01T00:00:00Z"
            - "Applicant with READY profile (recommender invited)"
            - "Application plan=EARLY_DECISION exists in DRAFT with essay but ZERO RecommendationLetters in SUBMITTED status (no letter created)"
            - "Server clock advanced to 2030-12-01T00:00:00Z (past ED deadline)"
          setup_api_calls:
            - call: "POST /schools"
              payload: { name: "P5A", target_class_size: 5, ed_deadline_iso: "2030-11-01T00:00:00Z", ea_deadline_iso: "2030-11-15T00:00:00Z", rd_deadline_iso: "2031-01-01T00:00:00Z", rolling_open: false, requires_css_profile: false, cooldown_ms: 86400000 }
              as: PlatformAdmin
              captures: { school_id: $.data.id }
            - call: "POST /_clock/advance"
              payload: { to_iso8601: "2030-10-15T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /applicants/register"
              payload: { email: "p5a@x.com", full_name: "P5A", gpa: 3.7, sat_total: 1400 }
              as: Anonymous
              captures: { applicant_id: $.data.id }
            - call: "POST /recommenders"
              payload: { applicant_id: "${applicant_id}", email: "p5ar@x.com", full_name: "P5AR", relationship: "TEACHER" }
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { rec_id: $.data.id }
            - call: "POST /applications"
              payload: { applicant_id: "${applicant_id}", school_id: "${school_id}", plan: "EARLY_DECISION" }
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { app_id: $.data.id }
            - call: "POST /essay-submissions"
              payload: { application_id: "${app_id}", prompt_code: "P1", body: "essay body" }
              as: Applicant
              as_user_id: "${applicant_id}"
            - call: "POST /_clock/advance"
              payload: { to_iso8601: "2030-12-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /applications/${app_id}/submit"
              payload: {}
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "error_id == 'ERR_DEADLINE_PASSED' (priority 12, business_temporal — wins over ERR_ED_REQUIRES_LETTER priority 15, business_constraint)"

      - name: yield_run_no_open_seats_beats_cooldown_active
        grounds:
          - validations[priority=18]
          - validations[priority=19]
          - errors[ERR_NO_OPEN_SEATS]
          - errors[ERR_YIELD_COOLDOWN_ACTIVE]
        distinguishing_aspect: |
          Run yield on a school whose posture is AT_TARGET (no open seats) AND whose
          last_yield_run_at is within the 24h cooldown window. Both ERR_NO_OPEN_SEATS
          (priority 18, category=business_fiscal) and ERR_YIELD_COOLDOWN_ACTIVE
          (priority 19, category=business_temporal) fire. Priority 18 < 19 → fiscal wins.
