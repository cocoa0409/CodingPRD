              captures: { sb: $.data.id }
            - call: "POST /slate/seasons"
              payload: { studio_id: "${sa}", year: 2027, label: "Countdown", required_title_count: 1, air_window_start: "2027-11-01T00:00:00Z", air_window_end: "2027-12-31T00:00:00Z", delivery_deadline: "2027-10-01T00:00:00Z", max_shoot_days: 100 }
              as: PlatformAdmin
