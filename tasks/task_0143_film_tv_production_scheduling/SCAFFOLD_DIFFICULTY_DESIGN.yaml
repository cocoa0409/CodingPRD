      - name: stale_version_beats_double_booked_on_create_assignment
        grounds:
          - validations[priority=6]
          - validations[priority=9]
          - concurrency_rules[assignment-create-stale-shooting-day]
          - errors[ERR_STALE_VERSION]
          - errors[ERR_DOUBLE_BOOKED]
        distinguishing_aspect: >
          On POST /assignments a single request can violate BOTH the OCC check
          (state, priority 6, ERR_STALE_VERSION — the carried day version is the
          pre-first-booking value) AND the one-booking-per-person-per-day rule
          (business_constraint, priority 9, ERR_DOUBLE_BOOKED — the same crew is
          already on the day); priority 6 wins, so ERR_STALE_VERSION is returned.
          Distinct category pair {state, business_constraint} from the state-vs-
          business_fiscal conflict above.
        test_recipe:
          setup:
            - "ACTIVE production, one PLANNED day; crew C is already booked on the day (which bumped the day version from its observed value)."
