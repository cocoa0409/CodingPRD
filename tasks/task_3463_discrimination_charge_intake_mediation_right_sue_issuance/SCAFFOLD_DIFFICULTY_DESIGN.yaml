              captures: { chg_e_esc: $.data.priority_escalated }
          assert:
            - "link A: evidence request status == OVERDUE (due_date 2026-10-01 < clock 2027-09-01)"
            - "link B (caused by A): investigation overdue_request_count == 1 and priority_score == 80 (severity max(30,20)=30 + age tier 35 + overdue 15)"
            - "link C (caused by B crossing the threshold): Charge.${chg_e}.priority_escalated == true at exactly 80 (>= boundary)"
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: closed_charge_rts_request_state_beats_temporal
        grounds:
          - validations[priority=6]
          - validations[priority=9]
          - errors[ERR_CHARGE_ALREADY_CLOSED]
          - errors[ERR_RTS_PREMATURE]
        distinguishing_aspect: |
          Error-category pair state vs business_temporal: a WITHDRAWN charge only
          0 days after filing violates BOTH the terminal-state gate (priority 6,
          ERR_CHARGE_ALREADY_CLOSED) and the 180-day right-to-sue rule
          (priority 9, ERR_RTS_PREMATURE); the higher-priority state error must
          be returned.
        test_recipe:
          setup:
            - "RACE charge filed and immediately withdrawn at the 2026-09-01 default clock (days_elapsed_since_filing == 0 < 180)"
          setup_api_calls:
            - call: "POST /eeoc/employers"
              payload: { legal_name: "Prio Co", state_code: "FL", employee_count_current: 40 }
              as: IntakeOfficer
              captures: { emp_p: $.data.id }
            - call: "POST /eeoc/complainants"
              payload: { full_name: "Pat Ten", email: "p10@x.com" }
              as: IntakeOfficer
              captures: { cp_10: $.data.id }
            - call: "POST /eeoc/charges"
              payload: { complainant_id: "${cp_10}", employer_id: "${emp_p}", basis_codes: ["RACE"], incident_date: "2026-08-01", harm_description: "fired", employee_count_at_incident: 40 }
              as: IntakeOfficer
              captures: { chg_p: $.data.id }
            - call: "POST /eeoc/charges/${chg_p}/withdraw"
              as: ChargingParty
              as_user_id: "${cp_10}"
              captures: { chg_p_status: $.data.case_status }
          trigger:
            - call: "POST /eeoc/charges/${chg_p}/right-to-sue-notices"
              as: ChargingParty
              as_user_id: "${cp_10}"
              captures: { rts_p_error: $.data.error_id }
            - call: "GET /eeoc/charges/${chg_p}/right-to-sue-notices"
              as: Director
          assert:
            - "withdrawal succeeded: case_status == WITHDRAWN"
            - "rts_p_error == ERR_CHARGE_ALREADY_CLOSED (state, priority 6) and NOT ERR_RTS_PREMATURE (temporal, priority 9)"
            - "no RightToSueNotice row exists for the charge (empty list)"
      - name: missing_charge_disclosure_existence_beats_safety
        grounds:
          - validations[priority=4]
          - validations[priority=7]
          - errors[ERR_CHARGE_NOT_FOUND]
          - errors[ERR_DISCLOSURE_FORBIDDEN]
        distinguishing_aspect: |
          Error-category pair existence vs business_safety (different pair from
          the other instance): the same FEPA_WORK_SHARE disclosure payload that
          is forbidden on a SEALED charge returns ERR_CHARGE_NOT_FOUND when the
          charge id does not exist — the priority-4 existence check fires before
          the priority-7 confidentiality check, so the 404 neither confirms nor
          denies that a sealed charge exists at any id.
        test_recipe:
          setup:
            - "one real charge exists and is SEALED via a systemic link; a second target id (00000000-0000-4000-8000-000000000000) exists nowhere"
          setup_api_calls:
            - call: "POST /eeoc/employers"
              payload: { legal_name: "Seal Co", state_code: "FL", employee_count_current: 40 }
              as: IntakeOfficer
              captures: { emp_x: $.data.id }
            - call: "POST /eeoc/complainants"
              payload: { full_name: "Pat Eleven", email: "p11@x.com" }
              as: IntakeOfficer
              captures: { cp_11: $.data.id }
            - call: "POST /eeoc/charges"
              payload: { complainant_id: "${cp_11}", employer_id: "${emp_x}", basis_codes: ["SEX"], incident_date: "2026-08-01", harm_description: "harassment", employee_count_at_incident: 40 }
              as: IntakeOfficer
              captures: { chg_x: $.data.id }
            - call: "POST /eeoc/systemic-cases"
              payload: { title: "Seal probe", basis_focus: ["SEX"] }
              as: Commissioner
              as_user_id: "com-002"
              captures: { sys_x: $.data.id }
            - call: "POST /eeoc/systemic-cases/${sys_x}/links"
              payload: { charge_id: "${chg_x}" }
              as: Commissioner
              as_user_id: "com-002"
              captures: { sys_x_status: $.data.status }
          trigger:
            - call: "POST /eeoc/charges/00000000-0000-4000-8000-000000000000/disclosures"
              payload: { legal_basis: "FEPA_WORK_SHARE", target_description: "state agency" }
              as: Director
              captures: { miss_error: $.data.error_id }
            - call: "POST /eeoc/charges/${chg_x}/disclosures"
              payload: { legal_basis: "FEPA_WORK_SHARE", target_description: "state agency" }
              as: Director
              captures: { seal_error: $.data.error_id }
            - call: "POST /eeoc/charges/${chg_x}/disclosures"
              payload: { legal_basis: "COURT_ORDER", target_description: "federal court subpoena" }
              as: Director
              captures: { court_ok: $.data.id }
          assert:
            - "charge is SEALED after the link (systemic case status EXPANDING)"
            - "missing id: miss_error == ERR_CHARGE_NOT_FOUND (404) even though the payload would fail the sealed-disclosure rule"
            - "existing SEALED charge: seal_error == ERR_DISCLOSURE_FORBIDDEN (403) for FEPA_WORK_SHARE"
            - "COURT_ORDER on the same SEALED charge succeeds (201) — the safety rule is basis-conditional, not a blanket ban"
  - rule_id: boundary_precision_check
    instances:
      - name: headcount_14_vs_15_jurisdiction
        grounds:
          - calculations.timeliness_deadline_resolution
          - calculations.employer_size_band_classification
          - entities.Charge.fields.covered_bases
        distinguishing_aspect: |
          Boundary metric = employee headcount at incident, reached through
          POST /eeoc/charges: the Title-VII size screen is INCLUSIVE at
          TITLE_VII_MIN_EMPLOYEES, so a 14-person snapshot empties covered_bases
          (DISMISSED_NO_JURISDICTION) while 15 preserves the RACE basis and
          dockets the charge.
