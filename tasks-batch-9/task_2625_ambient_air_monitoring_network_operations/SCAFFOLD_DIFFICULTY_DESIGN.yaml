              as: NetworkAdmin
              captures: { site_a_id: "$.data.id" }
            - call: "POST /monitoring-sites/${site_a_id}/siting-approval"
              payload: { waiver_granted: false }
              as: EpaRegionalReviewer
            - call: "POST /monitoring-sites/${site_a_id}/commence-operations"
              payload: {}
              as: ProgramManager
            - call: "POST /monitors"
              payload: { site_id: "${site_a_id}", reference_method_id: "${frm_id}", poc: 1, is_primary_for_design_value: true, installed_at: "2022-12-20T00:00:00Z" }
              as: NetworkAdmin
              captures: { mon_id: "$.data.id" }
            - call: "POST /monitors/${mon_id}/approve"
              payload: {}
              as: EpaRegionalReviewer
            - call: "POST /monitors/${mon_id}/commission"
              payload: {}
              as: FieldTechnician
            - call: "POST /monitors/${mon_id}/qc-events"
              payload: { event_type: "SPAN_CHECK", performed_at: "2026-01-02T00:00:00Z", span_drift_pct: 2.0 }
              as: FieldTechnician
            - call: "POST /network-assessments"
              payload: { network_id: "${net_id}", cycle_year: 2026 }
              as: ProgramManager
              captures: { assess_id: "$.data.id" }
            - call: "POST /network-assessments/${assess_id}/submit"
              payload: {}
              as: ProgramManager
            - call: "POST /network-assessments/${assess_id}/decision"
              payload: { decision: "APPROVE", decision_note: "Assessment accepted" }
              as: EpaRegionalReviewer
            - call: "POST /site-change-requests"
              payload: { site_id: "${site_a_id}", request_type: "SEASONAL_SUSPENSION", justification: "Winter access road closed for the season", assessment_id: "${assess_id}" }
              as: ProgramManager
              captures: { scr_id: "$.data.id" }
            - call: "POST /site-change-requests/${scr_id}/submit"
              payload: {}
              as: ProgramManager
            - call: "POST /site-change-requests/${scr_id}/decision"
              payload: { decision: "APPROVE", decision_note: "Seasonal suspension approved" }
