          The cedent's decision writes a derived flag onto the ancestor and that write is what
          unblocks bind. REJECT leaves Program.disclosure_acknowledged false — so bind is 409
          ERR_DISCLOSURE_NOT_ACKNOWLEDGED even though the program is in FIRM_ORDER — and the
