- rule_id: resource_temporal_overlap
  instances:
  - name: resource_temporal_overlap__price_rule_half_open_abut_legal_then_one_second_collision
    grounds:
    - validations[priority=34]
    - entities.PriceRule.fields.effective_to
    - entities.PriceRule.fields.effective_from
    - entities.PriceRule.fields.status
    - calculations.price_rule_selector
    distinguishing_aspect: 'PriceRule occupation on the (facility_id, revenue_code_id) resource uses HALF-OPEN

      [effective_from, effective_to) interval semantics, so a new rule whose effective_from

      exactly equals an existing ACTIVE rule''s effective_to is ACCEPTED (201) while a rule

      starting one second earlier is REJECTED with ERR_PRICE_RULE_OVERLAP — the opposite

      adjacency verdict from the PayerContract closed-interval rule at priority 35.

      '
    test_recipe:
      setup:
      - Logical clock pinned at 2026-08-01T00:00:00Z (the fixed startup default, re-set explicitly).
      - One OPEN facility with one ACTIVE revenue code 0300 (pricing_class PROCEDURE).
      - One ACTIVE PriceRule R1 on scope (facility, revenue code 0300) occupying the half-open interval [2026-09-01T00:00:00Z, 2026-12-01T00:00:00Z).
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-08-01T00:00:00Z'
        as: SystemAdmin
        as_user_id: sysadmin_1
      - call: POST /chargemaster/facilities
        payload:
          name: St Vitus Medical Center
          cms_certification_number: CCN-2193-HALFOPEN
          rounding_mode: NEAREST_DOLLAR
          aggregate_markup_limit_bp: 40000
        as: SystemAdmin
        as_user_id: sysadmin_1
        captures:
