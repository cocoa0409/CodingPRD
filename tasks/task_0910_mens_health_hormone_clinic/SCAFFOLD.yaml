# =============================================================================
# PRD Benchmark Seed Tables — Men's Health & Hormone (TRT/ED) Clinic
# Difficulty: Expert
# =============================================================================

scenario: |
  Men's Health & Hormone (TRT/ED) Clinic: intake & lab (testosterone/PSA),
  treatment plan & protocol, controlled-substance & monitoring, membership &
  refill, telehealth & lab-draw, dose titration & follow-up, self-pay & pharmacy,
  adverse-event

domain_name: mens-health-hormone-clinic
api_prefix: /clinic

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: pricing_engine
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers

  entity_topology: flat
  # Peer entities under a shared /clinic namespace, linked by foreign keys.
  # No nested ownership URLs except the DoseTitration sub-resource under a plan.

  state_machine_shape: cyclic
  # TreatmentPlan is cyclic (ACTIVE <-> TITRATION_PENDING titration rounds);
  # Membership carries two parallel state dimensions; AdverseEvent branches;
  # ControlledSubstancePrescription branches with revert.

  relationship_patterns:
    - one_to_many        # Patient -> LabPanel/TreatmentPlan/Membership/...
    - flat_references    # cross-aggregate FKs (RefillOrder -> Prescription + Membership)
    - cross_aggregate    # RefillOrder spans Prescription, Membership, Patient

  role_model: segregation_of_duties
  # AdverseEvent triage (safety review) MUST be performed by a clinician other
  # than the plan's prescribing clinician; prescribe vs dispense split across
  # Clinician and Pharmacist entity-backed roles.

  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED — EMIT VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Clinician
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Prescriber full name" }
      - { name: npi, type: string, source: input, description: "National Provider Identifier" }
      - { name: dea_number, type: string, source: input, description: "DEA registration for controlled-substance prescribing" }

  - name: Pharmacist
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Dispensing pharmacist full name" }
      - { name: license_number, type: string, source: input, description: "Pharmacy license number" }

  - name: Patient
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Patient full name" }
      - { name: date_of_birth, type: string, source: input, description: "YYYY-MM-DD" }
      - { name: sex, type: enum, source: input, description: "MALE | OTHER", constraints: "one of MALE, OTHER" }
      - { name: email, type: string, source: input, description: "Contact email" }

  - name: MembershipPlan
    parent: null
    common_fields: true
    fields:
      - { name: tier, type: enum, source: input, description: "CORE | PLUS | ELITE", constraints: "one of CORE, PLUS, ELITE" }
      - { name: monthly_fee_cents, type: integer, source: input, description: "Recurring cycle fee in cents (non-negative)" }
      - { name: cycle_days, type: integer, source: input, description: "Billing cycle length in days (used in proration denominator)" }
      - { name: included_refills_per_cycle, type: integer, source: input, description: "Refills included per cycle" }
      - { name: included_lab_draw_credits, type: integer, source: input, description: "Lab-draw credits granted at membership creation" }
      - { name: refill_discount_pct, type: number, source: input, description: "Member discount fraction applied to refill drug cost, 0.0..1.0" }
      - { name: titration_visit_fee_cents, type: integer, source: input, description: "Fee charged per titration follow-up" }

  - name: Membership
    parent: null
    common_fields: true
    fields:
      - { name: patient_id, type: string, source: input, description: "FK -> Patient.id" }
      - { name: plan_id, type: string, source: input, description: "FK -> MembershipPlan.id; current plan" }
      - { name: subscription_status, type: enum, source: system, default: TRIAL, description: "Lifecycle axis: TRIAL -> ACTIVE -> CANCELLED", constraints: "one of TRIAL, ACTIVE, CANCELLED" }
      - { name: payment_status, type: enum, source: system, default: CURRENT, description: "Independent payment axis: CURRENT <-> DELINQUENT", constraints: "one of CURRENT, DELINQUENT" }
      - { name: lab_draw_credits_remaining, type: integer, source: computed, description: "Conserved: included_lab_draw_credits minus non-cancelled draw appointments" }
      - { name: cycle_anchor_date, type: datetime, source: system, description: "Start of current billing cycle (logical clock at creation)" }
      - { name: last_change_charge_cents, type: integer, source: computed, default: 0, description: "Net proration charge from the most recent change-plan action" }

  - name: DrawStation
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Phlebotomy station name" }
      - { name: concurrent_capacity, type: integer, source: input, description: "Max SCHEDULED appointments whose intervals overlap at this station" }

  - name: LabPanel
    parent: null
    common_fields: true
    fields:
      - { name: patient_id, type: string, source: input, description: "FK -> Patient.id" }
      - { name: clinician_id, type: string, source: input, description: "FK -> Clinician.id; ordering clinician" }
      - { name: panel_type, type: enum, source: input, description: "BASELINE | MONITORING", constraints: "one of BASELINE, MONITORING" }
      - { name: total_testosterone_ng_dl, type: integer, source: input, description: "Result value entered at RESULTED (ng/dL)" }
      - { name: psa_ng_ml, type: number, source: input, description: "Prostate-specific antigen result (ng/mL)" }
      - { name: hematocrit_pct, type: number, source: input, description: "Hematocrit result (percent)" }
      - { name: drawn_at, type: datetime, source: input, description: "Timestamp the sample was drawn" }
      - { name: is_unsafe, type: boolean, source: computed, default: false, description: "True when hematocrit_pct >= 54.0 or psa_ng_ml >= 4.0 at review" }
      - { name: status, type: enum, source: system, default: ORDERED, description: "ORDERED -> DRAWN -> RESULTED -> REVIEWED", constraints: "one of ORDERED, DRAWN, RESULTED, REVIEWED" }

  - name: LabDrawAppointment
    parent: null
    common_fields: true
    fields:
      - { name: patient_id, type: string, source: input, description: "FK -> Patient.id" }
      - { name: draw_station_id, type: string, source: input, description: "FK -> DrawStation.id; scheduling resource" }
      - { name: start_at, type: datetime, source: input, description: "Interval start (inclusive)" }
      - { name: end_at, type: datetime, source: input, description: "Interval end (exclusive); half-open [start_at, end_at)" }
      - { name: status, type: enum, source: system, default: SCHEDULED, description: "SCHEDULED -> COMPLETED | CANCELLED", constraints: "one of SCHEDULED, COMPLETED, CANCELLED" }

  - name: TelehealthVisit
    parent: null
    common_fields: true
    fields:
      - { name: patient_id, type: string, source: input, description: "FK -> Patient.id" }
      - { name: clinician_id, type: string, source: input, description: "FK -> Clinician.id; visit is booked on this clinician's calendar" }
      - { name: start_at, type: datetime, source: input, description: "Interval start (inclusive)" }
      - { name: end_at, type: datetime, source: input, description: "Interval end (exclusive)" }
      - { name: reason, type: string, source: input, description: "Visit reason", constraints: "optional" }
      - { name: status, type: enum, source: system, default: SCHEDULED, description: "SCHEDULED -> COMPLETED | CANCELLED", constraints: "one of SCHEDULED, COMPLETED, CANCELLED" }

  - name: TreatmentPlan
    parent: null
    common_fields: true
    fields:
      - { name: patient_id, type: string, source: input, description: "FK -> Patient.id" }
      - { name: clinician_id, type: string, source: input, description: "FK -> Clinician.id; owning prescriber" }
      - { name: baseline_panel_id, type: string, source: input, description: "FK -> LabPanel.id; baseline labs required before activation" }
      - { name: protocol_type, type: enum, source: input, description: "TRT_INJECTION | TRT_TOPICAL | ED_THERAPY", constraints: "one of TRT_INJECTION, TRT_TOPICAL, ED_THERAPY" }
      - { name: starting_dose_mg, type: number, source: input, description: "Initial dose (mg)" }
      - { name: current_dose_mg, type: number, source: computed, description: "Current dose; updated on titration confirm" }
      - { name: round_index, type: integer, source: computed, default: 0, description: "Number of confirmed titration rounds" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT -> ACTIVE <-> TITRATION_PENDING; ACTIVE -> MONITORING_HOLD -> ACTIVE; any -> SUSPENDED", constraints: "one of DRAFT, ACTIVE, TITRATION_PENDING, MONITORING_HOLD, SUSPENDED" }

  - name: DoseTitration
    parent: TreatmentPlan
    common_fields: true
    fields:
      - { name: plan_id, type: string, source: system, description: "FK -> TreatmentPlan.id (from path)" }
      - { name: round_index, type: integer, source: computed, description: "1-based index of this titration round" }
      - { name: previous_dose_mg, type: number, source: computed, description: "current_dose_mg at proposal time" }
      - { name: proposed_dose_mg, type: number, source: input, description: "Proposed new dose (mg)" }
      - { name: applied, type: boolean, source: computed, default: false, description: "True once confirmed and applied to the plan" }
      - { name: status, type: enum, source: system, default: PROPOSED, description: "PROPOSED -> CONFIRMED | CANCELLED", constraints: "one of PROPOSED, CONFIRMED, CANCELLED" }

  - name: ControlledSubstancePrescription
    parent: null
    common_fields: true
    fields:
      - { name: plan_id, type: string, source: input, description: "FK -> TreatmentPlan.id" }
      - { name: patient_id, type: string, source: input, description: "FK -> Patient.id" }
      - { name: prescriber_id, type: string, source: system, description: "FK -> Clinician.id; set from X-User-ID at creation" }
      - { name: drug_name, type: string, source: input, description: "Controlled-substance drug name" }
      - { name: unit_price_cents, type: integer, source: input, description: "Self-pay price per unit (cents)" }
      - { name: quantity_per_fill, type: integer, source: input, description: "Default units per fill" }
      - { name: refills_authorized, type: integer, source: input, description: "Total refills authorized" }
      - { name: refills_remaining, type: integer, source: computed, description: "Conserved: refills_authorized minus non-reversed DISPENSED refill orders" }
      - { name: is_controlled, type: boolean, source: input, default: true, description: "Whether the drug incurs the controlled-substance surcharge" }
      - { name: status, type: enum, source: system, default: ISSUED, description: "ISSUED <-> SUSPENDED; ISSUED -> REVOKED | EXHAUSTED", constraints: "one of ISSUED, SUSPENDED, REVOKED, EXHAUSTED" }

  - name: RefillOrder
    parent: null
    common_fields: true
    fields:
      - { name: prescription_id, type: string, source: input, description: "FK -> ControlledSubstancePrescription.id" }
      - { name: membership_id, type: string, source: input, description: "FK -> Membership.id; supplies member discount" }
      - { name: patient_id, type: string, source: input, description: "FK -> Patient.id" }
      - { name: requested_quantity_units, type: integer, source: input, description: "Units requested at order time (drives provisional charge)" }
      - { name: dispensed_quantity_units, type: integer, source: input, description: "Units actually dispensed (drives final charge); set at dispense" }
      - { name: provisional_charge_cents, type: integer, source: computed, description: "Estimated self-pay charge computed from requested_quantity_units" }
      - { name: final_charge_cents, type: integer, source: computed, description: "Final self-pay charge computed from dispensed_quantity_units" }
      - { name: status, type: enum, source: system, default: PENDING_REVIEW, description: "PENDING_REVIEW -> DISPENSED -> REVERSED; PENDING_REVIEW -> CANCELLED", constraints: "one of PENDING_REVIEW, DISPENSED, CANCELLED, REVERSED" }

  - name: AdverseEvent
    parent: null
    common_fields: true
    fields:
      - { name: patient_id, type: string, source: input, description: "FK -> Patient.id" }
      - { name: plan_id, type: string, source: input, description: "FK -> TreatmentPlan.id; plan implicated by the event" }
      - { name: reported_by, type: string, source: input, description: "FK -> Clinician.id; reporting clinician", constraints: "optional (patient self-report leaves null)" }
      - { name: description, type: string, source: input, description: "Free-text event description" }
      - { name: severity, type: enum, source: computed, description: "Set at triage: MILD | SEVERE", constraints: "one of MILD, SEVERE" }
      - { name: status, type: enum, source: system, default: REPORTED, description: "REPORTED -> MILD_LOGGED | SEVERE_ESCALATED -> RESOLVED", constraints: "one of REPORTED, MILD_LOGGED, SEVERE_ESCALATED, RESOLVED" }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  # ---- TreatmentPlan: cyclic titration + monitoring hold + suspension ----
  - entity: TreatmentPlan
    initial_state: DRAFT
    terminal_states: [SUSPENDED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /clinic/treatment-plans/{id}/activate"
        actor: Clinician
        preconditions:
          - "Acting clinician owns the plan: plan.clinician_id == X-User-ID (ERR_CLINICIAN_MISMATCH)"
          - "baseline_panel_id LabPanel.status == REVIEWED (ERR_BASELINE_NOT_REVIEWED)"
          - "Patient's Membership exists with subscription_status == ACTIVE (ERR_MEMBERSHIP_NOT_ACTIVE)"
          - "Plan.status == DRAFT (ERR_INVALID_STATE)"
        side_effects:
          - "current_dose_mg := starting_dose_mg"
      - from: ACTIVE
        to: TITRATION_PENDING
        trigger: "POST /clinic/treatment-plans/{id}/titrations"
        actor: Clinician
        preconditions:
          - "Plan.status == ACTIVE (ERR_PLAN_NOT_ACTIVE)"
          - "expected_plan_version matches TreatmentPlan.version (ERR_STALE_VERSION)"
        side_effects:
          - "Creates DoseTitration(status=PROPOSED, previous_dose_mg=current_dose_mg, round_index=round_index+1)"
          - "increments TreatmentPlan.version by 1"
      - from: TITRATION_PENDING
        to: ACTIVE
        trigger: "POST /clinic/treatment-plans/{id}/titrations/{titrationId}/confirm"
        actor: Clinician
        preconditions:
          - "Plan.status == TITRATION_PENDING (ERR_TITRATION_NOT_PENDING)"
          - "Latest REVIEWED LabPanel for patient has hematocrit_pct < 54.0 (ERR_HEMATOCRIT_UNSAFE)"
        side_effects:
          - "DoseTitration.status := CONFIRMED, applied := true"
          - "TreatmentPlan.current_dose_mg := DoseTitration.proposed_dose_mg"
          - "TreatmentPlan.round_index := DoseTitration.round_index"
          - "increments TreatmentPlan.version by 1"
      - from: ACTIVE
        to: MONITORING_HOLD
        trigger: "system: LabPanel review with is_unsafe == true (cascade link 1)"
        actor: system
        preconditions:
          - "Plan.status == ACTIVE"
        side_effects:
          - "Cascade link 2: linked ISSUED ControlledSubstancePrescription.status := SUSPENDED"
      - from: MONITORING_HOLD
        to: ACTIVE
        trigger: "POST /clinic/treatment-plans/{id}/resume"
        actor: Clinician
        preconditions:
          - "Plan.status == MONITORING_HOLD (ERR_INVALID_STATE)"
          - "Latest REVIEWED LabPanel for patient has is_unsafe == false (ERR_HEMATOCRIT_UNSAFE)"
        side_effects:
          - "linked SUSPENDED ControlledSubstancePrescription.status := ISSUED"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /clinic/treatment-plans/{id}/suspend OR system adverse-event cascade"
        actor: Clinician | system
        preconditions:
          - "Plan.status in {DRAFT, ACTIVE, TITRATION_PENDING, MONITORING_HOLD} (ERR_INVALID_STATE)"
        side_effects:
          - "Any PROPOSED DoseTitration for this plan := CANCELLED"
          - "Cascade: linked ISSUED/SUSPENDED ControlledSubstancePrescription.status := REVOKED"
      - from: TITRATION_PENDING
        to: SUSPENDED
        trigger: "POST /clinic/treatment-plans/{id}/suspend OR system adverse-event cascade"
        actor: Clinician | system
        preconditions:
          - "Plan.status in {DRAFT, ACTIVE, TITRATION_PENDING, MONITORING_HOLD} (ERR_INVALID_STATE)"
        side_effects:
          - "Any PROPOSED DoseTitration for this plan := CANCELLED"
          - "Cascade: linked ISSUED/SUSPENDED ControlledSubstancePrescription.status := REVOKED"

  # ---- ControlledSubstancePrescription: branching with revert ----
  - entity: ControlledSubstancePrescription
    initial_state: ISSUED
    terminal_states: [REVOKED, EXHAUSTED]
    transitions:
      - from: ISSUED
        to: SUSPENDED
        trigger: "system: plan enters MONITORING_HOLD (cascade link 2)"
        actor: system
        preconditions:
          - "Prescription.status == ISSUED"
        side_effects: []
      - from: SUSPENDED
        to: ISSUED
        trigger: "system: plan resumes to ACTIVE"
        actor: system
        preconditions:
          - "Prescription.status == SUSPENDED"
        side_effects: []
      - from: ISSUED
        to: REVOKED
        trigger: "POST /clinic/prescriptions/{id}/revoke OR system plan-suspend cascade"
        actor: Clinician | system
        preconditions:
          - "Prescription.status in {ISSUED, SUSPENDED} (ERR_INVALID_STATE)"
        side_effects:
          - "Cascade link 3: every PENDING_REVIEW RefillOrder for this prescription := CANCELLED"
      - from: ISSUED
        to: EXHAUSTED
        trigger: "system: RefillOrder dispense drives refills_remaining to 0"
        actor: system
        preconditions:
          - "refills_remaining == 0 after decrement"
        side_effects: []

  # ---- RefillOrder: self-pay pharmacy fulfillment ----
  - entity: RefillOrder
    initial_state: PENDING_REVIEW
    terminal_states: [CANCELLED, REVERSED]
    transitions:
      - from: PENDING_REVIEW
        to: DISPENSED
        trigger: "POST /clinic/refill-orders/{id}/dispense"
        actor: Pharmacist
        preconditions:
          - "RefillOrder.status == PENDING_REVIEW (ERR_REFILL_NOT_DISPENSABLE)"
          - "Prescription.status not in {SUSPENDED, REVOKED} (ERR_PRESCRIPTION_SUSPENDED)"
          - "Prescription.refills_remaining >= 1 (ERR_NO_REFILLS_REMAINING); an EXHAUSTED prescription reaches this check and fails here"
        side_effects:
          - "final_charge_cents computed from dispensed_quantity_units (final variant)"
          - "Prescription.refills_remaining -= 1"
          - "If Prescription.refills_remaining == 0: Prescription.status := EXHAUSTED"
      - from: DISPENSED
        to: REVERSED
        trigger: "POST /clinic/refill-orders/{id}/reverse"
        actor: Pharmacist
        preconditions:
          - "RefillOrder.status == DISPENSED (ERR_INVALID_STATE)"
        side_effects:
          - "Prescription.refills_remaining += 1 (compensating invariant)"
          - "If Prescription.status == EXHAUSTED and refills_remaining > 0: Prescription.status := ISSUED"
      - from: PENDING_REVIEW
        to: CANCELLED
        trigger: "POST /clinic/refill-orders/{id}/cancel OR system prescription-revoke cascade"
        actor: Patient | ClinicAdmin | Clinician | system
        preconditions:
          - "RefillOrder.status == PENDING_REVIEW (ERR_INVALID_STATE)"
        side_effects: []

  # ---- AdverseEvent: branching triage (fork with divergent side-effects) ----
  - entity: AdverseEvent
    initial_state: REPORTED
    terminal_states: [RESOLVED]
    transitions:
      - from: REPORTED
        to: MILD_LOGGED
        trigger: "POST /clinic/adverse-events/{id}/triage (severity=MILD)"
        actor: Clinician
        preconditions:
          - "AdverseEvent.status == REPORTED (ERR_INVALID_STATE)"
          - "Reviewing clinician (X-User-ID) != plan.clinician_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "severity := MILD (no plan cascade)"
      - from: REPORTED
        to: SEVERE_ESCALATED
        trigger: "POST /clinic/adverse-events/{id}/triage (severity=SEVERE)"
        actor: Clinician
        preconditions:
          - "AdverseEvent.status == REPORTED (ERR_INVALID_STATE)"
          - "Reviewing clinician (X-User-ID) != plan.clinician_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "severity := SEVERE"
          - "Cascade link 1: plan.status := SUSPENDED (which cascades to prescription REVOKED and refill CANCELLED)"
      - from: MILD_LOGGED
        to: RESOLVED
        trigger: "POST /clinic/adverse-events/{id}/resolve"
        actor: Clinician
        preconditions:
          - "AdverseEvent.status in {MILD_LOGGED, SEVERE_ESCALATED} (ERR_INVALID_STATE)"
        side_effects: []
      - from: SEVERE_ESCALATED
        to: RESOLVED
        trigger: "POST /clinic/adverse-events/{id}/resolve"
        actor: Clinician
        preconditions:
          - "AdverseEvent.status in {MILD_LOGGED, SEVERE_ESCALATED} (ERR_INVALID_STATE)"
        side_effects: []

  # ---- LabPanel: linear result pipeline ----
  - entity: LabPanel
    initial_state: ORDERED
    terminal_states: [REVIEWED]
    transitions:
      - from: ORDERED
        to: DRAWN
        trigger: "POST /clinic/lab-panels/{id}/draw"
        actor: Clinician | ClinicAdmin
        preconditions:
          - "LabPanel.status == ORDERED (ERR_INVALID_STATE)"
        side_effects: []
      - from: DRAWN
        to: RESULTED
        trigger: "POST /clinic/lab-panels/{id}/result"
        actor: Clinician
        preconditions:
          - "LabPanel.status == DRAWN (ERR_PANEL_NOT_RESULTED)"
        side_effects:
          - "Stores total_testosterone_ng_dl, psa_ng_ml, hematocrit_pct, drawn_at"
      - from: RESULTED
        to: REVIEWED
        trigger: "POST /clinic/lab-panels/{id}/review"
        actor: Clinician
        preconditions:
          - "LabPanel.status == RESULTED (ERR_INVALID_STATE)"
        side_effects:
          - "is_unsafe := (hematocrit_pct >= 54.0 OR psa_ng_ml >= 4.0)"
          - "If is_unsafe and patient has an ACTIVE TreatmentPlan: plan.status := MONITORING_HOLD (cascade link 1)"

  # ---- Membership: subscription axis (parallel dimension A) ----
  - entity: Membership
    initial_state: TRIAL
    terminal_states: [CANCELLED]
    transitions:
      - from: TRIAL
        to: ACTIVE
        trigger: "POST /clinic/memberships/{id}/activate"
        actor: ClinicAdmin
        preconditions:
          - "subscription_status == TRIAL (ERR_INVALID_STATE)"
        side_effects: []
      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /clinic/memberships/{id}/cancel"
        actor: ClinicAdmin
        preconditions:
          - "subscription_status in {TRIAL, ACTIVE} (ERR_INVALID_STATE)"
        side_effects: []
      - from: TRIAL
        to: CANCELLED
        trigger: "POST /clinic/memberships/{id}/cancel"
        actor: ClinicAdmin
        preconditions:
          - "subscription_status in {TRIAL, ACTIVE} (ERR_INVALID_STATE)"
        side_effects: []

  # ---- Membership: payment axis (parallel dimension B, evolves independently) ----
  - entity: Membership
    initial_state: CURRENT
    terminal_states: []
    note: "Parallel state dimension on the same Membership row; independent of subscription_status axis."
    transitions:
      - from: CURRENT
        to: DELINQUENT
        trigger: "POST /clinic/memberships/{id}/record-payment (outcome=FAILED)"
        actor: ClinicAdmin
        preconditions:
          - "payment_status == CURRENT (ERR_INVALID_STATE)"
        side_effects: []
      - from: DELINQUENT
        to: CURRENT
        trigger: "POST /clinic/memberships/{id}/record-payment (outcome=SUCCEEDED)"
        actor: ClinicAdmin
        preconditions:
          - "payment_status == DELINQUENT (ERR_INVALID_STATE)"
        side_effects: []

  # ---- LabDrawAppointment: scheduling + credit conservation ----
  - entity: LabDrawAppointment
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /clinic/lab-draw-appointments/{id}/complete"
        actor: Clinician | ClinicAdmin
        preconditions:
          - "status == SCHEDULED (ERR_APPOINTMENT_NOT_SCHEDULED)"
        side_effects: []
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /clinic/lab-draw-appointments/{id}/cancel"
        actor: Patient | ClinicAdmin | Clinician
        preconditions:
          - "status == SCHEDULED (ERR_APPOINTMENT_NOT_SCHEDULED)"
        side_effects:
          - "Membership.lab_draw_credits_remaining += 1 (compensating invariant)"

  # ---- TelehealthVisit: scheduling ----
  - entity: TelehealthVisit
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /clinic/telehealth-visits/{id}/complete"
        actor: Clinician
        preconditions:
          - "status == SCHEDULED (ERR_INVALID_STATE)"
        side_effects: []
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /clinic/telehealth-visits/{id}/cancel"
        actor: Patient | ClinicAdmin | Clinician
        preconditions:
          - "status == SCHEDULED (ERR_INVALID_STATE)"
        side_effects: []

# =============================================================================
# 1.2.1 Concurrency Rules (OCC on parent.version — true CREATE-with-supersede races)
# =============================================================================
concurrency_rules:
  - rule_id: titration-create-stale-plan
    parent_entity: TreatmentPlan
    write_endpoint: "POST /clinic/treatment-plans/{id}/titrations"
    occ_field: "expected_plan_version"
    description: |
      Proposing a new DoseTitration against a TreatmentPlan whose version has
      advanced since the client last observed it is rejected. A prior titration
      proposal (which legitimately supersedes the current dose recommendation
      and moves the plan to TITRATION_PENDING) has already advanced the plan's
      version, so this writer's view is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: refill-create-stale-prescription
    parent_entity: ControlledSubstancePrescription
    write_endpoint: "POST /clinic/refill-orders"
    occ_field: "expected_prescription_version"
    description: |
      Creating a RefillOrder against a ControlledSubstancePrescription whose
      version has advanced since the client last observed it is rejected. The
      prescription's version advances on every dispense/reverse/state change, so
      a refill submitted against a stale prescription view is rejected before it
      can draw down an already-consumed refill allowance.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: refill_self_pay_charge
    trigger: "RefillOrder create (provisional) and RefillOrder dispense (final)"
    algorithm: tiered_pricing
    formula: |
      # ≥3 inputs, non-linear: marginal quantity tiers + conditional surcharge + min/max caps
      def tiered_drug_cost(unit_price_cents, units):
        t1 = min(units, TIER1_MAX_UNITS)                                  # units 1..4 @ 1.00x
        t2 = min(max(units - TIER1_MAX_UNITS, 0), TIER2_MAX_UNITS - TIER1_MAX_UNITS)  # 5..10 @ 0.90x
        t3 = max(units - TIER2_MAX_UNITS, 0)                              # 11+   @ 0.80x
        return (t1 * unit_price_cents
                + t2 * round(unit_price_cents * TIER2_RATE)
                + t3 * round(unit_price_cents * TIER3_RATE))
      gross          = tiered_drug_cost(prescription.unit_price_cents, units)
      cs_surcharge   = CONTROLLED_SUBSTANCE_SURCHARGE_CENTS if prescription.is_controlled else 0
      member_discount= round(gross * plan.refill_discount_pct)     # plan of the RefillOrder.membership
      subtotal       = gross + cs_surcharge - member_discount
      charge         = min(max(subtotal, REFILL_MIN_CHARGE_CENTS), REFILL_MAX_CHARGE_CENTS)
    input_set: "Single RefillOrder; 'units' = requested_quantity_units (provisional) or dispensed_quantity_units (final)."
    constants:
      TIER1_MAX_UNITS: 4
      TIER2_MAX_UNITS: 10
      TIER2_RATE: 0.90
      TIER3_RATE: 0.80
      CONTROLLED_SUBSTANCE_SURCHARGE_CENTS: 1500
      REFILL_MIN_CHARGE_CENTS: 1000
      REFILL_MAX_CHARGE_CENTS: 100000
    precision: "integer cents; round() is round_half_up"
    variants:
      - name: provisional
        when: "RefillOrder create"
        difference: "units = requested_quantity_units; stored in provisional_charge_cents"
      - name: final
        when: "RefillOrder dispense"
        difference: "units = dispensed_quantity_units; stored in final_charge_cents (may differ from provisional)"

  - name: change_plan_proration
    trigger: "POST /clinic/memberships/{id}/change-plan"
    algorithm: waterfall_allocation
    formula: |
      # Nested rounding where ORDER matters — PINNED: round each line to the nearest cent
      # INDEPENDENTLY, THEN combine. Denominators differ per line (old vs new cycle_days),
      # so summing raw fractions before rounding is not well-defined.
      days_remaining = days_between(clock_now, cycle_anchor_date + old_plan.cycle_days days)  # >= 0
      old_credit_line   = round(old_plan.monthly_fee_cents * days_remaining / old_plan.cycle_days)
      new_charge_line   = round(new_plan.monthly_fee_cents * days_remaining / new_plan.cycle_days)
      net_charge_cents  = new_charge_line - old_credit_line     # stored in last_change_charge_cents
    input_set: "The membership's current (old) plan and the requested new plan."
    constants:
      CYCLE_ANCHOR_DEFAULT_DAYS: 0
    precision: "integer cents; round per-line first (round_half_up), then subtract"

  - name: patient_monitoring_risk
    trigger: "GET /clinic/patients/{id}/monitoring-summary"
    algorithm: weighted_scoring
    formula: |
      def panel_risk(p):   # p is a REVIEWED LabPanel
        s = ( HCT_WEIGHT * max(0, floor(p.hematocrit_pct - HCT_BASE))
            + PSA_WEIGHT * ceil(max(0.0, p.psa_ng_ml - PSA_BASE))
            + (LOW_T_PENALTY if p.total_testosterone_ng_dl < LOW_T_THRESHOLD else 0) )
        return min(100, s)
      reviewed = REVIEWED LabPanels for patient with drawn_at within MONITORING_WINDOW_DAYS of clock_now
      provisional_risk_score   = panel_risk(latest reviewed by drawn_at DESC, tie-break created_at DESC)
      comprehensive_risk_score = round(mean(panel_risk(p) for p in reviewed))    # empty -> 0
    input_set: "REVIEWED LabPanels for the patient whose drawn_at is within MONITORING_WINDOW_DAYS of the logical clock."
    constants:
      HCT_WEIGHT: 8
      HCT_BASE: 50
      PSA_WEIGHT: 15
      PSA_BASE: 3.0
      LOW_T_PENALTY: 25
      LOW_T_THRESHOLD: 300
      MONITORING_WINDOW_DAYS: 90
    precision: "integer score 0..100; comprehensive uses round_half_up on the mean"
    variants:
      - name: provisional
        when: "Snapshot from the single most recent REVIEWED panel"
        difference: "Uses only the latest panel; ignores the rest of the window"
      - name: comprehensive
        when: "Rolling window aggregate"
        difference: "Averages panel_risk across all REVIEWED panels in the window; diverges from provisional"

  - name: lab_draw_credit_ledger
    trigger: "LabDrawAppointment create (consume) / cancel (refund)"
    algorithm: aggregation
    formula: |
      lab_draw_credits_remaining = plan.included_lab_draw_credits
                                   - count(LabDrawAppointment where membership's patient
                                           AND status in {SCHEDULED, COMPLETED})
      # create: -1 (guarded by ERR_INSUFFICIENT_LAB_DRAW_CREDITS when result would be < 0)
      # cancel: +1 (only from SCHEDULED)
    input_set: "LabDrawAppointments of the membership's patient in {SCHEDULED, COMPLETED}."
    precision: "integer count"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and valid"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: all

  - priority: 2
    category: auth
    check: "Role permitted for this operation per §1.7"
    error_id: ERR_INSUFFICIENT_PERMISSIONS
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "Every path/body resource id resolves (validated left-to-right)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all endpoints that reference ids

  - priority: 3.5
    category: state
    check: "Request body well-formed: required fields present, enums valid, numerics in range"
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: all mutating endpoints

  - priority: 3.8
    category: state
    check: "OCC: when the endpoint declares expected_<parent>_version it must equal the parent's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /clinic/treatment-plans/{id}/titrations, POST /clinic/refill-orders"

  - priority: 4.0
    category: state
    check: "TreatmentPlan must be ACTIVE for titration proposal"
    error_id: ERR_PLAN_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /clinic/treatment-plans/{id}/titrations"

  - priority: 4.1
    category: state
    check: "TreatmentPlan must be TITRATION_PENDING for titration confirm"
    error_id: ERR_TITRATION_NOT_PENDING
    http_status: 409
    applies_to: "POST /clinic/treatment-plans/{id}/titrations/{titrationId}/confirm"

  - priority: 4.2
    category: state
    check: "LabPanel must be DRAWN before result / RESULTED before review"
    error_id: ERR_PANEL_NOT_RESULTED
    http_status: 409
    applies_to: "POST /clinic/lab-panels/{id}/result, POST /clinic/lab-panels/{id}/review"

  - priority: 4.3
    category: state
    check: "RefillOrder must be PENDING_REVIEW to dispense"
    error_id: ERR_REFILL_NOT_DISPENSABLE
    http_status: 409
    applies_to: "POST /clinic/refill-orders/{id}/dispense"

  - priority: 4.4
    category: state
    check: "Referenced prescription status must NOT be in {SUSPENDED, REVOKED} for refill create and dispense (EXHAUSTED passes this check and is caught by the refills-remaining rule at priority 9.0)"
    error_id: ERR_PRESCRIPTION_SUSPENDED
    http_status: 409
    applies_to: "POST /clinic/refill-orders, POST /clinic/refill-orders/{id}/dispense"

  - priority: 4.5
    category: state
    check: "Membership subscription_status must be ACTIVE for plan activation and refill create"
    error_id: ERR_MEMBERSHIP_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /clinic/treatment-plans/{id}/activate, POST /clinic/refill-orders"

  - priority: 4.6
    category: state
    check: "LabDrawAppointment must be SCHEDULED to complete/cancel"
    error_id: ERR_APPOINTMENT_NOT_SCHEDULED
    http_status: 409
    applies_to: "POST /clinic/lab-draw-appointments/{id}/complete, POST /clinic/lab-draw-appointments/{id}/cancel"

  - priority: 4.7
    category: state
    check: "Generic invalid state transition for any trigger not enabled from the current state"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: all transition endpoints

  - priority: 5.0
    category: business_referential
    check: "Baseline LabPanel must be REVIEWED before plan activation"
    error_id: ERR_BASELINE_NOT_REVIEWED
    http_status: 409
    applies_to: "POST /clinic/treatment-plans/{id}/activate"

  - priority: 5.1
    category: business_referential
    check: "Prescription body patient_id must equal the referenced plan.patient_id"
    error_id: ERR_PATIENT_MISMATCH
    http_status: 409
    applies_to: "POST /clinic/prescriptions"

  - priority: 5.2
    category: business_referential
    check: "Acting clinician must own the plan (plan.clinician_id == X-User-ID)"
    error_id: ERR_CLINICIAN_MISMATCH
    http_status: 403
    applies_to: "POST /clinic/treatment-plans/{id}/activate, POST /clinic/prescriptions"

  - priority: 5.3
    category: business_referential
    check: "AdverseEvent triage reviewer (X-User-ID) must differ from plan.clinician_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /clinic/adverse-events/{id}/triage"

  - priority: 6.0
    category: business_safety
    check: "At least one REVIEWED LabPanel within MONITORING_WINDOW_DAYS before prescribing"
    error_id: ERR_MONITORING_OVERDUE
    http_status: 422
    applies_to: "POST /clinic/prescriptions"

  - priority: 6.1
    category: business_safety
    check: "Latest REVIEWED LabPanel hematocrit_pct must be < 54.0 for titration confirm / resume"
    error_id: ERR_HEMATOCRIT_UNSAFE
    http_status: 422
    applies_to: "POST /clinic/treatment-plans/{id}/titrations/{titrationId}/confirm, POST /clinic/treatment-plans/{id}/resume"

  - priority: 7.0
    category: business_temporal
    check: "No other SCHEDULED TelehealthVisit for the same clinician within TELEHEALTH_BUFFER_MINUTES of this interval"
    error_id: ERR_CLINICIAN_DOUBLE_BOOKED
    http_status: 409
    applies_to: "POST /clinic/telehealth-visits"

  - priority: 7.1
    category: business_temporal
    check: "Count of SCHEDULED LabDrawAppointments whose half-open interval overlaps this one at the station must be < concurrent_capacity"
    error_id: ERR_DRAW_STATION_AT_CAPACITY
    http_status: 409
    applies_to: "POST /clinic/lab-draw-appointments"

  - priority: 8.0
    category: business_fiscal
    check: "Membership payment_status must be CURRENT for refill create"
    error_id: ERR_MEMBERSHIP_DELINQUENT
    http_status: 402
    applies_to: "POST /clinic/refill-orders"

  - priority: 8.1
    category: business_fiscal
    check: "Membership must have >= 1 lab_draw_credits_remaining to book a lab-draw appointment"
    error_id: ERR_INSUFFICIENT_LAB_DRAW_CREDITS
    http_status: 402
    applies_to: "POST /clinic/lab-draw-appointments"

  - priority: 9.0
    category: business_constraint
    check: "Prescription.refills_remaining >= 1 to dispense"
    error_id: ERR_NO_REFILLS_REMAINING
    http_status: 409
    applies_to: "POST /clinic/refill-orders/{id}/dispense"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
