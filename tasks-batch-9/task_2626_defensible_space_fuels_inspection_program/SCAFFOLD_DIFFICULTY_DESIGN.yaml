  - rule_id: priority_pair_validation_conflict
    instances:

      - name: notice_not_overdue_outranks_abatement_cap_exceeded_rejected
        priority_pair: [40, 72]
        grounds:
          - validations.priority_40
          - validations.priority_72
          - errors.ERR_NOTICE_NOT_OVERDUE
          - errors.ERR_ABATEMENT_CAP_EXCEEDED
          - endpoints."POST /fire-district/violation-notices/{notice_id}/authorize-abatement"
        distinguishing_aspect: |
          Pairs a state rule (priority 40, ERR_NOTICE_NOT_OVERDUE, 409) against a
          business_fiscal rule (priority 72, ERR_ABATEMENT_CAP_EXCEEDED, 422) on the same
          request, a 32-point priority gap across two different categories. Both conditions
          are true at once: the notice is still ISSUED and estimated_cost_cents 900000 exceeds
          ABATEMENT_CAP_CENTS 750000. The instance then shows the pair is genuinely ordered
          rather than accidentally shadowed, by repairing only the state and watching the
          422 appear. The sibling instance in this rule uses the opposite status ordering.
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z, one ACTIVE cycle with notice_lead_days 10."
