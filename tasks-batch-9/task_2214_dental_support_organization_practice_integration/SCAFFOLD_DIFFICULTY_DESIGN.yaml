          assert:
            - "After reserve: Affiliation.${aff_id}.earnout_reserved_cents == 14216163, earnout_settled_cents == 0, earnout_unallocated_cents == 75783837, and 75783837 + 14216163 + 0 == earnout_pool_cents 90000000"
