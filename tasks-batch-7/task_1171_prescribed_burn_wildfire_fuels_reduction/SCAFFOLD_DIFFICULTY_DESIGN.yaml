          Half-open [window_start, window_end) intervals PLUS a mandatory 1-day rest buffer:
          [05-12,05-13] CONFIRMED blocks a confirm of [05-13,05-14] (zero visible gap, buffer
          violated), while [05-14,05-15] (exactly one rest day) confirms cleanly. Resource:
          Contractor.
