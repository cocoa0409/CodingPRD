      - name: cc_occ_stale_claim_version_refuses_the_dispatch_and_the_supersede
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.dispatch-create-stale-claim
          - validations.occ-claim-version
          - errors[ERR_STALE_CLAIM_VERSION]
          - endpoints[POST /claims/{claimId}/dispatches]
        distinguishing_aspect: "Claim.version moves twice on the dispatch path - once on the triage decision and once on the dispatch itself - so the same expected_claim_version is stale at two different points: the first dispatch drafted before triage is refused, and the supersede drafted before the first dispatch is refused as well."
        test_recipe:
          setup:
            - "One ACTIVE enrollment, two contractors, and one claim filed in TRIAGE at clock 2026-09-10T08:00:00.000Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00.000Z" }
              as: PlatformAdmin
