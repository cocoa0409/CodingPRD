  - rule_id: non_linear_state_machine
    instances:

      - name: referral_intake_dimension_advances_while_consent_dimension_stays_put
        grounds:
          - state_machines.Referral.RECEIVED_to_SUPERSEDED
          - entities.Referral.fields.intake_status
          - entities.Referral.fields.consent_status
          - entities.Referral.fields.superseded_by_referral_id
          - calculations.child_status_precedence
        distinguishing_aspect: |
          Referral carries two orthogonal state dimensions: a second referral for
          the same child drives the first referral's intake_status from RECEIVED
          to SUPERSEDED while its consent_status remains exactly NOT_REQUESTED,
          proving the dimensions are not a single linear chain.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "One child born 2023-11-01 (33 months old)."
            - "One referral from a pediatrician in intake_status RECEIVED and consent_status NOT_REQUESTED, with no consent record issued."
          setup_api_calls:
            - call: "POST /child-find/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: DistrictAdmin
            - call: "POST /child-find/children"
              payload: { first_name: "Ana", last_name: "Reyes", date_of_birth: "2023-11-01", guardian_full_name: "Marta Reyes", district_of_residence: "D-01", primary_language_code: "en" }
              as: ChildFindCoordinator
              captures: { child_id: "$.data.id" }
            - call: "POST /child-find/referrals"
              payload: { child_id: "${child_id}", source: "PEDIATRICIAN", referring_provider_npi: "1234567893" }
              as: ChildFindCoordinator
              captures: { referral1_id: "$.data.id" }
          trigger:
            - call: "POST /child-find/referrals"
              payload: { child_id: "${child_id}", source: "PARENT" }
              as: ChildFindCoordinator
              captures: { referral2_id: "$.data.id" }
          assert:
            - "Referral.${referral1_id}.intake_status == \"SUPERSEDED\""
            - "Referral.${referral1_id}.consent_status == \"NOT_REQUESTED\""
            - "Referral.${referral1_id}.superseded_by_referral_id == ${referral2_id}"
            - "Referral.${referral2_id}.intake_status == \"RECEIVED\""
            - "Referral.${referral2_id}.consent_status == \"NOT_REQUESTED\""
            - "Referral.${referral2_id}.age_months_at_referral == 33"
            - "Referral.${referral2_id}.eligibility_pathway == \"STANDARD_60_DAY\""
            - "Child.${child_id}.status == \"REFERRED\""

      - name: evaluation_case_report_revision_cycle_terminates_at_two_rounds
        grounds:
          - state_machines.EvaluationCase.REPORT_DRAFTED_to_REVISIONS_REQUESTED
          - state_machines.EvaluationCase.REVISIONS_REQUESTED_to_REPORT_DRAFTED
          - entities.EvaluationCase.fields.revision_round
          - validations[priority=27]
        distinguishing_aspect: |
          The case loops REPORT_DRAFTED -> REVISIONS_REQUESTED -> REPORT_DRAFTED
          twice, incrementing revision_round to 1 then 2, and the third revision
          request is refused with ERR_REVISION_LIMIT_REACHED while the case stays
          in REPORT_DRAFTED - a bounded cycle, not a forward-only chain.
