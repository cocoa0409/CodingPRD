              as_user_id: "adm-1"
              captures: { t8_v4: $.data.version, t8_state_mid: $.data.lifecycle_state, t8_posture_mid: $.data.continuity_posture }
            - call: "POST /continuity-windows"
              payload: { term_id: "${t8}", kind: "OUTAGE", window_start: "2027-07-20T00:00:00Z", window_end: "2027-07-21T00:00:00Z", expected_term_version: "${t8_v3}" }
              as: LmsAdmin
              as_user_id: "adm-1"
              captures: { win_err_2: $.data.error_id }
            - call: "POST /continuity-windows"
              payload: { term_id: "${t8}", kind: "OUTAGE", window_start: "2027-07-20T00:00:00Z", window_end: "2027-07-21T00:00:00Z", expected_term_version: "${t8_v4}" }
              as: LmsAdmin
              as_user_id: "adm-1"
              captures: { win_b: $.data.id, win_b_state: $.data.window_state, win_b_heads: $.data.affected_enrollment_count }
            - call: "GET /academic-terms/${t8}"
