        grounds:
          - validations[priority=10]
          - entities.Lane.fields.buffer_minutes
          - state_machines.Booking.REQUESTED_to_CONFIRMED
          - errors[ERR_LANE_TIME_CONFLICT]
        distinguishing_aspect: |
          Interval semantics WITH buffer: lane buffer_minutes=15 means a second booking
          starting exactly at the first's end_utc still collides (the closed-interval buffer
          [end, end+15) is occupied). Confirming the adjacent booking is rejected with
          ERR_LANE_TIME_CONFLICT even though the raw half-open intervals do not overlap.
        test_recipe:
          setup:
            - "Facility default; lane buffer_minutes=15; member waiver SIGNED wallet 100 tokens."
            - "Booking A CONFIRMED 09:00–10:00; Booking B REQUESTED 10:00–11:00 (touches A's end)."
          setup_api_calls:
            - call: "POST /v1/facilities"
              payload: { name: "F15", hourly_rate_cents: 4000, token_price_cents: 500 }
              as: FacilityManager
              captures: { fac_id: $.data.id }
            - call: "POST /v1/lanes"
              payload: { label: "Cage 1", kind: "CAGE", buffer_minutes: 15, facility_id: "${fac_id}" }
              as: FacilityManager
              captures: { lane_id: $.data.id, lane_ver0: $.data.version }
            - call: "POST /v1/members"
              payload: { full_name: "Zoe", tier: "NONE", facility_id: "${fac_id}" }
              as: FacilityManager
              captures: { mem_id: $.data.id }
            - call: "POST /v1/waivers"
              payload: { facility_id: "${fac_id}", member_id: "${mem_id}" }
              as: Member
              as_user_id: "${mem_id}"
            - call: "POST /v1/members/${mem_id}/wallet/top-up"
              payload: { tokens: 100 }
              as: FrontDesk
            - call: "POST /v1/bookings"
              payload: { lane_id: "${lane_id}", member_id: "${mem_id}", kind: "OPEN_SLOT", pay_mode: "TOKEN", start_utc: "2026-04-02T09:00:00Z", end_utc: "2026-04-02T10:00:00Z", facility_id: "${fac_id}" }
              as: Member
              as_user_id: "${mem_id}"
              captures: { bk_a: $.data.id }
            - call: "POST /v1/bookings/${bk_a}/confirm"
              payload: { expected_lane_version: "${lane_ver0}" }
              as: Member
              as_user_id: "${mem_id}"
            - call: "POST /v1/bookings"
              payload: { lane_id: "${lane_id}", member_id: "${mem_id}", kind: "OPEN_SLOT", pay_mode: "TOKEN", start_utc: "2026-04-02T10:00:00Z", end_utc: "2026-04-02T11:00:00Z", facility_id: "${fac_id}" }
              as: Member
              as_user_id: "${mem_id}"
              captures: { bk_b: $.data.id }
            - call: "GET /v1/lanes/${lane_id}"
              payload: {}
              as: FacilityManager
              captures: { lane_ver1: $.data.version }
          trigger:
            - call: "POST /v1/bookings/${bk_b}/confirm"
              payload: { expected_lane_version: "${lane_ver1}" }
              as: Member
              as_user_id: "${mem_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_LANE_TIME_CONFLICT"

      - name: pure_half_open_booking_overlap_rejects_confirm
        grounds:
          - validations[priority=10]
          - entities.Booking.fields.start_utc
          - state_machines.Booking.REQUESTED_to_CONFIRMED
          - errors[ERR_LANE_TIME_CONFLICT]
        distinguishing_aspect: |
          Different interval semantics from the buffered case: on a zero-buffer lane the
          conflict is pure half-open [start,end) overlap arithmetic (no buffer addend). A
          second booking 09:30–10:30 overlapping a CONFIRMED 09:00–10:00 booking by 30 minutes
          is rejected with ERR_LANE_TIME_CONFLICT — the geometric test is interval intersection,
          not the closed-adjacency buffer test used in lane_buffer_adjacency_rejects_back_to_back.
        test_recipe:
          setup:
            - "Facility default; lane buffer_minutes=0; member waiver SIGNED wallet 100 tokens."
            - "Booking A CONFIRMED 09:00–10:00; Booking B REQUESTED 09:30–10:30 (overlaps A by 30 min)."
          setup_api_calls:
            - call: "POST /v1/facilities"
              payload: { name: "F16", hourly_rate_cents: 4000, token_price_cents: 500 }
              as: FacilityManager
              captures: { fac_id: $.data.id }
            - call: "POST /v1/lanes"
              payload: { label: "Cage 1", kind: "CAGE", buffer_minutes: 0, facility_id: "${fac_id}" }
              as: FacilityManager
              captures: { lane_id: $.data.id, lane_ver0: $.data.version }
            - call: "POST /v1/members"
              payload: { full_name: "Ari", tier: "NONE", facility_id: "${fac_id}" }
              as: FacilityManager
              captures: { mem_id: $.data.id }
            - call: "POST /v1/waivers"
              payload: { facility_id: "${fac_id}", member_id: "${mem_id}" }
              as: Member
              as_user_id: "${mem_id}"
            - call: "POST /v1/members/${mem_id}/wallet/top-up"
              payload: { tokens: 100 }
              as: FrontDesk
            - call: "POST /v1/bookings"
              payload: { lane_id: "${lane_id}", member_id: "${mem_id}", kind: "OPEN_SLOT", pay_mode: "TOKEN", start_utc: "2026-04-02T09:00:00Z", end_utc: "2026-04-02T10:00:00Z", facility_id: "${fac_id}" }
              as: Member
              as_user_id: "${mem_id}"
              captures: { bk_a: $.data.id }
            - call: "POST /v1/bookings/${bk_a}/confirm"
              payload: { expected_lane_version: "${lane_ver0}" }
              as: Member
              as_user_id: "${mem_id}"
            - call: "POST /v1/bookings"
              payload: { lane_id: "${lane_id}", member_id: "${mem_id}", kind: "OPEN_SLOT", pay_mode: "TOKEN", start_utc: "2026-04-02T09:30:00Z", end_utc: "2026-04-02T10:30:00Z", facility_id: "${fac_id}" }
              as: Member
              as_user_id: "${mem_id}"
              captures: { bk_b: $.data.id }
            - call: "GET /v1/lanes/${lane_id}"
              payload: {}
              as: FacilityManager
              captures: { lane_ver1: $.data.version }
          trigger:
            - call: "POST /v1/bookings/${bk_b}/confirm"
              payload: { expected_lane_version: "${lane_ver1}" }
              as: Member
              as_user_id: "${mem_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_LANE_TIME_CONFLICT"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: token_wallet_conserved_on_confirm_then_cancel_full_refund
        grounds:
          - state_machines.Booking.REQUESTED_to_CONFIRMED
          - state_machines.Booking.CONFIRMED_to_CANCELLED
          - calculations.token_cost
          - calculations.refund_policy
          - entities.Member.fields.token_balance
        distinguishing_aspect: |
          Conserved quantity = member token wallet. Confirm debits token_cost; cancelling
          more than REFUND_CUTOFF_MIN before start refunds the full token_cost. Invariant:
          member.token_balance after (confirm then full-refund cancel) == balance before
          confirm (100). No drift.
        test_recipe:
          setup:
            - "Facility default token_price_cents=500; lane; member waiver SIGNED wallet 100 tokens."
            - "Clock 2026-04-05T00:00:00Z; booking 2026-04-05T09:00–10:00 off-peak (cancel >2h before start)."
          setup_api_calls:
            - call: "POST /v1/facilities"
              payload: { name: "F17", hourly_rate_cents: 4000, token_price_cents: 500 }
              as: FacilityManager
              captures: { fac_id: $.data.id }
            - call: "POST /v1/lanes"
              payload: { label: "Cage 1", kind: "CAGE", buffer_minutes: 0, facility_id: "${fac_id}" }
              as: FacilityManager
              captures: { lane_id: $.data.id, lane_ver: $.data.version }
            - call: "POST /v1/members"
              payload: { full_name: "Bo", tier: "NONE", facility_id: "${fac_id}" }
              as: FacilityManager
              captures: { mem_id: $.data.id }
            - call: "POST /v1/waivers"
              payload: { facility_id: "${fac_id}", member_id: "${mem_id}" }
              as: Member
              as_user_id: "${mem_id}"
            - call: "POST /v1/members/${mem_id}/wallet/top-up"
              payload: { tokens: 100 }
              as: FrontDesk
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-05T00:00:00Z" }
              as: FacilityManager
            - call: "POST /v1/bookings"
              payload: { lane_id: "${lane_id}", member_id: "${mem_id}", kind: "OPEN_SLOT", pay_mode: "TOKEN", start_utc: "2026-04-05T09:00:00Z", end_utc: "2026-04-05T10:00:00Z", facility_id: "${fac_id}" }
              as: Member
              as_user_id: "${mem_id}"
              captures: { bk_id: $.data.id }
            - call: "POST /v1/bookings/${bk_id}/confirm"
              payload: { expected_lane_version: "${lane_ver}" }
              as: Member
              as_user_id: "${mem_id}"
          trigger:
            - call: "POST /v1/bookings/${bk_id}/cancel"
              payload: {}
              as: Member
              as_user_id: "${mem_id}"
          assert:
            - "Booking.${bk_id}.status == CANCELLED"
            - "Member.${mem_id}.token_balance == 100"

      - name: member_minutes_conserved_on_confirm_then_cancel
        grounds:
          - state_machines.Booking.REQUESTED_to_CONFIRMED
          - state_machines.Booking.CONFIRMED_to_CANCELLED
          - calculations.member_minutes_ledger
          - entities.Member.fields.monthly_member_minutes_used
        distinguishing_aspect: |
          Conserved quantity = membership minutes ledger (a different conserved quantity than
          the token wallet). Confirming a MEMBERSHIP booking adds duration*lane_count minutes;
          cancelling it restores them fully (minutes are never forfeited on cancel).
          monthly_member_minutes_used returns to 0 after confirm-then-cancel.
        test_recipe:
          setup:
            - "Facility default; lane; member tier GOLD waiver SIGNED (membership covers cost, no tokens needed)."
            - "MEMBERSHIP OPEN_SLOT booking 60 min, lane_count 1 (adds 60 minutes), then cancelled."
          setup_api_calls:
            - call: "POST /v1/facilities"
              payload: { name: "F18", hourly_rate_cents: 4000, token_price_cents: 500 }
              as: FacilityManager
              captures: { fac_id: $.data.id }
            - call: "POST /v1/lanes"
              payload: { label: "Cage 1", kind: "CAGE", buffer_minutes: 0, facility_id: "${fac_id}" }
              as: FacilityManager
              captures: { lane_id: $.data.id, lane_ver: $.data.version }
            - call: "POST /v1/members"
              payload: { full_name: "Cy", tier: "GOLD", facility_id: "${fac_id}" }
              as: FacilityManager
              captures: { mem_id: $.data.id }
            - call: "POST /v1/waivers"
              payload: { facility_id: "${fac_id}", member_id: "${mem_id}" }
              as: Member
              as_user_id: "${mem_id}"
            - call: "POST /v1/bookings"
              payload: { lane_id: "${lane_id}", member_id: "${mem_id}", kind: "OPEN_SLOT", pay_mode: "MEMBERSHIP", start_utc: "2026-04-02T09:00:00Z", end_utc: "2026-04-02T10:00:00Z", facility_id: "${fac_id}" }
              as: Member
              as_user_id: "${mem_id}"
              captures: { bk_id: $.data.id }
            - call: "POST /v1/bookings/${bk_id}/confirm"
              payload: { expected_lane_version: "${lane_ver}" }
              as: Member
              as_user_id: "${mem_id}"
          trigger:
            - call: "POST /v1/bookings/${bk_id}/cancel"
              payload: {}
              as: Member
              as_user_id: "${mem_id}"
          assert:
            - "Booking.${bk_id}.status == CANCELLED"
            - "Member.${mem_id}.monthly_member_minutes_used == 0"
