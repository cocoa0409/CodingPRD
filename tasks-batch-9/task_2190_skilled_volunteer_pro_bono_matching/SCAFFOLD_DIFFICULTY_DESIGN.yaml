  - rule_id: compensating_invariant
    instances:
      - name: cycle_slot_released_exactly_on_termination
        grounds:
          - invariants.INV_CYCLE_SLOT_CONSERVATION
          - state_machines.Engagement.work_status.IN_PROGRESS_to_TERMINATED
          - calculations.cycle_posture
        distinguishing_aspect: |
          The plain forward/compensating pair on the SLOT quantity, with no other holder in the
          cycle, so every term of the conservation identity is pinned to a literal.
          Arithmetic on cycle 2026-Q1 (capacity_slot_total = 10):
            empty DB              -> slots_committed 0, slots_reserved 0, slots_available 10,
                                     utilization_ratio = round(0/10,4) = 0.0000 -> posture OPEN
            after /match          -> reserved 1, committed 0, available = max(0, 10-0-1) = 9,
                                     utilization_ratio = round(1/10,4) = 0.1000 -> OPEN
            after /accept         -> reserved 0, committed 1, available = max(0, 10-1-0) = 9,
                                     utilization_ratio = round(1/10,4) = 0.1000 -> OPEN
            after /terminate      -> committed 0, reserved 0, available = max(0, 10-0-0) = 10,
                                     utilization_ratio = round(0/10,4) = 0.0000 -> OPEN
          Conservation identity holds at every step: 1+0+9 == 10 and 0+0+10 == 10.
          The naive implementer increments slots_committed on accept but never decrements it on
          terminate, leaving committed 1 / available 9 forever (a stranded slot, and after ten
          such cycles the cycle wedges at posture FROZEN with no live engagement at all). The
          second trap is decrementing slots_reserved a second time on terminate: reserved was
          already migrated to committed at accept time, so a second decrement drives reserved
          to -1 and available to 11, which is above capacity_slot_total.
        test_recipe:
          setup:
            - "Cycle 2026-Q1 open with 10 slots; LARGE partner (annual_budget_usd 12000000.00 -> capacity_class LARGE, max_concurrent_engagements 6); SENIOR volunteer at 150.00/h, vetted with LEGAL_CONTRACTS proficiency 4 verified."
