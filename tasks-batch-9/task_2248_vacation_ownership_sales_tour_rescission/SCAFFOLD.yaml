scenario: "2248. Vacation Ownership Sales Tour & Rescission (timeshare sales and marketing operations): tour generation channels with incentive gifts, minimum qualification criteria and no-show rates, tour scheduling, sales gallery capacity and representative assignment rotation, presentation compliance with required disclosures, prohibited claims and recorded acknowledgments, purchase agreement execution with public offering statement delivery and financing application, statutory rescission period administration with cancellation intake and full refund obligations, contract funding, deed or right-to-use recording and closing document delivery, cancellation rate and rescission analysis by representative with compliance retraining, owner upgrade and equity trade-in programs"
domain_name: vacation-ownership-sales-tour-rescission
api_prefix: ""

complexity_profile:
  difficulty_level: expert_plus
  primary_archetype: compliance_audit
  secondary_archetype: temporal_windowing
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers

  entity_topology: flat
  entity_topology_note: |
    Every entity is a peer top-level collection (`/tour-channels`, `/sales-galleries`,
    `/tour-bookings`, `/purchase-agreements`, ...). No entity id is nested inside another
    entity's URL path except for the two append-only event children
    (`/sales-presentations/{id}/disclosure-acknowledgments`,
    `/sales-presentations/{id}/prohibited-claim-findings`), which are read-only
    sub-resource projections; their writes go to flat collections. `api_prefix` is
    deliberately empty because there is no single owning aggregate root.

  state_machine_shape: parallel
  state_machine_shape_note: |
    PurchaseAgreement and SalesPresentation each carry two independent state dimensions
    that advance on different triggers (`rescission_status` x `fulfillment_status`;
    `disclosure_status` x `review_status`). TourBooking is cyclic
    (SCHEDULED -> RESCHEDULE_PENDING -> SCHEDULED, capped) and
    ComplianceRetrainingAssignment is cyclic (ASSIGNED -> IN_PROGRESS -> FAILED -> ASSIGNED).
    FinancingApplication and RescissionRequest are branching fork machines with divergent
    side-effect sets per branch.

  relationship_patterns:
    - one_to_many
    - self_referential      # PurchaseAgreement.traded_in_agreement_id -> PurchaseAgreement.id
    - cross_aggregate       # SalesRepresentative <-> SalesGallery <-> TourChannel gating

  role_model: segregation_of_duties
  role_model_note: |
    Six non-overlapping duty roles. Two explicit same-person prohibitions are enforced on
    X-User-ID: (1) a ComplianceOfficer who filed any ProhibitedClaimFinding on a
    SalesPresentation may not review that presentation; (2) the ContractAdministrator who
    adjudicated a RescissionRequest may not issue its RefundDisbursement.

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# ===========================================================================
# 1.1  Entity-Relationship Table
# ===========================================================================
entities:

  - name: TourChannel
    parent: null
    common_fields: true
    entity_kind: configuration
    fields:
      - name: name
        type: string
        source: input
        description: Human-readable marketing channel name.
        constraints: "1..120 chars"
      - name: channel_code
        type: enum
        source: input
        description: Tour-generation channel classification; drives the affinity bonus in tour_qualification_evaluation.
        constraints: "one of OFF_PROPERTY_CONTACT, IN_HOUSE_REFERRAL, MINI_VAC_PACKAGE, TELEMARKETING, OWNER_UPGRADE; globally unique"
      - name: incentive_gift_value_cents
        type: integer
        source: input
        description: Cents value of the incentive gift handed to a prospect at tour check-in.
        constraints: ">= 0 and <= 100000"
      - name: min_age
        type: integer
        source: input
        description: Minimum primary-occupant age accepted by this channel.
        constraints: "18..99"
      - name: min_household_income_cents
        type: integer
        source: input
        description: Minimum annual household income in cents accepted by this channel.
        constraints: ">= 0"
      - name: requires_married_household
        type: boolean
        source: input
        description: When true, only Prospects with marital_status == MARRIED may be booked on this channel.
        default: false
      - name: min_qualification_score
        type: integer
        source: input
        description: Minimum tour_qualification_evaluation score required to book a tour on this channel.
        constraints: "0..100"
      - name: status
        type: enum
        source: system
        description: Channel lifecycle state.
        default: ACTIVE
        constraints: "one of ACTIVE, SUSPENDED"
      - name: booked_count
        type: integer
        source: computed
        description: Count of TourBooking rows ever created against this channel (never decremented).
        default: 0
      - name: toured_count
        type: integer
        source: computed
        description: Count of TourBooking rows for this channel that reached status TOURED.
        default: 0
      - name: no_show_count
        type: integer
        source: computed
        description: Count of TourBooking rows for this channel that reached status NO_SHOW.
        default: 0
      - name: historical_no_show_rate
        type: number
        source: computed
        description: Output of calculations.channel_no_show_rate; 4 decimal places.
        default: 0.0000
      - name: gift_liability_cents
        type: integer
        source: computed
        description: Output of calculations.gift_liability_ledger; outstanding incentive-gift liability in cents.
        default: 0

  - name: SalesGallery
    parent: null
    common_fields: true
    entity_kind: resource
    fields:
      - name: name
        type: string
        source: input
        description: Sales gallery display name.
        constraints: "1..120 chars"
      - name: site_code
        type: string
        source: input
        description: Short site code; globally unique.
        constraints: "3..8 uppercase chars; unique"
      - name: concurrent_tour_capacity
        type: integer
        source: input
        description: Maximum number of TourBooking intervals that may occupy the gallery at overlapping times per calculations.gallery_capacity_overlap_check.
        constraints: "1..20"
      - name: presentation_minutes
        type: integer
        source: input
        description: Fixed presentation length in minutes; defines every TourBooking's scheduled_end_utc.
        constraints: "30..480"
      - name: buffer_minutes
        type: integer
        source: input
        description: Turnaround buffer appended to the END of each gallery interval in the capacity overlap test.
        default: 0
        constraints: "0..120"
      - name: status
        type: enum
        source: system
        description: Gallery posture; RESTRICTED and OPEN are re-derived whenever available_rep_count changes.
        default: OPEN
        constraints: "one of OPEN, RESTRICTED, CLOSED"
      - name: booked_slot_count
        type: integer
        source: computed
        description: Output of calculations.gallery_slot_occupancy_ledger; live occupied slot count.
        default: 0
      - name: available_rep_count
        type: integer
        source: computed
        description: "Count of SalesRepresentative rows with gallery_id == this gallery and status IN {ACTIVE, ON_TOUR}."
        default: 0

  - name: SalesRepresentative
    parent: null
    common_fields: true
    entity_kind: resource
    fields:
      - name: gallery_id
        type: string
        source: input
        description: FK -> SalesGallery.id; the gallery whose rotation this representative belongs to.
      - name: full_name
        type: string
        source: input
        description: Representative full name.
        constraints: "1..120 chars"
      - name: license_number
        type: string
        source: input
        description: State sales license number; globally unique.
        constraints: "4..32 chars; unique"
      - name: rotation_position
        type: integer
        source: input
        description: Deterministic rotation ordinal used as the first tie-break in calculations.representative_rotation_selection.
        constraints: "1..99; unique per gallery_id"
      - name: status
        type: enum
        source: system
        description: Representative availability state.
        default: ACTIVE
        constraints: "one of ACTIVE, ON_TOUR, RETRAINING, SUSPENDED"
      - name: tours_taken_count
        type: integer
        source: computed
        description: Count of TourBooking rows with assigned_rep_id == this rep that reached status TOURED; primary rotation sort key.
        default: 0
      - name: executed_agreement_count
        type: integer
        source: computed
        description: Count of PurchaseAgreement rows with rep_id == this rep (lifetime, never decremented).
        default: 0
      - name: rescinded_agreement_count
        type: integer
        source: computed
        description: Count of PurchaseAgreement rows with rep_id == this rep and rescission_status == RESCINDED.
        default: 0
      - name: cancellation_rate
        type: number
        source: computed
        description: Snapshot output of calculations.representative_cancellation_rate at the last recompute; 4 decimal places.
        default: 0.0000
      - name: compliance_strike_count
        type: integer
        source: computed
        description: Number of times a SalesPresentation of this rep transitioned into review_status FLAGGED since the last COMPLETED retraining.
        default: 0
      - name: last_assigned_at
        type: datetime
        source: system
        description: Logical-clock instant of the most recent rotation assignment; null until first check-in.

  - name: Prospect
    parent: null
    common_fields: true
    entity_kind: resource
    fields:
      - name: household_name
        type: string
        source: input
        description: Prospect household name.
        constraints: "1..120 chars"
      - name: primary_age
        type: integer
        source: input
        description: Age of the primary occupant.
        constraints: "18..99"
      - name: household_income_cents
        type: integer
        source: input
        description: Annual household income in cents.
        constraints: ">= 0"
      - name: marital_status
        type: enum
        source: input
        description: Marital status of the household.
        constraints: "one of MARRIED, SINGLE"
      - name: is_existing_owner
        type: boolean
        source: computed
        description: "Cross-entity computed: true iff at least one PurchaseAgreement exists with prospect_id == this prospect and fulfillment_status IN {FUNDED, RECORDED, DOCS_DELIVERED, TRADED_IN}."
        default: false

  - name: TourBooking
    parent: null
    common_fields: true
    entity_kind: resource
    fields:
      - name: channel_id
        type: string
        source: input
        description: FK -> TourChannel.id; the tour-generation channel that produced this booking.
      - name: prospect_id
        type: string
        source: input
        description: FK -> Prospect.id; the household being toured. A Prospect may hold many TourBooking rows; no uniqueness constraint applies.
      - name: gallery_id
        type: string
        source: input
        description: FK -> SalesGallery.id; the gallery hosting the tour.
      - name: assigned_rep_id
        type: string
        source: system
        description: FK -> SalesRepresentative.id; set by calculations.representative_rotation_selection at check-in, null before that.
      - name: scheduled_start_utc
        type: datetime
        source: input
        description: Start of the gallery interval this booking occupies.
      - name: scheduled_end_utc
        type: datetime
        source: computed
        description: scheduled_start_utc + gallery.presentation_minutes.
      - name: status
        type: enum
        source: system
        description: Booking lifecycle state.
        default: SCHEDULED
        constraints: "one of SCHEDULED, RESCHEDULE_PENDING, CHECKED_IN, TOURED, NO_SHOW, CANCELLED"
      - name: qualification_score
        type: integer
        source: computed
        description: Output of calculations.tour_qualification_evaluation, frozen at booking creation.
      - name: qualification_penalty_points
        type: integer
        source: computed
        description: The no-show penalty component subtracted inside tour_qualification_evaluation, frozen at booking creation.
      - name: gift_issued
        type: boolean
        source: system
        description: True when the incentive gift was handed over at check-in.
        default: false
      - name: gift_value_cents
        type: integer
        source: computed
        description: Copy of channel.incentive_gift_value_cents at check-in when gift_issued is true, else 0.
        default: 0
      - name: reschedule_count
        type: integer
        source: system
        description: Number of completed reschedule cycles; capped by RESCHEDULE_LIMIT.
        default: 0
      - name: reschedule_reason
        type: string
        source: system
        description: Reason text supplied on the most recent reschedule request; null before the first request.
      - name: cancel_reason
        type: string
        source: system
        description: Reason text supplied on cancellation, or the literal "CHANNEL_SUSPENDED" when cancelled by the channel-suspension cascade; null otherwise.
      - name: checked_in_at
        type: datetime
        source: system
        description: Logical-clock instant of check-in; null before check-in.

  - name: SalesPresentation
    parent: null
    common_fields: true
    entity_kind: resource
    fields:
      - name: booking_id
        type: string
        source: input
        description: FK -> TourBooking.id; at most one SalesPresentation per TourBooking.
      - name: rep_id
        type: string
        source: computed
        description: FK -> SalesRepresentative.id; copied from booking.assigned_rep_id at creation.
      - name: window_start_utc
        type: datetime
        source: computed
        description: Copied from booking.scheduled_start_utc; the left endpoint of the representative exclusivity interval.
      - name: window_end_utc
        type: datetime
        source: computed
        description: Copied from booking.scheduled_end_utc; the right endpoint of the representative exclusivity interval.
      - name: started_at
        type: datetime
        source: system
        description: Logical-clock instant the presentation record was opened.
      - name: recorded_ack_reference
        type: string
        source: input
        description: External reference to the audio/video recording that captures the prospect acknowledgments.
        constraints: "4..64 chars"
      - name: required_disclosure_count
        type: integer
        source: system
        description: Number of distinct REQUIRED_DISCLOSURE_CODES that must be acknowledged; fixed at 3.
        default: 3
      - name: disclosure_ack_count
        type: integer
        source: computed
        description: Count of DISTINCT disclosure_code values in REQUIRED_DISCLOSURE_CODES acknowledged with acknowledged_by_prospect == true for this presentation.
        default: 0
      - name: disclosure_status
        type: enum
        source: system
        description: First independent state dimension; advances only on disclosure acknowledgment appends.
        default: PENDING
        constraints: "one of PENDING, PARTIAL, COMPLETE"
      - name: review_status
        type: enum
        source: system
        description: Second independent state dimension; advances on compliance review and on prohibited-claim appends.
        default: UNREVIEWED
        constraints: "one of UNREVIEWED, CLEARED, FLAGGED"
      - name: prohibited_claim_points
        type: integer
        source: computed
        description: Sum of penalty_points over all ProhibitedClaimFinding rows for this presentation.
        default: 0
      - name: compliance_score
        type: integer
        source: computed
        description: Output of calculations.presentation_compliance_score. At creation disclosure_ack_count is 0, so the formula yields 100 - 0 - 30 = 70.
        default: 70
      - name: reviewed_by_user_id
        type: string
        source: system
        description: X-User-ID of the ComplianceOfficer who last issued a manual review decision; null before the first review.
      - name: flag_count
        type: integer
        source: computed
        description: Number of times this presentation has transitioned into review_status FLAGGED.
        default: 0

  - name: DisclosureAcknowledgment
    parent: SalesPresentation
    common_fields: false
    entity_kind: event
    fields:
      - name: presentation_id
        type: string
        source: input
        description: FK -> SalesPresentation.id; the presentation this acknowledgment belongs to.
      - name: disclosure_code
        type: enum
        source: input
        description: Which statutory disclosure was read to and acknowledged by the prospect.
        constraints: "one of RESCISSION_RIGHTS, PUBLIC_OFFERING_STATEMENT_DELIVERY, NOT_AN_INVESTMENT, MAINTENANCE_FEE_ESCALATION; unique per presentation_id"
      - name: acknowledged_by_prospect
        type: boolean
        source: input
        description: True when the prospect audibly acknowledged on the recording; false records a read-but-not-acknowledged event.
      - name: recording_timestamp_offset_seconds
        type: integer
        source: input
        description: Offset into recorded_ack_reference at which the acknowledgment occurs.
        constraints: ">= 0"
      - name: acknowledged_at
        type: datetime
        source: system
        description: Logical-clock instant the acknowledgment was appended.
      - name: counts_toward_required
        type: boolean
        source: computed
        description: "True iff disclosure_code IN REQUIRED_DISCLOSURE_CODES {RESCISSION_RIGHTS, PUBLIC_OFFERING_STATEMENT_DELIVERY, NOT_AN_INVESTMENT} and acknowledged_by_prospect == true."

  - name: ProhibitedClaimFinding
    parent: SalesPresentation
    common_fields: false
    entity_kind: event
    fields:
      - name: presentation_id
        type: string
        source: input
        description: FK -> SalesPresentation.id; the presentation the prohibited claim was made in.
      - name: claim_code
        type: enum
        source: input
        description: Which prohibited sales claim was detected.
        constraints: "one of GUARANTEED_RESALE, GUARANTEED_APPRECIATION, RENTAL_INCOME_PROMISE, UNLIMITED_AVAILABILITY"
      - name: severity
        type: enum
        source: input
        description: Severity band that maps to penalty_points.
        constraints: "one of MINOR, MAJOR, EGREGIOUS"
      - name: penalty_points
        type: integer
        source: computed
        description: "SEVERITY_PENALTY_POINTS[severity]: MINOR -> 5, MAJOR -> 15, EGREGIOUS -> 40."
      - name: reported_by_user_id
        type: string
        source: system
        description: X-User-ID of the reporting ComplianceOfficer; consumed by the review segregation-of-duties check.
      - name: detected_at
        type: datetime
        source: system
        description: Logical-clock instant the finding was appended.

  - name: PurchaseAgreement
    parent: null
    common_fields: true
    entity_kind: resource
    fields:
      - name: presentation_id
        type: string
        source: input
        description: FK -> SalesPresentation.id; at most one PurchaseAgreement per SalesPresentation.
      - name: prospect_id
        type: string
        source: computed
        description: FK -> Prospect.id; copied from the presentation's booking.prospect_id at execution.
      - name: rep_id
        type: string
        source: computed
        description: FK -> SalesRepresentative.id; copied from presentation.rep_id at execution.
      - name: traded_in_agreement_id
        type: string
        source: input
        description: FK -> PurchaseAgreement.id; self-referential link to the owner's prior agreement surrendered under the equity trade-in program; null for new-owner sales.
      - name: product_type
        type: enum
        source: input
        description: Whether the interest conveyed is a recorded deed or a right-to-use certificate.
        constraints: "one of DEEDED_INTEREST, RIGHT_TO_USE"
      - name: state_code
        type: enum
        source: input
        description: Jurisdiction of sale; selects the STATE_RESCISSION_RULES row.
        constraints: "one of FL, NV, CA, TX, HI"
      - name: purchase_price_cents
        type: integer
        source: input
        description: Gross contract price in cents before trade-in credit.
        constraints: ">= 100000"
      - name: down_payment_cents
        type: integer
        source: input
        description: Cash placed into escrow at execution.
        constraints: ">= 0"
      - name: pos_delivered_at
        type: datetime
        source: input
        description: Instant the public offering statement was delivered to the purchaser.
      - name: executed_at
        type: datetime
        source: system
        description: Logical-clock instant of execution.
      - name: trade_in_equity_credit_cents
        type: integer
        source: computed
        description: Output of calculations.trade_in_equity_credit; 0 when traded_in_agreement_id is null.
        default: 0
      - name: total_due_cents
        type: integer
        source: computed
        description: Step 1 of calculations.agreement_financials.
      - name: down_payment_required_cents
        type: integer
        source: computed
        description: Step 2 of calculations.agreement_financials.
      - name: base_financed_cents
        type: integer
        source: computed
        description: Step 3 of calculations.agreement_financials.
      - name: doc_stamp_cents
        type: integer
        source: computed
        description: Step 4a of calculations.agreement_financials; assessed on base_financed_cents, not on financed_amount_cents.
      - name: closing_cost_fee_cents
        type: integer
        source: computed
        description: Step 4b of calculations.agreement_financials.
      - name: financed_amount_cents
        type: integer
        source: computed
        description: Step 5 of calculations.agreement_financials.
      - name: escrow_collected_cents
        type: integer
        source: computed
        description: Cash held in escrow; set equal to down_payment_cents at execution and never changed thereafter.
      - name: total_collected_cents
        type: integer
        source: computed
        description: escrow_collected_cents + the lender/cash amount collected at funding; 0 until funding.
        default: 0
      - name: retained_cents
        type: integer
        source: computed
        description: Cents lawfully retained out of escrow on rescission settlement; 0 until a RefundDisbursement settles.
        default: 0
      - name: anchor_mode
        type: enum
        source: computed
        description: "STATE_RESCISSION_RULES[state_code].anchor; selects which variant of calculations.rescission_deadline applies."
        constraints: "one of EXECUTION, POS_DELIVERY, LATER_OF_EXECUTION_OR_POS"
      - name: statutory_rescission_days
        type: integer
        source: computed
        description: "STATE_RESCISSION_RULES[state_code].days."
      - name: rescission_anchor_utc
        type: datetime
        source: computed
        description: The anchor instant selected by anchor_mode.
      - name: rescission_deadline_utc
        type: datetime
        source: computed
        description: Output of calculations.rescission_deadline.
      - name: business_day_rolled
        type: boolean
        source: computed
        description: True when the raw deadline date was rolled forward off a weekend or FEDERAL_HOLIDAYS date.
      - name: refund_policy
        type: enum
        source: computed
        description: "STATE_RESCISSION_RULES[state_code].refund; selects which variant of calculations.refund_settlement applies."
        constraints: "one of STATUTORY_FULL, CONTRACTUAL_NET_OF_GIFT"
      - name: rescission_status
        type: enum
        source: system
        description: First independent state dimension; advances on the rescission sweep or on rescission adjudication.
        default: OPEN
        constraints: "one of OPEN, EXPIRED, RESCINDED"
      - name: fulfillment_status
        type: enum
        source: system
        description: Second independent state dimension; advances on funding, recording, document delivery, voiding and trade-in surrender.
        default: AWAITING_FUNDING
        constraints: "one of AWAITING_FUNDING, FUNDED, RECORDED, DOCS_DELIVERED, VOIDED, TRADED_IN"
      - name: funded_at
        type: datetime
        source: system
        description: Logical-clock instant of funding; null before funding. Used as the hold-period start in trade_in_equity_credit.
      - name: funding_reference
        type: string
        source: system
        description: Lender or treasury funding reference captured at funding; null before funding.

  - name: FinancingApplication
    parent: null
    common_fields: true
    entity_kind: resource
    fields:
      - name: agreement_id
        type: string
        source: input
        description: FK -> PurchaseAgreement.id; the agreement being financed.
      - name: requested_amount_cents
        type: integer
        source: input
        description: Amount the purchaser asks the lender to finance.
        constraints: ">= 1"
      - name: applicant_fico
        type: integer
        source: input
        description: Credit score used to select the underwriting tier.
        constraints: "300..850"
      - name: term_months
        type: integer
        source: input
        description: Amortization term.
        constraints: "one of 60, 120, 180"
      - name: status
        type: enum
        source: system
        description: Application lifecycle state.
        default: SUBMITTED
        constraints: "one of SUBMITTED, APPROVED, DECLINED, WITHDRAWN, CANCELLED"
      - name: apr_bps
        type: integer
        source: computed
        description: Annual rate in basis points from the FICO tier; null until decided.
      - name: max_ltv_rate
        type: number
        source: computed
        description: Loan-to-value ceiling rate from the FICO tier; null until decided.
      - name: ltv_cap_cents
        type: integer
        source: computed
        description: round_half_up((agreement.total_due_cents + agreement.closing_cost_fee_cents) * max_ltv_rate); null until decided.
      - name: approved_amount_cents
        type: integer
        source: computed
        description: min(requested_amount_cents, ltv_cap_cents); null unless status == APPROVED.
      - name: monthly_payment_cents
        type: integer
        source: computed
        description: Output of calculations.financing_underwriting amortization step; null unless status == APPROVED.
      - name: decided_at
        type: datetime
        source: system
        description: Logical-clock instant of the underwriting decision; null before it.
      - name: decided_by_user_id
        type: string
        source: system
        description: X-User-ID of the ContractAdministrator who decided; null before decision.

  - name: RescissionRequest
    parent: null
    common_fields: true
    entity_kind: resource
    fields:
      - name: agreement_id
        type: string
        source: input
        description: FK -> PurchaseAgreement.id; the agreement the purchaser is cancelling.
      - name: delivery_method
        type: enum
        source: input
        description: How the written cancellation notice reached the developer.
        constraints: "one of HAND_DELIVERED, CERTIFIED_MAIL, EMAIL"
      - name: postmark_utc
        type: datetime
        source: input
        description: Postmark instant on the certified-mail envelope; null for other delivery methods.
      - name: received_at
        type: datetime
        source: system
        description: Logical-clock instant intake was recorded.
      - name: intake_user_id
        type: string
        source: system
        description: X-User-ID of the ContractAdministrator who took the intake.
      - name: timeliness_basis
        type: enum
        source: computed
        description: Which variant of calculations.rescission_timeliness applied.
        constraints: "one of POSTMARK, RECEIPT"
      - name: effective_utc
        type: datetime
        source: computed
        description: The instant compared against agreement.rescission_deadline_utc.
      - name: is_timely
        type: boolean
        source: computed
        description: effective_utc <= agreement.rescission_deadline_utc (inclusive).
      - name: status
        type: enum
        source: system
        description: Intake lifecycle state.
        default: RECEIVED
        constraints: "one of RECEIVED, VALIDATED, REJECTED_LATE, REFUNDED"
      - name: adjudicated_at
        type: datetime
        source: system
        description: Logical-clock instant of adjudication; null before it.
      - name: adjudicated_by_user_id
        type: string
        source: system
        description: X-User-ID of the adjudicating ContractAdministrator; consumed by the refund segregation-of-duties check.

  - name: RefundDisbursement
    parent: null
    common_fields: true
    entity_kind: resource
    fields:
      - name: rescission_request_id
        type: string
        source: input
        description: FK -> RescissionRequest.id; the validated cancellation being refunded.
      - name: method
        type: enum
        source: input
        description: Disbursement rail.
        constraints: "one of ACH, CHECK, CARD_REVERSAL"
      - name: refund_policy_applied
        type: enum
        source: computed
        description: Copied from agreement.refund_policy at creation; records which variant of calculations.refund_settlement was used.
        constraints: "one of STATUTORY_FULL, CONTRACTUAL_NET_OF_GIFT"
      - name: base_refund_cents
        type: integer
        source: computed
        description: agreement.escrow_collected_cents at creation.
      - name: gift_recapture_cents
        type: integer
        source: computed
        description: Incentive-gift value recaptured; always 0 under STATUTORY_FULL.
        default: 0
      - name: doc_fee_retained_cents
        type: integer
        source: computed
        description: Document preparation fee retained; always 0 under STATUTORY_FULL.
        default: 0
      - name: disbursed_amount_cents
        type: integer
        source: computed
        description: base_refund_cents - gift_recapture_cents - doc_fee_retained_cents.
      - name: status
        type: enum
        source: system
        description: Disbursement lifecycle state.
        default: PENDING
        constraints: "one of PENDING, ISSUED"
      - name: issued_by_user_id
        type: string
        source: system
        description: X-User-ID of the ContractAdministrator who created the disbursement.
      - name: settlement_reference
        type: string
        source: system
        description: Bank or check reference captured at settlement; null before settlement.
      - name: settled_at
        type: datetime
        source: system
        description: Logical-clock instant of settlement; null before it.

  - name: ClosingPackage
    parent: null
    common_fields: true
    entity_kind: resource
    fields:
      - name: agreement_id
        type: string
        source: input
        description: FK -> PurchaseAgreement.id; the funded agreement whose instrument is being recorded and delivered.
      - name: instrument_type
        type: enum
        source: computed
        description: DEED when agreement.product_type == DEEDED_INTEREST, RTU_CERTIFICATE when RIGHT_TO_USE.
        constraints: "one of DEED, RTU_CERTIFICATE"
      - name: recording_jurisdiction
        type: string
        source: system
        description: County or registry the instrument was recorded in; null before recording.
      - name: recording_reference
        type: string
        source: system
        description: Recording book/page or instrument number; null before recording.
      - name: recorded_at
        type: datetime
        source: system
        description: Logical-clock instant of recording; null before it.
      - name: delivery_method
        type: enum
        source: system
        description: How the closing documents were delivered; null before delivery.
        constraints: "one of COURIER, ELECTRONIC_PORTAL, CERTIFIED_MAIL"
      - name: documents_delivered_at
        type: datetime
        source: system
        description: Logical-clock instant of closing-document delivery; null before it.
      - name: status
        type: enum
        source: system
        description: Closing package lifecycle state.
        default: AWAITING_RECORDING
        constraints: "one of AWAITING_RECORDING, RECORDED, DELIVERED"

  - name: ComplianceRetrainingAssignment
    parent: null
    common_fields: true
    entity_kind: resource
    fields:
      - name: rep_id
        type: string
        source: input
        description: FK -> SalesRepresentative.id; the representative required to retrain.
      - name: trigger_reason
        type: enum
        source: input
        description: Why retraining was required; set by the system on cascade-created assignments and supplied in the body on manual assignments.
        constraints: "one of CANCELLATION_RATE_BREACH, PROHIBITED_CLAIM_POINTS, DISCLOSURE_GAP; at most one row per (rep_id, trigger_reason) may sit in status ASSIGNED or IN_PROGRESS"
      - name: required_module_count
        type: integer
        source: input
        description: Modules the rep must complete; cascade-created assignments use AUTO_RETRAINING_MODULE_COUNT.
        default: 4
        constraints: "1..10"
      - name: modules_completed
        type: integer
        source: system
        description: Modules reported complete at close.
        default: 0
      - name: status
        type: enum
        source: system
        description: Retraining lifecycle state; FAILED is non-terminal and cycles back to ASSIGNED.
        default: ASSIGNED
        constraints: "one of ASSIGNED, IN_PROGRESS, COMPLETED, FAILED"
      - name: cycle_index
        type: integer
        source: system
        description: 1 on first assignment; incremented by one on every FAILED -> ASSIGNED reassignment.
        default: 1
      - name: cancellation_rate_at_assignment
        type: number
        source: computed
        description: Snapshot of rep.cancellation_rate at assignment time; null when trigger_reason != CANCELLATION_RATE_BREACH.
      - name: strike_count_at_assignment
        type: integer
        source: computed
        description: Snapshot of rep.compliance_strike_count at assignment time.
      - name: assigned_at
        type: datetime
        source: system
        description: Logical-clock instant of the current assignment cycle.
      - name: started_at
        type: datetime
        source: system
        description: Logical-clock instant retraining began; null while ASSIGNED.
      - name: closed_at
        type: datetime
        source: system
        description: Logical-clock instant of the most recent close; null before the first close.

# ===========================================================================
# 1.2  State Machine Table
# ===========================================================================
state_machines:

  - entity: TourBooking
    shape: cyclic_with_branching
    initial_state: SCHEDULED
    terminal_states: [TOURED, NO_SHOW, CANCELLED]
    dimension: status
    transitions:
      - from: SCHEDULED
        to: RESCHEDULE_PENDING
        trigger: "POST /tour-bookings/{id}/reschedule-requests"
        actor: MarketingManager
        preconditions:
          - "booking.status == SCHEDULED"
          - "booking.reschedule_count < RESCHEDULE_LIMIT (2), else ERR_RESCHEDULE_LIMIT_EXCEEDED"
        side_effects:
          - "sets booking.reschedule_reason to the request reason"
          - "booking.updated_at refreshed; booking.version += 1"
          - "gallery.booked_slot_count unchanged (RESCHEDULE_PENDING remains an occupying status)"
        note: "First leg of the reschedule cycle; the interval is still held so the slot is not lost to another prospect."
      - from: RESCHEDULE_PENDING
        to: SCHEDULED
        trigger: "POST /tour-bookings/{id}/reschedule"
        actor: MarketingManager
        preconditions:
          - "booking.status == RESCHEDULE_PENDING"
          - "gallery.status == OPEN, else ERR_GALLERY_NOT_OPEN"
          - "channel.status == ACTIVE, else ERR_CHANNEL_SUSPENDED"
          - "new_scheduled_start_utc >= clock_now + MIN_BOOKING_LEAD_MINUTES (60), else ERR_TOUR_SLOT_IN_PAST"
          - "calculations.gallery_capacity_overlap_check on the NEW interval, excluding this booking itself from the candidate set, must not reach gallery.concurrent_tour_capacity, else ERR_GALLERY_CAPACITY_EXCEEDED"
        side_effects:
          - "booking.scheduled_start_utc = new_scheduled_start_utc; booking.scheduled_end_utc recomputed as start + gallery.presentation_minutes"
          - "booking.reschedule_count += 1"
          - "booking.qualification_score and booking.qualification_penalty_points are NOT recomputed (frozen at creation)"
        note: "Closes the SCHEDULED -> RESCHEDULE_PENDING -> SCHEDULED cycle; the cycle may run at most RESCHEDULE_LIMIT times."
      - from: SCHEDULED
        to: CHECKED_IN
        trigger: "POST /tour-bookings/{id}/check-in"
        actor: GalleryManager
        preconditions:
          - "booking.status == SCHEDULED"
          - "gallery.status == OPEN, else ERR_GALLERY_NOT_OPEN"
          - "channel.status == ACTIVE, else ERR_CHANNEL_SUSPENDED"
          - "calculations.representative_rotation_selection yields a non-empty candidate set, else ERR_NO_ELIGIBLE_REPRESENTATIVE"
        side_effects:
          - "booking.assigned_rep_id = the rep chosen by calculations.representative_rotation_selection"
          - "booking.checked_in_at = clock_now"
          - "chosen rep.status ACTIVE -> ON_TOUR; rep.last_assigned_at = clock_now"
          - "when issue_incentive_gift is true: booking.gift_issued = true, booking.gift_value_cents = channel.incentive_gift_value_cents, and channel.gift_liability_cents recomputed by calculations.gift_liability_ledger"
          - "gallery.available_rep_count unchanged (ON_TOUR still counts as available inventory)"
      - from: SCHEDULED
        to: NO_SHOW
        trigger: "POST /tour-bookings/{id}/no-show"
        actor: MarketingManager
        preconditions:
          - "booking.status == SCHEDULED"
          - "clock_now >= booking.scheduled_start_utc, else ERR_INVALID_BOOKING_STATE"
        side_effects:
          - "CASCADE STEP 1: channel.no_show_count += 1"
          - "CASCADE STEP 2 (caused by step 1): channel.historical_no_show_rate recomputed by calculations.channel_no_show_rate"
          - "CASCADE STEP 3 (caused by step 2): when channel.booked_count >= NO_SHOW_MIN_SAMPLE (4) AND channel.historical_no_show_rate >= NO_SHOW_SUSPEND_THRESHOLD (0.5000) AND channel.status == ACTIVE, then channel.status ACTIVE -> SUSPENDED"
          - "CASCADE STEP 4 (caused by step 3): every TourBooking with channel_id == channel.id and status IN {SCHEDULED, RESCHEDULE_PENDING} transitions to CANCELLED with cancel_reason = \"CHANNEL_SUSPENDED\", processed in created_at ASC order"
          - "CASCADE STEP 5 (caused by step 4): for each gallery touched by step 4, gallery.booked_slot_count recomputed by calculations.gallery_slot_occupancy_ledger"
          - "gallery.booked_slot_count for THIS booking's gallery recomputed (NO_SHOW is not an occupying status)"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /tour-bookings/{id}/cancel"
        actor: MarketingManager
        preconditions:
          - "booking.status == SCHEDULED"
        side_effects:
          - "booking.cancel_reason set from the request"
          - "gallery.booked_slot_count recomputed by calculations.gallery_slot_occupancy_ledger (compensating action for the +1 taken at creation)"
      - from: RESCHEDULE_PENDING
        to: CANCELLED
        trigger: "POST /tour-bookings/{id}/cancel"
        actor: MarketingManager
        preconditions:
          - "booking.status == RESCHEDULE_PENDING"
        side_effects:
          - "booking.cancel_reason set from the request"
          - "gallery.booked_slot_count recomputed by calculations.gallery_slot_occupancy_ledger"
      - from: CHECKED_IN
        to: CANCELLED
        trigger: "POST /tour-bookings/{id}/cancel"
        actor: MarketingManager
        preconditions:
          - "booking.status == CHECKED_IN"
          - "no SalesPresentation exists with booking_id == booking.id, else ERR_INVALID_BOOKING_STATE"
        side_effects:
          - "booking.cancel_reason set from the request"
          - "assigned rep.status ON_TOUR -> ACTIVE"
          - "channel.gift_liability_cents recomputed by calculations.gift_liability_ledger; this reverses the accrual taken at check-in exactly, because CANCELLED is not an accruing status"
          - "gallery.booked_slot_count recomputed by calculations.gallery_slot_occupancy_ledger"
        note: "Compensating action for check-in; the pair (check-in, cancel) leaves channel.gift_liability_cents and gallery.booked_slot_count at their pre-check-in values."
      - from: CHECKED_IN
        to: TOURED
        trigger: "POST /sales-presentations/{id}/complete"
        actor: SalesRepresentative
        preconditions:
          - "presentation.booking_id == booking.id and booking.status == CHECKED_IN"
          - "presentation.disclosure_status == COMPLETE, else ERR_DISCLOSURES_INCOMPLETE"
          - "presentation.review_status != UNREVIEWED, else ERR_INVALID_PRESENTATION_STATE"
        side_effects:
          - "rep.status ON_TOUR -> ACTIVE"
          - "rep.tours_taken_count += 1"
          - "channel.toured_count += 1"
          - "channel.historical_no_show_rate recomputed by calculations.channel_no_show_rate"
          - "gallery.booked_slot_count unchanged (TOURED remains an occupying status for the day)"
        note: "A FLAGGED presentation may still complete the tour; only PurchaseAgreement execution demands review_status == CLEARED."

  - entity: SalesPresentation
    shape: parallel_dimensions
    initial_state: "PENDING x UNREVIEWED"
    terminal_states: []
    dimension: "disclosure_status x review_status"
    transitions:
      - from: "disclosure_status=PENDING"
        to: "disclosure_status=PARTIAL"
        trigger: "POST /disclosure-acknowledgments"
        actor: SalesRepresentative
        preconditions:
          - "presentation.disclosure_status IN {PENDING, PARTIAL}"
          - "no DisclosureAcknowledgment already exists for (presentation_id, disclosure_code), else ERR_DISCLOSURE_ALREADY_ACKNOWLEDGED"
        side_effects:
          - "presentation.disclosure_ack_count recomputed as the count of DISTINCT REQUIRED_DISCLOSURE_CODES acknowledged with acknowledged_by_prospect == true"
          - "presentation.compliance_score recomputed by calculations.presentation_compliance_score"
          - "disclosure_status becomes PARTIAL when 0 < disclosure_ack_count < required_disclosure_count"
        note: "review_status is untouched by this transition."
      - from: "disclosure_status=PARTIAL"
        to: "disclosure_status=COMPLETE"
        trigger: "POST /disclosure-acknowledgments"
        actor: SalesRepresentative
        preconditions:
          - "the appended acknowledgment raises disclosure_ack_count to required_disclosure_count (3)"
        side_effects:
          - "presentation.compliance_score recomputed (the disclosure-gap penalty term reaches 0)"
      - from: "review_status=UNREVIEWED"
        to: "review_status=FLAGGED"
        trigger: "POST /prohibited-claim-findings"
        actor: ComplianceOfficer
        preconditions:
          - "calculations.presentation_compliance_score.auto_flag evaluates true after the append"
        side_effects:
          - "presentation.prohibited_claim_points and presentation.compliance_score recomputed"
          - "presentation.flag_count += 1"
          - "CASCADE STEP 1 (caused by entering FLAGGED): rep.compliance_strike_count += 1"
          - "CASCADE STEP 2 (caused by step 1): when rep.compliance_strike_count >= COMPLIANCE_STRIKE_SUSPEND_THRESHOLD (2), rep.status -> SUSPENDED and a ComplianceRetrainingAssignment is created with trigger_reason PROHIBITED_CLAIM_POINTS, status ASSIGNED, required_module_count = AUTO_RETRAINING_MODULE_COUNT (4), strike_count_at_assignment = rep.compliance_strike_count"
          - "CASCADE STEP 3 (caused by step 2): gallery.available_rep_count recomputed; when it reaches 0 and gallery.status == OPEN, gallery.status -> RESTRICTED"
          - "increments SalesPresentation.version by 1"
      - from: "review_status=CLEARED"
        to: "review_status=FLAGGED"
        trigger: "POST /prohibited-claim-findings"
        actor: ComplianceOfficer
        preconditions:
          - "calculations.presentation_compliance_score.auto_flag evaluates true after the append"
        side_effects:
          - "identical cascade to the UNREVIEWED -> FLAGGED transition, including the rep strike increment"
        note: "A previously cleared presentation can be re-flagged when new findings land; each entry into FLAGGED counts a fresh strike."
      - from: "review_status=UNREVIEWED"
        to: "review_status=CLEARED"
        trigger: "POST /sales-presentations/{id}/review with decision CLEAR"
        actor: ComplianceOfficer
        preconditions:
          - "X-User-ID is not the reported_by_user_id of any ProhibitedClaimFinding on this presentation, else ERR_SEGREGATION_OF_DUTIES"
          - "presentation.compliance_score >= COMPLIANCE_CLEAR_FLOOR (70) and no finding on this presentation has severity EGREGIOUS, else ERR_PRESENTATION_NOT_CLEARED"
        side_effects:
          - "presentation.reviewed_by_user_id = X-User-ID"
      - from: "review_status=UNREVIEWED"
        to: "review_status=FLAGGED"
        trigger: "POST /sales-presentations/{id}/review with decision FLAG"
        actor: ComplianceOfficer
        preconditions:
          - "X-User-ID is not the reported_by_user_id of any ProhibitedClaimFinding on this presentation, else ERR_SEGREGATION_OF_DUTIES"
        side_effects:
          - "presentation.reviewed_by_user_id = X-User-ID; presentation.flag_count += 1"
          - "same three-step strike cascade as the auto-flag path"
      - from: "review_status=FLAGGED"
        to: "review_status=CLEARED"
        trigger: "POST /sales-presentations/{id}/review with decision CLEAR"
        actor: ComplianceOfficer
        preconditions:
          - "X-User-ID is not the reported_by_user_id of any ProhibitedClaimFinding on this presentation, else ERR_SEGREGATION_OF_DUTIES"
          - "presentation.compliance_score >= COMPLIANCE_CLEAR_FLOOR (70) and no finding on this presentation has severity EGREGIOUS, else ERR_PRESENTATION_NOT_CLEARED"
        side_effects:
          - "presentation.reviewed_by_user_id = X-User-ID"
          - "rep.compliance_strike_count is NOT decremented; strikes only reset on a COMPLETED retraining"
        note: "Closes the review_status FLAGGED <-> CLEARED loop, making review_status a cyclic dimension while disclosure_status stays monotone."

  - entity: PurchaseAgreement
    shape: parallel_dimensions
    initial_state: "OPEN x AWAITING_FUNDING"
    terminal_states: [DOCS_DELIVERED, VOIDED, TRADED_IN]
    dimension: "rescission_status x fulfillment_status"
    transitions:
      - from: "rescission_status=OPEN"
        to: "rescission_status=EXPIRED"
        trigger: "POST /_ops/rescission-sweep (system epoch advance)"
        actor: system
        preconditions:
          - "agreement.rescission_status == OPEN"
          - "clock_now > agreement.rescission_deadline_utc"
        side_effects:
          - "agreement.rescission_status -> EXPIRED; fulfillment_status untouched"
          - "agreements are swept in executed_at ASC order, then created_at ASC on ties"
      - from: "rescission_status=OPEN"
        to: "rescission_status=RESCINDED"
        trigger: "POST /rescission-requests/{id}/adjudicate (timely branch)"
        actor: ContractAdministrator
        preconditions:
          - "request.status == RECEIVED and request.is_timely == true"
        side_effects:
          - "CASCADE STEP 1: agreement.fulfillment_status AWAITING_FUNDING -> VOIDED"
          - "CASCADE STEP 2 (caused by step 1): rep.rescinded_agreement_count += 1 and rep.cancellation_rate recomputed by calculations.representative_cancellation_rate"
          - "CASCADE STEP 3 (caused by step 2): when the recomputed analysis has executed_count >= CANCELLATION_MIN_SAMPLE (2) AND cancellation_rate >= CANCELLATION_RATE_THRESHOLD (0.5000), a ComplianceRetrainingAssignment is created with trigger_reason CANCELLATION_RATE_BREACH, status ASSIGNED, required_module_count = AUTO_RETRAINING_MODULE_COUNT (4), cancellation_rate_at_assignment = the recomputed rate, and rep.status -> RETRAINING"
          - "CASCADE STEP 4 (caused by step 3): gallery.available_rep_count recomputed; when it reaches 0 and gallery.status == OPEN, gallery.status -> RESTRICTED"
          - "FAN-OUT of step 1 (not part of the chain): every FinancingApplication with agreement_id == agreement.id and status IN {SUBMITTED, APPROVED} transitions to CANCELLED, processed in created_at ASC order"
      - from: "rescission_status=EXPIRED"
        to: "rescission_status=RESCINDED"
        trigger: "POST /rescission-requests/{id}/adjudicate (timely branch)"
        actor: ContractAdministrator
        preconditions:
          - "request.status == RECEIVED and request.is_timely == true"
          - "agreement.fulfillment_status == AWAITING_FUNDING, else ERR_AGREEMENT_ALREADY_FUNDED"
        side_effects:
          - "identical cascade to the OPEN -> RESCINDED transition"
        note: "Reachable when the notice was postmarked inside the window but adjudicated after the sweep already expired the agreement."
      - from: "fulfillment_status=AWAITING_FUNDING"
        to: "fulfillment_status=FUNDED"
        trigger: "POST /purchase-agreements/{id}/fund"
        actor: ContractAdministrator
        preconditions:
          - "agreement.rescission_status == EXPIRED, else ERR_RESCISSION_PERIOD_ACTIVE"
          - "agreement.fulfillment_status == AWAITING_FUNDING, else ERR_INVALID_AGREEMENT_STATE"
          - "when agreement.financed_amount_cents > 0: a FinancingApplication with agreement_id == agreement.id and status == APPROVED must exist, else ERR_FINANCING_NOT_APPROVED"
          - "when such an application exists: its approved_amount_cents >= agreement.financed_amount_cents, else ERR_FINANCING_AMOUNT_SHORTFALL"
          - "collected_amount_cents == agreement.financed_amount_cents, else ERR_FUNDING_AMOUNT_MISMATCH"
        side_effects:
          - "agreement.funded_at = clock_now; agreement.funding_reference set"
          - "agreement.total_collected_cents = agreement.escrow_collected_cents + collected_amount_cents"
          - "a ClosingPackage is created with agreement_id == agreement.id, status AWAITING_RECORDING, and instrument_type derived from agreement.product_type"
          - "Prospect.is_existing_owner for agreement.prospect_id becomes true"
      - from: "fulfillment_status=FUNDED"
        to: "fulfillment_status=RECORDED"
        trigger: "POST /closing-packages/{id}/record (bubble-up)"
        actor: ContractAdministrator
        preconditions:
          - "package.status == AWAITING_RECORDING and package.agreement_id == agreement.id"
          - "agreement.fulfillment_status == FUNDED"
        side_effects:
          - "package.status -> RECORDED with recording_reference, recording_jurisdiction and recorded_at set"
          - "agreement.fulfillment_status FUNDED -> RECORDED (parent re-derived from the child package state)"
      - from: "fulfillment_status=RECORDED"
        to: "fulfillment_status=DOCS_DELIVERED"
        trigger: "POST /closing-packages/{id}/deliver (bubble-up)"
        actor: ContractAdministrator
        preconditions:
          - "package.status == RECORDED and package.agreement_id == agreement.id"
        side_effects:
          - "package.status -> DELIVERED with delivery_method and documents_delivered_at set"
          - "agreement.fulfillment_status RECORDED -> DOCS_DELIVERED (terminal)"
      - from: "fulfillment_status=DOCS_DELIVERED"
        to: "fulfillment_status=TRADED_IN"
        trigger: "POST /purchase-agreements (with traded_in_agreement_id referencing this agreement)"
        actor: SalesRepresentative
        preconditions:
          - "prior.fulfillment_status == DOCS_DELIVERED and prior.rescission_status == EXPIRED, else ERR_TRADE_IN_NOT_ELIGIBLE"
          - "prior.prospect_id == the new agreement's prospect_id, else ERR_TRADE_IN_OWNER_MISMATCH"
        side_effects:
          - "prior.fulfillment_status DOCS_DELIVERED -> TRADED_IN (terminal)"
          - "the new agreement's trade_in_equity_credit_cents is set from calculations.trade_in_equity_credit against the prior agreement"

  - entity: FinancingApplication
    shape: branching_fork
    initial_state: SUBMITTED
    terminal_states: [APPROVED, DECLINED, WITHDRAWN, CANCELLED]
    dimension: status
    transitions:
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /financing-applications/{id}/decision with decision APPROVE"
        actor: ContractAdministrator
        preconditions:
          - "application.status == SUBMITTED"
          - "application.applicant_fico >= MIN_UNDERWRITABLE_FICO (620), else the APPROVE branch is unavailable and ERR_INVALID_REQUEST is returned"
          - "agreement.rescission_status != RESCINDED, else ERR_INVALID_AGREEMENT_STATE"
        side_effects:
          - "apr_bps, max_ltv_rate, ltv_cap_cents, approved_amount_cents and monthly_payment_cents are set by calculations.financing_underwriting"
          - "decided_at = clock_now; decided_by_user_id = X-User-ID"
      - from: SUBMITTED
        to: DECLINED
        trigger: "POST /financing-applications/{id}/decision with decision DECLINE"
        actor: ContractAdministrator
        preconditions:
          - "application.status == SUBMITTED"
        side_effects:
          - "apr_bps, max_ltv_rate, ltv_cap_cents remain null; approved_amount_cents and monthly_payment_cents remain null"
          - "decided_at = clock_now; decided_by_user_id = X-User-ID"
        note: "Divergent side-effect set from the APPROVE branch: no underwriting fields are populated at all."
      - from: SUBMITTED
        to: WITHDRAWN
        trigger: "POST /financing-applications (a newer application supersedes this one)"
        actor: SalesRepresentative
        preconditions:
          - "a new FinancingApplication is being created for the same agreement_id"
        side_effects:
          - "this application's status -> WITHDRAWN; its computed underwriting fields are left as-is"
      - from: APPROVED
        to: WITHDRAWN
        trigger: "POST /financing-applications (a newer application supersedes this one)"
        actor: SalesRepresentative
        preconditions:
          - "a new FinancingApplication is being created for the same agreement_id"
          - "agreement.fulfillment_status == AWAITING_FUNDING, else ERR_INVALID_AGREEMENT_STATE"
        side_effects:
          - "this application's status -> WITHDRAWN, releasing the approval that funding would otherwise consume"
      - from: SUBMITTED
        to: CANCELLED
        trigger: "POST /rescission-requests/{id}/adjudicate (timely branch, fan-out of the agreement void)"
        actor: system
        preconditions:
          - "agreement.rescission_status transitioned to RESCINDED"
        side_effects:
          - "status -> CANCELLED"
      - from: APPROVED
        to: CANCELLED
        trigger: "POST /rescission-requests/{id}/adjudicate (timely branch, fan-out of the agreement void)"
        actor: system
        preconditions:
          - "agreement.rescission_status transitioned to RESCINDED"
        side_effects:
          - "status -> CANCELLED"

  - entity: RescissionRequest
    shape: branching_fork
    initial_state: RECEIVED
    terminal_states: [REJECTED_LATE, REFUNDED]
    dimension: status
    transitions:
      - from: RECEIVED
        to: VALIDATED
        trigger: "POST /rescission-requests/{id}/adjudicate"
        actor: ContractAdministrator
        preconditions:
          - "request.status == RECEIVED"
          - "request.is_timely == true (server-selected branch, not client-selected)"
          - "agreement.fulfillment_status == AWAITING_FUNDING, else ERR_AGREEMENT_ALREADY_FUNDED"
        side_effects:
          - "adjudicated_at = clock_now; adjudicated_by_user_id = X-User-ID"
          - "drives the five-step agreement-void cascade documented on PurchaseAgreement rescission_status OPEN -> RESCINDED"
      - from: RECEIVED
        to: REJECTED_LATE
        trigger: "POST /rescission-requests/{id}/adjudicate"
        actor: ContractAdministrator
        preconditions:
          - "request.status == RECEIVED"
          - "request.is_timely == false (server-selected branch)"
        side_effects:
          - "adjudicated_at = clock_now; adjudicated_by_user_id = X-User-ID"
          - "the agreement is NOT touched: rescission_status, fulfillment_status, rep counters and gallery posture are all unchanged"
        note: "Divergent side-effect set from the VALIDATED branch: the entire five-step cascade is skipped."
      - from: VALIDATED
        to: REFUNDED
        trigger: "POST /refund-disbursements/{id}/settle"
        actor: ContractAdministrator
        preconditions:
          - "disbursement.rescission_request_id == request.id and disbursement.status == PENDING"
        side_effects:
          - "disbursement.status PENDING -> ISSUED with settlement_reference and settled_at set"
          - "agreement.retained_cents = disbursement.gift_recapture_cents + disbursement.doc_fee_retained_cents"
          - "escrow conservation holds: agreement.escrow_collected_cents == disbursement.disbursed_amount_cents + agreement.retained_cents"

  - entity: ClosingPackage
    shape: linear
    initial_state: AWAITING_RECORDING
    terminal_states: [DELIVERED]
    dimension: status
    transitions:
      - from: AWAITING_RECORDING
        to: RECORDED
        trigger: "POST /closing-packages/{id}/record"
        actor: ContractAdministrator
        preconditions:
          - "package.status == AWAITING_RECORDING"
          - "agreement.fulfillment_status == FUNDED, else ERR_INVALID_AGREEMENT_STATE"
        side_effects:
          - "recording_reference, recording_jurisdiction, recorded_at set"
          - "agreement.fulfillment_status FUNDED -> RECORDED"
      - from: RECORDED
        to: DELIVERED
        trigger: "POST /closing-packages/{id}/deliver"
        actor: ContractAdministrator
        preconditions:
          - "package.status == RECORDED"
        side_effects:
          - "delivery_method, documents_delivered_at set"
          - "agreement.fulfillment_status RECORDED -> DOCS_DELIVERED"

  - entity: ComplianceRetrainingAssignment
    shape: cyclic
    initial_state: ASSIGNED
    terminal_states: [COMPLETED]
    dimension: status
    transitions:
      - from: ASSIGNED
        to: IN_PROGRESS
        trigger: "POST /retraining-assignments/{id}/start"
        actor: ComplianceOfficer
        preconditions:
          - "assignment.status == ASSIGNED"
        side_effects:
          - "started_at = clock_now"
          - "rep.status -> RETRAINING when rep.status == ACTIVE (a SUSPENDED rep stays SUSPENDED while retraining)"
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /retraining-assignments/{id}/close with outcome COMPLETE"
        actor: ComplianceOfficer
        preconditions:
          - "assignment.status == IN_PROGRESS"
          - "modules_completed >= assignment.required_module_count, else ERR_MODULE_COUNT_SHORTFALL"
        side_effects:
          - "closed_at = clock_now; modules_completed recorded"
          - "CASCADE STEP 1: rep.compliance_strike_count reset to 0"
          - "CASCADE STEP 2 (caused by step 1): rep.status -> ACTIVE when no other ComplianceRetrainingAssignment for this rep sits in status ASSIGNED or IN_PROGRESS"
          - "CASCADE STEP 3 (caused by step 2): gallery.available_rep_count recomputed; when it becomes >= 1 and gallery.status == RESTRICTED, gallery.status -> OPEN"
      - from: IN_PROGRESS
        to: FAILED
        trigger: "POST /retraining-assignments/{id}/close with outcome FAIL"
        actor: ComplianceOfficer
        preconditions:
          - "assignment.status == IN_PROGRESS"
        side_effects:
          - "closed_at = clock_now; modules_completed recorded"
          - "rep.status stays RETRAINING or SUSPENDED; strike count is NOT reset"
        note: "FAILED is non-terminal."
      - from: FAILED
        to: ASSIGNED
        trigger: "POST /retraining-assignments/{id}/reassign"
        actor: ComplianceOfficer
        preconditions:
          - "assignment.status == FAILED"
          - "assignment.cycle_index < RETRAINING_CYCLE_LIMIT (3), else ERR_INVALID_RETRAINING_STATE"
        side_effects:
          - "cycle_index += 1; assigned_at = clock_now; modules_completed reset to 0; started_at and closed_at reset to null"
        note: "Closes the ASSIGNED -> IN_PROGRESS -> FAILED -> ASSIGNED cycle."

  - entity: TourChannel
    shape: branching_with_revert
    initial_state: ACTIVE
    terminal_states: []
    dimension: status
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /tour-bookings/{id}/no-show (cascade step 3)"
        actor: system
        preconditions:
          - "channel.booked_count >= NO_SHOW_MIN_SAMPLE (4)"
          - "channel.historical_no_show_rate >= NO_SHOW_SUSPEND_THRESHOLD (0.5000)"
        side_effects:
          - "drives cascade steps 4 and 5 documented on the TourBooking SCHEDULED -> NO_SHOW transition"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /tour-channels/{id}/reinstate"
        actor: MarketingManager
        preconditions:
          - "channel.status == SUSPENDED"
        side_effects:
          - "channel.toured_count and channel.no_show_count reset to 0 (probation baseline reset)"
          - "channel.historical_no_show_rate recomputed to 0.0000 by the empty-denominator branch of calculations.channel_no_show_rate"
          - "channel.booked_count is NOT reset"

  - entity: SalesGallery
    shape: posture_derived
    initial_state: OPEN
    terminal_states: []
    dimension: status
    transitions:
      - from: OPEN
        to: RESTRICTED
        trigger: "system re-derivation whenever available_rep_count changes"
        actor: system
        preconditions:
          - "gallery.status == OPEN and gallery.available_rep_count == 0"
        side_effects:
          - "check-in and booking creation are refused with ERR_GALLERY_NOT_OPEN while RESTRICTED"
      - from: RESTRICTED
        to: OPEN
        trigger: "system re-derivation whenever available_rep_count changes"
        actor: system
        preconditions:
          - "gallery.status == RESTRICTED and gallery.available_rep_count >= 1"
        side_effects:
          - "booking creation and check-in become available again"
      - from: OPEN
        to: CLOSED
        trigger: "POST /sales-galleries/{id}/set-status with status CLOSED"
        actor: GalleryManager
        preconditions:
          - "gallery.status IN {OPEN, RESTRICTED}"
        side_effects:
          - "no bookings are cancelled; existing bookings keep occupying slots"
      - from: RESTRICTED
        to: CLOSED
        trigger: "POST /sales-galleries/{id}/set-status with status CLOSED"
        actor: GalleryManager
        preconditions:
          - "gallery.status IN {OPEN, RESTRICTED}"
        side_effects:
          - "no bookings are cancelled"
      - from: CLOSED
        to: OPEN
        trigger: "POST /sales-galleries/{id}/set-status with status OPEN"
        actor: GalleryManager
        preconditions:
          - "gallery.status == CLOSED and gallery.available_rep_count >= 1"
        side_effects: []
      - from: CLOSED
        to: RESTRICTED
        trigger: "POST /sales-galleries/{id}/set-status with status OPEN"
        actor: GalleryManager
        preconditions:
          - "gallery.status == CLOSED and gallery.available_rep_count == 0"
        side_effects: []
        note: "Requesting OPEN with no available representatives lands on RESTRICTED, not OPEN; the posture is always re-derived."

  - entity: SalesRepresentative
    shape: cyclic
    initial_state: ACTIVE
    terminal_states: []
    dimension: status
    transitions:
      - from: ACTIVE
        to: ON_TOUR
        trigger: "POST /tour-bookings/{id}/check-in"
        actor: GalleryManager
        preconditions:
          - "rep is the winner of calculations.representative_rotation_selection"
        side_effects:
          - "rep.last_assigned_at = clock_now"
      - from: ON_TOUR
        to: ACTIVE
        trigger: "POST /sales-presentations/{id}/complete or POST /tour-bookings/{id}/cancel from CHECKED_IN"
        actor: SalesRepresentative
        preconditions:
          - "rep.status == ON_TOUR"
        side_effects:
          - "rep.tours_taken_count += 1 on the complete path only"
      - from: ACTIVE
        to: RETRAINING
        trigger: "POST /rescission-requests/{id}/adjudicate (cascade step 3) or POST /retraining-assignments/{id}/start"
        actor: system
        preconditions:
          - "a ComplianceRetrainingAssignment for this rep entered status ASSIGNED via the cancellation-rate breach cascade, or an ASSIGNED assignment was started"
        side_effects:
          - "gallery.available_rep_count recomputed"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /prohibited-claim-findings or POST /sales-presentations/{id}/review with decision FLAG (cascade step 2)"
        actor: system
        preconditions:
          - "rep.compliance_strike_count >= COMPLIANCE_STRIKE_SUSPEND_THRESHOLD (2)"
        side_effects:
          - "gallery.available_rep_count recomputed"
      - from: ON_TOUR
        to: SUSPENDED
        trigger: "POST /prohibited-claim-findings or POST /sales-presentations/{id}/review with decision FLAG (cascade step 2)"
        actor: system
        preconditions:
          - "rep.compliance_strike_count >= COMPLIANCE_STRIKE_SUSPEND_THRESHOLD (2)"
        side_effects:
          - "gallery.available_rep_count recomputed; the in-flight presentation is left open"
      - from: RETRAINING
        to: SUSPENDED
        trigger: "POST /prohibited-claim-findings (cascade step 2)"
        actor: system
        preconditions:
          - "rep.compliance_strike_count >= COMPLIANCE_STRIKE_SUSPEND_THRESHOLD (2)"
        side_effects: []
      - from: RETRAINING
        to: ACTIVE
        trigger: "POST /retraining-assignments/{id}/close with outcome COMPLETE (cascade step 2)"
        actor: system
        preconditions:
          - "no other ComplianceRetrainingAssignment for this rep sits in status ASSIGNED or IN_PROGRESS"
        side_effects:
          - "rep.compliance_strike_count reset to 0; gallery.available_rep_count recomputed"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /retraining-assignments/{id}/close with outcome COMPLETE (cascade step 2)"
        actor: system
        preconditions:
          - "no other ComplianceRetrainingAssignment for this rep sits in status ASSIGNED or IN_PROGRESS"
        side_effects:
          - "rep.compliance_strike_count reset to 0; gallery.available_rep_count recomputed"

# ===========================================================================
# 1.2.1  Concurrency Rules  (OCC on parent `version` only)
# ===========================================================================
concurrency_rules:
  - rule_id: financing-application-create-stale-agreement
    parent_entity: PurchaseAgreement
    write_endpoint: "POST /financing-applications"
    occ_field: "expected_agreement_version"
    description: |
      Creating a FinancingApplication against a PurchaseAgreement whose version has
      advanced past the value the client last observed is rejected. Product semantics
      allow a newer application to legitimately supersede the prior one (the prior moves
      to WITHDRAWN), so a second sequential create is not blocked by any state
      precondition; the stale-version check is what stops a writer from superseding an
      approval it never saw.
    error_id: ERR_STALE_AGREEMENT_VERSION
    http_status: 412

  - rule_id: prohibited-claim-append-stale-presentation
    parent_entity: SalesPresentation
    write_endpoint: "POST /prohibited-claim-findings"
    occ_field: "expected_presentation_version"
    description: |
      Appending a ProhibitedClaimFinding to a SalesPresentation whose version has advanced
      past the value the client last observed is rejected. Multiple findings on one
      presentation are legitimate, so a second sequential append is not blocked by any
      state precondition; the stale-version check stops an officer from scoring a
      presentation whose compliance_score already moved under them.
    error_id: ERR_STALE_PRESENTATION_VERSION
    http_status: 412

  - rule_id: retraining-assign-stale-representative
    parent_entity: SalesRepresentative
    write_endpoint: "POST /retraining-assignments"
    occ_field: "expected_representative_version"
    description: |
      Creating a ComplianceRetrainingAssignment against a SalesRepresentative whose version
      has advanced past the value the client last observed is rejected. Assignments with
      distinct trigger_reason values may coexist on one rep, so a second sequential create
      is not blocked by the (rep_id, trigger_reason) uniqueness rule; the stale-version
      check stops an officer from assigning against a rep whose strike count or status
      already changed.
    error_id: ERR_STALE_REPRESENTATIVE_VERSION
    http_status: 412

# ===========================================================================
# 1.3  Calculation Rules Table
# ===========================================================================
calculations:

  - name: channel_no_show_rate
    trigger: "recomputed on the TourBooking SCHEDULED -> NO_SHOW transition, on the CHECKED_IN -> TOURED transition, and on POST /tour-channels/{id}/reinstate"
    algorithm: aggregation
    formula: |
      denominator = channel.toured_count + channel.no_show_count
      if denominator == 0:
          historical_no_show_rate = 0.0000          # empty-set branch, never a division
      else:
          historical_no_show_rate = round_half_up(channel.no_show_count / denominator, 4)
    input_set: |
      (a) source entity: TourChannel counters, each maintained from TourBooking rows for
          that channel_id -- toured_count counts rows that reached status TOURED,
          no_show_count counts rows that reached status NO_SHOW; rows in SCHEDULED,
          RESCHEDULE_PENDING, CHECKED_IN and CANCELLED are excluded from BOTH counters.
      (b) window: lifetime since the channel's last reinstate; POST
          /tour-channels/{id}/reinstate resets toured_count and no_show_count to 0 while
          leaving booked_count intact.
      (c) order-insensitive (pure counts), so no tie-break is required.
    constants:
      NO_SHOW_MIN_SAMPLE: 4
      NO_SHOW_SUSPEND_THRESHOLD: 0.5000
    precision: "4 decimal places, round_half_up"

  - name: tour_qualification_evaluation
    trigger: "on POST /tour-bookings, frozen onto booking.qualification_score and booking.qualification_penalty_points"
    algorithm: threshold
    formula: |
      # -- hard minimum criteria (evaluated first, all three must pass) ------------
      if prospect.primary_age < channel.min_age:                              -> ERR_PROSPECT_BELOW_MINIMUM_CRITERIA
      if prospect.household_income_cents < channel.min_household_income_cents: -> ERR_PROSPECT_BELOW_MINIMUM_CRITERIA
      if channel.requires_married_household and prospect.marital_status != MARRIED:
                                                                              -> ERR_PROSPECT_BELOW_MINIMUM_CRITERIA

      # -- scored criteria --------------------------------------------------------
      income_points  = 45 if prospect.household_income_cents >= 15000000
                       else 35 if prospect.household_income_cents >= 10000000
                       else 25 if prospect.household_income_cents >=  7500000
                       else 15 if prospect.household_income_cents >=  5000000
                       else 0
      age_points     = 25 if prospect.primary_age >= channel.min_age else 0
      marital_points = 20 if prospect.marital_status == MARRIED else 0
      owner_points   = 25 if prospect.is_existing_owner == true else 0
      affinity_points= 20 if channel.channel_code IN {IN_HOUSE_REFERRAL, OWNER_UPGRADE} else 0

      raw_points  = income_points + age_points + marital_points + owner_points + affinity_points
      # STEP ORDER IS PINNED: cap at 100 BEFORE subtracting the no-show penalty.
      capped      = min(100, raw_points)
      penalty     = round_half_up(channel.historical_no_show_rate * NO_SHOW_PENALTY_WEIGHT)
      score       = max(0, capped - penalty)

      qualification_penalty_points = penalty
      qualification_score          = score
      if score < channel.min_qualification_score: -> ERR_PROSPECT_NOT_QUALIFIED
    input_set: |
      Exactly one Prospect row and one TourChannel row named in the request body. The
      channel's historical_no_show_rate is read as-of the instant BEFORE this booking is
      persisted, so the new booking never influences its own penalty.
    constants:
      NO_SHOW_PENALTY_WEIGHT: 30
      INCOME_TIER_CENTS: "15000000 -> 45, 10000000 -> 35, 7500000 -> 25, 5000000 -> 15, below -> 0"
      AGE_POINTS: 25
      MARITAL_POINTS: 20
      OWNER_POINTS: 25
      AFFINITY_POINTS: 20
      AFFINITY_CHANNEL_CODES: "IN_HOUSE_REFERRAL, OWNER_UPGRADE"
    precision: "integer points; the penalty term is rounded to a whole point with round_half_up"
    note: |
      The pinned cap-then-penalise order is observable: raw_points 110 (income 45 + age 25
      + married 20 + affinity 20) with historical_no_show_rate 1.0000 yields
      min(100, 110) - 30 = 70, whereas the rejected penalise-then-cap order would yield
      min(100, 110 - 30) = 80.

  - name: gallery_capacity_overlap_check
    trigger: "on POST /tour-bookings and on POST /tour-bookings/{id}/reschedule, before the booking interval is persisted"
    algorithm: interval_merge
    formula: |
      candidate_start = requested scheduled_start_utc
      candidate_end   = candidate_start + gallery.presentation_minutes minutes
      B_end           = B.scheduled_end_utc
      # HALF-OPEN interval geometry [start, end); the buffer extends only the END of each
      # interval, and it is applied to BOTH sides of the comparison.
      overlaps(B) = (B.scheduled_start_utc <  candidate_end + gallery.buffer_minutes)
                AND (candidate_start       <  B_end         + gallery.buffer_minutes)
      occupying = { B : B.gallery_id == gallery.id
                        AND B.status IN {SCHEDULED, RESCHEDULE_PENDING, CHECKED_IN, TOURED}
                        AND B.id != the booking being rescheduled }
      overlap_count = count of B in occupying with overlaps(B) == true
      if overlap_count >= gallery.concurrent_tour_capacity: -> ERR_GALLERY_CAPACITY_EXCEEDED
    input_set: |
      (a) source entity: TourBooking rows with the same gallery_id and status IN
          {SCHEDULED, RESCHEDULE_PENDING, CHECKED_IN, TOURED}; NO_SHOW and CANCELLED rows
          are excluded.
      (b) window: unbounded in time; membership is decided purely by the overlaps()
          predicate above, with strict `<` on both comparisons.
      (c) order-insensitive (a count), so no tie-break is required.
    constants: {}
    precision: "whole minutes; all instants are UTC"
    note: |
      Adjacency is permitted at exactly candidate_start == B_end + buffer_minutes because
      both comparisons are strict. With presentation_minutes 120 and buffer_minutes 30,
      an existing 09:00-11:00 interval leaves 11:30 free and rejects 11:29.

  - name: representative_window_exclusivity
    trigger: "evaluated for every candidate inside calculations.representative_rotation_selection on POST /tour-bookings/{id}/check-in"
    algorithm: interval_merge
    formula: |
      candidate_start = booking.scheduled_start_utc
      candidate_end   = booking.scheduled_end_utc
      for each SalesPresentation P with P.rep_id == rep.id:
          busy_start = P.window_start_utc
          busy_end   = P.window_end_utc
          # CLOSED interval geometry with a SYMMETRIC mandatory reset gap; touching
          # endpoints DO collide because both comparisons are non-strict.
          collides = (candidate_start <= busy_end   + REP_RESET_MINUTES)
                 AND (busy_start      <= candidate_end + REP_RESET_MINUTES)
          if collides: rep is INELIGIBLE
    input_set: |
      (a) source entity: every SalesPresentation row with rep_id == the candidate rep, with
          no status filter at all -- open, cleared and flagged presentations all occupy the
          representative's calendar.
      (b) window: unbounded; membership decided by the collides() predicate with `<=` on
          both comparisons.
      (c) order-insensitive (an existence test), so no tie-break is required.
    constants:
      REP_RESET_MINUTES: 15
    precision: "whole minutes; all instants are UTC"
    note: |
      Capacity 1 with a symmetric 15-minute reset is a different geometry from
      gallery_capacity_overlap_check: an existing 09:30-11:30 presentation window makes a
      11:45 candidate INELIGIBLE (11:45 <= 11:30 + 15) but leaves 11:46 eligible, while the
      same pair of intervals passes the gallery test whenever concurrent_tour_capacity >= 2.

  - name: representative_rotation_selection
    trigger: "on POST /tour-bookings/{id}/check-in to pick booking.assigned_rep_id"
    algorithm: weighted_scoring
    formula: |
      # (a) eligibility filter -- explicit predicate over entity fields
      candidates = { R : R.gallery_id == booking.gallery_id
                         AND R.status == ACTIVE
                         AND calculations.representative_window_exclusivity(R, booking) is eligible }
      # (b) ranking expression
      order candidates by R.tours_taken_count ASC
      # (c) tie-break chain, applied in this order
      then by R.rotation_position ASC
      then by R.created_at ASC          # never R.id
      winner = first row after ordering
      # (d) empty-pool fallback
      if candidates is empty: -> ERR_NO_ELIGIBLE_REPRESENTATIVE (409)
    input_set: |
      (a) source entity: SalesRepresentative rows with gallery_id == booking.gallery_id and
          status == ACTIVE exactly; ON_TOUR, RETRAINING and SUSPENDED rows are excluded.
      (b) window: current state at request time; no time window.
      (c) tie-break: rotation_position ASC then created_at ASC, both total orders over
          declared fields; the random `id` is never consulted.
    constants: {}
    precision: "exact integer comparison"

  - name: presentation_compliance_score
    trigger: "evaluated on POST /sales-presentations and recomputed on POST /disclosure-acknowledgments and on POST /prohibited-claim-findings"
    algorithm: weighted_scoring
    formula: |
      prohibited_claim_points = sum over ProhibitedClaimFinding F with
                                F.presentation_id == presentation.id of
                                SEVERITY_PENALTY_POINTS[F.severity]
      disclosure_gap_points   = DISCLOSURE_GAP_WEIGHT
                                * (presentation.required_disclosure_count
                                   - presentation.disclosure_ack_count)
      compliance_score = max(0, 100 - prohibited_claim_points - disclosure_gap_points)
      auto_flag = (compliance_score < COMPLIANCE_CLEAR_FLOOR)
                  OR (any F on this presentation has severity == EGREGIOUS)
    input_set: |
      (a) source entity: all ProhibitedClaimFinding rows with presentation_id ==
          presentation.id (append-only, none are ever excluded), plus the presentation's own
          disclosure_ack_count which counts only DISTINCT REQUIRED_DISCLOSURE_CODES
          acknowledged with acknowledged_by_prospect == true.
      (b) window: lifetime of the presentation; findings are never expired.
      (c) order-insensitive (a sum), so no tie-break is required.
    constants:
      SEVERITY_PENALTY_POINTS: "MINOR -> 5, MAJOR -> 15, EGREGIOUS -> 40"
      DISCLOSURE_GAP_WEIGHT: 10
      COMPLIANCE_CLEAR_FLOOR: 70
      REQUIRED_DISCLOSURE_CODES: "RESCISSION_RIGHTS, PUBLIC_OFFERING_STATEMENT_DELIVERY, NOT_AN_INVESTMENT"
    precision: "integer points"
    note: |
      The floor is inclusive on the passing side: a fully-disclosed presentation carrying
      exactly two MAJOR findings scores 100 - 30 - 0 = 70, which is NOT auto-flagged; a
      third MINOR finding drops it to 65 and flags it.

  - name: trade_in_equity_credit
    trigger: "on POST /purchase-agreements when traded_in_agreement_id is non-null"
    algorithm: waterfall_allocation
    formula: |
      years_held = round_half_up(
                     (clock_now - prior.funded_at) in seconds / (365 * 86400), 4)

      # ROUNDING ORDER IS PINNED: each component is rounded to a whole cent FIRST,
      # then the rounded components are summed. Sum-then-round is REJECTED.
      c1 = round_half_up(prior.purchase_price_cents * EQUITY_RECOGNITION_RATE)
      c2 = -1 * round_half_up(prior.purchase_price_cents * ANNUAL_DEPRECIATION_RATE * years_held)
      c3 = round_half_up(prior.purchase_price_cents * LOYALTY_RATE
                         * min(years_held, LOYALTY_YEARS_CAP))
      c4 = -1 * TRANSFER_FEE_CENTS

      trade_in_equity_credit_cents = max(0, c1 + c2 + c3 + c4)
    input_set: |
      (a) source entity: exactly one prior PurchaseAgreement, the row named by
          traded_in_agreement_id, which must satisfy fulfillment_status == DOCS_DELIVERED
          and rescission_status == EXPIRED and prospect_id == the new agreement's
          prospect_id.
      (b) window: the hold period runs from prior.funded_at (inclusive) to clock_now at the
          instant of the new execution (inclusive); years_held is truncated to 4 decimals
          with round_half_up before any component uses it.
      (c) component evaluation order is c1, c2, c3, c4, each rounded independently; the
          summation order does not affect the result once each component is a whole cent.
    constants:
      EQUITY_RECOGNITION_RATE: 0.55
      ANNUAL_DEPRECIATION_RATE: 0.075
      LOYALTY_RATE: 0.025
      LOYALTY_YEARS_CAP: 10
      TRANSFER_FEE_CENTS: 49900
    precision: "whole cents, round_half_up per component; years_held to 4 decimals, round_half_up"
    note: |
      Worked divergence: prior.purchase_price_cents = 2450000, years_held = 2.2466 gives
      c1 = 1347500, c2 = -412813, c3 = 137604, c4 = -49900, so the pinned per-component
      order returns 1022391, while sum-then-round would return 1022392.

  - name: agreement_financials
    trigger: "on POST /purchase-agreements, after trade_in_equity_credit has produced trade_in_equity_credit_cents"
    algorithm: constraint_propagation
    formula: |
      # The doc stamp looks circular (it is a fee inside the financed amount that is itself
      # derived from the financed amount). The evaluation order below is PINNED and the
      # stamp is assessed on step 3's base_financed_cents, never on step 5's output.
      step 1: total_due_cents = max(0, purchase_price_cents - trade_in_equity_credit_cents)
      step 2: pct = 0.12 if total_due_cents >= 5000000
                    else 0.10 if total_due_cents >= 2000000
                    else 0.08
              down_payment_required_cents = round_half_up(total_due_cents * pct)
              if down_payment_cents < down_payment_required_cents:
                                                        -> ERR_DOWN_PAYMENT_INSUFFICIENT
      step 3: base_financed_cents = max(0, total_due_cents - down_payment_cents)
      step 4: if base_financed_cents == 0:
                  doc_stamp_cents = 0
                  closing_cost_fee_cents = 0
              else:
                  doc_stamp_cents = round_half_up(base_financed_cents * DOC_STAMP_RATE)
                  closing_cost_fee_cents = CLOSING_FLAT_FEE_CENTS + doc_stamp_cents
      step 5: financed_amount_cents = 0 if base_financed_cents == 0
                                      else base_financed_cents + closing_cost_fee_cents
      step 6: escrow_collected_cents = down_payment_cents
    input_set: |
      Exactly the one PurchaseAgreement being executed, plus its trade_in_equity_credit_cents
      from the previous calculation. No other agreements participate.
    constants:
      DOWN_PAYMENT_TIERS: "total_due_cents >= 5000000 -> 0.12; >= 2000000 -> 0.10; else 0.08"
      DOC_STAMP_RATE: 0.0035
      CLOSING_FLAT_FEE_CENTS: 129900
    precision: "whole cents, round_half_up"
    note: |
      All-cash boundary: down_payment_cents == total_due_cents drives base_financed_cents to
      0, which zeroes BOTH the flat closing fee and the doc stamp, so financed_amount_cents
      is 0 rather than CLOSING_FLAT_FEE_CENTS.

  - name: rescission_deadline
    trigger: "on POST /purchase-agreements; re-read (never recomputed) by GET /purchase-agreements/{id}/rescission-window and by the rescission sweep"
    algorithm: interval_merge
    formula: |
      rule           = STATE_RESCISSION_RULES[state_code]
      anchor_mode    = rule.anchor
      statutory_days = rule.days

      if anchor_mode == EXECUTION:                    anchor_utc = executed_at
      elif anchor_mode == POS_DELIVERY:               anchor_utc = pos_delivered_at
      else: # LATER_OF_EXECUTION_OR_POS
                                                      anchor_utc = max(executed_at, pos_delivered_at)

      d = utc_calendar_date(anchor_utc) + statutory_days calendar days
      business_day_rolled = false
      if rule.roll:
          while weekday(d) IN {SATURDAY, SUNDAY} or d IN FEDERAL_HOLIDAYS:
              d = d + 1 day
              business_day_rolled = true
      rescission_deadline_utc = d at 23:59:59.999Z
    input_set: |
      Exactly the one PurchaseAgreement being executed. executed_at is the logical clock at
      execution; pos_delivered_at comes from the request body and must satisfy
      executed_at - 30 days <= pos_delivered_at <= executed_at + 3 days, else
      ERR_POS_NOT_DELIVERED.
    constants:
      STATE_RESCISSION_RULES: |
        FL -> { days: 10, anchor: LATER_OF_EXECUTION_OR_POS, roll: true,  refund: STATUTORY_FULL }
        NV -> { days:  5, anchor: EXECUTION,                 roll: false, refund: STATUTORY_FULL }
        CA -> { days:  7, anchor: LATER_OF_EXECUTION_OR_POS, roll: true,  refund: STATUTORY_FULL }
        TX -> { days:  6, anchor: EXECUTION,                 roll: false, refund: CONTRACTUAL_NET_OF_GIFT }
        HI -> { days:  7, anchor: POS_DELIVERY,              roll: true,  refund: CONTRACTUAL_NET_OF_GIFT }
      FEDERAL_HOLIDAYS: "2026-07-03, 2026-09-07, 2026-11-26, 2026-12-25, 2027-01-01, 2028-07-04, 2028-09-04, 2028-11-23, 2028-12-25, 2029-01-01, 2029-07-04, 2029-09-03, 2029-11-22, 2029-12-25"
    precision: "millisecond-resolution UTC instant; deadline is always the 23:59:59.999Z edge of a UTC calendar date"
    variants:
      - name: execution_anchored
        when: "state_code IN {NV, TX}"
        difference: "anchor_utc = executed_at; pos_delivered_at is validated but never enters the deadline. With executed_at 2026-08-14T09:00:00Z and pos_delivered_at 2026-08-10T10:00:00Z, NV yields 2026-08-19T23:59:59.999Z."
      - name: pos_delivery_anchored
        when: "state_code == HI"
        difference: "anchor_utc = pos_delivered_at; a POS delivered before execution SHORTENS the window relative to execution anchoring. Same inputs yield 2026-08-17T23:59:59.999Z."
      - name: later_of_anchored
        when: "state_code IN {FL, CA}"
        difference: "anchor_utc = max(executed_at, pos_delivered_at), so a late POS delivery EXTENDS the window. Same inputs yield 2026-08-24T23:59:59.999Z for FL and 2026-08-21T23:59:59.999Z for CA."

  - name: rescission_timeliness
    trigger: "on POST /rescission-requests, frozen onto request.timeliness_basis, request.effective_utc and request.is_timely"
    algorithm: threshold
    formula: |
      if delivery_method == CERTIFIED_MAIL and postmark_utc is not null:
          timeliness_basis = POSTMARK
          effective_utc    = postmark_utc
      else:
          timeliness_basis = RECEIPT
          effective_utc    = received_at            # the logical clock at intake
      is_timely = (effective_utc <= agreement.rescission_deadline_utc)   # INCLUSIVE
    input_set: |
      One RescissionRequest and the one PurchaseAgreement it names. The agreement's
      rescission_deadline_utc is read as frozen at execution; it is never recomputed here.
    constants: {}
    precision: "millisecond-resolution instant comparison; equality counts as timely"
    variants:
      - name: postmark_rule
        when: "delivery_method == CERTIFIED_MAIL and postmark_utc is non-null"
        difference: "Timeliness is judged on the mailing instant, so a notice received after the deadline is still VALIDATED when it was postmarked inside the window."
      - name: receipt_rule
        when: "delivery_method IN {HAND_DELIVERED, EMAIL}, or CERTIFIED_MAIL with postmark_utc null"
        difference: "Timeliness is judged on the intake instant, so the identical calendar facts adjudicate to REJECTED_LATE."

  - name: refund_settlement
    trigger: "on POST /refund-disbursements"
    algorithm: waterfall_allocation
    formula: |
      base_refund_cents = agreement.escrow_collected_cents
      if agreement.refund_policy == STATUTORY_FULL:
          gift_recapture_cents   = 0
          doc_fee_retained_cents = 0
      else: # CONTRACTUAL_NET_OF_GIFT -- ordered waterfall over the escrow balance
          gift_recapture_cents   = min(booking.gift_value_cents,
                                       round_half_up(base_refund_cents * GIFT_RECAPTURE_CAP_RATE))
          doc_fee_retained_cents = min(DOC_PREP_FEE_CENTS,
                                       base_refund_cents - gift_recapture_cents)
      disbursed_amount_cents = base_refund_cents - gift_recapture_cents - doc_fee_retained_cents
      agreement.retained_cents (on settle) = gift_recapture_cents + doc_fee_retained_cents
    input_set: |
      (a) source entity: exactly one PurchaseAgreement (reached through
          request.agreement_id) whose rescission_status == RESCINDED, plus the single
          TourBooking reached through agreement.presentation_id -> presentation.booking_id,
          used only for gift_value_cents.
      (b) window: point-in-time snapshot at disbursement creation; escrow_collected_cents is
          immutable after execution so the snapshot cannot drift.
      (c) waterfall order is PINNED: gift recapture is taken first, the document
          preparation fee second, and each bucket is capped by the escrow remaining after
          the previous bucket.
    constants:
      GIFT_RECAPTURE_CAP_RATE: 0.05
      DOC_PREP_FEE_CENTS: 19900
    precision: "whole cents, round_half_up"
    variants:
      - name: statutory_full
        when: "agreement.refund_policy == STATUTORY_FULL (state_code IN {FL, NV, CA})"
        difference: "Nothing may be withheld: with escrow 320000 and gift_value 12500, disbursed_amount_cents is 320000 and retained_cents is 0."
      - name: contractual_net_of_gift
        when: "agreement.refund_policy == CONTRACTUAL_NET_OF_GIFT (state_code IN {TX, HI})"
        difference: "Gift value and the document fee are withheld: identical escrow 320000 and gift_value 12500 yield gift_recapture 12500, doc_fee 19900, disbursed_amount_cents 287600 and retained_cents 32400."

  - name: financing_underwriting
    trigger: "on POST /financing-applications/{id}/decision with decision APPROVE"
    algorithm: tiered_pricing
    formula: |
      if applicant_fico >= 740:   apr_bps = 1099; max_ltv_rate = 0.95
      elif applicant_fico >= 680: apr_bps = 1399; max_ltv_rate = 0.90
      elif applicant_fico >= 620: apr_bps = 1699; max_ltv_rate = 0.80
      else: the APPROVE branch is unavailable (ERR_INVALID_REQUEST)

      ltv_cap_cents        = round_half_up((agreement.total_due_cents
                                            + agreement.closing_cost_fee_cents) * max_ltv_rate)
      approved_amount_cents = min(requested_amount_cents, ltv_cap_cents)

      r = apr_bps / 10000 / 12                     # exact rational, no intermediate rounding
      n = term_months
      monthly_payment_cents = round_half_up(approved_amount_cents * r / (1 - (1 + r) ** (-n)))
    input_set: |
      One FinancingApplication and the one PurchaseAgreement named by its agreement_id. Only
      the agreement's total_due_cents and closing_cost_fee_cents participate; no other
      applications on the same agreement are consulted.
    constants:
      FICO_TIERS: "fico >= 740 -> apr_bps 1099 / ltv 0.95; >= 680 -> 1399 / 0.90; >= 620 -> 1699 / 0.80"
      MIN_UNDERWRITABLE_FICO: 620
    precision: "whole cents, round_half_up applied ONCE at the end of the amortization expression"
    note: |
      Worked value: total_due 3200000, closing 139980, fico 760, requested 3019980,
      term 120 gives ltv_cap 3172981, approved 3019980, monthly_payment 41583. The same
      request at fico 700 gives ltv_cap 3005982, approved 3005982 -- a shortfall against a
      financed_amount_cents of 3019980.

  - name: representative_cancellation_rate
    trigger: "recomputed on the PurchaseAgreement rescission_status -> RESCINDED cascade (step 2) and served by GET /sales-representatives/{id}/rescission-analysis"
    algorithm: aggregation
    formula: |
      window_start_utc = clock_now - CANCELLATION_WINDOW_DAYS days      # INCLUSIVE
      window_end_utc   = clock_now                                      # INCLUSIVE
      executed = { A : A.rep_id == rep.id
                       AND window_start_utc <= A.executed_at <= window_end_utc }
      executed_count   = count(executed)
      rescinded_count  = count of A in executed with A.rescission_status == RESCINDED
      cancellation_rate = 0.0000 if executed_count == 0
                          else round_half_up(rescinded_count / executed_count, 4)
      retraining_required = (executed_count >= CANCELLATION_MIN_SAMPLE)
                            AND (cancellation_rate >= CANCELLATION_RATE_THRESHOLD)
    input_set: |
      (a) source entity: PurchaseAgreement rows with rep_id == rep.id. NO status filter is
          applied to the denominator -- every executed agreement counts, including those in
          fulfillment_status VOIDED, FUNDED, RECORDED, DOCS_DELIVERED and TRADED_IN. The
          numerator filters on rescission_status == RESCINDED only.
      (b) window: executed_at in the closed interval
          [clock_now - 90 days, clock_now]; both endpoints inclusive.
      (c) order-insensitive (two counts), so no tie-break is required.
    constants:
      CANCELLATION_WINDOW_DAYS: 90
      CANCELLATION_MIN_SAMPLE: 2
      CANCELLATION_RATE_THRESHOLD: 0.5000
    precision: "4 decimal places, round_half_up"
    note: |
      Both guards are inclusive: 1 rescission out of exactly 2 in-window agreements is
      0.5000 with sample 2, which DOES trigger retraining; 1 out of 1 is 1.0000 with sample
      1, which does NOT.

  - name: gift_liability_ledger
    trigger: "recomputed on POST /tour-bookings/{id}/check-in with issue_incentive_gift true, and on every TourBooking transition into CANCELLED"
    algorithm: aggregation
    formula: |
      gift_liability_cents = sum over TourBooking B of B.gift_value_cents
        where B.channel_id == channel.id
          AND B.gift_issued == true
          AND B.status IN {CHECKED_IN, TOURED}
    input_set: |
      (a) source entity: TourBooking rows with channel_id == channel.id, gift_issued ==
          true, and status IN {CHECKED_IN, TOURED} exactly; rows in CANCELLED, NO_SHOW,
          SCHEDULED and RESCHEDULE_PENDING are excluded.
      (b) window: current state at request time; no time window.
      (c) order-insensitive (a sum), so no tie-break is required.
    constants: {}
    precision: "whole cents"

  - name: gallery_slot_occupancy_ledger
    trigger: "recomputed on POST /tour-bookings and on every TourBooking transition into NO_SHOW or CANCELLED"
    algorithm: aggregation
    formula: |
      booked_slot_count = count of TourBooking B
        where B.gallery_id == gallery.id
          AND B.status IN {SCHEDULED, RESCHEDULE_PENDING, CHECKED_IN, TOURED}
    input_set: |
      (a) source entity: TourBooking rows with gallery_id == gallery.id and status IN
          {SCHEDULED, RESCHEDULE_PENDING, CHECKED_IN, TOURED} exactly; NO_SHOW and CANCELLED
          rows are excluded.
      (b) window: current state at request time; no time window.
      (c) order-insensitive (a count), so no tie-break is required.
    constants: {}
    precision: "non-negative integer"

# ===========================================================================
# 1.4  Validation Rules Table (ordered by priority)
# ===========================================================================
validations:

  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are both present and X-User-Role names a role declared in the RBAC matrix"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "the acting role appears in the target endpoint's roles list"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all

  - priority: 3
    category: business_constraint
    check: "request body/query shape: every required field present, types correct, enum members legal, numeric ranges honoured, limit in 1..100, offset >= 0, and datetime fields ISO 8601 UTC"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all

  - priority: 4
    category: existence
    check: "path-parameter resources exist, validated left to right"
    error_id: "ERR_CHANNEL_NOT_FOUND | ERR_GALLERY_NOT_FOUND | ERR_REPRESENTATIVE_NOT_FOUND | ERR_PROSPECT_NOT_FOUND | ERR_BOOKING_NOT_FOUND | ERR_PRESENTATION_NOT_FOUND | ERR_AGREEMENT_NOT_FOUND | ERR_FINANCING_APPLICATION_NOT_FOUND | ERR_RESCISSION_REQUEST_NOT_FOUND | ERR_REFUND_DISBURSEMENT_NOT_FOUND | ERR_CLOSING_PACKAGE_NOT_FOUND | ERR_RETRAINING_ASSIGNMENT_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with path ids"

  - priority: 5
    category: existence
    check: "foreign keys supplied in the request body exist, validated in declaration order (channel_id, prospect_id, gallery_id, booking_id, presentation_id, agreement_id, traded_in_agreement_id, rescission_request_id, rep_id)"
    error_id: "ERR_CHANNEL_NOT_FOUND | ERR_PROSPECT_NOT_FOUND | ERR_GALLERY_NOT_FOUND | ERR_BOOKING_NOT_FOUND | ERR_PRESENTATION_NOT_FOUND | ERR_AGREEMENT_NOT_FOUND | ERR_RESCISSION_REQUEST_NOT_FOUND | ERR_REPRESENTATIVE_NOT_FOUND"
    http_status: 404
    applies_to: "all POST endpoints carrying foreign keys"

  - priority: 6
    category: auth
    check: "for the entity_backed SalesRepresentative role, X-User-ID equals the SalesRepresentative id that owns the target resource (booking.assigned_rep_id, presentation.rep_id or agreement.rep_id)"
    error_id: ERR_REPRESENTATIVE_MISMATCH
    http_status: 403
    applies_to: "POST /sales-presentations, POST /disclosure-acknowledgments, POST /sales-presentations/{id}/complete, POST /purchase-agreements, POST /financing-applications"

  - priority: 7
    category: state
    check: "the OCC field expected_<parent>_version equals the current parent version (see concurrency_rules)"
    error_id: "ERR_STALE_AGREEMENT_VERSION | ERR_STALE_PRESENTATION_VERSION | ERR_STALE_REPRESENTATIVE_VERSION"
    http_status: 412
    applies_to: "POST /financing-applications, POST /prohibited-claim-findings, POST /retraining-assignments"

  - priority: 8
    category: state
    check: "the target resource is in a state from which the requested transition exists (see state_machines)"
    error_id: "ERR_INVALID_BOOKING_STATE | ERR_INVALID_PRESENTATION_STATE | ERR_INVALID_AGREEMENT_STATE | ERR_INVALID_FINANCING_STATE | ERR_INVALID_RESCISSION_REQUEST_STATE | ERR_INVALID_CLOSING_PACKAGE_STATE | ERR_INVALID_RETRAINING_STATE"
    http_status: 409
    applies_to: "all action endpoints"

  - priority: 9
    category: state
    check: "funding is refused while the statutory rescission period has not expired (agreement.rescission_status must be EXPIRED)"
    error_id: ERR_RESCISSION_PERIOD_ACTIVE
    http_status: 409
    applies_to: "POST /purchase-agreements/{id}/fund"

  - priority: 10
    category: state
    check: "rescission intake and adjudication are refused once the agreement has been funded (fulfillment_status must be AWAITING_FUNDING)"
    error_id: ERR_AGREEMENT_ALREADY_FUNDED
    http_status: 409
    applies_to: "POST /rescission-requests, POST /rescission-requests/{id}/adjudicate"

  - priority: 11
    category: state
    check: "a RefundDisbursement already exists for this RescissionRequest"
    error_id: ERR_REFUND_ALREADY_ISSUED
    http_status: 409
    applies_to: "POST /refund-disbursements"

  - priority: 12
    category: state
    check: "at most one ComplianceRetrainingAssignment per (rep_id, trigger_reason) may sit in status ASSIGNED or IN_PROGRESS"
    error_id: ERR_RETRAINING_ALREADY_ACTIVE
    http_status: 409
    applies_to: "POST /retraining-assignments"

  - priority: 13
    category: state
    check: "cross-entity gating state: the booking's TourChannel must be ACTIVE"
    error_id: ERR_CHANNEL_SUSPENDED
    http_status: 409
    applies_to: "POST /tour-bookings, POST /tour-bookings/{id}/check-in, POST /tour-bookings/{id}/reschedule"

  - priority: 14
    category: state
    check: "cross-entity gating state: the booking's SalesGallery must be OPEN (RESTRICTED and CLOSED both refuse)"
    error_id: ERR_GALLERY_NOT_OPEN
    http_status: 409
    applies_to: "POST /tour-bookings, POST /tour-bookings/{id}/check-in, POST /tour-bookings/{id}/reschedule"

  - priority: 15
    category: business_safety
    check: "segregation of duties: the reviewing ComplianceOfficer's X-User-ID is not the reported_by_user_id of any ProhibitedClaimFinding on the presentation, and the disbursing ContractAdministrator's X-User-ID is not the RescissionRequest's adjudicated_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /sales-presentations/{id}/review, POST /refund-disbursements"

  - priority: 16
    category: business_safety
    check: "the presentation's disclosure_status is COMPLETE (all three REQUIRED_DISCLOSURE_CODES acknowledged by the prospect)"
    error_id: ERR_DISCLOSURES_INCOMPLETE
    http_status: 422
    applies_to: "POST /sales-presentations/{id}/complete, POST /purchase-agreements"

  - priority: 17
    category: business_safety
    check: "the presentation's review_status is CLEARED before an agreement may be executed; and a manual CLEAR decision requires compliance_score >= 70 with no EGREGIOUS finding"
    error_id: ERR_PRESENTATION_NOT_CLEARED
    http_status: 422
    applies_to: "POST /purchase-agreements, POST /sales-presentations/{id}/review"

  - priority: 18
    category: business_safety
    check: "the public offering statement delivery instant sits inside executed_at - 30 days .. executed_at + 3 days"
    error_id: ERR_POS_NOT_DELIVERED
    http_status: 422
    applies_to: "POST /purchase-agreements"

  - priority: 19
    category: business_referential
    check: "traded_in_agreement_id, when supplied, names an agreement whose prospect_id equals the new agreement's prospect_id"
    error_id: ERR_TRADE_IN_OWNER_MISMATCH
    http_status: 422
    applies_to: "POST /purchase-agreements"

  - priority: 20
    category: business_referential
    check: "traded_in_agreement_id, when supplied, names an agreement with fulfillment_status DOCS_DELIVERED and rescission_status EXPIRED"
    error_id: ERR_TRADE_IN_NOT_ELIGIBLE
    http_status: 409
    applies_to: "POST /purchase-agreements"

  - priority: 21
    category: business_temporal
    check: "scheduled_start_utc (or new_scheduled_start_utc) is at least MIN_BOOKING_LEAD_MINUTES (60) after the logical clock"
    error_id: ERR_TOUR_SLOT_IN_PAST
    http_status: 422
    applies_to: "POST /tour-bookings, POST /tour-bookings/{id}/reschedule"

  - priority: 22
    category: business_temporal
    check: "the logical clock may only move forward: to_iso8601 >= the current clock value"
    error_id: ERR_CLOCK_NOT_MONOTONIC
    http_status: 422
    applies_to: "POST /_clock/set_current_utc"

  - priority: 23
    category: business_constraint
    check: "uniqueness: TourChannel.channel_code is globally unique"
    error_id: ERR_CHANNEL_CODE_TAKEN
    http_status: 409
    applies_to: "POST /tour-channels"

  - priority: 24
    category: business_constraint
    check: "uniqueness: SalesRepresentative.rotation_position is unique within a gallery_id"
    error_id: ERR_ROTATION_POSITION_TAKEN
    http_status: 409
    applies_to: "POST /sales-representatives"

  - priority: 25
    category: business_constraint
    check: "uniqueness: at most one SalesPresentation per TourBooking"
    error_id: ERR_PRESENTATION_ALREADY_EXISTS
    http_status: 409
    applies_to: "POST /sales-presentations"

  - priority: 26
    category: business_constraint
    check: "uniqueness: at most one DisclosureAcknowledgment per (presentation_id, disclosure_code)"
    error_id: ERR_DISCLOSURE_ALREADY_ACKNOWLEDGED
    http_status: 409
    applies_to: "POST /disclosure-acknowledgments"

  - priority: 27
    category: business_constraint
    check: "uniqueness: at most one PurchaseAgreement per SalesPresentation"
    error_id: ERR_AGREEMENT_ALREADY_EXISTS
    http_status: 409
    applies_to: "POST /purchase-agreements"

  - priority: 28
    category: business_constraint
    check: "the reschedule cycle has not exceeded RESCHEDULE_LIMIT (2)"
    error_id: ERR_RESCHEDULE_LIMIT_EXCEEDED
    http_status: 409
    applies_to: "POST /tour-bookings/{id}/reschedule-requests"

  - priority: 29
    category: business_constraint
    check: "calculations.gallery_capacity_overlap_check does not reach gallery.concurrent_tour_capacity for the requested interval"
    error_id: ERR_GALLERY_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /tour-bookings, POST /tour-bookings/{id}/reschedule"

  - priority: 30
    category: business_constraint
    check: "calculations.representative_rotation_selection produces a non-empty candidate set after the status filter and calculations.representative_window_exclusivity"
    error_id: ERR_NO_ELIGIBLE_REPRESENTATIVE
    http_status: 409
    applies_to: "POST /tour-bookings/{id}/check-in"

  - priority: 31
    category: business_constraint
    check: "the prospect clears all three hard minimum criteria of the channel (min_age, min_household_income_cents, requires_married_household)"
    error_id: ERR_PROSPECT_BELOW_MINIMUM_CRITERIA
    http_status: 422
    applies_to: "POST /tour-bookings"

  - priority: 32
    category: business_constraint
    check: "tour_qualification_evaluation score >= channel.min_qualification_score"
    error_id: ERR_PROSPECT_NOT_QUALIFIED
    http_status: 422
    applies_to: "POST /tour-bookings"

  - priority: 33
    category: business_constraint
    check: "modules_completed >= assignment.required_module_count when the close outcome is COMPLETE"
    error_id: ERR_MODULE_COUNT_SHORTFALL
    http_status: 422
    applies_to: "POST /retraining-assignments/{id}/close"

  - priority: 34
    category: business_fiscal
    check: "down_payment_cents >= agreement_financials step 2 down_payment_required_cents"
    error_id: ERR_DOWN_PAYMENT_INSUFFICIENT
    http_status: 422
    applies_to: "POST /purchase-agreements"

  - priority: 35
    category: business_fiscal
    check: "when financed_amount_cents > 0, an APPROVED FinancingApplication exists for the agreement"
    error_id: ERR_FINANCING_NOT_APPROVED
    http_status: 409
    applies_to: "POST /purchase-agreements/{id}/fund"

  - priority: 36
    category: business_fiscal
    check: "the APPROVED application's approved_amount_cents >= agreement.financed_amount_cents"
    error_id: ERR_FINANCING_AMOUNT_SHORTFALL
    http_status: 422
    applies_to: "POST /purchase-agreements/{id}/fund"

  - priority: 37
    category: business_fiscal
    check: "collected_amount_cents == agreement.financed_amount_cents exactly (0 for all-cash agreements)"
    error_id: ERR_FUNDING_AMOUNT_MISMATCH
    http_status: 422
    applies_to: "POST /purchase-agreements/{id}/fund"

# ===========================================================================
# 1.5  API Endpoint Table
# ===========================================================================
endpoints:

  # --- tour generation channels ------------------------------------------
  - method: POST
    path: "/tour-channels"
    description: "Register a tour-generation channel with its incentive gift value and minimum qualification criteria."
    roles: [MarketingManager]
    code: 201
    input: [name, channel_code, incentive_gift_value_cents, min_age, min_household_income_cents, min_qualification_score, "requires_married_household?"]
    output: TourChannel
    side_effects:
      - "status ACTIVE; booked_count, toured_count, no_show_count, gift_liability_cents initialised to 0"
      - "historical_no_show_rate initialised to 0.0000 via the empty-denominator branch of channel_no_show_rate"

  - method: POST
    path: "/tour-channels/{id}/reinstate"
    description: "Lift a no-show suspension and reset the channel's no-show probation baseline."
    roles: [MarketingManager]
    code: 200
    input: []
    output: TourChannel
    side_effects:
      - "status SUSPENDED -> ACTIVE"
      - "toured_count and no_show_count reset to 0; booked_count preserved"
      - "historical_no_show_rate recomputed to 0.0000"

  - method: GET
    path: "/tour-channels/{id}"
    description: "Read a tour-generation channel."
    roles: [MarketingManager, GalleryManager, SalesRepresentative, ComplianceOfficer, ContractAdministrator, PlatformAdmin]
    code: 200
    input: []
    output: TourChannel
    side_effects: []

  - method: GET
    path: "/tour-channels/{id}/no-show-summary"
    description: "Computed read of the channel's no-show aggregation and outstanding incentive-gift liability."
    roles: [MarketingManager, GalleryManager, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: []
    output: "{ channel_id: string, status: string, booked_count: integer, toured_count: integer, no_show_count: integer, denominator: integer, historical_no_show_rate: number, gift_liability_cents: integer, suspend_threshold_met: boolean }"
    side_effects: []

  # --- sales galleries ----------------------------------------------------
  - method: POST
    path: "/sales-galleries"
    description: "Create a sales gallery with its concurrent tour capacity, presentation length and turnaround buffer."
    roles: [GalleryManager]
    code: 201
    input: [name, site_code, concurrent_tour_capacity, presentation_minutes, "buffer_minutes?"]
    output: SalesGallery
    side_effects:
      - "status OPEN; booked_slot_count 0; available_rep_count 0"

  - method: POST
    path: "/sales-galleries/{id}/set-status"
    description: "Open or close a gallery. Requesting OPEN re-derives the posture, landing on RESTRICTED when available_rep_count is 0."
    roles: [GalleryManager]
    code: 200
    input: [status]
    output: SalesGallery
    side_effects:
      - "status set to CLOSED, or re-derived to OPEN/RESTRICTED from available_rep_count"

  - method: GET
    path: "/sales-galleries/{id}"
    description: "Read a sales gallery including its derived posture and slot/representative counters."
    roles: [MarketingManager, GalleryManager, SalesRepresentative, ComplianceOfficer, ContractAdministrator, PlatformAdmin]
    code: 200
    input: []
    output: SalesGallery
    side_effects: []

  # --- representatives ----------------------------------------------------
  - method: POST
    path: "/sales-representatives"
    description: "Add a sales representative to a gallery's assignment rotation."
    roles: [GalleryManager]
    code: 201
    input: [gallery_id, full_name, license_number, rotation_position]
    output: SalesRepresentative
    side_effects:
      - "status ACTIVE; all counters 0; cancellation_rate 0.0000"
      - "gallery.available_rep_count recomputed; a RESTRICTED gallery re-derives to OPEN"

  - method: GET
    path: "/sales-representatives/{id}"
    description: "Read a sales representative, including the version needed for the retraining OCC check."
    roles: [MarketingManager, GalleryManager, SalesRepresentative, ComplianceOfficer, ContractAdministrator, PlatformAdmin]
    code: 200
    input: []
    output: SalesRepresentative
    side_effects: []

  - method: GET
    path: "/sales-representatives"
    description: "List sales representatives, optionally filtered by gallery or status."
    roles: [MarketingManager, GalleryManager, SalesRepresentative, ComplianceOfficer, ContractAdministrator, PlatformAdmin]
    code: 200
    input: ["gallery_id?", "status?", "limit?", "offset?"]
    output: SalesRepresentative[]
    side_effects: []

  - method: GET
    path: "/sales-representatives/{id}/rescission-analysis"
    description: "Computed read of the 90-day cancellation-rate analysis for one representative."
    roles: [GalleryManager, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: []
    output: "{ representative_id: string, window_start_utc: string, window_end_utc: string, executed_count: integer, rescinded_count: integer, cancellation_rate: number, min_sample: integer, retraining_required: boolean }"
    side_effects: []

  # --- prospects ----------------------------------------------------------
  - method: POST
    path: "/prospects"
    description: "Register a prospect household for tour generation."
    roles: [MarketingManager]
    code: 201
    input: [household_name, primary_age, household_income_cents, marital_status]
    output: Prospect
    side_effects:
      - "is_existing_owner computed as false until a PurchaseAgreement for this prospect reaches FUNDED or beyond"

  - method: GET
    path: "/prospects/{id}"
    description: "Read a prospect household including the cross-entity is_existing_owner flag."
    roles: [MarketingManager, GalleryManager, SalesRepresentative, ComplianceOfficer, ContractAdministrator, PlatformAdmin]
    code: 200
    input: []
    output: Prospect
    side_effects: []

  # --- tour scheduling ----------------------------------------------------
  - method: POST
    path: "/tour-bookings"
    description: "Schedule a tour, running the qualification evaluation and the gallery capacity overlap check."
    roles: [MarketingManager]
    code: 201
    input: [channel_id, prospect_id, gallery_id, scheduled_start_utc]
    output: TourBooking
    side_effects:
      - "scheduled_end_utc = scheduled_start_utc + gallery.presentation_minutes"
      - "qualification_score and qualification_penalty_points frozen from tour_qualification_evaluation"
      - "channel.booked_count += 1"
      - "gallery.booked_slot_count recomputed by gallery_slot_occupancy_ledger"

  - method: POST
    path: "/tour-bookings/{id}/reschedule-requests"
    description: "Open a reschedule cycle on a scheduled tour, holding the interval."
    roles: [MarketingManager]
    code: 200
    input: [reason]
    output: TourBooking
    side_effects:
      - "status SCHEDULED -> RESCHEDULE_PENDING; reschedule_reason recorded"

  - method: POST
    path: "/tour-bookings/{id}/reschedule"
    description: "Close a reschedule cycle by committing a new interval, re-running the capacity overlap check."
    roles: [MarketingManager]
    code: 200
    input: [new_scheduled_start_utc]
    output: TourBooking
    side_effects:
      - "status RESCHEDULE_PENDING -> SCHEDULED; reschedule_count += 1"
      - "scheduled_start_utc and scheduled_end_utc replaced; qualification_score untouched"

  - method: POST
    path: "/tour-bookings/{id}/check-in"
    description: "Check a prospect in, assign a representative by rotation and optionally issue the incentive gift."
    roles: [GalleryManager]
    code: 200
    input: [issue_incentive_gift]
    output: TourBooking
    side_effects:
      - "status SCHEDULED -> CHECKED_IN; checked_in_at = clock_now"
      - "assigned_rep_id set by representative_rotation_selection; that rep ACTIVE -> ON_TOUR; rep.last_assigned_at = clock_now"
      - "when issue_incentive_gift is true: gift_issued true, gift_value_cents copied from the channel, channel.gift_liability_cents recomputed by gift_liability_ledger"

  - method: POST
    path: "/tour-bookings/{id}/no-show"
    description: "Record a no-show, driving the channel no-show rate cascade."
    roles: [MarketingManager]
    code: 200
    input: []
    output: TourBooking
    side_effects:
      - "status SCHEDULED -> NO_SHOW"
      - "channel.no_show_count += 1 then channel.historical_no_show_rate recomputed"
      - "channel may auto-suspend, which cancels its remaining SCHEDULED/RESCHEDULE_PENDING bookings in created_at ASC order"
      - "gallery.booked_slot_count recomputed for every gallery touched"

  - method: POST
    path: "/tour-bookings/{id}/cancel"
    description: "Cancel a tour before a presentation exists; compensates the slot and gift-liability accruals."
    roles: [MarketingManager]
    code: 200
    input: [reason]
    output: TourBooking
    side_effects:
      - "status -> CANCELLED; cancel_reason recorded"
      - "an ON_TOUR assigned rep reverts to ACTIVE"
      - "channel.gift_liability_cents and gallery.booked_slot_count recomputed"

  - method: GET
    path: "/tour-bookings/{id}"
    description: "Read a tour booking."
    roles: [MarketingManager, GalleryManager, SalesRepresentative, ComplianceOfficer, ContractAdministrator, PlatformAdmin]
    code: 200
    input: []
    output: TourBooking
    side_effects: []

  - method: GET
    path: "/tour-bookings"
    description: "List tour bookings filtered by channel, prospect, gallery, assigned representative or status."
    roles: [MarketingManager, GalleryManager, SalesRepresentative, ComplianceOfficer, ContractAdministrator, PlatformAdmin]
    code: 200
    input: ["channel_id?", "prospect_id?", "gallery_id?", "assigned_rep_id?", "status?", "limit?", "offset?"]
    output: TourBooking[]
    side_effects: []

  # --- presentation compliance -------------------------------------------
  - method: POST
    path: "/sales-presentations"
    description: "Open a sales presentation record for a checked-in tour, capturing the acknowledgment recording reference."
    roles: [SalesRepresentative]
    code: 201
    input: [booking_id, recorded_ack_reference]
    output: SalesPresentation
    side_effects:
      - "rep_id copied from booking.assigned_rep_id; window_start_utc/window_end_utc copied from the booking interval"
      - "disclosure_status PENDING; review_status UNREVIEWED; required_disclosure_count 3; disclosure_ack_count 0; compliance_score 70 (100 - 0 claim points - 30 disclosure-gap points)"

  - method: POST
    path: "/disclosure-acknowledgments"
    description: "Append a recorded prospect acknowledgment of a required disclosure."
    roles: [SalesRepresentative]
    code: 201
    input: [presentation_id, disclosure_code, acknowledged_by_prospect, recording_timestamp_offset_seconds]
    output: DisclosureAcknowledgment
    side_effects:
      - "presentation.disclosure_ack_count recomputed over DISTINCT REQUIRED_DISCLOSURE_CODES with acknowledged_by_prospect true"
      - "presentation.disclosure_status advances PENDING -> PARTIAL -> COMPLETE"
      - "presentation.compliance_score recomputed"

  - method: POST
    path: "/prohibited-claim-findings"
    description: "File a prohibited-claim finding against a presentation; may auto-flag it and strike the representative."
    roles: [ComplianceOfficer]
    code: 201
    input: [presentation_id, claim_code, severity, expected_presentation_version]
    output: ProhibitedClaimFinding
    side_effects:
      - "penalty_points derived from severity; reported_by_user_id = X-User-ID"
      - "presentation.prohibited_claim_points and presentation.compliance_score recomputed"
      - "when auto_flag holds: review_status -> FLAGGED, flag_count += 1, rep.compliance_strike_count += 1, possible rep suspension plus retraining assignment, possible gallery RESTRICTED"
      - "increments SalesPresentation.version by 1"

  - method: POST
    path: "/sales-presentations/{id}/review"
    description: "Record the compliance review decision on a presentation, subject to segregation of duties."
    roles: [ComplianceOfficer]
    code: 200
    input: [decision]
    output: SalesPresentation
    side_effects:
      - "review_status -> CLEARED or FLAGGED; reviewed_by_user_id = X-User-ID"
      - "a FLAG decision runs the same strike cascade as an auto-flag"

  - method: POST
    path: "/sales-presentations/{id}/complete"
    description: "Close the presentation and mark the tour as toured, releasing the representative."
    roles: [SalesRepresentative]
    code: 200
    input: []
    output: SalesPresentation
    side_effects:
      - "booking CHECKED_IN -> TOURED; rep ON_TOUR -> ACTIVE; rep.tours_taken_count += 1"
      - "channel.toured_count += 1; channel.historical_no_show_rate recomputed"

  - method: GET
    path: "/sales-presentations/{id}"
    description: "Read a sales presentation with both state dimensions and the version needed for the finding OCC check."
    roles: [MarketingManager, GalleryManager, SalesRepresentative, ComplianceOfficer, ContractAdministrator, PlatformAdmin]
    code: 200
    input: []
    output: SalesPresentation
    side_effects: []

  - method: GET
    path: "/sales-presentations"
    description: "List sales presentations filtered by booking or representative."
    roles: [MarketingManager, GalleryManager, SalesRepresentative, ComplianceOfficer, ContractAdministrator, PlatformAdmin]
    code: 200
    input: ["booking_id?", "rep_id?", "limit?", "offset?"]
    output: SalesPresentation[]
    side_effects: []

  - method: GET
    path: "/sales-presentations/{id}/disclosure-acknowledgments"
    description: "List the recorded disclosure acknowledgments appended to a presentation."
    roles: [MarketingManager, GalleryManager, SalesRepresentative, ComplianceOfficer, ContractAdministrator, PlatformAdmin]
    code: 200
    input: ["disclosure_code?", "limit?", "offset?"]
    output: DisclosureAcknowledgment[]
    side_effects: []

  - method: GET
    path: "/sales-presentations/{id}/prohibited-claim-findings"
    description: "List the prohibited-claim findings filed against a presentation."
    roles: [MarketingManager, GalleryManager, SalesRepresentative, ComplianceOfficer, ContractAdministrator, PlatformAdmin]
    code: 200
    input: ["severity?", "limit?", "offset?"]
    output: ProhibitedClaimFinding[]
    side_effects: []

  # --- purchase agreements ------------------------------------------------
  - method: POST
    path: "/purchase-agreements"
    description: "Execute a purchase agreement against a cleared presentation, optionally surrendering a prior agreement for equity trade-in."
    roles: [SalesRepresentative]
    code: 201
    input: [presentation_id, product_type, state_code, purchase_price_cents, down_payment_cents, pos_delivered_at, "traded_in_agreement_id?"]
    output: PurchaseAgreement
    side_effects:
      - "prospect_id and rep_id copied from the presentation chain; executed_at = clock_now"
      - "trade_in_equity_credit_cents from trade_in_equity_credit; all agreement_financials outputs computed"
      - "anchor_mode, statutory_rescission_days, rescission_anchor_utc, rescission_deadline_utc, business_day_rolled and refund_policy from rescission_deadline"
      - "rescission_status OPEN; fulfillment_status AWAITING_FUNDING; escrow_collected_cents = down_payment_cents"
      - "rep.executed_agreement_count += 1; rep.cancellation_rate recomputed"
      - "a surrendered prior agreement moves DOCS_DELIVERED -> TRADED_IN"

  - method: POST
    path: "/purchase-agreements/{id}/fund"
    description: "Fund a contract once the statutory rescission period has expired; creates the closing package."
    roles: [ContractAdministrator]
    code: 200
    input: [funding_reference, collected_amount_cents]
    output: PurchaseAgreement
    side_effects:
      - "fulfillment_status AWAITING_FUNDING -> FUNDED; funded_at = clock_now"
      - "total_collected_cents = escrow_collected_cents + collected_amount_cents"
      - "a ClosingPackage is created in AWAITING_RECORDING with instrument_type derived from product_type"
      - "Prospect.is_existing_owner becomes true"

  - method: GET
    path: "/purchase-agreements/{id}"
    description: "Read a purchase agreement with both state dimensions, all financial outputs and the version needed for the financing OCC check."
    roles: [MarketingManager, GalleryManager, SalesRepresentative, ComplianceOfficer, ContractAdministrator, PlatformAdmin]
    code: 200
    input: []
    output: PurchaseAgreement
    side_effects: []

  - method: GET
    path: "/purchase-agreements"
    description: "List purchase agreements filtered by presentation, prospect, representative, surrendered trade-in or either state dimension."
    roles: [MarketingManager, GalleryManager, SalesRepresentative, ComplianceOfficer, ContractAdministrator, PlatformAdmin]
    code: 200
    input: ["presentation_id?", "prospect_id?", "rep_id?", "traded_in_agreement_id?", "rescission_status?", "fulfillment_status?", "limit?", "offset?"]
    output: PurchaseAgreement[]
    side_effects: []

  - method: GET
    path: "/purchase-agreements/{id}/rescission-window"
    description: "Computed read of the statutory rescission window, naming the anchor variant that produced the deadline."
    roles: [MarketingManager, GalleryManager, SalesRepresentative, ComplianceOfficer, ContractAdministrator, PlatformAdmin]
    code: 200
    input: []
    output: "{ agreement_id: string, state_code: string, anchor_mode: string, anchor_utc: string, statutory_days: integer, business_day_rolled: boolean, rescission_deadline_utc: string, rescission_status: string, clock_now: string, is_open_now: boolean }"
    side_effects: []

  # --- financing ----------------------------------------------------------
  - method: POST
    path: "/financing-applications"
    description: "Submit a financing application for an executed agreement; supersedes any prior application on that agreement."
    roles: [SalesRepresentative]
    code: 201
    input: [agreement_id, requested_amount_cents, applicant_fico, term_months, expected_agreement_version]
    output: FinancingApplication
    side_effects:
      - "status SUBMITTED; underwriting fields null"
      - "any prior FinancingApplication on the agreement in SUBMITTED or APPROVED moves to WITHDRAWN, processed in created_at ASC order"
      - "increments PurchaseAgreement.version by 1"

  - method: POST
    path: "/financing-applications/{id}/decision"
    description: "Record the underwriting decision, populating the tiered rate and amortization on approval only."
    roles: [ContractAdministrator]
    code: 200
    input: [decision]
    output: FinancingApplication
    side_effects:
      - "APPROVE: apr_bps, max_ltv_rate, ltv_cap_cents, approved_amount_cents and monthly_payment_cents set by financing_underwriting"
      - "DECLINE: every underwriting field stays null"
      - "decided_at = clock_now; decided_by_user_id = X-User-ID"

  - method: GET
    path: "/financing-applications/{id}"
    description: "Read a financing application."
    roles: [MarketingManager, GalleryManager, SalesRepresentative, ComplianceOfficer, ContractAdministrator, PlatformAdmin]
    code: 200
    input: []
    output: FinancingApplication
    side_effects: []

  - method: GET
    path: "/financing-applications"
    description: "List financing applications filtered by agreement or status."
    roles: [MarketingManager, GalleryManager, SalesRepresentative, ComplianceOfficer, ContractAdministrator, PlatformAdmin]
    code: 200
    input: ["agreement_id?", "status?", "limit?", "offset?"]
    output: FinancingApplication[]
    side_effects: []

  # --- rescission administration ------------------------------------------
  - method: POST
    path: "/rescission-requests"
    description: "Take in a written cancellation notice and freeze its timeliness basis."
    roles: [ContractAdministrator]
    code: 201
    input: [agreement_id, delivery_method, "postmark_utc?"]
    output: RescissionRequest
    side_effects:
      - "received_at = clock_now; intake_user_id = X-User-ID; status RECEIVED"
      - "timeliness_basis, effective_utc and is_timely frozen by rescission_timeliness"

  - method: POST
    path: "/rescission-requests/{id}/adjudicate"
    description: "Adjudicate a cancellation notice; the server picks the VALIDATED or REJECTED_LATE branch from is_timely."
    roles: [ContractAdministrator]
    code: 200
    input: []
    output: RescissionRequest
    side_effects:
      - "adjudicated_at = clock_now; adjudicated_by_user_id = X-User-ID"
      - "timely branch: agreement rescission_status -> RESCINDED and fulfillment_status -> VOIDED, then the four-step representative/retraining/gallery cascade, plus cancellation of the agreement's SUBMITTED/APPROVED financing applications"
      - "late branch: no agreement, representative, retraining or gallery state is touched"

  - method: GET
    path: "/rescission-requests/{id}"
    description: "Read a rescission request with its frozen timeliness determination."
    roles: [MarketingManager, GalleryManager, SalesRepresentative, ComplianceOfficer, ContractAdministrator, PlatformAdmin]
    code: 200
    input: []
    output: RescissionRequest
    side_effects: []

  - method: GET
    path: "/rescission-requests"
    description: "List rescission requests filtered by agreement or status."
    roles: [MarketingManager, GalleryManager, SalesRepresentative, ComplianceOfficer, ContractAdministrator, PlatformAdmin]
    code: 200
    input: ["agreement_id?", "status?", "limit?", "offset?"]
    output: RescissionRequest[]
    side_effects: []

  - method: POST
    path: "/refund-disbursements"
    description: "Create the refund disbursement for a validated cancellation, applying the jurisdiction's refund policy."
    roles: [ContractAdministrator]
    code: 201
    input: [rescission_request_id, method]
    output: RefundDisbursement
    side_effects:
      - "refund_policy_applied, base_refund_cents, gift_recapture_cents, doc_fee_retained_cents and disbursed_amount_cents from refund_settlement"
      - "status PENDING; issued_by_user_id = X-User-ID"

  - method: POST
    path: "/refund-disbursements/{id}/settle"
    description: "Settle the refund, closing the cancellation and pinning the retained amount on the agreement."
    roles: [ContractAdministrator]
    code: 200
    input: [settlement_reference]
    output: RefundDisbursement
    side_effects:
      - "status PENDING -> ISSUED; settled_at = clock_now"
      - "rescission request VALIDATED -> REFUNDED"
      - "agreement.retained_cents = gift_recapture_cents + doc_fee_retained_cents"

  - method: GET
    path: "/refund-disbursements/{id}"
    description: "Read a refund disbursement."
    roles: [MarketingManager, GalleryManager, SalesRepresentative, ComplianceOfficer, ContractAdministrator, PlatformAdmin]
    code: 200
    input: []
    output: RefundDisbursement
    side_effects: []

  - method: GET
    path: "/refund-disbursements"
    description: "List refund disbursements filtered by rescission request or status."
    roles: [MarketingManager, GalleryManager, SalesRepresentative, ComplianceOfficer, ContractAdministrator, PlatformAdmin]
    code: 200
    input: ["rescission_request_id?", "status?", "limit?", "offset?"]
    output: RefundDisbursement[]
    side_effects: []

  # --- closing ------------------------------------------------------------
  - method: POST
    path: "/closing-packages/{id}/record"
    description: "Record the deed or right-to-use instrument, bubbling the agreement to RECORDED."
    roles: [ContractAdministrator]
    code: 200
    input: [recording_reference, recording_jurisdiction]
    output: ClosingPackage
    side_effects:
      - "status AWAITING_RECORDING -> RECORDED; recorded_at = clock_now"
      - "agreement.fulfillment_status FUNDED -> RECORDED"

  - method: POST
    path: "/closing-packages/{id}/deliver"
    description: "Deliver the closing document package, bubbling the agreement to DOCS_DELIVERED."
    roles: [ContractAdministrator]
    code: 200
    input: [delivery_method]
    output: ClosingPackage
    side_effects:
      - "status RECORDED -> DELIVERED; documents_delivered_at = clock_now"
      - "agreement.fulfillment_status RECORDED -> DOCS_DELIVERED"

  - method: GET
    path: "/closing-packages/{id}"
    description: "Read a closing package."
    roles: [MarketingManager, GalleryManager, SalesRepresentative, ComplianceOfficer, ContractAdministrator, PlatformAdmin]
    code: 200
    input: []
    output: ClosingPackage
    side_effects: []

  - method: GET
    path: "/closing-packages"
    description: "List closing packages filtered by agreement or status; the only discovery channel for cascade-created packages."
    roles: [MarketingManager, GalleryManager, SalesRepresentative, ComplianceOfficer, ContractAdministrator, PlatformAdmin]
    code: 200
    input: ["agreement_id?", "status?", "limit?", "offset?"]
    output: ClosingPackage[]
    side_effects: []

  # --- compliance retraining ----------------------------------------------
  - method: POST
    path: "/retraining-assignments"
    description: "Manually assign compliance retraining to a representative."
    roles: [ComplianceOfficer]
    code: 201
    input: [rep_id, trigger_reason, required_module_count, expected_representative_version]
    output: ComplianceRetrainingAssignment
    side_effects:
      - "status ASSIGNED; cycle_index 1; assigned_at = clock_now; strike_count_at_assignment snapshotted"
      - "increments SalesRepresentative.version by 1"

  - method: POST
    path: "/retraining-assignments/{id}/start"
    description: "Begin a retraining assignment, moving the representative out of the rotation."
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: ComplianceRetrainingAssignment
    side_effects:
      - "status ASSIGNED -> IN_PROGRESS; started_at = clock_now"
      - "rep ACTIVE -> RETRAINING; gallery.available_rep_count recomputed and posture re-derived"

  - method: POST
    path: "/retraining-assignments/{id}/close"
    description: "Close a retraining assignment as complete or failed."
    roles: [ComplianceOfficer]
    code: 200
    input: [outcome, modules_completed]
    output: ComplianceRetrainingAssignment
    side_effects:
      - "COMPLETE: status -> COMPLETED, rep.compliance_strike_count reset to 0, rep returns to ACTIVE when no other assignment is open, gallery posture re-derived"
      - "FAIL: status -> FAILED, rep stays out of the rotation, strikes preserved"

  - method: POST
    path: "/retraining-assignments/{id}/reassign"
    description: "Re-open a failed retraining assignment for another cycle."
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: ComplianceRetrainingAssignment
    side_effects:
      - "status FAILED -> ASSIGNED; cycle_index += 1; modules_completed reset to 0; started_at and closed_at reset to null"

  - method: GET
    path: "/retraining-assignments/{id}"
    description: "Read a retraining assignment."
    roles: [MarketingManager, GalleryManager, SalesRepresentative, ComplianceOfficer, ContractAdministrator, PlatformAdmin]
    code: 200
    input: []
    output: ComplianceRetrainingAssignment
    side_effects: []

  - method: GET
    path: "/retraining-assignments"
    description: "List retraining assignments filtered by representative, reason or status; the only discovery channel for cascade-created assignments."
    roles: [MarketingManager, GalleryManager, SalesRepresentative, ComplianceOfficer, ContractAdministrator, PlatformAdmin]
    code: 200
    input: ["rep_id?", "trigger_reason?", "status?", "limit?", "offset?"]
    output: ComplianceRetrainingAssignment[]
    side_effects: []

  # --- test-driving endpoints ---------------------------------------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical clock. Before the first call the logical clock reads exactly 2026-08-01T00:00:00Z and never falls back to real wall-clock time. The clock may only move forward."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string, previous_utc: string }"
    side_effects:
      - "no entity state changes; subsequent requests read the new clock_now"

  - method: POST
    path: "/_ops/rescission-sweep"
    description: "Advance the rescission epoch: every OPEN agreement whose deadline is strictly behind the logical clock moves to EXPIRED."
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: "{ swept_count: integer, expired_agreement_ids: string_array, clock_now: string }"
    side_effects:
      - "agreement.rescission_status OPEN -> EXPIRED for every agreement with clock_now > rescission_deadline_utc, processed in executed_at ASC then created_at ASC order"
      - "fulfillment_status is never touched by the sweep"

# ===========================================================================
# 1.6  Error Code Catalog
# ===========================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, or X-User-Role is not a declared role"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "the acting role is not listed on the target endpoint"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "missing required field, wrong type, illegal enum member, out-of-range number, malformed datetime, bad pagination bounds, or an APPROVE decision on an application with applicant_fico below 620"
  - id: ERR_CHANNEL_NOT_FOUND
    http: 404
    condition: "channel id in path or body does not exist"
  - id: ERR_GALLERY_NOT_FOUND
    http: 404
    condition: "gallery id in path or body does not exist"
  - id: ERR_REPRESENTATIVE_NOT_FOUND
    http: 404
    condition: "representative id in path or body does not exist"
  - id: ERR_PROSPECT_NOT_FOUND
    http: 404
    condition: "prospect id in path or body does not exist"
  - id: ERR_BOOKING_NOT_FOUND
    http: 404
    condition: "tour booking id in path or body does not exist"
  - id: ERR_PRESENTATION_NOT_FOUND
    http: 404
    condition: "sales presentation id in path or body does not exist"
  - id: ERR_AGREEMENT_NOT_FOUND
    http: 404
    condition: "purchase agreement id in path or body (including traded_in_agreement_id) does not exist"
  - id: ERR_FINANCING_APPLICATION_NOT_FOUND
    http: 404
    condition: "financing application id in path does not exist"
  - id: ERR_RESCISSION_REQUEST_NOT_FOUND
    http: 404
    condition: "rescission request id in path or body does not exist"
  - id: ERR_REFUND_DISBURSEMENT_NOT_FOUND
    http: 404
    condition: "refund disbursement id in path does not exist"
  - id: ERR_CLOSING_PACKAGE_NOT_FOUND
    http: 404
    condition: "closing package id in path does not exist"
  - id: ERR_RETRAINING_ASSIGNMENT_NOT_FOUND
    http: 404
    condition: "retraining assignment id in path does not exist"
  - id: ERR_REPRESENTATIVE_MISMATCH
    http: 403
    condition: "the acting SalesRepresentative's X-User-ID is not the rep that owns the target booking, presentation or agreement"
  - id: ERR_STALE_AGREEMENT_VERSION
    http: 412
    condition: "expected_agreement_version does not equal the PurchaseAgreement's current version"
  - id: ERR_STALE_PRESENTATION_VERSION
    http: 412
    condition: "expected_presentation_version does not equal the SalesPresentation's current version"
  - id: ERR_STALE_REPRESENTATIVE_VERSION
    http: 412
    condition: "expected_representative_version does not equal the SalesRepresentative's current version"
  - id: ERR_INVALID_BOOKING_STATE
    http: 409
    condition: "the tour booking is not in a state from which the requested transition exists, or a no-show is recorded before scheduled_start_utc, or a cancel is attempted from CHECKED_IN once a presentation exists"
  - id: ERR_INVALID_PRESENTATION_STATE
    http: 409
    condition: "the presentation is not in a state from which the requested transition exists, including completing a presentation whose review_status is still UNREVIEWED"
  - id: ERR_INVALID_AGREEMENT_STATE
    http: 409
    condition: "the agreement's rescission_status or fulfillment_status forbids the requested transition"
  - id: ERR_INVALID_FINANCING_STATE
    http: 409
    condition: "the financing application is not SUBMITTED when a decision is recorded"
  - id: ERR_INVALID_RESCISSION_REQUEST_STATE
    http: 409
    condition: "the rescission request is not RECEIVED when adjudicated, or not VALIDATED when a disbursement is created"
  - id: ERR_INVALID_CLOSING_PACKAGE_STATE
    http: 409
    condition: "the closing package is not AWAITING_RECORDING when recorded, or not RECORDED when delivered"
  - id: ERR_INVALID_RETRAINING_STATE
    http: 409
    condition: "the retraining assignment is not in the required state, or a reassignment would exceed RETRAINING_CYCLE_LIMIT"
  - id: ERR_RESCISSION_PERIOD_ACTIVE
    http: 409
    condition: "funding attempted while the agreement's rescission_status is still OPEN"
  - id: ERR_AGREEMENT_ALREADY_FUNDED
    http: 409
    condition: "rescission intake or adjudication attempted on an agreement whose fulfillment_status is past AWAITING_FUNDING"
  - id: ERR_REFUND_ALREADY_ISSUED
    http: 409
    condition: "a RefundDisbursement already exists for this rescission request"
  - id: ERR_RETRAINING_ALREADY_ACTIVE
    http: 409
    condition: "an ASSIGNED or IN_PROGRESS assignment already exists for this (rep_id, trigger_reason) pair"
  - id: ERR_CHANNEL_SUSPENDED
    http: 409
    condition: "the booking's tour-generation channel is SUSPENDED"
  - id: ERR_GALLERY_NOT_OPEN
    http: 409
    condition: "the gallery's status is RESTRICTED or CLOSED"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "the reviewing officer filed a finding on the same presentation, or the disbursing administrator adjudicated the same rescission request"
  - id: ERR_DISCLOSURES_INCOMPLETE
    http: 422
    condition: "fewer than all three REQUIRED_DISCLOSURE_CODES have been acknowledged by the prospect"
  - id: ERR_PRESENTATION_NOT_CLEARED
    http: 422
    condition: "agreement execution on a presentation whose review_status is not CLEARED, or a manual CLEAR on a presentation scoring below 70 or carrying an EGREGIOUS finding"
  - id: ERR_POS_NOT_DELIVERED
    http: 422
    condition: "pos_delivered_at falls outside executed_at - 30 days .. executed_at + 3 days"
  - id: ERR_TRADE_IN_OWNER_MISMATCH
    http: 422
    condition: "the surrendered agreement belongs to a different prospect than the new agreement"
  - id: ERR_TRADE_IN_NOT_ELIGIBLE
    http: 409
    condition: "the surrendered agreement is not in fulfillment_status DOCS_DELIVERED with rescission_status EXPIRED"
  - id: ERR_TOUR_SLOT_IN_PAST
    http: 422
    condition: "the requested tour interval starts less than 60 minutes after the logical clock"
  - id: ERR_CLOCK_NOT_MONOTONIC
    http: 422
    condition: "the requested logical clock value is earlier than the current clock value"
  - id: ERR_CHANNEL_CODE_TAKEN
    http: 409
    condition: "another TourChannel already uses this channel_code"
  - id: ERR_ROTATION_POSITION_TAKEN
    http: 409
    condition: "another representative in the same gallery already holds this rotation_position"
  - id: ERR_PRESENTATION_ALREADY_EXISTS
    http: 409
    condition: "a SalesPresentation already exists for this booking"
  - id: ERR_DISCLOSURE_ALREADY_ACKNOWLEDGED
    http: 409
    condition: "this disclosure_code was already acknowledged on this presentation"
  - id: ERR_AGREEMENT_ALREADY_EXISTS
    http: 409
    condition: "a PurchaseAgreement already exists for this presentation"
  - id: ERR_RESCHEDULE_LIMIT_EXCEEDED
    http: 409
    condition: "the booking has already completed RESCHEDULE_LIMIT (2) reschedule cycles"
  - id: ERR_GALLERY_CAPACITY_EXCEEDED
    http: 409
    condition: "the requested interval collides with concurrent_tour_capacity occupying intervals under the gallery's half-open plus end-buffer geometry"
  - id: ERR_NO_ELIGIBLE_REPRESENTATIVE
    http: 409
    condition: "no ACTIVE representative in the gallery survives the representative window exclusivity filter"
  - id: ERR_PROSPECT_BELOW_MINIMUM_CRITERIA
    http: 422
    condition: "the prospect fails the channel's min_age, min_household_income_cents or requires_married_household hard criteria"
  - id: ERR_PROSPECT_NOT_QUALIFIED
    http: 422
    condition: "the tour qualification score is below the channel's min_qualification_score"
  - id: ERR_MODULE_COUNT_SHORTFALL
    http: 422
    condition: "a COMPLETE close reports fewer modules than required_module_count"
  - id: ERR_DOWN_PAYMENT_INSUFFICIENT
    http: 422
    condition: "down_payment_cents is below the tiered down_payment_required_cents"
  - id: ERR_FINANCING_NOT_APPROVED
    http: 409
    condition: "funding a financed agreement with no APPROVED financing application"
  - id: ERR_FINANCING_AMOUNT_SHORTFALL
    http: 422
    condition: "the approved financing amount is below the agreement's financed_amount_cents"
  - id: ERR_FUNDING_AMOUNT_MISMATCH
    http: 422
    condition: "collected_amount_cents does not equal the agreement's financed_amount_cents"

# ===========================================================================
# 1.7  RBAC Matrix
# ===========================================================================
roles:
  - name: MarketingManager
    description: "Owns tour generation: channels, incentive gift configuration, prospect intake and the tour schedule."
    identity: opaque
    exclusive_operations:
      - "POST /tour-channels"
      - "POST /tour-channels/{id}/reinstate"
      - "POST /prospects"
      - "POST /tour-bookings"
      - "POST /tour-bookings/{id}/reschedule-requests"
      - "POST /tour-bookings/{id}/reschedule"
      - "POST /tour-bookings/{id}/no-show"
      - "POST /tour-bookings/{id}/cancel"
    shared_operations:
      - "all GET endpoints except GET /sales-representatives/{id}/rescission-analysis"

  - name: GalleryManager
    description: "Owns gallery capacity, the representative roster and the rotation, and performs tour check-in."
    identity: opaque
    exclusive_operations:
      - "POST /sales-galleries"
      - "POST /sales-galleries/{id}/set-status"
      - "POST /sales-representatives"
      - "POST /tour-bookings/{id}/check-in"
    shared_operations:
      - "all GET endpoints including GET /sales-representatives/{id}/rescission-analysis"

  - name: SalesRepresentative
    description: "Conducts the presentation, records disclosure acknowledgments, executes purchase agreements and submits financing applications for their own tours."
    identity: "entity_backed:SalesRepresentative"
    exclusive_operations:
      - "POST /sales-presentations"
      - "POST /disclosure-acknowledgments"
      - "POST /sales-presentations/{id}/complete"
      - "POST /purchase-agreements"
      - "POST /financing-applications"
    shared_operations:
      - "all GET endpoints except GET /sales-representatives/{id}/rescission-analysis and GET /tour-channels/{id}/no-show-summary"

  - name: ComplianceOfficer
    description: "Files prohibited-claim findings, issues review decisions and administers compliance retraining. May never review a presentation they filed a finding on."
    identity: opaque
    exclusive_operations:
      - "POST /prohibited-claim-findings"
      - "POST /sales-presentations/{id}/review"
      - "POST /retraining-assignments"
      - "POST /retraining-assignments/{id}/start"
      - "POST /retraining-assignments/{id}/close"
      - "POST /retraining-assignments/{id}/reassign"
    shared_operations:
      - "all GET endpoints including GET /sales-representatives/{id}/rescission-analysis"

  - name: ContractAdministrator
    description: "Underwrites financing, funds contracts, records and delivers closing documents, and administers rescission intake, adjudication and refunds. May never disburse a refund on a request they adjudicated."
    identity: opaque
    exclusive_operations:
      - "POST /financing-applications/{id}/decision"
      - "POST /purchase-agreements/{id}/fund"
      - "POST /closing-packages/{id}/record"
      - "POST /closing-packages/{id}/deliver"
      - "POST /rescission-requests"
      - "POST /rescission-requests/{id}/adjudicate"
      - "POST /refund-disbursements"
      - "POST /refund-disbursements/{id}/settle"
    shared_operations:
      - "all GET endpoints except GET /sales-representatives/{id}/rescission-analysis"

  - name: PlatformAdmin
    description: "Operates the logical clock and the rescission sweep epoch. Holds no business write authority; this is a deliberate segregation-of-duties boundary."
    identity: opaque
    exclusive_operations:
      - "POST /_clock/set_current_utc"
      - "POST /_ops/rescission-sweep"
    shared_operations:
      - "all GET endpoints including GET /sales-representatives/{id}/rescission-analysis"
