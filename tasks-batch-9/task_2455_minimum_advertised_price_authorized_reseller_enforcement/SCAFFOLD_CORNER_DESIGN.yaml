              call: "POST /pricing-exceptions"
              payload: { product_id: "${prod}", exception_type: "PROMOTIONAL_EVENT", starts_at: "2026-08-21T00:00:00Z", ends_at: "2026-08-25T00:00:00Z", channel_scope: "PHYSICAL_RETAIL", requested_override_floor_cents: 13000, dealer_input_source: "BRAND_MARKETING_PLAN" }
              as: BrandChannelManager
              as_user_id: "bcm-1"
              captures: { exc: $.data.id }
            - *EXCAPPROVE
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-07-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /enforcement-sweeps"
              payload: {}
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { ea: $.data.expired_agreements, ee: $.data.expired_exceptions, ev: $.data.escalated_violations, rr: $.data.reinstated_resellers }
          assert:
