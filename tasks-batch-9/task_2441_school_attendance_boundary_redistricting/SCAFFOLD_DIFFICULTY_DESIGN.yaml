    grounds:
    - calculations.transfer_seat_pool
    - state_machines.AdoptionRecord.PENDING_EFFECTIVE_to_IN_EFFECT
    - state_machines.TransferRequest.WAITLISTED_to_APPROVED
    - entities.TransferRequest.fields.promotion_source
    distinguishing_aspect: 'MODE (c) - a circular-looking dependency resolved by a pinned evaluation order: the pool bounds approvals and approvals shrink the pool, so activate''s batch promotion must recompute transfer_seat_pool AFTER EACH promotion in created_at ASC order; with exactly one free seat, STU-003 is promoted to APPROVED / WAITLIST_AUTO and STU-004 must remain WAITLISTED, whereas a batch that snapshots the pool once promotes both.'
    test_recipe:
      setup:
      - 'The Riverbend study is adopted: Scenario A assigns A-01 and A-02 to Cedar Elementary (post-boundary enrollment 452) and A-03 to Birch Elementary (136); the AdoptionRecord is PENDING_EFFECTIVE with transfer_cap_pct 84.10 and TRANSFER_WINDOW_OPEN.'
