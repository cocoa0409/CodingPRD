              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 409 and error_id == ERR_CONTRACT_NOT_SIGNED"
            - "GET /rideshare/assignments returns 0 rows"

      - name: assign_to_non_target_mission_rejected
        claim_type: "Violation → Error"
        grounds:
          - errors.ERR_MISSION_MISMATCH
          - entities.LaunchContract.fields.target_mission_id
        distinguishing_aspect: "A contract with target_mission_id set to mission-1 rejects assignment of its payload to mission-2 with 422 ERR_MISSION_MISMATCH even though orbit, interface, port, window, and capacity all check out."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Mission-1 with DSP-A; mission-2 (SSO, identical window) with its own DSP-A2 port; contract signed with target_mission_id == mission-1 and payload PL1."
          setup_api_calls:
            - *k_clock
            - *k_customer
            - *k_mission
            - *k_port_a
            - call: "POST /rideshare/missions"
              payload: { mission_name: "Transporter-X7", target_orbit: "SSO", window_open_utc: "2026-10-10T00:00:00Z", window_close_utc: "2026-10-20T00:00:00Z", mass_capacity_kg: 300, volume_capacity_m3: 6.0 }
              as: MissionOps
              captures: { m2_id: $.data.id }
            - call: "POST /rideshare/missions/${m2_id}/dispenser-ports"
              payload: { port_code: "DSP-A", stack_position: 4, max_mass_kg: 150, supported_interface_classes: ["RING_15", "RING_24"] }
              as: MissionOps
              captures: { p_a2: $.data.id }
            - call: "POST /rideshare/contracts"
              payload: { customer_id: "${c_id}", pricing_mode: "MARGINAL", window_open_utc: "2026-10-01T00:00:00Z", window_close_utc: "2026-10-31T00:00:00Z", target_mission_id: "${m_id}", payloads: [{ payload_name: "PL1", mass_kg: 100, volume_m3: 2.0, interface_class: "RING_15", required_orbit: "SSO" }] }
              as: ContractManager
              captures: { ct_id: $.data.id }
            - call: "POST /rideshare/contracts/${ct_id}/sign"
              payload: {}
              as: Customer
              as_user_id: "${c_id}"
            - call: "GET /rideshare/contracts/${ct_id}/payloads"
              payload: {}
              as: MissionOps
              captures: { pl1: "$.data[0].id" }
            - call: "GET /rideshare/missions/${m2_id}"
              payload: {}
              as: MissionOps
              captures: { m2_v: $.data.version }
          trigger:
            - call: "POST /rideshare/assignments"
              payload: { mission_id: "${m2_id}", payload_id: "${pl1}", dispenser_port_id: "${p_a2}", expected_mission_version: "${m2_v}" }
              as: MissionOps
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 422 and error_id == ERR_MISSION_MISMATCH"
            - "GET /rideshare/assignments returns 0 rows"

      - name: confirm_without_all_verifications_rejected
        claim_type: "Violation → Error"
        grounds:
          - errors.ERR_VERIFICATION_INCOMPLETE
          - state_machines.ManifestAssignment.PROVISIONAL_to_CONFIRMED
        distinguishing_aspect: "Confirm requires the latest outcome of BOTH check types to be PASSED: with only MECHANICAL passed (and safety approved, license granted), confirm is 409 ERR_VERIFICATION_INCOMPLETE."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. A1 PROVISIONAL with MECHANICAL PASSED only; safety APPROVE recorded; customer license GRANTED."
          setup_api_calls:
            - *k_clock
            - *k_customer
            - *k_mission
            - *k_port_a
            - *k_contract_1pl
            - *k_sign
            - *k_payloads_1
            - *k_lic_c
            - *k_lic_c_grant
            - *k_getm1
            - *k_assign_a1
            - *k_ver_mech
            - *k_safety_ok
          trigger:
            - call: "POST /rideshare/assignments/${a1}/confirm"
              payload: {}
              as: MissionOps
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 409 and error_id == ERR_VERIFICATION_INCOMPLETE"
            - "ManifestAssignment.${a1}.status remains PROVISIONAL"

      - name: confirm_without_payload_license_rejected
        claim_type: "Violation → Error"
        grounds:
          - errors.ERR_LICENSE_NOT_GRANTED
          - state_machines.ManifestAssignment.PROVISIONAL_to_CONFIRMED
        distinguishing_aspect: "Even with both verifications PASSED and an APPROVE safety review, confirm is 422 ERR_LICENSE_NOT_GRANTED when the payload's customer holds no GRANTED PAYLOAD_OPERATOR license — the business_safety layer fires after the state layer has passed."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. A1 PROVISIONAL with MECHANICAL+ELECTRICAL PASSED and safety APPROVE; NO customer license filed."
          setup_api_calls:
            - *k_clock
            - *k_customer
            - *k_mission
            - *k_port_a
            - *k_contract_1pl
            - *k_sign
            - *k_payloads_1
            - *k_getm1
            - *k_assign_a1
            - *k_ver_mech
            - *k_ver_elec
            - *k_safety_ok
          trigger:
            - call: "POST /rideshare/assignments/${a1}/confirm"
              payload: {}
              as: MissionOps
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 422 and error_id == ERR_LICENSE_NOT_GRANTED"
            - "error_id != ERR_VERIFICATION_INCOMPLETE and != ERR_SAFETY_REVIEW_REQUIRED (both state gates passed)"
            - "ManifestAssignment.${a1}.status remains PROVISIONAL"

      - name: slot_confirm_without_window_containment_rejected
        claim_type: "Violation → Error"
        grounds:
          - errors.ERR_WINDOW_INCOMPATIBLE
          - state_machines.RangeSlot.RESERVED_to_CONFIRMED
        distinguishing_aspect: "Containment is strict superset-or-equal: a slot [2026-10-12, 2026-10-18] strictly inside the mission window [2026-10-10, 2026-10-20] fails confirm with 422 ERR_WINDOW_INCOMPATIBLE even with the launch license GRANTED and no COLA windows."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Mission MANIFEST_LOCKED; launch license GRANTED (valid_until 2026-12-31); CCAFS slot [2026-10-12, 2026-10-18] RESERVED."
          setup_api_calls:
            - *k_clock
            - *k_customer
            - *k_mission
            - *k_port_a
            - *k_contract_1pl
            - *k_sign
            - *k_payloads_1
            - *k_lic_c
            - *k_lic_c_grant
            - *k_getm1
            - *k_assign_a1
            - *k_ver_mech
            - *k_ver_elec
            - *k_safety_ok
            - *k_confirm_a1
            - *k_lock
            - *k_lic_m
            - *k_lic_m_grant
            - call: "POST /rideshare/range-slots"
              payload: { mission_id: "${m_id}", range_code: "CCAFS", window_open_utc: "2026-10-12T00:00:00Z", window_close_utc: "2026-10-18T00:00:00Z" }
              as: RangeOfficer
              captures: { s1: $.data.id }
            - call: "POST /rideshare/range-slots/${s1}/reserve"
              payload: {}
              as: RangeOfficer
          trigger:
            - call: "POST /rideshare/range-slots/${s1}/confirm"
              payload: {}
              as: RangeOfficer
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 422 and error_id == ERR_WINDOW_INCOMPATIBLE"
            - "RangeSlot.${s1}.status remains RESERVED and Mission.${m_id}.status remains MANIFEST_LOCKED"

  # ===========================================================================
  - section: rbac
    instances:

      - name: cross_role_exclusive_operations_denied
        claim_type: "Violation → Error"
        grounds:
          - roles.MissionOps
          - roles.Customer
          - roles.IntegrationEngineer
          - roles.SafetyOfficer
          - roles.RangeOfficer
          - roles.Regulator
          - validations[priority=2]
          - errors.ERR_FORBIDDEN
        distinguishing_aspect: "Priority-2 role gating is uniform: a Customer cannot create a mission, an IntegrationEngineer cannot file a safety review, a SafetyOfficer cannot record a verification, a RangeOfficer cannot decide a license, and MissionOps cannot request a range slot — all 403 ERR_FORBIDDEN with no side effects."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Mission with DSP-A; contract-1pl signed; A1 PROVISIONAL; customer license L SUBMITTED (never decided)."
          setup_api_calls:
            - *k_clock
            - *k_customer
            - *k_mission
            - *k_port_a
            - *k_contract_1pl
            - *k_sign
            - *k_payloads_1
            - *k_lic_c
            - *k_getm1
            - *k_assign_a1
          trigger:
            - call: "POST /rideshare/missions"
              payload: { mission_name: "Transporter-Q", target_orbit: "LEO", window_open_utc: "2026-11-01T00:00:00Z", window_close_utc: "2026-11-10T00:00:00Z", mass_capacity_kg: 100, volume_capacity_m3: 2.0 }
              as: Customer
              as_user_id: "${c_id}"
              captures: { e1: $.data.error_id }
            - call: "POST /rideshare/assignments/${a1}/safety-reviews"
              payload: { decision: "APPROVE" }
              as: IntegrationEngineer
              as_user_id: "eng-1"
              captures: { e2: $.data.error_id }
            - call: "POST /rideshare/assignments/${a1}/verifications"
              payload: { check_type: "ELECTRICAL", outcome: "PASSED" }
              as: SafetyOfficer
              as_user_id: "so-1"
              captures: { e3: $.data.error_id }
            - call: "POST /rideshare/licenses/${lic_c_id}/transition"
              payload: { to_state: "GRANTED" }
              as: RangeOfficer
              captures: { e4: $.data.error_id }
            - call: "POST /rideshare/range-slots"
              payload: { mission_id: "${m_id}", range_code: "VAFB", window_open_utc: "2026-10-10T00:00:00Z", window_close_utc: "2026-10-20T00:00:00Z" }
              as: MissionOps
              captures: { e5: $.data.error_id }
          assert:
            - "all five calls return 403 with e1 == e2 == e3 == e4 == e5 == ERR_FORBIDDEN"
            - "RegulatoryLicense.${lic_c_id}.status remains SUBMITTED"
            - "GET /rideshare/assignments/${a1}/safety-reviews returns 0 rows and GET /rideshare/assignments/${a1}/verifications returns 0 rows"

      - name: customer_scope_hides_other_customers_contract
        claim_type: "Violation → Error"
        grounds:
          - roles.Customer
          - validations[priority=3]
          - errors.ERR_CONTRACT_NOT_FOUND
        distinguishing_aspect: "Customer identity is entity_backed:Customer: a caller whose X-User-ID is customer-B gets 404 ERR_CONTRACT_NOT_FOUND reading or signing customer-A's contract (scope check at priority 3, before state), and the Customer-role list shows only their own contracts — while ContractManager reads the same row fine."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Customers A (Acme) and B (Beta Orbits); contract-1pl belongs to A and is already SIGNED by A."
          setup_api_calls:
            - *k_clock
            - *k_customer
            - call: "POST /rideshare/customers"
              payload: { org_name: "Beta Orbits", contact_email: "ops@beta-orbits.example", default_rebookings: 2 }
              as: PlatformAdmin
              captures: { c_b: $.data.id }
            - *k_contract_1pl
            - *k_sign
          trigger:
            - call: "GET /rideshare/contracts/${ct_id}"
              payload: {}
              as: Customer
              as_user_id: "${c_b}"
              captures: { e_read: $.data.error_id }
            - call: "POST /rideshare/contracts/${ct_id}/sign"
              payload: {}
              as: Customer
              as_user_id: "${c_b}"
              captures: { e_sign: $.data.error_id }
            - call: "GET /rideshare/contracts"
              payload: {}
              as: Customer
              as_user_id: "${c_b}"
            - call: "GET /rideshare/contracts/${ct_id}"
              payload: {}
              as: ContractManager
          assert:
            - "B's read returns 404 and e_read == ERR_CONTRACT_NOT_FOUND (not 403 — scope hides existence)"
            - "B's sign attempt on the already-SIGNED contract returns 404 and e_sign == ERR_CONTRACT_NOT_FOUND (scope at priority 3 precedes the DRAFT-state check)"
            - "B's list returns 0 rows"
            - "ContractManager's read returns 200 with status == SIGNED"

      - name: safety_reviewer_who_recorded_verification_is_denied
        claim_type: "Violation → Error"
        grounds:
          - complexity_profile.role_model
          - validations[priority=8]
          - errors.ERR_SOD_VIOLATION
          - entities.InterfaceVerification.fields.created_by_user_id
        distinguishing_aspect: "Segregation of duties across roles by user id: the SafetyOfficer call carrying X-User-ID eng-1 — the same id that recorded the PASSED verifications — is 403 ERR_SOD_VIOLATION, while a different SafetyOfficer id so-1 records the review 201."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. A1 PROVISIONAL; both verifications PASSED, each recorded with X-User-ID eng-1."
          setup_api_calls:
            - *k_clock
            - *k_customer
            - *k_mission
            - *k_port_a
            - *k_contract_1pl
            - *k_sign
            - *k_payloads_1
            - *k_getm1
            - *k_assign_a1
            - *k_ver_mech
            - *k_ver_elec
          trigger:
            - call: "POST /rideshare/assignments/${a1}/safety-reviews"
              payload: { decision: "APPROVE", rationale: "self-review attempt" }
              as: SafetyOfficer
              as_user_id: "eng-1"
              captures: { error_id: $.data.error_id }
            - call: "POST /rideshare/assignments/${a1}/safety-reviews"
              payload: { decision: "APPROVE", rationale: "independent review" }
              as: SafetyOfficer
              as_user_id: "so-1"
          assert:
            - "the eng-1 review returns 403 and error_id == ERR_SOD_VIOLATION"
            - "the so-1 review returns 201"
            - "GET /rideshare/assignments/${a1}/safety-reviews returns exactly 1 row (only the independent review persisted)"

  # ===========================================================================
  - section: complexity_layers
    instances:

      - name: occ_stale_mission_version_rejected_on_assignment_create
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[assignment-create-stale-mission]
          - errors.ERR_STALE_MISSION_VERSION
        distinguishing_aspect: "Two strictly sequential assignment creates: the first succeeds with the observed version (bumping Mission.version 1 -> 2); the second retries with the same stale expected_mission_version and is deterministically rejected 412 ERR_STALE_MISSION_VERSION; re-reading and resubmitting with the fresh version succeeds."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Mission (version observed as v) with DSP-A and DSP-B; contract signed with PL1 (RING_15) and PL2 (CUBESAT)."
          setup_api_calls:
            - *k_clock
            - *k_customer
            - *k_mission
            - *k_port_a
            - call: "POST /rideshare/missions/${m_id}/dispenser-ports"
              payload: { port_code: "DSP-B", stack_position: 3, max_mass_kg: 100, supported_interface_classes: ["CUBESAT"] }
              as: MissionOps
              captures: { p_b: $.data.id }
            - call: "POST /rideshare/contracts"
              payload: { customer_id: "${c_id}", pricing_mode: "MARGINAL", window_open_utc: "2026-10-01T00:00:00Z", window_close_utc: "2026-10-31T00:00:00Z", payloads: [{ payload_name: "PL1", mass_kg: 100, volume_m3: 2.0, interface_class: "RING_15", required_orbit: "SSO" }, { payload_name: "PL2", mass_kg: 50, volume_m3: 1.0, interface_class: "CUBESAT", required_orbit: "SSO" }] }
              as: ContractManager
              captures: { ct_id: $.data.id }
            - call: "POST /rideshare/contracts/${ct_id}/sign"
              payload: {}
              as: Customer
              as_user_id: "${c_id}"
            - call: "GET /rideshare/contracts/${ct_id}/payloads"
              payload: {}
              as: MissionOps
              captures: { pl1: "$.data[0].id", pl2: "$.data[1].id" }
            - *k_getm1
          trigger:
            - call: "POST /rideshare/assignments"
              payload: { mission_id: "${m_id}", payload_id: "${pl1}", dispenser_port_id: "${p_a}", expected_mission_version: "${m_v1}" }
              as: MissionOps
              captures: { a1: $.data.id }
            - call: "POST /rideshare/assignments"
              payload: { mission_id: "${m_id}", payload_id: "${pl2}", dispenser_port_id: "${p_b}", expected_mission_version: "${m_v1}" }
              as: MissionOps
              captures: { err_stale: $.data.error_id }
            - call: "GET /rideshare/missions/${m_id}"
              payload: {}
              as: MissionOps
              captures: { m_v2: $.data.version }
            - call: "POST /rideshare/assignments"
              payload: { mission_id: "${m_id}", payload_id: "${pl2}", dispenser_port_id: "${p_b}", expected_mission_version: "${m_v2}" }
              as: MissionOps
              captures: { a2: $.data.id }
          assert:
            - "the first create returns 201 (expected matched version ${m_v1})"
            - "the second create with the stale version returns 412 and err_stale == ERR_STALE_MISSION_VERSION"
            - "m_v2 == ${m_v1} + 1 (the successful create bumped the version exactly once)"
            - "the resubmitted create with the fresh version returns 201"
            - "Mission.${m_id}.committed_mass_kg == 150 and GET /rideshare/assignments?mission_id=${m_id} returns 2 rows"

      - name: occ_stale_contract_version_rejected_on_rebook
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[contract-rebook-stale-version]
          - errors.ERR_STALE_CONTRACT_VERSION
        distinguishing_aspect: "Two strictly sequential rebooks carrying the same observed contract version: the first succeeds (consuming the free right and bumping the version); the second is rejected 412 ERR_STALE_CONTRACT_VERSION — no double-spend of rebooking rights."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Contract-1pl SIGNED (version observed at sign). Missions M2 [2026-10-16..2026-10-26] and M3 [2026-10-20..2026-10-30] MANIFEST_OPEN, both covered by the contract window."
          setup_api_calls:
            - *k_clock
            - *k_customer
            - call: "POST /rideshare/missions"
              payload: { mission_name: "Transporter-B2", target_orbit: "SSO", window_open_utc: "2026-10-16T00:00:00Z", window_close_utc: "2026-10-26T00:00:00Z", mass_capacity_kg: 100, volume_capacity_m3: 2.0 }
              as: MissionOps
              captures: { m2_id: $.data.id }
            - call: "POST /rideshare/missions"
              payload: { mission_name: "Transporter-C3", target_orbit: "SSO", window_open_utc: "2026-10-20T00:00:00Z", window_close_utc: "2026-10-30T00:00:00Z", mass_capacity_kg: 100, volume_capacity_m3: 2.0 }
              as: MissionOps
              captures: { m3_id: $.data.id }
            - *k_contract_1pl
            - *k_sign
          trigger:
            - call: "POST /rideshare/contracts/${ct_id}/rebook"
              payload: { to_mission_id: "${m2_id}", expected_contract_version: "${ct_v}" }
              as: Customer
              as_user_id: "${c_id}"
            - call: "POST /rideshare/contracts/${ct_id}/rebook"
              payload: { to_mission_id: "${m3_id}", expected_contract_version: "${ct_v}" }
              as: Customer
              as_user_id: "${c_id}"
              captures: { err_stale: $.data.error_id }
          assert:
            - "the first rebook returns 200 (expected matched the version observed at signing)"
            - "the second rebook with the same stale version returns 412 and err_stale == ERR_STALE_CONTRACT_VERSION"
            - "LaunchContract.${ct_id}.target_mission_id == ${m2_id} (the losing rebook changed nothing)"
            - "LaunchContract.${ct_id}.rebookings_remaining == 0 (the right was consumed exactly once)"

      - name: expiry_sweep_on_clock_set_expires_contract_and_license
        claim_type: scheduled_actions
        grounds:
          - calculations.expiry_sweep
          - state_machines.LaunchContract.SIGNED_to_EXPIRED
          - state_machines.RegulatoryLicense.GRANTED_to_EXPIRED
        distinguishing_aspect: "Advancing the logical clock past the relevant cutoffs sweeps a SIGNED contract (window_close 2026-10-31 < now) to EXPIRED and a GRANTED license (valid_until 2026-10-15 < now) to EXPIRED, while a MANIFESTED contract is never swept and license EXPIRY does not cascade to the live assignment (contrast with REVOKED)."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Contract-X (payload PLX, never assigned) SIGNED with window [2026-10-01, 2026-10-31]. Contract-1pl SIGNED and MANIFESTED via A1 = PL1 on DSP-A. Customer PAYLOAD_OPERATOR license GRANTED with valid_until 2026-10-15."
          setup_api_calls:
            - *k_clock
            - *k_customer
            - *k_mission
            - *k_port_a
            - call: "POST /rideshare/contracts"
              payload: { customer_id: "${c_id}", pricing_mode: "MARGINAL", window_open_utc: "2026-10-01T00:00:00Z", window_close_utc: "2026-10-31T00:00:00Z", payloads: [{ payload_name: "PLX", mass_kg: 50, volume_m3: 1.0, interface_class: "CUBESAT", required_orbit: "SSO" }] }
              as: ContractManager
              captures: { ctx_id: $.data.id }
            - call: "POST /rideshare/contracts/${ctx_id}/sign"
              payload: {}
              as: Customer
              as_user_id: "${c_id}"
            - *k_contract_1pl
            - *k_sign
            - *k_payloads_1
            - call: "POST /rideshare/licenses"
              payload: { subject_type: "CUSTOMER", kind: "PAYLOAD_OPERATOR", customer_id: "${c_id}", valid_until: "2026-10-15T00:00:00Z", debris_score: 80, spectrum_score: 90, operator_history_score: 80 }
              as: Customer
              as_user_id: "${c_id}"
              captures: { lic_s: $.data.id }
            - call: "POST /rideshare/licenses/${lic_s}/transition"
              payload: { to_state: "GRANTED" }
              as: Regulator
            - *k_getm1
            - *k_assign_a1
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-11-01T00:00:00Z" }
              as: PlatformAdmin
          assert:
            - "LaunchContract.${ctx_id}.status == EXPIRED and rebook_eligible == false (SIGNED swept)"
            - "LaunchContract.${ct_id}.status == MANIFESTED (MANIFESTED contracts are never swept)"
            - "RegulatoryLicense.${lic_s}.status == EXPIRED (GRANTED with valid_until < now)"
            - "ManifestAssignment.${a1}.status remains PROVISIONAL (expiry does NOT cascade; only REVOKED does)"
            - "Mission.${m_id}.committed_mass_kg == 100 (unchanged)"

      - name: layer_dual_variant_calculation_covered_by_difficulty_index
        claim_type: dual_variant_calculation
        grounds:
          - complexity_profile.complexity_layers
        excluded_because:
          difficulty_instance: contract_quote_marginal_vs_flat_diverge_at_250kg
          rationale: "Both variants of contract_price_quote are executed and asserted there; the manifest_commitment dual variant is asserted in manifest_commitment_total_counts_provisional_firm_counts_confirmed_only."

      - name: layer_cascading_side_effects_covered_by_difficulty_index
        claim_type: cascading_side_effects
        grounds:
          - complexity_profile.complexity_layers
        excluded_because:
          difficulty_instance: delay_cascade_releases_slot_removes_assignments_flags_contracts
          rationale: "The 4-hop delay cascade (window move -> slot release -> assignment removal -> contract revert + mass recompute) is asserted hop-by-hop there; the revoke cascade is asserted in license_revoke_cascades_assignment_removal_and_contract_revert."

  # ===========================================================================
  - section: consistency_model
    instances:

      - name: writes_visible_immediately_in_same_response_and_read
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - endpoints.POST_/rideshare/assignments
        distinguishing_aspect: "Immediate consistency: the 201 create response itself carries the assignment in PROVISIONAL with the computed integration_fee_cents of 1,200,000 (100 kg x 12,000 x RING_15 factor 1.0), and an immediately-following GET of the assignment and of the mission show the identical state with committed_mass_kg already 100 — no lag, no read-repair."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Mission, DSP-A, signed contract-1pl with PL1 100 kg RING_15."
          setup_api_calls:
            - *k_clock
            - *k_customer
            - *k_mission
            - *k_port_a
            - *k_contract_1pl
            - *k_sign
            - *k_payloads_1
            - *k_getm1
          trigger:
            - call: "POST /rideshare/assignments"
              payload: { mission_id: "${m_id}", payload_id: "${pl1}", dispenser_port_id: "${p_a}", expected_mission_version: "${m_v1}" }
              as: MissionOps
              captures: { a1: $.data.id }
            - call: "GET /rideshare/assignments/${a1}"
              payload: {}
              as: MissionOps
            - call: "GET /rideshare/missions/${m_id}"
              payload: {}
              as: MissionOps
          assert:
            - "the create response itself carries status == PROVISIONAL, integration_fee_cents == 1200000, version == 1"
            - "the immediate GET of ManifestAssignment.${a1} shows the identical status and fee"
            - "the immediate GET of Mission.${m_id} already shows committed_mass_kg == 100 and committed_volume_m3 == 2.0"

  # ===========================================================================
  - section: errors
    instances:

      - name: contract_create_with_unknown_customer_rejected
        claim_type: "Violation → Error"
        grounds:
          - errors.ERR_CUSTOMER_NOT_FOUND
          - validations[priority=5]
        distinguishing_aspect: "A body foreign key that does not resolve is the typed 404: contract creation naming a non-existent customer_id returns ERR_CUSTOMER_NOT_FOUND, and nothing is persisted."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Empty database."
          setup_api_calls:
            - *k_clock
          trigger:
            - call: "POST /rideshare/contracts"
              payload: { customer_id: "00000000-0000-4000-8000-000000000030", pricing_mode: "MARGINAL", window_open_utc: "2026-10-01T00:00:00Z", window_close_utc: "2026-10-31T00:00:00Z", payloads: [{ payload_name: "OrphanSat", mass_kg: 10, volume_m3: 0.5, interface_class: "RING_15", required_orbit: "SSO" }] }
              as: ContractManager
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 404 and error_id == ERR_CUSTOMER_NOT_FOUND"
            - "GET /rideshare/contracts returns 0 rows"

      - name: launch_before_window_open_rejected
