              as_user_id: "sponsor-treasury-01"
              captures: { plan_b: $.data.id }
            - call: "POST /prt/plans/${plan_a}/participants"
              payload: { participant_reference: "AC-0201", cohort: "DEFERRED_VESTED", stated_monthly_benefit_cents: 100000, final_average_monthly_earnings_cents: 250000, credited_service_months: 320, date_of_birth: "1968-04-04" }
              as: PlanAdministrator
              as_user_id: "tpa-ops-01"
              captures: { a_dv: $.data.id }
            - call: "POST /prt/plans/${plan_a}/participants"
              payload: { participant_reference: "AC-0202", cohort: "RETIREE_IN_PAY", stated_monthly_benefit_cents: 250001, final_average_monthly_earnings_cents: 400000, credited_service_months: 420, date_of_birth: "1955-02-02" }
              as: PlanAdministrator
              as_user_id: "tpa-ops-01"
              captures: { a_rip: $.data.id }
            - call: "POST /prt/plans/${plan_b}/participants"
              payload: { participant_reference: "BH-0001", cohort: "DEFERRED_VESTED", stated_monthly_benefit_cents: 100000, final_average_monthly_earnings_cents: 250000, credited_service_months: 300, date_of_birth: "1969-06-06" }
              as: PlanAdministrator
              as_user_id: "tpa-ops-01"
              captures: { b_dv: $.data.id }
            - call: "POST /prt/plans/${plan_a}/tranches"
              payload: { tranche_name: "Ashcroft DV Tranche", target_cohort: "DEFERRED_VESTED" }
              as: PlanFiduciary
              as_user_id: "fiduciary-01"
              captures: { tranche_id: $.data.id }
          trigger:
            - call: "POST /prt/tranches/${tranche_id}/participant-assignments"
              payload: { participant_id: "6f1a0d2c-0000-4000-8000-00000000dead" }
              as: PlanAdministrator
              as_user_id: "tpa-ops-01"
            - call: "POST /prt/tranches/${tranche_id}/participant-assignments"
              payload: { participant_id: "${b_dv}" }
              as: PlanAdministrator
              as_user_id: "tpa-ops-01"
            - call: "POST /prt/tranches/${tranche_id}/participant-assignments"
              payload: { participant_id: "${a_rip}" }
              as: PlanAdministrator
              as_user_id: "tpa-ops-01"
            - call: "POST /prt/tranches/${tranche_id}/participant-assignments"
              payload: { participant_id: "${a_dv}" }
              as: PlanAdministrator
              as_user_id: "tpa-ops-01"
              captures: { count_after: $.data.assigned_participant_count, acct_after: $.data.accounting_liability_cents, settle_after: $.data.settlement_liability_cents, readiness: $.data.data_readiness_flag }
            - call: "POST /prt/tranches/${tranche_id}/participant-assignments"
              payload: { participant_id: "${a_dv}" }
