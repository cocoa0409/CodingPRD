              captures: { wid: $.data.id }
            - call: "POST /drone-ops/waivers/${wid}/safety-cases"
              payload: { mitigation_summary: "Propeller guards, crowd stand-off of 10 m, ballistic parachute.", ground_risk_class: 2, air_risk_class: "ARC_B", contingency_procedures: "Immediate land-away to the marked pad; event marshals clear the pad on call." }
