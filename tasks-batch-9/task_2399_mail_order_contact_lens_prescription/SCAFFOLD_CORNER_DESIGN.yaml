        excluded_because:
          difficulty_instance: transitive_cascade / dispute_upheld_cascades_into_cancellation_and_claim_void
          rationale: "The named §1.8 instance verifies every hop of the UPHELD cascade across Prescription, Order, ReimbursementClaim and the Customer ledgers."

