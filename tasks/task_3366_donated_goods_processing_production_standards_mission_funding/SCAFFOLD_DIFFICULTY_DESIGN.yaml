  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:

      - name: disburse_state_beats_fiscal
        grounds:
          - validations[priority=8]
          - validations[priority=15]
          - errors.ERR_INVALID_STATE
          - errors.ERR_INSUFFICIENT_MARGIN
        distinguishing_aspect: |
          Pair {state, business_fiscal}: approving a CANCELLED 999999-cent allocation
          violates both the PENDING-only state rule (p8) and the pool-sufficiency
          fiscal rule (p15); the state error ERR_INVALID_STATE must win.
        test_recipe:
          setup:
            - "Clock default. Org (reserve_floor 0, pool 0 -> margin HEALTHY since 0 >= 0). Program inside window. Allocation of 999999 created then cancelled while PENDING."
          setup_api_calls:
            - call: "POST /donated-goods/member-orgs"
              payload: { name: "Org Prio1", costing_method: "STANDARD", reserve_floor_cents: 0, diversion_floor_bps: 7500 }
              as: PlatformAdmin
              captures: { org_id: $.data.id, org_v: $.data.version }
            - call: "POST /donated-goods/mission-programs"
              payload: { member_org_id: "${org_id}", name: "Support", program_type: "SUPPORT", start_date: "2026-01-01T00:00:00Z", end_date: "2026-12-31T00:00:00Z", funding_goal_cents: 100000 }
              as: ProgramDirector
              as_user_id: "pd-1"
              captures: { prog_id: $.data.id }
            - call: "POST /donated-goods/funding-allocations"
              payload: { mission_program_id: "${prog_id}", amount_cents: 999999, expected_member_org_version: "${org_v}" }
              as: ProgramDirector
              as_user_id: "pd-1"
              captures: { alloc_id: $.data.id }
            - call: "POST /donated-goods/funding-allocations/${alloc_id}/cancel"
              payload: {}
              as: ProgramDirector
              as_user_id: "pd-1"
          trigger:
            - call: "POST /donated-goods/funding-allocations/${alloc_id}/approve"
              payload: {}
              as: MemberCFO
              as_user_id: "cfo-1"
              captures: { err: $.data.error_id }
          assert:
            - "the approve is rejected with ERR_INVALID_STATE (${err}), not ERR_INSUFFICIENT_MARGIN"
            - "FundingAllocation.${alloc_id}.status remains CANCELLED and org.reserved_cents remains 0"

      - name: allocation_window_beats_margin
        grounds:
          - validations[priority=13]
          - validations[priority=15]
          - errors.ERR_PROGRAM_WINDOW_CLOSED
          - errors.ERR_MARGIN_RESERVE_BREACH
        distinguishing_aspect: |
          Pair {business_temporal, business_fiscal} — a different category pair from
          instance 1: creating an allocation outside the program window on an org
          whose margin is LOW violates both p13 and p15; the temporal error
          ERR_PROGRAM_WINDOW_CLOSED must win.
        test_recipe:
          setup:
            - "Clock default 2026-09-01. Org with reserve_floor 1000 and pool 0 (margin_health LOW). Program window already closed (end 2026-06-30)."
          setup_api_calls:
            - call: "POST /donated-goods/member-orgs"
              payload: { name: "Org Prio2", costing_method: "STANDARD", reserve_floor_cents: 1000, diversion_floor_bps: 7500 }
              as: PlatformAdmin
              captures: { org_id: $.data.id, org_v: $.data.version }
            - call: "POST /donated-goods/mission-programs"
              payload: { member_org_id: "${org_id}", name: "Training", program_type: "JOB_TRAINING", start_date: "2026-01-01T00:00:00Z", end_date: "2026-06-30T00:00:00Z", funding_goal_cents: 50000 }
              as: ProgramDirector
              as_user_id: "pd-1"
              captures: { prog_id: $.data.id }
          trigger:
            - call: "POST /donated-goods/funding-allocations"
              payload: { mission_program_id: "${prog_id}", amount_cents: 100, expected_member_org_version: "${org_v}" }
              as: ProgramDirector
              as_user_id: "pd-1"
              captures: { err: $.data.error_id }
          assert:
            - "the create is rejected with ERR_PROGRAM_WINDOW_CLOSED (${err}), not ERR_MARGIN_RESERVE_BREACH"
            - "no allocation is persisted: GET /donated-goods/funding-allocations?mission_program_id=${prog_id} returns 0 rows"

