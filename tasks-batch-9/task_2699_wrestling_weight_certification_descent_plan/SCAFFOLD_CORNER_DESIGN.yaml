      - name: season_and_growth_allowance_create_read_list_round_trip
        claim_type: standard_crud
        grounds:
          - endpoints[POST /seasons]
          - endpoints[GET /seasons/{id}]
          - endpoints[POST /seasons/{id}/growth-allowances]
          - endpoints[GET /seasons/{id}/growth-allowances]
          - endpoints[GET /seasons/{id}/teams]
        distinguishing_aspect: "The CRUD surface here is create + read + list only — there is no PUT/PATCH/DELETE anywhere in §1.5, so mutation happens exclusively through action endpoints. This instance proves the create/read round trip carries every overridden regulatory constant back unchanged, that the child list is ordered by effective_date ASC regardless of insertion order, and that list filters narrow correctly."
        test_recipe:
          setup:
            - "A single season created with every optional constant overridden away from its declared default, plus two teams and two growth allowances inserted in reverse date order."
          setup_api_calls:
            - call: "POST /seasons"
              payload: { name: "2026-27 Custom Constants Season", start_date: "2026-11-01", weight_classes: [106, 120, 132, 145, 160, 180, 220, 285], min_body_fat_pct_male: 8.0, min_body_fat_pct_female: 13.0, hydration_max_specific_gravity: 1.020, max_weekly_descent_pct: 1.0, assessor_min_training_hours: 12, audit_fail_threshold_pct: 1.5, audit_min_sample_count: 4, max_consecutive_day_allowance_lbs: 3.0, appeal_filing_window_days: 7, max_appeal_retest_rounds: 1, assessor_daily_assessment_capacity: 5, plan_breach_limit: 3 }
              as: StateOffice
              captures: { season_id: $.data.id, created_status: $.data.status, created_teams: $.data.team_count, created_certified: $.data.certified_wrestler_count }
            - call: "POST /teams"
              payload: { season_id: "${season_id}", school_name: "Northgate High" }
              as: StateOffice
              captures: { team_1: $.data.id }
            - call: "POST /teams"
              payload: { season_id: "${season_id}", school_name: "Southgate High" }
              as: StateOffice
              captures: { team_2: $.data.id }
            - call: "POST /seasons/${season_id}/growth-allowances"
              payload: { effective_date: "2026-12-12", allowance_lbs: 3.0, note: "second growth date, inserted first" }
              as: StateOffice
              captures: { ga_late: $.data.id }
            - call: "POST /seasons/${season_id}/growth-allowances"
              payload: { effective_date: "2026-12-01", allowance_lbs: 1.0 }
              as: StateOffice
              captures: { ga_early: $.data.id, ga_early_note: $.data.note }
          trigger:
            - call: "GET /seasons/${season_id}"
              payload: {}
              as: TeamCoach
              as_user_id: "${team_1}"
              captures: { r_classes: $.data.weight_classes, r_male: $.data.min_body_fat_pct_male, r_female: $.data.min_body_fat_pct_female, r_usg: $.data.hydration_max_specific_gravity, r_rate: $.data.max_weekly_descent_pct, r_hours: $.data.assessor_min_training_hours, r_thresh: $.data.audit_fail_threshold_pct, r_minsample: $.data.audit_min_sample_count, r_consec: $.data.max_consecutive_day_allowance_lbs, r_window: $.data.appeal_filing_window_days, r_rounds: $.data.max_appeal_retest_rounds, r_capacity: $.data.assessor_daily_assessment_capacity, r_breach: $.data.plan_breach_limit, r_teams: $.data.team_count }
            - call: "GET /seasons/${season_id}/growth-allowances"
              payload: {}
              as: StateOffice
              captures: { first_ga: "$.data[0].id", first_date: "$.data[0].effective_date", first_lbs: "$.data[0].allowance_lbs", second_ga: "$.data[1].id", second_date: "$.data[1].effective_date" }
            - call: "GET /seasons/${season_id}/teams"
              payload: {}
              as: StateOffice
              captures: { team_list_first: "$.data[0].school_name" }
            - call: "GET /seasons/${season_id}/teams?compliance_status=PROBATION"
              payload: {}
              as: StateOffice
          assert:
            - "${created_status} == 'SETUP', ${created_teams} == 0 and ${created_certified} == 0 at create time"
            - "The read echoes every override with no default substituted: ${r_classes} == [106, 120, 132, 145, 160, 180, 220, 285], ${r_male} == 8.0, ${r_female} == 13.0, ${r_usg} == 1.020, ${r_rate} == 1.0, ${r_hours} == 12, ${r_thresh} == 1.5, ${r_minsample} == 4, ${r_consec} == 3.0, ${r_window} == 7, ${r_rounds} == 1, ${r_capacity} == 5, ${r_breach} == 3"
            - "${r_teams} == 2 — the derived counter moved with the two child creates, so read reflects writes immediately"
            - "${ga_early_note} == null (the one omitted optional field took its declared default)"
            - "${first_ga} == ${ga_early} with ${first_date} == '2026-12-01' and ${first_lbs} == 1.0, and ${second_ga} == ${ga_late} with ${second_date} == '2026-12-12': the list is effective_date ASC, NOT insertion order (which was the reverse); total_count == 2"
            - "GET /seasons/${season_id}/teams returns total_count == 2 with ${team_list_first} == 'Northgate High', while the compliance_status=PROBATION filter returns total_count == 0 and an empty data array — the filter narrows rather than being ignored"
            - "No PUT, PATCH or DELETE route exists for Season, Team or GrowthAllowance; every state change is an action endpoint"

      - name: assessor_suspension_action_enforces_preconditions_and_voids_only_drafts
        claim_type: action_endpoint
        grounds:
          - endpoints[POST /assessors/{id}/suspension]
          - state_machines.Assessment.DRAFT_to_VOIDED
          - validations[priority=17]
          - errors[ERR_ASSESSOR_INVALID_STATE]
        distinguishing_aspect: "An action endpoint whose side-effect set is deliberately narrower than the audit-FAIL cascade: suspension voids the assessor's DRAFT assessments only and leaves VALIDATED ones (and the wrestlers certified from them) untouched; it is idempotent-hostile (second call is ERR_ASSESSOR_INVALID_STATE) and immediately closes the assessor's ability to open new assessments (ERR_ASSESSOR_NOT_CERTIFIED)."
        test_recipe:
          setup:
            - "Open season, one team, one CERTIFIED assessor (8 training hours), wrestler A with one VALIDATED assessment and one still-DRAFT assessment by that assessor."
          setup_api_calls:
            - call: "POST /seasons"
              payload: { name: "2026-27 State Wrestling Season", start_date: "2026-11-01" }
              as: StateOffice
              captures: { season_id: $.data.id }
            - call: "POST /seasons/${season_id}/status"
              payload: { status: "OPEN" }
              as: StateOffice
            - call: "POST /teams"
              payload: { season_id: "${season_id}", school_name: "Northgate High" }
              as: StateOffice
              captures: { team_id: $.data.id }
            - call: "POST /assessors"
              payload: { full_name: "Dana Ruiz", credential_number: "AS-1001", certified_methods: ["SKINFOLD", "BIA"], certification_expires_on: "2027-06-30" }
              as: StateOffice
              captures: { assessor_id: $.data.id }
