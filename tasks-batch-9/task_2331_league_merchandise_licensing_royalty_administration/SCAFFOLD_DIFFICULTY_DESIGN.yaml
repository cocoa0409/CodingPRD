      - name: admin_fee_waiver_floor_exact_boundary_across_refile
        grounds:
          - calculations.advance_recoupment_and_payable
          - calculations.advance_recoupment_and_payable.constants.ADMIN_FEE_WAIVER_FLOOR_CENTS
          - entities.RoyaltyReport.fields.admin_fee_cents
          - state_machines.RoyaltyReport.FILED_to_RETURNED
          - state_machines.RoyaltyReport.RETURNED_to_FILED
        distinguishing_aspect: |
          ADMIN_FEE_WAIVER_FLOOR_CENTS is tested with >=, so cash_due_pre_fee 100000
          waives the fee entirely (total 100000) while 99999 attracts
          round_half_up(99999 * 150 / 10000) == 1500 (total 101499). The same report is
          re-filed after a RETURN, so both filings sit on the same period, the same
          deadline and the same untouched advance ledger — the ONLY difference is one
          cent of gross sales (13750000 vs 13749988). A > comparison, or truncating the
          fee instead of round_half_up, changes one of the two numbers.
