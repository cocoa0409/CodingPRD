scaffold_difficulty_design:
  # ===========================================================================
  # Rule 1 — dual_variant_calc (different entity domains)
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: reservation_fee_quote_vs_settlement_divergence
        grounds:
          - calculations.rental_fee_quote
          - calculations.rental_fee_settlement
          - entities.ReservationLine.fields.quoted_fee_cents
          - entities.ReservationLine.fields.settled_fee_cents
        distinguishing_aspect: |
          Same reservation window/rate data yields quoted_fee_cents == 500000
          (provisional, risk_score 0 at quote) but settled_fee_cents == 840000
          (final, risk_score 60 at settle after an intervening TOTAL_LOSS
          assessment plus a 2-block late return): the fee dual-variant lives on
          the ReservationLine domain.
        test_recipe:
          setup:
            - "Artist A1 (STANDARD, risk_score 0), Tour T1 ACTIVE with Stop S1 LAX 2026-08-10"
            - "GearModel M1 daily_rate_cents 100000, replacement_value_cents 300000, HAND_CARRY"
            - "GearUnit U1 of M1 home LAX; GearUnit U2 of M1 home LAX (used for the damaging rental)"
            - "RiderLine RL2 sourced first: reservation R2 (U2, LAX->LAX, 2026-08-03..2026-08-05) goes DISPATCHED->DELIVERED->RETURNED->INSPECTED; inspection files TOTAL_LOSS DamageClaim DC2; OpsManager assesses it -> artist risk_score becomes 60"
            - "RiderLine RL1 sourced: reservation R1 (U1, LAX->LAX, 2026-08-10..2026-08-15), quoted_fee_cents 500000, deposit 55000"
            - "R1 driven DISPATCHED -> DELIVERED; check-in at 2026-08-16T12:00:00Z (36h late = 2 blocks) -> RETURNED -> INSPECTED (no damage)"
          setup_api_calls:
            - call: "POST /backline/artists"
              payload: { legal_name: "The Variants", tier: "STANDARD" }
              as: OpsManager
              captures: { a1: $.data.id }
            - call: "POST /backline/artists/${a1}/deposit-topups"
              payload: { amount_cents: 110000 }
              as: OpsManager
            - call: "POST /backline/gear-models"
              payload: { sku: "DV-AMP-1", category: "AMP", daily_rate_cents: 100000, replacement_value_cents: 300000, weight_class: "HAND_CARRY" }
              as: OpsManager
              captures: { m1: $.data.id }
            - call: "POST /backline/gear-units"
              payload: { gear_model_id: "${m1}", serial_number: "DV-U1", home_city_code: "LAX" }
              as: OpsManager
              captures: { u1: $.data.id }
            - call: "POST /backline/gear-units"
              payload: { gear_model_id: "${m1}", serial_number: "DV-U2", home_city_code: "LAX" }
              as: OpsManager
              captures: { u2: $.data.id }
            - call: "POST /backline/tours"
              payload: { artist_id: "${a1}", name: "Variant Tour", start_date: "2026-08-01T00:00:00Z", end_date: "2026-08-31T00:00:00Z", insurance_policy_id: "POL-1" }
              as: TourManager
              captures: { t1: $.data.id }
            - call: "POST /backline/tours/${t1}/stops"
              payload: { city_code: "LAX", venue_date: "2026-08-04T00:00:00Z", load_in_ts: "2026-08-04T10:00:00Z" }
              as: TourManager
              captures: { s_early: $.data.id }
            - call: "POST /backline/tour-stops/${s_early}/rider-lines"
              payload: { gear_model_id: "${m1}", quantity: 1 }
              as: TourManager
              captures: { rl2: $.data.id }
            - call: "POST /backline/rider-lines/${rl2}/source"
              payload: { origin_city_code: "LAX", dest_city_code: "LAX", start_date: "2026-08-03T00:00:00Z", end_date: "2026-08-05T00:00:00Z" }
              as: LogisticsCoordinator
              captures: { r2: $.data.id }
            - call: "GET /backline/tours/${t1}"
              as: TourManager
              captures: { t1_v: $.data.version }
            - call: "POST /backline/tours/${t1}/activate"
              payload: { expected_tour_version: "${t1_v}" }
              as: TourManager
            - call: "POST /backline/shipments"
              payload: { tour_id: "${t1}", from_city_code: "LAX", to_city_code: "LAX", ship_date: "2026-08-03T00:00:00Z", capacity_kg: 1000 }
              as: LogisticsCoordinator
              captures: { sh2: $.data.id }
            - call: "POST /backline/shipments/${sh2}/lines"
              payload: { gear_unit_id: "${u2}", weight_kg: 20, labor_minutes: 30 }
              as: LogisticsCoordinator
            - call: "POST /backline/reservation-lines/${r2}/dispatch"
              payload: {}
              as: LogisticsCoordinator
            - call: "POST /backline/reservation-lines/${r2}/mark-delivered"
              payload: {}
              as: LogisticsCoordinator
            - call: "POST /backline/reservation-lines/${r2}/check-in"
              payload: { checked_in_at: "2026-08-05T09:00:00Z" }
              as: WarehouseTech
            - call: "POST /backline/reservation-lines/${r2}/inspect"
              payload: { damage_present: true, assessed_severity: "TOTAL_LOSS", repair_estimate_cents: 0 }
              as: WarehouseTech
            - call: "GET /backline/damage-claims"
              payload: { reservation_line_id: "${r2}" }
              as: OpsManager
              captures: { dc2: "$.data[0].id" }
            - call: "POST /backline/damage-claims/${dc2}/assess"
              payload: {}
              as: OpsManager
            - call: "POST /backline/tours/${t1}/stops"
              payload: { city_code: "LAX", venue_date: "2026-08-10T00:00:00Z", load_in_ts: "2026-08-10T10:00:00Z" }
              as: TourManager
              captures: { s1: $.data.id }
            - call: "POST /backline/tour-stops/${s1}/rider-lines"
              payload: { gear_model_id: "${m1}", quantity: 1 }
              as: TourManager
              captures: { rl1: $.data.id }
            - call: "POST /backline/rider-lines/${rl1}/source"
              payload: { origin_city_code: "LAX", dest_city_code: "LAX", start_date: "2026-08-10T00:00:00Z", end_date: "2026-08-15T00:00:00Z" }
              as: LogisticsCoordinator
              captures: { r1: $.data.id, r1_quoted: $.data.quoted_fee_cents }
            - call: "POST /backline/shipments/${sh2}/lines"
              payload: { gear_unit_id: "${u1}", weight_kg: 20, labor_minutes: 30 }
              as: LogisticsCoordinator
            - call: "POST /backline/reservation-lines/${r1}/dispatch"
              payload: {}
              as: LogisticsCoordinator
            - call: "POST /backline/reservation-lines/${r1}/mark-delivered"
              payload: {}
              as: LogisticsCoordinator
            - call: "POST /backline/reservation-lines/${r1}/check-in"
              payload: { checked_in_at: "2026-08-16T12:00:00Z" }
              as: WarehouseTech
            - call: "POST /backline/reservation-lines/${r1}/inspect"
              payload: { damage_present: false }
              as: WarehouseTech
            - call: "GET /backline/reservation-lines/${r1}"
              as: TourManager
              captures: { r1_v: $.data.version }
          trigger:
            - call: "POST /backline/reservation-lines/${r1}/settle"
              payload: { expected_reservation_version: "${r1_v}" }
              as: TourManager
              captures: { r1_settled: $.data.settled_fee_cents }
          assert:
            - "ReservationLine.${r1}.quoted_fee_cents == 500000"
            - "ReservationLine.${r1}.settled_fee_cents == 840000"
            - "quoted != settled: divergence is 340000 == insurance 40000 + late_fee 300000"

      - name: artist_risk_score_vs_deposit_hold_independent_variants
        grounds:
          - calculations.artist_risk_score
          - calculations.deposit_hold_rule
          - entities.Artist.fields.risk_score
          - entities.Artist.fields.deposit_credit_cents
        distinguishing_aspect: |
          A second dual-variant pair on a different entity domain (Artist, not
          ReservationLine): artist_risk_score recomputes from scratch (no
          incremental drift) while deposit_hold_rule reconciles incrementally
          with compensation; identical claim data yields risk_score 60 while
          deposit_credit_cents nets to a different, independently-verifiable
          value after hold-and-release.
        test_recipe:
          setup:
            - "Artist A2 topped up 75000; two sourced reservations hold 55000 (hi model rv 300000) + 20000 (lo model rv 100000) = 75000, so balance is drawn to 0; cancelling the hi reservation credits 55000 back"
            - "risk_score stays 0 throughout (no claims filed): recompute-from-scratch over an empty window, contrasting with the incremental deposit reconcile"
          setup_api_calls:
            - call: "POST /backline/artists"
              payload: { legal_name: "Risk Act", tier: "STANDARD" }
              as: OpsManager
              captures: { a2: $.data.id }
            - call: "POST /backline/artists/${a2}/deposit-topups"
              payload: { amount_cents: 75000 }
              as: OpsManager
            - call: "POST /backline/gear-models"
              payload: { sku: "RS-GTR-1", category: "GUITAR", daily_rate_cents: 50000, replacement_value_cents: 300000, weight_class: "HAND_CARRY" }
              as: OpsManager
              captures: { gm_hi: $.data.id }
            - call: "POST /backline/gear-models"
              payload: { sku: "RS-GTR-2", category: "GUITAR", daily_rate_cents: 10000, replacement_value_cents: 100000, weight_class: "HAND_CARRY" }
              as: OpsManager
              captures: { gm_lo: $.data.id }
            - call: "POST /backline/gear-units"
              payload: { gear_model_id: "${gm_hi}", serial_number: "RS-U1", home_city_code: "NYC" }
              as: OpsManager
              captures: { ru1: $.data.id }
            - call: "POST /backline/gear-units"
              payload: { gear_model_id: "${gm_lo}", serial_number: "RS-U2", home_city_code: "NYC" }
              as: OpsManager
              captures: { ru2: $.data.id }
            - call: "POST /backline/tours"
              payload: { artist_id: "${a2}", name: "Risk Tour", start_date: "2026-08-01T00:00:00Z", end_date: "2026-08-31T00:00:00Z", insurance_policy_id: "POL-2" }
              as: TourManager
              captures: { t2: $.data.id }
            - call: "POST /backline/tours/${t2}/stops"
              payload: { city_code: "NYC", venue_date: "2026-08-06T00:00:00Z", load_in_ts: "2026-08-06T10:00:00Z" }
              as: TourManager
              captures: { rs1: $.data.id }
            - call: "POST /backline/tour-stops/${rs1}/rider-lines"
              payload: { gear_model_id: "${gm_hi}", quantity: 1 }
              as: TourManager
              captures: { rrl_hi: $.data.id }
            - call: "POST /backline/rider-lines/${rrl_hi}/source"
              payload: { origin_city_code: "NYC", dest_city_code: "NYC", start_date: "2026-08-05T00:00:00Z", end_date: "2026-08-07T00:00:00Z" }
              as: LogisticsCoordinator
              captures: { rres_hi: $.data.id }
            - call: "POST /backline/tour-stops/${rs1}/rider-lines"
              payload: { gear_model_id: "${gm_lo}", quantity: 1 }
              as: TourManager
              captures: { rrl_lo: $.data.id }
            - call: "POST /backline/rider-lines/${rrl_lo}/source"
              payload: { origin_city_code: "NYC", dest_city_code: "NYC", start_date: "2026-08-05T00:00:00Z", end_date: "2026-08-07T00:00:00Z" }
              as: LogisticsCoordinator
              captures: { rres_lo: $.data.id }
            - call: "GET /backline/artists/${a2}"
              as: OpsManager
              captures: { a2_deposit_mid: $.data.deposit_credit_cents }
            - call: "POST /backline/reservation-lines/${rres_hi}/cancel"
              payload: {}
              as: TourManager
          trigger:
            - call: "GET /backline/artists/${a2}"
              as: OpsManager
              captures: { a2_deposit_after: $.data.deposit_credit_cents, a2_risk: $.data.risk_score }
          assert:
            - "Artist.${a2}.deposit_credit_cents after top-up and both holds == 0 (75000 - 55000 - 20000; holds debit the balance)"
            - "After cancelling the hi reservation: Artist.${a2}.deposit_credit_cents == 55000 (compensation credits exactly 55000 back; incremental reconcile, not recompute)"
            - "Artist.${a2}.risk_score == 0 before any claim assessment (recompute-from-scratch over empty window)"

  # ===========================================================================
  # Rule 2 — combinatorial_formula (different modes)
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: rental_fee_quote_multi_input_nonlinear
        grounds:
          - calculations.rental_fee_quote
          - calculations.rental_fee_settlement
        distinguishing_aspect: |
          Mode (a): formula with >= 3 inputs and non-linear interaction —
          base (rate x days) feeds a zone-multiplier branch (3-way conditional
          on city pair) AND a state-conditional insurance branch (risk_score
          >= 50), with cartage and insurance both computed off the same base;
          changing only dest city from LAX to NYC moves zone_mult 1.00 -> 1.25
          and adds cartage 125000 while leaving insurance at 0.
        test_recipe:
          setup:
            - "Artist (risk 0), model daily 100000, replacement 300000; two units home LAX"
            - "Reservation window 2026-08-10..2026-08-15 (5 days), origin LAX, dest NYC (cross-region -> 1.25)"
          setup_api_calls:
            - call: "POST /backline/artists"
              payload: { legal_name: "Zone Act", tier: "STANDARD" }
              as: OpsManager
              captures: { za: $.data.id }
            - call: "POST /backline/artists/${za}/deposit-topups"
              payload: { amount_cents: 55000 }
              as: OpsManager
            - call: "POST /backline/gear-models"
              payload: { sku: "CF-AMP-9", category: "AMP", daily_rate_cents: 100000, replacement_value_cents: 300000, weight_class: "STANDARD" }
              as: OpsManager
              captures: { zm: $.data.id }
            - call: "POST /backline/gear-units"
              payload: { gear_model_id: "${zm}", serial_number: "CF-U1", home_city_code: "LAX" }
              as: OpsManager
            - call: "POST /backline/tours"
              payload: { artist_id: "${za}", name: "Zone Tour", start_date: "2026-08-01T00:00:00Z", end_date: "2026-08-31T00:00:00Z", insurance_policy_id: "POL-Z" }
              as: TourManager
              captures: { zt: $.data.id }
            - call: "POST /backline/tours/${zt}/stops"
              payload: { city_code: "NYC", venue_date: "2026-08-12T00:00:00Z", load_in_ts: "2026-08-12T10:00:00Z" }
              as: TourManager
              captures: { zs: $.data.id }
            - call: "POST /backline/tour-stops/${zs}/rider-lines"
              payload: { gear_model_id: "${zm}", quantity: 1 }
              as: TourManager
              captures: { zrl: $.data.id }
          trigger:
            - call: "POST /backline/rider-lines/${zrl}/source"
              payload: { origin_city_code: "LAX", dest_city_code: "NYC", start_date: "2026-08-10T00:00:00Z", end_date: "2026-08-15T00:00:00Z" }
              as: LogisticsCoordinator
              captures: { zr: $.data.id, zr_quoted: $.data.quoted_fee_cents }
          assert:
            - "ReservationLine.${zr}.quoted_fee_cents == 625000 (base 500000 + cartage round(500000*0.25)=125000 + insurance 0)"
            - "deposit_held_cents == 55000 (tiered: 0.20*200000 + 0.15*100000)"

      - name: deposit_vs_fee_rounding_order_contrast
        grounds:
          - calculations.deposit_hold_rule
          - calculations.rental_fee_quote
        distinguishing_aspect: |
          Mode (b): nested rounding where order matters — deposit_hold_rule
          pins sum-then-round (single round_half_up at the end) while
          rental_fee_quote pins round-per-component-then-sum; with rv 250000
          (deposit raw 47500.000 exact) and a cross-region fee whose cartage
          and insurance each carry a half-cent, the two pinned orders are
          observably different policies, and the scaffold pins both.
        test_recipe:
          setup:
            - "Model daily_rate_cents 33333 (odd), replacement_value_cents 250000, days 5, dest cross-region, artist risk 60 (pre-seeded by one TOTAL_LOSS assessment) so insurance applies"
            - "base = 166665; cartage = round(166665*0.25) = round(41666.25) = 41666; insurance = round(166665*0.08) = round(13333.2) = 13333; quoted = 166665+41666+13333 = 221664"
            - "deposit raw = 0.20*200000 + 0.15*50000 = 47500 exactly (sum-then-round == per-tier round here, proving order pin matters only when fractional cents arise — the pinned contract is what the test locks)"
          setup_api_calls:
            - call: "POST /backline/artists"
              payload: { legal_name: "Round Act", tier: "STANDARD" }
              as: OpsManager
              captures: { ra: $.data.id }
            - call: "POST /backline/artists/${ra}/deposit-topups"
              payload: { amount_cents: 67500 }
              as: OpsManager
            - call: "POST /backline/gear-models"
              payload: { sku: "RD-KB-1", category: "KEYS", daily_rate_cents: 33333, replacement_value_cents: 250000, weight_class: "STANDARD" }
              as: OpsManager
              captures: { rm: $.data.id }
            - call: "POST /backline/gear-models"
              payload: { sku: "RD-KB-2", category: "KEYS", daily_rate_cents: 10000, replacement_value_cents: 100000, weight_class: "HAND_CARRY" }
              as: OpsManager
              captures: { rm2: $.data.id }
            - call: "POST /backline/gear-units"
              payload: { gear_model_id: "${rm}", serial_number: "RD-U1", home_city_code: "LAX" }
              as: OpsManager
            - call: "POST /backline/gear-units"
              payload: { gear_model_id: "${rm2}", serial_number: "RD-U2", home_city_code: "LAX" }
              as: OpsManager
              captures: { ru2: $.data.id }
            - call: "POST /backline/tours"
              payload: { artist_id: "${ra}", name: "Round Tour", start_date: "2026-08-01T00:00:00Z", end_date: "2026-08-31T00:00:00Z", insurance_policy_id: "POL-R" }
              as: TourManager
              captures: { rt: $.data.id }
            - call: "POST /backline/tours/${rt}/stops"
              payload: { city_code: "LAX", venue_date: "2026-08-04T00:00:00Z", load_in_ts: "2026-08-04T10:00:00Z" }
              as: TourManager
              captures: { rs_early: $.data.id }
            - call: "POST /backline/tour-stops/${rs_early}/rider-lines"
              payload: { gear_model_id: "${rm2}", quantity: 1 }
              as: TourManager
              captures: { rrl2: $.data.id }
            - call: "POST /backline/rider-lines/${rrl2}/source"
              payload: { origin_city_code: "LAX", dest_city_code: "LAX", start_date: "2026-08-03T00:00:00Z", end_date: "2026-08-05T00:00:00Z" }
              as: LogisticsCoordinator
              captures: { rr2: $.data.id }
            - call: "GET /backline/tours/${rt}"
              as: TourManager
              captures: { rt_v: $.data.version }
            - call: "POST /backline/tours/${rt}/activate"
              payload: { expected_tour_version: "${rt_v}" }
              as: TourManager
            - call: "POST /backline/shipments"
              payload: { tour_id: "${rt}", from_city_code: "LAX", to_city_code: "LAX", ship_date: "2026-08-03T00:00:00Z", capacity_kg: 1000 }
              as: LogisticsCoordinator
              captures: { rsh: $.data.id }
            - call: "POST /backline/shipments/${rsh}/lines"
              payload: { gear_unit_id: "${ru2}", weight_kg: 10, labor_minutes: 15 }
              as: LogisticsCoordinator
            - call: "POST /backline/reservation-lines/${rr2}/dispatch"
              payload: {}
              as: LogisticsCoordinator
            - call: "POST /backline/reservation-lines/${rr2}/mark-delivered"
              payload: {}
              as: LogisticsCoordinator
            - call: "POST /backline/reservation-lines/${rr2}/check-in"
              payload: { checked_in_at: "2026-08-05T09:00:00Z" }
              as: WarehouseTech
            - call: "POST /backline/reservation-lines/${rr2}/inspect"
              payload: { damage_present: true, assessed_severity: "TOTAL_LOSS", repair_estimate_cents: 0 }
              as: WarehouseTech
            - call: "GET /backline/damage-claims"
              payload: { reservation_line_id: "${rr2}" }
              as: OpsManager
              captures: { rdc: "$.data[0].id" }
            - call: "POST /backline/damage-claims/${rdc}/assess"
              payload: {}
              as: OpsManager
            - call: "POST /backline/tours/${rt}/stops"
              payload: { city_code: "NYC", venue_date: "2026-08-12T00:00:00Z", load_in_ts: "2026-08-12T10:00:00Z" }
              as: TourManager
              captures: { rs2: $.data.id }
            - call: "POST /backline/tour-stops/${rs2}/rider-lines"
              payload: { gear_model_id: "${rm}", quantity: 1 }
              as: TourManager
              captures: { rrl: $.data.id }
          trigger:
            - call: "POST /backline/rider-lines/${rrl}/source"
              payload: { origin_city_code: "LAX", dest_city_code: "NYC", start_date: "2026-08-10T00:00:00Z", end_date: "2026-08-15T00:00:00Z" }
              as: LogisticsCoordinator
              captures: { rr1: $.data.id }
          assert:
            - "Artist.${ra}.risk_score == 60 at quote time (TOTAL_LOSS within 90 days: 30*2)"
            - "ReservationLine.${rr1}.quoted_fee_cents == 221664 (round-per-component: 166665 + 41666 + 13333)"
            - "ReservationLine.${rr1}.deposit_held_cents == 47500 (sum-then-round tiered deposit)"

  # ===========================================================================
  # Rule 3 — non_linear_state_machine (different entities)
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: rider_line_substitution_revision_cycle
        grounds:
          - state_machines.RiderLine.SOURCED_to_SUBSTITUTION_PENDING
          - state_machines.RiderLine.SUBSTITUTION_PENDING_to_SOURCED
          - state_machines.RiderLine.SUBSTITUTION_PENDING_to_APPROVED
        distinguishing_aspect: |
          RiderLine exhibits a revision cycle (SOURCED -> SUBSTITUTION_PENDING
          -> SOURCED via reject, then again SUBSTITUTION_PENDING -> APPROVED),
          a non-linear loop on the RiderLine entity; each pass increments the
          parent TourStop.rider_revision, making the loop observable.
        test_recipe:
          setup:
            - "Sourced rider line (model M with substitute model M2 listed); substitute unit U2 AVAILABLE same city"
            - "Stop rider_revision baseline captured after sourcing"
          setup_api_calls:
            - call: "POST /backline/artists"
              payload: { legal_name: "Cycle Act", tier: "STANDARD" }
              as: OpsManager
              captures: { ca: $.data.id }
            - call: "POST /backline/artists/${ca}/deposit-topups"
              payload: { amount_cents: 40000 }
              as: OpsManager
            - call: "POST /backline/gear-models"
              payload: { sku: "CY-GTR-A", category: "GUITAR", daily_rate_cents: 40000, replacement_value_cents: 200000, weight_class: "HAND_CARRY", substitute_model_ids: "[]" }
              as: OpsManager
              captures: { cm1: $.data.id }
            - call: "POST /backline/gear-models"
              payload: { sku: "CY-GTR-B", category: "GUITAR", daily_rate_cents: 35000, replacement_value_cents: 180000, weight_class: "HAND_CARRY" }
              as: OpsManager
              captures: { cm2: $.data.id }
            # link substitute list on m1 (PATCH not available on models; recreate semantics: use substitute_model_ids on the requested model via create order)
            - call: "POST /backline/gear-units"
              payload: { gear_model_id: "${cm1}", serial_number: "CY-U1", home_city_code: "NYC" }
              as: OpsManager
            - call: "POST /backline/gear-units"
              payload: { gear_model_id: "${cm2}", serial_number: "CY-U2", home_city_code: "NYC" }
              as: OpsManager
            - call: "POST /backline/tours"
