              as_user_id: "${w_fc}"
            - call: "POST /alerts/products/${w2}/issue"
              payload: { expected_product_version: "${w2v}" }
              as: Forecaster
              as_user_id: "${w_fc}"
            - call: "POST /alerts/products/${w3}/issue"
              payload: { expected_product_version: "${w3v}" }
              as: Forecaster
              as_user_id: "${w_fc}"
              captures: { w3_err: $.data.error_id }
          assert:
            - "W1 issues: no other ISSUED WINTER_STORM watch exists"
            - "W2 issues: its effective_from == W1.expires_at == 2026-09-01T12:00:00Z — half-open adjacency is not an intersection"
            - "W3 fails 409 with error_id == ERR_PRODUCT_OVERLAP_CONFLICT (its 11:00-13:00 window intersects both W1's 10:00-12:00 and W2's 12:00-14:00 over the shared zone)"
            - "Product.${w3} remains DRAFT"

      - name: evacuation_reentry_buffer_gap_45_rejected_gap_60_allowed
        grounds:
          - calculations.evacuation_reentry_buffer
          - errors.ERR_EVACUATION_WINDOW_CONFLICT
        distinguishing_aspect: "Closed-interval buffer semantics on EmergencyAction: unlike the product window rule, even disjoint evacuation windows conflict when the gap after a lifted evacuation is under 60 minutes — 45 minutes is rejected, exactly 60 minutes passes, measured from lifted_at rather than the scheduled end."
        test_recipe:
          setup:
            - "Office, zone ZE (covered by an ISSUED warning expiring 12:00). EA1 EVACUATION 09:00-10:00 is ORDERED at 08:50 and LIFTED early at 09:30 (lifted_at 09:30, so the buffer runs to 10:30). EA2 proposes 10:15 (gap 45). EA3 proposes 10:30 (gap exactly 60)."
          setup_api_calls:
            - call: "POST /alerts/offices"
              payload: { office_code: "KEVB", name: "Evac Office", region: "GULF", area_method: "PLANAR" }
              as: PlatformAdmin
              captures: { v_off: $.data.id }
            - call: "POST /alerts/zones"
              payload: { zone_code: "ZEV1", name: "Evac Zone", office_id: "${v_off}", lat_min: 0.0, lat_max: 0.1, lon_min: 0.0, lon_max: 0.1, surveyed_area_sq_km: 123.21, population_tier: "HIGH", coastal: true }
              as: PlatformAdmin
              captures: { v_zone: $.data.id }
            - call: "POST /alerts/forecasters"
              payload: { office_id: "${v_off}", full_name: "Vic Evac", employee_code: "EMP-EV", level: "SENIOR" }
              as: PlatformAdmin
              captures: { v_fc: $.data.id }
            - call: "POST /alerts/storm-events"
              payload: { office_id: "${v_off}", hazard_type: "SEVERE_THUNDERSTORM", max_wind_mph: 60 }
              as: Forecaster
              as_user_id: "${v_fc}"
              captures: { v_storm: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T08:30:00Z" }
              as: PlatformAdmin
            - call: "POST /alerts/products"
              payload: { product_level: "WARNING", hazard_type: "SEVERE_THUNDERSTORM", issuing_office_id: "${v_off}", storm_event_id: "${v_storm}", polygon: { vertices: [ { lat: 0.0, lon: 0.0 }, { lat: 0.0, lon: 0.1 }, { lat: 0.1, lon: 0.1 }, { lat: 0.1, lon: 0.0 } ] }, expires_at: "2026-09-01T12:00:00Z" }
              as: Forecaster
              as_user_id: "${v_fc}"
              captures: { v_w: $.data.id, v_wv: $.data.version }
            - call: "POST /alerts/products/${v_w}/issue"
              payload: { expected_product_version: "${v_wv}" }
              as: Forecaster
              as_user_id: "${v_fc}"
            - call: "POST /alerts/emergency-actions"
              payload: { zone_id: "${v_zone}", product_id: "${v_w}", action_type: "EVACUATION", effective_from: "2026-09-01T09:00:00Z", effective_until: "2026-09-01T10:00:00Z" }
              as: EmergencyManager
              as_user_id: "em-1"
              captures: { v_ea1: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T08:50:00Z" }
              as: PlatformAdmin
            - call: "POST /alerts/emergency-actions/${v_ea1}/order"
              payload: {}
              as: EmergencyManager
              as_user_id: "em-1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T09:30:00Z" }
              as: PlatformAdmin
            - call: "POST /alerts/emergency-actions/${v_ea1}/lift"
              payload: {}
              as: EmergencyManager
              as_user_id: "em-1"
            - call: "POST /alerts/emergency-actions"
              payload: { zone_id: "${v_zone}", product_id: "${v_w}", action_type: "EVACUATION", effective_from: "2026-09-01T10:15:00Z", effective_until: "2026-09-01T11:00:00Z" }
              as: EmergencyManager
              as_user_id: "em-1"
              captures: { v_ea2: $.data.id }
            - call: "POST /alerts/emergency-actions"
              payload: { zone_id: "${v_zone}", product_id: "${v_w}", action_type: "EVACUATION", effective_from: "2026-09-01T10:30:00Z", effective_until: "2026-09-01T11:30:00Z" }
              as: EmergencyManager
              as_user_id: "em-1"
              captures: { v_ea3: $.data.id }
          trigger:
            - call: "POST /alerts/emergency-actions/${v_ea2}/order"
              payload: {}
              as: EmergencyManager
              as_user_id: "em-1"
              captures: { v_err: $.data.error_id }
            - call: "POST /alerts/emergency-actions/${v_ea3}/order"
              payload: {}
              as: EmergencyManager
              as_user_id: "em-1"
          assert:
            - "EA2 order fails 409 with error_id == ERR_EVACUATION_WINDOW_CONFLICT (10:15 is 45 minutes after lifted_at 09:30, under the 60-minute buffer)"
            - "EA3 orders successfully (10:30 is exactly 60 minutes after 09:30; the >= comparison admits the boundary)"
            - "EA1's scheduled effective_until 10:00 is irrelevant — the buffer measures from lifted_at 09:30"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: dissemination_record_cardinality_conserved_through_cancel
        grounds:
          - state_machines.Product.ISSUED_to_CANCELLED
          - state_machines.DisseminationRecord.QUEUED_to_WITHDRAWN
          - entities.DisseminationRecord.fields.status
        distinguishing_aspect: "Conserved quantity is per-product record cardinality: count(DisseminationRecords of the product) equals the number of channels eligible at issue time (3) at every stage — issue, later channel creation, and cancellation — because cancel WITHDRAWs QUEUED records without ever deleting them."
        test_recipe:
          setup:
            - "Office, zone ZD, SEVERE storm wind 60. Channels at issue time: EAS-1 (WATCH+WARNING, auto-confirm), WEA-1 (WARNING, requires confirmation), DF-1 (WATCH+ADVISORY+WARNING). Warning issued at 10:00 spawns exactly 3 QUEUED records. A fourth channel EAS-2 is created only after issuance."
          setup_api_calls:
            - call: "POST /alerts/offices"
              payload: { office_code: "KINV", name: "Invariant Office", region: "PLAINS", area_method: "PLANAR" }
              as: PlatformAdmin
              captures: { i_off: $.data.id }
            - call: "POST /alerts/zones"
              payload: { zone_code: "ZIV1", name: "Invariant Zone", office_id: "${i_off}", lat_min: 0.0, lat_max: 0.1, lon_min: 0.0, lon_max: 0.1, surveyed_area_sq_km: 123.21, population_tier: "LOW", coastal: false }
              as: PlatformAdmin
            - call: "POST /alerts/alert-channels"
              payload: { name: "EAS-1", channel_type: "EAS", supports_levels: ["WATCH", "WARNING"], max_message_chars: 1800 }
              as: PlatformAdmin
            - call: "POST /alerts/alert-channels"
              payload: { name: "WEA-1", channel_type: "WEA", supports_levels: ["WARNING"], max_message_chars: 360, requires_confirmation: true }
              as: PlatformAdmin
            - call: "POST /alerts/alert-channels"
              payload: { name: "DF-1", channel_type: "DATA_FEED", supports_levels: ["WATCH", "ADVISORY", "WARNING"], max_message_chars: 4000 }
              as: PlatformAdmin
            - call: "POST /alerts/forecasters"
              payload: { office_id: "${i_off}", full_name: "Ira Inv", employee_code: "EMP-IV", level: "SENIOR" }
              as: PlatformAdmin
              captures: { i_fc: $.data.id }
            - call: "POST /alerts/storm-events"
              payload: { office_id: "${i_off}", hazard_type: "SEVERE_THUNDERSTORM", max_wind_mph: 60 }
              as: Forecaster
              as_user_id: "${i_fc}"
              captures: { i_storm: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T10:00:00Z" }
              as: PlatformAdmin
            - call: "POST /alerts/products"
              payload: { product_level: "WARNING", hazard_type: "SEVERE_THUNDERSTORM", issuing_office_id: "${i_off}", storm_event_id: "${i_storm}", polygon: { vertices: [ { lat: 0.0, lon: 0.0 }, { lat: 0.0, lon: 0.1 }, { lat: 0.1, lon: 0.1 }, { lat: 0.1, lon: 0.0 } ] }, expires_at: "2026-09-01T10:45:00Z" }
              as: Forecaster
              as_user_id: "${i_fc}"
              captures: { i_w: $.data.id, i_wv: $.data.version }
            - call: "POST /alerts/products/${i_w}/issue"
              payload: { expected_product_version: "${i_wv}" }
              as: Forecaster
              as_user_id: "${i_fc}"
          trigger:
            - call: "GET /alerts/dissemination-records"
              payload: { product_id: "${i_w}" }
              as: Forecaster
              as_user_id: "${i_fc}"
            - call: "POST /alerts/alert-channels"
              payload: { name: "EAS-2", channel_type: "EAS", supports_levels: ["WARNING"], max_message_chars: 1800 }
              as: PlatformAdmin
            - call: "POST /alerts/products/${i_w}/cancel"
              payload: {}
              as: Forecaster
              as_user_id: "${i_fc}"
            - call: "GET /alerts/dissemination-records"
              payload: { product_id: "${i_w}" }
              as: Forecaster
              as_user_id: "${i_fc}"
          assert:
            - "after issue: exactly 3 DisseminationRecords exist for the product, all QUEUED (EAS-1, WEA-1, DF-1 were the eligible set)"
            - "creating EAS-2 after issue adds no record: the count stays 3 (eligibility is frozen at issue time)"
            - "after cancel: the count is still 3 and every record is WITHDRAWN — withdrawal compensates creation without deleting anything"
            - "Product.${i_w}.status == CANCELLED and window_end == cancelled_at == 2026-09-01T10:00:00Z"

      - name: supersede_chain_preserves_single_coverage_at_handoff
        grounds:
          - state_machines.Product.ISSUED_to_SUPERSEDED
          - entities.Product.fields.window_end
          - calculations.verification_matching
        distinguishing_aspect: "Conserved quantity is temporal coverage exclusivity across a supersede chain: W1's window_end closes at exactly W2's issued_at, so an event observed at the handoff instant 10:15:00Z is covered by exactly one chain member (W2) — never both, never neither."
        test_recipe:
          setup:
            - "Office, zone ZS, SEVERE storm wind 60. Warning W1 (polygon covering ZS's left half) issued 10:00, expires 10:45. Continuation W2 (same polygon, supersedes W1, expires 11:15) created and issued at 10:15. Event E observed at exactly 10:15:00Z inside the polygon, then CONFIRMED."
          setup_api_calls:
            - call: "POST /alerts/offices"
              payload: { office_code: "KCOV", name: "Coverage Office", region: "PLAINS", area_method: "PLANAR" }
              as: PlatformAdmin
              captures: { c_off: $.data.id }
            - call: "POST /alerts/zones"
              payload: { zone_code: "ZCV1", name: "Coverage Zone", office_id: "${c_off}", lat_min: 0.0, lat_max: 0.1, lon_min: 0.0, lon_max: 0.1, surveyed_area_sq_km: 123.21, population_tier: "LOW", coastal: false }
              as: PlatformAdmin
              captures: { c_zone: $.data.id }
            - call: "POST /alerts/forecasters"
              payload: { office_id: "${c_off}", full_name: "Cora Cov", employee_code: "EMP-CV", level: "SENIOR" }
              as: PlatformAdmin
              captures: { c_fc: $.data.id }
            - call: "POST /alerts/storm-events"
              payload: { office_id: "${c_off}", hazard_type: "SEVERE_THUNDERSTORM", max_wind_mph: 60 }
              as: Forecaster
              as_user_id: "${c_fc}"
              captures: { c_storm: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T10:00:00Z" }
              as: PlatformAdmin
            - call: "POST /alerts/products"
              payload: { product_level: "WARNING", hazard_type: "SEVERE_THUNDERSTORM", issuing_office_id: "${c_off}", storm_event_id: "${c_storm}", polygon: { vertices: [ { lat: 0.0, lon: 0.0 }, { lat: 0.0, lon: 0.05 }, { lat: 0.1, lon: 0.05 }, { lat: 0.1, lon: 0.0 } ] }, expires_at: "2026-09-01T10:45:00Z" }
              as: Forecaster
              as_user_id: "${c_fc}"
              captures: { c_w1: $.data.id, c_w1v: $.data.version }
            - call: "POST /alerts/products/${c_w1}/issue"
              payload: { expected_product_version: "${c_w1v}" }
              as: Forecaster
              as_user_id: "${c_fc}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T10:15:00Z" }
              as: PlatformAdmin
            - call: "POST /alerts/products"
              payload: { product_level: "WARNING", hazard_type: "SEVERE_THUNDERSTORM", issuing_office_id: "${c_off}", storm_event_id: "${c_storm}", polygon: { vertices: [ { lat: 0.0, lon: 0.0 }, { lat: 0.0, lon: 0.05 }, { lat: 0.1, lon: 0.05 }, { lat: 0.1, lon: 0.0 } ] }, expires_at: "2026-09-01T11:15:00Z", supersedes_product_id: "${c_w1}", supersede_reason: "CONTINUATION" }
              as: Forecaster
              as_user_id: "${c_fc}"
              captures: { c_w2: $.data.id, c_w2v: $.data.version }
            - call: "POST /alerts/products/${c_w2}/issue"
              payload: { expected_product_version: "${c_w2v}" }
              as: Forecaster
              as_user_id: "${c_fc}"
            - call: "POST /alerts/verification-events"
              payload: { zone_id: "${c_zone}", hazard_type: "SEVERE_THUNDERSTORM", observed_at: "2026-09-01T10:15:00Z", location_lat: 0.05, location_lon: 0.02, magnitude: "60mph" }
              as: VerificationAnalyst
              as_user_id: "va-1"
              captures: { c_ev: $.data.id }
            - call: "POST /alerts/verification-events/${c_ev}/adjudicate"
              payload: { outcome: "CONFIRMED" }
              as: VerificationAnalyst
              as_user_id: "va-1"
          trigger:
            - call: "GET /alerts/products/${c_w1}"
              payload: {}
              as: Forecaster
              as_user_id: "${c_fc}"
            - call: "GET /alerts/products/${c_w2}"
              payload: {}
              as: Forecaster
              as_user_id: "${c_fc}"
            - call: "GET /alerts/verification-events/${c_ev}"
              payload: {}
              as: VerificationAnalyst
              as_user_id: "va-1"
          assert:
            - "Product.${c_w1}.window_end == 2026-09-01T10:15:00Z == Product.${c_w2}.issued_at (superseded_at closed W1's window at the handoff instant)"
            - "VerificationEvent.${c_ev}.matched_product_ids == [${c_w2}] — the half-open [issued_at, window_end) assigns the 10:15:00Z instant to W2 alone"
            - "Product.${c_w1}.verified_event_count == 0 and verification_status == UNVERIFIED"
            - "Product.${c_w2}.verified_event_count == 1 and verification_status == VERIFIED"
            - "exactly one chain member covers the handoff instant: |{P in chain: P.issued_at <= 10:15:00Z < P.window_end}| == 1"
