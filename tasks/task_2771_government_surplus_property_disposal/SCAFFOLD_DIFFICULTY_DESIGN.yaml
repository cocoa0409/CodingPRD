  - rule_id: transitive_cascade
    instances:

      - name: tc_transfer_void_four_hop_return_to_screening
        grounds:
          - endpoints[POST /transfer-orders/{id}/void]
          - state_machines.TransferOrder.ACKNOWLEDGED_to_VOIDED
          - state_machines.ScreeningRequest.APPROVED_to_DENIED
          - state_machines.ScreeningCycle.AWARDED_to_OPEN
          - state_machines.SurplusAsset.AWARDED_TRANSFER_to_SCREENING
          - complexity_profile.complexity_layers[cascading_side_effects]
        distinguishing_aspect: |
          One void call propagates four hops across four different entities —
          TransferOrder -> ScreeningRequest -> ScreeningCycle -> SurplusAsset — where each hop is caused
          by the previous one, not by the request. The chain starts from an ACKNOWLEDGED order (not the
          ISSUED order used by nlsm_screening_cycle_award_then_void_returns_to_open), and the cascade is
          scoped: the losing sibling request that is already DENIED and a second cycle belonging to
          another asset on the same turn-in are left byte-identical.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z, later advanced to 2026-08-03T00:00:00Z"
            - "organizations DOT-01 (STATE_AGENCY, turning in), NPO-12 and NPO-13 (both ELIGIBLE_NONPROFIT, CERTIFIED donees through 2027-03-31)"
            - "one ACCEPTED turn-in with asset P (pickup, fair_market_value_cents 297620) and asset Q (roller, fair_market_value_cents 62669)"
            - "cycle_p on asset P advanced twice to the ELIGIBLE_NONPROFIT tier, request rA (NPO-12) awarded and rB (NPO-13) already DENIED with LOST_AWARD"
            - "a transfer order to NPO-12 that has been ACKNOWLEDGED by the recipient"
            - "cycle_q on asset Q advanced once to LOCAL_GOVERNMENT and left OPEN with no requests — the control row"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-01"
            - call: "POST /agencies"
              payload: { name: "State Department of Transportation", agency_code: "DOT-01", agency_type: "STATE_AGENCY" }
