          - state_machines.PermitApplication.transitions["DRAFT -> SUBMITTED"].side_effects
          - state_machines.PermitApplication.transitions["REJECTED -> SUBMITTED"].side_effects
        distinguishing_aspect: "Every constant of the fee is separated: FULL_REPERMIT base 72000, round_half_up(8.4 * 850) = 7140 per-kW term, the jurisdiction's 12000 expedite fee because expedited is true, and the 9000 revision surcharge that must be absent on the first submission (revision_count 0) and present exactly once on the resubmission (revision_count 1) - 91140 then 100140. The review deadline also re-bases off the second submitted_at."
