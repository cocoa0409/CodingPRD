scaffold_corner_design:
- section: entities
  instances:
  - name: account_creation_defaults_and_system_fields
    claim_type: creation
    grounds:
    - entities.DepositAccount
    - state_machines.DepositAccount
    distinguishing_aspect: POST /bank/accounts with valid input returns 201 with server-minted
      id, version 1, lifecycle OPEN, restriction NONE, balance equal to opening deposit,
      accrual_start_date and last_customer_activity_date equal to the clock date 2026-08-01.
    test_recipe:
      setup:
      - empty database; logical clock at default 2026-08-01
      setup_api_calls: []
      trigger:
      - call: POST /bank/accounts
        payload:
          primary_owner_name: New N
          owner_tax_id: C1
          ownership_type: INDIVIDUAL
          product_code: SAVINGS
          rate_bps: 0
          opening_deposit_cents: 25000
        as: OpsOfficer
        captures:
          acct: $.data.id
          v: $.data.version
          lc: $.data.lifecycle_status
          rs: $.data.restriction_status
          bal: $.data.balance_cents
          supp: $.data.statement_suppression
      assert:
      - http status == 201
      - ${v} == 1
      - ${lc} == OPEN
      - ${rs} == NONE
      - ${bal} == 25000
      - ${supp} == NONE
      - DepositAccount.${acct}.accrual_start_date == 2026-08-01
      - DepositAccount.${acct}.last_customer_activity_date == 2026-08-01
  - name: account_create_pod_beneficiary_required
    claim_type: required_fields
    grounds:
    - entities.DepositAccount.fields.pod_beneficiary_name
    - validations[priority=4]
    distinguishing_aspect: ownership_type POD without pod_beneficiary_name violates
      the conditional required field and returns ERR_INVALID_REQUEST (400).
    test_recipe:
      setup:
      - empty database
      setup_api_calls: []
      trigger:
      - call: POST /bank/accounts
        payload:
          primary_owner_name: Pod P
          owner_tax_id: C2
          ownership_type: POD
          product_code: SAVINGS
          rate_bps: 0
          opening_deposit_cents: 1000
        as: OpsOfficer
        captures:
          err: $.data.error_id
      assert:
      - ${err} == ERR_INVALID_REQUEST
      - http status == 400
  - name: account_create_missing_owner_name_rejected
    claim_type: required_fields
    grounds:
    - entities.DepositAccount.fields.primary_owner_name
    - validations[priority=4]
    distinguishing_aspect: Omitting the unconditional required field primary_owner_name
      returns ERR_INVALID_REQUEST (400).
    test_recipe:
      setup:
      - empty database
      setup_api_calls: []
      trigger:
      - call: POST /bank/accounts
        payload:
          owner_tax_id: C3
          ownership_type: INDIVIDUAL
          product_code: SAVINGS
          rate_bps: 0
          opening_deposit_cents: 1000
        as: OpsOfficer
        captures:
          err: $.data.error_id
      assert:
      - ${err} == ERR_INVALID_REQUEST
  - name: account_create_invalid_ownership_enum
    claim_type: type_constraints
    grounds:
    - entities.DepositAccount.fields.ownership_type
    - validations[priority=4]
    distinguishing_aspect: ownership_type CORP is not a declared enum member and returns
      ERR_INVALID_REQUEST (400).
    test_recipe:
      setup:
      - empty database
      setup_api_calls: []
      trigger:
      - call: POST /bank/accounts
        payload:
          primary_owner_name: Enum E
          owner_tax_id: C4
          ownership_type: CORP
          product_code: SAVINGS
          rate_bps: 0
          opening_deposit_cents: 1000
        as: OpsOfficer
        captures:
          err: $.data.error_id
      assert:
      - ${err} == ERR_INVALID_REQUEST
  - name: account_retrieval_not_found
    claim_type: not_found
    grounds:
    - validations[priority=3]
    - errors[ERR_NOT_FOUND]
    distinguishing_aspect: GET with a well-formed but nonexistent account id returns
      ERR_NOT_FOUND (404).
    test_recipe:
      setup:
      - empty database
      setup_api_calls: []
      trigger:
      - call: GET /bank/accounts/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2
        payload: {}
        as: OpsManager
        captures:
          err: $.data.error_id
      assert:
      - ${err} == ERR_NOT_FOUND
      - http status == 404
  - name: child_create_requires_existing_account
    claim_type: parent_relationships
    grounds:
    - entities.AccountDocument.fields.account_id
    - validations[priority=3]
    distinguishing_aspect: Creating a child document under a nonexistent account id
      returns ERR_NOT_FOUND (404); FK integrity is enforced at creation.
    test_recipe:
      setup:
      - empty database
      setup_api_calls: []
      trigger:
      - call: POST /bank/accounts/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2/documents
        payload:
          doc_type: SIGNATURE_CARD
          reference_number: SC-X
        as: OpsOfficer
        captures:
          err: $.data.error_id
      assert:
      - ${err} == ERR_NOT_FOUND
  - name: transaction_append_only_no_version_field
    claim_type: immutability
    grounds:
    - entities.AccountTransaction
    distinguishing_aspect: 'AccountTransaction is declared common_fields: false —
      listed transactions expose id and created_at but no version or updated_at, and
      no update endpoint exists for them.'
    test_recipe:
      setup:
      - one account with its opening deposit transaction
      setup_api_calls:
      - call: POST /bank/accounts
        payload:
          primary_owner_name: Evt V
          owner_tax_id: C5
          ownership_type: INDIVIDUAL
          product_code: SAVINGS
          rate_bps: 0
          opening_deposit_cents: 7000
        as: OpsOfficer
        captures:
          acct: $.data.id
      trigger:
      - call: GET /bank/accounts/${acct}/transactions
        payload: {}
        as: Auditor
        captures:
          t_type: $.data[0].txn_type
          t_bal: $.data[0].balance_after_cents
      assert:
      - ${t_type} == DEPOSIT
      - ${t_bal} == 7000
      - transaction objects in the list have no version key and no updated_at key
- section: state_machines
  instances:
  - name: document_review_from_terminal_rejected
    claim_type: invalid_transition
    grounds:
    - state_machines.AccountDocument.SUBMITTED_to_VERIFIED
    distinguishing_aspect: Reviewing an already-VERIFIED document a second time fails
      ERR_INVALID_STATE (409); terminal state lockdown.
    test_recipe:
      setup:
      - account with one VERIFIED document
      setup_api_calls:
      - call: POST /bank/accounts
        payload:
          primary_owner_name: Doc D
          owner_tax_id: C6
          ownership_type: INDIVIDUAL
          product_code: SAVINGS
          rate_bps: 0
          opening_deposit_cents: 5000
        as: OpsOfficer
        captures:
          acct: $.data.id
      - call: POST /bank/accounts/${acct}/documents
        payload:
          doc_type: SIGNATURE_CARD
          reference_number: SC-D
        as: OpsOfficer
        captures:
          doc: $.data.id
      - call: POST /bank/documents/${doc}/review
        payload:
          decision: VERIFIED
        as: OpsManager
      trigger:
      - call: POST /bank/documents/${doc}/review
        payload:
          decision: REJECTED
        as: OpsManager
        captures:
          err: $.data.error_id
      assert:
      - ${err} == ERR_INVALID_STATE
  - name: deceased_initiate_release_from_reported_rejected
    claim_type: invalid_transition
    grounds:
    - state_machines.DeceasedCase.VERIFIED_to_RELEASE_PENDING
    distinguishing_aspect: initiate-release on a case still in REPORTED (not yet VERIFIED)
      fails ERR_INVALID_STATE — the machine cannot skip VERIFIED.
    test_recipe:
      setup:
      - account with a REPORTED deceased case (no verification)
      setup_api_calls:
      - call: POST /bank/accounts
        payload:
          primary_owner_name: Skip S
          owner_tax_id: C7
          ownership_type: INDIVIDUAL
          product_code: SAVINGS
          rate_bps: 0
          opening_deposit_cents: 5000
        as: OpsOfficer
        captures:
          acct: $.data.id
      - call: POST /bank/accounts/${acct}/deceased-cases
        payload:
          decedent_name: Skip S
          date_of_death: '2026-08-01'
          reported_by: Kin S
        as: OpsOfficer
        captures:
          case: $.data.id
      trigger:
      - call: POST /bank/deceased-cases/${case}/initiate-release
        payload:
          release_variant: DATE_OF_DEATH
          estate_representative_name: Exec S
        as: OpsOfficer
        captures:
          err: $.data.error_id
      assert:
      - ${err} == ERR_INVALID_STATE
  - name: account_close_terminal_lockdown
    claim_type: terminal_state_lockdown
    grounds:
    - state_machines.DepositAccount
    distinguishing_aspect: A second close on an already-CLOSED account fails ERR_INVALID_STATE
      even with the freshly observed version; CLOSED is terminal.
    test_recipe:
      setup:
      - account closed once successfully
      setup_api_calls:
      - call: POST /bank/accounts
        payload:
          primary_owner_name: Term T
          owner_tax_id: C8
          ownership_type: INDIVIDUAL
          product_code: SAVINGS
          rate_bps: 0
          opening_deposit_cents: 5000
        as: OpsOfficer
        captures:
          acct: $.data.id
          v0: $.data.version
      - call: POST /bank/accounts/${acct}/close
        payload:
          expected_account_version: ${v0}
        as: OpsOfficer
      - call: GET /bank/accounts/${acct}
        payload: {}
        as: OpsManager
        captures:
          v_closed: $.data.version
      trigger:
      - call: POST /bank/accounts/${acct}/close
        payload:
          expected_account_version: ${v_closed}
        as: OpsOfficer
        captures:
          err: $.data.error_id
      assert:
      - ${err} == ERR_INVALID_STATE
  - name: conversion_execute_twice_rejected
    claim_type: idempotency
    grounds:
    - state_machines.ProductConversion.SCHEDULED_to_COMPLETED
    distinguishing_aspect: Executing an already-COMPLETED conversion fails ERR_INVALID_STATE
      — action endpoints are not idempotent.
    test_recipe:
      setup:
      - account with a conversion executed at its effective date
      setup_api_calls:
      - call: POST /bank/accounts
        payload:
          primary_owner_name: Twice W
          owner_tax_id: C9
          ownership_type: INDIVIDUAL
          product_code: SAVINGS
          rate_bps: 0
          opening_deposit_cents: 5000
        as: OpsOfficer
        captures:
          acct: $.data.id
      - call: POST /bank/accounts/${acct}/conversions
        payload:
          to_product_code: BASIC_CHECKING
          new_rate_bps: 100
          effective_date: '2026-08-04'
        as: OpsOfficer
        captures:
          conv: $.data.id
      - call: POST /bank/_clock/set_current_utc
        payload:
          to_iso8601: '2026-08-04T00:00:00Z'
        as: OpsManager
      - call: POST /bank/conversions/${conv}/execute
        payload: {}
        as: OpsOfficer
      trigger:
      - call: POST /bank/conversions/${conv}/execute
        payload: {}
        as: OpsOfficer
        captures:
          err: $.data.error_id
      assert:
      - ${err} == ERR_INVALID_STATE
  - name: signer_remove_from_removed_rejected
    claim_type: invalid_transition
    grounds:
    - state_machines.AuthorizedSigner.ACTIVE_to_REMOVED
    distinguishing_aspect: Removing an already-REMOVED signer fails ERR_INVALID_STATE;
      REMOVED is terminal for signers.
    test_recipe:
      setup:
      - account with a signer already removed
      setup_api_calls:
      - call: POST /bank/accounts
        payload:
          primary_owner_name: Rem R
          owner_tax_id: C10
          ownership_type: INDIVIDUAL
          product_code: SAVINGS
          rate_bps: 0
          opening_deposit_cents: 5000
        as: OpsOfficer
        captures:
          acct: $.data.id
      - call: POST /bank/accounts/${acct}/documents
        payload:
          doc_type: SIGNATURE_CARD
          reference_number: SC-R
        as: OpsOfficer
        captures:
          doc: $.data.id
      - call: POST /bank/documents/${doc}/review
        payload:
          decision: VERIFIED
        as: OpsManager
      - call: POST /bank/accounts/${acct}/signers
        payload:
          full_name: Sig R
          tax_id: TSR
          signer_role: AUTHORIZED_SIGNER
          signature_card_reference: SC-R
        as: OpsOfficer
        captures:
          signer: $.data.id
      - call: POST /bank/signers/${signer}/remove
        payload: {}
        as: OpsOfficer
      trigger:
      - call: POST /bank/signers/${signer}/remove
        payload: {}
        as: OpsOfficer
        captures:
          err: $.data.error_id
      assert:
      - ${err} == ERR_INVALID_STATE
  - name: garnishment_initial_state_funds_held
    claim_type: initial_state
    grounds:
    - state_machines.GarnishmentOrder
    distinguishing_aspect: 'A newly created garnishment is born FUNDS_HELD with the
      hold placed atomically: held_amount_cents == min(claim, available) and account
      restriction flips to LEGAL_HOLD in the same response cycle.'
    test_recipe:
      setup:
      - account 60000, no benefit deposits
      setup_api_calls:
      - call: POST /bank/accounts
        payload:
          primary_owner_name: Init I
          owner_tax_id: C11
          ownership_type: INDIVIDUAL
          product_code: SAVINGS
          rate_bps: 0
          opening_deposit_cents: 60000
        as: OpsOfficer
        captures:
          acct: $.data.id
      trigger:
      - call: POST /bank/accounts/${acct}/garnishments
        payload:
          order_type: CHILD_SUPPORT
          creditor_name: CSEA
          amount_cents: 20000
          served_date: '2026-08-01'
          exemption_method: FEDERAL_LOOKBACK
        as: OpsOfficer
        captures:
          ord: $.data.id
          st: $.data.status
          held: $.data.held_amount_cents
      - call: GET /bank/accounts/${acct}
        payload: {}
        as: OpsManager
        captures:
          rs: $.data.restriction_status
          held_total: $.data.total_held_cents
      assert:
      - ${st} == FUNDS_HELD
      - ${held} == 20000
      - ${rs} == LEGAL_HOLD
      - ${held_total} == 20000
  - name: statement_cycle_suppressed_by_dormant_posture
    claim_type: valid_transition
    grounds:
    - state_machines.StatementCycle.SCHEDULED_to_SUPPRESSED
    distinguishing_aspect: A due statement cycle on a DORMANT account is suppressed
      with reason DORMANT by the sweep (posture-gated production), not produced.
    test_recipe:
      setup:
      - account 50000 rate 0 with cycle [2026-08-01, 2026-09-01); clock advanced 365
        days so the account is dormant at sweep
      setup_api_calls:
      - call: POST /bank/accounts
        payload:
          primary_owner_name: Sup S
          owner_tax_id: C12
          ownership_type: INDIVIDUAL
          product_code: SAVINGS
          rate_bps: 0
          opening_deposit_cents: 50000
        as: OpsOfficer
        captures:
          acct: $.data.id
      - call: POST /bank/accounts/${acct}/statement-cycles
        payload:
          cycle_start: '2026-08-01'
          cycle_end: '2026-09-01'
        as: OpsOfficer
        captures:
          cyc: $.data.id
      - call: POST /bank/_clock/set_current_utc
        payload:
          to_iso8601: '2027-08-01T00:00:00Z'
        as: OpsManager
      trigger:
      - call: POST /bank/ops/daily-sweep
        payload: {}
        as: OpsManager
        captures:
          suppressed: $.data.statements_suppressed
      - call: GET /bank/accounts/${acct}/statement-cycles
        payload: {}
        as: OpsManager
        captures:
          st: $.data[0].status
          reason: $.data[0].suppression_reason
      assert:
      - ${suppressed} == 1
      - ${st} == SUPPRESSED
      - ${reason} == DORMANT
  - name: statement_cycle_produced_when_healthy
    claim_type: valid_transition
    grounds:
    - state_machines.StatementCycle.SCHEDULED_to_PRODUCED
    distinguishing_aspect: A due statement cycle on an OPEN, unrestricted account
      is PRODUCED by the sweep (suppression posture NONE) — the happy-path counterpart
      to posture suppression.
    test_recipe:
      setup:
      - account 50000 rate 0 opened 2026-08-01 with cycle [2026-08-01, 2026-09-01);
        clock advanced to 2026-09-01 (only 31 days inactive, still OPEN)
      setup_api_calls:
      - call: POST /bank/accounts
        payload:
          primary_owner_name: Prod P
          owner_tax_id: C22
          ownership_type: INDIVIDUAL
          product_code: SAVINGS
          rate_bps: 0
          opening_deposit_cents: 50000
        as: OpsOfficer
        captures:
          acct: $.data.id
      - call: POST /bank/accounts/${acct}/statement-cycles
        payload:
          cycle_start: '2026-08-01'
          cycle_end: '2026-09-01'
        as: OpsOfficer
        captures:
          cyc: $.data.id
      - call: POST /bank/_clock/set_current_utc
        payload:
          to_iso8601: '2026-09-01T00:00:00Z'
        as: OpsManager
      trigger:
      - call: POST /bank/ops/daily-sweep
        payload: {}
        as: OpsManager
        captures:
          produced: $.data.statements_produced
          suppressed: $.data.statements_suppressed
      - call: GET /bank/accounts/${acct}/statement-cycles
        payload: {}
        as: OpsManager
        captures:
          st: $.data[0].status
          pd: $.data[0].produced_date
      assert:
      - ${produced} == 1
      - ${suppressed} == 0
      - ${st} == PRODUCED
      - ${pd} == 2026-09-01
  - name: reactivation_via_customer_transaction
    claim_type: valid_transition
    grounds:
    - state_machines.DepositAccount
    distinguishing_aspect: A customer_initiated DEPOSIT on a DORMANT account with
      restriction NONE flips lifecycle back to OPEN and resets the dormancy episode
      (dormant_since null, fees_assessed_count 0) — the cyclic return edge of the
      lifecycle machine.
    test_recipe:
      setup:
      - account 100000 rate 0 dormant after the 365-day sweep (entry fee 500 posted,
        balance 99500)
      setup_api_calls:
      - call: POST /bank/accounts
        payload:
          primary_owner_name: Rea R
          owner_tax_id: C13
          ownership_type: INDIVIDUAL
          product_code: SAVINGS
          rate_bps: 0
          opening_deposit_cents: 100000
        as: OpsOfficer
        captures:
          acct: $.data.id
      - call: POST /bank/_clock/set_current_utc
        payload:
          to_iso8601: '2027-08-01T00:00:00Z'
        as: OpsManager
      - call: POST /bank/ops/daily-sweep
        payload: {}
        as: OpsManager
      trigger:
      - call: POST /bank/accounts/${acct}/transactions
        payload:
          txn_type: DEPOSIT
          amount_cents: 100
          customer_initiated: true
          posted_date: '2027-08-02'
        as: OpsOfficer
        captures:
          txn: $.data.id
          bal: $.data.balance_after_cents
      - call: GET /bank/accounts/${acct}
        payload: {}
        as: OpsManager
        captures:
          lc: $.data.lifecycle_status
          dormant_since: $.data.dormant_since_date
          fees_n: $.data.fees_assessed_count
          act: $.data.last_customer_activity_date
      assert:
      - ${bal} == 99600
      - ${lc} == OPEN
      - ${dormant_since} == null
      - ${fees_n} == 0
      - ${act} == 2027-08-02
- section: calculations
  instances:
  - name: inactivity_fee_capped_at_balance_auto_closes
    claim_type: correct_result
    grounds:
    - calculations.inactivity_fee_assessment
    - state_machines.DepositAccount
    distinguishing_aspect: 'Fee cap boundary: balance 300 < INACTIVITY_FEE_CENTS 500,
      so the entry fee is exactly 300 (min clause), the balance lands on exactly 0,
      and the zero-balance rule auto-closes the account in the same sweep.'
    test_recipe:
      setup:
      - account balance 300 rate 0, opened 2026-08-01; clock advanced exactly 365
        days
      setup_api_calls:
      - call: POST /bank/accounts
        payload:
          primary_owner_name: Cap C
          owner_tax_id: C14
          ownership_type: INDIVIDUAL
          product_code: SAVINGS
          rate_bps: 0
          opening_deposit_cents: 300
        as: OpsOfficer
        captures:
          acct: $.data.id
      - call: POST /bank/_clock/set_current_utc
        payload:
          to_iso8601: '2027-08-01T00:00:00Z'
        as: OpsManager
      trigger:
      - call: POST /bank/ops/daily-sweep
        payload: {}
        as: OpsManager
        captures:
          fees_c: $.data.fees_assessed_cents
          closed_n: $.data.auto_closed_count
      - call: GET /bank/accounts/${acct}
        payload: {}
        as: OpsManager
        captures:
          lc: $.data.lifecycle_status
          bal: $.data.balance_cents
      assert:
      - ${fees_c} == 300
      - ${closed_n} == 1
      - ${lc} == CLOSED
      - ${bal} == 0
  - name: fee_cadence_second_fee_at_exactly_30_days
    claim_type: constants_applied
    grounds:
    - calculations.inactivity_fee_assessment
    distinguishing_aspect: 'FEE_PERIOD_DAYS boundary: a sweep 29 days after dormancy
      entry assesses no new fee; a sweep at exactly 30 days assesses exactly one more
      500 fee (floor(30/30) = 1).'
    test_recipe:
      setup:
      - account 10000 rate 0, dormant since the 2027-08-01 sweep (entry fee posted,
        balance 9500)
      setup_api_calls:
      - call: POST /bank/accounts
        payload:
          primary_owner_name: Cad K
          owner_tax_id: C15
          ownership_type: INDIVIDUAL
          product_code: SAVINGS
          rate_bps: 0
          opening_deposit_cents: 10000
        as: OpsOfficer
        captures:
          acct: $.data.id
      - call: POST /bank/_clock/set_current_utc
        payload:
          to_iso8601: '2027-08-01T00:00:00Z'
        as: OpsManager
      - call: POST /bank/ops/daily-sweep
        payload: {}
        as: OpsManager
      - call: POST /bank/_clock/set_current_utc
        payload:
          to_iso8601: '2027-08-30T00:00:00Z'
        as: OpsManager
      - call: POST /bank/ops/daily-sweep
        payload: {}
        as: OpsManager
        captures:
          fees_29: $.data.fees_assessed_count
      trigger:
      - call: POST /bank/_clock/set_current_utc
        payload:
          to_iso8601: '2027-08-31T00:00:00Z'
        as: OpsManager
      - call: POST /bank/ops/daily-sweep
        payload: {}
        as: OpsManager
        captures:
          fees_30: $.data.fees_assessed_count
      - call: GET /bank/accounts/${acct}
        payload: {}
        as: OpsManager
        captures:
          bal: $.data.balance_cents
          fees_n: $.data.fees_assessed_count
          lc: $.data.lifecycle_status
      assert:
      - ${fees_29} == 0
      - ${fees_30} == 1
      - ${fees_n} == 2
      - ${bal} == 9000
      - ${lc} == DORMANT
  - name: available_balance_net_of_holds
    claim_type: correct_result
    grounds:
    - calculations.available_balance_reconciliation
    - entities.DepositAccount.fields.available_balance_cents
    distinguishing_aspect: 'Derived field: available_balance_cents == balance_cents
      - total_held_cents with the status filter pinned to FUNDS_HELD; verified while
      the hold is active.'
    test_recipe:
      setup:
      - account 90000; garnishment claim 35000 held
      setup_api_calls:
      - call: POST /bank/accounts
        payload:
          primary_owner_name: Avl A
          owner_tax_id: C16
          ownership_type: INDIVIDUAL
          product_code: SAVINGS
          rate_bps: 0
          opening_deposit_cents: 90000
        as: OpsOfficer
