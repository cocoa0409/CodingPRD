              as_user_id: "${assoc_id}"
          assert:
            - "DefectClaim.${claim_id}.repose_deadline == 2031-05-05T00:00:00Z"
            - "first trigger call returns 409 with error_id ERR_COMPONENT_NOT_CONVEYED"
            - "DefectClaim.${claim_id}.status == INVESTIGATING after the first trigger call"
            - "second trigger call returns 200 with CommonAreaComponent.${comp_id}.conveyance_status == CONVEYED and conveyed_at == 2026-08-01T00:00:00Z"
            - "third trigger call returns 200 with DefectClaim.${claim_id}.status == NOTICED"

      - name: assessment_creation_depends_on_adopted_reserve_study_state
        grounds:
          - state_machines.ReserveStudy.DRAFT_to_ADOPTED
          - entities.ReserveStudy.fields.status
