        claim_type: violation_to_error
        grounds: ["errors[ERR_ITEM_NOT_DISPOSABLE]"]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / allocation_refused_while_item_is_frozen_by_an_open_claim
          rationale: "Asserted directly by the named §1.8 cross-entity instance."
      - name: error_stale_policy_version_on_schedule
        claim_type: violation_to_error
        grounds: ["errors[ERR_STALE_POLICY_VERSION]", "concurrency_rules[item-schedule-stale-policy]"]
        excluded_because:
          difficulty_instance: compensating_invariant / schedule_unschedule_roundtrip_conserves_policy_allowance_cents
          rationale: "The OCC field is exercised throughout that instance's chain; the stale-version rejection is covered by the three sibling OCC corner instances in this file, which use the same rung-38 mechanism on the other three parents."

  - section: endpoints
