  - section: cross_cutting_complexity_layers
    instances:
      - name: the_project_token_is_consumed_by_every_write_and_a_stale_one_is_refused_with_412
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.design-package-create-stale-project
          - errors.ERR_STALE_PROJECT_VERSION
          - endpoints.POST_/exhibit-projects/{id}/design-packages
        distinguishing_aspect: |
          The optimistic token on this project is bumped by EVERY write to the project
          aggregate, not only by design-package creation, so a client that reads the
          project, creates a package, and then creates a second package with the token
          it read first must be refused - and refused with 412, which is a different
          family from the 409 conflicts that dominate this API. The instance also shows
          why the guard exists: the second create legitimately supersedes the first
          package AND closes its open review round, so a client acting on a stale view
          would silently destroy a live review. The refusal is repeated once the token
          is two writes behind, and the project version is shown to advance by exactly
          one per successful write so the counter cannot be a timestamp or a random
          value.
        test_recipe:
          setup:
            - "a fresh project advanced to SCHEMATIC, so its version is exactly 2"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProjectManager
            - call: "POST /exhibit-projects"
              payload: { name: "Deep Time Hall", museum_name: "Ridgeline Museum", storyline_title: "Deep Time: Reading the Rock Record", objective_codes: ["OBJ-STRATA", "OBJ-EXTINCTION"], target_open_date: "2027-05-01T00:00:00Z", contract_value_cents: 9000000 }
              as: ProjectManager
              as_user_id: pm-01
              captures: { proj: $.data.id }
            - call: "POST /exhibit-projects/${proj}/advance-phase"
              payload: { to_phase: "SCHEMATIC" }
              as: ProjectManager
              as_user_id: pm-01
          trigger:
            - call: "GET /exhibit-projects/${proj}"
              payload: {}
              as: ProjectManager
              as_user_id: pm-01
              captures: { c0: $.data.version, cor0: $.data.open_revision_count }
            - call: "POST /exhibit-projects/${proj}/design-packages"
              payload: { expected_project_version: "${c0}", stage: "SCHEMATIC", egress_clear_width_cm: 112, wheelchair_turning_radius_cm: 76, peak_visitors_per_hour: 180, circulation_area_sqm: 95.0 }
              as: ProjectManager
              as_user_id: pm-01
              captures: { cp1: $.data.id, cp1st: $.data.status, cp1score: $.data.flow_capacity_score }
            - call: "POST /exhibit-projects/${proj}/design-packages"
              payload: { expected_project_version: "${c0}", stage: "SCHEMATIC", egress_clear_width_cm: 112, wheelchair_turning_radius_cm: 76, peak_visitors_per_hour: 180, circulation_area_sqm: 95.0 }
              as: ProjectManager
              as_user_id: pm-01
              captures: { o1: $.data.error_id }
            - call: "GET /exhibit-projects/${proj}"
              payload: {}
              as: ProjectManager
              as_user_id: pm-01
              captures: { c1: $.data.version }
            - call: "POST /design-packages/${cp1}/review-rounds"
              payload: { panel_roles: ["Curator", "Conservator", "ProjectManager"], decision_deadline_at: "2026-08-20T00:00:00Z" }
              as: ProjectManager
              as_user_id: pm-01
              captures: { cr1: $.data.id, cr1st: $.data.status }
            - call: "POST /exhibit-projects/${proj}/design-packages"
              payload: { expected_project_version: "${c0}", stage: "SCHEMATIC", egress_clear_width_cm: 112, wheelchair_turning_radius_cm: 76, peak_visitors_per_hour: 180, circulation_area_sqm: 95.0 }
              as: ProjectManager
              as_user_id: pm-01
              captures: { o2: $.data.error_id }
            - call: "GET /exhibit-projects/${proj}"
              payload: {}
              as: ProjectManager
              as_user_id: pm-01
              captures: { c2: $.data.version, cor1: $.data.open_revision_count, cpost1: $.data.posture }
            - call: "POST /exhibit-projects/${proj}/design-packages"
              payload: { expected_project_version: "${c2}", stage: "SCHEMATIC", egress_clear_width_cm: 112, wheelchair_turning_radius_cm: 76, peak_visitors_per_hour: 180, circulation_area_sqm: 95.0 }
              as: ProjectManager
              as_user_id: pm-01
              captures: { cp2: $.data.id, cp2st: $.data.status }
            - call: "GET /design-packages/${cp1}"
              payload: {}
              as: ProjectManager
              as_user_id: pm-01
              captures: { cp1st2: $.data.status, cp1sup: $.data.superseded_by_package_id }
            - call: "GET /review-rounds/${cr1}"
              payload: {}
              as: ProjectManager
              as_user_id: pm-01
              captures: { cr1st2: $.data.status }
            - call: "GET /exhibit-projects/${proj}"
              payload: {}
              as: ProjectManager
              as_user_id: pm-01
              captures: { c3: $.data.version, cor2: $.data.open_revision_count, cpost2: $.data.posture }
          assert:
            - "${c0} == 2 and ${cor0} == 0 - one create and one advance, so the token is exactly 2"
            - "${cp1st} == DRAFT and ${cp1score} == 100.00 - min(100.0, 95.0 / (180 * 0.65) * 100) caps at 100.00"
            - "${o1} == ERR_STALE_PROJECT_VERSION with HTTP 412 - the token was consumed by the first create"
            - "${c1} == 3 == ${c0} + 1 - exactly one increment per successful write"
            - "${cr1st} == OPEN - the round on the first package is live"
            - "${o2} == ERR_STALE_PROJECT_VERSION with HTTP 412 - a token two writes behind is refused the same way, and the failed call does not consume the current token"
            - "${c2} == 4, ${cor1} == 1 and ${cpost1} == RESTRICTED - the round create bumped the project token again and one open revision restricts the posture"
            - "${cp2st} == DRAFT - the create with the current token succeeds"
            - "${cp1st2} == SUPERSEDED with ${cp1sup} == ${cp2} - this is exactly the destruction the guard prevents when the token is stale"
            - "${cr1st2} == CLOSED_SUPERSEDED - the live round on the superseded package was closed by the cascade, not left OPEN"
            - "${c3} == 5, ${cor2} == 0 and ${cpost2} == OPEN - the derived counters were recomputed after the cascade, in the same write"

      - name: the_case_token_guards_the_envelope_a_placement_rewrites
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules.placement-create-stale-case", "errors.ERR_STALE_CASE_VERSION"]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / case_state_outranks_artifact_already_placed_on_the_same_request
          rationale: "Asserted by the named §1.8 instance, which places one object, then re-uses the pre-placement case version on a second placement and receives ERR_STALE_CASE_VERSION at the 412 rung ahead of every domain rule."

      - name: the_four_link_conservation_cascade_is_verified_end_to_end
        claim_type: cascading_side_effects
        grounds: ["state_machines.MaterialSpec", "state_machines.ExhibitProject", "calculations.project_readiness_posture"]
        excluded_because:
          difficulty_instance: transitive_cascade / material_rejection_cascades_four_links_to_the_ledger_and_the_zone_slot_ledger
          rationale: "Asserted by the named §1.8 instance, which follows one conservator rejection through the drawing, the money ledger, the case and the zone slot ledger, and by the two sibling transitive_cascade instances covering the veto and the window-completion chains."

      - name: both_cost_and_durability_variants_are_stored_and_reconciled
        claim_type: dual_variant_calculation
        grounds: ["calculations.fabrication_cost_estimate", "calculations.interactive_durability_index"]
        excluded_because:
          difficulty_instance: dual_variant_calc / fabrication_estimate_versus_shop_actual_on_one_drawing
          rationale: "Asserted by the named §1.8 instance and its two siblings, which pin both variants of both calculations, the delta between them, and the tier and warranty consequences of the switch."

      - name: every_derived_counter_is_recomputed_at_the_instant_its_source_row_changes
        claim_type: derived_field_reconciliation
        grounds:
          - calculations.project_readiness_posture
          - entities.ExhibitProject.pending_material_count
          - entities.GalleryZone.available_case_slots
          - entities.ArtifactCase.placed_artifact_count
        distinguishing_aspect: |
          Four derived fields living on three different parents must agree with a
          recount of their sources after every single write, and the trap is that they
          are recomputed on WRITE rather than on read: an implementation that computes
          pending_material_count lazily inside the project read will pass, but one that
          computes it once at project creation will report 0 forever. The instance
          therefore interleaves reads of the parent with reads of the child listing that
          the counter counts, so the counter and the recount must match at four
