          - "errors[ERR_GATE_SEQUENCE_VIOLATION]"
        distinguishing_aspect: "Gate events per badge must strictly alternate starting with IN: a second IN (or second OUT) fails with ERR_GATE_SEQUENCE_VIOLATION (422)."
        test_recipe:
          setup: ["Zone; ACTIVE badge valid [2026-08-01T00:00:00Z, 2026-12-31T00:00:00Z]"]
          setup_api_calls:
            - call: "POST /zones"
              payload: { name: "Seq Zone", zone_code: "Z-SEQ", bond_coverage_cents: 10000000000 }
              as: ZoneOperator
              captures: { z: "$.data.id" }
            - call: "POST /zones/access-badges"
              payload: { zone_id: "${z}", holder_name: "Ada Lovelace", valid_from: "2026-08-01T00:00:00Z", valid_until: "2026-12-31T00:00:00Z" }
              as: ZoneOperator
              captures: { b: "$.data.id" }
          trigger:
            - call: "POST /zones/access-events"
              payload: { zone_id: "${z}", badge_id: "${b}", direction: "IN", occurred_at: "2026-08-10T09:00:00Z" }
              as: GateOfficer
              captures: { ok1: "$.data.id" }
            - call: "POST /zones/access-events"
              payload: { zone_id: "${z}", badge_id: "${b}", direction: "IN", occurred_at: "2026-08-10T10:00:00Z" }
              as: GateOfficer
              captures: { err1: "$.data.error_id" }
            - call: "POST /zones/access-events"
              payload: { zone_id: "${z}", badge_id: "${b}", direction: "OUT", occurred_at: "2026-08-10T11:00:00Z" }
