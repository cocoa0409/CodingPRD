            - "GET /model-documentation?score_model_id=${m1}&status=FILED reports total_count == 1"

      - name: endpoint_reason_code_list_filters_by_catalogue_parent
        claim_type: cross_reference
        grounds:
          - endpoints.GET_/reason-codes
          - entities.ReasonCode.fields.parent_reason_code_id
        distinguishing_aspect: "The reason-code list filters by parent_reason_code_id, so a parent filter returns only the direct children of that catalogue node while the variant filter returns the whole tree."
        test_recipe:
          setup:
            - "One DEVELOPMENT model M1 with a released AUTO variant and three catalogue nodes: a PRIMARY root with parent null, a SECONDARY child of the root and a TERTIARY child of the same root."
          setup_api_calls:
            - {call: "POST /bureaus", payload: {bureau_code: "TUC", display_name: "TransUnion"}, as: BureauAdministrator, captures: {b_tuc: $.data.id}}
            - {call: "POST /score-models", payload: {family_code: "FICO_CORE", version_label: "CREDIT-DUAL-V1", min_input_count: 100, score_floor: 300, score_ceiling: 850}, as: ModelDeveloper, captures: {m1: $.data.id}}
            - {call: "POST /score-models/${m1}/variants", payload: {industry: "AUTO", ref_score: 700, base_odds: 18.0, double_odds_points: 35, segment_width: 60, segment_offsets: [0, 10, -6], rounding_penalty_pct: 0.02, aggregate_weight_pct: 0.42, elongation_points: 700, cutoff_baseline: 700}, as: ModelDeveloper, captures: {v1: $.data.id}}
            - {call: "POST /score-variants/${v1}/release", payload: {}, as: ModelDeveloper}
            - {call: "POST /reason-codes", payload: {score_variant_id: "${v1}", depth_tier: "PRIMARY", trigger_feature_code: "ROOT", code_label: "rc-root", weight_pct: 0.20}, as: ReasonCodeAdministrator, captures: {rc_root: $.data.id, rc_root_composite: $.data.composite_code}}
            - {call: "POST /reason-codes", payload: {score_variant_id: "${v1}", depth_tier: "SECONDARY", trigger_feature_code: "CHILD-A", code_label: "rc-child-a", weight_pct: 0.20, parent_reason_code_id: "${rc_root}"}, as: ReasonCodeAdministrator, captures: {rc_a: $.data.id}}
            - {call: "POST /reason-codes", payload: {score_variant_id: "${v1}", depth_tier: "TERTIARY", trigger_feature_code: "CHILD-B", code_label: "rc-child-b", weight_pct: 0.30, parent_reason_code_id: "${rc_root}"}, as: ReasonCodeAdministrator, captures: {rc_b: $.data.id}}
          trigger:
            - {call: "GET /reason-codes?parent_reason_code_id=${rc_root}", payload: {}, as: ReasonCodeAdministrator}
            - {call: "GET /reason-codes?score_variant_id=${v1}", payload: {}, as: ReasonCodeAdministrator}
            - {call: "GET /reason-codes/${rc_b}", payload: {}, as: ReasonCodeAdministrator, captures: {comp: $.data.composite_code, eff: $.data.weight_effective_pct}}
          assert:
            - "the parent filter reports total_count == 2 and returns exactly the two child ids captured above, in either order"
            - "the variant filter reports total_count == 3, so the parent filter is a strict narrowing"
            - "data.comp ends with the TERTIARY tier token and contains the trigger feature code, so the composite code is minted from the variant and the authored fields"
            - "data.eff == 0.30 — weight_received_pct is 0 while every child is still ACTIVE"
