            - call: "POST /_billing/run"
              payload: {}
              as: PlatformAdmin
              captures: { renewed: $.data.subscriptions_renewed }
          assert:
            - "billing-run.subscriptions_renewed == 1"
            - "GET /invoices?subscription_id=${sub_id} contains a RENEWAL invoice with amount_cents == 9900"
            - "Subscription.${sub_id}.granted_credits_remaining == 4"

      - name: scheduled_billing_run_expires_old_pack
        claim_type: scheduled_actions
        grounds:
          - state_machines.CreditPack.transitions.ACTIVE_to_EXPIRED
          - entities.CreditPack.fields.expires_at
          - calculations.member_credit_balance
          - endpoints["POST /_billing/run"]
        distinguishing_aspect: "A STD pack bought at 2026-06-01 expires after 180 days; advancing the clock to 2026-12-01 then POST /_billing/run flips it ACTIVE->EXPIRED and zeroes the member balance."
        test_recipe:
          setup: ["Member buys STD pack of 5 at 2026-06-01 (expires 2026-11-28); clock advanced to 2026-12-01."]
          setup_api_calls:
            - call: "POST /locations"
              payload: { name: "L", state_code: "TX", timezone: "America/Chicago" }
              as: PlatformAdmin
              captures: { loc_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /members"
              payload: { home_location_id: "${loc_id}", email: "exp@x.com", full_name: "EXP", state_code: "TX" }
              as: LocationManager
              captures: { m_id: $.data.id }
            - call: "POST /members/${m_id}/credit-packs"
              payload: { total_credits: 5, is_intro: false }
              as: Member
              as_user_id: "${m_id}"
              captures: { pack_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-12-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /_billing/run"
              payload: {}
              as: PlatformAdmin
              captures: { expired: $.data.packs_expired }
          assert:
            - "billing-run.packs_expired == 1"
            - "CreditPack.${pack_id}.status == EXPIRED"
            - "Member.${m_id}.credit_balance == 0"

      - name: derived_balance_reconciles_after_pack_refund
        claim_type: derived_field_reconciliation
        grounds:
          - calculations.member_credit_balance
          - entities.Member.fields.credit_balance
          - state_machines.CreditPack.transitions.ACTIVE_to_REFUNDED
          - endpoints["POST /members/{member_id}/credit-packs/{pack_id}/refund"]
        distinguishing_aspect: "Member.credit_balance is the sum of ACTIVE pack remaining credits; refunding the only pack drops the balance from 5 to 0 immediately."
        test_recipe:
          setup: ["Member buys a STD pack of 5; clock 2026-06-01 (balance 5)."]
          setup_api_calls:
            - call: "POST /locations"
              payload: { name: "L", state_code: "TX", timezone: "America/Chicago" }
              as: PlatformAdmin
              captures: { loc_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /members"
              payload: { home_location_id: "${loc_id}", email: "der@x.com", full_name: "DER", state_code: "TX" }
              as: LocationManager
              captures: { m_id: $.data.id }
            - call: "POST /members/${m_id}/credit-packs"
              payload: { total_credits: 5, is_intro: false }
              as: Member
              as_user_id: "${m_id}"
              captures: { pack_id: $.data.id }
          trigger:
            - call: "POST /members/${m_id}/credit-packs/${pack_id}/refund"
              payload: {}
              as: LocationManager
              captures: { st: $.data.status }
          assert:
            - "Member.${m_id}.credit_balance == 0"
            - "CreditPack.${pack_id}.status == REFUNDED"

