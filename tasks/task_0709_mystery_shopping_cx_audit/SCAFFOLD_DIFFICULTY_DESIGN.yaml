              payload: {}
              as: QaValidator
              captures: { amt: $.data.reimbursable_cents, fee: $.data.shopper_fee_cents }
            - call: "GET /assignments/${asg_id}/reimbursement"
              payload: {}
              as: FinanceOfficer
              captures: { reimb_id: "$.data[0].id", reimb_amt: "$.data[0].amount_cents" }
            - call: "POST /payout-batches"
              payload: { shopper_id: "${shopper_id}", reimbursement_ids: ["${reimb_id}"] }
