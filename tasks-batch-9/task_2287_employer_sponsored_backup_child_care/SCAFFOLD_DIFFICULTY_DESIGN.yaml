            - call: "POST /backup-care/employees"
              payload: { employer_id: "${emp_id}", benefit_plan_id: "${p1_id}", employee_external_id: "E-7001", user_id: "u_ee_7", email: "rey@meridian.test", full_name: "Rey Solano", employment_status: "ACTIVE" }
              as: benefits_admin
              as_user_id: "u_ba_1"
              captures: { ee_id: $.data.id }
            - call: "POST /backup-care/employees/${ee_id}/dependents"
              payload: { full_name: "Mila Solano", dependent_type: "CHILD", date_of_birth: "2020-06-06", relationship: "DAUGHTER", status: "ACTIVE" }
              as: benefits_admin
              as_user_id: "u_ba_1"
              captures: { dep_id: $.data.id }
