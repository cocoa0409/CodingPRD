          Four credits issued the same day with the same 113-day validity
          (quarters = 2) straddle both tier edges. 5000000 takes 15 bps and
          5000001 takes 10 bps, but both land on the 25000 floor, so ONLY
          commission_bps_applied distinguishes them - an implementation that
          skips the floor reports 15000 and 10000. 50000000 takes 10 bps for a
          base of 100000 while 50000001 takes 7 bps for a base of 70000: one cent
