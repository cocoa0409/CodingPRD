              payload: { recorded_at: "2026-09-01T00:00:30Z", lat: 37.7, lng: -122.4, accuracy_m: 0, speed_mps: 0.0, battery_pct: 90, phone_in_use: false, motion_context: "STILL" }
              as: Owner
              as_user_id: "${oid}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 422 with error_id == ERR_FIX_CLOCK_SKEW"

      - name: assistance_units_exhausted_on_free_tier
        claim_type: ViolationToError
        grounds:
          - validations[priority=16]
          - errors.ERR_ASSISTANCE_UNITS_EXHAUSTED
        distinguishing_aspect: "FREE tier starts with assistance_units_balance=0; a manual roadside-assistance request is rejected with 402."
        test_recipe:
          setup: ["FREE circle."]
          setup_api_calls:
