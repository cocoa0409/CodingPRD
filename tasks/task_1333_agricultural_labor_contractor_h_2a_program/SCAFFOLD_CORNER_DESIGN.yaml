      - name: audit_case_guard_battery_rejected
        claim_type: violation_to_error
        grounds: ["errors[ERR_AUDIT_CASE_INVALID_STATE]", "errors[ERR_INVALID_FINDINGS]", "errors[ERR_INVALID_DEBARMENT_TERM]", "state_machines.AuditCase"]
        distinguishing_aspect: "Audit lifecycle guards: assess before findings (state), malformed findings (fiscal-domain), out-of-range debarment term (fiscal), and terminal lockdown after CLOSED_NO_ACTION."
        test_recipe:
          setup: ["Grower G1; AuditCase AC1 OPEN"]
          setup_api_calls:
            - { call: "POST /h2a/growers", payload: { legal_name: "Green Acres LLC", fein: "12-3456789", state_code: "CA" }, as: ContractorAdmin, captures: { g1: $.data.id } }
            - { call: "POST /h2a/audit-cases", payload: { grower_id: "${g1}", trigger_source: "MANUAL" }, as: WageAuditor, captures: { ac1: $.data.id } }
          trigger:
            - { call: "POST /h2a/audit-cases/${ac1}/assess-penalty", payload: { good_faith: false }, as: WageAuditor, captures: { e1: $.data.error_id } }
            - { call: "POST /h2a/audit-cases/${ac1}/issue-findings", payload: { findings: [ { violation_code: "BOGUS_CODE", count: 1, willful: false } ] }, as: WageAuditor, captures: { e2: $.data.error_id } }
            - { call: "POST /h2a/audit-cases/${ac1}/issue-findings", payload: { findings: [ { violation_code: "RECORDKEEPING", count: 1, willful: false } ] }, as: WageAuditor, captures: { prov: $.data.provisional_exposure_cents } }
            - { call: "POST /h2a/audit-cases/${ac1}/debar", payload: { debarment_years: 5 }, as: WageAuditor, captures: { e3: $.data.error_id } }
            - { call: "POST /h2a/audit-cases/${ac1}/close-no-action", payload: {}, as: WageAuditor, captures: { st: $.data.status } }
            - { call: "POST /h2a/audit-cases/${ac1}/issue-findings", payload: { findings: [ { violation_code: "RECORDKEEPING", count: 1, willful: false } ] }, as: WageAuditor, captures: { e4: $.data.error_id } }
          assert:
            - "e1 == ERR_AUDIT_CASE_INVALID_STATE (assess-penalty requires FINDINGS_ISSUED)"
            - "e2 == ERR_INVALID_FINDINGS (400; unknown violation_code)"
            - "prov == 60000 (provisional variant on the valid findings)"
            - "e3 == ERR_INVALID_DEBARMENT_TERM (400; 5 outside 1..3)"
            - "st == CLOSED_NO_ACTION with closed_on == 2026-08-01 (default clock)"
            - "e4 == ERR_AUDIT_CASE_INVALID_STATE (terminal lockdown)"

