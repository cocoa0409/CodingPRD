      - name: substitution_delta_pessimistic_vs_optimistic_by_job_phase
        grounds:
          - calculations.substitution_lead_time_delta
          - state_machines.SubstitutionRequest.REQUESTED_to_APPROVED
        distinguishing_aspect: |
          Identical component swap (original lead_time 10 days, proposed lead_time 30
          days, raw delta +20) yields lead_time_delta_days == 27 under the pessimistic
          variant while the Job is in DESIGN/PROCUREMENT (+7 risk pad), but
          lead_time_delta_days == 0 under the optimistic variant once the Job has
          advanced to BUILD; entity domain is SubstitutionRequest, distinct from the
          WarrantyClaim domain of the sibling instance.
        test_recipe:
          setup:
            - "Two jobs in different phases: job EARLY resting in PROCUREMENT, job LATE resting in BUILD"
            - "Each job has one panel whose BOM contains the 10-day component and an open SubstitutionRequest proposing the 30-day component"
          setup_api_calls:
            - call: "POST /panel-shop/customers"
              payload: { company_name: "Beta Plastics", site_state_code: "TX" }
              as: ProjectManager
              captures: { cust2_id: "$.data.id" }
