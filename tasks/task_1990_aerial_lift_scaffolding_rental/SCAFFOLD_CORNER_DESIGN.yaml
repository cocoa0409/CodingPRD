        grounds: [calculations.billable_days, calculations.rental_segment_charge]
        distinguishing_aspect: "Chronological day counting ceils partial days: 25 elapsed hours bills as 2 days (29000 cents at 14500/day), not 1."
        test_recipe:
          setup: ["contract ACTIVE; class S19E (daily 14500, weekly 43500, monthly 99000, min 1); line delivered 2026-08-10T09:00:00Z"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T09:00:00Z" }
              as: BranchManager
            - call: "POST /customer-accounts"
              payload: { company_name: "Ceil Co", contact_email: "ops@ceil.example", credit_limit_cents: 100000000 }
              as: BranchManager
              captures: { cust_id: $.data.id }
            - call: "POST /equipment-classes"
              payload: { class_code: "S19E", category: "AERIAL_LIFT", max_working_height_ft: 25, min_rental_days: 1, daily_rate_cents: 14500, weekly_rate_cents: 43500, monthly_rate_cents: 99000, replacement_value_cents: 2500000 }
