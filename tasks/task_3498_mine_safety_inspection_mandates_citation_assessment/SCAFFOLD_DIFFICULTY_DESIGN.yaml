              captures: { insp1: $.data.id }
            - call: "POST /msha/inspections/${insp1}/file-review"
              payload: {}
              as: Inspector
              as_user_id: "${i1}"
          trigger:
            - call: "POST /msha/inspections/${insp1}/reassign"
              payload: { new_inspector_id: "${i2}" }
              as: DistrictManager
            - call: "POST /msha/inspections/${insp1}/file-review"
              payload: {}
              as: Inspector
              as_user_id: "${i1}"
              captures: { err_mismatch: $.data.error_id }
            - call: "POST /msha/inspections/${insp1}/file-review"
              payload: {}
              as: Inspector
              as_user_id: "${i2}"
            - call: "POST /msha/inspections/${insp1}/start"
              payload: {}
              as: Inspector
              as_user_id: "${i2}"
          assert:
            - "after reassign: Inspection.${insp1}.status == ASSIGNED and inspector_id == ${i2} and file_reviewed_at is null (the loop consumed the first review)"
            - "inspector ${i1} file-review after reassignment is rejected ERR_INSPECTOR_MISMATCH (the old review is gone, not just re-scoped)"
            - "inspector ${i2} completes the loop: file-review then start succeeds, ending IN_PROGRESS"

      - name: mine_idle_reactivate_round_trip_preserves_pov_axis
        grounds:
