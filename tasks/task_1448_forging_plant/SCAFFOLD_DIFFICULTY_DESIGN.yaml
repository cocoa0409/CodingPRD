            - "ticket B: flash_scrap_lbs == 48.01, unrounded yield 12.0025% > 12.0% -> status FLAGGED"
            - "displayed flash_yield_pct rounds to 12.00 for BOTH tickets (proves disposition ignores the rounded display value)"

  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: charge_blocked_while_heat_quarantined
        grounds:
          - state_machines.MillHeat.CERT_VERIFIED_to_QUARANTINED
          - validations[priority=14]
        distinguishing_aspect: |
          Entity pair (FurnaceCharge, MillHeat): a charge is creatable only
          while every billet's heat is CERT_VERIFIED; quarantining the heat
          after cutting flips the charge precondition off. Distinct pair from
          the ForgeRun/DieSet and Invoice/WorkOrder dependencies below.
        test_recipe:
          setup:
            - "Alloy AISI-4140; heat H-5201 CERT_VERIFIED; 2 billets cut; heat QUARANTINED; FUR-1 UP"
          setup_api_calls:
            - { call: "POST /alloy-specs", payload: { grade_code: "AISI-4140", name: "CrMo Steel", forge_temp_min_f: 2100, forge_temp_max_f: 2300, reheat_limit: 2, flash_allowance_pct: 12.0, strokes_per_part: 3, flow_stress_ksi: 8.0, carbon_max_pct: 0.43, manganese_max_pct: 1.10, grain_flow_min_rating: 5, macro_etch_required: true }, as: PlantManager, captures: { alloy_id: "$.data.id" } }
            - { call: "POST /mill-heats", payload: { heat_number: "H-5201", alloy_spec_id: "${alloy_id}", mill_name: "Ellwood Bar Mill", received_weight_lbs: 20000.00, bar_lbs_per_in: 2.50 }, as: PlantManager, captures: { heat_id: "$.data.id" } }
            - { call: "POST /mill-heats/${heat_id}/verify-cert", payload: { carbon_pct: 0.40, manganese_pct: 0.90 }, as: QualityEngineer }
            - { call: "POST /mill-heats/${heat_id}/billets", payload: { cuts: [ { cut_length_in: 20.0, quantity: 2 } ] }, as: SawOperator, captures: { b1: "$.data[0].id", b2: "$.data[1].id" } }
            - { call: "POST /mill-heats/${heat_id}/quarantine", payload: { reason: "cert review" }, as: QualityEngineer }
            - { call: "POST /furnaces", payload: { furnace_code: "FUR-1", capacity_lbs: 5000 }, as: PlantManager, captures: { fur_id: "$.data.id" } }
          trigger:
            - { call: "POST /furnace-charges", payload: { furnace_id: "${fur_id}", billet_ids: ["${b1}", "${b2}"], target_temp_f: 2200, soak_minutes: 60, planned_load_start: "2026-08-02T08:00:00Z", planned_unload: "2026-08-02T12:00:00Z" }, as: FurnaceOperator, captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_HEAT_QUARANTINED, HTTP 409 (in-window temperature: safety checks all pass)"
            - "no FurnaceCharge created: GET /furnace-charges?furnace_id= returns empty list"

      - name: run_start_requires_die_installed
        grounds:
          - state_machines.ForgeRun.SCHEDULED_to_IN_PROGRESS
          - validations[priority=14]
          - errors[ERR_DIE_NOT_INSTALLED]
        distinguishing_aspect: |
          Entity pair (ForgeRun, DieSet): run creation succeeds referencing an
          AVAILABLE die, but the START transition is gated on the die being
          INSTALLED on the run's work center — DieSet state gates ForgeRun
          transition. Distinct pair from the other two instances.
        test_recipe:
          setup:
            - "Alloy AISI-4140; DIE-17 AVAILABLE (never installed); WC-1 UP; WO-14 released; run created"
          setup_api_calls:
            - { call: "POST /alloy-specs", payload: { grade_code: "AISI-4140", name: "CrMo Steel", forge_temp_min_f: 2100, forge_temp_max_f: 2300, reheat_limit: 2, flash_allowance_pct: 12.0, strokes_per_part: 3, flow_stress_ksi: 8.0, carbon_max_pct: 0.43, manganese_max_pct: 1.10, grain_flow_min_rating: 5, macro_etch_required: true }, as: PlantManager, captures: { alloy_id: "$.data.id" } }
            - { call: "POST /die-sets", payload: { die_set_code: "DIE-17", part_family: "FLG-4", wear_limit_hits: 300, max_resinks: 2 }, as: DieShopTechnician, captures: { die_id: "$.data.id" } }
            - { call: "POST /work-centers", payload: { code: "WC-1", type: "PRESS", rated_tonnage: 500 }, as: PlantManager, captures: { wc_id: "$.data.id" } }
            - { call: "POST /work-orders", payload: { order_number: "WO-14", customer_name: "Acme Aero", alloy_spec_id: "${alloy_id}", part_number: "PN-100", ordered_qty: 10, part_net_weight_lbs: 40.00, billet_weight_lbs: 50.00, projected_area_in2: 25.0, required_process: "PRESS", price_tier1_limit_tons: 1.0, price_tier1_cents_per_ton: 2000000, price_tier2_limit_tons: 5.0, price_tier2_cents_per_ton: 1800000, price_tier3_cents_per_ton: 1500000, scrap_recovery_rate_cents_per_lb: 150 }, as: SalesPlanner, captures: { wo_id: "$.data.id", wo_v: "$.data.version" } }
            - { call: "POST /forge-runs", payload: { work_order_id: "${wo_id}", die_set_id: "${die_id}", planned_start: "2026-08-03T09:00:00Z", planned_end: "2026-08-03T10:30:00Z", planned_qty: 10, expected_work_order_version: "${wo_v}", work_center_id: "${wc_id}" }, as: ForgeOperator, captures: { run_id: "$.data.id", run_status: "$.data.status" } }
          trigger:
            - { call: "POST /forge-runs/${run_id}/start", payload: {}, as: ForgeOperator, captures: { err: "$.data.error_id" } }
          assert:
            - "run creation succeeded with die AVAILABLE (run_status == SCHEDULED): create is NOT gated on install"
            - "error_id == ERR_DIE_NOT_INSTALLED, HTTP 409; run remains SCHEDULED"

      - name: finalize_requires_order_certified
        grounds:
          - state_machines.Invoice.PROVISIONAL_to_FINAL
          - state_machines.WorkOrder.IN_PROGRESS_to_PRODUCED
          - errors[ERR_ORDER_NOT_CERTIFIED]
        distinguishing_aspect: |
          Entity pair (Invoice, WorkOrder): the Invoice's PROVISIONAL -> FINAL
          transition is gated on the WorkOrder being CERTIFIED; a PRODUCED
          order with a PENDING cert blocks finalization. Third distinct pair.
        test_recipe:
          setup:
            - "Base WO-1-style flow: 10 parts forged, trimmed (430.00 net), PRODUCED with cert PENDING"
            - "All 10 parts INSPECTED and SHIPPED; provisional invoice created"
          setup_api_calls:
            - { call: "POST /alloy-specs", payload: { grade_code: "AISI-4140", name: "CrMo Steel", forge_temp_min_f: 2100, forge_temp_max_f: 2300, reheat_limit: 2, flash_allowance_pct: 12.0, strokes_per_part: 3, flow_stress_ksi: 8.0, carbon_max_pct: 0.43, manganese_max_pct: 1.10, grain_flow_min_rating: 5, macro_etch_required: true }, as: PlantManager, captures: { alloy_id: "$.data.id" } }
            - { call: "POST /surcharge-indices", payload: { alloy_spec_id: "${alloy_id}", effective_month: "2026-08", surcharge_cents_per_ton: 250000, energy_pct: 0.10 }, as: PlantManager, captures: { sur_id: "$.data.id" } }
