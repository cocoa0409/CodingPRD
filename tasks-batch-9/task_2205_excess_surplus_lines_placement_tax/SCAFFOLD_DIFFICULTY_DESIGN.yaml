  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: placement_revision_cycle_is_re_enterable_and_resets_the_declination_count
        grounds:
          - state_machines.Placement.SEARCH_COMPLETE_to_CHANGES_REQUESTED
          - state_machines.Placement.CHANGES_REQUESTED_to_SEARCH_IN_PROGRESS
          - entities.Placement.fields.declination_count
          - complexity_profile.state_machine_shape
        distinguishing_aspect: |
          Placement is the cyclic machine: SEARCH_COMPLETE → CHANGES_REQUESTED →
          SEARCH_IN_PROGRESS → SEARCH_COMPLETE, and the loop can be entered any
          number of times. Each entry into CHANGES_REQUESTED zeroes
          declination_count, and each return to SEARCH_COMPLETE recomputes it from
          the surviving Declination set rather than restoring the previous number —
          so the count after the second lap is 4, not 3 and not 0. An implementer
          who treats SEARCH_COMPLETE as terminal, or who caches declination_count
          instead of recomputing it, fails.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "One brokerage; StateProgram TX with diligent_search_min_declinations 3, plus StateProgram NV and CA so the exposure schedule resolves."
            - "One placement with principal_place_of_business_state TX and three valid TX declinations, already advanced to SEARCH_COMPLETE (declination_count 3). No policy has been issued on it."
          setup_api_calls:
            - *c_clock
            - *c_broker
            - *c_lic_tx
            - *c_prog_tx
            - *c_prog_nv
            - *c_prog_ca
            - *c_placement
            - *c_begin_search
            - *c_decl_1
            - *c_decl_2
            - *c_decl_3
            - *c_complete_search
          trigger:
            - &c_request_changes
              call: "POST /placements/${placement_id}/request-changes"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-anders"
            - *c_begin_search
            - call: "POST /placements/${placement_id}/declinations"
              payload: { admitted_carrier_name: "Brazos Admitted Indemnity", state_code: "TX", reason_code: "NO_APPETITE", declined_on: "2026-07-20T00:00:00Z" }
              as: PlacementBroker
              as_user_id: "${broker_id}"
            - *c_complete_search
            - *c_request_changes
            - *c_begin_search
            - *c_complete_search
          assert:
            - "after the first complete-search in setup, Placement.${placement_id}.status == SEARCH_COMPLETE and declination_count == 3"
            - "after the first request-changes, Placement.${placement_id}.status == CHANGES_REQUESTED and declination_count == 0"
            - "after the second begin-search, Placement.${placement_id}.status == SEARCH_IN_PROGRESS and declination_count == 0"
            - "after the second complete-search, Placement.${placement_id}.status == SEARCH_COMPLETE and declination_count == 4"
            - "after the second request-changes, Placement.${placement_id}.status == CHANGES_REQUESTED and declination_count == 0"
            - "after the third complete-search, Placement.${placement_id}.status == SEARCH_COMPLETE and declination_count == 4"
            - "GET /placements/${placement_id}/declinations returns 4 rows, all status RECORDED"
            - "Placement.${placement_id}.version increases by exactly 1 on each of the 7 transition calls in this recipe's trigger list"

      - name: market_security_review_branches_decline_and_condition_carry_different_side_effect_sets
        grounds:
          - state_machines.MarketSecurityReview.UNDER_REVIEW_to_DECLINED
          - state_machines.MarketSecurityReview.UNDER_REVIEW_to_CONDITIONAL
          - entities.MarketSecurityReview.fields.conditions_note
          - entities.Carrier.fields.security_status
          - errors.ERR_CONDITIONS_NOTE_REQUIRED
        distinguishing_aspect: |
          MarketSecurityReview is the branching machine on a different entity from
          the cyclic Placement: UNDER_REVIEW forks to APPROVED, CONDITIONAL or
          DECLINED, and the branches do not share a side-effect set. The DECLINED
          branch strips every white-list row the carrier holds; the CONDITIONAL
          branch touches no eligibility row at all but refuses to fire without a
          conditions_note. Which branch is legal is not the caller's choice — it is
          pinned by the score band, so DECLINE on a 65-score review is rejected.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "StateProgram TX and StateProgram CA exist."
            - "Carrier Meridian: US_STATE domicile, capital_surplus_cents 1600000000, am_best_rating NR, naic_quarterly_listing false — INITIAL_REVIEW score 45, DECLINE band."
            - "Meridian is WHITE_LISTED in both TX and CA."
            - "Carrier Trident: ALIEN domicile, capital_surplus_cents 1500000000, am_best_rating A, trust_fund_cents 539999999, naic_quarterly_listing true — INITIAL_REVIEW score 65, CONDITION band."
            - "Both carriers have a review already advanced to UNDER_REVIEW."
          setup_api_calls:
            - *c_clock
            - *c_prog_tx
            - *c_prog_ca
            - call: "POST /carriers"
              payload: { naic_number: "22222", legal_name: "Meridian Surplus Indemnity Company", domicile_type: "US_STATE", capital_surplus_cents: 1600000000, am_best_rating: "NR", trust_fund_cents: 0, naic_quarterly_listing: false }
              as: PlatformAdmin
              captures: { meridian_id: $.data.id, meridian_v0: $.data.version }
            - call: "POST /carriers"
              payload: { naic_number: "33333", legal_name: "Trident Alien Reinsurance Ltd", domicile_type: "ALIEN", capital_surplus_cents: 1500000000, am_best_rating: "A", trust_fund_cents: 539999999, naic_quarterly_listing: true }
              as: PlatformAdmin
              captures: { trident_id: $.data.id, trident_v0: $.data.version }
            - call: "POST /carrier-eligibilities"
              payload: { carrier_id: "${meridian_id}", state_program_id: "${tx_program_id}", listed_on: "2026-01-01T00:00:00Z" }
              as: StateRegulator
              as_user_id: "sr-tx"
              captures: { meridian_elig_tx_id: $.data.id }
            - call: "POST /carrier-eligibilities"
              payload: { carrier_id: "${meridian_id}", state_program_id: "${ca_program_id}", listed_on: "2026-01-01T00:00:00Z" }
              as: StateRegulator
              as_user_id: "sr-ca"
              captures: { meridian_elig_ca_id: $.data.id }
            - call: "POST /carriers/${meridian_id}/security-reviews"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-anders"
              captures: { meridian_review_id: $.data.id }
            - call: "POST /market-security-reviews/${meridian_review_id}/start"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-anders"
            - call: "POST /carriers/${trident_id}/security-reviews"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-anders"
              captures: { trident_review_id: $.data.id }
            - call: "POST /market-security-reviews/${trident_review_id}/start"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-anders"
          trigger:
            - call: "POST /market-security-reviews/${meridian_review_id}/decide"
              payload: { decision: "DECLINE", expected_carrier_version: "${meridian_v0}" }
              as: ComplianceOfficer
              as_user_id: "co-anders"
            - call: "POST /market-security-reviews/${trident_review_id}/decide"
              payload: { decision: "CONDITION", expected_carrier_version: "${trident_v0}", conditions_note: "Trust fund is 1 cent short of the alien minimum; bind only with quarterly attestation." }
              as: ComplianceOfficer
              as_user_id: "co-anders"
          assert:
            - "MarketSecurityReview.${meridian_review_id}.score == 45"
            - "MarketSecurityReview.${trident_review_id}.score == 65"
            - "MarketSecurityReview.${meridian_review_id}.status == DECLINED and Carrier.${meridian_id}.security_status == DECLINED"
            - "MarketSecurityReview.${trident_review_id}.status == CONDITIONAL and Carrier.${trident_id}.security_status == CONDITIONAL"
            - "MarketSecurityReview.${trident_review_id}.conditions_note equals the supplied note string"
            - "MarketSecurityReview.${meridian_review_id}.conditions_note is null"
            - "CarrierEligibility.${meridian_elig_tx_id}.listing_status == REMOVED and removed_on == 2026-08-01T00:00:00Z"
            - "CarrierEligibility.${meridian_elig_ca_id}.listing_status == REMOVED and removed_on == 2026-08-01T00:00:00Z"
            - "GET /carrier-eligibilities?carrier_id=${trident_id} returns 0 rows, confirming the CONDITIONAL branch touched no white-list row"
            - "POST /market-security-reviews/${trident_review_id}/decide replayed with decision DECLINE would have returned ERR_DECISION_SCORE_MISMATCH (422) because 65 is not below 50"
            - "POST /market-security-reviews/${trident_review_id}/decide with decision CONDITION and conditions_note omitted returns ERR_CONDITIONS_NOTE_REQUIRED (422)"

      - name: policy_four_state_dimensions_advance_independently_on_one_row
        grounds:
          - state_machines.Policy.status
          - state_machines.Policy.compliance_status
          - state_machines.Policy.tax_status
          - state_machines.Policy.stamping_status
          - complexity_profile.state_machine_shape
        distinguishing_aspect: |
          Policy carries four parallel state dimensions on the same row, and the
          scaffold's transition table lets each move on its own schedule: affixing
          notices advances compliance_status while leaving tax_status UNCALCULATED,
          calculating tax advances tax_status while leaving stamping_status PENDING,
          and a REJECT stamping decision drives two dimensions at once
          (stamping_status → REJECTED and compliance_status → DEFICIENT). The
          dimension-crossing effect is the trap: an implementer who models Policy as
          a single status enum cannot express NOTICES_AFFIXED × CALCULATED × PENDING,
          and one who models four fully independent enums misses the REJECT
          cross-write.
        test_recipe:
          setup:
            - "The base TX-home setup with one ISSUED policy whose tax has NOT been calculated yet."
            - "StateProgram TX requires notice codes TX-SL-1 and TX-SL-2 and has stamping_office_required true."
          setup_api_calls:
            - *c_clock
            - *c_broker
            - *c_lic_tx
            - *c_prog_tx
            - *c_prog_nv
            - *c_prog_ca
            - *c_carrier
            - *c_review_new
            - *c_review_start
            - *c_review_approve
            - *c_elig_tx
            - *c_placement
            - *c_begin_search
            - *c_decl_1
            - *c_decl_2
            - *c_decl_3
            - *c_complete_search
            - *c_policy
          trigger:
            - &c_affix_notices
              call: "POST /policies/${policy_id}/affix-notices"
              payload: { notice_codes: ["TX-SL-2", "TX-SL-1", "TX-SL-2"] }
              as: PlacementBroker
              as_user_id: "${broker_id}"
            - *c_calc_tax
            - &c_submit_stamping
              call: "POST /policies/${policy_id}/submit-stamping"
              payload: {}
              as: TaxFiler
              as_user_id: "tf-nina"
            - call: "POST /policies/${policy_id}/stamping-decision"
              payload: { decision: "REJECT", rejection_reason: "Stamping office could not match the filed diligent search record." }
              as: StateRegulator
              as_user_id: "sr-tx"
          assert:
            - "immediately after issuance: Policy.${policy_id}.status == ISSUED, compliance_status == PENDING_NOTICES, tax_status == UNCALCULATED, stamping_status == PENDING"
            - "after affix-notices: compliance_status == NOTICES_AFFIXED while tax_status is still UNCALCULATED and stamping_status is still PENDING"
            - "after affix-notices: Policy.${policy_id}.notice_codes_affixed == [\"TX-SL-1\", \"TX-SL-2\"] — de-duplicated and sorted ASCII ascending"
            - "after calculate-tax: tax_status == CALCULATED while compliance_status is still NOTICES_AFFIXED and stamping_status is still PENDING"
            - "after submit-stamping: stamping_status == SUBMITTED, stamping_submitted_at == 2026-08-01T00:00:00Z, status still ISSUED"
            - "after the REJECT stamping decision: stamping_status == REJECTED AND compliance_status == DEFICIENT in the same response"
            - "after the REJECT stamping decision: Policy.${policy_id}.status is still ISSUED and tax_status is still CALCULATED"
            - "POST /policies/${policy_id}/submit-stamping issued before affix-notices returns ERR_NOTICES_NOT_AFFIXED (409)"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:

      - name: endorsement_issue_cascades_four_hops_to_new_tax_filing_lines
        grounds:
          - state_machines.Endorsement.DRAFT_to_ISSUED
          - entities.PolicyStateAllocation.fields.allocated_premium_cents
          - entities.TaxFilingLine.fields.source_endorsement_id
          - entities.TaxFilingLine.fields.line_type
          - complexity_layers.cascading_side_effects
        distinguishing_aspect: |
          Depth 4, and each hop is caused by the previous one rather than by the
          original request: hop 1 flips Endorsement.status to ISSUED; because the
          ISSUED set changed, hop 2 recomputes Policy.gross_premium_cents and
          taxable_premium_cents; because the taxable premium changed, hop 3
          redistributes every PolicyStateAllocation row and refreshes the policy
          totals; because the per-state tax and stamping figures changed, hop 4
          emits one ENDORSEMENT TaxFilingLine per state whose numbers moved. Skipping
          hop 3 leaves hop 4 with nothing to report, so the failure is visible as
          zero new filing lines rather than as a wrong number.
        test_recipe:
          setup:
            - "The base TX-home setup with tax CALCULATED: taxable_premium_cents 1025000, total_tax_cents 38779, total_stamping_fee_cents 1127, three OPEN NEW_BUSINESS filing lines."
            - "One DRAFT endorsement of endorsement_type PREMIUM_INCREASE with premium_delta_cents 200000."
          setup_api_calls:
            - *c_clock
            - *c_broker
            - *c_lic_tx
            - *c_prog_tx
            - *c_prog_nv
            - *c_prog_ca
            - *c_carrier
            - *c_review_new
            - *c_review_start
            - *c_review_approve
            - *c_elig_tx
            - *c_placement
            - *c_begin_search
            - *c_decl_1
            - *c_decl_2
            - *c_decl_3
            - *c_complete_search
            - *c_policy
            - *c_calc_tax
            - *c_get_policy_v
            - *c_endorsement_plus
          trigger:
            - *c_endorsement_issue
          assert:
            - "hop 1 — Endorsement.${endorsement_id}.status == ISSUED"
            - "hop 2 — Policy.${policy_id}.gross_premium_cents == 1200000 and taxable_premium_cents == 1225000"
            - "hop 3 — GET /policies/${policy_id}/allocations still returns exactly 3 rows (recomputed in place, not appended) with allocated_premium_cents 408334 / 408333 / 408333 for CA / NV / TX summing to 1225000"
            - "hop 3 — Policy.${policy_id}.total_tax_cents == 46346 and total_stamping_fee_cents == 1347"
            - "hop 4 — GET /tax-filing-lines?source_endorsement_id=${endorsement_id} returns exactly 3 rows, line_type ENDORSEMENT, status OPEN, in state_code ASC order CA, NV, TX"
            - "hop 4 — those three rows carry tax_cents 2000 / 2334 / 3233 and stamping_fee_cents 120 / 0 / 100"
            - "GET /tax-filing-lines?policy_id=${policy_id} returns 6 rows in total: 3 NEW_BUSINESS plus 3 ENDORSEMENT"
            - "Policy.${policy_id}.tax_status == ADJUSTED"

      - name: security_decline_cascades_three_hops_to_white_list_removal
        grounds:
          - state_machines.MarketSecurityReview.UNDER_REVIEW_to_DECLINED
          - entities.Carrier.fields.security_status
          - entities.CarrierEligibility.fields.listing_status
          - entities.CarrierEligibility.fields.removed_on
          - complexity_layers.cascading_side_effects
        distinguishing_aspect: |
          A different originating transition from the endorsement cascade, and depth
          3: hop 1 writes MarketSecurityReview.status DECLINED; because the review
          declined, hop 2 writes Carrier.security_status DECLINED; because the
          carrier is now declined, hop 3 strips every WHITE_LISTED eligibility row
          it holds. Hop 3 is conditional — a row already in REMOVED must keep the
          removed_on it was given when it was struck by hand, so an implementer who
          blanket-overwrites removed_on on all rows fails, and one who applies hop 3
          directly off the request instead of off hop 2 cannot explain why a
          CONDITION decision leaves the rows alone.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "StateProgram TX, NV and CA exist."
            - "Carrier Meridian: US_STATE, capital_surplus_cents 1600000000, am_best_rating NR, naic_quarterly_listing false — INITIAL_REVIEW score 45."
            - "Meridian holds three eligibility rows: TX and CA still WHITE_LISTED, and NV already struck by hand with removed_on 2026-06-15T00:00:00Z."
            - "A review on Meridian already advanced to UNDER_REVIEW."
          setup_api_calls:
            - *c_clock
            - *c_prog_tx
            - *c_prog_nv
            - *c_prog_ca
            - call: "POST /carriers"
              payload: { naic_number: "22222", legal_name: "Meridian Surplus Indemnity Company", domicile_type: "US_STATE", capital_surplus_cents: 1600000000, am_best_rating: "NR", trust_fund_cents: 0, naic_quarterly_listing: false }
              as: PlatformAdmin
              captures: { meridian_id: $.data.id, meridian_v0: $.data.version }
            - call: "POST /carrier-eligibilities"
              payload: { carrier_id: "${meridian_id}", state_program_id: "${tx_program_id}", listed_on: "2026-01-01T00:00:00Z" }
              as: StateRegulator
              as_user_id: "sr-tx"
              captures: { meridian_elig_tx_id: $.data.id }
            - call: "POST /carrier-eligibilities"
              payload: { carrier_id: "${meridian_id}", state_program_id: "${ca_program_id}", listed_on: "2026-01-01T00:00:00Z" }
              as: StateRegulator
              as_user_id: "sr-ca"
              captures: { meridian_elig_ca_id: $.data.id }
            - call: "POST /carrier-eligibilities"
              payload: { carrier_id: "${meridian_id}", state_program_id: "${nv_program_id}", listed_on: "2026-01-01T00:00:00Z" }
              as: StateRegulator
              as_user_id: "sr-nv"
              captures: { meridian_elig_nv_id: $.data.id }
            - call: "POST /carrier-eligibilities/${meridian_elig_nv_id}/remove"
              payload: { removed_on: "2026-06-15T00:00:00Z" }
              as: StateRegulator
              as_user_id: "sr-nv"
            - call: "POST /carriers/${meridian_id}/security-reviews"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-anders"
              captures: { meridian_review_id: $.data.id }
            - call: "POST /market-security-reviews/${meridian_review_id}/start"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-anders"
          trigger:
            - call: "POST /market-security-reviews/${meridian_review_id}/decide"
              payload: { decision: "DECLINE", expected_carrier_version: "${meridian_v0}" }
              as: ComplianceOfficer
              as_user_id: "co-anders"
          assert:
            - "hop 1 — MarketSecurityReview.${meridian_review_id}.status == DECLINED, score == 45, rating_at_review == NR, capital_surplus_at_review_cents == 1600000000"
            - "hop 2 — Carrier.${meridian_id}.security_status == DECLINED"
            - "hop 3 — CarrierEligibility.${meridian_elig_ca_id}.listing_status == REMOVED with removed_on == 2026-08-01T00:00:00Z"
            - "hop 3 — CarrierEligibility.${meridian_elig_tx_id}.listing_status == REMOVED with removed_on == 2026-08-01T00:00:00Z"
            - "hop 3 is conditional — CarrierEligibility.${meridian_elig_nv_id} keeps removed_on == 2026-06-15T00:00:00Z, unchanged by the cascade"
            - "GET /carrier-eligibilities?carrier_id=${meridian_id}&listing_status=WHITE_LISTED returns 0 rows"
            - "GET /carrier-eligibilities?carrier_id=${meridian_id}&listing_status=REMOVED returns 3 rows"

  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:

      - name: policy_issue_state_check_pre_empts_carrier_referential_checks
        grounds:
          - validations.priority_9_state
          - validations.priority_12_business_referential
          - validations.priority_13_business_referential
          - errors.ERR_PLACEMENT_NOT_BINDABLE
          - errors.ERR_CARRIER_NOT_SECURITY_APPROVED
        distinguishing_aspect: |
          Category pair `state` (priority 9) versus `business_referential`
          (priorities 12 and 13). A single POST /policies violates three rules at
          once — the placement is still DRAFT, the carrier has never been security
          reviewed, and it holds no white-list row — and the ordered chain must
          surface ERR_PLACEMENT_NOT_BINDABLE, not the carrier errors. The contrast
          call proves the ordering is real rather than accidental: once only the
          placement defect is repaired, the very same request returns
          ERR_CARRIER_NOT_SECURITY_APPROVED.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "One brokerage with an ACTIVE SURPLUS_LINES TX license."
            - "StateProgram TX, NV and CA exist."
            - "Carrier Atlas exists but has never been security reviewed (security_status PENDING) and holds no CarrierEligibility row."
            - "A placement owned by that broker, still in DRAFT — begin-search has never been called."
          setup_api_calls:
            - *c_clock
            - *c_broker
            - *c_lic_tx
            - *c_prog_tx
            - *c_prog_nv
            - *c_prog_ca
            - *c_carrier
            - call: "POST /placements"
              payload: { insured_name: "Gulf Fabricators LLC", principal_place_of_business_state: "TX", coverage_class: "PROPERTY", is_export_list_risk: false, state_exposures: [{ state_code: "TX", insured_value_cents: 300000000 }, { state_code: "NV", insured_value_cents: 300000000 }, { state_code: "CA", insured_value_cents: 300000000 }] }
              as: PlacementBroker
              as_user_id: "${broker_id}"
              captures: { placement_id: $.data.id, placement_v: $.data.version }
          trigger:
            - call: "POST /policies"
              payload: { placement_id: "${placement_id}", carrier_id: "${carrier_id}", policy_number: "SL-2026-0001", effective_date: "2026-08-01T00:00:00Z", expiration_date: "2027-08-01T00:00:00Z", original_gross_premium_cents: 1000000, policy_fee_cents: 25000, broker_fee_cents: 50000, min_earned_premium_pct: 0.25, expected_placement_version: "${placement_v}" }
              as: PlacementBroker
              as_user_id: "${broker_id}"
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 409 and error_id == ERR_PLACEMENT_NOT_BINDABLE"
            - "error_id != ERR_CARRIER_NOT_SECURITY_APPROVED"
            - "error_id != ERR_CARRIER_NOT_WHITE_LISTED"
            - "no Policy was created: GET /policies?placement_id=${placement_id} returns 0 rows"
            - "Placement.${placement_id}.status is still DRAFT and its version is unchanged"
            - "contrast — after begin-search, three valid TX declinations and complete-search, the identical POST /policies (with the refreshed expected_placement_version) returns 409 ERR_CARRIER_NOT_SECURITY_APPROVED"

      - name: batch_remit_segregation_of_duties_pre_empts_amount_mismatch
        grounds:
          - validations.priority_10_business_safety
          - validations.priority_17_business_fiscal
          - errors.ERR_SEGREGATION_OF_DUTIES
          - errors.ERR_REMITTANCE_AMOUNT_MISMATCH
          - state_machines.FilingBatch.SUBMITTED_to_REMITTED
        distinguishing_aspect: |
          A different category pair from the state-versus-referential conflict:
          `business_safety` (priority 10) versus `business_fiscal` (priority 17). One
          remit request breaks both rules — the same tax filer who prepared the batch
          is remitting it, and the amount is wrong — and the ordered chain must
          report ERR_SEGREGATION_OF_DUTIES. The two-step contrast pins the ordering:
          switching to a second filer with the same wrong amount then produces
          ERR_REMITTANCE_AMOUNT_MISMATCH, and only the correct amount remits.
        test_recipe:
          setup:
            - "The base TX-home setup with tax CALCULATED, giving three OPEN NEW_BUSINESS filing lines with period_key 2026-08 (TX files MONTHLY)."
            - "A FilingBatch on the TX program for that broker with period_key 2026-08, prepared by tax filer tf-nina and then submitted, so it is SUBMITTED with prepared_by_user_id tf-nina, line_count 1, total_tax_cents 16571, total_stamping_fee_cents 512, late false, penalty_cents 0 and total_due_cents 17083."
          setup_api_calls:
            - *c_clock
            - *c_broker
            - *c_lic_tx
            - *c_prog_tx
            - *c_prog_nv
            - *c_prog_ca
            - *c_carrier
            - *c_review_new
            - *c_review_start
            - *c_review_approve
            - *c_elig_tx
            - *c_placement
            - *c_begin_search
            - *c_decl_1
            - *c_decl_2
            - *c_decl_3
            - *c_complete_search
            - *c_policy
            - *c_calc_tax
            - &c_batch_tx
              call: "POST /filing-batches"
              payload: { state_program_id: "${tx_program_id}", broker_id: "${broker_id}", period_key: "2026-08" }
              as: TaxFiler
              as_user_id: "tf-nina"
              captures: { batch_id: $.data.id }
            - &c_batch_prepare
              call: "POST /filing-batches/${batch_id}/prepare"
              payload: {}
              as: TaxFiler
              as_user_id: "tf-nina"
            - &c_batch_submit
              call: "POST /filing-batches/${batch_id}/submit"
              payload: {}
              as: TaxFiler
              as_user_id: "tf-nina"
          trigger:
            - call: "POST /filing-batches/${batch_id}/remit"
              payload: { remitted_amount_cents: 99999 }
              as: TaxFiler
              as_user_id: "tf-nina"
              captures: { error_id: $.data.error_id }
          assert:
            - "FilingBatch.${batch_id}.prepared_by_user_id == tf-nina, line_count == 1, total_tax_cents == 16571, total_stamping_fee_cents == 512, due_date == 2026-09-30T23:59:59.999Z, late == false, penalty_cents == 0, total_due_cents == 17083"
            - "the response status is 409 and error_id == ERR_SEGREGATION_OF_DUTIES"
            - "error_id != ERR_REMITTANCE_AMOUNT_MISMATCH"
            - "FilingBatch.${batch_id}.status is still SUBMITTED and remitted_by_user_id is null"
            - "contrast — POST /filing-batches/${batch_id}/remit as TaxFiler tf-owen with remitted_amount_cents 99999 returns 422 ERR_REMITTANCE_AMOUNT_MISMATCH"
            - "contrast — POST /filing-batches/${batch_id}/remit as TaxFiler tf-owen with remitted_amount_cents 17083 succeeds, sets status REMITTED and remitted_by_user_id tf-owen"

      - name: policy_issue_stale_version_pre_empts_state_check
        grounds:
          - validations.priority_8_concurrency
          - validations.priority_9_state
          - concurrency_rules.policy-create-stale-placement
          - errors.ERR_STALE_PLACEMENT_VERSION
        distinguishing_aspect: |
          A third category pair — `concurrency` (priority 8) versus `state`
          (priority 9) — reached by capturing the placement's version while it is
          still DRAFT and then advancing it with begin-search. The request now
          carries a stale expected_placement_version AND targets a placement in
          SEARCH_IN_PROGRESS, from which POST /policies is not declared. The OCC
          check runs first, so the answer is ERR_STALE_PLACEMENT_VERSION (412) and
          never ERR_PLACEMENT_NOT_BINDABLE (409).
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; brokerage with an ACTIVE TX SURPLUS_LINES license; StateProgram TX, NV and CA; an APPROVED carrier white-listed in TX."
            - "A placement whose version is captured while it is still DRAFT, then advanced to SEARCH_IN_PROGRESS by begin-search so that the captured version is stale."
          setup_api_calls:
            - *c_clock
            - *c_broker
            - *c_lic_tx
            - *c_prog_tx
            - *c_prog_nv
            - *c_prog_ca
            - *c_carrier
            - *c_review_new
            - *c_review_start
            - *c_review_approve
            - *c_elig_tx
            - call: "POST /placements"
              payload: { insured_name: "Gulf Fabricators LLC", principal_place_of_business_state: "TX", coverage_class: "PROPERTY", is_export_list_risk: false, state_exposures: [{ state_code: "TX", insured_value_cents: 300000000 }, { state_code: "NV", insured_value_cents: 300000000 }, { state_code: "CA", insured_value_cents: 300000000 }] }
              as: PlacementBroker
              as_user_id: "${broker_id}"
              captures: { placement_id: $.data.id, stale_placement_v: $.data.version }
            - *c_begin_search
          trigger:
            - call: "POST /policies"
              payload: { placement_id: "${placement_id}", carrier_id: "${carrier_id}", policy_number: "SL-2026-0001", effective_date: "2026-08-01T00:00:00Z", expiration_date: "2027-08-01T00:00:00Z", original_gross_premium_cents: 1000000, policy_fee_cents: 25000, broker_fee_cents: 50000, min_earned_premium_pct: 0.25, expected_placement_version: "${stale_placement_v}" }
              as: PlacementBroker
              as_user_id: "${broker_id}"
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 412 and error_id == ERR_STALE_PLACEMENT_VERSION"
            - "error_id != ERR_PLACEMENT_NOT_BINDABLE"
            - "no Policy was created: GET /policies?placement_id=${placement_id} returns 0 rows"
            - "Placement.${placement_id}.status is still SEARCH_IN_PROGRESS"

  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:

      - name: home_state_ignores_a_zero_value_principal_place_of_business_row
        grounds:
          - calculations.home_state_determination
          - entities.Placement.fields.home_state
          - entities.Placement.fields.total_insured_value_cents
          - errors.ERR_HOME_STATE_INDETERMINATE
        distinguishing_aspect: |
          The strict `> 0` test on the principal-place-of-business exposure row,
          exercised on POST /placements. With NV named as the principal place of
          business but carrying insured_value_cents 0, the waterfall falls through to
          the greatest-value rule, where TX and CA tie at 500000000 and the
          alphabetically smallest code wins — so home_state is CA, not NV and not TX.
          One cent of NV exposure flips the answer back to NV, and a schedule of all
          zeros (or an empty schedule) is indeterminate rather than defaulting to the
          principal place of business.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "One brokerage. No StateProgram rows are needed because home-state determination runs at placement creation."
          setup_api_calls:
            - *c_clock
            - *c_broker
          trigger:
            - call: "POST /placements"
              payload: { insured_name: "Basin Logistics Zero LLC", principal_place_of_business_state: "NV", coverage_class: "CASUALTY", is_export_list_risk: false, state_exposures: [{ state_code: "NV", insured_value_cents: 0 }, { state_code: "TX", insured_value_cents: 500000000 }, { state_code: "CA", insured_value_cents: 500000000 }] }
              as: PlacementBroker
              as_user_id: "${broker_id}"
              captures: { placement_zero_id: $.data.id }
            - call: "POST /placements"
              payload: { insured_name: "Basin Logistics One Cent LLC", principal_place_of_business_state: "NV", coverage_class: "CASUALTY", is_export_list_risk: false, state_exposures: [{ state_code: "NV", insured_value_cents: 1 }, { state_code: "TX", insured_value_cents: 500000000 }, { state_code: "CA", insured_value_cents: 500000000 }] }
              as: PlacementBroker
              as_user_id: "${broker_id}"
              captures: { placement_onecent_id: $.data.id }
            - call: "POST /placements"
              payload: { insured_name: "Basin Logistics All Zero LLC", principal_place_of_business_state: "NV", coverage_class: "CASUALTY", is_export_list_risk: false, state_exposures: [{ state_code: "NV", insured_value_cents: 0 }, { state_code: "TX", insured_value_cents: 0 }] }
              as: PlacementBroker
              as_user_id: "${broker_id}"
              captures: { error_id_allzero: $.data.error_id }
            - call: "POST /placements"
              payload: { insured_name: "Basin Logistics Empty LLC", principal_place_of_business_state: "NV", coverage_class: "CASUALTY", is_export_list_risk: false, state_exposures: [] }
              as: PlacementBroker
              as_user_id: "${broker_id}"
              captures: { error_id_empty: $.data.error_id }
          assert:
            - "Placement.${placement_zero_id}.home_state == CA"
            - "Placement.${placement_zero_id}.home_state != NV"
            - "Placement.${placement_zero_id}.home_state != TX"
            - "Placement.${placement_zero_id}.total_insured_value_cents == 1000000000"
            - "Placement.${placement_onecent_id}.home_state == NV"
            - "Placement.${placement_onecent_id}.total_insured_value_cents == 1000000001"
            - "the all-zero request returns 422 and error_id_allzero == ERR_HOME_STATE_INDETERMINATE"
            - "the empty-schedule request returns 422 and error_id_empty == ERR_HOME_STATE_INDETERMINATE"
            - "Placement.${placement_zero_id}.status == DRAFT and declination_count == 0"

      - name: diligent_search_lookback_cutoff_is_inclusive_at_ninety_days
        grounds:
          - calculations.diligent_search_sufficiency
          - calculations.diligent_search_sufficiency.constants.DILIGENT_SEARCH_LOOKBACK_DAYS
          - entities.Declination.fields.declined_on
          - errors.ERR_DILIGENT_SEARCH_INSUFFICIENT
        distinguishing_aspect: |
          A different metric on a different endpoint: the 90-day declination lookback
          evaluated by POST /placements/{id}/complete-search. With the clock at
          2026-08-01 the cutoff is 2026-05-03, and the comparison is `>=` — a
          declination dated exactly 2026-05-03 counts, one dated 2026-05-02 does not.
          Three declinations on the cutoff satisfy TX's minimum of 3; three one day
          earlier yield a count of zero; and a two-on / one-off mix yields 2, which
          is still insufficient. An implementer using `>` fails the first case, and
          one using a 90-day month approximation fails all three.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z, so the diligent-search cutoff is 2026-05-03T00:00:00Z."
            - "StateProgram TX with diligent_search_min_declinations 3 (plus NV and CA so other recipes' schedules resolve)."
            - "Three placements owned by the same broker, all with principal_place_of_business_state TX and a TX-only exposure schedule, all advanced to SEARCH_IN_PROGRESS: placement ON has three TX declinations dated exactly 2026-05-03, placement OFF has three dated 2026-05-02, placement MIX has two dated 2026-05-03 and one dated 2026-05-02."
