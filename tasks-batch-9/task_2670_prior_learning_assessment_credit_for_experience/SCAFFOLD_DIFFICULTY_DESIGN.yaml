              captures: { oc203: "$.data[0].id" }
            - call: "POST /courses"
              payload: { course_code: "CS204", title: "Networks", department_code: "CS", credits: 4, level: "LOWER", pla_eligible: true, learning_outcomes: [{ outcome_code: "OC1", description: "Operate", weight_bp: 10000, mastery_threshold_bp: 7000 }] }
              as: PlaCoordinator
              captures: { c204_id: "$.data.id" }
            - call: "GET /learning-outcomes?course_id=${c204_id}"
              as: PlaCoordinator
              captures: { oc204: "$.data[0].id" }
            - call: "POST /courses"
              payload: { course_code: "CS205", title: "Cloud Operations", department_code: "CS", credits: 3, level: "LOWER", pla_eligible: true, learning_outcomes: [{ outcome_code: "OC1", description: "Deploy", weight_bp: 10000, mastery_threshold_bp: 7000 }] }
              as: PlaCoordinator
              captures: { c205_id: "$.data.id" }
            - call: "GET /learning-outcomes?course_id=${c205_id}"
              as: PlaCoordinator
              captures: { oc205: "$.data[0].id" }
            - call: "POST /students"
              payload: { student_number: "S-1001", full_name: "Ada Reyes", program_id: "${prog_id}", enrollment_status: "MATRICULATED", transfer_credits_accepted: 0, institutional_credits_earned: 60 }
              as: PlaCoordinator
              captures: { stu_id: "$.data.id" }
            - call: "POST /pla-claims"
              payload: { student_id: "${stu_id}", course_id: "${c203_id}", source_type: "PORTFOLIO", credits_requested: 3, rush_requested: false }
              as: Student
              as_user_id: "${stu_id}"
