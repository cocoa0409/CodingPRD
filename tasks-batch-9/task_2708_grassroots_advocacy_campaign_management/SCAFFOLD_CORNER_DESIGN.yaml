              as_user_id: "u_dir_1"
            - call: "POST /advocacy/campaigns/${camp_id}/close"
              payload: {}
              as: CampaignDirector
              as_user_id: "u_dir_1"
              captures: { ver_after_close: $.data.version }
          trigger:
            - call: "POST /advocacy/campaigns/${camp_id}/close"
              payload: {}
              as: CampaignDirector
              as_user_id: "u_dir_1"
            - call: "POST /advocacy/campaigns/${camp_id}/launch"
              payload: {}
              as: CampaignDirector
              as_user_id: "u_dir_1"
            - call: "POST /advocacy/supporters"
