    roles: [FieldCrew]
    code: 200
    input: []
    output: CodeViolation
    side_effects: []

  - method: POST
    path: "/preservation/code-violations/{violationId}/verify"
    description: "Municipal verification closes the violation (terminal)"
    roles: [VendorAdmin]
    code: 200
    input: []
    output: CodeViolation
    side_effects: ["accrued fine frozen; posture recomputed"]

  - method: POST
    path: "/preservation/code-violations/{violationId}/reject-cure"
    description: "Municipality rejected the cure; back to CURE_IN_PROGRESS"
    roles: [VendorAdmin]
    code: 200
    input: ["reason"]
    output: CodeViolation
    side_effects: []

  # --- MunicipalRegistration ---
  - method: POST
    path: "/preservation/registrations"
