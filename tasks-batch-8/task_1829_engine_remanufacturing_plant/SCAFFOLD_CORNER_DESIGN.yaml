  # =================================================================
  # Section: calculations
  # =================================================================
  - section: calculations
    instances:
      - name: aging_run_sweeps_only_expired_held_deposits
        claim_type: input_set_filtering
        grounds: [calculations.deposit_refund_calculation, state_machines.CoreDeposit.HELD_to_FORFEITED]
        distinguishing_aspect: "The aging sweep's input set is exactly HELD deposits older than 90 days: a 92-day HELD deposit is forfeited while a 32-day HELD deposit on the same distributor is untouched."
        test_recipe:
          setup:
            - "Distributor D-Z bought engine E-OLD at 2026-08-01 (deposit DEP-OLD, 200000) and engine E-YOUNG at 2026-09-30 (deposit DEP-YOUNG, 200000)"
            - "Logical clock at 2026-11-01: DEP-OLD age 92 days, DEP-YOUNG age 32 days"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlantAdmin
            - call: "POST /distributors"
              payload: { distributor_code: "D-SRC6", name: "Core Source 6", emissions_requirement: "FEDERAL", credit_limit_cents: 1000000, volume_discount_pct: 0.0 }
              as: PlantAdmin
              captures: { dcore: $.data.id }
            - call: "POST /distributors"
              payload: { distributor_code: "D-Z", name: "Sweep Buyer", emissions_requirement: "FEDERAL", credit_limit_cents: 2000000, volume_discount_pct: 0.0 }
              as: PlantAdmin
              captures: { dz: $.data.id }
            - call: "POST /build-specs"
              payload: { engine_family: "SBC-350", application_code: "C1500-1994", emissions_tier: "FEDERAL", list_price_cents: 250000, core_deposit_cents: 200000, core_base_credit_cents: 100000, allowed_reuse_grades: ["REUSE_OK"], allowed_interchange_groups: ["CRANK-SBC-3.48"], dyno_min_horsepower: 300, dyno_min_oil_pressure_psi: 20.0, dyno_max_coolant_temp_f: 210, required_op_sequence: ["CRANK_GRIND"] }
              as: PlantAdmin
              captures: { s1: $.data.id }
            - call: "POST /build-specs/${s1}/activate"
              as: PlantAdmin
            # E-OLD chain
            - call: "POST /core-returns"
              payload: { distributor_id: "${dcore}", build_spec_id: "${s1}" }
              as: Distributor
              as_user_id: "${dcore}"
              captures: { ra: $.data.id }
            - call: "POST /core-returns/${ra}/grade"
              payload: { grade: "GRADE_A", missing_components: [] }
              as: CoreInspector
            - call: "POST /work-orders"
              payload: { core_return_id: "${ra}" }
              as: PlantAdmin
              captures: { wa: $.data.id }
            - call: "POST /work-orders/${wa}/advance"
              payload: { target: "TEARDOWN" }
              as: ShopTechnician
              captures: { wav: $.data.version }
            - call: "POST /work-orders/${wa}/operations"
              payload: { op_type: "CRANK_GRIND", sequence: 1, expected_work_order_version: "${wav}" }
              as: ShopTechnician
              captures: { oa: $.data.id }
            - call: "POST /work-orders/${wa}/advance"
              payload: { target: "MACHINING" }
              as: ShopTechnician
            - call: "POST /operations/${oa}/perform"
              payload: { station_code: "STN-AGE", scheduled_start: "2026-08-02T08:00:00Z", scheduled_end: "2026-08-02T09:00:00Z", result: "PASS" }
              as: ShopTechnician
            - call: "POST /work-orders/${wa}/advance"
              payload: { target: "ASSEMBLY" }
              as: ShopTechnician
            - call: "GET /work-orders/${wa}"
              as: PlantAdmin
              captures: { eold: $.data.reman_engine_id }
            - call: "POST /work-orders/${wa}/advance"
              payload: { target: "DYNO_TEST" }
              as: ShopTechnician
            - call: "POST /reman-engines/${eold}/dyno-tests"
              payload: { dyno_cell_code: "CELL-AGE", started_at: "2026-08-03T08:00:00Z", ended_at: "2026-08-03T09:00:00Z", horsepower: 320, oil_pressure_psi: 25.0, coolant_temp_f: 195 }
              as: ShopTechnician
              as_user_id: "tech-1"
            - call: "POST /reman-engines/${eold}/seal"
              as: QualityInspector
              as_user_id: "qi-1"
            - call: "GET /distributors/${dz}"
              as: PlantAdmin
              captures: { dzv1: $.data.version }
            - call: "POST /reman-engines/sell"
              payload: { build_spec_id: "${s1}", expected_distributor_version: "${dzv1}" }
              as: Distributor
              as_user_id: "${dz}"
              captures: { eold_sold: $.data.id }
            # E-YOUNG chain (produced at day 0, sold at day 60)
            - call: "POST /core-returns"
              payload: { distributor_id: "${dcore}", build_spec_id: "${s1}" }
              as: Distributor
              as_user_id: "${dcore}"
              captures: { rb: $.data.id }
            - call: "POST /core-returns/${rb}/grade"
              payload: { grade: "GRADE_A", missing_components: [] }
              as: CoreInspector
            - call: "POST /work-orders"
              payload: { core_return_id: "${rb}" }
              as: PlantAdmin
              captures: { wb: $.data.id }
            - call: "POST /work-orders/${wb}/advance"
              payload: { target: "TEARDOWN" }
              as: ShopTechnician
              captures: { wbv: $.data.version }
            - call: "POST /work-orders/${wb}/operations"
              payload: { op_type: "CRANK_GRIND", sequence: 1, expected_work_order_version: "${wbv}" }
              as: ShopTechnician
              captures: { ob: $.data.id }
            - call: "POST /work-orders/${wb}/advance"
              payload: { target: "MACHINING" }
              as: ShopTechnician
            - call: "POST /operations/${ob}/perform"
              payload: { station_code: "STN-AGE", scheduled_start: "2026-08-02T09:00:00Z", scheduled_end: "2026-08-02T10:00:00Z", result: "PASS" }
              as: ShopTechnician
            - call: "POST /work-orders/${wb}/advance"
              payload: { target: "ASSEMBLY" }
              as: ShopTechnician
            - call: "GET /work-orders/${wb}"
              as: PlantAdmin
              captures: { eyng: $.data.reman_engine_id }
            - call: "POST /work-orders/${wb}/advance"
              payload: { target: "DYNO_TEST" }
              as: ShopTechnician
            - call: "POST /reman-engines/${eyng}/dyno-tests"
              payload: { dyno_cell_code: "CELL-AGE", started_at: "2026-08-03T10:00:00Z", ended_at: "2026-08-03T11:00:00Z", horsepower: 320, oil_pressure_psi: 25.0, coolant_temp_f: 195 }
              as: ShopTechnician
              as_user_id: "tech-1"
            - call: "POST /reman-engines/${eyng}/seal"
              as: QualityInspector
              as_user_id: "qi-1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-30T00:00:00Z" }
              as: PlantAdmin
            - call: "GET /distributors/${dz}"
              as: PlantAdmin
              captures: { dzv2: $.data.version }
            - call: "POST /reman-engines/sell"
              payload: { build_spec_id: "${s1}", expected_distributor_version: "${dzv2}" }
              as: Distributor
              as_user_id: "${dz}"
              captures: { eyng_sold: $.data.id }
            - call: "GET /core-deposits"
              payload: { reman_engine_id: "${eold_sold}" }
              as: PlantAdmin
              captures: { dep_old: $.data.0.id }
            - call: "GET /core-deposits"
              payload: { reman_engine_id: "${eyng_sold}" }
              as: PlantAdmin
              captures: { dep_yng: $.data.0.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-01T00:00:00Z" }
              as: PlantAdmin
          trigger:
            - call: "POST /aging-runs"
              as: PlantAdmin
              captures: { swept: $.data.forfeited_count, swept_ids: $.data.forfeited_deposit_ids }
            - call: "GET /core-deposits/${dep_old}"
              as: PlantAdmin
              captures: { old_status: $.data.status, old_age: $.data.age_days_at_close, old_forf: $.data.forfeited_cents }
            - call: "GET /core-deposits/${dep_yng}"
              as: PlantAdmin
              captures: { yng_status: $.data.status }
            - call: "GET /distributors/${dz}"
              as: PlantAdmin
              captures: { dz_held: $.data.deposits_held_cents }
          assert:
            - "captured swept == 1 and captured swept_ids == [${dep_old}]"
            - "captured old_status == FORFEITED, captured old_age == 92, captured old_forf == 200000"
            - "captured yng_status == HELD (32-day deposit excluded from the sweep)"
            - "captured dz_held == 200000 (only DEP-YOUNG remains held)"

      - name: engine_sale_pricing_discount_math
        claim_type: correct_result
        grounds: [calculations.engine_sale_pricing]
        excluded_because:
          difficulty_instance: warranty_credit_vs_replacement_settlement
          rationale: "Sale price 212500 == round_half_up(250000 x 0.85) is asserted there on a sold engine."

      - name: deposit_refund_bracket_boundaries
        claim_type: correct_result
        grounds: [calculations.deposit_refund_calculation]
        excluded_because:
          difficulty_instance: deposit_refund_day30_vs_day31_boundary
          rationale: "100%/80% brackets and the inclusive day-30 boundary are asserted there; the 0% bracket is asserted by aging_run_sweeps_only_expired_held_deposits."

  # =================================================================
  # Section: validations
  # =================================================================
  - section: validations
    instances:
      - name: create_return_missing_required_beats_not_found
        claim_type: priority_ordering
        grounds: ["validations[priority=3]", "validations[priority=4]", "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "A core-return creation that is BOTH malformed (missing build_spec_id) AND references a non-existent distributor must report ERR_VALIDATION (400, priority 3) before ERR_NOT_FOUND (404, priority 4)."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /core-returns"
              payload: { distributor_id: "00000000-0000-0000-0000-000000000000" }
              as: Distributor
              as_user_id: "00000000-0000-0000-0000-000000000000"
              captures: { err: $.data.error_id }
          assert:
            - "captured err == ERR_VALIDATION (not ERR_NOT_FOUND)"

      - name: unauthenticated_request_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "A request without X-User-Role / X-User-ID headers is rejected 401 ERR_UNAUTHENTICATED before any role or existence check."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /distributors"
              payload: { distributor_code: "D-NA", name: "No Auth", emissions_requirement: "FEDERAL", credit_limit_cents: 1000, volume_discount_pct: 0.0 }
              captures: { err: $.data.error_id }
          assert:
            - "captured err == ERR_UNAUTHENTICATED"

      - name: work_order_create_with_draft_spec_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=8]", "errors[ERR_SPEC_NOT_ACTIVE]"]
        distinguishing_aspect: "A graded return whose build spec is still DRAFT cannot open a work order: ERR_SPEC_NOT_ACTIVE (409)."
        test_recipe:
          setup: ["Spec S exists but was never activated; return R (referencing S) is GRADED GRADE_A"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlantAdmin
            - call: "POST /distributors"
              payload: { distributor_code: "D-DRAFT", name: "Draft Spec Cores", emissions_requirement: "FEDERAL", credit_limit_cents: 1000000, volume_discount_pct: 0.0 }
              as: PlantAdmin
              captures: { d1: $.data.id }
            - call: "POST /build-specs"
              payload: { engine_family: "SBC-350", application_code: "CORSICA-1996", emissions_tier: "FEDERAL", list_price_cents: 250000, core_deposit_cents: 200000, core_base_credit_cents: 100000, allowed_reuse_grades: ["REUSE_OK"], allowed_interchange_groups: ["CRANK-SBC-3.48"], dyno_min_horsepower: 300, dyno_min_oil_pressure_psi: 20.0, dyno_max_coolant_temp_f: 210, required_op_sequence: ["CRANK_GRIND"] }
              as: PlantAdmin
              captures: { s1: $.data.id }
            - call: "POST /core-returns"
              payload: { distributor_id: "${d1}", build_spec_id: "${s1}" }
              as: Distributor
              as_user_id: "${d1}"
              captures: { r1: $.data.id }
            - call: "POST /core-returns/${r1}/grade"
              payload: { grade: "GRADE_A", missing_components: [] }
              as: CoreInspector
          trigger:
            - call: "POST /work-orders"
              payload: { core_return_id: "${r1}" }
              as: PlantAdmin
              captures: { err: $.data.error_id }
          assert:
            - "captured err == ERR_SPEC_NOT_ACTIVE"

      - name: deposit_link_from_other_distributor_rejected
