  # =========================================================================
  # Rule 5 - priority_pair_validation_conflict
  # =========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: booking_suspended_agreement_and_over_quota_reports_state_error
        grounds:
          - validations[priority=8]
          - validations[priority=13]
          - errors[ERR_AGREEMENT_NOT_ACTIVE]
          - errors[ERR_COMMITMENT_EXCEEDED]
        distinguishing_aspect: |
          Category pair state vs business_fiscal: with the agreement SUSPENDED and
          booked_month_to_date already at 100/100, one more booking violates both
