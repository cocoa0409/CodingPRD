  - name: data_category_confirmation_accepts_either_the_board_or_an_agency_official
    claim_type: shared_operations
    grounds:
    - rbac.AgencyAuthorizingOfficial.shared_operations
    - endpoints.POST /data-categories/{id}/confirm
    - state_machines.DataCategory.DECLARED_to_CONFIRMED
    - state_machines.DataCategory.DECLARED_to_WITHDRAWN
    distinguishing_aspect: 'The confirmation gate is co-owned before any sponsorship exists, so it cannot be implemented as
      a sponsor check: an agency official of an agency that sponsors nothing may confirm, and the board may withdraw, and
      both decisions recompute the preliminary level on the same offering. The provider — who declared the categories — is
      excluded from confirming its own claim.'
    test_recipe:
      setup:
      - 'Clock 2026-02-01T00:00:00Z; offering DRAFT at version 3 with two DECLARED data categories: PII (MODERATE/MODERATE/LOW)
        and PHI (HIGH/MODERATE/LOW).'
      - The DOT agency exists and sponsors no offering; a MODERATE and a HIGH baseline are published.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-02-01T00:00:00Z'
        as: ProgramBoardReviewer
        as_user_id: board-1
      - call: POST /agencies
        payload:
          name: Department of Transportation
          agency_code: DOT
          sponsorship_capacity: 3
        as: ProgramBoardReviewer
        as_user_id: board-1
        captures:
          agency_dot_id: $.data.id
      - call: POST /control-baselines
        payload:
          impact_level: HIGH
          version_label: Rev5-HIGH
          effective_from: '2026-01-01T00:00:00Z'
          families:
          - family_code: AC
            required_control_count: 4
            priority_rank: 1
          - family_code: SC
            required_control_count: 2
            priority_rank: 2
        as: ProgramBoardReviewer
        as_user_id: board-1
        captures:
          baseline_high_id: $.data.id
      - call: POST /control-baselines
        payload:
          impact_level: MODERATE
          version_label: Rev5-MODERATE
          effective_from: '2026-01-01T00:00:00Z'
          families: *id001
        as: ProgramBoardReviewer
        as_user_id: board-1
        captures:
          baseline_mod_id: $.data.id
      - call: POST /offerings
        payload:
          name: GovCloud Compute
          provider_name: Aurora Cloud
          service_model: IAAS
          deployment_model: GOV_COMMUNITY
          assessment_budget_usd: 400000.0
        as: CspComplianceLead
        as_user_id: csp-lead-1
        captures:
          offering_id: $.data.id
      - call: POST /offerings/${offering_id}/data-categories
        payload:
          category_code: PII
          confidentiality_impact: MODERATE
          integrity_impact: MODERATE
          availability_impact: LOW
        as: CspComplianceLead
        as_user_id: csp-lead-1
        captures:
          dc_pii_id: $.data.id
      - call: POST /offerings/${offering_id}/data-categories
        payload:
          category_code: PHI
          confidentiality_impact: HIGH
          integrity_impact: MODERATE
          availability_impact: LOW
        as: CspComplianceLead
        as_user_id: csp-lead-1
        captures:
          dc_phi_id: $.data.id
      trigger:
      - call: POST /data-categories/${dc_pii_id}/confirm
        payload:
          decision: CONFIRM
        as: CspComplianceLead
        as_user_id: csp-lead-1
        captures: *id002
      - call: POST /data-categories/${dc_pii_id}/confirm
        payload:
          decision: CONFIRM
        as: AgencyAuthorizingOfficial
        as_user_id: ${agency_dot_id}
        captures:
          pii_status: $.data.status
      - call: POST /data-categories/${dc_phi_id}/confirm
        payload:
          decision: WITHDRAW
        as: ProgramBoardReviewer
        as_user_id: board-1
        captures:
          phi_status: $.data.status
      - call: GET /offerings/${offering_id}
        as: CspComplianceLead
        as_user_id: csp-lead-1
        captures:
          off_v_after: $.data.version
      - call: POST /offerings/${offering_id}/impact-determination
        payload: {}
        as: ProgramBoardReviewer
        as_user_id: board-1
      assert:
      - 'confirm as CspComplianceLead: HTTP 403 with error_id ERR_FORBIDDEN_ROLE — the declarer is not the confirmer'
      - 'confirm as the non-sponsoring AgencyAuthorizingOfficial: HTTP 200; DataCategory.${dc_pii_id}.status == ''CONFIRMED''
        (${pii_status}) and confirmed_by_user_id == ${agency_dot_id}'
      - 'withdraw as ProgramBoardReviewer: HTTP 200; DataCategory.${dc_phi_id}.status == ''WITHDRAWN'' (${phi_status}) and
        confirmed_by_user_id == ''board-1'''
      - 'both writes moved the parent: CloudServiceOffering.${offering_id}.version == 5 (${off_v_after}) after the two decisions
        on a version-3 offering'
      - 'the withdrawal left the preliminary level at MODERATE, so the determination selects the MODERATE baseline: final_impact_level
        == ''MODERATE'' and status == ''CATEGORIZED'''
      - 'the refused provider confirmation wrote nothing: no confirmed_by_user_id was set to ''csp-lead-1'' on either category'
  - name: the_board_member_who_routes_a_deviation_may_not_be_the_one_who_decides_it
    claim_type: segregation_of_duties
    grounds:
    - complexity_profile.role_model
    - validations[priority=17]
    - validations[priority=4]
    - errors[ERR_SEGREGATION_OF_DUTIES]
    - errors[ERR_WRONG_REVIEW_QUEUE]
    - state_machines.DeviationRequest.BOARD_REVIEW_to_APPROVED
    distinguishing_aspect: 'Segregation of duties is an identity comparison, not a role comparison: board-1 and board-2 carry
      the SAME role and the same permissions, yet only board-2 may decide what board-1 routed. The instance also separates
      the two 403-shaped queue errors from it — an illegal queue for the kind and an agency official reaching into the board
      queue are both priority 4, which is reported before the priority 17 identity check.'
    test_recipe:
      setup:
      - Clock 2026-02-01T00:00:00Z; offering CATEGORIZED and sponsored by nobody, with one OPEN MODERATE finding detected
        2026-02-01T00:00:00Z whose deadline_at is 2026-05-02T00:00:00Z.
      - 'Two board members exist as operator identities: board-1 and board-2.'
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-02-01T00:00:00Z'
        as: ProgramBoardReviewer
        as_user_id: board-1
      - call: POST /agencies
        payload:
          name: Department of Transportation
          agency_code: DOT
          sponsorship_capacity: 3
        as: ProgramBoardReviewer
        as_user_id: board-1
        captures:
          agency_dot_id: $.data.id
      - call: POST /control-baselines
        payload:
          impact_level: MODERATE
          version_label: Rev5-MODERATE
          effective_from: '2026-01-01T00:00:00Z'
          families: *id001
        as: ProgramBoardReviewer
        as_user_id: board-1
        captures:
          baseline_mod_id: $.data.id
      - call: POST /offerings
        payload:
          name: GovCloud Compute
          provider_name: Aurora Cloud
          service_model: IAAS
          deployment_model: GOV_COMMUNITY
          assessment_budget_usd: 400000.0
        as: CspComplianceLead
        as_user_id: csp-lead-1
        captures:
          offering_id: $.data.id
      - call: POST /offerings/${offering_id}/data-categories
        payload:
          category_code: PII
          confidentiality_impact: MODERATE
          integrity_impact: MODERATE
          availability_impact: LOW
        as: CspComplianceLead
        as_user_id: csp-lead-1
        captures:
          dc_pii_id: $.data.id
      - call: POST /data-categories/${dc_pii_id}/confirm
        payload:
          decision: CONFIRM
        as: ProgramBoardReviewer
        as_user_id: board-1
      - call: POST /offerings/${offering_id}/impact-determination
        payload: {}
        as: ProgramBoardReviewer
        as_user_id: board-1
      - call: POST /poam-items
        payload:
          offering_id: ${offering_id}
          control_id: AC-2
          severity: MODERATE
          detected_at: '2026-02-01T00:00:00Z'
          source: SELF_IDENTIFIED
        as: CspComplianceLead
        as_user_id: csp-lead-1
        captures:
          poam_mod_id: $.data.id
      - call: POST /deviation-requests
        payload:
          poam_item_id: ${poam_mod_id}
          kind: OPERATIONAL_REQUIREMENT
          justification: Vendor patch is not available before the deadline.
          requested_extension_days: 45
        as: CspComplianceLead
        as_user_id: csp-lead-1
        captures:
          dev_ops_id: $.data.id
      trigger:
      - call: POST /deviation-requests/${dev_ops_id}/route
        payload:
          review_queue: AGENCY
        as: ProgramBoardReviewer
        as_user_id: board-1
        captures: *id002
      - call: POST /deviation-requests/${dev_ops_id}/route
        payload:
          review_queue: BOARD
        as: ProgramBoardReviewer
        as_user_id: board-1
      - call: POST /deviation-requests/${dev_ops_id}/decision
        payload:
          decision: APPROVE
        as: AgencyAuthorizingOfficial
        as_user_id: ${agency_dot_id}
        captures: *id002
      - call: POST /deviation-requests/${dev_ops_id}/decision
        payload:
          decision: APPROVE
        as: ProgramBoardReviewer
        as_user_id: board-1
        captures: *id002
      - call: POST /deviation-requests/${dev_ops_id}/decision
        payload:
          decision: APPROVE
        as: ProgramBoardReviewer
        as_user_id: board-2
      assert:
      - 'routing an OPERATIONAL_REQUIREMENT to the AGENCY queue: HTTP 403 with error_id ERR_WRONG_REVIEW_QUEUE; the deviation
        stays SUBMITTED with review_queue null'
      - 'routing it to the BOARD queue as board-1: HTTP 200; status ''BOARD_REVIEW'', review_queue ''BOARD'', routed_by_user_id
        == ''board-1'''
      - 'decision by the agency official: HTTP 403 with error_id ERR_WRONG_REVIEW_QUEUE — the BOARD queue belongs to ProgramBoardReviewer'
      - 'decision by board-1, the router: HTTP 409 with error_id ERR_SEGREGATION_OF_DUTIES — same role, same permissions,
        wrong identity'
      - 'decision by board-2: HTTP 200; status ''APPROVED'', decided_by_user_id == ''board-2'', granted_extension_days ==
        45'
      - 'the approval reaches the finding: PoamItem.${poam_mod_id}.risk_disposition == ''EXTENSION_GRANTED'' and deadline_at
        == 2026-06-16T00:00:00Z'
      - the two refusals left decided_by_user_id null and granted_extension_days 0 on the deviation
