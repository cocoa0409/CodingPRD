      setup:
      - Veteran v10a with COE-A, loan10a (SUBMITTED), appraisal aprA ASSIGNED to appraiser appC (max_open_assignments=1, region SOUTH)
      - Veteran v10b with ISSUED COE-B, loan10b (SUBMITTED), appraisal aprB QUEUED (no capacity)
      - COE-A issue is later voided by denial; COE-B remains ISSUED so loan10b survives
