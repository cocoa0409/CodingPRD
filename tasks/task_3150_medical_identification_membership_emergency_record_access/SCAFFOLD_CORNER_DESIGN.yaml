        distinguishing_aspect: "The Member role attempting the RecordVerifier-exclusive ticket resolve is denied 403 ERR_INSUFFICIENT_PERMISSIONS."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Member with a PENDING_VERIFICATION item (ticket exists)."
          setup_api_calls:
            - call: "POST /medical-id/_clock/set_current_utc"
