              as_user_id: "u-admin-1"
              captures: { offer_id: $.data.id }
            - call: "POST /api/offers/${offer_id}/publish"
              payload: {}
              as: ProgramAdmin
              as_user_id: "u-admin-1"
            - call: "POST /api/claimants"
              payload: { type: "DEALER", legal_name: "Dormant Dealer", email: "d@dorm.example", mailing_state: "TX" }
              as: ProgramAdmin
              as_user_id: "u-admin-1"
              captures: { clmt_id: $.data.id }
            - call: "POST /api/claims"
              payload: { offer_id: "${offer_id}", claimant_id: "${clmt_id}" }
              as: Dealer
              as_user_id: "${clmt_id}"
              captures: { claim_id: $.data.id }
            - call: "POST /api/claims/${claim_id}/receipts"
              payload: { serial_number: "SN-ESC-1", purchase_date: "2026-06-20T00:00:00Z", retailer_name: "Bay Supply", lines: [ { sku: "TOOLS-A", quantity: 10, unit_price_cents: 2000 } ] }
              as: Dealer
              as_user_id: "${clmt_id}"
              captures: { r1_id: $.data.id }
            - call: "POST /api/claims/${claim_id}/submit"
              payload: {}
              as: Dealer
              as_user_id: "${clmt_id}"
            - call: "POST /api/claims/${claim_id}/review"
              payload: {}
              as: ClaimsProcessor
              as_user_id: "u-proc-1"
            - call: "POST /api/receipts/${r1_id}/validate"
              payload: {}
              as: ClaimsProcessor
              as_user_id: "u-proc-1"
            - call: "POST /api/claims/${claim_id}/approve"
              payload: {}
              as: ClaimsProcessor
              as_user_id: "u-proc-1"
              captures: { claim_ver: $.data.version }
