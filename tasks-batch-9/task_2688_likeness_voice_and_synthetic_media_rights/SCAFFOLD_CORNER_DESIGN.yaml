# =============================================================================
# §1.9 Scaffold Corner Design — likeness-rights-clearance
#
# Breadth walk of references/claim-extraction-guide.md against this scaffold's
# §1.1-§1.7 surface. §1.8 is the depth probe; every corner it already asserts is
# emitted here as an `excluded_because:` stub instead of being duplicated.
#
# Transcription convention for the three corners that cannot be expressed as a
# structured call (an unauthenticated request has no role, a role-denial request
# carries a role §1.5 forbids for that endpoint, and a missing-required-field
# request is by definition not payload-complete): the structured `call` stays
# well-formed and permitted, and the corner is stated as an `assert` line naming
# the exact substitute headers or the removed key together with the expected
# status and error_id. The transcriber issues that second request verbatim.
#
# Default logical clock for every recipe below is 2026-08-01T00:00:00Z unless a
# recipe advances it with POST /_clock/set_current_utc.
# =============================================================================
scaffold_corner_design:
  - section: entities
    instances:
      - name: talent_creation_returns_every_declared_field
        claim_type: creation
        grounds: [entities.Talent, endpoints.POST_talents]
        distinguishing_aspect: >-
          A minimal POST /talents with only the required legal_name and domicile_state_code must
          return 201 and a body carrying every §1.1 Talent field — including the derived counters
          and posture that later cascades mutate — not a partial projection.
        test_recipe:
          setup:
            - "Empty database except for the CA state law profile that Talent creation's domicile lookup needs"
          setup_api_calls:
            - call: "POST /state-law-profiles"
              payload: { state_code: "CA", postmortem_rights_years: 70, postmortem_requires_registration: true, biometric_retention_max_days: 365, deletion_grace_days: 30, removal_window_days: 14, disclosure_required_advertising: true, disclosure_required_entertainment: true, min_disclosure_rank_advertising: 3, min_disclosure_rank_entertainment: 2 }
              as: RightsAdministrator
          trigger:
            - call: "POST /talents"
              payload: { legal_name: "Ava Reyes", domicile_state_code: "CA", union_code: "SAG_AFTRA" }
              as: RightsAdministrator
              captures: { t_id: $.data.id }
          assert:
            - "HTTP 201 with response_type == \"object\" and meta.api_request_id present"
            - "data.legal_name == \"Ava Reyes\", data.domicile_state_code == \"CA\", data.union_code == \"SAG_AFTRA\""
            - "data.life_status == \"LIVING\", data.date_of_death == null, data.postmortem_rights_until == null, data.postmortem_registration_number == null"
            - "data.rights_posture == \"CLEAR\", data.legal_hold_asset_count == 0, data.open_removal_obligation_count == 0, data.lifetime_compensation_cents == 0"
            - "data.id is a bare UUID with no type prefix, data.version == 1, and data.created_at / data.updated_at are ISO-8601 UTC with three fractional digits"

      - name: consent_grant_retrieval_returns_stored_representation
        claim_type: retrieval
        grounds: [entities.ConsentGrant, endpoints.GET_consent_grants_id]
        distinguishing_aspect: >-
          GET /consent-grants/{id} must echo the drafted terms exactly, including the derived
          administrator_share_pct (1 - talent - agency) and union_code_snapshot taken at draft time,
          and must still report status PENDING_COUNTERSIGN before any countersignature.
        test_recipe:
          setup:
            - "CA law profile, SAG_AFTRA/ADVERTISING union row, one CA/SAG talent"
            - "One drafted grant with explicit talent_share_pct 0.70 and agency_share_pct 0.25"
          setup_api_calls:
            - call: "POST /state-law-profiles"
              payload: { state_code: "CA", postmortem_rights_years: 70, postmortem_requires_registration: true, biometric_retention_max_days: 365, deletion_grace_days: 30, removal_window_days: 14, disclosure_required_advertising: true, disclosure_required_entertainment: true, min_disclosure_rank_advertising: 3, min_disclosure_rank_entertainment: 2 }
              as: RightsAdministrator
            - call: "POST /union-minimum-schedules"
              payload: { union_code: "SAG_AFTRA", media_type: "ADVERTISING", effective_from: "2026-07-01T00:00:00Z", minimum_initial_cents: 300000, minimum_per_use_cents: 150000 }
              as: RightsAdministrator
            - call: "POST /talents"
              payload: { legal_name: "Ava Reyes", domicile_state_code: "CA", union_code: "SAG_AFTRA" }
              as: RightsAdministrator
              captures: { t_id: $.data.id, t_v: $.data.version }
            - call: "POST /consent-grants"
              payload: { talent_id: "${t_id}", grantor_kind: "TALENT", permitted_media_types: ["ADVERTISING"], permitted_use_notes: "National voice campaign", territory_codes: ["US", "MX"], exclusivity: "NON_EXCLUSIVE", effective_from: "2026-08-01T00:00:00Z", effective_until: "2027-08-01T00:00:00Z", initial_creation_fee_cents: 300000, per_use_base_fee_cents: 150000, talent_share_pct: 0.70, agency_share_pct: 0.25, expected_talent_version: "${t_v}" }
              as: RightsAdministrator
              captures: { g_id: $.data.id }
          trigger:
            - call: "GET /consent-grants/${g_id}"
              payload: {}
              as: RightsAdministrator
          assert:
            - "HTTP 200 with data.id == ${g_id} and data.status == \"PENDING_COUNTERSIGN\""
            - "data.talent_share_pct == 0.70, data.agency_share_pct == 0.25, data.administrator_share_pct == 0.05"
            - "data.union_code_snapshot == \"SAG_AFTRA\", data.permitted_media_types == [\"ADVERTISING\"], data.territory_codes == [\"US\", \"MX\"]"
            - "data.initial_compensation_cents == 0, data.union_topup_cents == 0, data.total_compensation_cents == 0, data.countersigned_at == null, data.effective_end_actual == null"

      - name: infringement_case_listing_paginates_in_created_at_order
        claim_type: listing
        grounds: [endpoints.GET_infringement_cases, response_envelope.pagination_fields]
        distinguishing_aspect: >-
          Three cases exist; GET /infringement-cases?limit=2&offset=0 must return the two oldest in
          created_at ascending order with total_count 3 and has_more true, and offset=2 must return
          the third with has_more false — the envelope's pagination contract, not a bare array.
        test_recipe:
          setup:
            - "CA law profile and one CA talent"
            - "Three cases opened in a known order by co-001"
          setup_api_calls:
            - call: "POST /state-law-profiles"
              payload: { state_code: "CA", postmortem_rights_years: 70, postmortem_requires_registration: true, biometric_retention_max_days: 365, deletion_grace_days: 30, removal_window_days: 14, disclosure_required_advertising: true, disclosure_required_entertainment: true, min_disclosure_rank_advertising: 3, min_disclosure_rank_entertainment: 2 }
              as: RightsAdministrator
            - call: "POST /talents"
              payload: { legal_name: "Ava Reyes", domicile_state_code: "CA", union_code: "SAG_AFTRA" }
              as: RightsAdministrator
              captures: { t_id: $.data.id }
            - call: "POST /infringement-cases"
              payload: { talent_id: "${t_id}", detection_source: "MONITORING_FEED", suspect_url: "https://pirate.example/one", detected_channel: "ADVERTISING", detected_state_code: "CA", detected_view_count: 100000, match_confidence: 0.400 }
              as: ComplianceOfficer
              as_user_id: "co-001"
              captures: { c1_id: $.data.id }
            - call: "POST /infringement-cases"
              payload: { talent_id: "${t_id}", detection_source: "MONITORING_FEED", suspect_url: "https://pirate.example/two", detected_channel: "ENTERTAINMENT", detected_state_code: "CA", detected_view_count: 200000, match_confidence: 0.450 }
              as: ComplianceOfficer
              as_user_id: "co-001"
              captures: { c2_id: $.data.id }
            - call: "POST /infringement-cases"
              payload: { talent_id: "${t_id}", detection_source: "MANUAL_REPORT", suspect_url: "https://pirate.example/three", detected_channel: "ADVERTISING", detected_state_code: "CA", detected_view_count: 300000, match_confidence: 0.500 }
              as: ComplianceOfficer
              as_user_id: "co-001"
              captures: { c3_id: $.data.id }
          trigger:
            - call: "GET /infringement-cases"
              payload: { limit: 2, offset: 0 }
              as: ComplianceOfficer
              as_user_id: "co-001"
            - call: "GET /infringement-cases"
              payload: { limit: 2, offset: 2 }
              as: ComplianceOfficer
              as_user_id: "co-001"
            - call: "GET /infringement-cases"
              payload: { detection_source: "MANUAL_REPORT" }
              as: ComplianceOfficer
              as_user_id: "co-001"
          assert:
            - "trigger call 1: response_type == \"array\", data has 2 rows in order [${c1_id}, ${c2_id}], total_count == 3, has_more == true, limit == 2, offset == 0"
            - "trigger call 2: data has exactly 1 row [${c3_id}], total_count == 3, has_more == false"
            - "trigger call 3: the detection_source filter narrows to exactly [${c3_id}] with total_count == 1, and the default limit is 10 with offset 0"

      - name: unknown_digital_replica_id_returns_not_found
        claim_type: not_found
        grounds: [errors.ERR_DIGITAL_REPLICA_NOT_FOUND, validations.priority_14]
        distinguishing_aspect: >-
          A well-formed UUID that matches no DigitalReplica must yield 404
          ERR_DIGITAL_REPLICA_NOT_FOUND from the existence rung (priority 14), not a 200 with a null
          body and not a 500.
        test_recipe:
          setup:
            - "CA law profile and one talent exist so the store is non-empty but holds no replicas"
          setup_api_calls:
            - call: "POST /state-law-profiles"
              payload: { state_code: "CA", postmortem_rights_years: 70, postmortem_requires_registration: true, biometric_retention_max_days: 365, deletion_grace_days: 30, removal_window_days: 14, disclosure_required_advertising: true, disclosure_required_entertainment: true, min_disclosure_rank_advertising: 3, min_disclosure_rank_entertainment: 2 }
              as: RightsAdministrator
            - call: "POST /talents"
              payload: { legal_name: "Ava Reyes", domicile_state_code: "CA", union_code: "SAG_AFTRA" }
              as: RightsAdministrator
              captures: { t_id: $.data.id }
          trigger:
            - call: "GET /digital-replicas/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: RightsAdministrator
          assert:
            - "HTTP 404 with response_type == \"error\" and data.error_id == \"ERR_DIGITAL_REPLICA_NOT_FOUND\""
            - "GET /digital-replicas?talent_id=${t_id} returns an empty data array with total_count == 0 and has_more == false"

      - name: consent_grant_missing_required_field_is_rejected
        claim_type: required_fields
        grounds: [endpoints.POST_consent_grants, errors.ERR_INVALID_REQUEST, validations.priority_3]
        distinguishing_aspect: >-
          per_use_base_fee_cents has source input with no default, so its absence must be caught by
          the shape rung (priority 3) with 400 ERR_INVALID_REQUEST — before the existence, ownership
          or optimistic-concurrency rungs get a chance to answer with 404 or 412.
        test_recipe:
          setup:
            - "CA law profile, SAG_AFTRA/ADVERTISING union row and one CA/SAG talent"
          setup_api_calls:
            - call: "POST /state-law-profiles"
              payload: { state_code: "CA", postmortem_rights_years: 70, postmortem_requires_registration: true, biometric_retention_max_days: 365, deletion_grace_days: 30, removal_window_days: 14, disclosure_required_advertising: true, disclosure_required_entertainment: true, min_disclosure_rank_advertising: 3, min_disclosure_rank_entertainment: 2 }
              as: RightsAdministrator
            - call: "POST /union-minimum-schedules"
              payload: { union_code: "SAG_AFTRA", media_type: "ADVERTISING", effective_from: "2026-07-01T00:00:00Z", minimum_initial_cents: 300000, minimum_per_use_cents: 150000 }
              as: RightsAdministrator
            - call: "POST /talents"
              payload: { legal_name: "Ava Reyes", domicile_state_code: "CA", union_code: "SAG_AFTRA" }
              as: RightsAdministrator
              captures: { t_id: $.data.id, t_v: $.data.version }
          trigger:
            - call: "POST /consent-grants"
              payload: { talent_id: "${t_id}", grantor_kind: "TALENT", permitted_media_types: ["ADVERTISING"], permitted_use_notes: "National voice campaign", territory_codes: ["US"], exclusivity: "NON_EXCLUSIVE", effective_from: "2026-08-01T00:00:00Z", effective_until: "2027-08-01T00:00:00Z", initial_creation_fee_cents: 300000, per_use_base_fee_cents: 150000, expected_talent_version: "${t_v}" }
              as: RightsAdministrator
          assert:
            - "the well-formed trigger call returns 201 and increments Talent.${t_id}.version to 2, establishing the baseline"
            - "re-sending the identical request with the key per_use_base_fee_cents REMOVED returns 400 with data.error_id == \"ERR_INVALID_REQUEST\""
            - "re-sending it with per_use_base_fee_cents removed AND a stale expected_talent_version of 1 still returns 400 ERR_INVALID_REQUEST, never 412 ERR_TALENT_VERSION_STALE — priority 3 outranks priority 30"
            - "no second ConsentGrant is persisted: GET /consent-grants?talent_id=${t_id} returns exactly 1 row"

      - name: talent_union_code_defaults_to_none_and_skips_the_union_floor
        claim_type: defaults
        grounds: [entities.Talent.union_code, calculations.initial_creation_compensation]
        distinguishing_aspect: >-
          Omitting union_code must apply the declared default NONE, and a NONE talent must take the
          union-floor branch that sets floor 0 — so a 100000 fee stays 100000 at countersign with no
          UnionMinimumSchedule row in the database at all and no ERR_UNION_SCHEDULE_MISSING.
        test_recipe:
          setup:
            - "CA law profile only — deliberately NO UnionMinimumSchedule rows exist"
            - "One CA talent created without a union_code"
          setup_api_calls:
            - call: "POST /state-law-profiles"
              payload: { state_code: "CA", postmortem_rights_years: 70, postmortem_requires_registration: true, biometric_retention_max_days: 365, deletion_grace_days: 30, removal_window_days: 14, disclosure_required_advertising: true, disclosure_required_entertainment: true, min_disclosure_rank_advertising: 3, min_disclosure_rank_entertainment: 2 }
              as: RightsAdministrator
            - call: "POST /talents"
              payload: { legal_name: "Nia Okafor", domicile_state_code: "CA" }
              as: RightsAdministrator
              captures: { t_id: $.data.id, t_v: $.data.version }
            - call: "POST /consent-grants"
              payload: { talent_id: "${t_id}", grantor_kind: "TALENT", permitted_media_types: ["SOCIAL"], permitted_use_notes: "Non-union social clip", territory_codes: ["US"], exclusivity: "NON_EXCLUSIVE", effective_from: "2026-08-01T00:00:00Z", effective_until: "2027-08-01T00:00:00Z", initial_creation_fee_cents: 100000, per_use_base_fee_cents: 50000, expected_talent_version: "${t_v}" }
              as: RightsAdministrator
              captures: { g_id: $.data.id }
          trigger:
            - call: "POST /consent-grants/${g_id}/countersign"
              payload: {}
              as: TalentRepresentative
              as_user_id: "${t_id}"
          assert:
            - "Talent.${t_id}.union_code == \"NONE\" (the declared default) and ConsentGrant.${g_id}.union_code_snapshot == null"
            - "HTTP 200: ConsentGrant.${g_id}.status == \"ACTIVE\", initial_compensation_cents == 100000, union_topup_cents == 0, total_compensation_cents == 100000"
            - "GET /compensation-entries?consent_grant_id=${g_id} returns exactly 1 INITIAL_CREATION entry of 100000 with shares 75000 / 20000 / 5000"
            - "no ERR_UNION_SCHEDULE_MISSING is raised even though the UnionMinimumSchedule table is empty"

      - name: biometric_asset_retention_until_is_computed_not_supplied
        claim_type: computed_fields
        grounds: [entities.BiometricAsset.retention_until, calculations.biometric_retention_deadline]
        distinguishing_aspect: >-
          retention_until has source computed and POST /biometric-assets does not declare it as an
          input at all, so the server must derive 2027-08-01 from min(created_at + 365 statutory
          days, consent end + 30 grace days) at creation time, and purge_due_at must stay null until
          a sweep actually schedules the purge.
        test_recipe:
          setup:
            - "CA law profile (365 statutory retention days, 30 deletion grace days) and the SAG_AFTRA/ADVERTISING union row"
            - "One CA/SAG talent with an ACTIVE grant running 2026-08-01 -> 2027-08-01"
          setup_api_calls:
            - call: "POST /state-law-profiles"
              payload: { state_code: "CA", postmortem_rights_years: 70, postmortem_requires_registration: true, biometric_retention_max_days: 365, deletion_grace_days: 30, removal_window_days: 14, disclosure_required_advertising: true, disclosure_required_entertainment: true, min_disclosure_rank_advertising: 3, min_disclosure_rank_entertainment: 2 }
              as: RightsAdministrator
            - call: "POST /union-minimum-schedules"
              payload: { union_code: "SAG_AFTRA", media_type: "ADVERTISING", effective_from: "2026-07-01T00:00:00Z", minimum_initial_cents: 300000, minimum_per_use_cents: 150000 }
              as: RightsAdministrator
            - call: "POST /talents"
              payload: { legal_name: "Ava Reyes", domicile_state_code: "CA", union_code: "SAG_AFTRA" }
              as: RightsAdministrator
              captures: { t_id: $.data.id, t_v: $.data.version }
            - call: "POST /consent-grants"
              payload: { talent_id: "${t_id}", grantor_kind: "TALENT", permitted_media_types: ["ADVERTISING"], permitted_use_notes: "National voice campaign", territory_codes: ["US", "MX"], exclusivity: "NON_EXCLUSIVE", effective_from: "2026-08-01T00:00:00Z", effective_until: "2027-08-01T00:00:00Z", initial_creation_fee_cents: 300000, per_use_base_fee_cents: 150000, expected_talent_version: "${t_v}" }
              as: RightsAdministrator
              captures: { g_id: $.data.id }
            - call: "POST /consent-grants/${g_id}/countersign"
              payload: {}
              as: TalentRepresentative
              as_user_id: "${t_id}"
          trigger:
            - call: "POST /biometric-assets"
              payload: { talent_id: "${t_id}", consent_grant_id: "${g_id}", asset_kind: "VOICE_SAMPLE", capture_ref: "cap-001", storage_class: "ENCRYPTED_VAULT", payload_digest: "sha256:aaa" }
              as: RightsAdministrator
              captures: { a1_id: $.data.id }
          assert:
            - "HTTP 201 with data.status == \"STORED\" and data.retention_until == \"2027-08-01T00:00:00Z\" (statutory 2027-08-01 binds ahead of contractual 2027-08-31)"
            - "data.purge_due_at == null, data.purged_at == null, data.held_from_status == null"
            - "data.payload_digest == \"sha256:aaa\" and data.storage_class == \"ENCRYPTED_VAULT\" round-trip unchanged"
            - "retention_until is not an input of POST /biometric-assets, so a client cannot set it; the value is reproducible from created_at plus the CA profile alone"

      - name: system_fields_are_server_minted_on_talent_create
        claim_type: system_fields
        grounds: [entities.Talent, complexity_profile.consistency_model]
        distinguishing_aspect: >-
          id / created_at / updated_at / version are server-minted: version starts at exactly 1 and
          steps to 2 on the next mutation of that row (drafting a grant against it), updated_at
          advances with it, and created_at does not move.
        test_recipe:
          setup:
            - "CA law profile and the SAG_AFTRA/ADVERTISING union row exist"
          setup_api_calls:
            - call: "POST /state-law-profiles"
              payload: { state_code: "CA", postmortem_rights_years: 70, postmortem_requires_registration: true, biometric_retention_max_days: 365, deletion_grace_days: 30, removal_window_days: 14, disclosure_required_advertising: true, disclosure_required_entertainment: true, min_disclosure_rank_advertising: 3, min_disclosure_rank_entertainment: 2 }
              as: RightsAdministrator
            - call: "POST /union-minimum-schedules"
              payload: { union_code: "SAG_AFTRA", media_type: "ADVERTISING", effective_from: "2026-07-01T00:00:00Z", minimum_initial_cents: 300000, minimum_per_use_cents: 150000 }
              as: RightsAdministrator
            - call: "POST /talents"
              payload: { legal_name: "Ava Reyes", domicile_state_code: "CA", union_code: "SAG_AFTRA" }
              as: RightsAdministrator
              captures: { t_id: $.data.id, t_v: $.data.version }
          trigger:
            - call: "POST /consent-grants"
              payload: { talent_id: "${t_id}", grantor_kind: "TALENT", permitted_media_types: ["ADVERTISING"], permitted_use_notes: "National voice campaign", territory_codes: ["US"], exclusivity: "NON_EXCLUSIVE", effective_from: "2026-08-01T00:00:00Z", effective_until: "2027-08-01T00:00:00Z", initial_creation_fee_cents: 300000, per_use_base_fee_cents: 150000, expected_talent_version: "${t_v}" }
              as: RightsAdministrator
              captures: { g_id: $.data.id }
            - call: "GET /talents/${t_id}"
              payload: {}
              as: RightsAdministrator
          assert:
            - "the captured t_v was exactly 1 — every entity with common_fields true starts at version 1"
            - "trigger call 2 shows Talent.${t_id}.version == 2, because drafting the grant declares 'increments Talent.version by 1'"
            - "Talent.${t_id}.created_at is unchanged between the two reads while updated_at has advanced"
            - "ConsentGrant.${g_id}.id is a bare UUID distinct from ${t_id}, with its own version == 1"

      - name: invalid_asset_kind_enum_value_is_rejected
        claim_type: type_constraints
        grounds: [entities.BiometricAsset.asset_kind, errors.ERR_INVALID_REQUEST]
        distinguishing_aspect: >-
          asset_kind is constrained to {FACE_SCAN, VOICE_SAMPLE, MOTION_CAPTURE}; a syntactically
          valid but out-of-enum value must fail the shape rung with 400 ERR_INVALID_REQUEST and
          persist nothing, rather than being stored verbatim or coerced to a default.
        test_recipe:
          setup:
            - "CA law profile, SAG_AFTRA/ADVERTISING union row, one CA/SAG talent with an ACTIVE grant"
          setup_api_calls:
            - call: "POST /state-law-profiles"
              payload: { state_code: "CA", postmortem_rights_years: 70, postmortem_requires_registration: true, biometric_retention_max_days: 365, deletion_grace_days: 30, removal_window_days: 14, disclosure_required_advertising: true, disclosure_required_entertainment: true, min_disclosure_rank_advertising: 3, min_disclosure_rank_entertainment: 2 }
              as: RightsAdministrator
            - call: "POST /union-minimum-schedules"
              payload: { union_code: "SAG_AFTRA", media_type: "ADVERTISING", effective_from: "2026-07-01T00:00:00Z", minimum_initial_cents: 300000, minimum_per_use_cents: 150000 }
              as: RightsAdministrator
            - call: "POST /talents"
              payload: { legal_name: "Ava Reyes", domicile_state_code: "CA", union_code: "SAG_AFTRA" }
              as: RightsAdministrator
              captures: { t_id: $.data.id, t_v: $.data.version }
            - call: "POST /consent-grants"
              payload: { talent_id: "${t_id}", grantor_kind: "TALENT", permitted_media_types: ["ADVERTISING"], permitted_use_notes: "National voice campaign", territory_codes: ["US"], exclusivity: "NON_EXCLUSIVE", effective_from: "2026-08-01T00:00:00Z", effective_until: "2027-08-01T00:00:00Z", initial_creation_fee_cents: 300000, per_use_base_fee_cents: 150000, expected_talent_version: "${t_v}" }
              as: RightsAdministrator
              captures: { g_id: $.data.id }
            - call: "POST /consent-grants/${g_id}/countersign"
              payload: {}
              as: TalentRepresentative
              as_user_id: "${t_id}"
          trigger:
            - call: "POST /biometric-assets"
              payload: { talent_id: "${t_id}", consent_grant_id: "${g_id}", asset_kind: "TATTOO_SCAN", capture_ref: "cap-bad", storage_class: "ENCRYPTED_VAULT", payload_digest: "sha256:zzz" }
              as: RightsAdministrator
          assert:
            - "HTTP 400 with data.error_id == \"ERR_INVALID_REQUEST\""
            - "GET /biometric-assets?talent_id=${t_id} returns an empty data array with total_count == 0"
            - "the same request with asset_kind \"VOICE_SAMPLE\" returns 201, proving only the enum value was at fault"

      - name: compensation_entry_is_append_only_with_no_version_field
        claim_type: immutability
        grounds: [entities.CompensationEntry, endpoints.GET_compensation_entries_id]
        distinguishing_aspect: >-
          CompensationEntry declares common_fields false: it carries id and created_at only, exposes
          no version, and §1.5 offers no POST, PATCH or DELETE for it — the only way a ledger row
          changes economically is a later REVERSAL row that points at it via reverses_entry_id.
        test_recipe:
          setup:
            - "CA law profile, SAG_AFTRA/ADVERTISING union row, one CA/SAG talent"
            - "One countersigned grant, so exactly one INITIAL_CREATION row exists"
          setup_api_calls:
            - call: "POST /state-law-profiles"
