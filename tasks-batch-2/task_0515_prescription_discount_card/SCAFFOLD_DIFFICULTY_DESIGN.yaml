scaffold_difficulty_design:

  # =========================================================================
  # Rule 1 — Dual-variant calculations across DIFFERENT entity domains
  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: savings_discount_vs_gold_basis_on_claim
        grounds:
          - calculations.savings_calculation
          - entities.Claim.fields.savings_cents
          - entities.DiscountCard.fields.pricing_basis
        distinguishing_aspect: |
          On the Claim entity domain, an identical (quantity=2, cash=7000,
          dispense=200) claim yields savings_cents==3000 under DISCOUNT basis
          (discount_price=5500) but savings_cents==3600 under GOLD basis
          (gold_price=5200) — same inputs, two basis variants, different result.
        test_recipe:
          setup:
            - "Drug ATORVA (awp=10000); one ACTIVE pharmacy PH (CA, dispense_fee=200)."
            - "One PUBLISHED quote: cash=7000, discount=5500, gold=5200, window [2026-05-01,2027-01-01)."
            - "Member M_STD (no Gold) makes a DISCOUNT-basis card; Member M_GOLD (paid Gold ACTIVE) makes a GOLD-basis card at the same pharmacy."
            - "Two claims of quantity=2 are submitted and adjudicated, one per card."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-15T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /drugs"
              payload: { name: "Atorvastatin", ndc: "00071015523", dosage_mg: 20, form: "TABLET", awp_cents: 10000 }
              as: PlatformAdmin
              captures: { drug_id: $.data.id }
            - call: "POST /pharmacies"
              payload: { name: "PH One", chain_code: "CVS", state_code: "CA", dispense_fee_cents: 200 }
              as: PlatformAdmin
              captures: { ph_id: $.data.id }
            - call: "POST /price-quotes"
              payload: { drug_id: "${drug_id}", pharmacy_id: "${ph_id}", cash_price_cents: 7000, discount_price_cents: 5500, gold_price_cents: 5200, effective_at: "2026-05-01T00:00:00Z", expires_at: "2027-01-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { quote_id: $.data.id }
            - call: "POST /members"
              payload: { email: "std@x.com", full_name: "M Std", state_code: "CA" }
              as: Anonymous
              captures: { m_std_id: $.data.id }
            - call: "POST /members"
              payload: { email: "gold@x.com", full_name: "M Gold", state_code: "CA" }
              as: Anonymous
              captures: { m_gold_id: $.data.id }
            - call: "POST /gold-memberships"
              payload: { member_id: "${m_gold_id}", tier: "GOLD_INDIVIDUAL", coverage_start: "2026-05-01T00:00:00Z", coverage_end: "2026-12-31T00:00:00Z" }
              as: Member
              as_user_id: "${m_gold_id}"
              captures: { gm_id: $.data.id }
            - call: "POST /gold-memberships/${gm_id}/record-payment"
              payload: {}
              as: PlatformAdmin
            - call: "POST /comparisons"
              payload: { member_id: "${m_std_id}", drug_id: "${drug_id}", state_code: "CA" }
              as: Member
              as_user_id: "${m_std_id}"
              captures: { cmp_std_id: $.data.id }
            - call: "POST /comparisons/${cmp_std_id}/run"
              payload: { member_id: "${m_std_id}" }
              as: Member
              as_user_id: "${m_std_id}"
            - call: "POST /discount-cards"
              payload: { member_id: "${m_std_id}", comparison_id: "${cmp_std_id}" }
              as: Member
              as_user_id: "${m_std_id}"
              captures: { card_std_id: $.data.id }
            - call: "POST /comparisons"
              payload: { member_id: "${m_gold_id}", drug_id: "${drug_id}", state_code: "CA" }
              as: Member
              as_user_id: "${m_gold_id}"
              captures: { cmp_gold_id: $.data.id }
            - call: "POST /comparisons/${cmp_gold_id}/run"
              payload: { member_id: "${m_gold_id}" }
              as: Member
              as_user_id: "${m_gold_id}"
            - call: "POST /discount-cards"
              payload: { member_id: "${m_gold_id}", comparison_id: "${cmp_gold_id}" }
              as: Member
              as_user_id: "${m_gold_id}"
              captures: { card_gold_id: $.data.id }
            - call: "POST /claims"
              payload: { discount_card_id: "${card_std_id}", pharmacy_id: "${ph_id}", quantity: 2 }
              as: PharmacyOperator
              captures: { claim_std_id: $.data.id }
            - call: "POST /claims"
              payload: { discount_card_id: "${card_gold_id}", pharmacy_id: "${ph_id}", quantity: 2 }
              as: PharmacyOperator
              captures: { claim_gold_id: $.data.id }
          trigger:
            - call: "POST /claims/${claim_std_id}/adjudicate"
              payload: {}
              as: PharmacyOperator
              captures: { std_savings: $.data.savings_cents }
            - call: "POST /claims/${claim_gold_id}/adjudicate"
              payload: {}
              as: PharmacyOperator
              captures: { gold_savings: $.data.savings_cents }
          assert:
            - "Claim.${claim_std_id}.savings_cents == 3000"
            - "Claim.${claim_std_id}.net_cents == 11200"
            - "Claim.${claim_gold_id}.savings_cents == 3600"
            - "Claim.${claim_gold_id}.net_cents == 10600"

      - name: insurance_vs_discount_recommendation_on_estimate
        grounds:
          - calculations.discount_vs_insurance_choice
          - entities.InsuranceEstimate.fields.recommended_path
          - entities.PriceComparison.fields.best_price_cents
        distinguishing_aspect: |
          On the InsuranceEstimate/PriceComparison domain (distinct from Claim),
          the same RESOLVED best_price_cents==5500 yields recommended_path==INSURANCE
          when insurance_net (copay 1000 + min(deductible 2000, awp 10000) = 3000) < 5500.
        test_recipe:
          setup:
            - "Insured Member M_INS (has_insurance=true), drug ATORVA (awp=10000), one CA pharmacy, one PUBLISHED quote discount=5500."
            - "A comparison is RESOLVED at best_price_cents=5500 (standard basis)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-15T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /drugs"
              payload: { name: "Atorvastatin", ndc: "00071015523", dosage_mg: 20, form: "TABLET", awp_cents: 10000 }
              as: PlatformAdmin
              captures: { drug_id: $.data.id }
            - call: "POST /pharmacies"
              payload: { name: "PH One", chain_code: "CVS", state_code: "CA", dispense_fee_cents: 200 }
              as: PlatformAdmin
              captures: { ph_id: $.data.id }
            - call: "POST /price-quotes"
              payload: { drug_id: "${drug_id}", pharmacy_id: "${ph_id}", cash_price_cents: 7000, discount_price_cents: 5500, gold_price_cents: 5200, effective_at: "2026-05-01T00:00:00Z", expires_at: "2027-01-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /members"
              payload: { email: "ins@x.com", full_name: "M Ins", state_code: "CA", has_insurance: true }
              as: Anonymous
              captures: { m_ins_id: $.data.id }
            - call: "POST /comparisons"
              payload: { member_id: "${m_ins_id}", drug_id: "${drug_id}", state_code: "CA" }
              as: Member
              as_user_id: "${m_ins_id}"
              captures: { cmp_id: $.data.id }
            - call: "POST /comparisons/${cmp_id}/run"
              payload: { member_id: "${m_ins_id}" }
              as: Member
              as_user_id: "${m_ins_id}"
          trigger:
            - call: "POST /comparisons/${cmp_id}/insurance-estimate"
              payload: { member_id: "${m_ins_id}", copay_cents: 1000, deductible_remaining_cents: 2000 }
              as: Member
              as_user_id: "${m_ins_id}"
              captures: { rec: $.data.recommended_path }
          assert:
            - "PriceComparison.${cmp_id}.best_price_cents == 5500"
            - "InsuranceEstimate(comparison_id=${cmp_id}).recommended_path == INSURANCE"

  # =========================================================================
  # Rule 2 — Combinatorial formulas across DIFFERENT modes
  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: copay_offset_waterfall_min_of_three_caps
        grounds:
          - calculations.copay_offset_calculation
          - entities.CopayCard.fields.per_fill_cap_cents
          - entities.CopayCard.fields.remaining_benefit_cents
          - entities.Claim.fields.copay_offset_cents
        distinguishing_aspect: |
          MODE (a): a 3-input non-linear formula offset = min(per_fill_cap 4000,
          remaining_benefit 50000, discounted 11200) where the binding cap is
          per_fill, so offset==4000 and net_cents==7200 — branch selection over
          three inputs, not a single tiered rate.
        test_recipe:
          setup:
            - "Member M with DISCOUNT-basis card for ATORVA at PH (dispense=200), quote discount=5500."
            - "A SUBMITTED claim quantity=2 (discounted=11200)."
            - "An ACTIVE CopayCard for ATORVA: max_benefit=50000, per_fill_cap=4000; a LINKED CopayLink to the claim."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-15T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /drugs"
              payload: { name: "Atorvastatin", ndc: "00071015523", dosage_mg: 20, form: "TABLET", awp_cents: 10000 }
              as: PlatformAdmin
              captures: { drug_id: $.data.id }
            - call: "POST /pharmacies"
              payload: { name: "PH One", chain_code: "CVS", state_code: "CA", dispense_fee_cents: 200 }
              as: PlatformAdmin
              captures: { ph_id: $.data.id }
            - call: "POST /price-quotes"
              payload: { drug_id: "${drug_id}", pharmacy_id: "${ph_id}", cash_price_cents: 7000, discount_price_cents: 5500, gold_price_cents: 5200, effective_at: "2026-05-01T00:00:00Z", expires_at: "2027-01-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /members"
              payload: { email: "m@x.com", full_name: "M One", state_code: "CA" }
              as: Anonymous
              captures: { m_id: $.data.id }
            - call: "POST /comparisons"
              payload: { member_id: "${m_id}", drug_id: "${drug_id}", state_code: "CA" }
              as: Member
              as_user_id: "${m_id}"
              captures: { cmp_id: $.data.id }
            - call: "POST /comparisons/${cmp_id}/run"
              payload: { member_id: "${m_id}" }
              as: Member
              as_user_id: "${m_id}"
            - call: "POST /discount-cards"
              payload: { member_id: "${m_id}", comparison_id: "${cmp_id}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { card_id: $.data.id }
            - call: "POST /claims"
              payload: { discount_card_id: "${card_id}", pharmacy_id: "${ph_id}", quantity: 2 }
              as: PharmacyOperator
              captures: { claim_id: $.data.id }
            - call: "POST /copay-cards"
              payload: { sponsor_name: "Pfizer", drug_id: "${drug_id}", max_benefit_cents: 50000, per_fill_cap_cents: 4000 }
              as: CopayCardSponsor
              captures: { cc_id: $.data.id }
            - call: "POST /copay-links"
              payload: { copay_card_id: "${cc_id}", member_id: "${m_id}", claim_id: "${claim_id}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { link_id: $.data.id }
          trigger:
            - call: "POST /claims/${claim_id}/adjudicate"
              payload: {}
              as: PharmacyOperator
              captures: { offset: $.data.copay_offset_cents, net: $.data.net_cents }
          assert:
            - "Claim.${claim_id}.copay_offset_cents == 4000"
            - "Claim.${claim_id}.net_cents == 7200"
            - "Claim.${claim_id}.savings_cents == 7000"
            - "CopayCard.${cc_id}.remaining_benefit_cents == 46000"

      - name: savings_net_pinned_eval_order_offset_before_floor
        grounds:
          - calculations.savings_calculation
          - calculations.copay_offset_calculation
          - entities.Claim.fields.net_cents
        distinguishing_aspect: |
          MODE (c): a circular-looking dependency — net_cents depends on
          copay_offset_cents, which is itself capped by discounted_cents (a
          component of net); the scaffold PINS the order (compute discounted ->
          compute offset over discounted -> net = max(discounted-offset,0)) so a
          full benefit (remaining 3000 binds) yields net==8200, not a negative.
        test_recipe:
          setup:
            - "Member M with DISCOUNT-basis card for ATORVA at PH (dispense=200), quote discount=5500, claim quantity=2 (discounted=11200)."
            - "ACTIVE CopayCard: max_benefit=3000, per_fill_cap=8000; LINKED CopayLink to the claim (remaining_benefit 3000 is the binding cap)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-15T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /drugs"
              payload: { name: "Atorvastatin", ndc: "00071015523", dosage_mg: 20, form: "TABLET", awp_cents: 10000 }
              as: PlatformAdmin
              captures: { drug_id: $.data.id }
            - call: "POST /pharmacies"
              payload: { name: "PH One", chain_code: "CVS", state_code: "CA", dispense_fee_cents: 200 }
              as: PlatformAdmin
              captures: { ph_id: $.data.id }
            - call: "POST /price-quotes"
              payload: { drug_id: "${drug_id}", pharmacy_id: "${ph_id}", cash_price_cents: 7000, discount_price_cents: 5500, gold_price_cents: 5200, effective_at: "2026-05-01T00:00:00Z", expires_at: "2027-01-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /members"
              payload: { email: "m2@x.com", full_name: "M Two", state_code: "CA" }
              as: Anonymous
              captures: { m_id: $.data.id }
            - call: "POST /comparisons"
              payload: { member_id: "${m_id}", drug_id: "${drug_id}", state_code: "CA" }
              as: Member
              as_user_id: "${m_id}"
              captures: { cmp_id: $.data.id }
            - call: "POST /comparisons/${cmp_id}/run"
              payload: { member_id: "${m_id}" }
              as: Member
              as_user_id: "${m_id}"
            - call: "POST /discount-cards"
              payload: { member_id: "${m_id}", comparison_id: "${cmp_id}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { card_id: $.data.id }
            - call: "POST /claims"
              payload: { discount_card_id: "${card_id}", pharmacy_id: "${ph_id}", quantity: 2 }
              as: PharmacyOperator
              captures: { claim_id: $.data.id }
            - call: "POST /copay-cards"
              payload: { sponsor_name: "Pfizer", drug_id: "${drug_id}", max_benefit_cents: 3000, per_fill_cap_cents: 8000 }
              as: CopayCardSponsor
              captures: { cc_id: $.data.id }
            - call: "POST /copay-links"
              payload: { copay_card_id: "${cc_id}", member_id: "${m_id}", claim_id: "${claim_id}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { link_id: $.data.id }
          trigger:
            - call: "POST /claims/${claim_id}/adjudicate"
              payload: {}
              as: PharmacyOperator
              captures: { net: $.data.net_cents, offset: $.data.copay_offset_cents }
          assert:
            - "Claim.${claim_id}.copay_offset_cents == 3000"
            - "Claim.${claim_id}.net_cents == 8200"
            - "Claim.${claim_id}.savings_cents == 6000"
            - "CopayCard.${cc_id}.remaining_benefit_cents == 0"
            - "CopayCard.${cc_id}.status == EXHAUSTED"

  # =========================================================================
  # Rule 3 — Non-linear state-machine shape on DIFFERENT entities
  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: gold_membership_parallel_billing_access_dimensions
        grounds:
          - state_machines.GoldMembership.PENDING_PAYMENT_to_PAID
          - state_machines.GoldMembership.access_status==ACTIVE_to_access_status==REVOKED
          - entities.GoldMembership.fields.billing_status
          - entities.GoldMembership.fields.access_status
        distinguishing_aspect: |
          GoldMembership carries two independent dimensions: a member-initiated
          revoke moves access_status ACTIVE->REVOKED while billing_status stays
          PAID — proving the two axes evolve independently on one row (parallel),
          a non-linear shape distinct from Claim's branching shape below.
        test_recipe:
          setup:
            - "Member M with a Gold membership that was paid (billing=PAID, access=ACTIVE)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-15T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /members"
              payload: { email: "g@x.com", full_name: "M Gold", state_code: "CA" }
              as: Anonymous
              captures: { m_id: $.data.id }
            - call: "POST /gold-memberships"
              payload: { member_id: "${m_id}", tier: "GOLD_INDIVIDUAL", coverage_start: "2026-05-01T00:00:00Z", coverage_end: "2026-12-31T00:00:00Z" }
              as: Member
              as_user_id: "${m_id}"
              captures: { gm_id: $.data.id }
            - call: "POST /gold-memberships/${gm_id}/record-payment"
              payload: {}
              as: PlatformAdmin
          trigger:
            - call: "POST /gold-memberships/${gm_id}/revoke"
              payload: { member_id: "${m_id}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { access: $.data.access_status, billing: $.data.billing_status }
          assert:
            - "GoldMembership.${gm_id}.access_status == REVOKED"
            - "GoldMembership.${gm_id}.billing_status == PAID"
            - "Member.${m_id}.active_gold_membership_id == null"

      - name: claim_branching_revert_cycle_reissues_card
        grounds:
          - state_machines.Claim.SUBMITTED_to_ADJUDICATED
          - state_machines.Claim.ADJUDICATED_to_REVERSED
          - state_machines.DiscountCard.REDEEMED_to_ISSUED
        distinguishing_aspect: |
          On the Claim entity (distinct from GoldMembership), SUBMITTED forks to
          ADJUDICATED, which can REVERSE; the reversal compensates the card back
          REDEEMED->ISSUED so a fresh claim can be re-adjudicated — a revert+cycle
          shape, not a one-way pipeline.
        test_recipe:
          setup:
            - "Member M, DISCOUNT card, claim adjudicated (card REDEEMED), no copay link."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-15T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /drugs"
              payload: { name: "Atorvastatin", ndc: "00071015523", dosage_mg: 20, form: "TABLET", awp_cents: 10000 }
              as: PlatformAdmin
              captures: { drug_id: $.data.id }
            - call: "POST /pharmacies"
              payload: { name: "PH One", chain_code: "CVS", state_code: "CA", dispense_fee_cents: 200 }
              as: PlatformAdmin
              captures: { ph_id: $.data.id }
            - call: "POST /price-quotes"
              payload: { drug_id: "${drug_id}", pharmacy_id: "${ph_id}", cash_price_cents: 7000, discount_price_cents: 5500, gold_price_cents: 5200, effective_at: "2026-05-01T00:00:00Z", expires_at: "2027-01-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /members"
              payload: { email: "m3@x.com", full_name: "M Three", state_code: "CA" }
              as: Anonymous
              captures: { m_id: $.data.id }
            - call: "POST /comparisons"
              payload: { member_id: "${m_id}", drug_id: "${drug_id}", state_code: "CA" }
              as: Member
              as_user_id: "${m_id}"
              captures: { cmp_id: $.data.id }
            - call: "POST /comparisons/${cmp_id}/run"
              payload: { member_id: "${m_id}" }
              as: Member
              as_user_id: "${m_id}"
            - call: "POST /discount-cards"
              payload: { member_id: "${m_id}", comparison_id: "${cmp_id}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { card_id: $.data.id }
            - call: "POST /claims"
              payload: { discount_card_id: "${card_id}", pharmacy_id: "${ph_id}", quantity: 2 }
              as: PharmacyOperator
              captures: { claim_id: $.data.id }
            - call: "POST /claims/${claim_id}/adjudicate"
              payload: {}
              as: PharmacyOperator
              captures: { claim_v: $.data.version }
          trigger:
            - call: "POST /claims/${claim_id}/reverse"
              payload: { expected_claim_version: "${claim_v}" }
              as: PharmacyOperator
              captures: { st: $.data.status }
          assert:
            - "Claim.${claim_id}.status == REVERSED"
            - "DiscountCard.${card_id}.status == ISSUED"

  # =========================================================================
  # Rule 4 — Transitive cascade chains from DIFFERENT triggers
  # =========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: adjudicate_claim_link_copaycard_exhaust_depth3
        grounds:
          - state_machines.Claim.SUBMITTED_to_ADJUDICATED
          - state_machines.CopayLink.LINKED_to_APPLIED
          - state_machines.CopayCard.ACTIVE_to_EXHAUSTED
        distinguishing_aspect: |
          Depth-3 chain triggered by claim adjudication: adjudicate mutates the
          Claim (A) -> that mutation flips the linked CopayLink LINKED->APPLIED (B)
          -> drawing the link's offset down to 0 flips the CopayCard ACTIVE->
          EXHAUSTED (C). Each hop is caused by the previous, not by the action.
        test_recipe:
          setup:
            - "DISCOUNT card, SUBMITTED claim quantity=2 (discounted=11200)."
            - "ACTIVE CopayCard max_benefit=3000 per_fill_cap=8000, LINKED to the claim (remaining 3000 binds -> draws to 0)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-15T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /drugs"
              payload: { name: "Atorvastatin", ndc: "00071015523", dosage_mg: 20, form: "TABLET", awp_cents: 10000 }
              as: PlatformAdmin
              captures: { drug_id: $.data.id }
            - call: "POST /pharmacies"
              payload: { name: "PH One", chain_code: "CVS", state_code: "CA", dispense_fee_cents: 200 }
              as: PlatformAdmin
              captures: { ph_id: $.data.id }
            - call: "POST /price-quotes"
              payload: { drug_id: "${drug_id}", pharmacy_id: "${ph_id}", cash_price_cents: 7000, discount_price_cents: 5500, gold_price_cents: 5200, effective_at: "2026-05-01T00:00:00Z", expires_at: "2027-01-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /members"
              payload: { email: "m4@x.com", full_name: "M Four", state_code: "CA" }
              as: Anonymous
              captures: { m_id: $.data.id }
            - call: "POST /comparisons"
              payload: { member_id: "${m_id}", drug_id: "${drug_id}", state_code: "CA" }
              as: Member
              as_user_id: "${m_id}"
              captures: { cmp_id: $.data.id }
            - call: "POST /comparisons/${cmp_id}/run"
              payload: { member_id: "${m_id}" }
              as: Member
              as_user_id: "${m_id}"
            - call: "POST /discount-cards"
              payload: { member_id: "${m_id}", comparison_id: "${cmp_id}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { card_id: $.data.id }
            - call: "POST /claims"
              payload: { discount_card_id: "${card_id}", pharmacy_id: "${ph_id}", quantity: 2 }
              as: PharmacyOperator
              captures: { claim_id: $.data.id }
            - call: "POST /copay-cards"
              payload: { sponsor_name: "Pfizer", drug_id: "${drug_id}", max_benefit_cents: 3000, per_fill_cap_cents: 8000 }
              as: CopayCardSponsor
