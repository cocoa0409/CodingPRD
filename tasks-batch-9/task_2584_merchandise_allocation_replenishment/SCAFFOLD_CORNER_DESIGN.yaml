          assert:
            - "The lock returns 200 with status == LOCKED, version == 3, locked_at == 2026-08-01T00:00:00Z and lock_reason == month-end freeze"
            - "The unlock returns 200 with status == ACTIVE, version == 4, locked_at == null AND lock_reason == null - both fields are cleared, not left stale"
            - "The second lock returns status == LOCKED, version == 5, locked_at == 2026-08-01T00:00:00Z and lock_reason == quarter close"
            - "The close is accepted FROM LOCKED and returns status == CLOSED with version == 6"
            - "Cascade - Receipt.${rcpt_id}.status == CLOSED, with units_received still 10, units_committed 0 and units_unallocated 10"
            - "Cascade - AssortmentAction.${a1_id}.status == CANCELLED, with its snapshot fields untouched (broken_size_count 4, markdown_pct_bp 4500, units_at_detection 0)"
            - "AllocationProgram.${prog_id}.total_units_received is still 10 after the close, because CLOSED receipts remain in the rollup"
            - "Store 0101, the position, the size profile and the item are NOT touched by the program close: the store is still ACTIVE and the position still BROKEN"
      - name: invalid_from_state_triggers_rejected_on_program_store_and_promo
        claim_type: invalid_transitions
        grounds:
          - state_machines[AllocationProgram].transitions
          - state_machines[Store].transitions
          - state_machines[PromoEvent].transitions
          - validations[priority:8]
          - errors.ERR_INVALID_STATE_TRANSITION
        distinguishing_aspect: |
          For each state of these three machines, every trigger that is NOT declared from it must be a 409
          ERR_INVALID_STATE_TRANSITION and must leave the entity exactly where it was. The probes are chosen
          to be plausible rather than absurd: unlock and close from PLANNING (both only exist from ACTIVE or
          LOCKED), a Store jumping ACTIVE -> CLOSED without passing through CLOSING, the two REMODEL/CLOSING
          cross-edges that the Store machine deliberately omits, and a PromoEvent activated or ended before it
          has been scheduled. Nine calls, five of which must fail and four of which must succeed, so a machine
          that simply rejects everything is caught too.
        test_recipe:
          setup:
            - "Program FA26 is still in PLANNING with stores 0101 and 0102 (both ACTIVE), a shelf plan for 0101, SizeProfile TOP-4SZ and SKU-1001"
            - "The program has never been locked, so locked_at is null"
            - "The declared Store edges are ACTIVE->REMODEL, REMODEL->ACTIVE, ACTIVE->CLOSING and CLOSING->CLOSED, and nothing else"
            - "The declared PromoEvent edges out of DRAFT are DRAFT->SCHEDULED and DRAFT->CANCELLED only"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlanningAdmin
              as_user_id: "u-plan-1"
            - call: "POST /allocation/programs"
              payload: { name: "FA26 Core Tops", season_code: "FA26", banner_code: "NORTH" }
              as: PlanningAdmin
              as_user_id: "u-plan-1"
