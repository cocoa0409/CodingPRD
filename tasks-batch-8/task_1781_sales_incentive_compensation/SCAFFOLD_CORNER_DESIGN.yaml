  # ===========================================================================
  - section: cross_cutting_layers
    instances:
      - name: occ_stale_plan_version_on_revise
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[plan-revise-stale-version]"]
        distinguishing_aspect: "OCC on CompPlan.version: revise with the version observed after publish (2) succeeds and bumps to 3; a second revise replaying the stale version 2 is rejected with 412 ERR_STALE_PLAN_VERSION."
        test_recipe:
          setup: ["plan PUBLISHED (version 2 after publish)"]
          setup_api_calls:
            - { call: "POST /programs", payload: { name: "Prog OC1" }, as: CompAdmin, captures: { poc1: $.data.id } }
            - { call: "POST /plans", payload: { program_id: "${poc1}", name: "Plan OC1", effective_start_date: "2026-01-01", effective_end_date: "2026-12-31", curve_tiers: [{ attainment_floor_bps: 0, rate_bps: 1000 }] }, as: CompAdmin, as_user_id: "admin-1", captures: { plan_oc1: $.data.id } }
            - { call: "POST /plans/${plan_oc1}/publish", payload: {}, as: CompAdmin, as_user_id: "admin-2", captures: { plan_oc1_v: $.data.version } }
          trigger:
            - { call: "POST /plans/${plan_oc1}/revise", payload: { expected_plan_version: "${plan_oc1_v}" }, as: CompAdmin, as_user_id: "admin-2", captures: { oc1_v2: $.data.version, oc1_doc: $.data.document_version } }
            - { call: "POST /plans/${plan_oc1}/revise", payload: { expected_plan_version: "${plan_oc1_v}" }, as: CompAdmin, as_user_id: "admin-2", captures: { err_oc1: $.data.error_id } }
          assert:
            - "first revise: 200, version == ${plan_oc1_v} + 1, document_version == 2"
            - "second revise with stale expected_plan_version: HTTP 412, error_id == ERR_STALE_PLAN_VERSION; document_version stays 2"

      - name: occ_stale_program_version_on_close
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[program-close-stale-version]"]
        distinguishing_aspect: "OCC on CompProgram.version: close with the created version succeeds and advances the epoch; replaying the same stale version on the next close is rejected with 412 ERR_STALE_PROGRAM_VERSION."
        test_recipe:
          setup: ["program created (version 1)"]
          setup_api_calls:
            - { call: "POST /programs", payload: { name: "Prog OC2" }, as: CompAdmin, captures: { poc2: $.data.id, pv_oc2: $.data.version } }
          trigger:
            - { call: "POST /programs/${poc2}/close-period", payload: { expected_program_version: "${pv_oc2}" }, as: CompAdmin, captures: { oc2_period: "$.data.current_period_index", oc2_v: "$.data.version" } }
            - { call: "POST /programs/${poc2}/close-period", payload: { expected_program_version: "${pv_oc2}" }, as: CompAdmin, captures: { err_oc2: $.data.error_id } }
          assert:
            - "first close: 200, current_period_index == 2, version == ${pv_oc2} + 1"
            - "second close with stale expected_program_version: HTTP 412, error_id == ERR_STALE_PROGRAM_VERSION; current_period_index stays 2"

      - name: close_period_with_no_assignments
        claim_type: ops_run_checkpoint
        grounds: ["endpoints.POST_/programs/{programId}/close-period", "entities.CompProgram.fields.current_period_index"]
        distinguishing_aspect: "The epoch advance is well-defined on an empty program: no statements are generated, accrual stays 0, current_period_index increments to 2."
        test_recipe:
          setup: ["program with no assignments"]
          setup_api_calls:
            - { call: "POST /programs", payload: { name: "Prog EC2" }, as: CompAdmin, captures: { pec2: $.data.id, pv_ec2: $.data.version } }
          trigger:
            - { call: "POST /programs/${pec2}/close-period", payload: { expected_program_version: "${pv_ec2}" }, as: CompAdmin, captures: { ec2_period: "$.data.current_period_index", ec2_accr: "$.data.accrued_balance_cents" } }
            - { call: "GET /statements?period_index=1", as: CompAdmin }
          assert:
            - "current_period_index == 2, accrued_balance_cents == 0"
            - "GET /statements?period_index=1 returns an empty array"

      - name: attainment_resets_each_period
        claim_type: rate_threshold_triggers
        grounds: [entities.PlanAssignment.fields.current_period_earned_cents, calculations.period_settlement]
        distinguishing_aspect: "Threshold accumulators are per-period: after a 1200000 period 1 (attainment 12000), an empty period 2 closes with attainment 0 / gross 0 — the accelerator counter resets at each epoch boundary."
        test_recipe:
          setup: ["canonical 3-tier plan; accepted rep; transaction 1200000 in period 1; period 1 closed"]
          setup_api_calls:
            - { call: "POST /programs", payload: { name: "Prog RS" }, as: CompAdmin, captures: { prs: $.data.id, pv_rs: $.data.version } }
            - { call: "POST /plans", payload: { program_id: "${prs}", name: "Plan RS", effective_start_date: "2026-01-01", effective_end_date: "2026-12-31", curve_tiers: [{ attainment_floor_bps: 0, rate_bps: 1000 }, { attainment_floor_bps: 8000, rate_bps: 1500 }, { attainment_floor_bps: 10000, rate_bps: 2500 }] }, as: CompAdmin, as_user_id: "admin-1", captures: { plan_rs: $.data.id } }
            - { call: "POST /plans/${plan_rs}/publish", payload: {}, as: CompAdmin, as_user_id: "admin-2" }
            - { call: "POST /reps", payload: { program_id: "${prs}", name: "Rep RS", employee_ref: "RS-R1" }, as: CompAdmin, captures: { rrs: $.data.id } }
            - { call: "POST /assignments", payload: { program_id: "${prs}", rep_id: "${rrs}", plan_id: "${plan_rs}", quota_cents: 1000000, effective_start_date: "2026-01-01" }, as: CompAdmin, captures: { asg_rs: $.data.id } }
            - { call: "POST /assignments/${asg_rs}/accept", payload: {}, as: Rep, as_user_id: "${rrs}" }
            - { call: "POST /transactions", payload: { program_id: "${prs}", external_ref: "RS-T1", amount_cents: 1200000, transaction_date: "2026-02-01", splits: [{ rep_id: "${rrs}", split_bps: 10000 }] }, as: CompAnalyst }
            - { call: "POST /programs/${prs}/close-period", payload: { expected_program_version: "${pv_rs}" }, as: CompAdmin, captures: { pv_rs2: $.data.version } }
          trigger:
            - { call: "POST /programs/${prs}/close-period", payload: { expected_program_version: "${pv_rs2}" }, as: CompAdmin }
            - { call: "GET /statements?assignment_id=${asg_rs}&period_index=1", as: CompAdmin, captures: { rs1_att: "$.data[0].attainment_bps", rs1_gross: "$.data[0].gross_payout_cents" } }
            - { call: "GET /statements?assignment_id=${asg_rs}&period_index=2", as: CompAdmin, captures: { rs2_att: "$.data[0].attainment_bps", rs2_gross: "$.data[0].gross_payout_cents" } }
            - { call: "GET /assignments/${asg_rs}", as: CompAdmin, captures: { rs_earned_now: "$.data.current_period_earned_cents" } }
          assert:
            - "period 1 statement: attainment_bps == 12000, gross_payout_cents == 160000"
            - "period 2 statement: attainment_bps == 0, gross_payout_cents == 0 (accumulator reset at epoch boundary)"
            - "PlanAssignment.${asg_rs}.current_period_earned_cents == 0 after both closes"

      - name: rollup_cascade_layer
        claim_type: cascading_side_effects
        grounds: [complexity_profile.complexity_layers]
        excluded_because:
          difficulty_instance: transaction_posting_rollup_chain
          rationale: "The 3-link cascade (transaction -> direct credit -> rollup credit -> manager earned) is asserted end-to-end by the named §1.8 instance."

      - name: clawback_cascade_layer
        claim_type: cascading_side_effects
        grounds: [complexity_profile.complexity_layers]
        excluded_because:
          difficulty_instance: transaction_cancel_clawback_chain
          rationale: "The cancel -> reverse -> clawback-adjustment cascade is asserted by the named §1.8 instance."

  # ===========================================================================
  - section: consistency_model
    instances:
      - name: immediate_read_after_write
        claim_type: immediate_consistency
        grounds: [complexity_profile.consistency_model]
        distinguishing_aspect: "Immediate consistency: the POST /transactions response already shows BOOKED, and a subsequent GET of the assignment reflects the earned increment in the same request chain (no lag)."
        test_recipe:
          setup: ["program, published plan, accepted rep"]
          setup_api_calls:
            - { call: "POST /programs", payload: { name: "Prog IC" }, as: CompAdmin, captures: { pic: $.data.id } }
            - { call: "POST /plans", payload: { program_id: "${pic}", name: "Plan IC", effective_start_date: "2026-01-01", effective_end_date: "2026-12-31", curve_tiers: [{ attainment_floor_bps: 0, rate_bps: 1000 }] }, as: CompAdmin, as_user_id: "admin-1", captures: { plan_ic: $.data.id } }
            - { call: "POST /plans/${plan_ic}/publish", payload: {}, as: CompAdmin, as_user_id: "admin-2" }
            - { call: "POST /reps", payload: { program_id: "${pic}", name: "Rep IC", employee_ref: "IC-R1" }, as: CompAdmin, captures: { ric: $.data.id } }
            - { call: "POST /assignments", payload: { program_id: "${pic}", rep_id: "${ric}", plan_id: "${plan_ic}", quota_cents: 1000000, effective_start_date: "2026-01-01" }, as: CompAdmin, captures: { asg_ic: $.data.id } }
            - { call: "POST /assignments/${asg_ic}/accept", payload: {}, as: Rep, as_user_id: "${ric}" }
          trigger:
            - { call: "POST /transactions", payload: { program_id: "${pic}", external_ref: "IC-T1", amount_cents: 200000, transaction_date: "2026-02-01", splits: [{ rep_id: "${ric}", split_bps: 10000 }] }, as: CompAnalyst, captures: { txn_ic: $.data.id, txn_ic_status: "$.data.status" } }
            - { call: "GET /assignments/${asg_ic}", as: CompAdmin, captures: { ic_earned: "$.data.current_period_earned_cents", ic_att: "$.data.current_attainment_bps", ic_prov: "$.data.provisional_period_payout_cents" } }
          assert:
            - "create response: status == BOOKED"
            - "immediately after: current_period_earned_cents == 200000, current_attainment_bps == 2000, provisional_period_payout_cents == 20000 (10% flat curve)"
