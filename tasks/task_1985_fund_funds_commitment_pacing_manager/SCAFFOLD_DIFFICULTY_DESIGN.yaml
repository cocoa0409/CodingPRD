  - rule_id: non_linear_state_machine
    instances:
      - name: dd_review_submit_info_request_resubmit_cycle
        grounds:
          - state_machines.DueDiligenceReview.SUBMITTED_to_INFO_REQUESTED
          - state_machines.DueDiligenceReview.INFO_REQUESTED_to_SUBMITTED
          - calculations.dd_composite_score
        distinguishing_aspect: |
          Cyclic machine on DueDiligenceReview: SUBMITTED -> INFO_REQUESTED ->
          SUBMITTED may loop repeatedly, and each resubmit RECOMPUTES
          composite_score from the latest scores — the loop is not a no-op,
          the composite reflects score edits made while INFO_REQUESTED.
        test_recipe:
          setup:
            - "Manager + vehicle in IN_DILIGENCE with review round 1 DRAFT"
            - "Scores 60/60/60/60 -> composite 60.00 after first submit"
            - "IC requests info; analyst raises all scores to 90 and resubmits"
          setup_api_calls:
            - call: "POST /fof/staff-users"
              payload: { display_name: "Ana Five", staff_role: "ANALYST", email: "ana5@x.com" }
              as: CIO
