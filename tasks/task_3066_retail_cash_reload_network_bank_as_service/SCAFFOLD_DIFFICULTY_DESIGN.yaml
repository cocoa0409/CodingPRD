            - call: "POST /v1/load-transactions/${ld1}/reverse"
              payload: { reversal_reason: "DISPUTE_FAVOR_CARDHOLDER", expected_load_transaction_version: "${ld_v1}" }
              as: ComplianceAnalyst
              captures: { ld_v2: $.data.version }
            - call: "GET /v1/card-accounts/${acct_id}"
              payload: {}
              as: ProgramManager
              as_user_id: "${prog_id}"
              captures: { acct_v2: $.data.version }
            - call: "POST /v1/load-transactions/${ld1}/reinstate"
              payload: { expected_card_account_version: "${acct_v2}", expected_load_transaction_version: "${ld_v2}" }
              as: ComplianceOfficer
            - call: "POST /v1/aml-alerts"
              payload: { program_id: "${prog_id}", card_account_id: "${acct_id}", alert_type: "VELOCITY", window_start_at: "2026-09-01T00:00:00Z", window_end_at: "2026-09-02T00:00:00Z" }
              as: ComplianceAnalyst
              captures: { alert_id: $.data.id }
          trigger:
            - call: "POST /v1/aml-alerts/${alert_id}/review"
              payload: { resolution_note: "velocity spike" }
              as: ComplianceAnalyst
            - call: "POST /v1/aml-alerts/${alert_id}/dismiss"
              payload: {}
              as: ComplianceOfficer
              captures: { err_dismiss: $.data.error_id }
            - call: "POST /v1/aml-alerts/${alert_id}/reopen"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /v1/aml-alerts/${alert_id}/dismiss"
              payload: {}
              as: ComplianceOfficer
              captures: { err_dismiss2: $.data.error_id }
          assert:
            - "the dismiss attempt on an OPEN alert returns error_id == ERR_INVALID_STATE (dismiss is open only from UNDER_REVIEW)"
            - "the reopen of an OPEN alert returns error_id == ERR_INVALID_STATE (reopen is open only from CONFIRMED)"
            - "the second dismiss attempt also returns ERR_INVALID_STATE; every exit from OPEN is closed in this state"
            - "AmlAlert.${alert_id}.alert_status is still OPEN and Program.${prog_id}.posture_breach_count == 0 at the end"
            - "invariant: posture_breach_count == CONFIRMED alerts + COMPLIANCE-suspended brands == 0, and it was 0 at every step of the chain (no drift accumulated by the refused transitions)"
