              as: SystemAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /nac/contracts"
              payload: { operator_id: "${op_id}", contract_code: "HLG-2026", rebate_funding_manufacturer_id: "${mfg_id}", effective_from: "2026-08-01T00:00:00Z", effective_to: "2027-07-31T23:59:59Z" }
              as: NationalAccountManager
              captures: { ct_id: $.data.id }
            - call: "POST /nac/contract-tiers"
              payload: { contract_id: "${ct_id}", product_class_code: "PROTEIN", cost_basis: "LAST_COST", markup_type: "PERCENT_OF_COST", markup_value: 12.50, min_case_volume: 0 }
              as: NationalAccountManager
            - call: "POST /nac/dc-coverages"
              payload: { contract_id: "${ct_id}", distribution_center_id: "${dc_id}", coverage_type: "IN_MARKET", coverage_from: "2026-08-01T00:00:00Z", coverage_to: "2027-07-31T23:59:59Z" }
              as: NationalAccountManager
            - call: "POST /nac/contracts/${ct_id}/submit-for-signature"
              payload: {}
              as: NationalAccountManager
            - call: "POST /nac/contracts/${ct_id}/sign"
              payload: {}
              as: OperatorBuyer
              as_user_id: "${op_id}"
            - call: "POST /nac/contracts/${ct_id}/suspend"
              payload: { note: "Credit hold pending operator review" }
              as: NationalAccountManager
              captures: { ct_ver: $.data.version }
          trigger:
            - call: "POST /nac/deviation-agreements"
              payload: { contract_id: "${ct_id}", product_id: "${prod_id}", manufacturer_id: "${mfg_id}", bill_back_basis: "COST_PLUS_PROTECTED", protected_discount_cents: 100, max_operator_price_cents: 4000, effective_from: "2026-08-01T00:00:00Z", effective_to: "2026-11-01T00:00:00Z", expected_contract_version: "${ct_ver}" }
              as: PricingAnalyst
