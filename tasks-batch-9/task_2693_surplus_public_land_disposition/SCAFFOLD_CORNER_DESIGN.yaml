# SCAFFOLD_CORNER_DESIGN.yaml - Table 1.9 Scaffold Corner Design
#
# Breadth probe over the nine claim-extraction-guide sections. Every claim_type
# below is a row of references/claim-extraction-guide.md; no category is invented
# (the rbac label exclusive_operations is the guide's Table 7 bullet
# "Cannot perform other roles' exclusive_operations -> ERR_UNAUTHORIZED").
# Corners already asserted by SCAFFOLD_DIFFICULTY_DESIGN.yaml carry an
# excluded_because stub and no test_recipe.
#
# Fixed clock default assumed by every chain: 2026-08-01T00:00:00Z.
# Segregation-of-duties user ids reused from SCAFFOLD_DIFFICULTY_DESIGN.yaml:
#   clerk-adopt-1, clerk-determine-1, clerk-determine-2, clerk-authorize-1,
#   clerk-award-1.

scaffold_corner_design:
  - section: entities
    instances:
      - name: create_parcel_returns_201_with_all_declared_fields
        claim_type: creation
        grounds:
          - entities.Parcel
          - endpoints[POST /parcels]
          - response_envelope.success
        distinguishing_aspect: "POST /parcels with all six input fields returns HTTP 201 and echoes apn, address, acreage, zoning_code, book_value_cents and custodian_agency_id, plus the system defaults ownership_status AGENCY_OWNED, valuation_status UNVALUED, open_title_item_count 0 and disposition_ready false, wrapped in the meta/response_type/data envelope with response_type object."
        test_recipe:
          setup:
            - "An empty database plus one custodian Agency to satisfy the custodian_agency_id foreign key."
          setup_api_calls:
            - call: "POST /agencies"
              payload: { name: "City of Riverbend", agency_type: "MUNICIPAL", contact_email: "realproperty@riverbend.gov" }
              as: SystemAdministrator
              captures: { cust_agency_id: "$.data.id" }
          trigger:
            - call: "POST /parcels"
              payload: { apn: "APN-2693-101", address: "9 Canal Street", acreage: 3.1, zoning_code: "M-1", book_value_cents: 70000000, custodian_agency_id: "${cust_agency_id}" }
              as: RealPropertyOfficer
              captures: { parcel_id: "$.data.id" }
          assert:
            - "the response status is HTTP 201 and response_type == object"
            - "data.apn == APN-2693-101, data.address == 9 Canal Street, data.acreage == 3.1, data.zoning_code == M-1"
            - "data.book_value_cents == 70000000 and data.custodian_agency_id == ${cust_agency_id}"
            - "data.ownership_status == AGENCY_OWNED and data.valuation_status == UNVALUED"
            - "data.open_title_item_count == 0 and data.disposition_ready == false"
            - "data.id, data.created_at, data.updated_at and data.version are all present and data.version == 1"
            - "meta.api_request_id and meta.api_request_timestamp are present on the response"

      - name: get_parcel_by_id_returns_stored_entity
        claim_type: retrieval
        grounds:
          - endpoints[GET /parcels/{id}]
          - entities.Parcel
        distinguishing_aspect: "GET /parcels/{id} returns exactly the row POST /parcels stored: the same id and the same six input field values, with no field dropped or renamed, and it is readable by all eight roles because §1.5 lists every role on that endpoint."
        test_recipe:
          setup:
            - "One custodian Agency and one Parcel created through the API."
          setup_api_calls:
            - call: "POST /agencies"
              payload: { name: "City of Riverbend", agency_type: "MUNICIPAL", contact_email: "realproperty@riverbend.gov" }
              as: SystemAdministrator
              captures: { cust_agency_id: "$.data.id" }
            - call: "POST /parcels"
              payload: { apn: "APN-2693-102", address: "11 Canal Street", acreage: 2.5, zoning_code: "C-2", book_value_cents: 51000000, custodian_agency_id: "${cust_agency_id}" }
              as: RealPropertyOfficer
              captures: { parcel_id: "$.data.id" }
          trigger:
            - call: "GET /parcels/${parcel_id}"
              payload: {}
              as: Bidder
              as_user_id: "any-bidder-probe"
          assert:
            - "the response status is HTTP 200 and response_type == object"
            - "data.id == ${parcel_id}"
            - "data.apn == APN-2693-102 and data.acreage == 2.5 and data.zoning_code == C-2"
            - "data.book_value_cents == 51000000 and data.custodian_agency_id == ${cust_agency_id}"
            - "data.ownership_status == AGENCY_OWNED and data.valuation_status == UNVALUED"

      - name: list_parcels_filtered_by_custodian_agency_returns_paginated_envelope
        claim_type: listing
        grounds:
          - endpoints[GET /parcels]
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: "GET /parcels?custodian_agency_id=A&limit=2&offset=1 over three parcels of agency A and one of agency B returns response_type array with exactly 2 rows, total_count 3, has_more true, limit 2 and offset 1 - the filter is applied BEFORE the count, so total_count is 3 and not 4."
        test_recipe:
          setup:
            - "Two Agencies A (City of Riverbend) and B (Riverbend Transit District)."
            - "Three Parcels custodied by A (APN-2693-103, APN-2693-104, APN-2693-105) and one custodied by B (APN-2693-106)."
          setup_api_calls:
            - call: "POST /agencies"
              payload: { name: "City of Riverbend", agency_type: "MUNICIPAL", contact_email: "realproperty@riverbend.gov" }
              as: SystemAdministrator
              captures: { agency_a_id: "$.data.id" }
            - call: "POST /agencies"
              payload: { name: "Riverbend Transit District", agency_type: "TRANSIT", contact_email: "clerk@rtd.gov" }
              as: SystemAdministrator
              captures: { agency_b_id: "$.data.id" }
            - call: "POST /parcels"
              payload: { apn: "APN-2693-103", address: "3 Canal Street", acreage: 1.0, zoning_code: "M-1", book_value_cents: 30000000, custodian_agency_id: "${agency_a_id}" }
              as: RealPropertyOfficer
            - call: "POST /parcels"
              payload: { apn: "APN-2693-104", address: "4 Canal Street", acreage: 1.0, zoning_code: "M-1", book_value_cents: 31000000, custodian_agency_id: "${agency_a_id}" }
              as: RealPropertyOfficer
            - call: "POST /parcels"
              payload: { apn: "APN-2693-105", address: "5 Canal Street", acreage: 1.0, zoning_code: "M-1", book_value_cents: 32000000, custodian_agency_id: "${agency_a_id}" }
              as: RealPropertyOfficer
            - call: "POST /parcels"
              payload: { apn: "APN-2693-106", address: "6 Depot Road", acreage: 1.0, zoning_code: "M-1", book_value_cents: 33000000, custodian_agency_id: "${agency_b_id}" }
              as: RealPropertyOfficer
          trigger:
            - call: "GET /parcels"
              payload: { custodian_agency_id: "${agency_a_id}", limit: 2, offset: 1 }
              as: RealPropertyOfficer
          assert:
            - "the response status is HTTP 200 and response_type == array"
            - "data holds exactly 2 Parcel rows and every row has custodian_agency_id == ${agency_a_id}"
            - "total_count == 3, has_more == false, limit == 2 and offset == 1"
            - "no row with apn == APN-2693-106 appears in data"
            - "a second call with limit 2 and offset 0 returns 2 rows with total_count 3 and has_more == true"

      - name: get_parcel_with_unknown_id_returns_parcel_not_found
        claim_type: not_found
        grounds:
          - validations[priority=9]
          - errors[ERR_PARCEL_NOT_FOUND]
          - response_envelope.error
        distinguishing_aspect: "GET /parcels/{id} with an id no POST ever minted returns HTTP 404 with response_type error and data.error_id == ERR_PARCEL_NOT_FOUND - not 200 with a null body and not ERR_INVALID_REQUEST."
        test_recipe:
          setup:
            - "An empty database; no Parcel has ever been created."
          setup_api_calls:
            - call: "POST /agencies"
              payload: { name: "City of Riverbend", agency_type: "MUNICIPAL", contact_email: "realproperty@riverbend.gov" }
              as: SystemAdministrator
          trigger:
            - call: "GET /parcels/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: RealPropertyOfficer
          assert:
            - "the response status is HTTP 404 and response_type == error"
            - "data.error_id == ERR_PARCEL_NOT_FOUND and data.message is a non-empty string"
            - "no Parcel row exists in the store"

      - name: create_parcel_missing_required_apn_returns_invalid_request
        claim_type: required_fields
        grounds:
          - validations[priority=8]
          - entities.Parcel.fields.apn
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "apn is source input with no default, so omitting it from POST /parcels returns HTTP 400 with data.error_id == ERR_INVALID_REQUEST and persists nothing - the row is not created with a null apn."
        test_recipe:
          setup:
            - "One custodian Agency so the only defect in the request is the missing apn."
          setup_api_calls:
            - call: "POST /agencies"
              payload: { name: "City of Riverbend", agency_type: "MUNICIPAL", contact_email: "realproperty@riverbend.gov" }
              as: SystemAdministrator
              captures: { cust_agency_id: "$.data.id" }
          trigger:
            - call: "POST /parcels"
              payload: { address: "9 Canal Street", acreage: 3.1, zoning_code: "M-1", book_value_cents: 70000000, custodian_agency_id: "${cust_agency_id}" }
              as: RealPropertyOfficer
          assert:
            - "the response status is HTTP 400 and response_type == error"
            - "data.error_id == ERR_INVALID_REQUEST"
            - "GET /parcels returns total_count == 0"

      - name: create_agency_omitting_is_preference_entity_applies_default_false
        claim_type: defaults
        grounds:
          - entities.Agency.fields.is_preference_entity
          - entities.Agency.fields.preference_category
          - entities.Agency.fields.notice_registry_status
          - endpoints[POST /agencies]
        distinguishing_aspect: "Omitting the three defaulted Agency fields yields is_preference_entity false, preference_category NONE and notice_registry_status REGISTERED in the create response - the defaults are materialised at creation, not left null for a later read to fill in."
        test_recipe:
          setup:
            - "An empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /agencies"
              payload: { name: "Riverbend Transit District", agency_type: "TRANSIT", contact_email: "clerk@rtd.gov" }
              as: SystemAdministrator
              captures: { agency_id: "$.data.id" }
          assert:
            - "the response status is HTTP 201"
            - "data.is_preference_entity == false"
            - "data.preference_category == NONE"
            - "data.notice_registry_status == REGISTERED"
            - "GET /agencies with is_preference_entity false returns total_count == 1 including ${agency_id}"

      - name: create_parcel_system_fields_input_ignored
        claim_type: system_fields
        grounds:
          - entities.Parcel.fields.ownership_status
          - entities.Parcel.fields.valuation_status
          - entities.Parcel.fields.disposition_ready
          - validations[priority=8]
        distinguishing_aspect: "Client-supplied values for the system and computed Parcel fields are IGNORED rather than honoured or rejected: a POST /parcels body carrying ownership_status CONVEYED, valuation_status CURRENT, disposition_ready true and a client-chosen id still returns 201 with ownership_status AGENCY_OWNED, valuation_status UNVALUED, disposition_ready false and a server-minted id."
        test_recipe:
          setup:
            - "One custodian Agency."
          setup_api_calls:
            - call: "POST /agencies"
              payload: { name: "City of Riverbend", agency_type: "MUNICIPAL", contact_email: "realproperty@riverbend.gov" }
              as: SystemAdministrator
              captures: { cust_agency_id: "$.data.id" }
          trigger:
            - call: "POST /parcels"
              payload: { apn: "APN-2693-107", address: "7 Canal Street", acreage: 1.4, zoning_code: "M-1", book_value_cents: 20000000, custodian_agency_id: "${cust_agency_id}", ownership_status: "CONVEYED", valuation_status: "CURRENT", disposition_ready: true, open_title_item_count: 9, id: "client-chosen-id-2693", version: 42 }
              as: RealPropertyOfficer
              captures: { parcel_id: "$.data.id" }
          assert:
            - "the response status is HTTP 201, not 400"
            - "data.ownership_status == AGENCY_OWNED and data.valuation_status == UNVALUED"
            - "data.disposition_ready == false and data.open_title_item_count == 0"
            - "data.id != client-chosen-id-2693 and data.version == 1"
            - "GET /parcels/${parcel_id} confirms the same ignored values are what was persisted"

      - name: create_agency_with_invalid_enum_agency_type_rejected
        claim_type: type_constraints
        grounds:
          - entities.Agency.fields.agency_type
          - validations[priority=8]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "agency_type is a closed enum, so the undeclared member SPACE_AGENCY returns HTTP 400 ERR_INVALID_REQUEST; the enum is validated as a set membership test, not merely as a string type check."
        test_recipe:
          setup:
            - "An empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /agencies"
              payload: { name: "Orbital Works", agency_type: "SPACE_AGENCY", contact_email: "ops@orbital.example" }
              as: SystemAdministrator
          assert:
            - "the response status is HTTP 400 and response_type == error"
            - "data.error_id == ERR_INVALID_REQUEST"
            - "GET /agencies returns total_count == 0"

      - name: create_appraisal_with_unknown_parcel_id_returns_not_found
        claim_type: parent_relationships
        grounds:
          - validations[priority=10]
          - entities.Appraisal.parent
          - errors[ERR_PARCEL_NOT_FOUND]
        distinguishing_aspect: "Appraisal declares Parcel as its parent, so a POST /appraisals body whose parcel_id names no existing row returns HTTP 404 ERR_PARCEL_NOT_FOUND - body foreign keys are resolved with the same 404 discipline as path parameters, and the appraiser_id that DOES resolve is not enough to make the call succeed."
        test_recipe:
          setup:
            - "One custodian Agency, one Appraiser and one real Parcel whose version is captured, so every part of the request except parcel_id is valid."
          setup_api_calls:
            - call: "POST /agencies"
              payload: { name: "City of Riverbend", agency_type: "MUNICIPAL", contact_email: "realproperty@riverbend.gov" }
              as: SystemAdministrator
              captures: { cust_agency_id: "$.data.id" }
            - call: "POST /parcels"
              payload: { apn: "APN-2693-108", address: "8 Canal Street", acreage: 1.0, zoning_code: "M-1", book_value_cents: 25000000, custodian_agency_id: "${cust_agency_id}" }
              as: RealPropertyOfficer
              captures: { parcel_id: "$.data.id", parcel_v: "$.data.version" }
            - call: "POST /appraisers"
              payload: { name: "Dana Kirkwood MAI", license_number: "AG-44201", license_expires_on: "2028-01-01T00:00:00Z" }
              as: SystemAdministrator
              captures: { appraiser_id: "$.data.id" }
          trigger:
            - call: "POST /appraisals"
              payload: { parcel_id: "00000000-0000-0000-0000-000000000000", appraiser_id: "${appraiser_id}", method: "SALES_COMPARISON", engagement_start_on: "2026-08-02T00:00:00Z", engagement_end_on: "2026-08-20T00:00:00Z", expected_parcel_version: "${parcel_v}" }
              as: RealPropertyOfficer
          assert:
            - "the response status is HTTP 404 and data.error_id == ERR_PARCEL_NOT_FOUND"
            - "GET /appraisals returns total_count == 0"
            - "Parcel.${parcel_id}.version is still ${parcel_v} - the rejected create consumed no OCC token"
            - "Appraiser.${appraiser_id}.active_engagement_count == 0"

      - name: negotiation_round_is_immutable_with_no_update_endpoint
        claim_type: immutability
        grounds:
          - entities.NegotiationRound
          - endpoints[POST /preference-offers/{id}/rounds]
          - endpoints[GET /preference-offers/{id}/rounds]
        distinguishing_aspect: "NegotiationRound declares common_fields false, so its create response carries id and created_at but NO updated_at and NO version field, and §1.5 declares no PATCH or DELETE on any /rounds path - a negotiation round is an append-only audit record."
        test_recipe:
          setup:
            - "One custodian Agency and one AFFORDABLE_HOUSING preference-entity Agency."
            - "One Parcel with an ACCEPTED Appraisal at 100000000 so the PreferenceOffer's ah_minimum_price_cents is computable."
            - "The declaration ADOPTED and NOTICED, with the preference entity having responded EXPRESS_INTEREST, which created a PreferenceOffer with negotiation_status OPEN."
          setup_api_calls:
            - call: "POST /agencies"
              payload: { name: "City of Riverbend", agency_type: "MUNICIPAL", contact_email: "realproperty@riverbend.gov" }
              as: SystemAdministrator
              captures: { cust_agency_id: "$.data.id" }
            - call: "POST /agencies"
              payload: { name: "Riverbend Housing Authority", agency_type: "HOUSING_AUTHORITY", contact_email: "director@rha.gov", is_preference_entity: true, preference_category: "AFFORDABLE_HOUSING" }
              as: SystemAdministrator
              captures: { ah_agency_id: "$.data.id" }
            - call: "POST /parcels"
              payload: { apn: "APN-2693-109", address: "9 Canal Street", acreage: 3.1, zoning_code: "M-1", book_value_cents: 40000000, custodian_agency_id: "${cust_agency_id}" }
              as: RealPropertyOfficer
              captures: { parcel_id: "$.data.id", parcel_v: "$.data.version" }
            - call: "POST /appraisers"
              payload: { name: "Dana Kirkwood MAI", license_number: "AG-44202", license_expires_on: "2028-01-01T00:00:00Z" }
              as: SystemAdministrator
              captures: { appraiser_id: "$.data.id" }
            - call: "POST /appraisals"
              payload: { parcel_id: "${parcel_id}", appraiser_id: "${appraiser_id}", method: "SALES_COMPARISON", engagement_start_on: "2026-08-02T00:00:00Z", engagement_end_on: "2026-08-20T00:00:00Z", expected_parcel_version: "${parcel_v}" }
              as: RealPropertyOfficer
              captures: { appraisal_id: "$.data.id" }
            - call: "POST /appraisals/${appraisal_id}/report"
              payload: { appraised_value_cents: 100000000, effective_date: "2026-08-01T00:00:00Z", narrative: "Sales comparison of four infill sales." }
              as: Appraiser
              as_user_id: "${appraiser_id}"
            - call: "POST /appraisals/${appraisal_id}/accept"
              payload: {}
              as: RealPropertyOfficer
            - call: "POST /declarations"
              payload: { parcel_id: "${parcel_id}", justification: "Canal Street yard is surplus after depot consolidation." }
              as: RealPropertyOfficer
              captures: { decl_id: "$.data.id" }
            - call: "POST /declarations/${decl_id}/adopt"
              payload: { resolution_number: "RES-2026-201" }
              as: BoardClerk
              as_user_id: "clerk-adopt-1"
            - call: "POST /declarations/${decl_id}/issue-notices"
              payload:
                recipient_agency_ids: ["${ah_agency_id}"]
                response_window_days: 60
              as: RealPropertyOfficer
            - call: "GET /notices"
              payload: { declaration_id: "${decl_id}" }
              as: RealPropertyOfficer
              captures: { notice_id: "$.data[0].id" }
            - call: "POST /notices/${notice_id}/respond"
              payload: { response_type: "EXPRESS_INTEREST", claimed_preference_category: "AFFORDABLE_HOUSING", intended_use: "62 units of deed-restricted affordable housing" }
              as: AgencyRepresentative
              as_user_id: "${ah_agency_id}"
            - call: "GET /preference-offers"
              payload: { declaration_id: "${decl_id}" }
              as: RealPropertyOfficer
              captures: { offer_id: "$.data[0].id" }
          trigger:
            - call: "POST /preference-offers/${offer_id}/rounds"
              payload: { party: "CUSTODIAN_AGENCY", price_offered_cents: 66000000, terms_summary: "Opening position at the affordable-housing floor plus carrying costs." }
              as: RealPropertyOfficer
              captures: { round_id: "$.data.id" }
          assert:
            - "the response status is HTTP 201 and data.round_number == 1"
            - "data.id and data.created_at are present"
            - "data has NO updated_at field and NO version field"
            - "GET /preference-offers/${offer_id}/rounds returns exactly 1 row whose id == ${round_id}, and that row also carries no version field"
            - "§1.5 declares no PATCH, PUT or DELETE endpoint on /preference-offers/{id}/rounds or on any /rounds/{id} path"

  - section: state_machines
    instances:
      - name: new_declaration_starts_in_draft_status
        claim_type: initial_state
        grounds:
          - state_machines.SurplusDeclaration.initial_state
          - entities.SurplusDeclaration.fields.status
        distinguishing_aspect: "A freshly created SurplusDeclaration is in status DRAFT with reoffer_count 0, preference_offer_count 0, unresolved_preference_count 0 and every adoption/notice/authority field null - the create endpoint does not skip ahead to ADOPTED even though the caller is the office that will adopt it."
        test_recipe:
          setup:
            - "One custodian Agency and one Parcel with ownership_status AGENCY_OWNED."
          setup_api_calls:
            - call: "POST /agencies"
              payload: { name: "City of Riverbend", agency_type: "MUNICIPAL", contact_email: "realproperty@riverbend.gov" }
              as: SystemAdministrator
              captures: { cust_agency_id: "$.data.id" }
            - call: "POST /parcels"
              payload: { apn: "APN-2693-111", address: "9 Canal Street", acreage: 3.1, zoning_code: "M-1", book_value_cents: 70000000, custodian_agency_id: "${cust_agency_id}" }
              as: RealPropertyOfficer
              captures: { parcel_id: "$.data.id" }
          trigger:
            - call: "POST /declarations"
              payload: { parcel_id: "${parcel_id}", justification: "Canal Street yard is surplus after depot consolidation." }
              as: RealPropertyOfficer
              captures: { decl_id: "$.data.id" }
          assert:
            - "the response status is HTTP 201 and data.status == DRAFT"
            - "data.reoffer_count == 0, data.preference_offer_count == 0 and data.unresolved_preference_count == 0"
            - "data.resolution_number, data.adopted_by_user_id, data.adopted_at, data.notice_issued_at, data.authorized_disposition_type and data.reoffer_eligible_at are all null"
            - "GET /declarations with status DRAFT returns total_count == 1 including ${decl_id}"

      - name: adopt_declaration_from_draft_reaches_adopted
        claim_type: valid_transition
        grounds:
          - state_machines.SurplusDeclaration.DRAFT_to_ADOPTED
          - endpoints[POST /declarations/{id}/adopt]
          - entities.SurplusDeclaration.fields.adopted_by_user_id
        distinguishing_aspect: "POST /declarations/{id}/adopt on a DRAFT declaration returns 200 with status ADOPTED and stamps all three declared side effects at once: resolution_number from the request, adopted_by_user_id from the acting clerk's X-User-ID, and adopted_at from the logical clock (2026-08-01T00:00:00Z) - not merely a status flip."
        test_recipe:
          setup:
            - "One custodian Agency, one Parcel and one DRAFT SurplusDeclaration."
            - "The logical clock at the default 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /agencies"
              payload: { name: "City of Riverbend", agency_type: "MUNICIPAL", contact_email: "realproperty@riverbend.gov" }
              as: SystemAdministrator
              captures: { cust_agency_id: "$.data.id" }
            - call: "POST /parcels"
              payload: { apn: "APN-2693-112", address: "9 Canal Street", acreage: 3.1, zoning_code: "M-1", book_value_cents: 70000000, custodian_agency_id: "${cust_agency_id}" }
              as: RealPropertyOfficer
              captures: { parcel_id: "$.data.id" }
            - call: "POST /declarations"
              payload: { parcel_id: "${parcel_id}", justification: "Canal Street yard is surplus after depot consolidation." }
              as: RealPropertyOfficer
              captures: { decl_id: "$.data.id" }
          trigger:
            - call: "POST /declarations/${decl_id}/adopt"
              payload: { resolution_number: "RES-2026-211" }
              as: BoardClerk
              as_user_id: "clerk-adopt-1"
          assert:
            - "the response status is HTTP 200 and data.status == ADOPTED"
            - "data.resolution_number == RES-2026-211"
            - "data.adopted_by_user_id == clerk-adopt-1"
            - "data.adopted_at == 2026-08-01T00:00:00Z"
            - "data.notice_issued_at is still null - adoption does not serve notices"

      - name: adopt_declaration_twice_is_rejected
        claim_type: idempotency
        grounds:
          - state_machines.SurplusDeclaration.DRAFT_to_ADOPTED
          - validations[priority=15]
          - errors[ERR_INVALID_DECLARATION_STATE]
