scaffold_corner_design:

  # =====================================================================
  - section: entities
    instances:
      - name: create_depot_success
        claim_type: Creation
        grounds: [entities.Depot.fields.salt_tons_on_hand]
        distinguishing_aspect: "POST /depots with name + opening balances returns 201; salt_tons_on_hand echoes input and initial_salt_tons snapshots it."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /depots"
              payload: { name: "Yard", salt_tons_on_hand: 42.5, brine_gallons_on_hand: 500 }
              as: YardManager
              captures: { dep: $.data.id }
          assert:
            - "response.status == 201"
            - "Depot.${dep}.salt_tons_on_hand == 42.5"
            - "Depot.${dep}.initial_salt_tons == 42.5"
            - "Depot.${dep}.version == 1"

      - name: storm_not_found_returns_404
        claim_type: Not Found
        grounds: [entities.StormEvent.fields.name, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /storm-events/{unknown-uuid} returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /storm-events/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: DispatchSupervisor
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 404"
            - "response.data.error_id == ERR_NOT_FOUND"

      - name: operator_create_missing_required_field
        claim_type: Required Fields
        grounds: [entities.Operator.fields.hourly_rate_cents, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /operators omitting hourly_rate_cents returns ERR_INVALID_REQUEST (400); no operator is created."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /operators"
              payload: { full_name: "No Rate", badge_number: "B9", cdl_class: "B" }
              as: YardManager
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 400"
            - "response.data.error_id == ERR_INVALID_REQUEST"

      - name: route_invalid_enum_returns_422
        claim_type: Type Constraints
        grounds: [entities.Route.fields.tier, "errors[ERR_INVALID_ENUM]"]
        distinguishing_aspect: "POST /routes with tier outside {ARTERIAL,RESIDENTIAL} returns ERR_INVALID_ENUM (422)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /routes"
              payload: { name: "Bad", tier: "HIGHWAY", lane_miles: 1.0, zone: "Z9" }
              as: DispatchSupervisor
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 422"
            - "response.data.error_id == ERR_INVALID_ENUM"

      - name: vehicle_has_spreader_computed
        claim_type: Computed Fields
        grounds: [entities.Vehicle.fields.has_spreader, entities.Vehicle.fields.vehicle_type]
        distinguishing_aspect: "has_spreader is server-computed: PLOW -> false, COMBO -> true; input value cannot override it."
        test_recipe:
          setup: ["A depot."]
          setup_api_calls:
            - call: "POST /depots"
              payload: { name: "Yard", salt_tons_on_hand: 10, brine_gallons_on_hand: 10 }
              as: YardManager
              captures: { dep: $.data.id }
          trigger:
            - call: "POST /vehicles"
              payload: { home_depot_id: "${dep}", unit_number: "P1", vehicle_type: "PLOW" }
              as: YardManager
              captures: { plow: $.data.id }
            - call: "POST /vehicles"
              payload: { home_depot_id: "${dep}", unit_number: "C1", vehicle_type: "COMBO" }
              as: YardManager
              captures: { combo: $.data.id }
          assert:
            - "Vehicle.${plow}.has_spreader == false"
            - "Vehicle.${combo}.has_spreader == true"

      - name: vehicle_default_status_available
        claim_type: Defaults
        grounds: [entities.Vehicle.fields.status]
        distinguishing_aspect: "Omitting status on POST /vehicles defaults status to AVAILABLE."
        test_recipe:
          setup: ["A depot."]
          setup_api_calls:
            - call: "POST /depots"
              payload: { name: "Yard", salt_tons_on_hand: 10, brine_gallons_on_hand: 10 }
              as: YardManager
              captures: { dep: $.data.id }
          trigger:
            - call: "POST /vehicles"
              payload: { home_depot_id: "${dep}", unit_number: "V1", vehicle_type: "COMBO" }
              as: YardManager
              captures: { veh: $.data.id }
          assert:
            - "Vehicle.${veh}.status == AVAILABLE"

      - name: storm_system_fields_generated
        claim_type: System Fields
        grounds: [entities.StormEvent.fields.operational_status]
        distinguishing_aspect: "POST /storm-events server-mints id/created_at/version and initializes operational_status=PLANNED, billing_status=OPEN, version=1."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /storm-events"
              payload: { name: "S", severity: "LIGHT", forecast_start_at: "2026-02-10T00:00:00Z", forecast_end_at: "2026-02-11T00:00:00Z" }
              as: DispatchSupervisor
              captures: { st: $.data.id }
          assert:
            - "StormEvent.${st}.operational_status == PLANNED"
            - "StormEvent.${st}.billing_status == OPEN"
            - "StormEvent.${st}.version == 1"

  # =====================================================================
  - section: state_machines
    instances:
      - name: close_planned_storm_returns_not_active
        claim_type: Invalid Transitions
        grounds: [state_machines.StormEvent.ACTIVE_to_CLOSED, "errors[ERR_STORM_NOT_ACTIVE]"]
        distinguishing_aspect: "close requires operational_status ACTIVE; closing a PLANNED storm returns ERR_STORM_NOT_ACTIVE (409)."
        test_recipe:
          setup: ["A PLANNED storm (never activated)."]
          setup_api_calls:
            - call: "POST /storm-events"
              payload: { name: "S", severity: "LIGHT", forecast_start_at: "2026-02-10T00:00:00Z", forecast_end_at: "2026-02-11T00:00:00Z" }
              as: DispatchSupervisor
              captures: { st: $.data.id }
          trigger:
            - call: "POST /storm-events/${st}/close"
              payload: {}
              as: DispatchSupervisor
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_STORM_NOT_ACTIVE"
            - "StormEvent.${st}.operational_status == PLANNED"

      - name: activate_closed_storm_returns_already_closed
        claim_type: Invalid Transitions
        grounds: [state_machines.StormEvent.PLANNED_to_ACTIVE, "errors[ERR_STORM_ALREADY_CLOSED]"]
        distinguishing_aspect: "activate requires PLANNED; activating a CLOSED storm returns ERR_STORM_ALREADY_CLOSED (409)."
        test_recipe:
          setup: ["A storm activated then closed."]
          setup_api_calls:
            - call: "POST /storm-events"
              payload: { name: "S", severity: "LIGHT", forecast_start_at: "2026-02-10T00:00:00Z", forecast_end_at: "2026-02-11T00:00:00Z" }
              as: DispatchSupervisor
              captures: { st: $.data.id }
            - call: "POST /storm-events/${st}/activate"
              payload: {}
              as: DispatchSupervisor
            - call: "POST /storm-events/${st}/close"
              payload: {}
              as: DispatchSupervisor
          trigger:
            - call: "POST /storm-events/${st}/activate"
              payload: {}
              as: DispatchSupervisor
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_STORM_ALREADY_CLOSED"

      - name: finalize_billing_before_close_returns_not_closed
        claim_type: Precondition Enforcement
        grounds: [state_machines.StormEvent.OPEN_to_FINALIZED, "errors[ERR_STORM_NOT_CLOSED]"]
        distinguishing_aspect: "finalize-billing requires operational_status CLOSED; on an ACTIVE storm it returns ERR_STORM_NOT_CLOSED (409)."
        test_recipe:
          setup: ["An ACTIVE storm (activated, not closed)."]
          setup_api_calls:
            - call: "POST /storm-events"
              payload: { name: "S", severity: "LIGHT", forecast_start_at: "2026-02-10T00:00:00Z", forecast_end_at: "2026-02-11T00:00:00Z" }
              as: DispatchSupervisor
              captures: { st: $.data.id }
            - call: "POST /storm-events/${st}/activate"
              payload: {}
              as: DispatchSupervisor
          trigger:
            - call: "POST /storm-events/${st}/finalize-billing"
              payload: {}
              as: DispatchSupervisor
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_STORM_NOT_CLOSED"
            - "StormEvent.${st}.billing_status == OPEN"

      - name: finalize_billing_twice_returns_billing_not_open
        claim_type: Idempotency
        grounds: [state_machines.StormEvent.OPEN_to_FINALIZED, "errors[ERR_BILLING_NOT_OPEN]"]
        distinguishing_aspect: "A second finalize-billing on an already-FINALIZED storm returns ERR_BILLING_NOT_OPEN (409)."
        test_recipe:
          setup: ["A storm activated, closed, and billing finalized once."]
          setup_api_calls:
            - call: "POST /storm-events"
              payload: { name: "S", severity: "LIGHT", forecast_start_at: "2026-02-10T00:00:00Z", forecast_end_at: "2026-02-11T00:00:00Z" }
              as: DispatchSupervisor
              captures: { st: $.data.id }
            - call: "POST /storm-events/${st}/activate"
              payload: {}
              as: DispatchSupervisor
            - call: "POST /storm-events/${st}/close"
              payload: {}
              as: DispatchSupervisor
            - call: "POST /storm-events/${st}/finalize-billing"
              payload: {}
              as: DispatchSupervisor
          trigger:
            - call: "POST /storm-events/${st}/finalize-billing"
              payload: {}
              as: DispatchSupervisor
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_BILLING_NOT_OPEN"

      - name: start_already_in_progress_returns_not_planned
        claim_type: Invalid Transitions
        grounds: [state_machines.RouteAssignment.PLANNED_to_IN_PROGRESS, "errors[ERR_ASSIGNMENT_NOT_PLANNED]"]
        distinguishing_aspect: "start requires status PLANNED; starting an already IN_PROGRESS assignment returns ERR_ASSIGNMENT_NOT_PLANNED (409)."
        test_recipe:
          setup: ["An IN_PROGRESS assignment (started once)."]
          setup_api_calls:
            - call: "POST /depots"
              payload: { name: "Yard", salt_tons_on_hand: 100, brine_gallons_on_hand: 1000 }
              as: YardManager
              captures: { dep: $.data.id }
            - call: "POST /vehicles"
              payload: { home_depot_id: "${dep}", unit_number: "T1", vehicle_type: "COMBO" }
              as: YardManager
              captures: { veh: $.data.id }
            - call: "POST /operators"
              payload: { full_name: "Op A", badge_number: "B2", cdl_class: "A", hourly_rate_cents: 4000 }
              as: YardManager
              captures: { op: $.data.id }
            - call: "POST /routes"
              payload: { name: "Main St", tier: "ARTERIAL", lane_miles: 2.0, zone: "Z1" }
              as: DispatchSupervisor
              captures: { rt: $.data.id }
            - call: "POST /storm-events"
              payload: { name: "Blizzard", severity: "SEVERE", forecast_start_at: "2026-02-10T00:00:00Z", forecast_end_at: "2026-02-11T00:00:00Z" }
              as: DispatchSupervisor
              captures: { st: $.data.id }
            - call: "POST /storm-events/${st}/callouts"
              payload: { operator_id: "${op}", window_start_at: "2026-02-10T00:00:00Z", window_end_at: "2026-02-10T08:00:00Z" }
              as: DispatchSupervisor
              captures: { co: $.data.id }
            - call: "POST /storm-events/${st}/activate"
              payload: {}
              as: DispatchSupervisor
            - call: "GET /storm-events/${st}"
              payload: {}
              as: DispatchSupervisor
              captures: { v: $.data.version }
            - call: "POST /storm-events/${st}/assignments"
              payload: { route_id: "${rt}", vehicle_id: "${veh}", operator_id: "${op}", assignment_type: "PLOWING", window_start_at: "2026-02-10T01:00:00Z", window_end_at: "2026-02-10T05:00:00Z", planned_material_tons: 2.0, expected_storm_event_version: "${v}" }
              as: DispatchSupervisor
              captures: { asg: $.data.id }
            - call: "POST /assignments/${asg}/start"
              payload: {}
              as: DispatchSupervisor
          trigger:
            - call: "POST /assignments/${asg}/start"
              payload: {}
              as: DispatchSupervisor
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_ASSIGNMENT_NOT_PLANNED"

      - name: complete_callout_twice_returns_not_issued
        claim_type: Idempotency
        grounds: [state_machines.Callout.ISSUED_to_COMPLETED, "errors[ERR_CALLOUT_NOT_ISSUED]"]
        distinguishing_aspect: "Completing an already-COMPLETED callout returns ERR_CALLOUT_NOT_ISSUED (409); pay is not credited twice."
        test_recipe:
          setup: ["A completed callout for an operator."]
          setup_api_calls:
            - call: "POST /operators"
              payload: { full_name: "Op A", badge_number: "B2", cdl_class: "A", hourly_rate_cents: 4000 }
              as: YardManager
              captures: { op: $.data.id }
            - call: "POST /storm-events"
              payload: { name: "S", severity: "MODERATE", forecast_start_at: "2026-02-10T00:00:00Z", forecast_end_at: "2026-02-11T00:00:00Z" }
              as: DispatchSupervisor
              captures: { st: $.data.id }
            - call: "POST /storm-events/${st}/callouts"
              payload: { operator_id: "${op}", window_start_at: "2026-02-10T00:00:00Z", window_end_at: "2026-02-10T08:00:00Z" }
              as: DispatchSupervisor
              captures: { co: $.data.id }
            - call: "POST /callouts/${co}/complete"
              payload: { hours_worked: 5 }
              as: Operator
              as_user_id: "${op}"
          trigger:
            - call: "POST /callouts/${co}/complete"
              payload: { hours_worked: 5 }
              as: Operator
              as_user_id: "${op}"
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_CALLOUT_NOT_ISSUED"

      - name: resolve_open_complaint_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.Complaint.INVESTIGATING_to_RESOLVED, "errors[ERR_COMPLAINT_INVALID_STATE]"]
        distinguishing_aspect: "resolve requires status INVESTIGATING; resolving an OPEN complaint returns ERR_COMPLAINT_INVALID_STATE (409)."
        test_recipe:
          setup: ["An OPEN complaint."]
          setup_api_calls:
            - call: "POST /routes"
              payload: { name: "Elm", tier: "RESIDENTIAL", lane_miles: 1.0, zone: "Z2" }
              as: DispatchSupervisor
              captures: { rt: $.data.id }
            - call: "POST /storm-events"
              payload: { name: "S", severity: "LIGHT", forecast_start_at: "2026-02-10T00:00:00Z", forecast_end_at: "2026-02-11T00:00:00Z" }
              as: DispatchSupervisor
              captures: { st: $.data.id }
            - call: "POST /complaints"
              payload: { route_id: "${rt}", storm_event_id: "${st}", address: "9 Elm", complaint_type: "ICY_CONDITIONS" }
              as: CitizenServices
              captures: { cmp: $.data.id }
          trigger:
            - call: "POST /complaints/${cmp}/resolve"
              payload: {}
              as: CitizenServices
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_COMPLAINT_INVALID_STATE"
            - "Complaint.${cmp}.status == OPEN"

      - name: void_already_voided_application
        claim_type: Terminal State Lockdown
        grounds: [state_machines.MaterialApplication.RECORDED_to_VOIDED, "errors[ERR_APPLICATION_ALREADY_VOIDED]"]
        distinguishing_aspect: "Voiding an already-VOIDED application returns ERR_APPLICATION_ALREADY_VOIDED (409); the depot is not double-credited."
        test_recipe:
          setup: ["An assignment whose only application has been voided once (depot restored to 100)."]
          setup_api_calls:
            - call: "POST /depots"
              payload: { name: "Yard", salt_tons_on_hand: 100, brine_gallons_on_hand: 1000 }
              as: YardManager
              captures: { dep: $.data.id }
            - call: "POST /vehicles"
              payload: { home_depot_id: "${dep}", unit_number: "T1", vehicle_type: "COMBO" }
              as: YardManager
              captures: { veh: $.data.id }
            - call: "POST /operators"
              payload: { full_name: "Op A", badge_number: "B2", cdl_class: "A", hourly_rate_cents: 4000 }
              as: YardManager
              captures: { op: $.data.id }
            - call: "POST /routes"
              payload: { name: "Main St", tier: "ARTERIAL", lane_miles: 2.0, zone: "Z1" }
              as: DispatchSupervisor
              captures: { rt: $.data.id }
            - call: "POST /storm-events"
              payload: { name: "Blizzard", severity: "SEVERE", forecast_start_at: "2026-02-10T00:00:00Z", forecast_end_at: "2026-02-11T00:00:00Z" }
              as: DispatchSupervisor
              captures: { st: $.data.id }
            - call: "POST /storm-events/${st}/callouts"
              payload: { operator_id: "${op}", window_start_at: "2026-02-10T00:00:00Z", window_end_at: "2026-02-10T08:00:00Z" }
              as: DispatchSupervisor
              captures: { co: $.data.id }
            - call: "POST /storm-events/${st}/activate"
              payload: {}
              as: DispatchSupervisor
            - call: "GET /storm-events/${st}"
              payload: {}
              as: DispatchSupervisor
              captures: { v: $.data.version }
            - call: "POST /storm-events/${st}/assignments"
              payload: { route_id: "${rt}", vehicle_id: "${veh}", operator_id: "${op}", assignment_type: "PLOWING", window_start_at: "2026-02-10T01:00:00Z", window_end_at: "2026-02-10T05:00:00Z", planned_material_tons: 5.0, expected_storm_event_version: "${v}" }
              as: DispatchSupervisor
              captures: { asg: $.data.id }
            - call: "POST /assignments/${asg}/start"
              payload: {}
              as: DispatchSupervisor
            - call: "POST /assignments/${asg}/applications"
              payload: { depot_id: "${dep}", material_type: "SALT", salt_tons: 5.0, lane_miles_treated: 2.0, pavement_temp_f: 15 }
              as: Operator
              as_user_id: "${op}"
              captures: { app: $.data.id }
            - call: "POST /material-applications/${app}/void"
              payload: {}
              as: DispatchSupervisor
          trigger:
            - call: "POST /material-applications/${app}/void"
              payload: {}
              as: DispatchSupervisor
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_APPLICATION_ALREADY_VOIDED"
            - "Depot.${dep}.salt_tons_on_hand == 100.00"

      - name: cancel_cancelled_callout_returns_not_cancellable
        claim_type: Terminal State Lockdown
        grounds: [state_machines.Callout.ISSUED_to_CANCELLED, "errors[ERR_CALLOUT_NOT_CANCELLABLE]"]
        distinguishing_aspect: "Cancelling an already-CANCELLED callout returns ERR_CALLOUT_NOT_CANCELLABLE (409)."
        test_recipe:
          setup: ["An ISSUED callout cancelled once."]
          setup_api_calls:
            - call: "POST /operators"
              payload: { full_name: "Op A", badge_number: "B2", cdl_class: "A", hourly_rate_cents: 4000 }
              as: YardManager
              captures: { op: $.data.id }
            - call: "POST /storm-events"
              payload: { name: "S", severity: "MODERATE", forecast_start_at: "2026-02-10T00:00:00Z", forecast_end_at: "2026-02-11T00:00:00Z" }
              as: DispatchSupervisor
              captures: { st: $.data.id }
            - call: "POST /storm-events/${st}/callouts"
              payload: { operator_id: "${op}", window_start_at: "2026-02-10T00:00:00Z", window_end_at: "2026-02-10T08:00:00Z" }
              as: DispatchSupervisor
              captures: { co: $.data.id }
            - call: "POST /callouts/${co}/cancel"
              payload: {}
              as: DispatchSupervisor
          trigger:
            - call: "POST /callouts/${co}/cancel"
              payload: {}
              as: DispatchSupervisor
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_CALLOUT_NOT_CANCELLABLE"

  # =====================================================================
  - section: validations
    instances:
      - name: callout_invalid_window_returns_422
        claim_type: Violation → Error
        grounds: ["validations[priority=11]", "errors[ERR_INVALID_WINDOW]"]
        distinguishing_aspect: "A callout with window_end_at <= window_start_at returns ERR_INVALID_WINDOW (422)."
        test_recipe:
          setup: ["An operator and a storm."]
          setup_api_calls:
            - call: "POST /operators"
              payload: { full_name: "Op A", badge_number: "B2", cdl_class: "A", hourly_rate_cents: 4000 }
              as: YardManager
              captures: { op: $.data.id }
            - call: "POST /storm-events"
              payload: { name: "S", severity: "LIGHT", forecast_start_at: "2026-02-10T00:00:00Z", forecast_end_at: "2026-02-11T00:00:00Z" }
              as: DispatchSupervisor
              captures: { st: $.data.id }
          trigger:
            - call: "POST /storm-events/${st}/callouts"
              payload: { operator_id: "${op}", window_start_at: "2026-02-10T08:00:00Z", window_end_at: "2026-02-10T08:00:00Z" }
              as: DispatchSupervisor
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_INVALID_WINDOW"

      - name: assign_plow_vehicle_to_plowing_rejected
        claim_type: Violation → Error
        grounds: ["validations[priority=7]", "errors[ERR_VEHICLE_MISSING_SPREADER]"]
        distinguishing_aspect: "A PLOW-only vehicle (no spreader) assigned to a PLOWING run returns ERR_VEHICLE_MISSING_SPREADER (422)."
        test_recipe:
          setup: ["A PLOW vehicle, an operator on-call, a route, a storm; version captured."]
          setup_api_calls:
            - call: "POST /depots"
              payload: { name: "Yard", salt_tons_on_hand: 100, brine_gallons_on_hand: 1000 }
              as: YardManager
              captures: { dep: $.data.id }
            - call: "POST /vehicles"
              payload: { home_depot_id: "${dep}", unit_number: "P1", vehicle_type: "PLOW" }
              as: YardManager
              captures: { veh: $.data.id }
            - call: "POST /operators"
              payload: { full_name: "Op A", badge_number: "B2", cdl_class: "A", hourly_rate_cents: 4000 }
              as: YardManager
              captures: { op: $.data.id }
            - call: "POST /routes"
              payload: { name: "Main St", tier: "ARTERIAL", lane_miles: 2.0, zone: "Z1" }
              as: DispatchSupervisor
              captures: { rt: $.data.id }
            - call: "POST /storm-events"
              payload: { name: "Blizzard", severity: "SEVERE", forecast_start_at: "2026-02-10T00:00:00Z", forecast_end_at: "2026-02-11T00:00:00Z" }
              as: DispatchSupervisor
              captures: { st: $.data.id }
            - call: "POST /storm-events/${st}/callouts"
              payload: { operator_id: "${op}", window_start_at: "2026-02-10T00:00:00Z", window_end_at: "2026-02-10T08:00:00Z" }
              as: DispatchSupervisor
              captures: { co: $.data.id }
            - call: "GET /storm-events/${st}"
              payload: {}
              as: DispatchSupervisor
              captures: { v: $.data.version }
          trigger:
            - call: "POST /storm-events/${st}/assignments"
