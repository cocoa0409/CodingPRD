            - { call: "POST /ppc/evaluation-cycles/${cy_id}/transition", payload: { target_state: "INTAKE" }, as: EvaluationCoordinator }
            - { call: "POST /ppc/evaluation-cycles/${cy_id}/transition", payload: { target_state: "DATA_COLLECTION" }, as: EvaluationCoordinator }
            - { call: "GET /ppc/fire-departments?community_id=${c_id}", as: EvaluationCoordinator, captures: { dept_id: "$.data[0].id" } }
            - { call: "PATCH /ppc/fire-departments/${dept_id}", payload: { career_on_duty_per_shift: 0 }, as: FireChief, as_user_id: "${dept_id}" }
            - { call: "PATCH /ppc/communities/${c_id}/attest-comms", payload: { operators_on_duty_min: 2, avg_alarm_to_dispatch_seconds: 60, redundant_circuits: true, backup_power: true }, as: CommsSupervisor }
            - { call: "POST /ppc/evaluation-cycles/${cy_id}/transition", payload: { target_state: "FIELD_VERIFICATION" }, as: EvaluationCoordinator }
            - { call: "POST /ppc/evaluation-cycles/${cy_id}/transition", payload: { target_state: "SCORING" }, as: EvaluationCoordinator }
            - { call: "GET /ppc/evaluation-cycles/${cy_id}", as: FieldAnalyst, captures: { v1: $.data.version } }
            - { call: "POST /ppc/evaluation-cycles/${cy_id}/score-sheets", payload: { expected_cycle_version: "${v1}" }, as: FieldAnalyst, captures: { sheet1: $.data.id } }
          trigger:
            - { call: "PATCH /ppc/communities/${c_id}/attest-comms", payload: { operators_on_duty_min: 2, avg_alarm_to_dispatch_seconds: 61, redundant_circuits: true, backup_power: true }, as: CommsSupervisor }
            - { call: "GET /ppc/evaluation-cycles/${cy_id}", as: FieldAnalyst, captures: { v2: $.data.version } }
            - { call: "POST /ppc/evaluation-cycles/${cy_id}/score-sheets", payload: { expected_cycle_version: "${v2}" }, as: FieldAnalyst, captures: { sheet2: $.data.id } }
          assert:
            - "ScoreSheet.${sheet1}.comms_points == 10 (alarm 60s earns 4)"
            - "ScoreSheet.${sheet2}.comms_points == 8 (alarm 61s earns 2)"

      - name: crr_item_cap_applied_on_verify
        claim_type: constants_applied
        grounds: [calculations.crr_credit, entities.RiskReductionCredit.fields.credited_points]
        distinguishing_aspect: "An activity claiming 3.5 points is credited exactly 2.00 (CRR_ITEM_CAP) at verification."
        test_recipe:
