      # ERR_APPLICANT_STANDING_RESTRICTED is reachable only after two independent
      # compliance strikes against the same applicant (a breached progress report
      # plus a lapsed certificate). That two-strike chain is the tail of the §1.8
      # transitive_cascade instance progress_report_breach_depth_three_suspension_strike_cascade,
      # so no separate breadth recipe is added here; the corner is covered there.

      - name: application_not_submittable_covered_by_difficulty_instance
        claim_type: error_triggerability
        grounds:
          - validations[priority=10]
          - errors[ERR_APPLICATION_NOT_SUBMITTABLE]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / submit_state_conflict_outranks_closed_filing_window
          rationale: "ERR_APPLICATION_NOT_SUBMITTABLE is returned and asserted by the named §1.8 instance, which additionally proves it outranks the closed filing window at priority 17."

