  - requested_packed_cwt
  - allocation_policy?
  - market_price_cents_per_cwt?
  output: PackOrder
  side_effects: []
- method: GET
  path: /potato-shed/pack-orders/{id}
  description: Read a pack order incl. reservations
  roles:
  - ShedAdmin
  - SalesManager
  - PackLineSupervisor
  - SettlementClerk
  code: 200
  input: []
  output: PackOrder
  side_effects: []
- method: GET
  path: /potato-shed/pack-orders
