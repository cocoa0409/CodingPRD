            - call: "POST /state-jurisdictions"
              payload: { state_code: "TX", mandate_type: "MANDATORY", mandated_tracks: ["ON_PREMISE", "OFF_PREMISE"], proctor_separation_required: false }
              as: ProgramAdmin
              captures: { tx_id: $.data.id }
            - call: "POST /courses"
              payload: { title: "TIPS On-Premise Core", track: "ON_PREMISE", delivery_mode: "CLASSROOM", contact_hours: 4, question_count: 40, version_label: "v1" }
              as: ProgramAdmin
              captures: { course_id: $.data.id }
            - call: "POST /courses/${course_id}/publish"
              payload: {}
              as: ProgramAdmin
            - call: "POST /course-approvals"
              payload: { course_id: "${course_id}", state_jurisdiction_id: "${tx_id}", submission_note: "initial filing" }
              as: ProgramAdmin
              captures: { appr_id: $.data.id }
            - call: "POST /course-approvals/${appr_id}/decision"
              payload: { decision: "APPROVE", approval_number: "TX-ABC-2026-001", effective_from: "2026-08-01T00:00:00Z", expires_at: "2027-08-01T00:00:00Z" }
              as: StateRegulator
            - call: "POST /trainers"
              payload: { full_name: "Dana Reyes", email: "dana@tips.example" }
              as: ProgramAdmin
              captures: { tr_id: $.data.id }
            - call: "POST /trainers/${tr_id}/credential"
              payload: { certified_tracks: ["ON_PREMISE"], certified_state_codes: ["TX"], credential_expires_at: "2027-06-30T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /trainers"
              payload: { full_name: "Elm Ortiz", email: "elm@tips.example" }
              as: ProgramAdmin
              captures: { tr2_id: $.data.id }
            - call: "POST /trainers/${tr2_id}/credential"
              payload: { certified_tracks: ["ON_PREMISE"], certified_state_codes: ["TX"], credential_expires_at: "2027-06-30T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /class-sessions"
              payload: { course_id: "${course_id}", state_jurisdiction_id: "${tx_id}", trainer_id: "${tr_id}", scheduled_start_at: "2026-08-10T14:00:00Z", scheduled_end_at: "2026-08-10T18:00:00Z", capacity: 20 }
              as: ProgramAdmin
              captures: { sess_id: $.data.id, sess_v: $.data.version }
            - call: "POST /alcohol-servers"
              payload: { full_name: "Ari Cole", email: "ari@example.com", state_jurisdiction_id: "${tx_id}" }
              as: ProgramAdmin
              captures: { srv_a: $.data.id }
            - call: "POST /enrollments"
              payload: { class_session_id: "${sess_id}", alcohol_server_id: "${srv_a}", expected_class_session_version: "${sess_v}" }
              as: AlcoholServer
              as_user_id: "${srv_a}"
              captures: { enr_a: $.data.id }
          trigger:
            - call: "POST /class-sessions/${sess_id}/lock-roster"
              payload: {}
              as: Trainer
              as_user_id: "${tr2_id}"
            - call: "POST /class-sessions/${sess_id}/lock-roster"
              payload: {}
              as: Trainer
              as_user_id: "${tr_id}"
            - call: "POST /enrollments/${enr_a}/attendance"
              payload: { attended: true }
              as: Trainer
              as_user_id: "${tr2_id}"
          assert:
            - "Elm's lock-roster returns 403 with error.code == 'ERR_NOT_RESOURCE_OWNER' and ClassSession.${sess_id}.session_status stays 'SCHEDULED'"
            - "Dana's lock-roster returns 200 with session_status == 'ROSTER_LOCKED'"
            - "Elm's attendance call returns 403 with error.code == 'ERR_NOT_RESOURCE_OWNER' and Enrollment.${enr_a}.enrollment_state stays 'REGISTERED'"

      - name: an_employer_admin_cannot_read_another_accounts_location
        claim_type: RBAC deny
        grounds:
          - rbac.EmployerAdmin.ownership_rule
          - validations.priority_5_ERR_NOT_RESOURCE_OWNER
          - endpoints.GET_/employer-locations/{id}
        distinguishing_aspect: |
          EmployerAdmin is a permitted role on both the location read and the dashboard, so
          the rejection must come from ownership: the second account's admin gets
          ERR_NOT_RESOURCE_OWNER (403) on the first account's location and dashboard, and
          its own listing shows only its own location.
        test_recipe:
          setup:
            - "A TX MANDATORY jurisdiction and two employer accounts, each with one ON_PREMISE location."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: ProgramAdmin
            - call: "POST /state-jurisdictions"
              payload: { state_code: "TX", mandate_type: "MANDATORY", mandated_tracks: ["ON_PREMISE", "OFF_PREMISE"] }
              as: ProgramAdmin
              captures: { tx_id: $.data.id }
            - call: "POST /employer-accounts"
              payload: { legal_name: "Lone Star Taverns LLC", billing_state_code: "TX" }
              as: ProgramAdmin
              captures: { emp1: $.data.id }
            - call: "POST /employer-accounts"
              payload: { legal_name: "Gulf Coast Cantinas LLC", billing_state_code: "TX" }
              as: ProgramAdmin
              captures: { emp2: $.data.id }
