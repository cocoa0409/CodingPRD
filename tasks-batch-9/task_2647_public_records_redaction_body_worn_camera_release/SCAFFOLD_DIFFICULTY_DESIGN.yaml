      - name: litigation_hold_suspension_cascade_depth_three
        grounds:
          - state_machines.VideoAsset.SCHEDULED_to_SUSPENDED
          - state_machines.VideoAsset.SUSPENDED_to_SCHEDULED
          - state_machines.VideoAsset.SCHEDULED_to_PURGED
          - entities.VideoAsset.fields.retention_locked
          - entities.VideoAsset.fields.suspended_by_hold_id
          - entities.LitigationHold.fields.suspended_asset_count
          - validations[priority=15]
        distinguishing_aspect: |
          Depth-3 cascade from a DIFFERENT trigger - POST /records/litigation-holds rather
          than an adjudication: the hold becoming ACTIVE sets retention_locked true on both
          matching assets (link 1), which drives disposition_state SCHEDULED->SUSPENDED and
          stamps suspended_by_hold_id (link 2), which increments the hold's own
          suspended_asset_count to 2 (link 3); releasing the hold runs the same chain
          backwards to 0 and re-opens the purge path.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "One COUNSEL StaffMember (level 3)."
            - "Two VideoAssets on incident INC-2026-0408, both disposition_state SCHEDULED, retention_locked false, scheduled_purge_at 2026-07-01T00:00:00Z (already due) and referenced by no request."
            - "No LitigationHold exists."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: RecordsSupervisor
              as_user_id: "supv-1"
            - call: "POST /records/staff"
              payload: { full_name: "Dana Counsel", role_type: "COUNSEL", redaction_certification_level: 3 }
              as: RecordsSupervisor
              as_user_id: "supv-1"
              captures: { counsel_a_id: $.data.id }
            - call: "POST /records/video-assets"
              payload: { incident_number: "INC-2026-0408", device_serial: "AXON-0501", officer_badge: "B-9901", recorded_start_at: "2026-01-05T03:00:00Z", duration_ms: 600000, classification: "ROUTINE", retention_category: "NON_EVIDENTIARY_180D", scheduled_purge_at: "2026-07-01T00:00:00Z" }
              as: RecordsClerk
              as_user_id: "clerk-1"
              captures: { asset_a1_id: $.data.id }
            - call: "POST /records/video-assets"
              payload: { incident_number: "INC-2026-0408", device_serial: "AXON-0502", officer_badge: "B-9902", recorded_start_at: "2026-01-05T03:05:00Z", duration_ms: 300000, classification: "ROUTINE", retention_category: "NON_EVIDENTIARY_180D", scheduled_purge_at: "2026-07-01T00:00:00Z" }
              as: RecordsClerk
              as_user_id: "clerk-1"
              captures: { asset_a2_id: $.data.id }
          trigger:
            - call: "POST /records/litigation-holds"
              payload: { matter_number: "LIT-2026-0408", scope_incident_number: "INC-2026-0408", hold_type: "SUBPOENA" }
              as: LegalCounsel
              as_user_id: "${counsel_a_id}"
              captures: { hold_id: $.data.id }
            - call: "POST /records/litigation-holds/${hold_id}/release"
              payload: { release_note: "Subpoena satisfied" }
              as: LegalCounsel
              as_user_id: "${counsel_a_id}"
            - call: "POST /records/video-assets/${asset_a1_id}/purge"
              payload: { destruction_note: "180-day schedule elapsed" }
              as: RecordsSupervisor
              as_user_id: "supv-1"
          assert:
            - "After trigger step 1 - LINK 1: VideoAsset.${asset_a1_id}.retention_locked == true and VideoAsset.${asset_a2_id}.retention_locked == true"
            - "After trigger step 1 - LINK 2: VideoAsset.${asset_a1_id}.disposition_state == SUSPENDED and suspended_by_hold_id == ${hold_id}"
            - "After trigger step 1 - LINK 2: VideoAsset.${asset_a2_id}.disposition_state == SUSPENDED and suspended_by_hold_id == ${hold_id}"
            - "After trigger step 1 - LINK 3: LitigationHold.${hold_id}.status == ACTIVE and suspended_asset_count == 2"
            - "After trigger step 2: LitigationHold.${hold_id}.status == RELEASED, suspended_asset_count == 0, released_at == 2026-08-01T00:00:00Z"
            - "After trigger step 2: both assets have disposition_state == SCHEDULED, suspended_by_hold_id == null and retention_locked == false"
            - "After trigger step 3: VideoAsset.${asset_a1_id}.disposition_state == PURGED"
            - "After trigger step 3: VideoAsset.${asset_a2_id}.disposition_state == SCHEDULED (the purge is per-asset and never cascades to siblings on the same incident)"
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: release_readiness_state_beats_unpaid_deposit_fiscal
        grounds:
          - validations[priority=9]
          - validations[priority=30]
          - errors[ERR_REQUEST_NOT_RELEASE_READY]
          - errors[ERR_DEPOSIT_UNPAID]
          - calculations.fee_estimate_total
          - state_machines.PublicRecordsRequest.NOT_ASSESSED_to_DEPOSIT_DUE
        distinguishing_aspect: |
          Category pair `state` (priority 9, ERR_REQUEST_NOT_RELEASE_READY, 409) versus
          `business_fiscal` (priority 30, ERR_DEPOSIT_UNPAID, 402): a request sitting in
          EXEMPTION_REVIEW with deposit_required_cents 2457 and deposit_paid_cents 0 violates
          both rules on one release call, and the response MUST be the 409 readiness error.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "One COUNSEL StaffMember (level 3) and one GENERAL_PUBLIC Requester."
            - "One VideoAsset: incident INC-2026-0509, duration_ms 2700000 (45 min), classification USE_OF_FORCE."
            - "One PublicRecordsRequest in processing_status EXEMPTION_REVIEW with one RESPONSIVE record and one ASSERTED JUVENILE PARTIAL_REDACT claim."
            - "An ACTIVE PRESUMPTIVE estimate priced at 4914 cents left fee_status DEPOSIT_DUE with deposit_required_cents 2457 and deposit_paid_cents 0."
