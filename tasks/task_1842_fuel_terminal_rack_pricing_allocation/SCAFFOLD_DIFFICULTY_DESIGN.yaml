scaffold_difficulty_design:
  # ==================================================================
  # Rule 1 — dual_variant_calc (≥2 instances, different entity domains)
  # ==================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: rack_price_provisional_vs_final_diverge_on_midday_republish
        grounds:
          - calculations.rack_price_determination
          - state_machines.LiftingTicket.RESERVED_to_BOL_ISSUED
          - state_machines.RackPriceSchedule.DRAFT_to_PUBLISHED
        distinguishing_aspect: |
          The provisional (at-RESERVED) and final (at-BOL_ISSUED) variants of
          rack_price_determination read the published price schedule at two
          different logical-clock instants; a mid-flight re-publish between
          reservation and post-bol causes the final unit_price_cents_per_gal
          to differ from the provisional, demonstrating dual-variant divergence
          on the LiftingTicket entity domain.
        test_recipe:
          setup:
            - "Terminal T in CA (county 06037, city LAX), Product P GASOLINE brandable, Customer C credit_limit 100_000_000"
            - "SupplyContract SC for C ACTIVE today with tier RACK"
            - "LiftingRight LR ACTIVE for (C, T, P, SC) daily_ratable 100000"
            - "Tax rules ACTIVE: FEDERAL/US/GASOLINE=18, STATE/CA/GASOLINE=50, COUNTY/06037/GASOLINE=10, CITY/LAX/GASOLINE=5, all effective 2026-01-01 to 2026-12-31"
            - "Logical clock = 2026-08-01T08:00:00Z; RackPriceSchedule PS1 posted_rack=300 branded_premium=0 PUBLISHED for 2026-08-01"
            - "Terminal.inventory_gallons adjusted to 100000"
          setup_api_calls:
            - { call: "POST /rack/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T08:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /rack/terminals", payload: { terminal_code: "LAX-01", legal_name: "LA Terminal", state_code: "CA", county_code: "06037", city_code: "LAX" }, as: PlatformAdmin, captures: { t_id: $.data.id, t_v0: $.data.version } }
            - { call: "POST /rack/products", payload: { product_code: "REG87", display_name: "Regular 87", product_family: "GASOLINE", is_brandable: true }, as: PlatformAdmin, captures: { p_id: $.data.id } }
            - { call: "POST /rack/customers", payload: { customer_code: "CUST-A", legal_name: "Cust A", credit_limit_cents: 100000000 }, as: PlatformAdmin, captures: { c_id: $.data.id } }
            - { call: "POST /rack/supply-contracts", payload: { customer_id: "${c_id}", start_date: "2026-01-01", end_date: "2026-12-31", volume_commitment_gallons: 1000000, pricing_tier: "RACK" }, as: ContractAdministrator, captures: { sc_id: $.data.id } }
            - { call: "POST /rack/supply-contracts/${sc_id}/activate", payload: {}, as: ContractAdministrator }
            - { call: "POST /rack/lifting-rights", payload: { customer_id: "${c_id}", terminal_id: "${t_id}", product_id: "${p_id}", contract_id: "${sc_id}", daily_ratable_gallons: 100000 }, as: AllocationManager, captures: { lr_id: $.data.id } }
            - { call: "POST /rack/tax-rules", payload: { jurisdiction_level: "FEDERAL", jurisdiction_code: "US", product_family: "GASOLINE", rate_cents_per_gal: 18, effective_start_date: "2026-01-01", effective_end_date: "2026-12-31" }, as: PlatformAdmin }
            - { call: "POST /rack/tax-rules", payload: { jurisdiction_level: "STATE", jurisdiction_code: "CA", product_family: "GASOLINE", rate_cents_per_gal: 50, effective_start_date: "2026-01-01", effective_end_date: "2026-12-31" }, as: PlatformAdmin }
            - { call: "POST /rack/tax-rules", payload: { jurisdiction_level: "COUNTY", jurisdiction_code: "06037", product_family: "GASOLINE", rate_cents_per_gal: 10, effective_start_date: "2026-01-01", effective_end_date: "2026-12-31" }, as: PlatformAdmin }
            - { call: "POST /rack/tax-rules", payload: { jurisdiction_level: "CITY", jurisdiction_code: "LAX", product_family: "GASOLINE", rate_cents_per_gal: 5, effective_start_date: "2026-01-01", effective_end_date: "2026-12-31" }, as: PlatformAdmin }
            - { call: "POST /rack/terminals/${t_id}/inventory/adjust", payload: { delta_gallons: 100000, reason: "initial" }, as: TerminalOperator }
            - { call: "POST /rack/price-schedules", payload: { terminal_id: "${t_id}", product_id: "${p_id}", effective_date: "2026-08-01", posted_rack_cents_per_gal: 300, branded_premium_cents_per_gal: 0 }, as: RackPriceAnalyst, captures: { ps1_id: $.data.id } }
            - { call: "POST /rack/price-schedules/${ps1_id}/publish", payload: { expected_terminal_version: "${t_v0}" }, as: RackPriceAnalyst }
            - { call: "POST /rack/lifting-tickets", payload: { lifting_right_id: "${lr_id}", requested_gallons: 1000, branded: false }, as: TerminalOperator, captures: { tick_id: $.data.id, provisional_gross: $.data.gross_cents, provisional_unit: $.data.unit_price_cents_per_gal } }
            # Mid-flight: republish at higher price (302)
            - { call: "GET /rack/terminals/${t_id}", payload: {}, as: PlatformAdmin, captures: { t_v1: $.data.version } }
            - { call: "POST /rack/price-schedules", payload: { terminal_id: "${t_id}", product_id: "${p_id}", effective_date: "2026-08-01", posted_rack_cents_per_gal: 302, branded_premium_cents_per_gal: 0 }, as: RackPriceAnalyst, captures: { ps2_id: $.data.id } }
            - { call: "POST /rack/price-schedules/${ps2_id}/publish", payload: { expected_terminal_version: "${t_v1}" }, as: RackPriceAnalyst }
          trigger:
            - { call: "POST /rack/lifting-tickets/${tick_id}/post-bol", payload: {}, as: TerminalOperator, captures: { final_unit: $.data.unit_price_cents_per_gal, final_gross: $.data.gross_cents, final_tax: $.data.tax_cents } }
          assert:
            - "LiftingTicket.${tick_id}.unit_price_cents_per_gal == 302 (final reads new PUBLISHED schedule, not the 300 captured at reservation)"
            - "LiftingTicket.${tick_id}.tax_cents == 83000 (1000 gal * (18+50+10+5))"
            - "LiftingTicket.${tick_id}.gross_cents == 385000 (1000*302 + 0 + 83000)"
            - "provisional unit_price_cents_per_gal captured at RESERVED was 300"
            - "provisional gross_cents != final gross_cents"

      - name: ratable_allocation_pro_rata_vs_ratchet_diverge
        grounds:
          - calculations.ratable_allocation
          - state_machines.AllocationNotice.DRAFT_to_PUBLISHED
        distinguishing_aspect: |
          PRO_RATA and RATCHET variants of ratable_allocation produce different
          per-right allocations for identical (pool, ratable-vector) inputs,
          demonstrating dual-variant divergence on the AllocationNotice /
          LiftingRight entity domain (a different subject than the
          LiftingTicket price-divergence instance).
        test_recipe:
          setup:
            - "Terminal T, Product P, three Customers C1/C2/C3 each with credit_limit 10^9"
            - "Three ACTIVE SupplyContracts SC1/SC2/SC3 (one per customer), each tier RACK"
            - "Three ACTIVE LiftingRights: LR1 ratable=100, LR2 ratable=200, LR3 ratable=300 (created in that order so created_at ASC resolves LR1<LR2<LR3)"
            - "Logical clock = 2026-08-01T08:00:00Z"
          setup_api_calls:
            - { call: "POST /rack/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T08:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /rack/terminals", payload: { terminal_code: "SF-01", legal_name: "SF Terminal", state_code: "CA", county_code: "06075", city_code: "SFO" }, as: PlatformAdmin, captures: { t_id: $.data.id } }
            - { call: "POST /rack/products", payload: { product_code: "ULSD", display_name: "Diesel", product_family: "DIESEL", is_brandable: false }, as: PlatformAdmin, captures: { p_id: $.data.id } }
            - { call: "POST /rack/customers", payload: { customer_code: "C1", legal_name: "C1", credit_limit_cents: 1000000000 }, as: PlatformAdmin, captures: { c1: $.data.id } }
            - { call: "POST /rack/customers", payload: { customer_code: "C2", legal_name: "C2", credit_limit_cents: 1000000000 }, as: PlatformAdmin, captures: { c2: $.data.id } }
            - { call: "POST /rack/customers", payload: { customer_code: "C3", legal_name: "C3", credit_limit_cents: 1000000000 }, as: PlatformAdmin, captures: { c3: $.data.id } }
            - { call: "POST /rack/supply-contracts", payload: { customer_id: "${c1}", start_date: "2026-01-01", end_date: "2026-12-31", volume_commitment_gallons: 10000, pricing_tier: "RACK" }, as: ContractAdministrator, captures: { sc1: $.data.id } }
            - { call: "POST /rack/supply-contracts/${sc1}/activate", payload: {}, as: ContractAdministrator }
            - { call: "POST /rack/supply-contracts", payload: { customer_id: "${c2}", start_date: "2026-01-01", end_date: "2026-12-31", volume_commitment_gallons: 10000, pricing_tier: "RACK" }, as: ContractAdministrator, captures: { sc2: $.data.id } }
            - { call: "POST /rack/supply-contracts/${sc2}/activate", payload: {}, as: ContractAdministrator }
            - { call: "POST /rack/supply-contracts", payload: { customer_id: "${c3}", start_date: "2026-01-01", end_date: "2026-12-31", volume_commitment_gallons: 10000, pricing_tier: "RACK" }, as: ContractAdministrator, captures: { sc3: $.data.id } }
            - { call: "POST /rack/supply-contracts/${sc3}/activate", payload: {}, as: ContractAdministrator }
            - { call: "POST /rack/lifting-rights", payload: { customer_id: "${c1}", terminal_id: "${t_id}", product_id: "${p_id}", contract_id: "${sc1}", daily_ratable_gallons: 100 }, as: AllocationManager, captures: { lr1: $.data.id } }
            - { call: "POST /rack/lifting-rights", payload: { customer_id: "${c2}", terminal_id: "${t_id}", product_id: "${p_id}", contract_id: "${sc2}", daily_ratable_gallons: 200 }, as: AllocationManager, captures: { lr2: $.data.id } }
            - { call: "POST /rack/lifting-rights", payload: { customer_id: "${c3}", terminal_id: "${t_id}", product_id: "${p_id}", contract_id: "${sc3}", daily_ratable_gallons: 300 }, as: AllocationManager, captures: { lr3: $.data.id } }
            # First publish PRO_RATA with pool=100
            - { call: "GET /rack/terminals/${t_id}", payload: {}, as: PlatformAdmin, captures: { tv_a: $.data.version } }
            - { call: "POST /rack/allocation-notices", payload: { terminal_id: "${t_id}", effective_date: "2026-08-01", total_pool_gallons: 100, allocation_method: "PRO_RATA" }, as: AllocationManager, captures: { an_pr: $.data.id } }
            - { call: "POST /rack/allocation-notices/${an_pr}/publish", payload: { expected_terminal_version: "${tv_a}" }, as: AllocationManager }
            # Now supersede with RATCHET, pool=450
            - { call: "GET /rack/terminals/${t_id}", payload: {}, as: PlatformAdmin, captures: { tv_b: $.data.version } }
            - { call: "POST /rack/allocation-notices", payload: { terminal_id: "${t_id}", effective_date: "2026-08-01", total_pool_gallons: 450, allocation_method: "RATCHET" }, as: AllocationManager, captures: { an_ra: $.data.id } }
            - { call: "POST /rack/allocation-notices/${an_ra}/publish", payload: { expected_terminal_version: "${tv_b}" }, as: AllocationManager }
          trigger:
            - { call: "GET /rack/lifting-rights/${lr1}", payload: {}, as: AllocationManager, captures: { lr1_alloc: $.data.allocated_gallons } }
            - { call: "GET /rack/lifting-rights/${lr2}", payload: {}, as: AllocationManager, captures: { lr2_alloc: $.data.allocated_gallons } }
            - { call: "GET /rack/lifting-rights/${lr3}", payload: {}, as: AllocationManager, captures: { lr3_alloc: $.data.allocated_gallons } }
          assert:
            - "Under PRO_RATA pool=100 with ratable=[100,200,300] the floor allocation was [16,33,50] plus remainder 1 to LR3 (highest ratable, then created_at ASC): [16,33,51]"
            - "After RATCHET supersede with pool=450: LiftingRight.${lr1}.allocated_gallons == 100"
            - "LiftingRight.${lr2}.allocated_gallons == 175"
            - "LiftingRight.${lr3}.allocated_gallons == 175"
            - "AllocationNotice.${an_pr}.status == SUPERSEDED"
            - "AllocationNotice.${an_ra}.status == PUBLISHED"

  # ==================================================================
  # Rule 2 — combinatorial_formula (≥2 instances, different modes)
  # ==================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: tax_jurisdiction_multi_level_stacked_aggregate_mode_a
        grounds:
          - calculations.tax_jurisdiction_determination
          - entities.TaxJurisdictionRule.fields.jurisdiction_level
        distinguishing_aspect: |
          Mode (a): tax_jurisdiction_determination combines FOUR levels
          (FEDERAL+STATE+COUNTY+CITY), each gated on (jurisdiction_code match,
          product_family match, date-window containment), and applies a
          state-conditional branded uplift when state=='CA' && branded==true —
          the total is a non-linear interaction of >=3 inputs with conditional
          branches on entity state.
        test_recipe:
          setup:
            - "Terminal T in CA/06037/LAX, Product P GASOLINE brandable, Customer C credit_limit=10^9, contract RACK_MINUS_2"
            - "LiftingRight LR ACTIVE ratable=100000; Terminal.inventory=100000"
            - "Tax rules: FED=18, STATE_CA=50, COUNTY_06037=10, CITY_LAX=5 (all GASOLINE, window covers today)"
            - "RackPriceSchedule PUBLISHED today: posted=300, branded_premium=20"
            - "Logical clock = 2026-08-01T08:00:00Z"
          setup_api_calls:
            - { call: "POST /rack/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T08:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /rack/terminals", payload: { terminal_code: "LAX-02", legal_name: "T", state_code: "CA", county_code: "06037", city_code: "LAX" }, as: PlatformAdmin, captures: { t_id: $.data.id, t_v: $.data.version } }
            - { call: "POST /rack/products", payload: { product_code: "PREM93", display_name: "Prem", product_family: "GASOLINE", is_brandable: true }, as: PlatformAdmin, captures: { p_id: $.data.id } }
            - { call: "POST /rack/customers", payload: { customer_code: "CC", legal_name: "C", credit_limit_cents: 1000000000 }, as: PlatformAdmin, captures: { c_id: $.data.id } }
            - { call: "POST /rack/supply-contracts", payload: { customer_id: "${c_id}", start_date: "2026-01-01", end_date: "2026-12-31", volume_commitment_gallons: 1000000, pricing_tier: "RACK_MINUS_2" }, as: ContractAdministrator, captures: { sc_id: $.data.id } }
            - { call: "POST /rack/supply-contracts/${sc_id}/activate", payload: {}, as: ContractAdministrator }
            - { call: "POST /rack/lifting-rights", payload: { customer_id: "${c_id}", terminal_id: "${t_id}", product_id: "${p_id}", contract_id: "${sc_id}", daily_ratable_gallons: 100000 }, as: AllocationManager, captures: { lr_id: $.data.id } }
            - { call: "POST /rack/tax-rules", payload: { jurisdiction_level: "FEDERAL", jurisdiction_code: "US", product_family: "GASOLINE", rate_cents_per_gal: 18, effective_start_date: "2026-01-01", effective_end_date: "2026-12-31" }, as: PlatformAdmin }
            - { call: "POST /rack/tax-rules", payload: { jurisdiction_level: "STATE", jurisdiction_code: "CA", product_family: "GASOLINE", rate_cents_per_gal: 50, effective_start_date: "2026-01-01", effective_end_date: "2026-12-31" }, as: PlatformAdmin }
            - { call: "POST /rack/tax-rules", payload: { jurisdiction_level: "COUNTY", jurisdiction_code: "06037", product_family: "GASOLINE", rate_cents_per_gal: 10, effective_start_date: "2026-01-01", effective_end_date: "2026-12-31" }, as: PlatformAdmin }
            - { call: "POST /rack/tax-rules", payload: { jurisdiction_level: "CITY", jurisdiction_code: "LAX", product_family: "GASOLINE", rate_cents_per_gal: 5, effective_start_date: "2026-01-01", effective_end_date: "2026-12-31" }, as: PlatformAdmin }
            - { call: "POST /rack/terminals/${t_id}/inventory/adjust", payload: { delta_gallons: 100000, reason: "init" }, as: TerminalOperator }
            - { call: "POST /rack/price-schedules", payload: { terminal_id: "${t_id}", product_id: "${p_id}", effective_date: "2026-08-01", posted_rack_cents_per_gal: 300, branded_premium_cents_per_gal: 20 }, as: RackPriceAnalyst, captures: { ps_id: $.data.id } }
            - { call: "POST /rack/price-schedules/${ps_id}/publish", payload: { expected_terminal_version: "${t_v}" }, as: RackPriceAnalyst }
            - { call: "POST /rack/lifting-tickets", payload: { lifting_right_id: "${lr_id}", requested_gallons: 1000, branded: true, additive_package_code: "PKG_A" }, as: TerminalOperator, captures: { tick_id: $.data.id } }
          trigger:
            - { call: "POST /rack/lifting-tickets/${tick_id}/post-bol", payload: {}, as: TerminalOperator }
          assert:
            - "LiftingTicket.${tick_id}.unit_price_cents_per_gal == 318 (300 + 20 branded - 2 RACK_MINUS_2)"
            - "LiftingTicket.${tick_id}.additive_cost_cents == 850 (PKG_A: round_half_up(1000*250/1000)+500 + round_half_up(1000*100/1000)+0 = 750+100)"
            - "LiftingTicket.${tick_id}.tax_cents == 85000 (1000 gal * (18+50+2_CA_branded+10+5))"
            - "LiftingTicket.${tick_id}.gross_cents == 403850 (318000 + 850 + 85000)"

      - name: additive_injection_per_line_round_then_sum_mode_b
        grounds:
          - calculations.additive_injection_cost
        distinguishing_aspect: |
          Mode (b): additive_injection_cost pins a nested-rounding order —
          round each additive line to integer cents with round_half_up THEN sum
          — which differs from sum-then-round by exactly 1 cent on a crafted
          1001-gallon PKG_C ticket (600 vs 601).
        test_recipe:
          setup:
            - "Terminal T in TX (county 48201, city HOU), Product P DIESEL brandable"
            - "Customer C credit_limit=10^9, contract RACK"
            - "LiftingRight LR ACTIVE ratable=100000; inventory=100000"
            - "Tax rules: FED=24, STATE_TX=20 (DIESEL only); no COUNTY/CITY rules"
            - "RackPriceSchedule PUBLISHED: posted=280, branded_premium=15"
            - "Logical clock = 2026-08-01T08:00:00Z"
          setup_api_calls:
            - { call: "POST /rack/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T08:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /rack/terminals", payload: { terminal_code: "HOU-01", legal_name: "T", state_code: "TX", county_code: "48201", city_code: "HOU" }, as: PlatformAdmin, captures: { t_id: $.data.id, t_v: $.data.version } }
            - { call: "POST /rack/products", payload: { product_code: "ULSD-B", display_name: "D", product_family: "DIESEL", is_brandable: true }, as: PlatformAdmin, captures: { p_id: $.data.id } }
            - { call: "POST /rack/customers", payload: { customer_code: "CC", legal_name: "C", credit_limit_cents: 1000000000 }, as: PlatformAdmin, captures: { c_id: $.data.id } }
            - { call: "POST /rack/supply-contracts", payload: { customer_id: "${c_id}", start_date: "2026-01-01", end_date: "2026-12-31", volume_commitment_gallons: 1000000, pricing_tier: "RACK" }, as: ContractAdministrator, captures: { sc_id: $.data.id } }
            - { call: "POST /rack/supply-contracts/${sc_id}/activate", payload: {}, as: ContractAdministrator }
            - { call: "POST /rack/lifting-rights", payload: { customer_id: "${c_id}", terminal_id: "${t_id}", product_id: "${p_id}", contract_id: "${sc_id}", daily_ratable_gallons: 100000 }, as: AllocationManager, captures: { lr_id: $.data.id } }
            - { call: "POST /rack/tax-rules", payload: { jurisdiction_level: "FEDERAL", jurisdiction_code: "US", product_family: "DIESEL", rate_cents_per_gal: 24, effective_start_date: "2026-01-01", effective_end_date: "2026-12-31" }, as: PlatformAdmin }
            - { call: "POST /rack/tax-rules", payload: { jurisdiction_level: "STATE", jurisdiction_code: "TX", product_family: "DIESEL", rate_cents_per_gal: 20, effective_start_date: "2026-01-01", effective_end_date: "2026-12-31" }, as: PlatformAdmin }
            - { call: "POST /rack/terminals/${t_id}/inventory/adjust", payload: { delta_gallons: 100000, reason: "init" }, as: TerminalOperator }
            - { call: "POST /rack/price-schedules", payload: { terminal_id: "${t_id}", product_id: "${p_id}", effective_date: "2026-08-01", posted_rack_cents_per_gal: 280, branded_premium_cents_per_gal: 15 }, as: RackPriceAnalyst, captures: { ps_id: $.data.id } }
            - { call: "POST /rack/price-schedules/${ps_id}/publish", payload: { expected_terminal_version: "${t_v}" }, as: RackPriceAnalyst }
            - { call: "POST /rack/lifting-tickets", payload: { lifting_right_id: "${lr_id}", requested_gallons: 1001, branded: true, additive_package_code: "PKG_C" }, as: TerminalOperator, captures: { tick_id: $.data.id } }
          trigger:
            - { call: "POST /rack/lifting-tickets/${tick_id}/post-bol", payload: {}, as: TerminalOperator }
          assert:
            - "LiftingTicket.${tick_id}.unit_price_cents_per_gal == 295 (280+15-0)"
            - "LiftingTicket.${tick_id}.additive_cost_cents == 850 — PKG_C per-line round_half_up: line1=round(1001*333/1000)+0=333, line2=round(1001*167/1000)+250=167+250=417, line3=round(1001*100/1000)+0=100; total=850. Sum-then-round would give round(600.6)+250=851, off by 1."
            - "LiftingTicket.${tick_id}.tax_cents == 44044 (1001 * (24+20))"
            - "LiftingTicket.${tick_id}.gross_cents == 340189 (1001*295 + 850 + 44044)"

  # ==================================================================
  # Rule 3 — non_linear_state_machine (≥2 instances, different entities)
  # ==================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: lifting_ticket_bol_reverse_cycle
        grounds:
          - state_machines.LiftingTicket.RESERVED_to_BOL_ISSUED
          - state_machines.LiftingTicket.BOL_ISSUED_to_RESERVED
        distinguishing_aspect: |
          LiftingTicket exhibits a cycle RESERVED→BOL_ISSUED→RESERVED (via
          reverse-bol) that may then re-post forward; each loop reverses and
          re-applies inventory / exposure / aggregate side-effects.
        test_recipe:
          setup:
            - "Terminal T (TX), Product P DIESEL non-brandable, Customer C, contract RACK, right LR ACTIVE ratable=100000"
            - "Tax rules FED=24/STATE=20 (DIESEL); inventory=50000"
            - "RackPriceSchedule posted=280 published"
            - "Logical clock = 2026-08-01T08:00:00Z"
          setup_api_calls:
            - { call: "POST /rack/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T08:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /rack/terminals", payload: { terminal_code: "HOU-02", legal_name: "T", state_code: "TX", county_code: "48201", city_code: "HOU" }, as: PlatformAdmin, captures: { t_id: $.data.id, t_v: $.data.version } }
            - { call: "POST /rack/products", payload: { product_code: "ULSD", display_name: "D", product_family: "DIESEL", is_brandable: false }, as: PlatformAdmin, captures: { p_id: $.data.id } }
            - { call: "POST /rack/customers", payload: { customer_code: "C", legal_name: "C", credit_limit_cents: 1000000000 }, as: PlatformAdmin, captures: { c_id: $.data.id } }
            - { call: "POST /rack/supply-contracts", payload: { customer_id: "${c_id}", start_date: "2026-01-01", end_date: "2026-12-31", volume_commitment_gallons: 1000000, pricing_tier: "RACK" }, as: ContractAdministrator, captures: { sc_id: $.data.id } }
            - { call: "POST /rack/supply-contracts/${sc_id}/activate", payload: {}, as: ContractAdministrator }
            - { call: "POST /rack/lifting-rights", payload: { customer_id: "${c_id}", terminal_id: "${t_id}", product_id: "${p_id}", contract_id: "${sc_id}", daily_ratable_gallons: 100000 }, as: AllocationManager, captures: { lr_id: $.data.id } }
            - { call: "POST /rack/tax-rules", payload: { jurisdiction_level: "FEDERAL", jurisdiction_code: "US", product_family: "DIESEL", rate_cents_per_gal: 24, effective_start_date: "2026-01-01", effective_end_date: "2026-12-31" }, as: PlatformAdmin }
            - { call: "POST /rack/tax-rules", payload: { jurisdiction_level: "STATE", jurisdiction_code: "TX", product_family: "DIESEL", rate_cents_per_gal: 20, effective_start_date: "2026-01-01", effective_end_date: "2026-12-31" }, as: PlatformAdmin }
            - { call: "POST /rack/terminals/${t_id}/inventory/adjust", payload: { delta_gallons: 50000, reason: "init" }, as: TerminalOperator }
            - { call: "POST /rack/price-schedules", payload: { terminal_id: "${t_id}", product_id: "${p_id}", effective_date: "2026-08-01", posted_rack_cents_per_gal: 280, branded_premium_cents_per_gal: 0 }, as: RackPriceAnalyst, captures: { ps_id: $.data.id } }
            - { call: "POST /rack/price-schedules/${ps_id}/publish", payload: { expected_terminal_version: "${t_v}" }, as: RackPriceAnalyst }
            - { call: "POST /rack/lifting-tickets", payload: { lifting_right_id: "${lr_id}", requested_gallons: 5000, branded: false }, as: TerminalOperator, captures: { tick_id: $.data.id } }
          trigger:
            - { call: "POST /rack/lifting-tickets/${tick_id}/post-bol", payload: {}, as: TerminalOperator }
            - { call: "POST /rack/lifting-tickets/${tick_id}/reverse-bol", payload: {}, as: TerminalOperator }
            - { call: "POST /rack/lifting-tickets/${tick_id}/post-bol", payload: {}, as: TerminalOperator, captures: { final_status: $.data.status } }
          assert:
            - "After first post-bol: Terminal.${t_id}.inventory_gallons == 45000"
            - "After reverse-bol: Terminal.${t_id}.inventory_gallons == 50000 (compensating)"
            - "After second post-bol: Terminal.${t_id}.inventory_gallons == 45000"
            - "LiftingTicket.${tick_id}.status == BOL_ISSUED at end (cycle traversed twice)"
            - "LiftingRight.${lr_id}.lifted_today_gallons == 5000 (post-reverse-post nets to one BOL)"

      - name: supply_contract_branching_close_vs_default_fork
        grounds:
          - state_machines.SupplyContract.ACTIVE_to_CLOSED
          - state_machines.SupplyContract.ACTIVE_to_DEFAULTED
        distinguishing_aspect: |
          SupplyContract exhibits a branching fork at close: identical trigger
          produces CLOSED (volume met) or DEFAULTED (shortfall), with divergent
          side-effect sets — DEFAULTED additionally places the customer on
          credit hold and appends a CreditHoldLog PLACED event. This is a
          fork-join shape on a different entity (SupplyContract) than the
          LiftingTicket cycle.
        test_recipe:
          setup:
            - "Two customers C1, C2 with credit_status=GOOD; contracts SC1 (commitment=100) and SC2 (commitment=5000) both ACTIVE"
            - "SC1 has lifted_to_date_gallons=100 (satisfied); SC2 has lifted_to_date_gallons=100 (shortfall)"
            - "Logical clock = 2026-08-01T08:00:00Z"
          setup_api_calls:
            - { call: "POST /rack/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T08:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /rack/terminals", payload: { terminal_code: "T", legal_name: "T", state_code: "TX", county_code: "48201", city_code: "HOU" }, as: PlatformAdmin, captures: { t_id: $.data.id, t_v: $.data.version } }
            - { call: "POST /rack/products", payload: { product_code: "ULSD", display_name: "D", product_family: "DIESEL", is_brandable: false }, as: PlatformAdmin, captures: { p_id: $.data.id } }
            - { call: "POST /rack/customers", payload: { customer_code: "C1", legal_name: "C1", credit_limit_cents: 1000000000 }, as: PlatformAdmin, captures: { c1: $.data.id } }
            - { call: "POST /rack/customers", payload: { customer_code: "C2", legal_name: "C2", credit_limit_cents: 1000000000 }, as: PlatformAdmin, captures: { c2: $.data.id } }
            - { call: "POST /rack/supply-contracts", payload: { customer_id: "${c1}", start_date: "2026-01-01", end_date: "2026-12-31", volume_commitment_gallons: 100, pricing_tier: "RACK" }, as: ContractAdministrator, captures: { sc1: $.data.id } }
            - { call: "POST /rack/supply-contracts/${sc1}/activate", payload: {}, as: ContractAdministrator }
            - { call: "POST /rack/supply-contracts", payload: { customer_id: "${c2}", start_date: "2026-01-01", end_date: "2026-12-31", volume_commitment_gallons: 5000, pricing_tier: "RACK" }, as: ContractAdministrator, captures: { sc2: $.data.id } }
            - { call: "POST /rack/supply-contracts/${sc2}/activate", payload: {}, as: ContractAdministrator }
            - { call: "POST /rack/lifting-rights", payload: { customer_id: "${c1}", terminal_id: "${t_id}", product_id: "${p_id}", contract_id: "${sc1}", daily_ratable_gallons: 100000 }, as: AllocationManager, captures: { lr1: $.data.id } }
            - { call: "POST /rack/lifting-rights", payload: { customer_id: "${c2}", terminal_id: "${t_id}", product_id: "${p_id}", contract_id: "${sc2}", daily_ratable_gallons: 100000 }, as: AllocationManager, captures: { lr2: $.data.id } }
            - { call: "POST /rack/tax-rules", payload: { jurisdiction_level: "FEDERAL", jurisdiction_code: "US", product_family: "DIESEL", rate_cents_per_gal: 24, effective_start_date: "2026-01-01", effective_end_date: "2026-12-31" }, as: PlatformAdmin }
            - { call: "POST /rack/terminals/${t_id}/inventory/adjust", payload: { delta_gallons: 100000, reason: "init" }, as: TerminalOperator }
            - { call: "POST /rack/price-schedules", payload: { terminal_id: "${t_id}", product_id: "${p_id}", effective_date: "2026-08-01", posted_rack_cents_per_gal: 280, branded_premium_cents_per_gal: 0 }, as: RackPriceAnalyst, captures: { ps_id: $.data.id } }
            - { call: "POST /rack/price-schedules/${ps_id}/publish", payload: { expected_terminal_version: "${t_v}" }, as: RackPriceAnalyst }
            # Each customer lifts 100 gal and posts BOL
            - { call: "POST /rack/lifting-tickets", payload: { lifting_right_id: "${lr1}", requested_gallons: 100, branded: false }, as: TerminalOperator, captures: { tk1: $.data.id } }
            - { call: "POST /rack/lifting-tickets/${tk1}/post-bol", payload: {}, as: TerminalOperator }
            - { call: "POST /rack/lifting-tickets", payload: { lifting_right_id: "${lr2}", requested_gallons: 100, branded: false }, as: TerminalOperator, captures: { tk2: $.data.id } }
            - { call: "POST /rack/lifting-tickets/${tk2}/post-bol", payload: {}, as: TerminalOperator }
          trigger:
            - { call: "POST /rack/supply-contracts/${sc1}/close", payload: {}, as: ContractAdministrator, captures: { sc1_status: $.data.status } }
            - { call: "POST /rack/supply-contracts/${sc2}/close", payload: {}, as: ContractAdministrator, captures: { sc2_status: $.data.status } }
          assert:
            - "SupplyContract.${sc1}.status == CLOSED (volume met, 100>=100)"
            - "SupplyContract.${sc2}.status == DEFAULTED (volume short, 100<5000)"
            - "Customer.${c1}.credit_status == GOOD (unchanged on CLOSED branch)"
            - "Customer.${c2}.credit_status == HOLD (DEFAULTED branch cascades hold)"
            - "Customer.${c2}.hold_reason == 'CONTRACT_DEFAULT'"

  # ==================================================================
  # Rule 4 — transitive_cascade (≥2 instances, different triggers; depth ≥3 and ≥2)
  # ==================================================================
  - rule_id: transitive_cascade
    instances:
      - name: allocation_publish_three_hop_cascade
        grounds:
          - state_machines.AllocationNotice.DRAFT_to_PUBLISHED
          - state_machines.Terminal.OPEN_to_SHORTAGE
          - state_machines.LiftingRight
        distinguishing_aspect: |
          Depth-3 chain originating from AllocationNotice publish:
          (1) notice publish → Terminal.rack_status OPEN→SHORTAGE
          (2) Terminal SHORTAGE → LiftingRight.allocated_gallons recomputed via ratable_allocation
          (3) recomputed allocated_gallons caps subsequent LiftingTicket reservations
          Each link is caused by the previous link's mutation, not by the
          original publish action directly.
        test_recipe:
          setup:
            - "Terminal T with two ACTIVE LiftingRights LR1(ratable=100), LR2(ratable=300)"
            - "No PUBLISHED AllocationNotice yet; Terminal.rack_status=OPEN"
            - "Logical clock = 2026-08-01T08:00:00Z"
          setup_api_calls:
            - { call: "POST /rack/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T08:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /rack/terminals", payload: { terminal_code: "T", legal_name: "T", state_code: "TX", county_code: "48201", city_code: "HOU" }, as: PlatformAdmin, captures: { t_id: $.data.id, t_v: $.data.version } }
            - { call: "POST /rack/products", payload: { product_code: "ULSD", display_name: "D", product_family: "DIESEL", is_brandable: false }, as: PlatformAdmin, captures: { p_id: $.data.id } }
            - { call: "POST /rack/customers", payload: { customer_code: "C1", legal_name: "C1", credit_limit_cents: 1000000000 }, as: PlatformAdmin, captures: { c1: $.data.id } }
            - { call: "POST /rack/customers", payload: { customer_code: "C2", legal_name: "C2", credit_limit_cents: 1000000000 }, as: PlatformAdmin, captures: { c2: $.data.id } }
            - { call: "POST /rack/supply-contracts", payload: { customer_id: "${c1}", start_date: "2026-01-01", end_date: "2026-12-31", volume_commitment_gallons: 10000, pricing_tier: "RACK" }, as: ContractAdministrator, captures: { sc1: $.data.id } }
            - { call: "POST /rack/supply-contracts/${sc1}/activate", payload: {}, as: ContractAdministrator }
            - { call: "POST /rack/supply-contracts", payload: { customer_id: "${c2}", start_date: "2026-01-01", end_date: "2026-12-31", volume_commitment_gallons: 10000, pricing_tier: "RACK" }, as: ContractAdministrator, captures: { sc2: $.data.id } }
            - { call: "POST /rack/supply-contracts/${sc2}/activate", payload: {}, as: ContractAdministrator }
            - { call: "POST /rack/lifting-rights", payload: { customer_id: "${c1}", terminal_id: "${t_id}", product_id: "${p_id}", contract_id: "${sc1}", daily_ratable_gallons: 100 }, as: AllocationManager, captures: { lr1: $.data.id } }
            - { call: "POST /rack/lifting-rights", payload: { customer_id: "${c2}", terminal_id: "${t_id}", product_id: "${p_id}", contract_id: "${sc2}", daily_ratable_gallons: 300 }, as: AllocationManager, captures: { lr2: $.data.id } }
            # Trigger: publish notice with pool=200 (less than sum_ratable=400 → SHORTAGE)
            - { call: "POST /rack/allocation-notices", payload: { terminal_id: "${t_id}", effective_date: "2026-08-01", total_pool_gallons: 200, allocation_method: "PRO_RATA" }, as: AllocationManager, captures: { an_id: $.data.id } }
            - { call: "POST /rack/allocation-notices/${an_id}/publish", payload: { expected_terminal_version: "${t_v}" }, as: AllocationManager }
          trigger:
            # Hop 3 verification: a reservation beyond LR1's allocated share is rejected
            - { call: "POST /rack/lifting-tickets", payload: { lifting_right_id: "${lr1}", requested_gallons: 51, branded: false }, as: TerminalOperator, captures: { err: $.data.error_id } }
          assert:
            - "Hop 1: Terminal.${t_id}.rack_status == SHORTAGE (pool 200 < sum ratable 400)"
            - "Hop 2: LiftingRight.${lr1}.allocated_gallons == 50 (PRO_RATA: floor(200*100/400)=50); LiftingRight.${lr2}.allocated_gallons == 150"
            - "Hop 3: POST /rack/lifting-tickets with requested_gallons=51 against LR1 (allocated=50) returns ERR_ALLOCATION_EXCEEDED"
            - "trigger response error_id == ERR_ALLOCATION_EXCEEDED"

      - name: contract_default_two_hop_credit_hold_cascade
        grounds:
          - state_machines.SupplyContract.ACTIVE_to_DEFAULTED
          - state_machines.Customer.GOOD_to_HOLD
        distinguishing_aspect: |
          Depth-2 chain originating from SupplyContract close (different
          trigger than AllocationNotice publish):
          (1) contract close with shortfall → SupplyContract.status = DEFAULTED
          (2) DEFAULTED → Customer.credit_status GOOD→HOLD + CreditHoldLog PLACED
          This propagation pattern (contract default → credit) is distinct
          from the allocation-driven chain.
        test_recipe:
          setup:
            - "Customer C credit_status=GOOD, contract SC commitment=5000 ACTIVE, lifted_to_date=100"
            - "Logical clock = 2026-08-01T08:00:00Z"
          setup_api_calls:
            - { call: "POST /rack/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T08:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /rack/terminals", payload: { terminal_code: "T", legal_name: "T", state_code: "TX", county_code: "48201", city_code: "HOU" }, as: PlatformAdmin, captures: { t_id: $.data.id, t_v: $.data.version } }
            - { call: "POST /rack/products", payload: { product_code: "ULSD", display_name: "D", product_family: "DIESEL", is_brandable: false }, as: PlatformAdmin, captures: { p_id: $.data.id } }
            - { call: "POST /rack/customers", payload: { customer_code: "C", legal_name: "C", credit_limit_cents: 1000000000 }, as: PlatformAdmin, captures: { c_id: $.data.id } }
            - { call: "POST /rack/supply-contracts", payload: { customer_id: "${c_id}", start_date: "2026-01-01", end_date: "2026-12-31", volume_commitment_gallons: 5000, pricing_tier: "RACK" }, as: ContractAdministrator, captures: { sc_id: $.data.id } }
            - { call: "POST /rack/supply-contracts/${sc_id}/activate", payload: {}, as: ContractAdministrator }
            - { call: "POST /rack/lifting-rights", payload: { customer_id: "${c_id}", terminal_id: "${t_id}", product_id: "${p_id}", contract_id: "${sc_id}", daily_ratable_gallons: 100000 }, as: AllocationManager, captures: { lr: $.data.id } }
            - { call: "POST /rack/tax-rules", payload: { jurisdiction_level: "FEDERAL", jurisdiction_code: "US", product_family: "DIESEL", rate_cents_per_gal: 24, effective_start_date: "2026-01-01", effective_end_date: "2026-12-31" }, as: PlatformAdmin }
            - { call: "POST /rack/terminals/${t_id}/inventory/adjust", payload: { delta_gallons: 100000, reason: "init" }, as: TerminalOperator }
            - { call: "POST /rack/price-schedules", payload: { terminal_id: "${t_id}", product_id: "${p_id}", effective_date: "2026-08-01", posted_rack_cents_per_gal: 280, branded_premium_cents_per_gal: 0 }, as: RackPriceAnalyst, captures: { ps_id: $.data.id } }
            - { call: "POST /rack/price-schedules/${ps_id}/publish", payload: { expected_terminal_version: "${t_v}" }, as: RackPriceAnalyst }
            - { call: "POST /rack/lifting-tickets", payload: { lifting_right_id: "${lr}", requested_gallons: 100, branded: false }, as: TerminalOperator, captures: { tk: $.data.id } }
            - { call: "POST /rack/lifting-tickets/${tk}/post-bol", payload: {}, as: TerminalOperator }
          trigger:
            - { call: "POST /rack/supply-contracts/${sc_id}/close", payload: {}, as: ContractAdministrator }
          assert:
            - "Hop 1: SupplyContract.${sc_id}.status == DEFAULTED"
            - "Hop 2: Customer.${c_id}.credit_status == HOLD"
            - "Hop 2: Customer.${c_id}.hold_reason == 'CONTRACT_DEFAULT'"
            - "Hop 2: CreditHoldLog contains a PLACED event for ${c_id} with trigger_reason='CONTRACT_DEFAULT'"

  # ==================================================================
  # Rule 5 — priority_pair_validation_conflict (≥2 instances, different error-category pairs)
  # ==================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_business_fiscal_on_post_bol
        grounds:
          - validations[priority=4]
          - validations[priority=6]
          - state_machines.LiftingTicket.RESERVED_to_BOL_ISSUED
        distinguishing_aspect: |
          Pair (state, business_safety/business_fiscal): a LiftingTicket in
          CANCELLED state AND whose customer is on credit hold — post-bol must
          return the state error (ERR_TICKET_NOT_RESERVED), not the fiscal
          error (ERR_CUSTOMER_ON_CREDIT_HOLD), because state (priority 4) is
          checked before business rules (priority 6).
        test_recipe:
          setup:
            - "Terminal T, product P, customer C later placed on credit hold"
            - "Ticket created then cancelled, so status=CANCELLED"
            - "Customer placed on credit hold AFTER ticket cancelled"
            - "Logical clock = 2026-08-01T08:00:00Z"
          setup_api_calls:
            - { call: "POST /rack/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T08:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /rack/terminals", payload: { terminal_code: "T", legal_name: "T", state_code: "TX", county_code: "48201", city_code: "HOU" }, as: PlatformAdmin, captures: { t_id: $.data.id, t_v: $.data.version } }
            - { call: "POST /rack/products", payload: { product_code: "ULSD", display_name: "D", product_family: "DIESEL", is_brandable: false }, as: PlatformAdmin, captures: { p_id: $.data.id } }
            - { call: "POST /rack/customers", payload: { customer_code: "C", legal_name: "C", credit_limit_cents: 1000000000 }, as: PlatformAdmin, captures: { c_id: $.data.id } }
            - { call: "POST /rack/supply-contracts", payload: { customer_id: "${c_id}", start_date: "2026-01-01", end_date: "2026-12-31", volume_commitment_gallons: 10000, pricing_tier: "RACK" }, as: ContractAdministrator, captures: { sc_id: $.data.id } }
            - { call: "POST /rack/supply-contracts/${sc_id}/activate", payload: {}, as: ContractAdministrator }
            - { call: "POST /rack/lifting-rights", payload: { customer_id: "${c_id}", terminal_id: "${t_id}", product_id: "${p_id}", contract_id: "${sc_id}", daily_ratable_gallons: 100000 }, as: AllocationManager, captures: { lr: $.data.id } }
            - { call: "POST /rack/lifting-tickets", payload: { lifting_right_id: "${lr}", requested_gallons: 1000, branded: false }, as: TerminalOperator, captures: { tk: $.data.id } }
            - { call: "POST /rack/lifting-tickets/${tk}/cancel", payload: {}, as: TerminalOperator }
            - { call: "POST /rack/customers/${c_id}/place-hold", payload: { reason: "MANUAL" }, as: CreditAnalyst }
          trigger:
            - { call: "POST /rack/lifting-tickets/${tk}/post-bol", payload: {}, as: TerminalOperator, captures: { err: $.data.error_id } }
          assert:
            - "response error_id == ERR_TICKET_NOT_RESERVED (state beats fiscal)"
            - "response error_id != ERR_CUSTOMER_ON_CREDIT_HOLD"

      - name: business_constraint_vs_business_temporal_on_publish
        grounds:
          - validations[priority=12]
          - validations[priority=15]
        distinguishing_aspect: |
          Pair (business_temporal, business_constraint): a publish call where
          effective_date is in the past AND expected_terminal_version is stale
          must return ERR_SCHEDULE_DATE_IN_PAST (priority 12) before the OCC
          staleness check (priority 15) fires.
        test_recipe:
          setup:
            - "Terminal T with version=2 after one prior publish"
            - "A DRAFT schedule PS with effective_date=2026-07-01 (in the past relative to logical clock 2026-08-01)"
            - "Logical clock = 2026-08-01T08:00:00Z"
          setup_api_calls:
            - { call: "POST /rack/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T08:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /rack/terminals", payload: { terminal_code: "T", legal_name: "T", state_code: "TX", county_code: "48201", city_code: "HOU" }, as: PlatformAdmin, captures: { t_id: $.data.id, t_v0: $.data.version } }
            - { call: "POST /rack/products", payload: { product_code: "ULSD", display_name: "D", product_family: "DIESEL", is_brandable: false }, as: PlatformAdmin, captures: { p_id: $.data.id } }
            # First publish to bump Terminal.version to 2
            - { call: "POST /rack/price-schedules", payload: { terminal_id: "${t_id}", product_id: "${p_id}", effective_date: "2026-08-01", posted_rack_cents_per_gal: 280, branded_premium_cents_per_gal: 0 }, as: RackPriceAnalyst, captures: { ps_a: $.data.id } }
            - { call: "POST /rack/price-schedules/${ps_a}/publish", payload: { expected_terminal_version: "${t_v0}" }, as: RackPriceAnalyst }
            # Now create a DRAFT with past effective_date; Terminal.version is now stale (t_v0 is old)
            - { call: "POST /rack/price-schedules", payload: { terminal_id: "${t_id}", product_id: "${p_id}", effective_date: "2026-07-01", posted_rack_cents_per_gal: 300, branded_premium_cents_per_gal: 0 }, as: RackPriceAnalyst, captures: { ps_past: $.data.id } }
          trigger:
            - { call: "POST /rack/price-schedules/${ps_past}/publish", payload: { expected_terminal_version: "${t_v0}" }, as: RackPriceAnalyst, captures: { err: $.data.error_id } }
          assert:
            - "response error_id == ERR_SCHEDULE_DATE_IN_PAST (temporal validation beats OCC)"
            - "response error_id != ERR_STALE_VERSION"

  # ==================================================================
  # Rule 6 — boundary_precision_check (≥2 instances, different metrics/endpoints)
  # ==================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: credit_limit_exact_equality_allows_reservation
        grounds:
          - validations[priority=13]
          - calculations.credit_exposure_tracking
        distinguishing_aspect: |
          Metric = Customer.open_lifting_exposure_cents vs credit_limit_cents;
          the rule is `<=` (not `<`), so a reservation whose provisional
          gross_cents brings exposure EXACTLY to the limit MUST be allowed;
          one cent over MUST be rejected. Reachable via POST
          /rack/lifting-tickets.
        test_recipe:
          setup:
            - "Terminal T, Product P, customer C credit_limit_cents = 306000"
            - "RackPriceSchedule posted=280 PUBLISHED today; FED=24, STATE_TX=20 (DIESEL), no other rules"
            - "provisional gross_cents at reservation = 1000 * 280 + 1000 * 44 = 280000+44000 = 324000... use 306000: pick posted=262 → 1000*262+44000=306000"
            - "RackPriceSchedule posted=262; tax rate sum = 44 c/gal → provisional gross = 306000"
            - "Logical clock = 2026-08-01T08:00:00Z"
          setup_api_calls:
            - { call: "POST /rack/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T08:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /rack/terminals", payload: { terminal_code: "T", legal_name: "T", state_code: "TX", county_code: "48201", city_code: "HOU" }, as: PlatformAdmin, captures: { t_id: $.data.id, t_v: $.data.version } }
            - { call: "POST /rack/products", payload: { product_code: "ULSD", display_name: "D", product_family: "DIESEL", is_brandable: false }, as: PlatformAdmin, captures: { p_id: $.data.id } }
            - { call: "POST /rack/customers", payload: { customer_code: "C", legal_name: "C", credit_limit_cents: 306000 }, as: PlatformAdmin, captures: { c_id: $.data.id } }
            - { call: "POST /rack/supply-contracts", payload: { customer_id: "${c_id}", start_date: "2026-01-01", end_date: "2026-12-31", volume_commitment_gallons: 10000, pricing_tier: "RACK" }, as: ContractAdministrator, captures: { sc_id: $.data.id } }
            - { call: "POST /rack/supply-contracts/${sc_id}/activate", payload: {}, as: ContractAdministrator }
            - { call: "POST /rack/lifting-rights", payload: { customer_id: "${c_id}", terminal_id: "${t_id}", product_id: "${p_id}", contract_id: "${sc_id}", daily_ratable_gallons: 100000 }, as: AllocationManager, captures: { lr: $.data.id } }
            - { call: "POST /rack/tax-rules", payload: { jurisdiction_level: "FEDERAL", jurisdiction_code: "US", product_family: "DIESEL", rate_cents_per_gal: 24, effective_start_date: "2026-01-01", effective_end_date: "2026-12-31" }, as: PlatformAdmin }
            - { call: "POST /rack/tax-rules", payload: { jurisdiction_level: "STATE", jurisdiction_code: "TX", product_family: "DIESEL", rate_cents_per_gal: 20, effective_start_date: "2026-01-01", effective_end_date: "2026-12-31" }, as: PlatformAdmin }
            - { call: "POST /rack/price-schedules", payload: { terminal_id: "${t_id}", product_id: "${p_id}", effective_date: "2026-08-01", posted_rack_cents_per_gal: 262, branded_premium_cents_per_gal: 0 }, as: RackPriceAnalyst, captures: { ps_id: $.data.id } }
            - { call: "POST /rack/price-schedules/${ps_id}/publish", payload: { expected_terminal_version: "${t_v}" }, as: RackPriceAnalyst }
          trigger:
            - { call: "POST /rack/lifting-tickets", payload: { lifting_right_id: "${lr}", requested_gallons: 1000, branded: false }, as: TerminalOperator, captures: { tk1: $.data.id, gross1: $.data.gross_cents } }
            - { call: "POST /rack/lifting-tickets", payload: { lifting_right_id: "${lr}", requested_gallons: 1, branded: false }, as: TerminalOperator, captures: { err: $.data.error_id } }
          assert:
            - "First reservation of 1000 gal returns 201 and gross_cents == 306000 (== credit_limit_cents, allowed because rule is `<=`)"
            - "Customer.${c_id}.open_lifting_exposure_cents == 306000"
            - "Second reservation of 1 gal returns ERR_CREDIT_LIMIT_EXCEEDED (would push to 306000 + 262+44 = 306306 > 306000)"

      - name: terminal_inventory_zero_gallons_boundary
        grounds:
          - validations[priority=9]
        distinguishing_aspect: |
          Metric = Terminal.inventory_gallons (a different metric than credit
          exposure) on a different endpoint (post-bol). At exactly 0 gallons,
          any post-bol is rejected; at exactly requested_gallons gallons,
          post-bol succeeds and leaves inventory at 0.
        test_recipe:
          setup:
            - "Terminal T, Product P, customer C with high credit; LR ACTIVE"
            - "Terminal.inventory_gallons = 5000 (exact match for ticket)"
            - "RackPriceSchedule PUBLISHED posted=280; FED tax 24"
            - "Logical clock = 2026-08-01T08:00:00Z"
          setup_api_calls:
            - { call: "POST /rack/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T08:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /rack/terminals", payload: { terminal_code: "T", legal_name: "T", state_code: "TX", county_code: "48201", city_code: "HOU" }, as: PlatformAdmin, captures: { t_id: $.data.id, t_v: $.data.version } }
            - { call: "POST /rack/products", payload: { product_code: "ULSD", display_name: "D", product_family: "DIESEL", is_brandable: false }, as: PlatformAdmin, captures: { p_id: $.data.id } }
            - { call: "POST /rack/customers", payload: { customer_code: "C", legal_name: "C", credit_limit_cents: 1000000000 }, as: PlatformAdmin, captures: { c_id: $.data.id } }
            - { call: "POST /rack/supply-contracts", payload: { customer_id: "${c_id}", start_date: "2026-01-01", end_date: "2026-12-31", volume_commitment_gallons: 100000, pricing_tier: "RACK" }, as: ContractAdministrator, captures: { sc_id: $.data.id } }
            - { call: "POST /rack/supply-contracts/${sc_id}/activate", payload: {}, as: ContractAdministrator }
            - { call: "POST /rack/lifting-rights", payload: { customer_id: "${c_id}", terminal_id: "${t_id}", product_id: "${p_id}", contract_id: "${sc_id}", daily_ratable_gallons: 100000 }, as: AllocationManager, captures: { lr: $.data.id } }
            - { call: "POST /rack/tax-rules", payload: { jurisdiction_level: "FEDERAL", jurisdiction_code: "US", product_family: "DIESEL", rate_cents_per_gal: 24, effective_start_date: "2026-01-01", effective_end_date: "2026-12-31" }, as: PlatformAdmin }
            - { call: "POST /rack/terminals/${t_id}/inventory/adjust", payload: { delta_gallons: 5000, reason: "init" }, as: TerminalOperator }
            - { call: "POST /rack/price-schedules", payload: { terminal_id: "${t_id}", product_id: "${p_id}", effective_date: "2026-08-01", posted_rack_cents_per_gal: 280, branded_premium_cents_per_gal: 0 }, as: RackPriceAnalyst, captures: { ps_id: $.data.id } }
            - { call: "POST /rack/price-schedules/${ps_id}/publish", payload: { expected_terminal_version: "${t_v}" }, as: RackPriceAnalyst }
            - { call: "POST /rack/lifting-tickets", payload: { lifting_right_id: "${lr}", requested_gallons: 5000, branded: false }, as: TerminalOperator, captures: { tk_a: $.data.id } }
            - { call: "POST /rack/lifting-tickets", payload: { lifting_right_id: "${lr}", requested_gallons: 1, branded: false }, as: TerminalOperator, captures: { tk_b: $.data.id } }
          trigger:
            - { call: "POST /rack/lifting-tickets/${tk_a}/post-bol", payload: {}, as: TerminalOperator }
            - { call: "POST /rack/lifting-tickets/${tk_b}/post-bol", payload: {}, as: TerminalOperator, captures: { err: $.data.error_id } }
          assert:
            - "Post-bol on 5000-gallon ticket succeeds when inventory == 5000 (>=, not >)"
            - "Terminal.${t_id}.inventory_gallons == 0 after first post-bol"
            - "Post-bol on 1-gallon ticket returns ERR_INSUFFICIENT_INVENTORY when inventory == 0"

  # ==================================================================
  # Rule 7 — cross_entity_state_dependency (≥2 instances, different entity pairs)
  # ==================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: lifting_right_reinstate_gated_on_customer_credit_status
        grounds:
          - state_machines.LiftingRight.SUSPENDED_to_ACTIVE
          - entities.Customer.fields.credit_status
        distinguishing_aspect: |
          Pair (LiftingRight, Customer): LiftingRight.SUSPENDED→ACTIVE requires
          the linked Customer.credit_status == GOOD. When the customer is on
          HOLD, reinstate is rejected with ERR_CUSTOMER_ON_CREDIT_HOLD.
        test_recipe:
          setup:
            - "Customer C, contract SC ACTIVE, LiftingRight LR created ACTIVE then SUSPENDED"
            - "Customer placed on HOLD manually"
            - "Logical clock = 2026-08-01T08:00:00Z"
          setup_api_calls:
            - { call: "POST /rack/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T08:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /rack/terminals", payload: { terminal_code: "T", legal_name: "T", state_code: "TX", county_code: "48201", city_code: "HOU" }, as: PlatformAdmin, captures: { t_id: $.data.id } }
            - { call: "POST /rack/products", payload: { product_code: "ULSD", display_name: "D", product_family: "DIESEL", is_brandable: false }, as: PlatformAdmin, captures: { p_id: $.data.id } }
            - { call: "POST /rack/customers", payload: { customer_code: "C", legal_name: "C", credit_limit_cents: 1000000000 }, as: PlatformAdmin, captures: { c_id: $.data.id } }
            - { call: "POST /rack/supply-contracts", payload: { customer_id: "${c_id}", start_date: "2026-01-01", end_date: "2026-12-31", volume_commitment_gallons: 10000, pricing_tier: "RACK" }, as: ContractAdministrator, captures: { sc_id: $.data.id } }
            - { call: "POST /rack/supply-contracts/${sc_id}/activate", payload: {}, as: ContractAdministrator }
            - { call: "POST /rack/lifting-rights", payload: { customer_id: "${c_id}", terminal_id: "${t_id}", product_id: "${p_id}", contract_id: "${sc_id}", daily_ratable_gallons: 100000 }, as: AllocationManager, captures: { lr: $.data.id } }
            - { call: "POST /rack/lifting-rights/${lr}/suspend", payload: {}, as: AllocationManager }
            - { call: "POST /rack/customers/${c_id}/place-hold", payload: { reason: "MANUAL" }, as: CreditAnalyst }
          trigger:
            - { call: "POST /rack/lifting-rights/${lr}/reinstate", payload: {}, as: AllocationManager, captures: { err: $.data.error_id } }
          assert:
            - "response error_id == ERR_CUSTOMER_ON_CREDIT_HOLD"
            - "LiftingRight.${lr}.status remains SUSPENDED"

      - name: ticket_post_bol_gated_on_terminal_rack_status
        grounds:
          - state_machines.LiftingTicket.RESERVED_to_BOL_ISSUED
          - entities.Terminal.fields.rack_status
        distinguishing_aspect: |
          Pair (LiftingTicket, Terminal): LiftingTicket.RESERVED→BOL_ISSUED is
          gated on Terminal.rack_status != FROZEN. Freezing the terminal after
          reservation blocks the post-bol with ERR_TERMINAL_FROZEN. Different
          entity pair than the (LiftingRight, Customer) dependency.
        test_recipe:
          setup:
            - "Terminal T, product P, customer C, LR ACTIVE, ticket RESERVED"
            - "Terminal is then FROZEN before post-bol"
            - "Logical clock = 2026-08-01T08:00:00Z"
          setup_api_calls:
            - { call: "POST /rack/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T08:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /rack/terminals", payload: { terminal_code: "T", legal_name: "T", state_code: "TX", county_code: "48201", city_code: "HOU" }, as: PlatformAdmin, captures: { t_id: $.data.id, t_v: $.data.version } }
            - { call: "POST /rack/products", payload: { product_code: "ULSD", display_name: "D", product_family: "DIESEL", is_brandable: false }, as: PlatformAdmin, captures: { p_id: $.data.id } }
            - { call: "POST /rack/customers", payload: { customer_code: "C", legal_name: "C", credit_limit_cents: 1000000000 }, as: PlatformAdmin, captures: { c_id: $.data.id } }
            - { call: "POST /rack/supply-contracts", payload: { customer_id: "${c_id}", start_date: "2026-01-01", end_date: "2026-12-31", volume_commitment_gallons: 10000, pricing_tier: "RACK" }, as: ContractAdministrator, captures: { sc_id: $.data.id } }
            - { call: "POST /rack/supply-contracts/${sc_id}/activate", payload: {}, as: ContractAdministrator }
            - { call: "POST /rack/lifting-rights", payload: { customer_id: "${c_id}", terminal_id: "${t_id}", product_id: "${p_id}", contract_id: "${sc_id}", daily_ratable_gallons: 100000 }, as: AllocationManager, captures: { lr: $.data.id } }
            - { call: "POST /rack/lifting-tickets", payload: { lifting_right_id: "${lr}", requested_gallons: 1000, branded: false }, as: TerminalOperator, captures: { tk: $.data.id } }
            - { call: "POST /rack/terminals/${t_id}/freeze", payload: {}, as: TerminalOperator }
          trigger:
            - { call: "POST /rack/lifting-tickets/${tk}/post-bol", payload: {}, as: TerminalOperator, captures: { err: $.data.error_id } }
          assert:
            - "response error_id == ERR_TERMINAL_FROZEN"
            - "LiftingTicket.${tk}.status remains RESERVED"
            - "Terminal.${t_id}.inventory_gallons unchanged"

  # ==================================================================
  # Rule 8 — resource_temporal_overlap (≥2 instances, different interval semantics)
  # ==================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: price_schedule_publish_supersedes_prior_same_triple
        grounds:
          - state_machines.RackPriceSchedule.DRAFT_to_PUBLISHED
          - state_machines.RackPriceSchedule.PUBLISHED_to_SUPERSEDED
        distinguishing_aspect: |
          Interval semantics = point-in-time occupancy on (terminal, product,
          effective_date) triple: only one PUBLISHED schedule may occupy the
          triple at any moment; publishing a second schedule on the identical
          triple auto-supersedes the first (discrete slot semantics — no
          interval arithmetic, just key collision).
        test_recipe:
          setup:
            - "Terminal T, Product P; logical clock = 2026-08-01T08:00:00Z"
          setup_api_calls:
            - { call: "POST /rack/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T08:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /rack/terminals", payload: { terminal_code: "T", legal_name: "T", state_code: "TX", county_code: "48201", city_code: "HOU" }, as: PlatformAdmin, captures: { t_id: $.data.id, t_v0: $.data.version } }
            - { call: "POST /rack/products", payload: { product_code: "ULSD", display_name: "D", product_family: "DIESEL", is_brandable: false }, as: PlatformAdmin, captures: { p_id: $.data.id } }
            - { call: "POST /rack/price-schedules", payload: { terminal_id: "${t_id}", product_id: "${p_id}", effective_date: "2026-08-01", posted_rack_cents_per_gal: 280, branded_premium_cents_per_gal: 0 }, as: RackPriceAnalyst, captures: { ps1: $.data.id } }
            - { call: "POST /rack/price-schedules/${ps1}/publish", payload: { expected_terminal_version: "${t_v0}" }, as: RackPriceAnalyst }
            - { call: "GET /rack/terminals/${t_id}", payload: {}, as: PlatformAdmin, captures: { t_v1: $.data.version } }
            - { call: "POST /rack/price-schedules", payload: { terminal_id: "${t_id}", product_id: "${p_id}", effective_date: "2026-08-01", posted_rack_cents_per_gal: 285, branded_premium_cents_per_gal: 0 }, as: RackPriceAnalyst, captures: { ps2: $.data.id } }
          trigger:
            - { call: "POST /rack/price-schedules/${ps2}/publish", payload: { expected_terminal_version: "${t_v1}" }, as: RackPriceAnalyst }
          assert:
            - "RackPriceSchedule.${ps1}.status == SUPERSEDED"
            - "RackPriceSchedule.${ps2}.status == PUBLISHED"
            - "GET /rack/price-schedules?terminal_id&t_id&product_id&p_id&effective_date=2026-08-01&status=PUBLISHED returns exactly one entry"

      - name: tax_rule_window_latest_start_wins_on_overlap
        grounds:
          - calculations.tax_jurisdiction_determination
        distinguishing_aspect: |
          Interval semantics = half-open date-window overlap on the same
          (jurisdiction_level, jurisdiction_code, product_family): when two
          ACTIVE TaxJurisdictionRules' [start,end] windows both contain today,
          the one with the LATEST effective_start_date wins (latest-start-wins
          overlap resolution). Different from the discrete-triple collision on
          RackPriceSchedule: this is genuine interval overlap with a selector
          rule.
        test_recipe:
          setup:
            - "Terminal T (TX), product P DIESEL, customer C, LR ACTIVE; inventory=100000"
            - "RackPriceSchedule PUBLISHED posted=280"
            - "Two overlapping STATE/TX/DIESEL rules both ACTIVE today: rule A (start 2026-01-01, end 2026-12-31, rate 20) and rule B (start 2026-07-01, end 2026-12-31, rate 22). Today=2026-08-01 is inside both. FED rule 24 also active."
            - "Logical clock = 2026-08-01T08:00:00Z"
          setup_api_calls:
            - { call: "POST /rack/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T08:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /rack/terminals", payload: { terminal_code: "T", legal_name: "T", state_code: "TX", county_code: "48201", city_code: "HOU" }, as: PlatformAdmin, captures: { t_id: $.data.id, t_v: $.data.version } }
            - { call: "POST /rack/products", payload: { product_code: "ULSD", display_name: "D", product_family: "DIESEL", is_brandable: false }, as: PlatformAdmin, captures: { p_id: $.data.id } }
            - { call: "POST /rack/customers", payload: { customer_code: "C", legal_name: "C", credit_limit_cents: 1000000000 }, as: PlatformAdmin, captures: { c_id: $.data.id } }
            - { call: "POST /rack/supply-contracts", payload: { customer_id: "${c_id}", start_date: "2026-01-01", end_date: "2026-12-31", volume_commitment_gallons: 100000, pricing_tier: "RACK" }, as: ContractAdministrator, captures: { sc_id: $.data.id } }
            - { call: "POST /rack/supply-contracts/${sc_id}/activate", payload: {}, as: ContractAdministrator }
            - { call: "POST /rack/lifting-rights", payload: { customer_id: "${c_id}", terminal_id: "${t_id}", product_id: "${p_id}", contract_id: "${sc_id}", daily_ratable_gallons: 100000 }, as: AllocationManager, captures: { lr: $.data.id } }
            - { call: "POST /rack/tax-rules", payload: { jurisdiction_level: "FEDERAL", jurisdiction_code: "US", product_family: "DIESEL", rate_cents_per_gal: 24, effective_start_date: "2026-01-01", effective_end_date: "2026-12-31" }, as: PlatformAdmin }
            - { call: "POST /rack/tax-rules", payload: { jurisdiction_level: "STATE", jurisdiction_code: "TX", product_family: "DIESEL", rate_cents_per_gal: 20, effective_start_date: "2026-01-01", effective_end_date: "2026-12-31" }, as: PlatformAdmin, captures: { rule_a: $.data.id } }
            - { call: "POST /rack/tax-rules", payload: { jurisdiction_level: "STATE", jurisdiction_code: "TX", product_family: "DIESEL", rate_cents_per_gal: 22, effective_start_date: "2026-07-01", effective_end_date: "2026-12-31" }, as: PlatformAdmin, captures: { rule_b: $.data.id } }
            - { call: "POST /rack/terminals/${t_id}/inventory/adjust", payload: { delta_gallons: 100000, reason: "init" }, as: TerminalOperator }
            - { call: "POST /rack/price-schedules", payload: { terminal_id: "${t_id}", product_id: "${p_id}", effective_date: "2026-08-01", posted_rack_cents_per_gal: 280, branded_premium_cents_per_gal: 0 }, as: RackPriceAnalyst, captures: { ps_id: $.data.id } }
            - { call: "POST /rack/price-schedules/${ps_id}/publish", payload: { expected_terminal_version: "${t_v}" }, as: RackPriceAnalyst }
            - { call: "POST /rack/lifting-tickets", payload: { lifting_right_id: "${lr}", requested_gallons: 1000, branded: false }, as: TerminalOperator, captures: { tk: $.data.id } }
          trigger:
            - { call: "POST /rack/lifting-tickets/${tk}/post-bol", payload: {}, as: TerminalOperator, captures: { tax: $.data.tax_cents } }
          assert:
            - "LiftingTicket.${tk}.tax_cents == 46000 (1000 * (24 + 22)); the LATER-starting rule (2026-07-01) wins at the STATE level, the earlier rule (2026-01-01) is shadowed"
            - "TaxJurisdictionRule.${rule_a} still has status ACTIVE (shadowing is at selection time, not by retirement)"

  # ==================================================================
  # Rule 9 — compensating_invariant (≥2 instances, different conserved quantities)
  # ==================================================================
  - rule_id: compensating_invariant
    instances:
      - name: inventory_gallons_conserved_over_post_reverse_cycle
        grounds:
          - state_machines.LiftingTicket.RESERVED_to_BOL_ISSUED
          - state_machines.LiftingTicket.BOL_ISSUED_to_RESERVED
        distinguishing_aspect: |
          Conserved quantity = Terminal.inventory_gallons. The forward action
          (post-bol) debits N gallons; the compensating action (reverse-bol)
          credits the same N gallons. Net drift over a post+reverse pair MUST
          be exactly 0.
        test_recipe:
          setup:
            - "Terminal T, product P, customer C, LR ACTIVE; inventory=10000"
            - "RackPriceSchedule PUBLISHED posted=280; FED tax rule 24"
            - "Logical clock = 2026-08-01T08:00:00Z"
          setup_api_calls:
            - { call: "POST /rack/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T08:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /rack/terminals", payload: { terminal_code: "T", legal_name: "T", state_code: "TX", county_code: "48201", city_code: "HOU" }, as: PlatformAdmin, captures: { t_id: $.data.id, t_v: $.data.version } }
            - { call: "POST /rack/products", payload: { product_code: "ULSD", display_name: "D", product_family: "DIESEL", is_brandable: false }, as: PlatformAdmin, captures: { p_id: $.data.id } }
            - { call: "POST /rack/customers", payload: { customer_code: "C", legal_name: "C", credit_limit_cents: 1000000000 }, as: PlatformAdmin, captures: { c_id: $.data.id } }
            - { call: "POST /rack/supply-contracts", payload: { customer_id: "${c_id}", start_date: "2026-01-01", end_date: "2026-12-31", volume_commitment_gallons: 100000, pricing_tier: "RACK" }, as: ContractAdministrator, captures: { sc_id: $.data.id } }
            - { call: "POST /rack/supply-contracts/${sc_id}/activate", payload: {}, as: ContractAdministrator }
            - { call: "POST /rack/lifting-rights", payload: { customer_id: "${c_id}", terminal_id: "${t_id}", product_id: "${p_id}", contract_id: "${sc_id}", daily_ratable_gallons: 100000 }, as: AllocationManager, captures: { lr: $.data.id } }
            - { call: "POST /rack/tax-rules", payload: { jurisdiction_level: "FEDERAL", jurisdiction_code: "US", product_family: "DIESEL", rate_cents_per_gal: 24, effective_start_date: "2026-01-01", effective_end_date: "2026-12-31" }, as: PlatformAdmin }
            - { call: "POST /rack/terminals/${t_id}/inventory/adjust", payload: { delta_gallons: 10000, reason: "init" }, as: TerminalOperator }
            - { call: "POST /rack/price-schedules", payload: { terminal_id: "${t_id}", product_id: "${p_id}", effective_date: "2026-08-01", posted_rack_cents_per_gal: 280, branded_premium_cents_per_gal: 0 }, as: RackPriceAnalyst, captures: { ps_id: $.data.id } }
            - { call: "POST /rack/price-schedules/${ps_id}/publish", payload: { expected_terminal_version: "${t_v}" }, as: RackPriceAnalyst }
            - { call: "POST /rack/lifting-tickets", payload: { lifting_right_id: "${lr}", requested_gallons: 3000, branded: false }, as: TerminalOperator, captures: { tk: $.data.id } }
          trigger:
            - { call: "POST /rack/lifting-tickets/${tk}/post-bol", payload: {}, as: TerminalOperator }
            - { call: "GET /rack/terminals/${t_id}", payload: {}, as: PlatformAdmin, captures: { inv_mid: $.data.inventory_gallons } }
            - { call: "POST /rack/lifting-tickets/${tk}/reverse-bol", payload: {}, as: TerminalOperator }
            - { call: "GET /rack/terminals/${t_id}", payload: {}, as: PlatformAdmin, captures: { inv_end: $.data.inventory_gallons } }
          assert:
            - "After post-bol: inventory_gallons == 7000"
            - "After reverse-bol: inventory_gallons == 10000 (drift == 0)"

      - name: credit_exposure_conserved_over_reserve_invoice_cycle
        grounds:
          - calculations.credit_exposure_tracking
          - state_machines.LiftingTicket.BOL_ISSUED_to_INVOICED
        distinguishing_aspect: |
          Conserved quantity = Customer.open_lifting_exposure_cents (a
          DIFFERENT conserved quantity than Terminal.inventory_gallons). The
          forward action (reserve, +gross) paired with its compensating
          terminal action (invoice, −gross) leaves the exposure at exactly its
          pre-reserve value.
        test_recipe:
          setup:
            - "Customer C with credit_limit=10^9, open_exposure=0"
            - "Terminal T, product P, LR ACTIVE, schedule PUBLISHED posted=280, FED tax 24; inventory=100000"
            - "Logical clock = 2026-08-01T08:00:00Z"
          setup_api_calls:
            - { call: "POST /rack/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T08:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /rack/terminals", payload: { terminal_code: "T", legal_name: "T", state_code: "TX", county_code: "48201", city_code: "HOU" }, as: PlatformAdmin, captures: { t_id: $.data.id, t_v: $.data.version } }
