        distinguishing_aspect: "FOIA and declassification exist for restricted records: a FOIA request against a PUBLIC collection is 409 ERR_FOIA_NOT_REQUIRED and an MDR review against it is 409 ERR_COLLECTION_NOT_RESTRICTED."
        test_recipe:
          setup:
