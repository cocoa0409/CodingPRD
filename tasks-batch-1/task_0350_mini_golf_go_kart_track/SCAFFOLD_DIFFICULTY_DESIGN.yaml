              as: OpsManager
              as_user_id: "ops-1"
              captures: { plan_id: $.data.id }
            - call: "POST /tee-sessions"
              payload: { venue_id: "${venue_id}", attraction_id: "${attr_id}", start_utc: "2026-06-14T10:00:00Z", end_utc: "2026-06-14T11:00:00Z", party_slot_capacity: 10 }
              as: OpsManager
              as_user_id: "ops-1"
              captures: { tee_id: $.data.id, tee_v: $.data.version }
            - call: "POST /guests"
              payload: { full_name: "GTee", height_cm: 175 }
              as: OpsManager
              as_user_id: "ops-1"
              captures: { guest_id: $.data.id }
            - call: "POST /waivers"
              payload: { guest_id: "${guest_id}" }
              as: OpsManager
              as_user_id: "ops-1"
            - call: "POST /bookings"
              payload: { venue_id: "${venue_id}", guest_id: "${guest_id}", slot_kind: "TEE_SESSION", tee_session_id: "${tee_id}", pricing_plan_id: "${plan_id}", origin: "RESERVATION", party_size: 1 }
              as: OpsManager
              as_user_id: "ops-1"
              captures: { bk_id: $.data.id }
          trigger:
            - call: "POST /bookings/${bk_id}/confirm"
              payload: { expected_tee_session_version: "${tee_v}" }
              as: OpsManager
              as_user_id: "ops-1"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "data.error_id == ERR_INVALID_STATE"
            - "Booking.${bk_id}.status == HOLD   # unchanged"

  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: heat_half_open_adjacency_allowed_inner_overlap_rejected
        grounds:
          - calculations.slot_overlap_check
          - validations[priority=10]
          - errors[ERR_SLOT_OVERLAP]
        distinguishing_aspect: "GO_KART Heat uses half-open [start,end) semantics: a heat starting exactly at another's end (10:15 == 10:15) is ALLOWED, but an inner overlap (10:10 within [10:00,10:15)) is rejected ERR_SLOT_OVERLAP. Distinct interval semantics (adjacency-allowed) and resource (Heat) from the TeeSession buffer rule below."
        test_recipe:
          setup:
            - "GO_KART attraction with heat [10:00,10:15). Create an abutting [10:15,10:30) (allowed) and an overlapping [10:10,10:25) (rejected)."
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "Track M" }
              as: OpsManager
              as_user_id: "ops-1"
              captures: { venue_id: $.data.id }
            - call: "POST /attractions"
              payload: { venue_id: "${venue_id}", name: "Karts", kind: "GO_KART", min_height_cm: 0, lane_count: 5 }
              as: OpsManager
              as_user_id: "ops-1"
              captures: { attr_id: $.data.id }
            - call: "POST /heats"
              payload: { venue_id: "${venue_id}", attraction_id: "${attr_id}", start_utc: "2026-06-14T10:00:00Z", end_utc: "2026-06-14T10:15:00Z" }
              as: OpsManager
              as_user_id: "ops-1"
              captures: { heat1: $.data.id }
          trigger:
            - call: "POST /heats"
              payload: { venue_id: "${venue_id}", attraction_id: "${attr_id}", start_utc: "2026-06-14T10:15:00Z", end_utc: "2026-06-14T10:30:00Z" }
              as: OpsManager
              as_user_id: "ops-1"
              captures: { heat_abut: $.data.id }
            - call: "POST /heats"
              payload: { venue_id: "${venue_id}", attraction_id: "${attr_id}", start_utc: "2026-06-14T10:10:00Z", end_utc: "2026-06-14T10:25:00Z" }
              as: OpsManager
              as_user_id: "ops-1"
              captures: { err: $.data.error_id }
          assert:
            - "Heat.${heat_abut}.status == SCHEDULED   # abutting [10:15,10:30) accepted (201)"
            - "data.error_id == ERR_SLOT_OVERLAP   # inner-overlapping [10:10,10:25) rejected (409)"

      - name: tee_session_turnover_buffer_rejects_abutting
        grounds:
          - calculations.slot_overlap_check
          - validations[priority=10]
          - errors[ERR_SLOT_OVERLAP]
        distinguishing_aspect: "MINI_GOLF TeeSession uses turnover-buffer semantics (TURNOVER_GAP_MINUTES=10): a session abutting an existing one with gap 0 ([11:00,12:00] after [10:00,11:00]) is REJECTED, whereas a session with a >=10-minute gap ([11:10,12:10]) is accepted. Distinct interval semantics (buffer-required) and resource (TeeSession) from the Heat half-open rule above."
        test_recipe:
          setup:
            - "MINI_GOLF attraction with tee session [10:00,11:00]. Abutting [11:00,12:00] (gap 0) rejected; [11:10,12:10] (gap 10) accepted."
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "Track N" }
              as: OpsManager
              as_user_id: "ops-1"
              captures: { venue_id: $.data.id }
            - call: "POST /attractions"
              payload: { venue_id: "${venue_id}", name: "Putt", kind: "MINI_GOLF", min_height_cm: 0 }
              as: OpsManager
              as_user_id: "ops-1"
              captures: { attr_id: $.data.id }
            - call: "POST /tee-sessions"
              payload: { venue_id: "${venue_id}", attraction_id: "${attr_id}", start_utc: "2026-06-14T10:00:00Z", end_utc: "2026-06-14T11:00:00Z", party_slot_capacity: 10 }
              as: OpsManager
              as_user_id: "ops-1"
              captures: { tee1: $.data.id }
          trigger:
            - call: "POST /tee-sessions"
              payload: { venue_id: "${venue_id}", attraction_id: "${attr_id}", start_utc: "2026-06-14T11:00:00Z", end_utc: "2026-06-14T12:00:00Z", party_slot_capacity: 10 }
              as: OpsManager
              as_user_id: "ops-1"
              captures: { err: $.data.error_id }
            - call: "POST /tee-sessions"
              payload: { venue_id: "${venue_id}", attraction_id: "${attr_id}", start_utc: "2026-06-14T11:10:00Z", end_utc: "2026-06-14T12:10:00Z", party_slot_capacity: 10 }
              as: OpsManager
              as_user_id: "ops-1"
              captures: { tee_ok: $.data.id }
          assert:
            - "data.error_id == ERR_SLOT_OVERLAP   # gap-0 abutting [11:00,12:00] rejected (409)"
            - "TeeSession.${tee_ok}.status == SCHEDULED   # gap-10 [11:10,12:10] accepted (201)"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: lane_capacity_conserved_under_confirm_then_cancel
        grounds:
          - state_machines.Booking.HOLD_to_CONFIRMED
          - state_machines.Booking.CONFIRMED_to_CANCELLED
          - calculations.slot_capacity_rollup
          - entities.Heat.fields.lanes_committed
        distinguishing_aspect: "Conserved quantity = Heat lane capacity: the invariant lanes_committed + lanes_available == lane_capacity holds, and after a confirm (forward) paired with its cancel (compensating) lanes_committed returns to its pre-confirm value (0) with zero drift. Distinct conserved quantity from the combo-pass credits invariant below."
        test_recipe:
          setup:
            - "Heat lane_capacity=4 OPEN, no bookings (lanes_committed 0). Confirm a party-3 booking then cancel it."
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "Track O" }
              as: OpsManager
              as_user_id: "ops-1"
              captures: { venue_id: $.data.id }
            - call: "POST /venues/${venue_id}/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-14T09:00:00Z" }
              as: OpsManager
              as_user_id: "ops-1"
            - call: "POST /attractions"
              payload: { venue_id: "${venue_id}", name: "Karts", kind: "GO_KART", min_height_cm: 0, lane_count: 4 }
              as: OpsManager
              as_user_id: "ops-1"
              captures: { attr_id: $.data.id }
            - call: "POST /pricing-plans"
              payload: { venue_id: "${venue_id}", name: "Heat", mode: "PER_HEAT", base_price_cents: 1000 }
              as: OpsManager
              as_user_id: "ops-1"
              captures: { plan_id: $.data.id }
            - call: "POST /heats"
              payload: { venue_id: "${venue_id}", attraction_id: "${attr_id}", start_utc: "2026-06-14T10:00:00Z", end_utc: "2026-06-14T10:15:00Z" }
              as: OpsManager
              as_user_id: "ops-1"
              captures: { heat_id: $.data.id }
            - call: "POST /heats/${heat_id}/open"
              payload: {}
              as: OpsManager
              as_user_id: "ops-1"
              captures: { heat_v1: $.data.version }
            - call: "POST /guests"
              payload: { full_name: "G", height_cm: 180 }
              as: OpsManager
              as_user_id: "ops-1"
              captures: { g: $.data.id }
            - call: "POST /waivers"
              payload: { guest_id: "${g}" }
              as: OpsManager
              as_user_id: "ops-1"
            - call: "POST /bookings"
              payload: { venue_id: "${venue_id}", guest_id: "${g}", slot_kind: "HEAT", heat_id: "${heat_id}", pricing_plan_id: "${plan_id}", origin: "RESERVATION", party_size: 3 }
              as: OpsManager
              as_user_id: "ops-1"
              captures: { bk: $.data.id }
            - call: "POST /bookings/${bk}/confirm"
              payload: { expected_heat_version: "${heat_v1}" }
              as: OpsManager
              as_user_id: "ops-1"
              captures: { heat_v2: $.data.version }
          trigger:
            - call: "POST /bookings/${bk}/cancel"
              payload: {}
              as: OpsManager
              as_user_id: "ops-1"
          assert:
            - "Heat.${heat_id}.lanes_committed == 0   # back to pre-confirm value, zero drift"
            - "Heat.${heat_id}.lanes_available == 4   # lanes_committed + lanes_available == lane_capacity"
            - "Booking.${bk}.status == CANCELLED"

      - name: combo_credits_conserved_under_confirm_then_cancel_before_checkin
        grounds:
          - state_machines.Booking.HOLD_to_CONFIRMED
          - state_machines.Booking.CONFIRMED_to_CANCELLED
          - calculations.combo_credit_application
          - entities.ComboPass.fields.credits_remaining
        distinguishing_aspect: "Conserved quantity = ComboPass credits: confirm holds credits (credits_applied) but ComboPass.credits_redeemed only advances at check-in, so a confirm (forward) paired with a cancel BEFORE check-in (compensating) leaves credits_remaining == total_credits with zero drift. Distinct conserved quantity from the lane-capacity invariant above."
        test_recipe:
          setup:
            - "ComboPass total_credits=8, ACTIVE. Confirm a booking that would draw 4 credits, then cancel it before check-in."
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "Track P" }
              as: OpsManager
              as_user_id: "ops-1"
              captures: { venue_id: $.data.id }
            - call: "POST /venues/${venue_id}/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-14T09:00:00Z" }
              as: OpsManager
              as_user_id: "ops-1"
            - call: "POST /attractions"
              payload: { venue_id: "${venue_id}", name: "Karts", kind: "GO_KART", min_height_cm: 0, lane_count: 10 }
              as: OpsManager
              as_user_id: "ops-1"
              captures: { attr_id: $.data.id }
            - call: "POST /pricing-plans"
              payload: { venue_id: "${venue_id}", name: "Heat", mode: "PER_HEAT", base_price_cents: 1000 }
              as: OpsManager
              as_user_id: "ops-1"
              captures: { plan_id: $.data.id }
            - call: "POST /heats"
              payload: { venue_id: "${venue_id}", attraction_id: "${attr_id}", start_utc: "2026-06-14T10:00:00Z", end_utc: "2026-06-14T10:15:00Z" }
              as: OpsManager
              as_user_id: "ops-1"
              captures: { heat_id: $.data.id }
            - call: "POST /heats/${heat_id}/open"
              payload: {}
              as: OpsManager
              as_user_id: "ops-1"
              captures: { heat_v1: $.data.version }
            - call: "POST /guests"
              payload: { full_name: "G", height_cm: 180 }
              as: OpsManager
              as_user_id: "ops-1"
              captures: { g: $.data.id }
            - call: "POST /waivers"
              payload: { guest_id: "${g}" }
              as: OpsManager
              as_user_id: "ops-1"
            - call: "POST /combo-passes"
              payload: { guest_id: "${g}", total_credits: 8 }
              as: OpsManager
              as_user_id: "ops-1"
              captures: { pass_id: $.data.id }
            - call: "POST /bookings"
              payload: { venue_id: "${venue_id}", guest_id: "${g}", slot_kind: "HEAT", heat_id: "${heat_id}", pricing_plan_id: "${plan_id}", combo_pass_id: "${pass_id}", origin: "RESERVATION", party_size: 4, units: 1 }
              as: OpsManager
              as_user_id: "ops-1"
              captures: { bk: $.data.id }
            - call: "POST /bookings/${bk}/confirm"
              payload: { expected_heat_version: "${heat_v1}" }
              as: OpsManager
              as_user_id: "ops-1"
              captures: { credits_applied: $.data.credits_applied }
          trigger:
            - call: "POST /bookings/${bk}/cancel"
              payload: {}
              as: OpsManager
              as_user_id: "ops-1"
          assert:
            - "Booking.${bk}.credits_applied == 4   # min(8, effective_units 1 * party 4) at confirm"
            - "ComboPass.${pass_id}.credits_redeemed == 0   # never drawn (cancel before check-in)"
            - "ComboPass.${pass_id}.credits_remaining == 8   # zero drift"
            - "ComboPass.${pass_id}.status == ACTIVE"
