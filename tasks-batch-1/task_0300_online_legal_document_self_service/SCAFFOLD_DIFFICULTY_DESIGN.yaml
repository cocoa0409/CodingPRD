# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Online Legal Document Self-Service — EXPERT band
# Nine §0.5 rules, >= 2 instances each (>= 18 total).
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: order_provisional_quote_vs_final_invoice_diverge
        grounds:
          - calculations.provisional_pricing
          - calculations.final_pricing
          - entities.Order.fields.provisional_quote_cents
          - entities.Order.fields.final_invoice_cents
          - state_machines.DocumentProject.IN_PROGRESS_to_ASSEMBLED
          - state_machines.DocumentProject.ASSEMBLED_to_FINALIZED
        distinguishing_aspect: |
          On the Order entity domain, the provisional quote (document portion only)
          and the final invoice (document portion + APPROVED-review line + notary line)
          produce different cents for identical project data: 6882 vs 15757.
        test_recipe:
          setup:
            - "STANDARD plan (credits 3, included_clause_count 5, subscription_discount 0.15, review_discount 0.15), ACTIVE subscription"
            - "WILL/CA project, attorney_review_addon=true, 8/8 questionnaire, assembled with 7 clauses (2 over included)"
            - "Attorney review requested and APPROVED (surcharge 6375 charged); a DRAFT signature request with notary_required=true on the FINAL revision; project FINALIZED"
          setup_api_calls:
            - call: "POST /legal/subscription-plans"
              payload: { tier: "STANDARD", monthly_fee_cents: 0, included_project_credits: 3, included_clause_count: 5, subscription_discount_pct: 0.15, review_discount_pct: 0.15 }
              as: PlatformAdmin
              captures: { plan_std: $.data.id }
            - call: "POST /legal/clause-templates"
              payload: { clause_key: "W1", document_type: "WILL", state_code: "CA", is_mandatory: true, body_text: "c1" }
              as: PlatformAdmin
            - call: "POST /legal/clause-templates"
              payload: { clause_key: "W2", document_type: "WILL", state_code: "CA", is_mandatory: true, body_text: "c2" }
              as: PlatformAdmin
            - call: "POST /legal/clause-templates"
              payload: { clause_key: "W3", document_type: "WILL", state_code: "CA", is_mandatory: true, body_text: "c3" }
              as: PlatformAdmin
            - call: "POST /legal/clause-templates"
              payload: { clause_key: "W4", document_type: "WILL", state_code: "CA", is_mandatory: false, body_text: "c4" }
              as: PlatformAdmin
            - call: "POST /legal/clause-templates"
              payload: { clause_key: "W5", document_type: "WILL", state_code: "CA", is_mandatory: false, body_text: "c5" }
              as: PlatformAdmin
            - call: "POST /legal/clause-templates"
              payload: { clause_key: "W6", document_type: "WILL", state_code: "CA", is_mandatory: false, body_text: "c6" }
              as: PlatformAdmin
            - call: "POST /legal/clause-templates"
              payload: { clause_key: "W7", document_type: "WILL", state_code: "CA", is_mandatory: false, body_text: "c7" }
              as: PlatformAdmin
            - call: "POST /legal/customers"
              payload: { email: "ca1@x.com", full_name: "CA One", state_of_residence: "CA" }
              as: Customer
              captures: { cust: $.data.id }
            - call: "POST /legal/subscriptions"
              payload: { customer_id: "${cust}", plan_id: "${plan_std}" }
              as: Customer
              as_user_id: "${cust}"
              captures: { sub: $.data.id }
            - call: "POST /legal/subscriptions/${sub}/transition"
              payload: { to_status: "ACTIVE" }
              as: PlatformAdmin
            - call: "POST /legal/attorneys"
              payload: { full_name: "Atty CA", bar_state: "CA" }
              as: PlatformAdmin
              captures: { att: $.data.id }
            - call: "POST /legal/document-projects"
              payload: { customer_id: "${cust}", subscription_id: "${sub}", document_type: "WILL", state_code: "CA", title: "Will One", attorney_review_addon: true }
              as: Customer
              as_user_id: "${cust}"
              captures: { proj: $.data.id }
            - call: "PUT /legal/document-projects/${proj}/questionnaire"
              payload: { answers: { q1: "a", q2: "a", q3: "a", q4: "a", q5: "a", q6: "a", q7: "a", q8: "a" } }
              as: Customer
              as_user_id: "${cust}"
            - call: "POST /legal/document-projects/${proj}/assemble"
              payload: {}
              as: Customer
              as_user_id: "${cust}"
            - call: "POST /legal/attorney-reviews"
              payload: { document_project_id: "${proj}", attorney_id: "${att}", window_start: "2026-03-01T10:00:00.000Z", window_end: "2026-03-01T12:00:00.000Z" }
              as: Customer
              as_user_id: "${cust}"
              captures: { review: $.data.id }
            - call: "POST /legal/attorney-reviews/${review}/transition"
              payload: { to_status: "IN_REVIEW" }
              as: Attorney
              as_user_id: "${att}"
            - call: "POST /legal/attorney-reviews/${review}/transition"
              payload: { to_status: "APPROVED" }
              as: Attorney
              as_user_id: "${att}"
            - call: "GET /legal/document-projects/${proj}"
              payload: {}
              as: Customer
              as_user_id: "${cust}"
              captures: { proj_v: $.data.version }
            - call: "POST /legal/document-revisions"
              payload: { document_project_id: "${proj}", expected_document_project_version: "${proj_v}" }
              as: Customer
              as_user_id: "${cust}"
              captures: { rev: $.data.id }
            - call: "POST /legal/signature-requests"
              payload: { document_revision_id: "${rev}", signer_emails: ["s1@x.com"], notary_required: true }
              as: Customer
              as_user_id: "${cust}"
          trigger:
            - call: "POST /legal/document-projects/${proj}/transition"
              payload: { to_status: "FINALIZED" }
              as: Customer
              as_user_id: "${cust}"
            - call: "GET /legal/orders?document_project_id=${proj}"
              payload: {}
              as: Customer
              as_user_id: "${cust}"
              captures: { final: $.data.0.final_invoice_cents }
          assert:
            - "Order.provisional_quote_cents == 6882"
            - "Order.final_invoice_cents == 15757"
            - "Order.final_invoice_cents != Order.provisional_quote_cents"

      - name: project_completeness_provisional_vs_assembled_diverge
        grounds:
          - calculations.project_completeness
          - entities.DocumentProject.fields.provisional_completeness
          - entities.DocumentProject.fields.assembled_completeness
          - state_machines.DocumentProject.DRAFT_to_IN_PROGRESS
          - state_machines.DocumentProject.IN_PROGRESS_to_ASSEMBLED
        distinguishing_aspect: |
          On the DocumentProject entity domain (a different domain from the Order
          pricing variant), provisional_completeness (answered questions / total)
          and assembled_completeness (mandatory clauses present / required) measure
          completeness over different source entities: 0.75 provisional vs 1.0 assembled.
        test_recipe:
          setup:
            - "STANDARD ACTIVE subscription; WILL/CA project; clause templates: 1 mandatory exists for WILL/CA"
            - "Questionnaire answered 6 of 8 -> provisional_completeness 0.75 (cannot assemble yet)"
            - "Then answers completed to 8/8 and assembled -> assembled_completeness 1.0"
          setup_api_calls:
            - call: "POST /legal/subscription-plans"
              payload: { tier: "STANDARD", monthly_fee_cents: 0, included_project_credits: 3, included_clause_count: 5, subscription_discount_pct: 0.15, review_discount_pct: 0.15 }
              as: PlatformAdmin
              captures: { plan_std: $.data.id }
            - call: "POST /legal/clause-templates"
              payload: { clause_key: "W1", document_type: "WILL", state_code: "CA", is_mandatory: true, body_text: "c1" }
              as: PlatformAdmin
            - call: "POST /legal/customers"
              payload: { email: "ca2@x.com", full_name: "CA Two", state_of_residence: "CA" }
              as: Customer
              captures: { cust: $.data.id }
            - call: "POST /legal/subscriptions"
              payload: { customer_id: "${cust}", plan_id: "${plan_std}" }
              as: Customer
              as_user_id: "${cust}"
              captures: { sub: $.data.id }
            - call: "POST /legal/subscriptions/${sub}/transition"
              payload: { to_status: "ACTIVE" }
              as: PlatformAdmin
            - call: "POST /legal/document-projects"
              payload: { customer_id: "${cust}", subscription_id: "${sub}", document_type: "WILL", state_code: "CA", title: "Will Two" }
              as: Customer
              as_user_id: "${cust}"
              captures: { proj: $.data.id }
            - call: "PUT /legal/document-projects/${proj}/questionnaire"
              payload: { answers: { q1: "a", q2: "a", q3: "a", q4: "a", q5: "a", q6: "a" } }
              as: Customer
              as_user_id: "${cust}"
              captures: { prov6: $.data.answered_required_count }
          trigger:
            - call: "PUT /legal/document-projects/${proj}/questionnaire"
              payload: { answers: { q1: "a", q2: "a", q3: "a", q4: "a", q5: "a", q6: "a", q7: "a", q8: "a" } }
              as: Customer
              as_user_id: "${cust}"
            - call: "POST /legal/document-projects/${proj}/assemble"
              payload: {}
              as: Customer
              as_user_id: "${cust}"
              captures: { ac: $.data.assembled_completeness }
          assert:
            - "After 6/8 answers: DocumentProject.provisional_completeness == 0.75"
            - "After assemble: DocumentProject.assembled_completeness == 1.0"
            - "DocumentProject.provisional_completeness (0.75) != DocumentProject.assembled_completeness (1.0)"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: final_invoice_nonlinear_multiinput_tiered
        grounds:
          - calculations.final_pricing
          - calculations.provisional_pricing
          - entities.SubscriptionPlan.fields.subscription_discount_pct
          - entities.SubscriptionPlan.fields.included_clause_count
          - entities.SubscriptionPlan.fields.review_discount_pct
        distinguishing_aspect: |
          MODE (a): final_invoice_cents combines >=3 inputs with non-linear
          interaction — tiered subscription discount on the document portion,
          a conditionally-included review line keyed on review status, and a
          conditional notary line — giving 15757 for the pinned inputs.
        test_recipe:
          setup:
            - "Reuse the fully-finalized WILL/CA STANDARD project from order_provisional_quote_vs_final_invoice_diverge (review APPROVED + notary signature request)"
          setup_api_calls:
            - call: "POST /legal/subscription-plans"
              payload: { tier: "STANDARD", monthly_fee_cents: 0, included_project_credits: 3, included_clause_count: 5, subscription_discount_pct: 0.15, review_discount_pct: 0.15 }
              as: PlatformAdmin
