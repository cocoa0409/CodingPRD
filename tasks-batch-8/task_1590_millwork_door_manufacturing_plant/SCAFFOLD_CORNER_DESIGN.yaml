            - { call: "POST /millwork/finishing-batches", payload: { order_id: "${ord_b}", booth_id: "${booth_id}", cure_start_hour: 10, cure_end_hour: 12 }, as: ProductionLead, captures: { err_cure: $.data.error_id } }
            - { call: "POST /millwork/delivery-trips", payload: { project_id: "${proj_id}", trip_code: "T-V8", truck_capacity_leaves: 4, departure_date: "2026-10-05", site_arrival_date: "2026-10-04" }, as: PlantManager, captures: { err_trip: $.data.error_id } }
