            - { call: "POST /api/sample-cases/import", payload: { cycle_id: "${c1}", discharge_ids: "${d1b}", mode_assigned: "MAIL", postage_cost_cents: 100 }, as: DataSteward, captures: { k1b: "$.data.sample_case_ids" } }
