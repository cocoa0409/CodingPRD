scaffold_difficulty_design:

  # ===================================================================
  # Rule 1 — Dual-variant calculations across different entity domains
  # ===================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: rebate_25c_provisional_vs_final_high_agi_zeroed
        grounds:
          - calculations.rebate_25c
          - state_machines.Quote.SENT_to_ACCEPTED
          - entities.Homeowner.fields.agi_band
          - entities.Quote.fields.provisional_rebate_cents
        distinguishing_aspect: |
          On a HIGH-agi_band Homeowner the same energy-qualified openings yield
          provisional_rebate_cents == 14250 at SEND but a final confirmed 25C
          credit of 0 at ACCEPT (HIGH phase-out) — the divergence is a 25C tax-
          credit calculation on the Homeowner/Quote domain.
        test_recipe:
          setup:
            - "Homeowner with agi_band=HIGH; project (jurisdiction CENTRAL_LIGHT); one MEASURED consultation with a single CASEMENT 30x40 LOWE_DUAL opening (energy_qualified, unit_price 47500); a SENT quote."
          setup_api_calls:
            - call: "POST /homeowners"
              payload: { full_name: "H High", email: "hh@x.com", property_zip: "60601", agi_band: "HIGH" }
              as: PlatformAdmin
              captures: { ho_id: $.data.id }
            - call: "POST /projects"
              payload: { homeowner_id: "${ho_id}" }
              as: SalesConsultant
              captures: { proj_id: $.data.id }
            - call: "POST /projects/${proj_id}/consultations"
              payload: { project_id: "${proj_id}", consultant_id: "sc-1", scheduled_at: "2026-04-02T09:00:00Z" }
              as: SalesConsultant
              captures: { cons_id: $.data.id }
            - call: "POST /projects/${proj_id}/consultations/${cons_id}/openings"
              payload: { consultation_id: "${cons_id}", product_type: "CASEMENT", width_in: 30, height_in: 40, glass_package: "LOWE_DUAL" }
              as: SalesConsultant
              captures: { open_id: $.data.id }
            - call: "POST /projects/${proj_id}/consultations/${cons_id}/complete-measure"
              payload: {}
              as: SalesConsultant
            - call: "POST /projects/${proj_id}/quotes"
              payload: { project_id: "${proj_id}", consultation_id: "${cons_id}" }
              as: SalesConsultant
              captures: { quote_id: $.data.id }
            - call: "POST /projects/${proj_id}/quotes/${quote_id}/send"
              payload: {}
              as: SalesConsultant
              captures: { q_ver: $.data.version }
          trigger:
            - call: "POST /projects/${proj_id}/quotes/${quote_id}/accept"
              payload: { expected_quote_version: "${q_ver}" }
              as: Homeowner
              as_user_id: "${ho_id}"
          assert:
            - "Opening.${open_id}.unit_price_cents == 47500"
            - "Quote.${quote_id}.provisional_rebate_cents == 14250"
            - "Quote.${quote_id}.status == ACCEPTED"
            - "the final confirmed 25C credit reported on accept for this HIGH-agi homeowner == 0"

      - name: financing_monthly_payment_zero_promo_vs_interest_bearing
        grounds:
          - calculations.financing_monthly_payment
          - state_machines.FinancingApplication.SUBMITTED_to_APPROVED
          - entities.FinancingApplication.fields.monthly_payment_cents
          - entities.FinancingApplication.fields.approved_apr_bps
        distinguishing_aspect: |
          Amortization on the FinancingApplication domain diverges from the 25C
          calc's domain: a STANDARD/12-month application is a 0% promo
          (ceil division -> 83334) while the STANDARD/24-month is interest-
          bearing at 499 bps (round_half_up amortization -> 43867).
        test_recipe:
          setup:
            - "STANDARD-agi homeowner; MEASURED consultation; SENT quote with estimate_total >= 1,000,000; two SUBMITTED financing applications on it: one term_months=12, one term_months=24, each requesting 1,000,000 cents."
          setup_api_calls:
            - call: "POST /homeowners"
              payload: { full_name: "H Std", email: "hs@x.com", property_zip: "30301" }
              as: PlatformAdmin
              captures: { ho_id: $.data.id }
            - call: "POST /projects"
              payload: { homeowner_id: "${ho_id}" }
              as: SalesConsultant
              captures: { proj_id: $.data.id }
            - call: "POST /projects/${proj_id}/consultations"
              payload: { project_id: "${proj_id}", consultant_id: "sc-1", scheduled_at: "2026-04-02T09:00:00Z" }
              as: SalesConsultant
              captures: { cons_id: $.data.id }
            - call: "POST /projects/${proj_id}/consultations/${cons_id}/openings"
              payload: { consultation_id: "${cons_id}", product_type: "PICTURE", width_in: 80, height_in: 100, glass_package: "STANDARD" }
              as: SalesConsultant
            - call: "POST /projects/${proj_id}/consultations/${cons_id}/openings"
              payload: { consultation_id: "${cons_id}", product_type: "PICTURE", width_in: 80, height_in: 100, glass_package: "STANDARD" }
              as: SalesConsultant
            - call: "POST /projects/${proj_id}/consultations/${cons_id}/openings"
              payload: { consultation_id: "${cons_id}", product_type: "PICTURE", width_in: 80, height_in: 100, glass_package: "STANDARD" }
              as: SalesConsultant
            - call: "POST /projects/${proj_id}/consultations/${cons_id}/complete-measure"
              payload: {}
              as: SalesConsultant
            - call: "POST /projects/${proj_id}/quotes"
              payload: { project_id: "${proj_id}", consultation_id: "${cons_id}" }
              as: SalesConsultant
              captures: { quote_id: $.data.id }
            - call: "POST /projects/${proj_id}/quotes/${quote_id}/send"
              payload: {}
              as: SalesConsultant
            - call: "POST /projects/${proj_id}/quotes/${quote_id}/financing"
              payload: { quote_id: "${quote_id}", requested_amount_cents: 1000000, term_months: 12 }
              as: Homeowner
              as_user_id: "${ho_id}"
              captures: { fin12_id: $.data.id }
            - call: "POST /projects/${proj_id}/quotes/${quote_id}/financing"
              payload: { quote_id: "${quote_id}", requested_amount_cents: 1000000, term_months: 24 }
              as: Homeowner
              as_user_id: "${ho_id}"
              captures: { fin24_id: $.data.id }
          trigger:
            - call: "POST /projects/${proj_id}/quotes/${quote_id}/financing/${fin12_id}/decide"
              payload: { decision: "APPROVE" }
              as: OperationsCoordinator
            - call: "POST /projects/${proj_id}/quotes/${quote_id}/financing/${fin24_id}/decide"
              payload: { decision: "APPROVE" }
              as: OperationsCoordinator
          assert:
            - "FinancingApplication.${fin12_id}.approved_apr_bps == 0"
            - "FinancingApplication.${fin12_id}.monthly_payment_cents == 83334"
            - "FinancingApplication.${fin24_id}.approved_apr_bps == 499"
            - "FinancingApplication.${fin24_id}.monthly_payment_cents == 43867"

  # ===================================================================
  # Rule 2 — Combinatorial formulas across different modes
  # ===================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: quote_estimate_round_then_sum_order_pinned_mode_b
        grounds:
          - calculations.quote_estimate_total
          - calculations.opening_unit_price
          - entities.Quote.fields.estimate_total_cents
          - state_machines.Quote.DRAFT_to_SENT
        distinguishing_aspect: |
          Mode (b) nested-rounding: per-opening prices are each round_half_up'd
          ONCE in opening_unit_price, then summed (round-then-sum, not sum-then-
          round); a quote with one CASEMENT 30x40 LOWE_DUAL yields
          estimate_total_cents == 84000 (subtotal 47500, tier NONE disc 0,
          install 36500).
        test_recipe:
          setup:
            - "STANDARD homeowner; MEASURED consultation with one CASEMENT 30x40 LOWE_DUAL opening; DRAFT quote."
          setup_api_calls:
            - call: "POST /homeowners"
              payload: { full_name: "H B", email: "hb@x.com", property_zip: "30301" }
              as: PlatformAdmin
              captures: { ho_id: $.data.id }
            - call: "POST /projects"
              payload: { homeowner_id: "${ho_id}" }
              as: SalesConsultant
              captures: { proj_id: $.data.id }
            - call: "POST /projects/${proj_id}/consultations"
              payload: { project_id: "${proj_id}", consultant_id: "sc-1", scheduled_at: "2026-04-02T09:00:00Z" }
              as: SalesConsultant
              captures: { cons_id: $.data.id }
            - call: "POST /projects/${proj_id}/consultations/${cons_id}/openings"
              payload: { consultation_id: "${cons_id}", product_type: "CASEMENT", width_in: 30, height_in: 40, glass_package: "LOWE_DUAL" }
              as: SalesConsultant
            - call: "POST /projects/${proj_id}/consultations/${cons_id}/complete-measure"
              payload: {}
              as: SalesConsultant
            - call: "POST /projects/${proj_id}/quotes"
              payload: { project_id: "${proj_id}", consultation_id: "${cons_id}" }
              as: SalesConsultant
              captures: { quote_id: $.data.id }
          trigger:
            - call: "POST /projects/${proj_id}/quotes/${quote_id}/send"
              payload: {}
              as: SalesConsultant
          assert:
            - "Quote.${quote_id}.openings_subtotal_cents == 47500"
            - "Quote.${quote_id}.discount_tier == NONE"
            - "Quote.${quote_id}.estimate_total_cents == 84000"

      - name: lead_time_max_select_plus_triple_surcharge_mode_a
        grounds:
          - calculations.lead_time_days
          - state_machines.Quote.SENT_to_ACCEPTED
          - entities.ManufactureOrder.fields.lead_time_days
          - entities.Opening.fields.product_type
        distinguishing_aspect: |
          Mode (a) non-linear ≥3-input: lead_time = max(base_days over openings)
          + 14 conditional triple-glaze surcharge. A consultation mixing
          SLIDING_PATIO_DOOR (49) + ENTRY_DOOR (42) + CASEMENT (35) where at
          least one opening is LOWE_TRIPLE yields lead_time_days == 63 (49+14),
          NOT a sum of per-opening days.
        test_recipe:
          setup:
            - "STANDARD homeowner (CENTRAL_LIGHT); MEASURED consultation with SLIDING_PATIO_DOOR 72x80 LOWE_TRIPLE + ENTRY_DOOR 36x96 LOWE_TRIPLE + 10x CASEMENT 48x72 LOWE_TRIPLE; SENT quote (estimate 2,001,640)."
          setup_api_calls:
            - call: "POST /homeowners"
              payload: { full_name: "H Lead", email: "hl@x.com", property_zip: "30301" }
              as: PlatformAdmin
              captures: { ho_id: $.data.id }
            - call: "POST /projects"
              payload: { homeowner_id: "${ho_id}" }
              as: SalesConsultant
              captures: { proj_id: $.data.id }
            - call: "POST /projects/${proj_id}/consultations"
              payload: { project_id: "${proj_id}", consultant_id: "sc-1", scheduled_at: "2026-04-02T09:00:00Z" }
              as: SalesConsultant
              captures: { cons_id: $.data.id }
            - call: "POST /projects/${proj_id}/consultations/${cons_id}/openings"
              payload: { consultation_id: "${cons_id}", product_type: "SLIDING_PATIO_DOOR", width_in: 72, height_in: 80, glass_package: "LOWE_TRIPLE" }
              as: SalesConsultant
            - call: "POST /projects/${proj_id}/consultations/${cons_id}/openings"
              payload: { consultation_id: "${cons_id}", product_type: "ENTRY_DOOR", width_in: 36, height_in: 96, glass_package: "LOWE_TRIPLE" }
              as: SalesConsultant
            - call: "POST /projects/${proj_id}/consultations/${cons_id}/openings"
              payload: { consultation_id: "${cons_id}", product_type: "CASEMENT", width_in: 48, height_in: 72, glass_package: "LOWE_TRIPLE" }
              as: SalesConsultant
            - call: "POST /projects/${proj_id}/consultations/${cons_id}/complete-measure"
              payload: {}
              as: SalesConsultant
            - call: "POST /projects/${proj_id}/quotes"
              payload: { project_id: "${proj_id}", consultation_id: "${cons_id}" }
              as: SalesConsultant
              captures: { quote_id: $.data.id }
            - call: "POST /projects/${proj_id}/quotes/${quote_id}/send"
              payload: {}
              as: SalesConsultant
              captures: { q_ver: $.data.version }
          trigger:
            - call: "POST /projects/${proj_id}/quotes/${quote_id}/accept"
              payload: { expected_quote_version: "${q_ver}" }
              as: Homeowner
              as_user_id: "${ho_id}"
              captures: { mo_id: $.data.id }
          assert:
            - "the ManufactureOrder auto-created on this project has lead_time_days == 63"

  # ===================================================================
  # Rule 3 — Non-linear state-machine shape on different entities
  # ===================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: quote_reject_then_revision_draft_cycle
        grounds:
          - state_machines.Quote.SENT_to_REJECTED
          - state_machines.Quote.REJECTED_to_DRAFT
          - entities.Quote.fields.status
        distinguishing_aspect: |
          Quote exhibits a cyclic revision loop: a SENT quote rejected goes to
          REJECTED, and a new DRAFT quote can be created off it (REJECTED ->
          new DRAFT) — a cycle on the Quote entity, distinct from the
          ServiceTicket cycle below.
        test_recipe:
          setup:
            - "STANDARD homeowner; MEASURED consultation (one opening); SENT quote A."
          setup_api_calls:
            - call: "POST /homeowners"
              payload: { full_name: "H Rev", email: "hr@x.com", property_zip: "30301" }
              as: PlatformAdmin
              captures: { ho_id: $.data.id }
            - call: "POST /projects"
              payload: { homeowner_id: "${ho_id}" }
              as: SalesConsultant
              captures: { proj_id: $.data.id }
            - call: "POST /projects/${proj_id}/consultations"
              payload: { project_id: "${proj_id}", consultant_id: "sc-1", scheduled_at: "2026-04-02T09:00:00Z" }
              as: SalesConsultant
              captures: { cons_id: $.data.id }
            - call: "POST /projects/${proj_id}/consultations/${cons_id}/openings"
              payload: { consultation_id: "${cons_id}", product_type: "CASEMENT", width_in: 30, height_in: 40, glass_package: "LOWE_DUAL" }
              as: SalesConsultant
            - call: "POST /projects/${proj_id}/consultations/${cons_id}/complete-measure"
              payload: {}
              as: SalesConsultant
            - call: "POST /projects/${proj_id}/quotes"
              payload: { project_id: "${proj_id}", consultation_id: "${cons_id}" }
              as: SalesConsultant
              captures: { quote_a_id: $.data.id }
            - call: "POST /projects/${proj_id}/quotes/${quote_a_id}/send"
              payload: {}
              as: SalesConsultant
          trigger:
            - call: "POST /projects/${proj_id}/quotes/${quote_a_id}/reject"
              payload: {}
              as: Homeowner
              as_user_id: "${ho_id}"
            - call: "POST /projects/${proj_id}/quotes"
              payload: { project_id: "${proj_id}", consultation_id: "${cons_id}", supersede_quote_id: "${quote_a_id}" }
              as: SalesConsultant
              captures: { quote_b_id: $.data.id }
          assert:
            - "Quote.${quote_a_id}.status == REJECTED"
            - "Quote.${quote_b_id}.status == DRAFT"

      - name: service_ticket_resolved_reopen_redispatch_cycle
        grounds:
          - state_machines.ServiceTicket.RESOLVED_to_REOPENED
          - state_machines.ServiceTicket.REOPENED_to_DISPATCHED
          - entities.ServiceTicket.fields.status
        distinguishing_aspect: |
          ServiceTicket carries a distinct cycle from Quote: RESOLVED ->
          REOPENED -> DISPATCHED, a revision loop on the ServiceTicket entity.
        test_recipe:
          setup:
            - "A COMPLETED project (full pipeline) with a RESOLVED WARRANTY service ticket on one of its openings."
          setup_api_calls:
            - call: "POST /homeowners"
              payload: { full_name: "H Svc", email: "hsv@x.com", property_zip: "30301" }
              as: PlatformAdmin
              captures: { ho_id: $.data.id }
            - call: "POST /projects"
              payload: { homeowner_id: "${ho_id}" }
              as: SalesConsultant
              captures: { proj_id: $.data.id }
            - call: "POST /projects/${proj_id}/consultations"
              payload: { project_id: "${proj_id}", consultant_id: "sc-1", scheduled_at: "2026-04-02T09:00:00Z" }
              as: SalesConsultant
              captures: { cons_id: $.data.id }
            - call: "POST /projects/${proj_id}/consultations/${cons_id}/openings"
              payload: { consultation_id: "${cons_id}", product_type: "CASEMENT", width_in: 30, height_in: 40, glass_package: "LOWE_DUAL" }
              as: SalesConsultant
              captures: { open_id: $.data.id }
            - call: "POST /projects/${proj_id}/consultations/${cons_id}/complete-measure"
              payload: {}
              as: SalesConsultant
            - call: "POST /projects/${proj_id}/quotes"
              payload: { project_id: "${proj_id}", consultation_id: "${cons_id}" }
              as: SalesConsultant
              captures: { quote_id: $.data.id }
            - call: "POST /projects/${proj_id}/quotes/${quote_id}/send"
              payload: {}
              as: SalesConsultant
              captures: { q_ver: $.data.version }
            - call: "POST /projects/${proj_id}/quotes/${quote_id}/accept"
              payload: { expected_quote_version: "${q_ver}" }
              as: Homeowner
              as_user_id: "${ho_id}"
              captures: { mo_id: $.data.id }
            - call: "POST /projects/${proj_id}/manufacture/${mo_id}/start-build"
              payload: {}
              as: OperationsCoordinator
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-06T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /projects/${proj_id}/manufacture/${mo_id}/mark-ready"
              payload: {}
              as: OperationsCoordinator
            - call: "POST /crews"
              payload: { name: "Crew C", home_jurisdiction: "CENTRAL_LIGHT", daily_capacity_openings: 5 }
              as: OperationsCoordinator
              captures: { crew_id: $.data.id }
            - call: "POST /projects/${proj_id}/install-jobs"
              payload: { project_id: "${proj_id}", crew_id: "${crew_id}", window_start: "2026-05-10T08:00:00Z", window_end: "2026-05-10T17:00:00Z" }
              as: OperationsCoordinator
              captures: { job_id: $.data.id }
            - call: "POST /projects/${proj_id}/permits"
              payload: { project_id: "${proj_id}" }
              as: OperationsCoordinator
              captures: { permit_id: $.data.id }
            - call: "POST /projects/${proj_id}/permits/${permit_id}/approve"
              payload: {}
              as: OperationsCoordinator
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-10T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /projects/${proj_id}/install-jobs/${job_id}/depart"
              payload: {}
              as: OperationsCoordinator
            - call: "POST /projects/${proj_id}/install-jobs/${job_id}/complete"
              payload: {}
              as: OperationsCoordinator
            - call: "POST /projects/${proj_id}/permits/${permit_id}/record-inspection"
              payload: { result: "PASS" }
              as: OperationsCoordinator
            - call: "POST /projects/${proj_id}/service-tickets"
              payload: { project_id: "${proj_id}", opening_id: "${open_id}", category: "WARRANTY" }
              as: Homeowner
              as_user_id: "${ho_id}"
              captures: { ticket_id: $.data.id }
            - call: "POST /projects/${proj_id}/service-tickets/${ticket_id}/dispatch"
              payload: {}
              as: ServiceTech
            - call: "POST /projects/${proj_id}/service-tickets/${ticket_id}/resolve"
              payload: {}
              as: ServiceTech
          trigger:
            - call: "POST /projects/${proj_id}/service-tickets/${ticket_id}/reopen"
              payload: {}
              as: Homeowner
              as_user_id: "${ho_id}"
            - call: "POST /projects/${proj_id}/service-tickets/${ticket_id}/dispatch"
              payload: {}
              as: ServiceTech
          assert:
            - "ServiceTicket.${ticket_id}.status == DISPATCHED"

  # ===================================================================
  # Rule 4 — Transitive cascade chains from different triggers
  # ===================================================================
  - rule_id: transitive_cascade
    instances:
      - name: quote_accept_settles_referral_credits_referrer_depth3
        grounds:
          - state_machines.Quote.SENT_to_ACCEPTED
          - state_machines.Referral.PENDING_to_SETTLED
          - calculations.referral_reward
          - entities.Homeowner.fields.referral_credit_cents
        distinguishing_aspect: |
          Depth-3 chain: accept the referred project's quote (A) -> Project
          reaches CONTRACTED (B, caused by A) -> the PENDING Referral on it
          SETTLES and computes reward (C, caused by B) -> the referrer
          Homeowner.referral_credit_cents is recomputed (D, caused by C). Each
          hop is caused by the prior, originating from the quote-accept trigger.
        test_recipe:
          setup:
            - "Referrer homeowner R with a COMPLETED project P_ref; referred homeowner N with a new project P_new (MEASURED consultation, single CASEMENT 30x40 LOWE_DUAL, SENT quote estimate 84000); a PENDING Referral from P_ref to P_new."
          setup_api_calls:
            - call: "POST /homeowners"
              payload: { full_name: "R Referrer", email: "rr@x.com", property_zip: "30301" }
              as: PlatformAdmin
              captures: { r_id: $.data.id }
            - call: "POST /projects"
              payload: { homeowner_id: "${r_id}" }
              as: SalesConsultant
              captures: { pref_id: $.data.id }
            - call: "POST /projects/${pref_id}/consultations"
              payload: { project_id: "${pref_id}", consultant_id: "sc-1", scheduled_at: "2026-04-02T09:00:00Z" }
              as: SalesConsultant
              captures: { cref_id: $.data.id }
            - call: "POST /projects/${pref_id}/consultations/${cref_id}/openings"
              payload: { consultation_id: "${cref_id}", product_type: "CASEMENT", width_in: 30, height_in: 40, glass_package: "LOWE_DUAL" }
              as: SalesConsultant
            - call: "POST /projects/${pref_id}/consultations/${cref_id}/complete-measure"
              payload: {}
              as: SalesConsultant
            - call: "POST /projects/${pref_id}/quotes"
              payload: { project_id: "${pref_id}", consultation_id: "${cref_id}" }
              as: SalesConsultant
              captures: { qref_id: $.data.id }
            - call: "POST /projects/${pref_id}/quotes/${qref_id}/send"
              payload: {}
              as: SalesConsultant
              captures: { qref_ver: $.data.version }
            - call: "POST /projects/${pref_id}/quotes/${qref_id}/accept"
              payload: { expected_quote_version: "${qref_ver}" }
              as: Homeowner
              as_user_id: "${r_id}"
              captures: { mo_ref_id: $.data.id }
            - call: "POST /projects/${pref_id}/manufacture/${mo_ref_id}/start-build"
              payload: {}
              as: OperationsCoordinator
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-06T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /projects/${pref_id}/manufacture/${mo_ref_id}/mark-ready"
              payload: {}
              as: OperationsCoordinator
            - call: "POST /crews"
              payload: { name: "Crew C", home_jurisdiction: "CENTRAL_LIGHT", daily_capacity_openings: 5 }
              as: OperationsCoordinator
              captures: { crew_id: $.data.id }
            - call: "POST /projects/${pref_id}/install-jobs"
              payload: { project_id: "${pref_id}", crew_id: "${crew_id}", window_start: "2026-05-10T08:00:00Z", window_end: "2026-05-10T17:00:00Z" }
              as: OperationsCoordinator
              captures: { job_ref_id: $.data.id }
            - call: "POST /projects/${pref_id}/permits"
              payload: { project_id: "${pref_id}" }
              as: OperationsCoordinator
              captures: { permit_ref_id: $.data.id }
            - call: "POST /projects/${pref_id}/permits/${permit_ref_id}/approve"
              payload: {}
              as: OperationsCoordinator
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-10T09:00:00Z" }
              as: PlatformAdmin
