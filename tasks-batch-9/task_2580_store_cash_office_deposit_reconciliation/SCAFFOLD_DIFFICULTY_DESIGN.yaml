              as: StoreManager
              captures: { session_b_id: $.data.id }
            - call: "POST /cash-ops/till-sessions/${session_b_id}/drops"
              payload: { txn_type: "CLOSING_DROP", declared_amount_cents: 150000 }
              as: Cashier
