            - "advancing the clock to 2026-09-15T00:00:00Z and repeating the execute also returns 409 ERR_BLACKOUT_WINDOW_CONFLICT, because blackout_end_at is exclusive"

      - name: rescind_approval_restores_the_slot_and_the_capacity_triple_exactly
