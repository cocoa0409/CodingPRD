  - section: validations
    instances:
      - name: authorize_missing_role_header_returns_auth_error
        claim_type: Violation → Error
        grounds:
          - validations.priority_1
          - errors.ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
        distinguishing_aspect: "A POST /payment-tokens/{id}/authorizations with no X-User-Role header fails priority-1 auth with 400 ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER before any role/existence check."
        test_recipe:
          setup: ["Standard ACTIVE token."]
          setup_api_calls:
            - *c0
            - *ch
            - *iss
            - *agrA
            - *agrA_on
            - *act
            - *devs
            - *devs_sec
            - *acct
            - *art
            - *sess
            - *verA
            - *verB
            - *tokA
          trigger:
            - call: "POST /payment-tokens/${tok_id}/authorizations"
              payload: { cryptogram: "c1", amount_cents: 100, currency: "USD", merchant_id: "m-1", merchant_category: "GENERAL" }
              as: Any
              captures: { e: $.data.error_id }
          assert:
            - "response 400 and e == ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER — role-gated endpoints require the headers"

      - name: tokenize_wrong_role_is_forbidden_even_with_valid_state
        claim_type: Violation → Error
        grounds:
          - validations.priority_2
          - errors.ERR_FORBIDDEN
        distinguishing_aspect: "Priority 2 (role) precedes priority 5 (session expiry): an IssuerOperator calling tokenize gets 403 ERR_FORBIDDEN even when the session is expired — the caller never learns the expiry state."
        test_recipe:
          setup: ["Standard verified session; clock advanced past expiry so the session IS expired."]
          setup_api_calls:
            - *c0
            - *ch
            - *iss
            - *agrA
            - *agrA_on
            - *act
            - *devs
            - *devs_sec
            - *acct
            - *art
            - *sess
            - *verA
            - *verB
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-03T00:00:00Z" }
              as: Any
            - call: "GET /provisioning-sessions/${sess_id}"
              payload: {}
              as: Any
              captures: { sv: $.data.version }
          trigger:
            - call: "POST /devices/${dev_id}/provisioning-sessions/${sess_id}/tokenize"
              payload: { expected_session_version: "${sv}" }
              as: IssuerOperator
              captures: { e: $.data.error_id }
          assert:
            - "response 403 and e == ERR_FORBIDDEN — authorization precedes the expiry check"
            - "e != ERR_PROVISIONING_SESSION_EXPIRED"

      - name: cardholder_cannot_act_on_another_cardholders_device
        claim_type: Violation → Error
        grounds:
          - validations.priority_2
          - roles.Cardholder.identity
          - errors.ERR_FORBIDDEN
        distinguishing_aspect: "Entity-backed identity: Cardholder B (X-User-ID = B's id) calling set-security on A's device is 403 ERR_FORBIDDEN — ownership is enforced even though the role is listed."
        test_recipe:
          setup: ["Two cardholders; device owned by A."]
          setup_api_calls:
            - *c0
            - *ch
            - call: "POST /cardholders"
              payload: { legal_name: "Bea Coy", email: "bea@example.com", phone: "+15550001002" }
              as: Any
              captures: { ch2_id: $.data.id }
            - *devs
          trigger:
            - call: "POST /devices/${dev_id}/set-security"
              payload: { passcode_enabled: true, biometric_enabled: false }
              as: Cardholder
              as_user_id: "${ch2_id}"
              captures: { e: $.data.error_id }
          assert:
            - "response 403 and e == ERR_FORBIDDEN"
            - "Device.${dev_id}.passcode_enabled still false"

      - name: disputed_amount_mismatch_rejected
        claim_type: Violation → Error
        grounds:
          - validations.priority_19
          - errors.ERR_DISPUTE_AMOUNT_MISMATCH
        distinguishing_aspect: "Dispute amount must equal the authorization amount exactly: 9999 vs 10000 is rejected ERR_DISPUTE_AMOUNT_MISMATCH."
        test_recipe:
          setup: ["Standard token; APPROVED auth of 10000."]
          setup_api_calls:
            - *c0
            - *ch
            - *iss
            - *agrA
            - *agrA_on
            - *act
