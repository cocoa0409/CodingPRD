            - "PremiumAudit.${audit_id}.net_adjustment_cents == 49800 (within 50000 threshold)"
            - "PremiumAudit.${audit_id}.status == WAIVED"
            - "Policy.${pol_id}.audited_premium_cents == 300000 (estimated, since WAIVED)"

