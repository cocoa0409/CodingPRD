            - &c_img_p4_0801
              call: "POST /imaging-studies"
              payload: { patient_id: "${pt4_id}", eye: "OD", study_datetime: "2026-08-01T00:00:00Z", central_subfield_thickness_um: 415, intraretinal_fluid: true, subretinal_fluid: false, new_hemorrhage: false, va_letter_score: 58 }
              as: RetinaSpecialist
