              as: Controller
              as_user_id: "ctl-001"
              captures: { inv_id: "$.data[0].id" }
            - call: "POST /beverage-program/variance-investigations/${inv_id}/resolve"
              payload: { resolution: "ADJUSTED", resolution_note: "Education pours recoded to the training budget." }
              as: Controller
              as_user_id: "ctl-001"
            - call: "POST /beverage-program/wine-dinner-events/${ev1_id}/confirm"
              payload: {}
              as: BeverageDirector
              as_user_id: "bd-001"
          assert:
            - "immediately after setup: WineDinnerEvent.${ev1_id}.state == PRICED, final_ticket_price_cents == 3000, projected_pour_cost_pct == 26.67, and Venue.${v1_id}.program_posture == OPEN"
            - "the slot close produces one SALE_BTG DepletionEntry (cogs 1600, revenue 5750) and one STAFF_EDUCATION entry (cogs 800, revenue 0), with no SPOILAGE entry because spoiled_pours is 0"
            - "the pour-cost run returns actual_pour_cost_pct == 41.74, theoretical_pour_cost_pct == 27.83 and sets Venue.${v1_id}.last_variance_pct == 13.91 and Venue.${v1_id}.program_posture == FROZEN"
            - "the run also created exactly one VarianceInvestigation for the venue in state OPEN with triggered_variance_pct == 13.91"
            - "the first confirm call returns HTTP 409 with error_id ERR_VENUE_PROGRAM_FROZEN"
            - "WineDinnerEvent.${ev1_id}.state is still PRICED and final_ticket_price_cents is still 3000 — the refusal mutated nothing on the event"
            - "after the ADJUSTED resolution (state RESOLVED_ADJUSTED), Venue.${v1_id}.program_posture == OPEN and Venue.${v1_id}.last_variance_pct == 0.00"
            - "the second confirm call, identical to the first, returns HTTP 200 with WineDinnerEvent.${ev1_id}.state == CONFIRMED, proving the gate reads live Venue state and not a snapshot taken at pricing time"
      - name: btg_slot_creation_requires_published_parent_list_version
        grounds:
