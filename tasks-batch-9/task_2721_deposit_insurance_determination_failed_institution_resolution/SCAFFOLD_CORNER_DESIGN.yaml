              captures: { co_sub_id: $.data.id }
            - call: "POST /readiness-submissions/${co_sub_id}/standardize"
              as: ClosingManager
            - call: "POST /institutions/${co_inst_id}/close"
              as: ClosingManager
            - call: "GET /depositor-records/${co_dep_id}"
              as: ClaimsAgent
              captures: { co_dep_ver: $.data.version }
            - call: "POST /insurance-determinations"
              payload: { depositor_record_id: "${co_dep_id}", expected_depositor_record_version: "${co_dep_ver}" }
              as: ClaimsAgent
              as_user_id: "U-AGENT-AB"
              captures: { co_det_id: $.data.id }
            - call: "POST /insurance-determinations/${co_det_id}/prepare"
              payload: { method_variant: "AGGREGATE_BY_CATEGORY" }
