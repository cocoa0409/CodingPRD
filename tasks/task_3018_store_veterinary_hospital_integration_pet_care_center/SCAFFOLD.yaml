      - "POST /stores/members/{memberId}/suspend — suspend a member"
      - "POST /stores/members/{memberId}/archive — archive a member"
      - "POST /stores/pets/{petId}/archive — archive a pet"
      - "POST /stores/{storeId}/service-bays — create a bay"
