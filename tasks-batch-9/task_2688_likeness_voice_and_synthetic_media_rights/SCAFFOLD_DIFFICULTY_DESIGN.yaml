  - rule_id: resource_temporal_overlap
    instances:
      - name: exclusive_consent_term_half_open_adjacency_permitted
        grounds:
          - validations.priority_80_ERR_EXCLUSIVITY_WINDOW_CONFLICT
          - entities.ConsentGrant.exclusivity
          - endpoints.POST_consent_grants
        distinguishing_aspect: >-
          Contested resource is the Talent's likeness within a media-type/territory pair, and the
          interval semantics are HALF-OPEN [effective_from, effective_until): a term starting exactly
          when the exclusive term ends is legal, while a term starting one day earlier is not. The
          same call also has to be allowed when the media type or the territory set is disjoint, so
          the overlap predicate is three-dimensional (time AND media AND territory).
        test_recipe:
          setup:
            - "CA law profile plus SAG_AFTRA union rows for ADVERTISING and EPISODIC"
            - "One CA/SAG talent"
            - "An ACTIVE EXCLUSIVE grant over [ADVERTISING] in US/MX running [2026-08-01, 2027-02-01)"
          setup_api_calls:
            - call: "POST /state-law-profiles"
              payload: { state_code: "CA", postmortem_rights_years: 70, postmortem_requires_registration: true, biometric_retention_max_days: 365, deletion_grace_days: 30, removal_window_days: 14, disclosure_required_advertising: true, disclosure_required_entertainment: true, min_disclosure_rank_advertising: 3, min_disclosure_rank_entertainment: 2 }
              as: RightsAdministrator
            - call: "POST /union-minimum-schedules"
              payload: { union_code: "SAG_AFTRA", media_type: "ADVERTISING", effective_from: "2026-07-01T00:00:00Z", minimum_initial_cents: 300000, minimum_per_use_cents: 150000 }
