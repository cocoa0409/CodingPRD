            - "SeatBlock.${sb_id}.seats_taken == 1"

  - rule_id: compensating_invariant
    instances:

      - name: seat_occupancy_count_conserved_across_hold_then_release
        grounds:
          - state_machines.Order.HELD_to_EXPIRED
          - entities.SeatBlock.fields.seats_taken
          - entities.TicketType.fields.held_count
          - calculations.ticket_type_availability
        distinguishing_aspect: |
          Conserved quantity #1 is a SEAT OCCUPANCY COUNT: SeatBlock.seats_taken ==
          count(Attendee on this block with status IN {ISSUED, CHECKED_IN, TRANSFERRED}) +
          count(seats held by live HELD orders). Holding seats 3 and 4 then releasing the order
          must return seats_taken to its pre-hold value of 0 with zero drift.
        test_recipe:
          setup:
            - "ONSALE Event E has RESERVED TicketType T (quantity_total 10) with SeatBlock SB row A seats 1..10 and seats_taken == 0."
            - "Buyer B has an unpaid Order holding seats 3 and 4, so SeatBlock.seats_taken == 2 and TicketType.held_count == 2."
            - "Logical clock at 2026-07-05T10:00:00Z, well inside the 15-minute hold."
          setup_api_calls:
            - call: "POST /api/organizers"
              payload: { display_name: "Conserve Concerts", contact_email: "ops@conserve.example" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { org_id: $.data.id }
            - call: "POST /api/venues"
              payload: { name: "Conserve Hall", city: "Madison", seated_capacity: 300 }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { venue_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-05T10:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-1"
            - call: "POST /api/events"
              payload: { organizer_id: "${org_id}", venue_id: "${venue_id}", title: "Conserve Night", starts_at: "2026-08-30T18:00:00Z", ends_at: "2026-08-30T22:00:00Z", fee_mode: "PASS_ON", refund_policy: "FEE_RETAINED" }
              as: Organizer
              as_user_id: "${org_id}"
              captures: { ev_id: $.data.id }
            - call: "POST /api/ticket-types"
              payload: { event_id: "${ev_id}", name: "Orchestra", tier_rank: 2, price_cents: 5000, quantity_total: 10, seating_mode: "RESERVED" }
              as: Organizer
              as_user_id: "${org_id}"
              captures: { tt_id: $.data.id }
            - call: "POST /api/seat-blocks"
              payload: { ticket_type_id: "${tt_id}", row_label: "A", seat_from: 1, seat_to: 10 }
              as: Organizer
              as_user_id: "${org_id}"
              captures: { sb_id: $.data.id }
            - call: "POST /api/events/${ev_id}/publish"
              payload: {}
              as: Organizer
              as_user_id: "${org_id}"
              captures: { ev_v1: $.data.version }
            - call: "POST /api/buyers"
              payload: { email: "tom@example.com", display_name: "Tom" }
              as: Anonymous
              captures: { buyer_id: $.data.id }
            - call: "POST /api/orders"
              payload: { event_id: "${ev_id}", buyer_id: "${buyer_id}", items: [{ ticket_type_id: "${tt_id}", seat_block_id: "${sb_id}", quantity: 2, seat_numbers: [3, 4] }], expected_event_version: "${ev_v1}" }
              as: Buyer
              as_user_id: "${buyer_id}"
              captures: { order_id: $.data.id }
          trigger:
            - call: "POST /api/orders/${order_id}/release"
              payload: {}
              as: Buyer
              as_user_id: "${buyer_id}"
          assert:
            - "Order.${order_id}.fulfillment_status == EXPIRED"
            - "SeatBlock.${sb_id}.seats_taken == 0"
            - "TicketType.${tt_id}.held_count == 0"
            - "TicketType.${tt_id}.sold_count == 0"
            - "GET /api/attendees?order_id=${order_id} returns total_count == 0"

      - name: organizer_net_receivable_conserved_across_pay_then_full_refund
        grounds:
          - entities.Organizer.fields.lifetime_gross_cents
          - entities.Organizer.fields.lifetime_refunds_cents
          - state_machines.Order.PENDING_to_PAID
          - state_machines.RefundRequest.APPROVED_to_SETTLED
          - calculations.refund_amount
        distinguishing_aspect: |
          Conserved quantity #2 is MONEY, not seats: the named invariant
          (Organizer.lifetime_gross_cents - Organizer.lifetime_refunds_cents) equals 0 before
          the payment and must equal 0 again after the full FEE_RETAINED refund settles,
          because organizer_charged_cents 10000 exactly cancels organizer_gross_cents 10000.
        test_recipe:
          setup:
            - "Organizer O starts with lifetime_gross_cents 0 and lifetime_refunds_cents 0, so the invariant quantity is 0."
            - "ONSALE Event E (fee_mode PASS_ON, refund_policy FEE_RETAINED) has TicketType T price 5000 quantity_total 10 GA."
            - "Buyer B paid one Order of 2 tickets: subtotal 10000, fee_total 728, buyer_total 10728, organizer_gross 10000; lifetime_gross_cents is now 10000."
            - "A FEE_RETAINED RefundRequest covering both tickets is APPROVED with refund_amount_cents 10000 and organizer_charged_cents 10000."
            - "Logical clock at 2026-07-05T10:00:00Z, before Event.starts_at and inside the 30-day refund window."
          setup_api_calls:
            - call: "POST /api/organizers"
              payload: { display_name: "Ledger Live", contact_email: "ops@ledgerlive.example" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { org_id: $.data.id }
            - call: "POST /api/venues"
              payload: { name: "Ledger Hall", city: "Charlotte", seated_capacity: 200 }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { venue_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-05T10:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-1"
            - call: "POST /api/events"
              payload: { organizer_id: "${org_id}", venue_id: "${venue_id}", title: "Ledger Night", starts_at: "2026-09-05T18:00:00Z", ends_at: "2026-09-05T22:00:00Z", fee_mode: "PASS_ON", refund_policy: "FEE_RETAINED" }
              as: Organizer
              as_user_id: "${org_id}"
              captures: { ev_id: $.data.id }
            - call: "POST /api/ticket-types"
              payload: { event_id: "${ev_id}", name: "General", tier_rank: 1, price_cents: 5000, quantity_total: 10, seating_mode: "GA" }
              as: Organizer
              as_user_id: "${org_id}"
              captures: { tt_id: $.data.id }
            - call: "POST /api/events/${ev_id}/publish"
              payload: {}
              as: Organizer
              as_user_id: "${org_id}"
              captures: { ev_v1: $.data.version }
            - call: "POST /api/buyers"
              payload: { email: "uma@example.com", display_name: "Uma" }
              as: Anonymous
              captures: { buyer_id: $.data.id }
            - call: "POST /api/orders"
              payload: { event_id: "${ev_id}", buyer_id: "${buyer_id}", items: [{ ticket_type_id: "${tt_id}", quantity: 2 }], expected_event_version: "${ev_v1}" }
              as: Buyer
              as_user_id: "${buyer_id}"
              captures: { order_id: $.data.id }
            - call: "POST /api/orders/${order_id}/pay"
              payload: {}
              as: Buyer
              as_user_id: "${buyer_id}"
            - call: "GET /api/order-items"
              payload: { order_id: "${order_id}" }
              as: Buyer
              as_user_id: "${buyer_id}"
              captures: { item_id: "$.data[0].id" }
            - call: "POST /api/refund-requests"
              payload: { order_id: "${order_id}", item_refunds: [{ order_item_id: "${item_id}", quantity: 2 }], reason: "trip cancelled", policy: "FEE_RETAINED" }
              as: Buyer
              as_user_id: "${buyer_id}"
              captures: { rr_id: $.data.id }
            - call: "POST /api/refund-requests/${rr_id}/approve"
              payload: {}
              as: Organizer
              as_user_id: "${org_id}"
          trigger:
            - call: "POST /api/refund-requests/${rr_id}/settle"
              payload: {}
              as: FinanceOfficer
              as_user_id: "fin-1"
          assert:
            - "Organizer.${org_id}.lifetime_gross_cents == 10000"
            - "Organizer.${org_id}.lifetime_refunds_cents == 10000"
            - "Organizer.${org_id}.lifetime_gross_cents - Organizer.${org_id}.lifetime_refunds_cents == 0"
            - "RefundRequest.${rr_id}.refund_amount_cents == 10000"
            - "RefundRequest.${rr_id}.platform_retained_cents == 728"
            - "Order.${order_id}.refunded_cents == 10000"
            - "Order.${order_id}.payment_status == PARTIALLY_REFUNDED"
            - "TicketType.${tt_id}.sold_count == 0"
