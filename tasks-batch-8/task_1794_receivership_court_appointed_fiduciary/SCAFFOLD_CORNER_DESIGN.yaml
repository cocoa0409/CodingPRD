          setup_api_calls: []
          trigger:
            - call: "POST /v1/cases"
              payload: { case_number: "2026-CV-3020", court_jurisdiction: "S.D.N.Y.", debtor_name: "Acme Widgets LLC", appointed_receiver_name: "R. Receiver", appointment_effective_at: "2026-08-01T00:00:00Z", authority_limit_cents: 500000, business_operation_authorized: true, bar_date: "2026-09-01T00:00:00Z", reporting_interval_days: 30, operating_reserve_cents: 100000 }
              as: Nobody
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_UNAUTHENTICATED"

      - name: forbidden_beats_not_found_for_creditor_engagement_read
        claim_type: priority_ordering
        grounds: ["validations[priority=2]", "validations[priority=4]"]
        distinguishing_aspect: "Priority ordering: a Creditor reading an engagement id that does not even exist gets ERR_FORBIDDEN (priority 2), not ERR_NOT_FOUND (priority 4) — authorization precedes existence."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - call: "GET /v1/engagements/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              as: Creditor
