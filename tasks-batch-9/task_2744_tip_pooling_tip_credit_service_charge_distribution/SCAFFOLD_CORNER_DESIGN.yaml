            - "GET /pay-lines/${line_id} before the triggers reports status == FINAL, version == 2, straight_cash_cents == 1704, minimum_wage_obligation_cents == 5800, tips_available_cents == 15000, tip_credit_cents == 4096, topup_cents == 0, total_gross_cents == 1704"
