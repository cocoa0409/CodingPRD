scaffold_difficulty_design:
  # ===========================================================================
  # Rule 1: dual_variant_calc (>=2 instances, different entity domains)
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: quote_total_provisional_vs_issued_divergence
        grounds:
          - calculations.provisional_quote_total
          - calculations.issued_quote_total
          - state_machines.Quote.DRAFT_to_ISSUED
        distinguishing_aspect: |
          Quote entity domain: provisional (forward_looking, catalog-price-only) and
          issued (actuals-based, includes rail_cost from measured staircase geometry)
          produce different totals for identical Quote inputs. Provisional = 501000
          for a PURCHASE quote; issued = 636432 after CURVED multiplier on measured
          4.56m rail. The delta (135432) is entirely attributable to the rail_cost
          term that only the issued variant computes.
        test_recipe:
          setup:
            - "ProductModel SL-CURVED-200: kind=STAIRLIFT, supports_curved=true, supports_outdoor=false, min_stair_width_mm=700, base_purchase_price_cents=450000, monthly_rental_rate_cents=8500, install_labor_hours=6"
            - "Customer C1 (region=NORTH)"
            - "HomeAssessment A1 for C1: MEASURED then APPROVED with staircase_kind=CURVED, stair_rise_mm=2800, stair_run_mm=3600 (rail=4.56m), stair_width_mm=800, landing_clearance_mm=600, has_outdoor_exposure=false, electrical_outlet_within_2m=true"
            - "Quote Q1 for C1 against A1: model=SL-CURVED-200, mode=PURCHASE"
          setup_api_calls:
            - call: "POST /stairlift-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /stairlift-ops/product-models"
              payload: { model_code: "SL-CURVED-200", kind: "STAIRLIFT", supports_curved: true, supports_outdoor: false, min_stair_width_mm: 700, base_purchase_price_cents: 450000, monthly_rental_rate_cents: 8500, install_labor_hours: 6 }
              as: PlatformAdmin
            - call: "POST /stairlift-ops/customers"
              payload: { full_name: "Alice Anderson", date_of_birth: "1950-03-15", home_region_code: "NORTH" }
              as: SalesRep
              captures: { cust_id: $.data.id , cust_v: $.data.version }
            - call: "POST /stairlift-ops/customers/${cust_id}/home-assessments"
              payload: { scheduled_date: "2026-06-05" }
              as: Assessor
              captures: { assess_id: $.data.id }
            - call: "POST /stairlift-ops/home-assessments/${assess_id}/measure"
              payload: { staircase_kind: "CURVED", stair_rise_mm: 2800, stair_run_mm: 3600, stair_width_mm: 800, landing_clearance_mm: 600, has_outdoor_exposure: false, electrical_outlet_within_2m: true }
              as: Assessor
            - call: "POST /stairlift-ops/home-assessments/${assess_id}/approve"
              payload: { model_code: "SL-CURVED-200" }
              as: AssessmentReviewer
            - call: "POST /stairlift-ops/customers/${cust_id}/quotes"
              payload: { home_assessment_id: "${assess_id}", model_code: "SL-CURVED-200", acquisition_mode: "PURCHASE" }
              as: SalesRep
              captures: { quote_id: $.data.id, prov_total: $.data.provisional_total_cents }
          trigger:
            - call: "POST /stairlift-ops/quotes/${quote_id}/issue"
              payload: {}
              as: SalesRep
              captures: { issued_total: $.data.issued_total_cents }
          assert:
            - "Quote.${quote_id}.provisional_total_cents == 501000"
            - "Quote.${quote_id}.issued_total_cents == 636432"
            - "Quote.${quote_id}.status == ISSUED"
            - "Quote.${quote_id}.valid_rail_length_m == 4.56"

      - name: service_plan_fee_waiver_vs_standard_divergence
        grounds:
          - calculations.service_plan_fee
          - entities.ServicePlan.fields.monthly_fee_cents
          - entities.Agreement.fields.liability_waiver_signed
        distinguishing_aspect: |
          ServicePlan entity domain (distinct from Quote): identical tier/risk inputs
          produce different monthly_fee_cents depending on whether the parent
          Agreement has liability_waiver_signed. With tier=PREMIUM and all three
          risk adders active (outdoor + curved + REFURB_B), the standard variant
          yields 11455 while the waiver-discounted variant yields 9737 — a 1718-cent
          delta driven solely by the post-adder 0.85 multiplier, with order pinned
          (adders first, then discount, then round).
        test_recipe:
          setup:
            - "Two Customers C1 (waiver signed) and C2 (no waiver) — otherwise identical"
            - "Both reach INSTALLED Agreements against identical CURVED+outdoor assessments and REFURB_B EquipmentUnits"
            - "Both have ServicePlan tier=PREMIUM attached at the same logical time"
          setup_api_calls:
            - call: "POST /stairlift-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /stairlift-ops/product-models"
              payload: { model_code: "SL-CURVED-200", kind: "STAIRLIFT", supports_curved: true, supports_outdoor: true, min_stair_width_mm: 700, base_purchase_price_cents: 450000, monthly_rental_rate_cents: 8500, install_labor_hours: 6 }
              as: PlatformAdmin
            # === Path for C1 (waiver signed) ===
            - call: "POST /stairlift-ops/customers"
              payload: { full_name: "Waiver Wendy", date_of_birth: "1948-05-10", home_region_code: "SOUTH" }
              as: SalesRep
              captures: { c1_id: $.data.id , c1_v: $.data.version }
            - call: "POST /stairlift-ops/customers/${c1_id}/home-assessments"
              payload: { scheduled_date: "2026-06-02" }
              as: Assessor
              captures: { a1_id: $.data.id }
            - call: "POST /stairlift-ops/home-assessments/${a1_id}/measure"
              payload: { staircase_kind: "CURVED", stair_rise_mm: 2800, stair_run_mm: 3600, stair_width_mm: 800, landing_clearance_mm: 600, has_outdoor_exposure: true, electrical_outlet_within_2m: true }
              as: Assessor
            - call: "POST /stairlift-ops/home-assessments/${a1_id}/approve"
              payload: { model_code: "SL-CURVED-200" }
              as: AssessmentReviewer
            - call: "POST /stairlift-ops/customers/${c1_id}/quotes"
              payload: { home_assessment_id: "${a1_id}", model_code: "SL-CURVED-200", acquisition_mode: "PURCHASE" }
              as: SalesRep
              captures: { q1_id: $.data.id }
            - call: "POST /stairlift-ops/quotes/${q1_id}/issue"
              payload: {}
              as: SalesRep
            - call: "POST /stairlift-ops/equipment-units"
              payload: { model_code: "SL-CURVED-200", serial_number: "SN-C1-001" }
              as: InventoryManager
              captures: { u1_id: $.data.id }
            - call: "POST /stairlift-ops/quotes/${q1_id}/accept"
              payload: { equipment_unit_id: "${u1_id}", expected_customer_version: "${c1_v}", liability_waiver_signed: true }
              as: Customer
              as_user_id: "${c1_id}"
              captures: { ag1_id: $.data.id }
            - call: "POST /stairlift-ops/agreements/${ag1_id}/skip-funding"
              payload: {}
              as: FundingOfficer
            - call: "POST /stairlift-ops/agreements/${ag1_id}/install-jobs"
              payload: { technician_crew_id: "CREW-A", scheduled_start_utc: "2026-06-10T09:00:00Z", scheduled_end_utc: "2026-06-10T13:00:00Z" }
              as: InstallCoordinator
              captures: { ij1_id: $.data.id }
            - call: "POST /stairlift-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-10T09:30:00Z" }
              as: PlatformAdmin
            - call: "POST /stairlift-ops/install-jobs/${ij1_id}/start"
              payload: {}
              as: InstallCoordinator
            - call: "POST /stairlift-ops/install-jobs/${ij1_id}/complete"
              payload: { measured_labor_hours: 6, installed_rail_length_m: 4.56 }
              as: InstallCoordinator
          trigger:
            - call: "POST /stairlift-ops/agreements/${ag1_id}/service-plans"
              payload: { tier: "PREMIUM" }
              as: InstallCoordinator
              captures: { sp1_fee: $.data.monthly_fee_cents }
          assert:
            - "ServicePlan.monthly_fee_cents == 9737 (waiver variant: 7900 * 1.45 * 0.85)"
            - "ServicePlan.coverage_cap_cents == 400000"

  # ===========================================================================
  # Rule 2: combinatorial_formula (>=2 instances, different modes a/b/c)
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: funding_waterfall_priority_overflow_capping
        grounds:
          - calculations.funding_waterfall
          - state_machines.FundingApplication.PENDING_to_APPROVED
          - state_machines.Agreement.PENDING_FUNDING_to_FUNDED
        distinguishing_aspect: |
          Mode (a) — formula with >=3 inputs and non-linear interaction: waterfall
          iterates FundingApplications sorted by priority_rank ASC then created_at
          ASC, allocates min(approved, remaining), caps at list_price_cents, and
          side-effects the Agreement FUNDED transition only when the running
          allocation sum reaches list_price_cents. The interaction between priority
          order, per-app cap, and remaining-balance tracking produces non-linear
          behavior — reordering priorities changes the per-app allocation even when
          the total is identical.
        test_recipe:
          setup:
            - "Customer C with approved assessment and ISSUED Quote (PURCHASE, list=502000)"
            - "Agreement AG in PENDING_FUNDING, list_price_cents=502000"
            - "Three FundingApplications: F1 (priority=2, requested=300000, approved=300000), F2 (priority=1, requested=200000, approved=200000), F3 (priority=3, requested=200000, approved=200000)"
            - "Waterfall order: F2 (200000), F1 (300000), F3 (capped at 2000)"
          setup_api_calls:
            - call: "POST /stairlift-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /stairlift-ops/product-models"
              payload: { model_code: "SL-STRAIGHT-100", kind: "STAIRLIFT", supports_curved: false, supports_outdoor: false, min_stair_width_mm: 700, base_purchase_price_cents: 380000, monthly_rental_rate_cents: 7500, install_labor_hours: 4 }
              as: PlatformAdmin
            - call: "POST /stairlift-ops/customers"
              payload: { full_name: "Bob Brown", date_of_birth: "1955-01-01", home_region_code: "EAST" }
              as: SalesRep
              captures: { cust_id: $.data.id , cust_v: $.data.version }
            - call: "POST /stairlift-ops/customers/${cust_id}/home-assessments"
              payload: { scheduled_date: "2026-06-02" }
              as: Assessor
              captures: { assess_id: $.data.id }
            - call: "POST /stairlift-ops/home-assessments/${assess_id}/measure"
              payload: { staircase_kind: "STRAIGHT", stair_rise_mm: 2400, stair_run_mm: 3200, stair_width_mm: 800, landing_clearance_mm: 600, has_outdoor_exposure: false, electrical_outlet_within_2m: true }
              as: Assessor
            - call: "POST /stairlift-ops/home-assessments/${assess_id}/approve"
              payload: { model_code: "SL-STRAIGHT-100" }
              as: AssessmentReviewer
            - call: "POST /stairlift-ops/customers/${cust_id}/quotes"
              payload: { home_assessment_id: "${assess_id}", model_code: "SL-STRAIGHT-100", acquisition_mode: "PURCHASE" }
              as: SalesRep
              captures: { quote_id: $.data.id }
            - call: "POST /stairlift-ops/quotes/${quote_id}/issue"
              payload: {}
              as: SalesRep
            - call: "POST /stairlift-ops/equipment-units"
              payload: { model_code: "SL-STRAIGHT-100", serial_number: "SN-BB-001" }
              as: InventoryManager
              captures: { unit_id: $.data.id }
            - call: "POST /stairlift-ops/quotes/${quote_id}/accept"
              payload: { equipment_unit_id: "${unit_id}", expected_customer_version: "${cust_v}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { ag_id: $.data.id }
            - call: "POST /stairlift-ops/quotes/${quote_id}/funding-applications"
              payload: { source_kind: "STATE_GRANT", requested_cents: 300000, priority_rank: 2 }
              as: FundingOfficer
              captures: { f1_id: $.data.id }
            - call: "POST /stairlift-ops/quotes/${quote_id}/funding-applications"
              payload: { source_kind: "INSURANCE", requested_cents: 200000, priority_rank: 1 }
              as: FundingOfficer
              captures: { f2_id: $.data.id }
            - call: "POST /stairlift-ops/quotes/${quote_id}/funding-applications"
              payload: { source_kind: "CHARITY", requested_cents: 200000, priority_rank: 3 }
              as: FundingOfficer
              captures: { f3_id: $.data.id }
            - call: "POST /stairlift-ops/funding-applications/${f1_id}/decide"
              payload: { decision: "APPROVED", decision_reason: "grant ok", approved_cents: 300000 }
              as: FundingOfficer
            - call: "POST /stairlift-ops/funding-applications/${f2_id}/decide"
              payload: { decision: "APPROVED", decision_reason: "insurance ok", approved_cents: 200000 }
              as: FundingOfficer
          trigger:
            - call: "POST /stairlift-ops/funding-applications/${f3_id}/decide"
              payload: { decision: "APPROVED", decision_reason: "charity ok", approved_cents: 200000 }
              as: FundingOfficer
          assert:
            - "Agreement.${ag_id}.funding_applied_cents == 502000"
            - "Agreement.${ag_id}.status == FUNDED"
            - "FundingApplication.${f3_id}.approved_cents == 200000 (full), but only 2000 allocated (remaining after F2+F1 = 502000-500000)"

      - name: service_plan_fee_nested_rounding_order
        grounds:
          - calculations.service_plan_fee
        distinguishing_aspect: |
          Mode (b) — nested rounding where the order matters: the formula computes
          base * (1 + risk_adders_pct) then rounds to cents, then applies the 0.85
          waiver discount and rounds again. If the order were inverted (discount
          first, then adders), the result differs by 1 cent in some configurations
          and by larger amounts when the discount crosses a rounding boundary.
          Scaffold pins: adders first, then discount, single final round at the end.
        test_recipe:
          setup:
            - "Two Agreements in INSTALLED state, identical configuration"
            - "tier=STANDARD, curved (+0.20), REFURB_B (+0.10); no outdoor"
            - "Combined adders = 0.30; base=4900"
            - "Variant A (no waiver): round_half_up(4900 * 1.30) = 6370"
            - "Variant B (waiver): round_half_up(6370 * 0.85) = round_half_up(5414.5) = 5415"
          setup_api_calls:
            - call: "POST /stairlift-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /stairlift-ops/product-models"
              payload: { model_code: "SL-CURVED-200", kind: "STAIRLIFT", supports_curved: true, supports_outdoor: false, min_stair_width_mm: 700, base_purchase_price_cents: 450000, monthly_rental_rate_cents: 8500, install_labor_hours: 6 }
              as: PlatformAdmin
            - call: "POST /stairlift-ops/customers"
              payload: { full_name: "Round Rita", date_of_birth: "1952-11-20", home_region_code: "WEST" }
              as: SalesRep
              captures: { cust_id: $.data.id , cust_v: $.data.version }
            - call: "POST /stairlift-ops/customers/${cust_id}/home-assessments"
              payload: { scheduled_date: "2026-06-02" }
              as: Assessor
              captures: { assess_id: $.data.id }
            - call: "POST /stairlift-ops/home-assessments/${assess_id}/measure"
              payload: { staircase_kind: "CURVED", stair_rise_mm: 2800, stair_run_mm: 3600, stair_width_mm: 800, landing_clearance_mm: 600, has_outdoor_exposure: false, electrical_outlet_within_2m: true }
              as: Assessor
            - call: "POST /stairlift-ops/home-assessments/${assess_id}/approve"
              payload: { model_code: "SL-CURVED-200" }
              as: AssessmentReviewer
            - call: "POST /stairlift-ops/customers/${cust_id}/quotes"
              payload: { home_assessment_id: "${assess_id}", model_code: "SL-CURVED-200", acquisition_mode: "PURCHASE" }
              as: SalesRep
              captures: { quote_id: $.data.id }
            - call: "POST /stairlift-ops/quotes/${quote_id}/issue"
              payload: {}
              as: SalesRep
            - call: "POST /stairlift-ops/equipment-units"
              payload: { model_code: "SL-CURVED-200", serial_number: "SN-RR-001" }
              as: InventoryManager
              captures: { unit_id: $.data.id }
            - call: "POST /stairlift-ops/quotes/${quote_id}/accept"
              payload: { equipment_unit_id: "${unit_id}", expected_customer_version: "${cust_v}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { ag_id: $.data.id }
            - call: "POST /stairlift-ops/agreements/${ag_id}/skip-funding"
              payload: {}
              as: FundingOfficer
            - call: "POST /stairlift-ops/agreements/${ag_id}/install-jobs"
              payload: { technician_crew_id: "CREW-B", scheduled_start_utc: "2026-06-10T09:00:00Z", scheduled_end_utc: "2026-06-10T13:00:00Z" }
              as: InstallCoordinator
              captures: { ij_id: $.data.id }
            - call: "POST /stairlift-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-10T09:30:00Z" }
              as: PlatformAdmin
            - call: "POST /stairlift-ops/install-jobs/${ij_id}/start"
              payload: {}
              as: InstallCoordinator
            - call: "POST /stairlift-ops/install-jobs/${ij_id}/complete"
              payload: { measured_labor_hours: 6, installed_rail_length_m: 4.56 }
              as: InstallCoordinator
          trigger:
            - call: "POST /stairlift-ops/agreements/${ag_id}/service-plans"
              payload: { tier: "STANDARD" }
              as: InstallCoordinator
              captures: { sp_fee: $.data.monthly_fee_cents }
          assert:
            - "ServicePlan.monthly_fee_cents == 6370 (no waiver: 4900 * 1.30)"
            - "ServicePlan.coverage_cap_cents == 150000"

  # ===========================================================================
  # Rule 3: non_linear_state_machine (>=2 instances, different entities)
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: quote_revision_cycle
        grounds:
          - state_machines.Quote.ISSUED_to_DRAFT
          - state_machines.Quote.DRAFT_to_ISSUED
        distinguishing_aspect: |
          Quote entity exhibits a cyclic shape: ISSUED -> DRAFT -> ISSUED -> DRAFT
          via the revise action, with revision_number incrementing on each cycle
          and issued_total_cents cleared/recomputed per pass. This is not a linear
          pipeline — the same quote can cycle indefinitely until expiry or
          acceptance.
        test_recipe:
          setup:
            - "Quote Q in ISSUED state with revision_number=1, issued_total_cents=502000"
          setup_api_calls:
            - call: "POST /stairlift-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /stairlift-ops/product-models"
              payload: { model_code: "SL-STRAIGHT-100", kind: "STAIRLIFT", supports_curved: false, supports_outdoor: false, min_stair_width_mm: 700, base_purchase_price_cents: 380000, monthly_rental_rate_cents: 7500, install_labor_hours: 4 }
              as: PlatformAdmin
            - call: "POST /stairlift-ops/customers"
              payload: { full_name: "Cyclic Carl", date_of_birth: "1960-07-07", home_region_code: "NORTH" }
              as: SalesRep
              captures: { cust_id: $.data.id , cust_v: $.data.version }
            - call: "POST /stairlift-ops/customers/${cust_id}/home-assessments"
              payload: { scheduled_date: "2026-06-02" }
              as: Assessor
              captures: { assess_id: $.data.id }
            - call: "POST /stairlift-ops/home-assessments/${assess_id}/measure"
              payload: { staircase_kind: "STRAIGHT", stair_rise_mm: 2400, stair_run_mm: 3200, stair_width_mm: 800, landing_clearance_mm: 600, has_outdoor_exposure: false, electrical_outlet_within_2m: true }
              as: Assessor
            - call: "POST /stairlift-ops/home-assessments/${assess_id}/approve"
              payload: { model_code: "SL-STRAIGHT-100" }
              as: AssessmentReviewer
            - call: "POST /stairlift-ops/customers/${cust_id}/quotes"
              payload: { home_assessment_id: "${assess_id}", model_code: "SL-STRAIGHT-100", acquisition_mode: "PURCHASE" }
              as: SalesRep
              captures: { quote_id: $.data.id }
            - call: "POST /stairlift-ops/quotes/${quote_id}/issue"
              payload: {}
              as: SalesRep
          trigger:
            - call: "POST /stairlift-ops/quotes/${quote_id}/revise"
              payload: {}
              as: SalesRep
            - call: "POST /stairlift-ops/quotes/${quote_id}/issue"
              payload: {}
              as: SalesRep
              captures: { rev2: $.data.revision_number, total2: $.data.issued_total_cents }
          assert:
            - "Quote.${quote_id}.revision_number == 2"
            - "Quote.${quote_id}.status == ISSUED"
            - "Quote.${quote_id}.issued_total_cents == 502000 (recomputed identical)"

      - name: agreement_branching_rental_vs_purchase
        grounds:
          - state_machines.Agreement
          - state_machines.Agreement.ACTIVE_to_REMOVAL_REQUESTED
        distinguishing_aspect: |
          Agreement entity exhibits branching fork-join: from ACTIVE, the preconditions
          for REMOVAL_REQUESTED diverge by mode — RENTAL requires paid_to_date_cents
          >= list_price_cents (fiscal gate), PURCHASE requires >=30 days since
          INSTALLED (temporal gate). Two divergent branches with different
          side-effect sets converge at REMOVAL_REQUESTED.
        test_recipe:
          setup:
            - "Agreement A_rent in ACTIVE, mode=RENTAL, list_price=167000, paid_to_date=100000 (insufficient)"
            - "Agreement A_purch in ACTIVE, mode=PURCHASE, installed 10 days ago (within cooling-off)"
          setup_api_calls:
            - call: "POST /stairlift-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /stairlift-ops/product-models"
              payload: { model_code: "SL-STRAIGHT-100", kind: "STAIRLIFT", supports_curved: false, supports_outdoor: false, min_stair_width_mm: 700, base_purchase_price_cents: 380000, monthly_rental_rate_cents: 7500, install_labor_hours: 4 }
              as: PlatformAdmin
            # --- RENTAL path ---
            - call: "POST /stairlift-ops/customers"
              payload: { full_name: "Rent Rhonda", date_of_birth: "1958-04-04", home_region_code: "SOUTH" }
              as: SalesRep
              captures: { rent_cid: $.data.id , rent_cid_v: $.data.version }
            - call: "POST /stairlift-ops/customers/${rent_cid}/home-assessments"
              payload: { scheduled_date: "2026-06-02" }
              as: Assessor
              captures: { rent_aid: $.data.id }
            - call: "POST /stairlift-ops/home-assessments/${rent_aid}/measure"
              payload: { staircase_kind: "STRAIGHT", stair_rise_mm: 2400, stair_run_mm: 3200, stair_width_mm: 800, landing_clearance_mm: 600, has_outdoor_exposure: false, electrical_outlet_within_2m: true }
              as: Assessor
            - call: "POST /stairlift-ops/home-assessments/${rent_aid}/approve"
              payload: { model_code: "SL-STRAIGHT-100" }
              as: AssessmentReviewer
            - call: "POST /stairlift-ops/customers/${rent_cid}/quotes"
              payload: { home_assessment_id: "${rent_aid}", model_code: "SL-STRAIGHT-100", acquisition_mode: "RENTAL" }
              as: SalesRep
              captures: { rent_qid: $.data.id }
            - call: "POST /stairlift-ops/quotes/${rent_qid}/issue"
              payload: {}
              as: SalesRep
            - call: "POST /stairlift-ops/equipment-units"
