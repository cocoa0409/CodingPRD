    grounds:
    - calculations.surge_capacity_and_tier
    distinguishing_aspect: 'A COMMITTED-but-never-ACTIVATED site contributes nothing
      to operational_surge_capacity: with 200 staffed beds and a committed 40-bed
      site, census 170 yields YELLOW, not GREEN.'
