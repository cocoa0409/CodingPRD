scaffold_corner_design:
  # =========================================================================
  # Entities
  # =========================================================================
  - section: entities
    instances:
      - name: create_garage_returns_201_with_defaults
        claim_type: Creation
        grounds: [entities.Garage, endpoints]
        distinguishing_aspect: "POST /parking/garages with only name → 201; gate_mode defaults to PERMIT_OR_TRANSIENT, timezone to UTC; occupied_count and total_space_count are 0."
        test_recipe:
          setup:
            - "Empty DB."
          setup_api_calls: []
          trigger:
            - call: "POST /parking/garages"
              payload: { name: "Downtown" }
              as: FacilityAdmin
              captures: { g_id: $.data.id, gm: $.data.gate_mode, occ: $.data.occupied_count }
          assert:
            - "response.status == 201"
            - "Garage.${g_id}.gate_mode == PERMIT_OR_TRANSIENT"
            - "Garage.${g_id}.timezone == UTC"
            - "Garage.${g_id}.occupied_count == 0"
            - "Garage.${g_id}.total_space_count == 0"
            - "Garage.${g_id}.version == 1"

      - name: get_garage_nonexistent_returns_not_found
        claim_type: Not Found
        grounds: [entities.Garage, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /parking/garages/{random-uuid} → 404 ERR_NOT_FOUND."
        test_recipe:
          setup:
            - "Empty DB."
          setup_api_calls: []
          trigger:
            - call: "GET /parking/garages/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: FacilityAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 404"
            - "response.data.error_id == ERR_NOT_FOUND"

      - name: create_zone_missing_required_field_returns_invalid_request
        claim_type: Required Fields
        grounds: [entities.Zone, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /parking/zones omitting permit_capacity → 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup:
            - "Garage G and RatePlan RP exist."
          setup_api_calls:
            - call: "POST /parking/garages"
              payload: { name: "G" }
              as: FacilityAdmin
              captures: { g_id: $.data.id }
            - call: "POST /parking/rate-plans"
              payload: { name: "RP", hourly_cents: 500, daily_cap_cents: 4000, monthly_permit_cents: 9000 }
              as: FacilityAdmin
              captures: { rp_id: $.data.id }
          trigger:
            - call: "POST /parking/zones"
              payload: { garage_id: "${g_id}", code: "Z", zone_type: "MIXED", rate_plan_id: "${rp_id}" }
              as: FacilityAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 400"
            - "response.data.error_id == ERR_INVALID_REQUEST"

      - name: create_zone_invalid_enum_zone_type_returns_invalid_request
        claim_type: Type Constraints
        grounds: [entities.Zone.fields.zone_type, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "zone_type not in {TRANSIENT, PERMIT, MIXED} → 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup:
            - "Garage G and RatePlan RP exist."
          setup_api_calls:
            - call: "POST /parking/garages"
              payload: { name: "G" }
              as: FacilityAdmin
              captures: { g_id: $.data.id }
            - call: "POST /parking/rate-plans"
              payload: { name: "RP", hourly_cents: 500, daily_cap_cents: 4000, monthly_permit_cents: 9000 }
              as: FacilityAdmin
              captures: { rp_id: $.data.id }
          trigger:
            - call: "POST /parking/zones"
              payload: { garage_id: "${g_id}", code: "Z", zone_type: "VIP", permit_capacity: 5, rate_plan_id: "${rp_id}" }
              as: FacilityAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 400"
            - "response.data.error_id == ERR_INVALID_REQUEST"

      - name: rate_plan_grace_minutes_default_applied
        claim_type: Defaults
        grounds: [entities.RatePlan.fields.grace_minutes]
        distinguishing_aspect: "POST /parking/rate-plans omitting grace_minutes → grace_minutes defaults to 15."
        test_recipe:
          setup:
            - "Empty DB."
          setup_api_calls: []
          trigger:
            - call: "POST /parking/rate-plans"
              payload: { name: "RP", hourly_cents: 500, daily_cap_cents: 4000, monthly_permit_cents: 9000 }
              as: FacilityAdmin
              captures: { rp_id: $.data.id, grace: $.data.grace_minutes }
          assert:
            - "RatePlan.${rp_id}.grace_minutes == 15"

      - name: motorist_system_fields_generated_input_ignored
        claim_type: System Fields
        grounds: [entities.Motorist]
        distinguishing_aspect: "Server mints Motorist.id, created_at, version=1; outstanding_balance_cents defaults to 0; client-supplied id/version are ignored."
        test_recipe:
          setup:
            - "Empty DB."
          setup_api_calls: []
          trigger:
            - call: "POST /parking/motorists"
              payload: { full_name: "M", email: "sys@x.com", default_plate: "SYS111" }
              as: FacilityAdmin
              captures: { m_id: $.data.id, ver: $.data.version, bal: $.data.outstanding_balance_cents }
          assert:
            - "Motorist.${m_id}.version == 1"
            - "Motorist.${m_id}.outstanding_balance_cents == 0"

      - name: plate_read_is_immutable_no_version_field
        claim_type: Immutability
        grounds: [entities.PlateRead]
        distinguishing_aspect: "PlateRead has common_fields:false → only id+created_at; no update endpoint and no version field is exposed."
        test_recipe:
          setup:
            - "Garage G and zone Z; one plate read R created."
          setup_api_calls:
            - call: "POST /parking/garages"
              payload: { name: "G" }
              as: FacilityAdmin
              captures: { g_id: $.data.id }
            - call: "POST /parking/rate-plans"
              payload: { name: "RP", hourly_cents: 500, daily_cap_cents: 4000, monthly_permit_cents: 9000 }
              as: FacilityAdmin
              captures: { rp_id: $.data.id }
            - call: "POST /parking/zones"
              payload: { garage_id: "${g_id}", code: "Z", zone_type: "TRANSIENT", permit_capacity: 0, rate_plan_id: "${rp_id}" }
              as: FacilityAdmin
              captures: { z_id: $.data.id }
            - call: "POST /parking/plate-reads"
              payload: { garage_id: "${g_id}", plate: "IMM111", zone_id: "${z_id}", read_at_utc: "2026-06-01T08:00:00Z" }
              as: EnforcementOfficer
              captures: { r_id: $.data.id }
          trigger:
            - call: "GET /parking/plate-reads/${r_id}"
              payload: {}
              as: EnforcementOfficer
              captures: { eo: $.data.enforcement_outcome }
          assert:
            - "PlateRead.${r_id}.enforcement_outcome == VIOLATION_NO_PERMIT"

      - name: zone_garage_id_wrong_parent_returns_not_found
        claim_type: Parent Relationships
        grounds: [entities.Zone.fields.garage_id, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "POST /parking/zones with a non-existent garage_id → 404 ERR_NOT_FOUND (FK integrity)."
        test_recipe:
          setup:
            - "RatePlan RP exists; no garage with the supplied id."
          setup_api_calls:
            - call: "POST /parking/rate-plans"
              payload: { name: "RP", hourly_cents: 500, daily_cap_cents: 4000, monthly_permit_cents: 9000 }
              as: FacilityAdmin
              captures: { rp_id: $.data.id }
          trigger:
            - call: "POST /parking/zones"
              payload: { garage_id: "11111111-1111-4111-8111-111111111111", code: "Z", zone_type: "MIXED", permit_capacity: 5, rate_plan_id: "${rp_id}" }
              as: FacilityAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 404"
            - "response.data.error_id == ERR_NOT_FOUND"

      - name: garage_computed_occupied_count_after_entry
        claim_type: Computed Fields
        grounds: [entities.Garage.fields.occupied_count, entities.Space.fields.is_occupied]
        distinguishing_aspect: "After one session entry, Garage.occupied_count == 1 and the assigned Space.is_occupied == true; computed, not client-set."
        test_recipe:
          setup:
            - "Garage G; TRANSIENT zone Z with one space; clock set."
          setup_api_calls:
            - call: "POST /parking/garages"
              payload: { name: "G" }
              as: FacilityAdmin
              captures: { g_id: $.data.id }
            - call: "POST /parking/rate-plans"
              payload: { name: "RP", hourly_cents: 500, daily_cap_cents: 4000, monthly_permit_cents: 9000, grace_minutes: 15 }
              as: FacilityAdmin
              captures: { rp_id: $.data.id }
            - call: "POST /parking/zones"
              payload: { garage_id: "${g_id}", code: "Z", zone_type: "TRANSIENT", permit_capacity: 0, rate_plan_id: "${rp_id}" }
              as: FacilityAdmin
              captures: { z_id: $.data.id }
            - call: "POST /parking/spaces"
              payload: { zone_id: "${z_id}", label: "S1" }
              as: FacilityAdmin
              captures: { s1_id: $.data.id }
            - call: "POST /parking/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T10:00:00Z" }
              as: FacilityAdmin
          trigger:
            - call: "POST /parking/sessions"
              payload: { garage_id: "${g_id}", plate: "CMP111", entry_at_utc: "2026-06-01T10:00:00Z" }
              as: FacilityAdmin
              captures: { sess_id: $.data.id, sp: $.data.space_id }
          assert:
            - "Garage.${g_id}.occupied_count == 1"
            - "Space.${s1_id}.is_occupied == true"

  # =========================================================================
  # State Machines
  # =========================================================================
  - section: state_machines
    instances:
      - name: activate_already_active_permit_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.Permit.REQUESTED_to_ACTIVE, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Activating a permit already ACTIVE → 409 ERR_INVALID_STATE; no zone count change."
        test_recipe:
          setup:
            - "Garage G; MIXED zone Z capacity 5; permit P already ACTIVE."
          setup_api_calls:
            - call: "POST /parking/garages"
              payload: { name: "G" }
              as: FacilityAdmin
              captures: { g_id: $.data.id }
            - call: "POST /parking/rate-plans"
              payload: { name: "RP", hourly_cents: 500, daily_cap_cents: 4000, monthly_permit_cents: 9000 }
              as: FacilityAdmin
              captures: { rp_id: $.data.id }
            - call: "POST /parking/zones"
              payload: { garage_id: "${g_id}", code: "Z", zone_type: "MIXED", permit_capacity: 5, rate_plan_id: "${rp_id}" }
              as: FacilityAdmin
              captures: { z_id: $.data.id, z_v0: $.data.version }
            - call: "POST /parking/motorists"
              payload: { full_name: "M", email: "aa@x.com", default_plate: "AAP111" }
              as: FacilityAdmin
              captures: { m_id: $.data.id }
            - call: "POST /parking/permits"
              payload: { zone_id: "${z_id}", motorist_id: "${m_id}", plate: "AAP111" }
              as: Motorist
              as_user_id: "${m_id}"
              captures: { p_id: $.data.id }
            - call: "POST /parking/permits/${p_id}/activate"
              payload: { expected_zone_version: "${z_v0}" }
              as: FacilityAdmin
            - call: "GET /parking/zones/${z_id}"
              payload: {}
              as: FacilityAdmin
              captures: { z_v1: $.data.version }
          trigger:
            - call: "POST /parking/permits/${p_id}/activate"
              payload: { expected_zone_version: "${z_v1}" }
              as: FacilityAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"
            - "Zone.${z_id}.permits_active_count == 1"

      - name: exit_terminal_closed_session_returns_invalid_state
        claim_type: Terminal State Lockdown
        grounds: [state_machines.AccessSession.OPEN_to_CLOSED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Re-exiting a session already CLOSED → 409 ERR_INVALID_STATE; charges unchanged."
        test_recipe:
          setup:
            - "Garage G; TRANSIENT zone Z one space; a session entered 10:00 and exited 11:00 (CLOSED)."
          setup_api_calls:
            - call: "POST /parking/garages"
              payload: { name: "G" }
              as: FacilityAdmin
              captures: { g_id: $.data.id }
            - call: "POST /parking/rate-plans"
              payload: { name: "RP", hourly_cents: 500, daily_cap_cents: 4000, monthly_permit_cents: 9000, grace_minutes: 15 }
              as: FacilityAdmin
              captures: { rp_id: $.data.id }
            - call: "POST /parking/zones"
              payload: { garage_id: "${g_id}", code: "Z", zone_type: "TRANSIENT", permit_capacity: 0, rate_plan_id: "${rp_id}" }
              as: FacilityAdmin
              captures: { z_id: $.data.id }
            - call: "POST /parking/spaces"
              payload: { zone_id: "${z_id}", label: "S1" }
              as: FacilityAdmin
              captures: { s1_id: $.data.id }
            - call: "POST /parking/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T10:00:00Z" }
              as: FacilityAdmin
            - call: "POST /parking/sessions"
              payload: { garage_id: "${g_id}", plate: "TRM111", entry_at_utc: "2026-06-01T10:00:00Z" }
              as: FacilityAdmin
              captures: { sess_id: $.data.id }
            - call: "POST /parking/sessions/${sess_id}/exit"
              payload: { exit_at_utc: "2026-06-01T11:00:00Z" }
              as: FacilityAdmin
          trigger:
            - call: "POST /parking/sessions/${sess_id}/exit"
              payload: { exit_at_utc: "2026-06-01T12:00:00Z" }
              as: FacilityAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: new_permit_starts_in_requested
        claim_type: Initial State
        grounds: [state_machines.Permit, entities.Permit.fields.status]
        distinguishing_aspect: "POST /parking/permits → new Permit.status == REQUESTED."
        test_recipe:
          setup:
            - "Garage G; MIXED zone Z; Motorist M."
          setup_api_calls:
            - call: "POST /parking/garages"
              payload: { name: "G" }
              as: FacilityAdmin
              captures: { g_id: $.data.id }
            - call: "POST /parking/rate-plans"
              payload: { name: "RP", hourly_cents: 500, daily_cap_cents: 4000, monthly_permit_cents: 9000 }
              as: FacilityAdmin
              captures: { rp_id: $.data.id }
            - call: "POST /parking/zones"
              payload: { garage_id: "${g_id}", code: "Z", zone_type: "MIXED", permit_capacity: 5, rate_plan_id: "${rp_id}" }
              as: FacilityAdmin
              captures: { z_id: $.data.id }
            - call: "POST /parking/motorists"
              payload: { full_name: "M", email: "init@x.com", default_plate: "INI111" }
              as: FacilityAdmin
              captures: { m_id: $.data.id }
          trigger:
            - call: "POST /parking/permits"
              payload: { zone_id: "${z_id}", motorist_id: "${m_id}", plate: "INI111" }
              as: Motorist
              as_user_id: "${m_id}"
              captures: { p_id: $.data.id, st: $.data.status }
          assert:
            - "Permit.${p_id}.status == REQUESTED"

      - name: void_open_session_frees_space
        claim_type: Side Effect Execution
        grounds: [state_machines.AccessSession.OPEN_to_VOIDED, entities.Space.fields.is_occupied]
        distinguishing_aspect: "Voiding an OPEN session sets status VOIDED, frees the space (is_occupied false), and decrements garage occupied_count."
        test_recipe:
          setup:
            - "Garage G; TRANSIENT zone Z one space; an OPEN session occupies S1."
          setup_api_calls:
            - call: "POST /parking/garages"
              payload: { name: "G" }
              as: FacilityAdmin
              captures: { g_id: $.data.id }
            - call: "POST /parking/rate-plans"
              payload: { name: "RP", hourly_cents: 500, daily_cap_cents: 4000, monthly_permit_cents: 9000, grace_minutes: 15 }
              as: FacilityAdmin
              captures: { rp_id: $.data.id }
            - call: "POST /parking/zones"
              payload: { garage_id: "${g_id}", code: "Z", zone_type: "TRANSIENT", permit_capacity: 0, rate_plan_id: "${rp_id}" }
              as: FacilityAdmin
              captures: { z_id: $.data.id }
            - call: "POST /parking/spaces"
              payload: { zone_id: "${z_id}", label: "S1" }
              as: FacilityAdmin
              captures: { s1_id: $.data.id }
            - call: "POST /parking/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T10:00:00Z" }
              as: FacilityAdmin
            - call: "POST /parking/sessions"
              payload: { garage_id: "${g_id}", plate: "VOI111", entry_at_utc: "2026-06-01T10:00:00Z" }
              as: FacilityAdmin
              captures: { sess_id: $.data.id }
          trigger:
            - call: "POST /parking/sessions/${sess_id}/void"
              payload: {}
              as: FacilityAdmin
              captures: { st: $.data.status }
          assert:
            - "AccessSession.${sess_id}.status == VOIDED"
            - "Space.${s1_id}.is_occupied == false"
            - "Garage.${g_id}.occupied_count == 0"

      - name: cancel_waitlist_entry_from_promoted_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.PermitWaitlistEntry.WAITING_to_CANCELLED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Cancelling a waitlist entry already PROMOTED → 409 ERR_INVALID_STATE."
        test_recipe:
          setup:
            - "Garage G; MIXED zone Z capacity 1; one ACTIVE permit fills it; W1 WAITING; permit revoked promotes W1 to PROMOTED."
          setup_api_calls:
            - call: "POST /parking/garages"
              payload: { name: "G" }
              as: FacilityAdmin
              captures: { g_id: $.data.id }
            - call: "POST /parking/rate-plans"
              payload: { name: "RP", hourly_cents: 500, daily_cap_cents: 4000, monthly_permit_cents: 9000 }
              as: FacilityAdmin
              captures: { rp_id: $.data.id }
            - call: "POST /parking/zones"
              payload: { garage_id: "${g_id}", code: "Z", zone_type: "MIXED", permit_capacity: 1, rate_plan_id: "${rp_id}" }
              as: FacilityAdmin
              captures: { z_id: $.data.id, z_v: $.data.version }
            - call: "POST /parking/motorists"
              payload: { full_name: "M0", email: "wl0@x.com", default_plate: "WL0111" }
              as: FacilityAdmin
              captures: { m0_id: $.data.id }
            - call: "POST /parking/motorists"
              payload: { full_name: "M1", email: "wl1@x.com", default_plate: "WL1111" }
              as: FacilityAdmin
              captures: { m1_id: $.data.id }
            - call: "POST /parking/permits"
              payload: { zone_id: "${z_id}", motorist_id: "${m0_id}", plate: "WL0111" }
              as: Motorist
              as_user_id: "${m0_id}"
              captures: { p_id: $.data.id }
            - call: "POST /parking/permits/${p_id}/activate"
              payload: { expected_zone_version: "${z_v}" }
              as: FacilityAdmin
            - call: "POST /parking/zones/${z_id}/waitlist"
              payload: { motorist_id: "${m1_id}", plate: "WL1111" }
              as: Motorist
              as_user_id: "${m1_id}"
              captures: { w1_id: $.data.id }
            - call: "POST /parking/permits/${p_id}/revoke"
              payload: {}
              as: FacilityAdmin
          trigger:
            - call: "POST /parking/waitlist-entries/${w1_id}/cancel"
              payload: {}
              as: Motorist
              as_user_id: "${m1_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"
            - "PermitWaitlistEntry.${w1_id}.status == PROMOTED"

      - name: expire_check_before_valid_until_no_op
        claim_type: Precondition Enforcement
        grounds: [state_machines.Permit.ACTIVE_to_EXPIRED, entities.Permit.fields.valid_until_utc]
        distinguishing_aspect: "expire-check while clock now < valid_until_utc leaves the permit ACTIVE (precondition clock now >= valid_until_utc not met)."
        test_recipe:
          setup:
            - "Garage G; MIXED zone Z capacity 5; permit P activated at clock 2026-06-01 (valid until 2026-07-01). Clock still 2026-06-02."
          setup_api_calls:
            - call: "POST /parking/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: FacilityAdmin
            - call: "POST /parking/garages"
              payload: { name: "G" }
              as: FacilityAdmin
              captures: { g_id: $.data.id }
            - call: "POST /parking/rate-plans"
              payload: { name: "RP", hourly_cents: 500, daily_cap_cents: 4000, monthly_permit_cents: 9000 }
              as: FacilityAdmin
              captures: { rp_id: $.data.id }
            - call: "POST /parking/zones"
              payload: { garage_id: "${g_id}", code: "Z", zone_type: "MIXED", permit_capacity: 5, rate_plan_id: "${rp_id}" }
              as: FacilityAdmin
              captures: { z_id: $.data.id, z_v: $.data.version }
            - call: "POST /parking/motorists"
              payload: { full_name: "M", email: "exp@x.com", default_plate: "EXP111" }
              as: FacilityAdmin
              captures: { m_id: $.data.id }
            - call: "POST /parking/permits"
              payload: { zone_id: "${z_id}", motorist_id: "${m_id}", plate: "EXP111" }
              as: Motorist
              as_user_id: "${m_id}"
              captures: { p_id: $.data.id }
            - call: "POST /parking/permits/${p_id}/activate"
              payload: { expected_zone_version: "${z_v}" }
              as: FacilityAdmin
            - call: "POST /parking/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-02T00:00:00Z" }
              as: FacilityAdmin
          trigger:
            - call: "POST /parking/permits/${p_id}/expire-check"
              payload: {}
              as: FacilityAdmin
              captures: { st: $.data.status }
          assert:
            - "Permit.${p_id}.status == ACTIVE"
            - "Zone.${z_id}.permits_active_count == 1"

      - name: expire_check_after_valid_until_expires_permit
        claim_type: Valid Transition
        grounds: [state_machines.Permit.ACTIVE_to_EXPIRED, entities.Zone.fields.permits_active_count]
        distinguishing_aspect: "expire-check while clock now >= valid_until_utc transitions the permit ACTIVE→EXPIRED and decrements the zone count."
        test_recipe:
          setup:
            - "Garage G; MIXED zone Z capacity 5; permit P activated at 2026-06-01 (valid until 2026-07-01). Clock advanced to 2026-07-02."
          setup_api_calls:
            - call: "POST /parking/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: FacilityAdmin
            - call: "POST /parking/garages"
              payload: { name: "G" }
              as: FacilityAdmin
              captures: { g_id: $.data.id }
            - call: "POST /parking/rate-plans"
              payload: { name: "RP", hourly_cents: 500, daily_cap_cents: 4000, monthly_permit_cents: 9000 }
              as: FacilityAdmin
              captures: { rp_id: $.data.id }
            - call: "POST /parking/zones"
              payload: { garage_id: "${g_id}", code: "Z", zone_type: "MIXED", permit_capacity: 5, rate_plan_id: "${rp_id}" }
              as: FacilityAdmin
              captures: { z_id: $.data.id, z_v: $.data.version }
