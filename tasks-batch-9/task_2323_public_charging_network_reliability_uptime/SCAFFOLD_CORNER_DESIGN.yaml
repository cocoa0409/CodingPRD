              as: NetworkOperator
              captures: { p_id: $.data.id }
            - call: "POST /outage-events"
              payload: { port_id: "${p_id}", fault_code: "OCPP-MIN-01", fault_class: "MINOR", detected_at: "2026-08-01T00:00:00Z" }
              as: NetworkOperator
              captures: { o_id: $.data.id }
            - call: "POST /outage-events/${o_id}/classify"
              payload: { fault_class: "MINOR" }
              as: NetworkOperator
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T12:00:00Z" }
              as: NetworkOperator
            - call: "POST /customer-complaints"
              payload: { station_id: "${st_id}", port_id: "${p_id}", complaint_type: "PRICE_MISMATCH", session_started_at: "2026-08-01T10:00:00Z", session_ended_at: "2026-08-01T10:30:00Z", session_energy_kwh: 10.000, session_price_per_kwh_cents: 40, session_charged_cents: 1000 }
              as: CustomerSupportAgent
              captures: { c_id: $.data.id }
            - call: "POST /customer-complaints/${c_id}/triage"
