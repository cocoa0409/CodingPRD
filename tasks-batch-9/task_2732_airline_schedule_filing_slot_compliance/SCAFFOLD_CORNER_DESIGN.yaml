              captures: { leg_id: "$.data.id" }
          trigger:
            - call: "POST /flight-legs/${leg_id}/cancel"
              payload: { reason: "DEMAND_SHORTFALL" }
              as: NetworkPlanner
              as_user_id: "${home_carrier_id}"
            - call: "POST /flight-legs/${leg_id}/cancel"
              payload: { reason: "DEMAND_SHORTFALL" }
              as: NetworkPlanner
              as_user_id: "${home_carrier_id}"
              captures: { err: "$.data.error_id" }
          assert:
            - "trigger call 1 -> HTTP 200; FlightLeg.${leg_id}.status == \"CANCELLED\" and cancellation_reason == \"DEMAND_SHORTFALL\""
            - "trigger call 2 -> HTTP 409 with data.error_id == \"ERR_FLIGHT_LEG_STATE_INVALID\""
            - "FlightLeg.${leg_id}.version is unchanged between the two responses, proving the rejected call wrote nothing"

      - name: validate_stamps_the_validating_user_onto_the_schedule_version
        claim_type: side_effect_execution
        grounds:
          - state_machines.ScheduleVersion.DRAFT_to_VALIDATED
