          The MIN against fee_cap_usd is applied AFTER the 2dp rounding, and it BINDS
          here: 0.2500 * 1700000.00 = 425000.00 raw, clamped to the engagement's
          fee_cap_usd 400000.00. Because the clamped fee feeds the integration cost, the
          net turns negative (-1199018.73) while the true-up still uses the 5% branch
          (80000.00) precisely because the net is below 500000.00. The same clamped
          400000.00 is then crystallised onto the engagement at accept time with basis
          DIRECT_PLACEMENT.
