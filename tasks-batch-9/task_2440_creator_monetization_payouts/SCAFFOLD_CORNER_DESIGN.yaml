              payload: { display_name: "Next Creator", country_code: "GB", follower_count: 50000, watch_time_minutes_365d: 240000 }
              as: PlatformAdmin
              captures: { cr_b: "$.data.id" }
            - call: "POST /monetization/creators/${cr_a}/evaluate"
              payload: {}
              as: FinanceOperator
            - call: "POST /monetization/creators/${cr_b}/evaluate"
              payload: {}
              as: FinanceOperator
            - call: "POST /monetization/earnings-periods"
              payload: { label: "2026-08", period_start: "2026-08-01T00:00:00Z", period_end: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { per: "$.data.id" }
            - call: "POST /monetization/creator-funds"
              payload: { name: "August Boost", period_id: "${per}", total_pool_cents: 104000, methodology: "PRO_RATA_WATCH_TIME" }
              as: PlatformAdmin
              captures: { fd: "$.data.id", fd_v1: "$.data.version" }
            - call: "POST /monetization/creator-funds/${fd}/allocate"
              payload: { expected_fund_version: "${fd_v1}" }
