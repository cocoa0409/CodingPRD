      - name: reversal_action_endpoint_is_covered_by_the_cash_invariant_instance
        claim_type: action_endpoint
        grounds:
          - endpoints.POST_tdr_market-transactions_id_reverse
          - state_machines.MarketTransaction.SETTLED_to_REVERSED
        distinguishing_aspect: "The reverse action's own side-effect list: cash legs negated, title returned, a REVERSAL row appended with a negated price."
        excluded_because:
          difficulty_instance: program_cash_conserved_across_settlement_and_reversal
          rationale: "That §1.8 instance triggers the reverse endpoint and asserts every one of its side effects, including the negated REVERSAL row and the restored holder counters."
      - name: finalize_action_endpoint_is_covered_by_the_absorption_boundary_instance
        claim_type: action_endpoint
        grounds:
          - endpoints.POST_tdr_receiving-site-applications_id_finalize
          - state_machines.ReceivingSiteApplication.DESIGN_APPROVED_to_FINALIZED
        distinguishing_aspect: "Finalization confirms redemptions in allocated_at order, absorbs units into the area, and may suspend the area on the inclusive cap."
        excluded_because:
          difficulty_instance: absorption_cap_inclusive_unit_boundary_at_finalization
          rationale: "That §1.8 instance finalizes twin applications at and one unit past the cap, asserting the confirmed redemptions, the absorbed totals, the area suspension, and the refusal."

  # ===========================================================================
  # §1.9.6 Errors — every catalog id must be triggerable
  # ===========================================================================
  - section: errors
    instances:

      - name: every_unresolved_path_id_reports_its_own_not_found_code
        claim_type: violation_to_error
        grounds:
          - validations.priority_3_path_existence
          - errors.ERR_PARTY_NOT_FOUND
          - errors.ERR_SENDING_AREA_NOT_FOUND
          - errors.ERR_RECEIVING_AREA_NOT_FOUND
          - errors.ERR_APPRAISAL_SCHEDULE_NOT_FOUND
          - errors.ERR_SENDING_PARCEL_NOT_FOUND
          - errors.ERR_SEVERANCE_APPLICATION_NOT_FOUND
          - errors.ERR_CONSERVATION_EASEMENT_NOT_FOUND
          - errors.ERR_CERTIFICATE_NOT_FOUND
          - errors.ERR_CERTIFICATE_TRANSFER_NOT_FOUND
          - errors.ERR_MARKET_TRANSACTION_NOT_FOUND
          - errors.ERR_RECEIVING_SITE_APPLICATION_NOT_FOUND
          - errors.ERR_CERTIFICATE_REDEMPTION_NOT_FOUND
          - errors.ERR_MONITORING_INSPECTION_NOT_FOUND
          - errors.ERR_PROGRAM_EVALUATION_NOT_FOUND
        distinguishing_aspect: "Fourteen entity-specific 404 codes exist and priority 3 says the path id decides which one; a single generic ERR_NOT_FOUND (or a 500 on an unparseable id) fails. Every read below uses the same fabricated uuid against an empty database, so only the route can select the code."
        test_recipe:
          setup:
            - "empty database; no rows of any kind"
          setup_api_calls:
            - call: "POST /tdr/_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T00:00:00Z" }
              as: ProgramAdministrator
