            - call: "POST /trucks/${truck_id}/routes"
              payload: { route_date: "2026-02-04T00:00:00Z", window_start: "2026-02-04T09:00:00Z", window_end: "2026-02-04T12:00:00Z" }
              as: Dispatcher
