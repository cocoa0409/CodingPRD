  - section: endpoints
    instances:
      - name: client_and_space_round_trip_through_create_read_and_list
        claim_type: standard_crud
        grounds:
          - endpoints[POST /convention-center/clients]
          - endpoints[GET /convention-center/clients/{id}]
          - endpoints[GET /convention-center/clients]
          - endpoints[POST /convention-center/spaces]
          - endpoints[GET /convention-center/spaces/{id}]
        distinguishing_aspect: |
          Create then read then list on both reference entities, including a filtered
          list. The listing envelope must carry response_type array with limit, offset,
          total_count and has_more, while the single reads carry response_type object;
          the filter on organization_type must narrow three clients to one.
        test_recipe:
          setup:
            - "no clients or spaces exist yet"
          setup_api_calls:
            - call: "POST /convention-center/clients"
              payload: { legal_name: "National Widget Association", contact_email: "nwa@example.org", organization_type: "NATIONAL_ASSOCIATION" }
              as: VenueAdmin
              captures: { cl_nwa_id: $.data.id }
            - call: "POST /convention-center/clients"
              payload: { legal_name: "Riverbend Rotary", contact_email: "rotary@example.org", organization_type: "LOCAL_ORGANIZATION" }
              as: SalesManager
              captures: { cl_rr_id: $.data.id }
            - call: "POST /convention-center/clients"
              payload: { legal_name: "Sunbelt Show Promotions", contact_email: "ssp@example.org", organization_type: "PROMOTER" }
              as: SalesManager
              captures: { cl_ssp_id: $.data.id }
            - call: "POST /convention-center/spaces"
              payload: { name: "Ballroom B", space_class: "BALLROOM", rentable_sqft: 40000, daily_base_rate_cents: 1200000 }
              as: FacilitiesPlanner
              captures: { sp_bb_id: $.data.id }
          trigger:
            - call: "GET /convention-center/clients/${cl_nwa_id}"
              payload: {}
              as: SalesManager
            - call: "GET /convention-center/clients"
              payload: { organization_type: "PROMOTER", limit: 10, offset: 0 }
              as: SettlementAnalyst
            - call: "GET /convention-center/spaces/${sp_bb_id}"
              payload: {}
              as: EventServicesManager
          assert:
            - "every trigger returns 200"
            - "the first response has response_type object and data.legal_name == National Widget Association"
            - "the second response has response_type array with total_count == 1, has_more == false, and the single row is ${cl_ssp_id}"
            - "the second response does not include ${cl_nwa_id} or ${cl_rr_id}"
            - "the third response has data.daily_base_rate_cents == 1200000 and data.rigging_capable == false"
            - "every response carries meta.api_request_id and meta.api_request_timestamp"

      - name: service_order_approve_moves_both_dimensions_and_writes_the_estimate
        claim_type: action_endpoint
        grounds:
          - endpoints[POST /convention-center/service-orders/{id}/approve]
          - state_machines.ServiceOrder.approval_status
          - state_machines.ServiceOrder.billing_status
          - calculations.service_order_charge
        distinguishing_aspect: |
          One action endpoint with three coupled effects: approval_status leaves
          PENDING_APPROVAL, billing_status is dragged from UNBILLED to ESTIMATED by
          cascade rather than by its own endpoint, and the estimate is priced on the way
          through. The MIN_ORDER_CENTS floor of 15000 binds here, since 1000 sqft of
          EXCLUSIVE cleaning at the ADVANCE timing prices at only 6000.
        test_recipe:
          setup:
            - "SparkleClean Facility Services is an EXCLUSIVE CLEANING vendor with coi_expiry_date 2030-01-01"
            - "a PENDING_APPROVAL CLEANING order for 1000 sqft sits on the TENTATIVE Meeting Room 301 booking"
          setup_api_calls:
            - call: "POST /convention-center/policy-windows"
              payload: { event_class: "CONSUMER_SHOW", priority_rank: 3, open_months_before: 18, close_months_before: 2, max_holds_per_booking: 2, challenge_response_hours: 48, rental_discount_pct: 0.0, max_challenge_rounds: 1 }
              as: VenueAdmin
            - call: "POST /convention-center/spaces"
              payload: { name: "Meeting Room 301", space_class: "MEETING_ROOM", rentable_sqft: 2600, daily_base_rate_cents: 90900 }
              as: VenueAdmin
              captures: { sp_mr_id: $.data.id }
            - call: "POST /convention-center/vendors"
              payload: { legal_name: "SparkleClean Facility Services", service_category: "CLEANING", vendor_tier: "EXCLUSIVE", coi_expiry_date: "2030-01-01" }
              as: EventServicesManager
              captures: { ven_clean_id: $.data.id }
            - call: "POST /convention-center/clients"
              payload: { legal_name: "Sunbelt Show Promotions", contact_email: "ssp@example.org", organization_type: "PROMOTER" }
              as: VenueAdmin
              captures: { cl_ssp_id: $.data.id }
            - call: "POST /convention-center/bookings"
              payload: { client_id: "${cl_ssp_id}", space_id: "${sp_mr_id}", event_name: "Regional Gem Show", event_class: "CONSUMER_SHOW", move_in_start_date: "2027-03-01", show_start_date: "2027-03-02", show_end_date: "2027-03-04", move_out_end_date: "2027-03-05" }
              as: SalesManager
              captures: { bk_id: $.data.id }
            - call: "POST /convention-center/bookings/${bk_id}/service-orders"
              payload: { vendor_id: "${ven_clean_id}", service_category: "CLEANING", ordered_quantity: 1000 }
              as: EventServicesManager
              captures: { so_id: $.data.id }
          trigger:
            - call: "POST /convention-center/service-orders/${so_id}/approve"
              payload: {}
              as: EventServicesManager
          assert:
            - "the trigger returns 200 with response_type object"
            - "ServiceOrder.${so_id}.approval_status == APPROVED"
            - "ServiceOrder.${so_id}.billing_status == ESTIMATED"
            - "ServiceOrder.${so_id}.order_timing == ADVANCE"
            - "ServiceOrder.${so_id}.estimated_charge_cents == 15000"
            - "ServiceOrder.${so_id}.estimated_charge_cents != 6000"
            - "ServiceOrder.${so_id}.actual_quantity == null and actual_charge_cents == null"

      - name: hold_challenge_links_the_challenger_to_the_challenged_hold
        claim_type: cross_reference_link
        grounds:
          - endpoints[POST /convention-center/holds/{id}/challenge]
          - entities.SpaceHold.fields.challenged_by_hold_id
          - endpoints[GET /convention-center/holds]
        distinguishing_aspect: |
          The self-referential edge is written on the hold being challenged, not on the
          challenger, and it must be reachable in both directions: the challenged row
          exposes challenged_by_hold_id, and the list endpoint's
          challenged_by_hold_id filter returns exactly that row when queried by the
          challenger's identifier.
        test_recipe:
          setup:
            - "show_start_date 2028-02-01 is 18 whole months from the default clock, which satisfies the citywide, local and consumer windows at once"
            - "a LOCAL_EVENT hold of hold_rank 1 sits on Ballroom B for 2028-01-28 through 2028-02-05"
            - "a CITYWIDE_CONVENTION hold of hold_rank 2 covers the identical interval, and priority_rank 1 outranks priority_rank 2"
          setup_api_calls:
            - call: "POST /convention-center/policy-windows"
              payload: { event_class: "CITYWIDE_CONVENTION", priority_rank: 1, open_months_before: 60, close_months_before: 18, max_holds_per_booking: 3, challenge_response_hours: 120, rental_discount_pct: 0.25, max_challenge_rounds: 2 }
              as: VenueAdmin
            - call: "POST /convention-center/policy-windows"
              payload: { event_class: "LOCAL_EVENT", priority_rank: 2, open_months_before: 24, close_months_before: 3, max_holds_per_booking: 2, challenge_response_hours: 72, rental_discount_pct: 0.1, max_challenge_rounds: 2 }
              as: VenueAdmin
            - call: "POST /convention-center/spaces"
              payload: { name: "Ballroom B", space_class: "BALLROOM", rentable_sqft: 40000, daily_base_rate_cents: 1200000 }
              as: VenueAdmin
              captures: { sp_bb_id: $.data.id }
            - call: "POST /convention-center/clients"
              payload: { legal_name: "Riverbend Rotary", contact_email: "rotary@example.org", organization_type: "LOCAL_ORGANIZATION" }
              as: VenueAdmin
              captures: { cl_rr_id: $.data.id }
            - call: "POST /convention-center/clients"
              payload: { legal_name: "National Widget Association", contact_email: "nwa@example.org", organization_type: "NATIONAL_ASSOCIATION" }
              as: VenueAdmin
              captures: { cl_nwa_id: $.data.id }
            - call: "POST /convention-center/bookings"
              payload: { client_id: "${cl_rr_id}", space_id: "${sp_bb_id}", event_name: "Riverbend Winter Fair", event_class: "LOCAL_EVENT", move_in_start_date: "2028-01-28", show_start_date: "2028-02-01", show_end_date: "2028-02-03", move_out_end_date: "2028-02-05" }
              as: SalesManager
              captures: { bk_local_id: $.data.id, bk_local_v1: $.data.version }
            - call: "POST /convention-center/bookings"
              payload: { client_id: "${cl_nwa_id}", space_id: "${sp_bb_id}", event_name: "National Widget Winter Council", event_class: "CITYWIDE_CONVENTION", move_in_start_date: "2028-01-28", show_start_date: "2028-02-01", show_end_date: "2028-02-03", move_out_end_date: "2028-02-05", projected_room_nights: 3000 }
              as: SalesManager
              captures: { bk_city_id: $.data.id, bk_city_v1: $.data.version }
            - call: "POST /convention-center/bookings/${bk_local_id}/holds"
              payload: { expected_booking_version: "${bk_local_v1}" }
              as: SalesManager
              captures: { hold_local_id: $.data.id }
            - call: "POST /convention-center/bookings/${bk_city_id}/holds"
              payload: { expected_booking_version: "${bk_city_v1}" }
              as: SalesManager
              captures: { hold_city_id: $.data.id }
          trigger:
            - call: "POST /convention-center/holds/${hold_local_id}/challenge"
              payload: { challenger_hold_id: "${hold_city_id}" }
              as: SalesManager
            - call: "GET /convention-center/holds"
              payload: { challenged_by_hold_id: "${hold_city_id}", limit: 10, offset: 0 }
              as: FacilitiesPlanner
          assert:
            - "the first trigger returns 200 and the second returns 200"
            - "SpaceHold.${hold_local_id}.status == CHALLENGED"
            - "SpaceHold.${hold_local_id}.challenged_by_hold_id == ${hold_city_id}"
            - "SpaceHold.${hold_local_id}.challenge_round == 1"
            - "SpaceHold.${hold_local_id}.challenge_deadline_utc == 2026-08-04T00:00:00Z"
            - "SpaceHold.${hold_city_id}.status == ACTIVE and challenged_by_hold_id == null"
            - "the second response has total_count == 1 and its single row is ${hold_local_id}"

      - name: settlement_read_exposes_the_computed_money_fields
        claim_type: computed_read
        grounds:
          - endpoints[GET /convention-center/settlements/{id}]
          - calculations.settlement_line_extension
          - calculations.facility_service_fee
        distinguishing_aspect: |
          The read must expose the derived money fields, not just the stored lines: a
          single RENTAL line of 5400000 yields line_subtotal_cents 5400000, a
          facility_service_fee_cents of 378000 at the mid tier, and a
          grand_total_cents of 5778000 with deposit_applied_cents still 0 because the
          settlement is only ISSUED.
