              payload: { to_iso8601: "2026-10-01T09:00:00Z" }
              as: FirmAdmin
            - call: "GET /scheduling/engagements/${e1_id}"
              payload: {}
              as: SchedulingManager
          assert:
            - "first trigger: response.data.schedule_risk_band == 'LOW' (73 days to deadline exceeds the 60-day branch) and staffing_completion_pct == 0.00"
            - "second trigger: HTTP 200 with current_date == '2026-10-01' and iso_week_start_date == '2026-09-28'"
