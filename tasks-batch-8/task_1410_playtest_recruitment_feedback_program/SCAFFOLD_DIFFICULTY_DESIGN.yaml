  # ---------------------------------------------------------------------------
  # Rule 8: resource temporal-overlap conflicts with DIFFERENT interval semantics
  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: station_half_open_adjacency
        grounds:
          - errors[ERR_STATION_CONFLICT]
          - validations[priority=9]
          - entities.PlaytestSession.fields.station_id
        distinguishing_aspect: |
          LabStation uses half-open interval semantics [starts_at, ends_at): a
          session starting exactly when another ends (end == start) is allowed,
          while a strictly overlapping window conflicts — contrasted with the
          moderator's buffered semantics in the sibling instance.
        test_recipe:
          setup:
            - "Study S RECRUITING; station ST1 AVAILABLE; session X occupies ST1 over [2026-08-10T10:00, 2026-08-10T11:00)"
          setup_api_calls:
            - call: "POST /playtests/studies"
              payload: { title: "OV1 Study", code: "OV1", min_age: 18, max_age: 35, allowed_regions: ["US-W"], required_platforms: ["PC"], cohort_capacity: 10, incentive_budget_cents: 1000000 }
              as: ResearchOpsAdmin
              captures: { s_id: "$.data.id"}
            - call: "POST /playtests/studies/${s_id}/open-recruitment"
              payload: {}
              as: ResearchOpsAdmin
            - call: "POST /playtests/lab-stations"
              payload: { station_code: "ST1", location: "Lab A", equipment_tags: ["devkit"] }
              as: ResearchOpsAdmin
              captures: { stn_id: "$.data.id"}
            - call: "POST /playtests/sessions"
              payload: { study_id: "${s_id}", mode: "IN_LAB", station_id: "${stn_id}", starts_at: "2026-08-10T10:00:00Z", ends_at: "2026-08-10T11:00:00Z", seat_capacity: 4 }
              as: Researcher
          trigger:
            - call: "POST /playtests/sessions"
              payload: { study_id: "${s_id}", mode: "IN_LAB", station_id: "${stn_id}", starts_at: "2026-08-10T11:00:00Z", ends_at: "2026-08-10T12:00:00Z", seat_capacity: 4 }
              as: Researcher
              captures: { ok_id: "$.data.id"}
            - call: "POST /playtests/sessions"
              payload: { study_id: "${s_id}", mode: "IN_LAB", station_id: "${stn_id}", starts_at: "2026-08-10T10:30:00Z", ends_at: "2026-08-10T11:30:00Z", seat_capacity: 4 }
              as: Researcher
              captures: { err: "$.data.error_id"}
          assert:
            - "adjacent session (starts_at 11:00 == existing ends_at 11:00) succeeds and returns a session id (half-open: touching endpoints do not conflict)"
            - "err == ERR_STATION_CONFLICT for the strictly overlapping 10:30-11:30 window"
      - name: moderator_turnaround_buffer
        grounds:
          - errors[ERR_MODERATOR_CONFLICT]
          - validations[priority=9]
          - entities.PlaytestSession.fields.moderator_id
        distinguishing_aspect: |
          Moderator uses buffered interval semantics: assignments conflict unless
          the gap between sessions is at least 15 minutes — a back-to-back
          (gap 10 min) assignment fails while gap == 15 min exactly succeeds,
          which would both be legal under the station's half-open semantics.
        test_recipe:
          setup:
            - "Study S RECRUITING; moderator M ACTIVE and assigned to session A (REMOTE, 2026-08-10 10:00-11:00); sessions B (11:10-12:00) and C (11:15-12:00) exist unassigned"
          setup_api_calls:
            - call: "POST /playtests/studies"
              payload: { title: "OV2 Study", code: "OV2", min_age: 18, max_age: 35, allowed_regions: ["US-W"], required_platforms: ["PC"], cohort_capacity: 10, incentive_budget_cents: 1000000 }
              as: ResearchOpsAdmin
              captures: { s_id: "$.data.id"}
            - call: "POST /playtests/studies/${s_id}/open-recruitment"
              payload: {}
              as: ResearchOpsAdmin
            - call: "POST /playtests/moderators"
              payload: { display_name: "Mod OV2", email: "ov2-m@x.com" }
              as: ResearchOpsAdmin
              captures: { m_id: "$.data.id"}
            - call: "POST /playtests/sessions"
              payload: { study_id: "${s_id}", mode: "REMOTE", starts_at: "2026-08-10T10:00:00Z", ends_at: "2026-08-10T11:00:00Z", seat_capacity: 4 }
              as: Researcher
              captures: { sa_id: "$.data.id"}
            - call: "POST /playtests/sessions"
              payload: { study_id: "${s_id}", mode: "REMOTE", starts_at: "2026-08-10T11:10:00Z", ends_at: "2026-08-10T12:00:00Z", seat_capacity: 4 }
              as: Researcher
              captures: { sb_id: "$.data.id"}
            - call: "POST /playtests/sessions"
              payload: { study_id: "${s_id}", mode: "REMOTE", starts_at: "2026-08-10T11:15:00Z", ends_at: "2026-08-10T12:00:00Z", seat_capacity: 4 }
              as: Researcher
              captures: { sc_id: "$.data.id"}
            - call: "POST /playtests/sessions/${sa_id}/assign-moderator"
              payload: { moderator_id: "${m_id}" }
              as: Researcher
          trigger:
            - call: "POST /playtests/sessions/${sb_id}/assign-moderator"
              payload: { moderator_id: "${m_id}" }
              as: Researcher
              captures: { err: "$.data.error_id"}
            - call: "POST /playtests/sessions/${sc_id}/assign-moderator"
              payload: { moderator_id: "${m_id}" }
              as: Researcher
              captures: { ok_mod: "$.data.moderator_id"}
          assert:
            - "err == ERR_MODERATOR_CONFLICT for the 10-minute gap (10 < 15 turnaround buffer)"
            - "ok_mod == ${m_id}: the 15-minute gap (== buffer) is allowed, boundary is inclusive-allowed"
            - "GET /playtests/sessions/${sb_id}: moderator_id remains null (rejected assignment persisted nothing)"

