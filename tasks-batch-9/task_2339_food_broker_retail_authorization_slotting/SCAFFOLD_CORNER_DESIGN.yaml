            - "Call 5 returns 409 ERR_CATEGORY_EXCLUSIVITY — SGF's ACTIVE, date-covering FROZEN_SNACKS agreement has exclusive_in_category true, so NWF cannot present in that category even with its own ACTIVE agreement"
            - "Call 6 returns 200 with ${st1} == SUBMITTED — the exclusivity holder itself is not blocked (the rule reads 'no OTHER principal')"
            - "Call 7 returns 200 with ${st2} == SUBMITTED — exclusivity is scoped to (retailer, category_code), so NWF's DAIRY submission is unaffected"

      - name: approve_recovery_runs_state_then_duties_then_substantiation_checks
        claim_type: cascading_validation
        grounds:
          - validations.v-state-precondition
          - validations.v-segregation-of-duties
          - validations.v-substantiation
          - errors.ERR_INVALID_STATE
          - errors.ERR_SEGREGATION_OF_DUTIES
          - errors.ERR_SUBSTANTIATION_INSUFFICIENT
        distinguishing_aspect: |
          approve-recovery layers three checks whose order is fixed by §1.4:
          dispute_state == SUBSTANTIATED (priority 7) is verified before the
          approver identity and the document count (both priority 9), and among
          the two priority-9 rules the segregation check is listed first. The test
          walks a deduction that violates all three at once and repairs one rung
          per call, so a single mis-ordered check is visible.
        test_recipe:
          setup:
            - "Retailer BIGMART and principal NWF; one SHORTAGE deduction of 80000 dated 2026-08-01, still NOT_DISPUTED with substantiation_doc_count 0."
            - "The filing account manager is user u_dual and the audit manager identities are u_dual (same human, wearing the audit hat) and u_audit_1."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: BrokerAdmin
            - call: "POST /retailers"
              payload: { name: "Bigmart", chain_code: "BIGMART", total_store_count: 1200 }
              as: BrokerAdmin
              captures: { ret: $.data.id }
            - call: "POST /principals"
              payload: { name: "Northwind Foods", code: "NWF", slotting_budget_cents: 20000000 }
              as: BrokerAdmin
              captures: { prin: $.data.id }
            - call: "POST /deductions"
              payload: { retailer_id: "${ret}", principal_id: "${prin}", reason_code: "SHORTAGE", amount_cents: 80000, deduction_date: "2026-08-01" }
              as: RetailerBuyer
              as_user_id: "${ret}"
              captures: { ded: $.data.id }
          trigger:
            - call: "POST /deductions/${ded}/approve-recovery"
              payload: {}
              as: BrokerAuditManager
              as_user_id: "u_dual"
              captures: { e1: $.data.error_id }
            - call: "POST /deductions/${ded}/dispute"
              payload: { claim_amount_cents: 80000 }
              as: BrokerAccountManager
              as_user_id: "u_dual"
            - call: "POST /deductions/${ded}/approve-recovery"
              payload: {}
              as: BrokerAuditManager
              as_user_id: "u_dual"
              captures: { e2: $.data.error_id }
            - call: "POST /deductions/${ded}/substantiate"
              payload: { document_ref: "POD-9001" }
              as: BrokerAccountManager
              as_user_id: "u_dual"
            - call: "POST /deductions/${ded}/approve-recovery"
              payload: {}
              as: BrokerAuditManager
              as_user_id: "u_dual"
              captures: { e3: $.data.error_id }
            - call: "POST /deductions/${ded}/approve-recovery"
              payload: {}
              as: BrokerAuditManager
              as_user_id: "u_audit_1"
              captures: { e4: $.data.error_id }
            - call: "POST /deductions/${ded}/substantiate"
              payload: { document_ref: "INV-9001" }
              as: BrokerAccountManager
              as_user_id: "u_dual"
            - call: "POST /deductions/${ded}/approve-recovery"
              payload: {}
              as: BrokerAuditManager
              as_user_id: "u_audit_1"
              captures: { rec: $.data.recovered_cents, ss: $.data.settlement_state, ds: $.data.dispute_state }
          assert:
            - "Call 1 returns 409 ERR_INVALID_STATE — dispute_state is NOT_DISPUTED, so the priority-7 state check fires before the identity clash and the zero document count"
            - "Call 3 returns 409 ERR_INVALID_STATE again — dispute_state is now FILED, and approve-recovery is only reachable from SUBSTANTIATED, so the state rung still masks the identity clash even though u_dual is both filer and approver"
            - "Call 5 (dispute_state SUBSTANTIATED, doc_count 1, approver == filer u_dual) returns 403 ERR_SEGREGATION_OF_DUTIES — the priority-9 segregation rule is listed before the substantiation rule, so the insufficient document count is not reported yet"
            - "Call 6 (different approver u_audit_1, doc_count still 1) returns 409 ERR_SUBSTANTIATION_INSUFFICIENT — the next rung down"
            - "Call 8 succeeds: ${rec} == 40000 == floor(80000*5000/10000), ${ss} == RECOVERED, ${ds} == APPROVED, approved_by_user_id == u_audit_1 and filed_by_user_id == u_dual"
            - "substantiation_doc_count == 2 at approval time and open_cents == 0 with conceded_cents == 40000"

      - name: state_precondition_versus_fiscal_bound_priority_pair
        claim_type: priority_conflict
        grounds:
          - validations.v-state-precondition
          - validations.v-slotting-budget
        excluded_because:
          difficulty_instance: "priority_pair_validation_conflict / deal_accept_state_precondition_beats_slotting_budget_shortfall"
          rationale: "That instance violates priority 7 and priority 12 in one accept call and proves the 409 ERR_REVIEW_NOT_DECIDED wins, then repairs the state and shows the budget error surfacing."

      - name: temporal_window_versus_conflict_rule_priority_pair
        claim_type: priority_conflict
        grounds:
          - validations.v-review-submission-window
          - validations.v-principal-conflict
        excluded_because:
          difficulty_instance: "priority_pair_validation_conflict / presentation_submission_deadline_beats_principal_conflict_rule"
          rationale: "That instance violates priority 8 and priority 9 in one submit call, proves ERR_REVIEW_SUBMISSION_CLOSED wins, then rolls the clock back to show the live ERR_PRINCIPAL_CONFLICT and finally waives the rule."

  # ==========================================================================
  - section: endpoints
    instances:
      - name: voids_report_recomputes_both_bases_from_the_live_ledger
        claim_type: computed_read
        grounds:
          - endpoints.GET_/authorizations/{authorizationId}/voids-report
          - calculations.void_rate
        distinguishing_aspect: |
          The report is a pure projection over the ledger, and it must publish the
          counterfactual rate under the basis that was NOT pinned. With no live
          POSTING at all the two bases disagree maximally (REPORTED_BASIS reports
          0 with 400 pending stores while STORE_COUNT_BASIS would report 10000),
          and after a reversal the report must fall back to the previous period
          rather than to zero — an implementation that stores void_rate_bps only
          as a denormalised field and never recomputes it will drift.
        test_recipe:
          setup:
            - "Retailer BIGMART with void_rate_basis_default REPORTED_BASIS and the default at_risk_void_rate_bps 1500; principal NWF ACTIVE with an ACTIVE FROZEN_SNACKS agreement; item I1 VALIDATED."
            - "A review with new_item_slots 2 decided with NO slotting deal and default_store_count 400, so the authorization is AUTHORIZED with authorized_store_count 400 and void_rate_basis REPORTED_BASIS."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: BrokerAdmin
            - call: "POST /retailers"
              payload: { name: "Bigmart", chain_code: "BIGMART", total_store_count: 1200, void_rate_basis_default: "REPORTED_BASIS" }
              as: BrokerAdmin
              captures: { ret: $.data.id }
            - call: "POST /principals"
              payload: { name: "Northwind Foods", code: "NWF", slotting_budget_cents: 20000000 }
              as: BrokerAdmin
              captures: { prin: $.data.id }
            - call: "POST /commission-agreements"
              payload: { principal_id: "${prin}", retailer_id: "${ret}", category_code: "FROZEN_SNACKS", effective_start_date: "2026-01-01", effective_end_date: "2027-01-01", base_commission_bps: 500, tier_threshold_cents: 3000000, tier_commission_bps: 300 }
              as: BrokerAdmin
              captures: { agr: $.data.id }
            - call: "POST /commission-agreements/${agr}/activate"
              payload: {}
              as: BrokerAdmin
            - call: "POST /principals/${prin}/status"
              payload: { status: "ACTIVE" }
              as: BrokerAdmin
            - call: "POST /items"
              payload: { principal_id: "${prin}", upc: "011111000001", description: "Mini Tacos 12ct", case_pack_units: 12, list_price_cents: 2010, unit_cost_cents: 1200 }
              as: BrokerAccountManager
              captures: { i1: $.data.id }
            - call: "POST /items/${i1}/catalog-submissions"
