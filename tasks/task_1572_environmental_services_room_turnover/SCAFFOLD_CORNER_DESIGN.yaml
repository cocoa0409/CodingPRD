      - name: staff_shift_seconds_accrue_at_boundaries_excluding_breaks
        claim_type: side_effect_execution
        grounds:
          - state_machines.StaffMember.ON_SHIFT_to_ON_BREAK
          - state_machines.StaffMember.ON_BREAK_to_ON_SHIFT
          - state_machines.StaffMember.ON_SHIFT_OFF_BREAK_to_OFF_SHIFT (list form [ON_SHIFT, ON_BREAK])
          - entities.StaffMember.fields.shift_seconds_today
        distinguishing_aspect: |
          shift_seconds_today accrues only when a span CLOSES (break-start,
          break-end, clock-out) and break spans never count: 08:00 in, break
          10:00-10:30, out 12:00 yields exactly 12600 seconds (2h + 1.5h),
          with the open-span rule verified mid-shift (0 while ON_SHIFT with
          no closed boundary yet).
        test_recipe:
          setup:
            - "Clock 08:00; tech T1 (CLEAN), no cleans"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T08:00:00Z" }, as: EVSAdministrator }
            - call: "POST /evs/staff"
              payload: { employee_code: "T1", display_name: "Tech One", capabilities: ["CLEAN"], certifications: [] }
              as: EVSAdministrator
              captures: { t1: $.data.id }
            - call: "POST /evs/staff/${t1}/clock-in"
              payload: {}
              as: EVSTechnician
              as_user_id: "${t1}"
          trigger:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T09:00:00Z" }, as: EVSAdministrator }
            - call: "GET /evs/staff/${t1}"
              payload: {}
              as: Any
              captures: { sec_open: $.data.shift_seconds_today }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T10:00:00Z" }, as: EVSAdministrator }
            - call: "POST /evs/staff/${t1}/break-start"
              payload: {}
              as: EVSTechnician
              as_user_id: "${t1}"
              captures: { sec_at_break: $.data.shift_seconds_today }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T10:30:00Z" }, as: EVSAdministrator }
            - call: "POST /evs/staff/${t1}/break-end"
              payload: {}
              as: EVSTechnician
              as_user_id: "${t1}"
              captures: { sec_at_bend: $.data.shift_seconds_today }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T12:00:00Z" }, as: EVSAdministrator }
            - call: "POST /evs/staff/${t1}/clock-out"
              payload: {}
              as: EVSTechnician
              as_user_id: "${t1}"
              captures: { sec_final: $.data.shift_seconds_today }
          assert:
            - "sec_open == 0 (09:00: one hour into an OPEN span — nothing accrues until a boundary closes it)"
            - "sec_at_break == 7200 (break-start closes the 08:00-10:00 ON_SHIFT span)"
            - "sec_at_bend == 7200 (the 10:00-10:30 break span accrues nothing)"
            - "sec_final == 12600 (7200 + the 10:30-12:00 span of 5400 closed by clock-out)"

  # ===========================================================================
  # Section: calculations (Table 3 claims: correct result, input-set filtering,
  # constants, precision, algorithm-specific boundaries)
  # ===========================================================================
  - section: calculations
    instances:
      - name: request_priority_score_tier_demand_breach_composition
        claim_type: correct_result
        grounds:
          - calculations.clean_request_priority_score
          - calculations.sla_breach_sweep
          - entities.CleanRequest.fields.priority_score
          - entities.CleanRequest.fields.sla_breached
        distinguishing_aspect: |
          The request score decomposes as TIER_BASE + max contributing demand
          score + breach boost, all recomputed at declared triggers: 5550.00
          when the URGENT demand appears (wait 0), 5640.00 at the sla_due_at
          equality ops-run (no breach: strict >), 8142.00 one minute later
          (breach boost 2500 lands), and 2500.00 after the demand cancels
          (tier collapses to STANDARD, sticky breach boost remains).
        test_recipe:
          setup:
            - "Clock 08:00; unit U1; ROUTINE standard; STANDARD bed B1 (never READY, so the demand keeps its scarcity bonus)"
            - "R1 ROUTINE on B1 created 08:00 (no demands yet: tier STANDARD, score 0.00, sla_due_at 08:45)"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T08:00:00Z" }, as: EVSAdministrator }
            - call: "POST /evs/units"
              payload: { unit_code: "U1", display_name: "Unit One" }
              as: EVSAdministrator
              captures: { u1: $.data.id }
            - call: "POST /evs/clean-standards"
              payload: { clean_type: "ROUTINE", base_minutes: 45, outbreak_multiplier_bps: 15000, atp_rlu_threshold: 250 }
              as: EVSAdministrator
            - call: "POST /evs/beds"
              payload: { unit_id: "${u1}", bed_code: "B1", bed_kind: "STANDARD" }
              as: EVSAdministrator
              captures: { b1: $.data.id }
            - call: "POST /evs/clean-requests"
              payload: { bed_id: "${b1}", clean_type: "ROUTINE" }
              as: EVSDispatcher
              captures: { r1: $.data.id, tier0: $.data.priority_tier, score0: $.data.priority_score }
          trigger:
            - call: "POST /evs/placement-demands"
              payload: { unit_id: "${u1}", required_bed_kind: "STANDARD", urgency_tier: "URGENT", needed_by: "2026-08-01T20:00:00Z" }
              as: BedPlacementCoordinator
              captures: { d1: $.data.id }
            - call: "GET /evs/clean-requests/${r1}"
              payload: {}
              as: Any
              captures: { tier1: $.data.priority_tier, score1: $.data.priority_score }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T08:45:00Z" }, as: EVSAdministrator }
            - call: "POST /evs/units/${u1}/ops-runs"
              payload: {}
              as: EVSAdministrator
            - call: "GET /evs/clean-requests/${r1}"
              payload: {}
              as: Any
              captures: { br_eq: $.data.sla_breached, score_eq: $.data.priority_score }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T08:46:00Z" }, as: EVSAdministrator }
            - call: "POST /evs/units/${u1}/ops-runs"
              payload: {}
              as: EVSAdministrator
            - call: "GET /evs/clean-requests/${r1}"
              payload: {}
              as: Any
              captures: { br_after: $.data.sla_breached, score_after: $.data.priority_score }
            - call: "POST /evs/placement-demands/${d1}/cancel"
              payload: {}
              as: BedPlacementCoordinator
            - call: "GET /evs/clean-requests/${r1}"
              payload: {}
              as: Any
              captures: { tier_end: $.data.priority_tier, score_end: $.data.priority_score, br_end: $.data.sla_breached }
          assert:
            - "tier0 == STANDARD AND score0 == 0.0 (no contributing demands: TIER_BASE 0 + demand_part 0)"
            - "tier1 == URGENT AND score1 == 5550.0 (5000 + demand score 500 + 0 wait + 50 scarcity, wait==0 at creation instant)"
