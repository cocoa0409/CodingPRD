          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. State University ACTIVE with OPEN event + session; Tech Institute ACTIVE with student Mia ENROLLED."
          setup_api_calls:
            - *k_clock
            - *k_uni
            - *k_uni_active
            - *k_event
            - *k_event_open
            - *k_sess
            - call: "POST /universities"
              payload: { name: "Tech Institute", primary_domain: "tech.edu", employer_daily_message_cap: 3 }
              as: PlatformAdmin
              captures: { uni2_id: $.data.id }
            - call: "POST /universities/${uni2_id}/transition"
              payload: { to: "ACTIVE" }
              as: PlatformAdmin
            - call: "POST /students"
              payload: { university_id: "${uni2_id}", email: "mia@tech.edu", full_name: "Mia Torres", major: "EE", graduation_year: 2027, work_authorization: "US_CITIZEN" }
              as: CareerCenterAdmin
              as_user_id: "${uni2_id}"
              captures: { stu_mia_id: $.data.id }
          trigger:
            - call: "POST /event-signups"
              payload: { event_session_id: "${ses_id}", student_id: "${stu_mia_id}" }
              as: Student
              as_user_id: "${stu_mia_id}"
              captures: { err_id: $.data.error_id }
          assert:
            - "the response status is 403 and err_id == ERR_CROSS_UNIVERSITY_ACCESS"

  # ===========================================================================
  - section: rbac
    instances:
      - name: student_cannot_publish_job_posting
        claim_type: Role Denial
        grounds:
          - roles.Student
          - endpoints.POST_/job-postings/{id}/transition
          - errors.ERR_UNAUTHORIZED_ROLE
        distinguishing_aspect: "The platform publication gate is PlatformAdmin-only: a Student sending to=PUBLISHED on a SUBMITTED posting is refused 403 ERR_UNAUTHORIZED_ROLE even though the transition itself would be legal for the platform."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. University ACTIVE; Sam ENROLLED; Acme APPROVED; posting SUBMITTED."
          setup_api_calls:
            - *k_clock
            - *k_uni
            - *k_uni_active
            - *k_stu
            - *k_emp
            - *k_emp_verify
            - *k_emp_screen
            - *k_post
            - *k_post_submit
          trigger:
            - call: "POST /job-postings/${post_id}/transition"
              payload: { to: "PUBLISHED" }
              as: Student
              as_user_id: "${stu_id}"
              captures: { err_id: $.data.error_id }
          assert:
            - "the response status is 403 and err_id == ERR_UNAUTHORIZED_ROLE"
            - "GET /job-postings/${post_id} still shows SUBMITTED"

      - name: career_center_cannot_decide_other_university_approval
        claim_type: Role Denial
        grounds:
          - roles.CareerCenterAdmin
          - validations[priority=3]
          - errors.ERR_FORBIDDEN_OWNERSHIP
        distinguishing_aspect: "CareerCenterAdmin identity is entity_backed by University: the Tech Institute admin (X-User-ID = tech's id) deciding State University's approval is 403 ERR_FORBIDDEN_OWNERSHIP — the p3 ownership gate fires before any state check."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Two ACTIVE universities; Acme APPROVED; approval PENDING at State University."
          setup_api_calls:
            - *k_clock
            - *k_uni
            - *k_uni_active
            - *k_emp
            - *k_emp_verify
            - *k_emp_screen
            - *k_appr
            - call: "POST /universities"
              payload: { name: "Tech Institute", primary_domain: "tech.edu", employer_daily_message_cap: 3 }
              as: PlatformAdmin
              captures: { uni2_id: $.data.id }
            - call: "POST /universities/${uni2_id}/transition"
              payload: { to: "ACTIVE" }
              as: PlatformAdmin
          trigger:
            - call: "POST /employer-approvals/${appr_id}/decide"
              payload: { decision: "APPROVE", expected_employer_version: "${emp_v}" }
              as: CareerCenterAdmin
              as_user_id: "${uni2_id}"
              captures: { err_id: $.data.error_id }
          assert:
            - "the response status is 403 and err_id == ERR_FORBIDDEN_OWNERSHIP"
            - "GET /employer-approvals/${appr_id} still shows PENDING with decided_at null"

      - name: recruiter_cannot_transition_other_employers_posting
        claim_type: Role Denial
        grounds:
          - roles.EmployerRecruiter
          - validations[priority=3]
          - errors.ERR_FORBIDDEN_OWNERSHIP
        distinguishing_aspect: "EmployerRecruiter identity is entity_backed by Employer: Globex's recruiter submitting Acme's posting is 403 ERR_FORBIDDEN_OWNERSHIP — role alone is not enough; the caller must own the posting's employer."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Acme APPROVED with a DRAFT posting; Globex registered (PENDING is enough — ownership precedes state)."
          setup_api_calls:
            - *k_clock
            - *k_emp
            - *k_emp_verify
            - *k_emp_screen
            - *k_post
            - call: "POST /employers"
              payload: { company_name: "Globex", website_domain: "globex.com", contact_email: "jobs@gmail.com" }
              as: Anonymous
              captures: { emp2_id: $.data.id }
          trigger:
            - call: "POST /job-postings/${post_id}/transition"
              payload: { to: "SUBMITTED" }
              as: EmployerRecruiter
              as_user_id: "${emp2_id}"
              captures: { err_id: $.data.error_id }
          assert:
            - "the response status is 403 and err_id == ERR_FORBIDDEN_OWNERSHIP"
            - "GET /job-postings/${post_id} still shows DRAFT"

  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: decide_with_stale_employer_version_returns_412
        claim_type: OCC Stale Version
        grounds:
          - concurrency_rules[employer-decision-stale-version]
          - errors.ERR_STALE_EMPLOYER_VERSION
        distinguishing_aspect: "Between the career center's read (Employer.version 3 after CLEAR) and its decide call, a FLAG re-screen advances the version to 4 — the decide carrying expected_employer_version 3 is rejected 412 ERR_STALE_EMPLOYER_VERSION and the approval stays PENDING."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. University ACTIVE; Acme APPROVED (version 3, captured); approval PENDING; then a FLAG screen bumps the employer to version 4 (UNDER_REVIEW)."
          setup_api_calls:
            - *k_clock
            - *k_uni
            - *k_uni_active
            - *k_emp
            - *k_emp_verify
            - *k_emp_screen
            - *k_appr
            - call: "POST /employers/${emp_id}/screen"
              payload: { decision: "FLAG" }
              as: PlatformAdmin
          trigger:
            - call: "POST /employer-approvals/${appr_id}/decide"
              payload: { decision: "APPROVE", expected_employer_version: "${emp_v}" }
              as: CareerCenterAdmin
              as_user_id: "${uni_id}"
              captures: { err_id: $.data.error_id }
          assert:
            - "the response status is 412 and err_id == ERR_STALE_EMPLOYER_VERSION"
            - "GET /employer-approvals/${appr_id} still shows PENDING — the decision was not applied"
            - "GET /employers/${emp_id} shows version 4 and status UNDER_REVIEW"

      - name: session_create_with_stale_event_version_returns_412
        claim_type: OCC Stale Version
        grounds:
          - concurrency_rules[event-session-create-stale-version]
          - errors.ERR_STALE_CAREER_EVENT_VERSION
        distinguishing_aspect: "Session create is OCC-guarded on CareerEvent.version: after a first session is added (version 1 -> 2), a second create still carrying expected_career_event_version 1 is rejected 412 ERR_STALE_CAREER_EVENT_VERSION — two strictly sequential requests, no overlap."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. University ACTIVE; event OPEN (version captured at OPEN transition = 2); one session already added (version now 3)."
          setup_api_calls:
            - *k_clock
            - *k_uni
            - *k_uni_active
            - *k_event
            - *k_event_open
            - *k_sess
          trigger:
            - call: "POST /career-events/${ev_id}/sessions"
              payload: { title: "Second Booth", mode: "VIRTUAL", starts_at: "2026-10-10T13:00:00Z", ends_at: "2026-10-10T14:00:00Z", signup_deadline: "2026-10-09T23:59:59Z", capacity: 30, expected_career_event_version: "${ev_v2}" }
              as: CareerCenterAdmin
              as_user_id: "${uni_id}"
              captures: { err_id: $.data.error_id }
          assert:
            - "the response status is 412 and err_id == ERR_STALE_CAREER_EVENT_VERSION (captured ${ev_v2} predates the first session's version bump)"
            - "GET /career-events/${ev_id}/sessions returns exactly 1 row"

      - name: posting_version_increments_on_every_transition
        claim_type: Version Increments
        grounds:
          - entities.JobPosting
          - state_machines.JobPosting
        distinguishing_aspect: "The common-fields contract: every mutation bumps version by exactly 1 — create 1, SUBMITTED 2, PUBLISHED 3, PAUSED 4, resume-PUBLISHED 5 — observable in each transition response and on the final GET."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Employer Acme APPROVED; posting DRAFT (version 1)."
          setup_api_calls:
            - *k_clock
            - *k_emp
            - *k_emp_verify
            - *k_emp_screen
            - *k_post
          trigger:
            - call: "POST /job-postings/${post_id}/transition"
              payload: { to: "SUBMITTED" }
              as: EmployerRecruiter
              as_user_id: "${emp_id}"
              captures: { v_sub: $.data.version }
            - call: "POST /job-postings/${post_id}/transition"
              payload: { to: "PUBLISHED" }
              as: PlatformAdmin
              captures: { v_pub: $.data.version }
            - call: "POST /job-postings/${post_id}/transition"
              payload: { to: "PAUSED" }
              as: EmployerRecruiter
              as_user_id: "${emp_id}"
              captures: { v_pau: $.data.version }
            - call: "POST /job-postings/${post_id}/transition"
              payload: { to: "PUBLISHED" }
              as: EmployerRecruiter
              as_user_id: "${emp_id}"
              captures: { v_res: $.data.version }
          assert:
            - "v_sub == 2 and v_pub == 3 and v_pau == 4 and v_res == 5"
            - "GET /job-postings/${post_id} shows version == 5 and status == PUBLISHED"

  # ===========================================================================
  - section: consistency_model
    instances:
      - name: mutation_responses_reflect_new_state_immediately
        claim_type: Immediate Consistency
        grounds:
          - complexity_profile.consistency_model
          - endpoints.POST_/universities/{id}/transition
        distinguishing_aspect: "The consistency model is immediate: the POST /universities/{id}/transition response body itself carries status ACTIVE and version 2 — no follow-up GET or settling delay is needed to observe the mutation."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. University ONBOARDING (version 1)."
          setup_api_calls:
            - *k_clock
            - *k_uni
          trigger:
            - call: "POST /universities/${uni_id}/transition"
              payload: { to: "ACTIVE" }
              as: PlatformAdmin
              captures: { imm_status: $.data.status, imm_version: $.data.version }
          assert:
            - "the transition response itself shows imm_status == ACTIVE and imm_version == 2"
            - "a subsequent POST /students against ${uni_id} succeeds immediately (no read-repair window)"

