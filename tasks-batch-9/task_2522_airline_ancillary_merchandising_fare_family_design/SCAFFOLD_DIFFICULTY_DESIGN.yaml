# =============================================================================
# 1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task 2522 - Airline Ancillary Merchandising & Fare Family Design
#
# Every instance grounds in SCAFFOLD.yaml 1.1-1.7 only. Every numeric literal in
# `assert:` was produced by executing the pinned 1.3 formulas with exact integer
# / Fraction arithmetic and round-half-up - no estimates.
#
# Shared fixture conventions used by every chain below:
#   - the logical clock starts at 2026-08-01T00:00:00Z (per 1.5 POST /_clock)
#     and is moved explicitly whenever a window or expiry matters
#   - opaque operator ids: ma-001 (MerchandisingAnalyst), pa-001 (PricingApprover),
#     dm-001 (DistributionManager), oc-001 (OperationsController), ra-001
#     (RevenueAccountant); the ChannelPartner X-User-ID is always the
#     DistributionChannel.id it sells for (identity: entity_backed)
#   - ma-001 designs every family and pa-001 reviews it, so the
#     segregation-of-duties check at validations[priority=7] always passes
# =============================================================================
scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: family_valuation_override_vs_list_basis
        grounds:
          - calculations.fare_family_bundle_valuation
          - entities.FareFamily.fields.unbundled_value_cents
          - entities.FareFamily.fields.a_la_carte_total_cents
          - entities.FamilyAttribute.fields.override_price_cents
          - entities.Booking.fields.disclosed_unbundled_list_cents
          - state_machines.Booking.disclosure_state.NOT_ISSUED_to_PENDING_ACK
        distinguishing_aspect: |
          The override_basis variant persists unbundled_value_cents 11155 on the FareFamily
          (catalog domain) while the list_basis variant snapshots 11673 into
          Booking.disclosed_unbundled_list_cents (regulatory point-of-sale domain) from the
          same three attributes - a 518-cent divergence on two different entities, because
          list_basis ignores override_price_cents 3300 and 1200 entirely.
        test_recipe:
          setup:
            - "clock at 2026-08-10T09:00:00Z"
            - "catalog holds BAG_CHECKED_1 (3500), SEAT_STANDARD (1900) and PRIORITY_BOARDING (1250), all ACTIVE"
            - "PREMIUM family PREM_FLEX (base_fare 24000, bundle 30000) is PUBLISHED with three ACTIVE INCLUDED attributes: BAG_CHECKED_1 quantity 2 overridden to 3300, SEAT_STANDARD quantity 1 at list, PRIORITY_BOARDING quantity 1 overridden to 1200"
            - "DIRECT_WEB channel exists and one HELD booking sits on PREM_FLEX with disclosure_state NOT_ISSUED"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T09:00:00Z" }
              as: MerchandisingAnalyst
              as_user_id: "ma-001"
            - call: "POST /ancillary-products"
              payload: { sku: "BAG_CHECKED_1", name: "First checked bag", category: "BAGGAGE", list_price_cents: 3500, tax_treatment: "TAXABLE_SERVICE", revenue_class: "NON_AIR", revenue_account_code: "4100", refundable: false, disclosable_fee: true, product_state: "ACTIVE" }
              as: MerchandisingAnalyst
              as_user_id: "ma-001"
              captures: { p_bag_id: $.data.id }
            - call: "POST /ancillary-products"
              payload: { sku: "SEAT_STANDARD", name: "Standard seat", category: "SEAT", list_price_cents: 1900, tax_treatment: "TAXABLE_SERVICE", revenue_class: "NON_AIR", revenue_account_code: "4200", refundable: true, disclosable_fee: true, product_state: "ACTIVE" }
              as: MerchandisingAnalyst
              as_user_id: "ma-001"
              captures: { p_seat_std_id: $.data.id }
            - call: "POST /ancillary-products"
              payload: { sku: "PRIORITY_BOARDING", name: "Priority boarding", category: "BOARDING", list_price_cents: 1250, tax_treatment: "TAXABLE_SERVICE", revenue_class: "NON_AIR", revenue_account_code: "4400", refundable: false, disclosable_fee: true, product_state: "ACTIVE" }
              as: MerchandisingAnalyst
              as_user_id: "ma-001"
              captures: { p_board_id: $.data.id }
            - call: "POST /fare-families"
              payload: { code: "PREM_FLEX", name: "Premium Flex", cabin_class: "PREMIUM", base_fare_cents: 24000, bundle_price_cents: 30000, refundability: "REFUNDABLE_WITH_FEE", change_fee_cents: 7500, boarding_priority_tier: 2 }
              as: MerchandisingAnalyst
              as_user_id: "ma-001"
              captures: { f_prem_id: $.data.id }
            - call: "POST /fare-families/${f_prem_id}/attributes"
              payload: { ancillary_product_id: "${p_bag_id}", inclusion: "INCLUDED", included_quantity: 2, override_price_cents: 3300, waiver_eligible: true }
              as: MerchandisingAnalyst
              as_user_id: "ma-001"
              captures: { a_bag_id: $.data.id }
            - call: "POST /fare-families/${f_prem_id}/attributes"
              payload: { ancillary_product_id: "${p_seat_std_id}", inclusion: "INCLUDED", included_quantity: 1, waiver_eligible: true }
              as: MerchandisingAnalyst
              as_user_id: "ma-001"
              captures: { a_seat_id: $.data.id }
            - call: "POST /fare-families/${f_prem_id}/attributes"
              payload: { ancillary_product_id: "${p_board_id}", inclusion: "INCLUDED", included_quantity: 1, override_price_cents: 1200, waiver_eligible: false }
              as: MerchandisingAnalyst
              as_user_id: "ma-001"
              captures: { a_board_id: $.data.id }
            - call: "POST /fare-families/${f_prem_id}/submit"
              payload: {}
              as: MerchandisingAnalyst
              as_user_id: "ma-001"
            - call: "POST /fare-families/${f_prem_id}/review-decision"
              payload: { decision: "APPROVE", review_note: "premium bundle signed off" }
              as: PricingApprover
              as_user_id: "pa-001"
            - call: "POST /distribution-channels"
              payload: { channel_code: "DIRECT_WEB", channel_type: "DIRECT", commission_bp: 0, markup_bp: 0, max_ancillary_price_cents: 20000, supported_categories: ["BAGGAGE", "SEAT", "CHANGE", "BOARDING", "ONBOARD"], parity_required: true }
              as: DistributionManager
              as_user_id: "dm-001"
              captures: { ch_direct_id: $.data.id }
            - call: "POST /flights"
              payload: { flight_no: "AA100", origin: "JFK", destination: "LAX", scheduled_departure_utc: "2026-09-15T14:00:00Z", cabin_seat_total: 180 }
              as: OperationsController
              as_user_id: "oc-001"
              captures: { fl_id: $.data.id }
            - call: "POST /bookings"
              payload: { record_locator: "PRM001", flight_id: "${fl_id}", fare_family_id: "${f_prem_id}", distribution_channel_id: "${ch_direct_id}", passenger_name: "Ada Lovelace" }
              as: ChannelPartner
              as_user_id: "${ch_direct_id}"
              captures: { b_prem_id: $.data.id }
          trigger:
            - call: "POST /bookings/${b_prem_id}/disclosure"
              payload: {}
              as: ChannelPartner
              as_user_id: "${ch_direct_id}"
              captures: { disc_list_cents: $.data.disclosed_unbundled_list_cents }
          assert:
            - "FamilyAttribute.${a_bag_id}.effective_unit_cents == 3300 and FamilyAttribute.${a_bag_id}.attr_value_cents == 7590"
            - "FamilyAttribute.${a_seat_id}.attr_value_cents == 2185"
            - "FamilyAttribute.${a_board_id}.attr_value_cents == 1380"
            - "FareFamily.${f_prem_id}.unbundled_value_cents == 11155"
            - "FareFamily.${f_prem_id}.a_la_carte_total_cents == 35155"
            - "FareFamily.${f_prem_id}.bundle_discount_bp == 1466"
            - "Booking.${b_prem_id}.disclosed_unbundled_list_cents == 11673"
            - "Booking.${b_prem_id}.disclosed_unbundled_list_cents - FareFamily.${f_prem_id}.unbundled_value_cents == 518"
            - "Booking.${b_prem_id}.disclosed_total_fee_cents == 7500"
            - "Booking.${b_prem_id}.disclosed_fee_fingerprint == \"PREM_FLEX|1|BAG_CHECKED_1:INCLUDED:2:3300;PRIORITY_BOARDING:INCLUDED:1:1200;SEAT_STANDARD:INCLUDED:1:1900\""
            - "Booking.${b_prem_id}.disclosure_state == PENDING_ACK"
            - "FareFamily.${f_prem_id}.unbundled_value_cents is unchanged by the disclosure (still 11155): the list_basis variant writes only to the Booking"

      - name: offer_price_wtp_elastic_vs_residual_inventory
        grounds:
          - calculations.ancillary_offer_dynamic_price
          - calculations.ancillary_offer_dynamic_price.variants.WTP_ELASTIC
          - calculations.ancillary_offer_dynamic_price.variants.RESIDUAL_INVENTORY
          - entities.AncillaryOffer.fields.pricing_variant
          - entities.SeatInventorySegment.fields.available_seats
        distinguishing_aspect: |
          Two flights carry an IDENTICAL demand feed (booked_load_factor_pct 75,
          demand_index_bp 1200) and the same SEAT product. FL_A has no OPEN seat segment for
          that product, so the elastic variant reads the demand feed and yields wtp 11007 ->
          5085 cents. FL_B has an OPEN EXIT_ROW segment that is 75% held, so the residual
          variant ignores the demand feed entirely, reads physical scarcity, and yields
          wtp 11500 -> 5313 cents. Variant selection is driven purely by segment existence.
        test_recipe:
          setup:
            - "clock at 2026-08-10T09:00:00Z; ECO_LITE family PUBLISHED with only BAG_CHECKED_1 bundled, so SEAT_EXTRA_LEGROOM stays merchandisable"
            - "FL_A (AA200) has NO seat segment for SEAT_EXTRA_LEGROOM; FL_B (AA300) has one OPEN EXIT_ROW segment rows 12..12 letters A,B,C,D (total_seats 4)"
            - "both flights are advanced to CHECKIN_OPEN and given the same demand snapshot 75 / 1200"
            - "on FL_B a separate HELD booking holds 12A, 12B and 12C, leaving available_seats 1 -> sold_pct 75"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T09:00:00Z" }
              as: OperationsController
              as_user_id: "oc-001"
            - call: "POST /ancillary-products"
              payload: { sku: "BAG_CHECKED_1", name: "First checked bag", category: "BAGGAGE", list_price_cents: 3500, tax_treatment: "TAXABLE_SERVICE", revenue_class: "NON_AIR", revenue_account_code: "4100", refundable: false, disclosable_fee: true, product_state: "ACTIVE" }
              as: MerchandisingAnalyst
              as_user_id: "ma-001"
              captures: { p_bag_id: $.data.id }
            - call: "POST /ancillary-products"
              payload: { sku: "SEAT_EXTRA_LEGROOM", name: "Extra legroom seat", category: "SEAT", list_price_cents: 4200, tax_treatment: "TAXABLE_SERVICE", revenue_class: "NON_AIR", revenue_account_code: "4200", refundable: true, disclosable_fee: true, product_state: "ACTIVE" }
              as: MerchandisingAnalyst
              as_user_id: "ma-001"
              captures: { p_legroom_id: $.data.id }
            - call: "POST /fare-families"
              payload: { code: "ECO_LITE", name: "Economy Lite", cabin_class: "ECONOMY", base_fare_cents: 12000, bundle_price_cents: 14000, refundability: "NON_REFUNDABLE", change_fee_cents: 7500, boarding_priority_tier: 4 }
              as: MerchandisingAnalyst
              as_user_id: "ma-001"
              captures: { f_lite_id: $.data.id }
            - call: "POST /fare-families/${f_lite_id}/attributes"
              payload: { ancillary_product_id: "${p_bag_id}", inclusion: "INCLUDED", included_quantity: 1 }
              as: MerchandisingAnalyst
              as_user_id: "ma-001"
            - call: "POST /fare-families/${f_lite_id}/submit"
              payload: {}
              as: MerchandisingAnalyst
              as_user_id: "ma-001"
            - call: "POST /fare-families/${f_lite_id}/review-decision"
              payload: { decision: "APPROVE" }
              as: PricingApprover
              as_user_id: "pa-001"
            - call: "POST /distribution-channels"
              payload: { channel_code: "DIRECT_WEB", channel_type: "DIRECT", commission_bp: 0, markup_bp: 0, max_ancillary_price_cents: 20000, supported_categories: ["BAGGAGE", "SEAT", "CHANGE", "BOARDING", "ONBOARD"], parity_required: true }
              as: DistributionManager
              as_user_id: "dm-001"
              captures: { ch_direct_id: $.data.id }
            - call: "POST /flights"
              payload: { flight_no: "AA200", origin: "JFK", destination: "LAX", scheduled_departure_utc: "2026-09-15T14:00:00Z", cabin_seat_total: 180 }
              as: OperationsController
              as_user_id: "oc-001"
              captures: { fl_a_id: $.data.id }
            - call: "POST /flights"
              payload: { flight_no: "AA300", origin: "JFK", destination: "SFO", scheduled_departure_utc: "2026-09-16T14:00:00Z", cabin_seat_total: 180 }
              as: OperationsController
              as_user_id: "oc-001"
              captures: { fl_b_id: $.data.id }
            - call: "POST /seat-segments"
              payload: { flight_id: "${fl_b_id}", ancillary_product_id: "${p_legroom_id}", zone: "EXIT_ROW", row_start: 12, row_end: 12, seat_letters: ["A", "B", "C", "D"], base_price_cents: 2000 }
              as: OperationsController
              as_user_id: "oc-001"
              captures: { seg_b_id: $.data.id }
            - call: "POST /flights/${fl_a_id}/phase-advance"
              payload: { target_phase: "CHECKIN_OPEN" }
              as: OperationsController
              as_user_id: "oc-001"
            - call: "POST /flights/${fl_b_id}/phase-advance"
              payload: { target_phase: "CHECKIN_OPEN" }
              as: OperationsController
              as_user_id: "oc-001"
            - call: "POST /flights/${fl_a_id}/demand-snapshot"
              payload: { booked_load_factor_pct: 75, demand_index_bp: 1200 }
              as: OperationsController
              as_user_id: "oc-001"
            - call: "POST /flights/${fl_b_id}/demand-snapshot"
              payload: { booked_load_factor_pct: 75, demand_index_bp: 1200 }
              as: OperationsController
              as_user_id: "oc-001"
            - call: "POST /bookings"
              payload: { record_locator: "BHOLD1", flight_id: "${fl_b_id}", fare_family_id: "${f_lite_id}", distribution_channel_id: "${ch_direct_id}", passenger_name: "Seat Holder" }
              as: ChannelPartner
              as_user_id: "${ch_direct_id}"
              captures: { b_hold_id: $.data.id }
            - call: "POST /bookings/${b_hold_id}/seat-assignments"
              payload: { seat_inventory_segment_id: "${seg_b_id}", row: 12, seat_letter: "A" }
              as: ChannelPartner
              as_user_id: "${ch_direct_id}"
            - call: "POST /bookings/${b_hold_id}/seat-assignments"
              payload: { seat_inventory_segment_id: "${seg_b_id}", row: 12, seat_letter: "B" }
              as: ChannelPartner
              as_user_id: "${ch_direct_id}"
            - call: "POST /bookings/${b_hold_id}/seat-assignments"
              payload: { seat_inventory_segment_id: "${seg_b_id}", row: 12, seat_letter: "C" }
              as: ChannelPartner
              as_user_id: "${ch_direct_id}"
            - call: "POST /bookings"
              payload: { record_locator: "OFFRA1", flight_id: "${fl_a_id}", fare_family_id: "${f_lite_id}", distribution_channel_id: "${ch_direct_id}", passenger_name: "Elastic Pax" }
              as: ChannelPartner
              as_user_id: "${ch_direct_id}"
              captures: { b_a_id: $.data.id }
            - call: "POST /bookings"
              payload: { record_locator: "OFFRB1", flight_id: "${fl_b_id}", fare_family_id: "${f_lite_id}", distribution_channel_id: "${ch_direct_id}", passenger_name: "Residual Pax" }
              as: ChannelPartner
              as_user_id: "${ch_direct_id}"
              captures: { b_b_id: $.data.id }
          trigger:
            - call: "POST /bookings/${b_a_id}/offer-sessions"
              payload: { touchpoint: "CHECKIN", requested_product_ids: ["${p_legroom_id}"] }
              as: ChannelPartner
              as_user_id: "${ch_direct_id}"
              captures: { elastic_offer_ids: $.data.presented_offer_ids }
            - call: "POST /bookings/${b_b_id}/offer-sessions"
              payload: { touchpoint: "CHECKIN", requested_product_ids: ["${p_legroom_id}"] }
              as: ChannelPartner
              as_user_id: "${ch_direct_id}"
              captures: { residual_offer_ids: $.data.presented_offer_ids }
          assert:
            - "SeatInventorySegment.${seg_b_id}.total_seats == 4 and held_seats == 3 and available_seats == 1"
            - "both sessions return candidate_count == 1, suppression_reason == \"\" and exactly one presented offer id"
            - "the FL_A offer has pricing_variant == WTP_ELASTIC, wtp_score_bp == 11007, offered_price_cents == 5085 and expected_value_cents == 5597"
            - "the FL_B offer has pricing_variant == RESIDUAL_INVENTORY, wtp_score_bp == 11500, offered_price_cents == 5313 and expected_value_cents == 6110"
            - "5313 - 5085 == 228: the delta comes only from the variant, since both flights report booked_load_factor_pct 75 and demand_index_bp 1200"
            - "both offers have sequence_rank == 1, valid_from == \"2026-08-10T09:00:00Z\" and valid_until == \"2026-08-10T10:00:00Z\""

  - rule_id: combinatorial_formula
    instances:
      - name: offer_price_nonlinear_clamp_chain
        mode: a
        grounds:
          - calculations.ancillary_offer_dynamic_price
          - entities.AncillaryOffer.fields.offered_price_cents
          - entities.AncillaryOffer.fields.expected_value_cents
          - entities.DistributionChannel.fields.markup_bp
        distinguishing_aspect: |
          Four chained round_half_up steps plus a two-sided clamp, in a pinned order:
          7500 -> 9023 (wtp 12030) -> 11279 (INFLIGHT 12500bp) -> 13535 (markup 2000bp) ->
          clamped DOWN to the product cap 13500 -> expected_value 16241. Folding the three
          multipliers into one product gives 13534, and computing expected_value from the
          pre-clamp 13535 gives 16242, so both the ordering and the clamp position are pinned
          by a single artifact. The channel's max_ancillary_price_cents 20000 is deliberately
          NOT applied at pricing time.
        test_recipe:
          setup:
            - "clock at 2026-08-10T09:00:00Z; CHANGE_FLEX (list 7500) is ACTIVE and is NOT bundled into the booking's family"
            - "GDS_PREMIUM channel has markup_bp 2000 and max_ancillary_price_cents 20000 and supports every category"
            - "flight AA400 is advanced PRESALE -> CHECKIN_OPEN -> BOARDING so the INFLIGHT touchpoint is legal, and carries the extreme demand feed 100 / 5000"
            - "one HELD booking sits on that flight through GDS_PREMIUM"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T09:00:00Z" }
              as: OperationsController
              as_user_id: "oc-001"
            - call: "POST /ancillary-products"
              payload: { sku: "BAG_CHECKED_1", name: "First checked bag", category: "BAGGAGE", list_price_cents: 3500, tax_treatment: "TAXABLE_SERVICE", revenue_class: "NON_AIR", revenue_account_code: "4100", refundable: false, disclosable_fee: true, product_state: "ACTIVE" }
              as: MerchandisingAnalyst
              as_user_id: "ma-001"
              captures: { p_bag_id: $.data.id }
            - call: "POST /ancillary-products"
              payload: { sku: "CHANGE_FLEX", name: "Flexible change", category: "CHANGE", list_price_cents: 7500, tax_treatment: "TAXABLE_SERVICE", revenue_class: "NON_AIR", revenue_account_code: "4300", refundable: false, disclosable_fee: true, product_state: "ACTIVE" }
              as: MerchandisingAnalyst
              as_user_id: "ma-001"
              captures: { p_change_id: $.data.id }
            - call: "POST /fare-families"
              payload: { code: "ECO_LITE", name: "Economy Lite", cabin_class: "ECONOMY", base_fare_cents: 12000, bundle_price_cents: 14000, refundability: "NON_REFUNDABLE", change_fee_cents: 7500, boarding_priority_tier: 4 }
              as: MerchandisingAnalyst
              as_user_id: "ma-001"
              captures: { f_lite_id: $.data.id }
            - call: "POST /fare-families/${f_lite_id}/attributes"
              payload: { ancillary_product_id: "${p_bag_id}", inclusion: "INCLUDED", included_quantity: 1 }
              as: MerchandisingAnalyst
              as_user_id: "ma-001"
            - call: "POST /fare-families/${f_lite_id}/submit"
              payload: {}
              as: MerchandisingAnalyst
              as_user_id: "ma-001"
            - call: "POST /fare-families/${f_lite_id}/review-decision"
              payload: { decision: "APPROVE" }
              as: PricingApprover
              as_user_id: "pa-001"
            - call: "POST /distribution-channels"
              payload: { channel_code: "GDS_PREMIUM", channel_type: "GDS", commission_bp: 1200, markup_bp: 2000, max_ancillary_price_cents: 20000, supported_categories: ["BAGGAGE", "SEAT", "CHANGE", "BOARDING", "ONBOARD"], parity_required: true }
              as: DistributionManager
              as_user_id: "dm-001"
              captures: { ch_gdsp_id: $.data.id }
            - call: "POST /flights"
              payload: { flight_no: "AA400", origin: "JFK", destination: "LAX", scheduled_departure_utc: "2026-09-15T14:00:00Z", cabin_seat_total: 180 }
              as: OperationsController
              as_user_id: "oc-001"
              captures: { fl_id: $.data.id }
            - call: "POST /flights/${fl_id}/demand-snapshot"
              payload: { booked_load_factor_pct: 100, demand_index_bp: 5000 }
              as: OperationsController
              as_user_id: "oc-001"
            - call: "POST /bookings"
              payload: { record_locator: "CLAMP1", flight_id: "${fl_id}", fare_family_id: "${f_lite_id}", distribution_channel_id: "${ch_gdsp_id}", passenger_name: "Clamp Pax" }
              as: ChannelPartner
              as_user_id: "${ch_gdsp_id}"
              captures: { b_id: $.data.id }
            - call: "POST /flights/${fl_id}/phase-advance"
              payload: { target_phase: "CHECKIN_OPEN" }
              as: OperationsController
              as_user_id: "oc-001"
            - call: "POST /flights/${fl_id}/phase-advance"
              payload: { target_phase: "BOARDING" }
              as: OperationsController
              as_user_id: "oc-001"
          trigger:
            - call: "POST /bookings/${b_id}/offer-sessions"
              payload: { touchpoint: "INFLIGHT", requested_product_ids: ["${p_change_id}"] }
              as: ChannelPartner
              as_user_id: "${ch_gdsp_id}"
              captures: { clamp_offer_ids: $.data.presented_offer_ids }
          assert:
            - "the session returns 201 with candidate_count == 1 and exactly one presented offer id"
            - "the presented offer has pricing_variant == WTP_ELASTIC and wtp_score_bp == 12030"
            - "the presented offer has offered_price_cents == 13500, not 13535 and not 13534"
            - "the presented offer has expected_value_cents == 16241, i.e. computed from the CLAMPED 13500 (16242 would prove it used the pre-clamp 13535)"
            - "the presented offer has touchpoint == INFLIGHT and sequence_rank == 1"

      - name: bundle_valuation_round_per_attribute_then_sum
        mode: b
        grounds:
          - calculations.fare_family_bundle_valuation
          - calculations.fare_family_bundle_valuation.precision
          - entities.FamilyAttribute.fields.attr_value_cents
          - entities.FareFamily.fields.unbundled_value_cents
        distinguishing_aspect: |
          Two PREMIUM attributes each land exactly on a half cent: 1250 * 1.15 = 1437.5 and
          750 * 1.15 = 862.5. Rounding once per attribute then summing gives 1438 + 863 = 2301;
          summing first and rounding once gives 2300. The 1-cent divergence then propagates to
          a_la_carte_total_cents (26301 vs 26300) and to bundle_discount_bp (495 vs 494), so a
          single family exposes the whole rounding-order contract.
        test_recipe:
          setup:
            - "clock at 2026-08-10T09:00:00Z; PRIORITY_BOARDING (1250) and WIFI_FULL_FLIGHT (750) are ACTIVE"
            - "PREMIUM family PREM_ROUND (base_fare 24000, bundle 25000) is in DRAFT with PRIORITY_BOARDING already attached"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T09:00:00Z" }
              as: MerchandisingAnalyst
              as_user_id: "ma-001"
            - call: "POST /ancillary-products"
