# =============================================================================
# §1.8 Scaffold Difficulty Design — task_2227_building_code_adoption_amendment
#
# Test Targeting Index: the nine §0.5 Difficulty Rules cross-referenced against
# this scaffold's §1.1–§1.7. 22 instances across 9 rule_ids.
#
# Every instance drives the system from empty-DB with §1.5 calls only. The
# canonical golden chain (clock 2026-08-01 -> ENERGY committee seated ->
# proposal screened -> both analyses accepted -> comment window opened and
# closed -> hearing agenda -> convene) is defined once as call-level YAML
# anchors inside dual_variant_calc/amendment_bcr_preliminary_vs_final_diverge
# and aliased by later instances; aliases expand to byte-identical call objects,
# so every ${var} stays bound to the same producing call.
# =============================================================================

scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: amendment_bcr_preliminary_vs_final_diverge
        grounds:
          - calculations.amendment_benefit_cost_ratio
          - calculations.statewide_incremental_cost_rollup
          - entities.AmendmentProposal.fields.preliminary_benefit_cost_ratio
          - entities.AmendmentProposal.fields.final_benefit_cost_ratio
          - entities.VoteRecord.fields.final_benefit_cost_ratio_at_vote
          - state_machines.AmendmentProposal.PENDING_to_PARTIAL
          - state_machines.AmendmentProposal.COMMENT_CLOSED_to_APPROVED
          - validations[priority=18]
        distinguishing_aspect: |
          Entity domain = AmendmentProposal cost-effectiveness: the PRELIMINARY variant
          (flat 15-year undiscounted horizon, frozen when the COST_BENEFIT analysis is
          accepted) yields 1.52 while the FINAL variant (3% annuity over the analyst's
          12-year measure life, recomputed at the vote) yields 1.01 on byte-identical
          stored data, and only FINAL is compared against BCR_FLOOR.
        test_recipe:
          setup:
            - "Logical clock advanced through 2026-08-01 -> 2026-08-15 -> 2026-09-09 -> 2026-10-05T14:00Z."
            - "CodeCycle 2027 / IBC-2027 in status DELIBERATION with one SEATED ENERGY DisciplineCommittee of 6 voting seats (quorum_required 4)."
            - "One AmendmentProposal (MORE_STRINGENT, section C402.1.4) with review_status COMMENT_CLOSED, analysis_status COMPLETE, statewide_incremental_cost_cents 143002800, preliminary_benefit_cost_ratio 1.52, base_docket_score 74.45."
            - "One CONVENED Hearing whose agenda holds that proposal."
          setup_api_calls:
            - &c_clock0801
              call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: CouncilAdmin
              as_user_id: "admin-ops-1"
            - &c_cycle
              call: "POST /code-cycles"
              payload: { cycle_year: 2027, model_code_edition: "IBC-2027", intake_opens_at: "2026-08-01T00:00:00Z", intake_closes_at: "2026-10-01T00:00:00Z" }
              as: CouncilAdmin
              as_user_id: "admin-ops-1"
              captures: { cycle_id: $.data.id }
            - &c_cte
              call: "POST /code-cycles/${cycle_id}/discipline-committees"
              payload: { discipline: "ENERGY", voting_seat_count: 6 }
              as: CouncilAdmin
              as_user_id: "admin-ops-1"
              captures: { cte_id: $.data.id }
            - &c_m_chair
              call: "POST /discipline-committees/${cte_id}/members"
              payload: { full_name: "Dana Reyes", sector: "INDUSTRY", voting_seat: true, is_chair: true }
              as: CouncilAdmin
              as_user_id: "admin-ops-1"
              captures: { m_chair_id: $.data.id }
            - &c_m_fire
              call: "POST /discipline-committees/${cte_id}/members"
              payload: { full_name: "Sam Ito", sector: "FIRE_SERVICE", voting_seat: true, is_chair: false }
              as: CouncilAdmin
              as_user_id: "admin-ops-1"
              captures: { m_fire_id: $.data.id }
            - &c_m_loc
              call: "POST /discipline-committees/${cte_id}/members"
              payload: { full_name: "Lee Park", sector: "LOCAL_JURISDICTION", voting_seat: true, is_chair: false }
              as: CouncilAdmin
              as_user_id: "admin-ops-1"
              captures: { m_loc_id: $.data.id }
            - &c_m_des
              call: "POST /discipline-committees/${cte_id}/members"
              payload: { full_name: "Rae Oyelaran", sector: "DESIGN_PROFESSIONAL", voting_seat: true, is_chair: false }
              as: CouncilAdmin
              as_user_id: "admin-ops-1"
              captures: { m_des_id: $.data.id }
            - &c_m_ind2
              call: "POST /discipline-committees/${cte_id}/members"
              payload: { full_name: "Kim Alvarez", sector: "INDUSTRY", voting_seat: true, is_chair: false }
              as: CouncilAdmin
              as_user_id: "admin-ops-1"
              captures: { m_ind2_id: $.data.id }
            - &c_m_pub
              call: "POST /discipline-committees/${cte_id}/members"
              payload: { full_name: "Toni Blake", sector: "PUBLIC", voting_seat: true, is_chair: false }
              as: CouncilAdmin
              as_user_id: "admin-ops-1"
              captures: { m_pub_id: $.data.id }
            - &c_intake_open
              call: "POST /code-cycles/${cycle_id}/status"
              payload: { to_status: "INTAKE_OPEN" }
              as: CouncilAdmin
              as_user_id: "admin-ops-1"
            - &c_propA
              call: "POST /amendment-proposals"
              payload: { code_cycle_id: "${cycle_id}", code_section: "C402.1.4", discipline: "ENERGY", title: "Envelope U-factor tightening", proposed_text: "Reduce maximum assembly U-factor for climate zone 5 walls.", stringency_direction: "MORE_STRINGENT", proposer_sector: "INDUSTRY" }
              as: TechnicalStaff
              as_user_id: "staff-intake-1"
              captures: { prop_id: $.data.id, prop_v_create: $.data.version }
            - &c_intake_closed
              call: "POST /code-cycles/${cycle_id}/status"
              payload: { to_status: "INTAKE_CLOSED" }
              as: CouncilAdmin
              as_user_id: "admin-ops-1"
            - &c_screenA
              call: "POST /amendment-proposals/${prop_id}/screening"
              payload: { decision: "ACCEPT_FOR_ANALYSIS" }
              as: TechnicalStaff
              as_user_id: "staff-intake-1"
              captures: { prop_v_screened: $.data.version }
            - &c_cbA
              call: "POST /amendment-proposals/${prop_id}/impact-analyses"
              payload: { expected_proposal_version: "${prop_v_screened}", analysis_type: "COST_BENEFIT", incremental_cost_by_occupancy: { R3: 42375, R2: 61250, B: 118900, A2: 97150 }, affected_permit_count: 2410, annual_cost_savings_cents: 14500000, measure_life_years: 12 }
              as: TechnicalStaff
              as_user_id: "staff-analyst-1"
              captures: { cb_id: $.data.id }
            - &c_cbA_accept
              call: "POST /impact-analyses/${cb_id}/review"
              payload: { decision: "ACCEPT" }
              as: CouncilAdmin
              as_user_id: "admin-reviewer-1"
            - &c_readA
              call: "GET /amendment-proposals/${prop_id}"
              payload: {}
              as: CouncilAdmin
              as_user_id: "admin-ops-1"
              captures: { prop_v_partial: $.data.version }
            - &c_eiA
              call: "POST /amendment-proposals/${prop_id}/impact-analyses"
              payload: { expected_proposal_version: "${prop_v_partial}", analysis_type: "ENERGY_IMPACT", annual_energy_savings_kwh: 4250000, energy_delta_pct: -6.5 }
              as: TechnicalStaff
              as_user_id: "staff-analyst-1"
              captures: { ei_id: $.data.id }
            - &c_eiA_accept
              call: "POST /impact-analyses/${ei_id}/review"
              payload: { decision: "ACCEPT" }
              as: CouncilAdmin
              as_user_id: "admin-reviewer-1"
            - &c_delib
              call: "POST /code-cycles/${cycle_id}/status"
              payload: { to_status: "DELIBERATION" }
              as: CouncilAdmin
              as_user_id: "admin-ops-1"
            - &c_windowA_open
              call: "POST /amendment-proposals/${prop_id}/comment-window"
              payload: { action: "OPEN", opens_at: "2026-08-10T00:00:00Z", closes_at: "2026-09-09T00:00:00Z" }
              as: CouncilAdmin
              as_user_id: "admin-ops-1"
            - &c_clock0815
              call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-15T00:00:00Z" }
              as: CouncilAdmin
              as_user_id: "admin-ops-1"
            - &c_cmt_s1
              call: "POST /amendment-proposals/${prop_id}/comments"
              payload: { commenter_sector: "INDUSTRY", position: "SUPPORT", body: "Aligns with our product roadmap." }
              as: Petitioner
              as_user_id: "petitioner-1"
            - &c_cmt_s2
              call: "POST /amendment-proposals/${prop_id}/comments"
              payload: { commenter_sector: "DESIGN_PROFESSIONAL", position: "SUPPORT", body: "Modelling shows the assembly is buildable." }
              as: Petitioner
              as_user_id: "petitioner-2"
            - &c_cmt_s3
              call: "POST /amendment-proposals/${prop_id}/comments"
              payload: { commenter_sector: "LOCAL_JURISDICTION", position: "SUPPORT", body: "Plan review can absorb this change." }
              as: Petitioner
              as_user_id: "petitioner-3"
            - &c_cmt_o1
              call: "POST /amendment-proposals/${prop_id}/comments"
              payload: { commenter_sector: "FIRE_SERVICE", position: "OPPOSE", body: "Concerned about interaction with sprinkler layout." }
              as: Petitioner
              as_user_id: "petitioner-4"
            - &c_clock0909
              call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-09T00:00:00Z" }
              as: CouncilAdmin
              as_user_id: "admin-ops-1"
            - &c_windowA_close
              call: "POST /amendment-proposals/${prop_id}/comment-window"
              payload: { action: "CLOSE" }
              as: CouncilAdmin
              as_user_id: "admin-ops-1"
            - &c_hearA
              call: "POST /hearings"
              payload: { committee_id: "${cte_id}", scheduled_start: "2026-10-05T14:00:00Z", scheduled_end: "2026-10-05T17:00:00Z" }
              as: CouncilAdmin
              as_user_id: "admin-ops-1"
              captures: { hear_id: $.data.id }
            - &c_agendaA
              call: "POST /hearings/${hear_id}/agenda"
              payload: { mode: "AUTO_FILL" }
              as: CouncilAdmin
              as_user_id: "admin-ops-1"
            - &c_clock1005
              call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-10-05T14:00:00Z" }
              as: CouncilAdmin
              as_user_id: "admin-ops-1"
            - &c_conveneA
              call: "POST /hearings/${hear_id}/convene"
              payload: { present_member_ids: ["${m_chair_id}", "${m_fire_id}", "${m_loc_id}", "${m_des_id}", "${m_ind2_id}", "${m_pub_id}"] }
              as: CouncilChair
              as_user_id: "${m_chair_id}"
          trigger:
            - &c_voteA
              call: "POST /hearings/${hear_id}/votes"
              payload: { proposal_id: "${prop_id}", ballots: [{ member_id: "${m_chair_id}", ballot: "YES" }, { member_id: "${m_ind2_id}", ballot: "YES" }, { member_id: "${m_loc_id}", ballot: "YES" }, { member_id: "${m_des_id}", ballot: "YES" }, { member_id: "${m_fire_id}", ballot: "NO" }, { member_id: "${m_pub_id}", ballot: "NO" }] }
              as: CouncilChair
              as_user_id: "${m_chair_id}"
              captures: { vote_id: $.data.id }
          assert:
            - "AmendmentProposal.${prop_id}.preliminary_benefit_cost_ratio == 1.52"
            - "AmendmentProposal.${prop_id}.final_benefit_cost_ratio == 1.01"
            - "AmendmentProposal.${prop_id}.preliminary_benefit_cost_ratio - AmendmentProposal.${prop_id}.final_benefit_cost_ratio == 0.51"
            - "VoteRecord.${vote_id}.final_benefit_cost_ratio_at_vote == 1.01"
            - "VoteRecord.${vote_id}.outcome == APPROVED"
            - "VoteRecord.${vote_id}.outcome_reason == MAJORITY_APPROVED"
            - "AmendmentProposal.${prop_id}.review_status == APPROVED"
            - "AmendmentProposal.${prop_id}.statewide_incremental_cost_cents == 143002800"

      - name: jurisdiction_training_compliance_enrollment_vs_attendance_diverge
        grounds:
          - calculations.jurisdiction_training_compliance
          - entities.Jurisdiction.fields.compliance_pct_enrollment_basis
          - entities.Jurisdiction.fields.compliance_pct_attendance_basis
          - entities.Jurisdiction.fields.enforcement_readiness
          - state_machines.TrainingSession.ENROLLMENT_CLOSED_to_DELIVERED
          - state_machines.TrainingEnrollment.ENROLLED_to_NO_SHOW
        distinguishing_aspect: |
          Entity domain = Jurisdiction training rollout (not AmendmentProposal economics):
          over one identical enrollment set of 5 officials where 4 attended and 1 no-showed,
          ENROLLMENT_BASIS reads 100.00 while ATTENDANCE_BASIS reads 80.00, and only
          ATTENDANCE_BASIS feeds enforcement_readiness.
        test_recipe:
          setup:
            - "The golden chain through the APPROVED vote, then CodeCycle in RULEMAKING with a PUBLISHED AdoptionRule (published_at 2026-10-05T14:00Z, effective_date 2027-02-02T00:00:00Z)."
            - "Jurisdiction Riverbend (population 1200000, official_headcount 5, host_seat_capacity 60) and Jurisdiction Harborview (population 300000, official_headcount 4)."
            - "One TrainingSession hosted by Riverbend, seat_capacity 60, 2027-01-10T09:00Z-17:00Z, status ENROLLMENT_CLOSED with 5 Riverbend BUILDING_OFFICIAL enrollments."
            - "Logical clock at 2027-01-10T17:00Z (session ends_at reached)."
          setup_api_calls:
            - *c_clock0801
            - *c_cycle
            - *c_cte
            - *c_m_chair
            - *c_m_fire
            - *c_m_loc
            - *c_m_des
            - *c_m_ind2
            - *c_m_pub
            - *c_intake_open
            - *c_propA
            - *c_intake_closed
            - *c_screenA
            - *c_cbA
            - *c_cbA_accept
            - *c_readA
            - *c_eiA
            - *c_eiA_accept
            - *c_delib
            - *c_windowA_open
            - *c_clock0815
            - *c_cmt_s1
            - *c_cmt_s2
            - *c_cmt_s3
            - *c_cmt_o1
            - *c_clock0909
            - *c_windowA_close
            - *c_hearA
            - *c_agendaA
            - *c_clock1005
            - *c_conveneA
            - *c_voteA
            - &c_rulemaking
              call: "POST /code-cycles/${cycle_id}/status"
              payload: { to_status: "RULEMAKING" }
              as: CouncilAdmin
              as_user_id: "admin-ops-1"
            - &c_ruleA
              call: "POST /adoption-rules"
              payload: { code_cycle_id: "${cycle_id}", title: "2027 State Code Adoption Order" }
              as: CouncilAdmin
              as_user_id: "admin-rule-1"
              captures: { rule_id: $.data.id }
            - &c_ruleA_filed
              call: "POST /adoption-rules/${rule_id}/status"
              payload: { to_status: "FILED" }
              as: CouncilAdmin
              as_user_id: "admin-filer-1"
            - &c_ruleA_published
              call: "POST /adoption-rules/${rule_id}/status"
              payload: { to_status: "PUBLISHED" }
              as: CouncilAdmin
              as_user_id: "admin-publisher-1"
            - &c_j1
              call: "POST /jurisdictions"
              payload: { name: "Riverbend", population: 1200000, local_authority_level: "FULL", host_seat_capacity: 60, official_headcount: 5 }
              as: CouncilAdmin
              as_user_id: "admin-ops-1"
              captures: { j1_id: $.data.id }
            - &c_j2
              call: "POST /jurisdictions"
              payload: { name: "Harborview", population: 300000, local_authority_level: "LIMITED", host_seat_capacity: 40, official_headcount: 4 }
              as: CouncilAdmin
              as_user_id: "admin-ops-1"
              captures: { j2_id: $.data.id }
            - &c_sessA
              call: "POST /training-sessions"
              payload: { adoption_rule_id: "${rule_id}", host_jurisdiction_id: "${j1_id}", discipline: "ENERGY", audience: "BUILDING_OFFICIAL", seat_capacity: 60, starts_at: "2027-01-10T09:00:00Z", ends_at: "2027-01-10T17:00:00Z" }
              as: CouncilAdmin
              as_user_id: "admin-ops-1"
              captures: { sess_id: $.data.id }
            - &c_sessA_open
              call: "POST /training-sessions/${sess_id}/status"
              payload: { to_status: "ENROLLMENT_OPEN" }
              as: CouncilAdmin
              as_user_id: "admin-ops-1"
            - &c_enr_e1
              call: "POST /training-sessions/${sess_id}/enrollments"
              payload: { jurisdiction_id: "${j1_id}", attendee_name: "Riverbend Official 1", attendee_role: "BUILDING_OFFICIAL" }
              as: CouncilAdmin
              as_user_id: "admin-ops-1"
              captures: { e1_id: $.data.id }
            - &c_enr_e2
              call: "POST /training-sessions/${sess_id}/enrollments"
              payload: { jurisdiction_id: "${j1_id}", attendee_name: "Riverbend Official 2", attendee_role: "BUILDING_OFFICIAL" }
              as: CouncilAdmin
              as_user_id: "admin-ops-1"
              captures: { e2_id: $.data.id }
            - &c_enr_e3
              call: "POST /training-sessions/${sess_id}/enrollments"
              payload: { jurisdiction_id: "${j1_id}", attendee_name: "Riverbend Official 3", attendee_role: "BUILDING_OFFICIAL" }
              as: CouncilAdmin
              as_user_id: "admin-ops-1"
              captures: { e3_id: $.data.id }
            - &c_enr_e4
              call: "POST /training-sessions/${sess_id}/enrollments"
              payload: { jurisdiction_id: "${j1_id}", attendee_name: "Riverbend Official 4", attendee_role: "BUILDING_OFFICIAL" }
              as: CouncilAdmin
              as_user_id: "admin-ops-1"
              captures: { e4_id: $.data.id }
            - &c_enr_e5
              call: "POST /training-sessions/${sess_id}/enrollments"
              payload: { jurisdiction_id: "${j1_id}", attendee_name: "Riverbend Official 5", attendee_role: "BUILDING_OFFICIAL" }
              as: CouncilAdmin
              as_user_id: "admin-ops-1"
              captures: { e5_id: $.data.id }
            - &c_sessA_closed
              call: "POST /training-sessions/${sess_id}/status"
              payload: { to_status: "ENROLLMENT_CLOSED" }
              as: CouncilAdmin
              as_user_id: "admin-ops-1"
            - &c_clock0110
              call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2027-01-10T17:00:00Z" }
              as: CouncilAdmin
              as_user_id: "admin-ops-1"
          trigger:
            - &c_attend_j1only
              call: "POST /training-sessions/${sess_id}/attendance"
              payload: { records: [{ enrollment_id: "${e1_id}", outcome: "ATTENDED" }, { enrollment_id: "${e2_id}", outcome: "ATTENDED" }, { enrollment_id: "${e3_id}", outcome: "ATTENDED" }, { enrollment_id: "${e4_id}", outcome: "ATTENDED" }, { enrollment_id: "${e5_id}", outcome: "NO_SHOW" }] }
              as: CouncilAdmin
              as_user_id: "admin-ops-1"
          assert:
            - "Jurisdiction.${j1_id}.compliance_pct_enrollment_basis == 100.00"
            - "Jurisdiction.${j1_id}.compliance_pct_attendance_basis == 80.00"
            - "Jurisdiction.${j1_id}.enforcement_readiness == READY"
            - "TrainingSession.${sess_id}.status == DELIVERED"
            - "TrainingSession.${sess_id}.attended_count == 4"
            - "TrainingSession.${sess_id}.no_show_count == 1"
            - "TrainingSession.${sess_id}.enrolled_count == 0"
            - "TrainingSession.${sess_id}.seats_available == 55"
            - "TrainingEnrollment.${e5_id}.status == NO_SHOW"
            - "Jurisdiction.${j2_id}.compliance_pct_attendance_basis == 0.00"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: statewide_cost_rollup_permit_level_rounding_order_decides_result
        grounds:
          - calculations.statewide_incremental_cost_rollup
          - entities.ImpactAnalysis.fields.incremental_cost_by_occupancy
          - entities.ImpactAnalysis.fields.affected_permit_count
          - entities.AmendmentProposal.fields.statewide_incremental_cost_cents
          - state_machines.ImpactAnalysis.SUBMITTED_to_ACCEPTED
        distinguishing_aspect: |
          Mode (b) nested rounding where order matters: the annual permit population is
          rounded to WHOLE permits per occupancy class BEFORE multiplication by that
          class's exact per-permit cents, so the certified figure is 143002800; keeping
          fractional permits (or rounding the money instead) yields 143003375, a
          575-cent divergence from the same four inputs.
        test_recipe:
          setup:
            - "CodeCycle 2027 in INTAKE_CLOSED with a SEATED ENERGY committee and one SCREENED AmendmentProposal (analysis_status PENDING)."
            - "One SUBMITTED COST_BENEFIT ImpactAnalysis with incremental_cost_by_occupancy {R3: 42375, R2: 61250, B: 118900, A2: 97150} and affected_permit_count 2410."
            - "Logical clock at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - *c_clock0801
            - *c_cycle
            - *c_cte
            - *c_m_chair
            - *c_m_fire
            - *c_m_loc
            - *c_m_des
            - *c_m_ind2
            - *c_m_pub
            - *c_intake_open
            - *c_propA
            - *c_intake_closed
            - *c_screenA
            - *c_cbA
          trigger:
            - *c_cbA_accept
          assert:
            - "ImpactAnalysis.${cb_id}.status == ACCEPTED"
            - "ImpactAnalysis.${cb_id}.statewide_incremental_cost_cents == 143002800"
            - "AmendmentProposal.${prop_id}.statewide_incremental_cost_cents == 143002800"
            - "AmendmentProposal.${prop_id}.statewide_incremental_cost_cents != 143003375"
            - "AmendmentProposal.${prop_id}.affected_permit_count == 2410"
            - "AmendmentProposal.${prop_id}.preliminary_benefit_cost_ratio == 1.52"
            - "AmendmentProposal.${prop_id}.analysis_status == PARTIAL"
            - "AmendmentProposal.${prop_id}.review_status == SCREENED"

      - name: vote_tally_two_denominators_with_abstention
        grounds:
          - calculations.vote_tally_and_outcome
          - entities.VoteRecord.fields.abstain_count
          - entities.VoteRecord.fields.absent_count
          - entities.DisciplineCommittee.fields.active_voting_member_count
          - entities.DisciplineCommittee.fields.quorum_required
          - validations[priority=14]
        distinguishing_aspect: |
          Mode (a) non-linear interaction of three or more inputs: seat count, abstention
          count and stringency_direction feed TWO different denominators in one pass —
          quorum uses all 6 seats (ceil(6*2/3) = 4) while the 60% supermajority uses only
          the 5 decisive ballots (ceil(0.60*5) = 3) — so 3 YES / 2 NO / 1 ABSTAIN is
          APPROVED even though 3 YES against all 6 seats would fail.
        test_recipe:
          setup:
            - "The golden chain through convene: CONVENED Hearing, 6 active voting seats, quorum_required 4, one COMMENT_CLOSED proposal on the agenda with final_benefit_cost_ratio 1.01 at vote time."
            - "Logical clock at 2026-10-05T14:00:00Z."
          setup_api_calls:
            - *c_clock0801
            - *c_cycle
            - *c_cte
            - *c_m_chair
            - *c_m_fire
            - *c_m_loc
            - *c_m_des
            - *c_m_ind2
            - *c_m_pub
            - *c_intake_open
            - *c_propA
            - *c_intake_closed
            - *c_screenA
            - *c_cbA
