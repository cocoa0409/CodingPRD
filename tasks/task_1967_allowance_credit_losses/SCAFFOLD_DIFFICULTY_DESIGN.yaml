  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: submit_requires_all_evaluations_reviewed
        grounds:
          - state_machines.ModelRun.EXECUTED_to_UNDER_REVIEW
        distinguishing_aspect: |
          Entity pair ModelRun x IndividualEvaluation: submit_for_review is rejected
          with ERR_EVALUATIONS_OUTSTANDING while the run's evaluation is DRAFT/SUBMITTED,
          and succeeds once that evaluation reaches REVIEWED.
        test_recipe:
          setup:
            - "Run 2026-Q1 EXECUTED with one IndividualEvaluation in DRAFT (SUBSTANDARD loan)"
          setup_api_calls:
            - call: "POST /cecl/loss-models"
              payload: { name: "CECL-LR", method: LOSS_RATE, forecast_period_quarters: 2, reversion_method: IMMEDIATE, reversion_period_quarters: 0, historical_lookback_quarters: 8 }
              as: ModelValidator
              captures: { m_id: $.data.id }
            - call: "POST /cecl/loss-models/${m_id}/activate"
              payload: {}
              as: ModelValidator
            - call: "POST /cecl/portfolio-segments"
              payload: { segment_code: "SB-SUB-2023", name: "SmallBiz Subprime", product_type: SMALL_BUSINESS, risk_rating_band: SUBPRIME, vintage_year: 2023 }
              as: CreditAnalyst
              captures: { seg_id: $.data.id }
            - call: "POST /cecl/loans"
              payload: { segment_id: "${seg_id}", loan_number: "LN-X1", amortized_cost_cents: 500000, risk_rating: SUBSTANDARD, collateral_value_cents: 460000 }
              as: CreditAnalyst
            - call: "POST /cecl/economic-scenarios"
              payload: { name: "Baseline", scenario_type: BASELINE, unemployment_rate_bps: 500, gdp_growth_bps: 200, effective_from_period: "2026-Q1", effective_to_period: "2027-Q1" }
              as: ModelValidator
              captures: { sc_base: $.data.id }
            - call: "POST /cecl/model-runs"
              payload: { as_of_period: "2026-Q1", loss_model_id: "${m_id}", scenario_weights: [ { scenario_id: "${sc_base}", weight_bps: 10000 } ] }
              as: CreditAnalyst
              captures: { run_id: $.data.id }
            - call: "POST /cecl/model-runs/${run_id}/execute"
              payload: {}
              as: CreditAnalyst
            - call: "GET /cecl/individual-evaluations"
              payload: { run_id: "${run_id}" }
              as: CreditAnalyst
              captures: { ie_id: "$.data[0].id", ie_v: "$.data[0].version" }
          trigger:
            - call: "POST /cecl/model-runs/${run_id}/submit_for_review"
              payload: {}
              as: CreditAnalyst
              captures: { err: $.data.error_id }
            - call: "PATCH /cecl/individual-evaluations/${ie_id}"
              payload: { expected_evaluation_version: "${ie_v}", analysis_notes: "Collateral-based reserve; guarantor support excluded." }
              as: CreditAnalyst
            - call: "POST /cecl/individual-evaluations/${ie_id}/submit"
              payload: {}
              as: CreditAnalyst
            - call: "POST /cecl/individual-evaluations/${ie_id}/review"
              payload: {}
              as: ChiefCreditOfficer
            - call: "POST /cecl/model-runs/${run_id}/submit_for_review"
              payload: {}
              as: CreditAnalyst
              captures: { st: $.data.status }
          assert:
            - "First submit_for_review -> error_id == ERR_EVALUATIONS_OUTSTANDING (${err})"
            - "After evaluation REVIEWED: submit_for_review succeeds, status == UNDER_REVIEW (${st})"

      - name: loan_create_requires_segment_open
        grounds:
          - state_machines.PortfolioSegment.OPEN_to_WATCH
          - validations[priority=9]
        distinguishing_aspect: |
          Entity pair Loan x PortfolioSegment (different pair from
          ModelRun x IndividualEvaluation): creating a loan in a WATCH segment is
          rejected with ERR_SEGMENT_NOT_OPEN; after a full recovery auto-clears the
          segment to OPEN, the same create succeeds.
        test_recipe:
          setup:
            - "Segment with two PASS loans of 100000 (origination_total 200000); loan 1 fully charged off -> rate 5000 bps -> WATCH"
          setup_api_calls:
            - call: "POST /cecl/portfolio-segments"
              payload: { segment_code: "AUTO-NP-2023", name: "Auto NP 2023", product_type: AUTO, risk_rating_band: NEAR_PRIME, vintage_year: 2023 }
              as: CreditAnalyst
              captures: { seg_id: $.data.id }
            - call: "POST /cecl/loans"
              payload: { segment_id: "${seg_id}", loan_number: "LN-W1", amortized_cost_cents: 100000, risk_rating: PASS }
              as: CreditAnalyst
              captures: { loan_1: $.data.id }
            - call: "POST /cecl/loans"
              payload: { segment_id: "${seg_id}", loan_number: "LN-W2", amortized_cost_cents: 100000, risk_rating: PASS }
              as: CreditAnalyst
            - call: "POST /cecl/loans/${loan_1}/charge_off"
              payload: { charge_off_amount_cents: 100000, charge_off_period: "2026-Q1" }
              as: CreditAnalyst
          trigger:
            - call: "POST /cecl/loans"
              payload: { segment_id: "${seg_id}", loan_number: "LN-W3", amortized_cost_cents: 5000, risk_rating: PASS }
              as: CreditAnalyst
              captures: { err: $.data.error_id }
            - call: "POST /cecl/loans/${loan_1}/record_recovery"
              payload: { recovery_amount_cents: 100000, recovery_period: "2026-Q2" }
              as: CreditAnalyst
            - call: "POST /cecl/loans"
              payload: { segment_id: "${seg_id}", loan_number: "LN-W3", amortized_cost_cents: 5000, risk_rating: PASS }
              as: CreditAnalyst
              captures: { st: $.data.status }
          assert:
            - "Loan create in WATCH segment -> error_id == ERR_SEGMENT_NOT_OPEN (${err})"
            - "Recovery of 100000 -> net charge-offs 0 -> rate 0 <= 200 -> segment returns to OPEN automatically"
            - "Second loan create succeeds with status == ACTIVE (${st})"

  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: factor_closed_interval_adjacency
        grounds:
          - validations[priority=10]
          - entities.QualitativeFactor.fields.effective_to_period
        distinguishing_aspect: |
          CLOSED-interval semantics on QualitativeFactor: windows [2026-Q1, 2026-Q2] and
          [2026-Q3, 2026-Q4] for the same (segment, factor_code) are adjacent
          (to + 1 == from) and allowed; [2026-Q2, 2026-Q3] overlaps at Q2 and is
          rejected with ERR_FACTOR_WINDOW_OVERLAP.
        test_recipe:
          setup:
            - "Segment exists; one DRAFT factor CONCENTRATION_RISK covering closed window 2026-Q1..2026-Q2"
          setup_api_calls:
            - call: "POST /cecl/portfolio-segments"
              payload: { segment_code: "CC-PRIME-2024", name: "Prime Cards", product_type: CREDIT_CARD, risk_rating_band: PRIME, vintage_year: 2024 }
              as: CreditAnalyst
              captures: { seg_id: $.data.id }
            - call: "POST /cecl/qualitative-factors"
              payload: { segment_id: "${seg_id}", factor_code: CONCENTRATION_RISK, adjustment_bps: 25, effective_from_period: "2026-Q1", effective_to_period: "2026-Q2" }
              as: CreditAnalyst
              captures: { f1: $.data.id }
          trigger:
            - call: "POST /cecl/qualitative-factors"
              payload: { segment_id: "${seg_id}", factor_code: CONCENTRATION_RISK, adjustment_bps: 30, effective_from_period: "2026-Q3", effective_to_period: "2026-Q4" }
              as: CreditAnalyst
              captures: { f2: $.data.id }
            - call: "POST /cecl/qualitative-factors"
              payload: { segment_id: "${seg_id}", factor_code: CONCENTRATION_RISK, adjustment_bps: 10, effective_from_period: "2026-Q2", effective_to_period: "2026-Q3" }
              as: CreditAnalyst
              captures: { err: $.data.error_id }
          assert:
            - "Adjacent window (from == existing.to + 1 quarter) is ACCEPTED: factor ${f2} created"
            - "Overlapping window sharing quarter 2026-Q2 -> error_id == ERR_FACTOR_WINDOW_OVERLAP (${err})"

      - name: scenario_half_open_touching
        grounds:
          - validations[priority=10]
          - entities.EconomicScenario.fields.effective_to_period
        distinguishing_aspect: |
          HALF-OPEN interval semantics on EconomicScenario (different entity and
          different adjacency geometry from the factor case): an ACTIVE BASELINE window
          [2026-Q1, 2026-Q3) covers Q1 and Q2 only, so a new BASELINE window
          [2026-Q3, 2027-Q1) touching at the exclusive end is allowed, while
          [2026-Q2, 2026-Q4) is rejected with ERR_SCENARIO_WINDOW_OVERLAP.
        test_recipe:
          setup:
            - "One ACTIVE BASELINE scenario with half-open window 2026-Q1 to 2026-Q3"
          setup_api_calls:
            - call: "POST /cecl/economic-scenarios"
              payload: { name: "Baseline H1", scenario_type: BASELINE, unemployment_rate_bps: 500, gdp_growth_bps: 200, effective_from_period: "2026-Q1", effective_to_period: "2026-Q3" }
              as: ModelValidator
              captures: { s1: $.data.id }
          trigger:
            - call: "POST /cecl/economic-scenarios"
              payload: { name: "Baseline H2", scenario_type: BASELINE, unemployment_rate_bps: 520, gdp_growth_bps: 190, effective_from_period: "2026-Q3", effective_to_period: "2027-Q1" }
              as: ModelValidator
              captures: { s2: $.data.id }
            - call: "POST /cecl/economic-scenarios"
              payload: { name: "Baseline Overlap", scenario_type: BASELINE, unemployment_rate_bps: 540, gdp_growth_bps: 180, effective_from_period: "2026-Q2", effective_to_period: "2026-Q4" }
              as: ModelValidator
              captures: { err: $.data.error_id }
          assert:
            - "Touching window (new.from == existing.to under half-open semantics) is ACCEPTED: scenario ${s2} created"
            - "Window starting inside covered quarter 2026-Q2 -> error_id == ERR_SCENARIO_WINDOW_OVERLAP (${err})"

  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: management_adjustment_net_zero_conserves_total
        grounds:
          - calculations.run_totals
          - calculations.management_adjustment_cap
          - state_machines.ManagementAdjustment.PENDING_to_APPROVED
          - concurrency_rules[ma-create-stale-run]
        distinguishing_aspect: |
          Conserved quantity = ModelRun.total_allowance_cents (dollars): approving an
          adjustment of +5500 followed by its compensating adjustment of -5500 returns
          the total to exactly 55000, honoring the pinned invariant
          total == quantitative + qualitative + individual + SUM(APPROVED amounts).
          +5500 also exercises the cap boundary (cap == 5500, equality accepted).
        test_recipe:
          setup:
            - "Run 2026-Q1 EXECUTED with quantitative_reserve_cents == 55000 (weighted 60/40 run on 10000000 cents PRIME exposure); no factors, no evaluations"
          setup_api_calls:
            - call: "POST /cecl/loss-models"
              payload: { name: "CECL-LR", method: LOSS_RATE, forecast_period_quarters: 2, reversion_method: IMMEDIATE, reversion_period_quarters: 0, historical_lookback_quarters: 8 }
              as: ModelValidator
              captures: { m_id: $.data.id }
            - call: "POST /cecl/loss-models/${m_id}/activate"
              payload: {}
              as: ModelValidator
            - call: "POST /cecl/portfolio-segments"
              payload: { segment_code: "CC-PRIME-2024", name: "Prime Cards", product_type: CREDIT_CARD, risk_rating_band: PRIME, vintage_year: 2024 }
              as: CreditAnalyst
              captures: { seg_id: $.data.id }
            - call: "POST /cecl/loans"
              payload: { segment_id: "${seg_id}", loan_number: "LN-MA", amortized_cost_cents: 10000000, risk_rating: PASS }
              as: CreditAnalyst
            - call: "POST /cecl/economic-scenarios"
              payload: { name: "Baseline", scenario_type: BASELINE, unemployment_rate_bps: 500, gdp_growth_bps: 200, effective_from_period: "2026-Q1", effective_to_period: "2027-Q1" }
              as: ModelValidator
              captures: { sc_base: $.data.id }
            - call: "POST /cecl/economic-scenarios"
              payload: { name: "Adverse", scenario_type: ADVERSE, unemployment_rate_bps: 900, gdp_growth_bps: 0, effective_from_period: "2026-Q1", effective_to_period: "2027-Q1" }
              as: ModelValidator
              captures: { sc_adv: $.data.id }
            - call: "POST /cecl/model-runs"
              payload: { as_of_period: "2026-Q1", loss_model_id: "${m_id}", scenario_weights: [ { scenario_id: "${sc_base}", weight_bps: 6000 }, { scenario_id: "${sc_adv}", weight_bps: 4000 } ] }
              as: CreditAnalyst
              captures: { run_id: $.data.id }
            - call: "POST /cecl/model-runs/${run_id}/execute"
              payload: {}
              as: CreditAnalyst
              captures: { rv: $.data.version }
          trigger:
            - call: "POST /cecl/model-runs/${run_id}/management-adjustments"
              payload: { amount_cents: 5500, rationale: "Overlay for hurricane exposure in coastal counties", expected_model_run_version: "${rv}" }
              as: CreditAnalyst
              as_user_id: "analyst-1"
              captures: { ma1: $.data.id }
            - call: "POST /cecl/management-adjustments/${ma1}/approve"
              payload: {}
              as: ChiefCreditOfficer
              as_user_id: "cco-1"
            - call: "GET /cecl/model-runs/${run_id}"
              payload: {}
              as: CreditAnalyst
              captures: { total_mid: $.data.total_allowance_cents, rv2: $.data.version }
            - call: "POST /cecl/model-runs/${run_id}/management-adjustments"
              payload: { amount_cents: -5500, rationale: "Reverse hurricane overlay after exposure re-measurement", expected_model_run_version: "${rv2}" }
              as: CreditAnalyst
              as_user_id: "analyst-1"
              captures: { ma2: $.data.id }
            - call: "POST /cecl/management-adjustments/${ma2}/approve"
              payload: {}
              as: ChiefCreditOfficer
              as_user_id: "cco-1"
            - call: "GET /cecl/model-runs/${run_id}"
              payload: {}
              as: CreditAnalyst
          assert:
            - "After approving +5500: ModelRun.${run_id}.total_allowance_cents == 60500 (${total_mid}) and management_adjustment_cents == 5500"
            - "Cap boundary: 5500 == round_half_up(0.10 * 55000) is accepted (not rejected)"
            - "After approving the compensating -5500: total_allowance_cents == 55000 — the conserved quantity is restored exactly"
            - "Final management_adjustment_cents == 0 while quantitative_reserve_cents remains 55000"

      - name: evaluation_review_reopen_conserves_count
        grounds:
          - state_machines.IndividualEvaluation.SUBMITTED_to_REVIEWED
          - state_machines.IndividualEvaluation.REVIEWED_to_SUBMITTED
        distinguishing_aspect: |
          Conserved quantity = IndividualEvaluation cardinality per run (a count, not
          dollars): the review/reopen cycle moves one evaluation between SUBMITTED and
          REVIEWED but individual_evaluation_count stays 1 and
          draft+submitted+reviewed always sums to 1; reviewed_evaluation_count ends at 1.
        test_recipe:
          setup:
            - "Run 2026-Q1 EXECUTED with exactly one IndividualEvaluation (DRAFT)"
          setup_api_calls:
            - call: "POST /cecl/loss-models"
              payload: { name: "CECL-LR", method: LOSS_RATE, forecast_period_quarters: 2, reversion_method: IMMEDIATE, reversion_period_quarters: 0, historical_lookback_quarters: 8 }
              as: ModelValidator
              captures: { m_id: $.data.id }
            - call: "POST /cecl/loss-models/${m_id}/activate"
              payload: {}
              as: ModelValidator
            - call: "POST /cecl/portfolio-segments"
              payload: { segment_code: "SB-SUB-2023", name: "SmallBiz Subprime", product_type: SMALL_BUSINESS, risk_rating_band: SUBPRIME, vintage_year: 2023 }
              as: CreditAnalyst
              captures: { seg_id: $.data.id }
            - call: "POST /cecl/loans"
              payload: { segment_id: "${seg_id}", loan_number: "LN-EV", amortized_cost_cents: 500000, risk_rating: SUBSTANDARD, collateral_value_cents: 460000 }
              as: CreditAnalyst
            - call: "POST /cecl/economic-scenarios"
              payload: { name: "Baseline", scenario_type: BASELINE, unemployment_rate_bps: 500, gdp_growth_bps: 200, effective_from_period: "2026-Q1", effective_to_period: "2027-Q1" }
              as: ModelValidator
              captures: { sc_base: $.data.id }
            - call: "POST /cecl/model-runs"
              payload: { as_of_period: "2026-Q1", loss_model_id: "${m_id}", scenario_weights: [ { scenario_id: "${sc_base}", weight_bps: 10000 } ] }
              as: CreditAnalyst
              captures: { run_id: $.data.id }
            - call: "POST /cecl/model-runs/${run_id}/execute"
              payload: {}
              as: CreditAnalyst
              captures: { iec0: $.data.individual_evaluation_count }
            - call: "GET /cecl/individual-evaluations"
              payload: { run_id: "${run_id}" }
              as: CreditAnalyst
              captures: { ie_id: "$.data[0].id", ie_v: "$.data[0].version" }
          trigger:
            - call: "PATCH /cecl/individual-evaluations/${ie_id}"
              payload: { expected_evaluation_version: "${ie_v}", analysis_notes: "Collateral-based reserve documented." }
              as: CreditAnalyst
            - call: "POST /cecl/individual-evaluations/${ie_id}/submit"
              payload: {}
              as: CreditAnalyst
            - call: "POST /cecl/individual-evaluations/${ie_id}/review"
              payload: {}
              as: ChiefCreditOfficer
            - call: "POST /cecl/individual-evaluations/${ie_id}/reopen"
              payload: { reopen_reason: "Reconfirm appraisal" }
              as: ChiefCreditOfficer
            - call: "POST /cecl/individual-evaluations/${ie_id}/review"
              payload: {}
              as: ChiefCreditOfficer
            - call: "GET /cecl/model-runs/${run_id}"
              payload: {}
              as: CreditAnalyst
              captures: { iec1: $.data.individual_evaluation_count, rc1: $.data.reviewed_evaluation_count }
          assert:
            - "individual_evaluation_count at execute == 1 (${iec0})"
            - "individual_evaluation_count after submit/review/reopen/review == 1 (${iec1}) — the cycle neither creates nor destroys evaluations"
            - "reviewed_evaluation_count ends at 1 (${rc1})"
            - "GET /cecl/individual-evaluations?run_id= returns exactly 1 row throughout"
