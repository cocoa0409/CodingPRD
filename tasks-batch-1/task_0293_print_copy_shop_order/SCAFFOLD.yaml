# =============================================================================
# Print & Copy Shop Order — benchmark seed tables (SCAFFOLD.yaml)
# §1.0–§1.7 + preamble. Difficulty band: Expert (§0.4).
# =============================================================================

scenario: |
  Print & Copy Shop Order: product catalog (copies/banners/binding), file upload &
  preflight, quantity/option pricing, proof approval, turnaround/rush, pickup/ship,
  reorder, finishing add-on

domain_name: print-copy-shop-order
api_prefix: /

# =============================================================================
# Complexity Profile (§0.1–§0.3)
# =============================================================================
complexity_profile:
  primary_archetype: pricing_engine
  secondary_archetype: workflow_orchestration
  complexity_layers:
    - dual_variant_calculation        # quote estimate vs production-locked final price; provisional vs committed loyalty score
    - cascading_side_effects          # proof reject -> line reopen -> order de-confirm -> capacity reservation release
    - rate_threshold_triggers         # tiered quantity breakpoints; rush cutoff threshold
    - optimistic_concurrency          # OCC on Order.version for confirm/reorder supersede races
    - derived_field_reconciliation    # Order.subtotal_cents / total_cents reconciled from OrderLine final prices

  entity_topology: flat
  # Peer entities linked by foreign keys; no deep nesting in URL paths. Orders,
  # lines, artwork, proofs, fulfillments, capacity reservations, press bookings are
  # all peers joined by FK fields and discovered via filtered-list GETs.

  state_machine_shape: parallel
  # Order carries two independent dimensions (production_status x payment_status).
  # Proof is cyclic (SUBMITTED -> CHANGES_REQUESTED -> SUBMITTED ...).
  # OrderLine is branching with revert. Artwork is linear with a revert edge.

  relationship_patterns:
    - one_to_many        # Order -> OrderLine; Product -> PricingTier/FinishingOption
    - cross_aggregate    # OrderLine -> Product (catalog), CapacityReservation -> Shop, PressBooking -> Press
    - self_referential   # Order.reordered_from_order_id -> Order.id (reorder lineage)

  role_model: peer_roles
  # Customer owns their own Orders; ShopStaff runs catalog + pricing + fulfillment;
  # ProductionOperator runs preflight, proofs, press, and production. Non-overlapping
  # resource ownership with a few shared reads.

  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — EMIT VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Shop
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: name, type: string, source: input, description: "Shop display name" }
      - { name: tax_rate_bps, type: integer, source: input, description: "Sales tax in basis points applied to taxable subtotal (e.g., 825 = 8.25%)", constraints: ">= 0 and <= 2000" }
      - { name: rush_surcharge_bps, type: integer, source: input, description: "Rush surcharge in basis points of the line subtotal when a line is RUSH", constraints: ">= 0 and <= 10000" }
      - { name: rush_cutoff_hour_utc, type: integer, source: input, description: "Hour-of-day UTC (0-23). RUSH lines ordered at/after this hour push promised_ready to next production day", constraints: "0..23" }
      - { name: standard_turnaround_days, type: integer, source: input, description: "Whole production days added to compute STANDARD promised_ready_date", constraints: ">= 1" }
      - { name: rush_turnaround_days, type: integer, source: input, description: "Whole production days for RUSH promised_ready_date", constraints: ">= 0 and < standard_turnaround_days" }
      - { name: daily_unit_capacity, type: integer, source: input, description: "Total production units the shop can schedule per production_date across all CapacityReservations", constraints: ">= 1" }

  - name: Product
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: shop_id, type: string, source: input, description: "FK -> Shop.id; catalog owner" }
      - { name: name, type: string, source: input, description: "Product name, e.g. 'Color Copy 8.5x11'" }
      - { name: category, type: enum, source: input, description: "COPIES | BANNER | BINDING", constraints: "one of COPIES, BANNER, BINDING" }
      - { name: base_unit_price_cents, type: integer, source: input, description: "Per-unit price in cents before tier discount and finishing", constraints: ">= 0" }
      - { name: unit_size, type: integer, source: input, description: "Production units consumed per ordered quantity unit (BANNER large-format consumes > 1)", default: 1, constraints: ">= 1" }
      - { name: requires_proof, type: boolean, source: input, description: "If true, an approved Proof is required before the line may PRICE_LOCK", default: false }
      - { name: requires_press, type: boolean, source: input, description: "If true (BANNER large-format), the line must hold a confirmed PressBooking before PRICE_LOCK", default: false }
      - { name: active, type: boolean, source: input, description: "Whether the product may be added to new order lines", default: true }

  - name: PricingTier
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: product_id, type: string, source: input, description: "FK -> Product.id; tier owner" }
      - { name: min_quantity, type: integer, source: input, description: "Inclusive lower bound of quantities this tier covers", constraints: ">= 1" }
      - { name: discount_bps, type: integer, source: input, description: "Discount in basis points off base_unit_price_cents for quantities at/above min_quantity", constraints: ">= 0 and <= 10000" }

  - name: FinishingOption
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: product_id, type: string, source: input, description: "FK -> Product.id; finishing add-on owner" }
      - { name: code, type: string, source: input, description: "Stable finishing code, e.g. LAMINATE, COIL_BIND, GROMMETS" }
      - { name: surcharge_kind, type: enum, source: input, description: "PER_UNIT (cents x quantity) | FLAT (cents once per line)", constraints: "one of PER_UNIT, FLAT" }
      - { name: surcharge_cents, type: integer, source: input, description: "Surcharge amount in cents per the surcharge_kind", constraints: ">= 0" }

  - name: Customer
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID; equals X-User-ID for Customer role" }
      - { name: email, type: string, source: input, description: "Customer email (unique within shop)" }
      - { name: name, type: string, source: input, description: "Customer name" }
      - { name: shop_id, type: string, source: input, description: "FK -> Shop.id; home shop" }
      - { name: completed_order_count, type: integer, source: computed, description: "Count of this customer's Orders whose production_status reached COMPLETED; bumped on completion", default: 0 }
      - { name: lifetime_paid_cents, type: integer, source: computed, description: "Sum of total_cents over this customer's PAID orders; basis for committed loyalty score", default: 0 }
      - { name: loyalty_score, type: number, source: computed, description: "Committed weighted loyalty score recomputed on each order completion; see calc committed_loyalty_score", default: 0 }
      - { name: loyalty_tier, type: enum, source: computed, description: "NONE | SILVER | GOLD derived from loyalty_score thresholds", default: NONE }

  - name: Order
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: shop_id, type: string, source: input, description: "FK -> Shop.id; order's shop" }
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; order owner" }
      - { name: reordered_from_order_id, type: string, source: system, description: "FK -> Order.id; set when this order was created by reorder, else null", default: null }
      - { name: production_status, type: enum, source: system, description: "DRAFT | CONFIRMED | IN_PRODUCTION | READY | FULFILLED | CANCELLED — production dimension", default: DRAFT, constraints: "one of DRAFT, CONFIRMED, IN_PRODUCTION, READY, FULFILLED, CANCELLED" }
      - { name: payment_status, type: enum, source: system, description: "UNPAID | INVOICED | PAID | REFUNDED — payment dimension, evolves independently of production_status", default: UNPAID, constraints: "one of UNPAID, INVOICED, PAID, REFUNDED" }
      - { name: subtotal_cents, type: integer, source: computed, description: "Sum of each OrderLine.final_line_cents once locked, else sum of estimate_line_cents; see calc order_subtotal", default: 0 }
      - { name: loyalty_discount_cents, type: integer, source: computed, description: "Loyalty discount applied to the order subtotal at confirm time; see calc order_loyalty_discount", default: 0 }
      - { name: rush_fee_cents, type: integer, source: computed, description: "Sum of per-line rush surcharges; see calc order_total", default: 0 }
      - { name: tax_cents, type: integer, source: computed, description: "Tax on the discounted taxable subtotal; see calc order_total", default: 0 }
      - { name: total_cents, type: integer, source: computed, description: "Final invoice amount; see calc order_total", default: 0 }
      - { name: promised_ready_date, type: string, source: computed, description: "ISO date (YYYY-MM-DD) of the latest line promised_ready_date; see calc line_turnaround", default: null }

  - name: OrderLine
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: order_id, type: string, source: input, description: "FK -> Order.id; parent order" }
      - { name: product_id, type: string, source: input, description: "FK -> Product.id; catalog product" }
      - { name: quantity, type: integer, source: input, description: "Ordered quantity units", constraints: ">= 1" }
      - { name: finishing_codes, type: array, source: input, description: "Array of FinishingOption.code strings to apply; each must belong to product_id", default: [] }
      - { name: service_level, type: enum, source: input, description: "STANDARD | RUSH", default: STANDARD, constraints: "one of STANDARD, RUSH" }
      - { name: status, type: enum, source: system, description: "OPEN | PREFLIGHT_OK | PROOF_PENDING | PROOF_APPROVED | PRICE_LOCKED | PRODUCED — line lifecycle", default: OPEN, constraints: "one of OPEN, PREFLIGHT_OK, PROOF_PENDING, PROOF_APPROVED, PRICE_LOCKED, PRODUCED" }
      - { name: production_units, type: integer, source: computed, description: "quantity * Product.unit_size; units consumed from daily capacity", default: 0 }
      - { name: estimate_line_cents, type: integer, source: computed, description: "Provisional (forward-looking) line price using CURRENT tier/finishing rates; recomputed on line edit", default: 0 }
      - { name: final_line_cents, type: integer, source: computed, description: "Locked line price snapshotted at PRICE_LOCK using rates in force at lock time; null until locked", default: null }
      - { name: rush_surcharge_cents, type: integer, source: computed, description: "Per-line rush surcharge captured at PRICE_LOCK (0 when STANDARD)", default: 0 }
      - { name: promised_ready_date, type: string, source: computed, description: "ISO date (YYYY-MM-DD) computed at confirm from service_level + rush cutoff; see calc line_turnaround", default: null }

  - name: Artwork
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: order_line_id, type: string, source: input, description: "FK -> OrderLine.id; the line this file is for" }
      - { name: file_name, type: string, source: input, description: "Uploaded file name" }
      - { name: page_count, type: integer, source: input, description: "Declared page count of the artwork", constraints: ">= 1" }
      - { name: dpi, type: integer, source: input, description: "Declared resolution in DPI; preflight checks against minimum", constraints: ">= 1" }
      - { name: bleed_mm, type: number, source: input, description: "Declared bleed margin in millimeters; preflight checks against minimum", constraints: ">= 0" }
      - { name: preflight_status, type: enum, source: system, description: "UPLOADED | PASSED | FAILED — set by run-preflight", default: UPLOADED, constraints: "one of UPLOADED, PASSED, FAILED" }
      - { name: preflight_reason, type: string, source: system, description: "Human-readable failure reason when FAILED, else null", default: null }

  - name: Proof
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: order_line_id, type: string, source: input, description: "FK -> OrderLine.id; proof belongs to this line" }
      - { name: round_number, type: integer, source: system, description: "1-based proof round; increments each resubmit", default: 1 }
      - { name: status, type: enum, source: system, description: "SUBMITTED | APPROVED | CHANGES_REQUESTED — cyclic between SUBMITTED and CHANGES_REQUESTED", default: SUBMITTED, constraints: "one of SUBMITTED, APPROVED, CHANGES_REQUESTED" }
      - { name: change_note, type: string, source: input, description: "Customer note attached when requesting changes; null otherwise", default: null }

  - name: Fulfillment
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: order_id, type: string, source: input, description: "FK -> Order.id; the order being fulfilled" }
      - { name: method, type: enum, source: input, description: "PICKUP | SHIP", constraints: "one of PICKUP, SHIP" }
      - { name: ship_address, type: string, source: input, description: "Required when method=SHIP; must be omitted/null when PICKUP", default: null }
      - { name: ship_fee_cents, type: integer, source: input, description: "Flat shipping fee in cents; required and > 0 when SHIP, must be 0 when PICKUP", default: 0, constraints: ">= 0" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | HANDED_OFF — HANDED_OFF marks the order FULFILLED", default: SCHEDULED, constraints: "one of SCHEDULED, HANDED_OFF" }

  - name: Press
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: shop_id, type: string, source: input, description: "FK -> Shop.id; press owner" }
      - { name: name, type: string, source: input, description: "Large-format press name" }
      - { name: cleanup_buffer_minutes, type: integer, source: input, description: "Mandatory idle buffer required AFTER each booking before the next may start on this press", default: 0, constraints: ">= 0" }

  - name: PressBooking
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: press_id, type: string, source: input, description: "FK -> Press.id; booked press" }
      - { name: order_line_id, type: string, source: input, description: "FK -> OrderLine.id; the BANNER line consuming press time" }
      - { name: start_utc, type: datetime, source: input, description: "Booking start (ISO 8601 UTC); half-open interval [start_utc, end_utc)" }
      - { name: end_utc, type: datetime, source: input, description: "Booking end (ISO 8601 UTC); must be strictly after start_utc" }
      - { name: status, type: enum, source: system, description: "CONFIRMED | RELEASED — RELEASED frees the slot", default: CONFIRMED, constraints: "one of CONFIRMED, RELEASED" }

  - name: CapacityReservation
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: shop_id, type: string, source: input, description: "FK -> Shop.id; capacity pool owner" }
      - { name: order_line_id, type: string, source: input, description: "FK -> OrderLine.id; the line consuming capacity" }
      - { name: production_date, type: string, source: input, description: "ISO date (YYYY-MM-DD) the units are scheduled on" }
      - { name: units, type: integer, source: input, description: "Production units reserved on production_date; equals the line's production_units", constraints: ">= 1" }
      - { name: status, type: enum, source: system, description: "HELD | RELEASED — RELEASED returns units to the pool", default: HELD, constraints: "one of HELD, RELEASED" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Artwork
    field: preflight_status
    initial_state: UPLOADED
    terminal_states: []
    note: "Linear with a revert edge: a FAILED file can be re-run after the customer edits declared specs."
    transitions:
      - from: UPLOADED
        to: PASSED
        trigger: "POST /artworks/{artwork_id}/preflight (specs meet minimums)"
        actor: ProductionOperator
        preconditions:
          - "Artwork.preflight_status == UPLOADED"
          - "dpi >= MIN_DPI and bleed_mm >= MIN_BLEED_MM and page_count >= 1"
        side_effects:
          - "OrderLine.status: OPEN -> PREFLIGHT_OK (the line referenced by Artwork.order_line_id)"
      - from: UPLOADED
        to: FAILED
        trigger: "POST /artworks/{artwork_id}/preflight (specs below minimums)"
        actor: ProductionOperator
        preconditions:
          - "Artwork.preflight_status == UPLOADED"
          - "dpi < MIN_DPI or bleed_mm < MIN_BLEED_MM"
        side_effects:
          - "Set Artwork.preflight_reason to the first failing rule (DPI checked before BLEED)"
      - from: FAILED
        to: UPLOADED
        trigger: "PATCH /artworks/{artwork_id} (customer revises declared specs)"
        actor: Customer
        preconditions:
          - "Artwork.preflight_status == FAILED"
        side_effects:
          - "Clear Artwork.preflight_reason"

  - entity: OrderLine
    field: status
    initial_state: OPEN
    terminal_states: [PRODUCED]
    note: "Branching with revert. PROOF gating only when Product.requires_proof; price-lock gates on proof + press."
    transitions:
      - from: OPEN
        to: PREFLIGHT_OK
        trigger: "system (Artwork preflight PASSED)"
        actor: system
        preconditions:
          - "Artwork for this line has preflight_status == PASSED"
        side_effects: []
      - from: PREFLIGHT_OK
        to: PROOF_PENDING
        trigger: "POST /proofs (operator submits a proof for the line)"
        actor: ProductionOperator
        preconditions:
          - "OrderLine.status == PREFLIGHT_OK"
          - "Product.requires_proof == true"
        side_effects:
          - "Create Proof with status SUBMITTED, round_number 1"
      - from: PROOF_PENDING
        to: PROOF_APPROVED
        trigger: "system (Proof APPROVED by customer)"
        actor: system
        preconditions:
          - "The line's latest Proof.status == APPROVED"
        side_effects: []
      - from: PROOF_PENDING
        to: PREFLIGHT_OK
        trigger: "system (Proof CHANGES_REQUESTED by customer)"
        actor: system
        preconditions:
          - "The line's latest Proof.status == CHANGES_REQUESTED"
        side_effects:
          - "Line reverts so a new proof round can be submitted"
      - from: [PREFLIGHT_OK, PROOF_APPROVED]
        to: PRICE_LOCKED
        trigger: "system (Order CONFIRMED) — see Order DRAFT->CONFIRMED side_effects"
        actor: system
        preconditions:
          - "If Product.requires_proof: OrderLine.status == PROOF_APPROVED"
          - "If not Product.requires_proof: OrderLine.status == PREFLIGHT_OK"
          - "If Product.requires_press: a CONFIRMED PressBooking exists for this line"
        side_effects:
          - "Snapshot final_line_cents from estimate_line_cents inputs at lock time (calc final_line_price)"
          - "Snapshot rush_surcharge_cents (0 when STANDARD)"
          - "Compute production_units = quantity * Product.unit_size"
      - from: PRICE_LOCKED
        to: PRODUCED
        trigger: "POST /order-lines/{order_line_id}/produce"
        actor: ProductionOperator
        preconditions:
          - "OrderLine.status == PRICE_LOCKED"
          - "Order.production_status == IN_PRODUCTION"
        side_effects:
          - "When ALL lines of the order are PRODUCED, bubble up: Order.production_status IN_PRODUCTION -> READY (calc-free)"

  - entity: Proof
    field: status
    initial_state: SUBMITTED
    terminal_states: [APPROVED]
    note: "Cyclic: SUBMITTED <-> CHANGES_REQUESTED across rounds until APPROVED."
    transitions:
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /proofs/{proof_id}/approve"
        actor: Customer
        preconditions:
          - "Proof.status == SUBMITTED"
          - "Customer is the owner of the line's order (X-User-ID == Order.customer_id)"
        side_effects:
          - "OrderLine.status PROOF_PENDING -> PROOF_APPROVED"
      - from: SUBMITTED
        to: CHANGES_REQUESTED
        trigger: "POST /proofs/{proof_id}/request-changes"
        actor: Customer
        preconditions:
          - "Proof.status == SUBMITTED"
          - "change_note provided"
        side_effects:
          - "OrderLine.status PROOF_PENDING -> PREFLIGHT_OK (line reopened for a new round)"
      - from: CHANGES_REQUESTED
        to: SUBMITTED
        trigger: "POST /proofs (operator submits next round for same line) — creates a NEW Proof"
        actor: ProductionOperator
        preconditions:
          - "Prior Proof.status == CHANGES_REQUESTED"
          - "OrderLine.status == PREFLIGHT_OK"
        side_effects:
          - "New Proof round_number = prior round_number + 1; OrderLine.status -> PROOF_PENDING"
        note: "Modeled as creating a successor Proof; the prior CHANGES_REQUESTED proof is terminal-in-place."

  - entity: Order
    field: production_status
    initial_state: DRAFT
    terminal_states: [FULFILLED, CANCELLED]
    note: "Production dimension; evolves independently of payment_status (parallel)."
    transitions:
      - from: DRAFT
        to: CONFIRMED
        trigger: "POST /orders/{order_id}/confirm"
        actor: Customer
        preconditions:
          - "Order has >= 1 OrderLine"
          - "Every OrderLine is PRICE_LOCKABLE: PROOF_APPROVED if its product requires_proof, else PREFLIGHT_OK; and a CONFIRMED PressBooking exists for every line whose product requires_press"
          - "A Fulfillment exists for the order"
          - "expected_order_version matches Order.version (OCC)"
        side_effects:
          - "Each OrderLine: -> PRICE_LOCKED, snapshot final_line_cents + rush_surcharge_cents + production_units"
          - "Compute each line promised_ready_date (calc line_turnaround); set Order.promised_ready_date = latest line date"
          - "Recompute Order.subtotal_cents from locked final_line_cents (calc order_subtotal)"
          - "Apply Order.loyalty_discount_cents from customer's COMMITTED loyalty_tier (calc order_loyalty_discount)"
          - "Compute Order.rush_fee_cents, tax_cents, total_cents (calc order_total)"
          - "For each line, create a HELD CapacityReservation on its promised_ready_date for production_units (calc daily_capacity_check guards it)"
          - "increments Order.version by 1"
      - from: CONFIRMED
        to: IN_PRODUCTION
        trigger: "POST /orders/{order_id}/start-production"
        actor: ProductionOperator
        preconditions:
          - "Order.production_status == CONFIRMED"
          - "Order.payment_status IN {INVOICED, PAID}"
        side_effects: []
      - from: IN_PRODUCTION
        to: READY
        trigger: "system (all OrderLines PRODUCED) — bubble up"
        actor: system
        preconditions:
          - "Every OrderLine.status == PRODUCED"
        side_effects: []
      - from: READY
        to: FULFILLED
        trigger: "POST /fulfillments/{fulfillment_id}/hand-off"
        actor: ShopStaff
        preconditions:
          - "Order.production_status == READY"
          - "Order.payment_status == PAID"
        side_effects:
          - "Fulfillment.status -> HANDED_OFF"
          - "Increment Customer.completed_order_count by 1"
          - "Recompute Customer committed loyalty_score and loyalty_tier (calc committed_loyalty_score)"
      - from: [DRAFT, CONFIRMED]
        to: CANCELLED
        trigger: "POST /orders/{order_id}/cancel"
        actor: Customer
        preconditions:
          - "Order.production_status IN {DRAFT, CONFIRMED}"
          - "expected_order_version matches Order.version (OCC)"
        side_effects:
          - "Cascade: every HELD CapacityReservation for the order's lines -> RELEASED (units returned to pool)"
          - "Cascade: every CONFIRMED PressBooking for the order's lines -> RELEASED"
          - "increments Order.version by 1"

  - entity: Order
    field: payment_status
    initial_state: UNPAID
    terminal_states: [REFUNDED]
    note: "Payment dimension; independent of production_status (parallel)."
    transitions:
      - from: UNPAID
        to: INVOICED
        trigger: "POST /orders/{order_id}/invoice"
        actor: ShopStaff
        preconditions:
          - "Order.production_status IN {CONFIRMED, IN_PRODUCTION}"
          - "Order.total_cents > 0"
        side_effects: []
      - from: INVOICED
        to: PAID
        trigger: "POST /orders/{order_id}/pay"
        actor: Customer
        preconditions:
          - "Order.payment_status == INVOICED"
          - "amount_cents == Order.total_cents"
        side_effects: []
      - from: PAID
        to: REFUNDED
        trigger: "POST /orders/{order_id}/refund"
        actor: ShopStaff
        preconditions:
          - "Order.payment_status == PAID"
          - "Order.production_status == CANCELLED"
        side_effects:
          - "Refund recorded; compensating action — Customer.lifetime_paid_cents reduced by Order.total_cents (must equal pre-PAID value)"

  - entity: Fulfillment
    field: status
    initial_state: SCHEDULED
    terminal_states: [HANDED_OFF]
    transitions:
      - from: SCHEDULED
        to: HANDED_OFF
        trigger: "POST /fulfillments/{fulfillment_id}/hand-off"
        actor: ShopStaff
        preconditions:
          - "Order.production_status == READY"
          - "Order.payment_status == PAID"
        side_effects:
          - "Drives Order.production_status READY -> FULFILLED (see Order machine)"

  - entity: CapacityReservation
    field: status
    initial_state: HELD
    terminal_states: [RELEASED]
    transitions:
      - from: HELD
        to: RELEASED
        trigger: "system (Order cancelled) — cascade"
        actor: system
        preconditions:
          - "CapacityReservation.status == HELD"
        side_effects:
          - "units returned to the shop's daily pool for production_date"

  - entity: PressBooking
    field: status
    initial_state: CONFIRMED
    terminal_states: [RELEASED]
    transitions:
      - from: CONFIRMED
        to: RELEASED
        trigger: "system (Order cancelled) — cascade, OR POST /press-bookings/{press_booking_id}/release"
        actor: system
        preconditions:
          - "PressBooking.status == CONFIRMED"
        side_effects:
          - "Slot [start_utc, end_utc) plus cleanup buffer freed on the press"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: order-confirm-stale-version
    parent_entity: Order
    write_endpoint: "POST /orders/{order_id}/confirm"
    occ_field: "expected_order_version"
    description: |
      Confirming an Order whose version has advanced since the client last
      observed it is rejected. A reorder-clone edit, a line price-lock, or a
      cancel may have advanced Order.version after the client read it; a confirm
      carrying a stale expected_order_version is rejected before any line locks.
    error_id: ERR_STALE_ORDER_VERSION
    http_status: 412

  - rule_id: order-cancel-stale-version
    parent_entity: Order
    write_endpoint: "POST /orders/{order_id}/cancel"
    occ_field: "expected_order_version"
    description: |
      Cancelling an Order whose version has advanced since the client last read
      it is rejected. Captures the case where the order was confirmed (version
      bumped, reservations held) after the client's last read, so the cancel's
      view — and thus its intended cascade — is stale.
    error_id: ERR_STALE_ORDER_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: estimate_line_price
    trigger: "OrderLine create/edit (POST /order-lines, PATCH /order-lines/{id})"
    algorithm: tiered_pricing
    formula: |
      # Provisional, forward-looking: uses tier/finishing rates IN FORCE RIGHT NOW.
      # Step 1 — tier selection (>= breakpoint): pick the PricingTier for product_id
      #          with the greatest min_quantity such that min_quantity <= quantity.
      #          If no tier qualifies, discount_bps = 0.
      tier_discount_bps = selected_tier.discount_bps (or 0)
      discounted_unit_cents = round_half_up(base_unit_price_cents * (10000 - tier_discount_bps) / 10000)
      base_cents = discounted_unit_cents * quantity
      # Step 2 — finishing: sum each applied FinishingOption by code.
      finishing_cents = sum(
          opt.surcharge_cents * quantity   if opt.surcharge_kind == PER_UNIT
          else opt.surcharge_cents         if opt.surcharge_kind == FLAT
        for opt in finishing options whose code in finishing_codes)
      # Step 3 — pre-rush line subtotal:
      estimate_line_cents = base_cents + finishing_cents
    input_set: "The OrderLine's product_id, quantity, finishing_codes; PricingTiers and FinishingOptions for that product."
    constants: {}
    precision: "Cents; round_half_up at the discounted_unit_cents step ONLY, then integer-multiply by quantity (round-then-multiply, pinned)."
    variants:
      - name: estimate
        when: "Line not yet PRICE_LOCKED"
        difference: "Reads current PricingTier/FinishingOption rows; recomputes on every edit."

  - name: final_line_price
    trigger: "OrderLine PRICE_LOCK (during Order DRAFT->CONFIRMED)"
    algorithm: tiered_pricing
    formula: |
      # Identical arithmetic to estimate_line_price, but SNAPSHOTTED: the tier
      # discount_bps and finishing surcharge_cents are captured at lock time and
      # frozen onto the line. Subsequent catalog edits never change final_line_cents.
      final_line_cents = (same Step 1-3 as estimate_line_price, evaluated at lock instant)
      # Plus the rush surcharge, captured separately:
      rush_surcharge_cents = round_half_up(final_line_cents * Shop.rush_surcharge_bps / 10000)
                             if service_level == RUSH else 0
    input_set: "Same inputs as estimate, frozen at lock time; plus Shop.rush_surcharge_bps when RUSH."
    constants: {}
    precision: "Cents; round_half_up on the rush surcharge; final_line_cents excludes rush (rush carried on Order.rush_fee_cents)."
    variants:
      - name: final
        when: "Line at PRICE_LOCK and after"
        difference: "Frozen snapshot — diverges from estimate if catalog rates changed between line creation and confirm."

  - name: order_subtotal
    trigger: "Order DRAFT->CONFIRMED side-effect, after every line locks"
    algorithm: aggregation
    formula: |
      # Sum of LOCKED final_line_cents over the order's lines (rush excluded here).
      subtotal_cents = sum(line.final_line_cents for line in order lines, all in status PRICE_LOCKED)
    input_set: "All OrderLines of the order; every line is PRICE_LOCKED at this point (enforced by confirm preconditions)."
    constants: {}
    precision: "Integer cents; final_line_cents are already rounded, so SUM is exact (sum-of-rounded, pinned: per-line rounding happened at estimate/final step, not here)."

  - name: order_loyalty_discount
    trigger: "Order DRAFT->CONFIRMED side-effect, after order_subtotal"
    algorithm: threshold
    formula: |
      # Discount keyed on the customer's COMMITTED loyalty_tier (NOT recomputed here).
      pct_bps = 0    if loyalty_tier == NONE
                500  if loyalty_tier == SILVER   # 5%
                1000 if loyalty_tier == GOLD      # 10%
      loyalty_discount_cents = round_half_up(subtotal_cents * pct_bps / 10000)
    input_set: "Order.subtotal_cents and Customer.loyalty_tier as committed before this confirm."
    constants: { SILVER_BPS: 500, GOLD_BPS: 1000 }
    precision: "Cents, round_half_up."

  - name: order_total
    trigger: "Order DRAFT->CONFIRMED side-effect, after order_loyalty_discount; recomputed if a Fulfillment SHIP fee changes before invoice"
    algorithm: aggregation
    formula: |
      # Pinned evaluation order (circular-looking: tax keys off the DISCOUNTED subtotal,
      # rush keys off pre-discount line subtotals; both must be resolved before total):
      #   1. subtotal_cents            (from order_subtotal)
      #   2. loyalty_discount_cents    (from order_loyalty_discount)
      #   3. rush_fee_cents = sum(line.rush_surcharge_cents for all lines)
      #   4. taxable_base  = subtotal_cents - loyalty_discount_cents     # rush is NOT taxed
      #   5. tax_cents     = round_half_up(taxable_base * Shop.tax_rate_bps / 10000)
      #   6. ship_fee_cents = the order's Fulfillment.ship_fee_cents (0 for PICKUP)
      #   7. total_cents   = taxable_base + rush_fee_cents + tax_cents + ship_fee_cents
    input_set: "subtotal_cents, loyalty_discount_cents, per-line rush_surcharge_cents, Shop.tax_rate_bps, Fulfillment.ship_fee_cents."
    constants: {}
    precision: "Cents, round_half_up on tax only; all other terms are already integer cents."

  - name: line_turnaround
    trigger: "Order DRAFT->CONFIRMED side-effect"
    algorithm: threshold
    formula: |
      # Promised-ready date per line from a fixed clock anchor (the confirm time supplied
      # to the system via /_clock; tests pin it). Whole-day arithmetic on calendar dates.
      anchor_date = date(current_utc)
      anchor_hour = hour(current_utc)
      if service_level == STANDARD:
          ready = anchor_date + Shop.standard_turnaround_days days
      else:  # RUSH
          base = anchor_date + Shop.rush_turnaround_days days
          # rush cutoff: if confirmed at/after rush_cutoff_hour_utc, slip one production day
          ready = base + (1 day if anchor_hour >= Shop.rush_cutoff_hour_utc else 0)
      line.promised_ready_date = ready
      order.promised_ready_date = max(line.promised_ready_date over all lines)
    input_set: "current_utc (clock), service_level, Shop.standard_turnaround_days / rush_turnaround_days / rush_cutoff_hour_utc."
    constants: {}
    precision: "Whole calendar days; comparison >= on the cutoff hour is inclusive (at the cutoff hour it slips)."

  - name: daily_capacity_check
    trigger: "Order DRAFT->CONFIRMED side-effect, when creating each CapacityReservation"
    algorithm: aggregation
    formula: |
      # Aggregate-capacity overlap on Shop.daily_unit_capacity for a production_date.
      held_units = sum(r.units for CapacityReservation r
                       where r.shop_id == shop AND r.production_date == date
                       AND r.status == HELD)
      requested = line.production_units    # = quantity * Product.unit_size
      # Reject if it would push the day over capacity (boundary: == capacity is OK, > is rejected).
      reject if (held_units + requested) > Shop.daily_unit_capacity
    input_set: "All HELD CapacityReservations for (shop_id, production_date); the line's production_units."
    constants: {}
    precision: "Integer units; boundary is strict-greater (held + requested == capacity is allowed; +1 over is ERR_CAPACITY_EXCEEDED)."

  - name: press_overlap_check
    trigger: "PressBooking create (POST /press-bookings)"
    algorithm: interval_merge
    formula: |
      # Half-open interval [start_utc, end_utc) on the press, with a trailing cleanup buffer.
      # An existing CONFIRMED booking B occupies [B.start_utc, B.end_utc + cleanup_buffer_minutes).
      # New booking N = [N.start_utc, N.end_utc). Reject if N overlaps any occupied window:
      reject if exists CONFIRMED B on same press with
          N.start_utc < (B.end_utc + cleanup_buffer) AND B.start_utc < N.end_utc
      # Adjacency: N.start_utc == B.end_utc is NOT a conflict by the half-open rule ALONE,
      # but the cleanup buffer pushes the occupied end out, so N must start at/after
      # B.end_utc + cleanup_buffer to be accepted.
    input_set: "All CONFIRMED PressBookings on press_id; Press.cleanup_buffer_minutes; N's [start_utc, end_utc)."
    constants: {}
    precision: "Minute resolution; half-open at the raw interval, buffer-extended at the tail (adjacency at the exact buffer edge is allowed)."

  - name: preflight_evaluation
    trigger: "POST /artworks/{artwork_id}/preflight"
    algorithm: threshold
    formula: |
      # Pinned check order: DPI is evaluated BEFORE bleed, so a file failing both
      # reports the DPI reason. PASS iff both minimums are met.
      if dpi < MIN_DPI:
          preflight_status = FAILED; preflight_reason = "DPI {dpi} below minimum {MIN_DPI}"
      elif bleed_mm < MIN_BLEED_MM:
          preflight_status = FAILED; preflight_reason = "Bleed {bleed_mm}mm below minimum {MIN_BLEED_MM}mm"
      else:
          preflight_status = PASSED; preflight_reason = null
    input_set: "The Artwork's declared dpi and bleed_mm at preflight time."
    constants: { MIN_DPI: 150, MIN_BLEED_MM: 3 }
    precision: "Strict-less comparison: dpi == MIN_DPI passes (boundary inclusive of the minimum); dpi == MIN_DPI - 1 fails."

  - name: committed_loyalty_score
    trigger: "Order READY->FULFILLED side-effect (hand-off)"
    algorithm: weighted_scoring
    formula: |
      # COMMITTED variant: recomputed only at hand-off from realized history.
      # Weighted blend of completion count and realized spend (different DOMAIN from line pricing).
      loyalty_score = round_half_up_to_1dp(
            W_COUNT * completed_order_count
          + W_SPEND * (lifetime_paid_cents / 10000.0) )   # spend in dollars/100 normalization
      loyalty_tier = GOLD   if loyalty_score >= GOLD_THRESHOLD
                     SILVER if loyalty_score >= SILVER_THRESHOLD
                     NONE   otherwise
    input_set: "Customer.completed_order_count and Customer.lifetime_paid_cents AFTER this order's hand-off increments them."
    constants: { W_COUNT: 1.0, W_SPEND: 0.5, SILVER_THRESHOLD: 3.0, GOLD_THRESHOLD: 6.0 }
    precision: "loyalty_score to 1 decimal place, round_half_up; tier thresholds use >= (inclusive)."
    variants:
      - name: committed
        when: "At hand-off"
        difference: "Uses realized completed_order_count/lifetime_paid_cents; the value the NEXT order's discount keys on."
      - name: provisional
        when: "GET /customers/{id}/loyalty-preview"
        difference: "Projects score as if the customer's CONFIRMED-but-not-yet-fulfilled orders had completed (forward-looking), shown to the customer but NEVER used for a discount."

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "Role is permitted for the operation per §1.7"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "All path/body-referenced resources exist (validated left-to-right)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all

  - priority: 4
    category: business_referential
    check: "Customer acting on an Order/Proof/line must own it (X-User-ID == Order.customer_id)"
    error_id: ERR_NOT_ORDER_OWNER
    http_status: 403
    applies_to: "customer-owned order/proof/line operations"

  - priority: 5
    category: state
    check: "Target resource is in a valid state for the requested transition"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 6
    category: business_constraint
    check: "OCC: expected_order_version matches Order.version on confirm/cancel"
    error_id: ERR_STALE_ORDER_VERSION
    http_status: 412
    applies_to: "POST /orders/{id}/confirm, POST /orders/{id}/cancel"

  - priority: 7
    category: business_referential
    check: "Each finishing_code on a line belongs to that line's product_id"
    error_id: ERR_FINISHING_NOT_FOR_PRODUCT
    http_status: 422
    applies_to: "POST /order-lines, PATCH /order-lines/{id}"

  - priority: 8
    category: business_constraint
    check: "Product.active == true when adding it to a line"
    error_id: ERR_PRODUCT_INACTIVE
    http_status: 409
    applies_to: "POST /order-lines"

  - priority: 9
    category: business_constraint
    check: "Confirm requires every line price-lockable (proof-approved if requires_proof else preflight-ok) AND a CONFIRMED PressBooking for every requires_press line"
    error_id: ERR_LINE_NOT_LOCKABLE
    http_status: 409
    applies_to: "POST /orders/{id}/confirm"

  - priority: 10
    category: business_constraint
    check: "Confirm requires a Fulfillment to exist for the order"
    error_id: ERR_FULFILLMENT_REQUIRED
    http_status: 409
    applies_to: "POST /orders/{id}/confirm"

  - priority: 11
    category: business_referential
    check: "Fulfillment SHIP requires ship_address and ship_fee_cents > 0; PICKUP requires no address and ship_fee_cents == 0"
    error_id: ERR_FULFILLMENT_FIELDS_INVALID
    http_status: 422
    applies_to: "POST /fulfillments"

  - priority: 12
    category: business_temporal
    check: "PressBooking [start_utc, end_utc) plus cleanup buffer must not overlap a CONFIRMED booking on the press"
    error_id: ERR_PRESS_DOUBLE_BOOKED
    http_status: 409
    applies_to: "POST /press-bookings"

  - priority: 13
    category: business_temporal
    check: "PressBooking end_utc must be strictly after start_utc"
    error_id: ERR_BOOKING_INTERVAL_INVALID
    http_status: 422
    applies_to: "POST /press-bookings"

  - priority: 14
    category: business_fiscal
    check: "Confirm capacity: held + requested units must not exceed Shop.daily_unit_capacity on each line's promised_ready_date"
    error_id: ERR_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /orders/{id}/confirm"

  - priority: 15
    category: business_fiscal
    check: "Pay amount_cents must equal Order.total_cents"
    error_id: ERR_PAYMENT_AMOUNT_MISMATCH
    http_status: 422
    applies_to: "POST /orders/{id}/pay"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- Shop / catalog (config) ----
  - method: POST
    path: "/shops"
    description: "Create a shop (pricing/tax/turnaround/capacity config)"
    roles: [ShopStaff]
    code: 201
    input: [name, tax_rate_bps, rush_surcharge_bps, rush_cutoff_hour_utc, standard_turnaround_days, rush_turnaround_days, daily_unit_capacity]
    output: Shop
    side_effects: []

  - method: GET
    path: "/shops/{shop_id}"
    description: "Read a shop"
    roles: [ShopStaff, ProductionOperator, Customer]
    code: 200
    input: []
    output: Shop
    side_effects: []

  - method: POST
    path: "/products"
    description: "Create a catalog product"
    roles: [ShopStaff]
    code: 201
    input: [shop_id, name, category, base_unit_price_cents, "unit_size?", "requires_proof?", "requires_press?", "active?"]
    output: Product
    side_effects: []

  - method: GET
    path: "/products"
    description: "List products; filter by shop_id"
    roles: [ShopStaff, ProductionOperator, Customer]
    code: 200
    input: ["shop_id?", "category?", "limit?", "offset?"]
    output: Product[]
    side_effects: []

  - method: GET
    path: "/products/{product_id}"
    description: "Read a product"
    roles: [ShopStaff, ProductionOperator, Customer]
    code: 200
    input: []
    output: Product
    side_effects: []

  - method: PATCH
    path: "/products/{product_id}"
    description: "Edit catalog product (price, active). Does NOT change locked line prices."
    roles: [ShopStaff]
    code: 200
    input: ["base_unit_price_cents?", "active?", "name?"]
    output: Product
    side_effects: ["recompute estimate_line_cents on OPEN lines referencing this product"]

  - method: POST
    path: "/pricing-tiers"
    description: "Create a volume pricing tier for a product"
    roles: [ShopStaff]
    code: 201
    input: [product_id, min_quantity, discount_bps]
    output: PricingTier
    side_effects: []

  - method: GET
    path: "/pricing-tiers"
    description: "List pricing tiers; filter by product_id"
    roles: [ShopStaff, ProductionOperator, Customer]
    code: 200
    input: ["product_id?", "limit?", "offset?"]
    output: PricingTier[]
    side_effects: []

  - method: GET
    path: "/pricing-tiers/{pricing_tier_id}"
    description: "Read a pricing tier"
    roles: [ShopStaff, ProductionOperator, Customer]
    code: 200
    input: []
    output: PricingTier
    side_effects: []

  - method: POST
    path: "/finishing-options"
    description: "Create a finishing add-on for a product"
    roles: [ShopStaff]
    code: 201
    input: [product_id, code, surcharge_kind, surcharge_cents]
    output: FinishingOption
    side_effects: []

  - method: GET
    path: "/finishing-options"
    description: "List finishing options; filter by product_id"
    roles: [ShopStaff, ProductionOperator, Customer]
    code: 200
    input: ["product_id?", "limit?", "offset?"]
    output: FinishingOption[]
    side_effects: []

  - method: GET
    path: "/finishing-options/{finishing_option_id}"
    description: "Read a finishing option"
    roles: [ShopStaff, ProductionOperator, Customer]
    code: 200
    input: []
    output: FinishingOption
    side_effects: []

  - method: POST
    path: "/presses"
    description: "Register a large-format press"
    roles: [ShopStaff]
    code: 201
    input: [shop_id, name, "cleanup_buffer_minutes?"]
    output: Press
    side_effects: []

  - method: GET
    path: "/presses"
    description: "List presses; filter by shop_id"
    roles: [ShopStaff, ProductionOperator, Customer]
    code: 200
    input: ["shop_id?", "limit?", "offset?"]
    output: Press[]
    side_effects: []

  - method: GET
    path: "/presses/{press_id}"
    description: "Read a press"
    roles: [ShopStaff, ProductionOperator, Customer]
    code: 200
    input: []
    output: Press
    side_effects: []

  # ---- Customer ----
  - method: POST
    path: "/customers"
    description: "Register a customer"
    roles: [ShopStaff, Customer]
    code: 201
    input: [shop_id, email, name]
    output: Customer
    side_effects: []

  - method: GET
    path: "/customers"
    description: "List customers; filter by shop_id"
    roles: [ShopStaff]
    code: 200
    input: ["shop_id?", "limit?", "offset?"]
    output: Customer[]
    side_effects: []

  - method: GET
    path: "/customers/{customer_id}"
    description: "Read a customer (committed loyalty)"
    roles: [ShopStaff, Customer]
    code: 200
    input: []
    output: Customer
    side_effects: []

  - method: GET
    path: "/customers/{customer_id}/loyalty-preview"
    description: "Provisional (forward-looking) loyalty score if confirmed orders completed; never used for a discount"
    roles: [ShopStaff, Customer]
    code: 200
    input: []
    output: "{ projected_loyalty_score: number, projected_loyalty_tier: string, committed_loyalty_score: number }"
    side_effects: []

  # ---- Orders ----
  - method: POST
    path: "/orders"
    description: "Create a draft order"
    roles: [ShopStaff, Customer]
    code: 201
    input: [shop_id, customer_id]
    output: Order
    side_effects: ["production_status=DRAFT, payment_status=UNPAID"]

  - method: GET
    path: "/orders"
    description: "List orders; filter by customer_id or shop_id"
    roles: [ShopStaff, ProductionOperator, Customer]
    code: 200
    input: ["customer_id?", "shop_id?", "reordered_from_order_id?", "limit?", "offset?"]
    output: Order[]
    side_effects: []

  - method: GET
    path: "/orders/{order_id}"
    description: "Read an order (computed totals, both status dimensions)"
    roles: [ShopStaff, ProductionOperator, Customer]
    code: 200
    input: []
    output: Order
    side_effects: []

  - method: POST
    path: "/orders/{order_id}/reorder"
    description: "Clone an order's lines into a NEW draft order for the same customer"
    roles: [ShopStaff, Customer]
    code: 201
    input: ["expected_order_version"]
    output: Order
    side_effects:
      - "Creates a new Order with reordered_from_order_id = source id, production_status=DRAFT"
      - "Clones each source OrderLine (product_id, quantity, finishing_codes, service_level) as fresh OPEN lines"
      - "increments source Order.version by 1"

  - method: POST
    path: "/orders/{order_id}/confirm"
    description: "Confirm order: lock line prices, schedule capacity, compute totals"
    roles: [Customer]
    code: 200
    input: ["expected_order_version"]
    output: Order
    side_effects:
      - "Each line -> PRICE_LOCKED with snapshot final_line_cents/rush_surcharge_cents/production_units"
      - "Compute promised_ready_date per line and order (calc line_turnaround)"
      - "Compute subtotal/loyalty_discount/rush_fee/tax/total (calcs order_subtotal, order_loyalty_discount, order_total)"
      - "Create HELD CapacityReservation per line (calc daily_capacity_check)"
      - "production_status DRAFT -> CONFIRMED"
      - "increments Order.version by 1"

  - method: POST
    path: "/orders/{order_id}/cancel"
    description: "Cancel a DRAFT/CONFIRMED order; release reservations and press bookings"
    roles: [Customer]
    code: 200
    input: ["expected_order_version"]
    output: Order
    side_effects:
      - "production_status -> CANCELLED"
      - "Cascade: HELD CapacityReservations -> RELEASED; CONFIRMED PressBookings -> RELEASED"
      - "increments Order.version by 1"

  - method: POST
    path: "/orders/{order_id}/start-production"
    description: "Move a confirmed+invoiced order into production"
    roles: [ProductionOperator]
    code: 200
    input: []
    output: Order
    side_effects: ["production_status CONFIRMED -> IN_PRODUCTION"]

  - method: POST
    path: "/orders/{order_id}/invoice"
    description: "Invoice a confirmed order"
    roles: [ShopStaff]
    code: 200
    input: []
    output: Order
    side_effects: ["payment_status UNPAID -> INVOICED"]

  - method: POST
    path: "/orders/{order_id}/pay"
    description: "Customer pays the invoiced total"
    roles: [Customer]
    code: 200
    input: [amount_cents]
    output: Order
    side_effects: ["payment_status INVOICED -> PAID; Customer.lifetime_paid_cents += total_cents"]

  - method: POST
    path: "/orders/{order_id}/refund"
    description: "Refund a paid+cancelled order (compensating action)"
    roles: [ShopStaff]
    code: 200
    input: []
    output: Order
    side_effects: ["payment_status PAID -> REFUNDED; Customer.lifetime_paid_cents -= total_cents"]

  # ---- Order lines ----
  - method: POST
    path: "/order-lines"
    description: "Add a line to a draft order"
    roles: [ShopStaff, Customer]
    code: 201
    input: [order_id, product_id, quantity, "finishing_codes?", "service_level?"]
    output: OrderLine
    side_effects: ["Compute estimate_line_cents (calc estimate_line_price), production_units; status=OPEN"]

  - method: GET
    path: "/order-lines"
    description: "List order lines; filter by order_id or product_id"
    roles: [ShopStaff, ProductionOperator, Customer]
    code: 200
    input: ["order_id?", "product_id?", "limit?", "offset?"]
    output: OrderLine[]
    side_effects: []

  - method: GET
    path: "/order-lines/{order_line_id}"
    description: "Read an order line"
    roles: [ShopStaff, ProductionOperator, Customer]
    code: 200
    input: []
    output: OrderLine
    side_effects: []

  - method: PATCH
    path: "/order-lines/{order_line_id}"
    description: "Edit a draft (OPEN/PREFLIGHT_OK) line's quantity/finishing/service_level"
    roles: [ShopStaff, Customer]
    code: 200
    input: ["quantity?", "finishing_codes?", "service_level?"]
    output: OrderLine
    side_effects: ["Recompute estimate_line_cents, production_units"]

  - method: POST
    path: "/order-lines/{order_line_id}/produce"
    description: "Mark a price-locked line produced"
    roles: [ProductionOperator]
    code: 200
    input: []
    output: OrderLine
    side_effects: ["status PRICE_LOCKED -> PRODUCED; if all lines produced, Order -> READY"]

  # ---- Artwork ----
  - method: POST
    path: "/artworks"
    description: "Upload artwork for an order line"
    roles: [ShopStaff, Customer]
    code: 201
    input: [order_line_id, file_name, page_count, dpi, bleed_mm]
    output: Artwork
    side_effects: ["preflight_status=UPLOADED"]

  - method: GET
    path: "/artworks"
    description: "List artworks; filter by order_line_id"
    roles: [ShopStaff, ProductionOperator, Customer]
    code: 200
    input: ["order_line_id?", "limit?", "offset?"]
    output: Artwork[]
    side_effects: []

  - method: GET
    path: "/artworks/{artwork_id}"
    description: "Read an artwork (preflight status/reason)"
    roles: [ShopStaff, ProductionOperator, Customer]
    code: 200
    input: []
    output: Artwork
    side_effects: []

  - method: PATCH
    path: "/artworks/{artwork_id}"
    description: "Revise declared specs of a FAILED artwork (resets to UPLOADED)"
    roles: [Customer]
    code: 200
    input: ["page_count?", "dpi?", "bleed_mm?"]
    output: Artwork
    side_effects: ["preflight_status FAILED -> UPLOADED; clear preflight_reason"]

  - method: POST
    path: "/artworks/{artwork_id}/preflight"
    description: "Run preflight on an uploaded artwork"
    roles: [ProductionOperator]
    code: 200
    input: []
    output: Artwork
    side_effects:
      - "preflight_status -> PASSED or FAILED (DPI checked before BLEED)"
      - "On PASSED: OrderLine OPEN -> PREFLIGHT_OK"

  # ---- Proofs ----
  - method: POST
    path: "/proofs"
    description: "Operator submits a proof round for a preflight-ok line"
    roles: [ProductionOperator]
    code: 201
    input: [order_line_id]
    output: Proof
    side_effects: ["Proof status=SUBMITTED, round_number set; OrderLine PREFLIGHT_OK -> PROOF_PENDING"]

  - method: GET
    path: "/proofs"
    description: "List proofs; filter by order_line_id"
    roles: [ShopStaff, ProductionOperator, Customer]
    code: 200
    input: ["order_line_id?", "limit?", "offset?"]
    output: Proof[]
    side_effects: []

  - method: GET
    path: "/proofs/{proof_id}"
    description: "Read a proof"
    roles: [ShopStaff, ProductionOperator, Customer]
    code: 200
    input: []
    output: Proof
    side_effects: []

  - method: POST
    path: "/proofs/{proof_id}/approve"
    description: "Customer approves a submitted proof"
    roles: [Customer]
    code: 200
    input: []
    output: Proof
    side_effects: ["Proof -> APPROVED; OrderLine PROOF_PENDING -> PROOF_APPROVED"]

  - method: POST
    path: "/proofs/{proof_id}/request-changes"
    description: "Customer requests changes on a submitted proof"
    roles: [Customer]
    code: 200
    input: [change_note]
    output: Proof
    side_effects: ["Proof -> CHANGES_REQUESTED; OrderLine PROOF_PENDING -> PREFLIGHT_OK"]

  # ---- Fulfillment ----
  - method: POST
    path: "/fulfillments"
    description: "Schedule pickup or shipment for an order"
    roles: [ShopStaff, Customer]
    code: 201
    input: [order_id, method, "ship_address?", "ship_fee_cents?"]
    output: Fulfillment
    side_effects: ["status=SCHEDULED"]

  - method: GET
    path: "/fulfillments"
    description: "List fulfillments; filter by order_id"
    roles: [ShopStaff, ProductionOperator, Customer]
    code: 200
    input: ["order_id?", "limit?", "offset?"]
    output: Fulfillment[]
    side_effects: []

  - method: GET
    path: "/fulfillments/{fulfillment_id}"
    description: "Read a fulfillment"
    roles: [ShopStaff, ProductionOperator, Customer]
    code: 200
    input: []
    output: Fulfillment
    side_effects: []

  - method: POST
    path: "/fulfillments/{fulfillment_id}/hand-off"
    description: "Hand off a READY+PAID order; marks order FULFILLED"
    roles: [ShopStaff]
    code: 200
    input: []
    output: Fulfillment
    side_effects:
      - "Fulfillment -> HANDED_OFF; Order READY -> FULFILLED"
      - "Customer.completed_order_count += 1; recompute committed loyalty_score/tier"

  # ---- Press bookings ----
  - method: POST
    path: "/press-bookings"
    description: "Book press time for a BANNER line (requires_press)"
    roles: [ProductionOperator]
    code: 201
    input: [press_id, order_line_id, start_utc, end_utc]
    output: PressBooking
    side_effects: ["status=CONFIRMED (calc press_overlap_check guards)"]

  - method: GET
    path: "/press-bookings"
    description: "List press bookings; filter by press_id or order_line_id"
    roles: [ShopStaff, ProductionOperator, Customer]
    code: 200
    input: ["press_id?", "order_line_id?", "limit?", "offset?"]
    output: PressBooking[]
    side_effects: []

  - method: GET
    path: "/press-bookings/{press_booking_id}"
    description: "Read a press booking"
    roles: [ShopStaff, ProductionOperator, Customer]
    code: 200
    input: []
    output: PressBooking
    side_effects: []

  - method: POST
    path: "/press-bookings/{press_booking_id}/release"
    description: "Release a confirmed press booking"
    roles: [ProductionOperator]
    code: 200
    input: []
    output: PressBooking
    side_effects: ["status CONFIRMED -> RELEASED; slot freed"]

  # ---- Capacity reservations (reverse-reachability for CapacityReservation FKs) ----
  - method: GET
    path: "/capacity-reservations"
    description: "List capacity reservations; filter by shop_id, order_line_id, or production_date"
    roles: [ShopStaff, ProductionOperator]
    code: 200
    input: ["shop_id?", "order_line_id?", "production_date?", "limit?", "offset?"]
    output: CapacityReservation[]
    side_effects: []

  - method: GET
    path: "/capacity-reservations/{capacity_reservation_id}"
    description: "Read a capacity reservation"
    roles: [ShopStaff, ProductionOperator]
    code: 200
    input: []
    output: CapacityReservation
    side_effects: []

  # ---- Test-driving clock ----
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Pin the system clock for deterministic turnaround/rush-cutoff tests"
    roles: [ShopStaff]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["All subsequent current_utc reads return to_iso8601 until changed"]

  # ---- Test-driving loyalty injection ----
  # Realized committed loyalty (completed_order_count / lifetime_paid_cents / tier)
  # is otherwise reachable only by running many full order lifecycles to hand-off.
  # Per §1.5 priority ladder rung 3, a test-driving endpoint sets it directly so a
  # loyalty-dependent test need not replay three order lifecycles in its setup chain.
  - method: POST
    path: "/_inject/customer-loyalty"
    description: "Directly set a customer's committed loyalty fields (test-driving)"
    roles: [ShopStaff]
    code: 200
    input: [customer_id, completed_order_count, lifetime_paid_cents, loyalty_score, loyalty_tier]
    output: Customer
    side_effects: ["Customer.completed_order_count/lifetime_paid_cents/loyalty_score/loyalty_tier set to the supplied values"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing X-User-Role or X-User-ID header" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Role not permitted for this operation" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "A referenced resource does not exist" }
  - { id: ERR_NOT_ORDER_OWNER, http: 403, condition: "Customer is not the owner of the targeted order/proof/line" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Resource not in a valid state for the requested transition" }
  - { id: ERR_STALE_ORDER_VERSION, http: 412, condition: "expected_order_version does not match Order.version (OCC)" }
  - { id: ERR_VALIDATION, http: 400, condition: "Malformed request or missing required body field" }
  - { id: ERR_FINISHING_NOT_FOR_PRODUCT, http: 422, condition: "A finishing_code does not belong to the line's product" }
  - { id: ERR_PRODUCT_INACTIVE, http: 409, condition: "Product.active is false when adding it to a line" }
  - { id: ERR_LINE_NOT_LOCKABLE, http: 409, condition: "A line is not proof-approved/preflight-ok or lacks a required confirmed press booking at confirm" }
  - { id: ERR_FULFILLMENT_REQUIRED, http: 409, condition: "Confirm attempted without a Fulfillment for the order" }
  - { id: ERR_FULFILLMENT_FIELDS_INVALID, http: 422, condition: "SHIP missing address/fee, or PICKUP carries an address/non-zero fee" }
  - { id: ERR_PRESS_DOUBLE_BOOKED, http: 409, condition: "Press booking overlaps a confirmed booking (including cleanup buffer)" }
  - { id: ERR_BOOKING_INTERVAL_INVALID, http: 422, condition: "PressBooking end_utc not strictly after start_utc" }
  - { id: ERR_CAPACITY_EXCEEDED, http: 409, condition: "Confirm would push a production_date over Shop.daily_unit_capacity" }
  - { id: ERR_PAYMENT_AMOUNT_MISMATCH, http: 422, condition: "Pay amount_cents != Order.total_cents" }
  - { id: ERR_PROOF_NOT_REQUIRED, http: 409, condition: "Proof submitted for a line whose product does not require a proof" }
  - { id: ERR_CHANGE_NOTE_REQUIRED, http: 422, condition: "request-changes called without change_note" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: ShopStaff
    description: "Front-of-house staff: runs catalog/pricing config, invoicing, fulfillment hand-off, refunds, presses."
    identity: opaque
    exclusive_operations:
      - "POST /shops — create shop"
      - "POST /products, PATCH /products/{id} — catalog management"
      - "POST /pricing-tiers, POST /finishing-options — pricing config"
      - "POST /presses — register press"
      - "POST /orders/{id}/invoice — invoice order"
      - "POST /orders/{id}/refund — refund order"
      - "POST /fulfillments/{id}/hand-off — hand off order"
    shared_operations:
      - "POST /customers — register customer (shared with Customer)"
      - "POST /orders, POST /order-lines, PATCH /order-lines/{id} — create on a customer's behalf (shared with Customer)"
      - "POST /artworks, POST /fulfillments — shared with Customer"
      - "GET reads — shared across roles"

  - name: ProductionOperator
    description: "Back-of-house operator: preflight, proofs (submit), press bookings, production, start-production."
    identity: opaque
    exclusive_operations:
      - "POST /artworks/{id}/preflight — run preflight"
      - "POST /proofs — submit proof round"
      - "POST /press-bookings, POST /press-bookings/{id}/release — press scheduling"
      - "POST /order-lines/{id}/produce — mark produced"
      - "POST /orders/{id}/start-production — start production"
    shared_operations:
      - "GET reads — shared across roles"

  - name: Customer
    description: "End customer: owns their orders; approves/requests-changes on proofs, confirms, pays, cancels, reorders."
    identity: "entity_backed:Customer"
    exclusive_operations:
      - "POST /orders/{id}/confirm — confirm own order"
      - "POST /orders/{id}/cancel — cancel own order"
      - "POST /orders/{id}/pay — pay own order"
      - "POST /orders/{id}/reorder — reorder own order"
      - "POST /proofs/{id}/approve, POST /proofs/{id}/request-changes — proof decisions on own line"
      - "PATCH /artworks/{id} — revise own failed artwork"
    shared_operations:
      - "POST /customers — self-register (shared with ShopStaff)"
      - "POST /orders, POST /order-lines, PATCH /order-lines/{id}, POST /artworks, POST /fulfillments — shared with ShopStaff"
      - "GET reads — shared across roles"
