# =============================================================================
# task_2211 — Placement Testing, Course Placement & Corequisite Remediation
# Seed tables §1.0–§1.7. §1.8 lives in SCAFFOLD_DIFFICULTY_DESIGN.yaml,
# §1.9 lives in SCAFFOLD_CORNER_DESIGN.yaml.
# =============================================================================

scenario: |
  2211. Placement Testing, Course Placement & Corequisite Remediation (community college assessment office): multiple measures placement using transcript, test score and self-guided placement, test administration, proctoring and retake policy with waiting periods, corequisite support course pairing and section capacity planning, placement appeal and instructor override workflow, cut-score validation studies against course success rates, prerequisite enforcement in registration with override authority, English learner placement pathways, disaggregated outcome reporting for equity review

domain_name: placement-testing-corequisite
api_prefix: ""   # all collections are root-level (flat/graph topology, no single owning aggregate)

complexity_profile:
  difficulty_level: beyond_expert   # deliberately above §0.4 Expert: 12 entities, 13 state machines (2 parallel axes on one entity), 14 calculations, 30 ordered validations, 69 endpoints, 68 errors
  primary_archetype: graph_constraint
  secondary_archetype: quota_allocation
  complexity_layers:
    - selector_policy               # multiple-measures rule selection: eligibility filter + ranking + tie-break + empty-pool fallback
    - dual_variant_calculation      # strict vs inclusive validation cohort; committed vs paired-conservative seats
    - cascading_side_effects        # attempt void and appeal grant both fan through 4+ hops
    - optimistic_concurrency        # OCC on Student.version / Section.version / PlacementDetermination.version

  entity_topology: graph
  # Course<->Course prerequisite DAG via CourseRequisite junction; Section<->Section
  # corequisite pairing (self-referential); Registration<->Registration coreq linkage.
  # No nesting in URL paths — every entity is a root-level collection joined by FK.

  state_machine_shape: cyclic
  # PlacementAppeal: UNDER_REVIEW -> INFO_REQUESTED -> UNDER_REVIEW revision loop (max 2 rounds).
  # CutScoreValidationStudy: COMPLETED -> RUNNING re-run loop.
  # PlacementDetermination: FINAL -> APPEALED -> FINAL, plus a PARALLEL evidence_state axis.
  # TestAttempt / Registration / Section: branching fork with divergent side-effect sets.

  relationship_patterns:
    - one_to_many          # Student -> TestAttempt, Section -> Registration
    - many_to_many         # Course <-> Course through CourseRequisite
    - self_referential     # CourseRequisite (Course->Course), Section.linked_section_id, Registration.coreq_registration_id, PlacementDetermination.superseded_by_id
    - cross_aggregate      # PlacementDetermination gates Registration; Registration grades feed CutScoreValidationStudy

  role_model: segregation_of_duties
  # SoD-1: CutScoreValidationStudy.decided_by_user_id != proposed_by_user_id.
  # SoD-2: PlacementAppeal.reviewed_by_user_id != the determination's determined_by_user_id.
  # SoD-3: PlacementAppeal.endorsed_by_user_id != reviewed_by_user_id.

  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:

  # ---------------------------------------------------------------- Student
  - name: Student
    parent: null
    common_fields: true
    fields:
      - name: student_number
        type: string
        source: input
        description: college-assigned student number
        constraints: "unique across all Students; 1-20 chars"
      - name: full_name
        type: string
        source: input
        description: student legal name
      - name: race_ethnicity_code
        type: enum
        source: input
        description: disaggregation key for equity review
        constraints: "one of {AIAN, ASIAN, BLACK, HISPANIC, MULTI, NHPI, WHITE, UNKNOWN}"
      - name: first_generation
        type: boolean
        source: input
        default: false
        description: first-generation-college flag, disaggregation key
      - name: pell_eligible
        type: boolean
        source: input
        default: false
        description: Pell grant eligibility, disaggregation key
      - name: el_status
        type: enum
        source: input
        default: NOT_EL
        description: English learner status driving EL placement pathways
        constraints: "one of {NOT_EL, EL_ACTIVE, EL_EXITED}"
      - name: hs_gpa
        type: number
        source: input
        default: null
        description: high-school GPA; supplied on POST /students or updated through POST /students/{student_id}/measures
        constraints: "null or 0.00-4.50, exactly 2 decimal places"
      - name: transcript_recorded_at
        type: datetime
        source: input
        default: null
        description: "instant at which the sending high school recorded the transcript GPA; client-supplied and normally EARLIER than the logical clock, since calculations.placement_validity_window measures staleness from it"
      - name: hs_transcript_status
        type: enum
        source: input
        default: NONE
        description: verification posture of the transcript measure
        constraints: "one of {NONE, SELF_REPORTED, VERIFIED}"
      - name: self_guided_pathway
        type: enum
        source: input
        default: null
        description: self-guided placement pathway the student selected
        constraints: "null or one of {STEM, BSTEM, NON_STEM}"
      - name: attempt_counts
        type: object
        source: computed
        description: "count of TestAttempt with state == SCORED per subject_area; shape { MATH: integer, ENGLISH: integer, ESL: integer }; VOIDED and NO_SHOW attempts are excluded"
      - name: remaining_attempts
        type: object
        source: computed
        description: "MAX_ATTEMPTS_PER_SUBJECT minus attempt_counts per subject; shape { MATH: integer, ENGLISH: integer, ESL: integer }; floor 0"
      - name: placement_status
        type: enum
        source: computed
        description: "FINAL if the Student has >=1 PlacementDetermination with placement_state == FINAL; else PROVISIONAL if >=1 with placement_state IN {PROVISIONAL, APPEALED}; else UNPLACED"
        constraints: "one of {UNPLACED, PROVISIONAL, FINAL}"
      - name: advising_hold
        type: boolean
        source: computed
        description: "true iff the Student has >=1 PlacementDetermination whose evidence_state == DISPUTED, OR >=1 PlacementDetermination with placement_state == APPEALED"

  # ---------------------------------------------------------------- Course
  - name: Course
    parent: null
    common_fields: true
    fields:
      - name: course_code
        type: string
        source: input
        description: catalog course code
        constraints: "unique across all Courses; 2-16 chars"
      - name: title
        type: string
        source: input
        description: course title
      - name: subject_area
        type: enum
        source: input
        description: subject family used by placement rules
        constraints: "one of {MATH, ENGLISH, ESL, OTHER}"
      - name: level_rank
        type: integer
        source: input
        description: "curricular altitude; higher is more advanced. Transfer-level == 100, corequisite support == 90, below-transfer == 80/70"
        constraints: "1-100"
      - name: units
        type: number
        source: input
        description: credit units
        constraints: "0.5-6.0, 1 decimal place"
      - name: is_support_course
        type: boolean
        source: input
        default: false
        description: true when the course is a corequisite support course
      - name: transfer_level
        type: boolean
        source: input
        default: false
        description: true when the course is transfer-level (degree applicable)
      - name: status
        type: enum
        source: system
        default: ACTIVE
        description: catalog lifecycle
        constraints: "one of {ACTIVE, RETIRED}"
      - name: enrolled_count
        type: integer
        source: computed
        description: "count of Registration rows for Sections of this Course with state IN {ENROLLED, COMPLETED}"
      - name: success_count
        type: integer
        source: computed
        description: "count of Registration rows for Sections of this Course with state == COMPLETED AND final_grade IN {A, B, C, P}"
      - name: success_rate
        type: number
        source: computed
        default: null
        description: "null when no Registration for this Course has state == COMPLETED; else round(success_count / count(state == COMPLETED), 4)"

  # ------------------------------------------------------- CourseRequisite
  - name: CourseRequisite
    parent: null
    common_fields: true
    fields:
      - name: course_id
        type: string
        source: input
        description: "FK -> Course.id; the course that carries the requisite"
      - name: requisite_course_id
        type: string
        source: input
        description: "FK -> Course.id; the course that must be satisfied"
      - name: requisite_type
        type: enum
        source: input
        description: requisite kind
        constraints: "one of {PREREQUISITE, COREQUISITE, ADVISORY}"
      - name: min_grade
        type: enum
        source: input
        default: C
        description: minimum grade in the requisite course that counts as satisfied
        constraints: "one of {A, B, C, P}"
      - name: enforcement
        type: enum
        source: input
        default: BLOCKING
        description: BLOCKING requisites are enforced at registration; WARNING and ADVISORY are recorded only
        constraints: "one of {BLOCKING, WARNING}"
      - name: status
        type: enum
        source: system
        default: ACTIVE
        description: requisite lifecycle
        constraints: "one of {ACTIVE, RETIRED}"

  # ---------------------------------------------------------- PlacementRule
  - name: PlacementRule
    parent: null
    common_fields: true
    fields:
      - name: subject_area
        type: enum
        source: input
        description: subject the rule places into
        constraints: "one of {MATH, ENGLISH, ESL}"
      - name: measure_type
        type: enum
        source: input
        description: which of the multiple measures this rule reads
        constraints: "one of {TRANSCRIPT_GPA, TEST_SCORE, SELF_GUIDED}"
      - name: target_course_id
        type: string
        source: input
        description: "FK -> Course.id; the course the student is placed into"
      - name: coreq_course_id
        type: string
        source: input
        default: null
        description: "FK -> Course.id; the corequisite support course attached to the placement, null when coreq_required is false"
      - name: coreq_required
        type: boolean
        source: input
        default: false
        description: true when a placement produced by this rule must carry a corequisite support course
      - name: priority_rank
        type: integer
        source: input
        description: operator-assigned rank used as the third sort key of the selector; lower wins
        constraints: "1-999"
      - name: min_hs_gpa
        type: number
        source: input
        default: null
        description: "inclusive lower GPA bound for measure_type == TRANSCRIPT_GPA"
        constraints: "null or 0.00-4.50, 2 decimal places"
      - name: max_hs_gpa
        type: number
        source: input
        default: null
        description: "EXCLUSIVE upper GPA bound for measure_type == TRANSCRIPT_GPA"
        constraints: "null or 0.00-4.50, 2 decimal places; when both set, min_hs_gpa < max_hs_gpa"
      - name: min_score
        type: integer
        source: input
        default: null
        description: "inclusive lower scaled-score bound for measure_type == TEST_SCORE"
        constraints: "null or 0-1000"
      - name: max_score
        type: integer
        source: input
        default: null
        description: "INCLUSIVE upper scaled-score bound for measure_type == TEST_SCORE"
        constraints: "null or 0-1000; when both set, min_score <= max_score"
      - name: required_el_status
        type: enum
        source: input
        default: null
        description: "when set, the rule is eligible only for Students whose el_status equals this value"
        constraints: "null or one of {NOT_EL, EL_ACTIVE, EL_EXITED}"
      - name: required_self_guided_pathway
        type: enum
        source: input
        default: null
        description: "required Student.self_guided_pathway for measure_type == SELF_GUIDED"
        constraints: "null or one of {STEM, BSTEM, NON_STEM}"
      - name: effective_from
        type: datetime
        source: input
        description: inclusive start of the rule's effective window
      - name: effective_to
        type: datetime
        source: input
        default: null
        description: exclusive end of the rule's effective window; null means open-ended
      - name: version_label
        type: string
        source: input
        description: human-readable cut-score version label
      - name: status
        type: enum
        source: system
        default: DRAFT
        description: rule lifecycle
        constraints: "one of {DRAFT, ACTIVE, SUPERSEDED, RETIRED}"
      - name: activated_at
        type: datetime
        source: system
        default: null
        description: logical-clock instant at which the rule became ACTIVE

  # --------------------------------------------------- TestAdministration
  - name: TestAdministration
    parent: null
    common_fields: true
    fields:
      - name: room_code
        type: string
        source: input
        description: physical testing room identifier; the resource whose time is exclusively occupied
      - name: subject_area
        type: enum
        source: input
        description: subject tested in this session
        constraints: "one of {MATH, ENGLISH, ESL}"
      - name: proctor_user_id
        type: string
        source: input
        description: "opaque X-User-ID of the TestProctor assigned to the session (TestProctor is an opaque role, so this is NOT a foreign key)"
      - name: starts_at
        type: datetime
        source: input
        description: inclusive session start
      - name: ends_at
        type: datetime
        source: input
        description: exclusive session end
        constraints: "ends_at > starts_at; duration <= 480 minutes"
      - name: seat_capacity
        type: integer
        source: input
        description: number of testing seats in the room
        constraints: "1-200"
      - name: duration_minutes
        type: integer
        source: computed
        description: "integer minutes between starts_at and ends_at"
      - name: seats_booked
        type: integer
        source: computed
        description: "count of TestAttempt for this administration with state IN {BOOKED, CHECKED_IN, SCORED}"
      - name: status
        type: enum
        source: system
        default: SCHEDULED
        description: session lifecycle
        constraints: "one of {SCHEDULED, OPEN, CLOSED, CANCELLED}"

  # ------------------------------------------------------------ TestAttempt
  - name: TestAttempt
    parent: null
    common_fields: true
    fields:
      - name: student_id
        type: string
        source: input
        description: "FK -> Student.id"
      - name: administration_id
        type: string
        source: input
        description: "FK -> TestAdministration.id"
      - name: subject_area
        type: enum
        source: computed
        description: "copied from TestAdministration.subject_area at booking; never changes afterwards"
        constraints: "one of {MATH, ENGLISH, ESL}"
      - name: attempt_ordinal
        type: integer
        source: computed
        description: "1-based index of this attempt among the Student's TestAttempts in the same subject_area with state != VOIDED, ordered by created_at ASC; renumbered whenever any sibling attempt is voided"
      - name: raw_score
        type: integer
        source: system
        default: null
        description: raw score recorded at scoring
        constraints: "null or 0-160"
      - name: scaled_score
        type: integer
        source: computed
        default: null
        description: "scaled score derived from raw_score by calculations.attempt_scaled_score"
        constraints: "null or 0-1000"
      - name: irregularity_flag
        type: boolean
        source: system
        default: false
        description: proctor-recorded testing irregularity, penalises the scaled score
      - name: scored_at
        type: datetime
        source: system
        default: null
        description: logical-clock instant of the SCORED transition
      - name: next_eligible_at
        type: datetime
        source: computed
        default: null
        description: "earliest instant at which the Student may book another attempt in this subject_area; null until state == SCORED"
      - name: void_reason
        type: enum
        source: system
        default: null
        description: reason recorded on the VOIDED transition
        constraints: "null or one of {IRREGULARITY, PROCTOR_ERROR, ADMIN_CORRECTION}"
      - name: state
        type: enum
        source: system
        default: BOOKED
        description: attempt lifecycle
        constraints: "one of {BOOKED, CHECKED_IN, SCORED, VOIDED, NO_SHOW}"

  # ------------------------------------------------- PlacementDetermination
  - name: PlacementDetermination
    parent: null
    common_fields: true
    fields:
      - name: student_id
        type: string
        source: input
        description: "FK -> Student.id"
      - name: subject_area
        type: enum
        source: input
        description: subject being placed
        constraints: "one of {MATH, ENGLISH, ESL}"
      - name: measure_type_used
        type: enum
        source: computed
        description: "measure_type of the PlacementRule the selector picked; APPEAL_OVERRIDE when the determination was minted by a granted PlacementAppeal"
        constraints: "one of {TRANSCRIPT_GPA, TEST_SCORE, SELF_GUIDED, APPEAL_OVERRIDE}"
      - name: applied_rule_id
        type: string
        source: computed
        default: null
        description: "FK -> PlacementRule.id; null iff measure_type_used == APPEAL_OVERRIDE"
      - name: placed_course_id
        type: string
        source: computed
        description: "FK -> Course.id; the course the student is placed into"
      - name: coreq_course_id
        type: string
        source: computed
        default: null
        description: "FK -> Course.id; corequisite support course, null when the applied rule has coreq_required == false"
      - name: source_attempt_id
        type: string
        source: computed
        default: null
        description: "FK -> TestAttempt.id; the SCORED attempt the selector read, null unless measure_type_used == TEST_SCORE"
      - name: superseded_by_id
        type: string
        source: system
        default: null
        description: "FK -> PlacementDetermination.id; the determination that replaced this one"
      - name: base_confidence_score
        type: number
        source: computed
        description: "weighted multi-measure confidence BEFORE staleness penalty, 1 decimal place"
      - name: staleness_penalty
        type: number
        source: computed
        description: "transcript-age penalty subtracted from base_confidence_score, 1 decimal place, 0.0-20.0"
      - name: confidence_score
        type: number
        source: computed
        description: "max(0.0, base_confidence_score - staleness_penalty), 1 decimal place"
      - name: validity_days
        type: integer
        source: computed
        description: "placement validity horizon selected from base_confidence_score (NOT from confidence_score)"
        constraints: "one of {180, 365, 730}"
      - name: expires_at
        type: datetime
        source: computed
        description: "determined_at + validity_days days"
      - name: determined_by_user_id
        type: string
        source: system
        description: "opaque X-User-ID of the Counselor who created the determination, or of the appeal decider for APPEAL_OVERRIDE determinations"
      - name: determined_at
        type: datetime
        source: system
        description: logical-clock instant of creation
      - name: placement_state
        type: enum
        source: system
        default: PROVISIONAL
        description: primary lifecycle axis
        constraints: "one of {PROVISIONAL, FINAL, APPEALED, SUPERSEDED}"
      - name: evidence_state
        type: enum
        source: system
        description: "INDEPENDENT second lifecycle axis tracking evidence quality; initial value computed at creation"
        constraints: "one of {UNVERIFIED, VERIFIED, DISPUTED}"

  # ------------------------------------------------------- PlacementAppeal
  - name: PlacementAppeal
    parent: null
    common_fields: true
    fields:
      - name: determination_id
        type: string
        source: input
        description: "FK -> PlacementDetermination.id; the determination being appealed"
      - name: student_id
        type: string
        source: computed
        description: "FK -> Student.id; copied from the appealed determination"
      - name: requested_course_id
        type: string
        source: input
        description: "FK -> Course.id; the course the student asks to be placed into"
      - name: grounds
        type: enum
        source: input
        description: statutory grounds for the appeal
        constraints: "one of {NEW_TRANSCRIPT, TEST_IRREGULARITY, EL_PATHWAY, OTHER}"
      - name: statement
        type: string
        source: input
        description: student narrative supporting the appeal
        constraints: "1-2000 chars"
      - name: revision_round
        type: integer
        source: computed
        default: 0
        description: "number of completed INFO_REQUESTED -> UNDER_REVIEW resubmission cycles"
        constraints: "0-2"
      - name: info_request_note
        type: string
        source: system
        default: null
        description: reviewer note recorded on the most recent INFO_REQUESTED transition
      - name: reviewed_by_user_id
        type: string
        source: system
        default: null
        description: opaque X-User-ID of the Registrar or Counselor who took the appeal under review and decided it
      - name: endorsed_by_user_id
        type: string
        source: system
        default: null
        description: opaque X-User-ID of the Instructor who endorsed the appeal
      - name: decision_note
        type: string
        source: system
        default: null
        description: note recorded on the GRANTED or DENIED transition
      - name: filed_at
        type: datetime
        source: system
        description: logical-clock instant of appeal creation
      - name: decided_at
        type: datetime
        source: system
        default: null
        description: logical-clock instant of the terminal decision
      - name: minted_determination_id
        type: string
        source: system
        default: null
        description: "FK -> PlacementDetermination.id; the APPEAL_OVERRIDE determination created by the GRANTED transition"
      - name: state
        type: enum
        source: system
        default: SUBMITTED
        description: appeal lifecycle
        constraints: "one of {SUBMITTED, UNDER_REVIEW, INFO_REQUESTED, INSTRUCTOR_ENDORSED, GRANTED, DENIED, WITHDRAWN}"

  # --------------------------------------------------------------- Section
  - name: Section
    parent: null
    common_fields: true
    fields:
      - name: course_id
        type: string
        source: input
        description: "FK -> Course.id"
      - name: term_code
        type: string
        source: input
        description: term identifier
        constraints: "5-10 chars"
      - name: room_code
        type: string
        source: input
        description: meeting room identifier
      - name: meets_start_at
        type: datetime
        source: input
        description: inclusive start of the weekly meeting block
      - name: meets_end_at
        type: datetime
        source: input
        description: exclusive end of the weekly meeting block
        constraints: "meets_end_at > meets_start_at"
      - name: seat_capacity
        type: integer
        source: input
        description: hard seat count
        constraints: "1-300"
      - name: seats_taken
        type: integer
        source: computed
        description: "count of Registration for this Section with state IN {ENROLLED, COMPLETED}"
      - name: seats_held
        type: integer
        source: computed
        description: "count of Registration for this Section with state == PENDING"
      - name: waitlist_count
        type: integer
        source: computed
        description: "count of Registration for this Section with state == WAITLISTED"
      - name: available_seats
        type: integer
        source: computed
        description: "remaining bookable seats per calculations.section_available_seats; variant depends on pairing_state"
      - name: linked_section_id
        type: string
        source: system
        default: null
        description: "FK -> Section.id; the other half of the corequisite pair"
      - name: role_in_pair
        type: enum
        source: system
        default: NONE
        description: which half of the pair this section is
        constraints: "one of {NONE, PRIMARY, SUPPORT}"
      - name: pairing_state
        type: enum
        source: system
        default: UNPAIRED
        description: corequisite pairing posture
        constraints: "one of {UNPAIRED, PAIRED, PAIR_BROKEN}"
      - name: status
        type: enum
        source: system
        default: PLANNED
        description: section lifecycle
        constraints: "one of {PLANNED, OPEN, CLOSED, CANCELLED}"

  # ---------------------------------------------------------- Registration
  - name: Registration
    parent: null
    common_fields: true
    fields:
      - name: student_id
        type: string
        source: input
        description: "FK -> Student.id"
      - name: section_id
        type: string
        source: input
        description: "FK -> Section.id"
      - name: coreq_registration_id
        type: string
        source: system
        default: null
        description: "FK -> Registration.id; the paired support-section Registration created alongside this one"
      - name: override_id
        type: string
        source: input
        default: null
        description: "FK -> PrerequisiteOverride.id; the override presented to satisfy a BLOCKING prerequisite"
      - name: prerequisite_status
        type: enum
        source: computed
        description: "per calculations.prerequisite_satisfaction_closure"
        constraints: "one of {SATISFIED, OVERRIDDEN, UNMET}"
      - name: term_units_at_confirm
        type: number
        source: computed
        default: null
        description: "total term units the student holds after this registration is confirmed, per calculations.term_unit_load; null until confirm"
      - name: final_grade
        type: enum
        source: system
        default: null
        description: grade recorded at the COMPLETED transition
        constraints: "null or one of {A, B, C, D, F, P, NP, W}"
      - name: graded_at
        type: datetime
        source: system
        default: null
        description: logical-clock instant of grading
      - name: success
        type: boolean
        source: computed
        description: "true iff final_grade IN {A, B, C, P}; false when final_grade is null or IN {D, F, NP, W}"
      - name: denial_reason
        type: enum
        source: system
        default: null
        description: reason recorded on the DENIED transition
        constraints: "null or one of {PLACEMENT_SUPERSEDED, EVIDENCE_DISPUTED, SECTION_CANCELLED}"
      - name: state
        type: enum
        source: system
        default: PENDING
        description: registration lifecycle
        constraints: "one of {PENDING, ENROLLED, WAITLISTED, DENIED, DROPPED, COMPLETED}"

  # --------------------------------------------------- PrerequisiteOverride
  - name: PrerequisiteOverride
    parent: null
    common_fields: true
    fields:
      - name: student_id
        type: string
        source: input
        description: "FK -> Student.id"
      - name: course_id
        type: string
        source: input
        description: "FK -> Course.id; the course whose prerequisite is being waived"
      - name: requisite_id
        type: string
        source: input
        description: "FK -> CourseRequisite.id; the specific BLOCKING requisite edge being waived"
      - name: justification
        type: string
        source: input
        description: instructor rationale
        constraints: "10-1000 chars"
      - name: expires_at
        type: datetime
        source: input
        description: exclusive expiry instant of the override
      - name: issued_by_user_id
        type: string
        source: system
        description: opaque X-User-ID of the issuing Instructor
      - name: consumed_by_registration_id
        type: string
        source: system
        default: null
        description: "FK -> Registration.id; the registration that consumed the override"
      - name: state
        type: enum
        source: system
        default: ISSUED
        description: override lifecycle
        constraints: "one of {ISSUED, CONSUMED, REVOKED, EXPIRED}"

  # -------------------------------------------- CutScoreValidationStudy
  - name: CutScoreValidationStudy
    parent: null
    common_fields: true
    fields:
      - name: subject_area
        type: enum
        source: input
        description: subject under study
        constraints: "one of {MATH, ENGLISH, ESL}"
      - name: candidate_rule_id
        type: string
        source: input
        description: "FK -> PlacementRule.id; the DRAFT rule whose cut score this study validates"
      - name: window_start_at
        type: datetime
        source: input
        description: inclusive start of the outcome observation window
      - name: window_end_at
        type: datetime
        source: input
        description: exclusive end of the outcome observation window
        constraints: "window_end_at > window_start_at"
      - name: strict_cohort_size
        type: integer
        source: computed
        default: 0
        description: "cohort size under the strict_cohort variant of calculations.cut_score_validation_outcome"
      - name: strict_success_count
        type: integer
        source: computed
        default: 0
        description: successful outcomes inside the strict cohort
      - name: strict_success_rate
        type: number
        source: computed
        default: null
        description: "round(strict_success_count / strict_cohort_size, 4); null when strict_cohort_size == 0"
      - name: inclusive_cohort_size
        type: integer
        source: computed
        default: 0
        description: "cohort size under the inclusive_cohort variant"
      - name: inclusive_success_count
        type: integer
        source: computed
        default: 0
        description: successful outcomes inside the inclusive cohort
      - name: inclusive_success_rate
        type: number
        source: computed
        default: null
        description: "round(inclusive_success_count / inclusive_cohort_size, 4); null when inclusive_cohort_size == 0"
      - name: disproportionate_impact_index
        type: number
        source: computed
        default: null
        description: "per calculations.disproportionate_impact_index; null when the study has never been run"
      - name: reference_group_key
        type: string
        source: computed
        default: null
        description: race_ethnicity_code of the reference group used by the impact index
      - name: run_count
        type: integer
        source: computed
        default: 0
        description: number of completed RUNNING -> COMPLETED cycles
      - name: proposed_by_user_id
        type: string
        source: system
        description: opaque X-User-ID of the AssessmentDirector who created the study
      - name: decided_by_user_id
        type: string
        source: system
        default: null
        description: opaque X-User-ID of the AssessmentDirector who approved or rejected the study
      - name: decision_note
        type: string
        source: system
        default: null
        description: note recorded on the APPROVED or REJECTED transition
      - name: state
        type: enum
        source: system
        default: DRAFT
        description: study lifecycle
        constraints: "one of {DRAFT, RUNNING, COMPLETED, APPROVED, REJECTED, WITHDRAWN}"

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:

  # -------------------------------------------------- Course.status (linear)
  - entity: Course
    state_field: status
    initial_state: ACTIVE
    terminal_states: [RETIRED]
    transitions:
      - from: ACTIVE
        to: RETIRED
        trigger: "POST /courses/{course_id}/retire"
        actor: SystemAdmin
        preconditions:
          - "Course.status == ACTIVE"
          - "no Section with course_id == Course.id has status IN {PLANNED, OPEN} (else ERR_COURSE_HAS_LIVE_SECTIONS)"
        side_effects:
          - "HOP 1: every CourseRequisite with (course_id == Course.id OR requisite_course_id == Course.id) AND status == ACTIVE transitions ACTIVE -> RETIRED"
          - "HOP 1: every PlacementRule with (target_course_id == Course.id OR coreq_course_id == Course.id) AND status IN {DRAFT, ACTIVE, SUPERSEDED} transitions to RETIRED"
          - "HOP 2 (caused by the PlacementRule -> RETIRED hop, not by the retire request): every CutScoreValidationStudy whose candidate_rule_id is one of the just-RETIRED rules AND state IN {DRAFT, RUNNING, COMPLETED} transitions to WITHDRAWN with decision_note = 'candidate rule retired'"
          - "HOP 3 (caused by the CourseRequisite -> RETIRED hop): every PrerequisiteOverride whose requisite_id is one of the just-RETIRED requisites AND state == ISSUED transitions ISSUED -> REVOKED"
          - "increments Course.version by 1, and the version of every entity mutated in HOP 1-3 by 1 each"

  # ------------------------------------- CourseRequisite.status (linear)
  - entity: CourseRequisite
    state_field: status
    initial_state: ACTIVE
    terminal_states: [RETIRED]
    transitions:
      - from: ACTIVE
        to: RETIRED
        trigger: "POST /course-requisites/{requisite_id}/retire"
        actor: SystemAdmin
        preconditions:
          - "CourseRequisite.status == ACTIVE"
        side_effects:
          - "HOP 1: every PrerequisiteOverride with requisite_id == CourseRequisite.id AND state == ISSUED transitions ISSUED -> REVOKED"
          - "HOP 2 (caused by HOP 1): every Registration whose override_id is one of the just-REVOKED overrides AND state == PENDING has prerequisite_status recomputed by calculations.prerequisite_satisfaction_closure, which now yields UNMET"
          - "increments CourseRequisite.version by 1"
      - from: ACTIVE
        to: RETIRED
        trigger: "system cascade from POST /courses/{course_id}/retire"
        actor: system
        preconditions:
          - "CourseRequisite.status == ACTIVE"
          - "CourseRequisite.course_id == retired Course.id OR CourseRequisite.requisite_course_id == retired Course.id"
        side_effects:
          - "same HOP 1 / HOP 2 chain as the operator-triggered retire"

  # ------------------------------------------ PlacementRule.status (branching)
  - entity: PlacementRule
    state_field: status
    initial_state: DRAFT
    terminal_states: [RETIRED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /placement-rules/{rule_id}/activate"
        actor: AssessmentDirector
        preconditions:
          - "PlacementRule.status == DRAFT"
          - "Course with id == target_course_id has status == ACTIVE"
          - "coreq_required == false, OR (coreq_course_id is not null AND that Course has status == ACTIVE AND is_support_course == true) (else ERR_COREQ_COURSE_INVALID)"
          - "measure_type == TRANSCRIPT_GPA requires at least one of min_hs_gpa / max_hs_gpa non-null; TEST_SCORE requires at least one of min_score / max_score non-null; SELF_GUIDED requires required_self_guided_pathway non-null (else ERR_RULE_MEASURE_INCOMPLETE)"
        side_effects:
          - "sets activated_at = logical clock"
          - "HOP 1: every other PlacementRule with the same (subject_area, measure_type, target_course_id) AND status == ACTIVE (version_label is NOT part of the supersession key; rules that target a DIFFERENT course coexist as separate placement bands) transitions ACTIVE -> SUPERSEDED"
          - "increments PlacementRule.version by 1"
      - from: DRAFT
        to: ACTIVE
        trigger: "system cascade from POST /validation-studies/{study_id}/decide with decision == APPROVE"
        actor: system
        preconditions:
          - "PlacementRule.status == DRAFT"
          - "PlacementRule.id == CutScoreValidationStudy.candidate_rule_id"
        side_effects:
          - "sets activated_at = logical clock"
          - "HOP 2 of the study-approval cascade: every other PlacementRule with the same (subject_area, measure_type, target_course_id) AND status == ACTIVE (version_label is NOT part of the supersession key; rules that target a DIFFERENT course coexist as separate placement bands) transitions ACTIVE -> SUPERSEDED"
      - from: ACTIVE
        to: SUPERSEDED
        trigger: "system cascade when another PlacementRule with the same (subject_area, measure_type, target_course_id) becomes ACTIVE"
        actor: system
        preconditions:
          - "PlacementRule.status == ACTIVE"
        side_effects:
          - "existing PlacementDetermination rows keep their applied_rule_id — historical placements are never re-derived"
      - from: DRAFT
        to: RETIRED
        trigger: "POST /placement-rules/{rule_id}/retire (actor AssessmentDirector), or system cascade from POST /courses/{course_id}/retire"
        actor: AssessmentDirector | system
        preconditions: ["on the manual retire, no precondition beyond the current status; on the cascade, target_course_id or coreq_course_id equals the retired Course.id"]
        side_effects: ["triggers the study-withdrawal hop described on Course ACTIVE -> RETIRED"]
      - from: ACTIVE
        to: RETIRED
        trigger: "POST /placement-rules/{rule_id}/retire (actor AssessmentDirector), or system cascade from POST /courses/{course_id}/retire"
        actor: AssessmentDirector | system
        preconditions: ["on the manual retire, no precondition beyond the current status; on the cascade, target_course_id or coreq_course_id equals the retired Course.id"]
        side_effects: ["triggers the study-withdrawal hop described on Course ACTIVE -> RETIRED"]
      - from: SUPERSEDED
        to: RETIRED
        trigger: "POST /placement-rules/{rule_id}/retire (actor AssessmentDirector), or system cascade from POST /courses/{course_id}/retire"
        actor: AssessmentDirector | system
        preconditions: ["on the manual retire, no precondition beyond the current status; on the cascade, target_course_id or coreq_course_id equals the retired Course.id"]
        side_effects: ["none beyond updated_at / version"]

  # ------------------------------ TestAdministration.status (branching, guarded)
  - entity: TestAdministration
    state_field: status
    initial_state: SCHEDULED
    terminal_states: [CLOSED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: OPEN
        trigger: "POST /test-administrations/{administration_id}/status with target_status == OPEN"
        actor: Proctor
        preconditions:
          - "TestAdministration.status == SCHEDULED"
          - "X-User-ID == TestAdministration.proctor_user_id (else ERR_NOT_ASSIGNED_PROCTOR)"
          - "logical clock < ends_at (else ERR_ADMINISTRATION_WINDOW_PASSED)"
        side_effects:
          - "increments TestAdministration.version by 1"
      - from: OPEN
        to: CLOSED
        trigger: "POST /test-administrations/{administration_id}/status with target_status == CLOSED"
        actor: Proctor
        preconditions:
          - "TestAdministration.status == OPEN"
          - "X-User-ID == TestAdministration.proctor_user_id"
        side_effects:
          - "HOP 1: every TestAttempt for this administration with state == BOOKED transitions BOOKED -> NO_SHOW"
          - "HOP 1: every TestAttempt for this administration with state == CHECKED_IN transitions CHECKED_IN -> VOIDED with void_reason = PROCTOR_ERROR"
          - "HOP 2 (caused by the CHECKED_IN -> VOIDED hop): attempt_ordinal is renumbered over the affected Students' remaining non-VOIDED attempts in the same subject_area, created_at ASC"
          - "recomputes TestAdministration.seats_booked"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /test-administrations/{administration_id}/status with target_status == CANCELLED"
        actor: AssessmentDirector
        preconditions:
          - "TestAdministration.status == SCHEDULED"
        side_effects:
          - "HOP 1: every TestAttempt for this administration with state IN {BOOKED, CHECKED_IN} transitions to VOIDED with void_reason = ADMIN_CORRECTION"
          - "HOP 2 (caused by HOP 1): for every affected Student, attempt_counts[subject_area] and remaining_attempts[subject_area] are recomputed and attempt_ordinal is renumbered over remaining non-VOIDED attempts in created_at ASC order"
          - "HOP 3 (caused by HOP 2): every renumbered SCORED attempt's next_eligible_at is recomputed from its unchanged scored_at and its NEW attempt_ordinal"
      - from: OPEN
        to: CANCELLED
        trigger: "POST /test-administrations/{administration_id}/status with target_status == CANCELLED"
        actor: AssessmentDirector
        preconditions:
          - "TestAdministration.status == OPEN"
        side_effects:
          - "identical HOP 1 / HOP 2 / HOP 3 chain as SCHEDULED -> CANCELLED"

  # ------------------------------------- TestAttempt.state (branching fork)
  - entity: TestAttempt
    state_field: state
    initial_state: BOOKED
    terminal_states: [VOIDED, NO_SHOW]
    transitions:
      - from: BOOKED
        to: CHECKED_IN
        trigger: "POST /test-attempts/{attempt_id}/check-in"
        actor: Proctor
        preconditions:
          - "TestAttempt.state == BOOKED"
          - "TestAdministration with id == administration_id has status == OPEN (else ERR_ADMINISTRATION_NOT_OPEN)"
          - "X-User-ID == TestAdministration.proctor_user_id"
          - "starts_at <= logical clock < ends_at"
        side_effects:
          - "increments TestAttempt.version by 1"
      - from: CHECKED_IN
        to: SCORED
        trigger: "POST /test-attempts/{attempt_id}/score"
        actor: Proctor
        preconditions:
          - "TestAttempt.state == CHECKED_IN"
          - "TestAdministration.status == OPEN (else ERR_ADMINISTRATION_NOT_OPEN)"
          - "raw_score is an integer in [0, 160] (else ERR_INVALID_REQUEST)"
        side_effects:
          - "sets raw_score, irregularity_flag, scored_at = logical clock"
          - "computes scaled_score per calculations.attempt_scaled_score"
          - "assigns attempt_ordinal = 1 + count of the Student's non-VOIDED TestAttempts in the same subject_area created strictly earlier (created_at ASC)"
          - "computes next_eligible_at per calculations.retake_eligibility_window"
          - "HOP 1: Student.attempt_counts[subject_area] += 1 and Student.remaining_attempts[subject_area] -= 1; increments Student.version by 1"
      - from: BOOKED
        to: NO_SHOW
        trigger: "POST /test-attempts/{attempt_id}/no-show, or system cascade from TestAdministration OPEN -> CLOSED"
        actor: system
        preconditions: ["TestAttempt.state == BOOKED"]
        side_effects:
          - "NO_SHOW attempts never enter Student.attempt_counts, so the Student's retake budget is not consumed"
      - from: BOOKED
        to: VOIDED
        trigger: "system cascade from TestAdministration -> CANCELLED"
        actor: system
        preconditions: ["TestAttempt.state == BOOKED"]
        side_effects: ["sets void_reason = ADMIN_CORRECTION"]
      - from: CHECKED_IN
        to: VOIDED
        trigger: "system cascade from TestAdministration OPEN -> CLOSED (unscored) or -> CANCELLED"
        actor: system
        preconditions: ["TestAttempt.state == CHECKED_IN"]
        side_effects: ["sets void_reason = PROCTOR_ERROR on CLOSED, ADMIN_CORRECTION on CANCELLED"]
      - from: SCORED
        to: VOIDED
        trigger: "POST /test-attempts/{attempt_id}/void"
        actor: Proctor | AssessmentStaff
        preconditions:
          - "TestAttempt.state == SCORED"
        side_effects:
          - "HOP 1: sets void_reason; Student.attempt_counts[subject_area] -= 1 and Student.remaining_attempts[subject_area] += 1; sibling non-VOIDED TestAttempts of the same Student and subject_area are renumbered by created_at ASC and each SCORED sibling's next_eligible_at is recomputed from its unchanged scored_at and NEW attempt_ordinal"
          - "HOP 2 (caused by HOP 1 removing the attempt from the countable set): every PlacementDetermination with source_attempt_id == this attempt AND placement_state IN {PROVISIONAL, FINAL} has evidence_state set to DISPUTED; Student.advising_hold recomputes to true"
          - "HOP 3 (caused by HOP 2): every Registration with state IN {PENDING, ENROLLED, WAITLISTED} whose Section.course_id IN {that determination's placed_course_id, coreq_course_id} transitions to DENIED with denial_reason = EVIDENCE_DISPUTED; Section.seats_taken / seats_held / waitlist_count are decremented accordingly"
          - "HOP 4 (caused by HOP 3): for each Registration denied in HOP 3, its paired coreq_registration_id counterpart with state IN {PENDING, ENROLLED, WAITLISTED} also transitions to DENIED with denial_reason = EVIDENCE_DISPUTED, and any PrerequisiteOverride with state == CONSUMED and consumed_by_registration_id in the denied set transitions CONSUMED -> ISSUED with consumed_by_registration_id reset to null"
          - "HOP 5 (caused by the seat releases in HOP 3 and HOP 4): every Section that released a seat promotes its WAITLISTED Registrations to ENROLLED in created_at ASC order while available_seats >= 1"

  # -------------- PlacementDetermination.placement_state (cyclic, axis 1 of 2)
  - entity: PlacementDetermination
    state_field: placement_state
    initial_state: PROVISIONAL
    terminal_states: [SUPERSEDED]
    transitions:
      - from: PROVISIONAL
        to: FINAL
        trigger: "POST /placement-determinations/{determination_id}/finalize"
        actor: AssessmentStaff
        preconditions:
          - "PlacementDetermination.placement_state == PROVISIONAL"
          - "PlacementDetermination.evidence_state == VERIFIED (cross-axis guard; DISPUTED or UNVERIFIED rejects with ERR_EVIDENCE_NOT_VERIFIED)"
          - "logical clock < expires_at (else ERR_PLACEMENT_EXPIRED)"
        side_effects:
          - "Student.placement_status recomputes to FINAL; increments Student.version by 1"
      - from: PROVISIONAL
        to: APPEALED
        trigger: "system cascade from POST /placement-appeals"
        actor: system
        preconditions: ["PlacementDetermination.placement_state == PROVISIONAL"]
        side_effects: ["Student.advising_hold recomputes to true; increments PlacementDetermination.version by 1"]
      - from: FINAL
        to: APPEALED
        trigger: "system cascade from POST /placement-appeals"
        actor: system
        preconditions: ["PlacementDetermination.placement_state == FINAL"]
        side_effects: ["Student.advising_hold recomputes to true; increments PlacementDetermination.version by 1"]
      - from: APPEALED
        to: FINAL
        trigger: "system cascade from POST /placement-appeals/{appeal_id}/decide with decision == DENY"
        actor: system
        preconditions:
          - "PlacementDetermination.placement_state == APPEALED"
          - "PlacementDetermination.evidence_state == VERIFIED"
        side_effects: ["Student.advising_hold recomputes; increments PlacementDetermination.version by 1"]
      - from: APPEALED
        to: PROVISIONAL
        trigger: "system cascade from POST /placement-appeals/{appeal_id}/decide with decision == DENY"
        actor: system
        preconditions:
          - "PlacementDetermination.placement_state == APPEALED"
          - "PlacementDetermination.evidence_state IN {UNVERIFIED, DISPUTED}"
        side_effects: ["Student.advising_hold recomputes; increments PlacementDetermination.version by 1"]
      - from: APPEALED
        to: SUPERSEDED
        trigger: "system cascade from POST /placement-appeals/{appeal_id}/decide with decision == GRANT"
        actor: system
        preconditions: ["PlacementDetermination.placement_state == APPEALED"]
        side_effects:
          - "sets superseded_by_id to the newly minted APPEAL_OVERRIDE determination"
          - "see PlacementAppeal INSTRUCTOR_ENDORSED -> GRANTED for the full HOP 1-5 chain"
      - from: PROVISIONAL
        to: SUPERSEDED
        trigger: "system cascade from POST /placement-determinations creating a newer determination for the same (student_id, subject_area)"
        actor: system
        preconditions: ["PlacementDetermination.placement_state == PROVISIONAL"]
        side_effects: ["sets superseded_by_id to the new determination"]
      - from: FINAL
        to: SUPERSEDED
        trigger: "system cascade from POST /placement-determinations creating a newer determination for the same (student_id, subject_area)"
        actor: system
        preconditions: ["PlacementDetermination.placement_state == FINAL"]
        side_effects: ["sets superseded_by_id to the new determination"]

  # -------- PlacementDetermination.evidence_state (parallel axis 2 of 2)
  - entity: PlacementDetermination
    state_field: evidence_state
    initial_state: "computed at creation: VERIFIED when confidence_score >= CONFIDENCE_VERIFY_MIN AND Student.hs_transcript_status == VERIFIED; otherwise UNVERIFIED"
    terminal_states: []
    note: |
      This axis evolves INDEPENDENTLY of placement_state. finalize touches only
      placement_state; the evidence action touches only evidence_state. The two axes
      are coupled solely through the PROVISIONAL -> FINAL precondition.
    transitions:
      - from: UNVERIFIED
        to: VERIFIED
        trigger: "POST /placement-determinations/{determination_id}/evidence with target_evidence_state == VERIFIED"
        actor: AssessmentStaff
        preconditions:
          - "PlacementDetermination.evidence_state == UNVERIFIED"
          - "PlacementDetermination.placement_state != SUPERSEDED (else ERR_DETERMINATION_SUPERSEDED)"
          - "Student.hs_transcript_status == VERIFIED, OR the Student has >=1 TestAttempt with state == SCORED and subject_area == PlacementDetermination.subject_area (else ERR_NO_VERIFIABLE_EVIDENCE)"
        side_effects: ["Student.advising_hold recomputes; increments PlacementDetermination.version by 1"]
      - from: DISPUTED
        to: VERIFIED
        trigger: "POST /placement-determinations/{determination_id}/evidence with target_evidence_state == VERIFIED"
        actor: AssessmentStaff
        preconditions:
          - "PlacementDetermination.evidence_state == DISPUTED"
          - "PlacementDetermination.placement_state != SUPERSEDED"
          - "the Student has >=1 TestAttempt with state == SCORED and subject_area == PlacementDetermination.subject_area whose created_at is strictly later than the VOIDED attempt referenced by source_attempt_id (else ERR_NO_VERIFIABLE_EVIDENCE)"
        side_effects: ["Student.advising_hold recomputes; increments PlacementDetermination.version by 1"]
      - from: VERIFIED
        to: DISPUTED
        trigger: "system cascade HOP 2 from POST /test-attempts/{attempt_id}/void"
        actor: system
        preconditions: ["source_attempt_id == the voided TestAttempt.id", "placement_state IN {PROVISIONAL, FINAL}"]
        side_effects: ["see TestAttempt SCORED -> VOIDED HOP 3 / HOP 4 / HOP 5"]
      - from: UNVERIFIED
        to: DISPUTED
        trigger: "system cascade HOP 2 from POST /test-attempts/{attempt_id}/void"
        actor: system
        preconditions: ["source_attempt_id == the voided TestAttempt.id", "placement_state IN {PROVISIONAL, FINAL}"]
        side_effects: ["see TestAttempt SCORED -> VOIDED HOP 3 / HOP 4 / HOP 5"]

  # ------------------------------------- PlacementAppeal.state (cyclic)
  - entity: PlacementAppeal
    state_field: state
    initial_state: SUBMITTED
    terminal_states: [GRANTED, DENIED, WITHDRAWN]
    transitions:
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /placement-appeals/{appeal_id}/start-review"
        actor: Registrar
        preconditions:
          - "PlacementAppeal.state == SUBMITTED"
          - "PlacementDetermination with id == determination_id has placement_state == APPEALED"
          - "X-User-ID != PlacementDetermination.determined_by_user_id (SoD-2, else ERR_SEGREGATION_OF_DUTIES)"
        side_effects: ["sets reviewed_by_user_id = X-User-ID"]
      - from: UNDER_REVIEW
        to: INFO_REQUESTED
        trigger: "POST /placement-appeals/{appeal_id}/request-info"
        actor: Registrar
        preconditions:
          - "PlacementAppeal.state == UNDER_REVIEW"
          - "X-User-ID == PlacementAppeal.reviewed_by_user_id (else ERR_NOT_APPEAL_REVIEWER)"
          - "revision_round < APPEAL_MAX_REVISION_ROUNDS (else ERR_APPEAL_ROUND_LIMIT)"
        side_effects: ["sets info_request_note"]
      - from: INFO_REQUESTED
        to: UNDER_REVIEW
        trigger: "POST /placement-appeals/{appeal_id}/resubmit"
        actor: Student
        preconditions:
          - "PlacementAppeal.state == INFO_REQUESTED"
          - "X-User-ID == PlacementAppeal.student_id"
          - "logical clock < filed_at + APPEAL_RESUBMIT_DAYS days (else ERR_APPEAL_WINDOW_CLOSED)"
        side_effects:
          - "replaces statement; increments revision_round by 1; clears info_request_note"
        note: "this is the revision cycle UNDER_REVIEW -> INFO_REQUESTED -> UNDER_REVIEW, bounded at APPEAL_MAX_REVISION_ROUNDS rounds"
      - from: INFO_REQUESTED
        to: UNDER_REVIEW
        trigger: "POST /placement-appeals/{appeal_id}/resubmit"
        actor: Registrar
        preconditions:
          - "PlacementAppeal.state == INFO_REQUESTED"
          - "logical clock < filed_at + APPEAL_RESUBMIT_DAYS days"
        side_effects: ["replaces statement; increments revision_round by 1; clears info_request_note"]
        note: "staff-assisted resubmit on the student's behalf; the X-User-ID == student_id ownership check does NOT apply, but the round counter and resubmit window do"
      - from: UNDER_REVIEW
        to: INSTRUCTOR_ENDORSED
        trigger: "POST /placement-appeals/{appeal_id}/endorse"
        actor: Instructor
        preconditions:
          - "PlacementAppeal.state == UNDER_REVIEW"
          - "Course with id == requested_course_id has status == ACTIVE"
          - "X-User-ID != PlacementAppeal.reviewed_by_user_id (SoD-3, else ERR_SEGREGATION_OF_DUTIES)"
        side_effects: ["sets endorsed_by_user_id = X-User-ID"]
      - from: INSTRUCTOR_ENDORSED
        to: GRANTED
        trigger: "POST /placement-appeals/{appeal_id}/decide with decision == GRANT"
        actor: Registrar
        preconditions:
          - "PlacementAppeal.state == INSTRUCTOR_ENDORSED (a GRANT from UNDER_REVIEW is rejected with ERR_APPEAL_NOT_ENDORSED)"
          - "X-User-ID == PlacementAppeal.reviewed_by_user_id"
          - "X-User-ID != PlacementDetermination.determined_by_user_id (SoD-2)"
        side_effects:
          - "HOP 1: sets decided_at, decision_note, state = GRANTED"
          - "HOP 2 (caused by HOP 1): the appealed PlacementDetermination transitions APPEALED -> SUPERSEDED, and a NEW PlacementDetermination is created with measure_type_used = APPEAL_OVERRIDE, applied_rule_id = null, placed_course_id = requested_course_id, coreq_course_id = the requisite_course_id of the ACTIVE COREQUISITE CourseRequisite on the requested course when one exists else null, source_attempt_id = null, placement_state = PROVISIONAL, evidence_state = VERIFIED, base_confidence_score = confidence_score = APPEAL_OVERRIDE_CONFIDENCE, validity_days = 365, determined_by_user_id = X-User-ID; appeal.minted_determination_id and old.superseded_by_id are cross-set"
          - "HOP 3 (caused by HOP 2 superseding the old determination): every Registration with state IN {PENDING, ENROLLED, WAITLISTED} whose Section.course_id IN {old.placed_course_id, old.coreq_course_id} AND NOT IN {new.placed_course_id, new.coreq_course_id} transitions to DENIED with denial_reason = PLACEMENT_SUPERSEDED; the corresponding Section seat counters are decremented"
          - "HOP 4 (caused by HOP 3): each denied Registration's coreq_registration_id counterpart with state IN {PENDING, ENROLLED, WAITLISTED} also transitions to DENIED with denial_reason = PLACEMENT_SUPERSEDED, and every PrerequisiteOverride with state == CONSUMED whose consumed_by_registration_id is in the denied set transitions CONSUMED -> ISSUED with consumed_by_registration_id reset to null"
          - "HOP 5 (caused by the seat releases in HOP 3 and HOP 4): every Section that released a seat promotes WAITLISTED Registrations to ENROLLED in created_at ASC order while available_seats >= 1"
          - "Student.placement_status and Student.advising_hold recompute; increments Student.version by 1"
      - from: UNDER_REVIEW
        to: DENIED
        trigger: "POST /placement-appeals/{appeal_id}/decide with decision == DENY"
        actor: Registrar
        preconditions:
          - "PlacementAppeal.state == UNDER_REVIEW"
          - "X-User-ID == PlacementAppeal.reviewed_by_user_id"
        side_effects:
          - "sets decided_at, decision_note"
          - "the appealed PlacementDetermination leaves APPEALED: -> FINAL when its evidence_state == VERIFIED, otherwise -> PROVISIONAL"
      - from: INSTRUCTOR_ENDORSED
        to: DENIED
        trigger: "POST /placement-appeals/{appeal_id}/decide with decision == DENY"
        actor: Registrar
        preconditions:
          - "PlacementAppeal.state == INSTRUCTOR_ENDORSED"
          - "X-User-ID == PlacementAppeal.reviewed_by_user_id"
        side_effects: ["same as UNDER_REVIEW -> DENIED"]
      - from: SUBMITTED
        to: WITHDRAWN
        trigger: "POST /placement-appeals/{appeal_id}/withdraw, or system cascade from POST /placement-appeals creating a superseding appeal for the same determination_id"
        actor: system
        preconditions: ["PlacementAppeal.state == SUBMITTED"]
        side_effects: ["sets decided_at, decision_note = 'superseded by a later appeal'"]
      - from: UNDER_REVIEW
        to: WITHDRAWN
        trigger: "POST /placement-appeals/{appeal_id}/withdraw, or system cascade from POST /placement-appeals creating a superseding appeal for the same determination_id"
        actor: system
        preconditions: ["PlacementAppeal.state == UNDER_REVIEW"]
        side_effects: ["sets decided_at, decision_note = 'superseded by a later appeal'"]
      - from: INFO_REQUESTED
        to: WITHDRAWN
        trigger: "POST /placement-appeals/{appeal_id}/withdraw, or system cascade from POST /placement-appeals creating a superseding appeal for the same determination_id"
        actor: system
        preconditions: ["PlacementAppeal.state == INFO_REQUESTED"]
        side_effects: ["sets decided_at, decision_note = 'superseded by a later appeal'"]
      - from: INSTRUCTOR_ENDORSED
        to: WITHDRAWN
        trigger: "POST /placement-appeals/{appeal_id}/withdraw, or system cascade from POST /placement-appeals creating a superseding appeal for the same determination_id"
        actor: system
        preconditions: ["PlacementAppeal.state == INSTRUCTOR_ENDORSED"]
        side_effects: ["sets decided_at, decision_note = 'superseded by a later appeal'"]

  # ---------------------------------- Section.status (branching, axis 1 of 2)
  - entity: Section
    state_field: status
    initial_state: PLANNED
    terminal_states: [CLOSED, CANCELLED]
    transitions:
      - from: PLANNED
        to: OPEN
        trigger: "POST /sections/{section_id}/status with target_status == OPEN"
        actor: Registrar
        preconditions:
          - "Section.status == PLANNED"
          - "Course with id == course_id has status == ACTIVE (else ERR_COURSE_RETIRED)"
          - "if Course.is_support_course == false AND >=1 PlacementRule with status == ACTIVE has target_course_id == course_id AND coreq_required == true, then Section.pairing_state == PAIRED (else ERR_COREQ_PAIRING_REQUIRED)"
        side_effects: ["increments Section.version by 1"]
      - from: OPEN
        to: CLOSED
        trigger: "POST /sections/{section_id}/status with target_status == CLOSED"
        actor: Registrar
        preconditions:
          - "Section.status == OPEN"
        side_effects:
          - "no Registration transitions; the section simply stops accepting POST /registrations (ERR_SECTION_NOT_OPEN thereafter) while ENROLLED rows remain gradeable"
      - from: OPEN
        to: CANCELLED
        trigger: "POST /sections/{section_id}/status with target_status == CANCELLED"
        actor: Registrar
        preconditions:
          - "Section.status == OPEN"
        side_effects:
          - "HOP 1: every Registration for this Section with state IN {PENDING, ENROLLED, WAITLISTED} transitions to DENIED with denial_reason = SECTION_CANCELLED; seat counters zero out"
          - "HOP 1: when pairing_state == PAIRED, BOTH this Section and the linked Section transition PAIRED -> PAIR_BROKEN; each retains its linked_section_id for audit"
          - "HOP 2 (caused by the PAIR_BROKEN hop): if that linked Section has role_in_pair == PRIMARY AND status == OPEN, it transitions OPEN -> CLOSED so no further corequisite-bearing registrations can be taken"
          - "HOP 3 (caused by HOP 1): each denied Registration's coreq_registration_id counterpart with state IN {PENDING, ENROLLED, WAITLISTED} transitions to DENIED with denial_reason = SECTION_CANCELLED, and every PrerequisiteOverride with state == CONSUMED whose consumed_by_registration_id is in the denied set transitions CONSUMED -> ISSUED"
      - from: PLANNED
        to: CANCELLED
        trigger: "POST /sections/{section_id}/status with target_status == CANCELLED"
        actor: Registrar
        preconditions:
          - "Section.status == PLANNED"
        side_effects:
          - "identical HOP 1 / HOP 2 / HOP 3 chain as OPEN -> CANCELLED"

  # ------------------------------- Section.pairing_state (cyclic, axis 2 of 2)
  - entity: Section
    state_field: pairing_state
    initial_state: UNPAIRED
    terminal_states: []
    note: "PAIRED -> PAIR_BROKEN -> PAIRED is a genuine loop: a broken pair can be re-paired to a different support section."
    transitions:
      - from: UNPAIRED
        to: PAIRED
        trigger: "POST /sections/{section_id}/pair"
        actor: Registrar
        preconditions:
          - "Section.pairing_state == UNPAIRED"
          - "Section.status == PLANNED (else ERR_INVALID_STATE)"
          - "this Section's Course.is_support_course == false and the support Section's Course.is_support_course == true (else ERR_COREQ_SECTION_MISMATCH)"
          - "support Section.term_code == this Section.term_code and support Section.pairing_state == UNPAIRED and support Section.status == PLANNED"
          - "an ACTIVE CourseRequisite exists with course_id == this Course.id, requisite_course_id == support Course.id, requisite_type == COREQUISITE (else ERR_COREQ_SECTION_MISMATCH)"
          - "the two meeting intervals must NOT overlap under closed-adjacency semantics (else ERR_COREQ_TIME_CONFLICT) — see validations priority 17"
        side_effects:
          - "both Sections set pairing_state = PAIRED and cross-set linked_section_id; this Section sets role_in_pair = PRIMARY, the support Section sets role_in_pair = SUPPORT"
          - "both Sections recompute available_seats using the paired_conservative variant of calculations.section_available_seats"
      - from: PAIR_BROKEN
        to: PAIRED
        trigger: "POST /sections/{section_id}/pair with a different support_section_id"
        actor: Registrar
        preconditions:
          - "Section.pairing_state == PAIR_BROKEN"
          - "Section.status == PLANNED"
          - "all UNPAIRED -> PAIRED preconditions on the new support Section"
        side_effects:
          - "linked_section_id is repointed at the new support Section; both recompute available_seats under paired_conservative"
      - from: PAIRED
        to: UNPAIRED
        trigger: "POST /sections/{section_id}/unpair"
        actor: Registrar
        preconditions:
          - "Section.pairing_state == PAIRED"
          - "Section.role_in_pair == PRIMARY (a SUPPORT half cannot dissolve the pair; else ERR_COREQ_SECTION_MISMATCH)"
          - "Section.status IN {PLANNED, OPEN} (else ERR_INVALID_STATE)"
          - "no Registration on the linked SUPPORT Section has a non-null coreq_registration_id together with state IN {PENDING, ENROLLED, WAITLISTED} (else ERR_INVALID_STATE) — companion rows must be dropped first"
        side_effects:
          - "both Sections set pairing_state = UNPAIRED, role_in_pair = NONE, linked_section_id = null; increments both Sections' version by 1"
          - "both Sections recompute available_seats using the committed_only variant of calculations.section_available_seats, so PENDING holds stop suppressing supply"
      - from: PAIRED
        to: PAIR_BROKEN
        trigger: "system cascade from the linked Section transitioning to CANCELLED"
        actor: system
        preconditions: ["Section.pairing_state == PAIRED"]
        side_effects:
          - "linked_section_id is RETAINED for audit; available_seats reverts to the committed_only variant"
          - "triggers the PRIMARY OPEN -> CLOSED hop described on Section OPEN -> CANCELLED"

  # ----------------------------------- Registration.state (branching fork-join)
  - entity: Registration
    state_field: state
    initial_state: PENDING
    terminal_states: [DENIED, DROPPED, COMPLETED]
    transitions:
      - from: PENDING
        to: ENROLLED
        trigger: "POST /registrations/{registration_id}/confirm"
        actor: Registrar
        preconditions:
          - "Registration.state == PENDING"
          - "Section.status == OPEN (else ERR_SECTION_NOT_OPEN)"
          - "the Student has a PlacementDetermination for Section.Course.subject_area with placement_state IN {PROVISIONAL, FINAL} AND evidence_state != DISPUTED (else ERR_PLACEMENT_NOT_ACTIONABLE)"
          - "that determination's placed_course_id == Section.course_id OR coreq_course_id == Section.course_id (else ERR_PLACEMENT_COURSE_MISMATCH)"
          - "Registration.prerequisite_status IN {SATISFIED, OVERRIDDEN} (else ERR_PREREQUISITE_NOT_MET)"
          - "calculations.term_unit_load result <= MAX_TERM_UNITS (else ERR_TERM_UNIT_CAP_EXCEEDED)"
          - "calculations.section_available_seats >= 1 for the applicable variant"
        side_effects:
          - "Section.seats_taken += 1, Section.seats_held -= 1; increments Section.version by 1"
          - "sets term_units_at_confirm"
          - "when override_id is not null, that PrerequisiteOverride transitions ISSUED -> CONSUMED with consumed_by_registration_id = this Registration.id"
          - "when Section.pairing_state == PAIRED AND Section.role_in_pair == PRIMARY, a companion Registration is created on the linked SUPPORT Section directly in state ENROLLED, cross-linked via coreq_registration_id on both rows, consuming one SUPPORT seat"
      - from: PENDING
        to: WAITLISTED
        trigger: "POST /registrations/{registration_id}/confirm"
        actor: Registrar
        preconditions:
          - "Registration.state == PENDING"
          - "Section.status == OPEN"
          - "all placement / prerequisite / unit-cap preconditions of PENDING -> ENROLLED hold"
          - "calculations.section_available_seats == 0 AND Section.waitlist_count < WAITLIST_CAP (else ERR_SECTION_FULL)"
        side_effects:
          - "Section.waitlist_count += 1, Section.seats_held -= 1; NO seat is consumed"
          - "NO companion corequisite Registration is created — the pair is materialised only at ENROLLED (divergent side-effect set versus the ENROLLED branch)"
          - "any override_id stays ISSUED (not CONSUMED) — the override is redeemed only at ENROLLED"
      - from: WAITLISTED
        to: ENROLLED
        trigger: "system waitlist promotion when a seat is released on the Section"
        actor: system
        preconditions:
          - "Registration.state == WAITLISTED"
          - "Section.status == OPEN"
          - "calculations.section_available_seats >= 1"
          - "the Registration is the earliest by created_at ASC among the Section's WAITLISTED rows"
        side_effects:
          - "same seat / override / companion-registration side effects as PENDING -> ENROLLED"
      - from: PENDING
        to: DROPPED
        trigger: "POST /registrations/{registration_id}/drop"
        actor: Student
        preconditions:
          - "Registration.state == PENDING"
          - "X-User-ID == Registration.student_id"
        side_effects: ["Section.seats_held -= 1"]
      - from: WAITLISTED
        to: DROPPED
        trigger: "POST /registrations/{registration_id}/drop"
        actor: Student
        preconditions:
          - "Registration.state == WAITLISTED"
          - "X-User-ID == Registration.student_id"
        side_effects: ["Section.waitlist_count -= 1"]
      - from: ENROLLED
        to: DROPPED
        trigger: "POST /registrations/{registration_id}/drop"
        actor: Registrar
        preconditions:
          - "Registration.state == ENROLLED"
          - "Section.status IN {OPEN, CLOSED} (else ERR_SECTION_NOT_OPEN)"
        side_effects:
          - "HOP 1: Section.seats_taken -= 1; increments Section.version by 1"
          - "HOP 1: when override_id is not null and that PrerequisiteOverride.state == CONSUMED, it transitions CONSUMED -> ISSUED and consumed_by_registration_id resets to null"
          - "HOP 2 (caused by HOP 1): the coreq_registration_id counterpart with state IN {PENDING, ENROLLED, WAITLISTED} transitions to DROPPED and releases its own seat"
          - "HOP 3 (caused by the seat releases in HOP 1 and HOP 2): each affected Section promotes WAITLISTED Registrations to ENROLLED in created_at ASC order while available_seats >= 1"
      - from: ENROLLED
        to: COMPLETED
        trigger: "POST /registrations/{registration_id}/grade"
        actor: Instructor
        preconditions:
          - "Registration.state == ENROLLED"
          - "Section.status == CLOSED (else ERR_SECTION_NOT_CLOSED)"
          - "logical clock >= Section.meets_end_at"
        side_effects:
          - "sets final_grade, graded_at = logical clock; recomputes success"
          - "HOP 1: Course.enrolled_count, Course.success_count and Course.success_rate are recomputed; increments Course.version by 1"
      - from: PENDING
        to: DENIED
        trigger: "system cascade (attempt void HOP 3, appeal grant HOP 3, section cancel HOP 1)"
        actor: system
        preconditions: ["Registration.state == PENDING"]
        side_effects: ["sets denial_reason; Section.seats_held -= 1"]
      - from: ENROLLED
        to: DENIED
        trigger: "system cascade (attempt void HOP 3, appeal grant HOP 3, section cancel HOP 1)"
        actor: system
        preconditions: ["Registration.state == ENROLLED"]
        side_effects: ["sets denial_reason; Section.seats_taken -= 1; triggers the coreq-counterpart and waitlist-promotion hops"]
      - from: WAITLISTED
        to: DENIED
        trigger: "system cascade (attempt void HOP 3, appeal grant HOP 3, section cancel HOP 1)"
        actor: system
        preconditions: ["Registration.state == WAITLISTED"]
        side_effects: ["sets denial_reason; Section.waitlist_count -= 1"]

  # ------------------------------ PrerequisiteOverride.state (cyclic)
  - entity: PrerequisiteOverride
    state_field: state
    initial_state: ISSUED
    terminal_states: [REVOKED, EXPIRED]
    note: "ISSUED -> CONSUMED -> ISSUED is a redemption loop; the conserved quantity is the override redemption balance (see calculations.override_redemption_balance_invariant)."
    transitions:
      - from: ISSUED
        to: CONSUMED
        trigger: "system cascade from Registration PENDING -> ENROLLED or WAITLISTED -> ENROLLED with override_id set"
        actor: system
        preconditions:
          - "PrerequisiteOverride.state == ISSUED"
          - "logical clock < expires_at"
        side_effects: ["sets consumed_by_registration_id"]
      - from: CONSUMED
        to: ISSUED
        trigger: "system cascade from Registration ENROLLED -> DROPPED or ENROLLED -> DENIED"
        actor: system
        preconditions: ["PrerequisiteOverride.state == CONSUMED"]
        side_effects: ["resets consumed_by_registration_id to null"]
      - from: ISSUED
        to: REVOKED
        trigger: "POST /prerequisite-overrides/{override_id}/revoke"
        actor: Instructor
        preconditions:
          - "PrerequisiteOverride.state == ISSUED (a CONSUMED override must be freed by dropping its Registration first, else ERR_OVERRIDE_CONSUMED)"
          - "X-User-ID == PrerequisiteOverride.issued_by_user_id when the actor's role is Instructor (else ERR_NOT_OVERRIDE_ISSUER)"
        side_effects: ["every Registration with override_id == this override and state == PENDING recomputes prerequisite_status to UNMET"]
      - from: ISSUED
        to: REVOKED
        trigger: "system cascade from CourseRequisite ACTIVE -> RETIRED"
        actor: system
        preconditions: ["PrerequisiteOverride.state == ISSUED"]
        side_effects: ["same prerequisite_status recompute hop"]
      - from: ISSUED
        to: EXPIRED
        trigger: "POST /_clock/set_current_utc"
        actor: system
        preconditions:
          - "PrerequisiteOverride.state == ISSUED"
          - "PrerequisiteOverride.expires_at <= the new logical clock value"
        side_effects: ["every Registration with override_id == this override and state == PENDING recomputes prerequisite_status to UNMET"]

  # ------------------------- CutScoreValidationStudy.state (cyclic re-run)
  - entity: CutScoreValidationStudy
    state_field: state
    initial_state: DRAFT
    terminal_states: [APPROVED, REJECTED, WITHDRAWN]
    transitions:
      - from: DRAFT
        to: RUNNING
        trigger: "POST /validation-studies/{study_id}/run"
        actor: AssessmentStaff
        preconditions:
          - "CutScoreValidationStudy.state == DRAFT"
          - "PlacementRule with id == candidate_rule_id has status == DRAFT (else ERR_CANDIDATE_RULE_NOT_DRAFT)"
          - "window_end_at <= logical clock (else ERR_STUDY_WINDOW_OPEN)"
        side_effects:
          - "computes strict_* and inclusive_* metrics per calculations.cut_score_validation_outcome and disproportionate_impact_index per calculations.disproportionate_impact_index"
      - from: RUNNING
        to: COMPLETED
        trigger: "automatic continuation inside the same POST /validation-studies/{study_id}/run request once both cohort variants are computed"
        actor: system
        preconditions:
          - "CutScoreValidationStudy.state == RUNNING"
          - "strict_cohort_size >= 1 (a zero-row strict cohort aborts the whole request with ERR_STUDY_COHORT_EMPTY and leaves the study in DRAFT / COMPLETED as it was before the call)"
        side_effects:
          - "increments run_count by 1"
      - from: COMPLETED
        to: RUNNING
        trigger: "POST /validation-studies/{study_id}/run (re-run loop)"
        actor: AssessmentStaff
        preconditions:
          - "CutScoreValidationStudy.state == COMPLETED"
          - "PlacementRule with id == candidate_rule_id has status == DRAFT"
          - "window_end_at <= logical clock"
        side_effects:
          - "all strict_* / inclusive_* / disproportionate_impact_index fields are recomputed from scratch (no incremental accumulation)"
      - from: COMPLETED
        to: APPROVED
        trigger: "POST /validation-studies/{study_id}/decide with decision == APPROVE"
        actor: AssessmentDirector
        preconditions:
          - "CutScoreValidationStudy.state == COMPLETED"
          - "X-User-ID != CutScoreValidationStudy.proposed_by_user_id (SoD-1, else ERR_SEGREGATION_OF_DUTIES)"
          - "strict_success_rate >= VALIDATION_MIN_SUCCESS_RATE (else ERR_VALIDATION_RATE_TOO_LOW)"
          - "disproportionate_impact_index >= DI_MIN_INDEX (else ERR_DISPROPORTIONATE_IMPACT)"
          - "PlacementRule with id == candidate_rule_id has status == DRAFT"
        side_effects:
          - "sets decided_by_user_id, decision_note"
          - "HOP 1: the candidate PlacementRule transitions DRAFT -> ACTIVE with activated_at = logical clock"
          - "HOP 2 (caused by HOP 1): every other PlacementRule with the same (subject_area, measure_type, target_course_id) AND status == ACTIVE (version_label is NOT part of the supersession key; rules that target a DIFFERENT course coexist as separate placement bands) transitions ACTIVE -> SUPERSEDED"
      - from: COMPLETED
        to: REJECTED
        trigger: "POST /validation-studies/{study_id}/decide with decision == REJECT"
        actor: AssessmentDirector
        preconditions:
          - "CutScoreValidationStudy.state == COMPLETED"
          - "X-User-ID != CutScoreValidationStudy.proposed_by_user_id (SoD-1)"
        side_effects:
          - "sets decided_by_user_id, decision_note; the candidate PlacementRule stays DRAFT"
      - from: DRAFT
        to: WITHDRAWN
        trigger: "system cascade from POST /validation-studies creating a superseding study for the same candidate_rule_id, from POST /placement-rules/{rule_id}/retire, or from POST /courses/{course_id}/retire"
        actor: system
        preconditions: ["CutScoreValidationStudy.state == DRAFT"]
        side_effects: ["sets decision_note"]
      - from: COMPLETED
        to: WITHDRAWN
        trigger: "system cascade from POST /validation-studies creating a superseding study for the same candidate_rule_id, from POST /placement-rules/{rule_id}/retire, or from POST /courses/{course_id}/retire"
        actor: system
        preconditions: ["CutScoreValidationStudy.state == COMPLETED"]
        side_effects: ["sets decision_note"]

# =============================================================================
# §1.2.1 Concurrency Rules — OCC on the parent's `version` only
# =============================================================================
concurrency_rules:

  - rule_id: determination-create-stale-student
    parent_entity: Student
    write_endpoint: "POST /placement-determinations"
    occ_field: "expected_student_version"
    description: |
      Creating a PlacementDetermination for a (student_id, subject_area) whose
      Student.version has advanced since the client last read it is rejected.
      A new determination legitimately SUPERSEDES the Student's prior
      determination for the same subject, so the operation is not
      state-blocked; the stale expected_student_version is the only signal
      that the counsellor's view of the student's measures (transcript status,
      attempt counts, remaining retakes) is out of date.
    error_id: ERR_STALE_STUDENT_VERSION
    http_status: 412

  - rule_id: registration-create-stale-section
    parent_entity: Section
    write_endpoint: "POST /registrations"
    occ_field: "expected_section_version"
    description: |
      Creating a Registration against a Section whose version has advanced
      since the client last read it is rejected. Seat holds, waitlist
      promotions and pairing changes all bump Section.version, so a stale
      value means the client's seat-availability view no longer matches the
      server's; a second create for a different Student would otherwise
      legitimately succeed, which is why this is resolved by OCC rather than
      by a state precondition.
    error_id: ERR_STALE_SECTION_VERSION
    http_status: 412

  - rule_id: appeal-create-stale-determination
    parent_entity: PlacementDetermination
    write_endpoint: "POST /placement-appeals"
    occ_field: "expected_determination_version"
    description: |
      Creating a PlacementAppeal against a PlacementDetermination whose
      version has advanced since the client last read it is rejected. A new
      appeal legitimately supersedes any earlier non-terminal appeal on the
      same determination (which is auto-WITHDRAWN), so the create is not
      state-blocked; the stale expected_determination_version catches the case
      where the determination's evidence_state or placement_state moved (for
      example to DISPUTED by an attempt-void cascade) after the client read it.
    error_id: ERR_STALE_DETERMINATION_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
#
# Global determinism rules for every entry below:
#   * All rounding is round_half_up unless stated otherwise.
#   * Every ordering / tie-break uses `created_at ASC` or an explicit business
#     field. The random `id` field is NEVER a decision input.
#   * "logical clock" = the value maintained by POST /_clock/set_current_utc,
#     whose startup default is 2026-08-01T00:00:00Z.
# =============================================================================
calculations:

  # ------------------------------------------------------------------ C1
  - name: placement_rule_selection
    trigger: "POST /placement-determinations (measure evaluation for a (student_id, subject_area) pair)"
    algorithm: selector_policy
    formula: |
      # (a) ELIGIBILITY FILTER — candidate set
      candidates = { r in PlacementRule :
            r.status == ACTIVE
        AND r.subject_area == request.subject_area
        AND r.effective_from <= clock
        AND (r.effective_to IS NULL OR clock < r.effective_to)
        AND (r.required_el_status IS NULL OR r.required_el_status == Student.el_status)
        AND measure_satisfied(r, Student) }

      measure_satisfied(r, S):
        if r.measure_type == TRANSCRIPT_GPA:
            return S.hs_transcript_status IN {SELF_REPORTED, VERIFIED}
               AND S.hs_gpa IS NOT NULL
               AND (r.min_hs_gpa IS NULL OR S.hs_gpa >= r.min_hs_gpa)     # INCLUSIVE lower
               AND (r.max_hs_gpa IS NULL OR S.hs_gpa <  r.max_hs_gpa)     # EXCLUSIVE upper
        if r.measure_type == TEST_SCORE:
            best = best_scaled_score(S, request.subject_area)   # see below; NULL if none
            return best IS NOT NULL
               AND (r.min_score IS NULL OR best >= r.min_score)           # INCLUSIVE lower
               AND (r.max_score IS NULL OR best <= r.max_score)           # INCLUSIVE upper
        if r.measure_type == SELF_GUIDED:
            return S.self_guided_pathway IS NOT NULL
               AND r.required_self_guided_pathway == S.self_guided_pathway

      best_scaled_score(S, subj):
        pool = { a in TestAttempt : a.student_id == S.id
                                AND a.subject_area == subj
                                AND a.state == SCORED }        # VOIDED / NO_SHOW excluded
        if pool is empty: return NULL
        return max(a.scaled_score for a in pool)
        # the ATTEMPT the winner cites (source_attempt_id) is the pool member with
        # the maximum scaled_score; tie on scaled_score -> earliest created_at.

      # (b) RANKING EXPRESSION — "highest placement the student qualifies for"
      sort candidates by:
          1. Course(r.target_course_id).level_rank      DESC
          2. MEASURE_PRECEDENCE[r.measure_type]         ASC   # TRANSCRIPT_GPA=0, TEST_SCORE=1, SELF_GUIDED=2
          3. r.priority_rank                            ASC
      # (c) TIE-BREAK when all three keys tie
          4. r.created_at                               ASC
      winner = first element

      # (d) EMPTY-POOL FALLBACK
      if candidates is empty: reject with ERR_NO_PLACEMENT_RULE_MATCH (422)

      # OUTPUTS written onto the new PlacementDetermination
      applied_rule_id    = winner.id
      measure_type_used  = winner.measure_type
      placed_course_id   = winner.target_course_id
      coreq_course_id    = winner.coreq_course_id IF winner.coreq_required ELSE NULL
      source_attempt_id  = the cited attempt IF winner.measure_type == TEST_SCORE ELSE NULL
    input_set: "PlacementRule rows with status == ACTIVE only; DRAFT / SUPERSEDED / RETIRED rules never enter the candidate set. TestAttempt rows with state == SCORED only."
    constants:
      MEASURE_PRECEDENCE: { TRANSCRIPT_GPA: 0, TEST_SCORE: 1, SELF_GUIDED: 2 }
    precision: "integer comparisons on level_rank / priority_rank / scaled_score; GPA compared at 2 decimal places"
    note: |
      The EL-pathway gate (validations priority 13) runs AFTER the winner is
      chosen and NEVER causes re-ranking: if the winner of the ranking is not
      EL-appropriate for an EL_ACTIVE student, the request is REJECTED rather
      than falling back to the runner-up.

  # ------------------------------------------------------------------ C2
  - name: placement_base_confidence_score
    trigger: "POST /placement-determinations, immediately after calculations.placement_rule_selection picks a winner"
    algorithm: weighted_scoring
    formula: |
      # --- component scores, each on a 0.00-100.00 scale ---
      if Student.hs_transcript_status IN {SELF_REPORTED, VERIFIED} AND Student.hs_gpa IS NOT NULL:
          t = round( min(100.00, Student.hs_gpa / GPA_SCALE_MAX * 100), 2 )
      else:
          t = 0.00

      best = best_scaled_score(Student, subject_area)     # same helper as C1
      if best IS NOT NULL:
          s = round( min(100.00, best / MAX_SCALED_SCORE * 100), 2 )
      else:
          s = 0.00

      g = SELF_GUIDED_COMPONENT_VALUE if Student.self_guided_pathway IS NOT NULL else 0.00

      # --- MANDATED ROUNDING ORDER (round-per-term, THEN sum) ---
      wt = round(t * W_TRANSCRIPT,  2)
      ws = round(s * W_TEST,        2)
      wg = round(g * W_SELF_GUIDED, 2)
      base_confidence_score = round(wt + ws + wg, 1)
      # FORBIDDEN alternative that yields different cents on some inputs:
      #   round(t*W_TRANSCRIPT + s*W_TEST + g*W_SELF_GUIDED, 1)
      # The scaffold pins ROUND-PER-WEIGHTED-TERM-THEN-SUM. Implementations that
      # sum first and round once are wrong even when the two agree on some inputs.
    input_set: "the Student row as of the request, plus TestAttempt rows with state == SCORED in the determination's subject_area"
    constants:
      GPA_SCALE_MAX: 4.00
      MAX_SCALED_SCORE: 1000
      SELF_GUIDED_COMPONENT_VALUE: 60.00
      W_TRANSCRIPT: 0.50
      W_TEST: 0.35
      W_SELF_GUIDED: 0.15
    precision: "components and weighted terms at 2 decimal places round_half_up; base_confidence_score at 1 decimal place round_half_up"

  # ------------------------------------------------------------------ C3
  - name: placement_validity_window
    trigger: "POST /placement-determinations, immediately after calculations.placement_base_confidence_score"
    algorithm: threshold
    formula: |
      # CIRCULAR-LOOKING DEPENDENCY: validity_days is keyed on a confidence tier,
      # while the STORED confidence_score depends on expires_at (which is itself
      # derived from validity_days). The evaluation order below is MANDATORY and
      # makes the values well-defined.

      # STEP 1 — base score (output of C2, already rounded to 1 dp)
      base = base_confidence_score

      # STEP 2 — tier selection reads `base`, NEVER the stored confidence_score
      if   base >= VALIDITY_TIER_HIGH_MIN: validity_days = 730
      elif base >= VALIDITY_TIER_MID_MIN:  validity_days = 365
      else:                                validity_days = 180

      # STEP 3
      determined_at = logical clock
      expires_at    = determined_at + validity_days days

      # STEP 4 — staleness measured from the transcript date to expires_at
      if Student.transcript_recorded_at IS NULL:
          staleness_penalty = 0.0
      else:
          d = floor( (expires_at - Student.transcript_recorded_at) / 86400 seconds )
          staleness_penalty = round( min( STALENESS_PENALTY_CAP,
                                          max(0.0, (d - STALENESS_GRACE_DAYS) / STALENESS_DAYS_PER_POINT) ), 1 )

      # STEP 5 — stored score
      confidence_score = round( max(0.0, base - staleness_penalty), 1 )

      # STEP 6 — initial evidence_state, INCLUSIVE threshold
      evidence_state = VERIFIED if (confidence_score >= CONFIDENCE_VERIFY_MIN
                                    AND Student.hs_transcript_status == VERIFIED)
                       else UNVERIFIED

      # PINNED: validity_days and expires_at are NOT recomputed after STEP 5,
      # even when confidence_score falls below the tier threshold used in STEP 2.
    input_set: "the single PlacementDetermination being created; Student.transcript_recorded_at and Student.hs_transcript_status as of the request"
    constants:
      VALIDITY_TIER_HIGH_MIN: 85.0
      VALIDITY_TIER_MID_MIN: 70.0
      VALIDITY_TIER_LOW_DAYS: 180
      STALENESS_GRACE_DAYS: 1095
      STALENESS_DAYS_PER_POINT: 73.0
      STALENESS_PENALTY_CAP: 20.0
      CONFIDENCE_VERIFY_MIN: 70.0
      APPEAL_OVERRIDE_CONFIDENCE: 90.0
    precision: "penalty and scores at 1 decimal place round_half_up; validity_days is an exact integer from {180, 365, 730}"
    variants:
      - name: appeal_override_bypass
        when: "the determination is minted by PlacementAppeal INSTRUCTOR_ENDORSED -> GRANTED (measure_type_used == APPEAL_OVERRIDE)"
        difference: "STEPS 1-5 are skipped entirely: base_confidence_score = confidence_score = APPEAL_OVERRIDE_CONFIDENCE (90.0), staleness_penalty = 0.0, validity_days = 365, evidence_state = VERIFIED regardless of Student.hs_transcript_status"

  # ------------------------------------------------------------------ C4
  - name: attempt_scaled_score
    trigger: "POST /test-attempts/{attempt_id}/score (CHECKED_IN -> SCORED)"
    algorithm: threshold
    formula: |
      base      = round(raw_score * RAW_SCORE_SCALE_FACTOR, 0)          # integer, round_half_up
      penalised = base - (IRREGULARITY_SCALED_PENALTY if irregularity_flag else 0)
      scaled_score = min(MAX_SCALED_SCORE, max(0, penalised))
    input_set: "the single TestAttempt being scored"
    constants:
      RAW_SCORE_SCALE_FACTOR: 6.25
      IRREGULARITY_SCALED_PENALTY: 25
      MAX_SCALED_SCORE: 1000
    precision: "scaled_score is an integer clamped to [0, 1000]"

  # ------------------------------------------------------------------ C5
  - name: retake_eligibility_window
    trigger: "POST /test-attempts/{attempt_id}/score, and recomputed on every void that renumbers sibling attempt_ordinals"
    algorithm: chronological
    formula: |
      # STEP 1 — ordinal assignment / renumbering (order is MANDATORY)
      pool = { a in TestAttempt : a.student_id == S.id
                              AND a.subject_area == subj
                              AND a.state != VOIDED }
      sort pool by created_at ASC        # NEVER by id
      for i, a in enumerate(pool, start=1): a.attempt_ordinal = i

      # STEP 2 — waiting period tier keyed on the NEW ordinal
      def waiting_days(ordinal):
          if ordinal == 1: return WAITING_PERIOD_DAYS_TIER_1     # 14
          if ordinal == 2: return WAITING_PERIOD_DAYS_TIER_2     # 30
          return WAITING_PERIOD_DAYS_TIER_3                      # 180

      # STEP 3 — recompute from the attempt's OWN, UNCHANGED scored_at
      for a in pool where a.state == SCORED:
          a.next_eligible_at = a.scored_at + waiting_days(a.attempt_ordinal) days
      for a in pool where a.state != SCORED:
          a.next_eligible_at = NULL

      # STEP 4 — booking gate consumed by POST /test-attempts
      gate = max( a.next_eligible_at for a in pool where a.state == SCORED )   # NULL if none
      booking is allowed iff gate IS NULL OR gate <= TestAdministration.starts_at
      # INCLUSIVE: gate exactly equal to starts_at is ALLOWED.
    input_set: "the Student's TestAttempts in the same subject_area with state != VOIDED; NO_SHOW attempts stay in the ordinal pool but carry next_eligible_at = NULL"
    constants:
      WAITING_PERIOD_DAYS_TIER_1: 14
      WAITING_PERIOD_DAYS_TIER_2: 30
      WAITING_PERIOD_DAYS_TIER_3: 180
      MAX_ATTEMPTS_PER_SUBJECT: 3
    precision: "whole days added to scored_at; comparison at second granularity"

  # ------------------------------------------------------------------ C6
  - name: section_available_seats
    trigger: "read of Section.available_seats, and every Registration confirm / drop / deny / waitlist-promotion"
    algorithm: aggregation
    formula: |
      seats_taken(S)    = count(Registration r : r.section_id == S.id AND r.state IN {ENROLLED, COMPLETED})
      seats_held(S)     = count(Registration r : r.section_id == S.id AND r.state == PENDING)
      waitlist_count(S) = count(Registration r : r.section_id == S.id AND r.state == WAITLISTED)
      # base (variant-independent) definitions above; the two variants below
      # differ in whether PENDING holds and the partner section constrain supply.

      # SELF-HOLD EXCLUSION (applies to BOTH variants): when this calculation is
      # evaluated as the seat gate inside POST /registrations/{registration_id}/confirm,
      # the confirming Registration's OWN PENDING row is removed from seats_held(S)
      # first, because that row is about to leave PENDING. A read of
      # Section.available_seats never applies the exclusion.
    input_set: "Registration rows for the Section (and, under paired_conservative, for the linked Section); DENIED and DROPPED rows never count"
    constants:
      WAITLIST_CAP: 10
    precision: "integer seats; both variants floor at 0"
    variants:
      - name: committed_only
        when: "Section.pairing_state IN {UNPAIRED, PAIR_BROKEN}"
        difference: |
          available_seats = max(0, S.seat_capacity - seats_taken(S))
          PENDING holds are IGNORED — a held seat is still advertised as available.
      - name: paired_conservative
        when: "Section.pairing_state == PAIRED (applies to BOTH halves of the pair)"
        difference: |
          L = Section with id == S.linked_section_id
          available_seats = max(0, min( S.seat_capacity - seats_taken(S) - seats_held(S),
                                        L.seat_capacity - seats_taken(L) - seats_held(L) ))
          PENDING holds on BOTH halves are SUBTRACTED, and the partner's supply
          caps this section's. Identical Registration data therefore yields a
          strictly smaller number than committed_only whenever seats_held > 0 or
          the partner is tighter.

  # ------------------------------------------------------------------ C7
  - name: prerequisite_satisfaction_closure
    trigger: "POST /registrations (initial computation) and POST /registrations/{registration_id}/confirm (re-evaluation), plus every override revoke / expire / requisite retire cascade"
    algorithm: topological
    formula: |
      C = Section(Registration.section_id).course_id
      reqs = { q in CourseRequisite : q.course_id == C
                                  AND q.status == ACTIVE
                                  AND q.requisite_type == PREREQUISITE
                                  AND q.enforcement == BLOCKING }
      # PINNED: only DIRECT prerequisites are enforced at registration.
      # Transitive closure is used ONLY for cycle detection (see C8-adjacent note).

      GRADE_RANK = { A: 4, B: 3, C: 2, P: 2, D: 1, F: 0, NP: 0, W: 0 }
      def grade_ok(g, m):
          if g IN {NP, W} or g IS NULL: return false
          return GRADE_RANK[g] >= GRADE_RANK[m]

      def by_grade(q):
          return exists Registration r : r.student_id == Registration.student_id
                                     AND r.state == COMPLETED
                                     AND Section(r.section_id).course_id == q.requisite_course_id
                                     AND grade_ok(r.final_grade, q.min_grade)

      def by_override(q):
          o = PrerequisiteOverride with id == Registration.override_id
          return o IS NOT NULL
             AND o.student_id  == Registration.student_id
             AND o.course_id   == C
             AND o.requisite_id == q.id
             AND o.state IN {ISSUED, CONSUMED}
             AND clock < o.expires_at

      if reqs is EMPTY:                                   return SATISFIED   # empty-set boundary
      if any q in reqs where NOT by_grade(q) AND NOT by_override(q): return UNMET
      if any q in reqs where NOT by_grade(q) AND by_override(q):     return OVERRIDDEN
      return SATISFIED

      # CYCLE DETECTION (POST /course-requisites only, requisite_type == PREREQUISITE):
      # reject when requisite_course_id can reach course_id by following ACTIVE
      # PREREQUISITE edges (depth-first over CourseRequisite), including the
      # degenerate self-edge course_id == requisite_course_id.
    input_set: "ACTIVE BLOCKING PREREQUISITE CourseRequisite edges of the section's course; the student's COMPLETED Registrations; the single PrerequisiteOverride named by Registration.override_id"
    constants:
      GRADE_RANK: { A: 4, B: 3, C: 2, P: 2, D: 1, F: 0, NP: 0, W: 0 }
    precision: "exact enum comparison; no rounding"

  # ------------------------------------------------------------------ C8
  - name: term_unit_load
    trigger: "POST /registrations/{registration_id}/confirm"
    algorithm: aggregation
    formula: |
      T = Section(Registration.section_id).term_code
      # STEP 1 — existing load, EXCLUDING this Registration
      base = sum( Course(Section(r.section_id).course_id).units
                  for r in Registration
                  where r.student_id == Registration.student_id
                    AND r.id != Registration.id
                    AND r.state IN {ENROLLED, WAITLISTED, COMPLETED}
                    AND Section(r.section_id).term_code == T )

      # STEP 2 — add this section's units
      units_primary = base + Course(Section.course_id).units

      # STEP 3 — corequisite units are added, NEVER dropped to fit the cap
      if Section.pairing_state == PAIRED AND Section.role_in_pair == PRIMARY:
          units_total = units_primary + Course(Section(Section.linked_section_id).course_id).units
      else:
          units_total = units_primary

      term_units_at_confirm = round(units_total, 1)
      reject with ERR_TERM_UNIT_CAP_EXCEEDED when term_units_at_confirm > MAX_TERM_UNITS
      # INCLUSIVE: term_units_at_confirm exactly equal to MAX_TERM_UNITS is ALLOWED.
    input_set: "Registration rows of the same Student with state IN {ENROLLED, WAITLISTED, COMPLETED} in the same term_code; PENDING, DENIED and DROPPED rows are excluded"
    constants:
      MAX_TERM_UNITS: 18.0
    precision: "1 decimal place round_half_up"

  # ------------------------------------------------------------------ C9
  - name: cut_score_validation_outcome
    trigger: "POST /validation-studies/{study_id}/run (DRAFT -> RUNNING and COMPLETED -> RUNNING)"
    algorithm: aggregation
    formula: |
      R = PlacementRule with id == study.candidate_rule_id
      T = R.target_course_id

      def in_window(reg): return study.window_start_at <= reg.graded_at < study.window_end_at   # HALF-OPEN

      def det_of(reg):   # the student's determination for this study's subject that placed into T
          return the PlacementDetermination d where d.student_id == reg.student_id
                                               AND d.subject_area == study.subject_area
                                               AND d.placed_course_id == T
                                               AND d.placement_state IN {PROVISIONAL, FINAL, SUPERSEDED, APPEALED}
                 choosing the one with the greatest determined_at; tie -> greatest created_at

      success(reg) = reg.final_grade IN {A, B, C, P}
      rate(num, den) = NULL if den == 0 else round(num / den, 4)
    input_set: "Registration rows with state == COMPLETED whose Section.course_id == the candidate rule's target_course_id and whose graded_at lies in [window_start_at, window_end_at)"
    constants:
      VALIDATION_MIN_SUCCESS_RATE: 0.7000
    precision: "rates at 4 decimal places round_half_up"
    variants:
      - name: strict_cohort
        when: "always computed; this is the ONLY variant the COMPLETED -> APPROVED gate reads"
        difference: |
          cohort = { reg : reg.state == COMPLETED AND in_window(reg)
                       AND Section(reg.section_id).course_id == T
                       AND reg.final_grade NOT IN {W}                     # withdrawals EXCLUDED
                       AND det_of(reg) IS NOT NULL
                       AND det_of(reg).measure_type_used == TEST_SCORE }  # test-placed students ONLY
          strict_cohort_size   = |cohort|
          strict_success_count = count(reg in cohort where success(reg))
          strict_success_rate  = rate(strict_success_count, strict_cohort_size)
      - name: inclusive_cohort
        when: "always computed and stored alongside strict_*, but NEVER consulted by the approval gate"
        difference: |
          cohort = { reg : reg.state == COMPLETED AND in_window(reg)
                       AND Section(reg.section_id).course_id == T
                       AND det_of(reg) IS NOT NULL }
          # W grades stay IN the denominator (counted as non-success) and students
          # placed by TRANSCRIPT_GPA / SELF_GUIDED / APPEAL_OVERRIDE are INCLUDED.
          inclusive_cohort_size   = |cohort|
          inclusive_success_count = count(reg in cohort where success(reg))
          inclusive_success_rate  = rate(inclusive_success_count, inclusive_cohort_size)

  # ----------------------------------------------------------------- C10
  - name: disproportionate_impact_index
    trigger: "POST /validation-studies/{study_id}/run, immediately after calculations.cut_score_validation_outcome"
    algorithm: weighted_scoring
    formula: |
      # groups are keyed on Student.race_ethnicity_code over the STRICT cohort only
      for each distinct k = Student(reg.student_id).race_ethnicity_code in strict cohort:
          n[k] = count(reg in strict cohort where key == k)
          s[k] = count(reg in strict cohort where key == k AND success(reg))
          rate[k] = round(s[k] / n[k], 4)

      eligible = { k : n[k] >= MIN_SUBGROUP_N }

      if eligible is EMPTY:
          reference_group_key = NULL
          disproportionate_impact_index = 1.0000        # no impact detectable
      else:
          # reference group = highest rate; tie -> larger n[k]; tie -> code ASC (lexicographic)
          reference_group_key = argmax over eligible of (rate[k], n[k], -lexicographic(k))
          rr = rate[reference_group_key]
          if rr == 0.0:
              disproportionate_impact_index = 1.0000
          else:
              disproportionate_impact_index = round( min( rate[k] / rr for k in eligible ), 4 )
      # >= 3 interacting inputs (per-group n, per-group s, MIN_SUBGROUP_N) with a
      # nested min over a ratio whose denominator is itself an argmax selection.
    input_set: "the strict cohort produced by calculations.cut_score_validation_outcome variant strict_cohort; inclusive-cohort-only rows never participate"
    constants:
      MIN_SUBGROUP_N: 10
      DI_MIN_INDEX: 0.8000
    precision: "group rates and the index at 4 decimal places round_half_up"

  # ----------------------------------------------------------------- C11
  - name: equity_throughput_gap
    trigger: "GET /courses/{course_id}/equity-summary"
    algorithm: aggregation
    formula: |
      groups are keyed on disaggregation_key:
        RACE_ETHNICITY   -> Student.race_ethnicity_code
        EL_STATUS        -> Student.el_status
        FIRST_GENERATION -> Student.first_generation rendered as "TRUE" / "FALSE"
        PELL             -> Student.pell_eligible    rendered as "TRUE" / "FALSE"

      placed[k] = count of DISTINCT Student.id with key k having >= 1
                  PlacementDetermination d where d.placed_course_id == course_id
                    AND window_start_at <= d.determined_at < window_end_at      # HALF-OPEN
      through[k] = count of those same Students having >= 1 Registration r where
                    r.state == COMPLETED
                    AND Section(r.section_id).course_id == course_id
                    AND r.final_grade IN {A, B, C, P}
                    AND r.graded_at < window_end_at + THROUGHPUT_TERMS * TERM_LENGTH_DAYS days
      rate[k] = NULL if placed[k] == 0 else round(through[k] / placed[k], 4)

      scored = { k : placed[k] >= 1 }
      throughput_gap = NULL if |scored| < 2
                       else round( max(rate[k] for k in scored) - min(rate[k] for k in scored), 4 )
      # groups are returned sorted by group_key ASC (lexicographic on the rendered key)
    input_set: "PlacementDetermination rows whose determined_at lies in [window_start_at, window_end_at) and placed into the requested course, in every placement_state; Registration rows with state == COMPLETED"
    constants:
      THROUGHPUT_TERMS: 2
      TERM_LENGTH_DAYS: 120
    precision: "rates and gap at 4 decimal places round_half_up"

  # ----------------------------------------------------------------- C12
  - name: section_seat_ledger_invariant
    trigger: "asserted after every Registration create / confirm / drop / deny / waitlist-promotion and after every Section cancel"
    algorithm: aggregation
    formula: |
      # NAMED CONSERVED QUANTITY: seat_ledger(S)
      seat_ledger(S) = S.seats_taken + S.seats_held + S.waitlist_count
                       + count(Registration r : r.section_id == S.id AND r.state IN {DENIED, DROPPED})

      INVARIANT 1: seat_ledger(S) == count(Registration r : r.section_id == S.id)
      INVARIANT 2: S.seats_taken == count(Registration r : r.section_id == S.id AND r.state IN {ENROLLED, COMPLETED})
      INVARIANT 3: S.seats_taken <= S.seat_capacity

      COMPENSATING PAIR: POST /registrations (hold) -> confirm (ENROLLED) is
      compensated by POST /registrations/{id}/drop. After the pair,
      S.seats_taken and S.seats_held return EXACTLY to their pre-confirm values
      and seat_ledger(S) is unchanged, even though the drop's HOP 3 waitlist
      promotion may reassign which Registration occupies the freed seat.
    input_set: "all Registration rows for the Section, in every state"
    precision: "exact integer equality; no tolerance"

  # ----------------------------------------------------------------- C13
  - name: retake_budget_invariant
    trigger: "asserted after every TestAttempt score / void / no-show and after every TestAdministration close / cancel"
    algorithm: aggregation
    formula: |
      # NAMED CONSERVED QUANTITY: retake budget per (Student, subject_area)
      INVARIANT 1: Student.attempt_counts[subj] + Student.remaining_attempts[subj] == MAX_ATTEMPTS_PER_SUBJECT
      INVARIANT 2: Student.attempt_counts[subj] == count(TestAttempt a : a.student_id == Student.id
                                                                     AND a.subject_area == subj
                                                                     AND a.state == SCORED)

      COMPENSATING PAIR: POST /test-attempts/{id}/score is compensated by
      POST /test-attempts/{id}/void. After the pair, attempt_counts[subj] and
      remaining_attempts[subj] return EXACTLY to their pre-score values, with no
      drift, even though sibling attempt_ordinals and next_eligible_at values are
      renumbered in between.
    input_set: "the Student's TestAttempt rows in the subject, in every state"
    constants:
      MAX_ATTEMPTS_PER_SUBJECT: 3
    precision: "exact integer equality; no tolerance"

  # ----------------------------------------------------------------- C14
  - name: override_redemption_balance_invariant
    trigger: "asserted after every Registration confirm / drop / deny and every PrerequisiteOverride revoke / expire"
    algorithm: aggregation
    formula: |
      # NAMED CONSERVED QUANTITY: override redemption balance
      redeemed = count(PrerequisiteOverride o : o.state == CONSUMED)
      claimed  = count(Registration r : r.override_id IS NOT NULL
                                    AND r.state IN {ENROLLED, COMPLETED})

      INVARIANT 1: redeemed == claimed
      INVARIANT 2: for every o with o.state == CONSUMED, o.consumed_by_registration_id
                   names a Registration with state IN {ENROLLED, COMPLETED}
      INVARIANT 3: for every o with o.state == ISSUED, o.consumed_by_registration_id IS NULL

      COMPENSATING PAIR: Registration PENDING -> ENROLLED (ISSUED -> CONSUMED) is
      compensated by ENROLLED -> DROPPED (CONSUMED -> ISSUED). After the pair the
      balance returns to its pre-confirm value and INVARIANT 3 holds again.
    input_set: "all PrerequisiteOverride rows and all Registration rows with override_id set"
    precision: "exact integer equality; no tolerance"

# =============================================================================
# §1.4 Validation Rules Table (evaluated strictly in ascending priority order;
# the FIRST violated rule determines the response and no later rule is evaluated)
# =============================================================================
validations:

  - priority: 1
    category: auth
    check: "X-User-Role header present and equal to one of the seven roles declared in §1.7"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "X-User-ID header present and non-empty; when X-User-Role == Student, X-User-ID must be the id of an existing Student"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 3
    category: auth
    check: "the acting role appears in the endpoint's roles list in §1.5"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all

  - priority: 4
    category: business_constraint
    check: "request body / query shape: all required input fields present, no unknown fields, enum members valid, numeric ranges and decimal precision respected, datetimes ISO-8601 UTC, limit in [1,100] and offset >= 0"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all

  - priority: 5
    category: existence
    check: "every path parameter resolves to an existing row, validated left-to-right"
    error_id: "ERR_STUDENT_NOT_FOUND | ERR_COURSE_NOT_FOUND | ERR_REQUISITE_NOT_FOUND | ERR_RULE_NOT_FOUND | ERR_ADMINISTRATION_NOT_FOUND | ERR_ATTEMPT_NOT_FOUND | ERR_DETERMINATION_NOT_FOUND | ERR_APPEAL_NOT_FOUND | ERR_SECTION_NOT_FOUND | ERR_REGISTRATION_NOT_FOUND | ERR_OVERRIDE_NOT_FOUND | ERR_STUDY_NOT_FOUND"
    http_status: 404
    applies_to: all

  - priority: 6
    category: existence
    check: "every foreign key supplied in the request body resolves to an existing row, validated in the field order declared by the endpoint's input list"
    error_id: "same catalogue as priority 5"
    http_status: 404
    applies_to: "POST /course-requisites, POST /placement-rules, POST /test-administrations, POST /test-attempts, POST /placement-determinations, POST /placement-appeals, POST /sections, POST /sections/{section_id}/pair, POST /registrations, POST /prerequisite-overrides, POST /validation-studies"

  - priority: 7
    category: business_constraint
    check: "the expected_<parent>_version supplied in the body equals the current version of the OCC parent named in §1.2.1"
    error_id: "ERR_STALE_STUDENT_VERSION | ERR_STALE_SECTION_VERSION | ERR_STALE_DETERMINATION_VERSION"
    http_status: 412
    applies_to: "POST /placement-determinations, POST /registrations, POST /placement-appeals"

  - priority: 8
    category: state
    check: "the target resource is in a state from which the requested transition is declared in §1.2"
    error_id: "ERR_INVALID_STATE | ERR_ADMINISTRATION_NOT_BOOKABLE | ERR_ADMINISTRATION_NOT_OPEN | ERR_SECTION_NOT_OPEN | ERR_SECTION_NOT_CLOSED | ERR_OVERRIDE_CONSUMED | ERR_APPEAL_NOT_ENDORSED | ERR_DETERMINATION_SUPERSEDED"
    http_status: 409
    applies_to: "all POST endpoints that drive a §1.2 transition"

  - priority: 9
    category: state
    check: "cross-entity state preconditions hold: TestAdministration.status for attempt transitions; Course.status == ACTIVE for section open / rule activate / appeal endorse; PlacementDetermination placement_state and evidence_state for registration confirm; PlacementRule.status == DRAFT for study run / approve; PlacementDetermination.placement_state == APPEALED for appeal start-review"
    error_id: "ERR_ADMINISTRATION_NOT_OPEN | ERR_COURSE_RETIRED | ERR_PLACEMENT_NOT_ACTIONABLE | ERR_CANDIDATE_RULE_NOT_DRAFT | ERR_INVALID_STATE"
    http_status: 409
    applies_to: "POST /test-attempts/{attempt_id}/check-in, POST /test-attempts/{attempt_id}/score, POST /sections/{section_id}/status, POST /placement-rules/{rule_id}/activate, POST /registrations/{registration_id}/confirm, POST /placement-appeals/{appeal_id}/start-review, POST /placement-appeals/{appeal_id}/endorse, POST /validation-studies/{study_id}/run, POST /validation-studies/{study_id}/decide"

  - priority: 10
    category: business_safety
    check: "segregation of duties: study decider != proposer (SoD-1); appeal reviewer/decider != the appealed determination's determined_by_user_id (SoD-2); appeal endorser != reviewed_by_user_id (SoD-3)"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /validation-studies/{study_id}/decide, POST /placement-appeals/{appeal_id}/start-review, POST /placement-appeals/{appeal_id}/endorse, POST /placement-appeals/{appeal_id}/decide"

  - priority: 11
    category: business_safety
    check: "actor-resource binding: X-User-ID equals TestAdministration.proctor_user_id for proctor actions; equals PlacementAppeal.reviewed_by_user_id for request-info and decide; equals PrerequisiteOverride.issued_by_user_id for an Instructor revoke; equals Registration.student_id / PlacementAppeal.student_id / Student.id for Student-role actions"
    error_id: "ERR_NOT_ASSIGNED_PROCTOR | ERR_NOT_APPEAL_REVIEWER | ERR_NOT_OVERRIDE_ISSUER | ERR_NOT_RESOURCE_OWNER"
    http_status: 403
    applies_to: "POST /test-administrations/{administration_id}/status, POST /test-attempts/{attempt_id}/check-in, POST /test-attempts/{attempt_id}/score, POST /placement-appeals/{appeal_id}/request-info, POST /placement-appeals/{appeal_id}/resubmit, POST /placement-appeals/{appeal_id}/decide, POST /prerequisite-overrides/{override_id}/revoke, POST /registrations/{registration_id}/drop, POST /students/{student_id}/measures"

  - priority: 12
    category: business_safety
    check: "prerequisite enforcement: calculations.prerequisite_satisfaction_closure must not return UNMET"
    error_id: ERR_PREREQUISITE_NOT_MET
    http_status: 422
    applies_to: "POST /registrations/{registration_id}/confirm"

  - priority: 13
    category: business_safety
    check: "English learner pathway: when Student.el_status == EL_ACTIVE and subject_area IN {ENGLISH, ESL}, the PlacementRule chosen by the selector MUST have required_el_status == EL_ACTIVE. Also, a PlacementAppeal with grounds == EL_PATHWAY requires Student.el_status IN {EL_ACTIVE, EL_EXITED}."
    error_id: ERR_EL_PATHWAY_VIOLATION
    http_status: 422
    applies_to: "POST /placement-determinations, POST /placement-appeals"

  - priority: 14
    category: business_referential
    check: "adding a PREREQUISITE CourseRequisite must not create a cycle over ACTIVE PREREQUISITE edges, including the degenerate self-edge"
    error_id: ERR_REQUISITE_CYCLE
    http_status: 409
    applies_to: "POST /course-requisites"

  - priority: 15
    category: business_referential
    check: "corequisite pairing integrity: primary section's course has is_support_course == false, support section's course has is_support_course == true, matching term_code, and an ACTIVE COREQUISITE CourseRequisite edge exists between the two courses; on section open, a course targeted by an ACTIVE coreq_required rule must be PAIRED"
    error_id: "ERR_COREQ_SECTION_MISMATCH | ERR_COREQ_PAIRING_REQUIRED | ERR_COREQ_COURSE_INVALID"
    http_status: 422
    applies_to: "POST /sections/{section_id}/pair, POST /sections/{section_id}/status, POST /placement-rules/{rule_id}/activate"

  - priority: 16
    category: business_referential
    check: "the Section's course must be the student's placed_course_id or coreq_course_id on the governing determination"
    error_id: ERR_PLACEMENT_COURSE_MISMATCH
    http_status: 422
    applies_to: "POST /registrations/{registration_id}/confirm"

  - priority: 17
    category: business_temporal
    check: "room turnaround geometry: two TestAdministrations in the same room_code with status IN {SCHEDULED, OPEN, CLOSED} conflict when a.starts_at < b.ends_at + ROOM_TURNAROUND_MINUTES AND b.starts_at < a.ends_at + ROOM_TURNAROUND_MINUTES. A gap of EXACTLY ROOM_TURNAROUND_MINUTES is allowed; CANCELLED sessions never conflict."
    error_id: ERR_ROOM_TIME_CONFLICT
    http_status: 409
    applies_to: "POST /test-administrations"
    constants:
      ROOM_TURNAROUND_MINUTES: 30

  - priority: 18
    category: business_temporal
    check: "corequisite meeting geometry: the two paired Sections' meeting blocks must not overlap under HALF-OPEN, ZERO-BUFFER semantics — conflict iff primary.meets_start_at < support.meets_end_at AND support.meets_start_at < primary.meets_end_at. Exact adjacency (one ends at the instant the other starts) is ALLOWED."
    error_id: ERR_COREQ_TIME_CONFLICT
    http_status: 409
    applies_to: "POST /sections/{section_id}/pair"

  - priority: 19
    category: business_temporal
    check: "proctor daily aggregate: for the proctor_user_id, the sum of TestAdministration minutes CLIPPED to each UTC calendar day (a session spanning midnight contributes to both days) over sessions with status IN {SCHEDULED, OPEN, CLOSED} plus the new session must not exceed PROCTOR_DAILY_MINUTES_CAP on any single day"
    error_id: ERR_PROCTOR_DAILY_CAP_EXCEEDED
    http_status: 409
    applies_to: "POST /test-administrations"
    constants:
      PROCTOR_DAILY_MINUTES_CAP: 480

  - priority: 20
    category: business_temporal
    check: "retake waiting period: max(next_eligible_at) over the Student's SCORED attempts in the administration's subject_area must be NULL or <= TestAdministration.starts_at"
    error_id: ERR_RETAKE_WAITING_PERIOD
    http_status: 422
    applies_to: "POST /test-attempts"

  - priority: 21
    category: business_temporal
    check: "expiry windows: logical clock < PlacementDetermination.determined_at + APPEAL_FILING_WINDOW_DAYS days on appeal create; logical clock < PlacementAppeal.filed_at + APPEAL_RESUBMIT_DAYS days on resubmit; logical clock < PrerequisiteOverride.expires_at when an override is presented"
    error_id: "ERR_APPEAL_WINDOW_CLOSED | ERR_OVERRIDE_EXPIRED"
    http_status: 422
    applies_to: "POST /placement-appeals, POST /placement-appeals/{appeal_id}/resubmit, POST /registrations"
    constants:
      APPEAL_FILING_WINDOW_DAYS: 30
      APPEAL_RESUBMIT_DAYS: 14
      APPEAL_MAX_REVISION_ROUNDS: 2

  - priority: 22
    category: business_temporal
    check: "validation study observation window must be closed: window_end_at <= logical clock"
    error_id: ERR_STUDY_WINDOW_OPEN
    http_status: 422
    applies_to: "POST /validation-studies/{study_id}/run"

  - priority: 23
    category: business_constraint
    check: "retake cap and session capacity: Student.remaining_attempts[administration.subject_area] >= 1; the Student has no TestAttempt with state IN {BOOKED, CHECKED_IN} in the same subject_area; TestAdministration.seats_booked < seat_capacity"
    error_id: "ERR_ATTEMPT_LIMIT_REACHED | ERR_ATTEMPT_ALREADY_OPEN | ERR_ADMINISTRATION_FULL"
    http_status: "422 | 422 | 409"
    applies_to: "POST /test-attempts"

  - priority: 24
    category: business_constraint
    check: "appeal revision cap: PlacementAppeal.revision_round < APPEAL_MAX_REVISION_ROUNDS"
    error_id: ERR_APPEAL_ROUND_LIMIT
    http_status: 422
    applies_to: "POST /placement-appeals/{appeal_id}/request-info"

  - priority: 25
    category: business_constraint
    check: "uniqueness: Student.student_number, Course.course_code, the (course_id, requisite_course_id, requisite_type) triple among ACTIVE CourseRequisites, and one live Registration per (student, section)"
    error_id: "ERR_DUPLICATE_STUDENT_NUMBER | ERR_DUPLICATE_COURSE_CODE | ERR_DUPLICATE_REQUISITE | ERR_DUPLICATE_REGISTRATION"
    http_status: 409
    applies_to: "POST /students, POST /courses, POST /course-requisites, POST /registrations"

  - priority: 26
    category: business_constraint
    check: "measure completeness and selector outcome: the candidate set produced by calculations.placement_rule_selection must be non-empty; an activating PlacementRule must carry the bounds its measure_type requires"
    error_id: "ERR_NO_PLACEMENT_RULE_MATCH | ERR_RULE_MEASURE_INCOMPLETE"
    http_status: 422
    applies_to: "POST /placement-determinations, POST /placement-rules/{rule_id}/activate"

  - priority: 27
    category: business_constraint
    check: "validation study viability: strict_cohort_size >= 1 after computation; strict_success_rate >= VALIDATION_MIN_SUCCESS_RATE and disproportionate_impact_index >= DI_MIN_INDEX on approval"
    error_id: "ERR_STUDY_COHORT_EMPTY | ERR_VALIDATION_RATE_TOO_LOW | ERR_DISPROPORTIONATE_IMPACT"
    http_status: 422
    applies_to: "POST /validation-studies/{study_id}/run, POST /validation-studies/{study_id}/decide"

  - priority: 28
    category: business_constraint
    check: "a Course may not be retired while any Section for it has status IN {PLANNED, OPEN}"
    error_id: ERR_COURSE_HAS_LIVE_SECTIONS
    http_status: 409
    applies_to: "POST /courses/{course_id}/retire"

  - priority: 29
    category: business_fiscal
    check: "term unit cap: calculations.term_unit_load result <= MAX_TERM_UNITS, with corequisite support units included and never dropped to fit"
    error_id: ERR_TERM_UNIT_CAP_EXCEEDED
    http_status: 422
    applies_to: "POST /registrations/{registration_id}/confirm"

  - priority: 30
    category: business_fiscal
    check: "seat capacity: calculations.section_available_seats >= 1 for the applicable variant, otherwise the confirm falls back to WAITLISTED; when available_seats == 0 AND waitlist_count >= WAITLIST_CAP the request is rejected"
    error_id: ERR_SECTION_FULL
    http_status: 409
    applies_to: "POST /registrations/{registration_id}/confirm"

# =============================================================================
# §1.5 API Endpoint Table
#
# api_prefix is "" — every collection sits at the URL root.
# Pagination inputs (`limit?`, `offset?`) follow response_envelope defaults.
# =============================================================================
endpoints:

  # ------------------------------------------------ test-driving (clock)
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical UTC clock. Before any call to this endpoint the logical clock reads exactly 2026-08-01T00:00:00Z (the mandatory startup default) and NEVER falls back to real wall-clock time. Every deadline, expiry, waiting period and observation window in this scaffold is evaluated against this logical clock."
    roles: [SystemAdmin]
    code: 200
    input: [current_utc]
    output: null
    side_effects:
      - "sets the logical clock consumed by calculations.placement_validity_window, calculations.retake_eligibility_window, validations priorities 21/22, and PrerequisiteOverride expiry"
      - "performs exactly ONE declared sweep: every PrerequisiteOverride with state == ISSUED and expires_at <= the new clock value moves ISSUED -> EXPIRED (state_machines.PrerequisiteOverride), and every PENDING or WAITLISTED Registration that presented such an override recomputes prerequisite_status"
      - "transitions NO other entity: appeal filing/resubmit windows, study observation windows, determination validity windows and section/administration statuses are all evaluated lazily at each read or write, never swept by this endpoint"

  # ------------------------------------------------------------- Student
  - method: POST
    path: "/students"
    description: "Register a student in the assessment office roster."
    roles: [SystemAdmin, AssessmentStaff]
    code: 201
    input: [student_number, full_name, race_ethnicity_code, "first_generation?", "pell_eligible?", "el_status?", "hs_gpa?", "hs_transcript_status?", "transcript_recorded_at?", "self_guided_pathway?"]
    output: Student
    side_effects:
      - "initialises attempt_counts to {MATH: 0, ENGLISH: 0, ESL: 0} and remaining_attempts to {MATH: 3, ENGLISH: 3, ESL: 3} (calculations.retake_budget_invariant holds from creation)"
      - "placement_status = UNPLACED; advising_hold = false"

  - method: GET
    path: "/students/{student_id}"
    description: "Fetch one student including computed attempt_counts, remaining_attempts, placement_status and advising_hold."
    roles: [SystemAdmin, AssessmentStaff, AssessmentDirector, Registrar, Instructor, Student]
    code: 200
    input: []
    output: Student
    side_effects: []

  - method: GET
    path: "/students"
    description: "List students with filtering and pagination."
    roles: [SystemAdmin, AssessmentStaff, AssessmentDirector, Registrar]
    code: 200
    input: ["student_number?", "el_status?", "placement_status?", "hs_transcript_status?", "limit?", "offset?"]
    output: Student[]
    side_effects: []

  - method: POST
    path: "/students/{student_id}/measures"
    description: "Record or update the student's multiple-measures inputs (transcript GPA, transcript verification status, self-guided pathway, EL status). Only the fields supplied are changed."
    roles: [AssessmentStaff, Student]
    code: 200
    input: ["hs_gpa?", "hs_transcript_status?", "transcript_recorded_at?", "self_guided_pathway?", "el_status?"]
    output: Student
    side_effects:
      - "increments Student.version by 1 (which invalidates any previously observed expected_student_version)"
      - "does NOT recompute existing PlacementDeterminations; a new determination must be created to reflect the new measures"

  - method: GET
    path: "/students/{student_id}/determinations"
    description: "Sub-resource listing of every placement determination for the student, in every placement_state, ordered by determined_at ASC then created_at ASC."
    roles: [SystemAdmin, AssessmentStaff, AssessmentDirector, Registrar, Instructor, Student]
    code: 200
    input: ["subject_area?", "placement_state?", "limit?", "offset?"]
    output: PlacementDetermination[]
    side_effects: []

  # -------------------------------------------------------------- Course
  - method: POST
    path: "/courses"
    description: "Create a catalogue course. Support (corequisite) courses use is_support_course = true and level_rank 90; transfer-level courses use level_rank 100."
    roles: [SystemAdmin]
    code: 201
    input: [course_code, title, subject_area, level_rank, units, "is_support_course?", "transfer_level?"]
    output: Course
    side_effects:
      - "status = ACTIVE; enrolled_count, success_count and success_rate initialise to 0 / 0 / null"

  - method: GET
    path: "/courses/{course_id}"
    description: "Fetch one course including computed enrolled_count, success_count and success_rate."
    roles: [SystemAdmin, AssessmentStaff, AssessmentDirector, Registrar, Instructor, Student]
    code: 200
    input: []
    output: Course
    side_effects: []

  - method: GET
    path: "/courses"
    description: "List catalogue courses with filtering and pagination."
    roles: [SystemAdmin, AssessmentStaff, AssessmentDirector, Registrar, Instructor, Student]
    code: 200
    input: ["subject_area?", "is_support_course?", "transfer_level?", "status?", "limit?", "offset?"]
    output: Course[]
    side_effects: []

  - method: POST
    path: "/courses/{course_id}/retire"
    description: "Retire a course (ACTIVE -> RETIRED). Blocked while any Section for the course is PLANNED or OPEN."
    roles: [SystemAdmin]
    code: 200
    input: []
    output: Course
    side_effects:
      - "HOP 1: every ACTIVE CourseRequisite whose course_id or requisite_course_id is this course -> RETIRED; every ACTIVE or DRAFT PlacementRule whose target_course_id or coreq_course_id is this course -> RETIRED"
      - "HOP 2: every CutScoreValidationStudy in state DRAFT, RUNNING or COMPLETED whose candidate_rule_id points at a rule retired in HOP 1 -> WITHDRAWN"
      - "HOP 3: every PrerequisiteOverride in state ISSUED whose requisite_id points at a requisite retired in HOP 1 -> REVOKED, and each affected Registration's prerequisite_status is recomputed by calculations.prerequisite_satisfaction_closure"
      - "rejects with ERR_COURSE_HAS_LIVE_SECTIONS (409) when a PLANNED or OPEN Section exists"

  - method: GET
    path: "/courses/{course_id}/equity-summary"
    description: "Computed read: disaggregated placement-to-throughput report for one course over a closed observation window, per calculations.equity_throughput_gap."
    roles: [AssessmentDirector, AssessmentStaff]
    code: 200
    input: [disaggregation_key, window_start_at, window_end_at]
    output: { course_id: string, disaggregation_key: string, window_start_at: datetime, window_end_at: datetime, group_count: integer, groups: array, throughput_gap: number, min_group_key: string, max_group_key: string }
    side_effects: []

  - method: GET
    path: "/courses/{course_id}/requisites"
    description: "Sub-resource listing of every CourseRequisite carried BY this course (course_id == path id), in every status."
    roles: [SystemAdmin, AssessmentStaff, Registrar, Instructor, Student]
    code: 200
    input: ["requisite_type?", "status?", "limit?", "offset?"]
    output: CourseRequisite[]
    side_effects: []

  # ------------------------------------------------------ CourseRequisite
  - method: POST
    path: "/course-requisites"
    description: "Declare a prerequisite / corequisite / advisory edge between two courses."
    roles: [SystemAdmin]
    code: 201
    input: [course_id, requisite_course_id, requisite_type, "min_grade?", "enforcement?"]
    output: CourseRequisite
    side_effects:
      - "status = ACTIVE; min_grade defaults to C; enforcement defaults to BLOCKING"
      - "runs the cycle check in calculations.prerequisite_satisfaction_closure; rejects with ERR_REQUISITE_CYCLE (409) when requisite_course_id can reach course_id over ACTIVE PREREQUISITE edges, including the degenerate self-edge"
      - "recomputes prerequisite_status on every PENDING Registration for course_id"

  - method: GET
    path: "/course-requisites/{requisite_id}"
    description: "Fetch one requisite edge."
    roles: [SystemAdmin, AssessmentStaff, Registrar, Instructor, Student]
    code: 200
    input: []
    output: CourseRequisite
    side_effects: []

  - method: GET
    path: "/course-requisites"
    description: "List requisite edges filtered by either endpoint of the edge."
    roles: [SystemAdmin, AssessmentStaff, Registrar, Instructor, Student]
    code: 200
    input: ["course_id?", "requisite_course_id?", "requisite_type?", "enforcement?", "status?", "limit?", "offset?"]
    output: CourseRequisite[]
    side_effects: []

  - method: POST
    path: "/course-requisites/{requisite_id}/retire"
    description: "Retire a requisite edge (ACTIVE -> RETIRED)."
    roles: [SystemAdmin]
    code: 200
    input: []
    output: CourseRequisite
    side_effects:
      - "HOP 1: every PrerequisiteOverride in state ISSUED with requisite_id == this edge -> REVOKED"
      - "HOP 2: every Registration in state PENDING or WAITLISTED whose section's course is this edge's course_id has prerequisite_status recomputed by calculations.prerequisite_satisfaction_closure; a registration that had been OVERRIDDEN solely by an override revoked in HOP 1 becomes UNMET"

  # -------------------------------------------------------- PlacementRule
  - method: POST
    path: "/placement-rules"
    description: "Draft a multiple-measures placement rule. Created in DRAFT; not consulted by the selector until activated."
    roles: [AssessmentDirector]
    code: 201
    input: [subject_area, measure_type, target_course_id, "coreq_course_id?", "coreq_required?", priority_rank, "min_hs_gpa?", "max_hs_gpa?", "min_score?", "max_score?", "required_el_status?", "required_self_guided_pathway?", effective_from, "effective_to?", version_label]
    output: PlacementRule
    side_effects:
      - "status = DRAFT; activated_at = null; coreq_required defaults to false"

  - method: GET
    path: "/placement-rules/{rule_id}"
    description: "Fetch one placement rule."
    roles: [AssessmentDirector, AssessmentStaff, Registrar]
    code: 200
    input: []
    output: PlacementRule
    side_effects: []

  - method: GET
    path: "/placement-rules"
    description: "List placement rules filtered by subject, measure, status or either course reference."
    roles: [AssessmentDirector, AssessmentStaff, Registrar]
    code: 200
    input: ["subject_area?", "measure_type?", "status?", "target_course_id?", "coreq_course_id?", "required_el_status?", "limit?", "offset?"]
    output: PlacementRule[]
    side_effects: []

  - method: POST
    path: "/placement-rules/{rule_id}/activate"
    description: "Activate a DRAFT rule so calculations.placement_rule_selection can select it."
    roles: [AssessmentDirector]
    code: 200
    input: []
    output: PlacementRule
    side_effects:
      - "status = ACTIVE; activated_at = logical clock"
      - "rejects with ERR_RULE_MEASURE_INCOMPLETE (422) when the rule lacks the bounds its measure_type requires (TRANSCRIPT_GPA needs at least one of min_hs_gpa / max_hs_gpa; TEST_SCORE needs at least one of min_score / max_score; SELF_GUIDED needs required_self_guided_pathway)"
      - "rejects with ERR_COREQ_COURSE_INVALID (422) when coreq_required is true and coreq_course_id is null, points at a course with is_support_course == false, or has no ACTIVE COREQUISITE CourseRequisite edge to target_course_id"
      - "rejects with ERR_COURSE_RETIRED (409) when target_course_id or coreq_course_id is RETIRED"
      - "supersedes: every other ACTIVE rule with the same (subject_area, measure_type, target_course_id) -> SUPERSEDED, regardless of version_label"

  - method: POST
    path: "/placement-rules/{rule_id}/retire"
    description: "Retire a DRAFT, ACTIVE or SUPERSEDED rule."
    roles: [AssessmentDirector]
    code: 200
    input: []
    output: PlacementRule
    side_effects:
      - "status = RETIRED; the rule leaves the selector's candidate set immediately"
      - "every CutScoreValidationStudy in state DRAFT, RUNNING or COMPLETED with candidate_rule_id == this rule -> WITHDRAWN"

  # --------------------------------------------------- TestAdministration
  - method: POST
    path: "/test-administrations"
    description: "Schedule a proctored test session in a room for one subject area."
    roles: [AssessmentStaff]
    code: 201
    input: [room_code, subject_area, proctor_user_id, starts_at, ends_at, seat_capacity]
    output: TestAdministration
    side_effects:
      - "status = SCHEDULED; duration_minutes = (ends_at - starts_at) in whole minutes; seats_booked = 0"
      - "runs the room-turnaround check (validations priority 17) -> ERR_ROOM_TIME_CONFLICT (409)"
      - "runs the proctor daily-minutes check (validations priority 19) -> ERR_PROCTOR_DAILY_CAP_EXCEEDED (409)"

  - method: GET
    path: "/test-administrations/{administration_id}"
    description: "Fetch one test session including computed duration_minutes and seats_booked."
    roles: [AssessmentStaff, Proctor, AssessmentDirector, Student]
    code: 200
    input: []
    output: TestAdministration
    side_effects: []

  - method: GET
    path: "/test-administrations"
    description: "List test sessions with filtering and pagination."
    roles: [AssessmentStaff, Proctor, AssessmentDirector, Student]
    code: 200
    input: ["room_code?", "subject_area?", "status?", "proctor_user_id?", "starts_at_from?", "starts_at_to?", "limit?", "offset?"]
    output: TestAdministration[]
    side_effects: []

  - method: POST
    path: "/test-administrations/{administration_id}/status"
    description: "Drive the session's status machine: SCHEDULED->OPEN, OPEN->CLOSED (Proctor / AssessmentStaff), SCHEDULED->CANCELLED, OPEN->CANCELLED (AssessmentDirector)."
    roles: [Proctor, AssessmentStaff, AssessmentDirector]
    code: 200
    input: [target_status]
    output: TestAdministration
    side_effects:
      - "SCHEDULED -> OPEN requires the acting Proctor's X-User-ID == proctor_user_id (ERR_NOT_ASSIGNED_PROCTOR, 403) and logical clock < ends_at (ERR_ADMINISTRATION_WINDOW_PASSED, 422)"
      - "OPEN -> CLOSED sets every BOOKED attempt to NO_SHOW; NO_SHOW attempts keep their ordinal slot with next_eligible_at = null"
      - "-> CANCELLED HOP 1: every attempt in BOOKED, CHECKED_IN or SCORED -> VOIDED with void_reason = PROCTOR_ERROR"
      - "-> CANCELLED HOP 2: attempt_ordinals renumbered and Student.attempt_counts / remaining_attempts restored per calculations.retake_budget_invariant"
      - "-> CANCELLED HOP 3: next_eligible_at recomputed for every surviving SCORED attempt of each affected (student, subject) pair per calculations.retake_eligibility_window"

  - method: GET
    path: "/test-administrations/{administration_id}/attempts"
    description: "Sub-resource listing of every attempt booked into this session, ordered by created_at ASC."
    roles: [AssessmentStaff, Proctor, AssessmentDirector]
    code: 200
    input: ["state?", "limit?", "offset?"]
    output: TestAttempt[]
    side_effects: []

  # ---------------------------------------------------------- TestAttempt
  - method: POST
    path: "/test-attempts"
    description: "Book a seat for a student in a test session. Enforces the retake waiting period and the per-subject attempt cap."
    roles: [AssessmentStaff, Student]
    code: 201
    input: [student_id, administration_id]
    output: TestAttempt
    side_effects:
      - "state = BOOKED; subject_area copied from the session; attempt_ordinal assigned by calculations.retake_eligibility_window STEP 1"
      - "rejects with ERR_ADMINISTRATION_NOT_BOOKABLE (409) when the session's status is CLOSED or CANCELLED"
      - "rejects with ERR_ADMINISTRATION_FULL (409) when seats_booked >= seat_capacity"
      - "rejects with ERR_RETAKE_WAITING_PERIOD (422) per validations priority 20"
      - "rejects with ERR_ATTEMPT_LIMIT_REACHED (422) when remaining_attempts[subject] == 0, or ERR_ATTEMPT_ALREADY_OPEN (422) when a BOOKED or CHECKED_IN attempt already exists in the same subject"

  - method: GET
    path: "/test-attempts/{attempt_id}"
    description: "Fetch one attempt including computed subject_area, attempt_ordinal, scaled_score and next_eligible_at."
    roles: [AssessmentStaff, Proctor, AssessmentDirector, Registrar, Student]
    code: 200
    input: []
    output: TestAttempt
    side_effects: []

  - method: GET
    path: "/test-attempts"
    description: "List attempts filtered by student, session, state or subject."
    roles: [AssessmentStaff, Proctor, AssessmentDirector, Registrar, Student]
    code: 200
    input: ["student_id?", "administration_id?", "state?", "subject_area?", "irregularity_flag?", "limit?", "offset?"]
    output: TestAttempt[]
    side_effects: []

  - method: POST
    path: "/test-attempts/{attempt_id}/check-in"
    description: "Proctor checks the student into the room (BOOKED -> CHECKED_IN)."
    roles: [Proctor]
    code: 200
    input: []
    output: TestAttempt
    side_effects:
      - "requires the parent TestAdministration.status == OPEN (ERR_ADMINISTRATION_NOT_OPEN, 409) — cross-entity state precondition, validations priority 9"
      - "requires X-User-ID == TestAdministration.proctor_user_id (ERR_NOT_ASSIGNED_PROCTOR, 403)"

  - method: POST
    path: "/test-attempts/{attempt_id}/score"
    description: "Proctor records the raw score (CHECKED_IN -> SCORED)."
    roles: [Proctor]
    code: 200
    input: [raw_score, "irregularity_flag?"]
    output: TestAttempt
    side_effects:
      - "requires the parent TestAdministration.status == OPEN (ERR_ADMINISTRATION_NOT_OPEN, 409)"
      - "requires X-User-ID == TestAdministration.proctor_user_id (ERR_NOT_ASSIGNED_PROCTOR, 403)"
      - "computes scaled_score per calculations.attempt_scaled_score; sets scored_at = logical clock"
      - "increments Student.attempt_counts[subject] by 1 and decrements remaining_attempts[subject] by 1 (calculations.retake_budget_invariant)"
      - "computes next_eligible_at per calculations.retake_eligibility_window"

  - method: POST
    path: "/test-attempts/{attempt_id}/void"
    description: "Void an attempt for irregularity, proctor error or administrative correction. Drives the deepest cascade in the scaffold (5 hops)."
    roles: [Proctor, AssessmentStaff]
    code: 200
    input: [void_reason]
    output: TestAttempt
    side_effects:
      - "HOP 1: state -> VOIDED; Student.attempt_counts[subject] decremented and remaining_attempts[subject] incremented; sibling attempt_ordinals renumbered over non-VOIDED attempts by created_at ASC; next_eligible_at recomputed for every surviving SCORED attempt from its own unchanged scored_at"
      - "HOP 2: every PlacementDetermination with source_attempt_id == this attempt and placement_state != SUPERSEDED -> evidence_state = DISPUTED"
      - "HOP 3: every Registration in state PENDING, ENROLLED or WAITLISTED whose section's course is the disputed determination's placed_course_id or coreq_course_id -> DENIED with denial_reason = EVIDENCE_DISPUTED; the section's seat is released"
      - "HOP 4: the paired counterpart named by coreq_registration_id on each registration denied in HOP 3 -> DENIED with the same denial_reason; any PrerequisiteOverride in state CONSUMED by those registrations -> ISSUED with consumed_by_registration_id cleared (calculations.override_redemption_balance_invariant)"
      - "HOP 5: for each section whose seat was released, WAITLISTED registrations are promoted to ENROLLED in created_at ASC order while calculations.section_available_seats >= 1"

  - method: POST
    path: "/test-attempts/{attempt_id}/no-show"
    description: "Mark a BOOKED attempt as a no-show (BOOKED -> NO_SHOW)."
    roles: [Proctor]
    code: 200
    input: []
    output: TestAttempt
    side_effects:
      - "next_eligible_at = null; the attempt KEEPS its ordinal slot, so a no-show still advances the waiting-period tier of the next scored attempt"
      - "does NOT change Student.attempt_counts or remaining_attempts (only SCORED attempts consume budget)"

  # ------------------------------------------------ PlacementDetermination
  - method: POST
    path: "/placement-determinations"
    description: "Run the multiple-measures selector for one (student, subject) pair and mint a determination. OCC parent: Student."
    roles: [AssessmentStaff]
    code: 201
    input: [student_id, subject_area, expected_student_version]
    output: PlacementDetermination
    side_effects:
      - "increments Student.version by 1"
      - "rejects with ERR_STALE_STUDENT_VERSION (412) when expected_student_version != Student.version"
      - "runs calculations.placement_rule_selection -> ERR_NO_PLACEMENT_RULE_MATCH (422) on an empty candidate set"
      - "runs the EL-pathway gate (validations priority 13) on the SELECTED winner only -> ERR_EL_PATHWAY_VIOLATION (422); the selector never re-ranks to dodge this gate"
      - "runs calculations.placement_base_confidence_score then calculations.placement_validity_window; sets placement_state = PROVISIONAL and evidence_state per STEP 6"
      - "supersedes: the student's previous non-terminal determination in the same subject_area -> SUPERSEDED with superseded_by_id set to the new row"

  - method: GET
    path: "/placement-determinations/{determination_id}"
    description: "Fetch one determination including both state axes and all confidence fields."
    roles: [AssessmentStaff, AssessmentDirector, Registrar, Instructor, Student]
    code: 200
    input: []
    output: PlacementDetermination
    side_effects: []

  - method: GET
    path: "/placement-determinations"
    description: "List determinations filtered by student, subject, either state axis, or any of the six foreign keys."
    roles: [AssessmentStaff, AssessmentDirector, Registrar, Instructor, Student]
    code: 200
    input: ["student_id?", "subject_area?", "applied_rule_id?", "placed_course_id?", "coreq_course_id?", "source_attempt_id?", "superseded_by_id?", "placement_state?", "evidence_state?", "measure_type_used?", "limit?", "offset?"]
    output: PlacementDetermination[]
    side_effects: []

  - method: POST
    path: "/placement-determinations/{determination_id}/finalize"
    description: "Promote a determination on the placement axis (PROVISIONAL -> FINAL)."
    roles: [AssessmentStaff]
    code: 200
    input: []
    output: PlacementDetermination
    side_effects:
      - "requires evidence_state == VERIFIED (ERR_EVIDENCE_NOT_VERIFIED, 422) — the two axes are independent but FINAL is gated on the evidence axis"
      - "requires logical clock < expires_at (ERR_PLACEMENT_EXPIRED, 422)"
      - "increments Student.version by 1"

  - method: POST
    path: "/placement-determinations/{determination_id}/evidence"
    description: "Move the determination's independent evidence axis: UNVERIFIED->VERIFIED, UNVERIFIED->DISPUTED, VERIFIED->DISPUTED, DISPUTED->VERIFIED. The placement axis is untouched."
    roles: [AssessmentStaff]
    code: 200
    input: [target_evidence_state, "note?"]
    output: PlacementDetermination
    side_effects:
      - "-> VERIFIED requires Student.hs_transcript_status == VERIFIED when measure_type_used == TRANSCRIPT_GPA, or a SCORED source attempt when measure_type_used == TEST_SCORE (ERR_NO_VERIFIABLE_EVIDENCE, 422)"
      - "-> DISPUTED denies every Registration in PENDING, ENROLLED or WAITLISTED on the determination's placed_course_id or coreq_course_id with denial_reason = EVIDENCE_DISPUTED, releases their seats, releases their CONSUMED overrides to ISSUED, and promotes waitlists in created_at ASC order"
      - "rejects with ERR_DETERMINATION_SUPERSEDED (409) when placement_state == SUPERSEDED"

  # ------------------------------------------------------ PlacementAppeal
  - method: POST
    path: "/placement-appeals"
    description: "File a placement appeal against a determination. OCC parent: PlacementDetermination."
    roles: [Student, Registrar]
    code: 201
    input: [determination_id, requested_course_id, grounds, statement, expected_determination_version]
    output: PlacementAppeal
    side_effects:
      - "increments PlacementDetermination.version by 1"
      - "rejects with ERR_STALE_DETERMINATION_VERSION (412) when expected_determination_version != PlacementDetermination.version"
      - "state = SUBMITTED; revision_round = 0; filed_at = logical clock; student_id copied from the determination"
      - "moves the determination's placement axis PROVISIONAL -> APPEALED or FINAL -> APPEALED; rejects with ERR_PLACEMENT_NOT_ACTIONABLE (409) from SUPERSEDED or APPEALED"
      - "rejects with ERR_APPEAL_WINDOW_CLOSED (422) when logical clock >= determined_at + 30 days"
      - "rejects with ERR_EL_PATHWAY_VIOLATION (422) when grounds == EL_PATHWAY and Student.el_status == NOT_EL"

  - method: GET
    path: "/placement-appeals/{appeal_id}"
    description: "Fetch one appeal including revision_round and both reviewer identities."
    roles: [Registrar, Instructor, AssessmentStaff, AssessmentDirector, Student]
    code: 200
    input: []
    output: PlacementAppeal
    side_effects: []

  - method: GET
    path: "/placement-appeals"
    description: "List appeals filtered by determination, student, requested course, minted determination, state or grounds."
    roles: [Registrar, Instructor, AssessmentStaff, AssessmentDirector, Student]
    code: 200
    input: ["determination_id?", "student_id?", "requested_course_id?", "minted_determination_id?", "state?", "grounds?", "limit?", "offset?"]
    output: PlacementAppeal[]
    side_effects: []

  - method: POST
    path: "/placement-appeals/{appeal_id}/start-review"
    description: "Registrar takes ownership of an appeal (SUBMITTED -> UNDER_REVIEW, or INFO_REQUESTED -> UNDER_REVIEW after a resubmit)."
    roles: [Registrar]
    code: 200
    input: []
    output: PlacementAppeal
    side_effects:
      - "sets reviewed_by_user_id = X-User-ID on the first entry into UNDER_REVIEW; later re-entries do not change it"
      - "SoD-2: rejects with ERR_SEGREGATION_OF_DUTIES (403) when X-User-ID == the appealed determination's determined_by_user_id"
      - "requires the appealed determination's placement_state == APPEALED (ERR_INVALID_STATE, 409)"

  - method: POST
    path: "/placement-appeals/{appeal_id}/request-info"
    description: "Send the appeal back to the student for more information (UNDER_REVIEW -> INFO_REQUESTED). Capped at 2 rounds."
    roles: [Registrar]
    code: 200
    input: [info_request_note]
    output: PlacementAppeal
    side_effects:
      - "increments revision_round by 1"
      - "requires X-User-ID == reviewed_by_user_id (ERR_NOT_APPEAL_REVIEWER, 403) — checked at validations priority 11, BEFORE the round cap at priority 24"
      - "rejects with ERR_APPEAL_ROUND_LIMIT (422) when revision_round is already 2"

  - method: POST
    path: "/placement-appeals/{appeal_id}/resubmit"
    description: "Student supplies the requested information (INFO_REQUESTED -> UNDER_REVIEW), closing one revision cycle."
    roles: [Student, Registrar]
    code: 200
    input: [statement]
    output: PlacementAppeal
    side_effects:
      - "requires X-User-ID == PlacementAppeal.student_id when acting as Student (ERR_NOT_RESOURCE_OWNER, 403)"
      - "rejects with ERR_APPEAL_WINDOW_CLOSED (422) when logical clock >= filed_at + 14 days"

  - method: POST
    path: "/placement-appeals/{appeal_id}/endorse"
    description: "Instructor of the requested course endorses the appeal (UNDER_REVIEW -> INSTRUCTOR_ENDORSED)."
    roles: [Instructor]
    code: 200
    input: ["decision_note?"]
    output: PlacementAppeal
    side_effects:
      - "sets endorsed_by_user_id = X-User-ID"
      - "SoD-3: rejects with ERR_SEGREGATION_OF_DUTIES (403) when X-User-ID == reviewed_by_user_id"
      - "requires Course(requested_course_id).status == ACTIVE (ERR_COURSE_RETIRED, 409)"

  - method: POST
    path: "/placement-appeals/{appeal_id}/decide"
    description: "Registrar grants or denies the appeal. GRANT requires INSTRUCTOR_ENDORSED and drives the second 5-hop cascade; DENY is allowed from UNDER_REVIEW or INSTRUCTOR_ENDORSED."
    roles: [Registrar]
    code: 200
    input: [decision, decision_note]
    output: PlacementAppeal
    side_effects:
      - "requires X-User-ID == reviewed_by_user_id (ERR_NOT_APPEAL_REVIEWER, 403); SoD-2 also re-checked (ERR_SEGREGATION_OF_DUTIES, 403)"
      - "decision == GRANT from any state other than INSTRUCTOR_ENDORSED rejects with ERR_APPEAL_NOT_ENDORSED (409)"
      - "GRANT HOP 1: state -> GRANTED; decided_at = logical clock"
      - "GRANT HOP 2: the appealed determination APPEALED -> SUPERSEDED, and a new PlacementDetermination is minted with measure_type_used = APPEAL_OVERRIDE, placed_course_id = requested_course_id, placement_state = FINAL, evidence_state = VERIFIED, confidence_score = 90.0 and validity_days = 365 per calculations.placement_validity_window variant appeal_override_bypass; superseded_by_id and minted_determination_id are cross-linked"
      - "GRANT HOP 3: every Registration in PENDING, ENROLLED or WAITLISTED tied to the superseded determination's placed_course_id or coreq_course_id -> DENIED with denial_reason = PLACEMENT_SUPERSEDED; seats released"
      - "GRANT HOP 4: each denied registration's coreq_registration_id counterpart -> DENIED with the same denial_reason; their CONSUMED overrides -> ISSUED"
      - "GRANT HOP 5: waitlist promotion in created_at ASC order on every section whose seat was released"
      - "DENY: state -> DENIED and the appealed determination APPEALED -> FINAL (the cyclic return edge; no new determination is minted)"

  - method: POST
    path: "/placement-appeals/{appeal_id}/withdraw"
    description: "Withdraw an appeal from SUBMITTED, UNDER_REVIEW, INFO_REQUESTED or INSTRUCTOR_ENDORSED."
    roles: [Student, Registrar]
    code: 200
    input: []
    output: PlacementAppeal
    side_effects:
      - "state -> WITHDRAWN; the appealed determination APPEALED -> FINAL"
      - "requires X-User-ID == PlacementAppeal.student_id when acting as Student (ERR_NOT_RESOURCE_OWNER, 403)"

  # ------------------------------------------------------------- Section
  - method: POST
    path: "/sections"
    description: "Plan a term section for a course with a meeting block, room and seat capacity."
    roles: [SystemAdmin, Registrar]
    code: 201
    input: [course_id, term_code, room_code, meets_start_at, meets_end_at, seat_capacity]
    output: Section
    side_effects:
      - "status = PLANNED; pairing_state = UNPAIRED; role_in_pair = NONE; seats_taken / seats_held / waitlist_count = 0"
      - "rejects with ERR_COURSE_RETIRED (409) when the course is RETIRED"

  - method: GET
    path: "/sections/{section_id}"
    description: "Fetch one section including available_seats computed by the variant matching its pairing_state."
    roles: [SystemAdmin, Registrar, AssessmentStaff, Instructor, Student]
    code: 200
    input: []
    output: Section
    side_effects: []

  - method: GET
    path: "/sections"
    description: "List sections filtered by course, term, status, pairing or linked section."
    roles: [SystemAdmin, Registrar, AssessmentStaff, Instructor, Student]
    code: 200
    input: ["course_id?", "term_code?", "room_code?", "status?", "pairing_state?", "role_in_pair?", "linked_section_id?", "limit?", "offset?"]
    output: Section[]
    side_effects: []

  - method: POST
    path: "/sections/{section_id}/pair"
    description: "Cross-reference link: pair this primary section with a support section for corequisite remediation. Path section becomes PRIMARY, body section becomes SUPPORT."
    roles: [Registrar]
    code: 200
    input: [support_section_id]
    output: Section
    side_effects:
      - "both sections: pairing_state -> PAIRED, linked_section_id cross-set, role_in_pair -> PRIMARY / SUPPORT"
      - "switches both sections' available_seats to calculations.section_available_seats variant paired_conservative"
      - "rejects with ERR_COREQ_SECTION_MISMATCH (422) when the primary course has is_support_course == true, the support course has is_support_course == false, the term_codes differ, or no ACTIVE COREQUISITE CourseRequisite edge joins the two courses"
      - "rejects with ERR_COREQ_TIME_CONFLICT (409) per validations priority 18 (zero-buffer half-open overlap; exact adjacency allowed) — checked AFTER the mismatch check"

  - method: POST
    path: "/sections/{section_id}/unpair"
    description: "Break a corequisite pairing (PAIRED -> PAIR_BROKEN on both halves)."
    roles: [Registrar]
    code: 200
    input: []
    output: Section
    side_effects:
      - "both sections: pairing_state -> PAIR_BROKEN, role_in_pair -> NONE; linked_section_id is RETAINED so the broken pair remains auditable and re-pairable"
      - "switches both sections' available_seats back to variant committed_only, which can make available_seats jump upward without any Registration change"
      - "existing paired Registrations keep their coreq_registration_id links"

  - method: POST
    path: "/sections/{section_id}/status"
    description: "Drive the section's status machine: PLANNED->OPEN, OPEN->CLOSED, CLOSED->OPEN, PLANNED->CANCELLED, OPEN->CANCELLED, CLOSED->CANCELLED."
    roles: [Registrar, SystemAdmin]
    code: 200
    input: [target_status]
    output: Section
    side_effects:
      - "PLANNED -> OPEN requires Course.status == ACTIVE (ERR_COURSE_RETIRED, 409) and, when an ACTIVE PlacementRule with coreq_required == true targets this course, pairing_state == PAIRED (ERR_COREQ_PAIRING_REQUIRED, 422)"
      - "CLOSED -> OPEN requires status == CLOSED (ERR_SECTION_NOT_CLOSED, 409); this is the cyclic return edge"
      - "-> CANCELLED HOP 1: every Registration in PENDING, ENROLLED or WAITLISTED -> DENIED with denial_reason = SECTION_CANCELLED; when pairing_state == PAIRED the linked section goes PAIRED -> PAIR_BROKEN"
      - "-> CANCELLED HOP 2: a linked PRIMARY section in status OPEN is forced OPEN -> CLOSED because its corequisite support is gone"
      - "-> CANCELLED HOP 3: each denied registration's coreq_registration_id counterpart -> DENIED, and their CONSUMED overrides -> ISSUED"

  - method: GET
    path: "/sections/{section_id}/registrations"
    description: "Sub-resource listing of every registration attached to this section, in every state, ordered by created_at ASC (the waitlist promotion order)."
    roles: [SystemAdmin, Registrar, Instructor]
    code: 200
    input: ["state?", "limit?", "offset?"]
    output: Registration[]
    side_effects: []

  # --------------------------------------------------------- Registration
  - method: POST
    path: "/registrations"
    description: "Hold a seat in a section (state PENDING). OCC parent: Section. A prerequisite override may be presented at this point."
    roles: [Registrar, Student]
    code: 201
    input: [student_id, section_id, "override_id?", expected_section_version]
    output: Registration
    side_effects:
      - "increments Section.version by 1"
      - "rejects with ERR_STALE_SECTION_VERSION (412) when expected_section_version != Section.version"
      - "state = PENDING; increments Section.seats_held by 1; computes prerequisite_status per calculations.prerequisite_satisfaction_closure"
      - "requires Section.status == OPEN (ERR_SECTION_NOT_OPEN, 409)"
      - "rejects with ERR_DUPLICATE_REGISTRATION (409) when the student already has a Registration in PENDING, ENROLLED, WAITLISTED or COMPLETED for the same section"
      - "rejects with ERR_OVERRIDE_CONSUMED (409) when override_id names an override in state CONSUMED, REVOKED or EXPIRED, and with ERR_OVERRIDE_EXPIRED (422) when logical clock >= override.expires_at"

  - method: GET
    path: "/registrations/{registration_id}"
    description: "Fetch one registration including computed prerequisite_status, term_units_at_confirm and success."
    roles: [Registrar, SystemAdmin, Instructor, AssessmentStaff, Student]
    code: 200
    input: []
    output: Registration
    side_effects: []

  - method: GET
    path: "/registrations"
    description: "List registrations filtered by student, section, coreq counterpart, override, state or term."
    roles: [Registrar, SystemAdmin, Instructor, AssessmentStaff, Student]
    code: 200
    input: ["student_id?", "section_id?", "coreq_registration_id?", "override_id?", "state?", "term_code?", "final_grade?", "limit?", "offset?"]
    output: Registration[]
    side_effects: []

  - method: POST
    path: "/registrations/{registration_id}/confirm"
    description: "Confirm the held seat (PENDING -> ENROLLED, or PENDING -> WAITLISTED when the section is full but the waitlist has room). Runs the full enforcement stack."
    roles: [Registrar]
    code: 200
    input: []
    output: Registration
    side_effects:
      - "cross-entity state precondition: the student's governing PlacementDetermination for the section's subject must have placement_state IN {PROVISIONAL, FINAL} and evidence_state != DISPUTED (ERR_PLACEMENT_NOT_ACTIONABLE, 409)"
      - "validations priority 12: ERR_PREREQUISITE_NOT_MET (422) when calculations.prerequisite_satisfaction_closure returns UNMET"
      - "validations priority 16: ERR_PLACEMENT_COURSE_MISMATCH (422) when the section's course is neither placed_course_id nor coreq_course_id"
      - "validations priority 29: ERR_TERM_UNIT_CAP_EXCEEDED (422) per calculations.term_unit_load, corequisite support units included"
      - "validations priority 30: WAITLISTED when available_seats == 0 and waitlist_count < 10; ERR_SECTION_FULL (409) when available_seats == 0 and waitlist_count >= 10"
      - "on ENROLLED: Section.seats_held decremented, seats_taken incremented (calculations.section_seat_ledger_invariant); any presented PrerequisiteOverride ISSUED -> CONSUMED with consumed_by_registration_id set (calculations.override_redemption_balance_invariant)"
      - "on ENROLLED into a PAIRED PRIMARY section: a counterpart Registration is auto-created in the SUPPORT section and cross-linked via coreq_registration_id on both rows"

  - method: POST
    path: "/registrations/{registration_id}/drop"
    description: "Drop an enrolled or waitlisted registration (compensating action for confirm)."
    roles: [Registrar, Student]
    code: 200
    input: []
    output: Registration
    side_effects:
      - "requires X-User-ID == Registration.student_id when acting as Student (ERR_NOT_RESOURCE_OWNER, 403)"
      - "HOP 1: state -> DROPPED; the section's seat is released and any CONSUMED override returns to ISSUED with consumed_by_registration_id cleared — restoring calculations.override_redemption_balance_invariant to its pre-confirm value"
      - "HOP 2: the coreq_registration_id counterpart -> DROPPED and its seat released"
      - "HOP 3: waitlist promotion on both sections in created_at ASC order while calculations.section_available_seats >= 1"

  - method: POST
    path: "/registrations/{registration_id}/grade"
    description: "Instructor posts the final grade (ENROLLED -> COMPLETED). Feeds the cut-score validation cohorts and the equity report."
    roles: [Instructor]
    code: 200
    input: [final_grade]
    output: Registration
    side_effects:
      - "graded_at = logical clock; success = final_grade IN {A, B, C, P}"
      - "updates Course.enrolled_count, success_count and success_rate"
      - "makes the row eligible for calculations.cut_score_validation_outcome (strict variant excludes final_grade == W; inclusive variant keeps it)"
      - "does NOT release the seat: a COMPLETED registration still counts in Section.seats_taken"

  # -------------------------------------------------- PrerequisiteOverride
  - method: POST
    path: "/prerequisite-overrides"
    description: "Issue a time-boxed waiver of one BLOCKING prerequisite edge for one student."
    roles: [Instructor, Registrar]
    code: 201
    input: [student_id, course_id, requisite_id, justification, expires_at]
    output: PrerequisiteOverride
    side_effects:
      - "state = ISSUED; issued_by_user_id = X-User-ID; consumed_by_registration_id = null"
      - "rejects with ERR_INVALID_REQUEST (400) when the named requisite's course_id differs from the body course_id, its requisite_type is not PREREQUISITE, or its enforcement is not BLOCKING"
      - "rejects with ERR_COURSE_RETIRED (409) when the course is RETIRED"

  - method: GET
    path: "/prerequisite-overrides/{override_id}"
    description: "Fetch one override."
    roles: [Instructor, Registrar, SystemAdmin, Student]
    code: 200
    input: []
    output: PrerequisiteOverride
    side_effects: []

  - method: GET
    path: "/prerequisite-overrides"
    description: "List overrides filtered by student, course, requisite edge, consuming registration or state."
    roles: [Instructor, Registrar, SystemAdmin, Student]
    code: 200
    input: ["student_id?", "course_id?", "requisite_id?", "consumed_by_registration_id?", "state?", "issued_by_user_id?", "limit?", "offset?"]
    output: PrerequisiteOverride[]
    side_effects: []

  - method: POST
    path: "/prerequisite-overrides/{override_id}/revoke"
    description: "Revoke an override (ISSUED -> REVOKED)."
    roles: [Instructor, Registrar]
    code: 200
    input: []
    output: PrerequisiteOverride
    side_effects:
      - "an Instructor may revoke only an override they issued: X-User-ID must equal issued_by_user_id (ERR_NOT_OVERRIDE_ISSUER, 403); a Registrar may revoke any override"
      - "rejects with ERR_OVERRIDE_CONSUMED (409) from state CONSUMED — the consuming Registration must be dropped first, which returns the override to ISSUED"
      - "recomputes prerequisite_status on every PENDING or WAITLISTED Registration that presented this override"

  # ---------------------------------------------- CutScoreValidationStudy
  - method: POST
    path: "/validation-studies"
    description: "Propose a cut-score validation study for a DRAFT placement rule over a closed observation window."
    roles: [AssessmentStaff]
    code: 201
    input: [subject_area, candidate_rule_id, window_start_at, window_end_at]
    output: CutScoreValidationStudy
    side_effects:
      - "state = DRAFT; run_count = 0; proposed_by_user_id = X-User-ID; every cohort metric is null"
      - "rejects with ERR_CANDIDATE_RULE_NOT_DRAFT (409) when the candidate rule's status is not DRAFT"
      - "rejects with ERR_INVALID_REQUEST (400) when window_end_at <= window_start_at or the rule's subject_area differs from the body subject_area"

  - method: GET
    path: "/validation-studies/{study_id}"
    description: "Fetch one study with both cohort variants' metrics and the disproportionate impact index."
    roles: [AssessmentStaff, AssessmentDirector]
    code: 200
    input: []
    output: CutScoreValidationStudy
    side_effects: []

  - method: GET
    path: "/validation-studies"
    description: "List studies filtered by subject, candidate rule or state."
    roles: [AssessmentStaff, AssessmentDirector]
    code: 200
    input: ["subject_area?", "candidate_rule_id?", "state?", "limit?", "offset?"]
    output: CutScoreValidationStudy[]
    side_effects: []

  - method: POST
    path: "/validation-studies/{study_id}/run"
    description: "Compute both cohort variants and the disproportionate impact index (DRAFT -> RUNNING -> COMPLETED, or COMPLETED -> RUNNING for a re-run)."
    roles: [AssessmentStaff]
    code: 200
    input: []
    output: CutScoreValidationStudy
    side_effects:
      - "increments run_count by 1; the state moves DRAFT -> RUNNING -> COMPLETED within the single request (consistency_model: immediate)"
      - "requires window_end_at <= logical clock (ERR_STUDY_WINDOW_OPEN, 422)"
      - "requires the candidate rule's status to still be DRAFT (ERR_CANDIDATE_RULE_NOT_DRAFT, 409)"
      - "writes strict_cohort_size / strict_success_count / strict_success_rate and inclusive_cohort_size / inclusive_success_count / inclusive_success_rate per calculations.cut_score_validation_outcome"
      - "writes disproportionate_impact_index and reference_group_key per calculations.disproportionate_impact_index"
      - "rejects with ERR_STUDY_COHORT_EMPTY (422) when strict_cohort_size == 0, EVEN IF inclusive_cohort_size >= 1"

  - method: POST
    path: "/validation-studies/{study_id}/decide"
    description: "Assessment director approves or rejects a COMPLETED study. Approval activates the candidate rule."
    roles: [AssessmentDirector]
    code: 200
    input: [decision, decision_note]
    output: CutScoreValidationStudy
    side_effects:
      - "SoD-1: rejects with ERR_SEGREGATION_OF_DUTIES (403) when X-User-ID == proposed_by_user_id"
      - "sets decided_by_user_id = X-User-ID"
      - "decision == APPROVE requires strict_success_rate >= 0.7000 (ERR_VALIDATION_RATE_TOO_LOW, 422) and disproportionate_impact_index >= 0.8000 (ERR_DISPROPORTIONATE_IMPACT, 422); inclusive_success_rate is NEVER consulted"
      - "on APPROVE the candidate PlacementRule transitions DRAFT -> ACTIVE with activated_at = logical clock, superseding same-key ACTIVE rules"
      - "on REJECT the candidate rule stays DRAFT"

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:

  # --- generic / auth ---
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role missing or not one of the seven §1.7 roles; X-User-ID missing or empty; X-User-Role == Student with an X-User-ID that is not an existing Student.id"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "the acting role is not listed in the endpoint's roles in §1.5"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "malformed payload: missing required field, unknown field, invalid enum member, numeric out of range, non-ISO-8601 datetime, limit outside [1,100], negative offset, window_end_at <= window_start_at, meets_end_at <= meets_start_at, ends_at <= starts_at, duration over 480 minutes, or an override body whose requisite_id does not describe a BLOCKING PREREQUISITE of the named course"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "the requested transition is not declared in §1.2 from the resource's current state, and no more specific state error applies"

  # --- not found ---
  - id: ERR_STUDENT_NOT_FOUND
    http: 404
    condition: "student_id in a path or body does not resolve"
  - id: ERR_COURSE_NOT_FOUND
    http: 404
    condition: "course_id, requisite_course_id, target_course_id, coreq_course_id or requested_course_id does not resolve"
  - id: ERR_REQUISITE_NOT_FOUND
    http: 404
    condition: "requisite_id in a path or body does not resolve"
  - id: ERR_RULE_NOT_FOUND
    http: 404
    condition: "rule_id or candidate_rule_id does not resolve"
  - id: ERR_ADMINISTRATION_NOT_FOUND
    http: 404
    condition: "administration_id in a path or body does not resolve"
  - id: ERR_ATTEMPT_NOT_FOUND
    http: 404
    condition: "attempt_id in a path does not resolve"
  - id: ERR_DETERMINATION_NOT_FOUND
    http: 404
    condition: "determination_id in a path or body does not resolve"
  - id: ERR_APPEAL_NOT_FOUND
    http: 404
    condition: "appeal_id in a path does not resolve"
  - id: ERR_SECTION_NOT_FOUND
    http: 404
    condition: "section_id or support_section_id does not resolve"
  - id: ERR_REGISTRATION_NOT_FOUND
    http: 404
    condition: "registration_id in a path does not resolve"
  - id: ERR_OVERRIDE_NOT_FOUND
    http: 404
    condition: "override_id in a path or body does not resolve"
  - id: ERR_STUDY_NOT_FOUND
    http: 404
    condition: "study_id in a path does not resolve"

  # --- optimistic concurrency (§1.2.1) ---
  - id: ERR_STALE_STUDENT_VERSION
    http: 412
    condition: "POST /placement-determinations with expected_student_version != Student.version"
  - id: ERR_STALE_SECTION_VERSION
    http: 412
    condition: "POST /registrations with expected_section_version != Section.version"
  - id: ERR_STALE_DETERMINATION_VERSION
    http: 412
    condition: "POST /placement-appeals with expected_determination_version != PlacementDetermination.version"

  # --- uniqueness ---
  - id: ERR_DUPLICATE_STUDENT_NUMBER
    http: 409
    condition: "POST /students with a student_number already on file"
  - id: ERR_DUPLICATE_COURSE_CODE
    http: 409
    condition: "POST /courses with a course_code already on file"
  - id: ERR_DUPLICATE_REQUISITE
    http: 409
    condition: "POST /course-requisites duplicating an ACTIVE (course_id, requisite_course_id, requisite_type) triple"
  - id: ERR_DUPLICATE_REGISTRATION
    http: 409
    condition: "POST /registrations when the student already holds a PENDING, ENROLLED, WAITLISTED or COMPLETED registration in the same section"

  # --- catalogue / requisite graph ---
  - id: ERR_COURSE_HAS_LIVE_SECTIONS
    http: 409
    condition: "POST /courses/{course_id}/retire while a Section for the course is PLANNED or OPEN"
  - id: ERR_COURSE_RETIRED
    http: 409
    condition: "referencing a RETIRED course from section creation, section open, rule activation, appeal endorsement or override issuance"
  - id: ERR_REQUISITE_CYCLE
    http: 409
    condition: "POST /course-requisites where requisite_course_id reaches course_id over ACTIVE PREREQUISITE edges, including the degenerate self-edge"

  # --- placement rules ---
  - id: ERR_RULE_MEASURE_INCOMPLETE
    http: 422
    condition: "activating a rule that lacks the bounds its measure_type requires: TRANSCRIPT_GPA with BOTH min_hs_gpa and max_hs_gpa null; TEST_SCORE with BOTH min_score and max_score null; SELF_GUIDED with required_self_guided_pathway null. A one-sided band (only a lower bound, or only an upper bound) is COMPLETE and activates."
  - id: ERR_COREQ_COURSE_INVALID
    http: 422
    condition: "activating a rule with coreq_required == true whose coreq_course_id is null, is not a support course, or has no ACTIVE COREQUISITE edge to target_course_id"
  - id: ERR_NO_PLACEMENT_RULE_MATCH
    http: 422
    condition: "calculations.placement_rule_selection produces an empty candidate set for the (student, subject_area) pair"

  # --- test administration / attempts ---
  - id: ERR_ROOM_TIME_CONFLICT
    http: 409
    condition: "a new TestAdministration violates the 30-minute room turnaround buffer against a SCHEDULED, OPEN or CLOSED session in the same room_code"
  - id: ERR_PROCTOR_DAILY_CAP_EXCEEDED
    http: 409
    condition: "the proctor's day-clipped assigned minutes would exceed 480 on any single UTC calendar day"
  - id: ERR_NOT_ASSIGNED_PROCTOR
    http: 403
    condition: "a Proctor acts on a session or attempt whose TestAdministration.proctor_user_id differs from X-User-ID"
  - id: ERR_ADMINISTRATION_NOT_BOOKABLE
    http: 409
    condition: "POST /test-attempts against a session whose status is CLOSED or CANCELLED"
  - id: ERR_ADMINISTRATION_NOT_OPEN
    http: 409
    condition: "check-in or score against a session whose status is not OPEN"
  - id: ERR_ADMINISTRATION_WINDOW_PASSED
    http: 422
    condition: "SCHEDULED -> OPEN attempted when logical clock >= ends_at"
  - id: ERR_ADMINISTRATION_FULL
    http: 409
    condition: "POST /test-attempts when seats_booked >= seat_capacity"
  - id: ERR_RETAKE_WAITING_PERIOD
    http: 422
    condition: "the max next_eligible_at over the student's SCORED attempts in the subject is strictly after the session's starts_at"
  - id: ERR_ATTEMPT_LIMIT_REACHED
    http: 422
    condition: "POST /test-attempts when Student.remaining_attempts[subject] == 0"
  - id: ERR_ATTEMPT_ALREADY_OPEN
    http: 422
    condition: "POST /test-attempts when the student already has a BOOKED or CHECKED_IN attempt in the same subject_area"

  # --- placement determinations ---
  - id: ERR_EL_PATHWAY_VIOLATION
    http: 422
    condition: "the selector's winning rule has required_el_status == null for an EL_ACTIVE student in ENGLISH or ESL; or an appeal with grounds == EL_PATHWAY for a student whose el_status is NOT_EL"
  - id: ERR_NO_VERIFIABLE_EVIDENCE
    http: 422
    condition: "moving evidence_state to VERIFIED without a VERIFIED transcript (TRANSCRIPT_GPA) or a SCORED source attempt (TEST_SCORE)"
  - id: ERR_DETERMINATION_SUPERSEDED
    http: 409
    condition: "acting on a determination whose placement_state is SUPERSEDED"
  - id: ERR_PLACEMENT_EXPIRED
    http: 422
    condition: "finalizing a determination when logical clock >= expires_at"
  - id: ERR_EVIDENCE_NOT_VERIFIED
    http: 422
    condition: "PROVISIONAL -> FINAL attempted while evidence_state is UNVERIFIED or DISPUTED"
  - id: ERR_PLACEMENT_NOT_ACTIONABLE
    http: 409
    condition: "filing an appeal against a determination not in PROVISIONAL or FINAL, or confirming a registration whose governing determination is APPEALED / SUPERSEDED or has evidence_state == DISPUTED"

  # --- appeals ---
  - id: ERR_APPEAL_WINDOW_CLOSED
    http: 422
    condition: "filing more than 30 days after determined_at, or resubmitting more than 14 days after filed_at"
  - id: ERR_APPEAL_ROUND_LIMIT
    http: 422
    condition: "POST /placement-appeals/{appeal_id}/request-info when revision_round is already 2"
  - id: ERR_APPEAL_NOT_ENDORSED
    http: 409
    condition: "decision == GRANT from a state other than INSTRUCTOR_ENDORSED"
  - id: ERR_NOT_APPEAL_REVIEWER
    http: 403
    condition: "request-info or decide called by a Registrar whose X-User-ID differs from reviewed_by_user_id"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "SoD-1 study decider == proposer; SoD-2 appeal reviewer/decider == the appealed determination's determined_by_user_id; SoD-3 appeal endorser == reviewed_by_user_id"
  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "a Student acts on a Student, TestAttempt, PlacementAppeal or Registration whose owning student_id differs from X-User-ID"

  # --- sections / registration ---
  - id: ERR_SECTION_NOT_OPEN
    http: 409
    condition: "POST /registrations against a section whose status is not OPEN"
  - id: ERR_SECTION_NOT_CLOSED
    http: 409
    condition: "CLOSED -> OPEN requested for a section that is not CLOSED"
  - id: ERR_COREQ_SECTION_MISMATCH
    http: 422
    condition: "pairing sections with the wrong is_support_course flags, differing term_code, or no ACTIVE COREQUISITE edge between their courses"
  - id: ERR_COREQ_TIME_CONFLICT
    http: 409
    condition: "the two paired sections' meeting blocks overlap under zero-buffer half-open semantics"
  - id: ERR_COREQ_PAIRING_REQUIRED
    http: 422
    condition: "PLANNED -> OPEN for a course targeted by an ACTIVE coreq_required rule while pairing_state is not PAIRED"
  - id: ERR_PLACEMENT_COURSE_MISMATCH
    http: 422
    condition: "confirming a registration whose section course is neither placed_course_id nor coreq_course_id on the governing determination"
  - id: ERR_PREREQUISITE_NOT_MET
    http: 422
    condition: "calculations.prerequisite_satisfaction_closure returns UNMET at confirm"
  - id: ERR_TERM_UNIT_CAP_EXCEEDED
    http: 422
    condition: "calculations.term_unit_load exceeds 18.0 units, corequisite support units included"
  - id: ERR_SECTION_FULL
    http: 409
    condition: "confirm when available_seats == 0 and waitlist_count >= 10"

  # --- prerequisite overrides ---
  - id: ERR_OVERRIDE_CONSUMED
    http: 409
    condition: "presenting or revoking an override in state CONSUMED, REVOKED or EXPIRED"
  - id: ERR_OVERRIDE_EXPIRED
    http: 422
    condition: "presenting an override whose expires_at is at or before the logical clock"
  - id: ERR_NOT_OVERRIDE_ISSUER
    http: 403
    condition: "an Instructor revokes an override whose issued_by_user_id differs from X-User-ID"

  # --- cut-score validation studies ---
  - id: ERR_CANDIDATE_RULE_NOT_DRAFT
    http: 409
    condition: "proposing or running a study whose candidate rule's status is not DRAFT"
  - id: ERR_STUDY_WINDOW_OPEN
    http: 422
    condition: "running a study whose window_end_at is strictly after the logical clock"
  - id: ERR_STUDY_COHORT_EMPTY
    http: 422
    condition: "strict_cohort_size == 0 after computation, even when inclusive_cohort_size >= 1"
  - id: ERR_VALIDATION_RATE_TOO_LOW
    http: 422
    condition: "APPROVE when strict_success_rate < 0.7000"
  - id: ERR_DISPROPORTIONATE_IMPACT
    http: 422
    condition: "APPROVE when disproportionate_impact_index < 0.8000"

# =============================================================================
# §1.7 RBAC Matrix — role_model: segregation_of_duties
# =============================================================================
roles:

  - name: SystemAdmin
    description: "Catalogue and roster steward. Owns courses, requisite edges, section planning and the logical clock."
    identity: opaque
    exclusive_operations:
      - "POST /_clock/set_current_utc"
      - "POST /courses"
      - "POST /courses/{course_id}/retire"
      - "POST /course-requisites"
      - "POST /course-requisites/{requisite_id}/retire"
    shared_operations:
      - "POST /students (with AssessmentStaff)"
      - "POST /sections (with Registrar)"
      - "POST /sections/{section_id}/status (with Registrar)"
      - "all GET reads on students, courses, requisites, sections, registrations and overrides"

  - name: AssessmentDirector
    description: "Owns placement policy: drafts, activates and retires placement rules, and is the sole approver of cut-score validation studies."
    identity: opaque
    exclusive_operations:
      - "POST /placement-rules"
      - "POST /placement-rules/{rule_id}/activate"
      - "POST /placement-rules/{rule_id}/retire"
      - "POST /validation-studies/{study_id}/decide"
    shared_operations:
      - "GET /courses/{course_id}/equity-summary (with AssessmentStaff)"
      - "read access to students, determinations, appeals, attempts, administrations and studies"
    note: "SoD-1 — may not decide a study they proposed; since only AssessmentStaff can propose, a director who also holds the proposer's X-User-ID is blocked."

  - name: AssessmentStaff
    description: "Assessment office operator. Schedules test sessions, records measures, runs the selector, manages the evidence axis, and proposes and runs validation studies."
    identity: opaque
    exclusive_operations:
      - "POST /placement-determinations"
      - "POST /placement-determinations/{determination_id}/finalize"
      - "POST /placement-determinations/{determination_id}/evidence"
      - "POST /test-administrations"
      - "POST /students/{student_id}/measures"
      - "POST /validation-studies"
      - "POST /validation-studies/{study_id}/run"
    shared_operations:
      - "POST /students (with SystemAdmin)"
      - "POST /test-attempts (with Student)"
      - "POST /test-attempts/{attempt_id}/void (with Proctor)"
      - "POST /test-administrations/{administration_id}/status (with Proctor)"
      - "GET /courses/{course_id}/equity-summary (with AssessmentDirector)"

  - name: Proctor
    description: "Room supervisor for a specific test session. Authority is bound to TestAdministration.proctor_user_id, not to the role alone."
    identity: opaque
    exclusive_operations:
      - "POST /test-attempts/{attempt_id}/check-in"
      - "POST /test-attempts/{attempt_id}/score"
      - "POST /test-attempts/{attempt_id}/no-show"
    shared_operations:
      - "POST /test-administrations/{administration_id}/status (with AssessmentStaff)"
      - "POST /test-attempts/{attempt_id}/void (with AssessmentStaff)"
      - "read access to administrations, attempts and students"
    note: "Holding the Proctor role is necessary but not sufficient: every exclusive operation additionally requires X-User-ID == TestAdministration.proctor_user_id (ERR_NOT_ASSIGNED_PROCTOR, validations priority 11)."

  - name: Instructor
    description: "Discipline faculty. Endorses placement appeals for their course, issues prerequisite overrides, and posts final grades."
    identity: opaque
    exclusive_operations:
      - "POST /placement-appeals/{appeal_id}/endorse"
      - "POST /registrations/{registration_id}/grade"
    shared_operations:
      - "POST /prerequisite-overrides (with Registrar)"
      - "POST /prerequisite-overrides/{override_id}/revoke (with Registrar)"
      - "read access to courses, requisites, sections, registrations, appeals and determinations"
    note: "SoD-3 — an Instructor whose X-User-ID equals the appeal's reviewed_by_user_id cannot endorse it. An Instructor may revoke only overrides they issued (ERR_NOT_OVERRIDE_ISSUER); a Registrar has no such restriction."

  - name: Registrar
    description: "Enrolment authority. Owns section pairing and status, the registration lifecycle, and the appeal review/decision steps."
    identity: opaque
    exclusive_operations:
      - "POST /sections/{section_id}/pair"
      - "POST /sections/{section_id}/unpair"
      - "POST /registrations/{registration_id}/confirm"
      - "POST /placement-appeals/{appeal_id}/start-review"
      - "POST /placement-appeals/{appeal_id}/request-info"
      - "POST /placement-appeals/{appeal_id}/decide"
    shared_operations:
      - "POST /sections (with SystemAdmin)"
      - "POST /sections/{section_id}/status (with SystemAdmin)"
      - "POST /registrations (with Student)"
      - "POST /registrations/{registration_id}/drop (with Student)"
      - "POST /placement-appeals (with Student)"
      - "POST /placement-appeals/{appeal_id}/resubmit (with Student)"
      - "POST /placement-appeals/{appeal_id}/withdraw (with Student)"
      - "POST /prerequisite-overrides (with Instructor)"
      - "POST /prerequisite-overrides/{override_id}/revoke (with Instructor)"
    note: "SoD-2 — a Registrar whose X-User-ID equals the appealed determination's determined_by_user_id cannot review or decide the appeal. request-info and decide additionally require X-User-ID == reviewed_by_user_id (ERR_NOT_APPEAL_REVIEWER), so a second Registrar cannot hijack a colleague's appeal."

  - name: Student
    description: "The person being placed. Acts only on their own records."
    identity: "entity_backed:Student"
    exclusive_operations: []
    shared_operations:
      - "POST /students/{student_id}/measures (with AssessmentStaff)"
      - "POST /test-attempts (with AssessmentStaff)"
      - "POST /placement-appeals (with Registrar)"
      - "POST /placement-appeals/{appeal_id}/resubmit (with Registrar)"
      - "POST /placement-appeals/{appeal_id}/withdraw (with Registrar)"
      - "POST /registrations (with Registrar)"
      - "POST /registrations/{registration_id}/drop (with Registrar)"
      - "GET reads of their own student record, attempts, determinations, appeals, registrations and overrides; plus the public course and section catalogues"
    note: "X-User-ID MUST equal an existing Student.id (ERR_UNAUTHENTICATED otherwise). Every write is additionally gated on the resource's owning student_id matching X-User-ID (ERR_NOT_RESOURCE_OWNER, validations priority 11). A Student can never confirm a registration, grade one, run the selector, or touch the appeal review chain."



