          setup:
            - "the FRAME_DAMAGE registry with max_allowance_bps 3000 on a 1450000-cent sale, so the offer cap is 435000"
            - "one FRAME_DAMAGE case evidenced and reviewed by arb-intake-01 at the default clock 2026-08-01T00:00:00Z"
            - "round 1 offered 100000 at 2026-08-01T00:00:00Z and countered by the buyer at the same instant, so cooldown_until_utc is 2026-08-01T02:00:00Z from ROUND_COOLDOWN_HOURS 2 and the case is COUNTERED"
