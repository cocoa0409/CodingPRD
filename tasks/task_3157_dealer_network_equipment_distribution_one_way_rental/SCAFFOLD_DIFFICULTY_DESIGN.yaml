              captures: { dealer_a: $.data.id }
            - call: "POST /rental-network/dealers/${dealer_a}/suspend"
              payload: {}
              as: NetworkAdmin
            - call: "POST /rental-network/vehicle-profiles"
              payload: { label: "Sedan", make: "Honda", model: "Accord", year: 2020, curb_weight_lbs: 3300, tow_capacity_lbs: 0, hitch_class: "NONE" }
              as: Customer
              captures: { veh_1: $.data.id }
            - call: "POST /rental-network/customers"
              payload: { email: "c10@x.com", full_name: "Cust Ten", vehicle_profile_id: "${veh_1}" }
              as: Customer
              captures: { cust_1: $.data.id }
          trigger:
            - call: "POST /rental-network/reservations"
              payload: { customer_id: "${cust_1}", origin_dealer_id: "${dealer_a}", dest_location_id: "00000000-0000-0000-0000-000000000000", equipment_type: "TRUCK_10FT", rental_kind: "ONE_WAY", pickup_date: "2026-11-10T10:00:00Z", dropoff_date: "2026-11-12T10:00:00Z" }
              as: Customer
              as_user_id: "${cust_1}"
              captures: { err: $.data.error_id }
          assert:
            - "trigger response error_id == ERR_REFERENCE_NOT_FOUND (existence priority 5 beats dealer-posture priority 12)"
            - "HTTP status 404"

  # =====================================================================
  # Rule 6 — boundary_precision_check (different metrics, different endpoints)
  # =====================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: tow_capacity_exactly_at_80_percent_boundary
        grounds:
          - calculations.tow_compatibility
          - validations[priority=10]
        distinguishing_aspect: |
          Metric: tow capacity vs GVWR ratio. TOW_DOLLY GVWR 3450 * 0.8 = 2760
          exactly: tow_capacity_lbs == 2760 PASSES (>= semantics), 2759 FAILS —
          tested through the confirm endpoint with two customers differing by
          one pound.
        test_recipe:
          setup:
            - "Locations A/B OPEN; dealer DA at A with two TOW_DOLLY units; ACTIVE dolly rate"
            - "Customer C1 vehicle: hitch CLASS_II, tow_capacity 2760, curb_weight 3000 (>= 3450*0.8 = 2760)"
            - "Customer C2 vehicle: identical except tow_capacity 2759"
            - "Both license-verified; each has a QUOTED dolly reservation"
          setup_api_calls:
            - call: "POST /rental-network/locations"
              payload: { location_code: "PHX-11", city: "Phoenix", geo_zone: "NORTH", storage_capacity: 10 }
              as: NetworkAdmin
              captures: { loc_a: $.data.id }
            - call: "POST /rental-network/locations"
              payload: { location_code: "TUS-11", city: "Tucson", geo_zone: "SOUTH", storage_capacity: 10 }
              as: NetworkAdmin
              captures: { loc_b: $.data.id }
            - call: "POST /rental-network/dealers"
              payload: { dealer_code: "D-A11", name: "Dealer A11", location_id: "${loc_a}" }
              as: NetworkAdmin
              captures: { dealer_a: $.data.id }
            - call: "POST /rental-network/equipment-units"
              payload: { unit_code: "U-1101", equipment_type: "TOW_DOLLY", dealer_id: "${dealer_a}" }
              as: NetworkAdmin
            - call: "POST /rental-network/equipment-units"
              payload: { unit_code: "U-1102", equipment_type: "TOW_DOLLY", dealer_id: "${dealer_a}" }
              as: NetworkAdmin
            - call: "POST /rental-network/lane-rates"
              payload: { origin_location_id: "${loc_a}", dest_location_id: "${loc_b}", equipment_type: "TOW_DOLLY", season: "OFF_PEAK", base_rate_cents: 2000, reposition_surcharge_cents: 0, commission_rate: 0.10 }
              as: PricingManager
              captures: { rate_1: $.data.id }
            - call: "POST /rental-network/lane-rates/${rate_1}/activate"
              payload: {}
              as: PricingManager
            - call: "POST /rental-network/vehicle-profiles"
              payload: { label: "Boundary Pass", make: "Toyota", model: "Camry", year: 2021, curb_weight_lbs: 3000, tow_capacity_lbs: 2760, hitch_class: "CLASS_II" }
              as: Customer
              captures: { veh_pass: $.data.id }
            - call: "POST /rental-network/vehicle-profiles"
              payload: { label: "Boundary Fail", make: "Toyota", model: "Camry", year: 2021, curb_weight_lbs: 3000, tow_capacity_lbs: 2759, hitch_class: "CLASS_II" }
              as: Customer
              captures: { veh_fail: $.data.id }
            - call: "POST /rental-network/customers"
              payload: { email: "cp@x.com", full_name: "Cust Pass", vehicle_profile_id: "${veh_pass}" }
              as: Customer
              captures: { cust_pass: $.data.id }
            - call: "POST /rental-network/customers"
              payload: { email: "cf@x.com", full_name: "Cust Fail", vehicle_profile_id: "${veh_fail}" }
              as: Customer
              captures: { cust_fail: $.data.id }
            - call: "POST /rental-network/customers/${cust_pass}/verify-license"
              payload: {}
              as: DealerAgent
              as_user_id: "${dealer_a}"
            - call: "POST /rental-network/customers/${cust_fail}/verify-license"
              payload: {}
              as: DealerAgent
              as_user_id: "${dealer_a}"
            - call: "POST /rental-network/reservations"
              payload: { customer_id: "${cust_pass}", origin_dealer_id: "${dealer_a}", dest_location_id: "${loc_b}", equipment_type: "TOW_DOLLY", rental_kind: "ONE_WAY", pickup_date: "2026-11-10T10:00:00Z", dropoff_date: "2026-11-11T10:00:00Z" }
              as: Customer
              as_user_id: "${cust_pass}"
              captures: { rsv_pass: $.data.id, rsv_pass_v: $.data.version }
            - call: "POST /rental-network/reservations"
              payload: { customer_id: "${cust_fail}", origin_dealer_id: "${dealer_a}", dest_location_id: "${loc_b}", equipment_type: "TOW_DOLLY", rental_kind: "ONE_WAY", pickup_date: "2026-11-10T10:00:00Z", dropoff_date: "2026-11-11T10:00:00Z" }
              as: Customer
              as_user_id: "${cust_fail}"
              captures: { rsv_fail: $.data.id, rsv_fail_v: $.data.version }
          trigger:
            - call: "POST /rental-network/reservations/${rsv_pass}/confirm"
              payload: { expected_reservation_version: "${rsv_pass_v}" }
              as: Customer
              as_user_id: "${cust_pass}"
            - call: "POST /rental-network/reservations/${rsv_fail}/confirm"
              payload: { expected_reservation_version: "${rsv_fail_v}" }
              as: Customer
              as_user_id: "${cust_fail}"
              captures: { err: $.data.error_id }
          assert:
            - "Reservation.${rsv_pass}.status == CONFIRMED (2760 >= 2760 boundary PASSES)"
            - "Reservation.${rsv_pass}.tow_check_result == PASS"
            - "Second trigger error_id == ERR_TOW_INCOMPATIBLE (2759 < 2760 FAILS)"
            - "Reservation.${rsv_fail}.status == QUOTED (unchanged)"

      - name: storage_zone_capacity_exactly_full_vs_one_over
        grounds:
          - validations[priority=19]
          - calculations.cross_sell_bundle
        distinguishing_aspect: |
          Metric: aggregate zone storage-month capacity (different metric from
          tow pounds; different endpoint: cross-sell-orders). Occupied +
          storage_months == capacity is ALLOWED (rejection is strictly
          greater); capacity + 1 is rejected — tested with two sequential
          orders straddling the exact boundary.
        test_recipe:
          setup:
            - "One NORTH location with storage_capacity 5; dealer DA at it"
            - "Existing order already occupies 3 storage-months in the zone"
          setup_api_calls:
            - call: "POST /rental-network/locations"
              payload: { location_code: "PHX-12", city: "Phoenix", geo_zone: "NORTH", storage_capacity: 5 }
              as: NetworkAdmin
              captures: { loc_a: $.data.id }
            - call: "POST /rental-network/dealers"
              payload: { dealer_code: "D-A12", name: "Dealer A12", location_id: "${loc_a}" }
              as: NetworkAdmin
              captures: { dealer_a: $.data.id }
            - call: "POST /rental-network/cross-sell-orders"
              payload: { dealer_id: "${dealer_a}", line_items: [ { sku: "TAPE", qty: 1 } ], storage_months: 3 }
              as: DealerAgent
              as_user_id: "${dealer_a}"
          trigger:
            - call: "POST /rental-network/cross-sell-orders"
              payload: { dealer_id: "${dealer_a}", line_items: [], storage_months: 2 }
              as: DealerAgent
              as_user_id: "${dealer_a}"
              captures: { order_ok: $.data.id }
            - call: "POST /rental-network/cross-sell-orders"
              payload: { dealer_id: "${dealer_a}", line_items: [], storage_months: 1 }
              as: DealerAgent
              as_user_id: "${dealer_a}"
              captures: { err: $.data.error_id }
          assert:
            - "First trigger succeeds (3 + 2 == 5 == capacity, boundary allowed): CrossSellOrder.${order_ok} created with storage_charge_cents == 17800 (2 * 8900 NORTH rate)"
            - "Second trigger error_id == ERR_STORAGE_CAPACITY_EXCEEDED (5 + 1 > 5)"
            - "HTTP 409 on the second trigger"

  # =====================================================================
  # Rule 7 — cross_entity_state_dependency (different entity pairs)
  # =====================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: confirm_blocked_when_origin_dealer_suspended
        grounds:
          - validations[priority=12]
          - state_machines.Reservation.QUOTED_to_CONFIRMED
          - entities.Dealer.fields.status
        distinguishing_aspect: |
          Pair Reservation -> Dealer: a QUOTED reservation's confirm
          transition is gated by the Dealer entity's status — quoting while
          ACTIVE succeeds, then suspending the dealer (suspension sweeps only
          CONFIRMED/REASSIGNED reservations, so the QUOTED one survives) makes
          the same confirm fail with ERR_DEALER_SUSPENDED even though nothing
          on the reservation itself changed.
        test_recipe:
          setup:
            - "Locations A/B OPEN; dealer DA at A with one AVAILABLE TRUCK_10FT; ACTIVE rate; verified customer"
            - "Reservation RSV created QUOTED at DA"
            - "DA suspended (QUOTED reservations are not swept, so RSV remains QUOTED at a SUSPENDED dealer)"
          setup_api_calls:
            - call: "POST /rental-network/locations"
              payload: { location_code: "PHX-13", city: "Phoenix", geo_zone: "NORTH", storage_capacity: 10 }
              as: NetworkAdmin
              captures: { loc_a: $.data.id }
            - call: "POST /rental-network/locations"
              payload: { location_code: "TUS-13", city: "Tucson", geo_zone: "SOUTH", storage_capacity: 10 }
              as: NetworkAdmin
              captures: { loc_b: $.data.id }
            - call: "POST /rental-network/dealers"
              payload: { dealer_code: "D-A13", name: "Dealer A13", location_id: "${loc_a}" }
              as: NetworkAdmin
              captures: { dealer_a: $.data.id }
