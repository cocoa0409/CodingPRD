  # ===========================================================================
  - section: calculations
    instances:
      - name: calc_position_exposure_variants
        claim_type: variant_divergence
        grounds: [calculations.position_exposure]
        excluded_because:
          difficulty_instance: position_exposure_self_audit_vs_vendor_list
          rationale: "Both exposure variants asserted with literal values in the named §1.8 instance."

      - name: calc_case_rollup_variants
        claim_type: variant_divergence
        grounds: [calculations.case_exposure_rollup]
        excluded_because:
          difficulty_instance: case_rollup_provisional_vs_worst_case
          rationale: "Provisional vs worst-case rollup asserted with literal values in the named §1.8 instance."

      - name: calc_gap_severity_tiers
        claim_type: correct_result
        grounds: [calculations.gap_and_severity]
        excluded_because:
          difficulty_instance: gap_severity_three_input_tiering
          rationale: "Tier branching (incl. mission_critical path) asserted in the named §1.8 instance."

      - name: calc_vendor_finding_rounding
        claim_type: precision
        grounds: [calculations.vendor_finding_line_pricing]
        excluded_because:
          difficulty_instance: vendor_finding_per_line_rounding_order
          rationale: "Pinned round-per-line-then-sum order proven by the one-cent delta in the named §1.8 instance."

      - name: non_production_excluded_unless_product_flag
        claim_type: input_set_filtering
        grounds: [calculations.deployed_quantity, entities.Product.fields.counts_non_production]
        distinguishing_aspect: "NON_PRODUCTION measurements contribute to deployed_quantity only when the product's counts_non_production flag is true; flipping the flag via PATCH and recomputing changes the position from compliant to over-deployed."
        test_recipe:
          setup:
            - "Product (counts_non_production=false) entitled 100; PRODUCTION dep 100 CONFIRMED and NON_PRODUCTION dep 50 CONFIRMED"
          setup_api_calls:
            - call: "POST /sam/vendors"
              payload: { name: "Vendor A", vendor_code: "VND-A", default_license_metric: "PER_USER" }
              as: SAMPlatformAdmin
              captures: { v_id: $.data.id }
            - call: "POST /sam/products"
              payload: { vendor_id: "${v_id}", name: "Prod", license_metric: "PER_USER", unit_list_price_cents: 5000, support_rate_pct: 0.2 }
              as: SAMPlatformAdmin
              captures: { p_id: $.data.id }
            - call: "POST /sam/entitlements"
              payload: { product_id: "${p_id}", purchase_order_number: "PO-1", quantity: 100, coverage_class: "PRODUCTION", effective_from: "2026-01-01T00:00:00Z", source: "MANUAL_IMPORT" }
              as: SAMManager
            - call: "POST /sam/deployments"
              payload: { product_id: "${p_id}", measured_quantity: 100, environment: "PRODUCTION", measurement_method: "SCAN", measured_on: "2026-07-15T00:00:00Z" }
              as: ITAnalyst
              captures: { d1: $.data.id }
            - call: "POST /sam/deployments/${d1}/confirm"
              payload: {}
              as: SAMManager
            - call: "POST /sam/deployments"
              payload: { product_id: "${p_id}", measured_quantity: 50, environment: "NON_PRODUCTION", measurement_method: "SCAN", measured_on: "2026-07-15T00:00:00Z" }
              as: ITAnalyst
              captures: { d2: $.data.id }
            - call: "POST /sam/deployments/${d2}/confirm"
              payload: {}
              as: SAMManager
            - call: "GET /sam/products/${p_id}/license-positions"
              as: SAMManager
              captures: { pos_id: "$.data[0].id", dep_before: "$.data[0].deployed_quantity" }
          trigger:
            - call: "PATCH /sam/products/${p_id}"
              payload: { counts_non_production: true }
              as: SAMPlatformAdmin
            - call: "POST /sam/license-positions/${pos_id}/recalculate"
              payload: {}
              as: SAMManager
              captures: { dep_after: $.data.deployed_quantity, gap_after: $.data.gap_quantity }
          assert:
            - "dep_before == 100 (NON_PRODUCTION 50 excluded while flag is false)"
            - "dep_after == 150 and gap_after == 50 (flag flip recomputes the input set)"

      - name: scheduled_entitlement_activates_on_clock_sweep
        claim_type: correct_result
        grounds: [calculations.entitled_quantity, state_machines.EntitlementRecord.SCHEDULED_to_ACTIVE]
        distinguishing_aspect: "A future-dated entitlement sits in SCHEDULED contributing 0 units; setting the clock to its effective_from flips it ACTIVE and the position picks up the quantity."
        test_recipe:
          setup: ["Product with one entitlement effective_from 2026-09-01 (status SCHEDULED at the 2026-08-01 default clock)"]
          setup_api_calls:
            - call: "POST /sam/vendors"
              payload: { name: "Vendor A", vendor_code: "VND-A", default_license_metric: "PER_INSTALL" }
              as: SAMPlatformAdmin
              captures: { v_id: $.data.id }
            - call: "POST /sam/products"
              payload: { vendor_id: "${v_id}", name: "Prod", license_metric: "PER_INSTALL", unit_list_price_cents: 10000, support_rate_pct: 0.22 }
              as: SAMPlatformAdmin
              captures: { p_id: $.data.id }
            - call: "POST /sam/entitlements"
              payload: { product_id: "${p_id}", purchase_order_number: "PO-FUT", quantity: 25, coverage_class: "PRODUCTION", effective_from: "2026-09-01T00:00:00Z", effective_to: "2027-08-31T00:00:00Z", source: "CONTRACT_EXTRACT" }
              as: SAMManager
              captures: { e_id: $.data.id, e_status: $.data.status }
            - call: "GET /sam/products/${p_id}/license-positions"
              as: SAMManager
              captures: { entitled_pre: "$.data[0].entitled_quantity" }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: SAMPlatformAdmin
            - call: "GET /sam/products/${p_id}/entitlements"
              as: SAMManager
              captures: { e_post: "$.data[0].status" }
            - call: "GET /sam/products/${p_id}/license-positions"
              as: SAMManager
              captures: { entitled_post: "$.data[0].entitled_quantity" }
          assert:
            - "e_status == SCHEDULED and entitled_pre == 0"
            - "e_post == ACTIVE (clock reached effective_from; inclusive boundary)"
            - "entitled_post == 25"

      - name: expiry_alert_fires_at_exactly_30_days
        claim_type: constants_applied
        grounds: [calculations.alert_evaluation, entities.MonitoringAlert]
        distinguishing_aspect: "ENTITLEMENT_EXPIRING uses an inclusive <= 30-day threshold: an entitlement expiring in exactly 30 days fires the alert (triggered_value 30), while one expiring in 31 days on a second product fires nothing."
        test_recipe:
          setup:
            - "P1 with ACTIVE entitlement effective_to 2026-08-31 (exactly 30 days out at the 2026-08-01 clock)"
            - "P2 with ACTIVE entitlement effective_to 2026-09-01 (31 days out)"
          setup_api_calls:
            - call: "POST /sam/vendors"
              payload: { name: "Vendor A", vendor_code: "VND-A", default_license_metric: "PER_INSTALL" }
              as: SAMPlatformAdmin
              captures: { v_id: $.data.id }
            - call: "POST /sam/products"
              payload: { vendor_id: "${v_id}", name: "Prod 1", license_metric: "PER_INSTALL", unit_list_price_cents: 10000, support_rate_pct: 0.22 }
              as: SAMPlatformAdmin
              captures: { p1: $.data.id }
            - call: "POST /sam/products"
              payload: { vendor_id: "${v_id}", name: "Prod 2", license_metric: "PER_INSTALL", unit_list_price_cents: 10000, support_rate_pct: 0.22 }
              as: SAMPlatformAdmin
              captures: { p2: $.data.id }
            - call: "POST /sam/entitlements"
              payload: { product_id: "${p1}", purchase_order_number: "PO-1", quantity: 10, coverage_class: "PRODUCTION", effective_from: "2026-01-01T00:00:00Z", effective_to: "2026-08-31T00:00:00Z", source: "MANUAL_IMPORT" }
              as: SAMManager
            - call: "POST /sam/entitlements"
              payload: { product_id: "${p2}", purchase_order_number: "PO-2", quantity: 10, coverage_class: "PRODUCTION", effective_from: "2026-01-01T00:00:00Z", effective_to: "2026-09-01T00:00:00Z", source: "MANUAL_IMPORT" }
              as: SAMManager
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SAMPlatformAdmin
            - call: "GET /sam/products/${p1}/monitoring-alerts"
              as: SAMManager
              captures: { a_type: "$.data[0].alert_type", a_val: "$.data[0].triggered_value", a_thr: "$.data[0].threshold_value" }
            - call: "GET /sam/products/${p2}/monitoring-alerts"
              as: SAMManager
          assert:
            - "a_type == ENTITLEMENT_EXPIRING and a_val == 30 and a_thr == 30 (exactly 30 days triggers; inclusive)"
            - "no MonitoringAlert exists for ${p2} (31 days out does not trigger)"

      - name: over_deployment_alert_not_raised_at_zero_gap
        claim_type: correct_result
        grounds: [calculations.alert_evaluation]
        distinguishing_aspect: "The OVER_DEPLOYMENT threshold is strictly greater than zero: deployed exactly equal to entitled (gap == 0) creates no alert row."
        test_recipe:
          setup: ["Product entitled 100; deployment of exactly 100 CONFIRMED"]
          setup_api_calls:
