  # ===========================================================================
  # SECTION 6 — Errors (§1.6)
  # Coverage cross-check of all 74 catalog codes. Codes already triggered by a
  # §1.8 instance or by an earlier §1.9 section are not repeated here; the
  # instances below are batteries that close the remaining gaps, one trigger
  # call per untriggered code, plus one instance documenting the single
  # API-unreachable guard.
  # ===========================================================================
  - section: errors
    instances:

      - name: every_resource_family_reports_its_own_not_found_code
        claim_type: error_triggerable
        grounds:
          - errors.ERR_CONFERENCE_NOT_FOUND
          - errors.ERR_CATEGORY_NOT_FOUND
          - errors.ERR_AUTHOR_NOT_FOUND
          - errors.ERR_MEMBER_NOT_FOUND
          - errors.ERR_DECLARATION_NOT_FOUND
          - errors.ERR_REVIEW_NOT_FOUND
          - errors.ERR_DISCREPANCY_CASE_NOT_FOUND
          - errors.ERR_SESSION_NOT_FOUND
          - errors.ERR_SLOT_NOT_FOUND
          - errors.ERR_ACCREDITATION_NOT_FOUND
          - errors.ERR_DISCLOSURE_NOT_FOUND
          - errors.ERR_CHANGE_REQUEST_NOT_FOUND
        distinguishing_aspect: |
          Existence failures are family-specific, not a generic 404: the same
          syntactically valid but unknown UUID produces a different error_id per
          resource family, on both path parameters (p4) and body foreign keys
          (p5). The body-FK cases also prove that p5 runs before the schema-level
          business rules — an unknown conference_id on POST /categories is
          ERR_CONFERENCE_NOT_FOUND rather than ERR_VALIDATION.
        test_recipe:
          setup:
            - "Clock 2026-01-05T00:00:00Z. The store is empty apart from author Ada, who exists so that only the intended id is unknown."
            - "MISSING = 00000000-0000-4000-8000-000000000000, a well-formed UUID that matches no row in any table."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-01-05T00:00:00Z" }
              as: ConferenceAdmin
            - call: "POST /authors"
              payload: { full_name: "Ada Rivera", email: "ada@lab.example", affiliation: "Northline University" }
              as: ConferenceAdmin
              captures: { au_ada_id: "$.data.id" }
          trigger:
            - call: "GET /conferences/00000000-0000-4000-8000-000000000000"
              as: ConferenceAdmin
              captures: { e_conf: "$.data.error_id" }
            - call: "GET /categories/00000000-0000-4000-8000-000000000000"
              as: ConferenceAdmin
              captures: { e_cat: "$.data.error_id" }
            - call: "GET /authors/00000000-0000-4000-8000-000000000000"
              as: ConferenceAdmin
              captures: { e_author: "$.data.error_id" }
            - call: "GET /committee-members/00000000-0000-4000-8000-000000000000"
              as: ConferenceAdmin
              captures: { e_member: "$.data.error_id" }
            - call: "GET /conflict-declarations/00000000-0000-4000-8000-000000000000"
              as: ConferenceAdmin
              captures: { e_decl: "$.data.error_id" }
            - call: "GET /reviews/00000000-0000-4000-8000-000000000000"
              as: ConferenceAdmin
              captures: { e_review: "$.data.error_id" }
            - call: "GET /discrepancy-cases/00000000-0000-4000-8000-000000000000"
              as: ConferenceAdmin
              captures: { e_case: "$.data.error_id" }
            - call: "GET /sessions/00000000-0000-4000-8000-000000000000"
              as: ConferenceAdmin
              captures: { e_session: "$.data.error_id" }
            - call: "GET /session-slots/00000000-0000-4000-8000-000000000000"
              as: ConferenceAdmin
              captures: { e_slot: "$.data.error_id" }
            - call: "GET /accreditations/00000000-0000-4000-8000-000000000000"
              as: ConferenceAdmin
              captures: { e_acc: "$.data.error_id" }
