  # ---------------------------------------------------------------------------
  # Rule 9 — compensating_invariant on DIFFERENT conserved quantities
  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: indemnity_payment_void_restores_claim_state_and_amount_unchanged
        grounds:
          - state_machines.IndemnityPayment.ISSUED_to_VOID
          - state_machines.Claim.APPROVED_to_PAID
        distinguishing_aspect: |
          Conserved quantity = Claim's outstanding-payment pipeline: issuing
          then voiding leaves Claim.final_indemnity_cents, Claim.claim_state
          (back to APPROVED), and Policy.premium_reserve_cents unchanged from
          the pre-issue values. Conserved quantity: claim-side financial state.
        test_recipe:
          setup:
            - "Carrier; grower; rate; BOUND+ACTIVE+PAID policy; claim pushed all the way to APPROVED with final_indemnity_cents=5000"
            - "Capture pre-issue Policy.premium_reserve_cents and Claim.claim_state=APPROVED"
          setup_api_calls:
            - call: "POST /carriers"
              payload: { carrier_code: "CHL-Q", legal_name: "Carrier Q", reinsurance_treaty_attachment_cents: 100000000 }
              as: PlatformAdmin
              captures: { carrier_id: $.data.id }
            - call: "POST /carriers/${carrier_id}/growers"
              payload: { full_name: "Grower Q", tax_id_last4: "1515", email: "q@x.com", county_code: "06001", state_code: "CA" }
              as: Underwriter
              captures: { grower_id: $.data.id }
