    roles: [PublisherAdmin, ReleaseManager, ComplianceOfficer, PlatformReviewer, PlatformAppealBoard, PlatformPolicyAdmin, Auditor]
    input: []
    output: Submission
    success_code: 200
    side_effects: []

  - method: PUT
    path: /submissions/{id}/age-rating
    description: "Record the age rating questionnaire and the attested rating."
    roles: [ComplianceOfficer, ReleaseManager]
    input: [age_rating_answers, attested_age_rating]
    output: Submission
    success_code: 200
    side_effects:
      - "Recomputes derived_age_rating and age_rating_driving_dimension per calculations.derived_age_rating"
      - "Content mutation: PRE_REVIEW_PASSED -> DRAFT and the attestation fields are voided"

  - method: PUT
    path: /submissions/{id}/privacy-declaration
    description: "Record the privacy label (declared collection tuples) and the tracking prompt assertion."
    roles: [ComplianceOfficer]
    input: [declared_privacy_items, tracking_consent_prompt_present]
    output: Submission
    success_code: 200
    side_effects:
      - "Recomputes both disclosure_accuracy_score variants against the current BehaviorFinding rows"
      - "Content mutation: PRE_REVIEW_PASSED -> DRAFT and the attestation fields are voided"

  - method: POST
    path: /submissions/{id}/pre-review-check
    description: "Run the pre-submission self-review in REPORT MODE — always 200, never a business error."
    roles: [ComplianceOfficer]
    input: []
    output: Submission
    success_code: 200
    side_effects:
      - "Sets pre_review_checked_at = clock_now BEFORE scoring, then recomputes disclosure_accuracy_score_provisional"
      - "Sets pre_review_passed and the ordered pre_review_blocking_reasons array; DRAFT -> PRE_REVIEW_PASSED only when the array is empty"
      - "The priority 55/60 content rules run here as report-mode codes instead of 409 errors"

  - method: POST
    path: /submissions/{id}/queue
    description: "Submit the build for platform review; selects a review capacity window and freezes the SLA baseline."
    roles: [ReleaseManager]
    input: ["expedite_request_id?"]
    output: Submission
    success_code: 200
    side_effects:
      - "PRE_REVIEW_PASSED -> WAITING_FOR_REVIEW; every validations priority 40..70 gate is enforced here as a hard error"
      - "Selects review_window_id per calculations.review_capacity_allocation; that window's slots_reserved += 1, slots_available -= 1"
      - "Sets queued_at = clock_now and freezes provisional_deadline_at = queued_at + BASE_SLA_HOURS"
      - "Computes priority_score, priority_band and effective_review_deadline_at in the pinned forward order"
      - "With expedite_request_id: that GRANTED request -> CONSUMED and submission_channel = EXPEDITED"

  - method: POST
    path: /submissions/{id}/withdraw
    description: "Publisher withdrawal; the compensating action for the queue reservation."
    roles: [ReleaseManager]
    input: ["reason_code?"]
    output: Submission
    success_code: 200
    side_effects:
      - "DRAFT | PRE_REVIEW_PASSED | WAITING_FOR_REVIEW -> DEVELOPER_WITHDRAWN (never from IN_REVIEW)"
      - "review_window_id = null: slots_reserved -= 1 and slots_available += 1, restoring the pre-queue integer exactly"
      - "Any ExpediteRequest of this submission in REQUESTED | GRANTED | CONSUMED -> REFUNDED, restoring expedite_credits_remaining"

  - method: POST
    path: /submissions/{id}/claim
    description: "Reviewer claims a queued build; establishes the segregation-of-duties subject."
    roles: [PlatformReviewer]
    input: []
    output: Submission
    success_code: 200
    side_effects:
      - "WAITING_FOR_REVIEW -> IN_REVIEW; reviewed_by_user_id = X-User-ID"
      - "Recomputes disclosure_accuracy_score_final (REVIEW_FINAL scope: late-arriving and DISPUTED findings now count)"
      - "Slot accounting unchanged (the build stays reserved)"

  - method: POST
    path: /submissions/{id}/decision
    description: "Review outcome: approve, reject, or reject for metadata only (divergent cascades)."
    roles: [PlatformReviewer]
    input: [outcome, "rejection_reasons?"]
    output: Submission
    success_code: 200
    side_effects:
      - "outcome APPROVE -> APPROVED: other APPROVED builds of the app -> SUPERSEDED (their SCHEDULED plans -> CANCELLED)"
      - "outcome REJECT -> REJECTED: creates the RejectionReason rows, then the four-hop cascade (mappings PASSED -> FAILED, index drop, posture RESTRICTED, PHASE_ACTIVE rollouts PAUSED, distribution PAUSED)"
      - "outcome METADATA_REJECT -> METADATA_REJECTED: creates MINOR-only reasons and touches NO mapping, index, posture or rollout"
      - "Every branch: slots_reserved -= 1, slots_consumed += 1 (slots_available unchanged) and both standing variants recomputed"

  - method: POST
    path: /submissions/{id}/return-to-draft
    description: "Return a rejected or signing-blocked build to DRAFT for a fix, optionally re-signing it."
    roles: [ReleaseManager]
    input: ["signing_credential_id?"]
    output: Submission
    success_code: 200
    side_effects:
      - "REJECTED | METADATA_REJECTED | BLOCKED_INVALID_SIGNING -> DRAFT; resubmission_count += 1"
      - "review_window_id = null: slots_consumed -= 1 and slots_available += 1"
      - "Voids the attestation (pre_review_passed = false, pre_review_checked_at = null, attested_by_user_id = null)"
      - "Exempt from the posture gate at validations priority 40"

  - method: GET
    path: /submissions/{id}/metadata-locales
    description: "Store-page metadata of one build (reverse-reachability channel for MetadataLocale)."
    roles: [PublisherAdmin, ReleaseManager, ComplianceOfficer, PlatformReviewer, PlatformPolicyAdmin, Auditor]
    input: ["locale?", "is_primary?", "limit?", "offset?"]
    output: MetadataLocale[]
    success_code: 200
    side_effects: []

