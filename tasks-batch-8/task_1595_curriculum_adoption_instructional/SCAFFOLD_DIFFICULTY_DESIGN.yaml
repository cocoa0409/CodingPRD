          setup:
            - "Material MAT ADOPTED; cycle in DISTRIBUTING; InventoryLot on_hand 10 (PO fully received)"
            - "DO1 quantity 4 APPROVED (allocated 4, available 6); DO2 quantity 2 REQUESTED"
            - "Challenge CC targeting MAT at COMMITTEE_REVIEW with votes REMOVE/REMOVE/UPHOLD cast"
