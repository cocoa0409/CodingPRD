# =============================================================================
# RV Sales & Service — benchmark seed tables (Expert tier)
# Flat topology: Dealership is the tenant root; every other entity is a
# top-level peer collection carrying a dealership_id FK. api_prefix is empty
# because the surface spans several top-level resource paths.
# =============================================================================

scenario: |
  339. RV Sales & Service: unit inventory & consignment, sales & financing,
  trade-in/payoff, service/repair bay & parts, warranty & extended plan, PDI &
  delivery walkthrough, storage/winterization, recall

domain_name: rv-sales-service
api_prefix: ""

complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: quota_allocation        # finite service bays + parts stock
  complexity_layers:
    - dual_variant_calculation                 # trade equity (gross vs net-of-recon) & service total (warranty-covered vs owed)
    - cascading_side_effects                   # deal cancel -> release unit; SO cancel -> release parts + appointments
    - optimistic_concurrency                    # CREATE deal / storage on a Unit via Unit.version OCC
    - resource_temporal_overlap                 # service-bay appointments + storage-slot occupancy
    - derived_field_reconciliation              # Unit.status / PartItem.qty_available / WarrantyPlan.consumed

  entity_topology: flat
  # All resources are top-level peer collections joined by FK fields; no nested
  # URL ownership. Tenancy is carried by the dealership_id FK on every entity.

  state_machine_shape: parallel
  # Deal carries two independent dimensions: sale_status x finance_status.
  # ServiceOrder is cyclic (IN_PROGRESS <-> AWAITING_PARTS).
  # Unit is compound/posture (availability derived from holds + consignment).

  relationship_patterns:
    - one_to_many        # Dealership -> Units, Customers, Bays, etc.
    - many_to_many       # ServiceOrder <-> PartItem via PartReservation
    - cross_aggregate    # Deal references Unit + Customer + (optional) trade Unit
    - self_referential   # Unit.trade_in_origin_unit_id references another Unit

  role_model: peer_roles
  # SalesAgent owns the sales surface; ServiceAdvisor owns service/parts/bay/
  # storage/PDI; DealerManager is the override/approval authority; Customer is
  # entity-backed for self-service reads.

  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — emitted verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Dealership
    parent: null
    common_fields: true   # id, created_at, updated_at, version
    fields:
      - { name: name, type: string, source: input, description: "Dealership name" }
      - { name: state_code, type: string, source: input, description: "Two-letter US state code; governs doc_fee cap and tax presentation" }
      - { name: doc_fee_cents, type: integer, source: input, description: "Flat documentation fee added to every sale, in cents; must be 0..DOC_FEE_CAP_CENTS (ERR_DOC_FEE_OVER_CAP)" }
      - { name: sales_tax_rate_bps, type: integer, source: input, description: "Sales tax rate in basis points (e.g. 725 = 7.25%) applied to the taxable deal base" }
      - { name: current_utc, type: datetime, source: system, default: "1970-01-01T00:00:00.000Z", description: "Deterministic clock for this dealership; advanced only via POST /_clock/set_current_utc" }

  - name: Customer
    parent: null
    common_fields: true
    fields:
      - { name: dealership_id, type: string, source: input, description: "FK -> Dealership.id" }
      - { name: full_name, type: string, source: input, description: "Customer legal name" }
      - { name: email, type: string, source: input, description: "Contact email; unique per dealership (ERR_DUPLICATE_EMAIL)" }
      - { name: credit_tier, type: enum, source: input, default: STANDARD, description: "PRIME | STANDARD | SUBPRIME; gates finance APR band and max LTV" }

  - name: Unit
    parent: null
    common_fields: true
    fields:
      - { name: dealership_id, type: string, source: input, description: "FK -> Dealership.id" }
      - { name: vin, type: string, source: input, description: "Vehicle identification number; unique per dealership (ERR_DUPLICATE_VIN)" }
      - { name: model_year, type: integer, source: input, description: "Model year (1990..2100)" }
      - { name: class_type, type: enum, source: input, description: "CLASS_A | CLASS_B | CLASS_C | TRAVEL_TRAILER | FIFTH_WHEEL" }
      - { name: acquisition, type: enum, source: input, default: STOCK, description: "STOCK (dealer owns) | CONSIGNMENT (third party owns) | TRADE_IN (taken on a deal)" }
      - { name: consignor_customer_id, type: string, source: input, required: false, description: "FK -> Customer.id; required when acquisition==CONSIGNMENT, forbidden otherwise (ERR_CONSIGNOR_REQUIRED / ERR_CONSIGNOR_NOT_ALLOWED)" }
      - { name: trade_in_origin_unit_id, type: string, source: system, required: false, description: "FK -> Unit.id; set only when acquisition==TRADE_IN, points at the sold Unit whose deal produced this trade (self-referential)" }
      - { name: list_price_cents, type: integer, source: input, description: "Sticker price in cents (>= 0)" }
      - { name: consignment_floor_cents, type: integer, source: input, required: false, description: "Minimum net the consignor must receive; required when acquisition==CONSIGNMENT" }
      - { name: consignment_fee_bps, type: integer, source: input, required: false, description: "Dealer commission on a consignment sale, basis points of sale price; required when acquisition==CONSIGNMENT" }
      - { name: open_recall_count, type: integer, source: computed, default: 0, description: "Count of RecallRemedy rows on this unit whose status is not CLEARED for an OPEN RecallCampaign" }
      - { name: status, type: enum, source: computed, description: "AVAILABLE -> HELD -> SOLD; or CONSIGNMENT_RETURNED; derived from active Deal hold; see Unit state machine" }
      - { name: active_hold_deal_id, type: string, source: computed, required: false, description: "FK -> Deal.id; the Deal currently holding this unit, else null" }

  - name: Deal
    parent: null
    common_fields: true
    fields:
      - { name: dealership_id, type: string, source: input, description: "FK -> Dealership.id" }
      - { name: unit_id, type: string, source: input, description: "FK -> Unit.id; the unit being sold" }
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; the buyer" }
      - { name: sales_agent_user_id, type: string, source: system, description: "X-User-ID of the SalesAgent who created the deal" }
      - { name: sale_price_cents, type: integer, source: input, description: "Negotiated sale price in cents (>= 0)" }
      - { name: trade_unit_id, type: string, source: computed, required: false, description: "FK -> Unit.id; the TRADE_IN unit appraised on this deal, else null" }
      - { name: trade_allowance_cents, type: integer, source: computed, default: 0, description: "Gross trade-in allowance credited to the buyer in cents; set by appraise-trade" }
      - { name: trade_payoff_cents, type: integer, source: computed, default: 0, description: "Lien payoff the dealer must remit on the trade in cents; set by appraise-trade" }
      - { name: trade_recon_cost_cents, type: integer, source: computed, default: 0, description: "Estimated reconditioning cost on the trade in cents; set by appraise-trade" }
      - { name: net_trade_equity_cents, type: integer, source: computed, default: 0, description: "Applied trade equity (buyer credit); see calculation net_trade_equity (applied vs dealer-book variants)" }
      - { name: dealer_book_equity_cents, type: integer, source: computed, default: 0, description: "Dealer-book trade equity = allowance - payoff - recon; surfaced on equity-summary" }
      - { name: down_payment_cents, type: integer, source: input, default: 0, description: "Cash down from buyer in cents (>= 0)" }
      - { name: doc_fee_cents, type: integer, source: computed, default: 0, description: "Snapshot of Dealership.doc_fee_cents at quote time" }
      - { name: tax_cents, type: integer, source: computed, default: 0, description: "Sales tax computed on the taxable base; see calculation deal_amount_due" }
      - { name: amount_financed_cents, type: integer, source: computed, default: 0, description: "Principal sent to finance; see calculation deal_amount_due" }
      - { name: apr_bps, type: integer, source: computed, required: false, description: "Approved APR in basis points; set when finance_status reaches APPROVED, cleared on resubmit" }
      - { name: term_months, type: integer, source: input, required: false, description: "Requested finance term in months (12..240); required when finance is requested" }
      - { name: monthly_payment_cents, type: integer, source: computed, required: false, description: "Amortized monthly payment; see calculation monthly_payment" }
      - { name: sale_status, type: enum, source: system, description: "DRAFT -> QUOTED -> PDI_PENDING -> WALKTHROUGH -> DELIVERED; or CANCELLED (parallel dimension #1)" }
      - { name: finance_status, type: enum, source: system, default: NONE, description: "NONE | CASH | REQUESTED -> APPROVED | DECLINED (parallel dimension #2)" }
      - { name: pdi_passed, type: boolean, source: computed, default: false, description: "True once a passing PdiInspection exists for this deal" }

  - name: PdiInspection
    parent: null
    common_fields: true
    fields:
      - { name: dealership_id, type: string, source: input, description: "FK -> Dealership.id" }
      - { name: deal_id, type: string, source: input, description: "FK -> Deal.id" }
      - { name: unit_id, type: string, source: system, description: "FK -> Unit.id; copied from the deal" }
      - { name: technician_user_id, type: string, source: system, description: "X-User-ID of the ServiceAdvisor recording the inspection" }
      - { name: defects_found, type: integer, source: input, description: "Number of defects found (>= 0)" }
      - { name: result, type: enum, source: computed, description: "PASS | FAIL; PASS iff defects_found == 0 AND the deal's unit open_recall_count == 0 at inspection time" }

  - name: ServiceBay
    parent: null
    common_fields: true
    fields:
      - { name: dealership_id, type: string, source: input, description: "FK -> Dealership.id" }
      - { name: name, type: string, source: input, description: "Bay label" }
      - { name: bay_kind, type: enum, source: input, description: "REPAIR | WASH_PDI" }
      - { name: cleanup_buffer_minutes, type: integer, source: input, default: 0, description: "Mandatory idle buffer appended after each appointment before the bay is free again (>= 0)" }

  - name: ServiceOrder
    parent: null
    common_fields: true
    fields:
      - { name: dealership_id, type: string, source: input, description: "FK -> Dealership.id" }
      - { name: unit_id, type: string, source: input, description: "FK -> Unit.id; the unit being serviced" }
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; the payer / owner" }
      - { name: advisor_user_id, type: string, source: system, description: "X-User-ID of the ServiceAdvisor who opened the order" }
      - { name: is_warranty, type: boolean, source: input, default: false, description: "True when work is billed to a WarrantyPlan instead of the customer" }
      - { name: warranty_plan_id, type: string, source: input, required: false, description: "FK -> WarrantyPlan.id; required when is_warranty==true (ERR_WARRANTY_UNIT_MISMATCH if plan does not cover unit)" }
      - { name: labor_hours, type: number, source: input, description: "Estimated labor hours (> 0)" }
      - { name: labor_rate_cents, type: integer, source: input, description: "Labor rate per hour in cents (>= 0)" }
      - { name: parts_subtotal_cents, type: integer, source: computed, default: 0, description: "Sum over FULFILLED PartReservation of quantity*unit_price_cents; finalized at completion" }
      - { name: total_cents, type: integer, source: computed, default: 0, description: "Customer-owed total after warranty coverage; see calculation service_order_total" }
      - { name: covered_cents, type: integer, source: computed, default: 0, description: "Portion paid by the warranty plan; see calculation service_order_total" }
      - { name: status, type: enum, source: system, description: "OPEN -> IN_PROGRESS <-> AWAITING_PARTS -> COMPLETED; or CANCELLED (cyclic)" }

  - name: PartItem
    parent: null
    common_fields: true
    fields:
      - { name: dealership_id, type: string, source: input, description: "FK -> Dealership.id" }
      - { name: sku, type: string, source: input, description: "Part SKU; unique per dealership (ERR_DUPLICATE_SKU)" }
      - { name: name, type: string, source: input, description: "Part description" }
      - { name: unit_price_cents, type: integer, source: input, description: "Per-unit price in cents (>= 0)" }
      - { name: qty_on_hand, type: integer, source: input, description: "Physical stock count (>= 0)" }
      - { name: qty_reserved, type: integer, source: computed, default: 0, description: "Sum of quantity over RESERVED PartReservation rows for this part" }
      - { name: qty_available, type: integer, source: computed, description: "= qty_on_hand - qty_reserved; never negative" }

  - name: PartReservation
    parent: null
    common_fields: true
    fields:
      - { name: dealership_id, type: string, source: system, description: "FK -> Dealership.id" }
      - { name: service_order_id, type: string, source: input, description: "FK -> ServiceOrder.id" }
      - { name: part_item_id, type: string, source: input, description: "FK -> PartItem.id" }
      - { name: quantity, type: integer, source: input, description: "Units reserved (>= 1)" }
      - { name: unit_price_cents, type: integer, source: computed, description: "Snapshot of PartItem.unit_price_cents at reservation time" }
      - { name: status, type: enum, source: system, description: "RESERVED -> FULFILLED | RELEASED" }

  - name: WarrantyPlan
    parent: null
    common_fields: true
    fields:
      - { name: dealership_id, type: string, source: input, description: "FK -> Dealership.id" }
      - { name: unit_id, type: string, source: input, description: "FK -> Unit.id; the covered unit" }
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; the plan holder" }
      - { name: plan_kind, type: enum, source: input, description: "FACTORY | EXTENDED" }
      - { name: coverage_cap_cents, type: integer, source: input, description: "Lifetime claim cap in cents (>= 0)" }
      - { name: deductible_cents, type: integer, source: input, default: 0, description: "Per-claim deductible the customer pays before coverage (>= 0)" }
      - { name: consumed_cents, type: integer, source: computed, default: 0, description: "Sum of covered_cents across COMPLETED warranty ServiceOrders billed to this plan" }
      - { name: status, type: enum, source: system, description: "ACTIVE -> EXHAUSTED (auto when consumed_cents >= coverage_cap_cents) | CANCELLED" }

  - name: Appointment
    parent: null
    common_fields: true
    fields:
      - { name: dealership_id, type: string, source: input, description: "FK -> Dealership.id" }
      - { name: service_bay_id, type: string, source: input, description: "FK -> ServiceBay.id; the bay reserved" }
      - { name: service_order_id, type: string, source: input, required: false, description: "FK -> ServiceOrder.id; set for REPAIR appointments" }
      - { name: deal_id, type: string, source: input, required: false, description: "FK -> Deal.id; set for PDI appointments" }
      - { name: appt_kind, type: enum, source: input, description: "REPAIR (needs REPAIR bay + service_order_id) | PDI (needs WASH_PDI bay + deal_id)" }
      - { name: start_utc, type: datetime, source: input, description: "Appointment start (inclusive)" }
      - { name: end_utc, type: datetime, source: input, description: "Appointment end (exclusive); must be > start_utc" }
      - { name: status, type: enum, source: system, description: "SCHEDULED -> CHECKED_IN -> CLOSED | CANCELLED" }

  - name: StorageSlot
    parent: null
    common_fields: true
    fields:
      - { name: dealership_id, type: string, source: input, description: "FK -> Dealership.id" }
      - { name: unit_id, type: string, source: input, description: "FK -> Unit.id; the unit being stored" }
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; the storage client" }
      - { name: winterized, type: boolean, source: input, default: false, description: "Whether the unit is winterized for this storage term" }
      - { name: daily_rate_cents, type: integer, source: input, description: "Storage day rate in cents (>= 0)" }
      - { name: start_utc, type: datetime, source: input, description: "Storage term start (inclusive)" }
      - { name: end_utc, type: datetime, source: input, description: "Storage term end (exclusive); must be > start_utc" }
      - { name: billed_cents, type: integer, source: computed, required: false, description: "Total storage charge computed at release; see calculation storage_charge" }
      - { name: status, type: enum, source: system, description: "BOOKED -> ACTIVE -> RELEASED | CANCELLED" }

  - name: RecallCampaign
    parent: null
    common_fields: true
    fields:
      - { name: dealership_id, type: string, source: input, description: "FK -> Dealership.id" }
      - { name: campaign_code, type: string, source: input, description: "Manufacturer recall code; unique per dealership (ERR_DUPLICATE_CAMPAIGN)" }
      - { name: target_class_type, type: enum, source: input, description: "CLASS_A | CLASS_B | CLASS_C | TRAVEL_TRAILER | FIFTH_WHEEL; units of this class are in scope" }
      - { name: target_model_year, type: integer, source: input, description: "Model year in scope" }
      - { name: severity, type: enum, source: input, description: "STOP_SALE (blocks delivery) | ADVISORY (does not block)" }
      - { name: status, type: enum, source: system, description: "OPEN -> CLOSED" }

  - name: RecallRemedy
    parent: null
    common_fields: true
    fields:
      - { name: dealership_id, type: string, source: system, description: "FK -> Dealership.id" }
      - { name: recall_campaign_id, type: string, source: system, description: "FK -> RecallCampaign.id" }
      - { name: unit_id, type: string, source: system, description: "FK -> Unit.id; the unit remediated" }
      - { name: status, type: enum, source: system, description: "PENDING -> CLEARED; created PENDING on campaign open, cleared by remediation" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  # ---- Unit: compound/posture availability (cross-entity guarded) ----
  - entity: Unit
    initial_state: AVAILABLE
    terminal_states: [SOLD, CONSIGNMENT_RETURNED]
    transitions:
      - from: AVAILABLE
        to: HELD
        trigger: "POST /deals (deal created on this unit)"
        actor: SalesAgent
        preconditions:
          - "Unit.status == AVAILABLE (ERR_UNIT_NOT_AVAILABLE)"
          - "expected_unit_version == Unit.version (ERR_STALE_UNIT_VERSION)"
        side_effects:
          - "Unit.status = HELD"
          - "Unit.active_hold_deal_id = new Deal.id"
          - "Unit.version += 1"

      - from: HELD
        to: AVAILABLE
        trigger: "POST /deals/{dealId}/cancel (deal cancelled before delivery)"
        actor: SalesAgent | DealerManager
        preconditions:
          - "Unit.active_hold_deal_id == cancelled Deal.id"
        side_effects:
          - "Unit.status = AVAILABLE"
          - "Unit.active_hold_deal_id = null"
          - "Unit.version += 1"

      - from: HELD
        to: SOLD
        trigger: "POST /deals/{dealId}/deliver (deal delivered)"
        actor: SalesAgent | DealerManager
        preconditions:
          - "Unit.active_hold_deal_id == delivered Deal.id"
        side_effects:
          - "Unit.status = SOLD"
          - "Unit.version += 1"
          - "If acquisition==CONSIGNMENT: consignor_proceeds recorded (see calc)"

      - from: AVAILABLE
        to: CONSIGNMENT_RETURNED
        trigger: "POST /units/{unitId}/return-consignment"
        actor: ServiceAdvisor | DealerManager
        preconditions:
          - "Unit.acquisition == CONSIGNMENT (ERR_NOT_CONSIGNMENT)"
          - "Unit.status == AVAILABLE (ERR_UNIT_NOT_AVAILABLE)"
        side_effects:
          - "Unit.status = CONSIGNMENT_RETURNED"
          - "Unit.version += 1"

  # ---- Deal: PARALLEL dimensions sale_status x finance_status ----
  - entity: Deal
    initial_state: DRAFT          # sale_status initial; finance_status initial NONE
    terminal_states: [DELIVERED, CANCELLED]
    transitions:
      # --- sale_status dimension ---
      - from: "sale_status=DRAFT"
        to: "sale_status=QUOTED"
        trigger: "POST /deals/{dealId}/quote"
        actor: SalesAgent
        preconditions:
          - "sale_status == DRAFT (ERR_DEAL_BAD_SALE_STATE)"
        side_effects:
          - "Recompute net_trade_equity, dealer_book_equity, tax_cents, amount_financed_cents, doc_fee snapshot (deal_amount_due)"
          - "finance_status NONE->CASH if term_months absent"
          - "Deal.version += 1"

      - from: "sale_status=QUOTED"
        to: "sale_status=PDI_PENDING"
        trigger: "POST /deals/{dealId}/start-pdi"
        actor: SalesAgent
        preconditions:
          - "sale_status == QUOTED (ERR_DEAL_BAD_SALE_STATE)"
          - "finance_status IN {CASH, APPROVED} (ERR_FINANCE_NOT_SETTLED)"
        side_effects:
          - "Deal.version += 1"

      - from: "sale_status=PDI_PENDING"
        to: "sale_status=WALKTHROUGH"
        trigger: "POST /pdi-inspections (PASS result)"
        actor: ServiceAdvisor
        preconditions:
          - "sale_status == PDI_PENDING (ERR_DEAL_BAD_SALE_STATE)"
          - "PdiInspection.result == PASS (FAIL keeps deal in PDI_PENDING)"
        side_effects:
          - "Deal.pdi_passed = true"
          - "Deal.version += 1"

      - from: "sale_status=WALKTHROUGH"
        to: "sale_status=DELIVERED"
        trigger: "POST /deals/{dealId}/deliver"
        actor: SalesAgent | DealerManager
        preconditions:
          - "sale_status == WALKTHROUGH (ERR_DEAL_BAD_SALE_STATE)"
          - "Deal.pdi_passed == true (ERR_PDI_NOT_PASSED)"
          - "finance_status IN {CASH, APPROVED} (ERR_FINANCE_NOT_SETTLED)"
          - "Unit not under an OPEN STOP_SALE RecallCampaign with a non-CLEARED RecallRemedy (ERR_STOP_SALE_RECALL_OPEN)"
        side_effects:
          - "Unit HELD->SOLD (cascade)"
          - "If trade_unit_id present: trade Unit stays AVAILABLE inventory (acquisition stays TRADE_IN)"
          - "If unit acquisition==CONSIGNMENT: consignor_proceeds recorded"
          - "Deal.version += 1"

      - from: "sale_status IN {DRAFT,QUOTED,PDI_PENDING,WALKTHROUGH}"
        to: "sale_status=CANCELLED"
        trigger: "POST /deals/{dealId}/cancel"
        actor: SalesAgent | DealerManager
        preconditions:
          - "sale_status NOT IN {DELIVERED, CANCELLED} (ERR_DEAL_TERMINAL)"
        side_effects:
          - "Unit hold released: Unit HELD->AVAILABLE (cascade), active_hold_deal_id cleared, Unit.version += 1"
          - "Deal.version += 1"
        note: "Cancel cascade: Deal.cancel -> Unit.release(HELD->AVAILABLE) -> Unit.version bump. Any appraised trade Unit is left AVAILABLE for re-appraisal."

      # --- finance_status dimension (independent of sale_status) ---
      - from: "finance_status=NONE"
        to: "finance_status=REQUESTED"
        trigger: "POST /deals/{dealId}/request-finance"
        actor: SalesAgent
        preconditions:
          - "term_months supplied (12..240) (ERR_INVALID_TERM)"
          - "sale_status IN {DRAFT,QUOTED} (ERR_DEAL_BAD_SALE_STATE)"
        side_effects:
          - "finance_status = REQUESTED"
          - "Deal.version += 1"

      - from: "finance_status=REQUESTED"
        to: "finance_status=APPROVED"
        trigger: "POST /deals/{dealId}/finance-decision (decision=APPROVE)"
        actor: DealerManager
        preconditions:
          - "finance_status == REQUESTED (ERR_FINANCE_BAD_STATE)"
          - "Computed LTV within customer credit_tier band (ERR_LTV_EXCEEDED)"
        side_effects:
          - "apr_bps set from credit_tier band"
          - "monthly_payment_cents computed (monthly_payment)"
          - "finance_status = APPROVED"
          - "Deal.version += 1"

      - from: "finance_status=REQUESTED"
        to: "finance_status=DECLINED"
        trigger: "POST /deals/{dealId}/finance-decision (decision=DECLINE)"
        actor: DealerManager
        preconditions:
          - "finance_status == REQUESTED (ERR_FINANCE_BAD_STATE)"
        side_effects:
          - "finance_status = DECLINED"
          - "Deal.version += 1"

      - from: "finance_status=DECLINED"
        to: "finance_status=REQUESTED"
        trigger: "POST /deals/{dealId}/request-finance (resubmit)"
        actor: SalesAgent
        preconditions:
          - "finance_status == DECLINED (ERR_FINANCE_BAD_STATE)"
          - "sale_status IN {DRAFT,QUOTED} (ERR_DEAL_BAD_SALE_STATE)"
        side_effects:
          - "finance_status = REQUESTED"
          - "apr_bps cleared"
          - "Deal.version += 1"
        note: "Finance revision loop DECLINED->REQUESTED->APPROVED is a cycle on the finance axis, independent of the sale pipeline."

  # ---- ServiceOrder: CYCLIC (IN_PROGRESS <-> AWAITING_PARTS) ----
  - entity: ServiceOrder
    initial_state: OPEN
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: OPEN
        to: IN_PROGRESS
        trigger: "POST /service-orders/{soId}/start"
        actor: ServiceAdvisor
        preconditions:
          - "status == OPEN (ERR_SO_BAD_STATE)"
        side_effects:
          - "ServiceOrder.version += 1"

      - from: IN_PROGRESS
        to: AWAITING_PARTS
        trigger: "POST /service-orders/{soId}/await-parts"
        actor: ServiceAdvisor
        preconditions:
          - "status == IN_PROGRESS (ERR_SO_BAD_STATE)"
        side_effects:
          - "ServiceOrder.version += 1"

      - from: AWAITING_PARTS
        to: IN_PROGRESS
        trigger: "POST /service-orders/{soId}/resume"
        actor: ServiceAdvisor
        preconditions:
          - "status == AWAITING_PARTS (ERR_SO_BAD_STATE)"
        side_effects:
          - "ServiceOrder.version += 1"
        note: "Cyclic loop: a single ServiceOrder may bounce IN_PROGRESS<->AWAITING_PARTS many times as parts arrive."

      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /service-orders/{soId}/complete"
        actor: ServiceAdvisor
        preconditions:
          - "status == IN_PROGRESS (ERR_SO_BAD_STATE)"
          - "If is_warranty: (gross_cents - deductible) must not exceed remaining plan cap headroom (ERR_WARRANTY_CAP_EXCEEDED)"
        side_effects:
          - "Recompute parts_subtotal_cents, covered_cents, total_cents (service_order_total)"
          - "All RESERVED PartReservation -> FULFILLED; each part qty_on_hand -= quantity; qty_reserved -= quantity (cascade)"
          - "If is_warranty: WarrantyPlan.consumed_cents += covered_cents; if consumed >= cap -> WarrantyPlan EXHAUSTED (cascade)"
          - "If remediates_campaign_id supplied: matching RecallRemedy PENDING->CLEARED; unit.open_recall_count recomputed (cascade)"
          - "ServiceOrder.version += 1"

      - from: OPEN
        to: CANCELLED
        trigger: "POST /service-orders/{soId}/cancel"
        actor: ServiceAdvisor | DealerManager
        preconditions:
          - "status IN {OPEN, IN_PROGRESS, AWAITING_PARTS} (ERR_SO_TERMINAL)"
        side_effects:
          - "All RESERVED PartReservation -> RELEASED; each part qty_reserved -= quantity; qty_available recomputed (cascade)"
          - "Any SCHEDULED/CHECKED_IN Appointment for this order -> CANCELLED (cascade, frees the bay interval)"
          - "ServiceOrder.version += 1"

      - from: IN_PROGRESS
        to: CANCELLED
        trigger: "POST /service-orders/{soId}/cancel"
        actor: ServiceAdvisor | DealerManager
        preconditions:
          - "status IN {OPEN, IN_PROGRESS, AWAITING_PARTS} (ERR_SO_TERMINAL)"
        side_effects:
          - "All RESERVED PartReservation -> RELEASED; each part qty_reserved -= quantity; qty_available recomputed (cascade)"
          - "Any SCHEDULED/CHECKED_IN Appointment for this order -> CANCELLED (cascade)"
          - "ServiceOrder.version += 1"

      - from: AWAITING_PARTS
        to: CANCELLED
        trigger: "POST /service-orders/{soId}/cancel"
        actor: ServiceAdvisor | DealerManager
        preconditions:
          - "status IN {OPEN, IN_PROGRESS, AWAITING_PARTS} (ERR_SO_TERMINAL)"
        side_effects:
          - "All RESERVED PartReservation -> RELEASED; each part qty_reserved -= quantity; qty_available recomputed (cascade)"
          - "Any SCHEDULED/CHECKED_IN Appointment for this order -> CANCELLED (cascade)"
          - "ServiceOrder.version += 1"

  # ---- Appointment: linear with cancel ----
  - entity: Appointment
    initial_state: SCHEDULED
    terminal_states: [CLOSED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: CHECKED_IN
        trigger: "POST /appointments/{apptId}/check-in"
        actor: ServiceAdvisor
        preconditions:
          - "status == SCHEDULED (ERR_APPT_BAD_STATE)"
        side_effects:
          - "Appointment.version += 1"

      - from: CHECKED_IN
        to: CLOSED
        trigger: "POST /appointments/{apptId}/close"
        actor: ServiceAdvisor
        preconditions:
          - "status == CHECKED_IN (ERR_APPT_BAD_STATE)"
        side_effects:
          - "Appointment.version += 1"

      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /appointments/{apptId}/cancel"
        actor: ServiceAdvisor | DealerManager
        preconditions:
          - "status IN {SCHEDULED, CHECKED_IN} (ERR_APPT_TERMINAL)"
        side_effects:
          - "Bay interval freed for overlap checks"
          - "Appointment.version += 1"

  # ---- StorageSlot: BOOKED -> ACTIVE -> RELEASED ----
  - entity: StorageSlot
    initial_state: BOOKED
    terminal_states: [RELEASED, CANCELLED]
    transitions:
      - from: BOOKED
        to: ACTIVE
        trigger: "POST /storage-slots/{slotId}/activate"
        actor: ServiceAdvisor
        preconditions:
          - "status == BOOKED (ERR_STORAGE_BAD_STATE)"
        side_effects:
          - "StorageSlot.version += 1"

      - from: ACTIVE
        to: RELEASED
        trigger: "POST /storage-slots/{slotId}/release"
        actor: ServiceAdvisor | DealerManager
        preconditions:
          - "status == ACTIVE (ERR_STORAGE_BAD_STATE)"
          - "released_on_utc >= start_utc (ERR_INVALID_RELEASE_TIME)"
        side_effects:
          - "billed_cents computed (storage_charge)"
          - "StorageSlot.version += 1"

      - from: BOOKED
        to: CANCELLED
        trigger: "POST /storage-slots/{slotId}/cancel"
        actor: ServiceAdvisor | DealerManager
        preconditions:
          - "status == BOOKED (ERR_STORAGE_BAD_STATE)"
        side_effects:
          - "Storage interval freed for overlap checks"
          - "StorageSlot.version += 1"

  # ---- RecallCampaign ----
  - entity: RecallCampaign
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: CLOSED
        trigger: "POST /recall-campaigns/{rcId}/close"
        actor: DealerManager
        preconditions:
          - "status == OPEN (ERR_RECALL_BAD_STATE)"
          - "All RecallRemedy rows for this campaign are CLEARED (ERR_REMEDIES_OUTSTANDING)"
        side_effects:
          - "RecallCampaign.version += 1"
          - "Each targeted unit's open_recall_count recomputed (cascade)"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: deal-create-stale-unit
    parent_entity: Unit
    write_endpoint: "POST /deals"
    occ_field: "expected_unit_version"
    description: |
      Creating a Deal against a Unit whose version has advanced since the client
      last observed it is rejected. This captures the case where another writer
      has already placed (or released) a hold on the same unit — which
      legitimately changes Unit.status and active_hold_deal_id and bumps
      Unit.version — so the current writer's view of the unit is stale. The new
      deal would supersede a prior hold under the AVAILABLE->HELD rule, so the
      stale-version guard is required for a deterministic outcome.
    error_id: ERR_STALE_UNIT_VERSION
    http_status: 412

  - rule_id: storage-book-stale-unit
    parent_entity: Unit
    write_endpoint: "POST /storage-slots"
    occ_field: "expected_unit_version"
    description: |
      Booking a StorageSlot for a Unit whose version has advanced since the
      client last read it is rejected. A storage booking legitimately supersedes
      a prior intent to store the same unit; the stale-version guard makes the
      loser deterministic rather than depending on observation timing.
    error_id: ERR_STALE_UNIT_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: net_trade_equity
    trigger: "Deal quote (POST /deals/{id}/quote); also surfaced on equity-summary"
    algorithm: forward_looking
    formula: |
      gross_equity = trade_allowance_cents - trade_payoff_cents
      # APPLIED variant (buyer credit on the deal): recon is the dealer's risk and
      #   is NOT netted from the buyer's credit.
      net_trade_equity_cents   = gross_equity                                     # may be negative
      # DEALER-BOOK variant (margin analysis): subtracts recon.
      dealer_book_equity_cents = trade_allowance_cents - trade_payoff_cents - trade_recon_cost_cents
      # When trade_unit_id is null both are 0.
    input_set: "Deal trade fields; only when trade_unit_id is present, else both equities = 0"
    constants: {}
    precision: "integer cents, exact"
    variants:
      - name: applied_equity_quote
        when: "computed at quote for the buyer-facing deal math (feeds deal_amount_due)"
        difference: "buyer credit = trade_allowance - trade_payoff; recon NOT subtracted"
      - name: dealer_book_equity
        when: "surfaced on GET /deals/{id}/equity-summary for dealer margin analysis"
        difference: "dealer book equity = trade_allowance - trade_payoff - trade_recon_cost; the two variants diverge by exactly trade_recon_cost_cents"

  - name: deal_amount_due
    trigger: "Deal quote (POST /deals/{id}/quote)"
    algorithm: aggregation
    formula: |
      # Evaluation order is PINNED (tax depends on taxable_base which depends on
      # trade credit; doc_fee snapshot is fixed first).
      doc_fee_cents         = Dealership.doc_fee_cents                                  # step 1 snapshot
      taxable_base_cents    = max(sale_price_cents - net_trade_equity_cents, 0)          # step 2 (trade credit reduces tax base, floored at 0)
      tax_cents             = round_half_up(taxable_base_cents * sales_tax_rate_bps / 10000)   # step 3 (doc_fee is NOT taxed)
      gross_due_cents       = sale_price_cents + doc_fee_cents + tax_cents                # step 4
      amount_financed_cents = max(gross_due_cents - net_trade_equity_cents - down_payment_cents, 0)   # step 5
    input_set: "Single Deal row; net_trade_equity from net_trade_equity.applied_equity_quote"
    constants:
      ROUNDING: round_half_up
    precision: "integer cents; tax rounded round_half_up at step 3 only"

  - name: monthly_payment
    trigger: "Finance approval (POST /deals/{id}/finance-decision APPROVE)"
    algorithm: tiered_pricing
    formula: |
      # APR band selected by customer.credit_tier (non-linear tier selection),
      # then standard amortization. r is the monthly rate.
      apr_bps = APR_BAND[credit_tier]                       # tiered selection
      P       = amount_financed_cents
      n       = term_months
      r       = apr_bps / 10000 / 12
      monthly_payment_cents = round_half_up( P * r * (1+r)^n / ((1+r)^n - 1) )
      # LTV guard (precondition, not part of payment):
      #   ltv_bps = P * 10000 / unit.list_price_cents
      #   must be <= MAX_LTV_BPS[credit_tier] else ERR_LTV_EXCEEDED (inclusive at max).
    input_set: "Single Deal; amount_financed_cents from deal_amount_due; credit_tier from Customer"
    constants:
      APR_BAND: { PRIME: 599, STANDARD: 899, SUBPRIME: 1499 }              # bps
      MAX_LTV_BPS: { PRIME: 13000, STANDARD: 12000, SUBPRIME: 11000 }      # 130%/120%/110%
      ROUNDING: round_half_up
    precision: "integer cents, round_half_up on final payment"

  - name: service_order_total
    trigger: "ServiceOrder complete (POST /service-orders/{id}/complete)"
    algorithm: threshold
    formula: |
      labor_cents = round_half_up(labor_hours * labor_rate_cents)            # round labor FIRST
      parts_cents = sum over RESERVED PartReservation of (quantity * unit_price_cents)   # exact integer
      gross_cents = labor_cents + parts_cents
      if is_warranty:
        remaining_cap = WarrantyPlan.coverage_cap_cents - WarrantyPlan.consumed_cents
        coverable     = max(gross_cents - WarrantyPlan.deductible_cents, 0)
        # completion is rejected when coverable > remaining_cap (ERR_WARRANTY_CAP_EXCEEDED)
        covered_cents = min(coverable, remaining_cap)
        total_cents   = gross_cents - covered_cents
      else:
        covered_cents = 0
        total_cents   = gross_cents
    input_set: "ServiceOrder + its RESERVED PartReservations; WarrantyPlan when is_warranty"
    constants:
      ROUNDING: round_half_up
    precision: "integer cents; labor rounded BEFORE summing with exact-integer parts (rounding order PINNED: round-then-sum)"

  - name: storage_charge
    trigger: "StorageSlot release (POST /storage-slots/{id}/release)"
    algorithm: aggregation
    formula: |
      # Half-open day count: each started calendar day bills a full day; minimum 1.
      elapsed_seconds = released_on_utc - start_utc                  # released_on_utc supplied in request
      days = max(1, ceil(elapsed_seconds / 86400))
      base = days * daily_rate_cents
      billed_cents = base + (WINTERIZE_FEE_CENTS if winterized else 0)
    input_set: "Single StorageSlot; released_on_utc from release request"
    constants:
      WINTERIZE_FEE_CENTS: 25000
    precision: "integer cents; day count via ceil over 86400s, minimum 1 day"

  - name: consignor_proceeds
    trigger: "Deal deliver when unit.acquisition==CONSIGNMENT (POST /deals/{id}/deliver)"
    algorithm: waterfall_allocation
    formula: |
      # Dealer commission comes off the TOP, then the consignor floor is honored;
      # if the floor cannot be met after commission, the dealer absorbs the gap.
      commission_cents = round_half_up(sale_price_cents * consignment_fee_bps / 10000)
      consignor_net    = sale_price_cents - commission_cents
      if consignor_net < consignment_floor_cents:
        consignor_net    = consignment_floor_cents
        commission_cents = sale_price_cents - consignment_floor_cents          # may be negative -> dealer loss
      dealer_margin_cents = sale_price_cents - consignor_net
    input_set: "Single sold consignment Unit + its Deal"
    constants:
      ROUNDING: round_half_up
    precision: "integer cents, round_half_up on commission"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and well-formed"
    error_id: ERR_MISSING_AUTH
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "Role permitted for this operation per §1.7"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "Referenced resources exist (path id, then body FK targets), validated left-to-right"
    error_id: "ERR_*_NOT_FOUND"
    http_status: 404
    applies_to: all

  - priority: 4
    category: state
    check: "OCC: expected_unit_version (when the endpoint declares it) matches Unit.version"
    error_id: ERR_STALE_UNIT_VERSION
    http_status: 412
    applies_to: "POST /deals, POST /storage-slots"
    note: "Checked before business rules so a stale writer fails fast"

  - priority: 5
    category: state
    check: "Target resource in a state legal for the requested transition"
    error_id: "ERR_*_BAD_STATE / ERR_*_TERMINAL / ERR_FINANCE_NOT_SETTLED / ERR_PDI_NOT_PASSED"
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 6
    category: business_referential
    check: "FK targets are role-consistent (consignor required/forbidden, warranty plan covers unit)"
    error_id: "ERR_CONSIGNOR_REQUIRED / ERR_CONSIGNOR_NOT_ALLOWED / ERR_WARRANTY_UNIT_MISMATCH"
    http_status: 409
    applies_to: "POST /units, POST /service-orders"

  - priority: 7
    category: business_safety
    check: "STOP_SALE recall with a non-CLEARED RecallRemedy blocks deal delivery"
    error_id: ERR_STOP_SALE_RECALL_OPEN
    http_status: 409
    applies_to: "POST /deals/{id}/deliver"

  - priority: 8
    category: business_temporal
    check: "Appointment interval must not overlap another non-cancelled Appointment on the same bay, INCLUDING the cleanup buffer appended after each appointment"
    error_id: ERR_BAY_DOUBLE_BOOKED
    http_status: 409
    applies_to: "POST /appointments"

  - priority: 9
    category: business_temporal
    check: "StorageSlot interval must not overlap another non-cancelled StorageSlot for the same unit (half-open: end==start is OK, no buffer)"
    error_id: ERR_STORAGE_OVERLAP
    http_status: 409
    applies_to: "POST /storage-slots"

  - priority: 10
    category: business_constraint
    check: "Part reservation quantity must not exceed part qty_available"
    error_id: ERR_INSUFFICIENT_PARTS
    http_status: 409
    applies_to: "POST /part-reservations"

  - priority: 11
    category: business_fiscal
    check: "Computed LTV must be within the customer credit_tier MAX_LTV band on finance approval"
    error_id: ERR_LTV_EXCEEDED
    http_status: 402
    applies_to: "POST /deals/{id}/finance-decision"

  - priority: 12
    category: business_fiscal
    check: "Warranty claim coverage (gross - deductible) must not exceed remaining plan cap headroom on completion"
    error_id: ERR_WARRANTY_CAP_EXCEEDED
    http_status: 402
    applies_to: "POST /service-orders/{id}/complete"

  - priority: 13
    category: business_constraint
    check: "Field-level validation: non-negative amounts, valid enums, term 12..240, doc_fee within cap, unique vin/email/sku/campaign_code, end_utc > start_utc"
    error_id: "ERR_INVALID_REQUEST / ERR_DUPLICATE_* / ERR_DOC_FEE_OVER_CAP / ERR_INVALID_TERM / ERR_INVALID_INTERVAL"
    http_status: 400
    applies_to: all

# =============================================================================
# §1.5 API Endpoint Table  (flat top-level collections)
# =============================================================================
endpoints:
  # ---- test-driving clock ----
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set a dealership's deterministic clock"
    roles: [DealerManager]
    code: 200
    input: [dealership_id, to_iso8601]
    output: Dealership
    side_effects: ["Dealership.current_utc = to_iso8601"]

  # ---- Dealership ----
  - method: POST
    path: "/dealerships"
    description: "Create a dealership (tenant root)"
    roles: [DealerManager]
    code: 201
    input: [name, state_code, doc_fee_cents, sales_tax_rate_bps]
    output: Dealership
    side_effects: ["current_utc initialized to epoch"]

  - method: GET
    path: "/dealerships"
    description: "List dealerships"
    roles: [DealerManager, SalesAgent, ServiceAdvisor]
    code: 200
    input: ["limit?", "offset?"]
    output: "Dealership[]"
    side_effects: []

  - method: GET
    path: "/dealerships/{dealershipId}"
    description: "Get a dealership"
    roles: [DealerManager, SalesAgent, ServiceAdvisor, Customer]
    code: 200
    input: []
    output: Dealership
    side_effects: []

  # ---- Customer ----
  - method: POST
    path: "/customers"
    description: "Create a customer"
    roles: [SalesAgent, ServiceAdvisor, DealerManager]
    code: 201
    input: [dealership_id, full_name, email, "credit_tier?"]
    output: Customer
    side_effects: []

  - method: GET
    path: "/customers"
    description: "List/filter customers"
    roles: [DealerManager, SalesAgent, ServiceAdvisor]
    code: 200
    input: ["dealership_id?", "limit?", "offset?"]
    output: "Customer[]"
    side_effects: []

  - method: GET
    path: "/customers/{customerId}"
    description: "Get a customer"
    roles: [DealerManager, SalesAgent, ServiceAdvisor, Customer]
    code: 200
    input: []
    output: Customer
    side_effects: []

  # ---- Unit ----
  - method: POST
    path: "/units"
    description: "Create a unit (STOCK or CONSIGNMENT)"
    roles: [SalesAgent, DealerManager]
    code: 201
    input: [dealership_id, vin, model_year, class_type, "acquisition?", "consignor_customer_id?", list_price_cents, "consignment_floor_cents?", "consignment_fee_bps?"]
    output: Unit
    side_effects: ["status=AVAILABLE", "open_recall_count computed from existing OPEN campaigns targeting class+year (creates PENDING RecallRemedy rows)"]

  - method: GET
    path: "/units"
    description: "List/filter units (by dealership_id, consignor_customer_id, trade_in_origin_unit_id, active_hold_deal_id, status)"
    roles: [DealerManager, SalesAgent, ServiceAdvisor]
    code: 200
    input: ["dealership_id?", "consignor_customer_id?", "trade_in_origin_unit_id?", "active_hold_deal_id?", "status?", "limit?", "offset?"]
    output: "Unit[]"
    side_effects: []

  - method: GET
    path: "/units/{unitId}"
    description: "Get a unit"
    roles: [DealerManager, SalesAgent, ServiceAdvisor, Customer]
    code: 200
    input: []
    output: Unit
    side_effects: []

  - method: POST
    path: "/units/{unitId}/return-consignment"
    description: "Return a consigned unit to its consignor (terminal)"
    roles: [ServiceAdvisor, DealerManager]
    code: 200
    input: []
    output: Unit
    side_effects: ["status=CONSIGNMENT_RETURNED", "version+=1"]

  # ---- Deal ----
  - method: POST
    path: "/deals"
    description: "Create a deal, placing a hold on the unit (OCC on Unit.version)"
    roles: [SalesAgent]
    code: 201
    input: [dealership_id, unit_id, customer_id, sale_price_cents, expected_unit_version, "down_payment_cents?", "term_months?"]
    output: Deal
    side_effects:
      - "sale_status=DRAFT, finance_status=NONE"
      - "Unit AVAILABLE->HELD (cascade), Unit.active_hold_deal_id set, Unit.version += 1"
      - "sales_agent_user_id set from X-User-ID"

  - method: GET
    path: "/deals"
    description: "List/filter deals (by dealership_id, unit_id, customer_id, trade_unit_id, sale_status, finance_status)"
    roles: [DealerManager, SalesAgent]
    code: 200
    input: ["dealership_id?", "unit_id?", "customer_id?", "trade_unit_id?", "sale_status?", "finance_status?", "limit?", "offset?"]
    output: "Deal[]"
    side_effects: []

  - method: GET
    path: "/deals/{dealId}"
    description: "Get a deal"
    roles: [DealerManager, SalesAgent, Customer]
    code: 200
    input: []
    output: Deal
    side_effects: []

  - method: GET
    path: "/deals/{dealId}/equity-summary"
    description: "Computed read: applied buyer equity vs dealer-book equity"
    roles: [DealerManager, SalesAgent]
    code: 200
    input: []
    output: Deal
    side_effects: []

  - method: POST
    path: "/deals/{dealId}/quote"
    description: "Quote the deal: compute tax, financed amount, applied trade equity; sets finance CASH if no term"
    roles: [SalesAgent]
    code: 200
    input: []
    output: Deal
    side_effects: ["sale_status DRAFT->QUOTED", "deal_amount_due recomputed", "finance_status NONE->CASH if term_months absent"]

  - method: POST
    path: "/deals/{dealId}/request-finance"
    description: "Request financing for the deal (supply or reuse term_months)"
    roles: [SalesAgent]
    code: 200
    input: ["term_months?"]
    output: Deal
    side_effects: ["finance_status NONE/DECLINED->REQUESTED", "apr_bps cleared", "version+=1"]

  - method: POST
    path: "/deals/{dealId}/finance-decision"
    description: "Manager approves or declines financing"
    roles: [DealerManager]
    code: 200
    input: [decision]
    output: Deal
    side_effects: ["finance_status REQUESTED->APPROVED/DECLINED", "on APPROVE: apr_bps + monthly_payment_cents computed (LTV checked)"]

  - method: POST
    path: "/deals/{dealId}/start-pdi"
    description: "Move a quoted, finance-settled deal into PDI_PENDING"
    roles: [SalesAgent]
    code: 200
    input: []
    output: Deal
    side_effects: ["sale_status QUOTED->PDI_PENDING"]

  - method: POST
    path: "/deals/{dealId}/deliver"
    description: "Deliver the unit: complete the sale, settle consignment/trade, mark unit SOLD"
    roles: [SalesAgent, DealerManager]
    code: 200
    input: []
    output: Deal
    side_effects:
      - "sale_status WALKTHROUGH->DELIVERED"
      - "Unit HELD->SOLD (cascade)"
      - "If unit acquisition==CONSIGNMENT: consignor_proceeds recorded"

  - method: POST
    path: "/deals/{dealId}/cancel"
    description: "Cancel a non-delivered deal; release the unit hold"
    roles: [SalesAgent, DealerManager]
    code: 200
    input: []
    output: Deal
    side_effects: ["sale_status->CANCELLED", "Unit HELD->AVAILABLE (cascade), active_hold_deal_id cleared, Unit.version+=1"]

  - method: POST
    path: "/deals/{dealId}/appraise-trade"
    description: "Appraise and intake a trade-in unit for this deal (creates a TRADE_IN Unit and links it)"
    roles: [SalesAgent, DealerManager]
    code: 201
    input: [vin, model_year, class_type, list_price_cents, trade_allowance_cents, "trade_payoff_cents?", "trade_recon_cost_cents?"]
    output: Unit
    side_effects: ["new Unit acquisition=TRADE_IN, status=AVAILABLE, trade_in_origin_unit_id=this deal's unit_id", "Deal.trade_unit_id + trade_* fields set"]

  # ---- PdiInspection ----
  - method: POST
    path: "/pdi-inspections"
    description: "Record a PDI inspection for a deal; PASS advances the deal to WALKTHROUGH"
    roles: [ServiceAdvisor]
    code: 201
    input: [dealership_id, deal_id, defects_found]
    output: PdiInspection
    side_effects: ["result computed (PASS iff defects_found==0 and unit open_recall_count==0)", "on PASS: Deal PDI_PENDING->WALKTHROUGH, pdi_passed=true"]

  - method: GET
    path: "/pdi-inspections"
    description: "List/filter PDI inspections (by deal_id, unit_id)"
    roles: [DealerManager, SalesAgent, ServiceAdvisor]
    code: 200
    input: ["deal_id?", "unit_id?", "dealership_id?", "limit?", "offset?"]
    output: "PdiInspection[]"
    side_effects: []

  - method: GET
    path: "/pdi-inspections/{pdiId}"
    description: "Get a PDI inspection"
    roles: [DealerManager, SalesAgent, ServiceAdvisor]
    code: 200
    input: []
    output: PdiInspection
    side_effects: []

  # ---- ServiceBay ----
  - method: POST
    path: "/service-bays"
    description: "Create a service bay"
    roles: [ServiceAdvisor, DealerManager]
    code: 201
    input: [dealership_id, name, bay_kind, "cleanup_buffer_minutes?"]
    output: ServiceBay
    side_effects: []

  - method: GET
    path: "/service-bays"
    description: "List service bays"
    roles: [DealerManager, ServiceAdvisor, SalesAgent]
    code: 200
    input: ["dealership_id?", "limit?", "offset?"]
    output: "ServiceBay[]"
    side_effects: []

  - method: GET
    path: "/service-bays/{bayId}"
    description: "Get a service bay"
    roles: [DealerManager, ServiceAdvisor, SalesAgent]
    code: 200
    input: []
    output: ServiceBay
    side_effects: []

  # ---- ServiceOrder ----
  - method: POST
    path: "/service-orders"
    description: "Open a service order"
    roles: [ServiceAdvisor, DealerManager]
    code: 201
    input: [dealership_id, unit_id, customer_id, labor_hours, labor_rate_cents, "is_warranty?", "warranty_plan_id?"]
    output: ServiceOrder
    side_effects: ["status=OPEN", "advisor_user_id set from X-User-ID"]

  - method: GET
    path: "/service-orders"
    description: "List/filter service orders (by dealership_id, unit_id, customer_id, warranty_plan_id, status)"
    roles: [DealerManager, ServiceAdvisor]
    code: 200
    input: ["dealership_id?", "unit_id?", "customer_id?", "warranty_plan_id?", "status?", "limit?", "offset?"]
    output: "ServiceOrder[]"
    side_effects: []

  - method: GET
    path: "/service-orders/{soId}"
    description: "Get a service order"
    roles: [DealerManager, ServiceAdvisor, Customer]
    code: 200
    input: []
    output: ServiceOrder
    side_effects: []

  - method: POST
    path: "/service-orders/{soId}/start"
    description: "Start work (OPEN->IN_PROGRESS)"
    roles: [ServiceAdvisor]
    code: 200
    input: []
    output: ServiceOrder
    side_effects: ["status OPEN->IN_PROGRESS"]

  - method: POST
    path: "/service-orders/{soId}/await-parts"
    description: "Pause work pending parts (IN_PROGRESS->AWAITING_PARTS)"
    roles: [ServiceAdvisor]
    code: 200
    input: []
    output: ServiceOrder
    side_effects: ["status IN_PROGRESS->AWAITING_PARTS"]

  - method: POST
    path: "/service-orders/{soId}/resume"
    description: "Resume work (AWAITING_PARTS->IN_PROGRESS)"
    roles: [ServiceAdvisor]
    code: 200
    input: []
    output: ServiceOrder
    side_effects: ["status AWAITING_PARTS->IN_PROGRESS"]

  - method: POST
    path: "/service-orders/{soId}/complete"
    description: "Complete the order; settle parts, totals, warranty, recall remediation"
    roles: [ServiceAdvisor]
    code: 200
    input: ["remediates_campaign_id?"]
    output: ServiceOrder
    side_effects:
      - "status IN_PROGRESS->COMPLETED"
      - "service_order_total computed; RESERVED parts FULFILLED; qty_on_hand/reserved adjusted (cascade)"
      - "If is_warranty: WarrantyPlan.consumed_cents += covered_cents; EXHAUSTED if cap hit (cascade)"
      - "If remediates_campaign_id: matching RecallRemedy PENDING->CLEARED; unit.open_recall_count recomputed (cascade)"

  - method: POST
    path: "/service-orders/{soId}/cancel"
    description: "Cancel the order; release parts and appointments"
    roles: [ServiceAdvisor, DealerManager]
    code: 200
    input: []
    output: ServiceOrder
    side_effects: ["status->CANCELLED", "RESERVED parts RELEASED (cascade)", "SCHEDULED/CHECKED_IN appointments CANCELLED (cascade)"]

  # ---- PartReservation ----
  - method: POST
    path: "/part-reservations"
    description: "Reserve parts against an open/in-progress order"
    roles: [ServiceAdvisor]
    code: 201
    input: [service_order_id, part_item_id, quantity]
    output: PartReservation
    side_effects: ["status=RESERVED", "PartItem.qty_reserved += quantity; qty_available recomputed (cascade)", "unit_price_cents snapshotted"]

  - method: GET
    path: "/part-reservations"
    description: "List/filter part reservations (by service_order_id, part_item_id, status)"
    roles: [DealerManager, ServiceAdvisor]
    code: 200
    input: ["service_order_id?", "part_item_id?", "status?", "dealership_id?", "limit?", "offset?"]
    output: "PartReservation[]"
    side_effects: []

  - method: GET
    path: "/part-reservations/{resId}"
    description: "Get a part reservation"
    roles: [DealerManager, ServiceAdvisor]
    code: 200
    input: []
    output: PartReservation
    side_effects: []

  # ---- PartItem ----
  - method: POST
    path: "/part-items"
    description: "Create a part item"
    roles: [ServiceAdvisor, DealerManager]
    code: 201
    input: [dealership_id, sku, name, unit_price_cents, qty_on_hand]
    output: PartItem
    side_effects: ["qty_reserved=0, qty_available=qty_on_hand"]

  - method: GET
    path: "/part-items"
    description: "List part items"
    roles: [DealerManager, ServiceAdvisor]
    code: 200
    input: ["dealership_id?", "limit?", "offset?"]
    output: "PartItem[]"
    side_effects: []

  - method: GET
    path: "/part-items/{partId}"
    description: "Get a part item"
    roles: [DealerManager, ServiceAdvisor]
    code: 200
    input: []
    output: PartItem
    side_effects: []

  # ---- WarrantyPlan ----
  - method: POST
    path: "/warranty-plans"
    description: "Create a warranty plan for a unit+customer"
    roles: [SalesAgent, DealerManager]
    code: 201
    input: [dealership_id, unit_id, customer_id, plan_kind, coverage_cap_cents, "deductible_cents?"]
    output: WarrantyPlan
    side_effects: ["status=ACTIVE, consumed_cents=0"]

  - method: GET
    path: "/warranty-plans"
    description: "List/filter warranty plans (by dealership_id, unit_id, customer_id, status)"
    roles: [DealerManager, SalesAgent, ServiceAdvisor]
    code: 200
    input: ["dealership_id?", "unit_id?", "customer_id?", "status?", "limit?", "offset?"]
    output: "WarrantyPlan[]"
    side_effects: []

  - method: GET
    path: "/warranty-plans/{planId}"
    description: "Get a warranty plan"
    roles: [DealerManager, SalesAgent, ServiceAdvisor, Customer]
    code: 200
    input: []
    output: WarrantyPlan
    side_effects: []

  - method: POST
    path: "/warranty-plans/{planId}/cancel"
    description: "Cancel a warranty plan"
    roles: [DealerManager]
    code: 200
    input: []
    output: WarrantyPlan
    side_effects: ["status->CANCELLED"]

  # ---- Appointment ----
  - method: POST
    path: "/appointments"
    description: "Schedule a bay appointment (REPAIR or PDI)"
    roles: [ServiceAdvisor]
    code: 201
    input: [dealership_id, service_bay_id, appt_kind, start_utc, end_utc, "service_order_id?", "deal_id?"]
    output: Appointment
    side_effects: ["status=SCHEDULED", "bay overlap check incl. cleanup buffer"]

  - method: GET
    path: "/appointments"
    description: "List/filter appointments (by dealership_id, service_bay_id, service_order_id, deal_id, status)"
    roles: [DealerManager, ServiceAdvisor]
    code: 200
    input: ["dealership_id?", "service_bay_id?", "service_order_id?", "deal_id?", "status?", "limit?", "offset?"]
    output: "Appointment[]"
    side_effects: []

  - method: GET
    path: "/appointments/{apptId}"
    description: "Get an appointment"
    roles: [DealerManager, ServiceAdvisor]
    code: 200
    input: []
    output: Appointment
    side_effects: []

  - method: POST
    path: "/appointments/{apptId}/check-in"
    description: "Check in an appointment"
    roles: [ServiceAdvisor]
    code: 200
    input: []
    output: Appointment
    side_effects: ["status SCHEDULED->CHECKED_IN"]

  - method: POST
    path: "/appointments/{apptId}/close"
    description: "Close an appointment"
    roles: [ServiceAdvisor]
    code: 200
    input: []
    output: Appointment
    side_effects: ["status CHECKED_IN->CLOSED"]

  - method: POST
    path: "/appointments/{apptId}/cancel"
    description: "Cancel an appointment, freeing the bay interval"
    roles: [ServiceAdvisor, DealerManager]
    code: 200
    input: []
    output: Appointment
    side_effects: ["status->CANCELLED"]

  # ---- StorageSlot ----
  - method: POST
    path: "/storage-slots"
    description: "Book a storage slot for a unit (OCC on Unit.version)"
    roles: [ServiceAdvisor, DealerManager]
    code: 201
    input: [dealership_id, unit_id, customer_id, daily_rate_cents, start_utc, end_utc, expected_unit_version, "winterized?"]
    output: StorageSlot
    side_effects: ["status=BOOKED", "storage overlap check on unit", "Unit.version += 1"]

  - method: GET
    path: "/storage-slots"
    description: "List/filter storage slots (by dealership_id, unit_id, customer_id, status)"
    roles: [DealerManager, ServiceAdvisor]
    code: 200
    input: ["dealership_id?", "unit_id?", "customer_id?", "status?", "limit?", "offset?"]
    output: "StorageSlot[]"
    side_effects: []

  - method: GET
    path: "/storage-slots/{slotId}"
    description: "Get a storage slot"
    roles: [DealerManager, ServiceAdvisor, Customer]
    code: 200
    input: []
    output: StorageSlot
    side_effects: []

  - method: POST
    path: "/storage-slots/{slotId}/activate"
    description: "Activate a booked storage slot"
    roles: [ServiceAdvisor]
    code: 200
    input: []
    output: StorageSlot
    side_effects: ["status BOOKED->ACTIVE"]

  - method: POST
    path: "/storage-slots/{slotId}/release"
    description: "Release an active storage slot, billing the term"
    roles: [ServiceAdvisor, DealerManager]
    code: 200
    input: [released_on_utc]
    output: StorageSlot
    side_effects: ["status ACTIVE->RELEASED", "billed_cents computed (storage_charge)"]

  - method: POST
    path: "/storage-slots/{slotId}/cancel"
    description: "Cancel a booked storage slot"
    roles: [ServiceAdvisor, DealerManager]
    code: 200
    input: []
    output: StorageSlot
    side_effects: ["status BOOKED->CANCELLED"]

  # ---- RecallCampaign / RecallRemedy ----
  - method: POST
    path: "/recall-campaigns"
    description: "Open a recall campaign; auto-create PENDING RecallRemedy for each in-scope unit"
    roles: [DealerManager]
    code: 201
    input: [dealership_id, campaign_code, target_class_type, target_model_year, severity]
    output: RecallCampaign
    side_effects: ["status=OPEN", "PENDING RecallRemedy created for each matching unit; their open_recall_count incremented (cascade)"]

  - method: GET
    path: "/recall-campaigns"
    description: "List/filter recall campaigns (by dealership_id, status, target_class_type)"
    roles: [DealerManager, SalesAgent, ServiceAdvisor]
    code: 200
    input: ["dealership_id?", "status?", "target_class_type?", "limit?", "offset?"]
    output: "RecallCampaign[]"
    side_effects: []

  - method: GET
    path: "/recall-campaigns/{rcId}"
    description: "Get a recall campaign"
    roles: [DealerManager, SalesAgent, ServiceAdvisor]
    code: 200
    input: []
    output: RecallCampaign
    side_effects: []

  - method: POST
    path: "/recall-campaigns/{rcId}/close"
    description: "Close a campaign once all remedies CLEARED"
    roles: [DealerManager]
    code: 200
    input: []
    output: RecallCampaign
    side_effects: ["status OPEN->CLOSED", "targeted units open_recall_count recomputed (cascade)"]

  - method: GET
    path: "/recall-remedies"
    description: "List/filter recall remedies (by recall_campaign_id, unit_id, status)"
    roles: [DealerManager, SalesAgent, ServiceAdvisor]
    code: 200
    input: ["recall_campaign_id?", "unit_id?", "status?", "dealership_id?", "limit?", "offset?"]
    output: "RecallRemedy[]"
    side_effects: []

  - method: GET
    path: "/recall-remedies/{remedyId}"
    description: "Get a recall remedy"
    roles: [DealerManager, SalesAgent, ServiceAdvisor]
    code: 200
    input: []
    output: RecallRemedy
    side_effects: []

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  # --- auth ---
  - { id: ERR_MISSING_AUTH, http: 401, condition: "X-User-ID or X-User-Role header missing or malformed" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Role not permitted for this operation" }

  # --- existence ---
  - { id: ERR_DEALERSHIP_NOT_FOUND, http: 404, condition: "Dealership id does not exist" }
  - { id: ERR_CUSTOMER_NOT_FOUND, http: 404, condition: "Customer not found" }
  - { id: ERR_UNIT_NOT_FOUND, http: 404, condition: "Unit not found" }
  - { id: ERR_DEAL_NOT_FOUND, http: 404, condition: "Deal not found" }
  - { id: ERR_SERVICE_BAY_NOT_FOUND, http: 404, condition: "Service bay not found" }
  - { id: ERR_SERVICE_ORDER_NOT_FOUND, http: 404, condition: "Service order not found" }
  - { id: ERR_PART_ITEM_NOT_FOUND, http: 404, condition: "Part item not found" }
  - { id: ERR_WARRANTY_PLAN_NOT_FOUND, http: 404, condition: "Warranty plan not found" }
  - { id: ERR_APPOINTMENT_NOT_FOUND, http: 404, condition: "Appointment not found" }
  - { id: ERR_STORAGE_SLOT_NOT_FOUND, http: 404, condition: "Storage slot not found" }
  - { id: ERR_RECALL_CAMPAIGN_NOT_FOUND, http: 404, condition: "Recall campaign not found" }

  # --- OCC / state ---
  - { id: ERR_STALE_UNIT_VERSION, http: 412, condition: "expected_unit_version does not match Unit.version on POST /deals or POST /storage-slots" }
  - { id: ERR_UNIT_NOT_AVAILABLE, http: 409, condition: "Unit not AVAILABLE for the requested hold/return" }
  - { id: ERR_DEAL_BAD_SALE_STATE, http: 409, condition: "Deal sale_status not legal for this transition" }
  - { id: ERR_DEAL_TERMINAL, http: 409, condition: "Deal already DELIVERED or CANCELLED" }
  - { id: ERR_FINANCE_BAD_STATE, http: 409, condition: "Deal finance_status not legal for this finance transition" }
  - { id: ERR_FINANCE_NOT_SETTLED, http: 409, condition: "finance_status not in {CASH, APPROVED} when the sale pipeline requires settlement" }
  - { id: ERR_PDI_NOT_PASSED, http: 409, condition: "Deliver attempted before a passing PDI" }
  - { id: ERR_SO_BAD_STATE, http: 409, condition: "ServiceOrder status not legal for this transition" }
  - { id: ERR_SO_TERMINAL, http: 409, condition: "ServiceOrder already COMPLETED or CANCELLED" }
  - { id: ERR_APPT_BAD_STATE, http: 409, condition: "Appointment status not legal for this transition" }
  - { id: ERR_APPT_TERMINAL, http: 409, condition: "Appointment already CLOSED or CANCELLED" }
  - { id: ERR_STORAGE_BAD_STATE, http: 409, condition: "StorageSlot status not legal for this transition" }
  - { id: ERR_RECALL_BAD_STATE, http: 409, condition: "RecallCampaign not OPEN for close" }
  - { id: ERR_REMEDIES_OUTSTANDING, http: 409, condition: "Recall campaign close blocked by non-CLEARED remedies" }
  - { id: ERR_NOT_CONSIGNMENT, http: 409, condition: "return-consignment on a non-consignment unit" }

  # --- referential / business ---
  - { id: ERR_CONSIGNOR_REQUIRED, http: 409, condition: "acquisition==CONSIGNMENT but consignor_customer_id/floor/fee missing" }
  - { id: ERR_CONSIGNOR_NOT_ALLOWED, http: 409, condition: "consignor_customer_id supplied on a non-consignment unit" }
  - { id: ERR_WARRANTY_UNIT_MISMATCH, http: 409, condition: "warranty_plan_id does not cover the service order's unit" }
  - { id: ERR_STOP_SALE_RECALL_OPEN, http: 409, condition: "Deliver blocked by an OPEN STOP_SALE recall with a non-CLEARED remedy on the unit" }

  # --- temporal / capacity ---
  - { id: ERR_BAY_DOUBLE_BOOKED, http: 409, condition: "Appointment interval (incl. cleanup buffer) overlaps another on the same bay" }
  - { id: ERR_STORAGE_OVERLAP, http: 409, condition: "Storage interval overlaps another active/booked slot for the same unit" }
  - { id: ERR_INSUFFICIENT_PARTS, http: 409, condition: "Reservation quantity exceeds part qty_available" }

  # --- fiscal ---
  - { id: ERR_LTV_EXCEEDED, http: 402, condition: "Computed LTV exceeds the credit_tier MAX_LTV band at finance approval" }
  - { id: ERR_WARRANTY_CAP_EXCEEDED, http: 402, condition: "Warranty coverage (gross - deductible) would exceed remaining plan cap headroom on completion" }

  # --- input / uniqueness ---
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, wrong type, negative amount, or bad enum" }
  - { id: ERR_INVALID_INTERVAL, http: 400, condition: "end_utc <= start_utc on appointment/storage" }
  - { id: ERR_INVALID_RELEASE_TIME, http: 400, condition: "released_on_utc earlier than storage start_utc" }
  - { id: ERR_INVALID_TERM, http: 400, condition: "term_months outside 12..240 when finance requested" }
  - { id: ERR_DOC_FEE_OVER_CAP, http: 400, condition: "doc_fee_cents exceeds the DOC_FEE_CAP_CENTS" }
  - { id: ERR_DUPLICATE_VIN, http: 409, condition: "vin already used by another unit in the dealership" }
  - { id: ERR_DUPLICATE_EMAIL, http: 409, condition: "email already used by another customer in the dealership" }
  - { id: ERR_DUPLICATE_SKU, http: 409, condition: "sku already used by another part in the dealership" }
  - { id: ERR_DUPLICATE_CAMPAIGN, http: 409, condition: "campaign_code already used in the dealership" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: DealerManager
    description: "Override/approval authority: dealership setup, finance decisions, recalls, cancellations, plan cancellation"
    identity: opaque
    exclusive_operations:
      - "POST /dealerships — create dealership"
      - "POST /_clock/set_current_utc — set clock"
      - "POST /deals/{dealId}/finance-decision — approve/decline finance"
      - "POST /recall-campaigns — open campaign"
      - "POST /recall-campaigns/{rcId}/close — close campaign"
      - "POST /warranty-plans/{planId}/cancel — cancel plan"
    shared_operations:
      - "POST /deals/{dealId}/deliver (with SalesAgent)"
      - "POST /deals/{dealId}/cancel (with SalesAgent)"
      - "POST /deals/{dealId}/appraise-trade (with SalesAgent)"
      - "POST /units, POST /customers, POST /warranty-plans (with SalesAgent)"
      - "POST /units/{unitId}/return-consignment (with ServiceAdvisor)"
      - "POST /service-orders, POST /service-bays, POST /part-items (with ServiceAdvisor)"
      - "POST /service-orders/{soId}/cancel (with ServiceAdvisor)"
      - "POST /storage-slots, storage activate/release/cancel (with ServiceAdvisor)"
      - "all GET reads"

  - name: SalesAgent
    description: "Owns the sales surface: customers, units intake, deals, quoting, finance requests, trade appraisal, delivery"
    identity: opaque
    exclusive_operations:
      - "POST /deals — create deal"
      - "POST /deals/{dealId}/quote — quote"
      - "POST /deals/{dealId}/request-finance — request finance"
      - "POST /deals/{dealId}/start-pdi — start PDI"
    shared_operations:
      - "POST /customers (with ServiceAdvisor, DealerManager)"
      - "POST /units (with DealerManager)"
      - "POST /warranty-plans (with DealerManager)"
      - "POST /deals/{dealId}/appraise-trade (with DealerManager)"
      - "POST /deals/{dealId}/deliver (with DealerManager)"
      - "POST /deals/{dealId}/cancel (with DealerManager)"

  - name: ServiceAdvisor
    description: "Owns the service surface: bays, service orders, parts, appointments, storage, PDI inspections, recall remediation"
    identity: opaque
    exclusive_operations:
      - "POST /pdi-inspections — record PDI"
      - "POST /service-orders/{soId}/start|await-parts|resume|complete — service order lifecycle"
      - "POST /part-reservations — reserve parts"
      - "POST /appointments and its check-in|close transitions"
      - "POST /storage-slots/{slotId}/activate|release"
    shared_operations:
      - "POST /customers (with SalesAgent, DealerManager)"
      - "POST /service-bays, POST /service-orders, POST /part-items (with DealerManager)"
      - "POST /units/{unitId}/return-consignment (with DealerManager)"
      - "POST /service-orders/{soId}/cancel (with DealerManager)"
      - "POST /storage-slots, storage cancel (with DealerManager)"

  - name: Customer
    description: "Self-service read access to own deals, units, warranty plans, storage; cannot mutate"
    identity: "entity_backed:Customer"
    exclusive_operations: []
    shared_operations:
      - "GET own deal / unit / warranty-plan / storage-slot / dealership / customer reads"
