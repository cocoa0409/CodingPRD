            - "the CHARLIE EventScope row's restored_at is still null and the event stays RESTORING"
            - "ALPHA, which is CLEARED_FOR_RESTORE, re-energizes successfully immediately afterwards"

      - name: patrolling_an_energized_circuit_is_rejected
        claim_type: Error triggerability
