        distinguishing_aspect: "DECOMMISSIONED locks the lane out of every edge while simultaneously releasing its position_index for reuse — the uniqueness constraint is scoped to lane_state != DECOMMISSIONED — and total_lane_positions is deliberately NOT reduced."
        test_recipe:
