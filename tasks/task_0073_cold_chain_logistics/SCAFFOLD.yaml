scenario: |
  Cold chain logistics temperature control system: transportation task management with
  task profile (cargo/origin/destination/temperature-range), vehicle and driver assignment,
  route planning, multi-stop task handling, task-status tracking, and task-handover record;
  temperature monitoring point collection with multi-sensor integration (vehicle compartment/
  cargo box), polling-frequency configuration, GPS location synchronization, data-validity
  check, and historical-data archiving; abnormal alert and response with rule-based threshold
  alerts (out-of-range/duration), alert-level classification, multi-channel notification
  (driver/dispatch/customer), response-action recording (ventilation/refrigeration adjustment/
  transshipment), and alert-resolution tracking; cargo damage assessment with damaged-cargo
  identification, damage-degree classification, damage-cause analysis (temperature-deviation/
  duration/cargo-sensitivity), damage-amount calculation, and assessment-report generation;
  responsibility determination with chain-of-custody review, multi-party (shipper/carrier/
  consignee) responsibility analysis, evidence chain (temperature record/handover record/
  photo) review, dispute mediation, and responsibility-decision record; insurance claims with
  claim-event reporting, evidence package preparation, insurance-company assessment, claim-
  amount negotiation, payout execution, and subrogation handling; compliance reporting with
  regulatory-requirement mapping (food/pharmaceutical/biological), periodic compliance report
  generation, abnormal-event reporting, audit-trail export, and inspection-response support;
  event-driven synchronization with WMS, TMS, IoT device management, and insurance-company
  systems; audit logging for alerts and responsibility decisions.

domain_name: "cold-chain-logistics"
api_prefix: "/transport-tasks"

# =============================================================================
# Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: "Compliance / audit"
  secondary_archetype: "Multi-party negotiation"
  complexity_layers:
    - "Cascading side effects"
    - "Dual-variant calculation"
    - "Rate / threshold triggers"
    - "Idempotency"

  entity_topology: "hybrid"
  # Hierarchical core (TransportTask -> TaskStop -> HandoverRecord; Alert -> ResponseAction)
  # plus peer/flat associations (TemperatureReading, DamageAssessment, ResponsibilityDecision,
  # InsuranceClaim, ComplianceReport, Vehicle, Driver, AuditLogEntry).

  state_machine_shape: "compound"
  # TransportTask auto-transitions based on TaskStop child states (compound),
  # ResponsibilityDecision and InsuranceClaim contain cycles (negotiation rounds).

  relationship_patterns:
    - one_to_many       # TransportTask -> TaskStop, Alert -> ResponseAction
    - cross_aggregate   # DamageAssessment -> Alert + TemperatureReading; ResponsibilityDecision -> HandoverRecord
    - polymorphic       # AuditLogEntry.subject_type references multiple entity types

  role_model: "segregation_of_duties"
  # Shipper / Carrier / Driver / Consignee / Dispatcher / ComplianceOfficer / InsuranceAdjuster
  # ResponsibilityDecision finalization MUST be performed by a role disjoint from the
  # custodian role being assigned blame.

  consistency_model: "immediate"
  # All cascades occur within the triggering request (auto-open alert, auto-create
  # damage assessment record, etc.). Eventual reconciliation is not used.

# =============================================================================
# Response Envelope (FIXED — VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Vehicle
    parent: null
    common_fields: true
    fields:
      - name: vehicle_no
        type: string
        source: input
        description: "Carrier-assigned plate / fleet identifier; unique within the system."
        constraints: "Unique. Non-empty string, length 1..32."
      - name: compartment_count
        type: integer
        source: input
        description: "Number of independently-temperature-controlled compartments on the vehicle."
        constraints: "Integer, 1..6."
      - name: insured_cap_cents
        type: integer
        source: input
        description: "Per-incident insurance cap for cargo carried on this vehicle, in cents."
        constraints: "Integer, > 0."
      - name: status
        type: enum
        source: computed
        description: "Operational status, derived from active TransportTask assignments."
        constraints: "Enum: AVAILABLE, IN_USE, OUT_OF_SERVICE. Default AVAILABLE on creation."

  - name: Driver
    parent: null
    common_fields: true
    fields:
      - name: license_no
        type: string
        source: input
        description: "Government-issued driver license number; unique."
        constraints: "Unique. Non-empty string, length 1..32."
      - name: name
        type: string
        source: input
        description: "Driver display name."
        constraints: "Non-empty, length 1..120."
      - name: max_daily_minutes
        type: integer
        source: input
        description: "Maximum legally permitted driving minutes within any rolling 24h window."
        default: 660
        constraints: "Integer, 1..1440. Default 660 (11 hours)."
      - name: status
        type: enum
        source: computed
        description: "Availability status; OFF_DUTY when no active task, ON_DUTY when assigned."
        constraints: "Enum: OFF_DUTY, ON_DUTY, SUSPENDED. Default OFF_DUTY."

  - name: TransportTask
    parent: null
    common_fields: true
    fields:
      - name: cargo_type
        type: enum
        source: input
        description: "Regulatory cargo category; determines compliance domain and sensitivity tier."
        constraints: "Enum: FOOD, PHARMACEUTICAL, BIOLOGICAL."
      - name: cargo_value_cents
        type: integer
        source: input
        description: "Declared shipper value of the entire cargo at origin, in cents."
        constraints: "Integer, > 0."
      - name: cargo_quantity
        type: integer
        source: input
        description: "Integer count of cargo units (cartons / pallets) loaded at origin."
        constraints: "Integer, > 0."
      - name: temp_min_celsius
        type: number
        source: input
        description: "Lower bound of acceptable cargo temperature, inclusive (>= temp_min)."
        constraints: "Number, two decimals, > -80.0, < temp_max_celsius."
      - name: temp_max_celsius
        type: number
        source: input
        description: "Upper bound of acceptable cargo temperature, inclusive (<= temp_max)."
        constraints: "Number, two decimals, < 80.0, > temp_min_celsius."
      - name: shipper_id
        type: string
        source: input
        description: "Owner-id of the Shipper party (entity_backed Shipper role principal)."
        constraints: "Must match an existing Shipper role principal id (X-User-ID for SHIPPER)."
      - name: consignee_id
        type: string
        source: input
        description: "Owner-id of the Consignee party."
        constraints: "Must match an existing Consignee role principal id (X-User-ID for CONSIGNEE)."
      - name: carrier_id
        type: string
        source: input
        description: "Owner-id of the Carrier (dispatch) organization assigned this task."
        constraints: "Must match an existing Carrier role principal id (X-User-ID for CARRIER)."
      - name: vehicle_id
        type: string
        source: input
        description: "FK to Vehicle. Required at DISPATCHED transition; null while PLANNED."
        constraints: "Must refer to existing Vehicle. Nullable in PLANNED state."
      - name: driver_id
        type: string
        source: input
        description: "FK to Driver. Required at DISPATCHED transition; null while PLANNED."
        constraints: "Must refer to existing Driver. Nullable in PLANNED state."
      - name: planned_start_at
        type: datetime
        source: input
        description: "ISO 8601 UTC planned departure timestamp from origin."
        constraints: "ISO 8601 UTC, must be >= current clock time at creation."
      - name: planned_end_at
        type: datetime
        source: input
        description: "ISO 8601 UTC planned arrival timestamp at final destination."
        constraints: "ISO 8601 UTC, must be > planned_start_at."
      - name: polling_interval_seconds
        type: integer
        source: input
        description: "Required temperature sensor polling cadence in seconds."
        default: 60
        constraints: "Integer, 10..3600. Default 60."
      - name: status
        type: enum
        source: computed
        description: "Compound state derived from TaskStop progression and explicit transitions."
        constraints: "Enum: PLANNED, DISPATCHED, IN_TRANSIT, AT_STOP, DELIVERED, CLOSED, ABORTED. Default PLANNED."
      - name: closed_at
        type: datetime
        source: system
        description: "ISO 8601 UTC timestamp when status transitioned to CLOSED."
        constraints: "Set by system on CLOSE; null otherwise."

  - name: TaskStop
    parent: TransportTask
    common_fields: true
    fields:
      - name: task_id
        type: string
        source: system
        description: "FK to parent TransportTask."
        constraints: "Immutable after creation."
      - name: sequence
        type: integer
        source: input
        description: "1-based ordering of this stop within the task route. Origin = 1; final destination = max."
        constraints: "Integer, >= 1. Unique within task."
      - name: location_label
        type: string
        source: input
        description: "Stop facility name / address label."
        constraints: "Non-empty, length 1..200."
      - name: planned_arrival_at
        type: datetime
        source: input
        description: "ISO 8601 UTC planned arrival at this stop."
        constraints: "ISO 8601 UTC. Must be > preceding stop's planned_arrival_at."
      - name: actual_arrival_at
        type: datetime
        source: system
        description: "Clock-stamped arrival when AT_STOP transition fires on parent task."
        constraints: "Null until arrived."
      - name: status
        type: enum
        source: computed
        description: "Per-stop progression."
        constraints: "Enum: PENDING, ARRIVED, HANDED_OVER, SKIPPED. Default PENDING."
      - name: handover_required
        type: boolean
        source: input
        description: "Whether a HandoverRecord MUST exist before this stop can advance to HANDED_OVER."
        default: true

  - name: HandoverRecord
    parent: TaskStop
    common_fields: false
    fields:
      - name: stop_id
        type: string
        source: system
        description: "FK to TaskStop."
        constraints: "Immutable. Unique (at most one HandoverRecord per stop)."
      - name: task_id
        type: string
        source: system
        description: "Denormalized FK to parent TransportTask for cross-aggregate lookup."
        constraints: "Must match parent TaskStop.task_id."
      - name: from_party_id
        type: string
        source: input
        description: "Role principal id of the custodian releasing the cargo at this stop."
        constraints: "Must reference an existing Shipper, Carrier, Driver, or Consignee principal."
      - name: to_party_id
        type: string
        source: input
        description: "Role principal id of the custodian receiving the cargo at this stop."
        constraints: "Must reference an existing Shipper, Carrier, Driver, or Consignee principal."
      - name: temperature_at_handover_celsius
        type: number
        source: input
        description: "Cargo-box temperature reading attested at the moment of handover."
        constraints: "Number, two decimals, -80.0..80.0."
      - name: quantity_attested
        type: integer
        source: input
        description: "Cargo units physically counted and accepted at handover."
        constraints: "Integer, >= 0, <= parent TransportTask.cargo_quantity."
      - name: photo_evidence_ref
        type: string
        source: input
        description: "Opaque reference to attached photographic evidence."
        constraints: "Non-empty, length 1..255."
      - name: handed_over_at
        type: datetime
        source: system
        description: "Clock-stamped ISO 8601 UTC timestamp of this handover."

  - name: TemperatureReading
    parent: null
    common_fields: false
    fields:
      - name: task_id
        type: string
        source: input
        description: "FK to TransportTask the reading belongs to."
        constraints: "Must reference an existing TransportTask in {DISPATCHED, IN_TRANSIT, AT_STOP}."
      - name: sensor_id
        type: string
        source: input
        description: "Identifier of the sensor that produced the reading (vehicle compartment or cargo-box)."
        constraints: "Non-empty, length 1..64."
      - name: sensor_kind
        type: enum
        source: input
        description: "Which physical placement produced this sample."
        constraints: "Enum: COMPARTMENT, CARGO_BOX."
      - name: temperature_celsius
        type: number
        source: input
        description: "Recorded temperature in Celsius."
        constraints: "Number, two decimals, -80.0..80.0."
      - name: gps_lat
        type: number
        source: input
        description: "WGS84 latitude at moment of reading."
        constraints: "Number, four decimals, -90.0..90.0."
      - name: gps_lng
        type: number
        source: input
        description: "WGS84 longitude at moment of reading."
        constraints: "Number, four decimals, -180.0..180.0."
      - name: captured_at
        type: datetime
        source: input
        description: "ISO 8601 UTC timestamp the sensor produced this sample."
        constraints: "ISO 8601 UTC, must satisfy: planned_start_at <= captured_at <= current clock."
      - name: idempotency_key
        type: string
        source: input
        description: "External-system-supplied dedup key (IoT device guarantees uniqueness per sample)."
        constraints: "Non-empty, length 1..128. Unique per task_id."
      - name: validity
        type: enum
        source: computed
        description: "Server's data-validity verdict assigned at ingest."
        constraints: "Enum: VALID, INVALID_OUT_OF_WINDOW, INVALID_SCHEMA, ARCHIVED."
      - name: violation
        type: enum
        source: computed
        description: "Threshold verdict relative to task temp_min / temp_max."
        constraints: "Enum: WITHIN, BELOW_MIN, ABOVE_MAX. Computed at ingest."

  - name: Alert
    parent: null
    common_fields: true
    fields:
      - name: task_id
        type: string
        source: system
        description: "FK to TransportTask the alert is opened on."
        constraints: "Immutable."
      - name: opening_reading_id
        type: string
        source: system
        description: "FK to TemperatureReading whose ingestion auto-opened the alert."
        constraints: "Required at creation."
      - name: violation
        type: enum
        source: system
        description: "Inherited from the opening reading."
        constraints: "Enum: BELOW_MIN, ABOVE_MAX."
      - name: level
        type: enum
        source: computed
        description: "Severity classification derived from duration and deviation magnitude."
        constraints: "Enum: WARNING, MAJOR, CRITICAL."
      - name: duration_seconds
        type: integer
        source: computed
        description: "Total continuous seconds the violation persisted; updated until RESOLVED."
        constraints: "Integer, >= 0."
      - name: peak_deviation_celsius
        type: number
        source: computed
        description: "Max absolute distance from the breached bound across the violation window."
        constraints: "Number, two decimals, >= 0."
      - name: notified_channels
        type: array
        source: system
        description: "Channels notified for this alert: subset of {DRIVER, DISPATCH, CUSTOMER}, determined by level."
      - name: status
        type: enum
        source: computed
        description: "Lifecycle state of the alert."
        constraints: "Enum: OPEN, ACKNOWLEDGED, IN_RESPONSE, ESCALATED, RESOLVED, CLOSED. Default OPEN."
      - name: opened_at
        type: datetime
        source: system
        description: "ISO 8601 UTC timestamp the alert was opened."
      - name: resolved_at
        type: datetime
        source: system
        description: "ISO 8601 UTC timestamp the alert transitioned to RESOLVED."
        constraints: "Null until resolved."

  - name: ResponseAction
    parent: Alert
    common_fields: false
    fields:
      - name: alert_id
        type: string
        source: system
        description: "FK to parent Alert."
        constraints: "Immutable."
      - name: action_kind
        type: enum
        source: input
        description: "Mitigation action recorded."
        constraints: "Enum: VENTILATION, REFRIGERATION_ADJUSTMENT, TRANSSHIPMENT, INSPECTION."
      - name: executed_by_role
        type: enum
        source: system
        description: "Role of the actor who recorded the action."
        constraints: "Enum: DRIVER, DISPATCHER. Set from authenticated X-User-Role."
      - name: notes
        type: string
        source: input
        description: "Free-text notes."
        constraints: "Length 0..500."
      - name: executed_at
        type: datetime
        source: system
        description: "ISO 8601 UTC server timestamp."

  - name: DamageAssessment
    parent: null
    common_fields: true
    fields:
      - name: task_id
        type: string
        source: input
        description: "FK to TransportTask under assessment."
        constraints: "Must reference a TransportTask in {DELIVERED, CLOSED}."
      - name: damaged_quantity
        type: integer
        source: input
        description: "Number of cargo units classified as damaged."
        constraints: "Integer, >= 1, <= TransportTask.cargo_quantity."
      - name: damage_class
        type: enum
        source: input
        description: "Severity classification."
        constraints: "Enum: MINOR, MODERATE, TOTAL_LOSS."
      - name: salvage_pct
        type: number
        source: input
        description: "Fraction (0.00..0.99) of declared value recoverable as salvage on damaged units."
        constraints: "Number, two decimals, 0.00..0.99."
      - name: cause_primary
        type: enum
        source: input
        description: "Primary cause attribution."
        constraints: "Enum: TEMPERATURE_DEVIATION, DURATION, CARGO_SENSITIVITY, OTHER."
      - name: evidence_alert_ids
        type: array
        source: input
        description: "List of Alert ids forming the supporting evidence chain."
        constraints: "Each id must reference an Alert with status in {RESOLVED, CLOSED} and same task_id."
      - name: damage_amount_cents
        type: integer
        source: computed
        description: "Calculated damage_amount per the damage_amount_calculation rule."
        constraints: "Integer, >= 0."
      - name: variant
        type: enum
        source: input
        description: "Which calculation variant to use for damage_amount."
        constraints: "Enum: INSURED_VALUE, INVOICE_VALUE. Required field."
      - name: invoice_unit_value_cents
        type: integer
        source: input
        description: "Per-unit purchase invoice value used when variant = INVOICE_VALUE."
        constraints: "Integer, >= 0. Required when variant=INVOICE_VALUE; ignored when variant=INSURED_VALUE."
      - name: status
        type: enum
        source: computed
        description: "Assessment lifecycle."
        constraints: "Enum: DRAFT, FINALIZED. Default DRAFT."

  - name: ResponsibilityDecision
    parent: null
    common_fields: true
    fields:
      - name: task_id
        type: string
        source: input
        description: "FK to TransportTask. One decision per task."
        constraints: "Must reference a TransportTask with at least one FINALIZED DamageAssessment. Unique per task."
      - name: assessment_id
        type: string
        source: input
        description: "FK to a FINALIZED DamageAssessment on the same task."
        constraints: "Must reference a DamageAssessment with status=FINALIZED and same task_id."
      - name: shipper_pct
        type: number
        source: input
        description: "Responsibility share assigned to the shipper, 0.00..1.00."
        constraints: "Number, two decimals, 0.00..1.00."
      - name: carrier_pct
        type: number
        source: input
        description: "Responsibility share assigned to the carrier."
        constraints: "Number, two decimals, 0.00..1.00."
      - name: consignee_pct
        type: number
        source: input
        description: "Responsibility share assigned to the consignee."
        constraints: "Number, two decimals, 0.00..1.00."
      - name: attributed_quantity
        type: integer
        source: computed
        description: "Damaged-quantity attribution split across parties; sum across parties MUST equal DamageAssessment.damaged_quantity (invariant)."
        constraints: "Integer, equals DamageAssessment.damaged_quantity once FINALIZED."
      - name: split_method
        type: enum
        source: input
        description: "Variant selecting how computed splits are derived during DRAFT."
        constraints: "Enum: DURATION_WEIGHTED, SEVERITY_WEIGHTED."
      - name: status
        type: enum
        source: computed
        description: "Decision lifecycle, supporting mediation cycles."
        constraints: "Enum: DRAFT, UNDER_REVIEW, DISPUTED, MEDIATION, ACCEPTED, FINALIZED. Default DRAFT."
      - name: mediator_id
        type: string
        source: system
        description: "Compliance officer id who entered the decision into MEDIATION."
        constraints: "Set on DISPUTED->MEDIATION transition; null otherwise."
      - name: finalizing_role
        type: enum
        source: system
        description: "Role that performed ACCEPTED->FINALIZED; segregation-of-duties enforced."
        constraints: "Enum: COMPLIANCE_OFFICER. Set on FINALIZED transition."

  - name: InsuranceClaim
    parent: null
    common_fields: true
    fields:
      - name: task_id
        type: string
        source: input
        description: "FK to TransportTask."
        constraints: "Must reference a TransportTask with FINALIZED ResponsibilityDecision."
      - name: decision_id
        type: string
        source: input
        description: "FK to ResponsibilityDecision (must be FINALIZED)."
        constraints: "Must reference a ResponsibilityDecision with status=FINALIZED, same task_id."
      - name: requested_amount_cents
        type: integer
        source: input
        description: "Initial requested claim amount from the carrier."
        constraints: "Integer, >= 0."
      - name: assessed_amount_cents
        type: integer
        source: input
        description: "Insurer's per-line assessed amount (sum of per-line rounded amounts)."
        constraints: "Integer, >= 0. Required at ASSESSMENT transition."
      - name: payout_amount_cents
        type: integer
        source: computed
        description: "Final amount paid to claimant; equals assessed_amount_cents minus any subrogation_offset_cents."
        constraints: "Integer, >= 0."
      - name: subrogation_recovered_cents
        type: integer
        source: input
        description: "Amount the insurer recovered from third parties post-payout."
        constraints: "Integer, >= 0. Set during SUBROGATION transition."
      - name: status
        type: enum
        source: computed
        description: "Claim lifecycle."
        constraints: "Enum: REPORTED, EVIDENCE_PREP, ASSESSMENT, NEGOTIATING, REJECTED, PAID_OUT, SUBROGATION, CLOSED. Default REPORTED."

  - name: ComplianceReport
    parent: null
    common_fields: true
    fields:
      - name: regulatory_domain
        type: enum
        source: input
        description: "Which regulatory regime this report covers."
        constraints: "Enum: FOOD, PHARMACEUTICAL, BIOLOGICAL."
      - name: period_start
        type: datetime
        source: input
        description: "ISO 8601 UTC start of reporting period, inclusive."
        constraints: "ISO 8601 UTC."
      - name: period_end
        type: datetime
        source: input
        description: "ISO 8601 UTC end of reporting period, exclusive."
        constraints: "ISO 8601 UTC, > period_start."
      - name: task_count
        type: integer
        source: computed
        description: "Number of TransportTasks of matching cargo_type with planned_start_at in [period_start, period_end)."
        constraints: "Integer, >= 0."
      - name: alert_count
        type: integer
        source: computed
        description: "Number of Alerts opened within the period for matching tasks."
        constraints: "Integer, >= 0."
      - name: critical_alert_count
        type: integer
        source: computed
        description: "Number of Alerts with level=CRITICAL within the period."
        constraints: "Integer, >= 0."
      - name: status
        type: enum
        source: computed
        description: "Report lifecycle."
        constraints: "Enum: DRAFT, GENERATED, SUBMITTED, ACKNOWLEDGED. Default DRAFT."

  - name: AuditLogEntry
    parent: null
    common_fields: false
    fields:
      - name: subject_type
        type: enum
        source: system
        description: "Which entity this entry refers to (polymorphic subject)."
        constraints: "Enum: ALERT, RESPONSIBILITY_DECISION."
      - name: subject_id
        type: string
        source: system
        description: "Id of the subject entity."
      - name: action
        type: enum
        source: system
        description: "Lifecycle action recorded."
        constraints: "Enum: OPENED, ACKNOWLEDGED, RESPONSE_RECORDED, ESCALATED, RESOLVED, CLOSED, DRAFTED, UNDER_REVIEW, DISPUTED, MEDIATED, ACCEPTED, FINALIZED."
      - name: actor_role
        type: enum
        source: system
        description: "X-User-Role of the actor; system for automatic transitions."
        constraints: "Enum: SYSTEM, DRIVER, DISPATCHER, SHIPPER, CONSIGNEE, COMPLIANCE_OFFICER, INSURANCE_ADJUSTER."
      - name: actor_id
        type: string
        source: system
        description: "X-User-ID of the actor; literal 'system' when actor_role=SYSTEM."
      - name: occurred_at
        type: datetime
        source: system
        description: "ISO 8601 UTC clock timestamp of the action."

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:

  - entity: TransportTask
    initial_state: PLANNED
    terminal_states: [CLOSED, ABORTED]
    transitions:
      - from: PLANNED
        to: DISPATCHED
        trigger: "POST /transport-tasks/{id}/dispatch"
        actor: DISPATCHER
        preconditions:
          - "vehicle_id is non-null and refers to a Vehicle with status=AVAILABLE"
          - "driver_id is non-null and refers to a Driver with status=OFF_DUTY"
          - "Vehicle has no overlapping TransportTask assignment (see resource_temporal_overlap rule on Vehicle)"
          - "Driver rolling 24h driving minutes would not exceed max_daily_minutes (see hours-of-service overlap rule)"
          - "At least 2 TaskStops exist on this task (origin + at least one destination)"
        side_effects:
          - "Vehicle.status := IN_USE"
          - "Driver.status := ON_DUTY"
          - "TransportTask.updated_at refreshed"
      - from: DISPATCHED
        to: IN_TRANSIT
        trigger: "POST /transport-tasks/{id}/depart"
        actor: DRIVER
        preconditions:
          - "Current clock >= TransportTask.planned_start_at - 3600 seconds (no earlier than 1 hour before planned start)"
        side_effects:
          - "First TaskStop (sequence=1) advances PENDING -> ARRIVED (already at origin)"
      - from: IN_TRANSIT
        to: AT_STOP
        trigger: "POST /transport-tasks/{id}/stops/{stop_id}/arrive"
        actor: DRIVER
        preconditions:
          - "Target TaskStop.status = PENDING"
          - "Target TaskStop.sequence is the lowest PENDING sequence on this task"
        side_effects:
          - "TaskStop.actual_arrival_at := current clock"
          - "TaskStop.status := ARRIVED"
      - from: AT_STOP
        to: IN_TRANSIT
        trigger: "POST /transport-tasks/{id}/stops/{stop_id}/depart"
        actor: DRIVER
        preconditions:
          - "TaskStop.status = HANDED_OVER or (TaskStop.handover_required = false and status = ARRIVED)"
          - "There exists at least one TaskStop with status = PENDING on this task"
        side_effects: []
      - from: AT_STOP
        to: DELIVERED
        trigger: "Automatic, on TaskStop transition ARRIVED->HANDED_OVER when the stop is the final (max sequence)"
        actor: system
        preconditions:
          - "Final TaskStop.status just transitioned to HANDED_OVER"
          - "All other TaskStops have status in {HANDED_OVER, SKIPPED}"
        side_effects:
          - "Driver.status := OFF_DUTY"
          - "Vehicle.status := AVAILABLE"
      - from: DELIVERED
        to: CLOSED
        trigger: "POST /transport-tasks/{id}/close"
        actor: CARRIER
        preconditions:
          - "No Alert on this task has status in {OPEN, ACKNOWLEDGED, IN_RESPONSE, ESCALATED}"
        side_effects:
          - "TransportTask.closed_at := current clock"
      - from: PLANNED
        to: ABORTED
        trigger: "POST /transport-tasks/{id}/abort"
        actor: DISPATCHER
        preconditions: []
        side_effects: []
      - from: DISPATCHED
        to: ABORTED
        trigger: "POST /transport-tasks/{id}/abort"
        actor: DISPATCHER
        preconditions: []
        side_effects:
          - "Vehicle.status := AVAILABLE"
          - "Driver.status := OFF_DUTY"
      - from: IN_TRANSIT
        to: ABORTED
        trigger: "POST /transport-tasks/{id}/abort"
        actor: DISPATCHER
        preconditions: []
        side_effects:
          - "Vehicle.status := AVAILABLE"
          - "Driver.status := OFF_DUTY"

  - entity: TaskStop
    initial_state: PENDING
    terminal_states: [HANDED_OVER, SKIPPED]
    transitions:
      - from: PENDING
        to: ARRIVED
        trigger: "Parent task transitions IN_TRANSIT->AT_STOP via /arrive"
        actor: DRIVER
        preconditions: []
        side_effects: []
      - from: ARRIVED
        to: HANDED_OVER
        trigger: "POST /transport-tasks/{id}/stops/{stop_id}/handovers (creates HandoverRecord)"
        actor: DRIVER
        preconditions:
          - "TaskStop.handover_required = true => HandoverRecord must be supplied in same request"
          - "Parent TransportTask.status = AT_STOP"
        side_effects:
          - "If this is the final-sequence stop AND all other stops are in {HANDED_OVER, SKIPPED}: parent TransportTask transitions AT_STOP -> DELIVERED (cascade depth 2)"
      - from: PENDING
        to: SKIPPED
        trigger: "POST /transport-tasks/{id}/stops/{stop_id}/skip"
        actor: DISPATCHER
        preconditions:
          - "TaskStop.handover_required = false"

  - entity: Alert
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: (none)
        to: OPEN
        trigger: "Automatic on TemperatureReading ingest when reading.violation != WITHIN and reading.validity = VALID and no prior unresolved Alert exists for this task with same violation"
        actor: system
        preconditions:
          - "TemperatureReading.validity = VALID"
          - "TemperatureReading.violation in {BELOW_MIN, ABOVE_MAX}"
          - "No existing Alert on this task with same violation and status not in {RESOLVED, CLOSED}"
        side_effects:
          - "Alert.opening_reading_id := the ingested reading's id"
          - "Alert.opened_at := reading.captured_at"
          - "Alert.level recomputed via alert_level_classification (starts at WARNING)"
          - "Alert.notified_channels populated per notification_routing rule"
          - "AuditLogEntry written: subject_type=ALERT, action=OPENED, actor_role=SYSTEM"
      - from: OPEN
        to: ACKNOWLEDGED
        trigger: "POST /alerts/{id}/acknowledge"
        actor: DRIVER or DISPATCHER
        preconditions:
          - "TransportTask.status in {DISPATCHED, IN_TRANSIT, AT_STOP}"
        side_effects:
          - "AuditLogEntry written"
      - from: ACKNOWLEDGED
        to: IN_RESPONSE
        trigger: "POST /alerts/{id}/responses (records first ResponseAction)"
        actor: DRIVER or DISPATCHER
        preconditions: []
        side_effects:
          - "ResponseAction record created"
          - "AuditLogEntry written"
      - from: IN_RESPONSE
        to: RESOLVED
        trigger: "POST /alerts/{id}/resolve"
        actor: DISPATCHER
        preconditions:
          - "TransportTask.status in {IN_TRANSIT, AT_STOP, DELIVERED} (NOT CLOSED or ABORTED) — cross-entity dependency"
          - "At least one ResponseAction exists on this alert"
        side_effects:
          - "Alert.resolved_at := current clock"
          - "Alert.duration_seconds := resolved_at - opened_at"
          - "Alert.level recomputed (final classification)"
          - "AuditLogEntry written"
      - from: IN_RESPONSE
        to: ESCALATED
        trigger: "POST /alerts/{id}/escalate"
        actor: DISPATCHER
        preconditions: []
        side_effects:
          - "Alert.notified_channels expanded to include CUSTOMER"
          - "AuditLogEntry written"
      - from: ESCALATED
        to: IN_RESPONSE
        trigger: "POST /alerts/{id}/responses (recording a new ResponseAction after escalation; cycle back)"
        actor: DRIVER or DISPATCHER
        preconditions: []
        side_effects:
          - "ResponseAction record created"
          - "AuditLogEntry written"
      - from: ESCALATED
        to: RESOLVED
        trigger: "POST /alerts/{id}/resolve"
        actor: DISPATCHER
        preconditions:
          - "TransportTask.status in {IN_TRANSIT, AT_STOP, DELIVERED}"
          - "At least one ResponseAction exists on this alert"
        side_effects:
          - "Alert.resolved_at := current clock"
          - "AuditLogEntry written"
      - from: RESOLVED
        to: CLOSED
        trigger: "Automatic when parent TransportTask transitions DELIVERED->CLOSED"
        actor: system
        preconditions: []
        side_effects:
          - "AuditLogEntry written"

  - entity: ResponsibilityDecision
    initial_state: DRAFT
    terminal_states: [FINALIZED]
    transitions:
      - from: (none)
        to: DRAFT
        trigger: "POST /responsibility-decisions"
        actor: COMPLIANCE_OFFICER
        preconditions:
          - "Referenced DamageAssessment.status = FINALIZED"
          - "Referenced TransportTask has no other ResponsibilityDecision (unique)"
          - "shipper_pct + carrier_pct + consignee_pct == 1.00 (exact)"
        side_effects:
          - "AuditLogEntry written: action=DRAFTED"
      - from: DRAFT
        to: UNDER_REVIEW
        trigger: "POST /responsibility-decisions/{id}/submit"
        actor: COMPLIANCE_OFFICER
        preconditions: []
        side_effects:
          - "AuditLogEntry written: action=UNDER_REVIEW"
      - from: UNDER_REVIEW
        to: ACCEPTED
        trigger: "POST /responsibility-decisions/{id}/accept"
        actor: SHIPPER or CARRIER or CONSIGNEE
        preconditions:
          - "Each of the three parties (shipper, carrier, consignee) has called /accept (server tracks acceptance per actor_id)"
        side_effects:
          - "AuditLogEntry written: action=ACCEPTED"
      - from: UNDER_REVIEW
        to: DISPUTED
        trigger: "POST /responsibility-decisions/{id}/dispute"
        actor: SHIPPER or CARRIER or CONSIGNEE
        preconditions: []
        side_effects:
          - "AuditLogEntry written: action=DISPUTED"
      - from: DISPUTED
        to: MEDIATION
        trigger: "POST /responsibility-decisions/{id}/mediate"
        actor: COMPLIANCE_OFFICER
        preconditions: []
        side_effects:
          - "ResponsibilityDecision.mediator_id := X-User-ID"
          - "AuditLogEntry written: action=MEDIATED"
      - from: MEDIATION
        to: DRAFT
        trigger: "PATCH /responsibility-decisions/{id} (cycle back: revise splits)"
        actor: COMPLIANCE_OFFICER
        preconditions:
          - "Revised shipper_pct + carrier_pct + consignee_pct == 1.00"
        side_effects:
          - "AuditLogEntry written: action=DRAFTED"
      - from: ACCEPTED
        to: FINALIZED
        trigger: "POST /responsibility-decisions/{id}/finalize"
        actor: COMPLIANCE_OFFICER
        preconditions:
          - "Segregation of duties: X-User-ID of finalizer MUST NOT equal the carrier_id, shipper_id, or consignee_id on TransportTask"
        side_effects:
          - "ResponsibilityDecision.finalizing_role := COMPLIANCE_OFFICER"
          - "ResponsibilityDecision.attributed_quantity := DamageAssessment.damaged_quantity"
          - "AuditLogEntry written: action=FINALIZED"
          - "Cascade: TransportTask becomes eligible for InsuranceClaim REPORTED"

  - entity: InsuranceClaim
    initial_state: REPORTED
    terminal_states: [CLOSED, REJECTED]
    transitions:
      - from: (none)
        to: REPORTED
        trigger: "POST /insurance-claims"
        actor: CARRIER
        preconditions:
          - "Referenced ResponsibilityDecision.status = FINALIZED"
          - "requested_amount_cents <= Vehicle.insured_cap_cents on the task's vehicle"
        side_effects: []
      - from: REPORTED
        to: EVIDENCE_PREP
        trigger: "POST /insurance-claims/{id}/prepare-evidence"
        actor: CARRIER
        preconditions: []
        side_effects: []
      - from: EVIDENCE_PREP
        to: ASSESSMENT
        trigger: "POST /insurance-claims/{id}/assess"
        actor: INSURANCE_ADJUSTER
        preconditions:
          - "assessed_amount_cents in request body, integer, 0..requested_amount_cents"
        side_effects: []
      - from: ASSESSMENT
        to: NEGOTIATING
        trigger: "POST /insurance-claims/{id}/negotiate"
        actor: CARRIER or INSURANCE_ADJUSTER
        preconditions: []
        side_effects: []
      - from: NEGOTIATING
        to: ASSESSMENT
        trigger: "POST /insurance-claims/{id}/assess (revised assessment after negotiation; cycle)"
        actor: INSURANCE_ADJUSTER
        preconditions: []
        side_effects: []
      - from: ASSESSMENT
        to: PAID_OUT
        trigger: "POST /insurance-claims/{id}/pay"
        actor: INSURANCE_ADJUSTER
        preconditions:
          - "assessed_amount_cents > 0"
        side_effects:
          - "InsuranceClaim.payout_amount_cents := assessed_amount_cents"
      - from: ASSESSMENT
        to: REJECTED
        trigger: "POST /insurance-claims/{id}/reject"
        actor: INSURANCE_ADJUSTER
        preconditions: []
        side_effects:
          - "InsuranceClaim.payout_amount_cents := 0"
      - from: PAID_OUT
        to: SUBROGATION
        trigger: "POST /insurance-claims/{id}/subrogate"
        actor: INSURANCE_ADJUSTER
        preconditions:
          - "subrogation_recovered_cents in request body, integer, 0..payout_amount_cents"
        side_effects:
          - "InsuranceClaim.subrogation_recovered_cents := body value"
          - "InsuranceClaim.payout_amount_cents := previous payout_amount_cents - subrogation_recovered_cents (compensating invariant)"
      - from: SUBROGATION
        to: CLOSED
        trigger: "POST /insurance-claims/{id}/close"
        actor: INSURANCE_ADJUSTER
        preconditions: []
        side_effects: []
      - from: PAID_OUT
        to: CLOSED
        trigger: "POST /insurance-claims/{id}/close (no subrogation)"
        actor: INSURANCE_ADJUSTER
        preconditions: []
        side_effects: []

  - entity: ComplianceReport
    initial_state: DRAFT
    terminal_states: [ACKNOWLEDGED]
    transitions:
      - from: DRAFT
        to: GENERATED
        trigger: "POST /compliance-reports/{id}/generate"
        actor: COMPLIANCE_OFFICER
        preconditions: []
        side_effects:
          - "ComplianceReport.task_count, alert_count, critical_alert_count := computed via period_aggregation rule"
      - from: GENERATED
        to: SUBMITTED
        trigger: "POST /compliance-reports/{id}/submit"
        actor: COMPLIANCE_OFFICER
        preconditions: []
        side_effects: []
      - from: SUBMITTED
        to: ACKNOWLEDGED
        trigger: "POST /compliance-reports/{id}/acknowledge"
        actor: COMPLIANCE_OFFICER
        preconditions: []
        side_effects: []

  - entity: DamageAssessment
    initial_state: DRAFT
    terminal_states: [FINALIZED]
    transitions:
      - from: DRAFT
        to: FINALIZED
        trigger: "POST /damage-assessments/{id}/finalize"
        actor: COMPLIANCE_OFFICER
        preconditions:
          - "damage_amount_cents has been computed (non-null)"
          - "evidence_alert_ids is non-empty (size >= 1)"
        side_effects:
          - "Lock: subsequent PATCH to mutable fields rejected with ERR_INVALID_STATE"
          - "Cascade: ResponsibilityDecision may now be DRAFTED for the task"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - scenario: "Two dispatch requests assign the same Vehicle to overlapping TransportTasks"
    guarantee: "Only the first writer succeeds; the second is rejected. First-writer-wins on Vehicle status transition AVAILABLE->IN_USE."
    error_id: ERR_VEHICLE_OVERLAP
    http_status: 409
    serialization: "First-writer-wins on Vehicle.status transition; loser sees Vehicle.status=IN_USE on re-read."

  - scenario: "Driver concurrent dispatch where the second assignment would push rolling 24h driving minutes over max_daily_minutes"
    guarantee: "Only the first writer succeeds; the second is rejected per hours-of-service overlap rule."
    error_id: ERR_DRIVER_HOURS_EXCEEDED
    http_status: 409
    serialization: "First-writer-wins on Driver hours accumulator."

  - scenario: "Two IoT devices retry the same TemperatureReading ingest with the same idempotency_key for the same task"
    guarantee: "Exactly one TemperatureReading row is created; subsequent retries return the first row (idempotent replay) and do not re-open or duplicate Alerts."
    error_id: ERR_IDEMPOTENT_REPLAY
    http_status: 200
    serialization: "Idempotency: (task_id, idempotency_key) is unique; duplicate POST returns the existing reading verbatim with HTTP 200."

  - scenario: "Acknowledge and resolve on the same alert race"
    guarantee: "Exactly one operation wins; loser receives ERR_INVALID_STATE because the alert's status has advanced past the expected from-state."
    error_id: ERR_INVALID_STATE
    http_status: 409
    serialization: "First-writer-wins on Alert.status."

  - scenario: "Two compliance officers concurrently FINALIZE the same ResponsibilityDecision"
    guarantee: "First writer succeeds; second sees the decision already FINALIZED."
    error_id: ERR_INVALID_STATE
    http_status: 409
    serialization: "First-writer-wins on ResponsibilityDecision.status."

  - scenario: "Two assessors concurrently /pay an InsuranceClaim that is also being /reject"
    guarantee: "Exactly one terminal transition succeeds."
    error_id: ERR_INVALID_STATE
    http_status: 409
    serialization: "First-writer-wins on InsuranceClaim.status."

  - scenario: "Two TaskStop /handovers race for the final-sequence stop, both attempting to cascade parent task to DELIVERED"
    guarantee: "Exactly one handover succeeds (TaskStop.HandoverRecord is unique per stop); the other is rejected. The parent cascade fires exactly once."
    error_id: ERR_HANDOVER_ALREADY_EXISTS
    http_status: 409
    serialization: "Unique constraint on HandoverRecord.stop_id (one handover per stop)."

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:

  - name: temperature_reading_validity
    trigger: "On POST /transport-tasks/{id}/temperature-readings (sensor ingestion)"
    algorithm: threshold
    formula: |
      # Server pins validity at ingest time:
      if (captured_at < TransportTask.planned_start_at) or (captured_at > current_clock):
          validity := INVALID_OUT_OF_WINDOW
      elif (sensor_kind not in {COMPARTMENT, CARGO_BOX}) or
           (gps_lat out of [-90, 90]) or (gps_lng out of [-180, 180]) or
           (temperature_celsius out of [-80.0, 80.0]):
          validity := INVALID_SCHEMA
      else:
          validity := VALID
      # Threshold classification (only meaningful when validity = VALID):
      if temperature_celsius < TransportTask.temp_min_celsius:
          violation := BELOW_MIN
      elif temperature_celsius > TransportTask.temp_max_celsius:
          violation := ABOVE_MAX
      else:
          violation := WITHIN
      # Boundary precision: equality with temp_min or temp_max => WITHIN (inclusive bounds).
    input_set: "The single ingested TemperatureReading plus parent TransportTask bounds."
    constants:
      MIN_TEMP_FLOOR_C: -80.0
      MAX_TEMP_CEILING_C: 80.0
    precision: "Temperature 2 decimal places, round_half_up. GPS 4 decimal places."

  - name: alert_level_classification
    trigger: "On Alert OPEN (initial), on every subsequent valid TemperatureReading for the same task while alert is unresolved, and on Alert RESOLVED (final classification)."
    algorithm: threshold
    formula: |
      # Inputs: alert.duration_seconds, alert.peak_deviation_celsius
      # peak_deviation_celsius is max over all readings since alert.opened_at of:
      #   max(0, temp_min_celsius - reading.temperature_celsius, reading.temperature_celsius - temp_max_celsius)
      if duration_seconds >= 1800 OR peak_deviation_celsius >= 5.00:
          level := CRITICAL
      elif duration_seconds >= 600 OR peak_deviation_celsius >= 2.00:
          level := MAJOR
      else:
          level := WARNING
      # Boundary precision: thresholds are inclusive (>= ), strict < on the lower side.
    input_set: "All VALID TemperatureReadings on the same task with captured_at in [alert.opened_at, alert.resolved_at OR current_clock]"
    constants:
      CRITICAL_DURATION_SECONDS: 1800
      CRITICAL_PEAK_DEVIATION_C: 5.00
      MAJOR_DURATION_SECONDS: 600
      MAJOR_PEAK_DEVIATION_C: 2.00
    precision: "Deviation 2 decimal places, round_half_up. Duration integer seconds."

  - name: notification_routing
    trigger: "On Alert.level recomputation (open or escalate)"
    algorithm: threshold
    formula: |
      # Channel set is monotonically expanded; once added, a channel stays in notified_channels.
      if level == WARNING:
          channels := {DRIVER}
      elif level == MAJOR:
          channels := {DRIVER, DISPATCH}
      elif level == CRITICAL:
          channels := {DRIVER, DISPATCH, CUSTOMER}
      Alert.notified_channels := union(Alert.notified_channels, channels)
    input_set: "Single Alert"
    precision: "n/a"

  - name: damage_amount_calculation
    trigger: "On DamageAssessment creation and on PATCH of mutable fields prior to FINALIZED"
    algorithm: weighted_scoring
    formula: |
      # Damage factor lookup table (by damage_class):
      DAMAGE_FACTOR := { MINOR: 0.30, MODERATE: 0.60, TOTAL_LOSS: 1.00 }
      # Unit value selection (dual variant — same inputs, two algorithms):
      if variant == INSURED_VALUE:
          unit_value_cents := floor(TransportTask.cargo_value_cents / TransportTask.cargo_quantity)
      else:  # variant == INVOICE_VALUE
          unit_value_cents := DamageAssessment.invoice_unit_value_cents
      # Per-unit damage (round half up to 1 cent — nested rounding mode (b)):
      per_unit_damage_cents := round_half_up(unit_value_cents * DAMAGE_FACTOR[damage_class] * (1.0 - salvage_pct))
      # Sum across damaged units (per-line then sum — pinned order):
      raw_total_cents := per_unit_damage_cents * damaged_quantity
      # Vehicle-level insurance cap:
      damage_amount_cents := min(raw_total_cents, Vehicle.insured_cap_cents)
      # Boundary precision: when raw_total_cents == insured_cap_cents exactly, NO cap-clipping error is raised;
      # when raw_total_cents > insured_cap_cents, damage_amount_cents = insured_cap_cents but the original
      # raw_total_cents is NOT persisted — only the capped value.
    input_set: "Single DamageAssessment, its TransportTask, the task's Vehicle"
    constants:
      DAMAGE_FACTOR_MINOR: 0.30
      DAMAGE_FACTOR_MODERATE: 0.60
      DAMAGE_FACTOR_TOTAL_LOSS: 1.00
    precision: "Round half up to 1 cent. Pinned rounding order: per-unit first, then multiply by damaged_quantity, then cap."
    variants:
      - name: INSURED_VALUE
        when: "DamageAssessment.variant == INSURED_VALUE"
        difference: "unit_value = floor(cargo_value_cents / cargo_quantity); ignores invoice_unit_value_cents."
      - name: INVOICE_VALUE
        when: "DamageAssessment.variant == INVOICE_VALUE"
        difference: "unit_value = invoice_unit_value_cents (per-unit invoice price). Required input invoice_unit_value_cents must be > 0."

  - name: responsibility_split_advisory
    trigger: "On POST /responsibility-decisions (computes server-advisory splits exposed in 201 response; the input shipper_pct/carrier_pct/consignee_pct are accepted as-is for storage, but the advisory split is also returned so callers can compare). On PATCH from MEDIATION (re-computed)."
    algorithm: weighted_scoring
    formula: |
      # Inputs gathered from the FINALIZED DamageAssessment and its evidence chain:
      #   evidence_alerts = alerts referenced by assessment.evidence_alert_ids
      #
      # Per-party time-in-custody is derived from HandoverRecord chain on the task:
      #   custody_segments = [(party_id, start_at, end_at), ...] partitioning task time
      #   built from successive HandoverRecord.handed_over_at boundaries.
      #
      # Custody party-role mapping:
      #   from_party_id / to_party_id may be a Shipper, Carrier (driver acting on behalf), or Consignee principal.
      #
      # For each alert in evidence_alerts:
      #   alert_duration := alert.resolved_at - alert.opened_at  (seconds)
      #   alert_peak := alert.peak_deviation_celsius
      #
      # Variant DURATION_WEIGHTED:
      #   For each party p in {SHIPPER, CARRIER, CONSIGNEE}:
      #     overlap_seconds[p] := sum over evidence_alerts of:
      #       overlap of [alert.opened_at, alert.resolved_at] with [start, end] of custody_segments belonging to p
      #     advisory_pct[p] := overlap_seconds[p] / sum_over_parties(overlap_seconds)
      #
      # Variant SEVERITY_WEIGHTED:
      #   For each evidence alert:
      #     attribute its alert_peak to the party whose custody_segment overlaps the *opened_at* moment.
      #   For each party p:
      #     party_severity[p] := sum of attributed alert_peak values
      #     advisory_pct[p] := party_severity[p] / sum_over_parties(party_severity)
      #
      # Both variants must produce three percentages summing to 1.00 exactly (round_half_up to 2 decimals,
      # remainder cents allocated to the party with the largest pre-round share; ties broken alphabetically:
      # CARRIER > CONSIGNEE > SHIPPER).
      #
      # The advisory is returned in the response under "advisory_split" and stored on the decision as an
      # auxiliary field; the stored shipper_pct/carrier_pct/consignee_pct fields reflect the *negotiated*
      # decision and may differ from advisory.
    input_set: "FINALIZED DamageAssessment, its evidence_alert_ids, HandoverRecord chain on the same task."
    precision: "Round half up to 2 decimals (0.01 granularity). Tie-break order: CARRIER > CONSIGNEE > SHIPPER."
    variants:
      - name: DURATION_WEIGHTED
        when: "split_method == DURATION_WEIGHTED"
        difference: "Weights computed from time-in-violation per custodian (overlap_seconds)."
      - name: SEVERITY_WEIGHTED
        when: "split_method == SEVERITY_WEIGHTED"
        difference: "Weights computed from peak deviation attributed to the custodian holding cargo at alert open moment."

  - name: insurance_claim_payout
    trigger: "On InsuranceClaim ASSESSMENT->PAID_OUT and on PAID_OUT->SUBROGATION"
    algorithm: aggregation
    formula: |
      # On ASSESSMENT->PAID_OUT:
      payout_amount_cents := assessed_amount_cents
      # On PAID_OUT->SUBROGATION:
      payout_amount_cents := max(0, previous payout_amount_cents - subrogation_recovered_cents)
      # Conserved-quantity invariant (compensating_invariant):
      #   net_insurer_outflow_cents = payout_amount_cents
      #                              = assessed_amount_cents - subrogation_recovered_cents (after subrogation)
      # The pair (PAY, SUBROGATE) leaves the named global quantity
      #   net_insurer_outflow_cents
      # equal exactly to: assessed_amount_cents - subrogation_recovered_cents.
    input_set: "Single InsuranceClaim"
    precision: "Integer cents."

  - name: driver_rolling_24h_minutes
    trigger: "On POST /transport-tasks/{id}/dispatch (precondition check, no persisted side-effect)"
    algorithm: interval_merge
    formula: |
      # Treat each TransportTask assigned to a driver as a closed interval
      #   [planned_start_at, planned_end_at]
      # of duration_minutes = ceil((planned_end_at - planned_start_at) / 60).
      #
      # Compute, over any 24-hour rolling window [t - 86400s, t]:
      #   driver_minutes(t) := sum over (driver-assigned tasks with status in {DISPATCHED, IN_TRANSIT, AT_STOP})
      #                         of overlap_minutes(task, window)
      # where overlap_minutes is the minute-count of the intersection of [planned_start_at, planned_end_at]
      # with the window.
      #
      # A new dispatch is rejected if there EXISTS a 24h window anchored at any of:
      #   {new_task.planned_start_at, new_task.planned_end_at, any existing task boundary}
      # such that driver_minutes(window) + overlap_minutes(new_task, window) > driver.max_daily_minutes.
      #
      # Boundary precision: strict > (driver_minutes == max_daily_minutes is allowed).
    input_set: "Driver's existing TransportTask assignments with status in {DISPATCHED, IN_TRANSIT, AT_STOP}, plus the candidate task."
    precision: "Minutes (ceil seconds/60). Rolling window inclusive on both ends."

  - name: vehicle_overlap_check
    trigger: "On POST /transport-tasks/{id}/dispatch (precondition check)"
    algorithm: interval_merge
    formula: |
      # Each assigned TransportTask occupies the half-open interval
      #   [planned_start_at, planned_end_at)
      # on its Vehicle.
      #
      # Reject if there exists ANY existing task on the same vehicle (status in
      # {DISPATCHED, IN_TRANSIT, AT_STOP}) whose interval intersects the new task's interval,
      # treating both as half-open [start, end).
      #
      # Adjacency (existing.end == new.start exactly) is ALLOWED (half-open semantics).
      # Boundary precision: strict overlap. Equality at endpoints does not trigger.
    input_set: "Vehicle's existing TransportTask assignments and the candidate."
    precision: "Datetime exact equality on boundaries."

  - name: compliance_period_aggregation
    trigger: "On POST /compliance-reports/{id}/generate"
    algorithm: aggregation
    formula: |
      # period := [period_start, period_end)  (half-open by convention)
      tasks_in_period := TransportTasks where cargo_type == ComplianceReport.regulatory_domain
                                          AND planned_start_at >= period_start
                                          AND planned_start_at <  period_end
      task_count := count(tasks_in_period)
      alerts_in_period := Alerts where opened_at >= period_start AND opened_at < period_end
                                  AND alert.task_id IN tasks_in_period
      alert_count := count(alerts_in_period)
      critical_alert_count := count(alerts_in_period where level == CRITICAL)
    input_set: "All TransportTasks of matching cargo_type and all Alerts with opened_at in [period_start, period_end)"
    precision: "Integer counts."

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers are present and non-empty"
    error_id: ERR_AUTH_MISSING
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "X-User-Role is a recognized role (SHIPPER, CARRIER, DRIVER, CONSIGNEE, DISPATCHER, COMPLIANCE_OFFICER, INSURANCE_ADJUSTER) and is permitted on this endpoint per §1.7"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "Each id in the URL path (transport-task id, stop id, alert id, assessment id, decision id, claim id, report id, vehicle id, driver id) refers to an existing resource; validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all path-id-bearing endpoints"

  - priority: 4
    category: existence
    check: "All foreign-key ids in the request body (vehicle_id, driver_id, task_id, assessment_id, decision_id, evidence_alert_ids[*]) refer to existing resources"
    error_id: ERR_REFERENCE_NOT_FOUND
    http_status: 404
    applies_to: "endpoints with body-FKs"

  - priority: 5
    category: state
    check: "Target resource is in the from-state required by the requested transition (per §1.2)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-mutating endpoints"

  - priority: 6
    category: business_safety
    check: "Segregation of duties on ResponsibilityDecision FINALIZED: X-User-ID of the finalizer MUST NOT equal TransportTask.shipper_id, TransportTask.carrier_id, or TransportTask.consignee_id (a party cannot finalize a decision involving themselves)"
    error_id: ERR_SEGREGATION_VIOLATION
    http_status: 403
    applies_to: "POST /responsibility-decisions/{id}/finalize"

  - priority: 7
    category: business_safety
    check: "Alert.resolve requires the parent TransportTask.status in {IN_TRANSIT, AT_STOP, DELIVERED} — cannot resolve an alert on a CLOSED or ABORTED task (cross-entity state dependency)"
    error_id: ERR_TASK_NOT_RESOLVABLE
    http_status: 409
    applies_to: "POST /alerts/{id}/resolve"

  - priority: 8
    category: business_safety
    check: "InsuranceClaim REPORTED requires the linked ResponsibilityDecision.status = FINALIZED (cross-entity state dependency)"
    error_id: ERR_DECISION_NOT_FINALIZED
    http_status: 409
    applies_to: "POST /insurance-claims"

  - priority: 9
    category: business_referential
    check: "DamageAssessment.evidence_alert_ids must be non-empty (size >= 1) AND every referenced Alert must belong to the same task_id AND have status in {RESOLVED, CLOSED}"
    error_id: ERR_EVIDENCE_REQUIRED
    http_status: 422
    applies_to: "POST /damage-assessments, PATCH /damage-assessments/{id}"

  - priority: 10
    category: business_referential
    check: "DamageAssessment with variant=INVOICE_VALUE requires invoice_unit_value_cents > 0; variant=INSURED_VALUE ignores it"
    error_id: ERR_INVOICE_VALUE_REQUIRED
    http_status: 422
    applies_to: "POST /damage-assessments, PATCH /damage-assessments/{id}"

  - priority: 11
    category: business_constraint
    check: "TransportTask /dispatch: vehicle has no overlapping half-open [planned_start_at, planned_end_at) with another active TransportTask on the same vehicle (see vehicle_overlap_check)"
    error_id: ERR_VEHICLE_OVERLAP
    http_status: 409
    applies_to: "POST /transport-tasks/{id}/dispatch"

  - priority: 12
    category: business_constraint
    check: "TransportTask /dispatch: driver's rolling 24h driving minutes would not exceed max_daily_minutes after assignment (see driver_rolling_24h_minutes)"
    error_id: ERR_DRIVER_HOURS_EXCEEDED
    http_status: 409
    applies_to: "POST /transport-tasks/{id}/dispatch"

  - priority: 13
    category: business_temporal
    check: "TemperatureReading.captured_at must be in [TransportTask.planned_start_at, current_clock]; out-of-window readings are persisted with validity=INVALID_OUT_OF_WINDOW (200 OK) and do NOT open alerts"
    error_id: ERR_READING_OUT_OF_WINDOW
    http_status: 422
    applies_to: "POST /transport-tasks/{id}/temperature-readings (when strict mode is requested via query strict=true)"

  - priority: 14
    category: business_constraint
    check: "ResponsibilityDecision: shipper_pct + carrier_pct + consignee_pct MUST equal 1.00 exactly (round_half_up to 2 decimals)"
    error_id: ERR_PCT_SUM_INVALID
    http_status: 422
    applies_to: "POST /responsibility-decisions, PATCH /responsibility-decisions/{id}"

  - priority: 15
    category: business_fiscal
    check: "DamageAssessment.damage_amount_cents (computed) MUST NOT exceed the task's vehicle.insured_cap_cents; if raw exceeds, the value is capped (no error). Independently, InsuranceClaim.requested_amount_cents MUST NOT exceed vehicle.insured_cap_cents (this DOES error)."
    error_id: ERR_INSURANCE_CAP_EXCEEDED
    http_status: 422
    applies_to: "POST /insurance-claims"

  - priority: 16
    category: business_referential
    check: "DamageAssessment.damaged_quantity > 0 AND damaged_quantity <= TransportTask.cargo_quantity (empty-set / zero-quantity boundary)"
    error_id: ERR_QUANTITY_INVALID
    http_status: 422
    applies_to: "POST /damage-assessments, PATCH /damage-assessments/{id}"

  - priority: 17
    category: business_fiscal
    check: "InsuranceClaim.assessed_amount_cents MUST be in [0, requested_amount_cents] at /assess; subrogation_recovered_cents MUST be in [0, payout_amount_cents] at /subrogate"
    error_id: ERR_AMOUNT_INVALID
    http_status: 422
    applies_to: "POST /insurance-claims/{id}/assess, POST /insurance-claims/{id}/subrogate"

  - priority: 18
    category: business_constraint
    check: "OCC: PATCH/PUT endpoints reject if request body.version != server.version with ERR_VERSION_CONFLICT"
    error_id: ERR_VERSION_CONFLICT
    http_status: 409
    applies_to: "PATCH /damage-assessments/{id}, PATCH /responsibility-decisions/{id}, PATCH /transport-tasks/{id}"

  - priority: 19
    category: business_referential
    check: "Schema and field-type validation: temperatures in range [-80, 80], gps in valid ranges, enum values respected, datetimes ISO 8601 UTC with millisecond precision"
    error_id: ERR_VALIDATION
    http_status: 422
    applies_to: "all"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:

  # --- Clock control (test-driving endpoint for time-gated transitions) ---
  - method: POST
    path: "/_clock/advance"
    description: "Advance the server clock by N seconds (test fixture; enables reaching time-gated states without wall-clock waits)."
    roles: [SYSTEM]
    code: 200
    input: ["seconds"]
    output: object  # { now: ISO 8601 UTC }
    side_effects:
      - "Server now := previous now + seconds. Any time-derived computations (alert duration_seconds, driver rolling-24h windows) use the advanced clock."

  - method: GET
    path: "/_clock"
    description: "Return current server clock (test fixture)."
    roles: [SYSTEM]
    code: 200
    input: []
    output: object  # { now: ISO 8601 UTC }
    side_effects: []

  # --- Vehicle ---
  - method: POST
    path: "/vehicles"
    description: "Register a vehicle."
    roles: [CARRIER]
    code: 201
    input: ["vehicle_no", "compartment_count", "insured_cap_cents"]
    output: Vehicle
    side_effects: []

  - method: GET
    path: "/vehicles/{id}"
    description: "Fetch a vehicle."
    roles: [CARRIER, DISPATCHER, COMPLIANCE_OFFICER, INSURANCE_ADJUSTER]
    code: 200
    input: []
    output: Vehicle
    side_effects: []

  - method: GET
    path: "/vehicles"
    description: "List vehicles with pagination."
    roles: [CARRIER, DISPATCHER, COMPLIANCE_OFFICER]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Vehicle[]
    side_effects: []

  # --- Driver ---
  - method: POST
    path: "/drivers"
    description: "Register a driver."
    roles: [CARRIER]
    code: 201
    input: ["license_no", "name", "max_daily_minutes?"]
    output: Driver
    side_effects: []

  - method: GET
    path: "/drivers/{id}"
    description: "Fetch a driver."
    roles: [CARRIER, DISPATCHER, COMPLIANCE_OFFICER]
    code: 200
    input: []
    output: Driver
    side_effects: []

  # --- TransportTask ---
  - method: POST
    path: "/transport-tasks"
    description: "Create a transport task in PLANNED."
    roles: [SHIPPER, DISPATCHER]
    code: 201
    input: ["cargo_type", "cargo_value_cents", "cargo_quantity", "temp_min_celsius", "temp_max_celsius", "shipper_id", "consignee_id", "carrier_id", "planned_start_at", "planned_end_at", "polling_interval_seconds?", "stops"]
    output: TransportTask  # nested TaskStops auto-created from stops[]
    side_effects:
      - "TaskStop rows created with sequence 1..N as provided"

  - method: GET
    path: "/transport-tasks/{id}"
    description: "Fetch a task with its stops."
    roles: [SHIPPER, CARRIER, DRIVER, CONSIGNEE, DISPATCHER, COMPLIANCE_OFFICER, INSURANCE_ADJUSTER]
    code: 200
    input: []
    output: TransportTask
    side_effects: []

  - method: PATCH
    path: "/transport-tasks/{id}"
    description: "Update mutable fields (vehicle_id, driver_id while PLANNED; polling_interval_seconds any time)."
    roles: [DISPATCHER]
    code: 200
    input: ["vehicle_id?", "driver_id?", "polling_interval_seconds?", "version"]
    output: TransportTask
    side_effects: []

  - method: GET
    path: "/transport-tasks"
    description: "List tasks (filter by status, cargo_type, planned_start_at range)."
    roles: [SHIPPER, CARRIER, DISPATCHER, COMPLIANCE_OFFICER]
    code: 200
    input: ["status?", "cargo_type?", "planned_start_after?", "planned_start_before?", "limit?", "offset?"]
    output: TransportTask[]
    side_effects: []

  - method: POST
    path: "/transport-tasks/{id}/dispatch"
    description: "Transition PLANNED -> DISPATCHED. Validates vehicle/driver assignment and overlap rules."
    roles: [DISPATCHER]
    code: 200
    input: []
    output: TransportTask
    side_effects:
      - "Vehicle.status := IN_USE; Driver.status := ON_DUTY"

  - method: POST
    path: "/transport-tasks/{id}/depart"
    description: "Transition DISPATCHED -> IN_TRANSIT."
    roles: [DRIVER]
    code: 200
    input: []
    output: TransportTask
    side_effects: []

  - method: POST
    path: "/transport-tasks/{id}/stops/{stop_id}/arrive"
    description: "Transition IN_TRANSIT -> AT_STOP for the lowest-sequence PENDING stop."
    roles: [DRIVER]
    code: 200
    input: []
    output: TaskStop
    side_effects: []

  - method: POST
    path: "/transport-tasks/{id}/stops/{stop_id}/depart"
    description: "Transition AT_STOP -> IN_TRANSIT (intermediate stops only)."
    roles: [DRIVER]
    code: 200
    input: []
    output: TaskStop
    side_effects: []

  - method: POST
    path: "/transport-tasks/{id}/stops/{stop_id}/handovers"
    description: "Record a HandoverRecord for a stop. Transitions stop ARRIVED -> HANDED_OVER and may cascade parent AT_STOP -> DELIVERED."
    roles: [DRIVER]
    code: 201
    input: ["from_party_id", "to_party_id", "temperature_at_handover_celsius", "quantity_attested", "photo_evidence_ref"]
    output: HandoverRecord
    side_effects:
      - "TaskStop.status := HANDED_OVER"
      - "If final stop and all others done: parent TransportTask.status := DELIVERED; Vehicle.status := AVAILABLE; Driver.status := OFF_DUTY"

  - method: POST
    path: "/transport-tasks/{id}/stops/{stop_id}/skip"
    description: "Mark a stop SKIPPED (only when handover_required = false)."
    roles: [DISPATCHER]
    code: 200
    input: []
    output: TaskStop
    side_effects: []

  - method: POST
    path: "/transport-tasks/{id}/close"
    description: "Transition DELIVERED -> CLOSED. Closes any RESOLVED alerts to CLOSED."
    roles: [CARRIER]
    code: 200
    input: []
    output: TransportTask
    side_effects:
      - "All RESOLVED Alerts on this task transition to CLOSED (cascade)"
      - "TransportTask.closed_at := now"

  - method: POST
    path: "/transport-tasks/{id}/abort"
    description: "Abort a task from any non-terminal state."
    roles: [DISPATCHER]
    code: 200
    input: ["reason"]
    output: TransportTask
    side_effects:
      - "If task was DISPATCHED/IN_TRANSIT: Vehicle.status := AVAILABLE; Driver.status := OFF_DUTY"

  # --- TemperatureReading ---
  - method: POST
    path: "/transport-tasks/{id}/temperature-readings"
    description: "Ingest a sensor reading (typically from IoT). Idempotent on (task_id, idempotency_key). Triggers alert auto-open cascade depth >=3 when threshold breached on a VALID reading and no prior unresolved alert exists for the same violation."
    roles: [SYSTEM, DISPATCHER]
    code: 201
    input: ["sensor_id", "sensor_kind", "temperature_celsius", "gps_lat", "gps_lng", "captured_at", "idempotency_key"]
    output: TemperatureReading
    side_effects:
      - "validity, violation computed"
      - "If violation != WITHIN and validity = VALID: Alert auto-opened (cascade)"
      - "If unresolved Alert exists for same violation: Alert.duration_seconds and peak_deviation_celsius recomputed, Alert.level recomputed (may upgrade), notified_channels expanded"

  - method: GET
    path: "/transport-tasks/{id}/temperature-readings"
    description: "List readings with filter."
    roles: [SHIPPER, CARRIER, DRIVER, DISPATCHER, COMPLIANCE_OFFICER, INSURANCE_ADJUSTER]
    code: 200
    input: ["validity?", "violation?", "captured_after?", "captured_before?", "limit?", "offset?"]
    output: TemperatureReading[]
    side_effects: []

  - method: POST
    path: "/transport-tasks/{id}/temperature-readings/archive"
    description: "Move all VALID readings older than the task's closed_at into validity=ARCHIVED (historical archival)."
    roles: [COMPLIANCE_OFFICER]
    code: 200
    input: []
    output: object  # { archived_count }
    side_effects:
      - "Affected TemperatureReading.validity := ARCHIVED for readings on a CLOSED task"

  # --- Alert ---
  - method: GET
    path: "/alerts/{id}"
    description: "Fetch an alert."
    roles: [SHIPPER, CARRIER, DRIVER, DISPATCHER, COMPLIANCE_OFFICER, INSURANCE_ADJUSTER, CONSIGNEE]
    code: 200
    input: []
    output: Alert
    side_effects: []

  - method: GET
    path: "/alerts"
    description: "List alerts."
    roles: [SHIPPER, CARRIER, DISPATCHER, COMPLIANCE_OFFICER, INSURANCE_ADJUSTER]
    code: 200
    input: ["task_id?", "status?", "level?", "limit?", "offset?"]
    output: Alert[]
    side_effects: []

  - method: POST
    path: "/alerts/{id}/acknowledge"
    description: "Transition OPEN -> ACKNOWLEDGED."
    roles: [DRIVER, DISPATCHER]
    code: 200
    input: []
    output: Alert
    side_effects:
      - "AuditLogEntry written"

  - method: POST
    path: "/alerts/{id}/responses"
    description: "Record a ResponseAction. Transitions ACKNOWLEDGED -> IN_RESPONSE on first response, or ESCALATED -> IN_RESPONSE on cycle-back."
    roles: [DRIVER, DISPATCHER]
    code: 201
    input: ["action_kind", "notes?"]
    output: ResponseAction
    side_effects:
      - "Alert.status transitions per state machine"
      - "AuditLogEntry written"

  - method: POST
    path: "/alerts/{id}/escalate"
    description: "Transition IN_RESPONSE -> ESCALATED, expanding notified_channels to include CUSTOMER."
    roles: [DISPATCHER]
    code: 200
    input: []
    output: Alert
    side_effects:
      - "Alert.notified_channels expanded to include CUSTOMER (idempotent on subsequent escalates)"
      - "AuditLogEntry written"

  - method: POST
    path: "/alerts/{id}/resolve"
    description: "Transition IN_RESPONSE or ESCALATED -> RESOLVED. Cross-entity precondition: parent task must not be CLOSED/ABORTED."
    roles: [DISPATCHER]
    code: 200
    input: []
    output: Alert
    side_effects:
      - "Alert.resolved_at := now; duration_seconds finalized; level recomputed"
      - "AuditLogEntry written"

  # --- DamageAssessment ---
  - method: POST
    path: "/damage-assessments"
    description: "Create a damage assessment in DRAFT. Computes damage_amount_cents via dual-variant rule."
    roles: [COMPLIANCE_OFFICER]
    code: 201
    input: ["task_id", "damaged_quantity", "damage_class", "salvage_pct", "cause_primary", "evidence_alert_ids", "variant", "invoice_unit_value_cents?"]
    output: DamageAssessment
    side_effects:
      - "damage_amount_cents computed and persisted"

  - method: PATCH
    path: "/damage-assessments/{id}"
    description: "Update DRAFT-only mutable fields; recomputes damage_amount_cents."
    roles: [COMPLIANCE_OFFICER]
    code: 200
    input: ["damaged_quantity?", "damage_class?", "salvage_pct?", "cause_primary?", "evidence_alert_ids?", "variant?", "invoice_unit_value_cents?", "version"]
    output: DamageAssessment
    side_effects:
      - "damage_amount_cents recomputed"

  - method: POST
    path: "/damage-assessments/{id}/finalize"
    description: "Transition DRAFT -> FINALIZED. Locks fields."
    roles: [COMPLIANCE_OFFICER]
    code: 200
    input: []
    output: DamageAssessment
    side_effects: []

  - method: GET
    path: "/damage-assessments/{id}"
    description: "Fetch a damage assessment."
    roles: [SHIPPER, CARRIER, CONSIGNEE, COMPLIANCE_OFFICER, INSURANCE_ADJUSTER]
    code: 200
    input: []
    output: DamageAssessment
    side_effects: []

  # --- ResponsibilityDecision ---
  - method: POST
    path: "/responsibility-decisions"
    description: "Create a decision in DRAFT. Returns advisory_split alongside stored decision."
    roles: [COMPLIANCE_OFFICER]
    code: 201
    input: ["task_id", "assessment_id", "shipper_pct", "carrier_pct", "consignee_pct", "split_method"]
    output: ResponsibilityDecision
    side_effects:
      - "advisory_split computed via responsibility_split_advisory"

  - method: PATCH
    path: "/responsibility-decisions/{id}"
    description: "Revise splits while in DRAFT or after MEDIATION->DRAFT cycle. Recomputes advisory_split."
    roles: [COMPLIANCE_OFFICER]
    code: 200
    input: ["shipper_pct?", "carrier_pct?", "consignee_pct?", "split_method?", "version"]
    output: ResponsibilityDecision
    side_effects: []

  - method: POST
    path: "/responsibility-decisions/{id}/submit"
    description: "DRAFT -> UNDER_REVIEW."
    roles: [COMPLIANCE_OFFICER]
    code: 200
    input: []
    output: ResponsibilityDecision
    side_effects: []

  - method: POST
    path: "/responsibility-decisions/{id}/accept"
    description: "Party acceptance toward UNDER_REVIEW -> ACCEPTED. All three parties must accept."
    roles: [SHIPPER, CARRIER, CONSIGNEE]
    code: 200
    input: []
    output: ResponsibilityDecision
    side_effects:
      - "If all three parties have accepted: status := ACCEPTED"

  - method: POST
    path: "/responsibility-decisions/{id}/dispute"
    description: "UNDER_REVIEW -> DISPUTED."
    roles: [SHIPPER, CARRIER, CONSIGNEE]
    code: 200
    input: ["reason"]
    output: ResponsibilityDecision
    side_effects: []

  - method: POST
    path: "/responsibility-decisions/{id}/mediate"
    description: "DISPUTED -> MEDIATION (compliance officer enters mediation)."
    roles: [COMPLIANCE_OFFICER]
    code: 200
    input: []
    output: ResponsibilityDecision
    side_effects:
      - "mediator_id := X-User-ID"

  - method: POST
    path: "/responsibility-decisions/{id}/finalize"
    description: "ACCEPTED -> FINALIZED. Segregation of duties enforced."
    roles: [COMPLIANCE_OFFICER]
    code: 200
    input: []
    output: ResponsibilityDecision
    side_effects:
      - "attributed_quantity := DamageAssessment.damaged_quantity"
      - "finalizing_role := COMPLIANCE_OFFICER"
      - "AuditLogEntry written"

  - method: GET
    path: "/responsibility-decisions/{id}"
    description: "Fetch a decision (includes advisory_split)."
    roles: [SHIPPER, CARRIER, CONSIGNEE, COMPLIANCE_OFFICER, INSURANCE_ADJUSTER]
    code: 200
    input: []
    output: ResponsibilityDecision
    side_effects: []

  # --- InsuranceClaim ---
  - method: POST
    path: "/insurance-claims"
    description: "Report a claim. Requires FINALIZED ResponsibilityDecision."
    roles: [CARRIER]
    code: 201
    input: ["task_id", "decision_id", "requested_amount_cents"]
    output: InsuranceClaim
    side_effects: []

  - method: POST
    path: "/insurance-claims/{id}/prepare-evidence"
    description: "REPORTED -> EVIDENCE_PREP."
    roles: [CARRIER]
    code: 200
    input: []
    output: InsuranceClaim
    side_effects: []

  - method: POST
    path: "/insurance-claims/{id}/assess"
    description: "EVIDENCE_PREP -> ASSESSMENT or NEGOTIATING -> ASSESSMENT (cycle). Pins assessed_amount_cents."
    roles: [INSURANCE_ADJUSTER]
    code: 200
    input: ["assessed_amount_cents"]
    output: InsuranceClaim
    side_effects: []

  - method: POST
    path: "/insurance-claims/{id}/negotiate"
    description: "ASSESSMENT -> NEGOTIATING (cycle back)."
    roles: [CARRIER, INSURANCE_ADJUSTER]
    code: 200
    input: []
    output: InsuranceClaim
    side_effects: []

  - method: POST
    path: "/insurance-claims/{id}/pay"
    description: "ASSESSMENT -> PAID_OUT. Sets payout_amount_cents := assessed_amount_cents."
    roles: [INSURANCE_ADJUSTER]
    code: 200
    input: []
    output: InsuranceClaim
    side_effects:
      - "payout_amount_cents := assessed_amount_cents"

  - method: POST
    path: "/insurance-claims/{id}/reject"
    description: "ASSESSMENT -> REJECTED. Sets payout_amount_cents := 0."
    roles: [INSURANCE_ADJUSTER]
    code: 200
    input: ["reason"]
    output: InsuranceClaim
    side_effects:
      - "payout_amount_cents := 0"

  - method: POST
    path: "/insurance-claims/{id}/subrogate"
    description: "PAID_OUT -> SUBROGATION. Compensating-invariant: net_insurer_outflow_cents reduces by subrogation_recovered_cents."
    roles: [INSURANCE_ADJUSTER]
    code: 200
    input: ["subrogation_recovered_cents"]
    output: InsuranceClaim
    side_effects:
      - "subrogation_recovered_cents := body value"
      - "payout_amount_cents := previous payout_amount_cents - subrogation_recovered_cents"

  - method: POST
    path: "/insurance-claims/{id}/close"
    description: "SUBROGATION -> CLOSED or PAID_OUT -> CLOSED (no subrogation)."
    roles: [INSURANCE_ADJUSTER]
    code: 200
    input: []
    output: InsuranceClaim
    side_effects: []

  - method: GET
    path: "/insurance-claims/{id}"
    description: "Fetch a claim."
    roles: [CARRIER, COMPLIANCE_OFFICER, INSURANCE_ADJUSTER]
    code: 200
    input: []
    output: InsuranceClaim
    side_effects: []

  # --- ComplianceReport ---
  - method: POST
    path: "/compliance-reports"
    description: "Create a compliance report in DRAFT."
    roles: [COMPLIANCE_OFFICER]
    code: 201
    input: ["regulatory_domain", "period_start", "period_end"]
    output: ComplianceReport
    side_effects: []

  - method: POST
    path: "/compliance-reports/{id}/generate"
    description: "DRAFT -> GENERATED. Populates aggregate counts via compliance_period_aggregation."
    roles: [COMPLIANCE_OFFICER]
    code: 200
    input: []
    output: ComplianceReport
    side_effects:
      - "task_count, alert_count, critical_alert_count computed"

  - method: POST
    path: "/compliance-reports/{id}/submit"
    description: "GENERATED -> SUBMITTED."
    roles: [COMPLIANCE_OFFICER]
    code: 200
    input: []
    output: ComplianceReport
    side_effects: []

  - method: POST
    path: "/compliance-reports/{id}/acknowledge"
    description: "SUBMITTED -> ACKNOWLEDGED."
    roles: [COMPLIANCE_OFFICER]
    code: 200
    input: []
    output: ComplianceReport
    side_effects: []

  - method: GET
    path: "/compliance-reports/{id}"
    description: "Fetch a compliance report."
    roles: [COMPLIANCE_OFFICER, INSURANCE_ADJUSTER]
    code: 200
    input: []
    output: ComplianceReport
    side_effects: []

  # --- AuditLog ---
  - method: GET
    path: "/audit-log"
    description: "List audit log entries (alerts + responsibility decisions)."
    roles: [COMPLIANCE_OFFICER, INSURANCE_ADJUSTER]
    code: 200
    input: ["subject_type?", "subject_id?", "limit?", "offset?"]
    output: AuditLogEntry[]
    side_effects: []

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_AUTH_MISSING
    http: 401
    condition: "Missing X-User-ID or X-User-Role"

  - id: ERR_FORBIDDEN
    http: 403
    condition: "Role not permitted for this endpoint per §1.7"

  - id: ERR_NOT_FOUND
    http: 404
    condition: "Path-id refers to a non-existent resource"

  - id: ERR_REFERENCE_NOT_FOUND
    http: 404
    condition: "Body FK refers to a non-existent resource (vehicle_id, driver_id, task_id, assessment_id, decision_id, evidence_alert_ids[*])"

  - id: ERR_INVALID_STATE
    http: 409
    condition: "Target resource not in the expected from-state for the requested transition"

  - id: ERR_VERSION_CONFLICT
    http: 409
    condition: "OCC: body.version != server.version"

  - id: ERR_SEGREGATION_VIOLATION
    http: 403
    condition: "ResponsibilityDecision finalizer is one of the named parties (shipper/carrier/consignee) on the task"

  - id: ERR_TASK_NOT_RESOLVABLE
    http: 409
    condition: "Alert.resolve attempted while parent TransportTask is CLOSED or ABORTED"

  - id: ERR_DECISION_NOT_FINALIZED
    http: 409
    condition: "InsuranceClaim REPORTED attempted while linked ResponsibilityDecision is not FINALIZED"

  - id: ERR_EVIDENCE_REQUIRED
    http: 422
    condition: "DamageAssessment evidence_alert_ids empty, or references an alert not on the same task, or references an alert not in {RESOLVED, CLOSED}"

  - id: ERR_INVOICE_VALUE_REQUIRED
    http: 422
    condition: "DamageAssessment.variant = INVOICE_VALUE but invoice_unit_value_cents missing or <= 0"

  - id: ERR_VEHICLE_OVERLAP
    http: 409
    condition: "Vehicle already has an active TransportTask whose half-open [planned_start_at, planned_end_at) intersects this one"

  - id: ERR_DRIVER_HOURS_EXCEEDED
    http: 409
    condition: "Driver rolling 24h driving minutes would exceed max_daily_minutes after this dispatch"

  - id: ERR_READING_OUT_OF_WINDOW
    http: 422
    condition: "TemperatureReading.captured_at outside [TransportTask.planned_start_at, current_clock] under strict=true mode"

  - id: ERR_PCT_SUM_INVALID
    http: 422
    condition: "ResponsibilityDecision shipper_pct + carrier_pct + consignee_pct != 1.00"

  - id: ERR_INSURANCE_CAP_EXCEEDED
    http: 422
    condition: "InsuranceClaim.requested_amount_cents > Vehicle.insured_cap_cents"

  - id: ERR_QUANTITY_INVALID
    http: 422
    condition: "DamageAssessment.damaged_quantity not in 1..TransportTask.cargo_quantity"

  - id: ERR_AMOUNT_INVALID
    http: 422
    condition: "InsuranceClaim.assess: assessed_amount_cents out of [0, requested_amount_cents]; or subrogate: subrogation_recovered_cents out of [0, payout_amount_cents]"

  - id: ERR_VALIDATION
    http: 422
    condition: "Schema / field-type validation (datetime format, enum, numeric range)"

  - id: ERR_IDEMPOTENT_REPLAY
    http: 200
    condition: "Duplicate POST /transport-tasks/{id}/temperature-readings with same (task_id, idempotency_key); existing row returned"

  - id: ERR_HANDOVER_ALREADY_EXISTS
    http: 409
    condition: "A HandoverRecord already exists for the target stop (unique stop_id constraint)"

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: SHIPPER
    description: "Cargo owner who initiates transport tasks and approves/disputes responsibility decisions."
    identity: "opaque"
    exclusive_operations:
      - "Create transport-tasks for which X-User-ID equals body.shipper_id"
    shared_operations:
      - "GET on transport-tasks, alerts, damage-assessments, responsibility-decisions on tasks where X-User-ID == TransportTask.shipper_id"
      - "POST /responsibility-decisions/{id}/accept"
      - "POST /responsibility-decisions/{id}/dispute"

  - name: CARRIER
    description: "Logistics operator owning the carrier organization. Owns Vehicles and Drivers."
    identity: "opaque"
    exclusive_operations:
      - "POST /vehicles, POST /drivers (carrier-owned fleet)"
      - "POST /transport-tasks/{id}/close"
      - "POST /insurance-claims (initial report)"
      - "POST /insurance-claims/{id}/prepare-evidence"
    shared_operations:
      - "GET on transport-tasks/alerts/damage-assessments/responsibility-decisions on tasks where X-User-ID == TransportTask.carrier_id"
      - "POST /responsibility-decisions/{id}/accept, /dispute"
      - "POST /insurance-claims/{id}/negotiate"

  - name: DRIVER
    description: "Driver assigned to a TransportTask. Operates departures, arrivals, handovers; can acknowledge/respond to alerts."
    identity: "opaque"
    exclusive_operations:
      - "POST /transport-tasks/{id}/depart"
      - "POST /transport-tasks/{id}/stops/{stop_id}/arrive"
      - "POST /transport-tasks/{id}/stops/{stop_id}/depart"
      - "POST /transport-tasks/{id}/stops/{stop_id}/handovers"
    shared_operations:
      - "POST /alerts/{id}/acknowledge (shared with DISPATCHER)"
      - "POST /alerts/{id}/responses (shared with DISPATCHER)"
      - "GET on owned tasks"

  - name: CONSIGNEE
    description: "Receiving party at the final destination."
    identity: "opaque"
    exclusive_operations: []
    shared_operations:
      - "GET on tasks where X-User-ID == TransportTask.consignee_id"
      - "POST /responsibility-decisions/{id}/accept, /dispute"

  - name: DISPATCHER
    description: "Operations role; assigns vehicles/drivers, dispatches, aborts, manages alerts."
    identity: "opaque"
    exclusive_operations:
      - "POST /transport-tasks/{id}/dispatch"
      - "POST /transport-tasks/{id}/abort"
      - "PATCH /transport-tasks/{id}"
      - "POST /transport-tasks/{id}/stops/{stop_id}/skip"
      - "POST /alerts/{id}/escalate"
      - "POST /alerts/{id}/resolve"
    shared_operations:
      - "POST /alerts/{id}/acknowledge, /responses (shared with DRIVER)"
      - "POST /transport-tasks (shared with SHIPPER)"

  - name: COMPLIANCE_OFFICER
    description: "Independent compliance role. Owns damage assessment, responsibility decision, compliance reports, audit log access."
    identity: "opaque"
    exclusive_operations:
      - "POST /damage-assessments, PATCH /damage-assessments/{id}, POST /damage-assessments/{id}/finalize"
      - "POST /responsibility-decisions, PATCH /responsibility-decisions/{id}"
      - "POST /responsibility-decisions/{id}/submit, /mediate, /finalize"
      - "POST /compliance-reports*"
      - "POST /transport-tasks/{id}/temperature-readings/archive"
    shared_operations:
      - "GET /audit-log (shared with INSURANCE_ADJUSTER)"

  - name: INSURANCE_ADJUSTER
    description: "Insurance assessor; handles claim assessment, payout, rejection, subrogation, closing."
    identity: "opaque"
    exclusive_operations:
      - "POST /insurance-claims/{id}/assess"
      - "POST /insurance-claims/{id}/pay"
      - "POST /insurance-claims/{id}/reject"
      - "POST /insurance-claims/{id}/subrogate"
      - "POST /insurance-claims/{id}/close"
    shared_operations:
      - "GET on insurance-claims and audit-log"
      - "POST /insurance-claims/{id}/negotiate (shared with CARRIER)"

  - name: SYSTEM
    description: "Test-fixture / IoT-ingest principal. Used for clock-advance endpoints and IoT batch reading ingest."
    identity: "opaque"
    exclusive_operations:
      - "POST /_clock/advance"
      - "GET /_clock"
    shared_operations:
      - "POST /transport-tasks/{id}/temperature-readings (shared with DISPATCHER as a fallback)"
