            - { call: "POST /v1/teams", payload: { animal_id: "${a2}", team_name: "TE2" }, as: Handler, as_user_id: "${h2}", captures: { t2: $.data.id } }
            - { call: "POST /v1/evaluations", payload: { team_id: "${t2}" }, as: Handler, as_user_id: "${h2}", captures: { e2: $.data.id } }
            - { call: "POST /v1/handlers", payload: { full_name: "H E3", email: "he3@x.com", region_code: "WA", volunteer_since: "2024-08-01" }, as: Anonymous, captures: { h3: $.data.id } }
            - { call: "POST /v1/handlers/${h3}/approve", payload: {}, as: ProgramAdmin }
            - { call: "POST /v1/animals", payload: { name: "D3", species: "DOG", breed: "Corgi", date_of_birth: "2021-01-01" }, as: Handler, as_user_id: "${h3}", captures: { a3: $.data.id } }
            - { call: "POST /v1/teams", payload: { animal_id: "${a3}", team_name: "TE3" }, as: Handler, as_user_id: "${h3}", captures: { t3: $.data.id } }
            - { call: "POST /v1/evaluations", payload: { team_id: "${t3}" }, as: Handler, as_user_id: "${h3}", captures: { e3: $.data.id } }
            - { call: "POST /v1/evaluators", payload: { full_name: "Ev Buf", email: "evbuf@x.com", region_code: "WA", specializations: ["DOG"] }, as: ProgramAdmin, captures: { ev: $.data.id } }
          trigger:
            - { call: "POST /v1/evaluations/${e1}/schedule", payload: { evaluator_id: "${ev}", scheduled_start: "2026-08-03T09:00:00Z", scheduled_end: "2026-08-03T10:00:00Z" }, as: ProgramAdmin, captures: { x_st: $.data.status } }
            - { call: "POST /v1/evaluations/${e2}/schedule", payload: { evaluator_id: "${ev}", scheduled_start: "2026-08-03T10:00:00Z", scheduled_end: "2026-08-03T11:00:00Z" }, as: ProgramAdmin, captures: { err: $.data.error_id } }
            - { call: "POST /v1/evaluations/${e3}/schedule", payload: { evaluator_id: "${ev}", scheduled_start: "2026-08-03T10:30:00Z", scheduled_end: "2026-08-03T11:30:00Z" }, as: ProgramAdmin, captures: { z_st: $.data.status } }
          assert:
            - "x_st == SCHEDULED (first evaluation 09:00-10:00)"
            - "err == ERR_EVALUATOR_SCHEDULING_CONFLICT (10:00 start has gap 0 < 30 to the 09:00-10:00 evaluation; adjacency conflicts here, unlike team visits)"
            - "z_st == SCHEDULED (10:30 start leaves gap exactly 30 >= 30; raw [10:30,11:30) clears buffered [08:30,10:30))"

      - name: facility_aggregate_capacity_overlap
        grounds:
          - errors[ERR_FACILITY_CAPACITY_EXCEEDED]
          - validations[priority=12]
        distinguishing_aspect: |
          Resource = Facility, semantics = aggregate capacity (overlapping
          visits are permitted up to max_overlapping_teams at any instant) —
