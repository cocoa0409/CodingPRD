# =============================================================================
# §1.9 Scaffold Corner Design (Breadth Coverage Index)
# valuables-jewelry-insurance — Expert band
# Enumerates testable claims NOT already covered by §1.8; excluded_because stubs
# point at the §1.8 difficulty instance that already exercises the corner.
# =============================================================================
scaffold_corner_design:

  # =========================================================================
  - section: entities
    instances:
      - name: create_policy_returns_201_with_quoted_unbilled
        claim_type: Creation
        grounds: [entities.Policy, endpoints]
        distinguishing_aspect: "POST /policies with all required fields returns 201; coverage_status==QUOTED, billing_status==UNBILLED, version==1."
        test_recipe:
          setup: ["A registered Policyholder exists."]
          setup_api_calls:
            - call: "POST /policyholders"
              payload: { email: "e1@x.com", full_name: "E1", residence_zip: "10001" }
              as: Underwriter
              captures: { ph: $.data.id }
          trigger:
            - call: "POST /policies"
              payload: { policyholder_id: "${ph}", coverage_type: "ALL_RISK", valuation_basis: "AGREED_VALUE", deductible_option: "LOW" }
              as: Underwriter
              captures: { pol: $.data.id }
          assert:
            - "response status == 201"
            - "Policy.${pol}.coverage_status == QUOTED"
            - "Policy.${pol}.billing_status == UNBILLED"
            - "Policy.${pol}.version == 1"

      - name: create_policy_missing_required_field_returns_422
        claim_type: Required Fields
        grounds: [entities.Policy.fields.coverage_type, "validations[priority=4]"]
        distinguishing_aspect: "POST /policies omitting coverage_type returns ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["A registered Policyholder exists."]
          setup_api_calls:
            - call: "POST /policyholders"
              payload: { email: "e2@x.com", full_name: "E2", residence_zip: "10001" }
              as: Underwriter
              captures: { ph: $.data.id }
          trigger:
            - call: "POST /policies"
              payload: { policyholder_id: "${ph}", valuation_basis: "AGREED_VALUE", deductible_option: "LOW" }
              as: Underwriter
              captures: { err: $.data.error_id }
          assert:
            - "response data.error_id == ERR_INVALID_REQUEST"
            - "response status == 422"

      - name: get_policy_nonexistent_returns_404
        claim_type: Not Found
        grounds: [endpoints, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /policies/{id} with a never-created UUID returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /policies/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: Underwriter
              captures: { err: $.data.error_id }
          assert:
            - "response data.error_id == ERR_NOT_FOUND"
            - "response status == 404"

      - name: policy_computed_deductible_cents_from_option
        claim_type: Computed Fields
        grounds: [calculations.deductible_resolution, entities.Policy.fields.deductible_cents]
        distinguishing_aspect: "After bind, a HIGH-deductible policy exposes deductible_cents==100000 (resolved from DEDUCTIBLE_CENTS, input-supplied value ignored)."
        test_recipe:
          setup: ["A QUOTED HIGH-deductible policy with one RING; risk zone exists."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: Underwriter
            - call: "POST /risk-zones"
              payload: { zip_prefix: "100", risk_band: "MODERATE", rate_per_thousand_cents: 300 }
              as: Underwriter
            - call: "POST /policyholders"
              payload: { email: "e3@x.com", full_name: "E3", residence_zip: "10001" }
              as: Underwriter
              captures: { ph: $.data.id }
            - call: "POST /policies"
              payload: { policyholder_id: "${ph}", coverage_type: "ALL_RISK", valuation_basis: "AGREED_VALUE", deductible_option: "HIGH" }
              as: Underwriter
              captures: { pol: $.data.id }
            - call: "POST /policies/${pol}/scheduled-items"
              payload: { description: "Ring", category: "RING", location_zip: "10001", scheduled_value_cents: 1000000 }
              as: Underwriter
          trigger:
            - call: "POST /policies/${pol}/bind"
              payload: {}
              as: Underwriter
          assert:
            - "Policy.${pol}.deductible_cents == 100000"

      - name: system_fields_generated_input_ignored
        claim_type: System Fields
        grounds: [entities.Policy]
        distinguishing_aspect: "id/created_at/updated_at/version are server-minted; client-supplied id/version in the body are ignored and a fresh UUID + version==1 are returned."
        test_recipe:
          setup: ["A registered Policyholder exists."]
          setup_api_calls:
            - call: "POST /policyholders"
              payload: { email: "e4@x.com", full_name: "E4", residence_zip: "10001" }
              as: Underwriter
              captures: { ph: $.data.id }
          trigger:
            - call: "POST /policies"
              payload: { policyholder_id: "${ph}", coverage_type: "ALL_RISK", valuation_basis: "AGREED_VALUE", deductible_option: "LOW" }
              as: Underwriter
              captures: { pol: $.data.id }
          assert:
            - "Policy.${pol}.version == 1"
            - "Policy.${pol}.id is a server-minted UUID (not client-supplied)"

