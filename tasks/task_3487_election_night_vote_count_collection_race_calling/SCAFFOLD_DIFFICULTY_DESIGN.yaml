          setup:
            - "Standard universe at posture LIVE. Alameda report p10 W6000/T4000 already ACCEPTED (contest still REPORTING because Contra Costa is incomplete)."
          setup_api_calls:
            - *clock0
            - *ev
            - *cty_a
            - *cty_b
            - *cst
            - *lnk_a
            - *lnk_b
            - *cand_w
            - *cand_t
            - *feed
            - *lock
            - *eday
            - *live
            - *cv
            - call: "POST /contests/${cst}/vote-reports"
              payload: { county_id: "${cty_a}", source: "FEED", precincts_reporting: 10, candidate_votes: [{ candidate_id: "${cand_w}", votes: 6000 }, { candidate_id: "${cand_t}", votes: 4000 }], expected_contest_version: "${cv}" }
              as: FeedOperator
              captures: { rep_a: $.data.id }
            - call: "POST /vote-reports/${rep_a}/review-decisions"
              payload: { decision: "ACCEPT" }
              as: TabulationClerk
            - call: "GET /contests/${cst}"
              payload: {}
              as: ElectionOpsAdmin
              captures: { cv_b: $.data.version }
            - call: "POST /contests/${cst}/vote-reports"
              payload: { county_id: "${cty_b}", source: "FEED", precincts_reporting: 5, candidate_votes: [{ candidate_id: "${cand_w}", votes: 2200 }, { candidate_id: "${cand_t}", votes: 1800 }], expected_contest_version: "${cv_b}" }
              as: FeedOperator
              captures: { rep_b: $.data.id }
          trigger:
            - call: "POST /vote-reports/${rep_b}/review-decisions"
              payload: { decision: "ACCEPT" }
              as: TabulationClerk
          assert:
            - "VoteReport.${rep_b}.status == ACCEPTED and accepted_at is non-null"
            - "Contest.${cst}.tabulation_status == COMPLETE (both linked counties complete)"
            - "Contest.${cst}.reported_precincts == 15 and total_votes == 14000"
            - "Contest.${cst}.outstanding_estimate == 0"
            - "County.${cty_b}.status == COMPLETE and County.${cty_a}.status == COMPLETE"

  - rule_id: priority_pair_validation_conflict
