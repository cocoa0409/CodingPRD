  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      # --- #1: state (posture gate) vs business_referential (seller blocked) ---
      - name: posture_gate_beats_seller_blocked_on_pay
        grounds:
          - validations[priority=8]
          - validations[priority=9]
          - errors[ERR_CAMPAIGN_NOT_ACTIVE]
          - errors[ERR_SELLER_BLOCKED]
        distinguishing_aspect: |
          A single pay request violates BOTH the posture gate (campaign FROZEN,
          priority 8, ERR_CAMPAIGN_NOT_ACTIVE) and the seller-blocked rule
          (priority 9, ERR_SELLER_BLOCKED). The lower priority number wins:
          ERR_CAMPAIGN_NOT_ACTIVE (412? no, 409) is returned, not
          ERR_SELLER_BLOCKED. Pair = state vs business_referential.
        test_recipe:
          setup:
            - "CATALOG campaign with a PENDING order whose crediting seller is BLOCKED, and campaign then FROZEN."
          setup_api_calls:
            - call: "POST /fundraising/campaigns"
              payload: { name: "Conf", campaign_type: "CATALOG", goal_cents: 100000, profit_split_pct: 0.50, vendor_name: "V", starts_at: "2026-04-01T00:00:00Z", ends_at: "2026-05-01T00:00:00Z" }
              as: CampaignAdmin
              captures: { camp_id: $.data.id }
            - call: "POST /fundraising/prize-tiers"
              payload: { campaign_id: "${camp_id}", label: "T1", threshold_cents: 5000, prize_description: "p" }
              as: CampaignAdmin
            - call: "POST /fundraising/sellers"
              payload: { campaign_id: "${camp_id}", display_name: "S", guardian_email: "g@x.com" }
              as: CampaignAdmin
              captures: { seller_id: $.data.id }
            - call: "POST /fundraising/products"
              payload: { campaign_id: "${camp_id}", sku: "WRAP", name: "Wrap", unit_price_cents: 2000, unit_cost_cents: 800, stock_qty: 100 }
              as: CampaignAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /fundraising/campaigns/${camp_id}/activate"
              payload: {}
              as: CampaignAdmin
            - call: "POST /fundraising/orders"
              payload: { campaign_id: "${camp_id}", seller_id: "${seller_id}", buyer_name: "B", buyer_email: "b@x.com", lines: [ { product_id: "${prod_id}", quantity: 5 } ] }
              as: CampaignAdmin
              captures: { o_id: $.data.id }
            - call: "POST /fundraising/sellers/${seller_id}/block"
              payload: {}
              as: CampaignAdmin
            - call: "POST /fundraising/campaigns/${camp_id}/freeze"
              payload: {}
              as: CampaignAdmin
          trigger:
            - call: "POST /fundraising/orders/${o_id}/pay"
              payload: {}
              as: CampaignAdmin
              captures: { eid: $.data.error_id }
          assert:
            - "response data.error_id == ERR_CAMPAIGN_NOT_ACTIVE"
            - "http status == 409"

      # --- #2: existence (bad seller FK) vs business_safety (insufficient stock) ---
      - name: reference_not_found_beats_insufficient_stock_on_order_create
        grounds:
          - validations[priority=4]
          - validations[priority=10]
          - errors[ERR_REFERENCE_NOT_FOUND]
          - errors[ERR_INSUFFICIENT_STOCK]
        distinguishing_aspect: |
          On order create, a single request names a non-existent seller_id
          (priority 4, existence, ERR_REFERENCE_NOT_FOUND) AND requests more
          units than stock allows (priority 10, business_safety,
          ERR_INSUFFICIENT_STOCK). The lower priority number wins:
          ERR_REFERENCE_NOT_FOUND. Pair = existence vs business_safety.
        test_recipe:
          setup:
            - "ACTIVE CATALOG campaign, 1 valid seller, 1 product with stock_qty 2, 1 prize tier."
          setup_api_calls:
            - call: "POST /fundraising/campaigns"
              payload: { name: "Conf2", campaign_type: "CATALOG", goal_cents: 100000, profit_split_pct: 0.50, vendor_name: "V", starts_at: "2026-04-01T00:00:00Z", ends_at: "2026-05-01T00:00:00Z" }
              as: CampaignAdmin
              captures: { camp_id: $.data.id }
            - call: "POST /fundraising/prize-tiers"
              payload: { campaign_id: "${camp_id}", label: "T1", threshold_cents: 5000, prize_description: "p" }
              as: CampaignAdmin
            - call: "POST /fundraising/sellers"
              payload: { campaign_id: "${camp_id}", display_name: "S", guardian_email: "g@x.com" }
              as: CampaignAdmin
              captures: { seller_id: $.data.id }
            - call: "POST /fundraising/products"
              payload: { campaign_id: "${camp_id}", sku: "WRAP", name: "Wrap", unit_price_cents: 2000, unit_cost_cents: 800, stock_qty: 2 }
              as: CampaignAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /fundraising/campaigns/${camp_id}/activate"
              payload: {}
              as: CampaignAdmin
          trigger:
            - call: "POST /fundraising/orders"
              payload: { campaign_id: "${camp_id}", seller_id: "00000000-0000-4000-8000-000000000000", buyer_name: "B", buyer_email: "b@x.com", lines: [ { product_id: "${prod_id}", quantity: 99 } ] }
