- section: calculations
  instances:
  - name: amortization_constants_applied_exclusive_weight_three
    claim_type: constants_applied
    grounds:
    - calculations.amortization_expense
    distinguishing_aspect: 'EVENT_WEIGHTED constants EXCLUSIVE_WEIGHT=3 / SIMULCAST_WEIGHT=1: a property with one COMPLETE EXCLUSIVE and one SCHEDULED SIMULCAST amortizes
      floor(fee * 3/4).'
    test_recipe:
      setup:
      - EVENT_WEIGHTED property, fee 80000, one EXCLUSIVE window COMPLETE, one SIMULCAST window SCHEDULED
      setup_api_calls:
