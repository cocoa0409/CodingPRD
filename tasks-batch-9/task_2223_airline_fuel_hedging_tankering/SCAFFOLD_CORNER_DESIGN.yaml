            - "Trigger call 2: HTTP 409 and data.error_id == \"ERR_INSTRUMENT_INVALID_TRADE_STATE\"."
            - "Trigger call 3: data.open_instrument_count == 0, data.hedged_gallons == 0, data.planned_coverage_pct_delta == 0.00, data.status == \"SIZING\"."
            - "Trigger call 4: data.utilized_credit_usd == 0.00, data.utilization_pct == 0.00, data.credit_posture == \"NORMAL\" (the trade never executed, so no margin was ever taken)."

      - name: mtm_publish_settles_matured_trade_without_disturbing_designation
        claim_type: side_effect_execution
        grounds:
          - state_machines.HedgeInstrument.transitions
          - state_machines.MarkToMarketRun.transitions
          - entities.MarkToMarketRun.fields.settled_instrument_count
          - entities.HedgeInstrument.fields.accounting_status
          - calculations.mtm_report_totals
        distinguishing_aspect: |
          The two HedgeInstrument dimensions advance independently: publication moves
          trade_status EXECUTED -> SETTLED because maturity_month 2027-02 <= period
          2027-02, while accounting_status stays DESIGNATED. Settlement runs AFTER the
          margin hops, so the same call both raises a 60000.00 margin call
          (margin_calls_created 1) and then releases the margin to 0.00 —
          utilized_credit_usd ends at 0.00 while open_margin_call_count stays 1.
        test_recipe:
