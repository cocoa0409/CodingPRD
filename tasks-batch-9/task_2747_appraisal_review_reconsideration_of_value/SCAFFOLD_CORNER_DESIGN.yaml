        excluded_because:
          difficulty_instance: bias_substantiation_cascade_forces_order_reassignment
          rationale: "The §1.8 transitive_cascade instance already drives the full three-level chain end-to-end -- flag SUBSTANTIATE raises substantiated_bias_count, the recomputed ROLLING_12M score cascades panel_status, and the panel_status landing forces the appraiser's ASSIGNED SECOND_APPRAISAL orders to REASSIGNMENT_REQUIRED -- and it asserts the ordering sensitivity (the order move is decided by the cascade's landing state, not by the flag itself). A second corner test here would only re-verify the same chain with different literals."

      - name: dual_variant_calculation_appraiser_score_window_delta
        claim_type: dual_variant_calculation
        excluded_because:
          difficulty_instance: appraiser_performance_rolling_12m_vs_lifetime_on_appraiser
          rationale: "The §1.8 dual_variant_calc instance already exercises both variants on identical data with an out-of-window revision, asserting the exact divergence (ROLLING_12M back to 10000 while LIFETIME keeps the revision penalty) and that only the rolling variant drives the panel cascade. The remaining variant-switch delta claim has no analogue here because neither variant is ever swapped into a ledger."

  - section: errors
    instances:
      - name: error_unauthenticated_missing_headers_and_unknown_role_rejected
        claim_type: violation_to_error
        grounds:
          - validations.priority_1_ERR_UNAUTHENTICATED
          - validations.priority_2_ERR_UNAUTHENTICATED
          - errors.ERR_UNAUTHENTICATED
        distinguishing_aspect: "Both authentication clauses on the same read: an omitted header pair and a syntactically fine but undeclared role name each produce ERR_UNAUTHENTICATED 401 -- not ERR_FORBIDDEN_ROLE, which is reserved for a declared role attempting an operation outside its matrix row."
        test_recipe:
          setup:
            - "One loan file, so the target id is real and only the headers are at fault."
          setup_api_calls:
            - call: "POST /appraisal-desk/loan-files"
              payload: { loan_number: "LN-2747-C701", loan_purpose: "REFINANCE", market_type: "SUBURBAN", risk_tier: "STANDARD", loan_amount_cents: 30000000, borrower_display_name: "Bea Borrower" }
              as: LoanOfficer
              as_user_id: "lo_user_1"
              captures: { lf1_id: $.data.id }
          trigger:
            - call: "GET /appraisal-desk/loan-files/${lf1_id}"
              payload: {}
              as: "(no X-User-ID and no X-User-Role header sent)"
              captures: { err_id: "$.data.error_id" }
            - call: "GET /appraisal-desk/loan-files/${lf1_id}"
              payload: {}
              as: "PortfolioAnalyst"
              as_user_id: "ghost_user_1"
              captures: { err_id2: "$.data.error_id" }
            - call: "GET /appraisal-desk/loan-files/${lf1_id}"
              payload: {}
              as: LoanOfficer
              as_user_id: "lo_user_1"
          assert:
            - "missing headers: HTTP 401 with error_id ERR_UNAUTHENTICATED and success false"
            - "undeclared role PortfolioAnalyst: HTTP 401 with error_id ERR_UNAUTHENTICATED -- priority 2 fires before any RBAC matrix lookup, so it is not ERR_FORBIDDEN_ROLE 403"
            - "complete headers: HTTP 200 with data.loan_number LN-2747-C701, proving the id itself was always valid"
            - "both failures return the standard error envelope: success false, data.error_id set, data.message non-empty"

