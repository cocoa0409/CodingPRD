  - rule_id: resource_temporal_overlap
    instances:
      - name: inspector_travel_buffer_spans_two_loans_at_the_minute
        grounds:
          - validations[priority=18]
          - validation_constants.TRAVEL_BUFFER_MINUTES
          - entities.InspectionVisit.fields.inspector_id
          - entities.InspectionVisit.fields.window_start
          - entities.InspectionVisit.fields.window_end
          - state_machines.InspectionVisit.SCHEDULED_to_COMPLETED
          - errors[ERR_INSPECTOR_WINDOW_CONFLICT]
        distinguishing_aspect: |
          The contended resource is the inspector's calendar, which is NOT owned by either
          loan: a SCHEDULED 09:00-11:00 visit on loan A blocks a 12:29 start on loan B
          because the 90-minute travel buffer widens the footprint to [07:30, 12:30), and a
          12:30 start on the same second boundary is accepted. Both requests are legal
          within their own aggregate, so only a cross-aggregate half-open interval check
          with the buffer applied to BOTH ends distinguishes them.
