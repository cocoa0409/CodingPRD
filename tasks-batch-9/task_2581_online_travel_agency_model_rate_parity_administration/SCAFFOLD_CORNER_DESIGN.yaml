        excluded_because:
          difficulty_instance: cross_entity_state_dependency / offer_publish_blocked_when_supplier_certification_has_expired
          rationale: "The named §1.8 instance is exactly the guarded-transition case: publish is refused because a different entity (Certification) left its live state."

      - name: certification_revocation_cascades_down_to_offers_and_packages
        claim_type: cascade_down
        grounds:
