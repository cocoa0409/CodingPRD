      - name: logical_clock_default_is_2026_08_01_before_any_clock_set
        claim_type: action_endpoint
        grounds:
          - endpoints.POST_/_clock/set_current_utc
          - entities.ScreeningItem.fields.recorded_at
          - entities.ScreeningItem.fields.expires_at
          - calculations.applicant_risk_score
        distinguishing_aspect: |
          Action-endpoint claim on the test-driving clock. With no clock write at all,
          the first BACKGROUND_CHECK is stamped 2026-08-01T00:00:00Z and expires
          2027-01-28 (180 days later); after a single set_current_utc to 2026-08-15 the
          next identical write is stamped 2026-08-15 and expires 2027-02-11. Both
          expiries are 180 days from their own recorded_at, which fixes the default
          epoch and proves the validity window is measured from the stamp rather than
          from a fixed origin or from wall time.
        test_recipe:
          setup:
            - "One production and one PUBLISHED REFERRAL call, created without touching the clock; two adult applicants."
          setup_api_calls:
            - call: "POST /casting/productions"
              payload: { title: "Harbour Nights S1", format_type: "DOCUSOAP", jurisdiction_code: "GA", season_number: 1, episode_order: 9, photography_start_utc: "2026-09-15T00:00:00Z", photography_end_utc: "2026-12-15T00:00:00Z", stipend_pool_cents: 5000000, welfare_budget_cents: 2000000, minor_participant_cap: 2 }
