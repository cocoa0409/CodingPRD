  # ============================================================== Cross-Cutting Complexity Layers
  - section: cross_cutting_layers
    instances:
      - name: application_create_stale_site_version
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[application-create-stale-site]", "errors[ERR_STALE_VERSION"]
        distinguishing_aspect: "OCC on Site.version: a second application create carrying the pre-first-create expected_site_version is rejected 412 ERR_STALE_VERSION, because the first create legitimately superseded the site's DRAFT set and bumped Site.version to 2."
        test_recipe:
          setup:
            - "Site (version 1 observed); period OPEN; application A (BRONZE) created with expected_site_version=1 -> success, Site.version becomes 2"
          setup_api_calls:
            - call: "POST /sites"
              payload: { name: "Site OC", landfill_tip_fee_per_ton_cents: 5500, max_rebate_rate_per_ton_cents: 12000 }
              as: SustainabilityManager
              captures: { site_id: $.data.id, site_v: $.data.version }
            - call: "POST /scorecard_periods"
              payload: { site_id: "${site_id}", period_start: "2026-08-01", period_end: "2026-09-01" }
              as: CertificationOfficer
              captures: { period_id: $.data.id }
            - call: "POST /certification_applications"
              payload: { site_id: "${site_id}", level_requested: "BRONZE", reporting_period_id: "${period_id}", expected_site_version: "${site_v}" }
              as: SustainabilityManager
              captures: { app_a: $.data.id }
          trigger:
            - call: "POST /certification_applications"
              payload: { site_id: "${site_id}", level_requested: "SILVER", reporting_period_id: "${period_id}", expected_site_version: "${site_v}" }
              as: SustainabilityManager
              captures: { err: $.data.error_id }
            - call: "GET /sites/${site_id}"
              payload: {}
              as: CertificationOfficer
              captures: { site_v_after: $.data.version }
          assert:
            - "err == ERR_STALE_VERSION"
            - "http status == 412"
            - "site_v_after == 2  (exactly one successful create bumped the version; stale write changed nothing)"

      - name: certification_lapse_after_12_months
