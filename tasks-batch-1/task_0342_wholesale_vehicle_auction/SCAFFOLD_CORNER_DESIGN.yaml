# =============================================================================
# §1.9 Scaffold Corner Design (breadth coverage of non-difficulty claims)
# Taxonomy sections/claim_types per references/claim-extraction-guide.md.
# Every active instance's setup_api_calls is a lint-clean §1.5 chain.
# =============================================================================
scaffold_corner_design:

  # ---------------------------------------------------------------------------
  - section: entities
    instances:
      - name: create_sale_returns_201_with_defaults
        claim_type: Creation
        grounds: [entities.AuctionSale, endpoints]
        distinguishing_aspect: "POST /auction/sales with required fields -> 201; status=DRAFT, lane_count=0, buyer_fee_schedule_code defaults STANDARD when omitted."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /auction/sales"
              payload: { sale_name: "Tuesday Sale", sale_date: "2026-06-02T09:00:00Z" }
              as: AuctionAdmin
              captures: { sale_id: $.data.id, sched: $.data.buyer_fee_schedule_code }
          assert:
            - "response.status == 201"
            - "AuctionSale.${sale_id}.status == DRAFT"
            - "AuctionSale.${sale_id}.lane_count == 0"
            - "AuctionSale.${sale_id}.buyer_fee_schedule_code == STANDARD"

      - name: get_sale_not_found_returns_404
        claim_type: Not Found
        grounds:
          - "entities.AuctionSale"
          - "errors[ERR_SALE_NOT_FOUND]"
        distinguishing_aspect: "GET /auction/sales/{id} with a non-existent UUID -> ERR_SALE_NOT_FOUND (404)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /auction/sales/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: AuctionAdmin
              captures: { error_id: $.data.error_id }
          assert:
            - "response.status == 404"
            - "response.data.error_id == ERR_SALE_NOT_FOUND"

      - name: create_buyer_missing_credit_limit_returns_validation
        claim_type: Required Fields
        grounds:
          - "entities.Buyer.fields.credit_limit_cents"
          - "errors[ERR_VALIDATION]"
        distinguishing_aspect: "POST /auction/buyers without credit_limit_cents (required, no default) -> ERR_VALIDATION (400)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /auction/buyers"
              payload: { dealer_name: "B-missing" }
              as: AuctionAdmin
              captures: { error_id: $.data.error_id }
          assert:
            - "response.status == 400"
            - "response.data.error_id == ERR_VALIDATION"

      - name: create_buyer_initializes_credit_fields
        claim_type: Computed Fields
        grounds: [entities.Buyer.fields.available_credit_cents, entities.Buyer.fields.committed_cents]
        distinguishing_aspect: "On buyer create, available_credit_cents == credit_limit_cents and committed_cents == 0."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /auction/buyers"
              payload: { dealer_name: "B-init", credit_limit_cents: 3000000 }
              as: AuctionAdmin
              captures: { buyer_id: $.data.id, avail: $.data.available_credit_cents }
          assert:
            - "response.status == 201"
            - "Buyer.${buyer_id}.available_credit_cents == 3000000"
            - "Buyer.${buyer_id}.committed_cents == 0"

      - name: condition_report_as_is_computed_from_grade
        claim_type: Computed Fields
        grounds: [entities.ConditionReport.fields.as_is, entities.ConditionReport.fields.grade]
        distinguishing_aspect: "A condition report with grade 2.5 (< 3.0) has as_is == true regardless of input; with grade 4.0 and no announcements as_is == false."
        test_recipe:
          setup: ["consignment exists"]
          setup_api_calls:
            - call: "POST /auction/sales"
              payload: { sale_name: "S", sale_date: "2026-06-02T09:00:00Z" }
              as: AuctionAdmin
              captures: { sale_id: $.data.id }
            - call: "POST /auction/sellers"
              payload: { dealer_name: "Seller A" }
              as: AuctionAdmin
              captures: { seller_id: $.data.id }
            - call: "POST /auction/consignments"
              payload: { sale_id: "${sale_id}", seller_id: "${seller_id}", vin: "1FTFW1ET5DFA00100" }
              as: AuctionAdmin
              captures: { cons_id: $.data.id }
          trigger:
            - call: "POST /auction/condition-reports"
              payload: { consignment_id: "${cons_id}", grade: 2.5, odometer_miles: 90000 }
              as: AuctionAdmin
              captures: { cr_id: $.data.id, as_is: $.data.as_is }
          assert:
            - "response.status == 201"
            - "ConditionReport.${cr_id}.as_is == true"

      - name: system_fields_generated_on_create
        claim_type: System Fields
        grounds: [entities.AuctionSale, entities.AuctionSale.fields.status]
        distinguishing_aspect: "id/created_at/updated_at/version are server-minted; client-supplied status is ignored (always DRAFT)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /auction/sales"
              payload: { sale_name: "S", sale_date: "2026-06-02T09:00:00Z" }
              as: AuctionAdmin
              captures: { sale_id: $.data.id, ver: $.data.version }
          assert:
            - "AuctionSale.${sale_id}.version == 1"
            - "AuctionSale.${sale_id}.status == DRAFT"

      - name: bid_is_immutable_event_no_version_field
        claim_type: Immutability
        grounds: [entities.Bid]
        distinguishing_aspect: "Bid has common_fields:false — it is append-only with only id+created_at; no update endpoint and no version field exist for Bid."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /auction/bids/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: AuctionAdmin
              captures: { error_id: $.data.error_id }
          assert:
            - "response.status == 404"
            - "response.data.error_id == ERR_BID_NOT_FOUND"

  # ---------------------------------------------------------------------------
  - section: endpoints
    instances:
      - name: list_sales_pagination_envelope
        claim_type: Listing
        grounds: [entities.AuctionSale, endpoints]
        distinguishing_aspect: "GET /auction/sales returns array envelope with total_count and has_more pagination fields."
        test_recipe:
          setup: ["one sale created"]
          setup_api_calls:
            - call: "POST /auction/sales"
              payload: { sale_name: "S1", sale_date: "2026-06-02T09:00:00Z" }
              as: AuctionAdmin
          trigger:
            - call: "GET /auction/sales?limit=10&offset=0"
              payload: {}
              as: AuctionAdmin
          assert:
            - "response.status == 200"
            - "response.response_type == array"
            - "response.data total_count >= 1 and has_more present"

      - name: list_lots_filtered_by_consignment_id
        claim_type: Listing
        grounds: [entities.RunListEntry.fields.consignment_id, endpoints]
        distinguishing_aspect: "GET /auction/lots?consignment_id=X returns only lots for that consignment (FK reverse-reachability filtered list)."
        test_recipe:
          setup: ["one cataloged consignment with one lot"]
          setup_api_calls:
            - call: "POST /auction/sales"
              payload: { sale_name: "S", sale_date: "2026-06-02T09:00:00Z" }
              as: AuctionAdmin
              captures: { sale_id: $.data.id }
            - call: "POST /auction/lanes"
              payload: { sale_id: "${sale_id}", lane_number: 1, open_minute: 0, close_minute: 600 }
              as: AuctionAdmin
              captures: { lane_id: $.data.id }
            - call: "POST /auction/sellers"
              payload: { dealer_name: "Seller A" }
              as: AuctionAdmin
              captures: { seller_id: $.data.id }
            - call: "POST /auction/consignments"
              payload: { sale_id: "${sale_id}", seller_id: "${seller_id}", vin: "1FTFW1ET5DFA00101" }
              as: AuctionAdmin
              captures: { cons_id: $.data.id }
            - call: "POST /auction/condition-reports"
              payload: { consignment_id: "${cons_id}", grade: 4.0, odometer_miles: 10000 }
              as: AuctionAdmin
            - call: "POST /auction/consignments/${cons_id}/catalog"
              payload: { reserve_price_cents: 0, floor_price_cents: 0 }
              as: AuctionAdmin
            - call: "POST /auction/lots"
              payload: { sale_id: "${sale_id}", consignment_id: "${cons_id}", lane_id: "${lane_id}", run_number: 1, slot_start_minute: 0, slot_end_minute: 10, starting_bid_cents: 400000 }
              as: AuctionAdmin
              captures: { lot_id: $.data.id }
          trigger:
            - call: "GET /auction/lots?consignment_id=${cons_id}"
              payload: {}
              as: AuctionAdmin
              captures: { first_lot: $.data.0.id }
          assert:
            - "response.status == 200"
            - "every returned RunListEntry has consignment_id == ${cons_id}"

  # ---------------------------------------------------------------------------
  - section: state_machines
    instances:
      - name: open_bidding_on_already_open_lot_returns_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - "state_machines.RunListEntry.SCHEDULED_to_BIDDING_OPEN"
          - "errors[ERR_LOT_NOT_SCHEDULED]"
        distinguishing_aspect: "open-bidding twice: the second call (lot already BIDDING_OPEN, not SCHEDULED) -> ERR_LOT_NOT_SCHEDULED (409)."
        test_recipe:
          setup: ["lot BIDDING_OPEN in a RUNNING sale"]
          setup_api_calls:
            - call: "POST /auction/sales"
              payload: { sale_name: "S", sale_date: "2026-06-02T09:00:00Z" }
              as: AuctionAdmin
              captures: { sale_id: $.data.id }
            - call: "POST /auction/lanes"
              payload: { sale_id: "${sale_id}", lane_number: 1, open_minute: 0, close_minute: 600 }
              as: AuctionAdmin
              captures: { lane_id: $.data.id }
            - call: "POST /auction/sellers"
              payload: { dealer_name: "Seller A" }
              as: AuctionAdmin
              captures: { seller_id: $.data.id }
            - call: "POST /auction/consignments"
              payload: { sale_id: "${sale_id}", seller_id: "${seller_id}", vin: "1FTFW1ET5DFA00102" }
              as: AuctionAdmin
              captures: { cons_id: $.data.id }
            - call: "POST /auction/condition-reports"
              payload: { consignment_id: "${cons_id}", grade: 4.0, odometer_miles: 10000 }
              as: AuctionAdmin
            - call: "POST /auction/consignments/${cons_id}/catalog"
              payload: { reserve_price_cents: 0, floor_price_cents: 0 }
              as: AuctionAdmin
            - call: "POST /auction/lots"
              payload: { sale_id: "${sale_id}", consignment_id: "${cons_id}", lane_id: "${lane_id}", run_number: 1, slot_start_minute: 0, slot_end_minute: 10, starting_bid_cents: 400000 }
              as: AuctionAdmin
              captures: { lot_id: $.data.id }
            - call: "POST /auction/sales/${sale_id}/open"
              payload: {}
              as: AuctionAdmin
            - call: "POST /auction/sales/${sale_id}/start"
              payload: {}
              as: AuctionAdmin
            - call: "POST /auction/lots/${lot_id}/open-bidding"
              payload: {}
              as: AuctionAdmin
          trigger:
            - call: "POST /auction/lots/${lot_id}/open-bidding"
              payload: {}
              as: AuctionAdmin
              captures: { error_id: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_LOT_NOT_SCHEDULED"

      - name: hammer_when_outcome_not_sold_returns_error
        claim_type: Precondition Enforcement
        grounds:
          - "state_machines.RunListEntry.BIDDING_CLOSED_to_HAMMERED"
          - "calculations.sale_outcome"
          - "errors[ERR_OUTCOME_NOT_SOLD]"
        distinguishing_aspect: "Lot BIDDING_CLOSED with no buyer bids (high_bidder null -> outcome PASSED): hammer -> ERR_OUTCOME_NOT_SOLD (409)."
        test_recipe:
          setup: ["lot opened then closed with zero buyer bids -> high_bidder null"]
          setup_api_calls:
            - call: "POST /auction/sales"
              payload: { sale_name: "S", sale_date: "2026-06-02T09:00:00Z" }
              as: AuctionAdmin
              captures: { sale_id: $.data.id }
            - call: "POST /auction/lanes"
              payload: { sale_id: "${sale_id}", lane_number: 1, open_minute: 0, close_minute: 600 }
              as: AuctionAdmin
              captures: { lane_id: $.data.id }
            - call: "POST /auction/sellers"
              payload: { dealer_name: "Seller A" }
              as: AuctionAdmin
              captures: { seller_id: $.data.id }
            - call: "POST /auction/consignments"
              payload: { sale_id: "${sale_id}", seller_id: "${seller_id}", vin: "1FTFW1ET5DFA00103" }
              as: AuctionAdmin
              captures: { cons_id: $.data.id }
            - call: "POST /auction/condition-reports"
              payload: { consignment_id: "${cons_id}", grade: 4.0, odometer_miles: 10000 }
              as: AuctionAdmin
            - call: "POST /auction/consignments/${cons_id}/catalog"
              payload: { reserve_price_cents: 0, floor_price_cents: 0 }
              as: AuctionAdmin
            - call: "POST /auction/lots"
              payload: { sale_id: "${sale_id}", consignment_id: "${cons_id}", lane_id: "${lane_id}", run_number: 1, slot_start_minute: 0, slot_end_minute: 10, starting_bid_cents: 400000 }
              as: AuctionAdmin
              captures: { lot_id: $.data.id }
            - call: "POST /auction/sales/${sale_id}/open"
              payload: {}
              as: AuctionAdmin
            - call: "POST /auction/sales/${sale_id}/start"
              payload: {}
              as: AuctionAdmin
            - call: "POST /auction/lots/${lot_id}/open-bidding"
              payload: {}
              as: AuctionAdmin
            - call: "POST /auction/lots/${lot_id}/close-bidding"
              payload: {}
              as: AuctionAdmin
          trigger:
            - call: "POST /auction/lots/${lot_id}/hammer"
              payload: {}
              as: AuctionAdmin
              captures: { error_id: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_OUTCOME_NOT_SOLD"

      - name: terminal_settled_sale_rejects_further_transitions
        claim_type: Terminal State Lockdown
        grounds:
          - "state_machines.AuctionSale.CLOSED_to_SETTLED"
          - "errors[ERR_SALE_NOT_RUNNING]"
        distinguishing_aspect: "A SETTLED sale is terminal: calling close again -> ERR_SALE_NOT_RUNNING (409)."
        test_recipe:
          setup: ["sale with no consignments taken through DRAFT->OPEN->RUNNING->CLOSED->SETTLED (no settlements to block)"]
          setup_api_calls:
            - call: "POST /auction/sales"
              payload: { sale_name: "S", sale_date: "2026-06-02T09:00:00Z" }
              as: AuctionAdmin
              captures: { sale_id: $.data.id }
            - call: "POST /auction/lanes"
              payload: { sale_id: "${sale_id}", lane_number: 1, open_minute: 0, close_minute: 600 }
              as: AuctionAdmin
              captures: { lane_id: $.data.id }
            - call: "POST /auction/sales/${sale_id}/open"
              payload: {}
              as: AuctionAdmin
            - call: "POST /auction/sales/${sale_id}/start"
              payload: {}
              as: AuctionAdmin
            - call: "POST /auction/sales/${sale_id}/close"
              payload: {}
              as: AuctionAdmin
            - call: "POST /auction/sales/${sale_id}/settle"
              payload: {}
              as: AuctionAdmin
          trigger:
            - call: "POST /auction/sales/${sale_id}/close"
              payload: {}
              as: AuctionAdmin
              captures: { error_id: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_SALE_NOT_RUNNING"

      - name: catalog_without_condition_report_returns_error
        claim_type: Precondition Enforcement
        grounds:
          - "state_machines.Consignment.SUBMITTED_to_CATALOGED"
          - "errors[ERR_CONDITION_REPORT_MISSING]"
        distinguishing_aspect: "Cataloging a SUBMITTED consignment with no attached condition report -> ERR_CONDITION_REPORT_MISSING (409)."
        test_recipe:
          setup: ["consignment SUBMITTED, no condition report"]
          setup_api_calls:
            - call: "POST /auction/sales"
              payload: { sale_name: "S", sale_date: "2026-06-02T09:00:00Z" }
              as: AuctionAdmin
              captures: { sale_id: $.data.id }
            - call: "POST /auction/sellers"
              payload: { dealer_name: "Seller A" }
              as: AuctionAdmin
              captures: { seller_id: $.data.id }
            - call: "POST /auction/consignments"
              payload: { sale_id: "${sale_id}", seller_id: "${seller_id}", vin: "1FTFW1ET5DFA00104" }
              as: AuctionAdmin
              captures: { cons_id: $.data.id }
          trigger:
            - call: "POST /auction/consignments/${cons_id}/catalog"
              payload: { reserve_price_cents: 0, floor_price_cents: 0 }
              as: AuctionAdmin
              captures: { error_id: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_CONDITION_REPORT_MISSING"

      - name: redeem_gatepass_without_dispatched_transport_returns_error
        claim_type: Precondition Enforcement
        grounds:
          - "state_machines.GatePass.ISSUED_to_REDEEMED"
          - "errors[ERR_NO_DISPATCHED_TRANSPORT]"
        distinguishing_aspect: "Redeeming an ISSUED gate pass with no DISPATCHED transport order for its settlement -> ERR_NO_DISPATCHED_TRANSPORT (409)."
        test_recipe:
          setup: ["CLEARED settlement (payment+title) -> auto-issued GatePass; no transport order created"]
          setup_api_calls:
            - call: "POST /auction/sales"
              payload: { sale_name: "S", sale_date: "2026-06-02T09:00:00Z" }
              as: AuctionAdmin
              captures: { sale_id: $.data.id }
            - call: "POST /auction/lanes"
              payload: { sale_id: "${sale_id}", lane_number: 1, open_minute: 0, close_minute: 600 }
              as: AuctionAdmin
              captures: { lane_id: $.data.id }
            - call: "POST /auction/sellers"
              payload: { dealer_name: "Seller A" }
              as: AuctionAdmin
              captures: { seller_id: $.data.id }
            - call: "POST /auction/buyers"
              payload: { dealer_name: "B1", credit_limit_cents: 5000000 }
              as: AuctionAdmin
              captures: { b1_id: $.data.id }
            - call: "POST /auction/consignments"
              payload: { sale_id: "${sale_id}", seller_id: "${seller_id}", vin: "1FTFW1ET5DFA00105" }
              as: AuctionAdmin
              captures: { cons_id: $.data.id }
            - call: "POST /auction/condition-reports"
              payload: { consignment_id: "${cons_id}", grade: 4.0, odometer_miles: 10000 }
              as: AuctionAdmin
            - call: "POST /auction/consignments/${cons_id}/catalog"
              payload: { reserve_price_cents: 0, floor_price_cents: 0 }
              as: AuctionAdmin
            - call: "POST /auction/lots"
              payload: { sale_id: "${sale_id}", consignment_id: "${cons_id}", lane_id: "${lane_id}", run_number: 1, slot_start_minute: 0, slot_end_minute: 10, starting_bid_cents: 400000 }
              as: AuctionAdmin
              captures: { lot_id: $.data.id }
            - call: "POST /auction/sales/${sale_id}/open"
              payload: {}
              as: AuctionAdmin
            - call: "POST /auction/sales/${sale_id}/start"
              payload: {}
              as: AuctionAdmin
            - call: "POST /auction/lots/${lot_id}/open-bidding"
              payload: {}
              as: AuctionAdmin
              captures: { v0: $.data.version }
            - call: "POST /auction/lots/${lot_id}/bids"
              payload: { buyer_id: "${b1_id}", bid_type: "PROXY", amount_cents: 800000, channel: "LANE", expected_lot_version: "${v0}" }
              as: Buyer
              as_user_id: "${b1_id}"
            - call: "POST /auction/lots/${lot_id}/close-bidding"
              payload: {}
              as: AuctionAdmin
            - call: "POST /auction/lots/${lot_id}/hammer"
              payload: {}
              as: AuctionAdmin
            - call: "GET /auction/settlements?lot_id=${lot_id}"
              payload: {}
              as: AuctionAdmin
              captures: { settlement_id: $.data.0.id }
            - call: "POST /auction/settlements/${settlement_id}/record-payment"
              payload: {}
              as: AuctionAdmin
            - call: "POST /auction/settlements/${settlement_id}/record-title"
              payload: {}
              as: AuctionAdmin
            - call: "GET /auction/gate-passes?settlement_id=${settlement_id}"
              payload: {}
              as: AuctionAdmin
              captures: { gate_pass_id: $.data.0.id }
          trigger:
            - call: "POST /auction/gate-passes/${gate_pass_id}/redeem"
              payload: {}
              as: AuctionAdmin
              captures: { error_id: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_NO_DISPATCHED_TRANSPORT"

      - name: write_off_suspends_buyer_and_recredits
        claim_type: Side Effect Execution
        grounds: [state_machines.Settlement.OPEN_to_DEFAULTED, entities.Buyer.fields.status, entities.Buyer.fields.available_credit_cents]
        distinguishing_aspect: "write-off on an UNPAID settlement after sale CLOSED -> payment WRITTEN_OFF, status DEFAULTED, buyer re-credited and SUSPENDED."
        test_recipe:
          setup: ["hammered lot UNPAID; sale CLOSED so write-off precondition holds"]
          setup_api_calls:
            - call: "POST /auction/sales"
              payload: { sale_name: "S", sale_date: "2026-06-02T09:00:00Z" }
              as: AuctionAdmin
              captures: { sale_id: $.data.id }
            - call: "POST /auction/lanes"
              payload: { sale_id: "${sale_id}", lane_number: 1, open_minute: 0, close_minute: 600 }
              as: AuctionAdmin
              captures: { lane_id: $.data.id }
            - call: "POST /auction/sellers"
              payload: { dealer_name: "Seller A" }
              as: AuctionAdmin
              captures: { seller_id: $.data.id }
            - call: "POST /auction/buyers"
              payload: { dealer_name: "B1", credit_limit_cents: 5000000 }
              as: AuctionAdmin
              captures: { b1_id: $.data.id }
            - call: "POST /auction/consignments"
              payload: { sale_id: "${sale_id}", seller_id: "${seller_id}", vin: "1FTFW1ET5DFA00106" }
              as: AuctionAdmin
              captures: { cons_id: $.data.id }
            - call: "POST /auction/condition-reports"
              payload: { consignment_id: "${cons_id}", grade: 4.0, odometer_miles: 10000 }
              as: AuctionAdmin
            - call: "POST /auction/consignments/${cons_id}/catalog"
              payload: { reserve_price_cents: 0, floor_price_cents: 0 }
              as: AuctionAdmin
            - call: "POST /auction/lots"
              payload: { sale_id: "${sale_id}", consignment_id: "${cons_id}", lane_id: "${lane_id}", run_number: 1, slot_start_minute: 0, slot_end_minute: 10, starting_bid_cents: 400000 }
              as: AuctionAdmin
              captures: { lot_id: $.data.id }
            - call: "POST /auction/sales/${sale_id}/open"
              payload: {}
              as: AuctionAdmin
            - call: "POST /auction/sales/${sale_id}/start"
              payload: {}
              as: AuctionAdmin
            - call: "POST /auction/lots/${lot_id}/open-bidding"
              payload: {}
              as: AuctionAdmin
              captures: { v0: $.data.version }
            - call: "POST /auction/lots/${lot_id}/bids"
              payload: { buyer_id: "${b1_id}", bid_type: "PROXY", amount_cents: 800000, channel: "LANE", expected_lot_version: "${v0}" }
              as: Buyer
              as_user_id: "${b1_id}"
            - call: "POST /auction/lots/${lot_id}/close-bidding"
              payload: {}
