            - "That PayoutLine.reserve_cents == 3500"
            - "That PayoutLine.recovery_cents == 7000"
            - "That PayoutLine.withholding_cents == 14280"
            - "That PayoutLine.payout_amount_cents == 45220"
            - "That PayoutLine.status == PAYABLE"

  - rule_id: non_linear_state_machine
    instances:
      - name: app_review_revision_cycle_returns_listing_to_in_review_round_two
        grounds:
          - state_machines.App.CHANGES_REQUESTED_to_IN_REVIEW
          - state_machines.ReviewSubmission.IN_TRIAGE_to_REJECTED
          - entities.App.fields.review_round
          - entities.ReviewSubmission.fields.round_number
        distinguishing_aspect: |
          Non-linear shape on the App entity: a cycle DRAFT -> IN_REVIEW -> CHANGES_REQUESTED ->
          DRAFT -> IN_REVIEW, proven by App.review_round reaching 2 and a second ReviewSubmission
          carrying round_number 2 for the same listing.
        test_recipe:
