            - "Reader.${rd_loyal}.churn_risk_band == LOW"
            - "Reader.${rd_loyal}.intervention_count_in_period == 0"
            - "ReaderEvent rows for Reader.${rd_loyal} == 6"

  - rule_id: resource_temporal_overlap
    instances:
