      - name: backfill_budget_conserved_across_order_and_cancel
        grounds:
          - calculations.backfill_budget_projection
          - state_machines.BackfillPurchase.ORDERED_to_CANCELLED
          - state_machines.BackfillPurchase.ORDERED_to_PURCHASED
        distinguishing_aspect: |
          Conserved quantity = campaign.backfill_budget_cents -
          campaign.backfill_spent_cents (the remaining pool). An ORDERED
          purchase reserves quoted_cost provisionally; cancelling it MUST
          release the reservation (spent unchanged), and marking it PURCHASED
          at a final_cost different from quoted MUST adjust spent by exactly
          final_cost, never by quoted. Pairing ORDERED+ORDERED+ cancellations
          leaves the pool invariant at the original value.
        test_recipe:
          setup:
            - "campaign backfill_budget_cents=10000; two ORDERED purchases BP1(quoted 3000) and BP2(quoted 4000)"
