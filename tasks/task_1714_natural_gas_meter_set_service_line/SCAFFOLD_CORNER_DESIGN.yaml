  # ===========================================================================
  - section: calculations
    instances:
      - name: diversity_factor_tier_applied
        claim_type: correct_result_and_tier_selection
        grounds: [calculations.load_calculation, "entities.ServiceApplication.fields.diversity_adjusted_load_cfph"]
        distinguishing_aspect: "Four load rows (80+40+65+35 = 220.0 CFPH connected) fall in the 4–6 tier: factor 0.75 → adjusted exactly 165.0; the tier table — not a flat factor — drives the result."
        test_recipe:
          setup: ["builder + DRAFT application with four appliance rows"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T09:00:00Z" }, as: SystemAdmin }
            - call: "POST /builders"
              payload: { company_name: "Acme Homes", contact_email: "ops@acme.example", license_number: "ST-12345" }
              as: NewBusinessRep
              captures: { b_id: $.data.id }
            - call: "POST /service-applications"
              payload: { builder_id: "${b_id}", service_address: "12 Main St", city: "Springfield", state_code: "IL", postal_code: "62701", requested_in_service_date: "2026-10-01" }
              as: Builder
              as_user_id: "${b_id}"
              captures: { app_id: $.data.id }
            - { call: "POST /appliance-loads", payload: { service_application_id: "${app_id}", appliance_type: FURNACE, quantity: 1, btuh_input_rating: 80000 }, as: Builder, as_user_id: "${b_id}" }
            - { call: "POST /appliance-loads", payload: { service_application_id: "${app_id}", appliance_type: WATER_HEATER, quantity: 1, btuh_input_rating: 40000 }, as: Builder, as_user_id: "${b_id}" }
            - { call: "POST /appliance-loads", payload: { service_application_id: "${app_id}", appliance_type: RANGE, quantity: 1, btuh_input_rating: 65000 }, as: Builder, as_user_id: "${b_id}" }
            - { call: "POST /appliance-loads", payload: { service_application_id: "${app_id}", appliance_type: DRYER, quantity: 1, btuh_input_rating: 35000 }, as: Builder, as_user_id: "${b_id}" }
          trigger:
            - { call: "POST /service-applications/${app_id}/submit", payload: {}, as: Builder, as_user_id: "${b_id}" }
          assert:
            - "ServiceApplication.${app_id}.appliance_count == 4"
            - "ServiceApplication.${app_id}.total_connected_load_cfph == 220.0"
            - "ServiceApplication.${app_id}.diversity_adjusted_load_cfph == 165.0 (220.0 × 0.75 tier factor)"
            - "per-row counted_load_cfph values are 80.0 / 40.0 / 65.0 / 35.0 (quantity × btuh / 1000, 1 decimal)"

