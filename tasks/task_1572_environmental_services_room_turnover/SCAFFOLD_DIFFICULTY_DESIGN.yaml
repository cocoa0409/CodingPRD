              as: EVSDispatcher
            - call: "POST /evs/clean-requests/${rm1}/start"
              payload: {}
              as: EVSTechnician
              as_user_id: "${tm}"
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T12:50:00Z" }, as: EVSAdministrator }
            - call: "POST /evs/clean-requests/${rm1}/complete"
              payload: {}
              as: EVSTechnician
              as_user_id: "${tm}"
            - call: "POST /evs/quality-audits"
              payload: { clean_request_id: "${rm1}", audit_method: "ATP_SWAB", rlu_reading: 50 }
              as: QualityAuditor
              as_user_id: "${a1}"
            # T_MISS second pass 13:00-14:30
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T13:00:00Z" }, as: EVSAdministrator }
            - call: "POST /evs/clean-requests"
              payload: { bed_id: "${bm2}", clean_type: "TERMINAL" }
              as: EVSDispatcher
              captures: { rm2: $.data.id }
            - call: "POST /evs/clean-requests/${rm2}/assign"
              payload: { staff_id: "${tm}" }
              as: EVSDispatcher
            - call: "POST /evs/clean-requests/${rm2}/start"
              payload: {}
              as: EVSTechnician
              as_user_id: "${tm}"
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T14:30:00Z" }, as: EVSAdministrator }
            - call: "POST /evs/clean-requests/${rm2}/complete"
              payload: {}
              as: EVSTechnician
              as_user_id: "${tm}"
            - call: "POST /evs/quality-audits"
              payload: { clean_request_id: "${rm2}", audit_method: "ATP_SWAB", rlu_reading: 50 }
              as: QualityAuditor
              as_user_id: "${a1}"
            # T_MISS failed clean 14:40-16:10
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T14:40:00Z" }, as: EVSAdministrator }
            - call: "POST /evs/clean-requests"
              payload: { bed_id: "${bm3}", clean_type: "TERMINAL" }
              as: EVSDispatcher
              captures: { rm3: $.data.id }
            - call: "POST /evs/clean-requests/${rm3}/assign"
              payload: { staff_id: "${tm}" }
              as: EVSDispatcher
            - call: "POST /evs/clean-requests/${rm3}/start"
              payload: {}
              as: EVSTechnician
