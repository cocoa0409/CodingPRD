            - { call: "POST /fair-lending/underwriting-overrides", payload: { application_id: "${a1}", original_decision: DENY, overridden_decision: APPROVE, justification: "compensating factors" }, as: LoanOfficer, as_user_id: "${o1}", captures: { ov1: $.data.id } }
            - { call: "POST /fair-lending/underwriting-overrides", payload: { application_id: "${a2}", original_decision: DENY, overridden_decision: APPROVE, justification: "compensating factors" }, as: LoanOfficer, as_user_id: "${o1}", captures: { ov2: $.data.id } }
            - { call: "POST /fair-lending/underwriting-overrides/${ov1}/confirm", payload: {}, as: FairLendingOfficer }
            - { call: "POST /fair-lending/underwriting-overrides/${ov2}/confirm", payload: {}, as: FairLendingOfficer }
            - { call: "POST /fair-lending/pricing-exceptions", payload: { application_id: "${a7}", kind: RATE_ABOVE_CAP, requested_rate_bps: 770, justification: "strategic relationship" }, as: LoanOfficer, as_user_id: "${o1}", captures: { e1: $.data.id } }
            - { call: "GET /fair-lending/loan-officers/${o1}/risk-scorecard", payload: {}, as: FairLendingAnalyst, captures: { score_pre: $.data.risk_score, tier_pre: $.data.monitoring_tier } }
          trigger:
            - { call: "POST /fair-lending/pricing-exceptions/${e1}/approve", payload: {}, as: FairLendingOfficer }
            - { call: "GET /fair-lending/loan-officers/${o1}/risk-scorecard", payload: {}, as: FairLendingAnalyst, captures: { score_post: $.data.risk_score, tier_post: $.data.monitoring_tier, ovr_rate: $.data.override_rate, exc_rate: $.data.exception_approval_rate, disp: $.data.pricing_dispersion_bps } }
          assert:
            - "pre-approval scorecard: risk_score == 65.00 and monitoring_tier == WATCH (2 overrides -> 40 x 1.0 + 0 + 25 x 1.0)"
            - "post-approval: override_rate == 0.20, exception_approval_rate == 0.10, pricing_dispersion_bps == 70"
            - "post-approval: risk_score == 100.00 (40 + 35 + 25 = 100, outer min cap binds) and monitoring_tier == RED"
            - "PricingException.${e1}.status == APPROVED and Application.${a7}.has_exception == APPROVED"

      - name: remediation_allocation_per_line_rounding_then_residual
        grounds:
          - calculations.remediation_pool_allocation
          - entities.CorrectiveActionPlan.fields.remaining_cents
          - entities.RemediationPayment.fields.amount_cents
        distinguishing_aspect: |
          Mode (b): nested rounding with a pinned order — round each equal
          share half-up to whole cents FIRST (round_half_up(10000/3) = 3333),
          THEN reconcile the residual (+1 cent) onto the payment whose
          application appears FIRST in harmed_application_ids. Sum-then-round would give
          3333.33 per payment conceptually; the pinned order yields exactly
          [3334, 3333, 3333] and remaining_cents == 0.
        test_recipe:
          setup:
            - "Run R (M1, CONVENTIONAL, RACE, Q1) COMPUTED over 4 VALIDATED originated applications (1 CONTROL + 3 PROTECTED_1), no auto-findings"
            - "Manual finding F kind=PRICING_DISPARITY UNDER_REVIEW then SUBSTANTIATED with harmed_application_ids [p1, p2, p3] in creation order p1 < p2 < p3"
            - "CAP C pool_cents=10000, due 2026-06-30, SUBMITTED"
          setup_api_calls:
            - { call: "POST /fair-lending/markets", payload: { name: "Metro One", msa_code: "M001", protected_group_population_share: 0.40, peer_group_code: "PG7" }, as: BankAdmin, captures: { m1: $.data.id } }
