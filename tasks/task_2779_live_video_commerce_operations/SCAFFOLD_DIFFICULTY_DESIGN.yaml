            - call: "POST /flash-offers/${oC}/activate"
              payload: {}
              as: MerchandisingManager
            - *c_cart1
          trigger:
            - call: "POST /carts/${ct1}/items"
              payload: { flash_offer_id: "${oC}", qty: 3 }
              as: Viewer
              as_user_id: "${v1}"
              captures: { itC: $.data.id }
            - call: "GET /carts/${ct1}"
              payload: {}
