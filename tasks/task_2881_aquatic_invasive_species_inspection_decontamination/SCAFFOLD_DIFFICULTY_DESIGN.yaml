          percentage of the total fee, and the total fee includes the surcharge"),
          and the pinned order resolves it: the tier is chosen from the
          PRE-surcharge subtotal 24550 (the 5 percent band) even though the
          resulting total 25778 lands above SURCHARGE_TIER_2_THRESHOLD_CENTS. An
          implementation that re-selects the tier from the total produces 27005,
