scaffold_difficulty_design:
  # =====================================================================
  # Rule 1 - dual_variant_calc
  # Two dual-variant calculations on different entity domains:
  #   (i)  QualityRisk residual risk  - additive-capped vs multiplicative fold
  #   (ii) InternalInspection cycle   - per-selection weighting vs component
  #                                     concentration
  # =====================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: residual_risk_design_basis_cap_vs_operating_basis_fold
        grounds:
          - calculations.residual_risk_score
          - entities.QualityRisk.fields.residual_risk_score
          - entities.QualityRisk.fields.severity_band
          - entities.QualityRisk.fields.evaluation_basis
          - state_machines.QualityRisk.RESPONDED_to_EVALUATED
          - entities.RiskResponse.fields.design_effectiveness
          - entities.RiskResponse.fields.operating_effectiveness
        distinguishing_aspect: |
          On the QualityRisk entity domain, two identically-populated risks (inherent 25, three
          TESTED responses all EFFECTIVE) evaluate to 5.00/MODERATE under DESIGN_BASIS (additive
          mitigation 1.05 clamped by DESIGN_MITIGATION_CAP 0.80) and to 8.58/HIGH under
          OPERATING_BASIS (multiplicative uncapped fold 25*0.70^3 = 8.575), so both the number and
          the severity_band diverge for identical input data.
        test_recipe:
          setup:
            - "Firm 'Calder Mote LLP' registered, risk_posture STABLE."
            - "Partner Quinn Cade carries QC_DIRECTOR and acts as QualityControlDirector."
            - "QualityRisk QO-A and QualityRisk QO-B both on component ENGAGEMENT_PERFORMANCE with likelihood 5 and impact 5, so inherent_risk_score is 25 on both; both sit in state RESPONDED."
            - "Each risk carries exactly three RiskResponse rows in status TESTED with design_effectiveness EFFECTIVE and operating_effectiveness EFFECTIVE, all stamped tested_on at the default logical clock 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /firms"
              payload: { legal_name: "Calder Mote LLP", state_code: "CA", aa_hours_last_year: 400, peer_review_year_end: "2026-12-31" }
              as: SystemAdmin
              captures: { firm_id: $.data.id }
            - call: "POST /firms/${firm_id}/partners"
              payload: { full_name: "Quinn Cade", cpa_license_state: "CA", designations: ["QC_DIRECTOR"], cpe_hours_last_3y: 200 }
              as: SystemAdmin
              captures: { p_qc_id: $.data.id }
            - call: "POST /firms/${firm_id}/quality-risks"
              payload: { component: "ENGAGEMENT_PERFORMANCE", quality_objective_code: "QO-A", risk_statement: "Insufficient partner review of significant judgements.", likelihood: 5, impact: 5 }
              as: QualityControlDirector
              as_user_id: "${p_qc_id}"
              captures: { risk_a_id: $.data.id }
            - call: "POST /firms/${firm_id}/quality-risks"
              payload: { component: "ENGAGEMENT_PERFORMANCE", quality_objective_code: "QO-B", risk_statement: "Insufficient partner review of significant judgements.", likelihood: 5, impact: 5 }
              as: QualityControlDirector
              as_user_id: "${p_qc_id}"
              captures: { risk_b_id: $.data.id }
            - call: "POST /quality-risks/${risk_a_id}/responses"
              payload: { response_type: "PREVENTIVE", description: "Mandatory second-partner sign-off on judgemental areas." }
              as: QualityControlDirector
              as_user_id: "${p_qc_id}"
              captures: { resp_a1_id: $.data.id }
            - call: "POST /quality-risks/${risk_a_id}/responses"
              payload: { response_type: "DETECTIVE", description: "Quarterly file review sample by the QC director." }
              as: QualityControlDirector
              as_user_id: "${p_qc_id}"
              captures: { resp_a2_id: $.data.id }
            - call: "POST /quality-risks/${risk_a_id}/responses"
              payload: { response_type: "PREVENTIVE", description: "Annual technical training on judgemental estimates." }
              as: QualityControlDirector
              as_user_id: "${p_qc_id}"
              captures: { resp_a3_id: $.data.id }
            - call: "POST /risk-responses/${resp_a1_id}/effectiveness-tests"
              payload: { design_effectiveness: "EFFECTIVE", operating_effectiveness: "EFFECTIVE" }
              as: QualityControlDirector
              as_user_id: "${p_qc_id}"
            - call: "POST /risk-responses/${resp_a2_id}/effectiveness-tests"
              payload: { design_effectiveness: "EFFECTIVE", operating_effectiveness: "EFFECTIVE" }
              as: QualityControlDirector
              as_user_id: "${p_qc_id}"
            - call: "POST /risk-responses/${resp_a3_id}/effectiveness-tests"
              payload: { design_effectiveness: "EFFECTIVE", operating_effectiveness: "EFFECTIVE" }
              as: QualityControlDirector
              as_user_id: "${p_qc_id}"
            - call: "POST /quality-risks/${risk_b_id}/responses"
              payload: { response_type: "PREVENTIVE", description: "Mandatory second-partner sign-off on judgemental areas." }
              as: QualityControlDirector
              as_user_id: "${p_qc_id}"
              captures: { resp_b1_id: $.data.id }
            - call: "POST /quality-risks/${risk_b_id}/responses"
              payload: { response_type: "DETECTIVE", description: "Quarterly file review sample by the QC director." }
              as: QualityControlDirector
              as_user_id: "${p_qc_id}"
              captures: { resp_b2_id: $.data.id }
            - call: "POST /quality-risks/${risk_b_id}/responses"
              payload: { response_type: "PREVENTIVE", description: "Annual technical training on judgemental estimates." }
              as: QualityControlDirector
              as_user_id: "${p_qc_id}"
              captures: { resp_b3_id: $.data.id }
            - call: "POST /risk-responses/${resp_b1_id}/effectiveness-tests"
              payload: { design_effectiveness: "EFFECTIVE", operating_effectiveness: "EFFECTIVE" }
              as: QualityControlDirector
              as_user_id: "${p_qc_id}"
            - call: "POST /risk-responses/${resp_b2_id}/effectiveness-tests"
              payload: { design_effectiveness: "EFFECTIVE", operating_effectiveness: "EFFECTIVE" }
              as: QualityControlDirector
              as_user_id: "${p_qc_id}"
            - call: "POST /risk-responses/${resp_b3_id}/effectiveness-tests"
              payload: { design_effectiveness: "EFFECTIVE", operating_effectiveness: "EFFECTIVE" }
              as: QualityControlDirector
              as_user_id: "${p_qc_id}"
          trigger:
            - call: "POST /quality-risks/${risk_a_id}/evaluations"
              payload: { basis: "DESIGN_BASIS" }
              as: QualityControlDirector
              as_user_id: "${p_qc_id}"
            - call: "POST /quality-risks/${risk_b_id}/evaluations"
              payload: { basis: "OPERATING_BASIS" }
              as: QualityControlDirector
              as_user_id: "${p_qc_id}"
          assert:
            - "QualityRisk.${risk_a_id}.inherent_risk_score == 25"
            - "QualityRisk.${risk_b_id}.inherent_risk_score == 25"
            - "QualityRisk.${risk_a_id}.evaluation_basis == DESIGN_BASIS"
            - "QualityRisk.${risk_a_id}.residual_risk_score == 5.00"
            - "QualityRisk.${risk_a_id}.severity_band == MODERATE"
            - "QualityRisk.${risk_b_id}.evaluation_basis == OPERATING_BASIS"
            - "QualityRisk.${risk_b_id}.residual_risk_score == 8.58"
            - "QualityRisk.${risk_b_id}.severity_band == HIGH"
            - "QualityRisk.${risk_a_id}.residual_risk_score != QualityRisk.${risk_b_id}.residual_risk_score"
            - "QualityRisk.${risk_a_id}.state == EVALUATED and QualityRisk.${risk_b_id}.state == EVALUATED"
            - "Firm.${firm_id}.critical_risk_count == 0"
            - "Firm.${firm_id}.risk_posture == STABLE"

      - name: severity_index_engagement_weighted_vs_firm_pervasive_across_two_cycles
        grounds:
          - calculations.deficiency_severity_index
          - entities.InternalInspection.fields.deficiency_severity_index
          - entities.InternalInspection.fields.severity_index_basis
          - entities.InspectionSelection.fields.weighted_points
          - state_machines.InternalInspection.IN_PROGRESS_to_FINDINGS_CLASSIFIED
          - calculations.inspection_engagement_selection
        distinguishing_aspect: |
          On the InternalInspection entity domain - not QualityRisk - two structurally identical
          cycles (one must-select-flagged selection carrying one MATERIAL_FAILURE SYSTEMIC finding
          in component ENGAGEMENT_PERFORMANCE) yield deficiency_severity_index 30.00 under
          ENGAGEMENT_WEIGHTED (round(20*1.5,2)/1) and 25.00 under FIRM_PERVASIVE ((20+5)/1), because
          ENGAGEMENT_WEIGHTED honours is_must_select while FIRM_PERVASIVE ignores it and adds the
          systemic bonus instead.
        test_recipe:
          setup:
            - "Firm 'Dunmore Reach LLP' with two engagement partners, each owning exactly one AUDIT engagement in workflow_state REPORT_RELEASED and file_state OPEN."
            - "Engagement E1 has period_end 2024-06-30, Engagement E2 has period_end 2025-06-30, so each falls into a different inspection-year window."
            - "InternalInspection 2024 selected E1 alone as MUST_SELECT_PARTNER_COVERAGE (is_must_select true, selected_rank 1); InternalInspection 2025 selected E2 alone the same way."
            - "Each cycle is in state IN_PROGRESS carrying exactly one InspectionFinding classified MATERIAL_FAILURE, pervasiveness SYSTEMIC, sqm_component ENGAGEMENT_PERFORMANCE, class_points 20."
          setup_api_calls:
            - call: "POST /firms"
              payload: { legal_name: "Dunmore Reach LLP", state_code: "CA", aa_hours_last_year: 400, peer_review_year_end: "2026-12-31" }
              as: SystemAdmin
              captures: { firm_id: $.data.id }
            - call: "POST /firms/${firm_id}/partners"
              payload: { full_name: "Eli Parch", cpa_license_state: "CA", designations: ["ENGAGEMENT_PARTNER"], cpe_hours_last_3y: 200 }
              as: SystemAdmin
              captures: { p_ep1_id: $.data.id }
            - call: "POST /firms/${firm_id}/partners"
              payload: { full_name: "Rhea Solt", cpa_license_state: "CA", designations: ["ENGAGEMENT_PARTNER"], cpe_hours_last_3y: 200 }
              as: SystemAdmin
              captures: { p_ep2_id: $.data.id }
            - call: "POST /firms/${firm_id}/partners"
              payload: { full_name: "Quinn Cade", cpa_license_state: "CA", designations: ["QC_DIRECTOR"], cpe_hours_last_3y: 200 }
              as: SystemAdmin
              captures: { p_qc_id: $.data.id }
            - call: "POST /engagements"
              payload: { firm_id: "${firm_id}", client_name: "Alder Foods", engagement_type: "AUDIT", period_end: "2024-06-30", engagement_partner_id: "${p_ep1_id}" }
              as: EngagementPartner
              as_user_id: "${p_ep1_id}"
              captures: { e1_id: $.data.id }
            - call: "POST /engagements/${e1_id}/workflow-transitions"
              payload: { to_state: "FIELDWORK" }
              as: EngagementPartner
              as_user_id: "${p_ep1_id}"
            - call: "POST /engagements/${e1_id}/workflow-transitions"
              payload: { to_state: "EQR_PENDING" }
              as: EngagementPartner
              as_user_id: "${p_ep1_id}"
            - call: "POST /engagements/${e1_id}/workflow-transitions"
              payload: { to_state: "EQR_CLEARED" }
              as: EngagementPartner
              as_user_id: "${p_ep1_id}"
            - call: "POST /engagements/${e1_id}/workflow-transitions"
              payload: { to_state: "REPORT_RELEASED" }
              as: EngagementPartner
              as_user_id: "${p_ep1_id}"
            - call: "POST /engagements"
              payload: { firm_id: "${firm_id}", client_name: "Bramble Retail", engagement_type: "AUDIT", period_end: "2025-06-30", engagement_partner_id: "${p_ep2_id}" }
              as: EngagementPartner
              as_user_id: "${p_ep2_id}"
              captures: { e2_id: $.data.id }
            - call: "POST /engagements/${e2_id}/workflow-transitions"
              payload: { to_state: "FIELDWORK" }
              as: EngagementPartner
              as_user_id: "${p_ep2_id}"
            - call: "POST /engagements/${e2_id}/workflow-transitions"
              payload: { to_state: "EQR_PENDING" }
              as: EngagementPartner
              as_user_id: "${p_ep2_id}"
            - call: "POST /engagements/${e2_id}/workflow-transitions"
              payload: { to_state: "EQR_CLEARED" }
              as: EngagementPartner
              as_user_id: "${p_ep2_id}"
            - call: "POST /engagements/${e2_id}/workflow-transitions"
              payload: { to_state: "REPORT_RELEASED" }
              as: EngagementPartner
              as_user_id: "${p_ep2_id}"
            - call: "POST /firms/${firm_id}/internal-inspections"
              payload: { inspection_year: 2024, target_engagement_count: 1 }
              as: QualityControlDirector
              as_user_id: "${p_qc_id}"
              captures: { insp1_id: $.data.id }
            - call: "POST /internal-inspections/${insp1_id}/selections"
              payload: {}
              as: QualityControlDirector
              as_user_id: "${p_qc_id}"
            - call: "POST /internal-inspections/${insp1_id}/transitions"
              payload: { to_state: "IN_PROGRESS" }
              as: QualityControlDirector
              as_user_id: "${p_qc_id}"
            - call: "GET /inspection-selections"
              payload: { inspection_id: "${insp1_id}" }
              as: QualityControlDirector
              as_user_id: "${p_qc_id}"
              captures: { sel1_id: "$.data[0].id" }
            - call: "POST /inspection-selections/${sel1_id}/findings"
              payload: { title: "Group audit instructions not evidenced", sqm_component: "ENGAGEMENT_PERFORMANCE" }
              as: QualityControlDirector
              as_user_id: "${p_qc_id}"
              captures: { f1_id: $.data.id }
            - call: "POST /inspection-findings/${f1_id}/classification"
              payload: { classification: "MATERIAL_FAILURE", pervasiveness: "SYSTEMIC", affects_report_conclusion: true }
              as: QualityControlDirector
              as_user_id: "${p_qc_id}"
            - call: "POST /firms/${firm_id}/internal-inspections"
              payload: { inspection_year: 2025, target_engagement_count: 1 }
              as: QualityControlDirector
              as_user_id: "${p_qc_id}"
              captures: { insp2_id: $.data.id }
            - call: "POST /internal-inspections/${insp2_id}/selections"
              payload: {}
              as: QualityControlDirector
              as_user_id: "${p_qc_id}"
            - call: "POST /internal-inspections/${insp2_id}/transitions"
              payload: { to_state: "IN_PROGRESS" }
              as: QualityControlDirector
              as_user_id: "${p_qc_id}"
            - call: "GET /inspection-selections"
              payload: { inspection_id: "${insp2_id}" }
              as: QualityControlDirector
              as_user_id: "${p_qc_id}"
              captures: { sel2_id: "$.data[0].id" }
            - call: "POST /inspection-selections/${sel2_id}/findings"
              payload: { title: "Group audit instructions not evidenced", sqm_component: "ENGAGEMENT_PERFORMANCE" }
              as: QualityControlDirector
              as_user_id: "${p_qc_id}"
              captures: { f2_id: $.data.id }
            - call: "POST /inspection-findings/${f2_id}/classification"
              payload: { classification: "MATERIAL_FAILURE", pervasiveness: "SYSTEMIC", affects_report_conclusion: true }
              as: QualityControlDirector
              as_user_id: "${p_qc_id}"
          trigger:
            - call: "POST /internal-inspections/${insp1_id}/transitions"
              payload: { to_state: "FINDINGS_CLASSIFIED", severity_index_basis: "ENGAGEMENT_WEIGHTED" }
              as: QualityControlDirector
              as_user_id: "${p_qc_id}"
            - call: "POST /internal-inspections/${insp2_id}/transitions"
              payload: { to_state: "FINDINGS_CLASSIFIED", severity_index_basis: "FIRM_PERVASIVE" }
              as: QualityControlDirector
              as_user_id: "${p_qc_id}"
          assert:
            - "InspectionSelection.${sel1_id}.is_must_select == true"
            - "InspectionSelection.${sel1_id}.selection_reason == MUST_SELECT_PARTNER_COVERAGE"
            - "InspectionSelection.${sel1_id}.weighted_points == 30.00"
            - "InternalInspection.${insp1_id}.severity_index_basis == ENGAGEMENT_WEIGHTED"
            - "InternalInspection.${insp1_id}.deficiency_severity_index == 30.00"
            - "InspectionSelection.${sel2_id}.is_must_select == true"
            - "InternalInspection.${insp2_id}.severity_index_basis == FIRM_PERVASIVE"
            - "InternalInspection.${insp2_id}.deficiency_severity_index == 25.00"
            - "InternalInspection.${insp1_id}.deficiency_severity_index != InternalInspection.${insp2_id}.deficiency_severity_index"
            - "InspectionFinding.${f1_id}.class_points == 20 and InspectionFinding.${f2_id}.class_points == 20"

  # =====================================================================
  # Rule 2 - combinatorial_formula
  # Three instances, one per mode:
  #   (a) engagement_risk_score       - nested min/max over 5 interacting inputs
  #   (b) deficiency_severity_index   - per-line-item weighting before aggregation
  #   (c) remediation_acceptance_score- pinned tier/penalty evaluation order
  # =====================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: engagement_risk_score_nested_prior_finding_cap_load_penalty_and_spec_credit
        grounds:
          - calculations.engagement_risk_score
          - calculations.eqr_required_determination
          - entities.Engagement.fields.risk_score
          - entities.Engagement.fields.eqr_required
          - entities.Partner.fields.open_engagement_count
          - entities.Partner.fields.industry_specializations
        distinguishing_aspect: |
          Mode (a): risk_score depends non-linearly on five inputs at once - engagement_type,
          is_first_year_client, is_public_interest, prior_finding_count_3y (capped by min(20, 4*n))
          and the partner's open_engagement_count (max(0, n-8)*3) - minus a specialization credit,
          with the 0..100 clamp applied LAST. With ERISA_AUDIT, first-year, public-interest,
          prior_finding_count_3y 12 and a partner already holding 9 open engagements whose
          industry_specializations contain EBP, the correct value is 30+15+12+20+3-10 = 70, whereas
          ignoring the prior-finding cap yields 98 and ignoring the load penalty or the credit yields
          67 or 80.
        test_recipe:
          setup:
            - "Firm 'Everwood Tarn LLP' with risk_posture STABLE (no peer review history, no findings), so no acceptance freeze applies."
            - "Partner Eli Parch has industry_specializations ['EBP'] and is engagement partner on exactly nine AUDIT engagements that all remain in workflow_state PLANNING, so open_engagement_count reads 9 immediately before the tenth engagement is inserted."
          setup_api_calls:
            - call: "POST /firms"
              payload: { legal_name: "Everwood Tarn LLP", state_code: "CA", aa_hours_last_year: 400, peer_review_year_end: "2026-12-31" }
              as: SystemAdmin
              captures: { firm_id: $.data.id }
            - call: "POST /firms/${firm_id}/partners"
              payload: { full_name: "Eli Parch", cpa_license_state: "CA", designations: ["ENGAGEMENT_PARTNER"], industry_specializations: ["EBP"], cpe_hours_last_3y: 200 }
              as: SystemAdmin
              captures: { p_ep1_id: $.data.id }
            - call: "POST /engagements"
              payload: { firm_id: "${firm_id}", client_name: "Filler One", engagement_type: "AUDIT", period_end: "2026-01-31", engagement_partner_id: "${p_ep1_id}" }
              as: EngagementPartner
              as_user_id: "${p_ep1_id}"
            - call: "POST /engagements"
              payload: { firm_id: "${firm_id}", client_name: "Filler Two", engagement_type: "AUDIT", period_end: "2026-01-31", engagement_partner_id: "${p_ep1_id}" }
              as: EngagementPartner
              as_user_id: "${p_ep1_id}"
            - call: "POST /engagements"
              payload: { firm_id: "${firm_id}", client_name: "Filler Three", engagement_type: "AUDIT", period_end: "2026-01-31", engagement_partner_id: "${p_ep1_id}" }
              as: EngagementPartner
              as_user_id: "${p_ep1_id}"
            - call: "POST /engagements"
              payload: { firm_id: "${firm_id}", client_name: "Filler Four", engagement_type: "AUDIT", period_end: "2026-01-31", engagement_partner_id: "${p_ep1_id}" }
              as: EngagementPartner
              as_user_id: "${p_ep1_id}"
            - call: "POST /engagements"
              payload: { firm_id: "${firm_id}", client_name: "Filler Five", engagement_type: "AUDIT", period_end: "2026-01-31", engagement_partner_id: "${p_ep1_id}" }
              as: EngagementPartner
              as_user_id: "${p_ep1_id}"
            - call: "POST /engagements"
              payload: { firm_id: "${firm_id}", client_name: "Filler Six", engagement_type: "AUDIT", period_end: "2026-01-31", engagement_partner_id: "${p_ep1_id}" }
              as: EngagementPartner
              as_user_id: "${p_ep1_id}"
            - call: "POST /engagements"
              payload: { firm_id: "${firm_id}", client_name: "Filler Seven", engagement_type: "AUDIT", period_end: "2026-01-31", engagement_partner_id: "${p_ep1_id}" }
              as: EngagementPartner
              as_user_id: "${p_ep1_id}"
            - call: "POST /engagements"
              payload: { firm_id: "${firm_id}", client_name: "Filler Eight", engagement_type: "AUDIT", period_end: "2026-01-31", engagement_partner_id: "${p_ep1_id}" }
              as: EngagementPartner
              as_user_id: "${p_ep1_id}"
            - call: "POST /engagements"
              payload: { firm_id: "${firm_id}", client_name: "Filler Nine", engagement_type: "AUDIT", period_end: "2026-01-31", engagement_partner_id: "${p_ep1_id}" }
              as: EngagementPartner
              as_user_id: "${p_ep1_id}"
            - call: "GET /partners/${p_ep1_id}"
              payload: {}
              as: SystemAdmin
              captures: { partner_load: $.data.open_engagement_count }
          trigger:
            - call: "POST /engagements"
              payload: { firm_id: "${firm_id}", client_name: "Hallow Pension Trust", engagement_type: "ERISA_AUDIT", period_end: "2026-06-30", engagement_partner_id: "${p_ep1_id}", is_public_interest: true, is_first_year_client: true, prior_finding_count_3y: 12 }
              as: EngagementPartner
              as_user_id: "${p_ep1_id}"
              captures: { target_id: $.data.id }
          assert:
            - "Partner.${p_ep1_id}.open_engagement_count == 10"
            - "Engagement.${target_id}.risk_score == 70"
            - "Engagement.${target_id}.risk_score != 98"
            - "Engagement.${target_id}.eqr_required == true"
            - "Engagement.${target_id}.workflow_state == PLANNING"
            - "Engagement.${target_id}.file_state == OPEN"
            - "Firm.${firm_id}.risk_posture == STABLE"

      - name: severity_index_per_selection_weighting_precedes_aggregation
        grounds:
          - calculations.deficiency_severity_index
          - calculations.inspection_engagement_selection
          - entities.InspectionSelection.fields.weighted_points
          - entities.InspectionSelection.fields.is_must_select
          - entities.InternalInspection.fields.deficiency_severity_index
          - state_machines.InternalInspection.IN_PROGRESS_to_FINDINGS_CLASSIFIED
        distinguishing_aspect: |
          Mode (b): ENGAGEMENT_WEIGHTED pins the aggregation order to "round the 1.5x must-select
          weighting per selection, THEN sum, THEN divide by engagements_selected_count, THEN round".
          With one must-select selection worth 20 raw points and one risk-based selection worth 3,
          the pinned order gives (30.00 + 3.00) / 2 = 16.50, while summing the raw points first and
          applying the multiplier to the aggregate gives (23 / 2) * 1.5 = 17.25.
        test_recipe:
          setup:
            - "Firm 'Grantham Vale LLP' with a single engagement partner Eli Parch who owns two AUDIT engagements, both period_end 2024-xx and both in workflow_state REPORT_RELEASED."
            - "Engagement E1 is a first-year client so its risk_score is 35; Engagement E2 scores 20, so the partner-coverage block picks E1 and the risk-based fill block picks E2."
            - "InternalInspection 2024 has target_engagement_count 2 and is in state IN_PROGRESS with selected_rank 1 = E1 (is_must_select true) and selected_rank 2 = E2 (is_must_select false)."
            - "E1's finding is classified MATERIAL_FAILURE / SYSTEMIC (20 class_points); E2's finding is classified DEFICIENCY / ISOLATED (3 class_points)."
          setup_api_calls:
            - call: "POST /firms"
              payload: { legal_name: "Grantham Vale LLP", state_code: "CA", aa_hours_last_year: 400, peer_review_year_end: "2026-12-31" }
              as: SystemAdmin
              captures: { firm_id: $.data.id }
