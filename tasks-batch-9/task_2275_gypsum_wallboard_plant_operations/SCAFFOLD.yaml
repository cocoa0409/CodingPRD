# =============================================================================
# PRD Benchmark Seed Tables — task_2275_gypsum_wallboard_plant_operations
# Difficulty target: beyond Expert (§0.4) — 12 entities, 61 endpoints,
# 46 error codes, 13 calculations, 46 ordered validations, 7 state machines
# (2 cyclic, 1 parallel-dimension, 1 branching), 2 OCC races, 7 roles,
# flat entity topology.
# =============================================================================

scenario: |
  2275. Gypsum Wallboard Plant Operations (wallboard manufacturing plant): synthetic and natural gypsum supply with moisture and purity variability affecting stucco calcination, calciner control and stucco quality testing feeding board line consistency, board line speed, slurry formulation and paper tension with edge and end quality control, board kiln drying profiles with moisture targets and energy consumption tradeoffs, product mix across thickness, type and fire-rated formulations with changeover scheduling, board testing to standards for core hardness, nail pull and flexural strength, warehouse loading, bundle configuration and freight rate sensitivity by market distance, plant maintenance and outage planning around housing market seasonality

domain_name: gypsum-wallboard-plant-ops
api_prefix: /plant-ops

complexity_profile:
  primary_archetype: temporal_windowing
  secondary_archetype: quota_allocation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers

  entity_topology: flat
  # Every entity is a peer addressed at `/plant-ops/<collection>/{id}`; parentage
  # is expressed purely through FK fields (no nested ownership URLs beyond
  # append-only child reads), plus one self-referential FK (ProductionRun.prior_run_id).

  state_machine_shape: parallel
  # ProductionRun carries two independent dimensions (status × quality_state).
  # GypsumLot and MaintenanceOutage are cyclic; ProductionRun.quality_state is
  # cyclic (RELEASED -> HELD -> IN_TEST -> RELEASED) and branching on disposition.

  relationship_patterns:
    - one_to_many        # Plant -> BoardLine / GypsumLot / CalcinerBatch / ProductSpec / ProductionRun
    - many_to_many       # GypsumLot <-> CalcinerBatch through BatchFeed
    - self_referential   # ProductionRun.prior_run_id -> ProductionRun.id (changeover predecessor)
    - cross_aggregate    # LoadOrder -> ProductionRun -> CalcinerBatch (quality provenance)

  role_model: segregation_of_duties
  # MaintenanceOutage: proposer's X-User-ID may not approve.
  # ProductionRun quality: the inspector who recorded the failing specimen may
  # not disposition the resulting hold.

  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — EMITTED VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:

  - name: Plant
    parent: null
    common_fields: true
    fields:
      - name: code
        type: string
        source: input
        description: short plant code
        constraints: "1..16 chars, globally unique; ERR_INVALID_REQUEST on duplicate"
      - name: name
        type: string
        source: input
        description: plant display name
      - name: calciner_capacity_tph
        type: number
        source: input
        description: aggregate calciner feed-rate ceiling in tons per hour
        constraints: "> 0"
      - name: stucco_silo_capacity_tons
        type: number
        source: input
        description: maximum stucco tonnage the silo may hold
        constraints: "> 0"
      - name: natural_gypsum_purity_floor_pct
        type: number
        source: input
        description: minimum acceptable CaSO4-2H2O purity for NATURAL lots
        default: 88.0
        constraints: "50.0..100.0"
      - name: synthetic_free_moisture_ceiling_pct
        type: number
        source: input
        description: maximum acceptable free moisture for SYNTHETIC lots
        default: 12.0
        constraints: "0.0..30.0"
      - name: energy_price_per_mmbtu
        type: number
        source: input
        description: fuel price used by kiln_energy_and_moisture
        constraints: "> 0"
      - name: contribution_margin_per_msf
        type: number
        source: input
        description: margin per MSF used by outage_seasonality_gate opportunity cost
        constraints: ">= 0"
      - name: stucco_on_hand_tons
        type: number
        source: computed
        description: silo balance; credited on CalcinerBatch COMPLETED, debited on ProductionRun COMPLETED
        default: 0.000
        constraints: "3 decimals, >= 0"
      - name: stucco_committed_tons
        type: number
        source: computed
        description: "sum of ProductionRun.stucco_reserved_tons over runs with status IN {SCHEDULED, RUNNING}"
        default: 0.000
        constraints: "3 decimals, >= 0"
      - name: stucco_available_tons
        type: number
        source: computed
        description: "round_half_up(stucco_on_hand_tons - stucco_committed_tons, 3)"
      - name: held_run_count
        type: integer
        source: computed
        description: "count of ProductionRun with this plant_id and quality_state == HELD"
        default: 0
      - name: production_posture
        type: enum
        source: computed
        description: derived gate over child state; see calculations.plant_production_posture
        constraints: "OPEN | RESTRICTED | FROZEN"

  - name: BoardLine
    parent: null
    common_fields: true
    fields:
      - name: plant_id
        type: string
        source: input
        description: "FK -> Plant.id; owning plant"
      - name: designation
        type: string
        source: input
        description: line designation
        constraints: "unique per plant_id; ERR_INVALID_REQUEST on duplicate"
      - name: max_speed_fpm
        type: integer
        source: input
        description: mechanical line-speed ceiling in feet per minute
        constraints: "100..1200"
      - name: web_width_in
        type: number
        source: input
        description: forming-table web width in inches
        constraints: "> 0"
      - name: status
        type: enum
        source: system
        description: line availability driven by MaintenanceOutage transitions
        default: AVAILABLE
        constraints: "AVAILABLE | MAINTENANCE_SCHEDULED | UNDER_MAINTENANCE"

  - name: GypsumLot
    parent: null
    common_fields: true
    fields:
      - name: plant_id
        type: string
        source: input
        description: "FK -> Plant.id; receiving plant"
      - name: source_type
        type: enum
        source: input
        description: gypsum origin, drives which assay ceiling/floor applies
        constraints: "NATURAL | SYNTHETIC"
      - name: supplier_name
        type: string
        source: input
        description: supplier or FGD source name
      - name: received_tons
        type: number
        source: input
        description: as-received tonnage on the bill of lading
        constraints: "> 0, 3 decimals"
      - name: declared_free_moisture_pct
        type: number
        source: input
        description: supplier-declared free moisture at receipt (never used by any calculation)
        constraints: "0.0..40.0"
      - name: declared_purity_pct
        type: number
        source: input
        description: supplier-declared purity at receipt (never used by any calculation)
        constraints: "0.0..100.0"
      - name: free_moisture_pct
        type: number
        source: input
        description: laboratory free moisture written by the assay endpoint; null before first assay
      - name: purity_pct
        type: number
        source: input
        description: laboratory CaSO4-2H2O purity written by the assay endpoint; null before first assay
      - name: chloride_ppm
        type: integer
        source: input
        description: laboratory chloride content written by the assay endpoint; null before first assay
      - name: assayed_at
        type: datetime
        source: system
        description: logical-clock instant of the most recent assay
      - name: assay_count
        type: integer
        source: system
        description: number of assays performed; bounds the QUARANTINED re-assay cycle
        default: 0
      - name: quarantine_reason
        type: enum
        source: computed
        description: which assay ceiling/floor failed; null unless status == QUARANTINED
        constraints: "MOISTURE_CEILING | PURITY_FLOOR | CHLORIDE_CEILING | null"
      - name: consumed_tons
        type: number
        source: computed
        description: "sum of BatchFeed.tons_fed for this lot where the feed's batch status != ABORTED"
        default: 0.000
      - name: remaining_tons
        type: number
        source: computed
        description: "round_half_up(received_tons - consumed_tons, 3)"
      - name: status
        type: enum
        source: system
        description: lot lifecycle
        default: RECEIVED
        constraints: "RECEIVED | APPROVED | QUARANTINED | REJECTED | DEPLETED"

  - name: CalcinerBatch
    parent: null
    common_fields: true
    fields:
      - name: plant_id
        type: string
        source: input
        description: "FK -> Plant.id; owning plant"
      - name: target_stucco_tons
        type: number
        source: input
        description: planned stucco output for the batch
        constraints: "> 0"
      - name: calcination_temp_f
        type: number
        source: input
        description: calciner setpoint in degrees F
        constraints: "250.0..400.0"
      - name: feed_rate_tph
        type: number
        source: input
        description: gypsum feed rate for the batch; summed against calciner_capacity_tph over overlapping windows
        constraints: "> 0"
      - name: feed_window_start
        type: datetime
        source: input
        description: start of the calciner occupancy window (inclusive)
      - name: feed_window_end
        type: datetime
        source: input
        description: end of the calciner occupancy window (exclusive)
      - name: feed_tons_total
        type: number
        source: computed
        description: "sum of BatchFeed.tons_fed for this batch, 3 decimals"
        default: 0.000
      - name: feed_moisture_plan_pct
        type: number
        source: computed
        description: PLAN_BASIS blended free moisture (see calculations.batch_blend_metrics)
      - name: feed_moisture_as_fed_pct
        type: number
        source: computed
        description: AS_FED_BASIS blended free moisture (see calculations.batch_blend_metrics)
      - name: feed_purity_plan_pct
        type: number
        source: computed
        description: tonnage-weighted assay purity of the feed, 2 decimals
      - name: stucco_yield_plan_tons
        type: number
        source: computed
        description: PLANNED_YIELD variant of calculations.stucco_yield_tons, stamped at close-feed
      - name: stucco_yield_actual_tons
        type: number
        source: computed
        description: ACTUAL_YIELD variant of calculations.stucco_yield_tons, stamped when the batch reaches COMPLETED
      - name: stucco_quality_flag
        type: enum
        source: computed
        description: result of the most recent StuccoTest on this batch
        default: PENDING
        constraints: "PENDING | PASS | MARGINAL | FAIL"
      - name: abort_reason
        type: string
        source: input
        description: free text supplied to the abort endpoint; null otherwise
      - name: status
        type: enum
        source: system
        description: batch lifecycle
        default: PLANNED
        constraints: "PLANNED | FEEDING | CALCINING | COMPLETED | ABORTED"

  - name: BatchFeed
    parent: null
    common_fields: false
    fields:
      - name: batch_id
        type: string
        source: input
        description: "FK -> CalcinerBatch.id; consuming batch"
      - name: lot_id
        type: string
        source: input
        description: "FK -> GypsumLot.id; source lot"
      - name: tons_fed
        type: number
        source: input
        description: tonnage drawn from the lot into the batch
        constraints: "> 0, 3 decimals"
      - name: measured_free_moisture_pct
        type: number
        source: input
        description: belt-scale free moisture measured as this increment was fed
        constraints: "0.0..40.0"
      - name: assay_free_moisture_pct
        type: number
        source: computed
        description: snapshot of GypsumLot.free_moisture_pct at feed time (PLAN_BASIS input)
      - name: assay_purity_pct
        type: number
        source: computed
        description: snapshot of GypsumLot.purity_pct at feed time
      - name: feed_seq
        type: integer
        source: computed
        description: 1-based position of this feed within the batch ordered by created_at ASC
      - name: dry_tons_plan
        type: number
        source: computed
        description: "tons_fed * (1 - assay_free_moisture_pct / 100), unrounded intermediate persisted at 6 decimals"
      - name: dry_tons_as_fed
        type: number
        source: computed
        description: "tons_fed * (1 - measured_free_moisture_pct / 100), unrounded intermediate persisted at 6 decimals"

  - name: StuccoTest
    parent: null
    common_fields: false
    fields:
      - name: batch_id
        type: string
        source: input
        description: "FK -> CalcinerBatch.id; tested batch"
      - name: sample_seq
        type: integer
        source: input
        description: sample number within the batch
        constraints: ">= 1, unique per batch_id"
      - name: combined_water_pct
        type: number
        source: input
        description: chemically combined water remaining after calcination
        constraints: "0.0..25.0"
      - name: free_water_pct
        type: number
        source: input
        description: residual free water in the stucco
        constraints: "0.0..5.0"
      - name: set_time_minutes
        type: number
        source: input
        description: Vicat set time
        constraints: "0.0..60.0"
      - name: normal_consistency_cc
        type: number
        source: input
        description: water demand in cc per 100 g stucco
        constraints: "40.0..140.0"
      - name: result
        type: enum
        source: computed
        description: see calculations.stucco_test_result
        constraints: "PASS | MARGINAL | FAIL"
      - name: recorded_by_user_id
        type: string
        source: system
        description: X-User-ID of the QualityInspector who recorded the sample
      - name: tested_at
        type: datetime
        source: system
        description: logical-clock instant of the test

  - name: ProductSpec
    parent: null
    common_fields: true
    fields:
      - name: plant_id
        type: string
        source: input
        description: "FK -> Plant.id; owning plant"
      - name: sku_code
        type: string
        source: input
        description: product SKU
        constraints: "unique per plant_id"
      - name: thickness_in
        type: number
        source: input
        description: board thickness in inches
        constraints: "0.375 | 0.5 | 0.625"
      - name: board_type
        type: enum
        source: input
        description: product family
        constraints: "REGULAR | TYPE_X | TYPE_C | MOLD_RESISTANT | ABUSE_RESISTANT"
      - name: fire_rated
        type: boolean
        source: input
        description: fire-rated formulation flag
        constraints: "MUST be true when board_type IN {TYPE_X, TYPE_C} and false otherwise; ERR_INVALID_REQUEST"
      - name: board_width_in
        type: number
        source: input
        description: finished board width in inches
        constraints: "> 0, <= owning line web_width_in is NOT enforced (specs are line-agnostic)"
      - name: board_length_ft
        type: number
        source: input
        description: finished board length in feet
        constraints: "> 0"
      - name: target_board_weight_lb_per_msf
        type: number
        source: input
        description: target finished board weight per MSF
        constraints: "> 0"
      - name: stucco_lb_per_msf
        type: number
        source: input
        description: dry stucco charge per MSF; drives stucco reservation and consumption
        constraints: "> 0"
      - name: slurry_water_stucco_ratio
        type: number
        source: input
        description: slurry water as a fraction of board weight per MSF
        constraints: "0.30..1.20"
      - name: line_speed_max_fpm
        type: integer
        source: input
        description: maximum line speed permitted for this SKU
        constraints: "100..1200"
      - name: paper_tension_min_lb
        type: number
        source: input
        description: base paper tension at 250 fpm
        constraints: "> 0"
      - name: paper_tension_max_lb
        type: number
        source: input
        description: paper tension ceiling
        constraints: "> paper_tension_min_lb"
      - name: core_hardness_min_lbf
        type: number
        source: input
        description: minimum end/edge core hardness per standard
        constraints: "> 0"
      - name: nail_pull_min_lbf
        type: number
        source: input
        description: minimum nail-pull resistance per standard
        constraints: "> 0"
      - name: flexural_cross_min_lbf
        type: number
        source: input
        description: minimum cross-machine flexural strength per standard
        constraints: "> 0"
      - name: max_boards_per_bundle
        type: integer
        source: input
        description: bundle configuration ceiling for this thickness
        constraints: "2..80, even"
      - name: changeover_family
        type: enum
        source: input
        description: family used by the changeover matrix
        constraints: "STANDARD | FIRE_RATED | SPECIALTY"

  - name: ProductionRun
    parent: null
    common_fields: true
    fields:
      - name: plant_id
        type: string
        source: input
        description: "FK -> Plant.id; owning plant"
      - name: line_id
        type: string
        source: input
        description: "FK -> BoardLine.id; occupied line (temporal resource)"
      - name: product_spec_id
        type: string
        source: input
        description: "FK -> ProductSpec.id; SKU being produced"
      - name: calciner_batch_id
        type: string
        source: input
        description: "FK -> CalcinerBatch.id; stucco provenance for this run"
      - name: prior_run_id
        type: string
        source: computed
        description: "FK -> ProductionRun.id; self-referential changeover predecessor selected at schedule time; null on cold start"
      - name: window_start
        type: datetime
        source: input
        description: start of the line occupancy window (inclusive)
      - name: window_end
        type: datetime
        source: input
        description: end of the line occupancy window (exclusive)
      - name: requested_planned_msf
        type: number
        source: input
        description: MSF the scheduler asks for; capped by capacity_msf
        constraints: "> 0, 3 decimals"
      - name: line_speed_fpm
        type: integer
        source: input
        description: chosen line speed
        constraints: "100..1200"
      - name: paper_tension_lb
        type: number
        source: input
        description: chosen paper tension
        constraints: "> 0"
      - name: kiln_dwell_minutes
        type: integer
        source: input
        description: chosen kiln dwell; trades energy against exit moisture
        constraints: "10..120"
      - name: kiln_exit_moisture_target_pct
        type: number
        source: input
        description: target board exit moisture
        constraints: "0.05..2.00"
      - name: required_paper_tension_lb
        type: number
        source: computed
        description: speed-scaled minimum tension; see calculations.paper_tension_window
      - name: projected_exit_moisture_pct
        type: number
        source: computed
        description: kiln feasibility projection stamped at create; see calculations.kiln_energy_and_moisture
      - name: changeover_minutes
        type: integer
        source: computed
        description: matrix changeover from prior_run_id's spec; stamped at schedule
      - name: gap_minutes
        type: integer
        source: computed
        description: whole minutes between prior run window_end and this window_start; null on cold start
      - name: in_window_changeover_minutes
        type: integer
        source: computed
        description: changeover minutes absorbed inside this window (cold start only, otherwise 0)
      - name: available_minutes
        type: integer
        source: computed
        description: "window minutes - in_window_changeover_minutes"
      - name: capacity_msf
        type: number
        source: computed
        description: "round_half_up(available_minutes * msf_per_minute, 3)"
      - name: effective_planned_msf
        type: number
        source: computed
        description: "min(requested_planned_msf, capacity_msf)"
      - name: stucco_reserved_tons
        type: number
        source: computed
        description: silo tonnage committed while status IN {SCHEDULED, RUNNING}
        default: 0.000
      - name: kiln_energy_mmbtu
        type: number
        source: computed
        description: stamped at schedule from effective_planned_msf
      - name: kiln_energy_cost_usd
        type: number
        source: computed
        description: "round_half_up(kiln_energy_mmbtu * Plant.energy_price_per_mmbtu, 2)"
      - name: actual_msf
        type: number
        source: input
        description: MSF produced, supplied at complete
      - name: scrap_msf
        type: number
        source: input
        description: MSF scrapped at the line, supplied at complete
        constraints: ">= 0, <= actual_msf"
      - name: edge_defect_ppm
        type: integer
        source: input
        description: edge trim defect rate supplied at complete
        constraints: ">= 0"
      - name: end_defect_ppm
        type: integer
        source: input
        description: end-cut defect rate supplied at complete
        constraints: ">= 0"
      - name: stucco_consumed_tons
        type: number
        source: computed
        description: "round_half_up(actual_msf * ProductSpec.stucco_lb_per_msf / 2000, 3), stamped at complete"
        default: 0.000
      - name: net_good_msf
        type: number
        source: computed
        description: "round_half_up(actual_msf - scrap_msf, 3); set to 0.000 by a SCRAP disposition"
        default: 0.000
      - name: scrapped_msf
        type: number
        source: computed
        description: MSF written off by a SCRAP disposition
        default: 0.000
      - name: available_msf
        type: number
        source: computed
        description: "net_good_msf - sum(LoadOrder.total_msf where status IN {STAGED, HELD, LOADED, SHIPPED})"
        default: 0.000
      - name: specimen_count
        type: integer
        source: computed
        description: count of BoardTest rows for this run
        default: 0
      - name: failing_specimen_count
        type: integer
        source: computed
        description: count of BoardTest rows with result == FAIL
        default: 0
      - name: fail_rate
        type: number
        source: computed
        description: "round_half_up(failing_specimen_count / specimen_count, 4); 0.0000 when specimen_count == 0"
        default: 0.0000
      - name: retest_count
        type: integer
        source: computed
        description: number of times quality_state moved HELD -> IN_TEST
        default: 0
      - name: last_failing_test_recorded_by_user_id
        type: string
        source: computed
        description: X-User-ID that recorded the most recent FAIL BoardTest; drives the disposition SoD check
      - name: held_reason
        type: enum
        source: computed
        description: why quality_state became HELD; null otherwise
        constraints: "BOARD_TEST_FAIL | EDGE_DEFECT | END_DEFECT | MOISTURE_EXCEEDANCE | STUCCO_NONCONFORMING | null"
      - name: saleable_grade
        type: enum
        source: computed
        description: commercial grade derived from quality_state
        default: UNGRADED
        constraints: "UNGRADED | FIRST_QUALITY | SECONDS | SCRAP"
      - name: cancel_reason
        type: string
        source: input
        description: free text supplied to the cancel endpoint or written by a cascade; null otherwise
      - name: status
        type: enum
        source: system
        description: lifecycle dimension
        default: DRAFT
        constraints: "DRAFT | SCHEDULED | RUNNING | COMPLETED | CANCELLED"
      - name: quality_state
        type: enum
        source: system
        description: quality dimension, evolves independently of status
        default: UNTESTED
        constraints: "UNTESTED | IN_TEST | RELEASED | DOWNGRADED | HELD | SCRAPPED"

  - name: BoardTest
    parent: null
    common_fields: false
    fields:
      - name: run_id
        type: string
        source: input
        description: "FK -> ProductionRun.id; tested run"
      - name: specimen_seq
        type: integer
        source: input
        description: specimen number within the run
        constraints: ">= 1, unique per run_id"
      - name: core_hardness_lbf
        type: number
        source: input
        description: measured core hardness
        constraints: ">= 0"
      - name: nail_pull_lbf
        type: number
        source: input
        description: measured nail-pull resistance
        constraints: ">= 0"
      - name: flexural_cross_lbf
        type: number
        source: input
        description: measured cross-machine flexural strength
        constraints: ">= 0"
      - name: flexural_parallel_lbf
        type: number
        source: input
        description: measured parallel flexural strength (recorded, not gating)
        constraints: ">= 0"
      - name: exit_moisture_pct
        type: number
        source: input
        description: measured board exit moisture
        constraints: "0.00..5.00"
      - name: result
        type: enum
        source: computed
        description: see calculations.board_quality_evaluation specimen rule
        constraints: "PASS | FAIL"
      - name: failing_attributes
        type: array
        source: computed
        description: "subset of [CORE_HARDNESS, NAIL_PULL, FLEXURAL_CROSS, EXIT_MOISTURE]; empty when result == PASS"
      - name: recorded_by_user_id
        type: string
        source: system
        description: X-User-ID of the QualityInspector who recorded the specimen
      - name: tested_at
        type: datetime
        source: system
        description: logical-clock instant of the test

  - name: MaintenanceOutage
    parent: null
    common_fields: true
    fields:
      - name: line_id
        type: string
        source: input
        description: "FK -> BoardLine.id; line taken out of service"
      - name: outage_type
        type: enum
        source: input
        description: planned campaign work or a forced emergency outage
        constraints: "PLANNED | EMERGENCY"
      - name: window_start
        type: datetime
        source: input
        description: outage window start; overwritten on repropose
      - name: window_end
        type: datetime
        source: input
        description: outage window end; must be > window_start else ERR_INVALID_WINDOW
      - name: scope_note
        type: string
        source: input
        description: scope of the maintenance work
      - name: proposed_by_user_id
        type: string
        source: system
        description: X-User-ID of the MaintenancePlanner who proposed the outage
      - name: approved_by_user_id
        type: string
        source: system
        description: X-User-ID of the PlantManager who approved it; must differ from proposed_by_user_id
        default: null
      - name: deferral_count
        type: integer
        source: computed
        description: "number of PROPOSED -> DEFERRED transitions; never reset, and reaching MAX_DEFERRALS (2) makes the seasonality gate unconditional"
        default: 0
      - name: deferred_reason
        type: string
        source: input
        description: reason recorded on the most recent deferral
        default: null
      - name: close_note
        type: string
        source: input
        description: closing note recorded when the outage completes
        default: null
      - name: seasonality_index
        type: number
        source: computed
        description: "housing-market seasonality index of the window's UTC month; see calculations.outage_seasonality_gate"
        constraints: "2 decimals"
      - name: planned_downtime_hours
        type: number
        source: computed
        description: window length in hours
        constraints: "2 decimals, >= 0"
      - name: at_risk_msf
        type: number
        source: computed
        description: "sum of effective_planned_msf over SCHEDULED and RUNNING runs on the line whose window intersects the outage window (closed intervals)"
        constraints: "3 decimals, >= 0"
      - name: opportunity_cost_usd
        type: number
        source: computed
        description: "round_half_up(at_risk_msf * plant.contribution_margin_per_msf, 2)"
        constraints: "2 decimals, >= 0"
      - name: status
        type: enum
        source: system
        description: outage lifecycle; see §1.2
        constraints: "PROPOSED | DEFERRED | APPROVED | IN_PROGRESS | CLOSED"

  - name: Market
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: market name
      - name: distance_miles
        type: number
        source: input
        description: one-way haul distance from the plant
        constraints: "> 0"
      - name: fuel_surcharge_pct
        type: number
        source: input
        description: fuel surcharge applied to the freight subtotal
        constraints: "0.0..60.0"
      - name: min_charge_usd
        type: number
        source: input
        description: freight floor per load
        constraints: ">= 0"
      - name: backhaul_credit_usd
        type: number
        source: input
        description: credit applied on settlement when the load ships with a backhaul
        default: 0.00
        constraints: ">= 0"
      - name: rate_zone
        type: enum
        source: computed
        description: distance zone; see calculations.freight_charge
        constraints: "ZONE_1 | ZONE_2 | ZONE_3 | ZONE_4"
      - name: base_rate_per_msf
        type: number
        source: computed
        description: zone rate in USD per MSF

  - name: LoadOrder
    parent: null
    common_fields: true
    fields:
      - name: run_id
        type: string
        source: input
        description: "FK -> ProductionRun.id; board source"
      - name: market_id
        type: string
        source: input
        description: "FK -> Market.id; destination market"
      - name: bundles_count
        type: integer
        source: input
        description: bundles planned onto the trailer
        constraints: ">= 1"
      - name: boards_per_bundle
        type: integer
        source: input
        description: boards per bundle
        constraints: ">= 2, even, <= ProductSpec.max_boards_per_bundle"
      - name: loaded_bundles_count
        type: integer
        source: input
        description: bundles actually loaded, supplied at load; null before
        constraints: ">= 1, <= bundles_count"
      - name: backhaul
        type: boolean
        source: input
        description: whether the tractor returns loaded, supplied at ship
        default: false
      - name: board_msf_each
        type: number
        source: computed
        description: "round_half_up(board_length_ft * board_width_in / 12 / 1000, 6)"
      - name: bundle_msf
        type: number
        source: computed
        description: "round_half_up(boards_per_bundle * board_msf_each, 4)"
      - name: bundle_weight_lb
        type: number
        source: computed
        description: "round_half_up(boards_per_bundle * target_board_weight_lb_per_msf * board_msf_each, 2)"
      - name: total_msf
        type: number
        source: computed
        description: "round_half_up(billable_bundles * bundle_msf, 3) where billable_bundles is bundles_count until load, loaded_bundles_count after"
      - name: trailer_weight_lb
        type: number
        source: computed
        description: "round_half_up(billable_bundles * bundle_weight_lb, 2)"
      - name: quoted_freight_usd
        type: number
        source: computed
        description: QUOTED variant of calculations.freight_charge, stamped at STAGED
      - name: settled_freight_usd
        type: number
        source: computed
        description: SETTLED variant of calculations.freight_charge, stamped at SHIPPED; null before
      - name: overweight_fee_usd
        type: number
        source: computed
        description: settlement accessorial above TRAILER_TARGET_LB
        default: 0.00
      - name: freight_variance_usd
        type: number
        source: computed
        description: "round_half_up(settled_freight_usd - quoted_freight_usd, 2); null before SHIPPED"
      - name: hold_source
        type: enum
        source: computed
        description: why the load was held by cascade; null otherwise
        constraints: "RUN_QUALITY_HELD | null"
      - name: cancel_reason
        type: string
        source: input
        description: free text supplied to the cancel endpoint or written by a cascade; null otherwise
      - name: status
        type: enum
        source: system
        description: load lifecycle
        default: STAGED
        constraints: "STAGED | HELD | LOADED | SHIPPED | CANCELLED"

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:

  # ---------------------------------------------------------------- GypsumLot
  # Cyclic: QUARANTINED -> QUARANTINED / QUARANTINED -> APPROVED re-assay loop,
  # bounded by MAX_ASSAYS = 3.
  - entity: GypsumLot
    dimension: status
    initial_state: RECEIVED
    terminal_states: [REJECTED, DEPLETED]
    transitions:
      - from: RECEIVED
        to: APPROVED
        trigger: "POST /plant-ops/gypsum-lots/{lotId}/assay"
        actor: MaterialsController
        preconditions:
          - "assay_count < MAX_ASSAYS (3)"
          - "calculations.lot_assay_disposition returns APPROVED"
        side_effects:
          - "writes free_moisture_pct, purity_pct, chloride_ppm from the payload"
          - "sets assayed_at = logical clock; assay_count += 1; quarantine_reason = null"
          - "increments GypsumLot.version by 1"
      - from: RECEIVED
        to: QUARANTINED
        trigger: "POST /plant-ops/gypsum-lots/{lotId}/assay"
        actor: MaterialsController
        preconditions:
          - "assay_count < MAX_ASSAYS (3)"
          - "calculations.lot_assay_disposition returns QUARANTINED"
        side_effects:
          - "writes assay values; assay_count += 1"
          - "sets quarantine_reason to the first failing check in the pinned order MOISTURE_CEILING, PURITY_FLOOR, CHLORIDE_CEILING"
          - "increments GypsumLot.version by 1"
      - from: QUARANTINED
        to: QUARANTINED
        trigger: "POST /plant-ops/gypsum-lots/{lotId}/assay (re-assay, cycle)"
        actor: MaterialsController
        preconditions:
          - "assay_count < MAX_ASSAYS (3) else ERR_MAX_ASSAYS_REACHED"
          - "calculations.lot_assay_disposition still returns QUARANTINED"
        side_effects:
          - "overwrites assay values; assay_count += 1; quarantine_reason recomputed"
          - "increments GypsumLot.version by 1"
        note: "self-loop; the third assay is the last one the lot may receive"
      - from: QUARANTINED
        to: APPROVED
        trigger: "POST /plant-ops/gypsum-lots/{lotId}/assay (re-assay clears)"
        actor: MaterialsController
        preconditions:
          - "assay_count < MAX_ASSAYS (3) else ERR_MAX_ASSAYS_REACHED"
          - "calculations.lot_assay_disposition returns APPROVED"
        side_effects:
          - "overwrites assay values; assay_count += 1; quarantine_reason = null"
          - "increments GypsumLot.version by 1"
      - from: QUARANTINED
        to: REJECTED
        trigger: "POST /plant-ops/gypsum-lots/{lotId}/reject"
        actor: MaterialsController
        preconditions:
          - "status == QUARANTINED else ERR_INVALID_STATE"
          - "consumed_tons == 0.000 else ERR_INVALID_STATE"
        side_effects:
          - "sets remaining_tons = 0.000 and increments GypsumLot.version by 1"
      - from: APPROVED
        to: DEPLETED
        trigger: "system, on POST /plant-ops/calciner-batches/{batchId}/feeds when remaining_tons reaches exactly 0.000"
        actor: system
        preconditions:
          - "round_half_up(received_tons - consumed_tons, 3) == 0.000"
        side_effects:
          - "no further feeds accepted (ERR_LOT_NOT_APPROVED)"
          - "increments GypsumLot.version by 1"
      - from: DEPLETED
        to: APPROVED
        trigger: "system, on POST /plant-ops/calciner-batches/{batchId}/abort restoring tonnage"
        actor: system
        preconditions:
          - "the aborted batch consumed tonnage from this lot"
          - "remaining_tons after restoration > 0.000"
        side_effects:
          - "recomputes consumed_tons and remaining_tons; increments GypsumLot.version by 1"
        note: "compensating transition; closes the mass-conservation invariant gypsum_mass_conservation"

  # ------------------------------------------------------------ CalcinerBatch
  - entity: CalcinerBatch
    dimension: status
    initial_state: PLANNED
    terminal_states: [COMPLETED, ABORTED]
    transitions:
      - from: PLANNED
        to: FEEDING
        trigger: "POST /plant-ops/calciner-batches/{batchId}/feeds (first feed)"
        actor: MaterialsController
        preconditions:
          - "lot.status == APPROVED else ERR_LOT_NOT_APPROVED"
          - "lot.plant_id == batch.plant_id else ERR_PLANT_SCOPE_MISMATCH"
          - "logical clock - lot.assayed_at <= ASSAY_VALIDITY_DAYS (30) else ERR_ASSAY_EXPIRED"
          - "expected_lot_version == lot.version else ERR_STALE_LOT_VERSION"
          - "tons_fed <= lot.remaining_tons else ERR_LOT_TONS_INSUFFICIENT"
        side_effects:
          - "creates BatchFeed with feed_seq = 1 and snapshots assay_free_moisture_pct / assay_purity_pct"
          - "lot.consumed_tons += tons_fed; lot.remaining_tons recomputed; lot.version += 1"
          - "batch.feed_tons_total recomputed; batch_blend_metrics recomputed (both variants)"
          - "increments CalcinerBatch.version by 1"
      - from: FEEDING
        to: FEEDING
        trigger: "POST /plant-ops/calciner-batches/{batchId}/feeds (subsequent feeds)"
        actor: MaterialsController
        preconditions:
          - "same preconditions as the first feed"
        side_effects:
          - "creates BatchFeed with feed_seq = count(existing feeds) + 1"
          - "lot.consumed_tons += tons_fed; lot.version += 1; lot may auto-transition APPROVED -> DEPLETED"
          - "batch_blend_metrics recomputed; increments CalcinerBatch.version by 1"
      - from: FEEDING
        to: CALCINING
        trigger: "POST /plant-ops/calciner-batches/{batchId}/close-feed"
        actor: MaterialsController
        preconditions:
          - "status == FEEDING else ERR_INVALID_STATE"
          - "feed_tons_total > 0"
        side_effects:
          - "stamps stucco_yield_plan_tons (PLANNED_YIELD variant) and feed_purity_plan_pct"
          - "no further feeds accepted (ERR_INVALID_STATE)"
          - "increments CalcinerBatch.version by 1"
      - from: CALCINING
        to: CALCINING
        trigger: "POST /plant-ops/calciner-batches/{batchId}/stucco-tests with result == FAIL"
        actor: QualityInspector
        preconditions:
          - "status == CALCINING"
          - "sample_seq unique per batch else ERR_INVALID_REQUEST"
        side_effects:
          - "creates StuccoTest; sets stucco_quality_flag = FAIL"
          - "no silo credit occurs; increments CalcinerBatch.version by 1"
      - from: CALCINING
        to: COMPLETED
        trigger: "POST /plant-ops/calciner-batches/{batchId}/stucco-tests with result IN {PASS, MARGINAL}"
        actor: QualityInspector
        preconditions:
          - "status == CALCINING"
          - "round_half_up(plant.stucco_on_hand_tons + stucco_yield_actual_tons, 3) <= plant.stucco_silo_capacity_tons else ERR_SILO_CAPACITY_EXCEEDED"
        side_effects:
          - "stamps stucco_yield_actual_tons (ACTUAL_YIELD variant) and stucco_quality_flag = PASS|MARGINAL"
          - "plant.stucco_on_hand_tons += stucco_yield_actual_tons; plant.stucco_available_tons recomputed; plant.production_posture recomputed; plant.version += 1"
          - "increments CalcinerBatch.version by 1"
      - from: COMPLETED
        to: COMPLETED
        trigger: "POST /plant-ops/calciner-batches/{batchId}/stucco-tests (retained-sample test on a completed batch)"
        actor: QualityInspector
        preconditions:
          - "status == COMPLETED"
          - "sample_seq unique per batch"
        side_effects:
          - "creates StuccoTest and overwrites stucco_quality_flag with the new result"
          - "CASCADE (hop 1 -> 2) when the new result == FAIL: every ProductionRun with calciner_batch_id == this batch, status IN {RUNNING, COMPLETED} and quality_state IN {UNTESTED, IN_TEST, RELEASED, DOWNGRADED} moves quality_state -> HELD with held_reason = STUCCO_NONCONFORMING and saleable_grade = UNGRADED"
          - "CASCADE (hop 2 -> 3) each such run increments plant.held_run_count, which re-derives plant.production_posture and bumps plant.version by 1"
          - "CASCADE (hop 3 -> 4) because those runs are now quality_state == HELD, each of their LoadOrders with status == STAGED moves to HELD with hold_source = RUN_QUALITY_HELD"
          - "increments CalcinerBatch.version by 1"
      - from: PLANNED
        to: ABORTED
        trigger: "POST /plant-ops/calciner-batches/{batchId}/abort"
        actor: MaterialsController
        preconditions:
          - "status IN {PLANNED, FEEDING, CALCINING} else ERR_INVALID_STATE"
        side_effects:
          - "sets abort_reason; releases the calciner window from the aggregate-capacity pool"
          - "increments CalcinerBatch.version by 1"
      - from: FEEDING
        to: ABORTED
        trigger: "POST /plant-ops/calciner-batches/{batchId}/abort"
        actor: MaterialsController
        preconditions:
          - "status IN {PLANNED, FEEDING, CALCINING} else ERR_INVALID_STATE"
        side_effects:
          - "for every BatchFeed of this batch: lot.consumed_tons -= tons_fed, lot.remaining_tons recomputed, lot.version += 1, and lot auto-transitions DEPLETED -> APPROVED when remaining_tons > 0.000"
          - "sets feed_tons_total = 0.000, stucco_yield_plan_tons = 0.000, stucco_yield_actual_tons = 0.000"
          - "increments CalcinerBatch.version by 1"
        note: "compensating transition for gypsum_mass_conservation; BatchFeed rows are retained (append-only) but excluded from consumed_tons because the batch is ABORTED"
      - from: CALCINING
        to: ABORTED
        trigger: "POST /plant-ops/calciner-batches/{batchId}/abort"
        actor: MaterialsController
        preconditions:
          - "status IN {PLANNED, FEEDING, CALCINING} else ERR_INVALID_STATE"
          - "no ProductionRun with calciner_batch_id == this batch has status IN {SCHEDULED, RUNNING} else ERR_INVALID_STATE"
        side_effects:
          - "same tonnage restoration as FEEDING -> ABORTED"
          - "increments CalcinerBatch.version by 1"

  # ------------------------------------------- ProductionRun (lifecycle axis)
  - entity: ProductionRun
    dimension: status
    initial_state: DRAFT
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: DRAFT
        to: SCHEDULED
        trigger: "POST /plant-ops/production-runs/{runId}/schedule"
        actor: ProductionScheduler
        preconditions:
          - "expected_plant_version == plant.version else ERR_STALE_PLANT_VERSION"
          - "status == DRAFT else ERR_INVALID_STATE"
          - "plant.production_posture != FROZEN else ERR_PLANT_POSTURE_FROZEN"
          - "NOT (plant.production_posture == RESTRICTED AND spec.fire_rated) else ERR_POSTURE_RESTRICTED_FIRE_RATED"
          - "when spec.fire_rated: batch.stucco_quality_flag == PASS else ERR_FIRE_RATED_STUCCO_NONCONFORMING"
          - "batch.status IN {CALCINING, COMPLETED} else ERR_INVALID_STATE"
          - "no MaintenanceOutage on line_id with status IN {APPROVED, IN_PROGRESS} intersecting this window under closed-interval semantics else ERR_OUTAGE_WINDOW_CONFLICT"
          - "no ProductionRun on line_id with status IN {SCHEDULED, RUNNING} whose [window_start, window_end) overlaps this run's else ERR_LINE_WINDOW_CONFLICT"
          - "gap_minutes >= changeover_minutes when prior_run_id is not null else ERR_CHANGEOVER_BUFFER_VIOLATION"
          - "capacity_msf > 0.000 else ERR_WINDOW_TOO_SHORT_FOR_CHANGEOVER"
          - "stucco_reserved_tons <= plant.stucco_available_tons else ERR_STUCCO_INSUFFICIENT"
        side_effects:
          - "runs calculations.run_line_capacity_and_reservation steps 1..6 and stamps prior_run_id, changeover_minutes, gap_minutes, in_window_changeover_minutes, available_minutes, capacity_msf, effective_planned_msf, stucco_reserved_tons"
          - "runs calculations.kiln_energy_and_moisture on effective_planned_msf and stamps kiln_energy_mmbtu, kiln_energy_cost_usd"
          - "plant.stucco_committed_tons += stucco_reserved_tons; plant.stucco_available_tons recomputed; plant.production_posture recomputed; plant.version += 1"
          - "increments ProductionRun.version by 1"
      - from: SCHEDULED
        to: RUNNING
        trigger: "POST /plant-ops/production-runs/{runId}/start"
        actor: ProductionScheduler
        preconditions:
          - "status == SCHEDULED else ERR_INVALID_STATE"
          - "logical clock >= window_start else ERR_RUN_WINDOW_NOT_STARTED"
          - "plant.production_posture != FROZEN else ERR_PLANT_POSTURE_FROZEN"
          - "line.status == AVAILABLE else ERR_LINE_NOT_AVAILABLE"
          - "batch.status == COMPLETED else ERR_INVALID_STATE"
          - "batch.stucco_quality_flag != FAIL else ERR_INVALID_STATE"
        side_effects:
          - "increments ProductionRun.version by 1; stucco_reserved_tons stays committed"
      - from: RUNNING
        to: COMPLETED
        trigger: "POST /plant-ops/production-runs/{runId}/complete"
        actor: ProductionScheduler
        preconditions:
          - "status == RUNNING else ERR_INVALID_STATE"
          - "scrap_msf <= actual_msf else ERR_INVALID_REQUEST"
        side_effects:
          - "stamps actual_msf, scrap_msf, edge_defect_ppm, end_defect_ppm, stucco_consumed_tons, net_good_msf, available_msf"
          - "plant.stucco_committed_tons -= stucco_reserved_tons; plant.stucco_on_hand_tons -= stucco_consumed_tons; plant.stucco_available_tons recomputed; plant.production_posture recomputed; plant.version += 1"
          - "when edge_defect_ppm > EDGE_DEFECT_PPM_CEILING (1500) or end_defect_ppm > END_DEFECT_PPM_CEILING (900): quality_state UNTESTED -> HELD with held_reason = EDGE_DEFECT (edge checked first) or END_DEFECT, plant.held_run_count += 1 and plant.production_posture re-derived"
          - "increments ProductionRun.version by 1"
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /plant-ops/production-runs/{runId}/cancel"
        actor: ProductionScheduler
        preconditions:
          - "status IN {DRAFT, SCHEDULED} else ERR_INVALID_STATE"
        side_effects:
          - "sets cancel_reason; increments ProductionRun.version by 1"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /plant-ops/production-runs/{runId}/cancel"
        actor: ProductionScheduler
        preconditions:
          - "status IN {DRAFT, SCHEDULED} else ERR_INVALID_STATE"
        side_effects:
          - "plant.stucco_committed_tons -= stucco_reserved_tons; stucco_reserved_tons set to 0.000; plant.stucco_available_tons recomputed; plant.production_posture recomputed; plant.version += 1"
          - "increments ProductionRun.version by 1"
        note: "compensating transition for stucco_commitment_conservation"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "system, cascade from POST /plant-ops/maintenance-outages/{outageId}/approve"
        actor: system
        preconditions:
          - "the run's line_id == outage.line_id"
          - "the run's [window_start, window_end) intersects [outage.window_start, outage.window_end] under closed-interval semantics"
          - "run.status IN {DRAFT, SCHEDULED}"
        side_effects:
          - "sets cancel_reason = 'OUTAGE_APPROVED:' + outage id"
          - "releases stucco exactly as the operator-driven cancel does"
          - "cancels every LoadOrder of the run with status IN {STAGED, HELD, LOADED}"

  # --------------------------------------------- ProductionRun (quality axis)
  # Parallel dimension: evolves independently of `status`, and is cyclic
  # (RELEASED -> HELD -> IN_TEST -> RELEASED) with a branching disposition.
  - entity: ProductionRun
    dimension: quality_state
    initial_state: UNTESTED
    terminal_states: [SCRAPPED]
    transitions:
      - from: UNTESTED
        to: IN_TEST
        trigger: "POST /plant-ops/production-runs/{runId}/board-tests (first specimen)"
        actor: QualityInspector
        preconditions:
          - "status == COMPLETED else ERR_INVALID_STATE"
          - "quality_state IN {UNTESTED, IN_TEST, HELD} else ERR_INVALID_STATE"
        side_effects:
          - "creates BoardTest with computed result; recomputes specimen_count, failing_specimen_count, fail_rate"
          - "when result == FAIL: last_failing_test_recorded_by_user_id = X-User-ID"
          - "increments ProductionRun.version by 1"
      - from: UNTESTED
        to: HELD
        trigger: "system, on POST /plant-ops/production-runs/{runId}/complete with defect ppm above ceiling"
        actor: system
        preconditions:
          - "edge_defect_ppm > 1500 or end_defect_ppm > 900"
        side_effects:
          - "held_reason = EDGE_DEFECT when edge_defect_ppm > 1500, else END_DEFECT"
          - "plant.held_run_count += 1; plant.production_posture re-derived; plant.version += 1"
      - from: IN_TEST
        to: RELEASED
        trigger: "POST /plant-ops/production-runs/{runId}/quality-evaluation"
        actor: QualityInspector
        preconditions:
          - "quality_state != UNTESTED (specimen_count >= 1) else ERR_NO_BOARD_TEST_SPECIMENS at priority 8"
          - "specimen_count >= MIN_SPECIMENS_FOR_RELEASE (3) else ERR_INSUFFICIENT_SPECIMENS"
          - "calculations.board_quality_evaluation returns RELEASED"
        side_effects:
          - "saleable_grade = FIRST_QUALITY; available_msf recomputed from net_good_msf"
          - "every LoadOrder of this run with status == HELD returns to STAGED with hold_source = null"
          - "increments ProductionRun.version by 1"
      - from: IN_TEST
        to: DOWNGRADED
        trigger: "POST /plant-ops/production-runs/{runId}/quality-evaluation"
        actor: QualityInspector
        preconditions:
          - "specimen_count >= MIN_SPECIMENS_FOR_RELEASE (3)"
          - "calculations.board_quality_evaluation returns DOWNGRADED"
        side_effects:
          - "saleable_grade = SECONDS; available_msf recomputed from net_good_msf"
          - "every LoadOrder of this run with status == HELD returns to STAGED"
          - "increments ProductionRun.version by 1"
      - from: IN_TEST
        to: HELD
        trigger: "POST /plant-ops/production-runs/{runId}/quality-evaluation"
        actor: QualityInspector
        preconditions:
          - "specimen_count >= MIN_SPECIMENS_FOR_RELEASE (3)"
          - "calculations.board_quality_evaluation returns HELD"
        side_effects:
          - "held_reason = BOARD_TEST_FAIL when any specimen failed a strength attribute, else MOISTURE_EXCEEDANCE"
          - "plant.held_run_count += 1; plant.production_posture re-derived; plant.version += 1"
          - "every LoadOrder of this run with status == STAGED moves to HELD with hold_source = RUN_QUALITY_HELD"
          - "increments ProductionRun.version by 1"
      - from: RELEASED
        to: HELD
        trigger: "system, cascade from a FAIL retained-sample StuccoTest on the run's CalcinerBatch"
        actor: system
        preconditions:
          - "batch.stucco_quality_flag transitions to FAIL"
          - "run.status IN {RUNNING, COMPLETED}"
        side_effects:
          - "held_reason = STUCCO_NONCONFORMING; saleable_grade = UNGRADED"
          - "plant.held_run_count += 1; plant.production_posture re-derived; plant.version += 1"
          - "every LoadOrder of this run with status == STAGED moves to HELD with hold_source = RUN_QUALITY_HELD"
        note: "makes the quality dimension cyclic; RELEASED is not terminal"
      - from: DOWNGRADED
        to: HELD
        trigger: "system, cascade from a FAIL retained-sample StuccoTest on the run's CalcinerBatch"
        actor: system
        preconditions:
          - "batch.stucco_quality_flag transitions to FAIL"
          - "run.status IN {RUNNING, COMPLETED}"
        side_effects:
          - "identical to the RELEASED -> HELD cascade"
      - from: HELD
        to: IN_TEST
        trigger: "POST /plant-ops/production-runs/{runId}/board-tests (re-test after hold)"
        actor: QualityInspector
        preconditions:
          - "quality_state == HELD"
          - "status == COMPLETED"
        side_effects:
          - "retest_count += 1; plant.held_run_count -= 1; plant.production_posture re-derived; plant.version += 1"
          - "creates the BoardTest row and recomputes specimen_count / failing_specimen_count / fail_rate"
          - "increments ProductionRun.version by 1"
        note: "closes the cycle HELD -> IN_TEST -> RELEASED"
      - from: HELD
        to: RELEASED
        trigger: "POST /plant-ops/production-runs/{runId}/quality-disposition with action == RELEASE"
        actor: QualityManager
        preconditions:
          - "quality_state == HELD else ERR_INVALID_STATE"
          - "X-User-ID != last_failing_test_recorded_by_user_id else ERR_SEGREGATION_OF_DUTIES"
          - "retest_count >= 1 else ERR_RETEST_REQUIRED"
        side_effects:
          - "saleable_grade = FIRST_QUALITY; held_reason = null"
          - "plant.held_run_count -= 1; plant.production_posture re-derived; plant.version += 1"
          - "every LoadOrder of this run with status == HELD returns to STAGED"
      - from: HELD
        to: DOWNGRADED
        trigger: "POST /plant-ops/production-runs/{runId}/quality-disposition with action == DOWNGRADE"
        actor: QualityManager
        preconditions:
          - "quality_state == HELD else ERR_INVALID_STATE"
          - "X-User-ID != last_failing_test_recorded_by_user_id else ERR_SEGREGATION_OF_DUTIES"
        side_effects:
          - "saleable_grade = SECONDS; held_reason = null"
          - "plant.held_run_count -= 1; plant.production_posture re-derived; plant.version += 1"
          - "every LoadOrder of this run with status == HELD returns to STAGED"
        note: "no retest requirement on this branch — divergent side-effect set from the RELEASE branch"
      - from: HELD
        to: SCRAPPED
        trigger: "POST /plant-ops/production-runs/{runId}/quality-disposition with action == SCRAP"
        actor: QualityManager
        preconditions:
          - "quality_state == HELD else ERR_INVALID_STATE"
          - "X-User-ID != last_failing_test_recorded_by_user_id else ERR_SEGREGATION_OF_DUTIES"
        side_effects:
          - "scrapped_msf = net_good_msf; net_good_msf = 0.000; available_msf = 0.000; saleable_grade = SCRAP"
          - "every LoadOrder of this run with status IN {STAGED, HELD, LOADED} moves to CANCELLED with cancel_reason = 'RUN_SCRAPPED'"
          - "plant.held_run_count -= 1; plant.production_posture re-derived; plant.version += 1"

  # ----------------------------------------------------------- MaintenanceOutage
  # Cyclic through DEFERRED; approval is the branch point with divergent cascades.
  - entity: MaintenanceOutage
    dimension: status
    initial_state: PROPOSED
    terminal_states: [CLOSED]
    transitions:
      - from: PROPOSED
        to: APPROVED
        trigger: "POST /plant-ops/maintenance-outages/{outageId}/approve"
        actor: PlantManager
        preconditions:
          - "status == PROPOSED else ERR_INVALID_STATE"
          - "X-User-ID != proposed_by_user_id else ERR_SEGREGATION_OF_DUTIES"
          - "line.status == AVAILABLE else ERR_LINE_NOT_AVAILABLE"
          - "no other MaintenanceOutage on the same line with status IN {APPROVED, IN_PROGRESS} intersecting this window under closed-interval semantics else ERR_OUTAGE_WINDOW_CONFLICT"
          - "calculations.outage_seasonality_gate returns ALLOWED else ERR_SEASONALITY_WINDOW_UNFAVORABLE"
        side_effects:
          - "stamps approved_by_user_id, seasonality_index, planned_downtime_hours, at_risk_msf, opportunity_cost_usd"
          - "CASCADE (hop 1 -> 2) line.status AVAILABLE -> MAINTENANCE_SCHEDULED"
          - "CASCADE (hop 2 -> 3) because the line is now MAINTENANCE_SCHEDULED, every ProductionRun on that line with status IN {DRAFT, SCHEDULED} whose window intersects the outage window moves to CANCELLED"
          - "CASCADE (hop 3 -> 4) each cancelled SCHEDULED run releases stucco_reserved_tons back to plant.stucco_committed_tons, re-derives plant.production_posture and bumps plant.version, and cancels its LoadOrders with status IN {STAGED, HELD, LOADED}"
          - "increments MaintenanceOutage.version by 1"
      - from: PROPOSED
        to: DEFERRED
        trigger: "POST /plant-ops/maintenance-outages/{outageId}/defer"
        actor: MaintenancePlanner
        preconditions:
          - "status == PROPOSED else ERR_INVALID_STATE"
          - "deferral_count < MAX_DEFERRALS (2) else ERR_MAX_DEFERRALS_REACHED"
        side_effects:
          - "deferral_count += 1; sets deferred_reason; increments MaintenanceOutage.version by 1"
      - from: DEFERRED
        to: PROPOSED
        trigger: "POST /plant-ops/maintenance-outages/{outageId}/repropose"
        actor: MaintenancePlanner
        preconditions:
          - "status == DEFERRED else ERR_INVALID_STATE"
          - "window_end > window_start else ERR_INVALID_WINDOW"
        side_effects:
          - "overwrites window_start / window_end; recomputes seasonality_index and planned_downtime_hours"
          - "increments MaintenanceOutage.version by 1"
        note: "closes the deferral cycle; deferral_count is never reset, and reaching 2 makes the seasonality gate unconditional"
      - from: APPROVED
        to: IN_PROGRESS
        trigger: "POST /plant-ops/maintenance-outages/{outageId}/start"
        actor: MaintenancePlanner
        preconditions:
          - "status == APPROVED else ERR_INVALID_STATE"
          - "logical clock >= window_start else ERR_OUTAGE_WINDOW_NOT_STARTED"
          - "no ProductionRun on the line with status == RUNNING else ERR_RUN_ACTIVE_ON_LINE"
        side_effects:
          - "line.status MAINTENANCE_SCHEDULED -> UNDER_MAINTENANCE"
          - "when outage_type == EMERGENCY: plant.production_posture re-derived to FROZEN and plant.version += 1"
          - "increments MaintenanceOutage.version by 1"
      - from: IN_PROGRESS
        to: CLOSED
        trigger: "POST /plant-ops/maintenance-outages/{outageId}/close"
        actor: MaintenancePlanner
        preconditions:
          - "status == IN_PROGRESS else ERR_INVALID_STATE"
        side_effects:
          - "line.status UNDER_MAINTENANCE -> AVAILABLE"
          - "plant.production_posture re-derived (the EMERGENCY freeze lifts) and plant.version += 1"
          - "increments MaintenanceOutage.version by 1"

  # ------------------------------------------------------------------ BoardLine
  - entity: BoardLine
    dimension: status
    initial_state: AVAILABLE
    terminal_states: []
    transitions:
      - from: AVAILABLE
        to: MAINTENANCE_SCHEDULED
        trigger: "system, on MaintenanceOutage PROPOSED -> APPROVED"
        actor: system
        preconditions:
          - "line.status == AVAILABLE"
        side_effects:
          - "run START on this line now fails with ERR_LINE_NOT_AVAILABLE"
          - "increments BoardLine.version by 1"
      - from: MAINTENANCE_SCHEDULED
        to: UNDER_MAINTENANCE
        trigger: "system, on MaintenanceOutage APPROVED -> IN_PROGRESS"
        actor: system
        preconditions:
          - "line.status == MAINTENANCE_SCHEDULED"
        side_effects:
          - "increments BoardLine.version by 1"
      - from: UNDER_MAINTENANCE
        to: AVAILABLE
        trigger: "system, on MaintenanceOutage IN_PROGRESS -> CLOSED"
        actor: system
        preconditions:
          - "line.status == UNDER_MAINTENANCE"
        side_effects:
          - "increments BoardLine.version by 1"
        note: "closes the maintenance cycle AVAILABLE -> MAINTENANCE_SCHEDULED -> UNDER_MAINTENANCE -> AVAILABLE"

  # ------------------------------------------------------------------ LoadOrder
  - entity: LoadOrder
    dimension: status
    initial_state: STAGED
    terminal_states: [SHIPPED, CANCELLED]
    transitions:
      - from: STAGED
        to: LOADED
        trigger: "POST /plant-ops/load-orders/{loadOrderId}/load"
        actor: ProductionScheduler
        preconditions:
          - "status == STAGED else ERR_INVALID_STATE"
          - "loaded_bundles_count >= 1 and <= bundles_count else ERR_INVALID_REQUEST"
          - "recomputed trailer_weight_lb <= TRAILER_MAX_LB (48000) else ERR_TRAILER_WEIGHT_EXCEEDED"
        side_effects:
          - "recomputes total_msf and trailer_weight_lb on loaded_bundles_count; run.available_msf recomputed"
          - "increments LoadOrder.version by 1"
      - from: LOADED
        to: SHIPPED
        trigger: "POST /plant-ops/load-orders/{loadOrderId}/ship"
        actor: PlantManager
        preconditions:
          - "status == LOADED else ERR_INVALID_STATE"
          - "run.quality_state IN {RELEASED, DOWNGRADED} else ERR_RUN_QUALITY_NOT_RELEASED"
        side_effects:
          - "stamps settled_freight_usd (SETTLED variant), overweight_fee_usd and freight_variance_usd"
          - "increments LoadOrder.version by 1"
      - from: STAGED
        to: HELD
        trigger: "system, cascade when the source run's quality_state moves to HELD"
        actor: system
        preconditions:
          - "status == STAGED"
        side_effects:
          - "hold_source = RUN_QUALITY_HELD; the load cannot be loaded or shipped (ERR_INVALID_STATE)"
          - "increments LoadOrder.version by 1"
      - from: HELD
        to: STAGED
        trigger: "system, cascade when the source run's quality_state returns to RELEASED or DOWNGRADED"
        actor: system
        preconditions:
          - "status == HELD"
        side_effects:
          - "hold_source = null; increments LoadOrder.version by 1"
        note: "compensating transition, makes the LoadOrder machine cyclic"
      - from: STAGED
        to: CANCELLED
        trigger: "POST /plant-ops/load-orders/{loadOrderId}/cancel"
        actor: ProductionScheduler
        preconditions:
          - "status IN {STAGED, HELD, LOADED} else ERR_INVALID_STATE"
        side_effects:
          - "sets cancel_reason; total_msf is released so run.available_msf increases by total_msf"
          - "increments LoadOrder.version by 1"
        note: "compensating transition for board_msf_conservation"
      - from: HELD
        to: CANCELLED
        trigger: "POST /plant-ops/load-orders/{loadOrderId}/cancel"
        actor: ProductionScheduler
        preconditions:
          - "status IN {STAGED, HELD, LOADED} else ERR_INVALID_STATE"
        side_effects:
          - "identical release of total_msf back to run.available_msf"
      - from: LOADED
        to: CANCELLED
        trigger: "POST /plant-ops/load-orders/{loadOrderId}/cancel"
        actor: ProductionScheduler
        preconditions:
          - "status IN {STAGED, HELD, LOADED} else ERR_INVALID_STATE"
        side_effects:
          - "identical release of total_msf back to run.available_msf"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on the parent's `version` only)
# =============================================================================
concurrency_rules:
  - rule_id: run-schedule-stale-plant
    parent_entity: Plant
    write_endpoint: "POST /plant-ops/production-runs/{runId}/schedule"
    occ_field: "expected_plant_version"
    description: |
      Scheduling a run commits silo tonnage against the plant's shared stucco
      balance. A schedule request carrying an expected_plant_version older than
      plant.version is rejected: the client's view of stucco_available_tons and
      production_posture predates another writer's commitment (a different run
      scheduled, a batch credited, or a run completed), so the reservation it
      computed may no longer fit. Scheduling a second, different run is
      legitimate product behavior, which is why this is resolved by a version
      check rather than a state precondition.
    error_id: ERR_STALE_PLANT_VERSION
    http_status: 412

  - rule_id: feed-create-stale-lot
    parent_entity: GypsumLot
    write_endpoint: "POST /plant-ops/calciner-batches/{batchId}/feeds"
    occ_field: "expected_lot_version"
    description: |
      Creating a BatchFeed draws tonnage from a lot and supersedes the client's
      view of that lot's remaining_tons, assay values and status. A feed whose
      expected_lot_version is older than lot.version is rejected, because the
      lot may have been re-assayed, drawn down by another feed, or restored by
      an abort since the client read it. Feeding the same lot again is itself
      legitimate, so the conflict is resolved by the version check.
    error_id: ERR_STALE_LOT_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:

  - name: lot_assay_disposition
    trigger: "POST /plant-ops/gypsum-lots/{lotId}/assay"
    algorithm: threshold
    formula: |
      # Checks are evaluated in this pinned order; the FIRST failure decides
      # quarantine_reason. Note the deliberately mixed comparison directions.
      if lot.source_type == SYNTHETIC and free_moisture_pct > plant.synthetic_free_moisture_ceiling_pct:
          return (QUARANTINED, MOISTURE_CEILING)          # strictly greater fails; equal passes
      if lot.source_type == NATURAL and purity_pct < plant.natural_gypsum_purity_floor_pct:
          return (QUARANTINED, PURITY_FLOOR)              # strictly less fails; equal passes
      if chloride_ppm >= CHLORIDE_CEILING_PPM:
          return (QUARANTINED, CHLORIDE_CEILING)          # equal FAILS
      return (APPROVED, null)
    input_set: "the assay payload plus the owning Plant's floors/ceilings; declared_* receipt values are never consulted"
    constants:
      CHLORIDE_CEILING_PPM: 250
      MAX_ASSAYS: 3
      ASSAY_VALIDITY_DAYS: 30
    precision: "inputs compared at 2 decimals as supplied; no rounding applied"

  - name: batch_blend_metrics
    trigger: "every POST /plant-ops/calciner-batches/{batchId}/feeds; both variants stored on the batch"
    algorithm: chronological
    formula: |
      feeds = BatchFeed rows of this batch, ordered by created_at ASC
              (feed_seq); rows of an ABORTED batch are excluded.

      # --- PLAN_BASIS: sum-then-round over assay values
      feed_moisture_plan_pct = round_half_up(
          sum(f.tons_fed * f.assay_free_moisture_pct for f in feeds)
          / sum(f.tons_fed for f in feeds), 2)
      feed_purity_plan_pct = round_half_up(
          sum(f.tons_fed * f.assay_purity_pct for f in feeds)
          / sum(f.tons_fed for f in feeds), 2)

      # --- AS_FED_BASIS: chronological accumulator, ROUNDED AFTER EVERY FEED
      acc_tons = 0
      acc_moist = 0.0
      for f in feeds:                       # created_at ASC, no other ordering
          new_tons = acc_tons + f.tons_fed
          acc_moist = round_half_up(
              (acc_moist * acc_tons + f.measured_free_moisture_pct * f.tons_fed)
              / new_tons, 2)
          acc_tons = new_tons
      feed_moisture_as_fed_pct = acc_moist
    input_set: "BatchFeed rows of a batch whose status IN {FEEDING, CALCINING, COMPLETED}; ABORTED batches report 0.000"
    constants: {}
    precision: "2 decimals, round_half_up; PLAN_BASIS rounds once at the end, AS_FED_BASIS rounds after each feed"
    variants:
      - name: PLAN_BASIS
        when: "reported as feed_moisture_plan_pct and consumed by the PLANNED_YIELD variant of stucco_yield_tons"
        difference: "uses GypsumLot assay moisture snapshots and rounds only the final quotient"
      - name: AS_FED_BASIS
        when: "reported as feed_moisture_as_fed_pct and consumed by the ACTUAL_YIELD variant of stucco_yield_tons"
        difference: "uses belt-scale measured moisture and re-rounds the running weighted average after every feed, so feed order changes the result"

  - name: stucco_yield_tons
    trigger: "PLANNED_YIELD at POST /plant-ops/calciner-batches/{batchId}/close-feed; ACTUAL_YIELD when the batch transitions CALCINING -> COMPLETED"
    algorithm: aggregation
    formula: |
      # Per-feed contributions are summed UNROUNDED; only the batch total is
      # rounded. moisture_basis is the per-feed field selected by the variant.
      total = 0
      for f in feeds (created_at ASC):
          dry   = f.tons_fed * (1 - moisture_basis(f) / 100)
          gyp   = dry * f.assay_purity_pct / 100
          inert = dry - gyp
          total += gyp * DIHYDRATE_TO_HEMIHYDRATE_FACTOR + inert * INERT_PASSTHROUGH_FACTOR
      yield_tons = round_half_up(total, 3)
    input_set: "all BatchFeed rows of the batch; ABORTED batches yield 0.000"
    constants:
      DIHYDRATE_TO_HEMIHYDRATE_FACTOR: 0.8437
      INERT_PASSTHROUGH_FACTOR: 1.0
    precision: "3 decimals, round_half_up, applied once to the batch total"
    variants:
      - name: PLANNED_YIELD
        when: "stamped on stucco_yield_plan_tons at close-feed"
        difference: "moisture_basis(f) = f.assay_free_moisture_pct (laboratory assay snapshot)"
      - name: ACTUAL_YIELD
        when: "stamped on stucco_yield_actual_tons at COMPLETED and credited to plant.stucco_on_hand_tons"
        difference: "moisture_basis(f) = f.measured_free_moisture_pct (belt-scale as-fed value); only this variant moves silo tonnage"

  - name: stucco_test_result
    trigger: "POST /plant-ops/calciner-batches/{batchId}/stucco-tests"
    algorithm: threshold
    formula: |
      if combined_water_pct < COMBINED_WATER_MIN or combined_water_pct > COMBINED_WATER_MAX: return FAIL
      if free_water_pct > FREE_WATER_FAIL_MAX:                                              return FAIL
      if set_time_minutes < SET_TIME_FAIL_MIN or set_time_minutes > SET_TIME_FAIL_MAX:       return FAIL
      if free_water_pct > FREE_WATER_PASS_MAX
         or set_time_minutes < SET_TIME_PASS_MIN
         or set_time_minutes > SET_TIME_PASS_MAX:                                           return MARGINAL
      return PASS
    input_set: "the single StuccoTest payload; normal_consistency_cc is recorded but not gating"
    constants:
      COMBINED_WATER_MIN: 4.20
      COMBINED_WATER_MAX: 6.50
      FREE_WATER_PASS_MAX: 0.30
      FREE_WATER_FAIL_MAX: 0.50
      SET_TIME_PASS_MIN: 4.00
      SET_TIME_PASS_MAX: 12.00
      SET_TIME_FAIL_MIN: 3.00
      SET_TIME_FAIL_MAX: 15.00
    precision: "compared at 2 decimals as supplied"

  - name: calciner_aggregate_capacity
    trigger: "POST /plant-ops/calciner-batches (batch plan)"
    algorithm: interval_merge
    formula: |
      # Calciner windows MAY overlap; only the aggregate instantaneous feed rate
      # is bounded. Windows are half-open [feed_window_start, feed_window_end):
      # a batch starting exactly when another ends does not overlap.
      others = CalcinerBatch rows with the same plant_id and
               status IN {PLANNED, FEEDING, CALCINING}
      for each boundary-delimited sub-interval S of the union of
          [new.window) with each o in others:
          load = new.feed_rate_tph
                 + sum(o.feed_rate_tph for o in others where o overlaps S)
          if load > plant.calciner_capacity_tph: reject ERR_CALCINER_CAPACITY_EXCEEDED
    input_set: "sibling batches at the same plant with status IN {PLANNED, FEEDING, CALCINING}; COMPLETED and ABORTED batches release their window"
    constants: {}
    precision: "rates compared at 2 decimals; strictly greater than capacity rejects, equal passes"

  - name: paper_tension_window
    trigger: "POST /plant-ops/production-runs (create)"
    algorithm: threshold
    formula: |
      required_paper_tension_lb = round_half_up(
          spec.paper_tension_min_lb
          + (run.line_speed_fpm - PAPER_TENSION_BASE_FPM) * PAPER_TENSION_PER_FPM, 2)
      valid iff run.paper_tension_lb >= required_paper_tension_lb
              and run.paper_tension_lb <= spec.paper_tension_max_lb
    input_set: "the run payload plus its ProductSpec"
    constants:
      PAPER_TENSION_BASE_FPM: 250
      PAPER_TENSION_PER_FPM: 0.06
    precision: "2 decimals, round_half_up; both comparisons are inclusive"

  - name: kiln_energy_and_moisture
    trigger: "projected_exit_moisture_pct at POST /plant-ops/production-runs; kiln_energy_mmbtu and kiln_energy_cost_usd at POST /plant-ops/production-runs/{runId}/schedule using effective_planned_msf"
    algorithm: tiered_pricing
    formula: |
      slurry_water_lb_per_msf = round_half_up(spec.target_board_weight_lb_per_msf
                                              * spec.slurry_water_stucco_ratio, 2)
      retained_lb_per_msf     = round_half_up(spec.target_board_weight_lb_per_msf
                                              * run.kiln_exit_moisture_target_pct / 100, 2)
      evap_lb_per_msf         = max(0.0, slurry_water_lb_per_msf - retained_lb_per_msf)

      # tiered dryer efficiency selected by dwell (boundaries inclusive on the upper edge)
      if   run.kiln_dwell_minutes <= 32: eff = 0.72
      elif run.kiln_dwell_minutes <= 45: eff = 0.81
      else:                              eff = 0.86

      speed_factor         = round_half_up(1 + max(0, run.line_speed_fpm - SPEED_PENALTY_FLOOR_FPM)
                                               * SPEED_PENALTY_PER_FPM, 4)
      thickness_multiplier = min(THICKNESS_MULTIPLIER_CAP,
                                 1 + (spec.thickness_in - 0.5) * THICKNESS_MULTIPLIER_SLOPE)

      base_mmbtu = evap_lb_per_msf * effective_planned_msf * LATENT_HEAT_BTU_PER_LB / eff / 1000000
      adder      = FIRE_RATED_ADDER_MMBTU_PER_MSF[spec.board_type] * effective_planned_msf
      hold       = round_half_up(run.kiln_dwell_minutes * KILN_HOLD_MMBTU_PER_MIN, 3)

      kiln_energy_mmbtu    = round_half_up(base_mmbtu * thickness_multiplier * speed_factor
                                           + adder + hold, 3)
      kiln_energy_cost_usd = round_half_up(kiln_energy_mmbtu * plant.energy_price_per_mmbtu, 2)

      # --- the moisture side of the tradeoff (stamped at create, msf-independent)
      drying_capacity_lb_per_msf  = eff * run.kiln_dwell_minutes * KILN_EVAP_LB_PER_MIN_PER_MSF
      projected_retained_lb       = max(0.0, slurry_water_lb_per_msf - drying_capacity_lb_per_msf)
      projected_exit_moisture_pct = round_half_up(projected_retained_lb
                                    / spec.target_board_weight_lb_per_msf * 100, 2)
      feasible iff projected_exit_moisture_pct
                   <= run.kiln_exit_moisture_target_pct + MOISTURE_TOLERANCE_PCT
    input_set: "one ProductionRun, its ProductSpec and its Plant; no sibling runs participate"
    constants:
      LATENT_HEAT_BTU_PER_LB: 1150
      KILN_HOLD_MMBTU_PER_MIN: 0.004
      KILN_EVAP_LB_PER_MIN_PER_MSF: 38.0
      SPEED_PENALTY_FLOOR_FPM: 350
      SPEED_PENALTY_PER_FPM: 0.0004
      THICKNESS_MULTIPLIER_SLOPE: 0.6
      THICKNESS_MULTIPLIER_CAP: 1.35
      MOISTURE_TOLERANCE_PCT: 0.10
      FIRE_RATED_ADDER_MMBTU_PER_MSF:
        REGULAR: 0.0
        TYPE_X: 0.018
        TYPE_C: 0.026
        MOLD_RESISTANT: 0.010
        ABUSE_RESISTANT: 0.014
    precision: "kiln_energy_mmbtu 3 decimals, kiln_energy_cost_usd 2 decimals, projected_exit_moisture_pct 2 decimals; all round_half_up. Intermediates (base_mmbtu, drying_capacity_lb_per_msf) are NOT rounded."
    variants:
      - name: NOMINAL_ENERGY
        when: "stamped at schedule from effective_planned_msf and the run's chosen dwell/speed"
        difference: "uses the operator's kiln_exit_moisture_target_pct as the retained-water basis"
      - name: DWELL_TRADEOFF_PROJECTION
        when: "stamped at create as projected_exit_moisture_pct"
        difference: "ignores tonnage entirely and instead tests whether the chosen dwell can physically remove the slurry water; a shorter dwell lowers hold energy but raises projected exit moisture until it breaches the tolerance"

  - name: run_line_capacity_and_reservation
    trigger: "POST /plant-ops/production-runs/{runId}/schedule"
    algorithm: constraint_propagation
    formula: |
      # PINNED EVALUATION ORDER. Steps read only earlier steps' outputs; the
      # apparent circularity (planned MSF depends on capacity, capacity depends
      # on changeover, changeover depends on which run precedes this one) is
      # resolved exactly by this order.
      #
      # 1. prior run selector (explicit, no random fields):
      #    candidates = ProductionRun where line_id == this.line_id
      #                 and id != this.id
      #                 and status IN {SCHEDULED, RUNNING, COMPLETED}
      #                 and window_end <= this.window_start
      #    ranking    = window_end DESC
      #    tie-break  = created_at DESC
      #    empty pool = cold start (prior_run_id = null)
      prior = argmax(candidates, key=(window_end, created_at))
      prior_run_id = prior.id if prior else null

      # 2. changeover matrix (minutes), then the fire-rated purge adder
      if prior is null:                                                  changeover = COLD_START_MINUTES
      elif prior.product_spec_id == this.product_spec_id:                changeover = 0
      elif prior.spec.thickness_in == this.spec.thickness_in
           and prior.spec.changeover_family == this.spec.changeover_family: changeover = 20
      elif prior.spec.thickness_in == this.spec.thickness_in:             changeover = 55
      elif prior.spec.changeover_family == this.spec.changeover_family:   changeover = 75
      else:                                                              changeover = 110
      if prior is not null and this.spec.fire_rated and not prior.spec.fire_rated:
          changeover += FIRE_RATED_PURGE_MINUTES
      changeover_minutes = changeover

      # 3. gap and buffer feasibility
      gap_minutes = null if prior is null else
                    floor((this.window_start - prior.window_end) / 60 seconds)
      if prior is not null and gap_minutes < changeover_minutes:
          reject ERR_CHANGEOVER_BUFFER_VIOLATION

      # 4. minutes actually available for board production
      in_window_changeover_minutes = COLD_START_MINUTES if prior is null else 0
      available_minutes = floor((window_end - window_start) / 60 seconds)
                          - in_window_changeover_minutes

      # 5. capacity, then the cap on the request
      msf_per_minute    = round_half_up(line_speed_fpm * (spec.board_width_in / 12) / 1000, 6)
      capacity_msf      = round_half_up(available_minutes * msf_per_minute, 3)
      if capacity_msf <= 0.000: reject ERR_WINDOW_TOO_SHORT_FOR_CHANGEOVER
      effective_planned_msf = min(requested_planned_msf, capacity_msf)

      # 6. stucco reservation, then (step 7) kiln_energy_and_moisture
      stucco_reserved_tons = round_half_up(
          effective_planned_msf * spec.stucco_lb_per_msf / 2000, 3)
      if stucco_reserved_tons > plant.stucco_available_tons: reject ERR_STUCCO_INSUFFICIENT
    input_set: "sibling ProductionRun rows on the same line with status IN {SCHEDULED, RUNNING, COMPLETED} for the prior-run selector; status IN {SCHEDULED, RUNNING} for the overlap check; CANCELLED and DRAFT runs are invisible to both"
    constants:
      COLD_START_MINUTES: 45
      FIRE_RATED_PURGE_MINUTES: 25
    precision: "msf_per_minute 6 decimals, capacity_msf and stucco_reserved_tons 3 decimals, all round_half_up; minute arithmetic floors to whole minutes"

  - name: board_quality_evaluation
    trigger: "specimen rule on POST /plant-ops/production-runs/{runId}/board-tests; run rule on POST /plant-ops/production-runs/{runId}/quality-evaluation"
    algorithm: weighted_scoring
    formula: |
      # --- specimen rule (all comparisons inclusive)
      failing_attributes = []
      if core_hardness_lbf   < spec.core_hardness_min_lbf:   append CORE_HARDNESS
      if nail_pull_lbf       < spec.nail_pull_min_lbf:       append NAIL_PULL
      if flexural_cross_lbf  < spec.flexural_cross_min_lbf:  append FLEXURAL_CROSS
      if exit_moisture_pct   > run.kiln_exit_moisture_target_pct + MOISTURE_TOLERANCE_PCT:
                                                             append EXIT_MOISTURE
      result = FAIL if failing_attributes else PASS

      # --- run rule
      n = specimen_count
      if n == 0:                          reject ERR_NO_BOARD_TEST_SPECIMENS
      if n < MIN_SPECIMENS_FOR_RELEASE:    reject ERR_INSUFFICIENT_SPECIMENS
      fail_rate = round_half_up(failing_specimen_count / n, 4)
      if spec.fire_rated and failing_specimen_count >= 1:  return HELD
      if fail_rate == 0.0000:                              return RELEASED
      if fail_rate <= DOWNGRADE_FAIL_RATE_CEILING:         return DOWNGRADED
      return HELD
    input_set: "all BoardTest rows for the run, including specimens recorded before a hold; re-tests add rows and never delete them"
    constants:
      MIN_SPECIMENS_FOR_RELEASE: 3
      DOWNGRADE_FAIL_RATE_CEILING: 0.2500
      MOISTURE_TOLERANCE_PCT: 0.10
    precision: "fail_rate 4 decimals, round_half_up; the ceiling comparison is inclusive so exactly 0.2500 downgrades"

  - name: plant_production_posture
    trigger: "re-derived after every mutation that changes held_run_count, stucco_on_hand_tons, stucco_committed_tons, or an EMERGENCY outage's status"
    algorithm: aggregation
    formula: |
      held_run_count = count(ProductionRun where plant_id == plant.id
                             and quality_state == HELD)
      stucco_available_tons = round_half_up(stucco_on_hand_tons
                                            - stucco_committed_tons, 3)
      emergency_active = exists(MaintenanceOutage o
                                where o.line.plant_id == plant.id
                                and o.status == IN_PROGRESS
                                and o.outage_type == EMERGENCY)

      if held_run_count >= FROZEN_HELD_RUN_THRESHOLD or emergency_active: return FROZEN
      if held_run_count >= 1 or stucco_available_tons < RESTRICTED_STUCCO_FLOOR_TONS:
                                                                          return RESTRICTED
      return OPEN
    input_set: "ProductionRun rows of this plant in quality_state == HELD (any status, including CANCELLED runs is impossible because cancel precedes any board test); MaintenanceOutage rows through BoardLine.plant_id"
    constants:
      FROZEN_HELD_RUN_THRESHOLD: 3
      RESTRICTED_STUCCO_FLOOR_TONS: 40.0
    precision: "stucco_available_tons 3 decimals, round_half_up; held-run comparison is >=, stucco comparison is strict <"

  - name: outage_seasonality_gate
    trigger: "POST /plant-ops/maintenance-outages (index stamped) and POST /plant-ops/maintenance-outages/{outageId}/approve (gate evaluated)"
    algorithm: decay_function
    formula: |
      seasonality_index = HOUSING_SEASONALITY_INDEX[month_utc(window_start)]
      planned_downtime_hours = round_half_up(
          (window_end - window_start) / 3600 seconds, 2)
      at_risk_msf = round_half_up(sum(r.effective_planned_msf
          for r in ProductionRun
          where r.line_id == outage.line_id
            and r.status IN {SCHEDULED, RUNNING}
            and r.window_start <= outage.window_end
            and outage.window_start <= r.window_end), 3)
      opportunity_cost_usd = round_half_up(at_risk_msf
                             * plant.contribution_margin_per_msf, 2)

      # gate
      if outage.outage_type == EMERGENCY:                  return ALLOWED
      if outage.deferral_count >= MAX_DEFERRALS:           return ALLOWED   # deferred twice, must be done
      if seasonality_index <= PLANNED_OUTAGE_INDEX_CEILING: return ALLOWED
      return BLOCKED                                                       # ERR_SEASONALITY_WINDOW_UNFAVORABLE
    input_set: "the outage window's UTC month for the index; SCHEDULED and RUNNING runs on the same line for at-risk MSF (DRAFT and CANCELLED excluded)"
    constants:
      PLANNED_OUTAGE_INDEX_CEILING: 0.90
      MAX_DEFERRALS: 2
      HOUSING_SEASONALITY_INDEX:
        1: 0.62
        2: 0.66
        3: 0.85
        4: 1.05
        5: 1.18
        6: 1.24
        7: 1.20
        8: 1.16
        9: 1.06
        10: 0.90
        11: 0.80
        12: 0.68
    precision: "index compared at 2 decimals with an inclusive ceiling, so a month whose index is exactly 0.90 is ALLOWED"

  - name: bundle_load_metrics
    trigger: "POST /plant-ops/load-orders (on bundles_count) and POST /plant-ops/load-orders/{loadOrderId}/load (recomputed on loaded_bundles_count)"
    algorithm: aggregation
    formula: |
      billable_bundles = bundles_count before load, loaded_bundles_count after load
      board_msf_each   = round_half_up(spec.board_length_ft * spec.board_width_in / 12 / 1000, 6)
      bundle_msf       = round_half_up(boards_per_bundle * board_msf_each, 4)
      bundle_weight_lb = round_half_up(boards_per_bundle
                          * spec.target_board_weight_lb_per_msf * board_msf_each, 2)
      total_msf        = round_half_up(billable_bundles * bundle_msf, 3)
      trailer_weight_lb= round_half_up(billable_bundles * bundle_weight_lb, 2)

      valid iff boards_per_bundle is even
            and 2 <= boards_per_bundle <= spec.max_boards_per_bundle       else ERR_BUNDLE_CONFIG_INVALID
            and trailer_weight_lb <= TRAILER_MAX_LB                        else ERR_TRAILER_WEIGHT_EXCEEDED
            and total_msf <= run.available_msf                             else ERR_RUN_MSF_INSUFFICIENT
    input_set: "one LoadOrder, the source run's ProductSpec, and the run's available_msf which nets out sibling LoadOrders with status IN {STAGED, HELD, LOADED, SHIPPED}"
    constants:
      TRAILER_MAX_LB: 48000
    precision: "board_msf_each 6, bundle_msf 4, total_msf 3, weights 2 decimals; all round_half_up. The weight ceiling is inclusive."

  - name: freight_charge
    trigger: "QUOTED at POST /plant-ops/load-orders; SETTLED at POST /plant-ops/load-orders/{loadOrderId}/ship"
    algorithm: tiered_pricing
    formula: |
      # zone selection (lower bound inclusive, upper bound exclusive)
      if   distance_miles < 150: (rate_zone, base_rate_per_msf) = (ZONE_1,  8.50)
      elif distance_miles < 350: (rate_zone, base_rate_per_msf) = (ZONE_2, 12.75)
      elif distance_miles < 600: (rate_zone, base_rate_per_msf) = (ZONE_3, 17.40)
      else:                      (rate_zone, base_rate_per_msf) = (ZONE_4, 23.10)

      # PINNED ROUNDING ORDER — round per bundle, THEN sum, THEN surcharge,
      # THEN accessorials, THEN the minimum-charge floor. Rounding the summed
      # MSF against the rate instead ("sum then round") yields a different cent
      # value and is WRONG for this scaffold.
      per_bundle_charge = round_half_up(bundle_msf * base_rate_per_msf, 2)
      subtotal          = per_bundle_charge * billable_bundles
      fuel              = round_half_up(subtotal * market.fuel_surcharge_pct / 100, 2)
      overweight_fee    = round_half_up(max(0, trailer_weight_lb - TRAILER_TARGET_LB)
                                        * OVERWEIGHT_USD_PER_LB, 2)   # SETTLED only
      credit            = market.backhaul_credit_usd if (SETTLED and load.backhaul) else 0.00
      charge            = max(round_half_up(subtotal + fuel + overweight_fee - credit, 2),
                              market.min_charge_usd)
    input_set: "one LoadOrder and its Market; billable_bundles = bundles_count for QUOTED, loaded_bundles_count for SETTLED"
    constants:
      TRAILER_TARGET_LB: 44000
      OVERWEIGHT_USD_PER_LB: 0.02
    precision: "2 decimals, round_half_up at each pinned step; the minimum-charge floor is applied last and is never rounded further"
    variants:
      - name: QUOTED
        when: "stamped on quoted_freight_usd when the LoadOrder is created (STAGED)"
        difference: "bills the PLANNED bundles_count, applies no overweight accessorial and no backhaul credit"
      - name: SETTLED
        when: "stamped on settled_freight_usd at SHIPPED, with freight_variance_usd = settled - quoted"
        difference: "bills loaded_bundles_count, adds the overweight accessorial above 44000 lb and subtracts the backhaul credit when the load ships with a backhaul, so identical board volume settles at a different amount than it quoted"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority; lowest number wins)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and X-User-Role is a declared role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "the acting role appears in the endpoint's roles list in §1.5"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "path-addressed resources exist, validated left to right"
    error_id: ERR_PLANT_NOT_FOUND
    http_status: 404
    applies_to: "all paths containing {plantId}"

  - priority: 3
    category: existence
    check: "path-addressed lot exists"
    error_id: ERR_LOT_NOT_FOUND
    http_status: 404
    applies_to: "all paths containing {lotId}"

  - priority: 3
    category: existence
    check: "path-addressed batch exists"
    error_id: ERR_BATCH_NOT_FOUND
    http_status: 404
    applies_to: "all paths containing {batchId}"

  - priority: 3
    category: existence
    check: "path-addressed run exists"
    error_id: ERR_RUN_NOT_FOUND
    http_status: 404
    applies_to: "all paths containing {runId}"

  - priority: 3
    category: existence
    check: "path-addressed outage exists"
    error_id: ERR_OUTAGE_NOT_FOUND
    http_status: 404
    applies_to: "all paths containing {outageId}"

  - priority: 3
    category: existence
    check: "path-addressed load order exists"
    error_id: ERR_LOAD_ORDER_NOT_FOUND
    http_status: 404
    applies_to: "all paths containing {loadOrderId}"

  - priority: 4
    category: business_constraint
    check: "request body parses; required fields present; enums, numeric ranges and uniqueness (Plant.code, ProductSpec.sku_code per plant, StuccoTest.sample_seq per batch, BoardTest.specimen_seq per run) hold; ProductSpec.fire_rated agrees with board_type; scrap_msf <= actual_msf; loaded_bundles_count <= bundles_count"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all write endpoints"

  - priority: 5
    category: existence
    check: "body-referenced foreign keys exist: plant_id, line_id, product_spec_id, calciner_batch_id, lot_id, run_id, market_id"
    error_id: ERR_REFERENCE_NOT_FOUND
    http_status: 404
    applies_to: "POST /plant-ops/gypsum-lots, POST /plant-ops/calciner-batches, POST /plant-ops/calciner-batches/{batchId}/feeds, POST /plant-ops/production-runs, POST /plant-ops/load-orders"

  - priority: 6
    category: business_referential
    check: "cross-referenced entities belong to the same Plant: feed lot vs batch, run line/spec/batch vs run plant"
    error_id: ERR_PLANT_SCOPE_MISMATCH
    http_status: 409
    applies_to: "POST /plant-ops/calciner-batches/{batchId}/feeds, POST /plant-ops/production-runs"

  - priority: 7
    category: state
    check: "expected_plant_version equals Plant.version (OCC, concurrency_rules.run-schedule-stale-plant)"
    error_id: ERR_STALE_PLANT_VERSION
    http_status: 412
    applies_to: "POST /plant-ops/production-runs/{runId}/schedule"

  - priority: 7
    category: state
    check: "expected_lot_version equals GypsumLot.version (OCC, concurrency_rules.feed-create-stale-lot)"
    error_id: ERR_STALE_LOT_VERSION
    http_status: 412
    applies_to: "POST /plant-ops/calciner-batches/{batchId}/feeds"

  - priority: 8
    category: state
    check: "the target resource is in a state from which the requested transition is declared in §1.2; exception: on POST /plant-ops/production-runs/{runId}/quality-evaluation a run whose quality_state is UNTESTED returns ERR_NO_BOARD_TEST_SPECIMENS instead of this generic error"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action endpoints"

  - priority: 8
    category: state
    check: "the run has at least one recorded BoardTest specimen (quality_state == UNTESTED means specimen_count == 0); returns ERR_NO_BOARD_TEST_SPECIMENS in place of the generic invalid-state error"
    error_id: ERR_NO_BOARD_TEST_SPECIMENS
    http_status: 422
    applies_to: "POST /plant-ops/production-runs/{runId}/quality-evaluation"

  - priority: 8
    category: state
    check: "the feed's source lot has status == APPROVED (RECEIVED, QUARANTINED, REJECTED and DEPLETED all reject)"
    error_id: ERR_LOT_NOT_APPROVED
    http_status: 409
    applies_to: "POST /plant-ops/calciner-batches/{batchId}/feeds"

  - priority: 8
    category: state
    check: "the lot has been assayed no more than MAX_ASSAYS (3) times"
    error_id: ERR_MAX_ASSAYS_REACHED
    http_status: 409
    applies_to: "POST /plant-ops/gypsum-lots/{lotId}/assay"

  - priority: 8
    category: state
    check: "the outage has been deferred fewer than MAX_DEFERRALS (2) times"
    error_id: ERR_MAX_DEFERRALS_REACHED
    http_status: 409
    applies_to: "POST /plant-ops/maintenance-outages/{outageId}/defer"

  - priority: 8
    category: state
    check: "the source run's quality_state is RELEASED or DOWNGRADED before the load may ship"
    error_id: ERR_RUN_QUALITY_NOT_RELEASED
    http_status: 409
    applies_to: "POST /plant-ops/load-orders/{loadOrderId}/ship"

  - priority: 8
    category: state
    check: "the line is AVAILABLE (run start) or AVAILABLE (outage approve)"
    error_id: ERR_LINE_NOT_AVAILABLE
    http_status: 409
    applies_to: "POST /plant-ops/production-runs/{runId}/start, POST /plant-ops/maintenance-outages/{outageId}/approve"

  - priority: 8
    category: state
    check: "no ProductionRun on the outage's line has status == RUNNING"
    error_id: ERR_RUN_ACTIVE_ON_LINE
    http_status: 409
    applies_to: "POST /plant-ops/maintenance-outages/{outageId}/start"

  - priority: 9
    category: business_safety
    check: "the acting X-User-ID is not the outage proposer, and not the inspector who recorded the run's most recent FAIL specimen"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /plant-ops/maintenance-outages/{outageId}/approve, POST /plant-ops/production-runs/{runId}/quality-disposition"

  - priority: 10
    category: business_safety
    check: "plant.production_posture != FROZEN"
    error_id: ERR_PLANT_POSTURE_FROZEN
    http_status: 409
    applies_to: "POST /plant-ops/production-runs/{runId}/schedule, POST /plant-ops/production-runs/{runId}/start"

  - priority: 10
    category: business_safety
    check: "a fire-rated SKU is not scheduled while plant.production_posture == RESTRICTED"
    error_id: ERR_POSTURE_RESTRICTED_FIRE_RATED
    http_status: 409
    applies_to: "POST /plant-ops/production-runs/{runId}/schedule"

  - priority: 11
    category: business_safety
    check: "a fire-rated SKU's calciner batch carries stucco_quality_flag == PASS (MARGINAL, FAIL and PENDING all reject)"
    error_id: ERR_FIRE_RATED_STUCCO_NONCONFORMING
    http_status: 422
    applies_to: "POST /plant-ops/production-runs/{runId}/schedule"

  - priority: 11
    category: business_safety
    check: "the source lot's assay is no older than ASSAY_VALIDITY_DAYS (30) at the logical clock"
    error_id: ERR_ASSAY_EXPIRED
    http_status: 409
    applies_to: "POST /plant-ops/calciner-batches/{batchId}/feeds"

  - priority: 12
    category: business_temporal
    check: "window_end is strictly after window_start on runs, batches and outages"
    error_id: ERR_INVALID_WINDOW
    http_status: 400
    applies_to: "POST /plant-ops/production-runs, POST /plant-ops/calciner-batches, POST /plant-ops/maintenance-outages, POST /plant-ops/maintenance-outages/{outageId}/repropose"

  - priority: 12
    category: business_temporal
    check: "the logical clock has reached window_start"
    error_id: ERR_RUN_WINDOW_NOT_STARTED
    http_status: 409
    applies_to: "POST /plant-ops/production-runs/{runId}/start"

  - priority: 12
    category: business_temporal
    check: "the logical clock has reached the outage window_start"
    error_id: ERR_OUTAGE_WINDOW_NOT_STARTED
    http_status: 409
    applies_to: "POST /plant-ops/maintenance-outages/{outageId}/start"

  - priority: 13
    category: business_temporal
    check: "the run window does not intersect an APPROVED or IN_PROGRESS outage window on the same line, treating outage windows as CLOSED [start, end] so a run starting exactly at the outage end conflicts; also applies between two outages on one line"
    error_id: ERR_OUTAGE_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /plant-ops/production-runs/{runId}/schedule, POST /plant-ops/maintenance-outages/{outageId}/approve"

  - priority: 14
    category: business_constraint
    check: "the run window does not overlap another SCHEDULED or RUNNING run on the same line, treating run windows as HALF-OPEN [start, end) so touching windows do not overlap"
    error_id: ERR_LINE_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /plant-ops/production-runs/{runId}/schedule"

  - priority: 15
    category: business_constraint
    check: "gap_minutes between the prior run's window_end and this window_start is at least changeover_minutes"
    error_id: ERR_CHANGEOVER_BUFFER_VIOLATION
    http_status: 409
    applies_to: "POST /plant-ops/production-runs/{runId}/schedule"

  - priority: 16
    category: business_temporal
    check: "calculations.outage_seasonality_gate returns ALLOWED"
    error_id: ERR_SEASONALITY_WINDOW_UNFAVORABLE
    http_status: 409
    applies_to: "POST /plant-ops/maintenance-outages/{outageId}/approve"

  - priority: 17
    category: business_constraint
    check: "line_speed_fpm <= min(line.max_speed_fpm, spec.line_speed_max_fpm)"
    error_id: ERR_LINE_SPEED_EXCEEDS_SPEC
    http_status: 422
    applies_to: "POST /plant-ops/production-runs"

  - priority: 17
    category: business_constraint
    check: "paper_tension_lb lies within [required_paper_tension_lb, spec.paper_tension_max_lb]"
    error_id: ERR_PAPER_TENSION_OUT_OF_RANGE
    http_status: 422
    applies_to: "POST /plant-ops/production-runs"

  - priority: 17
    category: business_constraint
    check: "projected_exit_moisture_pct <= kiln_exit_moisture_target_pct + MOISTURE_TOLERANCE_PCT"
    error_id: ERR_KILN_PROFILE_INFEASIBLE
    http_status: 422
    applies_to: "POST /plant-ops/production-runs"

  - priority: 17
    category: business_constraint
    check: "capacity_msf > 0.000 after the cold-start changeover is absorbed"
    error_id: ERR_WINDOW_TOO_SHORT_FOR_CHANGEOVER
    http_status: 422
    applies_to: "POST /plant-ops/production-runs/{runId}/schedule"

  - priority: 17
    category: business_constraint
    check: "boards_per_bundle is even and within [2, spec.max_boards_per_bundle]"
    error_id: ERR_BUNDLE_CONFIG_INVALID
    http_status: 422
    applies_to: "POST /plant-ops/load-orders"

  - priority: 17
    category: business_constraint
    check: "specimen_count >= MIN_SPECIMENS_FOR_RELEASE (3) before a run quality evaluation"
    error_id: ERR_INSUFFICIENT_SPECIMENS
    http_status: 422
    applies_to: "POST /plant-ops/production-runs/{runId}/quality-evaluation"

  - priority: 17
    category: business_constraint
    check: "retest_count >= 1 before a HELD run may be dispositioned RELEASE"
    error_id: ERR_RETEST_REQUIRED
    http_status: 409
    applies_to: "POST /plant-ops/production-runs/{runId}/quality-disposition"

  - priority: 18
    category: business_constraint
    check: "aggregate calciner feed rate over every overlapping sub-interval stays within plant.calciner_capacity_tph"
    error_id: ERR_CALCINER_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /plant-ops/calciner-batches"

  - priority: 19
    category: business_fiscal
    check: "trailer_weight_lb <= TRAILER_MAX_LB (48000)"
    error_id: ERR_TRAILER_WEIGHT_EXCEEDED
    http_status: 422
    applies_to: "POST /plant-ops/load-orders, POST /plant-ops/load-orders/{loadOrderId}/load"

  - priority: 19
    category: business_fiscal
    check: "the silo can absorb the batch's actual yield"
    error_id: ERR_SILO_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /plant-ops/calciner-batches/{batchId}/stucco-tests"

  - priority: 20
    category: business_fiscal
    check: "tons_fed <= lot.remaining_tons"
    error_id: ERR_LOT_TONS_INSUFFICIENT
    http_status: 409
    applies_to: "POST /plant-ops/calciner-batches/{batchId}/feeds"

  - priority: 20
    category: business_fiscal
    check: "stucco_reserved_tons <= plant.stucco_available_tons"
    error_id: ERR_STUCCO_INSUFFICIENT
    http_status: 409
    applies_to: "POST /plant-ops/production-runs/{runId}/schedule"

  - priority: 20
    category: business_fiscal
    check: "total_msf <= run.available_msf"
    error_id: ERR_RUN_MSF_INSUFFICIENT
    http_status: 409
    applies_to: "POST /plant-ops/load-orders"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:

  # ------------------------------------------------------------- configuration
  - method: POST
    path: "/plant-ops/plants"
    description: "Register a wallboard plant with its calciner, silo, assay and cost parameters."
    roles: [PlantAdmin]
    code: 201
    input: ["code", "name", "calciner_capacity_tph", "stucco_silo_capacity_tons", "natural_gypsum_purity_floor_pct?", "synthetic_free_moisture_ceiling_pct?", "energy_price_per_mmbtu", "contribution_margin_per_msf"]
    output: Plant
    side_effects:
      - "initialises stucco_on_hand_tons = 0.000, stucco_committed_tons = 0.000, held_run_count = 0"
      - "derives production_posture via calculations.plant_production_posture — an empty silo yields RESTRICTED because stucco_available_tons 0.000 < 40.0"

  - method: POST
    path: "/plant-ops/plants/{plantId}/board-lines"
    description: "Add a board line to a plant. The line is the temporal resource that production runs and outages occupy."
    roles: [PlantAdmin]
    code: 201
    input: [designation, max_speed_fpm, web_width_in]
    output: BoardLine
    side_effects: ["sets status = AVAILABLE"]

  - method: POST
