  - section: endpoints
    instances:
      - name: estimate_collection_supports_create_read_and_filtered_list
        claim_type: standard_crud
        grounds:
          - endpoints.POST_/estimates
          - endpoints.GET_/estimates/{id}
          - endpoints.GET_/estimates
        distinguishing_aspect: |
          The estimate collection is the only place the progressive-estimating history is
          readable, so its filters must compose: project_id with status, project_id with
          milestone_code, and limit/offset paging that still reports total_count over the whole
          filtered set rather than the page.
