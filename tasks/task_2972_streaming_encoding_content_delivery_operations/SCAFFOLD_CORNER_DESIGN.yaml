# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Task 2972 — Streaming Encoding & Content Delivery Operations
#
# Breadth probe. Nine `section:` values taken verbatim from
# references/claim-extraction-guide.md; `claim_type:` values taken from that
# guide's per-section rows. Every `grounds:` ref resolves into SCAFFOLD.yaml
# §1.1-§1.7; every `setup_api_calls:` chain starts from an empty database and
# uses only endpoints declared in §1.5; every numeric assert is a literal
# computed from the §1.3 formulas and their constants.
#
# Naming convention: an instance whose `trigger:` is a DELIBERATE rejection
# carries a name ending in `_rejected` / `_returns_<error>` / `_cannot_<verb>`
# so the downstream unit-test generator can tell a negative test from a happy
# path without re-deriving it. Names are unique across the union of
# SCAFFOLD_DIFFICULTY_DESIGN.yaml (§1.8) and this file.
#
# Fixture conventions (each instance still declares its own full chain):
#   The logical clock stays at its startup default 2026-08-01T00:00:00Z unless
#   the instance calls POST /_clock/set_current_utc.
#   UUID_ABSENT = "11111111-1111-4111-8111-111111111111" is used as a
#   well-formed id that is guaranteed never to have been minted.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  # SECTION 1 — From Table 1 (Entities)
  # ===========================================================================
  - section: entities
    instances:

      - name: title_creation_returns_declared_defaults
        claim_type: creation
        grounds:
          - entities.Title
          - endpoints.POST_/titles
          - entities.Title.fields.availability_state
          - entities.Title.fields.packaging_state
          - entities.Title.fields.encode_budget_remaining_usd
        distinguishing_aspect: "POST /titles with only the four required inputs returns 201 and every declared default at once: DRAFT / UNPACKAGED / NONE, both readiness variants 0.00, encode_budget_usd 5000.00 mirrored into encode_budget_remaining_usd, locked_ladder_count 0, last_sweep_at null and version 1."
        test_recipe:
          setup:
            - "Empty database; logical clock at its 2026-08-01T00:00:00Z startup default."
          setup_api_calls: []
          trigger:
            - call: "POST /titles"
              payload: { external_ref: "TTL-CORNER-01", title_name: "Corner Reference Cut", content_type: "MOVIE", studio_code: "NOVAPIC" }
              as: ContentOps
              captures: { t_id: $.data.id }
          assert:
            - "HTTP status == 201"
            - "Title.${t_id}.availability_state == DRAFT"
            - "Title.${t_id}.packaging_state == UNPACKAGED"
            - "Title.${t_id}.takedown_reason == NONE"
            - "Title.${t_id}.readiness_score_provisional == 0.00"
            - "Title.${t_id}.readiness_score_certified == 0.00"
            - "Title.${t_id}.encode_budget_usd == 5000.00"
            - "Title.${t_id}.encode_budget_remaining_usd == 5000.00"
            - "Title.${t_id}.locked_ladder_count == 0"
            - "Title.${t_id}.last_sweep_at == null"
            - "Title.${t_id}.version == 1"

      - name: title_retrieval_returns_stored_fields
        claim_type: retrieval
        grounds:
          - endpoints.GET_/titles/{id}
          - entities.Title.fields.encode_budget_usd
        distinguishing_aspect: "GET /titles/{id} returns the same external_ref, title_name, content_type, studio_code and the explicitly supplied encode_budget_usd 1200.50, and is readable by QcAnalyst as a shared operation."
        test_recipe:
          setup:
            - "One Title created with an explicit encode_budget_usd of 1200.50."
          setup_api_calls:
            - call: "POST /titles"
              payload: { external_ref: "TTL-READ-02", title_name: "Readback Cut", content_type: "EPISODE", studio_code: "NOVAPIC", encode_budget_usd: 1200.50 }
              as: ContentOps
              captures: { t_id: $.data.id }
          trigger:
            - call: "GET /titles/${t_id}"
              payload: {}
              as: QcAnalyst
          assert:
            - "HTTP status == 200"
            - "Title.${t_id}.external_ref == TTL-READ-02"
            - "Title.${t_id}.title_name == Readback Cut"
            - "Title.${t_id}.content_type == EPISODE"
            - "Title.${t_id}.studio_code == NOVAPIC"
            - "Title.${t_id}.encode_budget_usd == 1200.50"
            - "Title.${t_id}.encode_budget_remaining_usd == 1200.50"

      - name: title_listing_paginated_ordered_by_created_at
        claim_type: listing
        grounds:
          - endpoints.GET_/titles
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: "Three Titles created in order A, B, C are returned by GET /titles with page_size 2 as exactly [TTL-PAGE-A, TTL-PAGE-B] with total_count 3 and has_more true, and page 2 returns exactly [TTL-PAGE-C] with has_more false — created_at ASC ordering, never id ordering."
        test_recipe:
          setup:
            - "Exactly three Titles, created in the order TTL-PAGE-A, TTL-PAGE-B, TTL-PAGE-C."
          setup_api_calls:
            - call: "POST /titles"
              payload: { external_ref: "TTL-PAGE-A", title_name: "Page A", content_type: "MOVIE", studio_code: "NOVAPIC" }
              as: ContentOps
            - call: "POST /titles"
              payload: { external_ref: "TTL-PAGE-B", title_name: "Page B", content_type: "MOVIE", studio_code: "NOVAPIC" }
              as: ContentOps
            - call: "POST /titles"
              payload: { external_ref: "TTL-PAGE-C", title_name: "Page C", content_type: "MOVIE", studio_code: "NOVAPIC" }
              as: ContentOps
          trigger:
            - call: "GET /titles"
              payload: { page: 1, page_size: 2 }
              as: ContentOps
            - call: "GET /titles"
              payload: { page: 2, page_size: 2 }
              as: ContentOps
          assert:
            - "page 1 response: total_count == 3 and has_more == true and exactly 2 Titles returned"
            - "page 1 response: Title[0].external_ref == TTL-PAGE-A and Title[1].external_ref == TTL-PAGE-B"
            - "page 2 response: total_count == 3 and has_more == false and exactly 1 Title returned"
            - "page 2 response: Title[0].external_ref == TTL-PAGE-C"

      - name: unknown_path_ids_across_collections_return_not_found
        claim_type: not_found
        grounds:
          - validations[priority=7]
          - errors[ERR_TITLE_NOT_FOUND]
          - errors[ERR_ASSET_NOT_FOUND]
          - errors[ERR_LADDER_NOT_FOUND]
          - errors[ERR_PACKAGE_NOT_FOUND]
          - errors[ERR_POLICY_NOT_FOUND]
          - errors[ERR_RESERVATION_NOT_FOUND]
          - errors[ERR_WINDOW_NOT_FOUND]
          - errors[ERR_JOB_NOT_FOUND]
          - errors[ERR_VENDOR_NOT_FOUND]
          - errors[ERR_METRIC_WINDOW_NOT_FOUND]
        distinguishing_aspect: "Each of the ten path-addressable collections answers a well-formed but never-minted UUID with its OWN 404 error_id — the ten codes are not collapsed into a single generic not-found."
        test_recipe:
          setup:
            - "Empty database; no entity of any kind has been created."
          setup_api_calls: []
          trigger:
            - call: "GET /titles/11111111-1111-4111-8111-111111111111"
              payload: {}
              as: ContentOps
            - call: "GET /mezzanine-assets/11111111-1111-4111-8111-111111111111"
              payload: {}
              as: QcAnalyst
            - call: "GET /encoding-ladders/11111111-1111-4111-8111-111111111111"
              payload: {}
              as: EncodingEngineer
            - call: "GET /drm-packages/11111111-1111-4111-8111-111111111111"
              payload: {}
              as: DrmOperator
            - call: "GET /routing-policies/11111111-1111-4111-8111-111111111111"
              payload: {}
              as: DeliveryEngineer
            - call: "GET /live-reservations/11111111-1111-4111-8111-111111111111"
              payload: {}
              as: DeliveryEngineer
            - call: "POST /availability-windows/11111111-1111-4111-8111-111111111111/cancel"
              payload: {}
              as: ContentOps
            - call: "GET /reprocess-jobs/11111111-1111-4111-8111-111111111111"
              payload: {}
              as: EncodingEngineer
            - call: "GET /cdn-vendors/11111111-1111-4111-8111-111111111111"
              payload: {}
              as: PlatformAdmin
            - call: "GET /playback-metrics/11111111-1111-4111-8111-111111111111"
              payload: {}
              as: DeliveryEngineer
          assert:
            - "GET /titles/{unknown} -> HTTP 404 with error_id == ERR_TITLE_NOT_FOUND"
            - "GET /mezzanine-assets/{unknown} -> HTTP 404 with error_id == ERR_ASSET_NOT_FOUND"
            - "GET /encoding-ladders/{unknown} -> HTTP 404 with error_id == ERR_LADDER_NOT_FOUND"
            - "GET /drm-packages/{unknown} -> HTTP 404 with error_id == ERR_PACKAGE_NOT_FOUND"
            - "GET /routing-policies/{unknown} -> HTTP 404 with error_id == ERR_POLICY_NOT_FOUND"
            - "GET /live-reservations/{unknown} -> HTTP 404 with error_id == ERR_RESERVATION_NOT_FOUND"
            - "POST /availability-windows/{unknown}/cancel -> HTTP 404 with error_id == ERR_WINDOW_NOT_FOUND"
            - "GET /reprocess-jobs/{unknown} -> HTTP 404 with error_id == ERR_JOB_NOT_FOUND"
            - "GET /cdn-vendors/{unknown} -> HTTP 404 with error_id == ERR_VENDOR_NOT_FOUND"
            - "GET /playback-metrics/{unknown} -> HTTP 404 with error_id == ERR_METRIC_WINDOW_NOT_FOUND"

      - name: body_foreign_keys_validated_in_input_order_not_found
        claim_type: foreign_key_integrity
        grounds:
          - validations[priority=8]
          - complexity_profile.entity_topology
          - errors[ERR_TITLE_NOT_FOUND]
          - errors[ERR_LADDER_NOT_FOUND]
          - errors[ERR_VENDOR_NOT_FOUND]
          - errors[ERR_DEVICE_PROFILE_NOT_FOUND]
        distinguishing_aspect: "Body foreign keys are resolved in the order §1.5 declares them, so POST /playback-metrics carrying BOTH an unknown device_profile_id and an unknown vendor_id returns ERR_DEVICE_PROFILE_NOT_FOUND (the earlier input field) rather than ERR_VENDOR_NOT_FOUND."
        test_recipe:
          setup:
            - "One MOVIE Title, one ACTIVE SMART_TV_4K device profile and one CdnVendor ALPHA serving US exist, so each negative call has exactly one unresolvable reference."
          setup_api_calls:
            - call: "POST /device-profiles"
              payload: { device_class: "SMART_TV_4K", max_height_px: 2160, supported_codecs: ["HEVC", "AV1"], min_bitrate_kbps: 3000, max_bitrate_kbps: 25000, hdcp_required: true, required_drm_system: "WIDEVINE", market_share_pct: 30.00, quality_normalization_factor: 1.00 }
              as: PlatformAdmin
              captures: { dp_id: $.data.id }
            - call: "POST /cdn-vendors"
              payload: { vendor_code: "ALPHA", regions: ["US"], committed_gbps: 100.00, cost_per_gb_usd: 0.0300 }
              as: PlatformAdmin
              captures: { v_id: $.data.id }
            - call: "POST /titles"
              payload: { external_ref: "TTL-FK-03", title_name: "FK Integrity Cut", content_type: "MOVIE", studio_code: "NOVAPIC" }
              as: ContentOps
              captures: { t_id: $.data.id }
            - call: "GET /titles/${t_id}"
              payload: {}
              as: ContentOps
              captures: { t_ver: $.data.version }
          trigger:
            - call: "POST /mezzanine-assets"
              payload: { title_id: "11111111-1111-4111-8111-111111111111", source_uri: "s3://mez/fk-orphan.mxf", duration_seconds: 3600, frame_rate: 24.0, peak_audio_lufs: -24.0, artifact_defect_count: 0, caption_languages: ["en"], audio_language: "en" }
              as: ContentOps
            - call: "POST /encoding-ladders"
              payload: { title_id: "${t_id}", codec_family: "HEVC", rungs: [{ label: "480p", height_px: 480, bitrate_kbps: 1200 }, { label: "720p", height_px: 720, bitrate_kbps: 2500 }], expected_title_version: "${t_ver}", derived_from_ladder_id: "11111111-1111-4111-8111-111111111111" }
              as: EncodingEngineer
            - call: "POST /playback-metrics"
              payload: { title_id: "${t_id}", device_profile_id: "${dp_id}", vendor_id: "11111111-1111-4111-8111-111111111111", region_code: "US", window_start_at: "2026-07-30T00:00:00Z", window_end_at: "2026-07-31T00:00:00Z", play_attempts: 1000, rebuffer_events: 20, startup_ms_p95: 2000, error_count: 0 }
              as: DeliveryEngineer
            - call: "POST /playback-metrics"
              payload: { title_id: "${t_id}", device_profile_id: "11111111-1111-4111-8111-111111111111", vendor_id: "11111111-1111-4111-8111-111111111111", region_code: "US", window_start_at: "2026-07-30T00:00:00Z", window_end_at: "2026-07-31T00:00:00Z", play_attempts: 1000, rebuffer_events: 20, startup_ms_p95: 2000, error_count: 0 }
              as: DeliveryEngineer
          assert:
            - "POST /mezzanine-assets with unknown title_id -> HTTP 404 with error_id == ERR_TITLE_NOT_FOUND"
            - "POST /encoding-ladders with unknown derived_from_ladder_id -> HTTP 404 with error_id == ERR_LADDER_NOT_FOUND"
            - "POST /playback-metrics with unknown vendor_id only -> HTTP 404 with error_id == ERR_VENDOR_NOT_FOUND"
            - "POST /playback-metrics with unknown device_profile_id AND unknown vendor_id -> HTTP 404 with error_id == ERR_DEVICE_PROFILE_NOT_FOUND"
            - "no MezzanineAsset, EncodingLadder or PlaybackMetricWindow was persisted by any of the four calls"

      - name: mezzanine_asset_missing_required_input_returns_invalid_request
        claim_type: required_fields
        grounds:
          - validations[priority=6]
          - errors[ERR_INVALID_REQUEST]
          - endpoints.POST_/mezzanine-assets
        distinguishing_aspect: "Every field in POST /mezzanine-assets' input list without a trailing '?' is required: omitting audio_language returns 400 ERR_INVALID_REQUEST even though the entity declares no default for it, and omitting duration_seconds does the same."
        test_recipe:
          setup:
            - "One MOVIE Title exists so the only defect in each request is the missing field."
          setup_api_calls:
            - call: "POST /titles"
              payload: { external_ref: "TTL-REQ-04", title_name: "Required Field Cut", content_type: "MOVIE", studio_code: "NOVAPIC" }
              as: ContentOps
              captures: { t_id: $.data.id }
          trigger:
            - call: "POST /mezzanine-assets"
              payload: { title_id: "${t_id}", source_uri: "s3://mez/req-04.mxf", duration_seconds: 3600, frame_rate: 24.0, peak_audio_lufs: -24.0, artifact_defect_count: 0, caption_languages: ["en"] }
              as: ContentOps
            - call: "POST /mezzanine-assets"
              payload: { title_id: "${t_id}", source_uri: "s3://mez/req-04.mxf", frame_rate: 24.0, peak_audio_lufs: -24.0, artifact_defect_count: 0, caption_languages: ["en"], audio_language: "en" }
              as: ContentOps
          assert:
            - "POST /mezzanine-assets without audio_language -> HTTP 400 with error_id == ERR_INVALID_REQUEST"
            - "POST /mezzanine-assets without duration_seconds -> HTTP 400 with error_id == ERR_INVALID_REQUEST"
            - "GET /titles/${t_id}/mezzanine-assets returns 0 MezzanineAssets"

      - name: omitted_optional_inputs_apply_declared_defaults
        claim_type: defaults
        grounds:
          - entities.DeviceProfile.fields.state
          - entities.DrmPackage.fields.key_rotation_hours
          - entities.DrmPackage.fields.persistent_license_allowed
          - entities.EntitlementRule.fields.device_class_scope
          - entities.EntitlementRule.fields.offline_playback_allowed
        distinguishing_aspect: "Omitting every '?'-marked input leaves DeviceProfile.state ACTIVE, DrmPackage.key_rotation_hours 24, DrmPackage.persistent_license_allowed false, EntitlementRule.device_class_scope ALL and EntitlementRule.offline_playback_allowed false — the declared defaults, not nulls."
        test_recipe:
          setup:
            - "One device profile created without `state`."
            - "One MOVIE Title with a DRAFT H264 ladder whose peak_height_px is 720, so the package's hdcp_floor derives to NONE and an hdcp_level NONE rule is admissible."
            - "One DrmPackage created without key_rotation_hours and without persistent_license_allowed."
          setup_api_calls:
            - call: "POST /device-profiles"
              payload: { device_class: "MOBILE_HIGH", max_height_px: 1080, supported_codecs: ["H264", "HEVC"], min_bitrate_kbps: 800, max_bitrate_kbps: 6000, hdcp_required: false, required_drm_system: "NONE", market_share_pct: 45.00, quality_normalization_factor: 0.90 }
              as: PlatformAdmin
              captures: { dp_id: $.data.id }
            - call: "POST /titles"
              payload: { external_ref: "TTL-DEF-05", title_name: "Defaults Cut", content_type: "MOVIE", studio_code: "NOVAPIC" }
              as: ContentOps
              captures: { t_id: $.data.id }
            - call: "GET /titles/${t_id}"
              payload: {}
              as: ContentOps
              captures: { t_ver: $.data.version }
            - call: "POST /encoding-ladders"
              payload: { title_id: "${t_id}", codec_family: "H264", rungs: [{ label: "480p", height_px: 480, bitrate_kbps: 1200 }, { label: "720p", height_px: 720, bitrate_kbps: 2500 }], expected_title_version: "${t_ver}" }
              as: EncodingEngineer
              captures: { l_id: $.data.id }
            - call: "POST /drm-packages"
              payload: { title_id: "${t_id}", ladder_id: "${l_id}", drm_systems: ["WIDEVINE"], license_server_url: "https://lic.novapic.example/v1" }
              as: DrmOperator
              captures: { p_id: $.data.id }
          trigger:
            - call: "POST /drm-packages/${p_id}/entitlement-rules"
              payload: { region_code: "*", subscription_tier: "ANY", max_concurrent_streams: 2, max_playback_height_px: 720, hdcp_level: "NONE", priority: 50 }
              as: DrmOperator
              captures: { r_id: $.data.id }
          assert:
            - "DeviceProfile.${dp_id}.state == ACTIVE"
            - "DrmPackage.${p_id}.key_rotation_hours == 24"
            - "DrmPackage.${p_id}.persistent_license_allowed == false"
            - "DrmPackage.${p_id}.state == PENDING"
            - "DrmPackage.${p_id}.hdcp_floor == NONE"
            - "DrmPackage.${p_id}.stale_reason == NONE"
            - "DrmPackage.${p_id}.packaged_at == null"
            - "DrmPackage.${p_id}.entitlement_rule_count == 1"
            - "EntitlementRule.${r_id}.device_class_scope == ALL"
            - "EntitlementRule.${r_id}.offline_playback_allowed == false"

      - name: ladder_computed_aggregates_derived_from_rungs
        claim_type: computed_fields
        grounds:
          - entities.EncodingLadder.fields.rung_count
          - entities.EncodingLadder.fields.peak_bitrate_kbps
          - entities.EncodingLadder.fields.peak_height_px
          - entities.EncodingLadder.fields.device_compat_score
          - entities.EncodingLadder.fields.validation_reason_code
        distinguishing_aspect: "A DRAFT ladder derives rung_count 3, peak_bitrate_kbps 5000 and peak_height_px 1080 from its rungs at creation, while device_compat_score stays 0.00, compatible_device_count 0 and validation_reason_code NONE until POST /encoding-ladders/{id}/validate writes them."
        test_recipe:
          setup:
            - "One ACTIVE MOBILE_HIGH profile (H264/HEVC, 800..6000 kbps, max_height_px 1080, no DRM, market_share_pct 45.00)."
            - "One MOVIE Title with no other ladders."
          setup_api_calls:
            - call: "POST /device-profiles"
              payload: { device_class: "MOBILE_HIGH", max_height_px: 1080, supported_codecs: ["H264", "HEVC"], min_bitrate_kbps: 800, max_bitrate_kbps: 6000, hdcp_required: false, required_drm_system: "NONE", market_share_pct: 45.00, quality_normalization_factor: 0.90 }
              as: PlatformAdmin
            - call: "POST /titles"
              payload: { external_ref: "TTL-COMP-06", title_name: "Computed Fields Cut", content_type: "MOVIE", studio_code: "NOVAPIC" }
              as: ContentOps
              captures: { t_id: $.data.id }
            - call: "GET /titles/${t_id}"
              payload: {}
              as: ContentOps
              captures: { t_ver: $.data.version }
          trigger:
            - call: "POST /encoding-ladders"
              payload: { title_id: "${t_id}", codec_family: "H264", rungs: [{ label: "360p", height_px: 360, bitrate_kbps: 900 }, { label: "720p", height_px: 720, bitrate_kbps: 2500 }, { label: "1080p", height_px: 1080, bitrate_kbps: 5000 }], expected_title_version: "${t_ver}" }
              as: EncodingEngineer
              captures: { l_id: $.data.id }
          assert:
            - "EncodingLadder.${l_id}.rung_count == 3"
            - "EncodingLadder.${l_id}.peak_bitrate_kbps == 5000"
            - "EncodingLadder.${l_id}.peak_height_px == 1080"
            - "EncodingLadder.${l_id}.state == DRAFT"
            - "EncodingLadder.${l_id}.device_compat_score == 0.00"
            - "EncodingLadder.${l_id}.compatible_device_count == 0"
            - "EncodingLadder.${l_id}.validation_reason_code == NONE"
            - "EncodingLadder.${l_id}.derived_from_ladder_id == null"
            - "EncodingLadder.${l_id}.superseded_by_ladder_id == null"
            - "Title.${t_id}.locked_ladder_count == 0"

      - name: client_supplied_computed_field_returns_invalid_request
        claim_type: computed_fields
        grounds:
          - validations[priority=6]
          - errors[ERR_INVALID_REQUEST]
          - entities.EncodingLadder.fields.rung_count
          - entities.Title.fields.readiness_score_certified
        distinguishing_aspect: "A computed field is not merely ignored when supplied — it is an unknown input for the endpoint, so POST /encoding-ladders carrying rung_count and POST /titles carrying readiness_score_certified are both rejected 400 ERR_INVALID_REQUEST and nothing is persisted."
        test_recipe:
          setup:
            - "One MOVIE Title exists so that the ladder request's only defect is the extra computed field."
          setup_api_calls:
            - call: "POST /titles"
              payload: { external_ref: "TTL-CF-07", title_name: "Computed Input Cut", content_type: "MOVIE", studio_code: "NOVAPIC" }
              as: ContentOps
              captures: { t_id: $.data.id }
            - call: "GET /titles/${t_id}"
              payload: {}
              as: ContentOps
              captures: { t_ver: $.data.version }
          trigger:
            - call: "POST /encoding-ladders"
              payload: { title_id: "${t_id}", codec_family: "H264", rungs: [{ label: "480p", height_px: 480, bitrate_kbps: 1200 }, { label: "720p", height_px: 720, bitrate_kbps: 2500 }], expected_title_version: "${t_ver}", rung_count: 2 }
              as: EncodingEngineer
            - call: "POST /titles"
              payload: { external_ref: "TTL-CF-08", title_name: "Computed Input Cut 2", content_type: "MOVIE", studio_code: "NOVAPIC", readiness_score_certified: 100.00 }
              as: ContentOps
          assert:
            - "POST /encoding-ladders with rung_count in the body -> HTTP 400 with error_id == ERR_INVALID_REQUEST"
            - "POST /titles with readiness_score_certified in the body -> HTTP 400 with error_id == ERR_INVALID_REQUEST"
            - "GET /encoding-ladders with title_id == ${t_id} returns 0 EncodingLadders"
            - "Title.${t_id}.version == 1"

      - name: title_system_fields_minted_and_versioned_by_server
        claim_type: system_fields
        grounds:
          - entities.Title.common_fields
          - endpoints.PATCH_/titles/{id}
        distinguishing_aspect: "id is a bare server-minted UUID with no type prefix, created_at is stable across a mutation while updated_at is refreshed, and version moves 1 -> 2 on the single PATCH — no client input touches any of the four."
        test_recipe:
          setup:
            - "One Title created and then renamed once via PATCH."
          setup_api_calls:
            - call: "POST /titles"
              payload: { external_ref: "TTL-SYS-09", title_name: "System Fields Cut", content_type: "MOVIE", studio_code: "NOVAPIC" }
              as: ContentOps
              captures: { t_id: $.data.id, t_created: $.data.created_at, t_ver: $.data.version }
          trigger:
            - call: "PATCH /titles/${t_id}"
              payload: { title_name: "System Fields Cut (Renamed)" }
              as: ContentOps
          assert:
            - "${t_ver} == 1"
            - "Title.${t_id}.version == 2"
            - "Title.${t_id}.id == ${t_id} and the value is a bare UUID with no prefix segment before it"
            - "Title.${t_id}.created_at == ${t_created}"
            - "Title.${t_id}.updated_at > ${t_created}"
            - "Title.${t_id}.title_name == System Fields Cut (Renamed)"

      - name: type_constraint_violations_rejected
        claim_type: type_constraints
        grounds:
          - validations[priority=6]
          - errors[ERR_INVALID_REQUEST]
          - entities.Title.fields.content_type
          - entities.EncodingLadder.fields.codec_family
          - entities.AvailabilityWindow.fields.region_code
        distinguishing_aspect: "Enum members outside the declared constraint (content_type SHORT_FILM, codec_family VP9), a region_code that fails ^[A-Z]{2}$ ('usa') and a page_size of 101 are each 400 ERR_INVALID_REQUEST — the constraint text in §1.1 is enforced, not merely documented."
        test_recipe:
          setup:
            - "One MOVIE Title exists to host the ladder and window requests."
          setup_api_calls:
            - call: "POST /titles"
              payload: { external_ref: "TTL-TYPE-10", title_name: "Type Constraint Cut", content_type: "MOVIE", studio_code: "NOVAPIC" }
              as: ContentOps
              captures: { t_id: $.data.id }
            - call: "GET /titles/${t_id}"
              payload: {}
              as: ContentOps
              captures: { t_ver: $.data.version }
          trigger:
            - call: "POST /titles"
              payload: { external_ref: "TTL-TYPE-11", title_name: "Bad Content Type", content_type: "SHORT_FILM", studio_code: "NOVAPIC" }
              as: ContentOps
            - call: "POST /encoding-ladders"
              payload: { title_id: "${t_id}", codec_family: "VP9", rungs: [{ label: "480p", height_px: 480, bitrate_kbps: 1200 }, { label: "720p", height_px: 720, bitrate_kbps: 2500 }], expected_title_version: "${t_ver}" }
              as: EncodingEngineer
            - call: "POST /titles/${t_id}/availability-windows"
              payload: { region_code: "usa", window_start_at: "2026-09-01T00:00:00Z", window_end_at: "2026-10-01T00:00:00Z", license_tier: "STANDARD" }
              as: ContentOps
            - call: "GET /titles"
              payload: { page: 1, page_size: 101 }
              as: ContentOps
          assert:
            - "POST /titles with content_type SHORT_FILM -> HTTP 400 with error_id == ERR_INVALID_REQUEST"
            - "POST /encoding-ladders with codec_family VP9 -> HTTP 400 with error_id == ERR_INVALID_REQUEST"
            - "POST /titles/{id}/availability-windows with region_code 'usa' -> HTTP 400 with error_id == ERR_INVALID_REQUEST"
            - "GET /titles with page_size 101 -> HTTP 400 with error_id == ERR_INVALID_REQUEST"
            - "Title.${t_id}.availability_state == DRAFT"

      - name: entitlement_rule_is_immutable_with_no_version_field
        claim_type: immutability
        grounds:
          - entities.EntitlementRule.common_fields
          - endpoints.GET_/drm-packages/{id}/entitlement-rules
        distinguishing_aspect: "EntitlementRule is declared common_fields: false, so its body carries id and created_at but no version and no updated_at, and §1.5 exposes no PATCH or DELETE for it — a superseding policy is a second, higher-priority rule."
        test_recipe:
          setup:
            - "One MOVIE Title with a DRAFT H264 ladder (peak_height_px 720 -> hdcp_floor NONE) and one PENDING package carrying two rules of different priority."
          setup_api_calls:
            - call: "POST /titles"
              payload: { external_ref: "TTL-IMM-12", title_name: "Immutable Rule Cut", content_type: "MOVIE", studio_code: "NOVAPIC" }
              as: ContentOps
              captures: { t_id: $.data.id }
            - call: "GET /titles/${t_id}"
              payload: {}
              as: ContentOps
              captures: { t_ver: $.data.version }
            - call: "POST /encoding-ladders"
              payload: { title_id: "${t_id}", codec_family: "H264", rungs: [{ label: "480p", height_px: 480, bitrate_kbps: 1200 }, { label: "720p", height_px: 720, bitrate_kbps: 2500 }], expected_title_version: "${t_ver}" }
              as: EncodingEngineer
              captures: { l_id: $.data.id }
            - call: "POST /drm-packages"
              payload: { title_id: "${t_id}", ladder_id: "${l_id}", drm_systems: ["WIDEVINE"], license_server_url: "https://lic.novapic.example/v1" }
              as: DrmOperator
              captures: { p_id: $.data.id }
            - call: "POST /drm-packages/${p_id}/entitlement-rules"
              payload: { region_code: "*", subscription_tier: "BASIC", device_class_scope: "ALL", max_concurrent_streams: 1, max_playback_height_px: 480, hdcp_level: "NONE", priority: 20 }
              as: DrmOperator
              captures: { r_low_id: $.data.id }
            - call: "POST /drm-packages/${p_id}/entitlement-rules"
              payload: { region_code: "*", subscription_tier: "PREMIUM", device_class_scope: "ALL", max_concurrent_streams: 4, max_playback_height_px: 720, hdcp_level: "NONE", priority: 90 }
              as: DrmOperator
              captures: { r_high_id: $.data.id }
          trigger:
            - call: "GET /drm-packages/${p_id}/entitlement-rules"
              payload: {}
              as: DrmOperator
          assert:
            - "exactly 2 EntitlementRules returned, ordered priority DESC then created_at ASC: ${r_high_id} then ${r_low_id}"
            - "EntitlementRule.${r_high_id} exposes id and created_at and exposes no version field and no updated_at field"
            - "EntitlementRule.${r_low_id}.priority == 20 and EntitlementRule.${r_high_id}.priority == 90"
            - "DrmPackage.${p_id}.entitlement_rule_count == 2"
            - "§1.5 declares no PATCH and no DELETE endpoint whose path ends in /entitlement-rules or /entitlement-rules/{id}"

      - name: immutable_event_entities_carry_no_version_field
        claim_type: immutability
        grounds:
          - entities.QualityControlReport.common_fields
          - entities.PlaybackMetricWindow.common_fields
          - endpoints.GET_/mezzanine-assets/{id}/qc-reports
          - endpoints.GET_/playback-metrics/{id}
        distinguishing_aspect: "QualityControlReport and PlaybackMetricWindow are event records declared common_fields: false — each exposes created_at but no version, and neither has an update endpoint anywhere in §1.5; the QC report additionally exposes evaluated_at stamped from the logical clock."
        test_recipe:
          setup:
            - "One MOVIE Title with one clean MezzanineAsset (0 artifacts, -24.0 LUFS, captions ['en'], audio 'en') that has been QC-run once and passed."
            - "One CdnVendor ALPHA serving US and one SMART_TV_4K profile, plus one closed metric window ingested for them."
          setup_api_calls:
            - call: "POST /device-profiles"
              payload: { device_class: "SMART_TV_4K", max_height_px: 2160, supported_codecs: ["HEVC", "AV1"], min_bitrate_kbps: 3000, max_bitrate_kbps: 25000, hdcp_required: true, required_drm_system: "WIDEVINE", market_share_pct: 30.00, quality_normalization_factor: 1.00 }
              as: PlatformAdmin
              captures: { dp_id: $.data.id }
            - call: "POST /cdn-vendors"
              payload: { vendor_code: "ALPHA", regions: ["US"], committed_gbps: 100.00, cost_per_gb_usd: 0.0300 }
              as: PlatformAdmin
              captures: { v_id: $.data.id }
            - call: "POST /titles"
              payload: { external_ref: "TTL-EVT-13", title_name: "Event Entity Cut", content_type: "MOVIE", studio_code: "NOVAPIC" }
              as: ContentOps
              captures: { t_id: $.data.id }
            - call: "POST /mezzanine-assets"
              payload: { title_id: "${t_id}", source_uri: "s3://mez/evt-13.mxf", duration_seconds: 3600, frame_rate: 24.0, peak_audio_lufs: -24.0, artifact_defect_count: 0, caption_languages: ["en"], audio_language: "en" }
              as: ContentOps
              captures: { a_id: $.data.id }
            - call: "POST /mezzanine-assets/${a_id}/qc-runs"
              payload: {}
              as: QcAnalyst
            - call: "POST /playback-metrics"
              payload: { title_id: "${t_id}", device_profile_id: "${dp_id}", vendor_id: "${v_id}", region_code: "US", window_start_at: "2026-07-30T00:00:00Z", window_end_at: "2026-07-31T00:00:00Z", play_attempts: 1000, rebuffer_events: 20, startup_ms_p95: 2000, error_count: 0 }
              as: DeliveryEngineer
              captures: { m_id: $.data.id }
          trigger:
            - call: "GET /mezzanine-assets/${a_id}/qc-reports"
              payload: {}
              as: QcAnalyst
            - call: "GET /playback-metrics/${m_id}"
              payload: {}
              as: DeliveryEngineer
          assert:
            - "exactly 1 QualityControlReport returned for asset ${a_id} with attempt_number == 1 and verdict == PASS"
            - "the QualityControlReport exposes no version field and no updated_at field"
            - "the QualityControlReport evaluated_at == 2026-08-01T00:00:00Z"
            - "PlaybackMetricWindow.${m_id} exposes no version field and no updated_at field"
            - "PlaybackMetricWindow.${m_id}.quality_index == 95.00"
            - "§1.5 declares no PATCH, PUT or DELETE endpoint for /playback-metrics/{id} or for any /qc-reports path"

      - name: ladder_lineage_reachable_by_self_referential_filter
        claim_type: parent_relationships
        grounds:
          - entities.EncodingLadder.fields.derived_from_ladder_id
          - endpoints.GET_/encoding-ladders
          - complexity_profile.relationship_patterns
        distinguishing_aspect: "The self-referential derived_from_ladder_id link is traversable in both directions from §1.5 alone: GET /encoding-ladders?derived_from_ladder_id=L1 returns exactly the clone L2, and GET /encoding-ladders?title_id=T returns both ladders in created_at ASC order."
        test_recipe:
          setup:
            - "One MOVIE Title owning two DRAFT ladders: L1 hand-authored, L2 cloned from L1 via derived_from_ladder_id."
            - "Title.version is re-read before each ladder create because POST /encoding-ladders bumps it."
          setup_api_calls:
            - call: "POST /titles"
              payload: { external_ref: "TTL-LIN-14", title_name: "Lineage Cut", content_type: "MOVIE", studio_code: "NOVAPIC" }
              as: ContentOps
              captures: { t_id: $.data.id }
            - call: "GET /titles/${t_id}"
              payload: {}
              as: ContentOps
              captures: { t_ver1: $.data.version }
            - call: "POST /encoding-ladders"
              payload: { title_id: "${t_id}", codec_family: "H264", rungs: [{ label: "480p", height_px: 480, bitrate_kbps: 1200 }, { label: "720p", height_px: 720, bitrate_kbps: 2500 }], expected_title_version: "${t_ver1}" }
              as: EncodingEngineer
              captures: { l1_id: $.data.id }
            - call: "GET /titles/${t_id}"
              payload: {}
              as: ContentOps
              captures: { t_ver2: $.data.version }
            - call: "POST /encoding-ladders"
              payload: { title_id: "${t_id}", codec_family: "HEVC", rungs: [{ label: "480p", height_px: 480, bitrate_kbps: 1200 }, { label: "720p", height_px: 720, bitrate_kbps: 2500 }], expected_title_version: "${t_ver2}", derived_from_ladder_id: "${l1_id}" }
              as: EncodingEngineer
              captures: { l2_id: $.data.id }
          trigger:
            - call: "GET /encoding-ladders"
              payload: { derived_from_ladder_id: "${l1_id}" }
              as: EncodingEngineer
            - call: "GET /encoding-ladders"
              payload: { title_id: "${t_id}" }
              as: EncodingEngineer
          assert:
            - "GET /encoding-ladders?derived_from_ladder_id=${l1_id} returns exactly 1 EncodingLadder whose id == ${l2_id}"
            - "GET /encoding-ladders?title_id=${t_id} returns exactly 2 EncodingLadders, ${l1_id} then ${l2_id} in created_at ASC order"
            - "EncodingLadder.${l2_id}.derived_from_ladder_id == ${l1_id}"
            - "EncodingLadder.${l1_id}.derived_from_ladder_id == null"
            - "${t_ver2} == 2"

      - name: device_profile_listing_filtered_by_state
        claim_type: listing
        grounds:
          - entities.DeviceProfile.fields.state
          - endpoints.GET_/device-profiles
        distinguishing_aspect: "GET /device-profiles?state=RETIRED returns exactly the one RETIRED profile, which is the channel a test uses to confirm which profiles calculations.device_compat_score will consider."
        test_recipe:
          setup:
            - "Two device profiles: MOBILE_HIGH created without `state` (ACTIVE) and SET_TOP_LEGACY created with state RETIRED."
          setup_api_calls:
            - call: "POST /device-profiles"
              payload: { device_class: "MOBILE_HIGH", max_height_px: 1080, supported_codecs: ["H264", "HEVC"], min_bitrate_kbps: 800, max_bitrate_kbps: 6000, hdcp_required: false, required_drm_system: "NONE", market_share_pct: 45.00, quality_normalization_factor: 0.90 }
              as: PlatformAdmin
              captures: { dp_active_id: $.data.id }
            - call: "POST /device-profiles"
              payload: { device_class: "SET_TOP_LEGACY", max_height_px: 720, supported_codecs: ["H264"], min_bitrate_kbps: 500, max_bitrate_kbps: 3000, hdcp_required: false, required_drm_system: "NONE", market_share_pct: 25.00, quality_normalization_factor: 0.75, state: "RETIRED" }
              as: PlatformAdmin
              captures: { dp_retired_id: $.data.id }
          trigger:
            - call: "GET /device-profiles"
              payload: { state: "RETIRED" }
              as: PlatformAdmin
            - call: "GET /device-profiles"
              payload: { state: "ACTIVE" }
              as: EncodingEngineer
          assert:
            - "GET /device-profiles?state=RETIRED returns exactly 1 DeviceProfile whose id == ${dp_retired_id}"
            - "GET /device-profiles?state=ACTIVE returns exactly 1 DeviceProfile whose id == ${dp_active_id}"
            - "DeviceProfile.${dp_retired_id}.state == RETIRED"
            - "DeviceProfile.${dp_active_id}.state == ACTIVE"

  # ===========================================================================
  # SECTION 2 — From Table 2 (State Machines)
  # state_machine_shape: parallel (Title carries two independent dimensions).
  # ===========================================================================
  - section: state_machines
    instances:

      - name: newly_created_entities_start_in_declared_initial_state
        claim_type: initial_state
        grounds:
          - state_machines.MezzanineAsset.initial_state
          - state_machines.EncodingLadder.initial_state
          - state_machines.DrmPackage.initial_state
          - state_machines.CdnVendor.initial_state
          - state_machines.AvailabilityWindow.initial_state
        distinguishing_aspect: "Five entities are created in one chain and each lands in its own declared initial_state — INGESTED, DRAFT, PENDING, ACTIVE, SCHEDULED — with no cross-contamination between the state machines."
        test_recipe:
          setup:
            - "One ACTIVE MOBILE_HIGH profile, one MOVIE Title and one clean MezzanineAsset."
            - "Title.version re-read immediately before the ladder create so the OCC field is current."
          setup_api_calls:
            - call: "POST /device-profiles"
              payload: { device_class: "MOBILE_HIGH", max_height_px: 1080, supported_codecs: ["H264", "HEVC"], min_bitrate_kbps: 800, max_bitrate_kbps: 6000, hdcp_required: false, required_drm_system: "NONE", market_share_pct: 45.00, quality_normalization_factor: 0.90 }
              as: PlatformAdmin
            - call: "POST /titles"
              payload: { external_ref: "TTL-INIT-20", title_name: "Initial State Cut", content_type: "MOVIE", studio_code: "NOVAPIC" }
              as: ContentOps
              captures: { t_id: $.data.id }
            - call: "POST /mezzanine-assets"
              payload: { title_id: "${t_id}", source_uri: "s3://mez/init-20.mxf", duration_seconds: 3600, frame_rate: 24.0, peak_audio_lufs: -24.0, artifact_defect_count: 0, caption_languages: ["en"], audio_language: "en" }
              as: ContentOps
              captures: { a_id: $.data.id }
            - call: "GET /titles/${t_id}"
              payload: {}
              as: ContentOps
              captures: { t_ver: $.data.version }
          trigger:
            - call: "POST /encoding-ladders"
              payload: { title_id: "${t_id}", codec_family: "H264", rungs: [{ label: "480p", height_px: 480, bitrate_kbps: 1200 }, { label: "720p", height_px: 720, bitrate_kbps: 2500 }], expected_title_version: "${t_ver}" }
              as: EncodingEngineer
              captures: { l_id: $.data.id }
            - call: "POST /drm-packages"
              payload: { title_id: "${t_id}", ladder_id: "${l_id}", drm_systems: ["WIDEVINE"], license_server_url: "https://lic.novapic.example/v1" }
              as: DrmOperator
              captures: { p_id: $.data.id }
            - call: "POST /cdn-vendors"
              payload: { vendor_code: "ALPHA", regions: ["US"], committed_gbps: 100.00, cost_per_gb_usd: 0.0300 }
              as: PlatformAdmin
              captures: { v_id: $.data.id }
            - call: "POST /titles/${t_id}/availability-windows"
              payload: { region_code: "US", window_start_at: "2026-08-15T00:00:00Z", window_end_at: "2026-09-15T00:00:00Z", license_tier: "STANDARD" }
              as: ContentOps
              captures: { w_id: $.data.id }
          assert:
            - "MezzanineAsset.${a_id}.qc_state == INGESTED"
            - "MezzanineAsset.${a_id}.qc_attempt_count == 0"
            - "MezzanineAsset.${a_id}.blocking_defect_code == NONE"
            - "EncodingLadder.${l_id}.state == DRAFT"
            - "DrmPackage.${p_id}.state == PENDING"
            - "CdnVendor.${v_id}.state == ACTIVE"
            - "CdnVendor.${v_id}.reserved_gbps == 0.00"
            - "CdnVendor.${v_id}.health_score_rolling == 100.00"
            - "CdnVendor.${v_id}.health_score_contract == 100.00"
            - "CdnVendor.${v_id}.breach_window_count == 0"
            - "AvailabilityWindow.${w_id}.state == SCHEDULED"
            - "Title.${t_id}.availability_state == SCHEDULED"
            - "Title.${t_id}.packaging_state == UNPACKAGED"

      - name: invalid_asset_transitions_rejected
        claim_type: invalid_transitions
        grounds:
          - state_machines.MezzanineAsset.transitions
          - validations[priority=10]
          - errors[ERR_ASSET_STATE_INVALID]
        distinguishing_aspect: "From INGESTED only a qc-run is admissible and from QC_PASSED nothing is: a second qc-run on a QC_PASSED asset, a remediation-request on an INGESTED asset and a resubmit on an INGESTED asset are each 409 ERR_ASSET_STATE_INVALID with qc_attempt_count left untouched."
        test_recipe:
          setup:
            - "One MOVIE Title with two MezzanineAssets: A1 clean and already QC_PASSED (one qc-run), A2 still INGESTED."
          setup_api_calls:
            - call: "POST /titles"
              payload: { external_ref: "TTL-ASM-21", title_name: "Asset Transition Cut", content_type: "MOVIE", studio_code: "NOVAPIC" }
              as: ContentOps
              captures: { t_id: $.data.id }
            - call: "POST /mezzanine-assets"
              payload: { title_id: "${t_id}", source_uri: "s3://mez/asm-21-a1.mxf", duration_seconds: 3600, frame_rate: 24.0, peak_audio_lufs: -24.0, artifact_defect_count: 0, caption_languages: ["en"], audio_language: "en" }
              as: ContentOps
              captures: { a1_id: $.data.id }
            - call: "POST /mezzanine-assets"
              payload: { title_id: "${t_id}", source_uri: "s3://mez/asm-21-a2.mxf", duration_seconds: 3600, frame_rate: 24.0, peak_audio_lufs: -24.0, artifact_defect_count: 0, caption_languages: ["en"], audio_language: "en" }
              as: ContentOps
              captures: { a2_id: $.data.id }
            - call: "POST /mezzanine-assets/${a1_id}/qc-runs"
              payload: {}
              as: QcAnalyst
          trigger:
            - call: "POST /mezzanine-assets/${a1_id}/qc-runs"
              payload: {}
              as: QcAnalyst
            - call: "POST /mezzanine-assets/${a2_id}/remediation-request"
              payload: {}
              as: QcAnalyst
            - call: "POST /mezzanine-assets/${a2_id}/resubmit"
              payload: { artifact_defect_count: 0 }
              as: ContentOps
          assert:
            - "second POST /mezzanine-assets/${a1_id}/qc-runs -> HTTP 409 with error_id == ERR_ASSET_STATE_INVALID"
            - "POST /mezzanine-assets/${a2_id}/remediation-request -> HTTP 409 with error_id == ERR_ASSET_STATE_INVALID"
            - "POST /mezzanine-assets/${a2_id}/resubmit -> HTTP 409 with error_id == ERR_ASSET_STATE_INVALID"
            - "MezzanineAsset.${a1_id}.qc_state == QC_PASSED and qc_attempt_count == 1"
            - "MezzanineAsset.${a2_id}.qc_state == INGESTED and qc_attempt_count == 0"
            - "GET /mezzanine-assets/${a1_id}/qc-reports returns exactly 1 QualityControlReport"

      - name: invalid_ladder_and_package_transitions_rejected
        claim_type: invalid_transitions
        grounds:
          - state_machines.EncodingLadder.transitions
          - state_machines.DrmPackage.transitions
          - validations[priority=10]
          - errors[ERR_LADDER_STATE_INVALID]
          - errors[ERR_PACKAGE_STATE_INVALID]
        distinguishing_aspect: "Locking a DRAFT ladder, re-validating an already VALIDATED ladder and revoking a package twice are each 409 (ERR_LADDER_STATE_INVALID / ERR_PACKAGE_STATE_INVALID) — the state gate is on the path entity's own state, evaluated before any cross-entity gate."
        test_recipe:
          setup:
            - "One ACTIVE MOBILE_HIGH profile so validate can accept (device_compat_score 18.00 = round(45.00 * 0.4, 2))."
            - "One MOVIE Title with a QC_PASSED asset, ladder L1 left DRAFT and ladder L2 validated to VALIDATED."
            - "One DrmPackage already REVOKED from PENDING."
          setup_api_calls:
            - call: "POST /device-profiles"
              payload: { device_class: "MOBILE_HIGH", max_height_px: 1080, supported_codecs: ["H264", "HEVC"], min_bitrate_kbps: 800, max_bitrate_kbps: 6000, hdcp_required: false, required_drm_system: "NONE", market_share_pct: 45.00, quality_normalization_factor: 0.90 }
              as: PlatformAdmin
            - call: "POST /titles"
              payload: { external_ref: "TTL-LSM-22", title_name: "Ladder Transition Cut", content_type: "MOVIE", studio_code: "NOVAPIC" }
              as: ContentOps
              captures: { t_id: $.data.id }
            - call: "POST /mezzanine-assets"
              payload: { title_id: "${t_id}", source_uri: "s3://mez/lsm-22.mxf", duration_seconds: 3600, frame_rate: 24.0, peak_audio_lufs: -24.0, artifact_defect_count: 0, caption_languages: ["en"], audio_language: "en" }
              as: ContentOps
              captures: { a_id: $.data.id }
            - call: "POST /mezzanine-assets/${a_id}/qc-runs"
              payload: {}
              as: QcAnalyst
            - call: "GET /titles/${t_id}"
              payload: {}
              as: ContentOps
              captures: { t_ver1: $.data.version }
            - call: "POST /encoding-ladders"
              payload: { title_id: "${t_id}", codec_family: "H264", rungs: [{ label: "480p", height_px: 480, bitrate_kbps: 1200 }, { label: "720p", height_px: 720, bitrate_kbps: 2500 }], expected_title_version: "${t_ver1}" }
              as: EncodingEngineer
              captures: { l1_id: $.data.id }
            - call: "GET /titles/${t_id}"
              payload: {}
              as: ContentOps
              captures: { t_ver2: $.data.version }
            - call: "POST /encoding-ladders"
              payload: { title_id: "${t_id}", codec_family: "HEVC", rungs: [{ label: "480p", height_px: 480, bitrate_kbps: 1200 }, { label: "720p", height_px: 720, bitrate_kbps: 2500 }], expected_title_version: "${t_ver2}" }
              as: EncodingEngineer
              captures: { l2_id: $.data.id }
            - call: "POST /encoding-ladders/${l2_id}/validate"
              payload: {}
              as: EncodingEngineer
            - call: "POST /drm-packages"
              payload: { title_id: "${t_id}", ladder_id: "${l2_id}", drm_systems: ["WIDEVINE"], license_server_url: "https://lic.novapic.example/v1" }
              as: DrmOperator
              captures: { p_id: $.data.id }
            - call: "POST /drm-packages/${p_id}/revoke"
              payload: {}
