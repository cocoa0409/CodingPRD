  - { error_id: ERR_STALE_COLLECTIVE_VERSION,   http_status: 412, message: "expected_collective_version does not match the stored collective version.", raised_by: "validation priority 21 / §1.2.1 roster-batch-create-stale-collective and entity-structure-change-stale-collective" }
  - { error_id: ERR_STALE_CONTRACT_VERSION,     http_status: 412, message: "expected_deal_contract_version does not match the stored deal contract version.", raised_by: "validation priority 21 / §1.2.1 payment-release-stale-contract" }

  # --- business_safety ---
