            - { call: "GET /peer-review/cases/${case1}", as: QualityDirector, captures: { case_v: $.data.version } }
          trigger:
            - { call: "POST /peer-review/cases/${case1}/assignments", payload: { reviewer_id: "${m_e}", expected_case_version: "${case_v}" }, as: PeerReviewCoordinator, captures: { asg_e: $.data.id, e_seq: $.data.sequence } }
          assert:
            - "replacement assignment created (HTTP 201) with sequence == 4 — the WAIVED row freed its cap slot but not its sequence number"
            - "GET /peer-review/cases/${case1} -> status == 'ASSIGNED' (waiver and refill cause no status change)"

      - name: duplicate_conflict_declaration_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=8]", "errors[ERR_CONFLICT_ALREADY_DECLARED]"]
        distinguishing_aspect: "A second declaration with the same (member_id, provider_id) -> ERR_CONFLICT_ALREADY_DECLARED 409."
