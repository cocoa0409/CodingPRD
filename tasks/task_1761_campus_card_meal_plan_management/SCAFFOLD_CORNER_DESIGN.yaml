            - "After reinstate: gy ACTIVE again and the same-day in-window attempt is GRANTED with grant_id == ${gy_id}"
            - "Attempt on zx at 2026-09-02 (past valid_until 2026-09-01T00:00:00Z): decision == DENIED, deny_reason == NO_ACTIVE_GRANT, and AccessGrant.${gx_id}.status == EXPIRED (lazy transition)"

