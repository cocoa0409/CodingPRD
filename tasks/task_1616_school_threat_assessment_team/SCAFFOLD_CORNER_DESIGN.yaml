              captures: { e2: $.data.error_id }
          assert:
            - "triage as ThreatAssessor: 403 ERR_INSUFFICIENT_PERMISSIONS"
            - "close as ThreatAssessor: 403 ERR_INSUFFICIENT_PERMISSIONS"

      - name: assessor_and_intake_cannot_read_audit_events
        claim_type: rbac_deny
        grounds: [roles, endpoints]
        distinguishing_aspect: "The audit trail is confidential: GET audit-events is denied to ThreatAssessor and IntakeCoordinator (403) and allowed to TeamLead and DistrictAdministrator (200)."
        test_recipe:
          setup: ["One INTAKE case (has a CASE_CREATED audit event)"]
          setup_api_calls:
            - call: "POST /schools"
              payload: { name: "RbacC HS", school_code: "RBC", enrollment_count: 500 }
              as: DistrictAdministrator
              captures: { school_id: $.data.id }
            - call: "POST /threat-cases"
              payload: { school_id: "${school_id}", subject_alias: "STU-RBC", reporter_channel: "TIP_LINE", summary: "audit rbac" }
              as: IntakeCoordinator
              captures: { case_id: $.data.id }
          trigger:
            - call: "GET /threat-cases/${case_id}/audit-events"
              as: ThreatAssessor
              captures: { e1: $.data.error_id }
            - call: "GET /threat-cases/${case_id}/audit-events"
              as: IntakeCoordinator
              captures: { e2: $.data.error_id }
            - call: "GET /threat-cases/${case_id}/audit-events"
              as: DistrictAdministrator
          assert:
            - "ThreatAssessor: 403 ERR_INSUFFICIENT_PERMISSIONS"
            - "IntakeCoordinator: 403 ERR_INSUFFICIENT_PERMISSIONS"
            - "DistrictAdministrator: 200 with exactly 1 event (CASE_CREATED)"

      - name: sealed_documents_hidden_from_assessor_and_intake
        claim_type: filtered_visibility
        grounds: [entities.CaseDocument.fields.sealed, endpoints]
        distinguishing_aspect: "Confidentiality scoping on a shared operation: a sealed document is EXCLUDED from the list response (and total_count) for ThreatAssessor and IntakeCoordinator but visible to TeamLead and DistrictAdministrator."
        test_recipe:
          setup: ["One INTAKE case with two documents: one unsealed, one sealed"]
          setup_api_calls:
            - call: "POST /schools"
              payload: { name: "Seal HS", school_code: "SEA", enrollment_count: 500 }
              as: DistrictAdministrator
              captures: { school_id: $.data.id }
            - call: "POST /threat-cases"
              payload: { school_id: "${school_id}", subject_alias: "STU-SEA", reporter_channel: "TIP_LINE", summary: "sealed docs" }
              as: IntakeCoordinator
              captures: { case_id: $.data.id }
            - call: "POST /threat-cases/${case_id}/documents"
              payload: { doc_type: "INTAKE_NOTE", body: "visible note" }
              as: IntakeCoordinator
            - call: "POST /threat-cases/${case_id}/documents"
              payload: { doc_type: "LEGAL_HOLD", body: "privileged", sealed: true }
              as: TeamLead
              as_user_id: tl_1
          trigger:
            - call: "GET /threat-cases/${case_id}/documents"
              as: ThreatAssessor
            - call: "GET /threat-cases/${case_id}/documents"
              as: TeamLead
          assert:
            - "ThreatAssessor list: total_count == 1 and the only entry is the unsealed INTAKE_NOTE"
            - "TeamLead list: total_count == 2 including the sealed LEGAL_HOLD with body 'privileged'"

      - name: district_admin_cannot_perform_case_work
        claim_type: rbac_deny
        grounds: [roles, "errors[ERR_INSUFFICIENT_PERMISSIONS]"]
        distinguishing_aspect: "DistrictAdministrator is an oversight role: creating a threat case, recording a screening, and activating a plan are all denied with 403 (segregation between administration and case operations)."
        test_recipe:
          setup: ["One school; one INTAKE case"]
          setup_api_calls:
            - call: "POST /schools"
              payload: { name: "RbacD HS", school_code: "RBD", enrollment_count: 500 }
              as: DistrictAdministrator
              captures: { school_id: $.data.id }
            - call: "POST /threat-cases"
              payload: { school_id: "${school_id}", subject_alias: "STU-RBD", reporter_channel: "TIP_LINE", summary: "admin denial" }
              as: IntakeCoordinator
              captures: { case_id: $.data.id }
          trigger:
            - call: "POST /threat-cases"
              payload: { school_id: "${school_id}", subject_alias: "STU-RBD2", reporter_channel: "TIP_LINE", summary: "admin creating" }
              as: DistrictAdministrator
              captures: { e1: $.data.error_id }
            - call: "POST /threat-cases/${case_id}/screening"
              payload: { threat_of_violence: true, weapon_mention: true, target_identified: true, plan_described: false, prior_incidents: false, current_distress: false }
              as: DistrictAdministrator
              captures: { e2: $.data.error_id }
          assert:
            - "POST /threat-cases as DistrictAdministrator: 403 ERR_INSUFFICIENT_PERMISSIONS"
            - "POST screening as DistrictAdministrator: 403 ERR_INSUFFICIENT_PERMISSIONS"

  # ---------------------------------------------------------------------------
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_stale_version_rejected_and_version_increments
        claim_type: stale_version_conflict
        grounds: ["concurrency_rules[plan-activate-stale-case]", "errors[ERR_STALE_CASE_VERSION]"]
        distinguishing_aspect: "OCC on ThreatCase.version: activation carrying expected_threat_case_version one behind the observed version is rejected 412 ERR_STALE_CASE_VERSION; activation with the observed version succeeds and increments ThreatCase.version by exactly 1."
        test_recipe:
          setup: ["Case in UNDER_ASSESSMENT with FINALIZED MODERATE assessment and one DRAFT plan; client holds case version V from a GET"]
          setup_api_calls:
            - call: "POST /schools"
              payload: { name: "Occ HS", school_code: "OCC", enrollment_count: 500 }
              as: DistrictAdministrator
              captures: { school_id: $.data.id }
            - call: "POST /threat-cases"
              payload: { school_id: "${school_id}", subject_alias: "STU-OC", reporter_channel: "TIP_LINE", summary: "occ" }
              as: IntakeCoordinator
              captures: { case_id: $.data.id }
            - call: "POST /threat-cases/${case_id}/triage"
              payload: { triage_priority: "ROUTINE", triage_notes: "t" }
              as: IntakeCoordinator
            - call: "POST /threat-cases/${case_id}/screening"
              payload: { threat_of_violence: true, weapon_mention: true, target_identified: true, plan_described: false, prior_incidents: false, current_distress: false }
              as: ThreatAssessor
              as_user_id: ta_1
            - call: "POST /risk-assessments"
              payload: { case_id: "${case_id}", variant: "STANDARD", factors: [ { factor_code: "GRIEVANCE_HISTORY", severity: 2 }, { factor_code: "PEER_REPORTS", severity: 2 } ] }
              as: ThreatAssessor
              as_user_id: ta_1
              captures: { ra_id: $.data.id }
            - call: "POST /risk-assessments/${ra_id}/submit"
              payload: {}
              as: ThreatAssessor
              as_user_id: ta_1
            - call: "POST /risk-assessments/${ra_id}/finalize"
              payload: {}
              as: TeamLead
              as_user_id: tl_1
            - call: "POST /management-plans"
              payload: { case_id: "${case_id}", cadence_mode: "FROM_COMPLETION", conditions: ["x"] }
              as: ThreatAssessor
              as_user_id: ta_1
              captures: { plan_id: $.data.id }
            - call: "GET /threat-cases/${case_id}"
              as: TeamLead
              captures: { v_now: $.data.version }
          trigger:
            - call: "POST /management-plans/${plan_id}/activate"
              payload: { expected_threat_case_version: "${v_now} - 1" }
              as: TeamLead
              as_user_id: tl_1
              captures: { err: $.data.error_id }
            - call: "POST /management-plans/${plan_id}/activate"
              payload: { expected_threat_case_version: "${v_now}" }
              as: TeamLead
              as_user_id: tl_1
              captures: { plan_st: $.data.status }
            - call: "GET /threat-cases/${case_id}"
              as: TeamLead
              captures: { v_after: $.data.version }
          assert:
            - "stale activate (V-1): 412 ERR_STALE_CASE_VERSION and the plan remains DRAFT"
            - "fresh activate (V): 200, plan status == ACTIVE"
            - "ThreatCase.version after activation == V + 1 (exactly one increment)"

      - name: referral_sla_breach_fires_on_clock_advance
        claim_type: scheduled_action_execution
        grounds: [calculations.referral_sla_due, entities.Referral.fields.sla_breached]
        distinguishing_aspect: "Scheduled/deferred behavior: an URGENT referral sent at 2026-08-01T00:00:00Z has sla_due_at 2026-08-04T00:00:00Z; it is unbreached at exactly the deadline and flips sla_breached=true (plus case escalation) when the clock passes it while still SENT."
        test_recipe:
          setup: ["One TRIAGED case with a manually created URGENT LAW_ENFORCEMENT referral (SENT at 2026-08-01)"]
          setup_api_calls:
            - call: "POST /schools"
              payload: { name: "Sla HS", school_code: "SLA", enrollment_count: 500 }
              as: DistrictAdministrator
              captures: { school_id: $.data.id }
            - call: "POST /threat-cases"
              payload: { school_id: "${school_id}", subject_alias: "STU-SL", reporter_channel: "TIP_LINE", summary: "sla" }
              as: IntakeCoordinator
              captures: { case_id: $.data.id }
            - call: "POST /threat-cases/${case_id}/triage"
              payload: { triage_priority: "ROUTINE", triage_notes: "t" }
              as: IntakeCoordinator
            - call: "POST /referrals"
              payload: { case_id: "${case_id}", referral_type: "LAW_ENFORCEMENT", agency_name: "City PD", urgency: "URGENT" }
              as: ThreatAssessor
              as_user_id: ta_1
              captures: { ref_id: $.data.id, due: $.data.sla_due_at }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-04T00:00:00Z" }
              as: DistrictAdministrator
            - call: "GET /threat-cases/${case_id}/referrals"
              payload: { status: "SENT" }
              as: TeamLead
              captures: { br1 : "$.data[0].sla_breached" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-04T00:00:01Z" }
              as: DistrictAdministrator
            - call: "GET /threat-cases/${case_id}/referrals"
              payload: { status: "SENT" }
              as: TeamLead
              captures: { br2 : "$.data[0].sla_breached" }
            - call: "GET /threat-cases/${case_id}"
              as: TeamLead
              captures: { esc: $.data.escalation_flag }
          assert:
            - "referral sla_due_at == 2026-08-04T00:00:00Z (sent + 72h)"
            - "at exactly the deadline: sla_breached == false (breach requires clock strictly past due)"
            - "one second past: sla_breached == true and case escalation_flag == true"

      - name: finalize_cascade_covered
        claim_type: cascade_chain
        grounds: [state_machines.RiskAssessment.SUBMITTED_to_FINALIZED]
        excluded_because:
          difficulty_instance: finalize_imminent_referral_escalation_cascade
          rationale: "The depth-4 IMMINENT cascade is asserted end-to-end by the named §1.8 instance."

      - name: missed_checkin_cascade_covered
        claim_type: cascade_chain
        grounds: [state_machines.MonitoringCheckIn.SCHEDULED_to_MISSED]
        excluded_because:
          difficulty_instance: missed_checkin_counter_escalation_cascade
          rationale: "The depth-2 miss-counter escalation (rate/threshold layer) is asserted by the named §1.8 instance."

  # ---------------------------------------------------------------------------
  - section: consistency_model
    instances:
      - name: mutations_are_immediately_visible
        claim_type: immediate_consistency
        grounds: [complexity_profile.consistency_model]
        distinguishing_aspect: "Immediate consistency: a triage mutation is fully visible in the very next GET of the same case (status, triage_priority, version increment) with no read lag."
        test_recipe:
          setup: ["One INTAKE case"]
          setup_api_calls:
            - call: "POST /schools"
              payload: { name: "Cons HS", school_code: "CON", enrollment_count: 500 }
              as: DistrictAdministrator
              captures: { school_id: $.data.id }
            - call: "POST /threat-cases"
              payload: { school_id: "${school_id}", subject_alias: "STU-CO", reporter_channel: "TIP_LINE", summary: "consistency" }
              as: IntakeCoordinator
              captures: { case_id: $.data.id }
          trigger:
            - call: "POST /threat-cases/${case_id}/triage"
              payload: { triage_priority: "URGENT", triage_notes: "now visible" }
              as: IntakeCoordinator
            - call: "GET /threat-cases/${case_id}"
              as: TeamLead
              captures: { st: $.data.status, pr: $.data.triage_priority, ver: $.data.version }
          assert:
            - "GET immediately after triage: status == TRIAGED, triage_priority == URGENT, version == 2"
