            - call: "POST /records/requests/${req_id}/invoice"
              payload: { memo: "Final invoice for INC-2026-0519" }
              as: RecordsSupervisor
              as_user_id: "supv-1"
          trigger:
            - call: "POST /records/requests/${req_id}/payments"
              payload: { amount_cents: 596, memo: "Payment in full" }
              as: Requester
              as_user_id: "${requester_id}"
              captures: { pay_entry_id: $.data.id }
            - call: "POST /records/fee-ledger-entries/${pay_entry_id}/reversal"
              payload: { memo: "Card chargeback; payment withdrawn" }
              as: RecordsSupervisor
              as_user_id: "supv-1"
              captures: { rev_entry_id: $.data.id }
            - call: "POST /records/fee-ledger-entries/${pay_entry_id}/reversal"
              payload: { memo: "Duplicate chargeback attempt" }
              as: RecordsSupervisor
              as_user_id: "supv-1"
          assert:
            - "The payment posts FeeLedgerEntry.${pay_entry_id} with entry_type == DEPOSIT_PAYMENT, amount_cents == 596 and source_kind == DEPOSIT"
            - "After the payment PublicRecordsRequest.${req_id}.deposit_paid_cents == 596, fee_recognized_cents == 596 and deposit_balance_cents == 0"
            - "After the payment PublicRecordsRequest.${req_id}.fee_status == SETTLED and processing_status == CLOSED"
            - "The reversal posts FeeLedgerEntry.${rev_entry_id} with entry_type == REVERSAL, amount_cents == -596, reverses_entry_id == \"${pay_entry_id}\" and source_kind == ADJUSTMENT"
            - "CONSERVATION: PublicRecordsRequest.${req_id}.deposit_balance_cents == -596, exactly the pre-payment value, with zero drift"
            - "PublicRecordsRequest.${req_id}.deposit_paid_cents == 0 (the DEPOSIT_PAYMENT and its reversal cancel exactly)"
            - "PublicRecordsRequest.${req_id}.fee_recognized_cents == 596 - unchanged, because the reversal targets a DEPOSIT_PAYMENT and not a charge"
            - "PublicRecordsRequest.${req_id}.waiver_credit_total_cents == 0 and invoiced_total_cents == 596 (the invoice is never rewritten)"
            - "INVARIANT holds: -596 == 0 + 0 - 596"
            - "GET /records/fee-ledger-entries?request_id=${req_id} returns total_count == 3 (LABOR_CHARGE, DEPOSIT_PAYMENT, REVERSAL) - the ledger is append-only, so undoing a payment ADDS a row"
            - "PublicRecordsRequest.${req_id}.fee_status == INVOICED (SETTLED -> INVOICED, because deposit_paid_cents 0 < invoiced_total_cents 596)"
            - "PublicRecordsRequest.${req_id}.processing_status == CLOSED - the compensation reopens ONLY the fee dimension; the records dimension is untouched"
            - "The second reversal of the same entry returns HTTP 409 with data.error_id == \"ERR_ENTRY_ALREADY_REVERSED\" and leaves the ledger at total_count == 3 with deposit_balance_cents == -596"
      - name: qa_rejection_conserves_request_billable_minutes
        grounds:
          - calculations.request_billable_labor_minutes
          - entities.PublicRecordsRequest.fields.billable_labor_minutes
          - state_machines.RedactionTask.QA_PENDING_to_QA_REJECTED
          - state_machines.RedactionTask.QA_REJECTED_to_QA_PENDING
          - state_machines.RedactionTask.QA_PENDING_to_APPROVED
        distinguishing_aspect: |
          A DIFFERENT conserved quantity from payment_reversal_conserves_ledger_balance_identity:
          PublicRecordsRequest.billable_labor_minutes, which counts approved_labor_minutes over
          APPROVED tasks only. Logging 5 minutes and having them rejected must leave the total at
          exactly 7 - the submit/reject pair is fully compensating - and the eventual pass must add
          the RE-logged 6 minutes, never the discarded 5 and never 5 + 6.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "Staff: one TECHNICIAN (level 3) and one REVIEWER (level 3); one GENERAL_PUBLIC Requester."
            - "One ROUTINE VideoAsset, incident INC-2026-0520, duration_ms 3600000 (60 min); a scope-clarified request whose single record is RESPONSIVE with no exemption claims."
            - "Two DRAFT RedactionTasks created up front so no auto-advance to RELEASE_READY can fire mid-scenario: task 1 FACE on [0,20000) and task 2 LICENSE_PLATE on the identical [0,20000) range (legal - the clip conflict is scoped per target_type)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: RecordsSupervisor
              as_user_id: "supv-1"
            - call: "POST /records/staff"
              payload: { full_name: "Tess Tech", role_type: "TECHNICIAN", redaction_certification_level: 3 }
              as: RecordsSupervisor
              as_user_id: "supv-1"
              captures: { tech_id: $.data.id }
            - call: "POST /records/staff"
              payload: { full_name: "Quinn Review", role_type: "REVIEWER", redaction_certification_level: 3 }
              as: RecordsSupervisor
              as_user_id: "supv-1"
              captures: { reviewer_id: $.data.id }
            - call: "POST /records/requesters"
              payload: { full_name: "Pat Public", email: "pat@example.org", requester_type: "GENERAL_PUBLIC" }
              as: RecordsClerk
              as_user_id: "clerk-1"
              captures: { requester_id: $.data.id }
            - call: "POST /records/video-assets"
              payload: { incident_number: "INC-2026-0520", device_serial: "AXON-0520", officer_badge: "B-1112", recorded_start_at: "2026-07-19T19:00:00Z", duration_ms: 3600000, classification: "ROUTINE", retention_category: "INVESTIGATIVE_3Y", scheduled_purge_at: "2029-07-19T00:00:00Z" }
              as: RecordsClerk
              as_user_id: "clerk-1"
              captures: { asset_id: $.data.id }
            - call: "POST /records/requests"
              payload: { requester_id: "${requester_id}", received_at: "2026-08-01T00:00:00Z", subject_incident_number: "INC-2026-0520", requested_date_from: "2026-07-19T00:00:00Z", requested_date_to: "2026-07-20T00:00:00Z", scope_narrative: "BWC video for INC-2026-0520" }
              as: RecordsClerk
              as_user_id: "clerk-1"
              captures: { req_id: $.data.id, req_v1: $.data.version }
            - call: "POST /records/requests/${req_id}/scope-clarification"
              payload: { scope_narrative: "First 20 seconds", requested_date_from: "2026-07-19T00:00:00Z", requested_date_to: "2026-07-19T23:59:59Z", expected_request_version: "${req_v1}" }
              as: RecordsClerk
              as_user_id: "clerk-1"
            - call: "POST /records/requests/${req_id}/responsive-records"
              payload: { video_asset_id: "${asset_id}" }
              as: RecordsClerk
              as_user_id: "clerk-1"
              captures: { rec_id: $.data.id }
            - call: "POST /records/responsive-records/${rec_id}/inclusion"
              payload: { inclusion_status: "RESPONSIVE" }
              as: RecordsClerk
              as_user_id: "clerk-1"
            - call: "POST /records/responsive-records/${rec_id}/redaction-tasks"
              payload: { target_type: "FACE", clip_start_ms: 0, clip_end_ms: 20000, assigned_technician_id: "${tech_id}" }
              as: RedactionTechnician
              as_user_id: "${tech_id}"
              captures: { task1_id: $.data.id }
            - call: "POST /records/responsive-records/${rec_id}/redaction-tasks"
              payload: { target_type: "LICENSE_PLATE", clip_start_ms: 0, clip_end_ms: 20000, assigned_technician_id: "${tech_id}" }
              as: RedactionTechnician
              as_user_id: "${tech_id}"
              captures: { task2_id: $.data.id }
          trigger:
            - call: "POST /records/redaction-tasks/${task1_id}/submit-qa"
              payload: { logged_labor_minutes: 7, qa_reviewer_id: "${reviewer_id}", qa_window_start_at: "2026-08-01T09:00:00Z", qa_window_end_at: "2026-08-01T10:00:00Z" }
              as: RedactionTechnician
              as_user_id: "${tech_id}"
            - call: "POST /records/redaction-tasks/${task1_id}/qa-outcome"
              payload: { outcome: "PASS" }
              as: QualityReviewer
              as_user_id: "${reviewer_id}"
            - call: "POST /records/redaction-tasks/${task2_id}/submit-qa"
              payload: { logged_labor_minutes: 5, qa_reviewer_id: "${reviewer_id}", qa_window_start_at: "2026-08-01T11:00:00Z", qa_window_end_at: "2026-08-01T12:00:00Z" }
              as: RedactionTechnician
              as_user_id: "${tech_id}"
            - call: "POST /records/redaction-tasks/${task2_id}/qa-outcome"
              payload: { outcome: "FAIL", defect_codes: ["EDGE_BLEED"] }
              as: QualityReviewer
              as_user_id: "${reviewer_id}"
            - call: "POST /records/redaction-tasks/${task2_id}/submit-qa"
              payload: { logged_labor_minutes: 6, qa_reviewer_id: "${reviewer_id}", qa_window_start_at: "2026-08-01T14:00:00Z", qa_window_end_at: "2026-08-01T15:00:00Z" }
              as: RedactionTechnician
              as_user_id: "${tech_id}"
            - call: "POST /records/redaction-tasks/${task2_id}/qa-outcome"
              payload: { outcome: "PASS" }
              as: QualityReviewer
              as_user_id: "${reviewer_id}"
          assert:
            - "After task 1 passes: RedactionTask.${task1_id}.status == APPROVED with approved_labor_minutes == 7 and PublicRecordsRequest.${req_id}.billable_labor_minutes == 7"
            - "PublicRecordsRequest.${req_id}.processing_status == REDACTION after task 1 passes (task 2 is still DRAFT, so the RELEASE_READY auto-advance cannot fire)"
            - "CONSERVED WHILE PENDING: after task 2 is submitted with logged_labor_minutes 5, PublicRecordsRequest.${req_id}.billable_labor_minutes is still 7 and RedactionTask.${task2_id}.approved_labor_minutes == 0"
            - "CONSERVED AFTER REJECTION: RedactionTask.${task2_id}.status == QA_REJECTED with defect_codes == [\"EDGE_BLEED\"], approved_labor_minutes == 0, and PublicRecordsRequest.${req_id}.billable_labor_minutes is still exactly 7"
            - "StaffMember.${reviewer_id}.open_qa_assignment_count == 0 after the rejection (the booking is released by the FAIL)"
            - "The re-submission gives RedactionTask.${task2_id}.status == QA_PENDING, rework_count == 1 and logged_labor_minutes == 6 (OVERWRITTEN, not accumulated to 11)"
            - "After the second pass RedactionTask.${task2_id}.status == APPROVED with approved_labor_minutes == 6"
            - "PublicRecordsRequest.${req_id}.billable_labor_minutes == 13 == 7 + 6, NOT 12 (discarded 5) and NOT 18 (5 + 6 accumulated)"
            - "ResponsiveRecord.${rec_id}.approved_labor_minutes == 13 and redacted_segment_ms == 40000 (a plain SUM of clip durations over APPROVED tasks: 20000 + 20000, even though the two targets cover the same span)"
            - "PublicRecordsRequest.${req_id}.processing_status == RELEASE_READY and StaffMember.${reviewer_id}.open_qa_assignment_count == 0"
