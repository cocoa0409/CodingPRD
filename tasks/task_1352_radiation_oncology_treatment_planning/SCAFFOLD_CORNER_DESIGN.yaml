        distinguishing_aspect: "A constraint evaluated one cGy above its limit (4501 > 4500) makes satisfied false and blocks submit-for-check with ERR_DOSE_CONSTRAINT_VIOLATION."
        test_recipe:
          setup: ["course PLANNING; plan DRAFT with one constraint limit 4500 evaluated 4501"]
          setup_api_calls:
            - { call: "POST /oncology/patients", payload: { mrn: "MRN-V15", full_name: "Val Fifteen", date_of_birth: "1980-01-01" }, as: Scheduler, captures: { pat: $.data.id } }
