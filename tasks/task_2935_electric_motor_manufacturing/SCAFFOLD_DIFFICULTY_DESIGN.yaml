  - rule_id: combinatorial_formula
    instances:

      - name: design_loss_budget_five_factor_component_rounding
        grounds:
          - calculations.design_predicted_efficiency
          - entities.MotorDesign.fields.total_predicted_loss_w
          - entities.MotorDesign.fields.predicted_efficiency_pct
          - entities.MotorDesign.fields.design_estimate_class
        distinguishing_aspect: |
          Mode (a) of combinatorial_formula: total_predicted_loss_w is produced by combining FOUR
          independent lookup tables (BASE_LOSS_FRACTION[poles], LAMINATION_FACTOR[lamination_grade],
          WINDING_FACTOR[winding_type], ROTOR_FACTOR[rotor_construction]) with two reference
          ratios (STACK_REF_MM / stack length, COPPER_REF_KG / copper mass) across five share
          constants — no single input determines the answer, and changing only the lamination
          grade, stack length, copper mass and rotor construction moves the budget from
          479.7 W to 388.8 W.
        test_recipe:
          setup:
            - "Empty DB; logical clock at the 2026-08-01T00:00:00.000Z startup default."
            - "No prior MotorDesign rows, so both model_codes are free."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00.000Z" }
              as: PlantAdmin
          trigger:
            - call: "POST /motor-designs"
              payload: { model_code: "WM-132M-7K5-IE3", frame_size: "132M", poles: 4, rated_output_kw: 7.5, rated_voltage_v: 400, target_efficiency_class: "IE3", lamination_grade: "M330_35A", lamination_stack_length_mm: 180, winding_copper_kg: 12.0, winding_type: "LAP", insulation_class: "F", stator_bore_id_mm: 135.400, design_air_gap_mm: 0.450, air_gap_tolerance_mm: 0.050, rotor_construction: "DIE_CAST_ALUMINUM", rotor_bar_count: 34, shaft_diameter_mm: 38.000, shaft_tolerance_class: "k6", bearing_spec_de: "6208-2Z", bearing_spec_nde: "6206-2Z", lubrication_spec: "GREASE_REGREASABLE", duty_type: "S1", enclosure: "IP55", mounting: "B3" }
              as: DesignEngineer
              as_user_id: "u_eng_1"
              captures: { d1_id: $.data.id }
            - call: "POST /motor-designs"
              payload: { model_code: "WM-160M-7K5-IE4", frame_size: "160M", poles: 4, rated_output_kw: 7.5, rated_voltage_v: 400, target_efficiency_class: "IE4", lamination_grade: "M235_35A", lamination_stack_length_mm: 200, winding_copper_kg: 14.5, winding_type: "LAP", insulation_class: "F", stator_bore_id_mm: 148.000, design_air_gap_mm: 0.500, air_gap_tolerance_mm: 0.060, rotor_construction: "FABRICATED_COPPER", rotor_bar_count: 40, shaft_diameter_mm: 42.000, shaft_tolerance_class: "k6", bearing_spec_de: "6210-2Z", bearing_spec_nde: "6208-2Z", lubrication_spec: "GREASE_REGREASABLE", duty_type: "S1", enclosure: "IP55", mounting: "B3" }
              as: DesignEngineer
              as_user_id: "u_eng_1"
              captures: { d2_id: $.data.id }
          assert:
            - "MotorDesign.${d1_id}.total_predicted_loss_w == 479.7 (components 151.2 + 157.5 + 103.5 + 45.0 + 22.5, each rounded to 0.1 W before summing)"
            - "MotorDesign.${d1_id}.predicted_efficiency_pct == 93.99"
            - "MotorDesign.${d1_id}.guaranteed_efficiency_pct == 93.09"
            - "MotorDesign.${d1_id}.design_estimate_class == IE4 and MotorDesign.${d1_id}.predicted_class == IE3"
            - "MotorDesign.${d2_id}.total_predicted_loss_w == 388.8 (components 111.8 + 130.3 + 79.2 + 45.0 + 22.5)"
            - "MotorDesign.${d2_id}.predicted_efficiency_pct == 95.07"
            - "MotorDesign.${d2_id}.guaranteed_efficiency_pct == 94.33"
            - "MotorDesign.${d2_id}.design_estimate_class == IE5 and MotorDesign.${d2_id}.predicted_class == IE4"
            - "both rows have status == DRAFT, revision_index == 0, review_round == 0, created_by_user_id == u_eng_1"

