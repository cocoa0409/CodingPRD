# =============================================================================
# §1.9 Scaffold Corner Design — Coverage Index for Non-Difficulty Tests
# Net Lease Investment Acquisition & Due Diligence
# Enumerates every testable claim §1.1–§1.7 declares that §1.8 does not cover.
# Taxonomy sections from references/claim-extraction-guide.md.
# =============================================================================

scaffold_corner_design:

  # ===========================================================================
  # Section 1 — Entities
  # ===========================================================================
  - section: entities
    instances:
      - name: deal_creation_applies_defaults_and_system_fields
        claim_type: creation
        grounds: [entities.Deal, endpoints.POST_/acquisition-deals]
        distinguishing_aspect: "POST /acquisition-deals/deals with sourcing_channel omitted applies default BROKER; server mints id (UUID, no prefix), created_at, updated_at, version=1; status == SOURCING; posture == SOURCING; earnest_money_released == false."
        test_recipe:
          setup: ["Empty DB; clock at default 2026-08-01"]
          setup_api_calls:
            - call: "POST /acquisition-deals/deals"
              payload: { deal_name: "DefaultsDeal", deal_type: "SINGLE_TENANT", target_close_date: "2026-10-01T00:00:00Z", earnest_money_cents: 100000, purchase_price_cents: 10000000 }
              as: AcquisitionsAnalyst
              captures: { deal_id: $.data.id }
          trigger:
            - call: "GET /acquisition-deals/deals/${deal_id}"
              payload: {}
              as: AcquisitionsAnalyst
          assert:
            - "Deal.sourcing_channel == BROKER (default applied)"
            - "Deal.status == SOURCING and posture == SOURCING"
            - "Deal.version == 1; id is UUID without type prefix; created_at == 2026-08-01T00:00:00.000Z"
            - "Deal.earnest_money_released == false"

      - name: deal_target_close_date_below_30_days_rejected
        claim_type: type_constraints
        grounds: [entities.Deal.fields.target_close_date, "errors[ERR_FIELD_CONSTRAINT_VIOLATION]"]
        distinguishing_aspect: "target_close_date 20 days after creation (< 30 day floor) fails ERR_FIELD_CONSTRAINT_VIOLATION (400); exactly 30 days passes."
        test_recipe:
          setup: ["Empty DB; clock default 2026-08-01"]
          setup_api_calls: []
          trigger:
            - call: "POST /acquisition-deals/deals"
              payload: { deal_name: "TooSoon", deal_type: "SINGLE_TENANT", target_close_date: "2026-08-21T00:00:00Z", earnest_money_cents: 100000, purchase_price_cents: 10000000 }
              as: AcquisitionsAnalyst
              captures: { err: $.data.error_id }
            - call: "POST /acquisition-deals/deals"
              payload: { deal_name: "ExactlyThirty", deal_type: "SINGLE_TENANT", target_close_date: "2026-08-31T00:00:00Z", earnest_money_cents: 100000, purchase_price_cents: 10000000 }
              as: AcquisitionsAnalyst
              captures: { ok_id: $.data.id }
          assert:
            - "First create returns ERR_FIELD_CONSTRAINT_VIOLATION"
            - "Second create (exactly 30 days) succeeds with 201"

      - name: deal_get_not_found_returns_404
        claim_type: not_found
        grounds: ["endpoints.GET_/acquisition-deals/{dealId}", "errors[ERR_DEAL_NOT_FOUND]"]
        distinguishing_aspect: "GET with a well-formed but non-existent deal UUID returns 404 ERR_DEAL_NOT_FOUND."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /acquisition-deals/deals/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: AcquisitionsAnalyst
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 404; error_id == ERR_DEAL_NOT_FOUND"

      - name: deal_list_pagination_envelope
        claim_type: listing
        grounds: [response_envelope, endpoints.GET_/acquisition-deals]
        distinguishing_aspect: "GET /acquisition-deals/deals?limit=2 returns pagination fields limit/offset/total_count/has_more; response_type == array; meta.api_request_id present."
        test_recipe:
          setup: ["Three deals exist"]
          setup_api_calls:
            - call: "POST /acquisition-deals/deals"
              payload: { deal_name: "D1", deal_type: "SINGLE_TENANT", target_close_date: "2026-10-01T00:00:00Z", earnest_money_cents: 100000, purchase_price_cents: 10000000 }
              as: AcquisitionsAnalyst
            - call: "POST /acquisition-deals/deals"
              payload: { deal_name: "D2", deal_type: "SINGLE_TENANT", target_close_date: "2026-10-01T00:00:00Z", earnest_money_cents: 100000, purchase_price_cents: 10000000 }
              as: AcquisitionsAnalyst
            - call: "POST /acquisition-deals/deals"
              payload: { deal_name: "D3", deal_type: "SINGLE_TENANT", target_close_date: "2026-10-01T00:00:00Z", earnest_money_cents: 100000, purchase_price_cents: 10000000 }
              as: AcquisitionsAnalyst
          trigger:
            - call: "GET /acquisition-deals/deals?limit=2&offset=0"
              payload: {}
              as: AcquisitionsAnalyst
          assert:
            - "response_type == array; data has 2 items"
            - "total_count == 3 and has_more == true"
            - "meta.api_request_id present; limit == 2; offset == 0"

      - name: proration_immutable_no_update_endpoint
        claim_type: immutability
        grounds: [entities.Proration]
        distinguishing_aspect: "Proration has common_fields: false (id + created_at only, no version) and no update/delete endpoint; corrections flow exclusively through TrueUpAdjustment."
        test_recipe:
          setup: ["A single deal exists (no closing statement yet); the claim is structural — the §1.5 endpoint table declares no mutating route for Proration"]
          setup_api_calls:
            - call: "POST /acquisition-deals/deals"
              payload: { deal_name: "ImmutDeal", deal_type: "SINGLE_TENANT", target_close_date: "2026-10-01T00:00:00Z", earnest_money_cents: 100000, purchase_price_cents: 10000000 }
              as: AcquisitionsAnalyst
              captures: { d: $.data.id }
          trigger:
            - call: "GET /acquisition-deals/deals/${d}/closing-statements"
              payload: {}
              as: EscrowOfficer
          assert:
            - "GET closing-statements returns an empty array (response_type == array, total_count == 0) — statements exist only after certify-clear-to-close"
            - "No PUT/PATCH/DELETE route exists for /prorations/{id} (scaffold declares none); any attempt returns 404/405"
            - "Proration entity has common_fields: false → carries id + created_at only, no version field"

      - name: property_parent_relationship_wrong_deal_returns_404
        claim_type: parent_relationships
        grounds: [entities.Property.fields.deal_id, "errors[ERR_PROPERTY_NOT_FOUND]"]
        distinguishing_aspect: "GET /acquisition-deals/{dealA}/properties/{prop_of_dealB} returns 404 ERR_PROPERTY_NOT_FOUND — nested path enforces parent scope."
        test_recipe:
          setup: ["Two deals; property created under deal B only"]
          setup_api_calls:
            - call: "POST /acquisition-deals/deals"
              payload: { deal_name: "ParentA", deal_type: "SINGLE_TENANT", target_close_date: "2026-10-01T00:00:00Z", earnest_money_cents: 100000, purchase_price_cents: 10000000 }
              as: AcquisitionsAnalyst
              captures: { da: $.data.id }
            - call: "POST /acquisition-deals/deals"
              payload: { deal_name: "ParentB", deal_type: "SINGLE_TENANT", target_close_date: "2026-10-01T00:00:00Z", earnest_money_cents: 100000, purchase_price_cents: 10000000 }
              as: AcquisitionsAnalyst
              captures: { db: $.data.id }
            - call: "POST /acquisition-deals/deals/${db}/properties"
              payload: { address: "1 B St", property_type: "RETAIL", rentable_sqft: 5000, year_built: 2010 }
              as: AcquisitionsAnalyst
              captures: { prop_b: $.data.id }
          trigger:
            - call: "GET /acquisition-deals/deals/${da}/properties/${prop_b}"
              payload: {}
              as: AcquisitionsAnalyst
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 404; error_id == ERR_PROPERTY_NOT_FOUND (property exists but not under deal A)"

      - name: lease_computed_fields_ignore_client_input
        claim_type: computed_fields
        grounds: [entities.Lease.fields.remaining_term_months, entities.Lease.fields.rollover_risk_tier]
        distinguishing_aspect: "Client-supplied remaining_term_months / rollover_risk_tier values in POST are ignored; server computes them at verify."
        test_recipe:
          setup: ["Deal + property + approved tenant"]
          setup_api_calls:
            - call: "POST /acquisition-deals/deals"
              payload: { deal_name: "ComputedDeal", deal_type: "SINGLE_TENANT", target_close_date: "2026-10-01T00:00:00Z", earnest_money_cents: 100000, purchase_price_cents: 10000000 }
              as: AcquisitionsAnalyst
              captures: { d: $.data.id }
            - call: "POST /acquisition-deals/deals/${d}/properties"
              payload: { address: "9 Computed Ln", property_type: "RETAIL", rentable_sqft: 5000, year_built: 2010 }
              as: AcquisitionsAnalyst
              captures: { p: $.data.id }
            - call: "POST /tenants"
              payload: { legal_name: "CT", credit_rating: "INVESTMENT_GRADE", credit_score: 800, annual_revenue_cents: 100000000, is_guaranteed: true }
              as: AcquisitionsAnalyst
              captures: { t: $.data.id }
            - call: "POST /tenants/${t}/analyze-credit"
              payload: {}
              as: UnderwritingCommittee
            - call: "POST /tenants/${t}/approve-credit"
              payload: {}
              as: UnderwritingCommittee
          trigger:
            - call: "POST /acquisition-deals/deals/${d}/properties/${p}/leases"
              payload: { tenant_id: "${t}", lease_type: "NNN", annual_base_rent_cents: 1000000, lease_commencement_date: "2020-01-01T00:00:00Z", lease_expiration_date: "2036-08-01T00:00:00Z" }
              as: AcquisitionsAnalyst
              captures: { l: $.data.id }
            - call: "POST /acquisition-deals/deals/${d}/properties/${p}/leases/${l}/verify"
              payload: {}
              as: AcquisitionsAnalyst
          assert:
            - "Lease.remaining_term_months == 120 (server-computed from clock 2026-08-01, expiry 2036-08-01)"
            - "Lease.rollover_risk_tier == LOW (120 is NOT < 120)"

  # ===========================================================================
  # Section 2 — State Machines
  # ===========================================================================
  - section: state_machines
    instances:
      - name: deal_terminal_state_lockdown
        claim_type: terminal_state_lockdown
        grounds: [state_machines.Deal, "errors[ERR_DEAL_INVALID_STATE]"]
        distinguishing_aspect: "From TERMINATED and CLOSED, every transition trigger fails ERR_DEAL_INVALID_STATE."
        test_recipe:
          setup: ["Deal terminated early from PSA_PENDING path — terminate is allowed from DUE_DILIGENCE/CLEAR_TO_CLOSE; use a SOURCING deal -> cannot terminate; instead drive to PSA_EXECUTED then terminate"]
          setup_api_calls:
            - call: "POST /acquisition-deals/deals"
              payload: { deal_name: "TermDeal", deal_type: "SINGLE_TENANT", target_close_date: "2026-10-01T00:00:00Z", earnest_money_cents: 250000, purchase_price_cents: 15000000 }
              as: AcquisitionsAnalyst
              captures: { d: $.data.id }
            - call: "POST /acquisition-deals/deals/${d}/properties"
              payload: { address: "1 Term St", property_type: "RETAIL", rentable_sqft: 5000, year_built: 2010 }
              as: AcquisitionsAnalyst
            - call: "POST /tenants"
              payload: { legal_name: "TT", credit_rating: "INVESTMENT_GRADE", credit_score: 800, annual_revenue_cents: 100000000, is_guaranteed: true }
              as: AcquisitionsAnalyst
              captures: { t: $.data.id }
            - call: "POST /tenants/${t}/analyze-credit"
              payload: {}
              as: UnderwritingCommittee
            - call: "POST /tenants/${t}/approve-credit"
              payload: {}
              as: UnderwritingCommittee
            - call: "POST /acquisition-deals/deals/${d}/properties"
              payload: { address: "2 Term St", property_type: "RETAIL", rentable_sqft: 6000, year_built: 2011 }
              as: AcquisitionsAnalyst
              captures: { p: $.data.id }
            - call: "POST /acquisition-deals/deals/${d}/properties/${p}/leases"
              payload: { tenant_id: "${t}", lease_type: "NNN", annual_base_rent_cents: 1000000, lease_commencement_date: "2020-01-01T00:00:00Z", lease_expiration_date: "2036-01-01T00:00:00Z" }
              as: AcquisitionsAnalyst
              captures: { l: $.data.id }
            - call: "POST /acquisition-deals/deals/${d}/properties/${p}/leases/${l}/verify"
              payload: {}
              as: AcquisitionsAnalyst
            - call: "POST /acquisition-deals/deals/${d}/underwriting-models"
              payload: { opex_allowance_variant: "CONSERVATIVE" }
              as: AcquisitionsAnalyst
              captures: { m: $.data.id }
            - call: "POST /acquisition-deals/deals/${d}/underwriting-models/${m}/submit"
              payload: {}
              as: AcquisitionsAnalyst
            - call: "POST /acquisition-deals/deals/${d}/underwriting-models/${m}/approve"
              payload: {}
              as: UnderwritingCommittee
            - call: "POST /acquisition-deals/deals/${d}/submit-for-psa"
              payload: {}
              as: AcquisitionsAnalyst
            - call: "POST /acquisition-deals/deals/${d}/purchase-agreements"
              payload: { psa_price_cents: 15000000, earnest_money_cents: 250000, dd_period_days: 30, financing_contingency_days: 0 }
              as: AcquisitionsAnalyst
              captures: { psa: $.data.id }
            - call: "GET /acquisition-deals/deals/${d}"
              payload: {}
              as: AcquisitionsAnalyst
              captures: { dv: $.data.version }
            - call: "POST /acquisition-deals/deals/${d}/purchase-agreements/${psa}/execute"
              payload: {}
              as: AcquisitionsAnalyst
            - call: "POST /acquisition-deals/deals/${d}/terminate"
              payload: { termination_reason: "BUYER_DEFAULT" }
              as: AcquisitionsAnalyst
          trigger:
            - call: "POST /acquisition-deals/deals/${d}/terminate"
              payload: { termination_reason: "DD_FAILURE" }
              as: AcquisitionsAnalyst
              captures: { err: $.data.error_id }
            - call: "POST /acquisition-deals/deals/${d}/close"
              payload: {}
              as: EscrowOfficer
              captures: { err2: $.data.error_id }
          assert:
            - "Second terminate from TERMINATED returns ERR_DEAL_INVALID_STATE (409)"
            - "close from TERMINATED returns ERR_DEAL_INVALID_STATE or ERR_NOT_CLEAR_TO_CLOSE"
            - "First terminate from PSA_EXECUTED set earnest_money_released == true (BUYER_DEFAULT forfeits)"

      - name: milestone_waive_title_review_not_waivable
        claim_type: invalid_transition
        grounds: [state_machines.DueDiligenceMilestone, "errors[ERR_MILESTONE_NOT_WAIVABLE]"]
        distinguishing_aspect: "Waiving a TITLE_REVIEW or ENVIRONMENTAL milestone returns ERR_MILESTONE_NOT_WAIVABLE even when the milestone is in a waivable state."
        test_recipe:
          setup: ["Deal -> PSA_EXECUTED; milestones auto-created"]
          setup_api_calls:
            - call: "POST /acquisition-deals/deals"
              payload: { deal_name: "WaiveDeal", deal_type: "SINGLE_TENANT", target_close_date: "2026-10-01T00:00:00Z", earnest_money_cents: 250000, purchase_price_cents: 15000000 }
              as: AcquisitionsAnalyst
              captures: { d: $.data.id }
            - call: "POST /acquisition-deals/deals/${d}/properties"
              payload: { address: "1 Waive St", property_type: "RETAIL", rentable_sqft: 5000, year_built: 2010 }
              as: AcquisitionsAnalyst
              captures: { p: $.data.id }
            - call: "POST /tenants"
              payload: { legal_name: "WT", credit_rating: "INVESTMENT_GRADE", credit_score: 800, annual_revenue_cents: 100000000, is_guaranteed: true }
              as: AcquisitionsAnalyst
              captures: { t: $.data.id }
            - call: "POST /tenants/${t}/analyze-credit"
              payload: {}
              as: UnderwritingCommittee
            - call: "POST /tenants/${t}/approve-credit"
              payload: {}
              as: UnderwritingCommittee
            - call: "POST /acquisition-deals/deals/${d}/properties/${p}/leases"
              payload: { tenant_id: "${t}", lease_type: "NNN", annual_base_rent_cents: 1000000, lease_commencement_date: "2020-01-01T00:00:00Z", lease_expiration_date: "2036-01-01T00:00:00Z" }
              as: AcquisitionsAnalyst
              captures: { l: $.data.id }
            - call: "POST /acquisition-deals/deals/${d}/properties/${p}/leases/${l}/verify"
              payload: {}
              as: AcquisitionsAnalyst
            - call: "POST /acquisition-deals/deals/${d}/underwriting-models"
              payload: { opex_allowance_variant: "CONSERVATIVE" }
              as: AcquisitionsAnalyst
              captures: { m: $.data.id }
            - call: "POST /acquisition-deals/deals/${d}/underwriting-models/${m}/submit"
              payload: {}
              as: AcquisitionsAnalyst
            - call: "POST /acquisition-deals/deals/${d}/underwriting-models/${m}/approve"
              payload: {}
              as: UnderwritingCommittee
            - call: "POST /acquisition-deals/deals/${d}/submit-for-psa"
              payload: {}
              as: AcquisitionsAnalyst
            - call: "POST /acquisition-deals/deals/${d}/purchase-agreements"
              payload: { psa_price_cents: 15000000, earnest_money_cents: 250000, dd_period_days: 30, financing_contingency_days: 0 }
              as: AcquisitionsAnalyst
              captures: { psa: $.data.id }
            - call: "GET /acquisition-deals/deals/${d}"
              payload: {}
              as: AcquisitionsAnalyst
              captures: { dv: $.data.version }
            - call: "POST /acquisition-deals/deals/${d}/purchase-agreements/${psa}/execute"
              payload: {}
              as: AcquisitionsAnalyst
            - call: "GET /acquisition-deals/deals/${d}/milestones?milestone_type=TITLE_REVIEW"
              payload: {}
              as: DueDiligenceOfficer
              captures: { tm: "$.data[0].id" }
          trigger:
            - call: "POST /acquisition-deals/deals/${d}/milestones/${tm}/waive"
              payload: {}
              as: UnderwritingCommittee
              captures: { err: $.data.error_id }
          assert:
            - "Waive returns ERR_MILESTONE_NOT_WAIVABLE (422) for TITLE_REVIEW milestone"

      - name: model_approve_sod_violation_same_user
        claim_type: sod_enforcement
        grounds: [state_machines.UnderwritingModel.SUBMITTED_to_APPROVED, "errors[ERR_SOD_VIOLATION]"]
        distinguishing_aspect: "The same X-User-ID that submitted a model cannot approve it; a different committee member can."
        test_recipe:
          setup: ["Model SUBMITTED by user analyst-1"]
          setup_api_calls:
            - call: "POST /acquisition-deals/deals"
              payload: { deal_name: "SODDeal", deal_type: "SINGLE_TENANT", target_close_date: "2026-10-01T00:00:00Z", earnest_money_cents: 250000, purchase_price_cents: 15000000 }
              as: AcquisitionsAnalyst
              captures: { d: $.data.id }
            - call: "POST /acquisition-deals/deals/${d}/properties"
              payload: { address: "1 SOD St", property_type: "RETAIL", rentable_sqft: 5000, year_built: 2010 }
              as: AcquisitionsAnalyst
              captures: { p: $.data.id }
            - call: "POST /tenants"
              payload: { legal_name: "SODT", credit_rating: "INVESTMENT_GRADE", credit_score: 800, annual_revenue_cents: 100000000, is_guaranteed: true }
              as: AcquisitionsAnalyst
              captures: { t: $.data.id }
            - call: "POST /tenants/${t}/analyze-credit"
              payload: {}
              as: UnderwritingCommittee
            - call: "POST /tenants/${t}/approve-credit"
              payload: {}
              as: UnderwritingCommittee
            - call: "POST /acquisition-deals/deals/${d}/properties/${p}/leases"
              payload: { tenant_id: "${t}", lease_type: "NNN", annual_base_rent_cents: 1000000, lease_commencement_date: "2020-01-01T00:00:00Z", lease_expiration_date: "2036-01-01T00:00:00Z" }
              as: AcquisitionsAnalyst
              captures: { l: $.data.id }
            - call: "POST /acquisition-deals/deals/${d}/properties/${p}/leases/${l}/verify"
              payload: {}
              as: AcquisitionsAnalyst
            - call: "POST /acquisition-deals/deals/${d}/underwriting-models"
              payload: { opex_allowance_variant: "CONSERVATIVE" }
              as: AcquisitionsAnalyst
              captures: { m: $.data.id }
            - call: "POST /acquisition-deals/deals/${d}/underwriting-models/${m}/submit"
              payload: {}
              as: AcquisitionsAnalyst
              as_user_id: "analyst-1"
          trigger:
            - call: "POST /acquisition-deals/deals/${d}/underwriting-models/${m}/approve"
              payload: {}
              as: UnderwritingCommittee
              as_user_id: "analyst-1"
              captures: { err: $.data.error_id }
            - call: "POST /acquisition-deals/deals/${d}/underwriting-models/${m}/approve"
              payload: {}
              as: UnderwritingCommittee
              as_user_id: "committee-2"
              captures: { ok: $.data.status }
          assert:
            - "Approve by submitter (same X-User-ID) returns ERR_SOD_VIOLATION (403)"
            - "Approve by different committee member succeeds: status == APPROVED"

      - name: estoppel_certify_invalid_from_requested
        claim_type: invalid_transition
        grounds: [state_machines.EstoppelCertificate, "errors[ERR_ESTOPPEL_INVALID_STATE]"]
        distinguishing_aspect: "Certify from REQUESTED (skipping RECEIVED) fails ERR_ESTOPPEL_INVALID_STATE; certify must pass through RECEIVED."
        test_recipe:
          setup: ["Deal -> PSA_EXECUTED; estoppel created (REQUESTED) but never received"]
          setup_api_calls:
            - call: "POST /acquisition-deals/deals"
              payload: { deal_name: "EstStateDeal", deal_type: "SINGLE_TENANT", target_close_date: "2026-10-01T00:00:00Z", earnest_money_cents: 250000, purchase_price_cents: 15000000 }
              as: AcquisitionsAnalyst
              captures: { d: $.data.id }
            - call: "POST /acquisition-deals/deals/${d}/properties"
              payload: { address: "1 Est St", property_type: "RETAIL", rentable_sqft: 5000, year_built: 2010 }
              as: AcquisitionsAnalyst
              captures: { p: $.data.id }
            - call: "POST /tenants"
              payload: { legal_name: "ET", credit_rating: "INVESTMENT_GRADE", credit_score: 800, annual_revenue_cents: 100000000, is_guaranteed: true }
              as: AcquisitionsAnalyst
              captures: { t: $.data.id }
            - call: "POST /tenants/${t}/analyze-credit"
              payload: {}
              as: UnderwritingCommittee
            - call: "POST /tenants/${t}/approve-credit"
              payload: {}
              as: UnderwritingCommittee
            - call: "POST /acquisition-deals/deals/${d}/properties/${p}/leases"
              payload: { tenant_id: "${t}", lease_type: "NNN", annual_base_rent_cents: 1000000, lease_commencement_date: "2020-01-01T00:00:00Z", lease_expiration_date: "2036-01-01T00:00:00Z" }
              as: AcquisitionsAnalyst
              captures: { l: $.data.id }
            - call: "POST /acquisition-deals/deals/${d}/properties/${p}/leases/${l}/verify"
              payload: {}
              as: AcquisitionsAnalyst
            - call: "POST /acquisition-deals/deals/${d}/underwriting-models"
              payload: { opex_allowance_variant: "CONSERVATIVE" }
              as: AcquisitionsAnalyst
              captures: { m: $.data.id }
            - call: "POST /acquisition-deals/deals/${d}/underwriting-models/${m}/submit"
              payload: {}
              as: AcquisitionsAnalyst
            - call: "POST /acquisition-deals/deals/${d}/underwriting-models/${m}/approve"
              payload: {}
              as: UnderwritingCommittee
            - call: "POST /acquisition-deals/deals/${d}/submit-for-psa"
              payload: {}
              as: AcquisitionsAnalyst
            - call: "POST /acquisition-deals/deals/${d}/purchase-agreements"
              payload: { psa_price_cents: 15000000, earnest_money_cents: 250000, dd_period_days: 30, financing_contingency_days: 0 }
              as: AcquisitionsAnalyst
              captures: { psa: $.data.id }
            - call: "GET /acquisition-deals/deals/${d}"
              payload: {}
