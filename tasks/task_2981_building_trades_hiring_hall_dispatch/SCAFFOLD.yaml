scenario: |
  2981. Building Trades Hiring Hall Dispatch (local union hiring hall): member registration on
  out-of-work lists with classification and skill endorsements, dispatch order rules by list group,
  seniority or first-registered priority, contractor request intake with named-call and special-skill
  request limits, referral issuance, acceptance windows and refusal consequences on list position,
  travelers from sister locals and their placement priority relative to local members, apprentice
  ratio requirements paired with journeyworker dispatch, layoff, recall and re-registration timing,
  grievance over improper dispatch and record retention
domain_name: "building-trades-hiring-hall-dispatch"
api_prefix: "/hiring-hall"

complexity_profile:
  primary_archetype: "Quota / allocation"
  secondary_archetype: "Compliance / audit"
  complexity_layers:
    - selector_policy
    - cascading_side_effects
    - dual_variant_calculation
    - optimistic_concurrency

  entity_topology: graph
  # Registration/Referral/Dispatch form a many-to-many web across Member, OutOfWorkList and
  # JobRequest; Registration.predecessor_registration_id and Dispatch.recall_of_dispatch_id are
  # self-referential; DispatchLedgerEntry cross-cuts Member and Referral.

  state_machine_shape: cyclic
  # Registration: REGISTERED -> REFERRED -> REGISTERED (good-cause refusal / withdrawal) loops.
  # JobRequest: OPEN -> SUSPENDED -> OPEN (contractor delinquency then reinstatement) loops, and
  # its status is additionally derived from child Referral acceptance counts (compound).

  relationship_patterns:
    - one_to_many          # OutOfWorkList -> Registration, JobRequest -> Referral
    - many_to_many         # Member <-> JobRequest through Referral; Member <-> skill codes through SkillEndorsement
    - self_referential     # Registration.predecessor_registration_id, Dispatch.recall_of_dispatch_id
    - cross_aggregate      # DispatchLedgerEntry references both Referral and Member

  role_model: segregation_of_duties
  # The BusinessManager who adjudicates a grievance MUST NOT be the same X-User-ID as the
  # Dispatcher who issued the challenged referral (people can hold both hats at a small local).

  consistency_model: immediate

difficulty_level: expert

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# ---------------------------------------------------------------------------
# §1.1 Entity-Relationship Table
# ---------------------------------------------------------------------------
entities:
  - name: Local
    parent: null
    common_fields: true
    fields:
      - name: local_number
        type: integer
        source: input
        description: "Union local number printed on the dispatch slip"
        constraints: "1..9999"
      - name: name
        type: string
        source: input
        description: "Display name of the local"
        constraints: "1..120 chars"
      - name: kind
        type: enum
        source: input
        description: "HOME is the local that operates this hiring hall; SISTER locals send travelers"
        constraints: "one of {HOME, SISTER}"
      - name: reciprocity_factor_bp
        type: integer
        source: input
        description: "Basis points applied to hours earned under this local's agreement when a traveler claims them here (5000 = 50%). 0 means no reciprocity agreement."
        default: 0
        constraints: "0..10000"

  - name: Member
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: "Member name"
        constraints: "1..120 chars"
      - name: home_local_id
        type: string
        source: input
        description: "FK -> Local.id; the local that holds this member's book"
      - name: classification
        type: enum
        source: input
        description: "Trade classification that determines which dispatch slots the member may fill"
        constraints: "one of {JOURNEYWORKER, APPRENTICE}"
      - name: apprentice_period
        type: integer
        source: input
        description: "Apprentice wage period; required when classification == APPRENTICE, MUST be null otherwise"
        default: null
        constraints: "null or 1..4"
      - name: local_hours_in_trade
        type: integer
        source: input
        description: "Hours already worked under the HOME local's agreement; drives out-of-work list group eligibility"
        constraints: ">= 0"
      - name: standing
        type: enum
        source: input
        description: "Dues/assessment standing with the local"
        default: "GOOD_STANDING"
        constraints: "one of {GOOD_STANDING, DELINQUENT}"
      - name: is_traveler
        type: boolean
        source: computed
        description: "true when the member's home Local.kind == SISTER"
      - name: re_registration_eligible_at
        type: datetime
        source: computed
        description: "Set to clock + REREGISTRATION_COOLDOWN_DAYS when a registration of this member is removed for THREE_REFUSALS; null otherwise"
        default: null
      - name: refusal_strike_count
        type: integer
        source: computed
        description: "effective_refusal_strikes per §1.3 (rolling REFUSAL_WINDOW_DAYS window, LONG_CALL referrals only, no-good-cause refusals plus sweep expiries)"
      - name: dispatch_eligible
        type: boolean
        source: computed
        description: "standing == GOOD_STANDING AND (re_registration_eligible_at IS NULL OR clock >= re_registration_eligible_at)"

  - name: SkillEndorsement
    parent: Member
    common_fields: false
    fields:
      - name: member_id
        type: string
        source: input
        description: "FK -> Member.id; the endorsed member"
      - name: skill_code
        type: enum
        source: input
        description: "Certified special skill the hall may dispatch against"
        constraints: "one of {WELDING_6G, RIGGING, INSTRUMENTATION, FIRE_WATCH}"
      - name: certified_until
        type: datetime
        source: input
        description: "Instant at which the certification lapses; the endorsement counts only while clock < certified_until"
      - name: verified
        type: boolean
        source: input
        description: "true when the hall has sighted the certification card; unverified endorsements never satisfy a SPECIAL_SKILL referral"
        default: false

  - name: OutOfWorkList
    parent: null
    common_fields: true
    fields:
      - name: group_code
        type: enum
        source: input
        description: "List group; lower priority_rank groups are exhausted before higher ones under the strict_group_order variant"
        constraints: "one of {GROUP_1, GROUP_2, GROUP_3, GROUP_4}"
      - name: priority_rank
        type: integer
        source: input
        description: "Dispatch precedence of this group; 1 is dispatched first"
        constraints: "1..4"
      - name: ordering_policy
        type: enum
        source: input
        description: "Intra-group ordering rule: SENIORITY ranks by Registration.credited_seniority_hours DESC, FIRST_REGISTERED ranks by Registration.registered_at ASC"
        constraints: "one of {SENIORITY, FIRST_REGISTERED}"
      - name: requires_local_hours
        type: integer
        source: input
        description: "Minimum Member.local_hours_in_trade needed to register on this group"
        constraints: ">= 0"
      - name: accepts_travelers
        type: boolean
        source: input
        description: "When false, a Member whose is_traveler == true may not register on this group"
      - name: registered_count
        type: integer
        source: computed
        description: "Count of Registrations on this list with status == REGISTERED"

  - name: Registration
    parent: OutOfWorkList
    common_fields: true
    fields:
      - name: member_id
        type: string
        source: input
        description: "FK -> Member.id; the registrant"
      - name: list_id
        type: string
        source: input
        description: "FK -> OutOfWorkList.id; the out-of-work list group signed onto"
      - name: predecessor_registration_id
        type: string
        source: input
        description: "FK -> Registration.id; the member's prior registration this one continues after a layoff or a renewal expiry"
        default: null
      - name: claim_position_preservation
        type: boolean
        source: input
        description: "When true the registrant claims the predecessor's registered_at (position preservation after layoff); rejected outside LAYOFF_REREG_WINDOW_DAYS"
        default: false
      - name: reciprocity_credits
        type: array
        source: input
        description: "Traveler hour claims: array of objects { sister_local_id: string, raw_hours: integer }; each sister_local_id MUST reference a Local with kind == SISTER and reciprocity_factor_bp > 0"
        default: []
      - name: registered_at
        type: datetime
        source: computed
        description: "clock at creation, EXCEPT when claim_position_preservation succeeds, in which case predecessor.registered_at is inherited verbatim"
      - name: last_renewed_at
        type: datetime
        source: computed
        description: "clock at creation; reset to clock by the renew endpoint. Never inherited from a predecessor."
      - name: renewal_due_at
        type: datetime
        source: computed
        description: "last_renewed_at + RESIGN_INTERVAL_DAYS; the sweep expires the registration once clock > renewal_due_at"
      - name: credited_seniority_hours
        type: integer
        source: computed
        description: "traveler_credited_seniority_hours per §1.3 = Member.local_hours_in_trade + sum of per-entry rounded reciprocity credits"
      - name: demotion_count
        type: integer
        source: computed
        description: "Number of no-good-cause refusals and sweep expiries charged to this registration chain; ranked ASC ahead of the ordering_policy key"
        default: 0
      - name: priority_flag
        type: boolean
        source: computed
        description: "Set true by a SUSTAINED grievance with remedy NEXT_AVAILABLE_PRIORITY; ranks the registration ahead of all peers on its list until consumed by an accepted referral"
        default: false
      - name: position_number
        type: integer
        source: computed
        description: "1-based rank of this Registration within its list among status == REGISTERED rows under the strict_group_order intra-list key; null when status != REGISTERED"
      - name: status
        type: enum
        source: computed
        description: "Lifecycle state per §1.2"
        default: "REGISTERED"
        constraints: "one of {REGISTERED, REFERRED, DISPATCHED_OUT, REMOVED, EXPIRED}"
      - name: removal_reason
        type: enum
        source: computed
        description: "Why the registration left the list; null while status IN {REGISTERED, REFERRED, DISPATCHED_OUT}"
        default: null
        constraints: "null or one of {THREE_REFUSALS, VOLUNTARY, ADMINISTRATIVE, RENEWAL_LAPSED}"

  - name: Contractor
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Signatory employer name"
        constraints: "1..120 chars"
      - name: agreement_expires_at
        type: datetime
        source: input
        description: "Expiry instant of the collective bargaining agreement"
      - name: signatory_status
        type: enum
        source: input
        description: "Standing under the agreement; only SIGNATORY may open a job request"
        default: "SIGNATORY"
        constraints: "one of {SIGNATORY, DELINQUENT_TRUST_FUNDS, TERMINATED}"

  - name: JobRequest
    parent: Contractor
    common_fields: true
    fields:
      - name: contractor_id
        type: string
        source: input
        description: "FK -> Contractor.id; the requesting employer"
      - name: job_site
        type: string
        source: input
        description: "Reporting location printed on the dispatch slip"
        constraints: "1..160 chars"
      - name: journeyworkers_requested
        type: integer
        source: input
        description: "Journeyworker headcount requested"
        constraints: "0..40; journeyworkers_requested + apprentices_requested >= 1"
      - name: apprentices_requested
        type: integer
        source: input
        description: "Apprentice headcount requested; still capped at dispatch time by the ratio cap"
        constraints: "0..40"
      - name: expected_duration_days
        type: integer
        source: input
        description: "Expected job length in calendar days; drives duration_type"
        constraints: "1..3650"
      - name: report_at
        type: datetime
        source: input
        description: "Instant the dispatched worker must report to the job site"
      - name: hourly_rate_cents
        type: integer
        source: input
        description: "Journeyworker hourly rate in cents; apprentice pay derives from it via APPRENTICE_RATE_FACTOR_BP"
        constraints: "1..99999"
      - name: required_skill_code
        type: enum
        source: input
        description: "Special skill this request may demand on some slots; null when the request is plain list-order work"
        default: null
        constraints: "null or one of {WELDING_6G, RIGGING, INSTRUMENTATION, FIRE_WATCH}"
      - name: special_skill_slots_requested
        type: integer
        source: input
        description: "How many of the journeyworker slots the contractor wants filled by special-skill referral"
        default: 0
        constraints: ">= 0"
      - name: named_call_member_ids
        type: array
        source: input
        description: "Array of Member.id strings the contractor names by right of the agreement; each MUST exist and each NAMED_CALL referral MUST target a member in this array"
        default: []
      - name: duration_type
        type: enum
        source: computed
        description: "SHORT_CALL when expected_duration_days <= SHORT_CALL_MAX_DAYS, else LONG_CALL"
        constraints: "one of {SHORT_CALL, LONG_CALL}"
      - name: named_call_allowance
        type: integer
        source: computed
        description: "named_call_and_skill_allowance per §1.3; 0 for SHORT_CALL"
      - name: special_skill_allowance
        type: integer
        source: computed
        description: "named_call_and_skill_allowance per §1.3; 0 when required_skill_code IS NULL"
      - name: accepted_journeyworker_count
        type: integer
        source: computed
        description: "Count of Referrals on this request with slot_kind == JOURNEYWORKER and status == ACCEPTED"
      - name: accepted_apprentice_count
        type: integer
        source: computed
        description: "Count of Referrals on this request with slot_kind == APPRENTICE and status == ACCEPTED"
      - name: open_journeyworker_slots
        type: integer
        source: computed
        description: "journeyworkers_requested - count(Referral WHERE slot_kind == JOURNEYWORKER AND status IN {ISSUED, ACCEPTED})"
      - name: open_apprentice_slots
        type: integer
        source: computed
        description: "apprentices_requested - count(Referral WHERE slot_kind == APPRENTICE AND status IN {ISSUED, ACCEPTED})"
      - name: max_apprentices_allowed
        type: integer
        source: computed
        description: "apprentice_ratio_cap per §1.3, recomputed from ACCEPTED journeyworker referrals only"
      - name: status
        type: enum
        source: computed
        description: "Lifecycle state per §1.2; derived from child Referral acceptance counts except while SUSPENDED or CANCELLED"
        default: "OPEN"
        constraints: "one of {OPEN, PARTIALLY_FILLED, FILLED, SUSPENDED, CLOSED, CANCELLED}"
      - name: suspended_from_status
        type: enum
        source: computed
        description: "Status held immediately before a contractor-delinquency suspension, restored on reinstatement; null unless status == SUSPENDED"
        default: null
        constraints: "null or one of {OPEN, PARTIALLY_FILLED}"

  - name: Referral
    parent: JobRequest
    common_fields: true
    fields:
      - name: job_request_id
        type: string
        source: input
        description: "FK -> JobRequest.id; the request this referral fills a slot on"
      - name: registration_id
        type: string
        source: computed
        description: "FK -> Registration.id; the out-of-work registration selected by dispatch_order_ranking or named by the contractor"
      - name: member_id
        type: string
        source: computed
        description: "FK -> Member.id; denormalized from the selected registration for record-retention lookups"
      - name: slot_kind
        type: enum
        source: input
        description: "Which headcount bucket this referral consumes"
        constraints: "one of {JOURNEYWORKER, APPRENTICE}"
      - name: referral_kind
        type: enum
        source: input
        description: "Dispatch basis; LIST_ORDER selects from the ranked candidate set, NAMED_CALL and SPECIAL_SKILL bypass or narrow it"
        constraints: "one of {LIST_ORDER, NAMED_CALL, SPECIAL_SKILL}"
      - name: variant_applied
        type: enum
        source: computed
        description: "Which dispatch_order_ranking variant produced the ranking snapshot; NOT_APPLICABLE for NAMED_CALL"
        constraints: "one of {STRICT_GROUP_ORDER, SHORT_CALL_INTERFILED, NOT_APPLICABLE}"
      - name: out_of_order_override
        type: boolean
        source: computed
        description: "true when the dispatcher supplied override_reason to dispatch a member other than rank 1; makes the referral grievable"
        default: false
      - name: override_reason
        type: string
        source: input
        description: "Dispatcher's written justification for skipping the ranked top candidate"
        default: null
      - name: issued_by_user_id
        type: string
        source: system
        description: "X-User-ID of the Dispatcher who issued this referral; compared against the adjudicating BusinessManager for segregation of duties"
      - name: issued_at
        type: datetime
        source: computed
        description: "clock at issuance"
      - name: acceptance_deadline
        type: datetime
        source: computed
        description: "issued_at + ACCEPTANCE_WINDOW_HOURS; accept/refuse allowed while clock <= acceptance_deadline"
      - name: list_position_at_issue
        type: integer
        source: computed
        description: "Snapshot of the selected Registration.position_number at issuance; null for NAMED_CALL"
      - name: refusal_good_cause_code
        type: enum
        source: input
        description: "Good cause claimed on refusal; null means the refusal carries a demotion and a strike"
        default: null
        constraints: "null or one of {MEDICAL, TEMPORARILY_EMPLOYED, OUT_OF_AREA_TRAVEL}"
      - name: status
        type: enum
        source: computed
        description: "Lifecycle state per §1.2"
        default: "ISSUED"
        constraints: "one of {ISSUED, ACCEPTED, REFUSED, EXPIRED, WITHDRAWN}"

  - name: Dispatch
    parent: Referral
    common_fields: true
    fields:
      - name: referral_id
        type: string
        source: computed
        description: "FK -> Referral.id; the accepted referral that produced this employment record"
      - name: job_request_id
        type: string
        source: computed
        description: "FK -> JobRequest.id; denormalized from the referral"
      - name: member_id
        type: string
        source: computed
        description: "FK -> Member.id; the dispatched member"
      - name: recall_of_dispatch_id
        type: string
        source: computed
        description: "FK -> Dispatch.id; set when this dispatch was created by a contractor recall instead of a list referral"
        default: null
      - name: start_at
        type: datetime
        source: computed
        description: "JobRequest.report_at for a referral acceptance; the recall endpoint's report_at for a recall dispatch"
      - name: ended_at
        type: datetime
        source: computed
        description: "clock at layoff/termination/quit; null while status == WORKING"
        default: null
      - name: hours_worked
        type: integer
        source: input
        description: "Hours reported by the contractor at layoff; 0 while WORKING"
        default: 0
      - name: layoff_reason
        type: enum
        source: input
        description: "Why the employment ended; null while status == WORKING"
        default: null
        constraints: "null or one of {REDUCTION_IN_FORCE, JOB_COMPLETE, LACK_OF_WORK, FOR_CAUSE, QUIT}"
      - name: recall_window_ends_at
        type: datetime
        source: computed
        description: "ended_at + RECALL_WINDOW_DAYS when status == LAID_OFF; null in every other status"
        default: null
      - name: status
        type: enum
        source: computed
        description: "Lifecycle state per §1.2"
        default: "WORKING"
        constraints: "one of {WORKING, LAID_OFF, TERMINATED_FOR_CAUSE, QUIT}"

  - name: Grievance
    parent: Referral
    common_fields: true
    fields:
      - name: referral_id
        type: string
        source: input
        description: "FK -> Referral.id; the challenged referral"
      - name: grievant_member_id
        type: string
        source: computed
        description: "FK -> Member.id; taken from X-User-ID of the filing Member"
      - name: claim_type
        type: enum
        source: input
        description: "Basis of the grievance"
        constraints: "one of {OUT_OF_ORDER_DISPATCH, IMPROPER_NAMED_CALL, RATIO_VIOLATION, RECORD_UNAVAILABLE}"
      - name: narrative
        type: string
        source: input
        description: "Grievant's written statement"
        constraints: "1..2000 chars"
      - name: filed_at
        type: datetime
        source: computed
        description: "clock at filing; must satisfy clock <= referral.issued_at + GRIEVANCE_FILING_WINDOW_DAYS"
      - name: decided_by_user_id
        type: string
        source: system
        description: "X-User-ID of the adjudicating BusinessManager; null until adjudication"
        default: null
      - name: decided_at
        type: datetime
        source: computed
        description: "clock at adjudication; null until adjudicated"
        default: null
      - name: remedy
        type: enum
        source: input
        description: "Remedy ordered on a SUSTAINED decision; MUST be NONE on a DENIED decision"
        default: "NONE"
        constraints: "one of {NONE, MAKE_WHOLE_HOURS, NEXT_AVAILABLE_PRIORITY}"
      - name: back_pay_variant
        type: enum
        source: computed
        description: "Which back_pay_make_whole variant was applied; NOT_APPLICABLE unless remedy == MAKE_WHOLE_HOURS"
        default: "NOT_APPLICABLE"
        constraints: "one of {ACTUAL_HOURS, SCHEDULED_HOURS, NOT_APPLICABLE}"
      - name: back_pay_hours
        type: integer
        source: computed
        description: "back_pay_make_whole hours per §1.3; 0 unless remedy == MAKE_WHOLE_HOURS"
        default: 0
      - name: back_pay_amount_cents
        type: integer
        source: computed
        description: "back_pay_make_whole cents per §1.3; 0 unless remedy == MAKE_WHOLE_HOURS"
        default: 0
      - name: status
        type: enum
        source: computed
        description: "Lifecycle state per §1.2"
        default: "FILED"
        constraints: "one of {FILED, UNDER_REVIEW, SUSTAINED, DENIED}"

  - name: DispatchLedgerEntry
    parent: null
    common_fields: false
    fields:
      - name: event_code
        type: enum
        source: system
        description: "Which dispatch event this row retains"
        constraints: "one of {REGISTRATION_CREATED, REGISTRATION_RENEWED, REGISTRATION_REMOVED, REGISTRATION_EXPIRED, REFERRAL_ISSUED, REFERRAL_ACCEPTED, REFERRAL_REFUSED, REFERRAL_EXPIRED, REFERRAL_WITHDRAWN, DISPATCH_LAID_OFF, DISPATCH_RECALLED, GRIEVANCE_DECIDED, MAKE_WHOLE_CREDITED, POSITION_RESTORED}"
      - name: referral_id
        type: string
        source: system
        description: "FK -> Referral.id; null on registration-only and renewal events"
        default: null
      - name: member_id
        type: string
        source: system
        description: "FK -> Member.id; the member the retained record is about"
      - name: recorded_at
        type: datetime
        source: system
        description: "clock at the moment the event fired"
      - name: retention_until
        type: datetime
        source: computed
        description: "recorded_at + RETENTION_DAYS; the sweep purges the snapshot once clock > retention_until"
      - name: purge_state
        type: enum
        source: computed
        description: "RETAINED until the sweep purges the row's snapshot, then PURGED"
        default: "RETAINED"
        constraints: "one of {RETAINED, PURGED}"
      - name: snapshot_json
        type: object
        source: system
        description: "Ranked candidate snapshot and decision inputs at event time; set to null when purge_state flips to PURGED"
        default: null
      - name: hours_delta
        type: integer
        source: system
        description: "Hours credited to the member by this event; non-zero only on MAKE_WHOLE_CREDITED rows"
        default: 0

  - name: RatioPolicy
    parent: null
    common_fields: true
    fields:
      - name: policy_code
        type: string
        source: input
        description: "Human handle for the apprentice-ratio schedule in the agreement"
        constraints: "1..40 chars"
      - name: first_apprentice_at_jw_count
        type: integer
        source: input
        description: "Accepted journeyworker count at which the first apprentice becomes allowed"
        constraints: "1..10"
      - name: then_every_n_jw
        type: integer
        source: input
        description: "Additional accepted journeyworkers required per further apprentice"
        constraints: "1..10"
      - name: effective_from
        type: datetime
        source: input
        description: "Instant from which this schedule may be selected"
      - name: status
        type: enum
        source: computed
        description: "ACTIVE on creation; flipped to SUPERSEDED when a newer policy is created"
        default: "ACTIVE"
        constraints: "one of {ACTIVE, SUPERSEDED}"

# ---------------------------------------------------------------------------
# §1.2 State Machine Table
# ---------------------------------------------------------------------------
state_machines:
  - entity: Registration
    initial_state: REGISTERED
    terminal_states: [DISPATCHED_OUT, REMOVED, EXPIRED]
    transitions:
      - transition_id: reg_registered_to_referred
        from: REGISTERED
        to: REFERRED
        trigger: "POST /hiring-hall/job-requests/{id}/referrals"
        actor: Dispatcher
        preconditions:
          - "Registration.status == REGISTERED"
          - "Member.dispatch_eligible == true (standing == GOOD_STANDING AND (re_registration_eligible_at IS NULL OR clock >= re_registration_eligible_at))"
          - "Member.classification == JOURNEYWORKER when slot_kind == JOURNEYWORKER, == APPRENTICE when slot_kind == APPRENTICE"
          - "No Referral exists with this registration_id, status == ISSUED and acceptance_deadline >= clock"
          - "No Dispatch exists with this member_id and status == WORKING"
          - "JobRequest.status IN {OPEN, PARTIALLY_FILLED}"
          - "The requested slot bucket still has an open slot: open_journeyworker_slots >= 1 when slot_kind == JOURNEYWORKER, open_apprentice_slots >= 1 when slot_kind == APPRENTICE (slots are reserved at issuance, not at acceptance)"
        side_effects:
          - "Creates Referral in status ISSUED with issued_at = clock, acceptance_deadline = issued_at + ACCEPTANCE_WINDOW_HOURS, issued_by_user_id = X-User-ID, list_position_at_issue = this Registration.position_number"
          - "Registration.position_number becomes null and every remaining status == REGISTERED Registration on the same list is renumbered 1..registered_count under the strict_group_order intra-list key"
          - "OutOfWorkList.registered_count decremented by 1"
          - "JobRequest.open_journeyworker_slots / open_apprentice_slots recomputed; JobRequest.version incremented by 1"
          - "Appends DispatchLedgerEntry event_code = REFERRAL_ISSUED with snapshot_json holding the full ranked candidate list, variant_applied and override_reason"
        note: "For referral_kind == LIST_ORDER the registration is chosen by dispatch_order_ranking; for NAMED_CALL it is the registration of the named member; for SPECIAL_SKILL it is the top-ranked endorsed candidate."

      - transition_id: reg_referred_to_dispatched_out
        from: REFERRED
        to: DISPATCHED_OUT
        trigger: "POST /hiring-hall/referrals/{id}/accept"
        actor: Member
        preconditions:
          - "Referral.status == ISSUED"
          - "clock <= Referral.acceptance_deadline"
          - "X-User-ID == Referral.member_id"
          - "No Dispatch of this member has an interval [start_at, ended_at) (or [start_at, +inf) while WORKING) containing JobRequest.report_at"
          - "For slot_kind == APPRENTICE: count(Referral WHERE job_request_id == this AND slot_kind == APPRENTICE AND status == ACCEPTED) + 1 <= min(JobRequest.max_apprentices_allowed, JobRequest.apprentices_requested)"
        side_effects:
          - "Referral.status becomes ACCEPTED"
          - "Creates Dispatch in status WORKING with start_at = JobRequest.report_at, hours_worked = 0, recall_window_ends_at = null"
          - "Registration.priority_flag becomes false (a NEXT_AVAILABLE_PRIORITY remedy is consumed by the accepted referral)"
          - "JobRequest.accepted_journeyworker_count / accepted_apprentice_count / max_apprentices_allowed recomputed; JobRequest.version incremented by 1"
          - "JobRequest.status recomputed from acceptance counts (OPEN -> PARTIALLY_FILLED -> FILLED)"
          - "Appends DispatchLedgerEntry event_code = REFERRAL_ACCEPTED"

      - transition_id: reg_referred_to_registered_good_cause
        from: REFERRED
        to: REGISTERED
        trigger: "POST /hiring-hall/referrals/{id}/refuse with refusal_good_cause_code != null"
        actor: Member
        preconditions:
          - "Referral.status == ISSUED"
          - "clock <= Referral.acceptance_deadline"
          - "X-User-ID == Referral.member_id"
        side_effects:
          - "Referral.status becomes REFUSED with refusal_good_cause_code recorded"
          - "Registration.registered_at, credited_seniority_hours, demotion_count and priority_flag are all left UNCHANGED"
          - "Registration.position_number recomputed; the list is renumbered so the registration reoccupies the ordinal it held at issuance"
          - "OutOfWorkList.registered_count incremented by 1"
          - "JobRequest open slots recomputed; JobRequest.version incremented by 1"
          - "Appends DispatchLedgerEntry event_code = REFERRAL_REFUSED with snapshot_json.good_cause = true, hours_delta = 0"
        note: "Good cause and every SHORT_CALL refusal are strike-free and demotion-free."

      - transition_id: reg_referred_to_registered_demoted
        from: REFERRED
        to: REGISTERED
        trigger: "POST /hiring-hall/referrals/{id}/refuse with refusal_good_cause_code == null, when effective_refusal_strikes after this refusal < REFUSALS_BEFORE_REMOVAL"
        actor: Member
        preconditions:
          - "Referral.status == ISSUED"
          - "clock <= Referral.acceptance_deadline"
          - "X-User-ID == Referral.member_id"
          - "effective_refusal_strikes (per §1.3) counted after this refusal is recorded is 1 or 2"
        side_effects:
          - "Referral.status becomes REFUSED with refusal_good_cause_code = null"
          - "Registration.demotion_count incremented by 1, which ranks the registration behind every peer on its list with a lower demotion_count"
          - "Registration.position_number and every peer position_number on the list recomputed"
          - "JobRequest open slots recomputed; JobRequest.version incremented by 1"
          - "Appends DispatchLedgerEntry event_code = REFERRAL_REFUSED with snapshot_json.good_cause = false"
        note: "Only LONG_CALL referrals feed effective_refusal_strikes; a SHORT_CALL no-cause refusal still increments demotion_count."

      - transition_id: reg_referred_to_removed_three_strikes
        from: REFERRED
        to: REMOVED
        trigger: "POST /hiring-hall/referrals/{id}/refuse with refusal_good_cause_code == null, when effective_refusal_strikes after this refusal == REFUSALS_BEFORE_REMOVAL"
        actor: Member
        preconditions:
          - "Referral.status == ISSUED"
          - "clock <= Referral.acceptance_deadline"
          - "X-User-ID == Referral.member_id"
          - "effective_refusal_strikes (per §1.3) counted after this refusal is recorded == REFUSALS_BEFORE_REMOVAL"
        side_effects:
          - "CASCADE HOP 1: Referral.status becomes REFUSED with refusal_good_cause_code = null"
          - "CASCADE HOP 2: because that referral became a third no-cause refusal in the window, Registration.demotion_count is incremented and Registration.status becomes REMOVED with removal_reason = THREE_REFUSALS and position_number = null"
          - "CASCADE HOP 3: because that Registration was removed, Member.re_registration_eligible_at becomes clock + REREGISTRATION_COOLDOWN_DAYS and OutOfWorkList.registered_count is decremented"
          - "CASCADE HOP 4: because Member.re_registration_eligible_at is now in the future, Member.dispatch_eligible becomes false, which removes the member from every candidate set computed by dispatch_order_ranking"
          - "JobRequest open slots recomputed; JobRequest.version incremented by 1"
          - "Appends DispatchLedgerEntry event_code = REFERRAL_REFUSED then DispatchLedgerEntry event_code = REGISTRATION_REMOVED (recorded in that order, both with recorded_at = clock)"

      - transition_id: reg_referred_to_registered_withdrawn
        from: REFERRED
        to: REGISTERED
        trigger: "POST /hiring-hall/referrals/{id}/withdraw, or the cascade from PATCH /hiring-hall/contractors/{id}/signatory-status to DELINQUENT_TRUST_FUNDS, or the cascade from PATCH /hiring-hall/members/{id}/standing to DELINQUENT"
        actor: Dispatcher
        preconditions:
          - "Referral.status == ISSUED"
        side_effects:
          - "Referral.status becomes WITHDRAWN"
          - "Registration.registered_at, credited_seniority_hours, demotion_count and priority_flag are all left UNCHANGED — the registration reoccupies its pre-referral ordinal"
          - "Registration.position_number and every peer position_number on the list recomputed; OutOfWorkList.registered_count incremented by 1"
          - "JobRequest open slots recomputed; JobRequest.version incremented by 1"
          - "Appends DispatchLedgerEntry event_code = REFERRAL_WITHDRAWN then DispatchLedgerEntry event_code = POSITION_RESTORED"

      - transition_id: reg_referred_to_registered_sweep_expiry
        from: REFERRED
        to: REGISTERED
        trigger: "POST /hiring-hall/dispatch-runs — sweep step 1, for each Referral with status == ISSUED and clock > acceptance_deadline, when effective_refusal_strikes after the expiry < REFUSALS_BEFORE_REMOVAL"
        actor: system
        preconditions:
          - "Referral.status == ISSUED"
          - "clock > Referral.acceptance_deadline (strictly greater; equality does NOT expire)"
        side_effects:
          - "Referral.status becomes EXPIRED"
          - "Registration.demotion_count incremented by 1 — an unanswered referral is charged exactly like a no-cause refusal"
          - "Registration.position_number and peers recomputed; OutOfWorkList.registered_count incremented by 1"
          - "JobRequest open slots recomputed; JobRequest.version incremented by 1"
          - "Appends DispatchLedgerEntry event_code = REFERRAL_EXPIRED"

      - transition_id: reg_referred_to_removed_sweep_three_strikes
        from: REFERRED
        to: REMOVED
        trigger: "POST /hiring-hall/dispatch-runs — sweep step 1, when effective_refusal_strikes after the expiry == REFUSALS_BEFORE_REMOVAL"
        actor: system
        preconditions:
          - "Referral.status == ISSUED"
          - "clock > Referral.acceptance_deadline"
          - "effective_refusal_strikes counted after this expiry == REFUSALS_BEFORE_REMOVAL"
        side_effects:
          - "Same four-hop cascade as reg_referred_to_removed_three_strikes, with Referral.status becoming EXPIRED instead of REFUSED"
          - "Appends DispatchLedgerEntry event_code = REFERRAL_EXPIRED then DispatchLedgerEntry event_code = REGISTRATION_REMOVED"

      - transition_id: reg_registered_to_registered_renewed
        from: REGISTERED
        to: REGISTERED
        trigger: "POST /hiring-hall/registrations/{id}/renew"
        actor: Member
        preconditions:
          - "Registration.status == REGISTERED"
          - "X-User-ID == Registration.member_id when acting as Member"
        side_effects:
          - "Registration.last_renewed_at becomes clock and renewal_due_at becomes clock + RESIGN_INTERVAL_DAYS"
          - "Registration.registered_at, credited_seniority_hours, demotion_count, priority_flag and position_number are all left UNCHANGED — a monthly re-sign never moves a member on the list"
          - "Appends DispatchLedgerEntry event_code = REGISTRATION_RENEWED"

      - transition_id: reg_registered_to_removed_manual
        from: REGISTERED
        to: REMOVED
        trigger: "POST /hiring-hall/registrations/{id}/remove"
        actor: Dispatcher
        preconditions:
          - "Registration.status == REGISTERED"
        side_effects:
          - "Registration.status becomes REMOVED with removal_reason = ADMINISTRATIVE and position_number = null"
          - "Every remaining status == REGISTERED Registration on the list is renumbered; OutOfWorkList.registered_count decremented"
          - "Appends DispatchLedgerEntry event_code = REGISTRATION_REMOVED"

      - transition_id: reg_registered_to_expired_sweep
        from: REGISTERED
        to: EXPIRED
        trigger: "POST /hiring-hall/dispatch-runs — sweep step 2, for each Registration with status == REGISTERED and clock > renewal_due_at, processed in renewal_due_at ASC then created_at ASC order"
        actor: system
        preconditions:
          - "Registration.status == REGISTERED"
          - "clock > Registration.renewal_due_at (strictly greater)"
        side_effects:
          - "Registration.status becomes EXPIRED with removal_reason = RENEWAL_LAPSED and position_number = null"
          - "Every remaining status == REGISTERED Registration on the list is renumbered; OutOfWorkList.registered_count decremented"
          - "Appends DispatchLedgerEntry event_code = REGISTRATION_EXPIRED"
        note: "Sweep step 1 runs before step 2, so a registration returned to REGISTERED by a referral expiry in the same run is itself eligible for renewal expiry within that same run."

  - entity: JobRequest
    initial_state: OPEN
    terminal_states: [CLOSED, CANCELLED]
    transitions:
      - transition_id: jr_open_to_partially_filled
        from: OPEN
        to: PARTIALLY_FILLED
        trigger: "POST /hiring-hall/referrals/{id}/accept"
        actor: Member
        preconditions:
          - "JobRequest.status == OPEN"
          - "0 < accepted_journeyworker_count + accepted_apprentice_count < journeyworkers_requested + apprentices_requested after this acceptance"
        side_effects:
          - "Acceptance counters and open slot counters recomputed; version incremented by 1"

      - transition_id: jr_open_to_filled
        from: OPEN
        to: FILLED
        trigger: "POST /hiring-hall/referrals/{id}/accept"
        actor: Member
        preconditions:
          - "JobRequest.status == OPEN"
          - "accepted_journeyworker_count + accepted_apprentice_count == journeyworkers_requested + apprentices_requested after this acceptance"
        side_effects:
          - "Acceptance counters and open slot counters recomputed; version incremented by 1"

      - transition_id: jr_partially_filled_to_filled
        from: PARTIALLY_FILLED
        to: FILLED
        trigger: "POST /hiring-hall/referrals/{id}/accept"
        actor: Member
        preconditions:
          - "JobRequest.status == PARTIALLY_FILLED"
          - "accepted_journeyworker_count + accepted_apprentice_count == journeyworkers_requested + apprentices_requested after this acceptance"
        side_effects:
          - "Acceptance counters and open slot counters recomputed; version incremented by 1"

      - transition_id: jr_open_to_suspended
        from: OPEN
        to: SUSPENDED
        trigger: "PATCH /hiring-hall/contractors/{id}/signatory-status to DELINQUENT_TRUST_FUNDS or TERMINATED"
        actor: HallAdmin
        preconditions:
          - "JobRequest.status == OPEN"
          - "JobRequest.contractor_id == the patched Contractor.id"
        side_effects:
          - "CASCADE HOP 2 of the delinquency cascade: JobRequest.status becomes SUSPENDED and suspended_from_status records OPEN; version incremented by 1"
          - "CASCADE HOP 3: because the request is SUSPENDED, every Referral of this request with status == ISSUED becomes WITHDRAWN, processed in acceptance_deadline ASC then created_at ASC order"
          - "CASCADE HOP 4: because those referrals were withdrawn, each linked Registration returns REFERRED -> REGISTERED with registered_at, demotion_count and priority_flag unchanged, then the affected lists are renumbered"

      - transition_id: jr_partially_filled_to_suspended
        from: PARTIALLY_FILLED
        to: SUSPENDED
        trigger: "PATCH /hiring-hall/contractors/{id}/signatory-status to DELINQUENT_TRUST_FUNDS or TERMINATED"
        actor: HallAdmin
        preconditions:
          - "JobRequest.status == PARTIALLY_FILLED"
        side_effects:
          - "Identical cascade to jr_open_to_suspended, with suspended_from_status = PARTIALLY_FILLED; already ACCEPTED referrals and their Dispatches are untouched"

      - transition_id: jr_suspended_to_open
        from: SUSPENDED
        to: OPEN
        trigger: "PATCH /hiring-hall/contractors/{id}/signatory-status back to SIGNATORY"
        actor: HallAdmin
        preconditions:
          - "JobRequest.status == SUSPENDED"
          - "JobRequest.suspended_from_status == OPEN"
        side_effects:
          - "JobRequest.status becomes OPEN, suspended_from_status becomes null, open slot counters recomputed, version incremented by 1"
          - "Withdrawn referrals are NOT reissued; the reopened slots must be re-dispatched from the list"

      - transition_id: jr_suspended_to_partially_filled
        from: SUSPENDED
        to: PARTIALLY_FILLED
        trigger: "PATCH /hiring-hall/contractors/{id}/signatory-status back to SIGNATORY"
        actor: HallAdmin
        preconditions:
          - "JobRequest.status == SUSPENDED"
          - "JobRequest.suspended_from_status == PARTIALLY_FILLED"
        side_effects:
          - "JobRequest.status becomes PARTIALLY_FILLED, suspended_from_status becomes null, version incremented by 1"

      - transition_id: jr_filled_to_closed
        from: FILLED
        to: CLOSED
        trigger: "system, evaluated after every Dispatch status change on this request"
        actor: system
        preconditions:
          - "JobRequest.status == FILLED"
          - "Every Dispatch with this job_request_id has status != WORKING"
        side_effects:
          - "JobRequest.status becomes CLOSED; version incremented by 1"
        note: "Compound bubble-up: the parent's terminal state is derived from the aggregate state of its Dispatch children."

      - transition_id: jr_cancel
        from: OPEN
        to: CANCELLED
        trigger: "POST /hiring-hall/job-requests/{id}/cancel"
        actor: ContractorRep
        preconditions:
          - "JobRequest.status IN {OPEN, PARTIALLY_FILLED, SUSPENDED}"
          - "X-User-ID == JobRequest.contractor_id when acting as ContractorRep"
        side_effects:
          - "JobRequest.status becomes CANCELLED; version incremented by 1"
          - "Every Referral of this request with status == ISSUED becomes WITHDRAWN and each linked Registration returns to REGISTERED with position restored (same hops as jr_open_to_suspended hops 3 and 4)"
        note: "PARTIALLY_FILLED and SUSPENDED are also valid from-states for this trigger."

  - entity: Referral
    initial_state: ISSUED
    terminal_states: [ACCEPTED, REFUSED, EXPIRED, WITHDRAWN]
    transitions:
      - transition_id: ref_issued_to_accepted
        from: ISSUED
        to: ACCEPTED
        trigger: "POST /hiring-hall/referrals/{id}/accept"
        actor: Member
        preconditions:
          - "Referral.status == ISSUED"
          - "clock <= acceptance_deadline"
          - "X-User-ID == Referral.member_id"
          - "JobRequest.status IN {OPEN, PARTIALLY_FILLED}"
          - "The apprentice ratio cap admits one more accepted apprentice when slot_kind == APPRENTICE"
        side_effects:
          - "Creates the Dispatch and drives reg_referred_to_dispatched_out"
      - transition_id: ref_issued_to_refused
        from: ISSUED
        to: REFUSED
        trigger: "POST /hiring-hall/referrals/{id}/refuse"
        actor: Member
        preconditions:
          - "Referral.status == ISSUED"
          - "clock <= acceptance_deadline"
          - "X-User-ID == Referral.member_id"
        side_effects:
          - "Drives one of reg_referred_to_registered_good_cause / reg_referred_to_registered_demoted / reg_referred_to_removed_three_strikes"
      - transition_id: ref_issued_to_expired
        from: ISSUED
        to: EXPIRED
        trigger: "POST /hiring-hall/dispatch-runs — sweep step 1"
        actor: system
        preconditions:
          - "clock > acceptance_deadline"
        side_effects:
          - "Drives reg_referred_to_registered_sweep_expiry or reg_referred_to_removed_sweep_three_strikes"
      - transition_id: ref_issued_to_withdrawn
        from: ISSUED
        to: WITHDRAWN
        trigger: "POST /hiring-hall/referrals/{id}/withdraw, or the contractor-delinquency / member-delinquency / job-request-cancel cascades"
        actor: Dispatcher
        preconditions:
          - "Referral.status == ISSUED"
        side_effects:
          - "Drives reg_referred_to_registered_withdrawn"

  - entity: Dispatch
    initial_state: WORKING
    terminal_states: [LAID_OFF, TERMINATED_FOR_CAUSE, QUIT]
    transitions:
      - transition_id: dsp_working_to_laid_off
        from: WORKING
        to: LAID_OFF
        trigger: "POST /hiring-hall/dispatches/{id}/layoff with layoff_reason IN {REDUCTION_IN_FORCE, JOB_COMPLETE, LACK_OF_WORK}"
        actor: ContractorRep
        preconditions:
          - "Dispatch.status == WORKING"
          - "X-User-ID == the JobRequest.contractor_id of this dispatch"
          - "hours_worked <= 12 * ceil((clock - start_at) / 24h)"
        side_effects:
          - "Dispatch.status becomes LAID_OFF, ended_at = clock, hours_worked recorded, recall_window_ends_at = clock + RECALL_WINDOW_DAYS"
          - "Enables a position-preserving re-registration for LAYOFF_REREG_WINDOW_DAYS after ended_at"
          - "Appends DispatchLedgerEntry event_code = DISPATCH_LAID_OFF"
          - "Re-evaluates jr_filled_to_closed on the parent JobRequest"
      - transition_id: dsp_working_to_terminated_for_cause
        from: WORKING
        to: TERMINATED_FOR_CAUSE
        trigger: "POST /hiring-hall/dispatches/{id}/layoff with layoff_reason == FOR_CAUSE"
        actor: ContractorRep
        preconditions:
          - "Dispatch.status == WORKING"
          - "X-User-ID == the JobRequest.contractor_id of this dispatch"
          - "hours_worked <= 12 * ceil((clock - start_at) / 24h)"
        side_effects:
          - "Dispatch.status becomes TERMINATED_FOR_CAUSE, ended_at = clock, recall_window_ends_at stays null"
          - "No recall is possible and no position-preserving re-registration is available — a later claim_position_preservation is rejected"
          - "Appends DispatchLedgerEntry event_code = DISPATCH_LAID_OFF with snapshot_json.layoff_reason = FOR_CAUSE"
          - "Re-evaluates jr_filled_to_closed on the parent JobRequest"
      - transition_id: dsp_working_to_quit
        from: WORKING
        to: QUIT
        trigger: "POST /hiring-hall/dispatches/{id}/layoff with layoff_reason == QUIT"
        actor: ContractorRep
        preconditions:
          - "Dispatch.status == WORKING"
          - "X-User-ID == the JobRequest.contractor_id of this dispatch"
        side_effects:
          - "Dispatch.status becomes QUIT, ended_at = clock, recall_window_ends_at stays null"
          - "No recall and no position preservation, identical to TERMINATED_FOR_CAUSE"
          - "Appends DispatchLedgerEntry event_code = DISPATCH_LAID_OFF with snapshot_json.layoff_reason = QUIT"
      - transition_id: dsp_laid_off_recall
        from: LAID_OFF
        to: LAID_OFF
        trigger: "POST /hiring-hall/dispatches/{id}/recall"
        actor: ContractorRep
        preconditions:
          - "Dispatch.status == LAID_OFF"
          - "clock <= Dispatch.recall_window_ends_at (inclusive on both ends of [ended_at, recall_window_ends_at])"
          - "X-User-ID == the JobRequest.contractor_id of this dispatch"
          - "The member has no Dispatch with status == WORKING"
        side_effects:
          - "This row stays LAID_OFF; a NEW Dispatch is created in status WORKING with recall_of_dispatch_id = this Dispatch.id, start_at = the supplied report_at and the same job_request_id/member_id"
          - "If the member holds a Registration with status == REGISTERED it becomes DISPATCHED_OUT and its list is renumbered"
          - "Appends DispatchLedgerEntry event_code = DISPATCH_RECALLED"
        note: "A recall bypasses the out-of-work lists entirely, which is why the recall window is short and closed at both ends."

  - entity: Grievance
    initial_state: FILED
    terminal_states: [SUSTAINED, DENIED]
    transitions:
      - transition_id: grv_filed_to_under_review
        from: FILED
        to: UNDER_REVIEW
        trigger: "POST /hiring-hall/grievances/{id}/review"
        actor: BusinessManager
        preconditions:
          - "Grievance.status == FILED"
        side_effects:
          - "Grievance.status becomes UNDER_REVIEW; version incremented by 1"
      - transition_id: grv_under_review_to_sustained
        from: UNDER_REVIEW
        to: SUSTAINED
        trigger: "POST /hiring-hall/grievances/{id}/adjudicate with decision == SUSTAINED"
        actor: BusinessManager
        preconditions:
          - "Grievance.status == UNDER_REVIEW"
          - "X-User-ID != the challenged Referral.issued_by_user_id"
          - "For claim_type == OUT_OF_ORDER_DISPATCH: the REFERRAL_ISSUED DispatchLedgerEntry of the challenged referral has purge_state == RETAINED"
          - "For remedy == MAKE_WHOLE_HOURS: a Dispatch exists for the challenged referral"
        side_effects:
          - "BRANCH SUSTAINED: Grievance.status becomes SUSTAINED, decided_by_user_id = X-User-ID, decided_at = clock"
          - "When remedy == MAKE_WHOLE_HOURS: back_pay_variant, back_pay_hours and back_pay_amount_cents are computed by back_pay_make_whole and a DispatchLedgerEntry event_code = MAKE_WHOLE_CREDITED is appended with hours_delta = back_pay_hours"
          - "When remedy == NEXT_AVAILABLE_PRIORITY: the grievant's Registration with status == REGISTERED gets priority_flag = true, its list is renumbered so that registration holds position_number 1, and a DispatchLedgerEntry event_code = POSITION_RESTORED is appended"
          - "Appends DispatchLedgerEntry event_code = GRIEVANCE_DECIDED (recorded after the remedy entry)"
      - transition_id: grv_under_review_to_denied
        from: UNDER_REVIEW
        to: DENIED
        trigger: "POST /hiring-hall/grievances/{id}/adjudicate with decision == DENIED"
        actor: BusinessManager
        preconditions:
          - "Grievance.status == UNDER_REVIEW"
          - "X-User-ID != the challenged Referral.issued_by_user_id"
          - "remedy == NONE"
        side_effects:
          - "BRANCH DENIED: Grievance.status becomes DENIED, decided_by_user_id = X-User-ID, decided_at = clock, back_pay_variant stays NOT_APPLICABLE, back_pay_hours and back_pay_amount_cents stay 0"
          - "No Registration, Referral or Dispatch field changes anywhere — the denial branch is side-effect free apart from the ledger"
          - "Appends DispatchLedgerEntry event_code = GRIEVANCE_DECIDED"

# ---------------------------------------------------------------------------
# §1.2.1 Concurrency Rules
# ---------------------------------------------------------------------------
concurrency_rules:
  - rule_id: referral-issue-stale-job-request
    parent_entity: JobRequest
    write_endpoint: "POST /hiring-hall/job-requests/{id}/referrals"
    occ_field: "expected_job_request_version"
    description: |
      Issuing a referral against a JobRequest whose version has advanced since the dispatcher
      last read it is rejected. A referral issuance is legitimately repeatable while slots
      remain open — the second issuance is not blocked by any state precondition — so the
      dispatcher's view of how many slots are still open, which apprentice ratio cap applies
      and which referrals are already outstanding must be pinned to the version observed.
    error_id: ERR_STALE_JOB_REQUEST_VERSION
    http_status: 412

# ---------------------------------------------------------------------------
# §1.3 Calculation Rules Table
# ---------------------------------------------------------------------------
calculations:
  - name: dispatch_order_ranking
    trigger: "GET /hiring-hall/job-requests/{id}/dispatch-order, and on every POST /hiring-hall/job-requests/{id}/referrals with referral_kind IN {LIST_ORDER, SPECIAL_SKILL} (drives reg_registered_to_referred and the snapshot in the REFERRAL_ISSUED ledger entry)"
    algorithm: chronological
    formula: |
      # ---- (1) eligibility filter: the candidate set, as an explicit predicate ----
      candidates(job_request J, slot_kind K, referral_kind RK) =
        { Registration R :
              R.status == REGISTERED
          AND R.member.classification == (K == JOURNEYWORKER ? JOURNEYWORKER : APPRENTICE)
          AND R.member.standing == GOOD_STANDING
          AND (R.member.re_registration_eligible_at IS NULL OR clock >= R.member.re_registration_eligible_at)
          AND NOT EXISTS (Referral F : F.registration_id == R.id
                                   AND F.status == ISSUED
                                   AND F.acceptance_deadline >= clock)
          AND NOT EXISTS (Dispatch D : D.member_id == R.member_id AND D.status == WORKING)
          AND (RK != SPECIAL_SKILL OR EXISTS (SkillEndorsement E :
                    E.member_id == R.member_id
                AND E.skill_code == J.required_skill_code
                AND E.verified == true
                AND E.certified_until > clock)) }

      # ---- (2) ranking expression: variant-dependent sort key, ASC on every component ----
      key_strict_group_order(R) = ( R.list.priority_rank ASC,
                                    R.priority_flag DESC,          # true sorts before false
                                    R.demotion_count ASC,
                                    R.list.ordering_policy == SENIORITY
                                        ? R.credited_seniority_hours DESC
                                        : R.registered_at ASC,
                                    R.registered_at ASC,           # (3) tie-break
                                    R.created_at ASC )             # (3) final tie-break, never id

      key_short_call_interfiled(R) = ( R.priority_flag DESC,
                                       R.demotion_count ASC,
                                       R.registered_at ASC,        # every group interfiled
                                       R.created_at ASC )

      # ---- (4) empty candidate set ----
      IF candidates == {} THEN raise ERR_NO_ELIGIBLE_REGISTRANT
      rank 1 == the first element under the applicable key; position ordinals are 1-based.
    input_set: "Registrations with status == REGISTERED only; REFERRED, DISPATCHED_OUT, REMOVED and EXPIRED rows are excluded. Members with standing == DELINQUENT or with an unexpired re_registration_eligible_at are excluded. NAMED_CALL referrals do not consult this ranking at all (variant_applied == NOT_APPLICABLE)."
    constants:
      TRUE_SORTS_BEFORE_FALSE: true
    precision: "integer ordinals; no rounding. All datetime comparisons are exact to milliseconds (three fractional digits)."
    variants:
      - name: strict_group_order
        when: "JobRequest.duration_type == LONG_CALL"
        difference: "List group is the outermost sort component, so every eligible GROUP_1 registrant outranks every GROUP_4 (traveler) registrant regardless of registration time, and the intra-group order follows that group's own ordering_policy."
      - name: short_call_interfiled
        when: "JobRequest.duration_type == SHORT_CALL"
        difference: "List group and ordering_policy are both ignored: all groups are interfiled and ranked purely by registered_at ASC, so a traveler on GROUP_4 who signed the book earlier outranks a high-seniority GROUP_1 local. Identical registration data therefore yields a different rank-1 registration under the two variants."

  - name: named_call_and_skill_allowance
    trigger: "POST /hiring-hall/job-requests (computes JobRequest.named_call_allowance and JobRequest.special_skill_allowance, then gates intake)"
    algorithm: threshold
    formula: |
      total_requested = journeyworkers_requested + apprentices_requested

      named_call_allowance =
        IF duration_type == SHORT_CALL THEN 0
        ELSE min(NAMED_CALL_HARD_CAP, max(1, floor(total_requested / NAMED_CALL_DIVISOR)))

      special_skill_allowance =
        IF required_skill_code IS NULL THEN 0
        ELSE min(journeyworkers_requested,
                 floor(journeyworkers_requested * SPECIAL_SKILL_SHARE_BP / 10000)
                 + (journeyworkers_requested MOD 2))      # == ceil(jw / 2) when share is 5000 bp

      # intake gates, evaluated in this order
      IF len(named_call_member_ids) > named_call_allowance      -> ERR_NAMED_CALL_ALLOWANCE_EXCEEDED
      IF special_skill_slots_requested > special_skill_allowance -> ERR_SPECIAL_SKILL_ALLOWANCE_EXCEEDED
    input_set: "Only the request's own input fields plus its computed duration_type; no other entity participates. Recomputed never — the two allowances are frozen at intake so a later agreement change cannot retroactively legalize a named call."
    constants:
      NAMED_CALL_DIVISOR: 5
      NAMED_CALL_HARD_CAP: 4
      SPECIAL_SKILL_SHARE_BP: 5000
    precision: "integer counts; floor on every division; MOD 2 correction supplies the ceiling behaviour"
    variants: []

  - name: traveler_credited_seniority_hours
    trigger: "POST /hiring-hall/registrations (computes Registration.credited_seniority_hours, which is the SENIORITY sort key in dispatch_order_ranking)"
    algorithm: aggregation
    formula: |
      # PINNED ROUNDING ORDER: round each reciprocity entry to whole hours FIRST, then sum.
      # The alternative order (sum the raw products, then round once) is explicitly NOT used
      # and produces a different integer whenever two or more entries land on a .5 boundary.
      credited_seniority_hours =
          member.local_hours_in_trade
        + SUM over entries e of reciprocity_credits, in the order supplied in the request array, of
              round_half_up( e.raw_hours * Local[e.sister_local_id].reciprocity_factor_bp / 10000 )

      # eligibility of each entry
      FOR EACH e: Local[e.sister_local_id].kind MUST be SISTER
                  AND Local[e.sister_local_id].reciprocity_factor_bp > 0
                  ELSE ERR_TRAVELER_NOT_RECIPROCAL
    input_set: "Member.local_hours_in_trade (hours under the HOME local's agreement, always credited at 100%) plus every entry of the request's reciprocity_credits array. A non-traveler member may pass an empty array, in which case credited_seniority_hours == local_hours_in_trade."
    constants:
      BASIS_POINT_SCALE: 10000
    precision: "whole hours, round_half_up, applied per array entry BEFORE summation"
    variants: []

  - name: apprentice_ratio_cap
    trigger: "POST /hiring-hall/job-requests/{id}/referrals with slot_kind == APPRENTICE, and POST /hiring-hall/referrals/{id}/accept for an apprentice slot (maintains JobRequest.max_apprentices_allowed)"
    algorithm: threshold
    formula: |
      # STEP 1 — the applicable schedule (selector over RatioPolicy)
      policy = the RatioPolicy with status == ACTIVE AND effective_from <= clock,
               ranked effective_from DESC, tie-break created_at ASC, first row wins.
      IF no such row -> ERR_NO_ACTIVE_RATIO_POLICY

      # STEP 2 — the cap, from ACCEPTED journeyworker referrals ONLY
      jw_accepted = count(Referral WHERE job_request_id == J.id
                                    AND slot_kind == JOURNEYWORKER
                                    AND status == ACCEPTED)
      max_apprentices_allowed =
        IF jw_accepted == 0 THEN 0
        ELSE 1 + floor( max(0, jw_accepted - policy.first_apprentice_at_jw_count)
                        / policy.then_every_n_jw )

      # STEP 3 — the consumption test, which DOES count merely-outstanding apprentices
      apprentices_committed = count(Referral WHERE job_request_id == J.id
                                              AND slot_kind == APPRENTICE
                                              AND status IN {ISSUED, ACCEPTED})
      IF apprentices_committed + 1 > min(max_apprentices_allowed, J.apprentices_requested)
        -> ERR_APPRENTICE_RATIO_EXCEEDED
    input_set: |
      Deliberately asymmetric, and the asymmetry is the rule: STEP 2 counts journeyworker
      referrals in status ACCEPTED only (an ISSUED journeyworker referral does NOT raise the
      cap), while STEP 3 counts apprentice referrals in status ISSUED or ACCEPTED (an
      outstanding apprentice referral DOES consume the cap). Evaluation order is fixed at
      STEP 1 -> STEP 2 -> STEP 3.
    constants:
      MIN_JW_FOR_FIRST_APPRENTICE_DEFAULT: 1
    precision: "integer counts; floor division"
    variants: []

  - name: effective_refusal_strikes
    trigger: "POST /hiring-hall/referrals/{id}/refuse and sweep step 1 of POST /hiring-hall/dispatch-runs (maintains Member.refusal_strike_count and decides between demotion and removal)"
    algorithm: aggregation
    formula: |
      effective_refusal_strikes(member M, instant clock) =
        count( Referral F :
                   F.member_id == M.id
               AND ( (F.status == REFUSED AND F.refusal_good_cause_code IS NULL)
                     OR F.status == EXPIRED )
               AND JobRequest[F.job_request_id].duration_type == LONG_CALL
               AND F.issued_at >= clock - REFUSAL_WINDOW_DAYS )   # window is closed at the left edge

      IF effective_refusal_strikes == REFUSALS_BEFORE_REMOVAL
        -> the registration is REMOVED with removal_reason = THREE_REFUSALS
           and M.re_registration_eligible_at = clock + REREGISTRATION_COOLDOWN_DAYS
      ELSE the registration returns to REGISTERED with demotion_count incremented by 1
    input_set: "Referrals of this member across ALL registrations, including registrations already terminal, so a member cannot shed strikes by re-registering. Good-cause refusals, WITHDRAWN referrals and every referral whose JobRequest.duration_type == SHORT_CALL are excluded from the count (but a SHORT_CALL no-cause refusal still increments demotion_count)."
    constants:
      REFUSAL_WINDOW_DAYS: 365
      REFUSALS_BEFORE_REMOVAL: 3
      REREGISTRATION_COOLDOWN_DAYS: 30
    precision: "integer counts; the rolling window boundary is inclusive (issued_at exactly at clock - 365 days still counts)"
    variants: []

  - name: back_pay_make_whole
    trigger: "POST /hiring-hall/grievances/{id}/adjudicate with decision == SUSTAINED and remedy == MAKE_WHOLE_HOURS (grv_under_review_to_sustained)"
    algorithm: forward_looking
    formula: |
      D = the Dispatch of the challenged Referral (Grievance.referral_id)
      IF D does not exist -> ERR_REMEDY_NOT_APPLICABLE

      classification_factor_bp(grievant) =
        grievant.classification == JOURNEYWORKER ? 10000
                                                 : APPRENTICE_RATE_FACTOR_BP[grievant.apprentice_period]

      # ---- variant selection is pinned by the improper dispatch's own status ----
      IF D.status == WORKING:                       # SCHEDULED_HOURS variant
        weekdays = count of dates d in the half-open interval
                     [ date(D.start_at), date(Grievance.decided_at) )
                   with weekday(d) IN {Mon, Tue, Wed, Thu, Fri}
        back_pay_hours = weekdays * STANDARD_DAY_HOURS
        # PINNED ROUNDING ORDER: round each scheduled day to whole cents, THEN sum the days.
        day_amount_cents = round_half_up( STANDARD_DAY_HOURS * J.hourly_rate_cents
                                          * classification_factor_bp / 10000 )
        back_pay_amount_cents = weekdays * day_amount_cents
      ELSE:                                          # ACTUAL_HOURS variant (LAID_OFF / TERMINATED_FOR_CAUSE / QUIT)
        back_pay_hours = D.hours_worked
        back_pay_amount_cents = round_half_up( D.hours_worked * J.hourly_rate_cents
                                               * classification_factor_bp / 10000 )
    input_set: "The challenged Referral's JobRequest (hourly_rate_cents, report_at) and its Dispatch (status, start_at, hours_worked), plus the grievant Member's classification and apprentice_period. Weekend dates are excluded from the scheduled projection; holidays are not modelled."
    constants:
      STANDARD_DAY_HOURS: 8
      APPRENTICE_RATE_FACTOR_BP: { 1: 5625, 2: 6875, 3: 8125, 4: 9375 }
      JOURNEYWORKER_RATE_FACTOR_BP: 10000
    precision: "whole cents, round_half_up; per-day rounding in the SCHEDULED_HOURS variant, single rounding in the ACTUAL_HOURS variant"
    variants:
      - name: scheduled_hours
        when: "the improperly dispatched worker's Dispatch.status == WORKING at adjudication"
        difference: "Hours are projected forward from the dispatch start date to the adjudication date at STANDARD_DAY_HOURS per weekday, so the award grows with how long the hall took to decide, and the money is rounded per day before summing."
      - name: actual_hours
        when: "the improperly dispatched worker's Dispatch.status != WORKING at adjudication"
        difference: "Hours are the contractor-reported Dispatch.hours_worked and the money is rounded exactly once over the whole award, so the same grievance decided after a layoff yields both fewer hours and a different cents figure than the scheduled projection would have produced."

  - name: registration_timing_windows
    trigger: "POST /hiring-hall/registrations, POST /hiring-hall/registrations/{id}/renew, POST /hiring-hall/dispatches/{id}/layoff, every DispatchLedgerEntry append, and both sweep steps of POST /hiring-hall/dispatch-runs"
    algorithm: interval_merge
    formula: |
      renewal_due_at        = last_renewed_at + RESIGN_INTERVAL_DAYS
      recall_window_ends_at = Dispatch.ended_at + RECALL_WINDOW_DAYS          # only when status == LAID_OFF
      retention_until       = DispatchLedgerEntry.recorded_at + RETENTION_DAYS

      # position preservation on re-registration after a layoff
      preservation_allowed(new_registration N with predecessor P) =
            P.member_id == N.member_id                                  # else ERR_REREGISTRATION_PREDECESSOR_MISMATCH
        AND EXISTS Dispatch D : D.referral_id IN (referrals of P) AND D.status == LAID_OFF
        AND clock <= D.ended_at + LAYOFF_REREG_WINDOW_DAYS              # else ERR_REREGISTRATION_WINDOW_EXPIRED
      IF preservation_allowed THEN N.registered_at = P.registered_at
                                   AND N.demotion_count = P.demotion_count
      ELSE                          N.registered_at = clock
                                   AND N.demotion_count = 0
      N.last_renewed_at = clock ALWAYS (never inherited)

      # interval semantics used elsewhere
      employment interval of a Dispatch = [start_at, ended_at) , or [start_at, +inf) while WORKING
        -> a new acceptance whose JobRequest.report_at == a prior dispatch's ended_at is ALLOWED (adjacency)
      outstanding-referral occupation of a Registration = [issued_at, acceptance_deadline] , capacity 1
        -> a second referral at clock == acceptance_deadline is REJECTED (closed at the right edge)
      acceptance window = clock <= acceptance_deadline is still open; expiry needs clock > acceptance_deadline
      recall window = [Dispatch.ended_at, recall_window_ends_at] , closed at both ends
      grievance filing window = clock <= Referral.issued_at + GRIEVANCE_FILING_WINDOW_DAYS
    input_set: "Per-entity timestamps only; all windows are computed from stored instants and the logical clock, never from wall-clock time."
    constants:
      ACCEPTANCE_WINDOW_HOURS: 24
      RESIGN_INTERVAL_DAYS: 30
      RECALL_WINDOW_DAYS: 7
      LAYOFF_REREG_WINDOW_DAYS: 5
      GRIEVANCE_FILING_WINDOW_DAYS: 10
      RETENTION_DAYS: 1825
      SHORT_CALL_MAX_DAYS: 5
    precision: "millisecond-exact instants, ISO 8601 UTC with three fractional digits; day arithmetic is exact 24h multiples"
    variants: []

# ---------------------------------------------------------------------------
# §1.4 Validation Rules Table (ordered by priority — lowest number wins when
# a single request violates several rows)
# ---------------------------------------------------------------------------
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are present, non-empty and X-User-Role is one of the five declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "The acting role appears in the endpoint's roles list in §1.5"
    error_id: ERR_ROLE_NOT_PERMITTED
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: business_constraint
    check: "Request body/query shape: required fields present, JSON types correct, enum members recognized, integers within declared ranges, journeyworkers_requested + apprentices_requested >= 1, apprentice_period present iff classification == APPRENTICE, limit within 1..100 and offset >= 0"
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: "all"
  - priority: 4
    category: existence
    check: "Path-templated resources exist, validated left to right"
    error_id: ERR_LOCAL_NOT_FOUND | ERR_MEMBER_NOT_FOUND | ERR_LIST_NOT_FOUND | ERR_REGISTRATION_NOT_FOUND | ERR_CONTRACTOR_NOT_FOUND | ERR_JOB_REQUEST_NOT_FOUND | ERR_REFERRAL_NOT_FOUND | ERR_DISPATCH_NOT_FOUND | ERR_GRIEVANCE_NOT_FOUND | ERR_LEDGER_ENTRY_NOT_FOUND
    http_status: 404
    applies_to: "every endpoint with a path parameter"
  - priority: 5
    category: existence
    check: "Body and query foreign keys exist: home_local_id, list_id, member_id, contractor_id, referral_id, predecessor_registration_id, every reciprocity_credits[].sister_local_id, every named_call_member_ids[] entry"
    error_id: ERR_LOCAL_NOT_FOUND | ERR_MEMBER_NOT_FOUND | ERR_LIST_NOT_FOUND | ERR_REGISTRATION_NOT_FOUND | ERR_CONTRACTOR_NOT_FOUND | ERR_REFERRAL_NOT_FOUND
    http_status: 404
    applies_to: "POST /members, POST /registrations, POST /job-requests, POST /job-requests/{id}/referrals, POST /grievances"
  - priority: 6
    category: auth
    check: "An entity_backed role acting on a resource it does not own: Member with X-User-ID != the target Member/Registration/Referral member_id, or ContractorRep with X-User-ID != the owning Contractor.id. POST /hiring-hall/grievances is deliberately exempt: a grievant challenges another member's referral by design, and grievant_member_id is always taken from X-User-ID rather than the body"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "POST /registrations, POST /registrations/{id}/renew, POST /referrals/{id}/accept, POST /referrals/{id}/refuse, POST /job-requests, POST /job-requests/{id}/cancel, POST /dispatches/{id}/layoff, POST /dispatches/{id}/recall"
  - priority: 7
    category: auth
    check: "Segregation of duties: the adjudicating BusinessManager's X-User-ID differs from the challenged Referral.issued_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /grievances/{id}/adjudicate"
  - priority: 8
    category: state
    check: "The JobRequest is not suspended by contractor delinquency"
    error_id: ERR_JOB_REQUEST_SUSPENDED
    http_status: 409
    applies_to: "POST /job-requests/{id}/referrals"
  - priority: 9
    category: state
    check: "For referral issuance: JobRequest.status IN {OPEN, PARTIALLY_FILLED} AND the open slot count matching slot_kind (open_journeyworker_slots or open_apprentice_slots) is greater than zero. For cancel: status IN {OPEN, PARTIALLY_FILLED, SUSPENDED}"
    error_id: ERR_JOB_REQUEST_NOT_OPEN
    http_status: 409
    applies_to: "POST /job-requests/{id}/referrals, POST /job-requests/{id}/cancel"
  - priority: 10
    category: state
    check: "Referral.status == ISSUED"
    error_id: ERR_REFERRAL_NOT_PENDING
    http_status: 409
    applies_to: "POST /referrals/{id}/accept, POST /referrals/{id}/refuse, POST /referrals/{id}/withdraw"
  - priority: 11
    category: business_constraint
    check: "The selected or named Member holds no outstanding referral: no Referral of any of that member's registrations has status == ISSUED with acceptance_deadline >= clock (capacity-1 occupation, closed at the right edge). Deliberately ordered AHEAD of the registration-state row at priority 30, so a member already out on a referral is reported as such rather than as an inactive registration"
    error_id: ERR_REFERRAL_ALREADY_OUTSTANDING
    http_status: 409
    applies_to: "POST /job-requests/{id}/referrals"
  - priority: 12
    category: state
    check: "Dispatch.status == WORKING for layoff"
    error_id: ERR_DISPATCH_NOT_WORKING
    http_status: 409
    applies_to: "POST /dispatches/{id}/layoff"
  - priority: 13
    category: state
    check: "Dispatch.status == LAID_OFF for recall — TERMINATED_FOR_CAUSE, QUIT and WORKING rows are never recallable"
    error_id: ERR_RECALL_NOT_ELIGIBLE
    http_status: 409
    applies_to: "POST /dispatches/{id}/recall"
  - priority: 14
    category: state
    check: "Grievance.status == FILED for review and == UNDER_REVIEW for adjudication"
    error_id: ERR_GRIEVANCE_NOT_UNDER_REVIEW
    http_status: 409
    applies_to: "POST /grievances/{id}/review, POST /grievances/{id}/adjudicate"
  - priority: 15
    category: state
    check: "expected_job_request_version equals the current JobRequest.version"
    error_id: ERR_STALE_JOB_REQUEST_VERSION
    http_status: 412
    applies_to: "POST /job-requests/{id}/referrals"
  - priority: 16
    category: business_safety
    check: "The Contractor of the request has signatory_status == SIGNATORY at intake"
    error_id: ERR_CONTRACTOR_NOT_SIGNATORY
    http_status: 409
    applies_to: "POST /job-requests"
  - priority: 17
    category: business_safety
    check: "The selected or named Member has standing == GOOD_STANDING and dispatch_eligible == true"
    error_id: ERR_MEMBER_NOT_IN_GOOD_STANDING
    http_status: 409
    applies_to: "POST /job-requests/{id}/referrals"
  - priority: 18
    category: business_safety
    check: "Member.classification matches the requested slot_kind"
    error_id: ERR_CLASSIFICATION_MISMATCH
    http_status: 422
    applies_to: "POST /job-requests/{id}/referrals"
  - priority: 19
    category: business_safety
    check: "A SPECIAL_SKILL referral targets a member holding a SkillEndorsement for JobRequest.required_skill_code with verified == true and certified_until > clock"
    error_id: ERR_SKILL_ENDORSEMENT_MISSING
    http_status: 409
    applies_to: "POST /job-requests/{id}/referrals"
  - priority: 20
    category: business_referential
    check: "List group eligibility: Member.local_hours_in_trade >= OutOfWorkList.requires_local_hours, and Member.is_traveler == false unless OutOfWorkList.accepts_travelers == true"
    error_id: ERR_LIST_GROUP_NOT_ELIGIBLE
    http_status: 422
    applies_to: "POST /registrations"
  - priority: 21
    category: business_referential
    check: "Every reciprocity_credits[].sister_local_id references a Local with kind == SISTER and reciprocity_factor_bp > 0, and a traveler's home Local has reciprocity_factor_bp > 0"
    error_id: ERR_TRAVELER_NOT_RECIPROCAL
    http_status: 409
    applies_to: "POST /registrations"
  - priority: 22
    category: business_referential
    check: "predecessor_registration_id, when supplied, belongs to the same member as the new registration"
    error_id: ERR_REREGISTRATION_PREDECESSOR_MISMATCH
    http_status: 422
    applies_to: "POST /registrations"
  - priority: 23
    category: business_referential
    check: "A NAMED_CALL referral targets a member listed in JobRequest.named_call_member_ids"
    error_id: ERR_NAMED_CALL_NOT_DECLARED
    http_status: 409
    applies_to: "POST /job-requests/{id}/referrals"
  - priority: 24
    category: business_referential
    check: "Sustaining an OUT_OF_ORDER_DISPATCH claim requires the challenged referral's REFERRAL_ISSUED ledger entry to have purge_state == RETAINED"
    error_id: ERR_DISPATCH_RECORD_PURGED
    http_status: 409
    applies_to: "POST /grievances/{id}/adjudicate"
  - priority: 25
    category: business_temporal
    check: "The member's re_registration_eligible_at has passed (clock >= re_registration_eligible_at) or is null"
    error_id: ERR_REREGISTRATION_TOO_EARLY
    http_status: 409
    applies_to: "POST /registrations"
  - priority: 26
    category: business_temporal
    check: "claim_position_preservation == true is honoured only while clock <= predecessor's LAID_OFF Dispatch.ended_at + LAYOFF_REREG_WINDOW_DAYS and that dispatch ended in status LAID_OFF"
    error_id: ERR_REREGISTRATION_WINDOW_EXPIRED
    http_status: 409
    applies_to: "POST /registrations"
  - priority: 27
    category: business_temporal
    check: "clock <= Referral.acceptance_deadline"
    error_id: ERR_ACCEPTANCE_WINDOW_CLOSED
    http_status: 409
    applies_to: "POST /referrals/{id}/accept, POST /referrals/{id}/refuse"
  - priority: 28
    category: business_temporal
    check: "clock <= Dispatch.recall_window_ends_at"
    error_id: ERR_RECALL_WINDOW_CLOSED
    http_status: 409
    applies_to: "POST /dispatches/{id}/recall"
  - priority: 29
    category: business_temporal
    check: "clock <= Referral.issued_at + GRIEVANCE_FILING_WINDOW_DAYS"
    error_id: ERR_GRIEVANCE_WINDOW_EXPIRED
    http_status: 409
    applies_to: "POST /grievances"
  - priority: 30
    category: state
    check: "The target Registration has status == REGISTERED — for referral issuance this is checked only when member_id is named explicitly, since the list selector never returns a non-REGISTERED row"
    error_id: ERR_REGISTRATION_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /job-requests/{id}/referrals, POST /registrations/{id}/renew, POST /registrations/{id}/remove"
  - priority: 31
    category: business_constraint
    check: "The accepting member has no Dispatch whose half-open employment interval [start_at, ended_at) — or [start_at, +inf) while WORKING — contains JobRequest.report_at"
    error_id: ERR_OVERLAPPING_DISPATCH
    http_status: 409
    applies_to: "POST /referrals/{id}/accept, POST /dispatches/{id}/recall"
  - priority: 32
    category: business_constraint
    check: "A member holds at most one Registration with status IN {REGISTERED, REFERRED} across all lists"
    error_id: ERR_MEMBER_ALREADY_REGISTERED
    http_status: 409
    applies_to: "POST /registrations"
  - priority: 33
    category: business_constraint
    check: "len(named_call_member_ids) <= named_call_allowance computed by named_call_and_skill_allowance"
    error_id: ERR_NAMED_CALL_ALLOWANCE_EXCEEDED
    http_status: 409
    applies_to: "POST /job-requests"
  - priority: 34
    category: business_constraint
    check: "special_skill_slots_requested <= special_skill_allowance computed by named_call_and_skill_allowance"
    error_id: ERR_SPECIAL_SKILL_ALLOWANCE_EXCEEDED
    http_status: 409
    applies_to: "POST /job-requests"
  - priority: 35
    category: business_constraint
    check: "An ACTIVE RatioPolicy with effective_from <= clock exists whenever an apprentice slot is dispatched or accepted"
    error_id: ERR_NO_ACTIVE_RATIO_POLICY
    http_status: 409
    applies_to: "POST /job-requests/{id}/referrals, POST /referrals/{id}/accept"
  - priority: 36
    category: business_constraint
    check: "apprentices_committed + 1 <= min(max_apprentices_allowed, apprentices_requested) per apprentice_ratio_cap"
    error_id: ERR_APPRENTICE_RATIO_EXCEEDED
    http_status: 409
    applies_to: "POST /job-requests/{id}/referrals, POST /referrals/{id}/accept"
  - priority: 37
    category: business_constraint
    check: "A LIST_ORDER or SPECIAL_SKILL referral that names an explicit member_id must name the rank-1 candidate under the applicable dispatch_order_ranking variant, unless a non-empty override_reason is supplied"
    error_id: ERR_OUT_OF_ORDER_DISPATCH
    http_status: 409
    applies_to: "POST /job-requests/{id}/referrals"
  - priority: 38
    category: business_constraint
    check: "The candidate set computed by dispatch_order_ranking is non-empty"
    error_id: ERR_NO_ELIGIBLE_REGISTRANT
    http_status: 409
    applies_to: "POST /job-requests/{id}/referrals, GET /job-requests/{id}/dispatch-order"
  - priority: 39
    category: business_fiscal
    check: "hours_worked <= 12 * ceil((clock - Dispatch.start_at) / 24h)"
    error_id: ERR_HOURS_EXCEED_ELAPSED
    http_status: 422
    applies_to: "POST /dispatches/{id}/layoff"
  - priority: 40
    category: business_fiscal
    check: "remedy == MAKE_WHOLE_HOURS requires a Dispatch to exist for the challenged referral; decision == DENIED requires remedy == NONE"
    error_id: ERR_REMEDY_NOT_APPLICABLE
    http_status: 409
    applies_to: "POST /grievances/{id}/adjudicate"

# ---------------------------------------------------------------------------
# §1.5 API Endpoint Table
# Every path parameter is literally named {id} (or {parent_id}-free form) so
# that reverse-reachability sub-resources compose predictably.
# ---------------------------------------------------------------------------
endpoints:
  # --- test-driving surface -------------------------------------------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Sets the server's logical UTC clock, which every deadline, window, expiry, retention and ordering rule reads. Before the first call the logical clock reads exactly 2026-08-01T00:00:00Z and MUST NOT fall back to real wall-clock time."
    roles: [HallAdmin]
    code: 200
    input: [current_utc]
    output: "{ current_utc: string }"
    side_effects: ["no stored entity changes; subsequent requests evaluate every temporal rule against the new instant"]
  - method: POST
    path: "/hiring-hall/dispatch-runs"
    description: "Runs the hall's housekeeping sweep against the current logical clock in a fixed order: (1) expire every ISSUED referral past its acceptance_deadline, (2) apply the resulting refusal-strike and demotion consequences to each affected registration, (3) expire registrations past renewal_due_at, (4) purge ledger entries past retention_until."
    roles: [HallAdmin, Dispatcher]
    code: 200
    input: []
    output: "{ run_at: string, expired_referral_count: integer, demoted_registration_count: integer, expired_registration_count: integer, removed_registration_count: integer, purged_ledger_entry_count: integer }"
    side_effects:
      - "Referral ISSUED -> EXPIRED for every referral whose acceptance_deadline < clock"
      - "Registration REFERRED -> REGISTERED with demotion_count incremented, or -> REMOVED (THREE_REFUSALS) when effective_refusal_strikes reaches REFUSALS_BEFORE_REMOVAL"
      - "Registration REGISTERED -> EXPIRED (RENEWAL_LAPSED) for every registration whose renewal_due_at < clock"
      - "JobRequest.open_journeyworker_slots / open_apprentice_slots recomputed; FILLED or PARTIALLY_FILLED requests re-derived"
      - "DispatchLedgerEntry.purge_state RETAINED -> PURGED and snapshot_json cleared for every entry whose retention_until < clock"
      - "appends REFERRAL_EXPIRED, REGISTRATION_REMOVED and REGISTRATION_EXPIRED ledger entries"

  # --- locals ---------------------------------------------------------------
  - method: POST
    path: "/hiring-hall/locals"
    description: "Registers the home local or a sister local with its reciprocity factor in basis points."
    roles: [HallAdmin]
    code: 201
    input: [local_number, name, kind, "reciprocity_factor_bp?"]
    output: Local
    side_effects: []
  - method: GET
    path: "/hiring-hall/locals/{id}"
    description: "Reads one local."
    roles: [HallAdmin, Dispatcher, BusinessManager, ContractorRep, Member]
    code: 200
    input: []
    output: Local
    side_effects: []
  - method: GET
    path: "/hiring-hall/locals"
    description: "Lists locals."
    roles: [HallAdmin, Dispatcher, BusinessManager, ContractorRep, Member]
    code: 200
    input: ["kind?", "limit?", "offset?"]
    output: Local[]
    side_effects: []

  # --- out-of-work lists ----------------------------------------------------
  - method: POST
    path: "/hiring-hall/out-of-work-lists"
    description: "Creates an out-of-work list group with its priority rank, ordering policy, local-hours floor and traveler admissibility."
    roles: [HallAdmin]
    code: 201
    input: [group_code, priority_rank, ordering_policy, requires_local_hours, accepts_travelers]
    output: OutOfWorkList
    side_effects: []
  - method: GET
    path: "/hiring-hall/out-of-work-lists/{id}"
    description: "Reads one list group including its computed registered_count."
    roles: [HallAdmin, Dispatcher, BusinessManager, Member]
    code: 200
    input: []
    output: OutOfWorkList
    side_effects: []
  - method: GET
    path: "/hiring-hall/out-of-work-lists"
    description: "Lists list groups ordered by priority_rank ASC."
    roles: [HallAdmin, Dispatcher, BusinessManager, Member]
    code: 200
    input: ["ordering_policy?", "accepts_travelers?", "limit?", "offset?"]
    output: OutOfWorkList[]
    side_effects: []

  # --- members and endorsements --------------------------------------------
  - method: POST
    path: "/hiring-hall/members"
    description: "Enters a member on the hall's books, either a local member or a traveler whose home local is a sister local."
    roles: [HallAdmin]
    code: 201
    input: [full_name, home_local_id, classification, local_hours_in_trade, "apprentice_period?", "standing?"]
    output: Member
    side_effects: ["computes is_traveler from the home local's kind"]
  - method: GET
    path: "/hiring-hall/members/{id}"
    description: "Reads one member with computed is_traveler, refusal_strike_count, re_registration_eligible_at and dispatch_eligible."
    roles: [HallAdmin, Dispatcher, BusinessManager, Member]
    code: 200
    input: []
    output: Member
    side_effects: []
  - method: GET
    path: "/hiring-hall/members"
    description: "Lists members, filterable by home local, classification and standing."
    roles: [HallAdmin, Dispatcher, BusinessManager]
    code: 200
    input: ["home_local_id?", "classification?", "standing?", "limit?", "offset?"]
    output: Member[]
    side_effects: []
  - method: PATCH
    path: "/hiring-hall/members/{id}/standing"
    description: "Places a member in or out of good standing (dues delinquency)."
    roles: [HallAdmin, BusinessManager]
    code: 200
    input: [standing]
    output: Member
    side_effects:
      - "recomputes Member.dispatch_eligible, which removes the member from every candidate set computed by dispatch_order_ranking while DELINQUENT"
      - "on a change to DELINQUENT, every Referral of this member with status == ISSUED becomes WITHDRAWN and each linked Registration returns REFERRED -> REGISTERED with its ordinal and demotion_count restored and no strike charged (reg_referred_to_registered_withdrawn)"
      - "increments Member.version by 1"
  - method: POST
    path: "/hiring-hall/members/{id}/skill-endorsements"
    description: "Adds a special-skill endorsement to a member's record."
    roles: [HallAdmin]
    code: 201
    input: [skill_code, certified_until, "verified?"]
    output: SkillEndorsement
    side_effects: []
  - method: GET
    path: "/hiring-hall/members/{id}/skill-endorsements"
    description: "Lists a member's endorsements (reverse-reachability for SkillEndorsement.member_id)."
    roles: [HallAdmin, Dispatcher, BusinessManager, Member]
    code: 200
    input: ["skill_code?", "limit?", "offset?"]
    output: SkillEndorsement[]
    side_effects: []
  - method: GET
    path: "/hiring-hall/skill-endorsements/{id}"
    description: "Reads one endorsement."
    roles: [HallAdmin, Dispatcher, BusinessManager, Member]
    code: 200
    input: []
    output: SkillEndorsement
    side_effects: []

  # --- ratio policy ---------------------------------------------------------
  - method: POST
    path: "/hiring-hall/ratio-policies"
    description: "Publishes an apprentice-to-journeyworker ratio policy; the newest ACTIVE policy effective at or before the clock governs."
    roles: [HallAdmin]
    code: 201
    input: [policy_code, first_apprentice_at_jw_count, then_every_n_jw, effective_from]
    output: RatioPolicy
    side_effects: ["supersedes any previously ACTIVE policy with an earlier effective_from by setting its status to SUPERSEDED"]
  - method: GET
    path: "/hiring-hall/ratio-policies/{id}"
    description: "Reads one ratio policy."
    roles: [HallAdmin, Dispatcher, BusinessManager]
    code: 200
    input: []
    output: RatioPolicy
    side_effects: []
  - method: GET
    path: "/hiring-hall/ratio-policies"
    description: "Lists ratio policies."
    roles: [HallAdmin, Dispatcher, BusinessManager]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: RatioPolicy[]
    side_effects: []

  # --- registrations --------------------------------------------------------
  - method: POST
    path: "/hiring-hall/registrations"
    description: "Signs a member onto an out-of-work list, optionally declaring sister-local reciprocity credits and a predecessor registration whose list position is to be preserved."
    roles: [HallAdmin, Dispatcher, Member]
    code: 201
    input: [member_id, list_id, "reciprocity_credits?", "predecessor_registration_id?", "claim_position_preservation?"]
    output: Registration
    side_effects:
      - "computes credited_seniority_hours via traveler_credited_seniority_hours"
      - "assigns position_number: the preserved predecessor ordinal when position preservation applies, otherwise registered_count + 1"
      - "sets registered_at and renewal_due_at = registered_at + RESIGN_INTERVAL_DAYS"
      - "increments OutOfWorkList.registered_count"
      - "appends a REGISTRATION_CREATED ledger entry with retention_until = registered_at + RETENTION_DAYS"
      - "appends a POSITION_RESTORED ledger entry when a predecessor ordinal was preserved"
  - method: GET
    path: "/hiring-hall/registrations/{id}"
    description: "Reads one registration with its computed position_number, credited_seniority_hours, demotion_count and priority_flag."
    roles: [HallAdmin, Dispatcher, BusinessManager, Member]
    code: 200
    input: []
    output: Registration
    side_effects: []
  - method: GET
    path: "/hiring-hall/registrations"
    description: "Lists registrations, filterable by member, list group, status and predecessor (reverse-reachability for all three Registration FKs)."
    roles: [HallAdmin, Dispatcher, BusinessManager, Member]
    code: 200
    input: ["member_id?", "list_id?", "status?", "predecessor_registration_id?", "limit?", "offset?"]
    output: Registration[]
    side_effects: []
  - method: POST
    path: "/hiring-hall/registrations/{id}/renew"
    description: "Re-signs the out-of-work list within the resign interval; the registration keeps its ordinal and its accrued demotion count."
    roles: [HallAdmin, Dispatcher, Member]
    code: 200
    input: []
    output: Registration
    side_effects:
      - "sets last_renewed_at = clock and renewal_due_at = clock + RESIGN_INTERVAL_DAYS"
      - "leaves position_number, registered_at and demotion_count unchanged"
      - "appends a REGISTRATION_RENEWED ledger entry"
      - "increments Registration.version by 1"
  - method: POST
    path: "/hiring-hall/registrations/{id}/remove"
    description: "Removes a registration from the list voluntarily or administratively."
    roles: [HallAdmin, Dispatcher]
    code: 200
    input: [reason]
    output: Registration
    side_effects:
      - "Registration REGISTERED -> REMOVED with removal_reason set from reason"
      - "decrements OutOfWorkList.registered_count and closes the ordinal gap by shifting every later position_number down by one"
      - "appends a REGISTRATION_REMOVED ledger entry"
      - "increments Registration.version by 1"

  # --- contractors ----------------------------------------------------------
  - method: POST
    path: "/hiring-hall/contractors"
    description: "Registers a signatory contractor."
    roles: [HallAdmin]
    code: 201
    input: [name, agreement_expires_at, "signatory_status?"]
    output: Contractor
    side_effects: []
  - method: GET
    path: "/hiring-hall/contractors/{id}"
    description: "Reads one contractor."
    roles: [HallAdmin, Dispatcher, BusinessManager, ContractorRep]
    code: 200
    input: []
    output: Contractor
    side_effects: []
  - method: GET
    path: "/hiring-hall/contractors"
    description: "Lists contractors."
    roles: [HallAdmin, Dispatcher, BusinessManager]
    code: 200
    input: ["signatory_status?", "limit?", "offset?"]
    output: Contractor[]
    side_effects: []
  - method: PATCH
    path: "/hiring-hall/contractors/{id}/signatory-status"
    description: "Changes a contractor's signatory standing; delinquency suspends the contractor's open work and reverses the list consequences of its outstanding referrals."
    roles: [HallAdmin, BusinessManager]
    code: 200
    input: [signatory_status]
    output: Contractor
    side_effects:
      - "CASCADE HOP 1: on DELINQUENT_TRUST_FUNDS or TERMINATED, every OPEN or PARTIALLY_FILLED JobRequest of this contractor moves to SUSPENDED with suspended_from_status recorded"
      - "CASCADE HOP 2: every ISSUED Referral on those requests moves to WITHDRAWN"
      - "CASCADE HOP 3: each withdrawn referral's Registration returns REFERRED -> REGISTERED with its position_number and demotion_count restored and no refusal strike charged"
      - "CASCADE HOP 4: appends a REFERRAL_WITHDRAWN and a POSITION_RESTORED ledger entry per affected registration"
      - "on return to SIGNATORY, each SUSPENDED JobRequest returns to its suspended_from_status"
      - "increments Contractor.version by 1"

  # --- job requests ---------------------------------------------------------
  - method: POST
    path: "/hiring-hall/job-requests"
    description: "Contractor intake of a manpower request, declaring journeyworker and apprentice counts, duration, report time, an optional special skill and any named calls."
    roles: [ContractorRep, Dispatcher]
    code: 201
    input: [contractor_id, job_site, journeyworkers_requested, apprentices_requested, expected_duration_days, report_at, hourly_rate_cents, "required_skill_code?", "special_skill_slots_requested?", "named_call_member_ids?"]
    output: JobRequest
    side_effects:
      - "computes duration_type from SHORT_CALL_MAX_DAYS"
      - "computes named_call_allowance and special_skill_allowance via named_call_and_skill_allowance and rejects the intake when either declared count exceeds its allowance"
      - "computes max_apprentices_allowed via apprentice_ratio_cap against the governing RatioPolicy"
      - "sets open_journeyworker_slots and open_apprentice_slots to the requested counts"
  - method: GET
    path: "/hiring-hall/job-requests/{id}"
    description: "Reads one job request with its computed allowances, slot counts and status."
    roles: [HallAdmin, Dispatcher, BusinessManager, ContractorRep]
    code: 200
    input: []
    output: JobRequest
    side_effects: []
  - method: GET
    path: "/hiring-hall/job-requests"
    description: "Lists job requests, filterable by contractor and status."
    roles: [HallAdmin, Dispatcher, BusinessManager, ContractorRep]
    code: 200
    input: ["contractor_id?", "status?", "duration_type?", "limit?", "offset?"]
    output: JobRequest[]
    side_effects: []
  - method: POST
    path: "/hiring-hall/job-requests/{id}/cancel"
    description: "Cancels a request that has not yet been filled."
    roles: [ContractorRep, HallAdmin]
    code: 200
    input: [reason]
    output: JobRequest
    side_effects:
      - "JobRequest -> CANCELLED"
      - "every ISSUED Referral on the request moves to WITHDRAWN and each affected Registration returns to REGISTERED with its ordinal and demotion_count restored and no strike charged"
      - "appends a REFERRAL_WITHDRAWN and a POSITION_RESTORED ledger entry per affected registration"
      - "increments JobRequest.version by 1"
  - method: GET
    path: "/hiring-hall/job-requests/{id}/dispatch-order"
    description: "Computed read: returns the ranked candidate pool for the request's next open slot under dispatch_order_ranking, naming the variant that governs."
    roles: [HallAdmin, Dispatcher, BusinessManager]
    code: 200
    input: [slot_kind]
    output: "{ variant: string, candidate_count: integer, top_registration_id: string, top_member_id: string, top_list_group_code: string, top_position_number: integer, top_credited_seniority_hours: integer }"
    side_effects: []
  - method: POST
    path: "/hiring-hall/job-requests/{id}/referrals"
    description: "Issues a referral for one open slot on the request — by list order, by named call or against a special-skill slot. Requires the caller's expected_job_request_version to match the request's current version."
    roles: [Dispatcher]
    code: 201
    input: [slot_kind, referral_kind, expected_job_request_version, "member_id?", "override_reason?"]
    output: Referral
    side_effects:
      - "selects the rank-1 registration via dispatch_order_ranking when member_id is omitted, and records variant_applied"
      - "Registration REGISTERED -> REFERRED"
      - "sets acceptance_deadline = issued_at + ACCEPTANCE_WINDOW_HOURS and records list_position_at_issue"
      - "consumes one named-call or special-skill allowance slot when referral_kind is NAMED_CALL or SPECIAL_SKILL"
      - "reserves the slot: decrements the matching open slot count. Issuance never changes JobRequest.status, which is derived from ACCEPTED referrals only"
      - "appends a REFERRAL_ISSUED ledger entry carrying the ordered candidate snapshot"
      - "increments JobRequest.version by 1"

  # --- referrals ------------------------------------------------------------
  - method: GET
    path: "/hiring-hall/referrals/{id}"
    description: "Reads one referral with its variant_applied, list_position_at_issue and acceptance_deadline."
    roles: [HallAdmin, Dispatcher, BusinessManager, ContractorRep, Member]
    code: 200
    input: []
    output: Referral
    side_effects: []
  - method: GET
    path: "/hiring-hall/referrals"
    description: "Lists referrals, filterable by job request, registration, member and status (reverse-reachability for all three Referral FKs)."
    roles: [HallAdmin, Dispatcher, BusinessManager, ContractorRep, Member]
    code: 200
    input: ["job_request_id?", "registration_id?", "member_id?", "status?", "referral_kind?", "limit?", "offset?"]
    output: Referral[]
    side_effects: []
  - method: POST
    path: "/hiring-hall/referrals/{id}/accept"
    description: "Member accepts the referral inside the acceptance window, which creates the dispatch record."
    roles: [Member, Dispatcher]
    code: 201
    input: []
    output: Dispatch
    side_effects:
      - "Referral ISSUED -> ACCEPTED"
      - "Registration REFERRED -> DISPATCHED_OUT"
      - "creates a Dispatch in WORKING with start_at = JobRequest.report_at"
      - "increments JobRequest.accepted_journeyworker_count or accepted_apprentice_count and re-derives max_apprentices_allowed"
      - "decrements OutOfWorkList.registered_count"
      - "appends a REFERRAL_ACCEPTED ledger entry"
      - "increments JobRequest.version by 1"
  - method: POST
    path: "/hiring-hall/referrals/{id}/refuse"
    description: "Member declines the referral, with or without a recognized good cause."
    roles: [Member, Dispatcher]
    code: 200
    input: ["refusal_good_cause_code?"]
    output: Referral
    side_effects:
      - "Referral ISSUED -> REFUSED"
      - "with good cause: Registration REFERRED -> REGISTERED with position_number and demotion_count unchanged and no strike charged"
      - "without good cause: Registration REFERRED -> REGISTERED demoted to the tail ordinal with demotion_count incremented, or -> REMOVED (THREE_REFUSALS) when effective_refusal_strikes reaches REFUSALS_BEFORE_REMOVAL, which sets Member.re_registration_eligible_at = clock + REREGISTRATION_COOLDOWN_DAYS"
      - "restores the matching open slot count; JobRequest.status is unaffected because a refused referral was never ACCEPTED"
      - "appends a REFERRAL_REFUSED ledger entry, plus REGISTRATION_REMOVED when the third strike lands"
  - method: POST
    path: "/hiring-hall/referrals/{id}/withdraw"
    description: "Hall withdraws its own referral (dispatcher error, contractor pull-back); the registration is made whole with no strike."
    roles: [Dispatcher, HallAdmin]
    code: 200
    input: [reason]
    output: Referral
    side_effects:
      - "Referral ISSUED -> WITHDRAWN"
      - "Registration REFERRED -> REGISTERED with its ordinal, demotion_count and allowance consumption all restored"
      - "restores the matching open slot count"
      - "appends a REFERRAL_WITHDRAWN and a POSITION_RESTORED ledger entry"
      - "increments JobRequest.version by 1"

  # --- dispatches -----------------------------------------------------------
  - method: GET
    path: "/hiring-hall/dispatches/{id}"
    description: "Reads one dispatch."
    roles: [HallAdmin, Dispatcher, BusinessManager, ContractorRep, Member]
    code: 200
    input: []
    output: Dispatch
    side_effects: []
  - method: GET
    path: "/hiring-hall/dispatches"
    description: "Lists dispatches, filterable by member, referral, job request, recall parent and status (reverse-reachability for all four Dispatch FKs)."
    roles: [HallAdmin, Dispatcher, BusinessManager, ContractorRep, Member]
    code: 200
    input: ["member_id?", "referral_id?", "job_request_id?", "recall_of_dispatch_id?", "status?", "limit?", "offset?"]
    output: Dispatch[]
    side_effects: []
  - method: POST
    path: "/hiring-hall/dispatches/{id}/layoff"
    description: "Contractor lays a dispatched member off, reporting hours worked and the reason, which opens the recall window."
    roles: [ContractorRep, HallAdmin]
    code: 200
    input: [hours_worked, layoff_reason]
    output: Dispatch
    side_effects:
      - "Dispatch WORKING -> LAID_OFF, TERMINATED_FOR_CAUSE or QUIT per layoff_reason"
      - "sets ended_at = clock and, for LAID_OFF outcomes, recall_window_ends_at = clock + RECALL_WINDOW_DAYS"
      - "adds hours_worked to Member.local_hours_in_trade"
      - "appends a DISPATCH_LAID_OFF ledger entry with hours_delta = hours_worked"
      - "increments Dispatch.version by 1"
  - method: POST
    path: "/hiring-hall/dispatches/{id}/recall"
    description: "Contractor recalls a laid-off member to the same job inside the recall window, bypassing the list."
    roles: [ContractorRep]
    code: 201
    input: [report_at]
    output: Dispatch
    side_effects:
      - "creates a new Dispatch in WORKING with recall_of_dispatch_id set to the laid-off dispatch and start_at = report_at"
      - "leaves the member's out-of-work position untouched: a recall consumes no list ordinal and no named-call allowance"
      - "appends a DISPATCH_RECALLED ledger entry"

  # --- grievances -----------------------------------------------------------
  - method: POST
    path: "/hiring-hall/grievances"
    description: "Files a grievance against a referral for out-of-order dispatch, an improper named call, a ratio violation or an unavailable record."
    roles: [Member, BusinessManager]
    code: 201
    input: [referral_id, claim_type, narrative]
    output: Grievance
    side_effects: ["sets filed_at = clock", "records grievant_member_id from X-User-ID when the filer is a Member"]
  - method: GET
    path: "/hiring-hall/grievances/{id}"
    description: "Reads one grievance with its remedy, back_pay_variant and computed back pay."
    roles: [HallAdmin, Dispatcher, BusinessManager, Member]
    code: 200
    input: []
    output: Grievance
    side_effects: []
  - method: GET
    path: "/hiring-hall/grievances"
    description: "Lists grievances, filterable by referral, grievant and status (reverse-reachability for both Grievance FKs)."
    roles: [HallAdmin, Dispatcher, BusinessManager, Member]
    code: 200
    input: ["referral_id?", "grievant_member_id?", "status?", "claim_type?", "limit?", "offset?"]
    output: Grievance[]
    side_effects: []
  - method: POST
    path: "/hiring-hall/grievances/{id}/review"
    description: "Opens the grievance for review by the business manager."
    roles: [BusinessManager]
    code: 200
    input: []
    output: Grievance
    side_effects: ["Grievance FILED -> UNDER_REVIEW", "increments Grievance.version by 1"]
  - method: POST
    path: "/hiring-hall/grievances/{id}/adjudicate"
    description: "Decides the grievance. Sustaining with a make-whole remedy computes back pay under the variant selected by the challenged dispatch's outcome; the adjudicator may not be the dispatcher who issued the challenged referral."
    roles: [BusinessManager]
    code: 200
    input: [decision, remedy, "note?"]
    output: Grievance
    side_effects:
      - "Grievance UNDER_REVIEW -> SUSTAINED or DENIED with decided_by_user_id and decided_at recorded"
      - "on SUSTAINED with MAKE_WHOLE_HOURS: selects back_pay_variant, computes back_pay_hours and back_pay_amount_cents via back_pay_make_whole, and appends a MAKE_WHOLE_CREDITED ledger entry with hours_delta = back_pay_hours"
      - "on SUSTAINED with NEXT_AVAILABLE_PRIORITY: sets the grievant's REGISTERED registration priority_flag so dispatch_order_ranking ranks it ahead of the group, and appends a POSITION_RESTORED ledger entry"
      - "appends a GRIEVANCE_DECIDED ledger entry"
      - "increments Grievance.version by 1"

  # --- retention ledger -----------------------------------------------------
  - method: GET
    path: "/hiring-hall/ledger-entries/{id}"
    description: "Reads one dispatch-record ledger entry; a purged entry returns with purge_state PURGED and a null snapshot_json."
    roles: [HallAdmin, BusinessManager]
    code: 200
    input: []
    output: DispatchLedgerEntry
    side_effects: []
  - method: GET
    path: "/hiring-hall/ledger-entries"
    description: "Lists ledger entries in recorded_at ASC, created_at ASC order, filterable by member, referral, event code and purge state (reverse-reachability for both DispatchLedgerEntry FKs)."
    roles: [HallAdmin, BusinessManager]
    code: 200
    input: ["member_id?", "referral_id?", "event_code?", "purge_state?", "limit?", "offset?"]
    output: DispatchLedgerEntry[]
    side_effects: []

# ---------------------------------------------------------------------------
# §1.6 Error Code Catalog (48 codes; every code is triggerable from §1.5)
# ---------------------------------------------------------------------------
errors:
  # --- authentication / authorization --------------------------------------
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID missing, empty, or X-User-Role not one of HallAdmin, Dispatcher, BusinessManager, ContractorRep, Member"
  - id: ERR_ROLE_NOT_PERMITTED
    http: 403
    condition: "The acting role is not listed in the endpoint's roles"
  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "A Member acts on another member's registration or referral, or a ContractorRep acts on another contractor's job request or dispatch"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "The BusinessManager adjudicating a grievance is the same user id that issued the challenged referral"
  # --- request shape --------------------------------------------------------
  - id: ERR_INVALID_REQUEST
    http: 422
    condition: "Missing required field, wrong JSON type, unrecognized enum member, integer outside its declared range, apprentice_period present without APPRENTICE classification or absent with it, zero total requested workers, or limit/offset outside 1..100 / >= 0"
  # --- existence ------------------------------------------------------------
  - id: ERR_LOCAL_NOT_FOUND
    http: 404
    condition: "local_id in the path, home_local_id in the body, or a reciprocity_credits[].sister_local_id matches no Local"
  - id: ERR_MEMBER_NOT_FOUND
    http: 404
    condition: "A member id in the path, body or named_call_member_ids matches no Member"
  - id: ERR_LIST_NOT_FOUND
    http: 404
    condition: "A list id in the path or body matches no OutOfWorkList"
  - id: ERR_REGISTRATION_NOT_FOUND
    http: 404
    condition: "A registration id in the path or predecessor_registration_id matches no Registration"
  - id: ERR_CONTRACTOR_NOT_FOUND
    http: 404
    condition: "A contractor id in the path or body matches no Contractor"
  - id: ERR_JOB_REQUEST_NOT_FOUND
    http: 404
    condition: "A job request id in the path matches no JobRequest"
  - id: ERR_REFERRAL_NOT_FOUND
    http: 404
    condition: "A referral id in the path or body matches no Referral"
  - id: ERR_DISPATCH_NOT_FOUND
    http: 404
    condition: "A dispatch id in the path matches no Dispatch"
  - id: ERR_GRIEVANCE_NOT_FOUND
    http: 404
    condition: "A grievance id in the path matches no Grievance"
  - id: ERR_LEDGER_ENTRY_NOT_FOUND
    http: 404
    condition: "A ledger entry id in the path matches no DispatchLedgerEntry"
  # --- state ----------------------------------------------------------------
  - id: ERR_JOB_REQUEST_SUSPENDED
    http: 409
    condition: "A referral is issued against a JobRequest suspended by contractor delinquency or termination"
  - id: ERR_JOB_REQUEST_NOT_OPEN
    http: 409
    condition: "A referral is issued against a FILLED, CLOSED or CANCELLED request or against a request with no open slot of the requested kind, or a CLOSED/CANCELLED request is cancelled again"
  - id: ERR_REFERRAL_NOT_PENDING
    http: 409
    condition: "Accept, refuse or withdraw is applied to a referral that is not ISSUED"
  - id: ERR_REGISTRATION_NOT_ACTIVE
    http: 409
    condition: "Referral issuance, renewal or removal targets a registration whose status is not REGISTERED"
  - id: ERR_DISPATCH_NOT_WORKING
    http: 409
    condition: "Layoff is applied to a dispatch that is not WORKING"
  - id: ERR_RECALL_NOT_ELIGIBLE
    http: 409
    condition: "Recall is applied to a dispatch that is WORKING, TERMINATED_FOR_CAUSE or QUIT rather than LAID_OFF"
  - id: ERR_GRIEVANCE_NOT_UNDER_REVIEW
    http: 409
    condition: "Review is applied to a grievance that is not FILED, or adjudication to a grievance that is not UNDER_REVIEW"
  - id: ERR_STALE_JOB_REQUEST_VERSION
    http: 412
    condition: "expected_job_request_version does not equal the JobRequest's current version at referral issuance"
  # --- business safety ------------------------------------------------------
  - id: ERR_CONTRACTOR_NOT_SIGNATORY
    http: 409
    condition: "Job-request intake by a contractor whose signatory_status is DELINQUENT_TRUST_FUNDS or TERMINATED"
  - id: ERR_MEMBER_NOT_IN_GOOD_STANDING
    http: 409
    condition: "The selected or named member is DELINQUENT and therefore not dispatch_eligible"
  - id: ERR_CLASSIFICATION_MISMATCH
    http: 422
    condition: "slot_kind JOURNEYWORKER targets an APPRENTICE member, or slot_kind APPRENTICE targets a JOURNEYWORKER member"
  - id: ERR_SKILL_ENDORSEMENT_MISSING
    http: 409
    condition: "A SPECIAL_SKILL referral targets a member with no verified, unexpired endorsement for the request's required_skill_code"
  # --- business referential -------------------------------------------------
  - id: ERR_LIST_GROUP_NOT_ELIGIBLE
    http: 422
    condition: "The member's local hours fall below the list group's requires_local_hours floor, or a traveler signs a group whose accepts_travelers is false"
  - id: ERR_TRAVELER_NOT_RECIPROCAL
    http: 409
    condition: "A declared reciprocity credit cites a Local that is not a SISTER local or whose reciprocity_factor_bp is zero"
  - id: ERR_REREGISTRATION_PREDECESSOR_MISMATCH
    http: 422
    condition: "predecessor_registration_id belongs to a different member than the new registration"
  - id: ERR_NAMED_CALL_NOT_DECLARED
    http: 409
    condition: "A NAMED_CALL referral targets a member absent from the request's named_call_member_ids"
  - id: ERR_DISPATCH_RECORD_PURGED
    http: 409
    condition: "An out-of-order dispatch claim is sustained against a referral whose REFERRAL_ISSUED ledger entry has already been purged past its retention period"
  # --- business temporal ----------------------------------------------------
  - id: ERR_REREGISTRATION_TOO_EARLY
    http: 409
    condition: "A member removed for three refusals re-registers before re_registration_eligible_at"
  - id: ERR_REREGISTRATION_WINDOW_EXPIRED
    http: 409
    condition: "Position preservation is claimed after the layoff re-registration window has closed, or against a dispatch that did not end in LAID_OFF"
  - id: ERR_ACCEPTANCE_WINDOW_CLOSED
    http: 409
    condition: "Accept or refuse arrives strictly after the referral's acceptance_deadline"
  - id: ERR_RECALL_WINDOW_CLOSED
    http: 409
    condition: "Recall arrives strictly after recall_window_ends_at"
  - id: ERR_GRIEVANCE_WINDOW_EXPIRED
    http: 409
    condition: "A grievance is filed more than GRIEVANCE_FILING_WINDOW_DAYS after the challenged referral was issued"
  # --- business constraint --------------------------------------------------
  - id: ERR_REFERRAL_ALREADY_OUTSTANDING
    http: 409
    condition: "The registration already holds an ISSUED referral whose acceptance_deadline has not passed"
  - id: ERR_OVERLAPPING_DISPATCH
    http: 409
    condition: "The member's report time falls inside an existing dispatch's employment interval"
  - id: ERR_MEMBER_ALREADY_REGISTERED
    http: 409
    condition: "The member already holds a REGISTERED or REFERRED registration on some list"
  - id: ERR_NAMED_CALL_ALLOWANCE_EXCEEDED
    http: 409
    condition: "The intake declares more named calls than the request's computed named_call_allowance"
  - id: ERR_SPECIAL_SKILL_ALLOWANCE_EXCEEDED
    http: 409
    condition: "The intake declares more special-skill slots than the request's computed special_skill_allowance"
  - id: ERR_NO_ACTIVE_RATIO_POLICY
    http: 409
    condition: "An apprentice slot is referred or accepted with no ACTIVE RatioPolicy effective at or before the clock"
  - id: ERR_APPRENTICE_RATIO_EXCEEDED
    http: 409
    condition: "Committing one more apprentice would exceed the ratio cap for the journeyworkers committed on the request"
  - id: ERR_OUT_OF_ORDER_DISPATCH
    http: 409
    condition: "A list-order or special-skill referral names a member who is not the rank-1 candidate and supplies no override_reason"
  - id: ERR_NO_ELIGIBLE_REGISTRANT
    http: 409
    condition: "The ranked candidate pool for the requested slot is empty"
  # --- business fiscal ------------------------------------------------------
  - id: ERR_HOURS_EXCEED_ELAPSED
    http: 422
    condition: "Reported hours_worked exceed twelve hours per elapsed calendar day since the dispatch started"
  - id: ERR_REMEDY_NOT_APPLICABLE
    http: 409
    condition: "MAKE_WHOLE_HOURS is awarded on a referral that produced no dispatch, or a DENIED decision carries a remedy other than NONE"

# ---------------------------------------------------------------------------
# §1.7 RBAC Matrix (segregation of duties: the dispatcher who issues a
# referral can never be the manager who adjudicates a grievance about it)
# ---------------------------------------------------------------------------
roles:
  - name: HallAdmin
    description: "Hiring-hall office administrator: maintains locals, list groups, member books, endorsements, contractor records, ratio policy and the retention ledger; runs the housekeeping sweep and the logical clock."
    identity: "opaque"
    exclusive_operations:
      - "POST /_clock/set_current_utc"
      - "POST /hiring-hall/locals"
      - "POST /hiring-hall/out-of-work-lists"
      - "POST /hiring-hall/members"
      - "POST /hiring-hall/members/{id}/skill-endorsements"
      - "POST /hiring-hall/contractors"
      - "POST /hiring-hall/ratio-policies"
      - "GET /hiring-hall/ledger-entries and GET /hiring-hall/ledger-entries/{id} (shared only with BusinessManager)"
    shared_operations:
      - "POST /hiring-hall/dispatch-runs (with Dispatcher)"
      - "PATCH /hiring-hall/members/{id}/standing (with BusinessManager)"
      - "PATCH /hiring-hall/contractors/{id}/signatory-status (with BusinessManager)"
      - "POST /hiring-hall/registrations, POST /hiring-hall/registrations/{id}/renew, POST /hiring-hall/registrations/{id}/remove (with Dispatcher)"
      - "POST /hiring-hall/referrals/{id}/withdraw (with Dispatcher)"
      - "POST /hiring-hall/job-requests/{id}/cancel and POST /hiring-hall/dispatches/{id}/layoff (with ContractorRep)"
      - "all business GET reads"
  - name: Dispatcher
    description: "Hall dispatcher: works the out-of-work lists, issues referrals in list order or against named-call and special-skill allowances, and answers for out-of-order dispatch."
    identity: "opaque"
    exclusive_operations:
      - "POST /hiring-hall/job-requests/{id}/referrals"
    shared_operations:
      - "POST /hiring-hall/dispatch-runs (with HallAdmin)"
      - "POST /hiring-hall/registrations, renew, remove (with HallAdmin and, for its own registration, Member)"
      - "POST /hiring-hall/job-requests (with ContractorRep, for phone-in intake)"
      - "POST /hiring-hall/referrals/{id}/accept and /refuse (with Member, for phone-in answers)"
      - "POST /hiring-hall/referrals/{id}/withdraw (with HallAdmin)"
      - "GET /hiring-hall/job-requests/{id}/dispatch-order (with HallAdmin and BusinessManager)"
  - name: BusinessManager
    description: "Elected business manager: adjudicates grievances over improper dispatch, awards make-whole remedies, and rules on member standing and contractor signatory status. Never issues referrals, so adjudication is always separated from dispatch."
    identity: "opaque"
    exclusive_operations:
      - "POST /hiring-hall/grievances/{id}/review"
      - "POST /hiring-hall/grievances/{id}/adjudicate"
    shared_operations:
      - "POST /hiring-hall/grievances (with Member, when filed on a member's behalf)"
      - "PATCH /hiring-hall/members/{id}/standing (with HallAdmin)"
      - "PATCH /hiring-hall/contractors/{id}/signatory-status (with HallAdmin)"
      - "GET /hiring-hall/ledger-entries and GET /hiring-hall/ledger-entries/{id} (with HallAdmin)"
      - "GET /hiring-hall/job-requests/{id}/dispatch-order (with HallAdmin and Dispatcher)"
  - name: ContractorRep
    description: "Signatory contractor's representative. X-User-ID is the Contractor id; may only act on its own requests and its own dispatched workers."
    identity: "entity_backed:Contractor"
    exclusive_operations:
      - "POST /hiring-hall/dispatches/{id}/recall"
    shared_operations:
      - "POST /hiring-hall/job-requests (with Dispatcher)"
      - "POST /hiring-hall/job-requests/{id}/cancel (with HallAdmin)"
      - "POST /hiring-hall/dispatches/{id}/layoff (with HallAdmin)"
      - "GET reads of its own contractors, job requests, referrals and dispatches"
  - name: Member
    description: "Registered journeyworker, apprentice or traveler. X-User-ID is the Member id; may sign the list, renew, answer referrals and grieve only for itself."
    identity: "entity_backed:Member"
    exclusive_operations: []
    shared_operations:
      - "POST /hiring-hall/registrations and POST /hiring-hall/registrations/{id}/renew for its own book (with HallAdmin and Dispatcher)"
      - "POST /hiring-hall/referrals/{id}/accept and /refuse for its own referral (with Dispatcher)"
      - "POST /hiring-hall/grievances for its own referral (with BusinessManager)"
      - "GET reads of members, lists, its own registrations, referrals, dispatches and grievances"
