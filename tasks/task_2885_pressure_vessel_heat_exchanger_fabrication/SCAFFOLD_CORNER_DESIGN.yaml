            - "ShopAudit.${audit_id}.status == CLOSED with closed_on == 2026-09-15, findings == [], major_finding_count == 0, minor_finding_count == 0 and satisfactory == true"
            - "CertificateOfAuthorization.${cert_id}.status == ACTIVE with open_major_findings_count == 0 and stamping_authorized == true, so the refused replay injected no findings"

      - name: state_machine_triggers_absent_from_draft_job_transition_list_are_refused
        claim_type: Invalid Transitions
        grounds:
