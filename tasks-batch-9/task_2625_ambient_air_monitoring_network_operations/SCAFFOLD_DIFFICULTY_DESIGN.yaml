            - "DataInvalidation.${inv1_id}.hours_affected == 100 and DataInvalidation.${inv2_id}.hours_affected == 100"
            - "the overlapping third invalidation fails: response status == 409 and ${err_id} == ERR_INVALIDATION_RANGE_OVERLAP"
            - "DataBatch.${batch_id}.invalidated_hour_count == 200"
            - "DataBatch.${batch_id}.valid_hour_count == 1960"
            - "DataBatch.${batch_id}.completeness_pct == 90.7"
            - "DataBatch.${batch_id}.version == ${batch_v2}"

      - name: event_window_closed_interval_buffer_rejects_next_day_claim
        grounds:
          - validations[priority=68]
          - entities.ExceptionalEventDemonstration.fields.event_start_date
          - entities.ExceptionalEventDemonstration.fields.event_end_date
          - errors[ERR_EVENT_WINDOW_CONFLICT]
        distinguishing_aspect: |
          Interval semantics on the MonitoringSite resource: event windows are CLOSED on both ends and carry a 24-hour
          buffer partitioned by (site_id, event_type), so a wildfire claim starting 2024-08-20 collides with one ending
          2024-08-19 while a claim starting 2024-08-21 does not, and a DUST claim starting 2024-08-20 never collides at all.
          Both the closed-interval arithmetic and the buffer differ from the unbuffered half-open hour ranges on DataBatch.
        test_recipe:
          setup:
            - "logical clock at 2026-01-05T00:00:00Z"
            - "one operating site with a DRAFT wildfire demonstration for 2024-08-12..2024-08-19"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-05T00:00:00Z" }
              as: NetworkAdmin
            - call: "POST /pollutants"
              payload: { code: "PM25", averaging_period_hours: 24, standard_form: "ANNUAL_MEAN", primary_standard_value: 9.0, design_value_years: 3, completeness_threshold_pct: 75.0, rounding_decimals: 1 }
              as: NetworkAdmin
