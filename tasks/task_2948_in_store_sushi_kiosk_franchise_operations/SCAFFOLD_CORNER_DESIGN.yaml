        grounds:
          - "validations[priority=5]"
          - "errors[ERR_INVALID_REQUEST]"
          - "entities.PackLot.fields.pack_count"
        distinguishing_aspect: |
          pack_count has source input and no default, so omitting it returns ERR_INVALID_REQUEST with HTTP 400 at priority 5 — before any of the priority 8-11 food-safety, referential or capacity gates can run.
