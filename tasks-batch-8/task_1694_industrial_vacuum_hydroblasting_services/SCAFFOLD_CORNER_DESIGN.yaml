            - "Assignment.${asg_b}.status == CONFIRMED (confirmed assignments are not swept)"
            - "cancelled list contains ${asg_a} and not ${asg_b}"

      - name: containment_verify_branches_on_capture_ratio
        claim_type: valid_transition
        grounds:
          - state_machines.ContainmentRecord.LOGGED_to_VERIFIED
          - state_machines.ContainmentRecord.LOGGED_to_DEFICIENT
          - calculations.capture_ratio
        distinguishing_aspect: "Same verify call branches on the computed ratio: record A (1899/2000 = 0.9495) lands DEFICIENT; record B (1900/2000 = 0.9500 exactly) lands VERIFIED — the >= boundary is inclusive."
        test_recipe:
          setup: ["IN_PROGRESS VACUUM job; two containment records logged"]
          setup_api_calls:
            - { call: "POST /v1/sites", payload: { name: "Acme Refining" }, as: AccountManager, captures: { site_id: $.data.id, site_v: $.data.version } }
            - { call: "POST /v1/rate-schedules", payload: { site_id: "${site_id}", label: "S1", vacuum_per_gallon_cents: 250, hydroblast_per_foot_cents: 1800, labor_rate_cents_per_hour: 14500, equipment_rate_cents_per_hour: 22000, standby_rate_cents_per_hour: 12000, overtime_multiplier: 1.5, minimum_invoice_cents: 75000 }, as: AccountManager, captures: { s1: $.data.id } }
