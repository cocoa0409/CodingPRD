      - name: readiness_computed_read_returns_both_variants_without_mutating_the_plan
        claim_type: Computed read
        grounds:
          - "endpoints.GET_return_transition_plans_id_readiness"
          - "calculations.return_readiness_score"
          - "entities.ReturnTransitionPlan.fields.readiness_score_at_activation"
        distinguishing_aspect: |
          The readiness read must evaluate the score on demand under the requested variant and
          write nothing. Two ACCEPTED reports score 62.00 (Q1: 0.5*60 + 0.3*60 + 0.2*90 - 4) and
          62.90 (Q2: same but 94.5 attendance). The default trailing_two_quarter mean is 62.45,
          which FAILS the 62.50 floor; cumulative_recency_weighted is
          (62.90*1 + 62.00*0.7)/1.7 = 62.5294... -> 62.53, which PASSES. Same data, opposite
          readiness_met - and report_scores must come back newest-first, so [62.90, 62.00].
