        claim_type: violation_to_error
        grounds:
          - validations[priority=10]
          - errors[ERR_UNAUTHENTICATED]
          - roles.PlatformAdmin
        distinguishing_aspect: |
          Authentication at priority 10 runs before everything else: a request carrying an
          X-User-Role value that is not one of the six declared roles must return 401
          ERR_UNAUTHENTICATED, not 403 ERR_UNAUTHORIZED.
        test_recipe:
          setup:
            - "Empty database; the trigger presents X-User-Role: Auditor, which is not a declared role"
          setup_api_calls:
          trigger:
            - call: "POST /mills"
              payload: { name: "Cascade Mill A", state_code: "OR", receiving_status: "OPEN" }
              as: Auditor
              as_user_id: "aud-1"
              captures: { err_id: $.data.error_id }
          assert:
            - "response.status == 401"
            - "response.data.error_id == ERR_UNAUTHENTICATED"
            - "no Mill row is created"

