  - section: calculations
    instances:
      - name: statutory_floor_raises_small_penalty
        claim_type: Constants Applied
        grounds:
          - calculations.penalty_dollar_pipeline
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "A 5-point citation (UNLIKELY only, no repeat) computes 56250c but the CITATION floor of 60000c applies LAST, so proposed_penalty_cents == 60000 with statutory_floor_applied true — the floor raises, never replaces, the pipeline output."
        test_recipe:
          setup:
            - "Operator 1000 tons; SPOT inspection IN_PROGRESS at 2026-02-10T09:00:00Z."
          setup_api_calls:
            - *clk_feb10_0800
            - *mk_operator
            - *mk_mine_ug
            - *mk_insp1
            - *mk_spot_feb10
            - *mk_review1
            - *mk_start1
            - *clk_feb10_0900
          trigger:
            - call: "POST /msha/citations"
              payload: { inspection_id: "${insp1}", mine_id: "${m_id}", standard_code: "30 CFR 75.1100", kind: "CITATION", negligence: "NONE", gravity_likelihood: "UNLIKELY", gravity_severity: "NO_INJURY", persons_affected: 1, significant_and_substantial: false, repeat_violation: false }
              as: Inspector
              as_user_id: "${i1}"
              captures: { cit1: $.data.id }
            - call: "GET /msha/citations/${cit1}/penalty-assessments"
              payload: {}
              as: DistrictManager
              captures: { asm1: "$.data[0].id" }
          assert:
            - "PenaltyAssessment.${asm1}.points_total == 5"
            - "PenaltyAssessment.${asm1}.proposed_penalty_cents == 60000 (floor), not 56250"
            - "PenaltyAssessment.${asm1}.statutory_floor_applied == true"

