                audit_date: "2025-08-01T00:00:00Z"
                auditor_name: "365 Auditor"
                score: 85.00
                findings: []
              as: QUALITY_ANALYST
              captures: { audit_365: $.data }
            - call: "POST /api/v1/suppliers/${sup366_id}/audits"
              payload:
                audit_type: "INITIAL"
                audit_date: "2025-07-31T00:00:00Z"
                auditor_name: "366 Auditor"
                score: 85.00
                findings: []
              as: QUALITY_ANALYST
              captures: { err_366: $.data.error_id }
          assert:
            - "AuditRecord for SUP-365 has result == PASS (365 days is within window)"
            - "Supplier SUP-365 qualification_status == QUALIFIED"
            - "error for SUP-366 == ERR_AUDIT_TOO_OLD (366 days exceeds 365-day window)"

  # =========================================================================
  # Rule 9: compensating_invariant — different conserved quantities
  # =========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: batch_reject_restores_ingredient_lot_remaining
        grounds:
          - state_machines.ProductionBatch.POSITIVE_RELEASE_HOLD_to_REJECTED
          - calculations.fifo_consumption_order
        distinguishing_aspect: |
          Conserved quantity: IngredientLot.remaining_kg. When a batch starts production,
          remaining_kg is decremented via FIFO. When the batch is subsequently rejected,
          the consumed quantities are restored to the same lots. The invariant is:
          for each IngredientLot, remaining_kg_after_reject == remaining_kg_before_start.
        test_recipe:
          setup:
            - "An ACTIVE Formula exists with all prerequisites met."
            - "A QUALIFIED Supplier with a QC_PASSED IngredientLot (remaining_kg=500.000) exists."
            - "Clock is at 2026-08-01T00:00:00Z."
