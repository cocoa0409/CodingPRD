          - state_machines.Fund.watch_status.REMEDIATION_to_CLEAR
          - endpoints.POST_/governance/quarterly-reviews/{reviewId}/finalize
        distinguishing_aspect: "The ladder's cure arm is deliberately asymmetric: a fund enters WATCH at composite <= 40.00 but only leaves at composite > 50.00, so the 40.01..50.00 band is a trap that keeps an impaired fund impaired. Two funds in the same quarter-1 finalize sit on opposite sides of that exclusive boundary by 0.04: SMLVX at exactly 50.00 stays WATCH with its slot still AT_RISK, while INTDX at 50.04 cures all the way from REMEDIATION to CLEAR — the cure transition never steps down through WATCH — and its slot returns AT_RISK -> ACTIVE. The ratio then falls to 1 of 5 == 0.2000, below 0.2500, so a posture recompute releases the BLOCKED proposal to its snapshotted DRAFT."
