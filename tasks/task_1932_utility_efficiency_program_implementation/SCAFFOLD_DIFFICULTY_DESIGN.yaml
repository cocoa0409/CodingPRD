            - "After FAIL: Project.status == REMEDIATION"
            - "After re-inspection create: Project.status == INSPECTING (loop back)"
            - "Second Inspection is a NEW record (ins2_id != ins1_id)"

      - name: complaint_branching_states
        grounds:
          - state_machines.Complaint.OPEN_to_IN_REVIEW
          - state_machines.Complaint.OPEN_to_ESCALATED
          - state_machines.Complaint.IN_REVIEW_to_ESCALATED
          - state_machines.Complaint.IN_REVIEW_to_RESOLVED
          - state_machines.Complaint.ESCALATED_to_RESOLVED
        distinguishing_aspect: |
          Complaint is a branching fork-join machine: OPEN forks to {IN_REVIEW, ESCALATED};
          both IN_REVIEW and ESCALATED converge on RESOLVED. Severity determines which
          branches are reachable (escalate requires HIGH/CRITICAL). Different entity from
          Project's revision loop.
        test_recipe:
          setup:
            - "One OPEN complaint with severity HIGH"
          setup_api_calls:
            - call: "POST /efficiency/programs"
              payload: { code: "P-CMP", name: "Cmp", sector: "RESIDENTIAL", budget_cents: 100000, avoided_kwh_target: 1000, trc_threshold: 1.0 }
