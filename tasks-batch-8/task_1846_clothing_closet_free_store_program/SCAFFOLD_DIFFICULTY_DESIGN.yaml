            - { call: "POST /closet/items/${i2}/stock", payload: { storage_zone_id: "${z_id}" }, as: Volunteer, as_user_id: "${v1_id}", captures: { i2_st: $.data.status } }
            - { call: "GET /closet/storage-zones/${z_id}", payload: {}, as: ProgramAdmin, captures: { po: $.data.posture, st: $.data.current_stock } }
            - { call: "POST /closet/items/${i3}/stock", payload: { storage_zone_id: "${z_id}" }, as: Volunteer, as_user_id: "${v1_id}", captures: { err: $.data.error_id } }
          assert:
            - "i2_st == STOCKED  (landing exactly on capacity is allowed)"
            - "st == 2 and po == FULL"
            - "err == ERR_ZONE_FULL  (current_stock >= capacity_items rejects the next)"

  - rule_id: cross_entity_state_dependency
    instances:
      - name: sorting_requires_checked_in_sorting_shift
        grounds:
          - state_machines.DonationBatch.RECEIVED_to_IN_SORT
          - validations[priority=36]
        distinguishing_aspect: |
          Entity pair DonationBatch x VolunteerShift/ShiftSignup: batch sorting may
          start only while a SORTING shift has a CHECKED_IN signup covering now;
          a signed-up-but-not-checked-in volunteer does not satisfy the guard.
        test_recipe:
          setup:
            - "Volunteer signed up (SIGNED_UP, not checked in) on a SORTING shift covering the default clock; batch RECEIVED"
          setup_api_calls:
            - { call: "POST /closet/volunteers", payload: { full_name: "Vol One", is_lead: false }, as: ProgramAdmin, captures: { v1_id: $.data.id } }
            - { call: "POST /closet/shifts", payload: { start_at: "2026-07-31T22:00:00Z", end_at: "2026-08-01T04:00:00Z", role_type: SORTING, capacity_volunteers: 1 }, as: ProgramAdmin, captures: { sh_id: $.data.id } }
            - { call: "POST /closet/shifts/${sh_id}/signups", payload: { volunteer_id: "${v1_id}" }, as: Volunteer, as_user_id: "${v1_id}", captures: { su_id: $.data.id } }
            - { call: "POST /closet/donation-batches", payload: { donor_name: "Donor J", item_count_declared: 1 }, as: Volunteer, as_user_id: "${v1_id}", captures: { b_id: $.data.id } }
          trigger:
            - { call: "POST /closet/donation-batches/${b_id}/start-sorting", payload: {}, as: Volunteer, as_user_id: "${v1_id}", captures: { err: $.data.error_id } }
            - { call: "POST /closet/shifts/${sh_id}/signups/${su_id}/check-in", payload: {}, as: Volunteer, as_user_id: "${v1_id}" }
            - { call: "POST /closet/donation-batches/${b_id}/start-sorting", payload: {}, as: Volunteer, as_user_id: "${v1_id}", captures: { b_st: $.data.status } }
          assert:
            - "err == ERR_NO_SORTING_STAFF  (signup exists but is not CHECKED_IN)"
            - "b_st == IN_SORT after the signup checks in"

      - name: drive_line_requires_drive_active
        grounds:
          - state_machines.SpecialDrive.UPCOMING_to_ACTIVE
          - validations[priority=33]
        distinguishing_aspect: |
          Entity pair DistributionLine/Item x SpecialDrive (distinct from the
          DonationBatch x VolunteerShift pair): a drive-pool item can be STOCKED
          while the drive is UPCOMING but its line add is rejected until the drive
          flips ACTIVE on the clock.
        test_recipe:
          setup:
            - "Drive INTERVIEW_ATTIRE 2026-08-10..2026-08-20 bonus 2; one INTERVIEW_ATTIRE drive item stocked at default clock (drive UPCOMING); client checked in"
          setup_api_calls:
            - { call: "POST /closet/volunteers", payload: { full_name: "Vol One", is_lead: false }, as: ProgramAdmin, captures: { v1_id: $.data.id } }
            - { call: "POST /closet/shifts", payload: { start_at: "2026-07-31T22:00:00Z", end_at: "2026-08-01T04:00:00Z", role_type: SORTING, capacity_volunteers: 1 }, as: ProgramAdmin, captures: { sh_id: $.data.id } }
            - { call: "POST /closet/shifts/${sh_id}/signups", payload: { volunteer_id: "${v1_id}" }, as: Volunteer, as_user_id: "${v1_id}", captures: { su_id: $.data.id } }
            - { call: "POST /closet/shifts/${sh_id}/signups/${su_id}/check-in", payload: {}, as: Volunteer, as_user_id: "${v1_id}" }
            - { call: "POST /closet/drives", payload: { drive_type: INTERVIEW_ATTIRE, target_category: INTERVIEW_ATTIRE, start_at: "2026-08-10T00:00:00Z", end_at: "2026-08-20T00:00:00Z", bonus_items_per_client: 2 }, as: ProgramAdmin, captures: { dr_id: $.data.id } }
            - { call: "POST /closet/storage-zones", payload: { zone_code: "ZE", season_policy: ALL_SEASON, capacity_items: 10 }, as: ProgramAdmin, captures: { z_id: $.data.id } }
            - { call: "POST /closet/donation-batches", payload: { donor_name: "Donor K", item_count_declared: 1 }, as: Volunteer, as_user_id: "${v1_id}", captures: { b_id: $.data.id } }
            - { call: "POST /closet/donation-batches/${b_id}/start-sorting", payload: {}, as: Volunteer, as_user_id: "${v1_id}" }
            - { call: "POST /closet/donation-batches/${b_id}/items", payload: { category: INTERVIEW_ATTIRE, season: ALL_SEASON, quality_grade: NEW_WITH_TAGS, drive_id: "${dr_id}" }, as: Volunteer, as_user_id: "${v1_id}", captures: { i1: $.data.id } }
            - { call: "POST /closet/items/${i1}/stock", payload: { storage_zone_id: "${z_id}" }, as: Volunteer, as_user_id: "${v1_id}", captures: { i1_st: $.data.status } }
            - { call: "POST /closet/clients", payload: { full_name: "C", household_size: 2 }, as: Volunteer, as_user_id: "${v1_id}", captures: { c_id: $.data.id } }
            - { call: "POST /closet/clients/${c_id}/visits", payload: {}, as: Volunteer, as_user_id: "${v1_id}", captures: { vs_id: $.data.id } }
          trigger:
            - { call: "POST /closet/visits/${vs_id}/lines", payload: { item_id: "${i1}" }, as: Volunteer, as_user_id: "${v1_id}", captures: { err: $.data.error_id } }
            - { call: "POST /closet/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T00:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /closet/visits/${vs_id}/lines", payload: { item_id: "${i1}" }, as: Volunteer, as_user_id: "${v1_id}", captures: { ln_drive: $.data.is_drive_line, ln_st: $.data.status } }
          assert:
            - "i1_st == STOCKED  (stocking allowed while drive UPCOMING)"
            - "err == ERR_DRIVE_NOT_ACTIVE  (line add blocked until ACTIVE)"
            - "ln_drive == true and ln_st == ACTIVE after the clock reaches 2026-08-10"

  - rule_id: resource_temporal_overlap
    instances:
      - name: volunteer_shift_half_open_overlap
        grounds:
          - validations[priority=19]
        distinguishing_aspect: |
          Resource: a volunteer's time with HALF-OPEN interval semantics [start_at,
          end_at) — an overlapping signup is rejected while a back-to-back signup
          (existing.end == new.start) is allowed.
        test_recipe:
          setup:
            - "Volunteer v1 signed up on shift S1 2026-08-05 08:00-12:00"
          setup_api_calls:
            - { call: "POST /closet/volunteers", payload: { full_name: "Vol One", is_lead: false }, as: ProgramAdmin, captures: { v1_id: $.data.id } }
            - { call: "POST /closet/shifts", payload: { start_at: "2026-08-05T08:00:00Z", end_at: "2026-08-05T12:00:00Z", role_type: FLOOR, capacity_volunteers: 3 }, as: ProgramAdmin, captures: { s1: $.data.id } }
            - { call: "POST /closet/shifts/${s1}/signups", payload: { volunteer_id: "${v1_id}" }, as: Volunteer, as_user_id: "${v1_id}", captures: { su1: $.data.id } }
            - { call: "POST /closet/shifts", payload: { start_at: "2026-08-05T10:00:00Z", end_at: "2026-08-05T14:00:00Z", role_type: SORTING, capacity_volunteers: 3 }, as: ProgramAdmin, captures: { s2: $.data.id } }
            - { call: "POST /closet/shifts", payload: { start_at: "2026-08-05T12:00:00Z", end_at: "2026-08-05T16:00:00Z", role_type: SORTING, capacity_volunteers: 3 }, as: ProgramAdmin, captures: { s3: $.data.id } }
          trigger:
            - { call: "POST /closet/shifts/${s2}/signups", payload: { volunteer_id: "${v1_id}" }, as: Volunteer, as_user_id: "${v1_id}", captures: { err: $.data.error_id } }
            - { call: "POST /closet/shifts/${s3}/signups", payload: { volunteer_id: "${v1_id}" }, as: Volunteer, as_user_id: "${v1_id}", captures: { su3_st: $.data.status } }
          assert:
            - "err == ERR_SHIFT_OVERLAP  (10:00-14:00 intersects 08:00-12:00)"
            - "su3_st == SIGNED_UP  (12:00-16:00 is back-to-back: adjacency allowed)"

      - name: drive_window_seven_day_buffer_conflict
        grounds:
          - validations[priority=27]
        distinguishing_aspect: |
          Resource: the per-drive_type calendar with BUFFER semantics — same-type
          drives must be separated by a 7-day gap (conflict iff new.start <=
          existing.end + 7d AND existing.start <= new.end + 7d), unlike the
          half-open adjacency-allowed volunteer-time rule; different-type drives
          may overlap freely.
        test_recipe:
          setup:
            - "Existing INTERVIEW_ATTIRE drive 2026-08-10 .. 2026-08-20"
          setup_api_calls:
            - { call: "POST /closet/drives", payload: { drive_type: INTERVIEW_ATTIRE, target_category: INTERVIEW_ATTIRE, start_at: "2026-08-10T00:00:00Z", end_at: "2026-08-20T00:00:00Z", bonus_items_per_client: 2 }, as: ProgramAdmin, captures: { d1: $.data.id } }
          trigger:
            - { call: "POST /closet/drives", payload: { drive_type: INTERVIEW_ATTIRE, target_category: INTERVIEW_ATTIRE, start_at: "2026-08-25T00:00:00Z", end_at: "2026-08-30T00:00:00Z", bonus_items_per_client: 1 }, as: ProgramAdmin, captures: { err: $.data.error_id } }
            - { call: "POST /closet/drives", payload: { drive_type: INTERVIEW_ATTIRE, target_category: INTERVIEW_ATTIRE, start_at: "2026-08-28T00:00:00Z", end_at: "2026-09-05T00:00:00Z", bonus_items_per_client: 1 }, as: ProgramAdmin, captures: { d3_st: $.data.status } }
            - { call: "POST /closet/drives", payload: { drive_type: WINTER_COATS, target_category: COATS, start_at: "2026-08-15T00:00:00Z", end_at: "2026-08-18T00:00:00Z", bonus_items_per_client: 1 }, as: ProgramAdmin, captures: { d4_st: $.data.status } }
          assert:
            - "err == ERR_DRIVE_WINDOW_CONFLICT  (2026-08-25 <= 2026-08-20 + 7d = 2026-08-27)"
            - "d3_st == UPCOMING  (2026-08-28 > 2026-08-27: outside the buffer)"
            - "d4_st == UPCOMING  (different drive_type: overlap allowed)"

  - rule_id: compensating_invariant
    instances:
      - name: checkout_return_item_conservation
        grounds:
          - state_machines.Item.RESERVED_to_DISTRIBUTED
          - state_machines.Item.DISTRIBUTED_to_STOCKED
          - entities.StorageZone.fields.current_stock
        distinguishing_aspect: |
          Conserved quantity: physical item count. Invariant SUM(zone.current_stock)
          + count(DISTRIBUTED) + count(other non-zone statuses) == total items
          created; checkout (forward) and return (compensating) leave it unchanged.
        test_recipe:
          setup:
            - "Zone cap 5 with 3 stocked GOOD items; client visit takes 2 to checkout, then 1 is returned"
          setup_api_calls:
            - { call: "POST /closet/volunteers", payload: { full_name: "Vol One", is_lead: false }, as: ProgramAdmin, captures: { v1_id: $.data.id } }
            - { call: "POST /closet/shifts", payload: { start_at: "2026-07-31T22:00:00Z", end_at: "2026-08-01T04:00:00Z", role_type: SORTING, capacity_volunteers: 1 }, as: ProgramAdmin, captures: { sh_id: $.data.id } }
            - { call: "POST /closet/shifts/${sh_id}/signups", payload: { volunteer_id: "${v1_id}" }, as: Volunteer, as_user_id: "${v1_id}", captures: { su_id: $.data.id } }
            - { call: "POST /closet/shifts/${sh_id}/signups/${su_id}/check-in", payload: {}, as: Volunteer, as_user_id: "${v1_id}" }
            - { call: "POST /closet/storage-zones", payload: { zone_code: "ZF", season_policy: ALL_SEASON, capacity_items: 5 }, as: ProgramAdmin, captures: { z_id: $.data.id } }
            - { call: "POST /closet/donation-batches", payload: { donor_name: "Donor L", item_count_declared: 3 }, as: Volunteer, as_user_id: "${v1_id}", captures: { b_id: $.data.id } }
            - { call: "POST /closet/donation-batches/${b_id}/start-sorting", payload: {}, as: Volunteer, as_user_id: "${v1_id}" }
            - { call: "POST /closet/donation-batches/${b_id}/items", payload: { category: ADULT_TOPS, season: ALL_SEASON, quality_grade: GOOD }, as: Volunteer, as_user_id: "${v1_id}", captures: { i1: $.data.id } }
            - { call: "POST /closet/donation-batches/${b_id}/items", payload: { category: ADULT_TOPS, season: ALL_SEASON, quality_grade: GOOD }, as: Volunteer, as_user_id: "${v1_id}", captures: { i2: $.data.id } }
            - { call: "POST /closet/donation-batches/${b_id}/items", payload: { category: ADULT_TOPS, season: ALL_SEASON, quality_grade: GOOD }, as: Volunteer, as_user_id: "${v1_id}", captures: { i3: $.data.id } }
            - { call: "POST /closet/items/${i1}/stock", payload: { storage_zone_id: "${z_id}" }, as: Volunteer, as_user_id: "${v1_id}" }
            - { call: "POST /closet/items/${i2}/stock", payload: { storage_zone_id: "${z_id}" }, as: Volunteer, as_user_id: "${v1_id}" }
            - { call: "POST /closet/items/${i3}/stock", payload: { storage_zone_id: "${z_id}" }, as: Volunteer, as_user_id: "${v1_id}" }
            - { call: "POST /closet/clients", payload: { full_name: "C", household_size: 2 }, as: Volunteer, as_user_id: "${v1_id}", captures: { c_id: $.data.id } }
            - { call: "POST /closet/clients/${c_id}/visits", payload: {}, as: Volunteer, as_user_id: "${v1_id}", captures: { vs_id: $.data.id } }
            - { call: "POST /closet/visits/${vs_id}/lines", payload: { item_id: "${i1}" }, as: Volunteer, as_user_id: "${v1_id}", captures: { ln1: $.data.id } }
            - { call: "POST /closet/visits/${vs_id}/lines", payload: { item_id: "${i2}" }, as: Volunteer, as_user_id: "${v1_id}", captures: { ln2: $.data.id } }
            - { call: "POST /closet/visits/${vs_id}/checkout", payload: {}, as: Volunteer, as_user_id: "${v1_id}" }
            - { call: "GET /closet/storage-zones/${z_id}", payload: {}, as: ProgramAdmin, captures: { st_after_co: $.data.current_stock } }
          trigger:
            - { call: "POST /closet/distribution-lines/${ln1}/return", payload: {}, as: Volunteer, as_user_id: "${v1_id}", captures: { ln1_st: $.data.status } }
            - { call: "GET /closet/storage-zones/${z_id}", payload: {}, as: ProgramAdmin, captures: { st_final: $.data.current_stock } }
            - { call: "GET /closet/items/${i2}", payload: {}, as: ProgramAdmin, captures: { i2_st: $.data.status } }
          assert:
            - "st_after_co == 1  (2 distributed out of 3 stocked)"
            - "ln1_st == RETURNED and st_final == 2  (compensating action restores stock)"
            - "i2_st == DISTRIBUTED"
            - "conservation: 2 (zone) + 1 (distributed) + 0 (other) == 3 items created"

      - name: checkout_return_allowance_ledger_conservation
        grounds:
          - calculations.visit_window_stats
          - entities.Client.fields.items_in_30d
        distinguishing_aspect: |
          Conserved quantity: the client allowance ledger (distinct from physical
          item count) — items_in_30d tracks DISTRIBUTED lines on in-window
          checkouts, and a return decrements it so the ledger never drifts.
        test_recipe:
          setup:
            - "Client hh=3 (allowance 12); 3 stocked items; visit with 3 lines checked out"
          setup_api_calls:
            - { call: "POST /closet/volunteers", payload: { full_name: "Vol One", is_lead: false }, as: ProgramAdmin, captures: { v1_id: $.data.id } }
            - { call: "POST /closet/shifts", payload: { start_at: "2026-07-31T22:00:00Z", end_at: "2026-08-01T04:00:00Z", role_type: SORTING, capacity_volunteers: 1 }, as: ProgramAdmin, captures: { sh_id: $.data.id } }
            - { call: "POST /closet/shifts/${sh_id}/signups", payload: { volunteer_id: "${v1_id}" }, as: Volunteer, as_user_id: "${v1_id}", captures: { su_id: $.data.id } }
            - { call: "POST /closet/shifts/${sh_id}/signups/${su_id}/check-in", payload: {}, as: Volunteer, as_user_id: "${v1_id}" }
            - { call: "POST /closet/storage-zones", payload: { zone_code: "ZG", season_policy: ALL_SEASON, capacity_items: 10 }, as: ProgramAdmin, captures: { z_id: $.data.id } }
            - { call: "POST /closet/donation-batches", payload: { donor_name: "Donor M", item_count_declared: 3 }, as: Volunteer, as_user_id: "${v1_id}", captures: { b_id: $.data.id } }
            - { call: "POST /closet/donation-batches/${b_id}/start-sorting", payload: {}, as: Volunteer, as_user_id: "${v1_id}" }
            - { call: "POST /closet/donation-batches/${b_id}/items", payload: { category: ADULT_BOTTOMS, season: ALL_SEASON, quality_grade: GOOD }, as: Volunteer, as_user_id: "${v1_id}", captures: { i1: $.data.id } }
            - { call: "POST /closet/donation-batches/${b_id}/items", payload: { category: ADULT_BOTTOMS, season: ALL_SEASON, quality_grade: GOOD }, as: Volunteer, as_user_id: "${v1_id}", captures: { i2: $.data.id } }
            - { call: "POST /closet/donation-batches/${b_id}/items", payload: { category: ADULT_BOTTOMS, season: ALL_SEASON, quality_grade: GOOD }, as: Volunteer, as_user_id: "${v1_id}", captures: { i3: $.data.id } }
            - { call: "POST /closet/items/${i1}/stock", payload: { storage_zone_id: "${z_id}" }, as: Volunteer, as_user_id: "${v1_id}" }
            - { call: "POST /closet/items/${i2}/stock", payload: { storage_zone_id: "${z_id}" }, as: Volunteer, as_user_id: "${v1_id}" }
            - { call: "POST /closet/items/${i3}/stock", payload: { storage_zone_id: "${z_id}" }, as: Volunteer, as_user_id: "${v1_id}" }
            - { call: "POST /closet/clients", payload: { full_name: "C", household_size: 3 }, as: Volunteer, as_user_id: "${v1_id}", captures: { c_id: $.data.id } }
            - { call: "POST /closet/clients/${c_id}/visits", payload: {}, as: Volunteer, as_user_id: "${v1_id}", captures: { vs_id: $.data.id } }
            - { call: "POST /closet/visits/${vs_id}/lines", payload: { item_id: "${i1}" }, as: Volunteer, as_user_id: "${v1_id}" }
            - { call: "POST /closet/visits/${vs_id}/lines", payload: { item_id: "${i2}" }, as: Volunteer, as_user_id: "${v1_id}", captures: { ln2: $.data.id } }
            - { call: "POST /closet/visits/${vs_id}/lines", payload: { item_id: "${i3}" }, as: Volunteer, as_user_id: "${v1_id}" }
            - { call: "POST /closet/visits/${vs_id}/checkout", payload: {}, as: Volunteer, as_user_id: "${v1_id}" }
            - { call: "GET /closet/clients/${c_id}", payload: {}, as: ProgramAdmin, captures: { led_after_co: $.data.items_in_30d, vc_after_co: $.data.visits_in_30d } }
          trigger:
            - { call: "POST /closet/distribution-lines/${ln2}/return", payload: {}, as: Volunteer, as_user_id: "${v1_id}" }
            - { call: "GET /closet/clients/${c_id}", payload: {}, as: ProgramAdmin, captures: { led_final: $.data.items_in_30d, vc_final: $.data.visits_in_30d } }
          assert:
            - "led_after_co == 3 and vc_after_co == 1"
            - "led_final == 2  (return compensates the ledger; no drift)"
            - "vc_final == 1  (returns never refund the visit counter)"
