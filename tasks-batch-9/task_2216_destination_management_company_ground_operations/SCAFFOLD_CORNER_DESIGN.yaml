# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
#
# Breadth walk of references/claim-extraction-guide.md against SCAFFOLD.yaml
# §1.1-§1.7. `section:` values and `claim_type:` values are taken from that
# guide only. Where a corner is already asserted by a §1.8 instance an
# `excluded_because:` stub is emitted instead of a recipe.
#
# The walk forced one §1.5 change (priority-ladder rung 2, "add a general
# business endpoint"): ERR_ELEMENT_DEPENDENCY_CYCLE was unreachable because a
# cycle cannot be closed by a create — the new element has no dependents yet.
# `PATCH /dmc/program-elements/{element_id}` was added so the production
# timeline can be rewired after creation, which is where the cycle check bites.
#
# Triggerability closure: every one of the 63 error ids in §1.6 is named by at
# least one §1.8 instance, one recipe here, or one `excluded_because:` stub.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:

      - name: create_program_returns_declared_defaults_and_zeroed_computed_fields
        claim_type: creation
        grounds:
          - entities.Program.fields.execution_status
          - entities.Program.fields.settlement_status
          - entities.Program.fields.element_count
          - entities.Program.fields.markup_pct
        distinguishing_aspect: "A program created with every required field returns 201 with execution_status DRAFT, settlement_status NOT_STARTED, version 1 and every computed money/count field at 0."
        test_recipe:
          setup: ["Empty database; logical clock at its startup default 2026-08-01T00:00:00Z."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramDirector
          trigger:
            - call: "POST /dmc/programs"
              payload: { client_name: "Arden Logistics", group_name: "Ops Summit", arrival_date: "2026-09-10", departure_date: "2026-09-14", guaranteed_count: 100, markup_pct: 0.18 }
              as: ProgramDirector
              captures: { prog_id: $.data.id }
          assert:
            - "trigger returns HTTP 201"
            - "Program.${prog_id}.execution_status == DRAFT"
            - "Program.${prog_id}.settlement_status == NOT_STARTED"
            - "Program.${prog_id}.version == 1"
            - "Program.${prog_id}.element_count == 0"
            - "Program.${prog_id}.open_element_count == 0"
            - "Program.${prog_id}.actual_attendance_total == 0"
            - "Program.${prog_id}.estimated_client_total_cents == 0"
            - "Program.${prog_id}.final_client_total_cents == 0"
            - "Program.${prog_id}.supplier_open_payable_cents == 0"
            - "Program.${prog_id}.seated_guest_count == 0"
            - "Program.${prog_id}.staffing_gap_count == 0"
            - "Program.${prog_id}.invoice_issued_at == null"
            - "response envelope carries meta.api_request_id, meta.api_request_timestamp and response_type == \"object\""

      - name: get_program_returns_stored_representation
        claim_type: retrieval
        grounds: [entities.Program.fields.guaranteed_count, entities.Program.fields.markup_pct]
        distinguishing_aspect: "GET /dmc/programs/{program_id} echoes exactly the values stored at creation, including markup_pct 0.22 and guaranteed_count 64."
        test_recipe:
          setup: ["One Program created with guaranteed_count 64 and markup_pct 0.22."]
          setup_api_calls:
            - call: "POST /dmc/programs"
              payload: { client_name: "Bellweather Foods", group_name: "Regional Sales Meet", arrival_date: "2026-09-10", departure_date: "2026-09-14", guaranteed_count: 64, markup_pct: 0.22 }
              as: ProgramDirector
              captures: { prog_id: $.data.id }
          trigger:
            - call: "GET /dmc/programs/${prog_id}"
              payload: {}
              as: OperationsCoordinator
          assert:
            - "trigger returns HTTP 200"
            - "data.id == ${prog_id}"
            - "data.guaranteed_count == 64"
            - "data.markup_pct == 0.22"
            - "data.arrival_date == 2026-09-10"
            - "data.departure_date == 2026-09-14"

      - name: list_programs_paginated_with_total_count_and_has_more
        claim_type: listing
        grounds: [entities.Program.fields.execution_status]
        distinguishing_aspect: "With three programs stored, limit=2&offset=0 returns 2 items with total_count 3 and has_more true, while limit=2&offset=2 returns 1 item with has_more false."
        test_recipe:
          setup: ["Three Programs created in a fixed order."]
          setup_api_calls:
            - call: "POST /dmc/programs"
              payload: { client_name: "Client One", group_name: "Group One", arrival_date: "2026-09-10", departure_date: "2026-09-14", guaranteed_count: 10, markup_pct: 0.18 }
              as: ProgramDirector
            - call: "POST /dmc/programs"
              payload: { client_name: "Client Two", group_name: "Group Two", arrival_date: "2026-09-15", departure_date: "2026-09-18", guaranteed_count: 20, markup_pct: 0.18 }
              as: ProgramDirector
            - call: "POST /dmc/programs"
              payload: { client_name: "Client Three", group_name: "Group Three", arrival_date: "2026-09-20", departure_date: "2026-09-24", guaranteed_count: 30, markup_pct: 0.18 }
              as: ProgramDirector
          trigger:
            - call: "GET /dmc/programs?limit=2&offset=0"
              payload: {}
              as: ProgramDirector
            - call: "GET /dmc/programs?limit=2&offset=2"
              payload: {}
              as: ProgramDirector
            - call: "GET /dmc/programs?execution_status=DRAFT&limit=10&offset=0"
              payload: {}
              as: ProgramDirector
          assert:
            - "the first trigger call returns response_type == \"array\", 2 items, total_count == 3, has_more == true"
            - "the second trigger call returns 1 item, total_count == 3, has_more == false"
            - "the third trigger call returns 3 items (all three programs are DRAFT)"
            - "results are ordered by created_at ASC, so the first page holds Client One then Client Two"

      - name: get_program_unknown_id_not_found
        claim_type: not_found
        grounds: ["errors[ERR_PROGRAM_NOT_FOUND]"]
        distinguishing_aspect: "A syntactically valid but unknown program id returns HTTP 404 with data.error_id == ERR_PROGRAM_NOT_FOUND and no other error id."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - call: "GET /dmc/programs/00000000-0000-0000-0000-0000000000ff"
              payload: {}
              as: ProgramDirector
              captures: { err: $.data.error_id }
          assert:
            - "trigger returns HTTP 404"
            - "${err} == ERR_PROGRAM_NOT_FOUND"
            - "response_type == \"error\""

      - name: get_manifest_entry_unknown_id_not_found
        claim_type: not_found
        grounds: ["errors[ERR_MANIFEST_ENTRY_NOT_FOUND]"]
        distinguishing_aspect: "A child entity's own 404 is distinct from its parent's: an unknown manifest_entry_id returns ERR_MANIFEST_ENTRY_NOT_FOUND, not ERR_SEGMENT_NOT_FOUND."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - call: "GET /dmc/manifest-entries/00000000-0000-0000-0000-0000000000ff"
              payload: {}
              as: OperationsCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "trigger returns HTTP 404"
            - "${err} == ERR_MANIFEST_ENTRY_NOT_FOUND"

      - name: create_program_missing_guaranteed_count_invalid_request
        claim_type: required_fields
        grounds: ["validations[priority=6]", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Omitting the required guaranteed_count returns HTTP 400 ERR_INVALID_REQUEST and creates no Program (the list stays empty)."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - call: "POST /dmc/programs"
              payload: { client_name: "Incomplete Client", group_name: "Incomplete Group", arrival_date: "2026-09-10", departure_date: "2026-09-14", markup_pct: 0.18 }
              as: ProgramDirector
              captures: { err: $.data.error_id }
          assert:
            - "trigger returns HTTP 400"
            - "${err} == ERR_INVALID_REQUEST"
            - "GET /dmc/programs?limit=10&offset=0 returns total_count == 0"

      - name: omitted_markup_pct_applies_declared_default
        claim_type: defaults
        grounds: [entities.Program.fields.markup_pct, "validations[priority=45]"]
        distinguishing_aspect: "Omitting markup_pct stores the declared default 0.18 rather than null or 0, and the default sits inside the 0.05-0.35 band so validations[priority=45] does not fire."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - call: "POST /dmc/programs"
              payload: { client_name: "Default Markup Client", group_name: "Default Group", arrival_date: "2026-09-10", departure_date: "2026-09-14", guaranteed_count: 44 }
              as: ProgramDirector
              captures: { prog_id: $.data.id }
          assert:
            - "trigger returns HTTP 201"
            - "Program.${prog_id}.markup_pct == 0.18"

      - name: program_computed_totals_reject_client_input_ignored
        claim_type: computed_fields
        grounds:
          - entities.Program.fields.element_count
          - entities.Program.fields.final_client_total_cents
          - entities.Program.fields.supplier_open_payable_cents
        distinguishing_aspect: "Client-supplied values for the computed fields element_count, final_client_total_cents and supplier_open_payable_cents are discarded: all three read 0 on the created program."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - call: "POST /dmc/programs"
              payload: { client_name: "Spoofing Client", group_name: "Spoofing Group", arrival_date: "2026-09-10", departure_date: "2026-09-14", guaranteed_count: 20, markup_pct: 0.18, element_count: 99, final_client_total_cents: 500000, supplier_open_payable_cents: 777 }
              as: ProgramDirector
              captures: { prog_id: $.data.id }
          assert:
            - "Program.${prog_id}.element_count == 0"
            - "Program.${prog_id}.final_client_total_cents == 0"
            - "Program.${prog_id}.supplier_open_payable_cents == 0"

      - name: venue_system_fields_server_generated_extra_field_ignored
        claim_type: system_fields
        grounds: [entities.Venue.fields.name]
        distinguishing_aspect: "Supplying id, created_at and version on a venue create is ignored: the stored id is not the supplied literal and version is 1."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - call: "POST /dmc/venues"
              payload: { name: "Spoofed Venue", capacity_seated: 100, capacity_reception: 150, turnover_buffer_minutes: 60, requires_special_venue_permit: false, status: "ACTIVE", id: "11111111-1111-1111-1111-111111111111", created_at: "2000-01-01T00:00:00Z", version: 42 }
              as: ProgramDirector
              captures: { venue_id: $.data.id }
          assert:
            - "trigger returns HTTP 201"
            - "${venue_id} != 11111111-1111-1111-1111-111111111111"
            - "Venue.${venue_id}.version == 1"
            - "Venue.${venue_id}.created_at == 2026-08-01T00:00:00Z (the logical clock, not the supplied literal)"

      - name: create_element_with_unknown_element_type_invalid_enum
        claim_type: type_constraints
        grounds: [entities.ProgramElement.fields.element_type, "validations[priority=6]"]
        distinguishing_aspect: "element_type outside {ACTIVITY, DINE_AROUND, OFF_PREMISE_EVENT, TRANSFER_BLOCK} returns HTTP 400 ERR_INVALID_REQUEST before any venue, turnover or capacity rule is consulted."
        test_recipe:
          setup:
            - "Logical clock 2026-08-01T00:00:00Z; one Venue; one APPROVED Supplier; one DRAFT Program 2026-09-10..2026-09-14."
          setup_api_calls:
            - call: "POST /dmc/venues"
              payload: { name: "Enum Test Venue", capacity_seated: 100, capacity_reception: 200, turnover_buffer_minutes: 90, requires_special_venue_permit: false, status: "ACTIVE" }
              as: ProgramDirector
              captures: { venue_id: $.data.id }
            - call: "POST /dmc/suppliers"
              payload: { legal_name: "Enum Test Supplier", supplier_type: "ACTIVITY", insurance_expires_on: "2027-01-31", insurance_liability_limit_cents: 500000000, coi_verified: true, status: "APPROVED" }
              as: SupplierManager
              captures: { sup_id: $.data.id }
            - call: "POST /dmc/programs"
              payload: { client_name: "Enum Client", group_name: "Enum Group", arrival_date: "2026-09-10", departure_date: "2026-09-14", guaranteed_count: 20, markup_pct: 0.18 }
              as: ProgramDirector
              captures: { prog_id: $.data.id, prog_v1: $.data.version }
          trigger:
            - call: "POST /dmc/program-elements"
              payload: { program_id: "${prog_id}", supplier_id: "${sup_id}", venue_id: "${venue_id}", element_type: "GALA_DINNER", title: "Bad Enum", starts_at: "2026-09-11T09:00:00Z", ends_at: "2026-09-11T11:00:00Z", planned_headcount: 20, guaranteed_headcount: 20, per_person_cost_cents: 4000, expected_program_version: "${prog_v1}" }
              as: ProgramDirector
              captures: { err: $.data.error_id }
          assert:
            - "trigger returns HTTP 400"
            - "${err} == ERR_INVALID_REQUEST"
            - "Program.${prog_id}.element_count == 0"
            - "Program.${prog_id}.version == ${prog_v1}"

      - name: create_element_with_unknown_program_id_not_found
        claim_type: parent_relationships
        grounds: [entities.ProgramElement.parent, "errors[ERR_PROGRAM_NOT_FOUND]"]
        distinguishing_aspect: "A ProgramElement cannot be created against a non-existent parent: the response is HTTP 404 ERR_PROGRAM_NOT_FOUND, resolved before the 412 optimistic-concurrency check even though the supplied expected_program_version is a live version value read off a different program."
        test_recipe:
          setup: ["One Venue, one APPROVED Supplier and one unrelated DRAFT Program exist; no Program with the referenced id exists."]
          setup_api_calls:
            - call: "POST /dmc/venues"
              payload: { name: "Orphan Test Venue", capacity_seated: 100, capacity_reception: 200, turnover_buffer_minutes: 90, requires_special_venue_permit: false, status: "ACTIVE" }
              as: ProgramDirector
              captures: { venue_id: $.data.id }
            - call: "POST /dmc/suppliers"
              payload: { legal_name: "Orphan Test Supplier", supplier_type: "ACTIVITY", insurance_expires_on: "2027-01-31", insurance_liability_limit_cents: 500000000, coi_verified: true, status: "APPROVED" }
              as: SupplierManager
              captures: { sup_id: $.data.id }
            - call: "POST /dmc/programs"
              payload: { client_name: "Bystander Client", group_name: "Bystander Group", arrival_date: "2026-09-10", departure_date: "2026-09-14", guaranteed_count: 20, markup_pct: 0.18 }
              as: ProgramDirector
              captures: { other_prog_id: $.data.id, other_prog_v1: $.data.version }
          trigger:
            - call: "POST /dmc/program-elements"
              payload: { program_id: "00000000-0000-0000-0000-0000000000ff", supplier_id: "${sup_id}", venue_id: "${venue_id}", element_type: "ACTIVITY", title: "Orphan Element", starts_at: "2026-09-11T09:00:00Z", ends_at: "2026-09-11T11:00:00Z", planned_headcount: 20, guaranteed_headcount: 20, per_person_cost_cents: 4000, expected_program_version: "${other_prog_v1}" }
              as: ProgramDirector
              captures: { err: $.data.error_id }
          assert:
            - "trigger returns HTTP 404"
            - "${err} == ERR_PROGRAM_NOT_FOUND"
            - "${err} != ERR_STALE_PROGRAM_VERSION"
            - "Program.${other_prog_id}.element_count == 0"

      - name: graph_topology_program_supplier_many_to_many_reverse_lookups
        claim_type: graph
        grounds:
          - entities.SupplierContract.fields.program_id
          - entities.SupplierContract.fields.supplier_id
          - entities.ProgramElement.fields.supplier_id
        distinguishing_aspect: "One Program bound to two Suppliers yields two SupplierContracts and two ProgramElements; the filtered lists resolve the association in both directions (by program_id: 2 contracts; by supplier_id: 1 contract and 1 element each)."
        test_recipe:
          setup:
            - "Logical clock 2026-08-01T00:00:00Z; two Venues; two APPROVED Suppliers; one DRAFT Program 2026-09-10..2026-09-14."
            - "One ProgramElement per supplier (2026-09-11T09:00Z..11:00Z at venue 1, 2026-09-11T09:00Z..11:00Z at venue 2) and one SupplierContract per supplier."
          setup_api_calls:
            - call: "POST /dmc/venues"
              payload: { name: "Graph Venue A", capacity_seated: 100, capacity_reception: 200, turnover_buffer_minutes: 90, requires_special_venue_permit: false, status: "ACTIVE" }
              as: ProgramDirector
              captures: { v1: $.data.id }
            - call: "POST /dmc/venues"
              payload: { name: "Graph Venue B", capacity_seated: 100, capacity_reception: 200, turnover_buffer_minutes: 90, requires_special_venue_permit: false, status: "ACTIVE" }
              as: ProgramDirector
              captures: { v2: $.data.id }
            - call: "POST /dmc/suppliers"
              payload: { legal_name: "Graph Supplier One", supplier_type: "ACTIVITY", insurance_expires_on: "2027-01-31", insurance_liability_limit_cents: 500000000, coi_verified: true, status: "APPROVED" }
              as: SupplierManager
              captures: { s1: $.data.id }
            - call: "POST /dmc/suppliers"
              payload: { legal_name: "Graph Supplier Two", supplier_type: "VENUE_SERVICES", insurance_expires_on: "2027-01-31", insurance_liability_limit_cents: 500000000, coi_verified: true, status: "APPROVED" }
              as: SupplierManager
              captures: { s2: $.data.id }
            - call: "POST /dmc/programs"
              payload: { client_name: "Graph Client", group_name: "Graph Group", arrival_date: "2026-09-10", departure_date: "2026-09-14", guaranteed_count: 40, markup_pct: 0.18 }
              as: ProgramDirector
              captures: { prog_id: $.data.id, prog_v1: $.data.version }
            - call: "POST /dmc/program-elements"
              payload: { program_id: "${prog_id}", supplier_id: "${s1}", venue_id: "${v1}", element_type: "ACTIVITY", title: "Supplier One Activity", starts_at: "2026-09-11T09:00:00Z", ends_at: "2026-09-11T11:00:00Z", planned_headcount: 20, guaranteed_headcount: 20, per_person_cost_cents: 4000, expected_program_version: "${prog_v1}" }
              as: ProgramDirector
              captures: { el1: $.data.id }
            - call: "GET /dmc/programs/${prog_id}"
              payload: {}
              as: ProgramDirector
              captures: { prog_v2: $.data.version }
            - call: "POST /dmc/program-elements"
              payload: { program_id: "${prog_id}", supplier_id: "${s2}", venue_id: "${v2}", element_type: "DINE_AROUND", title: "Supplier Two Dinner", starts_at: "2026-09-11T09:00:00Z", ends_at: "2026-09-11T11:00:00Z", planned_headcount: 20, guaranteed_headcount: 20, per_person_cost_cents: 5000, expected_program_version: "${prog_v2}" }
              as: ProgramDirector
              captures: { el2: $.data.id }
            - call: "POST /dmc/supplier-contracts"
              payload: { program_id: "${prog_id}", supplier_id: "${s1}", contract_value_cents: 80000, required_liability_limit_cents: 100000000, deposit_pct: 0.3, cancellation_tier: "STANDARD" }
              as: SupplierManager
              captures: { c1: $.data.id }
            - call: "POST /dmc/supplier-contracts"
              payload: { program_id: "${prog_id}", supplier_id: "${s2}", contract_value_cents: 100000, required_liability_limit_cents: 100000000, deposit_pct: 0.3, cancellation_tier: "STRICT" }
              as: SupplierManager
              captures: { c2: $.data.id }
          trigger:
            - call: "GET /dmc/supplier-contracts?program_id=${prog_id}&limit=10&offset=0"
              payload: {}
              as: SupplierManager
            - call: "GET /dmc/supplier-contracts?supplier_id=${s2}&limit=10&offset=0"
              payload: {}
              as: SupplierManager
            - call: "GET /dmc/program-elements?supplier_id=${s2}&limit=10&offset=0"
              payload: {}
              as: ProgramDirector
          assert:
            - "the first trigger call returns total_count == 2"
            - "the second trigger call returns total_count == 1 with data[0].id == ${c2}"
            - "the third trigger call returns total_count == 1 with data[0].id == ${el2}"
            - "Program.${prog_id}.element_count == 2"

      - name: self_referential_predecessor_cycle_rejected_on_patch
        claim_type: graph
        grounds:
          - entities.ProgramElement.fields.predecessor_element_id
          - "validations[priority=28]"
          - "errors[ERR_ELEMENT_DEPENDENCY_CYCLE]"
        distinguishing_aspect: "With B already depending on A, patching A to depend on B closes a two-node cycle in the production timeline and is rejected with HTTP 422 ERR_ELEMENT_DEPENDENCY_CYCLE, leaving A.predecessor_element_id null."
        test_recipe:
          setup:
            - "Logical clock 2026-08-01T00:00:00Z; one Venue with turnover_buffer_minutes 90; one APPROVED Supplier; one DRAFT Program 2026-09-10..2026-09-14."
            - "Element A 2026-09-11T09:00Z..11:00Z with no predecessor; Element B 2026-09-11T12:30Z..14:30Z with predecessor_element_id = A (12:30Z respects A's 90-minute turnover buffer)."
          setup_api_calls:
            - call: "POST /dmc/venues"
              payload: { name: "Cycle Test Venue", capacity_seated: 100, capacity_reception: 200, turnover_buffer_minutes: 90, requires_special_venue_permit: false, status: "ACTIVE" }
              as: ProgramDirector
              captures: { venue_id: $.data.id }
            - call: "POST /dmc/suppliers"
              payload: { legal_name: "Cycle Test Supplier", supplier_type: "ACTIVITY", insurance_expires_on: "2027-01-31", insurance_liability_limit_cents: 500000000, coi_verified: true, status: "APPROVED" }
              as: SupplierManager
              captures: { sup_id: $.data.id }
            - call: "POST /dmc/programs"
              payload: { client_name: "Cycle Client", group_name: "Cycle Group", arrival_date: "2026-09-10", departure_date: "2026-09-14", guaranteed_count: 20, markup_pct: 0.18 }
              as: ProgramDirector
              captures: { prog_id: $.data.id, prog_v1: $.data.version }
            - call: "POST /dmc/program-elements"
              payload: { program_id: "${prog_id}", supplier_id: "${sup_id}", venue_id: "${venue_id}", element_type: "ACTIVITY", title: "Element A", starts_at: "2026-09-11T09:00:00Z", ends_at: "2026-09-11T11:00:00Z", planned_headcount: 20, guaranteed_headcount: 20, per_person_cost_cents: 4000, expected_program_version: "${prog_v1}" }
              as: ProgramDirector
              captures: { el_a: $.data.id }
            - call: "GET /dmc/programs/${prog_id}"
              payload: {}
              as: ProgramDirector
              captures: { prog_v2: $.data.version }
            - call: "POST /dmc/program-elements"
              payload: { program_id: "${prog_id}", supplier_id: "${sup_id}", venue_id: "${venue_id}", element_type: "ACTIVITY", title: "Element B", starts_at: "2026-09-11T12:30:00Z", ends_at: "2026-09-11T14:30:00Z", planned_headcount: 20, guaranteed_headcount: 20, per_person_cost_cents: 4000, predecessor_element_id: "${el_a}", expected_program_version: "${prog_v2}" }
              as: ProgramDirector
              captures: { el_b: $.data.id }
          trigger:
            - call: "PATCH /dmc/program-elements/${el_a}"
              payload: { predecessor_element_id: "${el_b}" }
              as: ProgramDirector
              captures: { err: $.data.error_id }
          assert:
            - "trigger returns HTTP 422"
            - "${err} == ERR_ELEMENT_DEPENDENCY_CYCLE"
            - "ProgramElement.${el_a}.predecessor_element_id == null"
            - "ProgramElement.${el_b}.predecessor_element_id == ${el_a}"

  # ===========================================================================
  - section: state_machines
    instances:

      - name: new_program_element_starts_in_planned
        claim_type: initial_state
        grounds: [state_machines.ProgramElement, entities.ProgramElement.fields.status]
        distinguishing_aspect: "A freshly created ProgramElement is in PLANNED with delivered_at null, actual_headcount null and cancellation_penalty_cents 0."
        test_recipe:
          setup: ["Logical clock 2026-08-01T00:00:00Z; one Venue; one APPROVED Supplier; one DRAFT Program 2026-09-10..2026-09-14."]
          setup_api_calls:
            - call: "POST /dmc/venues"
