              as: Booker
              captures: { show_id: $.data.id }
            - call: "POST /performers"
              payload: { stage_name: "Max Counter", email: "max@x.com", standard_fee_cents: 20000 }
              as: Booker
              captures: { perf_id: $.data.id }
            - call: "POST /lineup-slots"
              payload: { show_id: "${show_id}", performer_id: "${perf_id}", slot_order: 1, role: "FEATURE", offered_fee_cents: 20000 }
              as: Booker
              captures: { slot_id: $.data.id }
            - call: "POST /lineup-slots/${slot_id}/counter"
              payload: { counter_fee_cents: 21000 }
              as: Performer
              as_user_id: "${perf_id}"
            - call: "POST /lineup-slots/${slot_id}/revise-offer"
              payload: { new_offered_fee_cents: 21500 }
              as: Booker
            - call: "POST /lineup-slots/${slot_id}/counter"
              payload: { counter_fee_cents: 22000 }
              as: Performer
              as_user_id: "${perf_id}"
            - call: "POST /lineup-slots/${slot_id}/revise-offer"
              payload: { new_offered_fee_cents: 22500 }
              as: Booker
            - call: "POST /lineup-slots/${slot_id}/counter"
              payload: { counter_fee_cents: 23000 }
              as: Performer
              as_user_id: "${perf_id}"
          trigger:
            - call: "POST /lineup-slots/${slot_id}/revise-offer"
              payload: { new_offered_fee_cents: 23500 }
              as: Booker
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_COUNTER_LIMIT_REACHED (counter_rounds == 3 == MAX_COUNTER_ROUNDS; revise blocked)"
            - "http status == 409"

  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: reservation_seat_requires_show_on_sale
        grounds:
          - state_machines.Reservation.BOOKED_to_SEATED
          - state_machines.Show.ON_SALE_to_CANCELLED
          - entities.Show.fields.status
        distinguishing_aspect: "Entity pair (Reservation, Show): a Reservation may only move BOOKED->SEATED while its Show.status IN {ON_SALE, SOLD_OUT}; once the Show is CANCELLED the seat transition is rejected with ERR_INVALID_STATE."
        test_recipe:
          setup:
            - "TABLE show, reservation assigned to a table while ON_SALE, then the Show is CANCELLED (which cancels the reservation); a seat attempt afterward must fail because the show is not ON_SALE/SOLD_OUT."
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "CrossA Venue", settlement_currency: "USD" }
              as: Booker
              captures: { venue_id: $.data.id }
            - call: "POST /venues/${venue_id}/shows"
              payload: { title: "CrossA Night", starts_at: "2026-04-12T03:00:00Z", ends_at: "2026-04-12T05:00:00Z" }
              as: Booker
              captures: { show_id: $.data.id }
            - call: "POST /venues/${venue_id}/shows/${show_id}/sections"
