      - name: certificate_parallel_status_and_war_axes_corner
        claim_type: parallel_state_dimensions
        grounds:
          - state_machines.Certificate.status
          - state_machines.Certificate.war_cover_status
          - complexity_profile.state_machine_shape
        distinguishing_aspect: |
          The two axes are independent: a transit-status move must not touch the war
          axis and a war-cover move must not touch the transit status.
        excluded_because:
          difficulty_instance: non_linear_state_machine / certificate_transit_and_war_axes_advance_independently
          rationale: "The two independent Certificate axes (status TRANSIT_ENDED while war_cover_status moves ATTACHED -> TERMINATED -> REINSTATED) and the correctness of the combined state are asserted end-to-end by the named §1.8 instance."

      - name: claim_file_cyclic_rework_loop_corner
        claim_type: cyclic_loop_back
        grounds:
          - state_machines.ClaimFile.status.DOCS_INCOMPLETE_to_SURVEY_ORDERED
          - state_machines.ClaimFile.status.SURVEY_RECEIVED_to_DOCS_INCOMPLETE
          - complexity_profile.state_machine_shape
        distinguishing_aspect: |
          The claim can re-enter SURVEY_ORDERED after DOCS_INCOMPLETE, so the loop is
          traversable more than once without losing earlier documents.
        excluded_because:
          difficulty_instance: non_linear_state_machine / claim_file_docs_incomplete_resurvey_cycle
          rationale: "The SURVEY_RECEIVED -> DOCS_INCOMPLETE -> SURVEY_ORDERED -> SURVEY_RECEIVED loop, its second traversal and the loop-exit condition are asserted by the named §1.8 instance."

      - name: accumulation_entry_release_ledger_sync_corner
        claim_type: ledger_sync
        grounds:
          - state_machines.AccumulationEntry.status.ACTIVE_to_RELEASED
          - entities.Vessel.fields.accumulated_insured_value
          - entities.Port.fields.accumulated_insured_value
        distinguishing_aspect: |
          Releasing an entry must decrement exactly the vessel and port ledgers that
          the entry booked, leaving the historical booked aggregates untouched.
        excluded_because:
          difficulty_instance: compensating_invariant / issue_then_cancel_conserves_exposure_and_net_premium
          rationale: "Before/after reconciliation of the Vessel and Port accumulated_insured_value ledgers against the AccumulationEntry rows released by a cancellation is the conserved quantity asserted by the named §1.8 instance."

      - name: survey_order_cancel_compensation_corner
        claim_type: compensation
        grounds:
          - state_machines.SurveyOrder.status.APPOINTED_to_CANCELLED
          - entities.Surveyor.fields.booked_minutes_total
          - endpoints.POST /survey-orders/{id}/cancel
        distinguishing_aspect: |
          Cancelling an appointment must return booked_minutes_total to its
          pre-appointment value, with no residual buffer minutes left behind.
        excluded_because:
          difficulty_instance: compensating_invariant / appoint_then_cancel_conserves_surveyor_booked_minutes
          rationale: "The cancel leg's compensation — booked_minutes_total returning to its pre-appointment total with no drift, and the claim leaving SURVEY_ORDERED — is asserted by the named §1.8 instance."

  - section: calculations
