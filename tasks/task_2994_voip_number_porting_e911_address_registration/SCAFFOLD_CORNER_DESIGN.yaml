              as: NumberingAdmin
              captures: { blk_id: $.data.id }
            - call: "POST /voip/number-blocks/${blk_id}/phone-numbers"
              payload: { line_number: "4501" }
              as: NumberingAdmin
              captures: { pn1_id: $.data.id }
            - call: "POST /voip/devices"
              payload: { account_id: "${acct_id}", mac_address: "AABBCC004501", device_type: "HANDSET", nomadic: false, assigned_number_id: "${pn1_id}" }
              as: AccountAdmin
              as_user_id: "${acct_id}"
              captures: { dev_id: $.data.id, dev_v1: $.data.version }
            - call: "POST /voip/e911-registrations"
              payload: { device_id: "${dev_id}", jurisdiction_id: "${jur_id}", address_line1: "45 VETCH VALE", unit: "", city: "OAKLAND", state_code: "CA", postal_code: "94601" }
              as: AccountAdmin
              as_user_id: "${acct_id}"
              captures: { reg_id: $.data.id }
            - call: "POST /voip/e911-registrations/${reg_id}/verify"
              payload: { outcome: "VERIFIED" }
              as: E911Validator
          trigger:
            - call: "POST /voip/devices/${dev_id}/calling-restrictions"
              payload: { action: "BLOCK_INTL", note: "subscriber request" }
              as: AccountAdmin
              as_user_id: "${acct_id}"
            - call: "POST /voip/devices/${dev_id}/calling-restrictions"
              payload: { action: "BLOCK_INTL", note: "analyst hold" }
