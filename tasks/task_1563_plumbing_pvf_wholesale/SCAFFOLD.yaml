# =============================================================================
# PRD Benchmark Seed Tables — Plumbing & PVF Wholesale Distribution
# =============================================================================

scenario: |
  Plumbing & PVF Wholesale (Ferguson style): counter vs project pricing, pipe/valve/fitting takeoff & kitting by floor, showroom special-order & customer selection sheet, will-call staging & jobsite delivery window, contractor account terms & job costing, return of cut/custom items, manufacturer stocking program, backorder & substitute approval

domain_name: plumbing-pvf-wholesale
api_prefix: /pvf

# =============================================================================
# Step 0: Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: pricing_engine        # counter vs project pricing, tier discounts, volume tiers, override floors, rebate tiers
  secondary_archetype: quota_allocation    # per-branch inventory reservation, backorder waterfall, truck-cube capacity per delivery slot
  complexity_layers:
    - optimistic_concurrency               # OCC on Quote (revision supersede), Order (delivery booking), OrderLine (substitute decision)
    - cascading_side_effects               # receipt -> stock -> backorder line -> order wave -> kit posture; return -> stock -> allocation + account balance -> hold release
    - dual_variant_calculation             # job costing (provisional vs final); credit exposure (forward-looking vs chronological statement)
    - rate_threshold_triggers              # credit-hold engage/release hysteresis; rebate tier attainment; volume/freight tier boundaries
  entity_topology: flat                    # peer entities with FK references; no nesting in URL paths beyond reverse-reachability GETs
  state_machine_shape: branching           # cyclic (Quote revision loop, SelectionSheet revise loop, Account hold cycle), parallel (Order payment x fulfillment), compound (Kit posture from lines)
  relationship_patterns:
    - one_to_many                          # Account -> Orders/Quotes/Sheets/Payments; Order -> Lines/Kits/Returns
    - self_referential                     # Quote.supersedes_quote_id (revision chain)
    - cross_aggregate                      # OrderLine.kit_id, Order.delivery_slot_id, OrderLine.proposed_substitute_product_id
  role_model: segregation_of_duties        # return submitter cannot decide; price override is manager-only; substitute proposed by sales, decided by contractor
  consistency_model: immediate             # every mutation + cascades visible in the same response envelope

# =============================================================================
# 1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Branch
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Branch display name" }
      - { name: code, type: string, source: input, description: "Short branch code; unique across all branches", constraints: "unique" }

  - name: Product
    parent: null
    common_fields: true
    fields:
      - { name: sku, type: string, source: input, description: "Stock keeping unit; unique", constraints: "unique" }
      - { name: description, type: string, source: input, description: "Catalog description" }
      - { name: category, type: enum, source: input, description: "PIPE | VALVE | FITTING | FIXTURE", constraints: "enum {PIPE, VALVE, FITTING, FIXTURE}" }
      - { name: list_price_cents, type: integer, source: input, description: "Catalog list price per unit (per foot when is_cut_to_order); >= 1", constraints: ">= 1" }
      - { name: cost_cents, type: integer, source: input, description: "Branch replacement cost per unit; price-floor anchor", constraints: ">= 0" }
      - { name: manufacturer_name, type: string, source: input, description: "Manufacturer label; joins to ManufacturerProgram.manufacturer_name for rebate accrual" }
      - { name: cubes_per_unit, type: integer, source: input, description: "Truck cubic units per unit; drives delivery slot capacity", constraints: ">= 0" }
      - { name: is_cut_to_order, type: boolean, source: input, default: false, description: "Cut-to-length item; sold per foot, non-returnable" }
      - { name: is_special_order, type: boolean, source: input, default: false, description: "Special-order (showroom) item; non-returnable" }
      - { name: substitute_group, type: string, source: input, default: null, description: "Products sharing a non-null group are valid mutual substitutes" }
      - { name: promo_price_cents, type: integer, source: input, default: null, description: "Branch counter promotional price; applies to COUNTER orders only, never to Quote lines", constraints: ">= 1 when present" }

  - name: ContractorAccount
    parent: null
    common_fields: true
    fields:
      - { name: company_name, type: string, source: input, description: "Contractor company name" }
      - { name: pricing_tier, type: enum, source: input, description: "STANDARD | SILVER | GOLD | PLATINUM — maps to discount pct in counter_price_resolution", constraints: "enum {STANDARD, SILVER, GOLD, PLATINUM}" }
      - { name: terms, type: enum, source: input, description: "COD | NET_15 | NET_30", constraints: "enum {COD, NET_15, NET_30}" }
      - { name: credit_limit_cents, type: integer, source: input, description: "Credit ceiling evaluated against forward exposure at order submit", constraints: ">= 0" }
      - { name: status, type: enum, source: system, default: "ACTIVE", description: "ACTIVE | CREDIT_HOLD | SUSPENDED", constraints: "enum {ACTIVE, CREDIT_HOLD, SUSPENDED}" }
      - { name: outstanding_balance_cents, type: integer, source: computed, description: "Chronological statement balance: sum of totals of orders with payment_status IN {INVOICED, PAID} minus sum of Payment.amount_cents minus sum of ReturnRequest.credit_cents for CREDITED returns" }
      - { name: forward_exposure_cents, type: integer, source: computed, description: "Forward-looking exposure: outstanding_balance_cents + sum of total_cents of orders with payment_status == UNINVOICED and fulfillment_status NOT IN {DRAFT, CANCELLED}" }
      - { name: available_credit_cents, type: integer, source: computed, description: "credit_limit_cents - forward_exposure_cents (may go negative)" }

  - name: ManufacturerProgram
    parent: null
    common_fields: true
    fields:
      - { name: manufacturer_name, type: string, source: input, description: "Manufacturer this stocking program covers; matches Product.manufacturer_name" }
      - { name: period_start, type: datetime, source: input, description: "Program accrual period start (inclusive boundary)" }
      - { name: period_end, type: datetime, source: input, description: "Program accrual period end (inclusive boundary; closed interval — touching periods conflict)", constraints: "period_end > period_start" }
      - { name: tiers, type: array, source: input, description: "Rebate tiers [{threshold_cents, rebate_pct}] ascending by threshold; attainment uses >= on threshold_cents", constraints: ">= 1 tier; threshold_cents strictly ascending; rebate_pct integer percent 1..50" }
      - { name: committed_stock_value_cents, type: integer, source: input, description: "Contracted stocking commitment recorded at program creation", constraints: ">= 0" }
      - { name: purchases_cents, type: integer, source: computed, description: "Accumulator: sum of receipt line qty * unit_cost_cents for products whose manufacturer_name matches and whose received_at falls inside [period_start, period_end]" }
      - { name: attained_rebate_pct, type: integer, source: computed, description: "Highest tier pct whose threshold_cents <= purchases_cents; set at close, else null", default: null }
      - { name: earned_rebate_cents, type: integer, source: computed, description: "round_half_up(purchases_cents * attained_rebate_pct / 100); set at close, else null", default: null }
      - { name: status, type: enum, source: system, default: "ACTIVE", description: "ACTIVE | CLOSED | SETTLED", constraints: "enum {ACTIVE, CLOSED, SETTLED}" }

  - name: InventoryStock
    parent: null
    common_fields: true
    fields:
      - { name: branch_id, type: string, source: input, description: "FK -> Branch.id; stocking branch" }
      - { name: product_id, type: string, source: input, description: "FK -> Product.id; stocked product" }
      - { name: on_hand, type: integer, source: system, default: 0, description: "Physical units on hand; mutated by receipts, staging (pick), and return restock" }
      - { name: reserved, type: integer, source: system, default: 0, description: "Units reserved to ALLOCATED order lines; released on fulfill/cancel" }
      - { name: available, type: integer, source: computed, description: "on_hand - reserved; invariant: available == on_hand - reserved at all times", constraints: "unique (branch_id, product_id) pair" }

  - name: StockReceipt
    parent: null
    common_fields: true
    fields:
      - { name: branch_id, type: string, source: input, description: "FK -> Branch.id; receiving branch" }
      - { name: lines, type: array, source: input, description: "Received lines [{product_id, qty, unit_cost_cents}]; qty >= 1, unit_cost_cents >= 0", constraints: ">= 1 line" }
      - { name: received_at, type: datetime, source: system, description: "Logical clock timestamp at posting; drives program accrual window membership" }
      - { name: posted_by, type: string, source: system, description: "X-User-ID of the posting WarehouseLead" }
      - { name: status, type: enum, source: system, default: "POSTED", description: "POSTED (receipts are append-only, single state)" }

  - name: Payment
    parent: null
    common_fields: true
    fields:
      - { name: account_id, type: string, source: input, description: "FK -> ContractorAccount.id; paying account" }
      - { name: amount_cents, type: integer, source: input, description: "Payment amount", constraints: ">= 1" }
      - { name: method, type: enum, source: input, description: "CHECK | ACH | CARD", constraints: "enum {CHECK, ACH, CARD}" }
      - { name: allocations, type: array, source: input, default: null, description: "Optional explicit [{order_id, amount_cents}]; when omitted, payment_auto_allocation runs FIFO over INVOICED orders" }
      - { name: applied_at, type: datetime, source: system, description: "Logical clock timestamp at posting" }
      - { name: status, type: enum, source: system, default: "APPLIED", description: "APPLIED (payments are append-only, single state)" }

  - name: Quote
    parent: null
    common_fields: true
    fields:
      - { name: account_id, type: string, source: input, description: "FK -> ContractorAccount.id; bid recipient" }
      - { name: branch_id, type: string, source: input, description: "FK -> Branch.id; quoting branch" }
      - { name: job_name, type: string, source: input, description: "Project/job label used for job costing grouping" }
      - { name: valid_until, type: datetime, source: input, description: "Bid validity deadline; SUBMITTED quotes expire when logical clock passes this" }
      - { name: lines, type: array, source: input, description: "Bid lines [{product_id, qty, unit_price_cents}]; unit_price_cents is the explicit project price and must satisfy the price floor (cost_cents * 1.05 rounded up)", constraints: ">= 1 line; qty >= 1" }
      - { name: revision_no, type: integer, source: system, default: 1, description: "Revision number; increments on each superseding revision" }
      - { name: supersedes_quote_id, type: string, source: system, default: null, description: "FK -> Quote.id; previous revision this quote supersedes (self-referential revision chain)" }
      - { name: status, type: enum, source: system, default: "DRAFT", description: "DRAFT | SUBMITTED | AWARDED | REVISED | LOST | EXPIRED | CONVERTED", constraints: "enum {DRAFT, SUBMITTED, AWARDED, REVISED, LOST, EXPIRED, CONVERTED}" }
      - { name: volume_discount_pct, type: integer, source: computed, description: "Volume tier pct selected on the PRE-discount subtotal (document_totals evaluation order)" }
      - { name: subtotal_cents, type: integer, source: computed, description: "Sum of line extensions (qty * unit_price_cents)" }
      - { name: discount_cents, type: integer, source: computed, description: "round_half_up(subtotal_cents * volume_discount_pct / 100)" }
      - { name: freight_cents, type: integer, source: computed, description: "Freight tier evaluated on POST-discount subtotal: 0 when >= FREIGHT_FREE_THRESHOLD_CENTS else FLAT_FREIGHT_CENTS" }
      - { name: total_cents, type: integer, source: computed, description: "subtotal_cents - discount_cents + freight_cents" }
      - { name: awarded_at, type: datetime, source: system, default: null, description: "Logical clock timestamp of award" }

  - name: SelectionSheet
    parent: null
    common_fields: true
    fields:
      - { name: account_id, type: string, source: input, description: "FK -> ContractorAccount.id; showroom account" }
      - { name: branch_id, type: string, source: input, description: "FK -> Branch.id; showroom branch" }
      - { name: customer_name, type: string, source: input, description: "Homeowner / end customer name on the selection sheet" }
      - { name: selections, type: array, source: input, description: "Fixture selections [{product_id, finish, qty}]; every product must have category == FIXTURE or is_special_order == true", constraints: ">= 1 selection; qty >= 1" }
      - { name: status, type: enum, source: system, default: "DRAFT", description: "DRAFT | PRESENTED | APPROVED | REVISED | ORDERED", constraints: "enum {DRAFT, PRESENTED, APPROVED, REVISED, ORDERED}" }
      - { name: approved_at, type: datetime, source: system, default: null, description: "Logical clock timestamp of customer approval" }

  - name: Order
    parent: null
    common_fields: true
    fields:
      - { name: account_id, type: string, source: input, description: "FK -> ContractorAccount.id; buying account" }
      - { name: branch_id, type: string, source: input, description: "FK -> Branch.id; fulfilling branch" }
      - { name: quote_id, type: string, source: system, default: null, description: "FK -> Quote.id; set when source == PROJECT (created by quote convert)" }
      - { name: sheet_id, type: string, source: system, default: null, description: "FK -> SelectionSheet.id; set when source == SHOWROOM (created by sheet convert)" }
      - { name: delivery_slot_id, type: string, source: system, default: null, description: "FK -> DeliverySlot.id; active delivery booking, set by delivery-booking, cleared by booking cancel" }
      - { name: source, type: enum, source: system, default: "COUNTER", description: "COUNTER | PROJECT | SHOWROOM", constraints: "enum {COUNTER, PROJECT, SHOWROOM}" }
      - { name: job_name, type: string, source: input, default: null, description: "Job costing grouping label; PROJECT orders inherit the quote's job_name" }
      - { name: will_call, type: boolean, source: input, default: false, description: "true = will-call pickup path (STAGED -> PICKED_UP); false = jobsite delivery path (STAGED -> DISPATCHED -> DELIVERED)" }
      - { name: payment_status, type: enum, source: system, default: "UNINVOICED", description: "UNINVOICED | INVOICED | PAID — parallel dimension 1", constraints: "enum {UNINVOICED, INVOICED, PAID}" }
      - { name: fulfillment_status, type: enum, source: system, default: "DRAFT", description: "DRAFT | OPEN | PICKING | STAGED | DISPATCHED | DELIVERED | PICKED_UP | CANCELLED — parallel dimension 2", constraints: "enum {DRAFT, OPEN, PICKING, STAGED, DISPATCHED, DELIVERED, PICKED_UP, CANCELLED}" }
      - { name: volume_discount_pct, type: integer, source: computed, description: "Volume tier pct; COUNTER/SHOWROOM orders re-tier on every line mutation, PROJECT orders copy the locked pct from the source quote" }
      - { name: subtotal_cents, type: integer, source: computed, description: "Sum of non-CANCELLED line line_total_cents" }
      - { name: discount_cents, type: integer, source: computed, description: "round_half_up(subtotal_cents * volume_discount_pct / 100)" }
      - { name: freight_cents, type: integer, source: computed, description: "Freight tier on POST-discount subtotal" }
      - { name: total_cents, type: integer, source: computed, description: "subtotal_cents - discount_cents + freight_cents" }
      - { name: cubes_total, type: integer, source: computed, description: "Sum over non-CANCELLED lines of qty_allocated * product.cubes_per_unit; basis for delivery slot booking" }
      - { name: invoiced_at, type: datetime, source: system, default: null, description: "Logical clock timestamp when payment_status became INVOICED; drives payment FIFO allocation order" }

  - name: OrderLine
    parent: null
    common_fields: true
    fields:
      - { name: order_id, type: string, source: system, description: "FK -> Order.id; owning order (path-scoped at creation)" }
      - { name: product_id, type: string, source: input, description: "FK -> Product.id; ordered product (swapped on substitute approval)" }
      - { name: kit_id, type: string, source: system, default: null, description: "FK -> Kit.id; kit assignment when takeoff kitting groups the line" }
      - { name: qty_ordered, type: integer, source: input, description: "Units ordered (number of cuts when product.is_cut_to_order)", constraints: ">= 1" }
      - { name: cut_length_ft, type: integer, source: input, default: null, description: "Feet per cut; required iff product.is_cut_to_order, forbidden otherwise", constraints: ">= 1 when present" }
      - { name: price_override_cents, type: integer, source: input, default: null, description: "Manual unit price; BranchManager only, must satisfy price floor" }
      - { name: unit_price_cents, type: integer, source: system, description: "Resolved unit price from counter_price_resolution (COUNTER), quote lock (PROJECT), or list price (SHOWROOM)" }
      - { name: price_source, type: enum, source: system, description: "COUNTER_TIER | PROMO | MANUAL_OVERRIDE | QUOTE_LOCKED | SHOWROOM_LIST", constraints: "enum {COUNTER_TIER, PROMO, MANUAL_OVERRIDE, QUOTE_LOCKED, SHOWROOM_LIST}" }
      - { name: qty_allocated, type: integer, source: system, default: 0, description: "Units reserved in InventoryStock for this line" }
      - { name: qty_backordered, type: integer, source: computed, description: "qty_ordered - qty_allocated - qty_fulfilled while unfulfilled; 0 once FILLED or CANCELLED" }
      - { name: qty_fulfilled, type: integer, source: system, default: 0, description: "Units picked at mark-staged" }
      - { name: qty_returned, type: integer, source: system, default: 0, description: "Units restocked via CREDITED returns" }
      - { name: status, type: enum, source: system, default: "OPEN", description: "OPEN | ALLOCATED | BACKORDERED | FILLED | CANCELLED", constraints: "enum {OPEN, ALLOCATED, BACKORDERED, FILLED, CANCELLED}" }
      - { name: substitute_status, type: enum, source: system, default: "NONE", description: "NONE | PROPOSED | APPROVED | REJECTED — parallel substitution dimension", constraints: "enum {NONE, PROPOSED, APPROVED, REJECTED}" }
      - { name: proposed_substitute_product_id, type: string, source: system, default: null, description: "FK -> Product.id; pending substitute awaiting contractor decision" }
      - { name: line_total_cents, type: integer, source: computed, description: "qty_ordered * unit_price_cents; for cut items qty_ordered * cut_length_ft * unit_price_cents (price per foot)" }

  - name: Kit
    parent: null
    common_fields: true
    fields:
      - { name: order_id, type: string, source: system, description: "FK -> Order.id; kitted order (path-scoped at creation)" }
      - { name: floor_label, type: string, source: input, description: "Floor/zone label from the takeoff (e.g. 'F2', 'MECH-ROOM')" }
      - { name: status, type: enum, source: system, default: "DRAFT", description: "DRAFT | ASSEMBLED | STAGED | RELEASED; DRAFT -> ASSEMBLED is automatic when every member line is ALLOCATED or FILLED", constraints: "enum {DRAFT, ASSEMBLED, STAGED, RELEASED}" }
      - { name: staging_bin, type: string, source: system, default: null, description: "Will-call staging bin assigned at stage; bin occupancy enforces a 2-hour turnaround buffer" }
      - { name: staged_window_start, type: datetime, source: system, default: null, description: "Staging window start (input at stage)" }
      - { name: staged_window_end, type: datetime, source: system, default: null, description: "Staging window end (input at stage); occupancy extends to staged_window_end + WILL_CALL_BUFFER_HOURS" }

  - name: DeliverySlot
    parent: null
    common_fields: true
    fields:
      - { name: branch_id, type: string, source: system, description: "FK -> Branch.id; slot-owning branch (path-scoped at creation)" }
      - { name: truck_label, type: string, source: input, description: "Truck resource label within the branch; half-open [window_start, window_end) intervals on the same truck may not overlap (touching is allowed)" }
      - { name: window_start, type: datetime, source: input, description: "Delivery window start" }
      - { name: window_end, type: datetime, source: input, description: "Delivery window end", constraints: "window_end > window_start" }
      - { name: capacity_cubes, type: integer, source: input, description: "Truck capacity in cube units for this window", constraints: ">= 1" }
      - { name: booked_cubes, type: integer, source: system, default: 0, description: "Sum of cubes_total of orders holding an active booking; booking allowed while booked_cubes + order cubes_total <= capacity_cubes (equality allowed)" }
      - { name: status, type: enum, source: system, default: "OPEN", description: "OPEN | FULL | COMPLETED | CANCELLED; OPEN <-> FULL is automatic on booked_cubes vs capacity_cubes", constraints: "enum {OPEN, FULL, COMPLETED, CANCELLED}" }

  - name: ReturnRequest
    parent: null
    common_fields: true
    fields:
      - { name: order_id, type: string, source: input, description: "FK -> Order.id; order being returned against" }
      - { name: reason, type: string, source: input, description: "Free-text return reason" }
      - { name: lines, type: array, source: input, description: "Return lines [{order_line_id, qty}]; every order_line_id must belong to order_id", constraints: ">= 1 line; qty >= 1" }
      - { name: status, type: enum, source: system, default: "DRAFT", description: "DRAFT | SUBMITTED | APPROVED | REJECTED | CREDITED", constraints: "enum {DRAFT, SUBMITTED, APPROVED, REJECTED, CREDITED}" }
      - { name: submitted_by, type: string, source: system, default: null, description: "X-User-ID of the CounterRep who submitted; segregation of duties forbids the same id deciding" }
      - { name: decided_by, type: string, source: system, default: null, description: "X-User-ID of the BranchManager who decided" }
      - { name: submitted_at, type: datetime, source: system, default: null, description: "Logical clock timestamp of submission; return window measured from fulfillment to submitted_at" }
      - { name: restocking_fee_cents, type: integer, source: computed, description: "Sum of per-line fees: round_half_up(line_return_value_cents * fee_pct) computed PER LINE then summed (pinned rounding order)" }
      - { name: credit_cents, type: integer, source: computed, description: "Sum of per-line return values (qty * unit_price_cents, cut items use qty * cut_length_ft * unit_price_cents) minus restocking_fee_cents; freight never credited" }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: ContractorAccount
    initial_state: ACTIVE
    terminal_states: []
    note: "Cyclic automatic credit cycle with hysteresis plus past-due aging: engage when balance strictly exceeds the limit (reachable via ADJUST_LIMIT tightening) or when any INVOICED order is past due under the account terms; release only at or below 80% of the limit AND with no past-due invoices."
    transitions:
      - from: ACTIVE
        to: CREDIT_HOLD
        trigger: "system (automatic after any outstanding_balance_cents recompute or logical-clock advance, when EITHER outstanding_balance_cents > credit_limit_cents (strictly greater; equality does NOT engage) OR an INVOICED order is past due: logical clock > invoiced_at + TERMS_DAYS[account.terms])"
        actor: system
        preconditions: ["balance over limit OR past-due invoice exists"]
        side_effects: ["ContractorAccount.version increments by 1"]
      - from: CREDIT_HOLD
        to: ACTIVE
        trigger: "system (automatic after any outstanding_balance_cents recompute or logical-clock advance when BOTH conditions clear)"
        actor: system
        preconditions: ["outstanding_balance_cents <= round_half_up(0.80 * credit_limit_cents) (equality releases)", "no INVOICED order past due (logical clock <= invoiced_at + TERMS_DAYS[terms] for every unpaid invoice)"]
        side_effects: ["ContractorAccount.version increments by 1"]
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /pvf/contractor-accounts/{id}/credit-review with action=SUSPEND"
        actor: BranchManager
        preconditions: []
        side_effects: ["ContractorAccount.version increments by 1"]
      - from: CREDIT_HOLD
        to: SUSPENDED
        trigger: "POST /pvf/contractor-accounts/{id}/credit-review with action=SUSPEND"
        actor: BranchManager
        preconditions: []
        side_effects: ["ContractorAccount.version increments by 1"]
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /pvf/contractor-accounts/{id}/credit-review with action=RELEASE_HOLD"
        actor: BranchManager
        preconditions: []
        side_effects: ["ContractorAccount.version increments by 1", "release lands on ACTIVE regardless of balance; the next balance recompute re-engages CREDIT_HOLD if still over limit"]
      - from: CREDIT_HOLD
        to: ACTIVE
        trigger: "POST /pvf/contractor-accounts/{id}/credit-review with action=RELEASE_HOLD"
        actor: BranchManager
        preconditions: []
        side_effects: ["ContractorAccount.version increments by 1"]
      - from: ACTIVE
        to: ACTIVE
        trigger: "POST /pvf/contractor-accounts/{id}/credit-review with action=ADJUST_LIMIT"
        actor: BranchManager
        preconditions: ["new_credit_limit_cents >= 0"]
        side_effects: ["credit_limit_cents := new_credit_limit_cents", "recompute forward_exposure_cents/available_credit_cents", "re-evaluate automatic hold/release — tightening the limit below the current balance engages CREDIT_HOLD", "ContractorAccount.version increments by 1"]

  - entity: ManufacturerProgram
    initial_state: ACTIVE
    terminal_states: [SETTLED]
    transitions:
      - from: ACTIVE
        to: CLOSED
        trigger: "POST /pvf/manufacturer-programs/{id}/close"
        actor: BranchManager
        preconditions: ["logical clock > period_end (else ERR_PROGRAM_PERIOD_NOT_ENDED)"]
        side_effects: ["recompute rebate_tier_attainment: set attained_rebate_pct and earned_rebate_cents", "ManufacturerProgram.version increments by 1"]
      - from: CLOSED
        to: SETTLED
        trigger: "POST /pvf/manufacturer-programs/{id}/settle"
        actor: BranchManager
        preconditions: []
        side_effects: ["ManufacturerProgram.version increments by 1"]

  - entity: Quote
    initial_state: DRAFT
    terminal_states: [REVISED, LOST, EXPIRED, CONVERTED]
    note: "Cyclic at the aggregate level: an AWARDED quote spawns a new DRAFT revision (revision_no + 1, supersedes_quote_id -> old quote) while the old row lands in terminal REVISED; the new revision may itself reach AWARDED, forming an award -> revise -> submit -> award loop across the chain."
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /pvf/quotes/{id}/submit"
        actor: InsideSales
        preconditions: ["valid_until > logical clock (else ERR_QUOTE_EXPIRED)"]
        side_effects: ["Quote.version increments by 1"]
      - from: SUBMITTED
        to: AWARDED
        trigger: "POST /pvf/quotes/{id}/award"
        actor: Contractor
        preconditions: ["X-User-ID == quote.account_id (else ERR_FORBIDDEN)", "valid_until > logical clock (else ERR_QUOTE_EXPIRED and quote auto-transitions to EXPIRED)"]
        side_effects: ["awarded_at := logical clock", "prices locked (lines immutable from this point)", "Quote.version increments by 1"]
      - from: SUBMITTED
        to: LOST
        trigger: "POST /pvf/quotes/{id}/lose"
        actor: InsideSales
        preconditions: []
        side_effects: ["Quote.version increments by 1"]
      - from: SUBMITTED
        to: EXPIRED
        trigger: "system (when the logical clock advances past valid_until via POST /pvf/_clock/set_current_utc)"
        actor: system
        preconditions: ["logical clock > valid_until"]
        side_effects: ["Quote.version increments by 1"]
      - from: AWARDED
        to: REVISED
        trigger: "POST /pvf/quotes/{id}/revisions (creates the superseding revision)"
        actor: InsideSales
        preconditions: ["expected_quote_version == quote.version (OCC, else ERR_STALE_QUOTE_VERSION)"]
        side_effects: ["this quote -> REVISED (terminal)", "new Quote created: status DRAFT, revision_no := this.revision_no + 1, supersedes_quote_id := this.id, lines copied unless overridden in payload", "this quote's version increments by 1"]
      - from: AWARDED
        to: CONVERTED
        trigger: "POST /pvf/quotes/{id}/convert"
        actor: InsideSales
        preconditions: []
        side_effects: ["creates Order: source PROJECT, quote_id := this quote, job_name := quote.job_name, one OrderLine per quote line with price_source QUOTE_LOCKED and unit_price_cents from the quote line, volume_discount_pct copied from quote (locked, not re-tiered)", "Quote.version increments by 1"]

  - entity: SelectionSheet
    initial_state: DRAFT
    terminal_states: [ORDERED]
    note: "Cyclic revision loop: APPROVED -> REVISED -> PRESENTED -> APPROVED."
    transitions:
      - from: DRAFT
        to: PRESENTED
        trigger: "POST /pvf/selection-sheets/{id}/present"
        actor: InsideSales
        preconditions: []
        side_effects: ["SelectionSheet.version increments by 1"]
      - from: REVISED
        to: PRESENTED
        trigger: "POST /pvf/selection-sheets/{id}/present"
        actor: InsideSales
        preconditions: []
        side_effects: ["SelectionSheet.version increments by 1"]
      - from: PRESENTED
        to: APPROVED
        trigger: "POST /pvf/selection-sheets/{id}/approve"
        actor: Contractor
        preconditions: ["X-User-ID == sheet.account_id (else ERR_FORBIDDEN)"]
        side_effects: ["approved_at := logical clock", "SelectionSheet.version increments by 1"]
      - from: APPROVED
        to: REVISED
        trigger: "POST /pvf/selection-sheets/{id}/revise (payload carries the replacement selections)"
        actor: InsideSales
        preconditions: []
        side_effects: ["selections replaced by payload", "approved_at := null", "SelectionSheet.version increments by 1"]
      - from: APPROVED
        to: ORDERED
        trigger: "POST /pvf/selection-sheets/{id}/convert"
        actor: InsideSales
        preconditions: []
        side_effects: ["creates Order: source SHOWROOM, sheet_id := this sheet, one OrderLine per selection with price_source SHOWROOM_LIST and unit_price_cents := product.list_price_cents (no contractor tier discount)", "SelectionSheet.version increments by 1"]

  - entity: Order
    initial_state: UNINVOICED
    terminal_states: [PAID]
    note: "PARALLEL DIMENSION 1 of 2 — payment_status. Evolves independently of fulfillment_status except the single defined coupling: fulfillment reaching DELIVERED or PICKED_UP auto-invoices."
    field: payment_status
    transitions:
      - from: UNINVOICED
        to: INVOICED
        trigger: "system (automatic when fulfillment_status reaches DELIVERED via confirm-delivery or PICKED_UP via pickup)"
        actor: system
        preconditions: []
        side_effects: ["invoiced_at := logical clock", "ContractorAccount.outstanding_balance_cents += order.total_cents", "re-evaluate account credit hold (balance > limit engages CREDIT_HOLD)", "Order.version increments by 1"]
      - from: INVOICED
        to: PAID
        trigger: "system (automatic when payment allocations covering this order reach total_cents, via POST /pvf/contractor-accounts/{id}/payments)"
        actor: system
        preconditions: ["sum of allocations to this order >= total_cents"]
        side_effects: ["Order.version increments by 1"]

  - entity: Order
    initial_state: DRAFT
    terminal_states: [DELIVERED, PICKED_UP, CANCELLED]
    note: "PARALLEL DIMENSION 2 of 2 — fulfillment_status. OPEN -> PICKING is an automatic bubble-up from line allocation posture."
    field: fulfillment_status
    transitions:
      - from: DRAFT
        to: OPEN
        trigger: "POST /pvf/orders/{id}/submit"
        actor: CounterRep
        preconditions: ["account.status == ACTIVE (else ERR_ACCOUNT_CREDIT_HOLD)", "account.forward_exposure_cents + order.total_cents <= account.credit_limit_cents (else ERR_CREDIT_LIMIT_EXCEEDED; equality allowed)", "order has >= 1 line"]
        side_effects: ["per line: reserve stock — if InventoryStock.available >= qty_ordered the line becomes ALLOCATED with qty_allocated := qty_ordered and reserved += qty_ordered; else partial/zero allocation and the line becomes BACKORDERED with qty_allocated := available portion", "recompute account.forward_exposure_cents (order now counts)", "Order.version increments by 1"]
      - from: OPEN
        to: PICKING
        trigger: "system (automatic when every non-CANCELLED line is ALLOCATED or FILLED — bubble-up from backorder_allocation or substitute approval)"
        actor: system
        preconditions: ["every line status IN {ALLOCATED, FILLED}"]
        side_effects: ["Order.version increments by 1"]
      - from: PICKING
        to: STAGED
        trigger: "POST /pvf/orders/{id}/mark-staged"
        actor: WarehouseLead
        preconditions: ["if order.will_call AND the order has >= 1 kit: every Kit of the order must be in STAGED (else ERR_INVALID_STATE); a will-call order with no kits stages directly"]
        side_effects: ["per ALLOCATED line: qty_fulfilled := qty_allocated, qty_allocated stays for audit, line -> FILLED; InventoryStock.on_hand -= fulfilled qty and reserved -= fulfilled qty per line product", "Order.version increments by 1"]
      - from: STAGED
        to: DISPATCHED
        trigger: "POST /pvf/orders/{id}/dispatch"
        actor: WarehouseLead
        preconditions: ["order.delivery_slot_id is not null (active booking, else ERR_INVALID_STATE)"]
        side_effects: ["all STAGED kits of the order -> RELEASED", "Order.version increments by 1"]
      - from: DISPATCHED
        to: DELIVERED
        trigger: "POST /pvf/orders/{id}/confirm-delivery"
        actor: WarehouseLead
        preconditions: []
        side_effects: ["payment_status UNINVOICED -> INVOICED cascade (see payment dimension)", "Order.version increments by 1"]
      - from: STAGED
        to: PICKED_UP
        trigger: "POST /pvf/orders/{id}/pickup"
        actor: CounterRep
        preconditions: ["order.will_call == true (else ERR_INVALID_STATE)"]
        side_effects: ["all STAGED kits of the order -> RELEASED", "payment_status UNINVOICED -> INVOICED cascade", "Order.version increments by 1"]
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /pvf/orders/{id}/cancel"
        actor: CounterRep
        preconditions: []
        side_effects: ["no reservations exist in DRAFT; Order.version increments by 1"]
      - from: OPEN
        to: CANCELLED
        trigger: "POST /pvf/orders/{id}/cancel"
        actor: CounterRep
        preconditions: []
        side_effects: ["release all line reservations (reserved -= qty_allocated per line)", "release delivery booking if any (slot booked_cubes -= order.cubes_total, FULL -> OPEN recompute)", "lines OPEN/ALLOCATED/BACKORDERED -> CANCELLED", "recompute account.forward_exposure_cents", "Order.version increments by 1"]
      - from: PICKING
        to: CANCELLED
        trigger: "POST /pvf/orders/{id}/cancel"
        actor: CounterRep
        preconditions: []
        side_effects: ["same release chain as OPEN -> CANCELLED", "Order.version increments by 1"]

  - entity: OrderLine
    initial_state: OPEN
    terminal_states: [FILLED, CANCELLED]
    note: "Parallel substitution dimension (substitute_status NONE -> PROPOSED -> APPROVED|REJECTED) orthogonally to fill status; REJECTED returns the line to the ordinary backorder pool."
    transitions:
      - from: OPEN
        to: ALLOCATED
        trigger: "POST /pvf/orders/{id}/submit (full reservation)"
        actor: CounterRep
        preconditions: ["InventoryStock.available >= qty_ordered at submit"]
        side_effects: ["qty_allocated := qty_ordered", "InventoryStock.reserved += qty_ordered"]
      - from: OPEN
        to: BACKORDERED
        trigger: "POST /pvf/orders/{id}/submit (insufficient stock)"
        actor: CounterRep
        preconditions: ["InventoryStock.available < qty_ordered at submit"]
        side_effects: ["qty_allocated := available portion (may be 0)", "InventoryStock.reserved += allocated portion"]
      - from: BACKORDERED
        to: ALLOCATED
        trigger: "system (backorder_allocation on stock receipt / return restock / substitute approval fills the remaining shortage)"
        actor: system
        preconditions: ["allocated cumulative qty reaches qty_ordered"]
        side_effects: ["InventoryStock.reserved increases by the allocated delta", "order fulfillment bubble-up re-evaluated (OPEN -> PICKING when all lines allocated)"]
      - from: ALLOCATED
        to: FILLED
        trigger: "POST /pvf/orders/{id}/mark-staged"
        actor: WarehouseLead
        preconditions: []
        side_effects: ["qty_fulfilled := qty_allocated", "InventoryStock.on_hand -= qty_allocated; reserved -= qty_allocated"]
      - from: OPEN
        to: CANCELLED
        trigger: "POST /pvf/orders/{id}/cancel"
        actor: CounterRep
        preconditions: []
        side_effects: []
      - from: ALLOCATED
        to: CANCELLED
        trigger: "POST /pvf/orders/{id}/cancel"
        actor: CounterRep
        preconditions: []
        side_effects: ["InventoryStock.reserved -= qty_allocated (compensation)"]
      - from: BACKORDERED
        to: CANCELLED
        trigger: "POST /pvf/orders/{id}/cancel"
        actor: CounterRep
        preconditions: []
        side_effects: ["InventoryStock.reserved -= qty_allocated (partial reservation compensation)"]
      - from: BACKORDERED
        to: BACKORDERED
        trigger: "POST /pvf/order-lines/{id}/substitute-decision with decision=APPROVE (substitute_status PROPOSED -> APPROVED)"
        actor: Contractor
        preconditions: ["substitute_status == PROPOSED", "X-User-ID == order.account_id", "expected_order_line_version == line.version (OCC, else ERR_STALE_LINE_VERSION)"]
        side_effects: ["product_id := proposed_substitute_product_id, proposed_substitute_product_id := null", "unit_price_cents re-resolved via counter_price_resolution (QUOTE_LOCKED lines may not be substituted — propose is rejected with ERR_INVALID_STATE)", "reservation retried against the substitute product's InventoryStock; may land ALLOCATED", "line totals and order document_totals recomputed", "OrderLine.version increments by 1"]
      - from: BACKORDERED
        to: BACKORDERED
        trigger: "POST /pvf/order-lines/{id}/substitute-decision with decision=REJECT (substitute_status PROPOSED -> REJECTED)"
        actor: Contractor
        preconditions: ["substitute_status == PROPOSED", "X-User-ID == order.account_id", "expected_order_line_version == line.version (OCC)"]
        side_effects: ["proposed_substitute_product_id := null", "line remains in the backorder pool at its original position (created_at unchanged)", "OrderLine.version increments by 1"]

  - entity: Kit
    initial_state: DRAFT
    terminal_states: [RELEASED]
    note: "Compound posture: DRAFT -> ASSEMBLED is automatic from member line states; STAGED -> ASSEMBLED unstage loop is a manual rework cycle."
    transitions:
      - from: DRAFT
        to: ASSEMBLED
        trigger: "system (automatic when every member OrderLine is ALLOCATED or FILLED — evaluated on line allocation, kit creation, and substitute approval)"
        actor: system
        preconditions: ["every member line status IN {ALLOCATED, FILLED}"]
        side_effects: ["Kit.version increments by 1"]
      - from: ASSEMBLED
        to: STAGED
        trigger: "POST /pvf/kits/{id}/stage"
        actor: WarehouseLead
        preconditions: ["window_end > window_start", "no bin conflict: no other kit in status STAGED with the same staging_bin whose [window_start, window_end + WILL_CALL_BUFFER_HOURS) intersects this window (gap of exactly WILL_CALL_BUFFER_HOURS is allowed)"]
        side_effects: ["staging_bin/window set from payload", "Kit.version increments by 1"]
      - from: STAGED
        to: ASSEMBLED
        trigger: "POST /pvf/kits/{id}/unstage"
        actor: WarehouseLead
        preconditions: []
        side_effects: ["staging_bin/window cleared (bin freed)", "Kit.version increments by 1"]
      - from: STAGED
        to: RELEASED
        trigger: "system (when the owning order reaches DISPATCHED or PICKED_UP)"
        actor: system
        preconditions: []
        side_effects: ["Kit.version increments by 1"]

  - entity: DeliverySlot
    initial_state: OPEN
    terminal_states: [COMPLETED, CANCELLED]
    note: "OPEN <-> FULL is a threshold auto-cycle on booked_cubes vs capacity_cubes."
    transitions:
      - from: OPEN
        to: FULL
        trigger: "system (automatic when booked_cubes == capacity_cubes after a booking)"
        actor: system
        preconditions: ["booked_cubes == capacity_cubes (equality)"]
        side_effects: ["DeliverySlot.version increments by 1"]
      - from: FULL
        to: OPEN
        trigger: "system (automatic when booked_cubes < capacity_cubes after a booking cancel)"
        actor: system
        preconditions: ["booked_cubes < capacity_cubes"]
        side_effects: ["DeliverySlot.version increments by 1"]
      - from: OPEN
        to: COMPLETED
        trigger: "system (when the logical clock advances past window_end)"
        actor: system
        preconditions: ["logical clock > window_end"]
        side_effects: ["DeliverySlot.version increments by 1"]
      - from: FULL
        to: COMPLETED
        trigger: "system (when the logical clock advances past window_end)"
        actor: system
        preconditions: ["logical clock > window_end"]
        side_effects: ["DeliverySlot.version increments by 1"]
      - from: OPEN
        to: CANCELLED
        trigger: "POST /pvf/delivery-slots/{id}/cancel"
        actor: BranchManager
        preconditions: ["booked_cubes == 0 (no active bookings, else ERR_INVALID_STATE)"]
        side_effects: ["DeliverySlot.version increments by 1"]
      - from: FULL
        to: CANCELLED
        trigger: "POST /pvf/delivery-slots/{id}/cancel"
        actor: BranchManager
        preconditions: ["booked_cubes == 0 (unreachable in practice: FULL implies booked_cubes == capacity >= 1)"]
        side_effects: ["DeliverySlot.version increments by 1"]

  - entity: ReturnRequest
    initial_state: DRAFT
    terminal_states: [REJECTED, CREDITED]
    note: "Branching fork with divergent side-effect sets: APPROVED arms restock+credit; REJECTED leaves the world untouched."
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /pvf/returns/{id}/submit"
        actor: CounterRep
        preconditions: ["aggregate: at least one referenced line has qty_fulfilled - qty_returned > 0 (else ERR_EMPTY_RETURN)", "no line references a cut-to-order or special-order product (else ERR_NON_RETURNABLE_ITEM)", "per line qty <= order line qty_fulfilled - qty_returned (else ERR_RETURN_QTY_EXCEEDS_FULFILLED)", "logical clock - fulfillment timestamp <= RETURN_WINDOW_DAYS (else ERR_RETURN_WINDOW_EXPIRED)"]
        side_effects: ["submitted_by := X-User-ID, submitted_at := logical clock", "ReturnRequest.version increments by 1"]
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /pvf/returns/{id}/decision with decision=APPROVE"
        actor: BranchManager
        preconditions: ["decided_by (X-User-ID) != submitted_by (else ERR_SEGREGATION_OF_DUTIES)"]
        side_effects: ["decided_by := X-User-ID", "restocking_fee_cents and credit_cents computed (restocking_fee calc)", "ReturnRequest.version increments by 1"]
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /pvf/returns/{id}/decision with decision=REJECT"
        actor: BranchManager
        preconditions: ["decided_by (X-User-ID) != submitted_by (else ERR_SEGREGATION_OF_DUTIES)"]
        side_effects: ["decided_by := X-User-ID", "NO inventory or balance side effects (divergent branch)", "ReturnRequest.version increments by 1"]
      - from: APPROVED
        to: CREDITED
        trigger: "POST /pvf/returns/{id}/receive"
        actor: WarehouseLead
        preconditions: []
        side_effects: ["per line: InventoryStock.on_hand += qty (restock) and OrderLine.qty_returned += qty", "restock triggers backorder_allocation for the restocked products (transitive: may flip waiting lines BACKORDERED -> ALLOCATED and their orders OPEN -> PICKING)", "ContractorAccount.outstanding_balance_cents -= credit_cents", "re-evaluate account credit hold release", "ReturnRequest.version increments by 1"]

# =============================================================================
# 1.2.1 Concurrency Rules (OCC only)
# =============================================================================
concurrency_rules:
  - rule_id: quote-revision-stale-quote
    parent_entity: Quote
    write_endpoint: "POST /pvf/quotes/{id}/revisions"
    occ_field: expected_quote_version
    description: |
      Creating a superseding revision of an AWARDED quote whose version has
      advanced since the client last observed it is rejected. A prior revision
      creation legitimately supersedes the quote (transitioning it to REVISED
      and bumping its version), so a second create carrying the older
      expected_quote_version is working from a stale view.
    error_id: ERR_STALE_QUOTE_VERSION
    http_status: 412
  - rule_id: order-booking-stale-order
    parent_entity: Order
    write_endpoint: "POST /pvf/orders/{id}/delivery-booking"
    occ_field: expected_order_version
    description: |
      Booking a delivery slot against an Order whose version has advanced
      since the client last observed it is rejected. Intervening mutations
      (line reservation at submit, allocation cascades, a prior booking)
      change cubes_total and version, so a stale expected_order_version
      must not silently double-book or book the wrong cube load.
    error_id: ERR_STALE_ORDER_VERSION
    http_status: 412
  - rule_id: substitute-decision-stale-line
    parent_entity: OrderLine
    write_endpoint: "POST /pvf/order-lines/{id}/substitute-decision"
    occ_field: expected_order_line_version
    description: |
      Deciding a substitute proposal on an OrderLine whose version has
      advanced since the client last observed it is rejected. A prior
      decision or a backorder-allocation event legitimately moves the line
      (bumping its version), so a stale expected_order_line_version carries
      no authority over the current line state.
    error_id: ERR_STALE_LINE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: counter_price_resolution
    trigger: "POST /pvf/orders/{id}/lines for COUNTER orders; substitute approval re-resolution"
    algorithm: tiered_pricing
    formula: |
      tier_pct = TIER_DISCOUNT_PCT[account.pricing_tier]
      tier_price = round_half_up(product.list_price_cents * (100 - tier_pct) / 100)
      if payload.price_override_cents is present:
          floor = ceil(product.cost_cents * (100 + MIN_MARGIN_PCT) / 100)
          if actor role != BranchManager: reject ERR_OVERRIDE_REQUIRES_MANAGER
          if price_override_cents < floor: reject ERR_PRICE_FLOOR_VIOLATION
          unit_price = price_override_cents; price_source = MANUAL_OVERRIDE
      else:
          if product.promo_price_cents is not null:
              unit_price = min(tier_price, product.promo_price_cents)
              price_source = PROMO when promo wins else COUNTER_TIER
          else:
              unit_price = tier_price; price_source = COUNTER_TIER
      # SHOWROOM orders: unit_price = product.list_price_cents, price_source = SHOWROOM_LIST (no tier, no promo)
      # PROJECT orders: unit_price copied from quote line, price_source = QUOTE_LOCKED (no re-resolution)
      # Quotes themselves: payload unit_price_cents is explicit; validated >= ceil(cost_cents * (100 + MIN_MARGIN_PCT) / 100); promo never applies
    input_set: "the order's account (tier), the line's product (list, cost, promo), payload override"
    constants:
      TIER_DISCOUNT_PCT: { STANDARD: 0, SILVER: 5, GOLD: 10, PLATINUM: 15 }
      MIN_MARGIN_PCT: 5
    precision: "integer cents, round_half_up; floor uses ceil"
    variants: []

  - name: document_totals
    trigger: "on Quote create/revise; on every Order line mutation (add, substitute approval), on submit, on cancel"
    algorithm: tiered_pricing
    formula: |
      # PINNED EVALUATION ORDER (circular-looking dependency made explicit):
      #   (1) subtotal_cents   = sum of line extensions over non-CANCELLED lines
      #                          (cut items: qty_ordered * cut_length_ft * unit_price_cents)
      #   (2) volume_discount_pct = highest VOLUME_TIERS tier whose threshold_cents <= PRE-discount subtotal_cents
      #          (PROJECT orders: copied locked pct from source quote instead of re-tiering)
      #   (3) discount_cents   = round_half_up(subtotal_cents * volume_discount_pct / 100)
      #   (4) post_discount    = subtotal_cents - discount_cents
      #   (5) freight_cents    = 0 when post_discount >= FREIGHT_FREE_THRESHOLD_CENTS else FLAT_FREIGHT_CENTS
      #   (6) total_cents      = post_discount + freight_cents
      # Re-tiering on the POST-discount value is FORBIDDEN; the tier is keyed on step (1) only.
    input_set: "Quote/Order non-CANCELLED lines; account tier is NOT an input (line prices already resolved)"
    constants:
      VOLUME_TIERS: [ { threshold_cents: 500000, pct: 2 }, { threshold_cents: 2000000, pct: 5 } ]
      FREIGHT_FREE_THRESHOLD_CENTS: 50000
      FLAT_FREIGHT_CENTS: 2500
    precision: "integer cents, round_half_up at step (3) only"
    variants:
      - name: locked_project
        when: "order.source == PROJECT"
        difference: "volume_discount_pct copied verbatim from the source Quote; line prices are QUOTE_LOCKED; steps (2) skipped"
      - name: showroom_list
        when: "order.source == SHOWROOM"
        difference: "lines carry SHOWROOM_LIST prices (list price); steps (2)-(6) still apply"

  - name: restocking_fee
    trigger: "POST /pvf/returns/{id}/decision with decision=APPROVE"
    algorithm: tiered_pricing
    formula: |
      days = floor((return.submitted_at - order fulfillment timestamp) / 86400)
      fee_pct = 10 when days <= 30; 25 when 31 <= days <= 90; days > 90 rejected at submit (ERR_RETURN_WINDOW_EXPIRED)
      # PINNED ROUNDING ORDER: per-line fee first, then sum.
      per_line_fee_i = round_half_up(line_return_value_i * fee_pct / 100)
      restocking_fee_cents = sum(per_line_fee_i)
      credit_cents = sum(line_return_value_i) - restocking_fee_cents
      # line_return_value_i = qty_i * unit_price_cents (cut items: qty_i * cut_length_ft * unit_price_cents)
      # freight_cents is never credited. Summing values then rounding once is FORBIDDEN.
    input_set: "ReturnRequest.lines joined to their OrderLine unit prices; order fulfillment timestamp; submitted_at"
    constants:
      RESTOCK_FEE_TIER1_DAYS: 30
      RESTOCK_FEE_TIER1_PCT: 10
      RESTOCK_FEE_TIER2_DAYS: 90
      RESTOCK_FEE_TIER2_PCT: 25
      RETURN_WINDOW_DAYS: 90
    precision: "integer cents, round_half_up per line"
    variants: []

  - name: job_cost_report
    trigger: "GET /pvf/contractor-accounts/{id}/job-costing?job_name=<name>"
    algorithm: aggregation
    formula: |
      scope = orders of this account with job_name == <job_name> and fulfillment_status != CANCELLED
      provisional_cost_cents = sum of line_total_cents over lines with status IN {OPEN, ALLOCATED, BACKORDERED, FILLED}
      final_cost_cents = sum over lines with status == FILLED of (line_total_cents - returned_value_cents)
        where returned_value_cents = qty_returned * unit_price_cents (cut: qty_returned * cut_length_ft * unit_price_cents)
      order_count = number of in-scope orders; line_count = number of in-scope lines
    input_set: "Orders filtered by account_id + job_name, excluding CANCELLED; lines filtered by status per variant"
    constants: {}
    precision: "integer cents"
    variants:
      - name: provisional
        when: "always reported"
        difference: "includes unfulfilled (OPEN/ALLOCATED/BACKORDERED) commitment value; ignores pending returns"
      - name: final
        when: "always reported"
        difference: "only FILLED lines, net of CREDITED return values; identical inputs can produce a different total than provisional"

  - name: credit_exposure
    trigger: "GET /pvf/contractor-accounts/{id}/credit-exposure; order submit credit check; payment/invoice/return-credit cascades"
    algorithm: aggregation
    formula: |
      statement_balance_cents = sum(total_cents of orders with payment_status IN {INVOICED, PAID})
                                - sum(Payment.amount_cents)
                                - sum(credit_cents of ReturnRequests with status == CREDITED)
      forward_exposure_cents  = statement_balance_cents
                                + sum(total_cents of orders with payment_status == UNINVOICED
                                      and fulfillment_status NOT IN {DRAFT, CANCELLED})
      available_credit_cents  = credit_limit_cents - forward_exposure_cents
      past_due(order)         = order.payment_status == INVOICED and logical_clock > order.invoiced_at + TERMS_DAYS[account.terms]
      hold_engaged   when statement_balance_cents > credit_limit_cents (strictly greater) OR any past_due(order)
      hold_released  when statement_balance_cents <= round_half_up(0.80 * credit_limit_cents)  (equality releases)
                         AND no past_due(order) remains
    input_set: "orders by payment_status/fulfillment_status per formula; payments; credited returns; logical clock for past-due aging"
    constants:
      HOLD_RELEASE_RATIO: 0.80
      TERMS_DAYS: { COD: 0, NET_15: 15, NET_30: 30 }
    precision: "integer cents"
    variants:
      - name: statement_balance
        when: "reported as statement_balance_cents / used for hold hysteresis"
        difference: "chronological ledger of invoiced totals minus payments and credits; identical account state can differ from forward exposure"
      - name: forward_exposure
        when: "reported as forward_exposure_cents / used by the order submit credit check"
        difference: "forward-looking; adds committed-but-uninvoiced order totals (submitted, not yet delivered/picked up)"

  - name: rebate_tier_attainment
    trigger: "POST /pvf/manufacturer-programs/{id}/close"
    algorithm: threshold
    formula: |
      attained_rebate_pct = max(pct over tiers where purchases_cents >= threshold_cents); 0 when none qualifies
      earned_rebate_cents = round_half_up(purchases_cents * attained_rebate_pct / 100)
      # boundary: purchases_cents EXACTLY EQUAL to a threshold attains that tier (>=)
    input_set: "program.purchases_cents accumulated from StockReceipt lines in-window for the manufacturer"
    constants: {}
    precision: "integer cents, round_half_up"
    variants: []

  - name: backorder_allocation
    trigger: "POST /pvf/branches/{id}/stock-receipts; POST /pvf/returns/{id}/receive (restock); substitute approval retry"
    algorithm: waterfall_allocation
    formula: |
      for the affected (branch_id, product_id):
        candidates = OrderLines with status == BACKORDERED for this product at this branch
        order of processing: line.created_at ASC, tie-break order.created_at ASC   # never id
        for each candidate in order while InventoryStock.available > 0:
            take = min(candidate shortage, available)
            candidate.qty_allocated += take; reserved += take
            if candidate fully allocated: candidate -> ALLOCATED
        after each candidate mutation: re-evaluate owning order OPEN -> PICKING bubble-up and kit DRAFT -> ASSEMBLED posture
      # partial fills allowed; a candidate later in the queue gets nothing when stock exhausts
    input_set: "BACKORDERED lines for the restocked (branch, product)"
    constants: {}
    precision: "integer units"
    variants: []

  - name: payment_auto_allocation
    trigger: "POST /pvf/contractor-accounts/{id}/payments when allocations omitted"
    algorithm: waterfall_allocation
    formula: |
      remaining = payment.amount_cents
      targets = orders of the account with payment_status == INVOICED
      order of processing: invoiced_at ASC, tie-break created_at ASC   # never id
      for each target in order while remaining > 0:
          owed = target.total_cents - already_allocated(target)
          take = min(owed, remaining); allocate take to target
          if fully covered: target.payment_status -> PAID
      outstanding_balance_cents -= payment.amount_cents once (regardless of allocation)
    input_set: "INVOICED orders of the account"
    constants: {}
    precision: "integer cents"
    variants: []

  - name: delivery_cubes
    trigger: "order line mutation / allocation change; POST /pvf/orders/{id}/delivery-booking"
    algorithm: aggregation
    formula: |
      order.cubes_total = sum over non-CANCELLED lines of qty_allocated * product.cubes_per_unit
      slot capacity check at booking: slot.booked_cubes + order.cubes_total <= slot.capacity_cubes   # equality allowed
      slot.booked_cubes = sum of cubes_total over orders with delivery_slot_id == slot.id and fulfillment_status NOT IN {CANCELLED}
    input_set: "order lines with product cubes_per_unit; slot bookings"
    constants: {}
    precision: "integer cubes"
    variants: []

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority — lower number wins on dual failure)
# =============================================================================
validations:
  - { priority: 1, category: auth, check: "X-User-Role and X-User-ID headers present and role recognized", error_id: ERR_UNAUTHENTICATED, http_status: 401, applies_to: "all" }
  - { priority: 2, category: auth, check: "acting role is listed in the endpoint's roles", error_id: ERR_FORBIDDEN, http_status: 403, applies_to: "all" }
  - { priority: 3, category: auth, check: "ownership scope: when X-User-Role == Contractor, X-User-ID must equal the account_id of the account-scoped resource being read or acted on (quote award, sheet approve, substitute decision, self reads)", error_id: ERR_FORBIDDEN, http_status: 403, applies_to: "Contractor-accessible endpoints" }
  - { priority: 4, category: existence, check: "request body shape: required fields present, enum members valid, qty >= 1, cut_length_ft present iff product.is_cut_to_order (forbidden otherwise), period_end > period_start, window_end > window_start", error_id: ERR_INVALID_REQUEST, http_status: 400, applies_to: "all" }
  - { priority: 5, category: existence, check: "path-template ids resolve, validated left-to-right", error_id: ERR_ORDER_NOT_FOUND, http_status: 404, applies_to: "all (error id per missing resource: ERR_BRANCH_NOT_FOUND, ERR_PRODUCT_NOT_FOUND, ERR_ACCOUNT_NOT_FOUND, ERR_QUOTE_NOT_FOUND, ERR_ORDER_NOT_FOUND, ERR_ORDER_LINE_NOT_FOUND, ERR_KIT_NOT_FOUND, ERR_SLOT_NOT_FOUND, ERR_RETURN_NOT_FOUND, ERR_PROGRAM_NOT_FOUND, ERR_SHEET_NOT_FOUND)" }
  - { priority: 6, category: existence, check: "body-referenced FK ids resolve (product_id on line add, slot_id on booking, order_id on return create, account_id/branch_id on creates, substitute_product_id on propose)", error_id: ERR_PRODUCT_NOT_FOUND, http_status: 404, applies_to: "all (error id per referenced resource)" }
  - { priority: 7, category: state, check: "target entity status permits the requested transition per its state machine", error_id: ERR_INVALID_STATE, http_status: 409, applies_to: "all action endpoints" }
  - { priority: 8, category: state, check: "order submit/delivery-booking gate: account.status == ACTIVE", error_id: ERR_ACCOUNT_CREDIT_HOLD, http_status: 409, applies_to: ["POST /pvf/orders/{id}/submit", "POST /pvf/orders/{id}/delivery-booking"] }
  - { priority: 9, category: state, check: "quote submit/award before valid_until", error_id: ERR_QUOTE_EXPIRED, http_status: 409, applies_to: ["POST /pvf/quotes/{id}/submit", "POST /pvf/quotes/{id}/award"] }
  - { priority: 10, category: state, check: "OCC: expected_<parent>_version == current parent version", error_id: ERR_STALE_QUOTE_VERSION, http_status: 412, applies_to: ["POST /pvf/quotes/{id}/revisions (ERR_STALE_QUOTE_VERSION)", "POST /pvf/orders/{id}/delivery-booking (ERR_STALE_ORDER_VERSION)", "POST /pvf/order-lines/{id}/substitute-decision (ERR_STALE_LINE_VERSION)"] }
  - { priority: 11, category: business_temporal, check: "delivery booking requires slot.window_end > logical clock", error_id: ERR_DELIVERY_WINDOW_PAST, http_status: 422, applies_to: ["POST /pvf/orders/{id}/delivery-booking"] }
  - { priority: 12, category: business_temporal, check: "return submit within RETURN_WINDOW_DAYS (90) of order fulfillment", error_id: ERR_RETURN_WINDOW_EXPIRED, http_status: 422, applies_to: ["POST /pvf/returns/{id}/submit"] }
  - { priority: 13, category: business_temporal, check: "program close only after period_end has passed", error_id: ERR_PROGRAM_PERIOD_NOT_ENDED, http_status: 422, applies_to: ["POST /pvf/manufacturer-programs/{id}/close"] }
  - { priority: 14, category: business_constraint, check: "uniqueness: Product.sku, Branch.code, InventoryStock (branch_id, product_id)", error_id: ERR_SKU_EXISTS, http_status: 409, applies_to: ["POST /pvf/products (ERR_SKU_EXISTS)", "POST /pvf/branches (ERR_BRANCH_CODE_EXISTS)", "POST /pvf/branches/{id}/inventory (ERR_STOCK_RECORD_EXISTS)"] }
  - { priority: 15, category: business_constraint, check: "delivery slot overlap: same branch+truck half-open [window_start, window_end) intervals may not intersect; touching endpoints allowed", error_id: ERR_SLOT_OVERLAP, http_status: 409, applies_to: ["POST /pvf/branches/{id}/delivery-slots"] }
  - { priority: 16, category: business_constraint, check: "staging bin overlap: same bin occupied through staged_window_end + WILL_CALL_BUFFER_HOURS (2h); a later kit window starting exactly at end+buffer is allowed", error_id: ERR_BIN_OVERLAP, http_status: 409, applies_to: ["POST /pvf/kits/{id}/stage"] }
  - { priority: 17, category: business_constraint, check: "program overlap: CLOSED intervals [period_start, period_end] for the same manufacturer_name may not touch or intersect (equal boundary dates conflict); different manufacturers unrestricted", error_id: ERR_PROGRAM_OVERLAP, http_status: 409, applies_to: ["POST /pvf/manufacturer-programs"] }
  - { priority: 18, category: business_constraint, check: "delivery slot capacity: booked_cubes + order.cubes_total <= capacity_cubes (equality allowed)", error_id: ERR_SLOT_FULL, http_status: 409, applies_to: ["POST /pvf/orders/{id}/delivery-booking"] }
  - { priority: 19, category: business_constraint, check: "segregation of duties: return decision maker X-User-ID must differ from submitted_by", error_id: ERR_SEGREGATION_OF_DUTIES, http_status: 409, applies_to: ["POST /pvf/returns/{id}/decision"] }
  - { priority: 20, category: business_constraint, check: "returnability: no return line may reference a cut-to-order or special-order product", error_id: ERR_NON_RETURNABLE_ITEM, http_status: 422, applies_to: ["POST /pvf/returns/{id}/submit"] }
  - { priority: 21, category: business_constraint, check: "aggregate empty check: every referenced line has zero remaining returnable quantity (qty_fulfilled - qty_returned == 0 for all lines) — the order has nothing returnable", error_id: ERR_EMPTY_RETURN, http_status: 422, applies_to: ["POST /pvf/returns/{id}/submit"] }
  - { priority: 22, category: business_constraint, check: "return qty per line <= qty_fulfilled - qty_returned (only reachable when at least one line has positive returnable quantity)", error_id: ERR_RETURN_QTY_EXCEEDS_FULFILLED, http_status: 422, applies_to: ["POST /pvf/returns/{id}/submit"] }
  - { priority: 23, category: business_referential, check: "kit membership: every order_line_id belongs to the path order and is not already in another kit of status != RELEASED", error_id: ERR_LINE_ORDER_MISMATCH, http_status: 422, applies_to: ["POST /pvf/orders/{id}/kits (ERR_LINE_ORDER_MISMATCH for foreign line; ERR_KIT_LINE_CONFLICT for double-kitting)"] }
  - { priority: 24, category: business_referential, check: "substitute eligibility: substitute product shares a non-null substitute_group with the original product", error_id: ERR_SUBSTITUTE_GROUP_MISMATCH, http_status: 422, applies_to: ["POST /pvf/order-lines/{id}/propose-substitute"] }
  - { priority: 25, category: business_referential, check: "return lines reference order lines belonging to the return's order", error_id: ERR_LINE_ORDER_MISMATCH, http_status: 422, applies_to: ["POST /pvf/returns", "POST /pvf/returns/{id}/submit"] }
  - { priority: 26, category: business_fiscal, check: "order submit: account.forward_exposure_cents + order.total_cents <= credit_limit_cents (equality allowed)", error_id: ERR_CREDIT_LIMIT_EXCEEDED, http_status: 402, applies_to: ["POST /pvf/orders/{id}/submit"] }
  - { priority: 27, category: business_fiscal, check: "price floor: quote line unit_price_cents and manual overrides >= ceil(cost_cents * 1.05)", error_id: ERR_PRICE_FLOOR_VIOLATION, http_status: 422, applies_to: ["POST /pvf/quotes", "POST /pvf/quotes/{id}/revisions", "POST /pvf/orders/{id}/lines"] }
  - { priority: 28, category: business_fiscal, check: "price_override_cents on line add requires BranchManager role", error_id: ERR_OVERRIDE_REQUIRES_MANAGER, http_status: 403, applies_to: ["POST /pvf/orders/{id}/lines"] }

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "missing or unrecognized X-User-Role / X-User-ID headers" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "role not permitted on endpoint, or Contractor acting outside its own account scope" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "malformed body: missing required field, invalid enum member, qty < 1, cut_length_ft present on non-cut product or missing on cut product, inverted window/period" }
  - { id: ERR_BRANCH_NOT_FOUND, http: 404, condition: "branch id does not resolve" }
  - { id: ERR_PRODUCT_NOT_FOUND, http: 404, condition: "product id does not resolve (path or body reference)" }
  - { id: ERR_ACCOUNT_NOT_FOUND, http: 404, condition: "contractor account id does not resolve" }
  - { id: ERR_QUOTE_NOT_FOUND, http: 404, condition: "quote id does not resolve" }
  - { id: ERR_ORDER_NOT_FOUND, http: 404, condition: "order id does not resolve" }
  - { id: ERR_ORDER_LINE_NOT_FOUND, http: 404, condition: "order line id does not resolve" }
  - { id: ERR_KIT_NOT_FOUND, http: 404, condition: "kit id does not resolve" }
  - { id: ERR_SLOT_NOT_FOUND, http: 404, condition: "delivery slot id does not resolve" }
  - { id: ERR_RETURN_NOT_FOUND, http: 404, condition: "return request id does not resolve" }
  - { id: ERR_PROGRAM_NOT_FOUND, http: 404, condition: "manufacturer program id does not resolve" }
  - { id: ERR_SHEET_NOT_FOUND, http: 404, condition: "selection sheet id does not resolve" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "entity status does not permit the requested transition (includes will-call gate on mark-staged, booking gate on dispatch, pickup on non-will-call order, substitute proposal on non-BACKORDERED or QUOTE_LOCKED line)" }
  - { id: ERR_ACCOUNT_CREDIT_HOLD, http: 409, condition: "account.status is CREDIT_HOLD or SUSPENDED at order submit or delivery booking" }
  - { id: ERR_QUOTE_EXPIRED, http: 409, condition: "quote submit/award attempted at or after valid_until; quote transitions to EXPIRED" }
  - { id: ERR_STALE_QUOTE_VERSION, http: 412, condition: "expected_quote_version mismatches current quote version on revision creation" }
  - { id: ERR_STALE_ORDER_VERSION, http: 412, condition: "expected_order_version mismatches current order version on delivery booking" }
  - { id: ERR_STALE_LINE_VERSION, http: 412, condition: "expected_order_line_version mismatches current line version on substitute decision" }
  - { id: ERR_DELIVERY_WINDOW_PAST, http: 422, condition: "booking into a slot whose window_end is at or before the logical clock" }
  - { id: ERR_RETURN_WINDOW_EXPIRED, http: 422, condition: "return submitted more than 90 days after order fulfillment" }
  - { id: ERR_PROGRAM_PERIOD_NOT_ENDED, http: 422, condition: "program close attempted while logical clock <= period_end" }
  - { id: ERR_SLOT_OVERLAP, http: 409, condition: "new slot's half-open interval intersects an existing OPEN/FULL slot on the same branch truck" }
  - { id: ERR_BIN_OVERLAP, http: 409, condition: "staging window collides with another STAGED kit on the same bin within the 2-hour turnaround buffer" }
  - { id: ERR_PROGRAM_OVERLAP, http: 409, condition: "closed-interval program periods for the same manufacturer touch or intersect" }
  - { id: ERR_SLOT_FULL, http: 409, condition: "booked_cubes + order cubes_total would strictly exceed capacity_cubes" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 409, condition: "return decision maker is the same X-User-ID as the submitter" }
  - { id: ERR_SUBSTITUTE_GROUP_MISMATCH, http: 422, condition: "substitute product does not share the original product's non-null substitute_group" }
  - { id: ERR_NON_RETURNABLE_ITEM, http: 422, condition: "return line references a cut-to-order or special-order product" }
  - { id: ERR_RETURN_QTY_EXCEEDS_FULFILLED, http: 422, condition: "return line qty exceeds fulfilled-minus-already-returned on the order line" }
  - { id: ERR_EMPTY_RETURN, http: 422, condition: "return submitted with no returnable quantity" }
  - { id: ERR_LINE_ORDER_MISMATCH, http: 422, condition: "referenced order line does not belong to the path/body order" }
  - { id: ERR_KIT_LINE_CONFLICT, http: 409, condition: "order line already assigned to a kit of status != RELEASED" }
  - { id: ERR_SKU_EXISTS, http: 409, condition: "duplicate Product.sku" }
  - { id: ERR_BRANCH_CODE_EXISTS, http: 409, condition: "duplicate Branch.code" }
  - { id: ERR_STOCK_RECORD_EXISTS, http: 409, condition: "InventoryStock record already exists for (branch_id, product_id)" }
  - { id: ERR_CREDIT_LIMIT_EXCEEDED, http: 402, condition: "forward exposure plus this order's total would strictly exceed the account credit limit" }
  - { id: ERR_PRICE_FLOOR_VIOLATION, http: 422, condition: "quote line price or manual override below ceil(cost_cents * 1.05)" }
  - { id: ERR_OVERRIDE_REQUIRES_MANAGER, http: 403, condition: "price_override_cents supplied by a non-BranchManager role" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: BranchManager
    description: "Branch general manager; owns catalog, programs, slots, credit reviews, price overrides, and return decisions"
    identity: opaque
    exclusive_operations:
      - "POST /pvf/branches, POST /pvf/products, POST /pvf/branches/{id}/delivery-slots"
      - "POST /pvf/contractor-accounts/{id}/credit-review"
      - "POST /pvf/manufacturer-programs*, close, settle"
      - "POST /pvf/returns/{id}/decision"
      - "POST /pvf/_clock/set_current_utc"
      - "price_override_cents on line add"
    shared_operations: ["read endpoints", "no shared writes"]
  - name: CounterRep
    description: "Will-call counter associate; builds counter orders, submits orders, takes payments, runs pickups, originates returns"
    identity: opaque
    exclusive_operations:
      - "POST /pvf/orders, POST /pvf/orders/{id}/lines, POST /pvf/orders/{id}/submit, POST /pvf/orders/{id}/cancel"
      - "POST /pvf/orders/{id}/delivery-booking(+cancel), POST /pvf/orders/{id}/pickup"
      - "POST /pvf/contractor-accounts/{id}/payments"
      - "POST /pvf/returns, POST /pvf/returns/{id}/submit"
    shared_operations: ["read endpoints"]
  - name: InsideSales
    description: "Inside sales representative; owns quotes, selection sheets, kit takeoff, and substitute proposals"
    identity: opaque
    exclusive_operations:
      - "POST /pvf/contractor-accounts"
      - "POST /pvf/quotes(+submit/lose/revisions/convert)"
      - "POST /pvf/selection-sheets(+present/revise/convert)"
      - "POST /pvf/orders/{id}/kits"
      - "POST /pvf/order-lines/{id}/propose-substitute"
    shared_operations: ["read endpoints"]
  - name: WarehouseLead
    description: "Warehouse lead; receives stock, manages inventory records, stages orders and kits, dispatches and confirms delivery"
    identity: opaque
    exclusive_operations:
      - "POST /pvf/branches/{id}/inventory, POST /pvf/branches/{id}/stock-receipts"
      - "POST /pvf/orders/{id}/mark-staged, dispatch, confirm-delivery"
      - "POST /pvf/kits/{id}/stage, unstage"
      - "POST /pvf/returns/{id}/receive"
    shared_operations: ["read endpoints"]
  - name: Contractor
    description: "Contractor customer; acts only within its own account scope (X-User-ID == ContractorAccount.id)"
    identity: "entity_backed:ContractorAccount"
    exclusive_operations:
      - "POST /pvf/quotes/{id}/award"
      - "POST /pvf/selection-sheets/{id}/approve"
      - "POST /pvf/order-lines/{id}/substitute-decision"
    shared_operations: ["read endpoints scoped to own account: account/quotes/sheets/orders/lines/payments/returns reads, catalog reads"]

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- Branch / catalog administration ----
  - { method: POST, path: "/pvf/branches", description: "Create a branch", roles: [BranchManager], code: 201, input: [name, code], output: Branch, side_effects: [] }
  - { method: GET, path: "/pvf/branches", description: "List branches (paginated)", roles: [BranchManager, CounterRep, InsideSales, WarehouseLead, Contractor], code: 200, input: ["limit?", "offset?"], output: "Branch[]", side_effects: [] }
  - { method: GET, path: "/pvf/branches/{id}", description: "Get one branch", roles: [BranchManager, CounterRep, InsideSales, WarehouseLead, Contractor], code: 200, input: [], output: Branch, side_effects: [] }
  - { method: POST, path: "/pvf/products", description: "Create a catalog product", roles: [BranchManager], code: 201, input: [sku, description, category, list_price_cents, cost_cents, manufacturer_name, cubes_per_unit, "is_cut_to_order?", "is_special_order?", "substitute_group?", "promo_price_cents?"], output: Product, side_effects: [] }
  - { method: GET, path: "/pvf/products", description: "List products with filters (paginated)", roles: [BranchManager, CounterRep, InsideSales, WarehouseLead, Contractor], code: 200, input: ["category?", "manufacturer_name?", "substitute_group?", "limit?", "offset?"], output: "Product[]", side_effects: [] }
  - { method: GET, path: "/pvf/products/{id}", description: "Get one product", roles: [BranchManager, CounterRep, InsideSales, WarehouseLead, Contractor], code: 200, input: [], output: Product, side_effects: [] }
  - { method: GET, path: "/pvf/products/{id}/inventory", description: "Reverse-reachability: InventoryStock rows for a product (also covers OrderLine.proposed_substitute_product_id discovery via the sibling order-lines view)", roles: [BranchManager, CounterRep, InsideSales, WarehouseLead], code: 200, input: [], output: "InventoryStock[]", side_effects: [] }
  - { method: GET, path: "/pvf/products/{id}/order-lines", description: "Reverse-reachability: order lines referencing this product as product_id or proposed_substitute_product_id", roles: [BranchManager, CounterRep, InsideSales, WarehouseLead], code: 200, input: [], output: "OrderLine[]", side_effects: [] }

  # ---- Contractor accounts / credit / job costing / payments ----
  - { method: POST, path: "/pvf/contractor-accounts", description: "Open a contractor account", roles: [InsideSales], code: 201, input: [company_name, pricing_tier, terms, credit_limit_cents], output: ContractorAccount, side_effects: [] }
  - { method: GET, path: "/pvf/contractor-accounts", description: "List accounts (paginated, filter by status)", roles: [BranchManager, CounterRep, InsideSales, WarehouseLead], code: 200, input: ["status?", "limit?", "offset?"], output: "ContractorAccount[]", side_effects: [] }
  - { method: GET, path: "/pvf/contractor-accounts/{id}", description: "Get one account; Contractor may read only its own id", roles: [BranchManager, CounterRep, InsideSales, WarehouseLead, Contractor], code: 200, input: [], output: ContractorAccount, side_effects: [] }
  - { method: POST, path: "/pvf/contractor-accounts/{id}/credit-review", description: "Manager credit action: RELEASE_HOLD | SUSPEND | ADJUST_LIMIT", roles: [BranchManager], code: 200, input: [action, "new_credit_limit_cents?"], output: ContractorAccount, side_effects: ["status transition per state machine", "ADJUST_LIMIT re-evaluates automatic hold/release", "increments ContractorAccount.version by 1"] }
  - { method: GET, path: "/pvf/contractor-accounts/{id}/credit-exposure", description: "Computed read: both credit_exposure variants (statement balance vs forward exposure)", roles: [BranchManager, CounterRep, InsideSales, WarehouseLead, Contractor], code: 200, input: [], output: "{ account_id: string, credit_limit_cents: integer, statement_balance_cents: integer, forward_exposure_cents: integer, available_credit_cents: integer, status: string }", side_effects: [] }
  - { method: GET, path: "/pvf/contractor-accounts/{id}/job-costing", description: "Computed read: both job_cost_report variants for one job_name", roles: [BranchManager, CounterRep, InsideSales, WarehouseLead, Contractor], code: 200, input: [job_name], output: "{ job_name: string, provisional_cost_cents: integer, final_cost_cents: integer, order_count: integer, line_count: integer }", side_effects: [] }
  - { method: GET, path: "/pvf/contractor-accounts/{id}/quotes", description: "Reverse-reachability: quotes of an account", roles: [BranchManager, CounterRep, InsideSales, WarehouseLead, Contractor], code: 200, input: ["limit?", "offset?"], output: "Quote[]", side_effects: [] }
  - { method: GET, path: "/pvf/contractor-accounts/{id}/selection-sheets", description: "Reverse-reachability: selection sheets of an account", roles: [BranchManager, CounterRep, InsideSales, WarehouseLead, Contractor], code: 200, input: ["limit?", "offset?"], output: "SelectionSheet[]", side_effects: [] }
  - { method: GET, path: "/pvf/contractor-accounts/{id}/orders", description: "Reverse-reachability: orders of an account", roles: [BranchManager, CounterRep, InsideSales, WarehouseLead, Contractor], code: 200, input: ["fulfillment_status?", "limit?", "offset?"], output: "Order[]", side_effects: [] }
  - { method: GET, path: "/pvf/contractor-accounts/{id}/payments", description: "Reverse-reachability: payments of an account", roles: [BranchManager, CounterRep, InsideSales, WarehouseLead, Contractor], code: 200, input: ["limit?", "offset?"], output: "Payment[]", side_effects: [] }
  - { method: POST, path: "/pvf/contractor-accounts/{id}/payments", description: "Take a payment; explicit allocations or FIFO auto-allocation over INVOICED orders", roles: [CounterRep], code: 201, input: [amount_cents, method, "allocations?"], output: Payment, side_effects: ["outstanding_balance_cents -= amount_cents", "payment_auto_allocation waterfall (oldest invoiced_at first) flips fully-covered orders to PAID", "re-evaluate credit hold release", "increments ContractorAccount.version by 1"] }

  # ---- Inventory & receiving ----
