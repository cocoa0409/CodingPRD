            - "PlacementBooking.${b1}.status == RELEASED and ${b2}.status == HELD"

      - name: lab_bench_closed_interval_with_buffer_blocks_adjacent_booking
        grounds:
          - calculations.lab_overlap_and_capacity_check
          - entities.LabBooking.fields.bench_code
          - errors.ERR_BENCH_OVERLAP
        distinguishing_aspect: |
          Resource: certification lab bench (bench_code) — a different resource
          entity than the home-screen slot. Semantics: CLOSED interval plus a
          24h buffer on both sides, so a booking starting exactly at another's
          window_end conflicts (adjacency forbidden — the exact opposite of the
          half-open placement rule), and a booking starting 23h after window_end
          still conflicts while 24h after passes.
        test_recipe:
          setup:
            - "Clock default. Manufacturer M with models MD1 (in LAB_TESTING via booking on LAB_BENCH_7 [2026-09-03T09:00, 2026-09-03T17:00]) and MD2 (SUBMITTED)."
          setup_api_calls:
