            - { call: "POST /agreements/${agr}/submit", payload: {}, as: JobberAdmin }
            - { call: "POST /agreements/${agr}/accept", payload: {}, as: RetailerManager, as_user_id: "${store}" }
          trigger:
            - { call: "POST /space-allocations", payload: { store_agreement_id: "${agr}", category: "SNACKS", facings: 0, window_start_date: "2026-08-01", window_end_date: "2026-09-01" }, as: JobberAdmin, captures: { err: "$.data.error_id" } }
