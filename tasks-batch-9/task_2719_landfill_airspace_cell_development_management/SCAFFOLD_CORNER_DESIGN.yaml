              captures: { e_year: $.data.error_id }
          assert:
            - "${e_permit} == 'ERR_DUPLICATE_PERMIT_NUMBER' with HTTP 409 and only one Landfill row exists"
            - "${e_cell} == 'ERR_DUPLICATE_CELL_CODE' with HTTP 409"
            - "${e_well} == 'ERR_DUPLICATE_WELL_CODE' with HTTP 409 — the collision is across C-1 and C-2 of the same landfill, so a per-cell scope would have wrongly accepted it"
            - "${e_year} == 'ERR_DUPLICATE_ESTIMATE_YEAR' with HTTP 409; the request carried the CURRENT landfill version so it reached rung 20 rather than stopping at the rung-8 version check"
