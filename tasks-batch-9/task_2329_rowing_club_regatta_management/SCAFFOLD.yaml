  - id: ERR_PROTEST_NOT_FOUND
    http: 404
    condition: "a protest id in the path does not exist"
  - id: ERR_TRAILER_NOT_FOUND
    http: 404
    condition: "a trailer load id in the path does not exist"
  - id: ERR_INVALID_REQUEST
    http: 422
    condition: "required field missing, enum value outside its constraint set, integer outside its declared range, or datetime not ISO 8601 UTC"
  - id: ERR_STALE_ENTRY_VERSION
    http: 412
    condition: "expected_regatta_entry_version does not equal RegattaEntry.version on the lineup declaration endpoint"
  - id: ERR_STALE_TRAILER_VERSION
    http: 412
    condition: "expected_trailer_load_version does not equal TrailerLoad.version on a rack assignment or release"
  - id: ERR_ALREADY_TERMINAL
    http: 409
    condition: "a state-changing action targets a resource already in one of its terminal states"
  - id: ERR_SHELL_NOT_AVAILABLE
    http: 409
    condition: "clearance requested for a session whose shell is not AVAILABLE"
  - id: ERR_SESSION_NOT_CLEARED
    http: 409
    condition: "launch requested for a session that is not CLEARED"
  - id: ERR_SESSION_NOT_LAUNCHED
    http: 409
    condition: "return requested for a session that is not LAUNCHED"
  - id: ERR_REPORT_NOT_TRIAGED
    http: 409
    condition: "repair scheduling requested for a damage report that is not TRIAGED"
  - id: ERR_REPORT_NOT_SCHEDULED
    http: 409
    condition: "repair verification requested for a damage report that is not REPAIR_SCHEDULED"
  - id: ERR_REGATTA_ENTRIES_CLOSED
    http: 409
    condition: "entry creation or submission attempted while the regatta is not OPEN_FOR_ENTRY"
  - id: ERR_ENTRY_NOT_DECLARED
    http: 409
    condition: "submission attempted for an entry that is not LINEUP_DECLARED"
  - id: ERR_ENTRY_NOT_SUBMITTED
    http: 409
    condition: "confirmation attempted for an entry that is not SUBMITTED"
  - id: ERR_HEAT_NOT_ASSIGNED
    http: 409
    condition: "results posted for a heat that is not LANES_ASSIGNED"
  - id: ERR_HEAT_NOT_PROVISIONAL
    http: 409
    condition: "officialization, protest filing or a jury ruling attempted while the heat is not RESULTS_PROVISIONAL"
  - id: ERR_PROTEST_NOT_UNDER_REVIEW
    http: 409
    condition: "a ruling is attempted on a protest that is not UNDER_JURY_REVIEW"
  - id: ERR_TRAILER_SEALED
    http: 409
    condition: "a rack assignment or release attempted while the trailer load is not OPEN"
  - id: ERR_MEMBER_NOT_ACTIVE
    http: 409
    condition: "a referenced member's membership_status is not ACTIVE"
  - id: ERR_INVALID_STATUS_TRANSITION
    http: 409
    condition: "the requested to_status is not a declared target from the resource's current status, or the declared transition's own preconditions do not hold"
  - id: ERR_SELF_TRIAGE_FORBIDDEN
    http: 403
    condition: "the member who filed a damage report attempts to triage or verify it"
  - id: ERR_SELF_CLEARANCE_FORBIDDEN
    http: 403
    condition: "the session's coach attempts to sign that session's own safety clearance"
  - id: ERR_SELF_WEIGH_IN_FORBIDDEN
    http: 403
    condition: "the seated coxswain attempts to record their own weigh-in"
  - id: ERR_JURY_CONFLICT_OF_INTEREST
    http: 403
    condition: "review is opened by the protest's filer, or by a member seated in a crew racing the protested heat"
  - id: ERR_WATER_CLOSED
    http: 409
    condition: "clearance requested against a reading whose computed posture is CLOSED"
  - id: ERR_SWIM_TEST_MISSING
    http: 409
    condition: "a referenced athlete or coxswain has no swim test on file, or one older than 365 days"
  - id: ERR_COXSWAIN_CERT_EXPIRED
    http: 409
    condition: "the coxswain's coxswain_cert_expires_at is null or not after the logical clock"
  - id: ERR_COACH_CERT_EXPIRED
    http: 409
    condition: "the coach's coach_cert_expires_at is null or not after the logical clock"
  - id: ERR_LAUNCH_CERT_EXPIRED
    http: 409
    condition: "a launch driver's safety_launch_cert_expires_at is null or not after the logical clock, or the member lacks LAUNCH_DRIVER in club_roles"
  - id: ERR_LAUNCH_COVERAGE_INSUFFICIENT
    http: 409
    condition: "assigned_launch_count is below the required_launch_count computed for the supplied reading"
  - id: ERR_SHELL_CONDITION_TOO_LOW
    http: 409
    condition: "submission attempted with a hull whose condition_index_conservative is below 60"
  - id: ERR_TIER_NOT_PERMITTED_FOR_HULL
    http: 409
    condition: "a non-COMPETITIVE member is seated in a hull whose tier_restriction is COMPETITIVE_ONLY"
  - id: ERR_SHELL_WINDOW_CONFLICT
    http: 409
    condition: "the requested session window collides with another non-terminal session on the same hull once the 30 minute turnaround buffer is appended"
  - id: ERR_LAUNCH_DRIVER_OVERBOOKED
    http: 409
    condition: "a launch driver would exceed launch_supervision_limit strictly overlapping cleared or launched sessions"
  - id: ERR_REPAIR_BAY_CONFLICT
    http: 409
    condition: "the requested closed repair window intersects another scheduled window in the same bay, including windows sharing a single endpoint"
  - id: ERR_WEIGH_IN_WINDOW_CLOSED
    http: 409
    condition: "a weigh-in is recorded outside the regatta's half-open weigh-in window"
  - id: ERR_PROTEST_WINDOW_CLOSED
    http: 409
    condition: "a protest is filed at or after the heat's protest_window_closes_at"
  - id: ERR_PROTEST_WINDOW_OPEN
    http: 409
    condition: "officialization attempted before the heat's protest_window_closes_at"
  - id: ERR_SEAT_COUNT_MISMATCH
    http: 422
    condition: "the declared seats do not exactly fill the seat count implied by the entry's boat_class"
  - id: ERR_DUPLICATE_SEAT_MEMBER
    http: 409
    condition: "the same member appears in two seats of one lineup declaration"
  - id: ERR_BOAT_CLASS_MISMATCH
    http: 409
    condition: "the entry's boat_class differs from the referenced shell's boat_class"
  - id: ERR_NO_ELIGIBLE_ENTRIES
    http: 409
    condition: "lane assignment requested when no CONFIRMED entry matches the heat's regatta_id and event_code"
  - id: ERR_REGATTA_NOT_RACING
    http: 409
    condition: "lane assignment was attempted while the heat's Regatta is not in status RACING"
  - id: ERR_LANE_CAPACITY_EXCEEDED
    http: 409
    condition: "the CONFIRMED candidate count exceeds the heat's lane_count"
  - id: ERR_TRAILER_TIER_UNAVAILABLE
    http: 409
    condition: "no tier at or below the hull's CLASS_MAX_TIER has a contiguous run of free rack units large enough"
  - id: ERR_MAX_JURY_ROUNDS_EXCEEDED
    http: 409
    condition: "a further review round or remand is requested after MAX_JURY_ROUNDS have been used"
  - id: ERR_WEIGH_IN_NOT_PASSED
    http: 409
    condition: "confirmation attempted while a coxswain seat's weigh_in_status is not PASSED"
  - id: ERR_ENTRY_NOT_RACKED
    http: 409
    condition: "confirmation attempted for an away entry with no rack assignment, or whose trailer load is still OPEN"
  - id: ERR_LANE_NOT_IN_HEAT
    http: 409
    condition: "the protested lane belongs to a different heat than the protest's heat_id"
  - id: ERR_HEAT_NOT_IN_REGATTA
    http: 409
    condition: "advances_to_heat_id names a heat in another regatta or an earlier round"
  - id: ERR_TRAILER_REGATTA_MISMATCH
    http: 409
    condition: "the entry being racked belongs to a different regatta than the trailer load"
  - id: ERR_SEAT_MEMBER_DELINQUENT
    http: 402
    condition: "a seated member's dues balance is non-zero, making the seat BLOCKED_DUES at submission"
  - id: ERR_INVOICE_NOT_PAYABLE
    http: 409
    condition: "payment or true-up attempted on an invoice whose status is PAID or VOIDED"
  - id: ERR_PAYMENT_EXCEEDS_BALANCE
    http: 422
    condition: "amount_cents exceeds the invoice's remaining balance"
  - id: ERR_INVOICE_HAS_PAYMENTS
    http: 409
    condition: "void attempted on an invoice with paid_cents greater than 0"
  - id: ERR_TRUEUP_ALREADY_APPLIED
    http: 409
    condition: "true-up attempted on an invoice whose variant_basis is already TRUEUP"

roles:
  - name: ClubAdmin
    description: "Club office: enrols members, bills dues, runs the delinquency checkpoint, and owns the regatta calendar and the logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /boathouse/_clock/set_current_utc"
      - "POST /boathouse/members"
      - "PATCH /boathouse/members/{id}/certifications"
      - "POST /boathouse/members/{id}/status-transitions"
      - "POST /boathouse/dues-invoices"
      - "POST /boathouse/dues-invoices/{id}/true-up"
      - "POST /boathouse/dues-invoices/{id}/void"
      - "POST /boathouse/ops/dues-delinquency-run"
      - "POST /boathouse/regattas"
      - "POST /boathouse/regattas/{id}/status-transitions"
    shared_operations:
      - "POST /boathouse/shells (with EquipmentManager)"
      - "POST /boathouse/dues-invoices/{id}/payments (with Member)"
      - "POST /boathouse/regatta-entries/{id}/scratch (with Coach)"
      - "POST /boathouse/trailer-loads (with EquipmentManager)"
      - "all GET reads"
  - name: Member
    description: "Ordinary club member: pays own dues, files damage reports, lodges and withdraws protests"
    identity: "entity_backed:Member"
    exclusive_operations:
      - "POST /boathouse/protests/{id}/withdraw"
      - "GET /boathouse/members/{id}/dues-invoices for own member id"
    shared_operations:
      - "POST /boathouse/dues-invoices/{id}/payments (with ClubAdmin)"
      - "POST /boathouse/damage-reports (with Coach and EquipmentManager)"
      - "POST /boathouse/protests (with Coach)"
      - "GET reads of members, shells, sessions, regattas, heats, lanes, protests and seats"
  - name: Coach
    description: "Coaching staff: books water sessions, declares lineups, submits and scratches entries"
    identity: "entity_backed:Member"
    exclusive_operations:
      - "POST /boathouse/regatta-entries"
      - "POST /boathouse/regatta-entries/{id}/lineup"
      - "POST /boathouse/regatta-entries/{id}/submit"
    shared_operations:
      - "POST /boathouse/water-sessions (with SafetyOfficer)"
      - "POST /boathouse/water-sessions/{id}/cancel (with SafetyOfficer)"
      - "POST /boathouse/damage-reports (with Member and EquipmentManager)"
      - "POST /boathouse/regatta-entries/{id}/scratch (with ClubAdmin)"
      - "POST /boathouse/protests (with Member)"
  - name: SafetyOfficer
    description: "Dock safety officer: posts condition readings and owns the clear / launch / return gate; may never clear a session they coach"
    identity: "entity_backed:Member"
    exclusive_operations:
      - "POST /boathouse/water-condition-readings"
      - "POST /boathouse/water-sessions/{id}/clear"
      - "POST /boathouse/water-sessions/{id}/launch"
      - "POST /boathouse/water-sessions/{id}/return"
    shared_operations:
      - "POST /boathouse/water-sessions (with Coach)"
      - "POST /boathouse/water-sessions/{id}/cancel (with Coach)"
  - name: EquipmentManager
    description: "Boatman: owns the fleet, the damage-report pipeline, and trailer racking; may never triage or verify a report they filed"
    identity: "entity_backed:Member"
    exclusive_operations:
      - "POST /boathouse/shells/{id}/retire"
      - "POST /boathouse/damage-reports/{id}/triage"
      - "POST /boathouse/damage-reports/{id}/schedule-repair"
      - "POST /boathouse/damage-reports/{id}/verify-repair"
      - "POST /boathouse/damage-reports/{id}/condemn"
      - "POST /boathouse/trailer-loads/{id}/rack-assignments"
      - "POST /boathouse/trailer-loads/{id}/rack-releases"
      - "POST /boathouse/trailer-loads/{id}/transitions"
    shared_operations:
      - "POST /boathouse/shells (with ClubAdmin)"
      - "POST /boathouse/trailer-loads (with ClubAdmin)"
      - "POST /boathouse/damage-reports (with Member and Coach)"
  - name: RaceOfficial
    description: "Host race committee: weighs coxswains, confirms entries, seeds heats, posts results and officializes; may never weigh a coxswain who is themselves"
    identity: "entity_backed:Member"
    exclusive_operations:
      - "POST /boathouse/lineup-seats/{id}/weigh-in"
      - "POST /boathouse/regatta-entries/{id}/confirm"
      - "POST /boathouse/heats"
      - "POST /boathouse/heats/{id}/assign-lanes"
      - "POST /boathouse/heats/{id}/results"
      - "POST /boathouse/heats/{id}/officialize"
    shared_operations:
      - "GET reads of members, shells, entries, seats, heats, lanes, protests and trailer loads"
  - name: JuryChair
    description: "Regatta jury: opens review rounds and rules on protests; barred from any protest they filed or any heat they raced in"
    identity: "entity_backed:Member"
    exclusive_operations:
      - "POST /boathouse/protests/{id}/open-review"
      - "POST /boathouse/protests/{id}/rule"
    shared_operations:
      - "GET reads of members, regattas, heats, lanes, entries and protests"
