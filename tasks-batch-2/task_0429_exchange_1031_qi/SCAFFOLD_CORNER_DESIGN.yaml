scaffold_corner_design:

  # =====================================================================
  # Entities
  # =====================================================================
  - section: entities
    instances:
      - name: create_exchanger_returns_201_with_system_fields
        claim_type: Creation
        grounds:
          - entities.Exchanger.fields.legal_name
          - entities.Exchanger.fields.taxpayer_id
        distinguishing_aspect: "POST /exchangers with legal_name, taxpayer_id, email returns 201 and a server-minted id, created_at, version=1."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /exchangers"
              payload: { legal_name: "Alice Doe", taxpayer_id: "TP-C-100", email: "alice@x.com" }
              as: QICoordinator
              captures: { exr_id: $.data.id, ver: $.data.version }
          assert:
            - "HTTP status == 201"
            - "Exchanger.${exr_id}.legal_name == Alice Doe"
            - "Exchanger.${exr_id}.version == 1"

      - name: get_exchange_not_found_returns_404
        claim_type: Not Found
        grounds:
          - errors[ERR_NOT_FOUND]
        distinguishing_aspect: "GET /exchanges/{id} with a non-existent UUID returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /exchanges/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: QICoordinator
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_NOT_FOUND"
            - "HTTP status == 404"

      - name: create_exchange_missing_exchange_type_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - entities.Exchange.fields.exchange_type
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "POST /exchanges omitting the required exchange_type returns ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["one registered exchanger"]
          setup_api_calls:
            - call: "POST /exchangers"
              payload: { legal_name: "Req TP", taxpayer_id: "TP-REQ-1", email: "req@x.com" }
              as: QICoordinator
              captures: { exr_id: $.data.id }
          trigger:
            - call: "POST /exchanges"
              payload: { exchanger_id: "${exr_id}" }
              as: QICoordinator
              as_user_id: "coord-req"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_REQUEST"
            - "HTTP status == 422"

      - name: create_exchange_bad_exchange_type_enum_returns_invalid_request
        claim_type: Type Constraints
        grounds:
          - entities.Exchange.fields.exchange_type
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "exchange_type outside {FORWARD, REVERSE, IMPROVEMENT} is rejected with ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["one registered exchanger"]
          setup_api_calls:
            - call: "POST /exchangers"
              payload: { legal_name: "Enum TP", taxpayer_id: "TP-ENM-1", email: "enm@x.com" }
              as: QICoordinator
              captures: { exr_id: $.data.id }
          trigger:
            - call: "POST /exchanges"
              payload: { exchanger_id: "${exr_id}", exchange_type: "SIDEWAYS" }
              as: QICoordinator
              as_user_id: "coord-enm"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_REQUEST"
            - "HTTP status == 422"

      - name: relinquished_property_negative_fmv_returns_invalid_request
        claim_type: Type Constraints
        grounds:
          - entities.RelinquishedProperty.fields.fair_market_value
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "fair_market_value <= 0 violates the '> 0' bound and returns ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["a DRAFT FORWARD exchange"]
          setup_api_calls:
            - call: "POST /exchangers"
              payload: { legal_name: "Neg TP", taxpayer_id: "TP-NEG-1", email: "neg@x.com" }
              as: QICoordinator
              captures: { exr_id: $.data.id }
            - call: "POST /exchanges"
              payload: { exchanger_id: "${exr_id}", exchange_type: "FORWARD" }
              as: QICoordinator
              as_user_id: "coord-neg"
              captures: { ex_id: $.data.id }
          trigger:
            - call: "POST /exchanges/${ex_id}/relinquished-properties"
              payload: { address: "Z St", fair_market_value: 0, selling_expenses: 0, mortgage_payoff: 0, adjusted_basis: 0 }
              as: QICoordinator
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_REQUEST"
            - "HTTP status == 422"

      - name: improvement_value_defaults_to_zero_on_forward_replacement
        claim_type: Defaults
        grounds:
          - entities.ReplacementProperty.fields.improvement_value
        distinguishing_aspect: "Omitting improvement_value on a FORWARD replacement applies the default 0, so cash_applied = purchase_price - replacement_debt with no improvement add."
        test_recipe:
          setup: ["FORWARD exchange closed (net 350000, realized 290000) with FINALIZED identification candidate 420000"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: QICoordinator
            - call: "POST /exchangers"
              payload: { legal_name: "Def TP", taxpayer_id: "TP-DEF-1", email: "def@x.com" }
              as: QICoordinator
              captures: { exr_id: $.data.id }
            - call: "POST /exchanges"
              payload: { exchanger_id: "${exr_id}", exchange_type: "FORWARD" }
              as: QICoordinator
              as_user_id: "coord-def"
              captures: { ex_id: $.data.id }
            - call: "POST /exchanges/${ex_id}/relinquished-properties"
              payload: { address: "D St", fair_market_value: 500000, selling_expenses: 30000, mortgage_payoff: 120000, adjusted_basis: 180000 }
              as: QICoordinator
            - call: "POST /exchanges/${ex_id}/trust"
              payload: {}
              as: QICoordinator
            - call: "POST /exchanges/${ex_id}/close-relinquished"
              payload: {}
              as: QICoordinator
            - call: "POST /exchanges/${ex_id}/identifications"
              payload: { method: "THREE_PROPERTY" }
              as: QICoordinator
              captures: { idn_id: $.data.id }
            - call: "POST /identifications/${idn_id}/candidates"
              payload: { description: "Cand D", estimated_fmv: 420000 }
              as: QICoordinator
              captures: { cand_id: $.data.id }
            - call: "POST /identifications/${idn_id}/finalize"
              payload: {}
              as: QICoordinator
          trigger:
            - call: "POST /exchanges/${ex_id}/replacement-properties"
              payload: { identified_property_id: "${cand_id}", purchase_price: 420000, replacement_debt: 120000 }
              as: QICoordinator
              captures: { rp_id: $.data.id }
          assert:
            - "ReplacementProperty.${rp_id}.improvement_value == 0"
            - "ReplacementProperty.${rp_id}.cash_applied == 300000.00 (420000 - 120000, no improvement add)"

      - name: relinquished_net_proceeds_computed_input_ignored
        claim_type: Computed Fields
        grounds:
          - entities.RelinquishedProperty.fields.net_proceeds
          - calculations.net_proceeds
        distinguishing_aspect: "net_proceeds is source: computed; it remains 0 until close and is then the formula value 350000 regardless of any client-supplied value."
        test_recipe:
          setup: ["DRAFT FORWARD exchange with relinquished property attached, before close"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: QICoordinator
            - call: "POST /exchangers"
              payload: { legal_name: "Comp TP", taxpayer_id: "TP-CMP2-1", email: "cmp2@x.com" }
              as: QICoordinator
              captures: { exr_id: $.data.id }
            - call: "POST /exchanges"
              payload: { exchanger_id: "${exr_id}", exchange_type: "FORWARD" }
              as: QICoordinator
              as_user_id: "coord-cmp2"
              captures: { ex_id: $.data.id }
            - call: "POST /exchanges/${ex_id}/relinquished-properties"
              payload: { address: "C St", fair_market_value: 500000, selling_expenses: 30000, mortgage_payoff: 120000, adjusted_basis: 180000 }
              as: QICoordinator
              captures: { rel_id: $.data.id }
          trigger:
            - call: "GET /exchanges/${ex_id}/relinquished-properties"
              payload: {}
              as: QICoordinator
              captures: { np: "$.data[0].net_proceeds" }
          assert:
            - "RelinquishedProperty.${rel_id}.net_proceeds == 0 (computed, only set at close)"

      - name: identified_property_immutable_no_version_field
        claim_type: Immutability
        grounds:
          - entities.IdentifiedProperty.fields.status
        distinguishing_aspect: "IdentifiedProperty has common_fields:false; its create response carries id and created_at but no version field (no update endpoint exists)."
        test_recipe:
          setup: ["ACTIVE FORWARD exchange with a DRAFT identification"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: QICoordinator
            - call: "POST /exchangers"
              payload: { legal_name: "Imm TP", taxpayer_id: "TP-IMM-1", email: "imm@x.com" }
              as: QICoordinator
              captures: { exr_id: $.data.id }
            - call: "POST /exchanges"
              payload: { exchanger_id: "${exr_id}", exchange_type: "FORWARD" }
              as: QICoordinator
              as_user_id: "coord-imm"
              captures: { ex_id: $.data.id }
            - call: "POST /exchanges/${ex_id}/relinquished-properties"
              payload: { address: "I St", fair_market_value: 500000, selling_expenses: 30000, mortgage_payoff: 120000, adjusted_basis: 180000 }
              as: QICoordinator
            - call: "POST /exchanges/${ex_id}/trust"
              payload: {}
              as: QICoordinator
            - call: "POST /exchanges/${ex_id}/close-relinquished"
              payload: {}
              as: QICoordinator
            - call: "POST /exchanges/${ex_id}/identifications"
              payload: { method: "THREE_PROPERTY" }
              as: QICoordinator
              captures: { idn_id: $.data.id }
          trigger:
            - call: "POST /identifications/${idn_id}/candidates"
              payload: { description: "Imm cand", estimated_fmv: 420000 }
              as: QICoordinator
              captures: { cand_id: $.data.id, st: $.data.status }
          assert:
            - "IdentifiedProperty.${cand_id}.status == CANDIDATE"
            - "the create response carries id and created_at but no version field"

      - name: list_exchanges_pagination_envelope
        claim_type: Listing
        grounds:
          - endpoints
        distinguishing_aspect: "GET /exchanges returns response_type array with pagination fields limit, offset, total_count, has_more."
        test_recipe:
          setup: ["at least one exchanger and one exchange exist"]
          setup_api_calls:
            - call: "POST /exchangers"
              payload: { legal_name: "List TP", taxpayer_id: "TP-LST-1", email: "lst@x.com" }
              as: QICoordinator
              captures: { exr_id: $.data.id }
            - call: "POST /exchanges"
              payload: { exchanger_id: "${exr_id}", exchange_type: "FORWARD" }
              as: QICoordinator
              as_user_id: "coord-lst"
          trigger:
            - call: "GET /exchanges"
              payload: { limit: 10, offset: 0 }
              as: QICoordinator
          assert:
            - "response_type == array"
            - "pagination fields total_count and has_more present"

      - name: duplicate_taxpayer_id_returns_conflict
        claim_type: Type Constraints
        grounds:
          - entities.Exchanger.fields.taxpayer_id
          - errors[ERR_DUPLICATE_TAXPAYER_ID]
        distinguishing_aspect: "Registering a second exchanger with an existing taxpayer_id returns ERR_DUPLICATE_TAXPAYER_ID (409)."
        test_recipe:
          setup: ["one exchanger registered with taxpayer_id TP-DUP-1"]
          setup_api_calls:
            - call: "POST /exchangers"
              payload: { legal_name: "Dup A", taxpayer_id: "TP-DUP-1", email: "a@x.com" }
              as: QICoordinator
          trigger:
            - call: "POST /exchangers"
              payload: { legal_name: "Dup B", taxpayer_id: "TP-DUP-1", email: "b@x.com" }
              as: QICoordinator
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_DUPLICATE_TAXPAYER_ID"
            - "HTTP status == 409"

  # =====================================================================
  # State Machines
  # =====================================================================
  - section: state_machines
    instances:
      - name: approve_already_settled_disbursement_returns_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - state_machines.Disbursement.REQUESTED_to_SETTLED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Approving a disbursement already in SETTLED returns ERR_INVALID_STATE; no second debit occurs."
        test_recipe:
          setup: ["FORWARD exchange closed; a QI_FEE disbursement of 1500 already SETTLED"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: QICoordinator
            - call: "POST /exchangers"
              payload: { legal_name: "Idem TP", taxpayer_id: "TP-IDM-1", email: "idm@x.com" }
              as: QICoordinator
              captures: { exr_id: $.data.id }
            - call: "POST /exchanges"
              payload: { exchanger_id: "${exr_id}", exchange_type: "FORWARD" }
              as: QICoordinator
              as_user_id: "coord-idm"
              captures: { ex_id: $.data.id }
            - call: "POST /exchanges/${ex_id}/relinquished-properties"
              payload: { address: "S St", fair_market_value: 500000, selling_expenses: 30000, mortgage_payoff: 120000, adjusted_basis: 180000 }
              as: QICoordinator
            - call: "POST /exchanges/${ex_id}/trust"
              payload: {}
              as: QICoordinator
              captures: { tr_id: $.data.id }
            - call: "POST /exchanges/${ex_id}/close-relinquished"
              payload: {}
              as: QICoordinator
            - call: "GET /exchanges/${ex_id}/trust"
              payload: {}
              as: QICoordinator
              captures: { tr_v: "$.data[0].version" }
            - call: "POST /disbursements"
              payload: { exchange_id: "${ex_id}", purpose: "QI_FEE", amount: 1500, expected_qualified_trust_version: "${tr_v}" }
              as: QICoordinator
              captures: { dis_id: $.data.id }
            - call: "POST /disbursements/${dis_id}/approve"
              payload: {}
              as: SettlementOfficer
              as_user_id: "officer-1"
          trigger:
            - call: "POST /disbursements/${dis_id}/approve"
              payload: {}
              as: SettlementOfficer
              as_user_id: "officer-1"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE"
            - "QualifiedTrust.${tr_id}.available_balance == 348500.00 (only one debit, idempotent rejection)"

      - name: complete_from_terminal_failed_returns_invalid_state
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.Exchange.ACTIVE_to_FAILED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Completing an exchange already in terminal FAILED returns ERR_INVALID_STATE; no transition from a terminal state."
        test_recipe:
          setup: ["FORWARD exchange FAILED after the 180-day window lapsed"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: QICoordinator
            - call: "POST /exchangers"
              payload: { legal_name: "Term TP", taxpayer_id: "TP-TRM-1", email: "trm@x.com" }
              as: QICoordinator
              captures: { exr_id: $.data.id }
            - call: "POST /exchanges"
              payload: { exchanger_id: "${exr_id}", exchange_type: "FORWARD" }
              as: QICoordinator
              as_user_id: "coord-trm"
              captures: { ex_id: $.data.id }
            - call: "POST /exchanges/${ex_id}/relinquished-properties"
              payload: { address: "T St", fair_market_value: 500000, selling_expenses: 30000, mortgage_payoff: 120000, adjusted_basis: 180000 }
              as: QICoordinator
            - call: "POST /exchanges/${ex_id}/trust"
              payload: {}
              as: QICoordinator
            - call: "POST /exchanges/${ex_id}/close-relinquished"
              payload: {}
              as: QICoordinator
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: QICoordinator
            - call: "POST /exchanges/${ex_id}/fail"
              payload: {}
              as: QICoordinator
          trigger:
            - call: "POST /exchanges/${ex_id}/complete"
              payload: {}
              as: QICoordinator
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE"
            - "Exchange.${ex_id}.status == FAILED (unchanged)"

      - name: new_exchange_starts_in_draft_posture_open_after_close
        claim_type: Initial State
        grounds:
          - state_machines.Exchange.initial_state
          - entities.Exchange.fields.status
        distinguishing_aspect: "A freshly created exchange has status DRAFT; after close-relinquished status becomes ACTIVE and posture OPEN."
        test_recipe:
          setup: ["one exchanger"]
          setup_api_calls:
            - call: "POST /exchangers"
              payload: { legal_name: "Init TP", taxpayer_id: "TP-INI-1", email: "ini@x.com" }
              as: QICoordinator
              captures: { exr_id: $.data.id }
          trigger:
            - call: "POST /exchanges"
              payload: { exchanger_id: "${exr_id}", exchange_type: "FORWARD" }
              as: QICoordinator
              as_user_id: "coord-ini"
              captures: { ex_id: $.data.id, st: $.data.status }
          assert:
            - "Exchange.${ex_id}.status == DRAFT"

      - name: revoke_finalized_identification_returns_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - state_machines.Identification.DRAFT_to_REVOKED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Revoking a FINALIZED identification returns ERR_INVALID_STATE; revoke only valid from DRAFT."
        test_recipe:
          setup: ["FORWARD exchange ACTIVE with a FINALIZED identification (one candidate)"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: QICoordinator
            - call: "POST /exchangers"
              payload: { legal_name: "RevF TP", taxpayer_id: "TP-RVF-1", email: "rvf@x.com" }
              as: QICoordinator
              captures: { exr_id: $.data.id }
            - call: "POST /exchanges"
              payload: { exchanger_id: "${exr_id}", exchange_type: "FORWARD" }
              as: QICoordinator
              as_user_id: "coord-rvf"
              captures: { ex_id: $.data.id }
            - call: "POST /exchanges/${ex_id}/relinquished-properties"
              payload: { address: "RF St", fair_market_value: 500000, selling_expenses: 30000, mortgage_payoff: 120000, adjusted_basis: 180000 }
              as: QICoordinator
            - call: "POST /exchanges/${ex_id}/trust"
              payload: {}
              as: QICoordinator
            - call: "POST /exchanges/${ex_id}/close-relinquished"
              payload: {}
              as: QICoordinator
            - call: "POST /exchanges/${ex_id}/identifications"
              payload: { method: "THREE_PROPERTY" }
              as: QICoordinator
              captures: { idn_id: $.data.id }
            - call: "POST /identifications/${idn_id}/candidates"
              payload: { description: "RF cand", estimated_fmv: 420000 }
              as: QICoordinator
            - call: "POST /identifications/${idn_id}/finalize"
              payload: {}
              as: QICoordinator
          trigger:
            - call: "POST /identifications/${idn_id}/revoke"
              payload: {}
              as: QICoordinator
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE"
            - "Identification.${idn_id}.status == FINALIZED (unchanged)"

      - name: void_requested_disbursement_no_trust_effect
        claim_type: Valid Transition
        grounds:
          - state_machines.Disbursement.REQUESTED_to_VOIDED
          - entities.QualifiedTrust.fields.available_balance
        distinguishing_aspect: "Voiding a still-REQUESTED disbursement moves it to VOIDED with no trust debit/credit (it was never settled)."
        test_recipe:
          setup: ["FORWARD exchange closed (trust 350000); a REQUESTED QI_FEE disbursement of 1500"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: QICoordinator
            - call: "POST /exchangers"
              payload: { legal_name: "VR TP", taxpayer_id: "TP-VR-1", email: "vr@x.com" }
              as: QICoordinator
              captures: { exr_id: $.data.id }
            - call: "POST /exchanges"
              payload: { exchanger_id: "${exr_id}", exchange_type: "FORWARD" }
              as: QICoordinator
              as_user_id: "coord-vr"
              captures: { ex_id: $.data.id }
            - call: "POST /exchanges/${ex_id}/relinquished-properties"
              payload: { address: "VR St", fair_market_value: 500000, selling_expenses: 30000, mortgage_payoff: 120000, adjusted_basis: 180000 }
              as: QICoordinator
            - call: "POST /exchanges/${ex_id}/trust"
              payload: {}
              as: QICoordinator
              captures: { tr_id: $.data.id }
            - call: "POST /exchanges/${ex_id}/close-relinquished"
              payload: {}
              as: QICoordinator
            - call: "GET /exchanges/${ex_id}/trust"
              payload: {}
              as: QICoordinator
              captures: { tr_v: "$.data[0].version" }
            - call: "POST /disbursements"
              payload: { exchange_id: "${ex_id}", purpose: "QI_FEE", amount: 1500, expected_qualified_trust_version: "${tr_v}" }
              as: QICoordinator
              captures: { dis_id: $.data.id }
          trigger:
            - call: "POST /disbursements/${dis_id}/void"
              payload: {}
              as: SettlementOfficer
              as_user_id: "officer-1"
          assert:
            - "Disbursement.${dis_id}.settlement_status == VOIDED"
            - "QualifiedTrust.${tr_id}.available_balance == 350000.00 (no trust effect)"

      - name: posture_auto_transitions_at_risk_after_45day_lapse
        claim_type: Side Effect Execution
        grounds:
          - state_machines.Exchange.ACTIVE_to_ACTIVE
          - entities.Exchange.fields.compliance_posture
        distinguishing_aspect: "Reading the exchange after advancing the clock past id_deadline_at with no FINALIZED identification lazily recomputes compliance_posture to AT_RISK."
        test_recipe:
          setup: ["FORWARD exchange ACTIVE, no identification finalized; clock advanced to 2026-04-16 (past 45-day deadline)"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: QICoordinator
            - call: "POST /exchangers"
              payload: { legal_name: "AtRisk TP", taxpayer_id: "TP-AR-1", email: "ar@x.com" }
              as: QICoordinator
              captures: { exr_id: $.data.id }
            - call: "POST /exchanges"
              payload: { exchanger_id: "${exr_id}", exchange_type: "FORWARD" }
              as: QICoordinator
              as_user_id: "coord-ar"
              captures: { ex_id: $.data.id }
            - call: "POST /exchanges/${ex_id}/relinquished-properties"
              payload: { address: "AR St", fair_market_value: 500000, selling_expenses: 30000, mortgage_payoff: 120000, adjusted_basis: 180000 }
              as: QICoordinator
            - call: "POST /exchanges/${ex_id}/trust"
              payload: {}
              as: QICoordinator
