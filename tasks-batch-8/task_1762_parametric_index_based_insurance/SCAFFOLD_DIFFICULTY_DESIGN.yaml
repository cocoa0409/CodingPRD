  # ---------------------------------------------------------------------------
  # Rule 4 — transitive_cascade (different triggers, depths >= 3 and >= 2)
  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: observation_revision_annuls_event_cascades_claims_and_posture
        grounds:
          - state_machines.TriggerEvent.VERIFIED_to_ANNULLED
          - state_machines.PayoutClaim.GENERATED_to_DECLINED
          - state_machines.ParametricPolicy_settlement_posture.PAYMENT_PENDING_to_SETTLED_QUIET
          - calculations.blended_index_value
        distinguishing_aspect: |
          Depth-3 transitive cascade triggered by a late observation revision:
          POST observation (superseding) flips is_effective on the old row (hop 1),
          the recomputed blend drops max_tier_breached to 0 so the VERIFIED event
          auto-annuls (hop 2, caused by hop 1), annulment auto-declines the
          GENERATED claim (hop 3, caused by hop 2), and the claim's terminal
          transition bubbles the policy posture from PAYMENT_PENDING re-evaluation
          (hop 4, caused by hop 3). Each link is caused by the previous link.
        test_recipe:
          setup:
            - "Program ACTIVE, index BELOW t1<=50/0.25, STATION_PRIMARY, two stations: PHYSICAL ST-A w=1.0, GRID_MODEL GM-B w=0.5"
            - "Holder ACTIVE; policy si 2,000,000 BOUND covering 2026"
            - "Observation ST-A 2026-06-30 value 40 -> DETECTED event; verified -> claim GENERATED (posture unchanged at CLEAR since claims only move posture on APPROVED; to reach PAYMENT_PENDING we approve the claim first with fraud_score 0)"
            - "Then a revision observation for ST-A 2026-06-30 with value 80 superseding the 40 reading"
