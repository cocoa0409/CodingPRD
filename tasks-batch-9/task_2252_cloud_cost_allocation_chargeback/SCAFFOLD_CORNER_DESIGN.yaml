              - call: "PATCH /finops/cloud-resources/${res_id}/telemetry"
                payload: { utilization_pct: 20.00 }
                as: PlatformAdmin
                as_user_id: "admin-1"
              - call: "PATCH /finops/cloud-resources/${res_id}/telemetry"
                payload: { utilization_pct: 40.00 }
                as: PlatformAdmin
                as_user_id: "admin-1"
              - call: "GET /finops/business-units/${bu_id}"
                payload: {}
                as: FinOpsAnalyst
                as_user_id: "analyst-1"
            assert:
              - "After the sweep the task is EXECUTED with realized_savings_cents == 20000 and the resource is RESIZED with monthly_run_rate_cents == 20000."
              - "Telemetry 20.00: HTTP 200, data.utilization_pct == 20.0, data.lifecycle_state still \"RESIZED\" — the guard is not met."
              - "Telemetry 40.00: HTTP 200, data.utilization_pct == 40.0, data.lifecycle_state == \"ACTIVE\"."
              - "Unit read: data.tracked_run_rate_cents == 20000 and data.resource_count == 1 — the rightsizing cascade recomputed the unit's tracked run rate."

        - name: unit_economics_read_reports_cost_per_unit_and_efficiency_tier
          claim_type: Computed read
          grounds: "§1.5 GET /finops/unit-economics-drivers and §1.3 unit_economics_cost_per_unit with its tier ladder and overhead rates."
          excluded_because:
            difficulty_instance: unit_economics_tier_pinned_from_provisional_cost_per_unit
            rationale: "The §1.8 state_dependent_calculation instance already reads the driver back after both a provisional and a final compute and pins cost_per_unit_cents, efficiency_tier and the overhead the tier selects, which is exactly the computed-read claim for this endpoint."

    - section: errors
      instances:
        - name: unauthenticated_request_returns_401_before_the_existence_check
          claim_type: Error Triggerable
          grounds: "§1.6 ERR_UNAUTHENTICATED (401) when X-User-ID or X-User-Role is missing or empty; §1.4 priority 1 applies to all endpoints, ahead of the priority-10 existence checks."
          distinguishing_aspect: "The unknown id is probed twice — once with no identity headers and once with a valid PlatformAdmin identity — so the 401 is shown to pre-empt the 404 rather than merely to coexist with it."
          test_recipe:
            setup:
              - "One business unit."
              - "In this instance's trigger chain, `as: NONE` with `as_user_id: null` means the request is sent with the X-User-ID and X-User-Role headers omitted entirely."
            setup_api_calls:
              - call: "POST /finops/business-units"
                payload: { name: "Ops", cost_center_code: "CC-400" }
                as: PlatformAdmin
                as_user_id: "admin-1"
                captures: { bu_id: "$.data.id" }
            trigger:
              - call: "GET /finops/business-units/${bu_id}"
                payload: {}
                as: NONE
                as_user_id: null
              - call: "GET /finops/business-units/bu-does-not-exist"
                payload: {}
                as: NONE
                as_user_id: null
              - call: "GET /finops/business-units/bu-does-not-exist"
                payload: {}
                as: FinOpsAnalyst
                as_user_id: "analyst-1"
            assert:
              - "Headerless read of the real unit: HTTP 401 with data.error_id == \"ERR_UNAUTHENTICATED\"."
              - "Headerless read of the unknown unit: HTTP 401 with data.error_id == \"ERR_UNAUTHENTICATED\" — priority 1 beats priority 10."
              - "Authenticated read of the unknown unit: HTTP 404 with data.error_id == \"ERR_BUSINESS_UNIT_NOT_FOUND\"."

        - name: every_unknown_path_id_returns_its_own_entity_specific_not_found_id
          claim_type: Error Triggerable
          grounds: "§1.4 priority 10 maps each path id to the matching ERR_<ENTITY>_NOT_FOUND (404); §1.6 lists one not-found code per addressable entity family."
          distinguishing_aspect: "Six different entity families are missed in one instance, so a shared generic 404 would be caught: each response must name its own error id."
          test_recipe:
            setup:
              - "An empty store — nothing is created, which is exactly what makes every id unknown."
            setup_api_calls: []
            trigger:
              - call: "GET /finops/cloud-resources/res-does-not-exist"
                payload: {}
                as: FinOpsAnalyst
                as_user_id: "analyst-1"
              - call: "GET /finops/allocation-runs/run-does-not-exist"
                payload: {}
                as: FinOpsAnalyst
                as_user_id: "analyst-1"
              - call: "GET /finops/disputes/dsp-does-not-exist"
                payload: {}
                as: FinOpsAnalyst
                as_user_id: "analyst-1"
              - call: "GET /finops/remediation-tasks/rmd-does-not-exist"
                payload: {}
                as: FinOpsAnalyst
                as_user_id: "analyst-1"
              - call: "GET /finops/commitments/cmt-does-not-exist"
                payload: {}
                as: FinOpsAnalyst
                as_user_id: "analyst-1"
              - call: "GET /finops/anomaly-alerts/alr-does-not-exist"
                payload: {}
                as: FinOpsAnalyst
                as_user_id: "analyst-1"
            assert:
              - "Cloud resource: HTTP 404, data.error_id == \"ERR_CLOUD_RESOURCE_NOT_FOUND\"."
              - "Allocation run: HTTP 404, data.error_id == \"ERR_ALLOCATION_RUN_NOT_FOUND\"."
              - "Dispute: HTTP 404, data.error_id == \"ERR_DISPUTE_NOT_FOUND\"."
              - "Remediation task: HTTP 404, data.error_id == \"ERR_REMEDIATION_TASK_NOT_FOUND\"."
              - "Commitment: HTTP 404, data.error_id == \"ERR_COMMITMENT_NOT_FOUND\"."
              - "Anomaly alert: HTTP 404, data.error_id == \"ERR_ALERT_NOT_FOUND\"."

        - name: settlement_must_exactly_clear_the_invoice_and_a_settled_invoice_blocks_reopen
          claim_type: Error Triggerable
          grounds: "§1.6 ERR_OVERPAYMENT (422) when a payment does not exactly clear the outstanding amount after credits; §1.6 ERR_RUN_REOPEN_BLOCKED (409) when a run is reopened while one of its invoices is SETTLED."
          distinguishing_aspect: "Both the short payment and the long payment are refused by the same code, which pins the wording 'does not exactly clear' rather than 'exceeds'; the exact payment then closes the ledger and, as a second-order consequence, permanently removes the run's escape hatch."
          test_recipe:
            setup:
              - "POOL CHARGEBACK FIXTURE at clock 2026-08-05T00:00:00Z — one ISSUED invoice of 5000 cents on a published chargeback run."
            setup_api_calls:
              - call: "POST /_clock/set_current_utc"
                payload: { current_utc: "2026-08-05T00:00:00Z" }
                as: PlatformAdmin
                as_user_id: "admin-1"
              - call: "POST /finops/business-units"
                payload: { name: "Ops", cost_center_code: "CC-400", chargeback_enabled: true, headcount: 10 }
                as: PlatformAdmin
                as_user_id: "admin-1"
                captures: { bu_id: "$.data.id" }
              - call: "POST /finops/cost-records"
                payload: { billing_period_start: "2026-07-01T00:00:00Z", billing_period_end: "2026-08-01T00:00:00Z", resource_kind: "STORAGE", list_cost_cents: 5000 }
                as: PlatformAdmin
                as_user_id: "admin-1"
                captures: { cr_id: "$.data.id" }
              - call: "POST /finops/allocation-runs"
                payload: { mode: "CHARGEBACK", period_start: "2026-07-01T00:00:00Z", period_end: "2026-08-01T00:00:00Z" }
                as: FinOpsAnalyst
                as_user_id: "analyst-1"
                captures: { run_id: "$.data.id" }
              - call: "POST /finops/allocation-runs/${run_id}/shared-cost-pools"
                payload: { name: "Untagged", methodology: "PROPORTIONAL", proportional_basis: "HEADCOUNT", participant_business_unit_ids: ["${bu_id}"] }
                as: FinOpsAnalyst
                as_user_id: "analyst-1"
                captures: { pool_id: "$.data.id" }
              - call: "POST /finops/shared-cost-pools/${pool_id}/absorb-untagged"
                payload: { cost_record_ids: ["${cr_id}"] }
                as: FinOpsAnalyst
                as_user_id: "analyst-1"
              - call: "POST /finops/shared-cost-pools/${pool_id}/seal"
                payload: {}
                as: FinOpsAnalyst
                as_user_id: "analyst-1"
              - call: "POST /finops/allocation-runs/${run_id}/compute"
                payload: { variant: "FINAL" }
                as: FinOpsAnalyst
                as_user_id: "analyst-1"
              - call: "POST /finops/allocation-runs/${run_id}/publish"
                payload: {}
                as: FinOpsController
                as_user_id: "controller-1"
              - call: "GET /finops/chargeback-invoices?allocation_run_id=${run_id}"
                payload: {}
                as: FinOpsController
                as_user_id: "controller-1"
                captures: { inv_id: "$.data[0].id" }
              - call: "POST /finops/chargeback-invoices/${inv_id}/issue"
                payload: {}
                as: FinOpsController
                as_user_id: "controller-1"
            trigger:
              - call: "POST /finops/chargeback-invoices/${inv_id}/settle"
                payload: { payment_cents: 4999 }
                as: BusinessUnitOwner
                as_user_id: "${bu_id}"
              - call: "POST /finops/chargeback-invoices/${inv_id}/settle"
                payload: { payment_cents: 5001 }
                as: BusinessUnitOwner
                as_user_id: "${bu_id}"
              - call: "POST /finops/chargeback-invoices/${inv_id}/settle"
                payload: { payment_cents: 5000 }
                as: BusinessUnitOwner
                as_user_id: "${bu_id}"
              - call: "POST /finops/allocation-runs/${run_id}/reopen"
                payload: { reason: "late credit memo" }
                as: FinOpsController
                as_user_id: "controller-1"
              - call: "GET /finops/business-units/${bu_id}"
                payload: {}
                as: FinOpsController
                as_user_id: "controller-1"
            assert:
              - "4999: HTTP 422 with data.error_id == \"ERR_OVERPAYMENT\"; paid_amount_cents stays 0."
              - "5001: HTTP 422 with data.error_id == \"ERR_OVERPAYMENT\"."
              - "5000: HTTP 200 with data.settlement_status == \"SETTLED\", data.paid_amount_cents == 5000, data.net_due_cents == 0."
              - "Reopen: HTTP 409 with data.error_id == \"ERR_RUN_REOPEN_BLOCKED\"; the run stays PUBLISHED with reopen_count 0."
              - "Unit read: data.chargeback_balance_cents == 0."

        - name: closing_a_run_with_an_unsettled_invoice_returns_run_not_fully_settled
          claim_type: Error Triggerable
          grounds: "§1.6 ERR_RUN_NOT_FULLY_SETTLED (409) on POST /finops/allocation-runs/{id}/close."
          excluded_because:
            difficulty_instance: run_close_gated_by_every_invoice_reaching_a_settled_state
            rationale: "The §1.8 cross_entity_state_gate instance already closes a two-invoice run with one invoice still ISSUED, pins the 409, then settles the laggard and closes successfully."

        - name: fourth_information_request_on_a_dispute_returns_dispute_round_limit
          claim_type: Error Triggerable
          grounds: "§1.6 ERR_DISPUTE_ROUND_LIMIT (409) on start-review and respond once review_round has reached MAX_DISPUTE_ROUNDS."
          excluded_because:
            difficulty_instance: dispute_info_request_cycle_capped_at_three_review_rounds
            rationale: "The §1.8 bounded_cycle instance already walks the request-information / respond cycle three times and pins the 409 on the fourth attempt together with review_round == 3."

        - name: dispute_credit_above_the_invoice_and_dispute_on_a_written_off_invoice
          claim_type: Error Triggerable
          grounds: "§1.6 ERR_CREDIT_EXCEEDS_INVOICE (422) and ERR_INVOICE_NOT_DISPUTABLE (409), both on POST /finops/disputes."
          excluded_because:
            difficulty_instance: written_off_invoice_state_check_precedes_credit_ceiling_check
            rationale: "The §1.8 priority_pair_validation_conflict instance triggers both codes: the 409 when the two violations co-occur on a WRITTEN_OFF invoice, and the isolated 422 when only the credit ceiling is breached."

        - name: publisher_identity_and_unsealed_pool_refusals_on_publish
          claim_type: Error Triggerable
          grounds: "§1.6 ERR_SEGREGATION_OF_DUTIES (403) and ERR_POOL_NOT_SEALED (409), both reachable on POST /finops/allocation-runs/{id}/publish."
          excluded_because:
            difficulty_instance: segregation_of_duties_precedes_unsealed_pool_check_on_publish
            rationale: "The §1.8 priority_pair_validation_conflict instance publishes a run whose pool is unsealed using the controller who created the run, pins the 403, then isolates the 409 with a different publisher."

        - name: approval_blocked_until_a_breached_budget_is_explained
          claim_type: Error Triggerable
          grounds: "§1.6 ERR_VARIANCE_EXPLANATION_REQUIRED (422) on POST /finops/provisioning-requests/{id}/approve."
          excluded_because:
            difficulty_instance: provisioning_approval_gated_by_breached_budget_without_explanation
            rationale: "The §1.8 cross_entity_state_gate instance already breaches a budget, pins the 422 on approval, records the narrative and re-approves successfully."

        - name: second_run_for_the_same_mode_and_period_returns_period_overlap
          claim_type: Error Triggerable
          grounds: "§1.6 ERR_ALLOCATION_PERIOD_OVERLAP (409) with half-open interval semantics on POST /finops/allocation-runs."
          excluded_because:
            difficulty_instance: allocation_run_periods_half_open_adjacency_allowed
            rationale: "The §1.8 boundary_interval_semantics instance already contrasts an adjacent period (accepted) with a one-second overlap (rejected) for the same mode and scope."

        - name: commitment_purchased_inside_the_buffer_returns_window_conflict
          claim_type: Error Triggerable
          grounds: "§1.6 ERR_COMMITMENT_WINDOW_CONFLICT (409) with closed-interval plus COMMITMENT_BUFFER_HOURS semantics on POST /finops/commitments."
          excluded_because:
            difficulty_instance: commitment_terms_closed_interval_with_twenty_four_hour_buffer
            rationale: "The §1.8 boundary_interval_semantics instance already probes the 24-hour pad on both sides for the same region and commitment type."

        - name: pool_whose_only_participant_is_suspended_returns_no_eligible_participants
          claim_type: Error Triggerable
          grounds: "§1.6 ERR_NO_ELIGIBLE_PARTICIPANTS (422) on POST /finops/allocation-runs/{id}/compute."
          excluded_because:
            difficulty_instance: shared_pool_eligible_participant_set_drops_from_one_to_zero
            rationale: "The §1.8 empty_set_degeneracy instance already computes a pool whose sole participant has been suspended and pins the 422, then restores the unit and computes successfully."

    - section: rbac
      instances:
        - name: analyst_cannot_publish_and_controller_cannot_compute
          claim_type: Exclusive Operation Denied
          grounds: "§1.7 FinOpsAnalyst exclusive 'compute an allocation run'; FinOpsController exclusive 'publish, reopen and close an allocation run'; §1.5 role lists on the two endpoints; §1.4 priority 2 ERR_UNAUTHORIZED (403)."
          distinguishing_aspect: "The peer roles are denied in both directions on the same run in one instance, and each is then shown to succeed on its own step — so the model is peer segregation rather than a hierarchy where one role could do the other's work."
          test_recipe:
            setup:
              - "One chargeback-enabled unit, one chargeback run with a sealed pool holding a 3000-cent untagged record."
            setup_api_calls:
              - call: "POST /finops/business-units"
                payload: { name: "Ops", cost_center_code: "CC-400", chargeback_enabled: true, headcount: 10 }
                as: PlatformAdmin
                as_user_id: "admin-1"
                captures: { bu_id: "$.data.id" }
              - call: "POST /finops/cost-records"
                payload: { billing_period_start: "2026-07-01T00:00:00Z", billing_period_end: "2026-08-01T00:00:00Z", resource_kind: "STORAGE", list_cost_cents: 3000 }
                as: PlatformAdmin
                as_user_id: "admin-1"
                captures: { cr_id: "$.data.id" }
              - call: "POST /finops/allocation-runs"
                payload: { mode: "CHARGEBACK", period_start: "2026-07-01T00:00:00Z", period_end: "2026-08-01T00:00:00Z" }
                as: FinOpsAnalyst
                as_user_id: "analyst-1"
                captures: { run_id: "$.data.id" }
              - call: "POST /finops/allocation-runs/${run_id}/shared-cost-pools"
                payload: { name: "Untagged", methodology: "EVEN_SPLIT", participant_business_unit_ids: ["${bu_id}"] }
                as: FinOpsAnalyst
                as_user_id: "analyst-1"
                captures: { pool_id: "$.data.id" }
              - call: "POST /finops/shared-cost-pools/${pool_id}/absorb-untagged"
                payload: { cost_record_ids: ["${cr_id}"] }
                as: FinOpsAnalyst
                as_user_id: "analyst-1"
              - call: "POST /finops/shared-cost-pools/${pool_id}/seal"
                payload: {}
                as: FinOpsAnalyst
                as_user_id: "analyst-1"
            trigger:
              - call: "POST /finops/allocation-runs/${run_id}/compute"
                payload: { variant: "FINAL" }
                as: FinOpsController
                as_user_id: "controller-1"
              - call: "POST /finops/allocation-runs/${run_id}/compute"
                payload: { variant: "FINAL" }
                as: FinOpsAnalyst
                as_user_id: "analyst-1"
              - call: "POST /finops/allocation-runs/${run_id}/publish"
                payload: {}
                as: FinOpsAnalyst
                as_user_id: "analyst-1"
              - call: "POST /finops/allocation-runs/${run_id}/publish"
                payload: {}
                as: FinOpsController
                as_user_id: "controller-1"
            assert:
              - "Compute as controller: HTTP 403 with data.error_id == \"ERR_UNAUTHORIZED\"; the run stays DRAFT."
              - "Compute as analyst: HTTP 200 with data.status == \"COMPUTED_FINAL\" and data.total_allocated_cents == 3000."
              - "Publish as analyst: HTTP 403 with data.error_id == \"ERR_UNAUTHORIZED\"; the run stays COMPUTED_FINAL and no invoice exists."
              - "Publish as controller: HTTP 200 with data.status == \"PUBLISHED\"; GET /finops/chargeback-invoices?allocation_run_id=${run_id} then reports meta.total_count == 1."

        - name: business_unit_owner_cannot_settle_another_units_invoice
          claim_type: Peer Role Isolation
          grounds: "§1.7 BusinessUnitOwner is entity_backed:BusinessUnit and may act 'for its own unit only'; §1.4 priority 3 ERR_NOT_RESOURCE_OWNER (403) covers settle, disputes, respond, withdraw and variance-explanation."
          distinguishing_aspect: "The impostor holds a legitimate BusinessUnitOwner role and a real business-unit identity — only the identity-to-invoice binding is wrong — so a role-only check would let the payment through."
          test_recipe:
            setup:
