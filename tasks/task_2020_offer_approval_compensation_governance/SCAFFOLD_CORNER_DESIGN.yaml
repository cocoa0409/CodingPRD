# §1.9 Scaffold Corner Design — coverage index for non-Difficulty-Rule claims.
# Walks the claim-extraction guide sections against SCAFFOLD.yaml §1.1–§1.7.

scaffold_corner_design:

  # ==================================================== entities
  - section: entities
    instances:
      - name: requisition_creation_defaults
        claim_type: creation_defaults
        grounds: [entities.Requisition]
        distinguishing_aspect: "A created requisition starts in DRAFT with headcount_filled 0, committed_budget_cents 0, close_reason null, version 1, and hiring_manager_id captured from X-User-ID."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - call: "POST /api/requisitions"
              payload: { title: "Sr Eng", department: "ENG", role_level: L5, geo_tier: T1, annual_budget_cents: 50000000, salary_min_cents: 15000000, salary_mid_cents: 18000000, salary_max_cents: 21000000, headcount_authorized: 2 }
              as: HiringManager
              as_user_id: hm-1
              captures: { req_id: $.data.id, st: $.data.status, hf: $.data.headcount_filled, cb: $.data.committed_budget_cents, v: $.data.version, hmid: $.data.hiring_manager_id }
          trigger:
            - call: "GET /api/requisitions/${req_id}"
              as: Recruiter
              as_user_id: rec-1
          assert:
            - "status == DRAFT, headcount_filled == 0, committed_budget_cents == 0, close_reason == null, version == 1"
            - "hiring_manager_id == 'hm-1' (captured from X-User-ID, not from payload)"
            - "GET returns the identical persisted field set"

      - name: offer_create_computed_fields
        claim_type: computed_fields
        grounds: [entities.Offer, calculations.offer_cost, calculations.band_classification]
        distinguishing_aspect: "Computed fields are derived server-side at creation: base 20000000 + pct 0.10 + 10000 shares @ 2500 yields bonus_target_cents 2000000, cash_only 22000000, fully_loaded 34850000, band IN_BAND, round_count 0, clearance_posture NOT_STARTED."
        test_recipe:
          setup:
            - "Requisition (L5/T1 standard, budget 50000000, headcount 1) OPEN"
          setup_api_calls:
            - call: "POST /api/requisitions"
              payload: { title: "Sr Eng", department: "ENG", role_level: L5, geo_tier: T1, annual_budget_cents: 50000000, salary_min_cents: 15000000, salary_mid_cents: 18000000, salary_max_cents: 21000000, headcount_authorized: 1 }
              as: HiringManager
              as_user_id: hm-1
              captures: { req_id: $.data.id }
            - call: "POST /api/requisitions/${req_id}/submit"
              payload: {}
              as: HiringManager
              as_user_id: hm-1
            - call: "POST /api/requisitions/${req_id}/review-decision"
              payload: { decision: APPROVE }
              as: FinanceController
              as_user_id: fin-1
            - call: "POST /api/requisitions/${req_id}/review-decision"
              payload: { decision: APPROVE }
              as: CompAnalyst
              as_user_id: ca-1
            - call: "POST /api/candidates"
              payload: { full_name: "Cand CE", email: "cand.ce@x.com" }
              as: Recruiter
              as_user_id: rec-1
              captures: { cand_id: $.data.id }
          trigger:
            - call: "POST /api/offers"
              payload: { requisition_id: "${req_id}", candidate_id: "${cand_id}", base_cents: 20000000, bonus_target_pct: 0.10, equity_shares: 10000, equity_fmv_cents: 2500 }
              as: Recruiter
              as_user_id: rec-1
              captures: { offer_id: $.data.id }
          assert:
            - "Offer.bonus_target_cents == 2000000"
            - "Offer.cash_only_annual_cost_cents == 22000000"
            - "Offer.fully_loaded_annual_cost_cents == 34850000 (22000000 + 6250000 annualized equity + 6600000 benefits)"
            - "Offer.band == IN_BAND, round_count == 0, clearance_posture == NOT_STARTED, status == DRAFT"
            - "Candidate.${cand_id}.status == IN_PROCESS (PROSPECT -> IN_PROCESS on first offer)"

      - name: candidate_email_uniqueness
        claim_type: violation_to_error
        grounds: ["validations[priority=10]", "errors[ERR_CANDIDATE_EMAIL_EXISTS]"]
        distinguishing_aspect: "Case-insensitive email uniqueness: second create with 'CAND.DUP@x.com' after 'cand.dup@x.com' fails with ERR_CANDIDATE_EMAIL_EXISTS 409."
        test_recipe:
          setup: ["one candidate with email cand.dup@x.com"]
          setup_api_calls:
            - call: "POST /api/candidates"
              payload: { full_name: "Dup One", email: "cand.dup@x.com" }
              as: Recruiter
              as_user_id: rec-1
          trigger:
            - call: "POST /api/candidates"
              payload: { full_name: "Dup Two", email: "CAND.DUP@x.com" }
              as: Recruiter
              as_user_id: rec-1
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_CANDIDATE_EMAIL_EXISTS, http 409"

      - name: offer_create_missing_required_field_returns_invalid_request
        claim_type: required_fields
        grounds: ["validations[priority=2]", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Omitting required candidate_id on offer create fails shape validation with ERR_INVALID_REQUEST 400 before any existence check."
        test_recipe:
          setup: ["any OPEN requisition not even needed — shape check fires first"]
          setup_api_calls:
            - call: "POST /api/candidates"
              payload: { full_name: "Cand M1", email: "cand.m1@x.com" }
              as: Recruiter
              as_user_id: rec-1
              captures: { cand_id: $.data.id }
          trigger:
            - call: "POST /api/offers"
              payload: { requisition_id: "00000000-0000-0000-0000-000000000000", base_cents: 18000000, bonus_target_pct: 0, equity_shares: 0, equity_fmv_cents: 0 }
              as: Recruiter
              as_user_id: rec-1
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REQUEST (missing candidate_id), http 400"

      - name: requisition_invalid_enum_role_level_returns_invalid_request
        claim_type: type_constraints
        grounds: [entities.Requisition.fields.role_level, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "role_level 'L9' is outside the declared enum L3..L7 and is rejected at shape validation."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /api/requisitions"
              payload: { title: "Bad Level", department: "ENG", role_level: L9, geo_tier: T1, annual_budget_cents: 50000000, salary_min_cents: 15000000, salary_mid_cents: 18000000, salary_max_cents: 21000000, headcount_authorized: 1 }
              as: HiringManager
              as_user_id: hm-1
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REQUEST, http 400; no requisition persisted"

      - name: offer_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_OFFER_NOT_FOUND]"]
        distinguishing_aspect: "GET on a well-formed but nonexistent offer UUID returns ERR_OFFER_NOT_FOUND 404 in the error envelope."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /api/offers/11111111-2222-3333-4444-555555555555"
              as: Recruiter
              as_user_id: rec-1
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_OFFER_NOT_FOUND, http 404"

      - name: not_found_variants_across_entities
        claim_type: not_found
        grounds: ["errors[ERR_REQUISITION_NOT_FOUND]", "errors[ERR_CANDIDATE_NOT_FOUND]", "errors[ERR_APPROVAL_STEP_NOT_FOUND]", "errors[ERR_NEGOTIATION_ROUND_NOT_FOUND]", "errors[ERR_PERK_NOT_FOUND]", "errors[ERR_CLEARANCE_CHECK_NOT_FOUND]", "errors[ERR_DELEGATION_GRANT_NOT_FOUND]", "errors[ERR_POLICY_NOT_FOUND]", "errors[ERR_SNAPSHOT_NOT_FOUND]"]
        distinguishing_aspect: "Every remaining *_NOT_FOUND variant fires from its own endpoint with a nonexistent UUID."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /api/requisitions/11111111-2222-3333-4444-555555555555"
              as: Recruiter
              as_user_id: rec-1
              captures: { e_req: $.data.error_id }
            - call: "GET /api/candidates/11111111-2222-3333-4444-555555555555"
              as: Recruiter
              as_user_id: rec-1
              captures: { e_cand: $.data.error_id }
            - call: "GET /api/equity-snapshots/11111111-2222-3333-4444-555555555555"
              as: CompAnalyst
              as_user_id: ca-1
              captures: { e_snap: $.data.error_id }
            - call: "POST /api/approval-steps/11111111-2222-3333-4444-555555555555/decide"
              payload: { decision: APPROVED }
              as: HiringManager
              as_user_id: hm-1
              captures: { e_step: $.data.error_id }
            - call: "POST /api/negotiation-rounds/11111111-2222-3333-4444-555555555555/decision"
              payload: { outcome: ACCEPTED }
              as: VPPeople
              as_user_id: vp-1
              captures: { e_round: $.data.error_id }
            - call: "GET /api/perks/11111111-2222-3333-4444-555555555555/clawback-quote"
              payload: { months_worked: 1 }
              as: HRAdmin
              as_user_id: admin-1
              captures: { e_perk: $.data.error_id }
            - call: "POST /api/clearance-checks/11111111-2222-3333-4444-555555555555/transition"
              payload: { to: CLEARED }
              as: BackgroundScreener
              as_user_id: scr-1
              captures: { e_check: $.data.error_id }
            - call: "POST /api/delegation-grants/11111111-2222-3333-4444-555555555555/revoke"
              payload: {}
              as: HRAdmin
              as_user_id: admin-1
              captures: { e_grant: $.data.error_id }
            - call: "POST /api/approval-policies/11111111-2222-3333-4444-555555555555/deactivate"
              payload: {}
              as: HRAdmin
              as_user_id: admin-1
              captures: { e_pol: $.data.error_id }
          assert:
            - "e_req == ERR_REQUISITION_NOT_FOUND, e_cand == ERR_CANDIDATE_NOT_FOUND, e_snap == ERR_SNAPSHOT_NOT_FOUND"
            - "e_step == ERR_APPROVAL_STEP_NOT_FOUND, e_round == ERR_NEGOTIATION_ROUND_NOT_FOUND, e_perk == ERR_PERK_NOT_FOUND"
            - "e_check == ERR_CLEARANCE_CHECK_NOT_FOUND, e_grant == ERR_DELEGATION_GRANT_NOT_FOUND, e_pol == ERR_POLICY_NOT_FOUND"
            - "all nine responses use http 404"

      - name: list_pagination_defaults_and_filtering
        claim_type: listing
        grounds: [response_envelope, entities.InternalEquitySnapshot]
        distinguishing_aspect: "With 12 snapshots, the default page returns 10 items with total_count 12 and has_more true; offset=10 returns the remaining 2 with has_more false; a role_level filter narrows the set; limit 0 and limit 101 are rejected."
        test_recipe:
          setup: ["twelve L3/T3 snapshots (base 10000000 + i*100000)"]
          setup_api_calls:
            - call: "POST /api/equity-snapshots"
              payload: { role_level: L3, geo_tier: T3, base_cents: 10000000 }
              as: CompAnalyst
              as_user_id: ca-1
            - call: "POST /api/equity-snapshots"
              payload: { role_level: L3, geo_tier: T3, base_cents: 10100000 }
              as: CompAnalyst
              as_user_id: ca-1
            - call: "POST /api/equity-snapshots"
              payload: { role_level: L3, geo_tier: T3, base_cents: 10200000 }
              as: CompAnalyst
              as_user_id: ca-1
            - call: "POST /api/equity-snapshots"
              payload: { role_level: L3, geo_tier: T3, base_cents: 10300000 }
              as: CompAnalyst
              as_user_id: ca-1
            - call: "POST /api/equity-snapshots"
              payload: { role_level: L3, geo_tier: T3, base_cents: 10400000 }
              as: CompAnalyst
              as_user_id: ca-1
            - call: "POST /api/equity-snapshots"
              payload: { role_level: L3, geo_tier: T3, base_cents: 10500000 }
              as: CompAnalyst
              as_user_id: ca-1
            - call: "POST /api/equity-snapshots"
              payload: { role_level: L3, geo_tier: T3, base_cents: 10600000 }
              as: CompAnalyst
              as_user_id: ca-1
            - call: "POST /api/equity-snapshots"
              payload: { role_level: L3, geo_tier: T3, base_cents: 10700000 }
              as: CompAnalyst
              as_user_id: ca-1
            - call: "POST /api/equity-snapshots"
              payload: { role_level: L3, geo_tier: T3, base_cents: 10800000 }
              as: CompAnalyst
              as_user_id: ca-1
            - call: "POST /api/equity-snapshots"
              payload: { role_level: L3, geo_tier: T3, base_cents: 10900000 }
              as: CompAnalyst
              as_user_id: ca-1
            - call: "POST /api/equity-snapshots"
              payload: { role_level: L3, geo_tier: T3, base_cents: 11000000 }
              as: CompAnalyst
              as_user_id: ca-1
            - call: "POST /api/equity-snapshots"
              payload: { role_level: L3, geo_tier: T3, base_cents: 11100000 }
              as: CompAnalyst
              as_user_id: ca-1
          trigger:
            - call: "GET /api/equity-snapshots"
              as: CompAnalyst
              as_user_id: ca-1
            - call: "GET /api/equity-snapshots"
              payload: { offset: 10 }
              as: CompAnalyst
              as_user_id: ca-1
            - call: "GET /api/equity-snapshots"
              payload: { role_level: L3 }
              as: CompAnalyst
              as_user_id: ca-1
            - call: "GET /api/equity-snapshots"
              payload: { limit: 0 }
              as: CompAnalyst
              as_user_id: ca-1
              captures: { err_lo: $.data.error_id }
            - call: "GET /api/equity-snapshots"
              payload: { limit: 101 }
              as: CompAnalyst
              as_user_id: ca-1
              captures: { err_hi: $.data.error_id }
          assert:
            - "default page: 10 items, total_count == 12, has_more == true"
            - "offset=10 page: 2 items, total_count == 12, has_more == false"
            - "role_level=L3 filter returns only L3 rows (12 of 12 here)"
            - "limit=0 and limit=101 -> ERR_INVALID_REQUEST (envelope bounds 1..100)"

      - name: offer_event_immutable_shape
        claim_type: immutability
        grounds: [entities.OfferEvent]
        distinguishing_aspect: "OfferEvent has common_fields false: entries expose id and created_at but no version/updated_at, and the events endpoint is read-only (no mutation endpoints exist for events)."
        test_recipe:
          setup: ["one candidate and one OPEN requisition; one offer created (OFFER_CREATED event)"]
          setup_api_calls:
            - call: "POST /api/requisitions"
              payload: { title: "Sr Eng", department: "ENG", role_level: L5, geo_tier: T1, annual_budget_cents: 50000000, salary_min_cents: 15000000, salary_mid_cents: 18000000, salary_max_cents: 21000000, headcount_authorized: 1 }
              as: HiringManager
              as_user_id: hm-1
              captures: { req_id: $.data.id }
            - call: "POST /api/requisitions/${req_id}/submit"
              payload: {}
              as: HiringManager
              as_user_id: hm-1
            - call: "POST /api/requisitions/${req_id}/review-decision"
              payload: { decision: APPROVE }
              as: FinanceController
              as_user_id: fin-1
            - call: "POST /api/requisitions/${req_id}/review-decision"
              payload: { decision: APPROVE }
              as: CompAnalyst
              as_user_id: ca-1
            - call: "POST /api/candidates"
              payload: { full_name: "Cand EV", email: "cand.ev@x.com" }
              as: Recruiter
              as_user_id: rec-1
              captures: { cand_id: $.data.id }
            - call: "POST /api/offers"
              payload: { requisition_id: "${req_id}", candidate_id: "${cand_id}", base_cents: 18000000, bonus_target_pct: 0, equity_shares: 0, equity_fmv_cents: 0 }
              as: Recruiter
              as_user_id: rec-1
              captures: { offer_id: $.data.id }
          trigger:
            - call: "GET /api/offers/${offer_id}/events"
              as: Recruiter
              as_user_id: rec-1
              captures: { ev0: "$.data[0].event_type", evseq: "$.data[0].sequence" }
          assert:
            - "first event: event_type == OFFER_CREATED, sequence == 1, actor_user_id == 'rec-1'"
            - "event entries contain id and created_at and do NOT contain version or updated_at"
            - "no POST/PATCH/DELETE endpoint exists under /api/offers/{id}/events"

      - name: create_requisition_with_system_fields_returns_invalid_request
        claim_type: system_fields
        grounds: [entities.Requisition, "validations[priority=2]"]
        distinguishing_aspect: "Client-supplied system fields (id, status, committed_budget_cents) in a create payload are unknown fields and rejected with ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /api/requisitions"
              payload: { title: "Sys Fields", department: "ENG", role_level: L5, geo_tier: T1, annual_budget_cents: 50000000, salary_min_cents: 15000000, salary_mid_cents: 18000000, salary_max_cents: 21000000, headcount_authorized: 1, status: OPEN }
              as: HiringManager
              as_user_id: hm-1
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REQUEST (status is system-owned, not an accepted input)"

  # ==================================================== state_machines
  - section: state_machines
    instances:
      - name: offer_initial_state_draft
        claim_type: initial_state
        grounds: [state_machines.Offer]
        distinguishing_aspect: "A newly created offer is DRAFT with null expires_at, null original_submitted_base_cents, and zero negotiation rounds."
        test_recipe:
          setup: ["OPEN requisition, one candidate"]
          setup_api_calls:
            - call: "POST /api/requisitions"
              payload: { title: "Sr Eng", department: "ENG", role_level: L5, geo_tier: T1, annual_budget_cents: 50000000, salary_min_cents: 15000000, salary_mid_cents: 18000000, salary_max_cents: 21000000, headcount_authorized: 1 }
              as: HiringManager
              as_user_id: hm-1
              captures: { req_id: $.data.id }
            - call: "POST /api/requisitions/${req_id}/submit"
              payload: {}
              as: HiringManager
              as_user_id: hm-1
            - call: "POST /api/requisitions/${req_id}/review-decision"
              payload: { decision: APPROVE }
              as: FinanceController
              as_user_id: fin-1
            - call: "POST /api/requisitions/${req_id}/review-decision"
              payload: { decision: APPROVE }
              as: CompAnalyst
              as_user_id: ca-1
            - call: "POST /api/candidates"
              payload: { full_name: "Cand IS", email: "cand.is@x.com" }
              as: Recruiter
              as_user_id: rec-1
              captures: { cand_id: $.data.id }
          trigger:
            - call: "POST /api/offers"
              payload: { requisition_id: "${req_id}", candidate_id: "${cand_id}", base_cents: 18000000, bonus_target_pct: 0, equity_shares: 0, equity_fmv_cents: 0 }
              as: Recruiter
              as_user_id: rec-1
              captures: { st: $.data.status, exp: $.data.expires_at, orig: $.data.original_submitted_base_cents, rc: $.data.round_count }
          assert:
            - "status == DRAFT, expires_at == null, original_submitted_base_cents == null, round_count == 0, version == 1"

      - name: withdraw_from_extended_returns_invalid_offer_state
        claim_type: invalid_transition
        grounds: [state_machines.Offer, "errors[ERR_INVALID_OFFER_STATE]"]
        distinguishing_aspect: "Withdraw is declared only from DRAFT/RETURNED/PENDING_APPROVAL; from EXTENDED it is rejected with ERR_INVALID_OFFER_STATE and no side effects fire (offer stays EXTENDED, perks stay APPROVED)."
        test_recipe:
          setup:
            - "Offer base 18000000 pct 0 on OPEN requisition (standard peers), approved, lettered, EXTENDED"
          setup_api_calls:
            - call: "POST /api/requisitions"
              payload: { title: "Sr Eng", department: "ENG", role_level: L5, geo_tier: T1, annual_budget_cents: 50000000, salary_min_cents: 15000000, salary_mid_cents: 18000000, salary_max_cents: 21000000, headcount_authorized: 1 }
              as: HiringManager
              as_user_id: hm-1
              captures: { req_id: $.data.id }
            - call: "POST /api/requisitions/${req_id}/submit"
              payload: {}
              as: HiringManager
              as_user_id: hm-1
            - call: "POST /api/requisitions/${req_id}/review-decision"
              payload: { decision: APPROVE }
              as: FinanceController
              as_user_id: fin-1
            - call: "POST /api/requisitions/${req_id}/review-decision"
              payload: { decision: APPROVE }
              as: CompAnalyst
              as_user_id: ca-1
            - call: "POST /api/equity-snapshots"
              payload: { role_level: L5, geo_tier: T1, base_cents: 17000000 }
              as: CompAnalyst
              as_user_id: ca-1
            - call: "POST /api/equity-snapshots"
              payload: { role_level: L5, geo_tier: T1, base_cents: 18000000 }
              as: CompAnalyst
              as_user_id: ca-1
            - call: "POST /api/equity-snapshots"
              payload: { role_level: L5, geo_tier: T1, base_cents: 19000000 }
              as: CompAnalyst
              as_user_id: ca-1
            - call: "POST /api/candidates"
              payload: { full_name: "Cand WD", email: "cand.wd@x.com" }
              as: Recruiter
              as_user_id: rec-1
              captures: { cand_id: $.data.id }
            - call: "POST /api/offers"
              payload: { requisition_id: "${req_id}", candidate_id: "${cand_id}", base_cents: 18000000, bonus_target_pct: 0, equity_shares: 0, equity_fmv_cents: 0 }
              as: Recruiter
              as_user_id: rec-1
              captures: { offer_id: $.data.id }
            - call: "POST /api/offers/${offer_id}/submit"
              payload: {}
              as: Recruiter
              as_user_id: rec-1
            - call: "GET /api/offers/${offer_id}/approval-steps"
              as: Recruiter
              as_user_id: rec-1
              captures: { step0: "$.data[0].id" }
            - call: "POST /api/approval-steps/${step0}/decide"
              payload: { decision: APPROVED }
              as: HiringManager
              as_user_id: hm-1
            - call: "POST /api/offers/${offer_id}/letters"
              payload: {}
              as: Recruiter
              as_user_id: rec-1
            - call: "POST /api/offers/${offer_id}/extend"
              payload: {}
              as: Recruiter
              as_user_id: rec-1
          trigger:
            - call: "POST /api/offers/${offer_id}/withdraw"
              payload: { reason: "try late withdraw" }
              as: Recruiter
              as_user_id: rec-1
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_OFFER_STATE, http 409"
            - "Offer.status remains EXTENDED; committed_budget_cents still 23400000"

      - name: declined_terminal_lockdown
        claim_type: terminal_state_lockdown
        grounds: [state_machines.Offer, "errors[ERR_INVALID_OFFER_STATE]"]
        distinguishing_aspect: "DECLINED is terminal: both accept and a terms PATCH are rejected with ERR_INVALID_OFFER_STATE."
        test_recipe:
          setup:
            - "Offer EXTENDED then DECLINED (reason PERSONAL)"
          setup_api_calls:
            - call: "POST /api/requisitions"
              payload: { title: "Sr Eng", department: "ENG", role_level: L5, geo_tier: T1, annual_budget_cents: 50000000, salary_min_cents: 15000000, salary_mid_cents: 18000000, salary_max_cents: 21000000, headcount_authorized: 1 }
              as: HiringManager
              as_user_id: hm-1
              captures: { req_id: $.data.id }
            - call: "POST /api/requisitions/${req_id}/submit"
              payload: {}
              as: HiringManager
              as_user_id: hm-1
