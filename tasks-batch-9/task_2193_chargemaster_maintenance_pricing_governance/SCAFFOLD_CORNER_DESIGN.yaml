            - "Clock 2026-09-01T00:00:00Z; facility CCN-0001 (NEAREST_CENT); revenue code 0300; department CC-100; COST_PLUS_MARKUP rule with the default tiers; one ACTIVE payer contract AETNA/COMMERCIAL so payer_column_count is 1."
