  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: class_booking_overlapping_session_windows_rejected
        grounds:
          - validations[priority=11]
          - entities.ClassSession.fields.starts_at
          - entities.ClassSession.fields.ends_at
          - errors[ERR_BOOKING_TIME_OVERLAP]
        distinguishing_aspect: |
          Interval semantics: explicit half-open [starts_at, ends_at) intervals on TWO ClassSessions. A member
          BOOKED on session 09:00-10:00 cannot book a second session 09:30-10:30 (overlapping window) ->
          ERR_BOOKING_TIME_OVERLAP. Resource = ClassSession; interval = the session's own start/end span.
          Distinct interval geometry and resource from the PT fixed-60min-buffer instance.
        test_recipe:
          setup:
            - "Member ACTIVE, credits 8. Two sessions: 09:00-10:00 and 09:30-10:30 same day. Member already BOOKED on the first."
          setup_api_calls:
            - call: "POST /membership-plans"
              payload: { tier: "PLUS", monthly_dues_cents: 6000, included_class_credits: 8, pt_discount_pct: 0.25, contract_term_months: 12, early_termination_fee_cents: 15000, max_freeze_days_per_term: 30, guest_passes_per_cycle: 2 }
              as: StaffManager
              captures: { plan_id: $.data.id }
            - call: "POST /locations"
              payload: { name: "Downtown", occupancy_cap: 50 }
              as: StaffManager
              captures: { loc_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-10T00:00:00Z" }
              as: StaffManager
            - call: "POST /members"
              payload: { plan_id: "${plan_id}", home_location_id: "${loc_id}", full_name: "Overlap Member", email: "ov@x.com", period_start: "2026-06-10T00:00:00Z", period_end: "2026-07-01T00:00:00Z", due_date: "2026-06-10T00:00:00Z" }
              as: StaffManager
              captures: { m_ov: $.data.id }
            - call: "GET /dues-invoices"
              payload: { member_id: "${m_ov}" }
              as: StaffManager
              captures: { inv_ov: "$.data[0].id" }
            - call: "POST /dues-invoices/${inv_ov}/pay"
              payload: {}
              as: StaffManager
            - call: "POST /members/${m_ov}/activate"
              payload: {}
              as: StaffManager
            - call: "POST /class-sessions"
              payload: { location_id: "${loc_id}", title: "Spin1", starts_at: "2026-06-13T09:00:00Z", ends_at: "2026-06-13T10:00:00Z", capacity: 5, waitlist_cap: 5 }
              as: StaffManager
              captures: { s1: $.data.id, s1v: $.data.version }
            - call: "POST /class-sessions"
              payload: { location_id: "${loc_id}", title: "Spin2", starts_at: "2026-06-13T09:30:00Z", ends_at: "2026-06-13T10:30:00Z", capacity: 5, waitlist_cap: 5 }
              as: StaffManager
              captures: { s2: $.data.id, s2v: $.data.version }
            - call: "POST /bookings"
              payload: { session_id: "${s1}", member_id: "${m_ov}", expected_session_version: "${s1v}" }
              as: StaffManager
              captures: { bk1: $.data.id }
          trigger:
            - call: "POST /bookings"
              payload: { session_id: "${s2}", member_id: "${m_ov}", expected_session_version: "${s2v}" }
              as: StaffManager
              captures: { err: $.data.error_id }
          assert:
            - "trigger response http_status == 409"
            - "trigger response data.error_id == ERR_BOOKING_TIME_OVERLAP"

      - name: pt_session_fixed_60min_busy_block_rejected
        grounds:
          - validations[priority=12]
          - entities.PTSession.fields.starts_at
          - errors[ERR_PT_TIME_OVERLAP]
        distinguishing_aspect: |
          DIFFERENT interval semantics: PTSessions carry only a start instant, so overlap is computed against a
          FIXED 60-minute busy block [starts_at, starts_at+60min). A second PT session starting 30 minutes after
          an existing SCHEDULED one for the same member falls inside the prior block -> ERR_PT_TIME_OVERLAP.
          Resource = PTPackage/PTSession with a synthetic buffer, distinct from the explicit-window ClassSession
          instance.
        test_recipe:
          setup:
            - "Member ACTIVE buys a 5-session package. One SCHEDULED PT session at 2026-06-25T15:00. Clock 2026-06-12."
          setup_api_calls:
            - call: "POST /membership-plans"
              payload: { tier: "ELITE", monthly_dues_cents: 9000, included_class_credits: 12, pt_discount_pct: 0.4, contract_term_months: 12, early_termination_fee_cents: 20000, max_freeze_days_per_term: 45, guest_passes_per_cycle: 4 }
              as: StaffManager
              captures: { plan_id: $.data.id }
            - call: "POST /locations"
              payload: { name: "Downtown", occupancy_cap: 50 }
              as: StaffManager
              captures: { loc_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-12T00:00:00Z" }
              as: StaffManager
            - call: "POST /members"
              payload: { plan_id: "${plan_id}", home_location_id: "${loc_id}", full_name: "PT Overlap", email: "pto@x.com", period_start: "2026-06-12T00:00:00Z", period_end: "2026-07-01T00:00:00Z", due_date: "2026-06-12T00:00:00Z" }
              as: StaffManager
              captures: { m_pt: $.data.id }
            - call: "GET /dues-invoices"
              payload: { member_id: "${m_pt}" }
              as: StaffManager
              captures: { inv_pt: "$.data[0].id" }
            - call: "POST /dues-invoices/${inv_pt}/pay"
              payload: {}
              as: StaffManager
            - call: "POST /members/${m_pt}/activate"
              payload: {}
              as: StaffManager
            - call: "POST /pt-packages"
              payload: { member_id: "${m_pt}", sessions_purchased: 5, list_price_cents: 50000 }
              as: StaffManager
              captures: { pkg: $.data.id, pkg_v0: $.data.version }
            - call: "POST /pt-sessions"
              payload: { package_id: "${pkg}", trainer_name: "Tia", starts_at: "2026-06-25T15:00:00Z", expected_package_version: "${pkg_v0}" }
              as: StaffManager
              captures: { pts1: $.data.id }
            - call: "GET /pt-packages/${pkg}"
              payload: {}
              as: StaffManager
              captures: { pkg_v1: $.data.version }
          trigger:
            - call: "POST /pt-sessions"
              payload: { package_id: "${pkg}", trainer_name: "Tia", starts_at: "2026-06-25T15:30:00Z", expected_package_version: "${pkg_v1}" }
              as: StaffManager
              captures: { err: $.data.error_id }
          assert:
            - "trigger response http_status == 409"
            - "trigger response data.error_id == ERR_PT_TIME_OVERLAP"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: class_credit_conserved_under_book_then_cancel
        grounds:
          - state_machines.Booking.BOOKED_to_CANCELLED
          - entities.Member.fields.class_credits_remaining
          - entities.Booking.fields.credit_charged
        distinguishing_aspect: |
          Conserved quantity #1 = class credits. Invariant: member.class_credits_remaining +
          (count of the member's non-terminal bookings with credit_charged==true) == plan.included_class_credits
          (8). A book (debit 1) followed by its cancel (restore 1) leaves class_credits_remaining back at 8 with
          zero outstanding credit holds — no drift. Distinct conserved quantity from PT sessions.
        test_recipe:
          setup:
            - "Member ACTIVE, class_credits_remaining 8 after joining-invoice pay. Books one session then cancels it."
          setup_api_calls:
            - call: "POST /membership-plans"
              payload: { tier: "PLUS", monthly_dues_cents: 6000, included_class_credits: 8, pt_discount_pct: 0.25, contract_term_months: 12, early_termination_fee_cents: 15000, max_freeze_days_per_term: 30, guest_passes_per_cycle: 2 }
              as: StaffManager
              captures: { plan_id: $.data.id }
            - call: "POST /locations"
              payload: { name: "Downtown", occupancy_cap: 50 }
              as: StaffManager
              captures: { loc_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-10T00:00:00Z" }
              as: StaffManager
            - call: "POST /members"
              payload: { plan_id: "${plan_id}", home_location_id: "${loc_id}", full_name: "Credit Member", email: "cr@x.com", period_start: "2026-06-10T00:00:00Z", period_end: "2026-07-01T00:00:00Z", due_date: "2026-06-10T00:00:00Z" }
              as: StaffManager
              captures: { m_cr: $.data.id }
            - call: "GET /dues-invoices"
              payload: { member_id: "${m_cr}" }
              as: StaffManager
              captures: { inv_cr: "$.data[0].id" }
            - call: "POST /dues-invoices/${inv_cr}/pay"
              payload: {}
              as: StaffManager
            - call: "POST /members/${m_cr}/activate"
              payload: {}
              as: StaffManager
            - call: "POST /class-sessions"
              payload: { location_id: "${loc_id}", title: "Barre", starts_at: "2026-06-14T09:00:00Z", ends_at: "2026-06-14T10:00:00Z", capacity: 5, waitlist_cap: 5 }
              as: StaffManager
              captures: { sess: $.data.id, sv0: $.data.version }
            - call: "POST /bookings"
              payload: { session_id: "${sess}", member_id: "${m_cr}", expected_session_version: "${sv0}" }
              as: StaffManager
              captures: { bk: $.data.id }
          trigger:
            - call: "POST /bookings/${bk}/cancel"
              payload: {}
              as: StaffManager
          assert:
            - "Booking.${bk}.status == CANCELLED"
            - "Booking.${bk}.credit_charged == false"
            - "Member.${m_cr}.class_credits_remaining == 8"

      - name: pt_session_count_conserved_under_schedule_then_cancel
        grounds:
          - state_machines.PTSession.SCHEDULED_to_CANCELLED
          - entities.PTPackage.fields.sessions_remaining
          - entities.PTSession.fields.deducted
        distinguishing_aspect: |
          Conserved quantity #2 = PT session pool. Invariant: package.sessions_remaining +
          (count of the package's non-terminal PTSessions with deducted==true) == sessions_purchased (5). A
          schedule (deduct 1, sessions_remaining 4) then a cancel (reinstate 1, sessions_remaining 5) leaves the
          pool exactly back at 5 with zero outstanding deductions — no drift. Distinct conserved quantity from
          class credits.
        test_recipe:
          setup:
            - "Member ACTIVE buys 5-session package (sessions_remaining 5). Schedules one PT session then cancels it outside the 24h cutoff."
          setup_api_calls:
            - call: "POST /membership-plans"
              payload: { tier: "ELITE", monthly_dues_cents: 9000, included_class_credits: 12, pt_discount_pct: 0.4, contract_term_months: 12, early_termination_fee_cents: 20000, max_freeze_days_per_term: 45, guest_passes_per_cycle: 4 }
              as: StaffManager
              captures: { plan_id: $.data.id }
            - call: "POST /locations"
              payload: { name: "Downtown", occupancy_cap: 50 }
              as: StaffManager
              captures: { loc_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-12T00:00:00Z" }
              as: StaffManager
            - call: "POST /members"
              payload: { plan_id: "${plan_id}", home_location_id: "${loc_id}", full_name: "PT Conserve", email: "ptc@x.com", period_start: "2026-06-12T00:00:00Z", period_end: "2026-07-01T00:00:00Z", due_date: "2026-06-12T00:00:00Z" }
              as: StaffManager
              captures: { m_pt: $.data.id }
            - call: "GET /dues-invoices"
              payload: { member_id: "${m_pt}" }
              as: StaffManager
              captures: { inv_pt: "$.data[0].id" }
            - call: "POST /dues-invoices/${inv_pt}/pay"
              payload: {}
              as: StaffManager
            - call: "POST /members/${m_pt}/activate"
              payload: {}
              as: StaffManager
            - call: "POST /pt-packages"
              payload: { member_id: "${m_pt}", sessions_purchased: 5, list_price_cents: 50000 }
              as: StaffManager
              captures: { pkg: $.data.id, pkg_v0: $.data.version }
            - call: "POST /pt-sessions"
              payload: { package_id: "${pkg}", trainer_name: "Rob", starts_at: "2026-06-25T15:00:00Z", expected_package_version: "${pkg_v0}" }
              as: StaffManager
              captures: { pts: $.data.id }
            - call: "GET /pt-packages/${pkg}"
              payload: {}
              as: StaffManager
              captures: { pkg_v1: $.data.version }
          trigger:
            - call: "POST /pt-sessions/${pts}/cancel"
              payload: { expected_package_version: "${pkg_v1}" }
              as: StaffManager
          assert:
            - "PTSession.${pts}.status == CANCELLED"
            - "PTSession.${pts}.deducted == false"
            - "PTPackage.${pkg}.sessions_remaining == 5"
