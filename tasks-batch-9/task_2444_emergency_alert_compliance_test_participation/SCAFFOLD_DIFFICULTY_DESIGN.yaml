              captures: { base_202: "$.data.id" }
            - call: "POST /alert-events"
              as: StationEngineer
              as_user_id: eng-1
              payload: { station_id: "${station_id}", event_code: "TOR", originator_sequence: "KSREP-0203", fips_codes: ["20173"], received_at: "2026-08-12T12:00:00Z" }
              captures: { base_203: "$.data.id" }
            - call: "POST /alert-events"
              as: StationEngineer
              as_user_id: eng-1
              payload: { station_id: "${station_id}", event_code: "TOR", originator_sequence: "KSREP-0204", fips_codes: ["20173"], received_at: "2026-08-12T12:00:00Z" }
              captures: { base_204: "$.data.id" }
            - call: "POST /alert-events"
              as: StationEngineer
              as_user_id: eng-1
              payload: { station_id: "${station_id}", event_code: "TOR", originator_sequence: "KSREP-0205", fips_codes: ["20173"], received_at: "2026-08-12T12:00:00Z" }
              captures: { chain_a: "$.data.id" }
            - call: "POST /alert-events"
              as: StationEngineer
              as_user_id: eng-1
              payload: { station_id: "${station_id}", event_code: "TOR", originator_sequence: "KSREP-0205", fips_codes: ["20173"], received_at: "2026-08-12T12:05:00Z" }
              captures: { chain_b: "$.data.id" }
            - call: "POST /alert-events"
              as: StationEngineer
              as_user_id: eng-1
              payload: { station_id: "${station_id}", event_code: "TOR", originator_sequence: "KSREP-0205", fips_codes: ["20173"], received_at: "2026-08-12T12:09:00Z" }
              captures: { chain_c: "$.data.id" }
