          description: Rehearsal salaries
          amount_cents: 15000000
          expected_production_version: ${pv1}
        as: GeneralManager
        as_user_id: u-gm-1
        captures:
          e1: $.data.error_id
      - call: GET /productions/${pr}
        as: Comptroller
        as_user_id: u-ct-1
        captures:
          pv2: $.data.version
      - call: POST /budget-lines
        payload:
          production_id: ${pr}
