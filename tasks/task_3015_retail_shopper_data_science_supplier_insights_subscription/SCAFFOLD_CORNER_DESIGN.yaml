              captures: { rep: $.data.id }
            - call: "POST /shopper-insights/line-review-cycles"
              payload: { category_code: "SNACKS", window_start: "2026-09-20", window_end: "2026-09-25" }
              as: CategoryManager
              captures: { cyc: $.data.id }
            - call: "POST /shopper-insights/line-review-cycles/${cyc}/deliverables"
              payload: { contract_id: "${contract}", insight_report_id: "${rep}", due_at: "2026-09-15T00:00:00Z" }
              as: CategoryManager
              captures: { dlv: $.data.id }
          trigger:
            - call: "POST /shopper-insights/review-deliverables/${dlv}/accept"
              as: CategoryManager
              captures: { err_id: $.data.error_id }
          assert:
            - "error_id == ERR_DELIVERABLE_NOT_REVIEWABLE (409)"

      - name: generate_cancelled_report_rejected
        claim_type: violation_to_error
        grounds: ["errors[ERR_REPORT_NOT_GENERATABLE]", state_machines.InsightReport]
        distinguishing_aspect: "Terminal lockdown: generating a CANCELLED report fails ERR_REPORT_NOT_GENERATABLE (409); cancelled credits are not re-reserved."
        test_recipe:
          setup:
            - "Account with ACTIVE contract, scope SNACKS, one CANCELLED report"
          setup_api_calls:
            - call: "POST /shopper-insights/supplier-accounts"
              payload: { account_name: "Term Co", region: "NW" }
              as: RetailerAdmin
              captures: { acct: $.data.id }
            - call: "POST /shopper-insights/supplier-accounts/${acct}/subscription-contracts"
              payload: { tier: "TIER_CATEGORY", report_credit_allowance: 10, activation_budget_cents: 100000, redistribution_allowed: true, modeled_derivation_allowed: true }
              as: RetailerAdmin
              captures: { contract: $.data.id }
            - call: "POST /shopper-insights/subscription-contracts/${contract}/category-scopes"
              payload: { category_code: "SNACKS", brand_codes: ["ACME"] }
              as: RetailerAdmin
            - call: "POST /shopper-insights/insight-reports"
              payload: { contract_id: "${contract}", report_type: "CATEGORY", category_code: "SNACKS", period_start: "2026-08-01", period_end: "2026-08-31" }
              as: SupplierAnalyst
              as_user_id: "${acct}"
              captures: { rep: $.data.id }
            - call: "POST /shopper-insights/insight-reports/${rep}/cancel"
              as: SupplierAnalyst
              as_user_id: "${acct}"
          trigger:
            - call: "POST /shopper-insights/insight-reports/${rep}/generate"
              as: SupplierAnalyst
              as_user_id: "${acct}"
              captures: { err_id: $.data.error_id }
          assert:
            - "error_id == ERR_REPORT_NOT_GENERATABLE (409)"
            - "report remains CANCELLED; contract report_credits_reserved == 0"

      - name: grant_not_queryable_covered_by_difficulty
        claim_type: violation_to_error
        grounds: ["errors[ERR_GRANT_NOT_QUERYABLE]"]
        excluded_because:
          difficulty_instance: "cross_entity_state_dependency / query_requires_grant_approved"
          rationale: "Asserted as the failure path of the named §1.8 instance (query on REQUESTED grant)."

      - name: min_cell_boundary_covered_by_difficulty
        claim_type: violation_to_error
        grounds: [calculations.min_cell_suppression]
        excluded_because:
          difficulty_instance: "boundary_precision_check / cell_size_exactly_at_minimum_passes"
          rationale: "The 19-vs-20 suppression boundary is asserted by the named §1.8 instance."

