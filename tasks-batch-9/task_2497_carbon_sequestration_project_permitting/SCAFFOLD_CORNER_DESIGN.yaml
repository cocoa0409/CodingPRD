    instances:
      - name: pore_space_tract_create_read_and_filtered_list_round_trip
        claim_type: standard_crud
        grounds:
          - endpoints[POST /ccs/pore-space-tracts]
          - endpoints[GET /ccs/pore-space-tracts/{id}]
          - endpoints[GET /ccs/storage-projects/{id}/pore-space-tracts]
        distinguishing_aspect: |
          The write is readable through both read shapes with identical values: the single-row GET returns
          tract_label T1 with acreage 1000 and lease_status UNLEASED, and the project-scoped listing
          filtered on lease_status UNLEASED reports both tracts with total_count 2 and has_more false.
        test_recipe:
          setup:
            - "logical clock at the 2026-08-01T00:00:00Z default"
            - "project 'Alpha Storage Hub' in DRAFT with total_project_acreage 4000"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /ccs/storage-projects"
              payload: { name: "Alpha Storage Hub", operator_name: "Alpha CCS LLC", basin_code: "ILB-01", total_project_acreage: 4000, requested_annual_injection_rate_tpy: 1000000, annual_monitoring_cost_usd: 200000, required_consent_pct: 60, ca_rig_slots: 2 }
              as: ProgramAdmin
              captures: { proj_id: $.data.id }
            - call: "POST /ccs/pore-space-tracts"
              payload: { project_id: "${proj_id}", tract_label: "T1", acreage: 1000, landowner_user_id: "landowner-1", ownership_pct: 100 }
              as: ProjectDeveloper
              as_user_id: "developer-1"
              captures: { t1_id: $.data.id }
            - call: "POST /ccs/pore-space-tracts"
              payload: { project_id: "${proj_id}", tract_label: "T2", acreage: 500, landowner_user_id: "landowner-2", ownership_pct: 100 }
              as: ProjectDeveloper
              as_user_id: "developer-1"
              captures: { t2_id: $.data.id }
          trigger:
            - call: "GET /ccs/pore-space-tracts/${t1_id}"
              payload: {}
              as: ProjectDeveloper
              as_user_id: "developer-1"
              captures: { label: $.data.tract_label, acres: $.data.acreage, lease: $.data.lease_status }
            - call: "GET /ccs/storage-projects/${proj_id}/pore-space-tracts"
              payload: { lease_status: "UNLEASED", limit: 10, offset: 0 }
              as: ProjectDeveloper
              as_user_id: "developer-1"
          assert:
            - "the first trigger call returns HTTP 200"
            - "${label} == T1"
            - "${acres} == 1000"
            - "${lease} == UNLEASED"
            - "the second trigger call returns HTTP 200 with total_count 2 and has_more false"
            - "the second trigger call lists both ${t1_id} and ${t2_id} in created_at ASC order"
            - "PoreSpaceTract.${t2_id}.negotiation_round_count == 0"

      - name: file_unitization_petition_snapshots_consent_pct
        claim_type: action_endpoint
        grounds:
          - endpoints[POST /ccs/storage-projects/{id}/unitization-petition]
          - entities.StorageProject.fields.unitization_consent_pct_at_filing
          - entities.StorageProject.fields.unitization_status
        distinguishing_aspect: |
          The action takes no domain input beyond an optional note yet changes three fields at once: it
          freezes unitization_consent_pct_at_filing at the current 25.00, moves unitization_status from
          NOT_FILED to FILED and bumps the project version, while leaving the live
          pore_space_consent_pct free to move afterwards. It is also reachable only from
          SITE_CHARACTERIZATION or PERMITTING, so the recipe walks the project into
          SITE_CHARACTERIZATION with a submitted model before filing.
        test_recipe:
          setup:
            - "logical clock at the 2026-08-01T00:00:00Z default"
            - "project 'Alpha Storage Hub' with total_project_acreage 4000 and required_consent_pct 60, moved to SITE_CHARACTERIZATION by a submitted model"
            - "tract T1 of 1000 acres EXECUTED, so pore_space_consent_pct is 25.00 and unitization_status is NOT_FILED"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /ccs/storage-projects"
              payload: { name: "Alpha Storage Hub", operator_name: "Alpha CCS LLC", basin_code: "ILB-01", total_project_acreage: 4000, requested_annual_injection_rate_tpy: 1000000, annual_monitoring_cost_usd: 200000, required_consent_pct: 60, ca_rig_slots: 2 }
              as: ProgramAdmin
              captures: { proj_id: $.data.id }
            - call: "POST /ccs/pore-space-tracts"
              payload: { project_id: "${proj_id}", tract_label: "T1", acreage: 1000, landowner_user_id: "landowner-1", ownership_pct: 100 }
              as: ProjectDeveloper
              as_user_id: "developer-1"
              captures: { t1_id: $.data.id, t1_v0: $.data.version }
            - call: "POST /ccs/pore-space-tracts/${t1_id}/offers"
              payload: { expected_tract_version: "${t1_v0}", bonus_per_acre_usd: 15.00, royalty_rate_pct: 12.5 }
              as: ProjectDeveloper
              as_user_id: "developer-1"
            - call: "POST /ccs/pore-space-tracts/${t1_id}/respond"
              payload: { response: "ACCEPT", lease_term_start: "2026-09-01T00:00:00Z", lease_term_end: "2046-09-01T00:00:00Z" }
              as: Landowner
              as_user_id: "landowner-1"
            - call: "GET /ccs/storage-projects/${proj_id}"
              payload: {}
              as: ProgramAdmin
              captures: { consent_before: $.data.pore_space_consent_pct, unit_before: $.data.unitization_status, ver_before: $.data.version }
            - call: "POST /ccs/geologic-models"
              payload: { project_id: "${proj_id}", expected_project_version: "${ver_before}", model_label: "M1-DET", injection_zone_top_depth_m: 1800, injection_zone_thickness_m: 50, seal_thickness_m: 60, capillary_entry_pressure_psi: 900, p10_seal_thickness_m: 30, p10_capillary_entry_pressure_psi: 700, reservoir_pressure_psi: 3000, fracture_pressure_psi: 4500, permeability_md: 200, porosity_fraction: 0.20, assessment_variant: "DETERMINISTIC" }
              as: ProjectDeveloper
              as_user_id: "developer-1"
              captures: { model_id: $.data.id }
            - call: "POST /ccs/geologic-models/${model_id}/run-plume-simulation"
              payload: { injection_years: 20 }
              as: ProjectDeveloper
              as_user_id: "developer-1"
            - call: "POST /ccs/geologic-models/${model_id}/submit"
              payload: { submission_note: "initial site characterization" }
              as: ProjectDeveloper
              as_user_id: "developer-1"
            - call: "GET /ccs/storage-projects/${proj_id}"
              payload: {}
              as: ProgramAdmin
              captures: { status_before_petition: $.data.status }
          trigger:
            - call: "POST /ccs/storage-projects/${proj_id}/unitization-petition"
              payload: { petition_note: "statutory unitization sought for the outstanding 3000 acres" }
              as: ProjectDeveloper
              as_user_id: "developer-1"
              captures: { unit_after: $.data.unitization_status, snapshot: $.data.unitization_consent_pct_at_filing }
          assert:
            - "${consent_before} == 25.00"
            - "${unit_before} == NOT_FILED"
            - "${status_before_petition} == SITE_CHARACTERIZATION"
            - "the trigger call returns HTTP 200"
            - "${unit_after} == FILED"
            - "${snapshot} == 25.00"
            - "StorageProject.${proj_id}.pore_space_consent_pct == 25.00"
            - "StorageProject.${proj_id}.statutory_bonus_per_acre_usd == null"
            - "StorageProject.${proj_id}.outstanding_acreage == 3000.0000"

      - name: finalize_aor_rescreens_every_wellbore_in_one_call
        claim_type: bulk_action
        grounds:
          - endpoints[POST /ccs/geologic-models/{id}/finalize-aor]
        distinguishing_aspect: |
          One action rewriting the screening state and cost of every sibling wellbore of the project is
          the multi-row write asserted by the §1.8 cascade instance.
        excluded_because:
          difficulty_instance: "transitive_cascade / finalize_aor_rescreen_cascade_depth_four"
          rationale: "That §1.8 instance asserts the per-wellbore screening results, the completion percentage and the requirement recompute produced by the single finalize-aor call."

      - name: list_geologic_models_filtered_by_supersedes_model_id
        claim_type: cross_reference_link
        grounds:
          - endpoints[GET /ccs/geologic-models]
          - entities.GeologicModel.fields.supersedes_model_id
        distinguishing_aspect: |
          The self-referential link is queryable in its own right: filtering on
          supersedes_model_id == M1 returns only the successor M2 and never M1 itself, while filtering
          the same project on status ACCEPTED still returns exactly one row because M2 is only DRAFT.
        test_recipe:
          setup:
            - "logical clock at the 2026-08-01T00:00:00Z default"
            - "project 'Alpha Storage Hub' with an ACCEPTED model M1-DET"
            - "a DRAFT model M2-DET created with supersedes_model_id pointing at M1-DET"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /ccs/storage-projects"
              payload: { name: "Alpha Storage Hub", operator_name: "Alpha CCS LLC", basin_code: "ILB-01", total_project_acreage: 4000, requested_annual_injection_rate_tpy: 1000000, annual_monitoring_cost_usd: 200000, required_consent_pct: 60, ca_rig_slots: 2 }
              as: ProgramAdmin
              captures: { proj_id: $.data.id, proj_v0: $.data.version }
            - call: "POST /ccs/geologic-models"
              payload: { project_id: "${proj_id}", expected_project_version: "${proj_v0}", model_label: "M1-DET", injection_zone_top_depth_m: 1800, injection_zone_thickness_m: 50, seal_thickness_m: 60, capillary_entry_pressure_psi: 900, p10_seal_thickness_m: 30, p10_capillary_entry_pressure_psi: 700, reservoir_pressure_psi: 3000, fracture_pressure_psi: 4500, permeability_md: 200, porosity_fraction: 0.20, assessment_variant: "DETERMINISTIC" }
              as: ProjectDeveloper
              as_user_id: "developer-1"
              captures: { m1_id: $.data.id }
            - call: "POST /ccs/geologic-models/${m1_id}/run-plume-simulation"
              payload: { injection_years: 20 }
              as: ProjectDeveloper
              as_user_id: "developer-1"
            - call: "POST /ccs/geologic-models/${m1_id}/submit"
              payload: { submission_note: "initial site characterization" }
              as: ProjectDeveloper
              as_user_id: "developer-1"
            - call: "POST /ccs/geologic-models/${m1_id}/review"
              payload: { decision: "ACCEPT", review_note: "seal integrity acceptable" }
              as: RegulatoryReviewer
              as_user_id: "reviewer-1"
            - call: "GET /ccs/storage-projects/${proj_id}"
              payload: {}
              as: ProgramAdmin
              captures: { proj_v_now: $.data.version, governing: $.data.governing_geologic_model_id }
            - call: "POST /ccs/geologic-models"
              payload: { project_id: "${proj_id}", expected_project_version: "${proj_v_now}", model_label: "M2-DET", injection_zone_top_depth_m: 1800, injection_zone_thickness_m: 55, seal_thickness_m: 60, capillary_entry_pressure_psi: 900, p10_seal_thickness_m: 30, p10_capillary_entry_pressure_psi: 700, reservoir_pressure_psi: 3000, fracture_pressure_psi: 4500, permeability_md: 200, porosity_fraction: 0.20, assessment_variant: "DETERMINISTIC", supersedes_model_id: "${m1_id}" }
              as: ProjectDeveloper
              as_user_id: "developer-1"
              captures: { m2_id: $.data.id }
          trigger:
            - call: "GET /ccs/geologic-models"
              payload: { supersedes_model_id: "${m1_id}", limit: 10, offset: 0 }
              as: ProjectDeveloper
              as_user_id: "developer-1"
            - call: "GET /ccs/geologic-models"
              payload: { project_id: "${proj_id}", status: "ACCEPTED", limit: 10, offset: 0 }
              as: ProjectDeveloper
              as_user_id: "developer-1"
          assert:
            - "${governing} == ${m1_id}"
            - "the first trigger call returns HTTP 200 with total_count 1 and lists only ${m2_id}"
            - "the second trigger call returns HTTP 200 with total_count 1 and lists only ${m1_id}"
            - "GeologicModel.${m2_id}.supersedes_model_id == ${m1_id}"
            - "GeologicModel.${m2_id}.status == DRAFT"
            - "GeologicModel.${m1_id}.status == ACCEPTED"

      - name: monitoring_plan_read_exposes_computed_domain_subscores
        claim_type: computed_read
        grounds:
          - endpoints[GET /ccs/monitoring-plans/{id}]
          - calculations.mrv_coverage_score
        distinguishing_aspect: |
          The read returns four values none of which were ever written by a client: with one subsurface
          method at 100 percent / 500 tpy / 2 per year, one surface method at 50 percent / 100 tpy / 4 per
          year and one atmospheric method at 25 percent / 25 tpy / 12 per year, the read reports
          subsurface 1.0000 after the min clamp, surface 0.5000, atmospheric 0.2500 and
          coverage_score 70.00 while the plan is still DRAFT.
        test_recipe:
          setup:
            - "logical clock at the 2026-08-01T00:00:00Z default"
            - "project 'Alpha Storage Hub' in DRAFT"
            - "one DRAFT MonitoringPlan with three ACTIVE methods, one per domain"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /ccs/storage-projects"
              payload: { name: "Alpha Storage Hub", operator_name: "Alpha CCS LLC", basin_code: "ILB-01", total_project_acreage: 4000, requested_annual_injection_rate_tpy: 1000000, annual_monitoring_cost_usd: 200000, required_consent_pct: 60, ca_rig_slots: 2 }
              as: ProgramAdmin
              captures: { proj_id: $.data.id }
            - call: "POST /ccs/monitoring-plans"
              payload: { project_id: "${proj_id}", plan_label: "MRV-1" }
              as: ProjectDeveloper
              as_user_id: "developer-1"
              captures: { plan_id: $.data.id }
            - call: "POST /ccs/monitoring-plans/${plan_id}/methods"
              payload: { domain: "SUBSURFACE", technique: "4D seismic and downhole pressure", detection_threshold_tpy: 500, frequency_per_year: 2, spatial_coverage_pct: 100 }
              as: ProjectDeveloper
              as_user_id: "developer-1"
              captures: { sub_id: $.data.id, sub_score: $.data.method_score }
            - call: "POST /ccs/monitoring-plans/${plan_id}/methods"
              payload: { domain: "SURFACE", technique: "soil gas flux survey", detection_threshold_tpy: 100, frequency_per_year: 4, spatial_coverage_pct: 50 }
              as: ProjectDeveloper
              as_user_id: "developer-1"
              captures: { surf_id: $.data.id }
            - call: "POST /ccs/monitoring-plans/${plan_id}/methods"
              payload: { domain: "ATMOSPHERIC", technique: "tunable diode laser tower", detection_threshold_tpy: 25, frequency_per_year: 12, spatial_coverage_pct: 25 }
              as: ProjectDeveloper
              as_user_id: "developer-1"
              captures: { atm_id: $.data.id }
          trigger:
            - call: "GET /ccs/monitoring-plans/${plan_id}"
              payload: {}
              as: ProjectDeveloper
              as_user_id: "developer-1"
              captures: { sub: $.data.subsurface_subscore, surf: $.data.surface_subscore, atm: $.data.atmospheric_subscore, cov: $.data.coverage_score, st: $.data.status }
          assert:
            - "${sub_score} == 1.0000"
            - "the trigger call returns HTTP 200"
            - "${sub} == 1.0000"
            - "${surf} == 0.5000"
            - "${atm} == 0.2500"
            - "${cov} == 70.00"
            - "${st} == DRAFT"
            - "MonitoringMethod.${sub_id}.status == ACTIVE"
            - "MonitoringMethod.${surf_id}.method_score == 0.5000"
            - "MonitoringMethod.${atm_id}.method_score == 0.2500"
            - "MonitoringPlan.${plan_id}.revision_round_count == 0"

      - name: begin_pisc_outside_injection_active_rejected
        claim_type: conditional_action
        grounds:
          - endpoints[POST /ccs/storage-projects/{id}/begin-pisc]
          - validations[priority 56 ERR_INVALID_PROJECT_STATE]
        distinguishing_aspect: |
          The action is available only from INJECTION_ACTIVE, so calling it on a DRAFT project is refused
          with 409 ERR_INVALID_PROJECT_STATE and none of its four side effects run: pisc_start_at stays
          null, pisc_duration_years keeps the default 50, alternative_timeframe_years stays null and the
          project version does not move.
        test_recipe:
          setup:
            - "logical clock at the 2026-08-01T00:00:00Z default"
            - "project 'Alpha Storage Hub' freshly created in status DRAFT"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /ccs/storage-projects"
              payload: { name: "Alpha Storage Hub", operator_name: "Alpha CCS LLC", basin_code: "ILB-01", total_project_acreage: 4000, requested_annual_injection_rate_tpy: 1000000, annual_monitoring_cost_usd: 200000, required_consent_pct: 60, ca_rig_slots: 2 }
              as: ProgramAdmin
              captures: { proj_id: $.data.id, ver_before: $.data.version }
          trigger:
            - call: "POST /ccs/storage-projects/${proj_id}/begin-pisc"
              payload: { alternative_timeframe_years: 20 }
              as: ProjectDeveloper
              as_user_id: "developer-1"
          assert:
            - "the trigger call returns HTTP 409 with error_id ERR_INVALID_PROJECT_STATE"
            - "StorageProject.${proj_id}.status == DRAFT"
            - "StorageProject.${proj_id}.pisc_start_at == null"
            - "StorageProject.${proj_id}.alternative_timeframe_years == null"
            - "StorageProject.${proj_id}.pisc_duration_years == 50"
            - "StorageProject.${proj_id}.pisc_elapsed_years == 0"
            - "StorageProject.${proj_id}.version == ${ver_before}"

  # ===========================================================================
  # §1.9 corner coverage, section 6 of 9
  # ===========================================================================
  - section: errors
    instances:
      - name: allocate_against_zero_requirement_snapshot_rejected
        claim_type: error_code_triggerable
        grounds:
          - errors[ERR_ALLOCATION_EXCEEDS_FACE_AMOUNT]
          - validations[priority 96 ERR_ALLOCATION_EXCEEDS_FACE_AMOUNT]
        distinguishing_aspect: |
          Instruments may be posted before a model is accepted, so the requirement snapshot can still be
          0: allocating then has nothing to fill and is refused with 422
          ERR_ALLOCATION_EXCEEDS_FACE_AMOUNT rather than silently parking the whole face in
          unallocated_usd, leaving the instrument POSTED with all four buckets at 0.00.
        test_recipe:
          setup:
            - "logical clock at the 2026-08-01T00:00:00Z default"
            - "project 'Alpha Storage Hub' in DRAFT with no accepted model, so required_financial_assurance_usd is 0"
            - "one POSTED FinancialInstrument of face 5000000"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /ccs/storage-projects"
              payload: { name: "Alpha Storage Hub", operator_name: "Alpha CCS LLC", basin_code: "ILB-01", total_project_acreage: 4000, requested_annual_injection_rate_tpy: 1000000, annual_monitoring_cost_usd: 200000, required_consent_pct: 60, ca_rig_slots: 2 }
              as: ProgramAdmin
              captures: { proj_id: $.data.id }
            - call: "POST /ccs/financial-instruments"
              payload: { project_id: "${proj_id}", instrument_type: "TRUST_FUND", face_amount_usd: 5000000 }
              as: ProjectDeveloper
              as_user_id: "developer-1"
              captures: { inst_id: $.data.id, inst_v0: $.data.version }
          trigger:
            - call: "POST /ccs/financial-instruments/${inst_id}/allocate"
              payload: { expected_instrument_version: "${inst_v0}" }
              as: ProjectDeveloper
              as_user_id: "developer-1"
          assert:
            - "the trigger call returns HTTP 422 with error_id ERR_ALLOCATION_EXCEEDS_FACE_AMOUNT"
            - "FinancialInstrument.${inst_id}.status == POSTED"
            - "FinancialInstrument.${inst_id}.allocated_pisc_usd == 0.00"
            - "FinancialInstrument.${inst_id}.allocated_emergency_usd == 0.00"
            - "FinancialInstrument.${inst_id}.unallocated_usd == 5000000.00"
            - "StorageProject.${proj_id}.allocated_assurance_usd == 0"
            - "StorageProject.${proj_id}.assurance_coverage_status == UNFUNDED"

      - name: reallocate_with_superseded_instrument_version_rejected
        claim_type: error_code_triggerable
        grounds:
          - errors[ERR_STALE_INSTRUMENT_VERSION]
          - validations[priority 68 ERR_STALE_INSTRUMENT_VERSION]
        distinguishing_aspect: |
          The instrument is back in POSTED after a deallocate, so the priority-64 state guard passes and
          the request reaches the version guard: expected_instrument_version 1 no longer matches the
          stored version 3 and the response is 412 ERR_STALE_INSTRUMENT_VERSION with the buckets left at
          their post-deallocate zeros.
        test_recipe:
          setup:
            - "logical clock at the 2026-08-01T00:00:00Z default"
            - "project 'Alpha Storage Hub' with an ACCEPTED model and required_financial_assurance_usd 12500000.00"
            - "one FinancialInstrument of face 11000000 that has been allocated and then deallocated, so its version is 3 and its status is POSTED"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /ccs/storage-projects"
              payload: { name: "Alpha Storage Hub", operator_name: "Alpha CCS LLC", basin_code: "ILB-01", total_project_acreage: 4000, requested_annual_injection_rate_tpy: 1000000, annual_monitoring_cost_usd: 200000, required_consent_pct: 60, ca_rig_slots: 2 }
              as: ProgramAdmin
              captures: { proj_id: $.data.id, proj_v0: $.data.version }
            - call: "POST /ccs/geologic-models"
              payload: { project_id: "${proj_id}", expected_project_version: "${proj_v0}", model_label: "M1-DET", injection_zone_top_depth_m: 1800, injection_zone_thickness_m: 50, seal_thickness_m: 60, capillary_entry_pressure_psi: 900, p10_seal_thickness_m: 30, p10_capillary_entry_pressure_psi: 700, reservoir_pressure_psi: 3000, fracture_pressure_psi: 4500, permeability_md: 200, porosity_fraction: 0.20, assessment_variant: "DETERMINISTIC" }
              as: ProjectDeveloper
              as_user_id: "developer-1"
              captures: { model_id: $.data.id }
            - call: "POST /ccs/geologic-models/${model_id}/run-plume-simulation"
              payload: { injection_years: 20 }
              as: ProjectDeveloper
              as_user_id: "developer-1"
            - call: "POST /ccs/geologic-models/${model_id}/submit"
              payload: { submission_note: "initial site characterization" }
              as: ProjectDeveloper
              as_user_id: "developer-1"
            - call: "POST /ccs/geologic-models/${model_id}/review"
              payload: { decision: "ACCEPT", review_note: "seal integrity acceptable" }
              as: RegulatoryReviewer
              as_user_id: "reviewer-1"
            - call: "POST /ccs/financial-instruments"
              payload: { project_id: "${proj_id}", instrument_type: "SURETY_BOND", face_amount_usd: 11000000 }
              as: ProjectDeveloper
              as_user_id: "developer-1"
              captures: { inst_id: $.data.id, inst_v0: $.data.version }
            - call: "POST /ccs/financial-instruments/${inst_id}/allocate"
              payload: { expected_instrument_version: "${inst_v0}" }
              as: ProjectDeveloper
              as_user_id: "developer-1"
            - call: "POST /ccs/financial-instruments/${inst_id}/deallocate"
              payload: { deallocation_reason: "instrument replaced by a larger trust fund" }
              as: ProjectDeveloper
              as_user_id: "developer-1"
              captures: { st_after_dealloc: $.data.status, ver_after_dealloc: $.data.version }
          trigger:
            - call: "POST /ccs/financial-instruments/${inst_id}/allocate"
              payload: { expected_instrument_version: "${inst_v0}" }
              as: ProjectDeveloper
              as_user_id: "developer-1"
          assert:
            - "${st_after_dealloc} == POSTED"
            - "${ver_after_dealloc} == 3"
            - "the trigger call returns HTTP 412 with error_id ERR_STALE_INSTRUMENT_VERSION"
            - "FinancialInstrument.${inst_id}.status == POSTED"
            - "FinancialInstrument.${inst_id}.version == 3"
            - "FinancialInstrument.${inst_id}.allocated_pisc_usd == 0.00"
            - "FinancialInstrument.${inst_id}.unallocated_usd == 11000000.00"
            - "StorageProject.${proj_id}.allocated_assurance_usd == 0.00"

      - name: offer_with_superseded_tract_version_rejected
        claim_type: error_code_triggerable
        grounds:
          - errors[ERR_STALE_TRACT_VERSION]
          - validations[priority 67 ERR_STALE_TRACT_VERSION]
        distinguishing_aspect: |
          COUNTERED is a legal state for a further offer, so the priority-59 state guard passes and the
          stale expected_tract_version 1 against the stored version 3 is what fails, giving 412
          ERR_STALE_TRACT_VERSION and leaving negotiation_round_count at 1.
        test_recipe:
          setup:
            - "logical clock at the 2026-08-01T00:00:00Z default"
            - "project 'Alpha Storage Hub' in DRAFT"
            - "tract T1 in lease_status COUNTERED after one offer and one counter, so its version is 3"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /ccs/storage-projects"
              payload: { name: "Alpha Storage Hub", operator_name: "Alpha CCS LLC", basin_code: "ILB-01", total_project_acreage: 4000, requested_annual_injection_rate_tpy: 1000000, annual_monitoring_cost_usd: 200000, required_consent_pct: 60, ca_rig_slots: 2 }
              as: ProgramAdmin
              captures: { proj_id: $.data.id }
            - call: "POST /ccs/pore-space-tracts"
              payload: { project_id: "${proj_id}", tract_label: "T1", acreage: 1000, landowner_user_id: "landowner-1", ownership_pct: 100 }
              as: ProjectDeveloper
              as_user_id: "developer-1"
              captures: { t1_id: $.data.id, t1_v0: $.data.version }
            - call: "POST /ccs/pore-space-tracts/${t1_id}/offers"
              payload: { expected_tract_version: "${t1_v0}", bonus_per_acre_usd: 15.00, royalty_rate_pct: 12.5 }
              as: ProjectDeveloper
              as_user_id: "developer-1"
            - call: "POST /ccs/pore-space-tracts/${t1_id}/respond"
              payload: { response: "COUNTER", counter_bonus_per_acre_usd: 30.00 }
              as: Landowner
              as_user_id: "landowner-1"
              captures: { lease_after_counter: $.data.lease_status, ver_after_counter: $.data.version, rounds: $.data.negotiation_round_count }
          trigger:
            - call: "POST /ccs/pore-space-tracts/${t1_id}/offers"
              payload: { expected_tract_version: "${t1_v0}", bonus_per_acre_usd: 22.00, royalty_rate_pct: 12.5 }
              as: ProjectDeveloper
              as_user_id: "developer-1"
          assert:
            - "${lease_after_counter} == COUNTERED"
            - "${ver_after_counter} == 3"
            - "${rounds} == 1"
            - "the trigger call returns HTTP 412 with error_id ERR_STALE_TRACT_VERSION"
            - "PoreSpaceTract.${t1_id}.lease_status == COUNTERED"
            - "PoreSpaceTract.${t1_id}.negotiation_round_count == 1"
            - "PoreSpaceTract.${t1_id}.current_offer_bonus_per_acre_usd == 15.00"
            - "PoreSpaceTract.${t1_id}.counter_bonus_per_acre_usd == 30.00"
            - "PoreSpaceTract.${t1_id}.version == 3"

      - name: second_geologic_model_with_superseded_project_version_rejected
        claim_type: error_code_triggerable
        grounds:
          - errors[ERR_STALE_PROJECT_VERSION]
          - validations[priority 66 ERR_STALE_PROJECT_VERSION]
          - endpoints[POST /ccs/geologic-models]
        distinguishing_aspect: |
          Creating a model is itself a write against the project, so the version captured before the
          first create is already superseded when it is replayed: the second create is refused with 412
          ERR_STALE_PROJECT_VERSION and no second model row appears in the project's model listing.
        test_recipe:
          setup:
            - "logical clock at the 2026-08-01T00:00:00Z default"
            - "project 'Alpha Storage Hub' freshly created at version 1"
            - "one DRAFT GeologicModel M1-DET created with expected_project_version 1, which advanced the project to version 2"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
