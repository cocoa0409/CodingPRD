            - call: "POST /spring-designs/${d2_id}/critical-characteristics"
              payload: { char_code: "HOOK_POSITION", nominal_value: 24.0, lsl: 23.7, usl: 24.3, is_safety_critical: false, cpk_floor: 1.0 }
              as: DesignEngineer
              captures: { cc_id: $.data.id }
            - call: "POST /spring-designs/${d2_id}/submit-for-review"
              payload: {}
              as: DesignEngineer
              as_user_id: "de-01"
            - call: "POST /spring-designs/${d2_id}/review"
              payload: { decision: "APPROVE_PROTOTYPE" }
              as: EngineeringManager
              as_user_id: "em-01"
            - call: "POST /tooling-assets"
              payload: { design_id: "${d2_id}", tool_code: "TL-D2", original_cost_cents: 900000 }
              as: EngineeringManager
              as_user_id: "em-01"
              captures: { tool_id: $.data.id }
            - call: "POST /coiling-machines"
              payload: { machine_code: "COIL-6", max_wire_diameter_mm: 4.0, changeover_buffer_minutes: 45 }
              as: PlantAdmin
              captures: { mach_id: $.data.id, mach_v: $.data.version }
            - call: "POST /machine-setups"
              payload: { machine_id: "${mach_id}", design_id: "${d2_id}", tooling_asset_id: "${tool_id}", window_start: "2026-08-05T04:00:00Z", window_end: "2026-08-05T06:00:00Z", expected_machine_version: "${mach_v}" }
              as: ProcessTechnician
              captures: { setup_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T04:30:00Z" }
              as: PlantAdmin
            - call: "POST /machine-setups/${setup_id}/activate"
              payload: {}
              as: ProcessTechnician
            - call: "POST /wire-lots"
              payload: { material_spec_id: "${ms_id}", heat_number: "HT-050", received_kg: 50.0 }
              as: QualityInspector
              captures: { wl_id: $.data.id }
            - call: "POST /wire-lots/${wl_id}/certify"
              payload: { tensile_test_mpa: 1680 }
              as: QualityInspector
              as_user_id: "qi-01"
            - call: "POST /production-runs"
              payload: { setup_id: "${setup_id}", wire_lot_id: "${wl_id}", design_id: "${d2_id}", planned_pieces: 1000 }
              as: ProcessTechnician
