            - "One BlockingEvent with reason ANALYTICS_SCORE and analytics_score 0.96, recorded by fraud-1, which auto-suspended the customer (cause BLOCKING_ANALYTICS) and suspended both assignments"
            - "The caller filed a dispute and fraud-2 took it UNDER_REVIEW"
            - "Before the trigger: active_assigned_number_count == 0, blocking_false_positive_rate == 0.0000, false_positive_count == 0"
