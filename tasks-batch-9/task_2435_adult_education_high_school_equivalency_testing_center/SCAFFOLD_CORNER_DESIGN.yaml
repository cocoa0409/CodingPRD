              as: StateAuthority
              captures: { e1: $.data.error_id }
          assert:
            - "POST /funding-periods returns 400 with data.error_id == 'ERR_INVALID_REQUEST'"
            - "GET /funding-periods still returns total_count == 0"

      - name: test_event_scale_score_above_range_rejected
        claim_type: type_constraints
        grounds:
          - entities.TestEvent.fields.scale_score
          - validations[priority=5]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: |
          TestEvent.scale_score is bounded 0..999 (a different range from ExamRegistration's
          100..200); 1000 is ERR_INVALID_REQUEST and the event stays SCHEDULED with efl_level null.
        test_recipe:
          setup:
            - "An oriented student with one SCHEDULED PRE_TEST; clock 2026-08-02T09:00:00Z."
          setup_api_calls:
            - call: "POST /students"
