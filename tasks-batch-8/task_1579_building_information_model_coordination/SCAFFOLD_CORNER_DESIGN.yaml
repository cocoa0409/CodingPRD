            - { call: "POST /api/projects/${pid}/advance-phase", payload: {}, as: VDCManager }
            - { call: "POST /api/fabrication-packages/${pkg}/release", payload: {}, as: FabricationLead, as_user_id: "${p2}", captures: { rel: $.data.status } }
          assert:
