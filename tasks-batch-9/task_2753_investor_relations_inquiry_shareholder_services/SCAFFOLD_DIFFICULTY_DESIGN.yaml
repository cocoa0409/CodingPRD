            - "after trigger step 2: ResponseDraft.${dr_id}.status == DRAFT (the row has returned to its initial state)"
            - "after trigger step 2: ResponseDraft.${dr_id}.revision_round == 1 and reviewer_note == null"
            - "after trigger step 2: InquiryTicket.${inq_id}.status == DRAFTING (unchanged by the revise)"

      - name: contact_parallel_model_access_and_threat_dimensions
        grounds:
          - state_machines.Contact.A_NONE_to_A_GRANTED
          - state_machines.Contact.A_GRANTED_to_A_REVOKED
          - state_machines.Contact.A_REVOKED_to_A_GRANTED
          - state_machines.Contact.B_any_to_B_threat_level
          - entities.Contact.fields.model_access_status
          - entities.Contact.fields.threat_level
        distinguishing_aspect: |
          One Contact row carries two independent state dimensions: model_access_status walks
          NONE -> GRANTED -> REVOKED -> GRANTED while threat_level is independently pushed to
          CRITICAL, and neither dimension gates the other (the re-grant succeeds while
          threat_level is CRITICAL because the contact is not activist_flag, so
          Company.disclosure_posture stays OPEN) — a different entity from the ResponseDraft cycle.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "Issuer PAR with no blackout window and no activist contacts (posture OPEN)."
            - "One SELL_SIDE_ANALYST contact with nda_on_file true, activist_flag false, model_access_status NONE and threat_level NONE."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: IRAdmin
              as_user_id: "u_ir_admin_1"
            - call: "POST /companies"
