        distinguishing_aspect: "Participant is the only entity_backed role: the role name alone is not enough, the acting X-User-Id must BE the addressed Player row. The same endpoint therefore succeeds and fails for the same role depending only on which row the path names, and the ownership check runs before the path-existence check."
