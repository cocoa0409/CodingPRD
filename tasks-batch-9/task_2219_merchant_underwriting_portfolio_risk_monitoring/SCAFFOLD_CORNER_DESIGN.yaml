              captures: { m_h2: "$.data[0].id" }
            - call: "POST /_clock/set_current_utc"
              payload: { now_utc: "2026-08-05T00:00:00Z" }
              as: RiskAnalyst
            - call: "POST /merchant-day-activity"
              payload: { merchant_id: "${m_h2}", business_date: "2026-08-05", txn_count: 1000, volume_cents: 1000000, decline_count: 5, distinct_card_count: 900, cross_border_count: 0, refund_cents: 0, unique_bin_count: 400, chargeback_count: 9, chargeback_amount_cents: 9000, chargeback_network: "VISA" }
              as: RiskAnalyst
            - call: "POST /monitoring-runs"
              payload: { as_of_date: "2026-08-05" }
              as: RiskAnalyst
            - call: "POST /_clock/set_current_utc"
              payload: { now_utc: "2026-08-06T00:00:00Z" }
              as: RiskAnalyst
            - call: "POST /merchant-day-activity"
              payload: { merchant_id: "${m_h2}", business_date: "2026-08-06", txn_count: 1000, volume_cents: 1000000, decline_count: 5, distinct_card_count: 900, cross_border_count: 0, refund_cents: 0, unique_bin_count: 400, chargeback_count: 9, chargeback_amount_cents: 9000, chargeback_network: "VISA" }
              as: RiskAnalyst
          trigger:
            - call: "POST /monitoring-runs"
              payload: { as_of_date: "2026-08-06" }
              as: RiskAnalyst
            - call: "GET /merchants/${m_h2}/monitoring-alerts"
              payload: {}
              as: RiskAnalyst
              captures: { al_h2: "$.data[0].id" }
            - call: "GET /merchants/${m_h2}/risk-summary"
              payload: {}
              as: RiskAnalyst
          assert:
            - "the second run returns HTTP 201"
            - "the alert list returns meta.total_count == 1"
            - "MonitoringAlert.${al_h2}.recurrence_count == 2"
            - "MonitoringAlert.${al_h2}.detected_on_date == 2026-08-05 and last_detected_on_date == 2026-08-06"
            - "MonitoringAlert.${al_h2}.severity_score == 90 and observed_metric_bps == 90 and state == OPEN"
            - "Merchant.${m_h2}.account_state == RESTRICTED and funding_state == DELAYED and delayed_payout_days == 7"
            - "Merchant.${m_h2}.remediation_required == true and open_alert_count == 1"
            - "Merchant.${m_h2}.last_monitoring_run_date == 2026-08-06"
            - "the risk summary reports rolling_chargeback_ratio_bps == 90 and gating_ratio_band == EXCESSIVE"
      - name: cascading_side_effects_layer
        claim_type: cascading_side_effects
        excluded_because:
          difficulty_instance: chargeback_breach_cascades_run_alert_account_funding_batch
          rationale: "That §1.8 instance already walks the full four-link CB-BREACH chain in one request - run raises the alert, the alert restricts the account, the restriction delays funding, and the delay re-dates the merchant's open batches - and asserts the untouched entities as well, which is exactly what a corner instance for this layer would have to check."
      - name: dual_variant_calculation_layer
        claim_type: dual_variant_calculation
        excluded_because:
          difficulty_instance: credit_assessment_lag_vs_chargeback_method_diverge
          rationale: "That §1.8 instance runs both reserve methods over one identical application and pins the divergent reserve_pct_bps, exposure_estimate_cents, reserve_cap_cents and reserve_type for each, which is the whole content of a variant-divergence corner for this layer."
  - section: consistency model
    instances:
      - name: settlement_writes_are_already_visible_in_their_own_response
        claim_type: immediate_visibility
        grounds:
          - complexity_profile.consistency_model
          - calculations.settlement_waterfall
          - endpoints[POST /settlement-batches]
        distinguishing_aspect: "Nothing about the settlement is deferred: the creating response itself already carries the computed reserve_hold_cents 50000, net_payout_cents 950000 and scheduled_payout_date 2026-08-05, and the immediately following reads show the ledger row, the account totals and the merchant's reserve_balance_cents and pending_payout_cents all updated - there is no intermediate request in which the batch exists but its ledger effects do not."
        test_recipe:
          setup:
            - "standard merchant onboarded at clock 2026-08-01 (500 bps ROLLING) with a 2026-08-04 row of 1000 transactions / 1000000 cents and no chargebacks"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { now_utc: "2026-08-01T00:00:00Z" }
              as: UnderwritingOfficer
            - call: "POST /merchant-applications"
              payload: { legal_business_name: "Hollowbrook Paper", tax_id: "88-5300038", mcc_code: "5732", country_code: "US", requested_monthly_volume_cents: 30000000, average_ticket_cents: 12000, avg_delivery_lag_days: 0, declared_chargeback_ratio_bps: 0, prior_processing_history_months: 24, credit_score: 700 }
              as: Applicant
              captures: { app_i1: "$.data.id" }
            - call: "POST /beneficial-owners"
              payload: { application_id: "${app_i1}", full_name: "Dana Reyes", ownership_pct: 100.00, country_code: "US", date_of_birth: "1980-05-05", government_id_last4: "1234" }
              as: Applicant
              as_user_id: "${app_i1}"
              captures: { own_i1: "$.data.id" }
            - call: "POST /merchant-applications/${app_i1}/submit"
              payload: {}
              as: Applicant
              as_user_id: "${app_i1}"
            - call: "POST /business-verifications"
              payload: { application_id: "${app_i1}", registry_match: true, address_match: true, tax_id_match: true, bank_account_match: true }
              as: UnderwritingOfficer
            - call: "POST /beneficial-owners/${own_i1}/screen"
              payload: { sanctions_hit: false, pep_flag: false, id_verified: true }
              as: UnderwritingOfficer
            - call: "POST /merchant-applications/${app_i1}/advance-to-underwriting"
              payload: {}
              as: UnderwritingOfficer
              captures: { av_i1: "$.data.version" }
            - call: "POST /credit-assessments"
              payload: { application_id: "${app_i1}", method: "LAG_WEIGHTED", expected_application_version: "${av_i1}" }
              as: UnderwritingOfficer
            - call: "POST /merchant-applications/${app_i1}/decision"
              payload: { decision: "APPROVE" }
              as: RiskCommitteeApprover
            - call: "GET /merchant-applications/${app_i1}/onboarded-merchants"
              payload: {}
              as: RiskCommitteeApprover
              captures: { m_i1: "$.data[0].id" }
            - call: "GET /merchants/${m_i1}/reserve-accounts"
              payload: {}
              as: RiskAnalyst
              captures: { ra_i1: "$.data[0].id", rav_i1: "$.data[0].version" }
            - call: "POST /_clock/set_current_utc"
              payload: { now_utc: "2026-08-04T00:00:00Z" }
              as: PortfolioController
            - call: "POST /merchant-day-activity"
              payload: { merchant_id: "${m_i1}", business_date: "2026-08-04", txn_count: 1000, volume_cents: 1000000, decline_count: 10, distinct_card_count: 950, cross_border_count: 0, refund_cents: 0, unique_bin_count: 300, chargeback_count: 0, chargeback_amount_cents: 0 }
              as: RiskAnalyst
          trigger:
            - call: "POST /settlement-batches"
              payload: { merchant_id: "${m_i1}", period_start_date: "2026-08-04", period_end_date: "2026-08-04", gross_volume_cents: 1000000 }
              as: PortfolioController
              captures: { b_i1: "$.data.id" }
            - call: "GET /reserve-accounts/${ra_i1}/ledger-entries"
              payload: {}
              as: PortfolioController
              captures: { le_i1: "$.data[0].id" }
            - call: "GET /reserve-accounts/${ra_i1}"
              payload: {}
              as: PortfolioController
            - call: "GET /merchants/${m_i1}"
              payload: {}
              as: PortfolioController
            - call: "GET /merchants/${m_i1}/risk-summary"
              payload: {}
              as: PortfolioController
          assert:
            - "the create response is HTTP 201 with response_type == SettlementBatch and data.reserve_hold_cents == 50000"
            - "the create response already carries data.net_payout_cents == 950000, data.loss_offset_from_settlement_cents == 0, data.payout_state == SCHEDULED and data.scheduled_payout_date == 2026-08-05"
            - "the very next ledger read returns meta.total_count == 1 with ReserveLedgerEntry.${le_i1}.settlement_batch_id == ${b_i1} and amount_cents == 50000"
            - "the account read shows held_balance_cents == 50000 and total_accrued_cents == 50000 with no polling in between"
            - "the merchant read shows reserve_balance_cents == 50000 and pending_payout_cents == 950000"
            - "the risk summary read shows reserve_held_balance_cents == 50000 and unpaid_settlement_exposure_cents == 950000"
            - "SettlementBatch.${b_i1}.gross_volume_cents == 1000000 and paid_at == null"
