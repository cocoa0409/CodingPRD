              as: MedicalDirector
            - call: "POST /pace/care-plans/${cpa}/submit"
              payload: {}
              as: IntakeCoordinator
            - call: "POST /pace/care-plans/${cpa}/activate"
              payload: {}
              as: MedicalDirector
            - call: "POST /pace/medication-orders"
              payload: { participant_id: "${p}", care_plan_id: "${cpa}", drug_name: "Aspirin", daily_doses: 1 }
              as: NurseStaff
              captures: { mo: $.data.id }
            - call: "POST /pace/medication-orders/${mo}/activate"
              payload: {}
