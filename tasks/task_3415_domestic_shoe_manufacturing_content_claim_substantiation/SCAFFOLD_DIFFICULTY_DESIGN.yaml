              payload: { production_run_id: "${r2}" }
              as: ProductionPlanner
            - *c_w1_create
            - *c_w1_enr_st
            - *c_w1_as_st
            - *c_w1_enr_la
            - *c_w1_as_la
            - *c_w1_enr_as
            - *c_w1_as_as
            - *c_w2_create
