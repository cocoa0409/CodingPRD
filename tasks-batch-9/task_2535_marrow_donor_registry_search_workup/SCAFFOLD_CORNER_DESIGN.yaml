              as_user_id: "tc-1"
              is_negative_trigger: true
              captures: { err_stale_reschedule: "$.data.error_id" }
            - call: "GET /registry/patients/${p_id}"
              payload: {}
              as: TransplantCoordinator
              as_user_id: "tc-1"
