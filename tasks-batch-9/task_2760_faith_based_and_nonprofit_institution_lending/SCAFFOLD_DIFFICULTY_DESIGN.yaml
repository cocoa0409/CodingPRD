      - name: covenant_second_breach_cascade_suspends_approved_draws_and_releases_reserved
        grounds:
          - state_machines.Covenant.transitions["BREACH_PENDING_CURE -> BREACHED"]
          - state_machines.Loan.dimension.risk_posture.transitions["WATCH -> RESTRICTED"]
          - state_machines.DrawRequest.transitions["APPROVED -> SUSPENDED"]
          - entities.Loan.fields.reserved_draw_cents
          - endpoints["POST /covenants/{covenant_id}/tests"]
          - endpoints["POST /draw-requests/{draw_request_id}/reinstate"]
        distinguishing_aspect: |
          One covenant test fires a four-level chain: Covenant BREACH_PENDING_CURE ->
          BREACHED, then Loan.risk_posture WATCH -> RESTRICTED, then every APPROVED
          DrawRequest -> SUSPENDED, then Loan.reserved_draw_cents 60000000 -> 0. The
          FIRST failing test must move only levels 1 and 2 (draw still APPROVED, reserved
          still 60000000), so an implementation that suspends draws on the first breach,
          or that suspends the draw without releasing the reservation, is caught. The
          waive + reinstate tail replays the chain backwards to 60000000.
        test_recipe:
          setup:
            - "The reference borrower funded at 225000000 with interest_reserve_shortfall_cents 1500000, servicing_status PENDING_FIRST_DRAW."
            - "One DSCR covenant with threshold_ratio 1.2500 (actual ratio 1.2000 fails)."
            - "One 60000000 draw APPROVED but not yet disbursed, so reserved_draw_cents is 60000000."
