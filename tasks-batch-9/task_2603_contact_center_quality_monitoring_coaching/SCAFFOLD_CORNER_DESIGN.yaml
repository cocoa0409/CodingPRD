              as: QualityManager
            - call: "POST /coaching-plans/${cp1}/escalate"
              payload: { escalation_note: "Due date reached with no sessions logged." }
              as: QualityManager
            - call: "POST /coaching-plans/${cp1}/escalate"
              payload: { escalation_note: "Escalating a second time." }
              as: QualityManager
            - call: "POST /coaching-plans/${cp1}/log-session"
              payload: { session_note: "Too late to coach.", session_at: "2026-09-04T10:00:00Z" }
              as: Supervisor
          assert:
            - "setup sanity -- CoachingPlan.${cp1}.status == ASSIGNED, escalation_tier == T1, required_session_count == 2, due_at == 2026-09-04T09:00:00.000Z and Agent.${ag1}.open_compliance_findings == 0 with coaching_state ACTIVE"
            - "trigger 1 -> HTTP 422 ERR_ESCALATION_NOT_DUE: the clock is 30 days short of due_at and 0 < ESCALATION_FINDING_THRESHOLD 2, so neither escalation route is open"
            - "trigger 3 -> HTTP 422 ERR_ESCALATION_NOT_DUE one second before due_at -- the comparison is clock >= due_at, not same-day"
            - "trigger 5 -> HTTP 200 exactly at due_at: status == ESCALATED, escalation_tier == T3 and escalation_note == \"Due date reached with no sessions logged.\""
            - "the escalation leaves the sizing untouched: required_session_count is still 2, completed_session_count 0 and due_at still 2026-09-04T09:00:00.000Z"
            - "Agent.${ag1}.coaching_state is still ACTIVE and Agent.${ag1}.version is unchanged by the escalation -- an escalated plan is still an active intervention"
            - "trigger 6 -> HTTP 409 ERR_COACHING_PLAN_TERMINAL: ESCALATED is terminal, so escalation is not repeatable"
            - "trigger 7 -> HTTP 409 ERR_COACHING_PLAN_TERMINAL: no session may be logged onto a terminal plan either, and completed_session_count stays 0"

  # =========================================================================
  # 5. From Table 5 (Endpoints)
  # =========================================================================
  - section: endpoints
    instances:
      - name: endpoint_evaluator_crud_surface_and_its_deliberate_gaps
        claim_type: standard_crud
        grounds:
          - endpoints[POST /evaluators]
          - endpoints[GET /evaluators/{id}]
          - endpoints[GET /evaluators]
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: "The Evaluator collection is the whole CRUD surface this domain grants: create, read one, list with filter and pagination -- and nothing else. There is no PUT, PATCH or DELETE anywhere in the catalog, so calibration_status and open_assignment_count can only move through calibration closes and assignments; the list must also honour limit/offset with total_count and has_more computed over the filtered set, not the whole table."
        test_recipe:
          setup:
            - "empty database; three evaluators registered at the pinned clock"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T09:00:00Z" }
              as: QualityManager
            - call: "POST /evaluators"
              payload: { full_name: "Eve Evaluator", max_open_assignments: 3 }
              as: QualityManager
              captures: { ev1: $.data.id }
            - call: "POST /evaluators"
              payload: { full_name: "Ravi Reviewer" }
              as: QualityManager
              captures: { ev2: $.data.id }
            - call: "POST /evaluators"
              payload: { full_name: "Nia Newcomer", max_open_assignments: 1 }
              as: QualityManager
              captures: { ev3: $.data.id }
          trigger:
            - call: "GET /evaluators/${ev2}"
              payload: {}
              as: Supervisor
            - call: "GET /evaluators?limit=2&offset=0"
              payload: {}
              as: QualityManager
            - call: "GET /evaluators?limit=2&offset=2"
              payload: {}
              as: QualityManager
            - call: "GET /evaluators?calibration_status=SUSPENDED"
              payload: {}
              as: QualityManager
            - call: "GET /evaluators?calibration_status=CALIBRATED&limit=1&offset=0"
              payload: {}
              as: QualityManager
          assert:
            - "trigger 1 -> HTTP 200 with response_type object and data.full_name == \"Ravi Reviewer\", calibration_status == CALIBRATED, open_assignment_count == 0, last_deviation_pct == null and max_open_assignments == the declared default (the payload omitted it)"
            - "trigger 2 -> HTTP 200 with response_type list, data length 2, total_count 3, has_more true, limit 2 and offset 0 echoed"
            - "trigger 3 -> HTTP 200 with data length 1 (${ev3}), total_count 3 and has_more false -- offset walks the same stable ordering"
            - "trigger 4 -> HTTP 200 with data == [] and total_count 0: no evaluator is SUSPENDED, and an empty page is a 200 and not a 404"
            - "trigger 5 -> HTTP 200 with data length 1, total_count 3 and has_more true -- total_count counts the filtered set (all three are CALIBRATED) and is not reduced by limit"
            - "the endpoint catalog contains no PUT, PATCH or DELETE for /evaluators/{id}: calibration_status may only change inside a calibration close and open_assignment_count only through assign / submit, so any direct-edit route would be out of contract"
      - name: endpoint_form_activate_and_retire_enforce_their_preconditions
        claim_type: action_endpoint
        grounds:
          - endpoints[POST /evaluation-forms/{id}/activate]
          - endpoints[POST /evaluation-forms/{id}/retire]
          - state_machines.EvaluationForm
          - validations[priority=9]
          - validations[priority=10]
          - validations[priority=31]
          - validations[priority=32]
        distinguishing_aspect: "Both action endpoints take an empty body and are non-idempotent, and each guards a different status: activate demands DRAFT (a second activate and an activate on RETIRED are both ERR_FORM_NOT_DRAFT) while retire demands ACTIVE (a second retire is ERR_FORM_NOT_ACTIVE). Activation also runs the two shape rules -- a 95.00 weight total is ERR_WEIGHTS_NOT_100 and a form with no compliance-critical behavior is ERR_NO_COMPLIANCE_BEHAVIOR -- at activation time rather than at create time, and a retired form can no longer back a new plan."
        test_recipe:
          setup:
            - "three DRAFT forms: F1 well formed, FW with weights summing to 95.00, FC with a 100.00 total but no compliance_critical behavior"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T09:00:00Z" }
              as: QualityManager
            - call: "POST /evaluation-forms"
              payload: { name: "Care Quality", version_label: "2026.08", auto_fail_policy: "COMPLIANCE_SECTION_ZERO", min_compliance_item_score: 3, behaviors: [ { code: "DISCLOSE", label: "Disclosures", weight_pct: 30.00, max_points: 5, compliance_critical: true, auto_fail_on_violation: true, guidance_text: "State the recording disclosure." }, { code: "GREET", label: "Greeting", weight_pct: 20.00, max_points: 5, guidance_text: "Use the branded greeting." }, { code: "RESOLVE", label: "Resolution", weight_pct: 35.00, max_points: 5, guidance_text: "Resolve or set a next step." }, { code: "SURVEY", label: "Survey", weight_pct: 15.00, max_points: 5, allows_not_applicable: true, guidance_text: "Invite to the survey." } ] }
              as: QualityManager
              captures: { f1: $.data.id }
            - call: "POST /evaluation-forms"
              payload: { name: "Short Weights", version_label: "2026.08-w", auto_fail_policy: "ZERO_TOTAL", behaviors: [ { code: "DISCLOSE", label: "Disclosures", weight_pct: 30.00, max_points: 5, compliance_critical: true, auto_fail_on_violation: true, guidance_text: "Disclose." }, { code: "GREET", label: "Greeting", weight_pct: 65.00, max_points: 5, guidance_text: "Greet." } ] }
              as: QualityManager
              captures: { fw: $.data.id }
            - call: "POST /evaluation-forms"
              payload: { name: "No Compliance Item", version_label: "2026.08-c", auto_fail_policy: "ZERO_TOTAL", behaviors: [ { code: "GREET", label: "Greeting", weight_pct: 40.00, max_points: 5, guidance_text: "Greet." }, { code: "RESOLVE", label: "Resolution", weight_pct: 60.00, max_points: 5, guidance_text: "Resolve." } ] }
              as: QualityManager
              captures: { fc: $.data.id }
          trigger:
            - call: "POST /evaluation-forms/${fw}/activate"
              payload: {}
              as: QualityManager
            - call: "POST /evaluation-forms/${fc}/activate"
              payload: {}
              as: QualityManager
            - call: "POST /evaluation-forms/${f1}/activate"
              payload: {}
              as: QualityManager
            - call: "POST /evaluation-forms/${f1}/activate"
              payload: {}
              as: QualityManager
            - call: "POST /evaluation-forms/${f1}/retire"
              payload: {}
              as: QualityManager
            - call: "POST /evaluation-forms/${f1}/retire"
              payload: {}
              as: QualityManager
            - call: "POST /evaluation-forms/${f1}/activate"
              payload: {}
              as: QualityManager
            - call: "POST /sample-plans"
              payload: { form_id: "${f1}", period_start: "2026-08-01T00:00:00Z", period_end: "2026-08-31T23:59:59Z", per_agent_target_volume: 4, source_mix: { random_pct: 100, targeted_pct: 0, customer_flagged_pct: 0 } }
              as: QualityManager
          assert:
            - "setup sanity -- EvaluationForm.${fw}.behavior_weight_total == 95.00 and EvaluationForm.${fc}.compliance_behavior_count == 0, yet both were created 201: the shape rules are activation-time rules"
            - "trigger 1 -> HTTP 422 ERR_WEIGHTS_NOT_100 and EvaluationForm.${fw}.status is still DRAFT with activated_at null"
            - "trigger 2 -> HTTP 422 ERR_NO_COMPLIANCE_BEHAVIOR and EvaluationForm.${fc}.status is still DRAFT"
            - "trigger 3 -> HTTP 200: status == ACTIVE, activated_at == 2026-08-05T09:00:00.000Z, retired_at == null and version == 2"
            - "trigger 4 -> HTTP 409 ERR_FORM_NOT_DRAFT: activation is not idempotent, and activated_at is not restamped"
            - "trigger 5 -> HTTP 200: status == RETIRED, retired_at == 2026-08-05T09:00:00.000Z, activated_at unchanged and version == 3"
            - "trigger 6 -> HTTP 409 ERR_FORM_NOT_ACTIVE: retire guards ACTIVE, so the second retire reports the retire-side error and not the activate-side one"
            - "trigger 7 -> HTTP 409 ERR_FORM_NOT_DRAFT: RETIRED is terminal, so a retired form can never be re-activated"
            - "trigger 8 -> HTTP 409 ERR_FORM_NOT_ACTIVE: a retired form can no longer back a new SamplePlan, and no plan row is created"
      - name: endpoint_selection_links_plan_and_interaction_in_declared_order
