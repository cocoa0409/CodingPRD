  - rule_id: boundary_precision_check
    instances:
      - name: gauge_cpk_at_capable_threshold_versus_one_ten_thousandth_below
        grounds:
          - calculations.gauge_capability
          - calculations.gauge_capability.constants.CPK_CAPABLE_MIN
          - entities.ExtrusionRun.fields.gauge_capability_state
        distinguishing_aspect: |
          Two runs differ only in the first two of five readings by 0.01 micron each
          (48.77/51.23 versus 48.76/51.24). Both have mean 50.000 and identical spec limits
          (USL 54.000, LSL 46.000); the population standard deviation moves 1.0026 -> 1.0075 and
          Cpk moves 1.330 -> 1.323, which straddles CPK_CAPABLE_MIN of 1.330 exactly -- CAPABLE at
          the threshold, MARGINAL one thousandth below. Rounding to 3 dp happens BEFORE banding.
        test_recipe:
          setup:
            - "food-contact product P-FD-1 (target_gauge_micron 50.0, gauge_tolerance_pct 8.0) on line L-FD with APPROVED recipe R-FD-1"
            - "RUN-FD-1 RUNNING with readings 48.77, 51.23, 49.00, 51.00 appended"
            - "RUN-FD-2 RUNNING on 2026-08-06 with readings 48.76, 51.24, 49.00, 51.00 appended"
            - "MIN_GAUGE_SAMPLES is 5, CPK_CAPABLE_MIN is 1.33, CPK_MARGINAL_MIN is 1.00"
          setup_api_calls:
            - *a_clock_d1_0600
            - *a_p_fd
            - *a_g_ll
            - *a_g_ev
            - *a_g_ti
            - *a_g_ad
            - *a_line_fd
            - *a_pool_fd
            - *a_press1
            - *a_r1_new
            - *a_r1_c1
            - *a_r1_c2
            - *a_r1_c3
            - *a_r1_c4
            - *a_r1_c5
            - *a_r1_sub
            - *a_r1_app
            - *a_runfd_new
            - *a_runfd2_new
            - *a_runfd_start
            - &a_gfd_4877 { call: "POST /extrusion-runs/${run_fd}/gauge-readings", payload: { thickness_micron: 48.77 }, as: ExtrusionOperator }
            - &a_gfd_5123 { call: "POST /extrusion-runs/${run_fd}/gauge-readings", payload: { thickness_micron: 51.23 }, as: ExtrusionOperator }
            - &a_gfd_4900 { call: "POST /extrusion-runs/${run_fd}/gauge-readings", payload: { thickness_micron: 49.0 }, as: ExtrusionOperator }
            - &a_gfd_5100 { call: "POST /extrusion-runs/${run_fd}/gauge-readings", payload: { thickness_micron: 51.0 }, as: ExtrusionOperator }
            - &a_clock_d2_0600 { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-06T06:00:00Z" }, as: PlantAdmin }
            - &a_runfd2_start { call: "POST /extrusion-runs/${run_fd2}/start", payload: {}, as: ExtrusionOperator }
            - &a_gfd2_4876 { call: "POST /extrusion-runs/${run_fd2}/gauge-readings", payload: { thickness_micron: 48.76 }, as: ExtrusionOperator }
            - &a_gfd2_5124 { call: "POST /extrusion-runs/${run_fd2}/gauge-readings", payload: { thickness_micron: 51.24 }, as: ExtrusionOperator }
            - &a_gfd2_4900 { call: "POST /extrusion-runs/${run_fd2}/gauge-readings", payload: { thickness_micron: 49.0 }, as: ExtrusionOperator }
            - &a_gfd2_5100 { call: "POST /extrusion-runs/${run_fd2}/gauge-readings", payload: { thickness_micron: 51.0 }, as: ExtrusionOperator }
          trigger:
            - { call: "POST /extrusion-runs/${run_fd}/gauge-readings", payload: { thickness_micron: 50.0 }, as: ExtrusionOperator }
            - { call: "POST /extrusion-runs/${run_fd2}/gauge-readings", payload: { thickness_micron: 50.0 }, as: ExtrusionOperator }
          assert:
            - "ExtrusionRun.${run_fd}.gauge_sample_count == 5 and gauge_mean_micron == 50.000"
            - "ExtrusionRun.${run_fd}.gauge_sd_micron == 1.0026 and gauge_cv_pct == 2.005"
            - "ExtrusionRun.${run_fd}.gauge_capability_index == 1.330 and gauge_capability_state == CAPABLE"
            - "ExtrusionRun.${run_fd2}.gauge_sample_count == 5 and gauge_mean_micron == 50.000"
            - "ExtrusionRun.${run_fd2}.gauge_sd_micron == 1.0075 and gauge_cv_pct == 2.015"
            - "ExtrusionRun.${run_fd2}.gauge_capability_index == 1.323 and gauge_capability_state == MARGINAL"
            - "ExtrusionRun.${run_fd}.layflat_deviation_max_mm == 0.0 and bubble_instability_events == 0"
      - name: regrind_pct_exactly_at_cap_versus_one_half_point_above
        grounds:
          - calculations.regrind_cap_evaluation
          - validations[priority=12]
          - errors[ERR_REGRIND_CAP_EXCEEDED]
          - entities.BlendRecipe.fields.regrind_cap_pct
        distinguishing_aspect: |
          Two food-contact 3-layer recipes differ only in how the 50 % skin layer splits between
          virgin LL-1001 and regrind: 10.000 % regrind is exactly the derived cap of 10.000 % (LOW
          PCR band, CAP_DELTA 0.0, base cap max_regrind_pct_food) and passes because the rule is
          inclusive, while 15.000 % is above it and is rejected at submit.
        test_recipe:
          setup:
            - "food-contact product P-FD-1 (max_regrind_pct_food 10.0, assumed_regrind_pcr_pct 5.0) with the four resin grades registered"
            - "DRAFT recipe R-FD-11 with 10.000 % regrind and DRAFT recipe R-FD-10 with 15.000 % regrind, both totalling 100.000 %"
          setup_api_calls:
            - *a_clock_d1_0600
            - *a_p_fd
            - *a_g_ll
            - *a_g_ev
            - *a_g_ti
            - *a_g_ad
            - &a_r11_new { call: "POST /blend-recipes", payload: { recipe_code: "R-FD-11", product_id: "${p_fd}", process_type: "BLOWN", layer_count: 3 }, as: BlendEngineer, captures: { r11: "$.data.id" } }
            - &a_r11_c1 { call: "POST /blend-recipes/${r11}/components", payload: { layer_index: 1, component_kind: "VIRGIN", weight_pct: 30.0, resin_grade_id: "${g_ll}" }, as: BlendEngineer }
            - &a_r11_c2 { call: "POST /blend-recipes/${r11}/components", payload: { layer_index: 2, component_kind: "VIRGIN", weight_pct: 2.5, resin_grade_id: "${g_ev}" }, as: BlendEngineer }
            - &a_r11_c3 { call: "POST /blend-recipes/${r11}/components", payload: { layer_index: 2, component_kind: "VIRGIN", weight_pct: 7.5, resin_grade_id: "${g_ti}" }, as: BlendEngineer }
            - &a_r11_c4 { call: "POST /blend-recipes/${r11}/components", payload: { layer_index: 3, component_kind: "VIRGIN", weight_pct: 40.0, resin_grade_id: "${g_ll}" }, as: BlendEngineer }
            - &a_r11_c5 { call: "POST /blend-recipes/${r11}/components", payload: { layer_index: 3, component_kind: "ADDITIVE", weight_pct: 10.0, resin_grade_id: "${g_ad}" }, as: BlendEngineer }
            - &a_r11_c6 { call: "POST /blend-recipes/${r11}/components", payload: { layer_index: 3, component_kind: "REGRIND", weight_pct: 10.0 }, as: BlendEngineer }
            - &a_r10_new { call: "POST /blend-recipes", payload: { recipe_code: "R-FD-10", product_id: "${p_fd}", process_type: "BLOWN", layer_count: 3 }, as: BlendEngineer, captures: { r10: "$.data.id" } }
            - &a_r10_c1 { call: "POST /blend-recipes/${r10}/components", payload: { layer_index: 1, component_kind: "VIRGIN", weight_pct: 25.0, resin_grade_id: "${g_ll}" }, as: BlendEngineer }
            - &a_r10_c2 { call: "POST /blend-recipes/${r10}/components", payload: { layer_index: 2, component_kind: "VIRGIN", weight_pct: 2.5, resin_grade_id: "${g_ev}" }, as: BlendEngineer }
            - &a_r10_c3 { call: "POST /blend-recipes/${r10}/components", payload: { layer_index: 2, component_kind: "VIRGIN", weight_pct: 7.5, resin_grade_id: "${g_ti}" }, as: BlendEngineer }
            - &a_r10_c4 { call: "POST /blend-recipes/${r10}/components", payload: { layer_index: 3, component_kind: "VIRGIN", weight_pct: 40.0, resin_grade_id: "${g_ll}" }, as: BlendEngineer }
            - &a_r10_c5 { call: "POST /blend-recipes/${r10}/components", payload: { layer_index: 3, component_kind: "ADDITIVE", weight_pct: 10.0, resin_grade_id: "${g_ad}" }, as: BlendEngineer }
            - &a_r10_c6 { call: "POST /blend-recipes/${r10}/components", payload: { layer_index: 3, component_kind: "REGRIND", weight_pct: 15.0 }, as: BlendEngineer }
          trigger:
            - { call: "POST /blend-recipes/${r11}/submit", payload: {}, as: BlendEngineer, as_user_id: "u-be-1" }
            - { call: "POST /blend-recipes/${r10}/submit", payload: {}, as: BlendEngineer, as_user_id: "u-be-1" }
          assert:
            - "POST /blend-recipes/${r11}/submit -> 200 and BlendRecipe.${r11}.status == SUBMITTED"
            - "BlendRecipe.${r11}.regrind_pct == 10.000 and regrind_cap_pct == 10.000 and pcr_band == LOW"
            - "BlendRecipe.${r11}.strength_index == 34.61 and blend_cost_per_kg == 1.96 and blended_density_kg_m3 == 927.80"
            - "BlendRecipe.${r11}.nominal_recycled_content_pct == 0.500 and barrier_layer_present == true"
            - "POST /blend-recipes/${r10}/submit -> 422 ERR_REGRIND_CAP_EXCEEDED"
            - "BlendRecipe.${r10}.regrind_pct == 15.000 and regrind_cap_pct == 10.000 and status == DRAFT"
            - "BlendRecipe.${r10}.nominal_recycled_content_pct == 0.750"
