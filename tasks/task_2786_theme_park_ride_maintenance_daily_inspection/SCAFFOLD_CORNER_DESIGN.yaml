          assert:
            - "InspectionTemplate.${t_id}.status == \"DRAFT\" and revision == 1 and item_count == 0 and activated_at is null"
            - "DowntimeEvent.${d_id}.status == \"OPEN\" and service_date == \"2026-08-01\" and auto_opened == false and ended_at is null and duration_minutes is null and settled_guest_slots_lost is null"
            - "PartRequisition.${r_id}.status == \"REQUESTED\" and total_cost_cents == 25000 and expected_availability_date is null"
            - "MaintenanceBulletin.${b_id}.status == \"ISSUED\" and action_total_count == 0 and action_verified_count == 0 and acknowledged_at is null"
            - "IncidentReport.${i_id}.status == \"REPORTED\" and regulator_notification_due_at is null and suspended_certification_count == 0 and notified_late == false"
            - "OverhaulWorkOrder.${w_id}.status == \"SCHEDULED\" and recommissioned_at is null"
            - "Attraction.${a_id}.operational_posture == \"DOWN\" (derivation clause 3: the OPEN downtime event)"

      - name: template_activation_applies_every_declared_side_effect_and_supersedes_the_prior_revision
        claim_type: side_effect_execution
        grounds:
          - "state_machines.InspectionTemplate.transitions.DRAFT_to_ACTIVE"
          - "state_machines.InspectionTemplate.transitions.ACTIVE_to_SUPERSEDED"
          - "entities.Attraction.fields.active_template_id"
          - "concurrency_rules[template-activate-stale-attraction]"
        distinguishing_aspect: "Activating revision 1 sets activated_at, repoints Attraction.active_template_id and bumps Attraction.version from 1 to 2; activating revision 2 flips revision 1 to SUPERSEDED, repoints active_template_id again and bumps the attraction to version 3 — the two revisions are never both ACTIVE."
        test_recipe:
          setup:
            - "One attraction with two DRAFT templates, each carrying one checklist item."
          setup_api_calls:
            - call: "POST /park-ops/attractions"
              payload: { name: "Side Effect Ride", park_area: "FRONTIER", manufacturer: "Vekoma", model_code: "SE-1", ride_class: "FAMILY", theoretical_hourly_capacity: 800, min_operators_required: 2, parts_budget_cents: 1000000 }
