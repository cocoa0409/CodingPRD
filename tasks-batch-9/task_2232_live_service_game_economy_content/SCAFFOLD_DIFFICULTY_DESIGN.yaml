              as: LiveOpsCommander
              captures: { run1_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-04T00:00:00Z" }
              as: LiveOpsCommander
            - call: "POST /currency-accounts/${p1_soft_id}/adjustments"
              payload: { direction: "FAUCET", amount_minor: 1000, source_kind: "EVENT_REWARD" }
              as: LiveOpsCommander
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: LiveOpsCommander
            - call: "POST /currency-accounts/${p1_soft_id}/adjustments"
              payload: { direction: "SINK", amount_minor: 399, source_kind: "OFFER_SPEND" }
              as: LiveOpsCommander
