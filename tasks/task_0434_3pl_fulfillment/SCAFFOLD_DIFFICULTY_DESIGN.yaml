# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index) — task 0434
# 9 rule_ids x 2 instances = 18 instances. Every grounds[] ref resolves into
# SCAFFOLD.yaml §1.1-§1.7. Every setup_api_calls/trigger call resolves to a §1.5
# endpoint; every ${var} is bound by an earlier captures: line.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: handling_estimate_vs_billed_diverges_on_multi_carton_order
        grounds:
          - calculations.handling_fee
          - entities.Order.fields.estimated_handling_cents
          - entities.Order.fields.billed_handling_cents
          - state_machines.Order.PICKING_to_PACKED
          - state_machines.Order.PACKED_to_SHIPPED
        distinguishing_aspect: |
          On the Order domain: estimated_handling_cents (unit-only basis, 600) is
          strictly less than billed_handling_cents (adds the per-extra-carton
          surcharge, 800) for the SAME 3-unit order packed into 2 cartons.
        test_recipe:
          setup:
            - "Client with handling_rate_per_order_cents=500, handling_rate_per_extra_unit_cents=50, handling_surcharge_per_extra_carton_cents=200, carrier_discount_bps=0"
            - "One ACTIVE SKU (unit_volume_cc=400, not hazmat); 9 units putaway into a GENERAL bin (capacity 100000)"
            - "Order for 3 units, released in a wave, all picks confirmed, packed into 2 cartons (2 units + 1 unit), label purchased"
          setup_api_calls:
            - call: "POST /clients"
              payload: { name: "Acme", storage_rate_per_pallet_cents: 1000, handling_rate_per_order_cents: 500, handling_rate_per_extra_unit_cents: 50, handling_surcharge_per_extra_carton_cents: 200, carrier_discount_bps: 0 }
              as: BillingClerk
              captures: { cli: $.data.id }
            - call: "POST /clients/${cli}/skus"
              payload: { code: "SKU1", unit_volume_cc: 400, hazmat: false }
              as: ClientUser
              as_user_id: "${cli}"
              captures: { sku: $.data.id }
            - call: "POST /bins"
              payload: { location_code: "G-01", bin_type: "GENERAL", capacity_cc: 100000 }
              as: ReceivingClerk
              captures: { bin: $.data.id }
            - call: "POST /clients/${cli}/receipts"
              payload: { sku_id: "${sku}", bin_id: "${bin}", expected_qty: 9 }
              as: ReceivingClerk
              captures: { rcpt: $.data.id }
            - call: "POST /clients/${cli}/receipts/${rcpt}/receive"
              payload: { received_qty: 9 }
              as: ReceivingClerk
            - call: "POST /clients/${cli}/receipts/${rcpt}/putaway"
              payload: {}
              as: ReceivingClerk
            - call: "POST /clients/${cli}/orders"
              payload: { ship_to_zone: 3, lines: [ { sku_id: "${sku}", qty: 3 } ] }
              as: ClientUser
              as_user_id: "${cli}"
              captures: { ord: $.data.id }
            - call: "POST /clients/${cli}/waves"
              payload: {}
              as: WavePlanner
              captures: { wv: $.data.id }
            - call: "POST /clients/${cli}/waves/${wv}/add-order"
              payload: { order_id: "${ord}" }
              as: WavePlanner
            - call: "POST /clients/${cli}/waves/${wv}/release"
              payload: {}
              as: WavePlanner
            - call: "GET /pick-tasks"
              payload: { order_id: "${ord}" }
              as: WavePlanner
              captures: { pt0: "$.data[0].id"}
            - call: "POST /clients/${cli}/pick-tasks/${pt0}/confirm"
              payload: { picked_qty: 3 }
              as: PickOperator
            - call: "POST /clients/${cli}/orders/${ord}/pack"
              payload: { cartons: [ { packed_units: 2 }, { packed_units: 1 } ] }
              as: PackStation
              captures: { est: $.data.estimated_handling_cents }
            - call: "POST /clients/${cli}/shipments"
              payload: { order_id: "${ord}" }
              as: ShipStation
              captures: { shp: $.data.id }
          trigger:
            - call: "POST /clients/${cli}/orders/${ord}/ship"
              payload: {}
              as: ShipStation
              captures: { billed: $.data.billed_handling_cents }
          assert:
            - "Order.${ord}.estimated_handling_cents == 600"
            - "Order.${ord}.billed_handling_cents == 800"
            - "Order.${ord}.billed_handling_cents > Order.${ord}.estimated_handling_cents"

      - name: rate_shop_published_vs_negotiated_quote_diverges
        grounds:
          - calculations.rate_shop
          - entities.Shipment.fields.quoted_cost_cents
          - entities.Client.fields.carrier_discount_bps
          - entities.Shipment.fields.carrier
        distinguishing_aspect: |
          On the Shipment domain: the negotiated quote stamped on
          quoted_cost_cents (495 = round_half_up(550 * 0.90)) is strictly below
          the published quote (550) for the SAME winning carrier GROUND_ECONOMY,
          a different entity domain than the handling dual-variant.
        test_recipe:
          setup:
            - "Client with carrier_discount_bps=1000 (10%)"
            - "Order zone=3, 1 non-hazmat SKU, packed into 1 carton, label purchased"
          setup_api_calls:
            - call: "POST /clients"
              payload: { name: "Beta", storage_rate_per_pallet_cents: 1000, handling_rate_per_order_cents: 500, handling_rate_per_extra_unit_cents: 50, carrier_discount_bps: 1000 }
              as: BillingClerk
              captures: { cli: $.data.id }
            - call: "POST /clients/${cli}/skus"
              payload: { code: "SKU1", unit_volume_cc: 400, hazmat: false }
              as: ClientUser
              as_user_id: "${cli}"
              captures: { sku: $.data.id }
            - call: "POST /bins"
              payload: { location_code: "G-02", bin_type: "GENERAL", capacity_cc: 100000 }
              as: ReceivingClerk
              captures: { bin: $.data.id }
            - call: "POST /clients/${cli}/receipts"
              payload: { sku_id: "${sku}", bin_id: "${bin}", expected_qty: 5 }
              as: ReceivingClerk
              captures: { rcpt: $.data.id }
            - call: "POST /clients/${cli}/receipts/${rcpt}/receive"
              payload: { received_qty: 5 }
              as: ReceivingClerk
            - call: "POST /clients/${cli}/receipts/${rcpt}/putaway"
              payload: {}
              as: ReceivingClerk
            - call: "POST /clients/${cli}/orders"
              payload: { ship_to_zone: 3, lines: [ { sku_id: "${sku}", qty: 1 } ] }
              as: ClientUser
              as_user_id: "${cli}"
              captures: { ord: $.data.id }
            - call: "POST /clients/${cli}/waves"
              payload: {}
              as: WavePlanner
              captures: { wv: $.data.id }
            - call: "POST /clients/${cli}/waves/${wv}/add-order"
              payload: { order_id: "${ord}" }
              as: WavePlanner
            - call: "POST /clients/${cli}/waves/${wv}/release"
              payload: {}
              as: WavePlanner
            - call: "GET /pick-tasks"
              payload: { order_id: "${ord}" }
              as: WavePlanner
              captures: { pt0: "$.data[0].id"}
            - call: "POST /clients/${cli}/pick-tasks/${pt0}/confirm"
              payload: { picked_qty: 1 }
              as: PickOperator
            - call: "POST /clients/${cli}/orders/${ord}/pack"
              payload: { cartons: [ { packed_units: 1 } ] }
              as: PackStation
          trigger:
            - call: "POST /clients/${cli}/shipments"
              payload: { order_id: "${ord}" }
              as: ShipStation
              captures: { carrier: $.data.carrier, quoted: $.data.quoted_cost_cents }
          assert:
            - "Shipment.${ord}.carrier == GROUND_ECONOMY"
            - "Shipment.${ord}.quoted_cost_cents == 495"
            - "published GROUND_ECONOMY quote for these inputs is 550, so quoted_cost_cents (495) < published (550)"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: rate_shop_carrier_min_with_hazmat_eligibility_branch
        grounds:
          - calculations.rate_shop
          - entities.Sku.fields.hazmat
          - entities.Order.fields.ship_to_zone
        distinguishing_aspect: |
          Mode (a): >=3 inputs (per-carrier base/zone/carton constants, carton
          count, zone) with non-linear interaction — a min over carriers plus a
          conditional eligibility branch that DROPS GROUND_ECONOMY from the
          candidate set when any line SKU is hazmat, flipping the winner from
          GROUND_ECONOMY (550) to GROUND_PLUS (740).
        test_recipe:
          setup:
            - "Client carrier_discount_bps=0 so quoted == published"
            - "Hazmat SKU, order zone=3, 1 carton; GROUND_ECONOMY excluded by hazmat"
          setup_api_calls:
            - call: "POST /clients"
              payload: { name: "Haz", storage_rate_per_pallet_cents: 1000, handling_rate_per_order_cents: 500, handling_rate_per_extra_unit_cents: 50, carrier_discount_bps: 0 }
              as: BillingClerk
              captures: { cli: $.data.id }
            - call: "POST /clients/${cli}/skus"
              payload: { code: "HAZ1", unit_volume_cc: 400, hazmat: true }
              as: ClientUser
              as_user_id: "${cli}"
              captures: { sku: $.data.id }
            - call: "POST /bins"
              payload: { location_code: "G-03", bin_type: "GENERAL", capacity_cc: 100000 }
              as: ReceivingClerk
              captures: { bin: $.data.id }
            - call: "POST /clients/${cli}/receipts"
              payload: { sku_id: "${sku}", bin_id: "${bin}", expected_qty: 4 }
              as: ReceivingClerk
              captures: { rcpt: $.data.id }
            - call: "POST /clients/${cli}/receipts/${rcpt}/receive"
              payload: { received_qty: 4 }
              as: ReceivingClerk
            - call: "POST /clients/${cli}/receipts/${rcpt}/putaway"
              payload: {}
              as: ReceivingClerk
            - call: "POST /clients/${cli}/orders"
              payload: { ship_to_zone: 3, lines: [ { sku_id: "${sku}", qty: 1 } ] }
              as: ClientUser
              as_user_id: "${cli}"
              captures: { ord: $.data.id }
            - call: "POST /clients/${cli}/waves"
              payload: {}
              as: WavePlanner
              captures: { wv: $.data.id }
            - call: "POST /clients/${cli}/waves/${wv}/add-order"
              payload: { order_id: "${ord}" }
              as: WavePlanner
            - call: "POST /clients/${cli}/waves/${wv}/release"
              payload: {}
              as: WavePlanner
            - call: "GET /pick-tasks"
              payload: { order_id: "${ord}" }
              as: WavePlanner
              captures: { pt0: "$.data[0].id"}
            - call: "POST /clients/${cli}/pick-tasks/${pt0}/confirm"
              payload: { picked_qty: 1 }
              as: PickOperator
            - call: "POST /clients/${cli}/orders/${ord}/pack"
              payload: { cartons: [ { packed_units: 1 } ] }
              as: PackStation
          trigger:
            - call: "POST /clients/${cli}/shipments"
              payload: { order_id: "${ord}" }
              as: ShipStation
              captures: { carrier: $.data.carrier, quoted: $.data.quoted_cost_cents }
          assert:
            - "Shipment.${ord}.carrier == GROUND_PLUS"
            - "Shipment.${ord}.quoted_cost_cents == 740"

      - name: rate_shop_negotiated_rounding_order_pinned_half_up
        grounds:
          - calculations.rate_shop
          - entities.Client.fields.carrier_discount_bps
          - entities.Shipment.fields.quoted_cost_cents
        distinguishing_aspect: |
          Mode (b): nested rounding where order matters — discount THEN
          round_half_up. For GROUND_ECONOMY published 550 at carrier_discount_bps
          2500, 550*0.75=412.5 rounds half-up to 413; round-then-discount would
          give a different cent, so the pinned order is observable.
        test_recipe:
          setup:
            - "Client carrier_discount_bps=2500 (25%); winning carrier GROUND_ECONOMY published 550"
            - "Order zone=3, non-hazmat, 1 carton"
          setup_api_calls:
            - call: "POST /clients"
              payload: { name: "Round", storage_rate_per_pallet_cents: 1000, handling_rate_per_order_cents: 500, handling_rate_per_extra_unit_cents: 50, carrier_discount_bps: 2500 }
              as: BillingClerk
              captures: { cli: $.data.id }
            - call: "POST /clients/${cli}/skus"
              payload: { code: "SKU1", unit_volume_cc: 400, hazmat: false }
              as: ClientUser
              as_user_id: "${cli}"
              captures: { sku: $.data.id }
            - call: "POST /bins"
              payload: { location_code: "G-04", bin_type: "GENERAL", capacity_cc: 100000 }
              as: ReceivingClerk
              captures: { bin: $.data.id }
            - call: "POST /clients/${cli}/receipts"
              payload: { sku_id: "${sku}", bin_id: "${bin}", expected_qty: 4 }
              as: ReceivingClerk
              captures: { rcpt: $.data.id }
            - call: "POST /clients/${cli}/receipts/${rcpt}/receive"
              payload: { received_qty: 4 }
              as: ReceivingClerk
            - call: "POST /clients/${cli}/receipts/${rcpt}/putaway"
              payload: {}
              as: ReceivingClerk
            - call: "POST /clients/${cli}/orders"
              payload: { ship_to_zone: 3, lines: [ { sku_id: "${sku}", qty: 1 } ] }
              as: ClientUser
              as_user_id: "${cli}"
              captures: { ord: $.data.id }
            - call: "POST /clients/${cli}/waves"
              payload: {}
              as: WavePlanner
              captures: { wv: $.data.id }
            - call: "POST /clients/${cli}/waves/${wv}/add-order"
              payload: { order_id: "${ord}" }
              as: WavePlanner
            - call: "POST /clients/${cli}/waves/${wv}/release"
              payload: {}
              as: WavePlanner
            - call: "GET /pick-tasks"
              payload: { order_id: "${ord}" }
              as: WavePlanner
              captures: { pt0: "$.data[0].id"}
            - call: "POST /clients/${cli}/pick-tasks/${pt0}/confirm"
              payload: { picked_qty: 1 }
              as: PickOperator
            - call: "POST /clients/${cli}/orders/${ord}/pack"
              payload: { cartons: [ { packed_units: 1 } ] }
              as: PackStation
          trigger:
            - call: "POST /clients/${cli}/shipments"
              payload: { order_id: "${ord}" }
              as: ShipStation
              captures: { carrier: $.data.carrier, quoted: $.data.quoted_cost_cents }
          assert:
            - "Shipment.${ord}.carrier == GROUND_ECONOMY"
            - "Shipment.${ord}.quoted_cost_cents == 413"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: order_branches_picking_to_short_vs_packed
        grounds:
          - state_machines.Order.PICKING_to_SHORT
          - state_machines.Order.PICKING_to_PACKED
          - entities.Order.fields.status
        distinguishing_aspect: |
          Order is a fork from PICKING: the SHORT branch releases the unconfirmed
          reservation and SHORT_CLOSEs pick tasks, while the PACKED branch creates
          cartons and stamps estimated_handling — divergent side-effect sets from
          the same source state on the Order entity.
        test_recipe:
          setup:
            - "Order in PICKING with 1 pick task qty 3; operator confirms only 2 of 3 then declares short"
          setup_api_calls:
            - call: "POST /clients"
              payload: { name: "ShortCo", storage_rate_per_pallet_cents: 1000, handling_rate_per_order_cents: 500, handling_rate_per_extra_unit_cents: 50 }
              as: BillingClerk
              captures: { cli: $.data.id }
            - call: "POST /clients/${cli}/skus"
              payload: { code: "SKU1", unit_volume_cc: 400, hazmat: false }
              as: ClientUser
              as_user_id: "${cli}"
              captures: { sku: $.data.id }
            - call: "POST /bins"
              payload: { location_code: "G-05", bin_type: "GENERAL", capacity_cc: 100000 }
              as: ReceivingClerk
              captures: { bin: $.data.id }
            - call: "POST /clients/${cli}/receipts"
              payload: { sku_id: "${sku}", bin_id: "${bin}", expected_qty: 10 }
              as: ReceivingClerk
              captures: { rcpt: $.data.id }
            - call: "POST /clients/${cli}/receipts/${rcpt}/receive"
              payload: { received_qty: 10 }
              as: ReceivingClerk
            - call: "POST /clients/${cli}/receipts/${rcpt}/putaway"
              payload: {}
              as: ReceivingClerk
            - call: "POST /clients/${cli}/orders"
              payload: { ship_to_zone: 2, lines: [ { sku_id: "${sku}", qty: 3 } ] }
              as: ClientUser
              as_user_id: "${cli}"
              captures: { ord: $.data.id }
            - call: "POST /clients/${cli}/waves"
              payload: {}
              as: WavePlanner
              captures: { wv: $.data.id }
            - call: "POST /clients/${cli}/waves/${wv}/add-order"
              payload: { order_id: "${ord}" }
              as: WavePlanner
            - call: "POST /clients/${cli}/waves/${wv}/release"
              payload: {}
              as: WavePlanner
            - call: "GET /pick-tasks"
              payload: { order_id: "${ord}" }
              as: WavePlanner
              captures: { pt0: "$.data[0].id"}
            - call: "POST /clients/${cli}/pick-tasks/${pt0}/confirm"
              payload: { picked_qty: 2 }
              as: PickOperator
          trigger:
            - call: "POST /clients/${cli}/orders/${ord}/short"
              payload: {}
              as: PickOperator
              captures: { st: $.data.status }
          assert:
            - "Order.${ord}.status == SHORT"
            - "InventoryLot for ${sku} in ${bin}: reserved_qty == 0 (the 1 unconfirmed reserved unit was released)"
            - "InventoryLot for ${sku} in ${bin}: available_qty == 10"

      - name: wave_branches_building_to_released_vs_cancelled
        grounds:
          - state_machines.Wave.BUILDING_to_RELEASED
          - state_machines.Wave.BUILDING_to_CANCELLED
          - entities.Wave.fields.status
        distinguishing_aspect: |
          Wave is a fork from BUILDING on a different entity than Order: RELEASE
          reserves inventory + spawns pick tasks + moves orders to PICKING, while
          CANCEL detaches member orders (wave_id := null) and leaves them IMPORTED
          — divergent side-effect sets.
        test_recipe:
          setup:
            - "BUILDING wave with one IMPORTED member order; then cancel the wave"
          setup_api_calls:
            - call: "POST /clients"
              payload: { name: "WaveCo", storage_rate_per_pallet_cents: 1000, handling_rate_per_order_cents: 500, handling_rate_per_extra_unit_cents: 50 }
              as: BillingClerk
              captures: { cli: $.data.id }
            - call: "POST /clients/${cli}/skus"
              payload: { code: "SKU1", unit_volume_cc: 400, hazmat: false }
              as: ClientUser
              as_user_id: "${cli}"
              captures: { sku: $.data.id }
            - call: "POST /clients/${cli}/orders"
              payload: { ship_to_zone: 2, lines: [ { sku_id: "${sku}", qty: 1 } ] }
              as: ClientUser
              as_user_id: "${cli}"
              captures: { ord: $.data.id }
            - call: "POST /clients/${cli}/waves"
              payload: {}
              as: WavePlanner
              captures: { wv: $.data.id }
            - call: "POST /clients/${cli}/waves/${wv}/add-order"
              payload: { order_id: "${ord}" }
              as: WavePlanner
          trigger:
            - call: "POST /clients/${cli}/waves/${wv}/cancel"
              payload: {}
              as: WavePlanner
              captures: { st: $.data.status }
          assert:
            - "Wave.${wv}.status == CANCELLED"
            - "Order.${ord}.status == IMPORTED"
            - "Order.${ord}.wave_id == null"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: ship_cascades_lot_consumption_bin_recompute_and_handling_ledger
        grounds:
          - state_machines.Order.PACKED_to_SHIPPED
          - entities.InventoryLot.fields.on_hand_qty
          - entities.Bin.fields.occupied_cc
          - entities.BillingCharge.fields.amount_cents
          - entities.Client.fields.handling_balance_cents
        distinguishing_aspect: |
          Depth-3 chain originating from Order PACKED->SHIPPED: ship -> the lot's
          on_hand_qty drops (consumption) -> that lot mutation forces the Bin's
          occupied_cc to recompute downward. A separate hop: ship -> billed_handling
          computed -> HANDLING BillingCharge posted -> Client.handling_balance_cents
          credited (each link caused by the previous one).
        test_recipe:
          setup:
            - "Client surcharge 0; SKU unit_volume_cc=400; 3 units putaway in GENERAL bin; order 3 units released, picked, packed into 1 carton, label bought"
          setup_api_calls:
            - call: "POST /clients"
              payload: { name: "Cascade", storage_rate_per_pallet_cents: 1000, handling_rate_per_order_cents: 500, handling_rate_per_extra_unit_cents: 50, handling_surcharge_per_extra_carton_cents: 0, carrier_discount_bps: 0 }
              as: BillingClerk
              captures: { cli: $.data.id }
            - call: "POST /clients/${cli}/skus"
              payload: { code: "SKU1", unit_volume_cc: 400, hazmat: false }
              as: ClientUser
              as_user_id: "${cli}"
              captures: { sku: $.data.id }
            - call: "POST /bins"
              payload: { location_code: "G-06", bin_type: "GENERAL", capacity_cc: 100000 }
              as: ReceivingClerk
              captures: { bin: $.data.id }
            - call: "POST /clients/${cli}/receipts"
              payload: { sku_id: "${sku}", bin_id: "${bin}", expected_qty: 3 }
              as: ReceivingClerk
              captures: { rcpt: $.data.id }
            - call: "POST /clients/${cli}/receipts/${rcpt}/receive"
              payload: { received_qty: 3 }
              as: ReceivingClerk
            - call: "POST /clients/${cli}/receipts/${rcpt}/putaway"
              payload: {}
              as: ReceivingClerk
            - call: "GET /inventory-lots"
              payload: { sku_id: "${sku}", bin_id: "${bin}" }
              as: ReceivingClerk
              captures: { lot: "$.data[0].id"}
            - call: "POST /clients/${cli}/orders"
              payload: { ship_to_zone: 3, lines: [ { sku_id: "${sku}", qty: 3 } ] }
              as: ClientUser
              as_user_id: "${cli}"
              captures: { ord: $.data.id }
            - call: "POST /clients/${cli}/waves"
              payload: {}
              as: WavePlanner
              captures: { wv: $.data.id }
            - call: "POST /clients/${cli}/waves/${wv}/add-order"
              payload: { order_id: "${ord}" }
              as: WavePlanner
            - call: "POST /clients/${cli}/waves/${wv}/release"
              payload: {}
              as: WavePlanner
            - call: "GET /pick-tasks"
              payload: { order_id: "${ord}" }
              as: WavePlanner
              captures: { pt0: "$.data[0].id"}
            - call: "POST /clients/${cli}/pick-tasks/${pt0}/confirm"
              payload: { picked_qty: 3 }
              as: PickOperator
            - call: "POST /clients/${cli}/orders/${ord}/pack"
              payload: { cartons: [ { packed_units: 3 } ] }
              as: PackStation
            - call: "POST /clients/${cli}/shipments"
              payload: { order_id: "${ord}" }
              as: ShipStation
              captures: { shp: $.data.id }
          trigger:
            - call: "POST /clients/${cli}/orders/${ord}/ship"
              payload: {}
              as: ShipStation
              captures: { st: $.data.status, billed: $.data.billed_handling_cents }
          assert:
            - "Order.${ord}.status == SHIPPED"
            - "InventoryLot.${lot}.on_hand_qty == 0"
            - "Bin.${bin}.occupied_cc == 0"
            - "Order.${ord}.billed_handling_cents == 600"
            - "Client.${cli}.handling_balance_cents == 600"
            - "exactly one HANDLING BillingCharge with amount_cents == 600 and source_order_id == ${ord} exists"

      - name: putaway_cascades_lot_topup_then_bin_occupancy
        grounds:
          - state_machines.Receipt.RECEIVED_to_PUTAWAY
          - entities.InventoryLot.fields.available_qty
          - entities.Bin.fields.occupied_cc
        distinguishing_aspect: |
          Depth-2 chain from a different trigger (Receipt RECEIVED->PUTAWAY):
          putaway -> InventoryLot.on_hand_qty/available_qty increase -> that lot
          mutation forces Bin.occupied_cc to recompute upward (5 units * 400 cc).
