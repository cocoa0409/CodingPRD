              as_user_id: "le-officer-1"
              captures: { svc_so: $.data.id }
          trigger:
            - call: "POST /vehicles/${veh_v1}/stolen-cases/${svc_so}/arm-slowdown"
              payload: {}
              as: EmergencyOperator
