# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index) — task_2160
# Nine §0.5 rule_ids, two instances each (18 total). Every `grounds:` entry
# resolves into SCAFFOLD.yaml §1.1–§1.7; every setup_api_calls chain drives an
# empty database into the described precondition using only §1.5 endpoints.
# Every numeric literal in an `assert:` was executed against the §1.3 formula.
# =============================================================================
scaffold_difficulty_design:

  # ==========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: quote_estimate_vs_as_run_actual_piece_price
        grounds:
          - calculations.quote_piece_price
          - entities.Quote.fields.quoted_piece_price_cents
          - entities.ProductionJob.fields.as_run_piece_price_cents
          - entities.ProductionJob.fields.price_variance_cents
          - state_machines.ProductionJob.RUNNING_to_COMPLETED
          - calculations.job_yield_accounting
        distinguishing_aspect: |
          The quoted_estimate variant prices a Quote from the nominal cycle time and the
          fixed STANDARD_YIELD_BP, while the as_run_actual variant re-prices the same Quote
          inputs from the ProductionJob's observed cycle time and first_pass_yield_bp, so
          identical commercial data yields 95 cents on the Quote and 98 cents on the Job.
        test_recipe:
          setup:
            - "Customer ACME, press P-150 at 7200 cents/hour, mold M-1 with 4 cavities, shot weight 180 g, tonnage band 120-200, pm_interval_shots 5000, tooling 2 500 000 cents, SHOP_OWNED."
            - "PressQualification for (M-1, P-150) is QUALIFIED after a 380 vs 400 parts/hour trial (9500 bp >= 9000)."
            - "Quote priced against P-150 with part_weight 32 g, cycle 38 s, cavitation 4, resin 210 cents/kg, annual_volume 120 000; ACCEPTED; PPAP APPROVED so mold M-1 is PPAP_APPROVED with approved_max_regrind_bp 2000."
            - "ResinLot L-77 of 500 kg RELEASED; job scheduled 2026-09-10T08:00Z-16:00Z on P-150, staged and RUNNING."
            - "One ProductionReport posted: 1000 shots, 25 short shots, 3800 good, 200 scrap, 36 000 g virgin, 4000 g regrind, 700 run minutes."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: PlantAdmin }
            - { call: "POST /customers", payload: { name: "Acme Controls", code: "ACME" }, as: PlantAdmin, captures: { cust_id: $.data.id } }
            - { call: "POST /presses", payload: { press_code: "P-150", tonnage: 150, shot_size_grams_max: 400, hourly_rate_cents: 7200 }, as: PlantAdmin, captures: { p150_id: $.data.id } }
            - { call: "POST /molds", payload: { mold_code: "M-1", customer_id: "${cust_id}", cavity_count: 4, shot_weight_grams: 180, required_min_tonnage: 120, required_max_tonnage: 200, pm_interval_shots: 5000, tooling_cost_cents: 2500000, ownership: "SHOP_OWNED" }, as: PlantAdmin, captures: { mold_id: $.data.id } }
            - { call: "POST /press-qualifications", payload: { mold_id: "${mold_id}", press_id: "${p150_id}" }, as: ProcessEngineer, captures: { pq_id: $.data.id } }
            - { call: "POST /press-qualifications/${pq_id}/schedule-run-at-rate", payload: { scheduled_start: "2026-09-02T08:00:00Z", scheduled_end: "2026-09-02T12:00:00Z", target_parts_per_hour: 400 }, as: ProcessEngineer }
            - { call: "POST /press-qualifications/${pq_id}/record-run-at-rate", payload: { actual_parts_per_hour: 380 }, as: QualityEngineer }
            - { call: "POST /quotes", payload: { customer_id: "${cust_id}", mold_id: "${mold_id}", part_weight_grams: 32, cycle_time_sec: 38, cavitation: 4, resin_grade: "PP-H", resin_price_cents_per_kg: 210, annual_volume: 120000 }, as: SalesEngineer, captures: { quote_id: $.data.id } }
            - { call: "POST /quotes/${quote_id}/price", payload: { press_id: "${p150_id}" }, as: SalesEngineer, captures: { quoted_price: $.data.quoted_piece_price_cents } }
            - { call: "POST /quotes/${quote_id}/submit", payload: {}, as: SalesEngineer }
            - { call: "GET /molds/${mold_id}", payload: {}, as: SalesEngineer, captures: { mold_v1: $.data.version } }
            - { call: "POST /quotes/${quote_id}/customer-decision", payload: { decision: "ACCEPT", expected_mold_version: "${mold_v1}" }, as: CustomerRep, as_user_id: "${cust_id}" }
            - { call: "POST /ppap-submissions", payload: { mold_id: "${mold_id}", quote_id: "${quote_id}", level: 3, max_regrind_bp: 2000 }, as: QualityEngineer, as_user_id: "qe-alice", captures: { ppap_id: $.data.id } }
            - { call: "POST /ppap-submissions/${ppap_id}/submit", payload: { fai_dimensional_pass: true, fai_sample_shots: 30 }, as: QualityEngineer, as_user_id: "qe-alice" }
            - { call: "POST /ppap-submissions/${ppap_id}/internal-review", payload: { decision: "ENDORSE" }, as: QualityEngineer, as_user_id: "qe-bob" }
            - { call: "GET /molds/${mold_id}", payload: {}, as: QualityEngineer, captures: { mold_v2: $.data.version } }
            - { call: "POST /ppap-submissions/${ppap_id}/customer-decision", payload: { decision: "APPROVE", expected_mold_version: "${mold_v2}" }, as: CustomerRep, as_user_id: "${cust_id}" }
            - { call: "POST /resin-lots", payload: { resin_grade: "PP-H", supplier_lot_code: "L-77", qty_kg_received: 500, moisture_bp: 120 }, as: PlantAdmin, captures: { lot_id: $.data.id } }
            - { call: "POST /resin-lots/${lot_id}/disposition", payload: { decision: "RELEASE" }, as: QualityEngineer }
            - { call: "POST /production-jobs", payload: { quote_id: "${quote_id}", planned_qty: 20000, scheduled_start: "2026-09-10T08:00:00Z", scheduled_end: "2026-09-10T16:00:00Z", press_id: "${p150_id}" }, as: ProcessEngineer, captures: { job_id: $.data.id } }
            - { call: "GET /presses/${p150_id}", payload: {}, as: ProcessEngineer, captures: { press_v: $.data.version } }
            - { call: "POST /production-jobs/${job_id}/schedule", payload: { expected_press_version: "${press_v}" }, as: ProcessEngineer }
            - { call: "POST /production-jobs/${job_id}/stage-material", payload: { resin_lot_id: "${lot_id}" }, as: ProcessEngineer }
            - { call: "POST /production-jobs/${job_id}/start", payload: {}, as: ProcessEngineer }
            - { call: "GET /production-jobs/${job_id}", payload: {}, as: ProcessEngineer, captures: { job_v: $.data.version } }
            - { call: "POST /production-reports", payload: { job_id: "${job_id}", shots: 1000, short_shot_shots: 25, good_parts: 3800, scrap_parts: 200, virgin_grams: 36000, regrind_grams: 4000, run_minutes: 700, expected_job_version: "${job_v}" }, as: ProcessEngineer }
          trigger:
            - { call: "POST /production-jobs/${job_id}/complete", payload: {}, as: ProcessEngineer }
          assert:
            - "Quote.${quote_id}.quoted_piece_price_cents == 95"
            - "Quote.${quote_id}.quoted_lot_price_cents == 94828"
            - "Quote.${quote_id}.margin_bp == 2200"
            - "ProductionJob.${job_id}.actual_cycle_time_sec == 42"
            - "ProductionJob.${job_id}.first_pass_yield_bp == 9500"
            - "ProductionJob.${job_id}.as_run_piece_price_cents == 98"
            - "ProductionJob.${job_id}.price_variance_cents == 3"
            - "ProductionJob.${job_id}.run_status == COMPLETED and ProductionJob.${job_id}.material_status == CONSUMED"

      - name: capacity_commit_strict_vs_goodwill_shortfall
        grounds:
          - calculations.capacity_commit_settlement
          - entities.CapacityCommit.fields.shortfall_policy
          - entities.CapacityCommit.fields.shortfall_fee_cents
          - entities.CapacityCommit.fields.utilization_bp
          - state_machines.CapacityCommit.OPEN_to_SETTLED
        distinguishing_aspect: |
          The dual variant here lives on CapacityCommit billing, a different entity domain
          from quote_piece_price's part pricing: two commitments with identical press,
          window, committed_minutes and zero consumption settle at 72000 cents under
          strict_shortfall and 32400 cents under goodwill_shortfall.
        test_recipe:
          setup:
            - "Customer ACME and press P-150 at 7200 cents/hour."
            - "Two OPEN CapacityCommits on P-150 for 2026-09-15T00:00Z-2026-09-16T00:00Z, each of 600 committed minutes; 1200 <= floor(1440 * 8500 / 10000) = 1224 so the availability gate passes."
            - "One commitment carries shortfall_policy STRICT, the other GOODWILL. No ProductionJob exists, so consumed_minutes is 0 for both."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: PlantAdmin }
            - { call: "POST /customers", payload: { name: "Acme Controls", code: "ACME" }, as: PlantAdmin, captures: { cust_id: $.data.id } }
            - { call: "POST /presses", payload: { press_code: "P-150", tonnage: 150, shot_size_grams_max: 400, hourly_rate_cents: 7200 }, as: PlantAdmin, captures: { p150_id: $.data.id } }
            - { call: "POST /capacity-commits", payload: { customer_id: "${cust_id}", press_id: "${p150_id}", window_start: "2026-09-15T00:00:00Z", window_end: "2026-09-16T00:00:00Z", committed_minutes: 600, shortfall_policy: "STRICT" }, as: SalesEngineer, captures: { cc_strict_id: $.data.id } }
            - { call: "POST /capacity-commits", payload: { customer_id: "${cust_id}", press_id: "${p150_id}", window_start: "2026-09-15T00:00:00Z", window_end: "2026-09-16T00:00:00Z", committed_minutes: 600, shortfall_policy: "GOODWILL" }, as: SalesEngineer, captures: { cc_good_id: $.data.id } }
          trigger:
            - { call: "POST /capacity-commits/${cc_strict_id}/settle", payload: {}, as: PlantAdmin }
            - { call: "POST /capacity-commits/${cc_good_id}/settle", payload: {}, as: PlantAdmin }
          assert:
            - "CapacityCommit.${cc_strict_id}.consumed_minutes == 0 and CapacityCommit.${cc_good_id}.consumed_minutes == 0"
            - "CapacityCommit.${cc_strict_id}.shortfall_minutes == 600 and CapacityCommit.${cc_good_id}.shortfall_minutes == 600"
            - "CapacityCommit.${cc_strict_id}.shortfall_fee_cents == 72000"
            - "CapacityCommit.${cc_good_id}.shortfall_fee_cents == 32400"
            - "CapacityCommit.${cc_strict_id}.utilization_bp == 0 and CapacityCommit.${cc_good_id}.utilization_bp == 0"
            - "CapacityCommit.${cc_strict_id}.status == SETTLED and CapacityCommit.${cc_good_id}.status == SETTLED"

  # ==========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: quote_price_tiered_margin_ownership_branch_and_price_floor
        grounds:
          - calculations.quote_piece_price
          - entities.Mold.fields.ownership
          - entities.Mold.fields.tooling_cost_cents
          - entities.Quote.fields.annual_volume
          - state_machines.Quote.DRAFT_to_PRICED
        distinguishing_aspect: |
          Mode (a): a single formula with five interacting inputs — ceil(1000 / cavitation),
          a three-band margin tier keyed on annual_volume, a conditional tooling-amortisation
          branch keyed on Mold.ownership, and a max() price floor — so the same part priced
          on a SHOP_OWNED tool costs 95 cents, on a CUSTOMER_OWNED tool 34 cents, and a
          near-zero-cost part clamps to the 12-cent MIN_PIECE_PRICE_CENTS floor.
        test_recipe:
          setup:
            - "Customer ACME and press P-150 at 7200 cents/hour."
            - "Mold M-SHOP (SHOP_OWNED, tooling 2 500 000 cents) and mold M-CUST (CUSTOMER_OWNED, tooling 2 500 000 cents), both 4 cavities, shot weight 180 g, tonnage band 120-200."
            - "Three DRAFT quotes: Q-SHOP and Q-CUST are identical except for the tool they name; Q-FLOOR is on M-CUST with part_weight 1 g, cycle 1 s, resin 1 cent/kg and annual_volume 300 000."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: PlantAdmin }
            - { call: "POST /customers", payload: { name: "Acme Controls", code: "ACME" }, as: PlantAdmin, captures: { cust_id: $.data.id } }
            - { call: "POST /presses", payload: { press_code: "P-150", tonnage: 150, shot_size_grams_max: 400, hourly_rate_cents: 7200 }, as: PlantAdmin, captures: { p150_id: $.data.id } }
            - { call: "POST /molds", payload: { mold_code: "M-SHOP", customer_id: "${cust_id}", cavity_count: 4, shot_weight_grams: 180, required_min_tonnage: 120, required_max_tonnage: 200, pm_interval_shots: 5000, tooling_cost_cents: 2500000, ownership: "SHOP_OWNED" }, as: PlantAdmin, captures: { mold_shop_id: $.data.id } }
            - { call: "POST /molds", payload: { mold_code: "M-CUST", customer_id: "${cust_id}", cavity_count: 4, shot_weight_grams: 180, required_min_tonnage: 120, required_max_tonnage: 200, pm_interval_shots: 5000, tooling_cost_cents: 2500000, ownership: "CUSTOMER_OWNED" }, as: PlantAdmin, captures: { mold_cust_id: $.data.id } }
            - { call: "POST /quotes", payload: { customer_id: "${cust_id}", mold_id: "${mold_shop_id}", part_weight_grams: 32, cycle_time_sec: 38, cavitation: 4, resin_grade: "PP-H", resin_price_cents_per_kg: 210, annual_volume: 120000 }, as: SalesEngineer, captures: { q_shop_id: $.data.id } }
            - { call: "POST /quotes", payload: { customer_id: "${cust_id}", mold_id: "${mold_cust_id}", part_weight_grams: 32, cycle_time_sec: 38, cavitation: 4, resin_grade: "PP-H", resin_price_cents_per_kg: 210, annual_volume: 120000 }, as: SalesEngineer, captures: { q_cust_id: $.data.id } }
            - { call: "POST /quotes", payload: { customer_id: "${cust_id}", mold_id: "${mold_cust_id}", part_weight_grams: 1, cycle_time_sec: 1, cavitation: 4, resin_grade: "PP-H", resin_price_cents_per_kg: 1, annual_volume: 300000 }, as: SalesEngineer, captures: { q_floor_id: $.data.id } }
          trigger:
            - { call: "POST /quotes/${q_shop_id}/price", payload: { press_id: "${p150_id}" }, as: SalesEngineer }
            - { call: "POST /quotes/${q_cust_id}/price", payload: { press_id: "${p150_id}" }, as: SalesEngineer }
            - { call: "POST /quotes/${q_floor_id}/price", payload: { press_id: "${p150_id}" }, as: SalesEngineer }
          assert:
            - "Quote.${q_shop_id}.quoted_lot_price_cents == 94828 and Quote.${q_shop_id}.quoted_piece_price_cents == 95"
            - "Quote.${q_cust_id}.quoted_lot_price_cents == 33828 and Quote.${q_cust_id}.quoted_piece_price_cents == 34"
            - "Quote.${q_floor_id}.quoted_lot_price_cents == 2669 and Quote.${q_floor_id}.quoted_piece_price_cents == 12"
            - "Quote.${q_shop_id}.margin_bp == 2200 and Quote.${q_floor_id}.margin_bp == 1600"
            - "Quote.${q_shop_id}.rate_press_id == ${p150_id} and Quote.${q_shop_id}.status == PRICED"

      - name: job_cost_roll_rounds_per_report_line_then_sums
        grounds:
          - calculations.job_cost_roll
          - entities.ProductionReport.fields.report_direct_cost_cents
          - entities.ProductionJob.fields.job_direct_cost_cents
          - entities.ProductionJob.fields.job_overhead_cents
          - entities.ProductionJob.fields.job_total_cost_cents
        distinguishing_aspect: |
          Mode (b): the rounding ORDER is the whole difficulty. Two report lines of 7 run
          minutes at 7250 cents/hour and 1500 g at 213 cents/kg each round to 1166 cents,
          summing to 2332; summing the raw minutes and grams first and rounding once yields
          2331. The scaffold pins round-per-line-then-sum, so the correct answer is 2332.
        test_recipe:
          setup:
            - "Press P-725 at 7250 cents/hour; mold M-2 with 4 cavities, pm_interval_shots 5000; quote resin price 213 cents/kg; PPAP approved with max_regrind_bp 2000."
            - "ResinLot RELEASED; job scheduled 2026-09-10T08:00Z-16:00Z, staged and RUNNING."
            - "Two ProductionReports, each 10 shots / 0 short shots / 38 good / 2 scrap / 1200 g virgin / 300 g regrind / 7 run minutes."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: PlantAdmin }
            - { call: "POST /customers", payload: { name: "Acme Controls", code: "ACME" }, as: PlantAdmin, captures: { cust_id: $.data.id } }
            - { call: "POST /presses", payload: { press_code: "P-725", tonnage: 150, shot_size_grams_max: 400, hourly_rate_cents: 7250 }, as: PlantAdmin, captures: { press_id: $.data.id } }
            - { call: "POST /molds", payload: { mold_code: "M-2", customer_id: "${cust_id}", cavity_count: 4, shot_weight_grams: 180, required_min_tonnage: 120, required_max_tonnage: 200, pm_interval_shots: 5000, tooling_cost_cents: 2500000, ownership: "SHOP_OWNED" }, as: PlantAdmin, captures: { mold_id: $.data.id } }
            - { call: "POST /press-qualifications", payload: { mold_id: "${mold_id}", press_id: "${press_id}" }, as: ProcessEngineer, captures: { pq_id: $.data.id } }
            - { call: "POST /press-qualifications/${pq_id}/schedule-run-at-rate", payload: { scheduled_start: "2026-09-02T08:00:00Z", scheduled_end: "2026-09-02T12:00:00Z", target_parts_per_hour: 400 }, as: ProcessEngineer }
            - { call: "POST /press-qualifications/${pq_id}/record-run-at-rate", payload: { actual_parts_per_hour: 380 }, as: QualityEngineer }
            - { call: "POST /quotes", payload: { customer_id: "${cust_id}", mold_id: "${mold_id}", part_weight_grams: 32, cycle_time_sec: 38, cavitation: 4, resin_grade: "PP-H", resin_price_cents_per_kg: 213, annual_volume: 120000 }, as: SalesEngineer, captures: { quote_id: $.data.id } }
            - { call: "POST /quotes/${quote_id}/price", payload: { press_id: "${press_id}" }, as: SalesEngineer }
            - { call: "POST /quotes/${quote_id}/submit", payload: {}, as: SalesEngineer }
            - { call: "GET /molds/${mold_id}", payload: {}, as: SalesEngineer, captures: { mold_v1: $.data.version } }
            - { call: "POST /quotes/${quote_id}/customer-decision", payload: { decision: "ACCEPT", expected_mold_version: "${mold_v1}" }, as: CustomerRep, as_user_id: "${cust_id}" }
            - { call: "POST /ppap-submissions", payload: { mold_id: "${mold_id}", quote_id: "${quote_id}", level: 3, max_regrind_bp: 2000 }, as: QualityEngineer, as_user_id: "qe-alice", captures: { ppap_id: $.data.id } }
            - { call: "POST /ppap-submissions/${ppap_id}/submit", payload: { fai_dimensional_pass: true, fai_sample_shots: 30 }, as: QualityEngineer, as_user_id: "qe-alice" }
            - { call: "POST /ppap-submissions/${ppap_id}/internal-review", payload: { decision: "ENDORSE" }, as: QualityEngineer, as_user_id: "qe-bob" }
            - { call: "GET /molds/${mold_id}", payload: {}, as: QualityEngineer, captures: { mold_v2: $.data.version } }
            - { call: "POST /ppap-submissions/${ppap_id}/customer-decision", payload: { decision: "APPROVE", expected_mold_version: "${mold_v2}" }, as: CustomerRep, as_user_id: "${cust_id}" }
            - { call: "POST /resin-lots", payload: { resin_grade: "PP-H", supplier_lot_code: "L-88", qty_kg_received: 500, moisture_bp: 120 }, as: PlantAdmin, captures: { lot_id: $.data.id } }
            - { call: "POST /resin-lots/${lot_id}/disposition", payload: { decision: "RELEASE" }, as: QualityEngineer }
            - { call: "POST /production-jobs", payload: { quote_id: "${quote_id}", planned_qty: 40, scheduled_start: "2026-09-10T08:00:00Z", scheduled_end: "2026-09-10T16:00:00Z", press_id: "${press_id}" }, as: ProcessEngineer, captures: { job_id: $.data.id } }
            - { call: "GET /presses/${press_id}", payload: {}, as: ProcessEngineer, captures: { press_v: $.data.version } }
            - { call: "POST /production-jobs/${job_id}/schedule", payload: { expected_press_version: "${press_v}" }, as: ProcessEngineer }
            - { call: "POST /production-jobs/${job_id}/stage-material", payload: { resin_lot_id: "${lot_id}" }, as: ProcessEngineer }
            - { call: "POST /production-jobs/${job_id}/start", payload: {}, as: ProcessEngineer }
            - { call: "GET /production-jobs/${job_id}", payload: {}, as: ProcessEngineer, captures: { job_v1: $.data.version } }
          trigger:
            - { call: "POST /production-reports", payload: { job_id: "${job_id}", shots: 10, short_shot_shots: 0, good_parts: 38, scrap_parts: 2, virgin_grams: 1200, regrind_grams: 300, run_minutes: 7, expected_job_version: "${job_v1}" }, as: ProcessEngineer, captures: { rep1_id: $.data.id, rep1_cost: $.data.report_direct_cost_cents } }
            - { call: "GET /production-jobs/${job_id}", payload: {}, as: ProcessEngineer, captures: { job_v2: $.data.version } }
            - { call: "POST /production-reports", payload: { job_id: "${job_id}", shots: 10, short_shot_shots: 0, good_parts: 38, scrap_parts: 2, virgin_grams: 1200, regrind_grams: 300, run_minutes: 7, expected_job_version: "${job_v2}" }, as: ProcessEngineer, captures: { rep2_id: $.data.id } }
          assert:
            - "ProductionReport.${rep1_id}.report_direct_cost_cents == 1166"
            - "ProductionReport.${rep2_id}.report_direct_cost_cents == 1166"
            - "ProductionJob.${job_id}.job_direct_cost_cents == 2332"
            - "ProductionJob.${job_id}.job_direct_cost_cents != 2331"
            - "ProductionJob.${job_id}.job_overhead_cents == 816"
            - "ProductionJob.${job_id}.job_total_cost_cents == 3148"
            - "ProductionJob.${job_id}.cumulative_regrind_bp == 2000"

  # ==========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: production_job_parallel_axes_with_blocked_cycle
        grounds:
          - state_machines.ProductionJob.SCHEDULED_to_BLOCKED
          - state_machines.ProductionJob.BLOCKED_to_SCHEDULED
          - state_machines.ProductionJob.UNSTAGED_to_STAGED
          - state_machines.ProductionJob.STAGED_to_UNSTAGED
          - entities.ProductionJob.fields.run_status
          - entities.ProductionJob.fields.material_status
          - calculations.press_capacity_ledger
        distinguishing_aspect: |
          ProductionJob is non-linear in two ways at once: run_status runs the cycle
          SCHEDULED -> BLOCKED -> SCHEDULED, and material_status is a genuinely independent
          second axis, proven by re-staging while run_status stays SCHEDULED and by the
          quarantine cascade moving STAGED -> UNSTAGED without touching CANCELLED.
        test_recipe:
          setup:
            - "Mold M-1 PPAP_APPROVED on press P-150; ResinLot L-77 RELEASED."
            - "Job scheduled 2026-09-10T08:00Z-16:00Z (480 minutes) and staged: run_status SCHEDULED, material_status STAGED, Press.committed_minutes_scheduled 480."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: PlantAdmin }
            - { call: "POST /customers", payload: { name: "Acme Controls", code: "ACME" }, as: PlantAdmin, captures: { cust_id: $.data.id } }
            - { call: "POST /presses", payload: { press_code: "P-150", tonnage: 150, shot_size_grams_max: 400, hourly_rate_cents: 7200 }, as: PlantAdmin, captures: { p150_id: $.data.id } }
            - { call: "POST /molds", payload: { mold_code: "M-1", customer_id: "${cust_id}", cavity_count: 4, shot_weight_grams: 180, required_min_tonnage: 120, required_max_tonnage: 200, pm_interval_shots: 5000, tooling_cost_cents: 2500000, ownership: "SHOP_OWNED" }, as: PlantAdmin, captures: { mold_id: $.data.id } }
            - { call: "POST /press-qualifications", payload: { mold_id: "${mold_id}", press_id: "${p150_id}" }, as: ProcessEngineer, captures: { pq_id: $.data.id } }
            - { call: "POST /press-qualifications/${pq_id}/schedule-run-at-rate", payload: { scheduled_start: "2026-09-02T08:00:00Z", scheduled_end: "2026-09-02T12:00:00Z", target_parts_per_hour: 400 }, as: ProcessEngineer }
