              as: Coordinator
            - call: "GET /library/items/${item_id}"
              payload: {}
              as: Coordinator
              captures: { iv: $.data.version }
            - call: "POST /library/loans"
              payload: { member_id: "${m1}", copy_id: "${copy_id}", expected_item_version: "${iv}" }
              as: Coordinator
              captures: { loan_id: $.data.id }
          trigger:
            - call: "POST /library/reservations"
              payload: { member_id: "${m2}", item_id: "${item_id}", window_start: "2026-04-01T00:00:00Z", window_end: "2026-04-03T00:00:00Z" }
              as: Member
              as_user_id: "${m2}"
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_NO_COPY_AVAILABLE"

  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: checkout_depends_on_member_active
        grounds:
          - state_machines.Member.ACTIVE_to_EXPIRED
          - validations[priority=6]
          - errors[ERR_MEMBER_NOT_ACTIVE]
        distinguishing_aspect: |
          Entity pair Loan<-Member: the Loan checkout transition is gated on Member.status.
          With the member EXPIRED (membership_expires_at passed, ops-run applied), checkout
          is rejected with ERR_MEMBER_NOT_ACTIVE even though the copy is AVAILABLE and GOOD.
        test_recipe:
          setup:
            - "Member with membership_expires_at=2026-03-05; clock advanced to 2026-03-06 and ops-run marks the member EXPIRED; item has one AVAILABLE GOOD copy."
          setup_api_calls:
            - call: "POST /library/members"
              payload: { name: "Ora", email: "ora@x.com", tier: "BASIC", membership_expires_at: "2026-03-05T00:00:00Z" }
              as: Coordinator
              captures: { m_id: $.data.id }
            - call: "POST /library/items"
              payload: { name: "Grill", category: "OUTDOOR", replacement_value_cents: 9000, loan_period_days: 7, daily_late_fee_cents: 100 }
              as: Coordinator
              captures: { item_id: $.data.id }
            - call: "POST /library/items/${item_id}/copies"
              payload: { asset_tag: "G-1", acquired_on: "2025-01-01T00:00:00Z" }
              as: Coordinator
              captures: { copy_id: $.data.id }
            - call: "POST /library/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-06T00:00:00Z" }
              as: Coordinator
            - call: "POST /library/_ops/run"
              payload: {}
              as: Coordinator
            - call: "GET /library/items/${item_id}"
              payload: {}
              as: Coordinator
              captures: { iv: $.data.version }
          trigger:
            - call: "POST /library/loans"
              payload: { member_id: "${m_id}", copy_id: "${copy_id}", expected_item_version: "${iv}" }
              as: Coordinator
              captures: { err: $.data.error_id }
          assert:
            - "Member.${m_id}.status == EXPIRED"
            - "response.data.error_id == ERR_MEMBER_NOT_ACTIVE"

      - name: reserve_depends_on_copy_condition
        grounds:
          - state_machines.ItemCopy.GOOD_to_NEEDS_MAINTENANCE
          - validations[priority=11]
          - errors[ERR_NO_COPY_AVAILABLE]
        distinguishing_aspect: |
          Entity pair Reservation<-ItemCopy: reserve is gated on the copy's condition axis.
          With the item's only copy NEEDS_MAINTENANCE (not GOOD), the free-copy set is empty
          and POST /library/reservations returns ERR_NO_COPY_AVAILABLE.
        test_recipe:
          setup:
            - "ACTIVE member; item with one copy driven to NEEDS_MAINTENANCE by a manual ticket; clock 2026-03-01."
          setup_api_calls:
            - call: "POST /library/members"
              payload: { name: "Pat", email: "pat@x.com", tier: "BASIC" }
              as: Coordinator
              captures: { m_id: $.data.id }
            - call: "POST /library/items"
              payload: { name: "Pump", category: "TOOL", replacement_value_cents: 5000, loan_period_days: 7, daily_late_fee_cents: 100 }
              as: Coordinator
              captures: { item_id: $.data.id }
            - call: "POST /library/items/${item_id}/copies"
              payload: { asset_tag: "P-1", acquired_on: "2025-01-01T00:00:00Z" }
              as: Coordinator
              captures: { copy_id: $.data.id }
            - call: "POST /library/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: Coordinator
            - call: "POST /library/maintenance-tickets"
              payload: { copy_id: "${copy_id}", reason: "ROUTINE" }
              as: Coordinator
              captures: { ticket_id: $.data.id }
          trigger:
            - call: "POST /library/reservations"
              payload: { member_id: "${m_id}", item_id: "${item_id}", window_start: "2026-04-01T00:00:00Z", window_end: "2026-04-03T00:00:00Z" }
              as: Member
              as_user_id: "${m_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_NO_COPY_AVAILABLE"

  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: reservation_window_aggregate_capacity_overlap
        grounds:
          - validations[priority=9]
          - errors[ERR_ITEM_NO_CAPACITY_FOR_WINDOW]
          - calculations.item_availability
        distinguishing_aspect: |
          Resource=Item, half-open aggregate-capacity semantics: with 1 serviceable copy, a
          reservation for [2026-03-10,2026-03-15) overlapping an existing [2026-03-08,2026-03-12)
          exceeds capacity 1 and is rejected ERR_ITEM_NO_CAPACITY_FOR_WINDOW; the interval is
          half-open so an adjacent [2026-03-12,2026-03-14) would be accepted.
        test_recipe:
          setup:
            - "Two ACTIVE members; item with exactly one serviceable copy; clock 2026-03-01; member1 holds a PENDING reservation for [2026-03-08,2026-03-12)."
          setup_api_calls:
            - call: "POST /library/members"
              payload: { name: "Qui", email: "qui@x.com", tier: "BASIC" }
              as: Coordinator
              captures: { m1: $.data.id }
            - call: "POST /library/members"
              payload: { name: "Rae", email: "rae@x.com", tier: "BASIC" }
              as: Coordinator
              captures: { m2: $.data.id }
            - call: "POST /library/items"
              payload: { name: "Canoe", category: "OUTDOOR", replacement_value_cents: 40000, loan_period_days: 3, daily_late_fee_cents: 200 }
              as: Coordinator
              captures: { item_id: $.data.id }
            - call: "POST /library/items/${item_id}/copies"
              payload: { asset_tag: "C-1", acquired_on: "2025-01-01T00:00:00Z" }
              as: Coordinator
              captures: { copy_id: $.data.id }
            - call: "POST /library/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: Coordinator
            - call: "POST /library/reservations"
              payload: { member_id: "${m1}", item_id: "${item_id}", window_start: "2026-03-08T00:00:00Z", window_end: "2026-03-12T00:00:00Z" }
              as: Member
              as_user_id: "${m1}"
              captures: { res1: $.data.id }
          trigger:
            - call: "POST /library/reservations"
              payload: { member_id: "${m2}", item_id: "${item_id}", window_start: "2026-03-10T00:00:00Z", window_end: "2026-03-15T00:00:00Z" }
              as: Member
              as_user_id: "${m2}"
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_ITEM_NO_CAPACITY_FOR_WINDOW"
            - "Reservation.${res1}.status == PENDING"

      - name: maintenance_window_overlaps_loan_with_buffer
        grounds:
          - validations[priority=10]
          - errors[ERR_MAINTENANCE_WINDOW_CONFLICT]
          - entities.MaintenanceTicket.fields.scheduled_start
        distinguishing_aspect: |
          Resource=ItemCopy, closed-interval-plus-buffer semantics: a maintenance window
          [2026-03-09,2026-03-11] is rejected because the copy's active loan period
          [2026-03-01,2026-03-08] widened by BUFFER_DAYS=1 reaches 2026-03-09 and overlaps
          — ERR_MAINTENANCE_WINDOW_CONFLICT.
        test_recipe:
          setup:
            - "ACTIVE member; item with one copy; clock 2026-03-01; copy checked out (active loan period ends 2026-03-08)."
          setup_api_calls:
            - call: "POST /library/members"
              payload: { name: "Sam", email: "sam@x.com", tier: "BASIC" }
              as: Coordinator
              captures: { m_id: $.data.id }
            - call: "POST /library/items"
              payload: { name: "Jack", category: "TOOL", replacement_value_cents: 6000, loan_period_days: 7, daily_late_fee_cents: 100 }
              as: Coordinator
              captures: { item_id: $.data.id }
            - call: "POST /library/items/${item_id}/copies"
              payload: { asset_tag: "J-1", acquired_on: "2025-01-01T00:00:00Z" }
              as: Coordinator
              captures: { copy_id: $.data.id }
            - call: "POST /library/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: Coordinator
            - call: "GET /library/items/${item_id}"
              payload: {}
              as: Coordinator
              captures: { iv: $.data.version }
            - call: "POST /library/loans"
              payload: { member_id: "${m_id}", copy_id: "${copy_id}", expected_item_version: "${iv}" }
              as: Coordinator
              captures: { loan_id: $.data.id }
          trigger:
            - call: "POST /library/maintenance-tickets"
              payload: { copy_id: "${copy_id}", reason: "ROUTINE", scheduled_start: "2026-03-09T00:00:00Z", scheduled_end: "2026-03-11T00:00:00Z" }
              as: Coordinator
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_MAINTENANCE_WINDOW_CONFLICT"

  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: copy_partition_conserved_across_checkout_return
        grounds:
          - calculations.item_availability
          - state_machines.ItemCopy.AVAILABLE_to_ON_LOAN
          - state_machines.ItemCopy.ON_LOAN_to_AVAILABLE
        distinguishing_aspect: |
          Conserved quantity = copy partition sum: available_copies_count + reserved_count +
          on_loan_count + maintenance_count == serviceable_copies_count == 1 both before and
          after a checkout+GOOD-return pair; the counts return to available=1, on_loan=0.
        test_recipe:
          setup:
            - "ACTIVE member; item with exactly one GOOD copy (serviceable_copies_count=1, available_copies_count=1); clock 2026-03-01; copy checked out."
          setup_api_calls:
            - call: "POST /library/members"
              payload: { name: "Tia", email: "tia@x.com", tier: "BASIC" }
              as: Coordinator
              captures: { m_id: $.data.id }
            - call: "POST /library/items"
              payload: { name: "Hoe", category: "OUTDOOR", replacement_value_cents: 3000, loan_period_days: 7, daily_late_fee_cents: 100 }
              as: Coordinator
              captures: { item_id: $.data.id }
            - call: "POST /library/items/${item_id}/copies"
              payload: { asset_tag: "H-1", acquired_on: "2025-01-01T00:00:00Z" }
              as: Coordinator
              captures: { copy_id: $.data.id }
            - call: "POST /library/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: Coordinator
            - call: "GET /library/items/${item_id}"
              payload: {}
              as: Coordinator
              captures: { iv: $.data.version }
            - call: "POST /library/loans"
              payload: { member_id: "${m_id}", copy_id: "${copy_id}", expected_item_version: "${iv}" }
              as: Coordinator
              captures: { loan_id: $.data.id }
          trigger:
            - call: "POST /library/loans/${loan_id}/return"
              payload: { return_condition: "GOOD" }
              as: Coordinator
          assert:
            - "Item.${item_id}.serviceable_copies_count == 1"
            - "Item.${item_id}.available_copies_count == 1"
            - "Item.${item_id}.on_loan_count == 0"
            - "Item.${item_id}.reserved_count == 0"
            - "Item.${item_id}.maintenance_count == 0"

      - name: member_ledger_conserved_across_assess_waive
        grounds:
          - calculations.member_ledger
          - state_machines.Fee.PENDING_to_WAIVED
          - entities.Member.fields.total_assessed_cents
          - entities.Member.fields.total_waived_cents
        distinguishing_aspect: |
          Conserved quantity = money (total_assessed_cents): assessing a 1500 DAMAGE fee then
          waiving it leaves total_assessed_cents==1500 while outstanding_balance_cents returns
          to 0 and total_waived_cents==1500 (the charge moved from outstanding to waived, not
          erased).
        test_recipe:
          setup:
            - "ACTIVE member; item; one copy; clock 2026-03-13; copy checked out same-day then returned MINOR_DAMAGE producing a PENDING 1500 DAMAGE fee (outstanding=1500, total_assessed=1500)."
          setup_api_calls:
            - call: "POST /library/members"
              payload: { name: "Uma", email: "uma@x.com", tier: "BASIC" }
              as: Coordinator
              captures: { m_id: $.data.id }
            - call: "POST /library/items"
              payload: { name: "Peeler", category: "KITCHEN", replacement_value_cents: 20000, loan_period_days: 14, daily_late_fee_cents: 50 }
              as: Coordinator
              captures: { item_id: $.data.id }
            - call: "POST /library/items/${item_id}/copies"
              payload: { asset_tag: "PE-1", acquired_on: "2025-06-01T00:00:00Z" }
              as: Coordinator
              captures: { copy_id: $.data.id }
            - call: "POST /library/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-13T00:00:00Z" }
              as: Coordinator
            - call: "GET /library/items/${item_id}"
              payload: {}
              as: Coordinator
              captures: { iv: $.data.version }
            - call: "POST /library/loans"
              payload: { member_id: "${m_id}", copy_id: "${copy_id}", expected_item_version: "${iv}" }
              as: Coordinator
              captures: { loan_id: $.data.id }
            - call: "POST /library/loans/${loan_id}/return"
              payload: { return_condition: "MINOR_DAMAGE" }
              as: Coordinator
            - call: "GET /library/fees"
              payload: { loan_id: "${loan_id}" }
              as: Coordinator
              captures: { fee_id: "$.data[0].id" }
          trigger:
            - call: "POST /library/fees/${fee_id}/waive"
              payload: { reason: "goodwill" }
              as: Coordinator
          assert:
            - "Fee.${fee_id}.status == WAIVED"
            - "Member.${m_id}.outstanding_balance_cents == 0"
            - "Member.${m_id}.total_waived_cents == 1500"
            - "Member.${m_id}.total_assessed_cents == 1500"
