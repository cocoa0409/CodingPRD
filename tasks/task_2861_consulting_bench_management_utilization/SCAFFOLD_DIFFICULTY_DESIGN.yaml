          assert:
            - "before the trigger: PracticeGroup.${pg_id}.bench_headcount == 0, own_bench_ratio == 0.0000, posture == OPEN and PracticeGroup.${pgp_id}.rollup_bench_ratio == 0.0000, posture == OPEN"
            - "hop 1: Assignment.${a1_id}.status == RELEASED and released_on == 2026-08-10"
