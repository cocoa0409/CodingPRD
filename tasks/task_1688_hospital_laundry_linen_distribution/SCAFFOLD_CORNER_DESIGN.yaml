            - { call: "POST /linen-stocks", payload: { facility_id: "${fac}", sku: "SHEET-T", display_name: "Flat Sheet", category: "FLATWORK", piece_weight_lbs: 2.00, unit_cost_cents: 500, max_wash_cycles: 5, reorder_point_pieces: 5, opening_pieces: 50, opening_reserve_pieces: 10 }, as: LinenManager, as_user_id: "lm-1", captures: { s1: $.data.id } }
