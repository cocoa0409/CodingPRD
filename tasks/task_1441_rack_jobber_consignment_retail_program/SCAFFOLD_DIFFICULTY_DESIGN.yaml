      - name: scan_match_reorder_cascade
        grounds: [state_machines.ScanEvent, calculations.restock_suggested_quantity, entities.ServiceVisit.fields.auto_restock_flag]
        distinguishing_aspect: |
          Depth-2 chain originating at scan ingest (a different trigger than audit
