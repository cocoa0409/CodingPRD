          All five dispatch codes hang off two endpoints and are separated only
          by which crew or which window is offered, so they are probed on one
          APPLIANCE agreement: a zero-length window is a 400, an out-of-store
          crew and an INACTIVE crew are both priority-35 422s with distinct
          codes, an uncertified crew on a DELIVERY_SETUP appliance is a
          priority-36 422, and completing an appliance delivery without setup is
