            - "http_status == 409"

      - name: pickup_fiscal_beats_temporal
        grounds:
          - validations[priority=11]
          - validations[priority=14]
          - errors[ERR_PICKUP_VALUE_EXCEEDS_INSURANCE]
          - errors[ERR_CONCIERGE_UNAVAILABLE]
        distinguishing_aspect: "A schedule-pickup request violating BOTH business_fiscal (declared_value 6000000 > cap 5000000, priority 11) and business_temporal (concierge C1 busy within buffer, priority 14) returns ERR_PICKUP_VALUE_EXCEEDS_INSURANCE — fiscal outranks temporal (pair: business_fiscal vs business_temporal, distinct from the state/temporal pair)."
        test_recipe:
          setup:
            - "HANDBAGS cap 5000000; concierge C1, vehicles V1 (busy) and V2 (free); a prior pickup on C1+V1 [2026-03-05T10:00,11:00); a high-value PICKUP item declared 6000000."
          setup_api_calls:
