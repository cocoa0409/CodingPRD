          assert:
            - "err == ERR_FORBIDDEN with http 403 — ${sp2_id} cannot countersign ${sp1_id}'s contract"
            - "SponsorshipContract.${c_id}.contract_status == PROPOSED (unchanged)"

      - name: countersign_stale_version_returns_412
        claim_type: violation_to_error
        grounds: ["concurrency_rules[contract-countersign-stale-version]", "errors[ERR_STALE_CONTRACT_VERSION]"]
        distinguishing_aspect: "OCC: after REVISE + PATCH bumped the contract past the sponsor's observed version, countersign with the stale version fails 412 ERR_STALE_CONTRACT_VERSION; retrying with the fresh version succeeds."
        test_recipe:
          setup: ["Venue V; ACTIVE sponsor S; contract C PROPOSED (v observed by sponsor), then REVISE -> PATCH fee -> PROPOSE (version advanced twice beyond observed)"]
          setup_api_calls:
            - { call: "POST /venues", payload: { display_name: "Vector Arena", city: "Austin" }, as: VenueAdmin, captures: { v_id: $.data.id } }
            - { call: "POST /sponsors", payload: { legal_name: "FizzCo Beverages LLC", display_name: "FizzCo", industry_category: "BEVERAGE" }, as: SponsorshipSales, captures: { sp_id: $.data.id } }
            - { call: "POST /sponsors/${sp_id}/transition", payload: { action: "QUALIFY" }, as: SponsorshipSales }
            - { call: "POST /contracts", payload: { venue_id: "${v_id}", sponsor_id: "${sp_id}", title: "Naming", term_first_season: 2026, term_last_season: 2028, base_fee_cents: 10000000, escalator_pct: 0.03, escalator_mode: "COMPOUND" }, as: SponsorshipSales, captures: { c_id: $.data.id } }
            - { call: "POST /contracts/${c_id}/transition", payload: { action: "PROPOSE" }, as: SponsorshipSales, captures: { c_v_stale: $.data.version } }
            - { call: "POST /contracts/${c_id}/transition", payload: { action: "REVISE" }, as: SponsorshipSales }
            - { call: "PATCH /contracts/${c_id}", payload: { base_fee_cents: 11000000 }, as: SponsorshipSales }
            - { call: "POST /contracts/${c_id}/transition", payload: { action: "PROPOSE" }, as: SponsorshipSales, captures: { c_v_fresh: $.data.version } }
