scaffold_difficulty_design:
  # ------------------------------------------------------------------
  # Rule 1: dual_variant_calc — three instances, three entity domains
  # ------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: travel_estimate_dispatch_vs_commit
        grounds:
          - calculations.travel_time_estimate
          - entities.DispatchOffer.fields.estimated_travel_minutes
          - entities.TransportRequest.fields.committed_eta_minutes
        distinguishing_aspect: |
          Same route and legs produce DispatchOffer.estimated_travel_minutes == 19 under the
          dispatch variant but TransportRequest.committed_eta_minutes == 21 under the commit
          variant, because commit adds 2 x min(in-transit count, 5) and exactly one other trip
          is IN_TRANSIT at accept time — a travel-domain dual variant.
        test_recipe:
          setup:
            - "Locations HUB, W4(WARD), IMG(IMAGING); edges HUB->W4 base 8, W4->IMG base 10/airborne 16"
            - "T1 certified WHEELCHAIR, ON_SHIFT; T2 uncertified porter, ON_SHIFT; both home HUB with covering shifts"
            - "One WHEELCHAIR asset WC-001 at W4"
            - "R0 (PORTER_ONLY, W4->IMG) already IN_TRANSIT with T2, so in-transit count == 1"
            - "R1 (WHEELCHAIR, W4->IMG, ROUTINE) QUEUED; clock pinned at 2026-08-01T00:00:00Z"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: TransportSupervisor }
            - { call: "POST /transport/locations", payload: { code: "HUB", name: "Transport Hub", location_type: "OTHER", zone_code: "Z1" }, as: TransportSupervisor, captures: { loc_h: $.data.id } }
            - { call: "POST /transport/locations", payload: { code: "W4", name: "Ward 4", location_type: "WARD", zone_code: "Z1" }, as: TransportSupervisor, captures: { loc_a: $.data.id } }
            - { call: "POST /transport/locations", payload: { code: "IMG", name: "Imaging", location_type: "IMAGING", zone_code: "Z2" }, as: TransportSupervisor, captures: { loc_b: $.data.id } }
            - { call: "POST /transport/travel-edges", payload: { from_location_id: "${loc_h}", to_location_id: "${loc_a}", base_minutes: 8, airborne_minutes: 12 }, as: TransportSupervisor }
            - { call: "POST /transport/travel-edges", payload: { from_location_id: "${loc_a}", to_location_id: "${loc_b}", base_minutes: 10, airborne_minutes: 16 }, as: TransportSupervisor }
            - { call: "POST /transport/transporters", payload: { name: "T One", home_location_id: "${loc_h}", certified_equipment: ["WHEELCHAIR"] }, as: TransportSupervisor, captures: { t1: $.data.id } }
            - { call: "POST /transport/transporters", payload: { name: "T Two", home_location_id: "${loc_h}" }, as: TransportSupervisor, captures: { t2: $.data.id } }
            - { call: "POST /transport/staffing-shifts", payload: { transporter_id: "${t1}", shift_start: "2026-07-31T00:00:00Z", shift_end: "2026-09-01T00:00:00Z" }, as: TransportSupervisor }
            - { call: "POST /transport/staffing-shifts", payload: { transporter_id: "${t2}", shift_start: "2026-07-31T00:00:00Z", shift_end: "2026-09-01T00:00:00Z" }, as: TransportSupervisor }
            - { call: "POST /transport/transporters/${t1}/set-status", payload: { status: "ON_SHIFT" }, as: Transporter, as_user_id: "${t1}" }
            - { call: "POST /transport/transporters/${t2}/set-status", payload: { status: "ON_SHIFT" }, as: Transporter, as_user_id: "${t2}" }
            - { call: "POST /transport/equipment-assets", payload: { asset_tag: "WC-001", equipment_type: "WHEELCHAIR", current_location_id: "${loc_a}" }, as: TransportSupervisor }
            - { call: "POST /transport/requests", payload: { patient_ref: "P0", origin_location_id: "${loc_a}", destination_location_id: "${loc_b}", priority: "ROUTINE", required_equipment: "PORTER_ONLY" }, as: RequestingClinician, as_user_id: "clin-1", captures: { r0: $.data.id, r0_v: $.data.version } }
            - { call: "POST /transport/requests/${r0}/offers", payload: { transporter_id: "${t2}", expected_request_version: "${r0_v}" }, as: TransportDispatcher, captures: { o0: $.data.id } }
            - { call: "POST /transport/dispatch-offers/${o0}/respond", payload: { decision: "ACCEPT" }, as: Transporter, as_user_id: "${t2}" }
            - { call: "POST /transport/requests/${r0}/trip-events", payload: { event: "ARRIVE_PICKUP" }, as: Transporter, as_user_id: "${t2}" }
            - { call: "POST /transport/requests/${r0}/trip-events", payload: { event: "PICKUP" }, as: Transporter, as_user_id: "${t2}" }
            - { call: "POST /transport/requests", payload: { patient_ref: "P1", origin_location_id: "${loc_a}", destination_location_id: "${loc_b}", priority: "ROUTINE", required_equipment: "WHEELCHAIR" }, as: RequestingClinician, as_user_id: "clin-1", captures: { r1: $.data.id, r1_v: $.data.version } }
            - { call: "POST /transport/requests/${r1}/offers", payload: { transporter_id: "${t1}", expected_request_version: "${r1_v}" }, as: TransportDispatcher, captures: { o1: $.data.id, o1_est: $.data.estimated_travel_minutes } }
          trigger:
            - { call: "POST /transport/dispatch-offers/${o1}/respond", payload: { decision: "ACCEPT" }, as: Transporter, as_user_id: "${t1}" }
            - { call: "GET /transport/requests/${r1}", as: TransportDispatcher, captures: { r1_eta: $.data.committed_eta_minutes } }
          assert:
            - "DispatchOffer.${o1}.estimated_travel_minutes == 19 (deadhead 8 + ceil(10 x 1.1) = 11)"
            - "TransportRequest.${r1}.committed_eta_minutes == 21 (19 + 2 x min(1, 5))"
            - "TransportRequest.${r1}.status == ASSIGNED"

      - name: staffing_required_forecast_vs_replay
        grounds:
          - calculations.staffing_requirement
          - entities.DemandCurve.fields.expected_requests
        distinguishing_aspect: |
          Same window (WEEKDAY blocks 9-10) yields required_transporters == 13 under the FORECAST
          variant (configured demand rows) but 0 under the REPLAY variant (no completions in the
          trailing 24h) — a staffing-domain dual variant, distinct from the travel domain.
        test_recipe:
          setup:
            - "DemandCurve rows: (WEEKDAY,9,STAT,2,30), (WEEKDAY,9,URGENT,4,40), (WEEKDAY,9,ROUTINE,5,58), (WEEKDAY,10,STAT,1,30), (WEEKDAY,10,URGENT,1,40), (WEEKDAY,10,ROUTINE,2,67)"
            - "h9 load = 2*30+4*40+5*58 = 510 -> ceil(510/60) = 9; h10 load = 1*30+1*40+2*67 = 204 -> ceil(204/60) = 4"
            - "3 transporters each with a PLANNED shift 2026-08-03T08:00-12:00 covering blocks 9 and 10"
            - "2026-08-03 is a Monday (WEEKDAY); clock at 2026-08-03T12:00:00Z; zero completed requests exist"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T12:00:00Z" }, as: TransportSupervisor }
            - { call: "POST /transport/locations", payload: { code: "HUB", name: "Transport Hub", location_type: "OTHER", zone_code: "Z1" }, as: TransportSupervisor, captures: { loc_h: $.data.id } }
            - { call: "POST /transport/demand-curves", payload: { day_type: "WEEKDAY", hour_block: 9, priority: "STAT", expected_requests: 2, mean_service_minutes: 30 }, as: TransportSupervisor }
            - { call: "POST /transport/demand-curves", payload: { day_type: "WEEKDAY", hour_block: 9, priority: "URGENT", expected_requests: 4, mean_service_minutes: 40 }, as: TransportSupervisor }
            - { call: "POST /transport/demand-curves", payload: { day_type: "WEEKDAY", hour_block: 9, priority: "ROUTINE", expected_requests: 5, mean_service_minutes: 58 }, as: TransportSupervisor }
            - { call: "POST /transport/demand-curves", payload: { day_type: "WEEKDAY", hour_block: 10, priority: "STAT", expected_requests: 1, mean_service_minutes: 30 }, as: TransportSupervisor }
            - { call: "POST /transport/demand-curves", payload: { day_type: "WEEKDAY", hour_block: 10, priority: "URGENT", expected_requests: 1, mean_service_minutes: 40 }, as: TransportSupervisor }
            - { call: "POST /transport/demand-curves", payload: { day_type: "WEEKDAY", hour_block: 10, priority: "ROUTINE", expected_requests: 2, mean_service_minutes: 67 }, as: TransportSupervisor }
            - { call: "POST /transport/transporters", payload: { name: "T A", home_location_id: "${loc_h}" }, as: TransportSupervisor, captures: { ta: $.data.id } }
            - { call: "POST /transport/transporters", payload: { name: "T B", home_location_id: "${loc_h}" }, as: TransportSupervisor, captures: { tb: $.data.id } }
            - { call: "POST /transport/transporters", payload: { name: "T C", home_location_id: "${loc_h}" }, as: TransportSupervisor, captures: { tc: $.data.id } }
            - { call: "POST /transport/staffing-shifts", payload: { transporter_id: "${ta}", shift_start: "2026-08-03T08:00:00Z", shift_end: "2026-08-03T12:00:00Z" }, as: TransportSupervisor }
            - { call: "POST /transport/staffing-shifts", payload: { transporter_id: "${tb}", shift_start: "2026-08-03T08:00:00Z", shift_end: "2026-08-03T12:00:00Z" }, as: TransportSupervisor }
            - { call: "POST /transport/staffing-shifts", payload: { transporter_id: "${tc}", shift_start: "2026-08-03T08:00:00Z", shift_end: "2026-08-03T12:00:00Z" }, as: TransportSupervisor }
          trigger:
            - { call: "GET /transport/staffing/adequacy", payload: { date: "2026-08-03", hour_block: 9, window_hours: 2, variant: "FORECAST" }, as: TransportSupervisor, captures: { req_f: $.data.required_transporters, sch_f: $.data.scheduled_transporters, gap_f: $.data.gap } }
            - { call: "GET /transport/staffing/adequacy", payload: { date: "2026-08-03", hour_block: 9, window_hours: 2, variant: "REPLAY" }, as: TransportSupervisor, captures: { req_r: $.data.required_transporters, sch_r: $.data.scheduled_transporters, gap_r: $.data.gap } }
          assert:
            - "FORECAST required_transporters == 13 (per-block ceil 9 + 4)"
            - "FORECAST scheduled_transporters == 3 and gap == -10"
            - "REPLAY required_transporters == 0 (no completions in trailing 24h) and gap == 3"

      - name: delay_impact_attributed_vs_cascade
        grounds:
          - calculations.delay_impact
          - entities.DelayRecord.fields.delay_minutes
          - entities.DelayRecord.fields.impact_minutes
        distinguishing_aspect: |
          One late completion to an OR destination yields DelayRecord.delay_minutes == 20 (attributed
          variant) but impact_minutes == 40 (cascade variant, OR multiplier 2.0) on the same record —
          a delay-domain dual variant, distinct from travel and staffing.
        test_recipe:
          setup:
            - "Locations HUB, W4(WARD), OR1(OR); edges HUB->W4 8/12, W4->OR1 10/16"
            - "T1 certified STRETCHER, ON_SHIFT with covering shift; asset ST-001 STRETCHER at W4"
            - "Request URGENT STRETCHER W4->OR1 with appointment_deadline 2026-08-01T00:30:00Z, created 2026-08-01T00:00:00Z"
            - "Accepted by T1; ARRIVE at 00:10 (response 10 <= 45, no SLA breach); PICKUP; clock advanced to 00:50"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: TransportSupervisor }
            - { call: "POST /transport/locations", payload: { code: "HUB", name: "Hub", location_type: "OTHER", zone_code: "Z1" }, as: TransportSupervisor, captures: { loc_h: $.data.id } }
            - { call: "POST /transport/locations", payload: { code: "W4", name: "Ward 4", location_type: "WARD", zone_code: "Z1" }, as: TransportSupervisor, captures: { loc_a: $.data.id } }
            - { call: "POST /transport/locations", payload: { code: "OR1", name: "OR 1", location_type: "OR", zone_code: "Z3" }, as: TransportSupervisor, captures: { loc_or: $.data.id } }
            - { call: "POST /transport/travel-edges", payload: { from_location_id: "${loc_h}", to_location_id: "${loc_a}", base_minutes: 8, airborne_minutes: 12 }, as: TransportSupervisor }
            - { call: "POST /transport/travel-edges", payload: { from_location_id: "${loc_a}", to_location_id: "${loc_or}", base_minutes: 10, airborne_minutes: 16 }, as: TransportSupervisor }
            - { call: "POST /transport/transporters", payload: { name: "T One", home_location_id: "${loc_h}", certified_equipment: ["STRETCHER"] }, as: TransportSupervisor, captures: { t1: $.data.id } }
            - { call: "POST /transport/staffing-shifts", payload: { transporter_id: "${t1}", shift_start: "2026-07-31T00:00:00Z", shift_end: "2026-09-01T00:00:00Z" }, as: TransportSupervisor }
            - { call: "POST /transport/transporters/${t1}/set-status", payload: { status: "ON_SHIFT" }, as: Transporter, as_user_id: "${t1}" }
            - { call: "POST /transport/equipment-assets", payload: { asset_tag: "ST-001", equipment_type: "STRETCHER", current_location_id: "${loc_a}" }, as: TransportSupervisor }
            - { call: "POST /transport/requests", payload: { patient_ref: "P1", origin_location_id: "${loc_a}", destination_location_id: "${loc_or}", priority: "URGENT", required_equipment: "STRETCHER", appointment_deadline: "2026-08-01T00:30:00Z" }, as: RequestingClinician, as_user_id: "clin-1", captures: { r1: $.data.id, r1_v: $.data.version } }
            - { call: "POST /transport/requests/${r1}/offers", payload: { transporter_id: "${t1}", expected_request_version: "${r1_v}" }, as: TransportDispatcher, captures: { o1: $.data.id } }
            - { call: "POST /transport/dispatch-offers/${o1}/respond", payload: { decision: "ACCEPT" }, as: Transporter, as_user_id: "${t1}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:10:00Z" }, as: TransportSupervisor }
            - { call: "POST /transport/requests/${r1}/trip-events", payload: { event: "ARRIVE_PICKUP" }, as: Transporter, as_user_id: "${t1}" }
            - { call: "POST /transport/requests/${r1}/trip-events", payload: { event: "PICKUP" }, as: Transporter, as_user_id: "${t1}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:50:00Z" }, as: TransportSupervisor }
          trigger:
            - { call: "POST /transport/requests/${r1}/trip-events", payload: { event: "COMPLETE", cause_code: "PATIENT_NOT_READY" }, as: Transporter, as_user_id: "${t1}" }
            - { call: "GET /transport/requests/${r1}/delay-records", as: TransportDispatcher, captures: { d_kind: "$.data[0].record_kind", d_delay: "$.data[0].delay_minutes", d_impact: "$.data[0].impact_minutes", d_cause: "$.data[0].cause_code" } }
          assert:
            - "exactly one DelayRecord exists for ${r1} (no SLA_BREACH: response 10 <= 45)"
            - "DelayRecord.record_kind == APPOINTMENT_LATE and recorded_via == COMPLETION"
            - "DelayRecord.delay_minutes == 20 (attributed variant)"
            - "DelayRecord.impact_minutes == 40 (cascade variant: round_half_up(20 x 2.0))"
            - "DelayRecord.cause_code == PATIENT_NOT_READY"

  # ------------------------------------------------------------------
  # Rule 2: combinatorial_formula — modes (a), (b), (c)
  # ------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: travel_estimate_multiinput_airborne
        grounds:
          - calculations.travel_time_estimate
        distinguishing_aspect: |
          Mode (a): the estimate combines >= 3 inputs with non-linear interaction — AIRBORNE
          substitutes airborne_minutes for base_minutes (conditional branch), the equipment factor
          applies ceil (nested rounding inside one leg), and oxygen adds a flat surcharge:
          8 + ceil(16 x 1.4) + 2 = 33.
        test_recipe:
          setup:
            - "Locations HUB, W4(WARD), IMG(IMAGING); edges HUB->W4 8/12, W4->IMG 10/16"
            - "T1 certified BARIATRIC_STRETCHER, oxygen_certified, isolation_certified, ON_SHIFT with covering shift"
            - "Asset BS-001 BARIATRIC_STRETCHER at W4; clock 2026-08-01T00:00:00Z"
            - "Request: W4->IMG, URGENT, BARIATRIC_STRETCHER, oxygen_required true, isolation_precaution AIRBORNE"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: TransportSupervisor }
            - { call: "POST /transport/locations", payload: { code: "HUB", name: "Hub", location_type: "OTHER", zone_code: "Z1" }, as: TransportSupervisor, captures: { loc_h: $.data.id } }
            - { call: "POST /transport/locations", payload: { code: "W4", name: "Ward 4", location_type: "WARD", zone_code: "Z1" }, as: TransportSupervisor, captures: { loc_a: $.data.id } }
            - { call: "POST /transport/locations", payload: { code: "IMG", name: "Imaging", location_type: "IMAGING", zone_code: "Z2" }, as: TransportSupervisor, captures: { loc_b: $.data.id } }
            - { call: "POST /transport/travel-edges", payload: { from_location_id: "${loc_h}", to_location_id: "${loc_a}", base_minutes: 8, airborne_minutes: 12 }, as: TransportSupervisor }
            - { call: "POST /transport/travel-edges", payload: { from_location_id: "${loc_a}", to_location_id: "${loc_b}", base_minutes: 10, airborne_minutes: 16 }, as: TransportSupervisor }
            - { call: "POST /transport/transporters", payload: { name: "T One", home_location_id: "${loc_h}", certified_equipment: ["BARIATRIC_STRETCHER"], oxygen_certified: true, isolation_certified: true }, as: TransportSupervisor, captures: { t1: $.data.id } }
            - { call: "POST /transport/staffing-shifts", payload: { transporter_id: "${t1}", shift_start: "2026-07-31T00:00:00Z", shift_end: "2026-09-01T00:00:00Z" }, as: TransportSupervisor }
            - { call: "POST /transport/transporters/${t1}/set-status", payload: { status: "ON_SHIFT" }, as: Transporter, as_user_id: "${t1}" }
            - { call: "POST /transport/equipment-assets", payload: { asset_tag: "BS-001", equipment_type: "BARIATRIC_STRETCHER", current_location_id: "${loc_a}" }, as: TransportSupervisor, captures: { a1: $.data.id } }
            - { call: "POST /transport/requests", payload: { patient_ref: "P1", origin_location_id: "${loc_a}", destination_location_id: "${loc_b}", priority: "URGENT", required_equipment: "BARIATRIC_STRETCHER", oxygen_required: true, isolation_precaution: "AIRBORNE" }, as: RequestingClinician, as_user_id: "clin-1", captures: { r1: $.data.id, r1_v: $.data.version } }
          trigger:
            - { call: "POST /transport/requests/${r1}/offers", payload: { transporter_id: "${t1}", expected_request_version: "${r1_v}" }, as: TransportDispatcher, captures: { o1: $.data.id, o1_est: $.data.estimated_travel_minutes } }
            - { call: "GET /transport/requests/${r1}", as: TransportDispatcher, captures: { r_eq: $.data.assigned_equipment_id } }
          assert:
            - "DispatchOffer.${o1}.estimated_travel_minutes == 33 (deadhead 8 + ceil(16 x 1.4) = 23 + oxygen 2)"
            - "TransportRequest.${r1}.assigned_equipment_id == ${a1} (the BS-001 asset, RESERVED by the offer)"

      - name: staffing_perblock_ceil_then_sum
        grounds:
          - calculations.staffing_requirement
        distinguishing_aspect: |
          Mode (b): nested rounding order is pinned — ceil per hour block then sum gives 9 + 4 = 13
          for blocks 9-10, whereas sum-then-round would give ceil(714/60) = 12; the endpoint must
          return 13, proving per-block rounding.
        test_recipe:
          setup:
            - "DemandCurve rows identical to staffing_required_forecast_vs_replay (h9 load 510, h10 load 204)"
            - "No shifts; clock position irrelevant for FORECAST; 2026-08-03 is a WEEKDAY (Monday)"
          setup_api_calls:
            - { call: "POST /transport/demand-curves", payload: { day_type: "WEEKDAY", hour_block: 9, priority: "STAT", expected_requests: 2, mean_service_minutes: 30 }, as: TransportSupervisor }
            - { call: "POST /transport/demand-curves", payload: { day_type: "WEEKDAY", hour_block: 9, priority: "URGENT", expected_requests: 4, mean_service_minutes: 40 }, as: TransportSupervisor }
            - { call: "POST /transport/demand-curves", payload: { day_type: "WEEKDAY", hour_block: 9, priority: "ROUTINE", expected_requests: 5, mean_service_minutes: 58 }, as: TransportSupervisor }
            - { call: "POST /transport/demand-curves", payload: { day_type: "WEEKDAY", hour_block: 10, priority: "STAT", expected_requests: 1, mean_service_minutes: 30 }, as: TransportSupervisor }
            - { call: "POST /transport/demand-curves", payload: { day_type: "WEEKDAY", hour_block: 10, priority: "URGENT", expected_requests: 1, mean_service_minutes: 40 }, as: TransportSupervisor }
            - { call: "POST /transport/demand-curves", payload: { day_type: "WEEKDAY", hour_block: 10, priority: "ROUTINE", expected_requests: 2, mean_service_minutes: 67 }, as: TransportSupervisor }
          trigger:
            - { call: "GET /transport/staffing/adequacy", payload: { date: "2026-08-03", hour_block: 9, window_hours: 1, variant: "FORECAST" }, as: TransportSupervisor, captures: { req_w1: $.data.required_transporters } }
            - { call: "GET /transport/staffing/adequacy", payload: { date: "2026-08-03", hour_block: 9, window_hours: 2, variant: "FORECAST" }, as: TransportSupervisor, captures: { req_w2: $.data.required_transporters } }
          assert:
            - "window_hours 1: required_transporters == 9 (ceil(510/60))"
            - "window_hours 2: required_transporters == 13 (9 + ceil(204/60) = 9 + 4), NOT 12"

      - name: sla_escalation_evaluation_order
        grounds:
          - calculations.sla_posture_evaluation
          - state_machines.TransportRequest.QUEUED_to_QUEUED
          - entities.TransportRequest.fields.escalation_count
        distinguishing_aspect: |
          Mode (c): circular-looking dependency pinned by evaluation order — posture determines
          escalation, escalation changes the target, the record's delay is measured against the
          NEW target: a ROUTINE request 121 minutes old escalates to URGENT and its SLA_BREACH
          DelayRecord.delay_minutes == 76 (121 - 45), not 1 (121 - 120), proving escalate-then-record.
        test_recipe:
          setup:
            - "One ROUTINE PORTER_ONLY request created at 2026-08-01T00:00:00Z, never dispatched"
            - "Clock advanced to 2026-08-01T02:01:00Z (elapsed 121 > ROUTINE target 120)"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: TransportSupervisor }
            - { call: "POST /transport/locations", payload: { code: "W4", name: "Ward 4", location_type: "WARD", zone_code: "Z1" }, as: TransportSupervisor, captures: { loc_a: $.data.id } }
            - { call: "POST /transport/locations", payload: { code: "IMG", name: "Imaging", location_type: "IMAGING", zone_code: "Z2" }, as: TransportSupervisor, captures: { loc_b: $.data.id } }
            - { call: "POST /transport/requests", payload: { patient_ref: "P1", origin_location_id: "${loc_a}", destination_location_id: "${loc_b}", priority: "ROUTINE", required_equipment: "PORTER_ONLY" }, as: RequestingClinician, as_user_id: "clin-1", captures: { r1: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T02:01:00Z" }, as: TransportSupervisor }
          trigger:
            - { call: "POST /_sweeps/run", as: TransportSupervisor, captures: { esc: $.data.requests_escalated, recs: $.data.sla_records_created } }
            - { call: "GET /transport/requests/${r1}", as: TransportDispatcher, captures: { r1_pri: $.data.priority, r1_posture: $.data.sla_posture, r1_esc: $.data.escalation_count } }
            - { call: "GET /transport/requests/${r1}/delay-records", as: TransportDispatcher, captures: { d_kind: "$.data[0].record_kind", d_delay: "$.data[0].delay_minutes", d_via: "$.data[0].recorded_via" } }
          assert:
            - "sweep summary: requests_escalated == 1 and sla_records_created == 1"
            - "TransportRequest.${r1}.priority == URGENT and escalation_count == 1"
            - "TransportRequest.${r1}.sla_posture == BREACHED (121 > URGENT target 45 after recompute)"
            - "DelayRecord[0].record_kind == SLA_BREACH, recorded_via == SWEEP, delay_minutes == 76"

  # ------------------------------------------------------------------
  # Rule 3: non_linear_state_machine — two different entities
  # ------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: equipment_cleaning_full_cycle
        grounds:
