      - name: hin_assignment_serial_sequence_per_model_year
        claim_type: correct_result
        grounds: ["calculations.hin_assignment", "entities.Hull.fields.hin", "entities.Hull.fields.serial_no"]
        distinguishing_aspect: "HIN format: BRW + zero-padded 5-digit serial + month letter + last digit of completion year + 2-digit model year. Serial sequence is per (model_id, model_year), starting at 1."
        test_recipe:
          setup: ["Model SP190 (model_year 2027); two hulls completed in August 2026"]
          setup_api_calls:
            - call: "POST /boat-models"
              payload: { model_code: "SP190", model_name: "Sport 190", model_year: 2027, base_price_cents: 2500000, length_feet: 19.5, production_hours: 40 }
              as: SystemAdmin
              captures: { m: $.data.id }
