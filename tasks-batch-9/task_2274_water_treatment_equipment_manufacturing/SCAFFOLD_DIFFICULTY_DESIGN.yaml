          - entities.EquipmentPackage.fields.revision_round
          - calculations.equipment_package_cost
        distinguishing_aspect: |
          A true cycle on EquipmentPackage: DRAFT -> IN_REVIEW -> DRAFT -> IN_REVIEW -> APPROVED, where
          the backward edge is not a no-op - it increments revision_round to 1 and re-opens the design
          for a PATCH, so the second BUDGETARY run reads design_pressure_psig 200 and produces
          264576000 instead of the first round's 260832000.
