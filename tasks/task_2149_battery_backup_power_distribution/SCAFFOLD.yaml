    roles: [SalesRep, Customer]
    code: 201
    input: [account_id, coverage_tier, load_watts, required_runtime_minutes, system_voltage, ambient_temp_c, allowed_chemistries]
    output: ServiceContract
    side_effects: ["status initialised to DRAFT; every sized_* field 0 or null"]

  - method: GET
    path: "/distribution/service-contracts/{serviceContractId}"
    description: "Read one service contract."
    roles: [PlatformAdmin, SalesRep, ComplianceOfficer, Customer]
    code: 200
    input: []
    output: ServiceContract
    side_effects: []

  - method: GET
    path: "/distribution/service-contracts"
    description: "List service contracts with FK and status filters."
    roles: [PlatformAdmin, SalesRep, ComplianceOfficer, Customer]
    code: 200
    input: ["account_id?", "order_id?", "sized_battery_model_id?", "status?", "limit?", "offset?"]
    output: ServiceContract[]
    side_effects: []

  - method: POST
    path: "/distribution/service-contracts/{serviceContractId}/size"
    description: "Run chemistry-aware runtime sizing and price the coverage."
    roles: [SalesRep, PlatformAdmin]
    code: 200
    input: []
    output: ServiceContract
    side_effects: ["runs runtime_sizing_selector, runtime_sizing and service_contract_fee", "status DRAFT -> SIZED"]

  - method: POST
    path: "/distribution/service-contracts/{serviceContractId}/attach"
    description: "Attach a SIZED contract to one of the account's open orders, booking the prepaid fee onto that order."
    roles: [SalesRep]
    code: 200
    input: [order_id, expected_order_version]
    output: ServiceContract
    side_effects: ["status SIZED -> ATTACHED; any contract already on that order moves to SUPERSEDED", "Order.service_contract_fee_cents = prepay_total_cents and Order.total_cents re-derived", "Account.open_receivable_cents adjusted by the order-total delta", "increments Order.version by 1"]

  # ---- Storm events --------------------------------------------------------
  - method: POST
    path: "/distribution/storm-events"
    description: "Declare a storm event; the carve-out in its region takes effect immediately."
    roles: [ComplianceOfficer, PlatformAdmin]
    code: 201
    input: [name, region_state_code, severity_tier, allocation_pool_units]
    output: StormEvent
    side_effects: ["status DECLARED, allocated_units 0, remaining_pool_units = allocation_pool_units, min_priority_score from SEVERITY_MIN_SCORE"]

  - method: GET
    path: "/distribution/storm-events/{stormEventId}"
    description: "Read one storm event with its live pool counters."
    roles: [PlatformAdmin, SalesRep, WarehouseOperator, ComplianceOfficer, Customer]
    code: 200
    input: []
    output: StormEvent
    side_effects: []

  - method: POST
    path: "/distribution/storm-events/{stormEventId}/open-allocation"
    description: "Open the pool for storm draws."
    roles: [ComplianceOfficer, PlatformAdmin]
    code: 200
    input: []
    output: StormEvent
    side_effects: ["status DECLARED -> ALLOCATING"]

  - method: POST
    path: "/distribution/storm-events/{stormEventId}/close"
    description: "Close the event, releasing the warehouse carve-out in its region."
    roles: [ComplianceOfficer, PlatformAdmin]
    code: 200
    input: []
    output: StormEvent
    side_effects: ["status -> CLOSED", "quantity_available rises for non-storm allocation in region_state_code"]

  # ---- Disposal manifests --------------------------------------------------
  - method: POST
    path: "/distribution/disposal-manifests"
    description: "Open a DRAFT lead-disposal manifest for a site."
    roles: [ComplianceOfficer]
    code: 201
    input: [warehouse_id, epa_id, reporting_period]
    output: DisposalManifest
    side_effects: ["records created_by_user_id from X-User-ID; every count and lead total 0"]

  - method: GET
    path: "/distribution/disposal-manifests/{disposalManifestId}"
    description: "Read one manifest with its lead totals re-derived."
    roles: [PlatformAdmin, WarehouseOperator, ComplianceOfficer]
    code: 200
    input: []
    output: DisposalManifest
    side_effects: ["re-derives counts and lead totals via manifest_lead_totals"]

  - method: GET
    path: "/distribution/disposal-manifests"
    description: "List manifests with FK and status filters."
    roles: [PlatformAdmin, WarehouseOperator, ComplianceOfficer]
    code: 200
    input: ["warehouse_id?", "status?", "limit?", "offset?"]
    output: DisposalManifest[]
    side_effects: []

  - method: POST
    path: "/distribution/disposal-manifests/{disposalManifestId}/attach-core-return"
    description: "Add a CREDITED core return's recovered lead to a DRAFT manifest. The manifest must be in status DRAFT and the CoreReturn must be in status CREDITED; either row in any other state is refused with ERR_INVALID_STATE."
    roles: [ComplianceOfficer]
    code: 200
    input: [core_return_id, expected_disposal_manifest_version]
    output: DisposalManifest
    side_effects: ["sets CoreReturn.disposal_manifest_id", "re-derives attached_core_return_count, core_lead_kg and total_lead_kg", "increments DisposalManifest.version by 1"]

  - method: POST
    path: "/distribution/disposal-manifests/{disposalManifestId}/submit"
    description: "Freeze a DRAFT manifest for regulatory review."
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: DisposalManifest
    side_effects: ["status DRAFT -> SUBMITTED"]

  - method: POST
    path: "/distribution/disposal-manifests/{disposalManifestId}/file"
    description: "File the manifest with the regulator; the filer must not be its author."
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: DisposalManifest
    side_effects: ["status SUBMITTED -> FILED, writes filed_by_user_id and filed_at"]

  - method: POST
    path: "/distribution/disposal-manifests/{disposalManifestId}/reject"
    description: "Send a SUBMITTED manifest back to DRAFT, detaching everything it carried."
    roles: [ComplianceOfficer, PlatformAdmin]
    code: 200
    input: [rejection_reason]
    output: DisposalManifest
    side_effects: ["status SUBMITTED -> DRAFT", "clears disposal_manifest_id on every attached CoreReturn and scrap_manifest_id on every scrapped InventoryLot", "resets both counts and all three lead totals to 0"]

  # ---- Test-driving surface ------------------------------------------------
  - method: POST
    path: "/distribution/_clock/set_current_utc"
    description: "Set the server's logical clock. Before any call to this endpoint the logical clock reads exactly 2026-08-01T00:00:00Z; it never falls back to real wall-clock time. Every shelf-life, state-of-charge, cooldown, pickup-window, core-return-window and settlement-date rule reads this clock."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: ["every InventoryLot re-derives state_of_charge_pct and condition_state on its next read or write"]

# ---------------------------------------------------------------------------
# §1.6 Error Code Catalog
# ---------------------------------------------------------------------------
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, empty, or naming a role outside the six declared roles"
  - id: ERR_FORBIDDEN_ROLE
    http: 403
    condition: "the authenticated role is not listed in the endpoint's roles"
  - id: ERR_ACCOUNT_SCOPE_VIOLATION
    http: 403
    condition: "a Customer acts on a resource whose account_id differs from the caller's X-User-ID"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "the certifier equals the packer on a shipment, or the filer equals the author on a disposal manifest"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "missing required body field, wrong type, undeclared enum member, quantity < 1, core_expected_count > quantity, storm_priority_rank outside 1..9, failed_on < installed_on, pickup_window_end <= pickup_window_start, empty allowed_chemistries"
  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_order_version or expected_disposal_manifest_version does not equal the parent row's current version"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "the target row's current state is not a declared from-state for the requested transition"

  - id: ERR_ACCOUNT_NOT_FOUND
    http: 404
    condition: "an account id in the path or body matches no Account row"
  - id: ERR_BATTERY_MODEL_NOT_FOUND
    http: 404
    condition: "a battery model id in the path or body matches no BatteryModel row"
  - id: ERR_WAREHOUSE_NOT_FOUND
    http: 404
    condition: "a warehouse id in the path or body matches no Warehouse row"
  - id: ERR_CARRIER_NOT_FOUND
    http: 404
    condition: "a carrier id in the path or body matches no Carrier row"
  - id: ERR_INVENTORY_LOT_NOT_FOUND
    http: 404
    condition: "an inventory lot id in the path matches no InventoryLot row"
  - id: ERR_ORDER_NOT_FOUND
    http: 404
    condition: "an order id in the path or body matches no Order row"
  - id: ERR_ORDER_LINE_NOT_FOUND
    http: 404
    condition: "an order line id in the path matches no OrderLine row"
  - id: ERR_SHIPMENT_NOT_FOUND
    http: 404
    condition: "a shipment id in the path matches no Shipment row"
  - id: ERR_CORE_RETURN_NOT_FOUND
    http: 404
    condition: "a core return id in the path or body matches no CoreReturn row"
  - id: ERR_WARRANTY_CLAIM_NOT_FOUND
    http: 404
    condition: "a warranty claim id in the path matches no WarrantyClaim row"
  - id: ERR_SERVICE_CONTRACT_NOT_FOUND
    http: 404
    condition: "a service contract id in the path matches no ServiceContract row"
  - id: ERR_STORM_EVENT_NOT_FOUND
    http: 404
    condition: "a storm event id in the path or body matches no StormEvent row"
  - id: ERR_DISPOSAL_MANIFEST_NOT_FOUND
    http: 404
    condition: "a disposal manifest id in the path or body matches no DisposalManifest row"

  - id: ERR_ACCOUNT_NOT_ACTIVE
    http: 409
    condition: "order submit attempted while Account.status == CREDIT_HOLD"
  - id: ERR_ORDER_HAS_NO_LINES
    http: 422
    condition: "order submit attempted with line_count == 0"
  - id: ERR_DISPUTE_ROUNDS_EXHAUSTED
    http: 409
    condition: "dispute attempted when CoreReturn.inspection_round has already reached MAX_INSPECTION_ROUNDS (3)"
  - id: ERR_REFRESH_CYCLES_EXHAUSTED
    http: 409
    condition: "refresh charge attempted when InventoryLot.refresh_charge_count has already reached MAX_REFRESH_CYCLES (3)"

  - id: ERR_WAREHOUSE_NOT_HAZMAT_ENDORSED
    http: 422
    condition: "certification APPROVE of a regulated shipment out of a warehouse whose hazmat_endorsement is false"
  - id: ERR_CARRIER_HAZMAT_REFUSED
    http: 422
    condition: "the shipment's hazmat_class_code is absent from the carrier's accepts_hazmat_classes"
  - id: ERR_AIR_MODE_PROHIBITED
    http: 422
    condition: "a UN3480_SECTION_IA shipment tendered to a carrier whose ground_only is false"
  - id: ERR_LITHIUM_WH_LIMIT_EXCEEDED
    http: 422
    condition: "a lithium model on the order exceeds the carrier's max_lithium_watt_hours_per_package"

  - id: ERR_MODEL_DISCONTINUED
    http: 422
    condition: "an order line names a BatteryModel whose status is DISCONTINUED"
  - id: ERR_ACCOUNT_MISMATCH
    http: 422
    condition: "a core return or a contract attachment names an account different from the linked order's account"
  - id: ERR_STORM_REGION_MISMATCH
    http: 422
    condition: "a storm order's Account.state_code differs from its StormEvent.region_state_code"
  - id: ERR_ORDER_NOT_DELIVERED
    http: 422
    condition: "a core return is opened against an order whose fulfillment_status is not DELIVERED"

  - id: ERR_CREDIT_LIMIT_EXCEEDED
    http: 402
    condition: "order total plus existing open receivable minus warranty credit would exceed the account's credit limit"
  - id: ERR_STORM_PRIORITY_TOO_LOW
    http: 403
    condition: "the storm order's allocation_priority_score is below the event's min_priority_score"
  - id: ERR_STORM_POOL_EXHAUSTED
    http: 422
    condition: "the storm order needs more units than the event's remaining_pool_units"

  - id: ERR_CORE_RETURN_WINDOW_CLOSED
    http: 422
    condition: "the return is opened more than CORE_RETURN_GRACE_DAYS after the earliest matching core_due_by"
  - id: ERR_REFRESH_COOLDOWN_ACTIVE
    http: 409
    condition: "a refresh charge lands inside the closed 72-hour cooldown interval, upper bound included"
  - id: ERR_CARRIER_WINDOW_CONFLICT
    http: 409
    condition: "the pickup window intersects another live shipment's window on the same carrier under half-open semantics"
  - id: ERR_DISPATCH_WINDOW_NOT_OPEN
    http: 409
    condition: "dispatch attempted while the logical clock is outside [pickup_window_start, pickup_window_end)"
  - id: ERR_LOT_SHELF_EXPIRED
    http: 422
    condition: "allocation found no sellable lot but a shelf-expired lot of the same model at the same warehouse could otherwise have covered the line"

  - id: ERR_LOT_REFRESH_REQUIRED
    http: 422
    condition: "allocation found no sellable lot but a refresh-required lot of the same model at the same warehouse could otherwise have covered the line, and no shelf-expired one exists"
  - id: ERR_INSUFFICIENT_SELLABLE_STOCK
    http: 422
    condition: "no lot of the model at the warehouse can cover the line, whatever its condition"
  - id: ERR_CORE_COUNT_EXCEEDS_PROMISE
    http: 422
    condition: "declared_core_count exceeds the still-uncommitted core promise on the source order for that model"
  - id: ERR_LOT_RESERVED
    http: 409
    condition: "scrap attempted on a lot whose quantity_reserved is greater than 0"
  - id: ERR_DOCK_CAPACITY_EXCEEDED
    http: 422
    condition: "the aggregate weight of mutually overlapping pickup windows at the warehouse would exceed dock_capacity_kg_per_window"
  - id: ERR_MANIFEST_EMPTY
    http: 422
    condition: "manifest submit attempted with no attached core returns and no scrapped lots"
  - id: ERR_MANIFEST_LEAD_LIMIT_EXCEEDED
    http: 422
    condition: "manifest total_lead_kg would exceed EPA_MANIFEST_MAX_LEAD_KG (1000.000)"
  - id: ERR_NO_ELIGIBLE_BATTERY_MODEL
    http: 422
    condition: "the runtime sizing selector's candidate set is empty for the contract's allowed_chemistries and system_voltage"
  - id: ERR_DUPLICATE_SKU
    http: 409
    condition: "a BatteryModel sku, a Warehouse code or a Carrier code is already taken"
  - id: ERR_DUPLICATE_SERIAL_NUMBER
    http: 409
    condition: "a WarrantyClaim already exists for the same serial_number"
  - id: ERR_SHIPMENT_ALREADY_OPEN
    http: 409
    condition: "the order already carries a Shipment with status IN {PACKED, CERTIFIED, DISPATCHED, DELIVERED}"
  - id: ERR_CARRIER_PREVIOUSLY_REJECTED
    http: 409
    condition: "dispatch attempted on a carrier already present in the order's rejected_carrier_ids"

# ---------------------------------------------------------------------------
# §1.7 RBAC Matrix
# ---------------------------------------------------------------------------
roles:
  - name: PlatformAdmin
    description: "Distributor operations administrator; owns the catalog, sites, carriers, accounts and the logical clock."
    identity: "opaque"
    exclusive_operations:
      - "POST /distribution/accounts"
      - "POST /distribution/battery-models"
      - "POST /distribution/battery-models/{batteryModelId}/discontinue"
      - "POST /distribution/warehouses"
      - "POST /distribution/carriers"
      - "POST /distribution/_clock/set_current_utc"
    shared_operations:
      - "POST /distribution/inventory-lots"
      - "POST /distribution/orders/{orderId}/allocate"
      - "POST /distribution/orders/{orderId}/cancel"
      - "POST /distribution/core-returns/{coreReturnId}/credit"
      - "POST /distribution/warranty-claims/{warrantyClaimId}/adjudicate"
      - "POST /distribution/warranty-claims/{warrantyClaimId}/settle"
      - "POST /distribution/service-contracts/{serviceContractId}/size"
      - "POST /distribution/storm-events"
      - "POST /distribution/storm-events/{stormEventId}/open-allocation"
      - "POST /distribution/storm-events/{stormEventId}/close"
      - "POST /distribution/disposal-manifests/{disposalManifestId}/reject"
      - "every GET except the disposal-manifest reads it shares with ComplianceOfficer"

  - name: SalesRep
    description: "Inside sales; opens and prices orders, files and settles warranty claims, opens and attaches service contracts, issues core credits."
    identity: "opaque"
    exclusive_operations:
      - "POST /distribution/service-contracts/{serviceContractId}/attach"
    shared_operations:
      - "POST /distribution/orders"
      - "POST /distribution/orders/{orderId}/lines"
      - "POST /distribution/orders/{orderId}/submit"
      - "POST /distribution/orders/{orderId}/cancel"
      - "POST /distribution/core-returns"
      - "POST /distribution/core-returns/{coreReturnId}/dispute"
      - "POST /distribution/core-returns/{coreReturnId}/credit"
      - "POST /distribution/warranty-claims"
      - "POST /distribution/warranty-claims/{warrantyClaimId}/adjudicate"
      - "POST /distribution/warranty-claims/{warrantyClaimId}/settle"
      - "POST /distribution/service-contracts"
      - "POST /distribution/service-contracts/{serviceContractId}/size"

  - name: WarehouseOperator
    description: "Site operator; receives and maintains lots, allocates orders, packs, dispatches and delivers shipments, inspects returned cores."
    identity: "opaque"
    exclusive_operations:
      - "POST /distribution/inventory-lots/{inventoryLotId}/refresh-charge"
      - "POST /distribution/shipments"
      - "POST /distribution/shipments/{shipmentId}/dispatch"
      - "POST /distribution/shipments/{shipmentId}/deliver"
      - "POST /distribution/core-returns/{coreReturnId}/inspect"
    shared_operations:
      - "POST /distribution/inventory-lots"
      - "POST /distribution/inventory-lots/{inventoryLotId}/scrap"
      - "POST /distribution/orders/{orderId}/allocate"

  - name: HazmatCertifier
    description: "Dangerous-goods certifier; the only role that may approve or reject a hazmat tender, and never the operator who packed it."
    identity: "opaque"
    exclusive_operations:
      - "POST /distribution/shipments/{shipmentId}/certify"
    shared_operations:
      - "GET /distribution/shipments"
      - "GET /distribution/shipments/{shipmentId}"
      - "GET /distribution/carriers/{carrierId}"

  - name: ComplianceOfficer
    description: "Environmental compliance; declares storm events and owns lead-disposal manifests end to end, subject to author/filer separation."
    identity: "opaque"
    exclusive_operations:
      - "POST /distribution/disposal-manifests"
      - "POST /distribution/disposal-manifests/{disposalManifestId}/attach-core-return"
      - "POST /distribution/disposal-manifests/{disposalManifestId}/submit"
      - "POST /distribution/disposal-manifests/{disposalManifestId}/file"
    shared_operations:
      - "POST /distribution/inventory-lots/{inventoryLotId}/scrap"
      - "POST /distribution/storm-events"
      - "POST /distribution/storm-events/{stormEventId}/open-allocation"
      - "POST /distribution/storm-events/{stormEventId}/close"
      - "POST /distribution/disposal-manifests/{disposalManifestId}/reject"

  - name: Customer
    description: "The buying account acting for itself. X-User-ID is the Account id, and every Customer request is scoped to that account."
    identity: "entity_backed:Account"
    exclusive_operations: []
    shared_operations:
      - "POST /distribution/orders"
      - "POST /distribution/orders/{orderId}/lines"
      - "POST /distribution/orders/{orderId}/submit"
      - "POST /distribution/orders/{orderId}/cancel"
      - "POST /distribution/core-returns"
      - "POST /distribution/core-returns/{coreReturnId}/dispute"
      - "POST /distribution/warranty-claims"
      - "POST /distribution/service-contracts"
      - "GET reads scoped to the caller's own account"
