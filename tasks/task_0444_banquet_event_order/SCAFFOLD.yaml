# =============================================================================
# Banquet Event Order & Catering Sales (BEO) — Scaffold Seed Tables (Expert)
# §1.0–§1.7 only. §1.8 lives in SCAFFOLD_DIFFICULTY_DESIGN.yaml; §1.9 in
# SCAFFOLD_CORNER_DESIGN.yaml.
# =============================================================================

scenario: "Banquet Event Order & Catering Sales (BEO): event inquiry & space hold, function-room & setup diagram, F&B menu (per-person/consumption), AV/labor/service-charge & gratuity, room-block linkage, guarantee count & overset, deposit & payment schedule, post-event actualization"

domain_name: banquet-event-order
api_prefix: /

# =============================================================================
# §0.3 Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: temporal_windowing
  secondary_archetype: pricing_engine
  complexity_layers:
    - optimistic_concurrency
    - dual_variant_calculation
    - cascading_side_effects
    - rate_threshold_triggers
    - scheduled_deferred_actions

  entity_topology: hybrid
  # Event is the aggregate root (hierarchical children: FunctionRoomBooking,
  # MenuLine, ServiceLine, PaymentScheduleItem), plus flat cross-aggregate
  # references: FunctionRoomBooking -> FunctionRoom (shared resource),
  # RoomBlockLink -> Event and -> HotelRoomBlock (shared resource).

  state_machine_shape: branching
  # Event lifecycle branches (CONFIRMED -> {COMPLETED, CANCELLED}; revision loop
  # DEFINITE -> TENTATIVE on material change) and FunctionRoomBooking carries an
  # independent HOLD/DEFINITE/RELEASED dimension. Payment has its own machine.

  relationship_patterns:
    - one_to_many        # Event -> bookings, menu lines, service lines, payment items
    - cross_aggregate    # FunctionRoomBooking -> FunctionRoom; RoomBlockLink -> HotelRoomBlock
    - many_to_many       # RoomBlockLink junction between Event and HotelRoomBlock

  role_model: peer_roles
  # SalesManager owns inquiry/hold/menu/pricing; BanquetCaptain owns guarantee,
  # actualization, day-of operations; AccountingClerk owns deposits/payments;
  # PlatformAdmin operational override + clock/seed.

  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — EMIT VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  # --- Shared resource: a physical function room (configuration) -----------
  - name: FunctionRoom
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: name, type: string, source: input, description: "Room name, e.g. 'Grand Ballroom'" }
      - { name: max_capacity, type: integer, source: input, description: "Maximum guests for any setup style", constraints: ">= 1" }
      - { name: turnover_buffer_minutes, type: integer, source: input, description: "Minutes of forced clean/reset that must be free both before and after every DEFINITE booking on this room", default: 60, constraints: ">= 0" }
      - { name: hourly_rental_cents, type: integer, source: input, description: "Base room rental charged per started hour of the booked window", constraints: ">= 0" }
      - { name: status, type: enum, source: system, description: "ACTIVE | RETIRED", default: ACTIVE, constraints: "ACTIVE | RETIRED" }

  # --- Shared resource: a contracted block of sleeping rooms (configuration)
  - name: HotelRoomBlock
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: block_name, type: string, source: input, description: "Room block label, e.g. 'Summer Wedding Block'" }
      - { name: total_rooms, type: integer, source: input, description: "Total sleeping rooms contracted in this block", constraints: ">= 1" }
      - { name: nightly_rate_cents, type: integer, source: input, description: "Negotiated nightly rate per room (informational)", constraints: ">= 0" }
      - { name: rooms_committed, type: integer, source: computed, description: "Sum of rooms_picked_up over all RoomBlockLink rows in PICKED_UP plus rooms_reserved over links in RESERVED status; never exceeds total_rooms", default: 0 }
      - { name: rooms_available, type: integer, source: computed, description: "total_rooms - rooms_committed; never negative", default: 0 }

  # --- Aggregate root: the catering event / BEO --------------------------
  - name: Event
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: account_name, type: string, source: input, description: "Client / host organisation name" }
      - { name: event_date, type: string, source: input, description: "Date of the event, ISO date YYYY-MM-DD" }
      - { name: setup_style, type: enum, source: input, description: "Seating diagram style; affects effective capacity factor", constraints: "ROUNDS | THEATER | CLASSROOM | RECEPTION" }
      - { name: expected_attendance, type: integer, source: input, description: "Planning headcount at inquiry time", constraints: ">= 1" }
      - { name: guarantee_count, type: integer, source: input, description: "Contractually guaranteed headcount; null until guarantee is locked", default: null, constraints: ">= 1 when set" }
      - { name: actual_attendance, type: integer, source: input, description: "Counted headcount at actualization; null until actualized", default: null, constraints: ">= 0 when set" }
      - { name: overset_pct, type: number, source: input, description: "Kitchen overset percentage above guarantee the venue agrees to prepare for", default: 0.05, constraints: "0 <= overset_pct <= 0.10" }
      - { name: service_charge_pct, type: number, source: input, description: "Taxable service charge rate applied to F&B + service subtotal", default: 0.22, constraints: "0 <= service_charge_pct <= 0.30" }
      - { name: gratuity_pct, type: number, source: input, description: "Non-taxable gratuity rate applied to F&B + service subtotal", default: 0.0, constraints: "0 <= gratuity_pct <= 0.25" }
      - { name: sales_tax_pct, type: number, source: input, description: "Sales tax rate applied to taxable base", default: 0.08, constraints: "0 <= sales_tax_pct <= 0.15" }
      - { name: status, type: enum, source: system, description: "Event lifecycle status", default: INQUIRY, constraints: "INQUIRY | TENTATIVE | DEFINITE | CONFIRMED | COMPLETED | CANCELLED" }
      - { name: billable_count, type: integer, source: computed, description: "max(guarantee_count, actual_attendance) once both knowable, else the best available estimate per §1.3 billable_count; drives per-person charges" }
      - { name: estimated_total_cents, type: integer, source: computed, description: "Forward-looking grand total computed from expected/guarantee figures per §1.3 charge_rollup variant=ESTIMATE" }
      - { name: actualized_total_cents, type: integer, source: computed, description: "Final grand total computed at actualization per §1.3 charge_rollup variant=ACTUAL; null until COMPLETED" }
      - { name: paid_to_date_cents, type: integer, source: computed, description: "Sum of amount_cents over Payment rows in APPLIED status linked to this event" }
      - { name: balance_due_cents, type: integer, source: computed, description: "Outstanding balance per §1.3 balance_due; negative means credit owed to client" }

  # --- Child: a function-room reservation window for the event ------------
  - name: FunctionRoomBooking
    parent: Event
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: event_id, type: string, source: input, description: "FK -> Event.id; owning event" }
      - { name: function_room_id, type: string, source: input, description: "FK -> FunctionRoom.id; reserved room" }
      - { name: start_utc, type: datetime, source: input, description: "Window start, ISO 8601 UTC" }
      - { name: end_utc, type: datetime, source: input, description: "Window end, ISO 8601 UTC; must be strictly after start_utc" }
      - { name: setup_diagram_url, type: string, source: input, description: "Pointer to the room setup diagram", default: null }
      - { name: hold_status, type: enum, source: system, description: "Independent occupancy dimension on the room", default: HOLD, constraints: "HOLD | DEFINITE | RELEASED" }
      - { name: rental_charge_cents, type: integer, source: computed, description: "Room rental for this window per §1.3 room_rental; recomputed when hold_status flips to DEFINITE" }

  # --- Child: an F&B menu line on the event (per-person or consumption) ---
  - name: MenuLine
    parent: Event
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: event_id, type: string, source: input, description: "FK -> Event.id; owning event" }
      - { name: name, type: string, source: input, description: "Menu item label, e.g. 'Plated Filet'" }
      - { name: pricing_mode, type: enum, source: input, description: "PER_PERSON priced off billable_count; CONSUMPTION priced off counted quantity", constraints: "PER_PERSON | CONSUMPTION" }
      - { name: unit_price_cents, type: integer, source: input, description: "Price per cover (PER_PERSON) or per unit consumed (CONSUMPTION)", constraints: ">= 0" }
      - { name: consumption_qty, type: integer, source: input, description: "Counted quantity for CONSUMPTION lines; ignored for PER_PERSON; required for CONSUMPTION", default: null, constraints: ">= 0 when set" }
      - { name: extended_cents, type: integer, source: computed, description: "Line total per §1.3 menu_line_extended; depends on event billable_count for PER_PERSON" }

  # --- Child: an AV / labor / non-F&B service line on the event ----------
  - name: ServiceLine
    parent: Event
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: event_id, type: string, source: input, description: "FK -> Event.id; owning event" }
      - { name: category, type: enum, source: input, description: "AV | LABOR | RENTAL_ITEM", constraints: "AV | LABOR | RENTAL_ITEM" }
      - { name: description, type: string, source: input, description: "Service description, e.g. 'Projector + screen'" }
      - { name: quantity, type: integer, source: input, description: "Units (AV items, labor hours, rental items)", constraints: ">= 1" }
      - { name: unit_price_cents, type: integer, source: input, description: "Price per unit", constraints: ">= 0" }
      - { name: gratuity_eligible, type: boolean, source: input, description: "Whether this service line enters the service-charge + gratuity base", default: false }
      - { name: extended_cents, type: integer, source: computed, description: "quantity * unit_price_cents" }

  # --- Junction: links an Event to a HotelRoomBlock (room-block linkage) --
  - name: RoomBlockLink
    parent: Event
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: event_id, type: string, source: input, description: "FK -> Event.id; owning event" }
      - { name: hotel_room_block_id, type: string, source: input, description: "FK -> HotelRoomBlock.id; linked block" }
      - { name: rooms_reserved, type: integer, source: input, description: "Rooms this event reserves from the block at link time", constraints: ">= 1" }
      - { name: check_in_date, type: string, source: input, description: "First occupied night, ISO date YYYY-MM-DD; inclusive lower bound of the night interval" }
      - { name: check_out_date, type: string, source: input, description: "Departure date, ISO date YYYY-MM-DD; exclusive upper bound — the night of check_out_date is NOT occupied; must be strictly after check_in_date" }
      - { name: rooms_picked_up, type: integer, source: input, description: "Rooms actually picked up; null until pickup recorded", default: null, constraints: "0 <= rooms_picked_up <= rooms_reserved when set" }
      - { name: link_status, type: enum, source: system, description: "RESERVED | PICKED_UP | RELEASED", default: RESERVED, constraints: "RESERVED | PICKED_UP | RELEASED" }

  # --- Child (event log): a payment-schedule milestone -------------------
  - name: PaymentScheduleItem
    parent: Event
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: event_id, type: string, source: input, description: "FK -> Event.id; owning event" }
      - { name: label, type: string, source: input, description: "Milestone label, e.g. 'Deposit', 'Second installment'" }
      - { name: due_date, type: string, source: input, description: "Milestone due date, ISO date YYYY-MM-DD" }
      - { name: amount_due_cents, type: integer, source: input, description: "Amount scheduled for this milestone", constraints: ">= 1" }
      - { name: sequence_no, type: integer, source: system, description: "1-based ordinal assigned at create time, monotonically increasing per event; pins waterfall allocation order" }
      - { name: allocated_cents, type: integer, source: computed, description: "Portion of paid_to_date allocated to this milestone per §1.3 payment_waterfall" }
      - { name: settled, type: boolean, source: computed, description: "true when allocated_cents >= amount_due_cents" }

  # --- Event log: an immutable received payment ---------------------------
  - name: Payment
    parent: Event
    common_fields: false
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC receipt timestamp; pins replay order for waterfall allocation" }
      - { name: event_id, type: string, source: input, description: "FK -> Event.id; owning event" }
      - { name: amount_cents, type: integer, source: input, description: "Payment amount received", constraints: ">= 1" }
      - { name: method, type: enum, source: input, description: "Tender type", constraints: "CARD | ACH | CHECK | WIRE" }
      - { name: status, type: enum, source: system, description: "APPLIED | VOIDED", default: APPLIED, constraints: "APPLIED | VOIDED" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  # --- Event lifecycle: branching with a revision loop -------------------
  - entity: Event
    initial_state: INQUIRY
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: INQUIRY
        to: TENTATIVE
        trigger: "POST /events/{id}/hold"
        actor: SalesManager
        preconditions:
          - "Event has >= 1 FunctionRoomBooking"
          - "Every FunctionRoomBooking on the event is in HOLD or DEFINITE hold_status"
        side_effects:
          - "No charge changes; marks the space as soft-held"

      - from: TENTATIVE
        to: DEFINITE
        trigger: "POST /events/{id}/confirm-space"
        actor: SalesManager
        preconditions:
          - "Event has >= 1 FunctionRoomBooking"
          - "Every FunctionRoomBooking on the event is flipped to DEFINITE hold_status (none left in HOLD)"
        side_effects:
          - "estimated_total_cents recomputed via charge_rollup variant=ESTIMATE"

      - from: DEFINITE
        to: TENTATIVE
        trigger: "POST /events/{id}/reopen"
        actor: SalesManager
        note: "Revision loop — a material scope change drops the event back to TENTATIVE"
        preconditions:
          - "Event.status == DEFINITE"
          - "guarantee_count is still null (guarantee not yet locked)"
        side_effects:
          - "All DEFINITE FunctionRoomBooking rows revert to HOLD hold_status"
          - "estimated_total_cents recomputed via charge_rollup variant=ESTIMATE"

      - from: DEFINITE
        to: CONFIRMED
        trigger: "POST /events/{id}/lock-guarantee"
        actor: BanquetCaptain
        preconditions:
          - "Event.status == DEFINITE"
          - "guarantee_count is provided in the request body and >= 1"
          - "Deposit milestone (sequence_no == 1) is settled (allocated_cents >= amount_due_cents)"
        side_effects:
          - "Sets guarantee_count to the provided value"
          - "billable_count recomputed via billable_count calc"
          - "estimated_total_cents recomputed via charge_rollup variant=ESTIMATE"
          - "Every PER_PERSON MenuLine.extended_cents recomputed via menu_line_extended (cascade: event billable change -> each PER_PERSON line)"

      - from: CONFIRMED
        to: COMPLETED
        trigger: "POST /events/{id}/actualize"
        actor: BanquetCaptain
        preconditions:
          - "Event.status == CONFIRMED"
          - "actual_attendance is provided in the request body and >= 0"
        side_effects:
          - "Sets actual_attendance to the provided value"
          - "billable_count recomputed (now max(guarantee_count, actual_attendance))"
          - "Every PER_PERSON MenuLine.extended_cents recomputed (cascade from billable change)"
          - "actualized_total_cents computed via charge_rollup variant=ACTUAL"
          - "balance_due_cents recomputed via balance_due"
          - "All RESERVED RoomBlockLink rows with no recorded pickup auto-RELEASED (cascade: returns rooms to each block's rooms_available)"

      - from: [INQUIRY, TENTATIVE, DEFINITE, CONFIRMED]
        to: CANCELLED
        trigger: "POST /events/{id}/cancel"
        actor: SalesManager
        preconditions:
          - "Event.status in {INQUIRY, TENTATIVE, DEFINITE, CONFIRMED}"
        side_effects:
          - "All non-RELEASED FunctionRoomBooking rows -> RELEASED (cascade: frees room windows)"
          - "All non-RELEASED RoomBlockLink rows -> RELEASED (cascade: each RELEASED link returns its committed rooms to the block's rooms_available; that block recompute is the second hop)"
          - "estimated_total_cents and actualized_total_cents frozen at last computed value"

  # --- FunctionRoomBooking occupancy: independent HOLD/DEFINITE/RELEASED --
  - entity: FunctionRoomBooking
    initial_state: HOLD
    terminal_states: [RELEASED]
    transitions:
      - from: HOLD
        to: DEFINITE
        trigger: "POST /events/{id}/bookings/{booking_id}/make-definite"
        actor: SalesManager
        preconditions:
          - "Owning Event.status in {TENTATIVE, DEFINITE}"
          - "No other DEFINITE FunctionRoomBooking on the same FunctionRoom overlaps this window once each side is expanded by the room's turnover_buffer_minutes (buffered-overlap rule, §1.4 priority 7)"
        side_effects:
          - "rental_charge_cents recomputed via room_rental"

      - from: DEFINITE
        to: HOLD
        trigger: "POST /events/{id}/reopen (cascade) or POST /events/{id}/bookings/{booking_id}/soften"
        actor: SalesManager
        preconditions:
          - "Owning Event.status in {TENTATIVE, DEFINITE}"
        side_effects:
          - "Frees the buffered window so other rooms/bookings may claim it"

      - from: [HOLD, DEFINITE]
        to: RELEASED
        trigger: "POST /events/{id}/bookings/{booking_id}/release or system (event cancelled)"
        actor: "SalesManager or system"
        preconditions:
          - "Booking.hold_status in {HOLD, DEFINITE}"
        side_effects:
          - "rental_charge_cents set to 0"
          - "Frees the window entirely"

  # --- RoomBlockLink pickup lifecycle ------------------------------------
  - entity: RoomBlockLink
    initial_state: RESERVED
    terminal_states: [RELEASED]
    transitions:
      - from: RESERVED
        to: PICKED_UP
        trigger: "POST /events/{id}/room-block-links/{link_id}/record-pickup"
        actor: AccountingClerk
        preconditions:
          - "0 <= rooms_picked_up <= rooms_reserved in request body"
          - "Owning Event.status in {CONFIRMED, COMPLETED}"
        side_effects:
          - "Sets rooms_picked_up to provided value"
          - "HotelRoomBlock.rooms_committed recomputed: the link now counts rooms_picked_up instead of rooms_reserved (cross-entity, may free rooms back to rooms_available)"

      - from: [RESERVED, PICKED_UP]
        to: RELEASED
        trigger: "POST /events/{id}/room-block-links/{link_id}/release or system (event actualized/cancelled)"
        actor: "AccountingClerk or system"
        preconditions:
          - "RoomBlockLink.link_status in {RESERVED, PICKED_UP}"
        side_effects:
          - "Link stops counting toward HotelRoomBlock.rooms_committed (cross-entity: returns its rooms to rooms_available)"

  # --- Payment append-only log: APPLIED -> VOIDED ------------------------
  - entity: Payment
    initial_state: APPLIED
    terminal_states: [VOIDED]
    transitions:
      - from: APPLIED
        to: VOIDED
        trigger: "POST /events/{id}/payments/{payment_id}/void"
        actor: AccountingClerk
        preconditions:
          - "Payment.status == APPLIED"
          - "Owning Event.status != COMPLETED (cannot void a payment on a closed-out event)"
        side_effects:
          - "Event.paid_to_date_cents recomputed (excludes this payment)"
          - "PaymentScheduleItem allocations re-run via payment_waterfall (cascade: each item's allocated_cents and settled recomputed)"
          - "Event.balance_due_cents recomputed"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: booking-create-stale-event
    parent_entity: Event
    write_endpoint: "POST /events/{id}/bookings"
    occ_field: "expected_event_version"
    description: |
      Creating a FunctionRoomBooking against an Event whose version has
      advanced since the client last observed it is rejected. A new booking
      legitimately changes the event's room-hold composition, so two
      strictly sequential creates that both believe they are appending to
      the same observed event state cannot both be honoured; the one
      carrying the stale version is refused.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: payment-record-stale-event
    parent_entity: Event
    write_endpoint: "POST /events/{id}/payments"
    occ_field: "expected_event_version"
    description: |
      Recording a Payment against an Event whose version has advanced since
      the client last read its balance is rejected. Because each applied
      payment re-runs the payment waterfall and shifts balance_due_cents, a
      payment carrying a stale event version is refused so the client must
      re-read the up-to-date balance before paying again.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: billable_count
    trigger: "event create, lock-guarantee, actualize; read of any PER_PERSON-dependent field"
    algorithm: threshold
    formula: |
      # The headcount per-person charges bill against. Selection is staged:
      if status == COMPLETED:                      # actualized
          billable_count = max(guarantee_count, actual_attendance)
      elif guarantee_count is not null:            # guarantee locked (CONFIRMED+)
          billable_count = ceil(guarantee_count * (1 + overset_pct))
      else:                                        # pre-guarantee estimate
          billable_count = expected_attendance
      # Note: once COMPLETED the overset inflation is dropped — venue bills the
      # larger of the firm guarantee and the real count, NOT the oversetted prep
      # figure. overset only inflates the pre-actual ESTIMATE.
    input_set: "Single event row; guarantee_count and actual_attendance read from the event itself."
    constants: {}
    precision: "integer; ceil() rounds up to whole covers"
    variants:
      - name: ESTIMATE
        when: "status in {DEFINITE, CONFIRMED} (guarantee may be locked, actual not yet counted)"
        difference: "Uses ceil(guarantee_count * (1+overset_pct)) when guarantee locked, else expected_attendance; never reads actual_attendance."
      - name: ACTUAL
        when: "status == COMPLETED"
        difference: "Uses max(guarantee_count, actual_attendance); ignores overset_pct entirely."

  - name: menu_line_extended
    trigger: "menu line create/update; event billable_count change (lock-guarantee, actualize cascade)"
    algorithm: aggregation
    formula: |
      if pricing_mode == PER_PERSON:
          extended_cents = unit_price_cents * event.billable_count
      else:  # CONSUMPTION
          extended_cents = unit_price_cents * consumption_qty
    input_set: "Single menu line plus owning event's billable_count for PER_PERSON."
    constants: {}
    precision: "integer cents; multiplication is exact"

  - name: effective_room_capacity
    trigger: "booking make-definite (capacity gate, §1.4 priority 8)"
    algorithm: aggregation
    formula: |
      # Effective seated capacity of a FunctionRoom under the event's
      # setup_style. SETUP_FACTOR is a fixed table; the result floors to whole
      # seats. The gate fails when effective_capacity < event.billable_count.
      factor = SETUP_FACTOR[event.setup_style]
      effective_capacity = floor(room.max_capacity * factor)
    input_set: "Single FunctionRoom.max_capacity plus the owning event's setup_style and billable_count."
    constants:
      SETUP_FACTOR: { ROUNDS: 0.6, THEATER: 1.0, CLASSROOM: 0.5, RECEPTION: 0.8 }
    precision: "integer seats; floor() after the factor multiply."

  - name: rooms_committed
    trigger: "room-block link create, record-pickup, release; event cancel/actualize cascade"
    algorithm: aggregation
    formula: |
      # A HotelRoomBlock's committed rooms summed across its links. Each link
      # contributes by its OWN status — RESERVED links contribute rooms_reserved
      # (the optimistic hold), PICKED_UP links contribute rooms_picked_up (the
      # realized count), RELEASED links contribute 0.
      rooms_committed = sum(
          link.rooms_reserved   for link in block where link_status == RESERVED
      ) + sum(
          link.rooms_picked_up  for link in block where link_status == PICKED_UP
      )
      rooms_available = block.total_rooms - rooms_committed   # never negative
    input_set: "All RoomBlockLink rows for the block, partitioned by link_status."
    constants: {}
    precision: "integer rooms; exact sums."
    variants:
      - name: RESERVED_HOLD
        when: "link_status == RESERVED — block not yet realized"
        difference: "Counts rooms_reserved (the optimistic reservation figure the client requested)."
      - name: PICKED_UP_ACTUAL
        when: "link_status == PICKED_UP — pickup recorded"
        difference: "Counts rooms_picked_up (the realized figure, which is <= rooms_reserved), freeing the difference back to rooms_available."

  - name: block_night_occupancy
    trigger: "room-block link create (date-windowed capacity gate, §1.4 priority 11)"
    algorithm: interval_merge
    formula: |
      # Aggregate-capacity-over-interval semantics for HotelRoomBlock. Each
      # active link (link_status in {RESERVED, PICKED_UP}) occupies the
      # HALF-OPEN night interval [check_in_date, check_out_date): the night of
      # check_out_date is NOT occupied, so two links that share only a
      # check_out/check_in date (one ends the morning the next begins) do NOT
      # conflict. For a candidate link over nights N, the gate computes, for
      # EACH night n in [check_in_date, check_out_date):
      #   occupied(n) = sum(link.contribution for active links whose
      #                     [check_in_date, check_out_date) contains n)
      #   contribution = rooms_reserved if RESERVED else rooms_picked_up
      # The candidate is admitted only if for every night n in its own range,
      # occupied(n) + candidate.rooms_reserved <= block.total_rooms. Capacity is
      # evaluated PER NIGHT, not over the whole block lifetime, so a link can be
      # admitted on nights that are free even when the block is full on others.
    input_set: "All active RoomBlockLink rows on the block, expanded to per-night occupancy; the candidate link's [check_in_date, check_out_date) range and rooms_reserved."
    constants: {}
    precision: "integer rooms per night; half-open night intervals — shared boundary date does not collide."

  - name: room_rental
    trigger: "booking make-definite, booking create with hold_status=DEFINITE, booking release"
    algorithm: threshold
    formula: |
      if hold_status == RELEASED:
          rental_charge_cents = 0
      else:
          # Charge per STARTED hour: a 2h01m window bills 3 hours.
          duration_minutes = (end_utc - start_utc) in minutes
          billed_hours = ceil(duration_minutes / 60)
          rental_charge_cents = billed_hours * room.hourly_rental_cents
    input_set: "Single booking plus its FunctionRoom.hourly_rental_cents."
    constants: { MINUTES_PER_HOUR: 60 }
    precision: "integer cents; ceil() on hours means a window ending exactly on the hour boundary (duration divisible by 60) bills no extra hour."

  - name: charge_rollup
    trigger: "confirm-space, lock-guarantee, actualize, any menu/service/booking mutation"
    algorithm: tiered_pricing
    formula: |
      # Evaluation order is PINNED. Each subtotal is summed in integer cents,
      # then each percentage is applied to a defined base and rounded
      # round_half_up to the nearest cent BEFORE being added to the running
      # total ("apply-then-round per component", NOT "sum-then-round once").
      fnb_subtotal       = sum(MenuLine.extended_cents)                      # all menu lines
      service_subtotal   = sum(ServiceLine.extended_cents)                   # all service lines
      gratuity_base      = fnb_subtotal + sum(ServiceLine.extended_cents where gratuity_eligible == true)
      rental_subtotal    = sum(FunctionRoomBooking.rental_charge_cents where hold_status != RELEASED)
      service_charge     = round_half_up(gratuity_base * service_charge_pct) # taxable
      gratuity           = round_half_up(gratuity_base * gratuity_pct)       # NOT taxable
      taxable_base       = fnb_subtotal + service_subtotal + rental_subtotal + service_charge
      sales_tax          = round_half_up(taxable_base * sales_tax_pct)
      grand_total_cents  = fnb_subtotal + service_subtotal + rental_subtotal
                           + service_charge + gratuity + sales_tax
    input_set: "All non-RELEASED bookings, all menu lines, all service lines on the event. billable_count per the active variant feeds menu_line_extended first."
    constants: {}
    precision: "round_half_up to whole cents, applied independently to service_charge, gratuity, and sales_tax in that order; line subtotals are exact integer sums."
    variants:
      - name: ESTIMATE
        when: "writes Event.estimated_total_cents; status in {DEFINITE, CONFIRMED}"
        difference: "MenuLine PER_PERSON lines use billable_count variant=ESTIMATE (expected_attendance or oversetted guarantee)."
      - name: ACTUAL
        when: "writes Event.actualized_total_cents; status == COMPLETED"
        difference: "MenuLine PER_PERSON lines use billable_count variant=ACTUAL (max(guarantee, actual)); produces a different grand total for the same line/service/rental rows whenever actual != oversetted-guarantee."

  - name: payment_waterfall
    trigger: "payment apply, payment void, payment-schedule item create"
    algorithm: waterfall_allocation
    formula: |
      # Distribute total APPLIED payments across schedule items in
      # sequence_no ASC order (the create-time ordinal), filling each item to
      # its amount_due_cents before spilling into the next.
      pool = sum(Payment.amount_cents where status == APPLIED)   # = paid_to_date_cents
      for item in PaymentScheduleItem order by sequence_no ASC:  # tie-break impossible: sequence_no is unique
          take = min(pool, item.amount_due_cents)
          item.allocated_cents = take
          item.settled = (take >= item.amount_due_cents)
          pool -= take
      # Any pool remaining after the last item is unallocated overpayment
      # (surfaces as negative balance_due_cents).
    input_set: "All APPLIED Payment rows for the event (sum), all PaymentScheduleItem rows ordered by sequence_no ASC."
    constants: {}
    precision: "integer cents; allocation is exact, no rounding."

  - name: balance_due
    trigger: "payment apply/void, lock-guarantee, actualize, charge_rollup recompute"
    algorithm: aggregation
    formula: |
      if status == COMPLETED:
          total = actualized_total_cents
      else:
          total = estimated_total_cents
      balance_due_cents = total - paid_to_date_cents   # negative => credit owed to client
    input_set: "Active event total (estimate vs actual by status) minus paid_to_date_cents."
    constants: {}
    precision: "integer cents; subtraction is exact."

# =============================================================================
# §1.4 Validation Rules Table (Ordered by Priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and X-User-Role is a known role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "Acting role is permitted to perform this operation per §1.7 RBAC matrix"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "Every path-referenced resource exists, validated left-to-right (event before booking/link/payment); body FKs (function_room_id, hotel_room_block_id) resolve"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all

  - priority: 4
    category: existence
    check: "Request body present and required fields supplied with correct types; enum values in declared domain"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all writes"

  - priority: 5
    category: state
    check: "Target resource is in a valid state for the requested transition (e.g. lock-guarantee requires Event.status == DEFINITE; void requires Payment.status == APPLIED)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all transition endpoints"

  - priority: 6
    category: state
    check: "OCC: expected_event_version (when required by the endpoint) equals the event's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /events/{id}/bookings, POST /events/{id}/payments"

  - priority: 7
    category: business_temporal
    check: "make-definite (FunctionRoom, PAIRWISE BUFFERED EXCLUSION semantics): the candidate booking's window expanded by the room's turnover_buffer_minutes on BOTH sides — [start_utc - buffer, end_utc + buffer] — must not intersect the RAW window of any OTHER DEFINITE booking on the same FunctionRoom. Two windows sharing only an endpoint after buffer expansion (expanded-start == other-end) do NOT collide (strict-inequality overlap)."
    error_id: ERR_ROOM_DOUBLE_BOOKED
    http_status: 409
    applies_to: "POST /events/{id}/bookings/{booking_id}/make-definite"

  - priority: 8
    category: business_constraint
    check: "Effective room capacity for the event's setup_style must be >= billable_count when making a booking DEFINITE (capacity gate)"
    error_id: ERR_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /events/{id}/bookings/{booking_id}/make-definite"

  - priority: 9
    category: business_constraint
    check: "MenuLine of pricing_mode CONSUMPTION must supply consumption_qty; PER_PERSON must omit it"
    error_id: ERR_PRICING_MODE_FIELD_MISMATCH
    http_status: 422
    applies_to: "POST /events/{id}/menu-lines"

  - priority: 10
    category: business_constraint
    check: "record-pickup: rooms_picked_up must be within [0, rooms_reserved]"
    error_id: ERR_PICKUP_EXCEEDS_RESERVED
    http_status: 422
    applies_to: "POST /events/{id}/room-block-links/{link_id}/record-pickup"

  - priority: 11
    category: business_referential
    check: "RoomBlockLink create (HotelRoomBlock, AGGREGATE-CAPACITY-OVER-INTERVAL semantics): for EVERY night n in the candidate's half-open range [check_in_date, check_out_date), the sum of active-link contributions occupying night n plus the candidate's rooms_reserved must not exceed block.total_rooms (per block_night_occupancy). check_out_date is exclusive, so a link checking out the morning another checks in shares no occupied night."
    error_id: ERR_BLOCK_INSUFFICIENT_ROOMS
    http_status: 409
    applies_to: "POST /events/{id}/room-block-links"

  - priority: 12
    category: business_constraint
    check: "lock-guarantee: the deposit milestone (sequence_no == 1) must be settled before the guarantee may be locked"
    error_id: ERR_DEPOSIT_UNSETTLED
    http_status: 409
    applies_to: "POST /events/{id}/lock-guarantee"

  - priority: 13
    category: business_fiscal
    check: "void: a payment may not be voided if doing so would leave a settled deposit milestone unsettled on a CONFIRMED event (deposit cannot be clawed back post-confirmation)"
    error_id: ERR_DEPOSIT_LOCKED
    http_status: 409
    applies_to: "POST /events/{id}/payments/{payment_id}/void"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Test-driving: logical clock --------------------------------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server logical clock used for all 'now' reads. Server startup default is 2026-01-01T00:00:00Z; before any call here the clock reads exactly that default and never falls back to wall-clock time."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: datetime }"
    side_effects: ["Sets the logical clock to the provided instant"]

  # --- FunctionRoom (shared resource) -----------------------------------
  - method: POST
    path: "/function-rooms"
    description: "Create a function room"
    roles: [PlatformAdmin, SalesManager]
    code: 201
    input: [name, max_capacity, "turnover_buffer_minutes?", hourly_rental_cents]
    output: FunctionRoom
    side_effects: ["status=ACTIVE"]

  - method: GET
    path: "/function-rooms/{id}"
    description: "Get a function room"
    roles: [PlatformAdmin, SalesManager, BanquetCaptain, AccountingClerk]
    code: 200
    input: []
    output: FunctionRoom
    side_effects: []

  - method: GET
    path: "/function-rooms"
    description: "List function rooms (paginated)"
    roles: [PlatformAdmin, SalesManager, BanquetCaptain, AccountingClerk]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: FunctionRoom[]
    side_effects: []

  - method: GET
    path: "/function-rooms/{id}/bookings"
    description: "List bookings on this function room (reverse-reachability for FunctionRoomBooking.function_room_id)"
    roles: [PlatformAdmin, SalesManager, BanquetCaptain, AccountingClerk]
    code: 200
    input: ["limit?", "offset?"]
    output: FunctionRoomBooking[]
    side_effects: []

  # --- HotelRoomBlock (shared resource) ---------------------------------
  - method: POST
    path: "/hotel-room-blocks"
    description: "Create a hotel room block"
    roles: [PlatformAdmin, SalesManager]
    code: 201
    input: [block_name, total_rooms, nightly_rate_cents]
    output: HotelRoomBlock
    side_effects: ["rooms_committed=0, rooms_available=total_rooms"]

  - method: GET
    path: "/hotel-room-blocks/{id}"
    description: "Get a hotel room block with computed rooms_committed / rooms_available"
    roles: [PlatformAdmin, SalesManager, BanquetCaptain, AccountingClerk]
    code: 200
    input: []
    output: HotelRoomBlock
    side_effects: []

  - method: GET
    path: "/hotel-room-blocks"
    description: "List hotel room blocks (paginated)"
    roles: [PlatformAdmin, SalesManager, BanquetCaptain, AccountingClerk]
    code: 200
    input: ["limit?", "offset?"]
    output: HotelRoomBlock[]
    side_effects: []

  - method: GET
    path: "/hotel-room-blocks/{id}/room-block-links"
    description: "List links on this hotel room block (reverse-reachability for RoomBlockLink.hotel_room_block_id)"
    roles: [PlatformAdmin, SalesManager, BanquetCaptain, AccountingClerk]
    code: 200
    input: ["limit?", "offset?"]
    output: RoomBlockLink[]
    side_effects: []

  # --- Event lifecycle ---------------------------------------------------
  - method: POST
    path: "/events"
    description: "Create an event inquiry"
    roles: [SalesManager]
    code: 201
    input: [account_name, event_date, setup_style, expected_attendance, "overset_pct?", "service_charge_pct?", "gratuity_pct?", "sales_tax_pct?"]
    output: Event
    side_effects: ["status=INQUIRY, guarantee_count=null, actual_attendance=null, all totals computed from empty children (0)"]

  - method: GET
    path: "/events/{id}"
    description: "Get an event with all computed totals (billable_count, estimated_total_cents, actualized_total_cents, paid_to_date_cents, balance_due_cents)"
    roles: [PlatformAdmin, SalesManager, BanquetCaptain, AccountingClerk]
    code: 200
    input: []
    output: Event
    side_effects: []

  - method: GET
    path: "/events"
    description: "List events (paginated, filterable by status)"
    roles: [PlatformAdmin, SalesManager, BanquetCaptain, AccountingClerk]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: Event[]
    side_effects: []

  - method: POST
    path: "/events/{id}/hold"
    description: "INQUIRY -> TENTATIVE: place a soft space hold"
    roles: [SalesManager]
    code: 200
    input: []
    output: Event
    side_effects: ["status -> TENTATIVE"]

  - method: POST
    path: "/events/{id}/confirm-space"
    description: "TENTATIVE -> DEFINITE: confirm all bookings are DEFINITE"
    roles: [SalesManager]
    code: 200
    input: []
    output: Event
    side_effects: ["status -> DEFINITE", "estimated_total_cents recomputed (charge_rollup ESTIMATE)"]

  - method: POST
    path: "/events/{id}/reopen"
    description: "DEFINITE -> TENTATIVE: revision loop; revert bookings to HOLD"
    roles: [SalesManager]
    code: 200
    input: []
    output: Event
    side_effects: ["status -> TENTATIVE", "all DEFINITE bookings -> HOLD", "estimated_total_cents recomputed"]

  - method: POST
    path: "/events/{id}/lock-guarantee"
    description: "DEFINITE -> CONFIRMED: lock guarantee_count (deposit must be settled)"
    roles: [BanquetCaptain]
    code: 200
    input: [guarantee_count]
    output: Event
    side_effects: ["sets guarantee_count", "status -> CONFIRMED", "billable_count + estimated_total_cents recomputed", "every PER_PERSON MenuLine.extended_cents recomputed (cascade)"]

  - method: POST
    path: "/events/{id}/actualize"
    description: "CONFIRMED -> COMPLETED: record actual_attendance and finalize charges"
    roles: [BanquetCaptain]
    code: 200
    input: [actual_attendance]
    output: Event
    side_effects: ["sets actual_attendance", "status -> COMPLETED", "billable_count + actualized_total_cents + balance_due_cents recomputed", "every PER_PERSON MenuLine.extended_cents recomputed (cascade)", "RESERVED RoomBlockLink rows with no pickup auto-RELEASED (cascade to blocks)"]

  - method: POST
    path: "/events/{id}/cancel"
    description: "Any non-terminal -> CANCELLED with full unwind"
    roles: [SalesManager]
    code: 200
    input: []
    output: Event
    side_effects: ["status -> CANCELLED", "all non-RELEASED bookings -> RELEASED", "all non-RELEASED room-block links -> RELEASED (cascade returns rooms to blocks)"]

  # --- FunctionRoomBooking ----------------------------------------------
  - method: POST
    path: "/events/{id}/bookings"
    description: "Create a function-room booking window on the event (OCC-guarded on the event)"
    roles: [SalesManager]
    code: 201
    input: [function_room_id, start_utc, end_utc, "setup_diagram_url?", expected_event_version]
    output: FunctionRoomBooking
    side_effects: ["hold_status=HOLD", "rental_charge_cents computed via room_rental", "increments Event.version by 1"]

  - method: GET
    path: "/events/{id}/bookings"
    description: "List bookings for an event (reverse-reachability for FunctionRoomBooking.event_id)"
    roles: [PlatformAdmin, SalesManager, BanquetCaptain, AccountingClerk]
    code: 200
    input: ["limit?", "offset?"]
    output: FunctionRoomBooking[]
    side_effects: []

  - method: GET
    path: "/bookings"
    description: "List bookings filtered by function_room_id (reverse-reachability for FunctionRoomBooking.function_room_id) or event_id"
    roles: [PlatformAdmin, SalesManager, BanquetCaptain, AccountingClerk]
    code: 200
    input: ["function_room_id?", "event_id?", "limit?", "offset?"]
    output: FunctionRoomBooking[]
    side_effects: []

  - method: GET
    path: "/events/{id}/bookings/{booking_id}"
    description: "Get one booking"
    roles: [PlatformAdmin, SalesManager, BanquetCaptain, AccountingClerk]
    code: 200
    input: []
    output: FunctionRoomBooking
    side_effects: []

  - method: POST
    path: "/events/{id}/bookings/{booking_id}/make-definite"
    description: "HOLD -> DEFINITE: claim the buffered window (overlap + capacity gates)"
    roles: [SalesManager]
    code: 200
    input: []
    output: FunctionRoomBooking
    side_effects: ["hold_status -> DEFINITE", "rental_charge_cents recomputed"]

  - method: POST
    path: "/events/{id}/bookings/{booking_id}/soften"
    description: "DEFINITE -> HOLD: release the buffered window without releasing the booking"
    roles: [SalesManager]
    code: 200
    input: []
    output: FunctionRoomBooking
    side_effects: ["hold_status -> HOLD"]

  - method: POST
    path: "/events/{id}/bookings/{booking_id}/release"
    description: "HOLD|DEFINITE -> RELEASED: drop the booking and zero its rental"
    roles: [SalesManager]
    code: 200
    input: []
    output: FunctionRoomBooking
    side_effects: ["hold_status -> RELEASED", "rental_charge_cents=0"]

  # --- MenuLine ----------------------------------------------------------
  - method: POST
    path: "/events/{id}/menu-lines"
    description: "Add an F&B menu line (per-person or consumption)"
    roles: [SalesManager]
    code: 201
    input: [name, pricing_mode, unit_price_cents, "consumption_qty?"]
    output: MenuLine
    side_effects: ["extended_cents computed via menu_line_extended", "event estimated_total_cents recomputed"]

  - method: GET
    path: "/events/{id}/menu-lines"
    description: "List menu lines for an event (reverse-reachability for MenuLine.event_id)"
    roles: [PlatformAdmin, SalesManager, BanquetCaptain, AccountingClerk]
    code: 200
    input: ["limit?", "offset?"]
    output: MenuLine[]
    side_effects: []

  - method: DELETE
    path: "/events/{id}/menu-lines/{menu_line_id}"
    description: "Remove a menu line (only while event not terminal)"
    roles: [SalesManager]
    code: 204
    input: []
    output: null
    side_effects: ["event estimated_total_cents recomputed"]

  # --- ServiceLine -------------------------------------------------------
  - method: POST
    path: "/events/{id}/service-lines"
    description: "Add an AV / labor / rental-item service line"
    roles: [SalesManager]
    code: 201
    input: [category, description, quantity, unit_price_cents, "gratuity_eligible?"]
    output: ServiceLine
    side_effects: ["extended_cents = quantity * unit_price_cents", "event estimated_total_cents recomputed"]

  - method: GET
    path: "/events/{id}/service-lines"
    description: "List service lines for an event (reverse-reachability for ServiceLine.event_id)"
    roles: [PlatformAdmin, SalesManager, BanquetCaptain, AccountingClerk]
    code: 200
    input: ["limit?", "offset?"]
    output: ServiceLine[]
    side_effects: []

  - method: DELETE
    path: "/events/{id}/service-lines/{service_line_id}"
    description: "Remove a service line (only while event not terminal)"
    roles: [SalesManager]
    code: 204
    input: []
    output: null
    side_effects: ["event estimated_total_cents recomputed"]

  # --- RoomBlockLink -----------------------------------------------------
  - method: POST
    path: "/events/{id}/room-block-links"
    description: "Link the event to a hotel room block and reserve rooms over a night range (per-night aggregate-capacity gate)"
    roles: [SalesManager, AccountingClerk]
    code: 201
    input: [hotel_room_block_id, rooms_reserved, check_in_date, check_out_date]
    output: RoomBlockLink
    side_effects: ["link_status=RESERVED", "HotelRoomBlock.rooms_committed/rooms_available recomputed (cross-entity)"]

  - method: GET
    path: "/events/{id}/room-block-links"
    description: "List room-block links for an event (reverse-reachability for RoomBlockLink.event_id)"
    roles: [PlatformAdmin, SalesManager, BanquetCaptain, AccountingClerk]
    code: 200
    input: ["limit?", "offset?"]
    output: RoomBlockLink[]
    side_effects: []

  - method: GET
    path: "/room-block-links"
    description: "List room-block links filtered by hotel_room_block_id (reverse-reachability for RoomBlockLink.hotel_room_block_id) or event_id"
    roles: [PlatformAdmin, SalesManager, BanquetCaptain, AccountingClerk]
    code: 200
    input: ["hotel_room_block_id?", "event_id?", "limit?", "offset?"]
    output: RoomBlockLink[]
    side_effects: []

  - method: POST
    path: "/events/{id}/room-block-links/{link_id}/record-pickup"
    description: "RESERVED -> PICKED_UP: record actual rooms picked up"
    roles: [AccountingClerk]
    code: 200
    input: [rooms_picked_up]
    output: RoomBlockLink
    side_effects: ["link_status -> PICKED_UP", "sets rooms_picked_up", "HotelRoomBlock.rooms_committed/rooms_available recomputed (cross-entity)"]

  - method: POST
    path: "/events/{id}/room-block-links/{link_id}/release"
    description: "RESERVED|PICKED_UP -> RELEASED: return rooms to the block"
    roles: [AccountingClerk]
    code: 200
    input: []
    output: RoomBlockLink
    side_effects: ["link_status -> RELEASED", "HotelRoomBlock.rooms_committed/rooms_available recomputed (cross-entity)"]

  # --- PaymentScheduleItem ----------------------------------------------
  - method: POST
    path: "/events/{id}/payment-schedule-items"
    description: "Add a payment-schedule milestone (sequence_no assigned in create order)"
    roles: [AccountingClerk]
    code: 201
    input: [label, due_date, amount_due_cents]
    output: PaymentScheduleItem
    side_effects: ["sequence_no assigned (1-based, monotonically increasing per event)", "payment_waterfall re-run", "allocated_cents/settled recomputed"]

  - method: GET
    path: "/events/{id}/payment-schedule-items"
    description: "List schedule milestones for an event (reverse-reachability for PaymentScheduleItem.event_id)"
    roles: [PlatformAdmin, SalesManager, BanquetCaptain, AccountingClerk]
    code: 200
    input: ["limit?", "offset?"]
    output: PaymentScheduleItem[]
    side_effects: []

  # --- Payment (event log) ----------------------------------------------
  - method: POST
    path: "/events/{id}/payments"
    description: "Record a received payment (OCC-guarded on the event; re-runs the waterfall)"
    roles: [AccountingClerk]
    code: 201
    input: [amount_cents, method, expected_event_version]
    output: Payment
    side_effects: ["status=APPLIED", "Event.paid_to_date_cents recomputed", "payment_waterfall re-run", "Event.balance_due_cents recomputed", "increments Event.version by 1"]

  - method: GET
    path: "/events/{id}/payments"
    description: "List payments for an event (reverse-reachability for Payment.event_id)"
    roles: [PlatformAdmin, SalesManager, BanquetCaptain, AccountingClerk]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: Payment[]
    side_effects: []

  - method: POST
    path: "/events/{id}/payments/{payment_id}/void"
    description: "APPLIED -> VOIDED: reverse a payment and re-run the waterfall"
    roles: [AccountingClerk]
    code: 200
    input: []
    output: Payment
    side_effects: ["status -> VOIDED", "Event.paid_to_date_cents recomputed", "payment_waterfall re-run", "Event.balance_due_cents recomputed"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/unknown X-User-Role or missing X-User-ID header" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Authenticated role not permitted for this operation per §1.7" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path resource or body-referenced FK does not exist" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed body, missing required field, wrong type, or out-of-domain enum / out-of-range constraint" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Target resource not in a valid state for the requested transition" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_event_version does not match the event's current version (OCC)" }
  - { id: ERR_ROOM_DOUBLE_BOOKED, http: 409, condition: "make-definite would overlap another DEFINITE booking on the same room once the room's turnover buffer is applied" }
  - { id: ERR_CAPACITY_EXCEEDED, http: 409, condition: "Effective room capacity for the event's setup_style is below billable_count at make-definite" }
  - { id: ERR_PRICING_MODE_FIELD_MISMATCH, http: 422, condition: "CONSUMPTION menu line missing consumption_qty, or PER_PERSON line supplied consumption_qty" }
  - { id: ERR_PICKUP_EXCEEDS_RESERVED, http: 422, condition: "rooms_picked_up outside [0, rooms_reserved]" }
  - { id: ERR_BLOCK_INSUFFICIENT_ROOMS, http: 409, condition: "rooms_reserved exceeds the block's current rooms_available at link time" }
  - { id: ERR_DEPOSIT_UNSETTLED, http: 409, condition: "lock-guarantee attempted before the deposit milestone (sequence_no==1) is settled" }
  - { id: ERR_DEPOSIT_LOCKED, http: 409, condition: "void would unsettle the deposit milestone on a CONFIRMED event" }
  - { id: ERR_GUARANTEE_REQUIRED, http: 422, condition: "lock-guarantee called without a guarantee_count >= 1 in the body" }
  - { id: ERR_NO_BOOKINGS, http: 409, condition: "hold/confirm-space attempted with no non-RELEASED FunctionRoomBooking on the event" }
  - { id: ERR_BOOKING_NOT_ALL_DEFINITE, http: 409, condition: "confirm-space attempted while at least one booking is still in HOLD" }
  - { id: ERR_EVENT_TERMINAL, http: 409, condition: "Mutation attempted on a COMPLETED or CANCELLED event (line edits, voids on closed events)" }
  - { id: ERR_VALIDATION_RANGE, http: 422, condition: "A percentage field (overset_pct, service_charge_pct, gratuity_pct, sales_tax_pct) is outside its allowed range" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Operational override; manages shared resources (rooms, blocks) and the logical clock. Cannot drive event sales workflow transitions."
    identity: opaque
    exclusive_operations:
      - "POST /_clock/set_current_utc — set logical clock"
    shared_operations:
      - "POST /function-rooms — create function room (with SalesManager)"
      - "POST /hotel-room-blocks — create hotel room block (with SalesManager)"
      - "GET (all read endpoints)"

  - name: SalesManager
    description: "Owns the event sales lifecycle: inquiry, space hold, room bookings, menu and service lines, cancellation. Acts as the booking author."
    identity: opaque
    exclusive_operations:
      - "POST /events — create inquiry"
      - "POST /events/{id}/hold, /confirm-space, /reopen, /cancel — sales lifecycle"
      - "POST /events/{id}/bookings and booking make-definite/soften/release"
      - "POST/DELETE /events/{id}/menu-lines, /events/{id}/service-lines"
    shared_operations:
      - "POST /function-rooms, /hotel-room-blocks (with PlatformAdmin)"
      - "POST /events/{id}/room-block-links (with AccountingClerk)"
      - "GET (all read endpoints)"

  - name: BanquetCaptain
    description: "Owns guarantee locking and post-event actualization (day-of operations). Cannot create inquiries or edit pricing lines."
    identity: opaque
    exclusive_operations:
      - "POST /events/{id}/lock-guarantee — DEFINITE -> CONFIRMED"
      - "POST /events/{id}/actualize — CONFIRMED -> COMPLETED"
    shared_operations:
      - "GET (all read endpoints)"

  - name: AccountingClerk
    description: "Owns deposits, payment schedule, payments, and room-block pickup/release accounting. Cannot drive sales or guarantee transitions."
    identity: opaque
    exclusive_operations:
      - "POST /events/{id}/payment-schedule-items"
      - "POST /events/{id}/payments and payment void"
      - "POST /events/{id}/room-block-links/{lid}/record-pickup, /release"
    shared_operations:
      - "POST /events/{id}/room-block-links (with SalesManager)"
      - "GET (all read endpoints)"
