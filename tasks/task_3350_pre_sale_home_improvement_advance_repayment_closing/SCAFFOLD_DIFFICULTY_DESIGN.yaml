              as_user_id: "${agent_id}"
              captures: { project_id: $.data.id }
            - call: "POST /concierge/cases/${case_id}/projects/${project_id}/propose"
              payload: {}
              as: ListingAgent
              as_user_id: "${agent_id}"
            - call: "POST /concierge/cases/${case_id}/projects/${project_id}/approve"
              payload: {}
              as: Homeowner
            - call: "POST /concierge/engagements"
              payload: { improvement_project_id: "${project_id}", vendor_id: "${vendor_id}", agreed_price_cents: 5000000, start_date: "2026-09-05T00:00:00Z", end_date: "2026-09-10T00:00:00Z" }
