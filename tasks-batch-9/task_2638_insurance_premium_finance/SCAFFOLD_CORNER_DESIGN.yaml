            - "no verification row carries a `version` field and §1.5 declares no PUT, PATCH or DELETE on any /verifications path, so superseding is the only mutation channel"
            - "the party == 'INSURER' filter returns total_count == 1, so superseded rows remain listable and filterable rather than being hidden"

