        distinguishing_aspect: "Six roles, and every one of them has at least one endpoint no other role can reach. A single walk exercises the exclusive column of all six: Registrar mints the term, the people and the enrollment plus its DROP; LmsAdmin provisions the shell and flips the term posture; the owning Instructor grades, records a submission and patches the item; PrivacyReviewer and AccessibilityReviewer each post the one review dimension bound to their role; Student's sole exclusive write (POST /grade-disputes) is exercised positively by errors/an_open_dispute_blocks_the_term_from_closing_until_it_is_resolved. An implementation that shares one permission list across roles, or that hard-codes a single admin role for everything, cannot satisfy all ten trigger calls at once."
