          trigger:
            - call: "POST /batches/${b2_id}/assignments"
              payload: { expected_batch_version: "${b2_v}", reviewer_id: "${ra_id}", pass_type: "FIRST_PASS" }
              as: StaffingCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409 with response.data.error_id == \"ERR_CREDENTIAL_NOT_VERIFIED\""
            - "the response is NOT ERR_REVIEWER_CAPACITY_EXCEEDED, even though active_assignment_count 1 already equals max_concurrent_batches 1"
            - "the response is NOT ERR_MIN_STAFFING_UNMET: Reviewer B still counts, so Matter.${m_id}.staffed_reviewer_count == 1 and status == IN_REVIEW"
            - "Reviewer.${ra_id}.credential_status == LAPSED while engagement_status is still ENGAGED — the two axes moved independently"
