          - state_machines.ScreeningReport.RE_DELIVERED_to_UNDER_DISPUTE
        distinguishing_aspect: |
          Cyclic machine on ScreeningReport (different entity from the application instance): the report
          loops DELIVERED -> UNDER_DISPUTE -> AMENDED -> RE_DELIVERED -> UNDER_DISPUTE when a second
          dispute is filed after correction and re-delivery — a cycle, not a pipeline.
        test_recipe:
          setup:
            - "CA landlord with published criteria; one CA application (rent 200000, income 600000, credit 700) whose report carries two INCLUDED eviction records (2024-03-01 and 2024-04-01) and is DELIVERED; search originated by screener scr-1"
