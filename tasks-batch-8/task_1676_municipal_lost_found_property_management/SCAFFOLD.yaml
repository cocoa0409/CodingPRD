    code: 204
    input: []
    output: null
    side_effects: ["Item LOTTED -> AUCTION_ELIGIBLE", "LotItem row deleted", "recompute lot_minimum_bid", "increments AuctionLot.version by 1", "increments Item.version by 1"]
  - method: GET
    path: "/auction-lots/{lot_id}/items"
    description: "List LotItem rows of a lot."
    roles: [IntakeOfficer, PropertyCustodian, ClaimsExaminer, ReleaseOfficer, PoliceLiaison, AuctionCoordinator, ProgramAdmin]
    code: 200
