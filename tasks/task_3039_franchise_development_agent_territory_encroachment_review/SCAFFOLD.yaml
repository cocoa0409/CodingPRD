    input: [store_number, territory_id, franchisee_id, address, geo_lat, geo_lng, opened_on, estimated_weekly_sales_cents, actual_avg_weekly_sales_cents]
    output: Store
    side_effects: ["status=OPEN; franchisee PROSPECT->ACTIVE; Territory.open_store_count recomputed"]
  - method: GET
    path: "/stores/{id}"
    description: "Get a store"
    roles: [FranchisorOps, DevelopmentAgent, Franchisee]
    code: 200
    input: []
    output: Store
    side_effects: []
  - method: POST
    path: "/stores/{id}/open"
    description: "Open a PIPELINE store"
    roles: [FranchisorOps]
    code: 200
    input: []
    output: Store
    side_effects: ["PIPELINE->OPEN; increments Store.version by 1"]
  - method: POST
    path: "/stores/{id}/terminate"
    description: "Terminate a TERMINATION_PENDING store"
    roles: [FranchisorOps]
    code: 200
    input: []
    output: Store
    side_effects: ["TERMINATION_PENDING->TERMINATED; open mandates WAIVED; increments Store.version by 1"]
  - method: GET
    path: "/stores/{id}/site-applications"
    description: "List site applications that produced this store"
    roles: [FranchisorOps, DevelopmentAgent]
    code: 200
    input: []
