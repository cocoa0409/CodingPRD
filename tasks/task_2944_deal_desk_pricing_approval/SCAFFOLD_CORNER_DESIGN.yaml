  - section: errors
    instances:
      - name: exception_acceptance_below_the_absolute_margin_floor_is_rejected
        claim_type: violation_to_error
        grounds:
          - errors.ERR_ABSOLUTE_MARGIN_FLOOR_BREACH
          - state_machines.CompetitiveException.SUBMITTED_to_ACCEPTED
          - calculations.C4_margin_and_exception_allowance
        distinguishing_aspect: |
          The absolute floor is a hard stop no exception can buy through: a 5% discount on
          Implementation Services drops final_margin_pct to 0.210526, below absolute_margin_floor_pct
          0.22, so the acceptance is rejected with ERR_ABSOLUTE_MARGIN_FLOOR_BREACH (422) even though the
          quote is genuinely under the ordinary 0.35 floor and the account allowance is untouched at 0.
        test_recipe:
          setup:
            - "The base configuration and account from the anchored chain; margin_floor_pct 0.35, absolute_margin_floor_pct 0.22, exception_allowance_cents 4000000."
            - "One DRAFT quote, term_months 12, payment_terms_days 30, with a single Implementation Services line of quantity 10 at requested_discount_pct 0.05: list 2000000, cost 1500000, final_net_total 1900000, final_margin_pct 0.210526."
            - "One CompetitiveException filed on that quote by u-rep-1, status SUBMITTED."
          setup_api_calls:
            - *cb_clock
            - *cb_policy
            - *cb_t1
            - *cb_t2
            - *cb_t3
            - *cb_t4
            - *cb_activate
            - *cb_core
            - *cb_sup
            - *cb_svc
            - *cb_usg
            - *cb_vt1
            - *cb_vt2
            - *cb_vt3
            - *cb_bundle
            - *cb_account
            - call: "POST /quotes"
              payload: { account_id: "${acct_id}", title: "Northwind Services Deep Cut", term_months: 12, payment_terms_days: 30 }
              as: SalesRep
              as_user_id: "u-rep-1"
              captures: { q_id: $.data.id }
