            - "Offering.accepted_shares == 10000"
            - "PlatformAccount.balance_cents == 15000000 and investor_funds_held_cents == 15000000, so the balance still equals the segregated total"
            - "collected_subscription_cents over both subscriptions minus refunded_cents over both subscriptions == 15000000, so the named quantity is unchanged by the forward-withdraw pair"

      - name: account_debits_never_let_the_conserved_balance_go_negative
        grounds:
          - calculations.platform_cash_invariant
          - validations[priority=12]
          - errors.ERR_ACCOUNT_UNDERFUNDED
          - entities.PlatformAccount.fields.balance_cents
          - endpoints.POST_/api/offerings/{id}/distributions/{distributionId}/pay
