            - call: "POST /registry/collection-bookings"
              payload: { workup_case_id: "${wc_id}", collection_center_id: "${ctr_id}", start_at: "2026-10-12T08:00:00Z", expected_workup_case_version: "${wc_ver2}" }
              as: CollectionCenterOps
              as_user_id: "${ctr_id}"
              captures: { bk2_id: "$.data.id" }
          assert:
            - "at workup open the case had clearance_status PENDING and logistics_status UNSCHEDULED"
            - "after the method decision the case had logistics_status METHOD_SET while clearance_status was still PENDING and planned_window_days == 6"
            - "after the first PASS the case had clearance_status IN_PROGRESS and logistics_status still METHOD_SET"
            - "after the third PASS the case had clearance_status CLEARED and logistics_status still METHOD_SET"
            - "creating the first booking moved logistics_status to BOOKED; confirming it left logistics_status at BOOKED (confirmation is a CollectionBooking-only transition)"
            - "after the cancel WorkupCase.${wc_id}.logistics_status == METHOD_SET (backwards edge), clearance_status == CLEARED, case_status == OPEN"
            - "CollectionBooking.${bk1_id}.status == CANCELLED with cancelled_after_confirmation == true"
            - "the replacement booking returns 201 and WorkupCase.${wc_id}.logistics_status == BOOKED again"
            - "CollectionBooking.${bk2_id}.collection_date == \"2026-10-12\" and status == HELD"

      - name: match_candidate_cycles_typing_expired_twice_before_terminal_exclusion
        grounds:
          - state_machines.MatchCandidate.TYPING_REQUESTED_to_TYPING_EXPIRED
          - state_machines.MatchCandidate.TYPING_EXPIRED_to_TYPING_REQUESTED
          - state_machines.MatchCandidate.TYPING_EXPIRED_to_EXCLUDED
          - entities.MatchCandidate.fields.ct_attempt_count
          - calculations.ct_deadline_and_expiry_sweep
        distinguishing_aspect: |
          Non-linear on MatchCandidate in a different way and on a different entity than the WorkupCase
          instance: the candidate walks a genuine cycle TYPING_REQUESTED -> TYPING_EXPIRED ->
          TYPING_REQUESTED, and the SAME sweep trigger produces two different destinations depending on
          the loop counter - TYPING_EXPIRED while ct_attempt_count == 1, but the terminal EXCLUDED once
          ct_attempt_count == MAX_CT_ATTEMPTS, which additionally fires the promotion cascade.
