              as: ProductionPlanner
              captures: { disp: $.data.disposition }
            - call: "POST /toolworks/production-lots/${lot_id}/release"
              payload: { expected_sku_version: "${sku_v}" }
              as: ProductionPlanner
              captures: { e_already: $.data.error_id }
          assert:
            - "pinned_torque == 115.8 and every one of the four mandatory runs is 'PASSED': h1_mean == 50.2 margin 0.40, pt margin 10.97, dm margin 33.33, ss margin 25.00"
            - "The first certify returns HTTP 422 with error_id == 'ERR_HARDNESS_MARGIN_NOT_MET' — pooled 50.20 < 50.0 + 1.0 despite every run passing its own requirement"
            - "ProductionLot.${lot_id}.cert_status is still 'IN_TEST' and certified_at is null after the refusal"
            - "h2_mean == 53.0 and h2_status == 'PASSED'"
            - "The second certify returns HTTP 200 with cert_status == 'CERTIFIED', hardness_index_pooled == 52.44 (524.4 / 10 specimen-weighted) and hardness_index_sample == 51.60 ((50.2 + 53.0) / 2)"
            - "ProductionLot.${lot_id}.specimens_consumed == 17 and specimens_available == 23"
            - "The first release returns HTTP 200 with disposition == 'RELEASED'; ToolSku.${sku_id}.units_received_total == 500, units_on_hand == 500 and version == sku_v + 1"
            - "The second release returns HTTP 409 with error_id == 'ERR_LOT_ALREADY_DISPOSITIONED', NOT 'ERR_STALE_SKU_VERSION', even though the token is now one version behind — 403 outranks 450"
            - "ToolSku.${sku_id}.units_received_total is still 500 — the refused release did not double-count the lot"

