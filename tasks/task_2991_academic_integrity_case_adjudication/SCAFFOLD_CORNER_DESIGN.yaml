          difficulty_instance: cross_entity_state_dependency / report_submit_depends_on_the_faculty_members_derived_training_status
          rationale: "The DRAFT->SUBMITTED transition's cross-entity precondition (FacultyMember.training_status derived from a different entity) is the named §1.8 instance, including the 730-day boundary."

      - name: convene_guarded_by_pending_advisor_requests_corner_stub
