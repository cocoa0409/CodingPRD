            - call: "POST /phases"
              payload: { community_id: "${c}", sequence_index: 2, kind: "HOUSING", planned_unit_count: 3, amenity_weight: 0, construction_window_start: "2026-09-02T00:00:00Z", construction_window_end: "2026-11-01T00:00:00Z" }
              as: DeveloperPrincipal
              as_user_id: "u_dev_1"
              captures: { ph2: $.data.id }
            - call: "POST /phases"
              payload: { community_id: "${c}", sequence_index: 3, kind: "HOUSING", planned_unit_count: 3, amenity_weight: 0, construction_window_start: "2026-09-03T00:00:00Z", construction_window_end: "2026-12-01T00:00:00Z" }
              as: DeveloperPrincipal
              as_user_id: "u_dev_1"
              captures: { ph3: $.data.id }
            - call: "POST /phases/${ph1}/construction-start"
              payload: {}
              as: ConstructionManager
              as_user_id: "u_cm_1"
          trigger:
            - call: "POST /phases/${ph2}/construction-start"
              payload: {}
              as: ConstructionManager
              as_user_id: "u_cm_1"
            - call: "POST /phases/${ph3}/construction-start"
              payload: {}
              as: ConstructionManager
              as_user_id: "u_cm_1"
          assert:
            - "All three phase creations return HTTP 201 — the gap rule is not enforced at creation time"
            - "The ${ph2} start returns HTTP 409 with data.error_id == ERR_PHASE_GAP_VIOLATION (09-01 to 09-02 is only 24 hours)"
            - "Phase.${ph2}.status is still PLANNED and construction_started_at is null"
            - "The ${ph3} start returns HTTP 200 with status == UNDER_CONSTRUCTION — a gap of exactly 48 hours is inclusive"
            - "Community.${c}.lifecycle_status == CONSTRUCTION and GET /phases filtered by status UNDER_CONSTRUCTION reports total_count == 2"

      - name: turn_windows_that_break_the_shape_rules_are_rejected
