              as: SalesDirector
          assert:
            - "before the cancel: Retailer.${r_a}.cumulative_units_ytd == 2554, discount_tier == BASIC, open_balance_cents == 26453, Issue.${i1}.total_ordered_units == 338"
            - "after the cancel: RetailerOrder.${o_a}.status == CANCELLED with cancel_reason set"
            - "after the cancel: Retailer.${r_a}.cumulative_units_ytd == 2440 exactly (its opening value) and discount_tier == ENTRY"
            - "after the cancel: Retailer.${r_a}.open_balance_cents == 0 exactly (the 26453 invoice is unwound)"
            - "after the cancel: Issue.${i1}.total_ordered_units == 224 (only retailer B's order remains)"
            - "no drift on the untouched party: Retailer.${r_b}.cumulative_units_ytd == 224, discount_tier == ENTRY, open_balance_cents == 0, RetailerOrder.${o_b}.status == FOC_LOCKED with total_units == 224"
            - "the cancelled order keeps its frozen figures (total_units 114, invoice_total_cents 26453) as an audit trail, so the restoration is on the retailer ledger, not by erasing the row"
            - "POST /comics/retailer-orders/${o_a}/cancel a second time -> 409 ERR_INVALID_STATE and the ledger stays at 2440 / 0 (the compensation is not applied twice)"

      - name: statement_reversal_restores_the_royalty_accrual_and_advance_balance_without_drift
        grounds:
          - state_machines.RoyaltyStatement.ISSUED_to_REVERSED
          - state_machines.RoyaltyStatement.DRAFT_to_ISSUED
          - entities.Title.fields.royalty_accrued_cents
          - entities.CreativeAssignment.fields.unrecouped_advance_cents
          - calculations.title_royalty_ledger
