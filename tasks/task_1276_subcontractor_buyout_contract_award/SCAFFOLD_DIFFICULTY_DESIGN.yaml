# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task 1276 — Subcontractor Buyout & Contract Award
#
# Nine Difficulty Rules (§0.5), two instances each. Every instance grounds in
# SCAFFOLD.yaml §1.1–§1.7 and carries an executable test_recipe whose
# setup_api_calls drive empty-DB → precondition state using only §1.5
# endpoints. All formula-derived assert values were computed by executing the
# §1.3 formulas against the pinned setup inputs.
#
# Conventions used throughout:
#  - The default project logical clock is 2026-05-01T00:00:00Z; bid_due_at is
#    pinned after it and bid_received_at before it unless the instance moves
#    the clock explicitly.
#  - ${proj_v} is always captured from the most recent Project-mutating
#    response (open, or clock when the clock is set) and feeds the OCC field
#    expected_project_version on trade-package creation.
#  - Packages use bonding_policy WAIVED unless the instance exercises bonding,
#    so issue gates on insurance only.
#  - Change-order creators pin as_user_id "bl-1"; approvers pin a different
#    as_user_id so the segregation-of-duties check is deterministic.
# =============================================================================

scaffold_difficulty_design:

  # ===========================================================================
  # Rule 1 — Dual-variant calculations across different entity domains
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: buyout_savings_provisional_excludes_pending_vs_final_includes
        grounds:
          - calculations.buyout_savings_vs_estimate
          - entities.TradePackage.fields.awarded_value_cents
          - entities.Subcontract.fields.status
        distinguishing_aspect: |
          Entity domain = TradePackage fiscal roll-up. The PROVISIONAL variant
          counts only Subcontracts with status == EXECUTED, while the FINAL
          variant counts EXECUTED plus PENDING_AWARD, so identical ledger data
          yields awarded_value_cents 8000000 (provisional) vs 9000000 (final)
          and buyout_savings_cents 2000000 vs 1000000.
        test_recipe:
          setup:
            - "Project with one TradePackage: estimated_budget_cents=10000000, budgeted_contingency_cents=0, bonding_policy=WAIVED"
            - "One EXECUTED subcontract at contract_value_cents=8000000"
            - "One PENDING_AWARD subcontract at contract_value_cents=1000000"
            - "getTradePackage called twice with different basis values"
          setup_api_calls:
            - call: "POST /projects"
              payload: { name: "P-DV1", project_number: "DV1", estimated_budget_cents: 50000000, buyout_target_savings_pct: 0.05 }
              as: GCAdmin
              captures: { proj_id: $.data.id }
            - call: "POST /projects/${proj_id}/open"
              as: GCAdmin
              captures: { proj_v: $.data.version }
            - call: "POST /projects/${proj_id}/trade-packages"
              payload: { trade_code: "DV1-26", title: "Mechanical", estimated_budget_cents: 10000000, budgeted_contingency_cents: 0, spec_section: "23 00 00", bid_due_at: "2026-05-20T16:00:00Z", bonding_policy: "WAIVED", expected_project_version: "${proj_v}" }
              as: BuyoutLead
              captures: { tp_id: $.data.id }
            - call: "POST /trade-packages/${tp_id}/publish"
              as: BuyoutLead
            - call: "POST /trade-packages/${tp_id}/bids"
              payload: { bidder_name: "Alpha Mech", contact_email: "a@x.com", base_bid_cents: 8000000, bid_received_at: "2026-05-15T12:00:00Z" }
              as: BuyoutLead
              captures: { bid_a: $.data.id }
            - call: "POST /trade-packages/${tp_id}/bids"
              payload: { bidder_name: "Beta Mech", contact_email: "b@x.com", base_bid_cents: 9500000, bid_received_at: "2026-05-15T13:00:00Z" }
              as: BuyoutLead
              captures: { bid_b: $.data.id }
            - call: "POST /trade-packages/${tp_id}/bids"
              payload: { bidder_name: "Gamma Mech", contact_email: "g@x.com", base_bid_cents: 10000000, bid_received_at: "2026-05-15T14:00:00Z" }
              as: BuyoutLead
              captures: { bid_c: $.data.id }
            - call: "POST /trade-packages/${tp_id}/close-bidding"
              as: BuyoutLead
            - call: "POST /trade-packages/${tp_id}/bids/${bid_c}/withdraw"
              as: BuyoutLead
            - call: "POST /trade-packages/${tp_id}/subcontracts"
              payload: { subcontractor_name: "Alpha Mech", source_bid_id: "${bid_a}", flow_down_terms: "prime flow-downs v1", payment_terms: { retainage_pct: 0.10, pay_if_paid: true }, change_authority_limits: [{ max_value_cents: 500000, max_cumulative_pct: 0.05, roles: ["ProjectExecutive"] }, { max_value_cents: 2500000, max_cumulative_pct: 0.10, roles: ["ProjectExecutive", "ProjectManager"] }, { max_value_cents: -1, max_cumulative_pct: -1, roles: ["ProjectExecutive", "ProjectManager", "OperationsManager"] }] }
              as: BuyoutLead
              captures: { sub_a: $.data.id }
            - call: "POST /subcontracts/${sub_a}/recommend-award"
              payload: { contract_value_cents: 8000000 }
              as: BuyoutLead
            - call: "POST /trade-packages/${tp_id}/subcontracts"
              payload: { subcontractor_name: "Beta Mech", source_bid_id: "${bid_b}", flow_down_terms: "prime flow-downs v1", payment_terms: { retainage_pct: 0.10, pay_if_paid: true }, change_authority_limits: [{ max_value_cents: 500000, max_cumulative_pct: 0.05, roles: ["ProjectExecutive"] }, { max_value_cents: 2500000, max_cumulative_pct: 0.10, roles: ["ProjectExecutive", "ProjectManager"] }, { max_value_cents: -1, max_cumulative_pct: -1, roles: ["ProjectExecutive", "ProjectManager", "OperationsManager"] }] }
              as: BuyoutLead
              captures: { sub_b: $.data.id }
            - call: "POST /subcontracts/${sub_b}/recommend-award"
              payload: { contract_value_cents: 1000000 }
              as: BuyoutLead
            # Drive sub_a to EXECUTED (sub_b stays PENDING_AWARD)
            - call: "POST /subcontracts/${sub_a}/award"
              as: OperationsManager
            - call: "POST /subcontracts/${sub_a}/insurance-certificates"
              payload: { certificate_number: "CERT-DV1", gl_occurrence_cents: 1000000, gl_aggregate_cents: 2000000, auto_cents: 1000000, umbrella_cents: 5000000, workers_comp: "STATUTORY", ai_endorsed: true, wos_endorsed: true, ptd_endorsed: true, pollution_cents: 0, expires_on: "2027-06-01" }
              as: BuyoutLead
            - call: "POST /subcontracts/${sub_a}/issue"
              as: BuyoutLead
            - call: "POST /subcontracts/${sub_a}/execute"
              as: BuyoutLead
          trigger:
            - call: "GET /trade-packages/${tp_id}"
              as: BuyoutLead
              captures: { tp_prov_awarded: $.data.awarded_value_cents, tp_prov_savings: $.data.buyout_savings_cents, tp_prov_posture: $.data.buyout_posture }
            - call: "GET /trade-packages/${tp_id}?basis=FINAL"
              as: BuyoutLead
              captures: { tp_fin_awarded: $.data.awarded_value_cents, tp_fin_savings: $.data.buyout_savings_cents, tp_fin_posture: $.data.buyout_posture }
          assert:
            - "tp_prov_awarded == 8000000 (PENDING_AWARD sub_b excluded from PROVISIONAL)"
            - "tp_fin_awarded == 9000000 (PENDING_AWARD sub_b included in FINAL)"
            - "tp_prov_savings == 2000000 (= 10000000 - 8000000 - 0)"
            - "tp_fin_savings == 1000000 (= 10000000 - 9000000 - 0)"
            - "tp_prov_posture == FAVORABLE (2000000 >= target 500000)"
            - "tp_fin_posture == FAVORABLE (1000000 >= target 500000)"
            - "tp_prov_awarded != tp_fin_awarded (identical ledger data, two variants, different results)"

      - name: insurance_compliance_full_endorsements_vs_gap_analysis_waivers
        grounds:
          - calculations.insurance_compliance_check
          - entities.InsuranceCertificate.fields.evaluation_basis
          - entities.ScopeGap.fields.status
        distinguishing_aspect: |
          Entity domain = InsuranceCertificate compliance (different domain
          from the TradePackage fiscal roll-up in the sibling instance). The
          FULL_ENDORSEMENTS variant rejects a certificate whose AI endorsement
          is false, while the GAP_ANALYSIS variant accepts the identical
          certificate because an INSURANCE_EXCLUSION gap was waived by
          VicePresident — compliance_verdict flips NON_COMPLIANT ->
          COMPLIANT_BY_GAP_ANALYSIS purely by evaluation context.
        test_recipe:
          setup:
            - "TradePackage UNDER_LEVELING with two bids (one WITHDRAWN), one subcontract AWARDED at 9000000"
            - "Subcontract insurance requirements are the default snapshot (ai_required=true)"
            - "One ScopeGap {category: INSURANCE_EXCLUSION} resolved via ALLOWANCE_WITH_QUALIFICATION with waived_by_role=VicePresident"
          setup_api_calls:
            - call: "POST /projects"
              payload: { name: "P-DV2", project_number: "DV2", estimated_budget_cents: 50000000, buyout_target_savings_pct: 0.05 }
              as: GCAdmin
              captures: { proj_id: $.data.id }
            - call: "POST /projects/${proj_id}/open"
              as: GCAdmin
              captures: { proj_v: $.data.version }
            - call: "POST /projects/${proj_id}/trade-packages"
              payload: { trade_code: "DV2-09", title: "Electrical", estimated_budget_cents: 10000000, budgeted_contingency_cents: 0, spec_section: "26 00 00", bid_due_at: "2026-05-20T16:00:00Z", bonding_policy: "WAIVED", expected_project_version: "${proj_v}" }
              as: BuyoutLead
              captures: { tp_id: $.data.id }
            - call: "POST /trade-packages/${tp_id}/publish"
              as: BuyoutLead
            - call: "POST /trade-packages/${tp_id}/bids"
              payload: { bidder_name: "Gamma Elec", contact_email: "g@x.com", base_bid_cents: 9000000, bid_received_at: "2026-05-15T12:00:00Z" }
              as: BuyoutLead
              captures: { bid_g: $.data.id }
            - call: "POST /trade-packages/${tp_id}/bids"
              payload: { bidder_name: "Delta Elec", contact_email: "d@x.com", base_bid_cents: 9200000, bid_received_at: "2026-05-15T13:00:00Z" }
              as: BuyoutLead
              captures: { bid_d2: $.data.id }
            - call: "POST /trade-packages/${tp_id}/close-bidding"
              as: BuyoutLead
            - call: "POST /trade-packages/${tp_id}/bids/${bid_d2}/withdraw"
              as: BuyoutLead
            - call: "POST /trade-packages/${tp_id}/subcontracts"
              payload: { subcontractor_name: "Gamma Elec", source_bid_id: "${bid_g}", flow_down_terms: "fd", payment_terms: { retainage_pct: 0.10, pay_if_paid: true }, change_authority_limits: [{ max_value_cents: -1, max_cumulative_pct: -1, roles: ["OperationsManager"] }] }
              as: BuyoutLead
              captures: { sub_g: $.data.id }
            - call: "POST /trade-packages/${tp_id}/gaps"
              payload: { category: "INSURANCE_EXCLUSION", description: "Sub excludes AI endorsement", estimated_impact_cents: 0 }
              as: BuyoutLead
              captures: { gap_ai: $.data.id }
            - call: "POST /gaps/${gap_ai}/resolve"
              payload: { resolution_kind: "ALLOWANCE_WITH_QUALIFICATION", priced_amount_cents: 0, waived_by_role: "VicePresident" }
              as: VicePresident
            - call: "POST /subcontracts/${sub_g}/recommend-award"
              payload: { contract_value_cents: 9000000 }
              as: BuyoutLead
            - call: "POST /subcontracts/${sub_g}/award"
              as: OperationsManager
          trigger:
            - call: "POST /subcontracts/${sub_g}/insurance-certificates"
              payload: { certificate_number: "CERT-FULL", gl_occurrence_cents: 1000000, gl_aggregate_cents: 2000000, auto_cents: 1000000, umbrella_cents: 5000000, workers_comp: "STATUTORY", ai_endorsed: false, wos_endorsed: true, ptd_endorsed: true, pollution_cents: 0, expires_on: "2027-06-01", evaluation_basis: "FULL_ENDORSEMENTS" }
              as: BuyoutLead
              captures: { cert_full: $.data.id, cert_full_verdict: $.data.compliance_verdict }
            - call: "POST /subcontracts/${sub_g}/insurance-certificates"
              payload: { certificate_number: "CERT-GAP", gl_occurrence_cents: 1000000, gl_aggregate_cents: 2000000, auto_cents: 1000000, umbrella_cents: 5000000, workers_comp: "STATUTORY", ai_endorsed: false, wos_endorsed: true, ptd_endorsed: true, pollution_cents: 0, expires_on: "2027-06-01", evaluation_basis: "GAP_ANALYSIS" }
              as: BuyoutLead
              captures: { cert_gap: $.data.id, cert_gap_verdict: $.data.compliance_verdict }
            - call: "GET /subcontracts/${sub_g}"
              as: BuyoutLead
              captures: { sub_ins: $.data.insurance_status }
          assert:
            - "cert_full_verdict == NON_COMPLIANT (ai_endorsed=false, no waiver credit under FULL_ENDORSEMENTS)"
            - "cert_gap_verdict == COMPLIANT_BY_GAP_ANALYSIS (identical certificate fields, VP-waived INSURANCE_EXCLUSION gap credited under GAP_ANALYSIS)"
            - "sub_ins == COMPLIANT (at least one compliant-basis certificate suffices for the derived subcontract field)"

  # ===========================================================================
  # Rule 2 — Combinatorial formulas across different modes
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: sov_line_rounding_per_line_then_sum_vs_sum_then_round
        grounds:
          - calculations.sov_line_allocation
          - validations[priority=15]
        distinguishing_aspect: |
          Mode (b) nested rounding: cumulative-difference per line with last-line
          remainder absorption is the pinned order. contract_value_cents=100000
          with equal weights 10/10/10 yields 33333/33334/33333 summing to exactly
          100000; the forbidden naive per-line rounding would yield
          33333*3 = 99999 and fail the balance check — the two orders differ in
          the last cent.
        test_recipe:
          setup:
            - "EXECUTED subcontract at contract_value_cents=100000 (odd cent count, not divisible by 3), bonding WAIVED, insurance compliant"
          setup_api_calls:
            - call: "POST /projects"
              payload: { name: "P-CF1", project_number: "CF1", estimated_budget_cents: 50000000, buyout_target_savings_pct: 0.05 }
              as: GCAdmin
              captures: { proj_id: $.data.id }
            - call: "POST /projects/${proj_id}/open"
              as: GCAdmin
              captures: { proj_v: $.data.version }
            - call: "POST /projects/${proj_id}/trade-packages"
              payload: { trade_code: "CF1-05", title: "Plumbing", estimated_budget_cents: 200000, budgeted_contingency_cents: 0, spec_section: "22 00 00", bid_due_at: "2026-05-20T16:00:00Z", bonding_policy: "WAIVED", expected_project_version: "${proj_v}" }
              as: BuyoutLead
              captures: { tp_id: $.data.id }
            - call: "POST /trade-packages/${tp_id}/publish"
              as: BuyoutLead
            - call: "POST /trade-packages/${tp_id}/bids"
              payload: { bidder_name: "Delta Plumb", contact_email: "d@x.com", base_bid_cents: 100000, bid_received_at: "2026-05-15T12:00:00Z" }
              as: BuyoutLead
              captures: { bid_d: $.data.id }
            - call: "POST /trade-packages/${tp_id}/bids"
              payload: { bidder_name: "Echo Plumb", contact_email: "e2@x.com", base_bid_cents: 110000, bid_received_at: "2026-05-15T13:00:00Z" }
              as: BuyoutLead
              captures: { bid_e2: $.data.id }
            - call: "POST /trade-packages/${tp_id}/close-bidding"
              as: BuyoutLead
            - call: "POST /trade-packages/${tp_id}/bids/${bid_e2}/withdraw"
              as: BuyoutLead
            - call: "POST /trade-packages/${tp_id}/subcontracts"
              payload: { subcontractor_name: "Delta Plumb", source_bid_id: "${bid_d}", flow_down_terms: "fd", payment_terms: { retainage_pct: 0.10, pay_if_paid: true }, change_authority_limits: [{ max_value_cents: -1, max_cumulative_pct: -1, roles: ["OperationsManager"] }] }
              as: BuyoutLead
              captures: { sub_d: $.data.id }
            - call: "POST /subcontracts/${sub_d}/recommend-award"
              payload: { contract_value_cents: 100000 }
              as: BuyoutLead
            - call: "POST /subcontracts/${sub_d}/award"
              as: OperationsManager
            - call: "POST /subcontracts/${sub_d}/insurance-certificates"
              payload: { certificate_number: "CERT-CF1", gl_occurrence_cents: 1000000, gl_aggregate_cents: 2000000, auto_cents: 1000000, umbrella_cents: 5000000, workers_comp: "STATUTORY", ai_endorsed: true, wos_endorsed: true, ptd_endorsed: true, pollution_cents: 0, expires_on: "2027-06-01" }
              as: BuyoutLead
            - call: "POST /subcontracts/${sub_d}/issue"
              as: BuyoutLead
          trigger:
            - call: "POST /subcontracts/${sub_d}/schedule-of-values"
              payload: { lines: [{ wbs_code: "01", description: "Mobilization", weight_numerator: 10 }, { wbs_code: "02", description: "Labor", weight_numerator: 10 }, { wbs_code: "03", description: "Material", weight_numerator: 10 }] }
              as: BuyoutLead
              captures: { sov_status: $.data.status, l1: "$.data.lines[0].allocated_amount_cents", l2: "$.data.lines[1].allocated_amount_cents", l3: "$.data.lines[2].allocated_amount_cents" }
          assert:
            - "l1 == 33333 (round_half_up(100000*10/30) - 0)"
            - "l2 == 33334 (round_half_up(100000*20/30) - 33333 = 66667 - 33333)"
            - "l3 == 33333 (last line absorbs remainder: 100000 - 66667)"
            - "l1 + l2 + l3 == 100000 == Subcontract.${sub_d}.contract_value_cents (pinned per-line-then-remainder order balances exactly)"
            - "sov_status == BALANCED and response code == 201 (the naive independent-rounding interpretation would total 99999 and must be rejected)"

      - name: trade_risk_score_three_factor_state_dependent_threshold
        grounds:
          - calculations.trade_risk_score
          - calculations.bond_premium_quote
          - entities.BondDecision.fields.decision
        distinguishing_aspect: |
          Mode (a): >=3 inputs with non-linear interaction — tiered value_score
          band selection, a conditional ratio branch (>0.25 adds 25), a binary
          history factor, and a policy override branch (REQUIRED forces
          SURETY_BOND regardless of score), then a tiered premium rate keyed on
          the decision. Inputs {value=12000000, budget=12000000,
          history=CLAIMS, policy=PER_TRADE_RISK} yield score=85, tier SUBGUARD,
          premium=120000 — every branch exercised by one case.
        test_recipe:
          setup:
            - "TradePackage: estimated_budget_cents=12000000, bonding_policy=PER_TRADE_RISK"
            - "Subcontract AWARDED at contract_value_cents=12000000 (ratio exactly 1.0)"
          setup_api_calls:
            - call: "POST /projects"
              payload: { name: "P-CF2", project_number: "CF2", estimated_budget_cents: 50000000, buyout_target_savings_pct: 0.05 }
              as: GCAdmin
              captures: { proj_id: $.data.id }
            - call: "POST /projects/${proj_id}/open"
              as: GCAdmin
              captures: { proj_v: $.data.version }
            - call: "POST /projects/${proj_id}/trade-packages"
              payload: { trade_code: "CF2-03", title: "Concrete", estimated_budget_cents: 12000000, budgeted_contingency_cents: 0, spec_section: "03 00 00", bid_due_at: "2026-05-20T16:00:00Z", bonding_policy: "PER_TRADE_RISK", expected_project_version: "${proj_v}" }
              as: BuyoutLead
              captures: { tp_id: $.data.id }
            - call: "POST /trade-packages/${tp_id}/publish"
              as: BuyoutLead
            - call: "POST /trade-packages/${tp_id}/bids"
              payload: { bidder_name: "Epsilon Concrete", contact_email: "e@x.com", base_bid_cents: 12000000, bid_received_at: "2026-05-15T12:00:00Z" }
              as: BuyoutLead
              captures: { bid_e: $.data.id }
            - call: "POST /trade-packages/${tp_id}/bids"
              payload: { bidder_name: "Foxtrot Concrete", contact_email: "f@x.com", base_bid_cents: 12100000, bid_received_at: "2026-05-15T13:00:00Z" }
              as: BuyoutLead
              captures: { bid_f: $.data.id }
            - call: "POST /trade-packages/${tp_id}/close-bidding"
              as: BuyoutLead
            - call: "POST /trade-packages/${tp_id}/bids/${bid_f}/withdraw"
              as: BuyoutLead
            - call: "POST /trade-packages/${tp_id}/subcontracts"
              payload: { subcontractor_name: "Epsilon Concrete", source_bid_id: "${bid_e}", flow_down_terms: "fd", payment_terms: { retainage_pct: 0.10, pay_if_paid: true }, change_authority_limits: [{ max_value_cents: -1, max_cumulative_pct: -1, roles: ["OperationsManager"] }] }
              as: BuyoutLead
              captures: { sub_e: $.data.id }
            - call: "POST /subcontracts/${sub_e}/recommend-award"
              payload: { contract_value_cents: 12000000 }
              as: BuyoutLead
            - call: "POST /subcontracts/${sub_e}/award"
              as: OperationsManager
          trigger:
            - call: "POST /subcontracts/${sub_e}/bond-decision"
              payload: { trade_history: "CLAIMS", decision_rationale: "large single-trade share with prior claims" }
              as: OperationsManager
              captures: { bd_id: $.data.id, bd_score: $.data.trade_risk_score, bd_decision: $.data.decision, bd_premium: $.data.premium_cents }
            - call: "GET /subcontracts/${sub_e}"
              as: BuyoutLead
              captures: { sub_bond_req: $.data.bonding_requirement }
          assert:
            - "bd_score == 85 (value 12000000 > 10000000 -> 35; ratio 1.0 > 0.25 -> 25; CLAIMS -> 25; 35+25+25=85)"
            - "bd_decision == SUBGUARD (score 85 falls in tier 61..85 under PER_TRADE_RISK)"
            - "bd_premium == 120000 (round_half_up(12000000 * 0.01) — SUBGUARD_RATE applies to the SUBGUARD tier)"
            - "sub_bond_req == SUBGUARD (cascaded from the BondDecision onto the subcontract)"

  # ===========================================================================
  # Rule 3 — Non-linear state-machine shape on different entities
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: negotiation_cycle_pending_to_draft_loop_with_two_round_cap
        grounds:
          - state_machines.Subcontract.PENDING_AWARD_to_DRAFT
          - state_machines.Subcontract.DRAFT_to_PENDING_AWARD
          - entities.Subcontract.fields.negotiation_round
        distinguishing_aspect: |
          Cycle shape on Subcontract: PENDING_AWARD -> DRAFT -> PENDING_AWARD
          increments negotiation_round on each revert; at negotiation_round == 2
          a third recommend is rejected with ERR_NEGOTIATION_ROUND_EXCEEDED —
          the cycle is bounded by a counter, not infinite.
        test_recipe:
          setup:
            - "Subcontract that has already cycled DRAFT->PENDING_AWARD->DRAFT->PENDING_AWARD->DRAFT (negotiation_round == 2)"
          setup_api_calls:
            - call: "POST /projects"
              payload: { name: "P-NL1", project_number: "NL1", estimated_budget_cents: 50000000, buyout_target_savings_pct: 0.05 }
              as: GCAdmin
              captures: { proj_id: $.data.id }
            - call: "POST /projects/${proj_id}/open"
              as: GCAdmin
              captures: { proj_v: $.data.version }
            - call: "POST /projects/${proj_id}/trade-packages"
              payload: { trade_code: "NL1-08", title: "HVAC", estimated_budget_cents: 10000000, budgeted_contingency_cents: 0, spec_section: "23 50 00", bid_due_at: "2026-05-20T16:00:00Z", bonding_policy: "WAIVED", expected_project_version: "${proj_v}" }
              as: BuyoutLead
              captures: { tp_id: $.data.id }
            - call: "POST /trade-packages/${tp_id}/publish"
              as: BuyoutLead
            - call: "POST /trade-packages/${tp_id}/bids"
              payload: { bidder_name: "Zeta HVAC", contact_email: "z@x.com", base_bid_cents: 9000000, bid_received_at: "2026-05-15T12:00:00Z" }
              as: BuyoutLead
              captures: { bid_z: $.data.id }
            - call: "POST /trade-packages/${tp_id}/bids"
              payload: { bidder_name: "Eta HVAC", contact_email: "h@x.com", base_bid_cents: 9200000, bid_received_at: "2026-05-15T13:00:00Z" }
              as: BuyoutLead
              captures: { bid_h1: $.data.id }
            - call: "POST /trade-packages/${tp_id}/close-bidding"
              as: BuyoutLead
            - call: "POST /trade-packages/${tp_id}/bids/${bid_h1}/withdraw"
