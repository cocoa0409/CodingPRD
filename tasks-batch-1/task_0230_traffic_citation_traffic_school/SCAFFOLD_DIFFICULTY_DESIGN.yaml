  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: school_cooldown_lookback_window_overlap
        grounds:
          - validations[priority=8]
          - entities.Jurisdiction.fields.school_cooldown_months
          - entities.TrafficSchoolEnrollment.fields.status
          - errors[ERR_SCHOOL_INELIGIBLE]
        distinguishing_aspect: |
          Interval semantics A — half-open EXCLUSION lookback window on the Driver's
          completion history: a new enrollment whose request instant falls inside
          [prev_completion, prev_completion + school_cooldown_months) collides with the
          prior COMPLETED enrollment and is rejected (ERR_SCHOOL_INELIGIBLE). Sits on
          the Driver/TrafficSchoolEnrollment resource.
        test_recipe:
          setup:
            - "Jurisdiction A (school_cooldown_months=18); driver D16 completed traffic school for citation X at clock 2026-02-01; clock advanced to 2026-06-01 (4 months later, < 18); a new eligible citation Y paid and a fresh enrollment attempted."
