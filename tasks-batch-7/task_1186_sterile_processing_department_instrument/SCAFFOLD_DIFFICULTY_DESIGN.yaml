            - { call: "POST /spd/technicians", payload: { name: "Sup S", certification_level: 3, certified_methods: ["STEAM_GRAVITY"], certification_expires_at: "2027-01-01T00:00:00Z" }, as: FacilityAdmin, captures: { tech_s: "$.data.id" } }
            - { call: "POST /spd/sterilizers", payload: { name: "ST-G1", method: "STEAM_GRAVITY", chamber_capacity: 4, cycle_minutes: 60, required_certification_level: 1 }, as: FacilityAdmin, captures: { ster: "$.data.id" } }
            - { call: "POST /spd/trays", payload: { template_id: "${tpl}", label: "K1" }, as: SpdTechnician, as_user_id: "${tech_a}", captures: { k1: "$.data.id" } }
            - { call: "POST /spd/trays/${k1}/decontamination/start", as: SpdTechnician, as_user_id: "${tech_a}" }
            - { call: "POST /spd/trays/${k1}/decontamination/complete", as: SpdTechnician, as_user_id: "${tech_a}" }
            - { call: "POST /spd/trays/${k1}/assembly/start", as: SpdTechnician, as_user_id: "${tech_a}" }
            - { call: "POST /spd/trays/${k1}/assembly-verifications", payload: { lines: [{ instrument_type: "SCALPEL", counted_qty: 2 }] }, as: SpdTechnician, as_user_id: "${tech_a}" }
            - { call: "POST /spd/trays", payload: { template_id: "${tpl}", label: "K2" }, as: SpdTechnician, as_user_id: "${tech_a}", captures: { k2: "$.data.id" } }
            - { call: "POST /spd/trays/${k2}/decontamination/start", as: SpdTechnician, as_user_id: "${tech_a}" }
            - { call: "POST /spd/trays/${k2}/decontamination/complete", as: SpdTechnician, as_user_id: "${tech_a}" }
            - { call: "POST /spd/trays/${k2}/assembly/start", as: SpdTechnician, as_user_id: "${tech_a}" }
            - { call: "POST /spd/trays/${k2}/assembly-verifications", payload: { lines: [{ instrument_type: "SCALPEL", counted_qty: 2 }] }, as: SpdTechnician, as_user_id: "${tech_a}" }
            - { call: "POST /spd/sterilization-loads", payload: { sterilizer_id: "${ster}", planned_start_at: "2026-05-01T00:00:00Z" }, as: SpdTechnician, as_user_id: "${tech_a}", captures: { lk: "$.data.id" } }
            - { call: "POST /spd/sterilization-loads/${lk}/trays", payload: { tray_id: "${k1}" }, as: SpdTechnician, as_user_id: "${tech_a}" }
            - { call: "POST /spd/sterilization-loads/${lk}/trays", payload: { tray_id: "${k2}" }, as: SpdTechnician, as_user_id: "${tech_a}" }
            - { call: "POST /spd/sterilization-loads/${lk}/start", as: SpdTechnician, as_user_id: "${tech_a}" }
            - { call: "POST /spd/sterilization-loads/${lk}/complete", as: SpdTechnician, as_user_id: "${tech_a}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T03:00:00Z" }, as: FacilityAdmin }
            - { call: "GET /spd/biological-indicators?load_id=${lk}", as: Any, captures: { bik: "$.data[0].id" } }
            - { call: "POST /spd/biological-indicators/${bik}/record-result", payload: { result: "NEGATIVE" }, as: QualityAuditor }
            - { call: "POST /spd/sterilization-loads/${lk}/release", as: SpdSupervisor, as_user_id: "${tech_s}" }
