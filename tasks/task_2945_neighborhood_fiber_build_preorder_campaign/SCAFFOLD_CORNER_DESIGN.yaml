          assert:
            - "${booked} == 0 and ${count} == 0 and ${ver} == 1 on the freshly created crew"
            - "${read_name} == Bury Crew 1 with ${read_buffer} == 45 and ${read_capacity} == 600 -- the supplied values overrode the defaults"
            - "InstallCrew.${c2}.travel_buffer_minutes == 30 and daily_capacity_minutes == 480 from the declared defaults"
            - "GET /install-crews?crew_type=BURY returns total_count 1 containing ${c1} and not ${c2}"
            - "§1.5 declares no PATCH and no DELETE for /install-crews, so a crew's identity fields are write-once"

      - name: construction_complete_on_a_zone_that_never_broke_ground_is_refused
        claim_type: Conditional action
        grounds:
          - endpoints["POST /build-zones/{id}/construction-complete"]
          - validations[priority 10 ERR_BUILD_ZONE_STATE_INVALID]
        distinguishing_aspect: "The action is conditional on the construction dimension alone: a zone at NOT_STARTED is refused with ERR_BUILD_ZONE_STATE_INVALID at priority 10, ahead of the restoration rule at priority 15, so the caller learns about the state and not about lawns."
        test_recipe:
          setup:
            - "One campaign and one zone that has never been sequenced or started."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProgramManager
            - call: "POST /campaigns"
              payload: { name: "Fiberhood 2026", city: "Aurora", prereg_window_open_at: "2026-08-01T00:00:00Z", prereg_window_close_at: "2026-09-30T23:59:00Z", default_threshold_pct: 10.00, deposit_amount_cents: 1000 }
              as: ProgramManager
              captures: { camp: $.data.id }
            - call: "POST /build-zones"
              payload: { campaign_id: "${camp}", name: "Zone Alpha", zone_code: "A1", household_count: 10 }
              as: ProgramManager
              captures: { z1: $.data.id, version_before: $.data.version }
          trigger:
            - call: "POST /build-zones/${z1}/construction-complete"
              payload: {}
              as: ProgramManager
          assert:
            - "the response is HTTP 409 with data.error_id == ERR_BUILD_ZONE_STATE_INVALID"
            - "the error is not ERR_RESTORATION_OUTSTANDING even though outstanding_restoration_count is trivially 0"
            - "BuildZone.${z1}.construction_status == NOT_STARTED and version == ${version_before}"

      - name: unserved_exception_grant_without_a_prior_request_is_refused
        claim_type: Conditional action
        grounds:
          - endpoints["POST /service-addresses/{id}/unserved-exception"]
          - validations[priority 10 ERR_SERVICE_ADDRESS_STATE_INVALID]
          - entities.ServiceAddress.fields.exception_status
        distinguishing_aspect: "The exception dimension has no shortcut from NONE to GRANTED: the GRANT is refused with ERR_SERVICE_ADDRESS_STATE_INVALID, and the refusal leaves serviceability untouched -- proof that the two ServiceAddress dimensions are independent."
        test_recipe:
          setup:
            - "One campaign, one zone and one address determined NOT_SERVICEABLE with exception_status still at its NONE default."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProgramManager
            - call: "POST /campaigns"
              payload: { name: "Fiberhood 2026", city: "Aurora", prereg_window_open_at: "2026-08-01T00:00:00Z", prereg_window_close_at: "2026-09-30T23:59:00Z", default_threshold_pct: 10.00, deposit_amount_cents: 1000 }
              as: ProgramManager
              captures: { camp: $.data.id }
            - call: "POST /build-zones"
              payload: { campaign_id: "${camp}", name: "Zone Alpha", zone_code: "A1", household_count: 10 }
              as: ProgramManager
              captures: { z1: $.data.id }
            - call: "POST /service-addresses"
              payload: { build_zone_id: "${z1}", street_address: "12 Quarry Rd", dwelling_type: "SINGLE_FAMILY", unit_count: 1, distance_to_node_m: 400 }
              as: ProgramManager
              captures: { a1: $.data.id, exception_default: $.data.exception_status }
            - call: "POST /service-addresses/${a1}/serviceability-determination"
              payload: { serviceability: "NOT_SERVICEABLE", not_serviceable_reason: "EXCESSIVE_DISTANCE" }
              as: ProgramManager
          trigger:
            - call: "POST /service-addresses/${a1}/unserved-exception"
              payload: { action: "GRANT" }
              as: ProgramManager
            - call: "POST /service-addresses/${a1}/unserved-exception"
              payload: { action: "REQUEST", exception_reason: "Beyond aerial reach." }
              as: ProgramManager
              captures: { status_requested: $.data.exception_status, serviceability_after: $.data.serviceability }
            - call: "POST /service-addresses/${a1}/unserved-exception"
              payload: { action: "DENY" }
              as: ProgramManager
              captures: { status_denied: $.data.exception_status }
          assert:
            - "${exception_default} == NONE"
            - "the GRANT from NONE is HTTP 409 with data.error_id == ERR_SERVICE_ADDRESS_STATE_INVALID"
            - "${status_requested} == REQUESTED with exception_reason recorded, and ${serviceability_after} == NOT_SERVICEABLE -- the exception action never rewrote the serviceability dimension"
            - "${status_denied} == DENIED, reached from REQUESTED"

