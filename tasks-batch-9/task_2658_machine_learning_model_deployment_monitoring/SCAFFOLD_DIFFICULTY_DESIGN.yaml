            - "HOP 5 (caused by hop 3): exactly one PredictionIncident for ${d1_id} with source 'DRIFT', severity 'SEV2', status 'OPEN', drift_report_id == ${dr_id}, model_version_id == ${v1_id}, fallback_engaged false and recurrence_count 0"
            - "the cascade is verified end to end in one request: five rows changed state from a single POST /drift-reports"
            - "RESUME immediately afterwards returns HTTP 422 with error_id 'ERR_HEALTH_CRITICAL_BLOCKED' (priority 32), not 'ERR_OPEN_INCIDENT_BLOCKS_ACTION' (priority 33), even though both conditions hold"
            - "depth is data-dependent: the same call with observed [0.10,0.15,0.20,0.25,0.30] scores 0.1354 (WARN) and stops after hop 3 — health_state DEGRADED, rollout_state still RAMPING, and no PredictionIncident at all"
            - "window health scores are untouched by the cascade: MonitoringWindow.${w1_id}.health_score == 87.63 with health_score_variant 'FINAL' (93.25 while it was OPEN)"

