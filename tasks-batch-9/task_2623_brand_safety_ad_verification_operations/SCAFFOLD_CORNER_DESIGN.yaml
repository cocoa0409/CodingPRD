            - call: "POST /methodology-versions"
              payload: { standard_family: "SUITABILITY", version_code: "SUIT-2026.1", effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z" }
              as: AccreditationAuditor
              as_user_id: "auditor-1"
              captures: { mv_suit_id: $.data.id }
            - call: "POST /methodology-versions"
              payload: { standard_family: "VIEWABILITY", version_code: "VIEW-2026.1", effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z", display_in_view_seconds: 1.0, display_pixel_pct: 0.5, coverage_rate_floor: 0.7, ivt_rate_ceiling: 0.02 }
              as: AccreditationAuditor
              as_user_id: "auditor-1"
              captures: { mv_view_id: $.data.id }
            - call: "POST /campaigns"
              payload: { advertiser_id: "${adv_id}", name: "Q3 Display", cpm_cents: 875, min_suitability_tier: "MEDIUM_RISK", format: "DISPLAY", target_coverage_rate: 0.75 }
              as: Advertiser
              as_user_id: "${adv_id}"
              captures: { camp_id: $.data.id }
            - call: "POST /pages"
              payload: { publisher_id: "${pub_id}", url: "https://beacon.example.com/sports" }
              as: Publisher
              as_user_id: "${pub_id}"
              captures: { page_id: $.data.id, page_ver: $.data.version }
            - call: "POST /page-classifications"
              payload: { page_id: "${page_id}", methodology_version_id: "${mv_suit_id}", expected_page_version: "${page_ver}", classifier_kind: "MODEL", category_codes: ["GENERAL"], model_confidence: 0.95, ad_density_ratio: 0.10, refresh_seconds: 0, originality_score: 90 }
              as: ClassificationAnalyst
              as_user_id: "analyst-1"
              captures: { cls_id: $.data.id }
            - call: "POST /measurement-batches"
              payload: { campaign_id: "${camp_id}", publisher_id: "${pub_id}", page_id: "${page_id}", methodology_version_id: "${mv_view_id}", format: "DISPLAY", window_start: "2026-08-01T00:00:00Z", window_end: "2026-08-01T01:00:00Z", measured_impressions: 10000, measurable_impressions: 9000, in_view_impressions: 9000, avg_in_view_seconds: 1.2, avg_in_view_pixel_pct: 0.6 }
              as: MeasurementOperator
              as_user_id: "op-1"
              captures: { batch_id: $.data.id }
          trigger:
            - call: "POST /measurement-batches/${batch_id}/score"
              payload: {}
              as: MeasurementOperator
              as_user_id: "op-1"
            - call: "POST /measurement-batches/${batch_id}/score"
              payload: {}
              as: MeasurementOperator
              as_user_id: "op-1"
              captures: { err_twice: $.data.error_id }
          assert:
            - "First trigger: HTTP 200; MeasurementBatch.${batch_id}.scoring_status == SCORED, coverage_rate == 0.9000, viewability_rate == 1.0000, qualified_in_view_impressions == 9000, unmeasurable_impressions == 1000, non_viewable_impressions == 0, assessed_tier == SAFE, suitability_breach_flag == false, scored_at == 2026-08-10T00:00:00.000Z, version == 2"
            - "Second trigger: HTTP 409 and ${err_twice} == ERR_INVALID_BATCH_STATE"
            - "MeasurementBatch.${batch_id}.version is still 2 after the refused replay (no mutation, no updated_at refresh)"
            - "MeasurementBatch.${batch_id}.scored_at is still 2026-08-10T00:00:00.000Z"

      - name: every_entity_starts_in_its_declared_initial_state
        claim_type: initial_state
        grounds:
          - state_machines.Publisher.initial_state
          - state_machines.MethodologyVersion.initial_state
          - state_machines.Campaign.initial_state
          - state_machines.InventoryList.initial_state
          - state_machines.PreBidSegment.initial_state
          - state_machines.Page.initial_state
          - state_machines.PageClassification.initial_state
          - state_machines.MeasurementBatch.scoring_status.initial_state
          - state_machines.MeasurementBatch.settlement_status.initial_state
          - state_machines.IvtFinding.initial_state
        distinguishing_aspect: |
          Ten declared machines are seeded by ordinary creates. The two that
          matter most are the pair carried on one MeasurementBatch row
          (scoring_status INGESTED and settlement_status UNBILLED must both be
          seeded independently) and MethodologyVersion, whose initial state is
          PROVISIONAL - already usable for scoring - rather than an
          unaccredited state that would make every batch unscoreable until an
          audit concluded.
        test_recipe:
          setup:
            - "Clock 2026-08-10T00:00:00Z; empty database."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: PlatformAdmin
          trigger:
