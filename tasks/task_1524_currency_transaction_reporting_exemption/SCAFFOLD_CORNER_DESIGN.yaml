              payload: { legal_name: "Recompute Rex", tin: "11-1111110", customer_type: "INDIVIDUAL", account_opened_date: "2026-01-15T00:00:00Z" }
              as: BranchManager
              captures: { c1: $.data.id }
            - { call: "POST /monetary-instrument-sales", payload: { customer_id: "${c1}", branch_id: "${br1}", instrument_type: "CASHIERS_CHECK", amount_cents: 500000, occurred_at: "2026-08-01T08:00:00Z", purchaser_name: "Rex", purchaser_tin: "11-1111110", purchaser_address: "3 Elm", purchaser_id_number: "ID-1" }, as: Teller }
            - call: "POST /monetary-instrument-sales"
              payload: { customer_id: "${c1}", branch_id: "${br1}", instrument_type: "CASHIERS_CHECK", amount_cents: 200000, occurred_at: "2026-08-01T08:05:00Z" }
              as: Teller
              captures: { s2: $.data.id }
          trigger:
            - { call: "POST /monetary-instrument-sales/${s2}/void", payload: { void_reason: "misprint" }, as: Teller, as_user_id: "teller-1" }
            - call: "GET /daily-aggregations"
              payload: { customer_id: "${c1}", business_date: "2026-08-01" }
              as: BSAOfficer
              captures: { agg_in: "$.data[0].total_cash_in_cents", agg_cnt: "$.data[0].instrument_sale_count", agg_fee: "$.data[0].instrument_fee_total_cents" }
          assert:
            - "agg_in == 500000 (voided sale excluded)"
            - "agg_cnt == 1"
            - "agg_fee == 2500 (only the RECORDED sale's per-item fee)"

      - name: structuring_dedup_overlapping_window_silent_skip
        claim_type: correct_result
        grounds: [calculations.structuring_detection]
        distinguishing_aspect: "Once an AUTO alert is OPEN for window [2026-07-26, 2026-07-30], a fourth deposit whose own window [2026-07-27, 2026-07-31] still satisfies all firing conditions creates NO second alert (closed-overlap dedup)."
        test_recipe:
          setup: ["branches BR1/BR2; customer; deposits 950000@BR1 07-28, 100000@BR1 07-29, 100000@BR2 07-30 -> one OPEN alert; clock 2026-08-01T09:00:00Z"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T09:00:00Z" }, as: SystemAdmin }
            - call: "POST /branches"
              payload: { name: "Main", branch_code: "BR1" }
              as: SystemAdmin
              captures: { br1: $.data.id }
            - call: "POST /branches"
              payload: { name: "West", branch_code: "BR2" }
              as: SystemAdmin
              captures: { br2: $.data.id }
            - call: "POST /customers"
              payload: { legal_name: "Dedup Deb", tin: "12-1212120", customer_type: "INDIVIDUAL", account_opened_date: "2026-01-15T00:00:00Z" }
              as: BranchManager
              captures: { c1: $.data.id }
            - { call: "POST /cash-transactions", payload: { customer_id: "${c1}", branch_id: "${br1}", direction: "CASH_IN", amount_cents: 950000, occurred_at: "2026-07-28T10:00:00Z" }, as: Teller }
            - { call: "POST /cash-transactions", payload: { customer_id: "${c1}", branch_id: "${br1}", direction: "CASH_IN", amount_cents: 100000, occurred_at: "2026-07-29T10:00:00Z" }, as: Teller }
            - { call: "POST /cash-transactions", payload: { customer_id: "${c1}", branch_id: "${br2}", direction: "CASH_IN", amount_cents: 100000, occurred_at: "2026-07-30T10:00:00Z" }, as: Teller }
          trigger:
            - { call: "POST /cash-transactions", payload: { customer_id: "${c1}", branch_id: "${br1}", direction: "CASH_IN", amount_cents: 100000, occurred_at: "2026-07-31T10:00:00Z" }, as: Teller }
            - call: "GET /structuring-alerts"
              payload: { customer_id: "${c1}" }
              as: BSAOfficer
              captures: { total: $.meta.total_count, ws: "$.data[0].window_start_date", we: "$.data[0].window_end_date" }
          assert:
            - "total == 1 (the overlapping second detection is deduplicated, not double-created)"
            - "ws == '2026-07-26' and we == '2026-07-30' (the original alert's window is unchanged)"

      - name: structuring_not_fired_when_single_day_reportable
        claim_type: correct_result
        grounds: [calculations.structuring_detection]
        distinguishing_aspect: "A single 1100000-cent day makes max(day_totals) > threshold, so condition (2) suppresses structuring detection entirely — the day is handled by a CTR instead (complementary channels)."
        test_recipe:
          setup: ["branch, customer; one 1100000-cent deposit on 2026-08-01; clock 2026-08-01T09:00:00Z"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T09:00:00Z" }, as: SystemAdmin }
            - call: "POST /branches"
              payload: { name: "Main", branch_code: "BR1" }
              as: SystemAdmin
              captures: { br1: $.data.id }
            - call: "POST /customers"
              payload: { legal_name: "Single Day Sam", tin: "13-1313131", customer_type: "INDIVIDUAL", account_opened_date: "2026-01-15T00:00:00Z" }
              as: BranchManager
              captures: { c1: $.data.id }
          trigger:
