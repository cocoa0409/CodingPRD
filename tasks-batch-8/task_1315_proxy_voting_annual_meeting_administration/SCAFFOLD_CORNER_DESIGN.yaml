              as: ProxyAdministrator
              captures: { m2_id: $.data.id }
            - call: "POST /proxy/shareholder-accounts"
              payload: { meeting_id: "${m1_id}", holder_name: "Holder One", account_number: "A-1001", share_class: "COMMON", shares_held: 6000 }
              as: TransferAgent
              captures: { a1_id: $.data.id, cn1: $.data.control_number }
            - call: "POST /proxy/meetings/${m1_id}/lock-record-date"
              payload: {}
              as: ProxyAdministrator
            - call: "POST /proxy/proposals"
              payload: { meeting_id: "${m1_id}", proposal_number: 1, title: "M1 proposal", proposal_type: "SAY_ON_PAY", vote_standard: "MAJORITY_OF_VOTES_CAST" }
              as: ProxyAdministrator
            - call: "POST /proxy/material-distributions/generate"
              payload: { meeting_id: "${m1_id}" }
              as: ProxyAdministrator
            - call: "POST /proxy/meetings/${m1_id}/open-voting"
              payload: {}
              as: ProxyAdministrator
            - call: "POST /proxy/proposals"
              payload: { meeting_id: "${m2_id}", proposal_number: 1, title: "M2 proposal", proposal_type: "SAY_ON_PAY", vote_standard: "MAJORITY_OF_VOTES_CAST" }
              as: ProxyAdministrator
              captures: { p_other_id: $.data.id }
          trigger:
            - call: "POST /proxy/vote-instructions"
              payload: { meeting_id: "${m1_id}", proposal_id: "${p_other_id}", account_id: "${a1_id}", channel: "INTERNET", choice: "FOR", control_number: "${cn1}" }
              as: Shareholder
              as_user_id: "${a1_id}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_CROSS_MEETING_REFERENCE; HTTP 422"

      - name: campaign_window_inverted_returns_invalid_request
        claim_type: violation_to_error
        grounds: ["validations[priority=6]", "errors[ERR_INVALID_REQUEST]", entities.SolicitationCampaign.fields.end_at]
        distinguishing_aspect: "end_at <= start_at is a structural temporal error: an inverted campaign window fails with ERR_INVALID_REQUEST (400), distinct from the overlap rule."
        test_recipe:
          setup: ["CONTESTED meeting exists"]
          setup_api_calls:
            - call: "POST /proxy/meetings"
              payload: { company_name: "Fight Co", ticker: "FGT", meeting_type: "CONTESTED", record_date: "2026-08-10", meeting_datetime: "2026-09-15T16:00:00Z", meeting_mode: "VIRTUAL", quorum_threshold_pct: 0.5, outstanding_shares: 10000 }
