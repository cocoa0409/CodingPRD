              captures: { c1_id: $.data.id }
            - call: "POST /certificates/${c1_id}/decision"
              payload: { decision: "VERIFY" }
              as: DockStaff
            - call: "POST /bookings"
              payload: { vessel_id: "${v_id}", renter_id: "${r1_id}", start_date: "2026-09-01", end_date: "2026-09-04", party_size: 2 }
              as: Renter
              as_user_id: "${r1_id}"
              captures: { b_id: $.data.id }
