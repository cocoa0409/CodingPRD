# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task: task_3021_connected_fitness_hardware_delivery_activation_subscription_entitlement
#
# 20 instances across the nine §0.5 Difficulty Rules. Every instance grounds in
# §1.1–§1.6 of SCAFFOLD.yaml and is driven from empty-DB by §1.5 endpoints only.
#
# Recurring fixture note: every OCC write is immediately preceded by a GET of the
# parent, because creating household users, devices and appointments recomputes
# parent Membership.posture and therefore bumps Membership.version. A version
# captured at creation time is always stale by the time an OCC write is sent.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      # -----------------------------------------------------------------------
      - name: order_total_variants_diverge_when_delivery_crosses_the_finance_tier
        grounds:
          - calculations.order_totals
          - calculations.delivery_charge
          - state_machines.HardwareOrder.DELIVERY_SCHEDULED_to_DELIVERED
          - state_machines.DeliveryAppointment.IN_PROGRESS_to_COMPLETED
        distinguishing_aspect: |
          The forward_looking variant prices the order on a basis of 296000 cents
          (below the 300000 tier) and the chronological variant re-prices it on a
          basis of 300500 cents (above the tier), so the identical order carries
          310800 provisional cents and 330550 final cents.
        test_recipe:
          setup:
            - "Empty DB. A PROVISIONAL membership PLUS at 6000 cents/month with a verified OWNER and a TREAD device whose METRO appointment is IN_PROGRESS. The membership is never activated in this chain."
            - "The hardware order was placed with subtotal 296000 cents and FINANCE_SCHEDULED financing BEFORE any appointment existed, which is what makes the forward-looking quote run on a zero-delivery basis."
          setup_api_calls:
            - &k_start
              call: "POST /fitness/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - &m_create
              call: "POST /fitness/memberships"
              payload: { household_name: "Fernwood Household", billing_email: "fern@x.com", plan_tier: "PLUS", monthly_fee_cents: 6000, concurrent_limit_override: 4 }
              as: MembershipOwner
              captures: { m_id: $.data.id }
            - &u_owner
              call: "POST /fitness/memberships/${m_id}/household-users"
              payload: { display_name: "Ada Fernwood", email: "ada@x.com", role: "OWNER" }
              as: MembershipOwner
              as_user_id: "${m_id}"
              captures: { u_ada: $.data.id, tok_ada: $.data.verification_token }
            - &uv_owner
              call: "POST /fitness/household-users/${u_ada}/verify"
              payload: { verification_token: "${tok_ada}" }
              as: Anonymous
            - &d_create
              call: "POST /fitness/memberships/${m_id}/devices"
              payload: { hardware_sku: "TREAD", serial: "TREAD-0001" }
              as: ServiceTechnician
              captures: { d_id: $.data.id }
            - &o_create
              call: "POST /fitness/memberships/${m_id}/hardware-orders"
              payload: { hardware_sku: "TREAD", subtotal_cents: 296000, financing_method: "FINANCE_SCHEDULED", device_id: "${d_id}" }
              as: MembershipOwner
              as_user_id: "${m_id}"
              captures: { o_id: $.data.id, o_quote: $.data.quote_total_cents }
            - &a_create
              call: "POST /fitness/delivery-appointments"
              payload: { device_id: "${d_id}", hardware_order_id: "${o_id}", start_at: "2026-09-05T13:00:00Z", end_at: "2026-09-05T15:00:00Z", zone: "METRO", technician_crew_code: "CREW-A", stair_flights: 0, has_elevator: false }
              as: ServiceTechnician
              captures: { a_id: $.data.id }
            - &a_sched
              call: "POST /fitness/delivery-appointments/${a_id}/schedule"
              payload: { start_at: "2026-09-05T13:00:00Z", end_at: "2026-09-05T15:00:00Z" }
              as: ServiceTechnician
            - &k_deliver
              call: "POST /fitness/_clock/set_current_utc"
              payload: { current_utc: "2026-09-05T13:30:00Z" }
              as: PlatformAdmin
            - &a_start
              call: "POST /fitness/delivery-appointments/${a_id}/start"
              payload: {}
              as: ServiceTechnician
          trigger:
            - call: "POST /fitness/delivery-appointments/${a_id}/complete"
              payload: { completion_grade: "CLEAN" }
              as: ServiceTechnician
              captures: { a_done: $.data.status }
          assert:
            - "HardwareOrder.${o_id}.quote_total_cents == 310800"
            - "HardwareOrder.${o_id}.captured_total_cents == 330550"
            - "HardwareOrder.${o_id}.delivery_fee_cents == 4500"
            - "HardwareOrder.${o_id}.finance_charge_cents == 30050"
            - "HardwareOrder.${o_id}.captured_total_cents != HardwareOrder.${o_id}.quote_total_cents (330550 != 310800)"
            - "the forward variant saw a pre-finance basis of 296000 (< 300000, rate 500 bps) and the chronological variant saw 300500 (>= 300000, rate 1000 bps)"
            - "HardwareOrder.${o_id}.stair_carry_fee_cents == 0 and HardwareOrder.${o_id}.assembly_fee_cents == 0 (AS-DESIGNED shipping constants)"

      # -----------------------------------------------------------------------
      - name: pause_credit_variants_diverge_for_one_partial_leftover_day
        grounds:
          - calculations.pause_proration
          - state_machines.Membership.ACTIVE_to_PAUSED
          - state_machines.Membership.ACTIVE_to_CANCELLED
        distinguishing_aspect: |
          On one clock of 2026-09-17T12:00:00Z against a paid_through_at of
          2026-10-01T00:00:00Z the two VALID approaches for the same 13.5 leftover
          days disagree: the UNUSED_DAYS pause variant yields 2800 cents and the
          REMAINING_DAYS cancellation variant yields 2600 cents.
        test_recipe:
          setup:
            - "Two memberships created on the same 2026-09-01T00:00:00Z clock, both PLUS at 6000 cents/month, so both carry paid_through_at 2026-10-01T00:00:00Z. Both have a verified OWNER, a delivered and linked TREAD device and are ACTIVE."
            - "Logical clock moved to 2026-09-17T12:00:00Z, which is exactly 13.5 days before paid_through_at."
          setup_api_calls:
            - *k_start
            - *m_create
            - *u_owner
            - *uv_owner
            - *d_create
            - *o_create
            - *a_create
            - *a_sched
            - *k_deliver
            - *a_start
            - &a_complete
              call: "POST /fitness/delivery-appointments/${a_id}/complete"
              payload: { completion_grade: "CLEAN" }
              as: ServiceTechnician
            - &d_get
              call: "GET /fitness/devices/${d_id}"
              payload: {}
              as: ServiceTechnician
              captures: { d_v1: $.data.version }
            - &d_link
              call: "POST /fitness/devices/${d_id}/link"
              payload: { serial: "TREAD-0001", membership_id: "${m_id}", expected_device_version: "${d_v1}" }
              as: ServiceTechnician
            - &m_get
              call: "GET /fitness/memberships/${m_id}"
              payload: {}
              as: MembershipOwner
              as_user_id: "${m_id}"
              captures: { m_v1: $.data.version }
            - &m_act
              call: "POST /fitness/memberships/${m_id}/activate"
              payload: { expected_membership_version: "${m_v1}" }
              as: MembershipOwner
              as_user_id: "${m_id}"
            - &m2_create
              call: "POST /fitness/memberships"
              payload: { household_name: "Larkspur Household", billing_email: "lark@x.com", plan_tier: "PLUS", monthly_fee_cents: 6000 }
              as: MembershipOwner
              captures: { m2_id: $.data.id }
            - call: "POST /fitness/memberships/${m2_id}/household-users"
              payload: { display_name: "Bo Larkspur", email: "bo@x.com", role: "OWNER" }
              as: MembershipOwner
              as_user_id: "${m2_id}"
              captures: { u_bo: $.data.id, tok_bo: $.data.verification_token }
            - call: "POST /fitness/household-users/${u_bo}/verify"
              payload: { verification_token: "${tok_bo}" }
              as: Anonymous
            - call: "POST /fitness/memberships/${m2_id}/devices"
              payload: { hardware_sku: "TREAD", serial: "TREAD-0002" }
              as: ServiceTechnician
              captures: { d2_id: $.data.id }
            - &o2_create
              call: "POST /fitness/memberships/${m2_id}/hardware-orders"
              payload: { hardware_sku: "TREAD", subtotal_cents: 296000, financing_method: "FULL_PAYMENT", device_id: "${d2_id}" }
              as: MembershipOwner
              as_user_id: "${m2_id}"
              captures: { o2_id: $.data.id }
            - call: "POST /fitness/delivery-appointments"
              payload: { device_id: "${d2_id}", hardware_order_id: "${o2_id}", start_at: "2026-09-05T16:00:00Z", end_at: "2026-09-05T18:00:00Z", zone: "METRO", technician_crew_code: "CREW-B", stair_flights: 0, has_elevator: false }
              as: ServiceTechnician
              captures: { a2_id: $.data.id }
            - call: "POST /fitness/delivery-appointments/${a2_id}/schedule"
              payload: { start_at: "2026-09-05T16:00:00Z", end_at: "2026-09-05T18:00:00Z" }
              as: ServiceTechnician
            - call: "POST /fitness/delivery-appointments/${a2_id}/start"
              payload: {}
              as: ServiceTechnician
            - call: "POST /fitness/delivery-appointments/${a2_id}/complete"
              payload: { completion_grade: "CLEAN" }
              as: ServiceTechnician
            - call: "GET /fitness/devices/${d2_id}"
              payload: {}
              as: ServiceTechnician
              captures: { d2_v1: $.data.version }
            - call: "POST /fitness/devices/${d2_id}/link"
              payload: { serial: "TREAD-0002", membership_id: "${m2_id}", expected_device_version: "${d2_v1}" }
              as: ServiceTechnician
            - call: "GET /fitness/memberships/${m2_id}"
              payload: {}
              as: MembershipOwner
              as_user_id: "${m2_id}"
              captures: { m2_v1: $.data.version }
            - call: "POST /fitness/memberships/${m2_id}/activate"
              payload: { expected_membership_version: "${m2_v1}" }
              as: MembershipOwner
              as_user_id: "${m2_id}"
            - &k_mid_cycle
              call: "POST /fitness/_clock/set_current_utc"
              payload: { current_utc: "2026-09-17T12:00:00Z" }
              as: PlatformAdmin
            - call: "GET /fitness/memberships/${m_id}"
              payload: {}
              as: MembershipOwner
              as_user_id: "${m_id}"
              captures: { m_v2: $.data.version }
            - call: "GET /fitness/memberships/${m2_id}"
              payload: {}
              as: MembershipOwner
              as_user_id: "${m2_id}"
              captures: { m2_v2: $.data.version }
          trigger:
            - call: "POST /fitness/memberships/${m_id}/pause"
              payload: { pause_start_at: "2026-09-17T12:00:00Z", pause_end_at: "2026-10-01T12:00:00Z", expected_membership_version: "${m_v2}" }
              as: MembershipOwner
              as_user_id: "${m_id}"
              captures: { m_paused_credit: $.data.accrued_pause_credit_cents }
            - call: "POST /fitness/memberships/${m2_id}/cancel"
              payload: { expected_membership_version: "${m2_v2}" }
              as: MembershipOwner
              as_user_id: "${m2_id}"
              captures: { m2_cancel_credit: $.data.accrued_pause_credit_cents }
          assert:
            - "Membership.${m_id}.status == PAUSED and Membership.${m_id}.accrued_pause_credit_cents == 2800"
            - "Membership.${m2_id}.status == CANCELLED and Membership.${m2_id}.accrued_pause_credit_cents == 2600"
            - "the two memberships started from identical cycle anchors (both paid_through_at == 2026-10-01T00:00:00Z, both monthly_fee_cents == 6000) and were read on the identical clock 2026-09-17T12:00:00Z"
            - "2800 == round_half_up(6000 * ceil(13.5) / 30) and 2600 == round_half_up(6000 * floor(13.5) / 30), so 2800 != 2600 confirms the ceiling/floor divergence"
            - "Membership.${m_id}.pause_started_at == 2026-09-17T12:00:00Z and Membership.${m2_id}.pause_started_at is null"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      # -----------------------------------------------------------------------
      - name: installment_ceil_first_installment_then_floor_rest_amortizes_exactly
        grounds:
          - calculations.installment_amounts
          - entities.FinancingPlan.fields.monthly_installment_cents
          - validations[priority=9]
        distinguishing_aspect: |
          The installment schedule uses the ceil-first / floor-rest construction in
          mode (a): the first installment absorbs the whole remainder and every
          later installment is the base, so term_months is not in {6, 12, 24} is
          rejected at priority 9 while the amortization sum still closes exactly.
        test_recipe:
          setup:
            - "Empty DB. Membership PLUS with a verified OWNER, a delivered and linked TREAD device, membership ACTIVE, and a delivered FINANCE_SCHEDULED order on that device."
            - "Logical clock at 2026-09-05T13:30:00Z."
          setup_api_calls:
            - *k_start
            - *m_create
            - *u_owner
            - *uv_owner
            - *d_create
            - *o_create
            - *a_create
            - *a_sched
            - *k_deliver
            - *a_start
            - *a_complete
            - *d_get
            - *d_link
            - *m_get
            - *m_act
            - &plan_ok
              call: "POST /fitness/financing-plans"
              payload: { membership_id: "${m_id}", order_id: "${o_id}", principal_cents: 119900, term_months: 12, apr_bps: 900 }
              as: MembershipOwner
              as_user_id: "${m_id}"
              captures: { plan_ok: $.data.id, plan_ok_inst: $.data.monthly_installment_cents }
            - &plan_bad
              call: "POST /fitness/financing-plans"
              payload: { membership_id: "${m_id}", order_id: "${o_id}", principal_cents: 119900, term_months: 8, apr_bps: 900 }
              as: MembershipOwner
              as_user_id: "${m_id}"
              captures: { plan_bad: $.data.id }
          trigger:
            - call: "POST /fitness/financing-plans/${plan_ok}/installments/pay"
              payload: {}
              as: MembershipOwner
              as_user_id: "${m_id}"
            - call: "POST /fitness/financing-plans/${plan_ok}/installments/pay"
              payload: {}
              as: MembershipOwner
              as_user_id: "${m_id}"
              captures: { plan_ok_paid: $.data.installments_paid }
            - call: "POST /fitness/financing-plans/${plan_ok}/installments/rolling-correction"
              payload: {}
              as: PlatformAdmin
            - call: "POST /fitness/financing-plans/${plan_ok}/installments/pay"
              payload: {}
              as: MembershipOwner
              as_user_id: "${m_id}"
              captures: { plan_ok_paid2: $.data.installments_paid }
          assert:
            - "FinancingPlan.${plan_ok}.monthly_installment_cents == 10901 == 10890 + 11 where 10890 == floor(round_half_up(119900 * 1.09) / 12) and 11 == 130691 - 12 * 10890"
            - "FinancingPlan.${plan_ok}.installments_paid == 1 after the first pay, then 2 after the second pay (captured as ${plan_ok_paid})"
            - "amortized_sum(2) == 2 * 10890 + 11 == 21791 exactly"
            - "amortized_sum(12) == 130691 == round_half_up(119900 * (10000 + 900) / 10000)"
            - "after rolling-correction installments_paid drops back to 1 and after the following pay returns to 2 (captured as ${plan_ok_paid2}); the plan status is ORIGINATED"
            - "FinancingPlan.${plan_bad}.status == ORIGINATED and term_months 8 was rejected with 409 ERR_INSTALLMENT_COUNT_EXCEEDED at validation priority 9, not a 400 shape error"
            - "FinancingPlan.${plan_ok}.safety_disable_latched == false throughout"

      # -----------------------------------------------------------------------
      - name: stair_surcharge_round_per_term_differs_from_round_at_end
        grounds:
          - calculations.stair_carry_surcharge
          - entities.HardwareOrder.fields.stair_carry_fee_cents
        distinguishing_aspect: |
          For stair_flights 3 without an elevator the two computable orders for the
          same nested rounding disagree by 4 cents — round-per-term gives 935 and
          round-at-end gives 939 — and the scaffold pins round-per-term (mode b)
          with the whole surcharge shipped as 0 on the order total.
        test_recipe:
          setup:
            - "Empty DB. Logical clock at 2026-09-01T00:00:00Z. No order or appointment is required: the stair surcharge is an advisory read exposed by the quote endpoint."
          setup_api_calls:
            - *k_start
          trigger:
            - call: "POST /fitness/delivery-quotes"
              payload: { hardware_sku: "TREAD", zone: "METRO", stair_flights: 3, has_elevator: false, assembly_required: false }
              as: ServiceTechnician
              captures: { q_stair: $.data.stair_carry_fee_cents, q_delivery: $.data.delivery_fee_cents }
            - call: "POST /fitness/delivery-quotes"
              payload: { hardware_sku: "TREAD", zone: "METRO", stair_flights: 1, has_elevator: false, assembly_required: true }
              as: ServiceTechnician
              captures: { q_one_flight: $.data.stair_carry_fee_cents }
          assert:
            - "the first quote's stair_carry_fee_cents == 935 (captured as ${q_stair})"
            - "the first quote's delivery_fee_cents == 4500 (captured as ${q_delivery})"
            - "the forbidden round-at-end order would give 939 == round_half_up(500 * 1.0825 + 250 * 1.0825), so 935 != 939 confirms the pinned per-term order"
            - "the second quote's stair_carry_fee_cents == 542 == round_half_up(500 * 1.0825) and billable_flights == 0 because one flight is absorbed by the flat first-flight component"
            - "HardwareOrder.stair_carry_fee_cents and HardwareOrder.assembly_fee_cents both stay 0 on every order"

      # -----------------------------------------------------------------------
      - name: certification_chain_depth_is_capped_and_self_loops_are_rejected
        grounds:
          - calculations.refurb_certification_chain
          - state_machines.Device.ACTIVE_to_ACTIVE
          - errors[ERR_CERTIFICATION_CYCLE]
          - errors[ERR_CERTIFICATION_CHAIN_EXCEEDED]
        distinguishing_aspect: |
          The self-referential lineage is traversed in mode (c) with the evaluation
          order pinned to a single hop per node: a three-deep chain is accepted, a
          fourth hop is rejected with ERR_CERTIFICATION_CHAIN_EXCEEDED, and a
          self-loop on the source device is rejected with ERR_CERTIFICATION_CYCLE
          instead of recursing forever.
        test_recipe:
          setup:
            - "Empty DB. Membership PLUS with a verified OWNER, a delivered and linked TREAD device (the seed of the lineage), membership ACTIVE. Logical clock at 2026-09-05T13:30:00Z."
          setup_api_calls:
            - *k_start
            - *m_create
            - *u_owner
            - *uv_owner
            - *d_create
            - *o_create
            - *a_create
            - *a_sched
            - *k_deliver
            - *a_start
            - *a_complete
            - *d_get
            - *d_link
            - *m_get
            - *m_act
            - call: "POST /fitness/refurb-batches"
              payload: { source_device_id: "${d_id}", certification_grade: "A", performance_resale_enabled: true }
              as: ServiceTechnician
              captures: { b1: $.data.id, b1_depth: $.data.certification_chain_depth }
            - call: "POST /fitness/refurb-batches/${b1}/certify"
              payload: {}
              as: ServiceTechnician
            - call: "POST /fitness/refurb-batches/${b1}/list"
              payload: {}
              as: PlatformAdmin
            - call: "POST /fitness/refurb-batches/${b1}/sell"
              payload: { buying_membership_id: "${m_id}" }
              as: PlatformAdmin
              captures: { b1_sold_device: $.data.sold_device_id }
            - call: "POST /fitness/refurb-batches"
              payload: { source_device_id: "${b1_sold_device}", certification_grade: "A", performance_resale_enabled: true }
              as: ServiceTechnician
              captures: { b2: $.data.id }
            - call: "POST /fitness/refurb-batches/${b2}/certify"
              payload: {}
              as: ServiceTechnician
            - call: "POST /fitness/refurb-batches/${b2}/list"
              payload: {}
              as: PlatformAdmin
            - call: "POST /fitness/refurb-batches/${b2}/sell"
              payload: { buying_membership_id: "${m_id}" }
              as: PlatformAdmin
              captures: { b2_sold_device: $.data.sold_device_id }
            - call: "POST /fitness/refurb-batches"
              payload: { source_device_id: "${b2_sold_device}", certification_grade: "A", performance_resale_enabled: true }
              as: ServiceTechnician
              captures: { b3: $.data.id }
          trigger:
            - call: "POST /fitness/refurb-batches"
              payload: { source_device_id: "${b3}", certification_grade: "A", performance_resale_enabled: true }
              as: ServiceTechnician
              captures: { deep_err: $.data.error_id }
            - call: "POST /fitness/refurb-batches"
              payload: { source_device_id: "${d_id}", certification_grade: "A", performance_resale_enabled: true }
              as: ServiceTechnician
              captures: { loop_err: $.data.error_id }
          assert:
            - "RefurbBatch.${b1}.certification_chain_depth == 0 because its source device has no certifying_device_id"
            - "RefurbBatch.${b2}.certification_chain_depth == 1 and RefurbBatch.${b3}.certification_chain_depth == 2"
            - "the first trigger returns 409 ERR_CERTIFICATION_CHAIN_EXCEEDED because depth 3 + 1 exceeds MAX_CHAIN_DEPTH 3 (captured as ${deep_err})"
            - "the second trigger returns 409 ERR_CERTIFICATION_CYCLE because the lineage edge ${d_id}.certifying_device_id resolves back to ${d_id} (captured as ${loop_err})"
            - "Device.${b1_sold_device}.certifying_device_id == ${d_id} and Device.${b1_sold_device}.resale_cycle_count == 1"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:

      # -----------------------------------------------------------------------
      - name: service_order_failed_repair_loops_back_to_scheduled
        grounds:
          - state_machines.ServiceOrder.REPAIR_IN_PROGRESS_to_SCHEDULED
          - state_machines.ServiceOrder.SCHEDULED_to_REPAIR_IN_PROGRESS
          - errors[ERR_PART_REQUIRED_FOR_SCHEDULING]
        distinguishing_aspect: |
          ServiceOrder is a cyclic machine — REPAIR_IN_PROGRESS to SCHEDULED closes
          a loop back into a state the row already occupied — and it is a different
          entity from the other cyclic machine in this scaffold.
        test_recipe:
          setup:
            - "Empty DB. A delivered TREAD device with a SAFETY_CRITICAL fault order already in SCHEDULED with a crew window booked."
          setup_api_calls:
            - *k_start
            - *m_create
            - *u_owner
            - *uv_owner
            - *d_create
            - *o_create
            - *a_create
            - *a_sched
            - *k_deliver
            - *a_start
            - *a_complete
            - call: "POST /fitness/service-orders"
              payload: { device_id: "${d_id}", reported_fault_code: "NO_POWER", diagnosis_note: "unit will not power on" }
              as: ServiceTechnician
              captures: { so_id: $.data.id, so_class: $.data.fault_class }
            - call: "POST /fitness/service-orders/${so_id}/schedule"
              payload: { scheduled_start_at: "2026-09-06T09:00:00Z", scheduled_end_at: "2026-09-06T11:00:00Z" }
              as: ServiceTechnician
            - call: "POST /fitness/service-orders/${so_id}/start-repair"
              payload: {}
              as: ServiceTechnician
          trigger:
            - call: "POST /fitness/service-orders/${so_id}/fail-repair"
              payload: { diagnosis_note: "power rail replacement needed before retest" }
              as: ServiceTechnician
              captures: { so_looped: $.data.status }
            - call: "POST /fitness/service-orders"
              payload: { device_id: "${d_id}", reported_fault_code: "BELT_SLIP", diagnosis_note: "cosmetic belt abrasion" }
              as: ServiceTechnician
              captures: { so2_id: $.data.id }
            - call: "POST /fitness/service-orders/${so2_id}/schedule"
              payload: { scheduled_start_at: "2026-09-07T09:00:00Z", scheduled_end_at: "2026-09-07T11:00:00Z" }
              as: ServiceTechnician
              captures: { so2_err: $.data.error_id }
          assert:
            - "ServiceOrder.${so_id}.status == SCHEDULED after the failed repair, proving the loop back onto a previously occupied state (captured as ${so_looped})"
            - "ServiceOrder.${so_id}.failure_before_part == true and ServiceOrder.${so_id}.safety_functions_maintained == true"
            - "ServiceOrder.${so_id}.part_id is null and ServiceOrder.${so_id}.reserved_part_qty == 0"
            - "ServiceOrder.${so2_id}.fault_class == COSMETIC and its schedule attempt returns 409 ERR_PART_REQUIRED_FOR_SCHEDULING (captured as ${so2_err}) while its status stays DISPATCHED"
            - "ServiceOrder.${so2_id}.safety_functions_maintained == true and the device entitlement_lock is unchanged by any dispatch path"

      # -----------------------------------------------------------------------
      - name: financing_plan_delinquency_cycles_back_to_current
        grounds:
          - state_machines.FinancingPlan.CURRENT_to_DELINQUENT
          - state_machines.FinancingPlan.DELINQUENT_to_CURRENT
          - calculations.financing_delinquency_state
          - errors[ERR_SAFETY_DISABLE_FORBIDDEN]
        distinguishing_aspect: |
          FinancingPlan is cyclic — CURRENT to DELINQUENT to CURRENT repeats as long
          as the household catches up — and the cycle sits on a different entity than
          the ServiceOrder cycle, while the safety latch must never move in either
          direction of the loop.
        test_recipe:
          setup:
            - "Empty DB. Membership PLUS with a verified OWNER, delivered and linked TREAD device, membership ACTIVE, and an ORIGINATED 12-month financing plan on that order. Logical clock at 2026-09-05T13:30:00Z."
          setup_api_calls:
            - *k_start
            - *m_create
            - *u_owner
            - *uv_owner
            - *d_create
            - *o_create
            - *a_create
            - *a_sched
            - *k_deliver
            - *a_start
            - *a_complete
            - *d_get
            - *d_link
            - *m_get
            - *m_act
            - call: "POST /fitness/financing-plans"
              payload: { membership_id: "${m_id}", order_id: "${o_id}", principal_cents: 119900, term_months: 12, apr_bps: 900 }
              as: MembershipOwner
              as_user_id: "${m_id}"
              captures: { plan_id: $.data.id }
            - call: "POST /fitness/financing-plans/${plan_id}/installments/pay"
              payload: {}
              as: MembershipOwner
              as_user_id: "${m_id}"
          trigger:
            - call: "POST /fitness/financing-plans/${plan_id}/installments/fail"
              payload: {}
              as: PlatformAdmin
              captures: { retry_1_state: $.data.status, retry_1_count: $.data.retry_count }
            - call: "POST /fitness/financing-plans/${plan_id}/installments/fail"
              payload: {}
              as: PlatformAdmin
              captures: { retry_2_state: $.data.status }
            - call: "POST /fitness/financing-plans/${plan_id}/installments/fail"
              payload: {}
              as: PlatformAdmin
              captures: { retry_3_state: $.data.status, retry_3_delinq: $.data.delinquency_count }
            - call: "POST /fitness/financing-plans/${plan_id}/installments/pay"
              payload: {}
              as: MembershipOwner
              as_user_id: "${m_id}"
              captures: { after_pay_state: $.data.status, after_pay_late: $.data.installments_late, after_pay_retry: $.data.retry_count }
            - call: "POST /fitness/financing-plans/${plan_id}/installments/fail"
              payload: {}
              as: PlatformAdmin
              captures: { cycle_2_1: $.data.retry_count }
            - call: "POST /fitness/financing-plans/${plan_id}/installments/fail"
              payload: {}
              as: PlatformAdmin
            - call: "POST /fitness/financing-plans/${plan_id}/installments/fail"
              payload: {}
              as: PlatformAdmin
              captures: { cycle_2_delinq: $.data.delinquency_count }
          assert:
            - "retry 1 and retry 2 leave FinancingPlan.${plan_id}.status == CURRENT with retry_count 1 then 2 (boundary: 2 is still CURRENT)"
            - "retry 3 crosses the boundary: status == DELINQUENT and delinquency_count == 1 (captured as ${retry_3_delinq})"
            - "Membership.${m_id}.unpaid_financing_count == 1 and Membership.${m_id}.status == DELINQUENT and posture == RESTRICTED"
            - "the catching-up pay returns status == CURRENT with installments_late == 2 and retry_count == 0 (captured as ${after_pay_state}, ${after_pay_late}, ${after_pay_retry})"
            - "a second full triplet of failures returns DELINQUENT again with delinquency_count == 2, proving the cycle repeats rather than being one-shot"
            - "Membership.${m_id}.safety_gate_open == true and FinancingPlan.${plan_id}.safety_disable_latched == false at every observed point of the cycle"
            - "Membership.${m_id}.posture == RESTRICTED while DELINQUENT, never FROZEN, and Membership.${m_id}.attr_frozen_reason is null"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:

      # -----------------------------------------------------------------------
      - name: delivery_completion_cascades_three_hops_and_creates_a_service_order
        grounds:
          - state_machines.DeliveryAppointment.IN_PROGRESS_to_COMPLETED
          - state_machines.Device.UNASSIGNED_to_DELIVERED
          - state_machines.HardwareOrder.DELIVERY_SCHEDULED_to_DELIVERED
          - state_machines.ServiceOrder.DISPATCHED_to_PART_RESERVED
          - calculations.delivery_charge
        distinguishing_aspect: |
          An appointment completion is a depth-3 chain where each hop is caused by
          the previous one — Device moves to DELIVERED with a warranty stamp, that
          delivery recomputes the HardwareOrder, and the DAMAGED grade on that
          completion is what synthesises a ServiceOrder — rather than a parallel
          fan-out from the original call.
        test_recipe:
          setup:
            - "Empty DB. Membership PLUS with a verified OWNER; a delivered, linked and ACTIVE TREAD device from a prior CLEAN install; ACTIVE membership. Logical clock at 2026-09-06T13:30:00Z."
            - "A second TREAD device is DELIVERED against a second order whose METRO appointment is IN_PROGRESS."
          setup_api_calls:
            - *k_start
            - *m_create
            - *u_owner
            - *uv_owner
            - *d_create
            - *o_create
            - *a_create
            - *a_sched
            - *k_deliver
            - *a_start
            - *a_complete
            - *d_get
            - *d_link
            - *m_get
            - *m_act
            - call: "POST /fitness/memberships/${m_id}/devices"
              payload: { hardware_sku: "TREAD", serial: "TREAD-0002" }
              as: ServiceTechnician
              captures: { d2_id: $.data.id }
            - call: "POST /fitness/memberships/${m_id}/hardware-orders"
              payload: { hardware_sku: "TREAD", subtotal_cents: 296000, financing_method: "FULL_PAYMENT", device_id: "${d2_id}" }
              as: MembershipOwner
              as_user_id: "${m_id}"
              captures: { o2_id: $.data.id }
            - call: "POST /fitness/delivery-appointments"
              payload: { device_id: "${d2_id}", hardware_order_id: "${o2_id}", start_at: "2026-09-06T13:00:00Z", end_at: "2026-09-06T15:00:00Z", zone: "RURAL", technician_crew_code: "CREW-R", stair_flights: 2, has_elevator: false }
              as: ServiceTechnician
              captures: { a2_id: $.data.id }
            - call: "POST /fitness/delivery-appointments/${a2_id}/schedule"
              payload: { start_at: "2026-09-06T13:00:00Z", end_at: "2026-09-06T15:00:00Z" }
              as: ServiceTechnician
            - call: "POST /fitness/delivery-appointments/${a2_id}/start"
              payload: {}
              as: ServiceTechnician
          trigger:
            - call: "POST /fitness/delivery-appointments/${a2_id}/complete"
              payload: { completion_grade: "DAMAGED" }
              as: ServiceTechnician
              captures: { a2_done: $.data.status, a2_grade: $.data.completion_grade }
          assert:
            - "hop 1: Device.${d2_id}.activation_status == DELIVERED and Device.${d2_id}.provenance_source == NEW_SALE (captured from the chain, not requested directly)"
            - "hop 2: Device.${d2_id}.warranty_expires_at == 2027-09-06T13:30:00Z, exactly 365 days after the delivery instant"
            - "hop 3: HardwareOrder.${o2_id}.status == DELIVERED and HardwareOrder.${o2_id}.delivery_fee_cents == 9000 and HardwareOrder.${o2_id}.captured_total_cents == 305000 == 296000 + 9000 + 0 + 0 + 0 because financing_method is FULL_PAYMENT"
            - "the DAMAGED grade synthesises a ServiceOrder on ${d2_id} with reported_fault_code == FRAME_CRACK and fault_class == SAFETY_CRITICAL and priority == PRIORITY_SAFETY"
            - "GET /fitness/service-orders?device_id=${d2_id} returns exactly 1 row, the cascade-created FRAME_CRACK order, and it is not reachable from any creation response"
            - "GET /fitness/hardware-orders/${o2_id}/delivery-appointments returns exactly 1 row and GET /fitness/devices/${d2_id}/hardware-orders returns exactly 1 row"
            - "DeliveryAppointment.${a2_id}.status == COMPLETED and completion_grade == DAMAGED (captured as ${a2_done} and ${a2_grade})"

      # -----------------------------------------------------------------------
      - name: membership_cancellation_cascade_propagates_two_hops_to_household_users
        grounds:
          - state_machines.Membership.ACTIVE_to_CANCELLED
          - state_machines.HouseholdUser.ACTIVE_to_SUSPENDED
          - state_machines.Device.ACTIVE_to_LOCKED
          - calculations.pause_proration
        distinguishing_aspect: |
          The cancellation chain is depth 2 with each hop caused by the previous one —
          Membership reaches CANCELLED, that hop locks the Device children, and the
          same hop's HouseholdUser sweep suspends a transitive child that was created
          before the device existed.
        test_recipe:
          setup:
            - "Empty DB. Membership PLUS with a verified OWNER plus two verified MEMBER users; one delivered, linked and ACTIVE TREAD device; membership ACTIVE. Logical clock at 2026-09-17T12:00:00Z."
          setup_api_calls:
            - *k_start
            - *m_create
            - *u_owner
            - *uv_owner
            - *d_create
            - *o_create
            - *a_create
            - *a_sched
            - *k_deliver
            - *a_start
            - *a_complete
            - *d_get
            - *d_link
            - *m_get
            - *m_act
            - call: "POST /fitness/memberships/${m_id}/household-users"
              payload: { display_name: "Bea Fernwood", email: "bea@x.com", role: "MEMBER" }
              as: MembershipOwner
              as_user_id: "${m_id}"
              captures: { u_bea: $.data.id, tok_bea: $.data.verification_token }
            - call: "POST /fitness/household-users/${u_bea}/verify"
              payload: { verification_token: "${tok_bea}" }
              as: Anonymous
            - call: "POST /fitness/memberships/${m_id}/household-users"
              payload: { display_name: "Cal Fernwood", email: "cal@x.com", role: "MEMBER" }
              as: MembershipOwner
              as_user_id: "${m_id}"
              captures: { u_cal: $.data.id, tok_cal: $.data.verification_token }
            - call: "POST /fitness/household-users/${u_cal}/verify"
              payload: { verification_token: "${tok_cal}" }
              as: Anonymous
            - &k_cancel
              call: "POST /fitness/_clock/set_current_utc"
              payload: { current_utc: "2026-09-17T12:00:00Z" }
              as: PlatformAdmin
            - call: "GET /fitness/memberships/${m_id}"
              payload: {}
              as: MembershipOwner
              as_user_id: "${m_id}"
              captures: { m_v_cancel: $.data.version }
          trigger:
            - call: "POST /fitness/memberships/${m_id}/cancel"
              payload: { expected_membership_version: "${m_v_cancel}" }
              as: MembershipOwner
              as_user_id: "${m_id}"
              captures: { m_cancelled: $.data.id }
          assert:
            - "hop 1: Membership.${m_id}.status == CANCELLED and posture == FROZEN"
            - "hop 1 also banks accrued_pause_credit_cents == 2600 from the REMAINING_DAYS variant on 13.5 leftover days against monthly_fee_cents 6000"
            - "hop 2a: Device.${d_id}.activation_status == LOCKED and Device.${d_id}.entitlement_lock == true and Device.${d_id}.content_access_allowed == false"
            - "hop 2b: HouseholdUser.${u_ada}.status == SUSPENDED with suspended_reason == MEMBERSHIP_CANCELLED, and the transitive children ${u_bea} and ${u_cal} carry the same status and reason"
            - "Membership.${m_id}.active_user_count == 0 after the cascade"
            - "Membership.${m_id}.safety_gate_open == true — cancellation locks content but never disables hardware safety functions"
            - "GET /fitness/memberships/${m_id}/household-users?status=SUSPENDED returns exactly 3 rows"
  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:

      # -----------------------------------------------------------------------
      - name: delivered_order_cancel_priority_state_beats_business_fiscal
        grounds:
          - validations[priority=5]
          - validations[priority=10]
          - state_machines.HardwareOrder.DELIVERED_to_CANCELLED
          - errors[ERR_UNPAID_FINANCING_BLOCK]
        distinguishing_aspect: |
          A cancellation request that fails both the state gate (the order is
          DELIVERED and FINANCE_SCHEDULED) and the fiscal gate (the household owes a
          DELINQUENT installment) must surface ERR_INVALID_STATE at priority 5, not
          ERR_UNPAID_FINANCING_BLOCK at priority 10 — a state-versus-business_fiscal
          pair.
        test_recipe:
          setup:
            - "Empty DB. Membership PLUS with a verified OWNER, delivered and linked TREAD device, ACTIVE membership, a FINANCE_SCHEDULED delivered order and a 12-month plan driven to DELINQUENT. Logical clock at 2026-09-05T13:30:00Z."
          setup_api_calls:
            - *k_start
            - *m_create
            - *u_owner
            - *uv_owner
            - *d_create
            - *o_create
            - *a_create
            - *a_sched
            - *k_deliver
            - *a_start
            - *a_complete
            - *d_get
            - *d_link
            - *m_get
            - *m_act
            - call: "POST /fitness/financing-plans"
              payload: { membership_id: "${m_id}", order_id: "${o_id}", principal_cents: 119900, term_months: 12, apr_bps: 900 }
              as: MembershipOwner
              as_user_id: "${m_id}"
              captures: { plan_id: $.data.id }
            - call: "POST /fitness/financing-plans/${plan_id}/installments/fail"
              payload: {}
              as: PlatformAdmin
            - call: "POST /fitness/financing-plans/${plan_id}/installments/fail"
              payload: {}
              as: PlatformAdmin
            - call: "POST /fitness/financing-plans/${plan_id}/installments/fail"
              payload: {}
              as: PlatformAdmin
          trigger:
            - call: "POST /fitness/hardware-orders/${o_id}/cancel"
              payload: {}
              as: MembershipOwner
              as_user_id: "${m_id}"
              captures: { cancel_err: $.data.error_id }
          assert:
            - "the cancellation returns 409 with error_id ERR_INVALID_STATE (captured as ${cancel_err}), because HardwareOrder.${o_id} is DELIVERED and its financing_method is FINANCE_SCHEDULED"
            - "the response does NOT carry ERR_UNPAID_FINANCING_BLOCK even though Membership.${m_id}.unpaid_financing_count == 1 is also true at the same instant"
            - "Membership.${m_id}.status == DELINQUENT and Membership.${m_id}.unpaid_financing_count == 1 at the moment of the rejected call, so both gates genuinely fail together"
            - "priority 5 (state) outranks priority 10 (business_fiscal) for this endpoint"

      # -----------------------------------------------------------------------
      - name: redemptive_credit_priority_dispute_gate_beats_purchase_block
        grounds:
          - validations[priority=8]
          - validations[priority=10]
          - errors[ERR_REFUND_DISPUTE_DENIED]
          - errors[ERR_PURCHASE_BLOCKED]
          - state_machines.Membership.ACTIVE_to_DELINQUENT
        distinguishing_aspect: |
          A redemptive credit against a delivered order fails both the referential
          dispute gate and the fiscal purchase gate, and must surface
          ERR_REFUND_DISPUTE_DENIED at priority 8 rather than ERR_PURCHASE_BLOCKED at
          priority 10 — a business_referential-versus-business_fiscal pair, which is
          a different category pairing from the state-versus-fiscal instance.
        test_recipe:
          setup:
            - "Empty DB. Membership PLUS with a verified OWNER, delivered and linked TREAD device, ACTIVE membership, one delivered FULL_PAYMENT order marked with a DENIED refund dispute, and a separate DELINQUENT plan on the same household. Logical clock at 2026-09-05T13:30:00Z."
          setup_api_calls:
            - *k_start
            - *m_create
            - *u_owner
            - *uv_owner
            - *d_create
            - *o_create
            - *a_create
            - *a_sched
            - *k_deliver
            - *a_start
            - *a_complete
            - *d_get
            - *d_link
            - *m_get
            - *m_act
            - call: "POST /fitness/financing-plans"
              payload: { membership_id: "${m_id}", order_id: "${o_id}", principal_cents: 119900, term_months: 12, apr_bps: 900 }
              as: MembershipOwner
              as_user_id: "${m_id}"
              captures: { plan_id: $.data.id }
            - call: "POST /fitness/financing-plans/${plan_id}/installments/fail"
              payload: {}
              as: PlatformAdmin
            - call: "POST /fitness/financing-plans/${plan_id}/installments/fail"
              payload: {}
              as: PlatformAdmin
            - call: "POST /fitness/financing-plans/${plan_id}/installments/fail"
              payload: {}
              as: PlatformAdmin
            - call: "POST /fitness/hardware-orders/${o_id}/refund-dispute"
              payload: { resolution: "DENIED" }
              as: PlatformAdmin
            - call: "GET /fitness/memberships/${m_id}"
              payload: {}
              as: MembershipOwner
              as_user_id: "${m_id}"
              captures: { m_v_redeem: $.data.version }
          trigger:
            - call: "POST /fitness/hardware-orders/${o_id}/redeem-refund"
              payload: { redeem_credit_cents: 25000, expected_membership_version: "${m_v_redeem}" }
              as: MembershipOwner
              as_user_id: "${m_id}"
              captures: { redeem_err: $.data.error_id }
          assert:
            - "the redemption returns 409 with error_id ERR_REFUND_DISPUTE_DENIED (captured as ${redeem_err})"
            - "HardwareOrder.${o_id}.refund_dispute_status == DENIED and Membership.${m_id}.posture == RESTRICTED are simultaneously true, so both gates fail on one request"
            - "the response does NOT carry ERR_PURCHASE_BLOCKED, confirming priority 8 (business_referential) outranks priority 10 (business_fiscal)"
            - "this pairing differs from the state-versus-business_fiscal instance: neither the order nor the membership is in a forbidden state for this endpoint"

  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:

      # -----------------------------------------------------------------------
      - name: concurrent_stream_limit_exact_boundary_admits_and_one_past_evicts
        grounds:
          - calculations.concurrent_stream_limit
          - state_machines.HouseholdUser.ACTIVE_to_SUSPENDED
          - errors[ERR_CONCURRENT_LIMIT_EXCEEDED]
          - entities.Membership.fields.concurrent_limit_effective
        distinguishing_aspect: |
          The stream ceiling uses a greater-than comparison on an aggregate count, so
          active_user_count exactly equal to concurrent_limit_effective is admitted
          and exactly one past it evicts — a numeric aggregate boundary reached
          through the start-stream endpoint.
        test_recipe:
          setup:
            - "Empty DB. Membership PLUS at 6000 cents/month with concurrent_limit_override 2. One OWNER plus two MEMBER users all verified, so active_user_count is exactly 2 == concurrent_limit_effective. Logical clock at 2026-09-05T13:30:00Z."
          setup_api_calls:
            - *k_start
            - *m_create
            - *u_owner
            - *uv_owner
            - *d_create
            - *o_create
            - *a_create
            - *a_sched
            - *k_deliver
            - *a_start
            - *a_complete
            - call: "POST /fitness/memberships/${m_id}/household-users"
              payload: { display_name: "Bea Fernwood", email: "bea@x.com", role: "MEMBER" }
              as: MembershipOwner
              as_user_id: "${m_id}"
              captures: { u_bea: $.data.id, tok_bea: $.data.verification_token }
            - call: "POST /fitness/household-users/${u_bea}/verify"
              payload: { verification_token: "${tok_bea}" }
              as: Anonymous
          trigger:
            - call: "POST /fitness/household-users/${u_ada}/start-stream"
              payload: { device_serial: "TREAD-0001" }
              as: MembershipOwner
              as_user_id: "${m_id}"
              captures: { ada_serial: $.data.streaming_device_serial }
            - call: "GET /fitness/memberships/${m_id}"
              payload: {}
              as: MembershipOwner
              as_user_id: "${m_id}"
              captures: { m_v_stream: $.data.version }
            - call: "POST /fitness/household-users/${u_bea}/start-stream"
              payload: { device_serial: "TREAD-0001", expected_membership_version: "${m_v_stream}" }
              as: MembershipOwner
              as_user_id: "${m_id}"
              captures: { occupied_err: $.data.error_id }
            - call: "GET /fitness/household-users/${u_bea}"
              payload: {}
              as: MembershipOwner
              as_user_id: "${m_id}"
              captures: { bea_status: $.data.status, bea_count: $.data.eviction_count }
            - call: "GET /fitness/memberships/${m_id}"
              payload: {}
              as: MembershipOwner
              as_user_id: "${m_id}"
              captures: { m_active_users: $.data.active_user_count }
          assert:
            - "before the trigger Membership.${m_id}.active_user_count == 2 == Membership.${m_id}.concurrent_limit_effective, the exact boundary"
            - "the first start-stream is ADMITTED and HouseholdUser.${u_ada}.streaming_device_serial == TREAD-0001 (captured as ${ada_serial})"
            - "the second start-stream is REFUSED with 409 ERR_CONCURRENT_LIMIT_EXCEEDED (captured as ${occupied_err}) because the only other ACTIVE member is the caller itself and the OWNER may never be evicted"
            - "HouseholdUser.${u_bea}.status stays ACTIVE with eviction_count 0 (captured as ${bea_status} and ${bea_count})"
            - "Membership.${m_id}.active_user_count == 2 (captured as ${m_active_users}), so the count never exceeds the ceiling"

      # -----------------------------------------------------------------------
      - name: parts_safety_stock_exact_and_one_past_boundary
        grounds:
          - calculations.parts_stock_position
          - errors[ERR_PART_SAFETY_STOCK]
          - state_machines.ServiceOrder.DISPATCHED_to_PART_RESERVED
          - entities.PartsInventory.fields.reservable_qty
        distinguishing_aspect: |
          The parts reservation admits requested qty exactly equal to reservable_qty
          and rejects exactly one more, an empty-margin boundary on a different metric
          than the stream ceiling and reached through a different endpoint.
        test_recipe:
          setup:
            - "Empty DB. A delivered TREAD device and a DISPATCHED COSMETIC service order on it. One TREAD-compatible part with safety_stock_qty 2 restocked to 7 units, so on_hand_qty is 7 and reservable_qty is 5. Logical clock at 2026-09-05T13:30:00Z."
          setup_api_calls:
            - *k_start
            - *m_create
            - *u_owner
            - *uv_owner
            - *d_create
            - *o_create
            - *a_create
            - *a_sched
            - *k_deliver
            - *a_start
            - *a_complete
            - call: "POST /fitness/parts-inventory"
              payload: { part_code: "TREAD-BELT-42", compatible_sku: "TREAD", safety_stock_qty: 2, part_lot_key: "LOT-2026-09" }
              as: PlatformAdmin
              captures: { pi_id: $.data.id }
            - call: "POST /fitness/parts-inventory/${pi_id}/restock"
              payload: { quantity: 7 }
              as: PlatformAdmin
            - call: "POST /fitness/service-orders"
              payload: { device_id: "${d_id}", reported_fault_code: "BELT_SLIP", diagnosis_note: "belt abrasion, unit still usable" }
              as: ServiceTechnician
              captures: { so_id: $.data.id }
          trigger:
            - call: "POST /fitness/service-orders/${so_id}/reserve-part"
              payload: { part_id: "${pi_id}", quantity: 4 }
              as: ServiceTechnician
              captures: { so_reserved: $.data.status, so_qty: $.data.reserved_part_qty }
            - call: "POST /fitness/service-orders/${so_id}/reserve-part"
              payload: { part_id: "${pi_id}", quantity: 1 }
              as: ServiceTechnician
              captures: { second_state: $.data.status, second_qty: $.data.reserved_part_qty }
            - call: "POST /fitness/service-orders/${so_id}/reserve-part"
              payload: { part_id: "${pi_id}", quantity: 1 }
              as: ServiceTechnician
              captures: { second_err: $.data.error_id }
          assert:
            - "PartsInventory.${pi_id}.on_hand_qty == 7 and PartsInventory.${pi_id}.safety_stock_qty == 2 so reservable_qty == 5"
            - "the reservation of exactly 4 is ADMITTED (captured as ${so_reserved} == PART_RESERVED with reserved_part_qty == 4), leaving exactly 1 unit of margin"
            - "the reservation of exactly 1 more is ADMITTED (captured as ${second_qty} == 5) because 1 <= reservable_qty 1 at the exact boundary"
            - "PartsInventory.${pi_id}.reserved_qty == 5 and PartsInventory.${pi_id}.on_hand_qty == 2, so on_hand_qty now EQUALS safety_stock_qty exactly and no further unit is reservable"
            - "the follow-up reservation of exactly 1 more unit is rejected with 409 ERR_PART_SAFETY_STOCK (captured as ${second_err}), not admitted on an empty margin"
            - "PartsInventory.${pi_id}.reserved_qty is unchanged at 5 and PartsInventory.${pi_id}.on_hand_qty is unchanged at 2 after the rejected call"
            - "GET /fitness/parts-inventory/${pi_id}/service-orders returns exactly 1 row"

      # -----------------------------------------------------------------------
      - name: final_installment_boundary_parks_the_plan_at_paid_off
        grounds:
          - calculations.installment_amounts
          - state_machines.FinancingPlan.CURRENT_to_PAID_OFF
          - state_machines.FinancingPlan.ORIGINATED_to_CURRENT
          - errors[ERR_PLAN_ALREADY_PAID_OFF]
        distinguishing_aspect: |
          The installment counter boundary uses an equality test on installments_paid
          + 1 == term_months, so the sixth payment on a six-month plan parks the plan
          at PAID_OFF while a seventh is refused — a count boundary on a different
          metric and endpoint than the stream ceiling and the parts margin.
        test_recipe:
          setup:
            - "Empty DB. Membership PLUS with a verified OWNER, a delivered and linked TREAD device, membership ACTIVE, and a zero-APR six-month financing plan of 120000 cents principal with five installments already settled. Logical clock at 2026-09-05T13:30:00Z."
          setup_api_calls:
            - *k_start
            - *m_create
            - *u_owner
            - *uv_owner
            - *d_create
            - *o_create
            - *a_create
            - *a_sched
            - *k_deliver
            - *a_start
            - *a_complete
            - *d_get
            - *d_link
            - *m_get
            - *m_act
            - call: "POST /fitness/financing-plans"
              payload: { membership_id: "${m_id}", order_id: "${o_id}", principal_cents: 120000, term_months: 6, apr_bps: 0 }
              as: MembershipOwner
              as_user_id: "${m_id}"
              captures: { plan_id: $.data.id, plan_inst: $.data.monthly_installment_cents }
            - call: "POST /fitness/financing-plans/${plan_id}/installments/pay"
              payload: {}
              as: MembershipOwner
              as_user_id: "${m_id}"
            - call: "POST /fitness/financing-plans/${plan_id}/installments/pay"
              payload: {}
              as: MembershipOwner
              as_user_id: "${m_id}"
            - call: "POST /fitness/financing-plans/${plan_id}/installments/pay"
              payload: {}
              as: MembershipOwner
              as_user_id: "${m_id}"
            - call: "POST /fitness/financing-plans/${plan_id}/installments/pay"
              payload: {}
              as: MembershipOwner
              as_user_id: "${m_id}"
            - call: "POST /fitness/financing-plans/${plan_id}/installments/pay"
              payload: {}
              as: MembershipOwner
              as_user_id: "${m_id}"
          trigger:
            - call: "POST /fitness/financing-plans/${plan_id}/installments/pay"
              payload: {}
              as: MembershipOwner
              as_user_id: "${m_id}"
              captures: { sixth_state: $.data.status, sixth_paid: $.data.installments_paid }
            - call: "POST /fitness/financing-plans/${plan_id}/installments/pay"
              payload: {}
              as: MembershipOwner
              as_user_id: "${m_id}"
              captures: { seventh_err: $.data.error_id }
          assert:
            - "FinancingPlan.${plan_id}.monthly_installment_cents == 20000 with a zero remainder, so amortized_sum(5) == 100000"
            - "the fifth payment left FinancingPlan.${plan_id}.status == CURRENT with installments_paid 5, one short of term_months"
            - "the sixth payment crosses the boundary: status == PAID_OFF with installments_paid == 6 (captured as ${sixth_state} and ${sixth_paid}), because 5 + 1 == term_months"
            - "the seventh payment is refused with 409 ERR_PLAN_ALREADY_PAID_OFF (captured as ${seventh_err}) and installments_paid stays 6"
            - "amortized_sum(6) == 120000 == principal_cents because apr_bps is 0, so no interest accrues"
            - "FinancingPlan.${plan_id}.safety_disable_latched == false and Membership.${m_id}.safety_gate_open == true at every observation point of the schedule"

  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:

      # -----------------------------------------------------------------------
      - name: membership_activation_depends_on_device_link_state
        grounds:
          - state_machines.Membership.PROVISIONAL_to_ACTIVE
          - state_machines.Device.DELIVERED_to_LINKED
          - state_machines.Device.LINKED_to_ACTIVE
          - validations[priority=5]
        distinguishing_aspect: |
          The Membership-to-Device pair: the membership's PROVISIONAL to ACTIVE gate
          requires a child device already in LINKED, so the membership cannot advance
          on its own state alone.
        test_recipe:
          setup:
            - "Empty DB. Membership PLUS with a verified OWNER and a DELIVERED but NOT yet linked TREAD device. Logical clock at 2026-09-05T13:30:00Z."
          setup_api_calls:
            - *k_start
            - *m_create
            - *u_owner
            - *uv_owner
            - *d_create
            - *o_create
            - *a_create
            - *a_sched
            - *k_deliver
            - *a_start
            - *a_complete
            - call: "GET /fitness/memberships/${m_id}"
              payload: {}
              as: MembershipOwner
              as_user_id: "${m_id}"
              captures: { m_v_pre_act: $.data.version }
          trigger:
            - call: "POST /fitness/memberships/${m_id}/activate"
              payload: { expected_membership_version: "${m_v_pre_act}" }
              as: MembershipOwner
              as_user_id: "${m_id}"
              captures: { act_err: $.data.error_id }
            - call: "GET /fitness/devices/${d_id}"
              payload: {}
              as: ServiceTechnician
              captures: { d_v_link: $.data.version }
            - call: "POST /fitness/devices/${d_id}/link"
              payload: { serial: "TREAD-0001", membership_id: "${m_id}", expected_device_version: "${d_v_link}" }
              as: ServiceTechnician
              captures: { linked: $.data.activation_status }
            - call: "GET /fitness/memberships/${m_id}"
              payload: {}
              as: MembershipOwner
              as_user_id: "${m_id}"
              captures: { m_v_retry: $.data.version }
            - call: "POST /fitness/memberships/${m_id}/activate"
              payload: { expected_membership_version: "${m_v_retry}" }
              as: MembershipOwner
              as_user_id: "${m_id}"
              captures: { m_active: $.data.status }
            - call: "GET /fitness/devices/${d_id}"
              payload: {}
              as: ServiceTechnician
              captures: { d_after: $.data.activation_status, d_lock: $.data.entitlement_lock }
          assert:
            - "Device.${d_id}.activation_status == DELIVERED at the moment of the first activation attempt, so the LINKED sibling requirement is not met"
            - "the first activation returns 409 with error_id ERR_INVALID_STATE (captured as ${act_err}) and Membership.${m_id}.status stays PROVISIONAL"
            - "the link then succeeds and Device.${d_id}.activation_status == LINKED (captured as ${linked})"
            - "the retried activation returns 200 with Membership.${m_id}.status == ACTIVE (captured as ${m_active})"
            - "the activation's cascade flips Device.${d_id}.activation_status to ACTIVE (captured as ${d_after}) and Device.${d_id}.entitlement_lock to false (captured as ${d_lock})"

      # -----------------------------------------------------------------------
      - name: service_order_scheduling_depends_on_service_order_fault_class
        grounds:
          - state_machines.ServiceOrder.DISPATCH_PENDING_PART_to_SCHEDULED
          - state_machines.ServiceOrder.PART_RESERVED_to_SCHEDULED
          - entities.ServiceOrder.fields.fault_class
          - errors[ERR_PART_REQUIRED_FOR_SCHEDULING]
        distinguishing_aspect: |
          The ServiceOrder-to-ServiceOrder pair: the valid next state out of the same
          DISPATCH_PENDING_PART state branches on the fault_class derived from the
          device and the warranty window, so two sibling rows in identical states have
          different legal successors.
        test_recipe:
          setup:
            - "Empty DB. A delivered TREAD device, a DISPATCHED safety-critical NO_POWER order, and a DISPATCHED cosmetic SENSOR_FAULT order. Logical clock at 2026-09-05T13:30:00Z."
          setup_api_calls:
            - *k_start
            - *m_create
            - *u_owner
            - *uv_owner
            - *d_create
            - *o_create
            - *a_create
            - *a_sched
            - *k_deliver
            - *a_start
            - *a_complete
            - call: "POST /fitness/service-orders"
              payload: { device_id: "${d_id}", reported_fault_code: "NO_POWER", diagnosis_note: "dead unit" }
              as: ServiceTechnician
              captures: { so_safety: $.data.id }
            - call: "POST /fitness/service-orders"
              payload: { device_id: "${d_id}", reported_fault_code: "SENSOR_FAULT", diagnosis_note: "cadence sensor intermittent" }
              as: ServiceTechnician
              captures: { so_cosmetic: $.data.id }
          trigger:
            - call: "POST /fitness/service-orders/${so_safety}/schedule"
              payload: { scheduled_start_at: "2026-09-08T09:00:00Z", scheduled_end_at: "2026-09-08T11:00:00Z" }
              as: ServiceTechnician
              captures: { safety_state: $.data.status }
            - call: "POST /fitness/service-orders/${so_cosmetic}/schedule"
              payload: { scheduled_start_at: "2026-09-08T13:00:00Z", scheduled_end_at: "2026-09-08T15:00:00Z" }
              as: ServiceTechnician
              captures: { cosmetic_err: $.data.error_id }
          assert:
            - "ServiceOrder.${so_safety}.fault_class == SAFETY_CRITICAL and ServiceOrder.${so_safety}.priority == PRIORITY_SAFETY"
            - "the safety-critical order schedules straight out of DISPATCHED with part_id null, reaching SCHEDULED (captured as ${safety_state})"
            - "ServiceOrder.${so_cosmetic}.fault_class == COSMETIC and its identical-shaped schedule request returns 409 ERR_PART_REQUIRED_FOR_SCHEDULING (captured as ${cosmetic_err})"
            - "the two rows sit in the same fault-visible state family yet have different legal successor sets"
            - "ServiceOrder.${so_safety}.safety_functions_maintained == true and ServiceOrder.${so_cosmetic}.safety_functions_maintained == true"

  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:

      # -----------------------------------------------------------------------
      - name: delivery_crew_half_open_window_admits_abutting_and_rejects_contained
        grounds:
          - state_machines.DeliveryAppointment.REQUESTED_to_SCHEDULED
          - errors[ERR_TEMPORAL_OVERLAP]
          - validations[priority=7]
          - entities.DeliveryAppointment.fields.technician_crew_code
        distinguishing_aspect: |
          Half-open interval semantics on a crew resource: a window that merely
          abuts another (end == start) is admissible because the intervals do not
          intersect, while a window strictly contained in an existing one is
          rejected — zero-width adjacency is legal here.
        test_recipe:
          setup:
            - "Empty DB. One delivered TREAD device holding a live CREW-A window of [2026-09-05T13:00:00Z, 2026-09-05T15:00:00Z) and a second delivered TREAD device with a CREW-C window of [2026-09-10T09:00:00Z, 2026-09-10T11:00:00Z). Logical clock at 2026-09-05T13:30:00Z."
          setup_api_calls:
            - *k_start
            - *m_create
            - *u_owner
            - *uv_owner
            - *d_create
            - *o_create
            - *a_create
            - *a_sched
            - *k_deliver
            - *a_start
            - *a_complete
            - call: "POST /fitness/memberships/${m_id}/devices"
              payload: { hardware_sku: "TREAD", serial: "TREAD-0002" }
              as: ServiceTechnician
              captures: { d2_id: $.data.id }
            - call: "POST /fitness/memberships/${m_id}/hardware-orders"
              payload: { hardware_sku: "TREAD", subtotal_cents: 296000, financing_method: "FULL_PAYMENT", device_id: "${d2_id}" }
              as: MembershipOwner
              as_user_id: "${m_id}"
              captures: { o2_id: $.data.id }
            - call: "POST /fitness/delivery-appointments"
              payload: { device_id: "${d2_id}", hardware_order_id: "${o2_id}", start_at: "2026-09-10T09:00:00Z", end_at: "2026-09-10T11:00:00Z", zone: "METRO", technician_crew_code: "CREW-A", stair_flights: 0, has_elevator: false }
              as: ServiceTechnician
              captures: { a2_id: $.data.id }
          trigger:
            - call: "POST /fitness/delivery-appointments/${a2_id}/schedule"
              payload: { start_at: "2026-09-05T13:30:00Z", end_at: "2026-09-05T14:30:00Z" }
              as: ServiceTechnician
              captures: { contained_err: $.data.error_id }
            - call: "POST /fitness/delivery-appointments/${a2_id}/schedule"
              payload: { start_at: "2026-09-05T15:00:00Z", end_at: "2026-09-05T17:00:00Z" }
              as: ServiceTechnician
              captures: { abut_state: $.data.status }
          assert:
            - "the contained window [2026-09-05T13:30:00Z, 2026-09-05T14:30:00Z) is strictly inside CREW-A's live window [2026-09-05T13:00:00Z, 2026-09-05T15:00:00Z) and is rejected with 409 ERR_TEMPORAL_OVERLAP (captured as ${contained_err})"
            - "DeliveryAppointment.${a2_id}.status stays REQUESTED after the rejection, so the rejected attempt moved nothing"
            - "the abut window starting exactly at the live window's end_at 2026-09-05T15:00:00Z is ADMITTED and DeliveryAppointment.${a2_id}.status becomes SCHEDULED (captured as ${abut_state})"
            - "the abut attempt succeeded because the half-open intervals do not intersect: 2026-09-05T15:00:00Z is a boundary point of neither closed window"
            - "the same contained window submitted for a different crew code is admitted, because occupancy is scoped to technician_crew_code and DeliveryAppointment.${a2_id} is the only CREW-A row on that date"
            - "GET /fitness/hardware-orders/${o2_id}/delivery-appointments returns exactly 1 row"

      # -----------------------------------------------------------------------
      - name: instructor_licensing_window_clamps_the_on_demand_library
        grounds:
          - state_machines.ClassSession.DRAFT_to_PUBLISHED
          - state_machines.ClassSession.PUBLISHED_to_ARCHIVED
          - calculations.run_ops_sweep
          - entities.ClassSession.fields.on_demand_window_ends_at
          - validations[priority=7]
        distinguishing_aspect: |
          Overlap semantics on an instructor resource differ from the crew rule: the
          intervals are half-open with a 24-hour post-session library extension, and
          the library window is CLAMPED to the licensing boundary rather than merely
          rejected for adjacency.
        test_recipe:
          setup:
            - "Empty DB. No membership is needed: the instructor owns a CLASS-CONTRACT window from 2026-09-10T00:00:00Z to 2026-09-20T00:00:00Z. Logical clock at 2026-09-01T00:00:00Z."
          setup_api_calls:
            - *k_start
            - call: "POST /fitness/class-sessions"
              payload: { title: "Threshold Ride", instructor_name: "COACH-MAYA", discipline: "CYCLING", delivery_mode: "ON_DEMAND", starts_at: "2026-09-10T09:00:00Z", ends_at: "2026-09-10T11:00:00Z", capacity: 100, license_starts_at: "2026-09-10T00:00:00Z", license_ends_at: "2026-09-20T00:00:00Z" }
              as: Instructor
              captures: { s_lib: $.data.id }
            - call: "POST /fitness/class-sessions/${s_lib}/publish"
              payload: {}
              as: Instructor
              captures: { s_lib_window: $.data.on_demand_window_ends_at }
            - call: "POST /fitness/class-sessions"
              payload: { title: "Late Window Ride", instructor_name: "COACH-MAYA", discipline: "CYCLING", delivery_mode: "ON_DEMAND", starts_at: "2026-09-19T22:00:00Z", ends_at: "2026-09-19T23:00:00Z", capacity: 100, license_starts_at: "2026-09-10T00:00:00Z", license_ends_at: "2026-09-20T00:00:00Z" }
              as: Instructor
              captures: { s_clamp: $.data.id }
            - call: "POST /fitness/class-sessions/${s_clamp}/publish"
              payload: {}
              as: Instructor
              captures: { s_clamp_window: $.data.on_demand_window_ends_at }
            - call: "POST /fitness/class-sessions"
              payload: { title: "Out Of License Ride", instructor_name: "COACH-MAYA", discipline: "CYCLING", delivery_mode: "LIVE", starts_at: "2026-09-21T09:00:00Z", ends_at: "2026-09-21T11:00:00Z", capacity: 100, license_starts_at: "2026-09-10T00:00:00Z", license_ends_at: "2026-09-20T00:00:00Z" }
              as: Instructor
              captures: { s_bad: $.data.id }
          trigger:
            - call: "POST /fitness/class-sessions/${s_bad}/publish"
              payload: {}
              as: Instructor
              captures: { s_bad_err: $.data.error_id }
          assert:
            - "ClassSession.${s_lib}.on_demand_window_ends_at == 2026-09-11T11:00:00Z, the plain ends_at + 24 hours (captured as ${s_lib_window})"
            - "ClassSession.${s_clamp}.on_demand_window_ends_at == 2026-09-20T00:00:00Z, CLAMPED to license_ends_at instead of the unclamped 2026-09-20T23:00:00Z (captured as ${s_clamp_window}); 2026-09-20T00:00:00Z != 2026-09-20T23:00:00Z"
            - "ClassSession.${s_bad}.publish returns 409 ERR_LICENSE_WINDOW_INVALID (captured as ${s_bad_err}) because the LIVE window ends after license_ends_at"
            - "ClassSession.${s_bad}.scheduled_status stays DRAFT"
            - "the clamp is a value rewrite rather than a rejection: no error_id appears on the abutting-library publish at all"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:

      # -----------------------------------------------------------------------
      - name: parts_reservation_release_returns_the_stock_position_to_its_start
        grounds:
          - state_machines.ServiceOrder.DISPATCHED_to_PART_RESERVED
          - state_machines.ServiceOrder.PART_RESERVED_to_DISPATCH_PENDING_PART
          - calculations.parts_stock_position
          - errors[ERR_PART_SAFETY_STOCK]
        distinguishing_aspect: |
          The conserved physical quantity is on-hand part stock: reserve then release
          leaves stock_received_qty, reserved_qty, consumed_qty and on_hand_qty all at
          their pre-reservation values, with no drift in the reservation ledger.
        test_recipe:
          setup:
            - "Empty DB. A delivered TREAD device, a DISPATCHED cosmetic BELT_SLIP order, and a TREAD-compatible part restocked to 7 units with safety_stock_qty 2. Logical clock at 2026-09-05T13:30:00Z."
          setup_api_calls:
            - *k_start
            - *m_create
            - *u_owner
            - *uv_owner
            - *d_create
            - *o_create
            - *a_create
            - *a_sched
            - *k_deliver
            - *a_start
            - *a_complete
            - call: "POST /fitness/parts-inventory"
              payload: { part_code: "TREAD-BELT-42", compatible_sku: "TREAD", safety_stock_qty: 2, part_lot_key: "LOT-2026-09" }
              as: PlatformAdmin
              captures: { pi_id: $.data.id }
            - call: "POST /fitness/parts-inventory/${pi_id}/restock"
              payload: { quantity: 7 }
              as: PlatformAdmin
            - call: "POST /fitness/service-orders"
              payload: { device_id: "${d_id}", reported_fault_code: "BELT_SLIP", diagnosis_note: "belt abrasion" }
              as: ServiceTechnician
              captures: { so_id: $.data.id }
            - call: "GET /fitness/parts-inventory/${pi_id}"
              payload: {}
              as: ServiceTechnician
              captures: { pi_before_received: $.data.stock_received_qty, pi_before_reserved: $.data.reserved_qty, pi_before_consumed: $.data.consumed_qty, pi_before_onhand: $.data.on_hand_qty }
          trigger:
            - call: "POST /fitness/service-orders/${so_id}/reserve-part"
              payload: { part_id: "${pi_id}", quantity: 3 }
              as: ServiceTechnician
              captures: { so_after_reserve: $.data.status }
            - call: "POST /fitness/parts-inventory/${pi_id}/reservation-release"
              payload: { service_order_id: "${so_id}", quantity: 3 }
              as: PlatformAdmin
              captures: { so_after_release: $.data.status, so_part_after: $.data.part_id }
          assert:
            - "the reservation moved ServiceOrder.${so_id}.status to PART_RESERVED (captured as ${so_after_reserve})"
            - "the release moved it back to DISPATCH_PENDING_PART (captured as ${so_after_release}) with part_id null (captured as ${so_part_after})"
            - "the conservation invariant holds: PartsInventory.${pi_id}.stock_received_qty == ${pi_before_received} == 7"
            - "PartsInventory.${pi_id}.reserved_qty == ${pi_before_reserved} == 0 after the release"
            - "PartsInventory.${pi_id}.consumed_qty == ${pi_before_consumed} == 0 and PartsInventory.${pi_id}.on_hand_qty == ${pi_before_onhand} == 7"
            - "the aggregate books balance: stock_received_qty - reserved_qty - consumed_qty == on_hand_qty at both observation points"
            - "ServiceOrder.${so_id}.reserved_part_qty == 0 after the full release"

      # -----------------------------------------------------------------------
      - name: class_enrollment_drop_returns_the_session_count_to_its_start
        grounds:
          - state_machines.ClassEnrollment.ENROLLED_to_DROPPED
          - calculations.class_enrollment_count
          - calculations.run_ops_sweep
          - entities.ClassSession.fields.live_enrollment_count
        distinguishing_aspect: |
          The conserved cardinality quantity is the session's open-enrollment count:
          enroll then drop leaves live_enrollment_count back at its pre-enrollment
          value, and the same quantity is re-derived independently by the ops sweep
          without drift.
        test_recipe:
          setup:
            - "Empty DB. Membership PLUS with a verified OWNER and a delivered, linked and ACTIVE TREAD device; membership ACTIVE. A PUBLISHED ON_DEMAND CYCLING session owned by COACH-MAYA with capacity 100. Logical clock at 2026-09-05T13:30:00Z."
          setup_api_calls:
            - *k_start
            - *m_create
            - *u_owner
            - *uv_owner
            - *d_create
            - *o_create
            - *a_create
            - *a_sched
            - *k_deliver
            - *a_start
            - *a_complete
            - *d_get
            - *d_link
            - *m_get
            - *m_act
            - call: "POST /fitness/class-sessions"
              payload: { title: "Threshold Ride", instructor_name: "COACH-MAYA", discipline: "CYCLING", delivery_mode: "ON_DEMAND", starts_at: "2026-09-10T09:00:00Z", ends_at: "2026-09-10T11:00:00Z", capacity: 100, license_starts_at: "2026-09-10T00:00:00Z", license_ends_at: "2026-09-20T00:00:00Z" }
              as: Instructor
              captures: { s_id: $.data.id }
            - call: "POST /fitness/class-sessions/${s_id}/publish"
              payload: {}
              as: Instructor
            - call: "GET /fitness/class-sessions/${s_id}"
              payload: {}
              as: Instructor
              captures: { s_count_before: $.data.live_enrollment_count }
          trigger:
            - call: "POST /fitness/class-enrollments"
              payload: { class_session_id: "${s_id}", device_id: "${d_id}", enroller_user_id: "${u_ada}" }
              as: MembershipOwner
              as_user_id: "${m_id}"
              captures: { ce_id: $.data.id, ce_status: $.data.status }
            - call: "POST /fitness/class-enrollments/${ce_id}/drop"
              payload: {}
              as: MembershipOwner
              as_user_id: "${m_id}"
              captures: { ce_after_drop: $.data.status }
          assert:
            - "ClassSession.${s_id}.live_enrollment_count == ${s_count_before} == 0 before the enrollment"
            - "the enrollment is admitted with ClassEnrollment.${ce_id}.status == ENROLLED (captured as ${ce_status}) and ClassSession.${s_id}.live_enrollment_count becomes 1"
            - "the drop returns ClassEnrollment.${ce_id}.status == DROPPED (captured as ${ce_after_drop})"
            - "the conservation invariant holds: ClassSession.${s_id}.live_enrollment_count == 0 again, exactly its pre-enrollment value"
            - "the quantity is re-derived independently: after POST /fitness/_run_ops the session's live_enrollment_count is unchanged at 0 because DROPPED rows are excluded from the aggregation"
            - "GET /fitness/class-sessions/${s_id}/class-enrollments?status=DROPPED returns exactly 1 row and the ENROLLED filter returns 0 rows"
            - "no ClassEnrollment row was deleted: the total row count on the session is 1"
