            - call: "POST /playground/pledges/${pledge_b_id}/collect"
              payload: {}
              as: ClientRepresentative
              as_user_id: "client-1"
            - call: "GET /playground/projects/${proj_id}"
              payload: {}
              as: DesignConsultant
              as_user_id: "consultant-1"
              captures: { funds_2: $.data.funds_collected_cents, permit_2: $.data.alloc_permit_freight_cents, surf_2: $.data.alloc_surfacing_cents, struct_2: $.data.alloc_structure_cents, cont_2: $.data.alloc_contingency_cents }
            - call: "POST /playground/pledges/${pledge_b_id}/refund"
