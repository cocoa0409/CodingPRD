              captures: { req_v3: $.data.version }
            - call: "POST /ats/candidates"
              payload: { full_name: "C1", email: "ca1@example.com", source_channel: "DIRECT", eeo_ethnicity: "WHITE", eeo_gender: "MALE", eeo_veteran: false, eeo_disability: false }
              as: Recruiter
              as_user_id: "rec_alice"
              captures: { c1_id: $.data.id }
            - call: "POST /ats/candidates"
              payload: { full_name: "C2", email: "ca2@example.com", source_channel: "DIRECT", eeo_ethnicity: "WHITE", eeo_gender: "MALE", eeo_veteran: false, eeo_disability: false }
              as: Recruiter
              as_user_id: "rec_alice"
              captures: { c2_id: $.data.id }
            - call: "POST /ats/applications"
              payload: { candidate_id: "${c1_id}", requisition_id: "${req_id}" }
              as: Recruiter
              as_user_id: "rec_alice"
              captures: { app1_id: $.data.id }
            - call: "POST /ats/applications"
              payload: { candidate_id: "${c2_id}", requisition_id: "${req_id}" }
              as: Recruiter
              as_user_id: "rec_alice"
              captures: { app2_id: $.data.id }
            - call: "POST /ats/applications/${app1_id}/screen"
              payload: {}
              as: Recruiter
              as_user_id: "rec_alice"
            - call: "POST /ats/applications/${app2_id}/screen"
              payload: {}
              as: Recruiter
              as_user_id: "rec_alice"
            - call: "POST /ats/offers"
              payload: { application_id: "${app1_id}", base_salary_cents: 12000000, signing_bonus_cents: 0 }
              as: Recruiter
              as_user_id: "rec_alice"
              captures: { offer1_id: $.data.id, offer1_v1: $.data.version }
            - call: "POST /ats/offers/${offer1_id}/approve"
              payload: { expected_offer_version: "${offer1_v1}" }
              as: CompApprover
              as_user_id: "comp_carol"
              captures: { offer1_v2: $.data.version }
            - call: "POST /ats/offers/${offer1_id}/approve"
              payload: { expected_offer_version: "${offer1_v2}" }
              as: VP
              as_user_id: "vp_dave"
            - call: "GET /ats/requisitions/${req_id}"
              payload: {}
              as: Recruiter
              as_user_id: "rec_alice"
              captures: { req_v_current: $.data.version }
          trigger:
            - call: "POST /ats/requisitions/${req_id}/cancel"
              payload: { expected_requisition_version: "${req_v_current}" }
              as: HiringManager
              as_user_id: "hm_bob"
              captures: { req_after: $.data.status }
            - call: "GET /ats/applications"
              payload: { requisition_id: "${req_id}" }
