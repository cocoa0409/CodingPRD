            - "a purely domestic LAX -> JFK itinerary with the same score would carry the full 168 hours instead"

      - name: station_reserved_bay_count_reconciles_with_open_allocations
        claim_type: derived_field_reconciliation
        grounds:
          - entities.Station.fields.reserved_bay_count
          - endpoints.POST /kennel-allocations/{id}/occupy
          - endpoints.POST /kennel-allocations/{id}/release
        distinguishing_aspect: "reserved_bay_count tracks every allocation that still holds space - both RESERVED and OCCUPIED - so moving one allocation to OCCUPIED leaves the counter at 3, and only a release decrements it; the derived field always equals the summed bay_count of the non-released children."
