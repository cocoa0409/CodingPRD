  - section: state_machines
    instances:

      - name: job_quote_starts_in_draft_with_no_negotiation_history
        claim_type: initial_state
        grounds:
          - state_machines.JobQuote.initial_state
          - entities.JobQuote.fields.round_count
        distinguishing_aspect: "A newly created JobQuote is DRAFT with round_count 0, revision_count 0 and every negotiated/term field still null — nothing about the quote is priced until submit."
        test_recipe:
          setup:
            - "Store HD-101 and one MEMBER account exist."
          setup_api_calls:
            - call: "POST /pro/stores"
              payload: { store_code: "HD-101", region_code: "MIDWEST", state_code: "IL", distance_rank: 1, will_call_bay_slots: 2, lift_gate_available: true, tax_rate_pct: 0.0825, max_stage_hours: 48 }
              as: PlatformAdmin
              captures: { store_id: "$.data.id" }
            - call: "POST /pro/pro-accounts"
              payload: { business_name: "Cycle Roofing", home_store_id: "${store_id}" }
              as: PlatformAdmin
              captures: { acct_id: "$.data.id" }
          trigger:
            - call: "POST /pro/job-quotes"
              payload: { pro_account_id: "${acct_id}", originating_store_id: "${store_id}", job_name: "ROOF-A", requested_term_days: 30 }
              as: ContractorAdmin
              as_user_id: "${acct_id}"
              captures: { quote_id: "$.data.id" }
