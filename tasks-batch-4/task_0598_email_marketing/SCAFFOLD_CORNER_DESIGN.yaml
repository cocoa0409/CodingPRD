  # =========================================================================
  - section: rbac
    instances:

      - name: approver_cannot_create_campaign
        claim_type: exclusive_operation_denied
        grounds: [roles.ComplianceApprover, roles.CampaignAuthor, "errors[ERR_FORBIDDEN_ROLE]"]
        distinguishing_aspect: "peer/segregation model: POST /campaigns is exclusive to CampaignAuthor; a ComplianceApprover attempting it gets 403 ERR_FORBIDDEN_ROLE."
        test_recipe:
          setup: ["One account with an audience, a DRAFT template, and a COMPLIANCE_APPROVER user."]
          setup_api_calls:
            - call: "POST /accounts"
              payload: { name: "Acme" }
              as: PlatformAdmin
              captures: { acct: $.data.id }
            - call: "POST /accounts/${acct}/users"
              payload: { email: "author@acme.com", user_role: "CAMPAIGN_AUTHOR" }
              as: PlatformAdmin
              captures: { author: $.data.id }
            - call: "POST /accounts/${acct}/users"
              payload: { email: "appr@acme.com", user_role: "COMPLIANCE_APPROVER" }
              as: PlatformAdmin
              captures: { approver: $.data.id }
            - call: "POST /audiences"
              payload: { account_id: "${acct}", name: "Main", default_from_email: "hi@acme.com", double_optin_required: false }
              as: CampaignAuthor
              as_user_id: "${author}"
              captures: { aud: $.data.id }
            - call: "POST /templates"
              payload: { account_id: "${acct}", name: "T", subject: "S", html_body: "<a href=\"{{unsubscribe_url}}\">u</a>" }
              as: CampaignAuthor
              as_user_id: "${author}"
              captures: { tpl: $.data.id }
          trigger:
            - call: "POST /campaigns"
              payload: { account_id: "${acct}", audience_id: "${aud}", template_id: "${tpl}", name: "C1" }
              as: ComplianceApprover
              as_user_id: "${approver}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 403"
            - "${err} == \"ERR_FORBIDDEN_ROLE\""
            - "GET /campaigns {account_id: ${acct}} returns 0 rows"

      - name: anonymous_cannot_list_subscribers
        claim_type: exclusive_operation_denied
        grounds: [roles.Anonymous, "errors[ERR_FORBIDDEN_ROLE]"]
        distinguishing_aspect: "Anonymous may only sign up, confirm and unsubscribe; GET /subscribers does not list Anonymous in its roles, so the call returns 403 ERR_FORBIDDEN_ROLE and leaks no contact data."
        test_recipe:
          setup: ["One single-opt-in audience with one CONFIRMED subscriber."]
          setup_api_calls:
            - call: "POST /accounts"
              payload: { name: "Acme" }
              as: PlatformAdmin
              captures: { acct: $.data.id }
            - call: "POST /audiences"
              payload: { account_id: "${acct}", name: "Main", default_from_email: "hi@acme.com", double_optin_required: false }
              as: PlatformAdmin
              captures: { aud: $.data.id }
            - call: "POST /audiences/${aud}/subscribers"
              payload: { email: "s1@x.com", consent_source: "API" }
              as: PlatformAdmin
          trigger:
            - call: "GET /subscribers"
              payload: { audience_id: "${aud}" }
              as: Anonymous
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 403"
            - "${err} == \"ERR_FORBIDDEN_ROLE\""

      - name: dual_user_may_approve_a_campaign_authored_by_someone_else
        claim_type: Segregation of duties
        grounds: [roles.ComplianceApprover, entities.AccountUser.fields.user_role, "validations[priority=8]"]
        distinguishing_aspect: "The SoD rule is per-campaign, not per-user: a DUAL user may legitimately claim ComplianceApprover and APPROVE a campaign authored by a DIFFERENT AccountUser, and the approval succeeds with approved_by_user_id set to the DUAL user."
        test_recipe:
          setup: ["One account with author u1 (CAMPAIGN_AUTHOR) and u2 (DUAL); campaign C1 authored by u1 sits IN_REVIEW with a compliant PUBLISHED template."]
          setup_api_calls:
            - call: "POST /accounts"
              payload: { name: "Acme" }
              as: PlatformAdmin
              captures: { acct: $.data.id }
            - call: "POST /accounts/${acct}/users"
              payload: { email: "u1@acme.com", user_role: "CAMPAIGN_AUTHOR" }
              as: PlatformAdmin
              captures: { u1: $.data.id }
            - call: "POST /accounts/${acct}/users"
              payload: { email: "u2@acme.com", user_role: "DUAL" }
              as: PlatformAdmin
              captures: { u2: $.data.id }
            - call: "POST /audiences"
              payload: { account_id: "${acct}", name: "Main", default_from_email: "hi@acme.com", double_optin_required: false }
              as: CampaignAuthor
              as_user_id: "${u1}"
              captures: { aud: $.data.id }
            - call: "POST /templates"
              payload: { account_id: "${acct}", name: "T", subject: "S", html_body: "<a href=\"{{unsubscribe_url}}\">u</a>" }
              as: CampaignAuthor
              as_user_id: "${u1}"
              captures: { tpl: $.data.id }
            - call: "POST /templates/${tpl}/publish"
              payload: {}
              as: CampaignAuthor
              as_user_id: "${u1}"
            - call: "POST /campaigns"
              payload: { account_id: "${acct}", audience_id: "${aud}", template_id: "${tpl}", name: "C1" }
              as: CampaignAuthor
              as_user_id: "${u1}"
              captures: { c1: $.data.id }
            - call: "POST /campaigns/${c1}/submit-review"
              payload: {}
              as: CampaignAuthor
              as_user_id: "${u1}"
          trigger:
            - call: "POST /campaigns/${c1}/review"
              payload: { decision: "APPROVE", note: "looks good" }
              as: ComplianceApprover
              as_user_id: "${u2}"
              captures: { st: $.data.status }
          assert:
            - "${st} == \"APPROVED\""
            - "Campaign.${c1}.created_by_user_id == \"${u1}\""
            - "Campaign.${c1}.approved_by_user_id == \"${u2}\""
            - "Campaign.${c1}.pinned_template_version == 2"

      - name: platform_admin_exempt_from_cross_account_check
        claim_type: hierarchical_override
        grounds: [roles.PlatformAdmin, "validations[priority=7]"]
        distinguishing_aspect: "PlatformAdmin has identity `opaque` and is explicitly exempt from the priority-7 tenancy check: the same admin id may create audiences under two different accounts, both succeeding with 201."
        test_recipe:
          setup: ["Two accounts A and B."]
          setup_api_calls:
            - call: "POST /accounts"
              payload: { name: "A" }
              as: PlatformAdmin
              captures: { acctA: $.data.id }
            - call: "POST /accounts"
              payload: { name: "B" }
              as: PlatformAdmin
              captures: { acctB: $.data.id }
          trigger:
            - call: "POST /audiences"
              payload: { account_id: "${acctA}", name: "LA", default_from_email: "a@x.com" }
              as: PlatformAdmin
              captures: { la: $.data.id }
            - call: "POST /audiences"
              payload: { account_id: "${acctB}", name: "LB", default_from_email: "b@x.com" }
              as: PlatformAdmin
              captures: { lb: $.data.id }
          assert:
            - "both calls return HTTP 201"
            - "Audience.${la}.account_id == \"${acctA}\""
            - "Audience.${lb}.account_id == \"${acctB}\""

  # =========================================================================
  - section: cross_cutting_layers
    instances:

      - name: occ_stale_account_version_on_schedule_returns_412
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[campaign-schedule-stale-account]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "Two strictly sequential schedules: the client reads Account.version once, schedules C1 successfully (which bumps the version), then schedules C2 still carrying the pre-C1 version -- rejected with 412 ERR_STALE_VERSION, and C2 reserves no credits."
        test_recipe:
          setup:
            - "One account (100 credits, capacity 100) with a single-opt-in audience of 2 CONFIRMED subscribers."
            - "Campaigns C1 and C2 are both APPROVED. The client captured Account.version BEFORE scheduling anything."
          setup_api_calls:
            - call: "POST /accounts"
              payload: { name: "Acme", initial_send_credits: 100, hourly_send_capacity: 100 }
              as: PlatformAdmin
              captures: { acct: $.data.id }
            - call: "POST /accounts/${acct}/users"
              payload: { email: "author@acme.com", user_role: "CAMPAIGN_AUTHOR" }
              as: PlatformAdmin
              captures: { author: $.data.id }
            - call: "POST /accounts/${acct}/users"
              payload: { email: "appr@acme.com", user_role: "COMPLIANCE_APPROVER" }
              as: PlatformAdmin
              captures: { approver: $.data.id }
            - call: "POST /audiences"
              payload: { account_id: "${acct}", name: "Main", default_from_email: "hi@acme.com", double_optin_required: false }
              as: CampaignAuthor
              as_user_id: "${author}"
              captures: { aud: $.data.id }
            - call: "POST /audiences/${aud}/subscribers"
              payload: { email: "s1@x.com", consent_source: "API" }
              as: CampaignAuthor
              as_user_id: "${author}"
            - call: "POST /audiences/${aud}/subscribers"
              payload: { email: "s2@x.com", consent_source: "API" }
              as: CampaignAuthor
              as_user_id: "${author}"
            - call: "POST /templates"
              payload: { account_id: "${acct}", name: "T", subject: "S", html_body: "<a href=\"{{unsubscribe_url}}\">u</a>" }
              as: CampaignAuthor
              as_user_id: "${author}"
              captures: { tpl: $.data.id }
            - call: "POST /templates/${tpl}/publish"
              payload: {}
              as: CampaignAuthor
              as_user_id: "${author}"
            - call: "POST /campaigns"
              payload: { account_id: "${acct}", audience_id: "${aud}", template_id: "${tpl}", name: "C1" }
              as: CampaignAuthor
              as_user_id: "${author}"
              captures: { c1: $.data.id }
            - call: "POST /campaigns/${c1}/submit-review"
              payload: {}
              as: CampaignAuthor
              as_user_id: "${author}"
            - call: "POST /campaigns/${c1}/review"
              payload: { decision: "APPROVE" }
              as: ComplianceApprover
              as_user_id: "${approver}"
            - call: "POST /campaigns"
              payload: { account_id: "${acct}", audience_id: "${aud}", template_id: "${tpl}", name: "C2" }
              as: CampaignAuthor
              as_user_id: "${author}"
              captures: { c2: $.data.id }
            - call: "POST /campaigns/${c2}/submit-review"
              payload: {}
              as: CampaignAuthor
              as_user_id: "${author}"
            - call: "POST /campaigns/${c2}/review"
              payload: { decision: "APPROVE" }
              as: ComplianceApprover
              as_user_id: "${approver}"
            - call: "GET /accounts/${acct}"
              payload: {}
              as: CampaignAuthor
              as_user_id: "${author}"
              captures: { av: $.data.version }
          trigger:
            - call: "POST /campaigns/${c1}/schedule"
              payload: { scheduled_at: "2026-05-02T10:00:00Z", send_window_minutes: 60, expected_account_version: "${av}" }
              as: CampaignAuthor
              as_user_id: "${author}"
              captures: { st1: $.data.status }
            - call: "POST /campaigns/${c2}/schedule"
              payload: { scheduled_at: "2026-05-02T20:00:00Z", send_window_minutes: 60, expected_account_version: "${av}" }
              as: CampaignAuthor
              as_user_id: "${author}"
              captures: { err: $.data.error_id }
          assert:
            - "${st1} == \"SCHEDULED\""
            - "HTTP status == 412 on the second schedule"
            - "${err} == \"ERR_STALE_VERSION\"   # the successful C1 schedule advanced Account.version"
            - "Campaign.${c2}.status == \"APPROVED\""
            - "Campaign.${c2}.reserved_credit_count == 0"
            - "Account.${acct}.send_credit_balance == 98   # only C1's reservation took effect"

      - name: occ_stale_audience_version_on_import_returns_412
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[import-create-stale-audience]", "errors[ERR_STALE_VERSION]", entities.Audience.fields.subscriber_count]
        distinguishing_aspect: "The first import bumps Audience.version; a second, strictly sequential import that still carries the pre-import version is rejected with 412 ERR_STALE_VERSION and creates no subscribers, even though its rows are all brand new and would otherwise be accepted."
        test_recipe:
          setup: ["One single-opt-in audience with no subscribers; the client captured Audience.version before importing."]
          setup_api_calls:
            - call: "POST /accounts"
              payload: { name: "Acme" }
              as: PlatformAdmin
              captures: { acct: $.data.id }
            - call: "POST /accounts/${acct}/users"
              payload: { email: "author@acme.com", user_role: "CAMPAIGN_AUTHOR" }
              as: PlatformAdmin
              captures: { author: $.data.id }
            - call: "POST /audiences"
              payload: { account_id: "${acct}", name: "Main", default_from_email: "hi@acme.com", double_optin_required: false }
              as: CampaignAuthor
              as_user_id: "${author}"
              captures: { aud: $.data.id, aud_v: $.data.version }
          trigger:
            - call: "POST /audiences/${aud}/import-jobs"
              payload: { rows: [{ email: "i1@x.com" }, { email: "i2@x.com" }], expected_audience_version: "${aud_v}" }
              as: CampaignAuthor
              as_user_id: "${author}"
              captures: { st1: $.data.status }
            - call: "POST /audiences/${aud}/import-jobs"
              payload: { rows: [{ email: "i3@x.com" }, { email: "i4@x.com" }], expected_audience_version: "${aud_v}" }
              as: CampaignAuthor
              as_user_id: "${author}"
              captures: { err: $.data.error_id }
          assert:
            - "${st1} == \"COMPLETED\""
            - "HTTP status == 412 on the second import"
            - "${err} == \"ERR_STALE_VERSION\""
            - "Audience.${aud}.subscriber_count == 2   # i3/i4 were never created"
            - "GET /audiences/${aud}/import-jobs returns exactly 1 row"

      - name: template_version_increments_on_every_mutation
        claim_type: optimistic_concurrency
        grounds: [entities.Template.fields.status, state_machines.Template.DRAFT_to_PUBLISHED]
        distinguishing_aspect: "common_fields semantics: Template.version starts at 1 on create and increments by exactly 1 on the publish mutation, and updated_at is refreshed while created_at is not."
        test_recipe:
          setup: ["One account with a CAMPAIGN_AUTHOR."]
          setup_api_calls:
            - call: "POST /accounts"
              payload: { name: "Acme" }
              as: PlatformAdmin
              captures: { acct: $.data.id }
            - call: "POST /accounts/${acct}/users"
              payload: { email: "author@acme.com", user_role: "CAMPAIGN_AUTHOR" }
              as: PlatformAdmin
              captures: { author: $.data.id }
            - call: "POST /templates"
              payload: { account_id: "${acct}", name: "T", subject: "S", html_body: "<a href=\"{{unsubscribe_url}}\">u</a>" }
              as: CampaignAuthor
              as_user_id: "${author}"
              captures: { tpl: $.data.id, v0: $.data.version, c0: $.data.created_at }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-04T09:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /templates/${tpl}/publish"
              payload: {}
              as: CampaignAuthor
              as_user_id: "${author}"
              captures: { v1: $.data.version, u1: $.data.updated_at, c1: $.data.created_at }
          assert:
            - "${v0} == 1"
            - "${v1} == 2"
            - "${c1} == ${c0}   # created_at is never rewritten"
            - "${u1} == \"2026-05-04T09:00:00.000Z\""

      - name: hard_bounce_rate_exactly_at_threshold_suspends_account
        claim_type: rate_threshold_triggers
        grounds: [calculations.sender_reputation_score, state_machines.Account.ACTIVE_to_SUSPENDED, entities.Account.fields.suspension_reason]
        distinguishing_aspect: "Both threshold comparisons are `>=`: with exactly 4 scored sends (BOUNCE_SUSPENSION_MIN_SENDS) and exactly 1 hard bounce (rate 0.25 == BOUNCE_SUSPENSION_HARD_RATE), the account IS suspended -- the boundary value itself trips the rule."
        test_recipe:
          setup: ["One account with a single-opt-in audience of 4 CONFIRMED subscribers; campaign C1 dispatched with 4 Sends, of which 3 are already DELIVERED."]
          setup_api_calls:
            - call: "POST /accounts"
              payload: { name: "Acme", initial_send_credits: 100, hourly_send_capacity: 100 }
