            - "A reader complaint is then filed against the same story, advancing Story.version"
          setup_api_calls:
            - call: "POST /standards-desk/newsrooms"
              payload: { name: "Metro Ledger" }
              as: ExecutiveEditor
              as_user_id: "bootstrap-exec"
              captures: { nr: $.data.id }
