              payload: {}
              as: ChannelOpsEngineer
            - call: "POST /distribution/reservations"
              payload: { channel_id: "${ota1_id}", rate_plan_id: "${bar_id}", room_type_id: "${king_id}", arrival_date: "2026-09-10", nights: 1 }
              as: RevenueManager
          assert:
            - "First booking attempt: HTTP 409 with data.error_id == ERR_CONNECTION_NOT_SELLABLE (priority 12, category state), NOT ERR_OVERBOOKING_CEILING_EXCEEDED"
            - "InventoryDay.${inv_id} is unchanged by the refused call: allocated_units == 11, committed_units == 0, shared_pool_units == 0, pooled_state == EXHAUSTED"
            - "After revalidate: ChannelConnection.${ota1_conn_id}.connection_state == DEGRADED (sellable) and ChannelAllocation.${brand_alloc_id}.allocation_state == OPEN (a BRAND allotment is untouched by an OTA1 suspension)"
            - "Second booking attempt, identical payload: HTTP 409 with data.error_id == ERR_OVERBOOKING_CEILING_EXCEEDED (priority 20, category business_fiscal)"
            - "No Reservation row was created by either attempt and Channel.${ota1_id}.bookings_count == 0"

      - name: window_outside_horizon_beats_restriction_window_overlap
        grounds:
          - validations[priority=16]
          - validations[priority=17]
          - entities.Property.fields.booking_horizon_days
          - entities.Restriction.fields.restriction_type
        distinguishing_aspect: |
          Category pair business_temporal (P16 ERR_WINDOW_OUTSIDE_HORIZON) vs business_constraint
          (P17 ERR_RESTRICTION_WINDOW_OVERLAP) - a different pair from the state/business_fiscal pair
          above: the same overlapping request returns the horizon error when its end_date is one day
          past clock + 365 and the overlap error when it is pulled back inside the horizon.
        test_recipe:
          setup:
            - "Clock at 2026-08-25, property HTL-SFO with booking_horizon_days 365, so the last bookable date is 2027-08-25."
            - "Room type KING exists; no rate plans are needed because the restriction is plan-agnostic (rate_plan_id null)."
            - "One ACTIVE MIN_STAY restriction with value_nights 2 covers 2026-09-10..2027-08-20 on KING with rate_plan_id null."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-25T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /distribution/properties"
              payload: { code: "HTL-SFO", name: "Harborview SFO", currency_code: "USD", overbooking_pct_bp: 1000, booking_horizon_days: 365, mix_window_days: 30, rate_mismatch_tolerance_cents: 200, required_image_count: 5 }
              as: PlatformAdmin
              captures: { prop_id: $.data.id }
            - call: "POST /distribution/properties/${prop_id}/room-types"
              payload: { code: "KING", name: "King Room", physical_capacity_units: 10, master_description_hash: "kingv1", master_image_count: 5 }
              as: RevenueManager
              captures: { king_id: $.data.id }
            - call: "POST /distribution/restrictions"
              payload: { room_type_id: "${king_id}", restriction_type: "MIN_STAY", start_date: "2026-09-10", end_date: "2027-08-20", value_nights: 2 }
              as: RevenueManager
              captures: { restr_1_id: $.data.id }
          trigger:
            - call: "POST /distribution/restrictions"
              payload: { room_type_id: "${king_id}", restriction_type: "MIN_STAY", start_date: "2027-08-20", end_date: "2027-09-30", value_nights: 3 }
              as: RevenueManager
            - call: "POST /distribution/restrictions"
              payload: { room_type_id: "${king_id}", restriction_type: "MIN_STAY", start_date: "2027-08-20", end_date: "2027-08-25", value_nights: 3 }
              as: RevenueManager
          assert:
            - "First attempt (end_date 2027-09-30, overlapping on 2027-08-20 AND beyond the horizon): HTTP 422 with data.error_id == ERR_WINDOW_OUTSIDE_HORIZON, NOT ERR_RESTRICTION_WINDOW_OVERLAP"
            - "Second attempt (end_date 2027-08-25, the exact horizon boundary, still overlapping on 2027-08-20): HTTP 409 with data.error_id == ERR_RESTRICTION_WINDOW_OVERLAP"
            - "Restriction.${restr_1_id}.restriction_state == ACTIVE and value_nights == 2 - neither refused call mutated it"
            - "Exactly one Restriction row exists for KING after both attempts"

      - name: stop_sell_beats_overbooking_ceiling_on_booking
        grounds:
          - validations[priority=19]
          - validations[priority=20]
          - calculations.restriction_effect_resolution
          - state_machines.Restriction.ACTIVE_to_LIFTED
        distinguishing_aspect: |
          Category pair business_constraint (P19 ERR_STOP_SELL_ACTIVE) vs business_fiscal (P20
          ERR_OVERBOOKING_CEILING_EXCEEDED) - the third distinct pair: lifting the MANUAL STOP_SELL
          without touching inventory flips the identical booking from the P19 error to the P20 error.
        test_recipe:
