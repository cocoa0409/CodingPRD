              captures: { badge_id: $.data.id }
            - call: "POST /design-system/components"
              payload: { name: "Chip", slug: "chip", owning_team_id: "${team_id}" }
              as: DesignSystemLead
              captures: { chip_id: $.data.id }
            - call: "POST /design-system/components/${badge_id}/platform-implementations"
              payload: { platform: "WEB", package_name: "@ds/badge-web", package_version: "1.0.0", token_compliance_ratio: 0.90 }
              as: ContributingTeam
              as_user_id: "${team_id}"
              captures: { web_id: $.data.id }
          trigger:
            - call: "POST /design-system/components"
              payload: { name: "Badge (v2 rewrite)", slug: "badge", owning_team_id: "${team_id}" }
              as: DesignSystemLead
              captures: { e_slug: $.data.error_id }
            - call: "POST /design-system/components/${badge_id}/platform-implementations"
