    grounds:
    - calculations.share_price_quote
    - entities.Market.fields.allocated_bps
    distinguishing_aspect: 'Demand-tier boundary on the allocated_bps metric: tier flips at

      allocated_bps >= 5000 (ratio 0.50), so 4999 prices at tier 1 (unit 10000)

      while exactly 5000 prices at tier 2 (unit 12500); reachable through

      GET /markets/{id}/price-quote.

      '
