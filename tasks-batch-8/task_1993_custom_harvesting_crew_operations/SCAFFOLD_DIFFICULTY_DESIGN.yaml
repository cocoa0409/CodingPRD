            - "Settlement.${settle_a}.fuel_surcharge_cents == 16000 (delta=0.10 triggers: round_half_up(320000 * 0.10 * 0.5))"
            - "Settlement.${settle_b}.fuel_surcharge_cents == 0 (delta<0.10 does not trigger)"

      - name: moisture_pct_at_exactly_15_does_not_shrink
        grounds:
          - calculations.moisture_shrink_factor
        distinguishing_aspect: |
          Numeric threshold metric on a different measurement (moisture
          percent) and different endpoint (delivery-tickets POST) —
          moisture_pct <= 15.0 yields shrink_factor 1.0 (no shrink), and
          15.1 shrinks by 0.001. Bound at exactly 15.0.
        test_recipe:
          setup:
            - "Season ACTIVE, contract COMMITTED, stop CUTTING"
          setup_api_calls:
            - call: "POST /harvest/seasons"
              payload: { season_year: 2026, diesel_baseline_per_gallon_cents: 300, current_diesel_per_gallon_cents: 300 }
              as: HarvestOperator
              captures: { season_id: $.data.id }
            - call: "POST /harvest/seasons/${season_id}/machines"
              payload: { machine_kind: "COMBINE", label: "C1", daily_capacity_acres: 200 }
              as: HarvestOperator
              captures: { machine_id: $.data.id }
            - call: "POST /harvest/seasons/${season_id}/activate"
              payload: {}
              as: HarvestOperator
            - call: "POST /harvest/seasons/${season_id}/contracts"
              payload: { grower_name: "G", state_code: "KS", crop: "WHEAT", rate_basis: "PER_ACRE", rate_cents_per_acre: 3200, rate_cents_per_bushel: 0, committed_acres: 100 }
              as: GrowerLiaison
              captures: { contract_id: $.data.id }
            - call: "POST /harvest/contracts/${contract_id}/commit"
              payload: {}
              as: GrowerLiaison
            - call: "POST /harvest/contracts/${contract_id}/route-stops"
              payload: { planned_start_date: "2026-08-05", planned_end_date: "2026-08-07", planned_acres: 100, sequence_index: 1 }
              as: GrowerLiaison
              captures: { stop_id: $.data.id }
            - call: "POST /harvest/machine-assignments"
              payload: { route_stop_id: "${stop_id}", machine_id: "${machine_id}", assigned_start_date: "2026-08-05", assigned_end_date: "2026-08-08" }
              as: CrewBoss
            - call: "POST /harvest/route-stops/${stop_id}/depart"
              payload: {}
              as: CrewBoss
            - call: "POST /harvest/route-stops/${stop_id}/start-cutting"
              payload: {}
              as: CrewBoss
          trigger:
            - call: "POST /harvest/route-stops/${stop_id}/delivery-tickets"
              payload: { delivered_at: "2026-08-06T10:00:00Z", gross_bushels: 1000, moisture_pct: 15.0, used_our_trucks: false }
              as: CrewBoss
              captures: { ticket_dry: $.data.id }
            - call: "POST /harvest/route-stops/${stop_id}/delivery-tickets"
              payload: { delivered_at: "2026-08-06T11:00:00Z", gross_bushels: 1000, moisture_pct: 15.1, used_our_trucks: false }
              as: CrewBoss
              captures: { ticket_wet: $.data.id }
          assert:
            - "DeliveryTicket.${ticket_dry}.net_bushels == 1000.0 (no shrink at exactly 15.0)"
            - "DeliveryTicket.${ticket_wet}.net_bushels == 999.0 (shrink 0.001 at 15.1)"

  # ===========================================================================
  # Rule 7: cross_entity_state_dependency — different entity pairs
  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: settlement_issue_requires_contract_harvested
        grounds:
          - state_machines.Settlement.transitions.DRAFT_to_ISSUED
          - validations[priority=11]
        distinguishing_aspect: |
          Settlement→CustomerContract dependency: Settlement.issue requires
          the parent CustomerContract to be in HARVESTED; otherwise
          ERR_CONTRACT_NOT_HARVESTED. Different pair than the other instance.
        test_recipe:
          setup:
            - "Season ACTIVE, contract still COMMITTED (not all stops terminal), settlement created in DRAFT"
          setup_api_calls:
            - call: "POST /harvest/seasons"
              payload: { season_year: 2026, diesel_baseline_per_gallon_cents: 300, current_diesel_per_gallon_cents: 300 }
              as: HarvestOperator
              captures: { season_id: $.data.id }
            - call: "POST /harvest/seasons/${season_id}/machines"
              payload: { machine_kind: "COMBINE", label: "C1", daily_capacity_acres: 200 }
              as: HarvestOperator
              captures: { machine_id: $.data.id }
            - call: "POST /harvest/seasons/${season_id}/activate"
              payload: {}
              as: HarvestOperator
            - call: "POST /harvest/seasons/${season_id}/contracts"
              payload: { grower_name: "G", state_code: "KS", crop: "WHEAT", rate_basis: "PER_ACRE", rate_cents_per_acre: 3200, rate_cents_per_bushel: 0, committed_acres: 100 }
              as: GrowerLiaison
              captures: { contract_id: $.data.id }
            - call: "POST /harvest/contracts/${contract_id}/commit"
              payload: {}
              as: GrowerLiaison
            - call: "POST /harvest/contracts/${contract_id}/route-stops"
              payload: { planned_start_date: "2026-08-05", planned_end_date: "2026-08-06", planned_acres: 100, sequence_index: 1 }
              as: GrowerLiaison
              captures: { stop_id: $.data.id }
            - call: "POST /harvest/machine-assignments"
              payload: { route_stop_id: "${stop_id}", machine_id: "${machine_id}", assigned_start_date: "2026-08-05", assigned_end_date: "2026-08-07" }
              as: CrewBoss
            - call: "POST /harvest/route-stops/${stop_id}/depart"
              payload: {}
              as: CrewBoss
            - call: "POST /harvest/route-stops/${stop_id}/start-cutting"
              payload: {}
              as: CrewBoss
            - call: "POST /harvest/contracts/${contract_id}/settlements"
              payload: {}
              as: BillingClerk
              captures: { settlement_id: $.data.id }
            - call: "GET /harvest/contracts/${contract_id}"
              payload: {}
              as: BillingClerk
              captures: { contract_v: $.data.version }
          trigger:
            - call: "POST /harvest/settlements/${settlement_id}/issue"
              payload: { expected_contract_version: "${contract_v}" }
              as: BillingClerk
              captures: { err: $.data.error_id }
          assert:
            - "issue rejected with error_id == ERR_CONTRACT_NOT_HARVESTED (captured ${err})"
            - "CustomerContract.${contract_id}.status remains IN_PROGRESS"

      - name: route_stop_complete_requires_season_active_not_settling
        grounds:
          - state_machines.RouteStop.transitions.CUTTING_to_COMPLETED
          - validations[priority=4]
        distinguishing_aspect: |
          RouteStop→HarvestSeason dependency: stop transitions require the
          parent season to be in ACTIVE; once season transitions to
          SETTLING (via open-settlement cascade skipping remaining stops),
          depart on a still-SCHEDULED stop is rejected — the SCHEDULED stop
          is forced to SKIPPED, so subsequent depart fails with
          ERR_STOP_NOT_SCHEDULED. Different entity pair than
          Settlement→Contract.
        test_recipe:
          setup:
            - "Season ACTIVE, contract COMMITTED, one stop COMPLETED, another stop still SCHEDULED"
            - "Season transitions to SETTLING — the still-SCHEDULED stop is cascaded to SKIPPED"
          setup_api_calls:
            - call: "POST /harvest/seasons"
              payload: { season_year: 2026, diesel_baseline_per_gallon_cents: 300, current_diesel_per_gallon_cents: 300 }
              as: HarvestOperator
              captures: { season_id: $.data.id }
            - call: "POST /harvest/seasons/${season_id}/machines"
              payload: { machine_kind: "COMBINE", label: "C1", daily_capacity_acres: 200 }
              as: HarvestOperator
              captures: { machine_id: $.data.id }
            - call: "POST /harvest/seasons/${season_id}/activate"
              payload: {}
              as: HarvestOperator
            - call: "POST /harvest/seasons/${season_id}/contracts"
              payload: { grower_name: "G", state_code: "KS", crop: "WHEAT", rate_basis: "PER_ACRE", rate_cents_per_acre: 3200, rate_cents_per_bushel: 0, committed_acres: 200 }
              as: GrowerLiaison
              captures: { contract_id: $.data.id }
            - call: "POST /harvest/contracts/${contract_id}/commit"
              payload: {}
              as: GrowerLiaison
            - call: "POST /harvest/contracts/${contract_id}/route-stops"
              payload: { planned_start_date: "2026-08-05", planned_end_date: "2026-08-06", planned_acres: 100, sequence_index: 1 }
              as: GrowerLiaison
              captures: { stop1_id: $.data.id }
            - call: "POST /harvest/machine-assignments"
              payload: { route_stop_id: "${stop1_id}", machine_id: "${machine_id}", assigned_start_date: "2026-08-05", assigned_end_date: "2026-08-07" }
              as: CrewBoss
            - call: "POST /harvest/route-stops/${stop1_id}/depart"
              payload: {}
              as: CrewBoss
            - call: "POST /harvest/route-stops/${stop1_id}/start-cutting"
              payload: {}
              as: CrewBoss
            - call: "PATCH /harvest/route-stops/${stop1_id}"
              payload: { actual_acres: 100 }
              as: CrewBoss
            - call: "POST /harvest/route-stops/${stop1_id}/complete"
              payload: {}
              as: CrewBoss
            - call: "POST /harvest/contracts/${contract_id}/route-stops"
              payload: { planned_start_date: "2026-08-10", planned_end_date: "2026-08-11", planned_acres: 100, sequence_index: 2 }
              as: GrowerLiaison
              captures: { stop2_id: $.data.id }
            - call: "POST /harvest/seasons/${season_id}/open-settlement"
              payload: {}
              as: HarvestOperator
          trigger:
            - call: "POST /harvest/route-stops/${stop2_id}/depart"
              payload: {}
              as: CrewBoss
              captures: { err: $.data.error_id }
          assert:
            - "depart on cascaded stop rejected with error_id == ERR_STOP_NOT_SCHEDULED (captured ${err})"
            - "RouteStop.${stop2_id}.status == SKIPPED (re-read)"

  # ===========================================================================
  # Rule 8: resource_temporal_overlap — different interval semantics
  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: machine_assignment_half_open_interval_adjacency_allowed
        grounds:
          - calculations.machine_overlap_check
          - validations[priority=7]
        distinguishing_aspect: |
          Half-open interval semantics on Machine — adjacency (new.start ==
          existing.end) is ALLOWED, but strict overlap is REJECTED with
          ERR_MACHINE_OVERLAP. Different resource (Machine) and different
          semantics than lodging.
        test_recipe:
          setup:
            - "Season ACTIVE, contract COMMITTED, two stops, one machine"
            - "Existing assignment [2026-08-05, 2026-08-08)"
          setup_api_calls:
            - call: "POST /harvest/seasons"
              payload: { season_year: 2026, diesel_baseline_per_gallon_cents: 300, current_diesel_per_gallon_cents: 300 }
              as: HarvestOperator
              captures: { season_id: $.data.id }
            - call: "POST /harvest/seasons/${season_id}/machines"
              payload: { machine_kind: "COMBINE", label: "C1", daily_capacity_acres: 200 }
              as: HarvestOperator
              captures: { machine_id: $.data.id }
            - call: "POST /harvest/seasons/${season_id}/activate"
              payload: {}
              as: HarvestOperator
            - call: "POST /harvest/seasons/${season_id}/contracts"
              payload: { grower_name: "G", state_code: "KS", crop: "WHEAT", rate_basis: "PER_ACRE", rate_cents_per_acre: 3200, rate_cents_per_bushel: 0, committed_acres: 200 }
              as: GrowerLiaison
              captures: { contract_id: $.data.id }
            - call: "POST /harvest/contracts/${contract_id}/commit"
              payload: {}
              as: GrowerLiaison
            - call: "POST /harvest/contracts/${contract_id}/route-stops"
              payload: { planned_start_date: "2026-08-05", planned_end_date: "2026-08-07", planned_acres: 100, sequence_index: 1 }
              as: GrowerLiaison
              captures: { stop1_id: $.data.id }
            - call: "POST /harvest/machine-assignments"
              payload: { route_stop_id: "${stop1_id}", machine_id: "${machine_id}", assigned_start_date: "2026-08-05", assigned_end_date: "2026-08-08" }
              as: CrewBoss
            - call: "POST /harvest/contracts/${contract_id}/route-stops"
              payload: { planned_start_date: "2026-08-08", planned_end_date: "2026-08-10", planned_acres: 100, sequence_index: 2 }
              as: GrowerLiaison
              captures: { stop2_id: $.data.id }
            - call: "POST /harvest/contracts/${contract_id}/route-stops"
              payload: { planned_start_date: "2026-08-12", planned_end_date: "2026-08-13", planned_acres: 50, sequence_index: 3 }
              as: GrowerLiaison
              captures: { stop3_id: $.data.id }
          trigger:
            - call: "POST /harvest/machine-assignments"
              payload: { route_stop_id: "${stop2_id}", machine_id: "${machine_id}", assigned_start_date: "2026-08-08", assigned_end_date: "2026-08-11" }
              as: CrewBoss
              captures: { asg_adjacent: $.data.id }
            - call: "POST /harvest/machine-assignments"
              payload: { route_stop_id: "${stop3_id}", machine_id: "${machine_id}", assigned_start_date: "2026-08-07", assigned_end_date: "2026-08-13" }
              as: CrewBoss
              captures: { err: $.data.error_id }
          assert:
            - "Adjacent assignment created successfully (id captured as ${asg_adjacent})"
            - "Overlapping assignment rejected with error_id == ERR_MACHINE_OVERLAP (captured ${err})"

      - name: lodging_bed_capacity_aggregate_per_night
        grounds:
          - calculations.lodging_bed_capacity_check
          - validations[priority=8]
        distinguishing_aspect: |
          Aggregate-capacity semantics on LodgingSite — beds are fungible
          across reservations on the same night; sum must not exceed
          total_beds on any single calendar date. Different resource
          (LodgingSite) and different semantics (aggregate vs pairwise
          half-open interval).
        test_recipe:
          setup:
