# =============================================================================
# 1.8 Scaffold Difficulty Design (Test Targeting Index) — Expert tier
# 9 Difficulty Rules x 2 instances = 18 instances.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: box_provisional_vs_final_charge
        grounds:
          - calculations.box_charge
          - entities.BoxShipment.fields.provisional_charge_cents
          - entities.BoxShipment.fields.final_charge_cents
          - state_machines.BoxShipment.KEPT_PENDING_to_SETTLED
        distinguishing_aspect: |
          On the SAME BoxShipment, the provisional charge pinned at SHIP (full retail
          of all items, 20415) differs from the final charge pinned at SETTLE
          (kept-only, VIP-discounted, minus styling credit, 13375) — dual-variant on
          the subscription-box billing domain.
        test_recipe:
          setup:
            - "VIP customer with a LUXE subscription; a 3-item box (each retail 6805) shipped 2026-07-10 and kept in full; clock advanced past the 7-day try-on window."
          setup_api_calls:
            - call: "POST /customers/register"
              payload: { email: "dv1@x.com", full_name: "DV One", size_code: 24 }
              as: Anonymous
              captures: { cust_id: $.data.id }
            - call: "POST /customers/${cust_id}/loyalty-adjustments"
              payload: { delta_points: 2000 }
              as: StoreManager
            - call: "POST /products"
              payload: { name: "Everyday Tee", category: "TOPS", base_price_cents: 6805, size_min: 10, size_max: 34 }
              as: StoreManager
              captures: { prod_id: $.data.id }
            - call: "POST /products/${prod_id}/variants"
              payload: { size_code: 22, color: "Navy", inventory_on_hand: 20 }
              as: StoreManager
              captures: { vb1: $.data.id }
            - call: "POST /products/${prod_id}/variants"
              payload: { size_code: 24, color: "Navy", inventory_on_hand: 20 }
              as: StoreManager
              captures: { vb2: $.data.id }
            - call: "POST /products/${prod_id}/variants"
              payload: { size_code: 26, color: "Navy", inventory_on_hand: 20 }
              as: StoreManager
              captures: { vb3: $.data.id }
            - call: "POST /box-subscriptions"
              payload: { plan_tier: "LUXE" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { sub_id: $.data.id, sub_ver: $.data.version }
            - call: "POST /box-subscriptions/${sub_id}/shipments"
              payload: { expected_subscription_version: "${sub_ver}", item_variant_ids: ["${vb1}", "${vb2}", "${vb3}"] }
              as: StoreManager
              captures: { ship_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-10T00:00:00Z" }
              as: StoreManager
            - call: "POST /box-shipments/${ship_id}/ship"
              payload: {}
              as: StoreManager
              captures: { provisional: $.data.provisional_charge_cents }
            - call: "POST /box-shipments/${ship_id}/keep-decisions"
              payload: { kept_variant_ids: ["${vb1}", "${vb2}", "${vb3}"] }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-17T00:00:00Z" }
              as: StoreManager
          trigger:
            - call: "POST /box-shipments/${ship_id}/settle"
              payload: {}
              as: StoreManager
              captures: { final: $.data.final_charge_cents }
          assert:
            - "BoxShipment.${ship_id}.provisional_charge_cents == 20415"
            - "BoxShipment.${ship_id}.final_charge_cents == 13375"
            - "BoxShipment.${ship_id}.provisional_charge_cents != BoxShipment.${ship_id}.final_charge_cents"

      - name: return_provisional_vs_final_refund
        grounds:
          - calculations.return_refund
          - entities.ReturnRequest.fields.provisional_refund_cents
          - entities.ReturnRequest.fields.final_refund_cents
          - state_machines.ReturnRequest.APPROVED_to_INSPECTED
        distinguishing_aspect: |
          On the SAME ReturnRequest, the provisional refund pinned at REQUESTED
          (full returned-line totals, 12800) differs from the final refund pinned at
          INSPECT (one damaged line excluded, restock fee 1020 subtracted, 5780) —
          dual-variant on the returns/refund domain, a different entity domain than
          box billing.
        test_recipe:
          setup:
            - "A delivered order with two lines (6800 and 6000); a RETURN of both lines; at INSPECT the 6000 line is flagged damaged."
          setup_api_calls:
            - call: "POST /customers/register"
              payload: { email: "dv2@x.com", full_name: "DV Two", size_code: 22 }
              as: Anonymous
              captures: { cust_id: $.data.id }
            - call: "POST /products"
              payload: { name: "Adaptive Wrap Dress", category: "DRESSES", base_price_cents: 6000, size_min: 10, size_max: 34, restock_fee_pct: 0.15 }
              as: StoreManager
              captures: { prod_id: $.data.id }
            - call: "POST /products/${prod_id}/variants"
              payload: { size_code: 22, color: "Navy", price_delta_cents: 800, inventory_on_hand: 10 }
              as: StoreManager
              captures: { v1: $.data.id }
            - call: "POST /products/${prod_id}/variants"
              payload: { size_code: 14, color: "Black", price_delta_cents: 0, inventory_on_hand: 10 }
              as: StoreManager
              captures: { v2: $.data.id }
            - call: "POST /orders"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
              captures: { order_id: $.data.id }
            - call: "POST /orders/${order_id}/lines"
              payload: { variant_id: "${v1}", quantity: 1 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { l1: $.data.id }
            - call: "POST /orders/${order_id}/lines"
              payload: { variant_id: "${v2}", quantity: 1 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { l2: $.data.id }
            - call: "POST /orders/${order_id}/checkout"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /orders/${order_id}/transition"
              payload: { action: "CAPTURE" }
              as: StoreManager
            - call: "POST /orders/${order_id}/transition"
              payload: { action: "PICK" }
              as: StoreManager
            - call: "POST /orders/${order_id}/transition"
              payload: { action: "SHIP" }
              as: StoreManager
            - call: "POST /orders/${order_id}/transition"
              payload: { action: "DELIVER" }
              as: StoreManager
            - call: "POST /returns"
              payload: { order_id: "${order_id}", return_type: "RETURN", line_ids: ["${l1}", "${l2}"] }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { ret_id: $.data.id, prov: $.data.provisional_refund_cents }
            - call: "POST /returns/${ret_id}/transition"
              payload: { action: "APPROVE" }
              as: StoreManager
          trigger:
            - call: "POST /returns/${ret_id}/transition"
              payload: { action: "INSPECT", damaged_line_ids: ["${l2}"] }
              as: StoreManager
              captures: { final: $.data.final_refund_cents }
          assert:
            - "ReturnRequest.${ret_id}.provisional_refund_cents == 12800"
            - "ReturnRequest.${ret_id}.restock_fee_cents == 1020"
            - "ReturnRequest.${ret_id}.final_refund_cents == 5780"
            - "ReturnRequest.${ret_id}.provisional_refund_cents != ReturnRequest.${ret_id}.final_refund_cents"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: order_total_nonlinear_min_stack
        grounds:
          - calculations.order_total
          - entities.Order.fields.total_cents
          - entities.Order.fields.tier_discount_cents
          - entities.Order.fields.loyalty_redeemed_cents
        distinguishing_aspect: |
          Mode (a): the order total combines >=3 interacting inputs with non-linear
          nesting — a tier-conditional discount (VIP 10% -> 1360), a redemption capped
          by min(points-value, 30%-of-subtotal, remaining) -> 500, and a wallet min ->
          500, yielding total 11240; changing any single input changes the result.
        test_recipe:
          setup:
            - "VIP customer with 500 wallet credit; order of 2 units at 6800 each (subtotal 13600); checkout redeems 100 points and applies wallet."
          setup_api_calls:
            - call: "POST /customers/register"
              payload: { email: "cf1@x.com", full_name: "CF One", size_code: 22 }
              as: Anonymous
              captures: { cust_id: $.data.id }
            - call: "POST /customers/${cust_id}/loyalty-adjustments"
              payload: { delta_points: 2000 }
              as: StoreManager
            - call: "POST /customers/${cust_id}/wallet-adjustments"
              payload: { delta_cents: 500 }
              as: StoreManager
            - call: "POST /products"
              payload: { name: "Adaptive Wrap Dress", category: "DRESSES", base_price_cents: 6000, size_min: 10, size_max: 34 }
              as: StoreManager
              captures: { prod_id: $.data.id }
            - call: "POST /products/${prod_id}/variants"
              payload: { size_code: 22, color: "Navy", price_delta_cents: 800, inventory_on_hand: 10 }
              as: StoreManager
              captures: { v1: $.data.id }
            - call: "POST /orders"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
              captures: { order_id: $.data.id }
            - call: "POST /orders/${order_id}/lines"
              payload: { variant_id: "${v1}", quantity: 2 }
              as: Customer
              as_user_id: "${cust_id}"
          trigger:
            - call: "POST /orders/${order_id}/checkout"
              payload: { loyalty_redeem_points: 100, use_wallet_credit: true }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { total: $.data.total_cents }
          assert:
            - "Order.${order_id}.subtotal_cents == 13600"
            - "Order.${order_id}.tier_discount_cents == 1360"
            - "Order.${order_id}.loyalty_redeemed_cents == 500"
            - "Order.${order_id}.wallet_applied_cents == 500"
            - "Order.${order_id}.total_cents == 11240"

      - name: box_final_charge_round_per_item_then_sum
        grounds:
          - calculations.box_charge
          - entities.BoxShipment.fields.final_charge_cents
          - state_machines.BoxShipment.KEPT_PENDING_to_SETTLED
        distinguishing_aspect: |
          Mode (b): nested-rounding order is pinned to round-each-kept-item-then-sum.
          Three kept items at 6805 with VIP 10% give per-item round_half_up(6124.5)=6125,
          sum 18375, minus 5000 styling = 13375; sum-then-round would give 13374, so
          the pinned order is observable.
        test_recipe:
          setup:
            - "VIP customer, LUXE subscription, 3-item box each retail 6805, kept in full, settled after the try-on window."
          setup_api_calls:
            - call: "POST /customers/register"
              payload: { email: "cf2@x.com", full_name: "CF Two", size_code: 24 }
              as: Anonymous
              captures: { cust_id: $.data.id }
            - call: "POST /customers/${cust_id}/loyalty-adjustments"
              payload: { delta_points: 2000 }
              as: StoreManager
            - call: "POST /products"
              payload: { name: "Everyday Tee", category: "TOPS", base_price_cents: 6805, size_min: 10, size_max: 34 }
              as: StoreManager
              captures: { prod_id: $.data.id }
            - call: "POST /products/${prod_id}/variants"
              payload: { size_code: 22, color: "Navy", inventory_on_hand: 20 }
              as: StoreManager
              captures: { vb1: $.data.id }
            - call: "POST /products/${prod_id}/variants"
              payload: { size_code: 24, color: "Navy", inventory_on_hand: 20 }
              as: StoreManager
              captures: { vb2: $.data.id }
            - call: "POST /products/${prod_id}/variants"
              payload: { size_code: 26, color: "Navy", inventory_on_hand: 20 }
              as: StoreManager
              captures: { vb3: $.data.id }
            - call: "POST /box-subscriptions"
              payload: { plan_tier: "LUXE" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { sub_id: $.data.id, sub_ver: $.data.version }
            - call: "POST /box-subscriptions/${sub_id}/shipments"
              payload: { expected_subscription_version: "${sub_ver}", item_variant_ids: ["${vb1}", "${vb2}", "${vb3}"] }
              as: StoreManager
              captures: { ship_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-10T00:00:00Z" }
              as: StoreManager
            - call: "POST /box-shipments/${ship_id}/ship"
              payload: {}
              as: StoreManager
            - call: "POST /box-shipments/${ship_id}/keep-decisions"
              payload: { kept_variant_ids: ["${vb1}", "${vb2}", "${vb3}"] }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-17T00:00:00Z" }
              as: StoreManager
          trigger:
            - call: "POST /box-shipments/${ship_id}/settle"
              payload: {}
              as: StoreManager
              captures: { final: $.data.final_charge_cents }
          assert:
            - "BoxShipment.${ship_id}.final_charge_cents == 13375"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: order_parallel_payment_fulfillment_dimensions
        grounds:
          - state_machines.Order.PENDING_to_AUTHORIZED
          - state_machines.Order.UNFULFILLED_to_PICKING
          - entities.Order.fields.payment_status
          - entities.Order.fields.fulfillment_status
        distinguishing_aspect: |
          Parallel dimensions on one Order row: payment_status advances
          PENDING->AUTHORIZED->CAPTURED while fulfillment_status stays UNFULFILLED,
          then fulfillment advances to PICKING independently — the two status axes
          evolve on the same entity without a single linear order.
        test_recipe:
          setup:
            - "An order with one line, checked out (AUTHORIZED / UNFULFILLED), captured (CAPTURED / UNFULFILLED), then picked (CAPTURED / PICKING)."
          setup_api_calls:
            - call: "POST /customers/register"
              payload: { email: "nl1@x.com", full_name: "NL One", size_code: 22 }
              as: Anonymous
              captures: { cust_id: $.data.id }
            - call: "POST /products"
              payload: { name: "Adaptive Wrap Dress", category: "DRESSES", base_price_cents: 6000, size_min: 10, size_max: 34 }
              as: StoreManager
              captures: { prod_id: $.data.id }
            - call: "POST /products/${prod_id}/variants"
              payload: { size_code: 22, color: "Navy", inventory_on_hand: 10 }
              as: StoreManager
              captures: { v1: $.data.id }
            - call: "POST /orders"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
              captures: { order_id: $.data.id }
            - call: "POST /orders/${order_id}/lines"
              payload: { variant_id: "${v1}", quantity: 1 }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /orders/${order_id}/checkout"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /orders/${order_id}/transition"
              payload: { action: "CAPTURE" }
              as: StoreManager
          trigger:
            - call: "POST /orders/${order_id}/transition"
              payload: { action: "PICK" }
              as: StoreManager
          assert:
            - "Order.${order_id}.payment_status == CAPTURED"
            - "Order.${order_id}.fulfillment_status == PICKING"

      - name: appointment_reschedule_cycle_returns_to_confirmed
        grounds:
          - state_machines.StylingAppointment.CONFIRMED_to_RESCHEDULE_REQUESTED
          - state_machines.StylingAppointment.RESCHEDULE_REQUESTED_to_CONFIRMED
          - entities.StylingAppointment.fields.status
        distinguishing_aspect: |
          Cyclic shape on StylingAppointment: CONFIRMED -> RESCHEDULE_REQUESTED ->
          CONFIRMED returns the entity to a prior state (a genuine loop), and the
          confirmed start_at is updated to the proposed 2026-07-06T10:00:00Z.
        test_recipe:
          setup:
            - "A confirmed GENERAL appointment (2026-07-05 10:00-11:00) that the customer requests to reschedule to 2026-07-06 10:00-11:00, which the specialist re-confirms."
          setup_api_calls:
            - call: "POST /customers/register"
              payload: { email: "nl2@x.com", full_name: "NL Two", size_code: 22 }
              as: Anonymous
              captures: { cust_id: $.data.id }
            - call: "POST /specialists"
              payload: { full_name: "Stylist A", specialties: ["ADAPTIVE"] }
              as: StoreManager
              captures: { spec_id: $.data.id }
            - call: "POST /appointments"
              payload: { specialist_id: "${spec_id}", start_at: "2026-07-05T10:00:00Z", end_at: "2026-07-05T11:00:00Z" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { appt_id: $.data.id }
            - call: "POST /appointments/${appt_id}/transition"
              payload: { action: "CONFIRM" }
              as: StoreManager
            - call: "POST /appointments/${appt_id}/transition"
              payload: { action: "RESCHEDULE_REQUEST", proposed_start_at: "2026-07-06T10:00:00Z", proposed_end_at: "2026-07-06T11:00:00Z" }
              as: Customer
              as_user_id: "${cust_id}"
          trigger:
            - call: "POST /appointments/${appt_id}/transition"
              payload: { action: "RESCHEDULE_CONFIRM" }
              as: StoreManager
          assert:
            - "StylingAppointment.${appt_id}.status == CONFIRMED"
            - "StylingAppointment.${appt_id}.start_at == 2026-07-06T10:00:00Z"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: box_settle_loyalty_tier_bonus_cascade
        grounds:
          - state_machines.BoxShipment.KEPT_PENDING_to_SETTLED
          - calculations.loyalty_earn_and_tier
          - entities.Customer.fields.loyalty_tier
          - entities.Customer.fields.wallet_credit_cents
        distinguishing_aspect: |
          Depth-3 chain from box SETTLE: SETTLE credits customer.loyalty_lifetime_points
          += 154 (link1) -> the points change recomputes loyalty_tier to INSIDER as 604
          crosses 500 (link2) -> the upward tier crossing credits wallet_credit_cents +=
          1000 (link3); each hop is caused by the previous, not the trigger.
        test_recipe:
          setup:
            - "STANDARD customer pre-seeded to 450 lifetime points; LUXE box of 3 items (each 6805) kept in full and settled; final charge 15415 earns 154 points."
          setup_api_calls:
            - call: "POST /customers/register"
              payload: { email: "tc1@x.com", full_name: "TC One", size_code: 24 }
              as: Anonymous
              captures: { cust_id: $.data.id }
            - call: "POST /customers/${cust_id}/loyalty-adjustments"
              payload: { delta_points: 450 }
              as: StoreManager
            - call: "POST /products"
              payload: { name: "Everyday Tee", category: "TOPS", base_price_cents: 6805, size_min: 10, size_max: 34 }
              as: StoreManager
              captures: { prod_id: $.data.id }
            - call: "POST /products/${prod_id}/variants"
              payload: { size_code: 22, color: "Navy", inventory_on_hand: 20 }
              as: StoreManager
              captures: { vb1: $.data.id }
            - call: "POST /products/${prod_id}/variants"
              payload: { size_code: 24, color: "Navy", inventory_on_hand: 20 }
              as: StoreManager
              captures: { vb2: $.data.id }
            - call: "POST /products/${prod_id}/variants"
              payload: { size_code: 26, color: "Navy", inventory_on_hand: 20 }
              as: StoreManager
              captures: { vb3: $.data.id }
            - call: "POST /box-subscriptions"
              payload: { plan_tier: "LUXE" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { sub_id: $.data.id, sub_ver: $.data.version }
            - call: "POST /box-subscriptions/${sub_id}/shipments"
              payload: { expected_subscription_version: "${sub_ver}", item_variant_ids: ["${vb1}", "${vb2}", "${vb3}"] }
              as: StoreManager
              captures: { ship_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-10T00:00:00Z" }
              as: StoreManager
            - call: "POST /box-shipments/${ship_id}/ship"
              payload: {}
              as: StoreManager
            - call: "POST /box-shipments/${ship_id}/keep-decisions"
              payload: { kept_variant_ids: ["${vb1}", "${vb2}", "${vb3}"] }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-17T00:00:00Z" }
              as: StoreManager
          trigger:
            - call: "POST /box-shipments/${ship_id}/settle"
              payload: {}
              as: StoreManager
              captures: { pts: $.data.points_earned }
          assert:
            - "BoxShipment.${ship_id}.final_charge_cents == 15415"
            - "BoxShipment.${ship_id}.points_earned == 154"
            - "Customer.${cust_id}.loyalty_lifetime_points == 604"
            - "Customer.${cust_id}.loyalty_tier == INSIDER"
            - "Customer.${cust_id}.wallet_credit_cents == 1000"

      - name: appointment_noshow_strike_suspends_booking
        grounds:
          - state_machines.StylingAppointment.CONFIRMED_to_NO_SHOW
          - entities.Customer.fields.no_show_count
          - entities.Customer.fields.booking_status
        distinguishing_aspect: |
          Depth-2 chain from a NO_SHOW trigger (different trigger than box SETTLE): the
          third NO_SHOW sets customer.no_show_count = 3 (link1) -> reaching
          NO_SHOW_SUSPEND_THRESHOLD flips booking_status to SUSPENDED (link2).
        test_recipe:
          setup:
            - "A customer with two prior appointments already taken to NO_SHOW (no_show_count = 2); a third confirmed appointment whose start time has passed."
          setup_api_calls:
            - call: "POST /customers/register"
              payload: { email: "tc2@x.com", full_name: "TC Two", size_code: 22 }
              as: Anonymous
              captures: { cust_id: $.data.id }
            - call: "POST /specialists"
              payload: { full_name: "Stylist B", specialties: ["ADAPTIVE"] }
              as: StoreManager
              captures: { spec_id: $.data.id }
            - call: "POST /appointments"
              payload: { specialist_id: "${spec_id}", start_at: "2026-07-02T10:00:00Z", end_at: "2026-07-02T11:00:00Z" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { a1: $.data.id }
            - call: "POST /appointments/${a1}/transition"
              payload: { action: "CONFIRM" }
              as: StoreManager
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-02T11:00:00Z" }
              as: StoreManager
            - call: "POST /appointments/${a1}/transition"
              payload: { action: "NO_SHOW" }
              as: StoreManager
            - call: "POST /appointments"
              payload: { specialist_id: "${spec_id}", start_at: "2026-07-03T10:00:00Z", end_at: "2026-07-03T11:00:00Z" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { a2: $.data.id }
            - call: "POST /appointments/${a2}/transition"
              payload: { action: "CONFIRM" }
              as: StoreManager
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-03T11:00:00Z" }
              as: StoreManager
            - call: "POST /appointments/${a2}/transition"
              payload: { action: "NO_SHOW" }
              as: StoreManager
            - call: "POST /appointments"
              payload: { specialist_id: "${spec_id}", start_at: "2026-07-04T10:00:00Z", end_at: "2026-07-04T11:00:00Z" }
              as: Customer
              as_user_id: "${cust_id}"
