          rationale: "That §1.8 instance already contrasts the accepted half-open adjacency against the rejected one-second overlap, which is the only interesting way to reach this id."

      - name: freeze_window_conflict_error_corner
        claim_type: Error Triggerability
        grounds:
          - errors.ERR_FREEZE_WINDOW_CONFLICT
        distinguishing_aspect: "The 409 raised when a scheduled change's freeze window sits closer than the 72-hour separation buffer to another scheduled window."
        excluded_because:
          difficulty_instance: freeze_window_separation_exactly_72_hours_accepted
          rationale: "That §1.8 instance drives both the accepted exactly-72-hour arm and the rejected 71-hour arm, so the error is already reached at its only boundary."

      - name: change_calendar_capacity_error_corner
        claim_type: Error Triggerability
        grounds:
          - errors.ERR_CHANGE_CALENDAR_CAPACITY
        distinguishing_aspect: "The 409 raised when a third structural change is scheduled inside a rolling 30-day window."
        excluded_because:
          difficulty_instance: structural_change_calendar_capacity_third_within_thirty_days
          rationale: "That §1.8 instance schedules the two permitted structural changes and then the refused third, and also shows a non-structural change escaping the cap."

      - name: cross_domain_merge_and_match_floor_error_corner
        claim_type: Error Triggerability
        grounds:
          - errors.ERR_CROSS_DOMAIN_MERGE
          - errors.ERR_MATCH_SCORE_BELOW_FLOOR
        distinguishing_aspect: "Two 422s on the same POST /mdm/merge-proposals call whose relative order is the interesting part."
        excluded_because:
          difficulty_instance: cross_domain_merge_precedes_match_score_floor
          rationale: "That §1.8 instance triggers both ids from one payload to prove the priority-9 domain check runs before the match-score floor, which subsumes any single-id repeat here."

      - name: domain_posture_blocked_error_corner
        claim_type: Error Triggerability
        grounds:
          - errors.ERR_DOMAIN_POSTURE_BLOCKED
        distinguishing_aspect: "The 409 raised when a FROZEN posture blocks publication, merge decisions and change scheduling."
        excluded_because:
          difficulty_instance: publish_blocked_until_domain_posture_returns_to_open
          rationale: "That §1.8 instance blocks a publish under FROZEN posture and then lets the same call through after the finding set is cleared, covering both sides of the gate."

      - name: change_request_apply_gate_errors
        claim_type: Error Triggerability
        grounds:
          - errors.ERR_CHANGE_REQUEST_NOT_SCHEDULED
          - errors.ERR_LINEAGE_INCOMPLETE
          - errors.ERR_LEAD_TIME_NOT_SATISFIED
          - errors.ERR_APPLY_WINDOW_NOT_REACHED
          - errors.ERR_TIER1_ACK_MISSING
        distinguishing_aspect: "Five distinct gates guard one structural change on its way from DRAFT to APPLIED, and they must be reported separately as the request advances: not-yet-scheduled, undocumented TIER1 lineage at approval, a schedule earlier than the notification lead time, an apply before the scheduled instant, and an apply while a TIER1 consumer has not acknowledged."
        test_recipe:
          setup:
            - "Clock at 2026-08-05T00:00:00Z. Domain CUSTOMER ACTIVE with posture OPEN (Olivia DATA_OWNER, Sam DATA_STEWARD, ERP CERTIFIED + AUTHORITATIVE, rule QR1, notification_lead_days_floor 5, classification INTERNAL). One TIER1 subscription BI_A (required_lead_days 5, clearance INTERNAL, reporting asset RPT_A) with UNDOCUMENTED lineage. Sam raises one HIERARCHY_RESTRUCTURE request CR1 that is still DRAFT."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: GovernanceAdmin
            - call: "POST /mdm/domains"
              payload: { code: "CUSTOMER", name: "Customer Master", classification_level: "INTERNAL", notification_lead_days_floor: 5, expected_attribute_count: 5 }
              as: GovernanceAdmin
              captures: { dom_id: $.data.id, dom_v1: $.data.version }
            - call: "POST /mdm/stewards"
              payload: { full_name: "Olivia Owner", email: "olivia@mdm.test", certification_level: "PRINCIPAL" }
              as: GovernanceAdmin
              captures: { own_id: $.data.id }
            - call: "POST /mdm/stewards"
              payload: { full_name: "Sam Steward", email: "sam@mdm.test", certification_level: "SENIOR" }
              as: GovernanceAdmin
              captures: { std_id: $.data.id }
            - call: "POST /mdm/steward-assignments"
              payload: { domain_id: "${dom_id}", steward_id: "${own_id}", steward_role: "DATA_OWNER", effective_from: "2026-08-01T00:00:00Z", expected_domain_version: "${dom_v1}" }
              as: GovernanceAdmin
            - call: "GET /mdm/domains/${dom_id}"
              as: GovernanceAdmin
              captures: { dom_v2: $.data.version }
            - call: "POST /mdm/steward-assignments"
              payload: { domain_id: "${dom_id}", steward_id: "${std_id}", steward_role: "DATA_STEWARD", effective_from: "2026-08-01T00:00:00Z", expected_domain_version: "${dom_v2}" }
              as: GovernanceAdmin
            - call: "POST /mdm/source-systems"
              payload: { code: "ERP", name: "ERP Core", trust_tier: 4 }
              as: GovernanceAdmin
              captures: { erp_id: $.data.id }
            - call: "POST /mdm/source-systems/${erp_id}/certify"
              payload: {}
              as: GovernanceAdmin
            - call: "GET /mdm/domains/${dom_id}"
              as: GovernanceAdmin
              captures: { dom_v3: $.data.version }
            - call: "POST /mdm/source-registrations"
              payload: { domain_id: "${dom_id}", source_system_id: "${erp_id}", role: "AUTHORITATIVE", trust_rank: 1, effective_from: "2026-08-01T00:00:00Z", expected_domain_version: "${dom_v3}" }
              as: GovernanceAdmin
            - call: "POST /mdm/quality-rules"
              payload: { domain_id: "${dom_id}", owner_steward_id: "${std_id}", rule_code: "QR1", dimension: "COMPLETENESS", weight_points: 40, threshold_pct: 90.00, severity: "HIGH" }
              as: DataSteward
              as_user_id: "${std_id}"
            - call: "POST /mdm/domains/${dom_id}/activate"
              as: GovernanceAdmin
              captures: { dom_status: $.data.status, dom_revision: $.data.reference_data_revision }
            - call: "POST /mdm/consumer-subscriptions"
              payload: { domain_id: "${dom_id}", consumer_code: "BI_A", reporting_asset_key: "RPT_A", clearance_level: "INTERNAL", criticality: "TIER1", required_lead_days: 5 }
              as: GovernanceAdmin
              captures: { sub_id: $.data.id, sub_lineage: $.data.lineage_status }
            - call: "POST /mdm/change-requests"
              payload: { domain_id: "${dom_id}", change_type: "HIERARCHY_RESTRUCTURE", title: "Move EMEA_SALES under GLOBAL", proposed_values: { parent_node_key: "GLOBAL", child_node_key: "EMEA_SALES" } }
              as: DataSteward
              as_user_id: "${std_id}"
              captures: { cr_id: $.data.id, cr_structural: $.data.structural }
          trigger:
            - call: "POST /mdm/change-requests/${cr_id}/apply"
              payload: {}
              as: GovernanceAdmin
              captures: { e_not_scheduled: $.data.error_id }
            - call: "POST /mdm/change-requests/${cr_id}/submit"
              payload: {}
              as: DataSteward
              as_user_id: "${std_id}"
              captures: { s_count: $.data.impact_consumer_count, s_lead: $.data.required_lead_days, s_earliest: $.data.earliest_apply_at }
            - call: "POST /mdm/change-requests/${cr_id}/review"
              payload: {}
              as: DataOwner
              as_user_id: "${own_id}"
            - call: "POST /mdm/change-requests/${cr_id}/decide"
              payload: { decision: "APPROVE", review_note: "Hierarchy move agreed" }
              as: DataOwner
              as_user_id: "${own_id}"
              captures: { e_lineage: $.data.error_id }
            - call: "PATCH /mdm/consumer-subscriptions/${sub_id}/lineage"
              payload: { lineage_path: ["ERP", "STG_CUSTOMER", "RPT_A"] }
              as: DataSteward
              as_user_id: "${std_id}"
              captures: { l_status: $.data.lineage_status, l_revision: $.data.lineage_revision }
            - call: "POST /mdm/change-requests/${cr_id}/decide"
              payload: { decision: "APPROVE", review_note: "Hierarchy move agreed" }
              as: DataOwner
              as_user_id: "${own_id}"
              captures: { d_status: $.data.status }
            - call: "POST /mdm/change-requests/${cr_id}/schedule"
              payload: { scheduled_apply_at: "2026-08-09T00:00:00Z" }
              as: DataOwner
              as_user_id: "${own_id}"
              captures: { e_lead: $.data.error_id }
            - call: "POST /mdm/change-requests/${cr_id}/schedule"
              payload: { scheduled_apply_at: "2026-08-12T00:00:00Z" }
              as: DataOwner
              as_user_id: "${own_id}"
              captures: { sch_status: $.data.status, sch_start: $.data.freeze_window_start, sch_end: $.data.freeze_window_end }
            - call: "GET /mdm/consumer-subscriptions/${sub_id}"
              as: Auditor
              captures: { n_pending: $.data.pending_change_request_id, n_notified: $.data.notified_at, n_ack: $.data.acknowledged_at }
            - call: "POST /mdm/change-requests/${cr_id}/apply"
              payload: {}
              as: GovernanceAdmin
              captures: { e_window: $.data.error_id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-12T00:00:00Z" }
              as: GovernanceAdmin
            - call: "POST /mdm/change-requests/${cr_id}/apply"
              payload: {}
              as: GovernanceAdmin
              captures: { e_ack: $.data.error_id }
            - call: "POST /mdm/consumer-subscriptions/${sub_id}/acknowledge"
              payload: {}
              as: ConsumerRep
              as_user_id: "${sub_id}"
              captures: { a_ack: $.data.acknowledged_at, a_rev: $.data.acknowledged_revision }
            - call: "POST /mdm/change-requests/${cr_id}/apply"
              payload: {}
              as: GovernanceAdmin
              captures: { ap_status: $.data.status, ap_at: $.data.applied_at, ap_start: $.data.freeze_window_start }
            - call: "GET /mdm/domains/${dom_id}"
              as: Auditor
              captures: { dom_rev_after: $.data.reference_data_revision, dom_sched_after: $.data.scheduled_change_count }
            - call: "GET /mdm/consumer-subscriptions/${sub_id}"
              as: Auditor
              captures: { sub_lineage_after: $.data.lineage_status, sub_pending_after: $.data.pending_change_request_id }
            - call: "GET /mdm/consumer-subscriptions?domain_id=${dom_id}&status=ACTIVE"
              as: Auditor
          assert:
            - "setup: ${dom_status} == ACTIVE, ${dom_revision} == 0, ${sub_lineage} == UNDOCUMENTED and ${cr_structural} == true"
            - "${e_not_scheduled} == ERR_CHANGE_REQUEST_NOT_SCHEDULED (409) - apply is refused while the request is still DRAFT"
            - "submit -> ${s_count} == 1, ${s_lead} == 5 (max(consumer 5, floor 5) with no breadth and no classification surcharge) and ${s_earliest} == 2026-08-10T00:00:00Z"
            - "${e_lineage} == ERR_LINEAGE_INCOMPLETE (409) - a structural change cannot be approved while an ACTIVE TIER1 consumer has UNDOCUMENTED lineage"
            - "${l_status} == DOCUMENTED with ${l_revision} == 0, after which ${d_status} == APPROVED"
            - "${e_lead} == ERR_LEAD_TIME_NOT_SATISFIED (409) - 2026-08-09T00:00:00Z is earlier than earliest_apply_at"
            - "${sch_status} == SCHEDULED with ${sch_start} == 2026-08-11T00:00:00Z and ${sch_end} == 2026-08-14T00:00:00Z (structural window of -24h / +48h)"
            - "${n_pending} == ${cr_id}, ${n_notified} == 2026-08-05T00:00:00Z and ${n_ack} == null - the schedule fanned the notification out"
            - "${e_window} == ERR_APPLY_WINDOW_NOT_REACHED (409) at clock 2026-08-05T00:00:00Z"
            - "${e_ack} == ERR_TIER1_ACK_MISSING (409) once the clock reaches the scheduled instant but the TIER1 consumer has not acknowledged"
            - "${a_ack} == 2026-08-12T00:00:00Z and ${a_rev} == 0 - the acknowledgement is stamped against the pre-change revision"
            - "apply -> ${ap_status} == APPLIED, ${ap_at} == 2026-08-12T00:00:00Z and ${ap_start} == null (the freeze window is released)"
            - "${dom_rev_after} == 1 and ${dom_sched_after} == 0"
            - "${sub_lineage_after} == STALE (documented at revision 0, now behind revision 1) and ${sub_pending_after} == null"
            - "the filtered subscription list returns total_count == 1 - a HIERARCHY_RESTRUCTURE never suspends a consumer, unlike a classification uplift"

  - section: RBAC
    instances:
      - name: auditor_cannot_mutate_anything
        claim_type: Cannot perform other roles' exclusive_operations
        grounds:
          - roles.Auditor
          - validations.priority_2_ERR_UNAUTHORIZED
        distinguishing_aspect: "Auditor holds every GET but no write at all, so its denial must be uniform across registry writes, steward writes and action endpoints - not merely on the GovernanceAdmin registry."
        test_recipe:
          setup:
            - "DRAFT-STEWARDED domain CUSTOMER with a DATA_STEWARD assignment for Sam; logical clock at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: GovernanceAdmin
            - call: "POST /mdm/domains"
              payload: { code: "CUSTOMER", name: "Customer Master", classification_level: "INTERNAL", notification_lead_days_floor: 5, expected_attribute_count: 5 }
              as: GovernanceAdmin
              captures: { dom_id: $.data.id, dom_v1: $.data.version }
            - call: "POST /mdm/stewards"
              payload: { full_name: "Sam Steward", email: "sam@mdm.test", certification_level: "SENIOR" }
              as: GovernanceAdmin
              captures: { std_id: $.data.id }
            - call: "POST /mdm/steward-assignments"
              payload: { domain_id: "${dom_id}", steward_id: "${std_id}", steward_role: "DATA_STEWARD", effective_from: "2026-08-01T00:00:00Z", expected_domain_version: "${dom_v1}" }
              as: GovernanceAdmin
          trigger:
            - call: "POST /mdm/domains"
              payload: { code: "PRODUCT", name: "Product Master", classification_level: "INTERNAL", notification_lead_days_floor: 5, expected_attribute_count: 4 }
              as: Auditor
              captures: { e_dom: $.data.error_id }
            - call: "POST /mdm/quality-rules"
              payload: { domain_id: "${dom_id}", owner_steward_id: "${std_id}", rule_code: "QR1", dimension: "COMPLETENESS", weight_points: 40, threshold_pct: 90.00, severity: "HIGH" }
              as: Auditor
              captures: { e_rule: $.data.error_id }
            - call: "POST /mdm/domains/${dom_id}/scorecard-runs"
              payload: { basis: "PROVISIONAL", measurements: [] }
              as: Auditor
              captures: { e_run: $.data.error_id }
            - call: "POST /mdm/domains/${dom_id}/activate"
              as: Auditor
              captures: { e_activate: $.data.error_id }
            - call: "GET /mdm/domains/${dom_id}"
              as: Auditor
              captures: { r_status: $.data.status, r_version: $.data.version }
          assert:
            - "each of the first four triggers returns HTTP 403 with ERR_UNAUTHORIZED: ${e_dom}, ${e_rule}, ${e_run} and ${e_activate} are all ERR_UNAUTHORIZED"
            - "${r_status} == DRAFT and ${r_version} == 2 - the read still works and no refused write left a trace"

      - name: data_steward_holds_no_data_owner_exclusive
        claim_type: Cannot perform other roles' exclusive_operations
        grounds:
          - roles.DataOwner.exclusive_operations
          - roles.DataSteward.exclusive_operations
          - validations.priority_2_ERR_UNAUTHORIZED
        distinguishing_aspect: "DataSteward's exclusive_operations list is empty, so all five DataOwner decision endpoints must reject it - and because the role check sits at priority 2, the rejection arrives even for an all-zero resource id, which proves the denial is not resource-derived."
        test_recipe:
          setup:
            - "One Steward row for Sam exists (X-User-ID target); no findings, proposals or change requests are needed because the priority-2 role check precedes path existence."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: GovernanceAdmin
            - call: "POST /mdm/stewards"
              payload: { full_name: "Sam Steward", email: "sam@mdm.test", certification_level: "SENIOR" }
              as: GovernanceAdmin
              captures: { std_id: $.data.id }
          trigger:
            - call: "POST /mdm/quality-findings/00000000-0000-0000-0000-000000000000/waive"
              payload: { waiver_justification: "Accepted risk for this reporting period only" }
              as: DataSteward
              as_user_id: "${std_id}"
              captures: { e_waive: $.data.error_id }
            - call: "POST /mdm/merge-proposals/00000000-0000-0000-0000-000000000000/decide"
              payload: { decision: "REJECT" }
              as: DataSteward
              as_user_id: "${std_id}"
              captures: { e_decide: $.data.error_id }
            - call: "POST /mdm/change-requests/00000000-0000-0000-0000-000000000000/review"
              payload: {}
              as: DataSteward
              as_user_id: "${std_id}"
              captures: { e_review: $.data.error_id }
            - call: "POST /mdm/change-requests/00000000-0000-0000-0000-000000000000/decide"
              payload: { decision: "APPROVE" }
              as: DataSteward
              as_user_id: "${std_id}"
              captures: { e_cr_decide: $.data.error_id }
            - call: "POST /mdm/change-requests/00000000-0000-0000-0000-000000000000/schedule"
              payload: { scheduled_apply_at: "2026-09-01T00:00:00Z" }
              as: DataSteward
              as_user_id: "${std_id}"
              captures: { e_schedule: $.data.error_id }
          assert:
            - "all five triggers return HTTP 403 with ERR_UNAUTHORIZED: ${e_waive}, ${e_decide}, ${e_review}, ${e_cr_decide}, ${e_schedule}"
            - "none returns 404 even though the resource ids do not exist - priority 2 outranks priority 3"

      - name: stewards_hold_no_governance_admin_exclusive
        claim_type: Cannot perform other roles' exclusive_operations
        grounds:
          - roles.GovernanceAdmin.exclusive_operations
          - validations.priority_2_ERR_UNAUTHORIZED
        distinguishing_aspect: "peer separation runs the other way too: the accountable DataOwner cannot create registry rows, certify a source, apply an approved change or move the logical clock, so governance operations are not merely 'more privileged' - they are a disjoint set."
        test_recipe:
          setup:
            - "Domain CUSTOMER (DRAFT, version 1) and one Steward row for Olivia exist; the clock is at 2026-08-01T00:00:00Z. Olivia deliberately holds NO assignment, but the priority-2 role check fires before any entitlement or resource lookup."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: GovernanceAdmin
            - call: "POST /mdm/domains"
              payload: { code: "CUSTOMER", name: "Customer Master", classification_level: "INTERNAL", notification_lead_days_floor: 5, expected_attribute_count: 5 }
              as: GovernanceAdmin
              captures: { dom_id: $.data.id, dom_v1: $.data.version }
            - call: "POST /mdm/stewards"
              payload: { full_name: "Olivia Owner", email: "olivia@mdm.test", certification_level: "PRINCIPAL" }
              as: GovernanceAdmin
              captures: { own_id: $.data.id }
          trigger:
            - call: "POST /mdm/domains"
              payload: { code: "VENDOR", name: "Vendor Master", classification_level: "INTERNAL", notification_lead_days_floor: 5, expected_attribute_count: 4 }
              as: DataOwner
              as_user_id: "${own_id}"
              captures: { e_dom: $.data.error_id }
            - call: "POST /mdm/source-systems/00000000-0000-0000-0000-000000000000/certify"
              payload: {}
              as: DataOwner
              as_user_id: "${own_id}"
              captures: { e_certify: $.data.error_id }
            - call: "POST /mdm/steward-assignments"
              payload: { domain_id: "${dom_id}", steward_id: "${own_id}", steward_role: "DATA_OWNER", effective_from: "2026-08-01T00:00:00Z", expected_domain_version: "${dom_v1}" }
              as: DataOwner
              as_user_id: "${own_id}"
              captures: { e_assign: $.data.error_id }
            - call: "POST /mdm/change-requests/00000000-0000-0000-0000-000000000000/apply"
              payload: {}
              as: DataOwner
              as_user_id: "${own_id}"
              captures: { e_apply: $.data.error_id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: DataOwner
              as_user_id: "${own_id}"
              captures: { e_clock: $.data.error_id }
          assert:
            - "all five triggers return HTTP 403 with ERR_UNAUTHORIZED: ${e_dom}, ${e_certify}, ${e_assign}, ${e_apply}, ${e_clock}"
            - "GET /mdm/domains returns total_count == 1 (only the seeded CUSTOMER domain, still at version ${dom_v1}) and the clock is still 2026-08-01T00:00:00Z"

      - name: entitlement_requires_an_assignment_on_the_target_domain
        claim_type: Peer roles - Role A cannot touch role B's resources
        grounds:
          - validations.priority_6_ERR_NOT_DOMAIN_STEWARD
          - errors.ERR_NOT_DOMAIN_OWNER
        distinguishing_aspect: "Holding the DataOwner or DataSteward role is not enough: entitlement is per domain, so a steward with no assignment on THIS domain is refused at priority 6 with a role-specific id even though the priority-2 role check passed."
        test_recipe:
          setup:
            - "Domain CUSTOMER (DRAFT) with Olivia as DATA_OWNER and Sam as DATA_STEWARD; Nina holds no assignment anywhere. One DRAFT change request raised by Sam."
          setup_api_calls:
