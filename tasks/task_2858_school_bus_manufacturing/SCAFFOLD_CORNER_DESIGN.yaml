      - name: slot_window_must_be_non_empty_and_finish_before_the_promise_lead_time
        claim_type: temporal_validation
        grounds:
          - validations[priority=46]
          - validations[priority=49]
          - errors[ERR_INVALID_SLOT_WINDOW]
          - errors[ERR_SLOT_MISSES_DEADLINE]
          - calculations.delivery_posture.constants.FINISH_LEAD_DAYS
        distinguishing_aspect: |
          Slot windows are half-open, so end_date must be strictly after start_date (an empty same-day
          window is refused before any capacity or deadline arithmetic runs), and the finish-lead rule is
          `end_date + 21 <= promised_delivery_date`, which a window ending 2026-09-15 misses by exactly one
          day while a window ending 2026-09-14 satisfies at equality. Neither refusal touches the line, so
          all three requests are authored against ProductionLine.version 1.
