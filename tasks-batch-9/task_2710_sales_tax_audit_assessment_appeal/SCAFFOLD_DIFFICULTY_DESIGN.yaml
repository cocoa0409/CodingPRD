  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: sample_unit_requires_an_agreed_methodology
        grounds:
          - validations.priority_10
          - errors.ERR_AGREEMENT_NOT_AGREED
          - state_machines.SamplingAgreement
          - endpoints.POST /sample-units
        distinguishing_aspect: |
          Whether a SampleUnit may be created depends on a DIFFERENT entity's state:
          the SamplingAgreement must be AGREED (and therefore the Audit in FIELDWORK).
          The identical request is refused with ERR_AGREEMENT_NOT_AGREED (409) while the
          agreement is PROPOSED and accepted the moment the taxpayer agrees, with no
          change to the request body.
        test_recipe:
          setup:
            - "Ridgeline Tools scoped 2026-01-01..2026-06-30 with one PROPOSED single-stratum agreement; the Audit is still SCOPED and the clock is left at its 2026-08-01 default."
          setup_api_calls:
            - call: "POST /taxpayers"
              payload: { legal_name: "Ridgeline Tools Inc", permit_number: "P-2710-X1", industry_naics_code: "444140", filing_frequency: "QUARTERLY", gross_receipts_annual_cents: 100000000, delinquent_period_count: 0 }
              as: SelectionAnalyst
