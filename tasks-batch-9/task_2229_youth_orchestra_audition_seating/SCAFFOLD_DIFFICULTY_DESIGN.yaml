            - "Trigger call 2 (17:40-17:55 in R1: inside the window, still inside S1's buffer) fails with 409 and error_id == ERR_ROOM_DOUBLE_BOOKED"
            - "Trigger call 3 (17:40-18:10 in empty room R9: past the window only) fails with 422 and error_id == ERR_SLOT_OUTSIDE_AUDITION_WINDOW"
            - "Trigger call 4 (17:45-17:55 in R1: gap from S1 is exactly 15 minutes and end_at is inside the window) succeeds with 201 and status == OPEN"
            - "GET /audition-slots?season_id=${season_id}&room_code=R1 returns total_count == 2 (S1 plus the slot from trigger call 4)"

