              as_user_id: "${donor_b}"
              captures:
                err: "$.data.error_id"
          assert:
            - "err == ERR_INVALID_STATE (family no longer VERIFIED at confirm time)"
            - "Adoption.${ad_b}.status remains PLEDGED"
            - "Family.${fam_id}.status == MATCHED (set by donor A's confirm)"

      - name: slot_booking_gated_by_event_state_and_campaign_state
        grounds:
          - state_machines.DistributionEvent
          - state_machines.Campaign
          - entities.DistributionSlot.fields.event_id
        distinguishing_aspect: |
          Entity pair = DistributionSlot -> DistributionEvent (and transitively
          Campaign). Slot creation is rejected when the parent event is not in
          OPEN_FOR_SLOTS / SORTING, AND event open-slots is itself rejected
          when the campaign is not in DISTRIBUTION_PREP. Two distinct
          cross-entity gates on the same chain.
        test_recipe:
          setup:
