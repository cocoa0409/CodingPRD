      - name: a_missing_or_unrecognised_role_header_is_401_before_anything_else
        claim_type: Exclusive operations
        grounds:
          - validations[priority=1]
          - errors.ERR_UNAUTHENTICATED
          - errors.ERR_ROLE_NOT_PERMITTED
          - errors.ERR_INVALID_REQUEST
          - roles
        distinguishing_aspect: |
          Convention for this recipe: the as: value __NO_ROLE_HEADER__ means the request carries no
          X-User-Role header, __NO_USER_ID_HEADER__ means it carries no X-User-ID header, and PayrollClerk is
          a syntactically valid but undeclared role string. All three are 401, which is the distinction that
          matters: an unknown role is not a forbidden role. Priority 1 also outranks the schema check, so an
          unauthenticated request with a body missing every required field still answers 401, and the very
          same body answers 422 once the headers are present.
        test_recipe:
          setup:
            - "petition 07-RC-340606 docketed and readable"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: {"current_utc": "2026-08-03T09:00:00Z"}
              as: LaborRelationsDirector
            - call: "POST /labor-relations/petitions"
              payload: {"case_number": "07-RC-340606", "petition_type": "RC", "union_name": "United Plant Workers Local 812", "filed_date": "2026-08-03", "proposed_unit_description": "All production and maintenance employees at Plant 1", "claimed_employee_count": 120, "payroll_period_end": "2026-08-14"}
              as: LaborRelationsDirector
              captures: {"pet_id": "$.data.id"}
            - call: "POST /labor-relations/petitions/${pet_id}/open-scope-analysis"
              payload: {}
              as: LaborRelationsDirector
          trigger:
            - call: "GET /labor-relations/petitions"
              payload: {}
              as: __NO_ROLE_HEADER__
              captures: {"err1": "$.data.error_id"}
            - call: "GET /labor-relations/petitions"
              payload: {}
              as: __NO_USER_ID_HEADER__
              captures: {"err2": "$.data.error_id"}
            - call: "GET /labor-relations/petitions"
              payload: {}
              as: PayrollClerk
              captures: {"err3": "$.data.error_id"}
            - call: "POST /labor-relations/petitions"
              payload: {"case_number": "07-RC-340607"}
              as: __NO_ROLE_HEADER__
              captures: {"err4": "$.data.error_id"}
            - call: "POST /labor-relations/petitions"
              payload: {"case_number": "07-RC-340607"}
              as: LaborRelationsDirector
              as_user_id: "user-director-1"
              captures: {"err5": "$.data.error_id"}
            - call: "GET /labor-relations/voter-lists"
              payload: {"petition_id": "${pet_id}"}
              as: SupervisorTrainer
              captures: {"err6": "$.data.error_id"}
            - call: "GET /labor-relations/petitions"
              payload: {}
              as: SupervisorTrainer
            - call: "GET /labor-relations/petitions"
              payload: {"limit": 0}
              as: LaborRelationsDirector
              captures: {"err7": "$.data.error_id"}
          assert:
            - "err1 == err2 == err3 == 'ERR_UNAUTHENTICATED' with HTTP 401"
            - "err4 == 'ERR_UNAUTHENTICATED' with HTTP 401, NOT 'ERR_INVALID_REQUEST' (priority 1 outranks priority 5)"
            - "err5 == 'ERR_INVALID_REQUEST' with HTTP 422 listing the missing required fields, and no Petition is created"
            - "err6 == 'ERR_ROLE_NOT_PERMITTED' with HTTP 403 - the trainer's reads do not extend to voter lists"
            - "call 7 returns HTTP 200 with total_count == 1 (the trainer's petition read is declared)"
            - "err7 == 'ERR_INVALID_REQUEST' with HTTP 422 for limit == 0 (the floor is 1)"
            - "GET /labor-relations/petitions with no pagination params returns limit == 10, offset == 0, has_more == false"


  # =========================================================================
  # SECTION - cross_cutting_complexity_layers
