          setup_api_calls: []
          trigger: []
          assert: []
        excluded_because:
          difficulty_instance: itc_rate_combinatorial_adders_mode_a
          rationale: "The mirror is asserted there (total_itc_credits_usd == 5000000.00 after the cascade); no additional claim."

  - section: endpoints
    instances:
      - name: distribution_response_is_entry_array
        claim_type: computed_read
        grounds: ["POST /api/tax-equity-partnerships/{partnership_id}/distributions", calculations.waterfall_distribution]
        distinguishing_aspect: "First run returns exactly 4 ledger entries in fixed order (2 cash + 2 credit); later runs return 2."
        excluded_because:
          difficulty_instance: waterfall_per_tier_rounding_mode_b
          rationale: "Entry counts and amounts asserted there."
      - name: milestone_certify_cod_cascade
        claim_type: action_endpoint
        grounds: ["POST /api/construction-milestones/{milestone_id}/certify", state_machines.Project.COMMISSIONING_to_COMMERCIAL_OPERATION]
        distinguishing_aspect: "Single action endpoint drives a 4-entity cascade (project, TCQ, debt, partnership)."
        excluded_because:
          difficulty_instance: itc_rate_combinatorial_adders_mode_a
          rationale: "Cascade outcomes asserted there."
      - name: ledger_reverse_reachability
        claim_type: fk_integrity
        grounds: ["GET /api/tax-equity-partnerships/{partnership_id}/ledger-entries"]
        distinguishing_aspect: "Every partnership's ledger is discoverable from the partnership id; entries filter by entry_type."
        excluded_because:
          difficulty_instance: credit_allocation_sum_invariant
          rationale: "Ledger enumeration asserted there."

  - section: errors
    instances:
      - name: draw_exceeds_commitment
        claim_type: violation_to_error
        grounds: ["errors[ERR_DRAW_EXCEEDS_COMMITMENT]"]
        distinguishing_aspect: "Draws accumulate: 6,000,000 then 5,000,000 against a 10,000,000 commitment — the second draw is refused without partial application."
        test_recipe:
          setup: ["Project P; debt facility commitment 10,000,000 with 6,000,000 drawn"]
          setup_api_calls:
            - call: "POST /api/projects"
              payload: { name: "Draw Farm", technology: "WIND", target_capacity_mw: 110, resource_class: "A" }
              as: DeveloperAdmin
              captures: { p: $.data.id }
            - call: "POST /api/projects/${p}/debt-facilities"
              payload: { commitment_usd: 10000000, interest_rate_pct: 5.0, projected_cfads_usd: 800000 }
              as: LenderAgent
              captures: { d: $.data.id }
            - call: "POST /api/debt-facilities/${d}/transitions"
              payload: { to: "CONSTRUCTION_DRAWING", draw_amount_usd: 6000000 }
              as: LenderAgent
          trigger:
            - call: "POST /api/debt-facilities/${d}/transitions"
              payload: { to: "CONSTRUCTION_DRAWING", draw_amount_usd: 5000000 }
              as: LenderAgent
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_DRAW_EXCEEDS_COMMITMENT and DebtFacility.${d}.drawn_usd remains 6000000.00"

      - name: availability_measurement_required
        claim_type: violation_to_error
        grounds: ["errors[ERR_AVAILABILITY_MEASUREMENT_REQUIRED]"]
        distinguishing_aspect: "The OPERATIONAL transition refuses to default the measurement — the handoff LD cannot be silently zeroed."
        test_recipe:
          setup: ["Project in COMMERCIAL_OPERATION (full COD chain)"]
          setup_api_calls: []
          trigger: []
          assert: []
        excluded_because:
          difficulty_instance: availability_exactly_at_guarantee_zero_ld
          rationale: "Same endpoint exercised there; the missing-field negative is a one-line variant the unit-test generator derives from the input schema."

      - name: operational_project_cannot_be_abandoned
        claim_type: violation_to_error
        grounds: [state_machines.Project.*_to_ABANDONED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "ABANDONED is reachable from every non-terminal state except OPERATIONAL — a handed-over project is locked."
        test_recipe:
          setup: ["Project in OPERATIONAL"]
          setup_api_calls: []
          trigger: []
          assert: []
        excluded_because:
          difficulty_instance: availability_exactly_at_guarantee_zero_ld
          rationale: "That instance's second trigger (transition from OPERATIONAL -> ERR_INVALID_STATE) already proves terminal lockdown from OPERATIONAL."

  - section: consistency_model
    instances:
