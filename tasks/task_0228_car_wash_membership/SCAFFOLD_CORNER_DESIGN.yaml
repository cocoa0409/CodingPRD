              payload: { license_plate: "SUS001", state_code: "CA" }
              as: AccountHolder
              as_user_id: "${acct}"
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP 409; error_id == ERR_ACCOUNT_NOT_ACTIVE"

      - name: membership_on_retired_plan_rejected
        claim_type: Conditional validation
        grounds: ["validations[priority=11]", "errors[ERR_RESOURCE_RETIRED]"]
        distinguishing_aspect: "Enrolling in a RETIRED plan -> ERR_RESOURCE_RETIRED (409); the same enrollment on an ACTIVE plan succeeds, so the rule is conditioned on Plan.status."
        test_recipe:
          setup: ["A RETIRED plan and an ACTIVE account+vehicle."]
          setup_api_calls:
            - call: "POST /plans"
              payload: { name: "URet", tier_type: "UNLIMITED", monthly_fee_cents: 3000, included_credits: 0, wash_cooldown_hours: 0, max_addons: 3 }
