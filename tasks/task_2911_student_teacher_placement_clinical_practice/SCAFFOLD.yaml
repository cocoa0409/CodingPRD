scenario: |
  2911. Student Teacher Placement & Clinical Practice (educator preparation program):
  candidate readiness gates including testing, background clearance and coursework
  prerequisites, district partnership agreements and placement request routing by
  subject and grade band, cooperating teacher qualification, training and stipend
  administration, university supervisor caseload and observation cycle scheduling,
  performance assessment submission windows and scoring, placement failure, removal
  and replacement procedures mid-semester, mileage and travel constraints in placement
  matching, completer licensure recommendation and state reporting.
domain_name: student-teacher-placement-clinical-practice
api_prefix: "/epp"

complexity_profile:
  difficulty_level: expert_plus
  primary_archetype: quota_allocation
  secondary_archetype: compliance_audit
  complexity_layers:
    - selector_policy
    - cascading_side_effects
    - dual_variant_calculation
    - optimistic_concurrency

  entity_topology: flat
  entity_topology_note: |
    Ten peer entities linked by foreign keys declared on the child; no entity is
    nested inside another entity's URL path. Every write posts to a top-level
    collection under /epp with the FK in the request body; every read is either
    /epp/<collection>/{id} or a filtered /epp/<collection> list. The only nested
    paths are action sub-paths on a single resource (e.g.
    POST /epp/placements/{placement_id}/confirm) and two computed reads.

  state_machine_shape: cyclic
  state_machine_shape_secondary: parallel
  state_machine_shape_note: |
    Four machines carry true cycles: PartnershipAgreement (ACTIVE -> SUSPENDED ->
    ACTIVE), CooperatingTeacher (QUALIFIED -> TRAINING_EXPIRED -> QUALIFIED),
    PlacementRequest (SUBMITTED -> ROUTED -> SUBMITTED), PerformanceAssessment
    (SUBMITTED -> RETURNED -> SUBMITTED), ObservationCycle (SCHEDULED -> MISSED ->
    SCHEDULED) and Placement (ACTIVE -> REMOVAL_PENDING -> ACTIVE). Two entities
    additionally carry independent parallel state dimensions on the same row:
    Placement (placement_status x stipend_status) and Candidate (readiness_status x
    licensure_status x report_status).

  relationship_patterns:
    - one_to_many
    - self_referential          # Placement.replaces_placement_id -> Placement.id
    - cross_aggregate           # Placement references PartnershipAgreement across the district aggregate
    - polymorphic               # ReadinessItem.item_type switches which fields are required and how it scores

  role_model: segregation_of_duties
  role_model_note: |
    The user id that files a removal request may never decide it, and the licensure
    officer who recorded a recommendation may never file that candidate's state
    report. Readiness evidence is created by the coordinator or the candidate but
    can only be verified by CredentialAnalyst.

  consistency_model: immediate

  target_counts:
    entities: 10
    endpoints: 52
    error_codes: 55
    state_machines: 8
    calculations: 10
    validation_rows: 48
    concurrency_rules: 1
    roles: 7

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["page", "page_size", "total_count", "has_more"]
  pagination_defaults: { page: 1, page_size: 10, page_size_min: 1, page_size_max: 100 }

# ---------------------------------------------------------------------------
# 1.1 Entity-Relationship Table
# ---------------------------------------------------------------------------
entities:
  - name: Candidate
    parent: null
    common_fields: true
    entity_kind: resource
    description: |
      A teacher candidate enrolled in the educator preparation program. Carries THREE
      independent state dimensions on the same row: readiness_status (evidence gate),
      licensure_status (completer recommendation) and report_status (state reporting).
    fields:
      - name: candidate_code
        type: string
        source: input
        description: Program-assigned candidate code, unique across all Candidate rows.
        constraints: "non-empty; 1..32 chars; unique (case-sensitive) across Candidate"
      - name: full_name
        type: string
        source: input
        description: Candidate legal name.
        constraints: "non-empty; 1..120 chars"
      - name: program_track
        type: enum
        source: input
        description: Preparation track the candidate is enrolled in.
        constraints: "one of {ELEMENTARY, SECONDARY, SPECIAL_ED}"
      - name: home_grid_x
        type: integer
        source: input
        description: Candidate residence X coordinate on the program's 1-mile service grid.
        constraints: "-500..500"
      - name: home_grid_y
        type: integer
        source: input
        description: Candidate residence Y coordinate on the program's 1-mile service grid.
        constraints: "-500..500"
      - name: readiness_score
        type: integer
        source: computed
        description: |
          Output of calculations.candidate_readiness_score for the most recent
          evaluation of this candidate (0..100).
        default: 0
        constraints: "0..100"
      - name: readiness_status
        type: enum
        source: computed
        description: |
          Evidence-gate dimension. Derived from readiness_score plus the hard clearance
          sub-gate by calculations.candidate_readiness_score.
        default: NOT_READY
        constraints: "one of {NOT_READY, READY, LAPSED}"
      - name: readiness_variant_used
        type: enum
        source: computed
        description: |
          Which variant of calculations.candidate_readiness_score produced the current
          readiness_score / readiness_status pair. null until the first evaluation.
        default: null
        constraints: "one of {STRICT, ROLLING} or null"
      - name: licensure_status
        type: enum
        source: system
        description: Completer recommendation dimension, moved only by POST /epp/candidates/{candidate_id}/licensure-recommendation.
        default: PENDING
        constraints: "one of {PENDING, RECOMMENDED, DENIED}"
      - name: report_status
        type: enum
        source: system
        description: State-reporting dimension, moved only by POST /epp/candidates/{candidate_id}/state-report.
        default: UNREPORTED
        constraints: "one of {UNREPORTED, REPORTED_ON_TIME, REPORTED_LATE}"
      - name: recommended_by_user_id
        type: string
        source: system
        description: X-User-ID of the ProgramAdmin that recorded the recommendation decision; null before any decision.
        default: null
      - name: recommended_at
        type: datetime
        source: system
        description: Logical-clock instant of the licensure decision (ISO 8601 UTC, three fractional digits); null before any decision.
        default: null
      - name: denial_reason
        type: string
        source: system
        description: Free-text reason captured when licensure_status becomes DENIED; null otherwise.
        default: null
      - name: reported_by_user_id
        type: string
        source: system
        description: X-User-ID of the ProgramAdmin that filed the state report; null before filing.
        default: null
      - name: reported_at
        type: datetime
        source: system
        description: Logical-clock instant at which the state report was filed; null before filing.
        default: null
      - name: reporting_cycle
        type: string
        source: system
        description: State reporting cycle label recorded at filing time; null before filing.
        default: null
      - name: state_report_deadline
        type: date
        source: computed
        description: |
          term_end_date of the PlacementRequest whose status is CLOSED for this candidate
          plus STATE_REPORT_GRACE_DAYS; see calculations.state_report_timeliness. null
          until a placement of this candidate reaches COMPLETED.
        default: null

  - name: ReadinessItem
    parent: null
    common_fields: true
    entity_kind: resource
    description: |
      One piece of readiness evidence. item_type switches which fields are required and
      how the item scores, which makes this the polymorphic child of Candidate.
    fields:
      - name: candidate_id
        type: string
        source: input
        description: FK -> Candidate.id; the candidate this evidence belongs to.
      - name: item_type
        type: enum
        source: input
        description: Evidence class; selects the required-field set and the scoring branch.
        constraints: "one of {CONTENT_EXAM, BACKGROUND_CLEARANCE, COURSEWORK_BLOCK}"
      - name: status
        type: enum
        source: system
        description: Verification lifecycle of this item.
        default: PENDING_VERIFICATION
        constraints: "one of {PENDING_VERIFICATION, VERIFIED, REJECTED, EXPIRED}"
      - name: exam_score
        type: integer
        source: input
        description: Raw content-exam score. REQUIRED when item_type == CONTENT_EXAM, MUST be omitted otherwise.
        default: null
        constraints: "0..300 when present"
      - name: credits
        type: number
        source: input
        description: Coursework credits in this block. REQUIRED when item_type == COURSEWORK_BLOCK, MUST be omitted otherwise.
        default: null
        constraints: "0..60 in 0.5 steps when present"
      - name: clearance_scope
        type: enum
        source: input
        description: |
          Breadth of the background clearance. REQUIRED when item_type ==
          BACKGROUND_CLEARANCE, MUST be omitted otherwise.
        default: null
        constraints: "one of {STATE_ONLY, DISTRICT_FINGERPRINT} when present"
      - name: issued_on
        type: date
        source: input
        description: Date the issuing authority produced this evidence.
      - name: expires_on
        type: date
        source: input
        description: |
          Expiry date of the evidence. REQUIRED when item_type == BACKGROUND_CLEARANCE,
          MUST be omitted otherwise (exam scores and coursework never expire here).
        default: null
        constraints: "when present, expires_on > issued_on"
      - name: verified_by_user_id
        type: string
        source: system
        description: X-User-ID of the CredentialAnalyst that decided this item; null while PENDING_VERIFICATION.
        default: null
      - name: verified_at
        type: datetime
        source: system
        description: Logical-clock instant of the verification decision; null while PENDING_VERIFICATION.
        default: null
      - name: rejection_note
        type: string
        source: system
        description: Note captured when status becomes REJECTED; null otherwise.
        default: null

  - name: District
    parent: null
    common_fields: true
    entity_kind: configuration
    description: Partner school district. Carries two behaviour flags that change placement rules.
    fields:
      - name: name
        type: string
        source: input
        description: District display name.
        constraints: "non-empty; 1..120 chars"
      - name: district_code
        type: string
        source: input
        description: District code, unique across all District rows.
        constraints: "non-empty; 1..32 chars; unique across District"
      - name: state_code
        type: string
        source: input
        description: Two-letter state code the district reports under.
        constraints: "exactly 2 uppercase letters"
      - name: requires_district_fingerprint
        type: boolean
        source: input
        description: |
          When true, every Placement into this district additionally requires the
          candidate to hold a VERIFIED, unexpired BACKGROUND_CLEARANCE ReadinessItem
          whose clearance_scope == DISTRICT_FINGERPRINT.
        default: false
      - name: travel_reimbursement_enabled
        type: boolean
        source: input
        description: |
          When false, calculations.travel_reimbursement_cents yields 0 for every
          Placement in this district regardless of mileage.
        default: true

  - name: PartnershipAgreement
    parent: null
    common_fields: true
    entity_kind: resource
    description: |
      A term-scoped agreement with one district. Owns the placement seat quota that
      PlacementRequests compete for, the stipend rate cooperating teachers are paid
      from, and the subject / grade-band envelope a placement must fall inside.
      This is the OCC parent for nothing, but it IS the seat and money ledger:
      seats_reserved / seats_committed / stipend_committed_cents are conserved
      quantities (see calculations.agreement_ledger).
    fields:
      - name: district_id
        type: string
        source: input
        description: FK -> District.id; the district this agreement binds.
      - name: term
        type: enum
        source: input
        description: Academic term the agreement covers.
        constraints: "one of {FALL_2026, SPRING_2027}"
      - name: window_start
        type: date
        source: input
        description: First date on which the agreement may back a placement (inclusive).
      - name: window_end
        type: date
        source: input
        description: Last date on which the agreement may back a placement (inclusive). Past this date the agreement auto-expires on next reference.
        constraints: "window_end > window_start"
      - name: status
        type: enum
        source: system
        description: Agreement lifecycle.
        default: DRAFT
        constraints: "one of {DRAFT, ACTIVE, SUSPENDED, TERMINATED, EXPIRED}"
      - name: placement_cap
        type: integer
        source: input
        description: Hard ceiling on seats_committed. Routing may over-subscribe against it; confirmation may not.
        constraints: "1..50"
      - name: stipend_rate_cents_per_week
        type: integer
        source: input
        description: Base cooperating-teacher stipend rate in cents per scheduled week, before the longevity bonus.
        constraints: "1..100000"
      - name: allowed_subjects
        type: array
        source: input
        description: Subject endorsements this agreement will host.
        constraints: "1..6 distinct members of {MATH, ELA, SCIENCE, SOCIAL_STUDIES, GENERALIST, SPED}"
      - name: allowed_grade_bands
        type: array
        source: input
        description: Grade bands this agreement will host.
        constraints: "1..4 distinct members of {PK_3, K_6, MG_5_9, HS_9_12}"
      - name: seats_reserved
        type: integer
        source: computed
        description: |
          count(Placement WHERE agreement_id == this.id AND placement_status == PROPOSED).
          Maintained by calculations.agreement_ledger.
        default: 0
      - name: seats_committed
        type: integer
        source: computed
        description: |
          count(Placement WHERE agreement_id == this.id AND placement_status IN
          {ACTIVE, REMOVAL_PENDING, COMPLETED}). Maintained by calculations.agreement_ledger.
        default: 0
      - name: capacity_posture
        type: enum
        source: computed
        description: CAP_REACHED when seats_committed >= placement_cap, else OPEN. Recomputed whenever seats_committed changes.
        default: OPEN
        constraints: "one of {OPEN, CAP_REACHED}"
      - name: stipend_committed_cents
        type: integer
        source: computed
        description: |
          sum(Placement.stipend_gross_cents WHERE agreement_id == this.id AND
          stipend_status IN {ACCRUED, APPROVED, PAID}). Maintained by
          calculations.agreement_ledger; the conserved money quantity.
        default: 0
      - name: suspension_reason
        type: string
        source: system
        description: Reason recorded on the most recent transition into SUSPENDED or TERMINATED; null otherwise.
        default: null

  - name: CooperatingTeacher
    parent: null
    common_fields: true
    entity_kind: resource
    description: |
      A district-employed mentor teacher who hosts candidates. Qualification is
      training-driven and expires; the teacher is also the resource whose service
      calendar is protected by a turnaround buffer.
    fields:
      - name: district_id
        type: string
        source: input
        description: FK -> District.id; employing district.
      - name: full_name
        type: string
        source: input
        description: Teacher legal name.
        constraints: "non-empty; 1..120 chars"
      - name: site_name
        type: string
        source: input
        description: Campus / school site label where the teacher works.
        constraints: "non-empty; 1..120 chars"
      - name: site_grid_x
        type: integer
        source: input
        description: Site X coordinate on the program's 1-mile service grid.
        constraints: "-500..500"
      - name: site_grid_y
        type: integer
        source: input
        description: Site Y coordinate on the program's 1-mile service grid.
        constraints: "-500..500"
      - name: subject_endorsement
        type: enum
        source: input
        description: The single subject this teacher is endorsed to mentor.
        constraints: "one of {MATH, ELA, SCIENCE, SOCIAL_STUDIES, GENERALIST, SPED}"
      - name: grade_band
        type: enum
        source: input
        description: The single grade band this teacher's assignment covers.
        constraints: "one of {PK_3, K_6, MG_5_9, HS_9_12}"
      - name: years_experience
        type: integer
        source: input
        description: Completed years of classroom experience; a ranking input in the match selector.
        constraints: "0..50"
      - name: consecutive_terms_hosted
        type: integer
        source: input
        description: Consecutive prior terms this teacher has hosted a candidate; drives the stipend longevity bonus and is a ranking input.
        default: 0
        constraints: "0..20"
      - name: max_concurrent_candidates
        type: integer
        source: input
        description: How many non-terminal placements this teacher may hold at once.
        default: 1
        constraints: "1..3"
      - name: qualification_status
        type: enum
        source: system
        description: Mentor qualification lifecycle; only QUALIFIED teachers are selectable.
        default: PENDING_TRAINING
        constraints: "one of {PENDING_TRAINING, QUALIFIED, TRAINING_EXPIRED, DISQUALIFIED}"
      - name: training_completed_on
        type: date
        source: system
        description: Date of the most recent recorded mentor-training completion; null before any training.
        default: null
      - name: training_expires_on
        type: date
        source: computed
        description: training_completed_on + TRAINING_VALID_DAYS (730); null before any training.
        default: null
      - name: active_placement_count
        type: integer
        source: computed
        description: |
          count(Placement WHERE cooperating_teacher_id == this.id AND placement_status IN
          {PROPOSED, ACTIVE, REMOVAL_PENDING}). Maintained by calculations.agreement_ledger.
        default: 0
      - name: disqualification_reason
        type: string
        source: system
        description: Reason recorded when qualification_status becomes DISQUALIFIED; null otherwise.
        default: null

  - name: UniversitySupervisor
    parent: null
    common_fields: true
    entity_kind: resource
    description: |
      A university clinical supervisor. Holds a weighted caseload (not a headcount) and
      is the resource whose observation-window calendar must not double-book.
    fields:
      - name: full_name
        type: string
        source: input
        description: Supervisor legal name.
        constraints: "non-empty; 1..120 chars"
      - name: employment_type
        type: enum
        source: input
        description: Appointment type; selects the caseload ceiling constant.
        constraints: "one of {FULL_TIME, ADJUNCT}"
      - name: primary_subject
        type: enum
        source: input
        description: Subject the supervisor is primarily credentialed in; a mismatch surcharges caseload points.
        constraints: "one of {MATH, ELA, SCIENCE, SOCIAL_STUDIES, GENERALIST, SPED}"
      - name: covered_grade_bands
        type: array
        source: input
        description: Grade bands the supervisor is approved to supervise.
        constraints: "1..4 distinct members of {PK_3, K_6, MG_5_9, HS_9_12}"
      - name: home_grid_x
        type: integer
        source: input
        description: Supervisor base X coordinate on the program's 1-mile service grid.
        constraints: "-500..500"
      - name: home_grid_y
        type: integer
        source: input
        description: Supervisor base Y coordinate on the program's 1-mile service grid.
        constraints: "-500..500"
      - name: max_travel_miles
        type: integer
        source: input
        description: Largest Manhattan grid distance from home_grid to a teacher site the supervisor will cover (inclusive).
        default: 60
        constraints: "1..400"
      - name: max_caseload_points_override
        type: integer
        source: input
        description: Optional administrative ceiling that can only tighten the employment-type ceiling.
        default: null
        constraints: "1..40 when present"
      - name: max_caseload_points
        type: integer
        source: computed
        description: min(CASELOAD_CAP_BY_EMPLOYMENT[employment_type], max_caseload_points_override when present); see calculations.supervisor_caseload_points.
      - name: caseload_points
        type: integer
        source: computed
        description: |
          sum of per-placement points over Placement WHERE supervisor_id == this.id AND
          placement_status IN {PROPOSED, ACTIVE, REMOVAL_PENDING}; see
          calculations.supervisor_caseload_points. The conserved caseload quantity.
        default: 0
      - name: accepting_new_placements
        type: boolean
        source: input
        description: When false the supervisor is excluded from the supervisor selector regardless of caseload.
        default: true

  - name: PlacementRequest
    parent: null
    common_fields: true
    entity_kind: resource
    description: |
      A coordinator's ask for one clinical placement for one candidate in one term.
      Routing consumes it; a failed placement returns it to SUBMITTED so the same
      request produces the replacement. This entity is the OCC parent of rerouting.
    fields:
      - name: candidate_id
        type: string
        source: input
        description: FK -> Candidate.id; the candidate to be placed.
      - name: preferred_district_id
        type: string
        source: input
        description: |
          FK -> District.id; optional soft preference. When present, teachers in this
          district sort ahead of equally-ranked teachers elsewhere (see
          calculations.placement_match_ranking). Never an eligibility filter.
        default: null
      - name: term
        type: enum
        source: input
        description: Term the placement must fall in; must equal the backing agreement's term.
        constraints: "one of {FALL_2026, SPRING_2027}"
      - name: requested_subject
        type: enum
        source: input
        description: Subject endorsement the placement must match exactly.
        constraints: "one of {MATH, ELA, SCIENCE, SOCIAL_STUDIES, GENERALIST, SPED}"
      - name: requested_grade_band
        type: enum
        source: input
        description: Grade band the placement must match exactly.
        constraints: "one of {PK_3, K_6, MG_5_9, HS_9_12}"
      - name: max_commute_miles
        type: integer
        source: input
        description: Largest acceptable Manhattan grid distance from candidate home to teacher site, INCLUSIVE.
        constraints: "1..200"
      - name: term_start_date
        type: date
        source: input
        description: First day of clinical practice; becomes Placement.start_date.
      - name: weeks_scheduled
        type: integer
        source: input
        description: Scheduled clinical weeks; drives provisional stipend and the required observation-cycle count.
        constraints: "1..20"
      - name: term_end_date
        type: date
        source: computed
        description: term_start_date + (weeks_scheduled * 7) - 1 day; becomes Placement.end_date.
      - name: status
        type: enum
        source: system
        description: Request lifecycle; returns to SUBMITTED whenever its placement dies.
        default: SUBMITTED
        constraints: "one of {SUBMITTED, ROUTED, MATCHED, CLOSED}"
      - name: routing_round
        type: integer
        source: system
        description: How many times this request has been routed (incremented by route, never by reroute).
        default: 0
        constraints: "0..4"
      - name: reroute_count
        type: integer
        source: system
        description: How many times the current routing round has been rerouted; capped by MAX_REROUTES_PER_REQUEST (2).
        default: 0
        constraints: "0..3"
      - name: excluded_cooperating_teacher_ids
        type: array
        source: system
        description: |
          Teacher ids permanently excluded from this request's candidate pool. Appended
          by reroute when exclude_current_teacher is true and by every upheld removal.
        default: []
      - name: current_placement_id
        type: string
        source: computed
        description: |
          Id of this request's single non-terminal Placement, i.e. the Placement row
          WHERE request_id == this.id AND placement_status IN {PROPOSED, ACTIVE,
          REMOVAL_PENDING}; null when none exists. Discoverable via
          GET /epp/placements?request_id={this.id}.
        default: null

  - name: Placement
    parent: null
    common_fields: true
    entity_kind: resource
    description: |
      The clinical placement itself: candidate x cooperating teacher x agreement x
      supervisor, created only by the router. Carries TWO independent state dimensions
      on the same row - placement_status (clinical lifecycle) and stipend_status (money
      lifecycle) - which advance on separate endpoints and never imply each other
      except through the declared cascades.
    fields:
      - name: request_id
        type: string
        source: system
        description: FK -> PlacementRequest.id; the request this placement answers.
      - name: candidate_id
        type: string
        source: system
        description: FK -> Candidate.id; copied from the request at routing time.
      - name: cooperating_teacher_id
        type: string
        source: system
        description: FK -> CooperatingTeacher.id; chosen by calculations.placement_match_ranking.
      - name: agreement_id
        type: string
        source: system
        description: FK -> PartnershipAgreement.id; the agreement whose seat this placement consumes.
      - name: supervisor_id
        type: string
        source: system
        description: FK -> UniversitySupervisor.id; chosen by calculations.supervisor_assignment_ranking.
      - name: replaces_placement_id
        type: string
        source: system
        description: |
          FK -> Placement.id; self-reference to the REMOVED or VOIDED placement this row
          replaces, set only when the request is routed with routing_round >= 2. null on
          a first-round placement.
        default: null
      - name: subject
        type: enum
        source: system
        description: Copied from PlacementRequest.requested_subject at routing time.
        constraints: "one of {MATH, ELA, SCIENCE, SOCIAL_STUDIES, GENERALIST, SPED}"
      - name: grade_band
        type: enum
        source: system
        description: Copied from PlacementRequest.requested_grade_band at routing time.
        constraints: "one of {PK_3, K_6, MG_5_9, HS_9_12}"
      - name: start_date
        type: date
        source: system
        description: Copied from PlacementRequest.term_start_date at routing time.
      - name: end_date
        type: date
        source: computed
        description: Copied from PlacementRequest.term_end_date at routing time (start_date + weeks_scheduled*7 - 1 day).
      - name: weeks_scheduled
        type: integer
        source: system
        description: Copied from PlacementRequest.weeks_scheduled at routing time.
      - name: commute_miles
        type: integer
        source: computed
        description: Output of calculations.commute_miles_manhattan for (candidate home grid, teacher site grid).
      - name: supervisor_points
        type: integer
        source: computed
        description: |
          This placement's contribution to UniversitySupervisor.caseload_points under
          calculations.supervisor_caseload_points; changes when placement_status changes.
        default: 0
      - name: placement_status
        type: enum
        source: system
        description: Clinical lifecycle dimension.
        default: PROPOSED
        constraints: "one of {PROPOSED, ACTIVE, REMOVAL_PENDING, REMOVED, VOIDED, COMPLETED}"
      - name: stipend_status
        type: enum
        source: system
        description: Money lifecycle dimension, independent of placement_status.
        default: NOT_ACCRUED
        constraints: "one of {NOT_ACCRUED, ACCRUED, APPROVED, PAID, VOIDED, CLAWED_BACK}"
      - name: stipend_variant
        type: enum
        source: computed
        description: |
          Which variant of calculations.stipend_settlement_cents produced
          stipend_gross_cents. PROVISIONAL from confirmation, FINAL from settlement.
        default: null
        constraints: "one of {PROVISIONAL, FINAL} or null"
      - name: stipend_weekly_cents
        type: integer
        source: computed
        description: Per-week stipend after the longevity bonus, rounded to whole cents BEFORE multiplication; see calculations.stipend_settlement_cents.
        default: 0
      - name: weeks_credited
        type: integer
        source: computed
        description: Weeks the FINAL settlement pays for; equals weeks_scheduled only when the placement runs to term end.
        default: 0
      - name: stipend_gross_cents
        type: integer
        source: computed
        description: Gross cooperating-teacher stipend for this placement under stipend_variant.
        default: 0
      - name: travel_reimbursement_cents
        type: integer
        source: computed
        description: Output of calculations.travel_reimbursement_cents; 0 when the district's travel_reimbursement_enabled is false.
        default: 0
      - name: observation_compliance_ratio
        type: number
        source: computed
        description: Output of calculations.observation_compliance_ratio, 2 decimal places.
        default: 0
      - name: summative_completed_count
        type: integer
        source: computed
        description: count(ObservationCycle WHERE placement_id == this.id AND status == COMPLETED AND cycle_type == SUMMATIVE).
        default: 0
      - name: removal_reason
        type: enum
        source: system
        description: Why removal was requested; null unless a removal was ever filed.
        default: null
        constraints: "one of {CANDIDATE_PERFORMANCE, ASSESSMENT_FAILURE, COOPERATING_TEACHER_MISCONDUCT, DISTRICT_REQUEST} or null"
      - name: removal_requested_by_role
        type: string
        source: system
        description: X-User-Role that filed the removal request, or the literal "system" when the assessment cascade filed it.
        default: null
      - name: removal_requested_by_user_id
        type: string
        source: system
        description: X-User-ID that filed the removal request; the segregation-of-duties comparand. null when filed by the system cascade.
        default: null
      - name: removal_decided_by_user_id
        type: string
        source: system
        description: X-User-ID that decided the removal; null before a decision.
        default: null
      - name: removal_narrative
        type: string
        source: system
        description: Narrative captured with the removal request; null when none filed.
        default: null
      - name: voided_reason
        type: enum
        source: system
        description: Why the placement was voided before confirmation; null unless placement_status == VOIDED.
        default: null
        constraints: "one of {REROUTED, AGREEMENT_SUSPENDED} or null"
      - name: settlement_date
        type: date
        source: system
        description: Logical-clock date on which the FINAL stipend settlement ran (completion or upheld removal); null before settlement.
        default: null
      - name: completed_at
        type: datetime
        source: system
        description: Logical-clock instant of completion; null unless placement_status == COMPLETED.
        default: null

  - name: ObservationCycle
    parent: null
    common_fields: true
    entity_kind: resource
    description: |
      One scheduled supervisor observation of one placement. The scheduling window is a
      HALF-OPEN instant interval [window_start, window_end) on the supervisor's calendar.
    fields:
      - name: placement_id
        type: string
        source: input
        description: FK -> Placement.id; the placement being observed.
      - name: supervisor_id
        type: string
        source: system
        description: FK -> UniversitySupervisor.id; copied from Placement.supervisor_id at creation, never taken from the request body.
      - name: sequence_no
        type: integer
        source: input
        description: Ordinal of this cycle within the placement; unique per (placement_id, sequence_no).
        constraints: "1..6; unique together with placement_id"
      - name: cycle_type
        type: enum
        source: input
        description: Formative cycles coach; at least one SUMMATIVE cycle must be COMPLETED before a placement may complete.
        constraints: "one of {FORMATIVE, SUMMATIVE}"
      - name: window_start
        type: datetime
        source: input
        description: Inclusive start instant of the observation window (ISO 8601 UTC, three fractional digits).
      - name: window_end
        type: datetime
        source: input
        description: EXCLUSIVE end instant of the observation window; window_end > window_start.
      - name: status
        type: enum
        source: system
        description: Cycle lifecycle; MISSED cycles may be rescheduled back to SCHEDULED.
        default: SCHEDULED
        constraints: "one of {SCHEDULED, COMPLETED, MISSED, CANCELLED_HOLD}"
      - name: observed_at
        type: datetime
        source: system
        description: Instant recorded when the cycle completed; null otherwise.
        default: null
      - name: rubric_score
        type: number
        source: system
        description: Observation rubric score recorded at completion; null otherwise.
        default: null
        constraints: "1.0..5.0 in 0.5 steps when present"
      - name: reschedule_count
        type: integer
        source: system
        description: How many times this cycle has gone MISSED -> SCHEDULED; capped by MAX_RESCHEDULES_PER_CYCLE (2).
        default: 0
        constraints: "0..3"
      - name: resolution_note
        type: string
        source: system
        description: Note captured on the most recent resolve call; null before any resolve.
        default: null

  - name: PerformanceAssessment
    parent: null
    common_fields: true
    entity_kind: resource
    description: |
      The summative teaching performance assessment for one placement. Submission is
      gated by a CLOSED-CLOSED instant window; scoring either passes, returns for one
      revision, or fails - and failure at the last attempt drives the removal cascade.
    fields:
      - name: placement_id
        type: string
        source: input
        description: FK -> Placement.id; the placement being assessed. At most one PerformanceAssessment per placement.
        constraints: "unique across PerformanceAssessment"
      - name: window_opens_at
        type: datetime
        source: input
        description: First instant a submission is accepted (inclusive).
      - name: window_closes_at
        type: datetime
        source: input
        description: Last instant a submission is accepted (INCLUSIVE); window_closes_at > window_opens_at.
      - name: status
        type: enum
        source: system
        description: Assessment lifecycle; RETURNED loops back to SUBMITTED.
        default: OPEN
        constraints: "one of {OPEN, SUBMITTED, RETURNED, PASSED, FAILED}"
      - name: attempt_no
        type: integer
        source: system
        description: How many submissions have been accepted; capped by MAX_ASSESSMENT_ATTEMPTS (2).
        default: 0
        constraints: "0..2"
      - name: artifact_reference
        type: string
        source: system
        description: Reference string supplied with the most recent submission; null before any submission.
        default: null
      - name: submitted_at
        type: datetime
        source: system
        description: Instant of the most recent accepted submission; null before any submission.
        default: null
      - name: task_planning
        type: number
        source: system
        description: Raw rubric score for the planning task, recorded at scoring time.
        default: null
        constraints: "1.0..5.0 in 0.5 steps when present"
      - name: task_instruction
        type: number
        source: system
        description: Raw rubric score for the instruction task, recorded at scoring time.
        default: null
        constraints: "1.0..5.0 in 0.5 steps when present"
      - name: task_assessment
        type: number
        source: system
        description: Raw rubric score for the assessment task, recorded at scoring time.
        default: null
        constraints: "1.0..5.0 in 0.5 steps when present"
      - name: task_professionalism
        type: number
        source: system
        description: Raw rubric score for the professionalism task, recorded at scoring time.
        default: null
        constraints: "1.0..5.0 in 0.5 steps when present"
      - name: total_score
        type: integer
        source: computed
        description: Output of calculations.assessment_total_score (0..100); 0 before the first scoring.
        default: 0
      - name: scored_by_user_id
        type: string
        source: system
        description: X-User-ID of the UniversitySupervisor that recorded the most recent score; null before scoring.
        default: null
      - name: scored_at
        type: datetime
        source: system
        description: Instant of the most recent scoring; null before scoring.
        default: null
      - name: returned_feedback
        type: string
        source: system
        description: Feedback captured when the assessment was RETURNED; null otherwise.
        default: null

# ---------------------------------------------------------------------------
# 1.2 State Machine Table
# ---------------------------------------------------------------------------
state_machines:
  - entity: Candidate
    shape: parallel
    parallel_dimensions: [readiness_status, licensure_status, report_status]
    initial_state: NOT_READY
    initial_state_by_dimension:
      readiness_status: NOT_READY
      licensure_status: PENDING
      report_status: UNREPORTED
    terminal_states: [DENIED, REPORTED_ON_TIME, REPORTED_LATE]
    transitions:
      - from: NOT_READY
        to: READY
        dimension: readiness_status
        trigger: "POST /epp/readiness-items/{item_id}/verify with decision=VERIFIED, or the readiness re-evaluation embedded in POST /epp/placement-requests/{request_id}/route, POST /epp/placements/{placement_id}/confirm, POST /epp/placements/{placement_id}/complete and POST /epp/candidates/{candidate_id}/licensure-recommendation"
        actor: CredentialAnalyst
        preconditions:
          - "calculations.candidate_readiness_score for the applicable variant yields readiness_score >= READY_THRESHOLD (90)"
          - "the same evaluation yields clearance_points == 35 (a VERIFIED BACKGROUND_CLEARANCE ReadinessItem unexpired against the variant's reference date)"
        side_effects:
          - "Candidate.readiness_score set to the evaluated score"
          - "Candidate.readiness_variant_used set to STRICT or ROLLING per the calling endpoint"
          - "Candidate.updated_at refreshed and Candidate.version incremented by 1"
        note: "STRICT is used by verify / route / confirm; ROLLING by complete / licensure-recommendation."
      - from: READY
        to: LAPSED
        dimension: readiness_status
        trigger: "the ROLLING readiness re-evaluation embedded in POST /epp/placements/{placement_id}/complete or POST /epp/candidates/{candidate_id}/licensure-recommendation"
        actor: system
        preconditions:
          - "readiness_status == READY before the evaluation"
          - "the ROLLING evaluation yields clearance_points == 0 or readiness_score < READY_THRESHOLD (90)"
        side_effects:
          - "Candidate.readiness_score set to the ROLLING score"
          - "Candidate.readiness_variant_used set to ROLLING"
          - "every VERIFIED ReadinessItem of this candidate whose expires_on < the current logical clock date is first auto-transitioned VERIFIED -> EXPIRED (see ReadinessItem machine)"
          - "Candidate.updated_at refreshed and Candidate.version incremented by 1"
      - from: LAPSED
        to: READY
        dimension: readiness_status
        trigger: "POST /epp/readiness-items/{item_id}/verify with decision=VERIFIED on a replacement BACKGROUND_CLEARANCE item"
        actor: CredentialAnalyst
        preconditions:
          - "the STRICT evaluation after this verification yields readiness_score >= 90 and clearance_points == 35"
        side_effects:
          - "Candidate.readiness_score and readiness_variant_used (= STRICT) refreshed"
          - "Candidate.updated_at refreshed and Candidate.version incremented by 1"
        note: "This closes the readiness cycle READY -> LAPSED -> READY."
      - from: PENDING
        to: RECOMMENDED
        dimension: licensure_status
        trigger: "POST /epp/candidates/{candidate_id}/licensure-recommendation with decision=RECOMMENDED"
        actor: ProgramAdmin
        preconditions:
          - "the candidate has at least one Placement with placement_status == COMPLETED"
          - "the PerformanceAssessment of that COMPLETED placement has status == PASSED"
          - "the ROLLING readiness re-evaluation run first in this request leaves readiness_status == READY"
        side_effects:
          - "Candidate.recommended_by_user_id set to the acting X-User-ID and Candidate.recommended_at set to the logical clock"
          - "Candidate.state_report_deadline set to the CLOSED request's term_end_date + STATE_REPORT_GRACE_DAYS (45)"
          - "Candidate.updated_at refreshed and Candidate.version incremented by 1"
      - from: PENDING
        to: DENIED
        dimension: licensure_status
        trigger: "POST /epp/candidates/{candidate_id}/licensure-recommendation with decision=DENIED"
        actor: ProgramAdmin
        preconditions:
          - "the candidate has at least one Placement with placement_status IN {COMPLETED, REMOVED}"
        side_effects:
          - "Candidate.denial_reason recorded, recommended_by_user_id / recommended_at set"
          - "Candidate.updated_at refreshed and Candidate.version incremented by 1"
        note: "Terminal: no transition leaves DENIED."
      - from: UNREPORTED
        to: REPORTED_ON_TIME
        dimension: report_status
        trigger: "POST /epp/candidates/{candidate_id}/state-report"
        actor: ProgramAdmin
        preconditions:
          - "licensure_status == RECOMMENDED"
          - "the acting X-User-ID differs from Candidate.recommended_by_user_id"
          - "the current logical clock date <= Candidate.state_report_deadline"
        side_effects:
          - "Candidate.reported_at, reported_by_user_id and reporting_cycle recorded"
          - "Candidate.updated_at refreshed and Candidate.version incremented by 1"
      - from: UNREPORTED
        to: REPORTED_LATE
        dimension: report_status
        trigger: "POST /epp/candidates/{candidate_id}/state-report"
        actor: ProgramAdmin
        preconditions:
          - "licensure_status == RECOMMENDED"
          - "the acting X-User-ID differs from Candidate.recommended_by_user_id"
          - "the current logical clock date > Candidate.state_report_deadline"
        side_effects:
          - "Candidate.reported_at, reported_by_user_id and reporting_cycle recorded"
          - "Candidate.updated_at refreshed and Candidate.version incremented by 1"
        note: "Filing late is accepted but permanently marked; both report states are terminal."

  - entity: ReadinessItem
    shape: branching_with_auto_expiry
    initial_state: PENDING_VERIFICATION
    terminal_states: [REJECTED, EXPIRED]
    transitions:
      - from: PENDING_VERIFICATION
        to: VERIFIED
        trigger: "POST /epp/readiness-items/{item_id}/verify with decision=VERIFIED"
        actor: CredentialAnalyst
        preconditions:
          - "status == PENDING_VERIFICATION"
          - "when item_type == BACKGROUND_CLEARANCE, expires_on >= the current logical clock date"
        side_effects:
          - "verified_by_user_id and verified_at recorded"
          - "the owning Candidate's readiness_score / readiness_status recomputed with the STRICT variant (see Candidate machine)"
          - "ReadinessItem.updated_at refreshed and version incremented by 1"
      - from: PENDING_VERIFICATION
        to: REJECTED
        trigger: "POST /epp/readiness-items/{item_id}/verify with decision=REJECTED"
        actor: CredentialAnalyst
        preconditions:
          - "status == PENDING_VERIFICATION"
        side_effects:
          - "rejection_note, verified_by_user_id and verified_at recorded"
          - "the owning Candidate's readiness_score / readiness_status recomputed with the STRICT variant (a rejected item contributes 0 points)"
          - "ReadinessItem.updated_at refreshed and version incremented by 1"
      - from: VERIFIED
        to: EXPIRED
        trigger: "system: any readiness evaluation (route, confirm, complete, licensure-recommendation, verify) that observes expires_on < the current logical clock date"
        actor: system
        preconditions:
          - "status == VERIFIED"
          - "expires_on is not null and expires_on < the current logical clock date"
        side_effects:
          - "ReadinessItem.status set to EXPIRED; updated_at refreshed and version incremented by 1"
          - "the owning Candidate's readiness evaluation in the SAME request then scores this item at 0 points, which is what drives Candidate READY -> LAPSED"
        note: "Lazy auto-transition: no background job, it fires on the next reference."

  - entity: PartnershipAgreement
    shape: cyclic
    initial_state: DRAFT
    terminal_states: [TERMINATED, EXPIRED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /epp/partnership-agreements/{agreement_id}/activate"
        actor: ProgramAdmin
        preconditions:
          - "status == DRAFT"
          - "the current logical clock date <= window_end"
        side_effects:
          - "capacity_posture recomputed (OPEN while seats_committed < placement_cap)"
          - "PartnershipAgreement.updated_at refreshed and version incremented by 1"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /epp/partnership-agreements/{agreement_id}/suspend"
        actor: ProgramAdmin
        preconditions:
          - "status == ACTIVE"
        side_effects:
          - "CASCADE HOP 1: suspension_reason recorded; agreement status set to SUSPENDED"
          - "CASCADE HOP 2: because the agreement left ACTIVE, every Placement WHERE agreement_id == this.id AND placement_status == PROPOSED transitions PROPOSED -> VOIDED with voided_reason = AGREEMENT_SUSPENDED (ACTIVE and REMOVAL_PENDING placements are deliberately untouched)"
          - "CASCADE HOP 3: because those placements became VOIDED, each one's PlacementRequest transitions ROUTED -> SUBMITTED and its excluded_cooperating_teacher_ids gains the voided placement's cooperating_teacher_id"
          - "CASCADE HOP 4: because each voided placement no longer counts, calculations.agreement_ledger re-derives seats_reserved (down by one per voided placement), CooperatingTeacher.active_placement_count and UniversitySupervisor.caseload_points; agreement capacity_posture is re-derived from the new seats_committed"
          - "PartnershipAgreement.updated_at refreshed and version incremented by 1"
        note: "This is the depth-4 cascade whose origin is an agreement-level action."
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /epp/partnership-agreements/{agreement_id}/reactivate"
        actor: ProgramAdmin
        preconditions:
          - "status == SUSPENDED"
          - "the current logical clock date <= window_end"
        side_effects:
          - "suspension_reason cleared to null"
          - "placements voided during the suspension are NOT resurrected; the requeued requests must be routed again"
          - "PartnershipAgreement.updated_at refreshed and version incremented by 1"
        note: "Closes the agreement cycle ACTIVE -> SUSPENDED -> ACTIVE."
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /epp/partnership-agreements/{agreement_id}/terminate"
        actor: ProgramAdmin
        preconditions:
          - "status == ACTIVE"
        side_effects:
          - "suspension_reason recorded"
          - "every Placement WHERE agreement_id == this.id AND placement_status == PROPOSED transitions PROPOSED -> VOIDED with voided_reason = AGREEMENT_SUSPENDED, cascading exactly as in the SUSPENDED case"
          - "PartnershipAgreement.updated_at refreshed and version incremented by 1"
      - from: SUSPENDED
        to: TERMINATED
        trigger: "POST /epp/partnership-agreements/{agreement_id}/terminate"
        actor: ProgramAdmin
        preconditions:
          - "status == SUSPENDED"
        side_effects:
          - "suspension_reason recorded"
          - "PartnershipAgreement.updated_at refreshed and version incremented by 1"
      - from: ACTIVE
        to: EXPIRED
        trigger: "system: any POST /epp/placement-requests/{request_id}/route, POST /epp/placement-requests/{request_id}/reroute or POST /epp/placements/{placement_id}/confirm that references this agreement while the current logical clock date > window_end"
        actor: system
        preconditions:
          - "status == ACTIVE"
          - "the current logical clock date > window_end"
        side_effects:
          - "PartnershipAgreement.status set to EXPIRED; updated_at refreshed and version incremented by 1"
          - "the referencing request then fails with ERR_AGREEMENT_EXPIRED; already ACTIVE placements keep running and may still complete"
        note: "Lazy auto-transition evaluated before every other agreement check."

  - entity: CooperatingTeacher
    shape: cyclic
    initial_state: PENDING_TRAINING
    terminal_states: [DISQUALIFIED]
    transitions:
      - from: PENDING_TRAINING
        to: QUALIFIED
        trigger: "POST /epp/cooperating-teachers/{teacher_id}/training-completion"
        actor: ProgramAdmin
        preconditions:
          - "qualification_status IN {PENDING_TRAINING, TRAINING_EXPIRED}"
          - "training_completed_on <= the current logical clock date"
        side_effects:
          - "training_completed_on recorded and training_expires_on set to training_completed_on + TRAINING_VALID_DAYS (730)"
          - "CooperatingTeacher.updated_at refreshed and version incremented by 1"
      - from: QUALIFIED
        to: TRAINING_EXPIRED
        trigger: "system: any POST /epp/placement-requests/{request_id}/route, POST /epp/placement-requests/{request_id}/reroute, GET /epp/cooperating-teachers/{teacher_id} or POST /epp/placements/{placement_id}/confirm that evaluates this teacher while the current logical clock date > training_expires_on"
        actor: system
        preconditions:
          - "qualification_status == QUALIFIED"
          - "the current logical clock date > training_expires_on"
        side_effects:
          - "CooperatingTeacher.qualification_status set to TRAINING_EXPIRED; updated_at refreshed and version incremented by 1"
          - "the teacher is then excluded from the candidate pool by calculations.placement_match_ranking with rejection reason TRAINING_EXPIRED"
        note: "Lazy auto-transition; makes GET /epp/cooperating-teachers/{teacher_id} a mutating read for this field only."
      - from: TRAINING_EXPIRED
        to: QUALIFIED
        trigger: "POST /epp/cooperating-teachers/{teacher_id}/training-completion with a fresh training_completed_on"
        actor: ProgramAdmin
        preconditions:
          - "qualification_status == TRAINING_EXPIRED"
          - "training_completed_on <= the current logical clock date"
        side_effects:
          - "training_completed_on and training_expires_on refreshed"
          - "CooperatingTeacher.updated_at refreshed and version incremented by 1"
        note: "Closes the qualification cycle QUALIFIED -> TRAINING_EXPIRED -> QUALIFIED."
      - from: QUALIFIED
        to: DISQUALIFIED
        trigger: "system: POST /epp/placements/{placement_id}/removal-decision with decision=UPHELD on a placement whose removal_reason == COOPERATING_TEACHER_MISCONDUCT"
        actor: system
        preconditions:
          - "qualification_status IN {QUALIFIED, TRAINING_EXPIRED}"
          - "the deciding placement's removal_reason == COOPERATING_TEACHER_MISCONDUCT"
        side_effects:
          - "disqualification_reason recorded from the removal narrative"
          - "CooperatingTeacher.updated_at refreshed and version incremented by 1"
          - "the teacher is permanently excluded from every future candidate pool"
        note: "Terminal: no transition leaves DISQUALIFIED."

  - entity: PlacementRequest
    shape: cyclic
    initial_state: SUBMITTED
    terminal_states: [CLOSED]
    transitions:
      - from: SUBMITTED
        to: ROUTED
        trigger: "POST /epp/placement-requests/{request_id}/route"
        actor: PlacementCoordinator
        preconditions:
          - "status == SUBMITTED"
          - "routing_round < MAX_ROUTING_ROUNDS (3)"
          - "the owning Candidate's STRICT readiness evaluation leaves readiness_status == READY"
          - "calculations.placement_match_ranking returns a non-empty candidate pool"
          - "calculations.supervisor_assignment_ranking returns a non-empty supervisor pool for the selected teacher"
        side_effects:
          - "routing_round incremented by 1 and reroute_count reset to 0"
          - "a Placement row is created in placement_status PROPOSED / stipend_status NOT_ACCRUED, with replaces_placement_id set to this request's most recent Placement in {REMOVED, VOIDED} when routing_round >= 2 (see calculations.replacement_selection)"
          - "calculations.agreement_ledger raises the selected agreement's seats_reserved by 1 and the teacher's active_placement_count by 1"
          - "calculations.supervisor_caseload_points raises the selected supervisor's caseload_points by the new placement's supervisor_points"
          - "PlacementRequest.current_placement_id re-derived; updated_at refreshed and version incremented by 1"
      - from: ROUTED
        to: SUBMITTED
        trigger: "system: the PROPOSED placement of this request becomes VOIDED (agreement suspension/termination cascade) or its confirmed placement becomes REMOVED (upheld removal cascade)"
        actor: system
        preconditions:
          - "status IN {ROUTED, MATCHED}"
          - "the request's current placement left the non-terminal set"
        side_effects:
          - "excluded_cooperating_teacher_ids gains the dead placement's cooperating_teacher_id"
          - "current_placement_id re-derived to null"
          - "PlacementRequest.updated_at refreshed and version incremented by 1"
        note: "Closes the request cycle SUBMITTED -> ROUTED -> SUBMITTED and is how mid-semester replacement is produced: the same request is routed again and the new Placement points back through replaces_placement_id."
      - from: ROUTED
        to: MATCHED
        trigger: "POST /epp/placements/{placement_id}/confirm"
        actor: PlacementCoordinator
        preconditions:
          - "status == ROUTED"
          - "the confirmed placement's request_id == this.id"
        side_effects:
          - "current_placement_id unchanged (same placement, now ACTIVE)"
          - "PlacementRequest.updated_at refreshed and version incremented by 1"
      - from: MATCHED
        to: SUBMITTED
        trigger: "system: POST /epp/placements/{placement_id}/removal-decision with decision=UPHELD"
        actor: system
        preconditions:
          - "status == MATCHED"
          - "the removed placement's request_id == this.id"
        side_effects:
          - "excluded_cooperating_teacher_ids gains the removed placement's cooperating_teacher_id"
          - "current_placement_id re-derived to null"
          - "PlacementRequest.updated_at refreshed and version incremented by 1"
      - from: MATCHED
        to: CLOSED
        trigger: "POST /epp/placements/{placement_id}/complete"
        actor: PlacementCoordinator
        preconditions:
          - "status == MATCHED"
          - "the completed placement's request_id == this.id"
        side_effects:
          - "current_placement_id re-derived to null"
          - "PlacementRequest.updated_at refreshed and version incremented by 1"
        note: "Terminal."
      - from: ROUTED
        to: ROUTED
        trigger: "POST /epp/placement-requests/{request_id}/reroute"
        actor: PlacementCoordinator
        preconditions:
          - "status == ROUTED"
          - "expected_request_version equals the request's current version (see concurrency_rules.reroute-supersede-stale-request)"
          - "current_placement_id is not null and that placement's placement_status == PROPOSED"
          - "reroute_count < MAX_REROUTES_PER_REQUEST (2)"
          - "calculations.placement_match_ranking returns a non-empty pool after the exclusions"
        side_effects:
          - "the current PROPOSED placement transitions PROPOSED -> VOIDED with voided_reason = REROUTED; because voided_reason is REROUTED the request deliberately does NOT return to SUBMITTED"
          - "when exclude_current_teacher is true the voided placement's cooperating_teacher_id is appended to excluded_cooperating_teacher_ids"
          - "a replacement Placement row is created in PROPOSED / NOT_ACCRUED for the same routing_round; replaces_placement_id is left null because a rerouted placement was never confirmed"
          - "reroute_count incremented by 1; routing_round unchanged"
          - "calculations.agreement_ledger and calculations.supervisor_caseload_points re-derive seats_reserved, active_placement_count and caseload_points so the seat and caseload totals are conserved across the void+create pair"
          - "PlacementRequest.updated_at refreshed and version incremented by 1"
        note: "The supersede self-loop that concurrency_rules guards with OCC."

  - entity: Placement
    shape: parallel
    parallel_dimensions: [placement_status, stipend_status]
    initial_state: PROPOSED
    initial_state_by_dimension:
      placement_status: PROPOSED
      stipend_status: NOT_ACCRUED
    terminal_states: [REMOVED, VOIDED, COMPLETED, PAID, CLAWED_BACK]
    transitions:
      - from: PROPOSED
        to: ACTIVE
        dimension: placement_status
        trigger: "POST /epp/placements/{placement_id}/confirm"
        actor: PlacementCoordinator
        preconditions:
          - "placement_status == PROPOSED"
          - "the backing PartnershipAgreement.status == ACTIVE after the lazy expiry check"
          - "the backing agreement's seats_committed < placement_cap (the hard cap routing was allowed to over-subscribe)"
          - "the Candidate's STRICT readiness re-evaluation leaves readiness_status == READY, with the clearance sub-gate evaluated first"
          - "when the teacher's District.requires_district_fingerprint is true, the candidate holds a VERIFIED unexpired BACKGROUND_CLEARANCE ReadinessItem with clearance_scope == DISTRICT_FINGERPRINT"
          - "CooperatingTeacher.qualification_status == QUALIFIED after the lazy training-expiry check"
          - "no other Placement of this cooperating_teacher_id in {PROPOSED, ACTIVE, REMOVAL_PENDING, COMPLETED} collides with [start_date, end_date] once each existing placement is padded by TURNAROUND_BUFFER_DAYS (14) on both ends — a padding the routing filter does NOT apply"
          - "the supervisor's caseload_points, after re-scoring this placement at its ACTIVE base points, is <= max_caseload_points"
        side_effects:
          - "placement_status set to ACTIVE"
          - "stipend dimension advances NOT_ACCRUED -> ACCRUED in the same request (see the stipend transition below)"
          - "supervisor_points re-scored from PROPOSED base 1 to ACTIVE base 2 and UniversitySupervisor.caseload_points re-derived by calculations.supervisor_caseload_points"
          - "calculations.agreement_ledger moves one seat from seats_reserved to seats_committed and re-derives capacity_posture"
          - "the owning PlacementRequest transitions ROUTED -> MATCHED"
          - "Placement.updated_at refreshed and version incremented by 1"
      - from: PROPOSED
        to: VOIDED
        dimension: placement_status
        trigger: "POST /epp/placement-requests/{request_id}/reroute (voided_reason = REROUTED), or the PartnershipAgreement SUSPENDED/TERMINATED cascade (voided_reason = AGREEMENT_SUSPENDED)"
        actor: system
        preconditions:
          - "placement_status == PROPOSED"
        side_effects:
          - "voided_reason recorded; stipend_status stays NOT_ACCRUED because nothing was ever accrued"
          - "calculations.agreement_ledger lowers seats_reserved by 1 and the teacher's active_placement_count by 1"
          - "calculations.supervisor_caseload_points lowers the supervisor's caseload_points by this placement's supervisor_points"
          - "Placement.updated_at refreshed and version incremented by 1"
        note: "Terminal for the clinical dimension."
      - from: ACTIVE
        to: REMOVAL_PENDING
        dimension: placement_status
        trigger: "POST /epp/placements/{placement_id}/removal-request, or the system cascade from POST /epp/performance-assessments/{assessment_id}/score when the assessment reaches FAILED"
        actor: PlacementCoordinator
        preconditions:
          - "placement_status == ACTIVE"
        side_effects:
          - "CASCADE HOP 1: removal_reason, removal_narrative, removal_requested_by_role and removal_requested_by_user_id recorded (role = \"system\" and user id = null on the assessment cascade)"
          - "CASCADE HOP 2: because the placement entered REMOVAL_PENDING, every ObservationCycle of this placement whose status == SCHEDULED transitions SCHEDULED -> CANCELLED_HOLD"
          - "CASCADE HOP 3: because this placement's stage changed, supervisor_points is re-scored at the REMOVAL_PENDING base of 3 and UniversitySupervisor.caseload_points is re-derived upward"
          - "the stipend dimension is untouched: an ACCRUED or APPROVED stipend stays exactly where it is until the decision"
          - "Placement.updated_at refreshed and version incremented by 1"
      - from: REMOVAL_PENDING
        to: ACTIVE
        dimension: placement_status
        trigger: "POST /epp/placements/{placement_id}/removal-decision with decision=DISMISSED"
        actor: ProgramAdmin
        preconditions:
          - "placement_status == REMOVAL_PENDING"
          - "the acting X-User-ID differs from removal_requested_by_user_id"
        side_effects:
          - "removal_decided_by_user_id recorded; removal_reason and removal_narrative are RETAINED as the audit trail of the dismissed attempt"
          - "supervisor_points re-scored back to the ACTIVE base of 2 and UniversitySupervisor.caseload_points re-derived downward"
          - "ObservationCycle rows already moved to CANCELLED_HOLD are NOT resurrected; new cycles must be scheduled"
          - "Placement.updated_at refreshed and version incremented by 1"
        note: "Closes the placement cycle ACTIVE -> REMOVAL_PENDING -> ACTIVE."
      - from: REMOVAL_PENDING
        to: REMOVED
        dimension: placement_status
        trigger: "POST /epp/placements/{placement_id}/removal-decision with decision=UPHELD"
        actor: ProgramAdmin
        preconditions:
          - "placement_status == REMOVAL_PENDING"
          - "the acting X-User-ID differs from removal_requested_by_user_id"
        side_effects:
          - "CASCADE HOP 1: placement_status set to REMOVED; settlement_date set to the current logical clock date; removal_decided_by_user_id recorded"
          - "CASCADE HOP 2: because the placement became REMOVED, stipend_variant flips PROVISIONAL -> FINAL and stipend_weekly_cents / weeks_credited / stipend_gross_cents are recomputed by calculations.stipend_settlement_cents under the FINAL variant, and travel_reimbursement_cents is recomputed on the credited weeks"
          - "CASCADE HOP 3: because stipend_gross_cents changed, calculations.agreement_ledger re-derives the agreement's stipend_committed_cents from the new gross and lowers seats_committed by 1 (the removed placement leaves the committed set)"
          - "CASCADE HOP 4: because seats_committed changed, the agreement's capacity_posture is re-derived, flipping CAP_REACHED -> OPEN when the removal freed the last committed seat"
          - "when removal_reason == COOPERATING_TEACHER_MISCONDUCT the stipend dimension additionally moves ACCRUED|APPROVED -> VOIDED with stipend_gross_cents forced to 0, and the CooperatingTeacher is DISQUALIFIED (a stipend already PAID is recovered later through the explicit CLAWED_BACK money transition)"
          - "every ObservationCycle of this placement still SCHEDULED transitions to CANCELLED_HOLD"
          - "the owning PlacementRequest transitions MATCHED -> SUBMITTED and gains this teacher in excluded_cooperating_teacher_ids"
          - "Placement.updated_at refreshed and version incremented by 1"
        note: "Terminal for the clinical dimension; this is the depth-4 cascade whose origin is a placement-level action."
      - from: ACTIVE
        to: COMPLETED
        dimension: placement_status
        trigger: "POST /epp/placements/{placement_id}/complete"
        actor: PlacementCoordinator
        preconditions:
          - "placement_status == ACTIVE"
          - "the current logical clock date >= end_date"
          - "calculations.observation_compliance_ratio for this placement is >= 1.0 AND summative_completed_count >= 1"
          - "the placement's PerformanceAssessment exists and its status == PASSED"
        side_effects:
          - "completed_at and settlement_date recorded from the logical clock"
          - "stipend_variant flips PROVISIONAL -> FINAL; weeks_credited, stipend_weekly_cents, stipend_gross_cents and travel_reimbursement_cents recomputed under the FINAL variant including the COMPLETION_PREMIUM_CENTS (2500) when observation_compliance_ratio == 1.0"
          - "calculations.agreement_ledger re-derives stipend_committed_cents from the new gross; seats_committed is UNCHANGED because COMPLETED stays in the committed set"
          - "the Candidate's readiness is re-evaluated with the ROLLING variant"
          - "the owning PlacementRequest transitions MATCHED -> CLOSED and Candidate.state_report_deadline becomes reachable"
          - "Placement.updated_at refreshed and version incremented by 1"
        note: "Terminal for the clinical dimension."
      - from: NOT_ACCRUED
        to: ACCRUED
        dimension: stipend_status
        trigger: "POST /epp/placements/{placement_id}/confirm"
        actor: PlacementCoordinator
        preconditions:
          - "stipend_status == NOT_ACCRUED"
          - "the same request's PROPOSED -> ACTIVE clinical transition passed all of its preconditions"
        side_effects:
          - "stipend_variant set to PROVISIONAL and stipend_weekly_cents / stipend_gross_cents computed by calculations.stipend_settlement_cents under the PROVISIONAL variant"
          - "travel_reimbursement_cents computed by calculations.travel_reimbursement_cents on weeks_scheduled"
          - "calculations.agreement_ledger raises the agreement's stipend_committed_cents by the new gross"
      - from: ACCRUED
        to: APPROVED
        dimension: stipend_status
        trigger: "POST /epp/placements/{placement_id}/stipend-transition with target_status=APPROVED"
        actor: ProgramAdmin
        preconditions:
          - "stipend_status == ACCRUED"
          - "placement_status IN {ACTIVE, REMOVAL_PENDING, REMOVED, COMPLETED}"
          - "CooperatingTeacher.qualification_status == QUALIFIED at approval time"
        side_effects:
          - "Placement.updated_at refreshed and version incremented by 1; stipend_committed_cents is unchanged because APPROVED stays in the committed set"
      - from: APPROVED
        to: PAID
        dimension: stipend_status
        trigger: "POST /epp/placements/{placement_id}/stipend-transition with target_status=PAID"
        actor: ProgramAdmin
        preconditions:
          - "stipend_status == APPROVED"
          - "stipend_variant == FINAL (a provisional accrual may never be paid out)"
        side_effects:
          - "Placement.updated_at refreshed and version incremented by 1; stipend_committed_cents unchanged"
        note: "Terminal for the money dimension unless a misconduct removal claws it back."
      - from: ACCRUED
        to: VOIDED
        dimension: stipend_status
        trigger: "POST /epp/placements/{placement_id}/stipend-transition with target_status=VOIDED, or the misconduct branch of an upheld removal"
        actor: ProgramAdmin
        preconditions:
          - "stipend_status IN {ACCRUED, APPROVED}"
        side_effects:
          - "stipend_gross_cents forced to 0"
          - "calculations.agreement_ledger lowers the agreement's stipend_committed_cents by the voided gross, restoring the conserved money quantity"
          - "Placement.updated_at refreshed and version incremented by 1"
        note: "Terminal for the money dimension."
      - from: PAID
        to: CLAWED_BACK
        dimension: stipend_status
        trigger: "POST /epp/placements/{placement_id}/stipend-transition with target_status=CLAWED_BACK"
        actor: ProgramAdmin
        preconditions:
          - "stipend_status == PAID"
          - "the placement's CooperatingTeacher.qualification_status == DISQUALIFIED (misconduct found after the money left the program)"
        side_effects:
          - "stipend_gross_cents forced to 0 and weeks_credited forced to 0"
          - "calculations.agreement_ledger lowers stipend_committed_cents by the clawed-back gross so the conserved money quantity returns to its pre-confirmation value"
          - "Placement.updated_at refreshed and version incremented by 1"
        note: "Terminal for the money dimension; the compensating action of the PAID forward action."

  - entity: ObservationCycle
    shape: cyclic
    initial_state: SCHEDULED
    terminal_states: [CANCELLED_HOLD]
    transitions:
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /epp/observation-cycles/{cycle_id}/complete"
        actor: UniversitySupervisorUser
        preconditions:
          - "status == SCHEDULED"
          - "the acting X-User-ID equals this cycle's supervisor_id (roles.UniversitySupervisorUser is entity_backed:UniversitySupervisor)"
          - "the owning Placement.placement_status == ACTIVE"
          - "observed_at falls inside the half-open window [window_start, window_end)"
          - "rubric_score is a multiple of 0.5 inside 1.0..5.0"
        side_effects:
          - "observed_at and rubric_score recorded"
          - "calculations.observation_compliance_ratio re-derives the owning Placement's observation_compliance_ratio"
          - "when cycle_type == SUMMATIVE the owning Placement.summative_completed_count is incremented by 1"
          - "ObservationCycle.updated_at refreshed and version incremented by 1"
      - from: SCHEDULED
        to: MISSED
        trigger: "lazy evaluation on any read or write that touches this cycle once the logical clock reaches window_end, or POST /epp/observation-cycles/{cycle_id}/complete rejected for a late observed_at"
        actor: system
        preconditions:
          - "status == SCHEDULED"
          - "the current logical clock instant >= window_end"
        side_effects:
          - "status set to MISSED; observed_at stays null"
          - "calculations.observation_compliance_ratio re-derives the owning Placement's observation_compliance_ratio downward, which can strand the placement's completion gate"
          - "ObservationCycle.updated_at refreshed and version incremented by 1"
        note: "Lazy automatic transition; no dedicated endpoint drives it."
      - from: MISSED
        to: SCHEDULED
        trigger: "POST /epp/observation-cycles/{cycle_id}/reschedule"
        actor: SupervisionLead
        preconditions:
          - "status == MISSED"
          - "reschedule_count < MAX_RESCHEDULES_PER_CYCLE (2)"
          - "the owning Placement.placement_status == ACTIVE"
          - "the new window_start is >= the current logical clock instant and the new window_end is <= the owning Placement.end_date at 23:59:59Z"
          - "the new half-open window does not overlap any other SCHEDULED or COMPLETED cycle of the same placement"
        side_effects:
          - "window_start and window_end replaced; reschedule_count incremented by 1; resolution_note recorded"
          - "calculations.observation_compliance_ratio re-derives the owning Placement's observation_compliance_ratio upward again"
          - "ObservationCycle.updated_at refreshed and version incremented by 1"
        note: "Closes the cycle SCHEDULED -> MISSED -> SCHEDULED, bounded by MAX_RESCHEDULES_PER_CYCLE."
      - from: SCHEDULED
        to: CANCELLED_HOLD
        trigger: "system cascade from the owning Placement entering REMOVAL_PENDING or REMOVED"
        actor: system
        preconditions:
          - "status == SCHEDULED"
        side_effects:
          - "resolution_note set to a system string naming the removal; observed_at and rubric_score stay null"
          - "calculations.observation_compliance_ratio treats CANCELLED_HOLD as excluded from the denominator, so the ratio is re-derived over the surviving cycles"
          - "ObservationCycle.updated_at refreshed and version incremented by 1"
        note: "Terminal; conditional cascade — a COMPLETED or MISSED cycle is deliberately left untouched."

  - entity: PerformanceAssessment
    shape: cyclic
    initial_state: OPEN
    terminal_states: [PASSED, FAILED]
    transitions:
      - from: OPEN
        to: SUBMITTED
        trigger: "POST /epp/performance-assessments/{assessment_id}/submit"
        actor: CandidateUser
        preconditions:
          - "status == OPEN"
          - "the acting X-User-ID equals the owning placement's candidate_id (roles.CandidateUser is entity_backed:Candidate)"
          - "the current logical clock instant is inside the closed-closed window [window_opens_at, window_closes_at]"
          - "the owning Placement.placement_status == ACTIVE"
          - "calculations.observation_compliance_ratio for the owning placement is >= 0.5"
          - "artifact_reference is a non-empty string"
        side_effects:
          - "attempt_no incremented by 1 (0 -> 1 on the first submission); artifact_reference and submitted_at recorded"
          - "PerformanceAssessment.updated_at refreshed and version incremented by 1"
      - from: SUBMITTED
        to: RETURNED
        trigger: "POST /epp/performance-assessments/{assessment_id}/score with decision=RETURN"
        actor: AssessmentScorer
        preconditions:
          - "status == SUBMITTED"
          - "the acting X-User-ID differs from the owning placement's candidate_id (a candidate may never score their own assessment)"
          - "attempt_no < MAX_ASSESSMENT_ATTEMPTS (2)"
        side_effects:
          - "returned_feedback recorded; the four rubric dimension scores and total_score stay null because a RETURN is not a score"
          - "window_closes_at extended by RESUBMISSION_GRACE_DAYS (7) and submitted_at cleared; attempt_no is NOT touched here — it is the submission that consumes an attempt"
          - "PerformanceAssessment.updated_at refreshed and version incremented by 1"
      - from: RETURNED
        to: SUBMITTED
        trigger: "POST /epp/performance-assessments/{assessment_id}/submit"
        actor: CandidateUser
        preconditions:
          - "status == RETURNED"
          - "the acting X-User-ID equals the owning placement's candidate_id (roles.CandidateUser is entity_backed:Candidate)"
          - "the current logical clock instant is inside the extended closed-closed window [window_opens_at, window_closes_at]"
          - "the owning Placement.placement_status == ACTIVE"
        side_effects:
          - "attempt_no incremented by 1 (1 -> 2 on the resubmission); artifact_reference replaced and submitted_at recorded"
          - "PerformanceAssessment.updated_at refreshed and version incremented by 1"
        note: "Closes the cycle SUBMITTED -> RETURNED -> SUBMITTED, bounded by MAX_ASSESSMENT_ATTEMPTS."
      - from: SUBMITTED
        to: PASSED
        trigger: "POST /epp/performance-assessments/{assessment_id}/score with decision=SCORE and a total_score >= CUT_SCORE"
        actor: AssessmentScorer
        preconditions:
          - "status == SUBMITTED"
          - "the acting X-User-ID differs from the owning placement's candidate_id (a candidate may never score their own assessment)"
          - "all four rubric dimension scores are provided as multiples of 0.5 in 1.0..5.0"
          - "calculations.assessment_total_score yields a total_score >= CUT_SCORE (70)"
        side_effects:
          - "the four dimension scores, total_score, scored_by_user_id and scored_at recorded"
          - "the owning Placement's completion gate now admits POST /epp/placements/{placement_id}/complete"
          - "PerformanceAssessment.updated_at refreshed and version incremented by 1"
        note: "Terminal."
      - from: SUBMITTED
        to: FAILED
        trigger: "POST /epp/performance-assessments/{assessment_id}/score with decision=SCORE, a total_score < CUT_SCORE and attempt_no == MAX_ASSESSMENT_ATTEMPTS"
        actor: AssessmentScorer
        preconditions:
          - "status == SUBMITTED"
          - "the acting X-User-ID differs from the owning placement's candidate_id (a candidate may never score their own assessment)"
          - "calculations.assessment_total_score yields a total_score < CUT_SCORE (70)"
          - "attempt_no == MAX_ASSESSMENT_ATTEMPTS (2) — a sub-cut score on attempt 1 goes to RETURNED instead"
        side_effects:
          - "CASCADE HOP 1: the four dimension scores, total_score, scored_by_user_id and scored_at recorded; status set to FAILED"
          - "CASCADE HOP 2: because the assessment reached FAILED, the owning Placement transitions ACTIVE -> REMOVAL_PENDING with removal_reason = ASSESSMENT_FAILURE, removal_requested_by_role = \"system\" and removal_requested_by_user_id = null"
          - "CASCADE HOP 3: because the placement entered REMOVAL_PENDING, every ObservationCycle of that placement still SCHEDULED transitions to CANCELLED_HOLD and observation_compliance_ratio is re-derived over the surviving cycles"
          - "CASCADE HOP 4: because the placement's stage changed, its supervisor_points is re-scored at the REMOVAL_PENDING base of 3 and the UniversitySupervisor.caseload_points is re-derived, which can flip accepting_new_placements to false"
          - "PerformanceAssessment.updated_at refreshed and version incremented by 1"
        note: "Terminal; this is the depth-4 cascade whose origin is an assessment-level action."

concurrency_rules:
  - rule_id: reroute-supersede-stale-request
    parent_entity: PlacementRequest
    write_endpoint: "POST /epp/placement-requests/{request_id}/reroute"
    occ_field: "expected_request_version"
    description: |
      Rerouting a PlacementRequest whose version has advanced since the client
      last read it is rejected. A reroute legitimately supersedes the request's
      current PROPOSED placement with a freshly ranked one, so a reroute that
      carries the current version always succeeds even when an earlier reroute
      already replaced the placement; the only thing that distinguishes a
      well-founded reroute from a lost one is whether the client's view of the
      request is current. The server therefore requires the caller to echo the
      version it observed, and rejects a stale echo with a precondition failure
      instead of silently discarding whichever supersede arrived later.
    error_id: ERR_STALE_REQUEST_VERSION
    http_status: 412

calculations:
  - name: candidate_readiness_score
    trigger: |
      Recomputed whenever a ReadinessItem of the candidate is verified, rejected or lazily expired,
      whenever POST /epp/candidates/{candidate_id}/readiness-evaluate is called, at placement
      confirmation (STRICT), and at placement completion and licensure recommendation (ROLLING).
    algorithm: threshold
    formula: |
      # every item considered must belong to the candidate and be inside the variant's inclusion set
      exam_points = 40 if EXISTS item WHERE item_type == CONTENT_EXAM
                              AND item IN inclusion_set
                              AND item.exam_score >= EXAM_PASSING_SCORE   # 240
                    else 0
      clearance_points = 35 if EXISTS item WHERE item_type == BACKGROUND_CLEARANCE
                                  AND item IN inclusion_set
                         else 0
      coursework_credits = SUM(item.credits) over items WHERE item_type == COURSEWORK_BLOCK
                                                         AND item IN inclusion_set
      coursework_points = min(25, round_half_up(coursework_credits * 25 / REQUIRED_COURSEWORK_CREDITS))   # /30
      readiness_score = exam_points + clearance_points + coursework_points     # integer 0..100
      readiness_status = READY if (readiness_score >= READY_THRESHOLD          # 90
                                  AND clearance_points == 35)
                        else (LAPSED if the candidate was previously READY else NOT_READY)
      readiness_variant_used = the variant that produced the stored readiness_status
      # worked literals (round_half_up on the coursework term):
      #   27 credits -> round_half_up(22.5) = 23 ; 18 credits -> 15 ; 30 credits -> 25 ; 12 credits -> 10
      #   exam 245 + clearance + 18 credits -> 40 + 35 + 15 = 90  -> READY  (exact threshold)
      #   exam 245 + clearance + 12 credits -> 40 + 35 + 10 = 85  -> NOT_READY
      #   exam 238 + clearance + 27 credits ->  0 + 35 + 23 = 58  -> NOT_READY
      #   exam 245 + 27 credits, no clearance -> 40 +  0 + 23 = 63 -> NOT_READY
    input_set: |
      ReadinessItem rows of the candidate; only rows whose status is inside the variant's inclusion set
      count. REJECTED and PENDING_VERIFICATION rows never count under either variant.
    constants:
      EXAM_PASSING_SCORE: 240
      REQUIRED_COURSEWORK_CREDITS: 30
      READY_THRESHOLD: 90
      EXAM_WEIGHT_POINTS: 40
      CLEARANCE_WEIGHT_POINTS: 35
      COURSEWORK_WEIGHT_POINTS: 25
    precision: "integer points, round_half_up applied to the coursework term BEFORE the min(25, ..) clamp and before summation"
    variants:
      - name: STRICT
        when: |
          The default variant: any readiness read, POST /epp/candidates/{candidate_id}/readiness-evaluate
          with variant omitted or STRICT, and every placement confirmation gate.
        difference: |
          inclusion_set = items WHERE status == VERIFIED AND (expires_on is null OR expires_on >= clock_date).
          An expiry date is inclusive: an item is valid THROUGH expires_on and is lazily transitioned to
          EXPIRED only once the logical clock date is strictly past it, after which it contributes 0 points.
      - name: ROLLING
        when: |
          Applied at POST /epp/placements/{placement_id}/complete, at
          POST /epp/candidates/{candidate_id}/licensure-recommendation, and when
          readiness-evaluate is called with variant=ROLLING.
        difference: |
          inclusion_set = items WHERE status IN {VERIFIED, EXPIRED}
          AND (status == VERIFIED OR expires_on > the start_date of the candidate's most recent
          Placement in {ACTIVE, REMOVAL_PENDING, REMOVED, COMPLETED}). A credential that was valid on
          the day clinical practice began keeps counting through the term, so the same rows can yield a
          different score than STRICT on identical data.
          Worked divergence: exam 245 expiring 2026-10-01, clearance valid, 18 credits, placement
          start_date 2026-09-01, clock 2026-12-08 -> STRICT = 0 + 35 + 15 = 50 (LAPSED),
          ROLLING = 40 + 35 + 15 = 90 (READY); delta = 40 points.

  - name: commute_and_match_ranking
    trigger: "POST /epp/placement-requests/{request_id}/route and POST /epp/placement-requests/{request_id}/reroute"
    algorithm: ranked_selection
    formula: |
      # step 1 - distance metric (Manhattan grid, integer miles, no rounding needed)
      commute_miles(candidate, teacher) = abs(teacher.site_grid_x - candidate.home_grid_x)
                                       + abs(teacher.site_grid_y - candidate.home_grid_y)
      supervisor_miles(supervisor, teacher) = abs(teacher.site_grid_x - supervisor.home_grid_x)
                                            + abs(teacher.site_grid_y - supervisor.home_grid_y)

      # step 2 - eligibility filter (a candidate row must satisfy EVERY clause)
      eligible_teachers = CooperatingTeacher rows WHERE
            qualification_status == QUALIFIED (after the lazy training-expiry check)
        AND subject_endorsement == request.requested_subject
        AND grade_band == request.requested_grade_band
        AND district_id == request.preferred_district_id
        AND id NOT IN request.excluded_cooperating_teacher_ids
        AND active_placement_count < max_concurrent_candidates
        AND commute_miles(candidate, teacher) <= min(request.max_commute_miles, MAX_PROGRAM_COMMUTE_MILES)
        AND the teacher's district has a PartnershipAgreement with status == ACTIVE whose
            [window_start, window_end] covers request.term_start_date and request.term_end_date,
            whose allowed_subjects contains requested_subject, whose allowed_grade_bands contains
            requested_grade_band, and whose seats_committed < placement_cap
        AND no Placement of this teacher in {PROPOSED, ACTIVE, REMOVAL_PENDING, COMPLETED} overlaps the
            RAW (unpadded) interval [request.term_start_date, request.term_end_date] — routing deliberately
            tolerates back-to-back terms; the TURNAROUND_BUFFER_DAYS recovery padding is applied only at
            confirmation time by calculations.teacher_turnaround_window

      eligible_supervisors = UniversitySupervisor rows WHERE
            accepting_new_placements == true
        AND primary_subject == request.requested_subject
        AND covered_grade_bands contains request.requested_grade_band
        AND supervisor_miles(supervisor, teacher) <= supervisor.max_travel_miles
        AND caseload_points + placement_points(PROPOSED, supervisor_miles) <= max_caseload_points

      # step 3 - ranking: build every (teacher, supervisor) pair that survives step 2 and order by
      #   1. commute_miles ASC
      #   2. teacher.years_experience DESC
      #   3. supervisor_miles ASC
      #   4. teacher.created_at ASC        # deterministic fallback; id is NEVER a decision input
      #   5. supervisor.created_at ASC
      # step 4 - the first pair wins. If eligible pairs is empty, no Placement is created and the
      #   request stays in its current status; the endpoint returns ERR_NO_ELIGIBLE_PLACEMENT (409).
    input_set: |
      All CooperatingTeacher rows of the requested district and all UniversitySupervisor rows, narrowed by
      the eligibility filter above. Placements in VOIDED or REMOVED never block a teacher.
    constants:
      MAX_PROGRAM_COMMUTE_MILES: 45
    precision: "integer miles; no rounding — Manhattan distance over integer grid coordinates"

  - name: supervisor_caseload_points
    trigger: |
      Recomputed on every placement creation, confirmation, reroute-void, removal request, removal
      decision, completion, and on GET /epp/university-supervisors/{supervisor_id}.
    algorithm: aggregation
    formula: |
      placement_points(placement) = STAGE_BASE_POINTS[placement.placement_status]
                                  + distance_surcharge(supervisor_miles)
      distance_surcharge(m) = 0 if m <= 15 ; 1 if 16 <= m <= 40 ; 2 if m > 40
      caseload_points = SUM(placement_points(p)) over Placement rows WHERE p.supervisor_id == this.id
                        AND p.placement_status IN {PROPOSED, ACTIVE, REMOVAL_PENDING}
      max_caseload_points = max_caseload_points_override
                            if max_caseload_points_override is not null
                            else CASELOAD_CAP_BY_EMPLOYMENT[employment_type]
      accepting_new_placements = (caseload_points < max_caseload_points)
      # worked literals for a supervisor at (0,0) and a teacher site at (10,10) -> 20 miles -> surcharge 1:
      #   one PROPOSED placement -> 1 + 1 = 2 points
      #   after confirmation      -> 2 + 1 = 3 points
      #   after a removal request -> 3 + 1 = 4 points
      #   after REMOVED / VOIDED / COMPLETED -> that placement contributes 0
    input_set: "Placement rows of this supervisor in PROPOSED, ACTIVE or REMOVAL_PENDING; every other placement_status contributes 0."
    constants:
      STAGE_BASE_POINTS: "{PROPOSED: 1, ACTIVE: 2, REMOVAL_PENDING: 3}"
      CASELOAD_CAP_BY_EMPLOYMENT: "{FULL_TIME: 24, ADJUNCT: 10}"
      NEAR_MILES_MAX: 15
      MID_MILES_MAX: 40
    precision: "integer points; the surcharge is selected from integer Manhattan miles with no rounding"

  - name: agreement_ledger
    trigger: |
      Recomputed on every placement creation, confirmation, reroute-void, removal decision, completion,
      stipend transition, agreement suspension/reactivation/termination, and on
      GET /epp/partnership-agreements/{agreement_id}.
    algorithm: aggregation
    formula: |
      seats_reserved = COUNT(Placement WHERE agreement_id == this.id AND placement_status == PROPOSED)
      seats_committed = COUNT(Placement WHERE agreement_id == this.id
                              AND placement_status IN {ACTIVE, REMOVAL_PENDING, COMPLETED})
      stipend_committed_cents = SUM(Placement.stipend_gross_cents) over Placement rows
                                WHERE agreement_id == this.id
                                AND stipend_status IN {ACCRUED, APPROVED, PAID}
      capacity_posture = CAP_REACHED if seats_committed >= placement_cap else OPEN
      # conserved invariants (the compensating pair the difficulty design probes):
      #   seats_reserved + seats_committed never counts a VOIDED, REMOVED or CLAWED_BACK placement
      #   a reroute voids one PROPOSED placement and creates another, so seats_reserved is unchanged
      #   stipend_committed_cents returns to its pre-confirmation value after a VOIDED or CLAWED_BACK stipend
    input_set: "Placement rows whose agreement_id is this agreement; VOIDED and REMOVED placements are excluded from both seat counters, and VOIDED/CLAWED_BACK stipends are excluded from the money counter."
    constants:
      SEAT_COMMITTED_STATES: "{ACTIVE, REMOVAL_PENDING, COMPLETED}"
      MONEY_COMMITTED_STATES: "{ACCRUED, APPROVED, PAID}"
    precision: "integer seats; integer cents — no rounding is performed by the ledger, it only sums already-rounded per-placement amounts"

  - name: teacher_turnaround_window
    trigger: "POST /epp/placements/{placement_id}/confirm only — routing and rerouting screen teachers on the RAW term interval, so a back-to-back term routes cleanly and is caught here"
    algorithm: interval_merge
    formula: |
      # each existing placement of the teacher expands into a CLOSED-CLOSED blocked interval
      blocked(p) = [p.start_date - TURNAROUND_BUFFER_DAYS, p.end_date + TURNAROUND_BUFFER_DAYS]
      candidate_interval = [request.term_start_date, request.term_end_date]      # closed-closed
      conflict = EXISTS p WHERE p.cooperating_teacher_id == teacher.id
                 AND p.placement_status IN {PROPOSED, ACTIVE, REMOVAL_PENDING, COMPLETED}
                 AND candidate_interval overlaps blocked(p)
      # overlap test for closed-closed intervals: a.start <= b.end AND b.start <= a.end
      # worked literals with TURNAROUND_BUFFER_DAYS = 14 and an existing placement 2026-09-01..2026-10-26:
      #   blocked = [2026-08-18, 2026-11-09]
      #   a new term starting 2026-11-09 CONFLICTS (touching the closed upper bound is a conflict)
      #   a new term starting 2026-11-10 is CLEAR (the first day past the buffer)
      # TWO-PHASE SEMANTICS (deliberate): the routing filter compares RAW intervals, so the 2026-11-09
      # term above is routed successfully and only rejected at confirmation with
      # ERR_TEACHER_TURNAROUND_CONFLICT. Contrast ObservationCycle windows, which are HALF-OPEN and
      # carry no buffer, so there adjacency (new.window_start == other.window_end) is legal.
    input_set: "Placement rows of the teacher in PROPOSED, ACTIVE, REMOVAL_PENDING or COMPLETED; VOIDED and REMOVED placements free the window immediately."
    constants:
      TURNAROUND_BUFFER_DAYS: 14
    precision: "whole days; both the candidate interval and every blocked interval are closed on both ends"

  - name: stipend_settlement_cents
    trigger: "POST /epp/placements/{placement_id}/confirm (PROVISIONAL), POST /epp/placements/{placement_id}/complete and the UPHELD branch of POST /epp/placements/{placement_id}/removal-decision (FINAL)"
    algorithm: aggregation
    formula: |
      longevity_pct = 0.00 if teacher.consecutive_terms_hosted == 0
                      0.05 if 1 <= teacher.consecutive_terms_hosted <= 2
                      0.10 if teacher.consecutive_terms_hosted >= 3
      # ROUNDING ORDER IS PINNED: the weekly rate is rounded to whole cents BEFORE multiplication.
      stipend_weekly_cents = round_half_up(agreement.stipend_rate_cents_per_week * (1 + longevity_pct))
      stipend_gross_cents  = stipend_weekly_cents * weeks_credited + premium
      # worked literals with stipend_rate_cents_per_week = 12345 and consecutive_terms_hosted = 2:
      #   12345 * 1.05 = 12962.25 -> round_half_up -> stipend_weekly_cents = 12962
      #   14 weeks -> 12962 * 14 = 181468   (rounding the product instead would give 181472 - wrong)
      #    8 weeks -> 12962 *  8 = 103696
      #    4 weeks -> 12962 *  4 =  51848
      #   consecutive_terms_hosted = 0 -> 12345/wk ; >= 3 -> round_half_up(13579.5) = 13580/wk
    input_set: "the single Placement being settled, its CooperatingTeacher (for longevity) and its PartnershipAgreement (for the weekly rate frozen at confirmation time)"
    constants:
      LONGEVITY_BONUS_PCT: "{0 terms: 0.00, 1-2 terms: 0.05, 3+ terms: 0.10}"
      COMPLETION_PREMIUM_CENTS: 2500
      MIN_CREDITED_WEEKS: 4
    precision: "integer cents; round_half_up applied to the WEEKLY rate before multiplying by weeks_credited, never to the product"
    variants:
      - name: PROVISIONAL
        when: "at POST /epp/placements/{placement_id}/confirm, while the placement is ACTIVE or REMOVAL_PENDING"
        difference: |
          weeks_credited = weeks_scheduled (the full planned term) and premium = 0.
          Worked: 12962 * 14 + 0 = 181468.
      - name: FINAL
        when: "at POST /epp/placements/{placement_id}/complete and on an UPHELD removal decision"
        difference: |
          weeks_credited = max(MIN_CREDITED_WEEKS,
                               min(weeks_scheduled, floor((settlement_date - start_date).days / 7)))
          premium = COMPLETION_PREMIUM_CENTS if placement_status == COMPLETED
                    AND observation_compliance_ratio == 1.0 else 0.
          Worked (start_date 2026-09-01, weeks_scheduled 14):
            complete on 2026-12-08 -> 98 days -> 14 weeks -> 12962*14 + 2500 = 183968
            complete an 8-week term on 2026-10-27 -> 56 days -> 8 weeks -> 103696 + 2500 = 106196
            complete an 8-week term on 2026-10-26 -> 55 days -> 7 weeks -> 12962*7 + 2500 = 93234
            removal upheld on 2026-10-01 -> 30 days -> floor 4 -> 51848 (no premium)
            removal upheld on 2026-09-15 -> 14 days -> floor 2 -> raised to MIN_CREDITED_WEEKS 4 -> 51848
          On a COOPERATING_TEACHER_MISCONDUCT removal the FINAL amount is computed and then forced to 0
          by the stipend VOIDED / CLAWED_BACK transition.

  - name: travel_reimbursement_cents
    trigger: "POST /epp/placements/{placement_id}/confirm, POST /epp/placements/{placement_id}/complete and the UPHELD branch of POST /epp/placements/{placement_id}/removal-decision"
    algorithm: tiered_pricing
    formula: |
      if the teacher's District.travel_reimbursement_enabled is false: travel_reimbursement_cents = 0
      billable_miles = placement.commute_miles * 2 * WEEKLY_TRIPS * weeks_credited
      mileage_subtotal_cents = billable_miles * MILEAGE_RATE_CENTS_PER_MILE
      # TIER ORDER IS PINNED: the tier is selected from the PRE-ALLOWANCE subtotal and is never
      # re-selected after the allowance is added.
      allowance_pct = 0.08 if mileage_subtotal_cents <= 50000
                      0.05 if 50000 < mileage_subtotal_cents <= 150000
                      0.03 if mileage_subtotal_cents > 150000
      admin_allowance_cents = round_half_up(mileage_subtotal_cents * allowance_pct)
      travel_reimbursement_cents = mileage_subtotal_cents + admin_allowance_cents
      # worked literals with commute_miles = 14, WEEKLY_TRIPS = 5, rate 67:
      #   14 weeks -> 1960 mi -> 131320 -> 5% -> 6566 -> 137886
      #    8 weeks -> 1120 mi ->  75040 -> 5% -> 3752 ->  78792
      #    4 weeks ->  560 mi ->  37520 -> 8% -> 3002 ->  40522   (round_half_up(3001.6))
      #   the 14-week subtotal 131320 sits in the middle tier; adding the allowance pushes the total to
      #   137886, still inside the middle tier, so no re-tiering ever occurs
      #   TIER-PINNING PROBE (commute_miles 37, weeks_credited 2): 37 * 2 * 5 * 2 = 740 mi -> 49580,
      #   which is <= 50000 -> tier 1 -> 8% -> round_half_up(3966.4) = 3966 -> total 53546.
      #   Re-selecting the tier from the 53546 total would wrongly apply 5% -> 2479 -> 52059.
    input_set: "the single Placement being settled, its CooperatingTeacher's District (for the travel_reimbursement_enabled flag) and the weeks_credited produced by calculations.stipend_settlement_cents"
    constants:
      MILEAGE_RATE_CENTS_PER_MILE: 67
      WEEKLY_TRIPS: 5
      TIER_1_SUBTOTAL_MAX_CENTS: 50000
      TIER_2_SUBTOTAL_MAX_CENTS: 150000
      TIER_1_PCT: 0.08
      TIER_2_PCT: 0.05
      TIER_3_PCT: 0.03
    precision: "integer cents; round_half_up applied only to the admin allowance term, after the tier has been selected from the pre-allowance subtotal"

  - name: observation_compliance_ratio
    trigger: |
      Recomputed on every ObservationCycle completion, lazy MISSED transition, reschedule and
      CANCELLED_HOLD cascade, and read by the assessment-submission gate and the completion gate.
    algorithm: aggregation
    formula: |
      counted_cycles   = COUNT(ObservationCycle WHERE placement_id == this.id
                               AND status IN {SCHEDULED, COMPLETED, MISSED})
      completed_cycles = COUNT(ObservationCycle WHERE placement_id == this.id AND status == COMPLETED)
      denominator = max(MIN_REQUIRED_CYCLES, counted_cycles)
      observation_compliance_ratio = round_half_up(completed_cycles / denominator, 4)
      # CANCELLED_HOLD cycles are excluded from BOTH the numerator and the denominator
      # worked literals with MIN_REQUIRED_CYCLES = 3:
      #   3 counted, 3 completed -> 1.0
      #   3 counted, 2 completed -> 0.6667
      #   3 counted, 1 completed -> 0.3333   (below the 0.5 assessment-submission gate)
      #   4 counted (one MISSED), 3 completed -> 0.75
      #   2 counted, 2 completed -> 2/3 -> 0.6667 (the floor of 3 keeps a short schedule from reaching 1.0)
    input_set: "ObservationCycle rows of this placement in SCHEDULED, COMPLETED or MISSED; CANCELLED_HOLD rows are excluded entirely."
    constants:
      MIN_REQUIRED_CYCLES: 3
      ASSESSMENT_SUBMIT_MIN_RATIO: 0.5
      COMPLETION_MIN_RATIO: 1.0
    precision: "4 decimal places, round_half_up"

  - name: assessment_total_score
    trigger: "POST /epp/performance-assessments/{assessment_id}/score with decision=SCORE"
    algorithm: weighted_scoring
    formula: |
      # ROUNDING ORDER IS PINNED: each dimension is rounded to whole points BEFORE the sum.
      dimension_points(score, weight) = round_half_up(score * weight * SCALE)      # SCALE = 20
      total_score = dimension_points(task_planning,        0.30)
                  + dimension_points(task_instruction,     0.35)
                  + dimension_points(task_assessment,      0.20)
                  + dimension_points(task_professionalism, 0.15)
      decision = PASSED if total_score >= CUT_SCORE else (RETURNED if attempt_no < MAX_ASSESSMENT_ATTEMPTS else FAILED)
      # worked literals (each raw score is a multiple of 0.5 in 1.0..5.0):
      #   (3.5, 3.5, 3.5, 3.5) -> 21 + 25 + 14 + 11 = 71 -> PASSED
      #        (rounding the weighted sum instead would give 70 - the boundary this pinning protects)
      #   (4.0, 3.5, 3.0, 3.0) -> 24 + 25 + 12 +  9 = 70 -> PASSED  (exact cut score)
      #   (4.0, 3.5, 3.0, 2.5) -> 24 + 25 + 12 +  8 = 69 -> below the cut
      #   (3.0, 3.0, 3.0, 3.0) -> 18 + 21 + 12 +  9 = 60 -> below the cut
      #   (5.0, 5.0, 5.0, 5.0) -> 30 + 35 + 20 + 15 = 100
    input_set: "the four rubric dimension scores submitted with the scoring call; weights are fixed program-wide and are not stored per assessment"
    constants:
      SCALE: 20
      WEIGHT_TASK_PLANNING: 0.30
      WEIGHT_INSTRUCTION: 0.35
      WEIGHT_ASSESSMENT: 0.20
      WEIGHT_PROFESSIONALISM: 0.15
      CUT_SCORE: 70
      MAX_ASSESSMENT_ATTEMPTS: 2
    precision: "integer points; round_half_up applied per dimension BEFORE summation, never to the weighted sum"

  - name: state_report_timeliness
    trigger: "POST /epp/placements/{placement_id}/complete sets the deadline; POST /epp/candidates/{candidate_id}/state-report classifies the submission"
    algorithm: threshold
    formula: |
      state_report_deadline = request.term_end_date + STATE_REPORT_GRACE_DAYS          # whole days
      report_status = REPORTED_ON_TIME if clock_date <= state_report_deadline          # closed bound
                      else REPORTED_LATE
      # worked literals: a 14-week term starting 2026-09-01 ends 2026-12-07
      #   deadline = 2026-12-07 + 45 days = 2027-01-21
      #   a report filed on 2027-01-21 -> REPORTED_ON_TIME (the deadline day itself still counts)
      #   a report filed on 2027-01-22 -> REPORTED_LATE
    input_set: "the Candidate's own state_report_deadline, itself derived from the term_end_date of the PlacementRequest that reached CLOSED"
    constants:
      STATE_REPORT_GRACE_DAYS: 45
    precision: "whole days; the deadline comparison is inclusive of the deadline date"

validations:
  - priority: 1
    category: auth
    check: "Both X-User-ID and X-User-Role headers are present and non-empty (a header sent as an empty string counts as absent)."
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "X-User-Role is one of the seven declared roles in §1.7; any other value is treated as an unauthenticated principal, not as a permission failure."
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 3
    category: auth
    check: "The role in X-User-Role appears in the target endpoint's roles list."
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"
  - priority: 4
    category: auth
    check: "For the entity-backed roles, the acting X-User-ID owns the resource: CandidateUser's id equals the owning placement's candidate_id on assessment submission, and UniversitySupervisorUser's id equals the cycle's supervisor_id on observation completion."
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "POST /epp/performance-assessments/{assessment_id}/submit, POST /epp/observation-cycles/{cycle_id}/complete"
  - priority: 5
    category: existence
    check: "Every id in the path exists, validated left to right; the first missing resource decides the error code, which is that entity's own 404 from §1.6 (ERR_CANDIDATE_NOT_FOUND, ERR_READINESS_ITEM_NOT_FOUND, ERR_DISTRICT_NOT_FOUND, ERR_AGREEMENT_NOT_FOUND, ERR_TEACHER_NOT_FOUND, ERR_SUPERVISOR_NOT_FOUND, ERR_REQUEST_NOT_FOUND, ERR_PLACEMENT_NOT_FOUND, ERR_CYCLE_NOT_FOUND, ERR_ASSESSMENT_NOT_FOUND)."
    error_id: ERR_<ENTITY>_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with a path parameter"
  - priority: 6
    category: business_constraint
    check: "Request body shape: every required field is present, every enum value is a declared member, integers are inside their declared ranges, monetary and score fields are numbers rather than strings, and every date/instant is a valid ISO-8601 value (dates as YYYY-MM-DD, instants as YYYY-MM-DDTHH:MM:SSZ)."
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all endpoints with a request body"
  - priority: 7
    category: existence
    check: "Every foreign key supplied in the request body references an existing row (candidate_id, district_id, placement_id, supervisor_id, ...), reported with that entity's own 404 code from §1.6."
    error_id: ERR_<ENTITY>_NOT_FOUND
    http_status: 404
    applies_to: "POST /epp/readiness-items, POST /epp/partnership-agreements, POST /epp/cooperating-teachers, POST /epp/placement-requests, POST /epp/observation-cycles, POST /epp/performance-assessments"
  - priority: 8
    category: business_temporal
    check: "Interval inputs are well formed: PartnershipAgreement window_start < window_end, ObservationCycle window_start < window_end, PerformanceAssessment window_opens_at < window_closes_at, and ReadinessItem expires_on > issued_on when both are given."
    error_id: ERR_INVALID_WINDOW
    http_status: 422
    applies_to: "POST /epp/partnership-agreements, POST /epp/observation-cycles, POST /epp/observation-cycles/{cycle_id}/reschedule, POST /epp/performance-assessments, POST /epp/readiness-items"
  - priority: 9
    category: business_referential
    check: "candidate_code is unique across all Candidate rows."
    error_id: ERR_CANDIDATE_CODE_TAKEN
    http_status: 409
    applies_to: "POST /epp/candidates"
  - priority: 10
    category: business_referential
    check: "district_code is unique across all District rows."
    error_id: ERR_DISTRICT_CODE_TAKEN
    http_status: 409
    applies_to: "POST /epp/districts"
  - priority: 11
    category: business_referential
    check: "A Placement has at most one PerformanceAssessment."
    error_id: ERR_ASSESSMENT_ALREADY_EXISTS
    http_status: 409
    applies_to: "POST /epp/performance-assessments"
  - priority: 12
    category: state
    check: "expected_request_version equals the PlacementRequest's current version (see concurrency_rules.reroute-supersede-stale-request)."
    error_id: ERR_STALE_REQUEST_VERSION
    http_status: 412
    applies_to: "POST /epp/placement-requests/{request_id}/reroute"
  - priority: 13
    category: state
    check: "The PartnershipAgreement is in a status that permits the requested lifecycle action (DRAFT for activate, ACTIVE for suspend, SUSPENDED for reactivate, ACTIVE or SUSPENDED for terminate)."
    error_id: ERR_AGREEMENT_STATE_INVALID
    http_status: 409
    applies_to: "POST /epp/partnership-agreements/{agreement_id}/activate, /suspend, /reactivate, /terminate"
  - priority: 14
    category: state
    check: "The PartnershipAgreement backing the placement has not passed window_end; a lazily expired agreement is reported as expired rather than as an inactive one."
    error_id: ERR_AGREEMENT_EXPIRED
    http_status: 409
    applies_to: "POST /epp/placement-requests/{request_id}/route, POST /epp/placements/{placement_id}/confirm"
  - priority: 15
    category: state
    check: "The PartnershipAgreement backing the placement is ACTIVE when the placement is confirmed and whenever new clinical work is scheduled against an already-ACTIVE placement (a new ObservationCycle or PerformanceAssessment); a SUSPENDED or TERMINATED agreement leaves running placements in place but freezes further scheduling under it."
    error_id: ERR_AGREEMENT_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /epp/placements/{placement_id}/confirm, POST /epp/observation-cycles, POST /epp/performance-assessments"
  - priority: 16
    category: state
    check: "The PlacementRequest is in the status the action requires (SUBMITTED for route, ROUTED for reroute)."
    error_id: ERR_REQUEST_STATE_INVALID
    http_status: 409
    applies_to: "POST /epp/placement-requests/{request_id}/route, POST /epp/placement-requests/{request_id}/reroute"
  - priority: 17
    category: state
    check: "The Placement's placement_status permits the action (PROPOSED for confirm, ACTIVE for removal-request and complete, REMOVAL_PENDING for removal-decision) and the placement owning an assessment is ACTIVE when that assessment is submitted."
    error_id: ERR_PLACEMENT_STATE_INVALID
    http_status: 409
    applies_to: "POST /epp/placements/{placement_id}/confirm, /removal-request, /removal-decision, /complete, POST /epp/performance-assessments/{assessment_id}/submit"
  - priority: 18
    category: state
    check: "The requested stipend_status transition is declared in the Placement money dimension (ACCRUED->APPROVED, APPROVED->PAID, ACCRUED|APPROVED->VOIDED, PAID->CLAWED_BACK)."
    error_id: ERR_STIPEND_STATE_INVALID
    http_status: 409
    applies_to: "POST /epp/placements/{placement_id}/stipend-transition"
  - priority: 19
    category: state
    check: "The ReadinessItem is PENDING_VERIFICATION when a verification decision is recorded."
    error_id: ERR_ITEM_STATE_INVALID
    http_status: 409
    applies_to: "POST /epp/readiness-items/{item_id}/verify"
  - priority: 20
    category: state
    check: "The ObservationCycle is SCHEDULED for a completion and MISSED for a reschedule; a CANCELLED_HOLD cycle admits neither."
    error_id: ERR_CYCLE_STATE_INVALID
    http_status: 409
    applies_to: "POST /epp/observation-cycles/{cycle_id}/complete, POST /epp/observation-cycles/{cycle_id}/reschedule"
  - priority: 21
    category: state
    check: "The PerformanceAssessment is OPEN or RETURNED for a submission and SUBMITTED for a scoring decision."
    error_id: ERR_ASSESSMENT_STATE_INVALID
    http_status: 409
    applies_to: "POST /epp/performance-assessments/{assessment_id}/submit, POST /epp/performance-assessments/{assessment_id}/score"
  - priority: 22
    category: state
    check: "The CooperatingTeacher's training has not lapsed: training_expires_on is later than the current logical clock date, otherwise the teacher is lazily moved to TRAINING_EXPIRED and reported as expired."
    error_id: ERR_TEACHER_TRAINING_EXPIRED
    http_status: 409
    applies_to: "POST /epp/placements/{placement_id}/confirm"
  - priority: 23
    category: business_safety
    check: "Segregation of duties: the acting X-User-ID differs from removal_requested_by_user_id on a removal decision, and from Candidate.recommended_by_user_id on a state report."
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /epp/placements/{placement_id}/removal-decision, POST /epp/candidates/{candidate_id}/state-report"
  - priority: 24
    category: business_safety
    check: "When the target teacher's District.requires_district_fingerprint is true, the candidate holds a VERIFIED unexpired BACKGROUND_CLEARANCE item whose clearance_scope is DISTRICT_FINGERPRINT. This clearance sub-gate is evaluated BEFORE the aggregate readiness score, so a candidate who fails both gets the fingerprint error."
    error_id: ERR_FINGERPRINT_CLEARANCE_REQUIRED
    http_status: 422
    applies_to: "POST /epp/placements/{placement_id}/confirm"
  - priority: 25
    category: business_safety
    check: "The Candidate's STRICT readiness re-evaluation leaves readiness_status == READY."
    error_id: ERR_CANDIDATE_NOT_READY
    http_status: 422
    applies_to: "POST /epp/placement-requests/{request_id}/route, POST /epp/placements/{placement_id}/confirm"
  - priority: 26
    category: business_safety
    check: "The CooperatingTeacher's qualification_status is QUALIFIED (not PENDING_TRAINING and not DISQUALIFIED) at confirmation time."
    error_id: ERR_TEACHER_NOT_QUALIFIED
    http_status: 422
    applies_to: "POST /epp/placements/{placement_id}/confirm"
  - priority: 27
    category: business_safety
    check: "A stipend may not be approved or paid for a CooperatingTeacher whose qualification_status is DISQUALIFIED."
    error_id: ERR_TEACHER_DISQUALIFIED
    http_status: 422
    applies_to: "POST /epp/placements/{placement_id}/stipend-transition"
  - priority: 28
    category: business_constraint
    check: "max_commute_miles on a placement request does not exceed MAX_PROGRAM_COMMUTE_MILES (45)."
    error_id: ERR_COMMUTE_LIMIT_EXCEEDED
    http_status: 422
    applies_to: "POST /epp/placement-requests"
  - priority: 29
    category: business_constraint
    check: "The requested subject and grade band appear in the ACTIVE agreement's allowed_subjects and allowed_grade_bands."
    error_id: ERR_SUBJECT_BAND_NOT_ALLOWED
    http_status: 422
    applies_to: "POST /epp/placement-requests/{request_id}/route"
  - priority: 30
    category: business_temporal
    check: "The request's [term_start_date, term_end_date] interval lies inside the agreement's [window_start, window_end] interval."
    error_id: ERR_TERM_OUTSIDE_AGREEMENT_WINDOW
    http_status: 422
    applies_to: "POST /epp/placement-requests/{request_id}/route"
  - priority: 31
    category: business_temporal
    check: "The teacher's turnaround window (calculations.teacher_turnaround_window) is clear of the placement's term at confirmation time, even if it was clear when the placement was routed."
    error_id: ERR_TEACHER_TURNAROUND_CONFLICT
    http_status: 409
    applies_to: "POST /epp/placements/{placement_id}/confirm"
  - priority: 32
    category: business_temporal
    check: "observed_at falls inside the cycle's half-open window [window_start, window_end); an observation exactly at window_end is late."
    error_id: ERR_OBSERVATION_OUTSIDE_WINDOW
    http_status: 422
    applies_to: "POST /epp/observation-cycles/{cycle_id}/complete"
  - priority: 33
    category: business_temporal
    check: "A rescheduled window starts no earlier than the current logical clock, ends no later than the placement's end_date, and does not overlap another SCHEDULED or COMPLETED cycle of the same placement."
    error_id: ERR_CYCLE_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /epp/observation-cycles/{cycle_id}/reschedule"
  - priority: 34
    category: business_temporal
    check: "The submission instant is inside the assessment's closed-closed window [window_opens_at, window_closes_at], including any RESUBMISSION_GRACE_DAYS extension."
    error_id: ERR_SUBMISSION_WINDOW_CLOSED
    http_status: 422
    applies_to: "POST /epp/performance-assessments/{assessment_id}/submit"
  - priority: 35
    category: business_constraint
    check: "calculations.observation_compliance_ratio for the owning placement is at least ASSESSMENT_SUBMIT_MIN_RATIO (0.5) at submission time."
    error_id: ERR_OBSERVATION_COMPLIANCE_LOW
    http_status: 422
    applies_to: "POST /epp/performance-assessments/{assessment_id}/submit"
  - priority: 36
    category: business_constraint
    check: "reroute_count is below MAX_REROUTES_PER_REQUEST (2)."
    error_id: ERR_REROUTE_LIMIT_REACHED
    http_status: 409
    applies_to: "POST /epp/placement-requests/{request_id}/reroute"
  - priority: 37
    category: business_constraint
    check: "reschedule_count is below MAX_RESCHEDULES_PER_CYCLE (2)."
    error_id: ERR_RESCHEDULE_LIMIT_REACHED
    http_status: 409
    applies_to: "POST /epp/observation-cycles/{cycle_id}/reschedule"
  - priority: 38
    category: business_constraint
    check: "A RETURN decision requires attempt_no < MAX_ASSESSMENT_ATTEMPTS (2); on the final attempt a sub-cut score must be recorded as FAILED instead of returned."
    error_id: ERR_ASSESSMENT_ATTEMPTS_EXHAUSTED
    http_status: 409
    applies_to: "POST /epp/performance-assessments/{assessment_id}/score"
  - priority: 39
    category: business_constraint
    check: "A SCORE decision carries all four rubric dimension scores as multiples of 0.5 inside 1.0..5.0; a RETURN decision carries returned_feedback and no scores."
    error_id: ERR_SCORE_PAYLOAD_INVALID
    http_status: 422
    applies_to: "POST /epp/performance-assessments/{assessment_id}/score"
  - priority: 40
    category: business_temporal
    check: "The current logical clock date is on or after the placement's end_date before it may be completed."
    error_id: ERR_TERM_NOT_ENDED
    http_status: 422
    applies_to: "POST /epp/placements/{placement_id}/complete"
  - priority: 41
    category: business_constraint
    check: "The placement's observation_compliance_ratio is 1.0 and summative_completed_count is at least 1 at completion time."
    error_id: ERR_COMPLETION_GATE_UNMET
    http_status: 422
    applies_to: "POST /epp/placements/{placement_id}/complete"
  - priority: 42
    category: business_constraint
    check: "The placement's PerformanceAssessment exists and is PASSED at completion time."
    error_id: ERR_ASSESSMENT_NOT_PASSED
    http_status: 422
    applies_to: "POST /epp/placements/{placement_id}/complete"
  - priority: 43
    category: business_referential
    check: "calculations.commute_and_match_ranking yields at least one eligible (teacher, supervisor) pair after the eligibility filter and the request's exclusion list."
    error_id: ERR_NO_ELIGIBLE_PLACEMENT
    http_status: 409
    applies_to: "POST /epp/placement-requests/{request_id}/route, POST /epp/placement-requests/{request_id}/reroute"
  - priority: 44
    category: business_fiscal
    check: "The supervisor's caseload_points, re-scored with this placement at its post-transition stage, stays within max_caseload_points — a placement that fit as PROPOSED may still be rejected at confirmation."
    error_id: ERR_SUPERVISOR_CASELOAD_EXCEEDED
    http_status: 409
    applies_to: "POST /epp/placements/{placement_id}/confirm"
  - priority: 45
    category: business_fiscal
    check: "The agreement's seats_committed is below placement_cap at confirmation time; routing deliberately allows PROPOSED over-subscription, so the hard cap is enforced only here."
    error_id: ERR_PLACEMENT_CAP_EXCEEDED
    http_status: 409
    applies_to: "POST /epp/placements/{placement_id}/confirm"
  - priority: 46
    category: business_fiscal
    check: "Only a FINAL stipend may be paid; a PROVISIONAL accrual must be settled by completion or removal first."
    error_id: ERR_PROVISIONAL_STIPEND_NOT_PAYABLE
    http_status: 422
    applies_to: "POST /epp/placements/{placement_id}/stipend-transition"
  - priority: 47
    category: business_constraint
    check: "A licensure recommendation requires at least one COMPLETED Placement for the candidate and a ROLLING readiness_status of READY."
    error_id: ERR_NO_COMPLETER_RECORD
    http_status: 422
    applies_to: "POST /epp/candidates/{candidate_id}/licensure-recommendation"
  - priority: 48
    category: business_constraint
    check: "A state report requires licensure_status == RECOMMENDED, report_status == UNREPORTED and a non-null state_report_deadline."
    error_id: ERR_LICENSURE_NOT_RECOMMENDED
    http_status: 422
    applies_to: "POST /epp/candidates/{candidate_id}/state-report"

endpoints:
  - method: POST
    path: "/epp/districts"
    description: "Register a partner school district."
    roles: [ProgramAdmin]
    code: 201
    input: [name, district_code, state_code, "requires_district_fingerprint?", "travel_reimbursement_enabled?"]
    output: District
    side_effects: ["creates a District with version 1"]
  - method: GET
    path: "/epp/districts/{district_id}"
    description: "Read one district."
    roles: [ProgramAdmin, PlacementCoordinator, SupervisionLead, CredentialAnalyst]
    code: 200
    input: []
    output: District
    side_effects: []
  - method: GET
    path: "/epp/districts"
    description: "List districts."
    roles: [ProgramAdmin, PlacementCoordinator, SupervisionLead, CredentialAnalyst]
    code: 200
    input: ["state_code?", "requires_district_fingerprint?", "page?", "page_size?"]
    output: District[]
    side_effects: []
  - method: POST
    path: "/epp/candidates"
    description: "Admit a teacher candidate into the educator preparation program."
    roles: [ProgramAdmin]
    code: 201
    input: [candidate_code, full_name, program_track, home_grid_x, home_grid_y]
    output: Candidate
    side_effects: ["creates a Candidate in NOT_READY / PENDING / UNREPORTED with readiness_score 0"]
  - method: GET
    path: "/epp/candidates/{candidate_id}"
    description: "Read one candidate, including the lazily refreshed readiness dimension."
    roles: [ProgramAdmin, PlacementCoordinator, CredentialAnalyst, CandidateUser]
    code: 200
    input: []
    output: Candidate
    side_effects: ["lazily expires any ReadinessItem whose expires_on has passed and re-derives readiness_score / readiness_status under the STRICT variant"]
  - method: GET
    path: "/epp/candidates"
    description: "List candidates."
    roles: [ProgramAdmin, PlacementCoordinator, CredentialAnalyst]
    code: 200
    input: ["readiness_status?", "licensure_status?", "report_status?", "program_track?", "page?", "page_size?"]
    output: Candidate[]
    side_effects: []
  - method: POST
    path: "/epp/candidates/{candidate_id}/readiness-evaluate"
    description: "Re-evaluate the candidate's readiness gate under an explicit variant (STRICT when omitted)."
    roles: [CredentialAnalyst, ProgramAdmin]
    code: 200
    input: ["variant?"]
    output: Candidate
    side_effects:
      - "runs calculations.candidate_readiness_score under the requested variant"
      - "may move readiness_status NOT_READY -> READY, READY -> LAPSED or LAPSED -> READY and records readiness_variant_used"
      - "increments Candidate.version by 1"
  - method: POST
    path: "/epp/candidates/{candidate_id}/licensure-recommendation"
    description: "Recommend or deny the completer for state licensure."
    roles: [ProgramAdmin]
    code: 200
    input: [decision, "denial_reason?"]
    output: Candidate
    side_effects:
      - "re-evaluates readiness under the ROLLING variant"
      - "sets licensure_status to RECOMMENDED or DENIED, records recommended_by_user_id and recommended_at"
      - "increments Candidate.version by 1"
  - method: POST
    path: "/epp/candidates/{candidate_id}/state-report"
    description: "File the completer's state report for a reporting cycle; timeliness is classified against state_report_deadline."
    roles: [ProgramAdmin]
    code: 200
    input: [reporting_cycle]
    output: Candidate
    side_effects:
      - "runs calculations.state_report_timeliness and sets report_status to REPORTED_ON_TIME or REPORTED_LATE"
      - "records reported_by_user_id, reported_at and reporting_cycle"
      - "increments Candidate.version by 1"
  - method: POST
    path: "/epp/readiness-items"
    description: "Attach a readiness artifact (content exam, background clearance or coursework block) to a candidate."
    roles: [CredentialAnalyst]
    code: 201
    input: [candidate_id, item_type, issued_on, "exam_score?", "credits?", "clearance_scope?", "expires_on?"]
    output: ReadinessItem
    side_effects: ["creates a ReadinessItem in PENDING_VERIFICATION; readiness_score is unchanged until verification"]
  - method: GET
    path: "/epp/readiness-items/{item_id}"
    description: "Read one readiness item."
    roles: [CredentialAnalyst, ProgramAdmin, CandidateUser]
    code: 200
    input: []
    output: ReadinessItem
    side_effects: ["lazily transitions VERIFIED -> EXPIRED when expires_on has passed"]
  - method: GET
    path: "/epp/readiness-items"
    description: "List readiness items, filtered by candidate, type or status."
    roles: [CredentialAnalyst, ProgramAdmin]
    code: 200
    input: ["candidate_id?", "item_type?", "status?", "page?", "page_size?"]
    output: ReadinessItem[]
    side_effects: []
  - method: POST
    path: "/epp/readiness-items/{item_id}/verify"
    description: "Record a verification decision on a pending readiness item."
    roles: [CredentialAnalyst]
    code: 200
    input: [decision, "rejection_note?"]
    output: ReadinessItem
    side_effects:
      - "sets status to VERIFIED or REJECTED and records verified_by_user_id and verified_at"
      - "re-derives the owning Candidate's readiness_score and readiness_status under the STRICT variant"
      - "increments ReadinessItem.version by 1"
  - method: POST
    path: "/epp/partnership-agreements"
    description: "Draft a district partnership agreement with a placement cap, weekly stipend rate and allowed subject / grade-band lists."
    roles: [ProgramAdmin]
    code: 201
    input: [district_id, term, window_start, window_end, placement_cap, stipend_rate_cents_per_week, allowed_subjects, allowed_grade_bands]
    output: PartnershipAgreement
    side_effects: ["creates a PartnershipAgreement in DRAFT with all four ledger fields at 0 and capacity_posture OPEN"]
  - method: GET
    path: "/epp/partnership-agreements/{agreement_id}"
    description: "Read one agreement with its live seat and stipend ledger."
    roles: [ProgramAdmin, PlacementCoordinator]
    code: 200
    input: []
    output: PartnershipAgreement
    side_effects:
      - "lazily transitions ACTIVE -> EXPIRED when window_end has passed"
      - "re-derives seats_reserved, seats_committed, stipend_committed_cents and capacity_posture via calculations.agreement_ledger"
  - method: GET
    path: "/epp/partnership-agreements"
    description: "List agreements, filtered by district, status or term."
    roles: [ProgramAdmin, PlacementCoordinator]
    code: 200
    input: ["district_id?", "status?", "term?", "page?", "page_size?"]
    output: PartnershipAgreement[]
    side_effects: []
  - method: POST
    path: "/epp/partnership-agreements/{agreement_id}/activate"
    description: "Activate a drafted agreement so it can back placements."
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: PartnershipAgreement
    side_effects: ["status DRAFT -> ACTIVE", "increments PartnershipAgreement.version by 1"]
  - method: POST
    path: "/epp/partnership-agreements/{agreement_id}/suspend"
    description: "Suspend an active agreement; every PROPOSED placement it backs is voided and its request requeued."
    roles: [ProgramAdmin]
    code: 200
    input: [suspension_reason]
    output: PartnershipAgreement
    side_effects:
      - "status ACTIVE -> SUSPENDED and suspension_reason recorded"
      - "cascade: PROPOSED placements of this agreement -> VOIDED with voided_reason AGREEMENT_SUSPENDED"
      - "cascade: their PlacementRequests ROUTED -> SUBMITTED with the voided teacher added to excluded_cooperating_teacher_ids"
      - "cascade: agreement ledger, CooperatingTeacher.active_placement_count and UniversitySupervisor.caseload_points re-derived"
      - "increments PartnershipAgreement.version by 1"
  - method: POST
    path: "/epp/partnership-agreements/{agreement_id}/reactivate"
    description: "Return a suspended agreement to ACTIVE; voided placements are not restored."
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: PartnershipAgreement
    side_effects: ["status SUSPENDED -> ACTIVE and suspension_reason cleared", "increments PartnershipAgreement.version by 1"]
  - method: POST
    path: "/epp/partnership-agreements/{agreement_id}/terminate"
    description: "Terminate an agreement permanently; the reason is stored in suspension_reason, the field that records why the agreement left ACTIVE."
    roles: [ProgramAdmin]
    code: 200
    input: [suspension_reason]
    output: PartnershipAgreement
    side_effects:
      - "status -> TERMINATED (terminal)"
      - "cascade: PROPOSED placements -> VOIDED and their requests ROUTED -> SUBMITTED; ACTIVE placements are left running to protect candidates mid-term"
      - "increments PartnershipAgreement.version by 1"
  - method: POST
    path: "/epp/cooperating-teachers"
    description: "Register a cooperating teacher at a district school site."
    roles: [SupervisionLead]
    code: 201
    input: [district_id, full_name, site_name, site_grid_x, site_grid_y, subject_endorsement, grade_band, years_experience, "consecutive_terms_hosted?", "max_concurrent_candidates?"]
    output: CooperatingTeacher
    side_effects: ["creates a CooperatingTeacher in PENDING_TRAINING with active_placement_count 0"]
  - method: GET
    path: "/epp/cooperating-teachers/{teacher_id}"
    description: "Read one cooperating teacher."
    roles: [SupervisionLead, PlacementCoordinator, ProgramAdmin]
    code: 200
    input: []
    output: CooperatingTeacher
    side_effects: ["lazily transitions QUALIFIED -> TRAINING_EXPIRED when training_expires_on has passed"]
  - method: GET
    path: "/epp/cooperating-teachers"
    description: "List cooperating teachers, filtered by district, endorsement, band or qualification status."
    roles: [SupervisionLead, PlacementCoordinator, ProgramAdmin]
    code: 200
    input: ["district_id?", "subject_endorsement?", "grade_band?", "qualification_status?", "page?", "page_size?"]
    output: CooperatingTeacher[]
    side_effects: []
  - method: POST
    path: "/epp/cooperating-teachers/{teacher_id}/training-completion"
    description: "Record completion of cooperating-teacher training; qualification runs for TRAINING_VALID_DAYS from that date."
    roles: [SupervisionLead]
    code: 200
    input: [training_completed_on]
    output: CooperatingTeacher
    side_effects:
      - "training_completed_on recorded and training_expires_on computed as training_completed_on + TRAINING_VALID_DAYS (730)"
      - "qualification_status PENDING_TRAINING -> QUALIFIED or TRAINING_EXPIRED -> QUALIFIED"
      - "increments CooperatingTeacher.version by 1"
  - method: POST
    path: "/epp/cooperating-teachers/{teacher_id}/disqualify"
    description: "Disqualify a cooperating teacher permanently."
    roles: [SupervisionLead, ProgramAdmin]
    code: 200
    input: [disqualification_reason]
    output: CooperatingTeacher
    side_effects:
      - "qualification_status -> DISQUALIFIED (terminal) and disqualification_reason recorded"
      - "the teacher is removed from every future routing pool; existing ACTIVE placements are untouched until a removal is decided"
      - "increments CooperatingTeacher.version by 1"
  - method: POST
    path: "/epp/university-supervisors"
    description: "Register a university supervisor with an employment type, subject and travel radius."
    roles: [SupervisionLead]
    code: 201
    input: [full_name, employment_type, primary_subject, covered_grade_bands, home_grid_x, home_grid_y, "max_travel_miles?", "max_caseload_points_override?"]
    output: UniversitySupervisor
    side_effects: ["creates a UniversitySupervisor with caseload_points 0 and max_caseload_points resolved from the override or CASELOAD_CAP_BY_EMPLOYMENT"]
  - method: GET
    path: "/epp/university-supervisors/{supervisor_id}"
    description: "Read one supervisor with a freshly derived caseload."
    roles: [SupervisionLead, PlacementCoordinator, ProgramAdmin, UniversitySupervisorUser]
    code: 200
    input: []
    output: UniversitySupervisor
    side_effects: ["re-derives caseload_points, max_caseload_points and accepting_new_placements via calculations.supervisor_caseload_points"]
  - method: GET
    path: "/epp/university-supervisors"
    description: "List supervisors."
    roles: [SupervisionLead, PlacementCoordinator, ProgramAdmin]
    code: 200
    input: ["primary_subject?", "employment_type?", "accepting_new_placements?", "page?", "page_size?"]
    output: UniversitySupervisor[]
    side_effects: []
  - method: PATCH
    path: "/epp/university-supervisors/{supervisor_id}"
    description: "Adjust a supervisor's caseload override, travel radius or availability flag."
    roles: [SupervisionLead]
    code: 200
    input: ["max_caseload_points_override?", "max_travel_miles?", "accepting_new_placements?"]
    output: UniversitySupervisor
    side_effects:
      - "re-resolves max_caseload_points from the new override (or CASELOAD_CAP_BY_EMPLOYMENT when the override is cleared to null) and re-derives accepting_new_placements"
      - "increments UniversitySupervisor.version by 1"
  - method: POST
    path: "/epp/placement-requests"
    description: "Open a placement request for a candidate in a term, naming the subject, grade band and commute ceiling."
    roles: [PlacementCoordinator]
    code: 201
    input: [candidate_id, term, requested_subject, requested_grade_band, term_start_date, weeks_scheduled, max_commute_miles, "preferred_district_id?"]
    output: PlacementRequest
    side_effects:
      - "creates a PlacementRequest in SUBMITTED with routing_round 0, reroute_count 0 and an empty exclusion list"
      - "computes term_end_date as term_start_date + weeks_scheduled * 7 - 1 day"
  - method: GET
    path: "/epp/placement-requests/{request_id}"
    description: "Read one placement request."
    roles: [PlacementCoordinator, ProgramAdmin, CandidateUser]
    code: 200
    input: []
    output: PlacementRequest
    side_effects: []
  - method: GET
    path: "/epp/placement-requests"
    description: "List placement requests, filtered by candidate, district, status or term."
    roles: [PlacementCoordinator, ProgramAdmin]
    code: 200
    input: ["candidate_id?", "preferred_district_id?", "status?", "term?", "page?", "page_size?"]
    output: PlacementRequest[]
    side_effects: []
  - method: POST
    path: "/epp/placement-requests/{request_id}/route"
    description: "Run the matcher and propose a placement for a SUBMITTED request."
    roles: [PlacementCoordinator]
    code: 201
    input: []
    output: Placement
    side_effects:
      - "runs calculations.commute_and_match_ranking over the eligibility filter, ranking and tie-breaks"
      - "creates a Placement in PROPOSED / NOT_ACCRUED with commute_miles, supervisor_points, subject, grade_band, start_date, end_date and weeks_scheduled copied or derived from the request"
      - "sets replaces_placement_id to the request's most recently REMOVED placement when one exists"
      - "request status SUBMITTED -> ROUTED, routing_round incremented by 1, current_placement_id set"
      - "re-derives the agreement's seats_reserved, the teacher's active_placement_count and the supervisor's caseload_points"
      - "increments PlacementRequest.version by 1"
  - method: POST
    path: "/epp/placement-requests/{request_id}/reroute"
    description: "Supersede a request's PROPOSED placement with a freshly ranked one; requires the caller to echo the request version it observed."
    roles: [PlacementCoordinator]
    code: 201
    input: [expected_request_version, "exclude_current_teacher?"]
    output: Placement
    side_effects:
      - "validates expected_request_version against the request's current version (concurrency_rules.reroute-supersede-stale-request)"
      - "the current PROPOSED placement -> VOIDED with voided_reason REROUTED; the request deliberately stays ROUTED"
      - "appends the voided teacher to excluded_cooperating_teacher_ids when exclude_current_teacher is true"
      - "creates a replacement Placement in PROPOSED / NOT_ACCRUED and repoints current_placement_id at it"
      - "reroute_count incremented by 1; seats_reserved, active_placement_count and caseload_points re-derived so the totals are conserved"
      - "increments PlacementRequest.version by 1"
  - method: GET
    path: "/epp/placements/{placement_id}"
    description: "Read one placement with both of its state dimensions and its money fields."
    roles: [PlacementCoordinator, ProgramAdmin, UniversitySupervisorUser, CandidateUser]
    code: 200
    input: []
    output: Placement
    side_effects: ["re-derives observation_compliance_ratio and supervisor_points"]
  - method: GET
    path: "/epp/placements"
    description: "List placements, filtered by request, candidate, teacher, agreement, supervisor, superseded placement or clinical status."
    roles: [PlacementCoordinator, ProgramAdmin, SupervisionLead]
    code: 200
    input: ["request_id?", "candidate_id?", "cooperating_teacher_id?", "agreement_id?", "supervisor_id?", "replaces_placement_id?", "placement_status?", "stipend_status?", "page?", "page_size?"]
    output: Placement[]
    side_effects: []
  - method: POST
    path: "/epp/placements/{placement_id}/confirm"
    description: "Confirm a proposed placement: re-checks readiness, clearance scope, teacher qualification, turnaround, caseload and the hard placement cap, then accrues the provisional stipend."
    roles: [PlacementCoordinator]
    code: 200
    input: []
    output: Placement
    side_effects:
      - "placement_status PROPOSED -> ACTIVE and stipend_status NOT_ACCRUED -> ACCRUED in the same request"
      - "runs calculations.stipend_settlement_cents under the PROVISIONAL variant and calculations.travel_reimbursement_cents"
      - "re-scores supervisor_points at the ACTIVE base and re-derives UniversitySupervisor.caseload_points"
      - "moves one seat from seats_reserved to seats_committed, raises stipend_committed_cents and re-derives capacity_posture"
      - "the owning PlacementRequest transitions ROUTED -> MATCHED"
      - "increments Placement.version by 1"
  - method: POST
    path: "/epp/placements/{placement_id}/removal-request"
    description: "Open a mid-semester removal case against an active placement."
    roles: [PlacementCoordinator, SupervisionLead]
    code: 200
    input: [removal_reason, removal_narrative]
    output: Placement
    side_effects:
      - "placement_status ACTIVE -> REMOVAL_PENDING; removal_reason, removal_narrative, removal_requested_by_role and removal_requested_by_user_id recorded"
      - "cascade: every SCHEDULED ObservationCycle of this placement -> CANCELLED_HOLD and observation_compliance_ratio re-derived"
      - "cascade: supervisor_points re-scored at the REMOVAL_PENDING base and caseload_points re-derived"
      - "the stipend dimension is left untouched until the decision"
      - "increments Placement.version by 1"
  - method: POST
    path: "/epp/placements/{placement_id}/removal-decision"
    description: "Decide an open removal case; the decider may not be the requester."
    roles: [ProgramAdmin]
    code: 200
    input: [decision, "decision_note?"]
    output: Placement
    side_effects:
      - "decision=DISMISSED: placement_status REMOVAL_PENDING -> ACTIVE, supervisor_points re-scored down, removal_reason and removal_requested_by_user_id retained as the audit trail"
      - "decision=UPHELD: placement_status -> REMOVED, settlement_date set, stipend recomputed under the FINAL variant, agreement seats_committed and stipend_committed_cents re-derived, capacity_posture possibly CAP_REACHED -> OPEN, the request MATCHED -> SUBMITTED with the teacher excluded"
      - "decision=UPHELD with removal_reason COOPERATING_TEACHER_MISCONDUCT: an ACCRUED or APPROVED stipend moves to VOIDED with stipend_gross_cents forced to 0 and the CooperatingTeacher is DISQUALIFIED"
      - "removal_decided_by_user_id recorded"
      - "increments Placement.version by 1"
  - method: POST
    path: "/epp/placements/{placement_id}/complete"
    description: "Close out a finished placement and settle the final stipend and travel reimbursement."
    roles: [PlacementCoordinator]
    code: 200
    input: []
    output: Placement
    side_effects:
      - "placement_status ACTIVE -> COMPLETED; completed_at and settlement_date recorded"
      - "stipend_variant PROVISIONAL -> FINAL with weeks_credited, stipend_weekly_cents, stipend_gross_cents and travel_reimbursement_cents recomputed, including COMPLETION_PREMIUM_CENTS when observation_compliance_ratio is 1.0"
      - "the agreement's stipend_committed_cents re-derived; seats_committed unchanged because COMPLETED stays committed"
      - "the Candidate's readiness re-evaluated under the ROLLING variant"
      - "the owning PlacementRequest transitions MATCHED -> CLOSED and Candidate.state_report_deadline is set to term_end_date + STATE_REPORT_GRACE_DAYS"
      - "increments Placement.version by 1"
  - method: POST
    path: "/epp/placements/{placement_id}/stipend-transition"
    description: "Advance the placement's money dimension (APPROVED, PAID or VOIDED) independently of its clinical dimension."
    roles: [ProgramAdmin]
    code: 200
    input: [target_status, "note?"]
    output: Placement
    side_effects:
      - "stipend_status moves along the declared money-dimension transition"
      - "target_status=VOIDED forces stipend_gross_cents to 0 and lowers the agreement's stipend_committed_cents"
      - "target_status=CLAWED_BACK (only from PAID, and only once the CooperatingTeacher is DISQUALIFIED) forces stipend_gross_cents and weeks_credited to 0 and lowers stipend_committed_cents back to its pre-confirmation value; the clinical dimension is untouched"
      - "increments Placement.version by 1"
  - method: POST
    path: "/epp/observation-cycles"
    description: "Schedule an observation cycle on an active placement; the supervisor is inherited from the placement."
    roles: [SupervisionLead]
    code: 201
    input: [placement_id, sequence_no, cycle_type, window_start, window_end]
    output: ObservationCycle
    side_effects:
      - "creates an ObservationCycle in SCHEDULED with supervisor_id copied from the placement"
      - "re-derives the placement's observation_compliance_ratio (the new cycle enters the denominator)"
  - method: GET
    path: "/epp/observation-cycles/{cycle_id}"
    description: "Read one observation cycle."
    roles: [SupervisionLead, UniversitySupervisorUser, PlacementCoordinator, ProgramAdmin]
    code: 200
    input: []
    output: ObservationCycle
    side_effects: ["lazily transitions SCHEDULED -> MISSED once the logical clock reaches window_end and re-derives the placement's observation_compliance_ratio"]
  - method: GET
    path: "/epp/observation-cycles"
    description: "List observation cycles, filtered by placement, supervisor, type or status."
    roles: [SupervisionLead, UniversitySupervisorUser, PlacementCoordinator, ProgramAdmin]
    code: 200
    input: ["placement_id?", "supervisor_id?", "cycle_type?", "status?", "page?", "page_size?"]
    output: ObservationCycle[]
    side_effects: []
  - method: POST
    path: "/epp/observation-cycles/{cycle_id}/complete"
    description: "Record an observation inside the cycle's half-open window; only the cycle's own supervisor may do it."
    roles: [UniversitySupervisorUser]
    code: 200
    input: [observed_at, rubric_score]
    output: ObservationCycle
    side_effects:
      - "status SCHEDULED -> COMPLETED with observed_at and rubric_score recorded"
      - "re-derives the placement's observation_compliance_ratio and, for a SUMMATIVE cycle, increments summative_completed_count"
      - "increments ObservationCycle.version by 1"
  - method: POST
    path: "/epp/observation-cycles/{cycle_id}/reschedule"
    description: "Give a missed cycle a new window, bounded by MAX_RESCHEDULES_PER_CYCLE."
    roles: [SupervisionLead]
    code: 200
    input: [window_start, window_end, resolution_note]
    output: ObservationCycle
    side_effects:
      - "status MISSED -> SCHEDULED with the new window and reschedule_count incremented by 1"
      - "re-derives the placement's observation_compliance_ratio"
      - "increments ObservationCycle.version by 1"
  - method: POST
    path: "/epp/performance-assessments"
    description: "Open the performance-assessment submission window for a placement."
    roles: [AssessmentScorer, ProgramAdmin]
    code: 201
    input: [placement_id, window_opens_at, window_closes_at]
    output: PerformanceAssessment
    side_effects: ["creates the placement's single PerformanceAssessment in OPEN with attempt_no 0 and total_score 0"]
  - method: GET
    path: "/epp/performance-assessments/{assessment_id}"
    description: "Read one performance assessment."
    roles: [AssessmentScorer, ProgramAdmin, PlacementCoordinator, CandidateUser]
    code: 200
    input: []
    output: PerformanceAssessment
    side_effects: []
  - method: GET
    path: "/epp/performance-assessments"
    description: "List performance assessments, filtered by placement or status."
    roles: [AssessmentScorer, ProgramAdmin, PlacementCoordinator]
    code: 200
    input: ["placement_id?", "status?", "page?", "page_size?"]
    output: PerformanceAssessment[]
    side_effects: []
  - method: POST
    path: "/epp/performance-assessments/{assessment_id}/submit"
    description: "Submit or resubmit the assessment portfolio; only the placement's own candidate may submit."
    roles: [CandidateUser]
    code: 200
    input: [artifact_reference]
    output: PerformanceAssessment
    side_effects:
      - "status OPEN -> SUBMITTED or RETURNED -> SUBMITTED"
      - "attempt_no incremented by 1 and submitted_at recorded"
      - "increments PerformanceAssessment.version by 1"
  - method: POST
    path: "/epp/performance-assessments/{assessment_id}/score"
    description: "Score or return a submitted assessment; a sub-cut score on the final attempt fails the assessment and opens a system removal case."
    roles: [AssessmentScorer]
    code: 200
    input: [decision, "task_planning?", "task_instruction?", "task_assessment?", "task_professionalism?", "returned_feedback?"]
    output: PerformanceAssessment
    side_effects:
      - "decision=SCORE: runs calculations.assessment_total_score, records the four dimensions, total_score, scored_by_user_id and scored_at, then moves to PASSED, RETURNED or FAILED"
      - "decision=RETURN: moves to RETURNED, records returned_feedback and extends window_closes_at by RESUBMISSION_GRACE_DAYS"
      - "on FAILED: cascades the owning Placement ACTIVE -> REMOVAL_PENDING with removal_reason ASSESSMENT_FAILURE, cancels its SCHEDULED cycles to CANCELLED_HOLD and re-derives the supervisor's caseload"
      - "increments PerformanceAssessment.version by 1"
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical clock, which every deadline, expiry and window rule reads. Before any call to this endpoint the logical clock reads exactly 2026-08-01T00:00:00Z; it never falls back to real wall-clock time."
    roles: [ProgramAdmin]
    code: 200
    input: [current_utc]
    output: null
    side_effects:
      - "sets the logical clock to current_utc; no entity is mutated eagerly"
      - "subsequent reads and writes apply the lazy expiry transitions (ReadinessItem VERIFIED -> EXPIRED, CooperatingTeacher QUALIFIED -> TRAINING_EXPIRED, PartnershipAgreement ACTIVE -> EXPIRED, ObservationCycle SCHEDULED -> MISSED)"

errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-ID or X-User-Role is missing, empty, or carries a role outside the seven declared roles."
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "The acting role is not listed in the target endpoint's roles."
  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "An entity-backed principal acted on someone else's resource: a CandidateUser submitting another candidate's assessment, or a UniversitySupervisorUser completing another supervisor's observation cycle."
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Malformed body: a required field is missing, an enum value is not a declared member, a number arrives as a string, an integer is outside its range, or a date/instant is not valid ISO-8601."
  - id: ERR_INVALID_WINDOW
    http: 422
    condition: "An interval input is inverted or degenerate: window_start >= window_end, window_opens_at >= window_closes_at, or expires_on <= issued_on."
  - id: ERR_CANDIDATE_NOT_FOUND
    http: 404
    condition: "No Candidate exists for the supplied candidate id."
  - id: ERR_READINESS_ITEM_NOT_FOUND
    http: 404
    condition: "No ReadinessItem exists for the supplied item id."
  - id: ERR_DISTRICT_NOT_FOUND
    http: 404
    condition: "No District exists for the supplied district id."
  - id: ERR_AGREEMENT_NOT_FOUND
    http: 404
    condition: "No PartnershipAgreement exists for the supplied agreement id."
  - id: ERR_TEACHER_NOT_FOUND
    http: 404
    condition: "No CooperatingTeacher exists for the supplied teacher id."
  - id: ERR_SUPERVISOR_NOT_FOUND
    http: 404
    condition: "No UniversitySupervisor exists for the supplied supervisor id."
  - id: ERR_REQUEST_NOT_FOUND
    http: 404
    condition: "No PlacementRequest exists for the supplied request id."
  - id: ERR_PLACEMENT_NOT_FOUND
    http: 404
    condition: "No Placement exists for the supplied placement id."
  - id: ERR_CYCLE_NOT_FOUND
    http: 404
    condition: "No ObservationCycle exists for the supplied cycle id."
  - id: ERR_ASSESSMENT_NOT_FOUND
    http: 404
    condition: "No PerformanceAssessment exists for the supplied assessment id."
  - id: ERR_CANDIDATE_CODE_TAKEN
    http: 409
    condition: "candidate_code already belongs to another Candidate."
  - id: ERR_DISTRICT_CODE_TAKEN
    http: 409
    condition: "district_code already belongs to another District."
  - id: ERR_ASSESSMENT_ALREADY_EXISTS
    http: 409
    condition: "The placement already has a PerformanceAssessment."
  - id: ERR_STALE_REQUEST_VERSION
    http: 412
    condition: "expected_request_version does not equal the PlacementRequest's current version on a reroute."
  - id: ERR_AGREEMENT_STATE_INVALID
    http: 409
    condition: "The agreement lifecycle action does not match its current status (activate on a non-DRAFT, suspend on a non-ACTIVE, reactivate on a non-SUSPENDED, terminate on a DRAFT, EXPIRED or TERMINATED agreement)."
  - id: ERR_AGREEMENT_EXPIRED
    http: 409
    condition: "The agreement's window_end has passed; it is lazily moved to EXPIRED and cannot back a new routing or confirmation."
  - id: ERR_AGREEMENT_NOT_ACTIVE
    http: 409
    condition: "The agreement backing the placement is DRAFT, SUSPENDED or TERMINATED when a confirmation is attempted or when a new ObservationCycle or PerformanceAssessment is scheduled against an ACTIVE placement under it."
  - id: ERR_REQUEST_STATE_INVALID
    http: 409
    condition: "The PlacementRequest is not in the status the action requires (route needs SUBMITTED, reroute needs ROUTED with a PROPOSED placement)."
  - id: ERR_PLACEMENT_STATE_INVALID
    http: 409
    condition: "The Placement's placement_status does not permit the action (confirm needs PROPOSED, removal-request and complete need ACTIVE, removal-decision needs REMOVAL_PENDING, assessment submission needs ACTIVE)."
  - id: ERR_STIPEND_STATE_INVALID
    http: 409
    condition: "The requested stipend_status is not reachable from the placement's current money state."
  - id: ERR_ITEM_STATE_INVALID
    http: 409
    condition: "The ReadinessItem is not PENDING_VERIFICATION when a verification decision is recorded."
  - id: ERR_CYCLE_STATE_INVALID
    http: 409
    condition: "The ObservationCycle is not SCHEDULED for a completion or not MISSED for a reschedule."
  - id: ERR_ASSESSMENT_STATE_INVALID
    http: 409
    condition: "The PerformanceAssessment is not OPEN/RETURNED for a submission or not SUBMITTED for a scoring decision."
  - id: ERR_TEACHER_TRAINING_EXPIRED
    http: 409
    condition: "training_expires_on has passed; the teacher is lazily moved to TRAINING_EXPIRED and may not take a confirmed placement until training is renewed."
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "The acting X-User-ID already performed the incompatible step: deciding a removal they requested, or filing the state report for a licensure they recommended."
  - id: ERR_FINGERPRINT_CLEARANCE_REQUIRED
    http: 422
    condition: "The teacher's district requires a district fingerprint clearance and the candidate has no VERIFIED unexpired BACKGROUND_CLEARANCE item with clearance_scope DISTRICT_FINGERPRINT."
  - id: ERR_CANDIDATE_NOT_READY
    http: 422
    condition: "The candidate's STRICT readiness score is below READY_THRESHOLD, or the clearance component is missing, so readiness_status is NOT_READY or LAPSED."
  - id: ERR_TEACHER_NOT_QUALIFIED
    http: 422
    condition: "The cooperating teacher is PENDING_TRAINING or DISQUALIFIED at confirmation time."
  - id: ERR_TEACHER_DISQUALIFIED
    http: 422
    condition: "A stipend approval or payment was attempted for a DISQUALIFIED cooperating teacher."
  - id: ERR_COMMUTE_LIMIT_EXCEEDED
    http: 422
    condition: "max_commute_miles on a placement request exceeds MAX_PROGRAM_COMMUTE_MILES (45)."
  - id: ERR_SUBJECT_BAND_NOT_ALLOWED
    http: 422
    condition: "The requested subject or grade band is outside the agreement's allowed_subjects / allowed_grade_bands."
  - id: ERR_TERM_OUTSIDE_AGREEMENT_WINDOW
    http: 422
    condition: "The request's term interval is not fully inside the agreement's [window_start, window_end]."
  - id: ERR_TEACHER_TURNAROUND_CONFLICT
    http: 409
    condition: "The teacher's TURNAROUND_BUFFER_DAYS-padded blocked interval overlaps the placement's term at confirmation time."
  - id: ERR_OBSERVATION_OUTSIDE_WINDOW
    http: 422
    condition: "observed_at is before window_start or at/after window_end of the cycle's half-open window."
  - id: ERR_CYCLE_WINDOW_CONFLICT
    http: 409
    condition: "A rescheduled window starts in the past, ends after the placement's end_date, or overlaps another SCHEDULED/COMPLETED cycle of the same placement."
  - id: ERR_SUBMISSION_WINDOW_CLOSED
    http: 422
    condition: "The submission instant is outside the assessment's closed-closed window, including any resubmission grace extension."
  - id: ERR_OBSERVATION_COMPLIANCE_LOW
    http: 422
    condition: "The placement's observation_compliance_ratio is below ASSESSMENT_SUBMIT_MIN_RATIO (0.5) at submission time."
  - id: ERR_REROUTE_LIMIT_REACHED
    http: 409
    condition: "reroute_count has reached MAX_REROUTES_PER_REQUEST (2)."
  - id: ERR_RESCHEDULE_LIMIT_REACHED
    http: 409
    condition: "reschedule_count has reached MAX_RESCHEDULES_PER_CYCLE (2)."
  - id: ERR_ASSESSMENT_ATTEMPTS_EXHAUSTED
    http: 409
    condition: "A RETURN decision was issued when attempt_no already equals MAX_ASSESSMENT_ATTEMPTS (2)."
  - id: ERR_SCORE_PAYLOAD_INVALID
    http: 422
    condition: "A SCORE decision is missing a rubric dimension or carries a score that is not a multiple of 0.5 inside 1.0..5.0, or a RETURN decision carries dimension scores."
  - id: ERR_TERM_NOT_ENDED
    http: 422
    condition: "Completion was attempted before the logical clock reached the placement's end_date."
  - id: ERR_COMPLETION_GATE_UNMET
    http: 422
    condition: "observation_compliance_ratio is below 1.0 or summative_completed_count is 0 at completion time."
  - id: ERR_ASSESSMENT_NOT_PASSED
    http: 422
    condition: "The placement's PerformanceAssessment is missing or is not PASSED at completion time."
  - id: ERR_NO_ELIGIBLE_PLACEMENT
    http: 409
    condition: "The matcher's eligibility filter leaves no (teacher, supervisor) pair for the request."
  - id: ERR_SUPERVISOR_CASELOAD_EXCEEDED
    http: 409
    condition: "The supervisor's re-scored caseload_points would exceed max_caseload_points at confirmation time."
  - id: ERR_PLACEMENT_CAP_EXCEEDED
    http: 409
    condition: "The agreement's seats_committed already equals placement_cap at confirmation time."
  - id: ERR_PROVISIONAL_STIPEND_NOT_PAYABLE
    http: 422
    condition: "A PAID transition was attempted while stipend_variant is still PROVISIONAL."
  - id: ERR_NO_COMPLETER_RECORD
    http: 422
    condition: "A licensure recommendation was attempted for a candidate with no COMPLETED placement or whose ROLLING readiness is not READY."
  - id: ERR_LICENSURE_NOT_RECOMMENDED
    http: 422
    condition: "A state report was attempted while licensure_status is not RECOMMENDED, report_status is not UNREPORTED, or state_report_deadline is null."

roles:
  - name: ProgramAdmin
    description: "Owns the program's institutional surface: districts, candidates, partnership agreements, removal decisions, stipend money moves, licensure recommendations and state reporting."
    identity: "opaque"
    exclusive_operations:
      - "POST /epp/districts"
      - "POST /epp/candidates"
      - "POST /epp/partnership-agreements"
      - "POST /epp/partnership-agreements/{agreement_id}/activate"
      - "POST /epp/partnership-agreements/{agreement_id}/suspend"
      - "POST /epp/partnership-agreements/{agreement_id}/reactivate"
      - "POST /epp/partnership-agreements/{agreement_id}/terminate"
      - "POST /epp/placements/{placement_id}/removal-decision"
      - "POST /epp/placements/{placement_id}/stipend-transition"
      - "POST /epp/candidates/{candidate_id}/licensure-recommendation"
      - "POST /epp/candidates/{candidate_id}/state-report"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "POST /epp/candidates/{candidate_id}/readiness-evaluate (with CredentialAnalyst)"
      - "POST /epp/cooperating-teachers/{teacher_id}/disqualify (with SupervisionLead)"
      - "POST /epp/performance-assessments (with AssessmentScorer)"
      - "every GET in §1.5"
  - name: PlacementCoordinator
    description: "Runs the placement pipeline: opening requests, routing and rerouting them, confirming placements, opening removal cases and closing out completed placements."
    identity: "opaque"
    exclusive_operations:
      - "POST /epp/placement-requests"
      - "POST /epp/placement-requests/{request_id}/route"
      - "POST /epp/placement-requests/{request_id}/reroute"
      - "POST /epp/placements/{placement_id}/confirm"
      - "POST /epp/placements/{placement_id}/complete"
    shared_operations:
      - "POST /epp/placements/{placement_id}/removal-request (with SupervisionLead)"
      - "GET /epp/districts, /epp/candidates, /epp/partnership-agreements, /epp/cooperating-teachers, /epp/university-supervisors, /epp/placement-requests, /epp/placements, /epp/observation-cycles, /epp/performance-assessments and their single-resource forms"
  - name: CredentialAnalyst
    description: "Owns the candidate readiness gate: recording readiness artifacts, verifying or rejecting them and re-evaluating the gate."
    identity: "opaque"
    exclusive_operations:
      - "POST /epp/readiness-items"
      - "POST /epp/readiness-items/{item_id}/verify"
    shared_operations:
      - "POST /epp/candidates/{candidate_id}/readiness-evaluate (with ProgramAdmin)"
      - "GET /epp/candidates, /epp/readiness-items, /epp/districts and their single-resource forms"
  - name: SupervisionLead
    description: "Owns the clinical supervision network: cooperating teachers, their training and disqualification, university supervisors and the observation schedule."
    identity: "opaque"
    exclusive_operations:
      - "POST /epp/cooperating-teachers"
      - "POST /epp/cooperating-teachers/{teacher_id}/training-completion"
      - "POST /epp/university-supervisors"
      - "PATCH /epp/university-supervisors/{supervisor_id}"
      - "POST /epp/observation-cycles"
      - "POST /epp/observation-cycles/{cycle_id}/reschedule"
    shared_operations:
      - "POST /epp/cooperating-teachers/{teacher_id}/disqualify (with ProgramAdmin)"
      - "POST /epp/placements/{placement_id}/removal-request (with PlacementCoordinator)"
      - "GET /epp/districts, /epp/cooperating-teachers, /epp/university-supervisors, /epp/placements, /epp/observation-cycles and their single-resource forms"
  - name: AssessmentScorer
    description: "Independent scorer of the performance assessment; opens the submission window and issues the SCORE or RETURN decision, never for their own candidacy."
    identity: "opaque"
    exclusive_operations:
      - "POST /epp/performance-assessments/{assessment_id}/score"
    shared_operations:
      - "POST /epp/performance-assessments (with ProgramAdmin)"
      - "GET /epp/performance-assessments and its single-resource form"
  - name: UniversitySupervisorUser
    description: "A university supervisor acting as themselves; may complete only the observation cycles assigned to their own supervisor record."
    identity: "entity_backed:UniversitySupervisor"
    exclusive_operations:
      - "POST /epp/observation-cycles/{cycle_id}/complete"
    shared_operations:
      - "GET /epp/observation-cycles and its single-resource form"
      - "GET /epp/university-supervisors/{supervisor_id}"
      - "GET /epp/placements/{placement_id}"
  - name: CandidateUser
    description: "A teacher candidate acting as themselves; may submit only their own performance assessment."
    identity: "entity_backed:Candidate"
    exclusive_operations:
      - "POST /epp/performance-assessments/{assessment_id}/submit"
    shared_operations:
      - "GET /epp/candidates/{candidate_id}"
      - "GET /epp/readiness-items/{item_id}"
      - "GET /epp/placement-requests/{request_id}"
      - "GET /epp/placements/{placement_id}"
      - "GET /epp/performance-assessments/{assessment_id}"
