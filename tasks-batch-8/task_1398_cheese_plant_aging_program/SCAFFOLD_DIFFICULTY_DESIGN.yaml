            - { call: "POST /plant/plants/${plant_id}/additive-lots", payload: { kind: "COAGULANT", supplier_lot_no: "COA-1", expires_at: "2027-01-01T00:00:00Z", quantity_initial: 5000.0 }, as: PlantAdmin, captures: { coa_id: $.data.id } }
            - { call: "POST /plant/additive-lots/${cul_id}/release", payload: {}, as: QAGrader }
            - { call: "POST /plant/additive-lots/${coa_id}/release", payload: {}, as: QAGrader }
            - { call: "POST /plant/make-sheets", payload: { vat_id: "${vat_id}", milk_intake_id: "${milk_id}", variety: "MUENSTER", scheduled_start: "2026-08-01T02:00:00Z", scheduled_end: "2026-08-01T06:00:00Z", liters_committed: 5000.0, culture_lot_id: "${cul_id}", coagulant_lot_id: "${coa_id}", culture_units_planned: 5.0, coagulant_ml_planned: 250.0, expected_vat_version: "${vat_v}" }, as: MakePlanner, captures: { make_id: $.data.id } }
