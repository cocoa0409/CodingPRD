            - "GET /in-bond/ledger-entries?movement_id=${m_te} returns 2 entries: (OBLIGATE, +41.75, MOVEMENT_FILED) then (RELEASE, -41.75, MOVEMENT_EXPORTED)"
            - "the second proof call returned HTTP 409 with error_id == ERR_REPORT_INVALID_STATE and MovementReport.${rep_exp}.proof_of_export_ref is still BOL-88123"

