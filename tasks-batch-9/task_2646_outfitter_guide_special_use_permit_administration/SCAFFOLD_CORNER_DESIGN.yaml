              as: PermitSpecialist
              captures: { na_id: "$.data.id" }
            - call: "POST /osup/needs-assessments/${na_id}/publish"
              payload: {}
              as: AuthorizedOfficer
            - call: "POST /osup/use-areas/${ua_id}/needs-assessments"
              payload: { assessment_year: 2028, public_need_finding: "NEED_EXISTS", determined_capacity_service_days: 800, allocated_service_days: 0 }
              as: PermitSpecialist
              captures: { na2_id: "$.data.id" }
            - call: "POST /osup/outfitters"
              payload: { legal_name: "Alpine Outfitters LLC", ein: "410000001", contact_email: "ops@alpine.example", prequalification_insurance_verified: true }
              as: PermitSpecialist
              captures: { oa_id: "$.data.id" }
            - call: "POST /osup/outfitters"
              payload: { legal_name: "Cedar Creek Guides LLC", ein: "410000002", contact_email: "ops@cedar.example", prequalification_insurance_verified: true }
              as: PermitSpecialist
              captures: { oc_id: "$.data.id" }
            - call: "POST /osup/outfitters/${oc_id}/guides"
              payload: { full_name: "Tom Reed", qualification_level: "LEAD", first_aid_cert_type: "WFR", first_aid_expires_on: "2030-06-30", seasons_experience: 5 }
              as: OutfitterRepresentative
              as_user_id: "${oc_id}"
              captures: { gc_id: "$.data.id" }
            - call: "POST /osup/guides/${gc_id}/qualify"
              payload: {}
              as: PermitSpecialist
            - call: "POST /osup/permit-applications"
              payload: { outfitter_id: "${oa_id}", use_area_id: "${ua_id}", application_type: "NEW", season_year: 2027, requested_service_days: 200, proposed_activity_type: "RIVER_FLOAT", narrative: "Guided day floats." }
              as: PermitSpecialist
              captures: { app_id: "$.data.id" }
            - call: "POST /osup/permit-applications/${app_id}/submit"
              payload: {}
              as: OutfitterRepresentative
              as_user_id: "${oa_id}"
