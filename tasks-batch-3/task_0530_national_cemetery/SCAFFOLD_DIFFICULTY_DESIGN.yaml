  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: assign_release_conserves_section_available_units
        grounds:
          - state_machines.BurialCase.ELIGIBLE_to_ASSIGNED
          - state_machines.BurialCase.ASSIGNED_to_ELIGIBLE
          - calculations.section_inventory
        distinguishing_aspect: |
          Conserved quantity #1 = Section.available_units. assign-plot (forward) decrements it by 1 and
          release-plot (compensating) increments it by 1, leaving available_units == capacity_units with
          zero drift. Invariant: available_units + (count RESERVED) + interred_units == capacity_units.
        test_recipe:
          setup:
            - "US cemetery, IN_GROUND section with exactly one STANDARD gravesite (capacity_units=1, available_units=1). VETERAN case approved (ELIGIBLE)."
          setup_api_calls:
            - call: "POST /registry/cemeteries"
              payload: { name: "Conserve National", country_code: "US", honors_squad_capacity: 1 }
              as: NCA_Admin
              captures: { cem_id: $.data.id }
            - call: "POST /registry/sections"
              payload: { cemetery_id: "${cem_id}", code: "A", kind: "IN_GROUND" }
              as: NCA_Admin
              captures: { sec_id: $.data.id }
            - call: "POST /registry/gravesites"
              payload: { section_id: "${sec_id}", grid_ref: "R1C1", gravesite_class: "STANDARD", depth_capacity: 1 }
              as: NCA_Admin
              captures: { grv_id: $.data.id }
            - call: "POST /registry/burial-cases"
              payload: { cemetery_id: "${cem_id}", case_type: "AT_NEED", applicant_role: "VETERAN", requested_class: "STANDARD", character_of_discharge: "HONORABLE", service_days: 3650 }
              as: EligibilityOfficer
