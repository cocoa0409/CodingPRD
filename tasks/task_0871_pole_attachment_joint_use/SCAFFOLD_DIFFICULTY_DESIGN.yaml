    instances:
      - name: pole_occupied_space_conserved_across_attach_abandon
        grounds:
          - calculations.pole_occupied_space
          - state_machines.Attachment.ACTIVE_to_ABANDONED
          - entities.Pole.fields.occupied_space_inches
        distinguishing_aspect: "Conserved quantity = Pole.occupied_space_inches: after grant (+6) then abandon (-6), occupied_space_inches == SUM(ACTIVE attachment allotted_space) == 0."
