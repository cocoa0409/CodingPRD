  - section: errors
    instances:
      - name: not_found_sweep_parent_resources
        claim_type: error_triggerable
        grounds: ["errors[ERR_FARM_NOT_FOUND]", "errors[ERR_AUDIT_NOT_FOUND]", "errors[ERR_LOT_NOT_FOUND]", "errors[ERR_ROUTE_NOT_FOUND]", "errors[ERR_COMMITMENT_NOT_FOUND]", "errors[ERR_SETTLEMENT_NOT_FOUND]"]
        distinguishing_aspect: "Every top-level resource GET returns its domain-specific 404 error id (not a generic NOT_FOUND) when addressed with a well-formed but absent UUID."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "GET /farm-network/farms/00000000-0000-0000-0000-000000000000"
              as: NetworkManager
              captures: { e_farm: $.data.error_id }
            - call: "GET /farm-network/audits/00000000-0000-0000-0000-000000000000"
              as: NetworkManager
              captures: { e_audit: $.data.error_id }
            - call: "GET /farm-network/lots/00000000-0000-0000-0000-000000000000"
              as: NetworkManager
              captures: { e_lot: $.data.error_id }
            - call: "GET /farm-network/routes/00000000-0000-0000-0000-000000000000"
              as: PlantOperator
              captures: { e_route: $.data.error_id }
            - call: "GET /farm-network/commitments/00000000-0000-0000-0000-000000000000"
              as: NetworkManager
              captures: { e_commit: $.data.error_id }
            - call: "GET /farm-network/settlement-runs/00000000-0000-0000-0000-000000000000"
              as: NetworkManager
              captures: { e_settle: $.data.error_id }
          assert:
            - "e_farm == ERR_FARM_NOT_FOUND (404)"
            - "e_audit == ERR_AUDIT_NOT_FOUND (404)"
            - "e_lot == ERR_LOT_NOT_FOUND (404)"
            - "e_route == ERR_ROUTE_NOT_FOUND (404)"
            - "e_commit == ERR_COMMITMENT_NOT_FOUND (404)"
            - "e_settle == ERR_SETTLEMENT_NOT_FOUND (404)"

      - name: not_found_sweep_child_resources
        claim_type: error_triggerable
        grounds: ["errors[ERR_CA_NOT_FOUND]", "errors[ERR_INCIDENT_NOT_FOUND]", "errors[ERR_CARTON_NOT_FOUND]", "errors[ERR_STOP_NOT_FOUND]", "errors[ERR_RETAILER_NOT_FOUND]"]
        distinguishing_aspect: "Child/secondary resources also surface domain 404s: corrective action, incident, carton code, route stop sequence, and body-referenced retailer."
        test_recipe:
          setup: ["one real route R with capacity 4 (so the stop-sequence 404 is exercised against an existing parent)"]
          setup_api_calls:
            - call: "POST /farm-network/routes"
              payload: { route_date: "2026-09-08", driver_name: "Dale", capacity_cases: 4 }
              as: PlantOperator
              captures: { r_id: $.data.id }
          trigger:
            - call: "POST /farm-network/corrective-actions/00000000-0000-0000-0000-000000000000/submit"
              payload: { evidence_notes: "x" }
              as: NetworkManager
              captures: { e_ca: $.data.error_id }
            - call: "POST /farm-network/incidents/00000000-0000-0000-0000-000000000000/resolve"
              payload: { disposition: "NONE" }
              as: NetworkManager
              captures: { e_inc: $.data.error_id }
            - call: "GET /farm-network/cartons/LOT-999999-C999"
              as: NetworkManager
              captures: { e_ctn: $.data.error_id }
            - call: "POST /farm-network/routes/${r_id}/stops/9/collect"
              payload: { collected_cases: 1, laid_start_date: "2026-09-06", laid_end_date: "2026-09-07" }
              as: PlantOperator
              captures: { e_stop: $.data.error_id }
            - call: "POST /farm-network/commitments"
              payload: { retailer_id: "00000000-0000-0000-0000-000000000000", farm_id: "00000000-0000-0000-0000-000000000000", week_start: "2026-09-07", committed_dozens: 10 }
              as: NetworkManager
              captures: { e_ret: $.data.error_id }
          assert:
            - "e_ca == ERR_CA_NOT_FOUND (404)"
            - "e_inc == ERR_INCIDENT_NOT_FOUND (404)"
            - "e_ctn == ERR_CARTON_NOT_FOUND (404)"
            - "e_stop == ERR_STOP_NOT_FOUND (404) — the route exists but sequence 9 does not"
            - "e_ret == ERR_RETAILER_NOT_FOUND (404) — body reference resolved at the existence gate"

  - section: rbac
    instances:
      - name: rbac_exclusive_operation_denials_return_403
        claim_type: role_denial
        grounds: ["roles", "validations[priority=2]"]
        distinguishing_aspect: "Exclusive operations are enforced per role: QualityManager cannot create farms, PlantOperator cannot grade lots, NetworkManager cannot verify corrective actions, Auditor cannot create commitments — all 403 ERR_FORBIDDEN before existence checks."
        test_recipe:
          setup: ["empty database (authorization fires before existence, so bogus ids suffice)"]
          setup_api_calls: []
          trigger:
            - call: "POST /farm-network/farms"
              payload: { name: "QM Farm", region: "IA", pasture_sqft: 21600, barn_sqft: 180, nest_box_count: 30, declared_bird_count: 140 }
              as: QualityManager
              captures: { e1: $.data.error_id }
