  # ===========================================================================
  # Rule 8 — resource_temporal_overlap (different interval semantics/entities)
  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: para_schedule_half_open_with_travel_buffer
        grounds:
          - calculations.para_schedule_overlap
          - entities.StaffingPlan.fields.travel_buffer_minutes
          - errors[ERR_SCHEDULE_OVERLAP]
        distinguishing_aspect: |
          Resource Paraprofessional, HALF-OPEN semantics + cross-building buffer:
          a B2 window starting 780 adjacent to a B1 window ending 780 conflicts
          (gap 0 < 30 buffer), while a B2 window starting 810 (gap exactly 30)
          is allowed — buffer arithmetic applies only across buildings.
        test_recipe:
          setup:
            - "Plan ACTIVE (travel_buffer 30), buildings B1 and B2; P1 (no quals needed)"
            - "A1 ACTIVE: B1, Mon-Fri 480-780; S2 second student TRANSITIONAL/NONE"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: DistrictStaffingAdmin
            - call: "POST /sped-staffing/plans"
              payload: { plan_name: "FY27 SPED", school_year: "2026-27", total_budget_cents: 100000000 }
              as: DistrictStaffingAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /sped-staffing/buildings"
              payload: { plan_id: "${plan_id}", name: "Lincoln Elementary", building_code: "LIN", hardship_factor: 1.0 }
              as: DistrictStaffingAdmin
              captures: { b1: $.data.id }
            - call: "POST /sped-staffing/buildings"
              payload: { plan_id: "${plan_id}", name: "Jefferson Middle", building_code: "JEF", hardship_factor: 1.0 }
              as: DistrictStaffingAdmin
              captures: { b2: $.data.id }
            - call: "POST /sped-staffing/plans/${plan_id}/activate"
              as: DistrictStaffingAdmin
              captures: { plan_v: $.data.version }
            - call: "POST /sped-staffing/paraprofessionals"
              payload: { plan_id: "${plan_id}", home_building_id: "${b1}", full_name: "Pat Para", email: "p1@district.test", base_hourly_wage_cents: 2000, contracted_max_weekly_minutes: 2400, hire_date: "2025-08-15" }
              as: DistrictStaffingAdmin
              captures: { p1: $.data.id }
            - call: "POST /sped-staffing/students"
              payload: { plan_id: "${plan_id}", building_id: "${b1}", student_ref: "STU-001", iep_service_level: "TRANSITIONAL", iep_minutes_per_week: 1500, required_qualification: "NONE" }
              as: SpecialEdCoordinator
              captures: { s1: $.data.id }
            - call: "POST /sped-staffing/students/${s1}/activate-iep"
              as: SpecialEdCoordinator
            - call: "POST /sped-staffing/assignments"
              payload: { plan_id: "${plan_id}", student_id: "${s1}", para_id: "${p1}", building_id: "${b1}", start_date: "2026-05-04", end_date: "2026-06-30", days_of_week: ["MON","TUE","WED","THU","FRI"], daily_start_minute: 480, daily_end_minute: 780, expected_plan_version: "${plan_v}" }
              as: SpecialEdCoordinator
              captures: { a1: $.data.id }
            - call: "POST /sped-staffing/assignments/${a1}/verify-qualifications"
              as: SpecialEdCoordinator
            - call: "POST /sped-staffing/assignments/${a1}/activate"
              as: SpecialEdCoordinator
            - call: "POST /sped-staffing/students"
              payload: { plan_id: "${plan_id}", building_id: "${b2}", student_ref: "STU-002", iep_service_level: "TRANSITIONAL", iep_minutes_per_week: 300, required_qualification: "NONE" }
              as: SpecialEdCoordinator
              captures: { s2: $.data.id }
            - call: "POST /sped-staffing/students/${s2}/activate-iep"
              as: SpecialEdCoordinator
            - call: "GET /sped-staffing/plans/${plan_id}"
              as: Any
              captures: { plan_v2: $.data.version }
          trigger:
            - call: "POST /sped-staffing/assignments"
              payload: { plan_id: "${plan_id}", student_id: "${s2}", para_id: "${p1}", building_id: "${b2}", start_date: "2026-05-04", end_date: "2026-06-30", days_of_week: ["MON","TUE","WED","THU","FRI"], daily_start_minute: 780, daily_end_minute: 840, expected_plan_version: "${plan_v2}" }
              as: SpecialEdCoordinator
              captures: { e_id: $.data.error_id }
            - call: "POST /sped-staffing/assignments"
              payload: { plan_id: "${plan_id}", student_id: "${s2}", para_id: "${p1}", building_id: "${b2}", start_date: "2026-05-04", end_date: "2026-06-30", days_of_week: ["MON","TUE","WED","THU","FRI"], daily_start_minute: 810, daily_end_minute: 870, expected_plan_version: "${plan_v2}" }
              as: SpecialEdCoordinator
              captures: { a2: $.data.id }
          assert:
            - "cross-building create at gap 0 (780 vs 780) returns error_id == ERR_SCHEDULE_OVERLAP"
            - "cross-building create at gap exactly 30 (810 vs 780) succeeds (201) — buffer comparison is >="
            - "Assignment.${a2}.status == PROPOSED"

      - name: timesheet_closed_interval_touch_conflict
        grounds:
          - calculations.timesheet_double_log_check
          - errors[ERR_TIMESHEET_OVERLAP]
        distinguishing_aspect: |
          Resource TimesheetEntry, CLOSED-interval semantics: a second entry whose
          start TOUCHES the first entry's end (660 == 660) is rejected as
          double-logging, whereas the assignment rule (half-open) would allow the
          same touching pair — different interval geometry on a different entity.
        test_recipe:
          setup:
            - "Plan ACTIVE, B1, P1, S1 ONE_TO_ONE/NONE, A1 ACTIVE Mon-Fri 480-780"
            - "T1 for 2026-05-04 480-660 SUBMITTED"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: DistrictStaffingAdmin
            - call: "POST /sped-staffing/plans"
              payload: { plan_name: "FY27 SPED", school_year: "2026-27", total_budget_cents: 100000000 }
              as: DistrictStaffingAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /sped-staffing/buildings"
              payload: { plan_id: "${plan_id}", name: "Lincoln Elementary", building_code: "LIN", hardship_factor: 1.0 }
              as: DistrictStaffingAdmin
              captures: { b1: $.data.id }
            - call: "POST /sped-staffing/plans/${plan_id}/activate"
              as: DistrictStaffingAdmin
              captures: { plan_v: $.data.version }
            - call: "POST /sped-staffing/paraprofessionals"
              payload: { plan_id: "${plan_id}", home_building_id: "${b1}", full_name: "Pat Para", email: "p1@district.test", base_hourly_wage_cents: 2000, contracted_max_weekly_minutes: 2400, hire_date: "2025-08-15" }
              as: DistrictStaffingAdmin
              captures: { p1: $.data.id }
            - call: "POST /sped-staffing/students"
              payload: { plan_id: "${plan_id}", building_id: "${b1}", student_ref: "STU-001", iep_service_level: "ONE_TO_ONE", iep_minutes_per_week: 1500, required_qualification: "NONE" }
              as: SpecialEdCoordinator
              captures: { s1: $.data.id }
            - call: "POST /sped-staffing/students/${s1}/activate-iep"
              as: SpecialEdCoordinator
            - call: "POST /sped-staffing/assignments"
              payload: { plan_id: "${plan_id}", student_id: "${s1}", para_id: "${p1}", building_id: "${b1}", start_date: "2026-05-04", end_date: "2026-06-30", days_of_week: ["MON","TUE","WED","THU","FRI"], daily_start_minute: 480, daily_end_minute: 780, expected_plan_version: "${plan_v}" }
              as: SpecialEdCoordinator
              captures: { a1: $.data.id }
            - call: "POST /sped-staffing/assignments/${a1}/verify-qualifications"
              as: SpecialEdCoordinator
            - call: "POST /sped-staffing/assignments/${a1}/activate"
              as: SpecialEdCoordinator
            - call: "POST /sped-staffing/timesheets"
              payload: { assignment_id: "${a1}", work_date: "2026-05-04", start_minute: 480, end_minute: 660 }
              as: Paraprofessional
              as_user_id: "${p1}"
              captures: { t1: $.data.id }
            - call: "POST /sped-staffing/timesheets/${t1}/submit"
              as: Paraprofessional
              as_user_id: "${p1}"
          trigger:
            - call: "POST /sped-staffing/timesheets"
              payload: { assignment_id: "${a1}", work_date: "2026-05-04", start_minute: 660, end_minute: 780 }
              as: Paraprofessional
              as_user_id: "${p1}"
              captures: { e_id: $.data.error_id }
          assert:
            - "error_id == ERR_TIMESHEET_OVERLAP (touching endpoints conflict under closed semantics)"
            - "no second TimesheetEntry is persisted for (P1, 2026-05-04)"

  # ===========================================================================
  # Rule 9 — compensating_invariant (different conserved quantities)
  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: committed_cost_round_trip_no_drift
        grounds:
          - entities.StaffingPlan.fields.committed_cost_cents
          - state_machines.Assignment.PROPOSED_to_ENDED
          - calculations.assignment_daily_cost
        distinguishing_aspect: |
          Conserved quantity: cents. Forward action (create) debits committed by
          56250; the compensating action (end before activation) must restore
          committed to exactly 0 and cost_balance to exactly total_budget — no
          drift from re-costing or surcharge re-evaluation.
        test_recipe:
          setup:
            - "Plan ACTIVE total_budget 1000000, B1; P1 BEHAVIOR_SUPPORT current; S1 ONE_TO_ONE/BEHAVIOR_SUPPORT"
            - "A1 created: 300/day Mon-Fri, rate 2250 -> weekly 56250; committed 56250"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: DistrictStaffingAdmin
            - call: "POST /sped-staffing/plans"
              payload: { plan_name: "FY27 SPED", school_year: "2026-27", total_budget_cents: 1000000 }
              as: DistrictStaffingAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /sped-staffing/buildings"
              payload: { plan_id: "${plan_id}", name: "Lincoln Elementary", building_code: "LIN", hardship_factor: 1.0 }
              as: DistrictStaffingAdmin
              captures: { b1: $.data.id }
            - call: "POST /sped-staffing/plans/${plan_id}/activate"
              as: DistrictStaffingAdmin
              captures: { plan_v: $.data.version }
            - call: "POST /sped-staffing/paraprofessionals"
              payload: { plan_id: "${plan_id}", home_building_id: "${b1}", full_name: "Pat Para", email: "p1@district.test", base_hourly_wage_cents: 2000, contracted_max_weekly_minutes: 2400, hire_date: "2025-08-15" }
              as: DistrictStaffingAdmin
              captures: { p1: $.data.id }
            - call: "POST /sped-staffing/paraprofessionals/${p1}/qualifications"
              payload: { qualification: "BEHAVIOR_SUPPORT", completed_on: "2026-01-10", expires_on: "2027-01-10" }
              as: DistrictStaffingAdmin
            - call: "POST /sped-staffing/students"
              payload: { plan_id: "${plan_id}", building_id: "${b1}", student_ref: "STU-001", iep_service_level: "ONE_TO_ONE", iep_minutes_per_week: 1500, required_qualification: "BEHAVIOR_SUPPORT" }
              as: SpecialEdCoordinator
              captures: { s1: $.data.id }
            - call: "POST /sped-staffing/students/${s1}/activate-iep"
              as: SpecialEdCoordinator
            - call: "POST /sped-staffing/assignments"
              payload: { plan_id: "${plan_id}", student_id: "${s1}", para_id: "${p1}", building_id: "${b1}", start_date: "2026-05-04", end_date: "2026-06-30", days_of_week: ["MON","TUE","WED","THU","FRI"], daily_start_minute: 480, daily_end_minute: 780, expected_plan_version: "${plan_v}" }
              as: SpecialEdCoordinator
              captures: { a1: $.data.id }
            - call: "GET /sped-staffing/plans/${plan_id}"
              as: Any
              captures: { committed_mid: $.data.committed_cost_cents }
          trigger:
            - call: "POST /sped-staffing/assignments/${a1}/end"
              as: SpecialEdCoordinator
            - call: "GET /sped-staffing/plans/${plan_id}"
              as: Any
              captures: { committed_end: $.data.committed_cost_cents, balance_end: $.data.cost_balance_cents }
            - call: "GET /sped-staffing/assignments/${a1}"
              as: Any
          assert:
            - "after create: StaffingPlan.${plan_id}.committed_cost_cents == 56250"
            - "after end: StaffingPlan.${plan_id}.committed_cost_cents == 0 (full compensation, no drift)"
            - "after end: StaffingPlan.${plan_id}.cost_balance_cents == 1000000"
            - "Assignment.${a1}.status == ENDED and funding_status == SETTLED"

      - name: substitute_minutes_round_trip_no_drift
        grounds:
          - entities.Paraprofessional.fields.weekly_scheduled_minutes
          - state_machines.BackfillAssignment.ACCEPTED_to_CANCELLED
          - calculations.backfill_selector
        distinguishing_aspect: |
          Conserved quantity: minutes. Backfill accept adds exactly 300 minutes to
          the substitute's weekly_scheduled_minutes; the compensating cancel must
          return it to exactly 0 and re-open the absence to BACKFILL_PENDING — a
          different conserved quantity (minutes) than the cents invariant.
        test_recipe:
          setup:
            - "Plan ACTIVE, B1; P1 with A1 ACTIVE Mon-Fri 480-780 (2026-05-04..06-30); P2 idle substitute (0 minutes, cap 2400)"
            - "Clock at 2026-05-04 so the 2026-05-06 absence falls in the current ISO week for the substitute's minutes"
            - "CP (B1, 2026-05-06) PUBLISHED (v2); AB REPORTED for A1 on 2026-05-06; selector offers BF to P2"
          setup_api_calls:
