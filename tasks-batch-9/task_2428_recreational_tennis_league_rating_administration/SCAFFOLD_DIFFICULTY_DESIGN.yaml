      - name: team_calendar_rejects_earlier_same_date_slot_and_admits_later_next_date_slot
        grounds:
          - calculations.team_calendar_conflict
          - validations[priority=54]
          - entities.League.fields.allow_same_day_doubleheader
          - entities.Match.fields.scheduled_start_at
          - entities.Facility.fields.section_id
        distinguishing_aspect: |
          With the doubleheader flag off the Team resource is bucketed by pure UTC calendar date:
          a slot 16 hours BEFORE M1 (2026-08-15T02:00:00Z, no interval overlap of any kind) is
          rejected 409 ERR_TEAM_DATE_CONFLICT, while a slot only 3.5 hours after M1's playing end
          (2026-08-16T00:30:00Z) is ADMITTED because it falls on the next UTC date. Both requests
          use a second facility in the SAME section, so the referential rule of priority 42 never
          applies and neither the duration nor the buffer plays any role.
        test_recipe:
          setup:
            - "Section SOCAL-2026 with two facilities of its own: fac1 and fac2, each court_count 3 and turnaround_buffer_minutes 30."
            - "One SECTION league with match_duration_minutes 180, min_active_roster_size 2 and allow_same_day_doubleheader false; Team H and Team A each hold two ACTIVE 4.0 players and are IN_PLAY."
            - "Match M1 (home Team H, away Team A) is scheduled at fac1 for 2026-08-15T18:00:00Z with courts_required 3, so both teams hold UTC date 2026-08-15."
            - "Match M2 pairs the same two teams (home Team A) and is still PENDING; every request below targets fac2, which has no occupancy at all, so the court rule can never fire."
            - "Clock stays at 2026-08-08T00:00:00Z; the rejected request leaves Match.version untouched, so both attempts use expected_match_version ${m2v}."
          setup_api_calls:
            - { call: "POST /tennis/sections", payload: { code: "SOCAL-2026", name: "Southern California", season_year: 2026, min_matches_for_playoff_eligibility: 1 }, as: SectionAdmin, captures: { sec: $.data.id } }
