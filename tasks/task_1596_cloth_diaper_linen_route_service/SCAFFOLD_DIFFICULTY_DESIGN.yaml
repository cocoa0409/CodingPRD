            - { call: "POST /api/wash-batches/${batch_id}/events", payload: { event_type: "REWASH" }, as: PlantOperator, as_user_id: "op-1", captures: { err_rewash: $.data.error_id } }
          assert:
            - "first RECORD_SANITIZATION (71C, 179 s, 100 ppm) -> validation_passed == false (dwell 179 < 180)"
            - "first REWASH -> status WASHING, rewash_count == 1 (cycle WASHING -> VALIDATING -> WASHING)"
            - "second REWASH -> status WASHING, rewash_count == 2"
            - "third REWASH rejected: $.data.error_id == ERR_REWASH_LIMIT_EXCEEDED (rewash_count 2 >= max_rewash_count 2)"

      - name: customer_suspend_reinstate_cycle
        grounds:
          - state_machines.Customer.ACTIVE_to_SUSPENDED
          - state_machines.Customer.SUSPENDED_to_ACTIVE
        distinguishing_aspect: |
          Cyclic machine on Customer (distinct entity): ACTIVE -> SUSPENDED -> ACTIVE can
          loop repeatedly with no cycle counter, and each loop drags the subscription's
          service_status along SUSPENDED -> ACTIVE.
        test_recipe:
          setup: ["ACTIVE subscription for customer C; no routes (empty cascade)"]
          setup_api_calls:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: PlatformAdmin }
