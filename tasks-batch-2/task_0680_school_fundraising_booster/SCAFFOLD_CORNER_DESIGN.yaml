# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# School Fundraising & Booster Programs — Expert
# Breadth probe across claim-extraction-guide sections.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_campaign_returns_201_with_all_fields_and_defaults
        claim_type: Creation
        grounds: [endpoints./fundraising/campaigns, entities.Campaign.fields.posture]
        distinguishing_aspect: "POST /fundraising/campaigns with all required fields -> 201; posture defaults DRAFT, version 1, gross_collected_cents/forecast_gross_cents/school_profit_cents/vendor_payable_cents all 0, reconciled_at null."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /fundraising/campaigns"
              payload: { name: "C", campaign_type: "CATALOG", goal_cents: 100000, profit_split_pct: 0.50, vendor_name: "V", starts_at: "2026-04-01T00:00:00Z", ends_at: "2026-05-01T00:00:00Z" }
              as: CampaignAdmin
              captures: { cid: $.data.id, p: $.data.posture, v: $.data.version }
          assert:
            - "http status == 201"
            - "Campaign.${cid}.posture == DRAFT"
            - "Campaign.${cid}.version == 1"
            - "Campaign.${cid}.gross_collected_cents == 0 AND forecast_gross_cents == 0 AND school_profit_cents == 0 AND vendor_payable_cents == 0"
            - "Campaign.${cid}.reconciled_at == null"

      - name: get_campaign_nonexistent_returns_not_found
        claim_type: Not Found
        grounds: ["endpoints./fundraising/campaigns/{id}", "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /fundraising/campaigns/{id} for a non-existent UUID -> ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /fundraising/campaigns/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: CampaignAdmin
              captures: { eid: $.data.error_id }
          assert:
            - "response data.error_id == ERR_NOT_FOUND"
            - "http status == 404"

      - name: create_campaign_missing_required_field_returns_invalid_request
        claim_type: Required Fields
        grounds: [endpoints./fundraising/campaigns, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /fundraising/campaigns omitting required campaign_type -> ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /fundraising/campaigns"
              payload: { name: "C", goal_cents: 100000, profit_split_pct: 0.50, vendor_name: "V", starts_at: "2026-04-01T00:00:00Z", ends_at: "2026-05-01T00:00:00Z" }
              as: CampaignAdmin
              captures: { eid: $.data.error_id }
          assert:
            - "response data.error_id == ERR_INVALID_REQUEST"
            - "http status == 422"

      - name: create_campaign_ends_before_starts_returns_invalid_request
        claim_type: Type Constraints
        grounds: [entities.Campaign.fields.ends_at, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "ends_at <= starts_at -> ERR_INVALID_REQUEST (422); ends_at must be strictly after starts_at."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /fundraising/campaigns"
              payload: { name: "C", campaign_type: "CATALOG", goal_cents: 100000, profit_split_pct: 0.50, vendor_name: "V", starts_at: "2026-05-01T00:00:00Z", ends_at: "2026-04-01T00:00:00Z" }
              as: CampaignAdmin
              captures: { eid: $.data.error_id }
          assert:
            - "response data.error_id == ERR_INVALID_REQUEST"
            - "http status == 422"

      - name: create_campaign_profit_split_out_of_range_returns_invalid_request
        claim_type: Type Constraints
        grounds: [entities.Campaign.fields.profit_split_pct, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "profit_split_pct == 0 (outside (0,1]) -> ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /fundraising/campaigns"
              payload: { name: "C", campaign_type: "CATALOG", goal_cents: 100000, profit_split_pct: 0, vendor_name: "V", starts_at: "2026-04-01T00:00:00Z", ends_at: "2026-05-01T00:00:00Z" }
              as: CampaignAdmin
              captures: { eid: $.data.error_id }
          assert:
            - "response data.error_id == ERR_INVALID_REQUEST"
            - "http status == 422"

      - name: create_order_empty_lines_returns_invalid_request
        claim_type: Type Constraints
        grounds: [entities.Order.fields.lines, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Order create with empty lines array -> ERR_INVALID_REQUEST (422); lines must be non-empty."
        test_recipe:
          setup: ["ACTIVE CATALOG campaign, 1 seller, 1 product, 1 prize tier."]
          setup_api_calls:
            - call: "POST /fundraising/campaigns"
              payload: { name: "C", campaign_type: "CATALOG", goal_cents: 100000, profit_split_pct: 0.50, vendor_name: "V", starts_at: "2026-04-01T00:00:00Z", ends_at: "2026-05-01T00:00:00Z" }
              as: CampaignAdmin
              captures: { camp_id: $.data.id }
            - call: "POST /fundraising/prize-tiers"
              payload: { campaign_id: "${camp_id}", label: "T1", threshold_cents: 5000, prize_description: "p" }
              as: CampaignAdmin
            - call: "POST /fundraising/sellers"
              payload: { campaign_id: "${camp_id}", display_name: "S", guardian_email: "g@x.com" }
              as: CampaignAdmin
              captures: { seller_id: $.data.id }
            - call: "POST /fundraising/products"
              payload: { campaign_id: "${camp_id}", sku: "WRAP", name: "Wrap", unit_price_cents: 2000, unit_cost_cents: 800, stock_qty: 100 }
              as: CampaignAdmin
            - call: "POST /fundraising/campaigns/${camp_id}/activate"
              payload: {}
              as: CampaignAdmin
          trigger:
            - call: "POST /fundraising/orders"
              payload: { campaign_id: "${camp_id}", seller_id: "${seller_id}", buyer_name: "B", buyer_email: "b@x.com", lines: [] }
              as: CampaignAdmin
              captures: { eid: $.data.error_id }
          assert:
            - "response data.error_id == ERR_INVALID_REQUEST"
            - "http status == 422"

      - name: pledge_default_flat_and_cap_applied_when_omitted
        claim_type: Defaults
        grounds: [entities.Pledge.fields.flat_cents, entities.Pledge.fields.cap_cents, calculations.pledge_amount_due]
        distinguishing_aspect: "Omitting flat_cents and cap_cents on pledge create -> flat_cents defaults 0, cap_cents defaults 0 (uncapped); pledged_amount_cents at units 0 == 0."
        test_recipe:
          setup: ["ACTIVE PLEDGE campaign, 1 seller, 1 prize tier."]
          setup_api_calls:
            - call: "POST /fundraising/campaigns"
              payload: { name: "C", campaign_type: "PLEDGE", goal_cents: 100000, profit_split_pct: 1.0, vendor_name: "Self", starts_at: "2026-04-01T00:00:00Z", ends_at: "2026-05-01T00:00:00Z" }
              as: CampaignAdmin
              captures: { camp_id: $.data.id }
            - call: "POST /fundraising/prize-tiers"
              payload: { campaign_id: "${camp_id}", label: "T1", threshold_cents: 1000, prize_description: "p" }
              as: CampaignAdmin
            - call: "POST /fundraising/sellers"
              payload: { campaign_id: "${camp_id}", display_name: "S", guardian_email: "g@x.com" }
              as: CampaignAdmin
              captures: { seller_id: $.data.id }
            - call: "POST /fundraising/campaigns/${camp_id}/activate"
              payload: {}
              as: CampaignAdmin
          trigger:
            - call: "POST /fundraising/pledges"
              payload: { campaign_id: "${camp_id}", seller_id: "${seller_id}", donor_name: "D", donor_email: "d@x.com", per_unit_cents: 100 }
              as: CampaignAdmin
              captures: { pid: $.data.id, flat: $.data.flat_cents, cap: $.data.cap_cents, amt: $.data.pledged_amount_cents }
          assert:
            - "Pledge.${pid}.flat_cents == 0"
            - "Pledge.${pid}.cap_cents == 0"
            - "Pledge.${pid}.pledged_amount_cents == 0"

      - name: system_fields_minted_and_input_ignored_on_seller_create
        claim_type: System Fields
        grounds: [entities.Seller.fields.share_slug, entities.Seller.fields.status]
        distinguishing_aspect: "Seller create mints id/created_at/share_slug and sets status=ACTIVE; client-supplied status/share_slug in body are ignored (not in input schema), share_slug is server-minted and non-empty."
        test_recipe:
          setup: ["A DRAFT campaign exists."]
          setup_api_calls:
            - call: "POST /fundraising/campaigns"
              payload: { name: "C", campaign_type: "CATALOG", goal_cents: 100000, profit_split_pct: 0.50, vendor_name: "V", starts_at: "2026-04-01T00:00:00Z", ends_at: "2026-05-01T00:00:00Z" }
              as: CampaignAdmin
              captures: { camp_id: $.data.id }
          trigger:
            - call: "POST /fundraising/sellers"
              payload: { campaign_id: "${camp_id}", display_name: "S", guardian_email: "g@x.com" }
              as: CampaignAdmin
              captures: { sid: $.data.id, slug: $.data.share_slug, st: $.data.status }
          assert:
            - "http status == 201"
            - "Seller.${sid}.status == ACTIVE"
            - "Seller.${sid}.share_slug is a non-empty server-minted string"

      - name: pledge_cap_clamps_amount
        claim_type: Computed Fields
        grounds: [calculations.pledge_amount_due, entities.Pledge.fields.pledged_amount_cents]
        distinguishing_aspect: "pledge with flat 1000, per_unit 250, cap 5000 recorded at units 30 -> raw 8500 clamps to cap 5000 (min applied after the sum)."
        test_recipe:
          setup: ["ACTIVE PLEDGE campaign, 1 seller, 1 prize tier; one PROMISED pledge flat 1000 per_unit 250 cap 5000."]
          setup_api_calls:
            - call: "POST /fundraising/campaigns"
              payload: { name: "C", campaign_type: "PLEDGE", goal_cents: 100000, profit_split_pct: 1.0, vendor_name: "Self", starts_at: "2026-04-01T00:00:00Z", ends_at: "2026-05-01T00:00:00Z" }
              as: CampaignAdmin
              captures: { camp_id: $.data.id }
            - call: "POST /fundraising/prize-tiers"
              payload: { campaign_id: "${camp_id}", label: "T1", threshold_cents: 1000, prize_description: "p" }
              as: CampaignAdmin
            - call: "POST /fundraising/sellers"
              payload: { campaign_id: "${camp_id}", display_name: "S", guardian_email: "g@x.com" }
              as: CampaignAdmin
              captures: { seller_id: $.data.id }
            - call: "POST /fundraising/campaigns/${camp_id}/activate"
              payload: {}
              as: CampaignAdmin
            - call: "POST /fundraising/pledges"
              payload: { campaign_id: "${camp_id}", seller_id: "${seller_id}", donor_name: "D", donor_email: "d@x.com", per_unit_cents: 250, flat_cents: 1000, cap_cents: 5000 }
              as: CampaignAdmin
              captures: { pid: $.data.id }
          trigger:
            - call: "POST /fundraising/pledges/${pid}/record"
              payload: { units_recorded: 30 }
              as: CampaignAdmin
              captures: { amt: $.data.pledged_amount_cents }
          assert:
            - "Pledge.${pid}.pledged_amount_cents == 5000"

      - name: list_campaigns_pagination_envelope
        claim_type: Listing
        grounds: [endpoints./fundraising/campaigns]
        distinguishing_aspect: "GET /fundraising/campaigns returns array envelope with total_count and has_more; limit=1 over 2 campaigns yields has_more true, total_count 2."
        test_recipe:
          setup: ["Two campaigns created."]
          setup_api_calls:
            - call: "POST /fundraising/campaigns"
              payload: { name: "C1", campaign_type: "CATALOG", goal_cents: 100000, profit_split_pct: 0.50, vendor_name: "V", starts_at: "2026-04-01T00:00:00Z", ends_at: "2026-05-01T00:00:00Z" }
              as: CampaignAdmin
            - call: "POST /fundraising/campaigns"
              payload: { name: "C2", campaign_type: "PLEDGE", goal_cents: 100000, profit_split_pct: 1.0, vendor_name: "V", starts_at: "2026-04-01T00:00:00Z", ends_at: "2026-05-01T00:00:00Z" }
              as: CampaignAdmin
          trigger:
            - call: "GET /fundraising/campaigns"
              payload: { limit: 1, offset: 0 }
              as: SchoolOfficial
          assert:
            - "response meta present; response_type == array"
            - "total_count == 2 AND has_more == true AND len(data) == 1"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: activate_without_seller_returns_invalid_state
        claim_type: Precondition Enforcement
        grounds: [state_machines.Campaign.DRAFT_to_ACTIVE]
        distinguishing_aspect: "Activating a CATALOG campaign that has a prize tier but ZERO sellers -> ERR_INVALID_STATE (activation precondition: >= 1 Seller)."
        test_recipe:
          setup: ["DRAFT CATALOG campaign with 1 prize tier and no sellers."]
          setup_api_calls:
            - call: "POST /fundraising/campaigns"
              payload: { name: "C", campaign_type: "CATALOG", goal_cents: 100000, profit_split_pct: 0.50, vendor_name: "V", starts_at: "2026-04-01T00:00:00Z", ends_at: "2026-05-01T00:00:00Z" }
              as: CampaignAdmin
              captures: { camp_id: $.data.id }
            - call: "POST /fundraising/prize-tiers"
              payload: { campaign_id: "${camp_id}", label: "T1", threshold_cents: 5000, prize_description: "p" }
              as: CampaignAdmin
          trigger:
            - call: "POST /fundraising/campaigns/${camp_id}/activate"
              payload: {}
              as: CampaignAdmin
              captures: { eid: $.data.error_id }
          assert:
            - "response data.error_id == ERR_INVALID_STATE"
            - "http status == 409"

      - name: confirm_order_before_paid_returns_invalid_state
        claim_type: Precondition Enforcement
        grounds: [state_machines.Order.PLACED_to_CONFIRMED]
        distinguishing_aspect: "Confirming a PLACED order whose payment_status is still PENDING -> ERR_INVALID_STATE (confirm requires payment_status == PAID)."
        test_recipe:
          setup: ["ACTIVE CATALOG campaign, 1 seller, 1 product, 1 prize tier; one PLACED+PENDING order."]
          setup_api_calls:
            - call: "POST /fundraising/campaigns"
              payload: { name: "C", campaign_type: "CATALOG", goal_cents: 100000, profit_split_pct: 0.50, vendor_name: "V", starts_at: "2026-04-01T00:00:00Z", ends_at: "2026-05-01T00:00:00Z" }
              as: CampaignAdmin
              captures: { camp_id: $.data.id }
            - call: "POST /fundraising/prize-tiers"
              payload: { campaign_id: "${camp_id}", label: "T1", threshold_cents: 5000, prize_description: "p" }
              as: CampaignAdmin
            - call: "POST /fundraising/sellers"
              payload: { campaign_id: "${camp_id}", display_name: "S", guardian_email: "g@x.com" }
              as: CampaignAdmin
              captures: { seller_id: $.data.id }
            - call: "POST /fundraising/products"
              payload: { campaign_id: "${camp_id}", sku: "WRAP", name: "Wrap", unit_price_cents: 2000, unit_cost_cents: 800, stock_qty: 100 }
              as: CampaignAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /fundraising/campaigns/${camp_id}/activate"
              payload: {}
              as: CampaignAdmin
            - call: "POST /fundraising/orders"
              payload: { campaign_id: "${camp_id}", seller_id: "${seller_id}", buyer_name: "B", buyer_email: "b@x.com", lines: [ { product_id: "${prod_id}", quantity: 2 } ] }
              as: CampaignAdmin
              captures: { o_id: $.data.id }
          trigger:
            - call: "POST /fundraising/orders/${o_id}/confirm"
              payload: {}
              as: CampaignAdmin
              captures: { eid: $.data.error_id }
          assert:
            - "response data.error_id == ERR_INVALID_STATE"
            - "http status == 409"

      - name: cancel_already_cancelled_pledge_returns_invalid_state
        claim_type: Idempotency
        grounds: [state_machines.Pledge.PROMISED_to_CANCELLED]
        distinguishing_aspect: "Cancelling a pledge twice: second cancel from terminal CANCELLED -> ERR_INVALID_STATE; no side effects."
        test_recipe:
          setup: ["ACTIVE PLEDGE campaign, 1 seller, 1 prize tier; one PROMISED pledge already CANCELLED."]
          setup_api_calls:
            - call: "POST /fundraising/campaigns"
              payload: { name: "C", campaign_type: "PLEDGE", goal_cents: 100000, profit_split_pct: 1.0, vendor_name: "Self", starts_at: "2026-04-01T00:00:00Z", ends_at: "2026-05-01T00:00:00Z" }
              as: CampaignAdmin
              captures: { camp_id: $.data.id }
            - call: "POST /fundraising/prize-tiers"
              payload: { campaign_id: "${camp_id}", label: "T1", threshold_cents: 1000, prize_description: "p" }
              as: CampaignAdmin
            - call: "POST /fundraising/sellers"
              payload: { campaign_id: "${camp_id}", display_name: "S", guardian_email: "g@x.com" }
              as: CampaignAdmin
              captures: { seller_id: $.data.id }
            - call: "POST /fundraising/campaigns/${camp_id}/activate"
              payload: {}
              as: CampaignAdmin
            - call: "POST /fundraising/pledges"
              payload: { campaign_id: "${camp_id}", seller_id: "${seller_id}", donor_name: "D", donor_email: "d@x.com", per_unit_cents: 0, flat_cents: 2000 }
              as: CampaignAdmin
              captures: { pid: $.data.id }
            - call: "POST /fundraising/pledges/${pid}/cancel"
              payload: {}
              as: CampaignAdmin
          trigger:
            - call: "POST /fundraising/pledges/${pid}/cancel"
              payload: {}
              as: CampaignAdmin
              captures: { eid: $.data.error_id }
          assert:
            - "response data.error_id == ERR_INVALID_STATE"
            - "http status == 409"

      - name: disburse_from_disbursed_terminal_returns_invalid_state
        claim_type: Terminal State Lockdown
        grounds: [state_machines.Campaign.RECONCILED_to_DISBURSED, "validations[priority=13]"]
        distinguishing_aspect: "From terminal DISBURSED, a second disburse -> ERR_INVALID_STATE (double disburse blocked); DISBURSED is terminal."
        test_recipe:
          setup: ["A campaign driven CLOSED -> RECONCILED -> DISBURSED."]
          setup_api_calls:
            - call: "POST /fundraising/campaigns"
              payload: { name: "C", campaign_type: "PLEDGE", goal_cents: 100000, profit_split_pct: 1.0, vendor_name: "Self", starts_at: "2026-04-01T00:00:00Z", ends_at: "2026-05-01T00:00:00Z" }
              as: CampaignAdmin
              captures: { camp_id: $.data.id }
            - call: "POST /fundraising/prize-tiers"
              payload: { campaign_id: "${camp_id}", label: "T1", threshold_cents: 1000, prize_description: "p" }
              as: CampaignAdmin
            - call: "POST /fundraising/sellers"
              payload: { campaign_id: "${camp_id}", display_name: "S", guardian_email: "g@x.com" }
              as: CampaignAdmin
            - call: "POST /fundraising/campaigns/${camp_id}/activate"
              payload: {}
              as: CampaignAdmin
            - call: "POST /fundraising/campaigns/${camp_id}/close"
              payload: {}
              as: CampaignAdmin
              captures: { v_closed: $.data.version }
            - call: "POST /fundraising/campaigns/${camp_id}/reconcile"
              payload: { expected_campaign_version: "${v_closed}" }
              as: Treasurer
              captures: { v_recon: $.data.version }
            - call: "POST /fundraising/campaigns/${camp_id}/disburse"
              payload: { expected_campaign_version: "${v_recon}" }
              as: Treasurer
              captures: { v_disb: $.data.version }
          trigger:
            - call: "POST /fundraising/campaigns/${camp_id}/disburse"
              payload: { expected_campaign_version: "${v_disb}" }
              as: Treasurer
              captures: { eid: $.data.error_id }
          assert:
            - "response data.error_id == ERR_INVALID_STATE"
            - "http status == 409"

      - name: reconcile_before_close_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.Campaign.CLOSED_to_RECONCILED, "validations[priority=13]"]
        distinguishing_aspect: "Reconcile on an ACTIVE (not CLOSED) campaign -> ERR_INVALID_STATE; reconcile is only legal from CLOSED."
        test_recipe:
          setup: ["ACTIVE PLEDGE campaign (1 seller, 1 tier), not closed."]
          setup_api_calls:
            - call: "POST /fundraising/campaigns"
              payload: { name: "C", campaign_type: "PLEDGE", goal_cents: 100000, profit_split_pct: 1.0, vendor_name: "Self", starts_at: "2026-04-01T00:00:00Z", ends_at: "2026-05-01T00:00:00Z" }
              as: CampaignAdmin
              captures: { camp_id: $.data.id }
            - call: "POST /fundraising/prize-tiers"
              payload: { campaign_id: "${camp_id}", label: "T1", threshold_cents: 1000, prize_description: "p" }
              as: CampaignAdmin
            - call: "POST /fundraising/sellers"
              payload: { campaign_id: "${camp_id}", display_name: "S", guardian_email: "g@x.com" }
              as: CampaignAdmin
            - call: "POST /fundraising/campaigns/${camp_id}/activate"
              payload: {}
              as: CampaignAdmin
              captures: { v_active: $.data.version }
          trigger:
            - call: "POST /fundraising/campaigns/${camp_id}/reconcile"
              payload: { expected_campaign_version: "${v_active}" }
              as: Treasurer
              captures: { eid: $.data.error_id }
          assert:
            - "response data.error_id == ERR_INVALID_STATE"
            - "http status == 409"

      - name: cancel_paid_order_returns_paid_order_not_cancellable
        claim_type: Precondition Enforcement
        grounds: [state_machines.Order.CONFIRMED_to_CANCELLED, "validations[priority=13]", "errors[ERR_PAID_ORDER_NOT_CANCELLABLE]"]
        distinguishing_aspect: "Cancelling a PAID order via the cancel endpoint -> ERR_PAID_ORDER_NOT_CANCELLABLE (must refund); cancel precondition payment_status != PAID."
        test_recipe:
          setup: ["ACTIVE CATALOG campaign, 1 seller, 1 product, 1 tier; one order PAID (still PLACED fulfillment)."]
          setup_api_calls:
            - call: "POST /fundraising/campaigns"
              payload: { name: "C", campaign_type: "CATALOG", goal_cents: 100000, profit_split_pct: 0.50, vendor_name: "V", starts_at: "2026-04-01T00:00:00Z", ends_at: "2026-05-01T00:00:00Z" }
              as: CampaignAdmin
              captures: { camp_id: $.data.id }
            - call: "POST /fundraising/prize-tiers"
              payload: { campaign_id: "${camp_id}", label: "T1", threshold_cents: 5000, prize_description: "p" }
              as: CampaignAdmin
            - call: "POST /fundraising/sellers"
              payload: { campaign_id: "${camp_id}", display_name: "S", guardian_email: "g@x.com" }
              as: CampaignAdmin
              captures: { seller_id: $.data.id }
            - call: "POST /fundraising/products"
              payload: { campaign_id: "${camp_id}", sku: "WRAP", name: "Wrap", unit_price_cents: 2000, unit_cost_cents: 800, stock_qty: 100 }
              as: CampaignAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /fundraising/campaigns/${camp_id}/activate"
              payload: {}
              as: CampaignAdmin
            - call: "POST /fundraising/orders"
              payload: { campaign_id: "${camp_id}", seller_id: "${seller_id}", buyer_name: "B", buyer_email: "b@x.com", lines: [ { product_id: "${prod_id}", quantity: 2 } ] }
              as: CampaignAdmin
              captures: { o_id: $.data.id }
            - call: "POST /fundraising/orders/${o_id}/pay"
              payload: {}
              as: CampaignAdmin
          trigger:
            - call: "POST /fundraising/orders/${o_id}/cancel"
              payload: {}
              as: CampaignAdmin
              captures: { eid: $.data.error_id }
          assert:
            - "response data.error_id == ERR_PAID_ORDER_NOT_CANCELLABLE"
            - "http status == 409"

      - name: deliver_allowed_after_campaign_closed
        claim_type: Valid Transition
        grounds: [state_machines.Order.CONFIRMED_to_DELIVERED]
        distinguishing_aspect: "A CONFIRMED+PAID order can still be delivered after the campaign is CLOSED (deliver precondition allows posture CLOSED), moving fulfillment to DELIVERED."
