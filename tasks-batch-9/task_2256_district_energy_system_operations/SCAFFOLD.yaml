scenario: |
  2256. District Energy System Operations (district heating and cooling utility): production plant dispatch across boilers, chillers and thermal storage with load forecasting by weather and building schedules, distribution network operation with pressure, temperature and flow management across long piping loops, customer connection agreements with capacity reservation, rate structure and metering points, thermal energy metering, billing determinant calculation and rate application by customer class, network expansion planning with new customer connection economics and pipe sizing, maintenance and leak detection on buried piping with excavation and repair coordination, resilience planning with redundant capacity and fuel supply diversity, emissions and efficiency reporting against city climate goals

domain_name: district-energy-system-operations
api_prefix: "/district-energy"

complexity_profile:
  primary_archetype: quota_allocation_engine
  secondary_archetype: pricing_billing_engine
  difficulty_band: beyond_expert
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - optimistic_concurrency
    - selector_policy
    - derived_field_reconciliation
    - rate_threshold_triggers
  entity_topology: graph
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - many_to_many
    - self_referential
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

entities:
  - name: NetworkLoop
    parent: null
    common_fields: true
    fields:
      - name: code
        type: string
        source: input
        description: operator-facing loop identifier
        constraints: unique across all NetworkLoop rows; 1-32 chars
      - name: name
        type: string
        source: input
        description: human readable loop name
      - name: service_mode
        type: enum
        source: input
        description: thermal service the loop distributes
        constraints: "one of HEATING, COOLING, DUAL"
      - name: design_supply_temp_c
        type: number
        source: input
        description: design supply temperature in degrees Celsius
      - name: max_pressure_kpa
        type: number
        source: input
        description: maximum allowable distribution pressure in kPa
        constraints: "> 0"
      - name: rated_capacity_kw
        type: number
        source: input
        description: nameplate thermal capacity of the loop in kW
        constraints: "> 0"
      - name: posture
        type: enum
        source: computed
        description: operating posture derived from cascades in state_machines.NetworkLoop
        default: NORMAL
        constraints: "one of NORMAL, CONSTRAINED, ISOLATED"
      - name: committed_reserved_kw
        type: number
        source: computed
        description: sum of ConnectionAgreement.reserved_capacity_kw for agreements on this loop whose contract_state IN {ACTIVE, SUSPENDED}
        default: 0.0
      - name: open_isolation_count
        type: integer
        source: computed
        description: count of WorkOrder rows on this loop with requires_isolation == true and work_state IN {EXCAVATING, REPAIRING, BACKFILLED}
        default: 0
      - name: suspect_segment_count
        type: integer
        source: computed
        description: count of PipeSegment rows on this loop whose condition == SUSPECT
        default: 0

  - name: PipeSegment
    parent: NetworkLoop
    common_fields: true
    fields:
      - name: loop_id
        type: string
        source: input
        description: FK -> NetworkLoop.id; the loop this buried segment belongs to
      - name: upstream_segment_id
        type: string
        source: input
        description: FK -> PipeSegment.id; hydraulically upstream segment, null for the plant header segment
        default: null
      - name: code
        type: string
        source: input
        description: segment identifier
        constraints: unique within loop_id
      - name: length_m
        type: number
        source: input
        description: buried pipe run length in metres
        constraints: "> 0"
      - name: diameter_mm
        type: integer
        source: input
        description: nominal internal diameter in millimetres
        constraints: "> 0"
      - name: install_year
        type: integer
        source: input
        description: calendar year the segment was buried
      - name: insulation_class
        type: enum
        source: input
        description: insulation condition class used by segment_leak_risk_score
        constraints: "one of A, B, C"
      - name: makeup_water_ratio
        type: number
        source: input
        description: makeup water volume divided by loop circulating volume over the last assessment period
        default: 0.0
        constraints: ">= 0"
      - name: historical_leak_count
        type: integer
        source: input
        description: number of confirmed leaks recorded on this segment
        default: 0
      - name: buried_depth_m
        type: number
        source: input
        description: cover depth over the crown of the pipe in metres
      - name: leak_risk_score
        type: number
        source: computed
        description: weighted leak risk from calculations.segment_leak_risk_score
        default: 0.0
      - name: condition
        type: enum
        source: computed
        description: condition band derived from leak_risk_score and repair transitions
        default: SOUND
        constraints: "one of SOUND, MONITORED, SUSPECT, UNDER_REPAIR"

  - name: FuelSupplyContract
    parent: null
    common_fields: true
    fields:
      - name: supplier_code
        type: string
        source: input
        description: supplier identifier
        constraints: unique across all FuelSupplyContract rows
      - name: fuel_type
        type: enum
        source: input
        description: energy carrier delivered under this contract
        constraints: "one of NATURAL_GAS, BIOMASS, ELECTRICITY, WASTE_HEAT, FUEL_OIL"
      - name: contracted_energy_mwh_per_year
        type: number
        source: input
        description: firm annual contracted energy in MWh
        constraints: "> 0"
      - name: price_per_mwh
        type: number
        source: input
        description: delivered fuel price per MWh
      - name: delivery_firmness
        type: enum
        source: input
        description: whether deliveries may be interrupted
        constraints: "one of FIRM, INTERRUPTIBLE"
      - name: status
        type: enum
        source: computed
        description: contract status driven by state_machines.FuelSupplyContract
        default: ACTIVE
        constraints: "one of ACTIVE, SUSPENDED, EXPIRED"

  - name: ProductionAsset
    parent: NetworkLoop
    common_fields: true
    fields:
      - name: loop_id
        type: string
        source: input
        description: FK -> NetworkLoop.id; loop this asset injects into
      - name: fuel_contract_id
        type: string
        source: input
        description: FK -> FuelSupplyContract.id; supply contract feeding this asset, null for THERMAL_STORAGE
        default: null
      - name: code
        type: string
        source: input
        description: asset identifier
        constraints: unique within loop_id
      - name: asset_type
        type: enum
        source: input
        description: production technology
        constraints: "one of BOILER, CHILLER, CHP, BIOMASS_BOILER, THERMAL_STORAGE"
      - name: rated_capacity_kw
        type: number
        source: input
        description: nameplate output in kW
        constraints: "> 0"
      - name: derated_capacity_kw
        type: number
        source: input
        description: output ceiling in kW while availability_state == DERATED
        default: 0.0
      - name: min_stable_output_kw
        type: number
        source: input
        description: minimum stable output in kW below which the asset cannot be dispatched
        default: 0.0
      - name: marginal_cost_per_mwh
        type: number
        source: input
        description: variable production cost per MWh, primary merit-order sort key
      - name: emission_factor_kg_per_mwh
        type: number
        source: input
        description: CO2e emitted per MWh produced, merit-order tie-break key
      - name: storage_capacity_kwh
        type: number
        source: input
        description: usable thermal storage energy in kWh, 0 for non-storage assets
        default: 0.0
      - name: state_of_charge_kwh
        type: number
        source: input
        description: stored thermal energy in kWh available for discharge
        default: 0.0
        constraints: ">= 0 and <= storage_capacity_kwh"
      - name: availability_state
        type: enum
        source: computed
        description: availability driven by state_machines.ProductionAsset
        default: AVAILABLE
        constraints: "one of AVAILABLE, DERATED, OUTAGE"

  - name: LoadForecast
    parent: NetworkLoop
    common_fields: true
    fields:
      - name: loop_id
        type: string
        source: input
        description: FK -> NetworkLoop.id; loop the forecast covers
      - name: service_date
        type: datetime
        source: input
        description: UTC start instant of the 24-hour service block being forecast
      - name: heating_degree_hours
        type: number
        source: input
        description: weather-normal heating degree hours over the service block
        default: 0.0
        constraints: ">= 0"
      - name: cooling_degree_hours
        type: number
        source: input
        description: weather-normal cooling degree hours over the service block
        default: 0.0
        constraints: ">= 0"
      - name: actual_heating_degree_hours
        type: number
        source: input
        description: metered actual heating degree hours, supplied only when publishing the ACTUAL_WEIGHTED_FINAL variant
        default: null
      - name: actual_cooling_degree_hours
        type: number
        source: input
        description: metered actual cooling degree hours, supplied only when publishing the ACTUAL_WEIGHTED_FINAL variant
        default: null
      - name: occupancy_profile
        type: enum
        source: input
        description: building schedule profile applied to the block
        constraints: "one of WEEKDAY_FULL, WEEKEND_REDUCED, HOLIDAY_MINIMAL"
      - name: variant_applied
        type: enum
        source: computed
        description: which calculations.forecast_load_projection variant produced the stored numbers
        default: null
        constraints: "one of WEATHER_NORMAL_PROVISIONAL, ACTUAL_WEIGHTED_FINAL"
      - name: coincident_demand_kw
        type: number
        source: computed
        description: loop coincident peak demand in kW from calculations.forecast_load_projection
        default: 0.0
      - name: projected_energy_mwh
        type: number
        source: computed
        description: projected block energy in MWh from calculations.forecast_load_projection
        default: 0.0
      - name: contributing_agreement_count
        type: integer
        source: computed
        description: number of ConnectionAgreement rows that entered the forecast input set
        default: 0
      - name: forecast_state
        type: enum
        source: computed
        description: lifecycle driven by state_machines.LoadForecast
        default: DRAFT
        constraints: "one of DRAFT, PUBLISHED, SUPERSEDED"

  - name: DispatchPlan
    parent: NetworkLoop
    common_fields: true
    fields:
      - name: loop_id
        type: string
        source: input
        description: FK -> NetworkLoop.id; loop being dispatched
      - name: forecast_id
        type: string
        source: input
        description: FK -> LoadForecast.id; the PUBLISHED forecast this plan serves
      - name: block_hours
        type: number
        source: computed
        description: dispatch block duration in hours, always the DISPATCH_BLOCK_HOURS constant
        default: 24.0
      - name: authored_by_user_id
        type: string
        source: system
        description: X-User-ID of the DispatchOperator that created the plan
      - name: reviewed_by_user_id
        type: string
        source: system
        description: X-User-ID of the SystemController that reviewed the plan, null before review
        default: null
      - name: allocated_capacity_kw
        type: number
        source: computed
        description: sum of DispatchOrder.allocated_kw for this plan
        default: 0.0
      - name: unserved_demand_kw
        type: number
        source: computed
        description: coincident demand left unallocated after the merit-order waterfall
        default: 0.0
      - name: total_dispatch_cost
        type: number
        source: computed
        description: sum of DispatchOrder.order_cost for this plan
        default: 0.0
      - name: total_emissions_kg
        type: number
        source: computed
        description: sum of DispatchOrder.order_emissions_kg for this plan
        default: 0.0
      - name: reserve_margin_pct
        type: number
        source: computed
        description: N-1 reserve margin percentage from calculations.plan_reliability_metrics
        default: 0.0
      - name: fuel_diversity_hhi
        type: number
        source: computed
        description: Herfindahl-Hirschman fuel concentration index from calculations.plan_reliability_metrics
        default: 0.0
      - name: plan_state
        type: enum
        source: computed
        description: lifecycle driven by state_machines.DispatchPlan
        default: DRAFT
        constraints: "one of DRAFT, SUBMITTED, APPROVED, COMMITTED, RECONCILED, SUPERSEDED"

  - name: DispatchOrder
    parent: DispatchPlan
    common_fields: false
    fields:
      - name: plan_id
        type: string
        source: system
        description: FK -> DispatchPlan.id; plan that generated this order
      - name: asset_id
        type: string
        source: system
        description: FK -> ProductionAsset.id; asset instructed by this order
      - name: merit_rank
        type: integer
        source: computed
        description: 1-based position of the asset in the merit-order ranking
      - name: allocated_kw
        type: number
        source: computed
        description: capacity allocated to this asset in kW
      - name: block_energy_mwh
        type: number
        source: computed
        description: energy the asset produces over the block in MWh
      - name: discharged_kwh
        type: number
        source: computed
        description: thermal storage energy drawn in kWh, 0.0 for non-storage assets
        default: 0.0
      - name: order_cost
        type: number
        source: computed
        description: block_energy_mwh multiplied by ProductionAsset.marginal_cost_per_mwh
      - name: order_emissions_kg
        type: number
        source: computed
        description: block_energy_mwh multiplied by ProductionAsset.emission_factor_kg_per_mwh

  - name: RateSchedule
    parent: null
    common_fields: true
    fields:
      - name: code
        type: string
        source: input
        description: tariff identifier
        constraints: unique across all RateSchedule rows
      - name: customer_class
        type: enum
        source: input
        description: customer class this tariff applies to
        constraints: "one of RESIDENTIAL_MULTIFAMILY, COMMERCIAL_OFFICE, HOSPITAL, UNIVERSITY, INDUSTRIAL_PROCESS"
      - name: fixed_service_charge
        type: number
        source: input
        description: monthly fixed service charge in currency units
        constraints: ">= 0"
      - name: demand_charge_per_kw
        type: number
        source: input
        description: charge per kW of billed demand
        constraints: ">= 0"
      - name: minimum_bill_amount
        type: number
        source: input
        description: floor applied to the invoice total before arrears evaluation
        constraints: ">= 0"
      - name: ratchet_lookback_months
        type: integer
        source: input
        description: number of months of prior invoices that feed the demand ratchet
        default: 11
      - name: tiers
        type: array
        source: input
        description: ordered tier list, each object {load_factor_max, energy_rate_per_mwh}, sorted by load_factor_max ascending
        constraints: at least one tier; load_factor_max strictly increasing; last tier is the fallback tier

  - name: ConnectionAgreement
    parent: NetworkLoop
    common_fields: true
    fields:
      - name: loop_id
        type: string
        source: input
        description: FK -> NetworkLoop.id; loop supplying this customer
      - name: rate_schedule_id
        type: string
        source: input
        description: FK -> RateSchedule.id; tariff applied to this customer
      - name: customer_name
        type: string
        source: input
        description: customer legal name
      - name: customer_class
        type: enum
        source: input
        description: customer class, must equal RateSchedule.customer_class
        constraints: "one of RESIDENTIAL_MULTIFAMILY, COMMERCIAL_OFFICE, HOSPITAL, UNIVERSITY, INDUSTRIAL_PROCESS"
      - name: reserved_capacity_kw
        type: number
        source: input
        description: contractually reserved thermal capacity in kW
        constraints: "> 0"
      - name: service_mode
        type: enum
        source: input
        description: thermal service requested, must be compatible with NetworkLoop.service_mode
        constraints: "one of HEATING, COOLING, DUAL"
      - name: service_start_date
        type: datetime
        source: input
        description: UTC instant service begins, inclusive
      - name: service_end_date
        type: datetime
        source: input
        description: UTC instant service ends, exclusive
      - name: billed_demand_ratchet_kw
        type: number
        source: computed
        description: highest billed_demand_kw over the ratchet window, updated when an Invoice reaches ISSUED or ADJUSTED
        default: 0.0
      - name: balance_due
        type: number
        source: computed
        description: sum of Invoice.total_amount for this agreement whose invoice_state IN {ISSUED, ADJUSTED}
        default: 0.0
      - name: contract_state
        type: enum
        source: computed
        description: contract dimension of state_machines.ConnectionAgreement
        default: PENDING_CAPACITY
        constraints: "one of PENDING_CAPACITY, ACTIVE, SUSPENDED, TERMINATED"
      - name: billing_state
        type: enum
        source: computed
        description: billing dimension of state_machines.ConnectionAgreement, independent of contract_state
        default: CURRENT
        constraints: "one of CURRENT, IN_ARREARS, WRITTEN_OFF"

  - name: MeteringPoint
    parent: ConnectionAgreement
    common_fields: true
    fields:
      - name: agreement_id
        type: string
        source: input
        description: FK -> ConnectionAgreement.id; agreement this meter bills against
      - name: segment_id
        type: string
        source: input
        description: FK -> PipeSegment.id; segment the service branch taps
      - name: code
        type: string
        source: input
        description: meter identifier
        constraints: unique across all MeteringPoint rows
      - name: multiplier
        type: number
        source: input
        description: register multiplier applied to raw cumulative energy
        default: 1.0
        constraints: "> 0"
      - name: last_reading_energy_mwh
        type: number
        source: computed
        description: cumulative_energy_mwh of the newest MeterReading for this point, 0.0 when none exists
        default: 0.0
      - name: reading_count
        type: integer
        source: computed
        description: number of MeterReading rows recorded against this point
        default: 0
      - name: meter_state
        type: enum
        source: computed
        description: lifecycle driven by state_machines.MeteringPoint
        default: INSTALLED
        constraints: "one of INSTALLED, COMMISSIONED, REMOVED"

  - name: MeterReading
    parent: MeteringPoint
    common_fields: false
    fields:
      - name: point_id
        type: string
        source: input
        description: FK -> MeteringPoint.id; meter that produced this reading
      - name: read_at
        type: datetime
        source: input
        description: UTC instant of the register read
      - name: cumulative_energy_mwh
        type: number
        source: input
        description: raw cumulative register value in MWh, monotonically non-decreasing per point
        constraints: ">= 0"
      - name: peak_demand_kw
        type: number
        source: input
        description: highest 15-minute demand in kW observed since the previous read
        constraints: ">= 0"
      - name: read_type
        type: enum
        source: input
        description: whether the register value was metered or synthesised
        constraints: "one of ACTUAL, ESTIMATED"
      - name: multiplied_energy_mwh
        type: number
        source: computed
        description: cumulative_energy_mwh multiplied by MeteringPoint.multiplier, rounded to 3 decimals round_half_up

  - name: Invoice
    parent: ConnectionAgreement
    common_fields: true
    fields:
      - name: agreement_id
        type: string
        source: input
        description: FK -> ConnectionAgreement.id; agreement being billed
      - name: period_start
        type: datetime
        source: input
        description: UTC billing period start, inclusive
      - name: period_end
        type: datetime
        source: input
        description: UTC billing period end, exclusive
      - name: variant_applied
        type: enum
        source: computed
        description: which calculations.invoice_billing_determinants variant produced the stored numbers
        constraints: "one of ESTIMATED, ACTUAL_TRUE_UP"
      - name: billed_energy_mwh
        type: number
        source: computed
        description: billing determinant energy in MWh
        default: 0.0
      - name: billed_demand_kw
        type: number
        source: computed
        description: billing determinant demand in kW after the reserved floor and ratchet
        default: 0.0
      - name: load_factor_pct
        type: number
        source: computed
        description: load factor percentage selecting the energy tier
        default: 0.0
      - name: energy_charge
        type: number
        source: computed
        description: tiered energy charge
        default: 0.0
      - name: demand_charge
        type: number
        source: computed
        description: billed_demand_kw multiplied by RateSchedule.demand_charge_per_kw
        default: 0.0
      - name: fixed_charge
        type: number
        source: computed
        description: RateSchedule.fixed_service_charge copied at calculation time
        default: 0.0
      - name: total_amount
        type: number
        source: computed
        description: invoice total after the minimum bill floor
        default: 0.0
      - name: minimum_bill_applied
        type: boolean
        source: computed
        description: true when the minimum bill floor raised the total
        default: false
      - name: paid_amount
        type: number
        source: computed
        description: amount recorded by the payment endpoint, 0.0 until paid
        default: 0.0
      - name: invoice_state
        type: enum
        source: computed
        description: lifecycle driven by state_machines.Invoice
        default: DRAFT
        constraints: "one of DRAFT, ISSUED, ADJUSTED, PAID, VOID"

  - name: WorkOrder
    parent: PipeSegment
    common_fields: true
    fields:
      - name: segment_id
        type: string
        source: input
        description: FK -> PipeSegment.id; buried segment being worked
      - name: loop_id
        type: string
        source: input
        description: FK -> NetworkLoop.id; loop the segment belongs to, must equal PipeSegment.loop_id
      - name: work_type
        type: enum
        source: input
        description: nature of the field work
        constraints: "one of LEAK_REPAIR, INSPECTION, VALVE_REPLACEMENT"
      - name: window_start
        type: datetime
        source: input
        description: UTC start of the requested work window, inclusive
      - name: window_end
        type: datetime
        source: input
        description: UTC end of the requested work window, inclusive
      - name: requires_isolation
        type: boolean
        source: input
        description: whether the segment must be hydraulically isolated for the work
        default: false
      - name: reported_by_user_id
        type: string
        source: system
        description: X-User-ID of the FieldTechnician that created the work order
      - name: completed_by_user_id
        type: string
        source: system
        description: X-User-ID of the FieldTechnician that completed the work order, null before completion
        default: null
      - name: permit_decision
        type: enum
        source: computed
        description: excavation permit outcome recorded by the NetworkEngineer
        default: PENDING
        constraints: "one of PENDING, GRANTED, DENIED"
      - name: work_state
        type: enum
        source: computed
        description: lifecycle driven by state_machines.WorkOrder
        default: DRAFT
        constraints: "one of DRAFT, PERMIT_PENDING, SCHEDULED, EXCAVATING, REPAIRING, BACKFILLED, COMPLETED, CANCELLED"

  - name: ExpansionProject
    parent: NetworkLoop
    common_fields: true
    fields:
      - name: loop_id
        type: string
        source: input
        description: FK -> NetworkLoop.id; loop the candidate would connect to
      - name: rate_schedule_id
        type: string
        source: input
        description: FK -> RateSchedule.id; tariff assumed for the connection economics
      - name: candidate_customer_name
        type: string
        source: input
        description: prospective customer name
      - name: customer_class
        type: enum
        source: input
        description: assumed customer class, must equal RateSchedule.customer_class
        constraints: "one of RESIDENTIAL_MULTIFAMILY, COMMERCIAL_OFFICE, HOSPITAL, UNIVERSITY, INDUSTRIAL_PROCESS"
      - name: requested_capacity_kw
        type: number
        source: input
        description: capacity the candidate would reserve in kW
        constraints: "> 0"
      - name: route_length_m
        type: number
        source: input
        description: new buried pipe route length in metres
        constraints: "> 0"
      - name: assumed_annual_energy_mwh
        type: number
        source: input
        description: assumed annual delivered energy in MWh used for revenue projection
        constraints: "> 0"
      - name: assumed_marginal_cost_per_mwh
        type: number
        source: input
        description: assumed variable production cost per MWh used for the margin projection
        constraints: ">= 0"
      - name: design_delta_t_c
        type: number
        source: input
        description: design supply-return temperature difference in Kelvin used for flow sizing
        constraints: "> 0"
      - name: selected_diameter_mm
        type: integer
        source: computed
        description: smallest feasible standard diameter from calculations.expansion_sizing_and_npv
        default: null
      - name: design_flow_m3_per_h
        type: number
        source: computed
        description: design volumetric flow in cubic metres per hour
        default: 0.0
      - name: estimated_capex
        type: number
        source: computed
        description: pipe plus connection capital cost
        default: 0.0
      - name: annual_net_margin
        type: number
        source: computed
        description: projected annual revenue less variable and fixed cost
        default: 0.0
      - name: npv
        type: number
        source: computed
        description: 20-year net present value at 6 percent from calculations.expansion_sizing_and_npv
        default: 0.0
      - name: project_state
        type: enum
        source: computed
        description: lifecycle driven by state_machines.ExpansionProject
        default: SCREENING
        constraints: "one of SCREENING, SIZED, APPROVED, REJECTED, CONVERTED"

state_machines:
  - entity: NetworkLoop
    initial_state: NORMAL
    terminal_states: []
    transitions:
      - from: NORMAL
        to: CONSTRAINED
        trigger: "system event: cascade from POST /district-energy/fuel-supply-contracts/{contract_id}/status with status=SUSPENDED reverted an APPROVED DispatchPlan on this loop"
        actor: system
        preconditions: ["NetworkLoop.posture == NORMAL", "at least one DispatchPlan on this loop was reverted from APPROVED to DRAFT by this cascade"]
        side_effects: ["sets NetworkLoop.posture = CONSTRAINED", "increments NetworkLoop.version by 1", "refreshes NetworkLoop.updated_at"]
      - from: CONSTRAINED
        to: NORMAL
        trigger: "system event: cascade from POST /district-energy/dispatch-plans/{plan_id}/review with decision=APPROVE"
        actor: system
        preconditions: ["NetworkLoop.posture == CONSTRAINED", "NetworkLoop.open_isolation_count == 0", "the approved DispatchPlan.reserve_margin_pct >= MIN_RESERVE_MARGIN_PCT"]
        side_effects: ["sets NetworkLoop.posture = NORMAL", "increments NetworkLoop.version by 1"]
      - from: NORMAL
        to: ISOLATED
        trigger: "system event: cascade from POST /district-energy/work-orders/{work_order_id}/begin-excavation on a WorkOrder with requires_isolation == true"
        actor: system
        preconditions: ["NetworkLoop.posture == NORMAL", "WorkOrder.requires_isolation == true"]
        side_effects: ["sets NetworkLoop.posture = ISOLATED", "increments NetworkLoop.open_isolation_count by 1", "increments NetworkLoop.version by 1"]
      - from: CONSTRAINED
        to: ISOLATED
        trigger: "system event: cascade from POST /district-energy/work-orders/{work_order_id}/begin-excavation on a WorkOrder with requires_isolation == true"
        actor: system
        preconditions: ["NetworkLoop.posture == CONSTRAINED", "WorkOrder.requires_isolation == true"]
        side_effects: ["sets NetworkLoop.posture = ISOLATED", "increments NetworkLoop.open_isolation_count by 1", "increments NetworkLoop.version by 1"]
      - from: ISOLATED
        to: NORMAL
        trigger: "system event: cascade from POST /district-energy/work-orders/{work_order_id}/complete"
        actor: system
        preconditions: ["NetworkLoop.open_isolation_count == 0 after this cascade decremented it", "NetworkLoop.suspect_segment_count == 0 after this cascade recomputed it"]
        side_effects: ["sets NetworkLoop.posture = NORMAL", "increments NetworkLoop.version by 1"]
      - from: ISOLATED
        to: CONSTRAINED
        trigger: "system event: cascade from POST /district-energy/work-orders/{work_order_id}/complete"
        actor: system
        preconditions: ["NetworkLoop.open_isolation_count == 0 after this cascade decremented it", "NetworkLoop.suspect_segment_count > 0 after this cascade recomputed it"]
        side_effects: ["sets NetworkLoop.posture = CONSTRAINED", "increments NetworkLoop.version by 1"]

