# =============================================================================
# Court Interpreter Certification & Assignment — scaffold seed tables (§1.0–§1.7)
# Task 2775 · state court interpreter program
# =============================================================================

scenario: |
  Court Interpreter Certification & Assignment (state court interpreter program):
  language credential tiers with written and oral examination requirements and
  ethics training, roster maintenance with credential status, language coverage
  and geographic availability, assignment scheduling from case calendars with
  priority for hearing types and remote versus in-person delivery, remote
  interpreting technology standards and equipment requirements in courtrooms,
  rate schedule, minimum call time and travel reimbursement rules, complaint and
  quality review of interpreter performance with disciplinary process, rare
  language coverage through provisional qualification and telephonic services,
  language access plan compliance and unmet-need reporting.

domain_name: court-interpreter-program

# Endpoint paths are root-relative (no shared collection prefix): the program has
# several peer top-level collections (/interpreters, /credentials, /hearings,
# /assignments, /pay-claims, /complaints, ...) rather than one owning aggregate.
api_prefix: "/"

complexity_profile:
  primary_archetype: temporal_windowing
  secondary_archetype: compliance_audit
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - optimistic_concurrency
    - rate_threshold_triggers
    - ops_run_checkpoint

  entity_topology: flat
  # Peer entities linked by explicit foreign keys; only two nested URL segments
  # exist (/credentials/{id}/exam-attempts, /courthouses/{id}/unmet-need-reports)
  # and both are pure reverse-reachability reads.

  state_machine_shape: cyclic
  # Credential loops ACTIVE→LAPSED→ACTIVE (renewal cycle) and ACTIVE→ACTIVE
  # (early renewal self-loop); Complaint loops APPEALED→FILED (remand);
  # Assignment carries two independent dimensions (service_status ×
  # compliance_status) that evolve without ordering between them.

  relationship_patterns:
    - one_to_many          # Courthouse→Hearing, Interpreter→Credential, Credential→ExamAttempt
    - many_to_many         # Interpreter×Language resolved through Credential
    - cross_aggregate      # PayClaim reads Assignment→Hearing→Courthouse and a pinned RateSchedule

  role_model: segregation_of_duties
  # The QualityReviewer user who filed a complaint may not be the QualityReviewer
  # user who records the review recommendation; adjudication sits with a third
  # role (ProgramAdmin) and payment approval with a fourth (FiscalOfficer).

  consistency_model: immediate

  difficulty_level: expert_plus
  # 12 entities · 55 endpoints · 47 error codes · 9 calculations · 37 ordered
  # validations · 8 state-machine blocks (Assignment declares two independent
  # dimensions) · 2 OCC stale-version rules.

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  # --- configuration -------------------------------------------------------
  - name: Language
    parent: null
    common_fields: true
    fields:
      - { name: code, type: string, source: input, description: "ISO-639-3 language code, unique across Language", constraints: "3 lowercase letters; unique" }
      - { name: name, type: string, source: input, description: "Display name of the language" }
      - { name: tier_class, type: enum, source: input, description: "Program coverage class of the language", constraints: "DESIGNATED | NON_DESIGNATED | RARE" }
      - { name: oral_exam_available, type: boolean, source: input, description: "True when the program administers an oral performance exam in this language" }
      - { name: telephonic_vendor_available, type: boolean, source: input, default: false, description: "True when a telephonic language-service vendor covers this language" }
      - { name: active_credentialed_count, type: integer, source: computed, description: "Count of Credential rows for this language with status == ACTIVE" }

  - name: Courthouse
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Courthouse name" }
      - { name: county_code, type: string, source: input, description: "3-letter county code used for geographic-availability ranking", constraints: "3 uppercase letters" }
      - { name: courtroom_count, type: integer, source: input, description: "Number of courtrooms in the facility", constraints: ">= 1" }
      - { name: remote_equipment_tier, type: enum, source: input, description: "Certified remote-interpreting technology level installed", constraints: "NONE | BASIC | CERTIFIED_VRI" }
      - { name: vri_concurrent_capacity, type: integer, source: input, description: "Number of VRI-equipped courtrooms that can run video remote interpreting at once", constraints: ">= 0" }
      - { name: status, type: enum, source: input, default: OPEN, description: "Facility availability for in-person interpreting", constraints: "OPEN | CLOSED" }
      - { name: pay_budget_cents, type: integer, source: input, description: "Fiscal-year interpreter pay authority for this facility, in cents", constraints: ">= 0" }
      - { name: encumbered_pay_cents, type: integer, source: computed, description: "SUM(PayClaim.provisional_total_cents) over PayClaim rows with status == ENCUMBERED whose Assignment.hearing_id resolves to a Hearing with courthouse_id == this Courthouse.id" }
      - { name: obligated_pay_cents, type: integer, source: computed, description: "SUM(PayClaim.final_total_cents) over PayClaim rows with status IN {FINALIZED, SUBMITTED, APPROVED, PAID} whose Assignment.hearing_id resolves to a Hearing with courthouse_id == this Courthouse.id" }
      - { name: available_pay_cents, type: integer, source: computed, description: "= pay_budget_cents - encumbered_pay_cents - obligated_pay_cents" }

  - name: RateSchedule
    parent: null
    common_fields: true
    fields:
      - { name: effective_from, type: string, source: input, description: "First date (YYYY-MM-DD, inclusive) this schedule governs, matched against Hearing.scheduled_start date" }
      - { name: effective_through, type: string, source: input, default: null, description: "Last date (YYYY-MM-DD, inclusive) this schedule governs; null means open-ended" }
      - { name: master_hourly_cents, type: integer, source: input, description: "Hourly rate in cents for MASTER-tier service" }
      - { name: certified_hourly_cents, type: integer, source: input, description: "Hourly rate in cents for CERTIFIED-tier service" }
      - { name: registered_hourly_cents, type: integer, source: input, description: "Hourly rate in cents for REGISTERED-tier service" }
      - { name: provisional_hourly_cents, type: integer, source: input, description: "Hourly rate in cents for PROVISIONAL-tier service" }
      - { name: minimum_call_hours, type: number, source: input, description: "Minimum-call-time floor in hours applied to billable_hours" }
      - { name: travel_mileage_rate_cents, type: number, source: input, description: "Reimbursement per reimbursable mile, in cents (may carry one decimal)" }
      - { name: travel_free_radius_miles, type: number, source: input, description: "One-way mileage at or below which no travel reimbursement is owed" }
      - { name: remote_rate_multiplier, type: number, source: input, description: "Multiplier applied to the service component for VRI and TELEPHONIC delivery" }
      - { name: late_cancellation_hours, type: integer, source: input, description: "Lead-time threshold in hours below which a cancellation is compensated" }
      - { name: late_cancellation_pay_hours, type: number, source: input, description: "Hours paid on a late cancellation" }
      - { name: rare_premium_low_pct, type: number, source: input, description: "Rare-language premium rate applied when the rounded service component is below rare_premium_bracket_cents" }
      - { name: rare_premium_high_pct, type: number, source: input, description: "Rare-language premium rate applied when the rounded service component is at or above rare_premium_bracket_cents" }
      - { name: rare_premium_bracket_cents, type: integer, source: input, description: "Rounded-service-component breakpoint selecting the rare-language premium rate" }

  # --- roster & credentialing ----------------------------------------------
  - name: Interpreter
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Interpreter legal name" }
      - { name: email, type: string, source: input, description: "Contact email, unique across Interpreter", constraints: "unique" }
      - { name: phone, type: string, source: input, default: null, description: "Contact phone" }
      - { name: home_county_code, type: string, source: input, description: "County of record, compared with Courthouse.county_code for geographic-availability ranking", constraints: "3 uppercase letters" }
      - { name: accepts_in_person, type: boolean, source: input, default: true, description: "Willing to take IN_PERSON assignments" }
      - { name: accepts_remote, type: boolean, source: input, default: true, description: "Willing to take VRI and TELEPHONIC assignments" }
      - { name: roster_status, type: enum, source: system, default: APPLICANT, description: "Roster lifecycle state", constraints: "APPLICANT | CANDIDATE | ACTIVE | SUSPENDED | INACTIVE | REVOKED" }
      - { name: ethics_training_status, type: enum, source: system, default: NOT_STARTED, description: "Ethics-training state; gates PENDING_ETHICS -> ACTIVE on every Credential", constraints: "NOT_STARTED | COMPLETED" }
      - { name: ethics_completed_on, type: string, source: system, default: null, description: "Date (YYYY-MM-DD) the ethics course was completed" }
      - { name: credential_tier, type: enum, source: computed, description: "Highest tier among this interpreter's Credential rows with status == ACTIVE, else NONE", constraints: "MASTER | CERTIFIED | REGISTERED | PROVISIONAL | NONE" }
      - { name: credentialed_language_ids, type: array, source: computed, description: "language_id values of Credential rows for this interpreter with status == ACTIVE, ordered by Credential.created_at ASC" }
      - { name: complaint_points, type: integer, source: computed, description: "SUM(DisciplinaryAction.points) over rows with interpreter_id == this id and status IN {IN_EFFECT, EXPIRED}" }
      - { name: rolling_12_month_score, type: number, source: computed, description: "Quality score variant ROLLING_12_MONTH (see calculations.interpreter_quality_score)" }
      - { name: lifetime_score, type: number, source: computed, description: "Quality score variant LIFETIME (see calculations.interpreter_quality_score)" }
      - { name: pending_pay_cents, type: integer, source: computed, description: "SUM(PayClaim.final_total_cents) over this interpreter's PayClaim rows with status IN {FINALIZED, SUBMITTED, APPROVED}" }
      - { name: paid_pay_cents, type: integer, source: computed, description: "SUM(PayClaim.final_total_cents) over this interpreter's PayClaim rows with status == PAID" }
      - { name: suspension_through, type: string, source: system, default: null, description: "Date (YYYY-MM-DD) through which a SUSPENSION DisciplinaryAction keeps roster_status == SUSPENDED" }

  - name: Credential
    parent: null
    common_fields: true
    fields:
      - { name: interpreter_id, type: string, source: input, description: "FK -> Interpreter.id; the credential holder" }
      - { name: language_id, type: string, source: input, description: "FK -> Language.id; the credentialed language" }
      - { name: target_tier, type: enum, source: input, description: "Tier being pursued; fixed at creation", constraints: "MASTER | CERTIFIED | REGISTERED | PROVISIONAL" }
      - { name: tier, type: enum, source: computed, description: "= target_tier once status == ACTIVE, else null" }
      - { name: status, type: enum, source: system, default: PENDING_WRITTEN, description: "Credential lifecycle state", constraints: "PENDING_WRITTEN | PENDING_ORAL | PENDING_ETHICS | ACTIVE | LAPSED | DENIED | WITHDRAWN | REVOKED" }
      - { name: written_best_score, type: number, source: computed, default: null, description: "MAX(ExamAttempt.score) over attempts of this credential with exam_type == WRITTEN, null when none" }
      - { name: oral_best_score, type: number, source: computed, default: null, description: "MAX(ExamAttempt.score) over attempts of this credential with exam_type == ORAL, null when none" }
      - { name: written_attempt_count, type: integer, source: computed, default: 0, description: "COUNT(ExamAttempt) for this credential with exam_type == WRITTEN" }
      - { name: oral_attempt_count, type: integer, source: computed, default: 0, description: "COUNT(ExamAttempt) for this credential with exam_type == ORAL" }
      - { name: issued_on, type: string, source: system, default: null, description: "Date (YYYY-MM-DD) of the first PENDING_ETHICS -> ACTIVE transition" }
      - { name: expires_on, type: string, source: system, default: null, description: "Date (YYYY-MM-DD) the current cycle ends; 730 days after issue/renewal for MASTER/CERTIFIED/REGISTERED, 365 days for PROVISIONAL" }
      - { name: grace_through, type: string, source: computed, default: null, description: "= expires_on + 90 days; last date a LAPSED credential may be renewed" }
      - { name: cycle_credit_hours, type: number, source: system, default: 0, description: "Continuing-education hours recorded for the current cycle by the most recent renewal" }
      - { name: renewal_count, type: integer, source: computed, default: 0, description: "Number of successful renew calls on this credential" }

  - name: ExamAttempt
    parent: Credential
    common_fields: false
    fields:
      - { name: credential_id, type: string, source: system, description: "FK -> Credential.id; the credential application this attempt belongs to" }
      - { name: exam_type, type: enum, source: input, description: "Which examination was taken", constraints: "WRITTEN | ORAL" }
      - { name: score, type: number, source: input, description: "Raw score", constraints: "0 <= score <= 100" }
      - { name: taken_on, type: string, source: input, description: "Date (YYYY-MM-DD) the examination was taken; client-supplied, never compared to the logical clock" }
      - { name: attempt_ordinal, type: integer, source: computed, description: "1-based index of this attempt among the credential's attempts of the same exam_type ordered by taken_on ASC, then created_at ASC" }
      - { name: result, type: enum, source: computed, description: "PASS when score >= the passing floor for credential.target_tier and exam_type, else FAIL", constraints: "PASS | FAIL" }

  # --- calendar & assignment ------------------------------------------------
  - name: Hearing
    parent: null
    common_fields: true
    fields:
      - { name: courthouse_id, type: string, source: input, description: "FK -> Courthouse.id; where the hearing sits on the calendar" }
      - { name: language_id, type: string, source: input, description: "FK -> Language.id; language the hearing needs" }
      - { name: case_number, type: string, source: input, description: "Court case number" }
      - { name: hearing_type, type: enum, source: input, description: "Calendar event type driving priority weight", constraints: "ARRAIGNMENT | DETENTION_REVIEW | TRIAL | PLEA | SENTENCING | MOTION | CIVIL_MOTION" }
      - { name: in_custody, type: boolean, source: input, description: "True when the limited-English party is in custody" }
      - { name: scheduled_start, type: datetime, source: input, description: "Hearing start (ISO 8601 UTC, three fractional digits)" }
      - { name: scheduled_end, type: datetime, source: input, description: "Hearing end (ISO 8601 UTC); must be strictly after scheduled_start" }
      - { name: requested_delivery_mode, type: enum, source: input, description: "Delivery mode the calendar requests", constraints: "IN_PERSON | VRI | TELEPHONIC" }
      - { name: status, type: enum, source: system, default: SCHEDULED, description: "Coverage lifecycle state", constraints: "SCHEDULED | COVERED | SERVED | UNMET | CONTINUED" }
      - { name: lead_time_days, type: integer, source: computed, description: "floor((scheduled_start - logical clock at creation) / 86400 seconds), floored at 0; frozen at creation" }
      - { name: priority_score, type: integer, source: computed, description: "See calculations.hearing_priority_score; frozen at creation" }
      - { name: priority_class, type: enum, source: computed, description: "A when priority_score >= 80, B when >= 55, else C; frozen at creation", constraints: "A | B | C" }
      - { name: continuance_count, type: integer, source: computed, default: 0, description: "Number of continue calls applied to this hearing" }
      - { name: continuance_reason_code, type: enum, source: system, default: null, description: "Reason recorded by the most recent continue call", constraints: "COURT_CONGESTION | PARTY_REQUEST | NO_INTERPRETER_AVAILABLE" }

  - name: Assignment
    parent: null
    common_fields: true
    fields:
      - { name: hearing_id, type: string, source: input, description: "FK -> Hearing.id; the calendar event served" }
      - { name: interpreter_id, type: string, source: input, default: null, description: "FK -> Interpreter.id; null exactly when vendor_served == true" }
      - { name: credential_id, type: string, source: system, default: null, description: "FK -> Credential.id; the ACTIVE credential pinned at creation for hearing.language_id" }
      - { name: credential_tier_snapshot, type: enum, source: system, default: null, description: "Credential.tier copied at creation; the pay tier even if the credential later lapses", constraints: "MASTER | CERTIFIED | REGISTERED | PROVISIONAL" }
      - { name: delivery_mode, type: enum, source: input, description: "Actual delivery mode of this assignment", constraints: "IN_PERSON | VRI | TELEPHONIC" }
      - { name: vendor_served, type: boolean, source: input, default: false, description: "True when a telephonic language-service vendor covers the hearing instead of a rostered interpreter" }
      - { name: estimated_one_way_miles, type: number, source: input, default: 0, description: "One-way mileage claimed at creation; drives the PROVISIONAL travel component" }
      - { name: actual_one_way_miles, type: number, source: system, default: null, description: "One-way mileage reported on complete; drives the FINAL travel component" }
      - { name: service_status, type: enum, source: system, default: PROPOSED, description: "Service dimension of the assignment", constraints: "PROPOSED | CONFIRMED | CHECKED_IN | COMPLETED | DECLINED | CANCELLED | SUPERSEDED | NO_SHOW" }
      - { name: compliance_status, type: enum, source: system, default: CLEAR, description: "Quality dimension of the assignment; evolves independently of service_status", constraints: "CLEAR | UNDER_QUALITY_REVIEW | SUBSTANTIATED_DEFECT" }
      - { name: check_in_utc, type: datetime, source: system, default: null, description: "Logical-clock instant recorded by check-in; FINAL billable window start" }
      - { name: actual_end_utc, type: datetime, source: system, default: null, description: "Client-reported end instant recorded by complete; FINAL billable window end" }
      - { name: cancel_reason_code, type: enum, source: system, default: null, description: "Why the assignment left PROPOSED/CONFIRMED without service", constraints: "INTERPRETER_DECLINED | COURT_CONTINUANCE | INTERPRETER_SUSPENDED | CREDENTIAL_LAPSED | CREDENTIAL_REVOKED | EQUIPMENT_WITHDRAWN | COORDINATOR_CANCELLED" }

  - name: PayClaim
    parent: null
    common_fields: true
    fields:
      - { name: assignment_id, type: string, source: system, description: "FK -> Assignment.id; the served assignment being compensated" }
      - { name: rate_schedule_id, type: string, source: system, description: "FK -> RateSchedule.id; the schedule pinned when the claim was created, used for both variants" }
      - { name: variant, type: enum, source: computed, description: "Which calculation variant produced the currently authoritative totals", constraints: "PROVISIONAL | FINAL" }
      - { name: status, type: enum, source: system, default: ENCUMBERED, description: "Claim lifecycle state", constraints: "ENCUMBERED | FINALIZED | SUBMITTED | APPROVED | PAID | VOIDED" }
      - { name: billable_hours, type: number, source: computed, description: "Hours the authoritative variant bills, after quarter-hour round-up and the minimum-call floor" }
      - { name: service_cents, type: integer, source: computed, description: "Rounded service component of the authoritative variant" }
      - { name: rare_premium_cents, type: integer, source: computed, description: "Rounded rare-language premium component of the authoritative variant" }
      - { name: travel_cents, type: integer, source: computed, description: "Rounded travel component of the authoritative variant" }
      - { name: provisional_total_cents, type: integer, source: computed, description: "Total from the PROVISIONAL variant, frozen when the claim was created at confirm" }
      - { name: final_total_cents, type: integer, source: computed, default: null, description: "Total from the FINAL variant; null until the claim reaches FINALIZED" }
      - { name: late_cancellation, type: boolean, source: computed, default: false, description: "True when the FINAL variant was produced by the late-cancellation or no-show path" }
      - { name: payment_reference, type: string, source: system, default: null, description: "Warrant reference recorded when the claim reaches PAID" }

  # --- quality review & discipline ------------------------------------------
  - name: Complaint
    parent: null
    common_fields: true
    fields:
      - { name: interpreter_id, type: string, source: input, description: "FK -> Interpreter.id; the interpreter complained about" }
      - { name: assignment_id, type: string, source: input, default: null, description: "FK -> Assignment.id; the assignment complained about, null for roster-level complaints" }
      - { name: category, type: enum, source: input, description: "Nature of the complaint", constraints: "ACCURACY | ETHICS | PROFESSIONALISM | NO_SHOW" }
      - { name: severity, type: enum, source: input, description: "Intake severity, constrains the sanctions available at adjudication", constraints: "MINOR | MAJOR | SEVERE" }
      - { name: narrative, type: string, source: input, description: "Intake narrative" }
      - { name: filed_by_user_id, type: string, source: system, description: "X-User-ID of the caller who filed the complaint" }
      - { name: reviewer_user_id, type: string, source: system, default: null, description: "X-User-ID of the QualityReviewer who recorded the review; must differ from filed_by_user_id" }
      - { name: reviewer_recommendation, type: enum, source: system, default: null, description: "Recommendation recorded by the review step", constraints: "SUBSTANTIATE | DISMISS" }
      - { name: adjudicator_user_id, type: string, source: system, default: null, description: "X-User-ID of the ProgramAdmin who adjudicated" }
      - { name: disposition, type: enum, source: system, default: null, description: "Adjudicated outcome", constraints: "SUBSTANTIATED | DISMISSED" }
      - { name: status, type: enum, source: system, default: FILED, description: "Complaint workflow state", constraints: "FILED | REVIEWED | SUBSTANTIATED | DISMISSED | APPEALED | UPHELD | VACATED" }
      - { name: adjudicated_at, type: datetime, source: system, default: null, description: "Logical-clock instant of the adjudicate call; starts the 30-day appeal window" }
      - { name: appeal_filed_at, type: datetime, source: system, default: null, description: "Logical-clock instant of the appeal call" }
      - { name: remand_count, type: integer, source: computed, default: 0, description: "Number of times an appeal decision returned this complaint to FILED" }

  - name: DisciplinaryAction
    parent: null
    common_fields: true
    fields:
      - { name: complaint_id, type: string, source: system, description: "FK -> Complaint.id; the adjudication that produced this sanction" }
      - { name: interpreter_id, type: string, source: system, description: "FK -> Interpreter.id; copied from the complaint" }
      - { name: action_type, type: enum, source: system, description: "Sanction imposed", constraints: "LETTER | PROBATION | SUSPENSION | REVOCATION" }
      - { name: points, type: integer, source: computed, description: "Points from SANCTION_POINTS keyed on action_type (LETTER 5, PROBATION 10, SUSPENSION 12, REVOCATION 20)" }
      - { name: effective_from, type: string, source: system, description: "Date (YYYY-MM-DD) of the adjudicate call on the logical clock" }
      - { name: effective_through, type: string, source: system, default: null, description: "Last date the sanction is in effect; null for REVOCATION (permanent)" }
      - { name: status, type: enum, source: system, default: IN_EFFECT, description: "Sanction lifecycle state", constraints: "IN_EFFECT | EXPIRED | RESCINDED" }

  # --- language-access reporting --------------------------------------------
  - name: UnmetNeedReport
    parent: null
    common_fields: false
    fields:
      - { name: courthouse_id, type: string, source: input, description: "FK -> Courthouse.id; facility the report covers" }
      - { name: period_start, type: string, source: input, description: "Reporting window start date (YYYY-MM-DD), inclusive on Hearing.scheduled_start" }
      - { name: period_end, type: string, source: input, description: "Reporting window end date (YYYY-MM-DD), exclusive on Hearing.scheduled_start; must be strictly after period_start" }
      - { name: resolved_hearing_count, type: integer, source: computed, description: "COUNT(Hearing) with this courthouse_id, scheduled_start in [period_start T00:00:00Z, period_end T00:00:00Z), status IN {SERVED, UNMET}" }
      - { name: served_hearing_count, type: integer, source: computed, description: "Same window and filter, status == SERVED" }
      - { name: unmet_hearing_count, type: integer, source: computed, description: "Same window and filter, status == UNMET" }
      - { name: rare_language_unmet_count, type: integer, source: computed, description: "Same window, status == UNMET, restricted to hearings whose Language.tier_class == RARE" }
      - { name: coverage_rate_pct, type: number, source: computed, description: "See calculations.language_access_coverage; 2 decimals, round_half_up; exactly 100.00 when resolved_hearing_count == 0" }
      - { name: compliance_status, type: enum, source: computed, description: "Language-access-plan verdict for the window", constraints: "COMPLIANT | CORRECTIVE_ACTION_REQUIRED | NON_COMPLIANT" }
      - { name: by_language, type: object, source: computed, description: "Map of Language.code -> { resolved: integer, served: integer, unmet: integer } over the same window, keys ordered by Language.code ASC" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Interpreter
    initial_state: APPLICANT
    terminal_states: [REVOKED]
    transitions:
      - from: APPLICANT
        to: CANDIDATE
        trigger: "system, on POST /credentials creating this interpreter's first Credential"
        actor: system
        preconditions: ["Interpreter.roster_status == APPLICANT"]
        side_effects:
          - "Interpreter.roster_status = CANDIDATE"
          - "increments Interpreter.version by 1"
      - from: CANDIDATE
        to: ACTIVE
        trigger: "system, on the first Credential PENDING_ETHICS -> ACTIVE transition for this interpreter"
        actor: system
        preconditions: ["Interpreter.roster_status == CANDIDATE", "at least one Credential of this interpreter has status == ACTIVE"]
        side_effects:
          - "Interpreter.roster_status = ACTIVE"
          - "recomputes Interpreter.credential_tier and Interpreter.credentialed_language_ids"
          - "increments Interpreter.version by 1"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "system, caused by a DisciplinaryAction with action_type == SUSPENSION reaching IN_EFFECT (hop 2 of the adjudication cascade)"
        actor: system
        preconditions: ["Interpreter.roster_status == ACTIVE"]
        side_effects:
          - "Interpreter.roster_status = SUSPENDED"
          - "Interpreter.suspension_through = DisciplinaryAction.effective_through"
          - "Interpreter.complaint_points recomputed (+= DisciplinaryAction.points)"
          - "recomputes Interpreter.rolling_12_month_score and Interpreter.lifetime_score"
          - "cascade hop 3: every Assignment of this interpreter with service_status IN {PROPOSED, CONFIRMED} whose Hearing.scheduled_start date <= Interpreter.suspension_through transitions to CANCELLED with cancel_reason_code = INTERPRETER_SUSPENDED, processed in Assignment.created_at ASC order"
          - "increments Interpreter.version by 1"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "system, on POST /ops/daily-sweep once logical-clock date > Interpreter.suspension_through, or caused by the interpreter's only IN_EFFECT SUSPENSION action becoming RESCINDED by an appeal decision with outcome == VACATED"
        actor: system
        preconditions: ["Interpreter.roster_status == SUSPENDED", "no DisciplinaryAction with interpreter_id == this id, action_type == SUSPENSION and status == IN_EFFECT whose effective_through >= logical-clock date remains"]
        side_effects:
          - "Interpreter.roster_status = ACTIVE"
          - "Interpreter.suspension_through = null"
          - "Interpreter.complaint_points recomputed (RESCINDED actions drop out; EXPIRED actions stay)"
          - "recomputes Interpreter.rolling_12_month_score and Interpreter.lifetime_score"
          - "increments Interpreter.version by 1"
        note: "Assignments cancelled during the suspension are never resurrected; only complaint_points and roster_status are restored."
      - from: ACTIVE
        to: INACTIVE
        trigger: "system, caused by the interpreter's last ACTIVE Credential leaving ACTIVE (hop 3 of the lapse cascade, or a revoke)"
        actor: system
        preconditions: ["Interpreter.roster_status == ACTIVE", "count of this interpreter's Credential rows with status == ACTIVE == 0"]
        side_effects:
          - "Interpreter.roster_status = INACTIVE"
          - "Interpreter.credential_tier = NONE"
          - "Interpreter.credentialed_language_ids = []"
          - "cascade hop 4: every Assignment of this interpreter with service_status IN {PROPOSED, CONFIRMED} transitions to CANCELLED with cancel_reason_code = CREDENTIAL_LAPSED, processed in Assignment.created_at ASC order"
          - "increments Interpreter.version by 1"
      - from: INACTIVE
        to: ACTIVE
        trigger: "system, on a Credential LAPSED -> ACTIVE renewal for this interpreter"
        actor: system
        preconditions: ["Interpreter.roster_status == INACTIVE", "at least one Credential of this interpreter has status == ACTIVE"]
        side_effects:
          - "Interpreter.roster_status = ACTIVE"
          - "recomputes Interpreter.credential_tier and Interpreter.credentialed_language_ids"
          - "increments Interpreter.version by 1"
      - from: ACTIVE
        to: REVOKED
        trigger: "system, caused by a DisciplinaryAction with action_type == REVOCATION reaching IN_EFFECT"
        actor: system
        preconditions: ["Interpreter.roster_status IN {ACTIVE, SUSPENDED, INACTIVE}"]
        side_effects:
          - "Interpreter.roster_status = REVOKED"
          - "every Credential of this interpreter with status IN {PENDING_WRITTEN, PENDING_ORAL, PENDING_ETHICS, ACTIVE, LAPSED} transitions to REVOKED, processed in Credential.created_at ASC order"
          - "every Assignment of this interpreter with service_status IN {PROPOSED, CONFIRMED} transitions to CANCELLED with cancel_reason_code = INTERPRETER_SUSPENDED"
          - "increments Interpreter.version by 1"
        note: "REVOKED is terminal; SUSPENDED and INACTIVE reach it by the same system trigger."

  - entity: Credential
    initial_state: PENDING_WRITTEN
    terminal_states: [DENIED, WITHDRAWN, REVOKED]
    transitions:
      - from: PENDING_WRITTEN
        to: PENDING_ETHICS
        trigger: "system, immediately on POST /credentials when target_tier == PROVISIONAL (rare-language provisional qualification requires no examination)"
        actor: system
        preconditions: ["Credential.target_tier == PROVISIONAL", "Language.tier_class == RARE for Credential.language_id"]
        side_effects:
          - "Credential.status = PENDING_ETHICS"
          - "increments Credential.version by 1"
        note: "Auto-transition inside the create call: the created resource is returned already in PENDING_ETHICS."
      - from: PENDING_WRITTEN
        to: PENDING_ORAL
        trigger: "POST /credentials/{id}/advance"
        actor: CredentialingOfficer
        preconditions:
          - "Credential.status == PENDING_WRITTEN"
          - "Credential.written_best_score >= written passing floor for target_tier (90 for MASTER, 80 otherwise)"
          - "Language.oral_exam_available == true for Credential.language_id"
          - "Credential.target_tier IN {MASTER, CERTIFIED}"
        side_effects:
          - "Credential.status = PENDING_ORAL"
          - "increments Credential.version by 1"
      - from: PENDING_WRITTEN
        to: PENDING_ETHICS
        trigger: "POST /credentials/{id}/advance"
        actor: CredentialingOfficer
        preconditions:
          - "Credential.status == PENDING_WRITTEN"
          - "Credential.written_best_score >= 80"
          - "Credential.target_tier == REGISTERED"
        side_effects:
          - "Credential.status = PENDING_ETHICS"
          - "increments Credential.version by 1"
        note: "REGISTERED requires the written examination only; no oral performance exam is administered for it."
      - from: PENDING_ORAL
        to: PENDING_ETHICS
        trigger: "POST /credentials/{id}/advance"
        actor: CredentialingOfficer
        preconditions:
          - "Credential.status == PENDING_ORAL"
          - "Credential.oral_best_score >= oral passing floor for target_tier (85 for MASTER, 70 for CERTIFIED)"
        side_effects:
          - "Credential.status = PENDING_ETHICS"
          - "increments Credential.version by 1"
      - from: PENDING_ETHICS
        to: ACTIVE
        trigger: "POST /credentials/{id}/advance"
        actor: CredentialingOfficer
        preconditions:
          - "Credential.status == PENDING_ETHICS"
          - "Interpreter.ethics_training_status == COMPLETED for Credential.interpreter_id"
        side_effects:
          - "Credential.status = ACTIVE, Credential.tier = Credential.target_tier"
          - "Credential.issued_on = logical-clock date"
          - "Credential.expires_on = logical-clock date + 730 days (target_tier IN {MASTER, CERTIFIED, REGISTERED}) or + 365 days (target_tier == PROVISIONAL)"
          - "Credential.grace_through = Credential.expires_on + 90 days"
          - "recomputes Language.active_credentialed_count for Credential.language_id"
          - "bubble up: Interpreter CANDIDATE -> ACTIVE (first ACTIVE credential) or INACTIVE -> ACTIVE, recomputing Interpreter.credential_tier and Interpreter.credentialed_language_ids"
          - "increments Credential.version by 1"
      - from: PENDING_WRITTEN
        to: DENIED
        trigger: "system, on POST /credentials/{id}/exam-attempts when the attempt makes written_attempt_count == 3 and no WRITTEN attempt has result == PASS"
        actor: system
        preconditions: ["Credential.status == PENDING_WRITTEN", "Credential.written_attempt_count == 3", "Credential.written_best_score < written passing floor for target_tier"]
        side_effects:
          - "Credential.status = DENIED"
          - "increments Credential.version by 1"
      - from: PENDING_ORAL
        to: DENIED
        trigger: "system, on POST /credentials/{id}/exam-attempts when the attempt makes oral_attempt_count == 3 and no ORAL attempt has result == PASS"
        actor: system
        preconditions: ["Credential.status == PENDING_ORAL", "Credential.oral_attempt_count == 3", "Credential.oral_best_score < oral passing floor for target_tier"]
        side_effects:
          - "Credential.status = DENIED"
          - "increments Credential.version by 1"
      - from: PENDING_WRITTEN
        to: WITHDRAWN
        trigger: "system, on POST /credentials creating a superseding Credential for the same (interpreter_id, language_id) with a strictly higher target_tier rank"
        actor: system
        preconditions: ["Credential.status IN {PENDING_WRITTEN, PENDING_ORAL, PENDING_ETHICS}", "the new Credential.target_tier rank > this Credential.target_tier rank"]
        side_effects:
          - "Credential.status = WITHDRAWN"
          - "increments Credential.version by 1"
          - "increments Interpreter.version by 1 (the same create call that supersedes this credential)"
        note: "Tier rank: MASTER 3 > CERTIFIED 2 > REGISTERED 1 > PROVISIONAL 0. PENDING_ORAL and PENDING_ETHICS reach WITHDRAWN by the same trigger."
      - from: ACTIVE
        to: LAPSED
        trigger: "POST /ops/daily-sweep, step 1, when logical-clock date > Credential.expires_on"
        actor: system
        preconditions: ["Credential.status == ACTIVE", "logical-clock date > Credential.expires_on"]
        side_effects:
          - "Credential.status = LAPSED, Credential.tier = null"
          - "recomputes Language.active_credentialed_count"
          - "cascade hop 2: recomputes Interpreter.credential_tier and Interpreter.credentialed_language_ids for Credential.interpreter_id"
          - "cascade hop 3: when the recomputed Interpreter.credential_tier == NONE, Interpreter ACTIVE -> INACTIVE (which itself cancels the interpreter's PROPOSED/CONFIRMED assignments as hop 4)"
          - "increments Credential.version by 1"
      - from: LAPSED
        to: ACTIVE
        trigger: "POST /credentials/{id}/renew"
        actor: CredentialingOfficer
        preconditions:
          - "Credential.status == LAPSED"
          - "logical-clock date <= Credential.grace_through"
          - "cycle_credit_hours >= 16"
          - "Interpreter.roster_status != REVOKED for Credential.interpreter_id"
        side_effects:
          - "Credential.status = ACTIVE, Credential.tier = Credential.target_tier"
          - "Credential.expires_on = logical-clock date + 730 days (or + 365 days for PROVISIONAL); Credential.grace_through recomputed"
          - "Credential.cycle_credit_hours = request cycle_credit_hours; Credential.renewal_count += 1"
          - "recomputes Language.active_credentialed_count"
          - "bubble up: Interpreter INACTIVE -> ACTIVE when this is now an ACTIVE credential"
          - "increments Credential.version by 1"
        note: "Reinstatement leg of the renewal cycle: ACTIVE -> LAPSED -> ACTIVE."
      - from: ACTIVE
        to: ACTIVE
        trigger: "POST /credentials/{id}/renew (early renewal, self-loop)"
        actor: CredentialingOfficer
        preconditions: ["Credential.status == ACTIVE", "cycle_credit_hours >= 16"]
        side_effects:
          - "Credential.expires_on = Credential.expires_on + 730 days (or + 365 days for PROVISIONAL); Credential.grace_through recomputed"
          - "Credential.cycle_credit_hours = request cycle_credit_hours; Credential.renewal_count += 1"
          - "increments Credential.version by 1"
        note: "Early renewal extends the existing cycle from expires_on, not from the clock; the LAPSED leg extends from the clock."
      - from: ACTIVE
        to: REVOKED
        trigger: "POST /credentials/{id}/revoke, or system cascade from a REVOCATION DisciplinaryAction"
        actor: ProgramAdmin
        preconditions: ["Credential.status IN {PENDING_WRITTEN, PENDING_ORAL, PENDING_ETHICS, ACTIVE, LAPSED}"]
        side_effects:
          - "Credential.status = REVOKED, Credential.tier = null"
          - "recomputes Language.active_credentialed_count"
          - "recomputes Interpreter.credential_tier; when it becomes NONE, Interpreter ACTIVE -> INACTIVE with its own cascade"
          - "increments Credential.version by 1"

  - entity: Hearing
    initial_state: SCHEDULED
    terminal_states: [SERVED, UNMET, CONTINUED]
    transitions:
      - from: SCHEDULED
        to: COVERED
        trigger: "system, caused by an Assignment for this hearing reaching CONFIRMED"
        actor: system
        preconditions: ["Hearing.status == SCHEDULED"]
        side_effects:
          - "Hearing.status = COVERED"
          - "increments Hearing.version by 1"
      - from: COVERED
        to: SCHEDULED
        trigger: "system, caused by the covering Assignment leaving CONFIRMED via decline, cancel, or a suspension/lapse cascade, when (Hearing.scheduled_start - logical clock) >= RateSchedule.late_cancellation_hours"
        actor: system
        preconditions: ["Hearing.status == COVERED", "(Hearing.scheduled_start - logical clock) >= RateSchedule.late_cancellation_hours in hours"]
        side_effects:
          - "Hearing.status = SCHEDULED"
          - "increments Hearing.version by 1"
      - from: COVERED
        to: UNMET
        trigger: "system, caused by the covering Assignment leaving CONFIRMED with less than RateSchedule.late_cancellation_hours of lead time, or by NO_SHOW"
        actor: system
        preconditions: ["Hearing.status == COVERED", "(Hearing.scheduled_start - logical clock) < RateSchedule.late_cancellation_hours in hours OR the assignment reached NO_SHOW"]
        side_effects:
          - "Hearing.status = UNMET"
          - "increments Hearing.version by 1"
      - from: COVERED
        to: SERVED
        trigger: "system, caused by the covering Assignment reaching COMPLETED"
        actor: system
        preconditions: ["Hearing.status == COVERED", "the covering Assignment.service_status == COMPLETED"]
        side_effects:
          - "Hearing.status = SERVED"
          - "increments Hearing.version by 1"
      - from: SCHEDULED
        to: UNMET
        trigger: "POST /ops/daily-sweep, step 3, when logical clock >= Hearing.scheduled_start and the hearing has no Assignment with service_status IN {CONFIRMED, CHECKED_IN, COMPLETED}"
        actor: system
        preconditions: ["Hearing.status == SCHEDULED", "logical clock >= Hearing.scheduled_start"]
        side_effects:
          - "Hearing.status = UNMET"
          - "every Assignment of this hearing with service_status == PROPOSED transitions to CANCELLED with cancel_reason_code = COORDINATOR_CANCELLED"
          - "increments Hearing.version by 1"
      - from: SCHEDULED
        to: CONTINUED
        trigger: "POST /hearings/{id}/continue"
        actor: SchedulingCoordinator
        preconditions: ["Hearing.status IN {SCHEDULED, COVERED}", "logical clock < Hearing.scheduled_start"]
        side_effects:
          - "Hearing.status = CONTINUED, Hearing.continuance_count += 1, Hearing.continuance_reason_code = request reason_code"
          - "cascade hop 2: every Assignment of this hearing with service_status IN {PROPOSED, CONFIRMED} transitions to CANCELLED with cancel_reason_code = COURT_CONTINUANCE, processed in Assignment.created_at ASC order"
          - "increments Hearing.version by 1"
        note: "COVERED reaches CONTINUED by the same trigger. A continued hearing is terminal; the coordinator files a new Hearing for the new date."

  - entity: Assignment
    initial_state: PROPOSED
    terminal_states: [COMPLETED, DECLINED, CANCELLED, SUPERSEDED, NO_SHOW]
    transitions:
      - from: PROPOSED
        to: CONFIRMED
        trigger: "POST /assignments/{id}/confirm"
        actor: Interpreter
        preconditions:
          - "Assignment.service_status == PROPOSED"
          - "logical clock < Hearing.scheduled_start"
          - "Interpreter.roster_status == ACTIVE (skipped when Assignment.vendor_served == true)"
          - "the pinned Credential.status == ACTIVE (skipped when Assignment.vendor_served == true)"
          - "Courthouse.status == OPEN when Assignment.delivery_mode == IN_PERSON"
          - "Courthouse.remote_equipment_tier == CERTIFIED_VRI when Assignment.delivery_mode == VRI"
          - "Courthouse.available_pay_cents >= the PROVISIONAL total about to be encumbered"
        side_effects:
          - "Assignment.service_status = CONFIRMED"
          - "creates one PayClaim in status ENCUMBERED with variant PROVISIONAL, rate_schedule_id pinned to the RateSchedule effective on Hearing.scheduled_start date, and provisional_total_cents from calculations.assignment_pay variant PROVISIONAL (skipped entirely when Assignment.vendor_served == true)"
          - "recomputes Courthouse.encumbered_pay_cents and Courthouse.available_pay_cents"
          - "bubble up: Hearing SCHEDULED -> COVERED"
          - "increments Assignment.version by 1"
      - from: PROPOSED
        to: DECLINED
        trigger: "POST /assignments/{id}/decline"
        actor: Interpreter
        preconditions: ["Assignment.service_status == PROPOSED", "Assignment.interpreter_id == X-User-ID"]
        side_effects:
          - "Assignment.service_status = DECLINED, Assignment.cancel_reason_code = INTERPRETER_DECLINED"
          - "increments Assignment.version by 1"
        note: "No PayClaim exists yet in PROPOSED, so nothing is voided and Hearing.status is untouched (it is still SCHEDULED)."
      - from: PROPOSED
        to: SUPERSEDED
        trigger: "system, on POST /assignments creating a replacement Assignment for the same hearing_id"
        actor: system
        preconditions: ["Assignment.service_status == PROPOSED"]
        side_effects:
          - "Assignment.service_status = SUPERSEDED"
          - "increments Assignment.version by 1"
          - "increments Hearing.version by 1 (the same create call)"
      - from: CONFIRMED
        to: CHECKED_IN
        trigger: "POST /assignments/{id}/check-in"
        actor: Interpreter
        preconditions:
          - "Assignment.service_status == CONFIRMED"
          - "Assignment.vendor_served == false"
          - "Assignment.interpreter_id == X-User-ID"
          - "Interpreter.roster_status == ACTIVE"
        side_effects:
          - "Assignment.service_status = CHECKED_IN, Assignment.check_in_utc = logical clock"
          - "increments Assignment.version by 1"
      - from: CHECKED_IN
        to: COMPLETED
        trigger: "POST /assignments/{id}/complete"
        actor: Interpreter
        preconditions:
          - "Assignment.service_status == CHECKED_IN"
          - "request actual_end_utc > Assignment.check_in_utc"
        side_effects:
          - "Assignment.service_status = COMPLETED, Assignment.actual_end_utc = request actual_end_utc, Assignment.actual_one_way_miles = request one_way_miles (default 0)"
          - "the assignment's PayClaim ENCUMBERED -> FINALIZED with variant FINAL and final_total_cents from calculations.assignment_pay variant FINAL"
          - "recomputes Courthouse.encumbered_pay_cents, Courthouse.obligated_pay_cents, Courthouse.available_pay_cents"
          - "recomputes Interpreter.pending_pay_cents"
          - "bubble up: Hearing COVERED -> SERVED"
          - "increments Assignment.version by 1"
      - from: CONFIRMED
        to: COMPLETED
        trigger: "POST /assignments/{id}/complete on a vendor-served assignment"
        actor: SchedulingCoordinator
        preconditions: ["Assignment.service_status == CONFIRMED", "Assignment.vendor_served == true", "request actual_end_utc > Hearing.scheduled_start"]
        side_effects:
          - "Assignment.service_status = COMPLETED, Assignment.actual_end_utc = request actual_end_utc"
          - "no PayClaim is created or finalized (the vendor bills outside the program ledger)"
          - "bubble up: Hearing COVERED -> SERVED"
          - "increments Assignment.version by 1"
        note: "Conditional cascade: the pay-ledger side effects are skipped exactly when vendor_served == true."
      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /assignments/{id}/cancel, or a system cascade (continuance hop 2, suspension hop 3, lapse hop 4, equipment withdrawal)"
        actor: SchedulingCoordinator
        preconditions: ["Assignment.service_status IN {PROPOSED, CONFIRMED}", "logical clock < Hearing.scheduled_start"]
        side_effects:
          - "Assignment.service_status = CANCELLED, Assignment.cancel_reason_code = the request or cascade reason"
          - "cascade hop 3 (early cancel, (Hearing.scheduled_start - logical clock) >= RateSchedule.late_cancellation_hours): the PayClaim ENCUMBERED -> VOIDED, releasing exactly provisional_total_cents from Courthouse.encumbered_pay_cents"
          - "cascade hop 3 (late cancel, lead time < RateSchedule.late_cancellation_hours): the PayClaim ENCUMBERED -> FINALIZED with late_cancellation = true and final_total_cents from calculations.assignment_pay variant LATE_CANCELLATION"
          - "cascade hop 4 (late cancel only): recomputes Interpreter.pending_pay_cents from the newly FINALIZED claim"
          - "bubble up: Hearing COVERED -> SCHEDULED (early cancel) or COVERED -> UNMET (late cancel); untouched when Hearing.status == CONTINUED"
          - "increments Assignment.version by 1"
      - from: CONFIRMED
        to: NO_SHOW
        trigger: "POST /assignments/{id}/no-show"
        actor: SchedulingCoordinator
        preconditions: ["Assignment.service_status == CONFIRMED", "logical clock >= Hearing.scheduled_start"]
        side_effects:
          - "Assignment.service_status = NO_SHOW"
          - "the PayClaim ENCUMBERED -> VOIDED, releasing provisional_total_cents from Courthouse.encumbered_pay_cents"
          - "creates one Complaint with category = NO_SHOW, severity = MAJOR, filed_by_user_id = the calling X-User-ID, status FILED, assignment_id = this assignment"
          - "Assignment.compliance_status CLEAR -> UNDER_QUALITY_REVIEW (compliance dimension)"
          - "bubble up: Hearing COVERED -> UNMET"
          - "increments Assignment.version by 1"

  - entity: Assignment
    initial_state: CLEAR
    terminal_states: []
    transitions:
      - from: CLEAR
        to: UNDER_QUALITY_REVIEW
        trigger: "system, on POST /complaints with assignment_id == this assignment, or on the auto-filed complaint from POST /assignments/{id}/no-show"
        actor: system
        preconditions: ["Assignment.compliance_status == CLEAR"]
        side_effects:
          - "Assignment.compliance_status = UNDER_QUALITY_REVIEW"
          - "increments Assignment.version by 1"
        note: "Second, independent state dimension on Assignment: compliance_status moves on Complaint events regardless of where service_status sits, and service_status moves regardless of compliance_status."
      - from: UNDER_QUALITY_REVIEW
        to: SUBSTANTIATED_DEFECT
        trigger: "system, on POST /complaints/{id}/adjudicate with disposition == SUBSTANTIATED for a complaint carrying this assignment_id"
        actor: system
        preconditions: ["Assignment.compliance_status == UNDER_QUALITY_REVIEW"]
        side_effects:
          - "Assignment.compliance_status = SUBSTANTIATED_DEFECT"
          - "increments Assignment.version by 1"
      - from: UNDER_QUALITY_REVIEW
        to: CLEAR
        trigger: "system, on POST /complaints/{id}/adjudicate with disposition == DISMISSED for a complaint carrying this assignment_id, when no other Complaint on this assignment has status IN {FILED, REVIEWED, APPEALED}"
        actor: system
        preconditions: ["Assignment.compliance_status == UNDER_QUALITY_REVIEW"]
        side_effects:
          - "Assignment.compliance_status = CLEAR"
          - "increments Assignment.version by 1"
      - from: SUBSTANTIATED_DEFECT
        to: CLEAR
        trigger: "system, on POST /complaints/{id}/appeal-decision with outcome == VACATED"
        actor: system
        preconditions: ["Assignment.compliance_status == SUBSTANTIATED_DEFECT"]
        side_effects:
          - "Assignment.compliance_status = CLEAR"
          - "increments Assignment.version by 1"
        note: "Cycle on the compliance dimension: CLEAR -> UNDER_QUALITY_REVIEW -> SUBSTANTIATED_DEFECT -> CLEAR."

  - entity: PayClaim
    initial_state: ENCUMBERED
    terminal_states: [PAID, VOIDED]
    transitions:
      - from: ENCUMBERED
        to: FINALIZED
        trigger: "system, caused by the parent Assignment reaching COMPLETED, or by a late cancellation of the parent Assignment"
        actor: system
        preconditions: ["PayClaim.status == ENCUMBERED"]
        side_effects:
          - "PayClaim.variant = FINAL; billable_hours, service_cents, rare_premium_cents, travel_cents and final_total_cents recomputed by calculations.assignment_pay"
          - "PayClaim.late_cancellation = true when produced by the late-cancellation path"
          - "recomputes Courthouse.encumbered_pay_cents (releases provisional_total_cents) and Courthouse.obligated_pay_cents (adds final_total_cents)"
          - "recomputes Interpreter.pending_pay_cents"
          - "increments PayClaim.version by 1"
      - from: ENCUMBERED
        to: VOIDED
        trigger: "system, caused by an early cancellation, a decline after confirmation cascade, or a NO_SHOW on the parent Assignment"
        actor: system
        preconditions: ["PayClaim.status == ENCUMBERED"]
        side_effects:
          - "PayClaim.status = VOIDED; provisional_total_cents preserved for audit, final_total_cents stays null"
          - "recomputes Courthouse.encumbered_pay_cents (releases exactly provisional_total_cents)"
          - "increments PayClaim.version by 1"
      - from: FINALIZED
        to: SUBMITTED
        trigger: "POST /pay-claims/{id}/submit"
        actor: Interpreter
        preconditions: ["PayClaim.status == FINALIZED", "Assignment.interpreter_id == X-User-ID"]
        side_effects:
          - "PayClaim.status = SUBMITTED"
          - "increments PayClaim.version by 1"
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /pay-claims/{id}/approve"
        actor: FiscalOfficer
        preconditions: ["PayClaim.status == SUBMITTED", "Assignment.compliance_status == CLEAR for PayClaim.assignment_id"]
        side_effects:
          - "PayClaim.status = APPROVED"
          - "increments PayClaim.version by 1"
      - from: APPROVED
        to: PAID
        trigger: "POST /pay-claims/{id}/pay"
        actor: FiscalOfficer
        preconditions: ["PayClaim.status == APPROVED"]
        side_effects:
          - "PayClaim.status = PAID, PayClaim.payment_reference = request payment_reference"
          - "recomputes Interpreter.pending_pay_cents (claim leaves the pending set) and Interpreter.paid_pay_cents"
          - "increments PayClaim.version by 1"

  - entity: Complaint
    initial_state: FILED
    terminal_states: [DISMISSED, UPHELD, VACATED]
    transitions:
      - from: FILED
        to: REVIEWED
        trigger: "POST /complaints/{id}/review"
        actor: QualityReviewer
        preconditions: ["Complaint.status == FILED", "X-User-ID != Complaint.filed_by_user_id"]
        side_effects:
          - "Complaint.status = REVIEWED, Complaint.reviewer_user_id = X-User-ID, Complaint.reviewer_recommendation = request recommendation"
          - "increments Complaint.version by 1"
      - from: REVIEWED
        to: SUBSTANTIATED
        trigger: "POST /complaints/{id}/adjudicate with disposition == SUBSTANTIATED"
        actor: ProgramAdmin
        preconditions:
          - "Complaint.status == REVIEWED"
          - "request sanction_type is permitted for Complaint.severity (MINOR -> {LETTER, PROBATION}, MAJOR -> {PROBATION, SUSPENSION}, SEVERE -> {SUSPENSION, REVOCATION})"
        side_effects:
          - "Complaint.status = SUBSTANTIATED, Complaint.disposition = SUBSTANTIATED, Complaint.adjudicator_user_id = X-User-ID, Complaint.adjudicated_at = logical clock"
          - "cascade hop 1: creates one DisciplinaryAction in status IN_EFFECT with action_type = request sanction_type, points from SANCTION_POINTS, effective_from = logical-clock date, effective_through = effective_from + 365 days (LETTER), + 180 days (PROBATION), + request suspension_days (SUSPENSION), or null (REVOCATION)"
          - "cascade hop 2: caused by that DisciplinaryAction becoming IN_EFFECT — Interpreter.complaint_points recomputed, quality scores recomputed, and roster_status ACTIVE -> SUSPENDED (SUSPENSION) or ACTIVE -> REVOKED (REVOCATION)"
          - "Assignment.compliance_status UNDER_QUALITY_REVIEW -> SUBSTANTIATED_DEFECT when Complaint.assignment_id is set"
          - "increments Complaint.version by 1"
      - from: REVIEWED
        to: DISMISSED
        trigger: "POST /complaints/{id}/adjudicate with disposition == DISMISSED"
        actor: ProgramAdmin
        preconditions: ["Complaint.status == REVIEWED"]
        side_effects:
          - "Complaint.status = DISMISSED, Complaint.disposition = DISMISSED, Complaint.adjudicator_user_id = X-User-ID, Complaint.adjudicated_at = logical clock"
          - "no DisciplinaryAction is created; Interpreter.complaint_points unchanged"
          - "Assignment.compliance_status UNDER_QUALITY_REVIEW -> CLEAR when Complaint.assignment_id is set and no other Complaint on that assignment has status IN {FILED, REVIEWED, APPEALED}"
          - "increments Complaint.version by 1"
      - from: SUBSTANTIATED
        to: APPEALED
        trigger: "POST /complaints/{id}/appeal"
        actor: Interpreter
        preconditions:
          - "Complaint.status == SUBSTANTIATED"
          - "Complaint.interpreter_id == X-User-ID"
          - "(logical clock - Complaint.adjudicated_at) <= 30 days"
        side_effects:
          - "Complaint.status = APPEALED, Complaint.appeal_filed_at = logical clock"
          - "increments Complaint.version by 1"
      - from: APPEALED
        to: VACATED
        trigger: "POST /complaints/{id}/appeal-decision with outcome == VACATED"
        actor: ProgramAdmin
        preconditions: ["Complaint.status == APPEALED"]
        side_effects:
          - "Complaint.status = VACATED, Complaint.disposition = null"
          - "compensation: the DisciplinaryAction created by this complaint's adjudication IN_EFFECT -> RESCINDED"
          - "Interpreter.complaint_points recomputed (the rescinded action drops out), quality scores recomputed"
          - "Interpreter SUSPENDED -> ACTIVE when no other SUSPENSION action remains IN_EFFECT"
          - "Assignment.compliance_status SUBSTANTIATED_DEFECT -> CLEAR when Complaint.assignment_id is set"
          - "increments Complaint.version by 1"
      - from: APPEALED
        to: UPHELD
        trigger: "POST /complaints/{id}/appeal-decision with outcome == UPHELD"
        actor: ProgramAdmin
        preconditions: ["Complaint.status == APPEALED"]
        side_effects:
          - "Complaint.status = UPHELD"
          - "the DisciplinaryAction stays IN_EFFECT; Interpreter.complaint_points unchanged"
          - "increments Complaint.version by 1"
      - from: APPEALED
        to: FILED
        trigger: "POST /complaints/{id}/appeal-decision with outcome == REMANDED"
        actor: ProgramAdmin
        preconditions: ["Complaint.status == APPEALED"]
        side_effects:
          - "Complaint.status = FILED, Complaint.remand_count += 1, Complaint.reviewer_user_id = null, Complaint.reviewer_recommendation = null, Complaint.disposition = null, Complaint.adjudicated_at = null"
          - "compensation: the DisciplinaryAction created by the vacated adjudication IN_EFFECT -> RESCINDED, Interpreter.complaint_points recomputed, Interpreter SUSPENDED -> ACTIVE when no SUSPENSION action remains IN_EFFECT"
          - "increments Complaint.version by 1"
        note: "Cycle: FILED -> REVIEWED -> SUBSTANTIATED -> APPEALED -> FILED. The remand clears reviewer_user_id so the same reviewer may act again, but the filer still may not."

  - entity: DisciplinaryAction
    initial_state: IN_EFFECT
    terminal_states: [EXPIRED, RESCINDED]
    transitions:
      - from: IN_EFFECT
        to: EXPIRED
        trigger: "POST /ops/daily-sweep, step 2, when DisciplinaryAction.effective_through is not null and logical-clock date > effective_through"
        actor: system
        preconditions: ["DisciplinaryAction.status == IN_EFFECT", "DisciplinaryAction.effective_through != null", "logical-clock date > DisciplinaryAction.effective_through"]
        side_effects:
          - "DisciplinaryAction.status = EXPIRED (points still count toward Interpreter.complaint_points)"
          - "Interpreter SUSPENDED -> ACTIVE when this was the last IN_EFFECT SUSPENSION action"
          - "increments DisciplinaryAction.version by 1"
      - from: IN_EFFECT
        to: RESCINDED
        trigger: "system, caused by POST /complaints/{id}/appeal-decision with outcome IN {VACATED, REMANDED}"
        actor: system
        preconditions: ["DisciplinaryAction.status == IN_EFFECT"]
        side_effects:
          - "DisciplinaryAction.status = RESCINDED (points drop out of Interpreter.complaint_points)"
          - "increments DisciplinaryAction.version by 1"

# =============================================================================
# §1.2.1 Concurrency Rules — OCC on the parent entity's version only
# =============================================================================
concurrency_rules:
  - rule_id: assignment-create-stale-hearing
    parent_entity: Hearing
    write_endpoint: "POST /assignments"
    occ_field: "expected_hearing_version"
    description: |
      Creating an Assignment against a Hearing whose version has advanced since
      the client last read it is rejected. This is the supersede path: a create
      that lands on a hearing already carrying a PROPOSED assignment legitimately
      pushes that assignment to SUPERSEDED, so a client working from a stale
      hearing view would silently replace an assignment it never saw.
    error_id: ERR_STALE_HEARING_VERSION
    http_status: 412

  - rule_id: credential-create-stale-interpreter
    parent_entity: Interpreter
    write_endpoint: "POST /credentials"
    occ_field: "expected_interpreter_version"
    description: |
      Creating a Credential against an Interpreter whose version has advanced
      since the client last read it is rejected. A higher-tier create for the
      same language legitimately withdraws a pending lower-tier credential and
      bumps the interpreter's version, so a stale-version create would withdraw
      an application the client never observed.
    error_id: ERR_STALE_INTERPRETER_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: hearing_priority_score
    trigger: "POST /hearings — computed once at creation and frozen onto Hearing.priority_score / Hearing.priority_class"
    algorithm: weighted_scoring
    formula: |
      # Combinatorial mode (a): five inputs, two conditional branches, one clamp
      # on the urgency term and one clamp on the sum.
      type_weight   = TYPE_WEIGHTS[hearing.hearing_type]
      custody_bonus = CUSTODY_BONUS if hearing.in_custody else 0
      rarity_bonus  = RARITY_BONUS[Language(hearing.language_id).tier_class]
      lead_time_days = max(0, floor((hearing.scheduled_start - clock_now) / 86400))
      urgency       = max(0, URGENCY_BASE - URGENCY_PER_DAY * lead_time_days)
      priority_score = min(100, type_weight + custody_bonus + rarity_bonus + urgency)
      priority_class = 'A' if priority_score >= 80 else ('B' if priority_score >= 55 else 'C')
    input_set: "Only the hearing being created plus its Language row; no other hearings participate. clock_now is the logical clock at the moment of the create call, so priority never drifts after creation."
    constants:
      TYPE_WEIGHTS: { ARRAIGNMENT: 50, DETENTION_REVIEW: 45, TRIAL: 40, PLEA: 30, SENTENCING: 30, MOTION: 20, CIVIL_MOTION: 10 }
      CUSTODY_BONUS: 25
      RARITY_BONUS: { RARE: 15, NON_DESIGNATED: 5, DESIGNATED: 0 }
      URGENCY_BASE: 20
      URGENCY_PER_DAY: 2
      CLASS_A_FLOOR: 80
      CLASS_B_FLOOR: 55
    precision: "integer score; class boundaries are inclusive at the floor (>= 80 is A, exactly 55 is B)"

  - name: required_min_tier
    trigger: "POST /assignments and GET /hearings/{id}/eligible-interpreters — derives the credential tier floor for a hearing"
    algorithm: threshold
    formula: |
      if Language(hearing.language_id).tier_class == 'RARE':
          required = 'PROVISIONAL'          # no certification examination exists
      elif hearing.priority_class == 'A':
          required = 'CERTIFIED'
      elif hearing.priority_class == 'B':
          required = 'REGISTERED'
      else:
          required = 'PROVISIONAL'
      # gate: TIER_RANK[assignment credential.tier] >= TIER_RANK[required]
    input_set: "The hearing's frozen priority_class and its Language.tier_class only."
    constants:
      TIER_RANK: { MASTER: 3, CERTIFIED: 2, REGISTERED: 1, PROVISIONAL: 0 }
    precision: "exact enum comparison on integer ranks"

  - name: assignment_pay
    trigger: "PayClaim creation on POST /assignments/{id}/confirm (variant PROVISIONAL), PayClaim ENCUMBERED -> FINALIZED on POST /assignments/{id}/complete (variant FINAL), and PayClaim ENCUMBERED -> FINALIZED on a late POST /assignments/{id}/cancel (variant LATE_CANCELLATION)"
    algorithm: tiered_pricing
    formula: |
      rate = PayClaim.rate_schedule_id -> RateSchedule (pinned at claim creation)
      # ---- step 1: raw window, per variant -----------------------------------
      # PROVISIONAL:        window = [hearing.scheduled_start, hearing.scheduled_end)
      #                     miles  = assignment.estimated_one_way_miles
      # FINAL:              window = [assignment.check_in_utc, assignment.actual_end_utc)
      #                     miles  = assignment.actual_one_way_miles
      # LATE_CANCELLATION:  raw_hours is not measured; billable_hours is set
      #                     directly to rate.late_cancellation_pay_hours and
      #                     miles = 0 (no travel was undertaken)
      raw_hours = (window_end - window_start) / 3600
      # ---- step 2: quarter-hour round UP, then the minimum-call floor --------
      rounded_hours  = ceil(raw_hours * 4) / 4
      billable_hours = max(rounded_hours, rate.minimum_call_hours)
      # ---- step 3: service component ---------------------------------------
      tier_hourly_cents = { MASTER: rate.master_hourly_cents,
                            CERTIFIED: rate.certified_hourly_cents,
                            REGISTERED: rate.registered_hourly_cents,
                            PROVISIONAL: rate.provisional_hourly_cents
                          }[assignment.credential_tier_snapshot]
      mode_multiplier = 1.0 if assignment.delivery_mode == 'IN_PERSON'
                        else rate.remote_rate_multiplier
      service_cents = round_half_up(billable_hours * tier_hourly_cents * mode_multiplier)
      # ---- step 4: rare-language premium, bracket keyed on the ROUNDED
      #      service component only (evaluation order pinned; the premium is
      #      NOT keyed on the running total, which would select a higher pct
      #      once travel is added) -------------------------------------------
      if Language(hearing.language_id).tier_class == 'RARE':
          pct = rate.rare_premium_high_pct if service_cents >= rate.rare_premium_bracket_cents
                else rate.rare_premium_low_pct
          rare_premium_cents = round_half_up(service_cents * pct)
      else:
          rare_premium_cents = 0
      # ---- step 5: travel component ----------------------------------------
      if assignment.delivery_mode != 'IN_PERSON' or miles <= rate.travel_free_radius_miles:
          reimbursable_miles = 0
      else:
          reimbursable_miles = 2 * miles          # round trip, once past the radius
      travel_cents = round_half_up(reimbursable_miles * rate.travel_mileage_rate_cents)
      # ---- step 6: ROUNDING ORDER PINNED — round each component to whole
      #      cents first, then sum. (Summing the three unrounded components and
      #      rounding once produces a different total and is NOT the rule.) ----
      total_cents = service_cents + rare_premium_cents + travel_cents
      # PROVISIONAL writes provisional_total_cents; FINAL and LATE_CANCELLATION
      # write final_total_cents and leave provisional_total_cents frozen.
    input_set: "Exactly one Assignment, its Hearing, its Hearing's Language, and the RateSchedule pinned on the PayClaim at creation. A later-created RateSchedule never changes an existing claim."
    constants:
      QUARTER_HOUR_DIVISIONS: 4
    precision: "billable_hours to 2 decimals (always a multiple of 0.25); each of service_cents, rare_premium_cents and travel_cents rounded to whole cents with round_half_up BEFORE summation"
    variants:
      - name: PROVISIONAL
        when: "PayClaim created on assignment confirm; the encumbrance amount"
        difference: "Uses the scheduled hearing window and estimated_one_way_miles; writes provisional_total_cents and adds it to Courthouse.encumbered_pay_cents"
      - name: FINAL
        when: "PayClaim finalized on assignment complete"
        difference: "Uses the check-in-to-actual-end window and actual_one_way_miles; writes final_total_cents, releases the encumbrance and adds to Courthouse.obligated_pay_cents. For identical inputs it diverges from PROVISIONAL whenever the served window or the reported mileage differs from the scheduled window or estimate."
      - name: LATE_CANCELLATION
        when: "PayClaim finalized because the assignment was cancelled with less than rate.late_cancellation_hours of lead time"
        difference: "Skips steps 1-2: billable_hours = rate.late_cancellation_pay_hours, miles = 0, so travel_cents == 0; sets PayClaim.late_cancellation = true"

  - name: interpreter_quality_score
    trigger: "GET /interpreters/{id}/quality-score, and recomputed onto Interpreter.rolling_12_month_score / Interpreter.lifetime_score whenever a DisciplinaryAction is created, expires, or is rescinded"
    algorithm: decay_function
    formula: |
      cutoff = clock_now_date - 365 days
      actions = DisciplinaryAction rows with interpreter_id == interpreter.id
                and status IN {IN_EFFECT, EXPIRED}      # RESCINDED excluded
      recent_points = SUM(a.points for a in actions if a.effective_from >= cutoff)
      older_points  = SUM(a.points for a in actions if a.effective_from <  cutoff)
      rolling_12_month_score = max(0, 100 - RECENT_WEIGHT * recent_points)
      lifetime_score         = max(0, 100 - RECENT_WEIGHT * recent_points
                                        - OLDER_WEIGHT  * older_points)
      # Assignment gate: a class A hearing requires
      # rolling_12_month_score >= QUALITY_FLOOR (inclusive).
    input_set: "All DisciplinaryAction rows of the interpreter with status IN {IN_EFFECT, EXPIRED}; RESCINDED rows are excluded from both variants. Window boundary is inclusive at cutoff (effective_from == cutoff counts as recent)."
    constants:
      RECENT_WEIGHT: 4
      OLDER_WEIGHT: 2
      LOOKBACK_DAYS: 365
      QUALITY_FLOOR: 60
      SANCTION_POINTS: { LETTER: 5, PROBATION: 10, SUSPENSION: 12, REVOCATION: 20 }
    precision: "integer arithmetic, floor at 0"
    variants:
      - name: ROLLING_12_MONTH
        when: "the roster gate on POST /assignments for class A hearings, and Interpreter.rolling_12_month_score"
        difference: "Counts only actions with effective_from within the last 365 days; sanctions older than the window are invisible to it"
      - name: LIFETIME
        when: "Interpreter.lifetime_score, shown on the roster and on GET /interpreters/{id}/quality-score"
        difference: "Adds OLDER_WEIGHT * older_points, so an interpreter with old sanctions scores strictly lower here than under ROLLING_12_MONTH while both read the same rows"

  - name: interpreter_interval_conflict
    trigger: "POST /assignments — pairwise exclusivity check on the interpreter as the occupied resource"
    algorithm: interval_merge
    formula: |
      new_window = [hearing_new.scheduled_start, hearing_new.scheduled_end)   # half-open
      busy = Assignment rows with interpreter_id == request interpreter_id
             and service_status IN {PROPOSED, CONFIRMED, CHECKED_IN}
      for a in busy ordered by Hearing.scheduled_start ASC, then Assignment.created_at ASC:
          old_window = [Hearing(a.hearing_id).scheduled_start, Hearing(a.hearing_id).scheduled_end)
          # (i) half-open overlap: touching endpoints do NOT collide
          if old_window.start < new_window.end and new_window.start < old_window.end:
              reject ERR_INTERPRETER_DOUBLE_BOOKED
          # (ii) travel buffer: only between two IN_PERSON assignments at
          #      DIFFERENT courthouses; remote legs and same-courthouse legs
          #      require no gap at all
          if a.delivery_mode == 'IN_PERSON' and request delivery_mode == 'IN_PERSON' \
             and Hearing(a.hearing_id).courthouse_id != hearing_new.courthouse_id:
              gap_minutes = (max(old_window.start, new_window.start)
                             - min(old_window.end, new_window.end)) / 60
              if gap_minutes < TRAVEL_BUFFER_MINUTES:
                  reject ERR_TRAVEL_BUFFER_VIOLATION
    input_set: "Only the interpreter's own assignments in service_status {PROPOSED, CONFIRMED, CHECKED_IN}; DECLINED, CANCELLED, SUPERSEDED, NO_SHOW and COMPLETED rows are ignored. Ordering is Hearing.scheduled_start ASC then Assignment.created_at ASC so the first colliding pair decides which of the two errors is returned."
    constants:
      TRAVEL_BUFFER_MINUTES: 60
    precision: "second-level datetime arithmetic; gap of exactly 60 minutes is accepted (>= comparison)"

  - name: vri_capacity_occupancy
    trigger: "POST /assignments with delivery_mode == VRI — aggregate capacity check on the courthouse as the occupied resource"
    algorithm: aggregation
    formula: |
      new_window = [hearing_new.scheduled_start, hearing_new.scheduled_end]     # CLOSED
      occupants = Assignment rows a where Hearing(a.hearing_id).courthouse_id == hearing_new.courthouse_id
                  and a.delivery_mode == 'VRI'
                  and a.service_status IN {PROPOSED, CONFIRMED, CHECKED_IN}
                  and closed_intervals_intersect(
                        [Hearing(a.hearing_id).scheduled_start, Hearing(a.hearing_id).scheduled_end],
                        new_window)
      # closed_intervals_intersect(x, y) := x.start <= y.end and y.start <= x.end
      # Touching endpoints DO collide here: the VRI cart needs setup and
      # teardown, so a session ending at 10:00 still occupies the courtroom for
      # a session starting at 10:00.
      if count(occupants) + 1 > Courthouse.vri_concurrent_capacity:
          reject ERR_VRI_CAPACITY_EXCEEDED
    input_set: "VRI assignments at the same courthouse in service_status {PROPOSED, CONFIRMED, CHECKED_IN}; IN_PERSON and TELEPHONIC assignments never occupy VRI capacity, and terminal-service rows never occupy it."
    constants:
      SETUP_TEARDOWN_SEMANTICS: closed_interval
    precision: "second-level datetime arithmetic; endpoint equality counts as intersection (<= on both sides)"

  - name: courthouse_encumbrance_ledger
    trigger: "Recomputed on every PayClaim status change and on POST /assignments/{id}/confirm, /cancel, /complete, /no-show"
    algorithm: aggregation
    formula: |
      encumbered_pay_cents = SUM(p.provisional_total_cents
                                 for p in PayClaim
                                 if p.status == 'ENCUMBERED'
                                 and Hearing(Assignment(p.assignment_id).hearing_id).courthouse_id == courthouse.id)
      obligated_pay_cents  = SUM(p.final_total_cents
                                 for p in PayClaim
                                 if p.status IN {'FINALIZED','SUBMITTED','APPROVED','PAID'}
                                 and Hearing(Assignment(p.assignment_id).hearing_id).courthouse_id == courthouse.id)
      available_pay_cents  = courthouse.pay_budget_cents - encumbered_pay_cents - obligated_pay_cents
      # Conserved-quantity invariant: confirm(A) then early-cancel(A) leaves
      # encumbered_pay_cents at exactly its pre-confirm value, because VOIDED
      # claims leave the ENCUMBERED set and no other field absorbs the amount.
    input_set: "PayClaim rows reachable from this courthouse through assignment_id -> hearing_id -> courthouse_id. VOIDED claims are in neither sum. Vendor-served assignments produce no PayClaim and therefore never touch either sum."
    constants:
      BUDGET_CHECK_COMPARISON: ">= (a confirm whose provisional total exactly equals available_pay_cents is accepted)"
    precision: "integer cents; no rounding at this level"

  - name: language_access_coverage
    trigger: "POST /unmet-need-reports — snapshot computed once at creation and frozen onto the UnmetNeedReport row"
    algorithm: aggregation
    formula: |
      window = [period_start T00:00:00.000Z, period_end T00:00:00.000Z)     # half-open
      pool = Hearing rows with courthouse_id == request courthouse_id
             and scheduled_start in window
             and status IN {'SERVED', 'UNMET'}          # unresolved and CONTINUED excluded
      resolved_hearing_count    = count(pool)
      served_hearing_count      = count(h in pool if h.status == 'SERVED')
      unmet_hearing_count       = count(h in pool if h.status == 'UNMET')
      rare_language_unmet_count = count(h in pool if h.status == 'UNMET'
                                        and Language(h.language_id).tier_class == 'RARE')
      if resolved_hearing_count == 0:
          coverage_rate_pct = 100.00            # empty-pool convention, pinned
      else:
          coverage_rate_pct = round_half_up(100 * served_hearing_count
                                            / resolved_hearing_count, 2)
      if coverage_rate_pct < CORRECTIVE_FLOOR:
          compliance_status = 'NON_COMPLIANT'
      elif coverage_rate_pct < COMPLIANT_FLOOR or rare_language_unmet_count > 0:
          compliance_status = 'CORRECTIVE_ACTION_REQUIRED'
      else:
          compliance_status = 'COMPLIANT'
      by_language[Language.code] = { resolved: ..., served: ..., unmet: ... }
                                   for every Language appearing in pool,
                                   keys ordered by Language.code ASC
    input_set: "Hearings of the requested courthouse whose scheduled_start falls in the half-open window and whose status is SERVED or UNMET. SCHEDULED, COVERED and CONTINUED hearings are excluded from every counter, so a continuance never depresses the coverage rate."
    constants:
      COMPLIANT_FLOOR: 95.00
      CORRECTIVE_FLOOR: 85.00
      EMPTY_POOL_COVERAGE_PCT: 100.00
    precision: "coverage_rate_pct to 2 decimals, round_half_up; threshold comparisons are inclusive at the floor (exactly 95.00 is COMPLIANT when rare_language_unmet_count == 0)"

  - name: interpreter_eligibility_ranking
    trigger: "GET /hearings/{id}/eligible-interpreters"
    algorithm: weighted_scoring
    formula: |
      # (a) eligibility filter — every clause is an explicit predicate
      candidates = Interpreter rows i where
          i.roster_status == 'ACTIVE'
          and exists Credential c with c.interpreter_id == i.id
                     and c.language_id == hearing.language_id
                     and c.status == 'ACTIVE'
                     and TIER_RANK[c.tier] >= TIER_RANK[required_min_tier(hearing)]
          and i.ethics_training_status == 'COMPLETED'
          and (hearing.priority_class != 'A' or i.rolling_12_month_score >= 60)
          and (i.accepts_in_person == true if hearing.requested_delivery_mode == 'IN_PERSON'
               else i.accepts_remote == true)
          and no Assignment of i collides with the hearing window under
              calculations.interpreter_interval_conflict
      # (b) ranking expression, all terms over entity fields
      sort_key = ( -TIER_RANK[best ACTIVE credential tier for hearing.language_id],
                   0 if i.home_county_code == Courthouse(hearing.courthouse_id).county_code else 1,
                   -i.rolling_12_month_score,
                   i.created_at )                 # (c) final tie-break, ASC
      # (d) empty candidate set -> HTTP 200 with data == [] (never an error);
      #     the hearing stays SCHEDULED and is swept to UNMET once its start
      #     time passes.
    input_set: "All Interpreter rows with roster_status == ACTIVE and an ACTIVE credential in the hearing's language at or above the required tier. SUSPENDED, INACTIVE, APPLICANT, CANDIDATE and REVOKED interpreters never appear."
    constants:
      TIER_RANK: { MASTER: 3, CERTIFIED: 2, REGISTERED: 1, PROVISIONAL: 0 }
      QUALITY_FLOOR: 60
    precision: "deterministic total order; Interpreter.created_at ASC is the final tie-break and Interpreter.id is never consulted"

# ---------------------------------------------------------------------------
# §1.4  VALIDATION RULES (evaluated in ascending priority; first failure wins)
# ---------------------------------------------------------------------------
validations:
  - priority: 1
    category: auth
    check: "X-User-Role header present and one of the six declared roles; X-User-ID header present and non-empty"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "The acting X-User-Role appears in the endpoint's roles list in §1.5"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all

  - priority: 3
    category: business_constraint
    check: "Request body / query shape: unknown-typed values, malformed datetimes, enum values outside the declared set, negative money or mileage, non-positive counts, limit outside [1,100], offset < 0, scheduled_end <= scheduled_start, period_end <= period_start, and missing required input fields"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all

  - priority: 4
    category: existence
    check: "Every {id} path segment resolves, validated left to right: interpreters -> ERR_INTERPRETER_NOT_FOUND, credentials -> ERR_CREDENTIAL_NOT_FOUND, hearings -> ERR_HEARING_NOT_FOUND, assignments -> ERR_ASSIGNMENT_NOT_FOUND, pay-claims -> ERR_PAY_CLAIM_NOT_FOUND, complaints -> ERR_COMPLAINT_NOT_FOUND, disciplinary-actions -> ERR_DISCIPLINARY_ACTION_NOT_FOUND, courthouses -> ERR_CONFIG_RESOURCE_NOT_FOUND"
    error_id: ERR_INTERPRETER_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with a path parameter"

  - priority: 5
    category: business_referential
    check: "Every FK supplied in a request body resolves: language_id and courthouse_id and rate_schedule_id -> ERR_CONFIG_RESOURCE_NOT_FOUND, interpreter_id -> ERR_INTERPRETER_NOT_FOUND, hearing_id -> ERR_HEARING_NOT_FOUND, assignment_id -> ERR_ASSIGNMENT_NOT_FOUND, complaint_id -> ERR_COMPLAINT_NOT_FOUND"
    error_id: ERR_CONFIG_RESOURCE_NOT_FOUND
    http_status: 404
    applies_to: "POST /credentials, POST /hearings, POST /assignments, POST /complaints, POST /unmet-need-reports"

  - priority: 6
    category: auth
    check: "Interpreter-role ownership: for POST /assignments/{id}/confirm|decline|check-in|complete, POST /pay-claims/{id}/submit and POST /complaints/{id}/appeal, X-User-ID must equal the acting Interpreter row's id and that interpreter must be the assignment's (or claim's, or complaint's) interpreter_id"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "POST /assignments/{id}/confirm, POST /assignments/{id}/decline, POST /assignments/{id}/check-in, POST /assignments/{id}/complete, POST /pay-claims/{id}/submit, POST /complaints/{id}/appeal"

  - priority: 7
    category: business_safety
    check: "Segregation of duties: the QualityReviewer X-User-ID that reviews a complaint must differ from Complaint.filed_by_user_id, and the ProgramAdmin that decides an appeal must differ from Complaint.adjudicated_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 409
    applies_to: "POST /complaints/{id}/review, POST /complaints/{id}/appeal-decision"

  - priority: 8
    category: state
    check: "Optimistic concurrency: expected_hearing_version must equal Hearing.version (POST /assignments); expected_interpreter_version must equal Interpreter.version (POST /credentials)"
    error_id: ERR_STALE_HEARING_VERSION
    http_status: 412
    applies_to: "POST /assignments, POST /credentials"

  - priority: 9
    category: state
    check: "Credential is in a status that permits the requested transition (advance from PENDING_WRITTEN/PENDING_ORAL/PENDING_ETHICS only; renew from ACTIVE or LAPSED only; exam attempts only while PENDING_WRITTEN or PENDING_ORAL; revoke only from a non-terminal status)"
    error_id: ERR_INVALID_CREDENTIAL_STATE
    http_status: 409
    applies_to: "POST /credentials/{id}/exam-attempts, POST /credentials/{id}/advance, POST /credentials/{id}/renew, POST /credentials/{id}/revoke"

  - priority: 10
    category: state
    check: "Assignment service_status permits the requested transition (confirm/decline from PROPOSED; check-in from CONFIRMED; complete from CHECKED_IN, or from CONFIRMED only when vendor_served is true; cancel from PROPOSED or CONFIRMED; no-show from CONFIRMED)"
    error_id: ERR_INVALID_ASSIGNMENT_STATE
    http_status: 409
    applies_to: "POST /assignments/{id}/confirm, POST /assignments/{id}/decline, POST /assignments/{id}/check-in, POST /assignments/{id}/complete, POST /assignments/{id}/cancel, POST /assignments/{id}/no-show"

  - priority: 11
    category: state
    check: "PayClaim status permits the requested transition (submit from FINALIZED; approve from SUBMITTED; pay from APPROVED); a VOIDED claim accepts nothing"
    error_id: ERR_INVALID_PAY_CLAIM_STATE
    http_status: 409
    applies_to: "POST /pay-claims/{id}/submit, POST /pay-claims/{id}/approve, POST /pay-claims/{id}/pay"

  - priority: 12
    category: state
    check: "Complaint status permits the requested transition (review from FILED; adjudicate from REVIEWED; appeal from SUBSTANTIATED; appeal-decision from APPEALED)"
    error_id: ERR_INVALID_COMPLAINT_STATE
    http_status: 409
    applies_to: "POST /complaints/{id}/review, POST /complaints/{id}/adjudicate, POST /complaints/{id}/appeal, POST /complaints/{id}/appeal-decision"

  - priority: 13
    category: state
    check: "Hearing status permits scheduling work: POST /assignments requires Hearing.status == SCHEDULED, and a SERVED, UNMET or CONTINUED hearing is not schedulable at all (a hearing already COVERED is caught by the dedicated rule at priority 26); POST /hearings/{id}/continue requires SCHEDULED or COVERED"
    error_id: ERR_HEARING_NOT_SCHEDULABLE
    http_status: 409
    applies_to: "POST /assignments, POST /hearings/{id}/continue"

  - priority: 14
    category: business_safety
    check: "The named interpreter has roster_status == ACTIVE at assignment time (APPLICANT, CANDIDATE, SUSPENDED, INACTIVE and REVOKED are all refused)"
    error_id: ERR_INTERPRETER_NOT_ON_ACTIVE_ROSTER
    http_status: 409
    applies_to: "POST /assignments"

  - priority: 15
    category: business_safety
    check: "The interpreter holds a Credential with status == ACTIVE in the hearing's language_id (LAPSED, PENDING_*, DENIED, WITHDRAWN and REVOKED credentials do not qualify)"
    error_id: ERR_CREDENTIAL_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /assignments"

  - priority: 16
    category: business_safety
    check: "TIER_RANK of the interpreter's best ACTIVE credential in the hearing's language is >= TIER_RANK of calculations.required_min_tier for that hearing"
    error_id: ERR_TIER_BELOW_HEARING_REQUIREMENT
    http_status: 409
    applies_to: "POST /assignments"

  - priority: 17
    category: business_safety
    check: "Interpreter.ethics_training_status == COMPLETED — required both to activate a credential (PENDING_ETHICS -> ACTIVE) and to receive an assignment"
    error_id: ERR_ETHICS_TRAINING_INCOMPLETE
    http_status: 409
    applies_to: "POST /credentials/{id}/advance, POST /assignments"

  - priority: 18
    category: business_safety
    check: "Interpreter.rolling_12_month_score >= QUALITY_FLOOR (60) when the hearing's priority_class is A"
    error_id: ERR_QUALITY_SCORE_BELOW_ASSIGNMENT_FLOOR
    http_status: 409
    applies_to: "POST /assignments"

  - priority: 19
    category: business_safety
    check: "Attempts of the requested exam_type on this credential are fewer than MAX_ATTEMPTS_PER_EXAM (3); a fourth attempt is refused"
    error_id: ERR_EXAM_ATTEMPT_LIMIT_REACHED
    http_status: 409
    applies_to: "POST /credentials/{id}/exam-attempts"

  - priority: 20
    category: business_temporal
    check: "taken_on is at least RETAKE_WAIT_DAYS (90) days after the most recent failed attempt of the same exam_type on this credential; exactly 90 days is accepted"
    error_id: ERR_EXAM_RETAKE_TOO_SOON
    http_status: 409
    applies_to: "POST /credentials/{id}/exam-attempts"

  - priority: 21
    category: business_constraint
    check: "target_tier == PROVISIONAL is permitted only for a Language whose tier_class is RARE or whose oral_exam_available is false; requesting PROVISIONAL for a fully examinable designated language is refused"
    error_id: ERR_PROVISIONAL_TIER_NOT_PERMITTED
    http_status: 422
    applies_to: "POST /credentials"

  - priority: 22
    category: business_constraint
    check: "An ORAL exam attempt may only be recorded for a Language with oral_exam_available == true; a credential in a language without an oral instrument advances from PENDING_WRITTEN straight to PENDING_ETHICS"
    error_id: ERR_ORAL_EXAM_NOT_OFFERED
    http_status: 422
    applies_to: "POST /credentials/{id}/exam-attempts"

  - priority: 23
    category: business_constraint
    check: "The interpreter has no other Credential in the same language_id whose status is ACTIVE, LAPSED, PENDING_WRITTEN, PENDING_ORAL or PENDING_ETHICS (uniqueness of a live credential per interpreter-language pair)"
    error_id: ERR_DUPLICATE_ACTIVE_CREDENTIAL
    http_status: 409
    applies_to: "POST /credentials"

  - priority: 24
    category: business_constraint
    check: "cycle_credit_hours >= MIN_RENEWAL_CREDIT_HOURS (16); exactly 16 is accepted, 15.5 is refused"
    error_id: ERR_INSUFFICIENT_CREDIT_HOURS
    http_status: 422
    applies_to: "POST /credentials/{id}/renew"

  - priority: 25
    category: business_temporal
    check: "A LAPSED credential may be renewed only while the logical clock date is <= Credential.grace_through (expires_on + RENEWAL_GRACE_DAYS, 90); the grace_through date itself is inside the window"
    error_id: ERR_RENEWAL_GRACE_EXPIRED
    http_status: 409
    applies_to: "POST /credentials/{id}/renew"

  - priority: 26
    category: business_constraint
    check: "The hearing has no other Assignment in service_status CONFIRMED, CHECKED_IN or COMPLETED (a PROPOSED assignment is legitimately pushed to SUPERSEDED by a replacement create, but an accepted one blocks it; DECLINED, CANCELLED, SUPERSEDED and NO_SHOW rows free the hearing)"
    error_id: ERR_HEARING_ALREADY_COVERED
    http_status: 409
    applies_to: "POST /assignments"

  - priority: 27
    category: business_constraint
    check: "delivery_mode == VRI requires Courthouse.remote_equipment_tier in {BASIC, CERTIFIED_VRI} and Courthouse.status == OPEN; a courthouse at tier NONE cannot host video remote interpreting"
    error_id: ERR_REMOTE_EQUIPMENT_UNAVAILABLE
    http_status: 409
    applies_to: "POST /assignments"

  - priority: 28
    category: business_constraint
    check: "delivery_mode == TELEPHONIC requires Language.telephonic_vendor_available == true, and when vendor_served is true it additionally requires Language.tier_class == RARE and interpreter_id to be absent"
    error_id: ERR_TELEPHONIC_NOT_PERMITTED
    http_status: 422
    applies_to: "POST /assignments"

  - priority: 29
    category: business_constraint
    check: "calculations.vri_capacity_occupancy — the courthouse's concurrent VRI occupancy including this assignment does not exceed Courthouse.vri_concurrent_capacity (closed-interval intersection)"
    error_id: ERR_VRI_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /assignments"

  - priority: 30
    category: business_temporal
    check: "calculations.interpreter_interval_conflict clause (i) — the hearing window does not overlap another live assignment of the same interpreter (half-open, touching endpoints allowed)"
    error_id: ERR_INTERPRETER_DOUBLE_BOOKED
    http_status: 409
    applies_to: "POST /assignments"

  - priority: 31
    category: business_temporal
    check: "calculations.interpreter_interval_conflict clause (ii) — at least TRAVEL_BUFFER_MINUTES (60) separate two IN_PERSON assignments of the same interpreter at different courthouses; exactly 60 minutes is accepted"
    error_id: ERR_TRAVEL_BUFFER_VIOLATION
    http_status: 409
    applies_to: "POST /assignments"

  - priority: 32
    category: business_temporal
    check: "The hearing's scheduled_start is strictly after the logical clock when an assignment is proposed, and actual_end_utc on completion is >= the hearing's scheduled_start and not more than MAX_OVERRUN_HOURS (6) past scheduled_end"
    error_id: ERR_HEARING_WINDOW_CLOSED
    http_status: 409
    applies_to: "POST /assignments, POST /assignments/{id}/complete"

  - priority: 33
    category: business_temporal
    check: "An appeal is filed within APPEAL_WINDOW_DAYS (30) of Complaint.adjudicated_at, measured on the logical clock; day 30 exactly is still inside the window"
    error_id: ERR_APPEAL_WINDOW_EXPIRED
    http_status: 409
    applies_to: "POST /complaints/{id}/appeal"

  - priority: 34
    category: business_fiscal
    check: "Exactly one RateSchedule is in effect for the hearing's scheduled_start date (effective_from <= date and (effective_through is null or date <= effective_through)); no effective schedule blocks confirmation"
    error_id: ERR_RATE_SCHEDULE_NOT_EFFECTIVE
    http_status: 409
    applies_to: "POST /assignments/{id}/confirm, POST /assignments/{id}/complete"

  - priority: 35
    category: business_fiscal
    check: "The PayClaim's Assignment.compliance_status == CLEAR before fiscal approval; an assignment UNDER_QUALITY_REVIEW or with a SUBSTANTIATED_DEFECT holds the money"
    error_id: ERR_QUALITY_REVIEW_OPEN
    http_status: 409
    applies_to: "POST /pay-claims/{id}/approve"

  - priority: 36
    category: business_fiscal
    check: "calculations.courthouse_encumbrance_ledger — the provisional total to be encumbered is <= available_pay_cents for the hearing's courthouse; an amount exactly equal to the remainder is accepted"
    error_id: ERR_COURTHOUSE_BUDGET_EXCEEDED
    http_status: 409
    applies_to: "POST /assignments/{id}/confirm, POST /assignments/{id}/complete"

  - priority: 37
    category: business_temporal
    check: "An UnmetNeedReport period is fully in the past relative to the logical clock (period_end T00:00:00Z <= current_utc) and spans at most MAX_REPORT_SPAN_DAYS (400) days"
    error_id: ERR_REPORT_PERIOD_INVALID
    http_status: 422
    applies_to: "POST /unmet-need-reports"

# ---------------------------------------------------------------------------
# §1.5  API ENDPOINTS
# ---------------------------------------------------------------------------
endpoints:
  # --- configuration: languages -------------------------------------------
  - method: POST
    path: "/languages"
    description: "Register a language in the court interpreter program with its coverage tier and examination availability."
    roles: [ProgramAdmin]
    code: 201
    input: [code, name, tier_class, oral_exam_available, "telephonic_vendor_available?"]
    output: Language
    side_effects: ["initialises active_credentialed_count to 0", "rejects a duplicate code with ERR_DUPLICATE_LANGUAGE_CODE"]

  - method: GET
    path: "/languages"
    description: "List program languages, filterable by coverage tier."
    roles: [ProgramAdmin, CredentialingOfficer, SchedulingCoordinator, FiscalOfficer, QualityReviewer, Interpreter]
    code: 200
    input: ["tier_class?", "limit?", "offset?"]
    output: "Language[]"
    side_effects: ["ordered by code ASC"]

  - method: GET
    path: "/languages/{id}"
    description: "Fetch one language with its computed active_credentialed_count."
    roles: [ProgramAdmin, CredentialingOfficer, SchedulingCoordinator, FiscalOfficer, QualityReviewer, Interpreter]
    code: 200
    input: []
    output: Language
    side_effects: []

  # --- configuration: courthouses -----------------------------------------
  - method: POST
    path: "/courthouses"
    description: "Register a courthouse with its remote-interpreting equipment tier, VRI concurrency capacity and interpreter pay budget."
    roles: [ProgramAdmin]
    code: 201
    input: [name, county_code, courtroom_count, remote_equipment_tier, vri_concurrent_capacity, pay_budget_cents, "status?"]
    output: Courthouse
    side_effects: ["initialises encumbered_pay_cents and obligated_pay_cents to 0", "sets available_pay_cents = pay_budget_cents"]

  - method: GET
    path: "/courthouses/{id}"
    description: "Fetch one courthouse with its live encumbrance ledger (see calculations.courthouse_encumbrance_ledger)."
    roles: [ProgramAdmin, CredentialingOfficer, SchedulingCoordinator, FiscalOfficer, QualityReviewer, Interpreter]
    code: 200
    input: []
    output: Courthouse
    side_effects: []

  - method: GET
    path: "/courthouses"
    description: "List courthouses, filterable by county and equipment tier."
    roles: [ProgramAdmin, CredentialingOfficer, SchedulingCoordinator, FiscalOfficer, QualityReviewer, Interpreter]
    code: 200
    input: ["county_code?", "remote_equipment_tier?", "status?", "limit?", "offset?"]
    output: "Courthouse[]"
    side_effects: ["ordered by name ASC"]

  - method: PATCH
    path: "/courthouses/{id}"
    description: "Update a courthouse's equipment tier, VRI capacity, facility status or pay budget."
    roles: [ProgramAdmin]
    code: 200
    input: ["remote_equipment_tier?", "vri_concurrent_capacity?", "status?", "pay_budget_cents?"]
    output: Courthouse
    side_effects:
      - "increments Courthouse.version by 1"
      - "downgrading remote_equipment_tier to NONE, or setting status to CLOSED, cancels every VRI Assignment at this courthouse in service_status PROPOSED or CONFIRMED with cancel_reason_code EQUIPMENT_WITHDRAWN"
      - "each cascaded cancellation VOIDs the assignment's ENCUMBERED PayClaim and returns the Hearing to SCHEDULED"
      - "recomputes encumbered_pay_cents, obligated_pay_cents and available_pay_cents"
      - "reducing pay_budget_cents below encumbered_pay_cents + obligated_pay_cents is rejected with ERR_COURTHOUSE_BUDGET_EXCEEDED"

  - method: GET
    path: "/courthouses/{id}/unmet-need-reports"
    description: "List the language-access unmet-need reports filed for this courthouse."
    roles: [ProgramAdmin, SchedulingCoordinator, QualityReviewer]
    code: 200
    input: ["limit?", "offset?"]
    output: "UnmetNeedReport[]"
    side_effects: ["ordered by period_start ASC then created_at ASC"]

  # --- configuration: rate schedules ---------------------------------------
  - method: POST
    path: "/rate-schedules"
    description: "Publish an interpreter rate schedule: tier hourly rates, minimum call time, travel reimbursement rules, remote multiplier, late-cancellation terms and the rare-language premium brackets."
    roles: [ProgramAdmin]
    code: 201
    input: [effective_from, "effective_through?", master_hourly_cents, certified_hourly_cents, registered_hourly_cents, provisional_hourly_cents, minimum_call_hours, travel_mileage_rate_cents, travel_free_radius_miles, remote_rate_multiplier, late_cancellation_hours, late_cancellation_pay_hours, rare_premium_low_pct, rare_premium_high_pct, rare_premium_bracket_cents]
    output: RateSchedule
    side_effects: ["rejects a schedule whose effective window overlaps an existing schedule with ERR_RATE_SCHEDULE_OVERLAP"]

  - method: GET
    path: "/rate-schedules"
    description: "List rate schedules, optionally restricted to the schedule in effect on a given date."
    roles: [ProgramAdmin, FiscalOfficer, SchedulingCoordinator, Interpreter]
    code: 200
    input: ["effective_on?", "limit?", "offset?"]
    output: "RateSchedule[]"
    side_effects: ["ordered by effective_from ASC"]

  - method: GET
    path: "/rate-schedules/{id}"
    description: "Fetch one rate schedule."
    roles: [ProgramAdmin, FiscalOfficer, SchedulingCoordinator, Interpreter]
    code: 200
    input: []
    output: RateSchedule
    side_effects: []

  # --- roster: interpreters -------------------------------------------------
  - method: POST
    path: "/interpreters"
    description: "Enrol an interpreter applicant on the program roster."
    roles: [CredentialingOfficer, ProgramAdmin]
    code: 201
    input: [full_name, email, "phone?", home_county_code, "accepts_in_person?", "accepts_remote?"]
    output: Interpreter
    side_effects:
      - "sets roster_status = APPLICANT and ethics_training_status = NOT_STARTED"
      - "sets complaint_points = 0, rolling_12_month_score = 100, lifetime_score = 100"
      - "rejects a duplicate email with ERR_DUPLICATE_INTERPRETER_EMAIL"

  - method: GET
    path: "/interpreters/{id}"
    description: "Fetch one interpreter with computed roster tier, credentialed languages, complaint points and quality scores."
    roles: [ProgramAdmin, CredentialingOfficer, SchedulingCoordinator, FiscalOfficer, QualityReviewer, Interpreter]
    code: 200
    input: []
    output: Interpreter
    side_effects: []

  - method: GET
    path: "/interpreters"
    description: "Search the roster by status, credential tier, credentialed language and home county."
    roles: [ProgramAdmin, CredentialingOfficer, SchedulingCoordinator, FiscalOfficer, QualityReviewer]
    code: 200
    input: ["roster_status?", "credential_tier?", "language_id?", "home_county_code?", "limit?", "offset?"]
    output: "Interpreter[]"
    side_effects: ["ordered by full_name ASC then created_at ASC"]

  - method: POST
    path: "/interpreters/{id}/ethics-training"
    description: "Record completion of the mandatory court-interpreter ethics course."
    roles: [CredentialingOfficer, ProgramAdmin]
    code: 200
    input: [completed_on, provider]
    output: Interpreter
    side_effects:
      - "sets ethics_training_status = COMPLETED and ethics_completed_on = completed_on"
      - "increments Interpreter.version by 1"
      - "does NOT itself activate any credential; the holder must still call POST /credentials/{id}/advance"

  - method: GET
    path: "/interpreters/{id}/quality-score"
    description: "Computed read exposing both variants of calculations.interpreter_quality_score side by side for the same interpreter."
    roles: [ProgramAdmin, QualityReviewer, SchedulingCoordinator, Interpreter]
    code: 200
    input: []
    output: "{ interpreter_id: string, rolling_12_month_score: number, lifetime_score: number, complaint_points: integer, recent_points: integer, older_points: integer }"
    side_effects: []

  # --- credentialing --------------------------------------------------------
  - method: POST
    path: "/credentials"
    description: "Open a credential application for one interpreter in one language at a target tier. Requires the caller's last-observed Interpreter.version."
    roles: [CredentialingOfficer]
    code: 201
    input: [interpreter_id, language_id, target_tier, expected_interpreter_version]
    output: Credential
    side_effects:
      - "increments Interpreter.version by 1"
      - "sets status = PENDING_WRITTEN"
      - "promotes the interpreter from APPLICANT to CANDIDATE when this is the first credential"
      - "a stale expected_interpreter_version is rejected with ERR_STALE_INTERPRETER_VERSION (412)"

  - method: GET
    path: "/credentials/{id}"
    description: "Fetch one credential with best exam scores, attempt counts and cycle dates."
    roles: [ProgramAdmin, CredentialingOfficer, SchedulingCoordinator, QualityReviewer, Interpreter]
    code: 200
    input: []
    output: Credential
    side_effects: []

  - method: GET
    path: "/credentials"
    description: "List credentials filtered by holder, language and status."
    roles: [ProgramAdmin, CredentialingOfficer, SchedulingCoordinator, QualityReviewer, Interpreter]
    code: 200
    input: ["interpreter_id?", "language_id?", "status?", "target_tier?", "limit?", "offset?"]
    output: "Credential[]"
    side_effects: ["ordered by created_at ASC"]

  - method: POST
    path: "/credentials/{id}/exam-attempts"
    description: "Record a written or oral examination attempt against a credential application."
    roles: [CredentialingOfficer]
    code: 201
    input: [exam_type, score, taken_on]
    output: ExamAttempt
    side_effects:
      - "computes attempt_ordinal and result (PASS when score >= the tier's passing floor)"
      - "refreshes Credential.written_best_score / oral_best_score and the matching attempt_count"
      - "increments Credential.version by 1"
      - "does not itself move Credential.status; advancement is an explicit call"

  - method: GET
    path: "/credentials/{id}/exam-attempts"
    description: "List the examination attempts recorded against a credential."
    roles: [ProgramAdmin, CredentialingOfficer, QualityReviewer, Interpreter]
    code: 200
    input: ["exam_type?", "limit?", "offset?"]
    output: "ExamAttempt[]"
    side_effects: ["ordered by taken_on ASC then created_at ASC"]

  - method: POST
    path: "/credentials/{id}/advance"
    description: "Advance a credential application to the next stage once the current stage's requirement is met (written pass, then oral pass where offered, then ethics training)."
    roles: [CredentialingOfficer]
    code: 200
    input: []
    output: Credential
    side_effects:
      - "PENDING_WRITTEN -> PENDING_ORAL when target_tier is MASTER or CERTIFIED and the language offers an oral exam; PENDING_WRITTEN -> PENDING_ETHICS when target_tier is REGISTERED (written examination only)"
      - "PENDING_ORAL -> PENDING_ETHICS"
      - "PENDING_ETHICS -> ACTIVE: sets tier = target_tier, issued_on = clock date, expires_on = issued_on + CYCLE_DAYS (730 for MASTER/CERTIFIED/REGISTERED, 365 for PROVISIONAL), grace_through = expires_on + 90 days"
      - "on ACTIVE, promotes the holder from CANDIDATE to ACTIVE roster status and refreshes Interpreter.credential_tier and credentialed_language_ids"
      - "on ACTIVE, increments Language.active_credentialed_count"
      - "increments Credential.version by 1"

  - method: POST
    path: "/credentials/{id}/renew"
    description: "Renew an ACTIVE or LAPSED credential for a new cycle after recording continuing-education hours."
    roles: [CredentialingOfficer]
    code: 200
    input: [cycle_credit_hours]
    output: Credential
    side_effects:
      - "ACTIVE -> ACTIVE (early renewal) or LAPSED -> ACTIVE (reinstatement inside grace)"
      - "sets expires_on = max(previous expires_on, clock date) + CYCLE_DAYS and grace_through = expires_on + 90 days"
      - "increments renewal_count and resets cycle_credit_hours to the submitted value"
      - "a LAPSED -> ACTIVE renewal restores the holder's roster_status from INACTIVE to ACTIVE when no other credential is lapsed and no SUSPENSION is in effect"
      - "increments Credential.version by 1"

  - method: POST
    path: "/credentials/{id}/revoke"
    description: "Revoke a credential for cause; terminal."
    roles: [ProgramAdmin]
    code: 200
    input: [reason]
    output: Credential
    side_effects:
      - "sets status = REVOKED and clears tier"
      - "cancels every PROPOSED or CONFIRMED Assignment pinned to this credential with cancel_reason_code CREDENTIAL_REVOKED, VOIDing their ENCUMBERED PayClaims and returning their Hearings to SCHEDULED"
      - "decrements Language.active_credentialed_count when the credential was ACTIVE"
      - "recomputes Interpreter.credential_tier; an interpreter with no remaining ACTIVE credential drops to INACTIVE"
      - "increments Credential.version by 1"

  # --- calendar: hearings ---------------------------------------------------
  - method: POST
    path: "/hearings"
    description: "Place a hearing that needs interpretation on a courthouse calendar; the program scores its priority at creation."
    roles: [SchedulingCoordinator, ProgramAdmin]
    code: 201
    input: [courthouse_id, language_id, case_number, hearing_type, in_custody, scheduled_start, scheduled_end, requested_delivery_mode]
    output: Hearing
    side_effects:
      - "computes lead_time_days from the logical clock, then priority_score and priority_class per calculations.hearing_priority_score; both are frozen at creation"
      - "sets status = SCHEDULED and continuance_count = 0"
      - "rejects scheduled_end <= scheduled_start with ERR_INVALID_REQUEST"

  - method: GET
    path: "/hearings/{id}"
    description: "Fetch one hearing with its frozen priority score and class."
    roles: [ProgramAdmin, SchedulingCoordinator, CredentialingOfficer, QualityReviewer, FiscalOfficer, Interpreter]
    code: 200
    input: []
    output: Hearing
    side_effects: []

  - method: GET
    path: "/hearings"
    description: "List calendar hearings filtered by courthouse, language, coverage status and priority class."
    roles: [ProgramAdmin, SchedulingCoordinator, CredentialingOfficer, QualityReviewer, FiscalOfficer]
    code: 200
    input: ["courthouse_id?", "language_id?", "status?", "priority_class?", "limit?", "offset?"]
    output: "Hearing[]"
    side_effects: ["ordered by scheduled_start ASC then created_at ASC"]

  - method: POST
    path: "/hearings/{id}/continue"
    description: "Continue (postpone) a hearing, releasing any interpreter already assigned to it."
    roles: [SchedulingCoordinator, ProgramAdmin]
    code: 200
    input: [reason_code]
    output: Hearing
    side_effects:
      - "sets status = CONTINUED, increments continuance_count and records continuance_reason_code"
      - "increments Hearing.version by 1, which invalidates any expected_hearing_version a client was holding"
      - "cancels the hearing's live Assignment (PROPOSED or CONFIRMED) with cancel_reason_code COURT_CONTINUANCE"
      - "a cancelled CONFIRMED assignment inside RateSchedule.late_cancellation_hours of scheduled_start FINALIZES its PayClaim on the LATE_CANCELLATION variant (variant = FINAL, late_cancellation = true) instead of VOIDing it, moving the amount from Courthouse.encumbered_pay_cents to obligated_pay_cents and into Interpreter.pending_pay_cents"
      - "a continued hearing is excluded from every UnmetNeedReport counter"

  - method: GET
    path: "/hearings/{id}/eligible-interpreters"
    description: "Ranked pool of interpreters eligible to serve this hearing per calculations.interpreter_eligibility_ranking. Returns an empty array (200) when no interpreter qualifies — the rare-language unmet-need case."
    roles: [SchedulingCoordinator, ProgramAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: "Interpreter[]"
    side_effects: ["read-only; ordered by credential tier rank DESC, same-county first, rolling_12_month_score DESC, created_at ASC"]

  # --- assignments ----------------------------------------------------------
  - method: POST
    path: "/assignments"
    description: "Assign an interpreter (or a telephonic vendor) to a hearing. Requires the caller's last-observed Hearing.version."
    roles: [SchedulingCoordinator, ProgramAdmin]
    code: 201
    input: [hearing_id, "interpreter_id?", delivery_mode, "vendor_served?", "estimated_one_way_miles?", expected_hearing_version]
    output: Assignment
    side_effects:
      - "increments Hearing.version by 1"
      - "sets service_status = PROPOSED and compliance_status = CLEAR"
      - "pins credential_id and credential_tier_snapshot from the interpreter's best ACTIVE credential in the hearing's language"
      - "leaves the Hearing in SCHEDULED — coverage is recorded only when the assignment reaches CONFIRMED"
      - "when the hearing already has a PROPOSED assignment, that row moves to SUPERSEDED and Hearing.version is incremented by 1 in this same call"
      - "a stale expected_hearing_version is rejected with ERR_STALE_HEARING_VERSION (412)"
      - "runs calculations.interpreter_interval_conflict and calculations.vri_capacity_occupancy before accepting"

  - method: GET
    path: "/assignments/{id}"
    description: "Fetch one assignment with both of its status dimensions."
    roles: [ProgramAdmin, SchedulingCoordinator, FiscalOfficer, QualityReviewer, Interpreter]
    code: 200
    input: []
    output: Assignment
    side_effects: []

  - method: GET
    path: "/assignments"
    description: "List assignments filtered by hearing, interpreter, pinned credential and either status dimension."
    roles: [ProgramAdmin, SchedulingCoordinator, FiscalOfficer, QualityReviewer, Interpreter]
    code: 200
    input: ["hearing_id?", "interpreter_id?", "credential_id?", "service_status?", "compliance_status?", "limit?", "offset?"]
    output: "Assignment[]"
    side_effects: ["ordered by created_at ASC"]

  - method: POST
    path: "/assignments/{id}/confirm"
    description: "Interpreter accepts the assignment; the program encumbers the provisional pay against the courthouse budget."
    roles: [Interpreter, SchedulingCoordinator]
    code: 200
    input: []
    output: Assignment
    side_effects:
      - "PROPOSED -> CONFIRMED"
      - "creates a PayClaim in status ENCUMBERED pinning rate_schedule_id and provisional_total_cents from the PROVISIONAL variant of calculations.assignment_pay"
      - "adds provisional_total_cents to Courthouse.encumbered_pay_cents and reduces available_pay_cents"
      - "rejected with ERR_COURTHOUSE_BUDGET_EXCEEDED when the provisional total exceeds available_pay_cents"
      - "increments Assignment.version by 1"

  - method: POST
    path: "/assignments/{id}/decline"
    description: "Interpreter declines a proposed assignment; the hearing remains SCHEDULED and open to another proposal."
    roles: [Interpreter]
    code: 200
    input: [reason_code]
    output: Assignment
    side_effects:
      - "PROPOSED -> DECLINED (terminal on the service dimension) and records cancel_reason_code = INTERPRETER_DECLINED"
      - "the Hearing is untouched: a PROPOSED assignment never moved it out of SCHEDULED, so it stays SCHEDULED and its version does not change"
      - "no PayClaim exists yet, so no ledger movement occurs"

  - method: POST
    path: "/assignments/{id}/check-in"
    description: "Interpreter checks in at the courtroom (or into the VRI session); records the logical clock as the billable start."
    roles: [Interpreter]
    code: 200
    input: []
    output: Assignment
    side_effects:
      - "CONFIRMED -> CHECKED_IN and sets check_in_utc to the logical clock"
      - "increments Assignment.version by 1"

  - method: POST
    path: "/assignments/{id}/complete"
    description: "Close out served interpretation: records the actual end instant and reported mileage, then finalizes pay on the FINAL variant."
    roles: [Interpreter, SchedulingCoordinator]
    code: 200
    input: [actual_end_utc, "one_way_miles?"]
    output: Assignment
    side_effects:
      - "CHECKED_IN -> COMPLETED, or CONFIRMED -> COMPLETED when vendor_served is true"
      - "sets actual_end_utc and actual_one_way_miles"
      - "moves the Hearing from COVERED to SERVED and increments Hearing.version by 1"
      - "recomputes the PayClaim on the FINAL variant of calculations.assignment_pay, sets final_total_cents and moves the claim ENCUMBERED -> FINALIZED"
      - "moves the amount out of Courthouse.encumbered_pay_cents into obligated_pay_cents and adds final_total_cents to Interpreter.pending_pay_cents"
      - "increments Assignment.version by 1"

  - method: POST
    path: "/assignments/{id}/cancel"
    description: "Cancel a proposed or confirmed assignment; late cancellations still pay the interpreter."
    roles: [SchedulingCoordinator, ProgramAdmin]
    code: 200
    input: [reason_code]
    output: Assignment
    side_effects:
      - "PROPOSED or CONFIRMED -> CANCELLED"
      - "an early cancellation (lead time >= RateSchedule.late_cancellation_hours) VOIDs the ENCUMBERED PayClaim and releases exactly provisional_total_cents from Courthouse.encumbered_pay_cents"
      - "a late cancellation recomputes the claim on the LATE_CANCELLATION variant of calculations.assignment_pay, sets variant = FINAL with late_cancellation = true, writes final_total_cents and moves the claim ENCUMBERED -> FINALIZED"
      - "a COVERED Hearing returns to SCHEDULED on an early cancellation or moves to UNMET on a late one, incrementing Hearing.version by 1; a Hearing still in SCHEDULED (the assignment was only PROPOSED) and a Hearing already CONTINUED are both left untouched"
      - "increments Assignment.version by 1"

  - method: POST
    path: "/assignments/{id}/no-show"
    description: "Record that a confirmed interpreter failed to appear; opens a quality review and files an automatic complaint."
    roles: [SchedulingCoordinator, ProgramAdmin]
    code: 200
    input: []
    output: Assignment
    side_effects:
      - "CONFIRMED -> NO_SHOW on the service dimension and CLEAR -> UNDER_QUALITY_REVIEW on the compliance dimension"
      - "VOIDs the ENCUMBERED PayClaim and releases its provisional amount from Courthouse.encumbered_pay_cents"
      - "files a Complaint in status FILED with category NO_SHOW, severity MAJOR and filed_by_user_id set to the acting X-User-ID"
      - "moves the Hearing from COVERED to UNMET and increments Hearing.version by 1 — a no-show leaves the hearing uncovered for the record, it does not reopen it for scheduling"
      - "increments Assignment.version by 1"

  # --- pay claims -----------------------------------------------------------
  - method: GET
    path: "/pay-claims/{id}"
    description: "Fetch one pay claim with the authoritative variant's components."
    roles: [ProgramAdmin, FiscalOfficer, SchedulingCoordinator, Interpreter]
    code: 200
    input: []
    output: PayClaim
    side_effects: []

  - method: GET
    path: "/pay-claims"
    description: "List pay claims filtered by assignment, rate schedule and status."
    roles: [ProgramAdmin, FiscalOfficer, SchedulingCoordinator, Interpreter]
    code: 200
    input: ["assignment_id?", "rate_schedule_id?", "status?", "limit?", "offset?"]
    output: "PayClaim[]"
    side_effects: ["ordered by created_at ASC"]

  - method: POST
    path: "/pay-claims/{id}/submit"
    description: "Interpreter submits a finalized claim for fiscal review."
    roles: [Interpreter]
    code: 200
    input: []
    output: PayClaim
    side_effects:
      - "FINALIZED -> SUBMITTED"
      - "increments PayClaim.version by 1"

  - method: POST
    path: "/pay-claims/{id}/approve"
    description: "Fiscal officer approves a submitted claim; blocked while the underlying assignment is under quality review."
    roles: [FiscalOfficer]
    code: 200
    input: []
    output: PayClaim
    side_effects:
      - "SUBMITTED -> APPROVED"
      - "rejected with ERR_QUALITY_REVIEW_OPEN when Assignment.compliance_status is not CLEAR"
      - "increments PayClaim.version by 1"

  - method: POST
    path: "/pay-claims/{id}/pay"
    description: "Fiscal officer issues the warrant for an approved claim."
    roles: [FiscalOfficer]
    code: 200
    input: [payment_reference]
    output: PayClaim
    side_effects:
      - "APPROVED -> PAID and records payment_reference"
      - "moves final_total_cents from Interpreter.pending_pay_cents to Interpreter.paid_pay_cents"
      - "increments PayClaim.version by 1"

  # --- complaints and discipline -------------------------------------------
  - method: POST
    path: "/complaints"
    description: "File a complaint about interpreter performance, optionally tied to a specific assignment."
    roles: [QualityReviewer, SchedulingCoordinator, ProgramAdmin]
    code: 201
    input: [interpreter_id, "assignment_id?", category, severity, narrative]
    output: Complaint
    side_effects:
      - "sets status = FILED and filed_by_user_id to the acting X-User-ID"
      - "when assignment_id is present, moves that Assignment's compliance_status CLEAR -> UNDER_QUALITY_REVIEW, which freezes fiscal approval of its PayClaim"
      - "does not change the interpreter's roster status or points at intake"

  - method: GET
    path: "/complaints/{id}"
    description: "Fetch one complaint with its workflow state and adjudication metadata."
    roles: [ProgramAdmin, QualityReviewer, SchedulingCoordinator, Interpreter]
    code: 200
    input: []
    output: Complaint
    side_effects: []

  - method: GET
    path: "/complaints"
    description: "List complaints filtered by interpreter, assignment and workflow status."
    roles: [ProgramAdmin, QualityReviewer, SchedulingCoordinator, Interpreter]
    code: 200
    input: ["interpreter_id?", "assignment_id?", "status?", "severity?", "limit?", "offset?"]
    output: "Complaint[]"
    side_effects: ["ordered by created_at ASC"]

  - method: POST
    path: "/complaints/{id}/review"
    description: "Quality reviewer records findings and a recommendation. The reviewer must not be the filer."
    roles: [QualityReviewer]
    code: 200
    input: [recommendation, findings]
    output: Complaint
    side_effects:
      - "FILED -> REVIEWED, records reviewer_user_id and reviewer_recommendation"
      - "rejected with ERR_SEGREGATION_OF_DUTIES when X-User-ID equals filed_by_user_id"
      - "increments Complaint.version by 1"

  - method: POST
    path: "/complaints/{id}/adjudicate"
    description: "Program administrator disposes of a reviewed complaint, optionally imposing a sanction."
    roles: [ProgramAdmin]
    code: 200
    input: [disposition, "sanction_type?", "suspension_days?"]
    output: Complaint
    side_effects:
      - "REVIEWED -> SUBSTANTIATED (with a sanction) or REVIEWED -> DISMISSED"
      - "the sanction_type must be permitted by Complaint.severity — MINOR allows LETTER only, MAJOR allows LETTER, PROBATION or SUSPENSION, SEVERE allows any of the four; anything else is rejected with ERR_INVALID_REQUEST"
      - "records adjudicator_user_id and adjudicated_at from the logical clock, starting the 30-day appeal window"
      - "a substantiated disposition creates a DisciplinaryAction in status IN_EFFECT with points from SANCTION_POINTS and effective_through = effective_from + suspension_days (null for REVOCATION)"
      - "recomputes Interpreter.complaint_points, rolling_12_month_score and lifetime_score"
      - "a SUSPENSION or REVOCATION sanction moves the interpreter to SUSPENDED or REVOKED and cancels every PROPOSED or CONFIRMED assignment overlapping the sanction window with cancel_reason_code INTERPRETER_SUSPENDED, VOIDing their ENCUMBERED PayClaims and returning their Hearings to SCHEDULED"
      - "sets the linked Assignment's compliance_status to SUBSTANTIATED_DEFECT on substantiation, or back to CLEAR on dismissal"
      - "increments Complaint.version by 1"

  - method: POST
    path: "/complaints/{id}/appeal"
    description: "The disciplined interpreter appeals a substantiated complaint within 30 days of adjudication."
    roles: [Interpreter]
    code: 200
    input: [grounds]
    output: Complaint
    side_effects:
      - "SUBSTANTIATED -> APPEALED and records appeal_filed_at"
      - "rejected with ERR_APPEAL_WINDOW_EXPIRED once the logical clock passes adjudicated_at + 30 days"
      - "the DisciplinaryAction stays IN_EFFECT while the appeal is pending"
      - "increments Complaint.version by 1"

  - method: POST
    path: "/complaints/{id}/appeal-decision"
    description: "Program administrator decides an appeal: vacate, uphold, or remand for a fresh review. The decider must not be the original adjudicator."
    roles: [ProgramAdmin]
    code: 200
    input: [outcome]
    output: Complaint
    side_effects:
      - "APPEALED -> VACATED, UPHELD, or back to FILED on a remand (which increments remand_count and clears reviewer_user_id, reviewer_recommendation, adjudicator_user_id, disposition and adjudicated_at)"
      - "VACATED rescinds the DisciplinaryAction (status RESCINDED), removing its points and restoring Interpreter.complaint_points, both quality scores and roster_status to their pre-sanction values"
      - "a vacated sanction does NOT resurrect the assignments the sanction cancelled"
      - "VACATED also returns the linked Assignment's compliance_status to CLEAR, releasing the fiscal hold"
      - "rejected with ERR_SEGREGATION_OF_DUTIES when X-User-ID equals adjudicator_user_id"
      - "increments Complaint.version by 1"

  - method: GET
    path: "/disciplinary-actions/{id}"
    description: "Fetch one disciplinary action with its points and effective window."
    roles: [ProgramAdmin, QualityReviewer, SchedulingCoordinator, Interpreter]
    code: 200
    input: []
    output: DisciplinaryAction
    side_effects: []

  - method: GET
    path: "/disciplinary-actions"
    description: "List disciplinary actions filtered by originating complaint, interpreter and status."
    roles: [ProgramAdmin, QualityReviewer, SchedulingCoordinator, Interpreter]
    code: 200
    input: ["complaint_id?", "interpreter_id?", "status?", "action_type?", "limit?", "offset?"]
    output: "DisciplinaryAction[]"
    side_effects: ["ordered by effective_from ASC then created_at ASC"]

  # --- language-access compliance reporting --------------------------------
  - method: POST
    path: "/unmet-need-reports"
    description: "Produce the language-access-plan compliance snapshot for one courthouse over a closed past period; the counters and verdict are frozen onto the report."
    roles: [ProgramAdmin, QualityReviewer]
    code: 201
    input: [courthouse_id, period_start, period_end]
    output: UnmetNeedReport
    side_effects:
      - "computes every counter, coverage_rate_pct, compliance_status and by_language per calculations.language_access_coverage"
      - "an empty resolved pool yields coverage_rate_pct 100.00 and compliance_status COMPLIANT"
      - "immutable once created (common_fields: false — no version, no update endpoint)"

  # --- operations -----------------------------------------------------------
  - method: POST
    path: "/ops/daily-sweep"
    description: "Advance every clock-driven consequence to the current logical time, in a fixed order: (1) credential expiry, (2) disciplinary-action expiry and reinstatement, (3) marking passed uncovered hearings UNMET."
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: "{ swept_at: string, lapsed_credential_ids: string[], downgraded_interpreter_ids: string[], expired_action_ids: string[], reinstated_interpreter_ids: string[], unmet_hearing_ids: string[], cancelled_assignment_ids: string[], voided_pay_claim_ids: string[] }"
    side_effects:
      - "step 1: every ACTIVE Credential whose expires_on is strictly before the clock date becomes LAPSED, decrements Language.active_credentialed_count, and cancels its PROPOSED or CONFIRMED assignments with cancel_reason_code CREDENTIAL_LAPSED (VOIDing ENCUMBERED claims and returning Hearings to SCHEDULED); an interpreter left with no ACTIVE credential drops from ACTIVE to INACTIVE"
      - "step 2: every IN_EFFECT DisciplinaryAction whose effective_through is strictly before the clock date becomes EXPIRED; a SUSPENDED interpreter with no remaining IN_EFFECT suspension returns to ACTIVE when it still holds an ACTIVE credential, otherwise to INACTIVE"
      - "step 3: every Hearing still SCHEDULED whose scheduled_end is at or before the clock becomes UNMET; a hearing that step 1 just returned to SCHEDULED is therefore swept to UNMET in the same call"
      - "idempotent: a second call at the same logical time returns all-empty arrays and mutates nothing"

  - method: POST
    path: "/_clock/set_current_utc"
    description: "Test-driving endpoint that sets the server's logical clock. Before any call, the logical clock reads exactly the fixed startup default 2026-08-01T00:00:00Z and never falls back to real wall-clock time. Moving the clock backwards is rejected with ERR_INVALID_REQUEST."
    roles: [ProgramAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["no entity is mutated; clock-driven consequences are applied only by POST /ops/daily-sweep"]

# ---------------------------------------------------------------------------
# §1.6  ERROR CODE CATALOG
# ---------------------------------------------------------------------------
errors:
  # --- auth ---------------------------------------------------------------
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, empty, or naming a role outside the six declared roles"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "The acting role is not listed in the endpoint's roles"
  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "An Interpreter-role caller acts on an assignment, pay claim or complaint whose interpreter_id is not the caller's X-User-ID"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 409
    condition: "The complaint reviewer equals the filer, or the appeal decider equals the original adjudicator"

  # --- request shape ------------------------------------------------------
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Missing required field, unknown enum value, malformed datetime or date, negative money or mileage, limit outside [1,100], offset < 0, scheduled_end <= scheduled_start, period_end <= period_start, or a backwards clock set"

  # --- existence ----------------------------------------------------------
  - id: ERR_INTERPRETER_NOT_FOUND
    http: 404
    condition: "No Interpreter with the given id, in the path or in a request body"
  - id: ERR_CREDENTIAL_NOT_FOUND
    http: 404
    condition: "No Credential with the given id"
  - id: ERR_HEARING_NOT_FOUND
    http: 404
    condition: "No Hearing with the given id, in the path or as hearing_id"
  - id: ERR_ASSIGNMENT_NOT_FOUND
    http: 404
    condition: "No Assignment with the given id, in the path or as assignment_id"
  - id: ERR_PAY_CLAIM_NOT_FOUND
    http: 404
    condition: "No PayClaim with the given id"
  - id: ERR_COMPLAINT_NOT_FOUND
    http: 404
    condition: "No Complaint with the given id"
  - id: ERR_DISCIPLINARY_ACTION_NOT_FOUND
    http: 404
    condition: "No DisciplinaryAction with the given id"
  - id: ERR_CONFIG_RESOURCE_NOT_FOUND
    http: 404
    condition: "No Language, Courthouse or RateSchedule with the given id"

  # --- uniqueness ---------------------------------------------------------
  - id: ERR_DUPLICATE_LANGUAGE_CODE
    http: 409
    condition: "A Language already exists with the submitted code"
  - id: ERR_DUPLICATE_INTERPRETER_EMAIL
    http: 409
    condition: "An Interpreter already exists with the submitted email"
  - id: ERR_DUPLICATE_ACTIVE_CREDENTIAL
    http: 409
    condition: "The interpreter already holds a live credential (ACTIVE, LAPSED or any PENDING_*) in the requested language"
  - id: ERR_RATE_SCHEDULE_OVERLAP
    http: 409
    condition: "The submitted effective window overlaps an existing RateSchedule's window"

  # --- optimistic concurrency --------------------------------------------
  - id: ERR_STALE_HEARING_VERSION
    http: 412
    condition: "expected_hearing_version does not equal the current Hearing.version on POST /assignments"
  - id: ERR_STALE_INTERPRETER_VERSION
    http: 412
    condition: "expected_interpreter_version does not equal the current Interpreter.version on POST /credentials"

  # --- state --------------------------------------------------------------
  - id: ERR_INVALID_CREDENTIAL_STATE
    http: 409
    condition: "The credential's status does not permit the requested transition (advance, renew, revoke or exam attempt)"
  - id: ERR_INVALID_ASSIGNMENT_STATE
    http: 409
    condition: "The assignment's service_status does not permit the requested transition"
  - id: ERR_INVALID_PAY_CLAIM_STATE
    http: 409
    condition: "The pay claim's status does not permit submit, approve or pay"
  - id: ERR_INVALID_COMPLAINT_STATE
    http: 409
    condition: "The complaint's status does not permit review, adjudicate, appeal or appeal-decision"
  - id: ERR_HEARING_NOT_SCHEDULABLE
    http: 409
    condition: "The hearing is not SCHEDULED when an assignment is created — a SERVED, UNMET or CONTINUED hearing is not schedulable at all, while a hearing that is merely COVERED is handled by ERR_HEARING_ALREADY_COVERED — or the hearing is already SERVED, UNMET or CONTINUED when a continuance is requested"

  # --- credentialing safety ----------------------------------------------
  - id: ERR_INTERPRETER_NOT_ON_ACTIVE_ROSTER
    http: 409
    condition: "The named interpreter's roster_status is not ACTIVE"
  - id: ERR_CREDENTIAL_NOT_ACTIVE
    http: 409
    condition: "The interpreter holds no ACTIVE credential in the hearing's language"
  - id: ERR_TIER_BELOW_HEARING_REQUIREMENT
    http: 409
    condition: "The interpreter's best credential tier ranks below the hearing's required minimum tier"
  - id: ERR_ETHICS_TRAINING_INCOMPLETE
    http: 409
    condition: "Ethics training is not COMPLETED when a credential is activated or an assignment is created"
  - id: ERR_QUALITY_SCORE_BELOW_ASSIGNMENT_FLOOR
    http: 409
    condition: "rolling_12_month_score is below the quality floor of 60 for a priority-class-A hearing"
  - id: ERR_EXAM_ATTEMPT_LIMIT_REACHED
    http: 409
    condition: "A fourth attempt at the same exam_type on one credential"
  - id: ERR_EXAM_RETAKE_TOO_SOON
    http: 409
    condition: "taken_on is fewer than 90 days after the most recent failed attempt of the same exam_type"
  - id: ERR_PROVISIONAL_TIER_NOT_PERMITTED
    http: 422
    condition: "target_tier PROVISIONAL requested for a language that is neither RARE nor missing an oral examination"
  - id: ERR_ORAL_EXAM_NOT_OFFERED
    http: 422
    condition: "An ORAL exam attempt recorded for a language whose oral_exam_available is false"
  - id: ERR_INSUFFICIENT_CREDIT_HOURS
    http: 422
    condition: "cycle_credit_hours below the 16-hour renewal minimum"
  - id: ERR_RENEWAL_GRACE_EXPIRED
    http: 409
    condition: "A LAPSED credential is renewed after its grace_through date"

  # --- assignment constraints --------------------------------------------
  - id: ERR_HEARING_ALREADY_COVERED
    http: 409
    condition: "The hearing already has an Assignment in service_status CONFIRMED, CHECKED_IN or COMPLETED (a PROPOSED assignment does not block a replacement create — it is pushed to SUPERSEDED instead — and DECLINED, CANCELLED, SUPERSEDED and NO_SHOW rows free the hearing)"
  - id: ERR_REMOTE_EQUIPMENT_UNAVAILABLE
    http: 409
    condition: "VRI requested at a courthouse whose remote_equipment_tier is NONE or whose status is not OPEN"
  - id: ERR_TELEPHONIC_NOT_PERMITTED
    http: 422
    condition: "TELEPHONIC requested for a language without a telephonic vendor, or vendor_served requested for a non-RARE language or together with an interpreter_id"
  - id: ERR_VRI_CAPACITY_EXCEEDED
    http: 409
    condition: "The courthouse's concurrent VRI occupancy would exceed vri_concurrent_capacity"
  - id: ERR_INTERPRETER_DOUBLE_BOOKED
    http: 409
    condition: "The hearing window overlaps another live assignment of the same interpreter"
  - id: ERR_TRAVEL_BUFFER_VIOLATION
    http: 409
    condition: "Fewer than 60 minutes separate two IN_PERSON assignments of the same interpreter at different courthouses"
  - id: ERR_HEARING_WINDOW_CLOSED
    http: 409
    condition: "The hearing has already started when an assignment is proposed, or actual_end_utc lies before scheduled_start or more than 6 hours past scheduled_end"
  - id: ERR_APPEAL_WINDOW_EXPIRED
    http: 409
    condition: "An appeal filed more than 30 days after adjudicated_at"

  # --- fiscal -------------------------------------------------------------
  - id: ERR_RATE_SCHEDULE_NOT_EFFECTIVE
    http: 409
    condition: "No RateSchedule is in effect on the hearing's scheduled_start date"
  - id: ERR_QUALITY_REVIEW_OPEN
    http: 409
    condition: "Fiscal approval attempted while the assignment's compliance_status is UNDER_QUALITY_REVIEW or SUBSTANTIATED_DEFECT"
  - id: ERR_COURTHOUSE_BUDGET_EXCEEDED
    http: 409
    condition: "The amount to encumber or obligate exceeds the courthouse's available_pay_cents, or a budget reduction would fall below amounts already committed"
  - id: ERR_REPORT_PERIOD_INVALID
    http: 422
    condition: "An unmet-need report period is not fully in the past or spans more than 400 days"

# ---------------------------------------------------------------------------
# §1.7  RBAC MATRIX  (role_model: segregation_of_duties)
# ---------------------------------------------------------------------------
roles:
  - name: ProgramAdmin
    description: "State court interpreter program administrator: owns configuration (languages, courthouses, rate schedules), revocation, complaint adjudication, appeal decisions, compliance reporting and the operations sweep."
    identity: "opaque"
    exclusive_operations:
      - "POST /languages"
      - "POST /courthouses"
      - "PATCH /courthouses/{id}"
      - "POST /rate-schedules"
      - "POST /credentials/{id}/revoke"
      - "POST /complaints/{id}/adjudicate"
      - "POST /complaints/{id}/appeal-decision"
      - "POST /ops/daily-sweep"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "POST /interpreters (with CredentialingOfficer)"
      - "POST /interpreters/{id}/ethics-training (with CredentialingOfficer)"
      - "POST /hearings, POST /hearings/{id}/continue, GET /hearings/{id}/eligible-interpreters (with SchedulingCoordinator)"
      - "POST /assignments, POST /assignments/{id}/cancel, POST /assignments/{id}/no-show (with SchedulingCoordinator)"
      - "POST /complaints (with QualityReviewer and SchedulingCoordinator)"
      - "POST /unmet-need-reports (with QualityReviewer)"
      - "all GET reads"

  - name: CredentialingOfficer
    description: "Runs the credentialing pipeline: roster enrolment, examination records, ethics-training completion, stage advancement and cycle renewal. Cannot revoke a credential and cannot schedule."
    identity: "opaque"
    exclusive_operations:
      - "POST /credentials"
      - "POST /credentials/{id}/exam-attempts"
      - "POST /credentials/{id}/advance"
      - "POST /credentials/{id}/renew"
    shared_operations:
      - "POST /interpreters (with ProgramAdmin)"
      - "POST /interpreters/{id}/ethics-training (with ProgramAdmin)"
      - "GET reads on languages, interpreters, credentials, exam attempts and hearings"

  - name: SchedulingCoordinator
    description: "Works the case calendar: creates hearings, continues them, ranks eligible interpreters, proposes and cancels assignments, records no-shows, and may complete an assignment on the interpreter's behalf. Cannot credential and cannot approve money."
    identity: "opaque"
    exclusive_operations:
      - "POST /hearings"
      - "POST /hearings/{id}/continue"
      - "GET /hearings/{id}/eligible-interpreters"
      - "POST /assignments"
      - "POST /assignments/{id}/cancel"
      - "POST /assignments/{id}/no-show"
    shared_operations:
      - "POST /assignments/{id}/confirm (with Interpreter)"
      - "POST /assignments/{id}/complete (with Interpreter)"
      - "POST /complaints (with QualityReviewer and ProgramAdmin)"
      - "GET reads on hearings, assignments, pay claims, complaints and disciplinary actions"

  - name: FiscalOfficer
    description: "Court fiscal officer: approves and pays interpreter claims. Cannot create or finalize a claim, cannot schedule, cannot credential."
    identity: "opaque"
    exclusive_operations:
      - "POST /pay-claims/{id}/approve"
      - "POST /pay-claims/{id}/pay"
    shared_operations:
      - "GET reads on rate schedules, hearings, assignments and pay claims"

  - name: QualityReviewer
    description: "Interpreter performance and quality review: reviews complaints and files new ones, and pulls language-access compliance reports. Cannot adjudicate or decide appeals — that separation is the core segregation of duties."
    identity: "opaque"
    exclusive_operations:
      - "POST /complaints/{id}/review"
    shared_operations:
      - "POST /complaints (with SchedulingCoordinator and ProgramAdmin)"
      - "POST /unmet-need-reports (with ProgramAdmin)"
      - "GET reads on interpreters, credentials, assignments, complaints and disciplinary actions"

  - name: Interpreter
    description: "The credentialed interpreter acting for themselves: accepts, declines, checks in to and completes their own assignments, submits their own pay claims, and appeals a substantiated complaint against them. X-User-ID is the Interpreter row's id."
    identity: "entity_backed:Interpreter"
    exclusive_operations:
      - "POST /assignments/{id}/decline"
      - "POST /assignments/{id}/check-in"
      - "POST /pay-claims/{id}/submit"
      - "POST /complaints/{id}/appeal"
    shared_operations:
      - "POST /assignments/{id}/confirm (with SchedulingCoordinator)"
      - "POST /assignments/{id}/complete (with SchedulingCoordinator)"
      - "GET reads limited to the interpreter's own credentials, assignments, pay claims and complaints, plus the public language and rate-schedule catalogs"

# ---------------------------------------------------------------------------
# Segregation-of-duties summary (role_model: segregation_of_duties)
# ---------------------------------------------------------------------------
segregation_of_duties:
  - rule: "complaint-review-independence"
    detail: "Complaint.reviewer_user_id (X-User-ID of the QualityReviewer calling POST /complaints/{id}/review) MUST differ from Complaint.filed_by_user_id. Two distinct QualityReviewer X-User-IDs are therefore required whenever a complaint was filed by a QualityReviewer; a no-show-generated complaint carries the SchedulingCoordinator's id as the filer."
    error_id: ERR_SEGREGATION_OF_DUTIES
  - rule: "appeal-decision-independence"
    detail: "The ProgramAdmin X-User-ID calling POST /complaints/{id}/appeal-decision MUST differ from Complaint.adjudicator_user_id recorded by POST /complaints/{id}/adjudicate."
    error_id: ERR_SEGREGATION_OF_DUTIES
  - rule: "pay-approval-independence"
    detail: "Only FiscalOfficer may approve and pay; the Interpreter who submits a claim and the SchedulingCoordinator who created the assignment can never move it past SUBMITTED."
    error_id: ERR_UNAUTHORIZED
