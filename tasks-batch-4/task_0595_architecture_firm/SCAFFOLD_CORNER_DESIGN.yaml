  # =========================================================================
  - section: endpoints
    instances:

      - name: time_entry_list_supports_limit_offset_and_status_filter
        claim_type: Standard CRUD
        grounds:
          - endpoints[GET /time-entries]
          - response_envelope.pagination_fields
        distinguishing_aspect: "GET /time-entries honours limit/offset/status: with three DRAFT entries for one staff member, limit=2&offset=0 returns 2 rows with total_count 3 and has_more true, and offset=2 returns 1 row with has_more false."
        test_recipe:
          setup:
            - "A project with an SD phase and three non-overlapping DRAFT time entries for the same architect on 2026-05-04, 2026-05-05 and 2026-05-06."
          setup_api_calls:
            - call: "POST /staff"
              payload: { full_name: "Pat Manager", title: "PROJECT_MANAGER", billing_rate_cents_per_hour: 25000, cost_rate_cents_per_hour: 12000 }
              as: PrincipalArchitect
              as_user_id: "principal-alice"
              captures: { pm_id: $.data.id }
            - call: "POST /staff"
              payload: { full_name: "Avery Architect", title: "ARCHITECT", billing_rate_cents_per_hour: 12000, cost_rate_cents_per_hour: 5000 }
              as: PrincipalArchitect
              as_user_id: "principal-alice"
              captures: { arch_id: $.data.id }
            - call: "POST /projects"
              payload: { project_number: "PAG-001", name: "Page Plaza", client_rep_user_id: "client-1", project_manager_staff_id: "${pm_id}", labor_budget_cents: 10000000 }
              as: PrincipalArchitect
              as_user_id: "principal-alice"
              captures: { proj: $.data.id }
            - call: "POST /phases"
              payload: { project_id: "${proj}", phase_code: "SD", weight_bp: 2500, milestone_name: "SD", milestone_due_at: "2026-08-01T00:00:00Z" }
              as: ProjectManager
              as_user_id: "${pm_id}"
              captures: { sd: $.data.id }
            - call: "POST /time-entries"
              payload: { phase_id: "${sd}", staff_member_id: "${arch_id}", start_utc: "2026-05-04T09:00:00Z", end_utc: "2026-05-04T17:00:00Z" }
              as: ProjectManager
              as_user_id: "${pm_id}"
            - call: "POST /time-entries"
              payload: { phase_id: "${sd}", staff_member_id: "${arch_id}", start_utc: "2026-05-05T09:00:00Z", end_utc: "2026-05-05T17:00:00Z" }
              as: ProjectManager
              as_user_id: "${pm_id}"
            - call: "POST /time-entries"
              payload: { phase_id: "${sd}", staff_member_id: "${arch_id}", start_utc: "2026-05-06T09:00:00Z", end_utc: "2026-05-06T17:00:00Z" }
              as: ProjectManager
              as_user_id: "${pm_id}"
          trigger:
            - call: "GET /time-entries"
              payload: { staff_member_id: "${arch_id}", status: "DRAFT", limit: 2, offset: 0 }
              as: ProjectManager
              as_user_id: "${pm_id}"
            - call: "GET /time-entries"
              payload: { staff_member_id: "${arch_id}", status: "DRAFT", limit: 2, offset: 2 }
              as: ProjectManager
              as_user_id: "${pm_id}"
          assert:
            - "the first page returns 2 rows with total_count == 3 and has_more == true"
            - "the second page returns 1 row with total_count == 3 and has_more == false"
            - "GET /time-entries?staff_member_id=${arch_id}&status=APPROVED returns 0 rows with total_count == 0"

      - name: success_envelope_carries_meta_and_response_type
        claim_type: Standard CRUD
        grounds:
          - response_envelope.success
          - endpoints[GET /projects/{projectId}]
        distinguishing_aspect: "Every success response wraps its payload as { meta: { api_request_id, api_request_timestamp }, response_type: \"object\"|\"array\", data: ... }; a single-resource GET uses response_type \"object\" and a list GET uses \"array\"."
        test_recipe:
          setup: ["One project exists."]
          setup_api_calls:
            - call: "POST /staff"
              payload: { full_name: "Pat Manager", title: "PROJECT_MANAGER", billing_rate_cents_per_hour: 25000, cost_rate_cents_per_hour: 12000 }
              as: PrincipalArchitect
              as_user_id: "principal-alice"
              captures: { pm_id: $.data.id }
            - call: "POST /projects"
              payload: { project_number: "ENV-001", name: "Envelope Estate", client_rep_user_id: "client-1", project_manager_staff_id: "${pm_id}", labor_budget_cents: 500000 }
              as: PrincipalArchitect
              as_user_id: "principal-alice"
              captures: { proj: $.data.id }
          trigger:
            - call: "GET /projects/${proj}"
              as: ProjectManager
              as_user_id: "${pm_id}"
            - call: "GET /projects"
              payload: { project_manager_staff_id: "${pm_id}" }
              as: ProjectManager
              as_user_id: "${pm_id}"
          assert:
            - "the single GET has response_type == \"object\" and meta.api_request_id and meta.api_request_timestamp present"
            - "the list GET has response_type == \"array\" and returns exactly 1 row whose id == ${proj}"

      - name: clock_defaults_to_2026_05_01_before_any_set_call
        claim_type: Computed read
        grounds:
          - endpoints[POST /_clock/set_current_utc]
          - entities.RFI.fields.answered_at
        distinguishing_aspect: "With no prior clock call, the server's logical clock reads exactly 2026-05-01T00:00:00Z, so an RFI answered immediately after boot carries answered_at == 2026-05-01T00:00:00Z rather than a wall-clock instant."
        test_recipe:
          setup:
            - "A project with one OPEN RFI. The logical clock has never been set."
          setup_api_calls:
            - call: "POST /staff"
              payload: { full_name: "Pat Manager", title: "PROJECT_MANAGER", billing_rate_cents_per_hour: 25000, cost_rate_cents_per_hour: 12000 }
              as: PrincipalArchitect
              as_user_id: "principal-alice"
              captures: { pm_id: $.data.id }
            - call: "POST /projects"
              payload: { project_number: "CLK-001", name: "Clock Close", client_rep_user_id: "client-1", project_manager_staff_id: "${pm_id}", labor_budget_cents: 500000 }
              as: PrincipalArchitect
              as_user_id: "principal-alice"
              captures: { proj: $.data.id }
            - call: "POST /rfis"
              payload: { project_id: "${proj}", subject: "Confirm datum" }
              as: ProjectManager
              as_user_id: "${pm_id}"
              captures: { rfi: $.data.id }
          trigger:
            - call: "POST /rfis/${rfi}/state"
              payload: { to_status: "ANSWERED", answer_text: "Datum is 0.00 at finished floor." }
              as: ProjectManager
              as_user_id: "${pm_id}"
              captures: { ans_at: $.data.answered_at }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-09T09:09:09Z" }
              as: PrincipalArchitect
              as_user_id: "principal-alice"
              captures: { now: $.data.current_utc }
          assert:
            - "RFI.${rfi}.answered_at == 2026-05-01T00:00:00Z"
            - "RFI.${rfi}.status == ANSWERED and RFI.${rfi}.answer_text == \"Datum is 0.00 at finished floor.\""
            - "Project.${proj}.open_rfi_count == 0 and Project.${proj}.ca_posture == CLEAR"
            - "the clock endpoint returns current_utc == 2026-09-09T09:09:09Z"

      - name: rfi_close_after_answer_and_void_from_open_both_reachable
        claim_type: Action endpoint
        grounds:
          - state_machines.RFI.ANSWERED_to_CLOSED
          - state_machines.RFI.OPEN_to_VOID
          - calculations.rfi_rollup
        distinguishing_aspect: "ANSWERED -> CLOSED leaves open_rfi_count unchanged (the RFI already left the open set at ANSWERED), whereas OPEN -> VOID decrements it from 1 to 0 in one step."
        test_recipe:
          setup:
            - "A project with two OPEN RFIs (open_rfi_count == 2)."
          setup_api_calls:
            - call: "POST /staff"
              payload: { full_name: "Pat Manager", title: "PROJECT_MANAGER", billing_rate_cents_per_hour: 25000, cost_rate_cents_per_hour: 12000 }
              as: PrincipalArchitect
              as_user_id: "principal-alice"
              captures: { pm_id: $.data.id }
            - call: "POST /projects"
              payload: { project_number: "CLS-001", name: "Close Court", client_rep_user_id: "client-1", project_manager_staff_id: "${pm_id}", labor_budget_cents: 500000 }
              as: PrincipalArchitect
              as_user_id: "principal-alice"
              captures: { proj: $.data.id }
            - call: "POST /rfis"
              payload: { project_id: "${proj}", subject: "First question" }
              as: ProjectManager
              as_user_id: "${pm_id}"
              captures: { r1: $.data.id }
            - call: "POST /rfis"
              payload: { project_id: "${proj}", subject: "Second question", impacts_fee: true }
              as: ProjectManager
              as_user_id: "${pm_id}"
              captures: { r2: $.data.id }
          trigger:
            - call: "POST /rfis/${r1}/state"
              payload: { to_status: "ANSWERED", answer_text: "See sketch SK-01." }
              as: ProjectManager
              as_user_id: "${pm_id}"
            - call: "POST /rfis/${r1}/state"
              payload: { to_status: "CLOSED" }
              as: ProjectManager
              as_user_id: "${pm_id}"
            - call: "POST /rfis/${r2}/state"
              payload: { to_status: "VOID" }
              as: ProjectManager
              as_user_id: "${pm_id}"
          assert:
            - "RFI.${r1}.rfi_number == 1 and RFI.${r2}.rfi_number == 2"
            - "RFI.${r2}.impacts_fee == true"
            - "after ANSWERED: Project.${proj}.open_rfi_count == 1"
            - "after CLOSED: Project.${proj}.open_rfi_count == 1 (unchanged)"
            - "after VOID: Project.${proj}.open_rfi_count == 0 and Project.${proj}.ca_posture == CLEAR"

