# =============================================================================
# SCAFFOLD.yaml — §1.0–§1.7 seed tables
# Task: task_2944_deal_desk_pricing_approval
#
# Single source of truth for the downstream PRD, unit-test suite and reference
# implementation. §1.8 lives in SCAFFOLD_DIFFICULTY_DESIGN.yaml and §1.9 in
# SCAFFOLD_CORNER_DESIGN.yaml; neither key appears in this file.
# =============================================================================

scenario: |
  2944. Deal Desk & Pricing Approval (business-to-business software deal desk):
  quote configuration with product bundling, term length and volume tier rules,
  discount approval matrix by level with escalation thresholds and delegation of
  authority, non-standard term review across payment terms, service level
  commitments, indemnities and termination rights, revenue recognition impact
  assessment for multi-element and usage-based arrangements, competitive pricing
  exception documentation with margin floor enforcement, quote expiration,
  renegotiation and order form generation with signature routing, booking
  validation against order acceptance criteria, quarter-end volume surge
  management and approval turnaround service levels

domain_name: deal-desk-pricing-approval

# Flat topology: every business collection is a top-level path (/quotes,
# /order-forms, /approval-steps, …). There is no single owning aggregate root,
# so the prefix is empty and child discovery happens through sub-resource GETs
# and filtered lists.
api_prefix: ""

complexity_profile:
  primary_archetype: multi_party_negotiation
  secondary_archetype: pricing_engine
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers

  entity_topology: flat
  # Peer entities linked by foreign keys; no ownership nesting in write paths.

  state_machine_shape: cyclic
  # Quote cycles PENDING_APPROVAL → CHANGES_REQUESTED → DRAFT → PENDING_APPROVAL;
  # NonStandardTerm cycles PENDING → APPROVED → PENDING; ApprovalRequest carries
  # two independent state dimensions (discount_track_state × terms_track_state)
  # that fork at submit and join before the request can be APPROVED.

  relationship_patterns:
    - one_to_many          # Quote → QuoteLine / NonStandardTerm / OrderForm
    - self_referential     # Quote.renegotiated_from_quote_id -> Quote.id
    - cross_aggregate      # ApprovalStep -> DelegationGrant, QuoteLine -> Product
    - polymorphic_by_category  # NonStandardTerm.term_category selects which
                               # payload fields and risk weights apply

  role_model: delegated_authority
  # Approval authority is tiered by discount band and may be temporarily
  # delegated one level down inside an explicit time window; a segregation-of-
  # duties rule forbids any user from approving a quote they own or an exception
  # they documented.

  consistency_model: immediate

  difficulty_level: expert_plus
  # 15 entities · 54 endpoints · 45 error codes · 8 calculations (3 with
  # divergent variants) · 9 state machines · 2 OCC rules.

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:

  - name: DeskPolicy
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Human label of this policy revision" }
      - { name: status, type: enum, source: system, default: DRAFT, constraints: "DRAFT | ACTIVE | SUPERSEDED", description: "Lifecycle of the policy revision; exactly one row may be ACTIVE" }
      - { name: margin_floor_pct, type: number, source: input, description: "Soft margin floor; a quote below it needs an ACCEPTED CompetitiveException", constraints: "0 < value < 1, 4 decimal places" }
      - { name: absolute_margin_floor_pct, type: number, source: input, description: "Hard margin floor; no exception can rescue a quote below it", constraints: "0 < value < margin_floor_pct" }
      - { name: quote_validity_days, type: integer, source: input, description: "Days a quote stays valid, counted from created_at and re-based at approval", constraints: ">= 1" }
      - { name: standard_payment_terms_days, type: integer, source: input, description: "Payment terms considered standard; anything longer is a non-standard term and attracts financing uplift", constraints: ">= 1" }
      - { name: uplift_rate_per_30_days, type: number, source: input, description: "Financing uplift rate charged per whole 30-day block of extra payment terms", constraints: "0 <= value < 1" }
      - { name: max_stack_discount_pct, type: number, source: input, description: "Cap on the summed per-line discount stack (volume tier + bundle + requested)", constraints: "0 < value < 1" }
      - { name: volume_rebate_tier1_min_cents, type: integer, source: input, description: "Net-subtotal threshold (inclusive) at which the tier-1 order-level rebate applies", constraints: ">= 0" }
      - { name: volume_rebate_tier1_pct, type: number, source: input, description: "Tier-1 order-level rebate rate", constraints: "0 <= value < 1" }
      - { name: volume_rebate_tier2_min_cents, type: integer, source: input, description: "Net-subtotal threshold (inclusive) at which the tier-2 order-level rebate applies", constraints: "> volume_rebate_tier1_min_cents" }
      - { name: volume_rebate_tier2_pct, type: number, source: input, description: "Tier-2 order-level rebate rate", constraints: "> volume_rebate_tier1_pct" }
      - { name: surge_window_days, type: integer, source: input, description: "Length in days of the quarter-end surge window that ends at the first instant of the next calendar quarter", constraints: ">= 1" }
      - { name: surge_sla_multiplier, type: number, source: input, description: "Multiplier applied to an ApprovalTier.sla_hours for steps created inside the surge window", constraints: "> 0" }
      - { name: price_hold_cooldown_days, type: integer, source: input, description: "Mandatory gap in days that must separate two price-hold windows on the same (Account, Product) pair", constraints: ">= 0" }
      - { name: exception_allowance_cents, type: integer, source: input, description: "Per-account margin give-up budget that ACCEPTED CompetitiveExceptions consume", constraints: ">= 0" }
      - { name: terms_review_risk_threshold, type: number, source: input, description: "AGGREGATE_WEIGHTED risk score (inclusive) at or above which LegalCounsel review is mandatory", constraints: "0 <= value <= 100" }
      - { name: terms_cfo_risk_threshold, type: number, source: input, description: "DOMINANT_CATEGORY risk score (inclusive) at or above which a CFO co-signature on the dominant term is mandatory", constraints: "0 <= value <= 100" }
      - { name: activated_at, type: datetime, source: system, default: null, description: "Logical-clock instant the policy became ACTIVE" }
      - { name: superseded_at, type: datetime, source: system, default: null, description: "Logical-clock instant the policy was superseded by a newer activation" }

  - name: ApprovalTier
    parent: DeskPolicy
    common_fields: false
    fields:
      - { name: desk_policy_id, type: string, source: input, description: "FK -> DeskPolicy.id; the policy revision this matrix row belongs to" }
      - { name: tier_level, type: integer, source: input, description: "Approval level; 1 is the lowest authority", constraints: "1 | 2 | 3 | 4, unique per desk_policy_id" }
      - { name: min_discount_pct, type: number, source: input, description: "Inclusive lower bound of the blended-discount band this level owns", constraints: "0 <= value < 1" }
      - { name: max_discount_pct, type: number, source: input, description: "Exclusive upper bound of the blended-discount band this level owns", constraints: "min_discount_pct < value <= 1" }
      - { name: required_role, type: enum, source: input, description: "Role that owns decisions at this level", constraints: "DealDeskAnalyst | SalesDirector | VPSales | CFO" }
      - { name: sla_hours, type: integer, source: input, description: "Approval turnaround service level in hours for steps at this level, before the surge multiplier", constraints: ">= 1" }
      - { name: max_delegation_levels, type: integer, source: input, description: "0 forbids delegation of this level; 1 allows a DelegationGrant to cover it", constraints: "0 | 1" }

  - name: Product
    parent: null
    common_fields: true
    fields:
      - { name: sku, type: string, source: input, description: "Catalogue identifier", constraints: "unique across Product" }
      - { name: name, type: string, source: input, description: "Display name" }
      - { name: product_type, type: enum, source: input, description: "Commercial shape of the item", constraints: "SUBSCRIPTION_LICENSE | USAGE_METERED | PROFESSIONAL_SERVICES | SUPPORT_PLAN" }
      - { name: list_unit_price_cents, type: integer, source: input, description: "List price per unit in cents for the WHOLE contract term, quoted at the 12-month reference term; longer terms are rewarded through the C1 term multiplier, not by multiplying the term length", constraints: "> 0" }
      - { name: unit_cost_cents, type: integer, source: input, description: "Fully loaded cost per unit in cents for the WHOLE contract term, used for margin", constraints: ">= 0, < list_unit_price_cents" }
      - { name: rev_rec_category, type: enum, source: input, description: "Revenue recognition treatment of the performance obligation", constraints: "RATABLE | POINT_IN_TIME | USAGE_AS_INCURRED" }
      - { name: min_term_months, type: integer, source: input, description: "Shortest quote term this product may appear on", constraints: ">= 1" }

  - name: VolumeTier
    parent: Product
    common_fields: false
    fields:
      - { name: product_id, type: string, source: input, description: "FK -> Product.id; the product whose quantity bands this row defines" }
      - { name: tier_level, type: integer, source: input, description: "Band ordinal, ascending by min_quantity", constraints: ">= 1, unique per product_id" }
      - { name: min_quantity, type: integer, source: input, description: "Inclusive lower quantity bound of the band", constraints: ">= 1" }
      - { name: max_quantity, type: integer, source: input, default: null, description: "Inclusive upper quantity bound; null means unbounded and is allowed on at most one band per product", constraints: "null or >= min_quantity" }
      - { name: tier_discount_pct, type: number, source: input, description: "Discount contributed by this band", constraints: "0 <= value < 1" }

  - name: BundleRule
    parent: null
    common_fields: false
    fields:
      - { name: anchor_product_id, type: string, source: input, description: "FK -> Product.id; the product that must be present for the bundle discount to apply" }
      - { name: attached_product_id, type: string, source: input, description: "FK -> Product.id; the product that receives the bundle discount", constraints: "!= anchor_product_id; unique per (anchor_product_id, attached_product_id)" }
      - { name: bundle_discount_pct, type: number, source: input, description: "Discount added to the attached line's stack when the attach ratio holds", constraints: "0 < value < 1" }
      - { name: min_attach_quantity_ratio, type: number, source: input, description: "Required attached_quantity / anchor_quantity ratio, compared with >=", constraints: "> 0" }

  - name: Account
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Customer legal name" }
      - { name: segment, type: enum, source: input, description: "Commercial segment", constraints: "ENTERPRISE | MID_MARKET | SMB" }
      - { name: region, type: string, source: input, description: "Sales region code" }
      - { name: existing_arr_cents, type: integer, source: input, default: 0, description: "Annual recurring revenue already on the books before this system's bookings", constraints: ">= 0" }
      - { name: credit_status, type: enum, source: system, default: CLEAR, description: "Credit posture; HOLD blocks booking", constraints: "CLEAR | WATCH | HOLD" }
      - { name: credit_note, type: string, source: system, default: null, description: "Note recorded with the latest credit decision" }
      - { name: booked_arr_cents, type: integer, source: computed, default: 0, description: "Conserved ledger: sum of booked_arr_cents over this account's OrderForms in status BOOKED" }
      - { name: exception_allowance_used_cents, type: integer, source: computed, default: 0, description: "Conserved pool: sum of allowance_consumed_cents over this account's CompetitiveExceptions in status ACCEPTED" }

  - name: Quote
    parent: Account
    common_fields: true
    fields:
      - { name: account_id, type: string, source: input, description: "FK -> Account.id; the customer being quoted" }
      - { name: desk_policy_id, type: string, source: system, description: "FK -> DeskPolicy.id; the policy revision that was ACTIVE when the quote was created" }
      - { name: renegotiated_from_quote_id, type: string, source: system, default: null, description: "FK -> Quote.id; set on clones produced by POST /quotes/{id}/renegotiate, null on originals" }
      - { name: owner_rep_user_id, type: string, source: system, description: "X-User-ID of the SalesRep who created the quote; the segregation-of-duties subject" }
      - { name: title, type: string, source: input, description: "Deal name" }
      - { name: term_months, type: integer, source: input, description: "Subscription term in months, drives the term multiplier", constraints: "1 <= value <= 60" }
      - { name: payment_terms_days, type: integer, source: input, default: 30, description: "Requested payment terms; days beyond DeskPolicy.standard_payment_terms_days attract financing uplift", constraints: "1 <= value <= 180" }
      - { name: billing_frequency, type: enum, source: input, default: ANNUAL, description: "Invoice cadence", constraints: "ANNUAL | SEMI_ANNUAL | QUARTERLY | MONTHLY" }
      - { name: status, type: enum, source: system, default: DRAFT, constraints: "DRAFT | PENDING_APPROVAL | CHANGES_REQUESTED | APPROVED | REJECTED | EXPIRED | SUPERSEDED | BOOKED", description: "Quote lifecycle state" }
      - { name: revision_count, type: integer, source: computed, default: 0, description: "Number of completed CHANGES_REQUESTED -> DRAFT reopen cycles" }
      - { name: renegotiation_count, type: integer, source: computed, default: 0, description: "Number of clones this quote has spawned through POST /quotes/{id}/renegotiate" }
      - { name: list_total_cents, type: integer, source: computed, default: 0, description: "Sum of QuoteLine.extended_list_cents (C1)" }
      - { name: cost_total_cents, type: integer, source: computed, default: 0, description: "Sum of QuoteLine.extended_cost_cents (C1)" }
      - { name: provisional_net_total_cents, type: integer, source: computed, default: 0, description: "C2 order total under the WHOLE_QUANTITY_AVERAGE variant of C1" }
      - { name: final_net_total_cents, type: integer, source: computed, default: 0, description: "C2 order total under the MARGINAL_PROGRESSIVE variant of C1" }
      - { name: provisional_blended_discount_pct, type: number, source: computed, default: 0, description: "C3 blended discount from provisional_net_total_cents" }
      - { name: final_blended_discount_pct, type: number, source: computed, default: 0, description: "C3 blended discount from final_net_total_cents; the value the approval matrix reads" }
      - { name: provisional_margin_pct, type: number, source: computed, default: 0, description: "C4 margin from provisional_net_total_cents" }
      - { name: final_margin_pct, type: number, source: computed, default: 0, description: "C4 margin from final_net_total_cents; the value the margin floors read" }
      - { name: volume_rebate_cents, type: integer, source: computed, default: 0, description: "Order-level rebate applied inside C2 for the MARGINAL_PROGRESSIVE variant" }
      - { name: payment_terms_uplift_cents, type: integer, source: computed, default: 0, description: "Financing uplift applied inside C2 for the MARGINAL_PROGRESSIVE variant" }
      - { name: required_approval_level, type: integer, source: computed, default: 0, description: "C3 approval level from the matrix; 0 when final_blended_discount_pct is 0 and no exception exists" }
      - { name: terms_risk_score_aggregate, type: number, source: computed, default: 0, description: "C6 AGGREGATE_WEIGHTED risk score across this quote's non-withdrawn NonStandardTerms" }
      - { name: terms_risk_score_dominant, type: number, source: computed, default: 0, description: "C6 DOMINANT_CATEGORY risk score across the same input set" }
      - { name: arrangement_type, type: enum, source: computed, default: SINGLE_ELEMENT, constraints: "SINGLE_ELEMENT | MULTI_ELEMENT | USAGE_BASED_HYBRID", description: "C7 classification derived from the distinct rev_rec_categories on the lines" }
      - { name: booked_arr_cents, type: integer, source: computed, default: 0, description: "C8 recurring net annualised over the term, locked at booking; 0 until a BOOKED OrderForm exists" }
      - { name: booked_tcv_cents, type: integer, source: computed, default: 0, description: "C8 total contract value locked at booking; 0 until a BOOKED OrderForm exists" }
      - { name: submitted_at, type: datetime, source: system, default: null, description: "Logical-clock instant of the most recent DRAFT -> PENDING_APPROVAL transition" }
      - { name: approved_at, type: datetime, source: system, default: null, description: "Logical-clock instant the quote reached APPROVED" }
      - { name: expires_at, type: datetime, source: computed, description: "C5 expiry instant; created_at + quote_validity_days, re-based at approval and capped at the surge quarter end" }
      - { name: booked_at, type: datetime, source: system, default: null, description: "Logical-clock instant the quote reached BOOKED" }
      - { name: policy_revalidation_required, type: boolean, source: system, default: false, description: "Set true when the pinned DeskPolicy is superseded while the quote is PENDING_APPROVAL; blocks booking until the quote is reopened" }
      - { name: pinned_policy_version, type: integer, source: system, default: null, description: "DeskPolicy.version captured at submit; used to detect policy drift" }

  - name: QuoteLine
    parent: Quote
    common_fields: true
    fields:
      - { name: quote_id, type: string, source: input, description: "FK -> Quote.id; the quote this line belongs to" }
      - { name: product_id, type: string, source: input, description: "FK -> Product.id; the catalogue item being sold" }
      - { name: quantity, type: integer, source: input, description: "Units sold", constraints: "1 <= value <= 1000000" }
      - { name: requested_discount_pct, type: number, source: input, default: 0, description: "Rep-requested discount added on top of volume and bundle discounts", constraints: "0 <= value < 1" }
      - { name: unit_list_price_cents, type: integer, source: computed, description: "Product.list_unit_price_cents snapshotted at line write time" }
      - { name: unit_cost_cents, type: integer, source: computed, description: "Product.unit_cost_cents snapshotted at line write time" }
      - { name: extended_list_cents, type: integer, source: computed, description: "C1 quantity * unit_list_price_cents; whole-term list value before any discount and before the term multiplier" }
      - { name: extended_cost_cents, type: integer, source: computed, description: "C1 quantity * unit_cost_cents; whole-term cost" }
      - { name: provisional_net_cents, type: integer, source: computed, description: "C1 line net under the WHOLE_QUANTITY_AVERAGE variant" }
      - { name: final_net_cents, type: integer, source: computed, description: "C1 line net under the MARGINAL_PROGRESSIVE variant" }
      - { name: volume_tier_level_applied, type: integer, source: computed, default: 0, description: "VolumeTier.tier_level whose band contains quantity; 0 when the product has no bands" }
      - { name: bundle_discount_applied_pct, type: number, source: computed, default: 0, description: "BundleRule.bundle_discount_pct when the anchor line is present and the attach ratio holds, else 0" }
      - { name: effective_stack_discount_pct, type: number, source: computed, description: "C1 min(tier + bundle + requested, DeskPolicy.max_stack_discount_pct) for the WHOLE_QUANTITY_AVERAGE variant" }
      - { name: rev_rec_category, type: enum, source: computed, constraints: "RATABLE | POINT_IN_TIME | USAGE_AS_INCURRED", description: "Product.rev_rec_category snapshotted at line write time" }

  - name: NonStandardTerm
    parent: Quote
    common_fields: true
    fields:
      - { name: quote_id, type: string, source: input, description: "FK -> Quote.id; the quote carrying this deviation" }
      - { name: term_category, type: enum, source: input, constraints: "PAYMENT_TERMS | SLA_COMMITMENT | INDEMNITY_CAP | TERMINATION_FOR_CONVENIENCE | PRICE_HOLD_RENEWAL", description: "Which standard term is being deviated from; selects the C6 weight and the meaning of requested_numeric_value" }
      - { name: requested_numeric_value, type: number, source: input, description: "PAYMENT_TERMS: days. SLA_COMMITMENT: uptime percent. INDEMNITY_CAP: multiple of annual contract value. TERMINATION_FOR_CONVENIENCE: notice months. PRICE_HOLD_RENEWAL: renewal uplift cap percent", constraints: ">= 0" }
      - { name: requested_text, type: string, source: input, default: null, description: "Free-text rider language proposed by the customer" }
      - { name: hold_product_id, type: string, source: input, default: null, description: "FK -> Product.id; required when term_category is PRICE_HOLD_RENEWAL, null otherwise" }
      - { name: hold_start_date, type: date, source: input, default: null, description: "Inclusive first day of the price-hold window; required when term_category is PRICE_HOLD_RENEWAL" }
      - { name: hold_end_date, type: date, source: input, default: null, description: "Inclusive last day of the price-hold window; required when term_category is PRICE_HOLD_RENEWAL", constraints: ">= hold_start_date" }
      - { name: severity_factor, type: number, source: computed, description: "C6 per-category severity in [0, 1] derived from requested_numeric_value" }
      - { name: risk_contribution, type: number, source: computed, description: "C6 category_weight * severity_factor, 2 decimal places" }
      - { name: review_state, type: enum, source: system, default: PENDING, constraints: "PENDING | APPROVED | REJECTED | WITHDRAWN", description: "Legal review outcome for this single term" }
      - { name: reviewed_by_user_id, type: string, source: system, default: null, description: "X-User-ID of the LegalCounsel who decided the term" }
      - { name: reviewed_at, type: datetime, source: system, default: null, description: "Logical-clock instant of the legal decision" }
      - { name: reviewer_note, type: string, source: system, default: null, description: "Note supplied with the legal decision" }
      - { name: requires_cfo_cosign, type: boolean, source: computed, default: false, description: "True on the single dominant-category term when C6 DOMINANT_CATEGORY score >= DeskPolicy.terms_cfo_risk_threshold" }
      - { name: cfo_cosigned_at, type: datetime, source: system, default: null, description: "Logical-clock instant of the CFO co-signature" }
      - { name: cfo_cosigned_by_user_id, type: string, source: system, default: null, description: "X-User-ID of the co-signing CFO" }

  - name: CompetitiveException
    parent: Quote
    common_fields: true
    fields:
      - { name: quote_id, type: string, source: input, description: "FK -> Quote.id; the quote whose margin floor is being excepted" }
      - { name: competitor_name, type: string, source: input, description: "Competitor whose pricing justifies the exception" }
      - { name: competitor_quoted_total_cents, type: integer, source: input, description: "Competitor's quoted total in cents, used as documentation only", constraints: "> 0" }
      - { name: evidence_reference, type: string, source: input, description: "Reference to the filed evidence artefact" }
      - { name: justification, type: string, source: input, description: "Narrative justification recorded for audit" }
      - { name: documented_by_user_id, type: string, source: system, description: "X-User-ID of the SalesRep who filed the exception; may not also decide it" }
      - { name: status, type: enum, source: system, default: SUBMITTED, constraints: "SUBMITTED | ACCEPTED | REJECTED | REVOKED | RELEASED", description: "REVOKED is a manual CFO withdrawal; RELEASED is the automatic release when the quote is rejected or expires" }
      - { name: allowance_consumed_cents, type: integer, source: computed, default: 0, description: "C4 margin give-up in cents charged against Account.exception_allowance_used_cents at acceptance" }
      - { name: decided_by_user_id, type: string, source: system, default: null, description: "X-User-ID of the decider" }
      - { name: decided_at, type: datetime, source: system, default: null, description: "Logical-clock instant of the decision" }
      - { name: decision_note, type: string, source: system, default: null, description: "Note supplied with the decision, revocation or release" }
      - { name: released_at, type: datetime, source: system, default: null, description: "Logical-clock instant the consumed allowance was returned to the account pool" }

  - name: RevRecAssessment
    parent: Quote
    common_fields: true
    fields:
      - { name: quote_id, type: string, source: input, description: "FK -> Quote.id; the quote whose revenue treatment is assessed" }
      - { name: arrangement_type, type: enum, source: computed, constraints: "SINGLE_ELEMENT | MULTI_ELEMENT | USAGE_BASED_HYBRID", description: "C7 classification snapshotted when the assessment row is created" }
      - { name: status, type: enum, source: system, default: ASSESSED, constraints: "ASSESSED | CLEARED | BLOCKED | STALE", description: "STALE means the quote changed after the snapshot and the assessment must be redone" }
      - { name: allocable_amount_cents, type: integer, source: computed, description: "C7 final_net_total_cents minus usage_excluded_cents" }
      - { name: usage_excluded_cents, type: integer, source: computed, default: 0, description: "C7 sum of final_net_cents over lines whose rev_rec_category is USAGE_AS_INCURRED" }
      - { name: allocation_residual_cents, type: integer, source: computed, default: 0, description: "C7 rounding remainder pushed into the last allocable line" }
      - { name: allocation_lines, type: array, source: computed, description: "C7 waterfall result: ordered array of { quote_line_id, ssp_cents, allocated_cents } objects, one per line" }
      - { name: snapshot_quote_version, type: integer, source: computed, description: "Quote.version at the moment the assessment was created or re-assessed" }
      - { name: assessed_by_user_id, type: string, source: system, default: null, description: "X-User-ID of the RevenueAccountant who cleared or blocked" }
      - { name: assessed_at, type: datetime, source: system, default: null, description: "Logical-clock instant of the clear/block decision" }
      - { name: assessment_note, type: string, source: system, default: null, description: "Note supplied with the clear/block decision" }

  - name: ApprovalRequest
    parent: Quote
    common_fields: true
    fields:
      - { name: quote_id, type: string, source: input, description: "FK -> Quote.id; the quote under approval" }
      - { name: required_level, type: integer, source: computed, description: "Quote.required_approval_level snapshotted at submit; the discount track must reach this level" }
      - { name: current_level, type: integer, source: computed, default: 0, description: "Level of the newest ApprovalStep on this request; 0 when the discount track is NOT_REQUIRED" }
      - { name: discount_track_state, type: enum, source: system, default: PENDING, constraints: "NOT_REQUIRED | PENDING | CLEARED | BLOCKED", description: "First parallel dimension: progress of the discount approval chain" }
      - { name: terms_track_state, type: enum, source: system, default: NOT_REQUIRED, constraints: "NOT_REQUIRED | PENDING_LEGAL | CLEARED | BLOCKED", description: "Second parallel dimension: progress of the non-standard-term legal review" }
      - { name: status, type: enum, source: system, default: OPEN, constraints: "OPEN | APPROVED | REJECTED | CHANGES_REQUESTED | CANCELLED | EXPIRED", description: "Joined outcome of both dimensions" }
      - { name: escalation_count, type: integer, source: computed, default: 0, description: "Number of service-level breaches that escalated this request" }
      - { name: at_backstop, type: boolean, source: system, default: false, description: "True once escalation has reached the CFO backstop and no further escalation is possible" }
      - { name: sla_state, type: enum, source: computed, default: ON_TRACK, constraints: "ON_TRACK | BREACHED | MET", description: "ON_TRACK while open and unbreached, BREACHED once any step breached, MET when decided with no breach" }
      - { name: requires_cfo_cosign, type: boolean, source: computed, default: false, description: "Snapshot of whether the terms track needs a CFO co-signature to clear" }
      - { name: submitted_at, type: datetime, source: system, description: "Logical-clock instant the request was opened" }
      - { name: decided_at, type: datetime, source: system, default: null, description: "Logical-clock instant the request reached a terminal status" }
      - { name: total_turnaround_hours, type: number, source: computed, default: null, description: "C5 hours between submitted_at and decided_at, 2 decimal places" }

  - name: ApprovalStep
    parent: ApprovalRequest
    common_fields: true
    fields:
      - { name: approval_request_id, type: string, source: input, description: "FK -> ApprovalRequest.id; the request this step belongs to" }
      - { name: delegation_grant_id, type: string, source: system, default: null, description: "FK -> DelegationGrant.id; set when the acting user decided under a delegation instead of their own role" }
      - { name: level, type: integer, source: computed, description: "ApprovalTier.tier_level this step represents" }
      - { name: assigned_role, type: enum, source: computed, constraints: "DealDeskAnalyst | SalesDirector | VPSales | CFO", description: "ApprovalTier.required_role for this level" }
      - { name: acting_user_id, type: string, source: system, default: null, description: "X-User-ID that decided the step" }
      - { name: decision, type: enum, source: system, default: PENDING, constraints: "PENDING | APPROVED | REJECTED | CHANGES_REQUESTED | ESCALATED | VOIDED", description: "ESCALATED is written by the service-level sweep, VOIDED by request cancellation or expiry" }
      - { name: sla_hours_effective, type: number, source: computed, description: "C5 ApprovalTier.sla_hours multiplied by DeskPolicy.surge_sla_multiplier when in_surge_window is true, 2 decimal places" }
      - { name: sla_due_at, type: datetime, source: computed, description: "C5 step created_at plus sla_hours_effective" }
      - { name: in_surge_window, type: boolean, source: computed, description: "True when the step's created_at falls inside the quarter-end surge window" }
      - { name: decided_at, type: datetime, source: system, default: null, description: "Logical-clock instant of the decision" }
      - { name: turnaround_hours, type: number, source: computed, default: null, description: "C5 hours between the step's created_at and decided_at, 2 decimal places" }
      - { name: decision_note, type: string, source: system, default: null, description: "Note supplied with the decision" }
      - { name: escalated_from_step_level, type: integer, source: computed, default: null, description: "Level of the breached step that spawned this one; null for steps created by normal progression" }

  - name: DelegationGrant
    parent: null
    common_fields: true
    fields:
      - { name: grantor_user_id, type: string, source: system, description: "X-User-ID of the authority holder issuing the delegation" }
      - { name: grantee_user_id, type: string, source: input, description: "X-User-ID that may act on the grantor's behalf", constraints: "!= grantor_user_id" }
      - { name: tier_level, type: integer, source: input, description: "ApprovalTier.tier_level being delegated", constraints: "1 | 2 | 3 | 4" }
      - { name: max_discount_pct, type: number, source: input, description: "Ceiling on Quote.final_blended_discount_pct the grantee may approve under this grant", constraints: "0 < value <= 1" }
      - { name: starts_at, type: datetime, source: input, description: "Inclusive start of the delegation window" }
      - { name: ends_at, type: datetime, source: input, description: "Exclusive end of the delegation window", constraints: "> starts_at" }
      - { name: status, type: enum, source: system, default: ACTIVE, constraints: "ACTIVE | REVOKED | EXPIRED", description: "EXPIRED is written by the expiry sweep once the logical clock reaches ends_at" }
      - { name: used_step_count, type: integer, source: computed, default: 0, description: "Number of ApprovalSteps decided under this grant" }
      - { name: revoked_at, type: datetime, source: system, default: null, description: "Logical-clock instant the grantor revoked the delegation" }

  - name: OrderForm
    parent: Quote
    common_fields: true
    fields:
      - { name: quote_id, type: string, source: input, description: "FK -> Quote.id; the approved quote being papered" }
      - { name: signer_name, type: string, source: input, description: "Customer signatory name" }
      - { name: signer_email, type: string, source: input, description: "Customer signatory email; signature routing target" }
      - { name: generated_from_quote_version, type: integer, source: computed, description: "the Quote.version this form was generated at, recorded AFTER the generation call's own version bump (so a freshly generated form always satisfies generated_from_quote_version == Quote.version); booking is refused when the quote has since advanced past it" }
      - { name: status, type: enum, source: system, default: GENERATED, constraints: "GENERATED | OUT_FOR_SIGNATURE | SIGNED | DECLINED | BOOKED | VOID", description: "Order form and signature lifecycle" }
      - { name: sent_at, type: datetime, source: system, default: null, description: "Logical-clock instant the form was routed for signature" }
      - { name: signed_at, type: datetime, source: system, default: null, description: "Logical-clock instant the customer signed" }
      - { name: declined_at, type: datetime, source: system, default: null, description: "Logical-clock instant the customer declined" }
      - { name: booked_at, type: datetime, source: system, default: null, description: "Logical-clock instant the booking was accepted" }
      - { name: voided_at, type: datetime, source: system, default: null, description: "Logical-clock instant the form was voided by supersede, quote expiry or booking reversal" }
      - { name: signed_by_name, type: string, source: system, default: null, description: "Name recorded on the signature event" }
      - { name: void_reason, type: string, source: system, default: null, description: "Why the form was voided" }
      - { name: reversal_reason, type: string, source: system, default: null, description: "Reason recorded on a booking reversal" }
      - { name: booked_arr_cents, type: integer, source: computed, default: 0, description: "C8 annual recurring revenue this booking contributed to Account.booked_arr_cents" }
      - { name: booked_tcv_cents, type: integer, source: computed, default: 0, description: "C8 total contract value of the booking" }
      - { name: booking_reversed_at, type: datetime, source: system, default: null, description: "Logical-clock instant the booking was reversed" }
      - { name: booking_reversal_count, type: integer, source: computed, default: 0, description: "Number of times this form's booking has been reversed" }

# common_fields (present on every entity with common_fields: true):
#   id (string, uuid), created_at (datetime), updated_at (datetime), version (integer, starts at 1)

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:

  - entity: DeskPolicy
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /desk-policies/{id}/activate"
        actor: PlatformAdmin
        preconditions:
          - "policy.status == DRAFT"
          - "the policy's ApprovalTier rows, sorted by tier_level ASC, cover [0.0, 1.0] with no gap and no overlap: tier_level 1 starts at min_discount_pct == 0.0, each subsequent tier's min_discount_pct equals the previous tier's max_discount_pct, and the last tier's max_discount_pct == 1.0; else ERR_APPROVAL_TIER_COVERAGE_INVALID"
        side_effects:
          - "sets activated_at = logical clock"
          - "cascade down: the DeskPolicy whose status == ACTIVE (at most one exists) transitions ACTIVE -> SUPERSEDED"
          - "conditional cascade: for every Quote whose desk_policy_id == the superseded policy id AND whose status == PENDING_APPROVAL, sets policy_revalidation_required = true and increments Quote.version by 1; Quotes in any other status are untouched"
      - from: ACTIVE
        to: SUPERSEDED
        trigger: "system event: another DeskPolicy is activated via POST /desk-policies/{id}/activate"
        actor: system
        preconditions:
          - "policy.status == ACTIVE"
        side_effects:
          - "sets superseded_at = logical clock"
          - "quotes that pinned this policy keep their pinned_policy_version; new quotes may no longer reference it"

  - entity: Quote
    initial_state: DRAFT
    terminal_states: [REJECTED, EXPIRED, SUPERSEDED]
    note: |
      Cyclic: PENDING_APPROVAL -> CHANGES_REQUESTED -> DRAFT -> PENDING_APPROVAL may
      repeat, incrementing revision_count each time. BOOKED is not terminal because
      POST /order-forms/{id}/reverse-booking returns the quote to APPROVED.
    transitions:
      - from: DRAFT
        to: PENDING_APPROVAL
        trigger: "POST /quotes/{id}/submit"
        actor: SalesRep
        preconditions:
          - "quote.status == DRAFT"
          - "X-User-ID == quote.owner_rep_user_id; else ERR_NOT_QUOTE_OWNER"
          - "count of QuoteLine with quote_id == quote.id is >= 1; else ERR_QUOTE_HAS_NO_LINES"
          - "the pinned DeskPolicy has status == ACTIVE; else ERR_DESK_POLICY_SUPERSEDED"
          - "logical clock <= quote.expires_at; else ERR_QUOTE_EXPIRED"
          - "quote.term_months >= max(Product.min_term_months) over the products of this quote's lines; else ERR_TERM_BELOW_PRODUCT_MINIMUM"
          - "if quote.payment_terms_days > DeskPolicy.standard_payment_terms_days then a NonStandardTerm with term_category == PAYMENT_TERMS, requested_numeric_value == quote.payment_terms_days and review_state IN {PENDING, APPROVED} exists on this quote; else ERR_NONSTANDARD_TERM_REQUIRED"
          - "quote.arrangement_type == SINGLE_ELEMENT OR a RevRecAssessment with quote_id == quote.id and status == CLEARED exists; else ERR_REVREC_NOT_CLEARED"
          - "quote.final_margin_pct >= DeskPolicy.absolute_margin_floor_pct; else ERR_ABSOLUTE_MARGIN_FLOOR_BREACH"
          - "quote.final_margin_pct >= DeskPolicy.margin_floor_pct OR a CompetitiveException with quote_id == quote.id and status == ACCEPTED exists; else ERR_MARGIN_FLOOR_BREACH"
        side_effects:
          - "recomputes C1, C2, C3, C4, C6, C7 and writes list_total_cents, cost_total_cents, provisional_net_total_cents, final_net_total_cents, provisional_blended_discount_pct, final_blended_discount_pct, provisional_margin_pct, final_margin_pct, volume_rebate_cents, payment_terms_uplift_cents, required_approval_level, terms_risk_score_aggregate, terms_risk_score_dominant, arrangement_type"
          - "sets submitted_at = logical clock and pinned_policy_version = DeskPolicy.version"
          - "cascade down: creates one ApprovalRequest with status OPEN, submitted_at = logical clock, required_level = quote.required_approval_level, requires_cfo_cosign = (terms_risk_score_dominant >= DeskPolicy.terms_cfo_risk_threshold)"
          - "sets ApprovalRequest.discount_track_state = NOT_REQUIRED when required_level == 0, else PENDING"
          - "sets ApprovalRequest.terms_track_state = NOT_REQUIRED when the quote has no NonStandardTerm with review_state == PENDING, else PENDING_LEGAL when terms_risk_score_aggregate >= DeskPolicy.terms_review_risk_threshold, else NOT_REQUIRED"
          - "conditional cascade: when terms_risk_score_aggregate < DeskPolicy.terms_review_risk_threshold, every NonStandardTerm on this quote with review_state == PENDING transitions PENDING -> APPROVED with reviewed_by_user_id = null (auto-approved by policy)"
          - "conditional cascade: when discount_track_state == PENDING, creates one ApprovalStep at level 1 with decision PENDING, assigned_role = ApprovalTier(tier_level=1).required_role, and C5 fields in_surge_window, sla_hours_effective, sla_due_at; sets ApprovalRequest.current_level = 1"
          - "bubble up: when discount_track_state IN {NOT_REQUIRED, CLEARED} AND terms_track_state IN {NOT_REQUIRED, CLEARED}, the ApprovalRequest transitions OPEN -> APPROVED in the same request, which transitions this Quote PENDING_APPROVAL -> APPROVED"
      - from: PENDING_APPROVAL
        to: APPROVED
        trigger: "system event: the quote's ApprovalRequest transitions OPEN -> APPROVED"
        actor: system
        preconditions:
          - "quote.status == PENDING_APPROVAL"
          - "ApprovalRequest.discount_track_state IN {NOT_REQUIRED, CLEARED} AND ApprovalRequest.terms_track_state IN {NOT_REQUIRED, CLEARED}"
        side_effects:
          - "sets approved_at = logical clock"
          - "recomputes C5 expires_at from approved_at, capped at the quarter-end instant when approved_at falls inside the surge window"
          - "the quote's QuoteLine rows become immutable: POST /quote-lines, PATCH /quote-lines/{id} and DELETE /quote-lines/{id} return ERR_QUOTE_NOT_DRAFT while status != DRAFT"
      - from: PENDING_APPROVAL
        to: CHANGES_REQUESTED
        trigger: "system event: the quote's ApprovalRequest transitions OPEN -> CHANGES_REQUESTED"
        actor: system
        preconditions:
          - "quote.status == PENDING_APPROVAL"
        side_effects:
          - "no monetary field changes; the quote is not yet editable until POST /quotes/{id}/reopen runs"
      - from: PENDING_APPROVAL
        to: REJECTED
        trigger: "system event: the quote's ApprovalRequest transitions OPEN -> REJECTED"
        actor: system
        preconditions:
          - "quote.status == PENDING_APPROVAL"
        side_effects:
          - "cascade down: every NonStandardTerm on this quote with review_state == PENDING transitions PENDING -> WITHDRAWN"
          - "compensation: every CompetitiveException on this quote with status == ACCEPTED transitions ACCEPTED -> RELEASED, sets released_at = logical clock, and decrements Account.exception_allowance_used_cents by that exception's allowance_consumed_cents"
      - from: CHANGES_REQUESTED
        to: DRAFT
        trigger: "POST /quotes/{id}/reopen"
        actor: SalesRep
        preconditions:
          - "quote.status == CHANGES_REQUESTED"
          - "X-User-ID == quote.owner_rep_user_id; else ERR_NOT_QUOTE_OWNER"
          - "logical clock <= quote.expires_at; else ERR_QUOTE_EXPIRED"
        side_effects:
          - "increments revision_count by 1 and clears submitted_at, approved_at, policy_revalidation_required"
          - "cascade down (level 1): the quote's ApprovalRequest transitions CHANGES_REQUESTED -> CANCELLED"
          - "cascade down (level 2): every ApprovalStep on that request with decision == PENDING transitions PENDING -> VOIDED"
          - "cascade down (level 3): every NonStandardTerm on this quote with review_state == APPROVED transitions APPROVED -> PENDING and clears reviewed_by_user_id, reviewed_at, cfo_cosigned_at, cfo_cosigned_by_user_id"
          - "cascade down (level 4): every RevRecAssessment on this quote with status IN {ASSESSED, CLEARED, BLOCKED} transitions to STALE"
      - from: PENDING_APPROVAL
        to: EXPIRED
        trigger: "POST /expiry-sweeps"
        actor: PlatformAdmin
        preconditions:
          - "logical clock > quote.expires_at"
        side_effects:
          - "cascade down: the quote's ApprovalRequest transitions OPEN -> EXPIRED and every ApprovalStep with decision == PENDING transitions PENDING -> VOIDED"
          - "cascade down: every NonStandardTerm with review_state == PENDING transitions PENDING -> WITHDRAWN"
          - "compensation: every CompetitiveException with status == ACCEPTED transitions ACCEPTED -> RELEASED and decrements Account.exception_allowance_used_cents by its allowance_consumed_cents"
      - from: DRAFT
        to: EXPIRED
        trigger: "POST /expiry-sweeps"
        actor: PlatformAdmin
        preconditions:
          - "logical clock > quote.expires_at"
        side_effects:
          - "cascade down: every NonStandardTerm with review_state == PENDING transitions PENDING -> WITHDRAWN"
          - "compensation: every CompetitiveException with status == ACCEPTED transitions ACCEPTED -> RELEASED and decrements Account.exception_allowance_used_cents by its allowance_consumed_cents"
      - from: APPROVED
        to: EXPIRED
        trigger: "POST /expiry-sweeps"
        actor: PlatformAdmin
        preconditions:
          - "logical clock > quote.expires_at"
          - "no OrderForm on this quote has status == BOOKED"
        side_effects:
          - "cascade down: every OrderForm on this quote with status IN {GENERATED, OUT_FOR_SIGNATURE} transitions to VOID with void_reason = 'QUOTE_EXPIRED' and voided_at = logical clock"
          - "compensation: every CompetitiveException with status == ACCEPTED transitions ACCEPTED -> RELEASED and decrements Account.exception_allowance_used_cents by its allowance_consumed_cents"
      - from: DRAFT
        to: SUPERSEDED
        trigger: "system event: POST /quotes/{id}/renegotiate creates a newer clone of the same source quote"
        actor: system
        preconditions:
          - "quote.status == DRAFT"
          - "quote.renegotiated_from_quote_id is not null"
        side_effects:
          - "the older DRAFT clone stops being editable; its lines are retained for audit"
      - from: APPROVED
        to: BOOKED
        trigger: "system event: POST /order-forms/{id}/book succeeds"
        actor: system
        preconditions:
          - "quote.status == APPROVED"
        side_effects:
          - "sets booked_at = logical clock, booked_arr_cents and booked_tcv_cents from C8"
      - from: BOOKED
        to: APPROVED
        trigger: "system event: POST /order-forms/{id}/reverse-booking succeeds"
        actor: system
        preconditions:
          - "quote.status == BOOKED"
        side_effects:
          - "clears booked_at and resets booked_arr_cents and booked_tcv_cents to 0"

  - entity: ApprovalRequest
    initial_state: OPEN
    terminal_states: [APPROVED, REJECTED, CANCELLED, EXPIRED]
    note: |
      Parallel dimensions. Besides `status`, the request carries two independent
      state axes that fork at submit and join before OPEN -> APPROVED can fire:
      `discount_track_state` (NOT_REQUIRED | PENDING | CLEARED | BLOCKED) and
      `terms_track_state` (NOT_REQUIRED | PENDING_LEGAL | CLEARED | BLOCKED).
      Transitions on those axes are listed below with from/to names prefixed
      DISCOUNT_ and TERMS_ respectively; they mutate only their own axis field.
    transitions:
      - from: DISCOUNT_PENDING
        to: DISCOUNT_CLEARED
        trigger: "system event: POST /approval-steps/{id}/decide with decision APPROVE on a step whose level == required_level"
        actor: system
        preconditions:
          - "request.discount_track_state == PENDING"
          - "the decided step's level == request.required_level"
        side_effects:
          - "sets discount_track_state = CLEARED"
          - "bubble up: evaluates the join condition for OPEN -> APPROVED"
      - from: DISCOUNT_PENDING
        to: DISCOUNT_BLOCKED
        trigger: "system event: POST /approval-steps/{id}/decide with decision REJECT"
        actor: system
        preconditions:
          - "request.discount_track_state == PENDING"
        side_effects:
          - "sets discount_track_state = BLOCKED"
          - "bubble up: forces OPEN -> REJECTED regardless of terms_track_state"
      - from: TERMS_PENDING_LEGAL
        to: TERMS_CLEARED
        trigger: "system event: POST /nonstandard-terms/{id}/review with decision APPROVE clears the last outstanding term"
        actor: system
        preconditions:
          - "request.terms_track_state == PENDING_LEGAL"
          - "no NonStandardTerm on the quote has review_state == PENDING"
          - "request.requires_cfo_cosign == false OR the NonStandardTerm with requires_cfo_cosign == true has cfo_cosigned_at != null"
        side_effects:
          - "sets terms_track_state = CLEARED"
          - "bubble up: evaluates the join condition for OPEN -> APPROVED"
      - from: TERMS_PENDING_LEGAL
        to: TERMS_BLOCKED
        trigger: "system event: POST /nonstandard-terms/{id}/review with decision REJECT"
        actor: system
        preconditions:
          - "request.terms_track_state == PENDING_LEGAL"
        side_effects:
          - "sets terms_track_state = BLOCKED"
          - "bubble up: forces OPEN -> REJECTED regardless of discount_track_state"
      - from: OPEN
        to: APPROVED
        trigger: "system event: join condition satisfied after a step decision or a term review"
        actor: system
        preconditions:
          - "request.status == OPEN"
          - "request.discount_track_state IN {NOT_REQUIRED, CLEARED}"
          - "request.terms_track_state IN {NOT_REQUIRED, CLEARED}"
        side_effects:
          - "sets decided_at = logical clock and total_turnaround_hours per C5"
          - "sets sla_state = MET when escalation_count == 0, else BREACHED"
          - "bubble up: the parent Quote transitions PENDING_APPROVAL -> APPROVED"
      - from: OPEN
        to: REJECTED
        trigger: "system event: either axis reaches BLOCKED"
        actor: system
        preconditions:
          - "request.status == OPEN"
          - "request.discount_track_state == BLOCKED OR request.terms_track_state == BLOCKED"
        side_effects:
          - "sets decided_at = logical clock and total_turnaround_hours per C5"
          - "sets sla_state = BREACHED when escalation_count > 0, else MET"
          - "bubble up: the parent Quote transitions PENDING_APPROVAL -> REJECTED"
      - from: OPEN
        to: CHANGES_REQUESTED
        trigger: "system event: POST /approval-steps/{id}/decide with decision REQUEST_CHANGES"
        actor: system
        preconditions:
          - "request.status == OPEN"
        side_effects:
          - "leaves discount_track_state == PENDING and terms_track_state unchanged"
          - "bubble up: the parent Quote transitions PENDING_APPROVAL -> CHANGES_REQUESTED"
      - from: CHANGES_REQUESTED
        to: CANCELLED
        trigger: "system event: POST /quotes/{id}/reopen"
        actor: system
        preconditions:
          - "request.status == CHANGES_REQUESTED"
        side_effects:
          - "sets decided_at = logical clock"
          - "cascade down: every ApprovalStep with decision == PENDING transitions PENDING -> VOIDED"
      - from: OPEN
        to: EXPIRED
        trigger: "system event: POST /expiry-sweeps expires the parent Quote"
        actor: system
        preconditions:
          - "request.status == OPEN"
        side_effects:
          - "sets decided_at = logical clock and sla_state = BREACHED when escalation_count > 0, else ON_TRACK is retained"
          - "cascade down: every ApprovalStep with decision == PENDING transitions PENDING -> VOIDED"

  - entity: ApprovalStep
    initial_state: PENDING
    terminal_states: [APPROVED, REJECTED, CHANGES_REQUESTED, ESCALATED, VOIDED]
    note: "`decision` is the state field; the step row itself is created by the submit cascade or by a prior step's progression/escalation."
    transitions:
      - from: PENDING
        to: APPROVED
        trigger: "POST /approval-steps/{id}/decide with decision APPROVE"
        actor: DealDeskAnalyst | SalesDirector | VPSales | CFO
        preconditions:
          - "step.decision == PENDING; else ERR_STEP_ALREADY_DECIDED"
          - "parent Quote.status == PENDING_APPROVAL; else ERR_QUOTE_NOT_PENDING_APPROVAL"
          - "logical clock <= Quote.expires_at; else ERR_QUOTE_EXPIRED"
          - "X-User-ID != Quote.owner_rep_user_id; else ERR_SEGREGATION_OF_DUTIES"
          - "X-User-Role == step.assigned_role, OR a DelegationGrant with grantee_user_id == X-User-ID, tier_level == step.level and status == ACTIVE exists; else ERR_APPROVER_ROLE_MISMATCH"
          - "when acting under a DelegationGrant: ApprovalTier(tier_level=step.level).max_delegation_levels == 1 (else ERR_DELEGATION_LEVEL_NOT_DELEGABLE); starts_at <= logical clock < ends_at (else ERR_DELEGATION_NOT_ACTIVE); Quote.final_blended_discount_pct <= grant.max_discount_pct (else ERR_DELEGATION_SCOPE_EXCEEDED)"
        side_effects:
          - "sets acting_user_id = X-User-ID, decided_at = logical clock, turnaround_hours per C5, decision_note"
          - "sets delegation_grant_id and increments DelegationGrant.used_step_count by 1 when the decision was made under a delegation"
          - "conditional cascade: when step.level < ApprovalRequest.required_level, creates the next ApprovalStep at level = step.level + 1 with assigned_role = ApprovalTier(tier_level=step.level+1).required_role and C5 service-level fields, and sets ApprovalRequest.current_level = step.level + 1"
          - "conditional cascade: when step.level == ApprovalRequest.required_level, the request transitions DISCOUNT_PENDING -> DISCOUNT_CLEARED"
      - from: PENDING
        to: REJECTED
        trigger: "POST /approval-steps/{id}/decide with decision REJECT"
        actor: DealDeskAnalyst | SalesDirector | VPSales | CFO
        preconditions:
          - "identical to the APPROVE transition's preconditions"
        side_effects:
          - "sets acting_user_id, decided_at, turnaround_hours, decision_note"
          - "cascade up: the request transitions DISCOUNT_PENDING -> DISCOUNT_BLOCKED, then OPEN -> REJECTED, then the Quote transitions PENDING_APPROVAL -> REJECTED with its own cascades"
      - from: PENDING
        to: CHANGES_REQUESTED
        trigger: "POST /approval-steps/{id}/decide with decision REQUEST_CHANGES"
        actor: DealDeskAnalyst | SalesDirector | VPSales | CFO
        preconditions:
          - "identical to the APPROVE transition's preconditions"
        side_effects:
          - "sets acting_user_id, decided_at, turnaround_hours, decision_note"
          - "cascade up: the request transitions OPEN -> CHANGES_REQUESTED and the Quote transitions PENDING_APPROVAL -> CHANGES_REQUESTED"
      - from: PENDING
        to: ESCALATED
        trigger: "POST /sla-escalation-sweeps"
        actor: PlatformAdmin
        preconditions:
          - "step.decision == PENDING"
          - "logical clock > step.sla_due_at (strict; equality is not a breach)"
          - "parent Quote.status == PENDING_APPROVAL"
        side_effects:
          - "increments ApprovalRequest.escalation_count by 1 and sets ApprovalRequest.sla_state = BREACHED"
          - "creates a replacement ApprovalStep with escalated_from_step_level = step.level, level = min(step.level + 2, 4) when step.in_surge_window == true, else level = min(step.level + 1, 4), assigned_role = ApprovalTier(tier_level = new level).required_role, and fresh C5 service-level fields computed from the sweep instant"
          - "sets ApprovalRequest.current_level = the replacement step's level, and ApprovalRequest.required_level = max(required_level, replacement level)"
          - "sets ApprovalRequest.at_backstop = true when the replacement step's level == 4"
      - from: PENDING
        to: VOIDED
        trigger: "system event: the parent ApprovalRequest transitions to CANCELLED or EXPIRED"
        actor: system
        preconditions:
          - "step.decision == PENDING"
        side_effects:
          - "sets decided_at = logical clock; turnaround_hours stays null"

  - entity: NonStandardTerm
    initial_state: PENDING
    terminal_states: [REJECTED, WITHDRAWN]
    note: "Cyclic: APPROVED -> PENDING fires when the quote is reopened, so a term can be reviewed more than once."
    transitions:
      - from: PENDING
        to: APPROVED
        trigger: "POST /nonstandard-terms/{id}/review with decision APPROVE"
        actor: LegalCounsel
        preconditions:
          - "term.review_state == PENDING; else ERR_TERM_ALREADY_REVIEWED"
          - "parent Quote.status == PENDING_APPROVAL; else ERR_QUOTE_NOT_PENDING_APPROVAL"
          - "the quote's ApprovalRequest.terms_track_state == PENDING_LEGAL; else ERR_LEGAL_REVIEW_NOT_REQUIRED"
        side_effects:
          - "sets review_state = APPROVED, reviewed_by_user_id = X-User-ID, reviewed_at = logical clock, reviewer_note"
          - "conditional cascade: when no PENDING term remains and requires_cfo_cosign is satisfied, the request transitions TERMS_PENDING_LEGAL -> TERMS_CLEARED and may bubble up to OPEN -> APPROVED"
      - from: PENDING
        to: APPROVED
        trigger: "system event: POST /quotes/{id}/submit with terms_risk_score_aggregate < DeskPolicy.terms_review_risk_threshold"
        actor: system
        preconditions:
          - "term.review_state == PENDING"
          - "Quote.terms_risk_score_aggregate < DeskPolicy.terms_review_risk_threshold"
        side_effects:
          - "sets review_state = APPROVED, reviewed_at = logical clock, reviewed_by_user_id = null, reviewer_note = 'AUTO_APPROVED_BELOW_RISK_THRESHOLD'"
        note: "Auto-approval path; no LegalCounsel call is made and terms_track_state is set to NOT_REQUIRED."
      - from: PENDING
        to: REJECTED
        trigger: "POST /nonstandard-terms/{id}/review with decision REJECT"
        actor: LegalCounsel
        preconditions:
          - "identical to the APPROVE (LegalCounsel) transition's preconditions"
        side_effects:
          - "sets review_state = REJECTED, reviewed_by_user_id, reviewed_at, reviewer_note"
          - "cascade up: the request transitions TERMS_PENDING_LEGAL -> TERMS_BLOCKED, then OPEN -> REJECTED, then the Quote transitions PENDING_APPROVAL -> REJECTED with its own cascades"
      - from: APPROVED
        to: APPROVED
        trigger: "POST /nonstandard-terms/{id}/review with decision COSIGN"
        actor: CFO
        preconditions:
          - "term.review_state == APPROVED; else ERR_TERM_NOT_LEGAL_APPROVED"
          - "term.requires_cfo_cosign == true; else ERR_TERM_COSIGN_NOT_REQUIRED"
          - "term.cfo_cosigned_at is null; else ERR_TERM_ALREADY_COSIGNED"
          - "parent Quote.status == PENDING_APPROVAL; else ERR_QUOTE_NOT_PENDING_APPROVAL"
        side_effects:
          - "sets cfo_cosigned_at = logical clock and cfo_cosigned_by_user_id = X-User-ID; review_state stays APPROVED"
          - "conditional cascade: when no PENDING term remains, the request transitions TERMS_PENDING_LEGAL -> TERMS_CLEARED and may bubble up to OPEN -> APPROVED"
      - from: APPROVED
        to: PENDING
        trigger: "system event: POST /quotes/{id}/reopen cancels the ApprovalRequest"
        actor: system
        preconditions:
          - "term.review_state == APPROVED"
        side_effects:
          - "clears reviewed_by_user_id, reviewed_at, reviewer_note, cfo_cosigned_at, cfo_cosigned_by_user_id"
      - from: PENDING
        to: WITHDRAWN
        trigger: "system event: the parent Quote transitions to REJECTED or EXPIRED"
        actor: system
        preconditions:
          - "term.review_state == PENDING"
        side_effects:
          - "the term no longer contributes to C6 for any later recomputation"

  - entity: CompetitiveException
    initial_state: SUBMITTED
    terminal_states: [REJECTED, REVOKED, RELEASED]
    transitions:
      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /competitive-exceptions/{id}/decide with decision ACCEPT"
        actor: DealDeskAnalyst | CFO
        preconditions:
          - "exception.status == SUBMITTED; else ERR_EXCEPTION_STATE_INVALID"
          - "parent Quote.status IN {DRAFT, CHANGES_REQUESTED}; else ERR_QUOTE_NOT_DRAFT"
          - "X-User-ID != exception.documented_by_user_id; else ERR_SEGREGATION_OF_DUTIES"
          - "Quote.final_margin_pct < DeskPolicy.margin_floor_pct; else ERR_EXCEPTION_NOT_NEEDED"
          - "Quote.final_margin_pct >= DeskPolicy.absolute_margin_floor_pct; else ERR_ABSOLUTE_MARGIN_FLOOR_BREACH"
          - "Account.exception_allowance_used_cents + C4 margin_give_up_cents <= DeskPolicy.exception_allowance_cents; else ERR_EXCEPTION_ALLOWANCE_EXHAUSTED"
        side_effects:
          - "sets status = ACCEPTED, decided_by_user_id = X-User-ID, decided_at = logical clock, decision_note"
          - "sets allowance_consumed_cents = C4 margin_give_up_cents"
          - "ledger sync: increments Account.exception_allowance_used_cents by allowance_consumed_cents"
          - "recomputes Quote.required_approval_level = max(C3 matrix level, 3) and increments Quote.version by 1"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /competitive-exceptions/{id}/decide with decision REJECT"
        actor: DealDeskAnalyst | CFO
        preconditions:
          - "exception.status == SUBMITTED; else ERR_EXCEPTION_STATE_INVALID"
          - "parent Quote.status IN {DRAFT, CHANGES_REQUESTED}; else ERR_QUOTE_NOT_DRAFT"
          - "X-User-ID != exception.documented_by_user_id; else ERR_SEGREGATION_OF_DUTIES"
        side_effects:
          - "sets status = REJECTED, decided_by_user_id, decided_at, decision_note; allowance_consumed_cents stays 0"
      - from: ACCEPTED
        to: REVOKED
        trigger: "POST /competitive-exceptions/{id}/revoke"
        actor: CFO
        preconditions:
          - "exception.status == ACCEPTED; else ERR_EXCEPTION_STATE_INVALID"
          - "parent Quote.status IN {DRAFT, CHANGES_REQUESTED, PENDING_APPROVAL}; else ERR_QUOTE_STATE_INVALID_FOR_REVOKE"
        side_effects:
          - "sets released_at = logical clock and decision_note; allowance_consumed_cents is retained for audit"
          - "compensation: decrements Account.exception_allowance_used_cents by allowance_consumed_cents"
          - "recomputes Quote.required_approval_level from the C3 matrix without the exception floor and increments Quote.version by 1"
      - from: ACCEPTED
        to: RELEASED
        trigger: "system event: the parent Quote transitions to REJECTED or EXPIRED"
        actor: system
        preconditions:
          - "exception.status == ACCEPTED"
        side_effects:
          - "sets released_at = logical clock"
          - "compensation: decrements Account.exception_allowance_used_cents by allowance_consumed_cents"

  - entity: RevRecAssessment
    initial_state: ASSESSED
    terminal_states: []
    note: "No terminal state: any assessed row returns to STALE whenever the quote's version advances past snapshot_quote_version, so the accountant must re-clear it."
    transitions:
      - from: ASSESSED
        to: CLEARED
        trigger: "POST /revrec-assessments/{id}/assess with decision CLEAR"
        actor: RevenueAccountant
        preconditions:
          - "assessment.status IN {ASSESSED, STALE}; else ERR_REVREC_STATE_INVALID"
          - "parent Quote.status IN {DRAFT, CHANGES_REQUESTED}; else ERR_QUOTE_NOT_DRAFT"
        side_effects:
          - "recomputes C7 and rewrites arrangement_type, allocable_amount_cents, usage_excluded_cents, allocation_lines, allocation_residual_cents"
          - "sets snapshot_quote_version = Quote.version, assessed_by_user_id = X-User-ID, assessed_at = logical clock, assessment_note"
      - from: ASSESSED
        to: BLOCKED
        trigger: "POST /revrec-assessments/{id}/assess with decision BLOCK"
        actor: RevenueAccountant
        preconditions:
          - "assessment.status IN {ASSESSED, STALE}; else ERR_REVREC_STATE_INVALID"
          - "parent Quote.status IN {DRAFT, CHANGES_REQUESTED}; else ERR_QUOTE_NOT_DRAFT"
        side_effects:
          - "sets assessed_by_user_id, assessed_at, assessment_note; the quote can no longer pass the submit precondition on RevRecAssessment"
      - from: STALE
        to: CLEARED
        trigger: "POST /revrec-assessments/{id}/assess with decision CLEAR"
        actor: RevenueAccountant
        preconditions:
          - "assessment.status == STALE"
          - "parent Quote.status IN {DRAFT, CHANGES_REQUESTED}"
        side_effects:
          - "identical to the ASSESSED -> CLEARED side effects; the allocation is recomputed against the current lines before clearing"
      - from: STALE
        to: BLOCKED
        trigger: "POST /revrec-assessments/{id}/assess with decision BLOCK"
        actor: RevenueAccountant
        preconditions:
          - "assessment.status == STALE"
          - "parent Quote.status IN {DRAFT, CHANGES_REQUESTED}"
        side_effects:
          - "identical to the ASSESSED -> BLOCKED side effects"
      - from: CLEARED
        to: STALE
        trigger: "system event: POST /quote-lines, PATCH /quote-lines/{id}, DELETE /quote-lines/{id}, PATCH /quotes/{id}, POST /quotes/{id}/reopen, or a CompetitiveException decision advances Quote.version past snapshot_quote_version"
        actor: system
        preconditions:
          - "assessment.status IN {ASSESSED, CLEARED, BLOCKED}"
          - "Quote.version > assessment.snapshot_quote_version"
        side_effects:
          - "clears assessed_by_user_id, assessed_at and assessment_note; allocation_lines are retained until the next assess call recomputes them"
      - from: ASSESSED
        to: STALE
        trigger: "system event: Quote.version advances past snapshot_quote_version (same producers as CLEARED -> STALE)"
        actor: system
        preconditions:
          - "assessment.status == ASSESSED"
          - "Quote.version > assessment.snapshot_quote_version"
        side_effects:
          - "clears assessed_by_user_id, assessed_at and assessment_note"
      - from: BLOCKED
        to: STALE
        trigger: "system event: Quote.version advances past snapshot_quote_version (same producers as CLEARED -> STALE)"
        actor: system
        preconditions:
          - "assessment.status == BLOCKED"
          - "Quote.version > assessment.snapshot_quote_version"
        side_effects:
          - "clears assessed_by_user_id, assessed_at and assessment_note"

  - entity: OrderForm
    initial_state: GENERATED
    terminal_states: [DECLINED, VOID]
    note: "Branching: OUT_FOR_SIGNATURE forks to SIGNED or DECLINED with divergent side effects; BOOKED is reversible back through VOID."
    transitions:
      - from: GENERATED
        to: OUT_FOR_SIGNATURE
        trigger: "POST /order-forms/{id}/send"
        actor: SalesRep
        preconditions:
          - "form.status == GENERATED; else ERR_ORDER_FORM_STATE_INVALID"
          - "parent Quote.status == APPROVED; else ERR_QUOTE_NOT_APPROVED"
          - "logical clock <= Quote.expires_at; else ERR_QUOTE_EXPIRED"
          - "X-User-ID == Quote.owner_rep_user_id; else ERR_NOT_QUOTE_OWNER"
        side_effects:
          - "sets sent_at = logical clock"
      - from: OUT_FOR_SIGNATURE
        to: SIGNED
        trigger: "POST /order-forms/{id}/signature with outcome SIGNED"
        actor: DealDeskAnalyst
        preconditions:
          - "form.status == OUT_FOR_SIGNATURE; else ERR_ORDER_FORM_STATE_INVALID"
          - "parent Quote.status == APPROVED; else ERR_QUOTE_NOT_APPROVED"
          - "logical clock <= Quote.expires_at; else ERR_QUOTE_EXPIRED"
        side_effects:
          - "sets signed_at = logical clock and signed_by_name from the request"
      - from: OUT_FOR_SIGNATURE
        to: DECLINED
        trigger: "POST /order-forms/{id}/signature with outcome DECLINED"
        actor: DealDeskAnalyst
        preconditions:
          - "form.status == OUT_FOR_SIGNATURE; else ERR_ORDER_FORM_STATE_INVALID"
          - "parent Quote.status == APPROVED; else ERR_QUOTE_NOT_APPROVED"
        side_effects:
          - "sets declined_at = logical clock; the parent Quote keeps status APPROVED and no ledger field moves"
      - from: SIGNED
        to: BOOKED
        trigger: "POST /order-forms/{id}/book"
        actor: DealDeskAnalyst
        preconditions:
          - "form.status == SIGNED; else ERR_ORDER_FORM_STATE_INVALID"
          - "parent Quote.status == APPROVED; else ERR_QUOTE_NOT_APPROVED"
          - "logical clock <= Quote.expires_at; else ERR_QUOTE_EXPIRED"
          - "Account.credit_status IN {CLEAR, WATCH}; else ERR_ACCOUNT_CREDIT_HOLD"
          - "form.generated_from_quote_version == Quote.version; else ERR_BOOKING_CRITERIA_UNMET"
          - "Quote.policy_revalidation_required == false; else ERR_BOOKING_CRITERIA_UNMET"
          - "Quote.arrangement_type == SINGLE_ELEMENT OR a RevRecAssessment on this quote has status == CLEARED; else ERR_BOOKING_CRITERIA_UNMET"
          - "C8 booked_tcv_cents > 0; else ERR_BOOKING_CRITERIA_UNMET"
        side_effects:
          - "sets booked_at = logical clock, booked_arr_cents and booked_tcv_cents per C8"
          - "ledger sync: increments Account.booked_arr_cents by form.booked_arr_cents"
          - "bubble up: the parent Quote transitions APPROVED -> BOOKED and copies booked_arr_cents and booked_tcv_cents"
      - from: BOOKED
        to: VOID
        trigger: "POST /order-forms/{id}/reverse-booking"
        actor: CFO
        preconditions:
          - "form.status == BOOKED; else ERR_ORDER_FORM_STATE_INVALID"
          - "parent Quote.status == BOOKED"
        side_effects:
          - "sets booking_reversed_at = logical clock, voided_at = logical clock, reversal_reason and void_reason = 'BOOKING_REVERSED', increments booking_reversal_count by 1"
          - "compensation: decrements Account.booked_arr_cents by form.booked_arr_cents; the form retains booked_arr_cents and booked_tcv_cents for audit"
          - "bubble up: the parent Quote transitions BOOKED -> APPROVED and resets its booked_arr_cents and booked_tcv_cents to 0"
      - from: GENERATED
        to: VOID
        trigger: "system event: POST /order-forms creates a newer form for the same quote, or POST /expiry-sweeps expires the parent Quote"
        actor: system
        preconditions:
          - "form.status == GENERATED"
        side_effects:
          - "sets voided_at = logical clock and void_reason = 'SUPERSEDED_BY_NEW_ORDER_FORM' or 'QUOTE_EXPIRED'"
      - from: OUT_FOR_SIGNATURE
        to: VOID
        trigger: "system event: POST /order-forms creates a newer form for the same quote, or POST /expiry-sweeps expires the parent Quote"
        actor: system
        preconditions:
          - "form.status == OUT_FOR_SIGNATURE"
        side_effects:
          - "sets voided_at = logical clock and void_reason = 'SUPERSEDED_BY_NEW_ORDER_FORM' or 'QUOTE_EXPIRED'; the signature route is abandoned"

  - entity: DelegationGrant
    initial_state: ACTIVE
    terminal_states: [REVOKED, EXPIRED]
    transitions:
      - from: ACTIVE
        to: REVOKED
        trigger: "POST /delegation-grants/{id}/revoke"
        actor: SalesDirector | VPSales | CFO
        preconditions:
          - "grant.status == ACTIVE; else ERR_DELEGATION_STATE_INVALID"
          - "X-User-ID == grant.grantor_user_id; else ERR_NOT_GRANT_GRANTOR"
        side_effects:
          - "sets revoked_at = logical clock; ApprovalSteps already decided under the grant keep delegation_grant_id and used_step_count is not rewound"
      - from: ACTIVE
        to: EXPIRED
        trigger: "POST /expiry-sweeps"
        actor: PlatformAdmin
        preconditions:
          - "grant.status == ACTIVE"
          - "logical clock >= grant.ends_at"
        side_effects:
          - "no other entity changes; later decide calls under this grant are rejected with ERR_DELEGATION_NOT_ACTIVE"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: occ-renegotiate-stale-quote
    parent_entity: Quote
    write_endpoint: "POST /quotes/{id}/renegotiate"
    occ_field: "expected_quote_version"
    description: |
      Cloning a Quote for renegotiation while carrying a quote version that has
      already advanced is rejected with a stale-version error. A renegotiation
      clone legitimately supersedes any earlier DRAFT clone of the same source
      quote, so a second create against an unchanged view of the source is a
      well-formed request under the product semantics; OCC on Quote.version is
      what makes the outcome deterministic.
    error_id: ERR_STALE_QUOTE_VERSION
    http_status: 412
  - rule_id: occ-order-form-supersede
    parent_entity: Quote
    write_endpoint: "POST /order-forms"
    occ_field: "expected_quote_version"
    description: |
      Generating an OrderForm against a Quote whose version has advanced since
      the client last read it is rejected with a stale-version error. Generating
      a form legitimately voids any prior form in GENERATED or OUT_FOR_SIGNATURE
      for the same quote, so an unconditional second generate would silently
      discard signature routing that the caller never observed.
    error_id: ERR_STALE_QUOTE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
#
# Money convention (applies to every calculation below): Product.list_unit_price_cents
# and Product.unit_cost_cents are per-unit amounts for the WHOLE contract term quoted
# at the 12-month reference term. QuoteLine.extended_list_cents is therefore
# quantity * list_unit_price_cents with no term factor, and a longer commitment is
# rewarded through the C1 term multiplier (0.90 at >= 36 months) rather than by
# multiplying the term length. Annualisation happens once, in C8.
# =============================================================================
calculations:

  - name: C1_line_pricing
    trigger: "POST /quote-lines, PATCH /quote-lines/{id}, DELETE /quote-lines/{id}, PATCH /quotes/{id}, GET /quotes/{id}/pricing-preview, POST /quotes/{id}/submit, POST /quotes/{id}/renegotiate"
    algorithm: tiered_pricing
    formula: |
      term_multiplier(term_months) =
          1.10 when term_months < 12
          1.00 when 12 <= term_months < 24
          0.95 when 24 <= term_months < 36
          0.90 when term_months >= 36

      extended_list_cents = quantity * unit_list_price_cents
      extended_cost_cents = quantity * unit_cost_cents

      # band selection: the VolumeTier rows of this line's product, sorted by
      # min_quantity ASC; the applicable band is the single row with
      # min_quantity <= quantity AND (max_quantity IS NULL OR quantity <= max_quantity).
      # volume_tier_level_applied = that row's tier_level, or 0 when the product
      # has no VolumeTier rows.

      # bundle: let R be the BundleRule rows with attached_product_id == this
      # line's product_id, sorted by created_at ASC; let r be the first row of R
      # for which a sibling QuoteLine on the same quote has
      # product_id == r.anchor_product_id. bundle_discount_applied_pct =
      #   r.bundle_discount_pct when (this line.quantity / anchor_line.quantity)
      #                              >= r.min_attach_quantity_ratio
      #   0                     otherwise (including when no such r exists)

      # ---- variant WHOLE_QUANTITY_AVERAGE (provisional) ----
      band_discount_average = tier_discount_pct of the applicable band, else 0
      effective_stack_discount_pct =
          min(band_discount_average + bundle_discount_applied_pct + requested_discount_pct,
              DeskPolicy.max_stack_discount_pct)
      provisional_net_cents = round_half_up(
          extended_list_cents * (1 - effective_stack_discount_pct)
          * term_multiplier(Quote.term_months))

      # ---- variant MARGINAL_PROGRESSIVE (final) ----
      # units are split across bands: band b contributes
      #   units_in_band(b) = max(0, min(quantity, b.max_quantity or quantity)
      #                              - b.min_quantity + 1)
      # and each band's units carry that band's own tier_discount_pct:
      band_stack(b) = min(b.tier_discount_pct + bundle_discount_applied_pct
                          + requested_discount_pct,
                          DeskPolicy.max_stack_discount_pct)
      final_net_cents = round_half_up(
          SUM over bands b, ordered by min_quantity ASC, of
            units_in_band(b) * unit_list_price_cents * (1 - band_stack(b))
          * term_multiplier(Quote.term_months))
      # products with no VolumeTier rows: both variants collapse to the same
      # value because band_discount_average == 0 and there is a single implicit
      # band [1, quantity] with tier_discount_pct 0.
    input_set: "Every QuoteLine with quote_id == the quote being priced. unit_list_price_cents / unit_cost_cents / rev_rec_category are the values snapshotted on the line, not the Product's current values. DeskPolicy is the quote's pinned desk_policy_id row regardless of its status."
    constants:
      TERM_MULTIPLIER_UNDER_12: 1.10
      TERM_MULTIPLIER_12_TO_23: 1.00
      TERM_MULTIPLIER_24_TO_35: 0.95
      TERM_MULTIPLIER_36_PLUS: 0.90
    precision: "cents are integers, round_half_up applied once per line after the term multiplier; effective_stack_discount_pct at 6 decimal places, round_half_up"
    variants:
      - name: WHOLE_QUANTITY_AVERAGE
        when: "written to QuoteLine.provisional_net_cents and rolled into Quote.provisional_net_total_cents on every line write and on GET /quotes/{id}/pricing-preview"
        difference: "the whole quantity receives the discount of the single band that contains it, so a quantity that has just crossed a band edge is discounted as if every unit sat in the top band"
      - name: MARGINAL_PROGRESSIVE
        when: "written to QuoteLine.final_net_cents and rolled into Quote.final_net_total_cents; this is the variant the approval matrix (C3), the margin floors (C4) and booking (C8) read"
        difference: "units are discounted band by band, so the same quantity yields a strictly higher net than WHOLE_QUANTITY_AVERAGE whenever more than one band is straddled"

  - name: C2_order_totals
    trigger: "POST /quote-lines, PATCH /quote-lines/{id}, DELETE /quote-lines/{id}, PATCH /quotes/{id}, GET /quotes/{id}/pricing-preview, POST /quotes/{id}/submit, POST /quotes/{id}/renegotiate"
    algorithm: threshold
    formula: |
      list_total_cents = SUM of QuoteLine.extended_list_cents
      cost_total_cents = SUM of QuoteLine.extended_cost_cents
      net_subtotal_cents = SUM of the variant-matched line net
                           (provisional_net_cents or final_net_cents)

      # order-level volume rebate — keyed on net_subtotal_cents, i.e. AFTER the
      # per-line discounts and BEFORE the payment-terms uplift:
      rebate_rate = volume_rebate_tier2_pct when net_subtotal_cents >= volume_rebate_tier2_min_cents
                    volume_rebate_tier1_pct when net_subtotal_cents >= volume_rebate_tier1_min_cents
                    0                       otherwise
      volume_rebate_cents = round_half_up(net_subtotal_cents * rebate_rate)

      # financing uplift for extended payment terms — charged on the
      # post-rebate amount, in whole 30-day blocks rounded UP:
      extra_days = max(0, Quote.payment_terms_days - DeskPolicy.standard_payment_terms_days)
      uplift_periods = ceil(extra_days / 30)
      payment_terms_uplift_cents = round_half_up(
          (net_subtotal_cents - volume_rebate_cents)
          * DeskPolicy.uplift_rate_per_30_days * uplift_periods)

      net_total_cents = net_subtotal_cents - volume_rebate_cents
                        + payment_terms_uplift_cents
    input_set: "Every QuoteLine with quote_id == the quote being priced, in both C1 variants; the provisional pass writes provisional_net_total_cents and the final pass writes final_net_total_cents, volume_rebate_cents and payment_terms_uplift_cents"
    constants:
      UPLIFT_BLOCK_DAYS: 30
    precision: "integer cents; round_half_up applied separately to the rebate and to the uplift, in that order — the rebate is never computed on the uplifted amount and the uplift is never computed on the pre-rebate amount"
    variants:
      - name: PROVISIONAL_TOTAL
        when: "net_subtotal_cents is summed from provisional_net_cents"
        difference: "a lower net subtotal can fall under a rebate threshold that the final pass clears, so the two passes may apply different rebate_rate values to the same quote"
      - name: FINAL_TOTAL
        when: "net_subtotal_cents is summed from final_net_cents; Quote.volume_rebate_cents and Quote.payment_terms_uplift_cents record this pass only"
        difference: "uses the MARGINAL_PROGRESSIVE line nets, which raises net_subtotal_cents and therefore both the rebate and the uplift bases"

  - name: C3_blended_discount_and_approval_level
    trigger: "POST /quote-lines, PATCH /quote-lines/{id}, DELETE /quote-lines/{id}, PATCH /quotes/{id}, GET /quotes/{id}/pricing-preview, POST /quotes/{id}/submit, POST /competitive-exceptions/{id}/decide, POST /competitive-exceptions/{id}/revoke"
    algorithm: threshold
    formula: |
      # the uplift is financing, not discount, so it is excluded from the base:
      blended_discount_pct = round_half_up(
          1 - (net_subtotal_cents - volume_rebate_cents) / list_total_cents, 6)
      # list_total_cents == 0 is impossible at submit (>= 1 line, list price > 0)

      matrix_level = tier_level of the single ApprovalTier of the pinned
                     DeskPolicy with
                     min_discount_pct <= final_blended_discount_pct
                                       < max_discount_pct

      required_approval_level =
          0                       when final_blended_discount_pct == 0.000000
                                   AND no CompetitiveException on this quote has
                                   status == ACCEPTED
          max(matrix_level, 3)    when a CompetitiveException on this quote has
                                   status == ACCEPTED
          matrix_level            otherwise
    input_set: "The quote's own C2 outputs, plus the ApprovalTier rows of the pinned DeskPolicy and the CompetitiveException rows with quote_id == this quote"
    constants:
      EXCEPTION_MINIMUM_LEVEL: 3
    precision: "blended discount at 6 decimal places, round_half_up; band membership is tested on the rounded value with min inclusive and max exclusive"
    variants:
      - name: PROVISIONAL_BLENDED
        when: "computed from provisional_net_total_cents and written to provisional_blended_discount_pct"
        difference: "informational only — reading it instead of final_blended_discount_pct selects a higher approval level on any multi-band quote"
      - name: FINAL_BLENDED
        when: "computed from final_net_total_cents and written to final_blended_discount_pct"
        difference: "the only value the approval matrix and DelegationGrant.max_discount_pct compare against"

  - name: C4_margin_and_exception_allowance
    trigger: "POST /quote-lines, PATCH /quote-lines/{id}, DELETE /quote-lines/{id}, PATCH /quotes/{id}, GET /quotes/{id}/pricing-preview, POST /quotes/{id}/submit, POST /competitive-exceptions/{id}/decide"
    algorithm: aggregation
    formula: |
      margin_pct = round_half_up(
          (net_total_cents - cost_total_cents) / net_total_cents, 6)
      # note: the payment-terms uplift IS included in net_total_cents here, so a
      # longer payment term raises margin_pct while leaving
      # blended_discount_pct untouched.

      margin_give_up_cents = round_half_up(
          (DeskPolicy.margin_floor_pct - final_margin_pct) * final_net_total_cents)
      # only charged when final_margin_pct < DeskPolicy.margin_floor_pct

      Account.exception_allowance_used_cents = SUM of allowance_consumed_cents
          over CompetitiveException rows whose account (via quote_id -> Quote.account_id)
          is this account AND whose status == ACCEPTED
    input_set: "The quote's own C2 outputs for margin_pct; for the allowance pool, every CompetitiveException with status == ACCEPTED belonging to the account, with SUBMITTED, REJECTED, REVOKED and RELEASED rows excluded"
    constants: {}
    precision: "margin at 6 decimal places, round_half_up; margin_give_up_cents in integer cents, round_half_up"
    variants:
      - name: PROVISIONAL_MARGIN
        when: "computed from provisional_net_total_cents and written to provisional_margin_pct"
        difference: "reports a lower margin than the final pass on multi-band quotes, which can show a floor breach that the final pass does not have"
      - name: FINAL_MARGIN
        when: "computed from final_net_total_cents and written to final_margin_pct"
        difference: "the only value the margin floor validations and the CompetitiveException preconditions read"

  - name: C5_service_levels_and_expiry
    trigger: "POST /quotes (expires_at), POST /quotes/{id}/submit (step service level), POST /approval-steps/{id}/decide (turnaround), POST /sla-escalation-sweeps, system transition PENDING_APPROVAL -> APPROVED (expires_at re-base)"
    algorithm: interval_merge
    formula: |
      quarter_end_instant(t) = the first instant of the calendar quarter that
          follows t: 01 Jan, 01 Apr, 01 Jul or 01 Oct at 00:00:00Z
      surge_window_start(t) = quarter_end_instant(t)
                              - DeskPolicy.surge_window_days days
      in_surge_window(t) = surge_window_start(t) <= t < quarter_end_instant(t)

      sla_hours_effective = round_half_up(
          ApprovalTier.sla_hours *
          (DeskPolicy.surge_sla_multiplier when in_surge_window(step.created_at)
           else 1), 2)
      sla_due_at = step.created_at + sla_hours_effective hours
      # breach is strict: the sweep escalates only when clock > sla_due_at

      turnaround_hours = round_half_up(
          (step.decided_at - step.created_at) / 3600 seconds, 2)
      total_turnaround_hours = round_half_up(
          (request.decided_at - request.submitted_at) / 3600 seconds, 2)

      expires_at at creation  = created_at
                                + DeskPolicy.quote_validity_days days
      expires_at at approval  = approved_at + DeskPolicy.quote_validity_days days,
                                capped at quarter_end_instant(approved_at)
                                when in_surge_window(approved_at)
      # expiry itself is strict: the sweep expires a quote only when
      # clock > expires_at
    input_set: "The ApprovalTier row matching the step's level on the quote's pinned DeskPolicy; every ApprovalStep with decision == PENDING for the escalation sweep; every Quote with status IN {DRAFT, PENDING_APPROVAL, APPROVED} for the expiry sweep, processed in created_at ASC order"
    constants:
      DEFAULT_CLOCK: "2026-08-01T00:00:00Z"
      QUARTER_START_MONTHS: [1, 4, 7, 10]
    precision: "hours at 2 decimal places, round_half_up; all instants ISO 8601 UTC with three fractional digits"

  - name: C6_nonstandard_term_risk
    trigger: "POST /nonstandard-terms, POST /quotes/{id}/submit, POST /nonstandard-terms/{id}/review, GET /quotes/{id}/pricing-preview"
    algorithm: weighted_scoring
    formula: |
      category_weight:
        PAYMENT_TERMS                 -> 20
        SLA_COMMITMENT                -> 30
        INDEMNITY_CAP                 -> 30
        TERMINATION_FOR_CONVENIENCE   -> 30
        PRICE_HOLD_RENEWAL            -> 30

      severity_factor (v = requested_numeric_value), clamped into [0, 1]:
        PAYMENT_TERMS                 -> min(1, max(0, (v - 30) / 120))
        SLA_COMMITMENT                -> min(1, max(0, (v - 99.9) / 0.1))
        INDEMNITY_CAP                 -> min(1, max(0, v / 6))
        TERMINATION_FOR_CONVENIENCE   -> min(1, max(0, (12 - v) / 12))
        PRICE_HOLD_RENEWAL            -> min(1, max(0, v / 36))

      risk_contribution = round_half_up(category_weight * severity_factor, 2)

      # ---- variant AGGREGATE_WEIGHTED ----
      terms_risk_score_aggregate = min(100, round_half_up(
          SUM of risk_contribution over the input set, 2))

      # ---- variant DOMINANT_CATEGORY ----
      dominant_term = the input-set row with the highest risk_contribution;
                      ties broken by created_at ASC
      terms_risk_score_dominant = min(100, round_half_up(
          dominant_term.risk_contribution * 1.25, 2))

      requires_cfo_cosign = true on dominant_term only, and only when
          terms_risk_score_dominant >= DeskPolicy.terms_cfo_risk_threshold;
          false on every other term
      legal_review_required = terms_risk_score_aggregate
                              >= DeskPolicy.terms_review_risk_threshold
    input_set: "Every NonStandardTerm with quote_id == this quote and review_state IN {PENDING, APPROVED, REJECTED}; rows with review_state == WITHDRAWN are excluded. Both variants read the identical input set."
    constants:
      DOMINANT_MULTIPLIER: 1.25
      SCORE_CAP: 100
    precision: "severity_factor at 6 decimal places, risk_contribution and both scores at 2 decimal places, round_half_up; the aggregate sums the already-rounded contributions"
    variants:
      - name: AGGREGATE_WEIGHTED
        when: "compared against DeskPolicy.terms_review_risk_threshold to decide whether LegalCounsel review is mandatory or the terms are auto-approved at submit"
        difference: "sums every term's contribution, so many mild deviations can trip the review threshold that no single term reaches"
      - name: DOMINANT_CATEGORY
        when: "compared against DeskPolicy.terms_cfo_risk_threshold to decide whether the single worst term needs a CFO co-signature"
        difference: "reads only the single highest contribution and multiplies it by 1.25, so it is insensitive to the number of terms and can exceed the aggregate score when exactly one severe term exists"

  - name: C7_revrec_allocation
    trigger: "POST /revrec-assessments, POST /revrec-assessments/{id}/assess, GET /quotes/{id}/pricing-preview"
    algorithm: waterfall_allocation
    formula: |
      distinct_categories = set of QuoteLine.rev_rec_category over the quote's lines
      arrangement_type =
          SINGLE_ELEMENT      when |distinct_categories| == 1
          USAGE_BASED_HYBRID  when |distinct_categories| >= 2
                               AND USAGE_AS_INCURRED IN distinct_categories
          MULTI_ELEMENT       otherwise

      usage_excluded_cents = SUM of final_net_cents over lines whose
                             rev_rec_category == USAGE_AS_INCURRED
      allocable_amount_cents = Quote.final_net_total_cents - usage_excluded_cents

      # standalone selling price basis, allocable lines only:
      allocable_lines = the quote's lines whose rev_rec_category != USAGE_AS_INCURRED,
                        ordered by created_at ASC
      ssp_cents(line) = line.extended_list_cents
      ssp_total = SUM of ssp_cents over allocable_lines

      # waterfall: every allocable line except the last takes its floored share,
      # the last allocable line absorbs the remainder:
      for each line in allocable_lines except the last:
          allocated_cents = floor(allocable_amount_cents
                                  * ssp_cents(line) / ssp_total)
      for the last allocable line:
          allocated_cents = allocable_amount_cents
                            - SUM of the already allocated amounts
      allocation_residual_cents = allocated_cents(last allocable line)
          - floor(allocable_amount_cents * ssp_cents(last) / ssp_total)
      # USAGE_AS_INCURRED lines appear in allocation_lines with
      # allocated_cents == 0 and are recognised as incurred instead.
    input_set: "Every QuoteLine with quote_id == this quote, using final_net_cents (MARGINAL_PROGRESSIVE) and extended_list_cents; ordering for the residual is created_at ASC so the newest allocable line absorbs it"
    constants: {}
    precision: "integer cents; each non-last share is floored (never round_half_up) so the residual is always non-negative and lands on exactly one line"

  - name: C8_booking_values
    trigger: "POST /order-forms/{id}/book, POST /order-forms/{id}/reverse-booking"
    algorithm: aggregation
    formula: |
      recurring_net_cents = SUM of QuoteLine.final_net_cents over lines whose
                            rev_rec_category == RATABLE
      booked_arr_cents = round_half_up(
          recurring_net_cents / (Quote.term_months / 12))
      booked_tcv_cents = Quote.final_net_total_cents

      # ledger, maintained by the BOOKED and reverse-booking transitions:
      Account.booked_arr_cents = SUM of OrderForm.booked_arr_cents over the
          account's OrderForms whose status == BOOKED
    input_set: "Every QuoteLine of the quote named by the order form, at the moment of booking; POINT_IN_TIME and USAGE_AS_INCURRED lines contribute to booked_tcv_cents but never to booked_arr_cents"
    constants:
      MONTHS_PER_YEAR: 12
    precision: "integer cents, round_half_up on the annualisation division"

# =============================================================================
# §1.4 Validation Rules Table (evaluated in ascending priority; the first
# violated rule decides the response, and no side effect of the request is
# applied when any rule is violated)
# =============================================================================
validations:

  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are both present and non-empty strings"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "X-User-Role is one of the roles listed in the endpoint's roles: array in §1.5"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "every id embedded in the path exists, validated left to right"
    error_id: "ERR_DESK_POLICY_NOT_FOUND | ERR_PRODUCT_NOT_FOUND | ERR_ACCOUNT_NOT_FOUND | ERR_QUOTE_NOT_FOUND | ERR_QUOTE_LINE_NOT_FOUND | ERR_TERM_NOT_FOUND | ERR_EXCEPTION_NOT_FOUND | ERR_REVREC_NOT_FOUND | ERR_APPROVAL_STEP_NOT_FOUND | ERR_DELEGATION_NOT_FOUND | ERR_ORDER_FORM_NOT_FOUND"
    http_status: 404
    applies_to: "every path containing {id}"

  - priority: 4
    category: business_constraint
    check: "the request body contains every required field of the endpoint's input:, every value matches its declared type, every enum value is a declared member, every numeric value is inside its declared range, hold_start_date <= hold_end_date, starts_at < ends_at, and no unknown field is present"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all POST, PATCH and DELETE endpoints"

  - priority: 5
    category: business_referential
    check: "every foreign key supplied in the body exists: account_id, product_id, quote_id, approval_request_id, hold_product_id, desk_policy_id, anchor_product_id, attached_product_id"
    error_id: "ERR_ACCOUNT_NOT_FOUND | ERR_PRODUCT_NOT_FOUND | ERR_QUOTE_NOT_FOUND | ERR_DESK_POLICY_NOT_FOUND"
    http_status: 404
    applies_to: "POST /quotes, POST /quote-lines, POST /nonstandard-terms, POST /competitive-exceptions, POST /revrec-assessments, POST /order-forms, POST /approval-tiers, POST /volume-tiers, POST /bundle-rules"

  - priority: 6
    category: business_constraint
    check: "configuration uniqueness and band integrity: on activation the policy's ApprovalTier bands cover [0.0, 1.0] contiguously; Product.sku is unique; ApprovalTier bands of one policy do not overlap and tier_level is unique per policy; VolumeTier bands of one product do not overlap and at most one row has max_quantity == null; BundleRule is unique per (anchor_product_id, attached_product_id) and anchor_product_id != attached_product_id"
    error_id: "ERR_DUPLICATE_PRODUCT_SKU | ERR_APPROVAL_TIER_OVERLAP | ERR_VOLUME_TIER_OVERLAP | ERR_DUPLICATE_BUNDLE_RULE | ERR_APPROVAL_TIER_COVERAGE_INVALID"
    http_status: "409 for the duplicate/overlap errors, 422 for ERR_APPROVAL_TIER_COVERAGE_INVALID"
    applies_to: "POST /products, POST /approval-tiers, POST /volume-tiers, POST /bundle-rules, POST /desk-policies/{id}/activate"

  - priority: 7
    category: business_safety
    check: "resource ownership: X-User-ID == Quote.owner_rep_user_id for quote-owner operations, and X-User-ID == DelegationGrant.grantor_user_id for grant revocation"
    error_id: "ERR_NOT_QUOTE_OWNER | ERR_NOT_GRANT_GRANTOR"
    http_status: 403
    applies_to: "PATCH /quotes/{id}, POST /quote-lines, PATCH /quote-lines/{id}, DELETE /quote-lines/{id}, POST /quotes/{id}/submit, POST /quotes/{id}/reopen, POST /quotes/{id}/renegotiate, POST /nonstandard-terms, POST /competitive-exceptions, POST /order-forms, POST /order-forms/{id}/send, POST /delegation-grants/{id}/revoke"

  - priority: 8
    category: state
    check: "the target resource is in a state from which this transition is declared in §1.2"
    error_id: "ERR_QUOTE_NOT_DRAFT | ERR_QUOTE_NOT_PENDING_APPROVAL | ERR_QUOTE_NOT_APPROVED | ERR_QUOTE_NOT_CHANGES_REQUESTED | ERR_QUOTE_STATE_INVALID_FOR_REVOKE | ERR_STEP_ALREADY_DECIDED | ERR_TERM_ALREADY_REVIEWED | ERR_TERM_NOT_LEGAL_APPROVED | ERR_EXCEPTION_STATE_INVALID | ERR_REVREC_STATE_INVALID | ERR_ORDER_FORM_STATE_INVALID | ERR_DELEGATION_STATE_INVALID | ERR_DESK_POLICY_NOT_DRAFT"
    http_status: 409
    applies_to: "every write endpoint that drives a §1.2 transition"

  - priority: 9
    category: business_constraint
    check: "optimistic concurrency: expected_quote_version equals the current Quote.version"
    error_id: ERR_STALE_QUOTE_VERSION
    http_status: 412
    applies_to: "POST /quotes/{id}/renegotiate, POST /order-forms"

  - priority: 10
    category: business_safety
    check: "segregation of duties: the acting X-User-ID may not decide an ApprovalStep on a quote it owns, and may not decide a CompetitiveException it documented"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /approval-steps/{id}/decide, POST /competitive-exceptions/{id}/decide"

  - priority: 11
    category: business_constraint
    check: "legal-review gating: a term review is accepted only while the quote's ApprovalRequest.terms_track_state == PENDING_LEGAL; a COSIGN decision requires review_state == APPROVED, requires_cfo_cosign == true and cfo_cosigned_at == null"
    error_id: "ERR_LEGAL_REVIEW_NOT_REQUIRED | ERR_TERM_COSIGN_NOT_REQUIRED | ERR_TERM_ALREADY_COSIGNED"
    http_status: 409
    applies_to: "POST /nonstandard-terms/{id}/review"

  - priority: 12
    category: business_constraint
    check: "approver authority: X-User-Role == ApprovalStep.assigned_role, or the acting user holds a DelegationGrant with status == ACTIVE, tier_level == step.level, grantee_user_id == X-User-ID, starts_at <= clock < ends_at, ApprovalTier.max_delegation_levels == 1 for that level, and Quote.final_blended_discount_pct <= grant.max_discount_pct"
    error_id: "ERR_APPROVER_ROLE_MISMATCH | ERR_DELEGATION_NOT_ACTIVE | ERR_DELEGATION_LEVEL_NOT_DELEGABLE | ERR_DELEGATION_SCOPE_EXCEEDED"
    http_status: "403 for ERR_APPROVER_ROLE_MISMATCH, 409 for ERR_DELEGATION_NOT_ACTIVE, 422 for ERR_DELEGATION_LEVEL_NOT_DELEGABLE and ERR_DELEGATION_SCOPE_EXCEEDED"
    applies_to: "POST /approval-steps/{id}/decide"

  - priority: 13
    category: business_temporal
    check: "temporal conflicts: the logical clock is at or before Quote.expires_at; a new DelegationGrant does not overlap an existing grant with status == ACTIVE for the same (grantor_user_id, tier_level) on the half-open interval [starts_at, ends_at); a PRICE_HOLD_RENEWAL term's inclusive [hold_start_date, hold_end_date] window does not fall within DeskPolicy.price_hold_cooldown_days of another PRICE_HOLD_RENEWAL window with review_state IN {PENDING, APPROVED} for the same (Quote.account_id, hold_product_id)"
    error_id: "ERR_QUOTE_EXPIRED | ERR_DELEGATION_WINDOW_OVERLAP | ERR_PRICE_HOLD_WINDOW_CONFLICT"
    http_status: 409
    applies_to: "POST /quotes/{id}/submit, POST /quotes/{id}/reopen, POST /approval-steps/{id}/decide, POST /order-forms, POST /order-forms/{id}/send, POST /order-forms/{id}/signature, POST /order-forms/{id}/book, POST /delegation-grants, POST /nonstandard-terms"

  - priority: 14
    category: business_constraint
    check: "structural submit gates: the quote has at least one line; the pinned DeskPolicy has status == ACTIVE; term_months >= the largest Product.min_term_months on the quote; an extended payment term is accompanied by a matching PAYMENT_TERMS NonStandardTerm with review_state IN {PENDING, APPROVED}; a non SINGLE_ELEMENT arrangement has a RevRecAssessment with status == CLEARED"
    error_id: "ERR_QUOTE_HAS_NO_LINES | ERR_DESK_POLICY_SUPERSEDED | ERR_TERM_BELOW_PRODUCT_MINIMUM | ERR_NONSTANDARD_TERM_REQUIRED | ERR_REVREC_NOT_CLEARED"
    http_status: 422
    applies_to: "POST /quotes/{id}/submit"

  - priority: 15
    category: business_fiscal
    check: "fiscal floors and budgets: requested_discount_pct <= DeskPolicy.max_stack_discount_pct on every line write; at submit, final_margin_pct >= absolute_margin_floor_pct and (final_margin_pct >= margin_floor_pct or an ACCEPTED CompetitiveException exists); at exception acceptance, final_margin_pct < margin_floor_pct, final_margin_pct >= absolute_margin_floor_pct and Account.exception_allowance_used_cents + C4 margin_give_up_cents <= DeskPolicy.exception_allowance_cents; a quote may reference an ACTIVE DeskPolicy at creation"
    error_id: "ERR_DISCOUNT_STACK_EXCEEDED | ERR_ABSOLUTE_MARGIN_FLOOR_BREACH | ERR_MARGIN_FLOOR_BREACH | ERR_EXCEPTION_NOT_NEEDED | ERR_EXCEPTION_ALLOWANCE_EXHAUSTED | ERR_NO_ACTIVE_DESK_POLICY"
    http_status: 422
    applies_to: "POST /quotes, POST /quote-lines, PATCH /quote-lines/{id}, POST /quotes/{id}/submit, POST /competitive-exceptions/{id}/decide"

  - priority: 16
    category: business_constraint
    check: "order acceptance criteria at booking, evaluated in this order: Account.credit_status IN {CLEAR, WATCH}; then OrderForm.generated_from_quote_version == Quote.version, Quote.policy_revalidation_required == false, a CLEARED RevRecAssessment when arrangement_type != SINGLE_ELEMENT, and C8 booked_tcv_cents > 0"
    error_id: "ERR_ACCOUNT_CREDIT_HOLD | ERR_BOOKING_CRITERIA_UNMET"
    http_status: "409 for ERR_ACCOUNT_CREDIT_HOLD, 422 for ERR_BOOKING_CRITERIA_UNMET"
    applies_to: "POST /order-forms/{id}/book"

# =============================================================================
# §1.5 API Endpoint Table
#
# api_prefix is "" — every path below is absolute. Fields suffixed `?` are
# optional; every other field in `input:` is required. Filter fields on list
# endpoints are passed as query parameters. All list endpoints honour the §1.0
# pagination contract (limit, offset, total_count, has_more).
# =============================================================================
endpoints:

  # ---- desk policy and approval matrix (configuration) ----
  - method: POST
    path: "/desk-policies"
    description: "Create a DRAFT desk policy revision"
    roles: [PlatformAdmin]
    code: 201
    input: [name, margin_floor_pct, absolute_margin_floor_pct, quote_validity_days, standard_payment_terms_days, uplift_rate_per_30_days, max_stack_discount_pct, volume_rebate_tier1_min_cents, volume_rebate_tier1_pct, volume_rebate_tier2_min_cents, volume_rebate_tier2_pct, surge_window_days, surge_sla_multiplier, price_hold_cooldown_days, exception_allowance_cents, terms_review_risk_threshold, terms_cfo_risk_threshold]
    output: DeskPolicy
    side_effects: ["creates the policy with status DRAFT"]

  - method: POST
    path: "/desk-policies/{id}/activate"
    description: "Activate a DRAFT policy, superseding the current ACTIVE one"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: DeskPolicy
    side_effects:
      - "DeskPolicy DRAFT -> ACTIVE with activated_at"
      - "the previously ACTIVE DeskPolicy transitions ACTIVE -> SUPERSEDED"
      - "sets policy_revalidation_required = true on every PENDING_APPROVAL Quote pinned to the superseded policy and increments those Quote.version values by 1"

  - method: GET
    path: "/desk-policies/{id}"
    description: "Read one desk policy revision"
    roles: [PlatformAdmin, DealDeskAnalyst, SalesRep, SalesDirector, VPSales, CFO, LegalCounsel, RevenueAccountant]
    code: 200
    input: []
    output: DeskPolicy
    side_effects: []

  - method: POST
    path: "/approval-tiers"
    description: "Add one discount band to a policy's approval matrix"
    roles: [PlatformAdmin]
    code: 201
    input: [desk_policy_id, tier_level, min_discount_pct, max_discount_pct, required_role, sla_hours, max_delegation_levels]
    output: ApprovalTier
    side_effects: []

  - method: GET
    path: "/desk-policies/{id}/approval-tiers"
    description: "List the approval matrix rows of one policy, tier_level ASC"
    roles: [PlatformAdmin, DealDeskAnalyst, SalesRep, SalesDirector, VPSales, CFO, LegalCounsel, RevenueAccountant]
    code: 200
    input: ["limit?", "offset?"]
    output: ApprovalTier[]
    side_effects: []

  # ---- catalogue (configuration) ----
  - method: POST
    path: "/products"
    description: "Create a catalogue product"
    roles: [PlatformAdmin]
    code: 201
    input: [sku, name, product_type, list_unit_price_cents, unit_cost_cents, rev_rec_category, min_term_months]
    output: Product
    side_effects: []

  - method: GET
    path: "/products/{id}"
    description: "Read one product"
    roles: [PlatformAdmin, DealDeskAnalyst, SalesRep, SalesDirector, VPSales, CFO, LegalCounsel, RevenueAccountant]
    code: 200
    input: []
    output: Product
    side_effects: []

  - method: POST
    path: "/volume-tiers"
    description: "Add one quantity band to a product"
    roles: [PlatformAdmin]
    code: 201
    input: [product_id, tier_level, min_quantity, "max_quantity?", tier_discount_pct]
    output: VolumeTier
    side_effects: []

  - method: GET
    path: "/products/{id}/volume-tiers"
    description: "List a product's quantity bands, min_quantity ASC"
    roles: [PlatformAdmin, DealDeskAnalyst, SalesRep, SalesDirector, VPSales, CFO, LegalCounsel, RevenueAccountant]
    code: 200
    input: ["limit?", "offset?"]
    output: VolumeTier[]
    side_effects: []

  - method: POST
    path: "/bundle-rules"
    description: "Declare that one product discounts another when both are quoted"
    roles: [PlatformAdmin]
    code: 201
    input: [anchor_product_id, attached_product_id, bundle_discount_pct, min_attach_quantity_ratio]
    output: BundleRule
    side_effects: []

  - method: GET
    path: "/products/{id}/bundle-rules"
    description: "List every BundleRule whose anchor_product_id or attached_product_id is this product, created_at ASC"
    roles: [PlatformAdmin, DealDeskAnalyst, SalesRep, SalesDirector, VPSales, CFO, LegalCounsel, RevenueAccountant]
    code: 200
    input: ["limit?", "offset?"]
    output: BundleRule[]
    side_effects: []

  - method: GET
    path: "/products/{id}/quote-lines"
    description: "List every QuoteLine that references this product, created_at ASC"
    roles: [PlatformAdmin, DealDeskAnalyst, SalesRep, SalesDirector, VPSales, CFO, LegalCounsel, RevenueAccountant]
    code: 200
    input: ["limit?", "offset?"]
    output: QuoteLine[]
    side_effects: []

  - method: GET
    path: "/products/{id}/price-holds"
    description: "List every PRICE_HOLD_RENEWAL NonStandardTerm whose hold_product_id is this product, hold_start_date ASC"
    roles: [PlatformAdmin, DealDeskAnalyst, SalesRep, SalesDirector, VPSales, CFO, LegalCounsel, RevenueAccountant]
    code: 200
    input: ["limit?", "offset?"]
    output: NonStandardTerm[]
    side_effects: []

  # ---- accounts ----
  - method: POST
    path: "/accounts"
    description: "Create a customer account"
    roles: [PlatformAdmin, DealDeskAnalyst]
    code: 201
    input: [name, segment, region, "existing_arr_cents?"]
    output: Account
    side_effects: ["credit_status defaults to CLEAR, booked_arr_cents and exception_allowance_used_cents default to 0"]

  - method: GET
    path: "/accounts/{id}"
    description: "Read one account including its conserved ledger fields"
    roles: [PlatformAdmin, DealDeskAnalyst, SalesRep, SalesDirector, VPSales, CFO, LegalCounsel, RevenueAccountant]
    code: 200
    input: []
    output: Account
    side_effects: []

  - method: POST
    path: "/accounts/{id}/credit-decisions"
    description: "Record a credit posture decision on an account"
    roles: [PlatformAdmin, CFO]
    code: 200
    input: [credit_status, "credit_note?"]
    output: Account
    side_effects: ["sets Account.credit_status and credit_note; HOLD blocks POST /order-forms/{id}/book"]

  # ---- quotes and lines ----
  - method: POST
    path: "/quotes"
    description: "Create a DRAFT quote pinned to the ACTIVE desk policy"
    roles: [SalesRep]
    code: 201
    input: [account_id, title, term_months, "payment_terms_days?", "billing_frequency?"]
    output: Quote
    side_effects:
      - "sets owner_rep_user_id = X-User-ID and desk_policy_id = the DeskPolicy with status ACTIVE (ERR_NO_ACTIVE_DESK_POLICY when none exists)"
      - "sets expires_at per C5 from created_at"

  - method: PATCH
    path: "/quotes/{id}"
    description: "Edit a DRAFT quote's commercial header"
    roles: [SalesRep]
    code: 200
    input: ["title?", "term_months?", "payment_terms_days?", "billing_frequency?"]
    output: Quote
    side_effects:
      - "recomputes C1, C2, C3, C4, C6, C7 for every line and the quote header"
      - "increments Quote.version by 1"
      - "transitions every RevRecAssessment on this quote to STALE"

  - method: GET
    path: "/quotes/{id}"
    description: "Read one quote with all computed pricing and approval fields"
    roles: [PlatformAdmin, DealDeskAnalyst, SalesRep, SalesDirector, VPSales, CFO, LegalCounsel, RevenueAccountant]
    code: 200
    input: []
    output: Quote
    side_effects: []

  - method: GET
    path: "/quotes"
    description: "List quotes with filters and pagination, created_at ASC"
    roles: [PlatformAdmin, DealDeskAnalyst, SalesRep, SalesDirector, VPSales, CFO, LegalCounsel, RevenueAccountant]
    code: 200
    input: ["account_id?", "desk_policy_id?", "renegotiated_from_quote_id?", "status?", "limit?", "offset?"]
    output: Quote[]
    side_effects: []

  - method: POST
    path: "/quote-lines"
    description: "Add a product line to a DRAFT quote"
    roles: [SalesRep]
    code: 201
    input: [quote_id, product_id, quantity, "requested_discount_pct?"]
    output: QuoteLine
    side_effects:
      - "snapshots unit_list_price_cents, unit_cost_cents and rev_rec_category from the Product"
      - "recomputes C1 for every line of the quote (bundle attach ratios shift when a sibling line changes) and C2, C3, C4, C7 for the quote"
      - "increments Quote.version by 1"
      - "transitions every RevRecAssessment on this quote to STALE"

  - method: PATCH
    path: "/quote-lines/{id}"
    description: "Change a line's quantity or requested discount on a DRAFT quote"
    roles: [SalesRep]
    code: 200
    input: ["quantity?", "requested_discount_pct?"]
    output: QuoteLine
    side_effects:
      - "recomputes C1 for every line of the quote and C2, C3, C4, C7 for the quote"
      - "increments Quote.version by 1"
      - "transitions every RevRecAssessment on this quote to STALE"

  - method: DELETE
    path: "/quote-lines/{id}"
    description: "Remove a line from a DRAFT quote"
    roles: [SalesRep]
    code: 204
    input: []
    output: null
    side_effects:
      - "recomputes C1 for every remaining line and C2, C3, C4, C7 for the quote"
      - "increments Quote.version by 1"
      - "transitions every RevRecAssessment on this quote to STALE"

  - method: GET
    path: "/quotes/{id}/lines"
    description: "List a quote's lines, created_at ASC"
    roles: [PlatformAdmin, DealDeskAnalyst, SalesRep, SalesDirector, VPSales, CFO, LegalCounsel, RevenueAccountant]
    code: 200
    input: ["limit?", "offset?"]
    output: QuoteLine[]
    side_effects: []

  - method: GET
    path: "/quotes/{id}/pricing-preview"
    description: "Computed read: both C1/C2/C3/C4 variants side by side plus the C6 risk scores and the C7 allocation, without mutating the quote"
    roles: [PlatformAdmin, DealDeskAnalyst, SalesRep, SalesDirector, VPSales, CFO, LegalCounsel, RevenueAccountant]
    code: 200
    input: []
    output: "{ list_total_cents: integer, cost_total_cents: integer, provisional_net_total_cents: integer, final_net_total_cents: integer, provisional_blended_discount_pct: number, final_blended_discount_pct: number, provisional_margin_pct: number, final_margin_pct: number, volume_rebate_cents: integer, payment_terms_uplift_cents: integer, required_approval_level: integer, terms_risk_score_aggregate: number, terms_risk_score_dominant: number, arrangement_type: string, usage_excluded_cents: integer, allocable_amount_cents: integer, allocation_residual_cents: integer, margin_give_up_cents: integer, lines: object[] }"
    side_effects: []

  # ---- non-standard terms and legal review ----
  - method: POST
    path: "/nonstandard-terms"
    description: "Attach a non-standard commercial term to a DRAFT or CHANGES_REQUESTED quote"
    roles: [SalesRep]
    code: 201
    input: [quote_id, term_category, requested_numeric_value, "requested_text?", "hold_product_id?", "hold_start_date?", "hold_end_date?"]
    output: NonStandardTerm
    side_effects:
      - "computes C6 severity_factor and risk_contribution for the new term"
      - "recomputes Quote.terms_risk_score_aggregate, Quote.terms_risk_score_dominant and the requires_cfo_cosign flag across the quote's terms"
      - "increments Quote.version by 1"

  - method: GET
    path: "/quotes/{id}/nonstandard-terms"
    description: "List a quote's non-standard terms, created_at ASC"
    roles: [PlatformAdmin, DealDeskAnalyst, SalesRep, SalesDirector, VPSales, CFO, LegalCounsel, RevenueAccountant]
    code: 200
    input: ["limit?", "offset?"]
    output: NonStandardTerm[]
    side_effects: []

  - method: POST
    path: "/nonstandard-terms/{id}/review"
    description: "Legal decision on one term (APPROVE | REJECT), or the CFO co-signature (COSIGN) on the dominant term"
    roles: [LegalCounsel, CFO]
    code: 200
    input: [decision, "reviewer_note?"]
    output: NonStandardTerm
    side_effects:
      - "APPROVE: PENDING -> APPROVED and may clear the terms track, which may approve the ApprovalRequest and the Quote"
      - "REJECT: PENDING -> REJECTED, blocks the terms track, rejects the ApprovalRequest and the Quote, withdraws the quote's other PENDING terms and releases its ACCEPTED CompetitiveExceptions"
      - "COSIGN: sets cfo_cosigned_at and cfo_cosigned_by_user_id and may clear the terms track"

  # ---- competitive pricing exceptions ----
  - method: POST
    path: "/competitive-exceptions"
    description: "Document a competitive pricing exception against a quote below the margin floor"
    roles: [SalesRep]
    code: 201
    input: [quote_id, competitor_name, competitor_quoted_total_cents, evidence_reference, justification]
    output: CompetitiveException
    side_effects: ["sets documented_by_user_id = X-User-ID and status SUBMITTED; no allowance is consumed yet"]

  - method: GET
    path: "/quotes/{id}/competitive-exceptions"
    description: "List a quote's competitive exceptions, created_at ASC"
    roles: [PlatformAdmin, DealDeskAnalyst, SalesRep, SalesDirector, VPSales, CFO, LegalCounsel, RevenueAccountant]
    code: 200
    input: ["limit?", "offset?"]
    output: CompetitiveException[]
    side_effects: []

  - method: POST
    path: "/competitive-exceptions/{id}/decide"
    description: "Accept or reject a documented exception (decision: ACCEPT | REJECT)"
    roles: [DealDeskAnalyst, CFO]
    code: 200
    input: [decision, "decision_note?"]
    output: CompetitiveException
    side_effects:
      - "ACCEPT: sets allowance_consumed_cents from C4, increments Account.exception_allowance_used_cents, raises Quote.required_approval_level to max(matrix level, 3) and increments Quote.version by 1"
      - "REJECT: records the decision only"

  - method: POST
    path: "/competitive-exceptions/{id}/revoke"
    description: "Withdraw an accepted exception and return its allowance to the account pool"
    roles: [CFO]
    code: 200
    input: ["decision_note?"]
    output: CompetitiveException
    side_effects:
      - "ACCEPTED -> REVOKED with released_at"
      - "decrements Account.exception_allowance_used_cents by allowance_consumed_cents"
      - "recomputes Quote.required_approval_level without the exception floor and increments Quote.version by 1"

  # ---- revenue recognition ----
  - method: POST
    path: "/revrec-assessments"
    description: "Open a revenue recognition assessment on a quote and compute the C7 allocation"
    roles: [RevenueAccountant, DealDeskAnalyst]
    code: 201
    input: [quote_id]
    output: RevRecAssessment
    side_effects: ["computes C7 arrangement_type, usage_excluded_cents, allocable_amount_cents, allocation_lines and allocation_residual_cents; sets snapshot_quote_version = Quote.version and status ASSESSED"]

  - method: GET
    path: "/quotes/{id}/revrec-assessments"
    description: "List a quote's revenue recognition assessments, created_at ASC"
    roles: [PlatformAdmin, DealDeskAnalyst, SalesRep, SalesDirector, VPSales, CFO, LegalCounsel, RevenueAccountant]
    code: 200
    input: ["limit?", "offset?"]
    output: RevRecAssessment[]
    side_effects: []

  - method: POST
    path: "/revrec-assessments/{id}/assess"
    description: "Clear or block a revenue recognition assessment (decision: CLEAR | BLOCK)"
    roles: [RevenueAccountant]
    code: 200
    input: [decision, "assessment_note?"]
    output: RevRecAssessment
    side_effects:
      - "CLEAR: recomputes C7 against the current lines, sets status CLEARED and snapshot_quote_version = Quote.version"
      - "BLOCK: sets status BLOCKED; the quote can no longer pass the submit gate"

  # ---- approval workflow ----
  - method: POST
    path: "/quotes/{id}/submit"
    description: "Submit a DRAFT quote for approval; opens the ApprovalRequest and forks the discount and terms tracks"
    roles: [SalesRep]
    code: 200
    input: []
    output: Quote
    side_effects:
      - "recomputes C1, C2, C3, C4, C6, C7 and pins pinned_policy_version"
      - "creates one ApprovalRequest and, when the discount track is required, its level-1 ApprovalStep with C5 service-level fields"
      - "auto-approves every PENDING NonStandardTerm when terms_risk_score_aggregate is below DeskPolicy.terms_review_risk_threshold"
      - "may approve the quote in the same request when both tracks resolve without human action"
      - "increments Quote.version by 1"

  - method: GET
    path: "/quotes/{id}/approval-requests"
    description: "List a quote's approval requests, created_at ASC (one per submit cycle)"
    roles: [PlatformAdmin, DealDeskAnalyst, SalesRep, SalesDirector, VPSales, CFO, LegalCounsel, RevenueAccountant]
    code: 200
    input: ["limit?", "offset?"]
    output: ApprovalRequest[]
    side_effects: []

  - method: GET
    path: "/approval-steps"
    description: "List approval steps with filters and pagination, created_at ASC"
    roles: [PlatformAdmin, DealDeskAnalyst, SalesRep, SalesDirector, VPSales, CFO, LegalCounsel, RevenueAccountant]
    code: 200
    input: ["approval_request_id?", "delegation_grant_id?", "decision?", "limit?", "offset?"]
    output: ApprovalStep[]
    side_effects: []

  - method: GET
    path: "/approval-steps/{id}"
    description: "Read one approval step including its C5 service-level fields"
    roles: [PlatformAdmin, DealDeskAnalyst, SalesRep, SalesDirector, VPSales, CFO, LegalCounsel, RevenueAccountant]
    code: 200
    input: []
    output: ApprovalStep
    side_effects: []

  - method: POST
    path: "/approval-steps/{id}/decide"
    description: "Decide an approval step (decision: APPROVE | REJECT | REQUEST_CHANGES), optionally under a delegation"
    roles: [DealDeskAnalyst, SalesDirector, VPSales, CFO]
    code: 200
    input: [decision, "decision_note?"]
    output: ApprovalStep
    side_effects:
      - "records acting_user_id, decided_at and C5 turnaround_hours"
      - "APPROVE below required_level: creates the next level's ApprovalStep and advances ApprovalRequest.current_level"
      - "APPROVE at required_level: clears the discount track and may approve the ApprovalRequest and the Quote"
      - "REJECT: blocks the discount track, rejects the ApprovalRequest and the Quote, withdraws PENDING terms and releases ACCEPTED exceptions"
      - "REQUEST_CHANGES: moves the ApprovalRequest and the Quote to CHANGES_REQUESTED"
      - "sets delegation_grant_id and increments DelegationGrant.used_step_count when acting under a delegation"

  - method: POST
    path: "/quotes/{id}/reopen"
    description: "Return a CHANGES_REQUESTED quote to DRAFT for another negotiation round"
    roles: [SalesRep]
    code: 200
    input: []
    output: Quote
    side_effects:
      - "increments revision_count and increments Quote.version by 1"
      - "cancels the ApprovalRequest, voids its PENDING steps, reverts APPROVED NonStandardTerms to PENDING and marks every RevRecAssessment STALE"

  - method: POST
    path: "/quotes/{id}/renegotiate"
    description: "Clone a quote into a fresh DRAFT for renegotiation; the clone supersedes any earlier DRAFT clone of the same source"
    roles: [SalesRep]
    code: 201
    input: [expected_quote_version, "term_months?", "payment_terms_days?", "billing_frequency?"]
    output: Quote
    side_effects:
      - "creates a new Quote with renegotiated_from_quote_id = the source quote id, status DRAFT, copies of every QuoteLine, and expires_at per C5 from the clone's created_at"
      - "increments the source Quote.renegotiation_count and increments the source Quote.version by 1"
      - "transitions any earlier DRAFT clone of the same source quote to SUPERSEDED"
      - "rejects the call with ERR_STALE_QUOTE_VERSION (412) when expected_quote_version != the source Quote.version"

  # ---- delegation of authority ----
  - method: POST
    path: "/delegation-grants"
    description: "Delegate one approval tier to another user for a bounded window"
    roles: [SalesDirector, VPSales, CFO]
    code: 201
    input: [grantee_user_id, tier_level, max_discount_pct, starts_at, ends_at]
    output: DelegationGrant
    side_effects: ["sets grantor_user_id = X-User-ID and status ACTIVE; rejects windows that overlap an ACTIVE grant for the same (grantor_user_id, tier_level)"]

  - method: GET
    path: "/delegation-grants"
    description: "List delegation grants with filters and pagination, starts_at ASC"
    roles: [PlatformAdmin, DealDeskAnalyst, SalesRep, SalesDirector, VPSales, CFO, LegalCounsel, RevenueAccountant]
    code: 200
    input: ["grantee_user_id?", "tier_level?", "status?", "limit?", "offset?"]
    output: DelegationGrant[]
    side_effects: []

  - method: POST
    path: "/delegation-grants/{id}/revoke"
    description: "Revoke an active delegation; only the grantor may revoke"
    roles: [SalesDirector, VPSales, CFO]
    code: 200
    input: []
    output: DelegationGrant
    side_effects: ["ACTIVE -> REVOKED with revoked_at; already-decided steps keep their delegation_grant_id"]

  # ---- order form, signature routing and booking ----
  - method: POST
    path: "/order-forms"
    description: "Generate an order form from an APPROVED quote; supersedes any prior unsigned form"
    roles: [SalesRep]
    code: 201
    input: [quote_id, signer_name, signer_email, expected_quote_version]
    output: OrderForm
    side_effects:
      - "increments Quote.version by 1, then sets generated_from_quote_version = the incremented Quote.version and status GENERATED (a freshly generated form therefore matches the quote exactly; any later Quote write invalidates it for booking)"
      - "voids every existing OrderForm of the quote whose status is GENERATED or OUT_FOR_SIGNATURE with void_reason SUPERSEDED_BY_NEW_ORDER_FORM"
      - "rejects the call with ERR_STALE_QUOTE_VERSION (412) when expected_quote_version != the Quote.version observed before the bump"

  - method: GET
    path: "/order-forms/{id}"
    description: "Read one order form including its booking ledger fields"
    roles: [PlatformAdmin, DealDeskAnalyst, SalesRep, SalesDirector, VPSales, CFO, LegalCounsel, RevenueAccountant]
    code: 200
    input: []
    output: OrderForm
    side_effects: []

  - method: GET
    path: "/quotes/{id}/order-forms"
    description: "List a quote's order forms, created_at ASC"
    roles: [PlatformAdmin, DealDeskAnalyst, SalesRep, SalesDirector, VPSales, CFO, LegalCounsel, RevenueAccountant]
    code: 200
    input: ["limit?", "offset?"]
    output: OrderForm[]
    side_effects: []

  - method: POST
    path: "/order-forms/{id}/send"
    description: "Route a generated order form to the signer"
    roles: [SalesRep]
    code: 200
    input: []
    output: OrderForm
    side_effects: ["GENERATED -> OUT_FOR_SIGNATURE with sent_at"]

  - method: POST
    path: "/order-forms/{id}/signature"
    description: "Record the signature outcome (outcome: SIGNED | DECLINED)"
    roles: [DealDeskAnalyst]
    code: 200
    input: [outcome, "signed_by_name?"]
    output: OrderForm
    side_effects:
      - "SIGNED: OUT_FOR_SIGNATURE -> SIGNED with signed_at and signed_by_name"
      - "DECLINED: OUT_FOR_SIGNATURE -> DECLINED with declined_at; the quote stays APPROVED and no ledger field moves"

  - method: POST
    path: "/order-forms/{id}/book"
    description: "Validate the order acceptance criteria and book the deal"
    roles: [DealDeskAnalyst]
    code: 200
    input: []
    output: OrderForm
    side_effects:
      - "SIGNED -> BOOKED with booked_at and the C8 booked_arr_cents / booked_tcv_cents"
      - "increments Account.booked_arr_cents by the form's booked_arr_cents"
      - "transitions the Quote APPROVED -> BOOKED and copies the booking values"

  - method: POST
    path: "/order-forms/{id}/reverse-booking"
    description: "Reverse a booking, unwinding the account ledger"
    roles: [CFO]
    code: 200
    input: [reversal_reason]
    output: OrderForm
    side_effects:
      - "BOOKED -> VOID with booking_reversed_at, voided_at, reversal_reason and booking_reversal_count + 1"
      - "decrements Account.booked_arr_cents by the form's booked_arr_cents"
      - "transitions the Quote BOOKED -> APPROVED and resets its booking values to 0"

  # ---- sweeps and test-driving surface ----
  - method: POST
    path: "/expiry-sweeps"
    description: "Expire every quote past its expires_at and every delegation grant past its ends_at, in created_at ASC order"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: "{ swept_at: string, expired_quote_ids: string[], expired_delegation_grant_ids: string[], voided_order_form_ids: string[], released_exception_ids: string[] }"
    side_effects:
      - "Quote DRAFT | PENDING_APPROVAL | APPROVED -> EXPIRED with every cascade declared in §1.2"
      - "DelegationGrant ACTIVE -> EXPIRED when the clock has reached ends_at"

  - method: POST
    path: "/sla-escalation-sweeps"
    description: "Escalate every PENDING approval step whose service-level deadline has passed, in created_at ASC order"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: "{ swept_at: string, escalated_step_ids: string[], created_step_ids: string[], breached_request_ids: string[] }"
    side_effects:
      - "ApprovalStep PENDING -> ESCALATED and a replacement step at the escalation target level"
      - "increments ApprovalRequest.escalation_count, sets sla_state BREACHED, may set at_backstop"

  - method: POST
    path: "/_clock/set_current_utc"
    description: "Test-driving endpoint: set the server's logical clock. Before any call to this endpoint the logical clock reads exactly 2026-08-01T00:00:00Z and never falls back to real wall-clock time."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["every later C5 evaluation, expiry check and service-level check reads the new instant"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  # -- authentication and authorization --
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "X-User-Role or X-User-ID header missing or empty" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "X-User-Role is not listed in the endpoint's roles" }
  - { id: ERR_NOT_QUOTE_OWNER, http: 403, condition: "X-User-ID != Quote.owner_rep_user_id on a quote-owner operation" }
  - { id: ERR_NOT_GRANT_GRANTOR, http: 403, condition: "X-User-ID != DelegationGrant.grantor_user_id on POST /delegation-grants/{id}/revoke" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "the acting X-User-ID owns the quote whose ApprovalStep it is deciding, or documented the CompetitiveException it is deciding" }
  - { id: ERR_APPROVER_ROLE_MISMATCH, http: 403, condition: "X-User-Role != ApprovalStep.assigned_role and the acting user holds no DelegationGrant for that tier_level" }

  # -- not found --
  - { id: ERR_DESK_POLICY_NOT_FOUND, http: 404, condition: "no DeskPolicy with the given id" }
  - { id: ERR_PRODUCT_NOT_FOUND, http: 404, condition: "no Product with the given id (path, product_id, anchor_product_id, attached_product_id or hold_product_id)" }
  - { id: ERR_ACCOUNT_NOT_FOUND, http: 404, condition: "no Account with the given id" }
  - { id: ERR_QUOTE_NOT_FOUND, http: 404, condition: "no Quote with the given id" }
  - { id: ERR_QUOTE_LINE_NOT_FOUND, http: 404, condition: "no QuoteLine with the given id" }
  - { id: ERR_TERM_NOT_FOUND, http: 404, condition: "no NonStandardTerm with the given id" }
  - { id: ERR_EXCEPTION_NOT_FOUND, http: 404, condition: "no CompetitiveException with the given id" }
  - { id: ERR_REVREC_NOT_FOUND, http: 404, condition: "no RevRecAssessment with the given id" }
  - { id: ERR_APPROVAL_STEP_NOT_FOUND, http: 404, condition: "no ApprovalStep with the given id" }
  - { id: ERR_DELEGATION_NOT_FOUND, http: 404, condition: "no DelegationGrant with the given id" }
  - { id: ERR_ORDER_FORM_NOT_FOUND, http: 404, condition: "no OrderForm with the given id" }

  # -- request shape --
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "missing required field, unknown field, wrong type, undeclared enum member, out-of-range number, hold_start_date > hold_end_date, or starts_at >= ends_at" }

  # -- configuration integrity --
  - { id: ERR_DUPLICATE_PRODUCT_SKU, http: 409, condition: "a Product with the same sku already exists" }
  - { id: ERR_APPROVAL_TIER_OVERLAP, http: 409, condition: "the new ApprovalTier's discount band overlaps an existing band of the same policy, or its tier_level is already used" }
  - { id: ERR_VOLUME_TIER_OVERLAP, http: 409, condition: "the new VolumeTier's quantity band overlaps an existing band of the same product, its tier_level is already used, or a second unbounded band is added" }
  - { id: ERR_DUPLICATE_BUNDLE_RULE, http: 409, condition: "a BundleRule with the same (anchor_product_id, attached_product_id) exists, or anchor and attached are the same product" }
  - { id: ERR_APPROVAL_TIER_COVERAGE_INVALID, http: 422, condition: "on POST /desk-policies/{id}/activate the policy's ApprovalTier bands do not cover [0.0, 1.0] contiguously" }

  # -- state preconditions --
  - { id: ERR_DESK_POLICY_NOT_DRAFT, http: 409, condition: "activation attempted on a DeskPolicy whose status is not DRAFT" }
  - { id: ERR_QUOTE_NOT_DRAFT, http: 409, condition: "a DRAFT-only operation (line write, header patch, term creation, exception decision, revrec assessment, submit) attempted on a quote in another status" }
  - { id: ERR_QUOTE_NOT_PENDING_APPROVAL, http: 409, condition: "a step decision or term review attempted while the quote is not PENDING_APPROVAL" }
  - { id: ERR_QUOTE_NOT_APPROVED, http: 409, condition: "an order-form send, signature or booking attempted while the quote is not APPROVED" }
  - { id: ERR_QUOTE_NOT_CHANGES_REQUESTED, http: 409, condition: "POST /quotes/{id}/reopen attempted on a quote that is not CHANGES_REQUESTED" }
  - { id: ERR_QUOTE_STATE_INVALID_FOR_REVOKE, http: 409, condition: "exception revocation attempted while the quote is not in DRAFT, CHANGES_REQUESTED or PENDING_APPROVAL" }
  - { id: ERR_STEP_ALREADY_DECIDED, http: 409, condition: "the ApprovalStep's decision is not PENDING" }
  - { id: ERR_TERM_ALREADY_REVIEWED, http: 409, condition: "an APPROVE or REJECT review attempted on a term whose review_state is not PENDING" }
  - { id: ERR_TERM_NOT_LEGAL_APPROVED, http: 409, condition: "a COSIGN decision attempted on a term whose review_state is not APPROVED" }
  - { id: ERR_EXCEPTION_STATE_INVALID, http: 409, condition: "a decide call on a non-SUBMITTED exception, or a revoke call on a non-ACCEPTED exception" }
  - { id: ERR_REVREC_STATE_INVALID, http: 409, condition: "an assess call on an assessment whose status is neither ASSESSED nor STALE" }
  - { id: ERR_ORDER_FORM_STATE_INVALID, http: 409, condition: "send, signature, book or reverse-booking attempted from a status that does not declare that transition" }
  - { id: ERR_DELEGATION_STATE_INVALID, http: 409, condition: "revocation attempted on a DelegationGrant whose status is not ACTIVE" }

  # -- optimistic concurrency --
  - { id: ERR_STALE_QUOTE_VERSION, http: 412, condition: "expected_quote_version does not equal the current Quote.version on POST /quotes/{id}/renegotiate or POST /order-forms" }

  # -- legal review and co-signature gating --
  - { id: ERR_LEGAL_REVIEW_NOT_REQUIRED, http: 409, condition: "a term review attempted while the quote's ApprovalRequest.terms_track_state is not PENDING_LEGAL" }
  - { id: ERR_TERM_COSIGN_NOT_REQUIRED, http: 409, condition: "a COSIGN decision attempted on a term whose requires_cfo_cosign is false" }
  - { id: ERR_TERM_ALREADY_COSIGNED, http: 409, condition: "a COSIGN decision attempted on a term whose cfo_cosigned_at is already set" }

  # -- delegation of authority --
  - { id: ERR_DELEGATION_NOT_ACTIVE, http: 409, condition: "the DelegationGrant relied on is REVOKED or EXPIRED, or the logical clock is outside [starts_at, ends_at)" }
  - { id: ERR_DELEGATION_LEVEL_NOT_DELEGABLE, http: 422, condition: "the ApprovalTier for the step's level declares max_delegation_levels == 0" }
  - { id: ERR_DELEGATION_SCOPE_EXCEEDED, http: 422, condition: "Quote.final_blended_discount_pct exceeds the DelegationGrant.max_discount_pct being relied on" }
  - { id: ERR_DELEGATION_WINDOW_OVERLAP, http: 409, condition: "the new grant's [starts_at, ends_at) window overlaps an ACTIVE grant with the same (grantor_user_id, tier_level)" }

  # -- temporal --
  - { id: ERR_QUOTE_EXPIRED, http: 409, condition: "the logical clock is past Quote.expires_at on an operation that requires a live quote" }
  - { id: ERR_PRICE_HOLD_WINDOW_CONFLICT, http: 409, condition: "the requested price-hold window is within DeskPolicy.price_hold_cooldown_days of another PENDING or APPROVED hold on the same (account, product)" }

  # -- structural submit gates --
  - { id: ERR_QUOTE_HAS_NO_LINES, http: 422, condition: "submit attempted on a quote with zero QuoteLine rows" }
  - { id: ERR_DESK_POLICY_SUPERSEDED, http: 422, condition: "submit attempted while the quote's pinned DeskPolicy status is SUPERSEDED" }
  - { id: ERR_TERM_BELOW_PRODUCT_MINIMUM, http: 422, condition: "Quote.term_months is below the largest Product.min_term_months among the quote's lines" }
  - { id: ERR_NONSTANDARD_TERM_REQUIRED, http: 422, condition: "payment_terms_days exceeds the policy standard but no matching PAYMENT_TERMS NonStandardTerm with review_state PENDING or APPROVED exists" }
  - { id: ERR_REVREC_NOT_CLEARED, http: 422, condition: "arrangement_type is MULTI_ELEMENT or USAGE_BASED_HYBRID and no RevRecAssessment with status CLEARED exists" }

  # -- fiscal --
  - { id: ERR_NO_ACTIVE_DESK_POLICY, http: 422, condition: "POST /quotes with no DeskPolicy in status ACTIVE" }
  - { id: ERR_DISCOUNT_STACK_EXCEEDED, http: 422, condition: "requested_discount_pct on a line write exceeds DeskPolicy.max_stack_discount_pct" }
  - { id: ERR_MARGIN_FLOOR_BREACH, http: 422, condition: "final_margin_pct is below DeskPolicy.margin_floor_pct at submit and no ACCEPTED CompetitiveException exists" }
  - { id: ERR_ABSOLUTE_MARGIN_FLOOR_BREACH, http: 422, condition: "final_margin_pct is below DeskPolicy.absolute_margin_floor_pct at submit, or an exception acceptance would sit below it" }
  - { id: ERR_EXCEPTION_NOT_NEEDED, http: 422, condition: "exception acceptance attempted while final_margin_pct is already at or above DeskPolicy.margin_floor_pct" }
  - { id: ERR_EXCEPTION_ALLOWANCE_EXHAUSTED, http: 422, condition: "accepting the exception would push Account.exception_allowance_used_cents past DeskPolicy.exception_allowance_cents" }

  # -- booking --
  - { id: ERR_ACCOUNT_CREDIT_HOLD, http: 409, condition: "booking attempted while Account.credit_status == HOLD" }
  - { id: ERR_BOOKING_CRITERIA_UNMET, http: 422, condition: "the order form was generated from a stale quote version, the quote needs policy revalidation, a required RevRecAssessment is not CLEARED, or booked_tcv_cents would be 0" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: SalesRep
    description: "Owns quote construction: builds the configuration, documents exceptions, submits for approval, renegotiates and papers the deal"
    identity: opaque
    exclusive_operations:
      - "POST /quotes"
      - "PATCH /quotes/{id}"
      - "POST /quote-lines"
      - "PATCH /quote-lines/{id}"
      - "DELETE /quote-lines/{id}"
      - "POST /nonstandard-terms"
      - "POST /competitive-exceptions"
      - "POST /quotes/{id}/submit"
      - "POST /quotes/{id}/reopen"
      - "POST /quotes/{id}/renegotiate"
      - "POST /order-forms"
      - "POST /order-forms/{id}/send"
    shared_operations: ["every GET endpoint"]

  - name: DealDeskAnalyst
    description: "Level-1 approver; also runs signature and booking operations and may open revenue assessments"
    identity: opaque
    exclusive_operations:
      - "POST /order-forms/{id}/signature"
      - "POST /order-forms/{id}/book"
    shared_operations:
      - "POST /approval-steps/{id}/decide (with SalesDirector, VPSales, CFO)"
      - "POST /competitive-exceptions/{id}/decide (with CFO)"
      - "POST /accounts (with PlatformAdmin)"
      - "POST /revrec-assessments (with RevenueAccountant)"
      - "every GET endpoint"

  - name: SalesDirector
    description: "Level-2 approver; may delegate its tier to another user for a bounded window"
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "POST /approval-steps/{id}/decide (with DealDeskAnalyst, VPSales, CFO)"
      - "POST /delegation-grants (with VPSales, CFO)"
      - "POST /delegation-grants/{id}/revoke (with VPSales, CFO)"
      - "every GET endpoint"

  - name: VPSales
    description: "Level-3 approver; may delegate its tier"
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "POST /approval-steps/{id}/decide (with DealDeskAnalyst, SalesDirector, CFO)"
      - "POST /delegation-grants (with SalesDirector, CFO)"
      - "POST /delegation-grants/{id}/revoke (with SalesDirector, VPSales)"
      - "every GET endpoint"

  - name: CFO
    description: "Level-4 backstop approver, co-signer of the dominant non-standard term, exception revoker and booking reverser"
    identity: opaque
    exclusive_operations:
      - "POST /competitive-exceptions/{id}/revoke"
      - "POST /order-forms/{id}/reverse-booking"
    shared_operations:
      - "POST /approval-steps/{id}/decide (with DealDeskAnalyst, SalesDirector, VPSales)"
      - "POST /nonstandard-terms/{id}/review (with LegalCounsel; only the COSIGN decision)"
      - "POST /competitive-exceptions/{id}/decide (with DealDeskAnalyst)"
      - "POST /accounts/{id}/credit-decisions (with PlatformAdmin)"
      - "POST /delegation-grants (with SalesDirector, VPSales)"
      - "POST /delegation-grants/{id}/revoke (with SalesDirector, VPSales)"
      - "every GET endpoint"

  - name: LegalCounsel
    description: "Reviews non-standard terms; owns the terms track of the approval fork"
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "POST /nonstandard-terms/{id}/review (with CFO; owns the APPROVE and REJECT decisions)"
      - "every GET endpoint"

  - name: RevenueAccountant
    description: "Clears or blocks the revenue recognition assessment for multi-element and usage-based arrangements"
    identity: opaque
    exclusive_operations:
      - "POST /revrec-assessments/{id}/assess"
    shared_operations:
      - "POST /revrec-assessments (with DealDeskAnalyst)"
      - "every GET endpoint"

  - name: PlatformAdmin
    description: "Operates the configuration surface, the sweeps and the logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /desk-policies"
      - "POST /desk-policies/{id}/activate"
      - "POST /approval-tiers"
      - "POST /products"
      - "POST /volume-tiers"
      - "POST /bundle-rules"
      - "POST /expiry-sweeps"
      - "POST /sla-escalation-sweeps"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "POST /accounts (with DealDeskAnalyst)"
      - "POST /accounts/{id}/credit-decisions (with CFO)"
      - "every GET endpoint"
