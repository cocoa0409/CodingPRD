              captures: { total: $.meta.total_count }
          assert:
            - "GET /bonds?importer_id=${imp_id} returns an array containing exactly ${bond_id}"
            - "pagination total_count == 1"

      - name: deny_psc_has_no_fiscal_effect
        claim_type: Conditional action
        grounds:
          - endpoints.POST_/post-summary-corrections/{id}/deny
          - state_machines.PostSummaryCorrection.SUBMITTED_to_DENIED
          - entities.PostSummaryCorrection.fields.adjustment_cents
          - entities.CustomsEntry.fields.final_total_cents
        distinguishing_aspect: "Denying a SUBMITTED PSC sets adjustment_cents=0, status=DENIED, and leaves the entry's final_total_cents unchanged at 54800 (no bond/statement reconciliation)."
        test_recipe:
          setup:
            - "A LIQUIDATED general entry (final 54800) with a SUBMITTED PSC delta +200000."
            - "Clock 2026-06-05; bond high limit."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-05T00:00:00Z" }
              as: AccountAdmin
            - call: "POST /importers"
              payload: { name: "Acme Imports", ior_number: "IOR-CORNER-EP03", owner_user_id: "imp-user-1" }
              as: AccountAdmin
              captures: { imp_id: $.data.id }
            - call: "POST /bonds"
              payload: { importer_id: "${imp_id}", bond_type: "CONTINUOUS", limit_cents: 100000000 }
              as: AccountAdmin
              captures: { bond_id: $.data.id }
            - call: "POST /bonds/${bond_id}/activate"
              payload: {}
              as: AccountAdmin
            - call: "POST /isf-filings"
              payload: { importer_id: "${imp_id}", bill_of_lading: "BOL-CORNER-EP03", vessel_eta: "2026-06-10T00:00:00Z", data_element_count: 10 }
              as: LicensedBroker
              captures: { isf_id: $.data.id }
            - call: "POST /isf-filings/${isf_id}/file"
              payload: {}
              as: LicensedBroker
            - call: "POST /entries"
              payload: { importer_id: "${imp_id}", bond_id: "${bond_id}", isf_filing_id: "${isf_id}", entry_type: "CONSUMPTION_01", country_of_origin: "CN", entry_date: "2026-06-10T00:00:00Z" }
              as: LicensedBroker
              captures: { entry_id: $.data.id }
            - call: "POST /entries/${entry_id}/lines"
              payload: { hts_code: "9403600080", customs_value_cents: 1000000, quantity: 1 }
              as: LicensedBroker
            - call: "POST /entries/${entry_id}/file"
              payload: {}
              as: LicensedBroker
            - call: "POST /entries/${entry_id}/review"
              payload: { action: "RELEASE" }
              as: CBPOfficer
              as_user_id: "officer-1"
            - call: "POST /entries/${entry_id}/liquidate"
              payload: {}
              as: CBPOfficer
              as_user_id: "officer-1"
              captures: { entry_v: $.data.version }
            - call: "POST /post-summary-corrections"
              payload: { entry_id: "${entry_id}", filing_kind: "PSC", corrected_value_delta_cents: 200000, expected_entry_version: "${entry_v}" }
              as: LicensedBroker
              captures: { psc_id: $.data.id }
          trigger:
            - call: "POST /post-summary-corrections/${psc_id}/deny"
              payload: {}
              as: CBPOfficer
              as_user_id: "officer-1"
              captures: { adj: $.data.adjustment_cents, st: $.data.status }
          assert:
            - "PostSummaryCorrection.${psc_id}.status == DENIED"
            - "PostSummaryCorrection.${psc_id}.adjustment_cents == 0"
            - "CustomsEntry.${entry_id}.final_total_cents == 54800 (unchanged)"

