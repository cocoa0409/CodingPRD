              as: SiteOps
              captures: { site_id: $.data.id }
            - call: "POST /mfc/products"
              payload: { sku: "SKU-BEER-A", name: "Lager 6-pack", price_cents: 99, product_class: "AGE_RESTRICTED" }
              as: SiteOps
              captures: { prod_beer_a: $.data.id }
            - call: "POST /mfc/customers"
              payload: { email: "ada@example.com", full_name: "Ada Adult", date_of_birth: "1990-01-01T00:00:00Z" }
              as: Customer
              captures: { cust_id: $.data.id }
            - call: "POST /mfc/inventory-balances"
              payload: { site_id: "${site_id}", product_id: "${prod_beer_a}", min_par_level: 0 }
              as: SiteOps
              captures: { bal_beer: $.data.id }
            - call: "POST /mfc/inventory-balances/${bal_beer}/adjustments"
              payload: { kind: "RECEIPT", qty: 10, reason: "opening" }
              as: SiteOps
            - call: "POST /mfc/pickers"
              payload: { site_id: "${site_id}", name: "Pat Picker" }
              as: SiteOps
              captures: { picker_1: $.data.id }
            - call: "POST /mfc/pickers"
              payload: { site_id: "${site_id}", name: "Sam Sealer" }
              as: SiteOps
              captures: { picker_2: $.data.id }
            - call: "POST /mfc/drivers"
              payload: { site_id: "${site_id}", name: "Dee Driver", max_run_orders: 4 }
              as: SiteOps
              captures: { driver_1: $.data.id }
            - call: "POST /mfc/orders"
              payload: { customer_id: "${cust_id}", site_id: "${site_id}", lines: [ { product_id: "${prod_beer_a}", qty: 1 } ], delivery_distance_miles: 1.0 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { order_ar: $.data.id }
            - call: "POST /mfc/pick-batches"
              payload: { site_id: "${site_id}", picker_id: "${picker_1}" }
              as: SiteOps
              captures: { batch_ar: $.data.id }
            - call: "POST /mfc/pick-batches/${batch_ar}/orders"
              payload: { order_id: "${order_ar}" }
              as: Picker
              as_user_id: "${picker_1}"
            - call: "POST /mfc/pick-batches/${batch_ar}/seal"
              payload: {}
              as: Picker
              as_user_id: "${picker_2}"
            - call: "POST /mfc/delivery-bags"
              payload: { order_id: "${order_ar}" }
              as: SiteOps
              captures: { bag_ar: $.data.id }
            - call: "POST /mfc/delivery-bags/${bag_ar}/assign"
              payload: {}
              as: SiteOps
          trigger:
            - call: "POST /mfc/delivery-bags/${bag_ar}/fail-handoff"
              payload: {}
              as: Driver
              as_user_id: "${driver_1}"
              captures: { err_nofail: $.data.error_id }
            - call: "POST /mfc/delivery-bags/${bag_ar}/handoff-scan"
              payload: { scanned_birthdate: "2010-01-01", scanned_id_last4: "9999" }
              as: Driver
              as_user_id: "${driver_1}"
              captures: { hs2: $.data.handoff_status }
            - call: "POST /mfc/delivery-bags/${bag_ar}/fail-handoff"
              payload: {}
              as: Driver
              as_user_id: "${driver_1}"
          assert:
            - "First fail-handoff returns 409 and error_id == ERR_REFUSAL_REQUIRED (order state alone is not sufficient)"
            - "The under-age scan moves handoff_status to REFUSED (cross-entity gate now satisfied)"
            - "Second fail-handoff succeeds: Order.${order_ar}.status == HANDOFF_FAILED and bag delivery_status == FAILED"

  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: expiry_horizon_semi_open_boundary
        grounds:
          - calculations.lot_expiry_status
          - entities.Site.fields.expiry_horizon_days
          - entities.StockLot.fields.status
        distinguishing_aspect: |
          Interval semantics: semi-open future-distance window on StockLot
          expiry. With horizon 2 days and clock at 2026-09-10T14:00:00Z, a lot
          expiring exactly at 2026-09-12T14:00:00Z is EXPIRING (inclusive far
          edge — blocked from picking), one expiring one second later is FRESH,
          and one expiring exactly AT the clock is EXPIRED (write-off eligible).
        test_recipe:
          setup:
            - "Logical clock 2026-09-10T14:00:00Z. Site SITE-A (horizon 2). PERISHABLE SKU-MILK with three lots received via replenish finalize: EDGE expiring 2026-09-12T14:00:00Z (qty 2), SAFE expiring 2026-09-12T14:00:01Z (qty 2), DEAD expiring 2026-09-10T14:00:00Z (qty 1)."
          setup_api_calls:
            - call: "POST /mfc/_clock/set_current_utc"
              payload: { current_utc: "2026-09-10T14:00:00Z" }
              as: SiteOps
            - call: "POST /mfc/sites"
              payload: { code: "SITE-A", name: "Downtown MFC", delivery_radius_miles: 5.0, fee_schedule: { base_cents: 199, per_mile_cents: 99, included_miles: 1.5, peak_surcharge_cents: 150, min_fee_cents: 99, max_fee_cents: 999 }, fee_waiver_threshold_cents: 3000, batch_max_lines: 2, batch_max_items: 20, expiry_horizon_days: 2 }
              as: SiteOps
              captures: { site_id: $.data.id }
            - call: "POST /mfc/products"
              payload: { sku: "SKU-MILK", name: "Whole Milk 1L", price_cents: 350, product_class: "PERISHABLE" }
              as: SiteOps
              captures: { prod_milk: $.data.id }
            - call: "POST /mfc/inventory-balances"
              payload: { site_id: "${site_id}", product_id: "${prod_milk}", min_par_level: 0 }
              as: SiteOps
              captures: { bal_milk: $.data.id }
            - &ro_edge
              call: "POST /mfc/replenish-orders"
              payload: { site_id: "${site_id}", reference: "PO-EDGE", lines: [ { product_id: "${prod_milk}", qty: 2, unit_cost_cents: 180 } ], expected_at: "2026-09-10T08:00:00Z", idempotency_key: "po-edge-key" }
              as: SiteOps
              captures: { ro_edge: $.data.id }
            - call: "POST /mfc/replenish-orders/${ro_edge}/place"
              payload: {}
              as: SiteOps
            - call: "POST /mfc/replenish-orders/${ro_edge}/finalize"
              payload: { lot_expiries: { "${prod_milk}": "2026-09-12T14:00:00Z" } }
              as: SiteOps
            - &ro_safe
              call: "POST /mfc/replenish-orders"
              payload: { site_id: "${site_id}", reference: "PO-SAFE", lines: [ { product_id: "${prod_milk}", qty: 2, unit_cost_cents: 180 } ], expected_at: "2026-09-10T08:30:00Z", idempotency_key: "po-safe-key" }
              as: SiteOps
              captures: { ro_safe: $.data.id }
            - call: "POST /mfc/replenish-orders/${ro_safe}/place"
              payload: {}
              as: SiteOps
            - call: "POST /mfc/replenish-orders/${ro_safe}/finalize"
              payload: { lot_expiries: { "${prod_milk}": "2026-09-12T14:00:01Z" } }
              as: SiteOps
            - &ro_dead
              call: "POST /mfc/replenish-orders"
              payload: { site_id: "${site_id}", reference: "PO-DEAD", lines: [ { product_id: "${prod_milk}", qty: 1, unit_cost_cents: 180 } ], expected_at: "2026-09-10T09:00:00Z", idempotency_key: "po-dead-key" }
              as: SiteOps
              captures: { ro_dead: $.data.id }
            - call: "POST /mfc/replenish-orders/${ro_dead}/place"
              payload: {}
              as: SiteOps
            - call: "POST /mfc/replenish-orders/${ro_dead}/finalize"
              payload: { lot_expiries: { "${prod_milk}": "2026-09-10T14:00:00Z" } }
              as: SiteOps
          trigger:
            - call: "GET /mfc/stock-lots"
              payload: {}
              as: SiteOps
              captures: { s0: "$.data[0].status", s1: "$.data[1].status", s2: "$.data[2].status" }
          assert:
            - "The EDGE lot (expires exactly at horizon end) reads status == EXPIRING — the far edge is inclusive"
            - "The SAFE lot (one second beyond) reads status == FRESH"
            - "The DEAD lot (expires exactly at the clock) reads status == EXPIRED — expires_at <= now"

      - name: batch_line_and_item_cap_combined_pressure
        grounds:
          - calculations.batch_capacity_check
          - entities.Site.fields.batch_max_items
        distinguishing_aspect: |
          Different interval/capacity semantics on a different resource
          (PickBatch): two simultaneous ceilings where the line cap is an
          INCLUSIVE count (full at ==) while the item cap is an OVERFLOW guard
          (rejects only when the sum would exceed) — with caps 2 lines / 5
          items, two orders of 3 items each fit neither the item budget after
          the first append, yet a 2-item second order is accepted and a third
          order of 1 item is rejected on the LINE cap even though items (5)
          have room.
        test_recipe:
          setup:
            - "Logical clock 2026-09-10T14:00:00Z. Site SITE-C: radius 5.0, fee as SITE-A, waiver 3000, batch_max_lines 2, batch_max_items 5, horizon 2. SKU-CHIPS stocked 50; customer; three orders of qty 3, 2, 1; Pat's batch."
          setup_api_calls:
            - call: "POST /mfc/_clock/set_current_utc"
              payload: { current_utc: "2026-09-10T14:00:00Z" }
              as: SiteOps
            - call: "POST /mfc/sites"
              payload: { code: "SITE-C", name: "Caps MFC", delivery_radius_miles: 5.0, fee_schedule: { base_cents: 199, per_mile_cents: 99, included_miles: 1.5, peak_surcharge_cents: 150, min_fee_cents: 99, max_fee_cents: 999 }, fee_waiver_threshold_cents: 3000, batch_max_lines: 2, batch_max_items: 5, expiry_horizon_days: 2 }
              as: SiteOps
              captures: { site_c: $.data.id }
            - call: "POST /mfc/products"
              payload: { sku: "SKU-CHIPS", name: "Chips", price_cents: 500, product_class: "STANDARD" }
              as: SiteOps
              captures: { prod_chips: $.data.id }
            - call: "POST /mfc/inventory-balances"
              payload: { site_id: "${site_c}", product_id: "${prod_chips}", min_par_level: 0 }
              as: SiteOps
              captures: { bal_cc: $.data.id }
            - call: "POST /mfc/inventory-balances/${bal_cc}/adjustments"
              payload: { kind: "RECEIPT", qty: 50, reason: "opening" }
              as: SiteOps
            - call: "POST /mfc/customers"
              payload: { email: "ada@example.com", full_name: "Ada Adult", date_of_birth: "1990-01-01T00:00:00Z" }
              as: Customer
              captures: { cust_id: $.data.id }
            - call: "POST /mfc/pickers"
              payload: { site_id: "${site_c}", name: "Pat Picker" }
              as: SiteOps
              captures: { picker_1: $.data.id }
            - &oc_1
              call: "POST /mfc/orders"
              payload: { customer_id: "${cust_id}", site_id: "${site_c}", lines: [ { product_id: "${prod_chips}", qty: 3 } ], delivery_distance_miles: 1.0 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { oc_1: $.data.id }
            - &oc_2
              call: "POST /mfc/orders"
              payload: { customer_id: "${cust_id}", site_id: "${site_c}", lines: [ { product_id: "${prod_chips}", qty: 2 } ], delivery_distance_miles: 1.0 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { oc_2: $.data.id }
            - &oc_3
              call: "POST /mfc/orders"
              payload: { customer_id: "${cust_id}", site_id: "${site_c}", lines: [ { product_id: "${prod_chips}", qty: 1 } ], delivery_distance_miles: 1.0 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { oc_3: $.data.id }
            - &b_cc
              call: "POST /mfc/pick-batches"
              payload: { site_id: "${site_c}", picker_id: "${picker_1}" }
              as: SiteOps
              captures: { b_cc: $.data.id }
          trigger:
            - call: "POST /mfc/pick-batches/${b_cc}/orders"
              payload: { order_id: "${oc_1}" }
              as: Picker
              as_user_id: "${picker_1}"
            - call: "POST /mfc/pick-batches/${b_cc}/orders"
              payload: { order_id: "${oc_2}" }
              as: Picker
              as_user_id: "${picker_1}"
            - call: "POST /mfc/pick-batches/${b_cc}/orders"
              payload: { order_id: "${oc_3}" }
              as: Picker
              as_user_id: "${picker_1}"
              captures: { err_linecap: $.data.error_id }
          assert:
            - "Appends 1 and 2 succeed: total_items == 5 (item cap is an overflow guard, so == 5 is legal)"
            - "Append 3 returns 409 and error_id == ERR_BATCH_FULL even though adding 1 item would stay under the item cap — the LINE cap (2, inclusive) rejects first"
            - "Order.${oc_3}.status is still PLACED; PickBatch.${b_cc}.order_ids has exactly 2 entries"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: wallet_credit_absorb_then_cancel_restores_exactly
        grounds:
          - calculations.loyalty_credit_application
          - state_machines.Order.PLACED_to_CANCELLED
          - entities.Customer.fields.wallet_credit_cents
        distinguishing_aspect: |
          Conserved quantity: Customer.wallet_credit_cents (integer cents).
          Placement absorbs exactly min(wallet, subtotal) cents; cancelling the
          still-PLACED order refunds exactly loyalty_credit_applied_cents — the
          pair leaves the wallet bit-identical to its pre-placement value with
          zero drift.
        test_recipe:
          setup:
            - "Logical clock 2026-09-10T14:00:00Z. Site SITE-A; SKU-CHIPS 500 stocked 50; customer of age; wallet seeded to 200 via operator adjustment."
          setup_api_calls:
            - call: "POST /mfc/_clock/set_current_utc"
              payload: { current_utc: "2026-09-10T14:00:00Z" }
              as: SiteOps
            - call: "POST /mfc/sites"
              payload: { code: "SITE-A", name: "Downtown MFC", delivery_radius_miles: 5.0, fee_schedule: { base_cents: 199, per_mile_cents: 99, included_miles: 1.5, peak_surcharge_cents: 150, min_fee_cents: 99, max_fee_cents: 999 }, fee_waiver_threshold_cents: 3000, batch_max_lines: 2, batch_max_items: 20, expiry_horizon_days: 2 }
              as: SiteOps
              captures: { site_id: $.data.id }
            - call: "POST /mfc/products"
              payload: { sku: "SKU-CHIPS", name: "Chips", price_cents: 500, product_class: "STANDARD" }
              as: SiteOps
              captures: { prod_chips: $.data.id }
            - call: "POST /mfc/inventory-balances"
              payload: { site_id: "${site_id}", product_id: "${prod_chips}", min_par_level: 0 }
              as: SiteOps
              captures: { bal_chips: $.data.id }
            - call: "POST /mfc/inventory-balances/${bal_chips}/adjustments"
              payload: { kind: "RECEIPT", qty: 50, reason: "opening" }
              as: SiteOps
            - call: "POST /mfc/customers"
              payload: { email: "ada@example.com", full_name: "Ada Adult", date_of_birth: "1990-01-01T00:00:00Z" }
              as: Customer
              captures: { cust_id: $.data.id }
            - call: "POST /mfc/customers/${cust_id}/wallet/adjustments"
              payload: { amount_cents: 200, reason: "seed" }
              as: SiteOps
            - call: "GET /mfc/customers/${cust_id}"
              payload: {}
              as: SiteOps
              captures: { wallet_pre: $.data.wallet_credit_cents }
          trigger:
            - call: "POST /mfc/orders"
              payload: { customer_id: "${cust_id}", site_id: "${site_id}", lines: [ { product_id: "${prod_chips}", qty: 4 } ], delivery_distance_miles: 2.0 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { o_inv: $.data.id, absorbed: $.data.loyalty_credit_applied_cents }
            - call: "GET /mfc/customers/${cust_id}"
              payload: {}
              as: SiteOps
              captures: { wallet_mid: $.data.wallet_credit_cents }
            - call: "POST /mfc/orders/${o_inv}/cancel"
              payload: { reason: "CUSTOMER" }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "GET /mfc/customers/${cust_id}"
              payload: {}
              as: SiteOps
              captures: { wallet_post: $.data.wallet_credit_cents }
          assert:
            - "wallet_pre == 200 and absorbed == 200 (min(200, 2000 - 0))"
            - "wallet_mid == 0 after placement"
            - "wallet_post == wallet_pre == 200 — invariant: absorb then cancel conserves the wallet exactly"
            - "Order.${o_inv}.status == CANCELLED"

      - name: replenish_place_cancel_conserves_on_order
        grounds:
          - state_machines.ReplenishOrder.DRAFT_to_PLACED
          - state_machines.ReplenishOrder.PLACED_to_CANCELLED
          - entities.InventoryBalance.fields.on_order
        distinguishing_aspect: |
          Different conserved quantity — InventoryBalance.on_order (units on
          committed vendor orders): placing credits each line's qty, cancelling
          the same order debits exactly those qtys, and the pair leaves
          on_order == 0 and on_hand untouched — the site's derived posture also
          returns to OPERATING, so no compensation drift leaks into posture.
        test_recipe:
          setup:
            - "Logical clock 2026-09-10T14:00:00Z. Site SITE-A; SKU-CHIPS balance with on_hand 50, on_order 0."
          setup_api_calls:
            - call: "POST /mfc/_clock/set_current_utc"
              payload: { current_utc: "2026-09-10T14:00:00Z" }
              as: SiteOps
            - call: "POST /mfc/sites"
              payload: { code: "SITE-A", name: "Downtown MFC", delivery_radius_miles: 5.0, fee_schedule: { base_cents: 199, per_mile_cents: 99, included_miles: 1.5, peak_surcharge_cents: 150, min_fee_cents: 99, max_fee_cents: 999 }, fee_waiver_threshold_cents: 3000, batch_max_lines: 2, batch_max_items: 20, expiry_horizon_days: 2 }
              as: SiteOps
              captures: { site_id: $.data.id }
            - call: "POST /mfc/products"
              payload: { sku: "SKU-CHIPS", name: "Chips", price_cents: 500, product_class: "STANDARD" }
              as: SiteOps
              captures: { prod_chips: $.data.id }
            - call: "POST /mfc/inventory-balances"
              payload: { site_id: "${site_id}", product_id: "${prod_chips}", min_par_level: 0 }
              as: SiteOps
              captures: { bal_chips: $.data.id }
            - call: "POST /mfc/inventory-balances/${bal_chips}/adjustments"
              payload: { kind: "RECEIPT", qty: 50, reason: "opening" }
              as: SiteOps
            - call: "GET /mfc/inventory-balances/${bal_chips}"
              payload: {}
              as: SiteOps
              captures: { oo_pre: $.data.on_order }
            - &ro_inv
              call: "POST /mfc/replenish-orders"
              payload: { site_id: "${site_id}", reference: "PO-INV", lines: [ { product_id: "${prod_chips}", qty: 8, unit_cost_cents: 200 } ], expected_at: "2026-09-11T08:00:00Z", idempotency_key: "po-inv-key" }
              as: SiteOps
              captures: { ro_inv: $.data.id }
          trigger:
            - call: "POST /mfc/replenish-orders/${ro_inv}/place"
              payload: {}
              as: SiteOps
            - call: "GET /mfc/inventory-balances/${bal_chips}"
              payload: {}
              as: SiteOps
              captures: { oo_mid: $.data.on_order, oh_mid: $.data.on_hand }
            - call: "POST /mfc/replenish-orders/${ro_inv}/cancel"
              payload: {}
              as: SiteOps
            - call: "GET /mfc/inventory-balances/${bal_chips}"
              payload: {}
              as: SiteOps
              captures: { oo_post: $.data.on_order, oh_post: $.data.on_hand }
            - call: "GET /mfc/sites/${site_id}"
              payload: {}
              as: SiteOps
              captures: { posture_post: $.data.effective_status }
          assert:
            - "oo_pre == 0; after place oo_mid == 8 and oh_mid == 50 (on_hand untouched by place)"
            - "After cancel: oo_post == oo_pre == 0 and oh_post == 50 — invariant conserved"
            - "posture_post == OPERATING (no PLACED replenish orders remain)"
            - "ReplenishOrder.${ro_inv}.status == CANCELLED"
