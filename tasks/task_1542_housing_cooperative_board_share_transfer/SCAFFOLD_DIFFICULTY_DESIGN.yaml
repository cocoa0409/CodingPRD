  # ===========================================================================
  # Rule 8 — Resource temporal-overlap conflicts across different interval semantics
  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: sublet_overlap_with_gap_rule
        grounds:
          - state_machines.SubletAgreement.DRAFT_to_SUBMITTED
          - entities.Unit.fields.last_sublet_end_date
          - entities.Cooperative.fields.sublet_policy_gap_years
        distinguishing_aspect: |
          Resource: Unit (sublet interval). Interval semantics: half-open [start, end)
          with MANDATORY GAP — a new sublet must begin at least sublet_policy_gap_years
          after the previous sublet ended. Adjacent sublets (gap == 0) are REJECTED.
          Distinct from alteration overlap (next instance) which uses pure [start,end)
          overlap with no gap requirement.
        test_recipe:
          setup:
            - "Cooperative with sublet_policy_gap_years=1"
            - "Unit with last_sublet_end_date = 2026-06-01T00:00:00Z (from a completed prior sublet)"
            - "Current time 2026-08-01"
            - "Shareholder in GOOD_STANDING"
          setup_api_calls:
            - call: "POST /cooperatives"
              payload: { name: "Sublet Coop", address: "15 Main", underlying_mortgage_principal_cents: 100000000, underlying_mortgage_rate_bps: 500, sublet_policy_years_max: 2, sublet_policy_gap_years: 1 }
              as: PlatformAdmin
              captures: { coop_id: $.data.id }
            - call: "POST /cooperatives/${coop_id}/units"
              payload: { unit_label: "1A", shares_allocated: 100 }
              as: PlatformAdmin
              captures: { unit_id: $.data.id }
            - call: "POST /cooperatives/${coop_id}/shareholders"
              payload: { full_name: "S", email: "s@x.com" }
              as: BoardOfficer
              captures: { sh_id: $.data.id }
            - call: "POST /cooperatives/${coop_id}/share-ledger-entries"
              payload: { unit_id: "${unit_id}", shareholder_id: "${sh_id}", shares_held: 100 }
              as: BoardOfficer
            # Create a past sublet, force it through lifecycle to set last_sublet_end_date
            - call: "POST /cooperatives/${coop_id}/sublet-agreements"
              payload: { unit_id: "${unit_id}", shareholder_id: "${sh_id}", subtenant_name: "T1", sublet_start_date: "2025-06-01T00:00:00Z", sublet_end_date: "2026-06-01T00:00:00Z" }
              as: Shareholder
              as_user_id: "${sh_id}"
              captures: { sub1: $.data.id }
            - call: "POST /cooperatives/${coop_id}/sublet-agreements/${sub1}/submit"
              payload: {}
              as: Shareholder
              as_user_id: "${sh_id}"
            - call: "POST /cooperatives/${coop_id}/resolutions"
              payload: { resolution_kind: "APPROVE_SUBLET", subject_entity_kind: "SubletAgreement", subject_entity_id: "${sub1}", payload_json: {} }
              as: BoardOfficer
              captures: { res1: $.data.id }
            - call: "POST /cooperatives/${coop_id}/resolutions/${res1}/vote"
              payload: { vote_choice: "FOR" }
              as: BoardMember
              as_user_id: "bm-1"
            - call: "POST /cooperatives/${coop_id}/resolutions/${res1}/vote"
              payload: { vote_choice: "FOR" }
              as: BoardMember
              as_user_id: "bm-2"
            - call: "POST /cooperatives/${coop_id}/resolutions/${res1}/vote"
              payload: { vote_choice: "FOR" }
              as: BoardMember
              as_user_id: "bm-3"
            # Advance clock past sublet end to trigger COMPLETED
            - call: "POST /cooperatives/${coop_id}/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            # Attempt new sublet starting 2026-09-01 (only 3 months gap; needs 1 year)
            - call: "POST /cooperatives/${coop_id}/sublet-agreements"
              payload: { unit_id: "${unit_id}", shareholder_id: "${sh_id}", subtenant_name: "T2", sublet_start_date: "2026-09-01T00:00:00Z", sublet_end_date: "2027-09-01T00:00:00Z" }
              as: Shareholder
              as_user_id: "${sh_id}"
              captures: { sub2: $.data.id }
            - call: "POST /cooperatives/${coop_id}/sublet-agreements/${sub2}/submit"
              payload: {}
              as: Shareholder
              as_user_id: "${sh_id}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_SUBLET_POLICY_VIOLATION"
            - "http_status == 422"
            - "Sublet window semantics: half-open [start, end) + mandatory 1-year gap after last_sublet_end_date"
            - "last_sublet_end_date == 2026-06-01; new start 2026-09-01 violates gap rule"

      - name: alteration_overlap_pure_interval_no_gap
        grounds:
          - state_machines.AlterationAgreement.DRAFT_to_SUBMITTED
          - "validations[priority=8]"
        distinguishing_aspect: |
          Resource: Unit (alteration work window). Interval semantics: pure [start, end)
          overlap detection with NO gap requirement — two alterations on the same unit
          may be back-to-back (end == start is permitted) but MAY NOT overlap. Distinct
          interval semantics from sublet (which has mandatory gap).
        test_recipe:
          setup:
            - "Cooperative with unit, shareholder GOOD_STANDING"
            - "Existing AlterationAgreement APPROVED with window [2026-09-01, 2026-10-01)"
            - "New alteration with window [2026-09-15, 2026-10-15) — overlaps by 15 days"
          setup_api_calls:
            - call: "POST /cooperatives"
              payload: { name: "Alt Coop", address: "16 Main", underlying_mortgage_principal_cents: 100000000, underlying_mortgage_rate_bps: 500 }
              as: PlatformAdmin
              captures: { coop_id: $.data.id }
            - call: "POST /cooperatives/${coop_id}/units"
              payload: { unit_label: "1A", shares_allocated: 100 }
              as: PlatformAdmin
              captures: { unit_id: $.data.id }
            - call: "POST /cooperatives/${coop_id}/shareholders"
              payload: { full_name: "S", email: "s@x.com" }
              as: BoardOfficer
              captures: { sh_id: $.data.id }
            - call: "POST /cooperatives/${coop_id}/share-ledger-entries"
              payload: { unit_id: "${unit_id}", shareholder_id: "${sh_id}", shares_held: 100 }
              as: BoardOfficer
            - call: "POST /cooperatives/${coop_id}/alteration-agreements"
              payload: { unit_id: "${unit_id}", shareholder_id: "${sh_id}", scope_description: "Kitchen", contractor_name: "A", contractor_insurance_cents: 200000000, work_window_start: "2026-09-01T00:00:00Z", work_window_end: "2026-10-01T00:00:00Z", contractor_bid_cents: 5000000, involves_wet_over_dry: false }
              as: Shareholder
              as_user_id: "${sh_id}"
              captures: { alt1: $.data.id }
            - call: "POST /cooperatives/${coop_id}/alteration-agreements/${alt1}/submit"
              payload: {}
              as: Shareholder
              as_user_id: "${sh_id}"
            - call: "POST /cooperatives/${coop_id}/resolutions"
              payload: { resolution_kind: "APPROVE_ALTERATION", subject_entity_kind: "AlterationAgreement", subject_entity_id: "${alt1}", payload_json: {} }
              as: BoardOfficer
              captures: { res1: $.data.id }
            - call: "POST /cooperatives/${coop_id}/resolutions/${res1}/vote"
              payload: { vote_choice: "FOR" }
              as: BoardMember
              as_user_id: "bm-1"
            - call: "POST /cooperatives/${coop_id}/resolutions/${res1}/vote"
              payload: { vote_choice: "FOR" }
              as: BoardMember
              as_user_id: "bm-2"
            - call: "POST /cooperatives/${coop_id}/resolutions/${res1}/vote"
              payload: { vote_choice: "FOR" }
              as: BoardMember
              as_user_id: "bm-3"
          trigger:
            - call: "POST /cooperatives/${coop_id}/alteration-agreements"
              payload: { unit_id: "${unit_id}", shareholder_id: "${sh_id}", scope_description: "Bathroom", contractor_name: "B", contractor_insurance_cents: 200000000, work_window_start: "2026-09-15T00:00:00Z", work_window_end: "2026-10-15T00:00:00Z", contractor_bid_cents: 3000000, involves_wet_over_dry: false }
              as: Shareholder
              as_user_id: "${sh_id}"
              captures: { alt2: $.data.id }
            - call: "POST /cooperatives/${coop_id}/alteration-agreements/${alt2}/submit"
              payload: {}
              as: Shareholder
              as_user_id: "${sh_id}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_TEMPORAL_CONFLICT"
            - "http_status == 422"
            - "Alteration semantics: pure interval overlap, no gap rule (distinct from sublet)"

  # ===========================================================================
  # Rule 9 — Compensating-action invariants across different conserved quantities
  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: share_conservation_through_transfer
        grounds:
          - entities.Cooperative.fields.total_shares
          - entities.ShareLedgerEntry.fields.shares_held
          - state_machines.PurchaseApplication.APPROVED_to_TRANSFERRED
        distinguishing_aspect: |
          Conserved quantity: TOTAL ISSUED SHARES. Forward action (record-transfer)
          paired with its compensation (old entry SUPERSEDED + new entry ACTIVE for same
          number of shares) must leave Cooperative.total_shares unchanged AND the sum
          over ACTIVE ShareLedgerEntry.shares_held equal to total_shares. Distinct
          conserved quantity from charge ledger conservation (next instance).
        test_recipe:
          setup:
            - "Cooperative with 1 unit 100 shares, total_shares=100"
            - "Seller with ACTIVE ledger entry of 100 shares"
            - "APPROVED PurchaseApplication ready to record"
          setup_api_calls:
            - call: "POST /cooperatives"
              payload: { name: "Share Cons", address: "17 Main", underlying_mortgage_principal_cents: 100000000, underlying_mortgage_rate_bps: 500, flip_tax_policy: "GROSS_PERCENT", flip_tax_percent_bps: 200 }
              as: PlatformAdmin
              captures: { coop_id: $.data.id }
            - call: "POST /cooperatives/${coop_id}/units"
              payload: { unit_label: "1A", shares_allocated: 100 }
              as: PlatformAdmin
              captures: { unit_id: $.data.id }
            - call: "POST /cooperatives/${coop_id}/shareholders"
              payload: { full_name: "S", email: "s@x.com" }
              as: BoardOfficer
              captures: { seller_id: $.data.id }
            - call: "POST /cooperatives/${coop_id}/share-ledger-entries"
              payload: { unit_id: "${unit_id}", shareholder_id: "${seller_id}", shares_held: 100 }
              as: BoardOfficer
            - call: "POST /cooperatives/${coop_id}/purchase-applications"
              payload: { unit_id: "${unit_id}", seller_shareholder_id: "${seller_id}", buyer_full_name: "B", buyer_email: "b@x.com", gross_sale_price_cents: 50000000, financing_percent_bps: 5000, debt_to_income_bps: 1000, post_closing_liquidity_cents: 99999999 }
              as: Shareholder
              as_user_id: "${seller_id}"
              captures: { app_id: $.data.id }
            - call: "POST /cooperatives/${coop_id}/purchase-applications/${app_id}/submit"
              payload: {}
              as: Shareholder
              as_user_id: "${seller_id}"
            - call: "POST /cooperatives/${coop_id}/purchase-applications/${app_id}/certify"
              payload: {}
              as: ManagingAgent
            - call: "POST /cooperatives/${coop_id}/purchase-applications/${app_id}/schedule-interview"
              payload: { scheduled_at: "2026-08-15T14:00:00Z", panel_member_user_ids: ["bm-a", "bm-b"] }
              as: BoardOfficer
              captures: { iid: $.data.id }
            - call: "POST /cooperatives/${coop_id}/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-15T15:00:00Z" }
              as: PlatformAdmin
            - call: "POST /cooperatives/${coop_id}/interviews/${iid}/complete"
              payload: { interview_outcome: "FAVORABLE" }
              as: BoardMember
              as_user_id: "bm-a"
            - call: "POST /cooperatives/${coop_id}/resolutions"
              payload: { resolution_kind: "APPROVE_PURCHASE", subject_entity_kind: "PurchaseApplication", subject_entity_id: "${app_id}", payload_json: {} }
              as: BoardOfficer
              captures: { res_id: $.data.id }
            - call: "POST /cooperatives/${coop_id}/resolutions/${res_id}/vote"
              payload: { vote_choice: "FOR" }
              as: BoardMember
              as_user_id: "bm-1"
            - call: "POST /cooperatives/${coop_id}/resolutions/${res_id}/vote"
              payload: { vote_choice: "FOR" }
              as: BoardMember
              as_user_id: "bm-2"
            - call: "POST /cooperatives/${coop_id}/resolutions/${res_id}/vote"
              payload: { vote_choice: "FOR" }
              as: BoardMember
              as_user_id: "bm-3"
            - call: "GET /cooperatives/${coop_id}"
              as: BoardOfficer
              captures: { pre_total: $.data.total_shares, coop_v: $.data.version }
          trigger:
            - call: "POST /cooperatives/${coop_id}/purchase-applications/${app_id}/record-transfer"
              payload: { expected_cooperative_version: "${coop_v}" }
              as: BoardOfficer
            - call: "GET /cooperatives/${coop_id}"
              as: BoardOfficer
              captures: { post_total: $.data.total_shares }
            - call: "GET /cooperatives/${coop_id}/share-ledger-entries"
              as: BoardOfficer
              captures: { entries: $.data }
          assert:
            - "Cooperative.total_shares == 100 both before AND after transfer (invariant preserved)"
            - "Sum over ACTIVE ShareLedgerEntry.shares_held == 100"
            - "Old entry (seller) has entry_status == SUPERSEDED"
            - "New entry (buyer) has entry_status == ACTIVE with shares_held == 100"
            - "Forward (transfer) + compensation (supersede old, create new) conserves total shares"

      - name: charge_ledger_conservation_through_payment_and_void
        grounds:
          - entities.MaintenanceCharge.fields.outstanding_cents
          - entities.Payment.fields.amount_cents
          - state_machines.Payment.POSTED_to_VOIDED
          - calculations.arrears_interest_accrual
        distinguishing_aspect: |
          Conserved quantity: LEDGER BALANCE. Conservation law: outstanding_cents ==
          base_amount_cents + late_fee_cents + interest_cents - paid_cents for every
          MaintenanceCharge. Forward action (post payment) + compensation (void payment)
          must leave the ledger exactly as before. Distinct conserved quantity (money,
          not shares) from share_conservation_through_transfer.
        test_recipe:
