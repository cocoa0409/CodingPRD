      - name: the_reserve_running_total_survives_a_reversal
        claim_type: aggregation_boundary
        grounds:
          - calculations.lifecycle_reserve_balance
          - endpoints[POST /ppp/reserve-transactions/{id}/reverse]
        excluded_because:
          difficulty_instance: reserve_withdrawal_then_reversal_conserves_the_ledger_balance
          rationale: |
            The aggregation claims (running total correct after an append, correct after a
            reversal, floor honoured) are the compensating-invariant depth probe, which
            replays the whole ledger in sequence_no order and asserts every intermediate
            resulting_balance_cents. The entities-section immutability corner above already
            covers the plain append case, so a separate aggregation corner would be
            redundant on both sides.

      - name: the_two_cap_variants_diverge_per_event_on_the_same_data
        claim_type: variant_divergence
        grounds:
          - calculations.period_deduction_cap_allocation.variants
          - entities.DeductionEvent.fields.pro_rata_amount_cents
        excluded_because:
          difficulty_instance: deduction_cap_allocation_sequential_vs_pro_rata_diverge_per_event
          rationale: |
            Variant divergence is the entire subject of that difficulty instance: the same
            three raws under the same cap give SEQUENTIAL 500000/750000/470833 and PRO_RATA
            458888/688334/573611, differing on all three rows while both sum to the cap. It
            also pins the residue tie-break, which a corner test would not reach.

      - name: the_termination_variant_is_chosen_by_the_trigger_reason
        claim_type: variant_selection
        grounds:
          - calculations.termination_compensation.variants
          - endpoints[POST /ppp/enforcement-actions/{id}/calculate-compensation]
        excluded_because:
          difficulty_instance: termination_compensation_variant_selected_by_trigger_reason
          rationale: |
            Variant selection is that instance's whole point — the same concession state
            costed under all four trigger_reasons yields four different figures, and the
            CONCESSIONAIRE_DEFAULT variant reads three inputs the others ignore. The
            AUTHORITY_VOLUNTARY arm is additionally exercised end-to-end by the CASCADE C
            side-effect corner above.
      # Reconciliation (dual-variant table, row 3) is deliberately absent: PRO_RATA_CAP is a
      # permanent audit shadow that never feeds net_payment_cents, so no provisional->final
      # switch and no ledger delta exists to reconcile in this domain.

  - section: validations
    instances:
      - name: a_withdrawal_one_cent_past_the_balance_is_forbidden
        claim_type: violation_to_error
        grounds:
          - validations[priority=50]
          - errors[ERR_RESERVE_WITHDRAWAL_FORBIDDEN]
          - calculations.lifecycle_reserve_balance
        distinguishing_aspect: |
          The reserve floor is checked against the PROJECTED balance, not the requested
          amount: with a seeded balance of exactly 8000000 a withdrawal of 8000001 must be
          refused and must leave no ledger row behind, so the append-only ledger cannot be
          left holding a row whose resulting_balance_cents is negative.
        test_recipe:
          setup:
            - "The base chain through disbursement only: M1 120000000 disbursed drives cumulative_drawn_pct to 0.3000, flips the concession to CONSTRUCTION and seeds the reserve with 400000000 * 0.02 = 8000000."
