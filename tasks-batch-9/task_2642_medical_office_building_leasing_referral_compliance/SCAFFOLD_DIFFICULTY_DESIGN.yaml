      - name: ti_construction_start_requires_lease_executed_or_active
        grounds:
          - validations[38]
          - errors.ERR_TI_PROJECT_NOT_COMPLETE
          - state_machines.TenantImprovementProject[PERMITTED -> CONSTRUCTION]
          - endpoints[POST /ti-projects/{id}/transitions]
          - entities.Lease.fields.status
        distinguishing_aspect: |
          A DIFFERENT entity pair (TenantImprovementProject, Lease) and the
          opposite direction of dependency from the pair above: the project has
          reached PERMITTED with both fork branches approved and is refused
          START_CONSTRUCTION with 409 only because its parent Lease is still
          DRAFT. Driving the lease to EXECUTED without touching the project at all
          makes the identical transition succeed, so the gate is proven to live on
          the lease's state rather than on the project's.
        test_recipe:
          setup:
            - "One 100000 sf Building at 30.00 psf market with a 5000 sf STANDARD_EXAM suite rated 200 amps."
            - "One non-physician-owned INDEPENDENT_PRACTICE tenant on a DRAFT DIRECT lease at 30.00 psf."
