# =============================================================================
# PRD Benchmark Scaffold — Franchise Operator Selection & Single-Unit
# Operator Agreement (Chick-fil-A style)
#
# §1.0–§1.7. Difficulty design lives in SCAFFOLD_DIFFICULTY_DESIGN.yaml (§1.8);
# corner design lives in SCAFFOLD_CORNER_DESIGN.yaml (§1.9). Neither key
# appears in this file.
# =============================================================================

scenario: |
  Franchise Operator Selection & Single-Unit Operator Agreement (Chick-fil-A):
  multi-stage operator selection with interviews, business assessment and
  in-restaurant experience, low initial financial commitment paired with a
  non-transferable, non-equity operator agreement, restriction to a single
  restaurant with residency and full-time involvement requirements,
  revenue-share economics where the franchisor owns the site and equipment,
  closed-Sunday operating calendar affecting weekly forecasting and labor
  planning, operator scorecard on food safety, service speed and community
  engagement, relocation and second-location exceptions with committee
  approval, operator exit and successor selection process.

domain_name: franchise-operator-selection
api_prefix: /franchise

# =============================================================================
# §0.3 Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: multi_party_negotiation
  secondary_archetype: workflow_orchestration
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - scheduled_deferred_actions
  entity_topology: hybrid
  state_machine_shape: branching
  relationship_patterns:
    - one_to_many
    - cross_aggregate
    - self_referential
  role_model: approval_chain
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Candidate
    parent: null
    common_fields: true
    fields:
      - { name: legal_name, type: string, source: input, description: "Candidate full legal name" }
      - { name: email, type: string, source: input, description: "Contact email; unique across all candidates regardless of status" }
      - { name: home_market_code, type: string, source: input, description: "US state or market code the candidate resides in, e.g. GA" }
      - { name: relocation_willing, type: boolean, source: input, description: "Whether the candidate declares willingness to relocate for a restaurant assignment" }
      - { name: liquid_capital_cents, type: integer, source: input, description: "Self-declared liquid capital; must be >= 0" }
      - { name: candidate_status, type: enum, source: system, description: "REGISTERED | IN_SELECTION | SELECTED | WITHDRAWN | DISQUALIFIED", constraints: "one of REGISTERED, IN_SELECTION, SELECTED, WITHDRAWN, DISQUALIFIED" }
      - { name: active_application_id, type: string, source: system, description: "FK -> Application.id; the single non-terminal application for this candidate, null when none", constraints: "at most one non-terminal application per candidate" }

  - name: Application
    parent: Candidate
    common_fields: true
    fields:
      - { name: candidate_id, type: string, source: input, description: "FK -> Candidate.id; owning candidate" }
      - { name: target_market_code, type: string, source: input, description: "Market the candidate applies to operate in" }
      - { name: stage, type: enum, source: system, description: "SUBMITTED | SCREENING | INTERVIEWS | BUSINESS_ASSESSMENT | IN_RESTAURANT | COMMITTEE_REVIEW | APPROVED | REJECTED | WITHDRAWN | EXPIRED", constraints: "selection pipeline stage" }
      - { name: screening_score, type: integer, source: computed, description: "0-100 screen score computed at submit from declared capital and market alignment; null until computed" }
      - { name: interview_average, type: number, source: computed, description: "Mean of SUBMITTED InterviewRound.score values for this application; null when no scored rounds" }
      - { name: assessment_verdict, type: enum, source: system, description: "PENDING | PASS | FAIL", constraints: "business assessment outcome" }
      - { name: experience_verdict, type: enum, source: system, description: "PENDING | PASS | FAIL", constraints: "in-restaurant experience outcome" }
      - { name: committee_decision, type: enum, source: system, description: "NONE | APPROVE | REJECT", constraints: "recorded committee decision" }
      - { name: application_fee_cents, type: integer, source: computed, description: "Initial financial commitment charged at COMMITTEE_REVIEW entry; fixed INITIAL_COMMITMENT_CENTS" }
      - { name: submitted_at, type: datetime, source: system, description: "Logical-clock timestamp when the application entered SUBMITTED" }

  - name: InterviewRound
    parent: Application
    common_fields: true
    fields:
      - { name: application_id, type: string, source: input, description: "FK -> Application.id; owning application" }
      - { name: round_index, type: integer, source: system, description: "1-based ordinal of this round within the application, assigned in creation order" }
      - { name: interviewer_id, type: string, source: input, description: "Opaque field-consultant identifier conducting the round" }
      - { name: scheduled_for, type: datetime, source: input, description: "Planned start of the interview on the logical clock" }
      - { name: score, type: integer, source: input, description: "0-100 interview score, supplied only when the round is scored" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | SUBMITTED | CANCELLED", constraints: "round lifecycle" }

  - name: BusinessAssessment
    parent: Application
    common_fields: true
    fields:
      - { name: application_id, type: string, source: input, description: "FK -> Application.id; owning application" }
      - { name: market_plan_text, type: string, source: input, description: "Candidate-authored market plan narrative" }
      - { name: financial_projection_cents, type: integer, source: input, description: "Projected first-year revenue in cents; must be > 0" }
      - { name: rubric_score, type: integer, source: computed, description: "0-100 weighted rubric score computed on evaluation" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | EVALUATED", constraints: "assessment lifecycle" }

  - name: Restaurant
    parent: null
    common_fields: true
    fields:
      - { name: site_code, type: string, source: input, description: "Unique site identifier, e.g. GA-ATL-042" }
      - { name: market_code, type: string, source: input, description: "Market the restaurant trades in" }
      - { name: baseline_weekly_revenue_cents, type: integer, source: input, description: "Trailing reference weekly revenue used for forecasting; must be > 0" }
      - { name: restaurant_status, type: enum, source: system, description: "PIPELINE | AVAILABLE | ASSIGNED | TRANSITION", constraints: "site lifecycle; AVAILABLE means open for operator assignment" }
      - { name: current_operator_id, type: string, source: system, description: "FK -> Operator.id; the incumbent operator, null when unassigned" }
      - { name: equipment_value_cents, type: integer, source: input, description: "Franchisor-owned equipment book value; the operator never acquires equity in it" }
      - { name: sunday_closed, type: boolean, source: system, default: true, description: "Operating calendar flag; always true for this system (closed-Sunday)" }

  - name: InRestaurantExperience
    parent: Application
    common_fields: true
    fields:
      - { name: application_id, type: string, source: input, description: "FK -> Application.id; owning application" }
      - { name: host_restaurant_id, type: string, source: input, description: "FK -> Restaurant.id; restaurant hosting the experience shift block" }
      - { name: starts_on, type: datetime, source: input, description: "First day of the experience block (date at 00:00:00Z)" }
      - { name: ends_on, type: datetime, source: input, description: "Last day of the experience block (date at 00:00:00Z); inclusive-exclusive semantics: [starts_on, ends_on + 1 day)" }
      - { name: required_shift_count, type: integer, source: computed, description: "Number of operating days in the block excluding Sundays; computed at creation" }
      - { name: completed_shift_count, type: integer, source: system, default: 0, description: "Shifts signed off by the host operator" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | IN_PROGRESS | COMPLETED | SHORTFALL | CANCELLED", constraints: "experience lifecycle" }

  - name: Operator
    parent: null
    common_fields: true
    fields:
      - { name: candidate_id, type: string, source: input, description: "FK -> Candidate.id; the person behind this operator (unique — one operator record per candidate)" }
      - { name: agreement_id, type: string, source: system, description: "FK -> OperatorAgreement.id; the governing agreement" }
      - { name: restaurant_id, type: string, source: system, description: "FK -> Restaurant.id; the single restaurant this operator runs" }
      - { name: operator_status, type: enum, source: system, description: "ONBOARDING | ACTIVE | SUSPENDED | EXITING | EXITED", constraints: "operator lifecycle" }
      - { name: residency_verified, type: boolean, source: system, default: false, description: "Whether residency within market has been verified" }
      - { name: full_time_attested, type: boolean, source: system, default: false, description: "Whether the operator attested full-time involvement for the current period" }
      - { name: lifetime_revenue_share_cents, type: integer, source: computed, default: 0, description: "Cumulative operator share paid across all SETTLED statements" }

  - name: OperatorAgreement
    parent: Operator
    common_fields: true
    fields:
      - { name: operator_id, type: string, source: input, description: "FK -> Operator.id; the operator bound by this agreement (immutable 1:1)" }
      - { name: restaurant_id, type: string, source: input, description: "FK -> Restaurant.id; the single licensed restaurant (immutable)" }
      - { name: transferable, type: boolean, source: system, default: false, description: "Always false — agreements are non-transferable" }
      - { name: equity_stake_bps, type: integer, source: system, default: 0, description: "Always 0 — operator holds no equity in site or equipment" }
      - { name: base_share_bps, type: integer, source: input, description: "Operator share of net revenue in basis points, e.g. 5000 = 50.00%" }
      - { name: agreement_status, type: enum, source: system, description: "DRAFT | EXECUTED | SUSPENDED | TERMINATED", constraints: "agreement lifecycle" }
      - { name: effective_from, type: datetime, source: input, description: "Agreement effective timestamp; must not be in the past relative to the logical clock" }

  - name: OperatingWeek
    parent: Restaurant
    common_fields: true
    fields:
      - { name: restaurant_id, type: string, source: input, description: "FK -> Restaurant.id; owning restaurant" }
      - { name: week_start_on, type: datetime, source: input, description: "Monday 00:00:00Z of the operating week; unique per restaurant" }
      - { name: operating_day_count, type: integer, source: computed, description: "Always 6 — Monday through Saturday; Sunday is excluded by the closed-Sunday calendar" }
      - { name: forecast_revenue_cents, type: integer, source: computed, description: "Weekly forecast derived from baseline under the six-day calendar" }
      - { name: planned_labor_hours, type: integer, source: computed, description: "Labor plan hours derived from forecast" }
      - { name: actual_revenue_cents, type: integer, source: input, description: "Actual revenue for the week, supplied at close; must be >= 0" }
      - { name: week_status, type: enum, source: system, description: "PLANNED | OPEN | CLOSED", constraints: "week lifecycle" }

  - name: Scorecard
    parent: Operator
    common_fields: true
    fields:
      - { name: operator_id, type: string, source: input, description: "FK -> Operator.id; scored operator" }
      - { name: period_start_on, type: datetime, source: input, description: "First day of the scorecard period" }
      - { name: period_end_on, type: datetime, source: input, description: "Last day of the scorecard period (inclusive-exclusive: [period_start_on, period_end_on + 1 day))" }
      - { name: food_safety_score, type: integer, source: input, description: "0-100 food safety component" }
      - { name: service_speed_score, type: integer, source: input, description: "0-100 service speed component" }
      - { name: community_engagement_score, type: integer, source: input, description: "0-100 community engagement component" }
      - { name: composite_score, type: integer, source: computed, description: "Weighted composite per scorecard_composite calculation" }
      - { name: rating, type: enum, source: computed, description: "EXCEEDS | MEETS | BELOW | CRITICAL", constraints: "band derived from composite_score" }
      - { name: scorecard_status, type: enum, source: system, description: "DRAFT | PUBLISHED | DISPUTED | FINAL", constraints: "scorecard lifecycle" }

  - name: RelocationRequest
    parent: Operator
    common_fields: true
    fields:
      - { name: operator_id, type: string, source: input, description: "FK -> Operator.id; requesting operator" }
      - { name: kind, type: enum, source: input, description: "RELOCATION | SECOND_LOCATION", constraints: "exception kind" }
      - { name: target_restaurant_id, type: string, source: input, description: "FK -> Restaurant.id; the restaurant the operator seeks to move to or add" }
      - { name: reason_text, type: string, source: input, description: "Operator-authored justification" }
      - { name: request_status, type: enum, source: system, description: "SUBMITTED | COMMITTEE_REVIEW | APPROVED | DENIED | WITHDRAWN", constraints: "exception lifecycle" }
      - { name: votes_for, type: integer, source: system, default: 0, description: "Committee votes in favor" }
      - { name: votes_against, type: integer, source: system, default: 0, description: "Committee votes against" }

  - name: ExitCase
    parent: Operator
    common_fields: true
    fields:
      - { name: operator_id, type: string, source: input, description: "FK -> Operator.id; exiting operator" }
      - { name: reason, type: enum, source: input, description: "VOLUNTARY | INVOLUNTARY | NON_RENEWAL", constraints: "exit cause" }
      - { name: notice_given_on, type: datetime, source: system, description: "Logical-clock date the exit case was opened" }
      - { name: effective_on, type: datetime, source: input, description: "Date the exit takes effect; must be >= notice date + MIN_NOTICE_DAYS" }
      - { name: successor_candidate_id, type: string, source: input, description: "FK -> Candidate.id; proposed successor, must hold an APPROVED application", constraints: "nullable until successor is proposed" }
      - { name: final_statement_id, type: string, source: system, description: "FK -> RevenueShareStatement.id; the terminal settlement, null until exit completes" }
      - { name: exit_status, type: enum, source: system, description: "OPEN | SUCCESSOR_PENDING | SUCCESSOR_APPROVED | COMPLETED | CANCELLED", constraints: "exit lifecycle" }

  - name: RevenueShareStatement
    parent: Operator
    common_fields: true
    fields:
      - { name: operator_id, type: string, source: input, description: "FK -> Operator.id; operator being settled" }
      - { name: operating_week_id, type: string, source: input, description: "FK -> OperatingWeek.id; the week this statement settles; unique per operator" }
      - { name: gross_revenue_cents, type: integer, source: computed, description: "Revenue base taken from the OperatingWeek actuals" }
      - { name: brand_fee_cents, type: integer, source: computed, description: "Franchisor brand fee withheld before sharing" }
      - { name: occupancy_charge_cents, type: integer, source: computed, description: "Franchisor occupancy charge for site and equipment" }
      - { name: operator_share_cents, type: integer, source: computed, description: "Operator's share under base_share_bps after fees" }
      - { name: statement_kind, type: enum, source: system, description: "PROVISIONAL | FINAL", constraints: "PROVISIONAL at issue, FINAL after close-out" }
      - { name: statement_status, type: enum, source: system, description: "ISSUED | SETTLED | VOID", constraints: "statement lifecycle" }

  - name: CommitteeVote
    parent: RelocationRequest
    common_fields: false
    fields:
      - { name: relocation_request_id, type: string, source: input, description: "FK -> RelocationRequest.id; the request being voted on" }
      - { name: committee_member_id, type: string, source: input, description: "Opaque selection-committee member identifier; one vote per member per request" }
      - { name: vote, type: enum, source: input, description: "FOR | AGAINST", constraints: "ballot" }
      - { name: cast_at, type: datetime, source: system, description: "Logical-clock timestamp when the vote was recorded" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Candidate
    initial_state: REGISTERED
    terminal_states: [WITHDRAWN, DISQUALIFIED]
    transitions:
      - from: REGISTERED
        to: IN_SELECTION
        trigger: "POST /franchise/candidates/{candidateId}/applications (creating the first application)"
        actor: Candidate
        preconditions:
          - "candidate.candidate_status == REGISTERED"
          - "no non-terminal Application exists for the candidate"
        side_effects:
          - "Application created in stage SUBMITTED"
          - "Candidate.active_application_id set to the new application id"

      - from: IN_SELECTION
        to: SELECTED
        trigger: "system (automatic when the active Application reaches APPROVED)"
        actor: system
        preconditions: []
        side_effects:
          - "Candidate.active_application_id cleared to null"

      - from: IN_SELECTION
        to: REGISTERED
        trigger: "system (automatic when the active Application reaches REJECTED, WITHDRAWN, or EXPIRED)"
        actor: system
        preconditions: []
        side_effects:
          - "Candidate.active_application_id cleared to null"

      - from: REGISTERED
        to: WITHDRAWN
        trigger: "POST /franchise/candidates/{candidateId}/withdraw"
        actor: Candidate
        preconditions:
          - "candidate has no non-terminal Application"
        side_effects: []

      - from: IN_SELECTION
        to: WITHDRAWN
        trigger: "POST /franchise/candidates/{candidateId}/withdraw"
        actor: Candidate
        preconditions: []
        side_effects:
          - "active Application cascades to WITHDRAWN"

      - from: IN_SELECTION
        to: DISQUALIFIED
        trigger: "POST /franchise/candidates/{candidateId}/disqualify"
        actor: FieldConsultant
        preconditions: []
        side_effects:
          - "active Application cascades to REJECTED"

  - entity: Application
    initial_state: SUBMITTED
    terminal_states: [APPROVED, REJECTED, WITHDRAWN, EXPIRED]
    transitions:
      - from: SUBMITTED
        to: SCREENING
        trigger: "POST /franchise/applications/{applicationId}/advance"
        actor: FieldConsultant
        preconditions:
          - "application.screening_score >= SCREENING_PASS_SCORE"
        side_effects: []

      - from: SCREENING
        to: INTERVIEWS
        trigger: "POST /franchise/applications/{applicationId}/advance"
        actor: FieldConsultant
        preconditions: []
        side_effects: []

      - from: INTERVIEWS
        to: BUSINESS_ASSESSMENT
        trigger: "POST /franchise/applications/{applicationId}/advance"
        actor: FieldConsultant
        preconditions:
          - "at least MIN_INTERVIEW_ROUNDS InterviewRounds exist for the application"
          - "every InterviewRound of the application is in SUBMITTED status"
          - "application.interview_average >= INTERVIEW_PASS_SCORE"
        side_effects: []

      - from: BUSINESS_ASSESSMENT
        to: IN_RESTAURANT
        trigger: "POST /franchise/applications/{applicationId}/advance"
        actor: FieldConsultant
        preconditions:
          - "a BusinessAssessment exists for the application in EVALUATED status"
          - "application.assessment_verdict == PASS"
        side_effects: []

      - from: IN_RESTAURANT
        to: COMMITTEE_REVIEW
        trigger: "POST /franchise/applications/{applicationId}/advance"
        actor: FieldConsultant
        preconditions:
          - "an InRestaurantExperience exists for the application in COMPLETED status"
          - "application.experience_verdict == PASS"
        side_effects:
          - "application.application_fee_cents charged at INITIAL_COMMITMENT_CENTS"

      - from: COMMITTEE_REVIEW
        to: APPROVED
        trigger: "POST /franchise/applications/{applicationId}/committee-decision"
        actor: SelectionCommittee
        preconditions:
          - "application.stage == COMMITTEE_REVIEW"
        side_effects:
          - "application.committee_decision = APPROVE"
          - "Candidate transitions IN_SELECTION -> SELECTED (bubble up)"

      - from: COMMITTEE_REVIEW
        to: REJECTED
        trigger: "POST /franchise/applications/{applicationId}/committee-decision"
        actor: SelectionCommittee
        preconditions: []
        side_effects:
          - "application.committee_decision = REJECT"
          - "Candidate transitions IN_SELECTION -> REGISTERED (bubble up)"

      - from: SUBMITTED
        to: WITHDRAWN
        trigger: "POST /franchise/applications/{applicationId}/withdraw"
        actor: Candidate
        preconditions: []
        side_effects:
          - "Candidate transitions IN_SELECTION -> REGISTERED (bubble up)"

      - from: SCREENING
        to: WITHDRAWN
        trigger: "POST /franchise/applications/{applicationId}/withdraw"
        actor: Candidate
        preconditions: []
        side_effects:
          - "Candidate transitions IN_SELECTION -> REGISTERED (bubble up)"

      - from: INTERVIEWS
        to: WITHDRAWN
        trigger: "POST /franchise/applications/{applicationId}/withdraw"
        actor: Candidate
        preconditions: []
        side_effects:
          - "Candidate transitions IN_SELECTION -> REGISTERED (bubble up)"
          - "all SCHEDULED InterviewRounds cascade to CANCELLED"

      - from: BUSINESS_ASSESSMENT
        to: WITHDRAWN
        trigger: "POST /franchise/applications/{applicationId}/withdraw"
        actor: Candidate
        preconditions: []
        side_effects:
          - "Candidate transitions IN_SELECTION -> REGISTERED (bubble up)"

      - from: IN_RESTAURANT
        to: WITHDRAWN
        trigger: "POST /franchise/applications/{applicationId}/withdraw"
        actor: Candidate
        preconditions: []
        side_effects:
          - "Candidate transitions IN_SELECTION -> REGISTERED (bubble up)"
          - "SCHEDULED or IN_PROGRESS InRestaurantExperience cascades to CANCELLED"

      - from: COMMITTEE_REVIEW
        to: WITHDRAWN
        trigger: "POST /franchise/applications/{applicationId}/withdraw"
        actor: Candidate
        preconditions: []
        side_effects:
          - "Candidate transitions IN_SELECTION -> REGISTERED (bubble up)"

      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /franchise/applications/{applicationId}/reject"
        actor: FieldConsultant
        preconditions: []
        side_effects:
          - "Candidate transitions IN_SELECTION -> REGISTERED (bubble up)"

      - from: SUBMITTED
        to: EXPIRED
        trigger: "system (automatic at logical-clock midnight when submitted_at is older than APPLICATION_TTL_DAYS while still in SUBMITTED)"
        actor: system
        preconditions: []
        side_effects:
          - "Candidate transitions IN_SELECTION -> REGISTERED (bubble up)"

  - entity: InterviewRound
    initial_state: SCHEDULED
    terminal_states: [SUBMITTED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: SUBMITTED
        trigger: "POST /franchise/applications/{applicationId}/interviews/{roundId}/score"
        actor: FieldConsultant
        preconditions:
          - "application.stage == INTERVIEWS"
          - "score between 0 and 100 inclusive"
        side_effects:
          - "application.interview_average recomputed over SUBMITTED rounds"

      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /franchise/applications/{applicationId}/interviews/{roundId}/cancel"
        actor: FieldConsultant
        preconditions: []
        side_effects:
          - "application.interview_average recomputed over remaining SUBMITTED rounds"

  - entity: BusinessAssessment
    initial_state: DRAFT
    terminal_states: [EVALUATED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /franchise/applications/{applicationId}/assessment/submit"
        actor: Candidate
        preconditions:
          - "application.stage == BUSINESS_ASSESSMENT"
          - "market_plan_text non-empty"
          - "financial_projection_cents > 0"
        side_effects: []

      - from: SUBMITTED
        to: EVALUATED
        trigger: "POST /franchise/applications/{applicationId}/assessment/evaluate"
        actor: FieldConsultant
        preconditions:
          - "assessment.status == SUBMITTED"
        side_effects:
          - "rubric_score computed per assessment_rubric calculation"
          - "application.assessment_verdict set to PASS when rubric_score >= ASSESSMENT_PASS_SCORE else FAIL"

  - entity: InRestaurantExperience
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, SHORTFALL, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: IN_PROGRESS
        trigger: "system (automatic at logical-clock midnight when starts_on is reached)"
        actor: system
        preconditions: []
        side_effects: []

      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /franchise/applications/{applicationId}/experiences/{experienceId}/complete"
        actor: FieldConsultant
        preconditions:
          - "completed_shift_count == required_shift_count"
        side_effects:
          - "application.experience_verdict = PASS"

      - from: IN_PROGRESS
        to: SHORTFALL
        trigger: "system (automatic at logical-clock midnight after ends_on + 1 day when completed_shift_count < required_shift_count)"
        actor: system
        preconditions: []
        side_effects:
          - "application.experience_verdict = FAIL"

      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /franchise/applications/{applicationId}/experiences/{experienceId}/cancel"
        actor: FieldConsultant
        preconditions: []
        side_effects: []

  - entity: Operator
    initial_state: ONBOARDING
    terminal_states: [EXITED]
    transitions:
      - from: ONBOARDING
        to: ACTIVE
        trigger: "POST /franchise/operators/{operatorId}/activate"
        actor: FieldConsultant
        preconditions:
          - "operator.residency_verified == true"
          - "operator.full_time_attested == true"
          - "linked OperatorAgreement.agreement_status == EXECUTED"
          - "linked Restaurant.restaurant_status == ASSIGNED with current_operator_id == this operator"
        side_effects: []

      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /franchise/operators/{operatorId}/suspend"
        actor: FieldConsultant
        preconditions:
          - "operator.operator_status == ACTIVE"
        side_effects:
          - "linked OperatorAgreement cascades EXECUTED -> SUSPENDED"

      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /franchise/operators/{operatorId}/reinstate"
        actor: FieldConsultant
        preconditions:
          - "operator.residency_verified == true"
        side_effects:
          - "linked OperatorAgreement cascades SUSPENDED -> EXECUTED"

      - from: ACTIVE
        to: EXITING
        trigger: "POST /franchise/operators/{operatorId}/exits (opening an ExitCase)"
        actor: Operator
        preconditions:
          - "operator.operator_status == ACTIVE"
          - "no OPEN / SUCCESSOR_PENDING / SUCCESSOR_APPROVED ExitCase exists for the operator"
        side_effects:
          - "ExitCase created in OPEN status"

      - from: EXITING
        to: EXITED
        trigger: "system (automatic when the ExitCase completes)"
        actor: system
        preconditions: []
        side_effects:
          - "linked OperatorAgreement cascades to TERMINATED"
          - "linked Restaurant.restaurant_status -> AVAILABLE and current_operator_id cleared"

  - entity: OperatorAgreement
    initial_state: DRAFT
    terminal_states: [TERMINATED]
    transitions:
      - from: DRAFT
        to: EXECUTED
        trigger: "POST /franchise/operators/{operatorId}/agreement/execute"
        actor: SelectionCommittee
        preconditions:
          - "agreement.agreement_status == DRAFT"
          - "agreement.effective_from >= logical clock now"
          - "operator.operator_status == ONBOARDING"
        side_effects:
          - "linked Restaurant.restaurant_status -> ASSIGNED, current_operator_id set"

      - from: EXECUTED
        to: SUSPENDED
        trigger: "system (cascade from Operator.suspend)"
        actor: system
        preconditions: []
        side_effects: []

      - from: SUSPENDED
        to: EXECUTED
        trigger: "system (cascade from Operator.reinstate)"
        actor: system
        preconditions: []
        side_effects: []

      - from: EXECUTED
        to: TERMINATED
        trigger: "system (cascade from completed ExitCase)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: OperatingWeek
    initial_state: PLANNED
    terminal_states: [CLOSED]
    transitions:
      - from: PLANNED
        to: OPEN
        trigger: "system (automatic at logical-clock midnight when week_start_on is reached)"
        actor: system
        preconditions: []
        side_effects: []

      - from: OPEN
        to: CLOSED
        trigger: "POST /franchise/restaurants/{restaurantId}/weeks/{weekId}/close"
        actor: FieldConsultant
        preconditions:
          - "week.week_status == OPEN"
          - "actual_revenue_cents supplied and >= 0"
          - "logical clock is at or past week_start_on + 6 days (the six operating days elapsed; Sunday excluded)"
        side_effects:
          - "a PROVISIONAL RevenueShareStatement is issued for the restaurant's current operator"

  - entity: Scorecard
    initial_state: DRAFT
    terminal_states: [FINAL]
    transitions:
      - from: DRAFT
        to: PUBLISHED
        trigger: "POST /franchise/operators/{operatorId}/scorecards/{scorecardId}/publish"
        actor: FieldConsultant
        preconditions:
          - "operator.operator_status IN {ACTIVE, SUSPENDED}"
          - "no overlapping PUBLISHED / DISPUTED / FINAL Scorecard exists for the operator over [period_start_on, period_end_on)"
        side_effects:
          - "composite_score and rating computed per scorecard_composite"
          - "if rating == CRITICAL: operator cascades ACTIVE -> SUSPENDED (conditional cascade)"

      - from: PUBLISHED
        to: DISPUTED
        trigger: "POST /franchise/operators/{operatorId}/scorecards/{scorecardId}/dispute"
        actor: Operator
        preconditions:
          - "scorecard.scorecard_status == PUBLISHED"
        side_effects: []

      - from: DISPUTED
        to: PUBLISHED
        trigger: "POST /franchise/operators/{operatorId}/scorecards/{scorecardId}/republish"
        actor: FieldConsultant
        preconditions: []
        side_effects:
          - "composite_score and rating recomputed per scorecard_composite"
        note: "revision loop — dispute cycles back to PUBLISHED"

      - from: PUBLISHED
        to: FINAL
        trigger: "POST /franchise/operators/{operatorId}/scorecards/{scorecardId}/finalize"
        actor: FieldConsultant
        preconditions:
          - "logical clock is at or past period_end_on + SCORECARD_FINALIZE_GRACE_DAYS"
        side_effects: []

      - from: DISPUTED
        to: FINAL
        trigger: "POST /franchise/operators/{operatorId}/scorecards/{scorecardId}/finalize"
        actor: FieldConsultant
        preconditions:
          - "logical clock is at or past period_end_on + SCORECARD_FINALIZE_GRACE_DAYS"
        side_effects: []

  - entity: RelocationRequest
    initial_state: SUBMITTED
    terminal_states: [APPROVED, DENIED, WITHDRAWN]
    transitions:
      - from: SUBMITTED
        to: COMMITTEE_REVIEW
        trigger: "POST /franchise/operators/{operatorId}/relocation-requests/{requestId}/open-review"
        actor: SelectionCommittee
        preconditions:
          - "operator.operator_status == ACTIVE"
          - "target_restaurant.restaurant_status == AVAILABLE"
        side_effects: []

      - from: COMMITTEE_REVIEW
        to: APPROVED
        trigger: "POST /franchise/operators/{operatorId}/relocation-requests/{requestId}/decide"
        actor: SelectionCommittee
        preconditions:
          - "votes_for >= COMMITTEE_QUORUM"
          - "votes_for > votes_against"
        side_effects:
          - "RELOCATION: operator.restaurant_id moves to target; source Restaurant -> AVAILABLE with current_operator_id cleared; target Restaurant -> ASSIGNED with current_operator_id set"
          - "SECOND_LOCATION: rejected at decide time unless operator holds exactly one restaurant — a SECOND_LOCATION approval is only valid when the operator's current restaurant count is exactly 1 (single-unit rule); the target restaurant is ASSIGNED to the operator and the exception recorded"

      - from: COMMITTEE_REVIEW
        to: DENIED
        trigger: "POST /franchise/operators/{operatorId}/relocation-requests/{requestId}/decide"
        actor: SelectionCommittee
        preconditions:
          - "votes_against >= COMMITTEE_QUORUM OR votes_for <= votes_against"
        side_effects: []

      - from: SUBMITTED
        to: WITHDRAWN
        trigger: "POST /franchise/operators/{operatorId}/relocation-requests/{requestId}/withdraw"
        actor: Operator
        preconditions: []
        side_effects: []

  - entity: ExitCase
    initial_state: OPEN
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: OPEN
        to: SUCCESSOR_PENDING
        trigger: "POST /franchise/operators/{operatorId}/exits/{exitId}/propose-successor"
        actor: FieldConsultant
        preconditions:
          - "successor_candidate.candidate_status == SELECTED"
          - "successor candidate's approved application targets the exiting operator's restaurant market"
        side_effects: []

      - from: SUCCESSOR_PENDING
        to: SUCCESSOR_APPROVED
        trigger: "POST /franchise/operators/{operatorId}/exits/{exitId}/approve-successor"
        actor: SelectionCommittee
        preconditions: []
        side_effects: []

      - from: SUCCESSOR_PENDING
        to: OPEN
        trigger: "POST /franchise/operators/{operatorId}/exits/{exitId}/reject-successor"
        actor: SelectionCommittee
        preconditions: []
        side_effects:
          - "successor_candidate_id cleared"
        note: "revision loop — successor search restarts"

      - from: SUCCESSOR_APPROVED
        to: COMPLETED
        trigger: "POST /franchise/operators/{operatorId}/exits/{exitId}/complete"
        actor: FieldConsultant
        preconditions:
          - "logical clock is at or past effective_on"
          - "a FINAL RevenueShareStatement exists for the operator's most recent CLOSED OperatingWeek"
        side_effects:
          - "final_statement_id linked"
          - "Operator EXITING -> EXITED; agreement TERMINATED; restaurant AVAILABLE"
          - "successor Operator record created in ONBOARDING bound to a fresh DRAFT OperatorAgreement for the same restaurant"

      - from: OPEN
        to: CANCELLED
        trigger: "POST /franchise/operators/{operatorId}/exits/{exitId}/cancel"
        actor: Operator
        preconditions:
          - "exit_case.exit_status == OPEN"
        side_effects:
          - "Operator EXITING -> ACTIVE"

  - entity: RevenueShareStatement
    initial_state: ISSUED
    terminal_states: [SETTLED, VOID]
    transitions:
      - from: ISSUED
        to: SETTLED
        trigger: "POST /franchise/statements/{statementId}/settle"
        actor: FinanceAdmin
        preconditions:
          - "statement.statement_status == ISSUED"
        side_effects:
          - "operator.lifetime_revenue_share_cents += operator_share_cents"

      - from: ISSUED
        to: VOID
        trigger: "POST /franchise/statements/{statementId}/void"
        actor: FinanceAdmin
        preconditions:
          - "statement.statement_kind == PROVISIONAL"
        side_effects: []
        note: "FINAL statements are never voidable"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: committee-decision-stale-application
    parent_entity: Application
    write_endpoint: "POST /franchise/applications/{applicationId}/committee-decision"
    occ_field: "expected_application_version"
    description: |
      Recording a committee decision against an Application whose version has
      advanced since the committee member last read it is rejected with 412.
      A decision that legitimately landed in between (which moved the
      application out of COMMITTEE_REVIEW and bumped its version) makes the
      current writer's view of the application stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: week-close-stale-week
    parent_entity: OperatingWeek
    write_endpoint: "POST /franchise/restaurants/{restaurantId}/weeks/{weekId}/close"
    occ_field: "expected_week_version"
    description: |
      Closing an OperatingWeek whose version has advanced since the caller
      last read it is rejected with 412. A prior close (which moved the week
      to CLOSED, issued the provisional statement, and bumped the version)
      makes the current caller's view of the week stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: screening_score
    trigger: "Application creation"
    algorithm: weighted_scoring
    formula: |
      capital_component = min(candidate.liquid_capital_cents, CAPITAL_REFERENCE_CENTS) * 40 / CAPITAL_REFERENCE_CENTS
      market_component = (40 if application.target_market_code == candidate.home_market_code else (20 if candidate.relocation_willing else 0))
      name_component = min(length(candidate.legal_name), 20)
      screening_score = floor(capital_component + market_component + name_component)
    input_set: "the Candidate row and the Application being created"
    constants:
      CAPITAL_REFERENCE_CENTS: 1000000
      SCREENING_PASS_SCORE: 60
    precision: "integer, floor"

  - name: interview_average
    trigger: "InterviewRound score submission or cancellation"
    algorithm: aggregation
    formula: |
      scored = [r.score for r in InterviewRound where r.application_id == application.id and r.status == SUBMITTED]
      interview_average = (sum(scored) / len(scored)) rounded to 2 decimal places when scored non-empty else null
    input_set: "only SUBMITTED InterviewRounds of the application; SCHEDULED and CANCELLED rounds are excluded"
    constants:
      MIN_INTERVIEW_ROUNDS: 2
      INTERVIEW_PASS_SCORE: 70
    precision: "2 decimal places, round_half_up"

  - name: assessment_rubric
    trigger: "BusinessAssessment evaluation"
    algorithm: weighted_scoring
    formula: |
      plan_component = min(length(assessment.market_plan_text), 2000) * 50 / 2000
      projection_component = min(assessment.financial_projection_cents, PROJECTION_REFERENCE_CENTS) * 50 / PROJECTION_REFERENCE_CENTS
      rubric_score = floor(plan_component + projection_component)
    input_set: "the single SUBMITTED BusinessAssessment of the application"
    constants:
      PROJECTION_REFERENCE_CENTS: 500000000
      ASSESSMENT_PASS_SCORE: 55
    precision: "integer, floor"

  - name: experience_required_shifts
    trigger: "InRestaurantExperience creation"
    algorithm: interval_merge
    formula: |
      required_shift_count = count of calendar dates d in [starts_on, ends_on] inclusive whose weekday is not Sunday
    input_set: "the experience block's start and end dates"
    precision: "integer day count"

  - name: weekly_forecast
    trigger: "OperatingWeek creation"
    algorithm: dual_variant
    formula: |
      # Six-day operating calendar: the closed Sunday is removed from the week.
      # Variant PROVISIONAL (default, at planning time):
      forecast_revenue_cents = round_half_up(restaurant.baseline_weekly_revenue_cents * 6 / 7)
      planned_labor_hours = ceil(forecast_revenue_cents / LABOR_DOLLAR_PER_HOUR_CENTS)
      # Variant TRAILING (used when the restaurant has >= 1 CLOSED week on file):
      forecast_revenue_cents = round_half_up(avg(actual_revenue_cents over the restaurant's 4 most recent CLOSED OperatingWeeks, tie-break week_start_on DESC))
      planned_labor_hours = ceil(forecast_revenue_cents / LABOR_DOLLAR_PER_HOUR_CENTS)
    input_set: "PROVISIONAL: the restaurant baseline. TRAILING: the 4 most recent CLOSED OperatingWeeks of the same restaurant, ordered week_start_on DESC; fewer than 4 closed weeks averages what exists."
    constants:
      LABOR_DOLLAR_PER_HOUR_CENTS: 15000
    precision: "cents integer, round_half_up; hours integer, ceil"
    variants:
      - name: PROVISIONAL
        when: "restaurant has no CLOSED OperatingWeek"
        difference: "derives the forecast from baseline_weekly_revenue_cents * 6/7 — the closed-Sunday adjustment applied to the seven-day baseline"
      - name: TRAILING
        when: "restaurant has at least one CLOSED OperatingWeek"
        difference: "derives the forecast from the trailing average of actuals, ignoring the baseline entirely"

  - name: revenue_share_split
    trigger: "OperatingWeek close (PROVISIONAL statement) and ExitCase completion pre-check (FINAL statement)"
    algorithm: tiered_pricing
    formula: |
      # Evaluation order is pinned: fee first, occupancy second, share last.
      brand_fee_cents = round_half_up(gross_revenue_cents * BRAND_FEE_BPS / 10000)
      net_after_fee_cents = gross_revenue_cents - brand_fee_cents
      occupancy_charge_cents = round_half_up(net_after_fee_cents * OCCUPANCY_BPS / 10000)
      shareable_cents = net_after_fee_cents - occupancy_charge_cents
      # Tiered operator share on the shareable base:
      #   tier 1: first SHARE_TIER1_CENTS at agreement.base_share_bps
      #   tier 2: remainder at agreement.base_share_bps - TIER2_DISCOUNT_BPS (floored at 0)
      tier1_cents = min(shareable_cents, SHARE_TIER1_CENTS)
      tier2_cents = shareable_cents - tier1_cents
      tier1_bps = agreement.base_share_bps
      tier2_bps = max(agreement.base_share_bps - TIER2_DISCOUNT_BPS, 0)
      operator_share_cents = round_half_up(tier1_cents * tier1_bps / 10000) + round_half_up(tier2_cents * tier2_bps / 10000)
    input_set: "the CLOSED OperatingWeek's actual_revenue_cents as gross_revenue_cents and the operator's EXECUTED agreement"
    constants:
      BRAND_FEE_BPS: 1500
      OCCUPANCY_BPS: 800
      SHARE_TIER1_CENTS: 50000000
      TIER2_DISCOUNT_BPS: 500
    precision: "cents integer, round_half_up per line then summed — tier1 and tier2 are rounded independently before addition"
    variants:
      - name: PROVISIONAL
        when: "statement issued automatically at week close"
        difference: "statement_kind = PROVISIONAL; voidable; does not gate exit completion"
      - name: FINAL
        when: "statement re-issued via POST /franchise/statements/{statementId}/finalize during an open ExitCase"
        difference: "statement_kind = FINAL; not voidable; required for exit completion; identical formula, different lifecycle"

  - name: scorecard_composite
    trigger: "Scorecard publish and republish"
    algorithm: weighted_scoring
    formula: |
      composite_score = floor(food_safety_score * W_FOOD + service_speed_score * W_SPEED + community_engagement_score * W_COMMUNITY)
      if composite_score >= RATING_EXCEEDS_MIN: rating = EXCEEDS
      else if composite_score >= RATING_MEETS_MIN: rating = MEETS
      else if composite_score >= RATING_BELOW_MIN: rating = BELOW
      else: rating = CRITICAL
    input_set: "the three component scores of the scorecard"
    constants:
      W_FOOD: 0.5
      W_SPEED: 0.3
      W_COMMUNITY: 0.2
      RATING_EXCEEDS_MIN: 90
      RATING_MEETS_MIN: 70
      RATING_BELOW_MIN: 50
    precision: "integer composite, floor; rating boundary uses >="

  - name: global_operating_constants
    trigger: "referenced by state machines and validations"
    algorithm: threshold
    formula: |
      APPLICATION_TTL_DAYS = 30        # SUBMITTED applications auto-expire after this many days
      COMMITTEE_QUORUM = 3             # minimum votes needed on the winning side of a relocation decide
      MIN_NOTICE_DAYS = 30             # exit effective_on must be >= notice_given_on + 30 days
      SCORECARD_FINALIZE_GRACE_DAYS = 7  # scorecard finalize allowed at period_end_on + 7 days
      INITIAL_COMMITMENT_CENTS = 1000000  # the low initial financial commitment charged at COMMITTEE_REVIEW entry
    input_set: "global constants; no entity inputs"
    precision: "exact integers"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and role is one of the declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "role is permitted for the endpoint per the RBAC matrix"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "every path-segment id exists, validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all id-addressed endpoints"

  - priority: 4
    category: state
    check: "target resource is in a state that permits the requested transition"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action endpoints"

  - priority: 5
    category: business_safety
    check: "food-safety-first: a scorecard publish whose composite would land CRITICAL requires the operator to be in ACTIVE or SUSPENDED and immediately suspends an ACTIVE operator; publishing against an ONBOARDING or EXITING/EXITED operator is refused outright"
    error_id: ERR_OPERATOR_NOT_SCORABLE
    http_status: 409
    applies_to: "POST /franchise/operators/{operatorId}/scorecards/{scorecardId}/publish"

  - priority: 6
    category: business_constraint
    check: "single-restaurant restriction: operator may be linked to at most one ASSIGNED restaurant; SECOND_LOCATION approvals are refused when the operator already operates more than one restaurant"
    error_id: ERR_SINGLE_UNIT_VIOLATION
    http_status: 422
    applies_to: "relocation decide, agreement execute"

  - priority: 7
    category: business_constraint
    check: "non-transferable, non-equity agreement: transferable must remain false and equity_stake_bps must remain 0; any write attempting to set them otherwise is refused"
    error_id: ERR_AGREEMENT_IMMUTABLE
    http_status: 422
    applies_to: "agreement execute, agreement patch"

  - priority: 8
    category: business_temporal
    check: "closed-Sunday calendar: an InRestaurantExperience block must span at least one non-Sunday operating day; a block that is exactly one Sunday long is refused"
    error_id: ERR_NO_OPERATING_DAYS
    http_status: 422
    applies_to: "POST /franchise/applications/{applicationId}/experiences"

  - priority: 9
    category: business_temporal
    check: "week close allowed only at or after week_start_on + 6 days on the logical clock"
    error_id: ERR_WEEK_NOT_ELAPSED
    http_status: 409
    applies_to: "POST /franchise/restaurants/{restaurantId}/weeks/{weekId}/close"

  - priority: 10
    category: business_temporal
    check: "exit effective_on must be >= notice date + MIN_NOTICE_DAYS"
    error_id: ERR_NOTICE_TOO_SHORT
    http_status: 422
    applies_to: "POST /franchise/operators/{operatorId}/exits"

  - priority: 11
    category: business_referential
    check: "interview round score requires the application to be in INTERVIEWS stage"
    error_id: ERR_STAGE_MISMATCH
    http_status: 409
    applies_to: "POST /franchise/applications/{applicationId}/interviews/{roundId}/score"

  - priority: 12
    category: business_referential
    check: "proposed successor must be a SELECTED candidate whose approved application targets the exiting operator's restaurant market"
    error_id: ERR_SUCCESSOR_INELIGIBLE
    http_status: 422
    applies_to: "POST /franchise/operators/{operatorId}/exits/{exitId}/propose-successor"

  - priority: 13
    category: business_constraint
    check: "overlap: an operator may not hold two PUBLISHED / DISPUTED / FINAL scorecards whose [period_start_on, period_end_on) windows intersect"
    error_id: ERR_SCORECARD_OVERLAP
    http_status: 409
    applies_to: "scorecard publish"

  - priority: 14
    category: business_fiscal
    check: "revenue share math fields (gross_revenue_cents, brand_fee_cents, occupancy_charge_cents, operator_share_cents) are computed server-side; client-supplied values are ignored, and a week close with missing actual_revenue_cents is refused"
    error_id: ERR_MISSING_ACTUALS
    http_status: 400
    applies_to: "week close"

  - priority: 15
    category: business_fiscal
    check: "one RevenueShareStatement per (operator, operating_week); a second issue for the same week is refused"
    error_id: ERR_DUPLICATE_STATEMENT
    http_status: 409
    applies_to: "week close, statement finalize"

  - priority: 16
    category: business_constraint
    check: "one OperatingWeek per (restaurant, week_start_on); a second create with the same week_start_on is refused"
    error_id: ERR_DUPLICATE_WEEK
    http_status: 409
    applies_to: "POST /franchise/restaurants/{restaurantId}/weeks"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Clock (test-driving) ---
  - method: POST
    path: "/franchise/_clock/set_current_utc"
    description: "Set the logical clock. Before any call, the clock reads exactly 2026-09-01T00:00:00Z and MUST NOT fall back to wall-clock time."
    roles: [SystemAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["scheduled automatic transitions re-evaluated (application expiry, experience start/shortfall, week open)"]

  # --- Candidate ---
  - method: POST
    path: "/franchise/candidates"
    description: "Register a candidate"
    roles: [SystemAdmin]
    code: 201
    input: [legal_name, email, home_market_code, relocation_willing, liquid_capital_cents]
    output: Candidate
    side_effects: ["candidate_status = REGISTERED"]

  - method: GET
    path: "/franchise/candidates/{candidateId}"
    description: "Get a candidate"
    roles: [SystemAdmin, FieldConsultant, SelectionCommittee, Candidate]
    code: 200
    input: []
    output: Candidate
    side_effects: []

  - method: GET
    path: "/franchise/candidates"
    description: "List candidates with filters"
    roles: [SystemAdmin, FieldConsultant, SelectionCommittee]
    code: 200
    input: ["candidate_status?", "home_market_code?", "active_application_id?", "limit?", "offset?"]
    output: "Candidate[]"
    side_effects: []

  - method: POST
    path: "/franchise/candidates/{candidateId}/withdraw"
    description: "Withdraw a candidate"
    roles: [Candidate]
    code: 200
    input: []
    output: Candidate
    side_effects: ["active application cascades to WITHDRAWN", "increments Candidate.version by 1"]

  - method: POST
    path: "/franchise/candidates/{candidateId}/disqualify"
    description: "Disqualify a candidate"
    roles: [FieldConsultant]
    code: 200
    input: []
    output: Candidate
    side_effects: ["active application cascades to REJECTED", "increments Candidate.version by 1"]

  # --- Application ---
  - method: POST
    path: "/franchise/candidates/{candidateId}/applications"
    description: "Submit an application for a candidate"
    roles: [Candidate]
    code: 201
    input: [target_market_code]
    output: Application
    side_effects: ["candidate REGISTERED -> IN_SELECTION", "screening_score computed", "submitted_at stamped from logical clock", "increments Candidate.version by 1"]

  - method: GET
    path: "/franchise/applications/{applicationId}"
    description: "Get an application"
    roles: [SystemAdmin, FieldConsultant, SelectionCommittee, Candidate]
    code: 200
    input: []
    output: Application
    side_effects: []

  - method: GET
    path: "/franchise/applications"
    description: "List applications"
    roles: [SystemAdmin, FieldConsultant, SelectionCommittee]
    code: 200
    input: ["candidate_id?", "stage?", "target_market_code?", "limit?", "offset?"]
    output: "Application[]"
    side_effects: []

  - method: POST
    path: "/franchise/applications/{applicationId}/advance"
    description: "Advance the application one pipeline stage"
    roles: [FieldConsultant]
    code: 200
    input: []
    output: Application
