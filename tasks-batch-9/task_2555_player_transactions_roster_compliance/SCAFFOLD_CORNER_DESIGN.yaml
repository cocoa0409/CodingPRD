          setup:
            - "Logical clock at 2026-08-10T14:00:00Z."
            - "Harbor Kings issued a RESTRICTED_TENDER at FIRST_ROUND to Ray Alder (400 accrued active days, RESTRICTED, UNROSTERED) on a prior base of 50000000."
            - "issued_at + TENDER_RESPONSE_HOURS 72 == 2026-08-13T14:00:00Z, which is inside the processing window, so the snap leaves it unchanged."
            - "The clock is then advanced to 2026-08-13T14:00:01Z and no compliance sweep is run."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T14:00:00Z" }
              as: LeagueOfficer
            - call: "POST /teams"
              payload: { name: "Harbor Kings", market_code: "HKG", salary_cap_limit_cents: 500000000, waiver_priority_rank: 1 }
              as: LeagueOfficer
              captures: { td_team_id: $.data.id }
