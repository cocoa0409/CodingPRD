      - name: rbac_missing_auth_headers_unauthenticated
        claim_type: Cannot Perform
        grounds: ["validations[priority=1]"]
        distinguishing_aspect: "POST /patients with no X-User-Role / X-User-ID returns 401 ERR_UNAUTHENTICATED."
        test_recipe:
