  - rule_id: cross_entity_state_dependency
    instances:
      - name: order_acknowledge_gated_by_account_status
        grounds:
          - state_machines.Order.SUBMITTED_to_ACKNOWLEDGED
          - state_machines.Account
          - "errors[ERR_ACCOUNT_NOT_ACTIVE]"
        distinguishing_aspect: |
          Entity pair Order -> Account: the ACKNOWLEDGED transition reads the
          Account aggregate's status; SUSPENDED blocks it with
          ERR_ACCOUNT_NOT_ACTIVE and re-activation reopens it. Distinct pair from
          DamageClaim -> Shipment.
        test_recipe:
          setup:
            - "Dealer account, program ACTIVE with F1 line; order SUBMITTED"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: PlatformAdmin }
            - call: "POST /cabinet/accounts"
