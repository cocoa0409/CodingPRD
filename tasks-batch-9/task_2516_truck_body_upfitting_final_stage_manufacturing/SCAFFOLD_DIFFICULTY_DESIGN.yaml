  - rule_id: compensating_invariant
    instances:
      - name: pto_flow_conservation_across_install_and_remove
        grounds:
          - calculations.pto_flow_waterfall
          - calculations.aux_electrical_load
          - entities.UpfitOrder.fields.committed_pto_flow_gpm
          - entities.EquipmentInstallation.fields.allocated_flow_gpm
        distinguishing_aspect: |
          The invariant committed_pto_flow_gpm == sum of required_flow_gpm over the order's
          non-REMOVED PTO installations must hold before, during and after a reversal: 8 gpm with the
          crane alone, 14 gpm once a 6 gpm auxiliary pump is planned, and exactly 8 gpm again after
          the pump is removed — with the amp ledger tracking it at 22 / 26 / 22 A. An implementation
          that adds on install but forgets to subtract on remove leaks 6 gpm of phantom hydraulic
          demand.
        test_recipe:
          setup:
            - "ChassisModel F550-DRW-84CA with pto_max_flow_gpm 18 and max_aux_amp_draw 60."
            - "BodySpec SERVICE-11FT drawing 12 A; EquipmentSpecs CRANE-6000 (8 gpm, 10 A, duty 1) and PTO-PUMP-AUX (120 lb, PTO, 6 gpm, 4 A, duty 4, BODY_FLOOR, 145000 cents)."
            - "A CUSTOMER_SPECIFIC order with the chassis ALLOCATED and one PLANNED CRANE-6000 installation on the PRIMARY circuit."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlantAdmin
            - call: "POST /upfit/chassis-models"
              payload: { code: "F550-DRW-84CA", make: "FORD", gvwr_lb: 19500, front_gawr_lb: 7000, rear_gawr_lb: 14706, wheelbase_in: 200, cab_to_axle_in: 84, curb_front_axle_lb: 4820, curb_rear_axle_lb: 2680, max_aux_amp_draw: 60, electrical_bus: "J1939_CAN", pto_provision: "FULL", pto_max_flow_gpm: 18, body_builder_book_rev: "BBB-2026.1", incomplete_vehicle_document_rev: "IVD-2026.1" }
              as: PlantAdmin
              captures: { cm_a: "$.data.id" }
            - call: "POST /upfit/body-specs"
              payload: { code: "SERVICE-11FT", body_type: "SERVICE", weight_lb: 2100, cg_from_body_front_in: 62, cargo_cg_from_body_front_in: 66, length_in: 132, required_min_ca_in: 84, required_min_wheelbase_in: 189, aux_amp_draw: 12, requires_hydraulics: false, list_price_cents: 1450000 }
              as: PlantAdmin
              captures: { bs_svc: "$.data.id" }
            - call: "POST /upfit/equipment-specs"
              payload: { code: "CRANE-6000", equipment_class: "CRANE", weight_lb: 1250, requires_pto: true, required_flow_gpm: 8, aux_amp_draw: 10, duty_priority: 1, mount_zone: "BEHIND_CAB", requires_can_gateway: false, list_price_cents: 780000 }
              as: PlantAdmin
              captures: { es_crane: "$.data.id" }
            - call: "POST /upfit/equipment-specs"
              payload: { code: "PTO-PUMP-AUX", equipment_class: "PTO_PUMP", weight_lb: 120, requires_pto: true, required_flow_gpm: 6, aux_amp_draw: 4, duty_priority: 4, mount_zone: "BODY_FLOOR", requires_can_gateway: false, list_price_cents: 145000 }
              as: PlantAdmin
              captures: { es_pump: "$.data.id" }
            - call: "POST /upfit/customers"
              payload: { name: "Metro Fleet Services", account_code: "MFS-001", fleet_contact_email: "fleet@metro.example" }
              as: PlantAdmin
              captures: { cust: "$.data.id" }
            - call: "POST /upfit/build-configurations"
              payload: { config_code: "CFG-SVC-A", chassis_model_id: "${cm_a}", body_spec_id: "${bs_svc}", standardization_tier: "CUSTOM" }
              as: UpfitEngineer
              as_user_id: "eng-1"
              captures: { cfg: "$.data.id" }
            - call: "POST /upfit/build-configurations/${cfg}/publish"
              payload: {}
              as: UpfitEngineer
              as_user_id: "eng-1"
            - call: "POST /upfit/chassis"
              payload: { vin: "1FDUF5HT0AA10018", chassis_model_id: "${cm_a}", ownership: "POOL_STOCK", availability_date: "2026-08-05" }
              as: PlantAdmin
              captures: { ch: "$.data.id" }
            - call: "POST /upfit/chassis/${ch}/inspect"
              payload: { measured_front_axle_weight_lb: 4820, measured_rear_axle_weight_lb: 2680 }
              as: InstallTechnician
              as_user_id: "tech-1"
              captures: { ch_v: "$.data.version" }
            - call: "POST /upfit/upfit-orders"
              payload: { order_number: "UO-2801", order_type: "CUSTOMER_SPECIFIC", customer_id: "${cust}", build_configuration_id: "${cfg}", body_mount_offset_from_front_axle_in: 120, required_payload_lb: 5000, requested_in_service_date: "2026-09-20" }
              as: ProductionScheduler
              as_user_id: "ps-1"
              captures: { uo: "$.data.id" }
            - call: "POST /upfit/upfit-orders/${uo}/allocate-chassis"
              payload: { chassis_id: "${ch}", expected_chassis_version: "${ch_v}" }
              as: ProductionScheduler
              as_user_id: "ps-1"
            - call: "POST /upfit/equipment-installations"
              payload: { upfit_order_id: "${uo}", equipment_spec_id: "${es_crane}", mount_cg_from_front_axle_in: 208, hydraulic_circuit: "PRIMARY" }
              as: InstallTechnician
              as_user_id: "tech-1"
              captures: { ei_crane: "$.data.id" }
          trigger:
            - call: "POST /upfit/equipment-installations"
              payload: { upfit_order_id: "${uo}", equipment_spec_id: "${es_pump}", mount_cg_from_front_axle_in: 150, hydraulic_circuit: "SECONDARY" }
              as: InstallTechnician
              as_user_id: "tech-1"
              captures: { ei_pump: "$.data.id" }
            - call: "POST /upfit/equipment-installations/${ei_pump}/remove"
              payload: { reason: "auxiliary pump deleted from the build sheet" }
              as: InstallTechnician
              as_user_id: "tech-1"
          assert:
            - "before the trigger UpfitOrder.${uo}.committed_pto_flow_gpm == 8 and committed_aux_amp_draw == 22"
            - "after the pump was planned UpfitOrder.${uo}.committed_pto_flow_gpm == 14 and committed_aux_amp_draw == 26"
            - "after the pump was removed UpfitOrder.${uo}.committed_pto_flow_gpm == 8"
            - "after the pump was removed UpfitOrder.${uo}.committed_aux_amp_draw == 22"
            - "EquipmentInstallation.${ei_pump}.status == REMOVED"
            - "EquipmentInstallation.${ei_pump}.allocated_flow_gpm == 0"
            - "EquipmentInstallation.${ei_pump}.hydraulic_status == NOT_APPLICABLE"
            - "EquipmentInstallation.${ei_crane}.allocated_flow_gpm == 8"
            - "EquipmentInstallation.${ei_crane}.hydraulic_status == OK"
            - "at every observation UpfitOrder.${uo}.committed_pto_flow_gpm equals the sum of EquipmentSpec.required_flow_gpm over the order's PTO installations in status IN {PLANNED, INSTALLED, COMMISSIONED}"
            - "the crane's grant never changed: the duty_priority 1 crane is served before the duty_priority 4 pump in the waterfall"

      - name: warranty_cents_conservation_across_dispute_and_readjudication
        grounds:
          - calculations.warranty_liability_split
          - state_machines.WarrantyClaim.status.ADJUDICATED_to_DISPUTED
