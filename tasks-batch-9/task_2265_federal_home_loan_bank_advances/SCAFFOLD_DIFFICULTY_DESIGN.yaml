  # ===========================================================================
  # RULE 4 — transitive_cascade
  # ===========================================================================
  - rule_id: transitive_cascade
    applied: true
    summary: |
      Two chains in which every link is caused by the immediately preceding link: closing
      a failing verification review propagates five levels from review scoring down to
      community subsidy release, and settling a full prepayment propagates three levels
      from the event up to another advance's collateral dimension.
    instances:
      - name: review_close_fail_cascades_five_levels_to_subsidy_release
        depth: 5
        grounds:
          - "state_machines.CollateralVerificationReview.FINDINGS_ISSUED_to_CLOSED (L1..L5)"
          - "calculations.verification_exception_rate"
          - "calculations.asset_discount_factor"
          - "calculations.collateral_posture_recompute"
          - "calculations.shortfall_cure_requirement"
          - "calculations.setaside_waterfall_commit (release path)"
        distinguishing_aspect: |
          A five-level chain, each link strictly caused by the previous one and impossible
          without it: L1 review scoring sets the member haircut; ONLY BECAUSE the haircut
          changed, L2 re-prices every pledged asset and suspends the ones carrying
          UNRESOLVED findings; ONLY BECAUSE asset values fell, L3 drives borrowing capacity
          negative; ONLY BECAUSE capacity went negative, L4 freezes the posture, opens a
          shortfall and cancels the pending advances; ONLY BECAUSE those advances were
          cancelled, L5 releases their subsidy commitments and reopens a CLOSED allocation.
          This chain is triggered by an audit close and terminates in a funding pool.
          Instance 2 is a shallower chain triggered by a cash settlement and terminates in
          a sibling advance's collateral dimension.
        test_recipe:
          setup: |
            Harbor Savings tier 1, total assets 8,000,000,000, THRIFT, BLANKET_LIEN pledge,
            community_lending_eligible true. Three ELIGIBLE assets: A1 SF_MORTGAGE
            (15,600,000), A2 CRE (22,560,000 after the 500 bps LTV and 300 bps stale
            appraisal penalties), A3 HELOC (500,000); lendable 38,660,000. Advance D of
            gross 30,000,000 FUNDED (activity stock 1,350,000 pre-purchased). Community
            allocation CIP 2026 with total_pool 400,000 at 75 bps: buckets 140,000 /
            100,000 / 160,000. Advance E gross 1,500,000 CREDIT_APPROVED with a 300,000
            FIRST_TIME_HOMEBUYER subsidy (140,000 in the purpose bucket, 160,000 spilled to
            GENERAL) and advance F gross 1,000,000 CREDIT_APPROVED with a 100,000
            REHABILITATION subsidy, which drives remaining_cents to 0 and CLOSES the
            allocation. Review over [2026-08-01, 2026-08-20) with sample_size 40 carries 4
            MAJOR findings against A3.
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { now: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /fhlb/member-banks"
              payload: { name: "Harbor Savings", charter_type: "THRIFT", total_assets_cents: 8000000000, credit_rating_tier: 1 }
              as: SystemAdmin
              captures: { member_id: "$.data.id" }
            - call: "POST /fhlb/stock-subscriptions"
              payload: { member_bank_id: "${member_id}", subscription_type: "MEMBERSHIP", amount_cents: 9600000 }
              as: CreditOfficer
              captures: { sub_membership: "$.data.id" }
            - call: "POST /fhlb/stock-subscriptions/${sub_membership}/issue"
              payload: {}
              as: CreditOfficer
            - call: "POST /fhlb/member-banks/${member_id}/activate"
              payload: {}
              as: CreditOfficer
            - call: "POST /fhlb/member-banks/${member_id}/pledge-agreement"
              payload: { pledge_mode: "BLANKET_LIEN", effective_date: "2026-08-01T00:00:00Z" }
              as: CreditOfficer
            - call: "POST /fhlb/collateral-assets"
              payload: { member_bank_id: "${member_id}", asset_class: "SF_MORTGAGE", unpaid_principal_balance_cents: 20000000, market_value_cents: 21000000, ltv_bps: 7500, appraisal_date: "2026-06-01T00:00:00Z" }
              as: TreasuryOfficer
