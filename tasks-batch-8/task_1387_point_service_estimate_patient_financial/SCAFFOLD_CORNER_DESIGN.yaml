              payload: { mrn: "MRN-V-4", full_name: "Pat NoContract", date_of_birth: "1993-04-04" }
              as: Registrar
              captures: { pat_id: $.data.id, pat_v: $.data.version }
            - call: "POST /clearance/patients/${pat_id}/eligibility-snapshots"
              payload: { expected_patient_version: "${pat_v}", payer_code: "NOPE", member_id: "M-V4", deductible_total_cents: 150000, deductible_met_cents: 50000, oop_max_cents: 600000, oop_met_cents: 100000, coinsurance_pct: 20 }
              as: Registrar
              captures: { snap_id: $.data.id }
            - call: "POST /clearance/patients/${pat_id}/cases"
              payload: { service_date: "2026-08-20", service_description: "Knee" }
              as: Registrar
              captures: { case_id: $.data.id, case_v: $.data.version }
            - call: "POST /clearance/cases/${case_id}/estimates"
              payload: { expected_case_version: "${case_v}", pricing_mode: "INSURED", eligibility_snapshot_id: "${snap_id}", lines: [{ cpt_code: "27447", quantity: 1 }] }
              as: FinancialCounselor
              captures: { est_id: $.data.id }
          trigger:
            - call: "POST /clearance/estimates/${est_id}/price"
              payload: {}
              as: FinancialCounselor
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_NO_ACTIVE_CONTRACT, http 422"

      - name: estimate_with_unknown_cpt_returns_422
        claim_type: violation_to_error
        grounds: ["validations[priority=11]", "errors[ERR_UNKNOWN_CPT_CODE]"]
        distinguishing_aspect: "A line CPT missing from the charge master is rejected at estimate creation, before any pricing."
        test_recipe:
          setup: ["Patient with snapshot (ACME) and case; charge master contains only 27447"]
          setup_api_calls:
            - call: "POST /clearance/_clock/set_current_utc"
