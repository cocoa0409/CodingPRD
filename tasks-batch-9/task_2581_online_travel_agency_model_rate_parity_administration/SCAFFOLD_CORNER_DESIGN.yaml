            - "after the refusal CommissionOverride.${ovr_sod}.status is still PROPOSED with version 1"
            - "the independent approval is HTTP 200 with status ACTIVE, approved_by_user_id == co-1, proposed_by_user_id == u-77 and version 2"

  - section: cross_cutting_layers
    instances:
      - name: offer_create_with_a_stale_expected_rate_plan_version_is_rejected
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[offer-create-stale-rate-plan]
          - endpoints[POST /rate-plans/{id}/offers]
          - errors[ERR_STALE_VERSION]
        distinguishing_aspect: "ingesting an offer bumps RatePlan.version, so the version a client read before the first ingestion is stale for the second: reusing it is HTTP 412 ERR_STALE_VERSION with no Offer created, and re-reading the plan makes the identical body succeed."
        test_recipe:
          setup:
            - "Certified hotel supplier with an ACTIVE FLEX plan and one 2026-09-20 offer already ingested at the plan version captured at creation."
          setup_api_calls:
            - *c_clock
            - *c_market
            - *c_sup
            - *c_cert_sub
            - *c_cert_rev
            - *c_cert_dec
            - *c_ma
            - *c_ma_act
            - *c_rp
            - *c_off
          trigger:
            - call: "POST /rate-plans/${rp}/offers"
              payload: { travel_date: "2026-09-21", net_rate_cents: 24000, allotment_total: 3, expected_rate_plan_version: "${rp_v}" }
              as: SupplierUser
              as_user_id: "${sup}"
              captures: { err_occ: $.data.error_id }
            - call: "GET /rate-plans/${rp}"
              payload: {}
              as: SupplierUser
              as_user_id: "${sup}"
              captures: { rp_v2: $.data.version }
            - call: "POST /rate-plans/${rp}/offers"
              payload: { travel_date: "2026-09-21", net_rate_cents: 24000, allotment_total: 3, expected_rate_plan_version: "${rp_v2}" }
              as: SupplierUser
              as_user_id: "${sup}"
              captures: { off_21: $.data.id }
          assert:
            - "the stale attempt is HTTP 412 with ${err_occ} == ERR_STALE_VERSION"
            - "after the refusal GET /offers reports total_count == 1 and RatePlan.${rp}.version is unchanged at ${rp_v2}"
            - "${rp_v2} is exactly one greater than ${rp_v}, proving version increments on every write"
            - "the retry is HTTP 201 with Offer.${off_21}.display_total_cents == 24240 and RatePlan.${rp}.version advanced by one again"
            - "Offer.${off} on 2026-09-20 is untouched: still PENDING_REVIEW with version 1"

      - name: package_price_with_a_stale_expected_package_version_is_rejected
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[package-price-stale-package]
          - endpoints[POST /packages/{id}/price]
          - errors[ERR_STALE_VERSION]
        distinguishing_aspect: "attaching a component bumps Package.version, so a price call holding the version read before the air leg was attached is HTTP 412 ERR_STALE_VERSION and the package stays DRAFT with its money fields null; the fresh version prices it to 157306."
        test_recipe:
          setup:
            - "A DRAFT opaque package with the hotel leg attached, the package version read at that point, and the air leg attached afterwards."
          setup_api_calls:
            - *c_clock
            - *c_market
            - *c_sup
            - *c_cert_sub
            - *c_cert_rev
            - *c_cert_dec
            - *c_ma
            - *c_ma_act
            - *c_rp
            - *c_off
            - *c_off_pub
            - *c_sup_a
            - *c_cert_a_sub
            - *c_cert_a_rev
            - *c_cert_a_dec
            - *c_ma_a
            - *c_ma_a_act
            - *c_rp_a
            - *c_off_a
            - *c_off_a_pub
            - *c_pkg
            - *c_cmp_h
            - call: "GET /packages/${pkg}"
              payload: {}
              as: CommercialManager
              as_user_id: "cm-2"
              captures: { pkg_v_stale: $.data.version }
            - *c_cmp_a
          trigger:
            - call: "POST /packages/${pkg}/price"
              payload: { expected_package_version: "${pkg_v_stale}" }
              as: CommercialManager
              as_user_id: "cm-2"
              captures: { err_pocc: $.data.error_id }
            - *c_pkg_read
            - *c_pkg_price
          assert:
            - "the stale price call is HTTP 412 with ${err_pocc} == ERR_STALE_VERSION"
            - "after the refusal Package.${pkg}.status is still DRAFT with package_total_cents, discount_cents and priced_at all null"
            - "${pkg_v} is exactly one greater than ${pkg_v_stale}"
            - "the retry is HTTP 200 with status PRICED, components_subtotal_cents == 167346, discount_cents == 10040 and package_total_cents == 157306"

      - name: plan_scoped_override_outranks_a_higher_supplier_wide_override
        claim_type: selector_policy
        grounds:
          - calculations.offer_sell_price.formula
          - entities.CommissionOverride.fields.rate_plan_id
          - complexity_profile.complexity_layers
        distinguishing_aspect: "the override selector ranks scope before magnitude: with an ACTIVE supplier-wide COMMISSION_PCT of 0.20 and an ACTIVE plan-scoped COMMISSION_PCT of 0.18 both covering 2026-09-20, the plan-scoped 0.18 wins even though it is the smaller value, so margin is 4320 rather than 4800 and the agreement base 0.15 is not consulted at all."
        test_recipe:
          setup:
            - "Hotel Lutetia on an ACTIVE AGENCY agreement (base_commission_pct 0.15) with an ACTIVE FLEX plan (tax_fee_pct 0.01)."
            - "Override W: supplier-wide, COMMISSION_PCT 0.20, 2026-09-01..2026-09-30, ACTIVE."
            - "Override P: plan-scoped to that plan, COMMISSION_PCT 0.18, same window, ACTIVE."
          setup_api_calls:
            - *c_clock
            - *c_market
            - *c_sup
            - *c_cert_sub
            - *c_cert_rev
            - *c_cert_dec
            - *c_ma
            - *c_ma_act
            - *c_rp
            - call: "POST /commission-overrides"
              payload: { supplier_id: "${sup}", override_type: "COMMISSION_PCT", value: 0.20, effective_from: "2026-09-01", effective_to: "2026-09-30", justification: "supplier-wide peak commission" }
              as: CommercialManager
              as_user_id: "cm-1"
              captures: { ovr_wide: $.data.id }
            - call: "POST /commission-overrides/${ovr_wide}/approve"
              payload: { note: "wide override approved" }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /commission-overrides"
              payload: { supplier_id: "${sup}", rate_plan_id: "${rp}", override_type: "COMMISSION_PCT", value: 0.18, effective_from: "2026-09-01", effective_to: "2026-09-30", justification: "plan-specific negotiated commission" }
              as: CommercialManager
              as_user_id: "cm-1"
              captures: { ovr_plan: $.data.id }
            - call: "POST /commission-overrides/${ovr_plan}/approve"
              payload: { note: "plan override approved" }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "GET /rate-plans/${rp}"
              payload: {}
              as: CommercialManager
              as_user_id: "cm-2"
              captures: { rp_v_sel: $.data.version }
          trigger:
            - call: "POST /rate-plans/${rp}/offers"
              payload: { travel_date: "2026-09-20", net_rate_cents: 24000, allotment_total: 3, expected_rate_plan_version: "${rp_v_sel}" }
              as: CommercialManager
              as_user_id: "cm-2"
              captures: { off_sel: $.data.id }
          assert:
            - "HTTP 201 with Offer.${off_sel}.pricing_model == AGENCY"
            - "Offer.${off_sel}.applied_override_id == ${ovr_plan} and applied_rate_pct == 0.18"
            - "Offer.${off_sel}.gross_cents == 24000, taxes_fees_cents == 240, display_total_cents == 24240"
            - "Offer.${off_sel}.marketplace_margin_cents == 24000 * 0.18 == 4320 and supplier_payable_cents == 19680"
            - "the supplier-wide 0.20 would have produced 4800 and the agreement base 0.15 would have produced 3600, so neither was selected"

      - name: certification_revocation_cascade_reaches_ranking_entries
        claim_type: cascading_side_effects
        grounds:
          - state_machines.Certification.CERTIFIED_to_REVOKED
          - complexity_profile.complexity_layers
        excluded_because:
          difficulty_instance: transitive_cascade / certification_revoke_cascades_supplier_offer_package_and_ranking
          rationale: "The named §1.8 instance walks the full four-level chain end-to-end (Certification -> Supplier -> Offer -> Package/RankingRun) and asserts every intermediate field, including which children are left untouched because they are already terminal."

      - name: scorecard_variants_produce_different_composite_scores
        claim_type: dual_variant_calculation
        grounds:
          - calculations.supplier_composite_score.variants
          - complexity_profile.complexity_layers
        excluded_because:
          difficulty_instance: dual_variant_calc / supplier_composite_score_provisional_vs_final_diverge
          rationale: "The named §1.8 instance builds one dataset where the PROVISIONAL and FINAL variants must disagree and asserts both composite scores plus the delta introduced by the variant switch."

  - section: consistency_model
    instances:
      - name: pricing_and_cascade_results_are_visible_in_the_same_response
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - endpoints[POST /packages/{id}/price]
          - endpoints[POST /offers/{id}/suppress]
        distinguishing_aspect: "the model is immediate, not eventual: the price response itself already carries components_subtotal_cents 167346, discount_cents 10040 and package_total_cents 157306 with no re-read, and a later suppress response already shows the cascaded Package status DRAFT when the package is re-read in the same test without any delay."
        test_recipe:
          setup:
            - "A DRAFT opaque package holding the hotel (24240) and air (143106) legs."
          setup_api_calls:
            - *c_clock
            - *c_market
            - *c_sup
            - *c_cert_sub
            - *c_cert_rev
            - *c_cert_dec
            - *c_ma
            - *c_ma_act
            - *c_rp
            - *c_off
            - *c_off_pub
            - *c_sup_a
            - *c_cert_a_sub
            - *c_cert_a_rev
            - *c_cert_a_dec
            - *c_ma_a
            - *c_ma_a_act
            - *c_rp_a
            - *c_off_a
            - *c_off_a_pub
            - *c_pkg
            - *c_cmp_h
            - *c_cmp_a
            - *c_pkg_read
          trigger:
            - *c_pkg_price
            - call: "GET /packages/${pkg}"
              payload: {}
              as: CommercialManager
              as_user_id: "cm-2"
            - call: "POST /offers/${off}/suppress"
              payload: { suppression_reason: "content audit" }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "GET /packages/${pkg}"
              payload: {}
              as: CommercialManager
              as_user_id: "cm-2"
          assert:
            - "the price response body itself contains package_total_cents == 157306, discount_pct == 0.06 and priced_at == 2026-08-05T00:00:00Z"
            - "the first GET returns byte-identical money fields to the price response, so nothing settles after the write"
            - "the suppress response shows Offer.${off}.status == SUPPRESSED immediately"
            - "the second GET already shows Package.${pkg}.status == DRAFT with package_total_cents, discount_cents and priced_at cleared, with no intervening call"
