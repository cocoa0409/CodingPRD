  - section: endpoints
    instances:

      - name: inventory_list_honours_limit_and_offset
        claim_type: Standard CRUD
        grounds: ["endpoints.GET./staging/inventory-items", "response_envelope.pagination_defaults", "response_envelope.pagination_fields"]
        distinguishing_aspect: "With three units in stock, limit 2 offset 0 returns two rows with total_count 3 and has_more true; offset 2 returns one row with has_more false."
        test_recipe:
          setup: ["Three AVAILABLE owned units."]
          setup_api_calls:
            - call: "POST /staging/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /staging/inventory-items"
              payload: { sku: "SOFA-1", category: "SOFA", acquired_at: "2024-01-05T00:00:00Z", replacement_value: 1200.00, monthly_rate: 240.00 }
              as: WarehouseManager
              captures: { item_a: "$.data.id" }
            - call: "POST /staging/inventory-items"
              payload: { sku: "BED-1", category: "BED", acquired_at: "2025-09-01T00:00:00Z", replacement_value: 900.00, monthly_rate: 180.00 }
              as: WarehouseManager
              captures: { item_b: "$.data.id" }
            - call: "POST /staging/inventory-items"
              payload: { sku: "TABLE-1", category: "TABLE", acquired_at: "2019-02-01T00:00:00Z", replacement_value: 1500.00, monthly_rate: 300.00 }
              as: WarehouseManager
              captures: { item_c: "$.data.id" }
          trigger:
            - call: "GET /staging/inventory-items?limit=2&offset=2"
              payload: {}
              as: WarehouseManager
          assert:
            - "response.response_type == array"
            - "response.meta.total_count == 3"
            - "response.meta.has_more == false"
            - "response.data length == 1"

      - name: pull_lines_are_discoverable_through_the_rental_order_filter
        claim_type: Cross-reference link
        grounds: ["endpoints.GET./staging/pull-lines", "entities.PullLine.fields.rental_order_id", "entities.PullLine.fields.inventory_item_id"]
        distinguishing_aspect: "Cascade-set foreign keys are only observable through the reverse-reachability list: filtering pull-lines by rental_order_id returns exactly the one VENDOR line, whose inventory_item_id is null."
        test_recipe:
          setup: ["The canonical VACANT project with three OWNED lines and one VENDOR line, all deployed."]
          setup_api_calls: *v_staged_c
          trigger:
            - call: "GET /staging/pull-lines?rental_order_id=${ro_id}"
              payload: {}
              as: WarehouseManager
          assert:
            - "response.meta.total_count == 1"
            - "response.data[0].id == ${line_v}"
            - "PullLine.${line_v}.source == VENDOR"
            - "PullLine.${line_v}.inventory_item_id is null"
            - "PullLine.${line_v}.monthly_rate == 1147.50"

      - name: inventory_summary_is_a_computed_read_over_the_five_buckets
        claim_type: Computed read
        grounds: ["endpoints.GET./staging/inventory-items/summary", "conservation_invariants.warehouse_on_hand_conservation", "calculations.warehouse_available_count"]
        distinguishing_aspect: "The summary endpoint returns an inline object, not an entity, and its on_hand_total of 3 equals available + reserved + deployed + in_repair + written_off exactly, even with one unit retired."
        test_recipe:
          setup: ["Three owned units, one of which has been written off."]
          setup_api_calls:
            - call: "POST /staging/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /staging/inventory-items"
              payload: { sku: "SOFA-1", category: "SOFA", acquired_at: "2024-01-05T00:00:00Z", replacement_value: 1200.00, monthly_rate: 240.00 }
              as: WarehouseManager
              captures: { item_a: "$.data.id" }
            - call: "POST /staging/inventory-items"
              payload: { sku: "BED-1", category: "BED", acquired_at: "2025-09-01T00:00:00Z", replacement_value: 900.00, monthly_rate: 180.00 }
              as: WarehouseManager
              captures: { item_b: "$.data.id" }
            - call: "POST /staging/inventory-items"
              payload: { sku: "TABLE-1", category: "TABLE", acquired_at: "2019-02-01T00:00:00Z", replacement_value: 1500.00, monthly_rate: 300.00 }
              as: WarehouseManager
              captures: { item_c: "$.data.id" }
            - call: "POST /staging/inventory-items/${item_c}/repair-in"
              payload: {}
              as: WarehouseManager
            - call: "POST /staging/inventory-items/${item_c}/write-off"
              payload: { reason: "Beyond economical repair" }
              as: WarehouseManager
          trigger:
            - call: "GET /staging/inventory-items/summary"
              payload: {}
              as: WarehouseManager
          assert:
            - "response.data.on_hand_total == 3"
            - "response.data.available == 2"
            - "response.data.reserved == 0"
            - "response.data.deployed == 0"
            - "response.data.in_repair == 0"
            - "response.data.written_off == 1"

      - name: lease_is_discoverable_only_through_the_project_filter
        claim_type: Cross-reference link
        grounds: ["endpoints.GET./staging/leases", "entities.Lease.fields.project_id", "state_machines.Project.PULL_OPEN_to_INSTALL_SCHEDULED"]
        distinguishing_aspect: "The Lease is created as a side effect of scheduling the install and never appears in any creation response, so the filtered list is its ONLY discovery channel; it returns exactly one row."
        test_recipe:
          setup: ["The canonical VACANT project staged."]
          setup_api_calls: *v_staged_c
          trigger:
            - call: "GET /staging/leases?project_id=${proj_id}"
              payload: {}
              as: StagingCoordinator
          assert:
            - "response.response_type == array"
            - "response.meta.total_count == 1"
            - "response.data[0].id == ${lease_id}"
            - "response.data[0].initial_cycles == 4"
            - "response.data[0].monthly_rent == 1867.50"

      - name: clock_endpoint_reports_the_instant_it_was_set_to
        claim_type: Action endpoint
        grounds: ["endpoints.POST./staging/_clock/set_current_utc", "global_constants.DEFAULT_CLOCK_UTC"]
        distinguishing_aspect: "The clock endpoint echoes current_utc as the exact instant supplied and mutates no entity; before any such call the logical clock reads the fixed 2026-05-01T00:00:00Z default rather than wall-clock time."
        test_recipe:
          setup: ["Empty database with the clock at its untouched default."]
          setup_api_calls:
            - call: "POST /staging/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /staging/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
          assert:
            - "HTTP status == 200"
            - "response.data.current_utc == 2026-06-01T00:00:00.000Z"

