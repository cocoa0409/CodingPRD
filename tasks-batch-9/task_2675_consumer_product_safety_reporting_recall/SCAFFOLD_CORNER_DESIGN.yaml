            - "HazardPattern.${hpB_id}.exposure_per_10k == 3.3333"
            - "HazardPattern.${hpB_id}.risk_index == 19.17 (rounding down from 19.17019...), so the same code path rounds both ways"
            - "both patterns have pattern_confirmed == true (3 incidents, concentration 1.0000, index above MIN_RISK_INDEX 10.0)"

      - name: exposure_floor_constant_rescues_a_low_volume_model_from_a_fractional_denominator
        claim_type: Constants Applied
        grounds:
          - calculations.hazard_pattern_risk_index.constants
          - calculations.hazard_pattern_risk_index.formula
        distinguishing_aspect: |
          EXPOSURE_FLOOR 1.0 and RISK_INDEX_CAP 100 are the two constants that only
          reveal themselves at the extremes of distribution volume, and this
          instance pins both in one pair of patterns. At 7777 units the raw ratio is
          0.7777, which without the floor would INFLATE the index by 1/0.7777 to
          82.16; with the floor it is exactly 63.90. On a 100-unit model with a
          fatality-heavy cluster the uncapped raw index is 258.75, and the cap must
          clamp it to exactly 100.00 rather than scale it.
        test_recipe:
          setup:
            - "logical clock at 2026-03-01T00:00:00Z"
            - "model L with units_distributed 7777 and the standard three-incident BURN cluster (severity_sum 42.60)"
