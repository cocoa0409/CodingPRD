# =============================================================================
# Task 1990 — Aerial Lift & Scaffolding Rental (United Rentals branch)
# Scaffold seed tables (§1.0–§1.7)
# =============================================================================

scenario: |
  1990. Aerial Lift & Scaffolding Rental (United Rentals branch): equipment class
  & height/reach selection, delivery/pickup routing & minimum rental period,
  annual inspection & ANSI compliance record, damage waiver & repair chargeback,
  scaffold engineering & erection/dismantle labor, jobsite standby time & re-rent,
  familiarization training documentation, lost/stolen recovery

domain_name: aerial-lift-scaffolding-rental
api_prefix: "/"

complexity_profile:
  primary_archetype: temporal_windowing
  secondary_archetype: compliance_audit
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: CustomerAccount
    parent: null
    common_fields: true
    fields:
      - { name: company_name, type: string, source: input, description: "Renter company name" }
      - { name: contact_email, type: string, source: input, description: "Primary billing contact email" }
      - { name: credit_limit_cents, type: integer, source: input, description: "Maximum allowed outstanding_balance_cents before suspension", constraints: ">= 0" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED; initial ACTIVE; SUSPENDED when outstanding_balance_cents > credit_limit_cents" }
      - { name: outstanding_balance_cents, type: integer, source: computed, default: 0, description: "Sum of contract_invoice_total over this customer's RentalContracts with status == ACTIVE (see calculations.customer_outstanding_balance)" }

  - name: EquipmentClass
    parent: null
    common_fields: true
    fields:
      - { name: class_code, type: string, source: input, description: "Unique catalog code, e.g. S19, BOOM45, SCAF5X5", constraints: "unique across all EquipmentClass rows" }
      - { name: category, type: enum, source: input, description: "AERIAL_LIFT | SCAFFOLD" }
      - { name: max_working_height_ft, type: integer, source: input, description: "Maximum working height in feet; RentalLine.required_working_height_ft must be <= this", constraints: "> 0" }
      - { name: min_rental_days, type: integer, source: input, description: "Minimum rental period floor applied to every billable segment", constraints: ">= 1" }
      - { name: daily_rate_cents, type: integer, source: input, description: "Rate per billable day", constraints: ">= 0" }
      - { name: weekly_rate_cents, type: integer, source: input, description: "Rate per 7-day week block", constraints: ">= 0" }
      - { name: monthly_rate_cents, type: integer, source: input, description: "Rate per 28-day month block", constraints: ">= 0" }
      - { name: replacement_value_cents, type: integer, source: input, description: "Full replacement value; chargeback basis for LOST/STOLEN claims", constraints: ">= 0" }
      - { name: requires_familiarization, type: boolean, source: input, default: false, description: "When true, renting customer must hold a VALID TrainingRecord for this class before a RentalLine may be created" }
      - { name: requires_engineering, type: boolean, source: input, default: false, description: "When true (scaffolds), RentalLine creation requires engineering_plan_ref" }

  - name: EquipmentUnit
    parent: null
    common_fields: true
    fields:
      - { name: class_id, type: string, source: input, description: "FK -> EquipmentClass.id; the catalog class this serialized unit belongs to" }
      - { name: serial_number, type: string, source: input, description: "Manufacturer serial; unique", constraints: "unique across all EquipmentUnit rows" }
      - { name: ansi_standard_ref, type: string, source: input, description: "Governing standard for inspections, e.g. 'ANSI A92.22' or 'OSHA 1926.451'" }
      - { name: status, type: enum, source: system, description: "AVAILABLE | ON_RENT | QUARANTINED | LOST; initial AVAILABLE" }
      - { name: last_annual_inspection_date, type: string, source: system, description: "ISO date (YYYY-MM-DD) of last CERTIFIED PASS inspection; initialized to the logical-clock date at unit creation (factory pre-delivery inspection)" }
      - { name: next_inspection_due_date, type: string, source: computed, description: "last_annual_inspection_date + 365 days (ISO date); unit is rentable only while logical clock date <= this date" }

  - name: RentalContract
    parent: null
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: input, description: "FK -> CustomerAccount.id; renting customer" }
      - { name: jobsite_address, type: string, source: input, description: "Delivery jobsite address" }
      - { name: damage_waiver_elected, type: boolean, source: input, default: false, description: "Damage waiver election; immutable once contract leaves DRAFT" }
      - { name: status, type: enum, source: system, description: "DRAFT | ACTIVE | CLOSED; initial DRAFT" }
      - { name: rental_subtotal_cents, type: integer, source: computed, default: 0, description: "Sum over lines of final_charge_cents (RETURNED) / accrued_charge_cents (OFF_RENT) / provisional_charge_cents (RESERVED, OUT_ON_RENT); CANCELLED lines contribute 0" }
      - { name: logistics_subtotal_cents, type: integer, source: computed, default: 0, description: "Sum over COMPLETED DeliveryTrips of (trip_fee_cents + standby_charge_cents + labor_charge_cents)" }
      - { name: damage_subtotal_cents, type: integer, source: computed, default: 0, description: "Sum of chargeback_cents over claims with status == CHARGED minus sum of recovery_credit_cents over those claims" }
      - { name: invoice_total_cents, type: integer, source: computed, default: 0, description: "rental_subtotal_cents + logistics_subtotal_cents + damage_subtotal_cents (see calculations.contract_invoice_total)" }
      - { name: closed_at, type: datetime, source: system, description: "Logical-clock timestamp when contract entered CLOSED; null until closed" }

  - name: RentalLine
    parent: null
    common_fields: true
    fields:
      - { name: contract_id, type: string, source: input, description: "FK -> RentalContract.id; owning contract" }
      - { name: unit_id, type: string, source: input, description: "FK -> EquipmentUnit.id; the serialized unit being rented" }
      - { name: class_id, type: string, source: system, description: "FK -> EquipmentClass.id; copied from EquipmentUnit.class_id at creation (denormalized, immutable)" }
      - { name: status, type: enum, source: system, description: "RESERVED | OUT_ON_RENT | OFF_RENT | RETURNED | CANCELLED; initial RESERVED" }
      - { name: requested_start_date, type: string, source: input, description: "ISO date (YYYY-MM-DD) of planned rental start; half-open window start" }
      - { name: requested_end_date, type: string, source: input, description: "ISO date of planned rental end; half-open window end is requested_end_date + 1 day", constraints: ">= requested_start_date" }
      - { name: required_working_height_ft, type: integer, source: input, description: "Working height the customer needs; must be <= class.max_working_height_ft", constraints: "> 0" }
      - { name: engineering_plan_ref, type: string, source: input, description: "Engineering plan reference; required iff class.requires_engineering is true", default: null }
      - { name: on_rent_at, type: datetime, source: system, description: "Logical-clock timestamp when current segment went OUT_ON_RENT; null while RESERVED" }
      - { name: off_rent_at, type: datetime, source: system, description: "Logical-clock timestamp of latest off-rent; null while OUT_ON_RENT" }
      - { name: segment_count, type: integer, source: system, default: 0, description: "Number of finalized billable segments (incremented on each off-rent)" }
      - { name: accrued_charge_cents, type: integer, source: system, default: 0, description: "Sum of rental_segment_charge over all finalized segments" }
      - { name: final_charge_cents, type: integer, source: system, description: "Set at RETURNED := accrued_charge_cents; null until then" }
      - { name: provisional_charge_cents, type: integer, source: computed, description: "Forward-looking quote per calculations.rental_segment_charge provisional variant (status-dependent); equals final_charge_cents when RETURNED, 0 when CANCELLED" }

  - name: DeliveryTrip
    parent: null
    common_fields: true
    fields:
      - { name: contract_id, type: string, source: input, description: "FK -> RentalContract.id; contract being serviced" }
      - { name: line_id, type: string, source: input, description: "FK -> RentalLine.id; line whose unit is delivered/picked up" }
      - { name: trip_type, type: enum, source: input, description: "DELIVERY | PICKUP" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | EN_ROUTE | COMPLETED | FAILED | CANCELLED; initial SCHEDULED" }
      - { name: driver_id, type: string, source: input, description: "Opaque Driver X-User-ID assigned to this trip" }
      - { name: planned_start_utc, type: datetime, source: input, description: "Planned route window start (ISO8601)" }
      - { name: planned_end_utc, type: datetime, source: input, description: "Planned route window end (ISO8601)", constraints: "> planned_start_utc" }
      - { name: standby_minutes, type: integer, source: input, default: 0, description: "Jobsite standby minutes reported at completion", constraints: ">= 0" }
      - { name: standby_charge_cents, type: integer, source: computed, default: 0, description: "calculations.standby_charge applied at completion" }
      - { name: crew_labor_hours, type: number, source: input, default: 0, description: "Erection/dismantle labor hours reported at completion", constraints: ">= 0" }
      - { name: labor_charge_cents, type: integer, source: computed, default: 0, description: "calculations.labor_charge at completion; 0 for AERIAL_LIFT trips regardless of crew_labor_hours" }
      - { name: trip_fee_cents, type: integer, source: computed, default: 15000, description: "Flat route fee per COMPLETED trip (15000 cents)" }
      - { name: failure_reason, type: string, source: input, description: "Required when failing a trip", default: null }
      - { name: completed_at, type: datetime, source: system, description: "Logical-clock completion timestamp; null until COMPLETED" }

  - name: InspectionRecord
    parent: null
    common_fields: true
    fields:
      - { name: unit_id, type: string, source: input, description: "FK -> EquipmentUnit.id; inspected unit" }
      - { name: inspector_id, type: string, source: system, description: "X-User-ID of the submitting YardTechnician (server-stamped)" }
      - { name: inspection_date, type: string, source: input, description: "ISO date the annual inspection was performed" }
      - { name: ansi_standard_ref, type: string, source: input, description: "Standard applied, e.g. 'ANSI A92.22'" }
      - { name: result, type: enum, source: input, description: "PASS | FAIL" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | CERTIFIED | REJECTED; initial SUBMITTED" }
      - { name: certified_by, type: string, source: system, description: "X-User-ID of certifying BranchManager; null until CERTIFIED/REJECTED" }
      - { name: certified_at, type: datetime, source: system, description: "Logical-clock certification timestamp; null until decided" }

  - name: DamageClaim
    parent: null
    common_fields: true
    fields:
      - { name: line_id, type: string, source: input, description: "FK -> RentalLine.id; line the damage/loss occurred on" }
      - { name: contract_id, type: string, source: system, description: "FK -> RentalContract.id; copied from RentalLine.contract_id at creation" }
      - { name: unit_id, type: string, source: system, description: "FK -> EquipmentUnit.id; copied from RentalLine.unit_id at creation" }
      - { name: claim_type, type: enum, source: input, description: "DAMAGE | LOST | STOLEN" }
      - { name: description, type: string, source: input, description: "Free-text description of the damage/loss" }
      - { name: status, type: enum, source: system, description: "OPEN | ASSESSED | CHARGED | DISPUTED | WAIVED; initial OPEN" }
      - { name: repair_estimate_cents, type: integer, source: input, description: "Assessed repair cost; required at assess for DAMAGE claims; for LOST/STOLEN the system uses class.replacement_value_cents", default: null }
      - { name: chargeback_cents, type: integer, source: computed, description: "calculations.damage_chargeback result; null until CHARGED" }
      - { name: recovery_credit_cents, type: integer, source: computed, description: "calculations.recovery_credit applied when a LOST unit is recovered; null until then" }
      - { name: reported_by, type: string, source: system, description: "X-User-ID of reporter (server-stamped)" }
      - { name: resolved_by, type: string, source: system, description: "X-User-ID of BranchManager who charged/resolved; null until then" }

  - name: TrainingRecord
    parent: null
    common_fields: false
    fields:
      - { name: customer_id, type: string, source: input, description: "FK -> CustomerAccount.id; customer whose crew was trained" }
      - { name: class_id, type: string, source: input, description: "FK -> EquipmentClass.id; class the familiarization covers" }
      - { name: trainee_name, type: string, source: input, description: "Name of the trained operator" }
      - { name: trained_at, type: datetime, source: input, description: "ISO8601 timestamp training was completed" }
      - { name: trainer_id, type: string, source: system, description: "X-User-ID of the YardTechnician who documented the training (server-stamped)" }
      - { name: valid_until, type: datetime, source: computed, description: "trained_at + 365 days" }
      - { name: is_valid, type: boolean, source: computed, description: "true iff logical clock < valid_until" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: CustomerAccount
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "system cascade: customer_outstanding_balance recompute yields outstanding_balance_cents > credit_limit_cents"
        actor: system
        preconditions:
          - "outstanding_balance_cents > credit_limit_cents after recompute"
        side_effects:
          - "CustomerAccount.version increments by 1"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /customer-accounts/{id}/reinstate"
        actor: BranchManager
        preconditions:
          - "customer.status == SUSPENDED (ERR_INVALID_STATE)"
          - "outstanding_balance_cents <= credit_limit_cents (ERR_CREDIT_LIMIT_EXCEEDED)"
        side_effects:
          - "CustomerAccount.version increments by 1"

  - entity: EquipmentUnit
    initial_state: AVAILABLE
    terminal_states: []
    transitions:
      - from: AVAILABLE
        to: ON_RENT
        trigger: "POST /delivery-trips/{id}/complete for a DELIVERY trip (system cascade)"
        actor: system
        preconditions:
          - "trip.status == EN_ROUTE and trip.trip_type == DELIVERY"
          - "unit.status == AVAILABLE and logical clock date <= unit.next_inspection_due_date (ERR_UNIT_NOT_RENTABLE)"
        side_effects:
          - "RentalLine (trip.line_id): RESERVED -> OUT_ON_RENT; on_rent_at = logical clock"
          - "EquipmentUnit.version increments by 1"
      - from: ON_RENT
        to: AVAILABLE
        trigger: "POST /delivery-trips/{id}/complete for a PICKUP trip when logical clock date <= next_inspection_due_date (system cascade)"
        actor: system
        preconditions:
          - "trip.status == EN_ROUTE and trip.trip_type == PICKUP"
          - "line (trip.line_id).status == OFF_RENT (ERR_INVALID_STATE)"
        side_effects:
          - "RentalLine: OFF_RENT -> RETURNED; final_charge_cents = accrued_charge_cents"
          - "EquipmentUnit.version increments by 1"
      - from: ON_RENT
        to: QUARANTINED
        trigger: "POST /delivery-trips/{id}/complete for a PICKUP trip when logical clock date > next_inspection_due_date (system cascade)"
        actor: system
        preconditions:
          - "trip.status == EN_ROUTE and trip.trip_type == PICKUP"
          - "line (trip.line_id).status == OFF_RENT (ERR_INVALID_STATE)"
        side_effects:
          - "RentalLine: OFF_RENT -> RETURNED; final_charge_cents = accrued_charge_cents"
          - "EquipmentUnit.version increments by 1"
      - from: ON_RENT
        to: LOST
        trigger: "POST /damage-claims/{id}/charge for a claim with claim_type IN {LOST, STOLEN} (system cascade)"
        actor: system
        preconditions:
          - "claim transitions ASSESSED -> CHARGED"
        side_effects:
          - "EquipmentUnit.version increments by 1"
      - from: LOST
        to: AVAILABLE
        trigger: "POST /equipment-units/{id}/recover when logical clock date <= next_inspection_due_date"
        actor: BranchManager
        preconditions:
          - "unit.status == LOST (ERR_INVALID_STATE)"
        side_effects:
          - "calculations.recovery_credit: for every DamageClaim with unit_id == this unit, claim_type IN {LOST, STOLEN}, status == CHARGED, recovery_credit_cents == null: set recovery_credit_cents = round_half_up(0.80 * chargeback_cents)"
          - "Each such claim's contract: damage_subtotal_cents recomputed (decreases by recovery_credit_cents); RentalContract.version increments by 1"
          - "Each affected contract's customer: customer_outstanding_balance recompute; possible ACTIVE -> SUSPENDED cascade per CustomerAccount machine"
          - "EquipmentUnit.version increments by 1"
      - from: LOST
        to: QUARANTINED
        trigger: "POST /equipment-units/{id}/recover when logical clock date > next_inspection_due_date"
        actor: BranchManager
        preconditions:
          - "unit.status == LOST (ERR_INVALID_STATE)"
        side_effects:
          - "Same recovery_credit and contract/customer cascades as LOST -> AVAILABLE"
          - "EquipmentUnit.version increments by 1"
      - from: AVAILABLE
        to: QUARANTINED
        trigger: "POST /inspection-records/{id}/certify for a record with result == FAIL (system cascade)"
        actor: system
        preconditions:
          - "record transitions SUBMITTED -> CERTIFIED with result == FAIL"
        side_effects:
          - "Every RentalLine with unit_id == this unit and status == RESERVED: RESERVED -> CANCELLED (conditional cascade; OUT_ON_RENT/OFF_RENT lines unaffected)"
          - "Each cancelled line's contract: rental_subtotal_cents recomputed; RentalContract.version increments by 1"
          - "EquipmentUnit.version increments by 1"
      - from: QUARANTINED
        to: AVAILABLE
        trigger: "POST /inspection-records/{id}/certify for a record with result == PASS (system cascade)"
        actor: system
        preconditions:
          - "record transitions SUBMITTED -> CERTIFIED with result == PASS"
        side_effects:
          - "unit.last_annual_inspection_date = record.inspection_date; next_inspection_due_date recomputed (+365 days)"
          - "EquipmentUnit.version increments by 1"
      - from: ON_RENT
        to: ON_RENT
        trigger: "POST /inspection-records/{id}/certify for PASS while unit is ON_RENT: only inspection dates update, status unchanged"
        actor: system
        preconditions:
          - "record transitions SUBMITTED -> CERTIFIED with result == PASS"
        side_effects:
          - "unit.last_annual_inspection_date = record.inspection_date; next_inspection_due_date recomputed (+365 days)"
          - "EquipmentUnit.version increments by 1"
      - from: ON_RENT
        to: ON_RENT
        trigger: "POST /inspection-records/{id}/certify for FAIL while unit is ON_RENT: status unchanged, but RESERVED lines on the unit are cancelled"
        actor: system
        preconditions:
          - "record transitions SUBMITTED -> CERTIFIED with result == FAIL"
        side_effects:
          - "Every RentalLine with unit_id == this unit and status == RESERVED: RESERVED -> CANCELLED (conditional cascade; the ON_RENT line itself is unaffected)"
          - "Each cancelled line's contract: rental_subtotal_cents recomputed; RentalContract.version increments by 1"
          - "EquipmentUnit.version increments by 1"

  - entity: RentalContract
    initial_state: DRAFT
    terminal_states: [CLOSED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /rental-contracts/{id}/activate"
        actor: RentalCoordinator
        preconditions:
          - "contract.status == DRAFT (ERR_INVALID_STATE)"
          - "at least one RentalLine with contract_id == this contract and status == RESERVED exists (ERR_INVALID_STATE)"
          - "customer.status == ACTIVE (ERR_CUSTOMER_SUSPENDED)"
          - "customer.outstanding_balance_cents + sum of provisional_charge_cents over the contract's non-CANCELLED lines <= customer.credit_limit_cents (ERR_CREDIT_LIMIT_EXCEEDED)"
        side_effects:
          - "RentalContract.version increments by 1"
          - "customer_outstanding_balance recompute for customer_id"
      - from: ACTIVE
        to: CLOSED
        trigger: "POST /rental-contracts/{id}/close"
        actor: RentalCoordinator
        preconditions:
          - "contract.status == ACTIVE (ERR_INVALID_STATE)"
          - "every RentalLine of the contract has status IN {RETURNED, CANCELLED} (ERR_LINES_OUTSTANDING)"
          - "no DamageClaim of the contract has status IN {OPEN, ASSESSED, DISPUTED} (ERR_OPEN_CLAIMS_EXIST)"
        side_effects:
          - "contract.closed_at = logical clock; invoice_total_cents finalized (all lines RETURNED/CANCELLED so rental_subtotal uses final_charge_cents)"
          - "RentalContract.version increments by 1"
          - "customer_outstanding_balance recompute (contract leaves the ACTIVE inclusion set)"

  - entity: RentalLine
    initial_state: RESERVED
    terminal_states: [RETURNED, CANCELLED]
    transitions:
      - from: RESERVED
        to: OUT_ON_RENT
        trigger: "POST /delivery-trips/{id}/complete for a DELIVERY trip referencing this line (system cascade)"
        actor: system
        preconditions:
          - "unit rentable per EquipmentUnit AVAILABLE -> ON_RENT transition"
        side_effects:
          - "on_rent_at = logical clock"
          - "RentalLine.version increments by 1"
      - from: OUT_ON_RENT
        to: OFF_RENT
        trigger: "POST /rental-lines/{id}/off-rent"
        actor: RentalCoordinator | Customer
        preconditions:
          - "line.status == OUT_ON_RENT (ERR_INVALID_STATE)"
          - "contract.status == ACTIVE (ERR_INVALID_STATE)"
          - "Customer actor: X-User-ID must equal contract.customer_id (ERR_FORBIDDEN)"
        side_effects:
          - "off_rent_at = logical clock; segment finalized: accrued_charge_cents += rental_segment_charge(final variant, on_rent_at -> off_rent_at); segment_count += 1"
          - "contract.rental_subtotal_cents recomputed; RentalContract.version increments by 1"
          - "customer_outstanding_balance recompute; possible SUSPENDED cascade"
          - "RentalLine.version increments by 1"
      - from: OFF_RENT
        to: OUT_ON_RENT
        trigger: "POST /rental-lines/{id}/re-rent"
        actor: RentalCoordinator | Customer
        preconditions:
          - "line.status == OFF_RENT (ERR_INVALID_STATE)"
          - "contract.status == ACTIVE (ERR_INVALID_STATE)"
          - "Customer actor: X-User-ID must equal contract.customer_id (ERR_FORBIDDEN)"
        side_effects:
          - "Every DeliveryTrip with line_id == this line, trip_type == PICKUP, status == SCHEDULED: SCHEDULED -> CANCELLED (conditional cascade)"
          - "on_rent_at = logical clock (new segment begins); off_rent_at = null"
          - "RentalLine.version increments by 1"
        note: "cycle: OUT_ON_RENT -> OFF_RENT -> OUT_ON_RENT allowed repeatedly; each off-rent finalizes one billable segment"
      - from: OFF_RENT
        to: RETURNED
        trigger: "POST /delivery-trips/{id}/complete for a PICKUP trip referencing this line (system cascade)"
        actor: system
        preconditions:
          - "trip.status == EN_ROUTE and trip.trip_type == PICKUP"
        side_effects:
          - "final_charge_cents = accrued_charge_cents"
          - "contract.rental_subtotal_cents recomputed; RentalContract.version increments by 1"
          - "customer_outstanding_balance recompute"
          - "RentalLine.version increments by 1"
      - from: RESERVED
        to: CANCELLED
        trigger: "POST /inspection-records/{id}/certify FAIL cascade on the line's unit"
        actor: system
        preconditions:
          - "unit (line.unit_id) transitions AVAILABLE -> QUARANTINED"
        side_effects:
          - "contract.rental_subtotal_cents recomputed; RentalContract.version increments by 1"
          - "RentalLine.version increments by 1"

  - entity: DeliveryTrip
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: EN_ROUTE
        trigger: "POST /delivery-trips/{id}/start"
        actor: Driver
        preconditions:
          - "trip.status == SCHEDULED (ERR_INVALID_STATE)"
          - "X-User-ID == trip.driver_id (ERR_FORBIDDEN)"
        side_effects:
          - "DeliveryTrip.version increments by 1"
      - from: EN_ROUTE
        to: COMPLETED
        trigger: "POST /delivery-trips/{id}/complete"
        actor: Driver
        preconditions:
          - "trip.status == EN_ROUTE (ERR_INVALID_STATE)"
          - "X-User-ID == trip.driver_id (ERR_FORBIDDEN)"
          - "DELIVERY: line.status == RESERVED and contract.status == ACTIVE (ERR_INVALID_STATE); unit rentable (ERR_UNIT_NOT_RENTABLE)"
          - "PICKUP: line.status == OFF_RENT (ERR_INVALID_STATE)"
        side_effects:
          - "completed_at = logical clock; standby_charge_cents and labor_charge_cents computed; trip_fee_cents = 15000"
          - "DELIVERY: RentalLine RESERVED -> OUT_ON_RENT cascade; EquipmentUnit AVAILABLE -> ON_RENT cascade"
          - "PICKUP: RentalLine OFF_RENT -> RETURNED cascade; EquipmentUnit ON_RENT -> AVAILABLE or QUARANTINED cascade"
          - "contract.logistics_subtotal_cents recomputed; RentalContract.version increments by 1"
          - "customer_outstanding_balance recompute"
          - "DeliveryTrip.version increments by 1"
      - from: EN_ROUTE
        to: FAILED
        trigger: "POST /delivery-trips/{id}/fail"
        actor: Driver
        preconditions:
          - "trip.status == EN_ROUTE (ERR_INVALID_STATE)"
          - "X-User-ID == trip.driver_id (ERR_FORBIDDEN)"
          - "failure_reason present (ERR_INVALID_REQUEST)"
        side_effects:
          - "DeliveryTrip.version increments by 1"
      - from: FAILED
        to: SCHEDULED
        trigger: "POST /delivery-trips/{id}/reschedule"
        actor: RentalCoordinator
        preconditions:
          - "trip.status == FAILED (ERR_INVALID_STATE)"
          - "new [planned_start_utc, planned_end_utc) passes the route buffer check for trip.driver_id (ERR_ROUTE_WINDOW_CONFLICT)"
        side_effects:
          - "planned_start_utc / planned_end_utc replaced with request values"
          - "DeliveryTrip.version increments by 1"
        note: "cycle: SCHEDULED -> EN_ROUTE -> FAILED -> SCHEDULED allowed repeatedly"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /rental-lines/{id}/re-rent cascade for PICKUP trips of that line"
        actor: system
        preconditions:
          - "line transitions OFF_RENT -> OUT_ON_RENT and trip.trip_type == PICKUP"
        side_effects:
          - "DeliveryTrip.version increments by 1"

  - entity: InspectionRecord
    initial_state: SUBMITTED
    terminal_states: [CERTIFIED, REJECTED]
    transitions:
      - from: SUBMITTED
        to: CERTIFIED
        trigger: "POST /inspection-records/{id}/certify"
        actor: BranchManager
        preconditions:
          - "record.status == SUBMITTED (ERR_INVALID_STATE)"
          - "X-User-ID != record.inspector_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "certified_by = X-User-ID; certified_at = logical clock"
          - "result PASS: EquipmentUnit inspection dates update (+ QUARANTINED -> AVAILABLE if quarantined)"
          - "result FAIL: EquipmentUnit AVAILABLE -> QUARANTINED cascade incl. RESERVED line cancellation"
          - "InspectionRecord.version increments by 1"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /inspection-records/{id}/reject"
        actor: BranchManager
        preconditions:
          - "record.status == SUBMITTED (ERR_INVALID_STATE)"
          - "X-User-ID != record.inspector_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "certified_by = X-User-ID; certified_at = logical clock; no EquipmentUnit effect"
          - "InspectionRecord.version increments by 1"

  - entity: DamageClaim
    initial_state: OPEN
    terminal_states: [WAIVED]
    transitions:
      - from: OPEN
        to: ASSESSED
        trigger: "POST /damage-claims/{id}/assess"
        actor: BranchManager
        preconditions:
          - "claim.status == OPEN (ERR_INVALID_STATE)"
          - "claim_type == DAMAGE: repair_estimate_cents present and >= 0 (ERR_INVALID_REQUEST)"
        side_effects:
          - "claim_type IN {LOST, STOLEN}: repair_estimate_cents set to class.replacement_value_cents by system"
          - "DamageClaim.version increments by 1"
      - from: ASSESSED
        to: CHARGED
        trigger: "POST /damage-claims/{id}/charge"
        actor: BranchManager
        preconditions:
          - "claim.status == ASSESSED (ERR_INVALID_STATE)"
          - "contract.status == ACTIVE (ERR_INVALID_STATE)"
        side_effects:
          - "chargeback_cents = calculations.damage_chargeback; resolved_by = X-User-ID"
          - "link 1: contract.damage_subtotal_cents recomputed (adds chargeback_cents); RentalContract.version increments by 1"
          - "link 2: customer_outstanding_balance recompute for the contract's customer"
          - "link 3: if outstanding_balance_cents > credit_limit_cents the customer cascades ACTIVE -> SUSPENDED"
          - "claim_type IN {LOST, STOLEN}: EquipmentUnit ON_RENT -> LOST cascade"
          - "DamageClaim.version increments by 1"
      - from: CHARGED
        to: DISPUTED
        trigger: "POST /damage-claims/{id}/dispute"
        actor: Customer
        preconditions:
          - "claim.status == CHARGED (ERR_INVALID_STATE)"
          - "X-User-ID == contract.customer_id (ERR_FORBIDDEN)"
        side_effects:
          - "DamageClaim.version increments by 1"
      - from: DISPUTED
        to: CHARGED
        trigger: "POST /damage-claims/{id}/resolve with decision == UPHOLD"
        actor: BranchManager
        preconditions:
          - "claim.status == DISPUTED (ERR_INVALID_STATE)"
        side_effects:
          - "resolved_by = X-User-ID; no monetary change (chargeback_cents already applied)"
          - "DamageClaim.version increments by 1"
        note: "cycle: CHARGED -> DISPUTED -> CHARGED allowed repeatedly"
      - from: DISPUTED
        to: WAIVED
        trigger: "POST /damage-claims/{id}/resolve with decision == WAIVE"
        actor: BranchManager
        preconditions:
          - "claim.status == DISPUTED (ERR_INVALID_STATE)"
        side_effects:
          - "resolved_by = X-User-ID"
          - "contract.damage_subtotal_cents recomputed (removes chargeback_cents; compensating action of the charge); RentalContract.version increments by 1"
          - "customer_outstanding_balance recompute; possible SUSPENDED cascade"
          - "DamageClaim.version increments by 1"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: line-add-stale-contract
    parent_entity: RentalContract
    write_endpoint: "POST /rental-lines"
    occ_field: expected_contract_version
    description: |
      Adding a RentalLine to a RentalContract whose version has advanced since
      the client last observed it is rejected. This captures the case where
      another writer has just mutated the contract (added a line, activated it,
      or a cascade recomputed its subtotals) and the current writer's view of
      the contract is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: billable_days
    trigger: "off-rent (final segment), provisional_charge_cents reads"
    algorithm: threshold
    formula: |
      raw_days = ceil((segment_end_utc - segment_start_utc) / SECONDS_PER_DAY)
      billable = max(class.min_rental_days, raw_days)
    input_set: "the segment's [segment_start_utc, segment_end_utc) and the line's EquipmentClass.min_rental_days"
    constants:
      SECONDS_PER_DAY: 86400
    precision: "integer days; ceil on the division"
    variants: []

  - name: rental_segment_charge
    trigger: "off-rent finalizes a segment; provisional_charge_cents read; activation credit check"
    algorithm: tiered_pricing
    formula: |
      d = billable_days(segment_start_utc, segment_end_utc, class)
      charge = min(
        class.daily_rate_cents   * d,
        class.weekly_rate_cents  * ceil(d / DAYS_PER_WEEK),
        class.monthly_rate_cents * ceil(d / DAYS_PER_MONTH)
      )
    input_set: "one RentalLine segment and its EquipmentClass rates (daily/weekly/monthly) and min_rental_days"
    constants:
      DAYS_PER_WEEK: 7
      DAYS_PER_MONTH: 28
    precision: "integer cents; inputs are integer cents so no rounding occurs"
    variants:
      - name: provisional_quote
        when: "line status RESERVED, OUT_ON_RENT, or OFF_RENT (quote/provisional_charge_cents, activation credit check, invoice on unreturned lines)"
        difference: |
          forward-looking segment end:
          RESERVED: segment_start = requested_start_dateT00:00:00Z, segment_end = (requested_end_date + 1 day)T00:00:00Z
          OUT_ON_RENT: segment_start = on_rent_at, segment_end = max(logical clock, (requested_end_date + 1 day)T00:00:00Z)
          OFF_RENT: provisional = accrued_charge_cents (segment already finalized)
          For RESERVED/OUT_ON_RENT the charge is this best-rate formula over the projected segment, plus accrued_charge_cents for OUT_ON_RENT.
      - name: final_settlement
        when: "off-rent transition finalizes the actual segment"
        difference: "chronological: segment_start = on_rent_at, segment_end = off_rent_at (actual logical-clock timestamps); result added to accrued_charge_cents"

  - name: standby_charge
    trigger: "POST /delivery-trips/{id}/complete"
    algorithm: threshold
    formula: |
      standby_charge_cents = max(0, standby_minutes - FREE_STANDBY_MINUTES) * STANDBY_RATE_CENTS_PER_MINUTE
    input_set: "the completing DeliveryTrip.standby_minutes"
    constants:
      FREE_STANDBY_MINUTES: 30
      STANDBY_RATE_CENTS_PER_MINUTE: 250
    precision: "integer cents; exact product"
    variants: []

  - name: labor_charge
    trigger: "POST /delivery-trips/{id}/complete"
    algorithm: aggregation
    formula: |
      if line's class.category == SCAFFOLD:
        labor_charge_cents = round_half_up(crew_labor_hours * LABOR_RATE_CENTS_PER_HOUR)
      else:
        labor_charge_cents = 0
    input_set: "the completing DeliveryTrip.crew_labor_hours and the category of the line's EquipmentClass"
    constants:
      LABOR_RATE_CENTS_PER_HOUR: 9500
    precision: "integer cents, round_half_up"
    variants: []

  - name: damage_chargeback
    trigger: "POST /damage-claims/{id}/charge"
    algorithm: conditional_percentage
    formula: |
      if claim_type == DAMAGE:
        base = claim.repair_estimate_cents
        if contract.damage_waiver_elected:
          chargeback_cents = round_half_up(WAIVER_LIABILITY_PCT * base)
        else:
          chargeback_cents = base
      else:  # LOST | STOLEN — damage waiver NEVER applies
        chargeback_cents = class.replacement_value_cents
    input_set: "the claim being charged, its contract's damage_waiver_elected, the line's EquipmentClass.replacement_value_cents"
    constants:
      WAIVER_LIABILITY_PCT: 0.10
    precision: "integer cents, round_half_up; rounding is applied PER CLAIM at charge time and the rounded integer is stored — aggregates are never re-rounded"
    variants:
      - name: waiver_elected
        when: "claim_type == DAMAGE and contract.damage_waiver_elected == true"
        difference: "customer liability capped at 10% of repair_estimate_cents (round_half_up to integer cents)"
      - name: standard_liability
        when: "claim_type == DAMAGE and contract.damage_waiver_elected == false, or claim_type IN {LOST, STOLEN}"
        difference: "full repair_estimate_cents (DAMAGE) or full class.replacement_value_cents (LOST/STOLEN)"

  - name: recovery_credit
    trigger: "POST /equipment-units/{id}/recover"
    algorithm: aggregation
    formula: |
      for each DamageClaim with unit_id == recovered unit, claim_type IN {LOST, STOLEN},
      status == CHARGED, recovery_credit_cents == null:
        recovery_credit_cents = round_half_up(RECOVERY_CREDIT_PCT * chargeback_cents)
    input_set: "all CHARGED LOST/STOLEN DamageClaims for the recovered unit that have not yet received a credit"
    constants:
      RECOVERY_CREDIT_PCT: 0.80
    precision: "integer cents, round_half_up, per claim"
    variants: []

  - name: contract_invoice_total
    trigger: "recomputed on every mutation of any component (line charge, trip completion, claim charge/waive/recovery); read via GET /rental-contracts/{id}/invoice; finalized at close"
    algorithm: aggregation
    formula: |
      rental_subtotal_cents    = sum over lines: RETURNED -> final_charge_cents;
                                 OFF_RENT -> accrued_charge_cents;
                                 RESERVED/OUT_ON_RENT -> provisional_charge_cents;
                                 CANCELLED -> 0
      logistics_subtotal_cents = sum over COMPLETED trips: trip_fee_cents + standby_charge_cents + labor_charge_cents
      damage_subtotal_cents    = sum over claims with status == CHARGED of chargeback_cents
                                 - sum over those claims of coalesce(recovery_credit_cents, 0)
      invoice_total_cents      = rental_subtotal_cents + logistics_subtotal_cents + damage_subtotal_cents
    input_set: "all RentalLines, all COMPLETED DeliveryTrips, and all DamageClaims of the contract"
    constants:
      TRIP_FEE_CENTS: 15000
    precision: |
      PINNED ROUNDING ORDER (nested rounding, mode b): every component is stored as
      integer cents at its own computation time (chargeback rounded PER CLAIM at
      charge time; labor rounded per trip; segment charges exact). The invoice sums
      stored integers and NEVER rounds an aggregate. Sum-then-round of raw
      percentages is explicitly NOT the rule.
    variants: []

  - name: customer_outstanding_balance
    trigger: "recomputed whenever any contract invoice component mutates (activation, off-rent, re-rent, pickup completion, claim charge/waive, recovery, line cancellation) and at close"
    algorithm: aggregation
    formula: |
      outstanding_balance_cents = sum of contract_invoice_total over RentalContracts
                                  with customer_id == this customer AND status == ACTIVE
    input_set: "the customer's RentalContracts filtered to status == ACTIVE only (DRAFT and CLOSED excluded)"
    constants: {}
    precision: "integer cents"
    variants: []

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present; X-User-Role is a declared role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "role is permitted on the endpoint per §1.5 roles; entity_backed ownership: Customer X-User-ID must equal the target contract's customer_id (off-rent, re-rent, dispute, claim create, self reads); Driver X-User-ID must equal trip.driver_id (start/complete/fail)"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "request shape: all required fields present, types correct, enum values valid, date/datetime formats valid, requested_end_date >= requested_start_date, planned_end_utc > planned_start_utc"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all endpoints with a request body"
  - priority: 4
    category: existence
    check: "every referenced entity exists: path ids (validated left-to-right) and body FK references (customer_id, unit_id, contract_id, line_id, class_id)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"
  - priority: 5
    category: state
    check: "OCC: expected_contract_version matches RentalContract.version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /rental-lines"
  - priority: 6
    category: state
    check: "state-machine preconditions of the triggered transition (from-state, terminal lockdown, cross-entity state preconditions like contract ACTIVE for off-rent)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action/transition endpoints"
  - priority: 7
    category: business_safety
    check: "unit rentability at DELIVERY completion: unit.status == AVAILABLE and logical clock date <= unit.next_inspection_due_date"
    error_id: ERR_UNIT_NOT_RENTABLE
    http_status: 422
    applies_to: "POST /delivery-trips/{id}/complete"
  - priority: 8
    category: business_safety
    check: "familiarization: when class.requires_familiarization, a TrainingRecord with customer_id == contract.customer_id, class_id == line.class_id, is_valid == true must exist at line creation"
    error_id: ERR_FAMILIARIZATION_REQUIRED
    http_status: 422
    applies_to: "POST /rental-lines"
  - priority: 9
    category: business_safety
    check: "scaffold engineering: when class.requires_engineering, engineering_plan_ref must be present and non-empty"
    error_id: ERR_ENGINEERING_PLAN_REQUIRED
    http_status: 422
    applies_to: "POST /rental-lines"
  - priority: 10
    category: business_safety
    check: "height/reach selection: required_working_height_ft <= class.max_working_height_ft"
    error_id: ERR_REACH_EXCEEDED
    http_status: 422
    applies_to: "POST /rental-lines"
  - priority: 11
    category: business_safety
    check: "segregation of duties: certifier/rejecter X-User-ID != record.inspector_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 422
    applies_to: "POST /inspection-records/{id}/certify, POST /inspection-records/{id}/reject"
  - priority: 12
    category: business_constraint
    check: "close gate 1: every RentalLine of the contract has status IN {RETURNED, CANCELLED}"
    error_id: ERR_LINES_OUTSTANDING
    http_status: 409
    applies_to: "POST /rental-contracts/{id}/close"
  - priority: 13
    category: business_constraint
    check: "close gate 2: no DamageClaim of the contract has status IN {OPEN, ASSESSED, DISPUTED}"
    error_id: ERR_OPEN_CLAIMS_EXIST
    http_status: 409
    applies_to: "POST /rental-contracts/{id}/close"
  - priority: 14
    category: business_constraint
    check: "unit temporal overlap: no other RentalLine with the same unit_id, status IN {RESERVED, OUT_ON_RENT, OFF_RENT}, whose half-open window [requested_start_date, requested_end_date + 1 day) intersects the new window; adjacency (existing end == new start) is NOT an intersection"
    error_id: ERR_UNIT_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /rental-lines"
  - priority: 15
    category: business_constraint
    check: "route buffer overlap: for the same driver_id, no DeliveryTrip with status IN {SCHEDULED, EN_ROUTE} whose buffered window [planned_start_utc - 45 min, planned_end_utc + 45 min) intersects the new trip's [planned_start_utc, planned_end_utc)"
    error_id: ERR_ROUTE_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /delivery-trips, POST /delivery-trips/{id}/reschedule"
  - priority: 16
    category: business_fiscal
    check: "customer not suspended: customer.status == ACTIVE"
    error_id: ERR_CUSTOMER_SUSPENDED
    http_status: 402
    applies_to: "POST /rental-contracts, POST /rental-lines, POST /rental-contracts/{id}/activate"
  - priority: 17
    category: business_fiscal
    check: "credit limit: customer.outstanding_balance_cents + sum of provisional_charge_cents over the contract's non-CANCELLED lines <= customer.credit_limit_cents; on reinstate: outstanding_balance_cents <= credit_limit_cents"
    error_id: ERR_CREDIT_LIMIT_EXCEEDED
    http_status: 402
    applies_to: "POST /rental-contracts/{id}/activate, POST /customer-accounts/{id}/reinstate"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  - method: POST
    path: /customer-accounts
    description: "Create a renter customer account"
    roles: [BranchManager]
    code: 201
    input: [company_name, contact_email, credit_limit_cents]
    output: CustomerAccount
    side_effects: ["status = ACTIVE", "outstanding_balance_cents = 0"]
  - method: GET
    path: /customer-accounts/{id}
    description: "Read one customer (Customer role restricted to own id)"
    roles: [BranchManager, RentalCoordinator, Customer]
    code: 200
    input: []
    output: CustomerAccount
    side_effects: []
  - method: POST
    path: /customer-accounts/{id}/reinstate
    description: "Reinstate a SUSPENDED customer whose balance is back within the credit limit"
    roles: [BranchManager]
    code: 200
    input: []
    output: CustomerAccount
    side_effects: ["CustomerAccount SUSPENDED -> ACTIVE", "increments CustomerAccount.version by 1"]

  - method: POST
    path: /equipment-classes
    description: "Create a catalog equipment class"
    roles: [BranchManager]
    code: 201
    input: [class_code, category, max_working_height_ft, min_rental_days, daily_rate_cents, weekly_rate_cents, monthly_rate_cents, replacement_value_cents, "requires_familiarization?", "requires_engineering?"]
    output: EquipmentClass
    side_effects: []
  - method: GET
    path: /equipment-classes
    description: "List equipment classes (paginated)"
    roles: [BranchManager, RentalCoordinator, Customer]
    code: 200
    input: ["limit?", "offset?"]
    output: EquipmentClass[]
    side_effects: []

  - method: POST
    path: /equipment-units
    description: "Register a serialized unit; system stamps last_annual_inspection_date = logical clock date (factory PDI) and status = AVAILABLE"
    roles: [BranchManager]
    code: 201
    input: [class_id, serial_number, ansi_standard_ref]
    output: EquipmentUnit
    side_effects: ["last_annual_inspection_date = logical clock date", "next_inspection_due_date = +365 days"]
  - method: GET
    path: /equipment-units
    description: "List units with optional filters"
    roles: [BranchManager, RentalCoordinator, YardTechnician]
    code: 200
    input: ["class_id?", "status?", "limit?", "offset?"]
    output: EquipmentUnit[]
    side_effects: []
  - method: GET
    path: /equipment-units/{id}
    description: "Read one unit"
    roles: [BranchManager, RentalCoordinator, YardTechnician]
    code: 200
    input: []
    output: EquipmentUnit
    side_effects: []
  - method: POST
    path: /equipment-units/{id}/recover
    description: "Recover a LOST unit; applies recovery credit to charged LOST/STOLEN claims and returns unit to AVAILABLE (or QUARANTINED if inspection overdue)"
    roles: [BranchManager]
    code: 200
    input: []
    output: EquipmentUnit
    side_effects: ["EquipmentUnit LOST -> AVAILABLE | QUARANTINED", "calculations.recovery_credit", "contract damage_subtotal_cents recompute", "customer_outstanding_balance recompute", "increments EquipmentUnit.version by 1"]

  - method: POST
    path: /rental-contracts
    description: "Create a rental contract in DRAFT"
    roles: [RentalCoordinator]
    code: 201
    input: [customer_id, jobsite_address, "damage_waiver_elected?"]
    output: RentalContract
    side_effects: ["status = DRAFT"]
  - method: GET
    path: /rental-contracts
    description: "List contracts (Customer restricted to own customer_id filter)"
    roles: [BranchManager, RentalCoordinator, Customer]
    code: 200
    input: ["customer_id?", "status?", "limit?", "offset?"]
    output: RentalContract[]
    side_effects: []
  - method: GET
    path: /rental-contracts/{id}
    description: "Read one contract (Customer restricted to own)"
    roles: [BranchManager, RentalCoordinator, Customer]
    code: 200
    input: []
    output: RentalContract
    side_effects: []
  - method: POST
    path: /rental-contracts/{id}/activate
    description: "Activate a DRAFT contract (requires >= 1 RESERVED line; credit check)"
    roles: [RentalCoordinator]
    code: 200
    input: []
    output: RentalContract
    side_effects: ["RentalContract DRAFT -> ACTIVE", "customer_outstanding_balance recompute", "increments RentalContract.version by 1"]
  - method: POST
    path: /rental-contracts/{id}/close
    description: "Close an ACTIVE contract once all lines are RETURNED/CANCELLED and all claims resolved"
    roles: [RentalCoordinator]
    code: 200
    input: []
    output: RentalContract
    side_effects: ["RentalContract ACTIVE -> CLOSED", "closed_at = logical clock", "customer_outstanding_balance recompute", "increments RentalContract.version by 1"]
  - method: GET
    path: /rental-contracts/{id}/invoice
    description: "Computed invoice read with pinned rounding order (per-component integer cents summed, never aggregate-rounded)"
    roles: [BranchManager, RentalCoordinator, Customer]
    code: 200
    input: []
    output: { contract_id: string, status: string, rental_subtotal_cents: integer, logistics_subtotal_cents: integer, damage_subtotal_cents: integer, invoice_total_cents: integer }
    side_effects: []

  - method: POST
    path: /rental-lines
    description: "Add a line to a DRAFT or ACTIVE contract (OCC on contract version)"
    roles: [RentalCoordinator]
    code: 201
    input: [contract_id, unit_id, requested_start_date, requested_end_date, required_working_height_ft, expected_contract_version, "engineering_plan_ref?"]
    output: RentalLine
    side_effects: ["RentalLine created in RESERVED; class_id copied from unit", "increments RentalContract.version by 1", "contract.rental_subtotal_cents recompute", "customer_outstanding_balance recompute"]
  - method: GET
    path: /rental-lines
    description: "List lines with optional filters"
    roles: [BranchManager, RentalCoordinator, Customer]
    code: 200
    input: ["contract_id?", "unit_id?", "class_id?", "status?", "limit?", "offset?"]
    output: RentalLine[]
    side_effects: []
  - method: GET
    path: /rental-lines/{id}
    description: "Read one line"
    roles: [BranchManager, RentalCoordinator, Customer]
    code: 200
    input: []
    output: RentalLine
    side_effects: []
  - method: POST
    path: /rental-lines/{id}/off-rent
    description: "Customer calls off-rent; finalizes the current billable segment with min-period floor"
    roles: [RentalCoordinator, Customer]
    code: 200
    input: []
    output: RentalLine
    side_effects: ["RentalLine OUT_ON_RENT -> OFF_RENT", "accrued_charge_cents += rental_segment_charge(final)", "segment_count += 1", "contract rental_subtotal recompute", "customer_outstanding_balance recompute", "increments RentalLine.version by 1", "increments RentalContract.version by 1"]
  - method: POST
    path: /rental-lines/{id}/re-rent
    description: "Re-rent an OFF_RENT line before pickup; cancels its SCHEDULED pickup trips"
    roles: [RentalCoordinator, Customer]
    code: 200
    input: []
    output: RentalLine
    side_effects: ["RentalLine OFF_RENT -> OUT_ON_RENT", "SCHEDULED PICKUP trips of the line -> CANCELLED", "increments RentalLine.version by 1"]

  - method: POST
    path: /delivery-trips
    description: "Schedule a delivery or pickup trip (route buffer check per driver)"
    roles: [RentalCoordinator]
    code: 201
    input: [contract_id, line_id, trip_type, driver_id, planned_start_utc, planned_end_utc]
    output: DeliveryTrip
    side_effects: ["status = SCHEDULED"]
  - method: GET
    path: /delivery-trips
    description: "List trips with optional filters"
    roles: [BranchManager, RentalCoordinator, Driver]
    code: 200
    input: ["contract_id?", "line_id?", "driver_id?", "status?", "limit?", "offset?"]
    output: DeliveryTrip[]
    side_effects: []
  - method: GET
    path: /delivery-trips/{id}
    description: "Read one trip"
    roles: [BranchManager, RentalCoordinator, Driver]
    code: 200
    input: []
    output: DeliveryTrip
    side_effects: []
  - method: POST
    path: /delivery-trips/{id}/start
    description: "Assigned driver starts the route leg"
    roles: [Driver]
    code: 200
    input: []
    output: DeliveryTrip
    side_effects: ["DeliveryTrip SCHEDULED -> EN_ROUTE", "increments DeliveryTrip.version by 1"]
  - method: POST
    path: /delivery-trips/{id}/complete
    description: "Assigned driver completes the trip; reports standby minutes and erection/dismantle labor hours; cascades line/unit transitions"
    roles: [Driver]
    code: 200
    input: ["standby_minutes?", "crew_labor_hours?"]
    output: DeliveryTrip
    side_effects: ["DeliveryTrip EN_ROUTE -> COMPLETED", "standby_charge_cents + labor_charge_cents + trip_fee_cents computed", "line and unit cascades per §1.2", "contract logistics_subtotal recompute", "customer_outstanding_balance recompute", "increments DeliveryTrip.version by 1"]
  - method: POST
    path: /delivery-trips/{id}/fail
    description: "Assigned driver marks the trip failed (access issue, refused delivery, etc.)"
    roles: [Driver]
    code: 200
    input: [failure_reason]
    output: DeliveryTrip
    side_effects: ["DeliveryTrip EN_ROUTE -> FAILED", "increments DeliveryTrip.version by 1"]
  - method: POST
    path: /delivery-trips/{id}/reschedule
    description: "Reschedule a FAILED trip to a new route window (route buffer re-checked)"
    roles: [RentalCoordinator]
    code: 200
    input: [planned_start_utc, planned_end_utc]
    output: DeliveryTrip
    side_effects: ["DeliveryTrip FAILED -> SCHEDULED", "increments DeliveryTrip.version by 1"]

  - method: POST
    path: /inspection-records
    description: "Yard technician submits an annual ANSI inspection result"
    roles: [YardTechnician]
    code: 201
    input: [unit_id, inspection_date, ansi_standard_ref, result]
    output: InspectionRecord
    side_effects: ["status = SUBMITTED", "inspector_id = X-User-ID"]
  - method: GET
    path: /inspection-records
    description: "List inspection records with optional unit filter"
    roles: [BranchManager, YardTechnician]
    code: 200
    input: ["unit_id?", "limit?", "offset?"]
    output: InspectionRecord[]
    side_effects: []
  - method: GET
    path: /inspection-records/{id}
    description: "Read one inspection record"
    roles: [BranchManager, YardTechnician]
    code: 200
    input: []
    output: InspectionRecord
    side_effects: []
  - method: POST
    path: /inspection-records/{id}/certify
    description: "Branch manager certifies a submitted inspection (must not be the inspector)"
    roles: [BranchManager]
    code: 200
    input: []
    output: InspectionRecord
    side_effects: ["InspectionRecord SUBMITTED -> CERTIFIED", "PASS: unit inspection dates update / QUARANTINED -> AVAILABLE", "FAIL: unit AVAILABLE -> QUARANTINED + RESERVED line cancellation cascade", "increments InspectionRecord.version by 1"]
  - method: POST
    path: /inspection-records/{id}/reject
    description: "Branch manager rejects a submitted inspection (must not be the inspector)"
    roles: [BranchManager]
    code: 200
    input: []
    output: InspectionRecord
    side_effects: ["InspectionRecord SUBMITTED -> REJECTED", "increments InspectionRecord.version by 1"]

  - method: POST
    path: /training-records
    description: "Document familiarization training for a customer's crew on an equipment class"
    roles: [YardTechnician]
    code: 201
    input: [customer_id, class_id, trainee_name, trained_at]
    output: TrainingRecord
    side_effects: ["trainer_id = X-User-ID", "valid_until = trained_at + 365 days"]
  - method: GET
    path: /training-records
    description: "List training records with optional filters"
    roles: [BranchManager, RentalCoordinator, YardTechnician]
    code: 200
    input: ["customer_id?", "class_id?", "limit?", "offset?"]
    output: TrainingRecord[]
    side_effects: []
  - method: GET
    path: /training-records/{id}
    description: "Read one training record"
    roles: [BranchManager, RentalCoordinator, YardTechnician]
    code: 200
    input: []
    output: TrainingRecord
    side_effects: []

  - method: POST
    path: /damage-claims
    description: "Report damage or loss on a line that is OUT_ON_RENT, OFF_RENT, or RETURNED"
    roles: [RentalCoordinator, Customer]
    code: 201
    input: [line_id, claim_type, description]
    output: DamageClaim
    side_effects: ["status = OPEN", "contract_id/unit_id copied from line", "reported_by = X-User-ID"]
  - method: GET
    path: /damage-claims
    description: "List claims with optional filters (Customer restricted to own contract's claims)"
    roles: [BranchManager, RentalCoordinator, Customer]
    code: 200
    input: ["line_id?", "unit_id?", "contract_id?", "status?", "limit?", "offset?"]
    output: DamageClaim[]
    side_effects: []
  - method: GET
    path: /damage-claims/{id}
    description: "Read one claim"
    roles: [BranchManager, RentalCoordinator, Customer]
    code: 200
    input: []
    output: DamageClaim
    side_effects: []
  - method: POST
    path: /damage-claims/{id}/assess
    description: "Assess an OPEN claim (repair estimate for DAMAGE; replacement value auto-set for LOST/STOLEN)"
    roles: [BranchManager]
    code: 200
    input: ["repair_estimate_cents?"]
    output: DamageClaim
    side_effects: ["DamageClaim OPEN -> ASSESSED", "increments DamageClaim.version by 1"]
  - method: POST
    path: /damage-claims/{id}/charge
    description: "Charge an ASSESSED claim; computes chargeback with damage-waiver rules and cascades to contract/customer/unit"
    roles: [BranchManager]
    code: 200
    input: []
    output: DamageClaim
    side_effects: ["DamageClaim ASSESSED -> CHARGED", "calculations.damage_chargeback", "contract damage_subtotal recompute", "customer_outstanding_balance recompute + possible SUSPENDED cascade", "LOST/STOLEN: unit ON_RENT -> LOST", "increments DamageClaim.version by 1", "increments RentalContract.version by 1"]
  - method: POST
    path: /damage-claims/{id}/dispute
    description: "Customer disputes a CHARGED claim"
    roles: [Customer]
    code: 200
    input: []
    output: DamageClaim
    side_effects: ["DamageClaim CHARGED -> DISPUTED", "increments DamageClaim.version by 1"]
  - method: POST
    path: /damage-claims/{id}/resolve
    description: "Branch manager resolves a DISPUTED claim: UPHOLD returns to CHARGED, WAIVE moves to WAIVED and backs out the chargeback"
    roles: [BranchManager]
    code: 200
    input: [decision]
    output: DamageClaim
    side_effects: ["DamageClaim DISPUTED -> CHARGED | WAIVED", "WAIVE: contract damage_subtotal recompute (compensation)", "customer_outstanding_balance recompute", "increments DamageClaim.version by 1"]

  - method: POST
    path: /_clock/set_current_utc
    description: "Set the logical server clock (test-driving endpoint). Server startup default is 2026-08-01T00:00:00Z; before any set_current_utc call the logical clock reads exactly that value and never falls back to wall-clock time."
    roles: [BranchManager]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: ["logical clock set; all date-sensitive computed fields (is_valid, rentability, provisional quotes) evaluate against this clock"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/malformed X-User-Role or X-User-ID, or undeclared role" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted on endpoint, or entity_backed ownership mismatch (Customer not the contract's customer; Driver not the trip's driver)" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, invalid type/enum/date format, end before start" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path id or body FK reference does not exist" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_contract_version != RentalContract.version on POST /rental-lines" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "State-machine precondition violated (wrong from-state, terminal lockdown, cross-entity state gate)" }
  - { id: ERR_UNIT_NOT_RENTABLE, http: 422, condition: "DELIVERY completion while unit not AVAILABLE or logical clock date > next_inspection_due_date" }
  - { id: ERR_FAMILIARIZATION_REQUIRED, http: 422, condition: "Class requires familiarization and no VALID TrainingRecord exists for (customer, class) at line creation" }
  - { id: ERR_ENGINEERING_PLAN_REQUIRED, http: 422, condition: "Class requires engineering and engineering_plan_ref missing at line creation" }
  - { id: ERR_REACH_EXCEEDED, http: 422, condition: "required_working_height_ft > class.max_working_height_ft at line creation" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 422, condition: "Certifier/rejecter X-User-ID equals the inspection record's inspector_id" }
  - { id: ERR_LINES_OUTSTANDING, http: 409, condition: "Close attempted with a line not in {RETURNED, CANCELLED}" }
  - { id: ERR_OPEN_CLAIMS_EXIST, http: 409, condition: "Close attempted with a claim in {OPEN, ASSESSED, DISPUTED}" }
  - { id: ERR_UNIT_WINDOW_CONFLICT, http: 409, condition: "New line's half-open window intersects an existing RESERVED/OUT_ON_RENT/OFF_RENT line on the same unit" }
  - { id: ERR_ROUTE_WINDOW_CONFLICT, http: 409, condition: "New/rescheduled trip intersects the 45-minute buffered window of another SCHEDULED/EN_ROUTE trip for the same driver" }
  - { id: ERR_CUSTOMER_SUSPENDED, http: 402, condition: "Contract create / line create / activate while customer.status == SUSPENDED" }
  - { id: ERR_CREDIT_LIMIT_EXCEEDED, http: 402, condition: "Activation (or reinstate) would leave outstanding balance above credit_limit_cents" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: BranchManager
    description: "Branch operations manager; owns catalog, fleet, inspections certification, claims financial decisions, customer credit actions"
    identity: opaque
    exclusive_operations:
      - "POST /customer-accounts, POST /customer-accounts/{id}/reinstate"
      - "POST /equipment-classes, POST /equipment-units, POST /equipment-units/{id}/recover"
      - "POST /inspection-records/{id}/certify, POST /inspection-records/{id}/reject"
      - "POST /damage-claims/{id}/assess, POST /damage-claims/{id}/charge, POST /damage-claims/{id}/resolve"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "read access to all list/detail endpoints"
  - name: RentalCoordinator
    description: "Rental counter representative; owns contracts, lines, and trip scheduling"
    identity: opaque
    exclusive_operations:
      - "POST /rental-contracts, POST /rental-contracts/{id}/activate, POST /rental-contracts/{id}/close"
      - "POST /rental-lines"
      - "POST /delivery-trips, POST /delivery-trips/{id}/reschedule"
    shared_operations:
      - "POST /rental-lines/{id}/off-rent, POST /rental-lines/{id}/re-rent (shared with Customer)"
      - "POST /damage-claims (shared with Customer)"
      - "read access to catalog, fleet, contracts, lines, trips, training records, claims"
  - name: Driver
    description: "Route driver; executes assigned delivery/pickup trips"
    identity: opaque
    exclusive_operations:
      - "POST /delivery-trips/{id}/start, POST /delivery-trips/{id}/complete, POST /delivery-trips/{id}/fail (only when X-User-ID == trip.driver_id)"
    shared_operations:
      - "GET /delivery-trips, GET /delivery-trips/{id}"
  - name: YardTechnician
    description: "Yard technician; performs annual inspections and documents familiarization training"
    identity: opaque
    exclusive_operations:
      - "POST /inspection-records"
      - "POST /training-records"
    shared_operations:
      - "GET /equipment-units, GET /inspection-records, GET /training-records (list/detail)"
  - name: Customer
    description: "Renting customer acting as its CustomerAccount"
    identity: entity_backed:CustomerAccount
    exclusive_operations:
      - "POST /damage-claims/{id}/dispute (own contract's claims only)"
    shared_operations:
      - "POST /rental-lines/{id}/off-rent, POST /rental-lines/{id}/re-rent (own contracts only; shared with RentalCoordinator)"
      - "POST /damage-claims (own contracts' lines only; shared with RentalCoordinator)"
      - "read own customer record, contracts, lines, invoice, claims, equipment classes"
