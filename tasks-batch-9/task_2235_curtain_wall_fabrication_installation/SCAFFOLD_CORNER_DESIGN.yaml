          package_id: ${pkg}
          floor_number: 3
          elevation_label: NORTH
          area_sqm: 300.0
          height_m: 18.0
          span_mm: 3200
          anchor_type: SLOTTED
          designed_joint_mm: 22.0
          planned_panel_count: 36
          budget_crew_hours: 320.0
        as: CWProjectManager
        captures:
          zl: $.data.id
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-08-10T09:00:00Z'
        as: CWProjectManager
      trigger:
      - call: POST /installation-zones/${zh}/crew-days
        payload:
          work_date: '2026-08-10'
          crew_size: 4
          shift_hours: 10.0
          panels_installed: 10
        as: FieldSuperintendent
        as_user_id: u-super-1
        captures:
          cd_h: $.data.id
      - call: POST /installation-zones/${zl}/crew-days
        payload:
          work_date: '2026-08-10'
          crew_size: 4
          shift_hours: 10.0
          panels_installed: 10
        as: FieldSuperintendent
        as_user_id: u-super-1
        captures:
          cd_l: $.data.id
      assert:
      - CrewDayLog.${cd_h}.straight_person_hours == 32.0 and overtime_person_hours == 8.0
      - CrewDayLog.${cd_h}.day_cost_cents == 495880 (431200 * 1.15, rounded half up to whole cents)
      - CrewDayLog.${cd_l}.day_cost_cents == 431200 - the elevation factor is 1.00 at height 18.0
      - InstallationZone.${zh}.consumed_crew_hours == 40.0 and remaining_crew_hours == 280.0
      - both logs carry day_index == 1 within their own zone (day_index is per zone, not global)
      - a 4-crew 8.0-hour day on ${zh} would price 32*9800*1.15 = 360640 with overtime_person_hours 0.0
  - name: engineering_posture_reaches_a_fixed_point_in_one_pass
    claim_type: correct_result
    grounds:
    - calculations.engineering_posture
    - entities.FacadePackage.fields.engineering_posture
    - entities.FacadePackage.fields.blocking_submittal_count
    - entities.FacadePackage.fields.open_critical_defect_count
    distinguishing_aspect: 'The posture is re-derived from scratch on every contributing write and walks OPEN -> RESTRICTED
      -> FROZEN -> RESTRICTED -> OPEN as the two independent inputs change: one open critical defect gives RESTRICTED, a
      second gives FROZEN, closing one returns to RESTRICTED, and closing the last returns to OPEN with both counters at
      0 - never a latched value.'
    test_recipe:
      setup:
      - logical clock 2026-08-03T08:00:00Z; package decided UNITIZED with a FAILED mockup that raised one CRITICAL defect
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-08-03T08:00:00Z'
        as: CWProjectManager
      - call: POST /facade-packages
        payload:
          name: Tower A Facade
          floor_count: 20
          total_area_sqm: 9000.0
          contract_value_cents: 1450000000
          unit_rate_cents_per_sqm: 148733
          base_labor_rate_cents_per_hour: 9800
          design_temp_delta_c: 60.0
          weather_tightness_deadline_date: '2026-12-15'
        as: CWProjectManager
        captures:
          pkg: $.data.id
      - call: POST /facade-packages/${pkg}/system-decision
        payload:
          system_type: UNITIZED
        as: CWProjectManager
      - call: POST /test-labs
        payload:
          name: Chamber Labs NE
          chamber_capacity: 2
          accreditation_ref: AAMA-CL-01
        as: CWProjectManager
        captures:
          lab: $.data.id
      - call: POST /mockup-tests
        payload:
          package_id: ${pkg}
          test_lab_id: ${lab}
          window_start: '2026-08-05T06:00:00Z'
          window_end: '2026-08-05T20:00:00Z'
          chambers_required: 1
        as: CWProjectManager
        captures:
          mock1: $.data.id
      - call: POST /mockup-tests/${mock1}/record-result
        payload:
          water_penetration_observed: true
          air_infiltration_cfm: 0.04
          structural_deflection_mm: 15.0
        as: QCInspector
        as_user_id: u-qc-1
      - call: GET /defect-items
        payload:
          package_id: ${pkg}
          status: OPEN
        as: QCInspector
        as_user_id: u-qc-1
        captures:
          df1: $.data[0].id
      trigger:
      - call: POST /defect-items
        payload:
          package_id: ${pkg}
          origin: MOCKUP_TEST
          severity: CRITICAL
          mockup_test_id: ${mock1}
          description: second critical finding at the mullion splice
        as: QCInspector
        as_user_id: u-qc-1
        captures:
          df2: $.data.id
      - call: POST /defect-items/${df2}/submit-remediation
        payload:
          remediation_note: splice re-detailed
        as: CWDetailer
      - call: POST /defect-items/${df2}/reinspect
        payload:
          outcome: PASS
        as: QCInspector
        as_user_id: u-qc-2
      - call: POST /defect-items/${df1}/submit-remediation
        payload:
          remediation_note: gasket re-tooled
        as: CWDetailer
      - call: POST /defect-items/${df1}/reinspect
        payload:
          outcome: PASS
        as: QCInspector
        as_user_id: u-qc-2
      assert:
      - with one CRITICAL defect OPEN the posture is RESTRICTED with open_critical_defect_count 1
      - with two CRITICAL defects the posture is FROZEN with open_critical_defect_count 2
      - REMEDIATION_SUBMITTED still counts as open, so submitting remediation on ${df2} leaves the posture FROZEN
      - after ${df2} closes the posture drops back to RESTRICTED with open_critical_defect_count 1
      - after ${df1} closes the posture is OPEN with open_critical_defect_count 0 and blocking_submittal_count 0
      - a single ESCALATED submittal would force FROZEN with zero open defects, so the two inputs are independent
