            - "${term_state} == PENDING"
            - "${term_cosign} == false"
            - "${q2_status} == APPROVED"
            - "${q2_risk_agg} == 5.00"
            - "${q2_risk_dom} == 6.25"
            - "NonStandardTerm.${term_id}.review_state == APPROVED"
