              as: LandAgent
              as_user_id: "la-user-01"
              captures: { p_id: "$.data.id" }
            - call: "POST /land-origination/title-curative-items"
              payload: { parcel_id: "${p_id}", item_type: "MINERAL_SEVERANCE", severity: "BLOCKING", curative_cost_cents: 250000 }
              as: TitleCounsel
              as_user_id: "tc-user-01"
              captures: { a_id: "$.data.id" }
            - call: "POST /land-origination/title-curative-items"
              payload: { parcel_id: "${p_id}", item_type: "MORTGAGE_SUBORDINATION", severity: "BLOCKING", curative_cost_cents: 180000, blocks_item_id: "${a_id}" }
              as: TitleCounsel
              as_user_id: "tc-user-01"
              captures: { b_id: "$.data.id", b_status: "$.data.status" }
          trigger:
            - call: "POST /land-origination/title-curative-items/${b_id}/clear"
