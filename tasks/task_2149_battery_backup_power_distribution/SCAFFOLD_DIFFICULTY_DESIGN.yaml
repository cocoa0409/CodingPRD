        distinguishing_aspect: |
          Entity pair Order -> Account: the order is a perfectly valid DRAFT with one
          line, yet DRAFT -> SUBMITTED is refused with ERR_ACCOUNT_NOT_ACTIVE purely
          because the Account row sits in CREDIT_HOLD after a 600000 cent core-deposit
          liability was booked by an unrelated delivery.
