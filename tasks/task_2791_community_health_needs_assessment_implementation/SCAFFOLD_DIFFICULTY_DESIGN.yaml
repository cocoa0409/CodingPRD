      - name: committed_commitment_release_restores_partnership_funding_and_party_fte
        grounds:
          - state_machines.ResourceCommitment.COMMITTED_to_RELEASED
          - calculations.party_committed_fte.constants.CONSERVED_QUANTITY
          - entities.PartnershipAgreement.fields.funded_cents
        distinguishing_aspect: |
          Releasing an ACTIVATED commitment must reverse a strictly larger set
          of side effects than releasing a pending one: besides the party's
          effort and the strategy envelope, the partnership's funded_cents must
