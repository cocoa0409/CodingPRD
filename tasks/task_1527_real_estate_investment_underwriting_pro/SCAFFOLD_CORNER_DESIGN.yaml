scaffold_corner_design:
  # ===========================================================================
  # Entities — creation, retrieval, defaults, computed fields, system fields,
  # required fields, FK reverse-reachability
  # ===========================================================================
  - section: entities
    instances:
      - name: deal_create_returns_server_minted_id_and_draft_status
        claim_type: creation
        grounds: [entities.Deal, "endpoints.POST /re-underwriting/deals"]
        distinguishing_aspect: "POST /deals with valid body returns 201 with server-minted id, status=DRAFT, version=1, analyst_id stamped from X-User-ID."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /re-underwriting/deals"
              payload: { deal_code: "D-COR1", deal_name: "Corner", strategy: "CORE", target_purchase_price_cents: 100000000 }
              as: Analyst
              as_user_id: "u-analyst-1"
              captures: { deal_id: $.data.id }
          assert:
            - "HTTP 201"
            - "Deal.status == DRAFT (initial state)"
            - "Deal.version == 1"
            - "Deal.analyst_id == 'u-analyst-1' (stamped from header)"
            - "Deal.id is a UUID with no prefix"

      - name: deal_get_returns_persisted_entity
        claim_type: retrieval
        grounds: [entities.Deal, "endpoints.GET /re-underwriting/deals/{id}"]
        distinguishing_aspect: "GET /deals/{id} returns the same entity created earlier, with all input fields preserved."
        test_recipe:
          setup: ["Deal D1 exists"]
          setup_api_calls:
            - call: "POST /re-underwriting/deals"
              payload: { deal_code: "D-COR2", deal_name: "Get Test", strategy: "VALUE_ADD", target_purchase_price_cents: 200000000 }
              as: Analyst
              as_user_id: "u-analyst-1"
              captures: { deal_id: $.data.id }
          trigger:
            - call: "GET /re-underwriting/deals/${deal_id}"
              as: Analyst
              as_user_id: "u-analyst-1"
          assert:
            - "Deal.deal_code == 'D-COR2'"
            - "Deal.target_purchase_price_cents == 200000000"

      - name: deal_get_nonexistent_returns_404
        claim_type: not_found
        grounds: [errors.ERR_NOT_FOUND]
        distinguishing_aspect: "GET on a random UUID that was never created returns 404 with ERR_NOT_FOUND."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /re-underwriting/deals/00000000-0000-0000-0000-000000000000"
              as: Analyst
              as_user_id: "u-analyst-1"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 404"
            - "error_id == ERR_NOT_FOUND"

      - name: deal_create_missing_required_field_returns_400
        claim_type: required_fields
        grounds: [entities.Deal, errors.ERR_INVALID_REQUEST]
        distinguishing_aspect: "POST /deals missing deal_code returns 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /re-underwriting/deals"
              payload: { deal_name: "X", strategy: "CORE", target_purchase_price_cents: 100 }
              as: Analyst
              as_user_id: "u-analyst-1"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 400"
            - "error_id == ERR_INVALID_REQUEST"

      - name: property_occupancy_pct_computed_from_rent_roll
        claim_type: computed_field
        grounds: [entities.Property.fields.occupancy_pct, calculations.occupancy_pct]
        distinguishing_aspect: "Property.occupancy_pct is null at creation and is computed from the latest RentRollPeriod on POST /rent-roll."
        test_recipe:
          setup: ["Property P with no rent roll yet"]
          setup_api_calls:
            - call: "POST /re-underwriting/deals"
              payload: { deal_code: "D-OCC", deal_name: "Occ", strategy: "CORE", target_purchase_price_cents: 10000000 }
              as: Analyst
              as_user_id: "u-analyst-1"
              captures: { deal_id: $.data.id }
            - call: "POST /re-underwriting/deals/${deal_id}/properties"
              payload: { address_line: "1", market: "M", property_type: "MULTIFAMILY", units: 10, rentable_sqft: 10000, year_built: 2000 }
              as: Analyst
              as_user_id: "u-analyst-1"
              captures: { prop_id: $.data.id, occ_init: $.data.occupancy_pct }
          trigger:
            - call: "POST /re-underwriting/properties/${prop_id}/rent-roll"
              payload: { period_month: "2026-06", occupied_units: 9, total_units: 10, gross_potential_rent_cents: 1000000, collected_rent_cents: 900000, source_doc_ref: "rr" }
              as: Analyst
              as_user_id: "u-analyst-1"
            - call: "GET /re-underwriting/properties/${prop_id}"
              as: Analyst
              as_user_id: "u-analyst-1"
              captures: { occ_after: $.data.occupancy_pct }
          assert:
            - "occupancy_pct at creation == null"
            - "After rent-roll POST: occupancy_pct == 90.0"

      - name: property_invalid_enum_returns_400
        claim_type: type_constraint
        grounds: [entities.Property.fields.property_type]
        distinguishing_aspect: "Invalid property_type enum value returns 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["Deal exists"]
          setup_api_calls:
            - call: "POST /re-underwriting/deals"
              payload: { deal_code: "D-ENUM", deal_name: "E", strategy: "CORE", target_purchase_price_cents: 100 }
              as: Analyst
              as_user_id: "u-analyst-1"
              captures: { deal_id: $.data.id }
          trigger:
            - call: "POST /re-underwriting/deals/${deal_id}/properties"
              payload: { address_line: "1", market: "M", property_type: "CASTLE", units: 10, rentable_sqft: 10000, year_built: 2000 }
              as: Analyst
              as_user_id: "u-analyst-1"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 400"
            - "error_id == ERR_INVALID_REQUEST"

      - name: scenario_list_filter_by_status
        claim_type: listing
        grounds: ["endpoints.GET /re-underwriting/deals/{id}/scenarios"]
        distinguishing_aspect: "GET /deals/{id}/scenarios?status=COMPUTED returns only computed scenarios; pagination envelope includes limit/offset/total_count/has_more."
        test_recipe:
          setup: ["Deal D1 in UNDERWRITING with two scenarios: S1 COMPUTED, S2 DRAFT"]
          setup_api_calls:
            - call: "POST /re-underwriting/deals"
              payload: { deal_code: "D-LIST", deal_name: "L", strategy: "CORE", target_purchase_price_cents: 100000000 }
              as: Analyst
              as_user_id: "u-analyst-1"
              captures: { deal_id: $.data.id }
            - call: "POST /re-underwriting/deals/${deal_id}/properties"
              payload: { address_line: "1", market: "M", property_type: "OFFICE", units: 10, rentable_sqft: 20000, year_built: 2000 }
              as: Analyst
              as_user_id: "u-analyst-1"
              captures: { prop_id: $.data.id }
            - call: "POST /re-underwriting/properties/${prop_id}/rent-roll"
              payload: { period_month: "2026-06", occupied_units: 9, total_units: 10, gross_potential_rent_cents: 1000000, collected_rent_cents: 900000, source_doc_ref: "rr" }
              as: Analyst
              as_user_id: "u-analyst-1"
            - call: "POST /re-underwriting/properties/${prop_id}/operating-expenses"
              payload: { period_year: 2025, category: "TAXES", amount_cents: 1000000 }
              as: Analyst
              as_user_id: "u-analyst-1"
            - call: "POST /re-underwriting/deals/${deal_id}/assumptions"
              payload: { label: "B", market_rent_growth_yr1_bps: 200, market_rent_growth_steady_bps: 200, expense_growth_bps: 200, exit_cap_rate_bps: 600, hold_period_years: 5, capex_per_unit_cents: 100000, lease_up_months: 0 }
              as: Analyst
              as_user_id: "u-analyst-1"
              captures: { assum_id: $.data.id }
            - call: "POST /re-underwriting/deals/${deal_id}/submit-underwriting"
              payload: {}
              as: Analyst
              as_user_id: "u-analyst-1"
              captures: { deal_v2: $.data.version }
            - call: "POST /re-underwriting/deals/${deal_id}/scenarios"
              payload: { scenario_kind: "BASE", assumption_id: "${assum_id}", occupancy_stress_pct: 90, expected_deal_version: "${deal_v2}" }
              as: Analyst
              as_user_id: "u-analyst-1"
              captures: { s1: $.data.id, deal_v3: $.data.version }
            - call: "POST /re-underwriting/scenarios/${s1}/compute"
              payload: {}
              as: Analyst
              as_user_id: "u-analyst-1"
            - call: "POST /re-underwriting/deals/${deal_id}/scenarios"
              payload: { scenario_kind: "DOWNSIDE", assumption_id: "${assum_id}", occupancy_stress_pct: 80, expected_deal_version: "${deal_v3}" }
              as: Analyst
              as_user_id: "u-analyst-1"
              captures: { s2: $.data.id }
          trigger:
            - call: "GET /re-underwriting/deals/${deal_id}/scenarios"
              payload: {}
              as: Analyst
              as_user_id: "u-analyst-1"
          assert:
            - "When filter status=COMPUTED: response contains S1 only"
            - "When filter status=DRAFT: response contains S2 only"
            - "Pagination fields limit/offset/total_count/has_more are present"

      - name: rent_roll_immutable_after_create
        claim_type: immutability
        grounds: [entities.RentRollPeriod]
        distinguishing_aspect: "RentRollPeriod has common_fields: false (no version field, no update endpoint) — append-only event log semantics."
        test_recipe:
          setup: ["Rent roll row exists for 2026-06"]
          setup_api_calls:
            - call: "POST /re-underwriting/deals"
              payload: { deal_code: "D-IMM", deal_name: "I", strategy: "CORE", target_purchase_price_cents: 10000000 }
              as: Analyst
              as_user_id: "u-analyst-1"
              captures: { deal_id: $.data.id }
            - call: "POST /re-underwriting/deals/${deal_id}/properties"
              payload: { address_line: "1", market: "M", property_type: "MULTIFAMILY", units: 10, rentable_sqft: 10000, year_built: 2000 }
              as: Analyst
              as_user_id: "u-analyst-1"
              captures: { prop_id: $.data.id }
          trigger:
            - call: "POST /re-underwriting/properties/${prop_id}/rent-roll"
              payload: { period_month: "2026-06", occupied_units: 9, total_units: 10, gross_potential_rent_cents: 1000000, collected_rent_cents: 900000, source_doc_ref: "rr" }
              as: Analyst
              as_user_id: "u-analyst-1"
              captures: { rr_id: $.data.id, rr_version: $.data.version }
          assert:
            - "Response has no `version` field (common_fields: false)"
            - "Response has `id` and `created_at` only as system fields"
            - "No PUT/PATCH endpoint exists for RentRollPeriod in §1.5"

  # ===========================================================================
  # State machines — invalid transitions, terminal lockdown, side effects
  # ===========================================================================
  - section: state_machines
    instances:
      - name: deal_submit_underwriting_twice_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.Deal.DRAFT_to_UNDERWRITING, errors.ERR_INVALID_STATE]
        distinguishing_aspect: "Second submit-underwriting on an already-UNDERWRITING deal is rejected (state machine has no UNDERWRITING -> UNDERWRITING transition)."
        test_recipe:
          setup: ["Deal in UNDERWRITING"]
          setup_api_calls:
            - call: "POST /re-underwriting/deals"
              payload: { deal_code: "D-INV1", deal_name: "I1", strategy: "CORE", target_purchase_price_cents: 100 }
              as: Analyst
              as_user_id: "u-analyst-1"
              captures: { deal_id: $.data.id }
            - call: "POST /re-underwriting/deals/${deal_id}/properties"
              payload: { address_line: "1", market: "M", property_type: "OFFICE", units: 1, rentable_sqft: 1000, year_built: 2000 }
              as: Analyst
              as_user_id: "u-analyst-1"
            - call: "POST /re-underwriting/deals/${deal_id}/assumptions"
              payload: { label: "B", market_rent_growth_yr1_bps: 100, market_rent_growth_steady_bps: 100, expense_growth_bps: 100, exit_cap_rate_bps: 500, hold_period_years: 5, capex_per_unit_cents: 0, lease_up_months: 0 }
              as: Analyst
              as_user_id: "u-analyst-1"
            - call: "POST /re-underwriting/deals/${deal_id}/submit-underwriting"
              payload: {}
              as: Analyst
              as_user_id: "u-analyst-1"
          trigger:
            - call: "POST /re-underwriting/deals/${deal_id}/submit-underwriting"
              payload: {}
              as: Analyst
              as_user_id: "u-analyst-1"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409, error_id == ERR_INVALID_STATE"

      - name: deal_approved_is_terminal_no_further_transitions
        claim_type: terminal_state_lockdown
        grounds: [state_machines.Deal]
        distinguishing_aspect: "Once a Deal reaches APPROVED, no further transitions are valid (no reopen, no mark-dead, no submit-ic)."
        test_recipe:
          setup: ["Deal APPROVED via 2 YES votes"]
          setup_api_calls:
            - call: "POST /re-underwriting/deals"
              payload: { deal_code: "D-TERM", deal_name: "T", strategy: "CORE", target_purchase_price_cents: 100000000 }
              as: Analyst
              as_user_id: "u-analyst-1"
              captures: { deal_id: $.data.id }
            - call: "POST /re-underwriting/deals/${deal_id}/properties"
              payload: { address_line: "1", market: "M", property_type: "OFFICE", units: 10, rentable_sqft: 20000, year_built: 2000 }
              as: Analyst
              as_user_id: "u-analyst-1"
              captures: { prop_id: $.data.id }
            - call: "POST /re-underwriting/properties/${prop_id}/rent-roll"
              payload: { period_month: "2026-06", occupied_units: 9, total_units: 10, gross_potential_rent_cents: 1000000, collected_rent_cents: 900000, source_doc_ref: "rr" }
              as: Analyst
              as_user_id: "u-analyst-1"
            - call: "POST /re-underwriting/properties/${prop_id}/operating-expenses"
              payload: { period_year: 2025, category: "TAXES", amount_cents: 1000000 }
              as: Analyst
              as_user_id: "u-analyst-1"
            - call: "POST /re-underwriting/deals/${deal_id}/assumptions"
              payload: { label: "B", market_rent_growth_yr1_bps: 200, market_rent_growth_steady_bps: 200, expense_growth_bps: 200, exit_cap_rate_bps: 600, hold_period_years: 5, capex_per_unit_cents: 100000, lease_up_months: 0 }
              as: Analyst
              as_user_id: "u-analyst-1"
              captures: { assum_id: $.data.id }
            - call: "POST /re-underwriting/deals/${deal_id}/submit-underwriting"
              payload: {}
              as: Analyst
              as_user_id: "u-analyst-1"
              captures: { deal_v2: $.data.version }
            - call: "POST /re-underwriting/deals/${deal_id}/scenarios"
              payload: { scenario_kind: "BASE", assumption_id: "${assum_id}", occupancy_stress_pct: 90, expected_deal_version: "${deal_v2}" }
              as: Analyst
              as_user_id: "u-analyst-1"
              captures: { scen_id: $.data.id, deal_v3: $.data.version }
            - call: "POST /re-underwriting/scenarios/${scen_id}/compute"
              payload: {}
              as: Analyst
              as_user_id: "u-analyst-1"
            - call: "POST /re-underwriting/deals/${deal_id}/ic-memos"
              payload: { scenario_id: "${scen_id}", recommendation: "PURSUE", thesis: "t", risks: "r", expected_deal_version: "${deal_v3}" }
              as: Analyst
              as_user_id: "u-analyst-1"
              captures: { memo_id: $.data.id }
            - call: "POST /re-underwriting/ic-memos/${memo_id}/submit"
              payload: {}
              as: Analyst
              as_user_id: "u-analyst-1"
            - call: "POST /re-underwriting/deals/${deal_id}/submit-ic"
              payload: {}
              as: AssetManager
              as_user_id: "u-am-1"
            - call: "POST /re-underwriting/ic-memos/${memo_id}/vote"
              payload: { vote: "YES" }
              as: IC_Member
              as_user_id: "u-ic-1"
            - call: "POST /re-underwriting/ic-memos/${memo_id}/vote"
              payload: { vote: "YES" }
              as: IC_Member
              as_user_id: "u-ic-2"
          trigger:
            - call: "POST /re-underwriting/deals/${deal_id}/reopen"
              payload: {}
              as: Analyst
              as_user_id: "u-analyst-1"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409, error_id == ERR_INVALID_STATE (APPROVED is terminal)"

      - name: deal_mark_dead_from_underwriting_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.Deal]
        distinguishing_aspect: "mark-dead is only valid from REJECTED; from UNDERWRITING it MUST be rejected."
        test_recipe:
          setup: ["Deal in UNDERWRITING"]
          setup_api_calls:
            - call: "POST /re-underwriting/deals"
              payload: { deal_code: "D-MD", deal_name: "MD", strategy: "CORE", target_purchase_price_cents: 100 }
              as: Analyst
              as_user_id: "u-analyst-1"
              captures: { deal_id: $.data.id }
            - call: "POST /re-underwriting/deals/${deal_id}/properties"
              payload: { address_line: "1", market: "M", property_type: "OFFICE", units: 1, rentable_sqft: 1000, year_built: 2000 }
              as: Analyst
              as_user_id: "u-analyst-1"
            - call: "POST /re-underwriting/deals/${deal_id}/assumptions"
              payload: { label: "B", market_rent_growth_yr1_bps: 100, market_rent_growth_steady_bps: 100, expense_growth_bps: 100, exit_cap_rate_bps: 500, hold_period_years: 5, capex_per_unit_cents: 0, lease_up_months: 0 }
              as: Analyst
              as_user_id: "u-analyst-1"
            - call: "POST /re-underwriting/deals/${deal_id}/submit-underwriting"
              payload: {}
              as: Analyst
              as_user_id: "u-analyst-1"
          trigger:
            - call: "POST /re-underwriting/deals/${deal_id}/mark-dead"
              payload: {}
              as: AssetManager
              as_user_id: "u-am-1"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409, error_id == ERR_INVALID_STATE"

      - name: memo_submit_on_non_computed_scenario_returns_error
        claim_type: precondition_enforcement
        grounds: [state_machines.ICMemo.DRAFT_to_SUBMITTED, errors.ERR_SCENARIO_NOT_COMPUTED]
        distinguishing_aspect: "Memo create requires scenario_id to be a COMPUTED scenario on the same deal; DRAFT or other-deal scenarios return ERR_SCENARIO_NOT_COMPUTED (422)."
        test_recipe:
          setup: ["Deal D1 UNDERWRITING with Scenario S1 still in DRAFT"]
          setup_api_calls:
            - call: "POST /re-underwriting/deals"
              payload: { deal_code: "D-PS", deal_name: "PS", strategy: "CORE", target_purchase_price_cents: 100000000 }
              as: Analyst
              as_user_id: "u-analyst-1"
              captures: { deal_id: $.data.id }
            - call: "POST /re-underwriting/deals/${deal_id}/properties"
              payload: { address_line: "1", market: "M", property_type: "OFFICE", units: 10, rentable_sqft: 20000, year_built: 2000 }
              as: Analyst
              as_user_id: "u-analyst-1"
              captures: { prop_id: $.data.id }
            - call: "POST /re-underwriting/properties/${prop_id}/rent-roll"
              payload: { period_month: "2026-06", occupied_units: 9, total_units: 10, gross_potential_rent_cents: 1000000, collected_rent_cents: 900000, source_doc_ref: "rr" }
              as: Analyst
              as_user_id: "u-analyst-1"
            - call: "POST /re-underwriting/properties/${prop_id}/operating-expenses"
              payload: { period_year: 2025, category: "TAXES", amount_cents: 1000000 }
              as: Analyst
              as_user_id: "u-analyst-1"
            - call: "POST /re-underwriting/deals/${deal_id}/assumptions"
              payload: { label: "B", market_rent_growth_yr1_bps: 200, market_rent_growth_steady_bps: 200, expense_growth_bps: 200, exit_cap_rate_bps: 600, hold_period_years: 5, capex_per_unit_cents: 100000, lease_up_months: 0 }
              as: Analyst
              as_user_id: "u-analyst-1"
              captures: { assum_id: $.data.id }
            - call: "POST /re-underwriting/deals/${deal_id}/submit-underwriting"
              payload: {}
              as: Analyst
              as_user_id: "u-analyst-1"
              captures: { deal_v2: $.data.version }
            - call: "POST /re-underwriting/deals/${deal_id}/scenarios"
              payload: { scenario_kind: "BASE", assumption_id: "${assum_id}", occupancy_stress_pct: 90, expected_deal_version: "${deal_v2}" }
              as: Analyst
              as_user_id: "u-analyst-1"
              captures: { scen_id: $.data.id, deal_v3: $.data.version }
          trigger:
            - call: "POST /re-underwriting/deals/${deal_id}/ic-memos"
              payload: { scenario_id: "${scen_id}", recommendation: "PURSUE", thesis: "t", risks: "r", expected_deal_version: "${deal_v3}" }
              as: Analyst
              as_user_id: "u-analyst-1"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 422, error_id == ERR_SCENARIO_NOT_COMPUTED (scenario is DRAFT, not COMPUTED)"

  # ===========================================================================
  # Calculations — IRR / equity multiple / occupancy / NOI correctness
  # ===========================================================================
  - section: calculations
    instances:
      - name: irr_and_equity_multiple_match_pinned_inputs
        claim_type: correct_result
        grounds: [calculations.irr_unlevered, calculations.equity_multiple]
        distinguishing_aspect: "With pinned inputs (noi1=72275600 provisional, price=1000000000, growth=300bps, hold=5, exit_cap=550bps), computed_irr_bps and computed_equity_multiple_bp match the pre-computed reference values."
        test_recipe:
          setup: ["Scenario S1 ready for compute with the canonical rent roll / expense / assumption fixture"]
          setup_api_calls:
            - call: "POST /re-underwriting/deals"
              payload: { deal_code: "D-IRR", deal_name: "IRR", strategy: "CORE_PLUS", target_purchase_price_cents: 1000000000 }
              as: Analyst
              as_user_id: "u-analyst-1"
              captures: { deal_id: $.data.id }
            - call: "POST /re-underwriting/deals/${deal_id}/properties"
              payload: { address_line: "1 Main", market: "Austin", property_type: "MULTIFAMILY", units: 100, rentable_sqft: 100000, year_built: 2005 }
              as: Analyst
              as_user_id: "u-analyst-1"
              captures: { prop_id: $.data.id }
            - call: "POST /re-underwriting/properties/${prop_id}/rent-roll"
              payload: { period_month: "2026-06", occupied_units: 92, total_units: 100, gross_potential_rent_cents: 10000000, collected_rent_cents: 9200000, concessions_cents: 200000, source_doc_ref: "rr" }
              as: Analyst
              as_user_id: "u-analyst-1"
            - call: "POST /re-underwriting/properties/${prop_id}/operating-expenses"
              payload: { period_year: 2025, category: "TAXES", amount_cents: 12000000 }
              as: Analyst
              as_user_id: "u-analyst-1"
            - call: "POST /re-underwriting/properties/${prop_id}/operating-expenses"
              payload: { period_year: 2025, category: "INSURANCE", amount_cents: 3000000 }
              as: Analyst
              as_user_id: "u-analyst-1"
            - call: "POST /re-underwriting/properties/${prop_id}/operating-expenses"
              payload: { period_year: 2025, category: "UTILITIES", amount_cents: 4800000 }
              as: Analyst
              as_user_id: "u-analyst-1"
