# =============================================================================
# §1.9 Scaffold Corner Design — Corporate Fitness Center Management (task 2619)
#
# Breadth probe. Walks references/claim-extraction-guide.md section by section
# against this scaffold's §1.1-§1.7 surface and emits one instance per
# applicable row. Rows already exercised by SCAFFOLD_DIFFICULTY_DESIGN.yaml
# (§1.8, the depth probe) appear as `excluded_because:` stubs naming the
# covering instance; rows that do not apply to this domain are skipped.
#
# Reusable setup chains referenced by prose in `setup:` (always written out in
# full inside each `setup_api_calls:` — no chain is abbreviated):
#   * DRAFT-CONTRACT : clock 2026-08-01 -> POST /client-contracts (COST_PLUS)
#   * ACTIVE-CONTRACT: DRAFT-CONTRACT -> site manager -> CPR_AED credential ->
#                      verify -> submit -> client APPROVE
#   * ACTIVE-PROGRAM : ACTIVE-CONTRACT -> Studio A -> READY AED -> instructor
#                      with VERIFIED GROUP_EX_CERT + fresh drill -> offering
#                      -> ACTIVATE
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  # 1. From Table 1 (Entities)
  # ===========================================================================
  - section: entities
    instances:

      - name: create_client_contract_applies_declared_defaults
        claim_type: creation
        grounds:
          - endpoints[POST /client-contracts]
          - entities.ClientContract
          - response_envelope.success
        distinguishing_aspect: |
          A COST_PLUS contract created with every required input returns 201 and
          the response carries all fourteen declared fields, with every
          `source: computed` / `source: system` field at its declared default
          (status DRAFT, revision_round 0, all four ledger counters 0,
          approved_at and supersedes_contract_id null) and version 1.
        test_recipe:
          setup:
            - "Empty database; logical clock pinned to 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: OperatorAdmin
          trigger:
            - call: "POST /client-contracts"
              payload: { client_name: "Northwind Manufacturing", site_code: "NWM-01", fee_structure: "COST_PLUS", staffing_model: "OPERATOR_EMPLOYED", budgeted_staff_fte: 3.5, participation_target_pct: 35, term_start_on: "2026-07-01", term_end_on: "2027-06-30", not_to_exceed_cents: 5000000 }
              as: OperatorAdmin
              captures: { c_id: $.data.id }
          assert:
            - "HTTP 201 AND response_type == \"object\" AND meta.api_request_id and meta.api_request_timestamp are present"
            - "ClientContract.${c_id}.status == \"DRAFT\" AND version == 1"
            - "ClientContract.${c_id}.revision_round == 0 AND ytd_billed_cents == 0 AND pending_penalty_cents == 0 AND uncovered_session_count == 0 AND eligible_member_count == 0"
            - "ClientContract.${c_id}.approved_at == null AND supersedes_contract_id == null AND management_fee_cents == null"
            - "ClientContract.${c_id}.not_to_exceed_cents == 5000000 AND budgeted_staff_fte == 3.5 AND participation_target_pct == 35"
            - "ClientContract.${c_id}.id is a bare UUID with no type prefix; created_at and updated_at are ISO-8601 UTC with three fractional digits"

      - name: get_client_contract_returns_stored_entity
        claim_type: retrieval
        grounds:
          - endpoints[GET /client-contracts/{id}]
          - entities.ClientContract
        distinguishing_aspect: |
          The read path returns exactly what the write path stored — same id,
          same term dates, same fee terms — and is available to
          ComplianceAuditor, which never wrote anything.
        test_recipe:
          setup:
            - "DRAFT-CONTRACT chain: clock 2026-08-01T00:00:00Z, one COST_PLUS contract."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: OperatorAdmin
            - call: "POST /client-contracts"
              payload: { client_name: "Northwind Manufacturing", site_code: "NWM-01", fee_structure: "COST_PLUS", staffing_model: "OPERATOR_EMPLOYED", budgeted_staff_fte: 3.5, participation_target_pct: 35, term_start_on: "2026-07-01", term_end_on: "2027-06-30", not_to_exceed_cents: 5000000 }
              as: OperatorAdmin
              captures: { c_id: $.data.id }
          trigger:
            - call: "GET /client-contracts/${c_id}"
              payload: {}
              as: ComplianceAuditor
          assert:
            - "HTTP 200 AND response_type == \"object\" AND data.id == \"${c_id}\""
            - "data.client_name == \"Northwind Manufacturing\" AND data.site_code == \"NWM-01\" AND data.fee_structure == \"COST_PLUS\""
            - "data.term_start_on == \"2026-07-01\" AND data.term_end_on == \"2027-06-30\" AND data.status == \"DRAFT\" AND data.version == 1"

      - name: list_members_filtered_by_class_paginates
        claim_type: listing
        grounds:
          - endpoints[GET /members]
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: |
          Filter and pagination compose: total_count reflects the FILTERED set
          (2 EMPLOYEE rows out of 3 members), not the whole table, and has_more
          flips to false on the second page. A list endpoint that paginates
          before filtering reports total_count 3 and fails.
        test_recipe:
          setup:
            - "ACTIVE-CONTRACT chain."
            - "Three members on that contract: two EMPLOYEE (E-1001, E-1002) and one RETIREE (no employee_number)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: OperatorAdmin
            - call: "POST /client-contracts"
              payload: { client_name: "Northwind Manufacturing", site_code: "NWM-01", fee_structure: "COST_PLUS", staffing_model: "OPERATOR_EMPLOYED", budgeted_staff_fte: 3.5, participation_target_pct: 35, term_start_on: "2026-07-01", term_end_on: "2027-06-30", not_to_exceed_cents: 5000000 }
              as: OperatorAdmin
              captures: { c_id: $.data.id }
            - call: "POST /staff-members"
              payload: { contract_id: "${c_id}", full_name: "Dana Reed", role_type: "SITE_MANAGER", employment_type: "OPERATOR_EMPLOYED", hourly_cost_cents: 5200 }
              as: OperatorAdmin
              captures: { mgr_id: $.data.id }
            - call: "POST /staff-credentials"
              payload: { staff_member_id: "${mgr_id}", credential_type: "CPR_AED", issuer: "American Heart Association", credential_number: "AHA-771", expires_on: "2027-06-30" }
              as: OperatorAdmin
              captures: { mgr_cred_id: $.data.id }
            - call: "POST /staff-credentials/${mgr_cred_id}/verify"
              payload: { decision: "ACCEPT" }
              as: OperatorAdmin
            - call: "POST /client-contracts/${c_id}/submit"
              payload: {}
              as: OperatorAdmin
            - call: "POST /client-contracts/${c_id}/client-decision"
              payload: { decision: "APPROVE" }
              as: ClientSponsor
              as_user_id: "${c_id}"
            - call: "POST /members"
              payload: { contract_id: "${c_id}", member_class: "EMPLOYEE", full_name: "Iris Okafor", employee_number: "E-1001" }
              as: ClientSponsor
              as_user_id: "${c_id}"
              captures: { m1_id: $.data.id }
            - call: "POST /members"
              payload: { contract_id: "${c_id}", member_class: "EMPLOYEE", full_name: "Jon Alvarez", employee_number: "E-1002" }
              as: ClientSponsor
              as_user_id: "${c_id}"
              captures: { m2_id: $.data.id }
            - call: "POST /members"
              payload: { contract_id: "${c_id}", member_class: "RETIREE", full_name: "Pat Nowak" }
              as: ClientSponsor
              as_user_id: "${c_id}"
              captures: { m3_id: $.data.id }
          trigger:
            - call: "GET /members"
              payload: { contract_id: "${c_id}", member_class: "EMPLOYEE", limit: 1, offset: 0 }
              as: SiteManager
              as_user_id: "${mgr_id}"
            - call: "GET /members"
              payload: { contract_id: "${c_id}", member_class: "EMPLOYEE", limit: 1, offset: 1 }
              as: SiteManager
              as_user_id: "${mgr_id}"
            - call: "GET /members"
              payload: { contract_id: "${c_id}" }
              as: SiteManager
              as_user_id: "${mgr_id}"
          assert:
            - "First trigger -> HTTP 200, response_type == \"array\", data length 1, limit == 1, offset == 0, total_count == 2, has_more == true"
            - "Second trigger -> data length 1, offset == 1, total_count == 2, has_more == false; the two pages together return ${m1_id} and ${m2_id} with no repeat"
            - "Third trigger (no member_class filter, no pagination params) -> total_count == 3, has_more == false, limit == 10 (the §1.0 default)"
            - "The RETIREE ${m3_id} never appears in the filtered pages"

      - name: get_staff_member_unknown_id_returns_not_found
        claim_type: not_found
        grounds:
          - endpoints[GET /staff-members/{id}]
          - validations[priority 7].ERR_STAFF_NOT_FOUND
          - errors.ERR_STAFF_NOT_FOUND
        distinguishing_aspect: |
          A syntactically valid UUID that matches no StaffMember row returns the
          entity-specific 404 ERR_STAFF_NOT_FOUND, not a generic 404 and not an
          empty 200 body.
        test_recipe:
          setup:
            - "Empty database except the logical clock."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: OperatorAdmin
          trigger:
            - call: "GET /staff-members/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              payload: {}
              as: OperatorAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 404 AND response_type == \"error\" AND data.error_id == \"ERR_STAFF_NOT_FOUND\" AND data.message is a non-empty string"

      - name: create_program_offering_missing_target_returns_invalid_request
        claim_type: required_fields
        grounds:
          - endpoints[POST /program-offerings]
          - validations[priority 8].ERR_INVALID_REQUEST
          - entities.ProgramOffering.fields.participation_target
        distinguishing_aspect: |
          participation_target is `source: input` with no default, so omitting it
          is a 400 ERR_INVALID_REQUEST from the shape rule (priority 8) — which
          outranks the existence rule at priority 9, so the error is the shape
          error even though every foreign key in the body does resolve. Nothing
          is persisted.
        test_recipe:
          setup:
            - "DRAFT-CONTRACT chain plus one GROUP_EX_INSTRUCTOR staff member; offering creation itself has no contract-state gate."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: OperatorAdmin
            - call: "POST /client-contracts"
              payload: { client_name: "Northwind Manufacturing", site_code: "NWM-01", fee_structure: "COST_PLUS", staffing_model: "OPERATOR_EMPLOYED", budgeted_staff_fte: 3.5, participation_target_pct: 35, term_start_on: "2026-07-01", term_end_on: "2027-06-30", not_to_exceed_cents: 5000000 }
              as: OperatorAdmin
              captures: { c_id: $.data.id }
            - call: "POST /staff-members"
              payload: { contract_id: "${c_id}", full_name: "Ravi Patel", role_type: "GROUP_EX_INSTRUCTOR", employment_type: "OPERATOR_EMPLOYED", hourly_cost_cents: 4700 }
              as: OperatorAdmin
              captures: { inst1_id: $.data.id }
          trigger:
            - call: "POST /program-offerings"
              payload: { contract_id: "${c_id}", lead_staff_id: "${inst1_id}", program_type: "GROUP_EXERCISE", title: "Lunch Circuit", max_participants_per_session: 6, required_credential_type: "GROUP_EX_CERT" }
              as: OperatorAdmin
              captures: { err: $.data.error_id }
            - call: "GET /program-offerings"
              payload: { contract_id: "${c_id}" }
              as: OperatorAdmin
          assert:
            - "First trigger -> HTTP 400 AND data.error_id == \"ERR_INVALID_REQUEST\""
            - "First trigger -> data.error_id != \"ERR_STAFF_NOT_FOUND\" and != \"ERR_CONTRACT_NOT_FOUND\" (priority 8 precedes priority 9)"
            - "Second trigger -> total_count == 0 (the rejected request persisted nothing)"

      - name: member_creation_applies_declared_defaults
        claim_type: defaults
        grounds:
          - endpoints[POST /members]
          - entities.Member.fields.health_data_consent
          - entities.Member.fields.eligibility_status
          - entities.Member.fields.access_status
        distinguishing_aspect: |
          health_data_consent is the only `source: input` field on Member with a
          declared default, and it defaults to FALSE — the privacy-safe value.
          The two parallel status dimensions start at their own initial states
          independently (PENDING_VERIFICATION / NO_BADGE), and the incentive
          ledger starts empty.
        test_recipe:
          setup:
            - "DRAFT-CONTRACT chain; member creation has no contract-state gate (ERR_CONTRACT_NOT_ACTIVE covers verification, not creation)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: OperatorAdmin
            - call: "POST /client-contracts"
              payload: { client_name: "Northwind Manufacturing", site_code: "NWM-01", fee_structure: "COST_PLUS", staffing_model: "OPERATOR_EMPLOYED", budgeted_staff_fte: 3.5, participation_target_pct: 35, term_start_on: "2026-07-01", term_end_on: "2027-06-30", not_to_exceed_cents: 5000000 }
              as: OperatorAdmin
              captures: { c_id: $.data.id }
          trigger:
            - call: "POST /members"
              payload: { contract_id: "${c_id}", member_class: "EMPLOYEE", full_name: "Iris Okafor", employee_number: "E-1001" }
              as: ClientSponsor
              as_user_id: "${c_id}"
              captures: { m1_id: $.data.id }
          assert:
            - "HTTP 201 AND Member.${m1_id}.health_data_consent == false"
            - "Member.${m1_id}.eligibility_status == \"PENDING_VERIFICATION\" AND Member.${m1_id}.access_status == \"NO_BADGE\""
            - "Member.${m1_id}.incentive_points_balance == 0 AND current_waiver_id == null AND last_check_in_utc == null AND sponsor_member_id == null"
            - "Member.${m1_id}.version == 1"
            - "ClientContract.${c_id}.eligible_member_count == 0 (creation alone does not make a member eligible)"

      - name: session_scheduled_minutes_is_computed_from_the_schedule
        claim_type: computed_fields
        grounds:
          - entities.ProgramSession.fields.scheduled_minutes
          - endpoints[POST /program-sessions]
          - calculations.session_labor_cost
        distinguishing_aspect: |
          scheduled_minutes is `source: computed` and is NOT in the endpoint's
          input list: the server derives it from scheduled_end_utc minus
          scheduled_start_utc. A 12:00:00Z-12:55:00Z session must report 55, and
          actual_attendance must start at 0 even though forecast_attendance is 3.
        test_recipe:
          setup:
            - "ACTIVE-PROGRAM chain (ACTIVE contract, Studio A OPEN, READY AED, instructor with VERIFIED GROUP_EX_CERT and a 2026-07-15 drill, offering ACTIVE)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: OperatorAdmin
            - call: "POST /client-contracts"
              payload: { client_name: "Northwind Manufacturing", site_code: "NWM-01", fee_structure: "COST_PLUS", staffing_model: "OPERATOR_EMPLOYED", budgeted_staff_fte: 3.5, participation_target_pct: 35, term_start_on: "2026-07-01", term_end_on: "2027-06-30", not_to_exceed_cents: 5000000 }
              as: OperatorAdmin
              captures: { c_id: $.data.id }
            - call: "POST /staff-members"
              payload: { contract_id: "${c_id}", full_name: "Dana Reed", role_type: "SITE_MANAGER", employment_type: "OPERATOR_EMPLOYED", hourly_cost_cents: 5200 }
              as: OperatorAdmin
              captures: { mgr_id: $.data.id }
            - call: "POST /staff-credentials"
              payload: { staff_member_id: "${mgr_id}", credential_type: "CPR_AED", issuer: "American Heart Association", credential_number: "AHA-771", expires_on: "2027-06-30" }
              as: OperatorAdmin
              captures: { mgr_cred_id: $.data.id }
            - call: "POST /staff-credentials/${mgr_cred_id}/verify"
              payload: { decision: "ACCEPT" }
              as: OperatorAdmin
            - call: "POST /client-contracts/${c_id}/submit"
              payload: {}
              as: OperatorAdmin
            - call: "POST /client-contracts/${c_id}/client-decision"
              payload: { decision: "APPROVE" }
              as: ClientSponsor
              as_user_id: "${c_id}"
            - call: "POST /facility-rooms"
              payload: { contract_id: "${c_id}", room_name: "Studio A", room_type: "STUDIO", max_occupancy: 30 }
              as: SiteManager
              as_user_id: "${mgr_id}"
              captures: { room_a_id: $.data.id }
            - call: "POST /facility-assets"
              payload: { contract_id: "${c_id}", room_id: "${room_a_id}", asset_type: "AED", asset_tag: "AED-01", pad_expiry_on: "2027-03-31", battery_expiry_on: "2027-03-31", last_inspection_on: "2026-07-20" }
              as: SiteManager
              as_user_id: "${mgr_id}"
              captures: { aed_id: $.data.id }
            - call: "POST /staff-members"
              payload: { contract_id: "${c_id}", full_name: "Ravi Patel", role_type: "GROUP_EX_INSTRUCTOR", employment_type: "OPERATOR_EMPLOYED", hourly_cost_cents: 4700 }
              as: OperatorAdmin
              captures: { inst1_id: $.data.id }
            - call: "POST /staff-credentials"
              payload: { staff_member_id: "${inst1_id}", credential_type: "GROUP_EX_CERT", issuer: "ACE", credential_number: "ACE-4410", expires_on: "2027-05-31" }
              as: OperatorAdmin
              captures: { inst1_cred_id: $.data.id }
            - call: "POST /staff-credentials/${inst1_cred_id}/verify"
              payload: { decision: "ACCEPT" }
              as: OperatorAdmin
            - call: "POST /staff-members/${inst1_id}/drills"
              payload: { drill_on: "2026-07-15", drill_type: "AED_RESPONSE" }
              as: SiteManager
              as_user_id: "${mgr_id}"
            - call: "POST /program-offerings"
              payload: { contract_id: "${c_id}", lead_staff_id: "${inst1_id}", program_type: "GROUP_EXERCISE", title: "Lunch Circuit", participation_target: 8, max_participants_per_session: 6, required_credential_type: "GROUP_EX_CERT", eligible_member_classes: ["EMPLOYEE"] }
              as: SiteManager
              as_user_id: "${mgr_id}"
              captures: { off_id: $.data.id }
            - call: "POST /program-offerings/${off_id}/status-changes"
              payload: { action: "ACTIVATE" }
              as: SiteManager
              as_user_id: "${mgr_id}"
          trigger:
            - call: "POST /program-sessions"
              payload: { offering_id: "${off_id}", room_id: "${room_a_id}", scheduled_start_utc: "2026-08-05T12:00:00Z", scheduled_end_utc: "2026-08-05T12:55:00Z", forecast_attendance: 3, direct_supply_cost_cents: 0 }
              as: SiteManager
              as_user_id: "${mgr_id}"
              captures: { sess1_id: $.data.id }
          assert:
            - "HTTP 201 AND ProgramSession.${sess1_id}.scheduled_minutes == 55"
            - "ProgramSession.${sess1_id}.status == \"SCHEDULED\" AND actual_attendance == 0 AND forecast_attendance == 3"
            - "ProgramOffering.${off_id}.provisional_attainment_pct == 38 (round_half_up(3*100/8) = 37.5 -> 38; the new forecast enters the provisional numerator immediately)"
            - "ProgramOffering.${off_id}.final_attainment_pct == 0 AND counted_participation_total == 0"

      - name: waiver_signed_at_and_status_are_system_owned_input_ignored
        claim_type: system_fields
        grounds:
          - entities.LiabilityWaiver.fields.signed_at
          - entities.LiabilityWaiver.fields.status
          - endpoints[POST /members/{id}/waivers]
        distinguishing_aspect: |
          signed_at is `source: system` and status is `source: computed`, so a
          client that supplies both must be ignored, not obeyed and not rejected:
          signed_at comes from the logical clock (2026-08-01T00:00:00Z) and status
          is SIGNED regardless of the "REVOKED" the client sent.
        test_recipe:
          setup:
            - "ACTIVE-CONTRACT chain plus one EMPLOYEE member VERIFIED to ELIGIBLE; the member's version is read immediately before the waiver call."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: OperatorAdmin
            - call: "POST /client-contracts"
              payload: { client_name: "Northwind Manufacturing", site_code: "NWM-01", fee_structure: "COST_PLUS", staffing_model: "OPERATOR_EMPLOYED", budgeted_staff_fte: 3.5, participation_target_pct: 35, term_start_on: "2026-07-01", term_end_on: "2027-06-30", not_to_exceed_cents: 5000000 }
              as: OperatorAdmin
              captures: { c_id: $.data.id }
            - call: "POST /staff-members"
              payload: { contract_id: "${c_id}", full_name: "Dana Reed", role_type: "SITE_MANAGER", employment_type: "OPERATOR_EMPLOYED", hourly_cost_cents: 5200 }
              as: OperatorAdmin
              captures: { mgr_id: $.data.id }
            - call: "POST /staff-credentials"
              payload: { staff_member_id: "${mgr_id}", credential_type: "CPR_AED", issuer: "American Heart Association", credential_number: "AHA-771", expires_on: "2027-06-30" }
              as: OperatorAdmin
              captures: { mgr_cred_id: $.data.id }
            - call: "POST /staff-credentials/${mgr_cred_id}/verify"
              payload: { decision: "ACCEPT" }
              as: OperatorAdmin
            - call: "POST /client-contracts/${c_id}/submit"
              payload: {}
              as: OperatorAdmin
            - call: "POST /client-contracts/${c_id}/client-decision"
              payload: { decision: "APPROVE" }
              as: ClientSponsor
              as_user_id: "${c_id}"
            - call: "POST /members"
              payload: { contract_id: "${c_id}", member_class: "EMPLOYEE", full_name: "Iris Okafor", employee_number: "E-1001" }
              as: ClientSponsor
              as_user_id: "${c_id}"
              captures: { m1_id: $.data.id }
            - call: "POST /members/${m1_id}/eligibility-decisions"
              payload: { action: "VERIFY" }
              as: ClientSponsor
              as_user_id: "${c_id}"
            - call: "GET /members/${m1_id}"
              payload: {}
              as: SiteManager
              as_user_id: "${mgr_id}"
              captures: { m1_ver: $.data.version }
          trigger:
            - call: "POST /members/${m1_id}/waivers"
              payload: { waiver_version_code: "WVR-2026A", expires_on: "2027-06-30", acknowledged_health_disclosure: true, expected_member_version: "${m1_ver}", signed_at: "2020-01-01T00:00:00Z", status: "REVOKED", id: "11111111-1111-4111-8111-111111111111" }
              as: SiteManager
              as_user_id: "${mgr_id}"
              captures: { w1_id: $.data.id }
          assert:
            - "HTTP 201 AND LiabilityWaiver.${w1_id}.signed_at == \"2026-08-01T00:00:00Z\" (logical clock, not the supplied 2020 value)"
            - "LiabilityWaiver.${w1_id}.status == \"SIGNED\" (the supplied \"REVOKED\" is ignored)"
            - "LiabilityWaiver.${w1_id}.id != \"11111111-1111-4111-8111-111111111111\" — the id is server-minted"
            - "Member.${m1_id}.current_waiver_id == \"${w1_id}\""

      - name: room_inspection_score_out_of_range_returns_invalid_request
        claim_type: type_constraints
        grounds:
          - endpoints[POST /facility-rooms/{id}/inspections]
          - validations[priority 8].ERR_INVALID_REQUEST
          - state_machines.FacilityRoom.OPEN_to_RESTRICTED
        distinguishing_aspect: |
          cleanliness_score is bounded 0-100 by the shape rule, so 101 and -1 are
          both 400 ERR_INVALID_REQUEST — and crucially neither one is treated as
          a failing inspection: the room must stay OPEN with last_inspection_on
          still null, proving the shape check runs before the state machine.
        test_recipe:
          setup:
            - "ACTIVE-CONTRACT chain plus Studio A (room_state OPEN, last_inspection_on null, open_deficiency_count 0)."
          setup_api_calls:
