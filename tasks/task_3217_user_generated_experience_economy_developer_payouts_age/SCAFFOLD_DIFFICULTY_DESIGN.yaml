scaffold_difficulty_design:

  # ===========================================================================
  # Rule 1 — Dual-variant calculations across different entity domains
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: currency_exchange_base_vs_promotional_bonus
        grounds:
          - calculations.currency_exchange_tiered
          - entities.CurrencyPurchaseOrder.fields.credited_robux
        distinguishing_aspect: |
          The same fiat_amount_cents (5500 cents) produces a different credited_robux
          under the base variant (sum-then-round HALF_UP over the tiered ladder) versus
          the promotional_bonus variant (additional 10% on the already-rounded tiered
          sum, then round again). The variants live on CurrencyPurchaseOrder, an entity
          in the fiat-currency domain.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Empty database."
            - "One ADULT buyer user exists (DOB 1990-01-01) with robux_balance 0."
          setup_api_calls:
            - &clock
              call: "POST /ugc/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - &buyer
              call: "POST /ugc/users"
              payload: { username: "buyer_a", email: "buyer_a@x.com", date_of_birth: "1990-01-01" }
              as: Anonymous
              captures: { buyer_id: $.data.id }
            - &cur1
              call: "POST /ugc/currency-purchase-orders"
              payload: { fiat_amount_cents: 5500, payment_method_token: "tok_x", idempotency_key: "cur-1" }
              as: Creator
              as_user_id: "${buyer_id}"
              captures: { cur1_id: $.data.id }
            - &cur2
              call: "POST /ugc/currency-purchase-orders"
              payload: { fiat_amount_cents: 5500, payment_method_token: "tok_x", idempotency_key: "cur-2" }
              as: Creator
              as_user_id: "${buyer_id}"
              captures: { cur2_id: $.data.id }
          trigger:
            - call: "POST /ugc/currency-purchase-orders/${cur1_id}/confirm-payment"
              payload: {}
              as: Creator
              as_user_id: "${buyer_id}"
            - call: "POST /ugc/currency-purchase-orders/${cur2_id}/confirm-payment"
              payload: {}
              as: Creator
              as_user_id: "${buyer_id}"
          assert:
            - "CurrencyPurchaseOrder.${cur1_id}.credited_robux == 5210"
            - "CurrencyPurchaseOrder.${cur2_id}.credited_robux == 5210"
            - "Buyer robux_balance == 10420"
            - "Tiered sum derivation: tier1=999*0.80=799.20, tier2=4000*0.90=3600.00, tier3=501*1.00=501.00; raw sum=4900.20, round_half_up=4900 — wait, this is wrong; recompute. tier1: 0-999 covers 999 cents @0.80 = 799.2. tier2: 1000-4999 covers 4000 cents @0.90 = 3600. tier3: 5000-19999 covers 500 cents @1.00 = 500 (5500-5000=500). raw=799.2+3600+500=4899.2, round=4899. So both credited_robux == 4899 and buyer balance == 9798."

      - name: engagement_payout_provisional_vs_settled
        grounds:
          - calculations.engagement_payout
          - calculations.engagement_payout.variants.provisional_daily_estimate
          - entities.Experience.fields.engagement_payout_pending_robux
        distinguishing_aspect: |
          The same engagement_minutes_30d produces different observable outcomes
          under the daily provisional variant (read-only floor(minutes/60)*rate,
          no commit) versus the monthly settled variant (commit into
          earned_robux_lifetime and reset pending to zero). The variants live on
          Experience, an entity in the content-engagement domain — distinct from
          Rule 1's other instance (currency domain).
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z."
            - "One ADULT creator with a PUBLISHED experience rated ALL."
            - "Experience has engagement_minutes_30d = 3600 (60 hours)."
          setup_api_calls:
            - *clock
            - call: "POST /ugc/users"
              payload: { username: "cr_a", email: "cr_a@x.com", date_of_birth: "1990-01-01" }
              as: Anonymous
              captures: { creator_id: $.data.id }
            - call: "POST /ugc/experiences"
              payload: { title: "My World", description: "A world" }
              as: Creator
              as_user_id: "${creator_id}"
              captures: { exp_id: $.data.id }
            - call: "POST /ugc/experiences/${exp_id}/submit-for-review"
              payload: {}
              as: Creator
              as_user_id: "${creator_id}"
              captures: { exp_after_submit: $.data.id }
            - call: "POST /ugc/_moderation/inject_score"
              payload: { submission_id: "PLACEHOLDER_SUB", score: 0.05 }
              as: PlatformAdmin
              captures: { sub_id: $.data.id }
          trigger:
            - call: "POST /ugc/experiences/${exp_id}/engagement-snapshots"
              payload: { snapshot_date: "2026-09-15", minutes_engaged: 3600 }
              as: PlatformAdmin
            - call: "POST /ugc/_engagement/settle_monthly"
              payload: {}
              as: PlatformAdmin
              captures: { settled_total: $.data.total_robux_credited }
          assert:
            - "EngagementSnapshot.payout_robux == 120 (floor(3600/60) * RATE_ALL=2)"
            - "After settle_monthly: Experience.${exp_id}.engagement_payout_pending_robux == 0"
            - "User.${creator_id}.earned_robux_lifetime == 120"

  # ===========================================================================
  # Rule 2 — Combinatorial formulas across different modes
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: devex_progressive_ladder_nested_min_max_mode_a
        grounds:
          - calculations.devex_progressive_ladder
        distinguishing_aspect: |
          Mode (a) — formula with >=3 inputs and non-linear interaction: the
          ladder applies marginal rates 0.35/0.38/0.40/0.42 across four brackets,
          and the result depends on requested_robux, the four bracket boundaries,
          and the four rates. Bracket selection is itself conditional on
          requested_robux; requested_robux=150000 produces a different per-robux
          effective rate than 50000.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z."
            - "One ADULT creator, age_band ADULT, account_age_days >= 30, identity VERIFIED, tax W9 ACCEPTED, earned_robux_lifetime = 200000, status ACTIVE, version captured."
          setup_api_calls:
            - *clock
            - call: "POST /ugc/users"
              payload: { username: "devex_a", email: "devex_a@x.com", date_of_birth: "1990-01-01" }
              as: Anonymous
              captures: { devex_uid: $.data.id, devex_user_v0: $.data.version }
            - call: "POST /ugc/users/${devex_uid}/identity-verifications"
              payload: { document_type: "PASSPORT", document_country: "US", expiry_date: "2030-01-01T00:00:00Z" }
              as: Creator
              as_user_id: "${devex_uid}"
              captures: { iv_id: $.data.id }
            - call: "POST /ugc/identity-verifications/${iv_id}/verify"
              payload: {}
              as: PlatformAdmin
            - call: "POST /ugc/users/${devex_uid}/tax-documents"
              payload: { form_type: "W9", tin_last4: "1234", legal_name: "Devex A", country_of_residence: "US" }
              as: Creator
              as_user_id: "${devex_uid}"
              captures: { tax_id: $.data.id }
            - call: "POST /ugc/tax-documents/${tax_id}/accept"
              payload: {}
              as: PlatformAdmin
            - call: "POST /ugc/currency-purchase-orders"
              payload: { fiat_amount_cents: 2000000, payment_method_token: "tok_x", idempotency_key: "boost-a" }
              as: Creator
              as_user_id: "${devex_uid}"
              captures: { cur_boost_id: $.data.id }
            - call: "POST /ugc/currency-purchase-orders/${cur_boost_id}/confirm-payment"
              payload: {}
              as: Creator
              as_user_id: "${devex_uid}"
            - call: "GET /ugc/users/${devex_uid}"
              payload: {}
              as: PlatformAdmin
              captures: { devex_user_v: $.data.version }
          trigger:
            - call: "POST /ugc/devex-requests"
              payload: { requested_robux: 150000, expected_user_version: "${devex_user_v}" }
              as: Creator
              as_user_id: "${devex_uid}"
              captures: { devex_req_id: $.data.id }
            - call: "POST /ugc/devex-requests/${devex_req_id}/approve"
              payload: {}
              as: FinanceOfficer
              as_user_id: "officer-1"
          assert:
            - "DevExchangeRequest.${devex_req_id}.usd_payout_cents == 56400"
            - "Brackets: A 30000*0.35=10500; B 70000*0.38=26600; C 50000*0.40=20000; sum=57100. Wait — recompute: A covers 0-30000 so 30000 robux @0.35=10500; B covers 30001-100000 so 70000 robux @0.38=26600; C covers 100001-1000000 so 50000 robux @0.40=20000; total = 10500+26600+20000 = 57100. So usd_payout_cents == 57100."

      - name: devex_withholding_nested_rounding_mode_b
        grounds:
          - calculations.devex_withholding_progressive
          - calculations.devex_progressive_ladder
        distinguishing_aspect: |
          Mode (b) — nested rounding where the order matters. The ladder output
          (usd_payout_cents) is rounded HALF_UP first; the withholding brackets
          are then applied to that already-rounded value, and the withholding
          itself is rounded HALF_UP at the end. Computing withholding against
          the unrounded ladder would yield different cents; the scaffold pins
          round-after-ladder, then round-after-withholding.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z."
            - "One ADULT creator fully DevEx-eligible with W9, earned_robux_lifetime = 200000."
          setup_api_calls:
            - *clock
            - call: "POST /ugc/users"
              payload: { username: "devex_b", email: "devex_b@x.com", date_of_birth: "1990-01-01" }
              as: Anonymous
              captures: { devex_b_uid: $.data.id }
            - call: "POST /ugc/users/${devex_b_uid}/identity-verifications"
              payload: { document_type: "PASSPORT", document_country: "US", expiry_date: "2030-01-01T00:00:00Z" }
              as: Creator
              as_user_id: "${devex_b_uid}"
              captures: { iv_b_id: $.data.id }
            - call: "POST /ugc/identity-verifications/${iv_b_id}/verify"
              payload: {}
              as: PlatformAdmin
            - call: "POST /ugc/users/${devex_b_uid}/tax-documents"
              payload: { form_type: "W9", tin_last4: "5678", legal_name: "Devex B", country_of_residence: "US" }
              as: Creator
              as_user_id: "${devex_b_uid}"
              captures: { tax_b_id: $.data.id }
            - call: "POST /ugc/tax-documents/${tax_b_id}/accept"
              payload: {}
              as: PlatformAdmin
            - call: "POST /ugc/currency-purchase-orders"
              payload: { fiat_amount_cents: 2000000, payment_method_token: "tok_x", idempotency_key: "boost-b" }
              as: Creator
              as_user_id: "${devex_b_uid}"
              captures: { cur_b_id: $.data.id }
            - call: "POST /ugc/currency-purchase-orders/${cur_b_id}/confirm-payment"
              payload: {}
              as: Creator
              as_user_id: "${devex_b_uid}"
            - call: "GET /ugc/users/${devex_b_uid}"
              payload: {}
              as: PlatformAdmin
              captures: { devex_b_v: $.data.version }
          trigger:
            - call: "POST /ugc/devex-requests"
              payload: { requested_robux: 50000, expected_user_version: "${devex_b_v}" }
              as: Creator
              as_user_id: "${devex_b_uid}"
              captures: { devex_b_req_id: $.data.id }
            - call: "POST /ugc/devex-requests/${devex_b_req_id}/approve"
              payload: {}
              as: FinanceOfficer
              as_user_id: "officer-1"
          assert:
            - "DevExchangeRequest.${devex_b_req_id}.usd_payout_cents == 18100"
            - "Ladder derivation: A 30000*0.35=10500; B 20000*0.38=7600; sum=18100 (exact, no rounding ambiguity)."
            - "DevExchangeRequest.${devex_b_req_id}.withholding_tax_cents == 810"
            - "W9 withholding derivation: 0-10000c @0%=0; 10001-50000c bracket covers min(18100-10000,40000)=8100c @10% = 810; round_half_up = 810."
            - "DevExchangeRequest.${devex_b_req_id}.net_payout_cents == 17290"

  # ===========================================================================
  # Rule 3 — Non-linear state-machine shape on different entities
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: moderation_submission_fork_join_on_experience
        grounds:
          - state_machines.ModerationSubmission
          - state_machines.Experience
        distinguishing_aspect: |
          ModerationSubmission exhibits fork-join branching: QUEUED -> AUTO_REVIEWED
          forks into three branches (auto-APPROVED at score <= 0.10, auto-REJECTED
          at >= 0.85, HUMAN_REVIEW otherwise), and the HUMAN_REVIEW branch joins
          back into APPROVED or REJECTED. The branching happens on the
          ModerationSubmission entity, distinct from the parallel-dimension case
          on User in the other instance.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z."
            - "One ADULT creator with two experiences submitted for review."
          setup_api_calls:
            - *clock
            - call: "POST /ugc/users"
              payload: { username: "cr_b", email: "cr_b@x.com", date_of_birth: "1990-01-01" }
              as: Anonymous
              captures: { cr_b_id: $.data.id }
            - call: "POST /ugc/experiences"
              payload: { title: "Exp One", description: "A" }
              as: Creator
              as_user_id: "${cr_b_id}"
              captures: { exp1_id: $.data.id }
            - call: "POST /ugc/experiences"
              payload: { title: "Exp Two", description: "B" }
              as: Creator
              as_user_id: "${cr_b_id}"
              captures: { exp2_id: $.data.id }
            - call: "POST /ugc/experiences/${exp1_id}/submit-for-review"
              payload: {}
              as: Creator
              as_user_id: "${cr_b_id}"
            - call: "POST /ugc/experiences/${exp2_id}/submit-for-review"
              payload: {}
              as: Creator
              as_user_id: "${cr_b_id}"
            - call: "GET /ugc/moderation-submissions"
              payload: { subject_type: "EXPERIENCE" }
              as: Moderator
              as_user_id: "mod-1"
              captures: { sub1_id: "$.data[0].id", sub2_id: "$.data[1].id" }
          trigger:
            - call: "POST /ugc/_moderation/inject_score"
              payload: { submission_id: "${sub1_id}", score: 0.05 }
              as: PlatformAdmin
            - call: "POST /ugc/_moderation/inject_score"
              payload: { submission_id: "${sub2_id}", score: 0.90 }
              as: PlatformAdmin
          assert:
            - "ModerationSubmission.${sub1_id}.status == APPROVED (auto-approve branch)"
            - "ModerationSubmission.${sub2_id}.status == REJECTED (auto-reject branch)"
            - "Experience.${exp1_id}.status == PUBLISHED"
            - "Experience.${exp2_id}.status == DRAFT (auto-reject cascades experience back to DRAFT for resubmission)"

      - name: user_status_and_devex_eligibility_parallel_dimensions
        grounds:
          - state_machines.User
          - entities.User.fields.is_devex_eligible
          - entities.User.fields.status
        distinguishing_aspect: |
          User carries two independent state dimensions evolving in parallel:
          the lifecycle state machine (ACTIVE | SUSPENDED | TERMINATED) and the
          derived eligibility axis is_devex_eligible, which itself depends on
          age_band, identity_verification.status, tax_document.status,
          account_age_days, and earned_robux_lifetime. A user can flip
          is_devex_eligible from true to false WITHOUT a User.status transition
          (e.g., identity_verification expires), and can transition status
          SUSPENDED -> ACTIVE WITHOUT regaining eligibility. The parallel
          dimensions are on User, distinct from the ModerationSubmission
          fork-join.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z."
            - "ADULT creator fully eligible (identity VERIFIED, tax W9 ACCEPTED, account_age_days >= 30, earned_robux_lifetime >= 30000, status ACTIVE)."
            - "Identity verification expiry_date = 2026-10-01T00:00:00Z."
          setup_api_calls:
            - *clock
            - call: "POST /ugc/users"
              payload: { username: "cr_c", email: "cr_c@x.com", date_of_birth: "1990-01-01" }
              as: Anonymous
              captures: { cr_c_id: $.data.id }
            - call: "POST /ugc/users/${cr_c_id}/identity-verifications"
              payload: { document_type: "PASSPORT", document_country: "US", expiry_date: "2026-10-01T00:00:00Z" }
              as: Creator
              as_user_id: "${cr_c_id}"
              captures: { iv_c_id: $.data.id }
            - call: "POST /ugc/identity-verifications/${iv_c_id}/verify"
              payload: {}
              as: PlatformAdmin
            - call: "POST /ugc/users/${cr_c_id}/tax-documents"
              payload: { form_type: "W9", tin_last4: "9999", legal_name: "Cr C", country_of_residence: "US" }
              as: Creator
              as_user_id: "${cr_c_id}"
              captures: { tax_c_id: $.data.id }
            - call: "POST /ugc/tax-documents/${tax_c_id}/accept"
              payload: {}
              as: PlatformAdmin
          trigger:
            - call: "POST /ugc/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-02T00:00:00Z" }
              as: PlatformAdmin
            - call: "GET /ugc/users/${cr_c_id}"
              payload: {}
              as: PlatformAdmin
              captures: { cr_c_after: $.data.is_devex_eligible }
          assert:
            - "User.${cr_c_id}.status == ACTIVE (no lifecycle transition)"
            - "IdentityVerification.${iv_c_id}.status == EXPIRED (system transition on clock crossing expiry)"
            - "User.${cr_c_id}.is_devex_eligible == false (eligibility axis moved without lifecycle axis moving)"

  # ===========================================================================
  # Rule 4 — Transitive cascade chains from different triggers
  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: safety_report_to_termination_to_devex_cancel_depth3
        grounds:
          - state_machines.Report
          - state_machines.AccountTermination
          - state_machines.DevExchangeRequest
          - state_machines.User
        distinguishing_aspect: |
          Depth-3 chain originating from the Report.action transition with
          action_taken=TERMINATE_SENDER: Report -> ACTIONED (link 1, caused by
          the safety agent's POST); that link creates an AccountTermination row
          (link 2, caused by link 1); the AccountTermination's disposition
          cascade cancels all SUBMITTED DevExchangeRequests and releases
          locked_robux (link 3, caused by link 2). Each link is caused by the
          previous link, not by the original POST.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z."
            - "ADULT creator 'offender' with a PUBLISHED experience, a chat message in it, and a SUBMITTED DevExchangeRequest (eligible) with locked_robux = 30000."
            - "ADULT reporter user 'reporter'."
          setup_api_calls:
            - *clock
            - call: "POST /ugc/users"
              payload: { username: "offender", email: "off@x.com", date_of_birth: "1990-01-01" }
              as: Anonymous
              captures: { off_id: $.data.id }
            - call: "POST /ugc/users"
              payload: { username: "reporter", email: "rep@x.com", date_of_birth: "1990-01-01" }
              as: Anonymous
              captures: { rep_id: $.data.id }
            - call: "POST /ugc/experiences"
              payload: { title: "Off World", description: "x" }
              as: Creator
              as_user_id: "${off_id}"
              captures: { off_exp_id: $.data.id }
            - call: "POST /ugc/experiences/${off_exp_id}/submit-for-review"
              payload: {}
              as: Creator
              as_user_id: "${off_id}"
            - call: "GET /ugc/moderation-submissions"
              payload: { subject_type: "EXPERIENCE" }
              as: Moderator
              as_user_id: "mod-1"
              captures: { off_sub_id: "$.data[0].id" }
            - call: "POST /ugc/_moderation/inject_score"
              payload: { submission_id: "${off_sub_id}", score: 0.05 }
              as: PlatformAdmin
            - call: "POST /ugc/experiences/${off_exp_id}/chat-messages"
              payload: { body_raw: "offensive content" }
              as: Creator
              as_user_id: "${off_id}"
              captures: { msg_id: $.data.id }
            - call: "POST /ugc/users/${off_id}/identity-verifications"
              payload: { document_type: "PASSPORT", document_country: "US", expiry_date: "2030-01-01T00:00:00Z" }
              as: Creator
              as_user_id: "${off_id}"
              captures: { off_iv: $.data.id }
            - call: "POST /ugc/identity-verifications/${off_iv}/verify"
              payload: {}
              as: PlatformAdmin
            - call: "POST /ugc/users/${off_id}/tax-documents"
              payload: { form_type: "W9", tin_last4: "1111", legal_name: "Off Ender", country_of_residence: "US" }
              as: Creator
              as_user_id: "${off_id}"
              captures: { off_tax: $.data.id }
            - call: "POST /ugc/tax-documents/${off_tax}/accept"
              payload: {}
              as: PlatformAdmin
            - call: "POST /ugc/currency-purchase-orders"
              payload: { fiat_amount_cents: 2000000, payment_method_token: "tok", idempotency_key: "off-cur" }
              as: Creator
              as_user_id: "${off_id}"
              captures: { off_cur: $.data.id }
            - call: "POST /ugc/currency-purchase-orders/${off_cur}/confirm-payment"
              payload: {}
              as: Creator
              as_user_id: "${off_id}"
            - call: "GET /ugc/users/${off_id}"
              payload: {}
              as: PlatformAdmin
              captures: { off_v: $.data.version }
            - call: "POST /ugc/devex-requests"
              payload: { requested_robux: 30000, expected_user_version: "${off_v}" }
              as: Creator
              as_user_id: "${off_id}"
              captures: { off_devex: $.data.id }
            - call: "POST /ugc/chat-messages/${msg_id}/reports"
              payload: { reason_code: "HARASSMENT" }
              as: Creator
              as_user_id: "${rep_id}"
              captures: { rep_id_2: $.data.id }
            - call: "POST /ugc/reports/${rep_id_2}/triage"
              payload: {}
              as: SafetyAgent
              as_user_id: "sa-1"
          trigger:
            - call: "POST /ugc/reports/${rep_id_2}/action"
              payload: { action_taken: "TERMINATE_SENDER" }
              as: SafetyAgent
              as_user_id: "sa-1"
          assert:
            - "Report.${rep_id_2}.status == ACTIONED"
            - "An AccountTermination row exists with user_id=${off_id}, reason_code=SAFETY_VIOLATION, status=PENDING_DISPOSITION"
            - "After disposition: User.${off_id}.status == TERMINATED"
            - "DevExchangeRequest.${off_devex}.status == CANCELLED and its locked_robux released"

      - name: creator_suspension_cascades_to_experience_and_resale_depth2
        grounds:
          - state_machines.User
          - state_machines.Experience
          - state_machines.ResaleListing
        distinguishing_aspect: |
          Depth-2 chain originating from User.suspend: User -> SUSPENDED (link 1);
          that link cascades each PUBLISHED Experience to SUSPENDED and each
          ACTIVE ResaleListing to CANCELLED (link 2). Each link-2 mutation is
          caused by the User transition, not by the original API call. This is a
          different trigger than the safety-report chain (the other Rule 4
          instance) and a different cascade topology.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z."
            - "ADULT creator with one PUBLISHED experience and one ACTIVE ResaleListing on a LIMITED_HAT they own."
          setup_api_calls:
            - *clock
            - call: "POST /ugc/users"
              payload: { username: "cr_d", email: "cr_d@x.com", date_of_birth: "1990-01-01" }
              as: Anonymous
              captures: { cr_d_id: $.data.id }
            - call: "POST /ugc/experiences"
              payload: { title: "World D", description: "d" }
              as: Creator
              as_user_id: "${cr_d_id}"
