  output: BroadcastEvent
  side_effects:
  - ProductionObligation.games_delivered += 1
  - Obligation auto-MET if games_delivered == games_required
- method: POST
  path: /deals/{dealId}/broadcast-events/{eventId}/mark-no-show
  description: Mark an event no-show
