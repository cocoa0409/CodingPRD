            - call: "POST /capacity-obligations"
              payload: { asset_id: "${a1}", program_name: "RA-2026", program_year: 2026, committed_mw: 20.0, availability_hours_required: 8000.0, penalty_rate_usd_per_mw_hour: 150.00, obligation_duration_hours: 4.0 }
              as: MarketOperator
              captures: { o1: $.data.id, o1_status0: $.data.status, o1_accrual0: $.data.accrual_started_at }
            - call: "POST /soc-reservations"
