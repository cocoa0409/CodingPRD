scaffold_corner_design:

  # =====================================================================
  # Section: entities
  # =====================================================================
  - section: entities
    instances:

      - name: create_shipper_returns_201_with_all_fields
        claim_type: creation
        grounds:
          - entities.Shipper
          - endpoints[POST /freight/shippers]
        distinguishing_aspect: |
          POST /freight/shippers with required fields returns 201 and a body
          whose `data.id` is a server-minted UUID, `data.status` defaults to
          ACTIVE, `data.open_ar_cents` defaults to 0, `data.version` == 1.
        test_recipe:
          setup:
            - "Clock pinned; no prior shippers."
          setup_api_calls:
            - call: "POST /freight/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: BrokerOps
          trigger:
            - call: "POST /freight/shippers"
              payload: { legal_name: "Sierra Shippers", billing_email: "ap@sierra.test", credit_limit_cents: 50000000 }
              as: BrokerOps
              captures: { s_id: $.data.id, s_status: $.data.status, s_ar: $.data.open_ar_cents, s_v: $.data.version }
          assert:
            - "response.http_status == 201"
            - "Shipper.${s_id}.status == 'ACTIVE'"
            - "Shipper.${s_id}.open_ar_cents == 0"
            - "Shipper.${s_id}.version == 1"

      - name: get_shipper_not_found_returns_404
        claim_type: not_found
        grounds:
          - entities.Shipper
          - validations[priority=3]
          - errors[ERR_RESOURCE_NOT_FOUND]
        distinguishing_aspect: |
          GET /freight/shippers/{id} with a non-existent UUID returns 404 and
          error_id=ERR_RESOURCE_NOT_FOUND.
        test_recipe:
          setup:
            - "Clock pinned; database has no shipper with the queried id."
          setup_api_calls:
            - call: "POST /freight/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: BrokerOps
          trigger:
            - call: "GET /freight/shippers/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: BrokerOps
              captures: { err_id: $.data.error_id }
          assert:
            - "response.data.error_id == 'ERR_RESOURCE_NOT_FOUND'"
            - "response.http_status == 404"

      - name: carrier_mc_number_unique_invalid_request
        claim_type: type_constraint
        grounds:
          - entities.Carrier.fields.mc_number
          - validations[priority=14]
          - errors[ERR_INVALID_MC_USDOT]
        distinguishing_aspect: |
          Posting a second Carrier with a duplicate mc_number is rejected with
          ERR_INVALID_MC_USDOT (uniqueness clause distinct from regex clause).
        test_recipe:
          setup:
            - "Clock pinned; existing Carrier with mc_number=2424241 (regex-valid)."
          setup_api_calls:
            - call: "POST /freight/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: BrokerOps
            - call: "POST /freight/carriers"
              payload: { legal_name: "Tango Carrier", mc_number: "2424241", usdot_number: "24242421", smartway_tier: "NONE", insurance_expiry_utc: "2027-01-01T00:00:00Z", safety_score: 30 }
              as: BrokerOps
              captures: { c_first_id: $.data.id }
          trigger:
            - call: "POST /freight/carriers"
              payload: { legal_name: "Tango Carrier Two", mc_number: "2424241", usdot_number: "24242422", smartway_tier: "NONE", insurance_expiry_utc: "2027-01-01T00:00:00Z", safety_score: 30 }
              as: BrokerOps
              captures: { err_id: $.data.error_id }
          assert:
            - "response.data.error_id == 'ERR_INVALID_MC_USDOT'"
            - "response.http_status == 422"

      - name: quote_request_fk_shipper_not_found
        claim_type: fk_integrity
        grounds:
          - entities.QuoteRequest.fields.shipper_id
          - validations[priority=4]
          - errors[ERR_FK_NOT_FOUND]
        distinguishing_aspect: |
          POST /freight/quote-requests with a non-existent shipper_id is
          rejected with ERR_FK_NOT_FOUND.
        test_recipe:
          setup:
            - "Clock pinned; no shipper with the supplied UUID exists."
          setup_api_calls:
            - call: "POST /freight/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: BrokerOps
          trigger:
            - call: "POST /freight/quote-requests"
              payload: { shipper_id: "00000000-0000-0000-0000-000000000000", lane_origin: "10001", lane_destination: "30303", distance_miles: 400, pickup_window_start_utc: "2026-06-15T08:00:00Z", pickup_window_end_utc: "2026-06-15T18:00:00Z", requested_equipment: "DRY_VAN" }
              as: BrokerOps
              captures: { err_id: $.data.error_id }
          assert:
            - "response.data.error_id == 'ERR_FK_NOT_FOUND'"
            - "response.http_status == 422"

  # =====================================================================
  # Section: state_machines
  # =====================================================================
  - section: state_machines
    instances:

      - name: carrier_initial_state_pending
        claim_type: initial_state
        grounds:
          - state_machines.Carrier
          - entities.Carrier.fields.qualification_status
        distinguishing_aspect: |
          Newly POSTed Carrier observes qualification_status=PENDING in
          response data.
        test_recipe:
          setup:
            - "Clock pinned."
          setup_api_calls:
            - call: "POST /freight/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: BrokerOps
          trigger:
            - call: "POST /freight/carriers"
              payload: { legal_name: "Uniform Carrier", mc_number: "2525251", usdot_number: "25252525", smartway_tier: "GOLD", insurance_expiry_utc: "2027-01-01T00:00:00Z", safety_score: 30 }
              as: BrokerOps
              captures: { c_id: $.data.id, c_status: $.data.qualification_status }
          assert:
            - "Carrier.${c_id}.qualification_status == 'PENDING'"

      - name: carrier_qualify_from_rejected_returns_invalid_state
        claim_type: invalid_transition
        grounds:
          - state_machines.Carrier.PENDING_to_REJECTED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: |
          Carrier already REJECTED — POST /carriers/{id}/qualify returns
          409 ERR_INVALID_STATE with no field mutations.
        test_recipe:
          setup:
            - "Clock pinned. Carrier rejected with reason_code=BAD_MC."
          setup_api_calls:
            - call: "POST /freight/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: BrokerOps
            - call: "POST /freight/carriers"
              payload: { legal_name: "Victor Carrier", mc_number: "2626261", usdot_number: "26262626", smartway_tier: "NONE", insurance_expiry_utc: "2027-01-01T00:00:00Z", safety_score: 30 }
              as: BrokerOps
              captures: { c_id: $.data.id }
            - call: "POST /freight/carriers/${c_id}/reject"
              payload: { reason_code: "BAD_MC" }
              as: BrokerOps
          trigger:
            - call: "POST /freight/carriers/${c_id}/qualify"
              payload: {}
              as: BrokerOps
              captures: { err_id: $.data.error_id }
          assert:
            - "response.data.error_id == 'ERR_INVALID_STATE'"
            - "response.http_status == 409"
            - "Carrier.${c_id}.qualification_status == 'REJECTED'"

      - name: load_deliver_before_pickup_rejected
        claim_type: precondition_enforcement
        grounds:
          - state_machines.Load.IN_TRANSIT_to_DELIVERED
          - validations[priority=12]
          - errors[ERR_DELIVERY_BEFORE_PICKUP]
        distinguishing_aspect: |
          POST /loads/{id}/deliver with actual_delivery_at_utc earlier than
          Load.actual_pickup_at_utc rejected with ERR_DELIVERY_BEFORE_PICKUP.
        test_recipe:
          setup:
            - "Clock pinned. Shipper, carrier QUALIFIED, OPEN quote awarded, Load in IN_TRANSIT with actual_pickup_at_utc=2026-06-10T11:00:00Z."
          setup_api_calls:
            - call: "POST /freight/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: BrokerOps
            - call: "POST /freight/shippers"
              payload: { legal_name: "Whiskey Shippers", billing_email: "ap@whiskey.test", credit_limit_cents: 100000000 }
              as: BrokerOps
              captures: { s_id: $.data.id }
            - call: "POST /freight/carriers"
              payload: { legal_name: "Whiskey Carrier", mc_number: "2727271", usdot_number: "27272727", smartway_tier: "NONE", insurance_expiry_utc: "2027-01-01T00:00:00Z", safety_score: 30 }
              as: BrokerOps
              captures: { c_id: $.data.id }
            - call: "POST /freight/carriers/${c_id}/qualify"
              payload: {}
              as: BrokerOps
            - call: "POST /freight/quote-requests"
              payload: { shipper_id: "${s_id}", lane_origin: "10001", lane_destination: "30303", distance_miles: 400, pickup_window_start_utc: "2026-06-10T08:00:00Z", pickup_window_end_utc: "2026-06-10T18:00:00Z", requested_equipment: "DRY_VAN" }
              as: BrokerOps
              captures: { q_id: $.data.id, q_v: $.data.version }
            - call: "POST /freight/quote-requests/${q_id}/award"
              payload: { carrier_id: "${c_id}", expected_quote_request_version: "${q_v}" }
              as: BrokerOps
              captures: { ld_id: $.data.id }
            - call: "POST /freight/loads/${ld_id}/pickup"
              payload: { actual_pickup_at_utc: "2026-06-10T11:00:00Z" }
              as: Carrier
              as_user_id: "${c_id}"
          trigger:
            - call: "POST /freight/loads/${ld_id}/deliver"
              payload: { actual_delivery_at_utc: "2026-06-10T10:00:00Z" }
              as: Carrier
              as_user_id: "${c_id}"
              captures: { err_id: $.data.error_id }
          assert:
            - "response.data.error_id == 'ERR_DELIVERY_BEFORE_PICKUP'"
            - "Load.${ld_id}.status == 'IN_TRANSIT'"

      - name: quote_request_expired_after_clock_advance
        claim_type: auto_transition
        grounds:
          - state_machines.QuoteRequest.OPEN_to_EXPIRED
          - endpoints[POST /freight/_clock/advance]
        distinguishing_aspect: |
          /_clock/advance flips OPEN QuoteRequest whose expires_at_utc <=
          current_utc to EXPIRED and reports its id in
          expired_quote_request_ids.
        test_recipe:
          setup:
            - "Clock pinned 2026-06-01. OPEN quote with pickup_window_start=2026-06-05T08:00:00Z (expires_at_utc=2026-06-05T08:00:00Z). Clock then advanced to 2026-06-10T00:00:00Z."
          setup_api_calls:
            - call: "POST /freight/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: BrokerOps
            - call: "POST /freight/shippers"
              payload: { legal_name: "X-ray Shippers", billing_email: "ap@xray.test", credit_limit_cents: 100000000 }
              as: BrokerOps
              captures: { s_id: $.data.id }
            - call: "POST /freight/quote-requests"
              payload: { shipper_id: "${s_id}", lane_origin: "10001", lane_destination: "30303", distance_miles: 400, pickup_window_start_utc: "2026-06-05T08:00:00Z", pickup_window_end_utc: "2026-06-05T18:00:00Z", requested_equipment: "DRY_VAN" }
              as: BrokerOps
              captures: { q_id: $.data.id }
            - call: "POST /freight/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-10T00:00:00Z" }
              as: BrokerOps
          trigger:
            - call: "POST /freight/_clock/advance"
              payload: {}
              as: BrokerOps
          assert:
            - "QuoteRequest.${q_id}.status == 'EXPIRED'"

      # ----- excluded_because stubs (covered by §1.8) -----
      - name: invoice_dispute_partial_revert_cycle_stub
        claim_type: cyclic_transition
        grounds: [state_machines.Invoice.DISPUTED_to_ISSUED]
        excluded_because:
          difficulty_instance: non_linear_state_machine / invoice_dispute_partial_revert_cycle
          rationale: "Cyclic revert path exercised by the named §1.8 instance."

      - name: carrier_qualified_suspend_reinstate_cycle_stub
        claim_type: cyclic_transition
        grounds: [state_machines.Carrier.SUSPENDED_to_QUALIFIED]
        excluded_because:
          difficulty_instance: non_linear_state_machine / carrier_qualified_suspend_reinstate_cycle
          rationale: "Cyclic revert exercised by the named §1.8 instance."

      - name: load_cancel_cascade_stub
        claim_type: cascade
        grounds: [state_machines.Load.AWARDED_to_CANCELLED, state_machines.QuoteRequest.OPEN_to_WITHDRAWN]
        excluded_because:
          difficulty_instance: transitive_cascade / load_cancel_cascade_to_quote_withdrawn_depth2
          rationale: "Cascade chain covered by the named §1.8 instance."

  # =====================================================================
  # Section: calculations
  # =====================================================================
  - section: calculations
    instances:

      - name: invoice_total_sums_agreed_detention_and_accessorial
        claim_type: correct_result
        grounds:
          - calculations.invoice_total_cents
          - entities.Invoice.fields.total_cents
        distinguishing_aspect: |
          POST /loads/{id}/invoice on a delivered Load with agreed_rate_cents=
          124000 and one LUMPER Accessorial of 8000 and detention_charge_cents=
          15000 produces Invoice.total_cents == 124000 + 15000 + 8000 = 147000.
        test_recipe:
          setup:
            - "Clock at 2026-06-01. Shipper, carrier QUALIFIED, contract ACTIVE (250/60 c/mi free=110 detrate=7500). Load delivered with detention_minutes=180 -> detention_charge=15000 (subtract-then-ceil); accessorial LUMPER 8000 attached."
          setup_api_calls:
            - call: "POST /freight/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: BrokerOps
            - call: "POST /freight/shippers"
              payload: { legal_name: "Yankee Shippers", billing_email: "ap@yankee.test", credit_limit_cents: 100000000 }
              as: BrokerOps
              captures: { s_id: $.data.id }
            - call: "POST /freight/carriers"
              payload: { legal_name: "Yankee Carrier", mc_number: "2828281", usdot_number: "28282828", smartway_tier: "NONE", insurance_expiry_utc: "2027-01-01T00:00:00Z", safety_score: 30 }
              as: BrokerOps
              captures: { c_id: $.data.id }
            - call: "POST /freight/carriers/${c_id}/qualify"
              payload: {}
              as: BrokerOps
            - call: "POST /freight/contract-rates"
              payload: { shipper_id: "${s_id}", lane_origin: "10001", lane_destination: "30303", rate_per_mile_cents: 250, fuel_surcharge_per_mile_cents: 60, detention_free_minutes: 110, detention_rate_per_hour_cents: 7500, effective_from_utc: "2026-01-01T00:00:00Z", effective_until_utc: "2027-01-01T00:00:00Z" }
              as: BrokerOps
              captures: { cr_id: $.data.id, cr_v: $.data.version }
            - call: "POST /freight/contract-rates/${cr_id}/activate"
              payload: { expected_contract_rate_version: "${cr_v}" }
              as: BrokerOps
            - call: "POST /freight/quote-requests"
              payload: { shipper_id: "${s_id}", lane_origin: "10001", lane_destination: "30303", distance_miles: 400, pickup_window_start_utc: "2026-06-10T08:00:00Z", pickup_window_end_utc: "2026-06-10T18:00:00Z", requested_equipment: "DRY_VAN" }
              as: BrokerOps
              captures: { q_id: $.data.id, q_v: $.data.version }
            - call: "POST /freight/quote-requests/${q_id}/award"
              payload: { carrier_id: "${c_id}", expected_quote_request_version: "${q_v}" }
              as: BrokerOps
              captures: { ld_id: $.data.id }
            - call: "POST /freight/loads/${ld_id}/pickup"
              payload: { actual_pickup_at_utc: "2026-06-10T11:00:00Z" }
              as: Carrier
              as_user_id: "${c_id}"
            - call: "POST /freight/loads/${ld_id}/deliver"
              payload: { actual_delivery_at_utc: "2026-06-11T11:00:00Z" }
              as: Carrier
              as_user_id: "${c_id}"
            - call: "POST /freight/loads/${ld_id}/accessorials"
              payload: { code: "LUMPER", amount_cents: 8000, note: "Lumper service" }
              as: BrokerOps
          trigger:
            - call: "POST /freight/loads/${ld_id}/invoice"
              payload: {}
              as: BrokerOps
              captures: { inv_id: $.data.id, inv_total: $.data.total_cents }
          assert:
            - "Invoice.${inv_id}.total_cents == 147000"

      - name: spot_tier_boundary_at_250_miles_inclusive
        claim_type: boundary
        grounds:
          - calculations.quote_total_at_request
          - entities.QuoteRequest.fields.quoted_total_cents
        distinguishing_aspect: |
          At exactly distance_miles=250 the formula chooses tier1
          (SPOT_TIER1_PER_MILE_CENTS=320) per the inclusive `<= 250` clause.
          Linehaul=320*250=80000; fuel=65*250=16250; DRY_VAN uplift=0 -> total
          96250. At 251 miles the tier flips to tier2 (235): 235*251 + 65*251 =
          58985 + 16315 = 75300 (REEFER 0% uplift would still apply, here
          DRY_VAN). Pinning the tier1 boundary instance.
        test_recipe:
          setup:
            - "Clock pinned. Shipper exists; no covering ContractRate."
          setup_api_calls:
            - call: "POST /freight/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: BrokerOps
            - call: "POST /freight/shippers"
              payload: { legal_name: "Zulu Shippers", billing_email: "ap@zulu.test", credit_limit_cents: 100000000 }
              as: BrokerOps
              captures: { s_id: $.data.id }
          trigger:
            - call: "POST /freight/quote-requests"
              payload: { shipper_id: "${s_id}", lane_origin: "10001", lane_destination: "30303", distance_miles: 250, pickup_window_start_utc: "2026-06-15T08:00:00Z", pickup_window_end_utc: "2026-06-15T18:00:00Z", requested_equipment: "DRY_VAN" }
              as: BrokerOps
              captures: { q_id: $.data.id, q_total: $.data.quoted_total_cents }
          assert:
            - "QuoteRequest.${q_id}.quoted_total_cents == 96250"
            - "QuoteRequest.${q_id}.rate_mode == 'SPOT'"

      - name: shipper_credit_risk_score_baseline_low_utilization
        claim_type: computed_field
        grounds:
          - calculations.shipper_credit_risk_score
          - endpoints[GET /freight/shippers/{id}/credit-risk]
        distinguishing_aspect: |
          GET /freight/shippers/{id}/credit-risk on a brand-new shipper (no
          invoices, no disputes, credit_limit_cents=200000) returns score==0
          and utilization_ratio==0.0.
        test_recipe:
          setup:
            - "Clock pinned. Shipper with credit_limit_cents=200000 and no loads."
          setup_api_calls:
            - call: "POST /freight/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: BrokerOps
            - call: "POST /freight/shippers"
              payload: { legal_name: "Alpha Two Shippers", billing_email: "ap@alpha2.test", credit_limit_cents: 200000 }
              as: BrokerOps
              captures: { s_id: $.data.id }
          trigger:
            - call: "GET /freight/shippers/${s_id}/credit-risk"
              payload: {}
              as: BrokerOps
              captures: { score: $.data.score, util: $.data.utilization_ratio }
          assert:
            - "response.data.score == 0"
            - "response.data.utilization_ratio == 0.0"

      - name: factoring_advance_stub
        claim_type: dual_variant
        grounds: [calculations.factoring_advance]
        excluded_because:
          difficulty_instance: dual_variant_calc / factoring_advance_diverges_with_carrier_safety_band
          rationale: "Both variant branches covered by named §1.8 instance."

      - name: smartway_audit_failing_stub
        claim_type: boundary
        grounds: [calculations.smartway_quarterly_audit]
        excluded_because:
          difficulty_instance: boundary_precision_check / smartway_audit_zero_load_quarter_is_failing
          rationale: "Zero-load boundary covered by named §1.8 instance."

  # =====================================================================
  # Section: validations
  # =====================================================================
  - section: validations
    instances:

      - name: quote_request_time_window_invalid_start_after_end
        claim_type: violation_to_error
        grounds:
          - validations[priority=11]
          - errors[ERR_TIME_WINDOW_INVALID]
        distinguishing_aspect: |
          POST /freight/quote-requests with pickup_window_start_utc >=
          pickup_window_end_utc is rejected ERR_TIME_WINDOW_INVALID.
        test_recipe:
          setup:
            - "Clock pinned, shipper exists."
          setup_api_calls:
            - call: "POST /freight/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: BrokerOps
            - call: "POST /freight/shippers"
              payload: { legal_name: "Bravo Two Shippers", billing_email: "ap@bravo2.test", credit_limit_cents: 100000000 }
              as: BrokerOps
              captures: { s_id: $.data.id }
          trigger:
            - call: "POST /freight/quote-requests"
              payload: { shipper_id: "${s_id}", lane_origin: "10001", lane_destination: "30303", distance_miles: 400, pickup_window_start_utc: "2026-06-15T18:00:00Z", pickup_window_end_utc: "2026-06-15T08:00:00Z", requested_equipment: "DRY_VAN" }
              as: BrokerOps
              captures: { err_id: $.data.error_id }
          assert:
            - "response.data.error_id == 'ERR_TIME_WINDOW_INVALID'"

      - name: credit_limit_exceeded_on_quote_create
        claim_type: violation_to_error
        grounds:
          - validations[priority=17]
          - errors[ERR_CREDIT_LIMIT_EXCEEDED]
        distinguishing_aspect: |
          POST /freight/quote-requests with estimated quote exceeding
          credit_limit_cents is rejected ERR_CREDIT_LIMIT_EXCEEDED.
        test_recipe:
          setup:
            - "Clock pinned. Shipper with very low credit_limit_cents=10000 (less than the smallest SPOT quote linehaul of ~50000)."
          setup_api_calls:
            - call: "POST /freight/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: BrokerOps
            - call: "POST /freight/shippers"
              payload: { legal_name: "Charlie Two Shippers", billing_email: "ap@charlie2.test", credit_limit_cents: 10000 }
              as: BrokerOps
              captures: { s_id: $.data.id }
          trigger:
            - call: "POST /freight/quote-requests"
              payload: { shipper_id: "${s_id}", lane_origin: "10001", lane_destination: "30303", distance_miles: 400, pickup_window_start_utc: "2026-06-15T08:00:00Z", pickup_window_end_utc: "2026-06-15T18:00:00Z", requested_equipment: "DRY_VAN" }
              as: BrokerOps
              captures: { err_id: $.data.error_id }
          assert:
            - "response.data.error_id == 'ERR_CREDIT_LIMIT_EXCEEDED'"

      - name: payment_overage_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=18]
          - errors[ERR_PAYMENT_OVERAGE]
        distinguishing_aspect: |
          POST /freight/invoices/{id}/payments with amount_cents pushing
          amount_paid_cents above total_cents is rejected ERR_PAYMENT_OVERAGE.
        test_recipe:
          setup:
            - "Invoice issued with total_cents=100000 (250+50 c/mi x 400 mi via contract)."
