            - "trigger response volume_credit_cents == 24000 (2.0 pct, gross >= 1000000) and net_total_cents == 1176000"
            - "trigger response status == \"DRAFT\", sequence_number == 1, invoice_number == \"INV-AMC-2390-C24-001\""
            - "GET /research-billing/charges?sponsor_invoice_id=${invoice_id} returns total_count == 1 and that row is ${charge_big_id}"
            - "GET /research-billing/charges/${charge_small_id} shows sponsor_invoice_id == null - it fits under the 2000000 cap but the loop had already BROKEN on the 900000 candidate; skip-and-continue would have selected it"
            - "GET /research-billing/charges/${charge_mid_id} shows sponsor_invoice_id == null and billing_state == \"UNBILLED\""
            - "GET /research-billing/studies/${study_id} still shows sponsor_unbilled_cents == 2200000 - creating a DRAFT invoice stamps the line but does not move billing_state"

      - name: posture_propagates_from_finding_open_through_close_to_a_fixed_point
        claim_type: constraint_propagation
        grounds:
          - calculations.study_billing_hold_posture
          - entities.Study.fields.open_finding_count
          - state_machines.AuditFinding.transitions[RESPONDED -> CLOSED_NO_ACTION].side_effects
        distinguishing_aspect: "The posture chain is walked in both directions on a study whose QCT is already qualifying: OPEN -> ALL_BLOCKED when the finding is opened, still ALL_BLOCKED while it is merely RESPONDED, and back to OPEN once it closes - the clause order means the finding count dominates the qct clause, and the recomputation settles after one pass."
        test_recipe:
          setup:
            - "One INDUSTRY_SPONSORED study with registry number NCT10000125 and a DEEMED_IND_IDE qualifying determination (posture OPEN), then one UNSUPPORTED_ROUTINE_CLASSIFICATION finding opened by auditor_1 and responded to by auditor_2."
          setup_api_calls:
            - call: "POST /research-billing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ResearchBillingManager
            - call: "POST /research-billing/studies"
              payload: { protocol_number: "AMC-2390-C25", title: "Corner posture-propagation probe", sponsor_name: "Northgate Therapeutics", funding_source: "INDUSTRY_SPONSORED", ind_ide_status: "IND_HELD", therapeutic_intent: true, registry_number: "NCT10000125" }
              as: ResearchBillingManager
              as_user_id: "mgr_1"
              captures: { study_id: "$.data.id", posture_at_registration: "$.data.billing_hold_posture" }
            - call: "POST /research-billing/studies/${study_id}/qct-determination"
              payload: { basis: "DEEMED_IND_IDE" }
              as: ComplianceReviewer
              as_user_id: "reviewer_1"
              captures: { posture_after_qct: "$.data.billing_hold_posture", qct_after: "$.data.qct_determination" }
            - call: "POST /research-billing/audit-findings"
              payload: { study_id: "${study_id}", finding_type: "UNSUPPORTED_ROUTINE_CLASSIFICATION", claimed_amount_cents: 9000 }
              as: AuditLiaison
              as_user_id: "auditor_1"
              captures: { finding_id: "$.data.id" }
            - call: "GET /research-billing/studies/${study_id}"
              as: ResearchBillingManager
              as_user_id: "mgr_1"
              captures: { posture_with_open_finding: "$.data.billing_hold_posture", open_count_with_finding: "$.data.open_finding_count" }
            - call: "POST /research-billing/audit-findings/${finding_id}/respond"
              payload: { response_narrative: "Charge reviewed; routing confirmed correct." }
              as: AuditLiaison
              as_user_id: "auditor_2"
            - call: "GET /research-billing/studies/${study_id}/charge-review-summary"
              as: ComplianceReviewer
              as_user_id: "reviewer_1"
              captures: { posture_while_responded: "$.data.billing_hold_posture", open_count_while_responded: "$.data.open_finding_count" }
          trigger:
            - call: "POST /research-billing/audit-findings/${finding_id}/resolve"
              payload: { disposition: "NO_ACTION" }
              as: AuditLiaison
              as_user_id: "auditor_2"
          assert:
            - "setup: posture_at_registration == \"PAYER_BLOCKED\", then qct_after == \"DEEMED_QUALIFYING\" and posture_after_qct == \"OPEN\""
            - "setup: posture_with_open_finding == \"ALL_BLOCKED\" and open_count_with_finding == 1 - the finding clause dominates a qualifying QCT"
            - "setup: posture_while_responded == \"ALL_BLOCKED\" and open_count_while_responded == 1 - RESPONDED still counts as open"
            - "trigger response 200 with status == \"CLOSED_NO_ACTION\""
            - "GET /research-billing/studies/${study_id} now shows open_finding_count == 0, rebuild_required_calendar_count == 0 and billing_hold_posture == \"OPEN\" - one recomputation pass reaches the fixed point"
            - "GET /research-billing/studies/${study_id}/charge-review-summary agrees: billing_hold_posture == \"OPEN\" and open_finding_count == 0"
            - "opening a second finding drives the posture back to \"ALL_BLOCKED\", so the propagation is re-entrant rather than one-way"

      - name: constants_applied_industry_tier_threshold
        claim_type: constants_applied
        grounds:
          - calculations.study_effective_indirect_rate.constants
        excluded_because:
          difficulty_instance: "boundary_precision_check / industry_indirect_tier_boundary_at_500000_subtotal"
          rationale: "That instance drives the per-patient subtotal to exactly INDUSTRY_TIER_THRESHOLD_CENTS and one cent below it, proving both the constant's value and which side of the comparison it lands on."

      - name: precision_round_per_line_versus_sum_then_round
        claim_type: precision
        grounds:
          - calculations.sponsor_invoice_indirect.precision
        excluded_because:
          difficulty_instance: "combinatorial_formula / invoice_indirect_rounds_per_line_then_sums"
          rationale: "That instance asserts the exact cents produced by round-per-line-then-sum and states the different figure sum-then-round would have produced."

      - name: threshold_volume_credit_at_and_below_the_tier
        claim_type: threshold
        grounds:
          - calculations.sponsor_invoice_net_total.constants
        excluded_because:
          difficulty_instance: "boundary_precision_check / invoice_volume_credit_threshold_met_exactly_at_gross_1000000"
          rationale: "That instance tests gross at the threshold and one cent under it, which is exactly the threshold-boundary claim."

      - name: aggregation_ledger_rollup_after_reversal
        claim_type: aggregation
        grounds:
          - calculations.study_ledger_rollup
        excluded_because:
          difficulty_instance: "compensating_invariant / audit_refund_conserves_total_payer_position"
          rationale: "That instance reconciles every payer rollup field before and after a refund reversal, covering running-total-after-add and after-reversal in one walk."

      - name: projection_effective_analysis_replay
        claim_type: projection
        grounds:
          - calculations.charge_routing_expectation
        excluded_because:
          difficulty_instance: "dual_variant_calc / routing_expectation_service_date_vs_current_effective_divergence"
          rationale: "That instance replays the analysis history for one charge under both selectors, including the late-approval case where a superseding analysis reclassifies an item_code."

      - name: tiered_pricing_route_unit_selection
        claim_type: tiered_pricing
        grounds:
          - calculations.visit_route_expected_amount
        excluded_because:
          difficulty_instance: "dual_variant_calc / budget_basis_variant_divergence_on_same_analysis"
          rationale: "That instance asserts the route amounts under both unit sources and shows the CALENDAR_DRIVEN subtotal built from them diverging from the COVERAGE_DRIVEN one."

      - name: variant_divergence_on_budget_basis
        claim_type: variant_divergence
        grounds:
          - calculations.study_budget_totals.variants
        excluded_because:
          difficulty_instance: "dual_variant_calc / budget_basis_variant_divergence_on_same_analysis"
          rationale: "That instance builds the same analysis under both bases and asserts the delta between the two per-patient subtotals."

      - name: variant_selection_by_endpoint_context
        claim_type: variant_selection
        grounds:
          - calculations.charge_routing_expectation.variants
        excluded_because:
          difficulty_instance: "dual_variant_calc / routing_expectation_service_date_vs_current_effective_divergence"
          rationale: "That instance shows the review endpoint using as_of_service_date while the persisted expected_routing_target uses current_effective on the same charge."

      - name: reconciliation_on_variant_switch
        claim_type: reconciliation
        grounds:
          - calculations.charge_routing_expectation
          - entities.Study.fields.improper_payer_exposure_cents
        excluded_because:
          difficulty_instance: "transitive_cascade / audit_refund_resolution_reroutes_and_rebalances_ledger"
          rationale: "That instance asserts the exposure delta applied to the study ledger when the charge's expectation flips and the refund re-routes the money."

  # =========================================================================
  # SECTION 4 - validations
  # =========================================================================
  - section: validations
    instances:
      - name: promotional_item_with_nonzero_negotiated_cost_is_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority 32]
          - errors[ERR_PROMOTIONAL_MUST_BE_ZERO_COST]
        distinguishing_aspect: "Only the zero-cost half of the rule is violated - budget_category is correctly NOT_BUDGETED - so the 422 is attributable to negotiated_unit_cents alone, and the rejected write leaves the analysis at item_count 0 and version 1."
        test_recipe:
          setup:
            - "One study with an empty DRAFT analysis."
          setup_api_calls:
            - call: "POST /research-billing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ResearchBillingManager
            - call: "POST /research-billing/studies"
              payload: { protocol_number: "AMC-2390-C30", title: "Corner violation probe", sponsor_name: "Northgate Therapeutics", funding_source: "INDUSTRY_SPONSORED", ind_ide_status: "IND_HELD", therapeutic_intent: true }
              as: ResearchBillingManager
              as_user_id: "mgr_1"
              captures: { study_id: "$.data.id", study_v1: "$.data.version" }
            - call: "POST /research-billing/coverage-analyses"
              payload: { study_id: "${study_id}", expected_study_version: "${study_v1}" }
              as: CoverageAnalyst
              as_user_id: "analyst_1"
              captures: { analysis_id: "$.data.id", analysis_v1: "$.data.version" }
          trigger:
            - call: "POST /research-billing/coverage-items"
              payload: { coverage_analysis_id: "${analysis_id}", expected_coverage_analysis_version: "${analysis_v1}", item_code: "SUPPLY-02", description: "Sponsor-donated infusion pump", classification: "PROMOTIONAL", medicare_coverage_basis: "NOT_COVERED", budget_category: "NOT_BUDGETED", charge_master_unit_cents: 12000, negotiated_unit_cents: 12000, units_per_occurrence: 1, expected_occurrences: 1 }
              as: CoverageAnalyst
              as_user_id: "analyst_1"
              captures: { observed_error: "$.data.error_id" }
          assert:
            - "trigger response 422 with error_id == \"ERR_PROMOTIONAL_MUST_BE_ZERO_COST\""
            - "GET /research-billing/coverage-analyses/${analysis_id} still shows item_count == 0, promotional_item_count == 0 and version == 1"
            - "GET /research-billing/coverage-analyses/${analysis_id}/items returns total_count == 0"
            - "re-posting the identical body with negotiated_unit_cents 0 returns 201 with billable_to \"NONE\" - charge_master_unit_cents 12000 is not constrained by this rule"

      - name: qualifying_determination_passes_when_registry_number_is_supplied_inline
        claim_type: satisfaction_to_pass
        grounds:
          - validations[priority 19]
          - endpoints[POST /research-billing/studies/{id}/qct-determination]
          - calculations.study_billing_hold_posture
        distinguishing_aspect: "The study was registered with no registry_number, so the rule is satisfied only by the number carried on this very request; the determination then succeeds, stores NCT10000131, and lifts the posture from PAYER_BLOCKED to OPEN in the same response."
        test_recipe:
          setup:
            - "One INDUSTRY_SPONSORED IND_HELD study registered without a registry number, so qct_determination is UNDETERMINED and the posture is PAYER_BLOCKED."
          setup_api_calls:
            - call: "POST /research-billing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ResearchBillingManager
            - call: "POST /research-billing/studies"
              payload: { protocol_number: "AMC-2390-C31", title: "Corner satisfaction probe", sponsor_name: "Northgate Therapeutics", funding_source: "INDUSTRY_SPONSORED", ind_ide_status: "IND_HELD", therapeutic_intent: true }
              as: ResearchBillingManager
              as_user_id: "mgr_1"
              captures: { study_id: "$.data.id", registry_before: "$.data.registry_number", posture_before: "$.data.billing_hold_posture" }
          trigger:
            - call: "POST /research-billing/studies/${study_id}/qct-determination"
              payload: { basis: "DEEMED_IND_IDE", registry_number: "NCT10000131" }
              as: ComplianceReviewer
              as_user_id: "reviewer_1"
          assert:
            - "setup: registry_before == null and posture_before == \"PAYER_BLOCKED\""
            - "trigger response 200 with qct_determination == \"DEEMED_QUALIFYING\", qct_basis == \"DEEMED_IND_IDE\" and registry_number == \"NCT10000131\""
            - "trigger response qct_determined_by_user_id == \"reviewer_1\", qct_determined_at == \"2026-08-01T00:00:00.000Z\" and version == 2"
            - "trigger response billing_hold_posture == \"OPEN\" - the qct clause no longer matches"
            - "the same call WITHOUT registry_number on a study still holding registry_number null returns 422 ERR_REGISTRY_NUMBER_REQUIRED, which is the violating side of this rule"

      - name: amendment_cannot_be_implemented_before_its_effective_date
        claim_type: temporal_validation
        grounds:
          - validations[priority 38]
          - errors[ERR_AMENDMENT_NOT_YET_EFFECTIVE]
        distinguishing_aspect: "The amendment is well-formed and SUBMITTED and every state precondition holds; only the logical clock disqualifies it, and moving the clock to the effective date (no other change) turns the same request into a 200 - so the refusal is purely temporal."
        test_recipe:
          setup:
            - "One study with a SUBMITTED ITEM_CHANGE amendment whose effective_date is 2026-09-10 while the logical clock reads 2026-09-01."
          setup_api_calls:
            - call: "POST /research-billing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ResearchBillingManager
            - call: "POST /research-billing/studies"
              payload: { protocol_number: "AMC-2390-C32", title: "Corner temporal probe", sponsor_name: "Northgate Therapeutics", funding_source: "INDUSTRY_SPONSORED", ind_ide_status: "IND_HELD", therapeutic_intent: true }
              as: ResearchBillingManager
              as_user_id: "mgr_1"
              captures: { study_id: "$.data.id" }
            - call: "POST /research-billing/amendments"
              payload: { study_id: "${study_id}", scope: "ITEM_CHANGE", effective_date: "2026-09-10" }
              as: ResearchBillingManager
              as_user_id: "mgr_1"
              captures: { amendment_id: "$.data.id", status_before: "$.data.status", reanalysis_flag: "$.data.reanalysis_required" }
          trigger:
            - call: "POST /research-billing/amendments/${amendment_id}/implement"
              as: ResearchBillingManager
              as_user_id: "mgr_1"
              captures: { observed_error: "$.data.error_id" }
          assert:
            - "setup: status_before == \"SUBMITTED\", reanalysis_flag == true, calendar_rebuild_required == false (ITEM_CHANGE)"
            - "trigger response 409 with error_id == \"ERR_AMENDMENT_NOT_YET_EFFECTIVE\""
            - "GET /research-billing/amendments/${amendment_id} still shows status == \"SUBMITTED\" and version == 1"
            - "GET /research-billing/studies/${study_id} still shows lifecycle_status == \"DRAFT\" - no cascade link fired"
            - "after POST /research-billing/_clock/set_current_utc to 2026-09-10T00:00:00Z the identical implement call returns 200 with status \"IMPLEMENTED\""
            - "an amendment filed with effective_date 2026-09-01 (equal to the clock date) is implementable immediately - the comparison is at-or-before, not strictly-before"

      - name: qct_conditional_routine_item_rejected_only_when_study_is_non_qualifying
        claim_type: conditional_validation
        grounds:
          - validations[priority 21]
          - validations[priority 35]
          - errors[ERR_ROUTINE_CARE_REQUIRES_QCT]
        distinguishing_aspect: "The rule fires on the study's qct_determination, not on the item: with a NON_QUALIFYING determination the QCT_CONDITIONAL routine item is refused 422 at draft time, while an UNDETERMINED study accepts the identical item and defers the refusal to approval as ERR_QCT_DETERMINATION_REQUIRED."
        test_recipe:
          setup:
            - "One study whose ComplianceReviewer has recorded basis NOT_QUALIFYING_DECLARED, leaving qct_determination NON_QUALIFYING, plus an empty DRAFT analysis on it."
          setup_api_calls:
            - call: "POST /research-billing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ResearchBillingManager
            - call: "POST /research-billing/studies"
              payload: { protocol_number: "AMC-2390-C33", title: "Corner conditional-validation probe", sponsor_name: "Northgate Therapeutics", funding_source: "INDUSTRY_SPONSORED", ind_ide_status: "IND_HELD", therapeutic_intent: true, registry_number: "NCT10000133" }
              as: ResearchBillingManager
              as_user_id: "mgr_1"
              captures: { study_id: "$.data.id" }
            - call: "POST /research-billing/studies/${study_id}/qct-determination"
              payload: { basis: "NOT_QUALIFYING_DECLARED" }
              as: ComplianceReviewer
              as_user_id: "reviewer_1"
              captures: { study_v2: "$.data.version", qct_after: "$.data.qct_determination" }
            - call: "POST /research-billing/coverage-analyses"
              payload: { study_id: "${study_id}", expected_study_version: "${study_v2}" }
              as: CoverageAnalyst
              as_user_id: "analyst_1"
              captures: { analysis_id: "$.data.id", analysis_v1: "$.data.version" }
          trigger:
            - call: "POST /research-billing/coverage-items"
              payload: { coverage_analysis_id: "${analysis_id}", expected_coverage_analysis_version: "${analysis_v1}", item_code: "70551", description: "MRI brain without contrast", classification: "ROUTINE_CARE", medicare_coverage_basis: "QCT_CONDITIONAL", budget_category: "PER_PATIENT", charge_master_unit_cents: 145000, negotiated_unit_cents: 145000, units_per_occurrence: 1, expected_occurrences: 2 }
              as: CoverageAnalyst
              as_user_id: "analyst_1"
              captures: { observed_error: "$.data.error_id" }
          assert:
            - "setup: qct_after == \"NON_QUALIFYING\" and the posture is \"PAYER_BLOCKED\""
            - "trigger response 422 with error_id == \"ERR_ROUTINE_CARE_REQUIRES_QCT\""
            - "GET /research-billing/coverage-analyses/${analysis_id} still shows item_count == 0, qct_conditional_item_count == 0 and version == 1"
            - "the identical item posted on a study left at qct_determination UNDETERMINED returns 201 with qct_conditional_item_count == 1 - the condition is the determination, not the item"
            - "that permissive path is then stopped one step later: approving the analysis returns 409 ERR_QCT_DETERMINATION_REQUIRED under priority 35"
            - "a ROUTINE_CARE item with medicare_coverage_basis STANDARD_OF_CARE is accepted on this NON_QUALIFYING study - the rule is scoped to QCT_CONDITIONAL"

      - name: priority_ordering_between_scheduling_rules
        claim_type: priority_ordering
        grounds:
          - validations[priority 37]
          - validations[priority 40]
        excluded_because:
          difficulty_instance: "priority_pair_validation_conflict / visit_window_violation_beats_daily_capacity_exhaustion"
          rationale: "That instance violates the window rule and the daily-capacity rule on one request and asserts the lower-priority number's error is returned."

      - name: priority_conflict_on_charge_review
        claim_type: priority_conflict
        grounds:
          - validations[priority 10]
          - validations[priority 22]
        excluded_because:
          difficulty_instance: "priority_pair_validation_conflict / already_routed_beats_billing_blocked_on_charge_review"
          rationale: "That instance builds a charge that violates both the state rule and the billing-blocked rule and asserts the state error wins."

      - name: cross_entity_validation_on_payer_routing
        claim_type: cross_entity_validation
        grounds:
          - validations[priority 23]
        excluded_because:
          difficulty_instance: "cross_entity_state_dependency / payer_routing_requires_study_qct_state_not_charge_state"
          rationale: "That instance tests the same charge failing and then passing purely because the STUDY's posture changed."

      - name: aggregate_validation_on_daily_visit_capacity
        claim_type: aggregate_validation
        grounds:
          - validations[priority 40]
        excluded_because:
          difficulty_instance: "resource_temporal_overlap / research_visit_daily_capacity_is_aggregate_across_subjects"
          rationale: "That instance schedules individually valid visits for different subjects on one date until the aggregate cap is breached."

      - name: cascading_validation_from_item_draft_to_approval
        claim_type: cascading_validation
        grounds:
          - validations[priority 21]
          - validations[priority 35]
        excluded_because:
          difficulty_instance: "cross_entity_state_dependency / analysis_approval_blocked_by_undetermined_study_qct"
          rationale: "That instance shows priority 21 permitting the draft and priority 35 refusing the approval, which is the ordered dependency between the two checks."

  # =========================================================================
  # SECTION 5 - endpoints
  # =========================================================================
  - section: endpoints
    instances:
      - name: calendar_create_read_and_filtered_list_round_trip
        claim_type: standard_crud
        grounds:
          - endpoints[POST /research-billing/study-calendars]
          - endpoints[GET /research-billing/study-calendars/{id}]
          - endpoints[GET /research-billing/study-calendars]
        distinguishing_aspect: "The create-read-list triple is walked on the calendar collection: the POST computes build_generation 1 and the three routing counters, GET /{id} echoes them byte for byte, and the collection GET honours source_analysis_id filtering plus limit/offset with total_count and has_more."
        test_recipe:
          setup:
            - "One study with an APPROVED analysis carrying one sponsor PER_PATIENT item."
          setup_api_calls:
            - call: "POST /research-billing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ResearchBillingManager
            - call: "POST /research-billing/studies"
              payload: { protocol_number: "AMC-2390-C40", title: "Corner CRUD probe", sponsor_name: "Northgate Therapeutics", funding_source: "INDUSTRY_SPONSORED", ind_ide_status: "IND_HELD", therapeutic_intent: true }
              as: ResearchBillingManager
              as_user_id: "mgr_1"
              captures: { study_id: "$.data.id", study_v1: "$.data.version" }
            - call: "POST /research-billing/coverage-analyses"
              payload: { study_id: "${study_id}", expected_study_version: "${study_v1}" }
              as: CoverageAnalyst
              as_user_id: "analyst_1"
              captures: { analysis_id: "$.data.id", analysis_v1: "$.data.version" }
            - call: "POST /research-billing/coverage-items"
              payload: { coverage_analysis_id: "${analysis_id}", expected_coverage_analysis_version: "${analysis_v1}", item_code: "J9999", description: "Investigational infusion", classification: "RESEARCH_PAID", medicare_coverage_basis: "NOT_COVERED", budget_category: "PER_PATIENT", charge_master_unit_cents: 55000, negotiated_unit_cents: 40000, units_per_occurrence: 1, expected_occurrences: 1 }
              as: CoverageAnalyst
              as_user_id: "analyst_1"
            - call: "POST /research-billing/coverage-analyses/${analysis_id}/submit"
              as: CoverageAnalyst
              as_user_id: "analyst_1"
            - call: "POST /research-billing/coverage-analyses/${analysis_id}/approve"
              as: ComplianceReviewer
              as_user_id: "reviewer_1"
          trigger:
            - call: "POST /research-billing/study-calendars"
              payload: { study_id: "${study_id}", source_analysis_id: "${analysis_id}" }
              as: CoverageAnalyst
              as_user_id: "analyst_1"
              captures: { calendar_id: "$.data.id" }
          assert:
            - "trigger response 201 with status == \"DRAFT\", build_generation == 1, visit_count == 0, routed_item_count == 0, published_at == null, version == 1"
            - "trigger response unrouted_per_patient_item_count == 1 - the single sponsor PER_PATIENT item is not yet routed"
            - "GET /research-billing/study-calendars/${calendar_id} returns the identical field values including created_at == \"2026-08-01T00:00:00.000Z\""
            - "GET /research-billing/study-calendars?study_id=${study_id} returns total_count == 1, has_more == false and that one row"
            - "GET /research-billing/study-calendars?source_analysis_id=${analysis_id} returns the same single row; filtering by status=PUBLISHED returns total_count == 0"
            - "GET /research-billing/study-calendars?study_id=${study_id}&limit=1&offset=1 returns an empty array with total_count == 1 and has_more == false"
            - "GET /research-billing/study-calendars/{unknown-uuid} returns 404 ERR_CALENDAR_NOT_FOUND"

      - name: return_action_moves_analysis_and_stamps_the_reason
        claim_type: action_endpoint
        grounds:
          - endpoints[POST /research-billing/coverage-analyses/{id}/return]
          - state_machines.CoverageAnalysis.transitions[UNDER_REVIEW -> RETURNED]
        distinguishing_aspect: "The action writes three fields at once - status RETURNED, return_count 1 and returned_by_user_id - lands the analysis at version 4 after create/item/submit/return, and leaves the study's lifecycle_status at COVERAGE_PENDING because a return is not a lifecycle event."
        test_recipe:
          setup:
            - "One study whose analysis carries one item and is UNDER_REVIEW."
          setup_api_calls:
            - call: "POST /research-billing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ResearchBillingManager
            - call: "POST /research-billing/studies"
              payload: { protocol_number: "AMC-2390-C41", title: "Corner action-endpoint probe", sponsor_name: "Northgate Therapeutics", funding_source: "INDUSTRY_SPONSORED", ind_ide_status: "IND_HELD", therapeutic_intent: true }
              as: ResearchBillingManager
              as_user_id: "mgr_1"
              captures: { study_id: "$.data.id", study_v1: "$.data.version" }
            - call: "POST /research-billing/coverage-analyses"
              payload: { study_id: "${study_id}", expected_study_version: "${study_v1}" }
              as: CoverageAnalyst
              as_user_id: "analyst_1"
              captures: { analysis_id: "$.data.id", analysis_v1: "$.data.version" }
            - call: "POST /research-billing/coverage-items"
              payload: { coverage_analysis_id: "${analysis_id}", expected_coverage_analysis_version: "${analysis_v1}", item_code: "80053", description: "Comprehensive metabolic panel", classification: "ROUTINE_CARE", medicare_coverage_basis: "STANDARD_OF_CARE", budget_category: "PER_PATIENT", charge_master_unit_cents: 9000, negotiated_unit_cents: 9000, units_per_occurrence: 1, expected_occurrences: 3 }
              as: CoverageAnalyst
              as_user_id: "analyst_1"
            - call: "POST /research-billing/coverage-analyses/${analysis_id}/submit"
              as: CoverageAnalyst
              as_user_id: "analyst_1"
              captures: { status_before: "$.data.status", version_before: "$.data.version" }
          trigger:
            - call: "POST /research-billing/coverage-analyses/${analysis_id}/return"
              payload: { return_reason: "Classify the metabolic panel against the standard-of-care footnote." }
              as: ComplianceReviewer
              as_user_id: "reviewer_1"
          assert:
            - "setup: status_before == \"UNDER_REVIEW\" and version_before == 3"
            - "trigger response 200 with status == \"RETURNED\", return_count == 1, returned_by_user_id == \"reviewer_1\", version == 4"
            - "trigger response return_reason == \"Classify the metabolic panel against the standard-of-care footnote.\""
            - "trigger response approved_at == null and approved_by_user_id == null"
            - "GET /research-billing/studies/${study_id} still shows lifecycle_status == \"COVERAGE_PENDING\" and version == 2"
            - "adding one more coverage item afterwards returns 201 and flips the analysis back to status \"DRAFT\" with return_count still 1"

      - name: charge_review_summary_matches_the_stored_ledger
        claim_type: computed_read
        grounds:
          - endpoints[GET /research-billing/studies/{id}/charge-review-summary]
