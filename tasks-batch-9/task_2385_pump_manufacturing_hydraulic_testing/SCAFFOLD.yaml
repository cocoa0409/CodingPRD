scenario: "2385. Pump Manufacturing & Hydraulic Testing (industrial pump manufacturer): hydraulic design and impeller selection to meet head-flow duty points with efficiency targets, pattern and casting management with foundry relationships and casting defect handling, machining and assembly with balance, clearance and seal installation standards, performance testing to standards with certified test curves and net positive suction head verification, material and seal configuration selection for corrosive and abrasive services, engineered pump packages with baseplates, motors and controls, spare parts and repair kit stocking with interchangeability across generations, field performance troubleshooting, warranty claims and application error determination"
domain_name: "pump-manufacturing-hydraulic-testing"
api_prefix: "/"

complexity_profile:
  primary_archetype: "Compliance / audit"
  secondary_archetype: "Quota / allocation"
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - optimistic_concurrency
    - derived_field_reconciliation
    - selector_policy
  entity_topology: graph
  state_machine_shape: parallel
  state_machine_shape_notes: |
    Mixed non-linear surface: TestRun carries three independent state dimensions
    (run_state x hydraulic_status x npsh_status); PatternAsset, CastingLot, Selection,
    BuildOrder and WarrantyClaim carry cycles; WarrantyClaim adjudication is a
    three-way fork with divergent side-effect sets per branch.
  relationship_patterns:
    - one_to_many
    - many_to_many
    - self_referential
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate
  difficulty_band: "beyond Expert (15 entities, 84 endpoints, 13 state machines, 12 calculations, 2 dual-variant axes plus a 3-level selector policy)"

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

entities:
  - name: Foundry
    parent: null
    common_fields: true
    fields:
      - name: foundry_code
        type: string
        source: input
        description: unique external code of the foundry
        constraints: "unique across Foundry; 3-32 chars"
      - name: name
        type: string
        source: input
        description: legal name of the foundry partner
      - name: approved_alloys
        type: array
        source: input
        description: alloy codes this foundry is qualified to pour
        constraints: "non-empty array; members from {CI_GG25, DUCTILE_GGG40, CD4MCU, DUPLEX_S31803, CN7M}"
      - name: concurrent_pour_capacity
        type: integer
        source: input
        description: maximum number of CastingLot pour windows that may overlap at this foundry
        constraints: ">= 1"
      - name: status
        type: enum
        source: computed
        description: lifecycle state of the foundry
        default: ACTIVE
        constraints: "one of {ACTIVE, SUSPENDED}"
      - name: suspension_reason
        type: string
        source: input
        description: free-text reason captured when the foundry is suspended
        default: null

  - name: PumpModel
    parent: null
    common_fields: true
    fields:
      - name: model_code
        type: string
        source: input
        description: unique catalogue code of the hydraulic model
        constraints: "unique across PumpModel"
      - name: generation
        type: integer
        source: input
        description: design generation number inside the interchange group
        constraints: ">= 1"
      - name: interchange_group
        type: string
        source: input
        description: spare-parts interchangeability group shared across generations
      - name: max_impeller_diameter_mm
        type: number
        source: input
        description: full (untrimmed) impeller diameter
        constraints: "> 0; two decimals"
      - name: min_impeller_diameter_mm
        type: number
        source: input
        description: smallest impeller diameter the casing may be fitted with
        constraints: "> 0; < max_impeller_diameter_mm"
      - name: shutoff_head_m
        type: number
        source: input
        description: head at zero flow on the full-diameter curve
        constraints: "> bep_head_m"
      - name: bep_flow_m3h
        type: number
        source: input
        description: best-efficiency-point flow on the full-diameter curve
        constraints: "> 0"
      - name: bep_head_m
        type: number
        source: input
        description: best-efficiency-point head on the full-diameter curve
        constraints: "> 0"
      - name: bep_efficiency_pct
        type: number
        source: input
        description: best-efficiency-point efficiency on the full-diameter curve
        constraints: "> 0 and <= 100"
      - name: npshr_at_bep_m
        type: number
        source: input
        description: catalogue NPSH required at the best efficiency point
        constraints: "> 0"
      - name: rated_speed_rpm
        type: integer
        source: input
        description: nameplate rotational speed used as the affinity-law reference
        constraints: ">= 300"
      - name: max_flow_m3h
        type: number
        source: input
        description: right-hand end of the allowable operating envelope
        constraints: "> bep_flow_m3h"
      - name: rotor_mass_kg
        type: number
        source: input
        description: rotating-assembly mass used by the ISO 1940 balance allowance
        constraints: "> 0"
      - name: balance_grade
        type: enum
        source: input
        description: ISO 1940 balance quality grade required for the rotating assembly
        constraints: "one of {G1_0, G2_5, G6_3}"
      - name: superseded_by_model_id
        type: string
        source: input
        description: "FK -> PumpModel.id; self-referential successor model set when this model is superseded; null while the model is current"
        default: null
      - name: status
        type: enum
        source: computed
        description: orderability state of the model
        default: ORDERABLE
        constraints: "one of {ORDERABLE, PATTERN_CONSTRAINED, SUPERSEDED}"
      - name: warranty_defect_count
        type: integer
        source: computed
        description: count of WarrantyClaim rows adjudicated as a manufacturing defect against this model
        default: 0
      - name: application_error_count
        type: integer
        source: computed
        description: count of WarrantyClaim rows adjudicated as an application error against this model
        default: 0
      - name: no_defect_count
        type: integer
        source: computed
        description: count of WarrantyClaim rows adjudicated as no-defect-found against this model
        default: 0

  - name: PatternAsset
    parent: PumpModel
    common_fields: true
    fields:
      - name: pump_model_id
        type: string
        source: input
        description: "FK -> PumpModel.id; the hydraulic model this casting pattern produces"
      - name: foundry_id
        type: string
        source: input
        description: "FK -> Foundry.id; the foundry that physically holds the pattern"
      - name: pattern_code
        type: string
        source: input
        description: unique pattern identifier stamped on the tooling
        constraints: "unique across PatternAsset"
      - name: wear_threshold
        type: integer
        source: input
        description: wear_index value at or above which the pattern must be withdrawn for refurbishment
        constraints: ">= 1"
      - name: pours_since_refurb
        type: integer
        source: computed
        description: number of CastingLot rows poured from this pattern since the last completed refurbishment
        default: 0
      - name: defect_pours_since_refurb
        type: integer
        source: computed
        description: number of CastingLot rows poured from this pattern since the last completed refurbishment that received at least one CRITICAL CastingDefect
        default: 0
      - name: wear_index
        type: integer
        source: computed
        description: derived wear score reconciled on every pour and on every CRITICAL defect report
        default: 0
      - name: refurb_cycles
        type: integer
        source: computed
        description: number of completed refurbishment cycles
        default: 0
      - name: status
        type: enum
        source: computed
        description: qualification state of the pattern tooling
        default: QUALIFIED
        constraints: "one of {QUALIFIED, WORN, IN_REFURB, RETIRED}"

  - name: MaterialSealConfig
    parent: PumpModel
    common_fields: false
    fields:
      - name: pump_model_id
        type: string
        source: input
        description: "FK -> PumpModel.id; the model this material and seal configuration is released for"
      - name: config_code
        type: string
        source: input
        description: unique configuration code
        constraints: "unique across MaterialSealConfig"
      - name: casing_material
        type: enum
        source: input
        description: casing alloy
        constraints: "one of {CI_GG25, DUCTILE_GGG40, CD4MCU, DUPLEX_S31803, CN7M}"
      - name: impeller_material
        type: enum
        source: input
        description: impeller alloy
        constraints: "one of {CI_GG25, DUCTILE_GGG40, CD4MCU, DUPLEX_S31803, CN7M}"
      - name: seal_type
        type: enum
        source: input
        description: mechanical seal arrangement
        constraints: "one of {SINGLE_CARTRIDGE, DOUBLE_CARTRIDGE, DUAL_PRESSURIZED, PACKED_GLAND}"
      - name: flush_plan
        type: enum
        source: input
        description: API 682 seal flush plan required for this configuration
        constraints: "one of {API_PLAN_02, API_PLAN_11, API_PLAN_23, API_PLAN_32, API_PLAN_53B}"
      - name: service_class
        type: enum
        source: input
        description: service duty this configuration is rated for
        constraints: "one of {CLEAN, CORROSIVE, ABRASIVE, CORROSIVE_ABRASIVE}"
      - name: max_solids_pct
        type: number
        source: input
        description: maximum entrained-solids concentration by weight the configuration tolerates
        constraints: ">= 0"
      - name: max_viscosity_cst
        type: number
        source: input
        description: maximum pumped-fluid kinematic viscosity the configuration tolerates
        constraints: "> 0"
      - name: max_chloride_ppm
        type: number
        source: input
        description: maximum chloride concentration the wetted alloys tolerate
        constraints: ">= 0"
      - name: max_temp_c
        type: number
        source: input
        description: maximum process temperature the seal arrangement tolerates
        constraints: "> 0"
      - name: min_running_clearance_mm
        type: number
        source: input
        description: minimum diametral running clearance for this material pair; the acceptance band is [min_running_clearance_mm, min_running_clearance_mm + CLEARANCE_BAND_WIDTH_MM]
        constraints: "> 0; two decimals"

  - name: DutyApplication
    parent: null
    common_fields: true
    fields:
      - name: application_code
        type: string
        source: input
        description: unique customer enquiry code
        constraints: "unique across DutyApplication"
      - name: customer_name
        type: string
        source: input
        description: end-customer name
      - name: duty_flow_m3h
        type: number
        source: input
        description: guaranteed duty-point flow
        constraints: "> 0"
      - name: duty_head_m
        type: number
        source: input
        description: guaranteed duty-point head
        constraints: "> 0"
      - name: npsha_available_m
        type: number
        source: input
        description: net positive suction head available at the installation
        constraints: "> 0"
      - name: specific_gravity
        type: number
        source: input
        description: pumped-fluid specific gravity
        constraints: "> 0"
      - name: viscosity_cst
        type: number
        source: input
        description: pumped-fluid kinematic viscosity
        constraints: "> 0"
      - name: solids_pct
        type: number
        source: input
        description: entrained-solids concentration by weight
        constraints: ">= 0"
      - name: chloride_ppm
        type: number
        source: input
        description: chloride concentration of the pumped fluid
        constraints: ">= 0"
      - name: process_temp_c
        type: number
        source: input
        description: process temperature at the pump suction
        constraints: "> 0"
      - name: min_efficiency_pct
        type: number
        source: input
        description: contractual minimum predicted efficiency at the duty point
        constraints: "> 0 and <= 100"
      - name: test_grade
        type: enum
        source: input
        description: ISO 9906 acceptance grade the performance test must satisfy
        constraints: "one of {GRADE_1B, GRADE_2B, GRADE_3B}"
      - name: witness_required
        type: boolean
        source: input
        description: whether the customer witnesses the performance test; drives the warranty guarantee basis
      - name: service_class_required
        type: enum
        source: input
        description: service duty the selected MaterialSealConfig must be rated for
        constraints: "one of {CLEAN, CORROSIVE, ABRASIVE, CORROSIVE_ABRASIVE}"
      - name: status
        type: enum
        source: computed
        description: commercial lifecycle state of the enquiry
        default: OPEN
        constraints: "one of {OPEN, SELECTION_LOCKED, CONTRACTED, CLOSED}"

  - name: Selection
    parent: DutyApplication
    common_fields: true
    fields:
      - name: duty_application_id
        type: string
        source: input
        description: "FK -> DutyApplication.id; the enquiry this selection answers"
      - name: pump_model_id
        type: string
        source: input
        description: "FK -> PumpModel.id; the hydraulic model selected"
      - name: material_seal_config_id
        type: string
        source: input
        description: "FK -> MaterialSealConfig.id; the material and seal configuration selected"
      - name: trimmed_impeller_diameter_mm
        type: number
        source: computed
        description: impeller diameter after trim, rounded to one decimal (see calculations.impeller_trim_and_head_prediction)
      - name: diameter_ratio
        type: number
        source: computed
        description: trimmed_impeller_diameter_mm / PumpModel.max_impeller_diameter_mm, unrounded, retained for downstream curve reconstruction
      - name: predicted_head_m
        type: number
        source: computed
        description: head the trimmed impeller delivers at DutyApplication.duty_flow_m3h
      - name: predicted_efficiency_pct
        type: number
        source: computed
        description: predicted efficiency at the duty point after off-BEP, trim, viscosity and abrasive corrections
      - name: predicted_shaft_power_kw
        type: number
        source: computed
        description: predicted shaft power at the duty point
      - name: npshr_catalog_m
        type: number
        source: computed
        description: catalogue NPSH required at the duty flow before the certification safety factor
      - name: npsh_provisional_margin_m
        type: number
        source: computed
        description: npsha_available_m minus npshr_catalog_m; selects the certification safety-factor tier
      - name: npsh_safety_factor
        type: number
        source: computed
        description: safety-factor tier applied to npshr_catalog_m to obtain the certified value
      - name: npshr_certified_m
        type: number
        source: computed
        description: certified NPSH required at the duty flow
      - name: npsh_margin_m
        type: number
        source: computed
        description: npsha_available_m minus npshr_certified_m; gated at approval against MIN_NPSH_MARGIN_M
      - name: min_motor_kw
        type: number
        source: computed
        description: minimum motor rating derived from predicted_shaft_power_kw and MOTOR_MARGIN
      - name: proposed_by_user_id
        type: string
        source: system
        description: X-User-ID of the ApplicationEngineer that moved the selection to PROPOSED; null while DRAFT
        default: null
      - name: approved_by_user_id
        type: string
        source: system
        description: X-User-ID of the HydraulicApprover that approved the selection
        default: null
      - name: status
        type: enum
        source: computed
        description: approval lifecycle state
        default: DRAFT
        constraints: "one of {DRAFT, PROPOSED, APPROVED, UNDER_REVIEW, SUPERSEDED}"

  - name: CastingLot
    parent: PatternAsset
    common_fields: true
    fields:
      - name: pattern_asset_id
        type: string
        source: input
        description: "FK -> PatternAsset.id; the tooling used for this pour"
      - name: foundry_id
        type: string
        source: input
        description: "FK -> Foundry.id; the foundry executing this pour"
      - name: heat_number
        type: string
        source: input
        description: melt heat identifier stamped on the castings
      - name: alloy_code
        type: enum
        source: input
        description: alloy poured for this lot
        constraints: "one of {CI_GG25, DUCTILE_GGG40, CD4MCU, DUPLEX_S31803, CN7M}"
      - name: qty_poured
        type: integer
        source: input
        description: number of castings poured in this lot
        constraints: ">= 1"
      - name: pour_window_start
        type: datetime
        source: input
        description: start of the occupation window this lot holds on the pattern and on the foundry
      - name: pour_window_end
        type: datetime
        source: input
        description: end of the occupation window; pattern conflicts use closed-interval semantics, foundry capacity uses half-open semantics
        constraints: "> pour_window_start"
      - name: qty_scrapped
        type: integer
        source: computed
        description: castings written off by a SCRAP defect disposition
        default: 0
      - name: qty_rework_pending
        type: integer
        source: computed
        description: castings held in weld-repair by a REPAIR_WELD defect disposition and not yet repair-verified
        default: 0
      - name: qty_accepted
        type: integer
        source: computed
        description: "derived ledger balance: qty_poured - qty_scrapped - qty_rework_pending"
        default: 0
      - name: committed_build_count
        type: integer
        source: computed
        description: number of BuildOrder rows bound to this lot whose status is not CLOSED and not CASTING_SHORT
        default: 0
      - name: status
        type: enum
        source: computed
        description: quality lifecycle state of the lot
        default: POURED
        constraints: "one of {POURED, INSPECTED, ACCEPTED, QUARANTINED, REWORK, SCRAPPED}"

  - name: CastingDefect
    parent: CastingLot
    common_fields: true
    fields:
      - name: casting_lot_id
        type: string
        source: input
        description: "FK -> CastingLot.id; the lot the defect was found in"
      - name: defect_code
        type: string
        source: input
        description: foundry defect reference
      - name: defect_type
        type: enum
        source: input
        description: metallurgical defect classification
        constraints: "one of {POROSITY, SHRINKAGE, INCLUSION, COLD_SHUT, MISRUN, CORE_SHIFT}"
      - name: severity
        type: enum
        source: input
        description: severity assessed at report time; CRITICAL also advances the pattern wear index
        constraints: "one of {MINOR, MAJOR, CRITICAL}"
      - name: affected_qty
        type: integer
        source: input
        description: number of castings in the lot affected by this defect
        constraints: ">= 1 and <= CastingLot.qty_accepted at report time"
      - name: reported_by_user_id
        type: string
        source: system
        description: X-User-ID of the actor that reported the defect; segregation-of-duties input for USE_AS_IS disposition
      - name: dispositioned_by_user_id
        type: string
        source: system
        description: X-User-ID of the QualityInspector that dispositioned the defect
        default: null
      - name: disposition
        type: enum
        source: input
        description: engineering disposition applied to the affected castings
        default: null
        constraints: "one of {USE_AS_IS, REPAIR_WELD, SCRAP}"
      - name: status
        type: enum
        source: computed
        description: disposition lifecycle state
        default: REPORTED
        constraints: "one of {REPORTED, DISPOSITIONED_USE_AS_IS, DISPOSITIONED_REPAIR, DISPOSITIONED_SCRAP, REPAIR_VERIFIED}"

  - name: BuildOrder
    parent: Selection
    common_fields: true
    fields:
      - name: selection_id
        type: string
        source: input
        description: "FK -> Selection.id; the approved selection this unit is built to"
      - name: casting_lot_id
        type: string
        source: input
        description: "FK -> CastingLot.id; the accepted lot the casting is drawn from"
      - name: serial_number
        type: string
        source: input
        description: unique manufacturing serial number
        constraints: "unique across BuildOrder"
      - name: running_clearance_mm
        type: number
        source: input
        description: measured diametral running clearance recorded at assembly
        default: null
      - name: residual_unbalance_g_mm
        type: number
        source: input
        description: measured residual unbalance of the rotating assembly recorded at assembly
        default: null
      - name: seal_flush_plan_installed
        type: enum
        source: input
        description: seal flush plan actually piped at assembly
        default: null
        constraints: "one of {API_PLAN_02, API_PLAN_11, API_PLAN_23, API_PLAN_32, API_PLAN_53B}"
      - name: allowable_unbalance_g_mm
        type: number
        source: computed
        description: ISO 1940 allowable residual unbalance for the model's balance grade, mass and rated speed
        default: null
      - name: rework_cycles
        type: integer
        source: computed
        description: number of completed rework loops; capped by MAX_REWORK_CYCLES
        default: 0
      - name: status
        type: enum
        source: computed
        description: manufacturing lifecycle state
        default: PLANNED
        constraints: "one of {PLANNED, ASSEMBLED, TESTED, REWORK_REQUIRED, CASTING_SHORT, CLOSED}"

  - name: TestRun
    parent: BuildOrder
    common_fields: true
    fields:
      - name: build_order_id
        type: string
        source: input
        description: "FK -> BuildOrder.id; the assembled unit under test"
      - name: test_speed_rpm
        type: integer
        source: input
        description: rotational speed the test was actually run at
        constraints: ">= 300"
      - name: correction_basis
        type: enum
        source: input
        description: how measured points are converted to the reported curve; selects the certified_test_curve variant
        constraints: "one of {AS_TESTED, RATED_SPEED_CORRECTED}"
      - name: test_grade
        type: enum
        source: input
        description: ISO 9906 acceptance grade applied to this run
        constraints: "one of {GRADE_1B, GRADE_2B, GRADE_3B}"
      - name: witness_required
        type: boolean
        source: input
        description: whether this run is a witnessed contractual test; drives PumpPackage.guarantee_basis at release
      - name: speed_ratio
        type: number
        source: computed
        description: rated_speed_rpm / test_speed_rpm under RATED_SPEED_CORRECTED, exactly 1 under AS_TESTED
        default: null
      - name: head_at_guarantee_m
        type: number
        source: computed
        description: reported head interpolated at the selection's duty flow
        default: null
      - name: power_at_guarantee_kw
        type: number
        source: computed
        description: reported shaft power interpolated at the selection's duty flow
        default: null
      - name: efficiency_at_guarantee_pct
        type: number
        source: computed
        description: reported efficiency at the selection's duty flow
        default: null
      - name: head_deviation_pct
        type: number
        source: computed
        description: signed percentage deviation of head_at_guarantee_m from Selection.predicted_head_m
        default: null
      - name: efficiency_deviation_pct
        type: number
        source: computed
        description: signed percentage deviation of efficiency_at_guarantee_pct from Selection.predicted_efficiency_pct
        default: null
      - name: npshr_tested_m
        type: number
        source: computed
        description: reported 3-percent-head-drop NPSH required taken from the designated NPSH test point
        default: null
      - name: run_state
        type: enum
        source: computed
        description: "state dimension 1: test execution lifecycle"
        default: OPEN
        constraints: "one of {OPEN, POINTS_LOCKED, EVALUATED, CERTIFIED}"
      - name: hydraulic_status
        type: enum
        source: computed
        description: "state dimension 2: head and efficiency acceptance against the grade tolerance"
        default: NOT_EVALUATED
        constraints: "one of {NOT_EVALUATED, WITHIN_TOLERANCE, OUT_OF_TOLERANCE}"
      - name: npsh_status
        type: enum
        source: computed
        description: "state dimension 3: suction performance verification"
        default: NOT_VERIFIED
        constraints: "one of {NOT_VERIFIED, VERIFIED, REJECTED}"

  - name: TestPoint
    parent: TestRun
    common_fields: false
    fields:
      - name: test_run_id
        type: string
        source: input
        description: "FK -> TestRun.id; the run this measurement belongs to"
      - name: measured_flow_m3h
        type: number
        source: input
        description: measured flow at this point
        constraints: "> 0"
      - name: measured_head_m
        type: number
        source: input
        description: measured head at this point
        constraints: "> 0"
      - name: measured_power_kw
        type: number
        source: input
        description: measured shaft power at this point
        constraints: "> 0"
      - name: measured_npsh3_m
        type: number
        source: input
        description: measured 3-percent-head-drop NPSH at this point; required when is_npsh_point is true
        default: null
      - name: is_npsh_point
        type: boolean
        source: input
        description: marks the single point that carries the suction-performance measurement
        default: false

  - name: PumpPackage
    parent: BuildOrder
    common_fields: true
    fields:
      - name: build_order_id
        type: string
        source: input
        description: "FK -> BuildOrder.id; the bare-shaft unit this package is engineered around"
      - name: test_run_id
        type: string
        source: input
        description: "FK -> TestRun.id; the performance test whose curve this package ships against"
      - name: baseplate_code
        type: string
        source: input
        description: baseplate drawing code
      - name: motor_kw
        type: number
        source: input
        description: installed motor rating
        constraints: "> 0"
      - name: motor_frame
        type: string
        source: input
        description: motor frame designation
      - name: control_type
        type: enum
        source: input
        description: control package supplied with the skid
        constraints: "one of {DOL_STARTER, SOFT_STARTER, VFD, NONE}"
      - name: promised_ship_date
        type: datetime
        source: input
        description: contractual ship date; cleared when the package is placed on hold
      - name: actual_ship_date
        type: datetime
        source: input
        description: date the package actually shipped; anchors the warranty clock
        default: null
      - name: min_motor_kw
        type: number
        source: computed
        description: minimum acceptable motor rating derived from the guarantee basis in force at package creation
      - name: guarantee_basis
        type: enum
        source: computed
        description: warranty reference curve fixed at release from TestRun.witness_required
        default: null
        constraints: "one of {CERTIFIED_CURVE, SELECTION}"
      - name: application_error_flagged
        type: boolean
        source: computed
        description: set when a WarrantyClaim on this package is adjudicated as an application error
        default: false
      - name: status
        type: enum
        source: computed
        description: shipping lifecycle state
        default: CONFIGURED
        constraints: "one of {CONFIGURED, RELEASED, HELD, SHIPPED}"

  - name: RepairKit
    parent: PumpModel
    common_fields: true
    fields:
      - name: pump_model_id
        type: string
        source: input
        description: "FK -> PumpModel.id; the model this kit was originally drawn for"
      - name: kit_code
        type: string
        source: input
        description: unique kit part number
        constraints: "unique across RepairKit"
      - name: interchange_group
        type: string
        source: input
        description: interchange group the kit fits
      - name: gen_min
        type: integer
        source: input
        description: lowest model generation inside the interchange group this kit covers
        constraints: ">= 1"
      - name: gen_max
        type: integer
        source: input
        description: highest model generation inside the interchange group this kit covers
        constraints: ">= gen_min"
      - name: preferred_generation
        type: integer
        source: input
        description: generation the kit is dimensionally optimal for
        constraints: ">= gen_min and <= gen_max"
      - name: substitution_penalty_pct
        type: number
        source: input
        description: price uplift applied when the kit is fitted outside its preferred generation
        constraints: ">= 0"
      - name: unit_price
        type: number
        source: input
        description: list price per kit
        constraints: "> 0; two decimals"
      - name: support_window_start
        type: datetime
        source: input
        description: inclusive start of the period during which the kit may be allocated
      - name: support_window_end
        type: datetime
        source: input
        description: exclusive end of the period during which the kit may be allocated
        constraints: "> support_window_start"
      - name: qty_received_total
        type: integer
        source: computed
        description: cumulative units ever received into stock
        default: 0
      - name: qty_on_hand
        type: integer
        source: computed
        description: unreserved units physically available
        default: 0
      - name: qty_reserved
        type: integer
        source: computed
        description: units held by RESERVED KitAllocation rows
        default: 0
      - name: qty_issued
        type: integer
        source: computed
        description: units held by ISSUED KitAllocation rows
        default: 0
      - name: qty_consumed_total
        type: integer
        source: computed
        description: cumulative units consumed by CONSUMED KitAllocation rows
        default: 0
      - name: status
        type: enum
        source: computed
        description: catalogue availability state
        default: ACTIVE
        constraints: "one of {ACTIVE, DISCONTINUED}"

  - name: KitAllocation
    parent: RepairKit
    common_fields: true
    fields:
      - name: repair_kit_id
        type: string
        source: input
        description: "FK -> RepairKit.id; the kit whose stock this allocation draws on"
      - name: build_order_id
        type: string
        source: input
        description: "FK -> BuildOrder.id; the unit the kit is allocated against"
      - name: requested_qty
        type: integer
        source: input
        description: units requested
        constraints: ">= 1"
      - name: selected_by
        type: enum
        source: computed
        description: whether the kit was named explicitly by the client or chosen by the interchange selector
        constraints: "one of {EXPLICIT, SELECTOR}"
      - name: substitution_penalty_applied_pct
        type: number
        source: computed
        description: penalty percentage actually applied, taken from the kit's substitution_penalty_pct when the fitted generation differs from the kit's preferred_generation, else 0
      - name: parts_extended
        type: number
        source: computed
        description: extended parts value after the substitution penalty; drives the handling-rate tier
      - name: handling_rate
        type: number
        source: computed
        description: handling-fee rate selected from HANDLING_TIERS by parts_extended
      - name: handling_fee
        type: number
        source: computed
        description: handling fee charged on this allocation
      - name: total_charge
        type: number
        source: computed
        description: parts_extended plus handling_fee
      - name: status
        type: enum
        source: computed
        description: allocation lifecycle state
        default: RESERVED
        constraints: "one of {RESERVED, ISSUED, CONSUMED, RELEASED}"

  - name: WarrantyClaim
    parent: PumpPackage
    common_fields: true
    fields:
      - name: pump_package_id
        type: string
        source: input
        description: "FK -> PumpPackage.id; the shipped package the field complaint is raised against"
      - name: as_found_flow_m3h
        type: number
        source: input
        description: flow measured in the field during troubleshooting
        constraints: "> 0"
      - name: as_found_head_m
        type: number
        source: input
        description: head measured in the field during troubleshooting
        constraints: "> 0"
      - name: as_found_npsha_m
        type: number
        source: input
        description: NPSH available measured at the installation during troubleshooting
        constraints: "> 0"
      - name: as_found_solids_pct
        type: number
        source: input
        description: entrained-solids concentration measured in the field
        constraints: ">= 0"
      - name: as_found_viscosity_cst
        type: number
        source: input
        description: pumped-fluid viscosity measured in the field
        constraints: "> 0"
      - name: as_found_speed_rpm
        type: integer
        source: input
        description: rotational speed measured in the field
        constraints: ">= 300"
      - name: claim_lines
        type: array
        source: input
        description: "cost lines claimed by the customer; each element is { line_code: string, category: enum {PARTS, LABOUR, FREIGHT, DOWNTIME}, gross_amount: number }"
        constraints: "non-empty array; gross_amount > 0 on every element"
      - name: submitted_by_user_id
        type: string
        source: system
        description: X-User-ID of the actor that submitted the claim; segregation-of-duties input for adjudication
      - name: adjudicated_by_user_id
        type: string
        source: system
        description: X-User-ID of the WarrantyAdjudicator that adjudicated the claim
        default: null
      - name: info_request_note
        type: string
        source: input
        description: note recorded when the adjudicator returns the claim for more information
        default: null
      - name: liability_basis
        type: enum
        source: computed
        description: guarantee basis copied from PumpPackage.guarantee_basis at adjudication; selects the warranty_liability_determination variant
        default: null
        constraints: "one of {CERTIFIED_CURVE, SELECTION}"
      - name: expected_head_m
        type: number
        source: computed
        description: head the guarantee basis promises at as_found_flow_m3h
        default: null
      - name: head_shortfall_pct
        type: number
        source: computed
        description: signed percentage deviation of as_found_head_m from expected_head_m
        default: null
      - name: application_error_flags
        type: array
        source: computed
        description: ordered list of installation-side deviations detected against the selection and configuration limits
        default: []
      - name: determination
        type: enum
        source: computed
        description: adjudication outcome
        default: null
        constraints: "one of {NO_DEFECT_FOUND, APPLICATION_ERROR, MANUFACTURING_DEFECT}"
      - name: months_since_ship
        type: integer
        source: computed
        description: whole months between PumpPackage.actual_ship_date and the logical clock at claim creation
        default: null
      - name: coverage_factor
        type: number
        source: computed
        description: warranty coverage fraction selected from COVERAGE_TIERS by months_since_ship
        default: null
      - name: settlement_subtotal
        type: number
        source: computed
        description: sum of per-line covered amounts, each rounded before summation
        default: null
      - name: admin_fee
        type: number
        source: computed
        description: administration fee charged on settlement_subtotal
        default: null
      - name: settlement_total
        type: number
        source: computed
        description: settlement_subtotal plus admin_fee
        default: null
      - name: status
        type: enum
        source: computed
        description: adjudication lifecycle state
        default: SUBMITTED
        constraints: "one of {SUBMITTED, UNDER_ADJUDICATION, INFO_REQUESTED, ADJUDICATED_NO_DEFECT, ADJUDICATED_APPLICATION_ERROR, ADJUDICATED_MANUFACTURING, SETTLED}"

state_machines:
  - entity: Foundry
    initial_state: ACTIVE
    terminal_states: [SUSPENDED]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /foundries/{id}/suspend"
        actor: PlatformAdmin
        preconditions:
          - "Foundry.status == ACTIVE"
        side_effects:
          - "sets Foundry.suspension_reason to the supplied reason"
          - "increments Foundry.version by 1"
        note: "A suspended foundry may no longer pour lots (validations priority 31); existing lots are untouched."

  - entity: PumpModel
    initial_state: ORDERABLE
    terminal_states: [SUPERSEDED]
    transitions:
      - from: ORDERABLE
        to: PATTERN_CONSTRAINED
        trigger: "system: cascade raised when a PatternAsset for this model leaves QUALIFIED (POST /casting-lots wear cascade, POST /casting-lots/{id}/defects CRITICAL wear cascade, or POST /pattern-assets/{id}/retire)"
        actor: system
        preconditions:
          - "count(PatternAsset WHERE pump_model_id == PumpModel.id AND status == QUALIFIED) == 0"
        side_effects:
          - "sets PumpModel.status to PATTERN_CONSTRAINED"
          - "increments PumpModel.version by 1"
        note: "Second hop of cascade C. New Selections against the model are rejected with ERR_MODEL_NOT_ORDERABLE."
      - from: PATTERN_CONSTRAINED
        to: ORDERABLE
        trigger: "system: cascade raised by POST /pattern-assets/{id}/refurbishment-complete"
        actor: system
        preconditions:
          - "count(PatternAsset WHERE pump_model_id == PumpModel.id AND status == QUALIFIED) >= 1"
        side_effects:
          - "sets PumpModel.status to ORDERABLE"
          - "increments PumpModel.version by 1"
      - from: ORDERABLE
        to: SUPERSEDED
        trigger: "POST /pump-models/{id}/supersede"
        actor: PlatformAdmin
        preconditions:
          - "PumpModel.status IN {ORDERABLE, PATTERN_CONSTRAINED}"
          - "the successor PumpModel named by superseded_by_model_id exists and its id != PumpModel.id"
        side_effects:
          - "sets PumpModel.superseded_by_model_id to the successor id"
          - "increments PumpModel.version by 1"
      - from: PATTERN_CONSTRAINED
        to: SUPERSEDED
        trigger: "POST /pump-models/{id}/supersede"
        actor: PlatformAdmin
        preconditions:
          - "PumpModel.status IN {ORDERABLE, PATTERN_CONSTRAINED}"
          - "the successor PumpModel named by superseded_by_model_id exists and its id != PumpModel.id"
        side_effects:
          - "sets PumpModel.superseded_by_model_id to the successor id"
          - "increments PumpModel.version by 1"

  - entity: PatternAsset
    initial_state: QUALIFIED
    terminal_states: [RETIRED]
    transitions:
      - from: QUALIFIED
        to: WORN
        trigger: "system: cascade raised by POST /casting-lots after calculations.pattern_wear_index is recomputed"
        actor: system
        preconditions:
          - "PatternAsset.status == QUALIFIED"
          - "PatternAsset.wear_index >= PatternAsset.wear_threshold"
        side_effects:
          - "sets PatternAsset.status to WORN"
          - "increments PatternAsset.version by 1"
          - "if no other PatternAsset for the same pump_model_id is QUALIFIED, drives PumpModel ORDERABLE -> PATTERN_CONSTRAINED (cascade C hop 2)"
        note: "First hop of cascade C. Fires on the same request that created the lot."
      - from: QUALIFIED
        to: WORN
        trigger: "system: cascade raised by POST /casting-lots/{id}/defects when severity == CRITICAL and the recomputed wear_index reaches the threshold"
        actor: system
        preconditions:
          - "PatternAsset.status == QUALIFIED"
          - "PatternAsset.wear_index >= PatternAsset.wear_threshold"
        side_effects:
          - "sets PatternAsset.status to WORN"
          - "increments PatternAsset.version by 1"
          - "if no other PatternAsset for the same pump_model_id is QUALIFIED, drives PumpModel ORDERABLE -> PATTERN_CONSTRAINED"
      - from: WORN
        to: IN_REFURB
        trigger: "POST /pattern-assets/{id}/refurbishment-start"
        actor: PlatformAdmin
        preconditions:
          - "PatternAsset.status == WORN"
          - "count(CastingLot WHERE pattern_asset_id == PatternAsset.id AND status IN {POURED, INSPECTED, REWORK, QUARANTINED}) == 0"
        side_effects:
          - "sets PatternAsset.status to IN_REFURB"
          - "increments PatternAsset.version by 1"
      - from: IN_REFURB
        to: QUALIFIED
        trigger: "POST /pattern-assets/{id}/refurbishment-complete"
        actor: PlatformAdmin
        preconditions:
          - "PatternAsset.status == IN_REFURB"
        side_effects:
          - "resets PatternAsset.pours_since_refurb to 0"
          - "resets PatternAsset.defect_pours_since_refurb to 0"
          - "resets PatternAsset.wear_index to 0"
          - "increments PatternAsset.refurb_cycles by 1"
          - "sets PatternAsset.status to QUALIFIED"
          - "increments PatternAsset.version by 1"
          - "drives PumpModel PATTERN_CONSTRAINED -> ORDERABLE when this is the model's only QUALIFIED pattern"
        note: "Closes the QUALIFIED -> WORN -> IN_REFURB -> QUALIFIED cycle and restarts the wear curve."
      - from: QUALIFIED
        to: RETIRED
        trigger: "POST /pattern-assets/{id}/retire"
        actor: PlatformAdmin
        preconditions:
          - "PatternAsset.status IN {QUALIFIED, WORN}"
          - "count(CastingLot WHERE pattern_asset_id == PatternAsset.id AND status IN {POURED, INSPECTED, REWORK, QUARANTINED}) == 0"
        side_effects:
          - "sets PatternAsset.status to RETIRED"
          - "increments PatternAsset.version by 1"
          - "drives PumpModel ORDERABLE -> PATTERN_CONSTRAINED when no QUALIFIED pattern remains for the model"
      - from: WORN
        to: RETIRED
        trigger: "POST /pattern-assets/{id}/retire"
        actor: PlatformAdmin
        preconditions:
          - "PatternAsset.status IN {QUALIFIED, WORN}"
          - "count(CastingLot WHERE pattern_asset_id == PatternAsset.id AND status IN {POURED, INSPECTED, REWORK, QUARANTINED}) == 0"
        side_effects:
          - "sets PatternAsset.status to RETIRED"
          - "increments PatternAsset.version by 1"

  - entity: DutyApplication
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: SELECTION_LOCKED
        trigger: "system: cascade raised by POST /selections/{id}/approve"
        actor: system
        preconditions:
          - "DutyApplication.status == OPEN"
        side_effects:
          - "sets DutyApplication.status to SELECTION_LOCKED"
          - "increments DutyApplication.version by 1"
      - from: SELECTION_LOCKED
        to: OPEN
        trigger: "system: cascade raised by POST /selections/{id}/supersede"
        actor: system
        preconditions:
          - "DutyApplication.status == SELECTION_LOCKED"
        side_effects:
          - "sets DutyApplication.status to OPEN"
          - "increments DutyApplication.version by 1"
        note: "Cycle: the enquiry returns to OPEN so a replacement Selection can be created."
      - from: SELECTION_LOCKED
        to: CONTRACTED
        trigger: "system: cascade raised by POST /build-orders"
        actor: system
        preconditions:
          - "DutyApplication.status == SELECTION_LOCKED"
        side_effects:
          - "sets DutyApplication.status to CONTRACTED"
          - "increments DutyApplication.version by 1"
      - from: CONTRACTED
        to: OPEN
        trigger: "system: cascade raised when the DutyApplication's Selection moves APPROVED -> UNDER_REVIEW"
        actor: system
        preconditions:
          - "DutyApplication.status == CONTRACTED"
        side_effects:
          - "sets DutyApplication.status to OPEN"
          - "increments DutyApplication.version by 1"
        note: "Third and final hop of cascade B."
      - from: CONTRACTED
        to: CLOSED
        trigger: "system: cascade raised by POST /pump-packages/{id}/ship"
        actor: system
        preconditions:
          - "DutyApplication.status == CONTRACTED"
        side_effects:
          - "sets DutyApplication.status to CLOSED"
          - "increments DutyApplication.version by 1"

  - entity: Selection
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: PROPOSED
        trigger: "POST /selections/{id}/propose"
        actor: ApplicationEngineer
        preconditions:
          - "Selection.status IN {DRAFT, UNDER_REVIEW}"
        side_effects:
          - "sets Selection.proposed_by_user_id to the request X-User-ID"
          - "increments Selection.version by 1"
      - from: PROPOSED
        to: DRAFT
        trigger: "POST /selections/{id}/revise"
        actor: ApplicationEngineer
        preconditions:
          - "Selection.status == PROPOSED"
        side_effects:
          - "clears Selection.proposed_by_user_id to null"
          - "increments Selection.version by 1"
        note: "Cycle DRAFT -> PROPOSED -> DRAFT; proposer identity is discarded so a different engineer may re-propose."
      - from: PROPOSED
        to: APPROVED
        trigger: "POST /selections/{id}/approve"
        actor: HydraulicApprover
        preconditions:
          - "Selection.status == PROPOSED"
          - "request X-User-ID != Selection.proposed_by_user_id (validations priority 7)"
          - "count(PatternAsset WHERE pump_model_id == Selection.pump_model_id AND status == QUALIFIED) >= 1 (validations priority 35)"
          - "Selection.npsh_margin_m >= MIN_NPSH_MARGIN_M (validations priority 58)"
        side_effects:
          - "sets Selection.approved_by_user_id to the request X-User-ID"
          - "drives DutyApplication OPEN -> SELECTION_LOCKED"
          - "increments Selection.version by 1"
      - from: APPROVED
        to: UNDER_REVIEW
        trigger: "system: cascade raised when a BuildOrder built to this Selection moves to REWORK_REQUIRED"
        actor: system
        preconditions:
          - "Selection.status == APPROVED"
        side_effects:
          - "sets Selection.status to UNDER_REVIEW"
          - "drives DutyApplication CONTRACTED -> OPEN (cascade B hop 3)"
          - "increments Selection.version by 1"
        note: "Second hop of cascade B."
      - from: UNDER_REVIEW
        to: PROPOSED
        trigger: "POST /selections/{id}/propose"
        actor: ApplicationEngineer
        preconditions:
          - "Selection.status IN {DRAFT, UNDER_REVIEW}"
        side_effects:
          - "sets Selection.proposed_by_user_id to the request X-User-ID"
          - "increments Selection.version by 1"
        note: "Closes the APPROVED -> UNDER_REVIEW -> PROPOSED -> APPROVED cycle."
      - from: APPROVED
        to: SUPERSEDED
        trigger: "POST /selections/{id}/supersede"
        actor: ApplicationEngineer
        preconditions:
          - "Selection.status == APPROVED"
          - "count(BuildOrder WHERE selection_id == Selection.id AND status != CLOSED) == 0"
        side_effects:
          - "sets Selection.status to SUPERSEDED"
          - "drives DutyApplication SELECTION_LOCKED -> OPEN"
          - "increments Selection.version by 1"

  - entity: CastingLot
    initial_state: POURED
    terminal_states: [SCRAPPED]
    transitions:
      - from: POURED
        to: INSPECTED
        trigger: "POST /casting-lots/{id}/inspect"
        actor: QualityInspector
        preconditions:
          - "CastingLot.status IN {POURED, REWORK}"
        side_effects:
          - "increments CastingLot.version by 1"
      - from: REWORK
        to: INSPECTED
        trigger: "POST /casting-lots/{id}/inspect"
        actor: QualityInspector
        preconditions:
          - "CastingLot.status IN {POURED, REWORK}"
        side_effects:
          - "increments CastingLot.version by 1"
        note: "Closes the ACCEPTED/INSPECTED -> QUARANTINED -> REWORK -> INSPECTED cycle."
      - from: INSPECTED
        to: ACCEPTED
        trigger: "POST /casting-lots/{id}/accept"
        actor: QualityInspector
        preconditions:
          - "CastingLot.status == INSPECTED"
          - "count(CastingDefect WHERE casting_lot_id == CastingLot.id AND status == REPORTED) == 0 (validations priority 77)"
          - "CastingLot.qty_accepted >= 1 (validations priority 78)"
        side_effects:
          - "increments CastingLot.version by 1"
      - from: ACCEPTED
        to: QUARANTINED
        trigger: "system: cascade raised by POST /casting-defects/{id}/disposition when the disposition is SCRAP or REPAIR_WELD"
        actor: system
        preconditions:
          - "CastingLot.status IN {INSPECTED, ACCEPTED}"
          - "CastingLot.qty_accepted < max(1, CastingLot.committed_build_count) after the ledger is reconciled"
        side_effects:
          - "sets CastingLot.status to QUARANTINED"
          - "increments CastingLot.version by 1"
          - "drives the newest bound non-terminal BuildOrder to CASTING_SHORT (cascade A hop 2)"
        note: "First hop of cascade A; the ledger reconciliation in calculations.casting_yield_ledger runs before this guard is evaluated."
      - from: INSPECTED
        to: QUARANTINED
        trigger: "system: cascade raised by POST /casting-defects/{id}/disposition when the disposition is SCRAP or REPAIR_WELD"
        actor: system
        preconditions:
          - "CastingLot.status IN {INSPECTED, ACCEPTED}"
          - "CastingLot.qty_accepted < max(1, CastingLot.committed_build_count) after the ledger is reconciled"
        side_effects:
          - "sets CastingLot.status to QUARANTINED"
          - "increments CastingLot.version by 1"
      - from: QUARANTINED
        to: REWORK
        trigger: "POST /casting-lots/{id}/rework-start"
        actor: QualityInspector
        preconditions:
          - "CastingLot.status == QUARANTINED"
        side_effects:
          - "increments CastingLot.version by 1"
      - from: QUARANTINED
        to: ACCEPTED
        trigger: "system: cascade raised by POST /casting-defects/{id}/repair-verified"
        actor: system
        preconditions:
          - "CastingLot.status == QUARANTINED"
          - "count(CastingDefect WHERE casting_lot_id == CastingLot.id AND status IN {REPORTED, DISPOSITIONED_REPAIR, DISPOSITIONED_SCRAP}) == 0"
          - "CastingLot.qty_accepted >= max(1, CastingLot.committed_build_count) after the ledger is reconciled"
        side_effects:
          - "sets CastingLot.status to ACCEPTED"
          - "increments CastingLot.version by 1"
        note: "Compensation path for the SCRAP -> REPAIR_WELD -> repair-verified round trip; restores the piece ledger to qty_accepted == qty_poured."
      - from: QUARANTINED
        to: SCRAPPED
        trigger: "POST /casting-lots/{id}/scrap-lot"
        actor: QualityInspector
        preconditions:
          - "CastingLot.status == QUARANTINED"
        side_effects:
          - "sets CastingLot.qty_scrapped to CastingLot.qty_poured"
          - "sets CastingLot.qty_rework_pending to 0"
          - "sets CastingLot.qty_accepted to 0"
          - "increments CastingLot.version by 1"

  - entity: CastingDefect
    initial_state: REPORTED
    terminal_states: [DISPOSITIONED_USE_AS_IS, REPAIR_VERIFIED]
    transitions:
      - from: REPORTED
        to: DISPOSITIONED_USE_AS_IS
        trigger: "POST /casting-defects/{id}/disposition with disposition == USE_AS_IS"
        actor: QualityInspector
        preconditions:
          - "CastingDefect.status == REPORTED"
          - "request X-User-ID != CastingDefect.reported_by_user_id (validations priority 8)"
        side_effects:
          - "sets CastingDefect.disposition to USE_AS_IS"
          - "sets CastingDefect.dispositioned_by_user_id to the request X-User-ID"
          - "leaves the CastingLot piece ledger unchanged"
          - "increments CastingDefect.version by 1"
      - from: REPORTED
        to: DISPOSITIONED_REPAIR
        trigger: "POST /casting-defects/{id}/disposition with disposition == REPAIR_WELD"
        actor: QualityInspector
        preconditions:
          - "CastingDefect.status == REPORTED"
        side_effects:
          - "sets CastingDefect.disposition to REPAIR_WELD"
          - "adds CastingDefect.affected_qty to CastingLot.qty_rework_pending and recomputes CastingLot.qty_accepted (calculations.casting_yield_ledger)"
          - "increments CastingLot.version by 1"
          - "may drive CastingLot INSPECTED/ACCEPTED -> QUARANTINED"
          - "increments CastingDefect.version by 1"
      - from: REPORTED
        to: DISPOSITIONED_SCRAP
        trigger: "POST /casting-defects/{id}/disposition with disposition == SCRAP"
        actor: QualityInspector
        preconditions:
          - "CastingDefect.status == REPORTED"
        side_effects:
          - "sets CastingDefect.disposition to SCRAP"
          - "adds CastingDefect.affected_qty to CastingLot.qty_scrapped and recomputes CastingLot.qty_accepted (calculations.casting_yield_ledger)"
          - "increments CastingLot.version by 1"
          - "may drive CastingLot INSPECTED/ACCEPTED -> QUARANTINED, which is the entry point of cascade A"
          - "increments CastingDefect.version by 1"
      - from: DISPOSITIONED_SCRAP
        to: DISPOSITIONED_REPAIR
        trigger: "POST /casting-defects/{id}/revise-disposition with disposition == REPAIR_WELD"
        actor: QualityInspector
        preconditions:
          - "CastingDefect.status == DISPOSITIONED_SCRAP"
        side_effects:
          - "subtracts CastingDefect.affected_qty from CastingLot.qty_scrapped"
          - "adds CastingDefect.affected_qty to CastingLot.qty_rework_pending"
          - "recomputes CastingLot.qty_accepted (calculations.casting_yield_ledger)"
          - "sets CastingDefect.disposition to REPAIR_WELD"
          - "increments CastingLot.version by 1"
          - "increments CastingDefect.version by 1"
        note: "Compensating step 1 of the casting-piece invariant round trip."
      - from: DISPOSITIONED_REPAIR
        to: REPAIR_VERIFIED
        trigger: "POST /casting-defects/{id}/repair-verified"
        actor: QualityInspector
        preconditions:
          - "CastingDefect.status == DISPOSITIONED_REPAIR"
        side_effects:
          - "subtracts CastingDefect.affected_qty from CastingLot.qty_rework_pending"
          - "recomputes CastingLot.qty_accepted (calculations.casting_yield_ledger)"
          - "increments CastingLot.version by 1"
          - "may drive CastingLot QUARANTINED -> ACCEPTED"
          - "increments CastingDefect.version by 1"
        note: "Compensating step 2; after this step qty_accepted + qty_rework_pending + qty_scrapped == qty_poured with qty_scrapped back at its pre-SCRAP value."

  - entity: BuildOrder
    initial_state: PLANNED
    terminal_states: [CLOSED]
    transitions:
      - from: PLANNED
        to: ASSEMBLED
        trigger: "POST /build-orders/{id}/assembly"
        actor: ProductionPlanner
        preconditions:
          - "BuildOrder.status == PLANNED"
          - "residual_unbalance_g_mm <= calculations.balance_allowance output (validations priority 59)"
          - "running_clearance_mm within the MaterialSealConfig clearance band (validations priority 60)"
          - "seal_flush_plan_installed == MaterialSealConfig.flush_plan (validations priority 61)"
        side_effects:
          - "stores running_clearance_mm, residual_unbalance_g_mm and seal_flush_plan_installed"
          - "sets BuildOrder.allowable_unbalance_g_mm from calculations.balance_allowance"
          - "increments BuildOrder.version by 1"
      - from: ASSEMBLED
        to: TESTED
        trigger: "system: cascade raised by POST /test-runs/{id}/certify"
        actor: system
        preconditions:
          - "BuildOrder.status == ASSEMBLED"
        side_effects:
          - "sets BuildOrder.status to TESTED"
          - "increments BuildOrder.version by 1"
      - from: ASSEMBLED
        to: REWORK_REQUIRED
        trigger: "system: cascade raised by POST /test-runs/{id}/evaluate when hydraulic_status becomes OUT_OF_TOLERANCE"
        actor: system
        preconditions:
          - "BuildOrder.status IN {ASSEMBLED, TESTED}"
        side_effects:
          - "sets BuildOrder.status to REWORK_REQUIRED"
          - "drives Selection APPROVED -> UNDER_REVIEW (cascade B hop 2)"
          - "increments BuildOrder.version by 1"
        note: "First hop of cascade B."
      - from: TESTED
        to: REWORK_REQUIRED
        trigger: "system: cascade raised by POST /test-runs/{id}/evaluate when hydraulic_status becomes OUT_OF_TOLERANCE"
        actor: system
        preconditions:
          - "BuildOrder.status IN {ASSEMBLED, TESTED}"
        side_effects:
          - "sets BuildOrder.status to REWORK_REQUIRED"
          - "drives Selection APPROVED -> UNDER_REVIEW"
          - "increments BuildOrder.version by 1"
      - from: REWORK_REQUIRED
        to: ASSEMBLED
        trigger: "POST /build-orders/{id}/rework-complete"
        actor: ProductionPlanner
        preconditions:
          - "BuildOrder.status == REWORK_REQUIRED"
          - "BuildOrder.rework_cycles < MAX_REWORK_CYCLES (validations priority 70)"
        side_effects:
          - "increments BuildOrder.rework_cycles by 1"
          - "increments BuildOrder.version by 1"
        note: "Closes the ASSEMBLED -> REWORK_REQUIRED -> ASSEMBLED cycle, bounded by MAX_REWORK_CYCLES."
      - from: ASSEMBLED
        to: CASTING_SHORT
        trigger: "system: cascade raised when the bound CastingLot moves to QUARANTINED and qty_accepted < committed_build_count"
        actor: system
        preconditions:
          - "BuildOrder.status IN {PLANNED, ASSEMBLED, TESTED, REWORK_REQUIRED}"
          - "BuildOrder is the newest such BuildOrder bound to the lot, ordered by created_at DESC"
        side_effects:
          - "sets BuildOrder.status to CASTING_SHORT"
          - "decrements CastingLot.committed_build_count by 1"
          - "drives the BuildOrder's non-terminal PumpPackage to HELD (cascade A hop 3)"
          - "increments BuildOrder.version by 1"
        note: "Second hop of cascade A."
      - from: PLANNED
        to: CASTING_SHORT
        trigger: "system: cascade raised when the bound CastingLot moves to QUARANTINED and qty_accepted < committed_build_count"
        actor: system
        preconditions:
          - "BuildOrder.status IN {PLANNED, ASSEMBLED, TESTED, REWORK_REQUIRED}"
          - "BuildOrder is the newest such BuildOrder bound to the lot, ordered by created_at DESC"
        side_effects:
          - "sets BuildOrder.status to CASTING_SHORT"
          - "decrements CastingLot.committed_build_count by 1"
          - "increments BuildOrder.version by 1"
      - from: TESTED
        to: CASTING_SHORT
        trigger: "system: cascade raised when the bound CastingLot moves to QUARANTINED and qty_accepted < committed_build_count"
        actor: system
        preconditions:
          - "BuildOrder.status IN {PLANNED, ASSEMBLED, TESTED, REWORK_REQUIRED}"
          - "BuildOrder is the newest such BuildOrder bound to the lot, ordered by created_at DESC"
        side_effects:
          - "sets BuildOrder.status to CASTING_SHORT"
          - "decrements CastingLot.committed_build_count by 1"
          - "drives the BuildOrder's non-terminal PumpPackage to HELD"
          - "increments BuildOrder.version by 1"
      - from: REWORK_REQUIRED
        to: CASTING_SHORT
        trigger: "system: cascade raised when the bound CastingLot moves to QUARANTINED and qty_accepted < committed_build_count"
        actor: system
        preconditions:
          - "BuildOrder.status IN {PLANNED, ASSEMBLED, TESTED, REWORK_REQUIRED}"
          - "BuildOrder is the newest such BuildOrder bound to the lot, ordered by created_at DESC"
        side_effects:
          - "sets BuildOrder.status to CASTING_SHORT"
          - "decrements CastingLot.committed_build_count by 1"
          - "increments BuildOrder.version by 1"
      - from: CASTING_SHORT
        to: PLANNED
        trigger: "POST /build-orders/{id}/reassign-lot"
        actor: ProductionPlanner
        preconditions:
          - "BuildOrder.status == CASTING_SHORT"
          - "the replacement CastingLot has status == ACCEPTED (validations priority 36)"
          - "the replacement CastingLot's PatternAsset.pump_model_id == Selection.pump_model_id (validations priority 43)"
        side_effects:
          - "sets BuildOrder.casting_lot_id to the replacement lot"
          - "increments the replacement CastingLot.committed_build_count by 1"
          - "resets BuildOrder.running_clearance_mm, residual_unbalance_g_mm, seal_flush_plan_installed and allowable_unbalance_g_mm to null"
          - "increments BuildOrder.version by 1"
      - from: TESTED
        to: CLOSED
        trigger: "system: cascade raised by POST /pump-packages/{id}/ship"
        actor: system
        preconditions:
          - "BuildOrder.status == TESTED"
        side_effects:
          - "sets BuildOrder.status to CLOSED"
          - "decrements CastingLot.committed_build_count by 1"
          - "increments BuildOrder.version by 1"

  - entity: TestRun
    initial_state: "OPEN (run_state) / NOT_EVALUATED (hydraulic_status) / NOT_VERIFIED (npsh_status)"
    terminal_states: [CERTIFIED]
    state_dimensions:
      run_state: "OPEN -> POINTS_LOCKED -> EVALUATED -> CERTIFIED, with EVALUATED -> OPEN reopen cycle"
      hydraulic_status: "NOT_EVALUATED -> WITHIN_TOLERANCE | OUT_OF_TOLERANCE, reset to NOT_EVALUATED on reopen"
      npsh_status: "NOT_VERIFIED -> VERIFIED | REJECTED, reset to NOT_VERIFIED on reopen"
    transitions:
      - dimension: run_state
        from: OPEN
        to: POINTS_LOCKED
        trigger: "POST /test-runs/{id}/lock"
        actor: TestEngineer
        preconditions:
          - "TestRun.run_state == OPEN"
          - "count(TestPoint WHERE test_run_id == TestRun.id) >= GRADE_TOLERANCES[test_grade].min_points (validations priority 62)"
          - "count(TestPoint WHERE test_run_id == TestRun.id AND is_npsh_point == true) == 1 (validations priority 63)"
        side_effects:
          - "increments TestRun.version by 1"
        note: "No further TestPoint rows may be added once locked."
      - dimension: run_state
        from: POINTS_LOCKED
        to: EVALUATED
        trigger: "POST /test-runs/{id}/evaluate"
        actor: TestEngineer
        preconditions:
          - "TestRun.run_state == POINTS_LOCKED"
          - "Selection.duty_flow_m3h is bracketed by the reported flow span (validations priority 64)"
        side_effects:
          - "runs calculations.certified_test_curve and stores speed_ratio, head_at_guarantee_m, power_at_guarantee_kw, efficiency_at_guarantee_pct, head_deviation_pct, efficiency_deviation_pct and npshr_tested_m"
          - "sets hydraulic_status to WITHIN_TOLERANCE or OUT_OF_TOLERANCE"
          - "sets npsh_status to VERIFIED or REJECTED"
          - "when hydraulic_status becomes OUT_OF_TOLERANCE, drives BuildOrder ASSEMBLED/TESTED -> REWORK_REQUIRED (cascade B hop 1)"
          - "increments TestRun.version by 1"
      - dimension: run_state
        from: EVALUATED
        to: CERTIFIED
        trigger: "POST /test-runs/{id}/certify"
        actor: TestEngineer
        preconditions:
          - "TestRun.run_state == EVALUATED"
          - "TestRun.hydraulic_status == WITHIN_TOLERANCE (validations priority 65)"
          - "TestRun.npsh_status == VERIFIED (validations priority 66)"
        side_effects:
          - "drives BuildOrder ASSEMBLED -> TESTED"
          - "increments TestRun.version by 1"
      - dimension: run_state
        from: EVALUATED
        to: OPEN
        trigger: "POST /test-runs/{id}/reopen"
        actor: TestEngineer
        preconditions:
          - "TestRun.run_state == EVALUATED"
        side_effects:
          - "resets hydraulic_status to NOT_EVALUATED"
          - "resets npsh_status to NOT_VERIFIED"
          - "clears speed_ratio, head_at_guarantee_m, power_at_guarantee_kw, efficiency_at_guarantee_pct, head_deviation_pct, efficiency_deviation_pct and npshr_tested_m to null"
          - "increments TestRun.version by 1"
        note: "Cycle OPEN -> POINTS_LOCKED -> EVALUATED -> OPEN; TestPoint rows already recorded are retained and new ones may be added."
      - dimension: hydraulic_status
        from: NOT_EVALUATED
        to: WITHIN_TOLERANCE
        trigger: "POST /test-runs/{id}/evaluate"
        actor: TestEngineer
        preconditions:
          - "head_deviation_pct >= -GRADE_TOLERANCES[test_grade].head_pct AND head_deviation_pct <= GRADE_TOLERANCES[test_grade].head_pct"
          - "efficiency_deviation_pct >= -GRADE_TOLERANCES[test_grade].efficiency_pct"
        side_effects:
          - "no cascade; the BuildOrder stays in its current state"
        note: "Independent of run_state and npsh_status - the three dimensions advance on the same request but their values are not derivable from one another."
      - dimension: hydraulic_status
        from: NOT_EVALUATED
        to: OUT_OF_TOLERANCE
        trigger: "POST /test-runs/{id}/evaluate"
        actor: TestEngineer
        preconditions:
          - "head_deviation_pct < -GRADE_TOLERANCES[test_grade].head_pct OR head_deviation_pct > GRADE_TOLERANCES[test_grade].head_pct OR efficiency_deviation_pct < -GRADE_TOLERANCES[test_grade].efficiency_pct"
        side_effects:
          - "drives BuildOrder ASSEMBLED/TESTED -> REWORK_REQUIRED"
      - dimension: npsh_status
        from: NOT_VERIFIED
        to: VERIFIED
        trigger: "POST /test-runs/{id}/evaluate"
        actor: TestEngineer
        preconditions:
          - "TestRun.npshr_tested_m <= Selection.npshr_catalog_m + NPSH_TEST_TOLERANCE_M"
        side_effects:
          - "no cascade"
      - dimension: npsh_status
        from: NOT_VERIFIED
        to: REJECTED
        trigger: "POST /test-runs/{id}/evaluate"
        actor: TestEngineer
        preconditions:
          - "TestRun.npshr_tested_m > Selection.npshr_catalog_m + NPSH_TEST_TOLERANCE_M"
        side_effects:
          - "no cascade; certification is blocked by validations priority 66"

  - entity: PumpPackage
    initial_state: CONFIGURED
    terminal_states: [SHIPPED]
    transitions:
      - from: CONFIGURED
        to: RELEASED
        trigger: "POST /pump-packages/{id}/release"
        actor: ProductionPlanner
        preconditions:
          - "PumpPackage.status == CONFIGURED"
          - "TestRun.run_state == CERTIFIED (validations priority 37)"
        side_effects:
          - "sets PumpPackage.guarantee_basis to CERTIFIED_CURVE when TestRun.witness_required == true, otherwise to SELECTION"
          - "increments PumpPackage.version by 1"
      - from: RELEASED
        to: SHIPPED
        trigger: "POST /pump-packages/{id}/ship"
        actor: ProductionPlanner
        preconditions:
          - "PumpPackage.status == RELEASED"
        side_effects:
          - "stores PumpPackage.actual_ship_date"
          - "drives BuildOrder TESTED -> CLOSED"
          - "drives DutyApplication CONTRACTED -> CLOSED"
          - "increments PumpPackage.version by 1"
      - from: CONFIGURED
        to: HELD
        trigger: "system: cascade raised when the PumpPackage's BuildOrder moves to CASTING_SHORT"
        actor: system
        preconditions:
          - "PumpPackage.status IN {CONFIGURED, RELEASED}"
        side_effects:
          - "sets PumpPackage.status to HELD"
          - "clears PumpPackage.promised_ship_date to null"
          - "releases every RESERVED KitAllocation on the same BuildOrder (cascade A hop 4)"
          - "increments PumpPackage.version by 1"
        note: "Third hop of cascade A."
      - from: RELEASED
        to: HELD
        trigger: "system: cascade raised when the PumpPackage's BuildOrder moves to CASTING_SHORT"
        actor: system
        preconditions:
          - "PumpPackage.status IN {CONFIGURED, RELEASED}"
        side_effects:
          - "sets PumpPackage.status to HELD"
          - "clears PumpPackage.promised_ship_date to null"
          - "releases every RESERVED KitAllocation on the same BuildOrder"
          - "increments PumpPackage.version by 1"
      - from: HELD
        to: CONFIGURED
        trigger: "POST /pump-packages/{id}/release-hold"
        actor: ProductionPlanner
        preconditions:
          - "PumpPackage.status == HELD"
          - "BuildOrder.status != CASTING_SHORT"
        side_effects:
          - "sets PumpPackage.status to CONFIGURED"
          - "increments PumpPackage.version by 1"
        note: "Cycle CONFIGURED -> HELD -> CONFIGURED; promised_ship_date stays null and must be reset by a new package if required."

  - entity: RepairKit
    initial_state: ACTIVE
    terminal_states: [DISCONTINUED]
    transitions:
      - from: ACTIVE
        to: DISCONTINUED
        trigger: "POST /repair-kits/{id}/discontinue"
        actor: PlatformAdmin
        preconditions:
          - "RepairKit.status == ACTIVE"
        side_effects:
          - "increments RepairKit.version by 1"
        note: "Existing allocations are unaffected; new allocations are rejected by validations priority 30."

  - entity: KitAllocation
    initial_state: RESERVED
    terminal_states: [CONSUMED, RELEASED]
    transitions:
      - from: RESERVED
        to: ISSUED
        trigger: "POST /kit-allocations/{id}/issue"
        actor: ProductionPlanner
        preconditions:
          - "KitAllocation.status == RESERVED"
        side_effects:
          - "subtracts requested_qty from RepairKit.qty_reserved"
          - "adds requested_qty to RepairKit.qty_issued"
          - "increments RepairKit.version by 1"
          - "increments KitAllocation.version by 1"
      - from: ISSUED
        to: CONSUMED
        trigger: "POST /kit-allocations/{id}/consume"
        actor: ProductionPlanner
        preconditions:
          - "KitAllocation.status == ISSUED"
        side_effects:
          - "subtracts requested_qty from RepairKit.qty_issued"
          - "adds requested_qty to RepairKit.qty_consumed_total"
          - "increments RepairKit.version by 1"
          - "increments KitAllocation.version by 1"
      - from: RESERVED
        to: RELEASED
        trigger: "POST /kit-allocations/{id}/release"
        actor: ProductionPlanner
        preconditions:
          - "KitAllocation.status == RESERVED"
        side_effects:
          - "subtracts requested_qty from RepairKit.qty_reserved"
          - "adds requested_qty to RepairKit.qty_on_hand"
          - "increments RepairKit.version by 1"
          - "increments KitAllocation.version by 1"
        note: "Compensating action for the reservation; restores RepairKit.qty_on_hand exactly."
      - from: RESERVED
        to: RELEASED
        trigger: "system: cascade raised when the allocation's BuildOrder PumpPackage moves to HELD"
        actor: system
        preconditions:
          - "KitAllocation.status == RESERVED"
        side_effects:
          - "subtracts requested_qty from RepairKit.qty_reserved"
          - "adds requested_qty to RepairKit.qty_on_hand"
          - "increments RepairKit.version by 1"
          - "increments KitAllocation.version by 1"
        note: "Fourth and final hop of cascade A."

  - entity: WarrantyClaim
    initial_state: SUBMITTED
    terminal_states: [ADJUDICATED_NO_DEFECT, ADJUDICATED_APPLICATION_ERROR, SETTLED]
    transitions:
      - from: SUBMITTED
        to: UNDER_ADJUDICATION
        trigger: "POST /warranty-claims/{id}/begin-adjudication"
        actor: WarrantyAdjudicator
        preconditions:
          - "WarrantyClaim.status == SUBMITTED"
        side_effects:
          - "increments WarrantyClaim.version by 1"
      - from: UNDER_ADJUDICATION
        to: INFO_REQUESTED
        trigger: "POST /warranty-claims/{id}/request-info"
        actor: WarrantyAdjudicator
        preconditions:
          - "WarrantyClaim.status == UNDER_ADJUDICATION"
        side_effects:
          - "stores WarrantyClaim.info_request_note"
          - "increments WarrantyClaim.version by 1"
      - from: INFO_REQUESTED
        to: UNDER_ADJUDICATION
        trigger: "POST /warranty-claims/{id}/resume-adjudication"
        actor: WarrantyAdjudicator
        preconditions:
          - "WarrantyClaim.status == INFO_REQUESTED"
        side_effects:
          - "clears WarrantyClaim.info_request_note to null"
          - "increments WarrantyClaim.version by 1"
        note: "Cycle UNDER_ADJUDICATION -> INFO_REQUESTED -> UNDER_ADJUDICATION, unbounded."
      - from: UNDER_ADJUDICATION
        to: ADJUDICATED_NO_DEFECT
        trigger: "POST /warranty-claims/{id}/adjudicate"
        actor: WarrantyAdjudicator
        preconditions:
          - "WarrantyClaim.status == UNDER_ADJUDICATION"
          - "request X-User-ID != WarrantyClaim.submitted_by_user_id (validations priority 9)"
          - "calculations.warranty_liability_determination yields determination == NO_DEFECT_FOUND"
        side_effects:
          - "stores liability_basis, expected_head_m, head_shortfall_pct, application_error_flags and determination"
          - "increments PumpModel.no_defect_count by 1"
          - "increments PumpModel.version by 1"
          - "leaves settlement_subtotal, admin_fee and settlement_total null"
          - "increments WarrantyClaim.version by 1"
        note: "Fork branch 1 of the adjudication diamond - divergent side-effect set."
      - from: UNDER_ADJUDICATION
        to: ADJUDICATED_APPLICATION_ERROR
        trigger: "POST /warranty-claims/{id}/adjudicate"
        actor: WarrantyAdjudicator
        preconditions:
          - "WarrantyClaim.status == UNDER_ADJUDICATION"
          - "request X-User-ID != WarrantyClaim.submitted_by_user_id (validations priority 9)"
          - "calculations.warranty_liability_determination yields determination == APPLICATION_ERROR"
        side_effects:
          - "stores liability_basis, expected_head_m, head_shortfall_pct, application_error_flags and determination"
          - "sets PumpPackage.application_error_flagged to true"
          - "increments PumpPackage.version by 1"
          - "increments PumpModel.application_error_count by 1"
          - "increments PumpModel.version by 1"
          - "leaves settlement_subtotal, admin_fee and settlement_total null"
          - "increments WarrantyClaim.version by 1"
        note: "Fork branch 2 - the only branch that mutates the PumpPackage."
      - from: UNDER_ADJUDICATION
        to: ADJUDICATED_MANUFACTURING
        trigger: "POST /warranty-claims/{id}/adjudicate"
        actor: WarrantyAdjudicator
        preconditions:
          - "WarrantyClaim.status == UNDER_ADJUDICATION"
          - "request X-User-ID != WarrantyClaim.submitted_by_user_id (validations priority 9)"
          - "calculations.warranty_liability_determination yields determination == MANUFACTURING_DEFECT"
        side_effects:
          - "stores liability_basis, expected_head_m, head_shortfall_pct, application_error_flags and determination"
          - "increments PumpModel.warranty_defect_count by 1"
          - "increments PumpModel.version by 1"
          - "increments WarrantyClaim.version by 1"
        note: "Fork branch 3 - the only branch that can proceed to SETTLED."
      - from: ADJUDICATED_MANUFACTURING
        to: SETTLED
        trigger: "POST /warranty-claims/{id}/settle"
        actor: WarrantyAdjudicator
        preconditions:
          - "WarrantyClaim.status == ADJUDICATED_MANUFACTURING"
        side_effects:
          - "runs calculations.warranty_settlement_amount and stores months_since_ship, coverage_factor, settlement_subtotal, admin_fee and settlement_total"
          - "increments WarrantyClaim.version by 1"

concurrency_rules:
  - rule_id: selection-create-stale-duty
    parent_entity: DutyApplication
    write_endpoint: "POST /selections"
    occ_field: "expected_duty_application_version"
    description: |
      Creating a Selection against a DutyApplication whose version has advanced since
      the client last read it is rejected. A DutyApplication legitimately accepts more
      than one Selection over its life (the enquiry returns to OPEN whenever an approved
      selection is superseded or a build order is sent back for review), so a second
      create is not blocked by any state precondition; the stale-version check is what
      makes the writer's view of the enquiry explicit.
    error_id: ERR_STALE_DUTY_APPLICATION_VERSION
    http_status: 412

  - rule_id: kit-allocation-stale-kit
    parent_entity: RepairKit
    write_endpoint: "POST /kit-allocations"
    occ_field: "expected_repair_kit_version"
    description: |
      Reserving units from a RepairKit whose version has advanced since the client last
      read its stock counters is rejected. A RepairKit legitimately serves an unbounded
      number of allocations, so a second reservation is not blocked by any state
      precondition; the stale-version check forces the writer to re-read the counters
      that receipts, issues, consumptions and cascaded releases have moved.
    error_id: ERR_STALE_REPAIR_KIT_VERSION
    http_status: 412

calculations:
  - name: impeller_trim_and_head_prediction
    trigger: "POST /selections (runs before any business validation on the computed geometry)"
    algorithm: constraint_propagation
    formula: |
      # All PumpModel fields are read from the model named by Selection.pump_model_id.
      # All duty fields are read from the DutyApplication named by Selection.duty_application_id.
      K = (shutoff_head_m - bep_head_m) / (bep_flow_m3h ** 2)          # parabolic curve constant, NOT rounded
      r_exact = sqrt((duty_head_m + K * (duty_flow_m3h ** 2)) / shutoff_head_m)
      trimmed_impeller_diameter_mm = ROUND_HALF_UP(r_exact * max_impeller_diameter_mm, 1)
      diameter_ratio = trimmed_impeller_diameter_mm / max_impeller_diameter_mm   # recomputed from the ROUNDED diameter, NOT r_exact
      predicted_head_m = ROUND_HALF_UP((diameter_ratio ** 2) * shutoff_head_m - K * (duty_flow_m3h ** 2), 2)
      # Envelope gates (validations priority 56, 57) read trimmed_impeller_diameter_mm, not r_exact.
    input_set: "exactly one PumpModel (Selection.pump_model_id, status must be ORDERABLE) and exactly one DutyApplication (Selection.duty_application_id, status must be OPEN); no aggregation over other rows"
    constants: {}
    precision: "trimmed_impeller_diameter_mm 1 decimal round_half_up; diameter_ratio unrounded; predicted_head_m 2 decimals round_half_up"
    note: |
      Evaluation order is pinned: the diameter is rounded to one decimal FIRST and every
      downstream value (diameter_ratio, predicted_head_m, predicted_efficiency_pct,
      npshr_catalog_m, warranty selection-basis head) is derived from that rounded
      diameter. Deriving predicted_head_m from r_exact instead returns duty_head_m
      exactly and hides the trim-rounding step.

  - name: predicted_efficiency
    trigger: "POST /selections, immediately after impeller_trim_and_head_prediction"
    algorithm: weighted_scoring
    formula: |
      trimmed_bep_flow = bep_flow_m3h * diameter_ratio                  # unrounded
      flow_ratio = duty_flow_m3h / trimmed_bep_flow                     # unrounded
      off_bep_penalty  = min(OFF_BEP_PENALTY_CAP, OFF_BEP_PENALTY_COEFF * ((1 - flow_ratio) ** 2))
      trim_penalty     = max(0.0, (1 - diameter_ratio) * 100 * TRIM_PENALTY_COEFF)
      viscosity_factor = VISCOSITY_FACTORS tier selected by DutyApplication.viscosity_cst
      abrasive_penalty = 0.0                                            if MaterialSealConfig.service_class IN {CLEAN, CORROSIVE}
                       = 2.5 + 0.30 * DutyApplication.solids_pct        if service_class == ABRASIVE
                       = 3.5 + 0.30 * DutyApplication.solids_pct        if service_class == CORROSIVE_ABRASIVE
      predicted_efficiency_pct = ROUND_HALF_UP(
          max(EFFICIENCY_FLOOR_PCT,
              (bep_efficiency_pct - off_bep_penalty - trim_penalty - abrasive_penalty) * viscosity_factor), 2)
      predicted_shaft_power_kw = ROUND_HALF_UP(
          specific_gravity * duty_flow_m3h * predicted_head_m * HYDRAULIC_POWER_COEFF
          / (predicted_efficiency_pct / 100), 2)
      min_motor_kw = ROUND_HALF_UP(predicted_shaft_power_kw * MOTOR_MARGIN, 2)
    input_set: "the one PumpModel, the one DutyApplication and the one MaterialSealConfig named on the Selection; the MaterialSealConfig must have pump_model_id == Selection.pump_model_id (validations priority 42)"
    constants:
      OFF_BEP_PENALTY_CAP: 12.0
      OFF_BEP_PENALTY_COEFF: 40.0
      TRIM_PENALTY_COEFF: 0.45
      EFFICIENCY_FLOOR_PCT: 20.0
      HYDRAULIC_POWER_COEFF: 0.00272407
      MOTOR_MARGIN: 1.10
      VISCOSITY_FACTORS: "viscosity_cst <= 20 -> 1.00; <= 100 -> 0.94; <= 400 -> 0.86; > 400 -> 0.74"
      ABRASIVE_PENALTY_PER_SOLIDS_PCT: 0.30
    precision: "predicted_efficiency_pct, predicted_shaft_power_kw and min_motor_kw all 2 decimals round_half_up; every intermediate penalty and factor unrounded"
    note: |
      Combinatorial mode (a): four interacting inputs (flow ratio, trim ratio, viscosity,
      service class + solids), a capped quadratic penalty, a tier-selected multiplicative
      factor and a floor. The multiplicative viscosity_factor is applied to the SUM of the
      subtractive penalties, not to bep_efficiency_pct alone; applying it before the
      subtraction changes the result.

  - name: npsh_certification_margin
    trigger: "POST /selections, immediately after predicted_efficiency"
    algorithm: threshold
    formula: |
      # Pinned evaluation order breaks the apparent circularity between the margin and the
      # safety factor: the TIER is chosen from the PROVISIONAL margin (catalogue NPSHr),
      # and the reported margin is then recomputed from the CERTIFIED NPSHr.
      # 1. npshr_catalog_m          = ROUND_HALF_UP(npshr_at_bep_m * (flow_ratio ** NPSHR_FLOW_EXPONENT), 2)
      # 2. npsh_provisional_margin_m = ROUND_HALF_UP(npsha_available_m - npshr_catalog_m, 2)
      # 3. npsh_safety_factor        = NPSH_SAFETY_TIERS tier selected by npsh_provisional_margin_m
      # 4. npshr_certified_m         = ROUND_HALF_UP(npshr_catalog_m * npsh_safety_factor, 2)
      # 5. npsh_margin_m             = ROUND_HALF_UP(npsha_available_m - npshr_certified_m, 2)
      # Selecting the tier from step 5's value instead of step 2's is the trap; the tier
      # boundaries are deliberately close enough that the two orders disagree.
    input_set: "the one PumpModel and the one DutyApplication named on the Selection; flow_ratio is reused verbatim from predicted_efficiency"
    constants:
      NPSHR_FLOW_EXPONENT: 1.6
      NPSH_SAFETY_TIERS: "provisional margin < 0.5 -> 1.35; < 1.5 -> 1.25; < 3.0 -> 1.15; >= 3.0 -> 1.10"
      MIN_NPSH_MARGIN_M: 0.60
    precision: "npshr_catalog_m, npsh_provisional_margin_m, npshr_certified_m and npsh_margin_m all 2 decimals round_half_up; npsh_safety_factor is an exact tier constant"
    note: |
      Combinatorial mode (c). npsh_margin_m is gated at approval, not at creation:
      POST /selections/{id}/approve rejects npsh_margin_m < MIN_NPSH_MARGIN_M with
      ERR_NPSH_MARGIN_INSUFFICIENT. The comparison is inclusive, so a margin of exactly
      0.60 approves.

  - name: balance_allowance
    trigger: "POST /build-orders/{id}/assembly"
    algorithm: threshold
    formula: |
      G = BALANCE_GRADE_G[PumpModel.balance_grade]
      allowable_unbalance_g_mm = ROUND_HALF_UP(G * ISO1940_COEFF * rotor_mass_kg / rated_speed_rpm, 2)
      # acceptance is inclusive: residual_unbalance_g_mm <= allowable_unbalance_g_mm passes
      clearance_low  = MaterialSealConfig.min_running_clearance_mm
      clearance_high = ROUND_HALF_UP(MaterialSealConfig.min_running_clearance_mm + CLEARANCE_BAND_WIDTH_MM, 2)
      # acceptance is inclusive on BOTH ends: clearance_low <= running_clearance_mm <= clearance_high
    input_set: "the PumpModel reached through BuildOrder.selection_id -> Selection.pump_model_id, and the MaterialSealConfig reached through BuildOrder.selection_id -> Selection.material_seal_config_id"
    constants:
      BALANCE_GRADE_G: "{ G1_0: 1.0, G2_5: 2.5, G6_3: 6.3 }"
      ISO1940_COEFF: 9549
      CLEARANCE_BAND_WIDTH_MM: 0.15
    precision: "allowable_unbalance_g_mm and clearance_high 2 decimals round_half_up"

  - name: casting_yield_ledger
    trigger: "POST /casting-defects/{id}/disposition, POST /casting-defects/{id}/revise-disposition, POST /casting-defects/{id}/repair-verified, POST /casting-lots/{id}/scrap-lot"
    algorithm: aggregation
    formula: |
      qty_scrapped       = sum(CastingDefect.affected_qty WHERE casting_lot_id == lot.id AND status == DISPOSITIONED_SCRAP)
      qty_rework_pending = sum(CastingDefect.affected_qty WHERE casting_lot_id == lot.id AND status == DISPOSITIONED_REPAIR)
      qty_accepted       = qty_poured - qty_scrapped - qty_rework_pending
      # Defects in status REPORTED, DISPOSITIONED_USE_AS_IS and REPAIR_VERIFIED contribute 0.
      # Conserved quantity (invariant, checked after every one of the four triggers):
      #   qty_poured == qty_accepted + qty_rework_pending + qty_scrapped
      committed_build_count = count(BuildOrder WHERE casting_lot_id == lot.id AND status NOT IN {CLOSED, CASTING_SHORT})
    input_set: "all CastingDefect rows whose casting_lot_id == lot.id, filtered by the status enum listed above; ordering is irrelevant because the ledger is a full recompute, not an increment"
    constants: {}
    precision: "integer arithmetic only; no rounding"
    note: |
      Full recompute (not incremental) is pinned so that the revise-disposition
      compensation cannot leave drift: moving a defect from DISPOSITIONED_SCRAP to
      DISPOSITIONED_REPAIR moves the same affected_qty from one sum to the other, and
      repair-verified drops it from both.

  - name: pattern_wear_index
    trigger: "POST /casting-lots (pour counter) and POST /casting-lots/{id}/defects with severity == CRITICAL (defect counter)"
    algorithm: decay_function
    formula: |
      # On POST /casting-lots:
      pours_since_refurb = pours_since_refurb + 1
      # On the FIRST CRITICAL CastingDefect reported against a lot poured from this pattern
      # since the last completed refurbishment (subsequent CRITICAL defects on the SAME lot
      # do not count again):
      defect_pours_since_refurb = defect_pours_since_refurb + 1
      # After either counter moves:
      wear_index = pours_since_refurb + PATTERN_DEFECT_WEIGHT * defect_pours_since_refurb
      # PatternAsset moves QUALIFIED -> WORN when wear_index >= wear_threshold (inclusive).
      # POST /pattern-assets/{id}/refurbishment-complete resets all three counters to 0
      # and increments refurb_cycles, restarting the curve.
    input_set: "CastingLot rows with pattern_asset_id == pattern.id and created_at >= the pattern's last refurbishment-complete timestamp; CastingDefect rows with severity == CRITICAL on those lots"
    constants:
      PATTERN_DEFECT_WEIGHT: 2
    precision: "integer arithmetic only"

  - name: certified_test_curve
    trigger: "POST /test-runs/{id}/evaluate"
    algorithm: interval_merge
    formula: |
      n = rated_speed_rpm / test_speed_rpm   under RATED_SPEED_CORRECTED
      n = 1                                  under AS_TESTED
      speed_ratio = ROUND_HALF_UP(n, 4)      # stored value; the reported point set below uses the UNROUNDED n
      # Reported point set, built from every TestPoint of the run:
      #   reported_flow  = ROUND_HALF_UP(measured_flow_m3h  * n,      2)
      #   reported_head  = ROUND_HALF_UP(measured_head_m    * n ** 2, 2)
      #   reported_power = ROUND_HALF_UP(measured_power_kw   * n ** 3, 2)
      #   reported_npsh3 = ROUND_HALF_UP(measured_npsh3_m    * n ** 2, 2)   # only on the is_npsh_point row
      # Points are sorted by reported_flow ASC; ties on reported_flow are ordered by
      # TestPoint.created_at ASC.
      Q_g = DutyApplication.duty_flow_m3h        (reached through BuildOrder -> Selection -> DutyApplication)
      # Q_g must satisfy min(reported_flow) <= Q_g <= max(reported_flow) (validations priority 64).
      # Linear interpolation on the single bracketing segment [lo, hi] with lo.reported_flow <= Q_g <= hi.reported_flow;
      # when Q_g coincides with a point, that point's values are used verbatim.
      f = (Q_g - lo.reported_flow) / (hi.reported_flow - lo.reported_flow)
      head_at_guarantee_m       = ROUND_HALF_UP(lo.reported_head  + f * (hi.reported_head  - lo.reported_head),  2)
      power_at_guarantee_kw     = ROUND_HALF_UP(lo.reported_power + f * (hi.reported_power - lo.reported_power), 2)
      efficiency_at_guarantee_pct = ROUND_HALF_UP(
          DutyApplication.specific_gravity * Q_g * head_at_guarantee_m * HYDRAULIC_POWER_COEFF
          / power_at_guarantee_kw * 100, 2)
      head_deviation_pct       = ROUND_HALF_UP((head_at_guarantee_m - Selection.predicted_head_m) / Selection.predicted_head_m * 100, 2)
      efficiency_deviation_pct = ROUND_HALF_UP((efficiency_at_guarantee_pct - Selection.predicted_efficiency_pct) / Selection.predicted_efficiency_pct * 100, 2)
      npshr_tested_m           = reported_npsh3 of the single TestPoint with is_npsh_point == true
      # hydraulic_status = WITHIN_TOLERANCE iff
      #   -GRADE_TOLERANCES[test_grade].head_pct <= head_deviation_pct <= +GRADE_TOLERANCES[test_grade].head_pct
      #   AND efficiency_deviation_pct >= -GRADE_TOLERANCES[test_grade].efficiency_pct
      #   (both comparisons inclusive; positive efficiency deviation is never a failure)
      # npsh_status = VERIFIED iff npshr_tested_m <= Selection.npshr_catalog_m + NPSH_TEST_TOLERANCE_M (inclusive)
    input_set: "every TestPoint row with test_run_id == run.id, no status filter (TestPoint is immutable and append-only, and the run must be POINTS_LOCKED so the set is frozen); the Selection and DutyApplication reached through TestRun.build_order_id -> BuildOrder.selection_id"
    constants:
      HYDRAULIC_POWER_COEFF: 0.00272407
      NPSH_TEST_TOLERANCE_M: 0.30
      GRADE_TOLERANCES: "{ GRADE_1B: { head_pct: 3.0, efficiency_pct: 3.0, min_points: 5 }, GRADE_2B: { head_pct: 5.0, efficiency_pct: 5.0, min_points: 5 }, GRADE_3B: { head_pct: 7.0, efficiency_pct: 7.0, min_points: 3 } }"
    precision: "every reported point value and every guarantee-point value 2 decimals round_half_up; the interpolation fraction f is unrounded; interpolation runs on the ALREADY-ROUNDED reported point values"
    variants:
      - name: AS_TESTED
        when: "TestRun.correction_basis == AS_TESTED"
        difference: "speed_ratio is forced to exactly 1, so measured flow, head, power and npsh3 are reported unchanged even when test_speed_rpm differs from PumpModel.rated_speed_rpm; the guarantee point is interpolated on the raw measured curve"
      - name: RATED_SPEED_CORRECTED
        when: "TestRun.correction_basis == RATED_SPEED_CORRECTED"
        difference: "speed_ratio is rated_speed_rpm / test_speed_rpm and the affinity laws Q ~ n, H ~ n^2, P ~ n^3, NPSH3 ~ n^2 are applied to every point before sorting and interpolation; on an under-speed test this shifts the whole curve up and right, so head_deviation_pct can land inside the grade tolerance for the identical measured points that fail under AS_TESTED"

  - name: warranty_liability_determination
    trigger: "POST /warranty-claims/{id}/adjudicate"
    algorithm: projection
    formula: |
      liability_basis = PumpPackage.guarantee_basis        # fixed at package release from TestRun.witness_required
      expected_head_m = (see variants below, evaluated at WarrantyClaim.as_found_flow_m3h)
      head_shortfall_pct = ROUND_HALF_UP((as_found_head_m - expected_head_m) / expected_head_m * 100, 2)
      # application_error_flags is built in this exact order (the order is observable):
      #   1. "SOLIDS_EXCEEDS_CONFIG"      if as_found_solids_pct     >  MaterialSealConfig.max_solids_pct
      #   2. "VISCOSITY_EXCEEDS_CONFIG"   if as_found_viscosity_cst  >  MaterialSealConfig.max_viscosity_cst
      #   3. "NPSHA_BELOW_CERTIFIED"      if as_found_npsha_m        <  Selection.npshr_certified_m + MIN_NPSH_MARGIN_M
      #   4. "SPEED_ABOVE_RATED"          if as_found_speed_rpm      >  PumpModel.rated_speed_rpm
      # determination, evaluated top to bottom, first match wins:
      #   NO_DEFECT_FOUND      if head_shortfall_pct >= -GRADE_TOLERANCES[TestRun.test_grade].head_pct
      #   APPLICATION_ERROR    if application_error_flags is non-empty
      #   MANUFACTURING_DEFECT otherwise
    input_set: "the one PumpPackage named on the claim (status must be SHIPPED), its TestRun and every TestPoint of that run, and the Selection, MaterialSealConfig, DutyApplication and PumpModel reached through PumpPackage.build_order_id -> BuildOrder.selection_id"
    constants:
      MIN_NPSH_MARGIN_M: 0.60
    precision: "expected_head_m and head_shortfall_pct 2 decimals round_half_up"
    variants:
      - name: CERTIFIED_CURVE_BASIS
        when: "PumpPackage.guarantee_basis == CERTIFIED_CURVE, i.e. the package shipped against a witnessed test (TestRun.witness_required == true at release)"
        difference: "expected_head_m is interpolated from the TestRun's reported point set (built with the run's own correction_basis, exactly as calculations.certified_test_curve builds it) at as_found_flow_m3h; the promise is the measured machine"
      - name: SELECTION_BASIS
        when: "PumpPackage.guarantee_basis == SELECTION, i.e. the package shipped against an unwitnessed production test (TestRun.witness_required == false at release)"
        difference: "expected_head_m = ROUND_HALF_UP((Selection.diameter_ratio ** 2) * PumpModel.shutoff_head_m - K * (as_found_flow_m3h ** 2), 2) with K = (shutoff_head_m - bep_head_m) / bep_flow_m3h ** 2; the promise is the catalogue trim curve. The two bases disagree away from the duty point, so identical field data can yield NO_DEFECT_FOUND on one basis and MANUFACTURING_DEFECT on the other"

  - name: warranty_settlement_amount
    trigger: "POST /warranty-claims/{id}/settle"
    algorithm: tiered_pricing
    formula: |
      months_since_ship = number of WHOLE months from PumpPackage.actual_ship_date to the logical
                          clock at claim creation (floor; a partial month does not count).
                          Stored on the claim at POST /warranty-claims time, NOT re-read at settle.
      coverage_factor   = COVERAGE_TIERS tier selected by months_since_ship
      # Rounding order is PINNED: round each line, THEN sum. Summing gross first and
      # rounding once produces a different total.
      for each element of WarrantyClaim.claim_lines, in the order supplied in the request:
          line_settlement = ROUND_HALF_UP(gross_amount * coverage_factor, 2)
      settlement_subtotal = ROUND_HALF_UP(sum(line_settlement over all lines), 2)
      admin_fee           = ROUND_HALF_UP(settlement_subtotal * ADMIN_RATE, 2)
      settlement_total    = ROUND_HALF_UP(settlement_subtotal + admin_fee, 2)
    input_set: "every element of WarrantyClaim.claim_lines (no filtering; the array is immutable input) and the PumpPackage named on the claim"
    constants:
      COVERAGE_TIERS: "months_since_ship <= 12 -> 1.00; <= 24 -> 0.60; <= 36 -> 0.30"
      WARRANTY_MONTHS: 36
      ADMIN_RATE: 0.075
    precision: "2 decimals round_half_up at every step; per-line rounding happens BEFORE summation"
    note: |
      Combinatorial mode (b). months_since_ship > WARRANTY_MONTHS is rejected at claim
      creation with ERR_WARRANTY_EXPIRED (validations priority 75), so no coverage tier
      of 0 is ever reachable.

  - name: kit_interchange_resolution
    trigger: "POST /build-orders/{id}/kit-allocations/auto"
    algorithm: topological
    formula: |
      model = PumpModel reached through BuildOrder.selection_id -> Selection.pump_model_id
      # (a) eligibility filter - candidate set is every RepairKit satisfying ALL of:
      #       status == ACTIVE
      #       interchange_group == model.interchange_group
      #       gen_min <= model.generation <= gen_max
      #       support_window_start <= logical_clock < support_window_end     # half-open
      #       qty_on_hand >= requested_qty
      # (b) ranking expression, applied in this order:
      #       1. exact_preference DESC, where exact_preference = 1 when preferred_generation == model.generation else 0
      #       2. substitution_penalty_pct ASC
      #       3. unit_price ASC
      # (c) tie-break when 1-3 all tie: created_at ASC
      # (d) empty candidate set: reject with ERR_NO_INTERCHANGEABLE_KIT (validations priority 74)
      # The winner's id becomes KitAllocation.repair_kit_id and selected_by is set to SELECTOR.
    input_set: "every RepairKit row passing the eligibility filter above; no other rows participate"
    constants: {}
    precision: "not applicable; selection only"
    note: "RepairKit.id never participates in eligibility, ranking or tie-break; created_at ASC is the only fallback."

  - name: kit_allocation_charge
    trigger: "POST /kit-allocations and POST /build-orders/{id}/kit-allocations/auto"
    algorithm: tiered_pricing
    formula: |
      model = PumpModel reached through BuildOrder.selection_id -> Selection.pump_model_id
      substitution_penalty_applied_pct = RepairKit.substitution_penalty_pct
          if RepairKit.preferred_generation != model.generation else 0
      parts_extended = ROUND_HALF_UP(requested_qty * RepairKit.unit_price
                                     * (1 + substitution_penalty_applied_pct / 100), 2)
      handling_rate  = HANDLING_TIERS tier selected by parts_extended     # NOT by total_charge
      handling_fee   = ROUND_HALF_UP(parts_extended * handling_rate, 2)
      total_charge   = ROUND_HALF_UP(parts_extended + handling_fee, 2)
      # Side effects on the parent RepairKit:
      #   qty_on_hand  -= requested_qty
      #   qty_reserved += requested_qty
      # Conserved quantity (invariant, checked after every allocation transition):
      #   qty_on_hand + qty_reserved + qty_issued + qty_consumed_total == qty_received_total
    input_set: "the one RepairKit named explicitly (POST /kit-allocations) or chosen by kit_interchange_resolution (auto), plus the PumpModel reached through the BuildOrder"
    constants:
      HANDLING_TIERS: "parts_extended <= 1000 -> 0.12; <= 5000 -> 0.08; <= 20000 -> 0.05; > 20000 -> 0.03"
    precision: "parts_extended, handling_fee and total_charge 2 decimals round_half_up"
    note: |
      The tier is keyed on parts_extended, i.e. AFTER the substitution penalty but BEFORE
      the handling fee. Keying it on total_charge (or on the pre-penalty extended value)
      selects a different tier at the 5000 boundary.

  - name: pump_package_motor_requirement
    trigger: "POST /pump-packages"
    algorithm: threshold
    formula: |
      # The reference power depends on which curve the package will ship against, which is
      # itself determined by the run's witness flag - so the requirement is fixed at package
      # creation from the TestRun named in the request:
      min_motor_kw = ROUND_HALF_UP(TestRun.power_at_guarantee_kw * MOTOR_MARGIN, 2)   if TestRun.witness_required == true
                   = ROUND_HALF_UP(Selection.predicted_shaft_power_kw * MOTOR_MARGIN, 2) if TestRun.witness_required == false
      # motor_kw >= min_motor_kw is enforced inclusively (validations priority 80).
    input_set: "the one TestRun named in the request (run_state must already be EVALUATED or CERTIFIED so power_at_guarantee_kw is populated) and the Selection reached through BuildOrder.selection_id"
    constants:
      MOTOR_MARGIN: 1.10
    precision: "min_motor_kw 2 decimals round_half_up"

validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are present and X-User-Role is one of the eight declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "the acting role appears in the called endpoint's roles list"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: business_constraint
    check: "request body carries every required input field of the endpoint, no unknown fields, types and enum members valid, numeric constraints in the entity table respected, EXCEPT the strictly-positive quantity fields requested_qty, qty_poured, affected_qty and qty, whose lower bound is deferred to priorities 12 and 13 so that a zero quantity yields ERR_ZERO_QUANTITY rather than ERR_INVALID_REQUEST"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all"
  - priority: 4
    category: existence
    check: "every path-addressed resource exists, validated left to right in the path"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with a templated path segment"
  - priority: 5
    category: existence
    check: "every foreign key supplied in the request body resolves to an existing row, validated in the order the fields are declared in the endpoint's input list"
    error_id: ERR_REFERENCED_RESOURCE_NOT_FOUND
    http_status: 404
    applies_to: "POST /pattern-assets, POST /material-seal-configs, POST /selections, POST /casting-lots, POST /build-orders, POST /build-orders/{id}/reassign-lot, POST /test-runs, POST /pump-packages, POST /repair-kits, POST /kit-allocations, POST /warranty-claims, POST /pump-models/{id}/supersede"
  - priority: 6
    category: auth
    check: "when X-User-Role is FoundryPartner, X-User-ID equals the foundry_id supplied in the request body"
    error_id: ERR_FOUNDRY_SCOPE_VIOLATION
    http_status: 403
    applies_to: "POST /casting-lots"
  - priority: 7
    category: auth
    check: "the approving X-User-ID differs from Selection.proposed_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 409
    applies_to: "POST /selections/{id}/approve"
  - priority: 8
    category: auth
    check: "when disposition == USE_AS_IS, the acting X-User-ID differs from CastingDefect.reported_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 409
    applies_to: "POST /casting-defects/{id}/disposition"
  - priority: 9
    category: auth
    check: "the adjudicating X-User-ID differs from WarrantyClaim.submitted_by_user_id"
    error_id: ERR_ADJUDICATOR_CONFLICT
    http_status: 409
    applies_to: "POST /warranty-claims/{id}/adjudicate"
  - priority: 10
    category: state
    check: "expected_duty_application_version equals the current DutyApplication.version (concurrency_rules[selection-create-stale-duty])"
    error_id: ERR_STALE_DUTY_APPLICATION_VERSION
    http_status: 412
    applies_to: "POST /selections"
  - priority: 11
    category: state
    check: "expected_repair_kit_version equals the current RepairKit.version (concurrency_rules[kit-allocation-stale-kit])"
    error_id: ERR_STALE_REPAIR_KIT_VERSION
    http_status: 412
    applies_to: "POST /kit-allocations"
