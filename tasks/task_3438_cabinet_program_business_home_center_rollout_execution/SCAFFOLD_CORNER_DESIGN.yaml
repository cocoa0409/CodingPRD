              payload: { account_id: "${acct}", program_id: "${prog}", store_code: "ST-1", measure_window_start: "2026-09-02T09:00:00Z", measure_window_end: "2026-09-02T10:00:00Z" }
              as: RetailDesigner
              as_user_id: "des-1"
              captures: { job: $.data.id }
            - { call: "POST /cabinet/design-jobs/${job}/transition", payload: { to_status: MEASURED }, as: RetailDesigner, as_user_id: "des-1" }
            - { call: "POST /cabinet/design-jobs/${job}/transition", payload: { to_status: LAYOUT_READY, layout_lines: [{ family_code: "F1", finish_code: "OAK", quantity: 1 }] }, as: RetailDesigner, as_user_id: "des-1" }
            - { call: "POST /cabinet/design-jobs/${job}/transition", payload: { to_status: QUOTED }, as: RetailDesigner, as_user_id: "des-1" }
            - call: "GET /cabinet/programs/${prog}"
              as: ProgramManager
              captures: { prog_v2: $.data.version }
            - call: "POST /cabinet/programs/${prog}/lines"
              payload: { line_code: "L2", effective_start_week: "2026-W38", families: [{ family_code: "F1", standard_price_cents: 11000, base_lead_weeks: 2, complexity_units_per_cabinet: 1 }], expected_program_version: "${prog_v2}", old_line_disposition_qty: 0 }
              as: ProgramManager
          trigger:
            - call: "POST /cabinet/design-jobs/${job}/convert"
              payload: { destination_type: STORE, store_code: "ST-1", requested_delivery_week: "2026-W40" }
              as: RetailDesigner
              as_user_id: "des-1"
              captures: { err: $.data.error_id }
            - { call: "POST /cabinet/design-jobs/${job}/transition", payload: { to_status: LAYOUT_READY, layout_lines: [{ family_code: "F1", finish_code: "OAK", quantity: 1 }] }, as: RetailDesigner, as_user_id: "des-1" }
            - { call: "POST /cabinet/design-jobs/${job}/transition", payload: { to_status: QUOTED }, as: RetailDesigner, as_user_id: "des-1" }
            - call: "POST /cabinet/design-jobs/${job}/convert"
              payload: { destination_type: STORE, store_code: "ST-1", requested_delivery_week: "2026-W40" }
              as: RetailDesigner
              as_user_id: "des-1"
              captures: { order: $.data.id }
          assert:
            - "err == ERR_QUOTE_STALE on the first convert attempt (L1 no longer ACTIVE)"
            - "After revise + re-quote, convert succeeds: GET /cabinet/orders/${order} status == SUBMITTED AND quoted_total_cents == 11000 (priced under L2)"
            - "GET /cabinet/design-jobs/${job}: status == CONVERTED"

