    roles: [FilmOffice, LocationManager, OwnerRep]
    code: 200
    input: ["limit?", "offset?", "code?"]
    output: Jurisdiction[]
    side_effects: []
  - method: POST
    path: "/jurisdictions/{id}/suspend"
    description: "Suspend a jurisdiction (blocks new permits)"
    roles: [FilmOffice]
    code: 200
    input: []
    output: Jurisdiction
    side_effects: ["status := SUSPENDED"]

