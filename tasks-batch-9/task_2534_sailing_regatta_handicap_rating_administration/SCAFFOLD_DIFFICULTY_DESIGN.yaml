  # =========================================================================
  # RULE 5 of 9 -- priority_pair_validation_conflict (2 instances)
  # Pair A: priority 17 state / 409 over priority 37 business_temporal / 422.
  # Pair B: priority 18 business_safety / 422 over priority 28 business_constraint / 422.
  # =========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:

      - name: protest_on_withdrawn_entry_past_window_returns_entry_withdrawn
        higher_priority_rule: "validations priority 17, ERR_ENTRY_WITHDRAWN, category state, 409"
        lower_priority_rule: "validations priority 37, ERR_PROTEST_WINDOW_CLOSED, category business_temporal, 422"
        grounds:
          - validations.priority_17_ERR_ENTRY_WITHDRAWN
          - validations.priority_37_ERR_PROTEST_WINDOW_CLOSED
          - endpoints.POST_protests
          - state_machines.Entry.registration_status.ACCEPTED_to_WITHDRAWN
        distinguishing_aspect: |
          The error-category pair here is state (409) over business_temporal (422): a protest naming a
          WITHDRAWN protestee, filed after the 90-minute protest limit has elapsed, violates BOTH rules at
          once, and only priority 17 may surface. The control call in the same trigger names a live
          protestee under the identical expired clock and does surface ERR_PROTEST_WINDOW_CLOSED, which
          proves the lower rule was armed rather than dormant. An implementation that evaluates temporal
          window checks before entity-state checks returns 422 ERR_PROTEST_WINDOW_CLOSED on the first
          call and fails.
