  - section: complexity_layers
    instances:
      - name: policy_publish_with_a_stale_expected_program_version_is_refused
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[policy-publish-stale-program]
          - errors[ERR_STALE_PROGRAM_VERSION]
          - validations[priority=6]
        distinguishing_aspect: "The approver reads the program, another publication lands first, and the now-stale expected_program_version is refused with 412 even though the second publication would be legal on the merits; re-reading the program and retrying succeeds and supersedes the first policy."
        test_recipe:
          setup:
            - "One ComplianceProgram with Jurisdiction IL and two policies v1.0 (submitted by po-1) and v2.0 (submitted by po-2), both sitting in IN_REVIEW."
            - "The program version is captured BEFORE either publication."
          setup_api_calls:
            - call: "POST /programs"
              payload: { org_name: "Northline Retail Group", org_type: "HYBRID", exposure_ceiling_cents: 1093750 }
              as: SystemOperator
              captures: { prog_id: $.data.id }
