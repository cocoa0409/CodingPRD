          trigger:
            - call: "POST /listings/${lst_id}/publish"
              payload: {}
              as: Seller
              as_user_id: "${s_id}"
            - call: "GET /saved-searches"
              payload: { owner_id: "${b_id}" }
              as: Member
              as_user_id: "${b_id}"
              captures: { searches: $.data }
            - call: "GET /saved-searches/${ss_match}/alerts"
              payload: {}
              as: Member
              as_user_id: "${b_id}"
              captures: { alerts: $.data }
          assert:
            - "SavedSearch.${ss_match}.alert_count == 1"
            - "SavedSearch.${ss_nomatch}.alert_count == 0 (keyword 'sofa' does not match 'Oak Desk')"
            - "GET /saved-searches/${ss_match}/alerts returns 1 alert with listing_id ${lst_id}"

      - name: rate_threshold_offer_round_cap_boundary
        claim_type: rate_threshold_triggers
        grounds: ["validations[priority=13]", state_machines.Offer.transitions.COUNTERED_to_COUNTERED, "errors[ERR_MAX_ROUNDS_REACHED]"]
        distinguishing_aspect: "Counters are allowed while round_count < MAX_NEGOTIATION_ROUNDS (5); the 6th counter (when round_count == 5) is rejected with ERR_MAX_ROUNDS_REACHED — instantaneous threshold at the boundary."
        test_recipe:
          setup: ["Published listing; offer countered up to round_count 5 (B propose, then S,B,S,B,S counter)."]
          setup_api_calls:
            - call: "POST /categories"
              payload: { slug: "furniture", name: "Furniture" }
              as: PlatformAdmin
            - call: "POST /members"
              payload: { email: "s@x.com", display_name: "S", role_kind: "SELLER" }
              as: Anonymous
              captures: { s_id: $.data.id }
            - call: "POST /members"
              payload: { email: "b@x.com", display_name: "B", role_kind: "BUYER" }
              as: Anonymous
              captures: { b_id: $.data.id }
            - call: "POST /listings"
              payload: { seller_id: "${s_id}", category_slug: "furniture", title: "Desk", description: "oak", ask_price_cents: 10000, min_acceptable_price_cents: 1000 }
              as: Seller
              as_user_id: "${s_id}"
              captures: { lst_id: $.data.id }
            - call: "POST /listings/${lst_id}/publish"
              payload: {}
              as: Seller
              as_user_id: "${s_id}"
            - call: "POST /conversations"
              payload: { listing_id: "${lst_id}", buyer_id: "${b_id}" }
              as: Buyer
              as_user_id: "${b_id}"
              captures: { conv_id: $.data.id }
            - call: "POST /offers"
              payload: { conversation_id: "${conv_id}", amount_cents: 4000 }
              as: Buyer
              as_user_id: "${b_id}"
              captures: { off_id: $.data.id }
            - call: "POST /offers/${off_id}/counter"
              payload: { amount_cents: 9000 }
              as: Seller
              as_user_id: "${s_id}"
            - call: "POST /offers/${off_id}/counter"
              payload: { amount_cents: 5000 }
              as: Buyer
              as_user_id: "${b_id}"
            - call: "POST /offers/${off_id}/counter"
              payload: { amount_cents: 8500 }
              as: Seller
              as_user_id: "${s_id}"
            - call: "POST /offers/${off_id}/counter"
              payload: { amount_cents: 6000 }
              as: Buyer
              as_user_id: "${b_id}"
            - call: "POST /offers/${off_id}/counter"
              payload: { amount_cents: 8000 }
              as: Seller
              as_user_id: "${s_id}"
          trigger:
            - call: "POST /offers/${off_id}/counter"
              payload: { amount_cents: 7000 }
              as: Buyer
              as_user_id: "${b_id}"
          assert:
            - "Offer.${off_id}.round_count == 5 before trigger"
            - "response error_id == ERR_MAX_ROUNDS_REACHED"
            - "http status == 409"

      - name: cascade_listing_remove_cancels_open_meetup
        claim_type: cascading_side_effects
        grounds: [state_machines.Listing.transitions.ACTIVE_to_REMOVED, state_machines.Meetup.transitions.CONFIRMED_to_CANCELLED, state_machines.Offer.transitions.ACCEPTED_to_WITHDRAWN]
        distinguishing_aspect: "Moderator-removing a listing that has a CONFIRMED meetup cancels the meetup, withdraws the accepted offer, and clears accepted_offer_id end-to-end."
        test_recipe:
          setup: ["Clock 08:00; spot open 08:00-18:00; listing reserved by accepted offer; meetup CONFIRMED."]
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-01T08:00:00Z" }
              as: PlatformAdmin
            - call: "POST /categories"
              payload: { slug: "furniture", name: "Furniture" }
              as: PlatformAdmin
            - call: "POST /safe-trade-spots"
              payload: { name: "City Hall Lobby", is_police_verified: false, open_minute_of_day: 480, close_minute_of_day: 1080 }
              as: PlatformAdmin
              captures: { spot_id: $.data.id }
            - call: "POST /members"
              payload: { email: "s@x.com", display_name: "S", role_kind: "SELLER" }
              as: Anonymous
              captures: { s_id: $.data.id }
            - call: "POST /members"
              payload: { email: "b@x.com", display_name: "B", role_kind: "BUYER" }
              as: Anonymous
              captures: { b_id: $.data.id }
            - call: "POST /listings"
              payload: { seller_id: "${s_id}", category_slug: "furniture", title: "Desk", description: "oak", ask_price_cents: 10000, min_acceptable_price_cents: 5000 }
              as: Seller
              as_user_id: "${s_id}"
              captures: { lst_id: $.data.id }
            - call: "POST /listings/${lst_id}/publish"
              payload: {}
              as: Seller
              as_user_id: "${s_id}"
              captures: { lst_v: $.data.version }
            - call: "POST /conversations"
              payload: { listing_id: "${lst_id}", buyer_id: "${b_id}" }
              as: Buyer
              as_user_id: "${b_id}"
              captures: { conv_id: $.data.id }
            - call: "POST /offers"
              payload: { conversation_id: "${conv_id}", amount_cents: 9000 }
              as: Buyer
              as_user_id: "${b_id}"
              captures: { off_id: $.data.id }
            - call: "POST /offers/${off_id}/accept"
              payload: { expected_listing_version: "${lst_v}" }
              as: Seller
              as_user_id: "${s_id}"
              captures: { off_v: $.data.version }
            - call: "POST /meetups"
              payload: { offer_id: "${off_id}", spot_id: "${spot_id}", start_at: "2026-06-02T14:00:00Z", end_at: "2026-06-02T15:00:00Z", expected_offer_version: "${off_v}" }
              as: Buyer
              as_user_id: "${b_id}"
              captures: { mt_id: $.data.id }
            - call: "POST /meetups/${mt_id}/confirm"
              payload: {}
              as: Seller
              as_user_id: "${s_id}"
          trigger:
            - call: "POST /listings/${lst_id}/remove"
              payload: {}
              as: Moderator
            - call: "GET /meetups/${mt_id}"
              payload: {}
              as: Member
              as_user_id: "${b_id}"
              captures: { mst: $.data.status }
            - call: "GET /offers/${off_id}"
              payload: {}
              as: Member
              as_user_id: "${b_id}"
              captures: { ost: $.data.status }
            - call: "GET /listings/${lst_id}"
              payload: {}
              as: Member
              as_user_id: "${s_id}"
              captures: { aoid: $.data.accepted_offer_id, pub: $.data.publication_status }
          assert:
            - "Listing.${lst_id}.publication_status == REMOVED"
            - "Meetup.${mt_id}.status == CANCELLED"
            - "Offer.${off_id}.status == WITHDRAWN"
            - "Listing.${lst_id}.accepted_offer_id == null"

