      - name: selector_empty_pool_fallback_versus_matched_control
        grounds:
          - "§1.3 calculations.relay_rule_selection input_set (state_plan_id, status == ACTIVE, event_code equality, and fips_codes empty OR intersecting)"
          - "§1.3 relay_rule_selection '(d) empty-pool fallback: relay_state = UNMATCHED_OPTIONAL, matched_relay_rule_id = null, relay_class_applied = NONE, forward_delay_seconds_applied = 0'"
          - "§1.1 RelayRule.specificity (2 when fips_codes non-empty else 1) and RelayRule.status {ACTIVE, RETIRED}"
          - "§1.5 POST /relay-rules/{id}/retire side effect 'status = RETIRED'"
        distinguishing_aspect: "Every eligibility clause is knocked out at once for the first alert — the only county-scoped TOR rule covers FIPS 20177 (empty intersection with the alert's 20173) and the only statewide TOR rule has been RETIRED — so all four fallback fields must be written exactly (UNMATCHED_OPTIONAL / null / NONE / 0), while a second identical alert taken after a fresh statewide rule is added proves the pool was empty for eligibility reasons and not because the selector was never invoked."
        test_recipe:
          setup:
            - "Plan KS 2026-R1 activated with mandatory_relay_event_codes EMPTY (so the plan-level MANDATORY override cannot mask the rule's own relay_class)."
            - "rr_county: TOR, fips ['20177'], MANDATORY, priority 10, forward_delay_seconds 45 -> specificity 2, ACTIVE."
            - "rr_state_retired: TOR, fips [] (statewide), OPTIONAL, priority 20 -> specificity 1, then retired to RETIRED."
            - "Station KWEA registered. The probe alerts use distinct originator_sequence values so phase A of duplicate_suppression_window never fires."
          setup_api_calls:
            - call: "POST /state-plans"
              as: ComplianceAdmin
              as_user_id: adm-1
              payload: { state_code: "KS", plan_version_label: "2026-R1", required_source_types: ["PEP"], mandatory_relay_event_codes: [] }
              captures: { plan_id: "$.data.id" }
            - call: "POST /state-plans/${plan_id}/activate"
              as: ComplianceAdmin
              as_user_id: adm-1
              payload: {}
            - call: "POST /relay-rules"
              as: ComplianceAdmin
              as_user_id: adm-1
              payload: { state_plan_id: "${plan_id}", event_code: "TOR", fips_codes: ["20177"], relay_class: "MANDATORY", priority: 10, forward_delay_seconds: 45 }
              captures: { rr_county: "$.data.id" }
            - call: "POST /relay-rules"
              as: ComplianceAdmin
              as_user_id: adm-1
              payload: { state_plan_id: "${plan_id}", event_code: "TOR", fips_codes: [], relay_class: "OPTIONAL", priority: 20, forward_delay_seconds: 15 }
              captures: { rr_state_retired: "$.data.id" }
            - call: "POST /relay-rules/${rr_state_retired}/retire"
              as: ComplianceAdmin
              as_user_id: adm-1
              payload: {}
            - call: "POST /stations"
              as: ComplianceAdmin
              as_user_id: adm-1
              payload: { state_plan_id: "${plan_id}", call_sign: "KWEA", service_type: "TV", engineer_user_ids: ["eng-1"], certification_officer_user_id: "cert-1" }
              captures: { station_id: "$.data.id" }
          trigger:
            - call: "POST /alert-events"
              as: StationEngineer
              as_user_id: eng-1
              payload: { station_id: "${station_id}", event_code: "TOR", originator_sequence: "KSSEL-0001", fips_codes: ["20173"], received_at: "2026-08-01T00:00:00Z" }
              captures: { alert_unmatched: "$.data.id" }
            - call: "POST /relay-rules"
              as: ComplianceAdmin
              as_user_id: adm-1
              payload: { state_plan_id: "${plan_id}", event_code: "TOR", fips_codes: [], relay_class: "OPTIONAL", priority: 30, forward_delay_seconds: 15 }
              captures: { rr_control: "$.data.id" }
            - call: "POST /alert-events"
              as: StationEngineer
              as_user_id: eng-1
              payload: { station_id: "${station_id}", event_code: "TOR", originator_sequence: "KSSEL-0002", fips_codes: ["20173"], received_at: "2026-08-01T00:00:00Z" }
              captures: { alert_matched: "$.data.id" }
          assert:
            - "rr_county has specificity == 2 and rr_state_retired has specificity == 1 (empty fips_codes = statewide)"
            - "alert_unmatched: the candidate pool is empty (rr_county is excluded by intersection(['20177'], ['20173']) == [], rr_state_retired is excluded by status RETIRED)"
            - "alert_unmatched: relay_state == UNMATCHED_OPTIONAL, matched_relay_rule_id == null, relay_class_applied == NONE, forward_delay_seconds_applied == 0"
            - "alert_unmatched: suppression_source == NONE and suppression_reference_alert_id == null (no duplicate fired)"
            - "alert_matched, after the ACTIVE statewide rr_control is added: relay_state == RELAY_PENDING, matched_relay_rule_id == ${rr_control}, relay_class_applied == OPTIONAL (rule class OPTIONAL and TOR is not in the plan's empty mandatory_relay_event_codes), forward_delay_seconds_applied == 15"
            - "rr_control could be created at priority 30 because ERR_DUPLICATE_RELAY_PRIORITY only blocks a duplicate (event_code, priority) among ACTIVE rules of the plan"

      - name: obligation_clock_breach_strict_boundary_at_48_hours_and_compliant_band_at_exactly_90
        grounds:
          - "§1.3 calculations.outage_downtime_hours: 'obligation_breached = obligation_downtime_hours > REPAIR_DEADLINE_HOURS' (strict) with REPAIR_DEADLINE_HOURS 48"
          - "§1.3 calculations.station_compliance_score input_set outage_breach_count (obligation_breached == true AND status IN {OPEN, REPAIR_IN_PROGRESS, RESTORED, VERIFICATION_FAILED})"
          - "§1.3 constants OUTAGE_BREACH_DEDUCTION=10.00, COMPLIANT_MIN_SCORE=90.00"
        distinguishing_aspect: "Two outages differ only in their restore instant: 48.00 h exactly does NOT breach (strict `>`), 60.00 h does — and the following run-log-review must therefore count outage_breach_count == 1, landing the score on exactly 90.00, which is COMPLIANT because that band boundary is inclusive; an implementation using `>=` at either boundary reports 2 breaches / 80.00 / WATCH."
        test_recipe:
