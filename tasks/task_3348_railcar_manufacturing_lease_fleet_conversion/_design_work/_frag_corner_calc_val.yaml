          - entities.RetrofitProgram.fields.compliance_deadline_date
        distinguishing_aspect: "A retrofit window that opens inside the mandate's validity but ends 2026-10-20, five days past the compliance_deadline_date 2026-10-15, is rejected by priority 9 with ERR_RETROFIT_DEADLINE_PASSED and HTTP 422 while the same window ending exactly on 2026-10-15 is accepted."
        test_recipe:
          setup:
            - "Empty DB; logical clock pinned to 2026-09-01T00:00:00Z, well before the mandate deadline, so the operation is valid when it is attempted."
            - "Car type FLT-100 (BOXCAR, build_hours 1, regulatory_life_years 25, line_count_family FLT_LINE) with one WS-310 WHEELSET bill-of-material row at qty_per_car 1 and on_hand_qty 1000."
            - "A RETAINED order of 2 cars is reserved, released, changed over on FLT-L1 for [2026-09-02, 2026-09-04) and completed on 2026-09-04, producing two HELD cars whose regulatory_life_end_date 2051-09-04 clears priority 8."
            - "Retrofit program MAND-500 (PLANNED, never started) covers car type FLT-100, needs 10 shop days per car, consumes no component and has compliance_deadline_date 2026-10-15."
          setup_api_calls:
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/v1/car-types"
              payload: { model_code: "FLT-100", car_class: "BOXCAR", build_hours: 1, regulatory_life_years: 25, line_count_family: "FLT_LINE" }
              as: ProductionPlanner
              captures: { ct_id: $.data.id }
            - call: "POST /api/v1/components"
              payload: { part_number: "WS-310", component_class: "WHEELSET", unit_cost_cents: 1000, lead_time_days: 5, on_hand_qty: 1000 }
              as: SupplyChainCoordinator
              captures: { ws_id: $.data.id }
            - call: "POST /api/v1/car-type-component-requirements"
              payload: { car_type_id: "${ct_id}", component_id: "${ws_id}", qty_per_car: 1 }
              as: ProductionPlanner
            - call: "POST /api/v1/production-orders"
              payload: { car_type_id: "${ct_id}", quantity: 2, planned_shop_days: 2, disposition: "RETAINED", priority_rank: 1, order_date: "2026-09-01", required_delivery_date: "2026-09-20" }
              as: ProductionPlanner
              captures: { po_id: $.data.id }
            - call: "POST /api/v1/production-orders/${po_id}/reserve-components"
              payload: {}
              as: ProductionPlanner
            - call: "POST /api/v1/production-orders/${po_id}/release"
              payload: {}
              as: ProductionPlanner
            - call: "POST /api/v1/production-lines/FLT-L1/changeover"
              payload: { production_order_id: "${po_id}", scheduled_start_date: "2026-09-02", scheduled_end_date: "2026-09-04" }
              as: ProductionPlanner
            - call: "POST /api/v1/production-orders/${po_id}/complete"
              payload: { completed_qty: 2, completion_date: "2026-09-04" }
              as: ProductionPlanner
            - call: "GET /api/v1/lease-fleet-cars?production_order_id=${po_id}"
              payload: {}
              as: LeaseAdministrator
              captures: { car_a: "$.data[0].id", car_b: "$.data[1].id" }
            - call: "POST /api/v1/retrofit-programs"
              payload: { mandate_code: "MAND-500", description: "Deadline-bound retrofit mandate", compliance_deadline_date: "2026-10-15", required_shop_days_per_car: 10 }
              as: RegulatoryRetrofitist
              captures: { prog_id: $.data.id }
            - call: "POST /api/v1/retrofit-program-car-types"
              payload: { retrofit_program_id: "${prog_id}", car_type_id: "${ct_id}" }
              as: RegulatoryRetrofitist
          trigger:
            - call: "POST /api/v1/retrofit-work-orders"
              payload: { retrofit_program_id: "${prog_id}", lease_fleet_car_id: "${car_a}", shop_line: "SHOP-500", scheduled_start_date: "2026-10-10", scheduled_end_date: "2026-10-20", component_qty_consumed: 1 }
              as: RegulatoryRetrofitist
              captures: { err_deadline: $.data.error_id }
            - call: "POST /api/v1/retrofit-work-orders"
              payload: { retrofit_program_id: "${prog_id}", lease_fleet_car_id: "${car_b}", shop_line: "SHOP-501", scheduled_start_date: "2026-10-05", scheduled_end_date: "2026-10-15", component_qty_consumed: 1 }
              as: RegulatoryRetrofitist
              captures: { ok_status: $.data.status, ok_shop_days: $.data.shop_days }
          assert:
            - "The overrunning window returns HTTP 422 with data.error_id == ${err_deadline} == \"ERR_RETROFIT_DEADLINE_PASSED\""
            - "The comparison is on the window's end: 2026-10-20 > compliance_deadline_date 2026-10-15, while the window's start 2026-10-10 is itself inside the deadline"
            - "The boundary is inclusive on the deadline: the control window [2026-10-05, 2026-10-15) ending exactly on 2026-10-15 is accepted with status == ${ok_status} == \"SCHEDULED\" and shop_days == ${ok_shop_days} == 10"
            - "The operation was valid when attempted (clock 2026-09-01, mandate not yet lapsed) so the rejection is a forward-looking temporal check rather than a lapsed-deadline check"
            - "The rejected call left the car HELD and created no work order row on SHOP-500"

