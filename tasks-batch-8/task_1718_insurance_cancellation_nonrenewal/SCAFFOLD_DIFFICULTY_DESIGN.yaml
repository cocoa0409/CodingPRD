              payload: { policyholder_id: "${ph_ut2}", state_profile_id: "${prof_ut}", policy_number: "P-UT-2", term_start_date: "2026-01-01", term_end_date: "2026-12-31", total_premium_cents: 24000 }
              as: Underwriter
              captures: { pol_ut2: $.data.id }
