              captures: { rl_id: $.data.id }
            - call: "POST /return-lines/${rl_id}/quarantine"
              payload: { bay_id: "${bay_id}", quarantine_start_at: "2026-08-01T01:00:00Z", quarantine_end_at: "2026-08-01T02:00:00Z" }
              as: ReceivingClerk
              as_user_id: "u_clerk"
          trigger:
            - call: "POST /return-lines/${rl_id}/grade"
              payload: { condition_grade: "D" }
              as: GradingInspector
              as_user_id: "u_grader"
          assert:
            - "HTTP 200 and data.condition_grade == D with data.graded_by_user_id == u_grader"
            - "data.disposition == DESTROY, chosen by rule D2 (hazard_class != NONE AND grade IN {C,D,SCRAP}) and not by D1, since recall_status is NONE"
            - "data.disposition_state == DISPOSITION_ASSIGNED and data.bay_id == ${bay_id}, so the quarantine occupation is retained for audit"
            - "GET /return-lines/${rl_id} confirms financial_state == HOLD_PENDING_DISPOSITION, so grading moved only the physical dimension"

      - name: corner_val_quarantine_into_a_general_bay_is_rejected
