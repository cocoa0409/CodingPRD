            - "ReimbursementClaim.${claim_id}.status == AUDIT_PASSED and net_payable_cents == 925 after the refused call"
            - "Provider.${prov_id}.claim_gross_cents == 925, recouped_cents == 0, net_reimbursed_cents == 925, open_claim_count == 0 and audit_hold_flag == false"

  # =========================================================================
  # SECTION 7 - rbac  (claim-extraction-guide Table 7; role_model is
  # segregation_of_duties over five roles, two of them entity-backed)
  # =========================================================================
  - section: rbac
    instances:

      - name: exclusive_operations_are_closed_to_every_other_role
        claim_type: role_exclusivity
        grounds:
          - roles[ProgramAdministrator].exclusive_operations
          - roles[ProviderAgent].exclusive_operations
          - roles[NationalVerifier].exclusive_operations
          - roles[Subscriber].exclusive_operations
          - validations[priority=15]
          - errors[ERR_UNAUTHORIZED]
        distinguishing_aspect: |
          Five exclusive writes are attempted by a wrong role and each returns
          ERR_UNAUTHORIZED (403) with no state change, then the SAME writes succeed for their
          owning role - so the test separates "this role may not" from "this request is
          invalid". The shared operations are exercised from two different roles on the same
          row (usage as ProgramAdministrator, reads as NationalVerifier) to show sharing is
          real rather than an alias of the owner.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; one ACTIVE carrier, one dwelling, one subscriber whose check sits in PENDING_VERIFIER."
          setup_api_calls:
            - call: "POST /lifeline/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /lifeline/providers"
              payload: { name: "SafeLink Wireless", spin_id: "143170", study_area_code: "489170", licensed_state_codes: ["TX"], enrollment_cap: 50 }
              as: ProgramAdministrator
              captures: { prov_id: $.data.id }
            - call: "POST /lifeline/addresses"
              payload: { address_line1: "1200 N Main St", city: "El Paso", state_code: "TX", postal_code: "79901" }
              as: ProviderAgent
              as_user_id: "${prov_id}"
              captures: { addr_id: $.data.id }
            - call: "POST /lifeline/subscribers"
              payload: { full_name: "Ana Ruiz", date_of_birth: "1980-04-11", last4_ssn: "4417", address_id: "${addr_id}", household_size: 4, annual_income_cents: 3000000, last_3mo_income_cents: 750000 }
              as: ProviderAgent
              as_user_id: "${prov_id}"
              captures: { sub_id: $.data.id }
            - call: "POST /lifeline/subscribers/${sub_id}/eligibility-checks"
              payload: { claimed_basis: "INCOME", proof_document_ref: "DOC-T1" }
              as: ProviderAgent
              as_user_id: "${prov_id}"
              captures: { chk_id: $.data.id }
          trigger:
