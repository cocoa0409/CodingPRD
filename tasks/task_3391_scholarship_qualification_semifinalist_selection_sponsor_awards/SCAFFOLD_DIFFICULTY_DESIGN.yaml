        grounds:
          - state_machines.Award.OFFERED_to_DECLINED
          - state_machines.SponsorAgreement.EXHAUSTED_to_ACTIVE
          - calculations.waitlist_promotion
          - state_machines.Notification.EMBARGOED_to_SUPERSEDED
        distinguishing_aspect: |
          Depth-4 cascade triggered by a student decline: Award DECLINED -> (1) SponsorAgreement
          pool_committed_cents debited back -> (2) the debit flips the agreement EXHAUSTED ->
          ACTIVE -> (3) the flip runs waitlist_promotion which creates a new OFFERED Award for
          the next-ranked finalist -> (4) the new award queues its own AWARD_OFFER and
