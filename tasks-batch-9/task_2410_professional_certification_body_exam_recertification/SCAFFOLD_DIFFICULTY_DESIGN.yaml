            - "One APPROVED application and a TEST_CENTER session 2026-08-10T00:00:00Z-04:00:00Z, seat_capacity 5."
            - "One ExamRegistration in seat_status SCHEDULED / score_status NOT_APPLICABLE against that session, so ExamSession.seats_reserved == 1 and form_reassignment_required == false. The logical clock is still the default 2026-08-01T00:00:00Z."
