# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: UtilityFiler
    description: "Utility regulatory staff: assembles test-year data, proposes adjustments and rate design, responds to discovery, circulates settlements, implements rates, files compliance"
    identity: opaque
    exclusive_operations:
      - "POST /api/v1/rate-cases; submit-filing; implement-rates"
      - "POST /api/v1/test-year-entries(+submit/reopen/lock)"
      - "POST /api/v1/adjustments(+verify/withdraw)"
      - "POST /api/v1/rate-base-items(+submit/revise)"
      - "POST /api/v1/customer-classes"
      - "POST /api/v1/data-requests/{id}/respond; /object"
      - "POST /api/v1/settlement-proposals(+circulate)"
      - "POST /api/v1/regulatory-assets"
      - "POST /api/v1/amortization-entries/{id}/post; /reverse"
      - "POST /api/v1/tariff-rates"
      - "POST /api/v1/compliance-filings(+submit)"
    shared_operations:
      - "All GET endpoints"

  - name: CommissionStaff
    description: "Public utility commission staff: deficiency review, rate-base audit, opens discovery, staff data requests, compliance review, clock control for the procedural calendar"
    identity: opaque
    exclusive_operations:
      - "POST /api/v1/rate-cases/{id}/deficiency-review; open-discovery; begin-compliance-monitoring"
      - "POST /api/v1/rate-base-items/{id}/audit"
      - "POST /api/v1/adjustments/{id}/dispute; /reject"
      - "POST /api/v1/compliance-filings/{id}/review"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "POST /api/v1/data-requests (staff-issued); POST /api/v1/data-requests/{id}/withdraw (staff-issued requests)"
      - "POST /api/v1/intervenors/{id}/withdraw"
      - "All GET endpoints"

  - name: IntervenorRep
    description: "Registered intervenor party representative; X-User-ID equals the Intervenor id; scopes: may issue data requests for its own party, withdraw its own party and its own party's requests, sign/decline/rescind its own signatory rows, dispute verified adjustments"
    identity: "entity_backed:Intervenor"
    exclusive_operations:
      - "POST /api/v1/intervenors (self-registration)"
      - "POST /api/v1/settlement-signatories/{id}/sign; /decline; /rescind (own rows only)"
    shared_operations:
      - "POST /api/v1/data-requests (intervenor-issued); POST /api/v1/data-requests/{id}/withdraw (own requests only)"
      - "POST /api/v1/intervenors/{id}/withdraw (own party only)"
      - "POST /api/v1/adjustments/{id}/dispute"
      - "All GET endpoints"

  - name: ALJ
    description: "Administrative law judge: procedural schedule control, objection rulings, settlement recommendation/remand, final order, docket closure"
    identity: opaque
    exclusive_operations:
      - "POST /api/v1/rate-cases/{id}/advance-to-hearing; open-settlement-window; advance-to-order-pending; issue-order; close"
      - "POST /api/v1/data-requests/{id}/rule"
      - "POST /api/v1/settlement-proposals/{id}/recommend; /remand"
    shared_operations:
      - "All GET endpoints"
