        distinguishing_aspect: "Mode (a) non-linear ≥3-input formula: assessed_amount=1000 selects deductible-rate band 0.10, deductible=max(50, round(100))=100, final=min(1000, coverage 5000)-100=900 — tiered selection nested inside min/max."
