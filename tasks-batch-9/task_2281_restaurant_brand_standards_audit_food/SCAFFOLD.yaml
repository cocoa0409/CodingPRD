  - method: GET
    path: "/auditors/{id}/calibration-records"
    description: "Calibration records naming this auditor as audited party or reviewer"
    roles: [BrandAdmin, Auditor, CalibrationReviewer]
    code: 200
    input: ["limit?", "offset?"]
    output: "CalibrationRecord[]"
    side_effects: []
  - method: POST
    path: "/locations"
    description: "Register a location operated by a franchisee of the same brand"
    roles: [BrandAdmin]
    code: 201
    input: [brand_id, franchisee_id, store_number, region_code]
    output: Location
    side_effects: ["increments Brand.location_count by 1"]
  - method: GET
    path: "/locations/{id}"
    description: "Read a location including standing_score, escalation_level, and franchise_agreement_status"
    roles: [BrandAdmin, Franchisee, Auditor]
    code: 200
    input: []
    output: Location
    side_effects: []
  - method: GET
    path: "/locations"
    description: "List locations for cross-location trend reporting"
    roles: [BrandAdmin, Franchisee]
    code: 200
    input: ["brand_id?", "franchisee_id?", "region_code?", "franchise_agreement_status?", "limit?", "offset?"]
    output: "Location[]"
    side_effects: []
  - method: GET
    path: "/locations/{id}/health-inspections"
    description: "Health-department inspections recorded against this location"
    roles: [BrandAdmin, ComplianceIntegrator, Auditor]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "HealthInspection[]"
    side_effects: []
  - method: GET
    path: "/locations/{id}/escalation-events"
    description: "Append-only escalation ledger of this location"
    roles: [BrandAdmin, Franchisee]
    code: 200
    input: ["limit?", "offset?"]
    output: "EscalationEvent[]"
    side_effects: []
  - method: POST
    path: "/locations/{id}/cure-acceptance"
    description: "Accept a franchisee's cure and step the escalation level down by one"
    roles: [BrandAdmin]
    code: 200
    input: ["note?"]
    output: Location
    side_effects:
      - "appends a CURE_ACCEPTED EscalationEvent"
      - "lowers escalation_level by 1 and re-derives franchise_agreement_status"
      - "recomputes Franchisee.open_default_location_count, Brand.default_location_count, and Brand.brand_risk_index"
  - method: POST
    path: "/rubric-versions"
    description: "Draft a rubric version for a brand, optionally superseding an existing one"
    roles: [BrandAdmin]
    code: 201
    input: [brand_id, version_label, effective_from, total_points, "supersedes_rubric_version_id?", expected_brand_version]
    output: RubricVersion
    side_effects:
      - "increments Brand.version by 1"
      - "creates the version in DRAFT with item_count 0"
  - method: GET
    path: "/rubric-versions/{id}"
    description: "Read a rubric version"
    roles: [BrandAdmin, Auditor]
    code: 200
    input: []
    output: RubricVersion
    side_effects: []
  - method: GET
    path: "/rubric-versions"
    description: "List rubric versions, including successors of a given version"
    roles: [BrandAdmin, Auditor]
    code: 200
    input: ["brand_id?", "supersedes_rubric_version_id?", "status?", "limit?", "offset?"]
    output: "RubricVersion[]"
    side_effects: []
  - method: POST
    path: "/rubric-versions/{id}/rubric-items"
    description: "Append a scoring line item to a DRAFT rubric version"
    roles: [BrandAdmin]
    code: 201
    input: [item_code, section, max_points, "is_critical?", display_order]
    output: RubricItem
    side_effects:
      - "increments RubricVersion.item_count by 1 and critical_item_count when is_critical"
      - "increments RubricVersion.version by 1"
  - method: GET
    path: "/rubric-versions/{id}/rubric-items"
    description: "List the line items of a rubric version in display_order"
    roles: [BrandAdmin, Auditor]
    code: 200
    input: ["section?", "limit?", "offset?"]
    output: "RubricItem[]"
    side_effects: []
  - method: POST
    path: "/rubric-versions/{id}/publish"
    description: "Publish a DRAFT rubric version and retire the version it supersedes"
    roles: [BrandAdmin]
    code: 200
    input: []
    output: RubricVersion
    side_effects:
      - "sets status PUBLISHED and published_at to the logical clock"
      - "retires the superseded PUBLISHED version"
  - method: POST
    path: "/audit-visits"
    description: "Schedule an announced, unannounced, or shadow visit"
    roles: [BrandAdmin]
    code: 201
    input: [location_id, auditor_id, rubric_version_id, visit_type, scheduled_start_at, scheduled_end_at, "shadow_of_visit_id?"]
    output: AuditVisit
    side_effects:
      - "computes announced_notice_hours for ANNOUNCED visits"
      - "evaluates calculations.location_unannounced_ratio_pct, the auditor pairwise overlap rule, and the location aggregate window quota"
  - method: GET
    path: "/audit-visits/{id}"
    description: "Read a visit including section percents, composite score, variant, and grade"
    roles: [BrandAdmin, Auditor, CalibrationReviewer, Franchisee]
    code: 200
    input: []
    output: AuditVisit
    side_effects: []
  - method: GET
    path: "/audit-visits"
    description: "List visits for the audit calendar and for shadow/health linkage lookups"
    roles: [BrandAdmin, Auditor, CalibrationReviewer, Franchisee]
    code: 200
    input: ["location_id?", "auditor_id?", "rubric_version_id?", "shadow_of_visit_id?", "linked_health_inspection_id?", "status?", "visit_type?", "limit?", "offset?"]
    output: "AuditVisit[]"
    side_effects: []
  - method: POST
    path: "/audit-visits/{id}/start"
    description: "Begin an on-site visit"
    roles: [Auditor]
    code: 200
    input: []
    output: AuditVisit
    side_effects: ["sets status IN_PROGRESS and started_at to the logical clock"]
  - method: POST
    path: "/audit-visits/{id}/scored-items"
    description: "Score one rubric line item on an IN_PROGRESS visit"
    roles: [Auditor]
    code: 201
    input: [rubric_item_id, points_awarded, "note?"]
    output: ScoredItem
    side_effects:
      - "derives is_violation and severity"
      - "sets original_points_awarded and effective_points_awarded to points_awarded"
  - method: POST
    path: "/audit-visits/{id}/submit"
    description: "Submit scores and compute the PROVISIONAL composite"
    roles: [Auditor]
    code: 200
    input: []
    output: AuditVisit
    side_effects:
      - "computes section percents, critical_violation_count, critical_penalty_points"
      - "computes the PROVISIONAL composite_score and grade"
  - method: POST
    path: "/audit-visits/{id}/rescore"
    description: "Correct one scored item on a SUBMITTED visit under optimistic concurrency"
    roles: [Auditor]
    code: 200
    input: [scored_item_id, points_awarded, expected_visit_version]
    output: AuditVisit
    side_effects:
      - "overwrites points_awarded and recomputes the PROVISIONAL composite and grade"
      - "increments rescore_count by 1"
      - "increments AuditVisit.version by 1"
  - method: POST
    path: "/audit-visits/{id}/finalize"
    description: "Finalize a visit, admit health-department data, and assign corrective actions"
    roles: [BrandAdmin]
    code: 200
    input: []
    output: AuditVisit
    side_effects:
      - "selects the eligible HealthInspection and computes health_component_percent"
      - "recomputes composite_score with the FINAL variant and re-derives grade"
      - "creates one CorrectiveAction per violating ScoredItem"
      - "recomputes Location.standing_score, latest_grade, repeat_violation_count and appends REPEAT_CRITICAL escalation events"
      - "recomputes Franchisee and Brand aggregates including brand_risk_index"
  - method: POST
    path: "/audit-visits/{id}/void"
    description: "Void a visit; the reversal set depends on the state the visit is voided from"
    roles: [BrandAdmin]
    code: 200
    input: [void_reason]
    output: AuditVisit
    side_effects:
      - "clears composite fields when the visit had been scored"
      - "voids non-terminal CorrectiveActions and appends VOID_REVERSAL escalation events when voiding from FINALIZED"
      - "recomputes Location, Franchisee, and Brand aggregates when voiding from FINALIZED"
  - method: GET
    path: "/audit-visits/{id}/calibration-records"
    description: "Calibration records whose shadow or primary visit is this visit"
    roles: [BrandAdmin, CalibrationReviewer]
    code: 200
    input: ["limit?", "offset?"]
    output: "CalibrationRecord[]"
    side_effects: []
  - method: GET
    path: "/audit-visits/{id}/escalation-events"
    description: "Escalation ledger entries originating from this visit"
    roles: [BrandAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: "EscalationEvent[]"
    side_effects: []
  - method: GET
    path: "/scored-items/{id}"
    description: "Read a scored item including dispute status and effective points"
    roles: [BrandAdmin, Auditor, Franchisee]
    code: 200
    input: []
    output: ScoredItem
    side_effects: []
  - method: GET
    path: "/scored-items"
    description: "List scored items by visit or rubric item"
    roles: [BrandAdmin, Auditor, Franchisee]
    code: 200
    input: ["visit_id?", "rubric_item_id?", "status?", "severity?", "limit?", "offset?"]
    output: "ScoredItem[]"
    side_effects: []
  - method: GET
    path: "/corrective-actions/{id}"
    description: "Read a corrective action including due_at and counters"
    roles: [BrandAdmin, Auditor, Franchisee]
    code: 200
    input: []
    output: CorrectiveAction
    side_effects: []
  - method: GET
    path: "/corrective-actions"
    description: "List corrective actions by scored item, location, or franchisee"
    roles: [BrandAdmin, Auditor, Franchisee]
    code: 200
    input: ["scored_item_id?", "location_id?", "assigned_franchisee_id?", "status?", "severity?", "limit?", "offset?"]
    output: "CorrectiveAction[]"
    side_effects: []
  - method: POST
    path: "/corrective-actions/{id}/submit"
    description: "Franchisee submits remediation evidence for verification"
    roles: [Franchisee]
    code: 200
    input: ["remediation_note?"]
    output: CorrectiveAction
    side_effects: ["increments submission_count and sets submitted_at to the logical clock"]
  - method: POST
    path: "/corrective-actions/{id}/verify"
    description: "Auditor accepts or rejects submitted remediation evidence"
    roles: [Auditor]
    code: 200
    input: [outcome, "rejection_reason?"]
    output: CorrectiveAction
    side_effects:
      - "on ACCEPTED sets VERIFIED, sets verified_at, lowers Location.open_corrective_action_count by 1, recomputes Brand.brand_risk_index"
      - "on REJECTED sets REJECTED and increments rejection_count"
  - method: GET
    path: "/corrective-actions/{id}/evidence-photos"
    description: "Photos attached to a corrective action"
    roles: [BrandAdmin, Auditor, Franchisee]
    code: 200
    input: ["limit?", "offset?"]
    output: "EvidencePhoto[]"
    side_effects: []
  - method: GET
    path: "/corrective-actions/{id}/escalation-events"
    description: "Escalation ledger entries originating from this corrective action"
    roles: [BrandAdmin, Franchisee]
    code: 200
    input: ["limit?", "offset?"]
    output: "EscalationEvent[]"
    side_effects: []
  - method: POST
    path: "/evidence-photos"
    description: "Attach a photo to exactly one corrective action or dispute"
    roles: [Franchisee, Auditor]
    code: 201
    input: ["corrective_action_id?", "dispute_id?", file_uri, captured_at, "caption?"]
    output: EvidencePhoto
    side_effects:
      - "increments CorrectiveAction.evidence_photo_count by 1 when corrective_action_id is set"
      - "records uploaded_by_role from the acting role"
  - method: POST
    path: "/disputes"
    description: "Franchisee appeals a scored item on a FINALIZED visit"
    roles: [Franchisee]
    code: 201
    input: [scored_item_id, requested_points, reason]
    output: Dispute
    side_effects:
      - "sets filed_by_franchisee_id from the acting franchisee and filed_at to the logical clock"
      - "moves the ScoredItem to UNDER_DISPUTE"
  - method: GET
    path: "/disputes/{id}"
    description: "Read a dispute including info_request_count and resolution"
    roles: [BrandAdmin, Franchisee, CalibrationReviewer]
    code: 200
    input: []
    output: Dispute
    side_effects: []
  - method: GET
    path: "/disputes"
    description: "List disputes by scored item, filer, or reviewer"
    roles: [BrandAdmin, Franchisee, CalibrationReviewer]
    code: 200
    input: ["scored_item_id?", "filed_by_franchisee_id?", "reviewer_auditor_id?", "status?", "limit?", "offset?"]
    output: "Dispute[]"
    side_effects: []
  - method: GET
    path: "/disputes/{id}/evidence-photos"
    description: "Photo evidence attached to this dispute, oldest first"
    roles: [BrandAdmin, Franchisee, CalibrationReviewer]
    code: 200
    input: ["limit?", "offset?"]
    output: "EvidencePhoto[]"
    side_effects: []
  - method: POST
    path: "/disputes/{id}/request-info"
    description: "Calibration reviewer requests additional information, capped at two rounds"
    roles: [CalibrationReviewer]
    code: 200
    input: [information_requested]
    output: Dispute
    side_effects:
      - "increments info_request_count by 1"
      - "claims the dispute by setting reviewer_auditor_id when null"
  - method: POST
    path: "/disputes/{id}/supplement"
    description: "Franchisee supplies evidence and moves the dispute to evidence review"
    roles: [Franchisee]
    code: 200
    input: ["note?"]
    output: Dispute
    side_effects: ["sets status EVIDENCE_REVIEW"]
  - method: POST
    path: "/disputes/{id}/resolve"
    description: "Calibration reviewer upholds or amends the scored item"
    roles: [CalibrationReviewer]
    code: 200
    input: [outcome, "granted_points?", rationale]
    output: Dispute
    side_effects:
      - "sets resolution_points and resolved_at"
      - "on AMENDED drives the ScoredItem amendment cascade through visit, location, corrective action, and brand"
      - "on UPHELD returns the ScoredItem to a terminal UPHELD state with no numeric change"
  - method: POST
    path: "/disputes/{id}/withdraw"
    description: "Franchisee withdraws an unresolved dispute"
    roles: [Franchisee]
    code: 200
    input: ["note?"]
    output: Dispute
    side_effects: ["returns the ScoredItem to SCORED and sets resolved_at"]
  - method: POST
    path: "/health-inspections"
    description: "Import a health-department inspection result"
    roles: [ComplianceIntegrator]
    code: 201
    input: [location_id, authority_name, inspection_date, points_scored, points_possible, letter_grade]
    output: HealthInspection
    side_effects: ["records the inspection as RECORDED and therefore eligible for composite selection"]
  - method: GET
    path: "/health-inspections/{id}"
    description: "Read a health inspection"
    roles: [BrandAdmin, ComplianceIntegrator]
    code: 200
    input: []
    output: HealthInspection
    side_effects: []
  - method: POST
    path: "/health-inspections/{id}/disregard"
    description: "Exclude an inspection from composite selection"
    roles: [ComplianceIntegrator]
    code: 200
    input: [disregard_reason]
    output: HealthInspection
    side_effects: ["sets status DISREGARDED so the inspection leaves the eligibility pool"]
  - method: POST
    path: "/calibration-records"
    description: "Record shadow-audit calibration for a completed shadow visit and adjust the audited auditor's reliability"
    roles: [CalibrationReviewer]
    code: 201
    input: [shadow_visit_id]
    output: CalibrationRecord
    side_effects:
      - "computes variance_points, band, and reliability_delta"
      - "recomputes the audited Auditor.reliability_score with the ROLLING variant"
      - "suspends the audited auditor when the rolling score falls below 60.00, which itself voids that auditor's IN_PROGRESS visits"
  - method: POST
    path: "/overdue-sweeps"
    description: "Advance every past-due corrective action to OVERDUE and cascade CRITICAL ones to ESCALATED"
    roles: [BrandAdmin]
    code: 200
    input: []
    output:
      swept_count: integer
      overdue_count: integer
      escalated_count: integer
      escalated_location_count: integer
    side_effects:
      - "moves ASSIGNED and REJECTED actions past due_at to OVERDUE"
      - "cascades CRITICAL overdue actions to ESCALATED, appending OVERDUE_CRITICAL escalation events"
      - "re-derives Location, Franchisee, and Brand aggregates for every affected location"
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Test-driving endpoint that sets the server's logical clock. Before any call the logical clock reads exactly 2026-08-01T00:00:00Z and never falls back to wall-clock time."
    roles: [BrandAdmin]
    code: 200
    input: [to_iso8601]
    output:
      current_utc: string
    side_effects: ["all deadline, notice, window, and lookback rules evaluate against the new logical clock"]

errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID missing, or the role is not a declared role"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "The acting role is not listed in the endpoint's roles"
  - id: ERR_ACTING_IDENTITY_NOT_FOUND
    http: 404
    condition: "X-User-ID does not resolve to an instance of the role's backing entity"
  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "The acting auditor or franchisee does not own the targeted visit, corrective action, dispute, or location"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "The calibration reviewer is the auditor who scored the disputed visit, or a shadow visit names its own auditor's visit as target"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Missing required field, wrong type, unknown enum value, out-of-range number, or invalid pagination parameter"
  - id: ERR_BRAND_NOT_FOUND
    http: 404
    condition: "brand_id in the path or body does not exist"
  - id: ERR_FRANCHISEE_NOT_FOUND
    http: 404
    condition: "franchisee_id in the path or body does not exist"
  - id: ERR_AUDITOR_NOT_FOUND
    http: 404
    condition: "auditor_id in the path or body does not exist"
  - id: ERR_LOCATION_NOT_FOUND
    http: 404
    condition: "location_id in the path or body does not exist"
  - id: ERR_RUBRIC_VERSION_NOT_FOUND
    http: 404
    condition: "rubric_version_id or supersedes_rubric_version_id does not exist"
  - id: ERR_RUBRIC_ITEM_NOT_FOUND
    http: 404
    condition: "rubric_item_id does not exist"
  - id: ERR_VISIT_NOT_FOUND
    http: 404
    condition: "An audit visit id in the path or body does not exist"
  - id: ERR_SCORED_ITEM_NOT_FOUND
    http: 404
    condition: "scored_item_id does not exist"
  - id: ERR_CORRECTIVE_ACTION_NOT_FOUND
    http: 404
    condition: "corrective_action_id does not exist"
  - id: ERR_DISPUTE_NOT_FOUND
    http: 404
    condition: "dispute_id does not exist"
  - id: ERR_HEALTH_INSPECTION_NOT_FOUND
    http: 404
    condition: "A health inspection id in the path does not exist"
  - id: ERR_INVALID_VISIT_STATE
    http: 409
    condition: "The visit is not in a state that permits the requested transition"
  - id: ERR_INVALID_CORRECTIVE_ACTION_STATE
    http: 409
    condition: "The corrective action is not in a state that permits submit or verify"
  - id: ERR_INVALID_DISPUTE_STATE
    http: 409
    condition: "The dispute is not in a state that permits request-info, supplement, resolve, or withdraw"
  - id: ERR_INVALID_RUBRIC_STATE
    http: 409
    condition: "The rubric version is not DRAFT for item append or publish"
  - id: ERR_INVALID_AUDITOR_STATE
    http: 409
    condition: "The auditor is already in the requested certification state"
  - id: ERR_NO_ESCALATION_TO_CURE
    http: 409
    condition: "Cure acceptance requested while the location is GOOD_STANDING"
  - id: ERR_RUBRIC_VERSION_NOT_PUBLISHED
    http: 409
    condition: "A visit references a DRAFT or RETIRED rubric version"
  - id: ERR_STALE_BRAND_VERSION
    http: 412
    condition: "expected_brand_version does not match the brand's current version"
  - id: ERR_STALE_VISIT_VERSION
    http: 412
    condition: "expected_visit_version does not match the visit's current version"
  - id: ERR_AUDITOR_SUSPENDED
    http: 409
    condition: "The auditor bound to the operation is SUSPENDED"
  - id: ERR_AUDITOR_NOT_CERTIFIED
    http: 409
    condition: "The auditor bound to the operation is PROVISIONAL"
  - id: ERR_UNRESOLVED_DISPUTE
    http: 409
    condition: "A scored item of the visit is UNDER_DISPUTE"
  - id: ERR_FRANCHISEE_BRAND_MISMATCH
    http: 422
    condition: "The franchisee belongs to a different brand than the location"
  - id: ERR_RUBRIC_ITEM_NOT_IN_VISIT_RUBRIC
    http: 422
    condition: "The rubric item belongs to a rubric version other than the visit's pinned one"
  - id: ERR_SHADOW_LINK_MISMATCH
    http: 422
    condition: "shadow_of_visit_id is set on a non-SHADOW visit or missing on a SHADOW visit"
  - id: ERR_SHADOW_TARGET_INVALID
    http: 422
    condition: "The shadow target is itself a shadow, VOIDED, at another location, or on another rubric version"
  - id: ERR_EVIDENCE_TARGET_AMBIGUOUS
    http: 422
    condition: "An evidence photo names both or neither of corrective_action_id and dispute_id"
  - id: ERR_CALIBRATION_INPUTS_INCOMPLETE
    http: 422
    condition: "The shadow visit is not a shadow, has no target, or either visit lacks a composite score"
  - id: ERR_INVALID_VISIT_WINDOW
    http: 422
    condition: "scheduled_end_at is at or before scheduled_start_at"
  - id: ERR_ANNOUNCED_NOTICE_TOO_SHORT
    http: 422
    condition: "An ANNOUNCED visit is scheduled less than 72 hours ahead of the logical clock"
  - id: ERR_RUBRIC_NOT_EFFECTIVE
    http: 422
    condition: "The rubric version's effective_from is after the visit's scheduled_start_at"
  - id: ERR_TIMESTAMP_IN_FUTURE
    http: 422
    condition: "captured_at or inspection_date is after the logical clock"
  - id: ERR_AUDITOR_SCHEDULE_CONFLICT
    http: 409
    condition: "The auditor's buffered interval collides with another non-VOIDED visit"
  - id: ERR_LOCATION_VISIT_WINDOW_QUOTA
    http: 409
    condition: "A third UNANNOUNCED visit falls inside the location's centered 14-day window"
  - id: ERR_VISIT_WINDOW_NOT_OPEN
    http: 409
    condition: "Start requested more than 60 minutes before scheduled_start_at"
  - id: ERR_UNANNOUNCED_MIX_BELOW_MINIMUM
    http: 422
    condition: "The resulting unannounced ratio would fall below the brand's unannounced_min_ratio_pct"
  - id: ERR_POINTS_EXCEED_MAX
    http: 422
    condition: "points_awarded is negative or above the rubric item's max_points"
  - id: ERR_ITEM_ALREADY_SCORED
    http: 409
    condition: "The rubric item already has a scored item on this visit"
  - id: ERR_CRITICAL_ITEMS_UNSCORED
    http: 422
    condition: "Submit attempted while a critical rubric item has no scored item"
  - id: ERR_RESCORE_LIMIT_REACHED
    http: 409
    condition: "A third rescore was attempted on the same visit"
  - id: ERR_RUBRIC_TOTAL_MISMATCH
    http: 422
    condition: "The sum of item max_points differs from total_points at publish"
  - id: ERR_RUBRIC_SECTION_INCOMPLETE
    http: 422
    condition: "Publish attempted without a critical item or without an item in every section"
  - id: ERR_DISPUTE_POINTS_INVALID
    http: 422
    condition: "requested_points or granted_points is not above the current points_awarded or exceeds max_points"
  - id: ERR_DISPUTE_ALREADY_OPEN
    http: 409
    condition: "An unresolved dispute already exists on the scored item"
  - id: ERR_INFO_REQUEST_LIMIT_REACHED
    http: 409
    condition: "A third information request was attempted on the same dispute"
  - id: ERR_EVIDENCE_REQUIRED
    http: 422
    condition: "Submit or supplement attempted with zero attached evidence photos"
  - id: ERR_LATE_CURE_NOT_ALLOWED
    http: 409
    condition: "Submit attempted on an ESCALATED critical corrective action"
  - id: ERR_OPEN_CORRECTIVE_ACTIONS
    http: 409
    condition: "Cure acceptance attempted while the location still has open corrective actions"
  - id: ERR_RELIABILITY_BELOW_FLOOR
    http: 409
    condition: "Certification attempted while the CERTIFICATION_REVIEW reliability score is below 70.00"
  - id: ERR_VERIFIED_ACTION_BLOCKS_VOID
    http: 409
    condition: "Void attempted on a FINALIZED visit whose corrective action was already verified"
  - id: ERR_CALIBRATION_ALREADY_RECORDED
    http: 409
    condition: "A calibration record already exists for the shadow visit"
  - id: ERR_DUPLICATE_RESOURCE_CODE
    http: 409
    condition: "brand_code, employee_code, or store_number within a brand is already taken"
  - id: ERR_DUPLICATE_RUBRIC_ENTRY
    http: 409
    condition: "version_label within a brand, or item_code or display_order within a rubric version, is already taken"

roles:
