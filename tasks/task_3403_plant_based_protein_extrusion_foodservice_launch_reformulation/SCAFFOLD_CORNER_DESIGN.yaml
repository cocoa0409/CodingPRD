# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Task: task_3403_plant_based_protein_extrusion_foodservice_launch_reformulation
# Breadth probe over §1.1-§1.7. Corners already exercised by
# SCAFFOLD_DIFFICULTY_DESIGN.yaml appear as excluded_because stubs.
# Negative triggers capture $.data.error_id (or use a negative name pattern).
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: cn_ent_supplier_create_defaults
        claim_type: Creation
        grounds:
          - "entities.Supplier"
          - "endpoints.POST_/protein-ops/suppliers"
        distinguishing_aspect: "A supplier created with the eight required fields returns 201 with qualification PENDING_AUDIT, agreement DRAFT, computed counters at 0, version 1, and system id/created_at/updated_at — no status field is client-supplied."
        test_recipe:
          setup: ["Empty database; logical clock at default 2026-09-01T00:00:00Z (no set_current_utc needed)."]
          setup_api_calls: []
          trigger:
            - &k_sup_create
              call: "POST /protein-ops/suppliers"
              payload: { supplier_code: "SUP-K-1", isolate_type: "PEA", committed_volume_kg: 10000, base_price_per_kg_cents: 500, price_floor_cents: 400, price_cap_cents: 540, agreement_start_date: "2026-08-01T00:00:00Z", agreement_end_date: "2027-08-01T00:00:00Z" }
              as: ProcurementManager
              captures: { sup_id: $.data.id }
          assert:
            - "response status 201 and response_type object"
            - "Supplier.${sup_id}.qualification_status == PENDING_AUDIT and agreement_status == DRAFT"
            - "Supplier.${sup_id}.delivered_volume_kg == 0 and open_lot_count == 0 and version == 1"
            - "response data carries non-null id, created_at, updated_at; meta.api_request_id present"

      - name: cn_ent_line_create_conditional_initial
        claim_type: Defaults
        grounds:
          - "entities.ProductionLine"
          - "state_machines.ProductionLine"
        distinguishing_aspect: "Initial certification is conditional on site_type: OWNED starts CERTIFIED x IDLE while CO_MAN starts PENDING x IDLE — same endpoint, two different initial states."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - call: "POST /protein-ops/production-lines"
              payload: { line_code: "LINE-CI-O", site_type: "OWNED", hourly_capacity_kg: 250, supported_isolate_types: ["PEA"] }
              as: PlantManager
              captures: { lo_id: $.data.id }
            - call: "POST /protein-ops/production-lines"
              payload: { line_code: "LINE-CI-C", site_type: "CO_MAN", coman_partner_name: "CoPack Industries", monthly_reserved_capacity_kg: 5000, hourly_capacity_kg: 200, supported_isolate_types: ["PEA"] }
              as: PlantManager
              captures: { lc_id: $.data.id }
          assert:
            - "ProductionLine.${lo_id}.certification_status == CERTIFIED and operational_status == IDLE and reserved_capacity_kg == 0"
            - "ProductionLine.${lc_id}.certification_status == PENDING and operational_status == IDLE"
            - "ProductionLine.${lc_id}.coman_partner_name == \"CoPack Industries\" and monthly_reserved_capacity_kg == 5000"

      - name: cn_ent_lot_create_initializes_remaining_and_provisional
        claim_type: Computed Fields
        grounds:
          - "entities.IngredientLot"
          - "calculations.lot_landed_unit_cost"
        distinguishing_aspect: "Lot receipt computes provisional_unit_cost_cents from the agreement base indexed by market_index_pct (0.0 -> 500, clamp inert, +40 = 540) and initializes remaining_kg to quantity_kg with qc_status QUARANTINE."
        test_recipe:
          setup: ["Supplier SUP-K-1 QUALIFIED with ACTIVE agreement."]
          setup_api_calls:
            - *k_sup_create
            - &k_sup_qualify
              call: "POST /protein-ops/suppliers/${sup_id}/transitions"
              payload: { dimension: "QUALIFICATION", target_status: "QUALIFIED", audit_score: 90 }
              as: ProcurementManager
            - &k_sup_activate
              call: "POST /protein-ops/suppliers/${sup_id}/transitions"
              payload: { dimension: "AGREEMENT", target_status: "ACTIVE" }
              as: ProcurementManager
          trigger:
            - &k_lot_create
              call: "POST /protein-ops/ingredient-lots"
              payload: { supplier_id: "${sup_id}", lot_code: "LOT-K-1", quantity_kg: 500, received_at: "2026-09-01T00:00:00Z", market_index_pct: 0.0, moisture_pct: 6.5, protein_content_pct: 82.0 }
              as: ProcurementManager
              captures: { lot_id: $.data.id }
          assert:
            - "IngredientLot.${lot_id}.provisional_unit_cost_cents == 540 (round_half_up(500 * 1.0) = 500 within [400, 540], + FREIGHT_ESTIMATE 40)"
            - "IngredientLot.${lot_id}.remaining_kg == 500 and qc_status == QUARANTINE"
            - "IngredientLot.${lot_id}.final_unit_cost_cents is null until release"
            - "Supplier.${sup_id}.open_lot_count == 1"

      - name: cn_ent_product_get_not_found_returns_404
        claim_type: Not Found
        grounds:
          - "endpoints.GET_/protein-ops/products/{id}"
          - "errors[ERR_NOT_FOUND]"
        distinguishing_aspect: "GET with a well-formed but absent UUID returns 404 with error_id ERR_NOT_FOUND in the error envelope."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - call: "GET /protein-ops/products/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              payload: {}
              as: ProductManager
              captures: { err: $.data.error_id }
          assert:
            - "response status 404, response_type error, data.error_id == ERR_NOT_FOUND, data.message non-empty"

      - name: cn_ent_program_lto_missing_required_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - "entities.GrowthProgram"
          - "validations[priority=11]"
        distinguishing_aspect: "Type-conditional required fields: a FOODSERVICE_LTO program without committed_cases (or partner_code) is rejected ERR_INVALID_REQUEST even though both keys are optional at the raw schema level."
        test_recipe:
          setup: ["Product PROD-K-9 exists (created directly, still DEVELOPMENT — program creation does not gate on product status)."]
          setup_api_calls:
            - call: "POST /protein-ops/products"
              payload: { product_code: "PROD-K-9", generation_number: 1, isolate_type: "PEA" }
              as: ProductManager
              captures: { prod_id: $.data.id }
          trigger:
            - call: "POST /protein-ops/programs"
              payload: { program_code: "PROG-BAD-1", program_type: "FOODSERVICE_LTO", product_id: "${prod_id}", window_start: "2026-09-01T00:00:00Z", window_end: "2026-10-01T00:00:00Z", partner_code: "CHAIN-Z" }
              as: ChannelManager
              captures: { err: $.data.error_id }
          assert:
            - "trigger fails 400 with ERR_INVALID_REQUEST (committed_cases missing for FOODSERVICE_LTO)"
            - "no program is persisted (GET /protein-ops/programs total_count == 0 afterwards)"

      - name: cn_ent_program_sampling_with_partner_code_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - "entities.GrowthProgram"
          - "validations[priority=11]"
        distinguishing_aspect: "Mirror conditional: SAMPLING_DEMO forbids partner_code and committed_cases — sending partner_code is ERR_INVALID_REQUEST, the symmetric failure of the LTO case."
        test_recipe:
          setup: ["Product PROD-K-9b exists."]
          setup_api_calls:
            - call: "POST /protein-ops/products"
              payload: { product_code: "PROD-K-9B", generation_number: 1, isolate_type: "PEA" }
              as: ProductManager
              captures: { prod_id: $.data.id }
          trigger:
            - call: "POST /protein-ops/programs"
              payload: { program_code: "PROG-BAD-2", program_type: "SAMPLING_DEMO", product_id: "${prod_id}", window_start: "2026-09-01T00:00:00Z", window_end: "2026-10-01T00:00:00Z", partner_code: "CHAIN-Z", budget_cents: 50000, coupons_issued: 1000 }
              as: ChannelManager
              captures: { err: $.data.error_id }
          assert:
            - "trigger fails 400 with ERR_INVALID_REQUEST (partner_code must be null for SAMPLING_DEMO)"

      - name: cn_ent_line_coman_missing_capacity_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - "entities.ProductionLine"
          - "validations[priority=11]"
        distinguishing_aspect: "CO_MAN line without monthly_reserved_capacity_kg (or coman_partner_name) is rejected; OWNED line WITH those fields is also rejected — the conditional works both directions."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - call: "POST /protein-ops/production-lines"
              payload: { line_code: "LINE-BAD-1", site_type: "CO_MAN", hourly_capacity_kg: 200, supported_isolate_types: ["PEA"] }
              as: PlantManager
              captures: { err1: $.data.error_id }
            - call: "POST /protein-ops/production-lines"
              payload: { line_code: "LINE-BAD-2", site_type: "OWNED", hourly_capacity_kg: 200, supported_isolate_types: ["PEA"], coman_partner_name: "CoPack Industries" }
              as: PlantManager
              captures: { err2: $.data.error_id }
          assert:
            - "both calls fail 400 with ERR_INVALID_REQUEST (missing co-man fields for CO_MAN; forbidden co-man fields for OWNED)"

      - name: cn_ent_supplier_code_unique_conflict
        claim_type: Type Constraints
        grounds:
          - "entities.Supplier.fields.supplier_code"
          - "errors[ERR_UNIQUE_CONSTRAINT]"
        distinguishing_aspect: "Second supplier reusing supplier_code SUP-K-1 fails 409 ERR_UNIQUE_CONSTRAINT."
        test_recipe:
          setup: ["Supplier SUP-K-1 exists."]
          setup_api_calls:
            - *k_sup_create
          trigger:
            - call: "POST /protein-ops/suppliers"
              payload: { supplier_code: "SUP-K-1", isolate_type: "SOY", committed_volume_kg: 100, base_price_per_kg_cents: 300, price_floor_cents: 250, price_cap_cents: 380, agreement_start_date: "2026-08-01T00:00:00Z", agreement_end_date: "2027-08-01T00:00:00Z" }
              as: ProcurementManager
              captures: { err: $.data.error_id }
          assert:
            - "trigger fails 409 with ERR_UNIQUE_CONSTRAINT"

      - name: cn_ent_computed_status_input_ignored
        claim_type: Computed Fields
        grounds:
          - "entities.Supplier.fields.qualification_status"
          - "endpoints.POST_/protein-ops/suppliers"
        distinguishing_aspect: "A create body that smuggles qualification_status: DISQUALIFIED is accepted but the field is ignored — the supplier still starts PENDING_AUDIT (system-owned fields are never client-set)."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - call: "POST /protein-ops/suppliers"
              payload: { supplier_code: "SUP-K-2", isolate_type: "PEA", committed_volume_kg: 10000, base_price_per_kg_cents: 500, price_floor_cents: 400, price_cap_cents: 540, agreement_start_date: "2026-08-01T00:00:00Z", agreement_end_date: "2027-08-01T00:00:00Z", qualification_status: "DISQUALIFIED" }
              as: ProcurementManager
              captures: { sup2_id: $.data.id }
          assert:
            - "response 201 and Supplier.${sup2_id}.qualification_status == PENDING_AUDIT (input ignored)"

      - name: cn_ent_list_pagination_envelope
        claim_type: Listing
        grounds:
          - "response_envelope.pagination_fields"
          - "response_envelope.pagination_defaults"
          - "endpoints.GET_/protein-ops/programs"
        distinguishing_aspect: "With three programs on file, limit=2&offset=0 returns 2 rows with total_count 3 and has_more true; offset=2 returns the last row with has_more false — total_count spans the full filtered set."
        test_recipe:
          setup: ["Product PROD-K-PG exists; three SAMPLING_DEMO programs PG-1..PG-3 created for it."]
          setup_api_calls:
            - call: "POST /protein-ops/products"
              payload: { product_code: "PROD-K-PG", generation_number: 1, isolate_type: "PEA" }
              as: ProductManager
              captures: { prod_id: $.data.id }
            - call: "POST /protein-ops/programs"
              payload: { program_code: "PG-1", program_type: "SAMPLING_DEMO", product_id: "${prod_id}", window_start: "2026-09-01T00:00:00Z", window_end: "2026-10-01T00:00:00Z", budget_cents: 10000, coupons_issued: 100 }
              as: ChannelManager
            - call: "POST /protein-ops/programs"
              payload: { program_code: "PG-2", program_type: "SAMPLING_DEMO", product_id: "${prod_id}", window_start: "2026-09-01T00:00:00Z", window_end: "2026-10-01T00:00:00Z", budget_cents: 10000, coupons_issued: 100 }
              as: ChannelManager
            - call: "POST /protein-ops/programs"
              payload: { program_code: "PG-3", program_type: "SAMPLING_DEMO", product_id: "${prod_id}", window_start: "2026-09-01T00:00:00Z", window_end: "2026-10-01T00:00:00Z", budget_cents: 10000, coupons_issued: 100 }
              as: ChannelManager
          trigger:
            - call: "GET /protein-ops/programs"
              payload: { limit: 2, offset: 0 }
              as: ChannelManager
            - call: "GET /protein-ops/programs"
              payload: { limit: 2, offset: 2 }
              as: ChannelManager
          assert:
            - "first page: response_type array, 2 data rows, total_count == 3, has_more == true"
            - "second page (offset 2): 1 data row, total_count == 3, has_more == false"

      - name: cn_ent_invalid_enum_returns_invalid_request
        claim_type: Type Constraints
        grounds:
          - "entities.Product.fields.isolate_type"
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "isolate_type \"SEAWEED\" is not a declared enum member -> 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - call: "POST /protein-ops/products"
              payload: { product_code: "PROD-BAD-E", generation_number: 1, isolate_type: "SEAWEED" }
              as: ProductManager
              captures: { err: $.data.error_id }
          assert:
            - "trigger fails 400 with ERR_INVALID_REQUEST"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: cn_sm_supplier_pending_to_suspended_returns_409
        claim_type: invalid_transition
        grounds:
          - "state_machines.Supplier (PENDING_AUDIT has no SUSPENDED edge)"
        distinguishing_aspect: "PENDING_AUDIT -> SUSPENDED is not a declared edge: the transition call fails 409 ERR_INVALID_STATE and the supplier stays PENDING_AUDIT."
        test_recipe:
          setup: ["Supplier SUP-K-3 freshly created (PENDING_AUDIT)."]
          setup_api_calls:
            - call: "POST /protein-ops/suppliers"
              payload: { supplier_code: "SUP-K-3", isolate_type: "PEA", committed_volume_kg: 100, base_price_per_kg_cents: 300, price_floor_cents: 250, price_cap_cents: 380, agreement_start_date: "2026-08-01T00:00:00Z", agreement_end_date: "2027-08-01T00:00:00Z" }
              as: ProcurementManager
              captures: { sup_id: $.data.id }
          trigger:
            - call: "POST /protein-ops/suppliers/${sup_id}/transitions"
              payload: { dimension: "QUALIFICATION", target_status: "SUSPENDED" }
              as: ProcurementManager
              captures: { err: $.data.error_id }
          assert:
            - "trigger fails 409 ERR_INVALID_STATE"
            - "Supplier.${sup_id}.qualification_status == PENDING_AUDIT and version == 1 (no mutation)"

      - name: cn_sm_supplier_disqualified_terminal_lockdown
        claim_type: terminal_lockdown
        grounds:
          - "state_machines.Supplier (DISQUALIFIED terminal)"
        distinguishing_aspect: "Once DISQUALIFIED, every further transition attempt on either dimension fails 409 ERR_INVALID_STATE."
        test_recipe:
          setup: ["Supplier SUP-K-4 QUALIFIED then DISQUALIFIED (agreement was never activated)."]
          setup_api_calls:
            - call: "POST /protein-ops/suppliers"
              payload: { supplier_code: "SUP-K-4", isolate_type: "PEA", committed_volume_kg: 100, base_price_per_kg_cents: 300, price_floor_cents: 250, price_cap_cents: 380, agreement_start_date: "2026-08-01T00:00:00Z", agreement_end_date: "2027-08-01T00:00:00Z" }
              as: ProcurementManager
              captures: { sup_id: $.data.id }
            - *k_sup_qualify
            - call: "POST /protein-ops/suppliers/${sup_id}/transitions"
              payload: { dimension: "QUALIFICATION", target_status: "DISQUALIFIED" }
              as: ProcurementManager
          trigger:
            - call: "POST /protein-ops/suppliers/${sup_id}/transitions"
              payload: { dimension: "AGREEMENT", target_status: "ACTIVE" }
              as: ProcurementManager
              captures: { err: $.data.error_id }
          assert:
            - "trigger fails 409 ERR_INVALID_STATE (agreement dimension locked because supplier is terminally DISQUALIFIED; DRAFT agreements of a disqualified supplier cannot activate)"

      - name: cn_sm_lot_release_twice_returns_409
        claim_type: idempotency
        grounds:
          - "state_machines.IngredientLot.QUARANTINE_to_RELEASED"
        distinguishing_aspect: "Releasing an already-RELEASED lot is not idempotent: the second qc-decision fails 409 ERR_INVALID_STATE and final_unit_cost_cents keeps its first value."
        test_recipe:
          setup: ["SUP-K-1 QUALIFIED/ACTIVE; LOT-K-1 released with invoiced 500 + freight 35 -> final 535."]
          setup_api_calls:
            - *k_sup_create
            - *k_sup_qualify
            - *k_sup_activate
            - *k_lot_create
            - &k_lot_release
              call: "POST /protein-ops/ingredient-lots/${lot_id}/qc-decision"
              payload: { decision: "RELEASED", invoiced_unit_cost_cents: 500, actual_freight_cents_per_kg: 35 }
              as: QualityManager
          trigger:
            - call: "POST /protein-ops/ingredient-lots/${lot_id}/qc-decision"
              payload: { decision: "RELEASED", invoiced_unit_cost_cents: 999, actual_freight_cents_per_kg: 99 }
              as: QualityManager
              captures: { err: $.data.error_id }
          assert:
            - "trigger fails 409 ERR_INVALID_STATE"
            - "IngredientLot.${lot_id}.final_unit_cost_cents == 535 (first release value retained)"
            - "Supplier.${sup_id}.delivered_volume_kg == 500 (counted exactly once)"

      - name: cn_sm_product_skip_pilot_returns_409
        claim_type: invalid_transition
        grounds:
          - "state_machines.Product (DEVELOPMENT has no ACTIVE edge)"
        distinguishing_aspect: "DEVELOPMENT -> ACTIVE is rejected even though an APPROVED label exists: the lifecycle is strictly sequential DEVELOPMENT -> PILOT -> ACTIVE."
        test_recipe:
          setup: ["Product PROD-K-5 with an APPROVED label, still DEVELOPMENT."]
          setup_api_calls:
            - &k_prod_create
              call: "POST /protein-ops/products"
              payload: { product_code: "PROD-K-5", generation_number: 1, isolate_type: "PEA" }
              as: ProductManager
              captures: { prod_id: $.data.id, prod_v: $.data.version }
            - &k_label_create
              call: "POST /protein-ops/products/${prod_id}/label-versions"
              payload: { version_number: 1, protein_g: 22, fat_g: 5, sodium_mg: 320, claims: ["HIGH_PROTEIN"], ingredient_statement: "Water, pea protein isolate" }
              as: ProductManager
              captures: { lbl_id: $.data.id }
            - &k_label_submit
              call: "POST /protein-ops/label-versions/${lbl_id}/transitions"
              payload: { target_status: "SUBMITTED" }
              as: ProductManager
            - &k_label_approve
              call: "POST /protein-ops/label-versions/${lbl_id}/transitions"
              payload: { target_status: "APPROVED", expected_product_version: "${prod_v}" }
              as: ProductManager
          trigger:
            - call: "POST /protein-ops/products/${prod_id}/lifecycle-transitions"
              payload: { target_state: "ACTIVE" }
              as: ProductManager
              captures: { err: $.data.error_id }
          assert:
            - "trigger fails 409 ERR_INVALID_STATE (must pass through PILOT first)"

      - name: cn_sm_label_approved_to_submitted_returns_409
        claim_type: invalid_transition
        grounds:
          - "state_machines.LabelVersion (APPROVED has no outbound manual edge)"
        distinguishing_aspect: "An APPROVED label cannot be sent back to SUBMITTED; only the system supersede cascade leaves APPROVED."
        test_recipe:
          setup: ["Product PROD-K-6 with label 1 APPROVED."]
          setup_api_calls:
            - call: "POST /protein-ops/products"
              payload: { product_code: "PROD-K-6", generation_number: 1, isolate_type: "PEA" }
              as: ProductManager
              captures: { prod_id: $.data.id, prod_v: $.data.version }
            - call: "POST /protein-ops/products/${prod_id}/label-versions"
              payload: { version_number: 1, protein_g: 22, fat_g: 5, sodium_mg: 320, claims: ["HIGH_PROTEIN"], ingredient_statement: "Water, pea protein isolate" }
              as: ProductManager
              captures: { lbl_id: $.data.id }
            - *k_label_submit
            - *k_label_approve
          trigger:
            - call: "POST /protein-ops/label-versions/${lbl_id}/transitions"
              payload: { target_status: "SUBMITTED" }
              as: ProductManager
              captures: { err: $.data.error_id }
          assert:
            - "trigger fails 409 ERR_INVALID_STATE"

      - name: cn_sm_forecast_actualize_before_lock_returns_409
        claim_type: invalid_transition
        grounds:
          - "state_machines.DemandForecast (ACTUALIZED only from LOCKED)"
        distinguishing_aspect: "PROVISIONAL -> ACTUALIZED skips LOCKED and fails 409; the forecast must be locked first, enforcing the provisional-vs-final discipline."
        test_recipe:
          setup: ["Product PROD-K-7 exists; forecast created (PROVISIONAL)."]
          setup_api_calls:
            - call: "POST /protein-ops/products"
              payload: { product_code: "PROD-K-7", generation_number: 1, isolate_type: "PEA" }
              as: ProductManager
              captures: { prod_id: $.data.id }
            - call: "POST /protein-ops/demand-forecasts"
              payload: { product_id: "${prod_id}", channel: "RETAIL_FROZEN", week_start: "2026-09-07T00:00:00Z", forecast_cases: 200 }
              as: DemandPlanner
              captures: { fc_id: $.data.id }
          trigger:
            - call: "POST /protein-ops/demand-forecasts/${fc_id}/transitions"
              payload: { target_status: "ACTUALIZED", actual_cases: 150 }
              as: DemandPlanner
              captures: { err: $.data.error_id }
          assert:
            - "trigger fails 409 ERR_INVALID_STATE"
            - "DemandForecast.${fc_id}.status == PROVISIONAL and variance_pct is null"

      - name: cn_sm_agreement_activate_requires_qualified
        claim_type: guarded_transition
        grounds:
          - "state_machines.Supplier.DRAFT_to_ACTIVE (agreement)"
          - "errors[ERR_AGREEMENT_REQUIRES_QUALIFIED]"
        distinguishing_aspect: "Cross-dimension guard on one entity: AGREEMENT -> ACTIVE while qualification is still PENDING_AUDIT fails 422 ERR_AGREEMENT_REQUIRES_QUALIFIED (not a plain state error)."
        test_recipe:
          setup: ["Supplier SUP-K-8 created, never qualified."]
          setup_api_calls:
            - call: "POST /protein-ops/suppliers"
              payload: { supplier_code: "SUP-K-8", isolate_type: "PEA", committed_volume_kg: 100, base_price_per_kg_cents: 300, price_floor_cents: 250, price_cap_cents: 380, agreement_start_date: "2026-08-01T00:00:00Z", agreement_end_date: "2027-08-01T00:00:00Z" }
              as: ProcurementManager
              captures: { sup_id: $.data.id }
          trigger:
            - call: "POST /protein-ops/suppliers/${sup_id}/transitions"
              payload: { dimension: "AGREEMENT", target_status: "ACTIVE" }
              as: ProcurementManager
              captures: { err: $.data.error_id }
          assert:
            - "trigger fails 422 ERR_AGREEMENT_REQUIRES_QUALIFIED"
            - "Supplier.${sup_id}.agreement_status == DRAFT"

      - name: cn_sm_label_second_approve_supersedes_first
        claim_type: side_effect_execution
        grounds:
          - "state_machines.LabelVersion.SUBMITTED_to_APPROVED"
          - "state_machines.LabelVersion.APPROVED_to_SUPERSEDED"
        distinguishing_aspect: "Approving label version 2 auto-supersedes APPROVED label version 1 on the same product and bumps product.version on each approval (1 -> 2 -> 3)."
        test_recipe:
          setup: ["Product PROD-K-9 with label v1 APPROVED; label v2 drafted and submitted."]
          setup_api_calls:
            - call: "POST /protein-ops/products"
              payload: { product_code: "PROD-K-9", generation_number: 1, isolate_type: "PEA" }
              as: ProductManager
              captures: { prod_id: $.data.id, prod_v: $.data.version }
            - call: "POST /protein-ops/products/${prod_id}/label-versions"
              payload: { version_number: 1, protein_g: 22, fat_g: 5, sodium_mg: 320, claims: ["HIGH_PROTEIN"], ingredient_statement: "Water, pea protein isolate" }
              as: ProductManager
              captures: { lbl1: $.data.id }
            - call: "POST /protein-ops/label-versions/${lbl1}/transitions"
              payload: { target_status: "SUBMITTED" }
              as: ProductManager
            - call: "POST /protein-ops/label-versions/${lbl1}/transitions"
              payload: { target_status: "APPROVED", expected_product_version: "${prod_v}" }
              as: ProductManager
            - call: "POST /protein-ops/products/${prod_id}/label-versions"
              payload: { version_number: 2, protein_g: 19, fat_g: 4, sodium_mg: 300, claims: [], ingredient_statement: "Water, pea protein isolate, cocoa butter" }
              as: ProductManager
              captures: { lbl2: $.data.id }
            - call: "POST /protein-ops/label-versions/${lbl2}/transitions"
              payload: { target_status: "SUBMITTED" }
              as: ProductManager
            - call: "GET /protein-ops/products/${prod_id}"
              payload: {}
              as: ProductManager
              captures: { prod_v2: $.data.version }
          trigger:
            - call: "POST /protein-ops/label-versions/${lbl2}/transitions"
              payload: { target_status: "APPROVED", expected_product_version: "${prod_v2}" }
              as: ProductManager
          assert:
            - "LabelVersion.${lbl2}.status == APPROVED"
            - "LabelVersion.${lbl1}.status == SUPERSEDED (auto-cascade)"
            - "Product.${prod_id}.version == 3 (two approvals bumped it twice from 1)"

      - name: cn_sm_agreement_auto_expire_on_clock
        claim_type: valid_transition
        grounds:
          - "state_machines.Supplier.ACTIVE_to_EXPIRED (system sweep)"
        excluded_because:
          difficulty_instance: "cross_entity_state_dependency / cesd_lot_release_requires_agreement_active"
          rationale: "That §1.8 instance drives the clock past agreement_end_date and asserts agreement_status == EXPIRED (sweep fired) as a setup-side assertion."

      - name: cn_sm_run_start_moves_line_running
        claim_type: side_effect_execution
        grounds:
          - "state_machines.ProductionRun.SCHEDULED_to_IN_PROGRESS"
          - "entities.ProductionLine.fields.operational_status"
        distinguishing_aspect: "Starting a run flips the line IDLE -> RUNNING as a side effect (not via operational-transitions), and the run is IN_PROGRESS."
        test_recipe:
          setup: ["Canonical chain: supplier/lot released, OWNED line, product ACTIVE with APPROVED label, FROZEN run scheduled 2026-09-05T08:00:00Z."]
          setup_api_calls:
            - *k_sup_create
            - *k_sup_qualify
            - *k_sup_activate
            - *k_lot_create
            - *k_lot_release
            - &k_line_create
              call: "POST /protein-ops/production-lines"
              payload: { line_code: "LINE-K-1", site_type: "OWNED", hourly_capacity_kg: 250, supported_isolate_types: ["PEA", "SOY"] }
              as: PlantManager
              captures: { line_id: $.data.id, line_v: $.data.version }
            - &k_prod_create2
              call: "POST /protein-ops/products"
              payload: { product_code: "PROD-K-10", generation_number: 1, isolate_type: "PEA" }
              as: ProductManager
              captures: { prod_id: $.data.id, prod_v: $.data.version }
            - *k_label_create
            - *k_label_submit
            - *k_label_approve
            - &k_prod_pilot
              call: "POST /protein-ops/products/${prod_id}/lifecycle-transitions"
              payload: { target_state: "PILOT" }
              as: ProductManager
            - &k_prod_activate
              call: "POST /protein-ops/products/${prod_id}/lifecycle-transitions"
              payload: { target_state: "ACTIVE" }
              as: ProductManager
            - &k_run_create
              call: "POST /protein-ops/production-runs"
              payload: { production_line_id: "${line_id}", product_id: "${prod_id}", label_version_id: "${lbl_id}", channel: "RETAIL_FROZEN", planned_quantity_kg: 100, scheduled_start: "2026-09-05T08:00:00Z", scheduled_end: "2026-09-05T12:00:00Z", expected_line_version: "${line_v}" }
              as: PlantManager
              captures: { run_id: $.data.id }
          trigger:
            - &k_run_start
              call: "POST /protein-ops/production-runs/${run_id}/transitions"
              payload: { target_status: "IN_PROGRESS" }
              as: PlantManager
          assert:
            - "ProductionRun.${run_id}.status == IN_PROGRESS"
            - "ProductionLine.${line_id}.operational_status == RUNNING (side effect, no separate operational call)"

      - name: cn_sm_run_complete_creates_batch_with_channel_shelf_life
        claim_type: side_effect_execution
        grounds:
          - "state_machines.ProductionRun.IN_PROGRESS_to_COMPLETED"
          - "calculations.batch_derived_status (expiry computation)"
        distinguishing_aspect: "Completing a 100 kg FROZEN run at clock 2026-09-01T00:00:00Z creates exactly one batch: 10 cases, channel copied, produced_at == completion clock, expiry_date == 2027-05-29T00:00:00Z (produced + SHELF_LIFE_DAYS_RETAIL_FROZEN 270)."
        test_recipe:
          setup: ["Canonical chain as above; run IN_PROGRESS."]
          setup_api_calls:
            - *k_sup_create
            - *k_sup_qualify
            - *k_sup_activate
            - *k_lot_create
            - *k_lot_release
            - *k_line_create
            - *k_prod_create2
            - *k_label_create
            - *k_label_submit
            - *k_label_approve
            - *k_prod_pilot
            - *k_prod_activate
            - *k_run_create
            - *k_run_start
          trigger:
            - &k_run_complete
              call: "POST /protein-ops/production-runs/${run_id}/transitions"
              payload: { target_status: "COMPLETED", actual_quantity_kg: 100 }
              as: PlantManager
            - &k_batch_lookup
              call: "GET /protein-ops/finished-goods-batches"
              payload: { production_run_id: "${run_id}" }
              as: PlantManager
              captures: { batch_id: "$.data[0].id" }
          assert:
            - "exactly one batch exists for the run (total_count == 1)"
            - "FinishedGoodsBatch.${batch_id}.quantity_cases == 10 and channel == RETAIL_FROZEN and product_id == ${prod_id}"
            - "FinishedGoodsBatch.${batch_id}.produced_at == 2026-09-01T00:00:00Z (completion clock) and expiry_date == 2027-05-29T00:00:00Z"
            - "FinishedGoodsBatch.${batch_id}.derived_status == AVAILABLE; available_cases == 10, reserved_cases == 0, written_off_cases == 0"
            - "FinishedGoodsBatch.${batch_id}.unit_cost_cents_per_case == 4548 (round_half_up(85 * 535 / 10) = round_half_up(4547.5))"
            - "ProductionRun.${run_id}.consumed_lot_ids == [${lot_id}] and required_isolate_kg == 85"

      - name: cn_sm_writedown_rejected_is_terminal
        claim_type: terminal_lockdown
        grounds:
          - "state_machines.InventoryWriteDown.PROPOSED_to_REJECTED"
        distinguishing_aspect: "A REJECTED write-down rejects every further decision with 409 ERR_INVALID_STATE."
        test_recipe:
          setup: ["Canonical RECALL write-down for 1 case, decided REJECTED by fin-1."]
          setup_api_calls:
            - *k_sup_create
            - *k_sup_qualify
            - *k_sup_activate
            - *k_lot_create
            - *k_lot_release
            - *k_line_create
            - *k_prod_create2
            - *k_label_create
            - *k_label_submit
            - *k_label_approve
            - *k_prod_pilot
            - *k_prod_activate
            - *k_run_create
            - *k_run_start
            - *k_run_complete
            - *k_batch_lookup
            - call: "POST /protein-ops/production-runs/${run_id}/transitions"
              payload: { target_status: "RECALLED" }
              as: QualityManager
            - call: "POST /protein-ops/inventory-write-downs"
              payload: { finished_goods_batch_id: "${batch_id}", quantity_cases: 1, reason: "RECALL" }
              as: DemandPlanner
              as_user_id: "planner-1"
              captures: { wd_id: $.data.id }
            - call: "POST /protein-ops/inventory-write-downs/${wd_id}/decision"
              payload: { decision: "REJECTED" }
              as: FinanceController
              as_user_id: "fin-1"
          trigger:
            - call: "POST /protein-ops/inventory-write-downs/${wd_id}/decision"
              payload: { decision: "POSTED" }
              as: FinanceController
              as_user_id: "fin-1"
              captures: { err: $.data.error_id }
          assert:
            - "trigger fails 409 ERR_INVALID_STATE"
            - "InventoryWriteDown.${wd_id}.status == REJECTED and final_amount_cents is null"
            - "FinishedGoodsBatch.${batch_id}.available_cases == 10 (rejection wrote nothing off)"

      - name: cn_sm_program_terminate_releases_reservations
        claim_type: side_effect_execution
        grounds:
          - "state_machines.GrowthProgram.ANY_NONTERMINAL_to_TERMINATED"
        excluded_because:
          difficulty_instance: "compensating_invariant / ci_batch_reserve_terminate_release"
          rationale: "The §1.8 instance asserts the release cascade and the full case-accounting invariant."

  # ===========================================================================
  - section: calculations
    instances:
      - name: cn_calc_lot_provisional_and_final_variants
        claim_type: correct_result
        grounds:
          - "calculations.lot_landed_unit_cost"
        excluded_because:
          difficulty_instance: "dual_variant_calc / dvc_lot_landed_cost_provisional_vs_final"
          rationale: "The §1.8 instance asserts both variants with exact literals (580 provisional, 555 final) including clamp and freight-estimate behavior."

      - name: cn_calc_batch_cost_half_up_boundary
        claim_type: precision
        grounds:
          - "calculations.batch_costing"
        distinguishing_aspect: "Pinned rounding order bites: per-lot integer costs 27500 (50 kg x 550) + 16905 (35 kg x 483) sum to 44405; round_half_up(44405 / 10) = 4440.5 -> 4441 (a half-even rounding would give 4440). FIFO order by received_at is also asserted."
        test_recipe:
          setup:
            - "Clock at 2026-09-01T00:00:00Z. Supplier SUP-K-11 QUALIFIED/ACTIVE. Lot A (LOT-K-A, 50 kg, received 2026-09-01) released at final 550 (invoiced 510 + freight 40). Lot B (LOT-K-B, 100 kg, received 2026-09-02) released at final 483 (invoiced 448 + freight 35)."
            - "OWNED line; product PROD-K-11 ACTIVE with APPROVED label; run of 100 kg IN_PROGRESS (needs exactly ceil(100*0.85) = 85 kg: all 50 of A then 35 of B)."
          setup_api_calls:
            - &k_clock_needed
              call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /protein-ops/suppliers"
              payload: { supplier_code: "SUP-K-11", isolate_type: "PEA", committed_volume_kg: 10000, base_price_per_kg_cents: 500, price_floor_cents: 400, price_cap_cents: 560, agreement_start_date: "2026-08-01T00:00:00Z", agreement_end_date: "2027-08-01T00:00:00Z" }
              as: ProcurementManager
              captures: { sup_id: $.data.id }
            - *k_sup_qualify
            - *k_sup_activate
            - call: "POST /protein-ops/ingredient-lots"
              payload: { supplier_id: "${sup_id}", lot_code: "LOT-K-A", quantity_kg: 50, received_at: "2026-09-01T00:00:00Z", market_index_pct: 0.0, moisture_pct: 6.5, protein_content_pct: 82.0 }
              as: ProcurementManager
              captures: { lot_a: $.data.id }
            - call: "POST /protein-ops/ingredient-lots/${lot_a}/qc-decision"
              payload: { decision: "RELEASED", invoiced_unit_cost_cents: 510, actual_freight_cents_per_kg: 40 }
              as: QualityManager
            - call: "POST /protein-ops/ingredient-lots"
              payload: { supplier_id: "${sup_id}", lot_code: "LOT-K-B", quantity_kg: 100, received_at: "2026-09-02T00:00:00Z", market_index_pct: 0.0, moisture_pct: 6.2, protein_content_pct: 83.0 }
              as: ProcurementManager
              captures: { lot_b: $.data.id }
            - call: "POST /protein-ops/ingredient-lots/${lot_b}/qc-decision"
              payload: { decision: "RELEASED", invoiced_unit_cost_cents: 448, actual_freight_cents_per_kg: 35 }
              as: QualityManager
            - *k_line_create
            - call: "POST /protein-ops/products"
              payload: { product_code: "PROD-K-11", generation_number: 1, isolate_type: "PEA" }
              as: ProductManager
              captures: { prod_id: $.data.id, prod_v: $.data.version }
            - *k_label_create
            - *k_label_submit
            - *k_label_approve
            - *k_prod_pilot
            - *k_prod_activate
            - *k_run_create
            - *k_run_start
          trigger:
            - *k_run_complete
            - *k_batch_lookup
          assert:
            - "ProductionRun.${run_id}.consumed_lot_ids == [${lot_a}, ${lot_b}] (FIFO by received_at ASC)"
            - "IngredientLot.${lot_a}.qc_status == DEPLETED and IngredientLot.${lot_b}.remaining_kg == 65"
            - "FinishedGoodsBatch.${batch_id}.unit_cost_cents_per_case == 4441 (per-lot round then sum then divide, round_half_up)"

      - name: cn_calc_parity_input_set_filtering
        claim_type: input_set_filtering
        grounds:
          - "calculations.price_parity_index"
        distinguishing_aspect: "Only RELEASED lots with remaining_kg > 0 and matching isolate enter the weighted average: a QUARANTINE lot (any cost) and a REJECTED lot are invisible, so the parity index reflects exactly the one released lot (859 cents/kg, 0.9337)."
        test_recipe:
          setup:
            - "Clock at 2026-09-01T00:00:00Z. Supplier SUP-K-12 (PEA) QUALIFIED/ACTIVE. Lot R (200 kg) RELEASED at final 555. Lot Q (100 kg) left in QUARANTINE. Lot X (50 kg) REJECTED."
            - "Product PROD-K-12 (PEA) in PILOT with APPROVED label."
          setup_api_calls:
            - *k_clock_needed
            - call: "POST /protein-ops/suppliers"
              payload: { supplier_code: "SUP-K-12", isolate_type: "PEA", committed_volume_kg: 10000, base_price_per_kg_cents: 500, price_floor_cents: 400, price_cap_cents: 560, agreement_start_date: "2026-08-01T00:00:00Z", agreement_end_date: "2027-08-01T00:00:00Z" }
              as: ProcurementManager
              captures: { sup_id: $.data.id }
            - *k_sup_qualify
            - *k_sup_activate
            - call: "POST /protein-ops/ingredient-lots"
              payload: { supplier_id: "${sup_id}", lot_code: "LOT-K-R", quantity_kg: 200, received_at: "2026-09-01T00:00:00Z", market_index_pct: 0.0, moisture_pct: 6.5, protein_content_pct: 82.0 }
              as: ProcurementManager
              captures: { lot_r: $.data.id }
            - call: "POST /protein-ops/ingredient-lots/${lot_r}/qc-decision"
              payload: { decision: "RELEASED", invoiced_unit_cost_cents: 520, actual_freight_cents_per_kg: 35 }
              as: QualityManager
            - call: "POST /protein-ops/ingredient-lots"
              payload: { supplier_id: "${sup_id}", lot_code: "LOT-K-Q", quantity_kg: 100, received_at: "2026-09-01T00:00:00Z", market_index_pct: 0.0, moisture_pct: 6.5, protein_content_pct: 82.0 }
              as: ProcurementManager
              captures: { lot_q: $.data.id }
            - call: "POST /protein-ops/ingredient-lots"
              payload: { supplier_id: "${sup_id}", lot_code: "LOT-K-X", quantity_kg: 50, received_at: "2026-09-01T00:00:00Z", market_index_pct: 0.0, moisture_pct: 6.5, protein_content_pct: 82.0 }
              as: ProcurementManager
              captures: { lot_x: $.data.id }
            - call: "POST /protein-ops/ingredient-lots/${lot_x}/qc-decision"
              payload: { decision: "REJECTED" }
              as: QualityManager
            - call: "POST /protein-ops/products"
              payload: { product_code: "PROD-K-12", generation_number: 1, isolate_type: "PEA" }
              as: ProductManager
              captures: { prod_id: $.data.id, prod_v: $.data.version }
            - *k_label_create
            - *k_label_submit
            - *k_label_approve
            - *k_prod_pilot
          trigger:
            - *k_prod_activate
          assert:
            - "Product.${prod_id}.unit_cost_per_kg_cents == 859 (only lot R counts: 555 * 1.35 = 749.25 + 110 = 859.25 -> 859)"
            - "Product.${prod_id}.price_parity_index == 0.9337 (859 / 920 at 4dp round_half_up)"
            - "the QUARANTINE and REJECTED lots moved neither the numerator nor the weight"

      - name: cn_calc_variance_miss_boundary
        claim_type: boundary_edge
        grounds:
          - "calculations.forecast_variance"
        distinguishing_aspect: "variance exactly -20.00 IS a miss (<= threshold) while -19.50 is not: two forecasts on adjacent weeks pin both sides of the inclusive boundary."
        test_recipe:
          setup: ["Product PROD-K-13 exists; forecast F1 (week 2026-09-07, 200 cases) and F2 (week 2026-09-14, 200 cases), both LOCKED."]
          setup_api_calls:
            - call: "POST /protein-ops/products"
              payload: { product_code: "PROD-K-13", generation_number: 1, isolate_type: "PEA" }
              as: ProductManager
              captures: { prod_id: $.data.id }
            - call: "POST /protein-ops/demand-forecasts"
              payload: { product_id: "${prod_id}", channel: "RETAIL_FROZEN", week_start: "2026-09-07T00:00:00Z", forecast_cases: 200 }
              as: DemandPlanner
              captures: { f1: $.data.id }
            - call: "POST /protein-ops/demand-forecasts"
              payload: { product_id: "${prod_id}", channel: "RETAIL_FROZEN", week_start: "2026-09-14T00:00:00Z", forecast_cases: 200 }
              as: DemandPlanner
              captures: { f2: $.data.id }
            - call: "POST /protein-ops/demand-forecasts/${f1}/transitions"
              payload: { target_status: "LOCKED" }
              as: DemandPlanner
            - call: "POST /protein-ops/demand-forecasts/${f2}/transitions"
              payload: { target_status: "LOCKED" }
              as: DemandPlanner
          trigger:
            - call: "POST /protein-ops/demand-forecasts/${f1}/transitions"
              payload: { target_status: "ACTUALIZED", actual_cases: 160 }
              as: DemandPlanner
            - call: "POST /protein-ops/demand-forecasts/${f2}/transitions"
              payload: { target_status: "ACTUALIZED", actual_cases: 161 }
              as: DemandPlanner
          assert:
            - "DemandForecast.${f1}.variance_pct == -20.00 and is_miss == true (inclusive boundary)"
            - "DemandForecast.${f2}.variance_pct == -19.50 and is_miss == false"

      - name: cn_calc_attainment_below_boundary_converted_fails
        claim_type: boundary_edge
        grounds:
          - "calculations.program_attainment"
          - "state_machines.GrowthProgram.EVALUATING_to_CONVERTED"
        distinguishing_aspect: "Fail side of the 85.00 boundary (the pass side is §1.8 bpc_attainment_85_exact_converts): delivered 16 of 20 computes 80.00 and CONVERTED is rejected ERR_PROGRAM_TARGET_NOT_MET."
        test_recipe:
          setup:
            - "Clock at 2026-09-01T00:00:00Z. Supplier QUALIFIED/ACTIVE with 500 kg lot released at final 535. OWNED line. Product PROD-K-14 ACTIVE with APPROVED label."
            - "LTO program PROG-K-14 (partner CHAIN-K14, window 2026-09-01..2026-10-31, committed 20) IN_WINDOW; dedicated runs of 100 kg (10 cases) and 65 kg (6 cases) completed -> delivered 16."
          setup_api_calls:
            - *k_clock_needed
            - call: "POST /protein-ops/suppliers"
              payload: { supplier_code: "SUP-K-14", isolate_type: "PEA", committed_volume_kg: 10000, base_price_per_kg_cents: 500, price_floor_cents: 400, price_cap_cents: 540, agreement_start_date: "2026-08-01T00:00:00Z", agreement_end_date: "2027-08-01T00:00:00Z" }
              as: ProcurementManager
              captures: { sup_id: $.data.id }
            - *k_sup_qualify
            - *k_sup_activate
            - *k_lot_create
            - *k_lot_release
            - *k_line_create
            - call: "POST /protein-ops/products"
              payload: { product_code: "PROD-K-14", generation_number: 1, isolate_type: "PEA" }
              as: ProductManager
              captures: { prod_id: $.data.id, prod_v: $.data.version }
            - *k_label_create
            - *k_label_submit
            - *k_label_approve
            - *k_prod_pilot
            - *k_prod_activate
            - call: "POST /protein-ops/programs"
              payload: { program_code: "PROG-K-14", program_type: "FOODSERVICE_LTO", partner_code: "CHAIN-K14", product_id: "${prod_id}", window_start: "2026-09-01T00:00:00Z", window_end: "2026-10-31T23:59:59Z", committed_cases: 20, dedicated_run_required: true }
              as: ChannelManager
              captures: { prog_id: $.data.id }
            - call: "POST /protein-ops/programs/${prog_id}/lifecycle"
              payload: { target_status: "ACTIVE" }
              as: ChannelManager
            - call: "POST /protein-ops/programs/${prog_id}/lifecycle"
              payload: { target_status: "IN_WINDOW" }
              as: ChannelManager
            - call: "POST /protein-ops/production-runs"
              payload: { production_line_id: "${line_id}", product_id: "${prod_id}", label_version_id: "${lbl_id}", program_id: "${prog_id}", channel: "FOODSERVICE", planned_quantity_kg: 100, scheduled_start: "2026-09-05T08:00:00Z", scheduled_end: "2026-09-05T12:00:00Z", expected_line_version: "${line_v}" }
              as: PlantManager
              captures: { run1: $.data.id }
            - call: "POST /protein-ops/production-runs/${run1}/transitions"
              payload: { target_status: "IN_PROGRESS" }
              as: PlantManager
            - call: "POST /protein-ops/production-runs/${run1}/transitions"
              payload: { target_status: "COMPLETED", actual_quantity_kg: 100 }
              as: PlantManager
            - call: "POST /protein-ops/production-lines/${line_id}/operational-transitions"
              payload: { target_status: "IDLE" }
              as: PlantManager
            - call: "GET /protein-ops/production-lines"
              payload: {}
              as: PlantManager
              captures: { line_v2: "$.data[0].version" }
            - call: "POST /protein-ops/production-runs"
              payload: { production_line_id: "${line_id}", product_id: "${prod_id}", label_version_id: "${lbl_id}", program_id: "${prog_id}", channel: "FOODSERVICE", planned_quantity_kg: 65, scheduled_start: "2026-09-06T08:00:00Z", scheduled_end: "2026-09-06T12:00:00Z", expected_line_version: "${line_v2}" }
              as: PlantManager
              captures: { run2: $.data.id }
            - call: "POST /protein-ops/production-runs/${run2}/transitions"
              payload: { target_status: "IN_PROGRESS" }
              as: PlantManager
            - call: "POST /protein-ops/production-runs/${run2}/transitions"
              payload: { target_status: "COMPLETED", actual_quantity_kg: 65 }
              as: PlantManager
            - call: "POST /protein-ops/programs/${prog_id}/lifecycle"
              payload: { target_status: "EVALUATING" }
              as: ChannelManager
          trigger:
            - call: "POST /protein-ops/programs/${prog_id}/lifecycle"
              payload: { target_status: "CONVERTED" }
              as: ChannelManager
              captures: { err: $.data.error_id }
          assert:
            - "GrowthProgram.${prog_id}.delivered_cases == 16 and attainment_pct == 80.00"
            - "trigger fails 422 ERR_PROGRAM_TARGET_NOT_MET; status stays EVALUATING"

      - name: cn_calc_redemption_boundary_12_exact_converts
        claim_type: boundary_edge
        grounds:
          - "calculations.sampling_redemption_rate"
        distinguishing_aspect: "Sampling branch of the conversion gate: 120 redeemed of 1000 issued is exactly 12.00 and CONVERTED succeeds — the inclusive boundary on the SAMPLING_DEMO program type."
        test_recipe:
          setup: ["Product PROD-K-15 in PILOT; SAMPLING_DEMO program PROG-K-15 (window 2026-09-01..2026-10-31, budget 50000, coupons_issued 1000) ACTIVE then IN_WINDOW at clock 2026-09-15."]
          setup_api_calls:
            - *k_clock_needed
            - call: "POST /protein-ops/products"
              payload: { product_code: "PROD-K-15", generation_number: 1, isolate_type: "PEA" }
              as: ProductManager
              captures: { prod_id: $.data.id }
            - call: "POST /protein-ops/programs"
              payload: { program_code: "PROG-K-15", program_type: "SAMPLING_DEMO", product_id: "${prod_id}", window_start: "2026-09-01T00:00:00Z", window_end: "2026-10-31T23:59:59Z", budget_cents: 50000, coupons_issued: 1000 }
              as: ChannelManager
              captures: { prog_id: $.data.id }
            - call: "POST /protein-ops/products/${prod_id}/lifecycle-transitions"
              payload: { target_state: "PILOT" }
              as: ProductManager
            - call: "POST /protein-ops/programs/${prog_id}/lifecycle"
              payload: { target_status: "ACTIVE" }
              as: ChannelManager
            - call: "POST /protein-ops/programs/${prog_id}/lifecycle"
              payload: { target_status: "IN_WINDOW" }
              as: ChannelManager
          trigger:
            - call: "POST /protein-ops/programs/${prog_id}/lifecycle"
              payload: { target_status: "EVALUATING", final_coupons_redeemed: 120 }
              as: ChannelManager
            - call: "POST /protein-ops/programs/${prog_id}/lifecycle"
              payload: { target_status: "CONVERTED" }
              as: ChannelManager
          assert:
            - "GrowthProgram.${prog_id}.coupons_redeemed == 120 and redemption_rate_pct == 12.00"
            - "GrowthProgram.${prog_id}.status == CONVERTED (12.00 >= SAMPLING_MIN_REDEMPTION_PCT 12.00 inclusive)"

      - name: cn_calc_expiry_foodservice_45_days
        claim_type: constants_applied
        grounds:
          - "calculations.batch_derived_status (expiry computation)"
          - "entities.FinishedGoodsBatch.fields.expiry_date"
        distinguishing_aspect: "Channel shelf-life constant: a FOODSERVICE batch produced 2026-09-01T00:00:00Z expires 2026-10-16T00:00:00Z (45 days), a different constant from the FROZEN 270-day case."
        test_recipe:
          setup: ["Canonical chain; run channel FOODSERVICE (non-dedicated) completed at clock 2026-09-01T00:00:00Z."]
          setup_api_calls:
            - *k_clock_needed
            - *k_sup_create
            - *k_sup_qualify
            - *k_sup_activate
            - *k_lot_create
            - *k_lot_release
            - *k_line_create
            - *k_prod_create2
            - *k_label_create
            - *k_label_submit
            - *k_label_approve
            - *k_prod_pilot
            - *k_prod_activate
            - call: "POST /protein-ops/production-runs"
              payload: { production_line_id: "${line_id}", product_id: "${prod_id}", label_version_id: "${lbl_id}", channel: "FOODSERVICE", planned_quantity_kg: 100, scheduled_start: "2026-09-05T08:00:00Z", scheduled_end: "2026-09-05T12:00:00Z", expected_line_version: "${line_v}" }
              as: PlantManager
              captures: { run_id: $.data.id }
            - *k_run_start
            - *k_run_complete
            - *k_batch_lookup
          assert:
            - "FinishedGoodsBatch.${batch_id}.channel == FOODSERVICE"
            - "FinishedGoodsBatch.${batch_id}.expiry_date == 2026-10-16T00:00:00Z (produced_at + SHELF_LIFE_DAYS_FOODSERVICE 45)"

      - name: cn_calc_audit_moisture_31_fails_certified_line
        claim_type: boundary_edge
        grounds:
          - "calculations.equivalence_audit_result"
        distinguishing_aspect: "Moisture variance 3.1 exceeds the 3.0 maximum even with a perfect texture score: a CERTIFIED line flips to SUSPENDED (fail side; the pass side at exactly 3.0 is §1.8 bpc_texture_80_moisture_30_passes)."
        test_recipe:
          setup: ["CO_MAN line LINE-K-16 certified by a passing audit (texture 90, moisture 1.0)."]
          setup_api_calls:
            - call: "POST /protein-ops/production-lines"
              payload: { line_code: "LINE-K-16", site_type: "CO_MAN", coman_partner_name: "CoPack Industries", monthly_reserved_capacity_kg: 5000, hourly_capacity_kg: 200, supported_isolate_types: ["PEA"] }
              as: PlantManager
              captures: { line_id: $.data.id }
            - call: "POST /protein-ops/production-lines/${line_id}/certification-audits"
              payload: { texture_score: 90, moisture_variance_pct: 1.0 }
              as: QualityManager
          trigger:
            - call: "POST /protein-ops/production-lines/${line_id}/certification-audits"
              payload: { texture_score: 95, moisture_variance_pct: 3.1 }
              as: QualityManager
          assert:
            - "ProductionLine.${line_id}.certification_status == SUSPENDED (moisture 3.1 > MOISTURE_VARIANCE_MAX_PCT 3.0 fails the audit despite texture 95)"
            - "ProductionLine.${line_id}.last_audit_moisture_variance_pct == 3.1"

      - name: cn_calc_capacity_exactly_at_cap_passes
        claim_type: boundary_edge
        grounds:
          - "validations[priority=10] (CO_MAN monthly capacity)"
          - "errors[ERR_CAPACITY_EXCEEDED]"
        distinguishing_aspect: "Month-bucketed capacity: 700 + 300 planned kg in September equals the 1000 kg cap and is ACCEPTED (<= inclusive); one more kg in September is rejected; 400 kg in October opens a fresh bucket and is accepted."
        test_recipe:
          setup: ["CO_MAN line LINE-K-17 certified (capacity 1000 kg/month). Product PROD-K-17 ACTIVE with APPROVED label. Run A (700 kg, 2026-09-05) already created."]
          setup_api_calls:
            - call: "POST /protein-ops/production-lines"
              payload: { line_code: "LINE-K-17", site_type: "CO_MAN", coman_partner_name: "CoPack Industries", monthly_reserved_capacity_kg: 1000, hourly_capacity_kg: 200, supported_isolate_types: ["PEA"] }
              as: PlantManager
              captures: { line_id: $.data.id, line_v0: $.data.version }
            - call: "POST /protein-ops/production-lines/${line_id}/certification-audits"
              payload: { texture_score: 90, moisture_variance_pct: 1.0 }
              as: QualityManager
            - call: "POST /protein-ops/products"
              payload: { product_code: "PROD-K-17", generation_number: 1, isolate_type: "PEA" }
              as: ProductManager
              captures: { prod_id: $.data.id, prod_v: $.data.version }
            - *k_label_create
            - *k_label_submit
            - *k_label_approve
            - *k_prod_pilot
            - *k_prod_activate
            - call: "GET /protein-ops/production-lines"
              payload: {}
              as: PlantManager
              captures: { line_v1: "$.data[0].version" }
            - call: "POST /protein-ops/production-runs"
              payload: { production_line_id: "${line_id}", product_id: "${prod_id}", label_version_id: "${lbl_id}", channel: "RETAIL_FROZEN", planned_quantity_kg: 700, scheduled_start: "2026-09-05T08:00:00Z", scheduled_end: "2026-09-05T12:00:00Z", expected_line_version: "${line_v1}" }
              as: PlantManager
              captures: { run_a: $.data.id }
          trigger:
            - call: "GET /protein-ops/production-lines"
              payload: {}
              as: PlantManager
              captures: { line_v2: "$.data[0].version" }
            - call: "POST /protein-ops/production-runs"
              payload: { production_line_id: "${line_id}", product_id: "${prod_id}", label_version_id: "${lbl_id}", channel: "RETAIL_FROZEN", planned_quantity_kg: 300, scheduled_start: "2026-09-12T08:00:00Z", scheduled_end: "2026-09-12T12:00:00Z", expected_line_version: "${line_v2}" }
              as: PlantManager
              captures: { run_b: $.data.id }
            - call: "GET /protein-ops/production-lines"
              payload: {}
              as: PlantManager
              captures: { line_v3: "$.data[0].version" }
            - call: "POST /protein-ops/production-runs"
              payload: { production_line_id: "${line_id}", product_id: "${prod_id}", label_version_id: "${lbl_id}", channel: "RETAIL_FROZEN", planned_quantity_kg: 1, scheduled_start: "2026-09-19T08:00:00Z", scheduled_end: "2026-09-19T12:00:00Z", expected_line_version: "${line_v3}" }
              as: PlantManager
              captures: { err: $.data.error_id }
            - call: "POST /protein-ops/production-runs"
              payload: { production_line_id: "${line_id}", product_id: "${prod_id}", label_version_id: "${lbl_id}", channel: "RETAIL_FROZEN", planned_quantity_kg: 400, scheduled_start: "2026-10-10T08:00:00Z", scheduled_end: "2026-10-10T12:00:00Z", expected_line_version: "${line_v3}" }
              as: PlantManager
              captures: { run_d: $.data.id }
          assert:
            - "run B (700+300 == 1000 == cap) is created — the capacity check is inclusive"
            - "run C (1000 + 1 > 1000 in September) fails 422 ERR_CAPACITY_EXCEEDED"
            - "run D (October bucket starts empty) is created with 201"

  # ===========================================================================
  - section: validations
    instances:
      - name: cn_val_missing_auth_headers_returns_unauthenticated
        claim_type: violation_to_error
        grounds:
          - "validations[priority=1]"
          - "errors[ERR_UNAUTHENTICATED]"
        distinguishing_aspect: "A call without a recognized role header (as: Anonymous means no valid X-User-Role) is rejected 401 ERR_UNAUTHENTICATED before any other check — even on a plain GET."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - call: "GET /protein-ops/products"
              payload: {}
              as: Anonymous
              captures: { err: $.data.error_id }
          assert:
            - "response status 401, data.error_id == ERR_UNAUTHENTICATED"

      - name: cn_val_wrong_role_on_qc_decision
        claim_type: violation_to_error
        grounds:
          - "validations[priority=2]"
          - "errors[ERR_UNAUTHORIZED]"
          - "endpoints.POST_/protein-ops/ingredient-lots/{id}/qc-decision"
        distinguishing_aspect: "ProcurementManager (owns lot receipt) cannot run the QC decision: 403 ERR_UNAUTHORIZED, and the lot stays QUARANTINE."
        test_recipe:
          setup: ["SUP-K-1 QUALIFIED/ACTIVE; LOT-K-1 in QUARANTINE."]
          setup_api_calls:
            - *k_sup_create
            - *k_sup_qualify
            - *k_sup_activate
            - *k_lot_create
          trigger:
            - call: "POST /protein-ops/ingredient-lots/${lot_id}/qc-decision"
              payload: { decision: "RELEASED", invoiced_unit_cost_cents: 500, actual_freight_cents_per_kg: 35 }
              as: ProcurementManager
              captures: { err: $.data.error_id }
          assert:
            - "trigger fails 403 ERR_UNAUTHORIZED"
            - "IngredientLot.${lot_id}.qc_status == QUARANTINE"

      - name: cn_val_forecast_unique_conflict
        claim_type: violation_to_error
        grounds:
          - "entities.DemandForecast"
          - "errors[ERR_UNIQUE_CONSTRAINT]"
        distinguishing_aspect: "The (product_id, channel, week_start) triple is unique: a second PROVISIONAL forecast for the same triple fails 409 ERR_UNIQUE_CONSTRAINT."
        test_recipe:
          setup: ["Product PROD-K-20 exists; forecast for (PROD-K-20, RETAIL_FROZEN, 2026-09-07) created."]
          setup_api_calls:
            - call: "POST /protein-ops/products"
              payload: { product_code: "PROD-K-20", generation_number: 1, isolate_type: "PEA" }
              as: ProductManager
              captures: { prod_id: $.data.id }
            - call: "POST /protein-ops/demand-forecasts"
              payload: { product_id: "${prod_id}", channel: "RETAIL_FROZEN", week_start: "2026-09-07T00:00:00Z", forecast_cases: 200 }
              as: DemandPlanner
          trigger:
            - call: "POST /protein-ops/demand-forecasts"
              payload: { product_id: "${prod_id}", channel: "RETAIL_FROZEN", week_start: "2026-09-07T00:00:00Z", forecast_cases: 300 }
              as: DemandPlanner
              captures: { err: $.data.error_id }
          assert:
            - "trigger fails 409 ERR_UNIQUE_CONSTRAINT (different forecast_cases does not make it a different triple)"

      - name: cn_val_isolate_not_supported
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_ISOLATE_NOT_SUPPORTED]"
          - "entities.ProductionLine.fields.supported_isolate_types"
        distinguishing_aspect: "A PEA product cannot run on a line whose supported_isolate_types is [SOY]: 422 ERR_ISOLATE_NOT_SUPPORTED at run creation."
        test_recipe:
          setup: ["OWNED line LINE-K-21 supporting only SOY; product PROD-K-21 (PEA) ACTIVE with APPROVED label."]
          setup_api_calls:
            - call: "POST /protein-ops/production-lines"
              payload: { line_code: "LINE-K-21", site_type: "OWNED", hourly_capacity_kg: 250, supported_isolate_types: ["SOY"] }
              as: PlantManager
              captures: { line_id: $.data.id, line_v: $.data.version }
            - call: "POST /protein-ops/products"
              payload: { product_code: "PROD-K-21", generation_number: 1, isolate_type: "PEA" }
              as: ProductManager
              captures: { prod_id: $.data.id, prod_v: $.data.version }
            - *k_label_create
            - *k_label_submit
            - *k_label_approve
            - *k_prod_pilot
            - *k_prod_activate
          trigger:
            - call: "POST /protein-ops/production-runs"
              payload: { production_line_id: "${line_id}", product_id: "${prod_id}", label_version_id: "${lbl_id}", channel: "RETAIL_FROZEN", planned_quantity_kg: 100, scheduled_start: "2026-09-05T08:00:00Z", scheduled_end: "2026-09-05T12:00:00Z", expected_line_version: "${line_v}" }
              as: PlantManager
              captures: { err: $.data.error_id }
          assert:
            - "trigger fails 422 ERR_ISOLATE_NOT_SUPPORTED"

      - name: cn_val_label_claim_unsupported
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_LABEL_CLAIM_UNSUPPORTED]"
          - "constants.CLAIM_HIGH_PROTEIN_MIN_PROTEIN_G"
        distinguishing_aspect: "Submitting a label claiming HIGH_PROTEIN with protein_g 18 (< 20) fails 422; the claim gate runs at SUBMITTED, not at creation."
        test_recipe:
          setup: ["Product PROD-K-22 with label v1 in DRAFT (protein_g 18, claims [HIGH_PROTEIN])."]
          setup_api_calls:
            - call: "POST /protein-ops/products"
              payload: { product_code: "PROD-K-22", generation_number: 1, isolate_type: "PEA" }
              as: ProductManager
              captures: { prod_id: $.data.id }
            - call: "POST /protein-ops/products/${prod_id}/label-versions"
              payload: { version_number: 1, protein_g: 18, fat_g: 5, sodium_mg: 320, claims: ["HIGH_PROTEIN"], ingredient_statement: "Water, pea protein isolate" }
              as: ProductManager
              captures: { lbl_id: $.data.id }
          trigger:
            - call: "POST /protein-ops/label-versions/${lbl_id}/transitions"
              payload: { target_status: "SUBMITTED" }
              as: ProductManager
              captures: { err: $.data.error_id }
          assert:
            - "trigger fails 422 ERR_LABEL_CLAIM_UNSUPPORTED"
            - "LabelVersion.${lbl_id}.status == DRAFT (unchanged)"

      - name: cn_val_label_product_mismatch
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_LABEL_PRODUCT_MISMATCH]"
        distinguishing_aspect: "A run pinning an APPROVED label that belongs to a DIFFERENT product fails 422 ERR_LABEL_PRODUCT_MISMATCH — belonging is checked independently of approval status."
        test_recipe:
          setup: ["OWNED line; product PROD-K-23A ACTIVE with APPROVED label LA; product PROD-K-23B ACTIVE with its own APPROVED label LB."]
          setup_api_calls:
            - *k_line_create
            - call: "POST /protein-ops/products"
              payload: { product_code: "PROD-K-23A", generation_number: 1, isolate_type: "PEA" }
              as: ProductManager
              captures: { prod_a: $.data.id, prod_a_v: $.data.version }
            - call: "POST /protein-ops/products/${prod_a}/label-versions"
              payload: { version_number: 1, protein_g: 22, fat_g: 5, sodium_mg: 320, claims: ["HIGH_PROTEIN"], ingredient_statement: "Water, pea protein isolate" }
              as: ProductManager
              captures: { lbl_a: $.data.id }
            - call: "POST /protein-ops/label-versions/${lbl_a}/transitions"
              payload: { target_status: "SUBMITTED" }
              as: ProductManager
            - call: "POST /protein-ops/label-versions/${lbl_a}/transitions"
              payload: { target_status: "APPROVED", expected_product_version: "${prod_a_v}" }
              as: ProductManager
            - call: "POST /protein-ops/products/${prod_a}/lifecycle-transitions"
              payload: { target_state: "PILOT" }
              as: ProductManager
            - call: "POST /protein-ops/products/${prod_a}/lifecycle-transitions"
              payload: { target_state: "ACTIVE" }
              as: ProductManager
            - call: "POST /protein-ops/products"
              payload: { product_code: "PROD-K-23B", generation_number: 1, isolate_type: "PEA" }
              as: ProductManager
              captures: { prod_b: $.data.id }
            - call: "POST /protein-ops/products/${prod_b}/lifecycle-transitions"
              payload: { target_state: "PILOT" }
              as: ProductManager
          trigger:
            - call: "POST /protein-ops/production-runs"
              payload: { production_line_id: "${line_id}", product_id: "${prod_b}", label_version_id: "${lbl_a}", channel: "RETAIL_FROZEN", planned_quantity_kg: 100, scheduled_start: "2026-09-05T08:00:00Z", scheduled_end: "2026-09-05T12:00:00Z", expected_line_version: "${line_v}" }
              as: PlantManager
              captures: { err: $.data.error_id }
          assert:
            - "product B is in PILOT (producible) and label LA is APPROVED, so the only failing gate is ownership"
            - "trigger fails 422 ERR_LABEL_PRODUCT_MISMATCH (LA belongs to product A, not B)"
            - "no run is persisted (GET /protein-ops/production-runs total_count == 0)"

      - name: cn_val_label_not_approved_on_run
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_LABEL_NOT_APPROVED]"
          - "entities.ProductionRun.fields.label_version_id"
        distinguishing_aspect: "Version-pinning on approval: a run cannot pin a label that is merely SUBMITTED — 422 ERR_LABEL_NOT_APPROVED keeps unapproved nutrition/claims off the line."
        test_recipe:
          setup: ["OWNED line; product PROD-K-24 in PILOT with label v1 SUBMITTED (never approved)."]
          setup_api_calls:
            - *k_line_create
            - call: "POST /protein-ops/products"
              payload: { product_code: "PROD-K-24", generation_number: 1, isolate_type: "PEA" }
              as: ProductManager
              captures: { prod_id: $.data.id, prod_v: $.data.version }
            - *k_label_create
            - *k_label_submit
            - *k_prod_pilot
          trigger:
            - call: "POST /protein-ops/production-runs"
              payload: { production_line_id: "${line_id}", product_id: "${prod_id}", label_version_id: "${lbl_id}", channel: "RETAIL_FROZEN", planned_quantity_kg: 100, scheduled_start: "2026-09-05T08:00:00Z", scheduled_end: "2026-09-05T12:00:00Z", expected_line_version: "${line_v}" }
              as: PlantManager
              captures: { err: $.data.error_id }
          assert:
            - "trigger fails 422 ERR_LABEL_NOT_APPROVED (label is SUBMITTED, not APPROVED)"

      - name: cn_val_program_not_accepting_runs
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_PROGRAM_NOT_ACCEPTING_RUNS]"
          - "state_machines.GrowthProgram"
        distinguishing_aspect: "A dedicated run for a program still in PROPOSED fails 422 — dedication is legal only while the program is ACTIVE or IN_WINDOW."
        test_recipe:
          setup: ["Canonical chain: product PROD-K-25 ACTIVE with APPROVED label; OWNED line; LTO program PROG-K-25 (partner CHAIN-K25, window 2026-09-01..2026-10-31, committed 10) still PROPOSED."]
          setup_api_calls:
            - *k_sup_create
            - *k_sup_qualify
            - *k_sup_activate
            - *k_line_create
            - *k_prod_create2
            - *k_label_create
            - *k_label_submit
            - *k_label_approve
            - *k_prod_pilot
            - *k_prod_activate
            - call: "POST /protein-ops/programs"
              payload: { program_code: "PROG-K-25", program_type: "FOODSERVICE_LTO", partner_code: "CHAIN-K25", product_id: "${prod_id}", window_start: "2026-09-01T00:00:00Z", window_end: "2026-10-31T23:59:59Z", committed_cases: 10, dedicated_run_required: true }
              as: ChannelManager
              captures: { prog_id: $.data.id }
          trigger:
            - call: "POST /protein-ops/production-runs"
              payload: { production_line_id: "${line_id}", product_id: "${prod_id}", label_version_id: "${lbl_id}", program_id: "${prog_id}", channel: "FOODSERVICE", planned_quantity_kg: 50, scheduled_start: "2026-09-05T08:00:00Z", scheduled_end: "2026-09-05T12:00:00Z", expected_line_version: "${line_v}" }
              as: PlantManager
              captures: { err: $.data.error_id }
          assert:
            - "trigger fails 422 ERR_PROGRAM_NOT_ACCEPTING_RUNS (program PROPOSED)"

      - name: cn_val_channel_program_mismatch
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_CHANNEL_PROGRAM_MISMATCH]"
        distinguishing_aspect: "Channel mapping is by program type: a SAMPLES-channel run dedicated to a FOODSERVICE_LTO program (or FOODSERVICE run for SAMPLING_DEMO) fails 422."
        test_recipe:
          setup: ["Canonical chain; LTO program PROG-K-26 ACTIVE (window 2026-09-01..2026-10-31, committed 10)."]
          setup_api_calls:
            - *k_sup_create
            - *k_sup_qualify
            - *k_sup_activate
            - *k_line_create
            - *k_prod_create2
            - *k_label_create
            - *k_label_submit
            - *k_label_approve
            - *k_prod_pilot
            - *k_prod_activate
            - call: "POST /protein-ops/programs"
              payload: { program_code: "PROG-K-26", program_type: "FOODSERVICE_LTO", partner_code: "CHAIN-K26", product_id: "${prod_id}", window_start: "2026-09-01T00:00:00Z", window_end: "2026-10-31T23:59:59Z", committed_cases: 10, dedicated_run_required: true }
              as: ChannelManager
              captures: { prog_id: $.data.id }
            - call: "POST /protein-ops/programs/${prog_id}/lifecycle"
              payload: { target_status: "ACTIVE" }
              as: ChannelManager
          trigger:
            - call: "POST /protein-ops/production-runs"
              payload: { production_line_id: "${line_id}", product_id: "${prod_id}", label_version_id: "${lbl_id}", program_id: "${prog_id}", channel: "SAMPLES", planned_quantity_kg: 50, scheduled_start: "2026-09-05T08:00:00Z", scheduled_end: "2026-09-05T12:00:00Z", expected_line_version: "${line_v}" }
              as: PlantManager
