  - { method: GET, path: "/central-casting/payroll-batches", description: "List payroll batches", roles: *ALL_ROLES, code: 200, input: ["limit?", "offset?", "production_id?", "status?"], output: "PayrollBatch[]", side_effects: [] }
  - { method: GET, path: "/central-casting/payroll-batches/{id}", description: "Get payroll batch", roles: *ALL_ROLES, code: 200, input: [], output: PayrollBatch, side_effects: [] }
