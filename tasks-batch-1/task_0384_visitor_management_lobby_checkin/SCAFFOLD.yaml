# =============================================================================
# Visitor Management & Lobby Check-In — benchmark seed tables (Expert band)
# =============================================================================

scenario: |
  384. Visitor Management & Lobby Check-In: pre-registration & host notification,
  ID scan & badge printing, NDA/agreement e-sign, watchlist screening,
  evacuation roster, recurring/contractor access, package/delivery log, sign-out

domain_name: visitor-management-lobby-checkin
api_prefix: /
# Flat topology: every entity is a top-level peer collection (/sites, /floors, /hosts, /visits, ...)
# linked by foreign keys; no entity is nested under another in the URL. The api_prefix is the root.

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: workflow_orchestration
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - derived_field_reconciliation
    - rate_threshold_triggers

  entity_topology: flat
  # Peer entities linked by foreign keys; Visit references Host/Floor by FK, not nested under them.

  state_machine_shape: branching
  # Visit forks at screening (CLEAR vs FLAGGED→HOLD→CLEARED/DENIED) and the ContractorPass cycles
  # ACTIVE→SUSPENDED→ACTIVE; the sign-in/sign-out lifecycle is a cyclic-capable revocation loop.

  relationship_patterns:
    - one_to_many        # Host -> Visit; Floor -> MeetingRoom; Visit -> Agreement
    - cross_aggregate    # Visit references Floor, Host, Watchlist screening result across aggregates

  role_model: segregation_of_duties
  # The Host who pre-registers a Visit cannot clear a watchlist FLAG on it (that is the
  # SecurityOfficer's exclusive duty); the LobbyAttendant who signs a visitor in cannot
  # also countersign the SecurityOfficer's watchlist clearance.

  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED — EMIT VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Site
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Site / building display name" }
      - { name: timezone, type: string, source: input, description: "IANA tz string, e.g. America/New_York", default: "UTC" }
      - { name: badge_total, type: integer, source: input, description: "Total physical badges owned by this site (badge inventory pool size)", constraints: ">= 0" }
      - { name: badge_in_use, type: integer, source: computed, description: "Count of badges currently held by SIGNED_IN visits at this site" }
      - { name: badge_available, type: integer, source: computed, description: "= badge_total - badge_in_use; conserved quantity for badge-inventory invariant" }

  - name: Floor
    parent: null
    common_fields: true
    fields:
      - { name: site_id, type: string, source: input, description: "FK -> Site.id" }
      - { name: label, type: string, source: input, description: "Floor label, e.g. 'L3'" }
      - { name: capacity, type: integer, source: input, description: "Max simultaneous on-floor occupants (visitors)", constraints: ">= 1" }
      - { name: current_occupancy, type: integer, source: computed, description: "Count of Visit rows in SIGNED_IN with this floor_id" }
      - { name: available_slots, type: integer, source: computed, description: "= capacity - current_occupancy; conserved quantity for floor-occupancy invariant" }

  - name: Host
    parent: null
    common_fields: true
    fields:
      - { name: site_id, type: string, source: input, description: "FK -> Site.id" }
      - { name: full_name, type: string, source: input, description: "Host employee full name" }
      - { name: email, type: string, source: input, description: "Host notification email; unique per site" }
      - { name: department, type: enum, source: input, description: "ENGINEERING | SALES | FACILITIES | EXECUTIVE", default: "FACILITIES" }
      - { name: notify_count, type: integer, source: computed, description: "Number of host-notification side effects fired for this host (incremented on PREREGISTERED and on SIGNED_IN)", default: 0 }

  - name: WatchlistEntry
    parent: null
    common_fields: true
    fields:
      - { name: site_id, type: string, source: input, description: "FK -> Site.id" }
      - { name: match_type, type: enum, source: input, description: "NAME | COMPANY — which visit attribute this entry screens against" }
      - { name: match_value_normalized, type: string, source: input, description: "Lowercased, trimmed value to match (visitor full_name for NAME, visitor company for COMPANY)" }
      - { name: severity, type: enum, source: input, description: "REVIEW | DENY — REVIEW routes to HOLD, DENY hard-blocks", default: "REVIEW" }
      - { name: active, type: boolean, source: input, description: "Whether this entry participates in screening", default: true }

  - name: MeetingRoom
    parent: null
    common_fields: true
    fields:
      - { name: floor_id, type: string, source: input, description: "FK -> Floor.id" }
      - { name: name, type: string, source: input, description: "Room display name" }
      - { name: seats, type: integer, source: input, description: "Seat count", constraints: ">= 1" }

  - name: ParkingSpace
    parent: null
    common_fields: true
    fields:
      - { name: site_id, type: string, source: input, description: "FK -> Site.id" }
      - { name: bay_label, type: string, source: input, description: "Bay identifier, e.g. 'P12'" }

  - name: Visit
    parent: null
    common_fields: true
    fields:
      - { name: site_id, type: string, source: input, description: "FK -> Site.id" }
      - { name: host_id, type: string, source: input, description: "FK -> Host.id; the host being visited" }
      - { name: floor_id, type: string, source: input, description: "FK -> Floor.id; floor the visitor will occupy" }
      - { name: room_id, type: string, source: input, description: "FK -> MeetingRoom.id; optional booked room for this visit (null if none)" }
      - { name: parking_space_id, type: string, source: input, description: "FK -> ParkingSpace.id; optional reserved bay (null if none)" }
      - { name: contractor_pass_id, type: string, source: input, description: "FK -> ContractorPass.id; set when this visit is covered by a recurring contractor pass (null for one-off visitors)" }
      - { name: visitor_full_name, type: string, source: input, description: "Visitor legal name (screened against NAME watchlist entries)" }
      - { name: visitor_company, type: string, source: input, description: "Visitor company (screened against COMPANY watchlist entries)" }
      - { name: scheduled_start, type: datetime, source: input, description: "Planned arrival ISO8601; used for room/parking interval and contractor window checks" }
      - { name: scheduled_end, type: datetime, source: input, description: "Planned departure ISO8601; end of room/parking interval" }
      - { name: id_scanned, type: boolean, source: input, description: "Whether a government photo ID was scanned at the kiosk", default: false }
      - { name: status, type: enum, source: system, description: "PREREGISTERED | SCREENING | FLAGGED | DENIED | CLEARED | SIGNED_IN | SIGNED_OUT — set by state machine" }
      - { name: risk_score, type: integer, source: computed, description: "Weighted screening score 0..100 (see risk_score calc); set on SCREENING evaluation" }
      - { name: sign_in_at, type: datetime, source: system, description: "Server-stamped time the visitor signed in (null until SIGNED_IN)" }
      - { name: sign_out_at, type: datetime, source: system, description: "Server-stamped time the visitor signed out (null until SIGNED_OUT)" }
      - { name: visit_duration_minutes, type: integer, source: computed, description: "Whole minutes between sign_in_at and sign_out_at, rounded up (set on SIGNED_OUT)" }
      - { name: badge_number, type: string, source: system, description: "Printed badge serial assigned on SIGNED_IN, returned on SIGNED_OUT (null otherwise)" }

  - name: Agreement
    parent: null
    common_fields: true
    fields:
      - { name: visit_id, type: string, source: input, description: "FK -> Visit.id; the visit this NDA/agreement belongs to" }
      - { name: document_kind, type: enum, source: input, description: "NDA | SAFETY_WAIVER | DATA_POLICY" }
      - { name: document_version, type: string, source: input, description: "Version label of the document presented, e.g. 'NDA-v3'" }
      - { name: status, type: enum, source: system, description: "PENDING | SIGNED | VOID — e-sign lifecycle" }
      - { name: signed_at, type: datetime, source: system, description: "Server-stamped e-signature time (null until SIGNED)" }
      - { name: signer_name, type: string, source: input, description: "Typed signer name captured at e-sign (set on SIGNED)" }

  - name: ContractorPass
    parent: null
    common_fields: true
    fields:
      - { name: host_id, type: string, source: input, description: "FK -> Host.id; sponsoring host for this recurring contractor" }
      - { name: contractor_name, type: string, source: input, description: "Recurring contractor full name (matches Visit.visitor_full_name on covered visits)" }
      - { name: contractor_company, type: string, source: input, description: "Recurring contractor company" }
      - { name: access_valid_from, type: datetime, source: input, description: "Inclusive ISO8601 start of the recurring access window" }
      - { name: access_valid_until, type: datetime, source: input, description: "Inclusive ISO8601 end of the recurring access window" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED | REVOKED — cyclic ACTIVE<->SUSPENDED, terminal REVOKED" }
      - { name: covered_visit_count, type: integer, source: computed, description: "Count of Visit rows with this contractor_pass_id that reached SIGNED_IN at least once", default: 0 }

  - name: DeliveryLog
    parent: null
    common_fields: true
    fields:
      - { name: host_id, type: string, source: input, description: "FK -> Host.id; recipient host of the package" }
      - { name: carrier, type: enum, source: input, description: "FEDEX | UPS | USPS | DHL | COURIER" }
      - { name: parcel_fees_cents, type: array, source: input, description: "Per-parcel handling fees in cents for this delivery batch (array of integers >= 0)" }
      - { name: status, type: enum, source: system, description: "RECEIVED | PICKED_UP — delivery handoff lifecycle" }
      - { name: handling_invoice_cents, type: integer, source: computed, description: "Total handling invoice in cents incl. surcharge (see delivery_handling_invoice calc); set on RECEIVED" }
      - { name: picked_up_at, type: datetime, source: system, description: "Server-stamped pickup time (null until PICKED_UP)" }

  - name: EvacuationEvent
    parent: null
    common_fields: true
    fields:
      - { name: floor_id, type: string, source: input, description: "FK -> Floor.id; floor under evacuation" }
      - { name: triggered_reason, type: enum, source: input, description: "FIRE_DRILL | FIRE_ALARM | GAS_LEAK | OTHER" }
      - { name: roster_visit_ids, type: array, source: computed, description: "Snapshot array of Visit.id that were SIGNED_IN on this floor at trigger time (ordered by Visit.sign_in_at ASC, then created_at ASC)" }
      - { name: roster_head_count, type: integer, source: computed, description: "= length of roster_visit_ids at trigger time" }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Visit
    initial_state: PREREGISTERED
    terminal_states: [DENIED, SIGNED_OUT]
    transitions:
      - from: PREREGISTERED
        to: SCREENING
        trigger: "POST /visits/{visitId}/screen"
        actor: LobbyAttendant
        preconditions:
          - "Visit.status == PREREGISTERED"
        side_effects:
          - "Compute Visit.risk_score via risk_score calc over active WatchlistEntry rows for Visit.site_id"
          - "Persist Visit.risk_score; status moves on per screening_decision (auto-advance described below)"

      - from: SCREENING
        to: CLEARED
        trigger: "POST /visits/{visitId}/screen (auto-advance when screening_decision == CLEAR)"
        actor: system
        preconditions:
          - "screening_decision evaluates to CLEAR (no active NAME/COMPANY match against visitor)"
        side_effects:
          - "status = CLEARED"

      - from: SCREENING
        to: FLAGGED
        trigger: "POST /visits/{visitId}/screen (auto-advance when screening_decision == REVIEW)"
        actor: system
        preconditions:
          - "screening_decision evaluates to REVIEW (at least one matching active WatchlistEntry with severity REVIEW and none with severity DENY)"
        side_effects:
          - "status = FLAGGED — visit parked for SecurityOfficer adjudication"

      - from: SCREENING
        to: DENIED
        trigger: "POST /visits/{visitId}/screen (auto-advance when screening_decision == DENY)"
        actor: system
        preconditions:
          - "screening_decision evaluates to DENY (at least one matching active WatchlistEntry with severity DENY)"
        side_effects:
          - "status = DENIED (terminal); no badge ever printed; any PENDING Agreement on this visit -> VOID (cascade depth 2)"

      - from: FLAGGED
        to: CLEARED
        trigger: "POST /visits/{visitId}/clearance"
        actor: SecurityOfficer
        preconditions:
          - "Visit.status == FLAGGED"
          - "Acting SecurityOfficer X-User-ID MUST NOT equal Visit.host_id (segregation of duties: a host cannot clear a flag on their own guest) -> ERR_SEGREGATION_OF_DUTIES"
          - "decision field == CLEAR"
        side_effects:
          - "status = CLEARED"

      - from: FLAGGED
        to: DENIED
        trigger: "POST /visits/{visitId}/clearance"
        actor: SecurityOfficer
        preconditions:
          - "Visit.status == FLAGGED"
          - "Acting SecurityOfficer X-User-ID MUST NOT equal Visit.host_id -> ERR_SEGREGATION_OF_DUTIES"
          - "decision field == DENY"
        side_effects:
          - "status = DENIED (terminal); any PENDING Agreement on this visit -> VOID (cascade depth 2)"

      - from: CLEARED
        to: SIGNED_IN
        trigger: "POST /visits/{visitId}/sign-in"
        actor: LobbyAttendant
        preconditions:
          - "Visit.status == CLEARED"
          - "Visit.id_scanned == true (ERR_ID_NOT_SCANNED)"
          - "All Agreement rows for this visit are SIGNED; none PENDING (ERR_AGREEMENT_NOT_SIGNED)"
          - "If Visit.contractor_pass_id is set: that ContractorPass.status == ACTIVE (ERR_PASS_NOT_ACTIVE) and Visit.scheduled_start within [access_valid_from, access_valid_until] (ERR_PASS_WINDOW)"
          - "Floor.available_slots >= 1 for Visit.floor_id (ERR_FLOOR_AT_CAPACITY)"
          - "Site.badge_available >= 1 for Visit.site_id (ERR_NO_BADGE_AVAILABLE)"
        side_effects:
          - "status = SIGNED_IN; sign_in_at = server clock; badge_number assigned"
          - "Floor.current_occupancy += 1; Floor.available_slots = capacity - current_occupancy (floor-occupancy invariant)"
          - "Site.badge_in_use += 1; Site.badge_available = badge_total - badge_in_use (badge-inventory invariant)"
          - "Host.notify_count += 1 (arrival notification)"
          - "If contractor_pass_id set and this is the visit's first SIGNED_IN: ContractorPass.covered_visit_count += 1 (cross-aggregate, cascade depth 2)"

      - from: SIGNED_IN
        to: SIGNED_OUT
        trigger: "POST /visits/{visitId}/sign-out"
        actor: LobbyAttendant
        preconditions:
          - "Visit.status == SIGNED_IN"
        side_effects:
          - "status = SIGNED_OUT (terminal); sign_out_at = server clock"
          - "visit_duration_minutes computed via visit_duration calc"
          - "Floor.current_occupancy -= 1; Floor.available_slots = capacity - current_occupancy (compensating action restores floor-occupancy invariant)"
          - "Site.badge_in_use -= 1; Site.badge_available = badge_total - badge_in_use (badge returned; compensating action restores badge-inventory invariant)"

  - entity: Agreement
    initial_state: PENDING
    terminal_states: [SIGNED, VOID]
    transitions:
      - from: PENDING
        to: SIGNED
        trigger: "POST /agreements/{agreementId}/sign"
        actor: LobbyAttendant
        preconditions:
          - "Agreement.status == PENDING"
          - "Parent Visit.status IN {PREREGISTERED, SCREENING, FLAGGED, CLEARED} (cannot sign once DENIED/SIGNED_IN/SIGNED_OUT) -> ERR_VISIT_NOT_SIGNABLE"
          - "signer_name present in request"
        side_effects:
          - "status = SIGNED; signed_at = server clock"

      - from: PENDING
        to: VOID
        trigger: "system cascade when parent Visit -> DENIED"
        actor: system
        preconditions:
          - "Parent Visit transitioned to DENIED"
        side_effects:
          - "status = VOID"

  - entity: ContractorPass
    initial_state: ACTIVE
    terminal_states: [REVOKED]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /contractor-passes/{passId}/suspend"
        actor: SecurityOfficer
        preconditions:
          - "ContractorPass.status == ACTIVE"
        side_effects:
          - "status = SUSPENDED — covered visits can no longer sign in until reactivated"

      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /contractor-passes/{passId}/reactivate"
        actor: SecurityOfficer
        preconditions:
          - "ContractorPass.status == SUSPENDED"
        side_effects:
          - "status = ACTIVE (cyclic return)"

      - from: ACTIVE
        to: REVOKED
        trigger: "POST /contractor-passes/{passId}/revoke"
        actor: SecurityOfficer
        preconditions:
          - "ContractorPass.status == ACTIVE"
        side_effects:
          - "status = REVOKED (terminal)"

      - from: SUSPENDED
        to: REVOKED
        trigger: "POST /contractor-passes/{passId}/revoke"
        actor: SecurityOfficer
        preconditions:
          - "ContractorPass.status == SUSPENDED"
        side_effects:
          - "status = REVOKED (terminal)"

  - entity: DeliveryLog
    initial_state: RECEIVED
    terminal_states: [PICKED_UP]
    transitions:
      - from: RECEIVED
        to: PICKED_UP
        trigger: "POST /deliveries/{deliveryId}/pickup"
        actor: LobbyAttendant
        preconditions:
          - "DeliveryLog.status == RECEIVED"
        side_effects:
          - "status = PICKED_UP; picked_up_at = server clock"

# -----------------------------------------------------------------------------
# 1.2.1 Concurrency Rules (OCC on parent version — narrow, per §1.2.1 filter)
# -----------------------------------------------------------------------------
concurrency_rules:
  - rule_id: signin-stale-floor
    parent_entity: Floor
    write_endpoint: "POST /visits/{visitId}/sign-in"
    occ_field: "expected_floor_version"
    description: |
      Signing a visitor in against a Floor whose version has advanced since the
      client last observed it is rejected. This captures the case where another
      sign-in (or a sign-out) has already changed the floor's occupancy and the
      acting attendant's view of the floor's available_slots is therefore stale,
      so the capacity decision would be made against an outdated headroom value.
    error_id: ERR_STALE_FLOOR_VERSION
    http_status: 412

  - rule_id: clearance-stale-visit
    parent_entity: Visit
    write_endpoint: "POST /visits/{visitId}/clearance"
    occ_field: "expected_visit_version"
    description: |
      Adjudicating a FLAGGED visit against a Visit whose version has advanced
      since the SecurityOfficer last observed it is rejected. This captures the
      case where the screening result was re-evaluated (risk_score rewritten,
      status moved) after the officer loaded the case, so the clearance decision
      would be applied to a stale view of the visit.
    error_id: ERR_STALE_VISIT_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: risk_score
    trigger: "POST /visits/{visitId}/screen (PREREGISTERED -> SCREENING side effect)"
    algorithm: weighted_scoring
    formula: |
      # Evaluated over the candidate set: WatchlistEntry rows with site_id == Visit.site_id
      # AND active == true. Matching is case-insensitive on normalized values.
      name_hit    = 1 if any active entry has match_type==NAME
                         AND match_value_normalized == lower(trim(Visit.visitor_full_name)) else 0
      company_hit = 1 if any active entry has match_type==COMPANY
                         AND match_value_normalized == lower(trim(Visit.visitor_company)) else 0
      no_photo_id = 1 if Visit.id_scanned == false else 0
      raw = NAME_HIT_WEIGHT*name_hit + COMPANY_HIT_WEIGHT*company_hit + NO_PHOTO_ID_WEIGHT*no_photo_id
      risk_score = clamp(raw, 0, 100)   # min 0, max 100
    input_set: "Active WatchlistEntry rows for Visit.site_id (active==true); plus Visit.id_scanned flag."
    constants:
      NAME_HIT_WEIGHT: 50
      COMPANY_HIT_WEIGHT: 30
      NO_PHOTO_ID_WEIGHT: 15
    precision: "integer; clamp to [0,100]"

  - name: screening_decision
    trigger: "POST /visits/{visitId}/screen — determines the auto-advance target state from SCREENING"
    algorithm: threshold
    formula: |
      # Evaluation order is PINNED and total (no circular dependency):
      #   STEP 1 compute the matching-entry set M = active WatchlistEntry rows for Visit.site_id
      #          whose (match_type, match_value_normalized) matches the visit (NAME vs visitor_full_name,
      #          COMPANY vs visitor_company).
      #   STEP 2 severity dominance: DENY strictly dominates REVIEW.
      #          if any entry in M has severity == DENY            -> decision = DENY   (-> Visit DENIED)
      #          elif any entry in M has severity == REVIEW        -> decision = REVIEW (-> Visit FLAGGED)
      #          else                                              -> decision = CLEAR  (-> Visit CLEARED)
      # risk_score (the weighted calc above) is recorded for audit but does NOT gate the decision;
      # the decision is driven purely by the dominance rule so order is well-defined and deterministic.
    input_set: "Set M of active matching WatchlistEntry rows for Visit.site_id."
    constants: {}
    precision: "categorical: one of {DENY, REVIEW, CLEAR}"
    variants:
      - name: dominance_deny_over_review
        when: "M contains both a DENY entry and a REVIEW entry"
        difference: "DENY wins; visit goes to DENIED, not FLAGGED — severity dominance is evaluated before review."

  - name: visit_duration
    trigger: "POST /visits/{visitId}/sign-out (SIGNED_IN -> SIGNED_OUT side effect)"
    algorithm: chronological
    formula: |
      elapsed_seconds = sign_out_at - sign_in_at   # both server-stamped, sign_out_at >= sign_in_at
      visit_duration_minutes = ceil(elapsed_seconds / 60)   # round UP to whole minutes
      # Boundary: elapsed_seconds == 0  -> 0 minutes (not 1).
    input_set: "Single Visit's sign_in_at and sign_out_at timestamps."
    constants:
      SECONDS_PER_MINUTE: 60
    precision: "integer minutes, round_up (ceiling)"

  - name: delivery_handling_invoice
    trigger: "POST /deliveries (RECEIVED) — sets handling_invoice_cents"
    algorithm: aggregation
    formula: |
      # Per-parcel surcharge applied, ROUNDED PER PARCEL to whole cents (round_half_up),
      # THEN summed. The rounding order is PINNED: round-per-parcel-then-sum.
      # (Summing raw then rounding once gives a different total — that order is NOT used.)
      per_parcel_total_cents = 0
      for fee_cents in DeliveryLog.parcel_fees_cents:   # array order as submitted
        surcharged = fee_cents * (1 + SURCHARGE_RATE)
        per_parcel_total_cents += round_half_up(surcharged)   # round each to integer cents
      handling_invoice_cents = per_parcel_total_cents
    input_set: "DeliveryLog.parcel_fees_cents array (one DeliveryLog)."
    constants:
      SURCHARGE_RATE: 0.075
    precision: "integer cents; round_half_up applied per parcel BEFORE summation"

  - name: contractor_billing_total
    trigger: "GET /contractor-passes/{passId}/billing (computed read)"
    algorithm: tiered_pricing
    formula: |
      # Parking fee accrued across all SIGNED_OUT visits covered by this pass.
      # Tiered on each visit's visit_duration_minutes; fee computed PER VISIT then summed (cents).
      #   minutes <= FREE_MINUTES                       -> 0
      #   FREE_MINUTES < minutes <= FREE_MINUTES+TIER2_SPAN
      #       -> ceil((minutes - FREE_MINUTES)/60) * TIER2_RATE_CENTS
      #   minutes > FREE_MINUTES+TIER2_SPAN
      #       -> (TIER2_SPAN/60)*TIER2_RATE_CENTS
      #          + ceil((minutes - FREE_MINUTES - TIER2_SPAN)/60) * TIER3_RATE_CENTS
      # candidate set: Visit rows with contractor_pass_id == pass.id AND status == SIGNED_OUT,
      # processed in sign_out_at ASC order (tie-break created_at ASC). created_at is the only
      # common-field fallback; id is never used.
      billing_total_cents = sum(per_visit_fee_cents for each covered SIGNED_OUT visit)
    input_set: "Visit rows where contractor_pass_id == pass.id AND status == SIGNED_OUT."
    constants:
      FREE_MINUTES: 60
      TIER2_SPAN: 180        # minutes 61..240 billed at TIER2
      TIER2_RATE_CENTS: 200  # $2.00 per started hour in tier 2
      TIER3_RATE_CENTS: 500  # $5.00 per started hour beyond 240 minutes
    precision: "integer cents; per-visit fee uses ceil on started hours, summed across visits"

  - name: floor_occupancy
    trigger: "any Visit sign-in / sign-out, and on EvacuationEvent trigger"
    algorithm: aggregation
    formula: |
      current_occupancy = count(Visit where floor_id == Floor.id AND status == SIGNED_IN)
      available_slots   = capacity - current_occupancy
      # Floor-occupancy invariant (conserved): capacity == current_occupancy + available_slots, always.
    input_set: "Visit rows with status == SIGNED_IN for this Floor.id."
    constants: {}
    precision: "integer counts; invariant capacity == current_occupancy + available_slots"

  - name: badge_inventory
    trigger: "any Visit sign-in (badge print) / sign-out (badge return)"
    algorithm: aggregation
    formula: |
      badge_in_use   = count(Visit where site_id == Site.id AND status == SIGNED_IN)
      badge_available = badge_total - badge_in_use
      # Badge-inventory invariant (conserved): badge_total == badge_in_use + badge_available, always.
    input_set: "Visit rows with status == SIGNED_IN for this Site.id."
    constants: {}
    precision: "integer counts; invariant badge_total == badge_in_use + badge_available"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and X-User-Role is a declared role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "Acting role is permitted to call this endpoint per §1.7 RBAC matrix"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "Path-referenced resources exist (validated left-to-right); FK bodies reference existing rows"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all

  - priority: 4
    category: business_constraint
    check: "Required body fields present and well-typed; enum values legal; numeric fields within declared constraints"
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: "all mutating endpoints"

  - priority: 5
    category: state
    check: "OCC: expected_<parent>_version equals current parent.version on the two OCC-guarded write endpoints"
    error_id: "ERR_STALE_FLOOR_VERSION / ERR_STALE_VISIT_VERSION"
    http_status: 412
    applies_to: "POST /visits/{visitId}/sign-in, POST /visits/{visitId}/clearance"

  - priority: 6
    category: state
    check: "Target resource is in a valid state for the requested transition (state machine §1.2)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all transition endpoints"

  - priority: 7
    category: business_safety
    check: "SecurityOfficer clearing/denying a FLAGGED visit must not be the visit's own host (segregation of duties)"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 409
    applies_to: "POST /visits/{visitId}/clearance"

  - priority: 8
    category: business_safety
    check: "Sign-in requires id_scanned == true"
    error_id: ERR_ID_NOT_SCANNED
    http_status: 409
    applies_to: "POST /visits/{visitId}/sign-in"

  - priority: 9
    category: business_safety
    check: "Sign-in requires all Agreement rows for the visit to be SIGNED (none PENDING)"
    error_id: ERR_AGREEMENT_NOT_SIGNED
    http_status: 409
    applies_to: "POST /visits/{visitId}/sign-in"

  - priority: 10
    category: business_referential
    check: "If visit is contractor-covered, its ContractorPass must be ACTIVE"
    error_id: ERR_PASS_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /visits/{visitId}/sign-in"

  - priority: 11
    category: business_temporal
    check: "If visit is contractor-covered, scheduled_start must fall within [access_valid_from, access_valid_until]"
    error_id: ERR_PASS_WINDOW
    http_status: 409
    applies_to: "POST /visits/{visitId}/sign-in"

  - priority: 12
    category: business_temporal
    check: "MeetingRoom booking interval [scheduled_start, scheduled_end) must not overlap an existing booking on that room; adjacency (end==start) allowed (half-open semantics, zero buffer)"
    error_id: ERR_ROOM_CONFLICT
    http_status: 409
    applies_to: "POST /visits (when room_id set), PATCH /visits/{visitId} (when room_id/schedule changed)"

  - priority: 13
    category: business_temporal
    check: "ParkingSpace reservation interval must keep a >= CLEANING_BUFFER_MINUTES (15) gap from every existing reservation on that bay; closed-interval-with-buffer semantics, adjacency NOT allowed"
    error_id: ERR_PARKING_CONFLICT
    http_status: 409
    applies_to: "POST /visits (when parking_space_id set), PATCH /visits/{visitId} (when parking_space_id/schedule changed)"

  - priority: 14
    category: business_constraint
    check: "Sign-in requires Floor.available_slots >= 1 (floor not at capacity)"
    error_id: ERR_FLOOR_AT_CAPACITY
    http_status: 409
    applies_to: "POST /visits/{visitId}/sign-in"

  - priority: 15
    category: business_constraint
    check: "Sign-in requires Site.badge_available >= 1 (a physical badge is free to print)"
    error_id: ERR_NO_BADGE_AVAILABLE
    http_status: 409
    applies_to: "POST /visits/{visitId}/sign-in"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- Site ----
  - method: POST
    path: "/sites"
    description: "Create a Site (badge inventory pool root)"
    roles: [SecurityOfficer]
    code: 201
    input: [name, "timezone?", badge_total]
    output: Site
    side_effects: ["badge_in_use=0, badge_available=badge_total"]

  - method: GET
    path: "/sites/{siteId}"
    description: "Get a Site"
    roles: [SecurityOfficer, LobbyAttendant, Host]
    code: 200
    input: []
    output: Site
    side_effects: []

  # ---- Floor ----
  - method: POST
    path: "/floors"
    description: "Create a Floor under a Site"
    roles: [SecurityOfficer]
    code: 201
    input: [site_id, label, capacity]
    output: Floor
    side_effects: ["current_occupancy=0, available_slots=capacity"]

  - method: GET
    path: "/floors/{floorId}"
    description: "Get a Floor (includes live occupancy)"
    roles: [SecurityOfficer, LobbyAttendant, Host]
    code: 200
    input: []
    output: Floor
    side_effects: []

  - method: GET
    path: "/floors"
    description: "List Floors, optionally filtered by site_id (reverse-reachability for Floor.site_id FK)"
    roles: [SecurityOfficer, LobbyAttendant, Host]
    code: 200
    input: ["site_id?", "limit?", "offset?"]
    output: Floor[]
    side_effects: []

  # ---- Host ----
  - method: POST
    path: "/hosts"
    description: "Create a Host"
    roles: [SecurityOfficer]
    code: 201
    input: [site_id, full_name, email, "department?"]
    output: Host
    side_effects: ["notify_count=0"]

  - method: GET
    path: "/hosts/{hostId}"
    description: "Get a Host (includes notify_count)"
    roles: [SecurityOfficer, LobbyAttendant, Host]
    code: 200
    input: []
    output: Host
    side_effects: []

  - method: GET
    path: "/hosts"
    description: "List Hosts, optionally filtered by site_id (reverse-reachability for Host.site_id FK)"
    roles: [SecurityOfficer, LobbyAttendant, Host]
    code: 200
    input: ["site_id?", "limit?", "offset?"]
    output: Host[]
    side_effects: []

  # ---- WatchlistEntry ----
  - method: POST
    path: "/watchlist-entries"
    description: "Create a WatchlistEntry"
    roles: [SecurityOfficer]
    code: 201
    input: [site_id, match_type, match_value_normalized, "severity?", "active?"]
    output: WatchlistEntry
    side_effects: []

  - method: GET
    path: "/watchlist-entries/{entryId}"
    description: "Get a WatchlistEntry"
    roles: [SecurityOfficer]
    code: 200
    input: []
    output: WatchlistEntry
    side_effects: []

  - method: GET
    path: "/watchlist-entries"
    description: "List WatchlistEntries, optionally filtered by site_id (reverse-reachability for WatchlistEntry.site_id FK)"
    roles: [SecurityOfficer]
    code: 200
    input: ["site_id?", "limit?", "offset?"]
    output: WatchlistEntry[]
    side_effects: []

  # ---- MeetingRoom ----
  - method: POST
    path: "/meeting-rooms"
    description: "Create a MeetingRoom on a Floor"
    roles: [SecurityOfficer]
    code: 201
    input: [floor_id, name, seats]
    output: MeetingRoom
    side_effects: []

  - method: GET
    path: "/meeting-rooms/{roomId}"
    description: "Get a MeetingRoom"
    roles: [SecurityOfficer, LobbyAttendant, Host]
    code: 200
    input: []
    output: MeetingRoom
    side_effects: []

  - method: GET
    path: "/meeting-rooms"
    description: "List MeetingRooms, optionally filtered by floor_id (reverse-reachability for MeetingRoom.floor_id FK)"
    roles: [SecurityOfficer, LobbyAttendant, Host]
    code: 200
    input: ["floor_id?", "limit?", "offset?"]
    output: MeetingRoom[]
    side_effects: []

  # ---- ParkingSpace ----
  - method: POST
    path: "/parking-spaces"
    description: "Create a ParkingSpace"
    roles: [SecurityOfficer]
    code: 201
    input: [site_id, bay_label]
    output: ParkingSpace
    side_effects: []

  - method: GET
    path: "/parking-spaces/{spaceId}"
    description: "Get a ParkingSpace"
    roles: [SecurityOfficer, LobbyAttendant, Host]
    code: 200
    input: []
    output: ParkingSpace
    side_effects: []

  - method: GET
    path: "/parking-spaces"
    description: "List ParkingSpaces, optionally filtered by site_id (reverse-reachability for ParkingSpace.site_id FK)"
    roles: [SecurityOfficer, LobbyAttendant, Host]
    code: 200
    input: ["site_id?", "limit?", "offset?"]
    output: ParkingSpace[]
    side_effects: []

  # ---- ContractorPass ----
  - method: POST
    path: "/contractor-passes"
    description: "Create a recurring ContractorPass sponsored by a Host"
    roles: [SecurityOfficer]
    code: 201
    input: [host_id, contractor_name, contractor_company, access_valid_from, access_valid_until]
    output: ContractorPass
    side_effects: ["status=ACTIVE, covered_visit_count=0"]

  - method: GET
    path: "/contractor-passes/{passId}"
    description: "Get a ContractorPass"
    roles: [SecurityOfficer, LobbyAttendant, Host]
    code: 200
    input: []
    output: ContractorPass
    side_effects: []

  - method: GET
    path: "/contractor-passes"
    description: "List ContractorPasses, optionally filtered by host_id (reverse-reachability for ContractorPass.host_id FK)"
    roles: [SecurityOfficer, LobbyAttendant, Host]
    code: 200
    input: ["host_id?", "limit?", "offset?"]
    output: ContractorPass[]
    side_effects: []

  - method: POST
    path: "/contractor-passes/{passId}/suspend"
    description: "Suspend an ACTIVE ContractorPass"
    roles: [SecurityOfficer]
    code: 200
    input: []
    output: ContractorPass
    side_effects: ["status=SUSPENDED"]

  - method: POST
    path: "/contractor-passes/{passId}/reactivate"
    description: "Reactivate a SUSPENDED ContractorPass"
    roles: [SecurityOfficer]
    code: 200
    input: []
    output: ContractorPass
    side_effects: ["status=ACTIVE"]

  - method: POST
    path: "/contractor-passes/{passId}/revoke"
    description: "Revoke a ContractorPass (terminal)"
    roles: [SecurityOfficer]
    code: 200
    input: []
    output: ContractorPass
    side_effects: ["status=REVOKED"]

  - method: GET
    path: "/contractor-passes/{passId}/billing"
    description: "Computed read: tiered parking billing total across covered SIGNED_OUT visits"
    roles: [SecurityOfficer, Host]
    code: 200
    input: []
    output: "{ pass_id: string, billing_total_cents: integer, covered_signed_out_count: integer }"
    side_effects: []

  # ---- Visit ----
  - method: POST
    path: "/visits"
    description: "Pre-register a Visit (status PREREGISTERED). Books optional room/parking and notifies host."
    roles: [Host, LobbyAttendant]
    code: 201
    input: [site_id, host_id, floor_id, "room_id?", "parking_space_id?", "contractor_pass_id?", visitor_full_name, visitor_company, scheduled_start, scheduled_end, "id_scanned?"]
    output: Visit
    side_effects:
      - "status=PREREGISTERED; risk_score=0"
      - "Room/parking interval conflict checks per §1.4 priority 12/13"
      - "Host.notify_count += 1 (pre-registration notification)"

  - method: GET
    path: "/visits/{visitId}"
    description: "Get a Visit"
    roles: [SecurityOfficer, LobbyAttendant, Host]
    code: 200
    input: []
    output: Visit
    side_effects: []

  - method: GET
    path: "/visits"
    description: "List Visits, filterable by host_id, floor_id, contractor_pass_id, room_id, parking_space_id, site_id, status (reverse-reachability for all Visit FKs)"
    roles: [SecurityOfficer, LobbyAttendant, Host]
    code: 200
    input: ["host_id?", "floor_id?", "contractor_pass_id?", "room_id?", "parking_space_id?", "site_id?", "status?", "limit?", "offset?"]
    output: Visit[]
    side_effects: []

  - method: PATCH
    path: "/visits/{visitId}"
    description: "Update a pre-registered Visit's mutable fields (room/parking/schedule/id_scanned) before screening"
    roles: [Host, LobbyAttendant]
    code: 200
    input: ["room_id?", "parking_space_id?", "scheduled_start?", "scheduled_end?", "id_scanned?"]
    output: Visit
    side_effects: ["Re-runs room/parking interval conflict checks per §1.4 priority 12/13"]

  - method: POST
    path: "/visits/{visitId}/screen"
    description: "Run watchlist screening; computes risk_score and auto-advances to CLEARED / FLAGGED / DENIED"
    roles: [LobbyAttendant, SecurityOfficer]
    code: 200
    input: []
    output: Visit
    side_effects:
      - "Computes Visit.risk_score (risk_score calc)"
      - "Auto-advances status per screening_decision; DENY cascades PENDING Agreements -> VOID"

  - method: POST
    path: "/visits/{visitId}/clearance"
    description: "SecurityOfficer adjudicates a FLAGGED visit (CLEAR or DENY). OCC-guarded on Visit.version."
    roles: [SecurityOfficer]
    code: 200
    input: [decision, expected_visit_version]
    output: Visit
    side_effects:
      - "decision==CLEAR -> status=CLEARED; decision==DENY -> status=DENIED + cascade PENDING Agreements -> VOID"
      - "increments Visit.version by 1"

  - method: POST
    path: "/visits/{visitId}/sign-in"
    description: "Sign a CLEARED visitor in: print badge, occupy floor slot, notify host. OCC-guarded on Floor.version."
    roles: [LobbyAttendant]
    code: 200
    input: [expected_floor_version]
    output: Visit
    side_effects:
      - "status=SIGNED_IN; sign_in_at set; badge_number assigned"
      - "Floor.current_occupancy += 1; Floor.available_slots recomputed; increments Floor.version by 1"
      - "Site.badge_in_use += 1; Site.badge_available recomputed"
      - "Host.notify_count += 1; first SIGNED_IN of a contractor-covered visit bumps ContractorPass.covered_visit_count"

  - method: POST
    path: "/visits/{visitId}/sign-out"
    description: "Sign a SIGNED_IN visitor out: return badge, free floor slot, compute duration"
    roles: [LobbyAttendant]
    code: 200
    input: []
    output: Visit
    side_effects:
      - "status=SIGNED_OUT; sign_out_at set; visit_duration_minutes computed"
      - "Floor.current_occupancy -= 1; Floor.available_slots recomputed (compensating)"
      - "Site.badge_in_use -= 1; Site.badge_available recomputed (compensating)"

  # ---- Agreement ----
  - method: POST
    path: "/agreements"
    description: "Attach an NDA/agreement (PENDING) to a Visit"
    roles: [Host, LobbyAttendant]
    code: 201
    input: [visit_id, document_kind, document_version]
    output: Agreement
    side_effects: ["status=PENDING"]

  - method: GET
    path: "/agreements/{agreementId}"
    description: "Get an Agreement"
    roles: [SecurityOfficer, LobbyAttendant, Host]
    code: 200
    input: []
    output: Agreement
    side_effects: []

  - method: GET
    path: "/agreements"
    description: "List Agreements, optionally filtered by visit_id (reverse-reachability for Agreement.visit_id FK)"
    roles: [SecurityOfficer, LobbyAttendant, Host]
    code: 200
    input: ["visit_id?", "limit?", "offset?"]
    output: Agreement[]
    side_effects: []

  - method: POST
    path: "/agreements/{agreementId}/sign"
    description: "E-sign a PENDING agreement"
    roles: [LobbyAttendant, Host]
    code: 200
    input: [signer_name]
    output: Agreement
    side_effects: ["status=SIGNED; signed_at set"]

  # ---- DeliveryLog ----
  - method: POST
    path: "/deliveries"
    description: "Log a received package/delivery for a Host; computes handling invoice"
    roles: [LobbyAttendant]
    code: 201
    input: [host_id, carrier, parcel_fees_cents]
    output: DeliveryLog
    side_effects: ["status=RECEIVED; handling_invoice_cents computed (delivery_handling_invoice calc)"]

  - method: GET
    path: "/deliveries/{deliveryId}"
    description: "Get a DeliveryLog"
    roles: [SecurityOfficer, LobbyAttendant, Host]
    code: 200
    input: []
    output: DeliveryLog
    side_effects: []

  - method: GET
    path: "/deliveries"
    description: "List DeliveryLogs, optionally filtered by host_id (reverse-reachability for DeliveryLog.host_id FK)"
    roles: [SecurityOfficer, LobbyAttendant, Host]
    code: 200
    input: ["host_id?", "limit?", "offset?"]
    output: DeliveryLog[]
    side_effects: []

  - method: POST
    path: "/deliveries/{deliveryId}/pickup"
    description: "Mark a RECEIVED delivery PICKED_UP"
    roles: [LobbyAttendant, Host]
    code: 200
    input: []
    output: DeliveryLog
    side_effects: ["status=PICKED_UP; picked_up_at set"]

  # ---- EvacuationEvent ----
  - method: POST
    path: "/evacuation-events"
    description: "Trigger an evacuation on a Floor; snapshots the SIGNED_IN roster"
    roles: [SecurityOfficer]
    code: 201
    input: [floor_id, triggered_reason]
    output: EvacuationEvent
    side_effects:
      - "roster_visit_ids = snapshot of SIGNED_IN Visit.ids on floor (sign_in_at ASC, created_at ASC)"
      - "roster_head_count = length of roster_visit_ids"

  - method: GET
    path: "/evacuation-events/{eventId}"
    description: "Get an EvacuationEvent (roster snapshot)"
    roles: [SecurityOfficer, LobbyAttendant]
    code: 200
    input: []
    output: EvacuationEvent
    side_effects: []

  - method: GET
    path: "/evacuation-events"
    description: "List EvacuationEvents, optionally filtered by floor_id (reverse-reachability for EvacuationEvent.floor_id FK)"
    roles: [SecurityOfficer, LobbyAttendant]
    code: 200
    input: ["floor_id?", "limit?", "offset?"]
    output: EvacuationEvent[]
    side_effects: []

  # ---- Test-driving clock endpoint (/_ namespace) ----
  - method: POST
    path: "/_clock/set"
    description: "Test-driving: set the server's current UTC clock (drives sign_in_at/sign_out_at/signed_at and contractor-window checks deterministically)"
    roles: [SecurityOfficer]
    code: 200
    input: [now_utc]
    output: "{ now_utc: string }"
    side_effects: ["Server clock pinned to now_utc for all subsequent server-stamped timestamps"]

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/invalid X-User-Role or X-User-ID headers" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Acting role not permitted for this endpoint per RBAC" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path/FK-referenced resource does not exist" }
  - { id: ERR_INVALID_REQUEST, http: 422, condition: "Missing required field, bad enum, or constraint violation (e.g. badge_total < 0)" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Resource not in a valid state for the requested transition" }
  - { id: ERR_STALE_FLOOR_VERSION, http: 412, condition: "expected_floor_version != current Floor.version on sign-in (OCC)" }
  - { id: ERR_STALE_VISIT_VERSION, http: 412, condition: "expected_visit_version != current Visit.version on clearance (OCC)" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 409, condition: "SecurityOfficer adjudicating a flag is the visit's own host" }
  - { id: ERR_ID_NOT_SCANNED, http: 409, condition: "Sign-in attempted with id_scanned == false" }
  - { id: ERR_AGREEMENT_NOT_SIGNED, http: 409, condition: "Sign-in attempted with at least one PENDING Agreement on the visit" }
  - { id: ERR_VISIT_NOT_SIGNABLE, http: 409, condition: "Agreement sign attempted while parent Visit is DENIED/SIGNED_IN/SIGNED_OUT" }
  - { id: ERR_PASS_NOT_ACTIVE, http: 409, condition: "Contractor-covered sign-in while ContractorPass not ACTIVE" }
  - { id: ERR_PASS_WINDOW, http: 409, condition: "Contractor-covered visit scheduled_start outside the pass access window" }
  - { id: ERR_ROOM_CONFLICT, http: 409, condition: "Meeting-room booking interval overlaps an existing booking (half-open, adjacency allowed)" }
  - { id: ERR_PARKING_CONFLICT, http: 409, condition: "Parking reservation within the 15-minute cleaning buffer of an existing reservation" }
  - { id: ERR_FLOOR_AT_CAPACITY, http: 409, condition: "Sign-in would exceed floor capacity (available_slots < 1)" }
  - { id: ERR_NO_BADGE_AVAILABLE, http: 409, condition: "Sign-in with no free badge (badge_available < 1)" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: SecurityOfficer
    description: "Operations/security staff. Owns site/floor/watchlist/contractor configuration and is the ONLY role that adjudicates flagged visits and triggers evacuations."
    identity: opaque
    exclusive_operations:
      - "POST /sites, POST /floors, POST /hosts, POST /watchlist-entries, POST /meeting-rooms, POST /parking-spaces"
      - "POST /contractor-passes, POST /contractor-passes/{id}/suspend|reactivate|revoke"
      - "POST /visits/{id}/clearance — clear/deny FLAGGED visits (segregation of duties enforced)"
      - "POST /evacuation-events — trigger evacuation roster snapshot"
      - "POST /_clock/set"
    shared_operations:
      - "GET on all collections and resources"
      - "POST /visits/{id}/screen (shared with LobbyAttendant)"

  - name: LobbyAttendant
    description: "Front-desk kiosk operator. Pre-registers visitors, runs screening, signs visitors in/out, signs agreements, logs deliveries. Cannot adjudicate flags or alter security configuration."
    identity: opaque
    exclusive_operations:
      - "POST /visits/{id}/sign-in, POST /visits/{id}/sign-out"
      - "POST /deliveries"
    shared_operations:
      - "POST /visits (shared with Host)"
      - "PATCH /visits/{id} (shared with Host)"
      - "POST /visits/{id}/screen (shared with SecurityOfficer)"
      - "POST /agreements, POST /agreements/{id}/sign (shared with Host)"
      - "POST /deliveries/{id}/pickup (shared with Host)"
      - "GET on visit/host/floor/room/parking/agreement/delivery/evacuation resources"

  - name: Host
    description: "Employee being visited. Pre-registers their own guests, attaches/signs agreements, picks up their deliveries, reads their billing. Backed by the Host entity: X-User-ID equals a Host.id."
    identity: "entity_backed:Host"
    exclusive_operations: []
    shared_operations:
      - "POST /visits (shared with LobbyAttendant)"
      - "PATCH /visits/{id} (shared with LobbyAttendant)"
      - "POST /agreements, POST /agreements/{id}/sign (shared with LobbyAttendant)"
      - "POST /deliveries/{id}/pickup (shared with LobbyAttendant)"
      - "GET /contractor-passes/{id}/billing (shared with SecurityOfficer)"
      - "GET on visit/host/floor/room/parking/agreement/delivery resources"
