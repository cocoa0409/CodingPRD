    code: 200
    input: []
    output: PollingPlace
    side_effects: []
  - method: GET
    path: "/polling-places"
    description: "List polling places; filterable by election."
    roles: [ElectionAdmin, PrecinctCaptain, CustodyOfficer, SupportAgent, PollWorker]
    code: 200
    input: ["election_id?", "limit?", "offset?"]
    output: PollingPlace[]
    side_effects: []
  - method: POST
    path: "/polling-places/{id}/open"
    description: "Open the place for voting (enforces safety, equipment, quorum)."
    roles: [PrecinctCaptain]
    code: 200
    input: []
    output: PollingPlace
    side_effects: ["posture SETUP -> OPEN", "increments PollingPlace.version by 1"]
  - method: POST
    path: "/polling-places/{id}/suspend"
    description: "Suspend an open place."
    roles: [PrecinctCaptain]
    code: 200
    input: ["reason?"]
    output: PollingPlace
    side_effects: ["posture OPEN -> SUSPENDED", "increments PollingPlace.version by 1"]
  - method: POST
    path: "/polling-places/{id}/resume"
    description: "Resume a suspended place (re-checks equipment and custody)."
    roles: [PrecinctCaptain]
    code: 200
    input: []
    output: PollingPlace
    side_effects: ["posture SUSPENDED -> OPEN", "increments PollingPlace.version by 1"]
  - method: POST
    path: "/polling-places/{id}/close"
    description: "Close the place; auto checks-out active shifts."
    roles: [PrecinctCaptain]
    code: 200
    input: []
    output: PollingPlace
    side_effects: ["posture -> CLOSED", "cascade checks out CHECKED_IN shifts", "increments PollingPlace.version by 1"]
  - method: POST
    path: "/polling-places/{id}/reconcile"
    description: "Submit results-return reconciliation (re-runnable, OCC-guarded)."
    roles: [PrecinctCaptain]
    code: 200
    input: [scanner_tally, epollbook_checkins, "spoiled_count?", "explanation?", expected_polling_place_version]
    output: PollingPlace
    side_effects: ["set scanner_tally/epollbook_checkins/spoiled_count", "compute reconciliation_discrepancy and reconciliation_status", "posture CLOSED/RECONCILED -> RECONCILED", "increments PollingPlace.version by 1"]

  - method: POST
    path: "/equipment"
    description: "Create an equipment unit in the warehouse."
    roles: [ElectionAdmin]
    code: 201
    input: [equipment_type, serial_number]
    output: EquipmentUnit
    side_effects: []
  - method: GET
    path: "/equipment/{id}"
    description: "Fetch an equipment unit."
    roles: [ElectionAdmin, PrecinctCaptain, CustodyOfficer, SupportAgent, PollWorker]
    code: 200
    input: []
    output: EquipmentUnit
    side_effects: []
  - method: GET
    path: "/equipment"
    description: "List equipment; filterable by polling place."
    roles: [ElectionAdmin, PrecinctCaptain, CustodyOfficer, SupportAgent, PollWorker]
    code: 200
    input: ["polling_place_id?", "limit?", "offset?"]
    output: EquipmentUnit[]
    side_effects: []
