# =============================================================================
# §1.9 Scaffold Corner Design — Coverage Index for Non-Difficulty Tests
# Task 1416: Seasonal Tree & Holiday Material Recycling
# Shared fixture dates: window 2027-01-02T00:00:00Z .. 2027-01-16T23:59:59Z
# =============================================================================
scaffold_corner_design:
  # ---------------------------------------------------------------------------
  - section: entities
    instances:
      - name: create_applies_declared_defaults
        claim_type: defaults
        grounds:
          - "entities.DropOffSite.fields.volunteer_slots_per_role"
          - "entities.Program.fields.target_diversion_rate"
          - "entities.Household.fields.strike_count"
        distinguishing_aspect: "Omitting defaulted inputs yields the declared defaults; computed counters start at zero."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "TreeCycle 2027", season_label: "Winter 2027", window_start: "2027-01-02T00:00:00Z", window_end: "2027-01-16T23:59:59Z" }
              as: ProgramAdmin
              captures: { pid: $.data.id }
            - call: "POST /sites"
              payload: { program_id: "${pid}", name: "North Lot", address: "1 Pine Ave", capacity_cy: 100, open_date: "2027-01-02T00:00:00Z", close_date: "2027-01-16T23:59:59Z" }
              as: ProgramAdmin
              captures: { sid: $.data.id }
            - call: "POST /zones"
              payload: { program_id: "${pid}", zone_code: "NW-1", collection_date: "2027-01-09T00:00:00Z", daily_tree_capacity: 5 }
              as: ProgramAdmin
              captures: { zid: $.data.id }
            - call: "POST /households"
              payload: { program_id: "${pid}", zone_id: "${zid}", address: "10 Oak St", contact_email: "h1@x.com" }
              as: Anonymous
              captures: { h1: $.data.id }
          trigger:
            - call: "GET /sites/${sid}"
              as: ProgramAdmin
          assert:
            - "Program.${pid}.target_diversion_rate == 0.9 (default applied), status == DRAFT, posture == NORMAL, version == 1"
            - "DropOffSite.${sid}.volunteer_slots_per_role == 3 (default applied), status == PLANNED, stockpile_cy == 0"
            - "Household.${h1}.strike_count == 0 and curbside_eligible == true"

      - name: booking_missing_required_field_returns_invalid_request
        claim_type: required_fields
        grounds:
          - "entities.CurbsideBooking.fields.prep_attestation"
          - "errors[ERR_VALIDATION]"
        distinguishing_aspect: "A booking create missing the required prep_attestation field fails with ERR_VALIDATION (400), distinct from attestation=false."
        test_recipe:
          setup: ["Program ACTIVE; zone and household exist"]
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "TreeCycle 2027", season_label: "Winter 2027", window_start: "2027-01-02T00:00:00Z", window_end: "2027-01-16T23:59:59Z" }
              as: ProgramAdmin
              captures: { pid: $.data.id, p_v: $.data.version }
            - call: "POST /sites"
              payload: { program_id: "${pid}", name: "North Lot", address: "1 Pine Ave", capacity_cy: 100, open_date: "2027-01-02T00:00:00Z", close_date: "2027-01-16T23:59:59Z" }
              as: ProgramAdmin
            - call: "POST /zones"
              payload: { program_id: "${pid}", zone_code: "NW-1", collection_date: "2027-01-09T00:00:00Z", daily_tree_capacity: 5 }
              as: ProgramAdmin
              captures: { zid: $.data.id }
            - call: "PATCH /programs/${pid}"
              payload: { status: "PUBLISHED", expected_program_version: "${p_v}" }
              as: ProgramAdmin
              captures: { p_v2: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-01-02T00:00:00Z" }
              as: ProgramAdmin
            - call: "PATCH /programs/${pid}"
              payload: { status: "ACTIVE", expected_program_version: "${p_v2}" }
              as: ProgramAdmin
            - call: "POST /households"
              payload: { program_id: "${pid}", zone_id: "${zid}", address: "10 Oak St", contact_email: "h1@x.com" }
              as: Anonymous
              captures: { h1: $.data.id }
          trigger:
            - call: "POST /bookings"
              payload: { household_id: "${h1}", zone_id: "${zid}", tree_count: 1, size_class: "SMALL" }
              as: Resident
              as_user_id: "${h1}"
              captures: { e: $.data.error_id }
          assert:
            - "error_id == ERR_VALIDATION, http status 400"

      - name: prep_attestation_false_rejected
        claim_type: type_constraints
        grounds:
          - "validations[priority=7]"
          - "errors[ERR_PREP_ATTESTATION_REQUIRED]"
        distinguishing_aspect: "prep_attestation present but false trips the compliance rule (422), not the request-shape rule (400)."
        test_recipe:
          setup: ["Program ACTIVE; zone and household exist"]
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "TreeCycle 2027", season_label: "Winter 2027", window_start: "2027-01-02T00:00:00Z", window_end: "2027-01-16T23:59:59Z" }
              as: ProgramAdmin
              captures: { pid: $.data.id, p_v: $.data.version }
            - call: "POST /sites"
              payload: { program_id: "${pid}", name: "North Lot", address: "1 Pine Ave", capacity_cy: 100, open_date: "2027-01-02T00:00:00Z", close_date: "2027-01-16T23:59:59Z" }
              as: ProgramAdmin
            - call: "POST /zones"
              payload: { program_id: "${pid}", zone_code: "NW-1", collection_date: "2027-01-09T00:00:00Z", daily_tree_capacity: 5 }
              as: ProgramAdmin
              captures: { zid: $.data.id }
            - call: "PATCH /programs/${pid}"
              payload: { status: "PUBLISHED", expected_program_version: "${p_v}" }
              as: ProgramAdmin
              captures: { p_v2: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-01-02T00:00:00Z" }
              as: ProgramAdmin
            - call: "PATCH /programs/${pid}"
              payload: { status: "ACTIVE", expected_program_version: "${p_v2}" }
              as: ProgramAdmin
            - call: "POST /households"
              payload: { program_id: "${pid}", zone_id: "${zid}", address: "10 Oak St", contact_email: "h1@x.com" }
              as: Anonymous
              captures: { h1: $.data.id }
          trigger:
            - call: "POST /bookings"
              payload: { household_id: "${h1}", zone_id: "${zid}", tree_count: 1, size_class: "SMALL", prep_attestation: false }
              as: Resident
              as_user_id: "${h1}"
              captures: { e: $.data.error_id }
          assert:
            - "error_id == ERR_PREP_ATTESTATION_REQUIRED (422); no booking is created (GET /bookings?household_id=${h1} is empty)"

      - name: booking_get_not_found_returns_404
        claim_type: not_found
        grounds:
          - "errors[ERR_NOT_FOUND]"
          - "validations[priority=4]"
        distinguishing_aspect: "GET on a well-formed but unknown booking id returns the catalog not-found error."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - call: "GET /bookings/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              as: ProgramAdmin
              captures: { e: $.data.error_id }
          assert:
            - "error_id == ERR_NOT_FOUND, http status 404; envelope response_type == error"

      - name: create_with_system_fields_input_ignored
        claim_type: system_fields
        grounds:
          - "entities.Program.fields.status"
          - "errors[ERR_VALIDATION]"
        distinguishing_aspect: "Client-supplied id/version/status on create are ignored; the server mints id and forces status=DRAFT, version=1."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /programs"
              payload: { name: "TreeCycle 2027", season_label: "Winter 2027", window_start: "2027-01-02T00:00:00Z", window_end: "2027-01-16T23:59:59Z", id: "8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", version: 99, status: "ACTIVE" }
              as: ProgramAdmin
              captures: { pid: $.data.id }
          assert:
            - "201 created; Program.${pid}.id != 8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2 (client id ignored)"
            - "Program.${pid}.status == DRAFT and version == 1 (client system fields ignored)"

  # ---------------------------------------------------------------------------
  - section: state_machines
    instances:
      - name: cancel_serviced_booking_returns_invalid_state
        claim_type: invalid_transition
        grounds:
          - "state_machines.CurbsideBooking"
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "SERVICED is terminal for cancel; the attempt fails and nothing changes."
        test_recipe:
          setup: ["Program ACTIVE; H1 booking SERVICED"]
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "TreeCycle 2027", season_label: "Winter 2027", window_start: "2027-01-02T00:00:00Z", window_end: "2027-01-16T23:59:59Z" }
              as: ProgramAdmin
              captures: { pid: $.data.id, p_v: $.data.version }
            - call: "POST /sites"
              payload: { program_id: "${pid}", name: "North Lot", address: "1 Pine Ave", capacity_cy: 100, open_date: "2027-01-02T00:00:00Z", close_date: "2027-01-16T23:59:59Z" }
              as: ProgramAdmin
            - call: "POST /zones"
              payload: { program_id: "${pid}", zone_code: "NW-1", collection_date: "2027-01-09T00:00:00Z", daily_tree_capacity: 5 }
              as: ProgramAdmin
              captures: { zid: $.data.id }
            - call: "PATCH /programs/${pid}"
              payload: { status: "PUBLISHED", expected_program_version: "${p_v}" }
              as: ProgramAdmin
              captures: { p_v2: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-01-02T00:00:00Z" }
              as: ProgramAdmin
            - call: "PATCH /programs/${pid}"
              payload: { status: "ACTIVE", expected_program_version: "${p_v2}" }
              as: ProgramAdmin
            - call: "POST /households"
              payload: { program_id: "${pid}", zone_id: "${zid}", address: "10 Oak St", contact_email: "h1@x.com" }
              as: Anonymous
              captures: { h1: $.data.id }
            - call: "POST /bookings"
              payload: { household_id: "${h1}", zone_id: "${zid}", tree_count: 1, size_class: "SMALL", prep_attestation: true }
              as: Resident
              as_user_id: "${h1}"
              captures: { b1: $.data.id }
            - call: "POST /bookings/${b1}/record-outcome"
              payload: { outcome: "SERVICED" }
              as: SiteSupervisor
          trigger:
            - call: "POST /bookings/${b1}/cancel"
              payload: {}
              as: Resident
              as_user_id: "${h1}"
              captures: { e: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE (409); CurbsideBooking.${b1}.status remains SERVICED"

      - name: closed_site_terminal_lockdown
        claim_type: terminal_state_lockdown
        grounds:
          - "state_machines.DropOffSite"
        distinguishing_aspect: "A CLOSED site rejects every further transition (reopen attempt fails with ERR_INVALID_STATE)."
        test_recipe:
          setup: ["Program ACTIVE; site OPEN with zero stockpile and no tickets, moved CLOSING then CLOSED"]
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "TreeCycle 2027", season_label: "Winter 2027", window_start: "2027-01-02T00:00:00Z", window_end: "2027-01-16T23:59:59Z" }
              as: ProgramAdmin
              captures: { pid: $.data.id, p_v: $.data.version }
            - call: "POST /sites"
              payload: { program_id: "${pid}", name: "North Lot", address: "1 Pine Ave", capacity_cy: 100, open_date: "2027-01-02T00:00:00Z", close_date: "2027-01-16T23:59:59Z" }
              as: ProgramAdmin
              captures: { sid: $.data.id, s_v: $.data.version }
            - call: "POST /zones"
              payload: { program_id: "${pid}", zone_code: "NW-1", collection_date: "2027-01-09T00:00:00Z", daily_tree_capacity: 5 }
              as: ProgramAdmin
            - call: "PATCH /programs/${pid}"
              payload: { status: "PUBLISHED", expected_program_version: "${p_v}" }
              as: ProgramAdmin
              captures: { p_v2: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-01-02T00:00:00Z" }
              as: ProgramAdmin
            - call: "PATCH /programs/${pid}"
              payload: { status: "ACTIVE", expected_program_version: "${p_v2}" }
              as: ProgramAdmin
            - call: "PATCH /sites/${sid}"
              payload: { status: "OPEN", expected_site_version: "${s_v}" }
              as: ProgramAdmin
              captures: { s_v2: $.data.version }
            - call: "PATCH /sites/${sid}"
              payload: { status: "CLOSING", expected_site_version: "${s_v2}" }
              as: ProgramAdmin
              captures: { s_v3: $.data.version }
            - call: "PATCH /sites/${sid}"
              payload: { status: "CLOSED", expected_site_version: "${s_v3}" }
              as: ProgramAdmin
              captures: { s_v4: $.data.version }
          trigger:
            - call: "PATCH /sites/${sid}"
              payload: { status: "OPEN", expected_site_version: "${s_v4}" }
              as: ProgramAdmin
              captures: { e: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE (409); DropOffSite.${sid}.status remains CLOSED"

      - name: appeal_dismissed_ticket_returns_invalid_state
        claim_type: terminal_state_lockdown
        grounds:
          - "state_machines.ContaminationTicket"
        distinguishing_aspect: "DISMISSED is terminal; appeal is declared only from UPHELD, so the appeal fails."
        test_recipe:
          setup: ["Program ACTIVE; ticket on H1's CONFIRMED booking adjudicated DISMISSED"]
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "TreeCycle 2027", season_label: "Winter 2027", window_start: "2027-01-02T00:00:00Z", window_end: "2027-01-16T23:59:59Z" }
              as: ProgramAdmin
              captures: { pid: $.data.id, p_v: $.data.version }
            - call: "POST /sites"
              payload: { program_id: "${pid}", name: "North Lot", address: "1 Pine Ave", capacity_cy: 100, open_date: "2027-01-02T00:00:00Z", close_date: "2027-01-16T23:59:59Z" }
              as: ProgramAdmin
            - call: "POST /zones"
              payload: { program_id: "${pid}", zone_code: "NW-1", collection_date: "2027-01-09T00:00:00Z", daily_tree_capacity: 5 }
              as: ProgramAdmin
              captures: { zid: $.data.id }
            - call: "PATCH /programs/${pid}"
              payload: { status: "PUBLISHED", expected_program_version: "${p_v}" }
              as: ProgramAdmin
              captures: { p_v2: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-01-02T00:00:00Z" }
              as: ProgramAdmin
            - call: "PATCH /programs/${pid}"
              payload: { status: "ACTIVE", expected_program_version: "${p_v2}" }
              as: ProgramAdmin
            - call: "POST /households"
              payload: { program_id: "${pid}", zone_id: "${zid}", address: "10 Oak St", contact_email: "h1@x.com" }
              as: Anonymous
              captures: { h1: $.data.id }
            - call: "POST /bookings"
              payload: { household_id: "${h1}", zone_id: "${zid}", tree_count: 1, size_class: "SMALL", prep_attestation: true }
              as: Resident
              as_user_id: "${h1}"
              captures: { b1: $.data.id }
            - call: "POST /contamination-tickets"
              payload: { program_id: "${pid}", booking_id: "${b1}", category: "OTHER" }
              as: SiteSupervisor
              as_user_id: sup_1
              captures: { t1: $.data.id }
            - call: "POST /contamination-tickets/${t1}/adjudicate"
              payload: { verdict: "DISMISSED" }
              as: ProgramAdmin
              as_user_id: admin_1
          trigger:
            - call: "POST /contamination-tickets/${t1}/appeal"
              payload: {}
              as: Resident
              as_user_id: "${h1}"
              captures: { e: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE (409); ContaminationTicket.${t1}.status remains DISMISSED"

      - name: program_double_publish_returns_invalid_state
        claim_type: invalid_transition
        grounds:
          - "state_machines.Program"
        distinguishing_aspect: "PUBLISHED -> PUBLISHED is not a declared transition; the second publish fails."
        test_recipe:
          setup: ["Program with one site and one zone, already PUBLISHED"]
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "TreeCycle 2027", season_label: "Winter 2027", window_start: "2027-01-02T00:00:00Z", window_end: "2027-01-16T23:59:59Z" }
              as: ProgramAdmin
              captures: { pid: $.data.id, p_v: $.data.version }
            - call: "POST /sites"
              payload: { program_id: "${pid}", name: "North Lot", address: "1 Pine Ave", capacity_cy: 100, open_date: "2027-01-02T00:00:00Z", close_date: "2027-01-16T23:59:59Z" }
              as: ProgramAdmin
            - call: "POST /zones"
              payload: { program_id: "${pid}", zone_code: "NW-1", collection_date: "2027-01-09T00:00:00Z", daily_tree_capacity: 5 }
              as: ProgramAdmin
            - call: "PATCH /programs/${pid}"
              payload: { status: "PUBLISHED", expected_program_version: "${p_v}" }
              as: ProgramAdmin
              captures: { p_v2: $.data.version }
          trigger:
            - call: "PATCH /programs/${pid}"
              payload: { status: "PUBLISHED", expected_program_version: "${p_v2}" }
              as: ProgramAdmin
              captures: { e: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE (409); Program.${pid}.status remains PUBLISHED"

      - name: zone_reschedule_cascades_bookings_and_notifies
        claim_type: side_effect_execution
        grounds:
          - "endpoints['PATCH /zones/{id}]"
          - "entities.CurbsideBooking.fields.service_date"
          - "entities.NotificationLog.fields.kind"
        distinguishing_aspect: "Rescheduling a zone's collection_date (legal, >48h ahead) rewrites CONFIRMED bookings' service_date and emits one ZONE_RESCHEDULED notification per affected household."
        test_recipe:
          setup: ["Program ACTIVE; zone NW-1 date 2027-01-09; H1 with CONFIRMED booking (service_date 2027-01-09); clock 2027-01-05"]
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "TreeCycle 2027", season_label: "Winter 2027", window_start: "2027-01-02T00:00:00Z", window_end: "2027-01-16T23:59:59Z" }
              as: ProgramAdmin
              captures: { pid: $.data.id, p_v: $.data.version }
            - call: "POST /sites"
              payload: { program_id: "${pid}", name: "North Lot", address: "1 Pine Ave", capacity_cy: 100, open_date: "2027-01-02T00:00:00Z", close_date: "2027-01-16T23:59:59Z" }
              as: ProgramAdmin
            - call: "POST /zones"
              payload: { program_id: "${pid}", zone_code: "NW-1", collection_date: "2027-01-09T00:00:00Z", daily_tree_capacity: 5 }
              as: ProgramAdmin
              captures: { zid: $.data.id, z_v: $.data.version }
            - call: "PATCH /programs/${pid}"
              payload: { status: "PUBLISHED", expected_program_version: "${p_v}" }
              as: ProgramAdmin
              captures: { p_v2: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-01-02T00:00:00Z" }
              as: ProgramAdmin
            - call: "PATCH /programs/${pid}"
              payload: { status: "ACTIVE", expected_program_version: "${p_v2}" }
              as: ProgramAdmin
            - call: "POST /households"
              payload: { program_id: "${pid}", zone_id: "${zid}", address: "10 Oak St", contact_email: "h1@x.com" }
              as: Anonymous
              captures: { h1: $.data.id }
            - call: "POST /bookings"
              payload: { household_id: "${h1}", zone_id: "${zid}", tree_count: 1, size_class: "SMALL", prep_attestation: true }
              as: Resident
              as_user_id: "${h1}"
              captures: { b1: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-01-05T00:00:00Z" }
              as: ProgramAdmin
            - call: "GET /zones/${zid}"
              as: ProgramAdmin
              captures: { z_v_now: $.data.version }
          trigger:
            - call: "PATCH /zones/${zid}"
              payload: { collection_date: "2027-01-12T00:00:00Z", expected_zone_version: "${z_v_now}" }
              as: ProgramAdmin
          assert:
            - "ServiceZone.${zid}.collection_date == 2027-01-12T00:00:00Z"
            - "CurbsideBooking.${b1}.service_date == 2027-01-12T00:00:00Z (cascaded), status stays CONFIRMED"
            - "GET /programs/${pid}/notifications contains kind == ZONE_RESCHEDULED with zone_id == ${zid} and household_id == ${h1}"

      - name: posture_restricted_blocks_and_recovers
        claim_type: guarded_transition
        grounds:
          - "state_machines.Program.posture"
          - "calculations.household_strike_and_posture"
          - "errors[ERR_PROGRAM_RESTRICTED]"
        distinguishing_aspect: "The derived program posture flips RESTRICTED at exactly the 3rd OPEN ticket (>= 3), gates new bookings, and returns to NORMAL when a ticket leaves OPEN."
        test_recipe:
          setup: ["Program ACTIVE; H1 with three CONFIRMED bookings; three OPEN tickets created against them"]
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "TreeCycle 2027", season_label: "Winter 2027", window_start: "2027-01-02T00:00:00Z", window_end: "2027-01-16T23:59:59Z" }
              as: ProgramAdmin
              captures: { pid: $.data.id, p_v: $.data.version }
            - call: "POST /sites"
              payload: { program_id: "${pid}", name: "North Lot", address: "1 Pine Ave", capacity_cy: 100, open_date: "2027-01-02T00:00:00Z", close_date: "2027-01-16T23:59:59Z" }
              as: ProgramAdmin
            - call: "POST /zones"
              payload: { program_id: "${pid}", zone_code: "NW-1", collection_date: "2027-01-09T00:00:00Z", daily_tree_capacity: 10 }
              as: ProgramAdmin
              captures: { zid: $.data.id }
            - call: "PATCH /programs/${pid}"
              payload: { status: "PUBLISHED", expected_program_version: "${p_v}" }
              as: ProgramAdmin
              captures: { p_v2: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-01-02T00:00:00Z" }
              as: ProgramAdmin
            - call: "PATCH /programs/${pid}"
              payload: { status: "ACTIVE", expected_program_version: "${p_v2}" }
              as: ProgramAdmin
            - call: "POST /households"
              payload: { program_id: "${pid}", zone_id: "${zid}", address: "10 Oak St", contact_email: "h1@x.com" }
              as: Anonymous
              captures: { h1: $.data.id }
            - call: "POST /bookings"
              payload: { household_id: "${h1}", zone_id: "${zid}", tree_count: 1, size_class: "SMALL", prep_attestation: true }
              as: Resident
              as_user_id: "${h1}"
              captures: { b1: $.data.id }
            - call: "POST /bookings"
              payload: { household_id: "${h1}", zone_id: "${zid}", tree_count: 1, size_class: "SMALL", prep_attestation: true }
              as: Resident
              as_user_id: "${h1}"
              captures: { b2: $.data.id }
            - call: "POST /bookings"
