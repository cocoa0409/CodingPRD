        grounds:
          - state_machines.RespondentBank.dd_state.UNDER_REFRESH_to_RESTRICTED
          - state_machines.NestedRelationship.CONFIRMED_to_SUSPENDED
          - state_machines.TransactionMonitoringProfile.CALIBRATED_to_RECALIBRATION_REQUIRED
          - calculations.nested_exposure_rollup
          - calculations.inherent_risk_score
          - entities.RespondentBank.fields.nested_exposure_units
        distinguishing_aspect: |
          A different triggering transition from the alert instance - the officer RESTRICT lever
          taken from UNDER_REFRESH, not an alert disposition - whose three declared hops are posture
          -> BLOCKED, every CONFIRMED nested row -> SUSPENDED in created_at order, and only then the
          CALIBRATED profile -> RECALIBRATION_REQUIRED with reason OFFICER_ACTION. The third hop is
          conditional on the second having suspended at least one row, and the suspension must leave
          nested_exposure_units at 6 because CONFIRMED and SUSPENDED share state weight 3; an
          implementation that treats SUSPENDED as weight 0, or that also cancels the in-progress
          refresh cycle, fails.
