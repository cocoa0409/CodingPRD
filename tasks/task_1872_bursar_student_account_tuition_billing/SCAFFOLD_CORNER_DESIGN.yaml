scaffold_corner_design:
- section: entities
  instances:
  - name: term_create_defaults
    claim_type: creation_defaults
    grounds:
    - entities.Term.fields.status
    distinguishing_aspect: A created term starts DRAFT with system fields minted (version 1, created_at); nothing client-supplied leaks into system fields.
    test_recipe:
      setup:
      - empty DB; clock untouched (default 2026-08-01T00:00:00Z)
      setup_api_calls: []
      trigger:
      - call: POST /bursar/terms
        payload:
          code: FALL-26
          name: Fall 2026
          start_date: '2026-08-24'
          end_date: '2026-12-11'
          census_date: '2026-09-07'
          full_refund_end_date: '2026-09-07'
          mid_refund_end_date: '2026-10-05'
          withdrawal_deadline: '2026-11-13'
          refund_policy: SCHEDULE_TIERED
          flat_fee_cents: 15000
          hold_threshold_cents: 20000
          plan_setup_fee_cents: 2500
          late_fee_pct: 0.05
          grace_days: 10
        as: RegistrarStaff
        captures:
          t_stat: $.data.status
          t_ver: $.data.version
          t_id: $.data.id
      assert:
      - ${t_stat} == DRAFT and ${t_ver} == 1
      - ${t_id} is a server-minted UUID and created_at/updated_at are present in ISO8601 UTC with millisecond precision
      - HTTP 201
  - name: student_create_missing_required_returns_invalid_request
    claim_type: required_fields
    grounds:
    - entities.Student.fields.residency_status
    - errors[ERR_INVALID_REQUEST]
    distinguishing_aspect: Omitting required input field residency_status is rejected with ERR_INVALID_REQUEST (400); no Student row is created.
    test_recipe:
      setup:
      - empty DB
      setup_api_calls: []
      trigger:
      - call: POST /bursar/students
        payload:
          full_name: NoResidency
          external_ref: S-NR
          level: UNDERGRADUATE
        as: RegistrarStaff
        captures:
          err: $.data.error_id
      assert:
      - ${err} == ERR_INVALID_REQUEST
      - HTTP 400
  - name: enrollment_system_fields_server_minted
    claim_type: system_fields
    grounds:
    - entities.Enrollment.fields.account_id
    - entities.Enrollment.fields.assessed_total_cents
    distinguishing_aspect: 'account_id, status and assessed_total_cents are system/computed: the creation response carries them regardless of client input, and assessed_total_cents equals the assessment
      (435000 for 12cr), not any client value.'
    test_recipe:
      setup:
      - Term OPEN with IN_STATE/UNDERGRADUATE rate card; one student
      setup_api_calls:
      - call: POST /bursar/terms
        payload:
          code: FALL-26
          name: Fall 2026
          start_date: '2026-08-24'
          end_date: '2026-12-11'
          census_date: '2026-09-07'
          full_refund_end_date: '2026-09-07'
          mid_refund_end_date: '2026-10-05'
          withdrawal_deadline: '2026-11-13'
          refund_policy: SCHEDULE_TIERED
          flat_fee_cents: 15000
          hold_threshold_cents: 20000
          plan_setup_fee_cents: 2500
          late_fee_pct: 0.05
          grace_days: 10
        as: RegistrarStaff
        captures:
          t1: $.data.id
      - call: POST /bursar/terms/${t1}/transition
        payload:
          action: OPEN
        as: RegistrarStaff
      - call: POST /bursar/tuition-rates
        payload:
          term_id: ${t1}
          residency: IN_STATE
          level: UNDERGRADUATE
          per_credit_rate_cents: 35000
          full_time_threshold_credits: 12
          flat_rate_cents: 420000
          max_flat_credits: 18
          overload_rate_cents: 35000
          effective_from: '2026-08-01'
          effective_to: '2026-12-31'
        as: RegistrarStaff
      - call: POST /bursar/students
        payload:
          full_name: Sys Fields
          external_ref: S-SYS
          residency_status: IN_STATE
          level: UNDERGRADUATE
        as: RegistrarStaff
        captures:
          s1: $.data.id
      trigger:
      - call: POST /bursar/enrollments
        payload:
          student_id: ${s1}
          term_id: ${t1}
          credit_hours: 12
          effective_date: '2026-08-25'
        as: RegistrarStaff
        captures:
          e_stat: $.data.status
          e_tot: $.data.assessed_total_cents
          e_acc: $.data.account_id
          e_ver: $.data.version
      assert:
      - ${e_stat} == ENROLLED and ${e_ver} == 1
      - ${e_tot} == 435000 (computed by tuition_assessment, not client input)
      - ${e_acc} references an existing StudentAccount (get-or-create side effect)
  - name: ledger_entry_immutability
    claim_type: immutability
    grounds:
    - entities.LedgerEntry
    distinguishing_aspect: 'LedgerEntry has common_fields=false: ledger reads expose id and created_at but NO version/updated_at, and no update/delete endpoint exists in §1.5.'
    test_recipe:
      setup:
      - Term OPEN with rate card; student enrolled 1cr (two CHARGE entries posted)
      setup_api_calls:
      - call: POST /bursar/terms
        payload:
          code: FALL-26
          name: Fall 2026
          start_date: '2026-08-24'
          end_date: '2026-12-11'
          census_date: '2026-09-07'
          full_refund_end_date: '2026-09-07'
          mid_refund_end_date: '2026-10-05'
          withdrawal_deadline: '2026-11-13'
          refund_policy: SCHEDULE_TIERED
          flat_fee_cents: 15000
          hold_threshold_cents: 20000
          plan_setup_fee_cents: 2500
          late_fee_pct: 0.05
          grace_days: 10
        as: RegistrarStaff
        captures:
          t1: $.data.id
      - call: POST /bursar/terms/${t1}/transition
        payload:
          action: OPEN
        as: RegistrarStaff
      - call: POST /bursar/tuition-rates
        payload:
          term_id: ${t1}
          residency: IN_STATE
          level: UNDERGRADUATE
          per_credit_rate_cents: 35000
          full_time_threshold_credits: 12
          flat_rate_cents: 420000
          max_flat_credits: 18
          overload_rate_cents: 35000
          effective_from: '2026-08-01'
          effective_to: '2026-12-31'
        as: RegistrarStaff
      - call: POST /bursar/students
        payload:
          full_name: Ledger
          external_ref: S-LED
          residency_status: IN_STATE
          level: UNDERGRADUATE
        as: RegistrarStaff
        captures:
          s1: $.data.id
      - call: POST /bursar/enrollments
        payload:
          student_id: ${s1}
          term_id: ${t1}
          credit_hours: 1
          effective_date: '2026-08-25'
        as: RegistrarStaff
        captures:
          acc1: $.data.account_id
      trigger:
      - call: GET /bursar/accounts/${acc1}/ledger
        as: BursarStaff
      assert:
      - 'Exactly 2 entries: CHARGE/TUITION 35000 and CHARGE/FEE 15000, both due_date 2026-09-07'
      - Every entry carries id + created_at and NO version or updated_at field (append-only event entity)
  - name: account_computed_buckets
    claim_type: computed_fields
    grounds:
    - entities.StudentAccount.fields.balance_cents
    - entities.StudentAccount.fields.charges_total_cents
    - calculations.account_ledger_recompute
    distinguishing_aspect: 'Computed buckets derive from ledger entries: after a 12cr enrollment the account shows charges_total 435000 = balance, all credit buckets 0, past_due 0 while the clock precedes
      the charge due_date.'
    test_recipe:
      setup:
      - Term OPEN with rate card; student enrolled 12cr at default clock 2026-08-01 (before census due_date)
      setup_api_calls:
      - call: POST /bursar/terms
        payload:
          code: FALL-26
          name: Fall 2026
          start_date: '2026-08-24'
          end_date: '2026-12-11'
          census_date: '2026-09-07'
          full_refund_end_date: '2026-09-07'
          mid_refund_end_date: '2026-10-05'
          withdrawal_deadline: '2026-11-13'
          refund_policy: SCHEDULE_TIERED
          flat_fee_cents: 15000
          hold_threshold_cents: 20000
          plan_setup_fee_cents: 2500
          late_fee_pct: 0.05
          grace_days: 10
        as: RegistrarStaff
        captures:
          t1: $.data.id
      - call: POST /bursar/terms/${t1}/transition
        payload:
          action: OPEN
        as: RegistrarStaff
      - call: POST /bursar/tuition-rates
        payload:
          term_id: ${t1}
          residency: IN_STATE
          level: UNDERGRADUATE
          per_credit_rate_cents: 35000
          full_time_threshold_credits: 12
          flat_rate_cents: 420000
          max_flat_credits: 18
          overload_rate_cents: 35000
          effective_from: '2026-08-01'
          effective_to: '2026-12-31'
        as: RegistrarStaff
      - call: POST /bursar/students
        payload:
          full_name: Buckets
          external_ref: S-BUK
          residency_status: IN_STATE
          level: UNDERGRADUATE
        as: RegistrarStaff
        captures:
          s1: $.data.id
      - call: POST /bursar/enrollments
        payload:
          student_id: ${s1}
          term_id: ${t1}
          credit_hours: 12
          effective_date: '2026-08-25'
        as: RegistrarStaff
        captures:
          acc1: $.data.account_id
      trigger:
      - call: GET /bursar/accounts/${acc1}
        as: BursarStaff
        captures:
          ch: $.data.charges_total_cents
          bal: $.data.balance_cents
          pay: $.data.payments_total_cents
          wav: $.data.waivers_total_cents
          spo: $.data.sponsor_total_cents
          wo: $.data.writeoffs_total_cents
          pd: $.data.past_due_cents
          st: $.data.status
      assert:
      - ${ch} == 435000 and ${bal} == 435000
      - ${pay} == 0 and ${wav} == 0 and ${spo} == 0 and ${wo} == 0
      - ${pd} == 0 and ${st} == OPEN (charges due 2026-09-07 are not yet past due at clock 2026-08-01)
  - name: enrollment_default_effective_date
    claim_type: defaults
    grounds:
    - entities.Enrollment.fields.effective_date
    distinguishing_aspect: Omitting effective_date applies the current logical clock date (2026-08-26 after clock set), not null and not wall-clock time.
    test_recipe:
      setup:
      - Term OPEN with rate card; one student; clock set to 2026-08-26
      setup_api_calls:
      - call: POST /bursar/terms
        payload:
          code: FALL-26
          name: Fall 2026
          start_date: '2026-08-24'
          end_date: '2026-12-11'
          census_date: '2026-09-07'
          full_refund_end_date: '2026-09-07'
          mid_refund_end_date: '2026-10-05'
          withdrawal_deadline: '2026-11-13'
          refund_policy: SCHEDULE_TIERED
          flat_fee_cents: 15000
          hold_threshold_cents: 20000
          plan_setup_fee_cents: 2500
          late_fee_pct: 0.05
          grace_days: 10
        as: RegistrarStaff
        captures:
          t1: $.data.id
      - call: POST /bursar/terms/${t1}/transition
        payload:
          action: OPEN
        as: RegistrarStaff
      - call: POST /bursar/tuition-rates
        payload:
          term_id: ${t1}
          residency: IN_STATE
          level: UNDERGRADUATE
          per_credit_rate_cents: 35000
          full_time_threshold_credits: 12
          flat_rate_cents: 420000
          max_flat_credits: 18
          overload_rate_cents: 35000
          effective_from: '2026-08-01'
          effective_to: '2026-12-31'
        as: RegistrarStaff
      - call: POST /bursar/students
        payload:
          full_name: Default Date
          external_ref: S-DEF
          residency_status: IN_STATE
          level: UNDERGRADUATE
        as: RegistrarStaff
        captures:
          s1: $.data.id
      - call: POST /bursar/_clock/set_current_utc
        payload:
          to_iso8601: '2026-08-26T00:00:00Z'
        as: RegistrarStaff
      trigger:
      - call: POST /bursar/enrollments
        payload:
          student_id: ${s1}
          term_id: ${t1}
          credit_hours: 3
        as: RegistrarStaff
        captures:
          eff: $.data.effective_date
      assert:
      - ${eff} == 2026-08-26 (clock date used as default)
      - HTTP 201
  - name: corner_refund_boundary_stub
    claim_type: computed_fields
    grounds:
    - entities.Refund.fields.pct_applied
    excluded_because:
      difficulty_instance: boundary_precision_check / refund_tier_date_boundary
      rationale: Refund pct/amount computed fields asserted with literal values in the named §1.8 instance.
  - name: corner_invoice_total_variants_stub
    claim_type: computed_fields
    grounds:
    - entities.SponsorInvoice.fields.total_cents
    excluded_because:
      difficulty_instance: dual_variant_calc / sponsor_invoice_net_vs_gross
      rationale: Invoice total computation (both bases) asserted in the named §1.8 instance.
- section: state_machines
  instances:
  - name: term_lock_census_from_draft_rejected
    claim_type: invalid_transition
    grounds:
    - state_machines.Term.transitions
    - errors[ERR_TERM_STATE_INVALID]
    distinguishing_aspect: LOCK_CENSUS requires from-state OPEN; attempting it on a DRAFT term fails with ERR_TERM_STATE_INVALID and the term stays DRAFT.
    test_recipe:
      setup:
      - One term in DRAFT
      setup_api_calls:
      - call: POST /bursar/terms
        payload:
          code: FALL-26
          name: Fall 2026
          start_date: '2026-08-24'
          end_date: '2026-12-11'
          census_date: '2026-09-07'
          full_refund_end_date: '2026-09-07'
          mid_refund_end_date: '2026-10-05'
          withdrawal_deadline: '2026-11-13'
          refund_policy: SCHEDULE_TIERED
          flat_fee_cents: 15000
          hold_threshold_cents: 20000
          plan_setup_fee_cents: 2500
          late_fee_pct: 0.05
          grace_days: 10
        as: RegistrarStaff
        captures:
          t1: $.data.id
      trigger:
      - call: POST /bursar/terms/${t1}/transition
        payload:
          action: LOCK_CENSUS
        as: RegistrarStaff
        captures:
          err: $.data.error_id
      assert:
      - ${err} == ERR_TERM_STATE_INVALID (409)
      - GET /bursar/terms/${t1} afterwards still shows status DRAFT
  - name: enrollment_withdraw_twice_returns_state_error
    claim_type: terminal_state_lockdown
    grounds:
    - state_machines.Enrollment
    - errors[ERR_ENROLLMENT_NOT_ACTIVE]
    distinguishing_aspect: 'WITHDRAWN is terminal: a second withdraw (and any drop) on the same enrollment is rejected with ERR_ENROLLMENT_NOT_ACTIVE; the first Refund remains the only one.'
    test_recipe:
      setup:
      - Term OPEN with rate card; student enrolled 3cr (120000)
      setup_api_calls:
      - call: POST /bursar/terms
        payload:
          code: FALL-26
          name: Fall 2026
          start_date: '2026-08-24'
          end_date: '2026-12-11'
          census_date: '2026-09-07'
          full_refund_end_date: '2026-09-07'
          mid_refund_end_date: '2026-10-05'
          withdrawal_deadline: '2026-11-13'
          refund_policy: SCHEDULE_TIERED
          flat_fee_cents: 15000
          hold_threshold_cents: 20000
          plan_setup_fee_cents: 2500
          late_fee_pct: 0.05
          grace_days: 10
        as: RegistrarStaff
        captures:
          t1: $.data.id
      - call: POST /bursar/terms/${t1}/transition
        payload:
          action: OPEN
        as: RegistrarStaff
      - call: POST /bursar/tuition-rates
        payload:
          term_id: ${t1}
          residency: IN_STATE
          level: UNDERGRADUATE
          per_credit_rate_cents: 35000
          full_time_threshold_credits: 12
          flat_rate_cents: 420000
          max_flat_credits: 18
          overload_rate_cents: 35000
          effective_from: '2026-08-01'
          effective_to: '2026-12-31'
        as: RegistrarStaff
      - call: POST /bursar/students
        payload:
          full_name: Twice
          external_ref: S-TWI
          residency_status: IN_STATE
          level: UNDERGRADUATE
        as: RegistrarStaff
        captures:
          s1: $.data.id
      - call: POST /bursar/enrollments
        payload:
          student_id: ${s1}
          term_id: ${t1}
          credit_hours: 3
          effective_date: '2026-08-25'
        as: RegistrarStaff
        captures:
          enr1: $.data.id
      - call: POST /bursar/enrollments/${enr1}/withdraw
        payload:
          effective_date: '2026-09-20'
        as: RegistrarStaff
        captures:
          st1: $.data.status
      trigger:
      - call: POST /bursar/enrollments/${enr1}/withdraw
        payload:
          effective_date: '2026-09-21'
        as: RegistrarStaff
        captures:
          err: $.data.error_id
      - call: GET /bursar/refunds?enrollment_id=${enr1}
        as: BursarStaff
      assert:
      - ${st1} == WITHDRAWN after the first call
      - ${err} == ERR_ENROLLMENT_NOT_ACTIVE (409)
      - 'Exactly one Refund exists for the enrollment (50% tier: 60000)'
  - name: hold_release_twice_returns_state_error
    claim_type: idempotency
    grounds:
    - state_machines.FinancialHold
    - errors[ERR_HOLD_STATE_INVALID]
    distinguishing_aspect: 'RELEASED is terminal: a second release of the same hold is rejected with ERR_HOLD_STATE_INVALID; the first release''s released_reason is preserved.'
    test_recipe:
      setup:
      - Term OPEN; student enrolled 1cr; MANUAL REGISTRATION hold placed and released once
      setup_api_calls:
      - call: POST /bursar/terms
        payload:
          code: FALL-26
          name: Fall 2026
          start_date: '2026-08-24'
          end_date: '2026-12-11'
          census_date: '2026-09-07'
          full_refund_end_date: '2026-09-07'
          mid_refund_end_date: '2026-10-05'
          withdrawal_deadline: '2026-11-13'
          refund_policy: SCHEDULE_TIERED
          flat_fee_cents: 15000
          hold_threshold_cents: 20000
          plan_setup_fee_cents: 2500
          late_fee_pct: 0.05
          grace_days: 10
        as: RegistrarStaff
        captures:
          t1: $.data.id
      - call: POST /bursar/terms/${t1}/transition
        payload:
          action: OPEN
        as: RegistrarStaff
      - call: POST /bursar/tuition-rates
        payload:
          term_id: ${t1}
          residency: IN_STATE
          level: UNDERGRADUATE
          per_credit_rate_cents: 35000
          full_time_threshold_credits: 12
          flat_rate_cents: 420000
          max_flat_credits: 18
          overload_rate_cents: 35000
          effective_from: '2026-08-01'
          effective_to: '2026-12-31'
        as: RegistrarStaff
      - call: POST /bursar/students
        payload:
          full_name: Hold Twice
          external_ref: S-H2
          residency_status: IN_STATE
          level: UNDERGRADUATE
        as: RegistrarStaff
        captures:
          s1: $.data.id
      - call: POST /bursar/enrollments
        payload:
          student_id: ${s1}
          term_id: ${t1}
          credit_hours: 1
          effective_date: '2026-08-25'
        as: RegistrarStaff
        captures:
          acc1: $.data.account_id
      - call: POST /bursar/holds
        payload:
          account_id: ${acc1}
          hold_type: REGISTRATION
          reason: Advising stop
        as: BursarStaff
        captures:
          h1: $.data.id
      - call: POST /bursar/holds/${h1}/release
        payload: {}
        as: BursarStaff
        captures:
          hst: $.data.status
      trigger:
      - call: POST /bursar/holds/${h1}/release
        payload: {}
        as: BursarStaff
        captures:
          err: $.data.error_id
      assert:
      - ${hst} == RELEASED after the first release
      - ${err} == ERR_HOLD_STATE_INVALID (409) on the second attempt
  - name: refund_void_then_approve_returns_state_error
    claim_type: invalid_transition
    grounds:
    - state_machines.Refund
    - errors[ERR_REFUND_STATE_INVALID]
    distinguishing_aspect: 'VOID is terminal: approving a voided refund fails with ERR_REFUND_STATE_INVALID and posts no ledger entries.'
    test_recipe:
      setup:
      - Term OPEN; student enrolled 1cr; drop effective 2026-09-01 -> Refund CALCULATED 50000; refund VOIDed
      setup_api_calls:
      - call: POST /bursar/terms
        payload:
          code: FALL-26
          name: Fall 2026
          start_date: '2026-08-24'
          end_date: '2026-12-11'
          census_date: '2026-09-07'
          full_refund_end_date: '2026-09-07'
          mid_refund_end_date: '2026-10-05'
          withdrawal_deadline: '2026-11-13'
          refund_policy: SCHEDULE_TIERED
          flat_fee_cents: 15000
          hold_threshold_cents: 20000
          plan_setup_fee_cents: 2500
          late_fee_pct: 0.05
          grace_days: 10
        as: RegistrarStaff
        captures:
          t1: $.data.id
      - call: POST /bursar/terms/${t1}/transition
        payload:
          action: OPEN
        as: RegistrarStaff
      - call: POST /bursar/tuition-rates
        payload:
          term_id: ${t1}
          residency: IN_STATE
          level: UNDERGRADUATE
          per_credit_rate_cents: 35000
          full_time_threshold_credits: 12
          flat_rate_cents: 420000
          max_flat_credits: 18
          overload_rate_cents: 35000
          effective_from: '2026-08-01'
          effective_to: '2026-12-31'
        as: RegistrarStaff
      - call: POST /bursar/students
        payload:
          full_name: Voider
          external_ref: S-VD
          residency_status: IN_STATE
          level: UNDERGRADUATE
        as: RegistrarStaff
        captures:
          s1: $.data.id
      - call: POST /bursar/enrollments
        payload:
          student_id: ${s1}
          term_id: ${t1}
          credit_hours: 1
          effective_date: '2026-08-25'
        as: RegistrarStaff
        captures:
          enr1: $.data.id
          acc1: $.data.account_id
      - call: POST /bursar/enrollments/${enr1}/drop
        payload:
          effective_date: '2026-09-01'
        as: RegistrarStaff
      - call: GET /bursar/refunds?enrollment_id=${enr1}
        as: BursarStaff
        captures:
          ref1: $.data[0].id
      - call: POST /bursar/refunds/${ref1}/transition
        payload:
          action: VOID
        as: BursarManager
        captures:
          rst: $.data.status
      trigger:
      - call: POST /bursar/refunds/${ref1}/transition
        payload:
          action: APPROVE
        as: BursarManager
        captures:
          err: $.data.error_id
      - call: GET /bursar/accounts/${acc1}/ledger
        as: BursarStaff
      assert:
      - ${rst} == VOID
      - ${err} == ERR_REFUND_STATE_INVALID (409)
      - Ledger still holds only the 2 original CHARGE entries (no CHARGE_REVERSAL)
  - name: tax_form_correction_chain
    claim_type: valid_transition
    grounds:
    - state_machines.TaxForm1098T
    - entities.TaxForm1098T.fields.corrected_from_id
    distinguishing_aspect: 'Correction is a supersede chain, not an edit: FINALIZED -> SUPERSEDED spawns a new DRAFT whose corrected_from_id points at the old form (self-referential FK), with boxes recomputed.'
