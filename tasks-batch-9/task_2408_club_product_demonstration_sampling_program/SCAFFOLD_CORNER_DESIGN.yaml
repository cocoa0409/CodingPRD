      - name: replacement_assignment_links_back_to_the_no_show_it_recovers
        claim_type: cross_reference_link
        grounds:
          - entities.EventAssignment.fields.replaces_assignment_id
          - entities.DemoEvent.fields.no_show_recovery_open
          - validations[priority=37]
          - calculations.cancellation_credit_amount
          - endpoints[GET /event-assignments]
        distinguishing_aspect: "The replacement LEAD is accepted even though a LEAD row already exists, because the NO_SHOW row leaves the {ASSIGNED, CONFIRMED, CHECKED_IN, COMPLETED} scope of priority 37; the new row carries replaces_assignment_id pointing at that row, no_show_recovery_open returns to false, and the no-show credit is 28000 * 0.7 = 19600 at notice_hours 0."
        test_recipe:
          setup:
