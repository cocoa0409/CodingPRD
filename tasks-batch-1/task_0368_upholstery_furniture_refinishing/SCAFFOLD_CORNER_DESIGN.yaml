  # =========================================================================
  # Cross-cutting complexity layers — OCC, derived-field reconciliation, soft-delete
  # =========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_stale_work_order_version_on_estimate_author
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[estimate-supersede-stale-work-order]", "errors[ERR_STALE_WORK_ORDER_VERSION]"]
        distinguishing_aspect: "Authoring a second estimate with a stale expected_work_order_version (one less than current after a first author bumped it) yields ERR_STALE_WORK_ORDER_VERSION (412)."
        test_recipe:
          setup: ["An ESTIMATING order; first estimate authored bumps WorkOrder.version; a second author carries the pre-author version."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Abe A", email: "abe@x.com", phone: "555-0326" }
              as: IntakeClerk
              captures: { cust_id: $.data.id }
            - call: "POST /work-orders"
              payload: { customer_id: "${cust_id}", service_type: "REPAIR" }
              as: IntakeClerk
              captures: { wo_id: $.data.id }
            - call: "POST /condition-photos"
              payload: { work_order_id: "${wo_id}", image_uri: "s3://c/22.jpg" }
              as: IntakeClerk
            - call: "POST /work-orders/${wo_id}/line-items"
              payload: { piece_label: "P", yardage_required: 0, labor_hours: 2 }
              as: IntakeClerk
            - call: "GET /work-orders/${wo_id}"
              as: Estimator
              captures: { v_est: $.data.version }
            - call: "POST /work-orders/${wo_id}/estimates"
              payload: { expected_work_order_version: "${v_est}" }
              as: Estimator
              captures: { est1: $.data.id }
            - call: "POST /work-orders/${wo_id}/request-revision"
              as: Customer
              as_user_id: "${cust_id}"
          trigger:
            - call: "POST /work-orders/${wo_id}/estimates"
              payload: { expected_work_order_version: "${v_est}", supersedes_estimate_id: "${est1}" }
              as: Estimator
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 412"
            - "data.error_id == ERR_STALE_WORK_ORDER_VERSION"

      - name: occ_correct_work_order_version_on_estimate_succeeds
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[estimate-supersede-stale-work-order]", "state_machines.WorkOrder.REVISION_REQUESTED_to_AWAITING_APPROVAL"]
        distinguishing_aspect: "Authoring a revision with the CURRENT expected_work_order_version (re-read after request-revision) succeeds (201) and bumps WorkOrder.version."
        test_recipe:
          setup: ["REVISION_REQUESTED order with a v1 estimate; current version re-read before authoring v2."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Ben B", email: "ben@x.com", phone: "555-0327" }
              as: IntakeClerk
              captures: { cust_id: $.data.id }
            - call: "POST /work-orders"
              payload: { customer_id: "${cust_id}", service_type: "REPAIR" }
              as: IntakeClerk
              captures: { wo_id: $.data.id }
            - call: "POST /condition-photos"
              payload: { work_order_id: "${wo_id}", image_uri: "s3://c/23.jpg" }
              as: IntakeClerk
            - call: "POST /work-orders/${wo_id}/line-items"
              payload: { piece_label: "P", yardage_required: 0, labor_hours: 2 }
              as: IntakeClerk
            - call: "GET /work-orders/${wo_id}"
              as: Estimator
              captures: { v1: $.data.version }
            - call: "POST /work-orders/${wo_id}/estimates"
              payload: { expected_work_order_version: "${v1}" }
              as: Estimator
              captures: { est1: $.data.id }
            - call: "POST /work-orders/${wo_id}/request-revision"
              as: Customer
              as_user_id: "${cust_id}"
            - call: "GET /work-orders/${wo_id}"
              as: Estimator
              captures: { v2: $.data.version }
          trigger:
            - call: "POST /work-orders/${wo_id}/estimates"
              payload: { expected_work_order_version: "${v2}", supersedes_estimate_id: "${est1}" }
              as: Estimator
              captures: { est2: $.data.id }
          assert:
            - "response.status == 201"
            - "Estimate.${est2}.version_no == 2"
            - "WorkOrder.${wo_id}.status == AWAITING_APPROVAL"

      - name: materials_committed_reconciled_on_material_cancel
        claim_type: derived_field_reconciliation
        grounds: ["entities.WorkOrder.fields.materials_committed_cents", "state_machines.MaterialOrder.ORDERED_to_CANCELLED"]
        distinguishing_aspect: "After a single fabric MaterialOrder (provisional 10800) is cancelled, WorkOrder.materials_committed_cents is reconciled back to 0."
