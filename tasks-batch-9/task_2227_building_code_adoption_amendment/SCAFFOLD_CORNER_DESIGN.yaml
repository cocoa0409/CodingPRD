# =============================================================================
# §1.9 Scaffold Corner Design — task 2227 Building Code Adoption & Amendment
#
# Breadth probe. Walks references/claim-extraction-guide.md section by section
# against SCAFFOLD.yaml §1.1–§1.7 and emits one instance per applicable row.
# Corners already asserted by SCAFFOLD_DIFFICULTY_DESIGN.yaml appear as
# `excluded_because:` stubs (no test_recipe), citing the covering instance by name.
#
# YAML anchors (&k_*) are declared on individual call dicts and reused by alias
# in later chains; every anchor is declared before its first alias.
# All literals are pinned: no expression is left for the test generator to evaluate.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:

      - name: create_code_cycle_returns_declared_defaults_and_zero_counters
        claim_type: creation
        grounds:
          - endpoints[POST /code-cycles]
          - entities.CodeCycle.fields.status
          - entities.CodeCycle.fields.seated_committee_count
          - entities.CodeCycle.fields.proposal_count
          - entities.CodeCycle.fields.approved_proposal_count
          - entities.CodeCycle.fields.approved_incremental_cost_cents
          - entities.CodeCycle.fields.approved_permit_backlog_count
        distinguishing_aspect: "A brand-new CodeCycle comes back 201 in status DRAFT with every derived counter at 0 and version 1 — no counter is left null."
        test_recipe:
          setup:
            - "Empty database."
            - "Logical clock at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - &k_clock0801
              call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: CouncilAdmin
              as_user_id: "admin-ops-1"
          trigger:
            - &k_cycle
              call: "POST /code-cycles"
              payload: { cycle_year: 2027, model_code_edition: "IBC-2027", intake_opens_at: "2026-08-01T00:00:00Z", intake_closes_at: "2026-10-01T00:00:00Z" }
              as: CouncilAdmin
              as_user_id: "admin-ops-1"
              captures: { cycle_id: $.data.id }
          assert:
            - "response.status == 201"
            - "CodeCycle.${cycle_id}.cycle_year == 2027"
            - "CodeCycle.${cycle_id}.model_code_edition == IBC-2027"
            - "CodeCycle.${cycle_id}.status == DRAFT"
            - "CodeCycle.${cycle_id}.seated_committee_count == 0"
            - "CodeCycle.${cycle_id}.proposal_count == 0"
            - "CodeCycle.${cycle_id}.approved_proposal_count == 0"
            - "CodeCycle.${cycle_id}.approved_incremental_cost_cents == 0"
            - "CodeCycle.${cycle_id}.approved_permit_backlog_count == 0"
            - "CodeCycle.${cycle_id}.version == 1"
            - "response.meta.api_request_id is a non-empty string and response.response_type == object"

      - name: get_amendment_proposal_returns_the_stored_row
        claim_type: retrieval
        grounds:
          - endpoints[GET /amendment-proposals/{proposal_id}]
          - entities.AmendmentProposal.fields.committee_id
          - entities.AmendmentProposal.fields.submitted_by_user_id
          - calculations.committee_assignment_by_discipline
        distinguishing_aspect: "GET returns the same committee_id the create call assigned by discipline and the same submitted_by_user_id, with no field dropped."
        test_recipe:
          setup:
            - "CodeCycle 2027 in INTAKE_OPEN with a SEATED ENERGY committee of 6 voting seats."
            - "One AmendmentProposal submitted by staff-intake-1."
          setup_api_calls:
            - *k_clock0801
            - *k_cycle
            - &k_cte
              call: "POST /code-cycles/${cycle_id}/discipline-committees"
              payload: { discipline: "ENERGY", voting_seat_count: 6 }
              as: CouncilAdmin
              as_user_id: "admin-ops-1"
              captures: { cte_id: $.data.id }
            - &k_m_chair
              call: "POST /discipline-committees/${cte_id}/members"
              payload: { full_name: "Dana Reyes", sector: "INDUSTRY", voting_seat: true, is_chair: true }
              as: CouncilAdmin
              as_user_id: "admin-ops-1"
              captures: { m_chair_id: $.data.id }
            - &k_m_fire
              call: "POST /discipline-committees/${cte_id}/members"
              payload: { full_name: "Sam Ito", sector: "FIRE_SERVICE", voting_seat: true, is_chair: false }
              as: CouncilAdmin
              as_user_id: "admin-ops-1"
              captures: { m_fire_id: $.data.id }
            - &k_m_loc
              call: "POST /discipline-committees/${cte_id}/members"
              payload: { full_name: "Lee Park", sector: "LOCAL_JURISDICTION", voting_seat: true, is_chair: false }
              as: CouncilAdmin
              as_user_id: "admin-ops-1"
              captures: { m_loc_id: $.data.id }
            - &k_m_des
              call: "POST /discipline-committees/${cte_id}/members"
              payload: { full_name: "Rae Oyelaran", sector: "DESIGN_PROFESSIONAL", voting_seat: true, is_chair: false }
              as: CouncilAdmin
              as_user_id: "admin-ops-1"
              captures: { m_des_id: $.data.id }
            - &k_m_ind2
              call: "POST /discipline-committees/${cte_id}/members"
              payload: { full_name: "Kim Alvarez", sector: "INDUSTRY", voting_seat: true, is_chair: false }
              as: CouncilAdmin
              as_user_id: "admin-ops-1"
              captures: { m_ind2_id: $.data.id }
            - &k_m_pub
              call: "POST /discipline-committees/${cte_id}/members"
              payload: { full_name: "Toni Blake", sector: "PUBLIC", voting_seat: true, is_chair: false }
              as: CouncilAdmin
              as_user_id: "admin-ops-1"
              captures: { m_pub_id: $.data.id }
            - &k_intake_open
              call: "POST /code-cycles/${cycle_id}/status"
              payload: { to_status: "INTAKE_OPEN" }
              as: CouncilAdmin
              as_user_id: "admin-ops-1"
            - &k_propA
              call: "POST /amendment-proposals"
              payload: { code_cycle_id: "${cycle_id}", code_section: "C402.1.4", discipline: "ENERGY", title: "Envelope U-factor tightening", proposed_text: "Reduce maximum assembly U-factor for climate zone 5 walls.", stringency_direction: "MORE_STRINGENT", proposer_sector: "INDUSTRY" }
              as: TechnicalStaff
              as_user_id: "staff-intake-1"
              captures: { prop_id: $.data.id }
          trigger:
            - call: "GET /amendment-proposals/${prop_id}"
              payload: {}
              as: CommitteeMember
              as_user_id: "${m_pub_id}"
          assert:
            - "response.status == 200"
            - "AmendmentProposal.${prop_id}.code_cycle_id == ${cycle_id}"
            - "AmendmentProposal.${prop_id}.committee_id == ${cte_id}"
            - "AmendmentProposal.${prop_id}.code_section == C402.1.4"
            - "AmendmentProposal.${prop_id}.stringency_direction == MORE_STRINGENT"
            - "AmendmentProposal.${prop_id}.submitted_by_user_id == staff-intake-1"
            - "AmendmentProposal.${prop_id}.review_status == SUBMITTED"
            - "AmendmentProposal.${prop_id}.analysis_status == NOT_STARTED"
            - "CodeCycle.${cycle_id}.proposal_count == 1"

      - name: list_amendment_proposals_filters_by_discipline_and_paginates
        claim_type: listing
        grounds:
          - endpoints[GET /amendment-proposals]
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
          - entities.AmendmentProposal.fields.discipline
        distinguishing_aspect: "With two proposals in two disciplines, limit=1 returns exactly 1 element with total_count 2 and has_more true, and discipline=MECHANICAL narrows total_count to 1."
        test_recipe:
          setup:
            - "CodeCycle 2027 in INTAKE_OPEN with a SEATED ENERGY committee (6 seats) and a SEATED MECHANICAL committee (3 seats)."
            - "Two AmendmentProposals: one ENERGY, one MECHANICAL."
          setup_api_calls:
            - *k_clock0801
            - *k_cycle
            - *k_cte
            - *k_m_chair
            - *k_m_fire
            - *k_m_loc
            - *k_m_des
            - *k_m_ind2
            - *k_m_pub
            - &k_cte2
              call: "POST /code-cycles/${cycle_id}/discipline-committees"
              payload: { discipline: "MECHANICAL", voting_seat_count: 3 }
              as: CouncilAdmin
              as_user_id: "admin-ops-1"
              captures: { cte2_id: $.data.id }
            - &k_m2_chair
              call: "POST /discipline-committees/${cte2_id}/members"
              payload: { full_name: "Nia Okafor", sector: "INDUSTRY", voting_seat: true, is_chair: true }
              as: CouncilAdmin
              as_user_id: "admin-ops-1"
              captures: { n_chair_id: $.data.id }
            - &k_m2_fire
              call: "POST /discipline-committees/${cte2_id}/members"
              payload: { full_name: "Owen Diaz", sector: "FIRE_SERVICE", voting_seat: true, is_chair: false }
              as: CouncilAdmin
              as_user_id: "admin-ops-1"
              captures: { n_fire_id: $.data.id }
            - &k_m2_loc
              call: "POST /discipline-committees/${cte2_id}/members"
              payload: { full_name: "Priya Raman", sector: "LOCAL_JURISDICTION", voting_seat: true, is_chair: false }
              as: CouncilAdmin
              as_user_id: "admin-ops-1"
              captures: { n_loc_id: $.data.id }
            - *k_intake_open
            - *k_propA
            - &k_propB
              call: "POST /amendment-proposals"
              payload: { code_cycle_id: "${cycle_id}", code_section: "M403.3.1", discipline: "MECHANICAL", title: "Ventilation rate table cleanup", proposed_text: "Restate the outdoor air rate table without changing required rates.", stringency_direction: "NEUTRAL", proposer_sector: "DESIGN_PROFESSIONAL" }
              as: TechnicalStaff
              as_user_id: "staff-intake-1"
              captures: { propb_id: $.data.id }
          trigger:
            - call: "GET /amendment-proposals"
              payload: { limit: 1, offset: 0 }
              as: Petitioner
              as_user_id: "petitioner-1"
            - call: "GET /amendment-proposals"
              payload: { discipline: "MECHANICAL" }
              as: Petitioner
              as_user_id: "petitioner-1"
          assert:
            - "trigger call 1 response.status == 200 and response.response_type == array"
            - "trigger call 1 response.data has length 1"
            - "trigger call 1 total_count == 2 and has_more == true and limit == 1 and offset == 0"
            - "trigger call 2 total_count == 1 and has_more == false"
            - "trigger call 2 response.data[0].id == ${propb_id}"
            - "trigger call 2 response.data[0].discipline == MECHANICAL"

      - name: get_adoption_rule_with_unknown_id_not_found
        claim_type: not_found
        grounds:
          - endpoints[GET /adoption-rules/{adoption_rule_id}]
          - errors.ERR_ADOPTION_RULE_NOT_FOUND
          - validations[priority=6]
        distinguishing_aspect: "A well-formed but unused UUID in the path yields 404 ERR_ADOPTION_RULE_NOT_FOUND, not 200 with a null body."
        test_recipe:
          setup:
            - "Empty database apart from the logical clock."
          setup_api_calls:
            - *k_clock0801
          trigger:
            - call: "GET /adoption-rules/00000000-0000-0000-0000-0000000000ff"
              payload: {}
              as: CouncilAdmin
              as_user_id: "admin-ops-1"
          assert:
            - "response.status == 404"
            - "response.data.error_id == ERR_ADOPTION_RULE_NOT_FOUND"
            - "response.response_type == error"

      - name: create_jurisdiction_missing_required_population_is_rejected
        claim_type: required_fields
        grounds:
          - endpoints[POST /jurisdictions]
          - entities.Jurisdiction.fields.population
          - errors.ERR_INVALID_REQUEST
          - validations[priority=4]
        distinguishing_aspect: "population has source input with no default, so omitting it returns 400 ERR_INVALID_REQUEST and persists nothing."
        test_recipe:
          setup:
            - "Empty database apart from the logical clock."
          setup_api_calls:
            - *k_clock0801
          trigger:
            - call: "POST /jurisdictions"
              payload: { name: "Riverbend", local_authority_level: "FULL", host_seat_capacity: 60, official_headcount: 5 }
              as: CouncilAdmin
              as_user_id: "admin-ops-1"
          assert:
            - "response.status == 400"
            - "response.data.error_id == ERR_INVALID_REQUEST"
            - "GET /jurisdictions returns total_count == 0"

      - name: create_committee_member_applies_voting_seat_and_chair_defaults
        claim_type: defaults
        grounds:
          - endpoints[POST /discipline-committees/{committee_id}/members]
          - entities.CommitteeMember.fields.voting_seat
          - entities.CommitteeMember.fields.is_chair
          - entities.CommitteeMember.fields.status
          - entities.CommitteeMember.fields.recusal_reason
        distinguishing_aspect: "Omitting voting_seat and is_chair yields voting_seat true, is_chair false, status ACTIVE and recusal_reason null — the declared defaults, not nulls."
        test_recipe:
          setup:
            - "CodeCycle 2027 in DRAFT with one ENERGY committee of 6 voting seats and no members."
          setup_api_calls:
            - *k_clock0801
            - *k_cycle
            - *k_cte
          trigger:
            - call: "POST /discipline-committees/${cte_id}/members"
              payload: { full_name: "Uma Verity", sector: "PUBLIC" }
              as: CouncilAdmin
              as_user_id: "admin-ops-1"
              captures: { default_member_id: $.data.id }
          assert:
            - "response.status == 201"
            - "CommitteeMember.${default_member_id}.voting_seat == true"
            - "CommitteeMember.${default_member_id}.is_chair == false"
            - "CommitteeMember.${default_member_id}.status == ACTIVE"
            - "CommitteeMember.${default_member_id}.recusal_reason == null"
            - "CommitteeMember.${default_member_id}.committee_id == ${cte_id}"
            - "DisciplineCommittee.${cte_id}.active_voting_member_count == 1"
            - "DisciplineCommittee.${cte_id}.chair_member_count == 0"
            - "DisciplineCommittee.${cte_id}.status == FORMING"

      - name: create_proposal_computed_status_fields_input_ignored
        claim_type: computed_fields
        grounds:
          - endpoints[POST /amendment-proposals]
          - entities.AmendmentProposal.fields.energy_analysis_required
          - entities.AmendmentProposal.fields.review_status
          - entities.AmendmentProposal.fields.committee_id
        distinguishing_aspect: "energy_analysis_required and review_status are computed, so client-supplied values for them are discarded: the ENERGY proposal comes back energy_analysis_required true and review_status SUBMITTED even though the body said false / APPROVED."
        test_recipe:
          setup:
            - "CodeCycle 2027 in INTAKE_OPEN with a SEATED ENERGY committee."
          setup_api_calls:
            - *k_clock0801
            - *k_cycle
            - *k_cte
            - *k_m_chair
            - *k_m_fire
            - *k_m_loc
            - *k_m_des
            - *k_m_ind2
            - *k_m_pub
            - *k_intake_open
          trigger:
            - call: "POST /amendment-proposals"
              payload: { code_cycle_id: "${cycle_id}", code_section: "C405.2.1", discipline: "ENERGY", title: "Lighting power density reduction", proposed_text: "Lower interior lighting power allowances.", stringency_direction: "MORE_STRINGENT", proposer_sector: "INDUSTRY", energy_analysis_required: false, review_status: "APPROVED", committee_id: "00000000-0000-0000-0000-0000000000ff" }
              as: Petitioner
              as_user_id: "petitioner-9"
              captures: { computed_prop_id: $.data.id }
          assert:
            - "response.status == 201"
            - "AmendmentProposal.${computed_prop_id}.energy_analysis_required == true"
            - "AmendmentProposal.${computed_prop_id}.review_status == SUBMITTED"
            - "AmendmentProposal.${computed_prop_id}.analysis_status == NOT_STARTED"
            - "AmendmentProposal.${computed_prop_id}.committee_id == ${cte_id}"
            - "AmendmentProposal.${computed_prop_id}.submitted_by_user_id == petitioner-9"

      - name: create_hearing_system_fields_input_ignored
        claim_type: system_fields
        grounds:
          - endpoints[POST /hearings]
          - entities.Hearing.fields.status
          - entities.Hearing.fields.agenda_proposal_ids
          - entities.Hearing.fields.convened_at
          - entities.Hearing.fields.quorum_required_at_convene
        distinguishing_aspect: "id, created_at, updated_at, version and status are system-owned: the body's status CONVENED and convened_at are ignored and the row is created SCHEDULED with version 1, empty agenda and null convened_at."
        test_recipe:
          setup:
            - "CodeCycle 2027 in DRAFT with a SEATED ENERGY committee of 6 voting seats."
            - "Logical clock at 2026-08-01T00:00:00Z, so a 2026-10-05 hearing satisfies the 14-day notice."
          setup_api_calls:
            - *k_clock0801
            - *k_cycle
            - *k_cte
            - *k_m_chair
            - *k_m_fire
            - *k_m_loc
            - *k_m_des
            - *k_m_ind2
            - *k_m_pub
          trigger:
            - call: "POST /hearings"
              payload: { committee_id: "${cte_id}", scheduled_start: "2026-10-05T14:00:00Z", scheduled_end: "2026-10-05T17:00:00Z", status: "CONVENED", convened_at: "2026-08-01T00:00:00Z", version: 9 }
              as: CouncilAdmin
              as_user_id: "admin-ops-1"
              captures: { sysfield_hear_id: $.data.id }
          assert:
            - "response.status == 201"
            - "Hearing.${sysfield_hear_id}.status == SCHEDULED"
            - "Hearing.${sysfield_hear_id}.version == 1"
            - "Hearing.${sysfield_hear_id}.convened_at == null"
            - "Hearing.${sysfield_hear_id}.adjourned_at == null"
            - "Hearing.${sysfield_hear_id}.agenda_proposal_ids == []"
            - "Hearing.${sysfield_hear_id}.present_member_ids == []"
            - "Hearing.${sysfield_hear_id}.present_voting_count == 0"
            - "Hearing.${sysfield_hear_id}.quorum_required_at_convene == null"
            - "Hearing.${sysfield_hear_id}.created_at is a non-null datetime and equals Hearing.${sysfield_hear_id}.updated_at"

      - name: create_proposal_with_unknown_stringency_direction_is_rejected
        claim_type: type_constraints
        grounds:
          - endpoints[POST /amendment-proposals]
          - entities.AmendmentProposal.fields.stringency_direction
          - errors.ERR_INVALID_REQUEST
          - validations[priority=4]
        distinguishing_aspect: "stringency_direction is an enum of MORE_STRINGENT | LESS_STRINGENT | NEUTRAL | CLARIFYING, so SOMEWHAT_STRINGENT is a 400 at priority 4 — before any state or referential check runs."
        test_recipe:
          setup:
            - "CodeCycle 2027 in INTAKE_OPEN with a SEATED ENERGY committee."
          setup_api_calls:
            - *k_clock0801
            - *k_cycle
            - *k_cte
            - *k_m_chair
            - *k_m_fire
            - *k_m_loc
            - *k_m_des
            - *k_m_ind2
            - *k_m_pub
            - *k_intake_open
          trigger:
            - call: "POST /amendment-proposals"
              payload: { code_cycle_id: "${cycle_id}", code_section: "C402.1.9", discipline: "ENERGY", title: "Bad enum probe", proposed_text: "Probe body.", stringency_direction: "SOMEWHAT_STRINGENT", proposer_sector: "INDUSTRY" }
              as: Petitioner
              as_user_id: "petitioner-9"
          assert:
            - "response.status == 400"
            - "response.data.error_id == ERR_INVALID_REQUEST"
            - "CodeCycle.${cycle_id}.proposal_count == 0"

      - name: create_committee_under_unknown_code_cycle_not_found
        claim_type: parent_relationships
        grounds:
          - endpoints[POST /code-cycles/{code_cycle_id}/discipline-committees]
          - errors.ERR_CODE_CYCLE_NOT_FOUND
          - validations[priority=6]
          - entities.DisciplineCommittee.parent
        distinguishing_aspect: "DisciplineCommittee is parented by CodeCycle, so an unused cycle id in the path is 404 ERR_CODE_CYCLE_NOT_FOUND and no committee row is created."
        test_recipe:
          setup:
            - "Empty database apart from the logical clock."
          setup_api_calls:
            - *k_clock0801
          trigger:
            - call: "POST /code-cycles/00000000-0000-0000-0000-0000000000ff/discipline-committees"
              payload: { discipline: "ENERGY", voting_seat_count: 6 }
              as: CouncilAdmin
              as_user_id: "admin-ops-1"
          assert:
            - "response.status == 404"
            - "response.data.error_id == ERR_CODE_CYCLE_NOT_FOUND"
            - "GET /code-cycles returns total_count == 0"

      - name: list_jurisdictions_limit_above_maximum_returns_4xx
        claim_type: listing
        grounds:
          - endpoints[GET /jurisdictions]
          - errors.ERR_PAGINATION_INVALID
          - validations[priority=5]
          - response_envelope.pagination_defaults
        distinguishing_aspect: "limit is capped at 100, so limit=101 is 400 ERR_PAGINATION_INVALID rather than being silently clamped."
        test_recipe:
          setup:
            - "Empty database apart from the logical clock."
          setup_api_calls:
            - *k_clock0801
          trigger:
            - call: "GET /jurisdictions"
              payload: { limit: 101 }
              as: CouncilAdmin
              as_user_id: "admin-ops-1"
          assert:
            - "response.status == 400"
            - "response.data.error_id == ERR_PAGINATION_INVALID"

      - name: public_comment_is_immutable_and_carries_no_version_field
        claim_type: immutability
        grounds:
          - entities.PublicComment.common_fields
          - endpoints[GET /public-comments/{comment_id}]
          - entities.PublicComment.fields.received_at
          - entities.PublicComment.fields.comment_round
          - entities.PublicComment.fields.submitted_by_user_id
        distinguishing_aspect: "PublicComment is declared common_fields: false — the read exposes id and created_at but no updated_at and no version, and §1.5 declares no update or delete endpoint for it."
        test_recipe:
          setup:
            - "CodeCycle 2027 in DELIBERATION with a SEATED ENERGY committee."
            - "One AmendmentProposal in review_status COMMENT_OPEN, analysis_status COMPLETE, comment_round 1, with its window running 2026-08-10 to 2026-09-09."
            - "Logical clock advanced to 2026-08-15T00:00:00Z and one SUPPORT comment received."
          setup_api_calls:
            - *k_clock0801
            - *k_cycle
            - *k_cte
            - *k_m_chair
            - *k_m_fire
            - *k_m_loc
            - *k_m_des
            - *k_m_ind2
            - *k_m_pub
            - *k_intake_open
            - *k_propA
            - &k_intake_closed
              call: "POST /code-cycles/${cycle_id}/status"
              payload: { to_status: "INTAKE_CLOSED" }
              as: CouncilAdmin
              as_user_id: "admin-ops-1"
            - &k_screenA
              call: "POST /amendment-proposals/${prop_id}/screening"
              payload: { decision: "ACCEPT_FOR_ANALYSIS" }
              as: TechnicalStaff
              as_user_id: "staff-intake-1"
              captures: { prop_v_screened: $.data.version }
            - &k_cbA
              call: "POST /amendment-proposals/${prop_id}/impact-analyses"
              payload: { expected_proposal_version: "${prop_v_screened}", analysis_type: "COST_BENEFIT", incremental_cost_by_occupancy: { R3: 42375, R2: 61250, B: 118900, A2: 97150 }, affected_permit_count: 2410, annual_cost_savings_cents: 14500000, measure_life_years: 12 }
              as: TechnicalStaff
              as_user_id: "staff-analyst-1"
              captures: { cb_id: $.data.id }
            - &k_cbA_accept
              call: "POST /impact-analyses/${cb_id}/review"
              payload: { decision: "ACCEPT" }
              as: CouncilAdmin
              as_user_id: "admin-reviewer-1"
            - &k_readA
              call: "GET /amendment-proposals/${prop_id}"
              payload: {}
              as: CouncilAdmin
              as_user_id: "admin-ops-1"
              captures: { prop_v_partial: $.data.version }
            - &k_eiA
              call: "POST /amendment-proposals/${prop_id}/impact-analyses"
              payload: { expected_proposal_version: "${prop_v_partial}", analysis_type: "ENERGY_IMPACT", annual_energy_savings_kwh: 4250000, energy_delta_pct: -6.5 }
              as: TechnicalStaff
              as_user_id: "staff-analyst-1"
