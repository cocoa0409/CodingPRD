  # -------------------------------------------------------------------------
  # Rule 5 — Validation priority conflicts across different error-category pairs
  # -------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:

      - name: state_vs_business_safety_medical_decision_on_draft_with_bad_eod
        grounds:
          - validations[priority=5]
          - validations[priority=10]
          - errors[ERR_INVALID_APPLICATION_STATE]
          - errors[ERR_EOD_BEFORE_AOD]
        distinguishing_aspect: |
          On POST /applications/{id}/medical-decision: when the application
          is in DRAFT (violates priority 5 state precondition,
          ERR_INVALID_APPLICATION_STATE) AND simultaneously the payload
          carries established_onset_date < alleged_onset_date (violates
          priority 10 business_safety, ERR_EOD_BEFORE_AOD), priority 5 (state)
          wins because it is checked first. Category pair: state vs
          business_safety.
        test_recipe:
          setup:
            - "Server clock at 2026-01-15."
            - "Claimant + application in DRAFT (never submitted)."
            - "Payload carries EOD (2023-06-01) BEFORE AOD (2024-01-01) AND attempts a medical-decision while Application.status==DRAFT."
          setup_api_calls:
            - call: "POST /ssdi/_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-15T00:00:00Z" }
              as: SSAAdmin
            - call: "POST /ssdi/claimants"
              payload: { ssn_last4: "6060", full_name: "Conflict One", date_of_birth: "1980-01-01T00:00:00Z", filing_state: "TX" }
              as: SSAAdmin
              captures: { p1_id: "$.data.id" }
            - call: "POST /ssdi/applications"
              payload: { claimant_id: "${p1_id}", alleged_onset_date: "2024-01-01T00:00:00Z", protective_filing_date: "2026-01-15T00:00:00Z", claim_type: "SSDI_ONLY" }
              as: SSAAdmin
              captures: { ap1_id: "$.data.id", ap1_v: "$.data.version" }
            - call: "POST /ssdi/applications/${ap1_id}/evidence"
              payload: { source_type: "TREATING_PHYSICIAN", report_date: "2024-02-01T00:00:00Z", diagnosis_code: "M54.5", severity_score: 80 }
              as: Claimant
              as_user_id: "${p1_id}"
          trigger:
            - call: "POST /ssdi/applications/${ap1_id}/medical-decision"
              payload: { decision_type: "RFC_DISABLED", established_onset_date: "2023-06-01T00:00:00Z", rfc_score: 30, expected_application_version: "${ap1_v}" }
              as: DDSExaminer
              captures: { err: "$.data.error_id" }
          assert:
            - "response.status_code == 409"
            - "response.data.error_id == ERR_INVALID_APPLICATION_STATE"

      - name: business_referential_vs_business_safety_stale_version_with_bad_eod
        grounds:
          - validations[priority=8]
          - validations[priority=10]
          - errors[ERR_STALE_APPLICATION_VERSION]
          - errors[ERR_EOD_BEFORE_AOD]
        distinguishing_aspect: |
          On POST /applications/{id}/medical-decision: when payload
          simultaneously carries a stale expected_application_version
          (priority 8, business_referential) AND has EOD<AOD (priority 10,
          business_safety), the stale-version error (priority 8) wins.
          Category pair: business_referential vs business_safety — a
          DIFFERENT pair from instance 1's state vs business_safety pair.
        test_recipe:
          setup:
            - "Claimant in MEDICAL_REVIEW with valid evidence."
            - "Capture initial application version (= v after submit)."
            - "Cause version to drift: post another evidence (no — evidence doesn't bump app version per scaffold). Instead, the original v is captured BEFORE submit (so it's v=1, but submit already bumped it to v=2). Use the pre-submit value (1) as a stale token."
          setup_api_calls:
            - call: "POST /ssdi/_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-15T00:00:00Z" }
              as: SSAAdmin
