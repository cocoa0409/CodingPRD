                    loyalty_number: "LY00002601"
                    first_name: "Ada"
                    last_name: "Alpha"
                    postal_code: "10001"
                    address_line: null
                    event_timestamp: "2026-07-26T10:00:00Z"
                    consent_signals: []
              as: DataEngineer
              as_user_id: "u_eng"
              captures: { batch_id: "$.data.id" }
          trigger:
            - call: "POST /cdp/ingest-batches/${batch_id}/promote"
              payload: {}
              as: DataEngineer
              as_user_id: "u_eng"
          assert:
            - "the response status is 409"
            - "the response body error_id == ERR_INVALID_STATE"
            - "IngestBatch.${batch_id}.status is still RECEIVED and promoted_at == null"
            - "GET /cdp/profiles returns total_count 0"
            - "SourceSystem.${src_id}.status is still REGISTERED"

      - name: promote_activates_source_system_and_mints_profiles
        claim_type: side_effect_execution
        grounds:
          - state_machines.IngestBatch.VALIDATED_to_PROMOTED
          - state_machines.SourceSystem.REGISTERED_to_ACTIVE
          - calculations.identity_resolution_pass
        distinguishing_aspect: "Every declared side effect of the first successful promote fires: the batch becomes PROMOTED with counts written, two Profiles are minted RESOLVED / NORMAL, and the source flips REGISTERED -> ACTIVE."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "One SourceSystem in REGISTERED and one VALIDATED batch of two fully valid records with different postal codes and last names, and NO MatchRule at all, so the pass mints one Profile per record."
          setup_api_calls:
            - call: "POST /cdp/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: DataPlatformAdmin
