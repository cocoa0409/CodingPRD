              as: PlatformAdmin
              captures: { prog_id: "$.data.id", prog_v: "$.data.version" }
            - call: "POST /api/spec-units"
              payload: { program_id: "${prog_id}", unit_code: "U-1", max_items: 10, instruction_revision: 1, instruction_status: "PUBLISHED", field_schema: ["label"], coverage_start_utc: "2026-09-01T00:00:00Z", coverage_end_utc: "2026-09-19T00:00:00Z", expected_program_version: "${prog_v}", panel_size: 2 }
              as: PlatformAdmin
              captures: { u1_id: "$.data.id" }
            - call: "POST /api/programs/${prog_id}/program-state"
              payload: { program_action: "OPEN" }
              as: PlatformAdmin
            - call: "POST /api/workers/${a_id}/qualifications"
              payload: { language_code: "es-MX", tier: "EXPERT", qualification_action: "ENROLL" }
              as: PlatformAdmin
            - call: "POST /api/workers/${a_id}/qualifications"
              payload: { language_code: "es-MX", tier: "EXPERT", qualification_action: "VERIFY" }
              as: PlatformAdmin
            - call: "POST /api/workers/${b_id}/qualifications"
              payload: { language_code: "es-MX", tier: "PROFICIENT", qualification_action: "ENROLL" }
              as: PlatformAdmin
            - call: "POST /api/workers/${b_id}/qualifications"
              payload: { language_code: "es-MX", tier: "PROFICIENT", qualification_action: "VERIFY" }
              as: PlatformAdmin
            - call: "POST /api/spec-units/${u1_id}/items"
              payload: { item_key: "i-0001", payload_uri: "s3://ax/0001" }
              as: PlatformAdmin
              captures: { it1_id: "$.data.id" }
            - call: "POST /api/spec-units/${u1_id}/items"
              payload: { item_key: "i-0002", payload_uri: "s3://ax/0002" }
              as: PlatformAdmin
              captures: { it2_id: "$.data.id" }
            - call: "POST /api/items/${it1_id}/dispatch-panel"
              payload: {}
              as: PlatformAdmin
            - call: "GET /api/items/${it1_id}/commits"
              payload: { status: "DISPATCHED" }
              as: PlatformAdmin
              captures: { c1_id: "$.data[0].id", w1_id: "$.data[0].worker_id" }
            - call: "POST /api/commits/${c1_id}/commit-label"
              payload: { payload: { label: "A" }, instructions_ack: true }
              as: Worker
              as_user_id: "${w1_id}"
            - call: "POST /api/items/${it2_id}/dispatch-panel"
              payload: {}
              as: PlatformAdmin
          trigger:
            - call: "POST /api/programs/${prog_id}/program-state"
              payload: { program_action: "FREEZE" }
              as: PlatformAdmin
              captures: { final_status: "$.data.status" }
          assert:
            - "the freeze returns 200 and CustomerProgram.${prog_id}.status == FROZEN"
            - "the unit reaches status REJECTED"
            - "both pieces reach consensus_status REJECTED and status RESOLVED"
            - "the two outstanding assignments on the second piece reach COMMIT_EXPIRED, while the already committed member on the first piece survives as COMMITTED rather than being rewound"
            - "no partially frozen state is readable: a follow up read of any descendant shows the terminal values in the same response"
