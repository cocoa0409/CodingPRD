          assert:
            - "err == ERR_CAPITAL_REQUEST_TOO_LARGE and http status 422"
      - name: duplicate_period_open_negotiation_returns_negotiation_already_open
        claim_type: violation_to_error
        grounds:
          - validations[priority=11]
          - errors[ERR_NEGOTIATION_ALREADY_OPEN]
        distinguishing_aspect: "A second TERMS_PROPOSED negotiation for the same (retailer, period_code) fails ERR_NEGOTIATION_ALREADY_OPEN even when its window is disjoint (uniqueness priority 11 is independent of the temporal overlap rule at 17)."
        test_recipe:
          setup: ["Retailer R, Brands B1/B2 ACTIVE, negotiation N1 TERMS_PROPOSED for period 2027-H1"]
          setup_api_calls:
            - { call: "POST /portfolio/retailers", payload: { name: "R-VA16", risk_rating: "LOW" }, as: PortfolioManager, captures: { r_id: $.data.id } }
            - { call: "POST /portfolio/brands", payload: { name: "B-VA16-1", category_name: "storage", core_flag: true, private_label_share_pct: 40, annual_net_revenue_cents: 1000000000 }, as: PortfolioManager, captures: { b1: $.data.id } }
            - { call: "POST /portfolio/brands", payload: { name: "B-VA16-2", category_name: "tools", core_flag: true, private_label_share_pct: 10, annual_net_revenue_cents: 500000000 }, as: PortfolioManager, captures: { b2: $.data.id } }
            - { call: "POST /portfolio/combined-negotiations", payload: { retailer_id: "${r_id}", period_code: "2027-H1", brand_terms: [ { brand_id: "${b1}", baseline_facings: 100, proposed_facings: 90 }, { brand_id: "${b2}", baseline_facings: 60, proposed_facings: 50 } ], effective_from: "2027-01-01T00:00:00Z", effective_to: "2027-06-30T00:00:00Z" }, as: PortfolioManager }
          trigger:
            - { call: "POST /portfolio/combined-negotiations", payload: { retailer_id: "${r_id}", period_code: "2027-H1", brand_terms: [ { brand_id: "${b1}", baseline_facings: 100, proposed_facings: 95 }, { brand_id: "${b2}", baseline_facings: 60, proposed_facings: 55 } ], effective_from: "2028-01-01T00:00:00Z", effective_to: "2028-06-30T00:00:00Z" }, as: PortfolioManager, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_NEGOTIATION_ALREADY_OPEN and http status 409"
      - name: close_before_tsa_start_returns_tsa_not_started
        claim_type: violation_to_error
        grounds:
          - validations[priority=19]
          - errors[ERR_TSA_NOT_STARTED]
        distinguishing_aspect: "Close is gated on the logical clock reaching the TSA start_date; at the default clock 2026-09-01 with TSA start 2026-10-15, close fails ERR_TSA_NOT_STARTED."
        test_recipe:
          setup: ["Divestiture SPA_SIGNED, TSA window 2026-10-15..2027-10-15, expected_close 2026-11-01; clock left at default 2026-09-01"]
          setup_api_calls:
            - { call: "POST /portfolio/brands", payload: { name: "B-VA17", category_name: "tools", core_flag: false, private_label_share_pct: 20, annual_net_revenue_cents: 800000000 }, as: PortfolioManager, captures: { b_id: $.data.id } }
            - { call: "POST /portfolio/divestitures", payload: { brand_id: "${b_id}", acquirer_name: "Acq Co", headline_price_cents: 500000000, expected_close_date: "2026-11-01T00:00:00Z" }, as: PortfolioManager, captures: { d_id: $.data.id } }
            - { call: "POST /portfolio/divestitures/${d_id}/sign-spa", payload: { tsa_monthly_fee_cents: 75000, tsa_start_date: "2026-10-15T00:00:00Z", tsa_end_date: "2027-10-15T00:00:00Z" }, as: PortfolioManager }
          trigger:
            - { call: "POST /portfolio/divestitures/${d_id}/close", payload: {}, as: PortfolioManager, captures: { err: $.data.error_id } }
          assert:
