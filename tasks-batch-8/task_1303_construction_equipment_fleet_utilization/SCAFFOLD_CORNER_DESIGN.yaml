            - call: "POST /fleet/equipment-classes"
              payload: { class_code: "EXC-501", daily_rate_cents: 10000, external_daily_rate_cents: 12000, weekend_multiplier_bp: 5000, idle_day_multiplier_bp: 5000, service_interval_hours: 250, idle_alert_utilization_bp: 3000, expected_life_hours: 12000, salvage_value_cents: 800000 }
              as: FleetAdmin
              captures: { c501_id: $.data.id }
            - call: "POST /fleet/projects"
              payload: { project_code: "PRJ-501", name: "P501", equipment_budget_cents: 100000000 }
              as: FleetAdmin
              captures: { p501_id: $.data.id }
            - call: "POST /fleet/equipment"
