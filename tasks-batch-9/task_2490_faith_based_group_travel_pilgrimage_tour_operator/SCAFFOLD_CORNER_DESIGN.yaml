      - name: payment_sweep_touches_only_the_plans_that_are_past_due
        claim_type: bulk_action
        grounds:
          - endpoints."POST /departures/{departureId}/payment-sweep"
        excluded_because:
          difficulty_instance: transitive_cascade / payment_sweep_default_three_hop_cascade
          rationale: "The sweep's per-plan selectivity and its three-hop consequences on plan, payment_status and booking_status are asserted by the named §1.8 instance."

      - name: departure_cancel_releases_every_downstream_commitment
        claim_type: action_endpoint
        grounds:
          - endpoints."POST /departures/{departureId}/cancel"
        excluded_because:
