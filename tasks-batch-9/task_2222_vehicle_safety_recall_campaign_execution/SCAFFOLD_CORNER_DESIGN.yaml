              as: RecallOperationsManager
              as_user_id: "u-ops-1"
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP status is 409"
            - "response.data.error_id == \"ERR_WAVE_INVALID_STATE\""
            - "GET /recall-campaigns/${camp_id}/notification-waves shows the wave still status == \"PLANNED\" with mailed_vehicle_count == 0 and actual_mail_date null"
            - "GET /recall-campaigns/${camp_id} still shows campaign_status == \"FILED\""

      - name: newly_created_notification_wave_starts_in_planned_with_sequence_one
        claim_type: initial_state
        grounds:
          - state_machines.NotificationWave.initial_state
          - entities.NotificationWave.fields.sequence_number
          - entities.NotificationWave.fields.auto_created
        distinguishing_aspect: |
          A hand-created wave enters at PLANNED with sequence_number 1 and auto_created false --
          distinguishing operator-created waves from the FOLLOW_UP waves the completion-rate trigger
