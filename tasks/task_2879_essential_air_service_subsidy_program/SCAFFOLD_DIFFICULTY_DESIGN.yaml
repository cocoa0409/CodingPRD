            - "Community.${comm_id}.status == SUBSIDIZED and active_agreement_count == 2 after the touching award"

      - name: carrier_reentry_buffer_after_termination
        grounds:
          - validations.priority_19
          - errors.ERR_CARRIER_REENTRY_BUFFER
          - entities.ServiceAgreement.fields.terminated_at
          - state_machines.ServiceAgreement.ACTIVE_to_TERMINATED
          - endpoints.POST_/eas/solicitations/{id}/selection-order
        overlap_dimension: "instant vs buffered point — the logical clock at award against ServiceAgreement.terminated_at plus 14 days, scoped to the (Carrier, Community) pair"
        contended_resource: "a carrier's right to re-enter the same community after walking away from it"
        distinguishing_aspect: |
          Unlike the rate-interval rule this compares one instant against one derived point, the
          exclusion window is defined by a fixed 14-day offset rather than by the agreement's own term,
          and the scope key is the (Carrier, Community) pair rather than the Community alone — so the
          same carrier may start a new agreement for a *different* community inside the window. The
          bound is inclusive: exactly terminated_at + 14 days is accepted.
        test_recipe:
          setup:
            - "Community HYS held ACTIVE agreement A1 (Prairie Air, term 12) which was terminated by the program at clock 2026-08-01 with no reported periods, leaving HYS ELIGIBLE again."
            - "Community DDC is ELIGIBLE and has never contracted."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
