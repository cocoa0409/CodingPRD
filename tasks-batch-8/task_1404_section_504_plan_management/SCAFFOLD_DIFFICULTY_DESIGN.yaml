  # ===========================================================================
  # Rule 4 — transitive_cascade (two cascades, different triggers, different depths)
  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: clock_advance_cascade_review_overdue_posture_flip_mutation_blocked
        grounds:
          - state_machines.ReviewEvent.SCHEDULED_to_OVERDUE
          - calculations.school_posture_derivation
          - entities.School.fields.school_posture
        distinguishing_aspect: |
          Depth-3 cascade from clock advance trigger: POST /_clock/set_current_utc
          flips ReviewEvent SCHEDULED -> OVERDUE (level 1); that mutation itself
          triggers school_posture recomputation (level 2); the posture flip to
          PROBATION or AUDIT_HOLD gates subsequent mutations (level 3 — verified
          by attempting a referral submission which is rejected when posture =
          AUDIT_HOLD). Distinct from grievance cascade below.
        test_recipe:
          setup:
            - "School S1 with active plan P (effective 2025-08-01); ANNUAL review scheduled for 2026-08-01"
            - "School also has 2 open grievances (FILED status, each contributing 20 to posture score)"
            - "Clock initially at 2026-08-10 (within grace); review still SCHEDULED, posture = PROBATION (2*20 = 40, in [30,60))"
            - "Advance clock to 2026-08-20 (385 days): review flips OVERDUE; composite = 40 + 15 = 55 (still PROBATION). Then add another overdue or trigger training gap — actually we need to push to AUDIT_HOLD."
            - "Refine setup: school has 2 open grievances (40) + 1 expiring training (all staff training expires when clock crosses 2027-08-01 — but that's far out)"
            - "Simplest path to AUDIT_HOLD: 2 grievances (40) + 2 overdue reviews (30, capped) = 70 >= 60 → AUDIT_HOLD. So set up 2 plans each with an overdue review."
