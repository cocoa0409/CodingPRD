            - { call: "POST /api/contracts", payload: { ingredient_id: "${corn_id}", supplier_ref: "SUP-C3", fixed_price_cents_per_ton: 29100, total_tons: 50, window_start_date: "2026-05-31", window_end_date: "2026-06-30" }, as: MillManager, captures: { err_touch: $.data.error_id } }
            - { call: "POST /api/contracts", payload: { ingredient_id: "${corn_id}", supplier_ref: "SUP-C4", fixed_price_cents_per_ton: 29100, total_tons: 50, window_start_date: "2026-06-01", window_end_date: "2026-06-30" }, as: MillManager, captures: { c4_id: $.data.id } }
          assert:
            - "err_ov == ERR_CONTRACT_WINDOW_OVERLAP (true overlap)"
            - "err_touch == ERR_CONTRACT_WINDOW_OVERLAP (05-31 belongs to both closed windows — touching dates conflict)"
            - "C4 created (201): start 06-01 is the first non-conflicting date; Contract.${c4_id}.status == OPEN"

