        distinguishing_aspect: "The NORMAL to CLOSED field-maintenance transition is a depth-4 transitive cascade — Complex closure withdraws a GroupAssignment, that withdrawal disbands the now-empty WorkoutGroup, and that disband resets the member player's program-profile phase and clears their active assignment — with each hop caused by the previous hop rather than by the original request."
