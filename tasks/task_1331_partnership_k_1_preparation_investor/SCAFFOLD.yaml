# =============================================================================
# SCAFFOLD — Partnership K-1 Preparation & Investor Distribution
# =============================================================================

scenario: |
  Partnership K-1 Preparation & Investor Distribution (fund tax administrator): allocation of income/loss per partnership agreement, capital account maintenance & tax basis tracking, special allocation & waterfall implementation, state apportionment & composite filing, K-1 generation & delivery deadlines, amended K-1 process & investor communication, foreign partner withholding, investor tax question support

domain_name: partnership-k1-administration
api_prefix: /funds

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: ledger_reconciliation
  complexity_layers:
    - optimistic_concurrency
    - dual_variant_calculation
    - cascading_side_effects
    - derived_field_reconciliation
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - self_referential
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# Table 1: Entity-Relationship Table
# =============================================================================
entities:
  - name: Fund
    parent: null
    common_fields: true
    fields:
      - { name: legal_name, type: string, source: input, description: "Fund legal name" }
      - { name: ein, type: string, source: input, description: "Employer identification number; unique across funds" }
      - { name: waterfall_hurdle_rate_bps, type: integer, source: input, description: "Preferred-return annual hurdle in basis points (800 = 8%)" }
      - { name: waterfall_catchup_bps, type: integer, source: input, description: "GP catch-up cap as bps of preferred pool actually paid (2000 = 20%)" }
      - { name: waterfall_carry_bps, type: integer, source: input, description: "GP carried-interest share of residual tier in bps (2000 = 20%)" }
      - { name: foreign_ownership_cap_pct_bps, type: integer, source: input, description: "Max aggregate foreign-partner ownership share in bps of total ACTIVE ownership (5000 = 50%); inclusive upper bound" }
      - { name: management_fee_rate_bps, type: integer, source: input, description: "Annual management fee in bps of total ACTIVE capital commitments" }
      - { name: fee_discount_threshold_cents, type: integer, source: input, description: "If gross ordinary income is strictly below this, fee discount applies" }
      - { name: fee_discount_bps, type: integer, source: input, description: "Fee discount in bps (5000 = fee halved)" }

  - name: TaxYear
    parent: Fund
    common_fields: true
    fields:
      - { name: fund_id, type: string, source: input, description: "FK -> Fund.id" }
      - { name: year, type: integer, source: input, description: "Calendar tax year (e.g. 2025); unique per fund" }
      - { name: gross_ordinary_income_cents, type: integer, source: input, description: "Fund-level gross ordinary business income before management fee" }
      - { name: capital_gain_cents, type: integer, source: input, description: "Fund-level net capital gain" }
      - { name: interest_income_cents, type: integer, source: input, description: "Fund-level interest income" }
      - { name: federal_extension_filed, type: boolean, source: input, default: false, description: "Whether Form 7004 extension was filed" }
      - { name: management_fee_cents, type: integer, source: computed, description: "Per management_fee_net_income calculation" }
      - { name: net_ordinary_income_cents, type: integer, source: computed, description: "gross_ordinary_income_cents - management_fee_cents" }
      - { name: k1_delivery_deadline, type: datetime, source: computed, description: "{year+1}-03-15T23:59:59Z, or {year+1}-09-15T23:59:59Z when federal_extension_filed" }
      - { name: status, type: enum, source: system, description: "OPEN | BOOKS_CLOSED | ALLOCATED | UNDER_REVIEW | APPROVED | COMPLETED" }

  - name: Partner
    parent: Fund
    common_fields: true
    fields:
      - { name: fund_id, type: string, source: input, description: "FK -> Fund.id" }
      - { name: legal_name, type: string, source: input, description: "Partner legal name" }
      - { name: partner_type, type: enum, source: input, description: "US_INDIVIDUAL | US_ENTITY | TAX_EXEMPT | FOREIGN_INDIVIDUAL | FOREIGN_ENTITY" }
      - { name: partner_class, type: enum, source: input, description: "GENERAL | LIMITED" }
      - { name: residency_state, type: string, source: input, description: "2-letter US state code, or XX for foreign partners" }
      - { name: ownership_pct_bps, type: integer, source: input, description: "Ownership share at admission in bps (10000 = 100%)" }
      - { name: capital_commitment_cents, type: integer, source: input, description: "Total committed capital" }
      - { name: admission_date, type: string, source: input, description: "ISO date of admission (YYYY-MM-DD)" }
      - { name: is_foreign, type: boolean, source: computed, description: "true when partner_type is FOREIGN_INDIVIDUAL or FOREIGN_ENTITY" }
      - { name: current_ownership_pct_bps, type: integer, source: computed, description: "Ownership after applying SETTLED transfers with effective_date <= current clock date" }
      - { name: capital_account_balance_cents, type: integer, source: computed, description: "Book capital per capital_account_and_tax_basis (BOOK_CAPITAL variant)" }
      - { name: tax_basis_cents, type: integer, source: computed, description: "Outside basis per capital_account_and_tax_basis (TAX_BASIS variant); floors at 0" }
      - { name: excess_distribution_gain_cents, type: integer, source: computed, description: "Cumulative distributions reclassified as gain because basis floored at 0" }
      - { name: status, type: enum, source: system, description: "ACTIVE | WITHDRAWN" }

  - name: CapitalAccountEvent
    parent: Partner
    common_fields: true
    fields:
      - { name: partner_id, type: string, source: input, description: "FK -> Partner.id" }
      - { name: tax_year_id, type: string, source: input, description: "FK -> TaxYear.id; effective_date must fall inside that year" }
      - { name: event_type, type: enum, source: input, description: "CONTRIBUTION | DISTRIBUTION | ALLOCATION_SHARE | TRANSFER_IN | TRANSFER_OUT | ADJUSTMENT" }
      - { name: amount_cents, type: integer, source: input, description: "Signed cents, non-zero; CONTRIBUTION/TRANSFER_IN/ALLOCATION_SHARE raise book capital by +amount, DISTRIBUTION/TRANSFER_OUT lower it by -amount; mirror events carry negated amount" }
      - { name: effective_date, type: string, source: input, description: "ISO date the event is economically effective" }
      - { name: memo, type: string, source: input, description: "Free-text memo", default: null }
      - { name: reverses_event_id, type: string, source: system, description: "FK -> CapitalAccountEvent.id; set only on mirror events created by reverse; null otherwise", default: null }
      - { name: sequence_no, type: integer, source: computed, description: "Per-partner monotonically increasing integer assigned in creation order (first event = 1)" }
      - { name: status, type: enum, source: system, description: "POSTED | REVERSED (REVERSED marks an original that has a mirror; both remain in the replay stream)" }

  - name: OwnershipTransfer
    parent: Fund
    common_fields: true
    fields:
      - { name: fund_id, type: string, source: input, description: "FK -> Fund.id" }
      - { name: transferor_partner_id, type: string, source: input, description: "FK -> Partner.id" }
      - { name: transferee_partner_id, type: string, source: input, description: "FK -> Partner.id" }
      - { name: pct_bps, type: integer, source: input, description: "Ownership share transferred, in bps" }
      - { name: effective_date, type: string, source: input, description: "ISO date economic ownership passes" }
      - { name: settlement_date, type: string, source: input, description: "ISO date the transfer settles; must be >= effective_date" }
      - { name: transferred_capital_cents, type: integer, source: computed, default: null, description: "Capital moved at settle: round_half_up(book balance of transferor at effective_date * pct_bps / ownership_pct_bps of transferor in the proration segment immediately before effective_date)" }
      - { name: status, type: enum, source: system, description: "PROPOSED | CONFIRMED | SETTLED | CANCELLED" }

  - name: AllocationRun
    parent: TaxYear
    common_fields: true
    fields:
      - { name: tax_year_id, type: string, source: input, description: "FK -> TaxYear.id" }
      - { name: run_kind, type: enum, source: input, description: "PROVISIONAL | FINAL" }
      - { name: run_seq, type: integer, source: computed, description: "Per-tax-year increasing sequence (first run = 1)" }
      - { name: ordinary_total_cents, type: integer, source: computed, description: "Category total actually allocated (projected for PROVISIONAL)" }
      - { name: capital_gain_total_cents, type: integer, source: computed, description: "Category total actually allocated" }
      - { name: interest_total_cents, type: integer, source: computed, description: "Category total actually allocated" }
      - { name: computed_at, type: datetime, source: system, description: "Logical-clock timestamp of computation" }
      - { name: status, type: enum, source: system, description: "COMPUTED | LOCKED | STALE | SUPERSEDED" }

  - name: AllocationLine
    parent: AllocationRun
    common_fields: true
    fields:
      - { name: run_id, type: string, source: system, description: "FK -> AllocationRun.id" }
      - { name: partner_id, type: string, source: system, description: "FK -> Partner.id" }
      - { name: category, type: enum, source: system, description: "ORDINARY | CAPITAL_GAIN | INTEREST" }
      - { name: amount_cents, type: integer, source: computed, description: "Allocated amount for (run, partner, category); may be negative for losses" }
      - { name: applied_mechanism, type: enum, source: computed, description: "PRO_RATA | SPECIAL | PREFERRED | CATCHUP | RESIDUAL; dominant mechanism for this line (RESIDUAL when waterfall residual tier produced the line)" }

  - name: SpecialAllocation
    parent: TaxYear
    common_fields: true
    fields:
      - { name: tax_year_id, type: string, source: input, description: "FK -> TaxYear.id" }
      - { name: partner_id, type: string, source: input, description: "FK -> Partner.id" }
      - { name: category, type: enum, source: input, description: "ORDINARY | CAPITAL_GAIN | INTEREST" }
      - { name: target_pct_bps, type: integer, source: input, description: "Share of the category total directed to this partner, in bps" }
      - { name: effective_from, type: string, source: input, description: "ISO date, inclusive lower bound of the half-open window" }
      - { name: effective_to, type: string, source: input, description: "ISO date, exclusive upper bound; must be > effective_from" }
      - { name: proposed_by_user_id, type: string, source: system, description: "X-User-ID of the proposer (segregation-of-duties anchor)" }
      - { name: reviewed_by_user_id, type: string, source: system, description: "X-User-ID of approver/rejecter", default: null }
      - { name: status, type: enum, source: system, description: "PROPOSED | APPROVED | REJECTED" }

  - name: CompositeFiling
    parent: TaxYear
    common_fields: true
    fields:
      - { name: tax_year_id, type: string, source: input, description: "FK -> TaxYear.id" }
      - { name: state_code, type: string, source: input, description: "2-letter state code; unique per tax year" }
      - { name: apportionment_pct_bps, type: integer, source: input, description: "Share of fund income apportioned to this state, in bps; sum over a tax year's filings must be <= 10000" }
      - { name: composite_rate_bps, type: integer, source: input, description: "State composite tax rate in bps" }
      - { name: min_income_cents, type: integer, source: input, description: "Minimum state-source income for inclusion; inclusive lower bound" }
      - { name: included_partner_ids, type: array, source: computed, description: "Partners passing composite_tax eligibility, sorted by Partner.created_at ASC" }
      - { name: total_state_source_income_cents, type: integer, source: computed, description: "Sum of per-partner rounded state-source income" }
      - { name: total_composite_tax_cents, type: integer, source: computed, description: "Sum of per-partner rounded composite tax (per-partner-then-sum order)" }
      - { name: filed_at, type: datetime, source: system, description: "Logical-clock timestamp of filing", default: null }
      - { name: status, type: enum, source: system, description: "DRAFT | FILED | ACCEPTED" }

  - name: WithholdingRecord
    parent: Partner
    common_fields: true
    fields:
      - { name: partner_id, type: string, source: system, description: "FK -> Partner.id; foreign partners only" }
      - { name: tax_year_id, type: string, source: system, description: "FK -> TaxYear.id" }
      - { name: quarter, type: integer, source: system, description: "1..4" }
      - { name: method, type: enum, source: system, description: "SAFE_HARBOR | CURRENT_ACTUAL" }
      - { name: annual_ecti_cents, type: integer, source: computed, description: "Partner's annual effectively connected taxable income basis used by the method" }
      - { name: rate_bps, type: integer, source: computed, description: "3700 for FOREIGN_INDIVIDUAL, 2100 for FOREIGN_ENTITY" }
      - { name: accrued_cents, type: integer, source: computed, description: "Required quarterly withholding per foreign_withholding" }
      - { name: remitted_cents, type: integer, source: system, default: 0, description: "Cumulative remitted amount" }
      - { name: due_date, type: string, source: computed, description: "Q1 {year}-04-15, Q2 {year}-06-15, Q3 {year}-09-15, Q4 {year}-12-15" }
      - { name: penalty_cents, type: integer, source: computed, default: 0, description: "Underpayment penalty computed at reconcile per withholding_penalty" }
      - { name: status, type: enum, source: system, description: "ACCRUED | PARTIALLY_REMITTED | REMITTED | RECONCILED" }

  - name: K1Package
    parent: Partner
    common_fields: true
    fields:
      - { name: partner_id, type: string, source: system, description: "FK -> Partner.id" }
      - { name: tax_year_id, type: string, source: system, description: "FK -> TaxYear.id" }
      - { name: run_id, type: string, source: system, description: "FK -> AllocationRun.id; the LOCKED FINAL run this package snapshots" }
      - { name: generation, type: integer, source: system, description: "1 for original; +1 per issued amendment" }
      - { name: supersedes_k1_id, type: string, source: system, description: "FK -> K1Package.id; null on generation 1", default: null }
      - { name: prep_status, type: enum, source: system, description: "GENERATED | REVIEWED | APPROVED | DELIVERED | SUPERSEDED — parallel dimension 1" }
      - { name: delivery_status, type: enum, source: system, description: "PENDING | SENT | ACKNOWLEDGED | BOUNCED — parallel dimension 2, independent of prep_status" }
      - { name: line_snapshot, type: object, source: computed, description: "{ ordinary_cents, capital_gain_cents, interest_cents, capital_beginning_cents, capital_ending_cents } frozen from the locked run and capital replay" }
      - { name: submitted_by_user_id, type: string, source: system, description: "X-User-ID recorded at submit-review", default: null }
      - { name: approved_by_user_id, type: string, source: system, description: "X-User-ID recorded at approve", default: null }
      - { name: delivery_method, type: enum, source: system, description: "PORTAL | MAIL | EMAIL; set at deliver/resend", default: null }
      - { name: delivered_at, type: datetime, source: system, description: "Logical-clock timestamp of latest deliver/resend", default: null }
      - { name: is_late, type: boolean, source: computed, default: false, description: "delivered_at > TaxYear.k1_delivery_deadline (strictly greater is late)" }

  - name: K1Amendment
    parent: K1Package
    common_fields: true
    fields:
      - { name: k1_package_id, type: string, source: input, description: "FK -> K1Package.id; the delivered package being amended" }
      - { name: reason, type: enum, source: input, description: "ALLOCATION_CHANGE | PARTNER_DATA_FIX | STATE_REAPPORTIONMENT | LATE_K1_CORRECTION" }
      - { name: opened_by_user_id, type: string, source: system, description: "X-User-ID of creator" }
      - { name: prepared_by_user_id, type: string, source: system, description: "X-User-ID recorded at submit-review", default: null }
      - { name: issued_by_user_id, type: string, source: system, description: "X-User-ID recorded at issue", default: null }
      - { name: new_k1_package_id, type: string, source: system, description: "id of the replacement K1Package created at issue", default: null }
      - { name: status, type: enum, source: system, description: "OPENED | IN_PREP | IN_REVIEW | ISSUED" }

  - name: InvestorTicket
    parent: Partner
    common_fields: true
    fields:
      - { name: partner_id, type: string, source: input, description: "FK -> Partner.id" }
      - { name: tax_year_id, type: string, source: input, description: "FK -> TaxYear.id; null allowed for general questions", default: null }
      - { name: category, type: enum, source: input, description: "ALLOCATION_QUESTION | WITHHOLDING_QUESTION | DELIVERY_ISSUE | AMENDED_K1_QUESTION | STATE_FILING_QUESTION" }
      - { name: subject, type: string, source: input, description: "Short subject line" }
      - { name: due_at, type: datetime, source: computed, description: "created_at + SLA (24h for AMENDED_K1_QUESTION, 72h otherwise)" }
      - { name: is_escalated, type: boolean, source: computed, default: false, description: "current clock > due_at and status in {OPEN, REOPENED}" }
      - { name: answer_text, type: string, source: system, description: "Answer body recorded at answer", default: null }
      - { name: answered_by_user_id, type: string, source: system, description: "X-User-ID of latest answer", default: null }
      - { name: status, type: enum, source: system, description: "OPEN | ANSWERED | REOPENED | CLOSED" }

# =============================================================================
# Table 2: State Machine Table
# =============================================================================
state_machines:
  - entity: TaxYear
    initial_state: OPEN
    terminal_states: []
    note: "COMPLETED is quiescent, not absorbing: issuance of a K1Amendment reopens it to APPROVED"
    transitions:
      - from: OPEN
        to: BOOKS_CLOSED
        trigger: "POST /funds/tax-years/{taxYearId}/close-books"
        actor: FundTaxAdmin
        preconditions:
          - "At least one ACTIVE partner exists for the fund (ERR_NO_ALLOCABLE_PARTNERS)"
        side_effects:
          - "increments TaxYear.version by 1"
      - from: BOOKS_CLOSED
        to: ALLOCATED
        trigger: "system (automatic when a FINAL AllocationRun for this tax year transitions to LOCKED)"
        actor: system
        preconditions: []
        side_effects:
          - "increments TaxYear.version by 1"
      - from: ALLOCATED
        to: UNDER_REVIEW
        trigger: "POST /funds/tax-years/{taxYearId}/submit-review"
        actor: TaxPreparer
        preconditions:
          - "A LOCKED FINAL AllocationRun exists for this tax year (ERR_ALLOCATION_NOT_LOCKED)"
        side_effects:
          - "increments TaxYear.version by 1"
      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /funds/tax-years/{taxYearId}/approve"
        actor: TaxReviewer
        preconditions:
          - "The tax year's LOCKED FINAL run is not STALE (ERR_ALLOCATION_STALE)"
        side_effects:
          - "increments TaxYear.version by 1"
      - from: APPROVED
        to: COMPLETED
        trigger: "system (automatic when every non-SUPERSEDED K1Package of this tax year has prep_status == DELIVERED and at least one K1Package exists)"
        actor: system
        preconditions: []
        side_effects:
          - "increments TaxYear.version by 1"
      - from: APPROVED
        to: BOOKS_CLOSED
        trigger: "POST /funds/tax-years/{taxYearId}/reopen"
        actor: FundTaxAdmin
        preconditions:
          - "No K1Package of this tax year has prep_status == DELIVERED (ERR_K1_ALREADY_GENERATED)"
        side_effects:
          - "The tax year's LOCKED AllocationRun transitions LOCKED -> STALE (cascade hop 1)"
          - "Every K1Package of this tax year with prep_status in {REVIEWED, APPROVED} reverts to GENERATED (cascade hop 2, caused by the run going STALE)"
          - "increments TaxYear.version by 1"
      - from: COMPLETED
        to: APPROVED
        trigger: "system (automatic when a K1Amendment for a K1Package of this tax year is ISSUED)"
        actor: system
        preconditions: []
        side_effects:
          - "increments TaxYear.version by 1"

  - entity: Partner
    initial_state: ACTIVE
    terminal_states: [WITHDRAWN]
    transitions:
      - from: ACTIVE
        to: WITHDRAWN
        trigger: "POST /funds/partners/{partnerId}/withdraw"
        actor: FundTaxAdmin
        preconditions:
          - "capital_account_balance_cents == 0 exactly (ERR_PARTNER_CAPITAL_NOT_ZERO)"
          - "No K1Package of this partner has prep_status in {GENERATED, REVIEWED, APPROVED} (ERR_INVALID_STATE_TRANSITION)"
        side_effects:
          - "increments Partner.version by 1"

  - entity: CapitalAccountEvent
    initial_state: POSTED
    terminal_states: [REVERSED]
    transitions:
      - from: POSTED
        to: REVERSED
        trigger: "POST /funds/capital-events/{eventId}/reverse"
        actor: TaxPreparer
        preconditions:
          - "Event has reverses_event_id == null (a mirror cannot be reversed: ERR_REVERSAL_OF_REVERSAL)"
          - "Event status == POSTED (second reverse: ERR_INVALID_STATE_TRANSITION)"
        side_effects:
          - "Create mirror CapitalAccountEvent: same partner_id, tax_year_id, event_type; amount_cents = -original.amount_cents; effective_date = original.effective_date; reverses_event_id = original.id; status POSTED"
          - "Recompute Partner.capital_account_balance_cents, tax_basis_cents, excess_distribution_gain_cents via full chronological replay (ledger sync)"
          - "increments CapitalAccountEvent.version by 1 (original) and Partner.version by 1"

  - entity: OwnershipTransfer
    initial_state: PROPOSED
    terminal_states: [SETTLED, CANCELLED]
    transitions:
      - from: PROPOSED
        to: CONFIRMED
        trigger: "POST /funds/transfers/{transferId}/confirm"
        actor: FundTaxAdmin
        preconditions:
          - "Both partners exist in the same fund (ERR_CROSS_FUND_REFERENCE) and are distinct (ERR_SAME_PARTNER_TRANSFER)"
          - "Both partners have status == ACTIVE (ERR_INVALID_STATE_TRANSITION)"
          - "Projected aggregate foreign ownership after the transfer <= Fund.foreign_ownership_cap_pct_bps (ERR_FOREIGN_OWNERSHIP_CAP_EXCEEDED)"
          - "The TaxYear containing effective_date has status != COMPLETED (ERR_TAX_YEAR_WINDOW_CLOSED)"
          - "Closed interval [effective_date, settlement_date] does not intersect any other PROPOSED/CONFIRMED/SETTLED transfer of the same transferor; sharing an endpoint date counts as overlap (ERR_TRANSFER_WINDOW_OVERLAP)"
          - "pct_bps <= transferor.current_ownership_pct_bps (ERR_INSUFFICIENT_OWNERSHIP)"
        side_effects:
          - "increments OwnershipTransfer.version by 1"
      - from: CONFIRMED
        to: SETTLED
        trigger: "POST /funds/transfers/{transferId}/settle"
        actor: FundTaxAdmin
        preconditions:
          - "Current clock date >= settlement_date (ERR_TAX_YEAR_WINDOW_CLOSED)"
        side_effects:
          - "Create TRANSFER_OUT CapitalAccountEvent on transferor and TRANSFER_IN on transferee, each with amount_cents = transferred_capital_cents and effective_date = transfer.effective_date (cascade hop 1)"
          - "Recompute both partners' capital_account_balance_cents, tax_basis_cents, current_ownership_pct_bps (cascade hop 2, caused by the two new events entering the replay stream)"
          - "Every LOCKED AllocationRun whose tax year contains effective_date transitions LOCKED -> STALE (cascade hop 3, caused by the ownership/balance recompute invalidating proration inputs)"
          - "Every K1Package of such a tax year with prep_status in {REVIEWED, APPROVED} reverts to GENERATED (cascade hop 4, caused by the run going STALE)"
          - "increments OwnershipTransfer.version by 1 and both Partners' version by 1"
      - from: PROPOSED
        to: CANCELLED
        trigger: "POST /funds/transfers/{transferId}/cancel"
        actor: FundTaxAdmin
        preconditions: []
        side_effects: []
      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /funds/transfers/{transferId}/cancel"
        actor: FundTaxAdmin
        preconditions: []
        side_effects: []

  - entity: AllocationRun
    initial_state: COMPUTED
    terminal_states: [SUPERSEDED]
    transitions:
      - from: COMPUTED
        to: LOCKED
        trigger: "POST /funds/allocation-runs/{runId}/lock"
        actor: TaxReviewer
        preconditions:
          - "run_kind == FINAL (locking a PROVISIONAL run: ERR_INVALID_STATE_TRANSITION)"
          - "TaxYear.status in {BOOKS_CLOSED, ALLOCATED, UNDER_REVIEW, APPROVED} (ERR_TAX_YEAR_NOT_BOOKS_CLOSED)"
          - "For each category, sum of target_pct_bps over the tax year's APPROVED SpecialAllocations <= 10000 (ERR_SPECIAL_ALLOCATION_OVERFLOW)"
        side_effects:
          - "Post one ALLOCATION_SHARE CapitalAccountEvent per allocated partner: partner_id = line partner, tax_year_id = run tax year, amount_cents = sum of the partner's line amounts across categories (may be negative for losses), effective_date = {tax year}-12-31, memo = run id; these events enter the capital replay and raise/lower capital_account_balance_cents and tax_basis_cents"
          - "If TaxYear.status == BOOKS_CLOSED: TaxYear transitions BOOKS_CLOSED -> ALLOCATED (bubble-up); otherwise the tax-year status is unchanged"
          - "increments AllocationRun.version by 1 and TaxYear.version by 1"
      - from: COMPUTED
        to: SUPERSEDED
        trigger: "system (automatic when a newer AllocationRun is created for the same tax year)"
        actor: system
        preconditions: []
        side_effects: []
      - from: LOCKED
        to: STALE
        trigger: "system (automatic on OwnershipTransfer settle affecting the tax year, or on TaxYear reopen)"
        actor: system
        preconditions: []
        side_effects:
          - "K1Packages snapshotting this run with prep_status in {REVIEWED, APPROVED} revert to GENERATED"
      - from: STALE
        to: SUPERSEDED
        trigger: "system (automatic when a newer AllocationRun is created for the same tax year)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: SpecialAllocation
    initial_state: PROPOSED
    terminal_states: [APPROVED, REJECTED]
    transitions:
      - from: PROPOSED
        to: APPROVED
        trigger: "POST /funds/special-allocations/{saId}/approve"
        actor: TaxReviewer
        preconditions:
          - "X-User-ID != proposed_by_user_id (segregation of duties: ERR_SEGREGATION_OF_DUTIES)"
          - "Half-open window [effective_from, effective_to) does not intersect any other PROPOSED or APPROVED SpecialAllocation with the same (tax_year_id, partner_id, category); touching endpoints (one effective_to == the other's effective_from) do NOT overlap (ERR_SPECIAL_ALLOCATION_OVERLAP)"
          - "TaxYear.status in {OPEN, BOOKS_CLOSED} (ERR_TAX_YEAR_WINDOW_CLOSED)"
        side_effects:
          - "reviewed_by_user_id = X-User-ID"
      - from: PROPOSED
        to: REJECTED
        trigger: "POST /funds/special-allocations/{saId}/reject"
        actor: TaxReviewer
        preconditions:
          - "X-User-ID != proposed_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "reviewed_by_user_id = X-User-ID"

  - entity: CompositeFiling
    initial_state: DRAFT
    terminal_states: [ACCEPTED]
    transitions:
      - from: DRAFT
        to: FILED
        trigger: "POST /funds/composite-filings/{cfId}/file"
        actor: TaxPreparer
        preconditions:
          - "TaxYear.status in {ALLOCATED, UNDER_REVIEW, APPROVED, COMPLETED} (ERR_TAX_YEAR_NOT_BOOKS_CLOSED)"
          - "A LOCKED FINAL AllocationRun exists and is not STALE (ERR_ALLOCATION_NOT_LOCKED / ERR_ALLOCATION_STALE)"
          - "included_partner_ids is non-empty (ERR_COMPOSITE_PARTNER_INELIGIBLE)"
        side_effects:
          - "Recompute included_partner_ids, total_state_source_income_cents, total_composite_tax_cents from the LOCKED run (composite_tax)"
          - "filed_at = current logical clock"
      - from: FILED
        to: ACCEPTED
        trigger: "POST /funds/composite-filings/{cfId}/record-outcome with outcome=ACCEPTED"
        actor: FundTaxAdmin
        preconditions: []
        side_effects: []
      - from: FILED
        to: DRAFT
        trigger: "POST /funds/composite-filings/{cfId}/record-outcome with outcome=REJECTED"
        actor: FundTaxAdmin
        preconditions: []
        side_effects:
          - "filed_at reset to null; filing may be corrected and re-filed"

  - entity: WithholdingRecord
    initial_state: ACCRUED
    terminal_states: [RECONCILED]
    transitions:
      - from: ACCRUED
        to: PARTIALLY_REMITTED
        trigger: "POST /funds/withholding-records/{wrId}/remit with 0 < amount_cents < accrued_cents - remitted_cents"
        actor: TaxPreparer
        preconditions:
          - "remitted_cents + amount_cents <= accrued_cents (ERR_REMIT_EXCEEDS_ACCRUED)"
        side_effects:
          - "remitted_cents += amount_cents"
      - from: PARTIALLY_REMITTED
        to: PARTIALLY_REMITTED
        trigger: "POST /funds/withholding-records/{wrId}/remit with cumulative still below accrued"
        actor: TaxPreparer
        preconditions:
          - "remitted_cents + amount_cents <= accrued_cents (ERR_REMIT_EXCEEDS_ACCRUED)"
        side_effects:
          - "remitted_cents += amount_cents"
      - from: ACCRUED
        to: REMITTED
        trigger: "POST /funds/withholding-records/{wrId}/remit with remitted_cents + amount_cents == accrued_cents exactly"
        actor: TaxPreparer
        preconditions: []
        side_effects:
          - "remitted_cents = accrued_cents"
      - from: PARTIALLY_REMITTED
        to: REMITTED
        trigger: "POST /funds/withholding-records/{wrId}/remit completing the accrued amount exactly"
        actor: TaxPreparer
        preconditions: []
        side_effects:
          - "remitted_cents = accrued_cents"
      - from: ACCRUED
        to: RECONCILED
        trigger: "POST /funds/withholding-records/{wrId}/reconcile"
        actor: TaxReviewer
        preconditions: []
        side_effects:
          - "penalty_cents computed per withholding_penalty from underpayment and months late"
      - from: PARTIALLY_REMITTED
        to: RECONCILED
        trigger: "POST /funds/withholding-records/{wrId}/reconcile"
        actor: TaxReviewer
        preconditions: []
        side_effects:
          - "penalty_cents computed per withholding_penalty"
      - from: REMITTED
        to: RECONCILED
        trigger: "POST /funds/withholding-records/{wrId}/reconcile"
        actor: TaxReviewer
        preconditions: []
        side_effects:
          - "penalty_cents computed per withholding_penalty (0 when fully remitted by due_date)"

  - entity: K1Package
    initial_state: "prep_status=GENERATED, delivery_status=PENDING"
    terminal_states: ["prep_status=SUPERSEDED", "delivery_status=ACKNOWLEDGED"]
    note: "Two independent parallel state dimensions on one entity. prep_status governs content approval; delivery_status governs transmission. deliver moves both dimensions in one transition; acknowledge/report-bounced/resend touch only delivery_status; amendment supersession touches only prep_status."
    transitions:
      - from: "prep GENERATED"
        to: "prep REVIEWED"
        trigger: "POST /funds/k1-packages/{k1Id}/submit-review"
        actor: TaxPreparer
        preconditions:
          - "The snapshot AllocationRun is LOCKED and not STALE (ERR_ALLOCATION_STALE)"
        side_effects:
          - "submitted_by_user_id = X-User-ID"
      - from: "prep REVIEWED"
        to: "prep APPROVED"
        trigger: "POST /funds/k1-packages/{k1Id}/approve"
        actor: TaxReviewer
        preconditions:
          - "X-User-ID != submitted_by_user_id (segregation of duties: ERR_SEGREGATION_OF_DUTIES)"
          - "The snapshot AllocationRun is LOCKED and not STALE (ERR_ALLOCATION_STALE)"
          - "TaxYear.status == APPROVED (ERR_INVALID_STATE_TRANSITION)"
        side_effects:
          - "approved_by_user_id = X-User-ID"
      - from: "prep APPROVED, delivery PENDING"
        to: "prep DELIVERED, delivery SENT"
        trigger: "POST /funds/k1-packages/{k1Id}/deliver"
        actor: InvestorServicesRep
        preconditions: []
        side_effects:
          - "delivered_at = current logical clock; delivery_method set from input"
          - "is_late recomputed per delivery_timeliness"
          - "Bubble-up: if every non-SUPERSEDED K1Package of the tax year is prep DELIVERED, TaxYear APPROVED -> COMPLETED"
      - from: "delivery SENT"
        to: "delivery ACKNOWLEDGED"
        trigger: "POST /funds/k1-packages/{k1Id}/acknowledge"
        actor: Investor
        preconditions:
          - "X-User-ID == partner_id of this K1Package (ERR_FORBIDDEN_FOR_ROLE)"
        side_effects: []
      - from: "delivery SENT"
        to: "delivery BOUNCED"
        trigger: "POST /funds/k1-packages/{k1Id}/report-bounced"
        actor: InvestorServicesRep
        preconditions: []
        side_effects: []
      - from: "delivery BOUNCED"
        to: "delivery SENT"
        trigger: "POST /funds/k1-packages/{k1Id}/resend"
        actor: InvestorServicesRep
        preconditions: []
        side_effects:
          - "delivered_at = current logical clock; is_late recomputed per delivery_timeliness"
      - from: "prep GENERATED | REVIEWED | APPROVED | DELIVERED"
        to: "prep SUPERSEDED"
        trigger: "system (automatic when a K1Amendment on this package is ISSUED)"
        actor: system
        preconditions: []
        side_effects:
          - "Replacement K1Package created with generation+1, supersedes_k1_id = this package, prep GENERATED, delivery PENDING, line_snapshot recomputed from the current LOCKED run"

  - entity: K1Amendment
    initial_state: OPENED
    terminal_states: [ISSUED]
    transitions:
      - from: OPENED
        to: IN_PREP
        trigger: "POST /funds/k1-amendments/{amendmentId}/start-prep"
        actor: TaxPreparer
        preconditions: []
        side_effects: []
      - from: IN_PREP
        to: IN_REVIEW
        trigger: "POST /funds/k1-amendments/{amendmentId}/submit-review"
        actor: TaxPreparer
        preconditions: []
        side_effects:
          - "prepared_by_user_id = X-User-ID"
      - from: IN_REVIEW
        to: IN_PREP
        trigger: "POST /funds/k1-amendments/{amendmentId}/return-to-prep"
        actor: TaxReviewer
        preconditions: []
        side_effects: []
        note: "Revision loop: an amendment may cycle IN_PREP <-> IN_REVIEW any number of times"
      - from: IN_REVIEW
        to: ISSUED
        trigger: "POST /funds/k1-amendments/{amendmentId}/issue"
        actor: TaxReviewer
        preconditions:
          - "X-User-ID != prepared_by_user_id (segregation of duties: ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "Cascade hop 1: the amended K1Package prep_status -> SUPERSEDED"
          - "Cascade hop 2 (caused by hop 1 supersession): replacement K1Package created (generation+1, supersedes_k1_id = amended package, prep GENERATED, delivery PENDING, line_snapshot recomputed from the current LOCKED run); new_k1_package_id set"
          - "Cascade hop 3 (caused by hop 2 replacement creation): an InvestorTicket (category AMENDED_K1_QUESTION, status OPEN, partner_id = package partner, tax_year_id = package tax year) is auto-created as investor communication"
          - "If TaxYear.status == COMPLETED it transitions back to APPROVED (the replacement is not yet delivered)"
          - "issued_by_user_id = X-User-ID"

  - entity: InvestorTicket
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: ANSWERED
        trigger: "POST /funds/tickets/{ticketId}/answer"
        actor: InvestorServicesRep | TaxPreparer
        preconditions: []
        side_effects:
          - "answer_text and answered_by_user_id set; is_escalated recomputed"
      - from: ANSWERED
        to: REOPENED
        trigger: "POST /funds/tickets/{ticketId}/reopen"
        actor: Investor | InvestorServicesRep
        preconditions:
          - "Investor actor: X-User-ID == partner_id of the ticket (ERR_FORBIDDEN_FOR_ROLE)"
        side_effects:
          - "is_escalated recomputed against the original due_at"
      - from: REOPENED
        to: ANSWERED
        trigger: "POST /funds/tickets/{ticketId}/answer"
        actor: InvestorServicesRep | TaxPreparer
        preconditions: []
        side_effects:
          - "answer_text and answered_by_user_id overwritten"
      - from: ANSWERED
        to: CLOSED
        trigger: "POST /funds/tickets/{ticketId}/close"
        actor: InvestorServicesRep
        preconditions: []
        side_effects: []

# =============================================================================
# Concurrency Rules (OCC on parent version — only true races)
# =============================================================================
concurrency_rules:
  - rule_id: allocation-run-create-stale-tax-year
    parent_entity: TaxYear
    write_endpoint: "POST /funds/allocation-runs"
    occ_field: "expected_tax_year_version"
    description: |
      Creating an AllocationRun against a TaxYear whose version has advanced
      since the client last observed it is rejected. Creating a run legitimately
      supersedes any existing COMPUTED/STALE run of that tax year, so a writer
      holding a stale tax-year view must not supersede state it never saw.
    error_id: ERR_STALE_TAX_YEAR_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table
# =============================================================================
calculations:
  - name: capital_account_and_tax_basis
    trigger: "CapitalAccountEvent creation, reversal, or OwnershipTransfer settle"
    algorithm: chronological
    input_set: "ALL CapitalAccountEvents of the partner (both POSTED originals and REVERSED originals and POSTED mirrors; nothing is ever removed from the stream), ordered by (effective_date ASC, sequence_no ASC)"
    formula: |
      class_sign(t) = +1 for CONTRIBUTION, TRANSFER_IN, ALLOCATION_SHARE, ADJUSTMENT
      class_sign(t) = -1 for DISTRIBUTION, TRANSFER_OUT
      BOOK_CAPITAL variant (capital_account_balance_cents):
        balance = sum over ordered events of class_sign * amount_cents   (no floor)
      TAX_BASIS variant (tax_basis_cents, excess_distribution_gain_cents):
        ADJUSTMENT events are BOOK-ONLY (704(b) revaluations): skipped entirely by TAX_BASIS
        replay in the same order over the remaining events with running basis b starting at 0:
          positive-class event: b += amount_cents
          negative-class event with amount <= b: b -= amount_cents
          negative-class event with amount > b: excess_distribution_gain += (amount - b); b = 0
        DISTRIBUTION is validated against BOOK capital (so it may exceed basis once a
        book-only ADJUSTMENT has driven capital above basis); CONTRIBUTION after flooring
        rebuilds from 0
    precision: "integer cents; no rounding"
    variants:
      - name: BOOK_CAPITAL
        when: "capital_account_balance_cents reads, withdraw precondition, transfer settle amounts"
        difference: "plain signed sum; may go negative only transiently (DISTRIBUTION beyond balance is rejected), no zero floor"
      - name: TAX_BASIS
        when: "tax_basis_cents and excess_distribution_gain_cents reads"
        difference: "floors at zero and spills the excess into excess_distribution_gain_cents, so identical event streams yield tax_basis_cents != capital_account_balance_cents whenever a DISTRIBUTION exceeds current basis"

  - name: management_fee_net_income
    trigger: "TaxYear creation (management_fee_cents and net_ordinary_income_cents are computed once, at create)"
    algorithm: constraint_propagation
    input_set: "Fund fee config + ACTIVE partners of the fund at creation time + gross_ordinary_income_cents"
    formula: |
      PINNED EVALUATION ORDER (the discount test depends on gross income, the fee
      reduces net income — evaluate strictly top-down, never iterate):
      1. fee_base = sum of capital_commitment_cents over partners with status ACTIVE
      2. gross_fee = round_half_up(fee_base * management_fee_rate_bps / 10000)
      3. discount applies IFF gross_ordinary_income_cents < fee_discount_threshold_cents
         (STRICTLY less; equal to threshold means NO discount)
      4. management_fee_cents = discount ? round_half_up(gross_fee * (10000 - fee_discount_bps) / 10000) : gross_fee
      5. net_ordinary_income_cents = gross_ordinary_income_cents - management_fee_cents
    precision: "integer cents, round_half_up at each stated rounding point"

  - name: ownership_proration
    trigger: "allocation_engine (weighted ownership per partner for the tax year)"
    algorithm: chronological
    input_set: "Partners with status ACTIVE plus partners WITHDRAWN after the year start; all SETTLED OwnershipTransfers of the fund whose effective_date falls inside the tax year"
    formula: |
      Year = [year-01-01, year-12-31]; DAYS = 365 (leap years are still normalized to 365).
      Each partner starts the year at ownership_pct_bps if admission_date <= year-01-01,
      else at 0 until admission_date, then ownership_pct_bps from admission_date (inclusive).
      Process SETTLED transfers in (effective_date ASC, OwnershipTransfer.created_at ASC) order:
        from effective_date (inclusive) onward: transferor -= pct_bps, transferee += pct_bps.
      weighted_days_bps[p] = sum over day-segments of pct_bps_in_segment * days_in_segment.
      ownership weight used downstream: w[p] = weighted_days_bps[p] / 365 (exact rational,
      NO intermediate rounding; only final per-partner money amounts are rounded).
      Boundary: effective_date == year-01-01 applies for the whole year;
      effective_date == year-12-31 applies for exactly 1 day.
    precision: "rational intermediate; final amounts round_half_up to integer cents"

  - name: allocation_engine
    trigger: "POST /funds/allocation-runs (computes and persists AllocationLines for the new run)"
    algorithm: waterfall_allocation
    input_set: "Partners with status == ACTIVE; TaxYear category totals (net ordinary, capital gain, interest); the tax year's APPROVED SpecialAllocations whose half-open window intersects the tax year (FINAL runs only); Fund waterfall config; ownership_proration weights; beginning capital per partner (book replay of events with effective_date <= year-01-01, non-ALLOCATION events only — this breaks the would-be circular dependency between preferred return and current-year allocation)"
    formula: |
      For each category C with total T_C (rounding: round_half_up to integer cents at
      every per-partner assignment; after rounding, distribute any residual cents to the
      partner with the largest unrounded share in that tier, tie-break admission_date ASC
      then Partner.created_at ASC — never id):
      ORDINARY and INTEREST:
        1. SPECIAL tier (FINAL only): each applicable APPROVED SpecialAllocation in
           SpecialAllocation.created_at ASC order assigns round(T_C * target_pct_bps/10000)
           to its partner; subtract from the remaining pool.
        2. PRO_RATA tier: remaining pool split by renormalized w[p] over non-special partners.
      CAPITAL_GAIN (waterfall; specials do not apply to CAPITAL_GAIN):
        1. PREFERRED tier: pref_need[p] = hurdle_rate_bps * beginning_capital[p] / 10000 for
           LIMITED partners; pref_pool = min(T_CG, sum(pref_need)); if pref_pool < sum(pref_need)
           each LIMITED partner is scaled pro-rata: pref[p] = round(pref_need[p] * pref_pool / sum(pref_need)).
        2. CATCHUP tier: catchup_cap = round_half_up(pref_pool * waterfall_catchup_bps / 10000);
           catchup_pool = min(T_CG - pref_pool, catchup_cap); 100% to GENERAL partners
           split by renormalized w over GENERAL partners.
        3. RESIDUAL tier: rem = T_CG - pref_pool - catchup_pool;
           LP pool = round_half_up(rem * (10000 - waterfall_carry_bps) / 10000) split over
           LIMITED by renormalized w; GP pool = rem - LP_pool, to GENERAL partners by
           renormalized w.
      CONSERVATION: for every category, sum of AllocationLine.amount_cents == T_C exactly
      (residual-cents assignment guarantees zero drift).
      PROVISIONAL variant category totals: T_C = round_half_up(stored_C * 365 / day_of_year(clock))
      where day_of_year is clamped to [1, 365]; stored_C is the TaxYear's net ordinary /
      capital gain / interest as persisted at compute time.
    precision: "integer cents, round_half_up, per-tier per-partner then largest-remainder reconciliation"
    variants:
      - name: PROVISIONAL
        when: "run_kind == PROVISIONAL; allowed while TaxYear.status in {OPEN, BOOKS_CLOSED}"
        difference: "annualizes category totals via 365/day_of_year projection and IGNORES all SpecialAllocations, so identical stored totals produce different lines than FINAL whenever day_of_year < 365"
      - name: FINAL
        when: "run_kind == FINAL; requires TaxYear.status in {BOOKS_CLOSED, ALLOCATED, UNDER_REVIEW, APPROVED} (OPEN or COMPLETED: ERR_TAX_YEAR_NOT_BOOKS_CLOSED)"
        difference: "uses stored totals as-is and applies APPROVED SpecialAllocations"

  - name: composite_tax
    trigger: "CompositeFiling creation and every file transition (recompute)"
    algorithm: aggregation
    input_set: "The tax year's LOCKED FINAL AllocationRun (not STALE); partners with status == ACTIVE"
    formula: |
      Per partner p, alloc_total[p] = sum of AllocationLine.amount_cents over all categories
      in the locked run.
      ELIGIBILITY (all must hold):
        partner_type NOT IN {FOREIGN_INDIVIDUAL, FOREIGN_ENTITY} (foreign partners are
          withheld federally, never composited — inclusion attempt via eligibility is
          silently excluded; an explicitly empty result errors at file time);
        residency_state != state_code (residents file individually);
        status == ACTIVE;
        state_source_income[p] >= min_income_cents (INCLUSIVE: exactly equal is included).
      ROUNDING ORDER IS PINNED (per-partner-then-sum; sum-then-round is the forbidden
      alternative and yields different cents):
        state_source_income[p] = round_half_up(alloc_total[p] * apportionment_pct_bps / 10000)
        partner_tax[p]         = round_half_up(state_source_income[p] * composite_rate_bps / 10000)
        total_state_source_income_cents = sum of state_source_income[p] over included partners
        total_composite_tax_cents       = sum of partner_tax[p] over included partners
      included_partner_ids sorted by Partner.created_at ASC.
    precision: "integer cents, round_half_up per partner before summing"

  - name: foreign_withholding
    trigger: "POST /funds/withholding-accruals; also fired per foreign partner as cascade hop 2 of k1-generation (quarter 4, method CURRENT_ACTUAL)"
    algorithm: threshold
    input_set: "Partners of the tax year's fund with is_foreign == true and status == ACTIVE; the tax year's LOCKED FINAL AllocationRun (CURRENT_ACTUAL); the partner's WithholdingRecords of tax year (year - 1) in any status (SAFE_HARBOR)"
    formula: |
      rate_bps = 3700 if partner_type == FOREIGN_INDIVIDUAL else 2100.
      CURRENT_ACTUAL:
        annual_ecti = sum of the partner's AllocationLine.amount_cents over all categories
          in the LOCKED FINAL run
        quarterly base: ECTI_q = floor(annual_ecti / 4) for q in {1,2,3};
          ECTI_4 = annual_ecti - 3 * floor(annual_ecti / 4)  (remainder lands in Q4)
        accrued_cents = round_half_up(ECTI_q * rate_bps / 10000)
      SAFE_HARBOR:
        prior_total = sum of accrued_cents over the partner's WithholdingRecords whose
          tax year is (year - 1); 0 when no such records exist
        annual_ecti_cents field stores prior_total for SAFE_HARBOR records
        accrued_cents = round_half_up(prior_total * SAFE_HARBOR_MULTIPLIER_BPS / 10000 / 4)
        (identical for all four quarters)
      One record per (partner_id, tax_year_id, quarter): a second accrual for an existing
      triple is rejected (ERR_DUPLICATE_WITHHOLDING_ACCRUAL); if the tax year has no
      foreign ACTIVE partners the bulk call errors (ERR_NO_FOREIGN_PARTNERS).
    constants:
      SAFE_HARBOR_MULTIPLIER_BPS: 11000
      RATE_INDIVIDUAL_BPS: 3700
      RATE_ENTITY_BPS: 2100
    precision: "integer cents, round_half_up"
    variants:
      - name: CURRENT_ACTUAL
        when: "method == CURRENT_ACTUAL"
        difference: "driven by this year's locked allocation; varies by quarter (Q4 holds the floor remainder)"
      - name: SAFE_HARBOR
        when: "method == SAFE_HARBOR"
        difference: "driven by prior-year withholding total x 110%, flat across quarters; diverges from CURRENT_ACTUAL whenever this year's allocation differs from 110% of last year's withholding"

  - name: withholding_penalty
    trigger: "POST /funds/withholding-records/{wrId}/reconcile"
    algorithm: threshold
    input_set: "The single WithholdingRecord; current logical clock date"
    formula: |
      underpayment = max(0, accrued_cents - remitted_cents)
      months_late = complete calendar months between due_date and current clock date:
        (cy - dy) * 12 + (cm - dm) - (1 if clock day < due day else 0), clamped to >= 0
        (remitted/reconciled ON the due date or before: months_late = 0)
      effective_months = min(months_late, PENALTY_CAP_MONTHS)
      penalty_cents = round_half_up(underpayment * PENALTY_MONTHLY_BPS * effective_months / 10000)
    constants:
      PENALTY_MONTHLY_BPS: 500
      PENALTY_CAP_MONTHS: 5
    precision: "integer cents, round_half_up"

  - name: delivery_timeliness
    trigger: "K1Package deliver and resend"
    algorithm: threshold
    input_set: "The K1Package's TaxYear (k1_delivery_deadline) and current logical clock"
    formula: |
      deadline = {year+1}-03-15T23:59:59Z, or {year+1}-09-15T23:59:59Z when
        TaxYear.federal_extension_filed is true
      is_late = (delivered_at > deadline)   — strictly greater; delivered exactly at the
      deadline timestamp is ON TIME.
    precision: "timestamp comparison, second precision"

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present; role is one of the declared RBAC roles"
    error_id: ERR_MISSING_AUTH_CONTEXT
    http_status: 400
    applies_to: "all"
  - priority: 2
    category: auth
    check: "Role is permitted for this endpoint; for entity_backed Investor, X-User-ID must equal the partner_id of the accessed resource (partner-scoped GETs, acknowledge, ticket create/reopen)"
    error_id: ERR_FORBIDDEN_FOR_ROLE
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: business_constraint
    check: "Request body well-formed: required fields present, enum values valid, integer ranges sane (pct_bps in 1..10000, quarter in 1..4, amount_cents != 0, effective_from < effective_to, settlement_date >= effective_date)"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all"
  - priority: 4
    category: existence
    check: "Path identifiers resolve to existing resources"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all resource endpoints"
  - priority: 5
    category: state
    check: "Target resource is in a state from which the requested transition is declared"
    error_id: ERR_INVALID_STATE_TRANSITION
    http_status: 409
    applies_to: "all action endpoints"
  - priority: 6
    category: business_safety
    check: "Segregation of duties: approver/issuer X-User-ID differs from proposer/preparer/submitter recorded on the resource (SpecialAllocation approve/reject, K1Package approve, K1Amendment issue)"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 409
    applies_to: "SpecialAllocation approve/reject, K1Package approve, K1Amendment issue"
  - priority: 7
    category: business_safety
    check: "Projected aggregate foreign ownership after transfer <= Fund.foreign_ownership_cap_pct_bps (inclusive bound: exactly at cap passes)"
    error_id: ERR_FOREIGN_OWNERSHIP_CAP_EXCEEDED
    http_status: 409
    applies_to: "OwnershipTransfer confirm"
  - priority: 8
    category: business_temporal
    check: "Tax-year windows: transfer confirm/effective_date or capital event effective_date inside a COMPLETED tax year rejected; transfer settle before settlement_date rejected; FINAL run compute/lock or composite file while OPEN/COMPLETED rejected; special-allocation approve after ALLOCATED rejected"
    error_id: "ERR_TAX_YEAR_WINDOW_CLOSED | ERR_TAX_YEAR_NOT_BOOKS_CLOSED"
    http_status: 409
    applies_to: "OwnershipTransfer confirm/settle, CapitalAccountEvent create, AllocationRun create/lock, SpecialAllocation approve, CompositeFiling file"
  - priority: 9
    category: business_temporal
    check: "Interval overlap: SpecialAllocation half-open [from,to) per (tax_year, partner, category); OwnershipTransfer closed [effective_date, settlement_date] per transferor (shared endpoint date = overlap)"
    error_id: "ERR_SPECIAL_ALLOCATION_OVERLAP | ERR_TRANSFER_WINDOW_OVERLAP"
    http_status: 409
    applies_to: "SpecialAllocation approve, OwnershipTransfer confirm"
  - priority: 10
    category: business_constraint
    check: "Uniqueness: (fund_id, year) for TaxYear; (tax_year_id, state_code) for CompositeFiling; (partner_id, tax_year_id, quarter) for WithholdingRecord; at most one active (non-ISSUED) K1Amendment per K1Package; at most one generation set of non-SUPERSEDED K1Packages per tax year; ein unique per Fund"
    error_id: "ERR_DUPLICATE_TAX_YEAR | ERR_DUPLICATE_COMPOSITE_FILING | ERR_DUPLICATE_WITHHOLDING_ACCRUAL | ERR_AMENDMENT_ALREADY_ACTIVE | ERR_K1_ALREADY_GENERATED | ERR_INVALID_REQUEST (ein)"
    http_status: 409
    applies_to: "create endpoints for the above"
  - priority: 11
    category: business_referential
    check: "Body references consistent: partner_id/tax_year_id belong to the same fund; transferor != transferee; mirror-event reversal targets exist and are not mirrors; CapitalAccountEvent effective_date inside the referenced tax year's calendar year"
    error_id: "ERR_CROSS_FUND_REFERENCE | ERR_SAME_PARTNER_TRANSFER | ERR_REVERSAL_OF_REVERSAL | ERR_INVALID_REQUEST (date outside year)"
    http_status: 422
    applies_to: "CapitalAccountEvent create/reverse, OwnershipTransfer create, CompositeFiling create, WithholdingRecord accruals, K1Amendment create, InvestorTicket create"
  - priority: 12
    category: business_fiscal
    check: "Ledger guards: DISTRIBUTION may not exceed current capital_account_balance_cents (equal is allowed, leaving exactly 0); remit may not exceed remaining accrued (equal completes); transfer pct may not exceed transferor current ownership (equal allowed)"
    error_id: "ERR_DISTRIBUTION_EXCEEDS_CAPITAL | ERR_REMIT_EXCEEDS_ACCRUED | ERR_INSUFFICIENT_OWNERSHIP"
    http_status: 422
    applies_to: "CapitalAccountEvent create, WithholdingRecord remit, OwnershipTransfer confirm"
  - priority: 13
    category: business_fiscal
    check: "Allocation prerequisites: LOCKED non-STALE FINAL run required for K1 generation/approve/file; run staleness blocks approval paths"
    error_id: "ERR_ALLOCATION_NOT_LOCKED | ERR_ALLOCATION_STALE"
    http_status: 409
    applies_to: "K1 generation, K1Package approve, TaxYear submit-review/approve, CompositeFiling file"
  - priority: 14
    category: business_fiscal
    check: "Aggregate bounds: sum of APPROVED special-allocation target_pct_bps per category <= 10000 at lock; sum of apportionment_pct_bps per tax year <= 10000 at filing create (equal to 10000 allowed)"
    error_id: "ERR_SPECIAL_ALLOCATION_OVERFLOW | ERR_APPORTIONMENT_OVERFLOW"
    http_status: 422
    applies_to: "AllocationRun lock, CompositeFiling create"
  - priority: 15
    category: business_fiscal
    check: "Non-empty input sets: allocation compute requires >= 1 ACTIVE partner; withholding accrual requires >= 1 foreign ACTIVE partner; composite file requires non-empty included_partner_ids; withdraw requires capital_account_balance_cents == 0"
    error_id: "ERR_NO_ALLOCABLE_PARTNERS | ERR_NO_FOREIGN_PARTNERS | ERR_COMPOSITE_PARTNER_INELIGIBLE | ERR_PARTNER_CAPITAL_NOT_ZERO"
    http_status: 422
    applies_to: "AllocationRun create, TaxYear close-books, withholding accruals, CompositeFiling file, Partner withdraw"

# =============================================================================
# Table 5: API Endpoint Table
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

endpoints:
  # --- Fund ---
  - { method: POST, path: "/funds", description: "Create a fund with waterfall and fee config", roles: [FundTaxAdmin], code: 201, input: [legal_name, ein, waterfall_hurdle_rate_bps, waterfall_catchup_bps, waterfall_carry_bps, foreign_ownership_cap_pct_bps, management_fee_rate_bps, fee_discount_threshold_cents, fee_discount_bps], output: Fund, side_effects: [] }
  - { method: GET, path: "/funds/{fundId}", description: "Get a fund", roles: [FundTaxAdmin, TaxPreparer, TaxReviewer, InvestorServicesRep, Investor], code: 200, input: [], output: Fund, side_effects: [] }

  # --- TaxYear ---
  - { method: POST, path: "/funds/tax-years", description: "Create a tax year; computes management_fee_cents and net_ordinary_income_cents", roles: [FundTaxAdmin], code: 201, input: [fund_id, year, gross_ordinary_income_cents, capital_gain_cents, interest_income_cents, "federal_extension_filed?"], output: TaxYear, side_effects: ["management_fee_net_income computed"] }
  - { method: GET, path: "/funds/tax-years/{taxYearId}", description: "Get a tax year", roles: [FundTaxAdmin, TaxPreparer, TaxReviewer, InvestorServicesRep, Investor], code: 200, input: [], output: TaxYear, side_effects: [] }
  - { method: GET, path: "/funds/tax-years", description: "List tax years", roles: [FundTaxAdmin, TaxPreparer, TaxReviewer, InvestorServicesRep], code: 200, input: ["fund_id?", "status?"], output: "TaxYear[]", side_effects: [] }
  - { method: POST, path: "/funds/tax-years/{taxYearId}/close-books", description: "OPEN -> BOOKS_CLOSED", roles: [FundTaxAdmin], code: 200, input: [], output: TaxYear, side_effects: ["increments TaxYear.version by 1"] }
  - { method: POST, path: "/funds/tax-years/{taxYearId}/submit-review", description: "ALLOCATED -> UNDER_REVIEW", roles: [TaxPreparer], code: 200, input: [], output: TaxYear, side_effects: ["increments TaxYear.version by 1"] }
  - { method: POST, path: "/funds/tax-years/{taxYearId}/approve", description: "UNDER_REVIEW -> APPROVED", roles: [TaxReviewer], code: 200, input: [], output: TaxYear, side_effects: ["increments TaxYear.version by 1"] }
  - { method: POST, path: "/funds/tax-years/{taxYearId}/reopen", description: "APPROVED -> BOOKS_CLOSED; cascades run LOCKED -> STALE and K1 REVIEWED/APPROVED -> GENERATED", roles: [FundTaxAdmin], code: 200, input: [], output: TaxYear, side_effects: ["AllocationRun LOCKED -> STALE", "K1Package prep REVIEWED/APPROVED -> GENERATED", "increments TaxYear.version by 1"] }

  # --- Partner ---
  - { method: POST, path: "/funds/partners", description: "Admit a partner", roles: [FundTaxAdmin], code: 201, input: [fund_id, legal_name, partner_type, partner_class, residency_state, ownership_pct_bps, capital_commitment_cents, admission_date], output: Partner, side_effects: ["status=ACTIVE; computed balances start at 0"] }
  - { method: GET, path: "/funds/partners/{partnerId}", description: "Get a partner (Investor only own id)", roles: [FundTaxAdmin, TaxPreparer, TaxReviewer, InvestorServicesRep, Investor], code: 200, input: [], output: Partner, side_effects: [] }
  - { method: GET, path: "/funds/partners", description: "List partners", roles: [FundTaxAdmin, TaxPreparer, TaxReviewer, InvestorServicesRep], code: 200, input: ["fund_id?", "status?", "partner_type?"], output: "Partner[]", side_effects: [] }
  - { method: POST, path: "/funds/partners/{partnerId}/withdraw", description: "ACTIVE -> WITHDRAWN; requires zero capital balance", roles: [FundTaxAdmin], code: 200, input: [], output: Partner, side_effects: ["increments Partner.version by 1"] }

  # --- CapitalAccountEvent ---
  - { method: POST, path: "/funds/capital-events", description: "Post a capital account event", roles: [TaxPreparer], code: 201, input: [partner_id, tax_year_id, event_type, amount_cents, effective_date, "memo?"], output: CapitalAccountEvent, side_effects: ["capital_account_and_tax_basis replay updates Partner balances", "increments Partner.version by 1"] }
  - { method: GET, path: "/funds/capital-events/{eventId}", description: "Get an event", roles: [FundTaxAdmin, TaxPreparer, TaxReviewer], code: 200, input: [], output: CapitalAccountEvent, side_effects: [] }
  - { method: GET, path: "/funds/capital-events", description: "List events (filtered)", roles: [FundTaxAdmin, TaxPreparer, TaxReviewer], code: 200, input: ["partner_id?", "tax_year_id?", "reverses_event_id?"], output: "CapitalAccountEvent[]", side_effects: [] }
  - { method: POST, path: "/funds/capital-events/{eventId}/reverse", description: "POSTED -> REVERSED; creates mirror event with negated amount", roles: [TaxPreparer], code: 201, input: ["memo?"], output: CapitalAccountEvent, side_effects: ["mirror event created (reverses_event_id set)", "Partner balances recomputed via replay", "increments original event version by 1 and Partner.version by 1"] }

  # --- OwnershipTransfer ---
  - { method: POST, path: "/funds/transfers", description: "Propose an ownership transfer", roles: [FundTaxAdmin], code: 201, input: [fund_id, transferor_partner_id, transferee_partner_id, pct_bps, effective_date, settlement_date], output: OwnershipTransfer, side_effects: ["status=PROPOSED"] }
  - { method: GET, path: "/funds/transfers/{transferId}", description: "Get a transfer", roles: [FundTaxAdmin, TaxPreparer, TaxReviewer], code: 200, input: [], output: OwnershipTransfer, side_effects: [] }
  - { method: GET, path: "/funds/transfers", description: "List transfers (filtered)", roles: [FundTaxAdmin, TaxPreparer, TaxReviewer], code: 200, input: ["fund_id?", "transferor_partner_id?", "transferee_partner_id?", "status?"], output: "OwnershipTransfer[]", side_effects: [] }
  - { method: POST, path: "/funds/transfers/{transferId}/confirm", description: "PROPOSED -> CONFIRMED with cap/window/overlap checks", roles: [FundTaxAdmin], code: 200, input: [], output: OwnershipTransfer, side_effects: [] }
  - { method: POST, path: "/funds/transfers/{transferId}/settle", description: "CONFIRMED -> SETTLED; cascade: transfer events -> balances -> runs STALE -> K1 revert", roles: [FundTaxAdmin], code: 200, input: [], output: OwnershipTransfer, side_effects: ["TRANSFER_OUT/TRANSFER_IN events created", "Partner balances and current ownership recomputed", "affected LOCKED AllocationRuns -> STALE", "K1Packages REVIEWED/APPROVED -> GENERATED", "increments both Partners' version by 1"] }
  - { method: POST, path: "/funds/transfers/{transferId}/cancel", description: "PROPOSED/CONFIRMED -> CANCELLED", roles: [FundTaxAdmin], code: 200, input: [], output: OwnershipTransfer, side_effects: [] }

  # --- AllocationRun / AllocationLine ---
  - { method: POST, path: "/funds/allocation-runs", description: "Compute a new allocation run (PROVISIONAL or FINAL); supersedes prior COMPUTED/STALE runs; OCC on TaxYear.version", roles: [TaxPreparer], code: 201, input: [tax_year_id, run_kind, expected_tax_year_version], output: AllocationRun, side_effects: ["allocation_engine computes and persists AllocationLines", "prior COMPUTED/STALE runs of the tax year -> SUPERSEDED", "increments TaxYear.version by 1"] }
  - { method: GET, path: "/funds/allocation-runs/{runId}", description: "Get a run", roles: [FundTaxAdmin, TaxPreparer, TaxReviewer], code: 200, input: [], output: AllocationRun, side_effects: [] }
  - { method: GET, path: "/funds/allocation-runs", description: "List runs (filtered)", roles: [FundTaxAdmin, TaxPreparer, TaxReviewer], code: 200, input: ["tax_year_id?", "status?"], output: "AllocationRun[]", side_effects: [] }
  - { method: POST, path: "/funds/allocation-runs/{runId}/lock", description: "COMPUTED FINAL run -> LOCKED; bubbles TaxYear BOOKS_CLOSED -> ALLOCATED", roles: [TaxReviewer], code: 200, input: [], output: AllocationRun, side_effects: ["TaxYear BOOKS_CLOSED -> ALLOCATED", "increments AllocationRun.version by 1 and TaxYear.version by 1"] }
  - { method: GET, path: "/funds/allocation-runs/{id}/lines", description: "List allocation lines of a run", roles: [FundTaxAdmin, TaxPreparer, TaxReviewer], code: 200, input: [], output: "AllocationLine[]", side_effects: [] }
  - { method: GET, path: "/funds/partners/{id}/allocation-lines", description: "List allocation lines of a partner across runs", roles: [FundTaxAdmin, TaxPreparer, TaxReviewer], code: 200, input: [], output: "AllocationLine[]", side_effects: [] }

  # --- SpecialAllocation ---
  - { method: POST, path: "/funds/special-allocations", description: "Propose a special allocation", roles: [TaxPreparer], code: 201, input: [tax_year_id, partner_id, category, target_pct_bps, effective_from, effective_to], output: SpecialAllocation, side_effects: ["status=PROPOSED; proposed_by_user_id recorded"] }
  - { method: GET, path: "/funds/special-allocations/{saId}", description: "Get a special allocation", roles: [FundTaxAdmin, TaxPreparer, TaxReviewer], code: 200, input: [], output: SpecialAllocation, side_effects: [] }
  - { method: GET, path: "/funds/special-allocations", description: "List special allocations (filtered)", roles: [FundTaxAdmin, TaxPreparer, TaxReviewer], code: 200, input: ["tax_year_id?", "partner_id?", "category?", "status?"], output: "SpecialAllocation[]", side_effects: [] }
  - { method: POST, path: "/funds/special-allocations/{saId}/approve", description: "PROPOSED -> APPROVED (SoD + half-open overlap check)", roles: [TaxReviewer], code: 200, input: [], output: SpecialAllocation, side_effects: ["reviewed_by_user_id recorded"] }
  - { method: POST, path: "/funds/special-allocations/{saId}/reject", description: "PROPOSED -> REJECTED (SoD)", roles: [TaxReviewer], code: 200, input: [], output: SpecialAllocation, side_effects: ["reviewed_by_user_id recorded"] }

  # --- CompositeFiling ---
  - { method: POST, path: "/funds/composite-filings", description: "Create a DRAFT composite filing for one state", roles: [TaxPreparer], code: 201, input: [tax_year_id, state_code, apportionment_pct_bps, composite_rate_bps, min_income_cents], output: CompositeFiling, side_effects: ["composite_tax computes included partners and totals when a LOCKED FINAL run exists, else totals remain 0 until file"] }
  - { method: GET, path: "/funds/composite-filings/{cfId}", description: "Get a composite filing", roles: [FundTaxAdmin, TaxPreparer, TaxReviewer], code: 200, input: [], output: CompositeFiling, side_effects: [] }
  - { method: GET, path: "/funds/composite-filings", description: "List composite filings (filtered)", roles: [FundTaxAdmin, TaxPreparer, TaxReviewer], code: 200, input: ["tax_year_id?", "state_code?", "status?"], output: "CompositeFiling[]", side_effects: [] }
  - { method: POST, path: "/funds/composite-filings/{cfId}/file", description: "DRAFT -> FILED; recomputes totals from the LOCKED run", roles: [TaxPreparer], code: 200, input: [], output: CompositeFiling, side_effects: ["composite_tax recompute", "filed_at set"] }
  - { method: POST, path: "/funds/composite-filings/{cfId}/record-outcome", description: "FILED -> ACCEPTED (outcome=ACCEPTED) or FILED -> DRAFT (outcome=REJECTED)", roles: [FundTaxAdmin], code: 200, input: [outcome], output: CompositeFiling, side_effects: ["filed_at reset to null on REJECTED"] }

  # --- WithholdingRecord ---
  - { method: POST, path: "/funds/withholding-accruals", description: "Bulk-accrue quarterly withholding for all foreign ACTIVE partners of a tax year", roles: [TaxPreparer], code: 201, input: [tax_year_id, quarter, method], output: "WithholdingRecord[]", side_effects: ["foreign_withholding computes accrued_cents per partner"] }
  - { method: GET, path: "/funds/withholding-records/{wrId}", description: "Get a withholding record", roles: [FundTaxAdmin, TaxPreparer, TaxReviewer], code: 200, input: [], output: WithholdingRecord, side_effects: [] }
  - { method: GET, path: "/funds/withholding-records", description: "List withholding records (filtered)", roles: [FundTaxAdmin, TaxPreparer, TaxReviewer], code: 200, input: ["partner_id?", "tax_year_id?", "quarter?", "status?"], output: "WithholdingRecord[]", side_effects: [] }
  - { method: POST, path: "/funds/withholding-records/{wrId}/remit", description: "Remit against accrued withholding; exact completion -> REMITTED", roles: [TaxPreparer], code: 200, input: [amount_cents], output: WithholdingRecord, side_effects: ["remitted_cents increased", "status transitions per remaining balance"] }
  - { method: POST, path: "/funds/withholding-records/{wrId}/reconcile", description: "Compute penalty and close the record -> RECONCILED", roles: [TaxReviewer], code: 200, input: [], output: WithholdingRecord, side_effects: ["withholding_penalty computes penalty_cents"] }

  # --- K1Package ---
  - { method: POST, path: "/funds/k1-generation", description: "Bulk-generate K1Packages (prep GENERATED, delivery PENDING) for all ACTIVE partners from the LOCKED FINAL run; requires TaxYear.status == APPROVED (ERR_INVALID_STATE_TRANSITION otherwise) and a LOCKED non-STALE FINAL run; packages are created and returned in Partner.created_at ASC order", roles: [TaxPreparer], code: 201, input: [tax_year_id], output: "K1Package[]", side_effects: ["cascade hop 1: K1Packages created with line_snapshot from the locked run (ordered Partner.created_at ASC)", "cascade hop 2a (caused by hop 1): for each foreign partner with a new K1, a Q4 CURRENT_ACTUAL WithholdingRecord is accrued", "cascade hop 2b (caused by hop 1): DRAFT CompositeFilings of the tax year recompute totals now that per-partner income is snapshotted"] }
  - { method: GET, path: "/funds/k1-packages/{k1Id}", description: "Get a K1 package (Investor only own)", roles: [FundTaxAdmin, TaxPreparer, TaxReviewer, InvestorServicesRep, Investor], code: 200, input: [], output: K1Package, side_effects: [] }
  - { method: GET, path: "/funds/k1-packages", description: "List K1 packages (filtered)", roles: [FundTaxAdmin, TaxPreparer, TaxReviewer, InvestorServicesRep], code: 200, input: ["partner_id?", "tax_year_id?", "supersedes_k1_id?", "run_id?", "prep_status?"], output: "K1Package[]", side_effects: [] }
  - { method: POST, path: "/funds/k1-packages/{k1Id}/submit-review", description: "prep GENERATED -> REVIEWED", roles: [TaxPreparer], code: 200, input: [], output: K1Package, side_effects: ["submitted_by_user_id recorded"] }
  - { method: POST, path: "/funds/k1-packages/{k1Id}/approve", description: "prep REVIEWED -> APPROVED (SoD vs submitter)", roles: [TaxReviewer], code: 200, input: [], output: K1Package, side_effects: ["approved_by_user_id recorded"] }
  - { method: POST, path: "/funds/k1-packages/{k1Id}/deliver", description: "prep APPROVED -> DELIVERED and delivery PENDING -> SENT; sets is_late", roles: [InvestorServicesRep], code: 200, input: [delivery_method], output: K1Package, side_effects: ["delivered_at set", "is_late recomputed", "bubble-up TaxYear APPROVED -> COMPLETED when all packages delivered"] }
  - { method: POST, path: "/funds/k1-packages/{k1Id}/acknowledge", description: "delivery SENT -> ACKNOWLEDGED (Investor self only)", roles: [Investor], code: 200, input: [], output: K1Package, side_effects: [] }
  - { method: POST, path: "/funds/k1-packages/{k1Id}/report-bounced", description: "delivery SENT -> BOUNCED", roles: [InvestorServicesRep], code: 200, input: ["reason?"], output: K1Package, side_effects: [] }
  - { method: POST, path: "/funds/k1-packages/{k1Id}/resend", description: "delivery BOUNCED -> SENT; refreshes delivered_at and is_late", roles: [InvestorServicesRep], code: 200, input: ["delivery_method?"], output: K1Package, side_effects: ["delivered_at refreshed", "is_late recomputed"] }

  # --- K1Amendment ---
  - { method: POST, path: "/funds/k1-amendments", description: "Open an amendment on a DELIVERED K1Package", roles: [TaxPreparer], code: 201, input: [k1_package_id, reason], output: K1Amendment, side_effects: ["status=OPENED; opened_by_user_id recorded"] }
  - { method: GET, path: "/funds/k1-packages/{id}/amendments", description: "List amendments of a K1 package", roles: [FundTaxAdmin, TaxPreparer, TaxReviewer], code: 200, input: [], output: "K1Amendment[]", side_effects: [] }
  - { method: POST, path: "/funds/k1-amendments/{amendmentId}/start-prep", description: "OPENED -> IN_PREP", roles: [TaxPreparer], code: 200, input: [], output: K1Amendment, side_effects: [] }
  - { method: POST, path: "/funds/k1-amendments/{amendmentId}/submit-review", description: "IN_PREP -> IN_REVIEW", roles: [TaxPreparer], code: 200, input: [], output: K1Amendment, side_effects: ["prepared_by_user_id recorded"] }
  - { method: POST, path: "/funds/k1-amendments/{amendmentId}/return-to-prep", description: "IN_REVIEW -> IN_PREP (revision loop)", roles: [TaxReviewer], code: 200, input: [], output: K1Amendment, side_effects: [] }
  - { method: POST, path: "/funds/k1-amendments/{amendmentId}/issue", description: "IN_REVIEW -> ISSUED (SoD); supersedes original, creates replacement K1 and investor ticket", roles: [TaxReviewer], code: 200, input: [], output: K1Amendment, side_effects: ["original K1Package prep -> SUPERSEDED", "replacement K1Package created (generation+1)", "InvestorTicket AMENDED_K1_QUESTION auto-created", "TaxYear COMPLETED -> APPROVED if applicable", "new_k1_package_id and issued_by_user_id recorded"] }

  # --- InvestorTicket ---
  - { method: POST, path: "/funds/tickets", description: "Open an investor tax question ticket", roles: [Investor, InvestorServicesRep], code: 201, input: [partner_id, "tax_year_id?", category, subject], output: InvestorTicket, side_effects: ["due_at computed from category SLA"] }
  - { method: GET, path: "/funds/tickets/{ticketId}", description: "Get a ticket (Investor only own partner's)", roles: [FundTaxAdmin, TaxPreparer, TaxReviewer, InvestorServicesRep, Investor], code: 200, input: [], output: InvestorTicket, side_effects: [] }
  - { method: GET, path: "/funds/tickets", description: "List tickets (filtered)", roles: [FundTaxAdmin, TaxPreparer, TaxReviewer, InvestorServicesRep], code: 200, input: ["partner_id?", "tax_year_id?", "status?", "category?"], output: "InvestorTicket[]", side_effects: [] }
  - { method: POST, path: "/funds/tickets/{ticketId}/answer", description: "OPEN/REOPENED -> ANSWERED", roles: [InvestorServicesRep, TaxPreparer], code: 200, input: [answer_text], output: InvestorTicket, side_effects: ["answer_text and answered_by_user_id set"] }
  - { method: POST, path: "/funds/tickets/{ticketId}/reopen", description: "ANSWERED -> REOPENED", roles: [Investor, InvestorServicesRep], code: 200, input: ["reason?"], output: InvestorTicket, side_effects: ["is_escalated recomputed"] }
  - { method: POST, path: "/funds/tickets/{ticketId}/close", description: "ANSWERED -> CLOSED", roles: [InvestorServicesRep], code: 200, input: [], output: InvestorTicket, side_effects: [] }

  # --- Test-driving clock ---
  - { method: POST, path: "/_clock/set_current_utc", description: "Set the server logical clock. Startup default (before any call) is exactly 2026-08-01T00:00:00Z and never falls back to wall-clock time. All server-stamped timestamps (created_at, updated_at, delivered_at, filed_at, computed_at) and all clock-derived computations (due_at, is_escalated, is_late, months_late, day_of_year) read this logical clock.", roles: [FundTaxAdmin], code: 200, input: [to_iso8601], output: "{ current_utc: string }", side_effects: ["recomputes clock-derived fields lazily on next read (is_escalated, is_late contexts)"] }

# =============================================================================
# Table 6: Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_AUTH_CONTEXT, http: 400, condition: "Missing/unknown X-User-ID or X-User-Role header" }
  - { id: ERR_FORBIDDEN_FOR_ROLE, http: 403, condition: "Role not allowed for endpoint, or Investor acting on another partner's resource" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, invalid enum, out-of-range integer, malformed date, effective_from >= effective_to, settlement_date < effective_date, duplicate ein" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path identifier does not resolve" }
  - { id: ERR_INVALID_STATE_TRANSITION, http: 409, condition: "Transition not declared from the resource's current state (incl. locking a PROVISIONAL run, withdrawing a partner with in-flight K1s, double reversal)" }
  - { id: ERR_STALE_TAX_YEAR_VERSION, http: 412, condition: "expected_tax_year_version does not match the TaxYear's current version on AllocationRun create" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 409, condition: "Approver/issuer X-User-ID equals the recorded proposer/preparer/submitter" }
  - { id: ERR_FOREIGN_OWNERSHIP_CAP_EXCEEDED, http: 409, condition: "Transfer would push aggregate foreign ownership strictly above the fund cap" }
  - { id: ERR_TAX_YEAR_WINDOW_CLOSED, http: 409, condition: "Effective date falls in a COMPLETED tax year; or settle attempted before settlement_date; or special-allocation approval after ALLOCATED" }
  - { id: ERR_TAX_YEAR_NOT_BOOKS_CLOSED, http: 409, condition: "FINAL run compute/lock or composite file attempted while TaxYear is OPEN or COMPLETED" }
  - { id: ERR_SPECIAL_ALLOCATION_OVERLAP, http: 409, condition: "Half-open [effective_from, effective_to) intersects an existing PROPOSED/APPROVED allocation for the same (tax year, partner, category)" }
  - { id: ERR_TRANSFER_WINDOW_OVERLAP, http: 409, condition: "Closed [effective_date, settlement_date] intersects another PROPOSED/CONFIRMED/SETTLED transfer of the same transferor; touching dates count as overlap" }
  - { id: ERR_DUPLICATE_TAX_YEAR, http: 409, condition: "A TaxYear with the same (fund_id, year) already exists" }
  - { id: ERR_DUPLICATE_COMPOSITE_FILING, http: 409, condition: "A CompositeFiling already exists for (tax_year_id, state_code)" }
  - { id: ERR_DUPLICATE_WITHHOLDING_ACCRUAL, http: 409, condition: "A WithholdingRecord already exists for (partner_id, tax_year_id, quarter)" }
  - { id: ERR_AMENDMENT_ALREADY_ACTIVE, http: 409, condition: "The K1Package already has an amendment in OPENED/IN_PREP/IN_REVIEW" }
  - { id: ERR_K1_ALREADY_GENERATED, http: 409, condition: "Non-SUPERSEDED K1Packages already exist for the tax year; also blocks reopen after any delivery" }
  - { id: ERR_CROSS_FUND_REFERENCE, http: 409, condition: "Referenced entities belong to different funds (partner vs tax year, transferor vs transferee)" }
  - { id: ERR_SAME_PARTNER_TRANSFER, http: 422, condition: "transferor_partner_id == transferee_partner_id" }
  - { id: ERR_REVERSAL_OF_REVERSAL, http: 422, condition: "Attempt to reverse a mirror event (reverses_event_id != null)" }
  - { id: ERR_DISTRIBUTION_EXCEEDS_CAPITAL, http: 422, condition: "DISTRIBUTION amount exceeds current capital_account_balance_cents (equal is allowed)" }
  - { id: ERR_REMIT_EXCEEDS_ACCRUED, http: 422, condition: "remitted_cents + amount_cents would exceed accrued_cents" }
  - { id: ERR_INSUFFICIENT_OWNERSHIP, http: 422, condition: "pct_bps exceeds transferor's current_ownership_pct_bps" }
  - { id: ERR_ALLOCATION_NOT_LOCKED, http: 409, condition: "No LOCKED FINAL AllocationRun exists for the tax year" }
  - { id: ERR_ALLOCATION_STALE, http: 409, condition: "The relevant AllocationRun is STALE (ownership changed or books reopened after lock)" }
  - { id: ERR_SPECIAL_ALLOCATION_OVERFLOW, http: 422, condition: "Sum of APPROVED target_pct_bps for one category would exceed 10000 at lock time" }
  - { id: ERR_APPORTIONMENT_OVERFLOW, http: 422, condition: "Sum of apportionment_pct_bps across the tax year's filings would exceed 10000 (equal allowed)" }
  - { id: ERR_NO_ALLOCABLE_PARTNERS, http: 422, condition: "Allocation compute or close-books with zero ACTIVE partners" }
  - { id: ERR_NO_FOREIGN_PARTNERS, http: 422, condition: "Withholding accrual requested but the tax year has no foreign ACTIVE partners" }
  - { id: ERR_COMPOSITE_PARTNER_INELIGIBLE, http: 422, condition: "Composite file attempted with an empty included_partner_ids (all partners resident/foreign/inactive/below minimum)" }
  - { id: ERR_PARTNER_CAPITAL_NOT_ZERO, http: 422, condition: "Withdraw attempted with capital_account_balance_cents != 0" }
  - { id: ERR_K1_NOT_DELIVERED, http: 409, condition: "Amendment opened on a K1Package whose prep_status != DELIVERED" }

# =============================================================================
# Table 7: RBAC Matrix
# =============================================================================
roles:
  - name: FundTaxAdmin
    description: "Fund tax administrator operations lead; owns fund/tax-year/partner configuration, transfers, filing outcomes, and the logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /funds"
      - "POST /funds/tax-years and close-books/reopen"
      - "POST /funds/partners and withdraw"
      - "OwnershipTransfer create/confirm/settle/cancel"
      - "POST /funds/composite-filings/{id}/record-outcome"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "All GET endpoints"
  - name: TaxPreparer
    description: "Prepares allocations, capital events, filings, K1s, amendments; never approves own work"
    identity: opaque
    exclusive_operations:
      - "POST /funds/capital-events and reverse"
      - "POST /funds/allocation-runs"
      - "POST /funds/special-allocations"
      - "CompositeFiling create/file"
      - "POST /funds/withholding-accruals and remit"
      - "POST /funds/k1-generation and k1 submit-review"
      - "K1Amendment create/start-prep/submit-review"
      - "POST /funds/tax-years/{id}/submit-review"
    shared_operations:
      - "All GET endpoints"
      - "POST /funds/tickets/{id}/answer"
  - name: TaxReviewer
    description: "Independent reviewer; approves tax years, locks runs, approves special allocations and K1s, issues amendments, reconciles withholding"
    identity: opaque
    exclusive_operations:
      - "POST /funds/tax-years/{id}/approve"
      - "POST /funds/allocation-runs/{id}/lock"
      - "SpecialAllocation approve/reject"
      - "POST /funds/k1-packages/{id}/approve"
      - "K1Amendment return-to-prep/issue"
      - "POST /funds/withholding-records/{id}/reconcile"
    shared_operations:
      - "All GET endpoints"
  - name: InvestorServicesRep
    description: "Investor-facing operations; delivers K1s, handles bounces/resends, manages tickets"
    identity: opaque
    exclusive_operations:
      - "K1Package deliver/report-bounced/resend"
      - "POST /funds/tickets/{id}/close"
    shared_operations:
      - "All GET endpoints"
      - "POST /funds/tickets and answer/reopen"
  - name: Investor
    description: "An individual partner; reads own data, acknowledges K1 delivery, opens/reopens tickets for own account"
    identity: "entity_backed:Partner"
    exclusive_operations:
      - "POST /funds/k1-packages/{id}/acknowledge"
    shared_operations:
      - "GET of own partner record, own K1 packages, own tickets (X-User-ID must equal partner_id)"
      - "POST /funds/tickets (partner_id must equal X-User-ID)"
      - "POST /funds/tickets/{id}/reopen (own tickets)"
