          - state_machines.Season.IN_SEASON_to_CLEARANCE
          - state_machines.Allocation.ACCEPTED_to_RELEASED
        distinguishing_aspect: |
          Mode (c) — circular-looking dependency with a pinned evaluation order:
          consumption rates decide which allocations release units, but the
          redistribution then mutates allocated_units (hence the rates' own
          denominator). Rates are computed once on the pre-release snapshot:
          A(10/40=2500bp) releases 30; survivors C(priority 30) and B(priority 20)
          absorb min(floor(30*40%), remaining)=12 each in that order, leaving 6
          in the lot — re-deriving rates mid-run would give different numbers.
