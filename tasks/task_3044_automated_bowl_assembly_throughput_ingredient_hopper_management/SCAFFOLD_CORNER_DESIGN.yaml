  # ==========================================================================
  # Section: cross_cutting_layers
  # ==========================================================================
  - section: cross_cutting_layers
    instances:
      - name: occ_stale_recipe_version_on_order_create
        claim_type: occ_stale_version
        grounds: ["concurrency_rules[order-create-stale-recipe]", "errors[ERR_STALE_RECIPE_VERSION]"]
        distinguishing_aspect: "Client reads recipe version v, an eighty-six/restore round-trip bumps it twice, and a subsequent order create carrying the stale expected_recipe_version is rejected with 412; retrying with the fresh version succeeds."
        test_recipe:
          setup: ["Restaurant R1; line LA with loaded hopper; ingredient ING; recipe RC (rc_v captured); ING eighty-sixed then restored (RC.version advanced twice)"]
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: OpsAdmin
            - call: "POST /api/restaurants"
              payload: { name: "R1", city: "LA" }
