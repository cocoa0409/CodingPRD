            - { call: "POST /facility-audits/${au}/submit-report", payload: { lots: [ { lot_code: "L1", input_qty: 200, recovered_qty: 190 } ] }, as: Auditor, as_user_id: "aud-1" }
            - { call: "POST /facility-audits/${au}/decide", payload: { decision: "PASSED" }, as: VerifierAdmin }
          trigger:
            - { call: "POST /products/${p1}/decide", payload: { decision: "VERIFIED" }, as: VerifierAdmin, captures: { pst: $.data.enrollment_status } }
            - { call: "GET /licenses?product_id=${p1}", as: VerifierAdmin, captures: { code: "$.data[0].license_code", vf: "$.data[0].valid_from", vu: "$.data[0].valid_until", lst: "$.data[0].status" } }
            - { call: "GET /brands/${b1}", as: VerifierAdmin, captures: { cnt: $.data.verified_product_count } }
          assert:
            - "decide response: enrollment_status == VERIFIED"
            - "GET /licenses?product_id returns exactly one license: status ACTIVE, license_code == LIC-000001, valid_from == 2026-08-01T00:00:00Z, valid_until == 2027-08-01T00:00:00Z"
            - "brand.verified_product_count == 1"

      - name: list_pagination_envelope_and_defaults
        claim_type: listing
        grounds: ["response_envelope"]
        distinguishing_aspect: "List envelope honors limit/offset with total_count and has_more; omitted params default to limit 10, offset 0."
        test_recipe:
          setup: ["brand with 3 products"]
          setup_api_calls:
            - { call: "POST /claim-standards", payload: { claim_code: "NGMO", name: "Non-GMO", ingredient_threshold_pct: 0.9, exemption_max_weight_pct: 0.5 }, as: VerifierAdmin, captures: { std: $.data.id } }
            - { call: "POST /brands", payload: { name: "B1", contact_email: "b1@x.com" }, as: VerifierAdmin, captures: { b1: $.data.id } }
            - { call: "POST /products", payload: { brand_id: "${b1}", standard_id: "${std}", name: "P1", gtin: "G-1", annual_volume_units: 100 }, as: BrandRep, as_user_id: "${b1}" }
            - { call: "POST /products", payload: { brand_id: "${b1}", standard_id: "${std}", name: "P2", gtin: "G-2", annual_volume_units: 100 }, as: BrandRep, as_user_id: "${b1}" }
            - { call: "POST /products", payload: { brand_id: "${b1}", standard_id: "${std}", name: "P3", gtin: "G-3", annual_volume_units: 100 }, as: BrandRep, as_user_id: "${b1}" }
          trigger:
            - { call: "GET /products?brand_id=${b1}&limit=2&offset=0", as: VerifierAdmin }
            - { call: "GET /products?brand_id=${b1}&limit=2&offset=2", as: VerifierAdmin }
            - { call: "GET /products?brand_id=${b1}", as: VerifierAdmin }
          assert:
            - "page 1: response_type == array, len(data) == 2, total_count == 3, has_more == true"
            - "page 2 (offset 2): len(data) == 1, total_count == 3, has_more == false"
            - "default request: limit defaults to 10, len(data) == 3, has_more == false"
            - "every response carries meta.api_request_id and meta.api_request_timestamp"

      - name: error_envelope_shape_on_failure
        claim_type: standard_crud
        grounds: ["response_envelope"]
        distinguishing_aspect: "Error responses use the fixed envelope: response_type == error and data.error_id/data.message populated."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /products/00000000-0000-0000-0000-000000000000", as: VerifierAdmin, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_NOT_FOUND, response_type == error, and data.message is a non-empty string"

  # ===========================================================================
  - section: rbac
    instances:
      - name: brandrep_cannot_decide_product
        claim_type: rbac_exclusive_denied
        grounds: ["roles.VerifierAdmin", "endpoints.\"POST /products/{id}/decide\""]
        distinguishing_aspect: "decide is VerifierAdmin-exclusive; a BrandRep (even the owning brand) gets 403 ERR_FORBIDDEN_ROLE before any state evaluation."
        test_recipe:
          setup: ["product UNDER_EVALUATION (NON_CROP ingredient only)"]
          setup_api_calls:
            - { call: "POST /claim-standards", payload: { claim_code: "NGMO", name: "Non-GMO", ingredient_threshold_pct: 0.9, exemption_max_weight_pct: 0.5 }, as: VerifierAdmin, captures: { std: $.data.id } }
            - { call: "POST /brands", payload: { name: "B1", contact_email: "b1@x.com" }, as: VerifierAdmin, captures: { b1: $.data.id } }
            - { call: "POST /products", payload: { brand_id: "${b1}", standard_id: "${std}", name: "P1", gtin: "G-P1", annual_volume_units: 100 }, as: BrandRep, as_user_id: "${b1}", captures: { p1: $.data.id } }
            - { call: "POST /ingredients", payload: { product_id: "${p1}", name: "Salt", crop_type: "NON_CROP", declared_weight_pct: 100.00 }, as: BrandRep, as_user_id: "${b1}" }
            - { call: "POST /products/${p1}/submit", as: BrandRep, as_user_id: "${b1}" }
            - { call: "POST /products/${p1}/begin-evaluation", as: VerifierAdmin }
          trigger:
            - { call: "POST /products/${p1}/decide", payload: { decision: "VERIFIED" }, as: BrandRep, as_user_id: "${b1}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_FORBIDDEN_ROLE and http status == 403"

      - name: brandrep_cannot_touch_other_brand_product
        claim_type: rbac_exclusive_denied
        grounds: ["roles.BrandRep", "validations[priority=4]", "errors[ERR_NOT_BRAND_RESOURCE]"]
        distinguishing_aspect: "Ownership check: BrandRep of brand B2 acting on a B1 product gets 403 ERR_NOT_BRAND_RESOURCE (entity_backed identity compared to product.brand_id)."
        test_recipe:
          setup: ["brand B1 with DRAFT product P1 (NON_CROP ingredient); brand B2 exists"]
          setup_api_calls:
            - { call: "POST /claim-standards", payload: { claim_code: "NGMO", name: "Non-GMO", ingredient_threshold_pct: 0.9, exemption_max_weight_pct: 0.5 }, as: VerifierAdmin, captures: { std: $.data.id } }
            - { call: "POST /brands", payload: { name: "B1", contact_email: "b1@x.com" }, as: VerifierAdmin, captures: { b1: $.data.id } }
            - { call: "POST /brands", payload: { name: "B2", contact_email: "b2@x.com" }, as: VerifierAdmin, captures: { b2: $.data.id } }
            - { call: "POST /products", payload: { brand_id: "${b1}", standard_id: "${std}", name: "P1", gtin: "G-P1", annual_volume_units: 100 }, as: BrandRep, as_user_id: "${b1}", captures: { p1: $.data.id } }
            - { call: "POST /ingredients", payload: { product_id: "${p1}", name: "Salt", crop_type: "NON_CROP", declared_weight_pct: 100.00 }, as: BrandRep, as_user_id: "${b1}" }
          trigger:
            - { call: "POST /products/${p1}/submit", as: BrandRep, as_user_id: "${b2}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_NOT_BRAND_RESOURCE and http status == 403"

      - name: labanalyst_cannot_create_sampling_plan
        claim_type: rbac_exclusive_denied
        grounds: ["roles.VerifierAdmin", "endpoints.\"POST /sampling-plans\""]
        distinguishing_aspect: "Plan creation is VerifierAdmin-exclusive; LabAnalyst gets 403 ERR_FORBIDDEN_ROLE even with a correct expected_product_version."
        test_recipe:
          setup: ["product UNDER_EVALUATION with current version captured"]
          setup_api_calls:
            - { call: "POST /claim-standards", payload: { claim_code: "NGMO", name: "Non-GMO", ingredient_threshold_pct: 0.9, exemption_max_weight_pct: 0.5 }, as: VerifierAdmin, captures: { std: $.data.id } }
            - { call: "POST /brands", payload: { name: "B1", contact_email: "b1@x.com" }, as: VerifierAdmin, captures: { b1: $.data.id } }
