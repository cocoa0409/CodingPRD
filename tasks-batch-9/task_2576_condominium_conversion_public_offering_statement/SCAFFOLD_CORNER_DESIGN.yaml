      - name: dual_variant_layer_delta_on_the_suitability_switch
        claim_type: dual_variant_calculation
        grounds:
          - complexity_profile.complexity_layers
          - calculations.building_suitability_score.variants.AS_INSPECTED
          - calculations.building_suitability_score.variants.POST_REMEDIATION
        excluded_because:
          difficulty_instance: suitability_score_as_inspected_vs_post_remediation
          rationale: "The §1.8 instance is exactly this layer's claim - both variants over one identical
            component set, with the pre-computed delta and the cap escaping on the remediated RUL - so a
            second layer-level recipe would re-assert the same mechanism."
      - name: cascading_layer_material_amendment_chain_across_four_entities
        claim_type: cascading_side_effects
        grounds:
          - complexity_profile.complexity_layers
          - endpoints[POST /public-offering-statements/{id}/amendments]
          - entities.PublicOfferingStatement.fields.amendment_count
        excluded_because:
          difficulty_instance: material_pos_amendment_cascade_pos_agreement_unit_project
          rationale: "The §1.8 instance already walks the material-amendment chain end to end from the
            statement through every SIGNED agreement and unit back to the project, including the
            rescission-window restart, which is the ordering-sensitive N-level claim for this layer; the
            §1.9 cascading recipe here covers the disjoint engineering-rejection chain instead."
      - name: rate_threshold_layer_presale_boundary_at_exact_equality
        claim_type: rate_threshold_triggers
        grounds:
          - complexity_profile.complexity_layers
          - calculations.presale_threshold_evaluation
          - entities.ClosingBatch.fields.min_presale_threshold_pct
        excluded_because:
          difficulty_instance: presale_pct_inclusive_at_exact_threshold_equality
          rationale: "The §1.8 instance pins the presale threshold at exact equality on both the
            percentage and the absolute-count clause, which is this layer's boundary claim; the §1.9
            rate-threshold recipe above takes the disjoint reserve-adequacy boundary instead."
