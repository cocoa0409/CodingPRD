          assert:
            - "The sweep at 2026-08-17T10:00:00Z returns deadline_breach_flagged_count == 0 (${breaches_at_deadline}) and election_auto_defaulted_count == 1 (${defaults_at_deadline})"
            - "That same sweep returns open_violation_count == 0"
            - "RefundObligation.${ob_id}.deadline_breached == false, election_status == ELECTED_CASH, election_source == AUTO_DEFAULT, settlement_method == ORIGINAL_PAYMENT"
            - "The sweep at 2026-08-17T10:00:01Z returns deadline_breach_flagged_count == 1 (${breaches_after}) and election_auto_defaulted_count == 0 (${defaults_after}) — the election is no longer PENDING_ELECTION"
            - "That second sweep returns open_violation_count == 1 and RefundObligation.${ob_id}.deadline_breached == true"
            - "RefundObligation.${ob_id}.settlement_status == UNSETTLED throughout — breach flagging never settles anything"

      - name: priority_ordering_settled_state_versus_segregation_of_duties
        claim_type: priority_ordering
        excluded_because:
          difficulty_instance: settled_obligation_state_beats_segregation_of_duties
          rationale: "The §1.8 instance already violates the priority-40 settlement-state guard and the priority-50 segregation-of-duties rule in one request and asserts the priority-40 error, which is exactly this claim."

      - name: priority_ordering_tarmac_window_versus_interval_overlap
        claim_type: priority_ordering
        excluded_because:
          difficulty_instance: tarmac_window_temporal_beats_interval_overlap_constraint
          rationale: "The §1.8 instance sends one create that violates both the priority-55 tarmac window rule and the priority-65 interval-overlap rule and asserts ERR_TARMAC_WINDOW_INVALID, covering both that error and this ordering claim."

      - name: priority_ordering_referential_versus_fiscal
        claim_type: priority_ordering
        excluded_because:
          difficulty_instance: segment_booking_mismatch_referential_beats_headroom_fiscal
          rationale: "The §1.8 instance violates priority 75 (segment belongs to another booking) and priority 80/81 (no headroom) in the same obligation create and asserts ERR_SEGMENT_BOOKING_MISMATCH, which is this claim plus that error's only trigger."

      - name: cross_entity_validation_rescinded_disruption_blocks_settlement
        claim_type: cross_entity_validation
        excluded_because:
          difficulty_instance: settlement_blocked_after_source_delay_restored
          rationale: "Priority 45 depends on the state of a different entity (the source FlightSegment), and the §1.8 instance restores the segment to SCHEDULED and then shows initiate-settlement failing with ERR_SOURCE_DISRUPTION_RESCINDED while the same call succeeded before the restore."

      - name: cross_entity_validation_open_complaint_blocks_report_submit
        claim_type: cross_entity_validation
        excluded_because:
          difficulty_instance: report_submit_blocked_by_open_complaint_in_period
          rationale: "The §1.8 instance covers both sides of the cross-entity check: submit fails with ERR_OPEN_COMPLAINT_IN_PERIOD while a complaint in the window is unanswered, and succeeds once it is answered."

      - name: cross_entity_validation_segment_state_blocks_tarmac_report
        claim_type: cross_entity_validation
        excluded_because:
          difficulty_instance: tarmac_report_blocked_while_segment_still_scheduled
          rationale: "The §1.8 instance files the report while the parent segment is still SCHEDULED, asserts the priority-47 error, then records the operation and files successfully — the with/without pair for this rule."

      - name: temporal_validation_tarmac_interval_overlap
        claim_type: temporal_validation
        excluded_because:
          difficulty_instance: tarmac_intervals_touch_allowed_overlap_rejected
          rationale: "The §1.8 instance exercises the half-open interval geometry directly: a new event starting exactly at the previous event's interval_end_utc is accepted, one starting a minute earlier is rejected with ERR_TARMAC_INTERVAL_OVERLAP."

      - name: temporal_validation_report_period_overlap
        claim_type: temporal_validation
        excluded_because:
          difficulty_instance: report_periods_closed_inclusive_boundary_collision
          rationale: "The §1.8 instance contrasts the closed-inclusive reporting window with the half-open tarmac window by rejecting two periods that share only their boundary instant with ERR_REPORT_PERIOD_OVERLAP."

  - section: endpoints
    instances:
      - name: activities_log_returns_whole_lifecycle_in_chronological_order
        claim_type: computed_read
        grounds: ["endpoints[GET /compliance/consumer-complaints/{id}/activities]", "entities.ComplaintActivity", "state_machines.ConsumerComplaint"]
        distinguishing_aspect: "Every complaint transition appends exactly one immutable ComplaintActivity row, so the log after receive / acknowledge / request-info / answer has total_count 4 in occurred_at_utc ASC order, and the activity_type filter narrows it to 1 without renumbering total_count."
        test_recipe:
          setup:
            - "One complaint walked through RECEIVED (2026-08-05T09:00:00Z), ACKNOWLEDGED (2026-08-06T10:00:00Z), INFO_REQUESTED (2026-08-07T11:00:00Z) and ANSWERED (2026-08-08T12:00:00Z)."
          setup_api_calls:
            - call: "POST /compliance/policy-profiles"
              payload: { carrier_code: "ZQ" }
              as: ComplianceAdmin
              as_user_id: "admin_1"
              captures: { pol_id: "$.data.id" }
            - call: "POST /compliance/passengers"
              payload: { email: "pat@example.com", full_name: "Pat Rivera" }
              as: ComplianceOfficer
              as_user_id: "officer_1"
              captures: { pax_id: "$.data.id" }
            - call: "POST /compliance/bookings"
              payload: { passenger_id: "${pax_id}", policy_profile_id: "${pol_id}", record_locator: "ABC123", total_fare_cents: 50000, payment_method: "CREDIT_CARD" }
              as: ComplianceOfficer
              as_user_id: "officer_1"
              captures: { bk_id: "$.data.id" }
            - call: "POST /compliance/consumer-complaints"
              payload: { booking_id: "${bk_id}", category: "REFUND", channel: "EMAIL", received_at_utc: "2026-08-05T09:00:00Z", summary: "Refund never arrived." }
              as: ComplianceOfficer
              as_user_id: "officer_1"
              captures: { cmp_id: "$.data.id" }
            - call: "POST /compliance/consumer-complaints/${cmp_id}/acknowledge"
              payload: { acknowledged_at_utc: "2026-08-06T10:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "officer_1"
            - call: "POST /compliance/consumer-complaints/${cmp_id}/request-info"
              payload: { info_request_note: "Please send the card statement.", requested_at_utc: "2026-08-07T11:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "officer_1"
            - call: "POST /compliance/consumer-complaints/${cmp_id}/answer"
              payload: { disposition: "POLICY_EXPLAINED", answered_at_utc: "2026-08-08T12:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "officer_1"
          trigger:
            - call: "GET /compliance/consumer-complaints/${cmp_id}/activities"
              payload: {}
              as: RegulatorAuditor
              as_user_id: "auditor_1"
              captures: { act_first: "$.data.data[0].activity_type", act_last: "$.data.data[3].activity_type" }
            - call: "GET /compliance/consumer-complaints/${cmp_id}/activities"
              payload: { activity_type: "INFO_REQUESTED" }
              as: RegulatorAuditor
              as_user_id: "auditor_1"
              captures: { filtered_first: "$.data.data[0].occurred_at_utc" }
          assert:
            - "The unfiltered read returns total_count == 4 and has_more == false"
            - "data[0].activity_type == RECEIVED (${act_first}) with occurred_at_utc == 2026-08-05T09:00:00Z"
            - "data[1].activity_type == ACKNOWLEDGED, data[2].activity_type == INFO_REQUESTED, data[3].activity_type == ANSWERED (${act_last})"
            - "The filtered read returns total_count == 1 and data[0].occurred_at_utc == 2026-08-07T11:00:00Z (${filtered_first})"
            - "ComplaintActivity rows carry no version field and no update endpoint exists for them"
            - "ConsumerComplaint.${cmp_id}.status == ANSWERED and ConsumerComplaint.${cmp_id}.info_requested_count == 1"

      - name: request_info_increments_counter_without_extending_answer_due
        claim_type: action_endpoint
        grounds: ["endpoints[POST /compliance/consumer-complaints/{id}/request-info]", "state_machines.ConsumerComplaint.transitions.ACKNOWLEDGED_to_INFO_REQUESTED", "calculations.complaint_deadline_resolution"]
        distinguishing_aspect: "Requesting information moves the complaint to INFO_REQUESTED and increments info_requested_count, but answer_due_utc keeps its create-time value 2026-10-04T09:00:00Z — only reopen re-derives the answer deadline, so the carrier cannot buy time by asking questions."
        test_recipe:
          setup: ["One ACKNOWLEDGED complaint received 2026-08-05T09:00:00Z with answer_due_utc 2026-10-04T09:00:00Z."]
          setup_api_calls:
