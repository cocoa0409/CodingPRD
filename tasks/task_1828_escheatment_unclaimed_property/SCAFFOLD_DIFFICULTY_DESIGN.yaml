          setup_api_calls:
            - { call: "POST /escheatment/dormancy-rules", payload: { state_code: "CA", property_type: "SAVINGS", dormancy_years: 3, effective_from: "2020-01-01" }, as: HolderAdmin, as_user_id: "ha-1" }
            - { call: "POST /escheatment/owners", payload: { full_name: "Gate Three", last_known_address: "19 Vine St, Madera, CA", state_code: "CA" }, as: ComplianceOfficer, as_user_id: "co-1", captures: { own1: $.data.id } }
            - { call: "POST /escheatment/properties", payload: { owner_id: "${own1}", property_type: "SAVINGS", state_code: "CA", original_value_cents: 100000, last_contact_date: "2023-03-15" }, as: ComplianceOfficer, as_user_id: "co-1", captures: { p1: $.data.id } }
            - { call: "POST /escheatment/_sweeps/dormancy", as: HolderAdmin, as_user_id: "ha-1" }
            - { call: "POST /escheatment/properties/${p1}/due-diligence-letters", as: ComplianceOfficer, as_user_id: "co-1" }
            - { call: "POST /escheatment/_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: HolderAdmin, as_user_id: "ha-1" }
            - { call: "POST /escheatment/_sweeps/dormancy", as: HolderAdmin, as_user_id: "ha-1" }
            - { call: "POST /escheatment/holder-reports", payload: { state_code: "CA", report_year: 2026 }, as: ComplianceOfficer, as_user_id: "co-1", captures: { r1: $.data.id, r1_v1: $.data.version } }
            - { call: "POST /escheatment/holder-reports/${r1}/line-items", payload: { property_id: "${p1}", expected_report_version: "${r1_v1}" }, as: ComplianceOfficer, as_user_id: "co-1" }
            - { call: "POST /escheatment/holder-reports/${r1}/submit", as: ComplianceOfficer, as_user_id: "co-1" }
            - { call: "POST /escheatment/holder-reports/${r1}/accept", as: StateAuditor, as_user_id: "sa-1" }
          trigger:
            - { call: "POST /escheatment/owner-claims", payload: { property_id: "${p1}" }, as: Claimant, as_user_id: "${own1}", captures: { err_id: $.data.error_id } }
          assert:
            - "error_id == ERR_PROPERTY_NOT_CLAIMABLE (422): REPORTED is insufficient; REMITTED or ESCHEATED is required"

  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: dormancy_rule_half_open_adjacency_vs_overlap
        grounds:
          - entities.DormancyRule.fields.effective_from
          - entities.DormancyRule.fields.effective_to
          - errors[ERR_DORMANCY_RULE_OVERLAP]
        distinguishing_aspect: |
          Interval semantics: HALF-OPEN [from, to). A new rule starting exactly at
          the existing rule's effective_to is adjacency, not overlap (allowed);
          starting one day earlier overlaps (rejected).
        test_recipe:
          setup:
            - "Existing rule R1 for (CA, CHECKING) with window [2020-01-01, 2023-01-01)."
          setup_api_calls:
            - { call: "POST /escheatment/dormancy-rules", payload: { state_code: "CA", property_type: "CHECKING", dormancy_years: 3, effective_from: "2020-01-01", effective_to: "2023-01-01" }, as: HolderAdmin, as_user_id: "ha-1", captures: { r1: $.data.id } }
          trigger:
            - { call: "POST /escheatment/dormancy-rules", payload: { state_code: "CA", property_type: "CHECKING", dormancy_years: 5, effective_from: "2023-01-01" }, as: HolderAdmin, as_user_id: "ha-1", captures: { r2: $.data.id } }
            - { call: "POST /escheatment/dormancy-rules", payload: { state_code: "CA", property_type: "CHECKING", dormancy_years: 4, effective_from: "2022-12-31" }, as: HolderAdmin, as_user_id: "ha-1", captures: { err3: $.data.error_id } }
            - { call: "POST /escheatment/dormancy-rules", payload: { state_code: "CA", property_type: "SAVINGS", dormancy_years: 4, effective_from: "2022-12-31" }, as: HolderAdmin, as_user_id: "ha-1", captures: { r4: $.data.id } }
          assert:
            - "R2 (from == R1.effective_to): 201 — half-open adjacency permitted"
            - "R3 (from 2022-12-31 inside [2020-01-01, 2023-01-01)): ERR_DORMANCY_RULE_OVERLAP (409)"
            - "R4 (same window as R3 but different property_type): 201 — overlap is scoped to (state_code, property_type)"

      - name: audit_lookback_closed_interval_adjacency_is_overlap
        grounds:
          - entities.AuditCase.fields.lookback_start_year
          - entities.AuditCase.fields.lookback_end_year
          - errors[ERR_AUDIT_LOOKBACK_OVERLAP]
        distinguishing_aspect: |
          Interval semantics: CLOSED [start_year, end_year] — the opposite
          treatment from the dormancy-rule instance on a different resource
          (AuditCase vs DormancyRule): touching at a shared endpoint year counts
          as overlap. CLOSED audits are excluded from the check.
        test_recipe:
          setup:
            - "Audit A1 for CA with lookback [2020, 2022] (OPENED)."
          setup_api_calls:
            - { call: "POST /escheatment/audit-cases", payload: { state_code: "CA", lookback_start_year: 2020, lookback_end_year: 2022 }, as: StateAuditor, as_user_id: "sa-1", captures: { a1: $.data.id } }
          trigger:
            - { call: "POST /escheatment/audit-cases", payload: { state_code: "CA", lookback_start_year: 2022, lookback_end_year: 2024 }, as: StateAuditor, as_user_id: "sa-1", captures: { err2: $.data.error_id } }
            - { call: "POST /escheatment/audit-cases", payload: { state_code: "CA", lookback_start_year: 2023, lookback_end_year: 2024 }, as: StateAuditor, as_user_id: "sa-1", captures: { a3: $.data.id } }
            - { call: "POST /escheatment/audit-cases/${a1}/advance", as: StateAuditor, as_user_id: "sa-1" }
            - { call: "POST /escheatment/audit-cases/${a1}/advance", as: StateAuditor, as_user_id: "sa-1" }
            - { call: "POST /escheatment/audit-cases/${a1}/advance", as: StateAuditor, as_user_id: "sa-1" }
            - { call: "POST /escheatment/audit-cases/${a3}/advance", as: StateAuditor, as_user_id: "sa-1" }
            - { call: "POST /escheatment/audit-cases/${a3}/advance", as: StateAuditor, as_user_id: "sa-1" }
            - { call: "POST /escheatment/audit-cases/${a3}/advance", as: StateAuditor, as_user_id: "sa-1" }
            - { call: "POST /escheatment/audit-cases", payload: { state_code: "CA", lookback_start_year: 2022, lookback_end_year: 2024 }, as: StateAuditor, as_user_id: "sa-1", captures: { a4: $.data.id } }
          assert:
            - "A2 [2022,2024] vs A1 [2020,2022]: shared endpoint year 2022 counts as overlap under CLOSED semantics -> ERR_AUDIT_LOOKBACK_OVERLAP (409)"
            - "A3 [2023,2024]: disjoint -> 201"
            - "After A1 and A3 advance to CLOSED: A4 [2022,2024] succeeds (201) — CLOSED audits no longer participate"

  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: liquidation_execute_cancel_conserves_line_valuation
        grounds:
          - state_machines.LiquidationOrder.EXECUTED_to_CANCELLED
          - entities.ReportLineItem.fields.provisional_value_cents
          - entities.SecuritiesDetail.fields.pending_execution_price_cents
        distinguishing_aspect: |
          Conserved quantity: the report-line provisional valuation
          (ReportLineItem.provisional_value_cents == 462500 and status INCLUDED).
          The forward action (execute) stages a pending price; the compensating
          action (cancel) unstages it; the named quantity is bit-identical before
          and after the pair.
        test_recipe:
          setup:
            - "NV securities property (100 sh, close 4500c, div 12500c) REPORTED via an ACCEPTED NV 2026 report; line provisional 462500c; liquidation order REQUESTED (fee 2500c)."
          setup_api_calls:
            - { call: "POST /escheatment/dormancy-rules", payload: { state_code: "NV", property_type: "BROKERAGE_SHARES", dormancy_years: 3, effective_from: "2020-01-01" }, as: HolderAdmin, as_user_id: "ha-1" }
            - { call: "POST /escheatment/owners", payload: { full_name: "Inv Ariant", last_known_address: "20 Cedar St, Ely, NV", state_code: "NV" }, as: ComplianceOfficer, as_user_id: "co-1", captures: { own1: $.data.id } }
            - { call: "POST /escheatment/properties", payload: { owner_id: "${own1}", property_type: "BROKERAGE_SHARES", state_code: "NV", original_value_cents: 462500, last_contact_date: "2023-03-15" }, as: ComplianceOfficer, as_user_id: "co-1", captures: { p1: $.data.id } }
            - { call: "POST /escheatment/properties/${p1}/securities-detail", payload: { cusip: "ESC1828D", shares_quantity: 100, last_close_price_cents: 4500, accrued_dividends_cents: 12500 }, as: ComplianceOfficer, as_user_id: "co-1", captures: { sd1: $.data.id } }
            - { call: "POST /escheatment/_sweeps/dormancy", as: HolderAdmin, as_user_id: "ha-1" }
            - { call: "POST /escheatment/properties/${p1}/due-diligence-letters", as: ComplianceOfficer, as_user_id: "co-1" }
            - { call: "POST /escheatment/_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: HolderAdmin, as_user_id: "ha-1" }
            - { call: "POST /escheatment/_sweeps/dormancy", as: HolderAdmin, as_user_id: "ha-1" }
            - { call: "POST /escheatment/holder-reports", payload: { state_code: "NV", report_year: 2026 }, as: ComplianceOfficer, as_user_id: "co-1", captures: { r1: $.data.id, r1_v1: $.data.version } }
            - { call: "POST /escheatment/holder-reports/${r1}/line-items", payload: { property_id: "${p1}", expected_report_version: "${r1_v1}" }, as: ComplianceOfficer, as_user_id: "co-1", captures: { li1: $.data.id } }
            - { call: "POST /escheatment/holder-reports/${r1}/submit", as: ComplianceOfficer, as_user_id: "co-1" }
            - { call: "POST /escheatment/holder-reports/${r1}/accept", as: StateAuditor, as_user_id: "sa-1" }
            - { call: "POST /escheatment/liquidation-orders", payload: { property_id: "${p1}", liquidation_fee_cents: 2500 }, as: TreasuryOps, as_user_id: "to-1", captures: { lo1: $.data.id } }
          trigger:
            - { call: "POST /escheatment/liquidation-orders/${lo1}/execute", payload: { execution_price_cents_per_share: 4700 }, as: TreasuryOps, as_user_id: "to-1" }
            - { call: "GET /escheatment/properties/${p1}/securities-detail", as: Any, captures: { sd_mid: "$.data[0].status" } }
            - { call: "POST /escheatment/liquidation-orders/${lo1}/cancel", as: TreasuryOps, as_user_id: "to-1" }
            - { call: "GET /escheatment/holder-reports/${r1}/line-items", as: Any, captures: { li_prov: "$.data[0].provisional_value_cents", li_st: "$.data[0].status", li_fin: "$.data[0].final_value_cents" } }
            - { call: "GET /escheatment/holder-reports/${r1}", as: Any, captures: { r_prov: $.data.total_provisional_cents } }
            - { call: "GET /escheatment/properties/${p1}/securities-detail", as: Any, captures: { sd_end: "$.data[0].status", sd_pend: "$.data[0].pending_execution_price_cents" } }
          assert:
            - "After execute: SecuritiesDetail EXECUTION_PENDING with pending price staged"
            - "After cancel (compensation): SecuritiesDetail back to REGISTERED, pending_execution_price_cents null"
            - "INVARIANT: line provisional_value_cents == 462500 and status == INCLUDED and final_value_cents == null — identical to before the execute/cancel pair"
            - "INVARIANT: report total_provisional_cents == 462500 unchanged; order terminal CANCELLED"

      - name: remittance_fail_requeue_conserves_confirmed_total
        grounds:
          - state_machines.Remittance.PENDING_to_FAILED
          - state_machines.Remittance.FAILED_to_PENDING
          - entities.HolderReport.fields.confirmed_remittance_cents
        distinguishing_aspect: |
          Conserved quantity (different type from the valuation instance):
          fulfillment progress — HolderReport.confirmed_remittance_cents and the
          set of REMITTED properties. The fail + requeue pair (with a corrected
          amount) leaves both bit-identical: 0 confirmed, property still REPORTED.
        test_recipe:
          setup:
            - "CA cash property 100000c in an ACCEPTED CA 2026 report; remittance of 100000c PENDING, then FAILED by the state."
          setup_api_calls:
            - { call: "POST /escheatment/dormancy-rules", payload: { state_code: "CA", property_type: "SAVINGS", dormancy_years: 3, effective_from: "2020-01-01" }, as: HolderAdmin, as_user_id: "ha-1" }
            - { call: "POST /escheatment/owners", payload: { full_name: "Con Serve", last_known_address: "21 Shore Rd, Alviso, CA", state_code: "CA" }, as: ComplianceOfficer, as_user_id: "co-1", captures: { own1: $.data.id } }
            - { call: "POST /escheatment/properties", payload: { owner_id: "${own1}", property_type: "SAVINGS", state_code: "CA", original_value_cents: 100000, last_contact_date: "2023-03-15" }, as: ComplianceOfficer, as_user_id: "co-1", captures: { p1: $.data.id } }
            - { call: "POST /escheatment/_sweeps/dormancy", as: HolderAdmin, as_user_id: "ha-1" }
            - { call: "POST /escheatment/properties/${p1}/due-diligence-letters", as: ComplianceOfficer, as_user_id: "co-1" }
            - { call: "POST /escheatment/_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: HolderAdmin, as_user_id: "ha-1" }
            - { call: "POST /escheatment/_sweeps/dormancy", as: HolderAdmin, as_user_id: "ha-1" }
            - { call: "POST /escheatment/holder-reports", payload: { state_code: "CA", report_year: 2026 }, as: ComplianceOfficer, as_user_id: "co-1", captures: { r1: $.data.id, r1_v1: $.data.version } }
            - { call: "POST /escheatment/holder-reports/${r1}/line-items", payload: { property_id: "${p1}", expected_report_version: "${r1_v1}" }, as: ComplianceOfficer, as_user_id: "co-1" }
            - { call: "POST /escheatment/holder-reports/${r1}/submit", as: ComplianceOfficer, as_user_id: "co-1" }
            - { call: "POST /escheatment/holder-reports/${r1}/accept", as: StateAuditor, as_user_id: "sa-1" }
            - { call: "POST /escheatment/holder-reports/${r1}/remittances", payload: { amount_cents: 100000 }, as: TreasuryOps, as_user_id: "to-1", captures: { rem1: $.data.id } }
            - { call: "POST /escheatment/remittances/${rem1}/fail", payload: { failure_reason: "ACH return" }, as: StateAuditor, as_user_id: "sa-1" }
          trigger:
            - { call: "POST /escheatment/remittances/${rem1}/requeue", payload: { amount_cents: 100000 }, as: TreasuryOps, as_user_id: "to-1", captures: { rem_st: $.data.status, rem_fail: $.data.failure_reason } }
            - { call: "GET /escheatment/holder-reports/${r1}", as: Any, captures: { r_conf: $.data.confirmed_remittance_cents } }
            - { call: "GET /escheatment/properties/${p1}", as: Any, captures: { p_st: $.data.status } }
          assert:
            - "After fail + requeue: remittance PENDING again, failure_reason cleared to null"
            - "INVARIANT: report.confirmed_remittance_cents == 0 — unchanged by the fail/requeue pair (formula: sum of amount_cents over CONFIRMED remittances)"
            - "INVARIANT: property status == REPORTED (no REMITTED drift); exactly one remittance exists for the report"
