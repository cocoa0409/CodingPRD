          assert:
            - "curriculum_version 2025.2 against ORG_CURRICULUM_VERSION 2026.1 returns 422 with error_id == ERR_CURRICULUM_VERSION_MISMATCH"
            - "curriculum_version 2026.1 against a member certified on 2025.2 also returns 422 with error_id == ERR_CURRICULUM_VERSION_MISMATCH — the member half of the conjunction is enforced too"
            - "The matching request returns 201 with StaffAllocation.${cv_alloc}.status == PROPOSED"
            - "Both rejections left Affiliate.${cv_aff}.version unchanged, so the single expected_affiliate_version ${cv_v1} was still valid for the accepted call"
            - "GET /affiliates/${cv_aff}/staff-allocations returns total_count == 1"

      - name: aggregate_fte_across_overlapping_allocations_is_capped
        claim_type: aggregate_validation
        grounds:
          - "validations[priority=84]"
          - errors[ERR_STAFF_FTE_OVERCOMMITTED]
        excluded_because:
          difficulty_instance: staff_allocation_half_open_intervals_allow_adjacency_but_cap_aggregate_fte
          rationale: "The §1.8 resource_temporal_overlap instance already builds two individually legal allocations whose overlapping sum exceeds MAX_STAFF_FTE_PCT and asserts both the rejection and the adjacent-interval acceptance, which is this aggregate claim in full."
      - name: assignment_state_check_runs_before_the_capacity_check
        claim_type: cascading_validation
        grounds:
          - "validations[priority=40]"
          - "validations[priority=74]"
        excluded_because:
          difficulty_instance: assignment_activate_state_error_precedes_roster_capacity_error
          rationale: "The §1.8 priority_pair_validation_conflict instance already constructs a single request that violates both the state rule and the roster-capacity rule and pins the state error as the response, which is exactly the ordering this claim asserts."

