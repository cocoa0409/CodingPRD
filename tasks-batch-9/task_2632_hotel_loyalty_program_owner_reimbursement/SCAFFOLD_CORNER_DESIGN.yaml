      - name: complaint_info_loop_returns_to_under_review_twice_then_refuses_a_third_request
        claim_type: cyclic
        grounds:
          - state_machines.MemberComplaint.transitions.UNDER_REVIEW_to_INFO_REQUESTED
          - state_machines.MemberComplaint.transitions.INFO_REQUESTED_to_UNDER_REVIEW
          - validations.priority_51_ERR_INFO_REQUEST_LIMIT
          - state_machines.MemberComplaint.transitions.UNDER_REVIEW_to_RESOLVED_GOODWILL
        distinguishing_aspect: |
          UNDER_REVIEW <-> INFO_REQUESTED is a genuine cycle - the complaint re-enters a state it
          already occupied - but info_request_count is never decremented on the way back, so the
          loop is bounded at two iterations and the third request-info is a 409
          ERR_INFO_REQUEST_LIMIT while the complaint stays in UNDER_REVIEW and remains resolvable.
        test_recipe:
          setup:
            - "One member with an empty ledger; the program fund therefore reports HEALTHY (solvency 999.0), so a goodwill grant is permitted."
            - "One OPEN POINT_SHORTFALL complaint filed by that member."
          setup_api_calls:
            - call: "POST /loyalty/members"
              payload: { email: "cl1@example.com", full_name: "Miriam Osei", enrollment_date: "2026-01-20" }
              as: MemberCareAgent
              as_user_id: "care-cl-01"
              captures: { m_id: $.data.id }
            - call: "POST /loyalty/member-complaints"
              payload: { member_id: "${m_id}", subject_type: "POINT_SHORTFALL", description: "Statement shows no points for my June stay." }
              as: Member
              as_user_id: "${m_id}"
              captures: { c_id: $.data.id }
            - call: "POST /loyalty/member-complaints/${c_id}/review"
              payload: {}
              as: MemberCareAgent
              as_user_id: "care-cl-01"
          trigger:
            - call: "POST /loyalty/member-complaints/${c_id}/request-info"
              payload: {}
              as: MemberCareAgent
              as_user_id: "care-cl-01"
              captures: { st1: $.data.status, ct1: $.data.info_request_count }
            - call: "POST /loyalty/member-complaints/${c_id}/provide-info"
              payload: { description: "Booking confirmation attached." }
              as: Member
              as_user_id: "${m_id}"
              captures: { st2: $.data.status, ct2: $.data.info_request_count }
            - call: "POST /loyalty/member-complaints/${c_id}/request-info"
              payload: {}
              as: MemberCareAgent
              as_user_id: "care-cl-01"
              captures: { st3: $.data.status, ct3: $.data.info_request_count }
            - call: "POST /loyalty/member-complaints/${c_id}/provide-info"
              payload: {}
              as: Member
              as_user_id: "${m_id}"
              captures: { st4: $.data.status, ct4: $.data.info_request_count }
            - call: "POST /loyalty/member-complaints/${c_id}/request-info"
              payload: {}
              as: MemberCareAgent
              as_user_id: "care-cl-01"
              captures: { e_limit: $.data.error_id }
            - call: "POST /loyalty/member-complaints/${c_id}/resolve"
              payload: { resolution: "Missing points credited as goodwill.", goodwill_points: 5000 }
              as: MemberCareAgent
              as_user_id: "care-cl-01"
              captures: { st5: $.data.status, gw: $.data.goodwill_points_granted }
          assert:
            - "${st1} == INFO_REQUESTED with ${ct1} == 1"
            - "${st2} == UNDER_REVIEW with ${ct2} == 1 - returning to a visited state does not rewind the counter"
            - "${st3} == INFO_REQUESTED with ${ct3} == 2 and ${st4} == UNDER_REVIEW with ${ct4} == 2"
            - "${e_limit} == ERR_INFO_REQUEST_LIMIT with http 409, and MemberComplaint.${c_id}.status is still UNDER_REVIEW with info_request_count still 2"
            - "${st5} == RESOLVED_GOODWILL with ${gw} == 5000 - the bounded loop did not poison the resolution path"
            - "Member.${m_id}.point_balance == 5000 and exactly one GOODWILL PointLedgerEntry exists for the member"
            - "GET /loyalty/program-fund now reports outstanding_points 5000, point_liability_cents 2400, solvency_ratio 0.0 and status IMPAIRED - the grant itself impaired the fund"

      - name: denied_benefit_escalates_through_the_complaint_and_adjudication_orders_delivery
        claim_type: valid_transition
        grounds:
          - state_machines.EliteBenefitDelivery.transitions.DENIED_to_ESCALATED
          - state_machines.EliteBenefitDelivery.transitions.ESCALATED_to_DELIVERED
          - state_machines.MemberComplaint.transitions.RESOLVED_UPHELD_to_ESCALATED
          - state_machines.MemberComplaint.transitions.ESCALATED_to_CLOSED
          - calculations.benefit_cost_recovery
        distinguishing_aspect: |
          The full denial loop is walked end to end: the member's escalation drags the delivery
          DENIED -> ESCALATED, the administrator's DELIVERY_ORDERED adjudication drags it
          ESCALATED -> DELIVERED and only then computes cost recovery (4500 on a 30000-cent ADR),
          and the property's denial count falls back to 0 because DELIVERED leaves the counted set
          while ESCALATED was still inside it. Adjudication moves no points.
        test_recipe:
          setup:
            - "One ACTIVE URBAN property, trailing ADR 30000, program_fee_pct 0.05, TRANSIENT rate plan."
            - "The member is lifted to SILVER by a posted 10-night stay, then a second posted 2-night stay synthesizes exactly one OBLIGATED UPGRADE delivery."
            - "The property denies the upgrade; the member files a BENEFIT_DENIAL complaint against it, which care review resolves as upheld."
          setup_api_calls:
            - call: "POST /loyalty/hotels"
              payload: { name: "Escalation House", brand_code: "ESH", market_tier: "URBAN", program_fee_pct: 0.05, rooms_count: 150, trailing_12m_occupancy_pct: 0.82, trailing_12m_adr_cents: 30000 }
