            - { call: "POST /locker/capacity-days", payload: { date: "2026-08-20", capacity_head: 2 }, as: PlantManager, captures: { cd1: $.data.id } }
            - { call: "POST /locker/appointments", payload: { customer_id: "${c1}", capacity_day_id: "${cd1}", species: "BEEF", head_count: 2 }, as: Customer, as_user_id: "${c1}", captures: { appt: $.data.id } }
            - { call: "POST /locker/appointments/${appt}/pay-deposit", payload: { amount_cents: 30000 }, as: Customer, as_user_id: "${c1}" }
            - { call: "GET /locker/appointments/${appt}/animals", payload: {}, as: PlantOperator, captures: { an1: "$.data[0].id", an2: "$.data[1].id" } }
            - { call: "POST /locker/animals/${an1}/receive", payload: { tag_id: "TAG-F1", live_weight_lbs: 1200.0 }, as: PlantOperator }
            - { call: "POST /locker/animals/${an1}/slaughter", payload: {}, as: PlantOperator }
            - { call: "POST /locker/animals/${an1}/weigh", payload: { hanging_weight_lbs: 400.0 }, as: PlantOperator }
            - { call: "POST /locker/animals/${an1}/shares", payload: { owner_customer_id: "${c1}", share_fraction: 0.25, intended_use: "OWNER_USE" }, as: Customer, as_user_id: "${c1}", captures: { s1: $.data.id } }
            - { call: "POST /locker/animals/${an1}/shares", payload: { owner_customer_id: "${c2}", share_fraction: 0.25, intended_use: "OWNER_USE" }, as: Customer, as_user_id: "${c1}", captures: { s2: $.data.id } }
            - { call: "POST /locker/animals/${an1}/shares", payload: { owner_customer_id: "${c1}", share_fraction: 0.25, intended_use: "OWNER_USE" }, as: Customer, as_user_id: "${c1}", captures: { s3: $.data.id } }
            - { call: "POST /locker/animals/${an1}/shares", payload: { owner_customer_id: "${c2}", share_fraction: 0.25, intended_use: "OWNER_USE" }, as: Customer, as_user_id: "${c1}", captures: { s4: $.data.id } }
            - { call: "POST /locker/animals/${an1}/shares/finalize", payload: {}, as: PlantOperator }
            - { call: "POST /locker/shares/${s1}/cut-sheet", payload: { grind_pct: 30, package_weight_lbs: 2.0 }, as: Customer, as_user_id: "${c1}", captures: { cs1: $.data.id } }
            - { call: "POST /locker/cut-sheets/${cs1}/submit", payload: {}, as: Customer, as_user_id: "${c1}" }
            - { call: "POST /locker/shares/${s2}/cut-sheet", payload: { grind_pct: 30, package_weight_lbs: 2.0 }, as: Customer, as_user_id: "${c2}", captures: { cs2: $.data.id } }
            - { call: "POST /locker/cut-sheets/${cs2}/submit", payload: {}, as: Customer, as_user_id: "${c2}" }
            - { call: "POST /locker/shares/${s3}/cut-sheet", payload: { grind_pct: 30, package_weight_lbs: 2.0 }, as: Customer, as_user_id: "${c1}", captures: { cs3: $.data.id } }
            - { call: "POST /locker/cut-sheets/${cs3}/submit", payload: {}, as: Customer, as_user_id: "${c1}" }
            - { call: "POST /locker/shares/${s4}/cut-sheet", payload: { grind_pct: 30, package_weight_lbs: 2.0 }, as: Customer, as_user_id: "${c2}", captures: { cs4: $.data.id } }
            - { call: "POST /locker/cut-sheets/${cs4}/submit", payload: {}, as: Customer, as_user_id: "${c2}" }
            - { call: "POST /locker/animals/${an2}/receive", payload: { tag_id: "TAG-F2", live_weight_lbs: 1200.0 }, as: PlantOperator }
            - { call: "POST /locker/animals/${an2}/slaughter", payload: {}, as: PlantOperator }
            - { call: "POST /locker/animals/${an2}/weigh", payload: { hanging_weight_lbs: 200.0 }, as: PlantOperator }
            - { call: "POST /locker/animals/${an2}/shares", payload: { owner_customer_id: "${c3}", share_fraction: 1.0, intended_use: "OWNER_USE" }, as: Customer, as_user_id: "${c1}", captures: { sB: $.data.id } }
            - { call: "POST /locker/animals/${an2}/shares/finalize", payload: {}, as: PlantOperator }
            - { call: "POST /locker/shares/${sB}/cut-sheet", payload: { grind_pct: 30, package_weight_lbs: 2.0 }, as: Customer, as_user_id: "${c3}", captures: { csB: $.data.id } }
            - { call: "POST /locker/cut-sheets/${csB}/submit", payload: {}, as: Customer, as_user_id: "${c3}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-04T00:00:00Z" }, as: PlantManager }
            - { call: "POST /locker/animals/${an1}/start-fabrication", payload: {}, as: PlantOperator }
            - { call: "POST /locker/animals/${an1}/complete-fabrication", payload: {}, as: PlantOperator }
          trigger:
