  - method: POST
    path: "/payments"
    description: "Take a payment; waterfall-applies to open invoices, remainder to credit"
    roles: [FamilyMember, BillingAdmin]
    code: 201
    input: [client_id, amount_cents, method]
    output: Payment
    side_effects: ["payment_waterfall; status SETTLED; applications recorded in allocation order"]

  - method: GET
    path: "/payments/{id}"
    description: "Fetch one payment"
    roles: [BillingAdmin, FamilyMember, Client]
    code: 200
    input: []
    output: Payment
    side_effects: []

  - method: GET
    path: "/payments"
    description: "List payments"
    roles: [BillingAdmin, Coordinator]
    code: 200
    input: ["client_id?", "status?", "limit?", "offset?"]
    output: Payment[]
    side_effects: []

  - method: POST
    path: "/payments/{id}/refund"
    description: "Refund a payment fully or partially; reverses applications newest-first"
    roles: [BillingAdmin]
    code: 200
    input: [amount_cents, "reason?"]
    output: Payment
    side_effects: ["refund_reversal; status PARTIALLY_REFUNDED or REFUNDED"]

  # --- Ops epoch & logical clock ---
  - method: POST
    path: "/ops/run-cycle"
    description: "Advance the ops epoch: expire compliance docs at end of validity window (driver suspension cascade), generate standing-ride occurrences inside the horizon, expire timed-out OFFERED assignments, mark invoices past_due after due_date"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: { ops_epoch: integer, expired_compliance_doc_ids: "string[]", generated_ride_ids: "string[]", expired_assignment_ids: "string[]", past_due_invoice_ids: "string[]" }
    side_effects: ["see description; each expired doc may trigger the Driver auto-SUSPEND cascade"]

  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical clock (test-driving endpoint). Startup default is exactly 2026-05-01T00:00:00Z; before any set call the logical clock reads this default and never falls back to wall-clock time."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["logical clock := to_iso8601; all timestamps, windows, horizons, and notice computations read this clock"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed JSON, missing required field, or invalid enum/typed value" }
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing or unrecognized X-User-Role / X-User-ID headers" }
  - { id: ERR_UNAUTHORIZED_ROLE, http: 403, condition: "Role not in the endpoint's allowed role list" }
  - { id: ERR_FORBIDDEN_OWNERSHIP, http: 403, condition: "Entity-backed caller does not own the target resource (wrong client/driver/family member)" }
  - { id: ERR_FAMILY_ACCESS_INSUFFICIENT, http: 403, condition: "FamilyMember access_level does not permit the action, or member is REVOKED" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Referenced resource id does not exist" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_<parent>_version does not equal the parent's current version (OCC)" }
  - { id: ERR_CLIENT_SUSPENDED, http: 409, condition: "Ride/standing-ride creation or booking while the client is SUSPENDED or DEACTIVATED" }
  - { id: ERR_CLIENT_HAS_OPEN_WORK, http: 409, condition: "Deactivation blocked by non-terminal rides or open invoices" }
  - { id: ERR_RIDE_NOT_CANCELLABLE, http: 409, condition: "Cancel attempted from IN_SERVICE, COMPLETED, CANCELLED, or NO_SHOW" }
  - { id: ERR_RIDE_NOT_DISPATCHABLE, http: 409, condition: "Dispatch attempted from a status other than SCHEDULED/DISPATCHING" }
  - { id: ERR_DUPLICATE_OFFER, http: 409, condition: "Dispatch while an OFFERED assignment is still live for the ride" }
  - { id: ERR_ASSIGNMENT_NOT_ACTIONABLE, http: 409, condition: "Respond attempted on a non-OFFERED assignment" }
  - { id: ERR_ASSIGNMENT_RELEASE_INVALID, http: 409, condition: "Release attempted on a non-ACCEPTED assignment" }
  - { id: ERR_EXECUTION_EVENT_INVALID, http: 409, condition: "Execution event not permitted from the ride's current status (incl. open wait segment violations)" }
  - { id: ERR_DRIVER_STATE_INVALID, http: 409, condition: "Driver status event not permitted from the driver's current status (e.g. ACTIVATE from OFFBOARDED)" }
  - { id: ERR_DRIVER_NOT_ELIGIBLE, http: 409, condition: "Driver fails eligibility at ACCEPT: not ACTIVE, or compliance docs not valid at pickup date" }
  - { id: ERR_DRIVER_COMPLIANCE_INCOMPLETE, http: 409, condition: "ACTIVATE/REINSTATE without an APPROVED, currently valid doc for each of BACKGROUND_CHECK, BONDING, INSURANCE" }
  - { id: ERR_DRIVER_DAILY_CAP_EXCEEDED, http: 409, condition: "Accept would push current_load_minutes + estimated_duration_minutes above max_daily_service_minutes" }
  - { id: ERR_RIDE_OVERLAP_DRIVER, http: 409, condition: "Accept would create a buffered-window overlap with another ACCEPTED assignment of the same driver" }
  - { id: ERR_NO_SHOW_TOO_EARLY, http: 409, condition: "NO_SHOW before arrived_at + 15 minutes" }
  - { id: ERR_DOC_ALREADY_REVIEWED, http: 409, condition: "Review attempted on a doc not in PENDING_REVIEW" }
  - { id: ERR_DOC_WINDOW_INVALID, http: 422, condition: "Compliance doc valid_until <= valid_from" }
  - { id: ERR_RATE_WINDOW_INVALID, http: 422, condition: "Rate card effective_to <= effective_from" }
  - { id: ERR_RATE_WINDOW_OVERLAP, http: 409, condition: "Activation would intersect another ACTIVE same-service-class window (touching boundaries allowed)" }
  - { id: ERR_RATE_CARD_NOT_ACTIVE, http: 409, condition: "No ACTIVE rate card for the ride's derived service_class at the pickup date" }
  - { id: ERR_RATE_CARD_STATE_INVALID, http: 409, condition: "Activate attempted on non-DRAFT, or retire attempted on RETIRED card" }
  - { id: ERR_STANDING_WINDOW_INVALID, http: 422, condition: "Standing ride ends_on < starts_on" }
  - { id: ERR_STANDING_STATUS_INVALID, http: 409, condition: "PAUSE/RESUME/END not permitted from the series' current status" }
  - { id: ERR_INVOICE_PERIOD_INVALID, http: 422, condition: "Invoice period_end <= period_start" }
  - { id: ERR_INVOICE_PERIOD_OVERLAP, http: 409, condition: "A non-VOIDED invoice for this client already intersects the requested half-open period" }
  - { id: ERR_INVOICE_EMPTY, http: 422, condition: "No billable rides in the requested period" }
  - { id: ERR_INVOICE_NOT_ISSUABLE, http: 409, condition: "Issue attempted on a non-DRAFT invoice" }
  - { id: ERR_INVOICE_NOT_VOIDABLE, http: 409, condition: "Void attempted on PARTIALLY_PAID/PAID/VOIDED invoice, or paid_cents > 0" }
  - { id: ERR_DISPUTE_ACTION_INVALID, http: 409, condition: "RAISE from wrong issuance/dispute state, or resolve when not DISPUTED" }
  - { id: ERR_PAYMENT_AMOUNT_INVALID, http: 422, condition: "Payment amount_cents <= 0" }
  - { id: ERR_PAYMENT_NOT_REFUNDABLE, http: 409, condition: "Refund attempted on a fully REFUNDED payment" }
  - { id: ERR_REFUND_EXCEEDS_SETTLED, http: 422, condition: "Refund amount exceeds amount_cents - refunded_cents" }
  - { id: ERR_REFUND_CREDIT_SPENT, http: 409, condition: "Refund's credit portion exceeds the client's current credit_balance_cents" }
  - { id: ERR_RETURN_LINK_MISMATCH, http: 409, condition: "linked_return_ride_id targets a ride of another client, a non-APPOINTMENT ride, a non-SCHEDULED ride, or a ride that itself has a return link" }
  - { id: ERR_FAMILY_CLIENT_MISMATCH, http: 409, condition: "booked_by_family_member_id belongs to a different client" }
  - { id: ERR_BILLING_HOLD, http: 402, condition: "Client's overdue AR is at or above billing_hold_limit_cents; new rides/standing rides blocked" }
  - { id: ERR_SOD_CONFLICT, http: 403, condition: "Dispute resolver dispatched a ride billed on this invoice (segregation of duties)" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Platform operator owning rate cards, the ops epoch, and the logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /rate-cards, POST /rate-cards/{id}/activate, POST /rate-cards/{id}/retire — rate card lifecycle"
      - "POST /ops/run-cycle — advance the ops epoch"
      - "POST /_clock/set_current_utc — set the logical clock"
    shared_operations:
      - "GET /clients*, GET /drivers*, GET /compliance-docs* — read access"

  - name: Coordinator
    description: "Concierge desk staff managing clients, family members, drivers, series, and dispatch"
    identity: opaque
    exclusive_operations:
      - "POST /clients, PATCH /clients/{id} — client registry and status"
      - "POST /family-members*, POST /family-members/{id}/revoke — portal membership"
      - "POST /drivers, POST /drivers/{id}/status-events — driver onboarding and lifecycle"
      - "POST /rides/{id}/dispatch — run the driver selector"
      - "PUT /standing-rides/{id} — template edits (OCC)"
    shared_operations:
      - "POST /rides, POST /standing-rides, POST /rides/{id}/cancel — booking on behalf of clients"
      - "POST /compliance-docs — document submission on behalf of drivers"
      - "GET reads across entities"

  - name: ComplianceOfficer
    description: "Reviews background checks, bonding, and insurance documents"
    identity: opaque
    exclusive_operations:
      - "POST /compliance-docs/{id}/review — approve/reject documents"
    shared_operations:
      - "GET /compliance-docs* — read documents"

  - name: BillingAdmin
    description: "Billing operator generating/issuing/voiding invoices, taking and refunding payments, resolving disputes"
    identity: opaque
    exclusive_operations:
      - "POST /invoices/generate, POST /invoices/{id}/issue, POST /invoices/{id}/void — invoice lifecycle"
      - "POST /payments/{id}/refund — refunds"
      - "POST /invoices/{id}/dispute-events (RESOLVE_ACCEPT, RESOLVE_REJECT) — dispute resolution (SoD-checked)"
    shared_operations:
      - "POST /payments — take a payment (shared with BILLING_PAYER family members)"
      - "GET reads across billing entities"

  - name: Client
    description: "The senior rider; acts on own resources only"
    identity: entity_backed:Client
    exclusive_operations: []
    shared_operations:
      - "POST /rides, POST /standing-rides — own bookings (client_id == X-User-ID)"
      - "POST /rides/{id}/cancel — cancel own rides"
      - "POST /standing-rides/{id}/status-events — pause/resume/end own series"
      - "POST /invoices/{id}/dispute-events (RAISE) — dispute own invoices"
      - "GET /rides*, GET /rides/{id}/events, GET /invoices*, GET /clients/{id}, GET /family-members/{id}, GET /payments/{id} — own data"

  - name: FamilyMember
    description: "Family portal user; capability tiered by access_level on the FamilyMember row"
    identity: entity_backed:FamilyMember
    exclusive_operations: []
    shared_operations:
      - "POST /rides, POST /standing-rides — booking for their client (requires BOOK_FOR_CLIENT or BILLING_PAYER)"
      - "POST /rides/{id}/cancel — cancel their client's rides (requires BOOK_FOR_CLIENT or BILLING_PAYER)"
      - "POST /payments — pay for their client (requires BILLING_PAYER)"
      - "POST /invoices/{id}/dispute-events (RAISE) — dispute their client's invoices (requires BILLING_PAYER)"
      - "GET /rides/{id}/events, GET /invoices*, GET /clients/{id} — portal log and billing views for their client"

  - name: Driver
    description: "Assigned driver; acts on own assignments and rides"
    identity: entity_backed:Driver
    exclusive_operations:
      - "POST /assignments/{id}/respond — accept/decline own offers"
      - "POST /assignments/{id}/release — release own accepted assignment"
      - "POST /rides/{id}/execution-events — execution log on own assigned ride"
    shared_operations:
      - "POST /compliance-docs — submit own documents (driver_id == X-User-ID)"
      - "GET /drivers/{id}, GET /assignments*, GET /rides* — own data"
