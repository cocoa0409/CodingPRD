              payload: { audit_type: "ASSESSOR_SAMPLE", scoring_variant: "WORST_CASE", sample_window_start: "2026-11-01", assessor_id: "${assessor_id}", samples: [{ assessment_id: "${assess_ok}", remeasured_body_fat_pct: 17.5 }] }
              as: StateOffice
              captures: { audit_id: $.data.id, audit_samples: $.data.sample_count }
          trigger:
