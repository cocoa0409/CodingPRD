        claim_type: listing
        grounds: ["response_envelope", "endpoints[GET /network/showtimes]"]
        distinguishing_aspect: "List responses carry the fixed envelope: meta.api_request_id/api_request_timestamp, response_type array, and pagination fields total_count/has_more with default limit 10 when no limit/offset is supplied."
        test_recipe:
          setup: ["two showtimes created on one screen"]
          setup_api_calls:
            - { call: "POST /network/theaters", payload: { name: "MetroPlex", market_tier: MAJOR_METRO }, as: NetworkOps, captures: { t_id: "$.data.id" } }
            - { call: "POST /network/theaters/${t_id}/screens", payload: { auditorium_label: "Aud 1", seat_count: 200 }, as: NetworkOps, captures: { s_id: "$.data.id" } }
            - { call: "POST /network/features", payload: { title: "Skyline", content_rating: PG13, runtime_minutes: 120, release_date: "2026-08-10" }, as: NetworkOps, captures: { f_id: "$.data.id" } }
            - { call: "POST /network/screens/${s_id}/showtimes", payload: { feature_id: "${f_id}", starts_at: "2026-08-14T19:00:00Z" }, as: NetworkOps }
            - { call: "POST /network/screens/${s_id}/showtimes", payload: { feature_id: "${f_id}", starts_at: "2026-08-15T19:00:00Z" }, as: NetworkOps }
          trigger:
