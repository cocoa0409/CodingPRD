# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# task_2878_trade_promotion_planning_deduction_management
# 9 rule_ids x 2 instances = 18 instances. Every literal in an `assert:` line
# was computed against the SCAFFOLD.yaml §1.3 formulas with Decimal
# ROUND_HALF_UP arithmetic before being written here.
# Fixture user ids: dir-1 (TradeMarketingDirector), kam-1 (KeyAccountManager),
# fin-1 / fin-2 (TradeFinanceAnalyst), ded-1 / ded-2 (DeductionSpecialist),
# aud-1 (ComplianceAuditor). Portal users act as their own Customer.id.
# =============================================================================
scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: accrual_shipment_basis_vs_consumption_basis_diverge
        grounds:
          - calculations.accrual_amount_for_period
          - entities.Promotion.fields.accrual_method
          - entities.AccrualEntry.fields.method
          - entities.VolumeFact.fields.fact_type
        distinguishing_aspect: |
          Two promotions with byte-identical tactic lines accrue different amounts for the
          identical request payload {period_start: 2026-08-03}: the SHIPMENT
          promotion reads the SHIPMENT fact (2000 cases) and tests the window at
          period_start + 14 days, the CONSUMPTION promotion reads the point-of-sale fact
          (1600 cases) at period_start itself, giving 2500.00 against 2000.00. This
          instance lives in the accrual-ledger domain (Promotion / AccrualEntry / VolumeFact).
        test_recipe:
          setup:
            - "Logical clock at 2026-08-03."
            - "One program, one brand, one customer, one APPROVED allocation with planned_amount 100000.00 and planned_incremental_units 20000."
            - "Promotion S on the SHIPMENT basis and promotion C on the CONSUMPTION basis, each window 2026-08-03 -> 2026-08-31 and each carrying one TPR tactic at rate_per_case 1.25 over 8000 planned cases (planned_total_spend 10200.00 each)."
            - "Both promotions APPROVED and then LIVE via the activation run."
            - "One SHIPMENT volume fact of 2000 cases and one CONSUMPTION volume fact of 1600 cases, both for period_start 2026-08-03 on the same customer and brand."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T00:00:00Z" }
              as: TradeFinanceAnalyst
              as_user_id: "fin-1"
            - call: "POST /trade-marketing/programs"
              payload: { fiscal_year: 2026, name: "FY2026 National Trade Fund", total_budget_amount: 5000000.00, accrual_method_default: "SHIPMENT" }
              as: TradeMarketingDirector
              as_user_id: "dir-1"
              captures: { prog_id: $.data.id }
            - call: "POST /trade-marketing/brands"
              payload: { program_id: "${prog_id}", name: "Crisp Oat Cereal", list_price_per_case: 24.00, cogs_per_case: 8.70, baseline_units_per_week: 1200 }
              as: TradeMarketingDirector
              as_user_id: "dir-1"
              captures: { brand_id: $.data.id }
            - call: "POST /trade-marketing/customers"
              payload: { program_id: "${prog_id}", name: "MegaMart", channel: "GROCERY", deduction_validation_policy: "EVIDENCE_BASED" }
              as: TradeMarketingDirector
              as_user_id: "dir-1"
              captures: { cust_id: $.data.id }
            - call: "POST /trade-marketing/budget-allocations"
              payload: { program_id: "${prog_id}", customer_id: "${cust_id}", brand_id: "${brand_id}", event_type: "SEASONAL", planned_amount: 100000.00, baseline_units: 40000, planned_incremental_units: 20000 }
              as: TradeMarketingDirector
              as_user_id: "dir-1"
              captures: { alloc_id: $.data.id }
            - call: "POST /trade-marketing/budget-allocations/${alloc_id}/approve"
              payload: {}
              as: TradeMarketingDirector
              as_user_id: "dir-1"
              captures: { alloc_v1: $.data.version }
            - call: "POST /trade-marketing/promotions"
              payload: { allocation_id: "${alloc_id}", name: "Shipment Basis Event", window_start: "2026-08-03", window_end: "2026-08-31", accrual_method: "SHIPMENT", expected_allocation_version: "${alloc_v1}" }
              as: KeyAccountManager
              as_user_id: "kam-1"
              captures: { promo_s_id: $.data.id }
            - call: "GET /trade-marketing/budget-allocations/${alloc_id}"
              payload: {}
              as: KeyAccountManager
              as_user_id: "kam-1"
              captures: { alloc_v2: $.data.version }
            - call: "POST /trade-marketing/promotions"
              payload: { allocation_id: "${alloc_id}", name: "Consumption Basis Event", window_start: "2026-08-03", window_end: "2026-08-31", accrual_method: "CONSUMPTION", expected_allocation_version: "${alloc_v2}" }
              as: KeyAccountManager
              as_user_id: "kam-1"
              captures: { promo_c_id: $.data.id }
            - call: "POST /trade-marketing/promotions/${promo_s_id}/tactics"
              payload: { tactic_type: "TPR", planned_units: 8000, window_start: "2026-08-03", window_end: "2026-08-31", rate_per_case: 1.25 }
              as: KeyAccountManager
              as_user_id: "kam-1"
            - call: "POST /trade-marketing/promotions/${promo_c_id}/tactics"
              payload: { tactic_type: "TPR", planned_units: 8000, window_start: "2026-08-03", window_end: "2026-08-31", rate_per_case: 1.25 }
              as: KeyAccountManager
              as_user_id: "kam-1"
            - call: "POST /trade-marketing/volume-facts"
              payload: { customer_id: "${cust_id}", brand_id: "${brand_id}", fact_type: "SHIPMENT", period_start: "2026-08-03", units: 2000, source: "EDI_856" }
              as: TradeFinanceAnalyst
              as_user_id: "fin-1"
            - call: "POST /trade-marketing/volume-facts"
              payload: { customer_id: "${cust_id}", brand_id: "${brand_id}", fact_type: "CONSUMPTION", period_start: "2026-08-03", units: 1600, source: "EDI_852" }
              as: TradeFinanceAnalyst
              as_user_id: "fin-1"
            - call: "POST /trade-marketing/promotions/${promo_s_id}/submit"
              payload: {}
              as: KeyAccountManager
              as_user_id: "kam-1"
            - call: "POST /trade-marketing/promotions/${promo_s_id}/approve"
              payload: {}
              as: TradeMarketingDirector
              as_user_id: "dir-1"
            - call: "POST /trade-marketing/promotions/${promo_c_id}/submit"
              payload: {}
              as: KeyAccountManager
              as_user_id: "kam-1"
            - call: "POST /trade-marketing/promotions/${promo_c_id}/approve"
              payload: {}
              as: TradeMarketingDirector
              as_user_id: "dir-1"
            - call: "POST /trade-marketing/promotion-activation-runs"
              payload: {}
              as: TradeFinanceAnalyst
              as_user_id: "fin-1"
          trigger:
            - call: "POST /trade-marketing/promotions/${promo_s_id}/accruals"
              payload: { period_start: "2026-08-03" }
              as: TradeFinanceAnalyst
              as_user_id: "fin-1"
              captures: { accrual_s_id: $.data.id, accrual_s_amount: $.data.amount }
            - call: "POST /trade-marketing/promotions/${promo_c_id}/accruals"
              payload: { period_start: "2026-08-03" }
              as: TradeFinanceAnalyst
              as_user_id: "fin-1"
              captures: { accrual_c_id: $.data.id, accrual_c_amount: $.data.amount }
          assert:
            - "AccrualEntry.${accrual_s_id}.method == SHIPMENT and AccrualEntry.${accrual_s_id}.fact_units == 2000"
            - "AccrualEntry.${accrual_s_id}.amount == 2500.00"
            - "AccrualEntry.${accrual_c_id}.method == CONSUMPTION and AccrualEntry.${accrual_c_id}.fact_units == 1600"
            - "AccrualEntry.${accrual_c_id}.amount == 2000.00"
            - "Promotion.${promo_s_id}.gross_accrued_amount == 2500.00 and Promotion.${promo_s_id}.accrued_balance == 2500.00"
            - "Promotion.${promo_c_id}.gross_accrued_amount == 2000.00 and Promotion.${promo_c_id}.accrued_balance == 2000.00"
            - "Both trigger calls carried the identical payload {period_start: 2026-08-03}; the 500.00 delta comes only from Promotion.accrual_method"

      - name: deduction_valuation_evidence_based_vs_agreement_cap_diverge
        grounds:
          - calculations.deduction_valuation
          - entities.Customer.fields.deduction_validation_policy
          - entities.Deduction.fields.validation_basis
          - entities.RetailerDocument.fields.units_verified
        distinguishing_aspect: |
          Two customers whose promotions, accruals, verified evidence (1800 cases) and claimed
          amount (3000.00) are identical settle on different entitlements purely from the
          customer's policy flag: EVIDENCE_BASED rebuilds 1800 x 1.25 = 2250.00 bottom-up and
          ignores the 2500.00 accrual balance, AGREEMENT_CAP takes the 2500.00 balance top-down
          and ignores the evidence. This instance lives in the accounts-receivable domain
          (Customer / Deduction / RetailerDocument), not the accrual-ledger domain of the
          first instance.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-03."
            - "One program, one brand, customer E with deduction_validation_policy EVIDENCE_BASED and customer A with AGREEMENT_CAP."
            - "One APPROVED allocation per customer; one LIVE promotion per customer, each window 2026-08-03 -> 2026-08-31 with one TPR tactic at rate_per_case 1.25 over 8000 cases."
            - "One SHIPMENT volume fact of 2000 cases per customer for period_start 2026-08-03, accrued so each promotion carries gross_accrued_amount 2500.00 and accrued_balance 2500.00."
            - "One VERIFIED EVIDENCE document per promotion with units_verified 1800."
            - "One MATCHED deduction per customer with claimed_amount 3000.00."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
