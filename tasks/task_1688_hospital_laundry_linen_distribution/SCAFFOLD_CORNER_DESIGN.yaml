  # ===========================================================================
  - section: calculations
    instances:
      - name: expected_pieces_rounds_half_up
        claim_type: correct_result
        grounds:
          - calculations.expected_pieces
        distinguishing_aspect: "10.125 lbs / 0.75 lbs = 13.5 pieces rounds half-up to 14 (not banker's-rounded to 14 by luck — pin the mode at the exact .5 case)."
        test_recipe:
          setup: ["facility; stock TERRY towel piece_weight 0.75"]
          setup_api_calls:
            - { call: "POST /facilities", payload: { name: "General", rate_per_lb_cents: 40, isolation_surcharge_pct: 0.25 }, as: LinenManager, as_user_id: "lm-1", captures: { fac: $.data.id } }
            - { call: "POST /linen-stocks", payload: { facility_id: "${fac}", sku: "TOWEL", display_name: "Bath Towel", category: "TERRY", piece_weight_lbs: 0.75, unit_cost_cents: 150, max_wash_cycles: 40, reorder_point_pieces: 15, opening_pieces: 120, opening_reserve_pieces: 0 }, as: LinenManager, as_user_id: "lm-1", captures: { s1: $.data.id } }
          trigger:
            - { call: "POST /soiled-manifests", payload: { facility_id: "${fac}", cart_run_ids: [], lines: [ { stock_id: "${s1}", weight_lbs: 10.125, isolation_flag: false } ] }, as: EVSOperator, as_user_id: "evs-1", captures: { m: $.data } }
          assert:
            - "manifest lines[0].expected_pieces == 14 (round_half_up(13.5))"

      - name: wash_life_retirement_boundary_crossing
        claim_type: boundary_edge
        grounds:
          - calculations.wash_life_retirement
        distinguishing_aspect: "Cumulative-wash retirement fires exactly at the multiple: with max_wash_cycles 5, returning the 5th piece retires exactly 1 (floor(5/5) - floor(0/5))."
        test_recipe:
          setup: ["facility; unit ICU; stock S1 max_wash_cycles 5, opening 50, reserve 10; par 10; fill run; collection run soiled 5; manifest expected 5"]
          setup_api_calls:
            - { call: "POST /facilities", payload: { name: "General", rate_per_lb_cents: 40, isolation_surcharge_pct: 0.25 }, as: LinenManager, as_user_id: "lm-1", captures: { fac: $.data.id } }
