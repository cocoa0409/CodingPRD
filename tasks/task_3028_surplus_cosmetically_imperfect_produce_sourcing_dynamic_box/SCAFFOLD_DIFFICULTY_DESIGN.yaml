    - calculations.advance_box_order_pricing
    - entities.BoxBuildItem.fields.billed_unit_weight_grams
    - entities.BoxOrder.fields.weight_total_grams
    distinguishing_aspect: "The two rounded quantities are computed in opposite orders: billed_unit_weight_grams = max(actual, per-category floor) rounds first and sums second, while lines_total_cents = round(sum of weight x price / 1000) sums first and rounds second \u2014 the same box therefore needs whole-gram clamping before its price can be computed at all."
