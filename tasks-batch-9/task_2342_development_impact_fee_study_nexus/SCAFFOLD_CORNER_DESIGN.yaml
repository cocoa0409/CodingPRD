      - name: study_can_loop_from_notice_published_back_to_draft_and_be_recertified
        claim_type: cyclic
        grounds:
          - complexity_profile.state_machine_shape
          - state_machines.FeeStudy.NOTICE_PUBLISHED_to_DRAFT
          - entities.FeeStudy.fields.revision_round
        excluded_because:
          difficulty_instance: sustained_protest_remands_noticed_study_back_to_draft
          rationale: "That instance already drives the full cycle NOTICE_PUBLISHED -> DRAFT -> NEXUS_CERTIFIED and asserts revision_round as the loop counter plus the clearing of the notice and certification stamps."

      - name: assessment_and_collection_dimensions_change_independently
        claim_type: parallel
        grounds:
          - complexity_profile.state_machine_shape
          - state_machines.DevelopmentApplication
          - entities.DevelopmentApplication.fields.assessment_status
          - entities.DevelopmentApplication.fields.collection_status
        excluded_because:
          difficulty_instance: assessment_and_collection_dimensions_advance_independently
          rationale: "That instance is exactly the parallel-dimension claim: it walks the assessment axis and the collection axis in interleaved order and asserts the combined state after each step."

      - name: certificate_of_occupancy_transition_is_guarded_by_deferral_state
        claim_type: guarded_transitions
        grounds:
          - complexity_profile.state_machine_shape
          - validations[priority=32]
          - state_machines.DeferralAgreement
          - errors.ERR_CO_BLOCKED_UNPAID
        excluded_because:
          difficulty_instance: certificate_of_occupancy_is_blocked_by_an_open_deferral_agreement
          rationale: "That instance is the cross-entity guard: issue-co is attempted while a sibling DeferralAgreement is still REQUESTED/EXECUTED/DEFAULTED and then again once the guard clears."

      - name: component_going_stale_cascades_down_to_its_schedule_items
        claim_type: cascade_down
        grounds:
          - state_machines.NexusComponent.VALID_to_STALE
          - entities.FeeScheduleItem.fields.schedule_status
        excluded_because:
          difficulty_instance: component_patch_decertifies_noticed_study_and_voids_protest_tally
          rationale: "That instance asserts the downward leg (component VALID -> STALE marks every child FeeScheduleItem STALE) together with the upward leg it triggers, so a separate cascade-down test would only re-assert a subset."

      - name: credit_decision_adjusts_the_application_and_the_fund_ledger
        claim_type: cross_entity
        grounds:
          - state_machines.CreditClaim.SUBMITTED_to_APPROVED_FULL
          - state_machines.FundLedgerEntry.OPEN_to_REFUNDED
          - entities.DevelopmentApplication.fields.net_due_cents
        excluded_because:
          difficulty_instance: credit_approval_reassesses_paid_application_and_opens_overpayment_refund
          rationale: "That instance follows the credit decision across three entities (claim, application, ledger) and asserts the resulting state and derived fields on each, which subsumes the generic cross-entity side-effect claim."

      - name: ledger_mutations_resynchronise_the_category_fund_fields
        claim_type: ledger_sync
        grounds:
          - entities.FacilityCategory.fields.fund_balance_cents
          - entities.FacilityCategory.fields.oldest_unexpended_vintage_at
          - calculations.fifo_expenditure_application
        excluded_because:
          difficulty_instance: fund_cash_is_conserved_across_collection_expenditure_and_refund
          rationale: "That instance reconciles the ancestor FacilityCategory's derived fund fields against the child FundLedgerEntry rows before and after every mutation, which is the ledger-sync claim in its strongest form."

      - name: protest_withdrawal_reverses_the_tally_it_added
        claim_type: compensation
        grounds:
          - state_machines.ProtestFiling.RECORDED_to_WITHDRAWN
          - entities.FeeStudy.fields.protest_weight_bp
          - entities.FeeStudy.fields.protest_count
        excluded_because:
          difficulty_instance: protest_weight_tally_is_conserved_across_filing_and_withdrawal
          rationale: "That instance is the compensation claim: it withdraws filings in a different order than they were recorded and asserts the tally returns to its pre-filing value with no drift."

      - name: activation_supersedes_only_the_prior_effective_study
        claim_type: conditional_cascade
        grounds:
          - state_machines.FeeStudy.EFFECTIVE_to_SUPERSEDED
          - entities.DevelopmentApplication.fields.reassessment_required
        excluded_because:
          difficulty_instance: activation_supersedes_prior_study_and_flags_pinned_applications
          rationale: "That instance asserts the conditional side effect on both sides: DRAFT and SUPERSEDED siblings are left alone while only the EFFECTIVE study is superseded, and only unpaid applications pinned to it are flagged."

  # ===========================================================================
  - section: calculations
    instances:
      - name: roads_allocation_produces_the_documented_cost_per_unit
        claim_type: correct_result
        grounds:
          - calculations.cost_per_demand_unit
          - calculations.growth_demand_units
          - entities.NexusComponent.fields.nexus_ratio
          - endpoints[POST /nexus-components/{id}/allocate]
        distinguishing_aspect: |
          Drives the whole allocation formula end to end on the ROADS component and pins
          every derived figure: net growth cost round_half_up(900000000 * 6500/10000) =
          585000000 less 100000000 other funding = 485000000, spread over
          min(1962.0000, 2000.0000) = 1962.0000 to give 247197 (485000000/1962 =
          247196.7...). The STANDARD_BASED shadow figure 200000 (250000000 * 0.0008) is
          computed at the same time but not adopted, and nexus_ratio is 2000/1962 = 1.0194.
        test_recipe:
          setup:
            - "FeeProgram HARBOR with declared defaults (los_policy EXISTING_DEFICIENCY_EXCLUDED)."
            - "FacilityCategory ROADS (existing_los 0.0008, planned_los 0.0006, unit_cost_cents 250000000)."
            - "A PLAN_BASED DRAFT study with the ROADS component created but not yet allocated."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-01-05T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /fee-programs"
              payload: { name: "City of Harbor Impact Fee Program", jurisdiction_code: "HARBOR" }
              as: ProgramAdministrator
              as_user_id: "admin-1"
              captures: { prog_id: $.data.id, prog_v: $.data.version }
            - call: "POST /facility-categories"
              payload: { fee_program_id: "${prog_id}", code: "ROADS", name: "Arterial Roads", demand_unit_label: "trip", existing_los_per_demand_unit: 0.0008, planned_los_per_demand_unit: 0.0006, unit_cost_cents: 250000000 }
              as: ProgramAdministrator
              as_user_id: "admin-1"
              captures: { cat_roads_id: $.data.id }
            - call: "POST /fee-studies"
              payload: { fee_program_id: "${prog_id}", title: "2026 Impact Fee Study", methodology: "PLAN_BASED", expected_fee_program_version: "${prog_v}" }
              as: NexusAnalyst
              as_user_id: "analyst-1"
              captures: { study_id: $.data.id }
            - call: "POST /nexus-components"
              payload: { fee_study_id: "${study_id}", facility_category_id: "${cat_roads_id}", horizon_start_year: 2026, horizon_end_year: 2030, projected_new_dwelling_units: 1200, projected_new_nonres_sqft: 200000, demand_units_per_dwelling: 1.0100, demand_units_per_1000_nonres_sqft: 3.7500, planned_facility_cost_cents: 900000000, planned_growth_share_bp: 6500, planned_capacity_demand_units: 2000, planned_other_funding_cents: 100000000, existing_tax_credit_per_unit_cents: 0 }
              as: NexusAnalyst
              as_user_id: "analyst-1"
              captures: { comp_roads_id: $.data.id }
          trigger:
            - call: "POST /nexus-components/${comp_roads_id}/allocate"
              as: NexusAnalyst
              as_user_id: "analyst-1"
          assert:
            - "HTTP 200."
            - "data.growth_demand_units == 1962.0000."
            - "data.plan_based_cost_per_unit_cents == 247197 (485000000 / 1962 = 247196.74..., round_half_up)."
            - "data.standard_based_cost_per_unit_cents == 200000 - the non-adopted variant is still computed and stored."
            - "data.adopted_cost_per_unit_cents == 247197: the parent study is PLAN_BASED and existing_tax_credit_per_unit_cents is 0."
            - "data.nexus_ratio == 1.0194 (2000.0000 / 1962.0000 = 1.019367..., 4 decimal places)."
            - "data.allocation_status == 'VALID' and data.allocated_at == '2026-01-05T00:00:00Z'."

      - name: planned_standard_allowed_prices_the_higher_level_of_service
        claim_type: constants_applied
        grounds:
          - calculations.cost_per_demand_unit
          - entities.FeeProgram.fields.los_policy
          - entities.NexusComponent.fields.existing_tax_credit_per_unit_cents
        distinguishing_aspect: |
          los_policy is a program constant that only the STANDARD_BASED branch consults, and
          it selects max(existing_los, planned_los) rather than simply planned_los. With
          PLANNED_STANDARD_ALLOWED the PARKS standard-based figure moves from 135000
          (45000000 * 0.0030) to 180000 (45000000 * 0.0040) while the plan-based figure is
          untouched at 116667, and because the study is STANDARD_BASED the adopted figure is
          180000 less the 15000 existing-tax credit = 165000.
        test_recipe:
          setup:
            - "FeeProgram HARBOR created with los_policy PLANNED_STANDARD_ALLOWED, every other constant defaulted."
            - "FacilityCategory PARKS (existing_los 0.0030, planned_los 0.0040, unit_cost_cents 45000000)."
            - "A STANDARD_BASED DRAFT study with the PARKS component (existing_tax_credit_per_unit_cents 15000, capacity 3500.0000)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-01-05T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /fee-programs"
              payload: { name: "City of Harbor Impact Fee Program", jurisdiction_code: "HARBOR", los_policy: "PLANNED_STANDARD_ALLOWED" }
              as: ProgramAdministrator
              as_user_id: "admin-1"
              captures: { prog_id: $.data.id, prog_v: $.data.version }
            - call: "POST /facility-categories"
              payload: { fee_program_id: "${prog_id}", code: "PARKS", name: "Neighborhood Parks", demand_unit_label: "resident", existing_los_per_demand_unit: 0.0030, planned_los_per_demand_unit: 0.0040, unit_cost_cents: 45000000 }
              as: ProgramAdministrator
              as_user_id: "admin-1"
              captures: { cat_parks_id: $.data.id }
            - call: "POST /fee-studies"
              payload: { fee_program_id: "${prog_id}", title: "2026 Impact Fee Study", methodology: "STANDARD_BASED", expected_fee_program_version: "${prog_v}" }
              as: NexusAnalyst
              as_user_id: "analyst-1"
              captures: { study_id: $.data.id }
            - call: "POST /nexus-components"
              payload: { fee_study_id: "${study_id}", facility_category_id: "${cat_parks_id}", horizon_start_year: 2026, horizon_end_year: 2030, projected_new_dwelling_units: 1200, projected_new_nonres_sqft: 0, demand_units_per_dwelling: 2.5000, demand_units_per_1000_nonres_sqft: 0.0000, planned_facility_cost_cents: 500000000, planned_growth_share_bp: 8000, planned_capacity_demand_units: 3500, planned_other_funding_cents: 50000000, existing_tax_credit_per_unit_cents: 15000 }
              as: NexusAnalyst
              as_user_id: "analyst-1"
              captures: { comp_parks_id: $.data.id }
          trigger:
            - call: "POST /nexus-components/${comp_parks_id}/allocate"
              as: NexusAnalyst
              as_user_id: "analyst-1"
          assert:
            - "HTTP 200."
            - "data.growth_demand_units == 3000.0000 (1200 * 2.5000)."
            - "data.standard_based_cost_per_unit_cents == 180000 - the planned standard 0.0040 was priced, NOT the existing 0.0030 which would give 135000."
            - "data.plan_based_cost_per_unit_cents == 116667 (round_half_up(500000000 * 0.8) - 50000000 = 350000000 over min(3000.0000, 3500.0000)); los_policy does not touch this branch."
            - "data.adopted_cost_per_unit_cents == 165000 (180000 - 15000): the STANDARD_BASED variant is selected and the existing-tax credit is netted off afterwards."
            - "data.nexus_ratio == 1.1667 (3500.0000 / 3000.0000) and data.allocation_status == 'VALID'."

      - name: schedule_line_fees_round_half_up_at_the_half_cent
        claim_type: precision
        grounds:
          - calculations.fee_schedule_item_fee
          - entities.FeeScheduleItem.fields.fee_per_unit_cents
          - endpoints[POST /nexus-components/{id}/fee-schedule-items]
        distinguishing_aspect: |
          Two schedule lines are chosen so their raw products land exactly on a half cent
          from opposite parities: 101667 * 2.5000 = 254167.5 and 101667 * 1.5000 = 152500.5.
          round_half_up must give 254168 and 152501. Truncation would give 254167/152500 and
          banker's rounding would give 152500, so this single instance separates all three
          rounding policies.
        test_recipe:
          setup:
            - "FeeProgram HARBOR with defaults; FacilityCategory PARKS; PLAN_BASED study."
            - "The PARKS component is allocated with adopted_cost_per_unit_cents 101667."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-01-05T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /fee-programs"
              payload: { name: "City of Harbor Impact Fee Program", jurisdiction_code: "HARBOR" }
              as: ProgramAdministrator
              as_user_id: "admin-1"
              captures: { prog_id: $.data.id, prog_v: $.data.version }
            - call: "POST /facility-categories"
              payload: { fee_program_id: "${prog_id}", code: "PARKS", name: "Neighborhood Parks", demand_unit_label: "resident", existing_los_per_demand_unit: 0.0030, planned_los_per_demand_unit: 0.0040, unit_cost_cents: 45000000 }
              as: ProgramAdministrator
              as_user_id: "admin-1"
              captures: { cat_parks_id: $.data.id }
            - call: "POST /fee-studies"
              payload: { fee_program_id: "${prog_id}", title: "2026 Impact Fee Study", methodology: "PLAN_BASED", expected_fee_program_version: "${prog_v}" }
              as: NexusAnalyst
              as_user_id: "analyst-1"
              captures: { study_id: $.data.id }
            - call: "POST /nexus-components"
              payload: { fee_study_id: "${study_id}", facility_category_id: "${cat_parks_id}", horizon_start_year: 2026, horizon_end_year: 2030, projected_new_dwelling_units: 1200, projected_new_nonres_sqft: 0, demand_units_per_dwelling: 2.5000, demand_units_per_1000_nonres_sqft: 0.0000, planned_facility_cost_cents: 500000000, planned_growth_share_bp: 8000, planned_capacity_demand_units: 3500, planned_other_funding_cents: 50000000, existing_tax_credit_per_unit_cents: 15000 }
              as: NexusAnalyst
              as_user_id: "analyst-1"
              captures: { comp_parks_id: $.data.id }
            - call: "POST /nexus-components/${comp_parks_id}/allocate"
              as: NexusAnalyst
              as_user_id: "analyst-1"
          trigger:
            - call: "POST /nexus-components/${comp_parks_id}/fee-schedule-items"
              payload: { land_use_category: "SINGLE_FAMILY", unit_basis: "PER_DWELLING", conversion_factor: 2.5000 }
              as: NexusAnalyst
              as_user_id: "analyst-1"
            - call: "POST /nexus-components/${comp_parks_id}/fee-schedule-items"
              payload: { land_use_category: "MULTI_FAMILY", unit_basis: "PER_DWELLING", conversion_factor: 1.5000 }
              as: NexusAnalyst
              as_user_id: "analyst-1"
          assert:
            - "Both calls return HTTP 201 with schedule_status 'VALID'."
            - "Line 1: fee_per_unit_cents == 254168 (254167.5 rounded half up), NOT 254167."
            - "Line 2: fee_per_unit_cents == 152501 (152500.5 rounded half up), NOT 152500 - half-even rounding is excluded here because the truncated value is even."
            - "The parent component's allocation_status is still 'VALID' - adding a schedule line does not stale the allocation."
            - "GET /nexus-components/{id}/fee-schedule-items returns total_count 2."

