              payload: { retransmit_note: "Round 2" }
              as: RegistryManager
            - call: "POST /cancer-registry/submissions/${sub_id}/edit-results"
              payload: { item_results: [{ case_id: "${case_id}", edit_status: "EDIT_FAILED", edit_codes: ["E-1004"] }] }
              as: StateRegistryLiaison
            - call: "POST /cancer-registry/submissions/${sub_id}/items/${item_id}/resolve"
              payload: { resolution_note: "Fix 3" }
              as: RegistryManager
            - call: "POST /cancer-registry/submissions/${sub_id}/retransmit"
              payload: { retransmit_note: "Round 3" }
              as: RegistryManager
              captures: { err: $.data.error_id }
          assert:
            - "after the first retransmit resubmission_round == 1 and submission_state == TRANSMITTED with the item back to edit_status PENDING and the case back to submission_state SUBMITTED"
            - "after the second retransmit resubmission_round == 2"
            - "the third retransmit returns HTTP 409 with data.error_id == ERR_RESUBMISSION_LIMIT_EXCEEDED (not ERR_UNRESOLVED_EDITS - every item is RESOLVED)"
            - "the submission is still EDITS_RETURNED with resubmission_round == 2, failed_item_count == 0 and the item edit_status RESOLVED"
            - "TumorCase ${case_id}.submission_state is still EDIT_REJECTED and assessment_due_cents is still 0"

      # Errors whose only reachable trigger is a §1.8 difficulty scenario are claimed there rather
      # than duplicated here; each stub names the instance that owns the code. ERR_ABSTRACTOR_NOT_ACTIVE
      # is covered by the state_machines instance
      # staffing_suspension_cascades_case_release_and_draft_abstraction_rejection above.
      - name: error_registry_frozen_and_abstractor_capacity_on_assign
        claim_type: Triggerable Error
        grounds:
          - errors[ERR_REGISTRY_FROZEN]
          - errors[ERR_ABSTRACTOR_CAPACITY_EXCEEDED]
        excluded_because:
          difficulty_instance: frozen_registry_masks_abstractor_capacity_cap_on_assign
          rationale: |
            Both codes live on the same assign call and the interesting claim is which one wins: the
            §1.8 instance already builds the twenty-case backlog that saturates the capacity cap and
            then freezes the registry, asserting ERR_REGISTRY_FROZEN first and ERR_ABSTRACTOR_CAPACITY_EXCEEDED
            after the posture clears. Re-triggering them separately here would rebuild that fixture
            and could not add a distinguishing assertion.

      - name: error_assessment_unpaid_on_transmit
        claim_type: Triggerable Error
        grounds:
          - errors[ERR_ASSESSMENT_UNPAID]
        excluded_because:
          difficulty_instance: submission_state_check_masks_unpaid_assessment_on_second_transmit
          rationale: |
            A non-zero assessment_due_cents only exists after a late-case edit-results run, which is
            exactly the fixture the §1.8 instance builds; it asserts the 402 and its ordering behind the
            submission-state check.

      - name: error_rework_limit_exceeded_on_reopen_draft
        claim_type: Triggerable Error
        grounds:
          - errors[ERR_REWORK_LIMIT_EXCEEDED]
        excluded_because:
          difficulty_instance: abstraction_rework_cycle_reenters_draft_twice_then_hits_round_cap
          rationale: |
            The cap is only observable after two full QA rework cycles, which the §1.8 instance walks
            round by round while asserting rework_round at each boundary.

      - name: error_auditor_window_capacity_exceeded
        claim_type: Triggerable Error
        grounds:
          - errors[ERR_AUDITOR_WINDOW_CAPACITY_EXCEEDED]
        excluded_because:
          difficulty_instance: third_overlapping_auditor_window_exceeds_capacity_until_one_is_voided
          rationale: |
            The aggregate closed-interval overlap count is the whole point of the §1.8 instance, which
            also proves the slot is released again by a void; a standalone trigger would be a strict
            subset of it.

      - name: error_conference_slot_conflict
        claim_type: Triggerable Error
        grounds:
          - errors[ERR_CONFERENCE_SLOT_CONFLICT]
        excluded_because:
          difficulty_instance: conference_back_to_back_session_violates_thirty_minute_changeover_buffer
          rationale: |
            The conflict window is the 30-minute changeover buffer rather than raw overlap, so the
            §1.8 instance owns the boundary pair (buffer-1 rejected, buffer accepted).

      - name: error_case_not_completed_on_transmit
        claim_type: Triggerable Error
        grounds:
          - errors[ERR_CASE_NOT_COMPLETED]
        excluded_because:
          difficulty_instance: transmit_requires_every_item_case_completed_after_audit_regression
          rationale: |
            The code is most sharply triggered by a case that WAS completed when the item was added and
            regressed afterwards, which is the §1.8 instance's cross-entity gate; the naive
            never-completed case is the same assertion with less signal.

  # =========================================================================
  # Guide section 7 - From Table 7 (RBAC), role_model = segregation_of_duties
  # Seven roles, two of them entity_backed:Abstractor, so identity matters as much
  # as role: the same person may hold RegistryAbstractor and QaReviewer and still be
  # refused on their own work (ERR_SEGREGATION_OF_DUTIES_VIOLATION), and a peer
  # registrar is refused on someone else's case (ERR_NOT_ASSIGNED_ABSTRACTOR).
  # =========================================================================
  - section: rbac
    instances:

      - name: missing_and_unknown_role_headers_are_unauthenticated_before_any_other_check
        claim_type: Role Restriction
        grounds:
          - errors[ERR_UNAUTHORIZED]
          - validations[priority 1 authentication]
        distinguishing_aspect: |
          Authentication sits at priority 1, above even request-shape validation, so a request with no
          X-User-Role must answer 401 rather than 400 - even when its body is also malformed and its
          path id does not exist, which is what pins the ordering rather than merely the code.
        test_recipe:
          setup:
            - "One program exists; the trigger requests are issued with the auth headers manipulated as described per call."
          setup_api_calls:
            - call: "POST /cancer-registry/programs"
              payload: { name: "Northside Cancer Center", coc_program_id: "COC-1456N", annual_analytic_caseload: 300, reference_year: 2018, timeliness_standard_days: 180 }
              as: PlatformAdmin
              captures: { prog_id: $.data.id }
          trigger:
            - call: "POST /cancer-registry/abstractors"
              payload: { program_id: "${prog_id}", name: "No Headers", credential: "CTR", productivity_target_cases_per_day: 2, certification_expires_on: "2027-12-31" }
              as: RegistryManager
              captures: { e1: $.data.error_id }
            - call: "POST /cancer-registry/abstractors"
              payload: { name: "Bad Role And No Program" }
              as: RegistryManager
              captures: { e2: $.data.error_id }
            - call: "GET /cancer-registry/programs/00000000-0000-0000-0000-0000000000ff"
              payload: {}
              as: RegistryManager
              captures: { e3: $.data.error_id }
          assert:
            - "call 1 is sent with BOTH X-User-Role and X-User-ID omitted and returns HTTP 401 with data.error_id == ERR_UNAUTHORIZED; no Abstractor is created"
            - "call 2 is sent with X-User-Role: RegistryDirector (not one of the seven declared roles) AND a body missing program_id / credential, and still returns HTTP 401 ERR_UNAUTHORIZED - not ERR_INVALID_REQUEST"
            - "call 3 is sent with X-User-ID omitted against a non-existent program id and returns HTTP 401 ERR_UNAUTHORIZED - not ERR_PROGRAM_NOT_FOUND"
            - "GET /cancer-registry/abstractors?program_id=${prog_id} (properly authenticated) reports total_count == 0"

      - name: every_role_is_forbidden_from_another_roles_exclusive_operation
        claim_type: Role Restriction
        grounds:
          - errors[ERR_FORBIDDEN]
          - rbac.exclusive_operations
          - validations[priority 2 authorization]
        distinguishing_aspect: |
          One authenticated call per role, each aimed at a different role's exclusive operation, proves
          the matrix is enforced per endpoint rather than by seniority: PlatformAdmin - who creates the
          programs and owns the clock - is still refused a clinical citation, and RegistryManager, who
          runs the registry, cannot open an improvement project.
        test_recipe:
          setup:
            - "One program with one abstractor, one submission and one deficiency so that every target path resolves and the refusal cannot be mistaken for a 404."
          setup_api_calls:
            - call: "POST /cancer-registry/programs"
              payload: { name: "Northside Cancer Center", coc_program_id: "COC-1456N", annual_analytic_caseload: 300, reference_year: 2018, timeliness_standard_days: 180 }
              as: PlatformAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /cancer-registry/abstractors"
              payload: { program_id: "${prog_id}", name: "Dana Reyes", credential: "CTR", productivity_target_cases_per_day: 2, certification_expires_on: "2027-12-31" }
              as: RegistryManager
              captures: { abs_a_id: $.data.id }
            - call: "POST /cancer-registry/submissions"
              payload: { program_id: "${prog_id}", period_start: "2026-07-01", period_end: "2026-07-31", deadline_date: "2026-12-31" }
              as: RegistryManager
              captures: { sub_id: $.data.id }
            - call: "POST /cancer-registry/quality-measures"
              payload: { program_id: "${prog_id}", measure_code: "CSTC", measurement_year: 2026, threshold_pct: 80.0 }
              as: RegistryManager
              captures: { meas_id: $.data.id }
          trigger:
            - call: "POST /cancer-registry/deficiencies"
              payload: { program_id: "${prog_id}", standard_code: "STD-4.5", severity: "MAJOR", cited_on: "2026-08-01" }
              as: PlatformAdmin
              captures: { e1: $.data.error_id }
            - call: "POST /cancer-registry/quality-measures/${meas_id}/improvement-project"
              payload: { action: "OPEN", project_title: "Manager-driven project" }
              as: RegistryManager
              captures: { e2: $.data.error_id }
            - call: "POST /cancer-registry/programs"
              payload: { name: "Rogue Program", coc_program_id: "COC-9999R", annual_analytic_caseload: 100, reference_year: 2020, timeliness_standard_days: 180 }
              as: RegistryAbstractor
              as_user_id: "${abs_a_id}"
              captures: { e3: $.data.error_id }
            - call: "POST /cancer-registry/programs/${prog_id}/survey-complete"
              payload: { completed_on: "2026-08-01", surveyor_note: "Reviewer overreach" }
              as: QaReviewer
              as_user_id: "${abs_a_id}"
              captures: { e4: $.data.error_id }
            - call: "POST /cancer-registry/submissions/${sub_id}/edit-results"
              payload: { item_results: [] }
              as: CoCSurveyor
              as_user_id: "user-surveyor-1"
              captures: { e5: $.data.error_id }
            - call: "POST /cancer-registry/cases/00000000-0000-0000-0000-0000000000c1/assign"
              payload: { abstractor_id: "${abs_a_id}" }
              as: StateRegistryLiaison
              as_user_id: "user-liaison-1"
              captures: { e6: $.data.error_id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-02T00:00:00Z" }
              as: AccreditationCoordinator
              as_user_id: "user-coord-1"
              captures: { e7: $.data.error_id }
          assert:
            - "all seven calls return HTTP 403 with data.error_id == ERR_FORBIDDEN"
            - "the StateRegistryLiaison assign attempt returns ERR_FORBIDDEN and NOT ERR_CASE_NOT_FOUND - authorization at priority 2 outranks path existence at priority 10"
            - "no side effect landed: GET /cancer-registry/deficiencies?program_id=${prog_id} total_count == 0, the measure is still DRAFT with project_title null, GET /cancer-registry/programs reports total_count == 1"
            - "the program's accreditation_state is still ACCREDITED with survey_year null"
            - "the logical clock still reads 2026-08-01T00:00:00Z, so the AccreditationCoordinator's clock attempt changed nothing"

      - name: shared_quality_measure_operations_work_for_both_owning_roles
        claim_type: Role Restriction
        grounds:
          - rbac.shared_operations
          - endpoints[POST /cancer-registry/quality-measures]
          - endpoints[POST /cancer-registry/quality-measures/{measureId}/evaluate]
        distinguishing_aspect: |
          Shared operations are genuinely shared, not merely tolerated for one role: the coordinator can
          both register and evaluate a measure the manager created, while the improvement project that
          FOLLOWS the same measure remains coordinator-exclusive - so the split is per operation, not
          per entity.
        test_recipe:
          setup:
            - "One program."
          setup_api_calls:
            - call: "POST /cancer-registry/programs"
              payload: { name: "Northside Cancer Center", coc_program_id: "COC-1456N", annual_analytic_caseload: 300, reference_year: 2018, timeliness_standard_days: 180 }
              as: PlatformAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /cancer-registry/quality-measures"
              payload: { program_id: "${prog_id}", measure_code: "CSTC", measurement_year: 2026, threshold_pct: 80.0 }
              as: RegistryManager
              captures: { meas_mgr: $.data.id }
          trigger:
            - call: "POST /cancer-registry/quality-measures"
              payload: { program_id: "${prog_id}", measure_code: "BCSRT", measurement_year: 2026, threshold_pct: 90.0 }
              as: AccreditationCoordinator
              as_user_id: "user-coord-1"
              captures: { meas_coord: $.data.id }
            - call: "POST /cancer-registry/quality-measures/${meas_mgr}/evaluate"
              payload: { strata: [{ stage_group: "STAGE_I", eligible_case_count: 10, compliant_case_count: 7 }] }
              as: AccreditationCoordinator
              as_user_id: "user-coord-1"
            - call: "POST /cancer-registry/quality-measures/${meas_coord}/evaluate"
              payload: { strata: [{ stage_group: "STAGE_II", eligible_case_count: 10, compliant_case_count: 10 }] }
              as: RegistryManager
            - call: "POST /cancer-registry/quality-measures/${meas_mgr}/improvement-project"
              payload: { action: "OPEN", project_title: "Chemo start timeliness", target_rate_pct: 85.0 }
              as: AccreditationCoordinator
              as_user_id: "user-coord-1"
          assert:
            - "the coordinator's create returns HTTP 201 and the manager's measure evaluated by the coordinator returns HTTP 200 with performance_rate_pct == 70.0, performance_state == UNDER_THRESHOLD and measure_state == PROJECT_REQUIRED"
            - "the coordinator's measure evaluated by the manager returns HTTP 200 with performance_rate_pct == 100.0, performance_state == EXCEEDS and measure_state == MEASURED"
            - "the coordinator's improvement-project OPEN on the manager's PROJECT_REQUIRED measure returns HTTP 200 with measure_state == PROJECT_ACTIVE and target_rate_pct == 85.0"
            - "both measures belong to the same program: GET /cancer-registry/quality-measures?program_id=${prog_id} reports total_count == 2"

      - name: every_role_can_read_every_get_endpoint
        claim_type: Role Restriction
        grounds:
          - rbac.shared_operations
          - endpoints[GET /cancer-registry/programs/{programId}]
        distinguishing_aspect: |
          Reads are the one universally shared operation, so the state registry liaison and the surveyor
          - who may write almost nothing - must still see the same program record as the platform admin,
          byte for byte, with no role-dependent field masking.
        test_recipe:
          setup:
            - "One program."
          setup_api_calls:
            - call: "POST /cancer-registry/programs"
              payload: { name: "Northside Cancer Center", coc_program_id: "COC-1456N", annual_analytic_caseload: 300, reference_year: 2018, timeliness_standard_days: 180 }
              as: PlatformAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /cancer-registry/abstractors"
              payload: { program_id: "${prog_id}", name: "Dana Reyes", credential: "CTR", productivity_target_cases_per_day: 2, certification_expires_on: "2027-12-31" }
              as: RegistryManager
              captures: { abs_a_id: $.data.id }
          trigger:
            - call: "GET /cancer-registry/programs/${prog_id}"
              payload: {}
              as: PlatformAdmin
            - call: "GET /cancer-registry/programs/${prog_id}"
              payload: {}
              as: RegistryManager
            - call: "GET /cancer-registry/programs/${prog_id}"
              payload: {}
              as: RegistryAbstractor
              as_user_id: "${abs_a_id}"
            - call: "GET /cancer-registry/programs/${prog_id}"
              payload: {}
              as: QaReviewer
              as_user_id: "${abs_a_id}"
            - call: "GET /cancer-registry/programs/${prog_id}"
              payload: {}
              as: AccreditationCoordinator
              as_user_id: "user-coord-1"
            - call: "GET /cancer-registry/programs/${prog_id}"
              payload: {}
              as: StateRegistryLiaison
              as_user_id: "user-liaison-1"
            - call: "GET /cancer-registry/programs/${prog_id}"
              payload: {}
              as: CoCSurveyor
              as_user_id: "user-surveyor-1"
          assert:
            - "all seven reads return HTTP 200"
            - "every response body's data is identical, including id, coc_program_id, accreditation_state == ACCREDITED, registry_posture == OPEN and version"
            - "no response omits or masks any field declared for CancerProgram in §1.1"

      - name: a_peer_registrar_cannot_abstract_or_submit_another_registrars_case
        claim_type: Role Restriction
        grounds:
          - errors[ERR_NOT_ASSIGNED_ABSTRACTOR]
          - state_machines.Abstraction.abstraction_state
          - rbac.RegistryAbstractor.identity
        distinguishing_aspect: |
          The RegistryAbstractor role is entity_backed, so holding the role is not enough: registrar B
          carries the right role and posts a well-formed body with the CURRENT case version, and is
          still refused because X-User-ID is not the assigned registrar - and refused again on submit-qa
          for an abstraction that is not hers. Ownership is checked after state and OCC, so this is a
          403 rather than a 409 or 412.
        test_recipe:
          setup:
            - "One case assigned to registrar A, who drafts its abstraction; registrar B is a second ACTIVE CTR in the same program."
          setup_api_calls:
            - call: "POST /cancer-registry/programs"
              payload: { name: "Northside Cancer Center", coc_program_id: "COC-1456N", annual_analytic_caseload: 300, reference_year: 2018, timeliness_standard_days: 180 }
              as: PlatformAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /cancer-registry/abstractors"
              payload: { program_id: "${prog_id}", name: "Dana Reyes", credential: "CTR", productivity_target_cases_per_day: 2, certification_expires_on: "2027-12-31" }
              as: RegistryManager
              captures: { abs_a_id: $.data.id }
            - call: "POST /cancer-registry/abstractors"
              payload: { program_id: "${prog_id}", name: "Bea Nakamura", credential: "CTR", productivity_target_cases_per_day: 2, certification_expires_on: "2027-12-31" }
              as: RegistryManager
              captures: { abs_b_id: $.data.id }
            - call: "POST /cancer-registry/casefinding-sources"
              payload: { program_id: "${prog_id}", source_type: "PATHOLOGY", expected_monthly_volume: 40 }
              as: RegistryManager
              captures: { src_id: $.data.id }
            - call: "POST /cancer-registry/casefinding-sources/${src_id}/entries"
              payload: { patient_mrn: "MRN-0001", accession_date: "2026-08-03", primary_site_code: "C50.9", histology_code: "8500/3", behavior_code: "MALIGNANT_3", diagnosis_date: "2026-07-01", first_contact_date: "2026-07-05", diagnosed_at_facility: true, first_treatment_at_facility: true }
              as: RegistryManager
              captures: { entry_id: $.data.id }
            - call: "POST /cancer-registry/casefinding-entries/${entry_id}/reportability-decision"
              payload: { decision: "REPORTABLE", decision_reason_code: "SEER_REPORTABLE_BEHAVIOR" }
              as: RegistryManager
              captures: { case_id: $.data.created_case_id }
            - call: "POST /cancer-registry/cases/${case_id}/assign"
              payload: { abstractor_id: "${abs_a_id}" }
              as: RegistryManager
              captures: { case_v: $.data.version }
          trigger:
            - call: "POST /cancer-registry/abstractions"
              payload: { case_id: "${case_id}", abstractor_id: "${abs_b_id}", expected_case_version: "${case_v}", stage_source: "PATHOLOGIC", t_category: "T2", n_category: "N0", m_category: "M0", stage_group: "STAGE_II", first_treatment_date: "2026-07-10", treatment_modalities: ["SURGERY"], diagnostic_confirmation_code: "POSITIVE_HISTOLOGY", outcome_status: "ALIVE_NO_EVIDENCE", last_contact_date: "2026-07-20" }
              as: RegistryAbstractor
              as_user_id: "${abs_b_id}"
              captures: { e1: $.data.error_id }
            - call: "POST /cancer-registry/abstractions"
              payload: { case_id: "${case_id}", abstractor_id: "${abs_a_id}", expected_case_version: "${case_v}", stage_source: "PATHOLOGIC", t_category: "T2", n_category: "N0", m_category: "M0", stage_group: "STAGE_II", first_treatment_date: "2026-07-10", treatment_modalities: ["SURGERY"], diagnostic_confirmation_code: "POSITIVE_HISTOLOGY", outcome_status: "ALIVE_NO_EVIDENCE", last_contact_date: "2026-07-20" }
              as: RegistryAbstractor
              as_user_id: "${abs_a_id}"
              captures: { abst_id: $.data.id }
            - call: "POST /cancer-registry/abstractions/${abst_id}/submit-qa"
              payload: {}
              as: RegistryAbstractor
              as_user_id: "${abs_b_id}"
              captures: { e2: $.data.error_id }
          assert:
            - "registrar B's create returns HTTP 403 with data.error_id == ERR_NOT_ASSIGNED_ABSTRACTOR; no Abstraction exists yet and the case is still ASSIGNED at version ${case_v}"
            - "registrar A's identical create returns HTTP 201 with abstraction_state == DRAFT, and the case moves to IN_ABSTRACTION"
            - "registrar B's submit-qa returns HTTP 403 with data.error_id == ERR_NOT_ASSIGNED_ABSTRACTOR, abstraction_state stays DRAFT with submitted_at null and the case stays IN_ABSTRACTION"
            - "Abstractor ${abs_b_id}.assigned_open_case_count is still 0 and ${abs_a_id}.assigned_open_case_count is 1"

      - name: deficiency_review_must_come_from_a_different_user_than_the_response
        claim_type: Segregation of duties
        grounds:
          - errors[ERR_SEGREGATION_OF_DUTIES_VIOLATION]
          - validations[priority 53 segregation of duties]
          - endpoints[POST /cancer-registry/deficiencies/{deficiencyId}/response-review]
        distinguishing_aspect: |
          The response/review split is enforced on X-User-ID across two different roles, so a person who
          filed the corrective action as coordinator cannot review it by re-appearing with the surveyor
          role - the recorded responder id, not the role of the reviewer, is what blocks the call.
        test_recipe:
          setup:
            - "One MAJOR deficiency whose response was filed by user-coord-1."
          setup_api_calls:
            - call: "POST /cancer-registry/programs"
              payload: { name: "Northside Cancer Center", coc_program_id: "COC-1456N", annual_analytic_caseload: 300, reference_year: 2018, timeliness_standard_days: 180 }
              as: PlatformAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /cancer-registry/deficiencies"
              payload: { program_id: "${prog_id}", standard_code: "STD-4.5", severity: "MAJOR", cited_on: "2026-08-01" }
              as: CoCSurveyor
              as_user_id: "user-surveyor-1"
              captures: { def_id: $.data.id }
            - call: "POST /cancer-registry/deficiencies/${def_id}/response"
              payload: { response_narrative: "Corrective action plan filed", evidence_reference: "CAP-1" }
              as: AccreditationCoordinator
              as_user_id: "user-coord-1"
          trigger:
            - call: "POST /cancer-registry/deficiencies/${def_id}/response-review"
              payload: { outcome: "ACCEPTED", reviewer_notes: "Self-review attempt" }
              as: CoCSurveyor
              as_user_id: "user-coord-1"
              captures: { e1: $.data.error_id }
            - call: "POST /cancer-registry/deficiencies/${def_id}/response-review"
              payload: { outcome: "ACCEPTED", reviewer_notes: "Independent review" }
              as: CoCSurveyor
              as_user_id: "user-surveyor-1"
          assert:
            - "the self-review returns HTTP 409 with data.error_id == ERR_SEGREGATION_OF_DUTIES_VIOLATION and deficiency_state stays RESPONSE_SUBMITTED with reviewer_notes null"
            - "the independent review returns HTTP 200 with deficiency_state == RESOLVED and reviewer_notes == 'Independent review'"
            - "escalation_count is still 0 and response_due_date is unchanged at 2026-09-15"

      - name: accreditation_decision_must_come_from_a_different_surveyor_than_the_survey
        claim_type: Segregation of duties
        grounds:
          - errors[ERR_SEGREGATION_OF_DUTIES_VIOLATION]
          - endpoints[POST /cancer-registry/programs/{programId}/survey-complete]
          - endpoints[POST /cancer-registry/programs/{programId}/accreditation-decision]
        distinguishing_aspect: |
          The last segregation pair spans two calls on the SAME entity by the SAME role: survey-complete
          records the acting surveyor, and the decision must then come from another one. Because the
          program sits in DEFICIENCY_RESPONSE with an open MAJOR finding, the legitimate decision is
          PROBATION, which lets the identity refusal be observed without tripping the accreditation
          gates.
        test_recipe:
          setup:
            - "The clock is moved to 2026-10-01 so a MAJOR deficiency cited that day is still open; the survey is scheduled for 2027-01-15 (>= clock + 60 days) and completed by user-surveyor-1, which lands the program in DEFICIENCY_RESPONSE."
          setup_api_calls:
            - call: "POST /cancer-registry/programs"
              payload: { name: "Northside Cancer Center", coc_program_id: "COC-1456N", annual_analytic_caseload: 300, reference_year: 2018, timeliness_standard_days: 180 }
              as: PlatformAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-10-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /cancer-registry/deficiencies"
              payload: { program_id: "${prog_id}", standard_code: "STD-4.5", severity: "MAJOR", cited_on: "2026-10-01" }
              as: CoCSurveyor
              as_user_id: "user-surveyor-1"
              captures: { def_id: $.data.id }
            - call: "POST /cancer-registry/programs/${prog_id}/survey-schedule"
              payload: { survey_date: "2027-01-15" }
              as: AccreditationCoordinator
              as_user_id: "user-coord-1"
            - call: "POST /cancer-registry/programs/${prog_id}/survey-complete"
              payload: { completed_on: "2026-10-01", surveyor_note: "One major standard unmet" }
              as: CoCSurveyor
              as_user_id: "user-surveyor-1"
          trigger:
            - call: "POST /cancer-registry/programs/${prog_id}/accreditation-decision"
              payload: { decision: "PROBATION", decision_note: "Same surveyor deciding" }
              as: CoCSurveyor
              as_user_id: "user-surveyor-1"
              captures: { e1: $.data.error_id }
            - call: "POST /cancer-registry/programs/${prog_id}/accreditation-decision"
              payload: { decision: "PROBATION", decision_note: "Independent decision" }
              as: CoCSurveyor
              as_user_id: "user-surveyor-2"
          assert:
            - "survey-complete returns HTTP 200 with accreditation_state == DEFICIENCY_RESPONSE, survey_year == 2026 and next_survey_due_year == 2029 (the open MAJOR finding sent it to DEFICIENCY_RESPONSE rather than back to ACCREDITED)"
            - "the same-surveyor decision returns HTTP 409 with data.error_id == ERR_SEGREGATION_OF_DUTIES_VIOLATION and accreditation_state stays DEFICIENCY_RESPONSE with registry_posture OPEN"
            - "the second surveyor's decision returns HTTP 200 with accreditation_state == PROBATION and registry_posture == FROZEN"
            - "Deficiency ${def_id} is still CITED with response_due_date 2026-11-15"

  # =========================================================================
  # Guide section 8 - From Cross-Cutting Complexity Layers
  # Active layers (§ preamble complexity_profile.complexity_layers):
  #   optimistic_concurrency, cascading_side_effects, dual_variant_calculation,
  #   rate_threshold_triggers.
  # §1.2.1 declares two concurrency rules; abstraction-create-stale-case is claimed by
  # the validations instance stale_case_version_outranks_case_state_check_on_abstraction_create
  # above, and submission-item-add-stale-submission is claimed here.
  # =========================================================================
  - section: cross_cutting_complexity_layers
    instances:

      - name: stale_expected_submission_version_outranks_both_duplicate_and_state_refusals
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[submission-item-add-stale-submission]
          - errors[ERR_STALE_SUBMISSION_VERSION]
          - validations[priority 30 optimistic concurrency]
        distinguishing_aspect: |
          The OCC check sits at priority 30, above the state check (40) and the duplicate-case rule (61),
          so a client replaying an item add with the version it originally read gets 412 twice for two
          entirely different underlying reasons - once when the case is already on the batch, and once
          when the batch has since been transmitted. A client that re-reads the version gets the real
          business error instead, which is what makes the 412 a retry signal rather than a verdict.
        test_recipe:
          setup:
            - "Canonical fixture through QA approval, one DRAFT submission at its creation version."
          setup_api_calls:
            - call: "POST /cancer-registry/programs"
              payload: { name: "Northside Cancer Center", coc_program_id: "COC-1456N", annual_analytic_caseload: 300, reference_year: 2018, timeliness_standard_days: 180 }
              as: PlatformAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /cancer-registry/abstractors"
              payload: { program_id: "${prog_id}", name: "Dana Reyes", credential: "CTR", productivity_target_cases_per_day: 2, certification_expires_on: "2027-12-31" }
              as: RegistryManager
              captures: { abs_a_id: $.data.id }
            - call: "POST /cancer-registry/abstractors"
              payload: { program_id: "${prog_id}", name: "Priya Raman", credential: "CTR", productivity_target_cases_per_day: 2, certification_expires_on: "2027-12-31" }
              as: RegistryManager
              captures: { abs_q_id: $.data.id }
            - call: "POST /cancer-registry/casefinding-sources"
              payload: { program_id: "${prog_id}", source_type: "PATHOLOGY", expected_monthly_volume: 40 }
              as: RegistryManager
              captures: { src_id: $.data.id }
            - call: "POST /cancer-registry/casefinding-sources/${src_id}/entries"
              payload: { patient_mrn: "MRN-0001", accession_date: "2026-08-03", primary_site_code: "C50.9", histology_code: "8500/3", behavior_code: "MALIGNANT_3", diagnosis_date: "2026-07-01", first_contact_date: "2026-07-05", diagnosed_at_facility: true, first_treatment_at_facility: true }
              as: RegistryManager
              captures: { entry_id: $.data.id }
            - call: "POST /cancer-registry/casefinding-entries/${entry_id}/reportability-decision"
              payload: { decision: "REPORTABLE", decision_reason_code: "SEER_REPORTABLE_BEHAVIOR" }
              as: RegistryManager
              captures: { case_id: $.data.created_case_id }
            - call: "POST /cancer-registry/cases/${case_id}/assign"
              payload: { abstractor_id: "${abs_a_id}" }
              as: RegistryManager
              captures: { case_v: $.data.version }
            - call: "POST /cancer-registry/abstractions"
              payload: { case_id: "${case_id}", abstractor_id: "${abs_a_id}", expected_case_version: "${case_v}", stage_source: "PATHOLOGIC", t_category: "T2", n_category: "N0", m_category: "M0", stage_group: "STAGE_II", first_treatment_date: "2026-07-10", treatment_modalities: ["SURGERY"], diagnostic_confirmation_code: "POSITIVE_HISTOLOGY", outcome_status: "ALIVE_NO_EVIDENCE", last_contact_date: "2026-07-20" }
              as: RegistryAbstractor
              as_user_id: "${abs_a_id}"
              captures: { abst_id: $.data.id }
            - call: "POST /cancer-registry/abstractions/${abst_id}/submit-qa"
              payload: {}
              as: RegistryAbstractor
              as_user_id: "${abs_a_id}"
            - call: "POST /cancer-registry/abstractions/${abst_id}/qa-decision"
              payload: { verdict: "APPROVED" }
              as: QaReviewer
              as_user_id: "${abs_q_id}"
            - call: "POST /cancer-registry/submissions"
              payload: { program_id: "${prog_id}", period_start: "2026-07-01", period_end: "2026-07-31", deadline_date: "2026-12-31" }
              as: RegistryManager
              captures: { sub_id: $.data.id, sub_v0: $.data.version }
          trigger:
            - call: "POST /cancer-registry/submissions/${sub_id}/items"
              payload: { case_id: "${case_id}", expected_submission_version: "${sub_v0}" }
              as: RegistryManager
              captures: { item_id: $.data.id }
            - call: "POST /cancer-registry/submissions/${sub_id}/items"
              payload: { case_id: "${case_id}", expected_submission_version: "${sub_v0}" }
              as: RegistryManager
              captures: { e1: $.data.error_id }
            - call: "GET /cancer-registry/submissions/${sub_id}"
              payload: {}
              as: RegistryManager
              captures: { sub_v1: $.data.version }
            - call: "POST /cancer-registry/submissions/${sub_id}/transmit"
              payload: { transmit_note: "July 2026 batch" }
              as: RegistryManager
              captures: { sub_v2: $.data.version }
            - call: "POST /cancer-registry/submissions/${sub_id}/items"
              payload: { case_id: "${case_id}", expected_submission_version: "${sub_v1}" }
              as: RegistryManager
              captures: { e2: $.data.error_id }
          assert:
            - "the first add returns HTTP 201, total_case_count == 1 and the submission version advances by exactly 1 to ${sub_v1}"
            - "the replay with ${sub_v0} returns HTTP 412 with data.error_id == ERR_STALE_SUBMISSION_VERSION - NOT ERR_CASE_ALREADY_IN_SUBMISSION (priority 30 beats 61) - and total_case_count stays 1 with the version unchanged"
            - "transmit advances the version by exactly 1 to ${sub_v2} and sets submission_state TRANSMITTED"
            - "the add with the now-stale ${sub_v1} returns HTTP 412 ERR_STALE_SUBMISSION_VERSION - NOT ERR_SUBMISSION_NOT_DRAFT (priority 30 beats 40)"
            - "GET /cancer-registry/submission-items?submission_id=${sub_id} still reports total_count == 1 with item ${item_id} at edit_status PENDING"

      - name: entity_version_advances_once_per_successful_write_and_never_on_a_read_or_refusal
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[abstraction-create-stale-case]
          - entities.TumorCase.version
          - state_machines.TumorCase.case_state
        distinguishing_aspect: |
          The case version is the OCC token for abstraction creation, so its movement has to be exactly
          one step per successful mutation and zero steps for reads and for rejected writes - otherwise
          a client that retries after a legitimate 409 would be handed a spurious 412 on the next
          attempt.
        test_recipe:
          setup:
            - "One IDENTIFIED case with one ACTIVE CTR registrar and a QA reviewer."
          setup_api_calls:
            - call: "POST /cancer-registry/programs"
              payload: { name: "Northside Cancer Center", coc_program_id: "COC-1456N", annual_analytic_caseload: 300, reference_year: 2018, timeliness_standard_days: 180 }
              as: PlatformAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /cancer-registry/abstractors"
              payload: { program_id: "${prog_id}", name: "Dana Reyes", credential: "CTR", productivity_target_cases_per_day: 2, certification_expires_on: "2027-12-31" }
              as: RegistryManager
              captures: { abs_a_id: $.data.id }
            - call: "POST /cancer-registry/abstractors"
              payload: { program_id: "${prog_id}", name: "Priya Raman", credential: "CTR", productivity_target_cases_per_day: 2, certification_expires_on: "2027-12-31" }
              as: RegistryManager
              captures: { abs_q_id: $.data.id }
            - call: "POST /cancer-registry/casefinding-sources"
              payload: { program_id: "${prog_id}", source_type: "PATHOLOGY", expected_monthly_volume: 40 }
              as: RegistryManager
              captures: { src_id: $.data.id }
            - call: "POST /cancer-registry/casefinding-sources/${src_id}/entries"
              payload: { patient_mrn: "MRN-0001", accession_date: "2026-08-03", primary_site_code: "C50.9", histology_code: "8500/3", behavior_code: "MALIGNANT_3", diagnosis_date: "2026-07-01", first_contact_date: "2026-07-05", diagnosed_at_facility: true, first_treatment_at_facility: true }
              as: RegistryManager
              captures: { entry_id: $.data.id }
            - call: "POST /cancer-registry/casefinding-entries/${entry_id}/reportability-decision"
              payload: { decision: "REPORTABLE", decision_reason_code: "SEER_REPORTABLE_BEHAVIOR" }
              as: RegistryManager
              captures: { case_id: $.data.created_case_id }
          trigger:
            - call: "GET /cancer-registry/cases/${case_id}"
              payload: {}
              as: RegistryManager
              captures: { v_created: $.data.version }
            - call: "GET /cancer-registry/cases/${case_id}"
              payload: {}
              as: RegistryManager
            - call: "POST /cancer-registry/cases/${case_id}/assign"
              payload: { abstractor_id: "${abs_a_id}" }
              as: RegistryManager
              captures: { v_assigned: $.data.version }
            - call: "POST /cancer-registry/abstractions"
              payload: { case_id: "${case_id}", abstractor_id: "${abs_a_id}", expected_case_version: "${v_created}", stage_source: "PATHOLOGIC" }
              as: RegistryAbstractor
              as_user_id: "${abs_a_id}"
              captures: { e1: $.data.error_id }
            - call: "POST /cancer-registry/abstractions"
              payload: { case_id: "${case_id}", abstractor_id: "${abs_a_id}", expected_case_version: "${v_assigned}", stage_source: "PATHOLOGIC", t_category: "T2", n_category: "N0", m_category: "M0", stage_group: "STAGE_II", first_treatment_date: "2026-07-10", treatment_modalities: ["SURGERY"], diagnostic_confirmation_code: "POSITIVE_HISTOLOGY", outcome_status: "ALIVE_NO_EVIDENCE", last_contact_date: "2026-07-20" }
              as: RegistryAbstractor
              as_user_id: "${abs_a_id}"
              captures: { abst_id: $.data.id }
            - call: "POST /cancer-registry/abstractions/${abst_id}/submit-qa"
              payload: {}
              as: RegistryAbstractor
              as_user_id: "${abs_a_id}"
            - call: "GET /cancer-registry/cases/${case_id}"
              payload: {}
              as: RegistryManager
              captures: { v_qa: $.data.version }
          assert:
            - "the two consecutive reads return the identical version ${v_created} - a read never advances it"
            - "assign advances it by exactly 1: ${v_assigned} == ${v_created} + 1"
            - "the abstraction create with the pre-assign version returns HTTP 412 with data.error_id == ERR_STALE_CASE_VERSION, and a re-read still shows ${v_assigned} - the refused write did not advance it"
            - "the create with ${v_assigned} returns HTTP 201, moving the case to IN_ABSTRACTION and advancing the version by exactly 1"
            - "submit-qa advances it by exactly 1 again, so ${v_qa} == ${v_created} + 3 with case_state QA_PENDING"

      - name: third_consecutive_failed_audit_trips_the_suspension_threshold_and_releases_the_workload
        claim_type: rate_threshold_triggers
        grounds:
          - calculations.audit_weighted_error_score
          - calculations.abstractor_quality_score
          - state_machines.QaAudit.audit_state
        distinguishing_aspect: |
          audit_fail_streak is a cumulative counter with an instantaneous consequence at exactly
          AUDIT_FAIL_STREAK_SUSPEND (3): the boundary must be silent at two failures and must, on the
          third, suspend the registrar AND release every open case in one step. Each audit is 3 weighted
          points (one major) - deliberately one point past the PASS boundary of 2 - so the streak never
          resets, and the two quality variants diverge (92.5 weighted vs 97.5 unweighted) on identical
          inputs.
        test_recipe:
          setup:
            - "Registrar A has one APPROVED abstraction (case_1 COMPLETED) plus a second, still ASSIGNED case_2; reviewer Q audits the approved abstraction three times over three disjoint windows."
          setup_api_calls:
            - call: "POST /cancer-registry/programs"
              payload: { name: "Northside Cancer Center", coc_program_id: "COC-1456N", annual_analytic_caseload: 300, reference_year: 2018, timeliness_standard_days: 180 }
              as: PlatformAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /cancer-registry/abstractors"
              payload: { program_id: "${prog_id}", name: "Dana Reyes", credential: "CTR", productivity_target_cases_per_day: 2, certification_expires_on: "2027-12-31" }
              as: RegistryManager
              captures: { abs_a_id: $.data.id }
            - call: "POST /cancer-registry/abstractors"
              payload: { program_id: "${prog_id}", name: "Priya Raman", credential: "CTR", productivity_target_cases_per_day: 2, certification_expires_on: "2027-12-31" }
              as: RegistryManager
              captures: { abs_q_id: $.data.id }
            - call: "POST /cancer-registry/casefinding-sources"
              payload: { program_id: "${prog_id}", source_type: "PATHOLOGY", expected_monthly_volume: 40 }
              as: RegistryManager
              captures: { src_id: $.data.id }
            - call: "POST /cancer-registry/casefinding-sources/${src_id}/entries"
              payload: { patient_mrn: "MRN-0001", accession_date: "2026-08-03", primary_site_code: "C50.9", histology_code: "8500/3", behavior_code: "MALIGNANT_3", diagnosis_date: "2026-07-01", first_contact_date: "2026-07-05", diagnosed_at_facility: true, first_treatment_at_facility: true }
              as: RegistryManager
              captures: { entry_1: $.data.id }
            - call: "POST /cancer-registry/casefinding-sources/${src_id}/entries"
              payload: { patient_mrn: "MRN-0002", accession_date: "2026-08-03", primary_site_code: "C50.9", histology_code: "8500/3", behavior_code: "MALIGNANT_3", diagnosis_date: "2026-07-01", first_contact_date: "2026-07-05", diagnosed_at_facility: true, first_treatment_at_facility: true }
              as: RegistryManager
              captures: { entry_2: $.data.id }
            - call: "POST /cancer-registry/casefinding-entries/${entry_1}/reportability-decision"
              payload: { decision: "REPORTABLE", decision_reason_code: "SEER_REPORTABLE_BEHAVIOR" }
              as: RegistryManager
              captures: { case_1: $.data.created_case_id }
            - call: "POST /cancer-registry/casefinding-entries/${entry_2}/reportability-decision"
              payload: { decision: "REPORTABLE", decision_reason_code: "SEER_REPORTABLE_BEHAVIOR" }
              as: RegistryManager
              captures: { case_2: $.data.created_case_id }
            - call: "POST /cancer-registry/cases/${case_1}/assign"
              payload: { abstractor_id: "${abs_a_id}" }
              as: RegistryManager
              captures: { case_1_v: $.data.version }
            - call: "POST /cancer-registry/abstractions"
              payload: { case_id: "${case_1}", abstractor_id: "${abs_a_id}", expected_case_version: "${case_1_v}", stage_source: "PATHOLOGIC", t_category: "T2", n_category: "N0", m_category: "M0", stage_group: "STAGE_II", first_treatment_date: "2026-07-10", treatment_modalities: ["SURGERY"], diagnostic_confirmation_code: "POSITIVE_HISTOLOGY", outcome_status: "ALIVE_NO_EVIDENCE", last_contact_date: "2026-07-20" }
              as: RegistryAbstractor
              as_user_id: "${abs_a_id}"
              captures: { abst_1: $.data.id }
            - call: "POST /cancer-registry/abstractions/${abst_1}/submit-qa"
              payload: {}
              as: RegistryAbstractor
              as_user_id: "${abs_a_id}"
            - call: "POST /cancer-registry/abstractions/${abst_1}/qa-decision"
              payload: { verdict: "APPROVED" }
              as: QaReviewer
              as_user_id: "${abs_q_id}"
            - call: "POST /cancer-registry/cases/${case_2}/assign"
              payload: { abstractor_id: "${abs_a_id}" }
              as: RegistryManager
            - call: "POST /cancer-registry/qa-audits"
              payload: { abstraction_id: "${abst_1}", auditor_id: "${abs_q_id}", audit_type: "ROUTINE_10PCT", window_start: "2026-08-01", window_end: "2026-08-05" }
              as: QaReviewer
              as_user_id: "${abs_q_id}"
              captures: { audit_1: $.data.id }
            - call: "POST /cancer-registry/qa-audits"
              payload: { abstraction_id: "${abst_1}", auditor_id: "${abs_q_id}", audit_type: "ROUTINE_10PCT", window_start: "2026-08-06", window_end: "2026-08-10" }
              as: QaReviewer
              as_user_id: "${abs_q_id}"
              captures: { audit_2: $.data.id }
            - call: "POST /cancer-registry/qa-audits"
              payload: { abstraction_id: "${abst_1}", auditor_id: "${abs_q_id}", audit_type: "ROUTINE_10PCT", window_start: "2026-08-11", window_end: "2026-08-15" }
              as: QaReviewer
              as_user_id: "${abs_q_id}"
              captures: { audit_3: $.data.id }
          trigger:
            - call: "POST /cancer-registry/qa-audits/${audit_1}/score"
              payload: { audited_field_count: 40, minor_discrepancy_count: 0, major_discrepancy_count: 1, critical_discrepancy_count: 0 }
              as: QaReviewer
              as_user_id: "${abs_q_id}"
            - call: "POST /cancer-registry/qa-audits/${audit_2}/score"
              payload: { audited_field_count: 40, minor_discrepancy_count: 0, major_discrepancy_count: 1, critical_discrepancy_count: 0 }
              as: QaReviewer
              as_user_id: "${abs_q_id}"
            - call: "POST /cancer-registry/qa-audits/${audit_3}/score"
              payload: { audited_field_count: 40, minor_discrepancy_count: 0, major_discrepancy_count: 1, critical_discrepancy_count: 0 }
              as: QaReviewer
              as_user_id: "${abs_q_id}"
          assert:
            - "each audit scores weighted_error_score == 3 with verdict MINOR_FAIL and audit_state CLOSED_FAIL (3 > AUDIT_PASS_MAX_POINTS 2, and no critical discrepancy means it is not CRITICAL_FAIL)"
            - "after the second score Abstractor ${abs_a_id}.audit_fail_streak == 2 and employment_status is still ACTIVE with assigned_open_case_count == 1 (case_2) - the threshold is silent one below the cap"
            - "after the third score audit_fail_streak == 3, employment_status == SUSPENDED_FROM_ABSTRACTING and assigned_open_case_count == 0"
            - "TumorCase ${case_2} was released to case_state IDENTIFIED with assigned_abstractor_id == null, while ${case_1} stays COMPLETED (only open cases are released)"
            - "lifetime_discrepancy_points == 9, quality_score_rolling_90d == 92.5 (100 - 9/120*100) and quality_score_cumulative == 97.5 (100 - 3/120*100)"
            - "no abstraction was regressed: ${abst_1}.abstraction_state is still APPROVED and every audit has cascade_applied == false"

      - name: cascading_side_effects_depth_four_forward_chain
        claim_type: cascading_side_effects
        grounds:
          - complexity_profile.complexity_layers[cascading_side_effects]
        excluded_because:
          difficulty_instance: qa_approval_unfreezes_registry_and_releases_held_submission_depth4
          rationale: |
            The four-link chain (abstraction -> case -> program aggregates/posture -> submission HOLD
            release) is exactly what the §1.8 instance walks link by link, asserting the intermediate
            state after each hop; re-deriving it here would duplicate the same fixture and assertions.

      - name: cascading_side_effects_second_independent_depth_four_chain
        claim_type: cascading_side_effects
        grounds:
          - complexity_profile.complexity_layers[cascading_side_effects]
        excluded_because:
          difficulty_instance: deficiency_second_rejection_escalates_to_probation_and_holds_submission_depth4
          rationale: |
            The deficiency-driven chain (review -> deficiency ESCALATED -> program PROBATION -> posture
            FROZEN -> submissions HOLD) is the second cascade root and is fully claimed by that §1.8
            instance, including the ordering of the program and submission hops.

      - name: cascading_side_effects_full_compensation_without_drift
        claim_type: cascading_side_effects
        grounds:
          - complexity_profile.complexity_layers[cascading_side_effects]
        excluded_because:
          difficulty_instance: discrepancy_points_and_rework_cascade_fully_reversed_by_audit_void
          rationale: |
            Compensation is the sharpest cascade claim (every side effect of the CRITICAL_FAIL cascade
            reversed, both conserved quantities back to their pre-audit values) and the §1.8 instance
            asserts the conservation invariants directly.

      - name: dual_variant_calculation_on_follow_up_rate
        claim_type: dual_variant_calculation
        grounds:
          - calculations.follow_up_rate.variants
        excluded_because:
          difficulty_instance: follow_up_rate_coc_five_year_vs_state_central_all_years_divergence
          rationale: |
            The §1.8 instance builds the one cohort where the two denominators disagree (a DEAD patient
            and an out-of-cohort diagnosis) and asserts both stored rates plus lost_to_follow_up_pct, so
            the divergence claim is already at full strength there.

      - name: dual_variant_calculation_on_abstractor_quality_score
        claim_type: dual_variant_calculation
        grounds:
          - calculations.abstractor_quality_score.variants
        excluded_because:
          difficulty_instance: abstractor_quality_rolling_weighted_vs_cumulative_unweighted_divergence
          rationale: |
            The weighting-versus-recency divergence needs an old critical-heavy audit outside the 90-day
            window, which the §1.8 instance constructs with clock movement; the smaller divergence
            visible above (92.5 vs 97.5) is asserted as a side observation of the threshold instance.

      - name: dual_variant_calculation_on_quality_measure_rate
        claim_type: dual_variant_calculation
        grounds:
          - calculations.quality_measure_performance.variants
        excluded_because:
          difficulty_instance: quality_measure_stratified_mean_of_rounded_rates_vs_pooled_ratio
          rationale: |
            The stratified-mean versus pooled-ratio split, including which one the threshold test uses,
            is the whole subject of that §1.8 instance.

  # =========================================================================
  # Guide section 9 - From Consistency Model
  # complexity_profile.consistency_model == immediate: every derived field is
  # recomputed inside the writing request, so no read ever needs a settling delay.
  # =========================================================================
  - section: consistency_model
    instances:

      - name: every_derived_field_of_a_four_level_cascade_is_already_settled_in_the_writing_response
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - endpoints[POST /cancer-registry/abstractions/{abstractionId}/qa-decision].side_effects
        distinguishing_aspect: |
          qa-decision returns an Abstraction, but it mutates four entities: the abstraction, the case,
          the abstractor's workload and productivity, and the program's aggregates plus posture. Under an
          immediate model the reads that follow must agree with that single write with no second write
          and no delay - and, critically, reading twice must not change anything, which is what separates
          an eagerly-recomputed field from one that is lazily computed on read with a side effect.
        test_recipe:
          setup:
            - "Canonical fixture up to and including submit-qa: one QA_PENDING case, one abstractor with one open case, one QA reviewer."
          setup_api_calls:
            - call: "POST /cancer-registry/programs"
              payload: { name: "Northside Cancer Center", coc_program_id: "COC-1456N", annual_analytic_caseload: 300, reference_year: 2018, timeliness_standard_days: 180 }
              as: PlatformAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /cancer-registry/abstractors"
              payload: { program_id: "${prog_id}", name: "Dana Reyes", credential: "CTR", productivity_target_cases_per_day: 2, certification_expires_on: "2027-12-31" }
              as: RegistryManager
              captures: { abs_a_id: $.data.id }
            - call: "POST /cancer-registry/abstractors"
              payload: { program_id: "${prog_id}", name: "Priya Raman", credential: "CTR", productivity_target_cases_per_day: 2, certification_expires_on: "2027-12-31" }
              as: RegistryManager
              captures: { abs_q_id: $.data.id }
            - call: "POST /cancer-registry/casefinding-sources"
              payload: { program_id: "${prog_id}", source_type: "PATHOLOGY", expected_monthly_volume: 40 }
              as: RegistryManager
              captures: { src_id: $.data.id }
            - call: "POST /cancer-registry/casefinding-sources/${src_id}/entries"
              payload: { patient_mrn: "MRN-0001", accession_date: "2026-08-03", primary_site_code: "C50.9", histology_code: "8500/3", behavior_code: "MALIGNANT_3", diagnosis_date: "2026-07-01", first_contact_date: "2026-07-05", diagnosed_at_facility: true, first_treatment_at_facility: true }
              as: RegistryManager
              captures: { entry_id: $.data.id }
            - call: "POST /cancer-registry/casefinding-entries/${entry_id}/reportability-decision"
              payload: { decision: "REPORTABLE", decision_reason_code: "SEER_REPORTABLE_BEHAVIOR" }
              as: RegistryManager
              captures: { case_id: $.data.created_case_id }
            - call: "POST /cancer-registry/cases/${case_id}/assign"
              payload: { abstractor_id: "${abs_a_id}" }
              as: RegistryManager
              captures: { case_v: $.data.version }
            - call: "POST /cancer-registry/abstractions"
              payload: { case_id: "${case_id}", abstractor_id: "${abs_a_id}", expected_case_version: "${case_v}", stage_source: "PATHOLOGIC", t_category: "T2", n_category: "N0", m_category: "M0", stage_group: "STAGE_II", first_treatment_date: "2026-07-10", treatment_modalities: ["SURGERY"], diagnostic_confirmation_code: "POSITIVE_HISTOLOGY", outcome_status: "ALIVE_NO_EVIDENCE", last_contact_date: "2026-07-20" }
              as: RegistryAbstractor
              as_user_id: "${abs_a_id}"
              captures: { abst_id: $.data.id }
            - call: "POST /cancer-registry/abstractions/${abst_id}/submit-qa"
              payload: {}
              as: RegistryAbstractor
              as_user_id: "${abs_a_id}"
          trigger:
            - call: "POST /cancer-registry/abstractions/${abst_id}/qa-decision"
              payload: { verdict: "APPROVED" }
              as: QaReviewer
              as_user_id: "${abs_q_id}"
            - call: "GET /cancer-registry/cases/${case_id}"
              payload: {}
              as: QaReviewer
            - call: "GET /cancer-registry/abstractors/${abs_a_id}"
              payload: {}
              as: QaReviewer
            - call: "GET /cancer-registry/programs/${prog_id}"
              payload: {}
              as: QaReviewer
            - call: "GET /cancer-registry/programs/${prog_id}"
              payload: {}
              as: QaReviewer
          assert:
            - "the qa-decision response body itself already reports abstraction_state == APPROVED with approved_at == 2026-08-01T00:00:00Z and qa_reviewer_user_id == ${abs_q_id}"
            - "the immediately following case read - with no intervening write - shows case_state == COMPLETED with completed_on == 2026-08-01 and timeliness_status == ON_TIME (abstract_due_date is diagnosis_date + 180 days = 2026-12-28)"
            - "the abstractor read shows assigned_open_case_count == 0, completed_cases_30d == 1 and productivity_status recomputed in the same request - not on the next write"
            - "the program read shows open_backlog_count == 0, completed_case_count == 1, follow_up_rate_coc_pct == 0.0 (QA approval does not copy the abstraction's last_contact_date onto the case) and registry_posture == NORMAL"
            - "the second program read is byte-identical to the first: repeating a computed read neither drifts a value nor advances program.version"

      - name: a_computed_read_reflects_the_preceding_mutation_and_stays_stable_until_the_next_one
        claim_type: immediate
        grounds:
          - endpoints[GET /cancer-registry/programs/{programId}/compliance-summary].side_effects
          - calculations.follow_up_rate
        distinguishing_aspect: |
          compliance-summary is the one endpoint that recomputes on read, so it is where an eventual model
          would hide: the follow-up rate must jump from 0.0 to 100.0 in the very first read after the
          contact is recorded (not the second), the value must be identical when the read is repeated, and
          the recompute must not be a disguised write - the program version has to be unchanged across all
          three reads.
        test_recipe:
          setup:
            - "Canonical fixture through QA approval, so the program has exactly one COMPLETED analytic case with last_contact_date null."
          setup_api_calls:
            - call: "POST /cancer-registry/programs"
              payload: { name: "Northside Cancer Center", coc_program_id: "COC-1456N", annual_analytic_caseload: 300, reference_year: 2018, timeliness_standard_days: 180 }
              as: PlatformAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /cancer-registry/abstractors"
              payload: { program_id: "${prog_id}", name: "Dana Reyes", credential: "CTR", productivity_target_cases_per_day: 2, certification_expires_on: "2027-12-31" }
              as: RegistryManager
              captures: { abs_a_id: $.data.id }
            - call: "POST /cancer-registry/abstractors"
              payload: { program_id: "${prog_id}", name: "Priya Raman", credential: "CTR", productivity_target_cases_per_day: 2, certification_expires_on: "2027-12-31" }
              as: RegistryManager
              captures: { abs_q_id: $.data.id }
            - call: "POST /cancer-registry/casefinding-sources"
              payload: { program_id: "${prog_id}", source_type: "PATHOLOGY", expected_monthly_volume: 40 }
              as: RegistryManager
              captures: { src_id: $.data.id }
            - call: "POST /cancer-registry/casefinding-sources/${src_id}/entries"
              payload: { patient_mrn: "MRN-0001", accession_date: "2026-08-03", primary_site_code: "C50.9", histology_code: "8500/3", behavior_code: "MALIGNANT_3", diagnosis_date: "2026-07-01", first_contact_date: "2026-07-05", diagnosed_at_facility: true, first_treatment_at_facility: true }
              as: RegistryManager
              captures: { entry_id: $.data.id }
            - call: "POST /cancer-registry/casefinding-entries/${entry_id}/reportability-decision"
              payload: { decision: "REPORTABLE", decision_reason_code: "SEER_REPORTABLE_BEHAVIOR" }
              as: RegistryManager
              captures: { case_id: $.data.created_case_id }
            - call: "POST /cancer-registry/cases/${case_id}/assign"
              payload: { abstractor_id: "${abs_a_id}" }
              as: RegistryManager
              captures: { case_v: $.data.version }
            - call: "POST /cancer-registry/abstractions"
              payload: { case_id: "${case_id}", abstractor_id: "${abs_a_id}", expected_case_version: "${case_v}", stage_source: "PATHOLOGIC", t_category: "T2", n_category: "N0", m_category: "M0", stage_group: "STAGE_II", first_treatment_date: "2026-07-10", treatment_modalities: ["SURGERY"], diagnostic_confirmation_code: "POSITIVE_HISTOLOGY", outcome_status: "ALIVE_NO_EVIDENCE", last_contact_date: "2026-07-20" }
              as: RegistryAbstractor
              as_user_id: "${abs_a_id}"
              captures: { abst_id: $.data.id }
            - call: "POST /cancer-registry/abstractions/${abst_id}/submit-qa"
              payload: {}
              as: RegistryAbstractor
              as_user_id: "${abs_a_id}"
            - call: "POST /cancer-registry/abstractions/${abst_id}/qa-decision"
              payload: { verdict: "APPROVED" }
              as: QaReviewer
              as_user_id: "${abs_q_id}"
          trigger:
            - call: "GET /cancer-registry/programs/${prog_id}/compliance-summary"
              payload: {}
              as: AccreditationCoordinator
              captures: { pv_before: $.data.version }
            - call: "POST /cancer-registry/cases/${case_id}/follow-up-contacts"
              payload: { contact_date: "2026-08-01", contact_method: "CLINIC_VISIT", outcome: "CONTACT_MADE", vital_status_at_contact: "ALIVE" }
              as: RegistryManager
              captures: { contact_id: $.data.id }
            - call: "GET /cancer-registry/programs/${prog_id}/compliance-summary"
              payload: {}
              as: AccreditationCoordinator
              captures: { pv_after: $.data.version }
            - call: "GET /cancer-registry/programs/${prog_id}/compliance-summary"
              payload: { follow_up_variant: "state_central_all_years" }
              as: AccreditationCoordinator
          assert:
            - "the first summary reports follow_up_rate_coc_pct == 0.0, follow_up_rate_state_pct == 0.0 and lost_to_follow_up_pct == 100.0 (one case in the denominator, no contact yet)"
            - "the follow-up contact response already reports counts_for_follow_up == true, and the case now carries last_contact_date == 2026-08-01 with follow_up_status == CURRENT"
            - "the very next summary read - the first one after the write - reports follow_up_rate_coc_pct == 100.0, follow_up_rate_state_pct == 100.0 and lost_to_follow_up_pct == 0.0; no second read is needed for the value to settle"
            - "the variant read returns the same two rate fields (both 100.0) and reports lost_to_follow_up_pct == 0.0 from the state variant, confirming the parameter only selects the reported complement"
            - "${pv_after} == ${pv_before}: a computed read recomputes derived fields without incrementing the entity version, so it never invalidates a client's OCC token"
