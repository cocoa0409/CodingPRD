scaffold_difficulty_design:

  # =========================================================================
  # Rule 1 — dual_variant_calc
  # Two dual-variant calculations on DIFFERENT entity domains:
  #   * point_expiry_sweep  -> Member / PointLedgerEntry ledger domain
  #   * household_fraud_score -> Household risk-posture domain
  # =========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: expiry_sweep_lot_fifo_protects_the_soonest_expiring_lot
        grounds:
          - calculations.point_expiry_sweep
          - entities.Banner.fields.expiry_basis
          - state_machines.PointCycle.CLOSING_to_CLOSED
          - entities.PointLedgerEntry.fields.lot_expires_at
        distinguishing_aspect: |
          Under expiry_basis == LOT_FIFO the 300-point redemption drains the lot
          that expires 2026-09-30 first, so the September cycle close finds zero
          unconsumed expiring points and writes no EXPIRY row; the member keeps
          300 points. This is the ledger domain (Member points), not the risk
          domain exercised by the second instance of this rule.
        test_recipe:
          setup:
            - "Banner B_FIFO with expiry_basis LOT_FIFO and rollover_cap_points 0."
            - "Point cycles 2026-08 (CLOSED), 2026-09 (OPEN), 2026-10 (OPEN) on B_FIFO."
            - "Member M1 holds two 300-point ACCRUAL lots: lot A dated 2026-09-30T23:59:59.999Z (earned in August) and lot B dated 2026-10-31T23:59:59.999Z (earned in September), plus one 300-point REDEMPTION debit."
            - "Logical clock at 2026-10-01T00:00:00Z, past the September cycle's closes_at."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T10:00:00Z" }
              as: ProgramAdmin
            - call: "POST /banners"
              payload: { banner_code: "FIFO", name: "FIFO Banner", expiry_basis: "LOT_FIFO", rollover_cap_points: 0 }
              as: ProgramAdmin
              captures: { b_id: $.data.id }
            - call: "POST /point-cycles"
              payload: { banner_id: "${b_id}", cycle_month: "2026-08", opens_at: "2026-08-01T00:00:00Z", closes_at: "2026-08-31T23:59:59.999Z" }
              as: ProgramAdmin
              captures: { c_aug_id: $.data.id }
            - call: "POST /point-cycles"
              payload: { banner_id: "${b_id}", cycle_month: "2026-09", opens_at: "2026-09-01T00:00:00Z", closes_at: "2026-09-30T23:59:59.999Z" }
              as: ProgramAdmin
              captures: { c_sep_id: $.data.id }
            - call: "POST /point-cycles"
              payload: { banner_id: "${b_id}", cycle_month: "2026-10", opens_at: "2026-10-01T00:00:00Z", closes_at: "2026-10-31T23:59:59.999Z" }
              as: ProgramAdmin
              captures: { c_oct_id: $.data.id }
            - call: "POST /sites"
              payload: { banner_id: "${b_id}", site_number: "G-001", site_type: "GROCERY" }
              as: ProgramAdmin
              captures: { g1_id: $.data.id }
            - call: "POST /sites"
              payload: { banner_id: "${b_id}", site_number: "F-001", site_type: "OWNED_FUEL_CENTER" }
              as: ProgramAdmin
              captures: { f1_id: $.data.id }
            - call: "POST /members"
              payload: { banner_id: "${b_id}", alt_id: "5550000001", card_number: "4000000000000001", full_name: "Ada Fifo" }
              as: ProgramAdmin
              captures: { m1_id: $.data.id }
            - call: "POST /purchase-transactions"
              payload: { member_id: "${m1_id}", site_id: "${g1_id}", transacted_at: "2026-08-05T10:00:00Z", lines: [{ category: "GROCERY", amount_cents: 30000, quantity: 1 }] }
              as: StoreOperator
              as_user_id: "${g1_id}"
              captures: { t_a_id: $.data.id }
            - call: "POST /purchase-transactions/${t_a_id}/post"
              payload: {}
              as: StoreOperator
              as_user_id: "${g1_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /point-cycles/${c_aug_id}/begin-close"
              payload: {}
              as: LoyaltySupervisor
            - call: "POST /point-cycles/${c_aug_id}/close"
              payload: {}
              as: LoyaltySupervisor
            - call: "POST /purchase-transactions"
              payload: { member_id: "${m1_id}", site_id: "${g1_id}", transacted_at: "2026-09-01T00:00:00Z", lines: [{ category: "GROCERY", amount_cents: 30000, quantity: 1 }] }
              as: StoreOperator
              as_user_id: "${g1_id}"
              captures: { t_b_id: $.data.id }
            - call: "POST /purchase-transactions/${t_b_id}/post"
              payload: {}
              as: StoreOperator
              as_user_id: "${g1_id}"
            - call: "GET /members/${m1_id}"
              payload: {}
              as: PumpTerminal
              as_user_id: "${f1_id}"
              captures: { mv1: $.data.version }
            - call: "POST /fuel-redemptions"
              payload: { member_id: "${m1_id}", site_id: "${f1_id}", alt_id_presented: "5550000001", points_committed: 300, expected_member_version: "${mv1}" }
              as: PumpTerminal
              as_user_id: "${f1_id}"
              captures: { r1_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "POST /point-cycles/${c_sep_id}/begin-close"
              payload: {}
              as: LoyaltySupervisor
            - call: "POST /point-cycles/${c_sep_id}/close"
              payload: {}
              as: LoyaltySupervisor
              captures: { expired_total: $.data.expired_points_total, swept: $.data.swept_member_count }
          assert:
            - "PointCycle.${c_sep_id}.status == \"CLOSED\""
            - "${expired_total} == 0"
            - "${swept} == 0"
            - "PointCycle.${c_sep_id}.rolled_over_points_total == 0"
            - "Member.${m1_id}.available_points == 300"
            - "GET /point-ledger-entries?member_id=${m1_id}&entry_type=EXPIRY returns meta total_count == 0"
            - "GET /point-ledger-entries?member_id=${m1_id}&entry_type=ROLLOVER returns meta total_count == 0"
            - "GET /point-ledger-entries?member_id=${m1_id} returns meta total_count == 3 (two ACCRUAL rows and one REDEMPTION row)"

      - name: expiry_sweep_cycle_scoped_expires_the_current_lot_in_full
        grounds:
          - calculations.point_expiry_sweep
          - entities.Banner.fields.expiry_basis
          - state_machines.PointCycle.CLOSING_to_CLOSED
          - entities.PointLedgerEntry.fields.entry_type
        distinguishing_aspect: |
          Under expiry_basis == CYCLE_SCOPED the identical 300-point redemption
          drains the lot dated 2026-10-31 first, leaving the 2026-09-30 lot fully
          unconsumed, so the September close writes an EXPIRY row of -300 and the
          member's balance falls to 0 — a 300-point divergence from the LOT_FIFO
          variant on byte-identical ledger input.
        test_recipe:
          setup:
            - "Banner B_SCOPED with expiry_basis CYCLE_SCOPED and rollover_cap_points 0."
            - "Identical cycles, sites, member and ledger history as the LOT_FIFO instance."
            - "Logical clock at 2026-10-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T10:00:00Z" }
              as: ProgramAdmin
            - call: "POST /banners"
              payload: { banner_code: "SCOPED", name: "Cycle Scoped Banner", expiry_basis: "CYCLE_SCOPED", rollover_cap_points: 0 }
              as: ProgramAdmin
              captures: { b2_id: $.data.id }
            - call: "POST /point-cycles"
              payload: { banner_id: "${b2_id}", cycle_month: "2026-08", opens_at: "2026-08-01T00:00:00Z", closes_at: "2026-08-31T23:59:59.999Z" }
              as: ProgramAdmin
              captures: { c2_aug_id: $.data.id }
            - call: "POST /point-cycles"
              payload: { banner_id: "${b2_id}", cycle_month: "2026-09", opens_at: "2026-09-01T00:00:00Z", closes_at: "2026-09-30T23:59:59.999Z" }
              as: ProgramAdmin
              captures: { c2_sep_id: $.data.id }
            - call: "POST /point-cycles"
              payload: { banner_id: "${b2_id}", cycle_month: "2026-10", opens_at: "2026-10-01T00:00:00Z", closes_at: "2026-10-31T23:59:59.999Z" }
              as: ProgramAdmin
              captures: { c2_oct_id: $.data.id }
            - call: "POST /sites"
              payload: { banner_id: "${b2_id}", site_number: "G-002", site_type: "GROCERY" }
              as: ProgramAdmin
              captures: { g2_id: $.data.id }
            - call: "POST /sites"
              payload: { banner_id: "${b2_id}", site_number: "F-002", site_type: "OWNED_FUEL_CENTER" }
              as: ProgramAdmin
              captures: { f2_id: $.data.id }
            - call: "POST /members"
              payload: { banner_id: "${b2_id}", alt_id: "5550000002", card_number: "4000000000000002", full_name: "Bo Scoped" }
              as: ProgramAdmin
              captures: { m2_id: $.data.id }
            - call: "POST /purchase-transactions"
              payload: { member_id: "${m2_id}", site_id: "${g2_id}", transacted_at: "2026-08-05T10:00:00Z", lines: [{ category: "GROCERY", amount_cents: 30000, quantity: 1 }] }
              as: StoreOperator
              as_user_id: "${g2_id}"
              captures: { t2_a_id: $.data.id }
            - call: "POST /purchase-transactions/${t2_a_id}/post"
              payload: {}
              as: StoreOperator
              as_user_id: "${g2_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /point-cycles/${c2_aug_id}/begin-close"
              payload: {}
              as: LoyaltySupervisor
            - call: "POST /point-cycles/${c2_aug_id}/close"
              payload: {}
              as: LoyaltySupervisor
            - call: "POST /purchase-transactions"
              payload: { member_id: "${m2_id}", site_id: "${g2_id}", transacted_at: "2026-09-01T00:00:00Z", lines: [{ category: "GROCERY", amount_cents: 30000, quantity: 1 }] }
              as: StoreOperator
              as_user_id: "${g2_id}"
              captures: { t2_b_id: $.data.id }
            - call: "POST /purchase-transactions/${t2_b_id}/post"
              payload: {}
              as: StoreOperator
              as_user_id: "${g2_id}"
            - call: "GET /members/${m2_id}"
              payload: {}
              as: PumpTerminal
              as_user_id: "${f2_id}"
              captures: { mv2: $.data.version }
            - call: "POST /fuel-redemptions"
              payload: { member_id: "${m2_id}", site_id: "${f2_id}", alt_id_presented: "5550000002", points_committed: 300, expected_member_version: "${mv2}" }
              as: PumpTerminal
              as_user_id: "${f2_id}"
              captures: { r2_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "POST /point-cycles/${c2_sep_id}/begin-close"
              payload: {}
              as: LoyaltySupervisor
            - call: "POST /point-cycles/${c2_sep_id}/close"
              payload: {}
              as: LoyaltySupervisor
              captures: { expired_total2: $.data.expired_points_total, swept2: $.data.swept_member_count }
          assert:
            - "${expired_total2} == 300"
            - "${swept2} == 1"
            - "PointCycle.${c2_sep_id}.rolled_over_points_total == 0"
            - "Member.${m2_id}.available_points == 0"
            - "GET /point-ledger-entries?member_id=${m2_id}&entry_type=EXPIRY returns meta total_count == 1 and data[0].points_delta == -300"
            - "GET /point-ledger-entries?member_id=${m2_id}&entry_type=ROLLOVER returns meta total_count == 0"

      - name: fraud_score_instantaneous_refreezes_household_after_ten_days
        grounds:
          - calculations.household_fraud_score
          - entities.Banner.fields.fraud_scoring_mode
          - state_machines.Household.ACTIVE_to_FROZEN
          - entities.Household.fields.fraud_score
        distinguishing_aspect: |
          Under fraud_scoring_mode == INSTANTANEOUS the two OPEN signals still
          sum to their raw 80 ten days after detection, so the next recompute
          re-freezes the household with frozen_reason AUTO_FRAUD_SCORE. This is
          the Household risk domain, a different entity domain from the ledger
          expiry sweep that carries this rule's other pair.
        test_recipe:
          setup:
            - "Banner B_INST with fraud_scoring_mode INSTANTANEOUS and freeze_threshold_score 60."
            - "Household H1 carrying two OPEN signals detected at 2026-08-01T00:00:00Z: RAPID_TRANSFER weight 35 and CROSS_BANNER_VELOCITY weight 45."
            - "H1 was auto-frozen when the second signal landed and has since been manually unfrozen, so its status is ACTIVE."
            - "Logical clock advanced to 2026-08-11T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /banners"
              payload: { banner_code: "INST", name: "Instantaneous Banner", fraud_scoring_mode: "INSTANTANEOUS", freeze_threshold_score: 60 }
              as: ProgramAdmin
              captures: { b3_id: $.data.id }
            - call: "POST /households"
              payload: { banner_id: "${b3_id}", household_code: "HH-INST-1" }
              as: LoyaltyAnalyst
              captures: { h1_id: $.data.id }
            - call: "POST /fraud-signals"
              payload: { household_id: "${h1_id}", signal_type: "RAPID_TRANSFER", severity_weight: 35 }
              as: LoyaltyAnalyst
              captures: { sig1_id: $.data.id }
            - call: "POST /fraud-signals"
              payload: { household_id: "${h1_id}", signal_type: "CROSS_BANNER_VELOCITY", severity_weight: 45 }
              as: LoyaltyAnalyst
              captures: { sig2_id: $.data.id }
            - call: "POST /households/${h1_id}/unfreeze"
              payload: {}
              as: LoyaltySupervisor
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-11T00:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "POST /fraud-signals"
              payload: { household_id: "${h1_id}", signal_type: "CROSS_BANNER_VELOCITY", severity_weight: 0 }
              as: LoyaltyAnalyst
              captures: { sig3_id: $.data.id }
          assert:
            - "Household.${h1_id}.fraud_score == 80"
            - "Household.${h1_id}.status == \"FROZEN\""
            - "Household.${h1_id}.frozen_reason == \"AUTO_FRAUD_SCORE\""
            - "Household.${h1_id}.frozen_at == \"2026-08-11T00:00:00Z\""
            - "GET /households/${h1_id}/fraud-signals?status=OPEN returns meta total_count == 3"

      - name: fraud_score_trailing_weighted_decays_below_threshold_after_ten_days
        grounds:
          - calculations.household_fraud_score
          - entities.Banner.fields.fraud_scoring_mode
          - entities.Household.fields.status
        distinguishing_aspect: |
          Under fraud_scoring_mode == TRAILING_WEIGHTED the same two OPEN signals
          decay by 5% per elapsed day to a factor of 0.50 after ten days, scoring
          40 instead of 80, so the identical recompute leaves the household
          ACTIVE — a 40-point and a status-level divergence from INSTANTANEOUS on
          identical signal data and an identical clock.
        test_recipe:
          setup:
            - "Banner B_TRAIL with fraud_scoring_mode TRAILING_WEIGHTED and freeze_threshold_score 60."
            - "Household H2 carrying the same two OPEN signals (35 and 45) detected at 2026-08-01T00:00:00Z, auto-frozen then manually unfrozen, currently ACTIVE."
            - "Logical clock advanced to 2026-08-11T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /banners"
              payload: { banner_code: "TRAIL", name: "Trailing Weighted Banner", fraud_scoring_mode: "TRAILING_WEIGHTED", freeze_threshold_score: 60 }
              as: ProgramAdmin
              captures: { b4_id: $.data.id }
            - call: "POST /households"
              payload: { banner_id: "${b4_id}", household_code: "HH-TRAIL-1" }
              as: LoyaltyAnalyst
              captures: { h2_id: $.data.id }
            - call: "POST /fraud-signals"
              payload: { household_id: "${h2_id}", signal_type: "RAPID_TRANSFER", severity_weight: 35 }
              as: LoyaltyAnalyst
              captures: { sig4_id: $.data.id }
            - call: "POST /fraud-signals"
              payload: { household_id: "${h2_id}", signal_type: "CROSS_BANNER_VELOCITY", severity_weight: 45 }
              as: LoyaltyAnalyst
              captures: { sig5_id: $.data.id }
            - call: "POST /households/${h2_id}/unfreeze"
              payload: {}
              as: LoyaltySupervisor
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-11T00:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "POST /fraud-signals"
              payload: { household_id: "${h2_id}", signal_type: "CROSS_BANNER_VELOCITY", severity_weight: 0 }
              as: LoyaltyAnalyst
              captures: { sig6_id: $.data.id }
          assert:
            - "Household.${h2_id}.fraud_score == 40"
            - "Household.${h2_id}.status == \"ACTIVE\""
            - "Household.${h2_id}.frozen_reason == null"
            - "Household.${h2_id}.frozen_at == null"
            - "GET /households/${h2_id}/fraud-signals?status=OPEN returns meta total_count == 3"

  # =========================================================================
  # Rule 2 — combinatorial_formula
  #   * purchase_point_accrual        -> mode (b): nested rounding, order pinned
  #   * settlement_batch_reimbursement -> mode (c): circular-looking fee,
  #                                       evaluation order pinned
  # =========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: accrual_rounds_per_line_then_sums_across_six_categories
        grounds:
          - calculations.purchase_point_accrual
          - calculations.promo_multiplier_stack
          - state_machines.PurchaseTransaction.RECORDED_NOT_ACCRUED_to_POSTED_ACCRUED
          - entities.PurchaseTransaction.fields.line_points_breakdown
        distinguishing_aspect: |
          Mode (b): two GROCERY lines land on exactly 10.5 points each, so
          rounding per line and then summing yields 226 while summing first and
          rounding once yields 225 — the scaffold pins per-line rounding, and the
          same basket also exercises the multiplier cap (GIFT_CARD
          4 x 2 == the cap 8), the stack cut by priority (P_QUINT's 5x dropped),
          the per-script pharmacy base, and a zero-earning FUEL line.
        test_recipe:
          setup:
            - "Banner B_MAIN on all defaults: base 1, gift_card_multiplier 4, pharmacy_multiplier 2, pharmacy_points_per_script 50, max_stacked_multiplier 8, max_stack_count 2."
            - "Three ACTIVE promo events over [2026-08-01T00:00:00Z, 2026-09-01T00:00:00Z): P_DOUBLE 2x [GROCERY, GIFT_CARD] priority 10, P_TRIPLE 3x [GROCERY] priority 5, P_QUINT 5x [GROCERY] priority 1."
            - "Cycles 2026-08 (OPEN) and 2026-09 exist; logical clock at 2026-08-05T10:00:00Z."
            - "Member M3 with zero points; a six-line RECORDED basket at grocery site G3."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T10:00:00Z" }
              as: ProgramAdmin
            - call: "POST /banners"
              payload: { banner_code: "MAIN", name: "Main Grocery Banner" }
              as: ProgramAdmin
              captures: { bm_id: $.data.id }
            - call: "POST /point-cycles"
              payload: { banner_id: "${bm_id}", cycle_month: "2026-08", opens_at: "2026-08-01T00:00:00Z", closes_at: "2026-08-31T23:59:59.999Z" }
              as: ProgramAdmin
              captures: { cm_aug_id: $.data.id }
            - call: "POST /point-cycles"
              payload: { banner_id: "${bm_id}", cycle_month: "2026-09", opens_at: "2026-09-01T00:00:00Z", closes_at: "2026-09-30T23:59:59.999Z" }
              as: ProgramAdmin
              captures: { cm_sep_id: $.data.id }
            - call: "POST /sites"
              payload: { banner_id: "${bm_id}", site_number: "G-003", site_type: "GROCERY" }
              as: ProgramAdmin
              captures: { g3_id: $.data.id }
            - call: "POST /members"
              payload: { banner_id: "${bm_id}", alt_id: "5550000003", card_number: "4000000000000003", full_name: "Cy Basket" }
              as: ProgramAdmin
              captures: { m3_id: $.data.id }
            - call: "POST /promo-events"
              payload: { banner_id: "${bm_id}", promo_code: "P_DOUBLE", multiplier: 2, applies_to_categories: ["GROCERY", "GIFT_CARD"], starts_at: "2026-08-01T00:00:00Z", ends_at: "2026-09-01T00:00:00Z", stack_priority: 10 }
              as: ProgramAdmin
              captures: { p_double_id: $.data.id }
            - call: "POST /promo-events/${p_double_id}/activate"
              payload: {}
              as: ProgramAdmin
            - call: "POST /promo-events"
              payload: { banner_id: "${bm_id}", promo_code: "P_TRIPLE", multiplier: 3, applies_to_categories: ["GROCERY"], starts_at: "2026-08-01T00:00:00Z", ends_at: "2026-09-01T00:00:00Z", stack_priority: 5 }
              as: ProgramAdmin
              captures: { p_triple_id: $.data.id }
            - call: "POST /promo-events/${p_triple_id}/activate"
              payload: {}
              as: ProgramAdmin
            - call: "POST /promo-events"
              payload: { banner_id: "${bm_id}", promo_code: "P_QUINT", multiplier: 5, applies_to_categories: ["GROCERY"], starts_at: "2026-08-01T00:00:00Z", ends_at: "2026-09-01T00:00:00Z", stack_priority: 1 }
              as: ProgramAdmin
              captures: { p_quint_id: $.data.id }
            - call: "POST /promo-events/${p_quint_id}/activate"
              payload: {}
              as: ProgramAdmin
            - call: "POST /purchase-transactions"
              payload: { member_id: "${m3_id}", site_id: "${g3_id}", transacted_at: "2026-08-05T10:00:00Z", lines: [{ category: "GROCERY", amount_cents: 1050, quantity: 1 }, { category: "GROCERY", amount_cents: 175, quantity: 1 }, { category: "GROCERY", amount_cents: 175, quantity: 1 }, { category: "GIFT_CARD", amount_cents: 512, quantity: 1 }, { category: "PHARMACY", amount_cents: 8999, quantity: 1 }, { category: "FUEL", amount_cents: 4000, quantity: 12 }] }
              as: StoreOperator
              as_user_id: "${g3_id}"
              captures: { t3_id: $.data.id }
          trigger:
            - call: "POST /purchase-transactions/${t3_id}/post"
              payload: {}
              as: StoreOperator
              as_user_id: "${g3_id}"
              captures: { gross: $.data.gross_points_awarded, breakdown: $.data.line_points_breakdown }
          assert:
            - "${gross} == 226"
            - "${gross} != 225 (225 is the sum-then-round answer the scaffold forbids)"
            - "${breakdown} == [63, 11, 11, 41, 100, 0]"
            - "PurchaseTransaction.${t3_id}.subtotal_cents == 14911"
            - "PurchaseTransaction.${t3_id}.applied_promo_event_ids == [\"${p_double_id}\", \"${p_triple_id}\"]"
