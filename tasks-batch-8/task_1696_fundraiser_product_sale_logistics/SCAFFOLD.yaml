# =============================================================================
# PRD Benchmark Seed Tables — Fundraiser Product Sale Logistics (PTO)
# =============================================================================

scenario: |
  Fundraiser Product Sale Logistics (PTO fundraising company): campaign setup &
  product catalog with profit split, student seller assignment & incentive prizes,
  order collection & family payment tracking, supplier order aggregation & delivery
  date, product sort by student & distribution day, missing/damaged product
  reconciliation, unsold/return policy, proceeds accounting to specific student groups

domain_name: fundraiser-product-sale-logistics
api_prefix: /fundraiser

# =============================================================================
# Step 0: Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: ledger_reconciliation        # provisional vs final proceeds posted to per-group ledger
  secondary_archetype: quota_allocation           # limited prize stock, case-pack rounding, surplus pool
  complexity_layers:
    - optimistic_concurrency     # OCC on Campaign/Product/SupplierOrder version
    - cascading_side_effects     # bounce -> payment status -> metrics -> prize forfeit -> promotion -> ledger
    - dual_variant_calculation   # provisional (per-line round) vs final (sum-then-round) proceeds; estimated vs actual supplier cost
    - rate_threshold_triggers    # prize tier thresholds, per-seller limits, return window
    - derived_field_reconciliation # group proceeds_balance from append-only ledger; product unit buckets
  entity_topology: flat                          # peer entities with FK links; no URL nesting except read-only sub-resource lists
  state_machine_shape: parallel                  # Order.payment_status x Order.fulfillment_status; cyclic machines on Seller/ReturnRequest/ReconciliationClaim chains; long linear Campaign chain
  relationship_patterns:
    - one_to_many
    - cross_aggregate
    - many_to_many               # Seller <-> IncentivePrize via PrizeAward
    - self_referential           # ReconciliationClaim.supersedes_claim_id appeal chain
    - polymorphic                # ProceedsLedgerEntry.reference_type + reference_id
  role_model: segregation_of_duties              # approver != reporter; refund approver != payment recorder; deliverer != acknowledger
  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Campaign
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Campaign display name" }
      - { name: school_name, type: string, source: input, description: "School / PTO organization name" }
      - { name: order_window_start, type: datetime, source: input, description: "ISO8601 UTC; order submission allowed at or after this instant" }
      - { name: order_window_end, type: datetime, source: input, description: "ISO8601 UTC; order submission allowed at or before this instant; ordering may close at or after this instant", constraints: "order_window_end > order_window_start" }
      - { name: expected_delivery_date, type: datetime, source: input, description: "ISO8601 UTC date the supplier delivery is planned for", constraints: "expected_delivery_date > order_window_end" }
      - { name: default_profit_share_bps, type: integer, source: input, description: "Default share of net line profit credited to the seller's student group, in basis points (0..10000); remainder goes to the PTO general fund", constraints: "0 <= v <= 10000" }
      - { name: status, type: enum, source: system, description: "DRAFT | OPEN | ORDERING_CLOSED | SUPPLIER_ORDERED | DELIVERED | SORTED | DISTRIBUTION_COMPLETE | RECONCILED | CLOSED | CANCELLED" }
      - { name: distribution_completed_at, type: datetime, source: system, description: "Server-stamped logical clock time when complete-distribution ran; null until then; anchors the return window" }
      - { name: gross_sales_cents, type: integer, source: computed, description: "Sum of Order.total_cents over orders with status IN {SUBMITTED, LOCKED, COMPLETED}" }
      - { name: family_credits_cents, type: integer, source: computed, description: "Sum of claim credit_cents over claims in RESOLVED_REFUND plus refund_cents over returns in {RECEIVED_RESTOCKED, RECEIVED_WRITTEN_OFF}" }
      - { name: estimated_supplier_cost_cents, type: integer, source: computed, description: "estimated_cost_cents of the campaign's non-cancelled SupplierOrder; 0 when none" }
      - { name: actual_supplier_cost_cents, type: integer, source: computed, description: "actual_cost_cents of the campaign's DELIVERED SupplierOrder; 0 until delivery" }
      - { name: general_fund_cents, type: integer, source: computed, description: "PTO remainder computed at close; null until status CLOSED" }

  - name: StudentGroup
    parent: null
    common_fields: true
    fields:
      - { name: campaign_id, type: string, source: input, description: "FK -> Campaign.id; owning campaign" }
      - { name: name, type: string, source: input, description: "Group name (classroom, team, club)", constraints: "unique per campaign_id" }
      - { name: teacher_name, type: string, source: input, description: "Optional sponsoring teacher/coach" , default: null }
      - { name: provisional_proceeds_cents, type: integer, source: computed, description: "Sum of PROVISIONAL_CREDIT minus SALE_REVERSAL_DEBIT ledger amounts for this group" }
      - { name: proceeds_balance_cents, type: integer, source: computed, description: "Signed sum of all ProceedsLedgerEntry.amount_cents for this group" }
      - { name: final_proceeds_cents, type: integer, source: computed, description: "Group's final share pinned at campaign close; null until then" }

  - name: Product
    parent: null
    common_fields: true
    fields:
      - { name: campaign_id, type: string, source: input, description: "FK -> Campaign.id; owning campaign" }
      - { name: name, type: string, source: input, description: "Product display name" }
      - { name: sku, type: string, source: input, description: "Catalog SKU", constraints: "unique per campaign_id" }
      - { name: unit_price_cents, type: integer, source: input, description: "Family-facing unit price in cents", constraints: "> 0" }
      - { name: supplier_unit_cost_cents, type: integer, source: input, description: "Estimated supplier unit cost in cents", constraints: ">= 0" }
      - { name: case_pack_size, type: integer, source: input, description: "Supplier ships whole cases of this many units", constraints: ">= 1" }
      - { name: profit_share_bps, type: integer, source: input, description: "Group share of this product's net line profit in basis points; defaults to campaign.default_profit_share_bps snapshot at creation", constraints: "0 <= v <= 10000" }
      - { name: per_seller_limit, type: integer, source: input, description: "Optional max cumulative units one seller may have across non-cancelled orders; null = unlimited", default: null }
      - { name: returnable, type: boolean, source: input, description: "Whether unsold units of this product may be returned", default: true }
      - { name: status, type: enum, source: system, description: "ACTIVE | DISCONTINUED" }
      - { name: delivered_units, type: integer, source: computed, description: "Units physically received per the DELIVERED SupplierOrderLine" }
      - { name: distributed_units, type: integer, source: computed, description: "Units currently with families: += effective qty at complete-distribution, -= qty on return receipt and post-distribution claim refund, += qty on claim replacement" }
      - { name: restocked_units, type: integer, source: computed, description: "Units returned in RESTOCKABLE disposition" }
      - { name: written_off_units, type: integer, source: computed, description: "Units returned in DAMAGED_WRITE_OFF disposition" }
      - { name: lost_units, type: integer, source: computed, description: "Units unaccounted: sort-shortage gap at ticket verify plus post-distribution refunded claim quantities" }
      - { name: surplus_units, type: integer, source: computed, description: "Unallocated pile units; invariant: delivered_units == distributed_units + restocked_units + written_off_units + surplus_units + lost_units" }

  - name: IncentivePrize
    parent: null
    common_fields: true
    fields:
      - { name: campaign_id, type: string, source: input, description: "FK -> Campaign.id; owning campaign" }
      - { name: name, type: string, source: input, description: "Prize display name" }
      - { name: tier_type, type: enum, source: input, description: "UNITS_SOLD | REVENUE_CENTS | ORDERS_COUNT — which seller metric the threshold applies to" }
      - { name: threshold_value, type: integer, source: input, description: "Seller qualifies when the tier metric >= threshold_value (inclusive boundary)", constraints: "> 0" }
      - { name: prize_cost_cents, type: integer, source: input, description: "Unit cost of the prize, charged back to the winner's group at award time", constraints: ">= 0" }
      - { name: stock_quantity, type: integer, source: input, description: "Total physical prizes available", constraints: ">= 0" }
      - { name: remaining_quantity, type: integer, source: computed, description: "stock_quantity minus count of PrizeAward in {AWARDED, FULFILLED}" }

  - name: Seller
    parent: null
    common_fields: true
    fields:
      - { name: group_id, type: string, source: input, description: "FK -> StudentGroup.id; the student group this seller's proceeds accrue to" }
      - { name: campaign_id, type: string, source: computed, description: "FK -> Campaign.id; denormalized from the group at creation, never changes" }
      - { name: display_name, type: string, source: input, description: "Student display name", constraints: "unique per group_id" }
      - { name: status, type: enum, source: system, description: "ENROLLED | ACTIVE | SUSPENDED | WITHDRAWN" }
      - { name: units_sold, type: integer, source: computed, description: "Sum of OrderLine.quantity minus returned_qty minus claim_resolved_refund_qty over lines of this seller's orders with status IN {SUBMITTED, LOCKED, COMPLETED}" }
      - { name: revenue_cents, type: integer, source: computed, description: "Sum of (amount_cents - refunded_amount_cents) over this seller's payments with status CLEARED on orders with status != CANCELLED" }
      - { name: orders_count, type: integer, source: computed, description: "Count of this seller's orders with status IN {SUBMITTED, LOCKED, COMPLETED}" }

  - name: Order
    parent: null
    common_fields: true
    fields:
      - { name: seller_id, type: string, source: input, description: "FK -> Seller.id; selling student" }
      - { name: campaign_id, type: string, source: computed, description: "FK -> Campaign.id; denormalized from seller at creation" }
      - { name: group_id, type: string, source: computed, description: "FK -> StudentGroup.id; denormalized from seller at creation; proceeds attribution never moves" }
      - { name: family_contact_name, type: string, source: input, description: "Ordering family contact" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | LOCKED | CANCELLED | COMPLETED" }
      - { name: payment_status, type: enum, source: computed, description: "UNPAID | PARTIALLY_PAID | PAID — derived from cleared payment coverage of total_cents" }
      - { name: fulfillment_status, type: enum, source: system, description: "PENDING | SORTED | DISTRIBUTED | PARTIALLY_RETURNED | RETURNED" }
      - { name: total_cents, type: integer, source: computed, description: "Sum of OrderLine.line_total_cents, computed at submit" }
      - { name: cleared_cents, type: integer, source: computed, description: "Sum of (amount_cents - refunded_amount_cents) over payments with status CLEARED" }
      - { name: provisional_credit_cents, type: integer, source: computed, description: "Provisional group proceeds posted at submit; reversed on cancel" }
      - { name: submitted_at, type: datetime, source: system, description: "Logical clock time of submit; null while DRAFT" }
      - { name: idempotency_key, type: string, source: input, description: "Optional client idempotency key, scoped to endpoint+seller" , default: null }

  - name: OrderLine
    parent: null
    common_fields: true
    fields:
      - { name: order_id, type: string, source: system, description: "FK -> Order.id; owning order" }
      - { name: product_id, type: string, source: input, description: "FK -> Product.id; ordered product" }
      - { name: quantity, type: integer, source: input, description: "Units ordered", constraints: ">= 1" }
      - { name: unit_price_cents, type: integer, source: system, description: "Product.unit_price_cents snapshot taken at order submit" }
      - { name: unit_cost_cents, type: integer, source: system, description: "Product.supplier_unit_cost_cents snapshot taken at order submit" }
      - { name: line_total_cents, type: integer, source: computed, description: "quantity * unit_price_cents, computed at submit" }
      - { name: returned_qty, type: integer, source: system, description: "Units received back via received ReturnRequests" }
      - { name: claim_resolved_refund_qty, type: integer, source: system, description: "Units compensated by refund-resolved claims" }
      - { name: sort_shortage_qty, type: integer, source: system, description: "Units shorted at sort verification allocated to this line" }

  - name: Payment
    parent: null
    common_fields: true
    fields:
      - { name: order_id, type: string, source: input, description: "FK -> Order.id; order being paid" }
      - { name: amount_cents, type: integer, source: input, description: "Payment amount in cents", constraints: "> 0" }
      - { name: method, type: enum, source: input, description: "CASH | CHECK | CARD" }
      - { name: external_ref, type: string, source: input, description: "Optional check number / card reference", default: null }
      - { name: status, type: enum, source: system, description: "RECORDED | CLEARED | BOUNCED | VOIDED | REFUNDED" }
      - { name: recorded_by_user_id, type: string, source: system, description: "X-User-ID of the Treasurer who recorded the payment" }
      - { name: refunded_amount_cents, type: integer, source: system, description: "Cumulative refunded cents against a CLEARED payment", default: 0 }
      - { name: idempotency_key, type: string, source: input, description: "Optional client idempotency key, scoped to endpoint+order", default: null }

  - name: SupplierOrder
    parent: null
    common_fields: true
    fields:
      - { name: campaign_id, type: string, source: input, description: "FK -> Campaign.id; owning campaign" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | ACKNOWLEDGED | DELIVERED | CANCELLED" }
      - { name: submitted_by_user_id, type: string, source: system, description: "X-User-ID that submitted to the supplier" }
      - { name: acknowledged_by_user_id, type: string, source: system, description: "SupplierRep X-User-ID that acknowledged" }
      - { name: delivered_by_user_id, type: string, source: system, description: "SupplierRep X-User-ID that confirmed delivery" }
      - { name: confirmed_delivery_date, type: datetime, source: system, description: "Supplier-committed delivery date from acknowledge" }
      - { name: actual_delivery_date, type: datetime, source: system, description: "Actual delivery date from deliver" }
      - { name: estimated_cost_cents, type: integer, source: computed, description: "Sum of ordered_units * unit_cost_estimated_cents, pinned at submit" }
      - { name: actual_cost_cents, type: integer, source: computed, description: "Sum of delivered_units * unit_cost_actual_cents, pinned at deliver" }
      - { name: total_ordered_units, type: integer, source: computed, description: "Sum of ordered_units across lines" }

  - name: SupplierOrderLine
    parent: null
    common_fields: true
    fields:
      - { name: supplier_order_id, type: string, source: system, description: "FK -> SupplierOrder.id; owning supplier order" }
      - { name: product_id, type: string, source: system, description: "FK -> Product.id; product being ordered" }
      - { name: requested_units, type: integer, source: system, description: "Aggregated sold units (adjustable while DRAFT via PATCH line_adjustments)", constraints: ">= 0" }
      - { name: case_pack_size, type: integer, source: system, description: "Product.case_pack_size snapshot at supplier-order creation" }
      - { name: ordered_cases, type: integer, source: computed, description: "ceil(requested_units / case_pack_size)" }
      - { name: ordered_units, type: integer, source: computed, description: "ordered_cases * case_pack_size" }
      - { name: unit_cost_estimated_cents, type: integer, source: system, description: "Product.supplier_unit_cost_cents snapshot at creation" }
      - { name: unit_cost_actual_cents, type: integer, source: system, description: "Supplier-confirmed unit cost set at acknowledge" }
      - { name: delivered_units, type: integer, source: system, description: "Units physically received, set at deliver", constraints: "0 <= v <= ordered_units" }
      - { name: shortage_units, type: integer, source: computed, description: "ordered_units - delivered_units" }

  - name: DistributionEvent
    parent: null
    common_fields: true
    fields:
      - { name: campaign_id, type: string, source: input, description: "FK -> Campaign.id; owning campaign" }
      - { name: venue, type: string, source: input, description: "Venue label; half-open occupancy windows may not overlap for the same (campaign_id, venue)" }
      - { name: window_start, type: datetime, source: input, description: "Event window start (inclusive)" }
      - { name: window_end, type: datetime, source: input, description: "Event window end (exclusive)", constraints: "window_end > window_start" }
      - { name: slot_capacity, type: integer, source: input, description: "Max number of BOOKED pickup appointments whose slots may overlap at any instant", constraints: ">= 1" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | COMPLETED | CANCELLED" }

  - name: SortTicket
    parent: null
    common_fields: true
    fields:
      - { name: campaign_id, type: string, source: system, description: "FK -> Campaign.id; denormalized at generation" }
      - { name: seller_id, type: string, source: system, description: "FK -> Seller.id; seller whose pile this ticket sorts" }
      - { name: product_id, type: string, source: system, description: "FK -> Product.id; product being sorted" }
      - { name: distribution_event_id, type: string, source: system, description: "FK -> DistributionEvent.id; earliest SCHEDULED event by (window_start ASC, created_at ASC) at generation; null when none scheduled" }
      - { name: expected_qty, type: integer, source: system, description: "Aggregated sold units for this (seller, product) at generation" }
      - { name: verified_qty, type: integer, source: system, description: "Physically counted units at verification; null until verified", constraints: "0 <= v <= expected_qty" }
      - { name: status, type: enum, source: system, description: "PENDING | VERIFIED | SHORT" }

  - name: PickupAppointment
    parent: null
    common_fields: true
    fields:
      - { name: distribution_event_id, type: string, source: input, description: "FK -> DistributionEvent.id; event hosting the pickup" }
      - { name: order_id, type: string, source: input, description: "FK -> Order.id; order being picked up" }
      - { name: slot_start, type: datetime, source: input, description: "Pickup slot start (inclusive); must satisfy event.window_start <= slot_start" }
      - { name: slot_end, type: datetime, source: input, description: "Pickup slot end (exclusive); must satisfy slot_start < slot_end <= event.window_end" }
      - { name: status, type: enum, source: system, description: "BOOKED | COMPLETED | NO_SHOW | CANCELLED" }

  - name: ReconciliationClaim
    parent: null
    common_fields: true
    fields:
      - { name: order_id, type: string, source: input, description: "FK -> Order.id; affected order" }
      - { name: order_line_id, type: string, source: input, description: "FK -> OrderLine.id; affected line (must belong to order_id)" }
      - { name: campaign_id, type: string, source: computed, description: "FK -> Campaign.id; denormalized from order" }
      - { name: claim_type, type: enum, source: input, description: "MISSING | DAMAGED" }
      - { name: quantity, type: integer, source: input, description: "Units claimed", constraints: ">= 1" }
      - { name: note, type: string, source: input, description: "Optional free-text note", default: null }
      - { name: status, type: enum, source: system, description: "SUBMITTED | APPROVED | DENIED | APPEALED | RESOLVED_REPLACEMENT | RESOLVED_REFUND" }
      - { name: reported_by_user_id, type: string, source: system, description: "X-User-ID of the GroupCoordinator who filed" }
      - { name: reviewed_by_user_id, type: string, source: system, description: "X-User-ID of the FundraiserAdmin who approved/denied" }
      - { name: resolution, type: enum, source: system, description: "REPLACEMENT | REFUND; null until resolved" }
      - { name: credit_cents, type: integer, source: computed, description: "Family refund for REFUND resolutions: quantity * line unit_price_cents" }
      - { name: supersedes_claim_id, type: string, source: system, description: "FK -> ReconciliationClaim.id; set on the successor claim created by an appeal; null otherwise" }
      - { name: auto_generated, type: boolean, source: system, description: "True when created by sort-ticket shortage verification" }

  - name: ReturnRequest
    parent: null
    common_fields: true
    fields:
      - { name: seller_id, type: string, source: input, description: "FK -> Seller.id; returning seller" }
      - { name: order_id, type: string, source: input, description: "FK -> Order.id; source order" }
      - { name: order_line_id, type: string, source: input, description: "FK -> OrderLine.id; line being returned (must belong to order_id)" }
      - { name: campaign_id, type: string, source: computed, description: "FK -> Campaign.id; denormalized from order" }
      - { name: quantity, type: integer, source: input, description: "Units returned", constraints: ">= 1" }
      - { name: reason, type: enum, source: input, description: "UNSOLD | DEFECTIVE | WRONG_ITEM | FAMILY_CHANGED_MIND" }
      - { name: status, type: enum, source: system, description: "REQUESTED | APPROVED | REJECTED | RECEIVED_RESTOCKED | RECEIVED_WRITTEN_OFF" }
      - { name: requested_by_user_id, type: string, source: system, description: "X-User-ID of the GroupCoordinator who filed" }
      - { name: decided_by_user_id, type: string, source: system, description: "X-User-ID of the Treasurer who approved/rejected" }
      - { name: refund_cents, type: integer, source: computed, description: "quantity * unit_price_cents - restocking_fee_cents, pinned at approval" }
      - { name: restocking_fee_cents, type: integer, source: computed, description: "Per-unit fee round_half_up(unit_price_cents * RESTOCK_FEE_BPS / 10000) times quantity; zero for DEFECTIVE/WRONG_ITEM" }
      - { name: resubmission_count, type: integer, source: system, description: "Number of times this request was resubmitted after rejection", default: 0 }

  - name: PrizeAward
    parent: null
    common_fields: true
    fields:
      - { name: seller_id, type: string, source: system, description: "FK -> Seller.id; winning or queued seller" }
      - { name: prize_id, type: string, source: system, description: "FK -> IncentivePrize.id; prize won" }
      - { name: campaign_id, type: string, source: system, description: "FK -> Campaign.id; denormalized" }
      - { name: status, type: enum, source: system, description: "QUEUED | AWARDED | FULFILLED | FORFEITED | EXPIRED" }
      - { name: qualifying_metric_value, type: integer, source: system, description: "Seller metric value at qualification time" }
      - { name: qualified_at, type: datetime, source: system, description: "Logical clock time the seller first met the threshold; orders the QUEUED promotion queue (qualified_at ASC, tie: seller created_at ASC)" }

  - name: ProceedsLedgerEntry
    parent: null
    common_fields: false
    fields:
      - { name: group_id, type: string, source: system, description: "FK -> StudentGroup.id; group whose balance this entry moves" }
      - { name: campaign_id, type: string, source: system, description: "FK -> Campaign.id; denormalized" }
      - { name: entry_type, type: enum, source: system, description: "PROVISIONAL_CREDIT | SALE_REVERSAL_DEBIT | BOUNCE_FEE_DEBIT | RETURN_DEBIT | CLAIM_LOSS_DEBIT | PRIZE_COST_DEBIT | PRIZE_COST_REVERSAL | FINAL_TRUE_UP_CREDIT | FINAL_TRUE_UP_DEBIT | MANUAL_ADJUSTMENT" }
      - { name: amount_cents, type: integer, source: system, description: "Signed cents: credits positive, debits negative" }
      - { name: reference_type, type: enum, source: system, description: "ORDER | PAYMENT | RETURN_REQUEST | CLAIM | PRIZE_AWARD | CAMPAIGN — polymorphic companion to reference_id" }
      - { name: reference_id, type: string, source: system, description: "Id of the referenced entity; interpretation depends on reference_type; null for MANUAL_ADJUSTMENT-free entries only when memo carries context" }
      - { name: seq, type: integer, source: system, description: "Per-group monotonic sequence starting at 1; running-balance order is (created_at ASC, seq ASC)" }
      - { name: balance_after_cents, type: integer, source: computed, description: "Group proceeds_balance_cents immediately after this entry" }
      - { name: memo, type: string, source: system, description: "Human-readable explanation" }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Campaign
    initial_state: DRAFT
    terminal_states: [CLOSED, CANCELLED]
    transitions:
      - from: DRAFT
        to: OPEN
        trigger: "POST /fundraiser/campaigns/{id}/open"
        actor: FundraiserAdmin
        preconditions:
          - "campaign.status == DRAFT (else ERR_INVALID_STATE)"
          - "at least one Product with status ACTIVE exists for the campaign (else ERR_CAMPAIGN_NOT_READY)"
          - "at least one StudentGroup exists for the campaign (else ERR_CAMPAIGN_NOT_READY)"
          - "logical now < order_window_end (else ERR_INVALID_STATE)"
        side_effects:
          - "increments Campaign.version by 1"
      - from: OPEN
        to: ORDERING_CLOSED
        trigger: "POST /fundraiser/campaigns/{id}/close-ordering"
        actor: FundraiserAdmin
        preconditions:
          - "campaign.status == OPEN (else ERR_INVALID_STATE)"
          - "logical now >= order_window_end (else ERR_ORDER_WINDOW_NOT_YET_CLOSED)"
        side_effects:
          - "every Order in DRAFT for this campaign -> CANCELLED (no ledger impact)"
          - "every Order in SUBMITTED for this campaign -> LOCKED"
          - "Seller metrics recomputed (order set changes from DRAFT removals is a no-op; LOCKED orders stay in input set)"
          - "increments Campaign.version by 1"
      - from: ORDERING_CLOSED
        to: SUPPLIER_ORDERED
        trigger: "system: automatic when a SupplierOrder for this campaign reaches ACKNOWLEDGED"
        actor: system
        preconditions:
          - "campaign.status == ORDERING_CLOSED"
          - "acknowledged SupplierOrder.campaign_id == campaign.id"
        side_effects:
          - "increments Campaign.version by 1"
      - from: SUPPLIER_ORDERED
        to: DELIVERED
        trigger: "system: automatic when the SupplierOrder reaches DELIVERED"
        actor: system
        preconditions:
          - "campaign.status == SUPPLIER_ORDERED"
        side_effects:
          - "per SupplierOrderLine: Product.delivered_units = line.delivered_units; Product.surplus_units += line.delivered_units"
          - "increments Campaign.version by 1"
      - from: DELIVERED
        to: SORTED
        trigger: "POST /fundraiser/campaigns/{id}/mark-sorted"
        actor: GroupCoordinator
        preconditions:
          - "campaign.status == DELIVERED (else ERR_INVALID_STATE)"
          - "every SortTicket of the campaign has status IN {VERIFIED, SHORT} (else ERR_UNVERIFIED_SORT_TICKETS)"
        side_effects:
          - "every non-cancelled Order with fulfillment_status == PENDING -> SORTED"
          - "increments Campaign.version by 1"
      - from: SORTED
        to: DISTRIBUTION_COMPLETE
        trigger: "POST /fundraiser/campaigns/{id}/complete-distribution"
        actor: GroupCoordinator
        preconditions:
          - "campaign.status == SORTED (else ERR_INVALID_STATE)"
          - "at least one DistributionEvent of the campaign has status COMPLETED (else ERR_INVALID_STATE)"
          - "every PickupAppointment of the campaign's events is in {COMPLETED, NO_SHOW, CANCELLED} (else ERR_OPEN_CLAIMS_OR_RETURNS)"
        side_effects:
          - "for each Order with payment_status == PAID and fulfillment_status == SORTED: fulfillment_status -> DISTRIBUTED; per line eff_qty = quantity - sort_shortage_qty - claim_resolved_refund_qty; Product.distributed_units += eff_qty; Product.surplus_units -= eff_qty"
          - "orders not PAID keep fulfillment_status == SORTED"
          - "sets distribution_completed_at = logical now"
          - "full prize evaluation sweep across all sellers of the campaign"
          - "increments Campaign.version by 1"
      - from: DISTRIBUTION_COMPLETE
        to: RECONCILED
        trigger: "POST /fundraiser/campaigns/{id}/reconcile"
        actor: FundraiserAdmin
        preconditions:
          - "campaign.status == DISTRIBUTION_COMPLETE (else ERR_INVALID_STATE)"
          - "logical now > distribution_completed_at + RETURN_WINDOW_DAYS days (else ERR_RETURN_WINDOW_NOT_ELAPSED)"
          - "no ReconciliationClaim in {SUBMITTED, APPROVED} and no ReturnRequest in {REQUESTED, APPROVED, REJECTED} for the campaign (else ERR_OPEN_CLAIMS_OR_RETURNS)"
        side_effects:
          - "increments Campaign.version by 1"
      - from: RECONCILED
        to: CLOSED
        trigger: "POST /fundraiser/campaigns/{id}/close"
        actor: Treasurer
        preconditions:
          - "campaign.status == RECONCILED (else ERR_INVALID_STATE)"
        side_effects:
          - "runs final_settlement calculation (pinned evaluation order): per-group final share, FINAL_TRUE_UP_CREDIT/DEBIT entries, general_fund_cents"
          - "every PrizeAward in QUEUED -> EXPIRED"
          - "orders with payment_status == PAID and fulfillment_status IN {DISTRIBUTED, PARTIALLY_RETURNED, RETURNED} -> COMPLETED"
          - "orders in {SUBMITTED, LOCKED} with cleared_cents == 0 -> CANCELLED with SALE_REVERSAL_DEBIT reversal"
          - "increments Campaign.version by 1"
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /fundraiser/campaigns/{id}/cancel"
        actor: FundraiserAdmin
        preconditions:
          - "no order of the campaign has cleared_cents > 0 (else ERR_CAMPAIGN_CANCEL_BLOCKED)"
        side_effects:
          - "every DRAFT/SUBMITTED Order -> CANCELLED; SUBMITTED cancellations post SALE_REVERSAL_DEBIT"
          - "RECORDED payments -> VOIDED"
      - from: OPEN
        to: CANCELLED
        trigger: "POST /fundraiser/campaigns/{id}/cancel"
        actor: FundraiserAdmin
        preconditions:
          - "no order of the campaign has cleared_cents > 0 (else ERR_CAMPAIGN_CANCEL_BLOCKED)"
        side_effects:
          - "every DRAFT/SUBMITTED Order -> CANCELLED; SUBMITTED cancellations post SALE_REVERSAL_DEBIT"
          - "RECORDED payments -> VOIDED"

  - entity: Product
    initial_state: ACTIVE
    terminal_states: [DISCONTINUED]
    transitions:
      - from: ACTIVE
        to: DISCONTINUED
        trigger: "POST /fundraiser/products/{id}/discontinue"
        actor: FundraiserAdmin
        preconditions:
          - "product.status == ACTIVE (else ERR_INVALID_STATE)"
          - "campaign.status IN {DRAFT, OPEN} (else ERR_INVALID_STATE)"
        side_effects:
          - "increments Product.version by 1"
          - "existing order lines keep their snapshots; new order submits naming this product fail with ERR_PRODUCT_NOT_ORDERABLE"

  - entity: Seller
    initial_state: ENROLLED
    terminal_states: [WITHDRAWN]
    transitions:
      - from: ENROLLED
        to: ACTIVE
        trigger: "system: automatic when the seller's first order reaches SUBMITTED"
        actor: system
        preconditions: []
        side_effects: []
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /fundraiser/sellers/{id}/suspend"
        actor: GroupCoordinator
        preconditions:
          - "seller.status == ACTIVE (else ERR_INVALID_STATE)"
        side_effects: []
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /fundraiser/sellers/{id}/reinstate"
        actor: GroupCoordinator
        preconditions:
          - "seller.status == SUSPENDED (else ERR_INVALID_STATE)"
        side_effects: []
      - from: ENROLLED
        to: WITHDRAWN
        trigger: "POST /fundraiser/sellers/{id}/withdraw"
        actor: GroupCoordinator
        preconditions:
          - "no order of the seller has cleared_cents > 0 (else ERR_ORDER_HAS_CLEARED_PAYMENTS)"
        side_effects:
          - "seller's DRAFT/SUBMITTED orders -> CANCELLED with SALE_REVERSAL_DEBIT for SUBMITTED ones"
          - "seller's PrizeAwards in {QUEUED, AWARDED} -> FORFEITED (stock restored, PRIZE_COST_REVERSAL posted for AWARDED, queue promotion runs)"
      - from: ACTIVE
        to: WITHDRAWN
        trigger: "POST /fundraiser/sellers/{id}/withdraw"
        actor: GroupCoordinator
        preconditions:
          - "no order of the seller has cleared_cents > 0 (else ERR_ORDER_HAS_CLEARED_PAYMENTS)"
        side_effects:
          - "seller's DRAFT/SUBMITTED orders -> CANCELLED with SALE_REVERSAL_DEBIT for SUBMITTED ones"
          - "seller's PrizeAwards in {QUEUED, AWARDED} -> FORFEITED (stock restored, PRIZE_COST_REVERSAL posted for AWARDED, queue promotion runs)"
      - from: SUSPENDED
        to: WITHDRAWN
        trigger: "POST /fundraiser/sellers/{id}/withdraw"
        actor: GroupCoordinator
        preconditions:
          - "no order of the seller has cleared_cents > 0 (else ERR_ORDER_HAS_CLEARED_PAYMENTS)"
        side_effects:
          - "seller's DRAFT/SUBMITTED orders -> CANCELLED with SALE_REVERSAL_DEBIT for SUBMITTED ones"
          - "seller's PrizeAwards in {QUEUED, AWARDED} -> FORFEITED (stock restored, PRIZE_COST_REVERSAL posted for AWARDED, queue promotion runs)"

  - entity: Order
    dimension: status
    initial_state: DRAFT
    terminal_states: [CANCELLED, COMPLETED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /fundraiser/orders/{id}/submit"
        actor: GroupCoordinator
        preconditions:
          - "order.status == DRAFT (else ERR_INVALID_STATE)"
          - "campaign.status == OPEN (else ERR_CAMPAIGN_NOT_OPEN)"
          - "order_window_start <= logical now <= order_window_end (else ERR_OUTSIDE_ORDER_WINDOW)"
          - "seller.status IN {ENROLLED, ACTIVE} (else ERR_SELLER_SUSPENDED)"
          - "order has >= 1 line (else ERR_VALIDATION)"
          - "every line product has status ACTIVE (else ERR_PRODUCT_NOT_ORDERABLE)"
          - "per line, cumulative quantity across this seller's non-cancelled orders for that product <= product.per_seller_limit when set (else ERR_PER_SELLER_LIMIT_EXCEEDED)"
        side_effects:
          - "snapshots unit_price_cents/unit_cost_cents onto each line; computes line_total_cents and total_cents"
          - "sets submitted_at = logical now"
          - "posts PROVISIONAL_CREDIT ProceedsLedgerEntry to seller's group (per-line round_half_up, summed per order)"
          - "seller ENROLLED -> ACTIVE"
          - "seller metrics recomputed; prize evaluation runs for this seller"
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /fundraiser/orders/{id}/cancel"
        actor: GroupCoordinator
        preconditions:
          - "order.status IN {DRAFT, SUBMITTED} (else ERR_INVALID_STATE)"
        side_effects: []
      - from: SUBMITTED
        to: CANCELLED
        trigger: "POST /fundraiser/orders/{id}/cancel"
        actor: GroupCoordinator
        preconditions:
          - "order.status IN {DRAFT, SUBMITTED} (else ERR_INVALID_STATE)"
          - "order.cleared_cents == 0 (else ERR_ORDER_HAS_CLEARED_PAYMENTS)"
          - "campaign.status IN {OPEN, ORDERING_CLOSED} (else ERR_INVALID_STATE)"
        side_effects:
          - "posts SALE_REVERSAL_DEBIT equal to order.provisional_credit_cents to the seller's group"
          - "seller metrics recomputed; prize evaluation runs (possible forfeiture and queue promotion)"
      - from: SUBMITTED
        to: LOCKED
        trigger: "system: campaign close-ordering cascade"
        actor: system
        preconditions:
          - "campaign reaches ORDERING_CLOSED"
        side_effects: []
      - from: LOCKED
        to: COMPLETED
        trigger: "system: campaign close sweep (PAID and distributed orders)"
        actor: system
        preconditions:
          - "campaign close executes; order payment_status == PAID; fulfillment_status IN {DISTRIBUTED, PARTIALLY_RETURNED, RETURNED}"
        side_effects: []
      - from: LOCKED
        to: CANCELLED
        trigger: "system: campaign close sweep cancels unpaid orders"
        actor: system
        preconditions:
          - "campaign close executes; order.cleared_cents == 0"
        side_effects:
          - "posts SALE_REVERSAL_DEBIT equal to provisional_credit_cents"

  - entity: Order
    dimension: payment_status
    initial_state: UNPAID
    terminal_states: []
    transitions:
      - from: UNPAID
        to: PARTIALLY_PAID
        trigger: "system: payment_status_derivation after payment create/clear/bounce/refund/void"
        actor: system
        preconditions: ["0 < cleared_cents < total_cents"]
        side_effects: []
      - from: UNPAID
        to: PAID
        trigger: "system: payment_status_derivation"
        actor: system
        preconditions: ["cleared_cents == total_cents and total_cents > 0"]
        side_effects: []
      - from: PARTIALLY_PAID
        to: PAID
        trigger: "system: payment_status_derivation"
        actor: system
        preconditions: ["cleared_cents == total_cents"]
        side_effects: []
      - from: PARTIALLY_PAID
        to: UNPAID
        trigger: "system: payment_status_derivation after bounce/refund of all cleared value"
        actor: system
        preconditions: ["cleared_cents == 0"]
        side_effects: []
      - from: PAID
        to: PARTIALLY_PAID
        trigger: "system: payment_status_derivation after bounce or partial refund"
        actor: system
        preconditions: ["0 < cleared_cents < total_cents"]
        side_effects:
          - "seller.revenue_cents recomputed; prize evaluation runs (possible FORFEITED and queue promotion)"
      - from: PAID
        to: UNPAID
        trigger: "system: payment_status_derivation after bounce/refund of all cleared value"
        actor: system
        preconditions: ["cleared_cents == 0"]
        side_effects:
          - "seller.revenue_cents recomputed; prize evaluation runs (possible FORFEITED and queue promotion)"

  - entity: Order
    dimension: fulfillment_status
    initial_state: PENDING
    terminal_states: [RETURNED]
    transitions:
      - from: PENDING
        to: SORTED
        trigger: "system: campaign mark-sorted cascade"
        actor: system
        preconditions: ["order not CANCELLED"]
        side_effects: []
      - from: SORTED
        to: DISTRIBUTED
        trigger: "system: campaign complete-distribution cascade (PAID orders only)"
        actor: system
        preconditions: ["order.payment_status == PAID"]
        side_effects: []
      - from: DISTRIBUTED
        to: PARTIALLY_RETURNED
        trigger: "system: return receive or post-distribution claim refund reduces held units"
        actor: system
        preconditions: ["0 < effective held qty < original qty"]
        side_effects: []
      - from: PARTIALLY_RETURNED
        to: RETURNED
        trigger: "system: cumulative returned + refunded units reach full quantity"
        actor: system
        preconditions: ["every line: returned_qty + claim_resolved_refund_qty == quantity"]
        side_effects: []
      - from: DISTRIBUTED
        to: RETURNED
        trigger: "system: cumulative returned + refunded units reach full quantity in one step"
        actor: system
        preconditions: ["every line: returned_qty + claim_resolved_refund_qty == quantity"]
        side_effects: []

  - entity: Payment
    initial_state: RECORDED
    terminal_states: [BOUNCED, VOIDED, REFUNDED]
    transitions:
      - from: RECORDED
        to: CLEARED
        trigger: "POST /fundraiser/payments/{id}/clear"
        actor: Treasurer
        preconditions:
          - "payment.status == RECORDED (else ERR_INVALID_STATE)"
        side_effects:
          - "order.cleared_cents and payment_status recomputed"
          - "seller.revenue_cents recomputed; prize evaluation runs for the seller"
      - from: RECORDED
        to: VOIDED
        trigger: "POST /fundraiser/payments/{id}/void"
        actor: Treasurer
        preconditions:
          - "payment.status == RECORDED (else ERR_INVALID_STATE)"
          - "acting X-User-ID == payment.recorded_by_user_id (else ERR_NOT_PAYMENT_RECORDER)"
        side_effects:
          - "order payment status recomputed (RECORDED payments never counted, so unchanged)"
      - from: CLEARED
        to: BOUNCED
        trigger: "POST /fundraiser/payments/{id}/bounce"
        actor: Treasurer
        preconditions:
          - "payment.status == CLEARED (else ERR_INVALID_STATE)"
          - "payment.method == CHECK (else ERR_PAYMENT_METHOD_NOT_BOUNCEABLE)"
          - "payment.refunded_amount_cents == 0 (else ERR_INVALID_STATE)"
          - "campaign.status NOT IN {CLOSED, CANCELLED} (else ERR_INVALID_STATE)"
        side_effects:
          - "posts BOUNCE_FEE_DEBIT (BOUNCE_FEE_CENTS) to the order's group"
          - "order.cleared_cents and payment_status recomputed (may regress PAID -> PARTIALLY_PAID/UNPAID)"
          - "seller.revenue_cents recomputed; prize evaluation runs (possible FORFEITED and queue promotion)"
      - from: CLEARED
        to: REFUNDED
        trigger: "POST /fundraiser/payments/{id}/refund (full remaining amount)"
        actor: Treasurer
        preconditions:
          - "payment.status == CLEARED (else ERR_INVALID_STATE)"
          - "order.status != CANCELLED (else ERR_INVALID_STATE)"
          - "acting X-User-ID != payment.recorded_by_user_id (else ERR_SEGREGATION_OF_DUTIES)"
          - "amount_cents <= amount_cents_of_payment - refunded_amount_cents (else ERR_REFUND_EXCEEDS_CLEARED)"
        side_effects:
          - "refunded_amount_cents += amount_cents; when refunded_amount_cents == payment.amount_cents, status -> REFUNDED, else stays CLEARED"
          - "order.cleared_cents and payment_status recomputed"
          - "seller.revenue_cents recomputed; prize evaluation runs (possible FORFEITED and queue promotion)"

  - entity: SupplierOrder
    initial_state: DRAFT
    terminal_states: [DELIVERED, CANCELLED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /fundraiser/supplier-orders/{id}/submit"
        actor: FundraiserAdmin
        preconditions:
          - "supplier_order.status == DRAFT (else ERR_INVALID_STATE)"
          - ">= 1 supplier order line exists (else ERR_NO_SUBMITTED_ORDERS)"
        side_effects:
          - "pins estimated_cost_cents = sum(ordered_units * unit_cost_estimated_cents)"
          - "sets submitted_by_user_id"
      - from: SUBMITTED
        to: DRAFT
        trigger: "POST /fundraiser/supplier-orders/{id}/unsubmit"
        actor: FundraiserAdmin
        preconditions:
          - "supplier_order.status == SUBMITTED (else ERR_INVALID_STATE)"
        side_effects: []
      - from: SUBMITTED
        to: ACKNOWLEDGED
        trigger: "POST /fundraiser/supplier-orders/{id}/acknowledge"
        actor: SupplierRep
        preconditions:
          - "supplier_order.status == SUBMITTED (else ERR_INVALID_STATE)"
          - "line_costs covers every line product exactly once (else ERR_VALIDATION)"
        side_effects:
          - "sets unit_cost_actual_cents per line, confirmed_delivery_date, acknowledged_by_user_id"
          - "campaign ORDERING_CLOSED -> SUPPLIER_ORDERED (auto)"
      - from: ACKNOWLEDGED
        to: DELIVERED
        trigger: "POST /fundraiser/supplier-orders/{id}/deliver"
        actor: SupplierRep
        preconditions:
          - "supplier_order.status == ACKNOWLEDGED (else ERR_INVALID_STATE)"
          - "delivered covers every line product exactly once (else ERR_VALIDATION)"
          - "each delivered_units <= ordered_units (else ERR_QUANTITY_INVALID)"
          - "acting X-User-ID != acknowledged_by_user_id (else ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "sets delivered_units, shortage_units per line; actual_delivery_date; delivered_by_user_id"
          - "pins actual_cost_cents = sum(delivered_units * unit_cost_actual_cents)"
          - "campaign SUPPLIER_ORDERED -> DELIVERED (auto) with product delivered/surplus updates"
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /fundraiser/supplier-orders/{id}/cancel"
        actor: FundraiserAdmin
        preconditions:
          - "supplier_order.status IN {DRAFT, SUBMITTED} (else ERR_INVALID_STATE)"
        side_effects: []
      - from: SUBMITTED
        to: CANCELLED
        trigger: "POST /fundraiser/supplier-orders/{id}/cancel"
        actor: FundraiserAdmin
        preconditions:
          - "supplier_order.status IN {DRAFT, SUBMITTED} (else ERR_INVALID_STATE)"
        side_effects: []

  - entity: DistributionEvent
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /fundraiser/distribution-events/{id}/complete"
        actor: GroupCoordinator
        preconditions:
          - "event.status == SCHEDULED (else ERR_INVALID_STATE)"
          - "logical now >= window_start (else ERR_EVENT_NOT_STARTED)"
        side_effects: []
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /fundraiser/distribution-events/{id}/cancel"
        actor: GroupCoordinator
        preconditions:
          - "event.status == SCHEDULED (else ERR_INVALID_STATE)"
        side_effects:
          - "BOOKED appointments of the event -> CANCELLED"

  - entity: SortTicket
    initial_state: PENDING
    terminal_states: [VERIFIED, SHORT]
    transitions:
      - from: PENDING
        to: VERIFIED
        trigger: "POST /fundraiser/sort-tickets/{id}/verify with verified_qty == expected_qty"
        actor: GroupCoordinator
        preconditions:
          - "ticket.status == PENDING (else ERR_INVALID_STATE)"
        side_effects: []
      - from: PENDING
        to: SHORT
        trigger: "POST /fundraiser/sort-tickets/{id}/verify with verified_qty < expected_qty"
        actor: GroupCoordinator
        preconditions:
          - "ticket.status == PENDING (else ERR_INVALID_STATE)"
        side_effects:
          - "gap = expected_qty - verified_qty; Product.surplus_units -= gap; Product.lost_units += gap"
          - "allocates gap to the seller's non-cancelled order lines for this product, greatest submitted_at first then greatest line quantity: OrderLine.sort_shortage_qty += gap on the selected line"
          - "auto-creates a ReconciliationClaim (claim_type MISSING, quantity = gap, auto_generated true, reported_by_user_id = verifying user) on that line"

  - entity: PickupAppointment
    initial_state: BOOKED
    terminal_states: [COMPLETED, NO_SHOW, CANCELLED]
    transitions:
      - from: BOOKED
        to: COMPLETED
        trigger: "POST /fundraiser/pickup-appointments/{id}/complete with outcome=COMPLETED"
        actor: GroupCoordinator
        preconditions:
          - "appointment.status == BOOKED (else ERR_INVALID_STATE)"
        side_effects: []
      - from: BOOKED
        to: NO_SHOW
        trigger: "POST /fundraiser/pickup-appointments/{id}/complete with outcome=NO_SHOW"
        actor: GroupCoordinator
        preconditions:
          - "appointment.status == BOOKED (else ERR_INVALID_STATE)"
        side_effects: []
      - from: BOOKED
        to: CANCELLED
        trigger: "POST /fundraiser/pickup-appointments/{id}/cancel"
        actor: GroupCoordinator
        preconditions:
          - "appointment.status == BOOKED (else ERR_INVALID_STATE)"
        side_effects: []

  - entity: ReconciliationClaim
    initial_state: SUBMITTED
    terminal_states: [DENIED, APPEALED, RESOLVED_REPLACEMENT, RESOLVED_REFUND]
    transitions:
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /fundraiser/reconciliation-claims/{id}/approve"
        actor: FundraiserAdmin
        preconditions:
          - "claim.status == SUBMITTED (else ERR_INVALID_STATE)"
          - "acting X-User-ID != claim.reported_by_user_id (else ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "sets reviewed_by_user_id"
      - from: SUBMITTED
        to: DENIED
        trigger: "POST /fundraiser/reconciliation-claims/{id}/deny"
        actor: FundraiserAdmin
        preconditions:
          - "claim.status == SUBMITTED (else ERR_INVALID_STATE)"
          - "acting X-User-ID != claim.reported_by_user_id (else ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "sets reviewed_by_user_id"
      - from: DENIED
        to: APPEALED
        trigger: "POST /fundraiser/reconciliation-claims/{id}/appeal — creates successor claim"
        actor: GroupCoordinator
        preconditions:
          - "claim.status == DENIED (else ERR_INVALID_STATE)"
          - "claim.supersedes_claim_id IS NULL — only a root claim may be appealed; one appeal per chain (else ERR_APPEAL_LIMIT_EXCEEDED)"
        side_effects:
          - "creates successor ReconciliationClaim copying order/line/type/quantity, supersedes_claim_id = this claim id, status SUBMITTED"
      - from: APPROVED
        to: RESOLVED_REPLACEMENT
        trigger: "POST /fundraiser/reconciliation-claims/{id}/resolve with resolution=REPLACEMENT"
        actor: FundraiserAdmin
        preconditions:
          - "claim.status == APPROVED (else ERR_INVALID_STATE)"
          - "order.fulfillment_status IN {DISTRIBUTED, PARTIALLY_RETURNED} (else ERR_INVALID_STATE)"
          - "Product.surplus_units >= claim.quantity (else ERR_INSUFFICIENT_SURPLUS)"
        side_effects:
          - "Product.surplus_units -= quantity; Product.lost_units += quantity when claim_type == DAMAGED (damaged unit scrapped)"
          - "seller metrics recomputed; prize evaluation runs"
      - from: APPROVED
        to: RESOLVED_REFUND
        trigger: "POST /fundraiser/reconciliation-claims/{id}/resolve with resolution=REFUND"
        actor: FundraiserAdmin
        preconditions:
          - "claim.status == APPROVED (else ERR_INVALID_STATE)"
        side_effects:
          - "credit_cents = quantity * line.unit_price_cents"
          - "OrderLine.claim_resolved_refund_qty += quantity"
          - "posts CLAIM_LOSS_DEBIT to the order's group: round_half_up(quantity * (unit_price_cents - unit_cost_cents) * profit_share_bps / 10000)"
          - "when order.fulfillment_status IN {DISTRIBUTED, PARTIALLY_RETURNED}: Product.distributed_units -= quantity and Product.lost_units += quantity (auto_generated sort claims skip this — units were already lost at verify)"
          - "order fulfillment_status recomputed; seller metrics recomputed; prize evaluation runs"

  - entity: ReturnRequest
    initial_state: REQUESTED
    terminal_states: [RECEIVED_RESTOCKED, RECEIVED_WRITTEN_OFF]
    transitions:
      - from: REQUESTED
        to: APPROVED
        trigger: "POST /fundraiser/return-requests/{id}/approve"
        actor: Treasurer
        preconditions:
          - "return.status == REQUESTED (else ERR_INVALID_STATE)"
          - "acting X-User-ID != return.requested_by_user_id (else ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "pins refund_cents and restocking_fee_cents"
          - "sets decided_by_user_id"
      - from: REQUESTED
        to: REJECTED
        trigger: "POST /fundraiser/return-requests/{id}/reject"
        actor: Treasurer
        preconditions:
          - "return.status == REQUESTED (else ERR_INVALID_STATE)"
          - "acting X-User-ID != return.requested_by_user_id (else ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "sets decided_by_user_id"
      - from: REJECTED
        to: REQUESTED
        trigger: "POST /fundraiser/return-requests/{id}/resubmit"
        actor: GroupCoordinator
        preconditions:
          - "return.status == REJECTED (else ERR_INVALID_STATE)"
          - "logical now <= distribution_completed_at + RETURN_WINDOW_DAYS days (else ERR_RETURN_WINDOW_EXPIRED)"
          - "revised quantity satisfies the same availability check as creation (else ERR_RETURN_QTY_EXCEEDS_AVAILABLE)"
        side_effects:
          - "resubmission_count += 1"
      - from: APPROVED
        to: RECEIVED_RESTOCKED
        trigger: "POST /fundraiser/return-requests/{id}/receive with disposition=RESTOCKABLE"
        actor: Treasurer
        preconditions:
          - "return.status == APPROVED (else ERR_INVALID_STATE)"
        side_effects:
          - "OrderLine.returned_qty += quantity"
          - "Product.distributed_units -= quantity; Product.restocked_units += quantity"
          - "posts RETURN_DEBIT to the group: round_half_up(quantity * (unit_price_cents - unit_cost_cents) * profit_share_bps / 10000)"
          - "order fulfillment_status recomputed; seller metrics recomputed; prize evaluation runs (possible FORFEITED and queue promotion)"
      - from: APPROVED
        to: RECEIVED_WRITTEN_OFF
        trigger: "POST /fundraiser/return-requests/{id}/receive with disposition=DAMAGED_WRITE_OFF"
        actor: Treasurer
        preconditions:
          - "return.status == APPROVED (else ERR_INVALID_STATE)"
        side_effects:
          - "OrderLine.returned_qty += quantity"
          - "Product.distributed_units -= quantity; Product.written_off_units += quantity"
          - "posts RETURN_DEBIT to the group (same formula)"
          - "order fulfillment_status recomputed; seller metrics recomputed; prize evaluation runs"

  - entity: PrizeAward
    initial_state: null
    terminal_states: [FULFILLED, FORFEITED, EXPIRED]
    transitions:
      - from: null
        to: AWARDED
        trigger: "system: prize evaluation finds seller newly qualified and remaining_quantity > 0"
        actor: system
        preconditions:
          - "seller metric >= prize.threshold_value"
          - "no award for the same (seller, prize.tier_type) in {QUEUED, AWARDED, FULFILLED}"
          - "prize.remaining_quantity > 0"
        side_effects:
          - "posts PRIZE_COST_DEBIT (prize.prize_cost_cents) to the seller's group"
      - from: null
        to: QUEUED
        trigger: "system: prize evaluation finds seller newly qualified and remaining_quantity == 0"
        actor: system
        preconditions:
          - "seller metric >= prize.threshold_value"
          - "no award for the same (seller, prize.tier_type) in {QUEUED, AWARDED, FULFILLED}"
          - "prize.remaining_quantity == 0"
        side_effects: []
      - from: QUEUED
        to: AWARDED
        trigger: "system: promotion when stock frees (forfeiture), queue ordered by (qualified_at ASC, seller created_at ASC)"
        actor: system
        preconditions:
          - "prize.remaining_quantity > 0"
          - "seller still qualifies (metric >= threshold_value)"
        side_effects:
          - "posts PRIZE_COST_DEBIT to the promoted seller's group"
      - from: AWARDED
        to: FORFEITED
        trigger: "system: seller metric drops below threshold after bounce/refund/cancel/return/claim"
        actor: system
        preconditions:
          - "seller metric < prize.threshold_value"
        side_effects:
          - "posts PRIZE_COST_REVERSAL (+prize_cost_cents) to the seller's group"
          - "promotes the head of the prize's QUEUED queue if the head still qualifies"
      - from: QUEUED
        to: FORFEITED
        trigger: "system: seller metric drops below threshold"
        actor: system
        preconditions:
          - "seller metric < prize.threshold_value"
        side_effects: []
      - from: AWARDED
        to: FULFILLED
        trigger: "POST /fundraiser/prize-awards/{id}/fulfill"
        actor: GroupCoordinator
        preconditions:
          - "award.status == AWARDED (else ERR_INVALID_STATE)"
          - "campaign.status IN {SORTED, DISTRIBUTION_COMPLETE, RECONCILED, CLOSED} (else ERR_INVALID_STATE)"
        side_effects: []
      - from: QUEUED
        to: EXPIRED
        trigger: "system: campaign close sweep"
        actor: system
        preconditions: ["campaign reaches CLOSED"]
        side_effects: []

# =============================================================================
# 1.2.1 Concurrency Rules (OCC only)
# =============================================================================
concurrency_rules:
  - rule_id: campaign-settings-stale-version
    parent_entity: Campaign
    write_endpoint: "PATCH /fundraiser/campaigns/{id}"
    occ_field: "expected_campaign_version"
    description: |
      Editing campaign settings while the campaign's version has advanced since
      the client last observed it is rejected. Two sequential settings edits are
      both legitimate under product semantics, so the stale writer is detected
      purely by the version check.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: product-catalog-stale-version
    parent_entity: Product
    write_endpoint: "PATCH /fundraiser/products/{id}"
    occ_field: "expected_product_version"
    description: |
      Editing a product's catalog fields with a stale product version is
      rejected; sequential catalog edits are both legitimate, so OCC on
      Product.version is the detection mechanism.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: supplier-order-revise-stale-version
    parent_entity: SupplierOrder
    write_endpoint: "PATCH /fundraiser/supplier-orders/{id}"
    occ_field: "expected_supplier_order_version"
    description: |
      Revising DRAFT supplier-order line quantities with a stale supplier-order
      version is rejected; two sequential revisions are both legitimate, so OCC
      on SupplierOrder.version is the detection mechanism.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: order_totals
    trigger: "order submit"
    algorithm: aggregation
    formula: |
      for each line: line_total_cents = quantity * unit_price_cents (snapshot at submit)
      order.total_cents = sum(line.line_total_cents)
    input_set: "lines of the submitting order"
    constants: {}
    precision: "integer cents; exact integer arithmetic, no rounding"

  - name: payment_status_derivation
    trigger: "after payment create, clear, bounce, refund, void"
    algorithm: aggregation
    formula: |
      cleared_cents = sum(p.amount_cents - p.refunded_amount_cents) for payments p of the order with status == CLEARED
      payment_status = UNPAID if cleared_cents == 0
                     = PAID if cleared_cents == total_cents
                     = PARTIALLY_PAID if 0 < cleared_cents < total_cents
      (cleared_cents > total_cents is impossible: overpayment rejected at record time)
    input_set: "payments of the order with status CLEARED only — RECORDED, BOUNCED, VOIDED, REFUNDED excluded"
    constants: {}
    precision: "integer cents; exact"

  - name: seller_metrics
    trigger: "after order submit/cancel, payment clear/bounce/refund, return receive, claim resolve"
    algorithm: aggregation
    formula: |
      units_sold = sum(line.quantity - line.returned_qty - line.claim_resolved_refund_qty)
                   over lines of orders with status IN {SUBMITTED, LOCKED, COMPLETED}
      revenue_cents = sum(p.amount_cents - p.refunded_amount_cents)
                      over payments with status == CLEARED on orders with status != CANCELLED
      orders_count = count(orders with status IN {SUBMITTED, LOCKED, COMPLETED})
    input_set: "seller's orders filtered by status; payments filtered by status CLEARED"
    constants: {}
    precision: "integer cents/units; exact"

  - name: provisional_proceeds_credit
    trigger: "order submit"
    algorithm: aggregation
    formula: |
      per line: line_credit = round_half_up( (line_total_cents - quantity * unit_cost_cents) * profit_share_bps / 10000 )
      order.provisional_credit_cents = sum(line_credit)
      post ONE ProceedsLedgerEntry(type=PROVISIONAL_CREDIT, amount=order.provisional_credit_cents, reference=order) to the seller's group
    input_set: "lines of the submitting order; profit_share_bps from the product (snapshotted at product creation)"
    constants: {}
    precision: "round per line to integer cents, round_half_up, then sum"
    variants:
      - name: provisional
        when: "at order submit"
        difference: "rounds each line's credit to integer cents BEFORE summing; uses order-line cost snapshot"
      - name: final
        when: "at campaign close (see final_settlement)"
        difference: "sums unrounded per-line shares across the whole group and rounds ONCE; uses supplier ACTUAL unit cost"

  - name: supplier_aggregation_case_pack
    trigger: "supplier-order create; re-run on PATCH line_adjustments while DRAFT"
    algorithm: threshold
    formula: |
      for each ACTIVE-or-DISCONTINUED product of the campaign:
        requested_units = sum(line.quantity) over order lines of orders with status IN {SUBMITTED, LOCKED}
        if requested_units == 0: omit the product from the supplier order entirely
        ordered_cases = ceil(requested_units / case_pack_size)
        ordered_units = ordered_cases * case_pack_size
    input_set: "order lines whose order status IN {SUBMITTED, LOCKED}; CANCELLED and DRAFT orders excluded"
    constants: {}
    precision: "integer units; ceiling at case-pack boundary"

  - name: supplier_cost
    trigger: "supplier-order submit (estimate) and deliver (actual)"
    algorithm: aggregation
    formula: |
      estimated_cost_cents = sum(line.ordered_units * line.unit_cost_estimated_cents)   — pinned at SUBMITTED
      actual_cost_cents    = sum(line.delivered_units * line.unit_cost_actual_cents)    — pinned at DELIVERED
    input_set: "lines of the supplier order"
    constants: {}
    precision: "integer cents; exact"
    variants:
      - name: estimated
        when: "at submit — forward-looking, catalog snapshot cost, full ordered_units"
        difference: "uses unit_cost_estimated_cents and ordered_units (case-rounded up)"
      - name: actual
        when: "at deliver — chronological actualization"
        difference: "uses unit_cost_actual_cents (supplier-confirmed at acknowledge) and delivered_units (may be short); divergence = (ordered - delivered) * actual + ordered * (actual - estimated)"

  - name: prize_tier_evaluation
    trigger: "after any seller-metrics recompute; full sweep at complete-distribution"
    algorithm: threshold
    formula: |
      metric(seller, tier_type) = units_sold | revenue_cents | orders_count per tier_type
      qualifies(seller, prize) = metric >= prize.threshold_value            (inclusive boundary)
      if qualifies and no award exists for (seller, prize.tier_type) in {QUEUED, AWARDED, FULFILLED}:
        if prize.remaining_quantity > 0: create PrizeAward AWARDED + post PRIZE_COST_DEBIT to seller's group
        else: create PrizeAward QUEUED (qualified_at = now)
      if not qualifies and award in {QUEUED, AWARDED} exists: -> FORFEITED
        AWARDED forfeiture: post PRIZE_COST_REVERSAL; then promote QUEUED head (qualified_at ASC, tie seller.created_at ASC) if still qualifying
    input_set: "prizes of the seller's campaign; one award per (seller, tier_type) — the first qualifying prize of that tier sticks until forfeited"
    constants: {}
    precision: "integer comparison; inclusive >="

  - name: return_credit
    trigger: "return-request approval (pins amounts); creation/resubmission validates window and availability"
    algorithm: constraint_propagation
    formula: |
      eligible = logical now <= campaign.distribution_completed_at + RETURN_WINDOW_DAYS  (inclusive final instant)
      available_qty = line.quantity - line.returned_qty - line.claim_resolved_refund_qty - line.sort_shortage_qty
                      - sum(qty of sibling ReturnRequests on this line in {REQUESTED, APPROVED})
      fee_per_unit = 0 if reason IN {DEFECTIVE, WRONG_ITEM}
                   else round_half_up(line.unit_price_cents * RESTOCK_FEE_BPS / 10000)
      restocking_fee_cents = fee_per_unit * quantity
      refund_cents = quantity * line.unit_price_cents - restocking_fee_cents
    input_set: "single order line; sibling non-terminal returns reserve quantity"
    constants:
      RESTOCK_FEE_BPS: 1000
      RETURN_WINDOW_DAYS: 7
    precision: "fee rounded per unit, round_half_up, then multiplied by quantity"

  - name: claim_credit
    trigger: "claim resolve"
    algorithm: aggregation
    formula: |
      REFUND: credit_cents = quantity * line.unit_price_cents
              CLAIM_LOSS_DEBIT = round_half_up(quantity * (line.unit_price_cents - line.unit_cost_cents) * profit_share_bps / 10000)
      REPLACEMENT: credit_cents = 0; no ledger entry; consumes surplus
    input_set: "single claim and its order line"
    constants: {}
    precision: "integer cents, round_half_up"

  - name: group_balance
    trigger: "on every ProceedsLedgerEntry insert"
    algorithm: chronological
    formula: |
      entries ordered by (created_at ASC, seq ASC) per group
      entry.seq = previous max seq for the group + 1 (starts at 1)
      entry.balance_after_cents = previous entry's balance_after_cents + entry.amount_cents (0 baseline)
      group.proceeds_balance_cents = balance_after_cents of the latest entry (0 when no entries)
    input_set: "all ledger entries of the group"
    constants: {}
    precision: "integer cents; exact; replay order pinned by (created_at, seq), never by id"

  - name: final_settlement
    trigger: "campaign close (from RECONCILED)"
    algorithm: waterfall_allocation
    formula: |
      PINNED EVALUATION ORDER (breaks the apparent cycle between metrics, prizes, and shares):
      (1) metrics are already final (reconcile gate guarantees no open claims/returns and expired return window)
      (2) prize sweep already applied; prize chargebacks stand as posted
      (3) per line: actual_unit_cost = SupplierOrderLine.unit_cost_actual_cents of the campaign's DELIVERED supplier order
      (4) per group G: share_unrounded = sum over lines of G's sellers' non-CANCELLED orders of
            (quantity - returned_qty - claim_resolved_refund_qty - sort_shortage_qty)
              * (unit_price_cents - actual_unit_cost) * product.profit_share_bps / 10000
          group_final = round_half_up(share_unrounded)        -- round ONCE per group
      (5) true_up = group_final - provisional_proceeds_cents(G)
          post FINAL_TRUE_UP_CREDIT if true_up > 0, FINAL_TRUE_UP_DEBIT (amount = true_up, negative) if true_up < 0; skip when 0
          group.final_proceeds_cents = group_final
      (6) total_net = sum over the same line set of effective_qty * (unit_price - actual_unit_cost)
          campaign.general_fund_cents = total_net - sum(group_final over all groups) - family_credits_cents
          (general fund absorbs the per-group rounding remainder)
    input_set: "all non-CANCELLED orders of the campaign; the DELIVERED supplier order's actual costs; ledger entries"
    constants: {}
    precision: "round once per group, round_half_up; rounding remainder assigned to the PTO general fund"
    variants:
      - name: final
        when: "at campaign close"
        difference: "sum-then-round per group with ACTUAL supplier costs — see provisional_proceeds_credit for the provisional variant"

  - name: campaign_totals
    trigger: "recomputed on every order/payment/claim/return/supplier-order mutation"
    algorithm: aggregation
    formula: |
      gross_sales_cents = sum(total_cents) over orders with status IN {SUBMITTED, LOCKED, COMPLETED}
      family_credits_cents = sum(claim.credit_cents over RESOLVED_REFUND) + sum(return.refund_cents over {RECEIVED_RESTOCKED, RECEIVED_WRITTEN_OFF})
      estimated_supplier_cost_cents / actual_supplier_cost_cents mirror the active supplier order (0 when none)
    input_set: "campaign-scoped orders, claims, returns, supplier order"
    constants: {}
    precision: "integer cents; exact"

  - name: product_unit_ledger
    trigger: "supplier deliver, sort verify, complete-distribution, claim resolve, return receive"
    algorithm: aggregation
    formula: |
      counters: delivered_units (deliver), surplus_units (deliver += delivered_units; verify SHORT -= gap;
        complete-distribution -= eff_qty; REPLACEMENT resolve -= qty; restock return unchanged),
      distributed_units (complete-distribution += eff_qty; return receive -= qty; post-distribution REFUND resolve -= qty;
        REPLACEMENT resolve unchanged — family keeps same net units),
      restocked_units / written_off_units (return receive += qty by disposition),
      lost_units (verify SHORT += gap; post-distribution REFUND resolve += qty; DAMAGED REPLACEMENT += qty)
      INVARIANT (conserved units): delivered_units == distributed_units + restocked_units + written_off_units + surplus_units + lost_units
      eff_qty(line) = quantity - sort_shortage_qty - claim_resolved_refund_qty at complete-distribution time
    input_set: "single product per campaign"
    constants: {}
    precision: "integer units; exact"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - { priority: 1, category: auth, check: "X-User-Role and X-User-ID headers present and role is a declared role", error_id: ERR_UNAUTHENTICATED, http_status: 401, applies_to: "all" }
  - { priority: 2, category: auth, check: "acting role is listed in the endpoint's roles", error_id: ERR_UNAUTHORIZED_ROLE, http_status: 403, applies_to: "all" }
  - { priority: 3, category: existence, check: "path template resources exist, validated left-to-right; per-segment error ids: ERR_CAMPAIGN_NOT_FOUND, ERR_GROUP_NOT_FOUND, ERR_PRODUCT_NOT_FOUND, ERR_PRIZE_NOT_FOUND, ERR_SELLER_NOT_FOUND, ERR_ORDER_NOT_FOUND, ERR_PAYMENT_NOT_FOUND, ERR_SUPPLIER_ORDER_NOT_FOUND, ERR_DISTRIBUTION_EVENT_NOT_FOUND, ERR_SORT_TICKET_NOT_FOUND, ERR_CLAIM_NOT_FOUND, ERR_RETURN_NOT_FOUND, ERR_APPOINTMENT_NOT_FOUND, ERR_PRIZE_AWARD_NOT_FOUND", error_id: ERR_CAMPAIGN_NOT_FOUND, http_status: 404, applies_to: "all" }
  - { priority: 4, category: existence, check: "request body schema: required fields present, types and enum members valid, integer ranges respected", error_id: ERR_VALIDATION, http_status: 400, applies_to: "all" }
  - { priority: 5, category: existence, check: "idempotency replay: same idempotency_key with a DIFFERENT payload than the original request", error_id: ERR_IDEMPOTENCY_CONFLICT, http_status: 409, applies_to: "POST /fundraiser/orders, POST /fundraiser/payments" }
  - { priority: 6, category: existence, check: "body foreign keys resolve to existing entities (product ids in lines -> ERR_PRODUCT_NOT_FOUND, group_id -> ERR_GROUP_NOT_FOUND, seller_id -> ERR_SELLER_NOT_FOUND, order_id -> ERR_ORDER_NOT_FOUND, order_line_id -> ERR_ORDER_LINE_NOT_FOUND, distribution_event_id -> ERR_DISTRIBUTION_EVENT_NOT_FOUND)", error_id: ERR_SELLER_NOT_FOUND, http_status: 404, applies_to: "all create/action endpoints (entity-specific 404 per FK)" }
  - { priority: 7, category: business_constraint, check: "OCC: expected_<parent>_version equals the parent's current version", error_id: ERR_STALE_VERSION, http_status: 412, applies_to: "PATCH /fundraiser/campaigns/{id}, PATCH /fundraiser/products/{id}, PATCH /fundraiser/supplier-orders/{id}" }
  - { priority: 8, category: state, check: "target entity — or, for creates, the related entity whose lifecycle gates creation — is in a permitting state (state-machine preconditions; claim create requires order fulfillment IN {SORTED, DISTRIBUTED, PARTIALLY_RETURNED}; return create requires campaign IN {DISTRIBUTION_COMPLETE, RECONCILED}; appointment create requires event SCHEDULED and order fulfillment SORTED; payment create requires order IN {SUBMITTED, LOCKED, COMPLETED}; event create requires campaign IN {SUPPLIER_ORDERED, DELIVERED, SORTED, DISTRIBUTION_COMPLETE, RECONCILED}; group/seller/product/prize create requires campaign DRAFT or OPEN, product create DRAFT only, order create requires campaign OPEN with ERR_CAMPAIGN_NOT_OPEN)", error_id: ERR_INVALID_STATE, http_status: 409, applies_to: "all action/transition endpoints and gated creates" }
  - { priority: 9, category: state, check: "segregation of duties: claim/return approver != reporter; payment refund actor != recorder; supplier deliverer != acknowledger", error_id: ERR_SEGREGATION_OF_DUTIES, http_status: 403, applies_to: "approve/deny/resolve/refund/deliver endpoints" }
  - { priority: 10, category: business_temporal, check: "time-window rules: order window containment (ERR_OUTSIDE_ORDER_WINDOW), close-ordering reached (ERR_ORDER_WINDOW_NOT_YET_CLOSED), return window (ERR_RETURN_WINDOW_EXPIRED, ERR_RETURN_WINDOW_NOT_ELAPSED), event started (ERR_EVENT_NOT_STARTED), appointment slot containment (ERR_APPOINTMENT_WINDOW_OUTSIDE)", error_id: ERR_OUTSIDE_ORDER_WINDOW, http_status: 422, applies_to: "submit/close-ordering/returns/events/appointments (error per rule)" }
  - { priority: 11, category: business_referential, check: "cross-entity consistency: body entities belong to the same campaign (ERR_CROSS_CAMPAIGN_REFERENCE); order_line_id belongs to order_id (ERR_ORDER_LINE_MISMATCH); seller_id matches the order's seller (ERR_CROSS_CAMPAIGN_REFERENCE)", error_id: ERR_CROSS_CAMPAIGN_REFERENCE, http_status: 422, applies_to: "orders, claims, returns, appointments" }
  - { priority: 12, category: business_constraint, check: "uniqueness (ERR_DUPLICATE_SKU, ERR_DUPLICATE_GROUP_NAME, ERR_DUPLICATE_SELLER_NAME), overlap (ERR_VENUE_OVERLAP), capacity (ERR_SLOT_CAPACITY_EXCEEDED), quantity-availability (ERR_QUANTITY_INVALID, ERR_CLAIM_QTY_EXCEEDS_AVAILABLE, ERR_RETURN_QTY_EXCEEDS_AVAILABLE, ERR_INSUFFICIENT_SURPLUS), limits (ERR_PER_SELLER_LIMIT_EXCEEDED), policy flags (ERR_PRODUCT_NOT_RETURNABLE, ERR_PRODUCT_NOT_ORDERABLE, ERR_PAYMENT_METHOD_NOT_BOUNCEABLE), gates (ERR_CAMPAIGN_HAS_ACTIVE_SUPPLIER_ORDER, ERR_NO_SUBMITTED_ORDERS, ERR_SORT_TICKETS_ALREADY_GENERATED, ERR_UNVERIFIED_SORT_TICKETS, ERR_OPEN_CLAIMS_OR_RETURNS, ERR_CAMPAIGN_CANCEL_BLOCKED, ERR_ORDER_HAS_CLEARED_PAYMENTS, ERR_APPEAL_LIMIT_EXCEEDED)", error_id: ERR_DUPLICATE_SKU, http_status: 409, applies_to: "creates and quantity-bearing actions (error per rule)" }
  - { priority: 13, category: business_fiscal, check: "money guards: overpayment, refund exceeds remaining cleared value", error_id: ERR_OVERPAYMENT, http_status: 422, applies_to: "payments create/refund" }

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- clock (test-driving) ---
  - { method: POST, path: "/fundraiser/_clock/set_current_utc", description: "Sets the logical clock. Startup default before any call is exactly 2026-08-01T00:00:00Z; the server never falls back to wall-clock time.", roles: [FundraiserAdmin], code: 200, input: [to_iso8601], output: { current_utc: string }, side_effects: [] }

  # --- campaigns ---
  - { method: POST, path: "/fundraiser/campaigns", description: "Create campaign in DRAFT", roles: [FundraiserAdmin], code: 201, input: [name, school_name, order_window_start, order_window_end, expected_delivery_date, default_profit_share_bps], output: Campaign, side_effects: [] }
  - { method: GET, path: "/fundraiser/campaigns/{id}", description: "Read campaign incl. computed totals", roles: [FundraiserAdmin, GroupCoordinator, Treasurer, SupplierRep], code: 200, input: [], output: Campaign, side_effects: [] }
  - { method: PATCH, path: "/fundraiser/campaigns/{id}", description: "Edit campaign settings (DRAFT only), OCC-guarded", roles: [FundraiserAdmin], code: 200, input: [expected_campaign_version, "name?", "school_name?", "order_window_start?", "order_window_end?", "expected_delivery_date?", "default_profit_share_bps?"], output: Campaign, side_effects: ["increments Campaign.version by 1"] }
  - { method: POST, path: "/fundraiser/campaigns/{id}/open", description: "DRAFT -> OPEN", roles: [FundraiserAdmin], code: 200, input: [], output: Campaign, side_effects: ["increments Campaign.version by 1"] }
  - { method: POST, path: "/fundraiser/campaigns/{id}/close-ordering", description: "OPEN -> ORDERING_CLOSED; cancels DRAFT orders, locks SUBMITTED", roles: [FundraiserAdmin], code: 200, input: [], output: Campaign, side_effects: ["order cascade", "increments Campaign.version by 1"] }
  - { method: POST, path: "/fundraiser/campaigns/{id}/mark-sorted", description: "DELIVERED -> SORTED; requires all sort tickets verified/short", roles: [GroupCoordinator], code: 200, input: [], output: Campaign, side_effects: ["orders PENDING -> SORTED", "increments Campaign.version by 1"] }
  - { method: POST, path: "/fundraiser/campaigns/{id}/complete-distribution", description: "SORTED -> DISTRIBUTION_COMPLETE; distributes PAID orders, prize sweep", roles: [GroupCoordinator], code: 200, input: [], output: Campaign, side_effects: ["orders SORTED -> DISTRIBUTED (PAID only)", "product unit buckets", "prize sweep", "sets distribution_completed_at", "increments Campaign.version by 1"] }
  - { method: POST, path: "/fundraiser/campaigns/{id}/reconcile", description: "DISTRIBUTION_COMPLETE -> RECONCILED; gates on closed claims/returns and elapsed return window", roles: [FundraiserAdmin], code: 200, input: [], output: Campaign, side_effects: ["increments Campaign.version by 1"] }
  - { method: POST, path: "/fundraiser/campaigns/{id}/close", description: "RECONCILED -> CLOSED; runs final settlement", roles: [Treasurer], code: 200, input: [], output: Campaign, side_effects: ["final_settlement", "prize QUEUED -> EXPIRED", "order close sweep", "increments Campaign.version by 1"] }
  - { method: POST, path: "/fundraiser/campaigns/{id}/cancel", description: "DRAFT/OPEN -> CANCELLED; blocked when cleared payments exist", roles: [FundraiserAdmin], code: 200, input: [], output: Campaign, side_effects: ["order cancel cascade", "RECORDED payments -> VOIDED"] }
  - { method: GET, path: "/fundraiser/campaigns/{id}/groups", description: "List groups of a campaign", roles: [FundraiserAdmin, GroupCoordinator, Treasurer, SupplierRep], code: 200, input: ["limit?", "offset?"], output: "StudentGroup[]", side_effects: [] }
  - { method: GET, path: "/fundraiser/campaigns/{id}/products", description: "List products of a campaign", roles: [FundraiserAdmin, GroupCoordinator, Treasurer, SupplierRep], code: 200, input: ["limit?", "offset?", "status?"], output: "Product[]", side_effects: [] }
  - { method: GET, path: "/fundraiser/campaigns/{id}/prizes", description: "List prizes of a campaign", roles: [FundraiserAdmin, GroupCoordinator, Treasurer, SupplierRep], code: 200, input: ["limit?", "offset?"], output: "IncentivePrize[]", side_effects: [] }
  - { method: GET, path: "/fundraiser/campaigns/{id}/sellers", description: "List sellers of a campaign", roles: [FundraiserAdmin, GroupCoordinator, Treasurer, SupplierRep], code: 200, input: ["limit?", "offset?", "status?"], output: "Seller[]", side_effects: [] }
  - { method: GET, path: "/fundraiser/campaigns/{id}/supplier-orders", description: "List supplier orders of a campaign", roles: [FundraiserAdmin, GroupCoordinator, Treasurer, SupplierRep], code: 200, input: ["limit?", "offset?"], output: "SupplierOrder[]", side_effects: [] }
  - { method: GET, path: "/fundraiser/campaigns/{id}/distribution-events", description: "List distribution events of a campaign", roles: [FundraiserAdmin, GroupCoordinator, Treasurer, SupplierRep], code: 200, input: ["limit?", "offset?", "status?"], output: "DistributionEvent[]", side_effects: [] }
  - { method: GET, path: "/fundraiser/campaigns/{id}/ledger", description: "All ledger entries of a campaign, ordered (created_at ASC, seq ASC)", roles: [FundraiserAdmin, Treasurer], code: 200, input: ["limit?", "offset?"], output: "ProceedsLedgerEntry[]", side_effects: [] }

  # --- groups ---
  - { method: POST, path: "/fundraiser/groups", description: "Create student group (campaign DRAFT or OPEN)", roles: [GroupCoordinator], code: 201, input: [campaign_id, name, "teacher_name?"], output: StudentGroup, side_effects: [] }
  - { method: GET, path: "/fundraiser/groups/{id}", description: "Read group incl. computed proceeds balances", roles: [FundraiserAdmin, GroupCoordinator, Treasurer, SupplierRep], code: 200, input: [], output: StudentGroup, side_effects: [] }
  - { method: GET, path: "/fundraiser/groups/{id}/sellers", description: "List sellers of a group", roles: [FundraiserAdmin, GroupCoordinator, Treasurer, SupplierRep], code: 200, input: ["limit?", "offset?"], output: "Seller[]", side_effects: [] }
  - { method: GET, path: "/fundraiser/groups/{id}/ledger", description: "Ledger entries of a group, ordered (created_at ASC, seq ASC)", roles: [FundraiserAdmin, Treasurer], code: 200, input: ["limit?", "offset?"], output: "ProceedsLedgerEntry[]", side_effects: [] }
  - { method: POST, path: "/fundraiser/groups/{id}/adjustments", description: "Post a MANUAL_ADJUSTMENT ledger entry (signed amount)", roles: [Treasurer], code: 201, input: [amount_cents, memo], output: ProceedsLedgerEntry, side_effects: ["group_balance recompute"] }

  # --- products ---
  - { method: POST, path: "/fundraiser/products", description: "Create product (campaign DRAFT only); profit_share_bps defaults to campaign default snapshot", roles: [FundraiserAdmin], code: 201, input: [campaign_id, name, sku, unit_price_cents, supplier_unit_cost_cents, case_pack_size, "profit_share_bps?", "per_seller_limit?", "returnable?"], output: Product, side_effects: [] }
  - { method: GET, path: "/fundraiser/products/{id}", description: "Read product incl. unit buckets", roles: [FundraiserAdmin, GroupCoordinator, Treasurer, SupplierRep], code: 200, input: [], output: Product, side_effects: [] }
  - { method: PATCH, path: "/fundraiser/products/{id}", description: "Edit catalog fields (campaign DRAFT or OPEN), OCC-guarded; does not retro-change submitted order snapshots", roles: [FundraiserAdmin], code: 200, input: [expected_product_version, "name?", "unit_price_cents?", "supplier_unit_cost_cents?", "profit_share_bps?", "per_seller_limit?", "returnable?"], output: Product, side_effects: ["increments Product.version by 1"] }
  - { method: POST, path: "/fundraiser/products/{id}/discontinue", description: "ACTIVE -> DISCONTINUED (campaign DRAFT or OPEN)", roles: [FundraiserAdmin], code: 200, input: [], output: Product, side_effects: ["increments Product.version by 1"] }
  - { method: GET, path: "/fundraiser/products/{id}/order-lines", description: "Order lines referencing this product", roles: [FundraiserAdmin, GroupCoordinator, Treasurer, SupplierRep], code: 200, input: ["limit?", "offset?"], output: "OrderLine[]", side_effects: [] }
  - { method: GET, path: "/fundraiser/products/{id}/supplier-order-lines", description: "Supplier order lines referencing this product", roles: [FundraiserAdmin, GroupCoordinator, Treasurer, SupplierRep], code: 200, input: ["limit?", "offset?"], output: "SupplierOrderLine[]", side_effects: [] }

  # --- prizes ---
  - { method: POST, path: "/fundraiser/prizes", description: "Create incentive prize (campaign DRAFT or OPEN)", roles: [FundraiserAdmin], code: 201, input: [campaign_id, name, tier_type, threshold_value, prize_cost_cents, stock_quantity], output: IncentivePrize, side_effects: [] }
  - { method: GET, path: "/fundraiser/prizes/{id}", description: "Read prize incl. remaining_quantity", roles: [FundraiserAdmin, GroupCoordinator, Treasurer, SupplierRep], code: 200, input: [], output: IncentivePrize, side_effects: [] }

  # --- sellers ---
  - { method: POST, path: "/fundraiser/sellers", description: "Enroll seller in a group (campaign DRAFT or OPEN)", roles: [GroupCoordinator], code: 201, input: [group_id, display_name], output: Seller, side_effects: [] }
  - { method: GET, path: "/fundraiser/sellers/{id}", description: "Read seller incl. computed metrics", roles: [FundraiserAdmin, GroupCoordinator, Treasurer, SupplierRep], code: 200, input: [], output: Seller, side_effects: [] }
  - { method: POST, path: "/fundraiser/sellers/{id}/suspend", description: "ACTIVE -> SUSPENDED", roles: [GroupCoordinator], code: 200, input: [], output: Seller, side_effects: [] }
  - { method: POST, path: "/fundraiser/sellers/{id}/reinstate", description: "SUSPENDED -> ACTIVE", roles: [GroupCoordinator], code: 200, input: [], output: Seller, side_effects: [] }
  - { method: POST, path: "/fundraiser/sellers/{id}/withdraw", description: "ENROLLED/ACTIVE/SUSPENDED -> WITHDRAWN; cancels unpaid orders, forfeits awards", roles: [GroupCoordinator], code: 200, input: [], output: Seller, side_effects: ["order cancel cascade", "prize forfeiture cascade"] }

  # --- orders ---
  - { method: POST, path: "/fundraiser/orders", description: "Create order in DRAFT with inline lines [{product_id, quantity}]", roles: [GroupCoordinator], code: 201, input: [seller_id, family_contact_name, lines, "idempotency_key?"], output: Order, side_effects: [] }
  - { method: GET, path: "/fundraiser/orders", description: "List/filter orders", roles: [FundraiserAdmin, GroupCoordinator, Treasurer, SupplierRep], code: 200, input: ["seller_id?", "campaign_id?", "group_id?", "status?", "payment_status?", "fulfillment_status?", "limit?", "offset?"], output: "Order[]", side_effects: [] }
  - { method: GET, path: "/fundraiser/orders/{id}", description: "Read order incl. computed payment fields", roles: [FundraiserAdmin, GroupCoordinator, Treasurer, SupplierRep], code: 200, input: [], output: Order, side_effects: [] }
  - { method: POST, path: "/fundraiser/orders/{id}/submit", description: "DRAFT -> SUBMITTED; snapshots prices, posts provisional credit, evaluates prizes", roles: [GroupCoordinator], code: 200, input: [], output: Order, side_effects: ["price/cost snapshot", "provisional_proceeds_credit", "seller ENROLLED -> ACTIVE", "prize evaluation"] }
  - { method: POST, path: "/fundraiser/orders/{id}/cancel", description: "DRAFT/SUBMITTED -> CANCELLED with reversal", roles: [GroupCoordinator], code: 200, input: [], output: Order, side_effects: ["SALE_REVERSAL_DEBIT when SUBMITTED", "prize evaluation"] }
  - { method: GET, path: "/fundraiser/orders/{id}/lines", description: "Lines of an order", roles: [FundraiserAdmin, GroupCoordinator, Treasurer, SupplierRep], code: 200, input: ["limit?", "offset?"], output: "OrderLine[]", side_effects: [] }
  - { method: GET, path: "/fundraiser/orders/{id}/payments", description: "Payments of an order", roles: [FundraiserAdmin, GroupCoordinator, Treasurer, SupplierRep], code: 200, input: ["limit?", "offset?"], output: "Payment[]", side_effects: [] }

  # --- payments ---
  - { method: POST, path: "/fundraiser/payments", description: "Record a family payment (RECORDED); rejects overpayment against total minus (recorded+cleared)", roles: [Treasurer], code: 201, input: [order_id, amount_cents, method, "external_ref?", "idempotency_key?"], output: Payment, side_effects: [] }
  - { method: POST, path: "/fundraiser/payments/{id}/clear", description: "RECORDED -> CLEARED; counts toward cleared_cents; prize evaluation", roles: [Treasurer], code: 200, input: [], output: Payment, side_effects: ["payment_status_derivation", "prize evaluation"] }
  - { method: POST, path: "/fundraiser/payments/{id}/bounce", description: "CLEARED CHECK -> BOUNCED; bounce fee debit; prize forfeiture cascade", roles: [Treasurer], code: 200, input: ["reason?"], output: Payment, side_effects: ["BOUNCE_FEE_DEBIT", "payment_status_derivation", "prize evaluation"] }
  - { method: POST, path: "/fundraiser/payments/{id}/refund", description: "Partially or fully refund a CLEARED payment; actor != recorder", roles: [Treasurer], code: 200, input: [amount_cents], output: Payment, side_effects: ["payment_status_derivation", "prize evaluation"] }
  - { method: POST, path: "/fundraiser/payments/{id}/void", description: "RECORDED -> VOIDED by the recording treasurer", roles: [Treasurer], code: 200, input: [], output: Payment, side_effects: [] }

  # --- supplier orders ---
  - { method: POST, path: "/fundraiser/supplier-orders", description: "Create DRAFT supplier order by aggregating SUBMITTED/LOCKED orders with case-pack rounding (campaign ORDERING_CLOSED; one active per campaign)", roles: [FundraiserAdmin], code: 201, input: [campaign_id], output: SupplierOrder, side_effects: ["supplier_aggregation_case_pack", "creates SupplierOrderLine rows"] }
  - { method: GET, path: "/fundraiser/supplier-orders/{id}", description: "Read supplier order", roles: [FundraiserAdmin, GroupCoordinator, Treasurer, SupplierRep], code: 200, input: [], output: SupplierOrder, side_effects: [] }
  - { method: GET, path: "/fundraiser/supplier-orders/{id}/lines", description: "Lines of a supplier order", roles: [FundraiserAdmin, GroupCoordinator, Treasurer, SupplierRep], code: 200, input: ["limit?", "offset?"], output: "SupplierOrderLine[]", side_effects: [] }
  - { method: PATCH, path: "/fundraiser/supplier-orders/{id}", description: "Adjust requested_units per line while DRAFT, OCC-guarded; re-derives cases/units", roles: [FundraiserAdmin], code: 200, input: [expected_supplier_order_version, line_adjustments], output: SupplierOrder, side_effects: ["supplier_aggregation_case_pack re-run", "increments SupplierOrder.version by 1"] }
  - { method: POST, path: "/fundraiser/supplier-orders/{id}/submit", description: "DRAFT -> SUBMITTED; pins estimated cost", roles: [FundraiserAdmin], code: 200, input: [], output: SupplierOrder, side_effects: ["supplier_cost (estimated)"] }
  - { method: POST, path: "/fundraiser/supplier-orders/{id}/unsubmit", description: "SUBMITTED -> DRAFT revision loop", roles: [FundraiserAdmin], code: 200, input: [], output: SupplierOrder, side_effects: ["increments SupplierOrder.version by 1"] }
  - { method: POST, path: "/fundraiser/supplier-orders/{id}/acknowledge", description: "SUBMITTED -> ACKNOWLEDGED; sets actual unit costs and confirmed delivery date; auto-advances campaign", roles: [SupplierRep], code: 200, input: [confirmed_delivery_date, line_costs], output: SupplierOrder, side_effects: ["campaign -> SUPPLIER_ORDERED"] }
  - { method: POST, path: "/fundraiser/supplier-orders/{id}/deliver", description: "ACKNOWLEDGED -> DELIVERED; records delivered units; deliverer != acknowledger; auto-advances campaign", roles: [SupplierRep], code: 200, input: [actual_delivery_date, delivered], output: SupplierOrder, side_effects: ["supplier_cost (actual)", "campaign -> DELIVERED", "product delivered/surplus buckets"] }
  - { method: POST, path: "/fundraiser/supplier-orders/{id}/cancel", description: "DRAFT/SUBMITTED -> CANCELLED", roles: [FundraiserAdmin], code: 200, input: [], output: SupplierOrder, side_effects: [] }

  # --- distribution events ---
  - { method: POST, path: "/fundraiser/distribution-events", description: "Schedule a distribution event (campaign SUPPLIER_ORDERED or later); venue half-open overlap check", roles: [GroupCoordinator], code: 201, input: [campaign_id, venue, window_start, window_end, slot_capacity], output: DistributionEvent, side_effects: [] }
  - { method: GET, path: "/fundraiser/distribution-events/{id}", description: "Read distribution event", roles: [FundraiserAdmin, GroupCoordinator, Treasurer, SupplierRep], code: 200, input: [], output: DistributionEvent, side_effects: [] }
  - { method: POST, path: "/fundraiser/distribution-events/{id}/complete", description: "SCHEDULED -> COMPLETED (requires now >= window_start)", roles: [GroupCoordinator], code: 200, input: [], output: DistributionEvent, side_effects: [] }
  - { method: POST, path: "/fundraiser/distribution-events/{id}/cancel", description: "SCHEDULED -> CANCELLED; cancels BOOKED appointments", roles: [GroupCoordinator], code: 200, input: [], output: DistributionEvent, side_effects: ["appointments BOOKED -> CANCELLED"] }

  # --- sort tickets ---
  - { method: POST, path: "/fundraiser/campaigns/{id}/generate-sort-tickets", description: "Bulk-generate per-(seller, product) sort tickets (campaign DELIVERED); assigns earliest SCHEDULED event", roles: [GroupCoordinator], code: 201, input: [], output: { created_count: integer, ticket_ids: "string[]" }, side_effects: ["creates SortTicket rows"] }
  - { method: GET, path: "/fundraiser/sort-tickets", description: "List/filter sort tickets; deterministic order created_at ASC (never id)", roles: [FundraiserAdmin, GroupCoordinator, Treasurer, SupplierRep], code: 200, input: ["campaign_id?", "seller_id?", "product_id?", "distribution_event_id?", "status?", "limit?", "offset?"], output: "SortTicket[]", side_effects: [] }
  - { method: GET, path: "/fundraiser/sort-tickets/{id}", description: "Read sort ticket", roles: [FundraiserAdmin, GroupCoordinator, Treasurer, SupplierRep], code: 200, input: [], output: SortTicket, side_effects: [] }
  - { method: POST, path: "/fundraiser/sort-tickets/{id}/verify", description: "Verify counted units; shortage marks SHORT, moves units to lost, and auto-creates a MISSING claim", roles: [GroupCoordinator], code: 200, input: [verified_qty], output: SortTicket, side_effects: ["unit bucket updates on shortage", "auto claim creation on shortage"] }

  # --- pickup appointments ---
  - { method: POST, path: "/fundraiser/pickup-appointments", description: "Book a family pickup slot; slot containment + aggregate capacity overlap check", roles: [GroupCoordinator], code: 201, input: [distribution_event_id, order_id, slot_start, slot_end], output: PickupAppointment, side_effects: [] }
  - { method: GET, path: "/fundraiser/pickup-appointments", description: "List/filter pickup appointments", roles: [FundraiserAdmin, GroupCoordinator, Treasurer, SupplierRep], code: 200, input: ["distribution_event_id?", "order_id?", "status?", "limit?", "offset?"], output: "PickupAppointment[]", side_effects: [] }
  - { method: GET, path: "/fundraiser/pickup-appointments/{id}", description: "Read pickup appointment", roles: [FundraiserAdmin, GroupCoordinator, Treasurer, SupplierRep], code: 200, input: [], output: PickupAppointment, side_effects: [] }
  - { method: POST, path: "/fundraiser/pickup-appointments/{id}/complete", description: "BOOKED -> COMPLETED or NO_SHOW", roles: [GroupCoordinator], code: 200, input: [outcome], output: PickupAppointment, side_effects: [] }
  - { method: POST, path: "/fundraiser/pickup-appointments/{id}/cancel", description: "BOOKED -> CANCELLED", roles: [GroupCoordinator], code: 200, input: [], output: PickupAppointment, side_effects: [] }

  # --- reconciliation claims ---
  - { method: POST, path: "/fundraiser/reconciliation-claims", description: "File a MISSING/DAMAGED claim on an order line (order must be SORTED or beyond)", roles: [GroupCoordinator], code: 201, input: [order_id, order_line_id, claim_type, quantity, "note?"], output: ReconciliationClaim, side_effects: [] }
  - { method: GET, path: "/fundraiser/reconciliation-claims", description: "List/filter claims", roles: [FundraiserAdmin, GroupCoordinator, Treasurer, SupplierRep], code: 200, input: ["order_id?", "campaign_id?", "order_line_id?", "supersedes_claim_id?", "status?", "limit?", "offset?"], output: "ReconciliationClaim[]", side_effects: [] }
  - { method: GET, path: "/fundraiser/reconciliation-claims/{id}", description: "Read claim", roles: [FundraiserAdmin, GroupCoordinator, Treasurer, SupplierRep], code: 200, input: [], output: ReconciliationClaim, side_effects: [] }
  - { method: POST, path: "/fundraiser/reconciliation-claims/{id}/approve", description: "SUBMITTED -> APPROVED; approver != reporter", roles: [FundraiserAdmin], code: 200, input: [], output: ReconciliationClaim, side_effects: [] }
  - { method: POST, path: "/fundraiser/reconciliation-claims/{id}/deny", description: "SUBMITTED -> DENIED; approver != reporter", roles: [FundraiserAdmin], code: 200, input: ["reason?"], output: ReconciliationClaim, side_effects: [] }
  - { method: POST, path: "/fundraiser/reconciliation-claims/{id}/appeal", description: "DENIED -> APPEALED; creates successor claim (one appeal per claim)", roles: [GroupCoordinator], code: 201, input: ["note?"], output: ReconciliationClaim, side_effects: ["creates successor claim with supersedes_claim_id"] }
  - { method: POST, path: "/fundraiser/reconciliation-claims/{id}/resolve", description: "APPROVED -> RESOLVED_REPLACEMENT | RESOLVED_REFUND with unit/ledger effects", roles: [FundraiserAdmin], code: 200, input: [resolution], output: ReconciliationClaim, side_effects: ["claim_credit", "unit bucket updates", "prize evaluation"] }

  # --- return requests ---
  - { method: POST, path: "/fundraiser/return-requests", description: "Request a return (window + availability + returnable checks)", roles: [GroupCoordinator], code: 201, input: [seller_id, order_id, order_line_id, quantity, reason], output: ReturnRequest, side_effects: [] }
  - { method: GET, path: "/fundraiser/return-requests", description: "List/filter returns", roles: [FundraiserAdmin, GroupCoordinator, Treasurer, SupplierRep], code: 200, input: ["seller_id?", "order_id?", "order_line_id?", "campaign_id?", "status?", "limit?", "offset?"], output: "ReturnRequest[]", side_effects: [] }
  - { method: GET, path: "/fundraiser/return-requests/{id}", description: "Read return request", roles: [FundraiserAdmin, GroupCoordinator, Treasurer, SupplierRep], code: 200, input: [], output: ReturnRequest, side_effects: [] }
  - { method: POST, path: "/fundraiser/return-requests/{id}/approve", description: "REQUESTED -> APPROVED; approver != requester; pins refund", roles: [Treasurer], code: 200, input: [], output: ReturnRequest, side_effects: ["return_credit pinned"] }
  - { method: POST, path: "/fundraiser/return-requests/{id}/reject", description: "REQUESTED -> REJECTED; approver != requester", roles: [Treasurer], code: 200, input: ["reason?"], output: ReturnRequest, side_effects: [] }
  - { method: POST, path: "/fundraiser/return-requests/{id}/resubmit", description: "REJECTED -> REQUESTED with revised quantity/reason while window open", roles: [GroupCoordinator], code: 200, input: [quantity, reason], output: ReturnRequest, side_effects: ["resubmission_count += 1"] }
  - { method: POST, path: "/fundraiser/return-requests/{id}/receive", description: "APPROVED -> RECEIVED_RESTOCKED | RECEIVED_WRITTEN_OFF; unit buckets + RETURN_DEBIT + prize evaluation", roles: [Treasurer], code: 200, input: [disposition], output: ReturnRequest, side_effects: ["unit bucket updates", "RETURN_DEBIT", "prize evaluation"] }

  # --- prize awards ---
  - { method: GET, path: "/fundraiser/prize-awards", description: "List/filter prize awards", roles: [FundraiserAdmin, GroupCoordinator, Treasurer, SupplierRep], code: 200, input: ["seller_id?", "prize_id?", "campaign_id?", "status?", "limit?", "offset?"], output: "PrizeAward[]", side_effects: [] }
  - { method: GET, path: "/fundraiser/prize-awards/{id}", description: "Read prize award", roles: [FundraiserAdmin, GroupCoordinator, Treasurer, SupplierRep], code: 200, input: [], output: PrizeAward, side_effects: [] }
  - { method: POST, path: "/fundraiser/prize-awards/{id}/fulfill", description: "AWARDED -> FULFILLED (campaign SORTED or later)", roles: [GroupCoordinator], code: 200, input: [], output: PrizeAward, side_effects: [] }

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "missing/invalid X-User-Role or X-User-ID" }
  - { id: ERR_UNAUTHORIZED_ROLE, http: 403, condition: "role not permitted on this endpoint" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "actor equals a forbidden prior actor (claim/return approver == reporter; refund actor == payment recorder; supplier deliverer == acknowledger)" }
  - { id: ERR_NOT_PAYMENT_RECORDER, http: 403, condition: "void attempted by a user other than the payment's recorder" }
  - { id: ERR_VALIDATION, http: 400, condition: "schema violation: missing required field, bad type, bad enum member, out-of-range integer, empty lines array, incomplete line_costs/delivered coverage" }
  - { id: ERR_CAMPAIGN_NOT_FOUND, http: 404, condition: "campaign id does not exist" }
  - { id: ERR_GROUP_NOT_FOUND, http: 404, condition: "group id does not exist" }
  - { id: ERR_PRODUCT_NOT_FOUND, http: 404, condition: "product id does not exist (path or order line FK)" }
  - { id: ERR_PRIZE_NOT_FOUND, http: 404, condition: "prize id does not exist" }
  - { id: ERR_SELLER_NOT_FOUND, http: 404, condition: "seller id does not exist" }
  - { id: ERR_ORDER_NOT_FOUND, http: 404, condition: "order id does not exist" }
  - { id: ERR_PAYMENT_NOT_FOUND, http: 404, condition: "payment id does not exist" }
  - { id: ERR_SUPPLIER_ORDER_NOT_FOUND, http: 404, condition: "supplier order id does not exist" }
  - { id: ERR_DISTRIBUTION_EVENT_NOT_FOUND, http: 404, condition: "distribution event id does not exist" }
  - { id: ERR_SORT_TICKET_NOT_FOUND, http: 404, condition: "sort ticket id does not exist" }
  - { id: ERR_CLAIM_NOT_FOUND, http: 404, condition: "reconciliation claim id does not exist" }
  - { id: ERR_RETURN_NOT_FOUND, http: 404, condition: "return request id does not exist" }
  - { id: ERR_APPOINTMENT_NOT_FOUND, http: 404, condition: "pickup appointment id does not exist" }
  - { id: ERR_PRIZE_AWARD_NOT_FOUND, http: 404, condition: "prize award id does not exist" }
  - { id: ERR_ORDER_LINE_NOT_FOUND, http: 404, condition: "order line id does not exist" }
  - { id: ERR_IDEMPOTENCY_CONFLICT, http: 409, condition: "idempotency_key replayed with a different payload" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_<parent>_version does not match the parent's current version" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "generic state-machine violation: transition not permitted from the entity's current state (incl. terminal lockdown, payment on non-submitted order, event complete before start uses ERR_EVENT_NOT_STARTED instead)" }
  - { id: ERR_CAMPAIGN_NOT_READY, http: 409, condition: "open blocked: no ACTIVE product or no student group" }
  - { id: ERR_CAMPAIGN_NOT_OPEN, http: 409, condition: "operation requires campaign OPEN (order submit, product creation uses DRAFT)" }
  - { id: ERR_OUTSIDE_ORDER_WINDOW, http: 422, condition: "order submit outside [order_window_start, order_window_end]" }
  - { id: ERR_ORDER_WINDOW_NOT_YET_CLOSED, http: 422, condition: "close-ordering before order_window_end" }
  - { id: ERR_RETURN_WINDOW_EXPIRED, http: 422, condition: "return create/resubmit after distribution_completed_at + 7 days" }
  - { id: ERR_RETURN_WINDOW_NOT_ELAPSED, http: 422, condition: "reconcile before the return window has fully elapsed" }
  - { id: ERR_EVENT_NOT_STARTED, http: 422, condition: "event complete before window_start" }
  - { id: ERR_APPOINTMENT_WINDOW_OUTSIDE, http: 422, condition: "slot not contained in event window [window_start, window_end)" }
  - { id: ERR_SELLER_SUSPENDED, http: 409, condition: "order create/submit while seller is SUSPENDED (WITHDRAWN yields same class via ERR_INVALID_STATE)" }
  - { id: ERR_PRODUCT_NOT_ORDERABLE, http: 409, condition: "order submit includes a DISCONTINUED product" }
  - { id: ERR_PER_SELLER_LIMIT_EXCEEDED, http: 422, condition: "cumulative units for seller+product would exceed product.per_seller_limit" }
  - { id: ERR_DUPLICATE_SKU, http: 409, condition: "product sku already exists within the campaign" }
  - { id: ERR_DUPLICATE_GROUP_NAME, http: 409, condition: "group name already exists within the campaign" }
  - { id: ERR_DUPLICATE_SELLER_NAME, http: 409, condition: "seller display_name already exists within the group" }
  - { id: ERR_QUANTITY_INVALID, http: 422, condition: "quantity/verified_qty/delivered_units out of allowed range (e.g., > ordered_units, > expected_qty, < 1)" }
  - { id: ERR_OVERPAYMENT, http: 422, condition: "payment would push (recorded + cleared) above order total_cents" }
  - { id: ERR_REFUND_EXCEEDS_CLEARED, http: 422, condition: "refund amount exceeds remaining un-refunded cleared value of the payment" }
  - { id: ERR_PAYMENT_METHOD_NOT_BOUNCEABLE, http: 422, condition: "bounce attempted on CASH or CARD payment" }
  - { id: ERR_ORDER_HAS_CLEARED_PAYMENTS, http: 409, condition: "cancel/withdraw blocked because cleared value exists" }
  - { id: ERR_VENUE_OVERLAP, http: 409, condition: "another SCHEDULED event for the same (campaign, venue) overlaps the half-open window" }
  - { id: ERR_SLOT_CAPACITY_EXCEEDED, http: 422, condition: "booking would push concurrent overlapping BOOKED appointments above slot_capacity at some instant" }
  - { id: ERR_CROSS_CAMPAIGN_REFERENCE, http: 422, condition: "body entities belong to different campaigns (order vs event, seller vs order, etc.)" }
  - { id: ERR_ORDER_LINE_MISMATCH, http: 422, condition: "order_line_id does not belong to order_id" }
  - { id: ERR_CAMPAIGN_HAS_ACTIVE_SUPPLIER_ORDER, http: 409, condition: "a non-cancelled, non-delivered supplier order already exists for the campaign" }
  - { id: ERR_NO_SUBMITTED_ORDERS, http: 422, condition: "supplier-order creation/submit with zero aggregated units" }
  - { id: ERR_INSUFFICIENT_SURPLUS, http: 422, condition: "REPLACEMENT resolution exceeds Product.surplus_units" }
  - { id: ERR_APPEAL_LIMIT_EXCEEDED, http: 409, condition: "claim already has a successor (one appeal per claim)" }
  - { id: ERR_CLAIM_QTY_EXCEEDS_AVAILABLE, http: 422, condition: "claim quantity exceeds line availability net of returns, other claims, and sort shortage" }
  - { id: ERR_RETURN_QTY_EXCEEDS_AVAILABLE, http: 422, condition: "return quantity exceeds line availability net of prior returns, claims, shortage, and open sibling returns" }
  - { id: ERR_PRODUCT_NOT_RETURNABLE, http: 422, condition: "return requested for a product with returnable == false" }
  - { id: ERR_SORT_TICKETS_ALREADY_GENERATED, http: 409, condition: "sort tickets already exist for the campaign" }
  - { id: ERR_UNVERIFIED_SORT_TICKETS, http: 409, condition: "mark-sorted while tickets remain PENDING" }
  - { id: ERR_OPEN_CLAIMS_OR_RETURNS, http: 409, condition: "reconcile blocked by non-terminal claims/returns, or complete-distribution blocked by non-terminal appointments" }
  - { id: ERR_CAMPAIGN_CANCEL_BLOCKED, http: 409, condition: "campaign cancel blocked because cleared payments exist" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: FundraiserAdmin
    description: "PTO fundraising company operator; owns campaign configuration, catalog, prizes, supplier ordering, claim adjudication, and the test clock"
    identity: opaque
    exclusive_operations:
      - "campaign create/patch/open/close-ordering/reconcile/cancel"
      - "product create/patch/discontinue"
      - "prize create"
      - "supplier-order create/patch/submit/unsubmit/cancel"
      - "claim approve/deny/resolve"
      - "POST /fundraiser/_clock/set_current_utc"
    shared_operations:
      - "read endpoints (all)"
      - "ledger reads (with Treasurer)"
  - name: GroupCoordinator
    description: "School-side coordinator; manages groups, sellers, orders, sorting, distribution day, pickups, and files claims/returns"
    identity: opaque
    exclusive_operations:
      - "group create"
      - "seller create/suspend/reinstate/withdraw"
      - "order create/submit/cancel"
      - "distribution-event create/complete/cancel"
      - "sort-ticket generate/verify"
      - "pickup-appointment create/complete/cancel"
      - "claim create/appeal"
      - "return create/resubmit"
      - "prize-award fulfill"
      - "campaign mark-sorted/complete-distribution"
    shared_operations:
      - "read endpoints (except ledger reads)"
  - name: Treasurer
    description: "Money role; records/clears/bounces/refunds/voids payments, approves/rejects/receives returns, posts manual adjustments, closes the campaign"
    identity: opaque
    exclusive_operations:
      - "payment record/clear/bounce/refund/void"
      - "return approve/reject/receive"
      - "group ledger adjustments"
      - "campaign close"
    shared_operations:
      - "read endpoints (all)"
      - "ledger reads (with FundraiserAdmin)"
  - name: SupplierRep
    description: "Supplier-side representative; acknowledges and confirms delivery of supplier orders only"
    identity: opaque
    exclusive_operations:
      - "supplier-order acknowledge"
      - "supplier-order deliver"
    shared_operations:
      - "read endpoints (except ledger reads)"
