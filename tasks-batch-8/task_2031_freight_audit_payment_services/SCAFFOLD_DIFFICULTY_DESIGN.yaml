# =============================================================================
# Task 2031: Freight Audit & Payment Services — §1.8 Test Targeting Index
# Nine difficulty rules, 2+ instances each (19 instances).
# =============================================================================

scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: rating_policy_ship_date_vs_invoice_date
        grounds:
          - calculations.line_rating
          - entities.CarrierInvoice.fields.rated_total_minor
          - entities.CarrierInvoice.fields.rated_contract_id
        distinguishing_aspect: |
          Same invoice lines rated under line_rating's two variants produce different
          rated_total_minor: SHIP_DATE selects the SUPERSEDED contract C1 covering
          ship_date 2026-08-02 (87500), INVOICE_DATE selects the ACTIVE contract C2
          covering invoice_date 2026-08-12 (60000) — a CarrierInvoice-domain divergence.
        test_recipe:
          setup:
            - "Client ACTIVE with tolerance 500/200bp; carrier ACTIVE; contract C1 ACTIVE [2026-08-01, 2026-12-31) with LTL rate 150/kg, fuel 10%, LIFTGATE 5000 cap 20%, min 20000"
            - "Contract C2 ACTIVE [2026-08-10, 2026-12-31) superseding C1 with LTL rate 100/kg (LTL total 60000)"
            - "Shipment PRO-1001 ship_date 2026-08-02 US->CA LTL 500kg with LIFTGATE"
            - "Two identical invoices INV-0120A/INV-0120B billed 87500 (lines 75000/7500/5000), invoice_date 2026-08-12, both CAPTURED"
          setup_api_calls:
            - { call: "POST /fap/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: FapAdmin }
            - call: "POST /fap/clients"
              payload: { name: "Acme Shippers", home_country: "US", home_currency: "USD", audit_tolerance_minor: 500, audit_tolerance_pct_bp: 200, dispute_window_days: 30 }
              as: FapAdmin
              captures: { cl: $.data.id }
            - { call: "POST /fap/clients/${cl}/activate", payload: {}, as: FapAdmin }
            - call: "POST /fap/clients/${cl}/carriers"
              payload: { scac_code: "CARR", legal_name: "Carrier One", country: "US", billing_currency: "USD", payment_terms_days: 14, remit_email: "remit@carr.example" }
              as: FapAdmin
              captures: { ca: $.data.id }
            - { call: "POST /fap/carriers/${ca}/approve_onboard", payload: {}, as: FapAdmin }
            - call: "POST /fap/carriers/${ca}/rate-contracts"
              payload:
                name: "C1"
                currency: "USD"
                lanes:
                  - { origin_country: "US", dest_country: "CA", mode: "LTL", weight_breaks: [ { min_kg: 0, rate_per_kg_minor: 150 }, { min_kg: 1000, rate_per_kg_minor: 120 } ], fuel_surcharge_pct_bp: 1000, accessorials: [ { code: "LIFTGATE", flat_minor: 5000, cap_pct_bp: 2000 } ], minimum_charge_minor: 20000 }
                effective_from: "2026-08-01"
                effective_to: "2026-12-31"
              as: FapAdmin
              captures: { rc1: $.data.id, rc1_v: $.data.version }
            - { call: "POST /fap/rate-contracts/${rc1}/activate", payload: { expected_rate_contract_version: "${rc1_v}" }, as: FapAdmin }
            - call: "POST /fap/carriers/${ca}/rate-contracts"
              payload:
                name: "C2"
                currency: "USD"
                lanes:
                  - { origin_country: "US", dest_country: "CA", mode: "LTL", weight_breaks: [ { min_kg: 0, rate_per_kg_minor: 100 } ], fuel_surcharge_pct_bp: 1000, accessorials: [ { code: "LIFTGATE", flat_minor: 5000, cap_pct_bp: 2000 } ], minimum_charge_minor: 20000 }
                effective_from: "2026-08-10"
                effective_to: "2026-12-31"
                supersedes_contract_id: "${rc1}"
              as: FapAdmin
              captures: { rc2: $.data.id, rc2_v: $.data.version }
            - { call: "POST /fap/rate-contracts/${rc2}/activate", payload: { expected_rate_contract_version: "${rc2_v}" }, as: FapAdmin }
            - call: "POST /fap/clients/${cl}/shipments"
              payload: { carrier_id: "${ca}", pro_number: "PRO-1001", ship_date: "2026-08-02", origin_country: "US", dest_country: "CA", mode: "LTL", actual_weight_kg: 500, accessorials_rendered: ["LIFTGATE"] }
              as: AuditAnalyst
              captures: { sh: $.data.id }
            - call: "POST /fap/clients/${cl}/invoices"
              payload:
                carrier_id: "${ca}"
                shipment_id: "${sh}"
                invoice_number: "INV-0120A"
                invoice_date: "2026-08-12"
                currency: "USD"
                billed_total_minor: 87500
                lines: [ { charge_code: "BASE_FREIGHT", billed_amount_minor: 75000 }, { charge_code: "FUEL_SURCHARGE", billed_amount_minor: 7500 }, { charge_code: "LIFTGATE", billed_amount_minor: 5000 } ]
              as: AuditAnalyst
              captures: { invA: $.data.id }
            - call: "POST /fap/clients/${cl}/invoices"
              payload:
                carrier_id: "${ca}"
                invoice_number: "INV-0120B"
                invoice_date: "2026-08-12"
                currency: "USD"
                billed_total_minor: 87500
                lines: [ { charge_code: "BASE_FREIGHT", billed_amount_minor: 75000 }, { charge_code: "FUEL_SURCHARGE", billed_amount_minor: 7500 }, { charge_code: "LIFTGATE", billed_amount_minor: 5000 } ]
              as: AuditAnalyst
              captures: { invB: $.data.id }
            - { call: "POST /fap/invoices/${invA}/capture", payload: {}, as: AuditAnalyst }
            - { call: "POST /fap/invoices/${invB}/capture", payload: {}, as: AuditAnalyst }
          trigger:
            - call: "POST /fap/invoices/${invA}/rate"
              payload: { policy: "SHIP_DATE" }
              as: AuditAnalyst
              captures: { ratedA: $.data.rated_total_minor, rcA: $.data.rated_contract_id }
            - call: "POST /fap/invoices/${invB}/rate"
              payload: { policy: "INVOICE_DATE" }
              as: AuditAnalyst
              captures: { ratedB: $.data.rated_total_minor, rcB: $.data.rated_contract_id }
          assert:
            - "CarrierInvoice.${invA}.rated_total_minor == 87500 and .rated_contract_id == ${rc1}"
            - "CarrierInvoice.${invB}.rated_total_minor == 60000 and .rated_contract_id == ${rc2}"
            - "Identical lines diverge by variant: ${ratedA} != ${ratedB}"

      - name: fx_invoice_date_vs_payment_date_variant
        grounds:
          - calculations.fx_conversion
          - entities.CarrierInvoice.fields.home_total_minor
          - entities.PaymentRunItem.fields.scheduled_amount_minor
        distinguishing_aspect: |
          fx_conversion's two variants value the same EUR invoice differently by date:
          invoice-date variant (rate 1.10 effective 2026-08-01) yields home_total_minor
          1098; payment-date variant (rate 1.20 effective 2026-08-05, run_date 2026-08-10)
          yields scheduled_amount_minor 1199 — a PaymentRun/finance-domain divergence,
          distinct from the CarrierInvoice rating domain of the sibling instance.
        test_recipe:
          setup:
            - "Client USD ACTIVE; EUR carrier (DE) ACTIVE; EUR contract C3 with PARCEL lane DE->US rate 333/kg, fuel 0, DETENTION and STORAGE accessorials flat 333 cap 100%, min 0"
            - "FxRates EUR->USD: 1100000 ppm effective 2026-08-01; 1200000 ppm effective 2026-08-05"
            - "Shipment PRO-3001 ship 2026-08-02 DE->US PARCEL 1kg with DETENTION and STORAGE"
            - "Invoice INV-0300 EUR billed 999 (three lines of 333), invoice_date 2026-08-03, audited to CLEARED with approved_amount_minor 999"
          setup_api_calls:
            - { call: "POST /fap/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: FapAdmin }
            - call: "POST /fap/clients"
              payload: { name: "Acme Shippers", home_country: "US", home_currency: "USD", audit_tolerance_minor: 500, audit_tolerance_pct_bp: 200, dispute_window_days: 30 }
              as: FapAdmin
              captures: { cl: $.data.id }
            - { call: "POST /fap/clients/${cl}/activate", payload: {}, as: FapAdmin }
            - call: "POST /fap/clients/${cl}/carriers"
              payload: { scac_code: "EUCA", legal_name: "Euro Carrier", country: "DE", billing_currency: "EUR", payment_terms_days: 30, remit_email: "remit@euca.example" }
              as: FapAdmin
              captures: { ca: $.data.id }
            - { call: "POST /fap/carriers/${ca}/approve_onboard", payload: {}, as: FapAdmin }
            - call: "POST /fap/carriers/${ca}/rate-contracts"
              payload:
                name: "C3"
                currency: "EUR"
                lanes:
                  - { origin_country: "DE", dest_country: "US", mode: "PARCEL", weight_breaks: [ { min_kg: 0, rate_per_kg_minor: 333 } ], fuel_surcharge_pct_bp: 0, accessorials: [ { code: "DETENTION", flat_minor: 333, cap_pct_bp: 10000 }, { code: "STORAGE", flat_minor: 333, cap_pct_bp: 10000 } ], minimum_charge_minor: 0 }
                effective_from: "2026-08-01"
                effective_to: "2026-12-31"
              as: FapAdmin
              captures: { rc3: $.data.id, rc3_v: $.data.version }
            - { call: "POST /fap/rate-contracts/${rc3}/activate", payload: { expected_rate_contract_version: "${rc3_v}" }, as: FapAdmin }
            - { call: "POST /fap/clients/${cl}/fx-rates", payload: { from_currency: "EUR", to_currency: "USD", effective_date: "2026-08-01", rate_ppm: 1100000, source: "ECB" }, as: FinanceController }
            - { call: "POST /fap/clients/${cl}/fx-rates", payload: { from_currency: "EUR", to_currency: "USD", effective_date: "2026-08-05", rate_ppm: 1200000, source: "ECB" }, as: FinanceController }
            - call: "POST /fap/clients/${cl}/shipments"
              payload: { carrier_id: "${ca}", pro_number: "PRO-3001", ship_date: "2026-08-02", origin_country: "DE", dest_country: "US", mode: "PARCEL", actual_weight_kg: 1, accessorials_rendered: ["DETENTION", "STORAGE"] }
              as: AuditAnalyst
              captures: { sh: $.data.id }
            - call: "POST /fap/clients/${cl}/invoices"
              payload:
                carrier_id: "${ca}"
                shipment_id: "${sh}"
                invoice_number: "INV-0300"
                invoice_date: "2026-08-03"
                currency: "EUR"
                billed_total_minor: 999
                lines: [ { charge_code: "BASE_FREIGHT", billed_amount_minor: 333 }, { charge_code: "DETENTION", billed_amount_minor: 333 }, { charge_code: "STORAGE", billed_amount_minor: 333 } ]
              as: AuditAnalyst
              captures: { inv: $.data.id }
            - { call: "POST /fap/invoices/${inv}/capture", payload: {}, as: AuditAnalyst }
            - { call: "POST /fap/invoices/${inv}/rate", payload: {}, as: AuditAnalyst }
            - call: "POST /fap/invoices/${inv}/finalize_audit"
              payload: {}
              as: AuditAnalyst
              captures: { home: $.data.home_total_minor, approved: $.data.approved_amount_minor }
            - call: "POST /fap/clients/${cl}/payment-runs"
              payload: { run_date: "2026-08-10", currency: "USD" }
              as: FinanceController
              captures: { run: $.data.id, run_v: $.data.version }
          trigger:
            - call: "POST /fap/payment-runs/${run}/items"
              payload: { expected_payment_run_version: "${run_v}", invoice_id: "${inv}" }
              as: FinanceController
              captures: { sched: $.data.scheduled_amount_minor }
          assert:
            - "CarrierInvoice.${inv}.home_total_minor == 1098 (invoice-date FX 1.10, per-line rounding)"
            - "CarrierInvoice.${inv}.approved_amount_minor == 999"
            - "PaymentRunItem.scheduled_amount_minor == 1199 (payment-date FX 1.20)"
            - "Same invoice, two variants: ${home} == 1098 != ${sched} == 1199"

  - rule_id: combinatorial_formula
    instances:
      - name: accessorial_cap_nested_min_mode_a
        grounds:
          - calculations.line_rating
          - entities.InvoiceLine.fields.rated_amount_minor
        distinguishing_aspect: |
          Mode (a): >=3 inputs with non-linear interaction — weight-break tier selection,
          max(base, minimum_charge), fuel percentage off the tiered base, and per-accessorial
          min(flat, cap_pct * base). LIFTGATE's flat (5000 < cap 15000) binds while
          RESIDENTIAL's cap (3750 < flat 8000) binds, exercising both branches of the
          nested min in one rating pass.
        test_recipe:
          setup:
            - "Client ACTIVE; carrier ACTIVE; contract with LTL lane rate 150/kg tier at 0kg, min 20000, fuel 10%, accessorials LIFTGATE flat 5000 cap 20% and RESIDENTIAL flat 8000 cap 5%"
            - "Shipment PRO-1001 500kg with LIFTGATE and RESIDENTIAL rendered"
            - "Invoice billed exactly at expected: BASE 75000, FUEL 7500, LIFTGATE 5000, RESIDENTIAL 3750 (total 91250)"
          setup_api_calls:
            - { call: "POST /fap/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: FapAdmin }
            - call: "POST /fap/clients"
              payload: { name: "Acme", home_country: "US", home_currency: "USD", audit_tolerance_minor: 500, audit_tolerance_pct_bp: 200, dispute_window_days: 30 }
              as: FapAdmin
              captures: { cl: $.data.id }
            - { call: "POST /fap/clients/${cl}/activate", payload: {}, as: FapAdmin }
            - call: "POST /fap/clients/${cl}/carriers"
              payload: { scac_code: "CARR", legal_name: "Carrier One", country: "US", billing_currency: "USD", payment_terms_days: 14, remit_email: "r@c.example" }
              as: FapAdmin
              captures: { ca: $.data.id }
            - { call: "POST /fap/carriers/${ca}/approve_onboard", payload: {}, as: FapAdmin }
            - call: "POST /fap/carriers/${ca}/rate-contracts"
              payload:
                name: "C1"
                currency: "USD"
                lanes:
                  - { origin_country: "US", dest_country: "CA", mode: "LTL", weight_breaks: [ { min_kg: 0, rate_per_kg_minor: 150 } ], fuel_surcharge_pct_bp: 1000, accessorials: [ { code: "LIFTGATE", flat_minor: 5000, cap_pct_bp: 2000 }, { code: "RESIDENTIAL", flat_minor: 8000, cap_pct_bp: 500 } ], minimum_charge_minor: 20000 }
                effective_from: "2026-08-01"
                effective_to: "2026-12-31"
              as: FapAdmin
              captures: { rc: $.data.id, rc_v: $.data.version }
            - { call: "POST /fap/rate-contracts/${rc}/activate", payload: { expected_rate_contract_version: "${rc_v}" }, as: FapAdmin }
            - call: "POST /fap/clients/${cl}/shipments"
              payload: { carrier_id: "${ca}", pro_number: "PRO-1001", ship_date: "2026-08-02", origin_country: "US", dest_country: "CA", mode: "LTL", actual_weight_kg: 500, accessorials_rendered: ["LIFTGATE", "RESIDENTIAL"] }
              as: AuditAnalyst
              captures: { sh: $.data.id }
            - call: "POST /fap/clients/${cl}/invoices"
              payload:
                carrier_id: "${ca}"
                shipment_id: "${sh}"
                invoice_number: "INV-0001"
                invoice_date: "2026-08-03"
                currency: "USD"
                billed_total_minor: 91250
                lines: [ { charge_code: "BASE_FREIGHT", billed_amount_minor: 75000 }, { charge_code: "FUEL_SURCHARGE", billed_amount_minor: 7500 }, { charge_code: "LIFTGATE", billed_amount_minor: 5000 }, { charge_code: "RESIDENTIAL", billed_amount_minor: 3750 } ]
              as: AuditAnalyst
              captures: { inv: $.data.id }
            - { call: "POST /fap/invoices/${inv}/capture", payload: {}, as: AuditAnalyst }
          trigger:
            - call: "POST /fap/invoices/${inv}/rate"
              payload: {}
              as: AuditAnalyst
              captures: { rated: $.data.rated_total_minor }
            - call: "GET /fap/invoices/${inv}/lines"
              payload: {}
              as: AuditAnalyst
              captures: { base_r: "$.data[0].rated_amount_minor", fuel_r: "$.data[1].rated_amount_minor", lift_r: "$.data[2].rated_amount_minor", res_r: "$.data[3].rated_amount_minor" }
          assert:
            - "BASE_FREIGHT rated 75000 (max(500*150, 20000))"
            - "FUEL_SURCHARGE rated 7500 (10% of tiered base, per-line half-up)"
            - "LIFTGATE rated 5000 (flat binds: min(5000, 15000))"
            - "RESIDENTIAL rated 3750 (cap binds: min(8000, 3750))"
            - "CarrierInvoice.${inv}.rated_total_minor == 91250"

      - name: fx_per_line_rounding_then_sum_mode_b
        grounds:
          - calculations.fx_conversion
          - entities.CarrierInvoice.fields.home_total_minor
        distinguishing_aspect: |
          Mode (b): nested rounding order is pinned — convert each line's share then sum.
          Three lines of 333 EUR at 1.10 round to 366 each (366.3 half-up) giving 1098;
          the forbidden sum-then-round order would give round(999 * 1.10) = 1099.
        test_recipe:
          setup:
            - "Client USD ACTIVE; EUR carrier ACTIVE; contract C3 (PARCEL 333/kg, fuel 0, DETENTION/STORAGE 333 flat cap 100%, min 0) ACTIVE"
            - "FxRate EUR->USD 1100000 ppm effective 2026-08-01"
            - "Shipment PRO-3001 1kg with DETENTION, STORAGE; invoice INV-0300 EUR, three lines of 333, rated exactly 999"
          setup_api_calls:
            - { call: "POST /fap/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: FapAdmin }
            - call: "POST /fap/clients"
              payload: { name: "Acme", home_country: "US", home_currency: "USD", audit_tolerance_minor: 500, audit_tolerance_pct_bp: 200, dispute_window_days: 30 }
              as: FapAdmin
              captures: { cl: $.data.id }
            - { call: "POST /fap/clients/${cl}/activate", payload: {}, as: FapAdmin }
            - call: "POST /fap/clients/${cl}/carriers"
              payload: { scac_code: "EUCA", legal_name: "Euro Carrier", country: "DE", billing_currency: "EUR", payment_terms_days: 30, remit_email: "r@e.example" }
              as: FapAdmin
              captures: { ca: $.data.id }
            - { call: "POST /fap/carriers/${ca}/approve_onboard", payload: {}, as: FapAdmin }
            - call: "POST /fap/carriers/${ca}/rate-contracts"
              payload:
                name: "C3"
                currency: "EUR"
                lanes:
                  - { origin_country: "DE", dest_country: "US", mode: "PARCEL", weight_breaks: [ { min_kg: 0, rate_per_kg_minor: 333 } ], fuel_surcharge_pct_bp: 0, accessorials: [ { code: "DETENTION", flat_minor: 333, cap_pct_bp: 10000 }, { code: "STORAGE", flat_minor: 333, cap_pct_bp: 10000 } ], minimum_charge_minor: 0 }
                effective_from: "2026-08-01"
                effective_to: "2026-12-31"
              as: FapAdmin
              captures: { rc: $.data.id, rc_v: $.data.version }
            - { call: "POST /fap/rate-contracts/${rc}/activate", payload: { expected_rate_contract_version: "${rc_v}" }, as: FapAdmin }
            - { call: "POST /fap/clients/${cl}/fx-rates", payload: { from_currency: "EUR", to_currency: "USD", effective_date: "2026-08-01", rate_ppm: 1100000, source: "ECB" }, as: FinanceController }
            - call: "POST /fap/clients/${cl}/shipments"
              payload: { carrier_id: "${ca}", pro_number: "PRO-3001", ship_date: "2026-08-02", origin_country: "DE", dest_country: "US", mode: "PARCEL", actual_weight_kg: 1, accessorials_rendered: ["DETENTION", "STORAGE"] }
              as: AuditAnalyst
              captures: { sh: $.data.id }
            - call: "POST /fap/clients/${cl}/invoices"
              payload:
                carrier_id: "${ca}"
                shipment_id: "${sh}"
                invoice_number: "INV-0300"
                invoice_date: "2026-08-03"
                currency: "EUR"
                billed_total_minor: 999
                lines: [ { charge_code: "BASE_FREIGHT", billed_amount_minor: 333 }, { charge_code: "DETENTION", billed_amount_minor: 333 }, { charge_code: "STORAGE", billed_amount_minor: 333 } ]
              as: AuditAnalyst
              captures: { inv: $.data.id }
            - { call: "POST /fap/invoices/${inv}/capture", payload: {}, as: AuditAnalyst }
            - { call: "POST /fap/invoices/${inv}/rate", payload: {}, as: AuditAnalyst }
          trigger:
            - call: "POST /fap/invoices/${inv}/finalize_audit"
              payload: {}
              as: AuditAnalyst
              captures: { home: $.data.home_total_minor }
          assert:
            - "CarrierInvoice.${inv}.home_total_minor == 1098 (per-line round_half_up(333 * 1.10) = 366, summed)"
            - "Forbidden alternative sum-then-round would yield 1099; the pinned order yields 1098"

      - name: run_discount_tier_gross_keyed_mode_c
        grounds:
          - calculations.run_discount_tier
          - entities.PaymentRun.fields.total_minor
          - entities.PaymentRunItem.fields.discount_minor
        distinguishing_aspect: |
          Mode (c): circular-looking dependency pinned by evaluation order — the discount
          tier is keyed on the PRE-discount gross. Two items of 505000 give gross 1010000
          (tier 150bp, discounts 15150, net 994850); keying on net would select tier 0
          (994850 < 1000000) and yield 0 discount — a different, wrong result.
        test_recipe:
          setup:
            - "Client ACTIVE; carrier ACTIVE; contract with FTL lane US->US rate 101/kg, fuel 0, min 0, no accessorials"
            - "Two FTL shipments 5000kg and two single-line invoices INV-0501/INV-0502 billed 505000 each, both audited CLEARED (approved 505000 each)"
            - "Payment run USD run_date 2026-08-10 with both invoices added"
          setup_api_calls:
            - { call: "POST /fap/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: FapAdmin }
            - call: "POST /fap/clients"
              payload: { name: "Acme", home_country: "US", home_currency: "USD", audit_tolerance_minor: 500, audit_tolerance_pct_bp: 200, dispute_window_days: 30 }
              as: FapAdmin
              captures: { cl: $.data.id }
            - { call: "POST /fap/clients/${cl}/activate", payload: {}, as: FapAdmin }
            - call: "POST /fap/clients/${cl}/carriers"
              payload: { scac_code: "CARR", legal_name: "Carrier One", country: "US", billing_currency: "USD", payment_terms_days: 14, remit_email: "r@c.example" }
              as: FapAdmin
              captures: { ca: $.data.id }
            - { call: "POST /fap/carriers/${ca}/approve_onboard", payload: {}, as: FapAdmin }
            - call: "POST /fap/carriers/${ca}/rate-contracts"
              payload:
                name: "C-FTL"
                currency: "USD"
                lanes:
                  - { origin_country: "US", dest_country: "US", mode: "FTL", weight_breaks: [ { min_kg: 0, rate_per_kg_minor: 101 } ], fuel_surcharge_pct_bp: 0, accessorials: [], minimum_charge_minor: 0 }
                effective_from: "2026-08-01"
                effective_to: "2026-12-31"
              as: FapAdmin
              captures: { rc: $.data.id, rc_v: $.data.version }
            - { call: "POST /fap/rate-contracts/${rc}/activate", payload: { expected_rate_contract_version: "${rc_v}" }, as: FapAdmin }
            - call: "POST /fap/clients/${cl}/shipments"
              payload: { carrier_id: "${ca}", pro_number: "PRO-5001", ship_date: "2026-08-02", origin_country: "US", dest_country: "US", mode: "FTL", actual_weight_kg: 5000 }
              as: AuditAnalyst
              captures: { sh1: $.data.id }
            - call: "POST /fap/clients/${cl}/shipments"
              payload: { carrier_id: "${ca}", pro_number: "PRO-5002", ship_date: "2026-08-02", origin_country: "US", dest_country: "US", mode: "FTL", actual_weight_kg: 5000 }
              as: AuditAnalyst
              captures: { sh2: $.data.id }
            - call: "POST /fap/clients/${cl}/invoices"
