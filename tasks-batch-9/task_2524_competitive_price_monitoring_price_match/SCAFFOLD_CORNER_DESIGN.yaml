          assert:
            - "First trigger: HTTP 409 with error_id == ERR_DUPLICATE_OBSERVATION_WINDOW (30 minutes from ${o_base}, same collection_method)"
            - "Second trigger: HTTP 201 at exactly 60 minutes from ${o_base}"
            - "Third trigger: HTTP 201 — a different collection_method is a different proximity scope even at the identical instant"
            - "GET /pricing/observations?link_id=${l_id}&status=ACTIVE returns total_count == 3 and CompetitorProductLink.${l_id}.latest_effective_price_cents == 17700"

      - name: corner_change_frequency_limit_gates_repeat_automated_execute
        claim_type: violation_to_error
        grounds: [validations.priority_72_ERR_CHANGE_FREQUENCY_LIMIT, state_machines.PriceChangeOrder.transitions.APPROVED_to_EXECUTED]
