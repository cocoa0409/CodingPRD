            - "response.data.error_id == ERR_BAY_WINDOW_CONFLICT"
            - "HTTP status == 409"

      - name: duty_log_hos_reset_buffer
        grounds:
          - validations[priority=9]
          - calculations.hos_driving_check
          - errors[ERR_HOS_RESET_REQUIRED]
          - entities.DutyLogEntry.fields.entry_type
        distinguishing_aspect: "Driver duty logs use a BUFFERED interval: a new DRIVING shift needs a >= HOS_RESET_MIN (600min) off-duty gap since the prior driving; only 6h off-duty precedes it, so ERR_HOS_RESET_REQUIRED — a gap-buffer rule on a different resource than the half-open bay."
