              as_user_id: "${j1}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_CONTACT_NOT_VOIDABLE"

      - name: start_monitoring_without_scheduled_period_returns_no_scheduled_monitoring
        claim_type: Violation to Error
        grounds:
          - errors[ERR_NO_SCHEDULED_MONITORING]
          - state_machines.Contact.NOTIFIED_to_MONITORING_ACTIVE
        distinguishing_aspect: |
          start-monitoring on a NOTIFIED contact with quarantine_end_date set but NO SCHEDULED
