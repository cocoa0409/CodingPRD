scenario: 'Agent Lead Marketplace & Zip-Code Share Allocation (Zillow Premier Agent): advertiser purchase of impression share within a zip code
  with pricing driven by market demand, lead routing to agents by share, responsiveness and connection acceptance, live connection transfer of
  a consumer to an available agent with call recording, agent performance scoring on response time, conversion and consumer ratings affecting
  future allocation, refund and credit policy for invalid or duplicate leads, team account structures distributing leads among licensed team members,
  listing data ingestion and display rules that differ by market participation agreements, brokerage participation disputes over listing display
  and lead attribution

  '
domain_name: agent-lead-marketplace
api_prefix: /
complexity_profile:
  primary_archetype: quota_allocation
  secondary_archetype: pricing_engine
  complexity_layers:
  - selector_policy
  - cascading_side_effects
  - optimistic_concurrency
  - scheduled_actions
  entity_topology: flat
  state_machine_shape: branching
  relationship_patterns:
  - one_to_many
  - many_to_many
  - cross_aggregate
  role_model: hierarchical_override
  consistency_model: immediate
response_envelope:
  success: "{ \"meta\": { \"api_request_id\": \"req_xxx\", \"api_request_timestamp\": \"ISO8601\" },\n  \"response_type\": \"object\" | \"array\"\
    , \"data\": {} }\n"
  error: "{ \"meta\": { ... }, \"response_type\": \"error\",\n  \"data\": { \"error_id\": \"ERR_XXX\", \"message\": \"...\" } }\n"
  pagination_fields:
  - limit
  - offset
  - total_count
  - has_more
  pagination_defaults:
    limit: 10
    min: 1
    max: 100
    offset: 0
entities:
- name: Market
  parent: null
  common_fields: true
  fields:
  - name: zip_code
    type: string
    source: input
    description: 5-digit US zip code; unique across all Markets
    constraints: exactly 5 digits; unique
  - name: state_code
    type: string
    source: input
    description: 2-letter state code governing license eligibility
    constraints: 2 uppercase letters
  - name: participation_agreement
    type: enum
    source: input
    description: IDX_FULL | IDX_LIMITED | NON_PARTICIPATING — drives listing display rules
    default: IDX_FULL
  - name: base_lead_price_cents
    type: integer
    source: input
    description: Per-lead price in cents at demand tier 1 before volume discount
    constraints: '> 0'
  - name: market_status
    type: enum
    source: system
    description: OPEN | SUSPENDED; initial OPEN
    default: OPEN
  - name: allocated_bps
    type: integer
    source: computed
    description: Sum of share_bps over ShareOrders of this market with order_status == ACTIVE
  - name: available_bps
    type: integer
    source: computed
    description: 10000 - allocated_bps
  - name: current_unit_price_cents
    type: integer
    source: computed
    description: unit_price_cents from calculation share_price_quote evaluated with share_bps=100 against current allocated_bps
- name: Brokerage
  parent: null
  common_fields: true
  fields:
  - name: legal_name
    type: string
    source: input
    description: Brokerage legal name
  - name: primary_state
    type: string
    source: input
    description: 2-letter home state; used by IDX_LIMITED display rule
  - name: brokerage_status
    type: enum
    source: system
    description: ACTIVE | SUSPENDED; initial ACTIVE
    default: ACTIVE
- name: Agent
  parent: null
  common_fields: true
  fields:
  - name: full_name
    type: string
    source: input
    description: Agent display name
  - name: email
    type: string
    source: input
    description: Login email; unique across all Agents
    constraints: unique
  - name: license_number
    type: string
    source: input
    description: Real-estate license number; unique across all Agents
    constraints: unique
  - name: license_state
    type: string
    source: input
    description: 2-letter state the license is issued in; gates share purchase and routing eligibility per market.state_code
  - name: brokerage_id
    type: string
    source: input
    description: FK -> Brokerage.id; employing brokerage
  - name: agent_status
    type: enum
    source: system
    description: ACTIVE | SUSPENDED | DEACTIVATED; initial ACTIVE
    default: ACTIVE
  - name: performance_tier
    type: enum
    source: computed
    description: UNRATED | HIGH | STANDARD | LOW | INELIGIBLE; derived from official_score; UNRATED when offers_received == 0
    default: UNRATED
  - name: rolling_score
    type: integer
    source: computed
    description: Provisional all-time performance score recomputed on every scoring event (variant ROLLING of agent_performance_score)
  - name: official_score
    type: integer
    source: computed
    description: Score from the most recent PerformanceSnapshot (variant OFFICIAL); 0 until first ops run
    default: 0
  - name: offers_received
    type: integer
    source: system
    description: 'Counter: leads offered to this agent'
    default: 0
  - name: offers_accepted
    type: integer
    source: system
    description: 'Counter: offers accepted'
    default: 0
  - name: offers_expired
    type: integer
    source: system
    description: 'Counter: offers expired by TTL sweep'
    default: 0
  - name: response_seconds_sum
    type: integer
    source: system
    description: Sum of (accepted_at - offered_at) seconds over accepted offers
    default: 0
  - name: leads_converted
    type: integer
    source: system
    description: 'Counter: assigned leads closed CONVERTED'
    default: 0
  - name: leads_closed_lost
    type: integer
    source: system
    description: 'Counter: assigned leads closed LOST'
    default: 0
  - name: connections_missed
    type: integer
    source: system
    description: 'Counter: live connections ending NO_ANSWER'
    default: 0
  - name: rating_sum
    type: integer
    source: system
    description: Sum of consumer ratings (1-5)
    default: 0
  - name: rating_count
    type: integer
    source: system
    description: Count of consumer ratings
    default: 0
- name: TeamAccount
  parent: null
  common_fields: true
  fields:
  - name: team_name
    type: string
    source: input
    description: Team display name
  - name: lead_agent_id
    type: string
    source: input
    description: FK -> Agent.id; owning team lead (ownership checks compare X-User-ID to this)
  - name: market_id
    type: string
    source: input
    description: FK -> Market.id; teams are scoped to exactly one market
  - name: distribution_mode
    type: enum
    source: input
    description: WEIGHTED_DEFICIT | MANUAL; how team-routed leads pick a member
    default: WEIGHTED_DEFICIT
  - name: team_status
    type: enum
    source: system
    description: ACTIVE | DISSOLVED; initial ACTIVE
    default: ACTIVE
- name: TeamMembership
  parent: null
  common_fields: true
  fields:
  - name: team_id
    type: string
    source: input
    description: FK -> TeamAccount.id
  - name: agent_id
    type: string
    source: input
    description: FK -> Agent.id; at most one membership with membership_status == ACTIVE per (team_id, agent_id)
  - name: allocation_weight
    type: integer
    source: input
    description: Positive integer distribution weight
    constraints: '>= 1'
  - name: membership_status
    type: enum
    source: system
    description: ACTIVE | REMOVED; initial ACTIVE
    default: ACTIVE
  - name: leads_assigned
    type: integer
    source: system
    description: 'Counter: team leads assigned to this member'
    default: 0
  - name: allocated_charge_cents
    type: integer
    source: system
    description: This member's cumulative share of finalized team-order charges (calculation team_charge_split)
    default: 0
- name: ShareOrder
  parent: null
  common_fields: true
  fields:
  - name: market_id
    type: string
    source: input
    description: FK -> Market.id; the zip whose impression share is purchased
  - name: buyer_agent_id
    type: string
    source: input
    description: FK -> Agent.id; the advertiser (solo) or team lead (when team_id set)
  - name: team_id
    type: string
    source: input
    description: FK -> TeamAccount.id; required when the order is a team order, null for solo orders
    default: null
  - name: share_bps
    type: integer
    source: input
    description: Requested impression share in basis points of 10000
    constraints: 1..10000; aggregate over ACTIVE orders of the market <= 10000
  - name: duration_days
    type: integer
    source: input
    description: Campaign length in days
    constraints: 1..90
  - name: tier
    type: integer
    source: computed
    description: Demand tier 1..3 at purchase time (calculation share_price_quote)
  - name: unit_price_cents
    type: integer
    source: computed
    description: Per-lead price in cents at purchase (calculation share_price_quote)
  - name: deposit_cents
    type: integer
    source: computed
    description: 'Activation deposit required at purchase: tier * 100 * unit_price_cents (calculation share_price_quote)'
  - name: paid_cents
    type: integer
    source: system
    description: Cumulative SUCCEEDED payments captured against this order
    default: 0
  - name: charged_cents
    type: integer
    source: system
    description: Cumulative finalized charges for this order
    default: 0
  - name: credits_cents
    type: integer
    source: system
    description: Cumulative credits granted against this order
    default: 0
  - name: leads_received
    type: integer
    source: system
    description: 'Counter: leads routed to this order'
    default: 0
  - name: leads_charged
    type: integer
    source: system
    description: 'Counter: leads finalized and charged'
    default: 0
  - name: leads_credited
    type: integer
    source: system
    description: 'Counter: finalized leads credited via claims'
    default: 0
  - name: order_status
    type: enum
    source: system
    description: PENDING_PAYMENT | ACTIVE | PAUSED | COMPLETED | CANCELLED | PAYMENT_FAILED
    default: PENDING_PAYMENT
  - name: activated_at
    type: datetime
    source: system
    description: Activation timestamp (null until ACTIVE)
    default: null
  - name: ends_at
    type: datetime
    source: system
    description: activated_at + duration_days (null until ACTIVE)
    default: null
  - name: completed_at
    type: datetime
    source: system
    description: Timestamp of expiry completion (null until COMPLETED)
    default: null
- name: Payment
  parent: null
  common_fields: false
  fields:
  - name: share_order_id
    type: string
    source: input
    description: FK -> ShareOrder.id; order this capture applies to
  - name: amount_cents
    type: integer
    source: input
    description: Amount to capture; must equal deposit_cents (activation) or charged_cents - paid_cents (settlement), and be > 0
  - name: outcome
    type: enum
    source: input
    description: SUCCEEDED | DECLINED — simulated gateway result
    constraints: SUCCEEDED | DECLINED
  - name: payment_status
    type: enum
    source: system
    description: SUCCEEDED | DECLINED; immutable once recorded
    default: null
- name: Lead
  parent: null
  common_fields: true
  fields:
  - name: market_id
    type: string
    source: input
    description: FK -> Market.id
  - name: listing_id
    type: string
    source: input
    description: FK -> Listing.id; listing the consumer inquired about
  - name: consumer_key
    type: string
    source: input
    description: Normalized consumer identity key (email hash); drives the 30-day duplicate rule
  - name: listing_agent_id
    type: string
    source: input
    description: FK -> Agent.id; listing-side agent recorded at intake (drives same-agent duplicate rule)
  - name: lead_status
    type: enum
    source: system
    description: NEW | ROUTED | UNASSIGNED | ASSIGNED | LIVE_CONNECTED | CLOSED_CONVERTED | CLOSED_LOST | REJECTED_DUPLICATE
    default: NEW
  - name: share_order_id
    type: string
    source: computed
    description: FK -> ShareOrder.id; winning order from lead_allocation; null until routed
    default: null
  - name: team_id
    type: string
    source: computed
    description: FK -> TeamAccount.id; null unless the winning order is a team order
    default: null
  - name: routing_attempts
    type: integer
    source: system
    description: Number of assignment attempts (each offers at most 3 candidates)
    default: 0
  - name: accepted_agent_id
    type: string
    source: computed
    description: FK -> Agent.id; agent that accepted, or manual assignee (null until ASSIGNED)
    default: null
  - name: assigned_at
    type: datetime
    source: system
    description: Assignment timestamp (null until ASSIGNED)
    default: null
  - name: duplicate_of_lead_id
    type: string
    source: computed
    description: FK -> Lead.id; anchor lead when REJECTED_DUPLICATE (null otherwise)
    default: null
  - name: routing_note
    type: string
    source: computed
    description: Human-readable reason for UNASSIGNED (e.g. pool exhausted, pool empty)
    default: null
- name: LeadAssignment
  parent: null
  common_fields: true
  fields:
  - name: lead_id
    type: string
    source: system
    description: FK -> Lead.id; the lead being offered
  - name: share_order_id
    type: string
    source: computed
    description: FK -> ShareOrder.id; the winning order copied from Lead at offer time
  - name: candidate_agent_ids
    type: array
    source: computed
    description: Exactly 3 candidate agent ids (or 0 when pool empty), ordered by selector rank at offer time
  - name: assignment_status
    type: enum
    source: system
    description: OFFERED | ACCEPTED | EXPIRED | CANCELLED
    default: OFFERED
  - name: offered_at
    type: datetime
    source: system
    description: Offer timestamp
  - name: expires_at
    type: datetime
    source: system
    description: offered_at + 300 seconds (offer TTL)
  - name: accepted_by_agent_id
    type: string
    source: computed
    description: FK -> Agent.id; accepting agent (null until ACCEPTED)
    default: null
  - name: accepted_at
    type: datetime
    source: system
    description: Acceptance timestamp (null until ACCEPTED)
    default: null
- name: LiveConnection
  parent: null
  common_fields: true
  fields:
  - name: lead_id
    type: string
    source: input
    description: FK -> Lead.id
  - name: consumer_key
    type: string
    source: input
    description: Consumer identity key; must match lead.consumer_key
  - name: listing_agent_id
    type: string
    source: input
    description: FK -> Agent.id; listing-side agent for the duplicate attribution guard
  - name: agent_id
    type: string
    source: computed
    description: FK -> Agent.id; the assigned agent the bridge targets (null until BRIDGING)
    default: null
  - name: share_order_id
    type: string
    source: computed
    description: FK -> ShareOrder.id; the routed order (null until BRIDGING)
    default: null
  - name: connection_status
    type: enum
    source: system
    description: REQUESTED | BRIDGING | COMPLETED | NO_ANSWER | DROPPED | REJECTED_DUPLICATE
    default: REQUESTED
  - name: recording_retention_expires_at
    type: datetime
    source: system
    description: bridge timestamp + 90 days (null until recording created)
  - name: duplicate_of_lead_id
    type: string
    source: computed
    description: FK -> Lead.id; anchor lead when REJECTED_DUPLICATE
    default: null
- name: CallRecording
  parent: null
  common_fields: false
  fields:
  - name: live_connection_id
    type: string
    source: input
    description: FK -> LiveConnection.id
  - name: duration_seconds
    type: integer
    source: input
    description: Recorded call length
    constraints: '>= 1'
  - name: consent_given
    type: boolean
    source: input
    description: Both-party consent captured on the bridge
  - name: recording_status
    type: enum
    source: system
    description: STORED | PURGED
    default: STORED
- name: Rating
  parent: null
  common_fields: false
  fields:
  - name: lead_id
    type: string
    source: input
    description: FK -> Lead.id
  - name: score
    type: integer
    source: input
    description: Consumer rating
    constraints: 1..5
  - name: comment
    type: string
    source: input
    description: Optional free-text comment
    default: null
- name: PerformanceSnapshot
  parent: null
  common_fields: false
  fields:
  - name: agent_id
    type: string
    source: computed
    description: FK -> Agent.id; snapshotted agent
  - name: ops_run_seq
    type: integer
    source: computed
    description: FK -> OpsRun.seq; run that produced this snapshot
  - name: window_start_at
    type: datetime
    source: computed
    description: Exclusive lower bound of the scored window (prior run's run_at, or -infinity)
  - name: window_end_at
    type: datetime
    source: computed
    description: Inclusive upper bound (this run's run_at)
  - name: windowed_score
    type: integer
    source: computed
    description: Variant OFFICIAL of agent_performance_score; windowed events only
- name: CreditClaim
  parent: null
  common_fields: true
  fields:
  - name: lead_id
    type: string
    source: input
    description: FK -> Lead.id; must reference a finalized charged lead with no prior approved claim
  - name: claimant_agent_id
    type: string
    source: computed
    description: FK -> Agent.id; set from the acting user (must equal lead.accepted_agent_id)
    default: null
  - name: claim_type
    type: enum
    source: input
    description: INVALID | DUPLICATE
  - name: reason
    type: string
    source: input
    description: Free-text justification
  - name: claim_status
    type: enum
    source: system
    description: SUBMITTED | APPROVED | REJECTED
    default: SUBMITTED
  - name: credit_cents
    type: integer
    source: computed
    description: 'Credit amount on APPROVED: charged amount, or half when claim_type == DUPLICATE; 0 when REJECTED'
- name: Listing
  parent: null
  common_fields: true
  fields:
  - name: external_ref
    type: string
    source: input
    description: Source-system listing reference; unique per (market_id, source_feed)
    constraints: unique per (market_id, source_feed)
  - name: market_id
    type: string
    source: input
    description: FK -> Market.id
  - name: source_feed
    type: enum
    source: input
    description: MLS | BROKER_DIRECT — the ingestion channel
  - name: brokerage_id
    type: string
    source: input
    description: FK -> Brokerage.id; listing brokerage (attribution anchor)
  - name: listing_agent_id
    type: string
    source: input
    description: FK -> Agent.id; listing-side agent (attribution anchor)
  - name: listing_status
    type: enum
    source: system
    description: PENDING_REVIEW | ACTIVE | REJECTED | WITHDRAWN
    default: PENDING_REVIEW
  - name: compliance_note
    type: string
    source: computed
    description: Reason recorded on REJECTED / WITHDRAWN / dispute removal
    default: null
- name: Dispute
  parent: null
  common_fields: true
  fields:
  - name: dispute_type
    type: enum
    source: input
    description: LISTING_DISPLAY | LEAD_ATTRIBUTION
  - name: brokerage_id
    type: string
    source: input
    description: FK -> Brokerage.id; must equal the acting BrokerageUser's brokerage
  - name: listing_id
    type: string
    source: input
    description: FK -> Listing.id; required for LISTING_DISPLAY
    default: null
  - name: lead_id
    type: string
    source: input
    description: FK -> Lead.id; required for LEAD_ATTRIBUTION
    default: null
  - name: requested_agent_id
    type: string
    source: input
    description: FK -> Agent.id; alternative attribution target for LEAD_ATTRIBUTION
    default: null
  - name: evidence
    type: string
    source: input
    description: Free-text evidence
  - name: dispute_status
    type: enum
    source: system
    description: OPEN | RESOLVED | REJECTED
    default: OPEN
  - name: resolution
    type: enum
    source: computed
    description: KEEP | REMOVE for LISTING_DISPLAY; REASSIGN | KEEP for LEAD_ATTRIBUTION; REJECTED_DISPUTE when rejected
    default: null
  - name: resolved_at
    type: datetime
    source: system
    description: Resolution timestamp (null until RESOLVED/REJECTED)
    default: null
- name: OpsRun
  parent: null
  common_fields: false
  fields:
  - name: seq
    type: integer
    source: system
    description: Monotonic run sequence number starting at 1
  - name: run_at
    type: datetime
    source: system
    description: Logical clock time at execution
  - name: sweep_counts
    type: object
    source: computed
    description: '{ expired_offers, rerouted, unassigned, expired_orders, credited_orders, purged_recordings, snapshotted_agents }'
state_machines:
- entity: ShareOrder
  initial_state: PENDING_PAYMENT
  terminal_states:
  - COMPLETED
  - CANCELLED
  - PAYMENT_FAILED
  transitions:
  - from: PENDING_PAYMENT
    to: ACTIVE
    trigger: POST /share-orders/{id}/payments with outcome SUCCEEDED and amount_cents == order.deposit_cents
    actor: Agent
    preconditions:
    - order_status == PENDING_PAYMENT
    - no prior Payment row with payment_status == SUCCEEDED for this order
    - amount_cents == deposit_cents
    - market.available_bps >= share_bps at activation instant
    side_effects:
    - set paid_cents = deposit_cents; activated_at = now; ends_at = now + duration_days
    - market.allocated_bps += share_bps; market.available_bps recomputed; market.current_unit_price_cents recomputed (may flip tier for later
      buyers); Market.version + 1
    note: A DECLINED payment transitions to PAYMENT_FAILED instead (see below).
  - from: PENDING_PAYMENT
    to: PAYMENT_FAILED
    trigger: POST /share-orders/{id}/payments with outcome DECLINED
    actor: Agent
    preconditions:
    - order_status == PENDING_PAYMENT
    side_effects:
    - reserved share is never allocated; market counters unchanged
  - from: ACTIVE
    to: PAUSED
    trigger: POST /share-orders/{id}/pause
    actor: Agent
    preconditions:
    - order_status == ACTIVE
    side_effects:
    - market.allocated_bps -= share_bps; market.current_unit_price_cents recomputed; Market.version + 1
  - from: PAUSED
    to: ACTIVE
    trigger: POST /share-orders/{id}/resume
    actor: Agent
    preconditions:
    - order_status == PAUSED
    - market.available_bps >= share_bps at resume instant (re-capacity check)
    side_effects:
    - market.allocated_bps += share_bps; market.current_unit_price_cents recomputed; Market.version + 1
  - from: PAUSED
    to: CANCELLED
    trigger: POST /share-orders/{id}/cancel
    actor: Agent
    preconditions:
    - order_status == PAUSED
    side_effects:
    - no market counter change (share was already released on pause)
  - from: ACTIVE
    to: COMPLETED
    trigger: 'POST /ops-runs sweep: now >= ends_at and paid_cents >= charged_cents - credits_cents (settled)'
    actor: system
    preconditions:
    - now >= ends_at
    - paid_cents >= charged_cents - credits_cents
    side_effects:
    - market.allocated_bps -= share_bps; market.current_unit_price_cents recomputed; Market.version + 1
    - set completed_at = now
  - from: ACTIVE
    to: CANCELLED
    trigger: 'POST /ops-runs sweep: now >= ends_at and paid_cents < charged_cents - credits_cents (balance due and unpaid at expiry)'
    actor: system
    preconditions:
    - now >= ends_at
    - paid_cents < charged_cents - credits_cents
    side_effects:
    - market.allocated_bps -= share_bps; market.current_unit_price_cents recomputed; Market.version + 1
    note: 'Expiry branches on settlement: paid up completes; balance due cancels.'
- entity: Lead
  initial_state: NEW
  terminal_states:
  - REJECTED_DUPLICATE
  - UNASSIGNED
  - CLOSED_CONVERTED
  - CLOSED_LOST
  transitions:
  - from: NEW
    to: ROUTED
    trigger: POST /leads and POST /live-connections both run calculation lead_allocation at creation; pool non-empty
    actor: Agent
    preconditions:
    - market.market_status == OPEN
    - no duplicate (validations duplicate_lead_window / duplicate_lead_same_agent)
    - eligible candidate pool non-empty per selector lead_assignment_selector
    side_effects:
    - set share_order_id = winning order; team_id = winning order's team_id (or null)
    - ShareOrder.leads_received += 1
    - create LeadAssignment (OFFERED) with candidate_agent_ids = top-3 selector output, expires_at = now + 300s
    - routing_attempts += 1
  - from: NEW
    to: UNASSIGNED
    trigger: POST /leads / POST /live-connections when the eligible candidate pool is empty (no order can be charged for a lead nobody can receive)
    actor: system
    preconditions:
    - not a duplicate
    - eligible candidate pool empty
    side_effects:
    - routing_note = 'pool empty'; no ShareOrder counter changes; no charge
  - from: NEW
    to: REJECTED_DUPLICATE
    trigger: POST /leads / POST /live-connections when duplicate validations fire (priority 9)
    actor: system
    preconditions:
    - duplicate_lead_window or duplicate_lead_same_agent condition holds
    side_effects:
    - set duplicate_of_lead_id = anchor lead; no charge, no offer
  - from: ROUTED
    to: ASSIGNED
    trigger: POST /lead-assignments/{id}/accept by a candidate; or POST /leads/{id}/assign manual override (specifies accepted_agent_id directly)
    actor: Agent
    preconditions:
    - 'accept path: lead_status == ROUTED, assignment OFFERED and unexpired, acting agent in candidate_agent_ids'
    - 'manual path: lead_status in {ROUTED, UNASSIGNED}, assignee eligible per lead_assignment_selector eligibility (license state, active status,
      tier not INELIGIBLE) and has a covering ShareOrder (own or team) ACTIVE in the market'
    side_effects:
    - set accepted_agent_id, assigned_at = now
    - 'assignment ACCEPTED: Agent.offers_accepted += 1; Agent.response_seconds_sum += (accepted_at - offered_at) seconds'
    - 'if team lead: winning TeamMembership.leads_assigned += 1 (team_member_selector)'
    - Agent.rolling_score recomputed (calculation agent_performance_score variant ROLLING)
  - from: ROUTED
    to: ROUTED
    trigger: POST /ops-runs sweep when the open LeadAssignment expires and reroute pool is non-empty
    actor: system
    preconditions:
    - lead_status == ROUTED; assignment OFFERED with expires_at <= now
    - reroute pool per lead_assignment_selector excluding prior candidates is non-empty
    side_effects:
    - old assignment -> EXPIRED; each prior candidate Agent.offers_expired += 1 (rolling_score recomputed per agent)
    - new LeadAssignment created; routing_attempts += 1; expires_at = now + 300s
    note: 'Self-loop with mutation: a new offer supersedes the expired one.'
  - from: ROUTED
    to: UNASSIGNED
    trigger: POST /ops-runs sweep when the open LeadAssignment expires and the reroute pool (excluding all prior candidates) is empty; or POST
      /leads/{id}/cancel by the market operator
    actor: system
    preconditions:
    - 'sweep path: lead_status == ROUTED, assignment expired, reroute pool empty'
    - 'cancel path: lead_status == ROUTED and caller is MarketplaceOps'
    side_effects:
    - 'sweep: assignment -> EXPIRED; prior candidates offers_expired += 1; routing_note = ''pool exhausted''; credit previously charged amount:
      ShareOrder.credits_cents += (charged amount for this lead) and each affected Agent.credits_cents -= that debit share; ShareOrder/Market
      versions bump'
  - from: ASSIGNED
    to: LIVE_CONNECTED
    trigger: POST /live-connections bridge completes (COMPLETED or NO_ANSWER) — the assignment matured into a live transfer
    actor: Agent
    preconditions:
    - lead_status == ASSIGNED
    - live_connection.agent_id == lead.accepted_agent_id
    side_effects:
    - none on Agent counters directly (connection outcome applies its own counters)
  - from: ASSIGNED
    to: CLOSED_CONVERTED
    trigger: POST /leads/{id}/close with outcome CONVERTED
    actor: Agent
    preconditions:
    - lead_status in {ASSIGNED, LIVE_CONNECTED}
    - acting agent == lead.accepted_agent_id
    side_effects:
    - Agent.leads_converted += 1; Agent.rolling_score recomputed
  - from: ASSIGNED
    to: CLOSED_LOST
    trigger: POST /leads/{id}/close with outcome LOST
    actor: Agent
    preconditions:
    - lead_status in {ASSIGNED, LIVE_CONNECTED}
    - acting agent == lead.accepted_agent_id
    side_effects:
    - Agent.leads_closed_lost += 1; Agent.rolling_score recomputed
  - from: LIVE_CONNECTED
    to: CLOSED_CONVERTED
    trigger: POST /leads/{id}/close with outcome CONVERTED
    actor: Agent
    preconditions:
    - lead_status == LIVE_CONNECTED
    - acting agent == lead.accepted_agent_id
    side_effects:
    - Agent.leads_converted += 1; Agent.rolling_score recomputed
  - from: LIVE_CONNECTED
    to: CLOSED_LOST
    trigger: POST /leads/{id}/close with outcome LOST
    actor: Agent
    preconditions:
    - lead_status == LIVE_CONNECTED
    - acting agent == lead.accepted_agent_id
    side_effects:
    - Agent.leads_closed_lost += 1; Agent.rolling_score recomputed
- entity: LeadAssignment
  initial_state: OFFERED
  terminal_states:
  - ACCEPTED
  - EXPIRED
  - CANCELLED
  transitions:
  - from: OFFERED
    to: ACCEPTED
    trigger: POST /lead-assignments/{id}/accept
    actor: Agent
    preconditions:
    - assignment_status == OFFERED
    - now < expires_at
    - lead.lead_status == ROUTED
    - acting agent in candidate_agent_ids
    side_effects:
    - set accepted_by_agent_id, accepted_at = now
    - Lead -> ASSIGNED (see Lead.ROUTED_to_ASSIGNED side effects)
    - Agent.offers_accepted += 1; Agent.response_seconds_sum += (accepted_at - offered_at); Agent.rolling_score recomputed
  - from: OFFERED
    to: EXPIRED
    trigger: 'POST /ops-runs sweep: expires_at <= now'
    actor: system
    preconditions:
    - assignment_status == OFFERED
    - expires_at <= now
    side_effects:
    - each candidate Agent.offers_expired += 1 and rolling_score recomputed
    - 'if lead reroutes: new LeadAssignment created (Lead.ROUTED_to_ROUTED); else Lead -> UNASSIGNED'
  - from: OFFERED
    to: CANCELLED
    trigger: POST /leads/{id}/cancel (lead-level operator cancel cancels the open offer)
    actor: MarketplaceOps
    preconditions:
    - assignment_status == OFFERED
    - lead.lead_status == ROUTED
    side_effects:
    - Lead -> UNASSIGNED with credit settlement (see Lead.ROUTED_to_UNASSIGNED cancel path)
- entity: LiveConnection
  initial_state: REQUESTED
  terminal_states:
  - COMPLETED
  - NO_ANSWER
  - REJECTED_DUPLICATE
  transitions:
  - from: REQUESTED
    to: BRIDGING
    trigger: 'POST /live-connections: caller requests a live transfer of a consumer on an ASSIGNED lead they own'
    actor: Agent
    preconditions:
    - lead.lead_status == ASSIGNED
    - lead.accepted_agent_id == acting agent
    - no duplicate connection for same consumer in market
    side_effects:
    - set agent_id = lead.accepted_agent_id; share_order_id = lead.share_order_id
  - from: REQUESTED
    to: REJECTED_DUPLICATE
    trigger: POST /live-connections duplicate guard (same consumer in market within window, or same listing agent)
    actor: system
    preconditions:
    - duplicate guard fires (validations duplicate_lead_window / duplicate_lead_same_agent)
    side_effects:
    - set duplicate_of_lead_id = anchor lead
  - from: BRIDGING
    to: COMPLETED
    trigger: POST /live-connections/{id}/record with consent_given and duration_seconds > 0
    actor: Agent
    preconditions:
    - connection_status == BRIDGING
    - agent owns the connection
    side_effects:
    - create CallRecording (STORED) with recording_retention_expires_at = now + 90 days
    - Lead -> LIVE_CONNECTED
  - from: BRIDGING
    to: NO_ANSWER
    trigger: POST /live-connections/{id}/record with duration_seconds == 0 or explicit no_answer outcome
    actor: Agent
    preconditions:
    - connection_status == BRIDGING
    side_effects:
    - Agent.connections_missed += 1; Agent.rolling_score recomputed
    - no CallRecording created
  - from: BRIDGING
    to: DROPPED
    trigger: POST /live-connections/{id}/record with consent_given == false (cannot store)
    actor: Agent
    preconditions:
    - connection_status == BRIDGING
    side_effects:
    - no CallRecording; Lead remains ASSIGNED (agent can retry)
    note: DROPPED is non-terminal for the lead but terminal for this connection attempt; a fresh connection request may be created.
- entity: CreditClaim
  initial_state: SUBMITTED
  terminal_states:
  - APPROVED
  - REJECTED
  transitions:
  - from: SUBMITTED
    to: APPROVED
    trigger: POST /credit-claims/{id}/resolve with approve
    actor: MarketplaceOps
    preconditions:
    - claim_status == SUBMITTED
    - lead has not already been credited by another approved claim
    side_effects:
    - credit_cents = finalized charge for the lead if claim_type == INVALID; = half of finalized charge if claim_type == DUPLICATE (calculation
      refund_credit)
    - ShareOrder.credits_cents += credit_cents; ShareOrder.leads_credited += 1
    - each affected Agent.credits_cents += (charge share allocated at finalize) if team order; else full credit to claimant agent
  - from: SUBMITTED
    to: REJECTED
    trigger: POST /credit-claims/{id}/resolve with reject
    actor: MarketplaceOps
    preconditions:
    - claim_status == SUBMITTED
    side_effects:
    - credit_cents = 0; no ledger mutation
- entity: Listing
  initial_state: PENDING_REVIEW
  terminal_states:
  - REJECTED
  - WITHDRAWN
  transitions:
  - from: PENDING_REVIEW
    to: ACTIVE
    trigger: POST /listings/{id}/review with approve
    actor: MarketplaceOps
    preconditions:
    - listing_status == PENDING_REVIEW
    - market.participation_agreement allows this feed (calculation display_rule_check)
    side_effects:
    - listing becomes routable for lead intake
  - from: PENDING_REVIEW
    to: REJECTED
    trigger: POST /listings/{id}/review with reject
    actor: MarketplaceOps
    preconditions:
    - listing_status == PENDING_REVIEW
    side_effects:
    - compliance_note recorded
  - from: ACTIVE
    to: WITHDRAWN
    trigger: POST /listings/{id}/withdraw or POST /disputes resolve with REMOVE
    actor: MarketplaceOps
    preconditions:
    - listing_status == ACTIVE
    side_effects:
    - compliance_note recorded; new leads referencing this listing rejected
    - existing leads remain unaffected
- entity: Dispute
  initial_state: OPEN
  terminal_states:
  - RESOLVED
  - REJECTED
  transitions:
  - from: OPEN
    to: RESOLVED
    trigger: POST /disputes/{id}/resolve with resolution and outcome
    actor: MarketplaceOps
    preconditions:
    - dispute_status == OPEN
    - resolution valid for dispute_type
    side_effects:
    - 'if LISTING_DISPLAY and resolution == REMOVE: listing -> WITHDRAWN'
    - 'if LEAD_ATTRIBUTION and resolution == REASSIGN: lead.listing_agent_id updated to requested_agent_id'
  - from: OPEN
    to: REJECTED
    trigger: POST /disputes/{id}/resolve with reject
    actor: MarketplaceOps
    preconditions:
    - dispute_status == OPEN
    side_effects:
    - no downstream mutation
- entity: Agent
  initial_state: ACTIVE
  terminal_states:
  - DEACTIVATED
  transitions:
  - from: ACTIVE
    to: SUSPENDED
    trigger: POST /agents/{id}/suspend by MarketplaceOps or automatic rule (3 consecutive NO_ANSWER)
    actor: MarketplaceOps
    preconditions:
    - agent_status == ACTIVE
    side_effects:
    - agent excluded from selector pools; open offers remain but cannot be accepted
  - from: SUSPENDED
    to: ACTIVE
    trigger: POST /agents/{id}/unsuspend
    actor: MarketplaceOps
    preconditions:
    - agent_status == SUSPENDED
    side_effects:
    - agent re-enters selector pools
  - from: ACTIVE
    to: DEACTIVATED
    trigger: POST /agents/{id}/deactivate
    actor: Agent
    preconditions:
    - agent_status == ACTIVE
    - no ACTIVE or PAUSED ShareOrders
    - no ACTIVE TeamMemberships
    side_effects:
    - permanent exclusion; terminal
- entity: Market
  initial_state: OPEN
  terminal_states: []
  transitions:
  - from: OPEN
    to: SUSPENDED
    trigger: POST /markets/{id}/suspend
    actor: MarketplaceOps
    preconditions:
    - market_status == OPEN
    side_effects:
    - no new share orders, leads, or listings accepted
  - from: SUSPENDED
    to: OPEN
    trigger: POST /markets/{id}/reopen
    actor: MarketplaceOps
    preconditions:
    - market_status == SUSPENDED
    side_effects:
    - market re-opens
- entity: TeamAccount
  initial_state: ACTIVE
  terminal_states:
  - DISSOLVED
  transitions:
  - from: ACTIVE
    to: DISSOLVED
    trigger: POST /team-accounts/{id}/dissolve
    actor: Agent
    preconditions:
    - team_status == ACTIVE
    - no ACTIVE or PAUSED ShareOrders for this team
    side_effects:
    - all TeamMemberships -> REMOVED
- entity: CallRecording
  initial_state: STORED
  terminal_states:
  - PURGED
  transitions:
  - from: STORED
    to: PURGED
    trigger: 'POST /ops-runs sweep: now > recording_retention_expires_at'
    actor: system
    preconditions:
    - recording_status == STORED
    - now > recording_retention_expires_at
    side_effects:
    - recording data deleted; metadata retained for audit
- entity: PerformanceSnapshot
  initial_state: FINAL
  terminal_states:
  - FINAL
  transitions: []
concurrency_rules:
- rule_id: share-order-activation-stale-market
  parent_entity: Market
  write_endpoint: POST /share-orders/{id}/payments
  occ_field: expected_market_version
  description: 'Activating a ShareOrder against a Market whose version has advanced since the client

    last observed it is rejected. Another writer may have just activated, paused, or

    resumed an order (mutating allocated_bps), or an ops run may have swept expirations —

    the current writer''s view of available capacity is therefore stale.

    '
  error_id: ERR_STALE_MARKET_VERSION
  http_status: 412
- rule_id: lead-assignment-accept-stale-lead
  parent_entity: Lead
  write_endpoint: POST /lead-assignments/{id}/accept
  occ_field: expected_lead_version
  description: 'Accepting a LeadAssignment against a Lead whose version has advanced since the client

    last observed it is rejected. An ops sweep may have expired the offer and rerouted,

    or another candidate may have just accepted, making the current accept stale.

    '
  error_id: ERR_STALE_LEAD_VERSION
  http_status: 412
calculations:
- name: share_price_quote
  trigger: POST /share-orders (quote at purchase) and GET /markets/{id}/price-quote
  algorithm: tiered_pricing
  formula: 'demand_ratio = allocated_bps / 10000.0

    tier = 1 if demand_ratio < 0.50 else 2 if demand_ratio < 0.80 else 3

    volume_discount_pct = 0.0 if share_bps < 2500 else 0.05 if share_bps < 5000 else 0.10

    unit_price_cents = floor(base_lead_price_cents * (1 + 0.25 * (tier - 1)) * (1 - volume_discount_pct))

    deposit_cents = tier * 100 * unit_price_cents

    '
  input_set: Market.allocated_bps, Market.base_lead_price_cents, requested share_bps
  constants:
    TIER_2_THRESHOLD: 0.5
    TIER_3_THRESHOLD: 0.8
    TIER_PRICE_STEP_PCT: 0.25
    VOLUME_DISCOUNT_2500: 0.05
    VOLUME_DISCOUNT_5000: 0.1
  precision: integer cents, floor division
  variants:
  - name: quoted
    when: at purchase time, before allocation
    difference: uses current allocated_bps; may shift tier if another order activates first
  - name: locked
    when: after activation, for this order's charges
    difference: tier and unit_price_cents frozen at activation; unaffected by later market changes
- name: agent_performance_score
  trigger: recomputed on every scoring event (accept, expire, close, no-answer, rating)
  algorithm: weighted_scoring
  formula: 'if offers_received == 0: score = 0 (UNRATED)

    acceptance_rate = offers_accepted / offers_received

    conversion_rate = leads_converted / max(1, leads_converted + leads_closed_lost)

    avg_response_seconds = response_seconds_sum / max(1, offers_accepted)

    response_score = max(0, 100 - (avg_response_seconds / 30))  # 100 if instant, 0 at 50 min

    connection_score = 100 * (1 - connections_missed / max(1, offers_accepted))

    rating_avg = rating_sum / max(1, rating_count)

    score = round(0.25 * acceptance_rate * 100 + 0.20 * conversion_rate * 100 + 0.20 * response_score + 0.20 * connection_score + 0.15 * rating_avg
    * 20)

    '
  input_set: 'Agent counters: offers_received, offers_accepted, offers_expired, response_seconds_sum, leads_converted, leads_closed_lost, connections_missed,
    rating_sum, rating_count'
  constants:
    W_ACCEPTANCE: 0.25
    W_CONVERSION: 0.2
    W_RESPONSE: 0.2
    W_CONNECTION: 0.2
    W_RATING: 0.15
    RESPONSE_SCORE_FLOOR_SECONDS: 3000
  precision: integer score 0..100, round half-up
  variants:
  - name: ROLLING
    when: provisional, recomputed on every event using all-time counters
    difference: live view used for selector tie-breaks and tier display
  - name: OFFICIAL
    when: snapshot at ops run, using only events within (prior_run_at, run_at]
    difference: windowed; drives performance_tier and future allocation weighting
- name: team_charge_split
  trigger: finalize_charge for a team-routed lead
  algorithm: waterfall_allocation
  formula: '# Distribute charge_cents across ACTIVE TeamMemberships of the team, proportional to allocation_weight.

    # Round per-member then reconcile remainder to the member with largest allocation_weight, then created_at.

    total_weight = sum(allocation_weight of ACTIVE memberships)

    member_share_cents[m] = floor(charge_cents * allocation_weight[m] / total_weight)

    remainder = charge_cents - sum(member_share_cents)

    distribute remainder 1 cent at a time to members in order: allocation_weight DESC, created_at ASC

    '
  input_set: TeamMemberships with membership_status == ACTIVE for the team, charge_cents
  precision: integer cents, exact sum
  variants: []
- name: refund_credit
  trigger: CreditClaim resolved APPROVED
  algorithm: threshold
  formula: 'if claim_type == INVALID: credit_cents = finalized_charge_cents

    if claim_type == DUPLICATE: credit_cents = floor(finalized_charge_cents / 2)

    '
  input_set: Lead's finalized charge for the routed order
  precision: integer cents, floor for half
  variants: []
- name: display_rule_check
  trigger: Listing review (PENDING_REVIEW -> ACTIVE) and lead intake
  algorithm: constraint_propagation
  formula: 'if market.participation_agreement == IDX_FULL: allowed for all feeds

    if market.participation_agreement == IDX_LIMITED: allowed only if source_feed == MLS or listing_brokerage.primary_state == market.state_code

    if market.participation_agreement == NON_PARTICIPATING: no listings allowed (review must reject)

    '
  input_set: Market.participation_agreement, Listing.source_feed, Listing.brokerage.primary_state, Market.state_code
  variants: []
- name: lead_allocation
  trigger: POST /leads and POST /live-connections at creation
  algorithm: selector_policy
  formula: '# Step 1: pick winning ShareOrder (share-proportional deterministic)

    active_orders = ShareOrders in market with order_status == ACTIVE, sorted by (share_bps DESC, activated_at ASC)

    total_bps = sum(share_bps)

    routing_key = (lead.consumer_key hash mod total_bps)  # deterministic per consumer

    walk orders in sorted order, accumulate share_bps; first order where cumulative >= routing_key wins

    # Step 2: pick candidate agents from winning order (see lead_assignment_selector)

    '
  input_set: ACTIVE ShareOrders in market, lead.consumer_key
  precision: integer basis-point walk
  variants: []
- name: lead_assignment_selector
  trigger: LeadAssignment creation
  algorithm: selector_policy
  formula: "eligible = Agents where:\n  agent_status == ACTIVE\n  performance_tier != INELIGIBLE\n  license_state == market.state_code\n  (solo\
    \ order: agent == buyer_agent_id) OR (team order: agent has ACTIVE TeamMembership in team)\nsort by: performance_tier rank (HIGH > STANDARD\
    \ > LOW > UNRATED), then rolling_score DESC, then created_at ASC\ntake top 3\n"
  input_set: Agents in market, winning ShareOrder
  variants: []
- name: team_member_selector
  trigger: Lead -> ASSIGNED for team order
  algorithm: selector_policy
  formula: 'eligible = TeamMemberships with membership_status == ACTIVE

    deficit = (leads_assigned / allocation_weight)  # lower deficit = more owed

    sort by: deficit ASC, then allocation_weight DESC, then created_at ASC

    first member wins

    '
  input_set: TeamMemberships of the team
  variants: []
- name: ops_run_sweep
  trigger: POST /ops-runs
  algorithm: chronological
  formula: '1. Expire LeadAssignments where expires_at <= now and status == OFFERED -> EXPIRED

    2. For each expired assignment: reroute Lead if pool non-empty, else Lead -> UNASSIGNED with credit

    3. Expire ShareOrders where ends_at <= now and status == ACTIVE -> COMPLETED or CANCELLED

    4. Purge CallRecordings where recording_retention_expires_at < now and status == STORED -> PURGED

    5. Snapshot all ACTIVE agents -> PerformanceSnapshot (OFFICIAL score)

    '
  input_set: All entities with time-based expiry
  precision: epoch-second comparisons
  variants: []
validations:
- priority: 1
  category: auth
  check: X-User-Role and X-User-ID headers present and well-formed
  error_id: ERR_UNAUTHENTICATED
  http_status: 401
  applies_to: all
- priority: 2
  category: auth
  check: Role permitted for this endpoint per §1.7
  error_id: ERR_UNAUTHORIZED
  http_status: 403
  applies_to: all
- priority: 3
  category: existence
  check: All path ids exist and are of the expected entity type
  error_id: ERR_NOT_FOUND
  http_status: 404
  applies_to: all
- priority: 4
  category: state
  check: Target resource is in a state that permits this operation
  error_id: ERR_INVALID_STATE
  http_status: 409
  applies_to: all
- priority: 5
  category: business_safety
  check: Agent license_state matches market.state_code for share purchase and routing eligibility
  error_id: ERR_LICENSE_STATE_MISMATCH
  http_status: 422
  applies_to: POST /share-orders, POST /lead-assignments/{id}/accept, POST /leads/{id}/assign
- priority: 6
  category: business_safety
  check: Listing display rules per market participation agreement (display_rule_check)
  error_id: ERR_LISTING_DISPLAY_VIOLATION
  http_status: 422
  applies_to: POST /listings/{id}/review, POST /listings
- priority: 7
  category: business_constraint
  check: Share order aggregate allocation does not exceed 10000 bps in market
  error_id: ERR_SHARE_CAPACITY_EXCEEDED
  http_status: 422
  applies_to: POST /share-orders, POST /share-orders/{id}/payments, POST /share-orders/{id}/resume
- priority: 8
  category: business_temporal
  check: Offer not expired (now < expires_at)
  error_id: ERR_OFFER_EXPIRED
  http_status: 422
  applies_to: POST /lead-assignments/{id}/accept
- priority: 9
  category: business_temporal
  check: 'No duplicate lead: same consumer_key in market within 30 days, or same consumer_key + listing_agent_id'
  error_id: ERR_DUPLICATE_LEAD
  http_status: 422
  applies_to: POST /leads, POST /live-connections
- priority: 10
  category: business_referential
  check: Team membership active; team not dissolved; order belongs to team if team_id present
  error_id: ERR_TEAM_MEMBERSHIP_INVALID
  http_status: 422
  applies_to: POST /team-memberships, POST /share-orders (team), POST /leads/{id}/assign
- priority: 11
  category: business_fiscal
  check: Payment amount exact and order not already settled
  error_id: ERR_PAYMENT_AMOUNT_MISMATCH
  http_status: 422
  applies_to: POST /share-orders/{id}/payments
- priority: 12
  category: business_fiscal
  check: Credit claim references a finalized, charged, uncredited lead
  error_id: ERR_CREDIT_CLAIM_INVALID
  http_status: 422
  applies_to: POST /credit-claims
- priority: 13
  category: business_constraint
  check: No more than 3 candidates per offer; no candidate repeats across reroute attempts
  error_id: ERR_CANDIDATE_POOL_EXHAUSTED
  http_status: 422
  applies_to: POST /leads (reroute path), POST /ops-runs
- priority: 14
  category: business_constraint
  check: Expected version matches current version for OCC-guarded writes
  error_id: ERR_STALE_MARKET_VERSION
  http_status: 412
  applies_to: POST /share-orders/{id}/payments
- priority: 15
  category: business_constraint
  check: Expected version matches current version for OCC-guarded writes
  error_id: ERR_STALE_LEAD_VERSION
  http_status: 412
  applies_to: POST /lead-assignments/{id}/accept
endpoints:
- method: POST
  path: /_clock/set_current_utc
  description: Set logical clock. Server startup default is 2026-09-01T00:00:00Z; before any set_current_utc call the clock reads exactly that
    instant and never falls back to wall-clock time.
  roles:
  - MarketplaceOps
  - PlatformAdmin
  code: 200
  input:
  - current_utc
  output: '{ current_utc: string }'
  side_effects: []
- method: POST
  path: /ops-runs
  description: 'Execute ops sweep (calculation ops_run_sweep): expire offers and reroute or unassign, expire orders, purge recordings, snapshot
    agents'
  roles:
  - MarketplaceOps
  - PlatformAdmin
  code: 201
  input: []
  output: OpsRun
  side_effects:
  - ops_run_sweep
- method: POST
  path: /markets
  description: Create a zip-code market
  roles:
  - MarketplaceOps
  - PlatformAdmin
  code: 201
  input:
  - zip_code
  - state_code
  - base_lead_price_cents
  - participation_agreement?
  output: Market
  side_effects: []
- method: GET
  path: /markets
  description: List markets with filters and pagination
  roles:
  - Agent
  - BrokerageUser
  - MarketplaceOps
  - PlatformAdmin
  code: 200
  input:
  - state_code?
  - market_status?
  - limit?
  - offset?
  output: Market[]
  side_effects: []
- method: GET
  path: /markets/{id}
  description: Get market detail including allocated_bps, available_bps, current_unit_price_cents
  roles:
  - Agent
  - BrokerageUser
  - MarketplaceOps
  - PlatformAdmin
  code: 200
  input: []
  output: Market
  side_effects: []
- method: GET
  path: /markets/{id}/price-quote
