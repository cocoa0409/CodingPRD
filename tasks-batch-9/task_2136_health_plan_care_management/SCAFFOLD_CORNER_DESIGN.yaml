scaffold_corner_design:
  - section: entities
    instances:
      - name: member_creation_returns_declared_fields_with_null_risk_snapshots
        claim_type: creation
        grounds: ["entities.Member.fields.external_member_id", "entities.Member.fields.latest_concurrent_tier", "endpoints.POST./care-management/members"]
        distinguishing_aspect: "POST /care-management/members with every required field returns HTTP 201 and a Member whose four latest_* risk fields are all null because no RiskStratification exists yet."
        test_recipe:
          setup:
            - "Empty database; clock at its 2026-08-01T00:00:00Z startup default."
          setup_api_calls:
            - call: "POST /care-management/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "POST /care-management/members"
              payload: { external_member_id: "MBR-3101", full_name: "Ada Stone", birth_date: "1970-01-01", state_code: "CA", chronic_condition_count: 2, social_data_consent_status: "GRANTED" }
              as: ProgramAdmin
              captures: { m: $.data.id, ver: $.data.version, created: $.data.created_at }
          assert:
            - "HTTP 201"
            - "Member.${m}.external_member_id == MBR-3101 and Member.${m}.state_code == CA"
            - "Member.${m}.chronic_condition_count == 2"
            - "Member.${m}.latest_concurrent_score == null and Member.${m}.latest_concurrent_tier == null"
            - "Member.${m}.latest_prospective_score == null and Member.${m}.latest_prospective_tier == null"
            - "${ver} == 1"
            - "response envelope carries meta.api_request_id, meta.api_request_timestamp and response_type == object"

      - name: member_retrieval_returns_stored_entity
        claim_type: retrieval
        grounds: ["endpoints.GET./care-management/members/{id}", "entities.Member.fields.full_name"]
        distinguishing_aspect: "GET /care-management/members/{id} returns exactly the row created, with the same id and unchanged version 1."
        test_recipe:
          setup: ["One Member exists."]
          setup_api_calls:
            - call: "POST /care-management/members"
              payload: { external_member_id: "MBR-3102", full_name: "Bo Frey", birth_date: "1969-02-02", state_code: "NY", chronic_condition_count: 1 }
              as: ProgramAdmin
              captures: { m: $.data.id }
          trigger:
            - call: "GET /care-management/members/${m}"
              payload: {}
              as: CareManager
              as_user_id: "unused-care-manager-identity"
              captures: { got: $.data.id, name: $.data.full_name, ver: $.data.version }
          assert:
            - "HTTP 200"
            - "${got} == ${m}"
            - "${name} == Bo Frey"
            - "${ver} == 1"

      - name: member_listing_paginates_with_limit_and_offset
        claim_type: listing
        grounds: ["endpoints.GET./care-management/members", "response_envelope.pagination_fields"]
        distinguishing_aspect: "GET /care-management/members with limit 2 and offset 1 over three members returns 2 rows, total_count 3 and has_more false."
        test_recipe:
          setup: ["Exactly three Members exist, created in a fixed order."]
          setup_api_calls:
            - call: "POST /care-management/members"
              payload: { external_member_id: "MBR-3201", full_name: "One", birth_date: "1960-01-01", state_code: "CA", chronic_condition_count: 0 }
              as: ProgramAdmin
            - call: "POST /care-management/members"
              payload: { external_member_id: "MBR-3202", full_name: "Two", birth_date: "1961-01-01", state_code: "CA", chronic_condition_count: 0 }
              as: ProgramAdmin
            - call: "POST /care-management/members"
              payload: { external_member_id: "MBR-3203", full_name: "Three", birth_date: "1962-01-01", state_code: "CA", chronic_condition_count: 0 }
              as: ProgramAdmin
          trigger:
            - call: "GET /care-management/members"
              payload: { limit: 2, offset: 1 }
              as: UtilizationAnalyst
          assert:
            - "HTTP 200 and response_type == array"
            - "the returned array has exactly 2 elements"
            - "meta pagination reports total_count == 3, limit == 2, offset == 1, has_more == false"

      - name: member_get_unknown_id_returns_member_not_found
        claim_type: not_found
        grounds: ["errors[ERR_MEMBER_NOT_FOUND]", "validations[priority=10]"]
        distinguishing_aspect: "A syntactically valid but unknown UUID on GET /care-management/members/{id} returns ERR_MEMBER_NOT_FOUND with HTTP 404."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls:
            - call: "POST /care-management/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "GET /care-management/members/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              payload: {}
              as: ProgramAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 404"
            - "${err} == ERR_MEMBER_NOT_FOUND"
            - "response_type == error"

      - name: member_create_missing_state_code_returns_invalid_request
        claim_type: required_fields
        grounds: ["validations[priority=5]", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Omitting the required state_code from POST /care-management/members returns ERR_INVALID_REQUEST with HTTP 400 and persists nothing."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls:
            - call: "POST /care-management/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "POST /care-management/members"
              payload: { external_member_id: "MBR-3301", full_name: "No State", birth_date: "1970-01-01" }
              as: ProgramAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 400"
            - "${err} == ERR_INVALID_REQUEST"
            - "GET /care-management/members returns total_count == 0"

      - name: member_create_without_optional_fields_applies_declared_defaults
        claim_type: defaults
        grounds: ["entities.Member.fields.chronic_condition_count", "entities.Member.fields.social_data_consent_status"]
        distinguishing_aspect: "Omitting chronic_condition_count and social_data_consent_status yields the declared defaults 0 and GRANTED rather than nulls."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls:
            - call: "POST /care-management/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "POST /care-management/members"
              payload: { external_member_id: "MBR-3401", full_name: "Default Dee", birth_date: "1980-03-03", state_code: "CA" }
              as: ProgramAdmin
              captures: { m: $.data.id, cc: $.data.chronic_condition_count, consent: $.data.social_data_consent_status }
          assert:
            - "HTTP 201"
            - "${cc} == 0"
            - "${consent} == GRANTED"

      - name: care_manager_create_rejects_computed_caseload_field
        claim_type: computed_fields
        grounds: ["entities.CareManager.fields.assigned_caseload_points", "validations[priority=5]"]
        distinguishing_aspect: "assigned_caseload_points is source computed and is not in the create endpoint's input, so supplying it returns ERR_INVALID_REQUEST; a clean create starts the ledger at 0.0 with capacity_status OPEN."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls:
            - call: "POST /care-management/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "POST /care-management/care-managers"
              payload: { full_name: "Sly Injector", credential_level: "RN", licensed_state_codes: ["CA"], capacity_points: 8.0, assigned_caseload_points: 99.0 }
              as: ProgramAdmin
              captures: { err: $.data.error_id }
            - call: "POST /care-management/care-managers"
              payload: { full_name: "Clean Create", credential_level: "RN", licensed_state_codes: ["CA"], capacity_points: 8.0 }
              as: ProgramAdmin
              captures: { cm: $.data.id, load: $.data.assigned_caseload_points, status: $.data.capacity_status }
          assert:
            - "the first call returns HTTP 400 with ${err} == ERR_INVALID_REQUEST"
            - "${load} == 0.0"
            - "${status} == OPEN"
            - "CareManager.${cm}.active_enrollment_count == 0"

      - name: member_system_fields_are_server_minted_untyped_uuids
        claim_type: system_fields
        grounds: ["entities.Member.fields.external_member_id", "response_envelope.success"]
        distinguishing_aspect: "Member.id is a bare 36-character UUID with no type prefix, created_at and updated_at are ISO 8601 UTC with exactly three fractional digits, and version starts at 1."
        test_recipe:
          setup: ["Clock pinned to 2026-08-01T00:00:00Z."]
          setup_api_calls:
            - call: "POST /care-management/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "POST /care-management/members"
              payload: { external_member_id: "MBR-3501", full_name: "Uid Probe", birth_date: "1975-04-04", state_code: "CA" }
              as: ProgramAdmin
              captures: { m: $.data.id, created: $.data.created_at, updated: $.data.updated_at, ver: $.data.version }
          assert:
            - "${m} matches the bare UUID form 8-4-4-4-12 with no prefix before the first hyphen group"
            - "${created} == 2026-08-01T00:00:00.000Z"
            - "${updated} == 2026-08-01T00:00:00.000Z"
            - "${ver} == 1"

      - name: stratification_with_undeclared_variant_returns_invalid_request
        claim_type: type_constraints
        grounds: ["entities.RiskStratification.fields.variant", "validations[priority=5]", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "variant accepts only CONCURRENT or PROSPECTIVE, so the value RETROSPECTIVE returns ERR_INVALID_REQUEST with HTTP 400 and appends no RiskStratification."
        test_recipe:
          setup: ["One Member exists with no stratifications."]
          setup_api_calls:
            - call: "POST /care-management/members"
              payload: { external_member_id: "MBR-3601", full_name: "Enum Probe", birth_date: "1979-09-09", state_code: "CA", chronic_condition_count: 1 }
              as: ProgramAdmin
              captures: { m: $.data.id }
          trigger:
            - call: "POST /care-management/members/${m}/stratifications"
              payload: { variant: "RETROSPECTIVE" }
              as: UtilizationAnalyst
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 400"
            - "${err} == ERR_INVALID_REQUEST"
            - "GET /care-management/members/${m}/stratifications returns an empty array with total_count == 0"

      - name: risk_stratification_rows_are_append_only_without_version
        claim_type: immutability
        grounds: ["entities.RiskStratification", "endpoints.GET./care-management/members/{id}/stratifications"]
        distinguishing_aspect: "RiskStratification has common_fields false, so each run appends a new row carrying only id and created_at - two CONCURRENT runs on the same member yield two distinct rows rather than an updated one, and no update endpoint exists."
        test_recipe:
          setup: ["One Member with chronic_condition_count 5 and no events."]
          setup_api_calls:
            - call: "POST /care-management/members"
              payload: { external_member_id: "MBR-3701", full_name: "Append Ann", birth_date: "1963-06-06", state_code: "CA", chronic_condition_count: 5 }
              as: ProgramAdmin
              captures: { m: $.data.id }
          trigger:
            - call: "POST /care-management/members/${m}/stratifications"
              payload: { variant: "CONCURRENT" }
              as: UtilizationAnalyst
              captures: { s1: $.data.id, sc1: $.data.score }
            - call: "POST /care-management/members/${m}/stratifications"
              payload: { variant: "CONCURRENT" }
              as: UtilizationAnalyst
              captures: { s2: $.data.id, sc2: $.data.score }
            - call: "GET /care-management/members/${m}/stratifications"
              payload: { variant: "CONCURRENT" }
              as: UtilizationAnalyst
          assert:
            - "${s1} != ${s2}"
            - "${sc1} == 30 and ${sc2} == 30"
            - "the list returns exactly 2 rows with total_count == 2"
            - "neither row exposes a version field"
            - "Member.${m}.latest_concurrent_tier == LOW"

      - name: discharge_referencing_unknown_index_admission_returns_transition_event_not_found
        claim_type: parent_relationships
        grounds: ["entities.TransitionEvent.fields.index_admission_event_id", "validations[priority=12]", "errors[ERR_TRANSITION_EVENT_NOT_FOUND]"]
        distinguishing_aspect: "index_admission_event_id is a self-referential FK into TransitionEvent, so a DISCHARGE naming an unknown event id returns ERR_TRANSITION_EVENT_NOT_FOUND with HTTP 404."
        test_recipe:
          setup: ["One Member exists; no TransitionEvents exist."]
          setup_api_calls:
            - call: "POST /care-management/members"
              payload: { external_member_id: "MBR-3801", full_name: "Ref Probe", birth_date: "1959-05-05", state_code: "CA" }
              as: ProgramAdmin
              captures: { m: $.data.id }
          trigger:
            - call: "POST /care-management/transition-events"
              payload: { member_id: "${m}", event_type: "DISCHARGE", occurred_at: "2026-08-01T00:00:00Z", facility_name: "Bay General", adjudication_status: "CLOSED", discharge_disposition: "HOME", index_admission_event_id: "8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2" }
              as: ProgramAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 404"
            - "${err} == ERR_TRANSITION_EVENT_NOT_FOUND"
            - "GET /care-management/transition-events with member_id filter returns total_count == 0"

      - name: goal_creation_under_unknown_care_plan_returns_care_plan_not_found
        claim_type: parent_relationships
        grounds: ["validations[priority=10]", "errors[ERR_CARE_PLAN_NOT_FOUND]"]
        distinguishing_aspect: "CarePlanGoal is created under its parent path, so an unknown care_plan_id returns ERR_CARE_PLAN_NOT_FOUND with HTTP 404 before any body validation runs."
        test_recipe:
          setup: ["One CareManager exists; no CarePlans exist."]
          setup_api_calls:
            - call: "POST /care-management/care-managers"
              payload: { full_name: "Rita Nolan", credential_level: "RN", licensed_state_codes: ["CA"], capacity_points: 10.0 }
              as: ProgramAdmin
              captures: { cm_a: $.data.id }
          trigger:
            - call: "POST /care-management/care-plans/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2/goals"
              payload: { domain: "CLINICAL", description: "Ghost goal", target_date: "2026-12-01" }
              as: CareManager
              as_user_id: "${cm_a}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 404"
            - "${err} == ERR_CARE_PLAN_NOT_FOUND"

  - section: state_machines
    instances:
      - name: enrollment_starts_pending_and_unreached_with_no_cadence_clock
        claim_type: initial_state
        grounds: ["state_machines.Enrollment.PENDING_to_ACTIVE", "entities.Enrollment.fields.enrollment_status", "entities.Enrollment.fields.engagement_status"]
        distinguishing_aspect: "A freshly created Enrollment is PENDING on the lifecycle dimension and UNREACHED on the engagement dimension, with activated_at, next_touch_due_at and toc_due_at all null."
        test_recipe:
          setup: ["Program min_risk_tier LOW, one RN care manager in CA with capacity_points 20.0, one member stratified CONCURRENT."]
          setup_api_calls:
            - call: "POST /care-management/programs"
              payload: { name: "Init State Program", min_risk_tier: "LOW", stratification_variant: "CONCURRENT", required_credential_levels: ["RN"], staff_minute_budget: 100000, hourly_cost_cents: 9000, cohort_benchmark_pmpm_cents: 100000 }
              as: ProgramAdmin
              captures: { prog: $.data.id }
            - call: "POST /care-management/care-managers"
              payload: { full_name: "Rita Nolan", credential_level: "RN", licensed_state_codes: ["CA"], capacity_points: 20.0 }
              as: ProgramAdmin
              captures: { cm_a: $.data.id }
            - call: "POST /care-management/members"
              payload: { external_member_id: "MBR-4001", full_name: "Init Ivy", birth_date: "1972-02-02", state_code: "CA", chronic_condition_count: 0 }
              as: ProgramAdmin
              captures: { m: $.data.id }
            - call: "POST /care-management/members/${m}/stratifications"
              payload: { variant: "CONCURRENT" }
              as: UtilizationAnalyst
          trigger:
            - call: "POST /care-management/enrollments"
              payload: { member_id: "${m}", program_id: "${prog}", care_manager_id: "${cm_a}" }
              as: ProgramAdmin
              captures: { enr: $.data.id, st: $.data.enrollment_status, eng: $.data.engagement_status, act: $.data.activated_at, due: $.data.next_touch_due_at, toc: $.data.toc_due_at, reason: $.data.assignment_reason }
          assert:
            - "HTTP 201"
            - "${st} == PENDING and ${eng} == UNREACHED"
            - "${act} == null and ${due} == null and ${toc} == null"
            - "${reason} == EXPLICIT"
            - "Enrollment.${enr}.risk_tier_at_enrollment == LOW and Enrollment.${enr}.acuity_weight_points == 1.0"
            - "CareManager.${cm_a}.assigned_caseload_points == 1.0 and CareManager.${cm_a}.active_enrollment_count == 0"

      - name: enrollment_activate_twice_returns_enrollment_not_pending
        claim_type: idempotency
        grounds: ["state_machines.Enrollment.PENDING_to_ACTIVE", "errors[ERR_ENROLLMENT_NOT_PENDING]", "validations[priority=30]"]
        distinguishing_aspect: "Replaying activate on an already ACTIVE enrollment returns ERR_ENROLLMENT_NOT_PENDING with HTTP 409 and leaves activated_at and version untouched."
        test_recipe:
          setup: ["One ACTIVE enrollment activated at 2026-08-01T00:00:00Z."]
          setup_api_calls:
            - call: "POST /care-management/programs"
              payload: { name: "Idem Program", min_risk_tier: "LOW", stratification_variant: "CONCURRENT", required_credential_levels: ["RN"], staff_minute_budget: 100000, hourly_cost_cents: 9000, cohort_benchmark_pmpm_cents: 100000 }
              as: ProgramAdmin
              captures: { prog: $.data.id }
            - call: "POST /care-management/care-managers"
              payload: { full_name: "Rita Nolan", credential_level: "RN", licensed_state_codes: ["CA"], capacity_points: 20.0 }
              as: ProgramAdmin
              captures: { cm_a: $.data.id }
            - call: "POST /care-management/members"
              payload: { external_member_id: "MBR-4101", full_name: "Idem Ida", birth_date: "1973-03-03", state_code: "CA", chronic_condition_count: 0 }
              as: ProgramAdmin
              captures: { m: $.data.id }
            - call: "POST /care-management/members/${m}/stratifications"
              payload: { variant: "CONCURRENT" }
              as: UtilizationAnalyst
            - call: "POST /care-management/enrollments"
              payload: { member_id: "${m}", program_id: "${prog}", care_manager_id: "${cm_a}" }
              as: ProgramAdmin
              captures: { enr: $.data.id }
            - call: "POST /care-management/enrollments/${enr}/activate"
              payload: {}
              as: ProgramAdmin
              captures: { act1: $.data.activated_at, v1: $.data.version }
          trigger:
            - call: "POST /care-management/enrollments/${enr}/activate"
              payload: {}
              as: ProgramAdmin
              captures: { err: $.data.error_id }
            - call: "GET /care-management/enrollments/${enr}"
              payload: {}
              as: ProgramAdmin
              captures: { act2: $.data.activated_at, v2: $.data.version }
          assert:
            - "HTTP 409"
            - "${err} == ERR_ENROLLMENT_NOT_PENDING"
            - "${act1} == 2026-08-01T00:00:00.000Z and ${act2} == ${act1}"
            - "${v2} == ${v1}"

      - name: enrollment_disenroll_after_disenroll_returns_already_terminal
        claim_type: terminal_state_lockdown
        grounds: ["state_machines.Enrollment.ACTIVE_to_DISENROLLED", "errors[ERR_ENROLLMENT_ALREADY_TERMINAL]"]
        distinguishing_aspect: "DISENROLLED is terminal on the lifecycle dimension, so a second disenroll returns ERR_ENROLLMENT_ALREADY_TERMINAL with HTTP 409 and does not re-run any cascade."
        test_recipe:
          setup: ["One enrollment already DISENROLLED from PENDING."]
          setup_api_calls:
            - call: "POST /care-management/programs"
              payload: { name: "Terminal Program", min_risk_tier: "LOW", stratification_variant: "CONCURRENT", required_credential_levels: ["RN"], staff_minute_budget: 100000, hourly_cost_cents: 9000, cohort_benchmark_pmpm_cents: 100000 }
              as: ProgramAdmin
              captures: { prog: $.data.id }
            - call: "POST /care-management/care-managers"
              payload: { full_name: "Rita Nolan", credential_level: "RN", licensed_state_codes: ["CA"], capacity_points: 20.0 }
              as: ProgramAdmin
              captures: { cm_a: $.data.id }
            - call: "POST /care-management/members"
              payload: { external_member_id: "MBR-4201", full_name: "Term Tom", birth_date: "1974-04-04", state_code: "CA", chronic_condition_count: 0 }
              as: ProgramAdmin
              captures: { m: $.data.id }
            - call: "POST /care-management/members/${m}/stratifications"
              payload: { variant: "CONCURRENT" }
              as: UtilizationAnalyst
            - call: "POST /care-management/enrollments"
              payload: { member_id: "${m}", program_id: "${prog}", care_manager_id: "${cm_a}" }
              as: ProgramAdmin
              captures: { enr: $.data.id }
            - call: "POST /care-management/enrollments/${enr}/disenroll"
              payload: { reason: "INELIGIBLE" }
              as: ProgramAdmin
              captures: { st1: $.data.enrollment_status, dis1: $.data.disenrolled_at }
          trigger:
            - call: "POST /care-management/enrollments/${enr}/disenroll"
              payload: { reason: "MEMBER_REQUEST" }
              as: ProgramAdmin
              captures: { err: $.data.error_id }
            - call: "GET /care-management/enrollments/${enr}"
              payload: {}
              as: ProgramAdmin
              captures: { reason_final: $.data.disenrollment_reason, dis2: $.data.disenrolled_at }
          assert:
            - "${st1} == DISENROLLED"
            - "HTTP 409 on the second call with ${err} == ERR_ENROLLMENT_ALREADY_TERMINAL"
            - "${reason_final} == INELIGIBLE"
            - "${dis2} == ${dis1}"
            - "CareManager.${cm_a}.assigned_caseload_points == 0.0"

      - name: care_plan_review_from_draft_returns_not_in_review
        claim_type: invalid_transition
        grounds: ["state_machines.CarePlan.PENDING_REVIEW_to_ACTIVE", "errors[ERR_CARE_PLAN_NOT_IN_REVIEW]"]
        distinguishing_aspect: "Only PENDING_REVIEW accepts a review decision, so reviewing a DRAFT plan returns ERR_CARE_PLAN_NOT_IN_REVIEW with HTTP 409 and leaves review_decision null."
        test_recipe:
          setup: ["One DRAFT care plan with a goal on an ACTIVE enrollment; a second care manager acts as reviewer."]
          setup_api_calls:
            - call: "POST /care-management/programs"
              payload: { name: "Review Guard Program", min_risk_tier: "LOW", stratification_variant: "CONCURRENT", required_credential_levels: ["RN"], staff_minute_budget: 100000, hourly_cost_cents: 9000, cohort_benchmark_pmpm_cents: 100000 }
              as: ProgramAdmin
              captures: { prog: $.data.id }
            - call: "POST /care-management/care-managers"
              payload: { full_name: "Rita Nolan", credential_level: "RN", licensed_state_codes: ["CA"], capacity_points: 20.0 }
              as: ProgramAdmin
              captures: { cm_a: $.data.id }
            - call: "POST /care-management/care-managers"
              payload: { full_name: "Dana Ruiz", credential_level: "RN", licensed_state_codes: ["CA"], capacity_points: 20.0 }
              as: ProgramAdmin
              captures: { cm_rev: $.data.id }
            - call: "POST /care-management/members"
              payload: { external_member_id: "MBR-4301", full_name: "Rev Ray", birth_date: "1976-06-06", state_code: "CA", chronic_condition_count: 0 }
              as: ProgramAdmin
              captures: { m: $.data.id }
            - call: "POST /care-management/members/${m}/stratifications"
              payload: { variant: "CONCURRENT" }
              as: UtilizationAnalyst
            - call: "POST /care-management/enrollments"
              payload: { member_id: "${m}", program_id: "${prog}", care_manager_id: "${cm_a}" }
              as: ProgramAdmin
              captures: { enr: $.data.id }
