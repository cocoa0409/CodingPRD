        distinguishing_aspect: "With 40000000 cents of HARD_CONSTRUCTION and a 7000000-cent DEVELOPER_FEE, the cap is floor(40000000 * 0.15) = 6000000, so 6000000 is allowed, 1000000 is disallowed and moved to the non-qualified side, and the FINAL qre_total is 46000000 while classified_cost_total stays 47000000."
