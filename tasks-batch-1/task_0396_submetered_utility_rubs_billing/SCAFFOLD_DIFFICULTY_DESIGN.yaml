            - call: "POST /leases/${cil_id}/activate"
              payload: {}
              as: PropertyManager
            - call: "POST /vendor-bills"
              payload: { property_id: "${pci_id}", utility_id: "${uci_id}", period_label: "2026-06", total_cost_cents: 7059 }
              as: PropertyManager
              captures: { civb_id: $.data.id }
            - call: "POST /vendor-bills/${civb_id}/approve"
              payload: {}
              as: PropertyManager
            - call: "POST /billing-cycles"
              payload: { property_id: "${pci_id}", utility_id: "${uci_id}", vendor_bill_id: "${civb_id}", period_label: "2026-06", period_start: "2026-06-01T00:00:00Z", period_end: "2026-06-30T00:00:00Z" }
              as: PropertyManager
              captures: { cibc_id: $.data.id }
            - call: "POST /billing-cycles/${cibc_id}/lock-reads"
              payload: {}
              as: PropertyManager
            - call: "POST /billing-cycles/${cibc_id}/allocate"
