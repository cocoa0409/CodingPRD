  - rule_id: priority_pair_validation_conflict
    instances:
      - name: confirm_cancelled_order_state_beats_credit
        grounds:
          - validations[priority=6]
          - validations[priority=10]
          - errors[ERR_ORDER_INVALID_STATE]
          - errors[ERR_CREDIT_LIMIT_EXCEEDED]
        distinguishing_aspect: |
          Error-category pair (state, business_fiscal): a CANCELLED order whose total
          (12000) also exceeds the customer's remaining credit (limit 10000) fails BOTH
          the priority-6 state check and the priority-10 fiscal check; the state error
          ERR_ORDER_INVALID_STATE must win because state (6) precedes fiscal (10).
        test_recipe:
          setup:
            - "Species COD GRADE_A quote 1200 PUBLISHED; customer credit_limit 10000 (order total 12000 would exceed it)"
            - "Order SUBMITTED with one 10.00 kg line, then cancelled"
          setup_api_calls:
            - { call: "POST /species", payload: { species_code: "COD", common_name: "Atlantic Cod", labeling_name: "Cod", substitution_group: "GADOID", fresh_shelf_life_hours: 72, frozen_shelf_life_days: 30 }, as: OperationsManager, captures: { sp_id: $.data.id, sp_v: $.data.version } }
            - { call: "POST /market-quotes", payload: { species_id: "${sp_id}", grade: "GRADE_A", quote_date: "2026-08-01", price_per_kg_cents: 1200 }, as: OperationsManager, captures: { q_id: $.data.id } }
            - { call: "POST /market-quotes/${q_id}/publish", payload: { expected_species_version: "${sp_v}" }, as: OperationsManager }
            - { call: "POST /customers", payload: { business_name: "Resto Group", credit_limit_cents: 10000 }, as: OperationsManager, captures: { c_id: $.data.id } }
            - { call: "POST /sales-orders", payload: { customer_id: "${c_id}", required_delivery_date: "2026-08-05" }, as: Customer, as_user_id: "${c_id}", captures: { o_id: $.data.id } }
            - { call: "POST /order-lines", payload: { sales_order_id: "${o_id}", species_id: "${sp_id}", requested_grade: "GRADE_A", requested_qty_kg: 10.00 }, as: Customer, as_user_id: "${c_id}" }
            - { call: "POST /sales-orders/${o_id}/submit", payload: {}, as: Customer, as_user_id: "${c_id}" }
            - { call: "POST /sales-orders/${o_id}/cancel", payload: {}, as: Customer, as_user_id: "${c_id}" }
          trigger:
            - { call: "POST /sales-orders/${o_id}/confirm", payload: {}, as: OperationsManager, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_ORDER_INVALID_STATE (409), NOT ERR_CREDIT_LIMIT_EXCEEDED — priority 6 state beats priority 10 fiscal"
            - "SalesOrder.${o_id}.status == CANCELLED (unchanged)"

      - name: allocate_held_and_stale_lot_safety_beats_temporal
        grounds:
          - validations[priority=7]
          - validations[priority=8]
          - errors[ERR_LOT_ON_HOLD]
          - errors[ERR_SHELF_LIFE_INSUFFICIENT]
        distinguishing_aspect: |
          Error-category pair (business_safety, business_temporal): the target lot is
          ON_HOLD (safety, priority 7) AND its remaining shelf life (78 h at default
          clock) is below the line requirement (70 + 12 = 82 h; temporal, priority 8).
          Both checks fail; ERR_LOT_ON_HOLD must win because safety precedes temporal.
          Different category pair from confirm_cancelled_order_state_beats_credit.
        test_recipe:
          setup:
            - "COD lot of 50.00 kg (landed 2026-08-01T06:00:00Z, fresh 72h -> expires 2026-08-04T06:00:00Z; 78h remaining at default clock)"
