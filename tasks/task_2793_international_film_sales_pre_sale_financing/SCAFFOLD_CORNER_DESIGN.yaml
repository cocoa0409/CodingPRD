  # ===========================================================================
  # §1.9 breadth walk — cross_cutting_complexity_layers
  # The four §0 layers (optimistic_concurrency, cascading_side_effects,
  # dual_variant_calculation, rate_threshold_triggers) plus the cross_aggregate
  # relationship pattern and derived-field reconciliation.
  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:

      - name: optimistic_concurrency_on_publish_rejects_a_stale_film_version
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.valuation-publish-stale-film
          - errors.ERR_STALE_FILM_VERSION
          - "endpoints[POST /film-sales/territory-valuations/{id}/publish]"
        distinguishing_aspect: |
          The OCC token is the PARENT film's version, not the valuation's: an unrelated PATCH to the film
          advances it, so a publish carrying the previously observed value is refused at HTTP 412 with
          ERR_STALE_FILM_VERSION. Re-reading the film and retrying with the fresh value succeeds, which
          separates a real version comparison from an ignored field.
        test_recipe:
          setup:
            - "PACKAGING film with an executed agreement and one DRAFT CAST_ADJUSTED valuation for Germany."
          setup_api_calls:
            - call: "POST /film-sales/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /film-sales/films"
              payload: { title: "Northern Lights", genre: "ACTION", production_budget_usd: 24000000.00, principal_cast_score: 88, estimated_delivery_date: "2027-02-28T00:00:00Z", theatrical_release_date: "2027-04-15T00:00:00Z" }
              as: PlatformAdmin
              captures: { film_id: $.data.id }
            - call: "POST /film-sales/territories"
              payload: { code: "DE", name: "Germany", region: "EMEA", market_tier: 1, currency_code: "EUR", base_value_index: 1.20 }
              as: PlatformAdmin
              captures: { terr_de_id: $.data.id }
            - call: "POST /film-sales/territories/${terr_de_id}/comparable-titles"
              payload: { name: "Comp Alpha", genre: "ACTION", cast_score: 80, gross_license_fee_usd: 800000.00, release_year: 2022, verified: true }
              as: PlatformAdmin
            - call: "POST /film-sales/territories/${terr_de_id}/comparable-titles"
              payload: { name: "Comp Beta", genre: "ACTION", cast_score: 74, gross_license_fee_usd: 1000000.00, release_year: 2023, verified: true }
              as: PlatformAdmin
            - call: "POST /film-sales/territories/${terr_de_id}/comparable-titles"
              payload: { name: "Comp Gamma", genre: "ACTION", cast_score: 91, gross_license_fee_usd: 1200000.00, release_year: 2021, verified: true }
              as: PlatformAdmin
            - call: "POST /film-sales/films/${film_id}/agency-agreements"
              payload: { commission_pct: 0.10, expense_cap_usd: 75000.00, term_months: 24, term_start_date: "2026-08-01T00:00:00Z" }
              as: HeadOfSales
              captures: { agr_id: $.data.id }
            - call: "POST /film-sales/agency-agreements/${agr_id}/state"
              payload: { to_status: "EXECUTED" }
              as: HeadOfSales
              as_user_id: "hos-signer-1"
            - call: "POST /film-sales/films/${film_id}/state"
              payload: { to_status: "PACKAGING" }
              as: PlatformAdmin
            - call: "POST /film-sales/territory-valuations"
              payload: { film_id: "${film_id}", territory_id: "${terr_de_id}", method: "CAST_ADJUSTED" }
              as: SalesAgent
              captures: { val_id: $.data.id }
            - call: "GET /film-sales/films/${film_id}"
              payload: {}
              as: HeadOfSales
              captures: { film_v1: $.data.version }
          trigger:
            - call: "PATCH /film-sales/films/${film_id}"
              payload: { completion_status: "IN_PRODUCTION" }
              as: PlatformAdmin
              captures: { film_v2: $.data.version }
            - call: "POST /film-sales/territory-valuations/${val_id}/publish"
              payload: { expected_film_version: "${film_v1}" }
              as: HeadOfSales
              as_user_id: "hos-valuer-1"
              captures: { err_occ: $.data.error_id }
            - call: "POST /film-sales/territory-valuations/${val_id}/publish"
              payload: { expected_film_version: "${film_v2}" }
              as: HeadOfSales
              as_user_id: "hos-valuer-1"
              captures: { pub_status: $.data.status }
          assert:
            - "${film_v2} == ${film_v1} + 1"
            - "${err_occ} == ERR_STALE_FILM_VERSION at HTTP 412 — not 409 and not ERR_INVALID_REQUEST"
            - "after the refused publish TerritoryValuation.${val_id}.status is still DRAFT and Film.${film_id}.published_territory_count == 0"
            - "${pub_status} == PUBLISHED on the retry with the fresh version"
            - "Film.${film_id}.published_territory_count == 1 and estimated_value_usd == 1680000.00 with floor_value_usd == 1176000.00"

      - name: optimistic_concurrency_on_the_offer_rejects_a_stale_buyer_version
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.contract-offer-stale-buyer
          - errors.ERR_STALE_BUYER_VERSION
          - "endpoints[POST /film-sales/pre-sale-contracts]"
        distinguishing_aspect: |
          A buyer's exposure limit is exactly what an offer is priced against, so the offer carries the
          buyer version it was priced on. Raising the limit advances Buyer.version and the pending offer is
          refused at 412 even though the new limit would be MORE permissive — the check is a pure staleness
          comparison, not a re-evaluation of the limit.
