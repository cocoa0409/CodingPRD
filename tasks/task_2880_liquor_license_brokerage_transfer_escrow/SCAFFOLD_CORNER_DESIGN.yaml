      - name: stale_license_version_rejects_the_chained_extension_filing
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.safekeeping-filing-stale-license
          - errors.ERR_STALE_LICENSE_VERSION
          - validations[priority 30]
        distinguishing_aspect: "The INITIAL filing and its grant each bump License.version, so an EXTENSION replaying the pre-filing token is answered 412 ERR_STALE_LICENSE_VERSION - the filer's stale view of safekeeping_expires_at and extensions_count is exactly what would corrupt the chained window and the doubled fee."
        test_recipe:
          setup:
            - "A CLASS_41_ONSALE_BEER_WINE licence with last_active_date 2026-02-02 (exactly 180 nonuse days) whose INITIAL 12-month filing has been granted."
          setup_api_calls:
            - call: "POST /counties"
              payload: { county_code: "SON", name: "Sonoma", state_code: "CA", quota_licenses_total: 100 }
              as: PlatformAdmin
              captures: { c_id: $.data.id }
            - call: "POST /seller-profiles"
              payload: { legal_name: "Vine Holdings LLC", contact_email: "seller@example.com", tax_clearance_status: "CLEARED" }
              as: PlatformAdmin
              captures: { s_id: $.data.id }
            - call: "POST /licenses"
              payload: { county_id: "${c_id}", owner_seller_id: "${s_id}", license_number: "SAFE-OCC-1", license_class: "CLASS_41_ONSALE_BEER_WINE", annual_gross_receipts_cents: 20000000, last_active_date: "2026-02-02" }
              as: PlatformAdmin
              captures: { lic_id: $.data.id, lic_v1: $.data.version }
            - call: "POST /safekeeping-filings"
              payload: { license_id: "${lic_id}", filing_type: "INITIAL", requested_months: 12, expected_license_version: "${lic_v1}" }
              as: Seller
              as_user_id: "${s_id}"
              captures: { fil1: $.data.id }
            - call: "POST /safekeeping-filings/${fil1}/decide"
              payload: { decision: "GRANT" }
              as: RegulatorAnalyst
              as_user_id: "analyst-1"
          trigger:
            - call: "POST /safekeeping-filings"
              payload: { license_id: "${lic_id}", filing_type: "EXTENSION", requested_months: 6, expected_license_version: "${lic_v1}" }
              as: Seller
              as_user_id: "${s_id}"
              expect_error: true
              captures: { e_stale: $.data.error_id }
            - call: "GET /licenses/${lic_id}"
              payload: {}
              as: Seller
              as_user_id: "${s_id}"
              captures: { lic_v3: $.data.version, exp: $.data.safekeeping_expires_at }
            - call: "POST /safekeeping-filings"
              payload: { license_id: "${lic_id}", filing_type: "EXTENSION", requested_months: 6, expected_license_version: "${lic_v3}" }
              as: Seller
              as_user_id: "${s_id}"
              captures: { fil2: $.data.id, fee2: $.data.fee_cents, eff: $.data.effective_from }
          assert:
            - "${e_stale} == ERR_STALE_LICENSE_VERSION with HTTP 412, not ERR_SAFEKEEPING_EXTENSION_LIMIT"
            - "${lic_v3} == 3 (one bump for the filing, one for the grant) and ${exp} == 2027-08-01T00:00:00Z"
            - "the retry with the fresh token returns 201 with ${fee2} == 40000 and ${eff} == 2027-08-01T00:00:00Z"
            - "GET /safekeeping-filings?license_id=${lic_id} returns total_count == 2, so the refused filing created no row"
            - "License.${lic_id}.version increments on every one of these writes and never on a refusal"

