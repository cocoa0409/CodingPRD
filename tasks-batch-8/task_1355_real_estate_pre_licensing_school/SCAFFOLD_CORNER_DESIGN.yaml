        claim_type: cross_entity_validation
        grounds: ["validations[priority=5]", "errors[ERR_FORBIDDEN_SCOPE]", "roles[Student]", "endpoints[POST /enrollments]"]
        distinguishing_aspect: "A Student may self-enroll with student_id omitted (defaults to X-User-ID) but supplying another student's id is ERR_FORBIDDEN_SCOPE; reading another student's record is likewise 403."
