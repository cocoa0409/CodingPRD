      - name: per_wafer_rounding_precedes_the_sort_yield_average
        claim_type: precision
        grounds:
          - calculations.die_yield_and_speed_grade_allocation
          - entities.DieSortRun.fields.sort_yield
        excluded_because:
          difficulty_instance: combinatorial_formula / die_yield_rounds_each_wafer_before_averaging
          rationale: "That §1.8 instance pins the rounding order with an uneven wafer population (100/10/50 tested die) where pooling first would give 0.8878 instead of the required 0.8800, which is exactly the precision claim."

      - name: cycle_time_projection_and_actual_disagree_on_the_same_lot
        claim_type: variant_divergence
        grounds:
          - calculations.lot_cycle_time_days
          - entities.Lot.fields.actual_cycle_time_days
        excluded_because:
          difficulty_instance: dual_variant_calc / lot_cycle_time_projection_vs_chronological_actual
          rationale: "That §1.8 instance reads the projection and then completes the same lot at the same clock instant, asserting both numbers and the exact delta between them."

      - name: severity_variant_is_provisional_at_creation_and_final_at_containment
        claim_type: variant_selection
        grounds:
          - calculations.excursion_severity_score
          - entities.Excursion.fields.severity_variant
        excluded_because:
          difficulty_instance: dual_variant_calc / excursion_severity_provisional_widens_to_final_and_flips_band
          rationale: "That §1.8 instance asserts PROVISIONAL with the narrow lot set at excursion creation and FINAL with the widened set at containment, which is the variant-selection claim in both contexts."

      - name: containment_reconciles_the_severity_score_to_the_widened_lot_set
        claim_type: reconciliation
        grounds:
          - calculations.excursion_severity_score
          - state_machines.Excursion.OPEN_to_CONTAINED
        excluded_because:
          difficulty_instance: dual_variant_calc / excursion_severity_provisional_widens_to_final_and_flips_band
          rationale: "The same §1.8 instance verifies the delta applied when the variant switches PROVISIONAL -> FINAL, including the resulting severity_band flip."
