            - "data.confirmed_score == 98.25 and data.confirmed_match_grade == \"9/10\" are unchanged by the screening call"
            - "DonorProfile.${d1_id}.availability_status is still \"AVAILABLE\" with deferral_until null and blocked_day_count 0 - a PASS creates no calendar window"
            - "ConfirmatoryTypingRequest.${ct1_id}.status is still \"RESPONDED\" and SearchRequest.${sr_id}.status is still \"PRIMARY_ENGAGED\": the screening advances only the candidate"
            - "no WorkupCase and no ReimbursementClaim exists yet"

      - name: opening_a_workup_case_on_a_backup_candidate_is_rejected
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.MatchCandidate.SCREENING_PASSED_to_WORKUP_OPEN
          - validations.priority_13_ERR_CANDIDATE_NOT_PRIMARY
          - entities.MatchCandidate.fields.candidate_role
