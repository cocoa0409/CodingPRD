            - "CivilPenaltyCase.${cp_id}.status == ASSESSMENT_OPEN"
            - "an AuditVisit created against ${rn_id} would open at SCHEDULED, a RemedyClaim at SUBMITTED and a ProgressReport at DRAFT — the three remaining initial states, each gated behind its own cross-entity precondition"

      - name: classification_moves_intake_to_classified_and_stamps_the_clock
        claim_type: Valid Transition
        grounds:
          - state_machines[Incident].transitions[INTAKE -> CLASSIFIED]
          - endpoints["POST /product-safety/incidents/{id}/classify"]
        distinguishing_aspect: |
          The single most-used forward transition in the domain, checked for the
          full triple that must move together: the status flip, the frozen
          severity_weight, and classified_at taken from the LOGICAL clock rather
          than wall time. The clock is deliberately moved between intake and
          classification so a wall-clock implementation cannot pass.
        test_recipe:
          setup:
            - "logical clock at 2026-03-01T00:00:00Z for intake, then advanced to 2026-03-05T12:00:00Z for the classify call"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: ProgramAdmin
