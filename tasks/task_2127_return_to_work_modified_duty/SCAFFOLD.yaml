scenario: "design task harder than expert level. 2127. Return-to-Work & Modified Duty Program (employer occupational health program): restriction intake from treating provider, transitional job bank & matching to restrictions, duration limits & progression review, supervisor training & compliance monitoring, wage differential & benefit continuation, reinjury risk & escalation to case review, coordination with claim adjuster, program outcome metrics"
domain_name: "return-to-work-modified-duty"
api_prefix: "/rtw"

complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: compliance_audit
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - selector_policy

  entity_topology: graph
  state_machine_shape: parallel
  relationship_patterns:
    - one_to_many
    - many_to_many
    - self_referential
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

  difficulty_level: "expert-plus (15 entities, 63 endpoints, 7 state machines, 10 calculations, 39 validation rows, 51 error codes, 7 roles)"

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

list_semantics:
  default_order: "Every list endpoint returns its rows ordered by `created_at` ASC. When two rows share a `created_at`, the tie is broken by insertion order within the request that produced them; `id` is never an ordering key."
  filter_semantics: "Every optional query parameter named after a field is an exact-equality filter; multiple parameters combine with AND. Filters are applied before pagination, so `total_count` counts the filtered set."

entities:
  - name: Employee
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: Worker's display name.
      - name: employee_number
        type: string
        source: input
        description: Employer-assigned payroll number; unique across all Employee rows.
        constraints: "unique; 1-32 chars"
      - name: department_code
        type: string
        source: input
        description: Department the worker belongs to.
      - name: pre_injury_weekly_wage_cents
        type: integer
        source: input
        description: Average weekly wage in whole cents before the injury; drives every wage-differential calculation.
        constraints: ">= 1"
      - name: pre_injury_weekly_hours
        type: number
        source: input
        description: Contracted weekly hours before the injury.
        constraints: "> 0 and <= 80"
      - name: benefit_tier
        type: enum
        source: input
        description: Health-benefit tier that selects the monthly premium constant.
        constraints: "TIER_A | TIER_B | TIER_C"
      - name: employment_status
        type: enum
        source: input
        default: ACTIVE
        description: Employment relationship state.
        constraints: "ACTIVE | ON_LEAVE | SEPARATED"
      - name: open_claim_count
        type: integer
        source: computed
        description: "Count of Claim rows with employee_id == this.id AND claim_status IN {OPEN, RTW_ELIGIBLE, SUSPENDED}."

  - name: Claim
    parent: Employee
    common_fields: true
    fields:
      - name: employee_id
        type: string
        source: input
        description: "FK -> Employee.id; supplied through the nested create path."
      - name: claim_number
        type: string
        source: input
        description: Carrier claim number; unique across all Claim rows.
        constraints: "unique"
      - name: adjuster_user_id
        type: string
        source: input
        description: Opaque X-User-ID of the ClaimAdjuster who owns this claim. Not an entity id.
      - name: injury_date
        type: string
        source: input
        description: ISO 8601 calendar date (YYYY-MM-DD) of the compensable injury.
      - name: claim_status
        type: enum
        source: system
        default: OPEN
        description: Claim lifecycle flag driven solely by POST /rtw/claims/{id}/adjuster-authorization.
        constraints: "OPEN | RTW_ELIGIBLE | SUSPENDED | CLOSED"
      - name: max_authorized_weekly_cost_cents
        type: integer
        source: system
        default: 0
        description: Ceiling the ClaimAdjuster places on any single AdjusterDirective's authorized_weekly_cost_cents.
      - name: rtw_posture
        type: enum
        source: computed
        description: Derived gate over all placements/case reviews of this claim; see calculations.claim_rtw_posture.
        constraints: "OPEN | RESTRICTED | FROZEN"
      - name: cumulative_transitional_days
        type: integer
        source: computed
        description: See calculations.placement_duration_ledger; sum of member placements' cumulative_days.
      - name: wage_differential_paid_cents
        type: integer
        source: computed
        description: "Sum of net_amount_cents over every WageDifferentialEntry whose claim_id == this.id, regardless of entry_status."
      - name: active_restriction_set_id
        type: string
        source: computed
        description: Id of this claim's single RestrictionSet whose status == ACTIVE, or null when none. Computed denormalized pointer, never an input.

  - name: TreatingProvider
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: Clinician name.
      - name: npi
        type: string
        source: input
        description: National Provider Identifier; unique across all TreatingProvider rows.
        constraints: "unique; exactly 10 digits"
      - name: specialty
        type: string
        source: input
        description: Clinical specialty label.
      - name: credential_status
        type: enum
        source: input
        default: PROVISIONAL
        description: Credentialing state; only VERIFIED providers may originate or submit restriction sets.
        constraints: "VERIFIED | PROVISIONAL | REVOKED"

  - name: RestrictionSet
    parent: Claim
    common_fields: true
    fields:
      - name: claim_id
        type: string
        source: input
        description: "FK -> Claim.id; supplied through the nested create path."
      - name: treating_provider_id
        type: string
        source: input
        description: "FK -> TreatingProvider.id; the clinician who authored the restrictions."
      - name: supersedes_restriction_set_id
        type: string
        source: system
        default: null
        description: "FK -> RestrictionSet.id; stamped at activation with the id of the RestrictionSet this one displaced, else null."
      - name: status
        type: enum
        source: system
        default: DRAFT
        description: Intake lifecycle state.
        constraints: "DRAFT | SUBMITTED | CLARIFICATION_REQUESTED | VERIFIED | ACTIVE | SUPERSEDED | EXPIRED"
      - name: effective_from
        type: string
        source: input
        description: ISO 8601 date on which the restrictions begin.
      - name: valid_through
        type: string
        source: input
        description: ISO 8601 date on which the restrictions lapse (inclusive).
      - name: max_lift_lbs
        type: number
        source: input
        description: Maximum permitted lift in pounds.
        constraints: ">= 0"
      - name: max_continuous_standing_minutes
        type: number
        source: input
        description: Maximum permitted continuous standing in minutes.
        constraints: ">= 0"
      - name: max_hours_per_day
        type: number
        source: input
        description: Maximum permitted work hours per day.
        constraints: "> 0 and <= 12"
      - name: keyboard_minutes_per_hour
        type: number
        source: input
        description: Maximum permitted keyboarding minutes within any hour.
        constraints: ">= 0 and <= 60"
      - name: overhead_reach_allowed
        type: boolean
        source: input
        description: Whether overhead reaching is permitted.
      - name: driving_allowed
        type: boolean
        source: input
        description: Whether operating a vehicle is permitted.
      - name: clarification_note
        type: string
        source: input
        default: null
        description: Free-text note recorded by the last request-clarification call; null until one occurs.
      - name: clarification_round_count
        type: integer
        source: system
        default: 0
        description: Number of times this set has entered CLARIFICATION_REQUESTED.
      - name: severity_index
        type: integer
        source: computed
        description: See calculations.restriction_severity_index; 0 (unrestricted) to 100 (maximally restricted).
      - name: active_placement_count
        type: integer
        source: computed
        description: "Count of Placement rows with restriction_set_id == this.id AND placement_status IN {PROPOSED, ADJUSTER_PENDING, ACTIVE, PROGRESSION_HOLD, SUSPENDED}."

  - name: Supervisor
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: Supervisor's display name.
      - name: department_code
        type: string
        source: input
        description: Department this supervisor oversees.
      - name: oversight_status
        type: enum
        source: system
        default: ACTIVE
        description: Whether this supervisor may hold live transitional placements.
        constraints: "ACTIVE | SUSPENDED"
      - name: compliance_strike_points
        type: integer
        source: computed
        description: "Sum of COMPLIANCE_STRIKE_POINTS[finding_severity] over every ComplianceAudit whose placement's supervisor_id == this.id."
      - name: strike_forgiveness_points
        type: integer
        source: system
        default: 0
        description: Watermark set to compliance_strike_points when an RTW_CORE training record is renewed while oversight_status == SUSPENDED.
      - name: effective_strike_points
        type: integer
        source: computed
        description: "max(0, compliance_strike_points - strike_forgiveness_points)."
      - name: training_status
        type: enum
        source: computed
        description: See calculations.supervisor_training_status.
        constraints: "VALID | EXPIRING_SOON | EXPIRED | NONE"

  - name: TrainingRecord
    parent: Supervisor
    common_fields: true
    fields:
      - name: supervisor_id
        type: string
        source: input
        description: "FK -> Supervisor.id; supplied through the nested create path."
      - name: curriculum_code
        type: enum
        source: input
        description: Which supervisor curriculum this record certifies.
        constraints: "RTW_CORE | RESTRICTION_HANDLING | REINJURY_RESPONSE"
      - name: completed_on
        type: string
        source: input
        description: ISO 8601 date the curriculum was completed.
      - name: valid_through
        type: string
        source: input
        description: ISO 8601 date the certification lapses (inclusive).
      - name: record_status
        type: enum
        source: system
        default: VALID
        description: Certification state; advanced by the logical clock and by renewal.
        constraints: "VALID | EXPIRING_SOON | EXPIRED | SUPERSEDED"
      - name: renewal_count
        type: integer
        source: system
        default: 0
        description: Number of times this record has been renewed.

  - name: TransitionalJob
    parent: null
    common_fields: true
    fields:
      - name: supervisor_id
        type: string
        source: input
        description: "FK -> Supervisor.id; the supervisor accountable for this job bank entry."
      - name: title
        type: string
        source: input
        description: Job bank entry title.
      - name: department_code
        type: string
        source: input
        description: Department the job sits in.
      - name: seat_capacity
        type: integer
        source: input
        description: Maximum number of concurrently occupying placements.
        constraints: ">= 1"
      - name: filled_seats
        type: integer
        source: computed
        description: "Count of Placement rows with transitional_job_id == this.id AND placement_status IN {ADJUSTER_PENDING, ACTIVE, PROGRESSION_HOLD}."
      - name: demand_lift_lbs
        type: number
        source: input
        description: Pounds the job requires lifting.
        constraints: ">= 0"
      - name: demand_standing_minutes
        type: number
        source: input
        description: Continuous standing minutes the job requires.
        constraints: ">= 0"
      - name: demand_hours_per_day
        type: number
        source: input
        description: Hours per day the job requires.
        constraints: "> 0 and <= 12"
      - name: demand_keyboard_minutes_per_hour
        type: number
        source: input
        description: Keyboarding minutes per hour the job requires.
        constraints: ">= 0 and <= 60"
      - name: requires_overhead_reach
        type: boolean
        source: input
        default: false
        description: Whether the job requires overhead reaching.
      - name: requires_driving
        type: boolean
        source: input
        default: false
        description: Whether the job requires driving.
      - name: hourly_rate_cents
        type: integer
        source: input
        description: Transitional wage rate in whole cents per hour.
        constraints: ">= 1"
      - name: risk_class
        type: enum
        source: input
        default: LOW
        description: Ergonomic risk band used by the match and reinjury calculations.
        constraints: "LOW | MEDIUM | HIGH"
      - name: job_status
        type: enum
        source: system
        default: OPEN
        description: Bank availability; PAUSED entries are ineligible for matching.
        constraints: "OPEN | PAUSED | RETIRED"

  - name: Placement
    parent: Claim
    common_fields: true
    fields:
      - name: claim_id
        type: string
        source: system
        description: "FK -> Claim.id; copied from the referenced RestrictionSet's claim_id at creation."
      - name: restriction_set_id
        type: string
        source: input
        description: "FK -> RestrictionSet.id; the restriction set this placement was matched against."
      - name: transitional_job_id
        type: string
        source: input
        description: "FK -> TransitionalJob.id; the job bank entry occupied."
      - name: supervisor_id
        type: string
        source: system
        description: "FK -> Supervisor.id; denormalized from the job's supervisor_id at creation and never re-pointed."
      - name: created_by_user_id
        type: string
        source: system
        description: X-User-ID of the actor that created this placement; used by the segregation-of-duties rules.
      - name: placement_status
        type: enum
        source: system
        default: PROPOSED
        description: Primary lifecycle dimension.
        constraints: "PROPOSED | ADJUSTER_PENDING | ACTIVE | PROGRESSION_HOLD | SUSPENDED | COMPLETED | TERMINATED_EARLY | DECLINED"
      - name: compliance_status
        type: enum
        source: system
        default: COMPLIANT
        description: Independent monitoring dimension driven only by ComplianceAudit rows and supervisor suspension cascades.
        constraints: "COMPLIANT | WATCH | NONCOMPLIANT | REMEDIATED"
      - name: start_date
        type: string
        source: input
        description: ISO 8601 first calendar day of the transitional assignment.
      - name: end_date
        type: string
        source: input
        description: ISO 8601 last calendar day of the transitional assignment (inclusive).
      - name: scheduled_hours_per_day
        type: number
        source: input
        description: Hours per day the worker is scheduled onto the transitional job.
        constraints: "> 0 and <= 12"
      - name: activated_on
        type: string
        source: system
        default: null
        description: Set to start_date when the placement transitions to ACTIVE; null before that.
      - name: ended_on
        type: string
        source: system
        default: null
        description: Logical-clock calendar date on which the placement reached COMPLETED or TERMINATED_EARLY; null otherwise.
      - name: suspension_reason
        type: enum
        source: system
        default: null
        description: Why the placement is SUSPENDED; null in every other state.
        constraints: "RESTRICTION_CONFLICT | MEDICAL_HOLD | OPERATIONAL | null"
      - name: decline_reason
        type: string
        source: system
        default: null
        description: Free text copied from the terminate call's reason when the placement lands in DECLINED.
      - name: logged_hours
        type: array
        source: system
        default: []
        description: "Array of { work_date, hours_worked } objects appended by POST /rtw/placements/{id}/hours-log, upserted by work_date and kept sorted work_date ASC."
      - name: progression_step
        type: integer
        source: system
        default: 0
        description: Number of ADVANCE decisions applied to this placement.
      - name: match_score
        type: number
        source: computed
        description: See calculations.restriction_match_score; pinned at creation and recomputed on progression ADVANCE.
      - name: reinjury_risk_score
        type: integer
        source: computed
        description: See calculations.reinjury_risk_score; value depends on reinjury_risk_variant.
      - name: reinjury_risk_variant
        type: enum
        source: system
        default: BASELINE
        description: Which variant produced the current reinjury_risk_score.
        constraints: "BASELINE | SURVEILLANCE"
      - name: cumulative_days
        type: integer
        source: computed
        description: See calculations.placement_duration_ledger.
      - name: employer_premium_share_cents
        type: integer
        source: computed
        description: See calculations.benefit_continuation_premium_split.
      - name: employee_premium_share_cents
        type: integer
        source: computed
        description: See calculations.benefit_continuation_premium_split.
      - name: benefit_continuation_status
        type: enum
        source: computed
        description: See calculations.benefit_continuation_premium_split.
        constraints: "PENDING | EMPLOYER_SUBSIDIZED | EMPLOYEE_PAID | LAPSED"
      - name: projected_weekly_cost_cents
        type: integer
        source: computed
        description: See calculations.projected_weekly_cost.
      - name: current_adjuster_directive_id
        type: string
        source: computed
        description: Id of this placement's AdjusterDirective with directive_status != SUPERSEDED and the latest created_at (tie-break created_at ASC is vacuous because only one such row can exist); null when none. Computed denormalized pointer, never an input.
      - name: current_progression_review_id
        type: string
        source: computed
        description: "Id of this placement's ProgressionReview whose review_status IN {SCHEDULED, IN_REVIEW} carrying the greatest step_index; when two such rows share the greatest step_index the earlier created_at wins (never id); null when none. Computed denormalized pointer, never an input."
      - name: open_case_review_id
        type: string
        source: computed
        description: "Id of this placement's CaseReview whose review_status IN {OPEN, VOTING}; null when none. Computed denormalized pointer, never an input."

  - name: AdjusterDirective
    parent: Placement
    common_fields: true
    fields:
      - name: placement_id
        type: string
        source: system
        description: "FK -> Placement.id; stamped when POST /rtw/placements/{id}/submit-to-adjuster mints the directive."
      - name: directive_status
        type: enum
        source: system
        default: PENDING
        description: Adjuster decision state.
        constraints: "PENDING | AUTHORIZED | AUTHORIZED_WITH_CONDITIONS | DENIED | SUPERSEDED"
      - name: requested_weekly_cost_cents
        type: integer
        source: system
        description: Copy of the placement's projected_weekly_cost_cents at submission time.
      - name: authorized_weekly_cost_cents
        type: integer
        source: input
        default: 0
        description: Weekly spend the adjuster authorizes; 0 on a DENIED directive.
      - name: condition_note
        type: string
        source: input
        default: null
        description: Conditions attached to an AUTHORIZED_WITH_CONDITIONS decision; null otherwise.
      - name: denial_reason
        type: string
        source: input
        default: null
        description: Reason recorded on a DENIED decision; null otherwise.
      - name: decided_by_user_id
        type: string
        source: system
        default: null
        description: Opaque X-User-ID of the ClaimAdjuster who decided; null while PENDING.
      - name: decided_at
        type: datetime
        source: system
        default: null
        description: Logical-clock instant of the decision; null while PENDING.

  - name: ProgressionReview
    parent: Placement
    common_fields: true
    fields:
      - name: placement_id
        type: string
        source: system
        description: "FK -> Placement.id; stamped when the review is auto-scheduled."
      - name: step_index
        type: integer
        source: system
        description: 1-based ordinal of this review within the placement's progression ladder.
      - name: due_date
        type: string
        source: system
        description: ISO 8601 calendar date the review is due.
      - name: review_status
        type: enum
        source: system
        default: SCHEDULED
        description: Review lifecycle state.
        constraints: "SCHEDULED | IN_REVIEW | ADVANCED | EXTENDED | ESCALATED"
      - name: deferral_count
        type: integer
        source: system
        default: 0
        description: Number of DEFER decisions applied to this review.
      - name: reviewed_by_user_id
        type: string
        source: system
        default: null
        description: X-User-ID of the actor that opened the review; null while SCHEDULED.
      - name: target_hours_per_day
        type: number
        source: computed
        description: See calculations.progression_step_target; null until a decision is recorded.
      - name: target_lift_lbs
        type: number
        source: computed
        description: See calculations.progression_step_target; null until a decision is recorded.
      - name: outcome_note
        type: string
        source: input
        default: null
        description: Free-text rationale supplied with the decision; null while SCHEDULED or IN_REVIEW.

  - name: ComplianceAudit
    parent: Placement
    common_fields: false
    fields:
      - name: placement_id
        type: string
        source: system
        description: "FK -> Placement.id; supplied through the nested create path."
      - name: auditor_user_id
        type: string
        source: system
        description: X-User-ID of the actor that filed the observation.
      - name: observed_on
        type: string
        source: input
        description: ISO 8601 calendar date of the workplace observation.
      - name: finding_severity
        type: enum
        source: input
        description: Severity of the monitoring finding.
        constraints: "NONE | MINOR | MAJOR | CRITICAL"
      - name: finding_code
        type: enum
        source: input
        description: Which compliance dimension the finding concerns.
        constraints: "RESTRICTION_DEVIATION | HOURS_DEVIATION | SUPERVISION_GAP | DOCUMENTATION | NONE"
      - name: restriction_deviation_detected
        type: boolean
        source: input
        default: false
        description: Whether the observed work exceeded the active restriction limits.
      - name: corrective_action_note
        type: string
        source: input
        default: null
        description: Corrective action recorded with the observation.

  - name: WageDifferentialEntry
    parent: Placement
    common_fields: false
    fields:
      - name: placement_id
        type: string
        source: system
        description: "FK -> Placement.id; supplied through the nested create path or copied from the reversed entry."
      - name: claim_id
        type: string
        source: system
        description: "FK -> Claim.id; copied from the placement's claim_id."
      - name: reverses_entry_id
        type: string
        source: system
        default: null
        description: "FK -> WageDifferentialEntry.id; set on a REVERSAL row to the entry it offsets, null otherwise."
      - name: variant
        type: enum
        source: input
        description: Which wage-differential algorithm produced this row.
        constraints: "PROVISIONAL | FINAL"
      - name: period_start
        type: string
        source: input
        description: ISO 8601 first calendar day of the pay period (inclusive).
      - name: period_end
        type: string
        source: input
        description: ISO 8601 last calendar day of the pay period (inclusive).
      - name: counted_day_count
        type: integer
        source: computed
        description: Number of days that entered the sum; see calculations.wage_differential_period_amount.
      - name: tier_multiplier
        type: number
        source: computed
        description: Duration tier multiplier applied to this row.
      - name: gross_differential_cents
        type: integer
        source: computed
        description: See calculations.wage_differential_period_amount.
      - name: offset_cents
        type: integer
        source: computed
        description: Benefit-continuation offset withheld from gross.
      - name: net_amount_cents
        type: integer
        source: computed
        description: gross_differential_cents minus offset_cents; negated on a REVERSAL row.
      - name: entry_status
        type: enum
        source: system
        default: POSTED
        description: Ledger row role.
        constraints: "POSTED | REVERSED | REVERSAL"

  - name: ReinjuryReport
    parent: Placement
    common_fields: true
    fields:
      - name: placement_id
        type: string
        source: system
        description: "FK -> Placement.id; supplied through the nested create path."
      - name: reported_by_user_id
        type: string
        source: system
        description: X-User-ID of the reporter.
      - name: occurred_on
        type: string
        source: input
        description: ISO 8601 calendar date of the event.
      - name: severity
        type: enum
        source: input
        description: Reported reinjury severity.
        constraints: "NEAR_MISS | MINOR | SIGNIFICANT | SEVERE"
      - name: body_part_code
        type: string
        source: input
        description: Coded body region.
      - name: mechanism_code
        type: string
        source: input
        description: Coded injury mechanism.
      - name: report_status
        type: enum
        source: system
        default: SUBMITTED
        description: Triage lifecycle state.
        constraints: "SUBMITTED | TRIAGED | ESCALATED"
      - name: triage_note
        type: string
        source: input
        default: null
        description: Nurse triage note; null while SUBMITTED.
      - name: risk_points_applied
        type: integer
        source: computed
        description: REINJURY_SEVERITY_POINTS contribution this report makes to the SURVEILLANCE risk variant; 0 while report_status == SUBMITTED.

  - name: CaseReview
    parent: Placement
    common_fields: true
    fields:
      - name: placement_id
        type: string
        source: system
        description: "FK -> Placement.id; supplied through the nested create path or stamped by an escalation cascade."
      - name: trigger_reason
        type: enum
        source: input
        description: Why the panel was convened.
        constraints: "REINJURY | RESTRICTION_CONFLICT | DURATION_CAP | COMPLIANCE_CRITICAL | ADJUSTER_DENIAL"
      - name: review_status
        type: enum
        source: system
        default: OPEN
        description: Panel lifecycle state.
        constraints: "OPEN | VOTING | DECIDED_CONTINUE | DECIDED_MODIFY | DECIDED_TERMINATE"
      - name: quorum_required
        type: integer
        source: input
        default: 3
        description: Minimum number of COUNTED votes needed before the panel may close.
        constraints: ">= 1 and <= 7"
      - name: opened_by_user_id
        type: string
        source: system
        description: X-User-ID of the actor that convened the panel, or the literal "system" for cascade-created panels.
      - name: vote_count
        type: integer
        source: computed
        description: "Count of CaseReviewVote rows with case_review_id == this.id AND vote_status == COUNTED."
      - name: continue_votes
        type: integer
        source: computed
        description: Count of COUNTED votes whose ballot == CONTINUE.
      - name: modify_votes
        type: integer
        source: computed
        description: Count of COUNTED votes whose ballot == MODIFY.
      - name: terminate_votes
        type: integer
        source: computed
        description: Count of COUNTED votes whose ballot == TERMINATE.
      - name: decision_ratio
        type: number
        source: computed
        description: See calculations.case_review_tally; 0 when vote_count == 0.
      - name: winning_ballot
        type: enum
        source: computed
        description: See calculations.case_review_tally; null when vote_count == 0.
        constraints: "CONTINUE | MODIFY | TERMINATE | null"
      - name: closed_by_user_id
        type: string
        source: system
        default: null
        description: X-User-ID of the actor that closed the panel; null while OPEN or VOTING.

  - name: CaseReviewVote
    parent: CaseReview
    common_fields: false
    fields:
      - name: case_review_id
        type: string
        source: system
        description: "FK -> CaseReview.id; supplied through the nested create path."
      - name: voter_user_id
        type: string
        source: system
        description: X-User-ID of the panel member casting the ballot.
      - name: voter_role
        type: enum
        source: system
        description: X-User-Role of the panel member, copied from the request header.
        constraints: "RTWCoordinator | OccHealthNurse | ClaimAdjuster | Supervisor | TreatingProvider"
      - name: ballot
        type: enum
        source: input
        description: The member's recommendation.
        constraints: "CONTINUE | MODIFY | TERMINATE"
      - name: rationale
        type: string
        source: input
        default: null
        description: Free-text rationale.
      - name: vote_status
        type: enum
        source: system
        default: COUNTED
        description: A re-vote by the same voter_user_id flips the member's prior row to SUPERSEDED.
        constraints: "COUNTED | SUPERSEDED"

state_machines:
  - entity: RestrictionSet
    dimension: status
    shape: cyclic
    initial_state: DRAFT
    terminal_states: [SUPERSEDED, EXPIRED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /rtw/restriction-sets/{id}/submit"
        actor: TreatingProvider
        preconditions:
          - "restriction_set.status == DRAFT"
          - "X-User-ID == restriction_set.treating_provider_id when X-User-Role == TreatingProvider"
          - "TreatingProvider.credential_status == VERIFIED"
        side_effects:
          - "increments RestrictionSet.version by 1"
      - from: CLARIFICATION_REQUESTED
        to: SUBMITTED
        trigger: "POST /rtw/restriction-sets/{id}/submit"
        actor: TreatingProvider
        preconditions:
          - "restriction_set.status == CLARIFICATION_REQUESTED"
          - "X-User-ID == restriction_set.treating_provider_id when X-User-Role == TreatingProvider"
          - "TreatingProvider.credential_status == VERIFIED"
        side_effects:
          - "increments RestrictionSet.version by 1"
        note: "Revision loop; the pair SUBMITTED -> CLARIFICATION_REQUESTED -> SUBMITTED is the cycle that makes this machine non-linear."
      - from: SUBMITTED
        to: CLARIFICATION_REQUESTED
        trigger: "POST /rtw/restriction-sets/{id}/request-clarification"
        actor: OccHealthNurse
        preconditions:
          - "restriction_set.status == SUBMITTED"
        side_effects:
          - "sets RestrictionSet.clarification_note to the request body's note"
          - "increments RestrictionSet.clarification_round_count by 1"
          - "increments RestrictionSet.version by 1"
      - from: SUBMITTED
        to: VERIFIED
        trigger: "POST /rtw/restriction-sets/{id}/verify"
        actor: OccHealthNurse
        preconditions:
          - "restriction_set.status == SUBMITTED"
          - "TreatingProvider.credential_status == VERIFIED"
        side_effects:
          - "recomputes RestrictionSet.severity_index"
          - "increments RestrictionSet.version by 1"
      - from: VERIFIED
        to: ACTIVE
        trigger: "POST /rtw/restriction-sets/{id}/activate"
        actor: RTWCoordinator
        preconditions:
          - "restriction_set.status == VERIFIED"
          - "restriction_set.valid_through >= logical clock calendar date"
        side_effects:
          - "CASCADE L1: sets RestrictionSet.status = ACTIVE and Claim.active_restriction_set_id = this id"
          - "CASCADE L2 (caused by L1): the claim's prior RestrictionSet whose status == ACTIVE transitions ACTIVE -> SUPERSEDED, and the new set's supersedes_restriction_set_id is stamped with that prior id"
          - "CASCADE L3 (caused by L2): every Placement with restriction_set_id == the superseded set and placement_status IN {ADJUSTER_PENDING, ACTIVE, PROGRESSION_HOLD} is re-checked against the new set's limits; any placement whose job breaches a limit transitions to SUSPENDED with suspension_reason = RESTRICTION_CONFLICT and its job's filled_seats drops by 1"
          - "CASCADE L4 (caused by L3): for each placement suspended in L3, its ProgressionReview whose review_status IN {SCHEDULED, IN_REVIEW} transitions to ESCALATED and a CaseReview row is created with review_status = OPEN, trigger_reason = RESTRICTION_CONFLICT, quorum_required = 3, opened_by_user_id = \"system\""
          - "CASCADE L5 (caused by L4): Claim.rtw_posture is recomputed and lands on FROZEN because an OPEN CaseReview now exists"
          - "increments RestrictionSet.version by 1 on both the activated and the superseded set"
      - from: ACTIVE
        to: SUPERSEDED
        trigger: "system: a newer RestrictionSet for the same claim reaches ACTIVE"
        actor: system
        preconditions:
          - "restriction_set.status == ACTIVE"
        side_effects:
          - "clears Claim.active_restriction_set_id before the newer set writes its own id"
          - "increments RestrictionSet.version by 1"
      - from: ACTIVE
        to: EXPIRED
        trigger: "system: POST /_clock/set_current_utc advances the logical clock past valid_through"
        actor: system
        preconditions:
          - "restriction_set.status == ACTIVE"
          - "restriction_set.valid_through < logical clock calendar date"
        side_effects:
          - "clears Claim.active_restriction_set_id"
          - "recomputes Claim.rtw_posture"
          - "increments RestrictionSet.version by 1"

  - entity: Placement
    dimension: placement_status
    shape: branching_with_cycle
    initial_state: PROPOSED
    terminal_states: [COMPLETED, TERMINATED_EARLY, DECLINED]
    transitions:
      - from: PROPOSED
        to: ADJUSTER_PENDING
        trigger: "POST /rtw/placements/{id}/submit-to-adjuster"
        actor: RTWCoordinator
        preconditions:
          - "placement.placement_status == PROPOSED"
          - "restriction_set.status == ACTIVE"
          - "claim.rtw_posture != FROZEN"
        side_effects:
          - "creates an AdjusterDirective with directive_status = PENDING and requested_weekly_cost_cents = placement.projected_weekly_cost_cents"
          - "sets Placement.current_adjuster_directive_id"
          - "raises TransitionalJob.filled_seats by 1"
          - "increments Placement.version by 1"
      - from: ADJUSTER_PENDING
        to: ACTIVE
        trigger: "POST /rtw/placements/{id}/activate"
        actor: RTWCoordinator
        preconditions:
          - "placement.placement_status == ADJUSTER_PENDING"
          - "restriction_set.status == ACTIVE"
          - "the placement's current AdjusterDirective has directive_status IN {AUTHORIZED, AUTHORIZED_WITH_CONDITIONS}"
          - "Supervisor.oversight_status == ACTIVE"
          - "Supervisor.training_status IN {VALID, EXPIRING_SOON}"
          - "claim.rtw_posture != FROZEN"
          - "placement.projected_weekly_cost_cents <= directive.authorized_weekly_cost_cents"
        side_effects:
          - "sets Placement.activated_on = placement.start_date"
          - "computes Placement.employer_premium_share_cents / employee_premium_share_cents and benefit_continuation_status"
          - "creates ProgressionReview with step_index = 1, review_status = SCHEDULED, due_date = start_date + PROGRESSION_REVIEW_INTERVAL_DAYS"
          - "sets Placement.current_progression_review_id"
          - "recomputes Claim.cumulative_transitional_days and Claim.rtw_posture"
          - "increments Placement.version by 1"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /rtw/placements/{id}/suspend"
        actor: RTWCoordinator
        preconditions:
          - "placement.placement_status == ACTIVE"
        side_effects:
          - "sets Placement.suspension_reason from the request body"
          - "lowers TransitionalJob.filled_seats by 1"
          - "recomputes Claim.cumulative_transitional_days and Claim.rtw_posture"
          - "increments Placement.version by 1"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /rtw/placements/{id}/resume"
        actor: RTWCoordinator
        preconditions:
          - "placement.placement_status == SUSPENDED"
          - "restriction_set.status == ACTIVE"
          - "Supervisor.oversight_status == ACTIVE"
          - "seat capacity on the transitional job admits the placement's window"
        side_effects:
          - "clears Placement.suspension_reason"
          - "raises TransitionalJob.filled_seats by 1"
          - "increments Placement.version by 1"
        note: "SUSPENDED -> ACTIVE closes the ACTIVE -> SUSPENDED -> ACTIVE cycle on this dimension."
      - from: ACTIVE
        to: PROGRESSION_HOLD
        trigger: "system: ProgressionReview ESCALATE decision, or ReinjuryReport triage whose SURVEILLANCE score >= RISK_ESCALATION_THRESHOLD"
        actor: system
        preconditions:
          - "placement.placement_status == ACTIVE"
        side_effects:
          - "creates a CaseReview with review_status = OPEN when none is already OPEN or VOTING for this placement"
          - "sets Placement.open_case_review_id"
          - "recomputes Claim.rtw_posture to FROZEN"
          - "increments Placement.version by 1"
      - from: PROGRESSION_HOLD
        to: ACTIVE
        trigger: "system: CaseReview closes with winning_ballot == CONTINUE"
        actor: system
        preconditions:
          - "placement.placement_status == PROGRESSION_HOLD"
        side_effects:
          - "clears Placement.open_case_review_id"
          - "recomputes Claim.rtw_posture"
          - "increments Placement.version by 1"
      - from: PROGRESSION_HOLD
        to: TERMINATED_EARLY
        trigger: "system: CaseReview closes with winning_ballot == TERMINATE"
        actor: system
        preconditions:
          - "placement.placement_status == PROGRESSION_HOLD"
        side_effects:
          - "sets Placement.ended_on = logical clock calendar date"
          - "lowers TransitionalJob.filled_seats by 1"
          - "flips every AdjusterDirective of this placement whose directive_status IN {PENDING, AUTHORIZED, AUTHORIZED_WITH_CONDITIONS} to SUPERSEDED"
          - "recomputes Placement.benefit_continuation_status to LAPSED"
          - "recomputes Claim.cumulative_transitional_days and Claim.rtw_posture"
          - "increments Placement.version by 1"
      - from: ACTIVE
        to: COMPLETED
        trigger: "POST /rtw/placements/{id}/complete"
        actor: RTWCoordinator
        preconditions:
          - "placement.placement_status == ACTIVE"
        side_effects:
          - "sets Placement.ended_on = logical clock calendar date"
          - "lowers TransitionalJob.filled_seats by 1"
          - "flips every AdjusterDirective of this placement whose directive_status IN {PENDING, AUTHORIZED, AUTHORIZED_WITH_CONDITIONS} to SUPERSEDED"
          - "recomputes Placement.benefit_continuation_status to LAPSED"
          - "recomputes Claim.cumulative_transitional_days and Claim.rtw_posture"
          - "increments Placement.version by 1"
      - from: ACTIVE
        to: TERMINATED_EARLY
        trigger: "POST /rtw/placements/{id}/terminate"
        actor: RTWCoordinator
        preconditions:
          - "placement.placement_status IN {ACTIVE, PROGRESSION_HOLD, SUSPENDED}"
        side_effects:
          - "sets Placement.ended_on = logical clock calendar date"
          - "lowers TransitionalJob.filled_seats by 1 when the placement was ADJUSTER_PENDING, ACTIVE or PROGRESSION_HOLD"
          - "flips every AdjusterDirective of this placement whose directive_status IN {PENDING, AUTHORIZED, AUTHORIZED_WITH_CONDITIONS} to SUPERSEDED"
          - "recomputes Placement.benefit_continuation_status to LAPSED"
          - "recomputes Claim.cumulative_transitional_days and Claim.rtw_posture"
          - "increments Placement.version by 1"
      - from: PROPOSED
        to: DECLINED
        trigger: "POST /rtw/placements/{id}/terminate"
        actor: RTWCoordinator
        preconditions:
          - "placement.placement_status IN {PROPOSED, ADJUSTER_PENDING}"
        side_effects:
          - "sets Placement.decline_reason from the request body's reason"
          - "lowers TransitionalJob.filled_seats by 1 when the placement was ADJUSTER_PENDING"
          - "flips every AdjusterDirective of this placement whose directive_status IN {PENDING, AUTHORIZED, AUTHORIZED_WITH_CONDITIONS} to SUPERSEDED"
          - "increments Placement.version by 1"
        note: "The terminate endpoint branches on the from-state: {ACTIVE, PROGRESSION_HOLD, SUSPENDED} land on TERMINATED_EARLY, {PROPOSED, ADJUSTER_PENDING} land on DECLINED, with different side-effect sets."

  - entity: Placement
    dimension: compliance_status
    shape: cyclic
    initial_state: COMPLIANT
    terminal_states: []
    transitions:
      - from: COMPLIANT
        to: WATCH
        trigger: "POST /rtw/placements/{id}/compliance-audits with finding_severity IN {MINOR, MAJOR}"
        actor: Supervisor
        preconditions:
          - "placement.compliance_status == COMPLIANT"
        side_effects:
          - "recomputes Supervisor.compliance_strike_points and effective_strike_points"
          - "recomputes Placement.reinjury_risk_score under the SURVEILLANCE variant"
          - "recomputes Claim.rtw_posture to RESTRICTED"
          - "increments Placement.version by 1"
      - from: WATCH
        to: NONCOMPLIANT
        trigger: "POST /rtw/placements/{id}/compliance-audits with finding_severity IN {MAJOR, CRITICAL}"
        actor: Supervisor
        preconditions:
          - "placement.compliance_status == WATCH"
        side_effects:
          - "CASCADE L1: sets Placement.compliance_status = NONCOMPLIANT"
          - "CASCADE L2 (caused by L1): Supervisor.compliance_strike_points is recomputed and, when effective_strike_points >= COMPLIANCE_STRIKE_SUSPENSION_THRESHOLD, Supervisor.oversight_status flips ACTIVE -> SUSPENDED"
          - "CASCADE L3 (caused by L2): every TransitionalJob with supervisor_id == that supervisor and job_status == OPEN flips to PAUSED, and every other Placement of that supervisor with placement_status IN {ACTIVE, PROGRESSION_HOLD} and compliance_status == COMPLIANT flips to WATCH"
          - "CASCADE L4 (caused by L3): Claim.rtw_posture is recomputed for every claim owning a placement that flipped to WATCH in L3 and lands on RESTRICTED"
          - "increments Placement.version by 1"
      - from: COMPLIANT
        to: NONCOMPLIANT
        trigger: "POST /rtw/placements/{id}/compliance-audits with finding_severity == CRITICAL"
        actor: Supervisor
        preconditions:
          - "placement.compliance_status == COMPLIANT"
        side_effects:
          - "same L1-L4 cascade as the WATCH -> NONCOMPLIANT transition"
          - "increments Placement.version by 1"
      - from: NONCOMPLIANT
        to: REMEDIATED
        trigger: "POST /rtw/placements/{id}/compliance-audits with finding_severity == NONE"
        actor: Supervisor
        preconditions:
          - "placement.compliance_status == NONCOMPLIANT"
        side_effects:
          - "recomputes Claim.rtw_posture"
          - "increments Placement.version by 1"
      - from: REMEDIATED
        to: COMPLIANT
        trigger: "POST /rtw/placements/{id}/compliance-audits with finding_severity == NONE"
        actor: Supervisor
        preconditions:
          - "placement.compliance_status == REMEDIATED"
        side_effects:
          - "recomputes Claim.rtw_posture to OPEN when no other placement of the claim is WATCH or NONCOMPLIANT and no CaseReview is OPEN or VOTING and cumulative_transitional_days < DURATION_SOFT_CAP_DAYS"
          - "increments Placement.version by 1"
        note: "COMPLIANT -> WATCH -> NONCOMPLIANT -> REMEDIATED -> COMPLIANT is a cycle that evolves completely independently of placement_status; the two dimensions are the scaffold's parallel state axes on one row."
      - from: WATCH
        to: COMPLIANT
        trigger: "POST /rtw/placements/{id}/compliance-audits with finding_severity == NONE"
        actor: Supervisor
        preconditions:
          - "placement.compliance_status == WATCH"
        side_effects:
          - "recomputes Claim.rtw_posture"
          - "increments Placement.version by 1"

  - entity: AdjusterDirective
    dimension: directive_status
    shape: branching
    initial_state: PENDING
    terminal_states: [SUPERSEDED]
    transitions:
      - from: PENDING
        to: AUTHORIZED
        trigger: "POST /rtw/adjuster-directives/{id}/decide with decision == AUTHORIZED"
        actor: ClaimAdjuster
        preconditions:
          - "directive.directive_status == PENDING"
          - "X-User-ID == claim.adjuster_user_id"
          - "authorized_weekly_cost_cents <= claim.max_authorized_weekly_cost_cents"
        side_effects:
          - "stamps decided_by_user_id and decided_at"
          - "increments AdjusterDirective.version by 1"
      - from: PENDING
        to: AUTHORIZED_WITH_CONDITIONS
        trigger: "POST /rtw/adjuster-directives/{id}/decide with decision == AUTHORIZED_WITH_CONDITIONS"
        actor: ClaimAdjuster
        preconditions:
          - "directive.directive_status == PENDING"
          - "X-User-ID == claim.adjuster_user_id"
          - "condition_note is present and non-empty"
          - "authorized_weekly_cost_cents <= claim.max_authorized_weekly_cost_cents"
        side_effects:
          - "stamps decided_by_user_id and decided_at"
          - "increments AdjusterDirective.version by 1"
      - from: PENDING
        to: DENIED
        trigger: "POST /rtw/adjuster-directives/{id}/decide with decision == DENIED"
        actor: ClaimAdjuster
        preconditions:
          - "directive.directive_status == PENDING"
          - "X-User-ID == claim.adjuster_user_id"
          - "denial_reason is present and non-empty"
        side_effects:
          - "sets authorized_weekly_cost_cents = 0 and writes denial_reason"
          - "leaves Placement.placement_status at ADJUSTER_PENDING so the coordinator may re-route or terminate the placement"
          - "increments AdjusterDirective.version by 1"
        note: "The three decide branches write disjoint side-effect sets: AUTHORIZED unlocks activation, AUTHORIZED_WITH_CONDITIONS additionally requires a condition_note, and DENIED zeroes the authorization and blocks activation at validation priority 39."
      - from: AUTHORIZED
        to: SUPERSEDED
        trigger: "system: the placement reaches COMPLETED, TERMINATED_EARLY or DECLINED"
        actor: system
        preconditions:
          - "directive.directive_status IN {PENDING, AUTHORIZED, AUTHORIZED_WITH_CONDITIONS}"
        side_effects:
          - "increments AdjusterDirective.version by 1"

  - entity: ProgressionReview
    dimension: review_status
    shape: branching_with_cycle
    initial_state: SCHEDULED
    terminal_states: [ADVANCED, EXTENDED, ESCALATED]
    transitions:
      - from: SCHEDULED
        to: IN_REVIEW
        trigger: "POST /rtw/progression-reviews/{id}/open"
        actor: RTWCoordinator
        preconditions:
          - "review.review_status == SCHEDULED"
          - "placement.placement_status IN {ACTIVE, PROGRESSION_HOLD}"
        side_effects:
          - "stamps reviewed_by_user_id with the caller's X-User-ID"
          - "increments ProgressionReview.version by 1"
      - from: IN_REVIEW
        to: ADVANCED
        trigger: "POST /rtw/progression-reviews/{id}/decide with decision == ADVANCE"
        actor: RTWCoordinator
        preconditions:
          - "review.review_status == IN_REVIEW"
          - "placement.progression_step < MAX_PROGRESSION_STEPS"
          - "no CaseReview of this placement has review_status IN {OPEN, VOTING}"
        side_effects:
          - "computes target_hours_per_day and target_lift_lbs per calculations.progression_step_target"
          - "sets Placement.scheduled_hours_per_day = target_hours_per_day and raises Placement.progression_step by 1"
          - "recomputes Placement.match_score and Placement.projected_weekly_cost_cents"
          - "creates the next ProgressionReview with step_index = this.step_index + 1, review_status = SCHEDULED, due_date = logical clock date + PROGRESSION_REVIEW_INTERVAL_DAYS"
          - "increments ProgressionReview.version by 1"
      - from: IN_REVIEW
        to: EXTENDED
        trigger: "POST /rtw/progression-reviews/{id}/decide with decision == EXTEND"
        actor: RTWCoordinator
        preconditions:
          - "review.review_status == IN_REVIEW"
          - "no CaseReview of this placement has review_status IN {OPEN, VOTING}"
        side_effects:
          - "creates the next ProgressionReview with step_index = this.step_index + 1, review_status = SCHEDULED, due_date = logical clock date + PROGRESSION_REVIEW_INTERVAL_DAYS"
          - "increments ProgressionReview.version by 1"
      - from: IN_REVIEW
        to: ESCALATED
        trigger: "POST /rtw/progression-reviews/{id}/decide with decision == ESCALATE"
        actor: RTWCoordinator
        preconditions:
          - "review.review_status == IN_REVIEW"
        side_effects:
          - "transitions Placement ACTIVE -> PROGRESSION_HOLD"
          - "creates a CaseReview with review_status = OPEN, trigger_reason = DURATION_CAP, quorum_required = 3"
          - "recomputes Claim.rtw_posture to FROZEN"
          - "increments ProgressionReview.version by 1"
      - from: IN_REVIEW
        to: SCHEDULED
        trigger: "POST /rtw/progression-reviews/{id}/decide with decision == DEFER"
        actor: RTWCoordinator
        preconditions:
          - "review.review_status == IN_REVIEW"
          - "review.deferral_count < MAX_REVIEW_DEFERRALS"
        side_effects:
          - "raises ProgressionReview.deferral_count by 1"
          - "pushes due_date out by REVIEW_DEFERRAL_DAYS"
          - "clears reviewed_by_user_id"
          - "increments ProgressionReview.version by 1"
        note: "IN_REVIEW -> SCHEDULED -> IN_REVIEW is the deferral cycle; MAX_REVIEW_DEFERRALS terminates it."

  - entity: CaseReview
    dimension: review_status
    shape: branching_fork_join
    initial_state: OPEN
    terminal_states: [DECIDED_CONTINUE, DECIDED_MODIFY, DECIDED_TERMINATE]
    transitions:
      - from: OPEN
        to: VOTING
        trigger: "POST /rtw/case-reviews/{id}/open-voting"
        actor: OccHealthNurse
        preconditions:
          - "case_review.review_status == OPEN"
        side_effects:
          - "increments CaseReview.version by 1"
      - from: VOTING
        to: DECIDED_CONTINUE
        trigger: "POST /rtw/case-reviews/{id}/close when winning_ballot == CONTINUE"
        actor: OccHealthNurse
        preconditions:
          - "case_review.review_status == VOTING"
          - "case_review.vote_count >= case_review.quorum_required"
          - "case_review.decision_ratio >= CASE_REVIEW_MAJORITY"
          - "X-User-ID is not the voter_user_id of any COUNTED vote on this panel"
        side_effects:
          - "transitions Placement PROGRESSION_HOLD -> ACTIVE when the placement is on hold"
          - "stamps closed_by_user_id"
          - "recomputes Claim.rtw_posture"
          - "increments CaseReview.version by 1"
      - from: VOTING
        to: DECIDED_MODIFY
        trigger: "POST /rtw/case-reviews/{id}/close when winning_ballot == MODIFY"
        actor: OccHealthNurse
        preconditions:
          - "case_review.review_status == VOTING"
          - "case_review.vote_count >= case_review.quorum_required"
          - "case_review.decision_ratio >= CASE_REVIEW_MAJORITY"
          - "X-User-ID is not the voter_user_id of any COUNTED vote on this panel"
        side_effects:
          - "leaves Placement.placement_status unchanged"
          - "sets Placement.scheduled_hours_per_day = max(1, floor(placement.scheduled_hours_per_day * CASE_REVIEW_MODIFY_HOURS_FACTOR))"
          - "recomputes Placement.match_score, Placement.projected_weekly_cost_cents and Placement.reinjury_risk_score under the SURVEILLANCE variant"
          - "creates a ProgressionReview with review_status = SCHEDULED, step_index = 1 + the greatest step_index among this placement's existing reviews, due_date = logical clock date + CASE_REVIEW_MODIFY_FOLLOWUP_DAYS"
          - "stamps closed_by_user_id"
          - "recomputes Claim.rtw_posture"
          - "increments CaseReview.version by 1"
      - from: VOTING
        to: DECIDED_TERMINATE
        trigger: "POST /rtw/case-reviews/{id}/close when winning_ballot == TERMINATE"
        actor: OccHealthNurse
        preconditions:
          - "case_review.review_status == VOTING"
          - "case_review.vote_count >= case_review.quorum_required"
          - "case_review.decision_ratio >= CASE_REVIEW_MAJORITY"
          - "X-User-ID is not the voter_user_id of any COUNTED vote on this panel"
        side_effects:
          - "transitions Placement to TERMINATED_EARLY with ended_on = logical clock calendar date"
          - "lowers TransitionalJob.filled_seats by 1"
          - "flips the placement's live AdjusterDirective rows to SUPERSEDED"
          - "recomputes Placement.benefit_continuation_status to LAPSED"
          - "stamps closed_by_user_id"
          - "recomputes Claim.cumulative_transitional_days and Claim.rtw_posture"
          - "increments CaseReview.version by 1"
        note: "The three close branches fork on winning_ballot and write disjoint side-effect sets: CONTINUE resumes, MODIFY halves the schedule and re-forks a review, TERMINATE ends the placement."

  - entity: TrainingRecord
    dimension: record_status
    shape: cyclic
    initial_state: VALID
    terminal_states: [SUPERSEDED]
    transitions:
      - from: VALID
        to: EXPIRING_SOON
        trigger: "system: POST /_clock/set_current_utc moves the clock into the TRAINING_EXPIRY_WARNING_DAYS window before valid_through"
        actor: system
        preconditions:
          - "record.record_status == VALID"
          - "0 <= (valid_through - logical clock calendar date) in days <= TRAINING_EXPIRY_WARNING_DAYS"
        side_effects:
          - "recomputes Supervisor.training_status"
          - "increments TrainingRecord.version by 1"
      - from: EXPIRING_SOON
        to: EXPIRED
        trigger: "system: POST /_clock/set_current_utc moves the clock past valid_through"
        actor: system
        preconditions:
          - "record.record_status IN {VALID, EXPIRING_SOON}"
          - "valid_through < logical clock calendar date"
        side_effects:
          - "recomputes Supervisor.training_status to EXPIRED"
          - "increments TrainingRecord.version by 1"
      - from: EXPIRED
        to: VALID
        trigger: "POST /rtw/training-records/{id}/renew"
        actor: Supervisor
        preconditions:
          - "record.record_status IN {VALID, EXPIRING_SOON, EXPIRED}"
          - "new_valid_through > logical clock calendar date"
        side_effects:
          - "sets valid_through = new_valid_through and raises renewal_count by 1"
          - "recomputes Supervisor.training_status"
          - "when curriculum_code == RTW_CORE and Supervisor.oversight_status == SUSPENDED: sets Supervisor.strike_forgiveness_points = Supervisor.compliance_strike_points, flips oversight_status to ACTIVE, and flips every TransitionalJob of that supervisor whose job_status == PAUSED back to OPEN"
          - "increments TrainingRecord.version by 1"
        note: "EXPIRED -> VALID closes the certification cycle and is the compensating action for the supervisor-suspension cascade."
      - from: VALID
        to: SUPERSEDED
        trigger: "system: a newer TrainingRecord with the same curriculum_code is created for the same supervisor"
        actor: system
        preconditions:
          - "record.record_status != SUPERSEDED"
        side_effects:
          - "recomputes Supervisor.training_status"
          - "increments TrainingRecord.version by 1"

concurrency_rules:
  - rule_id: restriction-set-create-stale-claim
    parent_entity: Claim
    write_endpoint: "POST /rtw/claims/{id}/restriction-sets"
    occ_field: "expected_claim_version"
    description: |
      Filing a new RestrictionSet against a Claim whose version has advanced since the
      client last observed it is rejected. A restriction intake legitimately supersedes
      the claim's prior clinical picture, so the server cannot tell an intentional
      re-intake from one written against a stale view of the claim; the version check
      makes the difference explicit.
    error_id: ERR_STALE_CLAIM_VERSION
    http_status: 412

  - rule_id: placement-create-stale-restriction-set
    parent_entity: RestrictionSet
    write_endpoint: "POST /rtw/placements"
    occ_field: "expected_restriction_set_version"
    description: |
      Creating a Placement against a RestrictionSet whose version has advanced since the
      client last read it is rejected. Each placement raises the set's active_placement_count
      and each clarification or activation cascade rewrites its limits, so a create carrying
      an out-of-date version was matched against limits the set no longer publishes.
    error_id: ERR_STALE_RESTRICTION_SET_VERSION
    http_status: 412

  - rule_id: vote-cast-stale-case-review
    parent_entity: CaseReview
    write_endpoint: "POST /rtw/case-reviews/{id}/votes"
    occ_field: "expected_case_review_version"
    description: |
      Casting a ballot on a CaseReview whose version has advanced since the member last
      read the tally is rejected. A member's re-vote legitimately supersedes that member's
      prior ballot, so a ballot written against a stale tally would silently displace a
      row the voter never saw.
    error_id: ERR_STALE_CASE_REVIEW_VERSION
    http_status: 412

calculations:
  - name: restriction_severity_index
    trigger: "On RestrictionSet create, on the SUBMITTED -> VERIFIED transition, and whenever a restriction limit field is written"
    algorithm: weighted_scoring
    formula: |
      contribution =   0.40 * (min(max_lift_lbs, 50) / 50) * 100
                     + 0.20 * (min(max_continuous_standing_minutes, 120) / 120) * 100
                     + 0.25 * (min(max_hours_per_day, 8) / 8) * 100
                     + 0.10 * (100 if overhead_reach_allowed else 0)
                     + 0.05 * (100 if driving_allowed else 0)
      severity_index = round_half_up(100 - contribution, 0)     # integer, clamped to [0, 100]
    input_set: "Only the six restriction limit fields on this RestrictionSet row; no other entity participates."
    constants:
      LIFT_REFERENCE_LBS: 50
      STANDING_REFERENCE_MINUTES: 120
      HOURS_REFERENCE_PER_DAY: 8
    precision: "integer, round_half_up"

  - name: restriction_match_score
    trigger: "On POST /rtw/placements and POST /rtw/placements/auto-match (writes Placement.match_score); recomputed on the ProgressionReview IN_REVIEW -> ADVANCED transition and on the CaseReview VOTING -> DECIDED_MODIFY transition"
    algorithm: weighted_scoring
    formula: |
      headroom(limit, demand) = 0 if limit <= 0
                                else clamp((limit - demand) / limit, 0, 1)
      lift_h  = headroom(rs.max_lift_lbs,                    job.demand_lift_lbs)
      stand_h = headroom(rs.max_continuous_standing_minutes,  job.demand_standing_minutes)
      hours_h = headroom(rs.max_hours_per_day,                job.demand_hours_per_day)
      key_h   = headroom(rs.keyboard_minutes_per_hour,        job.demand_keyboard_minutes_per_hour)
      risk_term = 1 - RISK_CLASS_PENALTY[job.risk_class]
      raw = 100 * (  WEIGHT_LIFT      * lift_h
                   + WEIGHT_STANDING  * stand_h
                   + WEIGHT_HOURS     * hours_h
                   + WEIGHT_KEYBOARD  * key_h
                   + WEIGHT_RISK      * risk_term )
      damping = min(1.0, SEVERITY_DAMPING_PIVOT / max(rs.severity_index, 1))
      match_score = round_half_up(clamp(raw * damping, 0.0, 100.0), 2)
    input_set: |
      Exactly one RestrictionSet (the placement's restriction_set_id) and exactly one
      TransitionalJob (the placement's transitional_job_id). The damping term couples the
      job-side headroom terms to the claim-side severity index, so the same job scores
      differently under two different restriction sets.
    constants:
      WEIGHT_LIFT: 0.35
      WEIGHT_STANDING: 0.20
      WEIGHT_HOURS: 0.25
      WEIGHT_KEYBOARD: 0.10
      WEIGHT_RISK: 0.10
      RISK_CLASS_PENALTY: { LOW: 0.0, MEDIUM: 0.35, HIGH: 0.75 }
      SEVERITY_DAMPING_PIVOT: 60
      MIN_ELIGIBLE_MATCH_SCORE: 40.0
    precision: "2 decimal places, round_half_up; the clamp and the damping multiply are applied before the single rounding"

  - name: transitional_job_selector
    trigger: "POST /rtw/placements/auto-match"
    algorithm: selector_policy
    formula: |
      # (a) eligibility filter - an explicit predicate over entity fields
      candidates = TransitionalJob rows where ALL of:
          job.job_status == 'OPEN'
        AND supervisor.oversight_status == 'ACTIVE'
        AND supervisor.training_status IN {'VALID', 'EXPIRING_SOON'}
        AND (request.department_code is absent OR job.department_code == request.department_code)
        AND job.id NOT IN request.exclude_job_ids
        AND job.demand_lift_lbs                     <= rs.max_lift_lbs
        AND job.demand_standing_minutes             <= rs.max_continuous_standing_minutes
        AND job.demand_hours_per_day                <= rs.max_hours_per_day
        AND job.demand_keyboard_minutes_per_hour    <= rs.keyboard_minutes_per_hour
        AND (rs.overhead_reach_allowed OR NOT job.requires_overhead_reach)
        AND (rs.driving_allowed        OR NOT job.requires_driving)
        AND the requested [start_date, end_date] window passes both interval rules in
            validations priority 27 (changeover buffer) and priority 29 (seat capacity)
        AND restriction_match_score(rs, job) >= MIN_ELIGIBLE_MATCH_SCORE
        AND reinjury_risk_score BASELINE variant for (rs, job) < RISK_ESCALATION_THRESHOLD
      # (b) ranking expression
      order by restriction_match_score(rs, job) DESC
      # (c) tie-break chain, applied in order
        then by RISK_CLASS_RANK[job.risk_class] ASC        # LOW=0, MEDIUM=1, HIGH=2
        then by job.hourly_rate_cents DESC                 # higher transitional wage = smaller differential
        then by job.created_at ASC                         # never job.id
      # (d) empty candidate set
      if candidates is empty -> ERR_NO_ELIGIBLE_JOB (422); no Placement row is created
    input_set: "Every TransitionalJob row in the database, filtered by (a) above."
    constants:
      RISK_CLASS_RANK: { LOW: 0, MEDIUM: 1, HIGH: 2 }
      MIN_ELIGIBLE_MATCH_SCORE: 40.0
    precision: "match_score compared at 2 decimal places after rounding"

  - name: reinjury_risk_score
    trigger: "BASELINE variant on POST /rtw/placements and POST /rtw/placements/auto-match; SURVEILLANCE variant on every ComplianceAudit create, on the ReinjuryReport SUBMITTED -> TRIAGED transition, and on the CaseReview VOTING -> DECIDED_MODIFY transition"
    algorithm: weighted_scoring
    formula: |
      demand_pressure(rs, job) = clamp(max( job.demand_lift_lbs                  / rs.max_lift_lbs,
                                            job.demand_standing_minutes          / rs.max_continuous_standing_minutes,
                                            job.demand_hours_per_day             / rs.max_hours_per_day,
                                            job.demand_keyboard_minutes_per_hour / rs.keyboard_minutes_per_hour ), 0, 1.5)
      structural(rs, job) =   RISK_BASE_BY_JOB_RISK_CLASS[job.risk_class]
                            + RISK_SEVERITY_WEIGHT * rs.severity_index
                            + RISK_HEADROOM_WEIGHT * demand_pressure(rs, job)
      observed(placement) =
            SUM over ComplianceAudit a of this placement, ordered observed_on ASC then created_at ASC, of
                 COMPLIANCE_SEVERITY_POINTS[a.finding_severity]
                 * clamp(1 - AUDIT_DECAY_PER_30_DAYS * floor(max(0, days_between(a.observed_on, clock_date)) / 30), 0, 1)
          + SUM over ReinjuryReport r of this placement with report_status IN {TRIAGED, ESCALATED} of
                 REINJURY_SEVERITY_POINTS[r.severity]                      # reinjury points never decay
      reinjury_risk_score = round_half_up(clamp(<variant expression>, 0, 100), 0)
    input_set: |
      BASELINE reads only the RestrictionSet named by placement.restriction_set_id and the
      TransitionalJob named by placement.transitional_job_id; no ComplianceAudit or
      ReinjuryReport row participates. SURVEILLANCE additionally reads every ComplianceAudit
      of the placement and every ReinjuryReport of the placement whose report_status is
      TRIAGED or ESCALATED, and evaluates the structural term against the claim's CURRENT
      active RestrictionSet rather than the one pinned at creation.
    constants:
      RISK_BASE_BY_JOB_RISK_CLASS: { LOW: 12, MEDIUM: 28, HIGH: 46 }
      RISK_SEVERITY_WEIGHT: 0.45
      RISK_HEADROOM_WEIGHT: 22.0
      COMPLIANCE_SEVERITY_POINTS: { NONE: 0, MINOR: 4, MAJOR: 11, CRITICAL: 25 }
      REINJURY_SEVERITY_POINTS: { NEAR_MISS: 6, MINOR: 14, SIGNIFICANT: 26, SEVERE: 40 }
      AUDIT_DECAY_PER_30_DAYS: 0.5
      RISK_ESCALATION_THRESHOLD: 70
    precision: "integer, round_half_up, clamped to [0, 100]"
    variants:
      - name: BASELINE
        when: "Placement creation, before any observation exists"
        difference: "score = structural(placement.restriction_set, placement.job); the observed() term is omitted entirely and the restriction set is the one referenced by placement.restriction_set_id."
      - name: SURVEILLANCE
        when: "Every recomputation after creation"
        difference: "score = structural(claim.active_restriction_set, placement.job) + observed(placement); the structural term re-reads the claim's currently ACTIVE restriction set, so an intervening restriction revision moves the score even when no observation was filed."

  - name: wage_differential_period_amount
    trigger: "POST /rtw/placements/{id}/wage-differential-entries; writes counted_day_count, tier_multiplier, gross_differential_cents, offset_cents and net_amount_cents on the new WageDifferentialEntry, then recomputes Claim.wage_differential_paid_cents"
    algorithm: tiered_pricing
    formula: |
      pre_injury_daily_wage_cents = employee.pre_injury_weekly_wage_cents / WORKDAYS_PER_WEEK   # exact rational, never rounded here
      day_gap(h) = max(0, pre_injury_daily_wage_cents - job.hourly_rate_cents * h)

      # ---- PROVISIONAL: forward-looking, sum THEN round (one rounding, at the end) ----
      counted_day_count = number of calendar days d in [period_start, period_end] whose weekday
                          is Monday..Friday
      gross_pre_cap = round_half_up( counted_day_count
                                     * STATUTORY_REPLACEMENT_RATE
                                     * day_gap(placement.scheduled_hours_per_day), 0 )
      tier_multiplier = TIER1_MULTIPLIER          # always tier 1; cumulative duration is not yet known
      offset_cents    = 0

      # ---- FINAL: chronological, round PER DAY then sum (rounding order is pinned here) ----
      counted_day_count = number of entries in placement.logged_hours whose work_date lies in
                          [period_start, period_end], walked in work_date ASC order
      gross_pre_tier = SUM over those entries of
                          round_half_up( STATUTORY_REPLACEMENT_RATE * day_gap(entry.hours_worked), 0 )
      elapsed_weeks  = floor( days_between(placement.start_date, period_start) / 7 ) + 1
      tier_multiplier = TIER1_MULTIPLIER if elapsed_weeks <= TIER1_MAX_WEEKS
                        else TIER2_MULTIPLIER if elapsed_weeks <= TIER2_MAX_WEEKS
                        else TIER3_MULTIPLIER
      gross_pre_cap  = round_half_up( gross_pre_tier * tier_multiplier, 0 )
      offset_cents   = round_half_up( gross_differential_cents * BENEFIT_OFFSET_RATE, 0 )
                       if placement.benefit_continuation_status == 'EMPLOYER_SUBSIDIZED' else 0

      # ---- shared tail, in this exact order ----
      period_weeks             = ceil(counted_day_count / WORKDAYS_PER_WEEK)
      gross_differential_cents = min(gross_pre_cap, WEEKLY_DIFFERENTIAL_CAP_CENTS * period_weeks)
      net_amount_cents         = gross_differential_cents - offset_cents
    input_set: |
      One Placement, its TransitionalJob (hourly_rate_cents) and the Claim's Employee
      (pre_injury_weekly_wage_cents). PROVISIONAL ignores placement.logged_hours entirely and
      synthesises Monday-Friday days from the requested period; FINAL reads only the
      logged_hours entries whose work_date falls inside the period, in work_date ASC order.
    constants:
      STATUTORY_REPLACEMENT_RATE: 0.6667
      WORKDAYS_PER_WEEK: 5
      TIER1_MAX_WEEKS: 8
      TIER2_MAX_WEEKS: 16
      TIER1_MULTIPLIER: 1.00
      TIER2_MULTIPLIER: 0.90
      TIER3_MULTIPLIER: 0.80
      WEEKLY_DIFFERENTIAL_CAP_CENTS: 90000
      BENEFIT_OFFSET_RATE: 0.05
    precision: "whole cents, round_half_up; PROVISIONAL rounds exactly once (after summing), FINAL rounds once per day before summing and once more after the tier multiply"
    variants:
      - name: PROVISIONAL
        when: "Accrual posted at or before the period is worked"
        difference: "Uses scheduled_hours_per_day for every Monday-Friday day in the period, pins tier_multiplier to 1.00, applies no benefit offset, and rounds only once after the sum."
      - name: FINAL
        when: "Reconciliation posted after hours are logged"
        difference: "Uses the actually logged hours per day, rounds each day's differential to whole cents before summing, applies the duration tier multiplier, and withholds the benefit offset when the placement is EMPLOYER_SUBSIDIZED."

  - name: benefit_continuation_premium_split
    trigger: "On the Placement ADJUSTER_PENDING -> ACTIVE transition and on every Placement status change; writes employer_premium_share_cents, employee_premium_share_cents and benefit_continuation_status"
    algorithm: constraint_propagation
    formula: |
      # The tier key looks circular - the subsidy factor is keyed on the employer share, but the
      # employer share is the residual after the subsidised employee share. The evaluation order
      # below is normative: the tier is keyed on the PROVISIONAL employer share computed in STEP 3
      # and is NEVER re-keyed on the final employer share produced in STEP 6.
      STEP 1: total_cents           = MONTHLY_PREMIUM_BY_TIER_CENTS[employee.benefit_tier]
      STEP 2: provisional_employee  = round_half_up(total_cents * BASE_EMPLOYEE_CONTRIBUTION_RATE, 0)
      STEP 3: provisional_employer  = total_cents - provisional_employee
      STEP 4: subsidy_factor        = SUBSIDY_FACTOR_T1 if provisional_employer <= SUBSIDY_T1_UPTO_CENTS
                                      else SUBSIDY_FACTOR_T2 if provisional_employer <= SUBSIDY_T2_UPTO_CENTS
                                      else SUBSIDY_FACTOR_T3
      STEP 5: employee_premium_share_cents = round_half_up(provisional_employee * subsidy_factor, 0)
      STEP 6: employer_premium_share_cents = total_cents - employee_premium_share_cents

      benefit_continuation_status =
          'LAPSED'              if placement_status IN {COMPLETED, TERMINATED_EARLY, DECLINED}
          'PENDING'             if placement_status IN {PROPOSED, ADJUSTER_PENDING}
          'EMPLOYER_SUBSIDIZED' if placement_status IN {ACTIVE, PROGRESSION_HOLD, SUSPENDED}
                                   and employee.benefit_tier IN {TIER_A, TIER_B}
          'EMPLOYEE_PAID'       if placement_status IN {ACTIVE, PROGRESSION_HOLD, SUSPENDED}
                                   and employee.benefit_tier == 'TIER_C'
    input_set: "One Employee (benefit_tier) and one Placement (placement_status). No aggregation."
    constants:
      MONTHLY_PREMIUM_BY_TIER_CENTS: { TIER_A: 68000, TIER_B: 52000, TIER_C: 41000 }
      BASE_EMPLOYEE_CONTRIBUTION_RATE: 0.28
      SUBSIDY_T1_UPTO_CENTS: 38000
      SUBSIDY_T2_UPTO_CENTS: 55000
      SUBSIDY_FACTOR_T1: 0.90
      SUBSIDY_FACTOR_T2: 0.70
      SUBSIDY_FACTOR_T3: 0.55
    precision: "whole cents, round_half_up at STEP 2 and STEP 5 only; STEP 3 and STEP 6 are exact integer subtractions"

  - name: projected_weekly_cost
    trigger: "On Placement create, on the PROPOSED -> ADJUSTER_PENDING transition (copied into AdjusterDirective.requested_weekly_cost_cents), on progression ADVANCE and on CaseReview DECIDED_MODIFY"
    algorithm: aggregation
    formula: |
      transitional_wage_cents = round_half_up(job.hourly_rate_cents * placement.scheduled_hours_per_day
                                              * WORKDAYS_PER_WEEK, 0)
      differential_cents      = round_half_up(STATUTORY_REPLACEMENT_RATE
                                              * max(0, employee.pre_injury_weekly_wage_cents
                                                       - job.hourly_rate_cents * placement.scheduled_hours_per_day
                                                         * WORKDAYS_PER_WEEK), 0)
      benefit_cents           = round_half_up(placement.employer_premium_share_cents / 4, 0)
      projected_weekly_cost_cents = transitional_wage_cents + differential_cents + benefit_cents
    input_set: "One Placement, its TransitionalJob and the Claim's Employee. Each of the three addends is rounded to whole cents before they are summed."
    constants:
      STATUTORY_REPLACEMENT_RATE: 0.6667
      WORKDAYS_PER_WEEK: 5
      PREMIUM_WEEKS_PER_MONTH: 4
    precision: "whole cents, round_half_up per addend, then exact integer addition"

  - name: placement_duration_ledger
    trigger: "On every Placement status transition, on POST /rtw/placements/{id}/extend, and on POST /_clock/set_current_utc"
    algorithm: aggregation
    formula: |
      effective_through(p) =
          p.ended_on        if p.placement_status IN {COMPLETED, TERMINATED_EARLY}
          clock_date        if p.placement_status IN {ACTIVE, PROGRESSION_HOLD, SUSPENDED}
          null              if p.placement_status IN {PROPOSED, ADJUSTER_PENDING, DECLINED}
      cumulative_days(p) = 0 if p.activated_on is null or effective_through(p) is null
                           else max(0, days_between(p.activated_on,
                                                    min(effective_through(p), p.end_date)) + 1)
      Claim.cumulative_transitional_days =
          SUM of cumulative_days(p) over every Placement p with p.claim_id == claim.id
          AND p.placement_status IN {ACTIVE, PROGRESSION_HOLD, SUSPENDED, COMPLETED, TERMINATED_EARLY}
          (PROPOSED, ADJUSTER_PENDING and DECLINED placements contribute nothing);
          the sum is order-independent, so no tie-break applies.

      # projection used by the extend endpoint's cap checks
      projected_cumulative(p, new_end_date) =
          Claim.cumulative_transitional_days
          - cumulative_days(p)
          + max(0, days_between(p.start_date, new_end_date) + 1)
    input_set: "Every Placement of the claim whose placement_status is in the five-value set above; both interval endpoints are inclusive."
    constants:
      DURATION_SOFT_CAP_DAYS: 90
      DURATION_HARD_CAP_DAYS: 180
      PROGRESSION_REVIEW_INTERVAL_DAYS: 30
    precision: "integer days, both endpoints inclusive"

  - name: progression_step_target
    trigger: "ProgressionReview IN_REVIEW -> ADVANCED"
    algorithm: constraint_propagation
    formula: |
      rs = the claim's RestrictionSet whose status == ACTIVE
      target_hours_per_day = min( placement.scheduled_hours_per_day + PROGRESSION_HOURS_STEP,
                                  rs.max_hours_per_day,
                                  employee.pre_injury_weekly_hours / WORKDAYS_PER_WEEK )
      target_lift_lbs      = min( round_half_up(job.demand_lift_lbs * (1 + PROGRESSION_LIFT_STEP_PCT), 2),
                                  rs.max_lift_lbs )
    input_set: "One Placement, the claim's currently ACTIVE RestrictionSet, the placement's TransitionalJob and the Claim's Employee."
    constants:
      PROGRESSION_HOURS_STEP: 1
      PROGRESSION_LIFT_STEP_PCT: 0.25
      MAX_PROGRESSION_STEPS: 4
      MAX_REVIEW_DEFERRALS: 2
      REVIEW_DEFERRAL_DAYS: 14
      WORKDAYS_PER_WEEK: 5
    precision: "hours to 2 decimal places, lift to 2 decimal places, round_half_up"

  - name: case_review_tally
    trigger: "On every CaseReviewVote create and on POST /rtw/case-reviews/{id}/close"
    algorithm: aggregation
    formula: |
      counted = CaseReviewVote rows with case_review_id == cr.id AND vote_status == 'COUNTED'
      vote_count      = count(counted)
      continue_votes  = count(counted where ballot == 'CONTINUE')
      modify_votes    = count(counted where ballot == 'MODIFY')
      terminate_votes = count(counted where ballot == 'TERMINATE')
      max_count       = max(continue_votes, modify_votes, terminate_votes)
      winning_ballot  = the ballot attaining max_count; when two or more ballots tie at
                        max_count the most conservative wins, in the fixed order
                        TERMINATE > MODIFY > CONTINUE
      decision_ratio  = 0 if vote_count == 0 else round_half_up(max_count / vote_count, 4)
    input_set: "Only COUNTED votes of this panel; SUPERSEDED rows are excluded from every count."
    constants:
      CASE_REVIEW_MAJORITY: 0.6600
      CASE_REVIEW_MODIFY_HOURS_FACTOR: 0.5
      CASE_REVIEW_MODIFY_FOLLOWUP_DAYS: 14
      COMPLIANCE_STRIKE_POINTS: { NONE: 0, MINOR: 0, MAJOR: 1, CRITICAL: 2 }
      COMPLIANCE_STRIKE_SUSPENSION_THRESHOLD: 2
    precision: "decision_ratio to 4 decimal places, round_half_up; compared with >= against CASE_REVIEW_MAJORITY"

  - name: supervisor_training_status
    trigger: "On TrainingRecord create, renew, every clock advance, and on every read of a Supervisor"
    algorithm: projection
    formula: |
      pool = TrainingRecord rows with supervisor_id == s.id
             AND curriculum_code == 'RTW_CORE'
             AND record_status != 'SUPERSEDED'
      if pool is empty: training_status = 'NONE'
      else:
        governing = the row in pool with the greatest valid_through;
                    when two rows share the greatest valid_through, the one with the
                    earlier created_at governs (created_at ASC; never id)
        training_status = governing.record_status        # VALID | EXPIRING_SOON | EXPIRED
    input_set: "Only RTW_CORE records; RESTRICTION_HANDLING and REINJURY_RESPONSE records never move training_status."
    constants:
      TRAINING_EXPIRY_WARNING_DAYS: 30
    precision: "enum, no rounding"

  - name: claim_rtw_posture
    trigger: "On every Placement status or compliance_status change, every CaseReview status change, every RestrictionSet activation or expiry, every wage entry post, and every clock advance"
    algorithm: threshold
    formula: |
      rtw_posture =
        'FROZEN'      if claim.claim_status == 'SUSPENDED'
                      OR there exists a CaseReview cr with cr.placement_id IN (the claim's placements)
                         AND cr.review_status IN {'OPEN', 'VOTING'}
        'RESTRICTED'  elif there exists a Placement p of this claim with
                              p.placement_status IN {'ACTIVE', 'PROGRESSION_HOLD', 'SUSPENDED'}
                              AND p.compliance_status IN {'WATCH', 'NONCOMPLIANT'}
                      OR claim.cumulative_transitional_days >= DURATION_SOFT_CAP_DAYS
        'OPEN'        else
    input_set: "Every Placement of the claim and every CaseReview attached to those placements; REMEDIATED and COMPLIANT placements never raise the posture."
    constants:
      DURATION_SOFT_CAP_DAYS: 90
    precision: "enum, no rounding"

  - name: program_outcome_metrics
    trigger: "GET /rtw/programs/metrics"
    algorithm: aggregation
    formula: |
      window_start defaults to 1970-01-01 and window_end defaults to 2999-12-31 when omitted
      cohort = Placement rows where
                 placement_status IN {ACTIVE, PROGRESSION_HOLD, SUSPENDED, COMPLETED, TERMINATED_EARLY}
                 AND activated_on IS NOT NULL
                 AND window_start <= activated_on <= window_end            # both endpoints inclusive
                 AND (department_code absent OR the placement's TransitionalJob.department_code matches)
      total_placements   = count(cohort)
      active_placements  = count(cohort where placement_status IN {ACTIVE, PROGRESSION_HOLD})
      completed_count    = count(cohort where placement_status == 'COMPLETED')
      reinjury_count     = count(cohort placements having >= 1 ReinjuryReport with
                                 report_status IN {TRIAGED, ESCALATED})
      compliant_count    = count(cohort where compliance_status IN {COMPLIANT, REMEDIATED})
      if total_placements == 0:
          successful_return_rate = 0.0; average_duration_days = 0.0
          reinjury_rate = 0.0;          compliance_rate = 0.0
      else:
          successful_return_rate = round_half_up(completed_count / total_placements, 4)
          average_duration_days  = round_half_up(SUM(cumulative_days over cohort) / total_placements, 2)
          reinjury_rate          = round_half_up(reinjury_count / total_placements, 4)
          compliance_rate        = round_half_up(compliant_count / total_placements, 4)
      total_wage_differential_cents = SUM of net_amount_cents over every WageDifferentialEntry
                                      whose placement_id is in the cohort, regardless of entry_status
    input_set: "The cohort predicate above; the sum is order-independent so no tie-break applies."
    constants:
      DEFAULT_WINDOW_START: "1970-01-01"
      DEFAULT_WINDOW_END: "2999-12-31"
    precision: "rates to 4 decimal places round_half_up; average_duration_days to 2 decimal places round_half_up; counts and cents are integers"

validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are both present and X-User-Role is one of the seven roles in the RBAC matrix."
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "The caller's X-User-Role appears in the endpoint's declared roles list."
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all

  - priority: 3
    category: business_constraint
    check: "Request body and query string conform to the endpoint's input schema: every required field present, enum values inside their declared sets, numbers inside their declared ranges, dates parseable as YYYY-MM-DD, limit within [1,100] and offset >= 0, and end_date >= start_date / period_end >= period_start / valid_through >= effective_from."
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all

  - priority: 4
    category: existence
    check: "Every path-templated id resolves to a live row, validated left-to-right in path order."
    error_id: "ERR_EMPLOYEE_NOT_FOUND | ERR_CLAIM_NOT_FOUND | ERR_PROVIDER_NOT_FOUND | ERR_RESTRICTION_SET_NOT_FOUND | ERR_SUPERVISOR_NOT_FOUND | ERR_TRAINING_RECORD_NOT_FOUND | ERR_JOB_NOT_FOUND | ERR_PLACEMENT_NOT_FOUND | ERR_DIRECTIVE_NOT_FOUND | ERR_PROGRESSION_REVIEW_NOT_FOUND | ERR_REINJURY_REPORT_NOT_FOUND | ERR_CASE_REVIEW_NOT_FOUND | ERR_WAGE_ENTRY_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with path parameters"

  - priority: 5
    category: existence
    check: "Every foreign-key id supplied in the request body or query string resolves to a live row."
    error_id: "ERR_PROVIDER_NOT_FOUND | ERR_RESTRICTION_SET_NOT_FOUND | ERR_JOB_NOT_FOUND | ERR_SUPERVISOR_NOT_FOUND | ERR_WAGE_ENTRY_NOT_FOUND"
    http_status: 404
    applies_to: "POST /rtw/claims/{id}/restriction-sets, POST /rtw/placements, POST /rtw/placements/auto-match, POST /rtw/transitional-jobs, GET /rtw/placements, GET /rtw/restriction-sets, GET /rtw/wage-differential-entries"

  - priority: 6
    category: auth
    check: "For entity_backed roles the acting X-User-ID owns the addressed resource: TreatingProvider == restriction_set.treating_provider_id (and == body treating_provider_id on create); Supervisor == placement.supervisor_id or == training_record.supervisor_id or == supervisor_id in the path; Employee == claim.employee_id of the addressed claim or placement, or == the addressed employee_id."
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "all endpoints whose roles list includes TreatingProvider, Supervisor or Employee"

  - priority: 7
    category: auth
    check: "Segregation of duties. (a) On POST /rtw/case-reviews/{id}/votes the caller's X-User-ID must not equal the placement's created_by_user_id. (b) On POST /rtw/case-reviews/{id}/close the caller's X-User-ID must not equal the voter_user_id of any COUNTED vote on the panel."
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /rtw/case-reviews/{id}/votes, POST /rtw/case-reviews/{id}/close"

  - priority: 8
    category: state
    check: "The addressed row is not already in a terminal state for its state machine. Terminal-state lockdown is checked BEFORE the from-state check, so a request against a terminal row always answers ERR_ALREADY_TERMINAL and never ERR_INVALID_STATE."
    error_id: ERR_ALREADY_TERMINAL
    http_status: 409
    applies_to: "every transition endpoint"

  - priority: 9
    category: state
    check: "The addressed row's current state is a declared `from:` state for the requested transition. Reached only when the row is non-terminal."
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "every transition endpoint"

  - priority: 10
    category: state
    check: "The referenced RestrictionSet has status == ACTIVE."
    error_id: ERR_RESTRICTION_SET_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /rtw/placements, POST /rtw/placements/auto-match, POST /rtw/placements/{id}/submit-to-adjuster, POST /rtw/placements/{id}/activate, POST /rtw/placements/{id}/resume"

  - priority: 11
    category: state
    check: "The owning Claim has claim_status == RTW_ELIGIBLE."
    error_id: ERR_CLAIM_NOT_RTW_ELIGIBLE
    http_status: 409
    applies_to: "POST /rtw/placements, POST /rtw/placements/auto-match"

  - priority: 12
    category: state
    check: "The addressed AdjusterDirective has directive_status == PENDING."
    error_id: ERR_DIRECTIVE_ALREADY_DECIDED
    http_status: 409
    applies_to: "POST /rtw/adjuster-directives/{id}/decide"

  - priority: 13
    category: state
    check: "The addressed CaseReview has review_status == VOTING."
    error_id: ERR_CASE_REVIEW_NOT_VOTING
    http_status: 409
    applies_to: "POST /rtw/case-reviews/{id}/votes, POST /rtw/case-reviews/{id}/close"

  - priority: 14
    category: state
    check: "The addressed WageDifferentialEntry has entry_status == POSTED."
    error_id: ERR_WAGE_ENTRY_ALREADY_REVERSED
    http_status: 409
    applies_to: "POST /rtw/wage-differential-entries/{id}/reverse"

  - priority: 15
    category: business_safety
    check: "The owning Claim's rtw_posture is not FROZEN."
    error_id: ERR_CLAIM_POSTURE_FROZEN
    http_status: 409
    applies_to: "POST /rtw/placements, POST /rtw/placements/auto-match, POST /rtw/placements/{id}/submit-to-adjuster, POST /rtw/placements/{id}/activate, POST /rtw/placements/{id}/extend, POST /rtw/placements/{id}/resume"

  - priority: 16
    category: business_safety
    check: "The owning Claim's rtw_posture is not RESTRICTED."
    error_id: ERR_CLAIM_POSTURE_RESTRICTED
    http_status: 409
    applies_to: "POST /rtw/placements, POST /rtw/placements/auto-match"

  - priority: 17
    category: business_safety
    check: "The RestrictionSet's TreatingProvider has credential_status == VERIFIED."
    error_id: ERR_PROVIDER_CREDENTIAL_REVOKED
    http_status: 422
    applies_to: "POST /rtw/claims/{id}/restriction-sets, POST /rtw/restriction-sets/{id}/submit, POST /rtw/restriction-sets/{id}/verify"

  - priority: 18
    category: business_temporal
    check: "The RestrictionSet's valid_through is on or after the logical clock's calendar date."
    error_id: ERR_RESTRICTION_WINDOW_INVALID
    http_status: 422
    applies_to: "POST /rtw/restriction-sets/{id}/activate"

  - priority: 19
    category: business_safety
    check: "Every hard restriction limit covers the job's demand: demand_lift_lbs <= max_lift_lbs, demand_standing_minutes <= max_continuous_standing_minutes, demand_hours_per_day <= max_hours_per_day, demand_keyboard_minutes_per_hour <= keyboard_minutes_per_hour, overhead_reach_allowed OR NOT requires_overhead_reach, driving_allowed OR NOT requires_driving; and scheduled_hours_per_day <= max_hours_per_day."
    error_id: ERR_RESTRICTION_VIOLATION
    http_status: 422
    applies_to: "POST /rtw/placements, POST /rtw/placements/{id}/extend"

  - priority: 20
    category: business_safety
    check: "The computed restriction_match_score is >= MIN_ELIGIBLE_MATCH_SCORE (40.0)."
    error_id: ERR_MATCH_SCORE_BELOW_FLOOR
    http_status: 422
    applies_to: "POST /rtw/placements"

  - priority: 21
    category: business_safety
    check: "The BASELINE reinjury_risk_score is strictly below RISK_ESCALATION_THRESHOLD (70)."
    error_id: ERR_REINJURY_RISK_TOO_HIGH
    http_status: 422
    applies_to: "POST /rtw/placements"

  - priority: 22
    category: business_safety
    check: "hours_worked is <= the claim's currently ACTIVE RestrictionSet.max_hours_per_day."
    error_id: ERR_HOURS_EXCEED_RESTRICTION
    http_status: 422
    applies_to: "POST /rtw/placements/{id}/hours-log"

  - priority: 23
    category: business_safety
    check: "The placement's Supervisor has oversight_status == ACTIVE."
    error_id: ERR_SUPERVISOR_OVERSIGHT_SUSPENDED
    http_status: 409
    applies_to: "POST /rtw/placements/{id}/activate, POST /rtw/placements/{id}/resume"

  - priority: 24
    category: business_safety
    check: "The placement's Supervisor has training_status IN {VALID, EXPIRING_SOON}."
    error_id: ERR_SUPERVISOR_TRAINING_EXPIRED
    http_status: 409
    applies_to: "POST /rtw/placements/{id}/activate, POST /rtw/placements/{id}/resume"

  - priority: 25
    category: business_temporal
    check: "The placement window sits inside the restriction window: start_date >= restriction_set.effective_from AND end_date <= restriction_set.valid_through."
    error_id: ERR_PLACEMENT_OUTSIDE_RESTRICTION_WINDOW
    http_status: 422
    applies_to: "POST /rtw/placements, POST /rtw/placements/{id}/extend"

  - priority: 26
    category: business_temporal
    check: "HALF-OPEN interval rule on the Employee resource. Treating each placement window as [start_date, end_date), the proposed window must not intersect the window of any other Placement of the same Employee whose placement_status IN {PROPOSED, ADJUSTER_PENDING, ACTIVE, PROGRESSION_HOLD, SUSPENDED}. Adjacency is legal: a window starting exactly on another's end_date does not collide, and a zero-day gap is fine."
    error_id: ERR_PLACEMENT_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /rtw/placements, POST /rtw/placements/auto-match, POST /rtw/placements/{id}/extend"

  - priority: 27
    category: business_temporal
    check: "CLOSED interval + CHANGEOVER BUFFER rule on the TransitionalJob resource. Treating each placement window as the closed interval [start_date, end_date], a proposed window on the same job must not begin within SEAT_CHANGEOVER_BUFFER_DAYS (1) day after another occupant's end_date: the rule rejects whenever 0 <= (proposed.start_date - occupant.end_date) in days <= 1 for any Placement on that job with placement_status IN {ADJUSTER_PENDING, ACTIVE, PROGRESSION_HOLD}. Unlike priority 26 the endpoints are inclusive and a zero-day gap is forbidden; a two-day gap is the first legal successor start."
    error_id: ERR_JOB_CHANGEOVER_BUFFER
    http_status: 409
    applies_to: "POST /rtw/placements, POST /rtw/placements/auto-match"

  - priority: 28
    category: business_temporal
    check: "No other WageDifferentialEntry of the same placement with the same variant already covers any day in [period_start, period_end] (closed interval on both ends)."
    error_id: ERR_WAGE_PERIOD_OVERLAP
    http_status: 409
    applies_to: "POST /rtw/placements/{id}/wage-differential-entries"

  - priority: 29
    category: business_constraint
    check: "AGGREGATE capacity rule on the TransitionalJob resource: for every calendar day d in the proposed closed window [start_date, end_date], count(Placement on this job with placement_status IN {ADJUSTER_PENDING, ACTIVE, PROGRESSION_HOLD} AND start_date <= d <= end_date) + 1 must be <= job.seat_capacity."
    error_id: ERR_JOB_SEAT_UNAVAILABLE
    http_status: 409
    applies_to: "POST /rtw/placements, POST /rtw/placements/auto-match, POST /rtw/placements/{id}/resume"

  - priority: 30
    category: business_constraint
    check: "The job must be bookable: job_status == OPEN."
    error_id: ERR_JOB_NOT_OPEN
    http_status: 409
    applies_to: "POST /rtw/placements"

  - priority: 31
    category: business_constraint
    check: "The selector's candidate set after applying every eligibility predicate is non-empty."
    error_id: ERR_NO_ELIGIBLE_JOB
    http_status: 422
    applies_to: "POST /rtw/placements/auto-match"

  - priority: 32
    category: business_constraint
    check: "placement.progression_step < MAX_PROGRESSION_STEPS (4) for an ADVANCE decision."
    error_id: ERR_MAX_PROGRESSION_STEPS
    http_status: 422
    applies_to: "POST /rtw/progression-reviews/{id}/decide"

  - priority: 33
    category: business_constraint
    check: "review.deferral_count < MAX_REVIEW_DEFERRALS (2) for a DEFER decision."
    error_id: ERR_MAX_DEFERRALS_REACHED
    http_status: 422
    applies_to: "POST /rtw/progression-reviews/{id}/decide"

  - priority: 34
    category: business_constraint
    check: "case_review.vote_count >= case_review.quorum_required."
    error_id: ERR_QUORUM_NOT_MET
    http_status: 409
    applies_to: "POST /rtw/case-reviews/{id}/close"

  - priority: 35
    category: business_constraint
    check: "case_review.decision_ratio >= CASE_REVIEW_MAJORITY (0.6600)."
    error_id: ERR_MAJORITY_NOT_REACHED
    http_status: 409
    applies_to: "POST /rtw/case-reviews/{id}/close"

  - priority: 36
    category: business_referential
    check: "projected_cumulative(placement, new_end_date) < DURATION_HARD_CAP_DAYS (180)."
    error_id: ERR_DURATION_HARD_CAP
    http_status: 422
    applies_to: "POST /rtw/placements/{id}/extend"

  - priority: 37
    category: business_referential
    check: "projected_cumulative(placement, new_end_date) < DURATION_SOFT_CAP_DAYS (90), OR the placement has a CaseReview whose review_status == DECIDED_CONTINUE."
    error_id: ERR_DURATION_SOFT_CAP_REQUIRES_CASE_REVIEW
    http_status: 409
    applies_to: "POST /rtw/placements/{id}/extend"

  - priority: 38
    category: business_referential
    check: "A current AdjusterDirective exists for the placement and its directive_status is no longer PENDING. Only the missing-directive and still-PENDING cases fail here; a DENIED directive passes this row and is caught by priority 39."
    error_id: ERR_ADJUSTER_AUTHORIZATION_MISSING
    http_status: 409
    applies_to: "POST /rtw/placements/{id}/activate"

  - priority: 39
    category: business_referential
    check: "The placement's current AdjusterDirective has directive_status IN {AUTHORIZED, AUTHORIZED_WITH_CONDITIONS}; a DENIED directive fails here."
    error_id: ERR_ADJUSTER_DIRECTIVE_DENIED
    http_status: 409
    applies_to: "POST /rtw/placements/{id}/activate"

  - priority: 40
    category: business_fiscal
    check: "On decide: authorized_weekly_cost_cents <= claim.max_authorized_weekly_cost_cents. On activate and extend: placement.projected_weekly_cost_cents <= directive.authorized_weekly_cost_cents."
    error_id: ERR_ADJUSTER_AUTHORIZATION_EXCEEDED
    http_status: 422
    applies_to: "POST /rtw/adjuster-directives/{id}/decide, POST /rtw/placements/{id}/activate, POST /rtw/placements/{id}/extend"

  - priority: 41
    category: business_constraint
    check: "The OCC guard: the supplied expected_<parent>_version equals the parent row's current version."
    error_id: "ERR_STALE_CLAIM_VERSION | ERR_STALE_RESTRICTION_SET_VERSION | ERR_STALE_CASE_REVIEW_VERSION"
    http_status: 412
    applies_to: "POST /rtw/claims/{id}/restriction-sets, POST /rtw/placements, POST /rtw/case-reviews/{id}/votes"

  - priority: 42
    category: business_constraint
    check: "employee_number, claim_number and npi are each unique across their entity."
    error_id: ERR_DUPLICATE_IDENTIFIER
    http_status: 409
    applies_to: "POST /rtw/employees, POST /rtw/employees/{id}/claims, POST /rtw/treating-providers"

  - priority: 43
    category: business_referential
    check: "An ADVANCE or EXTEND progression decision requires that no CaseReview of the placement has review_status IN {OPEN, VOTING}."
    error_id: ERR_CASE_REVIEW_IN_PROGRESS
    http_status: 409
    applies_to: "POST /rtw/progression-reviews/{id}/decide"

endpoints:
  # ---------- Employees & Claims ----------
  - method: POST
    path: "/rtw/employees"
    description: "Register an injured worker in the return-to-work program."
    roles: [ProgramAdmin]
    code: 201
    input: [full_name, employee_number, department_code, pre_injury_weekly_wage_cents, pre_injury_weekly_hours, benefit_tier, "employment_status?"]
    output: Employee
    side_effects: ["initialises open_claim_count to 0"]

  - method: GET
    path: "/rtw/employees/{id}"
    description: "Read one worker."
    roles: [ProgramAdmin, RTWCoordinator, OccHealthNurse, ClaimAdjuster, Supervisor, Employee]
    code: 200
    input: []
    output: Employee
    side_effects: []

  - method: POST
    path: "/rtw/employees/{id}/claims"
    description: "Open a workers-compensation claim for a worker."
    roles: [ProgramAdmin, ClaimAdjuster]
    code: 201
    input: [claim_number, adjuster_user_id, injury_date]
    output: Claim
    side_effects: ["sets claim_status = OPEN and rtw_posture = OPEN", "raises Employee.open_claim_count by 1"]

  - method: GET
    path: "/rtw/employees/{id}/claims"
    description: "List every claim of a worker (FK reverse-reachability for Claim.employee_id)."
    roles: [ProgramAdmin, RTWCoordinator, OccHealthNurse, ClaimAdjuster, Employee]
    code: 200
    input: ["claim_status?", "limit?", "offset?"]
    output: Claim[]
    side_effects: []

  - method: GET
    path: "/rtw/claims/{id}"
    description: "Read one claim with its derived posture, duration ledger and wage ledger totals."
    roles: [ProgramAdmin, RTWCoordinator, OccHealthNurse, ClaimAdjuster, Employee]
    code: 200
    input: []
    output: Claim
    side_effects: ["recomputes rtw_posture, cumulative_transitional_days and wage_differential_paid_cents before responding"]

  - method: POST
    path: "/rtw/claims/{id}/adjuster-authorization"
    description: "Claim adjuster sets the claim's weekly spend ceiling and moves the claim's RTW eligibility flag. claim_status_directive is one of RTW_ELIGIBLE | SUSPENDED | CLOSED and is written straight onto Claim.claim_status; max_authorized_weekly_cost_cents must be >= 0."
    roles: [ClaimAdjuster, ProgramAdmin]
    code: 200
    input: [max_authorized_weekly_cost_cents, claim_status_directive]
    output: Claim
    side_effects: ["writes Claim.max_authorized_weekly_cost_cents", "sets Claim.claim_status to the directive value", "recomputes Claim.rtw_posture", "increments Claim.version by 1"]

  # ---------- Treating providers ----------
  - method: POST
    path: "/rtw/treating-providers"
    description: "Register a treating clinician."
    roles: [ProgramAdmin]
    code: 201
    input: [full_name, npi, specialty, "credential_status?"]
    output: TreatingProvider
    side_effects: []

  - method: GET
    path: "/rtw/treating-providers/{id}"
    description: "Read one treating clinician."
    roles: [ProgramAdmin, RTWCoordinator, OccHealthNurse, TreatingProvider]
    code: 200
    input: []
    output: TreatingProvider
    side_effects: []

  - method: PATCH
    path: "/rtw/treating-providers/{id}"
    description: "Update a clinician's credentialing state."
    roles: [ProgramAdmin]
    code: 200
    input: [credential_status]
    output: TreatingProvider
    side_effects: ["increments TreatingProvider.version by 1"]

  # ---------- Restriction intake ----------
  - method: POST
    path: "/rtw/claims/{id}/restriction-sets"
    description: "Treating provider files a restriction set against a claim. Optimistic-concurrency guarded on the claim's version."
    roles: [TreatingProvider, ProgramAdmin]
    code: 201
    input: [treating_provider_id, effective_from, valid_through, max_lift_lbs, max_continuous_standing_minutes, max_hours_per_day, keyboard_minutes_per_hour, overhead_reach_allowed, driving_allowed, expected_claim_version]
    output: RestrictionSet
    side_effects: ["computes severity_index", "sets status = DRAFT", "increments Claim.version by 1"]

  - method: GET
    path: "/rtw/claims/{id}/restriction-sets"
    description: "List a claim's restriction sets (FK reverse-reachability for RestrictionSet.claim_id)."
    roles: [ProgramAdmin, RTWCoordinator, OccHealthNurse, ClaimAdjuster, TreatingProvider]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: RestrictionSet[]
    side_effects: []

  - method: GET
    path: "/rtw/restriction-sets/{id}"
    description: "Read one restriction set."
    roles: [ProgramAdmin, RTWCoordinator, OccHealthNurse, ClaimAdjuster, TreatingProvider]
    code: 200
    input: []
    output: RestrictionSet
    side_effects: []

  - method: GET
    path: "/rtw/restriction-sets"
    description: "Filtered list of restriction sets (FK reverse-reachability for treating_provider_id and supersedes_restriction_set_id)."
    roles: [ProgramAdmin, RTWCoordinator, OccHealthNurse]
    code: 200
    input: ["claim_id?", "treating_provider_id?", "supersedes_restriction_set_id?", "status?", "limit?", "offset?"]
    output: RestrictionSet[]
    side_effects: []

  - method: POST
    path: "/rtw/restriction-sets/{id}/submit"
    description: "Provider submits a DRAFT or re-submits a CLARIFICATION_REQUESTED restriction set."
    roles: [TreatingProvider, ProgramAdmin]
    code: 200
    input: []
    output: RestrictionSet
    side_effects: ["DRAFT -> SUBMITTED or CLARIFICATION_REQUESTED -> SUBMITTED", "increments RestrictionSet.version by 1"]

  - method: POST
    path: "/rtw/restriction-sets/{id}/request-clarification"
    description: "Occupational-health nurse bounces a submitted restriction set back to the provider."
    roles: [OccHealthNurse, RTWCoordinator]
    code: 200
    input: [note]
    output: RestrictionSet
    side_effects: ["SUBMITTED -> CLARIFICATION_REQUESTED", "writes clarification_note", "raises clarification_round_count by 1", "increments RestrictionSet.version by 1"]

  - method: POST
    path: "/rtw/restriction-sets/{id}/verify"
    description: "Occupational-health nurse verifies a submitted restriction set."
    roles: [OccHealthNurse]
    code: 200
    input: []
    output: RestrictionSet
    side_effects: ["SUBMITTED -> VERIFIED", "recomputes severity_index", "increments RestrictionSet.version by 1"]

  - method: POST
    path: "/rtw/restriction-sets/{id}/activate"
    description: "Activate a verified restriction set; runs the five-level supersede cascade."
    roles: [RTWCoordinator, OccHealthNurse]
    code: 200
    input: []
    output: RestrictionSet
    side_effects: ["VERIFIED -> ACTIVE", "prior ACTIVE set -> SUPERSEDED", "conflicting placements -> SUSPENDED", "their progression reviews -> ESCALATED and a CaseReview is opened", "Claim.rtw_posture recomputed to FROZEN", "increments RestrictionSet.version by 1"]

  # ---------- Supervisors & training ----------
  - method: POST
    path: "/rtw/supervisors"
    description: "Register a supervisor who can host transitional work."
    roles: [ProgramAdmin]
    code: 201
    input: [full_name, department_code]
    output: Supervisor
    side_effects: ["sets oversight_status = ACTIVE and training_status = NONE"]

  - method: GET
    path: "/rtw/supervisors/{id}"
    description: "Read one supervisor with derived training and strike fields."
    roles: [ProgramAdmin, RTWCoordinator, OccHealthNurse, Supervisor]
    code: 200
    input: []
    output: Supervisor
    side_effects: ["recomputes training_status, compliance_strike_points and effective_strike_points before responding"]

  - method: POST
    path: "/rtw/supervisors/{id}/training-records"
    description: "Record completion of a supervisor curriculum."
    roles: [ProgramAdmin, Supervisor]
    code: 201
    input: [curriculum_code, completed_on, valid_through]
    output: TrainingRecord
    side_effects: ["any prior non-SUPERSEDED record with the same curriculum_code flips to SUPERSEDED", "recomputes Supervisor.training_status", "increments Supervisor.version by 1"]

  - method: GET
    path: "/rtw/supervisors/{id}/training-records"
    description: "List a supervisor's training records (FK reverse-reachability for TrainingRecord.supervisor_id)."
    roles: [ProgramAdmin, RTWCoordinator, OccHealthNurse, Supervisor]
    code: 200
    input: ["curriculum_code?", "record_status?", "limit?", "offset?"]
    output: TrainingRecord[]
    side_effects: []

  - method: GET
    path: "/rtw/training-records/{id}"
    description: "Read one training record."
    roles: [ProgramAdmin, RTWCoordinator, OccHealthNurse, Supervisor]
    code: 200
    input: []
    output: TrainingRecord
    side_effects: []

  - method: POST
    path: "/rtw/training-records/{id}/renew"
    description: "Renew a certification; on an RTW_CORE renewal this is the compensating action that lifts a supervisor suspension."
    roles: [ProgramAdmin, Supervisor]
    code: 200
    input: [new_valid_through]
    output: TrainingRecord
    side_effects: ["record_status -> VALID and renewal_count + 1", "recomputes Supervisor.training_status", "on RTW_CORE while oversight_status == SUSPENDED: sets strike_forgiveness_points, flips oversight_status to ACTIVE and every PAUSED job of that supervisor back to OPEN", "increments TrainingRecord.version by 1"]

  # ---------- Transitional job bank ----------
  - method: POST
    path: "/rtw/transitional-jobs"
    description: "Add an entry to the transitional job bank."
    roles: [ProgramAdmin, RTWCoordinator]
    code: 201
    input: [supervisor_id, title, department_code, seat_capacity, demand_lift_lbs, demand_standing_minutes, demand_hours_per_day, demand_keyboard_minutes_per_hour, hourly_rate_cents, "requires_overhead_reach?", "requires_driving?", "risk_class?"]
    output: TransitionalJob
    side_effects: ["sets job_status = OPEN and filled_seats = 0"]

  - method: GET
    path: "/rtw/transitional-jobs/{id}"
    description: "Read one job bank entry."
    roles: [ProgramAdmin, RTWCoordinator, OccHealthNurse, Supervisor]
    code: 200
    input: []
    output: TransitionalJob
    side_effects: ["recomputes filled_seats before responding"]

  - method: GET
    path: "/rtw/transitional-jobs"
    description: "Filtered, paginated job bank listing (FK reverse-reachability for TransitionalJob.supervisor_id)."
    roles: [ProgramAdmin, RTWCoordinator, OccHealthNurse, Supervisor]
    code: 200
    input: ["supervisor_id?", "department_code?", "job_status?", "risk_class?", "limit?", "offset?"]
    output: TransitionalJob[]
    side_effects: []

  - method: PATCH
    path: "/rtw/transitional-jobs/{id}"
    description: "Adjust a job bank entry's availability or seat count."
    roles: [ProgramAdmin, RTWCoordinator]
    code: 200
    input: ["job_status?", "seat_capacity?"]
    output: TransitionalJob
    side_effects: ["increments TransitionalJob.version by 1"]

  # ---------- Placements ----------
  - method: POST
    path: "/rtw/placements"
    description: "Create a transitional placement against an explicitly named job. Optimistic-concurrency guarded on the restriction set's version."
    roles: [RTWCoordinator, ProgramAdmin]
    code: 201
    input: [restriction_set_id, transitional_job_id, start_date, end_date, scheduled_hours_per_day, expected_restriction_set_version]
    output: Placement
    side_effects: ["copies claim_id from the restriction set and supervisor_id from the job", "stamps created_by_user_id from X-User-ID", "computes match_score, BASELINE reinjury_risk_score, premium split and projected_weekly_cost_cents", "raises RestrictionSet.active_placement_count and increments RestrictionSet.version by 1"]

  - method: POST
    path: "/rtw/placements/auto-match"
    description: "Server-side selector: pick the single best transitional job for a restriction set and create the placement. Optimistic-concurrency guarded on the restriction set's version."
    roles: [RTWCoordinator]
    code: 201
    input: [restriction_set_id, start_date, end_date, scheduled_hours_per_day, expected_restriction_set_version, "department_code?", "exclude_job_ids?"]
    output: Placement
    side_effects: ["applies calculations.transitional_job_selector", "same creation side effects as POST /rtw/placements", "increments RestrictionSet.version by 1"]

  - method: GET
    path: "/rtw/placements/{id}"
    description: "Read one placement with both status dimensions and every derived field."
    roles: [ProgramAdmin, RTWCoordinator, OccHealthNurse, ClaimAdjuster, Supervisor, Employee]
    code: 200
    input: []
    output: Placement
    side_effects: ["recomputes cumulative_days, benefit_continuation_status and projected_weekly_cost_cents before responding"]

  - method: GET
    path: "/rtw/placements"
    description: "Filtered, paginated placement listing (FK reverse-reachability for restriction_set_id, transitional_job_id and supervisor_id)."
    roles: [ProgramAdmin, RTWCoordinator, OccHealthNurse, ClaimAdjuster, Supervisor]
    code: 200
    input: ["claim_id?", "restriction_set_id?", "transitional_job_id?", "supervisor_id?", "placement_status?", "compliance_status?", "limit?", "offset?"]
    output: Placement[]
    side_effects: []

  - method: GET
    path: "/rtw/claims/{id}/placements"
    description: "List a claim's placements (FK reverse-reachability for Placement.claim_id)."
    roles: [ProgramAdmin, RTWCoordinator, OccHealthNurse, ClaimAdjuster, Employee]
    code: 200
    input: ["placement_status?", "limit?", "offset?"]
    output: Placement[]
    side_effects: []

  - method: POST
    path: "/rtw/placements/{id}/submit-to-adjuster"
    description: "Route a proposed placement to the claim adjuster; mints the AdjusterDirective and takes the job seat."
    roles: [RTWCoordinator]
    code: 200
    input: []
    output: Placement
    side_effects: ["PROPOSED -> ADJUSTER_PENDING", "creates an AdjusterDirective with directive_status = PENDING", "raises TransitionalJob.filled_seats by 1", "increments Placement.version by 1"]

  - method: GET
    path: "/rtw/placements/{id}/adjuster-directives"
    description: "List a placement's adjuster directives (FK reverse-reachability for AdjusterDirective.placement_id)."
    roles: [ProgramAdmin, RTWCoordinator, ClaimAdjuster, OccHealthNurse]
    code: 200
    input: ["directive_status?", "limit?", "offset?"]
    output: AdjusterDirective[]
    side_effects: []

  - method: POST
    path: "/rtw/adjuster-directives/{id}/decide"
    description: "Claim adjuster authorises, conditionally authorises, or denies a placement's transitional spend. decision is one of AUTHORIZED | AUTHORIZED_WITH_CONDITIONS | DENIED; authorized_weekly_cost_cents is required for the two authorising decisions, condition_note is required for AUTHORIZED_WITH_CONDITIONS and denial_reason is required for DENIED."
    roles: [ClaimAdjuster]
    code: 200
    input: [decision, "authorized_weekly_cost_cents?", "condition_note?", "denial_reason?"]
    output: AdjusterDirective
    side_effects: ["PENDING -> AUTHORIZED | AUTHORIZED_WITH_CONDITIONS | DENIED", "on DENIED: zeroes authorized_weekly_cost_cents and writes denial_reason", "increments AdjusterDirective.version by 1"]

  - method: POST
    path: "/rtw/placements/{id}/activate"
    description: "Start the transitional assignment."
    roles: [RTWCoordinator]
    code: 200
    input: []
    output: Placement
    side_effects: ["ADJUSTER_PENDING -> ACTIVE", "sets activated_on = start_date", "computes the premium split and benefit_continuation_status", "creates the step-1 ProgressionReview", "recomputes Claim.cumulative_transitional_days and rtw_posture", "increments Placement.version by 1"]

  - method: POST
    path: "/rtw/placements/{id}/suspend"
    description: "Pause an active assignment and release its seat. suspension_reason is one of RESTRICTION_CONFLICT | MEDICAL_HOLD | OPERATIONAL."
    roles: [RTWCoordinator, OccHealthNurse]
    code: 200
    input: [suspension_reason]
    output: Placement
    side_effects: ["ACTIVE -> SUSPENDED", "lowers TransitionalJob.filled_seats by 1", "increments Placement.version by 1"]

  - method: POST
    path: "/rtw/placements/{id}/resume"
    description: "Return a suspended assignment to active duty and retake its seat."
    roles: [RTWCoordinator]
    code: 200
    input: []
    output: Placement
    side_effects: ["SUSPENDED -> ACTIVE", "clears suspension_reason", "raises TransitionalJob.filled_seats by 1", "increments Placement.version by 1"]

  - method: POST
    path: "/rtw/placements/{id}/extend"
    description: "Push an active assignment's end date out; runs both duration-cap checks."
    roles: [RTWCoordinator]
    code: 200
    input: [new_end_date, reason]
    output: Placement
    side_effects: ["writes Placement.end_date", "recomputes cumulative_days and Claim.cumulative_transitional_days and rtw_posture", "increments Placement.version by 1"]

  - method: POST
    path: "/rtw/placements/{id}/complete"
    description: "Close out a successful transitional assignment."
    roles: [RTWCoordinator]
    code: 200
    input: []
    output: Placement
    side_effects: ["ACTIVE -> COMPLETED", "sets ended_on", "lowers TransitionalJob.filled_seats by 1", "supersedes live AdjusterDirective rows", "benefit_continuation_status -> LAPSED", "increments Placement.version by 1"]

  - method: POST
    path: "/rtw/placements/{id}/terminate"
    description: "End an assignment early; branches to DECLINED before activation and TERMINATED_EARLY after."
    roles: [RTWCoordinator, ProgramAdmin]
    code: 200
    input: [reason]
    output: Placement
    side_effects: ["{PROPOSED, ADJUSTER_PENDING} -> DECLINED or {ACTIVE, PROGRESSION_HOLD, SUSPENDED} -> TERMINATED_EARLY", "releases the job seat when one was held", "supersedes live AdjusterDirective rows", "increments Placement.version by 1"]

  - method: POST
    path: "/rtw/placements/{id}/hours-log"
    description: "Supervisor logs actually-worked hours for one calendar day; upserts by work_date."
    roles: [Supervisor, RTWCoordinator, ProgramAdmin]
    code: 200
    input: [work_date, hours_worked]
    output: Placement
    side_effects: ["upserts { work_date, hours_worked } into Placement.logged_hours sorted work_date ASC", "increments Placement.version by 1"]

  # ---------- Progression reviews ----------
  - method: GET
    path: "/rtw/placements/{id}/progression-reviews"
    description: "List a placement's progression reviews (FK reverse-reachability for ProgressionReview.placement_id)."
    roles: [ProgramAdmin, RTWCoordinator, OccHealthNurse, Supervisor]
    code: 200
    input: ["review_status?", "limit?", "offset?"]
    output: ProgressionReview[]
    side_effects: []

  - method: GET
    path: "/rtw/progression-reviews/{id}"
    description: "Read one progression review."
    roles: [ProgramAdmin, RTWCoordinator, OccHealthNurse, Supervisor]
    code: 200
    input: []
    output: ProgressionReview
    side_effects: []

  - method: POST
    path: "/rtw/progression-reviews/{id}/open"
    description: "Open a scheduled progression review."
    roles: [RTWCoordinator, OccHealthNurse]
    code: 200
    input: []
    output: ProgressionReview
    side_effects: ["SCHEDULED -> IN_REVIEW", "stamps reviewed_by_user_id", "increments ProgressionReview.version by 1"]

  - method: POST
    path: "/rtw/progression-reviews/{id}/decide"
    description: "Record the review outcome. decision is one of ADVANCE | EXTEND | ESCALATE | DEFER."
    roles: [RTWCoordinator, OccHealthNurse]
    code: 200
    input: [decision, "outcome_note?"]
    output: ProgressionReview
    side_effects: ["IN_REVIEW -> ADVANCED | EXTENDED | ESCALATED | SCHEDULED", "ADVANCE applies calculations.progression_step_target and forks the next review", "ESCALATE opens a CaseReview and puts the placement on PROGRESSION_HOLD", "increments ProgressionReview.version by 1"]

  # ---------- Compliance monitoring ----------
  - method: POST
    path: "/rtw/placements/{id}/compliance-audits"
    description: "File a workplace monitoring observation against a placement."
    roles: [Supervisor, RTWCoordinator, ProgramAdmin, OccHealthNurse]
    code: 201
    input: [observed_on, finding_severity, finding_code, "restriction_deviation_detected?", "corrective_action_note?"]
    output: ComplianceAudit
    side_effects: ["moves Placement.compliance_status on the parallel dimension", "recomputes Supervisor strike points and may suspend the supervisor", "may pause the supervisor's jobs and put sibling placements on WATCH", "recomputes SURVEILLANCE reinjury_risk_score and Claim.rtw_posture"]

  - method: GET
    path: "/rtw/placements/{id}/compliance-audits"
    description: "List a placement's monitoring observations (FK reverse-reachability for ComplianceAudit.placement_id)."
    roles: [ProgramAdmin, RTWCoordinator, OccHealthNurse, Supervisor]
    code: 200
    input: ["finding_severity?", "limit?", "offset?"]
    output: ComplianceAudit[]
    side_effects: []

  # ---------- Reinjury reporting ----------
  - method: POST
    path: "/rtw/placements/{id}/reinjury-reports"
    description: "Report a reinjury or near-miss on a transitional assignment."
    roles: [Supervisor, OccHealthNurse, RTWCoordinator, Employee]
    code: 201
    input: [occurred_on, severity, body_part_code, mechanism_code]
    output: ReinjuryReport
    side_effects: ["sets report_status = SUBMITTED and risk_points_applied = 0"]

  - method: GET
    path: "/rtw/placements/{id}/reinjury-reports"
    description: "List a placement's reinjury reports (FK reverse-reachability for ReinjuryReport.placement_id)."
    roles: [ProgramAdmin, RTWCoordinator, OccHealthNurse, Supervisor, Employee]
    code: 200
    input: ["report_status?", "limit?", "offset?"]
    output: ReinjuryReport[]
    side_effects: []

  - method: POST
    path: "/rtw/reinjury-reports/{id}/triage"
    description: "Nurse triages a submitted report; a SURVEILLANCE score at or above the escalation threshold convenes a case review."
    roles: [OccHealthNurse]
    code: 200
    input: [triage_note]
    output: ReinjuryReport
    side_effects: ["SUBMITTED -> TRIAGED, or -> ESCALATED when the recomputed SURVEILLANCE score >= RISK_ESCALATION_THRESHOLD", "writes risk_points_applied", "recomputes Placement.reinjury_risk_score under SURVEILLANCE", "on escalation: Placement ACTIVE -> PROGRESSION_HOLD, opens a CaseReview and freezes the claim posture", "increments ReinjuryReport.version by 1"]

  # ---------- Case review panel ----------
  - method: POST
    path: "/rtw/placements/{id}/case-reviews"
    description: "Convene a case-review panel for a placement. trigger_reason is one of REINJURY | RESTRICTION_CONFLICT | DURATION_CAP | COMPLIANCE_CRITICAL | ADJUSTER_DENIAL; quorum_required defaults to 3 and must be between 1 and 7."
    roles: [OccHealthNurse, RTWCoordinator, ProgramAdmin]
    code: 201
    input: [trigger_reason, "quorum_required?"]
    output: CaseReview
    side_effects: ["sets review_status = OPEN", "recomputes Claim.rtw_posture to FROZEN"]

  - method: GET
    path: "/rtw/placements/{id}/case-reviews"
    description: "List a placement's case reviews (FK reverse-reachability for CaseReview.placement_id)."
    roles: [ProgramAdmin, RTWCoordinator, OccHealthNurse, ClaimAdjuster, Supervisor]
    code: 200
    input: ["review_status?", "limit?", "offset?"]
    output: CaseReview[]
    side_effects: []

  - method: GET
    path: "/rtw/case-reviews/{id}"
    description: "Read one panel with its live tally."
    roles: [ProgramAdmin, RTWCoordinator, OccHealthNurse, ClaimAdjuster, Supervisor, TreatingProvider]
    code: 200
    input: []
    output: CaseReview
    side_effects: ["recomputes the tally fields before responding"]

  - method: POST
    path: "/rtw/case-reviews/{id}/open-voting"
    description: "Open the panel for balloting."
    roles: [OccHealthNurse, ProgramAdmin]
    code: 200
    input: []
    output: CaseReview
    side_effects: ["OPEN -> VOTING", "increments CaseReview.version by 1"]

  - method: POST
    path: "/rtw/case-reviews/{id}/votes"
    description: "Cast a panel ballot. ballot is one of CONTINUE | MODIFY | TERMINATE. Optimistic-concurrency guarded on the panel's version; a re-vote by the same X-User-ID supersedes that member's prior ballot."
    roles: [RTWCoordinator, OccHealthNurse, ClaimAdjuster, Supervisor, TreatingProvider]
    code: 201
    input: [ballot, expected_case_review_version, "rationale?"]
    output: CaseReviewVote
    side_effects: ["any prior COUNTED vote by the same voter_user_id flips to SUPERSEDED", "recomputes the panel tally", "increments CaseReview.version by 1"]

  - method: GET
    path: "/rtw/case-reviews/{id}/votes"
    description: "List a panel's ballots (FK reverse-reachability for CaseReviewVote.case_review_id)."
    roles: [ProgramAdmin, RTWCoordinator, OccHealthNurse, ClaimAdjuster, Supervisor, TreatingProvider]
    code: 200
    input: ["vote_status?", "limit?", "offset?"]
    output: CaseReviewVote[]
    side_effects: []

  - method: POST
    path: "/rtw/case-reviews/{id}/close"
    description: "Close the panel; the winning ballot forks into three disjoint side-effect sets."
    roles: [OccHealthNurse, ProgramAdmin]
    code: 200
    input: []
    output: CaseReview
    side_effects: ["VOTING -> DECIDED_CONTINUE | DECIDED_MODIFY | DECIDED_TERMINATE", "CONTINUE resumes the placement, MODIFY halves scheduled hours and forks a follow-up review, TERMINATE ends the placement and releases its seat", "recomputes Claim.rtw_posture", "increments CaseReview.version by 1"]

  # ---------- Wage differential ledger ----------
  - method: POST
    path: "/rtw/placements/{id}/wage-differential-entries"
    description: "Post a PROVISIONAL accrual or a FINAL reconciliation for one pay period. variant is one of PROVISIONAL | FINAL."
    roles: [ProgramAdmin, RTWCoordinator]
    code: 201
    input: [variant, period_start, period_end]
    output: WageDifferentialEntry
    side_effects: ["applies calculations.wage_differential_period_amount", "recomputes Claim.wage_differential_paid_cents", "increments Claim.version by 1"]

  - method: GET
    path: "/rtw/wage-differential-entries"
    description: "Filtered ledger listing (FK reverse-reachability for placement_id, claim_id and reverses_entry_id)."
    roles: [ProgramAdmin, RTWCoordinator, ClaimAdjuster]
    code: 200
    input: ["placement_id?", "claim_id?", "reverses_entry_id?", "variant?", "entry_status?", "limit?", "offset?"]
    output: WageDifferentialEntry[]
    side_effects: []

  - method: GET
    path: "/rtw/wage-differential-entries/{id}"
    description: "Read one ledger row."
    roles: [ProgramAdmin, RTWCoordinator, ClaimAdjuster]
    code: 200
    input: []
    output: WageDifferentialEntry
    side_effects: []

  - method: POST
    path: "/rtw/wage-differential-entries/{id}/reverse"
    description: "Compensating action: mint an offsetting REVERSAL row so the claim's paid total returns to its pre-post value."
    roles: [ProgramAdmin]
    code: 201
    input: [reason]
    output: WageDifferentialEntry
    side_effects: ["flips the original row's entry_status to REVERSED", "creates a REVERSAL row with net_amount_cents negated and reverses_entry_id set", "recomputes Claim.wage_differential_paid_cents", "increments Claim.version by 1"]

  # ---------- Program metrics ----------
  - method: GET
    path: "/rtw/programs/metrics"
    description: "Program outcome metrics over an activation-date cohort."
    roles: [ProgramAdmin, RTWCoordinator, ClaimAdjuster]
    code: 200
    input: ["window_start?", "window_end?", "department_code?"]
    output: "{ total_placements: integer, active_placements: integer, completed_count: integer, successful_return_rate: number, average_duration_days: number, reinjury_count: integer, reinjury_rate: number, compliance_rate: number, total_wage_differential_cents: integer }"
    side_effects: []

  # ---------- Logical clock (test-driving) ----------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical clock. The clock starts at the fixed default 2026-08-01T00:00:00Z on server startup and never falls back to real wall-clock time; every date-sensitive rule reads this clock."
    roles: [ProgramAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string, expired_restriction_set_ids: string[], expired_training_record_ids: string[], warned_training_record_ids: string[] }"
    side_effects: ["ACTIVE RestrictionSet rows past valid_through -> EXPIRED", "TrainingRecord rows inside the warning window -> EXPIRING_SOON and past valid_through -> EXPIRED", "recomputes Supervisor.training_status, Placement.cumulative_days, Claim.cumulative_transitional_days and Claim.rtw_posture"]

errors:
  - { id: ERR_UNAUTHENTICATED,        http: 401, condition: "X-User-Role or X-User-ID header missing, or X-User-Role is not one of the seven declared roles." }
  - { id: ERR_UNAUTHORIZED,           http: 403, condition: "The caller's role is not listed on the endpoint." }
  - { id: ERR_NOT_RESOURCE_OWNER,     http: 403, condition: "An entity_backed caller (TreatingProvider, Supervisor, Employee) addressed a resource whose owning foreign key is not the caller's X-User-ID." }
  - { id: ERR_SEGREGATION_OF_DUTIES,  http: 403, condition: "The placement's creator tried to vote on its case review, or a member who cast a COUNTED ballot tried to close the panel." }
  - { id: ERR_INVALID_REQUEST,        http: 400, condition: "Missing required field, unknown enum member, out-of-range number, unparseable date, inverted date range, or pagination outside limit in [1,100] / offset >= 0." }
  - { id: ERR_DUPLICATE_IDENTIFIER,   http: 409, condition: "employee_number, claim_number or npi already exists." }
  - { id: ERR_EMPLOYEE_NOT_FOUND,     http: 404, condition: "No Employee row matches the addressed id." }
  - { id: ERR_CLAIM_NOT_FOUND,        http: 404, condition: "No Claim row matches the addressed id." }
  - { id: ERR_PROVIDER_NOT_FOUND,     http: 404, condition: "No TreatingProvider row matches the addressed or referenced id." }
  - { id: ERR_RESTRICTION_SET_NOT_FOUND, http: 404, condition: "No RestrictionSet row matches the addressed or referenced id." }
  - { id: ERR_SUPERVISOR_NOT_FOUND,   http: 404, condition: "No Supervisor row matches the addressed or referenced id." }
  - { id: ERR_TRAINING_RECORD_NOT_FOUND, http: 404, condition: "No TrainingRecord row matches the addressed id." }
  - { id: ERR_JOB_NOT_FOUND,          http: 404, condition: "No TransitionalJob row matches the addressed or referenced id." }
  - { id: ERR_PLACEMENT_NOT_FOUND,    http: 404, condition: "No Placement row matches the addressed id." }
  - { id: ERR_DIRECTIVE_NOT_FOUND,    http: 404, condition: "No AdjusterDirective row matches the addressed id." }
  - { id: ERR_PROGRESSION_REVIEW_NOT_FOUND, http: 404, condition: "No ProgressionReview row matches the addressed id." }
  - { id: ERR_REINJURY_REPORT_NOT_FOUND, http: 404, condition: "No ReinjuryReport row matches the addressed id." }
  - { id: ERR_CASE_REVIEW_NOT_FOUND,  http: 404, condition: "No CaseReview row matches the addressed id." }
  - { id: ERR_WAGE_ENTRY_NOT_FOUND,   http: 404, condition: "No WageDifferentialEntry row matches the addressed or referenced id." }
  - { id: ERR_INVALID_STATE,          http: 409, condition: "The addressed row's current state is not a declared from-state for the requested transition." }
  - { id: ERR_ALREADY_TERMINAL,       http: 409, condition: "The addressed row is already in a terminal state of its state machine." }
  - { id: ERR_RESTRICTION_SET_NOT_ACTIVE, http: 409, condition: "The referenced RestrictionSet is not in status ACTIVE." }
  - { id: ERR_CLAIM_NOT_RTW_ELIGIBLE, http: 409, condition: "The owning Claim's claim_status is not RTW_ELIGIBLE." }
  - { id: ERR_DIRECTIVE_ALREADY_DECIDED, http: 409, condition: "The addressed AdjusterDirective is no longer PENDING." }
  - { id: ERR_CASE_REVIEW_NOT_VOTING, http: 409, condition: "The addressed CaseReview is not in review_status VOTING." }
  - { id: ERR_WAGE_ENTRY_ALREADY_REVERSED, http: 409, condition: "The addressed WageDifferentialEntry is not in entry_status POSTED." }
  - { id: ERR_CLAIM_POSTURE_FROZEN,   http: 409, condition: "The owning Claim's rtw_posture is FROZEN." }
  - { id: ERR_CLAIM_POSTURE_RESTRICTED, http: 409, condition: "The owning Claim's rtw_posture is RESTRICTED and the endpoint creates new transitional work." }
  - { id: ERR_PROVIDER_CREDENTIAL_REVOKED, http: 422, condition: "The restriction set's TreatingProvider does not have credential_status VERIFIED." }
  - { id: ERR_RESTRICTION_WINDOW_INVALID, http: 422, condition: "The restriction set's valid_through is earlier than the logical clock's calendar date at activation." }
  - { id: ERR_RESTRICTION_VIOLATION,  http: 422, condition: "The transitional job's demand or the requested schedule breaches at least one hard restriction limit." }
  - { id: ERR_MATCH_SCORE_BELOW_FLOOR, http: 422, condition: "The computed restriction_match_score is below MIN_ELIGIBLE_MATCH_SCORE (40.0)." }
  - { id: ERR_REINJURY_RISK_TOO_HIGH, http: 422, condition: "The BASELINE reinjury_risk_score is at or above RISK_ESCALATION_THRESHOLD (70)." }
  - { id: ERR_HOURS_EXCEED_RESTRICTION, http: 422, condition: "Logged hours_worked exceeds the active restriction set's max_hours_per_day." }
  - { id: ERR_SUPERVISOR_OVERSIGHT_SUSPENDED, http: 409, condition: "The placement's Supervisor has oversight_status SUSPENDED." }
  - { id: ERR_SUPERVISOR_TRAINING_EXPIRED, http: 409, condition: "The placement's Supervisor has training_status EXPIRED or NONE." }
  - { id: ERR_PLACEMENT_OUTSIDE_RESTRICTION_WINDOW, http: 422, condition: "The placement window is not fully contained in the restriction set's [effective_from, valid_through] window." }
  - { id: ERR_PLACEMENT_WINDOW_OVERLAP, http: 409, condition: "The half-open [start_date, end_date) window intersects another live placement of the same Employee." }
  - { id: ERR_JOB_CHANGEOVER_BUFFER,  http: 409, condition: "The proposed start_date falls 0 or 1 day after another occupant's end_date on the same TransitionalJob." }
  - { id: ERR_WAGE_PERIOD_OVERLAP,    http: 409, condition: "Another WageDifferentialEntry of the same placement and variant already covers a day in the requested period." }
  - { id: ERR_JOB_SEAT_UNAVAILABLE,   http: 409, condition: "Concurrent occupancy on the TransitionalJob would exceed seat_capacity on at least one day of the proposed window." }
  - { id: ERR_JOB_NOT_OPEN,           http: 409, condition: "The referenced TransitionalJob has job_status PAUSED or RETIRED." }
  - { id: ERR_NO_ELIGIBLE_JOB,        http: 422, condition: "The auto-match selector's candidate set is empty after eligibility filtering." }
  - { id: ERR_MAX_PROGRESSION_STEPS,  http: 422, condition: "An ADVANCE decision was requested but the placement already has progression_step == MAX_PROGRESSION_STEPS (4)." }
  - { id: ERR_MAX_DEFERRALS_REACHED,  http: 422, condition: "A DEFER decision was requested but the review already has deferral_count == MAX_REVIEW_DEFERRALS (2)." }
  - { id: ERR_QUORUM_NOT_MET,         http: 409, condition: "The panel's COUNTED vote_count is below quorum_required." }
  - { id: ERR_MAJORITY_NOT_REACHED,   http: 409, condition: "The panel's decision_ratio is below CASE_REVIEW_MAJORITY (0.6600)." }
  - { id: ERR_DURATION_HARD_CAP,      http: 422, condition: "The projected cumulative transitional duration reaches DURATION_HARD_CAP_DAYS (180) or more." }
  - { id: ERR_DURATION_SOFT_CAP_REQUIRES_CASE_REVIEW, http: 409, condition: "The projected cumulative transitional duration reaches DURATION_SOFT_CAP_DAYS (90) or more and no CaseReview of the placement is in DECIDED_CONTINUE." }
  - { id: ERR_ADJUSTER_AUTHORIZATION_MISSING, http: 409, condition: "Activation attempted with no AdjusterDirective, or with one still PENDING." }
  - { id: ERR_CASE_REVIEW_IN_PROGRESS, http: 409, condition: "An ADVANCE or EXTEND progression decision was requested while a CaseReview of the placement is OPEN or VOTING." }
  - { id: ERR_ADJUSTER_DIRECTIVE_DENIED, http: 409, condition: "Activation attempted while the placement's current AdjusterDirective is DENIED." }
  - { id: ERR_ADJUSTER_AUTHORIZATION_EXCEEDED, http: 422, condition: "An authorization exceeds the claim's ceiling, or a placement's projected_weekly_cost_cents exceeds the directive's authorized_weekly_cost_cents." }
  - { id: ERR_STALE_CLAIM_VERSION,    http: 412, condition: "expected_claim_version does not equal the Claim's current version." }
  - { id: ERR_STALE_RESTRICTION_SET_VERSION, http: 412, condition: "expected_restriction_set_version does not equal the RestrictionSet's current version." }
  - { id: ERR_STALE_CASE_REVIEW_VERSION, http: 412, condition: "expected_case_review_version does not equal the CaseReview's current version." }

roles:
  - name: ProgramAdmin
    description: "Program owner; registers workers, providers, supervisors and job bank entries, and owns the ledger's compensating actions and the logical clock."
    identity: "opaque"
    exclusive_operations:
      - "POST /rtw/employees"
      - "POST /rtw/treating-providers"
      - "PATCH /rtw/treating-providers/{id}"
      - "POST /rtw/supervisors"
      - "POST /rtw/wage-differential-entries/{id}/reverse"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "POST /rtw/employees/{id}/claims"
      - "POST /rtw/claims/{id}/adjuster-authorization"
      - "POST /rtw/claims/{id}/restriction-sets"
      - "POST /rtw/restriction-sets/{id}/submit"
      - "POST /rtw/supervisors/{id}/training-records"
      - "POST /rtw/training-records/{id}/renew"
      - "POST /rtw/transitional-jobs"
      - "PATCH /rtw/transitional-jobs/{id}"
      - "POST /rtw/placements"
      - "POST /rtw/placements/{id}/terminate"
      - "POST /rtw/placements/{id}/hours-log"
      - "POST /rtw/placements/{id}/compliance-audits"
      - "POST /rtw/placements/{id}/case-reviews"
      - "POST /rtw/case-reviews/{id}/open-voting"
      - "POST /rtw/case-reviews/{id}/close"
      - "POST /rtw/placements/{id}/wage-differential-entries"
      - "every GET endpoint except GET /rtw/reinjury-reports scoping restrictions"

  - name: RTWCoordinator
    description: "Return-to-work coordinator; owns placement creation, matching, the placement lifecycle and progression reviews."
    identity: "opaque"
    exclusive_operations:
      - "POST /rtw/placements/auto-match"
      - "POST /rtw/placements/{id}/submit-to-adjuster"
      - "POST /rtw/placements/{id}/activate"
      - "POST /rtw/placements/{id}/resume"
      - "POST /rtw/placements/{id}/extend"
      - "POST /rtw/placements/{id}/complete"
    shared_operations:
      - "POST /rtw/transitional-jobs"
      - "PATCH /rtw/transitional-jobs/{id}"
      - "POST /rtw/placements"
      - "POST /rtw/placements/{id}/suspend"
      - "POST /rtw/placements/{id}/terminate"
      - "POST /rtw/placements/{id}/hours-log"
      - "POST /rtw/restriction-sets/{id}/request-clarification"
      - "POST /rtw/restriction-sets/{id}/activate"
      - "POST /rtw/progression-reviews/{id}/open"
      - "POST /rtw/progression-reviews/{id}/decide"
      - "POST /rtw/placements/{id}/compliance-audits"
      - "POST /rtw/placements/{id}/reinjury-reports"
      - "POST /rtw/placements/{id}/case-reviews"
      - "POST /rtw/case-reviews/{id}/votes"
      - "POST /rtw/placements/{id}/wage-differential-entries"

  - name: OccHealthNurse
    description: "Occupational-health nurse; the clinical gatekeeper for restriction verification, reinjury triage and the case-review panel."
    identity: "opaque"
    exclusive_operations:
      - "POST /rtw/restriction-sets/{id}/verify"
      - "POST /rtw/reinjury-reports/{id}/triage"
    shared_operations:
      - "POST /rtw/restriction-sets/{id}/request-clarification"
      - "POST /rtw/restriction-sets/{id}/activate"
      - "POST /rtw/placements/{id}/suspend"
      - "POST /rtw/progression-reviews/{id}/open"
      - "POST /rtw/progression-reviews/{id}/decide"
      - "POST /rtw/placements/{id}/compliance-audits"
      - "POST /rtw/placements/{id}/reinjury-reports"
      - "POST /rtw/placements/{id}/case-reviews"
      - "POST /rtw/case-reviews/{id}/open-voting"
      - "POST /rtw/case-reviews/{id}/votes"
      - "POST /rtw/case-reviews/{id}/close"

  - name: ClaimAdjuster
    description: "Carrier claim adjuster; sets the claim's spend ceiling and decides every transitional placement's funding. X-User-ID is an operator id stored on Claim.adjuster_user_id, never an entity id."
    identity: "opaque"
    exclusive_operations:
      - "POST /rtw/adjuster-directives/{id}/decide"
    shared_operations:
      - "POST /rtw/employees/{id}/claims"
      - "POST /rtw/claims/{id}/adjuster-authorization"
      - "POST /rtw/case-reviews/{id}/votes"
      - "GET /rtw/wage-differential-entries"
      - "GET /rtw/programs/metrics"

  - name: TreatingProvider
    description: "Treating clinician who authors restriction sets. X-User-ID equals a TreatingProvider row's id."
    identity: "entity_backed:TreatingProvider"
    exclusive_operations: []
    shared_operations:
      - "POST /rtw/claims/{id}/restriction-sets"
      - "POST /rtw/restriction-sets/{id}/submit"
      - "POST /rtw/case-reviews/{id}/votes"
      - "GET /rtw/restriction-sets/{id}"
      - "GET /rtw/case-reviews/{id}"

  - name: Supervisor
    description: "Department supervisor hosting the transitional job. X-User-ID equals a Supervisor row's id; may only touch placements whose supervisor_id is that id."
    identity: "entity_backed:Supervisor"
    exclusive_operations: []
    shared_operations:
      - "POST /rtw/supervisors/{id}/training-records"
      - "POST /rtw/training-records/{id}/renew"
      - "POST /rtw/placements/{id}/hours-log"
      - "POST /rtw/placements/{id}/compliance-audits"
      - "POST /rtw/placements/{id}/reinjury-reports"
      - "POST /rtw/case-reviews/{id}/votes"

  - name: Employee
    description: "The injured worker. X-User-ID equals an Employee row's id; may read only their own claims and placements and may self-report a reinjury."
    identity: "entity_backed:Employee"
    exclusive_operations: []
    shared_operations:
      - "GET /rtw/employees/{id}"
      - "GET /rtw/employees/{id}/claims"
      - "GET /rtw/claims/{id}"
      - "GET /rtw/claims/{id}/placements"
      - "GET /rtw/placements/{id}"
      - "POST /rtw/placements/{id}/reinjury-reports"
      - "GET /rtw/placements/{id}/reinjury-reports"
