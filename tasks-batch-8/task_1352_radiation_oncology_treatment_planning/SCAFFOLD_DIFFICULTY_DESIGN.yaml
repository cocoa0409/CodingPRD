          assert:
            - "err == ERR_MACHINE_NOT_OPERATIONAL (machine DOWN gates delivery at priority 11)"
            - "FractionSession.${f2}.status remains SCHEDULED (start_time 2026-08-05 predates the 2026-08-06 clock, so the DOWN cascade spared it)"
            - "no MACHINE_DOWN interruption was created for course ${crs} (zero sessions cancelled by the cascade)"

      - name: submit_blocked_when_contour_reopened_after_plan_pin
        grounds:
          - state_machines.TreatmentPlan.DRAFT_to_PENDING_PRIMARY_CHECK
          - state_machines.ContourSet.APPROVED_to_RETURNED
          - entities.TreatmentPlan.fields.pinned_contour_version
        distinguishing_aspect: |
          Pair TreatmentPlan x ContourSet (a different pair than session x machine): the plan pins the
          contour set's version at creation; returning and re-approving the contours restores APPROVED
          status but at a bumped version, so submit-for-check fails with ERR_STALE_CONTOUR_SET even
          though the referenced contour set is again APPROVED.
        test_recipe:
          setup:
            - "IMRT course 4000/8 in PLANNING; contour set APPROVED at version 3; plan created pinning version 3"
          setup_api_calls:
            - { call: "POST /oncology/patients", payload: { mrn: "MRN-XS-2", full_name: "Cross Two", date_of_birth: "1960-01-01" }, as: Scheduler, captures: { pat: $.data.id } }
            - { call: "POST /oncology/patients/${pat}/treatment-courses", payload: { diagnosis_code: "C73", intent: "CURATIVE", technique: "IMRT", prescribed_total_dose_cGy: 4000, planned_fractions: 8 }, as: RadiationOncologist, as_user_id: "onc_a", captures: { crs: $.data.id } }
            - { call: "POST /oncology/machines", payload: { name: "CT-Sim-X2", machine_type: "CT_SIMULATOR", room: "SIM1" }, as: SystemAdmin, captures: { sim_m: $.data.id } }
            - { call: "POST /oncology/treatment-courses/${crs}/simulation-appointments", payload: { machine_id: "${sim_m}", start_time: "2026-07-30T09:00:00Z", end_time: "2026-07-30T09:30:00Z", immobilization_device: "THERMOPLASTIC_MASK" }, as: Scheduler, captures: { sim_a: $.data.id } }
            - { call: "POST /oncology/simulation-appointments/${sim_a}/complete", payload: { patient_weight_kg: 80.0 }, as: RadiationTherapist, as_user_id: "rtt_a" }
            - { call: "POST /oncology/treatment-courses/${crs}/contour-sets", payload: { set_label: "CT1", target_volumes: ["PTV"], oar_structures: ["Cord"] }, as: RadiationOncologist, as_user_id: "onc_a", captures: { cs: $.data.id } }
            - { call: "POST /oncology/contour-sets/${cs}/submit", payload: {}, as: RadiationOncologist, as_user_id: "onc_a" }
            - { call: "POST /oncology/contour-sets/${cs}/approve", payload: {}, as: RadiationOncologist, as_user_id: "onc_b" }
            - { call: "GET /oncology/treatment-courses/${crs}", payload: {}, as: RadiationOncologist, as_user_id: "onc_a", captures: { crs_v: $.data.version } }
            - { call: "POST /oncology/treatment-courses/${crs}/treatment-plans", payload: { contour_set_id: "${cs}", target_total_dose_cGy: 4000, planned_fractions: 8, expected_course_version: "${crs_v}" }, as: MedicalDosimetrist, as_user_id: "dos_a", captures: { pl: $.data.id, pin_v: $.data.pinned_contour_version } }
            - { call: "POST /oncology/treatment-plans/${pl}/dose-constraints", payload: { structure_name: "Cord", constraint_type: "MAX_DOSE", limit_cGy: 4500, evaluated_value_cGy: 4000 }, as: MedicalDosimetrist, as_user_id: "dos_a" }
            - { call: "POST /oncology/contour-sets/${cs}/return", payload: { return_notes: "expand CTV margin" }, as: RadiationOncologist, as_user_id: "onc_b" }
            - { call: "POST /oncology/contour-sets/${cs}/submit", payload: {}, as: RadiationOncologist, as_user_id: "onc_a" }
            - { call: "POST /oncology/contour-sets/${cs}/approve", payload: {}, as: RadiationOncologist, as_user_id: "onc_b" }
            - { call: "GET /oncology/contour-sets/${cs}", payload: {}, as: RadiationOncologist, as_user_id: "onc_a", captures: { cs_st: $.data.status, cs_v: $.data.version } }
          trigger:
            - { call: "POST /oncology/treatment-plans/${pl}/submit-for-check", payload: {}, as: MedicalDosimetrist, as_user_id: "dos_a", captures: { err: $.data.error_id } }
          assert:
            - "cs_st == APPROVED and cs_v == pin_v + 3 (return + submit + approve each bumped the version)"
            - "err == ERR_STALE_CONTOUR_SET (pinned_contour_version no longer matches the current contour version)"
            - "TreatmentPlan.${pl}.status remains DRAFT"

      - name: claim_submit_requires_terminal_course
        grounds:
          - state_machines.BillingClaim.FINALIZED_to_SUBMITTED
          - entities.TreatmentCourse.fields.status
        distinguishing_aspect: |
          Pair BillingClaim x TreatmentCourse (a third distinct pair): a FINALIZED claim cannot be
          submitted while its course is still ON_TREATMENT; only COMPLETED or DISCONTINUED courses
          release the claim.
