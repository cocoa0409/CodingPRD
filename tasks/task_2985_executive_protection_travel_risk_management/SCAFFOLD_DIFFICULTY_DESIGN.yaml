# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task 2985 — Executive Protection & Travel Risk Management
# Nine §0.5 rule_ids; every instance grounds only in elements declared in
# SCAFFOLD.yaml §1.1–§1.7. Every formula-derived number below was computed by
# executing the relevant calculations[].formula against its constants:.
scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:

      - name: exposure_decay_weighted_vs_rolling_window_diverge_on_one_signal_set
        grounds:
          - calculations.public_exposure_score
          - calculations.composite_risk_score
          - entities.Executive.fields.public_exposure_score
          - entities.RiskAssessment.fields.public_exposure_component
          - state_machines.RiskAssessment.DRAFT_to_SUBMITTED
        distinguishing_aspect: |
          This dual variant lives in the Executive risk-scoring domain: the SAME three
          PublicExposureSignal rows yield Executive.public_exposure_score == 36.25 under
          DECAY_WEIGHTED and RiskAssessment.public_exposure_component == 62.50 under
          ROLLING_WINDOW, so the two variants differ by 26.25 points on identical data.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "one TIER_2 executive whose residential survey is COMPLETE with residential_component 20.00"
            - "exactly three exposure signals: MEDIA_MENTION severity 4 aged 0 days, SOCIAL_GEOTAG severity 3 aged 30 days, PROTEST_MENTION severity 2 aged 60 days (all inside the 90-day window)"
            - "one DRAFT risk assessment with threat_monitoring_score 40.00"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemOperator
              as_user_id: "ops-1"
            - call: "POST /exec-protection/security-staff"
              payload: { full_name: "Ana Analyst", staff_role: "ANALYST", certification_expires_at: "2027-01-01T00:00:00Z", hourly_rate_cents: 9000 }
              as: SystemOperator
              as_user_id: "ops-1"
              captures: { analyst_id: $.data.id }
            - call: "POST /exec-protection/security-staff"
              payload: { full_name: "Mia Manager", staff_role: "MANAGER", certification_expires_at: "2027-01-01T00:00:00Z", hourly_rate_cents: 11000 }
              as: SystemOperator
              as_user_id: "ops-1"
              captures: { mgr_id: $.data.id }
            - call: "POST /exec-protection/executives"
              payload: { full_name: "Eve Exec", tier: "TIER_2", role_title: "CEO", base_country_code: "US", annual_security_budget_cents: 100000000 }
              as: ProtectionManager
              as_user_id: "${mgr_id}"
              captures: { exec_id: $.data.id }
            - call: "POST /exec-protection/executives/${exec_id}/residential-survey"
              payload: { survey_outcome: "COMPLETE", residential_component: 20.00 }
              as: SecurityAnalyst
              as_user_id: "${analyst_id}"
            - call: "POST /exec-protection/executives/${exec_id}/exposure-signals"
              payload: { signal_type: "MEDIA_MENTION", severity: 4, observed_at: "2026-08-01T00:00:00Z", source_note: "age 0 days" }
              as: SecurityAnalyst
              as_user_id: "${analyst_id}"
            - call: "POST /exec-protection/executives/${exec_id}/exposure-signals"
              payload: { signal_type: "SOCIAL_GEOTAG", severity: 3, observed_at: "2026-07-02T00:00:00Z", source_note: "age 30 days" }
              as: SecurityAnalyst
              as_user_id: "${analyst_id}"
            - call: "POST /exec-protection/executives/${exec_id}/exposure-signals"
              payload: { signal_type: "PROTEST_MENTION", severity: 2, observed_at: "2026-06-02T00:00:00Z", source_note: "age 60 days" }
              as: SecurityAnalyst
              as_user_id: "${analyst_id}"
            - call: "POST /exec-protection/risk-assessments"
              payload: { executive_id: "${exec_id}", authored_by_staff_id: "${analyst_id}", threat_monitoring_score: 40.00 }
              as: SecurityAnalyst
              as_user_id: "${analyst_id}"
              captures: { ra_id: $.data.id }
          trigger:
            - call: "POST /exec-protection/risk-assessments/${ra_id}/submit"
              payload: {}
              as: SecurityAnalyst
              as_user_id: "${analyst_id}"
              captures: { ra_exposure: $.data.public_exposure_component, ra_composite: $.data.composite_risk_score }
            - call: "GET /exec-protection/executives/${exec_id}"
              payload: {}
              as: SecurityAnalyst
              as_user_id: "${analyst_id}"
              captures: { exec_exposure: $.data.public_exposure_score }
          assert:
            - "Executive.${exec_id}.public_exposure_score == 36.25   # DECAY_WEIGHTED: 4*1.0*1 + 3*1.5*0.5 + 2*2.0*0.25 = 7.25, *5 = 36.25"
            - "RiskAssessment.${ra_id}.public_exposure_component == 62.50   # ROLLING_WINDOW: 4*1.0 + 3*1.5 + 2*2.0 = 12.5, *5 = 62.50"
            - "RiskAssessment.${ra_id}.public_exposure_component - Executive.${exec_id}.public_exposure_score == 26.25"
            - "RiskAssessment.${ra_id}.residential_component_snapshot == 20.00"
            - "RiskAssessment.${ra_id}.composite_risk_score == 48.26   # base 0.45*40.00 + 0.35*62.50 + 0.20*20.00 = 43.875; TIER_2 uplift 1.10 -> 48.2625 -> round_half_up 48.26"
            - "RiskAssessment.${ra_id}.status == SUBMITTED"

      - name: trip_cost_provisional_vs_final_diverge_through_min_billable_floor
        grounds:
          - calculations.trip_security_cost
          - calculations.detail_assignment_cost
          - entities.Trip.fields.provisional_security_cost_cents
          - entities.Trip.fields.total_security_cost_cents
          - entities.ProtectiveDetailAssignment.fields.cost_basis
          - state_machines.ProtectiveDetailAssignment.CONFIRMED_to_RELEASED
        distinguishing_aspect: |
          This dual variant lives in the Trip cost-accounting domain, not the Executive
          risk-scoring domain of the previous instance: one CONFIRMED assignment is worth
          112500 cents PROVISIONAL (10 planned hours) and 45000 cents FINAL (1h47m actual,
          floored to MIN_BILLABLE_HOURS == 4), so Trip.provisional_security_cost_cents
          and Trip.total_security_cost_cents differ by 67500 cents on the same assignment.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z, moved to 2026-09-12T00:00:00Z before close"
            - "one TIER_3 executive, residential survey COMPLETE with residential_component 10.00, annual budget 100000000 cents, no exposure signals"
            - "one APPROVED risk assessment with threat_monitoring_score 20.00 (composite 11.00 -> threat_level LOW)"
            - "destination rating PT with composite 9.80 -> band LOW, so each leg requires only ROUTE_SURVEY and required_approval_level stays MANAGER"
            - "one VERIFIED MEDICAL_EVAC policy, coverage 500000000 cents, no excluded countries (validations[priority=43] makes a policy mandatory at submit-for-approval)"
            - "one trip 2026-09-10T00:00:00Z..2026-09-12T00:00:00Z with a single leg 2026-09-10T08:00:00Z..2026-09-10T18:00:00Z and one LEAD_AGENT assignment over exactly that window (so lead_agent_covered is true and the trip reaches READY) on a staff member billing 9000 cents/hour"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemOperator
              as_user_id: "ops-1"
            - call: "POST /exec-protection/security-staff"
              payload: { full_name: "Ana Analyst", staff_role: "ANALYST", certification_expires_at: "2027-01-01T00:00:00Z", hourly_rate_cents: 9000 }
              as: SystemOperator
              as_user_id: "ops-1"
              captures: { analyst_id: $.data.id }
            - call: "POST /exec-protection/security-staff"
              payload: { full_name: "Mia Manager", staff_role: "MANAGER", certification_expires_at: "2027-01-01T00:00:00Z", hourly_rate_cents: 11000 }
              as: SystemOperator
              as_user_id: "ops-1"
              captures: { mgr_id: $.data.id }
            - call: "POST /exec-protection/security-staff"
              payload: { full_name: "Dan Director", staff_role: "DIRECTOR", certification_expires_at: "2027-01-01T00:00:00Z", hourly_rate_cents: 15000 }
              as: SystemOperator
              as_user_id: "ops-1"
              captures: { dir_id: $.data.id }
            - call: "POST /exec-protection/security-staff"
              payload: { full_name: "Lee Lead", staff_role: "ANALYST", certification_expires_at: "2027-01-01T00:00:00Z", hourly_rate_cents: 9000 }
              as: SystemOperator
              as_user_id: "ops-1"
              captures: { lead_id: $.data.id }
            - call: "POST /exec-protection/executives"
              payload: { full_name: "Eve Exec", tier: "TIER_3", role_title: "CEO", base_country_code: "US", annual_security_budget_cents: 100000000 }
              as: ProtectionManager
              as_user_id: "${mgr_id}"
              captures: { exec_id: $.data.id }
            - call: "POST /exec-protection/executives/${exec_id}/residential-survey"
              payload: { survey_outcome: "COMPLETE", residential_component: 10.00 }
              as: SecurityAnalyst
              as_user_id: "${analyst_id}"
            - call: "POST /exec-protection/destination-ratings"
              payload: { country_code: "PT", crime_index: 10.00, political_instability_index: 8.00, medical_infrastructure_index: 90.00, natural_hazard_index: 12.00, advisory_effective_at: "2026-07-01T00:00:00Z" }
              as: SecurityAnalyst
              as_user_id: "${analyst_id}"
            - call: "POST /exec-protection/insurance-policies"
              payload: { executive_id: "${exec_id}", policy_type: "MEDICAL_EVAC", coverage_cents: 500000000, effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-06-01T00:00:00Z", excluded_country_codes: [] }
              as: ComplianceOfficer
              as_user_id: "compliance-1"
              captures: { pol_id: $.data.id }
            - call: "POST /exec-protection/insurance-policies/${pol_id}/verify"
              payload: { outcome: "VERIFY", verification_note: "binder on file" }
              as: ComplianceOfficer
              as_user_id: "compliance-1"
            - call: "POST /exec-protection/risk-assessments"
              payload: { executive_id: "${exec_id}", authored_by_staff_id: "${analyst_id}", threat_monitoring_score: 20.00 }
              as: SecurityAnalyst
              as_user_id: "${analyst_id}"
              captures: { ra_id: $.data.id }
            - call: "POST /exec-protection/risk-assessments/${ra_id}/submit"
              payload: {}
              as: SecurityAnalyst
              as_user_id: "${analyst_id}"
            - call: "POST /exec-protection/risk-assessments/${ra_id}/review"
              payload: { outcome: "APPROVE", review_notes: "cleared" }
              as: SecurityDirector
              as_user_id: "${dir_id}"
            - call: "POST /exec-protection/trips"
              payload: { executive_id: "${exec_id}", created_by_staff_id: "${mgr_id}", risk_assessment_id: "${ra_id}", insurance_policy_id: "${pol_id}", trip_purpose: "BUSINESS_TRAVEL", primary_destination_country_code: "PT", depart_at: "2026-09-10T00:00:00Z", return_at: "2026-09-12T00:00:00Z", cost_allocation_method: "PRORATA" }
              as: ProtectionManager
              as_user_id: "${mgr_id}"
              captures: { trip_id: $.data.id }
            - call: "POST /exec-protection/trips/${trip_id}/legs"
              payload: { sequence_no: 1, destination_country_code: "PT", arrive_at: "2026-09-10T08:00:00Z", depart_at: "2026-09-10T18:00:00Z" }
              as: ProtectionManager
              as_user_id: "${mgr_id}"
              captures: { leg_id: $.data.id, leg_v0: $.data.version }
            - call: "POST /exec-protection/detail-assignments"
              payload: { trip_leg_id: "${leg_id}", staff_id: "${lead_id}", role_on_detail: "LEAD_AGENT", starts_at: "2026-09-10T08:00:00Z", ends_at: "2026-09-10T18:00:00Z", expected_trip_leg_version: "${leg_v0}" }
              as: ProtectionManager
              as_user_id: "${mgr_id}"
              captures: { pda_id: $.data.id, pda_prov_cost: $.data.cost_cents }
            - call: "POST /exec-protection/trip-legs/${leg_id}/advance-progress"
              payload: { item_type: "ROUTE_SURVEY", outcome: "COMPLETE", note: "route walked" }
              as: SecurityAnalyst
              as_user_id: "${analyst_id}"
            - call: "POST /exec-protection/trips/${trip_id}/submit-for-approval"
              payload: {}
              as: ProtectionManager
              as_user_id: "${mgr_id}"
              captures: { trip_provisional: $.data.provisional_security_cost_cents }
            - call: "POST /exec-protection/trips/${trip_id}/briefing-ack"
              payload: {}
              as: Executive
              as_user_id: "${exec_id}"
            - call: "POST /exec-protection/trips/${trip_id}/decision"
              payload: { decision: "APPROVE" }
              as: SecurityDirector
              as_user_id: "${dir_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-12T00:00:00Z" }
              as: SystemOperator
              as_user_id: "ops-1"
          trigger:
            - call: "POST /exec-protection/detail-assignments/${pda_id}/release"
              payload: { actual_ends_at: "2026-09-10T09:47:00Z" }
              as: ProtectionManager
              as_user_id: "${mgr_id}"
              captures: { pda_final_cost: $.data.cost_cents, pda_final_hours: $.data.final_billable_hours }
            - call: "POST /exec-protection/trips/${trip_id}/close"
              payload: {}
              as: ProtectionManager
              as_user_id: "${mgr_id}"
              captures: { trip_total: $.data.total_security_cost_cents }
          assert:
            - "Trip.${trip_id}.provisional_security_cost_cents == 112500   # PROVISIONAL: round_half_up(10 * 9000 * 1.25) = 112500"
            - "ProtectiveDetailAssignment.${pda_id}.planned_billable_hours == 10"
            - "ProtectiveDetailAssignment.${pda_id}.final_billable_hours == 4   # ceil(107 minutes / 60) = 2, floored to MIN_BILLABLE_HOURS = 4"
            - "ProtectiveDetailAssignment.${pda_id}.cost_cents == 45000   # FINAL: round_half_up(4 * 9000 * 1.25) = 45000"
            - "ProtectiveDetailAssignment.${pda_id}.cost_basis == FINAL"
            - "Trip.${trip_id}.total_security_cost_cents == 45000"
            - "Trip.${trip_id}.provisional_security_cost_cents - Trip.${trip_id}.total_security_cost_cents == 67500"
            - "Trip.${trip_id}.perquisite_rate_applied == 0.10 and Trip.${trip_id}.perquisite_taxable_cents == 4500 and Trip.${trip_id}.business_borne_cents == 40500"
            - "Trip.${trip_id}.readiness_state == CLOSED"

  - rule_id: combinatorial_formula
    instances:

      - name: composite_risk_protest_floor_overrides_three_input_weighting
        grounds:
          - calculations.composite_risk_score
          - calculations.executive_threat_level
          - calculations.public_exposure_score
          - entities.Executive.fields.threat_level
          - state_machines.RiskAssessment.SUBMITTED_to_APPROVED
        distinguishing_aspect: |
          Mode (a): a non-linear function of three independent inputs plus a
          categorical fourth. threat_monitoring_score 30.00, public_exposure_component
          40.00 and residential_component 10.00 weight to 29.50 under TIER_3, which is
          below THREAT_ELEVATED_AT and would classify LOW; the PROTEST_FLOOR clause is
          not a term in the weighted sum but a max() applied AFTER the tier uplift, so
          the answer jumps to 60.00 and the executive's threat_level becomes HIGH. No
          linear reweighting of the three numeric inputs can produce 60.00 from them.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "one TIER_3 executive (uplift 1.00, so the uplift step is a no-op and the floor is the only non-linearity)"
            - "residential survey COMPLETE with residential_component 10.00"
            - "exactly one exposure signal: PROTEST_MENTION severity 4 observed at the clock instant, which both scores 40.00 and arms the PROTEST_FLOOR predicate (severity >= 4)"
            - "one DRAFT assessment with threat_monitoring_score 30.00"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemOperator
              as_user_id: "ops-1"
            - call: "POST /exec-protection/security-staff"
              payload: { full_name: "Ana Analyst", staff_role: "ANALYST", certification_expires_at: "2027-01-01T00:00:00Z", hourly_rate_cents: 9000 }
              as: SystemOperator
              as_user_id: "ops-1"
              captures: { analyst_id: $.data.id }
            - call: "POST /exec-protection/security-staff"
              payload: { full_name: "Mia Manager", staff_role: "MANAGER", certification_expires_at: "2027-01-01T00:00:00Z", hourly_rate_cents: 11000 }
              as: SystemOperator
              as_user_id: "ops-1"
              captures: { mgr_id: $.data.id }
            - call: "POST /exec-protection/security-staff"
              payload: { full_name: "Dan Director", staff_role: "DIRECTOR", certification_expires_at: "2027-01-01T00:00:00Z", hourly_rate_cents: 15000 }
              as: SystemOperator
              as_user_id: "ops-1"
              captures: { dir_id: $.data.id }
            - call: "POST /exec-protection/executives"
              payload: { full_name: "Eve Exec", tier: "TIER_3", role_title: "CEO", base_country_code: "US", annual_security_budget_cents: 100000000 }
              as: ProtectionManager
              as_user_id: "${mgr_id}"
              captures: { exec_id: $.data.id }
            - call: "POST /exec-protection/executives/${exec_id}/residential-survey"
              payload: { survey_outcome: "COMPLETE", residential_component: 10.00 }
              as: SecurityAnalyst
              as_user_id: "${analyst_id}"
            - call: "POST /exec-protection/executives/${exec_id}/exposure-signals"
              payload: { signal_type: "PROTEST_MENTION", severity: 4, observed_at: "2026-08-01T00:00:00Z", source_note: "arms the floor" }
              as: SecurityAnalyst
              as_user_id: "${analyst_id}"
            - call: "POST /exec-protection/risk-assessments"
              payload: { executive_id: "${exec_id}", authored_by_staff_id: "${analyst_id}", threat_monitoring_score: 30.00 }
              as: SecurityAnalyst
              as_user_id: "${analyst_id}"
              captures: { ra_id: $.data.id }
            - call: "POST /exec-protection/risk-assessments/${ra_id}/submit"
              payload: {}
              as: SecurityAnalyst
              as_user_id: "${analyst_id}"
              captures: { submitted_composite: $.data.composite_risk_score }
          trigger:
            - call: "POST /exec-protection/risk-assessments/${ra_id}/review"
              payload: { outcome: "APPROVE", review_notes: "floored by protest exposure" }
              as: SecurityDirector
              as_user_id: "${dir_id}"
              captures: { approved_composite: $.data.composite_risk_score }
            - call: "GET /exec-protection/executives/${exec_id}"
              payload: {}
              as: SecurityDirector
              as_user_id: "${dir_id}"
              captures: { threat: $.data.threat_level }
          assert:
            - "RiskAssessment.${ra_id}.public_exposure_component == 40.00   # ROLLING_WINDOW: 4 * 2.0 * 5 = 40.00"
            - "RiskAssessment.${ra_id}.composite_risk_score == 60.00   # weighted 0.45*30.00 + 0.35*40.00 + 0.20*10.00 = 29.50; TIER_3 uplift 1.00 -> 29.50; PROTEST_FLOOR max -> 60.00"
            - "RiskAssessment.${ra_id}.status == APPROVED"
            - "Executive.${exec_id}.threat_level == HIGH   # 55.00 <= 60.00 < 80.00; the unfloored 29.50 would have been LOW"
            - "Executive.${exec_id}.public_exposure_score == 40.00   # DECAY_WEIGHTED at age 0 equals the rolling value here"

      - name: assignment_cost_per_line_rounding_beats_sum_then_round_by_one_cent
        grounds:
          - calculations.detail_assignment_cost
          - calculations.trip_security_cost
          - entities.ProtectiveDetailAssignment.fields.cost_cents
          - entities.Trip.fields.provisional_security_cost_cents
          - endpoints.POST_/exec-protection/trips/{id}/submit-for-approval
        distinguishing_aspect: |
          Mode (b): nested rounding order. Three assignments whose exact products are
          22952.55, 48878.50 and 19442.50 cents. detail_assignment_cost rounds EACH line
          to whole cents first (22953 + 48879 + 19443 = 91275) while summing the exact
          products and rounding once gives 91274. Trip.provisional_security_cost_cents
          must be 91275, so the one-cent gap falsifies a sum-then-round implementation,
          and the 48878.50 / 19442.50 lines additionally falsify round-half-even.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "one TIER_3 executive, residential_component 10.00, annual budget 100000000 cents, no exposure signals -> composite 11.00, threat_level LOW"
            - "destination PT (composite 9.80 -> band LOW, required advance = [ROUTE_SURVEY], insurance_required_coverage_cents 25000000)"
            - "one VERIFIED MEDICAL_EVAC policy with coverage 500000000"
            - "three distinct staff whose hourly_rate_cents are 9001, 8887 and 7777, so no two assignments share a staff_id and validations[priority=33] never fires"
            - "one leg 2026-09-10T06:00:00Z..2026-09-11T06:00:00Z holding all three assignment windows"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
