        grounds:
          - endpoints[GET /emergency-action-plans/{id}/exercises]
          - state_machines.EmergencyActionPlan.APPROVED_to_SUPERSEDED
          - entities.EapExercise.parent
        distinguishing_aspect: |
          Exercises hang off the plan revision they were logged against, so approving a second plan
          supersedes the first without moving its exercise history: each nested listing returns only
          its own row even though both belong to the same dam.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
