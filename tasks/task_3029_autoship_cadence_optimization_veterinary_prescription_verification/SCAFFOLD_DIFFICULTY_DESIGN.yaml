  - rule_id: boundary_precision_check
    instances:

      - name: protection_guard_boundary_is_inclusive_at_the_rounded_guard
        grounds:
          - calculations.autoship_price_protection
          - validations[priority=19]
          - entities.AutoshipItem.fields.price_protected_unit_price_cents
        distinguishing_aspect: "A numeric threshold crossing at an exact equality: a raised price of exactly the rounded guard 1691 is protected, while 1692 is repriced, so the comparison is <= rather than < and the rounding of the guard decides which side the boundary falls on."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. A plan whose first order locked a protection price of 1610 and then advanced to 2026-10-29 so the second order is due."
          setup_api_calls:
            - call: "POST /v1/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /v1/products"
              payload: { sku: "BND-F1", product_name: "Boundary guard pack", medication_scope: "OTC", cold_pack_required: false, unit_dose_mg_per_kg: 0.02, pack_size_units: 10, unit_price_cents: 1610 }
              as: PlatformAdmin
              captures: { prod_f1: "$.data.id" }
            - call: "POST /v1/pets"
              payload: { pet_name: "Remy", species: "CAT", breed: "Abyssinian", weight_kg: 14.0, owner_state: "CA" }
              as: Customer
              captures: { pet_f1: "$.data.id" }
            - call: "POST /v1/autoship-plans"
              payload: { pet_id: "${pet_f1}" }
              as: Customer
              as_user_id: "${pet_f1}"
              captures: { plan_f1: "$.data.id" }
            - call: "POST /v1/autoship-plans/${plan_f1}/items"
              payload: { product_id: "${prod_f1}", cadence_days: 28, default_quantity: 1 }
              as: Customer
              as_user_id: "${pet_f1}"
              captures: { item_f1: "$.data.id" }
            - call: "GET /v1/autoship-plans/${plan_f1}"
              payload: {}
              as: Customer
              as_user_id: "${pet_f1}"
              captures: { plan_f1_v: $.data.version }
            - call: "POST /v1/autoship-plans/${plan_f1}/compose"
              payload: { expected_plan_version: "${plan_f1_v}" }
              as: Customer
              as_user_id: "${pet_f1}"
              captures: { first_order_f1: "$.data.id" }
            - call: "POST /v1/products/${prod_f1}/price"
              payload: { unit_price_cents: 1691 }
              as: ComplianceOfficer
            - call: "POST /v1/_clock/set_current_utc"
              payload: { current_utc: "2026-10-29T00:00:00Z" }
              as: PlatformAdmin
            - call: "GET /v1/autoship-plans/${plan_f1}"
              payload: {}
              as: Customer
              as_user_id: "${pet_f1}"
              captures: { plan_f1_v: "$.data.version" }
          trigger:
            - call: "POST /v1/autoship-plans/${plan_f1}/compose"
              payload: { expected_plan_version: "${plan_f1_v}" }
              as: Customer
              as_user_id: "${pet_f1}"
              captures: { order_f1: "$.data.id" }
            - call: "GET /v1/orders/${order_f1}/lines"
              payload: {}
              as: Customer
              captures: { line_f1: "$.data[0].id" }
          assert:
            - "the guard over price_protected_unit_price_cents 1610 is round_half_up(1610 * 1.05) == 1691, so the boundary sits exactly on 1691"
            - "OrderLine.${line_f1}.line_unit_price_cents == 1691 because a price equal to the guard is still PROTECTED, proving the comparison is inclusive"
            - "the percent_only variant reads REPRICED for the same row because (1691 - 1610) / 1610 == 0.05031 exceeds 0.05, so the two readings disagree exactly at the boundary"
            - "raising the list price one further cent to 1692 flips protection_state to REPRICED and charges 1692, so the boundary is precise to the cent"

