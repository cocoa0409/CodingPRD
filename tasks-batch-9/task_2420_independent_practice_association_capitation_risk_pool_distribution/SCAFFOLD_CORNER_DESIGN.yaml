              payload: { npi: "6100000001", full_name: "Dr Owner Self", specialty: "FAMILY_MEDICINE" }
              as: NetworkManager
              captures: { p_r4a: "$.data.id" }
            - call: "POST /ipa/physicians/${p_r4a}/state"
              payload: { to_state: "CREDENTIALED" }
              as: NetworkManager
            - call: "POST /ipa/physicians/${p_r4a}/state"
              payload: { to_state: "ACTIVE" }
              as: NetworkManager
            - call: "POST /ipa/delegation-agreements/${agr_r4}/physicians"
              payload: { npi: "6100000002", full_name: "Dr Owner Other", specialty: "FAMILY_MEDICINE" }
              as: NetworkManager
              captures: { p_r4b: "$.data.id", p_r4b_v: "$.data.version" }
            - call: "POST /ipa/physicians/${p_r4b}/state"
              payload: { to_state: "CREDENTIALED" }
              as: NetworkManager
            - call: "POST /ipa/physicians/${p_r4b}/state"
              payload: { to_state: "ACTIVE" }
              as: NetworkManager
              captures: { p_r4b_v_active: "$.data.version" }
          trigger:
            - call: "PATCH /ipa/physicians/${p_r4b}/panel-status"
