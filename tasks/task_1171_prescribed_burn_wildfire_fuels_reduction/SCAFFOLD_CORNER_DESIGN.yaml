            - { call: "POST /burn-bosses", payload: {name: "Boss A", certification_tier: "RXB3"}, as: AssociationAdmin, captures: {bossA: $.data.id} }
            - { call: "POST /parcels", payload: {landowner_id: "${lo}", name: "P1", acreage: 120, fuel_model: "BRUSH", slope_class: "MODERATE", wui_adjacent: false, airshed_id: "ASH-1", drought_index: 10}, as: Landowner, as_user_id: "${lo}", captures: {parcel: $.data.id, parcel_v: $.data.version} }
