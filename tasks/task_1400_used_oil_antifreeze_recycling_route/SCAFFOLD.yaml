# =============================================================================
# Used-Oil & Antifreeze Recycling Route — PRD Benchmark Scaffold (v1)
# Safety-Kleen-style scheduled-route collection with regulatory chain-of-custody,
# halogen screening, market-priced settlement, blending/resale, and spill
# liability. Difficulty target: beyond-expert.
# =============================================================================

scenario: |
  Used-Oil & Antifreeze Recycling Route (Safety-Kleen style route): customer
  tank level & pickup scheduling, sample screening & halogen rejection, volume
  metering & payment vs charge by market price, tank ownership & installation,
  manifest/bill of lading & regulatory record, blending & product resale,
  spill response & environmental liability, route density & minimum pickup.

domain_name: used-oil-recycling-route
api_prefix: /recycle-routes

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: pricing_engine
  complexity_layers:
    - optimistic_concurrency        # OCC on Route and Customer for schedule/settle writes
    - cascading_side_effects        # screening fail → quarantine tank → cancel stop → release route capacity → credit manifest
    - dual_variant_calculation      # payment-vs-charge by market; provisional-vs-final settlement
    - rate_threshold_triggers       # halogen ppm cutoff; minimum-pickup threshold; route density tier
    - derived_field_reconciliation  # route load totals, customer credit balance, tank current_volume
    - temporal_windowing            # route schedule windows + tank ownership installation windows
    - idempotency                   # driver-submitted pickup tickets are idempotent via client_request_id
  entity_topology: hybrid           # Route -> RouteStop tree; Customer -> TankSite -> Tank tree; cross-cutting Manifest, BlendBatch, SpillIncident
  state_machine_shape: branching    # PickupTicket branches on screening outcome; RouteStop branches on skip/cancel/complete; Manifest has amendment loops (cyclic)
  relationship_patterns:
    - one_to_many                   # Customer -> TankSite -> Tank; Route -> RouteStop -> PickupTicket
    - many_to_many                  # BlendBatch consumes many PickupTickets (via BlendInput junction)
    - cross_aggregate               # Manifest spans Routes and DisposalFacilities; SpillIncident ties TankSite + Route + Driver
  role_model: segregation_of_duties # Driver, LabTech, SettlementClerk, EHSOfficer, RoutePlanner, TankInstaller, Regulator
  consistency_model: immediate      # All mutations atomic in single request; no async

# =============================================================================
# §1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Customer
    parent: null
    common_fields: true
    fields:
      - { name: legal_name, type: string, source: input, description: "Registered customer name" }
      - { name: epa_generator_id, type: string, source: input, description: "EPA hazardous-waste generator ID (12-char); required for halogen-bearing streams" }
      - { name: market_zone, type: enum, source: input, description: "NORTH | SOUTH | COASTAL — drives commodity market price selection" }
      - { name: credit_terms, type: enum, source: input, description: "PREPAY | NET30 | CHARGE_ONLY — PREPAY customers must hold prepaid balance; CHARGE_ONLY customers are never paid, always charged" }
      - { name: prepaid_balance_cents, type: integer, source: computed, default: 0, description: "Prepaid account balance (cents); debited by charges, credited by payments and top-ups" }
      - { name: outstanding_charge_cents, type: integer, source: computed, default: 0, description: "Unpaid invoiced charges (cents) for NET30 / CHARGE_ONLY customers" }
      - { name: halogen_violation_count, type: integer, source: computed, default: 0, description: "Cumulative count of halogen-rejected pickups; drives surcharge tier" }
      - { name: status, type: enum, source: system, description: "PROSPECT | ACTIVE | SUSPENDED | TERMINATED" }

  - name: TankSite
    parent: Customer
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: system, description: "FK -> Customer.id; owning customer" }
      - { name: site_address, type: string, source: input, description: "Street address of the tank site" }
      - { name: density_zone, type: enum, source: input, description: "URBAN | SUBURBAN | RURAL — drives minimum-pickup threshold for route eligibility" }
      - { name: route_eligibility_override, type: boolean, source: input, default: false, description: "If true, site bypasses density minimum-pickup check (contract-carved)" }
      - { name: status, type: enum, source: system, description: "ACTIVE | INACTIVE | CONTAMINATED" }

  - name: Tank
    parent: TankSite
    common_fields: true
    fields:
      - { name: tank_site_id, type: string, source: system, description: "FK -> TankSite.id; parent site" }
      - { name: tank_kind, type: enum, source: input, description: "USED_OIL | ANTIFREEZE | MIXED" }
      - { name: capacity_gallons, type: integer, source: input, description: "Nominal capacity in whole gallons; > 0" }
      - { name: current_volume_gallons, type: integer, source: computed, default: 0, description: "Computed level: sum of intake events minus sum of pickup events; 0 <= value <= capacity_gallons" }
      - { name: ownership, type: enum, source: input, description: "COMPANY_OWNED | CUSTOMER_OWNED — drives installation and liability rules" }
      - { name: installed_at, type: datetime, source: system, description: "Installation timestamp; null until ownership=COMPANY_OWNED install completes" }
      - { name: ownership_status, type: enum, source: system, description: "PENDING_INSTALL | INSTALLED | DECOMMISSION_PENDING | DECOMMISSIONED" }
      - { name: quarantine_status, type: enum, source: system, default: "CLEAR", description: "CLEAR | QUARANTINED — set when halogen screen rejects; blocks pickup" }

  - name: Route
    parent: null
    common_fields: true
    fields:
      - { name: route_code, type: string, source: input, description: "Human-readable route code, unique per scheduled_date" }
      - { name: scheduled_date, type: string, source: input, description: "ISO date (YYYY-MM-DD) the route runs" }
      - { name: driver_id, type: string, source: input, description: "FK -> Driver.id (entity_backed); assigned driver" }
      - { name: vehicle_capacity_gallons, type: integer, source: input, description: "Vehicle tank capacity; > 0" }
      - { name: loaded_gallons, type: integer, source: computed, default: 0, description: "Cumulative gallons loaded from completed stops; cannot exceed vehicle_capacity_gallons" }
      - { name: density_zone, type: enum, source: input, description: "URBAN | SUBURBAN | RURAL — dominant zone; affects minimum-pickup rule per stop" }
      - { name: posture, type: enum, source: computed, description: "OPEN | AT_CAPACITY | CLOSED_OUT — derived from loaded_gallons and stop states" }
      - { name: status, type: enum, source: system, description: "PLANNED | DISPATCHED | IN_PROGRESS | COMPLETE | CANCELLED" }

  - name: Driver
    parent: null
    common_fields: true
    fields:
      - { name: driver_name, type: string, source: input, description: "Driver's legal name" }
      - { name: cdl_class, type: enum, source: input, description: "A | B | C — must be A or B for tanker work" }
      - { name: hazmat_endorsement, type: boolean, source: input, description: "Hazmat endorsement flag; required to haul halogen-quarantined or MIXED tanks" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED" }

  - name: RouteStop
    parent: Route
    common_fields: true
    fields:
      - { name: route_id, type: string, source: system, description: "FK -> Route.id; parent route" }
      - { name: tank_site_id, type: string, source: input, description: "FK -> TankSite.id; site being serviced" }
      - { name: tank_id, type: string, source: input, description: "FK -> Tank.id; specific tank to draw from" }
      - { name: scheduled_window_start, type: string, source: input, description: "HH:MM 24h local start of service window" }
      - { name: scheduled_window_end, type: string, source: input, description: "HH:MM 24h local end; must be > scheduled_window_start" }
      - { name: sequence, type: integer, source: input, description: "Stop order on the route; unique within route, 1-based" }
      - { name: estimated_volume_gallons, type: integer, source: input, description: "Dispatch estimate; used for capacity planning, never for settlement" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | EN_ROUTE | SCREENING | READY_TO_PUMP | COMPLETED | SKIPPED_BELOW_MINIMUM | CANCELLED_HALOGEN | CANCELLED_ROUTE | CANCELLED_CUSTOMER" }

  - name: SampleScreening
    parent: RouteStop
    common_fields: true
    fields:
      - { name: route_stop_id, type: string, source: system, description: "FK -> RouteStop.id; the stop being screened" }
      - { name: halogen_ppm, type: integer, source: input, description: "Measured halogen concentration in parts per million; 0..100000" }
      - { name: water_pct, type: number, source: input, description: "Water content percent, 0.0..100.0, one decimal" }
      - { name: ph_level, type: number, source: input, description: "pH, 0.0..14.0, one decimal; antifreeze only constraint" }
      - { name: result, type: enum, source: computed, description: "PASS | FAIL_HALOGEN | FAIL_WATER | FAIL_PH — derived from thresholds vs tank_kind" }
      - { name: screened_by_user_id, type: string, source: system, description: "LabTech user id who recorded the screen" }
      - { name: screening_recorded_at, type: datetime, source: system, description: "UTC timestamp when screening was recorded" }

  - name: PickupTicket
    parent: RouteStop
    common_fields: true
    fields:
      - { name: route_stop_id, type: string, source: system, description: "FK -> RouteStop.id; one-to-one with a COMPLETED stop" }
      - { name: client_request_id, type: string, source: input, description: "Idempotency key supplied by driver handheld; unique per RouteStop" }
      - { name: metered_volume_gallons, type: integer, source: input, description: "Metered gallons pumped; must be > 0 and <= tank.current_volume_gallons at pump time" }
      - { name: commodity_price_cents_per_gal, type: integer, source: computed, description: "Snapshot of market price at time of pumping, signed: positive means we pay customer, negative means we charge customer" }
      - { name: settlement_direction, type: enum, source: computed, description: "PAY_CUSTOMER | CHARGE_CUSTOMER | ZERO_NET — derived from signed price x volume" }
      - { name: gross_amount_cents, type: integer, source: computed, description: "abs(price) * volume; rounding pinned by calculation" }
      - { name: surcharge_cents, type: integer, source: computed, default: 0, description: "Halogen-history surcharge applied when customer.halogen_violation_count crosses tier thresholds" }
      - { name: density_fee_cents, type: integer, source: computed, default: 0, description: "Minimum-pickup shortfall fee when metered < zone minimum and no override" }
      - { name: net_amount_cents, type: integer, source: computed, description: "Signed: + means credit to customer, - means charge to customer; gross +/- surcharge +/- density fee" }
      - { name: payment_status, type: enum, source: system, description: "PROVISIONAL | SETTLED | DISPUTED | ADJUSTED" }
      - { name: frozen_halogen_count, type: integer, source: computed, description: "Customer.halogen_violation_count captured at screening time; frozen on the ticket for later blend-yield weighting" }
      - { name: tank_kind, type: enum, source: computed, description: "Tank.tank_kind denormalized onto ticket for blend-mix analysis" }
      - { name: route_id, type: string, source: computed, description: "RouteStop.route_id denormalized for manifest cascade" }

  - name: Manifest
    parent: Route
    common_fields: true
    fields:
      - { name: route_id, type: string, source: system, description: "FK -> Route.id; one manifest per route (1:1)" }
      - { name: manifest_tracking_number, type: string, source: input, description: "EPA Uniform Hazardous Waste Manifest tracking number; unique" }
      - { name: disposal_facility_id, type: string, source: input, description: "FK -> DisposalFacility.id" }
      - { name: total_gallons_manifested, type: integer, source: computed, default: 0, description: "Sum of metered_volume_gallons from COMPLETED stops on this route; recomputed on each stop completion and on amendment" }
      - { name: halogen_flag, type: boolean, source: computed, default: false, description: "True if any pickup on the route came from a previously QUARANTINED tank (regulatory marker)" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | IN_TRANSIT | DELIVERED | AMENDMENT_PENDING | AMENDED | CLOSED | REJECTED_BY_FACILITY" }

  - name: DisposalFacility
    parent: null
    common_fields: true
    fields:
      - { name: facility_name, type: string, source: input, description: "TSDF name" }
      - { name: epa_id, type: string, source: input, description: "EPA identification number; unique" }
      - { name: accepted_streams, type: array, source: input, description: "Array of enum {USED_OIL, ANTIFREEZE, MIXED, HALOGENATED} the facility accepts" }
      - { name: daily_capacity_gallons, type: integer, source: input, description: "Max gallons receivable per calendar day" }
      - { name: scheduled_gallons_today, type: integer, source: computed, default: 0, description: "Sum of total_gallons_manifested for manifests with status IN (SUBMITTED, IN_TRANSIT, AMENDMENT_PENDING) with scheduled_date == today" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED" }

  - name: BlendBatch
    parent: null
    common_fields: true
    fields:
      - { name: batch_code, type: string, source: input, description: "Unique batch identifier" }
      - { name: target_product, type: enum, source: input, description: "RE_REFINED_BASE_OIL | RECYCLED_ANTIFREEZE | FUEL_BLENDING_STOCK" }
      - { name: input_pickup_ticket_ids, type: array, source: input, description: "Array of PickupTicket.id consumed as feedstock; each ticket must be SETTLED and not already consumed" }
      - { name: input_gallons_total, type: integer, source: computed, description: "Sum of metered_volume_gallons across consumed tickets" }
      - { name: yield_pct, type: number, source: computed, description: "Process yield percent, computed from target_product and feedstock mix" }
      - { name: output_gallons, type: integer, source: computed, description: "round_half_up(input_gallons_total * yield_pct / 100); populated by start-blending" }
      - { name: planned_output_gallons, type: integer, source: computed, description: "Optimistic projection at create time (planned_estimate variant); informational only" }
      - { name: resale_price_cents_per_gal, type: integer, source: input, description: "Unit resale price for the batch output" }
      - { name: gross_resale_revenue_cents, type: integer, source: computed, description: "output_gallons * resale_price_cents_per_gal" }
      - { name: status, type: enum, source: system, description: "PLANNED | BLENDING | QUALITY_HOLD | RELEASED_FOR_SALE | SOLD | CANCELLED" }

  - name: MarketPrice
    parent: null
    common_fields: false
    fields:
      - { name: market_zone, type: enum, source: input, description: "NORTH | SOUTH | COASTAL" }
      - { name: tank_kind, type: enum, source: input, description: "USED_OIL | ANTIFREEZE | MIXED" }
      - { name: effective_date, type: string, source: input, description: "ISO date (YYYY-MM-DD); inclusive lower bound" }
      - { name: price_cents_per_gal, type: integer, source: input, description: "Signed cents/gal; positive = pay customer, negative = charge customer; 0 allowed" }

  - name: SpillIncident
    parent: null
    common_fields: true
    fields:
      - { name: route_id, type: string, source: input, description: "FK -> Route.id; route active at time of spill" }
      - { name: tank_site_id, type: string, source: input, description: "FK -> TankSite.id; site of the spill" }
      - { name: reported_by_user_id, type: string, source: system, description: "User (driver or EHS officer) who logged the spill" }
      - { name: gallons_spilled, type: integer, source: input, description: "Estimated gallons released; > 0" }
      - { name: reportable_quantity_exceeded, type: boolean, source: computed, description: "True when gallons_spilled >= RQ threshold (25 gal)" }
      - { name: liability_cents, type: integer, source: computed, description: "Assessed environmental liability, per-liability calculation" }
      - { name: responsible_party, type: enum, source: computed, description: "COMPANY | CUSTOMER | SHARED — derived from tank ownership + spill cause code" }
      - { name: cause_code, type: enum, source: input, description: "EQUIPMENT_FAILURE | CUSTOMER_OVERFILL | DRIVER_ERROR | THIRD_PARTY | UNKNOWN" }
      - { name: status, type: enum, source: system, description: "OPEN | UNDER_INVESTIGATION | REMEDIATED | CLOSED_NO_ACTION | CLOSED_WITH_LIABILITY" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Customer
    initial_state: PROSPECT
    terminal_states: [TERMINATED]
    transitions:
      - from: PROSPECT
        to: ACTIVE
        trigger: "POST /recycle-routes/customers/{customerId}/activate"
        actor: RoutePlanner
        preconditions:
          - "Customer in PROSPECT (ERR_CUSTOMER_NOT_PROSPECT)"
          - "At least one TankSite with at least one Tank with ownership_status=INSTALLED exists (ERR_NO_SERVICEABLE_TANK)"
        side_effects:
          - "Customer.status = ACTIVE"

      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /recycle-routes/customers/{customerId}/suspend"
        actor: RoutePlanner
        preconditions:
          - "Customer in ACTIVE (ERR_CUSTOMER_NOT_ACTIVE)"
        side_effects:
          - "All TankSite under customer → INACTIVE"
          - "All future-dated RouteStop referencing any Tank at those sites, in status SCHEDULED, are transitioned → CANCELLED_CUSTOMER"

      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /recycle-routes/customers/{customerId}/reinstate"
        actor: RoutePlanner
        preconditions:
          - "Customer in SUSPENDED (ERR_CUSTOMER_NOT_SUSPENDED)"
          - "outstanding_charge_cents == 0 (ERR_OUTSTANDING_BALANCE)"
        side_effects:
          - "All TankSite under customer that were INACTIVE by cascade (not by explicit call) → ACTIVE"

      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /recycle-routes/customers/{customerId}/terminate"
        actor: RoutePlanner
        preconditions:
          - "Customer in ACTIVE (ERR_CUSTOMER_NOT_ACTIVE)"
          - "outstanding_charge_cents == 0 (ERR_OUTSTANDING_BALANCE)"
          - "prepaid_balance_cents == 0 (ERR_UNRETURNED_PREPAID_BALANCE)"
        side_effects:
          - "All TankSite → INACTIVE; all Tank ownership_status → DECOMMISSION_PENDING"
          - "All non-terminal RouteStop referencing those tanks → CANCELLED_CUSTOMER"

  - entity: TankSite
    initial_state: ACTIVE
    terminal_states: [INACTIVE, CONTAMINATED]
    transitions:
      - from: ACTIVE
        to: INACTIVE
        trigger: "POST /recycle-routes/tank-sites/{tankSiteId}/deactivate (explicit) OR cascade from Customer.suspend"
        actor: RoutePlanner
        preconditions:
          - "No RouteStop for any Tank at this site in status IN (SCHEDULED, EN_ROUTE, SCREENING, READY_TO_PUMP) (ERR_SITE_HAS_ACTIVE_STOPS)"
        side_effects: []

      - from: ACTIVE
        to: CONTAMINATED
        trigger: "system (automatic on SpillIncident create with reportable_quantity_exceeded=true)"
        actor: system
        preconditions: []
        side_effects:
          - "All Tank at this site → quarantine_status=QUARANTINED"

      - from: INACTIVE
        to: ACTIVE
        trigger: "POST /recycle-routes/tank-sites/{tankSiteId}/activate"
        actor: RoutePlanner
        preconditions:
          - "Customer.status == ACTIVE (ERR_CUSTOMER_NOT_ACTIVE)"
        side_effects: []

      - from: CONTAMINATED
        to: ACTIVE
        trigger: "POST /recycle-routes/tank-sites/{tankSiteId}/certify-clean"
        actor: EHSOfficer
        preconditions:
          - "All SpillIncident at this site in status IN (REMEDIATED, CLOSED_NO_ACTION, CLOSED_WITH_LIABILITY) (ERR_OPEN_SPILL_EXISTS)"
        side_effects:
          - "All Tank at this site → quarantine_status=CLEAR (per-tank halogen flag preserved by SampleScreening history)"

  - entity: Tank
    initial_state: PENDING_INSTALL
    terminal_states: [DECOMMISSIONED]
    # Two parallel dimensions: ownership_status (lifecycle) x quarantine_status (hazard flag)
    transitions:
      - from: PENDING_INSTALL
        to: INSTALLED
        trigger: "POST /recycle-routes/tanks/{tankId}/install"
        actor: TankInstaller
        preconditions:
          - "Tank in PENDING_INSTALL (ERR_TANK_NOT_PENDING_INSTALL)"
          - "Tank.ownership == COMPANY_OWNED (ERR_TANK_NOT_COMPANY_OWNED) — customer-owned tanks skip install via /register-existing"
        side_effects:
          - "installed_at = current UTC"
          - "ownership_status = INSTALLED"

      - from: PENDING_INSTALL
        to: INSTALLED
        trigger: "POST /recycle-routes/tanks/{tankId}/register-existing"
        actor: TankInstaller
        preconditions:
          - "Tank in PENDING_INSTALL (ERR_TANK_NOT_PENDING_INSTALL)"
          - "Tank.ownership == CUSTOMER_OWNED (ERR_TANK_NOT_CUSTOMER_OWNED)"
        side_effects:
          - "installed_at = current UTC"
          - "ownership_status = INSTALLED"

      - from: INSTALLED
        to: DECOMMISSION_PENDING
        trigger: "POST /recycle-routes/tanks/{tankId}/decommission OR cascade from Customer.terminate"
        actor: TankInstaller
        preconditions:
          - "current_volume_gallons == 0 (ERR_TANK_NOT_EMPTY)"
          - "No RouteStop referencing this tank in status IN (SCHEDULED, EN_ROUTE, SCREENING, READY_TO_PUMP) (ERR_TANK_HAS_ACTIVE_STOPS)"
        side_effects: []

      - from: DECOMMISSION_PENDING
        to: DECOMMISSIONED
        trigger: "POST /recycle-routes/tanks/{tankId}/decommission-confirm"
        actor: TankInstaller
        preconditions:
          - "Tank in DECOMMISSION_PENDING (ERR_TANK_NOT_PENDING_DECOMMISSION)"
        side_effects:
          - "ownership_status = DECOMMISSIONED"

      # quarantine_status dimension (parallel)
      - from: CLEAR
        to: QUARANTINED
        trigger: "system (on SampleScreening with result=FAIL_HALOGEN OR on TankSite → CONTAMINATED)"
        actor: system
        preconditions: []
        side_effects:
          - "Any RouteStop referencing this tank in status IN (SCHEDULED, EN_ROUTE) → CANCELLED_HALOGEN (only when trigger is halogen screen)"

      - from: QUARANTINED
        to: CLEAR
        trigger: "POST /recycle-routes/tanks/{tankId}/clear-quarantine"
        actor: EHSOfficer
        preconditions:
          - "Tank in QUARANTINED (ERR_TANK_NOT_QUARANTINED)"
          - "TankSite.status != CONTAMINATED (ERR_SITE_STILL_CONTAMINATED)"
        side_effects: []

  - entity: Route
    initial_state: PLANNED
    terminal_states: [COMPLETE, CANCELLED]
    # Branching + posture-driven: posture computed from stops; status gates manifest
    transitions:
      - from: PLANNED
        to: DISPATCHED
        trigger: "POST /recycle-routes/routes/{routeId}/dispatch"
        actor: RoutePlanner
        preconditions:
          - "Route in PLANNED (ERR_ROUTE_NOT_PLANNED)"
          - "At least one RouteStop in SCHEDULED (ERR_ROUTE_EMPTY)"
          - "Driver.status == ACTIVE (ERR_DRIVER_SUSPENDED)"
          - "Driver.hazmat_endorsement == true when any stop's tank has tank_kind=MIXED (ERR_DRIVER_NO_HAZMAT)"
        side_effects:
          - "Route.status = DISPATCHED"

      - from: DISPATCHED
        to: IN_PROGRESS
        trigger: "system (on first RouteStop transitions SCHEDULED → EN_ROUTE)"
        actor: system
        preconditions: []
        side_effects: []

      - from: IN_PROGRESS
        to: COMPLETE
        trigger: "POST /recycle-routes/routes/{routeId}/complete"
        actor: RoutePlanner
        preconditions:
          - "All RouteStop on route in terminal state: COMPLETED, SKIPPED_BELOW_MINIMUM, CANCELLED_HALOGEN, CANCELLED_ROUTE, CANCELLED_CUSTOMER (ERR_ROUTE_HAS_OPEN_STOPS)"
          - "Manifest for route (if any) has status IN (SUBMITTED, IN_TRANSIT, DELIVERED, AMENDED, CLOSED) (ERR_MANIFEST_NOT_SUBMITTED) — cannot complete with DRAFT manifest"
        side_effects:
          - "Route.status = COMPLETE"
          - "Route.posture = CLOSED_OUT"

      - from: PLANNED
        to: CANCELLED
        trigger: "POST /recycle-routes/routes/{routeId}/cancel"
        actor: RoutePlanner
        preconditions:
          - "Route in PLANNED or DISPATCHED (ERR_ROUTE_NOT_CANCELLABLE)"
        side_effects:
          - "All RouteStop in SCHEDULED → CANCELLED_ROUTE"
          - "Manifest (if exists) in DRAFT → status remains DRAFT but is orphaned; if SUBMITTED, ERR_ROUTE_HAS_SUBMITTED_MANIFEST"

      - from: DISPATCHED
        to: CANCELLED
        trigger: "POST /recycle-routes/routes/{routeId}/cancel"
        actor: RoutePlanner
        preconditions:
          - "No RouteStop in COMPLETED (ERR_ROUTE_HAS_COMPLETED_STOPS)"
          - "Manifest (if exists) not in SUBMITTED or beyond (ERR_ROUTE_HAS_SUBMITTED_MANIFEST)"
        side_effects:
          - "All non-terminal RouteStop → CANCELLED_ROUTE"

  - entity: RouteStop
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, SKIPPED_BELOW_MINIMUM, CANCELLED_HALOGEN, CANCELLED_ROUTE, CANCELLED_CUSTOMER]
    transitions:
      - from: SCHEDULED
        to: EN_ROUTE
        trigger: "POST /recycle-routes/route-stops/{routeStopId}/arrive"
        actor: Driver
        preconditions:
          - "Stop in SCHEDULED (ERR_STOP_NOT_SCHEDULED)"
          - "Route.status IN (DISPATCHED, IN_PROGRESS) (ERR_ROUTE_NOT_DISPATCHED)"
          - "Tank.quarantine_status == CLEAR (ERR_TANK_QUARANTINED)"
          - "TankSite.status == ACTIVE (ERR_SITE_NOT_ACTIVE)"
        side_effects:
          - "If Route.status == DISPATCHED, Route.status → IN_PROGRESS"

      - from: EN_ROUTE
        to: SCREENING
        trigger: "POST /recycle-routes/route-stops/{routeStopId}/begin-screening"
        actor: Driver
        preconditions:
          - "Stop in EN_ROUTE (ERR_STOP_NOT_EN_ROUTE)"
        side_effects: []

      - from: SCREENING
        to: READY_TO_PUMP
        trigger: "POST /recycle-routes/sample-screenings (with result=PASS recorded)"
        actor: LabTech
        preconditions:
          - "Stop in SCREENING (ERR_STOP_NOT_SCREENING)"
          - "SampleScreening.result == PASS (ERR_SCREEN_FAILED)"
        side_effects: []

      - from: SCREENING
        to: CANCELLED_HALOGEN
        trigger: "system (on SampleScreening with result=FAIL_HALOGEN)"
        actor: system
        preconditions: []
        side_effects:
          - "Tank.quarantine_status → QUARANTINED"
          - "Customer.halogen_violation_count += 1"
          - "If Customer.halogen_violation_count crosses threshold (3, 5): customer notification flag set (internal)"

      - from: SCREENING
        to: SCHEDULED
        trigger: "system (on SampleScreening with result IN (FAIL_WATER, FAIL_PH))"
        actor: system
        preconditions: []
        side_effects:
          - "Stop returns to SCHEDULED; a reschedule note is attached (non-halogen failures are recoverable)"

      - from: READY_TO_PUMP
        to: COMPLETED
        trigger: "POST /recycle-routes/route-stops/{routeStopId}/pickup-tickets (creates PickupTicket)"
        actor: Driver
        preconditions:
          - "Stop in READY_TO_PUMP (ERR_STOP_NOT_READY_TO_PUMP)"
          - "metered_volume_gallons <= Tank.current_volume_gallons (ERR_VOLUME_EXCEEDS_TANK_LEVEL)"
          - "Route.loaded_gallons + metered_volume_gallons <= Route.vehicle_capacity_gallons (ERR_ROUTE_CAPACITY_EXCEEDED)"
          - "If metered_volume_gallons < zone_minimum(tank_site.density_zone) AND NOT TankSite.route_eligibility_override: density_fee applies; if metered_volume_gallons == 0 → SKIPPED_BELOW_MINIMUM instead (see zero-volume skip transition)"
        side_effects:
          - "Tank.current_volume_gallons -= metered_volume_gallons"
          - "Route.loaded_gallons += metered_volume_gallons"
          - "If Route.loaded_gallons == Route.vehicle_capacity_gallons: Route.posture = AT_CAPACITY"
          - "PickupTicket created with provisional calculation"
          - "Manifest.total_gallons_manifested += metered_volume_gallons (if manifest exists)"

      - from: READY_TO_PUMP
        to: SKIPPED_BELOW_MINIMUM
        trigger: "POST /recycle-routes/route-stops/{routeStopId}/skip-below-minimum"
        actor: Driver
        preconditions:
          - "Stop in READY_TO_PUMP (ERR_STOP_NOT_READY_TO_PUMP)"
          - "Tank.current_volume_gallons < zone_minimum(tank_site.density_zone) (ERR_VOLUME_ABOVE_MINIMUM — must use pickup instead)"
          - "TankSite.route_eligibility_override == false (ERR_SITE_OVERRIDE_ACTIVE)"
        side_effects:
          - "density_fee_cents calculated and posted to PickupTicket (zero-volume ticket created for audit)"

      - from: EN_ROUTE
        to: CANCELLED_CUSTOMER
        trigger: "POST /recycle-routes/route-stops/{routeStopId}/cancel-by-customer"
        actor: RoutePlanner
        preconditions:
          - "Stop in SCHEDULED or EN_ROUTE (ERR_STOP_NOT_CANCELLABLE)"
        side_effects: []

      - from: SCHEDULED
        to: CANCELLED_ROUTE
        trigger: "system (cascade from Route.cancel)"
        actor: system
        preconditions: []
        side_effects: []

      - from: SCHEDULED
        to: CANCELLED_HALOGEN
        trigger: "system (cascade from Tank → QUARANTINED due to halogen screen at another stop on same tank)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: PickupTicket
    initial_state: PROVISIONAL
    terminal_states: [ADJUSTED]
    # Note: SETTLED is not terminal because SETTLED -> DISPUTED -> ADJUSTED is a
    # valid correction cycle. ADJUSTED is the only truly terminal state.
    transitions:
      - from: PROVISIONAL
        to: SETTLED
        trigger: "POST /recycle-routes/pickup-tickets/{ticketId}/settle"
        actor: SettlementClerk
        preconditions:
          - "Ticket in PROVISIONAL (ERR_TICKET_NOT_PROVISIONAL)"
          - "PickupTicket's RouteStop.status == COMPLETED (ERR_STOP_NOT_COMPLETED)"
          - "Customer.credit_terms == PREPAY requires (prepaid_balance_cents + net_amount_cents >= 0) when net_amount_cents < 0 (ERR_INSUFFICIENT_PREPAID_BALANCE)"
        side_effects:
          - "Apply net_amount_cents to Customer: PAY_CUSTOMER → prepaid_balance_cents += net; CHARGE_CUSTOMER → NET30/CHARGE_ONLY → outstanding_charge_cents += abs(net); PREPAY → prepaid_balance_cents -= abs(net)"
          - "payment_status = SETTLED"

      - from: PROVISIONAL
        to: DISPUTED
        trigger: "POST /recycle-routes/pickup-tickets/{ticketId}/dispute"
        actor: SettlementClerk
        preconditions:
          - "Ticket in PROVISIONAL or SETTLED (ERR_TICKET_NOT_DISPUTABLE)"
        side_effects: []

      - from: SETTLED
        to: DISPUTED
        trigger: "POST /recycle-routes/pickup-tickets/{ticketId}/dispute"
        actor: SettlementClerk
        preconditions:
          - "Ticket in PROVISIONAL or SETTLED (ERR_TICKET_NOT_DISPUTABLE)"
        side_effects:
          - "Original net_amount_cents remains posted to Customer; adjustment will post only the DELTA"

      - from: DISPUTED
        to: ADJUSTED
        trigger: "POST /recycle-routes/pickup-tickets/{ticketId}/adjust"
        actor: SettlementClerk
        preconditions:
          - "Ticket in DISPUTED (ERR_TICKET_NOT_DISPUTED)"
        side_effects:
          - "Recompute net_amount_cents with corrected metered_volume_gallons or price snapshot"
          - "If ticket was previously SETTLED: post only the DELTA (new_net - old_net) to Customer; if never settled: post the full new net"
          - "If ticket was previously SETTLED: payment_status remains SETTLED-equivalent — but we surface ADJUSTED as terminal"

  - entity: Manifest
    initial_state: DRAFT
    terminal_states: [CLOSED, REJECTED_BY_FACILITY]
    # Cyclic: AMENDED → SUBMITTED loop allowed for correction cycle
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /recycle-routes/manifests/{manifestId}/submit"
        actor: RoutePlanner
        preconditions:
          - "Manifest in DRAFT or AMENDED (ERR_MANIFEST_NOT_SUBMITTABLE)"
          - "Route.status == IN_PROGRESS or COMPLETE (ERR_ROUTE_NOT_READY_FOR_MANIFEST)"
          - "DisposalFacility.status == ACTIVE (ERR_FACILITY_SUSPENDED)"
          - "DisposalFacility.scheduled_gallons_today + total_gallons_manifested <= DisposalFacility.daily_capacity_gallons (ERR_FACILITY_CAPACITY_EXCEEDED)"
          - "If halogen_flag == true: 'HALOGENATED' in DisposalFacility.accepted_streams (ERR_FACILITY_REJECTS_HALOGENATED)"
        side_effects:
          - "DisposalFacility.scheduled_gallons_today += total_gallons_manifested"

      - from: SUBMITTED
        to: IN_TRANSIT
        trigger: "POST /recycle-routes/manifests/{manifestId}/depart"
        actor: Driver
        preconditions:
          - "Manifest in SUBMITTED (ERR_MANIFEST_NOT_SUBMITTED)"
          - "Route.status == COMPLETE (ERR_ROUTE_NOT_COMPLETE)"
        side_effects: []

      - from: IN_TRANSIT
        to: DELIVERED
        trigger: "POST /recycle-routes/manifests/{manifestId}/deliver"
        actor: Driver
        preconditions:
          - "Manifest in IN_TRANSIT (ERR_MANIFEST_NOT_IN_TRANSIT)"
        side_effects: []

      - from: DELIVERED
        to: CLOSED
        trigger: "POST /recycle-routes/manifests/{manifestId}/close"
        actor: Regulator
        preconditions:
          - "Manifest in DELIVERED (ERR_MANIFEST_NOT_DELIVERED)"
          - "All SpillIncident for route in terminal state (ERR_OPEN_SPILL_EXISTS)"
        side_effects:
          - "DisposalFacility.scheduled_gallons_today -= total_gallons_manifested"

      - from: DELIVERED
        to: AMENDMENT_PENDING
        trigger: "POST /recycle-routes/manifests/{manifestId}/request-amendment"
        actor: RoutePlanner
        preconditions:
          - "Manifest in DELIVERED (ERR_MANIFEST_NOT_DELIVERED)"
        side_effects: []

      - from: AMENDMENT_PENDING
        to: AMENDED
        trigger: "POST /recycle-routes/manifests/{manifestId}/approve-amendment"
        actor: Regulator
        preconditions:
          - "Manifest in AMENDMENT_PENDING (ERR_MANIFEST_NOT_PENDING_AMENDMENT)"
        side_effects:
          - "Recompute total_gallons_manifested from current COMPLETED stops (reconciliation)"

      - from: AMENDED
        to: SUBMITTED
        trigger: "POST /recycle-routes/manifests/{manifestId}/submit"
        actor: RoutePlanner
        preconditions:
          - "Same as DRAFT → SUBMITTED"
        side_effects:
          - "Cycle continues; resubmission uses recomputed totals"

      - from: SUBMITTED
        to: REJECTED_BY_FACILITY
        trigger: "POST /recycle-routes/manifests/{manifestId}/facility-reject"
        actor: Regulator
        preconditions:
          - "Manifest in SUBMITTED (ERR_MANIFEST_NOT_SUBMITTED)"
        side_effects:
          - "DisposalFacility.scheduled_gallons_today -= total_gallons_manifested"
          - "Route.posture forced to CLOSED_OUT if not already"

  - entity: BlendBatch
    initial_state: PLANNED
    terminal_states: [SOLD, CANCELLED]
    transitions:
      - from: PLANNED
        to: BLENDING
        trigger: "POST /recycle-routes/blend-batches/{batchId}/start-blending"
        actor: RoutePlanner
        preconditions:
          - "BlendBatch in PLANNED (ERR_BATCH_NOT_PLANNED)"
          - "Every PickupTicket in input_pickup_ticket_ids has payment_status == SETTLED (ERR_TICKET_NOT_SETTLED)"
          - "Every PickupTicket in input_pickup_ticket_ids not already consumed by another BlendBatch in status != CANCELLED (ERR_TICKET_ALREADY_CONSUMED)"
        side_effects:
          - "Compute input_gallons_total, yield_pct, output_gallons, gross_resale_revenue_cents"

      - from: BLENDING
        to: QUALITY_HOLD
        trigger: "POST /recycle-routes/blend-batches/{batchId}/hold"
        actor: LabTech
        preconditions:
          - "BlendBatch in BLENDING (ERR_BATCH_NOT_BLENDING)"
        side_effects: []

      - from: QUALITY_HOLD
        to: BLENDING
        trigger: "POST /recycle-routes/blend-batches/{batchId}/resume"
        actor: LabTech
        preconditions:
          - "BlendBatch in QUALITY_HOLD (ERR_BATCH_NOT_ON_HOLD)"
        side_effects: []

      - from: BLENDING
        to: RELEASED_FOR_SALE
        trigger: "POST /recycle-routes/blend-batches/{batchId}/release"
        actor: LabTech
        preconditions:
          - "BlendBatch in BLENDING (ERR_BATCH_NOT_BLENDING)"
        side_effects: []

      - from: RELEASED_FOR_SALE
        to: SOLD
        trigger: "POST /recycle-routes/blend-batches/{batchId}/mark-sold"
        actor: SettlementClerk
        preconditions:
          - "BlendBatch in RELEASED_FOR_SALE (ERR_BATCH_NOT_RELEASED)"
        side_effects: []

      - from: PLANNED
        to: CANCELLED
        trigger: "POST /recycle-routes/blend-batches/{batchId}/cancel"
        actor: RoutePlanner
        preconditions:
          - "BlendBatch in PLANNED or BLENDING (ERR_BATCH_NOT_CANCELLABLE)"
        side_effects:
          - "input_pickup_ticket_ids released (they may be re-consumed)"

      - from: BLENDING
        to: CANCELLED
        trigger: "POST /recycle-routes/blend-batches/{batchId}/cancel"
        actor: RoutePlanner
        preconditions:
          - "BlendBatch in PLANNED or BLENDING (ERR_BATCH_NOT_CANCELLABLE)"
        side_effects:
          - "input_pickup_ticket_ids released"

  - entity: SpillIncident
    initial_state: OPEN
    terminal_states: [CLOSED_NO_ACTION, CLOSED_WITH_LIABILITY]
    transitions:
      - from: OPEN
        to: UNDER_INVESTIGATION
        trigger: "POST /recycle-routes/spill-incidents/{spillId}/begin-investigation"
        actor: EHSOfficer
        preconditions:
          - "SpillIncident in OPEN (ERR_SPILL_NOT_OPEN)"
        side_effects:
          - "If reportable_quantity_exceeded: TankSite.status → CONTAMINATED (cascade)"

      - from: UNDER_INVESTIGATION
        to: REMEDIATED
        trigger: "POST /recycle-routes/spill-incidents/{spillId}/remediate"
        actor: EHSOfficer
        preconditions:
          - "SpillIncident in UNDER_INVESTIGATION (ERR_SPILL_NOT_UNDER_INVESTIGATION)"
        side_effects:
          - "Compute liability_cents and responsible_party"

      - from: REMEDIATED
        to: CLOSED_WITH_LIABILITY
        trigger: "POST /recycle-routes/spill-incidents/{spillId}/close"
        actor: EHSOfficer
        preconditions:
          - "SpillIncident in REMEDIATED (ERR_SPILL_NOT_REMEDIATED)"
          - "liability_cents > 0 (ERR_SPILL_NO_LIABILITY)"
        side_effects:
          - "If responsible_party == CUSTOMER or SHARED: Customer.outstanding_charge_cents += customer share of liability_cents"
          - "If responsible_party == COMPANY: no customer debit"

      - from: REMEDIATED
        to: CLOSED_NO_ACTION
        trigger: "POST /recycle-routes/spill-incidents/{spillId}/close"
        actor: EHSOfficer
        preconditions:
          - "SpillIncident in REMEDIATED (ERR_SPILL_NOT_REMEDIATED)"
          - "liability_cents == 0 (ERR_SPILL_HAS_LIABILITY)"
        side_effects: []

# =============================================================================
# §1.2.1 Concurrency Rules (OCC only)
# =============================================================================
concurrency_rules:
  - rule_id: route-stop-create-stale-route
    parent_entity: Route
    write_endpoint: "POST /recycle-routes/routes/{routeId}/route-stops"
    occ_field: "expected_route_version"
    description: |
      Creating a RouteStop on a Route whose version has advanced since the
      client last observed it is rejected. This captures the case where another
      planner has just added or removed stops (each of which bumps Route.version)
      and the current writer's view of capacity and sequence allocation is
      therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: ticket-settle-stale-customer
    parent_entity: Customer
    write_endpoint: "POST /recycle-routes/pickup-tickets/{ticketId}/settle"
    occ_field: "expected_customer_version"
    description: |
      Settling a PickupTicket whose Customer's version has advanced since the
      clerk last observed it is rejected. Another settlement or top-up against
      the same Customer has just changed prepaid_balance_cents /
      outstanding_charge_cents; settling against a stale snapshot could drive
      prepaid_balance_cents negative or double-post a charge.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: settlement_amount
    description: "Signed net cents credited to customer (positive) or charged to customer (negative) for a completed pickup"
    trigger: "PickupTicket creation (PROVISIONAL) and again on /adjust"
    algorithm: tiered_pricing
    formula: |
      # Inputs
      V   = PickupTicket.metered_volume_gallons
      P   = market_price_cents_per_gal(Customer.market_zone, Tank.tank_kind, route.scheduled_date)
            # signed: positive = we pay customer, negative = customer pays us
      # 1. Base amount (rounded per line item THEN summed — see rounding order)
      gross_cents = abs(P) * V                        # integer math, exact
      # 2. Halogen surcharge — tiered on Customer.halogen_violation_count
      H = Customer.halogen_violation_count            # at time of screen, frozen onto ticket
      if H == 0: surcharge_cents = 0
      elif H <= 2: surcharge_cents = 500              # $5 flat
      elif H <= 4: surcharge_cents = 1500             # $15
      else:        surcharge_cents = 1500 + 250*(H-4) # $15 + $2.50 per prior violation beyond 4
      # 3. Density fee — applied when metered < zone minimum and no override
      zone_min = ZONE_MINIMUM_GALLONS[TankSite.density_zone]
      if V >= zone_min OR TankSite.route_eligibility_override:
        density_fee_cents = 0
      else:
        density_fee_cents = (zone_min - V) * DENSITY_FEE_CENTS_PER_GAL[TankSite.density_zone]
      # 4. Net signed amount (evaluation order pinned: compute gross, surcharge, fee, then sign)
      if P > 0:    net_amount_cents = +gross_cents - surcharge_cents - density_fee_cents
      elif P < 0:  net_amount_cents = -(gross_cents + surcharge_cents + density_fee_cents)
      else:        net_amount_cents = 0               # P == 0 => ZERO_NET
      # 5. Settlement direction derived
      if net_amount_cents > 0: settlement_direction = PAY_CUSTOMER
      elif net_amount_cents < 0: settlement_direction = CHARGE_CUSTOMER
      else: settlement_direction = ZERO_NET
    input_set: "RouteStop.status == COMPLETED at moment of PickupTicket creation; market price snapshot from MarketPrice table pinned at route.scheduled_date; halogen count frozen at screen time"
    constants:
      ZONE_MINIMUM_GALLONS: { URBAN: 50, SUBURBAN: 100, RURAL: 150 }
      DENSITY_FEE_CENTS_PER_GAL: { URBAN: 20, SUBURBAN: 15, RURAL: 10 }
      SURCHARGE_TIER_1_MAX: 2
      SURCHARGE_TIER_2_MAX: 4
      SURCHARGE_TIER_1_CENTS: 500
      SURCHARGE_TIER_2_CENTS: 1500
      SURCHARGE_TIER_3_PER_VIOLATION_CENTS: 250
    precision: "integer cents; no fractional cents allowed; per-line-then-sum rounding order is pinned"
    variants:
      - name: provisional
        when: "PickupTicket creation; uses route.scheduled_date market price snapshot"
        difference: "Stores commodity_price_cents_per_gal as-of route.scheduled_date; net_amount_cents is provisional until settle"
      - name: adjusted
        when: "POST /pickup-tickets/{id}/adjust after dispute"
        difference: "Recomputes using corrected metered_volume_gallons OR a different scheduled_date price if the dispute changes the service date attribution; posts only the DELTA to Customer balance"

  - name: market_price_lookup
    description: "Commodity price (cents/gal) for the tank_kind on a given date in a market zone; signed: positive pays customer, negative charges customer"
    trigger: "Called by settlement_amount during PickupTicket create / adjust"
    algorithm: threshold
    formula: |
      # Price table seeded by MarketPrice admin endpoint; keyed (zone, kind, date).
      # If no exact date entry: use most recent entry with effective_date <= scheduled_date
      # (backward-looking; never use a future-dated price).
      # If no entry at all: ERR_PRICE_NOT_PUBLISHED.
      # Sign convention:
      #   USED_OIL     : always non-negative (we pay generator)
      #   ANTIFREEZE   : signed; positive when recycled glycol price is high, negative when disposal cost dominates
      #   MIXED        : blended signed value = round_half_up( (used_oil_price*X + antifreeze_price*(100-X)) / 100 ) where X is the tank's declared oil share percent (default 50)
      # Boundary: if scheduled_date == effective_date exactly, that entry IS used (inclusive lower bound).
    input_set: "MarketPrice rows with effective_date <= route.scheduled_date, latest first; never future-dated rows"
    constants:
      DEFAULT_MIXED_OIL_SHARE_PCT: 50
    precision: "integer cents per gallon; no fractions"

  - name: blend_batch_yield
    description: "Output gallons and resale revenue for a BlendBatch given its feedstock"
    trigger: "POST /blend-batches/{id}/start-blending"
    algorithm: combinatorial_formula
    formula: |
      # Inputs
      T = BlendBatch.target_product
      tickets = [PickupTicket for id in input_pickup_ticket_ids]
      V_in = sum(t.metered_volume_gallons for t in tickets)             # >= 1 required
      # Weighted average halogen history across feedstock — drives yield penalty
      avg_H = round_half_up( sum(t.frozen_halogen_count * t.metered_volume_gallons for t in tickets) / V_in )
      # Base yield by target
      base_pct = BASE_YIELD_PCT[T]                                      # e.g., RE_REFINED_BASE_OIL=72
      # Penalty: -2 pct per avg halogen violation above tier-2, capped at -20 pct
      penalty_pct = min(20, max(0, 2 * (avg_H - 4)))
      # Mix penalty: if feedstock mixes USED_OIL and ANTIFREEZE, -5 pct
      kinds = set(t.tank_kind for t in tickets)
      if len(kinds) > 1: mix_penalty = 5
      else: mix_penalty = 0
      yield_pct = max(0, base_pct - penalty_pct - mix_penalty)
      # Output (round half up)
      output_gallons = round_half_up(V_in * yield_pct / 100)
      gross_resale_revenue_cents = output_gallons * resale_price_cents_per_gal
    input_set: "PickupTicket with payment_status == SETTLED; not consumed by another active BlendBatch"
    constants:
      BASE_YIELD_PCT: { RE_REFINED_BASE_OIL: 72, RECYCLED_ANTIFREEZE: 85, FUEL_BLENDING_STOCK: 60 }
      HALOGEN_PENALTY_PER_VIOLATION_PCT: 2
      HALOGEN_PENALTY_CAP_PCT: 20
      MIX_PENALTY_PCT: 5
    precision: "yield_pct is whole percent; output_gallons is whole gallons rounded half-up"
    variants:
      - name: planned_estimate
        when: "POST /blend-batches (PLANNED creation) — provides what-if projection stored on the batch as planned_output_gallons"
        difference: "Computes output using avg_H = 0 (optimistic — assumes clean feedstock) AND no mix_penalty; result is informational only, never posted to inventory"
      - name: actual
        when: "POST /blend-batches/{id}/start-blending — uses actual frozen_halogen_count of each consumed ticket and the actual mix"
        difference: "Applies the real halogen and mix penalties; overwrites output_gallons and gross_resale_revenue_cents; almost always <= planned_estimate"

  - name: spill_liability
    description: "Environmental liability cents and responsible-party attribution for a SpillIncident"
    trigger: "POST /spill-incidents/{id}/remediate"
    algorithm: combinatorial_formula
    formula: |
      # Base rate: $8.50 per gallon spilled
      base_cents = 850 * gallons_spilled
      # Multiplier by cause_code
      multiplier = { EQUIPMENT_FAILURE: 1.5, CUSTOMER_OVERFILL: 1.0, DRIVER_ERROR: 2.0, THIRD_PARTY: 0.5, UNKNOWN: 1.0 }[cause_code]
      raw_liability = round_half_up(base_cents * multiplier)
      # Responsible party derivation — order matters
      if cause_code == CUSTOMER_OVERFILL:
        responsible_party = CUSTOMER
      elif cause_code == DRIVER_ERROR:
        responsible_party = COMPANY
      elif cause_code == EQUIPMENT_FAILURE:
        # Company-owned tanks are our liability; customer-owned tanks are theirs
        responsible_party = COMPANY if Tank.ownership == COMPANY_OWNED else CUSTOMER
      elif cause_code == THIRD_PARTY:
        responsible_party = COMPANY  # company absorbs third-party risk on route
      else:  # UNKNOWN
        responsible_party = SHARED
      # Split for SHARED
      if responsible_party == SHARED:
        liability_cents = raw_liability
        # Customer is charged half (rounded half up)
        customer_share_cents = round_half_up(raw_liability / 2)
      else:
        liability_cents = raw_liability
        customer_share_cents = liability_cents if responsible_party == CUSTOMER else 0
      # RQ override: if reportable_quantity_exceeded, add $500 flat regulatory fee (regardless of party)
      if reportable_quantity_exceeded:
        liability_cents += 50000
    input_set: "SpillIncident fields at time of /remediate"
    constants:
      BASE_RATE_CENTS_PER_GAL: 850
      RQ_THRESHOLD_GALLONS: 25
      RQ_FLAT_FEE_CENTS: 50000
    precision: "integer cents; round_half_up after multiplier"

  - name: route_posture
    description: "Derived Route.posture — drives whether new stops can be added"
    trigger: "On every RouteStop completion / cancellation / capacity change"
    algorithm: aggregation
    formula: |
      if Route.status == COMPLETE or CANCELLED: posture = CLOSED_OUT
      elif Route.loaded_gallons >= Route.vehicle_capacity_gallons: posture = AT_CAPACITY
      else: posture = OPEN
    input_set: "All RouteStop rows for route; Route.loaded_gallons is maintained incrementally"
    constants: {}
    precision: "equality vs >= boundary: AT_CAPACITY when loaded >= capacity (>= inclusive)"

  - name: density_zone_minimum
    description: "Minimum-pickup threshold per zone; used by skip-below-minimum and density_fee logic"
    trigger: "PickupTicket create and skip-below-minimum endpoints"
    algorithm: threshold
    formula: |
      zone_min = ZONE_MINIMUM_GALLONS[TankSite.density_zone]
      # Boundary: V == zone_min counts as meeting the minimum (no fee, no skip allowed).
      # V == zone_min - 1 triggers fee or skip.
      # V == 0 must use skip-below-minimum (pickup-ticket create requires > 0).
    input_set: "TankSite.density_zone; TankSite.route_eligibility_override"
    constants:
      ZONE_MINIMUM_GALLONS: { URBAN: 50, SUBURBAN: 100, RURAL: 150 }
    precision: "integer gallons; >= inclusive boundary"

  - name: facility_scheduled_gallons
    description: "DisposalFacility.scheduled_gallons_today — drives manifest submit capacity gate"
    trigger: "Manifest submit / close / facility-reject"
    algorithm: aggregation
    formula: |
      # Sum of total_gallons_manifested across all Manifest with:
      #   status IN (SUBMITTED, IN_TRANSIT, AMENDMENT_PENDING)
      #   AND Manifest.route.scheduled_date == CURRENT_DATE (server local date)
      # Increments on submit; decrements on close or facility-reject; unchanged on amend (already counted)
    input_set: "Manifest rows filtered as above"
    constants: {}
    precision: "integer gallons"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and well-formed"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: "all"

  - priority: 2
    category: auth
    check: "Role permitted to invoke this endpoint per RBAC matrix"
    error_id: ERR_INSUFFICIENT_PERMISSIONS
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "All path parameters resolve to existing resources, validated left-to-right"
    error_id: "ERR_{RESOURCE}_NOT_FOUND"
    http_status: 404
    applies_to: "all nested endpoints"

  - priority: 4
    category: existence
    check: "Foreign-key references in request body resolve to existing resources"
    error_id: "ERR_{RESOURCE}_NOT_FOUND"
    http_status: 404
    applies_to: "endpoints accepting FK in body (route-stops, pickup-tickets, manifests, blend-batches, spill-incidents)"

  - priority: 5
    category: state
    check: "Target resource in correct state for the requested transition"
    error_id: "ERR_*_NOT_* (state-specific)"
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 6
    category: state
    check: "OCC expected_<parent>_version matches parent's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /routes/{id}/route-stops; POST /pickup-tickets/{id}/settle"

  - priority: 7
    category: business_safety
    check: "Tank not quarantined and site not contaminated before arrival/screening"
    error_id: ERR_TANK_QUARANTINED
    http_status: 409
    applies_to: "POST /route-stops/{id}/arrive; POST /route-stops/{id}/begin-screening"

  - priority: 8
    category: business_safety
    check: "Driver hazmat endorsement when route serves any MIXED tank"
    error_id: ERR_DRIVER_NO_HAZMAT
    http_status: 403
    applies_to: "POST /routes/{id}/dispatch"

  - priority: 9
    category: business_safety
    check: "Halogen result routes stop to CANCELLED_HALOGEN; water/pH result returns stop to SCHEDULED"
    error_id: ERR_SCREEN_FAILED
    http_status: 422
    applies_to: "POST /sample-screenings (when attempting to record PASS on a failing sample; or vice versa)"

  - priority: 10
    category: business_constraint
    check: "RouteStop sequence unique within route; scheduled_window_end > scheduled_window_start"
    error_id: ERR_INVALID_STOP_WINDOW
    http_status: 400
    applies_to: "POST /routes/{id}/route-stops"

  - priority: 11
    category: business_constraint
    check: "Metered volume does not exceed tank's current_volume_gallons"
    error_id: ERR_VOLUME_EXCEEDS_TANK_LEVEL
    http_status: 422
    applies_to: "POST /route-stops/{id}/pickup-tickets"

  - priority: 12
    category: business_constraint
    check: "Route.loaded_gallons + metered <= vehicle_capacity_gallons"
    error_id: ERR_ROUTE_CAPACITY_EXCEEDED
    http_status: 422
    applies_to: "POST /route-stops/{id}/pickup-tickets"

  - priority: 13
    category: business_constraint
    check: "Zero-metered pickup is rejected; use skip-below-minimum instead"
    error_id: ERR_ZERO_VOLUME_PICKUP
    http_status: 400
    applies_to: "POST /route-stops/{id}/pickup-tickets"

  - priority: 14
    category: business_referential
    check: "Manifest submit: facility ACTIVE, has capacity, accepts stream (incl. halogen_flag)"
    error_id: "ERR_FACILITY_SUSPENDED | ERR_FACILITY_CAPACITY_EXCEEDED | ERR_FACILITY_REJECTS_HALOGENATED"
    http_status: 409
    applies_to: "POST /manifests/{id}/submit"

  - priority: 15
    category: business_referential
    check: "BlendBatch inputs: all tickets SETTLED and not consumed"
    error_id: "ERR_TICKET_NOT_SETTLED | ERR_TICKET_ALREADY_CONSUMED"
    http_status: 409
    applies_to: "POST /blend-batches/{id}/start-blending"

  - priority: 16
    category: business_fiscal
    check: "PREPAY customer balance cannot go negative at settle"
    error_id: ERR_INSUFFICIENT_PREPAID_BALANCE
    http_status: 402
    applies_to: "POST /pickup-tickets/{id}/settle"

  - priority: 17
    category: business_fiscal
    check: "Customer outstanding/prepaid balances zero before terminate or reinstate"
    error_id: "ERR_OUTSTANDING_BALANCE | ERR_UNRETURNED_PREPAID_BALANCE"
    http_status: 402
    applies_to: "POST /customers/{id}/terminate; POST /customers/{id}/reinstate"

  - priority: 18
    category: business_temporal
    check: "Market price exists with effective_date <= scheduled_date for the (zone, kind) pair"
    error_id: ERR_PRICE_NOT_PUBLISHED
    http_status: 422
    applies_to: "POST /route-stops/{id}/pickup-tickets"

  - priority: 19
    category: business_temporal
    check: "Manifest.scheduled_date (via Route) not in the past at submit time"
    error_id: ERR_MANIFEST_SCHEDULED_DATE_PAST
    http_status: 422
    applies_to: "POST /manifests/{id}/submit"

  - priority: 20
    category: business_constraint
    check: "Idempotency: client_request_id unique per RouteStop"
    error_id: ERR_DUPLICATE_CLIENT_REQUEST
    http_status: 409
    applies_to: "POST /route-stops/{id}/pickup-tickets"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Customer ---
  - method: POST
    path: "/recycle-routes/customers"
    description: "Create a customer in PROSPECT status"
    roles: [RoutePlanner]
    code: 201
    input: [legal_name, epa_generator_id, market_zone, credit_terms]
    output: Customer
    side_effects:
      - "status = PROSPECT; prepaid_balance_cents = 0; outstanding_charge_cents = 0; halogen_violation_count = 0"

  - method: GET
    path: "/recycle-routes/customers"
    description: "List customers"
    roles: [RoutePlanner, SettlementClerk, EHSOfficer, Regulator]
    code: 200
    input: ["limit?", "offset?", "status?", "market_zone?"]
    output: "Customer[]"
    side_effects: []

  - method: GET
    path: "/recycle-routes/customers/{customerId}"
    description: "Get one customer"
    roles: [RoutePlanner, SettlementClerk, EHSOfficer, Regulator]
    code: 200
    input: []
    output: Customer
    side_effects: []

  - method: POST
    path: "/recycle-routes/customers/{customerId}/activate"
    description: "Activate a PROSPECT customer"
    roles: [RoutePlanner]
    code: 200
    input: []
    output: Customer
    side_effects: ["status = ACTIVE"]

  - method: POST
    path: "/recycle-routes/customers/{customerId}/suspend"
    description: "Suspend an ACTIVE customer (cascades)"
    roles: [RoutePlanner]
    code: 200
    input: []
    output: Customer
    side_effects:
      - "status = SUSPENDED; TankSite cascade; future RouteStop cascade"

  - method: POST
    path: "/recycle-routes/customers/{customerId}/reinstate"
    description: "Reinstate a SUSPENDED customer"
    roles: [RoutePlanner]
    code: 200
    input: []
    output: Customer
    side_effects: ["status = ACTIVE; TankSite reverse cascade"]

  - method: POST
    path: "/recycle-routes/customers/{customerId}/terminate"
    description: "Terminate an ACTIVE customer"
    roles: [RoutePlanner]
    code: 200
    input: []
    output: Customer
    side_effects: ["status = TERMINATED; TankSite INACTIVE; Tank DECOMMISSION_PENDING; RouteStop cascade"]

  - method: POST
    path: "/recycle-routes/customers/{customerId}/top-up"
    description: "Add prepaid balance to a customer (SettlementClerk)"
    roles: [SettlementClerk]
    code: 200
    input: [amount_cents]
    output: Customer
    side_effects: ["prepaid_balance_cents += amount_cents"]

  - method: GET
    path: "/recycle-routes/customers/{customerId}/tank-sites"
    description: "List TankSites for a customer (FK reverse reachability)"
    roles: [RoutePlanner, SettlementClerk, EHSOfficer, Regulator, TankInstaller, Driver]
    code: 200
    input: ["limit?", "offset?"]
    output: "TankSite[]"
    side_effects: []

  # --- TankSite ---
  - method: POST
    path: "/recycle-routes/tank-sites"
    description: "Create a TankSite under a Customer"
    roles: [RoutePlanner]
    code: 201
    input: [customer_id, site_address, density_zone, "route_eligibility_override?"]
    output: TankSite
    side_effects: ["status = ACTIVE"]

  - method: GET
    path: "/recycle-routes/tank-sites"
    description: "List TankSites (filtered list form)"
    roles: [RoutePlanner, SettlementClerk, EHSOfficer, Regulator, TankInstaller, Driver]
    code: 200
    input: ["limit?", "offset?", "customer_id?", "status?"]
    output: "TankSite[]"
    side_effects: []

  - method: GET
    path: "/recycle-routes/tank-sites/{tankSiteId}"
    description: "Get one TankSite"
    roles: [RoutePlanner, SettlementClerk, EHSOfficer, Regulator, TankInstaller, Driver]
    code: 200
    input: []
    output: TankSite
    side_effects: []

  - method: POST
    path: "/recycle-routes/tank-sites/{tankSiteId}/activate"
    description: "Activate an INACTIVE TankSite"
    roles: [RoutePlanner]
    code: 200
    input: []
    output: TankSite
    side_effects: ["status = ACTIVE"]

  - method: POST
    path: "/recycle-routes/tank-sites/{tankSiteId}/deactivate"
    description: "Deactivate an ACTIVE TankSite"
    roles: [RoutePlanner]
    code: 200
    input: []
    output: TankSite
    side_effects: ["status = INACTIVE"]

  - method: POST
    path: "/recycle-routes/tank-sites/{tankSiteId}/certify-clean"
    description: "Certify a CONTAMINATED site clean (EHS only)"
    roles: [EHSOfficer]
    code: 200
    input: []
    output: TankSite
    side_effects: ["status = ACTIVE; Tank quarantine cleared"]

  - method: GET
    path: "/recycle-routes/tank-sites/{tankSiteId}/tanks"
    description: "List Tanks at a site (FK reverse reachability)"
    roles: [RoutePlanner, SettlementClerk, EHSOfficer, Regulator, TankInstaller, Driver]
    code: 200
    input: ["limit?", "offset?"]
    output: "Tank[]"
    side_effects: []

  # --- Tank ---
  - method: POST
    path: "/recycle-routes/tanks"
    description: "Create a Tank at a TankSite (PENDING_INSTALL)"
    roles: [TankInstaller]
    code: 201
    input: [tank_site_id, tank_kind, capacity_gallons, ownership]
    output: Tank
    side_effects: ["ownership_status = PENDING_INSTALL; quarantine_status = CLEAR; current_volume_gallons = 0"]

  - method: GET
    path: "/recycle-routes/tanks"
    description: "List Tanks (filtered)"
    roles: [RoutePlanner, SettlementClerk, EHSOfficer, Regulator, TankInstaller, Driver]
    code: 200
    input: ["limit?", "offset?", "tank_site_id?", "ownership_status?", "quarantine_status?"]
    output: "Tank[]"
    side_effects: []

  - method: GET
    path: "/recycle-routes/tanks/{tankId}"
    description: "Get one Tank"
    roles: [RoutePlanner, SettlementClerk, EHSOfficer, Regulator, TankInstaller, Driver]
    code: 200
    input: []
    output: Tank
    side_effects: []

  - method: POST
    path: "/recycle-routes/tanks/{tankId}/install"
    description: "Mark a COMPANY_OWNED tank installed"
    roles: [TankInstaller]
    code: 200
    input: []
    output: Tank
    side_effects: ["ownership_status = INSTALLED; installed_at set"]

  - method: POST
    path: "/recycle-routes/tanks/{tankId}/register-existing"
    description: "Mark a CUSTOMER_OWNED tank installed via existing-inventory path"
    roles: [TankInstaller]
    code: 200
    input: []
    output: Tank
    side_effects: ["ownership_status = INSTALLED; installed_at set"]

  - method: POST
    path: "/recycle-routes/tanks/{tankId}/decommission"
    description: "Begin decommissioning (requires empty tank)"
    roles: [TankInstaller]
    code: 200
    input: []
    output: Tank
    side_effects: ["ownership_status = DECOMMISSION_PENDING"]

  - method: POST
    path: "/recycle-routes/tanks/{tankId}/decommission-confirm"
    description: "Confirm decommissioning"
    roles: [TankInstaller]
    code: 200
    input: []
    output: Tank
    side_effects: ["ownership_status = DECOMMISSIONED"]

  - method: POST
    path: "/recycle-routes/tanks/{tankId}/clear-quarantine"
    description: "Clear quarantine (EHS)"
    roles: [EHSOfficer]
    code: 200
    input: []
    output: Tank
    side_effects: ["quarantine_status = CLEAR"]

  - method: POST
    path: "/recycle-routes/tanks/{tankId}/record-intake"
    description: "Add volume to a tank (customer fill event; e.g. a shop drains a vehicle into the tank)"
    roles: [Driver, RoutePlanner]
    code: 200
    input: [gallons]
    output: Tank
    side_effects: ["current_volume_gallons += gallons; capped at capacity_gallons (ERR_TANK_OVERFLOW)"]

  # --- Driver ---
  - method: POST
    path: "/recycle-routes/drivers"
    description: "Register a driver"
    roles: [RoutePlanner]
    code: 201
    input: [driver_name, cdl_class, hazmat_endorsement]
    output: Driver
    side_effects: ["status = ACTIVE"]

  - method: GET
    path: "/recycle-routes/drivers"
    description: "List drivers"
    roles: [RoutePlanner, EHSOfficer]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: "Driver[]"
    side_effects: []

  - method: GET
    path: "/recycle-routes/drivers/{driverId}"
    description: "Get one driver"
    roles: [RoutePlanner, EHSOfficer, Driver]
    code: 200
    input: []
    output: Driver
    side_effects: []

  - method: POST
    path: "/recycle-routes/drivers/{driverId}/suspend"
    description: "Suspend a driver"
    roles: [RoutePlanner]
    code: 200
    input: []
    output: Driver
    side_effects: ["status = SUSPENDED"]

  # --- Route ---
  - method: POST
    path: "/recycle-routes/routes"
    description: "Create a route"
    roles: [RoutePlanner]
    code: 201
    input: [route_code, scheduled_date, driver_id, vehicle_capacity_gallons, density_zone]
    output: Route
    side_effects: ["status = PLANNED; posture = OPEN; loaded_gallons = 0"]

  - method: GET
    path: "/recycle-routes/routes"
    description: "List routes"
    roles: [RoutePlanner, SettlementClerk, EHSOfficer, Regulator, Driver]
    code: 200
    input: ["limit?", "offset?", "status?", "scheduled_date?", "driver_id?"]
    output: "Route[]"
    side_effects: []

  - method: GET
    path: "/recycle-routes/routes/{routeId}"
    description: "Get one route"
    roles: [RoutePlanner, SettlementClerk, EHSOfficer, Regulator, Driver]
    code: 200
    input: []
    output: Route
    side_effects: []

  - method: POST
    path: "/recycle-routes/routes/{routeId}/dispatch"
    description: "Dispatch a PLANNED route"
    roles: [RoutePlanner]
    code: 200
    input: []
    output: Route
    side_effects: ["status = DISPATCHED"]

  - method: POST
    path: "/recycle-routes/routes/{routeId}/complete"
    description: "Mark route COMPLETE"
    roles: [RoutePlanner]
    code: 200
    input: []
    output: Route
    side_effects: ["status = COMPLETE; posture = CLOSED_OUT"]

  - method: POST
    path: "/recycle-routes/routes/{routeId}/cancel"
    description: "Cancel route"
    roles: [RoutePlanner]
    code: 200
    input: []
    output: Route
    side_effects: ["status = CANCELLED; RouteStop cascade"]

  - method: GET
    path: "/recycle-routes/routes/{routeId}/route-stops"
    description: "List stops on a route (FK reverse reachability)"
    roles: [RoutePlanner, SettlementClerk, EHSOfficer, Regulator, Driver]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: "RouteStop[]"
    side_effects: []

  - method: GET
    path: "/recycle-routes/routes/{routeId}/manifest"
    description: "Get the manifest for a route (1:1; reverse reachability)"
    roles: [RoutePlanner, SettlementClerk, EHSOfficer, Regulator, Driver]
    code: 200
    input: []
    output: "Manifest[]"
    side_effects: []

  # --- RouteStop ---
  - method: POST
    path: "/recycle-routes/routes/{routeId}/route-stops"
    description: "Add a stop to a route (OCC on Route.version)"
    roles: [RoutePlanner]
    code: 201
    input: [tank_site_id, tank_id, scheduled_window_start, scheduled_window_end, sequence, estimated_volume_gallons, expected_route_version]
    output: RouteStop
    side_effects: ["Route.version incremented; RouteStop.status = SCHEDULED"]

  - method: GET
    path: "/recycle-routes/route-stops/{routeStopId}"
    description: "Get one stop"
    roles: [RoutePlanner, SettlementClerk, EHSOfficer, Regulator, Driver]
    code: 200
    input: []
    output: RouteStop
    side_effects: []

  - method: GET
    path: "/recycle-routes/route-stops"
    description: "List RouteStops (filtered by route_id, tank_site_id, tank_id, status)"
    roles: [RoutePlanner, SettlementClerk, EHSOfficer, Regulator, Driver]
    code: 200
    input: ["limit?", "offset?", "route_id?", "tank_site_id?", "tank_id?", "status?"]
    output: "RouteStop[]"
    side_effects: []

  - method: POST
    path: "/recycle-routes/route-stops/{routeStopId}/arrive"
    description: "Driver arrives; SCHEDULED → EN_ROUTE"
    roles: [Driver]
    code: 200
    input: []
    output: RouteStop
    side_effects: ["Route may transition DISPATCHED → IN_PROGRESS"]

  - method: POST
    path: "/recycle-routes/route-stops/{routeStopId}/begin-screening"
    description: "Begin screening; EN_ROUTE → SCREENING"
    roles: [Driver]
    code: 200
    input: []
    output: RouteStop
    side_effects: []

  - method: POST
    path: "/recycle-routes/route-stops/{routeStopId}/cancel-by-customer"
    description: "Customer cancels stop"
    roles: [RoutePlanner]
    code: 200
    input: []
    output: RouteStop
    side_effects: ["status = CANCELLED_CUSTOMER"]

  - method: POST
    path: "/recycle-routes/route-stops/{routeStopId}/skip-below-minimum"
    description: "Driver skips stop because volume below zone minimum"
    roles: [Driver]
    code: 200
    input: [client_request_id]
    output: PickupTicket
    side_effects:
      - "RouteStop.status = SKIPPED_BELOW_MINIMUM"
      - "Zero-volume PickupTicket created (metered_volume_gallons=0 is permitted ONLY via this endpoint) with density_fee_cents posted"

  - method: GET
    path: "/recycle-routes/route-stops/{routeStopId}/sample-screenings"
    description: "List screenings for a stop (FK reverse reachability)"
    roles: [RoutePlanner, LabTech, EHSOfficer, Regulator, Driver]
    code: 200
    input: ["limit?", "offset?"]
    output: "SampleScreening[]"
    side_effects: []

  - method: GET
    path: "/recycle-routes/route-stops/{routeStopId}/pickup-tickets"
    description: "List pickup tickets for a stop (FK reverse reachability)"
    roles: [RoutePlanner, SettlementClerk, EHSOfficer, Regulator, Driver]
    code: 200
    input: ["limit?", "offset?"]
    output: "PickupTicket[]"
    side_effects: []

  # --- SampleScreening ---
  - method: POST
    path: "/recycle-routes/route-stops/{routeStopId}/sample-screenings"
    description: "Record a sample screening (LabTech only). Result is computed from thresholds vs Tank.tank_kind."
    roles: [LabTech]
    code: 201
    input: [halogen_ppm, water_pct, ph_level]
    output: SampleScreening
    side_effects:
      - "Compute result from thresholds (PASS | FAIL_HALOGEN | FAIL_WATER | FAIL_PH)"
      - "FAIL_HALOGEN → Tank quarantined; RouteStop → CANCELLED_HALOGEN; Customer.halogen_violation_count += 1"
      - "FAIL_WATER | FAIL_PH → RouteStop returns to SCHEDULED"
      - "PASS → RouteStop → READY_TO_PUMP"

  - method: GET
    path: "/recycle-routes/sample-screenings/{screeningId}"
    description: "Get one screening"
    roles: [RoutePlanner, LabTech, EHSOfficer, Regulator]
    code: 200
    input: []
    output: SampleScreening
    side_effects: []

  - method: GET
    path: "/recycle-routes/sample-screenings"
    description: "List SampleScreenings (filtered by route_stop_id, result)"
    roles: [RoutePlanner, LabTech, EHSOfficer, Regulator]
    code: 200
    input: ["limit?", "offset?", "route_stop_id?", "result?"]
    output: "SampleScreening[]"
    side_effects: []

  # --- PickupTicket ---
  - method: POST
    path: "/recycle-routes/route-stops/{routeStopId}/pickup-tickets"
    description: "Driver records metered pickup (idempotent via client_request_id)"
    roles: [Driver]
    code: 201
    input: [client_request_id, metered_volume_gallons]
    output: PickupTicket
    side_effects:
      - "Calculate commodity_price_cents_per_gal, gross/surcharge/density_fee/net"
      - "RouteStop.status → COMPLETED"
      - "Tank.current_volume_gallons -= metered; Route.loaded_gallons += metered"
      - "Manifest.total_gallons_manifested += metered (if manifest exists)"

  - method: GET
    path: "/recycle-routes/pickup-tickets/{ticketId}"
    description: "Get one ticket"
    roles: [RoutePlanner, SettlementClerk, EHSOfficer, Regulator, Driver]
    code: 200
    input: []
    output: PickupTicket
    side_effects: []

  - method: GET
    path: "/recycle-routes/pickup-tickets"
    description: "List pickup tickets (filtered)"
    roles: [RoutePlanner, SettlementClerk, EHSOfficer, Regulator]
    code: 200
    input: ["limit?", "offset?", "payment_status?", "route_stop_id?"]
    output: "PickupTicket[]"
    side_effects: []

  - method: POST
    path: "/recycle-routes/pickup-tickets/{ticketId}/settle"
    description: "Settle a PROVISIONAL ticket (OCC on Customer.version)"
    roles: [SettlementClerk]
    code: 200
    input: [expected_customer_version]
    output: PickupTicket
    side_effects: ["Apply net to Customer balance; payment_status = SETTLED; Customer.version incremented"]

  - method: POST
    path: "/recycle-routes/pickup-tickets/{ticketId}/dispute"
    description: "Mark ticket DISPUTED"
    roles: [SettlementClerk]
    code: 200
    input: []
    output: PickupTicket
    side_effects: ["payment_status = DISPUTED"]

  - method: POST
    path: "/recycle-routes/pickup-tickets/{ticketId}/adjust"
    description: "Adjust a DISPUTED ticket; recompute and post delta"
    roles: [SettlementClerk]
    code: 200
    input: [corrected_metered_volume_gallons, "override_price_cents_per_gal?"]
    output: PickupTicket
    side_effects: ["Recompute net; post DELTA to Customer; payment_status = ADJUSTED"]

  # --- DisposalFacility ---
  - method: POST
    path: "/recycle-routes/disposal-facilities"
    description: "Register a TSDF"
    roles: [Regulator]
    code: 201
    input: [facility_name, epa_id, accepted_streams, daily_capacity_gallons]
    output: DisposalFacility
    side_effects: ["status = ACTIVE; scheduled_gallons_today = 0"]

  - method: GET
    path: "/recycle-routes/disposal-facilities"
    description: "List facilities"
    roles: [RoutePlanner, Regulator, EHSOfficer]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: "DisposalFacility[]"
    side_effects: []

  - method: GET
    path: "/recycle-routes/disposal-facilities/{facilityId}"
    description: "Get one facility"
    roles: [RoutePlanner, Regulator, EHSOfficer]
    code: 200
    input: []
    output: DisposalFacility
    side_effects: []

  # --- Manifest ---
  - method: POST
    path: "/recycle-routes/routes/{routeId}/manifest"
    description: "Create a DRAFT manifest for a route (1:1)"
    roles: [RoutePlanner]
    code: 201
    input: [manifest_tracking_number, disposal_facility_id]
    output: Manifest
    side_effects: ["status = DRAFT; total_gallons_manifested = 0; halogen_flag = false"]

  - method: GET
    path: "/recycle-routes/manifests/{manifestId}"
    description: "Get one manifest"
    roles: [RoutePlanner, SettlementClerk, EHSOfficer, Regulator, Driver]
    code: 200
    input: []
    output: Manifest
    side_effects: []

  - method: GET
    path: "/recycle-routes/manifests"
    description: "List manifests (filtered)"
    roles: [RoutePlanner, SettlementClerk, EHSOfficer, Regulator, Driver]
    code: 200
    input: ["limit?", "offset?", "status?", "disposal_facility_id?", "route_id?"]
    output: "Manifest[]"
    side_effects: []

  - method: POST
    path: "/recycle-routes/manifests/{manifestId}/submit"
    description: "Submit DRAFT or AMENDED manifest to facility"
    roles: [RoutePlanner]
    code: 200
    input: []
    output: Manifest
    side_effects: ["status = SUBMITTED; DisposalFacility.scheduled_gallons_today += total"]

  - method: POST
    path: "/recycle-routes/manifests/{manifestId}/depart"
    description: "Driver departs for facility"
    roles: [Driver]
    code: 200
    input: []
    output: Manifest
    side_effects: ["status = IN_TRANSIT"]

  - method: POST
    path: "/recycle-routes/manifests/{manifestId}/deliver"
    description: "Driver delivers at facility"
    roles: [Driver]
    code: 200
    input: []
    output: Manifest
    side_effects: ["status = DELIVERED"]

  - method: POST
    path: "/recycle-routes/manifests/{manifestId}/close"
    description: "Regulator closes the manifest"
    roles: [Regulator]
    code: 200
    input: []
    output: Manifest
    side_effects: ["status = CLOSED; DisposalFacility.scheduled_gallons_today -= total"]

  - method: POST
    path: "/recycle-routes/manifests/{manifestId}/request-amendment"
    description: "Request amendment on a DELIVERED manifest"
    roles: [RoutePlanner]
    code: 200
    input: []
    output: Manifest
    side_effects: ["status = AMENDMENT_PENDING"]

  - method: POST
    path: "/recycle-routes/manifests/{manifestId}/approve-amendment"
    description: "Regulator approves amendment"
    roles: [Regulator]
    code: 200
    input: []
    output: Manifest
    side_effects: ["status = AMENDED; total_gallons_manifested recomputed"]

  - method: POST
    path: "/recycle-routes/manifests/{manifestId}/facility-reject"
    description: "Facility rejects the manifest"
    roles: [Regulator]
    code: 200
    input: []
    output: Manifest
    side_effects: ["status = REJECTED_BY_FACILITY; DisposalFacility.scheduled_gallons_today -= total"]

  # --- BlendBatch ---
  - method: POST
    path: "/recycle-routes/blend-batches"
    description: "Create a blend batch in PLANNED"
    roles: [RoutePlanner]
    code: 201
    input: [batch_code, target_product, input_pickup_ticket_ids, resale_price_cents_per_gal]
    output: BlendBatch
    side_effects: ["status = PLANNED"]

  - method: GET
    path: "/recycle-routes/blend-batches"
    description: "List batches"
    roles: [RoutePlanner, SettlementClerk, LabTech]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: "BlendBatch[]"
    side_effects: []

  - method: GET
    path: "/recycle-routes/blend-batches/{batchId}"
    description: "Get one batch"
    roles: [RoutePlanner, SettlementClerk, LabTech]
    code: 200
    input: []
    output: BlendBatch
    side_effects: []

  - method: POST
    path: "/recycle-routes/blend-batches/{batchId}/start-blending"
    description: "Begin blending; computes yield and output"
    roles: [RoutePlanner]
    code: 200
    input: []
    output: BlendBatch
    side_effects: ["Compute input_gallons_total, yield_pct, output_gallons, gross_resale_revenue_cents; status = BLENDING"]

  - method: POST
    path: "/recycle-routes/blend-batches/{batchId}/hold"
    description: "Place batch on quality hold"
    roles: [LabTech]
    code: 200
    input: []
    output: BlendBatch
    side_effects: ["status = QUALITY_HOLD"]

  - method: POST
    path: "/recycle-routes/blend-batches/{batchId}/resume"
    description: "Resume batch from hold"
    roles: [LabTech]
    code: 200
    input: []
    output: BlendBatch
    side_effects: ["status = BLENDING"]

  - method: POST
    path: "/recycle-routes/blend-batches/{batchId}/release"
    description: "Release batch for sale"
    roles: [LabTech]
    code: 200
    input: []
    output: BlendBatch
    side_effects: ["status = RELEASED_FOR_SALE"]

  - method: POST
    path: "/recycle-routes/blend-batches/{batchId}/mark-sold"
    description: "Mark batch sold"
    roles: [SettlementClerk]
    code: 200
    input: []
    output: BlendBatch
    side_effects: ["status = SOLD"]

  - method: POST
    path: "/recycle-routes/blend-batches/{batchId}/cancel"
    description: "Cancel batch (releases tickets)"
    roles: [RoutePlanner]
    code: 200
    input: []
    output: BlendBatch
    side_effects: ["status = CANCELLED"]

  # --- SpillIncident ---
  - method: POST
    path: "/recycle-routes/spill-incidents"
    description: "Log a spill incident"
    roles: [Driver, EHSOfficer]
    code: 201
    input: [route_id, tank_site_id, gallons_spilled, cause_code]
    output: SpillIncident
    side_effects:
      - "status = OPEN"
      - "If reportable_quantity_exceeded: TankSite.status → CONTAMINATED"

  - method: GET
    path: "/recycle-routes/spill-incidents"
    description: "List spills"
    roles: [RoutePlanner, EHSOfficer, Regulator]
    code: 200
    input: ["limit?", "offset?", "status?", "tank_site_id?", "route_id?"]
    output: "SpillIncident[]"
    side_effects: []

  - method: GET
    path: "/recycle-routes/spill-incidents/{spillId}"
    description: "Get one spill"
    roles: [RoutePlanner, EHSOfficer, Regulator]
    code: 200
    input: []
    output: SpillIncident
    side_effects: []

  - method: POST
    path: "/recycle-routes/spill-incidents/{spillId}/begin-investigation"
    description: "Begin investigation"
    roles: [EHSOfficer]
    code: 200
    input: []
    output: SpillIncident
    side_effects: ["status = UNDER_INVESTIGATION"]

  - method: POST
    path: "/recycle-routes/spill-incidents/{spillId}/remediate"
    description: "Mark spill remediated; computes liability"
    roles: [EHSOfficer]
    code: 200
    input: []
    output: SpillIncident
    side_effects: ["status = REMEDIATED; compute liability_cents, responsible_party"]

  - method: POST
    path: "/recycle-routes/spill-incidents/{spillId}/close"
    description: "Close remediated spill; posts liability to customer if applicable"
    roles: [EHSOfficer]
    code: 200
    input: []
    output: SpillIncident
    side_effects:
      - "status = CLOSED_WITH_LIABILITY if liability_cents > 0 else CLOSED_NO_ACTION"
      - "If responsible_party == CUSTOMER or SHARED: Customer.outstanding_charge_cents += customer share"

  # --- MarketPrice (test-driving + business endpoint) ---
  - method: POST
    path: "/recycle-routes/market-prices"
    description: "Publish a market price for (zone, kind, effective_date) — Regulator only"
    roles: [Regulator]
    code: 201
    input: [market_zone, tank_kind, effective_date, price_cents_per_gal]
    output: MarketPrice
    side_effects: []

  - method: GET
    path: "/recycle-routes/market-prices"
    description: "List published market prices"
    roles: [RoutePlanner, SettlementClerk, Regulator, Driver]
    code: 200
    input: ["limit?", "offset?", "market_zone?", "tank_kind?", "effective_date?"]
    output: "MarketPrice[]"
    side_effects: []

  - method: GET
    path: "/recycle-routes/market-prices/{marketPriceId}"
    description: "Get one market price"
    roles: [RoutePlanner, SettlementClerk, Regulator, Driver]
    code: 200
    input: []
    output: MarketPrice
    side_effects: []

  # --- Clock (test-driving) ---
  - method: POST
    path: "/recycle-routes/_clock/set_current_utc"
    description: "Set the logical clock. Default startup time is 2026-08-01T00:00:00Z; before any set_current_utc call, the logical clock reads exactly this default and MUST NOT fall back to real wall-clock time."
    roles: [RoutePlanner]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: datetime }"
    side_effects: []

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  # --- Auth ---
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role missing or invalid" }
  - { id: ERR_INSUFFICIENT_PERMISSIONS, http: 403, condition: "Role not permitted for this endpoint" }

  # --- Generic request ---
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed request body or missing required field" }
  - { id: ERR_INVALID_ENUM, http: 400, condition: "Enum field value not in declared set" }
  - { id: ERR_INVALID_STOP_WINDOW, http: 400, condition: "scheduled_window_end <= scheduled_window_start, or sequence duplicated within route" }
  - { id: ERR_ZERO_VOLUME_PICKUP, http: 400, condition: "metered_volume_gallons == 0 on pickup-tickets create; use skip-below-minimum instead" }

  # --- Not found ---
  - { id: ERR_CUSTOMER_NOT_FOUND, http: 404, condition: "Customer id not found" }
  - { id: ERR_TANK_SITE_NOT_FOUND, http: 404, condition: "TankSite id not found" }
  - { id: ERR_TANK_NOT_FOUND, http: 404, condition: "Tank id not found" }
  - { id: ERR_DRIVER_NOT_FOUND, http: 404, condition: "Driver id not found" }
  - { id: ERR_ROUTE_NOT_FOUND, http: 404, condition: "Route id not found" }
  - { id: ERR_ROUTE_STOP_NOT_FOUND, http: 404, condition: "RouteStop id not found" }
  - { id: ERR_PICKUP_TICKET_NOT_FOUND, http: 404, condition: "PickupTicket id not found" }
  - { id: ERR_MANIFEST_NOT_FOUND, http: 404, condition: "Manifest id not found" }
  - { id: ERR_FACILITY_NOT_FOUND, http: 404, condition: "DisposalFacility id not found" }
  - { id: ERR_BLEND_BATCH_NOT_FOUND, http: 404, condition: "BlendBatch id not found" }
  - { id: ERR_SPILL_NOT_FOUND, http: 404, condition: "SpillIncident id not found" }
  - { id: ERR_SAMPLE_SCREENING_NOT_FOUND, http: 404, condition: "SampleScreening id not found" }

  # --- State ---
  - { id: ERR_CUSTOMER_NOT_PROSPECT, http: 409, condition: "Activate requires PROSPECT" }
  - { id: ERR_CUSTOMER_NOT_ACTIVE, http: 409, condition: "Operation requires ACTIVE customer" }
  - { id: ERR_CUSTOMER_NOT_SUSPENDED, http: 409, condition: "Reinstate requires SUSPENDED" }
  - { id: ERR_NO_SERVICEABLE_TANK, http: 409, condition: "Customer has no INSTALLED tank at any site" }
  - { id: ERR_SITE_NOT_ACTIVE, http: 409, condition: "TankSite not ACTIVE" }
  - { id: ERR_SITE_HAS_ACTIVE_STOPS, http: 409, condition: "TankSite has non-terminal RouteStops" }
  - { id: ERR_SITE_STILL_CONTAMINATED, http: 409, condition: "TankSite still CONTAMINATED" }
  - { id: ERR_OPEN_SPILL_EXISTS, http: 409, condition: "Open spill blocks the operation" }
  - { id: ERR_TANK_NOT_PENDING_INSTALL, http: 409, condition: "Tank not in PENDING_INSTALL" }
  - { id: ERR_TANK_NOT_COMPANY_OWNED, http: 409, condition: "Install endpoint requires COMPANY_OWNED tank" }
  - { id: ERR_TANK_NOT_CUSTOMER_OWNED, http: 409, condition: "Register-existing requires CUSTOMER_OWNED tank" }
  - { id: ERR_TANK_NOT_EMPTY, http: 409, condition: "Decommission requires current_volume_gallons == 0" }
  - { id: ERR_TANK_HAS_ACTIVE_STOPS, http: 409, condition: "Tank has non-terminal RouteStops" }
  - { id: ERR_TANK_NOT_PENDING_DECOMMISSION, http: 409, condition: "Decommission-confirm requires DECOMMISSION_PENDING" }
  - { id: ERR_TANK_NOT_QUARANTINED, http: 409, condition: "Clear-quarantine requires QUARANTINED" }
  - { id: ERR_TANK_QUARANTINED, http: 409, condition: "Tank is quarantined; arrival/screening blocked" }
  - { id: ERR_TANK_OVERFLOW, http: 409, condition: "Intake would exceed capacity_gallons" }
  - { id: ERR_DRIVER_SUSPENDED, http: 409, condition: "Driver suspended" }
  - { id: ERR_DRIVER_NO_HAZMAT, http: 403, condition: "Driver lacks hazmat endorsement required by MIXED tank on route" }
  - { id: ERR_ROUTE_NOT_PLANNED, http: 409, condition: "Dispatch requires PLANNED" }
  - { id: ERR_ROUTE_EMPTY, http: 409, condition: "Dispatch requires at least one SCHEDULED stop" }
  - { id: ERR_ROUTE_NOT_DISPATCHED, http: 409, condition: "Stop arrival requires route DISPATCHED or IN_PROGRESS" }
  - { id: ERR_ROUTE_HAS_OPEN_STOPS, http: 409, condition: "Complete requires all stops terminal" }
  - { id: ERR_ROUTE_NOT_CANCELLABLE, http: 409, condition: "Cancel requires PLANNED or DISPATCHED" }
  - { id: ERR_ROUTE_HAS_COMPLETED_STOPS, http: 409, condition: "Cancel requires zero COMPLETED stops when DISPATCHED" }
  - { id: ERR_ROUTE_HAS_SUBMITTED_MANIFEST, http: 409, condition: "Cancel blocked by SUBMITTED-or-later manifest" }
  - { id: ERR_ROUTE_NOT_READY_FOR_MANIFEST, http: 409, condition: "Manifest submit requires route IN_PROGRESS or COMPLETE" }
  - { id: ERR_ROUTE_NOT_COMPLETE, http: 409, condition: "Manifest depart requires route COMPLETE" }
  - { id: ERR_ROUTE_CAPACITY_EXCEEDED, http: 422, condition: "Pickup would exceed vehicle_capacity_gallons" }
  - { id: ERR_MANIFEST_NOT_SUBMITTED, http: 409, condition: "Route complete requires manifest submitted (when manifest exists); also used by depart" }
  - { id: ERR_STOP_NOT_SCHEDULED, http: 409, condition: "Arrive requires SCHEDULED" }
  - { id: ERR_STOP_NOT_EN_ROUTE, http: 409, condition: "Begin-screening requires EN_ROUTE" }
  - { id: ERR_STOP_NOT_SCREENING, http: 409, condition: "Screening recording requires SCREENING" }
  - { id: ERR_STOP_NOT_READY_TO_PUMP, http: 409, condition: "Pickup requires READY_TO_PUMP" }
  - { id: ERR_STOP_NOT_CANCELLABLE, http: 409, condition: "Cancel-by-customer requires SCHEDULED or EN_ROUTE" }
  - { id: ERR_STOP_NOT_COMPLETED, http: 409, condition: "Settle requires RouteStop COMPLETED" }
  - { id: ERR_SCREEN_FAILED, http: 422, condition: "Screening result does not permit the requested transition" }
  - { id: ERR_VOLUME_EXCEEDS_TANK_LEVEL, http: 422, condition: "metered_volume_gallons > tank.current_volume_gallons" }
  - { id: ERR_VOLUME_ABOVE_MINIMUM, http: 409, condition: "Skip requires current_volume < zone minimum" }
  - { id: ERR_SITE_OVERRIDE_ACTIVE, http: 409, condition: "Skip blocked: site has route_eligibility_override = true" }
  - { id: ERR_TICKET_NOT_PROVISIONAL, http: 409, condition: "Settle requires PROVISIONAL" }
  - { id: ERR_TICKET_NOT_DISPUTABLE, http: 409, condition: "Dispute requires PROVISIONAL or SETTLED" }
  - { id: ERR_TICKET_NOT_DISPUTED, http: 409, condition: "Adjust requires DISPUTED" }
  - { id: ERR_TICKET_NOT_SETTLED, http: 409, condition: "BlendBatch input requires SETTLED" }
  - { id: ERR_TICKET_ALREADY_CONSUMED, http: 409, condition: "Ticket already consumed by an active BlendBatch" }
  - { id: ERR_DUPLICATE_CLIENT_REQUEST, http: 409, condition: "client_request_id already used for this RouteStop" }
  - { id: ERR_MANIFEST_NOT_SUBMITTABLE, http: 409, condition: "Submit requires DRAFT or AMENDED" }
  - { id: ERR_MANIFEST_NOT_IN_TRANSIT, http: 409, condition: "Deliver requires IN_TRANSIT" }
  - { id: ERR_MANIFEST_NOT_DELIVERED, http: 409, condition: "Close/request-amendment requires DELIVERED" }
  - { id: ERR_MANIFEST_NOT_PENDING_AMENDMENT, http: 409, condition: "Approve-amendment requires AMENDMENT_PENDING" }
  - { id: ERR_FACILITY_SUSPENDED, http: 409, condition: "Facility not ACTIVE" }
  - { id: ERR_FACILITY_CAPACITY_EXCEEDED, http: 409, condition: "Facility daily capacity would be exceeded" }
  - { id: ERR_FACILITY_REJECTS_HALOGENATED, http: 409, condition: "Facility does not accept HALOGENATED stream" }
  - { id: ERR_MANIFEST_SCHEDULED_DATE_PAST, http: 422, condition: "Route scheduled_date is in the past at submit time" }
  - { id: ERR_BATCH_NOT_PLANNED, http: 409, condition: "Start-blending requires PLANNED" }
  - { id: ERR_BATCH_NOT_BLENDING, http: 409, condition: "Hold/release requires BLENDING" }
  - { id: ERR_BATCH_NOT_ON_HOLD, http: 409, condition: "Resume requires QUALITY_HOLD" }
  - { id: ERR_BATCH_NOT_RELEASED, http: 409, condition: "Mark-sold requires RELEASED_FOR_SALE" }
  - { id: ERR_BATCH_NOT_CANCELLABLE, http: 409, condition: "Cancel requires PLANNED or BLENDING" }
  - { id: ERR_SPILL_NOT_OPEN, http: 409, condition: "Begin-investigation requires OPEN" }
  - { id: ERR_SPILL_NOT_UNDER_INVESTIGATION, http: 409, condition: "Remediate requires UNDER_INVESTIGATION" }
  - { id: ERR_SPILL_NOT_REMEDIATED, http: 409, condition: "Close requires REMEDIATED" }
  - { id: ERR_SPILL_NO_LIABILITY, http: 409, condition: "Close-with-liability requires liability_cents > 0" }
  - { id: ERR_SPILL_HAS_LIABILITY, http: 409, condition: "Close-no-action requires liability_cents == 0" }

  # --- Fiscal ---
  - { id: ERR_INSUFFICIENT_PREPAID_BALANCE, http: 402, condition: "PREPAY customer balance would go negative at settle" }
  - { id: ERR_OUTSTANDING_BALANCE, http: 402, condition: "Operation requires outstanding_charge_cents == 0" }
  - { id: ERR_UNRETURNED_PREPAID_BALANCE, http: 402, condition: "Terminate requires prepaid_balance_cents == 0" }

  # --- Pricing ---
  - { id: ERR_PRICE_NOT_PUBLISHED, http: 422, condition: "No market price with effective_date <= scheduled_date for (zone, kind)" }

  # --- OCC ---
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_<parent>_version does not match parent's current version" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: RoutePlanner
    description: "Owns customer lifecycle, route planning, manifest drafting, blend batch planning"
    identity: opaque
    exclusive_operations:
      - "POST /recycle-routes/customers* (create, activate, suspend, reinstate, terminate)"
      - "POST /recycle-routes/tank-sites* (create, activate, deactivate)"
      - "POST /recycle-routes/drivers* (register, suspend)"
      - "POST /recycle-routes/routes* (create, dispatch, complete, cancel)"
      - "POST /recycle-routes/routes/{id}/route-stops (create stop)"
      - "POST /recycle-routes/route-stops/{id}/cancel-by-customer"
      - "POST /recycle-routes/manifests* (create, submit, request-amendment)"
      - "POST /recycle-routes/blend-batches* (create, start-blending, cancel)"
      - "POST /recycle-routes/tanks/{id}/record-intake"
      - "POST /recycle-routes/_clock/set_current_utc"
    shared_operations:
      - "GET on all resources"

  - name: Driver
    description: "Executes the route — arrives, screens intake, pumps, logs spills. Entity-backed: X-User-ID equals Driver.id."
    identity: "entity_backed:Driver"
    exclusive_operations:
      - "POST /recycle-routes/route-stops/{id}/arrive"
      - "POST /recycle-routes/route-stops/{id}/begin-screening"
      - "POST /recycle-routes/route-stops/{id}/skip-below-minimum"
      - "POST /recycle-routes/route-stops/{id}/pickup-tickets"
      - "POST /recycle-routes/manifests/{id}/depart"
      - "POST /recycle-routes/manifests/{id}/deliver"
      - "POST /recycle-routes/spill-incidents (Driver or EHSOfficer)"
      - "POST /recycle-routes/tanks/{id}/record-intake"
    shared_operations:
      - "GET on routes, route-stops, tanks, tank-sites, pickup-tickets, sample-screenings, manifests, market-prices"

  - name: LabTech
    description: "Records sample screenings; controls blend batch quality. Segregated from Driver."
    identity: opaque
    exclusive_operations:
      - "POST /recycle-routes/route-stops/{id}/sample-screenings"
      - "POST /recycle-routes/blend-batches/{id}/hold"
      - "POST /recycle-routes/blend-batches/{id}/resume"
      - "POST /recycle-routes/blend-batches/{id}/release"
    shared_operations:
      - "GET on route-stops, sample-screenings, blend-batches"

  - name: SettlementClerk
    description: "Settles pickup tickets; manages customer balance top-ups; marks batches sold. Segregated from RoutePlanner on settle."
    identity: opaque
    exclusive_operations:
      - "POST /recycle-routes/pickup-tickets/{id}/settle"
      - "POST /recycle-routes/pickup-tickets/{id}/dispute"
      - "POST /recycle-routes/pickup-tickets/{id}/adjust"
      - "POST /recycle-routes/customers/{id}/top-up"
      - "POST /recycle-routes/blend-batches/{id}/mark-sold"
    shared_operations:
      - "GET on customers, pickup-tickets, blend-batches, routes, manifests, market-prices"

  - name: EHSOfficer
    description: "Environmental Health & Safety — spill lifecycle, quarantine clearing, site certification."
    identity: opaque
    exclusive_operations:
      - "POST /recycle-routes/spill-incidents* (create-with-driver, begin-investigation, remediate, close)"
      - "POST /recycle-routes/tanks/{id}/clear-quarantine"
      - "POST /recycle-routes/tank-sites/{id}/certify-clean"
    shared_operations:
      - "GET on sites, tanks, routes, manifests, spills"

  - name: Regulator
    description: "State/federal regulator — registers TSDFs, closes manifests, approves amendments, publishes market prices."
    identity: opaque
    exclusive_operations:
      - "POST /recycle-routes/disposal-facilities*"
      - "POST /recycle-routes/manifests/{id}/close"
      - "POST /recycle-routes/manifests/{id}/approve-amendment"
      - "POST /recycle-routes/manifests/{id}/facility-reject"
      - "POST /recycle-routes/market-prices"
    shared_operations:
      - "GET on customers, routes, manifests, spills, facilities, prices"

  - name: TankInstaller
    description: "Installs and decommissions tanks."
    identity: opaque
