              as: TroopLeader
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_FORMS_INCOMPLETE"   # priority 10 beats priority 12 double-booked

  # ------------------------------------------------------------------ Rule 6
  - rule_id: boundary_precision_check
    instances:
      - name: inventory_exact_available_units_boundary
        grounds:
          - validations[priority=14]
          - calculations.fundraiser_troop_commission
          - entities.Fundraiser.fields.available_units
        distinguishing_aspect: |
          On POST /fundraiser-orders an order of EXACTLY available_units succeeds while
          available_units+1 fails with ERR_INSUFFICIENT_INVENTORY (>= boundary on the
          inventory metric, reached through the orders endpoint).
        test_recipe:
          setup:
            - "LIVE fundraiser total_inventory_units=100, available_units=100, unit_price_cents=500."
          setup_api_calls:
            - call: "POST /councils"
              payload: { name: "Inv Council", charter_fee_cents: 30000, youth_dues_cents: 12000, adult_dues_cents: 4500, program_year: 2026 }
              as: CouncilRegistrar
              captures: { council_id: $.data.id }
            - call: "POST /councils/${council_id}/troops"
              payload: { unit_number: "U-1101", program_type: "SCOUTS" }
              as: CouncilRegistrar
              captures: { troop_id: $.data.id }
            - call: "POST /troops/${troop_id}/members"
              payload: { member_type: "YOUTH", full_name: "Inv Seller", birthdate: "2013-03-03" }
              as: TroopLeader
              captures: { seller_id: $.data.id }
            - call: "POST /councils/${council_id}/fundraisers"
              payload: { product: "COOKIES", unit_price_cents: 500, unit_cost_cents: 200, total_inventory_units: 100 }
              as: CouncilRegistrar
              captures: { fr_id: $.data.id }
            - call: "POST /fundraisers/${fr_id}/go-live"
              payload: {}
              as: CouncilRegistrar
              captures: { fr_v2: $.data.version }
          trigger:
            - call: "POST /fundraiser-orders"
              payload: { fundraiser_id: "${fr_id}", troop_id: "${troop_id}", seller_member_id: "${seller_id}", units: 100, expected_fundraiser_version: "${fr_v2}" }
              as: TroopLeader
              captures: { ok_order: $.data.id, fr_v3: $.data.version }
            - call: "POST /fundraiser-orders"
              payload: { fundraiser_id: "${fr_id}", troop_id: "${troop_id}", seller_member_id: "${seller_id}", units: 1, expected_fundraiser_version: "${fr_v3}" }
              as: TroopLeader
              captures: { over_err: $.data.error_id }
          assert:
            - "FundraiserOrder.${ok_order}.units == 100"          # exactly available -> allowed
            - "FundraiserOrder.${ok_order}.troop_commission_cents == 7500"   # 100u@500 all tier1 *.15
            - "over_err == ERR_INSUFFICIENT_INVENTORY"            # available now 0, +1 rejected

      - name: dues_full_months_threshold_boundary
        grounds:
          - calculations.dues_proration
          - validations[priority=17]
          - entities.DuesInvoice.fields.amount_cents
        distinguishing_aspect: |
          On POST /members/{id}/dues-invoices, issued_on in a month with exactly 9
          months_remaining (April) charges FULL dues (>= FULL_DUES_MONTHS), while May
          (8 months_remaining) prorates — a >= threshold boundary on the month metric,
          a different metric and endpoint than the inventory boundary above.
        test_recipe:
          setup:
            - "Council youth_dues_cents=12000; two PENDING youths."
          setup_api_calls:
            - call: "POST /councils"
              payload: { name: "Dues Council", charter_fee_cents: 30000, youth_dues_cents: 12000, adult_dues_cents: 4500, program_year: 2026 }
              as: CouncilRegistrar
              captures: { council_id: $.data.id }
            - call: "POST /councils/${council_id}/troops"
              payload: { unit_number: "U-1201", program_type: "SCOUTS" }
              as: CouncilRegistrar
              captures: { troop_id: $.data.id }
            - call: "POST /troops/${troop_id}/members"
              payload: { member_type: "YOUTH", full_name: "Apr Youth", birthdate: "2013-03-03" }
              as: TroopLeader
              captures: { y_apr: $.data.id }
            - call: "POST /troops/${troop_id}/members"
              payload: { member_type: "YOUTH", full_name: "May Youth", birthdate: "2013-03-03" }
              as: TroopLeader
              captures: { y_may: $.data.id }
          trigger:
            - call: "POST /members/${y_apr}/dues-invoices"
              payload: { issued_on: "2026-04-15" }
              as: TroopLeader
              captures: { inv_apr: $.data.id }
            - call: "POST /members/${y_may}/dues-invoices"
              payload: { issued_on: "2026-05-15" }
              as: TroopLeader
              captures: { inv_may: $.data.id }
          assert:
            # April months_remaining = 12-(4-1) = 9 >= 9 => full 12000
            - "DuesInvoice.${inv_apr}.amount_cents == 12000"
            # May months_remaining = 12-(5-1) = 8 < 9 => 12000*8/12 = 8000
            - "DuesInvoice.${inv_may}.amount_cents == 8000"

  # ------------------------------------------------------------------ Rule 7
  - rule_id: cross_entity_state_dependency
    instances:
      - name: advancement_approve_requires_member_registered
        grounds:
          - state_machines.Advancement.SUBMITTED_to_APPROVED
          - validations[priority=8]
          - entities.Member.fields.registration_status
        distinguishing_aspect: |
          Advancement's SUBMITTED->APPROVED transition is gated by a DIFFERENT entity's
          state: Member.registration_status must be REGISTERED. Suspending the member
          first makes the otherwise-valid approve fail with ERR_MEMBER_NOT_REGISTERED.
          Entity pair: Advancement -> Member.
        test_recipe:
          setup:
            - "A youth REGISTERED, advancement fully signed and SUBMITTED by leader-bob, then the member is SUSPENDED."
          setup_api_calls:
            - call: "POST /councils"
              payload: { name: "X7 Council", charter_fee_cents: 30000, youth_dues_cents: 12000, adult_dues_cents: 4500, program_year: 2026 }
              as: CouncilRegistrar
              captures: { council_id: $.data.id }
            - call: "POST /councils/${council_id}/troops"
              payload: { unit_number: "U-1301", program_type: "SCOUTS" }
              as: CouncilRegistrar
              captures: { troop_id: $.data.id }
            - call: "POST /troops/${troop_id}/members"
              payload: { member_type: "YOUTH", full_name: "X7 Youth", birthdate: "2013-03-03" }
              as: TroopLeader
              captures: { youth_id: $.data.id }
            - call: "POST /members/${youth_id}/dues-invoices"
              payload: { issued_on: "2026-01-01" }
              as: CouncilRegistrar
              captures: { inv: $.data.id }
            - call: "POST /payments"
              payload: { invoice_id: "${inv}", member_id: "${youth_id}", amount_cents: 12000 }
              as: CouncilRegistrar
            - call: "POST /members/${youth_id}/advancements"
              payload: { kind: "RANK", target: "TENDERFOOT", requirements_total: 1 }
              as: TroopLeader
              captures: { adv_id: $.data.id }
            - call: "POST /advancements/${adv_id}/sign-requirement"
              payload: {}
              as: TroopLeader
            - call: "POST /advancements/${adv_id}/submit"
              payload: {}
              as: TroopLeader
              as_user_id: "leader-bob"
            - call: "POST /members/${youth_id}/suspend"
              payload: {}
              as: TroopLeader
          trigger:
            - call: "POST /advancements/${adv_id}/approve"
              payload: {}
              as: CouncilRegistrar
              as_user_id: "registrar-amy"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_MEMBER_NOT_REGISTERED"
            - "Advancement.${adv_id}.status == SUBMITTED"

      - name: registration_confirm_requires_event_open
        grounds:
          - state_machines.EventRegistration.HOLD_to_CONFIRMED
          - entities.Event.fields.status
          - validations[priority=5]
        distinguishing_aspect: |
          EventRegistration's HOLD->CONFIRMED transition depends on a DIFFERENT entity's
          state: Event.status must be OPEN. Locking the event makes an otherwise-ready
          registration fail. Entity pair: EventRegistration -> Event (distinct from the
          Advancement->Member pair above).
        test_recipe:
          setup:
            - "REGISTERED youth with a HOLD registration, permission SIGNED, on an event that is then LOCKED."
          setup_api_calls:
            - call: "POST /councils"
              payload: { name: "X7b Council", charter_fee_cents: 30000, youth_dues_cents: 12000, adult_dues_cents: 4500, program_year: 2026 }
              as: CouncilRegistrar
              captures: { council_id: $.data.id }
            - call: "POST /councils/${council_id}/troops"
              payload: { unit_number: "U-1401", program_type: "SCOUTS" }
              as: CouncilRegistrar
              captures: { troop_id: $.data.id }
            - call: "POST /troops/${troop_id}/members"
              payload: { member_type: "YOUTH", full_name: "X7b Youth", birthdate: "2013-03-03" }
              as: TroopLeader
              captures: { youth_id: $.data.id }
            - call: "POST /members/${youth_id}/dues-invoices"
              payload: { issued_on: "2026-01-01" }
              as: CouncilRegistrar
              captures: { inv: $.data.id }
            - call: "POST /payments"
              payload: { invoice_id: "${inv}", member_id: "${youth_id}", amount_cents: 12000 }
              as: CouncilRegistrar
            - call: "POST /troops/${troop_id}/events"
              payload: { title: "Lock Event", starts_at: "2026-08-01T09:00:00Z", ends_at: "2026-08-01T17:00:00Z", capacity: 5, requires_health_form: false }
              as: TroopLeader
              captures: { event_id: $.data.id }
            - call: "POST /events/${event_id}/registrations"
              payload: { member_id: "${youth_id}" }
              as: TroopLeader
              captures: { reg_id: $.data.id }
            - call: "POST /event-registrations/${reg_id}/sign-permission"
              payload: {}
              as: TroopLeader
            - call: "POST /events/${event_id}/lock"
              payload: {}
              as: TroopLeader
          trigger:
            - call: "POST /event-registrations/${reg_id}/confirm"
              payload: {}
              as: TroopLeader
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_STATE"   # Event LOCKED -> confirm not permitted
            - "EventRegistration.${reg_id}.status == HOLD"

  # ------------------------------------------------------------------ Rule 8
  - rule_id: resource_temporal_overlap
    instances:
      - name: booth_half_open_overlap_same_location
        grounds:
          - validations[priority=11]
          - entities.BoothReservation.fields.location_code
          - state_machines.FundraiserOrder.PLACED_to_CANCELLED
        distinguishing_aspect: |
          Booth slots use HALF-OPEN [starts_at, ends_at) per location_code: a slot
          starting exactly when another ends (gap=0, touching) is ALLOWED, but a slot
          that overlaps the interior is rejected with ERR_BOOTH_CONFLICT. Resource:
          BoothReservation per location.
        test_recipe:
          setup:
            - "LIVE fundraiser; a BOOKED booth at LOC-A from 10:00 to 12:00."
          setup_api_calls:
            - call: "POST /councils"
              payload: { name: "B8 Council", charter_fee_cents: 30000, youth_dues_cents: 12000, adult_dues_cents: 4500, program_year: 2026 }
              as: CouncilRegistrar
              captures: { council_id: $.data.id }
            - call: "POST /councils/${council_id}/troops"
              payload: { unit_number: "U-1501", program_type: "SCOUTS" }
              as: CouncilRegistrar
              captures: { troop_id: $.data.id }
            - call: "POST /councils/${council_id}/fundraisers"
              payload: { product: "COOKIES", unit_price_cents: 500, unit_cost_cents: 200, total_inventory_units: 1000 }
              as: CouncilRegistrar
              captures: { fr_id: $.data.id }
            - call: "POST /fundraisers/${fr_id}/go-live"
              payload: {}
              as: CouncilRegistrar
            - call: "POST /fundraisers/${fr_id}/booth-reservations"
              payload: { troop_id: "${troop_id}", location_code: "LOC-A", starts_at: "2026-05-01T10:00:00Z", ends_at: "2026-05-01T12:00:00Z" }
              as: TroopLeader
              captures: { booth1: $.data.id }
          trigger:
            - call: "POST /fundraisers/${fr_id}/booth-reservations"
              payload: { troop_id: "${troop_id}", location_code: "LOC-A", starts_at: "2026-05-01T12:00:00Z", ends_at: "2026-05-01T14:00:00Z" }
              as: TroopLeader
              captures: { booth_touch: $.data.id }
            - call: "POST /fundraisers/${fr_id}/booth-reservations"
              payload: { troop_id: "${troop_id}", location_code: "LOC-A", starts_at: "2026-05-01T11:00:00Z", ends_at: "2026-05-01T13:00:00Z" }
              as: TroopLeader
              captures: { conflict_err: $.data.error_id }
          assert:
            - "BoothReservation.${booth_touch}.status == BOOKED"   # touching at 12:00 allowed (half-open)
            - "conflict_err == ERR_BOOTH_CONFLICT"                 # 11:00-13:00 overlaps interior

      - name: member_double_book_closed_interval_touching_rejected
        grounds:
          - validations[priority=12]
          - state_machines.EventRegistration.HOLD_to_CONFIRMED
          - entities.Event.fields.starts_at
        distinguishing_aspect: |
          Member event double-booking uses CLOSED, buffer-inclusive [starts_at,
          ends_at] semantics: a second CONFIRMED registration on an event that merely
          TOUCHES (gap=0) the member's existing confirmed event is REJECTED with
          ERR_MEMBER_DOUBLE_BOOKED — opposite adjacency rule to the half-open booth
          intervals, on a different resource (Member across Events).
        test_recipe:
          setup:
            - "REGISTERED youth CONFIRMED on event A (09:00-12:00 on 2026-09-01)."
            - "Event B (12:00-15:00 same day, touching) with a HOLD registration, permission SIGNED, capacity 5, no health form."
          setup_api_calls:
            - call: "POST /councils"
              payload: { name: "Db8 Council", charter_fee_cents: 30000, youth_dues_cents: 12000, adult_dues_cents: 4500, program_year: 2026 }
              as: CouncilRegistrar
              captures: { council_id: $.data.id }
            - call: "POST /councils/${council_id}/troops"
              payload: { unit_number: "U-1601", program_type: "SCOUTS" }
              as: CouncilRegistrar
              captures: { troop_id: $.data.id }
            - call: "POST /troops/${troop_id}/members"
              payload: { member_type: "YOUTH", full_name: "Db8 Youth", birthdate: "2013-03-03" }
              as: TroopLeader
              captures: { youth_id: $.data.id }
            - call: "POST /members/${youth_id}/dues-invoices"
              payload: { issued_on: "2026-01-01" }
              as: CouncilRegistrar
              captures: { inv: $.data.id }
            - call: "POST /payments"
              payload: { invoice_id: "${inv}", member_id: "${youth_id}", amount_cents: 12000 }
              as: CouncilRegistrar
            - call: "POST /troops/${troop_id}/events"
              payload: { title: "A", starts_at: "2026-09-01T09:00:00Z", ends_at: "2026-09-01T12:00:00Z", capacity: 5, requires_health_form: false }
              as: TroopLeader
              captures: { ev_a: $.data.id }
            - call: "POST /events/${ev_a}/registrations"
              payload: { member_id: "${youth_id}" }
              as: TroopLeader
